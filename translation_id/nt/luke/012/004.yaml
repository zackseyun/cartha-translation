id: LUK.12.4
reference: Luke 12:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: id
  text: 'Namun Aku berkata kepada kalian, sahabat-sahabat-Ku: jangan takut kepada mereka yang membunuh tubuh dan sesudah itu tidak dapat berbuat apa-apa lagi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Namun Aku berkata
  rationale: δέ menandai peralihan dengan nuansa kontras ringan. “Namun” mempertahankan hubungan wacana itu tanpa menjadikannya pertentangan yang terlalu kuat.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: kepada kalian, sahabat-sahabat-Ku
  rationale: 'Frasa datif ini bersifat aposisional: para pendengar disapa sebagai sahabat Yesus. “Kalian” membedakan bentuk jamak ὑμῖν, sedangkan sapaan sesudah koma mempertahankan kehangatan ungkapan tersebut.'
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: jangan takut kepada mereka yang membunuh
  rationale: Bentuk dengan μή menyampaikan larangan, dan ἀπό bersama φοβέομαι menunjukkan pihak yang menjadi objek atau sumber ketakutan. Partisipel kini dipahami secara umum sebagai orang-orang yang membunuh.
- source_word: τὸ σῶμα
  choice: tubuh
  rationale: σῶμα menunjuk pada tubuh jasmani. Bahasa Indonesia tidak memerlukan kata sandang tertentu di sini.
- source_word: καὶ μετὰ ταῦτα
  choice: dan sesudah itu
  rationale: Ungkapan ini bersifat temporal dan menunjuk pada keadaan setelah pembunuhan tubuh.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: tidak dapat berbuat apa-apa lagi
  rationale: Ungkapan tersebut menyatakan keterbatasan para pembunuh setelah kematian tubuh. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna bahwa tidak ada tindakan lebih lanjut yang mampu mereka lakukan.
theological_decisions:
- issue: Batas kuasa manusia sesudah kematian tubuh
  choice: Ayat ini hanya menyatakan bahwa manusia dapat membunuh tubuh, tetapi sesudah itu tidak dapat berbuat apa-apa lagi.
  alternative: Menambahkan secara eksplisit bahwa mereka tidak dapat membunuh jiwa.
  rationale: Teks Yunani ayat ini tidak menyebut jiwa. Kontras teologis yang dikembangkan dalam ayat berikutnya tidak dimasukkan ke dalam ayat ini, sehingga ketegangan dan cakupan pernyataan aslinya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa ὑμῖν berbentuk jamak. Huruf kapital pada “Aku” dan “-Ku” mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
