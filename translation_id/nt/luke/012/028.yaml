  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: id
  text: Namun, jika Allah mendandani rumput[a] di ladang sedemikian rupa—yang hari ini ada dan besok dilemparkan ke dalam tungku[b]—betapa lebih lagi Ia akan mendandani kalian, hai kalian yang kurang percaya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumbuh-tumbuhan” atau “rerumputan.”
    reason: lexical_alternative
  - marker: b
    text: Tungku yang dimaksud ialah tungku untuk memanggang roti; rumput ladang yang sudah kering dapat digunakan sebagai bahan bakar.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: rumput
  rationale: χόρτος lazim berarti rumput atau tumbuh-tumbuhan kecil. Dalam konteks tumbuhan ladang yang singkat umurnya dan kemudian dipakai sebagai bahan bakar, “rumput” adalah padanan Indonesia yang paling alami.
- source_word: ἐν ἀγρῷ
  choice: di ladang
  rationale: Frasa ini menunjukkan tempat rumput itu tumbuh. “Di ladang” alami dalam bahasa Indonesia dan mempertahankan makna generiknya.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: yang hari ini ada dan besok dilemparkan
  rationale: Konstruksi partisipial Yunani dibuat menjadi klausa relatif agar jelas dan wajar dalam bahasa Indonesia, sambil mempertahankan kontras waktu yang menekankan kefanaan rumput.
- source_word: κλίβανον
  choice: tungku
  rationale: κλίβανος menunjuk pada tungku atau oven pembakaran roti, sering kali dari tanah liat. “Tungku” lebih sesuai dengan latar kuno dan tidak menimbulkan bayangan oven modern.
- source_word: ἀμφιέζει
  choice: mendandani
  rationale: Kata ini berarti mengenakan pakaian atau mendandani. “Mendandani” mempertahankan gambaran bahwa keindahan tumbuhan adalah seperti pakaian, serta berlaku alami bagi rumput maupun manusia dalam perbandingan ini.
- source_word: πόσῳ μᾶλλον
  choice: betapa lebih lagi
  rationale: Padanan ini menyampaikan argumen dari yang lebih kecil kepada yang lebih besar dan mempertahankan bentuk retoris Yunani.
- source_word: ὀλιγόπιστοι
  choice: hai orang-orang yang kurang percaya
  rationale: Sapaan langsung ini mengandung teguran atas kurangnya kepercayaan kepada Allah. Pilihan ini mempertahankan daya tegurnya tanpa mengubahnya menjadi pernyataan teknis mengenai iman yang menyelamatkan.
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: δέ melanjutkan pembahasan sekaligus memberi sedikit peralihan atau kontras. “Namun, jika” menyampaikan hubungan argumentatif itu secara alami.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjeknya secara eksplisit adalah ὁ θεός; “Allah” merupakan padanan baku dan langsung dalam bahasa Indonesia.
- source_word: οὕτως
  choice: sedemikian rupa
  rationale: οὕτως menerangkan cara Allah mendandani rumput. “Sedemikian rupa” alami dan memberi tekanan yang diperlukan untuk perbandingan berikutnya.
theological_decisions:
- issue: Daya teguran ὀλιγόπιστοι dalam sapaan Yesus
  choice: 'Sapaan langsung dengan teguran yang nyata tetapi tidak diperkeras: “hai orang-orang yang kurang percaya”'
  alternative: “hai kalian yang sedikit imannya” atau teguran yang lebih keras tentang ketiadaan iman
  rationale: Istilah itu mengecam kurangnya kepercayaan kepada pemeliharaan Allah, tetapi tidak dengan sendirinya menyatakan bahwa para murid sama sekali tidak beriman atau telah murtad. Terjemahan mempertahankan ketegangan pastoral dan teologis teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai karena sapaan Yunani berbentuk jamak dan konteksnya ditujukan kepada para murid. Tanda pisah membantu memperjelas klausa sisipan tentang singkatnya umur rumput. Semua penanda catatan kaki dicantumkan dalam teks utama.
