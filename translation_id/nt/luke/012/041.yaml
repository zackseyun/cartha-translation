id: LUK.12.41
reference: Luke 12:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: id
  text: Lalu Petrus berkata, “Tuhan, apakah Engkau menyampaikan perumpamaan ini kepada kami atau juga kepada semua orang[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada semua.” Kata Yunani πάντας berbentuk maskulin jamak, tetapi di sini dipakai secara umum untuk khalayak yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: berkata
  rationale: Bentuk aoris dari λέγω secara langsung berarti ‘berkata’. Isi ucapannya sudah ditandai sebagai pertanyaan sehingga tidak perlu mengubah verba pelapor menjadi ‘bertanya’.
- source_word: δὲ
  choice: Lalu
  rationale: δέ melanjutkan alur percakapan; ‘lalu’ merupakan penghubung naratif yang wajar dalam bahasa Indonesia modern.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan κύριε kepada Yesus mempertahankan makna penghormatan sekaligus kemungkinan gaung kristologisnya tanpa mempersempitnya menjadi sekadar ‘Guru’ atau ‘Tuan’.
- source_word: πρὸς ἡμᾶς
  choice: kepada kami
  rationale: πρός dengan akusatif sesudah verba berbicara menunjukkan pihak yang menjadi sasaran perkataan. ‘Kami’ tepat karena tidak mencakup Yesus yang sedang disapa.
- source_word: τὴν παραβολὴν ταύτην
  choice: perumpamaan ini
  rationale: ‘Perumpamaan’ adalah padanan lazim dan tepat bagi παραβολή dalam pengajaran figuratif Yesus.
- source_word: λέγεις
  choice: Engkau menyampaikan
  rationale: Dalam konteks menyampaikan sebuah perumpamaan kepada pendengar, ‘menyampaikan’ lebih alami daripada ‘mengatakan’ dalam bahasa Indonesia dan tetap mempertahankan tindakan berbicara dari λέγεις.
- source_word: ἢ καὶ
  choice: atau juga
  rationale: Padanan ini mempertahankan baik unsur pilihan dari ἢ maupun unsur penambahan dari καὶ.
- source_word: πρὸς πάντας
  choice: kepada semua orang
  rationale: πάντας berbentuk maskulin jamak, tetapi dipakai secara generik untuk khalayak yang lebih luas; ‘semua orang’ menyatakan cakupan itu secara alami dan akurat.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: ‘Tuhan’ mempertahankan penghormatan dalam sapaan Petrus serta kemungkinan makna kristologis, tanpa memaksakan penjelasan teologis yang tidak dinyatakan dalam ayat.
- issue: Cakupan πάντας yang berbentuk maskulin jamak
  choice: semua orang
  alternative: semua
  rationale: Dalam konteks ini bentuk maskulin tersebut bersifat generik dan mengontraskan ‘kami’ dengan khalayak yang lebih luas, bukan membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami tanpa menambahkan ‘saja’, sebab unsur pembatas itu tidak dinyatakan secara eksplisit dalam bahasa Yunani. Pronomina sapaan ‘Engkau’ dipakai sesuai kelaziman bahasa Alkitab Indonesia ketika berbicara langsung kepada Yesus.
