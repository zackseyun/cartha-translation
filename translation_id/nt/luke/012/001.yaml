id: LUK.12.1
reference: Luke 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: id
  text: Sementara itu,[a] ketika beribu-ribu orang telah berkumpul, sampai-sampai mereka saling menginjak, Yesus mulai berbicara pertama-tama kepada murid-murid-Nya, “Waspadalah terhadap ragi orang Farisi, yaitu kemunafikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunaninya juga dapat diterjemahkan “Dalam keadaan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Sementara itu
  rationale: Ungkapan ini menghubungkan peristiwa tersebut secara temporal dan situasional dengan konteks sebelumnya; ‘Sementara itu’ alami dalam bahasa Indonesia.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: ketika orang banyak yang jumlahnya beribu-ribu telah berkumpul
  rationale: Bentuk genitif absolut disampaikan sebagai anak kalimat waktu. μυριάδες dapat menunjuk puluhan ribu atau secara umum kerumunan yang amat besar; ‘beribu-ribu’ mempertahankan besarnya jumlah tanpa menetapkan angka pasti.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: hingga mereka saling berdesak-desakan dan menginjak
  rationale: ὥστε dengan infinitif menyatakan akibat. καταπατέω secara harfiah berarti menginjak-injak; penambahan ‘berdesak-desakan’ memperjelas situasi kerumunan dalam bahasa Indonesia tanpa menghilangkan tindakan menginjak.
- source_word: ἤρξατο λέγειν
  choice: mulai berbicara
  rationale: Padanan idiomatis bagi konstruksi inkoatif Yunani dan lebih alami daripada ‘mulai berkata’ ketika memperkenalkan tuturan yang berlanjut.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: pertama-tama kepada murid-murid-Nya
  rationale: 'Mempertahankan kemungkinan bahwa πρῶτον menandai prioritas penerima perkataan: para murid disapa lebih dahulu.'
- source_word: Προσέχετε ἑαυτοῖς ἀπό
  choice: Waspadalah terhadap
  rationale: Ungkapan ini secara alami menyampaikan perhatian demi perlindungan diri yang terkandung dalam προσέχετε ἑαυτοῖς, tanpa menerjemahkan unsur refleksif secara kaku.
- source_word: ζύμη
  choice: ragi
  rationale: ‘Ragi’ mempertahankan metafora sumber dan merupakan istilah modern yang mudah dipahami; dalam konteks ini acuannya langsung dijelaskan sebagai kemunafikan.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: yaitu kemunafikan
  rationale: ἥτις bersifat menjelaskan atau mengidentifikasi; ‘yaitu’ membuat hubungan metaforis itu jelas dan alami.
- source_word: τῶν Φαρισαίων
  choice: orang Farisi
  rationale: Genitif deskriptif atau posesif diterjemahkan secara alami sebagai ‘ragi orang Farisi’.
theological_decisions:
- issue: Daya metaforis ζύμη
  choice: Mempertahankan ‘ragi’ sebagai metafora yang dijelaskan sebagai kemunafikan.
  alternative: Mengganti metafora dengan ‘pengaruh’ atau ‘ajaran’.
  rationale: Teks sendiri mengidentifikasi ragi itu sebagai kemunafikan. Mempertahankan gambarannya menghindari penyempitan makna secara interpretatif.
- issue: Cakupan πρῶτον
  choice: ‘pertama-tama kepada murid-murid-Nya,’ dengan penekanan pada prioritas penerima perkataan.
  alternative: 'Memahami πρῶτον sebagai penanda wacana: ‘pertama-tama, Ia berkata kepada murid-murid-Nya.’'
  rationale: Susunan Yunani memungkinkan kedua nuansa. Terjemahan pilihan mempertahankan prioritas para murid tanpa menyatakan secara tegas rangkaian pidato yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Yesus’ dipakai untuk memperjelas subjek pronominal Yunani dalam pembukaan ayat. Metafora ‘ragi’ dipertahankan, sedangkan ungkapan peringatan dibuat idiomatis.
