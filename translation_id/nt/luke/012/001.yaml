  terminology: “Yesus,” “murid-murid-Nya,” “orang Farisi,” “ragi,” dan “kemunafikan” tepat serta sesuai register Alkitab bahasa Indonesia modern. “Ragi” dengan penjelasan “yaitu kemunafikan” mempertahankan metafora tanpa menafsirkannya secara berlebihan.
