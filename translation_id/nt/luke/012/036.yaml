id: LUK.12.36
reference: Luke 12:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: id
  text: Hendaklah kalian seperti orang-orang yang sedang menantikan tuan mereka pulang dari pesta pernikahan, supaya ketika ia datang dan mengetuk pintu, mereka segera membukakan pintu baginya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοι
  choice: seperti
  rationale: Menyampaikan perbandingan secara alami; unsur imperatif tersirat dari konteks diwujudkan dengan “Hendaklah”.
- source_word: ἀνθρώποις
  choice: orang-orang
  rationale: Padanan umum yang alami dan tidak membatasi rujukan pada laki-laki saja ketika hal itu tidak menjadi pokok teks.
- source_word: τὸν κύριον ἑαυτῶν
  choice: tuan mereka
  rationale: Dalam gambaran rumah tangga ini, κύριος menunjuk kepada tuan yang ditunggu para pelayan; “tuan” menjaga latar perumpamaan tanpa memakai gelar ilahi secara eksplisit.
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: pulang dari pesta pernikahan
  rationale: ἀναλύω di sini berarti kembali atau pulang, sedangkan bentuk jamak γάμοι lazim menunjuk pada perayaan atau pesta pernikahan.
- source_word: κρούσαντος
  choice: mengetuk pintu
  rationale: Objek “pintu” tersirat dalam tindakan mengetuk dan dinyatakan agar wajar dalam bahasa Indonesia.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: mereka segera membukakan pintu baginya
  rationale: Mempertahankan unsur kesegeraan dan penerima tindakan; “pintu” dilengkapi secara idiomatis.
theological_decisions:
- issue: Sebutan κύριος dalam perumpamaan
  choice: tuan mereka
  alternative: Tuhan mereka
  rationale: Arti langsung dalam adegan ialah kepala atau pemilik rumah. Makna kristologis perumpamaan tetap terbuka tanpa mengubah sebutan dalam dunia cerita menjadi gelar ilahi.
- issue: Subjek ἀνθρώποις
  choice: orang-orang
  alternative: laki-laki
  rationale: Kata Yunani ini dapat berarti manusia atau orang secara umum; konteks tidak menuntut penekanan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Hendaklah kalian” mempertahankan seruan langsung kepada pendengar jamak, sementara pengulangan “pintu” membuat tindakan mengetuk dan membukakan terasa alami.
