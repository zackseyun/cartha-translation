revisions:
- from: Namun, orang yang tidak tahu, tetapi melakukan hal-hal yang patut diganjar pukulan, akan dipukul hanya sedikit kali. Dari setiap orang yang kepadanya banyak diberikan, banyak pula akan dituntut; dan dari orang yang kepadanya banyak dipercayakan, lebih banyak lagi akan diminta.[a]
  to: Tetapi, orang yang tidak tahu namun melakukan apa yang layak menerima pukulan akan menerima sedikit pukulan. Dari setiap orang yang kepadanya banyak diberikan, banyak akan dituntut; dan dari orang yang kepadanya mereka mempercayakan banyak, mereka akan meminta lebih banyak lagi.
  rationale: Revisi menghilangkan adversatif ganda, mengganti ungkapan jumlah pukulan dengan bahasa Indonesia yang lebih alami, dan memulihkan verba jamak tak tentu “mereka mempercayakan ... mereka akan meminta” seperti dalam teks Yunani. Tidak ada catatan kaki yang diperlukan karena bentuk jamak tak tentu kini diterjemahkan langsung.
