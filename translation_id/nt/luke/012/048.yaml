    issue: Rangkaian “Namun ... tetapi”
    rationale: Dua penanda pertentangan dalam satu konstruksi membuat kalimat pembuka tidak alami. Bahasa Yunani hanya memerlukan penyampaian hubungan konsesif antara ketidaktahuan dan tindakan yang dilakukan.
  - severity: medium
    issue: “akan dipukul hanya sedikit kali”
    rationale: Frasa ini kaku dan “sedikit kali” tidak seidiomatis objek eksplisit “sedikit pukulan.” Bentuk revisi tetap menerjemahkan δαρήσεται ὀλίγας secara jelas.
  - severity: low
    issue: Pelaku jamak tak tentu di klausa terakhir dihilangkan dalam teks utama
    rationale: Pasif Indonesia dapat menjaga ketaktertentuan pelaku, tetapi teks Yunani secara eksplisit memakai verba jamak tak tentu dua kali. Mempertahankan “mereka” lebih dekat kepada sumber dan tidak perlu lagi dijelaskan dalam catatan kaki.
