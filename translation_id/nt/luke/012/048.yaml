id: LUK.12.48
reference: Luke 12:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: id
  text: Tetapi, orang yang tidak tahu namun melakukan apa yang layak menerima pukulan akan menerima sedikit pukulan. Dari setiap orang yang kepadanya banyak diberikan, banyak akan dituntut; dan dari orang yang kepadanya mereka mempercayakan banyak, mereka akan meminta lebih banyak lagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: orang yang tidak tahu
  rationale: Menerjemahkan partisip substantival secara alami tanpa mengubah ketidaktahuan menjadi ketidakmengertian atau menilai kadar kesalahannya.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: melakukan hal-hal yang patut diganjar pukulan
  rationale: Mempertahankan hubungan antara perbuatan dan hukuman serta citra konkret pukulan.
- source_word: δαρήσεται ὀλίγας
  choice: akan dipukul hanya sedikit kali
  rationale: Menyatakan secara eksplisit makna pasif verba δέρω dan memakai 'sedikit kali' untuk jumlah pukulan, bukan tingkat ringannya.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: Dari setiap orang yang kepadanya banyak diberikan
  rationale: Mencerminkan konstruksi umum tentang pertanggungjawaban dan membentuk paralelisme dengan klausa berikutnya.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: banyak pula akan dituntut
  rationale: Dalam konteks pertanggungjawaban, ζητέω bermakna menuntut atau mengharuskan, bukan sekadar mencari.
- source_word: παρέθεντο
  choice: dipercayakan
  rationale: Bentuk pasif Indonesia mempertahankan makna penyerahan tanggung jawab sekaligus tidak menetapkan subjek jamak tak tentu dalam bahasa Yunani.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: lebih banyak lagi akan diminta
  rationale: Mempertahankan perbedaan leksikal dari ζητηθήσεται dan menyampaikan peningkatan tuntutan tanpa menambahkan subjek tertentu.
theological_decisions:
- issue: Hakikat gambaran hukuman
  choice: Mempertahankan gambaran konkret berupa pukulan dan jumlahnya yang sedikit.
  alternative: Menggeneralisasikannya menjadi 'hukuman ringan' atau mengkhususkannya menjadi cambukan.
  rationale: Teks memakai gambaran perumpamaan tentang hukuman bertingkat menurut pengetahuan dan tanggung jawab; terjemahan tidak boleh melunakkan ataupun memperinci mekanismenya melampaui teks.
- issue: Pelaku dalam klausa terakhir
  choice: Memakai konstruksi pasif Indonesia tanpa menyebut pelaku.
  alternative: Menambahkan 'Allah', 'orang', atau mempertahankan pronomina jamak tak tentu secara kaku.
  rationale: Verba Yunani berbentuk orang ketiga jamak tanpa subjek eksplisit. Pasif Indonesia secara alami menjaga ketaktertentuan itu dan tidak menetapkan identitas pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Diganjar pukulan' mempertahankan citra penghukuman tanpa terdengar arkais; 'hanya sedikit kali' memperjelas bahwa yang sedikit adalah jumlah pukulan. Konstruksi pasif pada bagian akhir alami dalam bahasa Indonesia dan menjaga pelaku yang tidak disebutkan dalam teks Yunani.
