  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: id
  text: Tetapi apabila mereka membawa kamu ke hadapan sinagoge-sinagoge, para penguasa, dan pihak-pihak berwenang,[a] jangan khawatir tentang bagaimana atau apa yang harus kamu katakan dalam pembelaanmu, atau apa yang harus kamu ucapkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “sinagoge-sinagoge, para penguasa, dan pihak-pihak berwenang” menunjuk kepada badan-badan keagamaan dan pemerintahan yang dapat memeriksa para murid.
    reason: cultural_note
  - marker: b
    text: 'Atau: “bagaimana atau apa yang harus kamu katakan untuk membela diri, atau apa yang harus kamu katakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, apabila
  rationale: ὅταν menyatakan keadaan mendatang yang dapat terjadi, sedangkan δέ memberi peralihan ringan dalam alur pembicaraan. 'Namun, apabila' alami dan tidak melebih-lebihkan pertentangan.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: mereka membawa kamu
  rationale: Dalam konteks pemeriksaan, εἰσφέρω berarti membawa seseorang untuk menghadap suatu badan atau pejabat.
- source_word: ἐπὶ τὰς συναγωγὰς
  choice: ke hadapan sinagoge-sinagoge
  rationale: ἐπί dengan akusatif di sini menunjukkan dibawa menghadap pihak yang memeriksa. συναγωγάς dipertahankan secara formal sebagai 'sinagoge-sinagoge', dengan fungsi metonimisnya dijelaskan dalam catatan.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: para penguasa, dan para pejabat yang berwenang
  rationale: ἀρχαί menunjuk kepada pihak yang memerintah, sedangkan ἐξουσίαι kepada orang atau lembaga yang memiliki wewenang. Pilihan ini mempertahankan perbedaan keduanya dalam bahasa Indonesia yang wajar.
- source_word: μὴ μεριμνήσητε
  choice: jangan khawatir
  rationale: Larangan ini menyangkut kecemasan atau kekhawatiran antisipatif; 'jangan khawatir' adalah ungkapan Indonesia modern yang alami.
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: bagaimana atau apa yang harus kamu katakan untuk membela diri
  rationale: πῶς ἢ τί mempertahankan unsur cara dan isi, sedangkan ἀπολογήσησθε memiliki arti forensik memberikan pembelaan. Penambahan 'katakan' membuat susunannya alami tanpa menghilangkan makna hukum.
- source_word: ἢ τί εἴπητε
  choice: ataupun apa yang harus kamu ucapkan
  rationale: Klausa ini dibedakan dari pembelaan sebelumnya dan diterjemahkan secara idiomatis sebagai isi perkataan yang akan disampaikan.
