translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak Yunani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan para murid sebagai kelompok. Pengulangan struktur Yunani dipertahankan sejauh tetap alami.
