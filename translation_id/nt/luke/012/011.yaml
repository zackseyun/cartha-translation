  verdict: revise
  source_fidelity: 'Teks utama pada dasarnya setia: εἰσφέρωσιν dalam konteks hukum diterjemahkan tepat sebagai dibawa menghadap; tiga kelompok yang disebutkan tetap dibedakan; dan ἀπολογήσησθε dipahami dalam arti pembelaan forensik. Namun, “Namun” memberi nuansa pertentangan yang sedikit lebih kuat daripada δέ, dan catatan b menyebut dirinya harfiah tetapi mengubah bentuk subjunktif menjadi bentuk masa depan serta kurang jelas dalam bahasa Indonesia.'
  naturalness: Bahasa teks utama cukup baku dan mudah dipahami. “Pihak-pihak berwenang” lebih alami dan lebih mencakup daripada “para pejabat yang berwenang,” karena ἐξουσίαι dapat menunjuk pada otoritas/badan, bukan hanya pejabat perorangan. Pengulangan “apa ... katakan/ucapkan” mempertahankan pembedaan klausa Yunani tanpa terdengar tidak wajar.
  terminology: “Sinagoge-sinagoge” mempertahankan istilah sumber dengan tepat; catatan budaya dapat menjelaskan fungsi yudisial-metonomisnya. “Para penguasa” dan “pihak-pihak berwenang” menjaga pembedaan antara ἀρχαί dan ἐξουσίαι. “Pembelaanmu” menyampaikan arti forensik ἀπολογήσησθε tanpa menambahkan penafsiran teologis.
  issues:
  - severity: low
    issue: Nuansa δέ dan pilihan “Namun”
    rationale: δέ di sini terutama merupakan penghubung ringan. “Namun” dapat dibaca sebagai kontras yang lebih tegas. “Tetapi” merupakan padanan yang lebih netral sambil tetap mencerminkan penghubung tersebut.
  - severity: medium
    issue: Catatan b tidak sepenuhnya sesuai dengan label “Secara lebih harfiah”
    rationale: Catatan itu memakai “akan” untuk bentuk subjunktif dan menghasilkan susunan “apa kamu akan membela diri” yang tidak jelas dalam bahasa Indonesia. Catatan perlu menyatakan alternatif yang benar-benar membantu pembaca memahami hubungan antara “bagaimana atau apa” dan tindakan membela diri.
