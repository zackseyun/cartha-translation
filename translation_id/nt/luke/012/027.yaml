  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: id
  text: 'Perhatikanlah bunga-bunga bakung[a], bagaimana bunga-bunga itu tumbuh: mereka tidak bekerja keras ataupun memintal. Namun, Aku berkata kepadamu, bahkan Salomo dalam segala kemuliaannya pun tidak berpakaian seperti salah satu dari bunga-bunga itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunga-bunga liar” atau “bunga-bunga”; kata Yunani secara harfiah menyebut “bunga-bunga bakung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Perhatikanlah
  rationale: Bentuk imperatif ini meminta pengamatan yang sungguh-sungguh dan penuh perhatian, bukan sekadar melihat. 'Perhatikanlah' alami dan jelas dalam bahasa Indonesia.
- source_word: τὰ κρίνα
  choice: bunga-bunga bakung
  rationale: κρίνα secara khusus menunjuk pada bunga bakung, meskipun dalam konteks alam dapat mencakup bunga liar sejenis. Bentuk spesifik sumber dipertahankan.
- source_word: πῶς αὐξάνει
  choice: bagaimana mereka tumbuh
  rationale: Walaupun verba Yunani berbentuk tunggal karena kesesuaian gramatikal dengan subjek netral jamak, bahasa Indonesia secara alami memakai rujukan jamak 'mereka' untuk bunga-bunga tersebut.
- source_word: οὐ κοπιᾷ
  choice: mereka tidak bekerja keras
  rationale: κοπιάω menyatakan jerih payah atau kerja melelahkan. 'Bekerja keras' menyampaikan nuansa itu dengan bahasa modern yang wajar.
- source_word: οὐδὲ νήθει
  choice: dan tidak memintal
  rationale: νήθω berarti memintal serat atau benang. 'Memintal' merupakan padanan ringkas dan tepat dalam gambaran pembuatan pakaian.
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: δέ menandai peralihan dengan kontras ringan menuju pernyataan tegas. 'Namun' mempertahankan gerak retoris itu.
- source_word: οὐδὲ Σολομὼν
  choice: bahkan Salomo ... pun tidak
  rationale: Pola 'bahkan ... pun tidak' menyampaikan penyangkalan emfatis οὐδέ secara alami dalam bahasa Indonesia.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: dengan segala kemuliaannya
  rationale: Dalam konteks ini δόξα menunjuk pada kemegahan dan keindahan kerajaan. 'Kemuliaan' mempertahankan jangkauan makna serta resonansi biblis tanpa kehilangan keterbacaan.
- source_word: περιεβάλετο
  choice: berpakaian
  rationale: Bentuk medio-pasif ini secara idiomatis dapat diterjemahkan 'berpakaian' tanpa menetapkan secara berlebihan siapa pelakunya.
- source_word: ὡς ἓν τούτων
  choice: seindah salah satu dari bunga-bunga itu
  rationale: Kata 'seindah' membuat dasar perbandingan pakaian dan penampilan jelas secara alami, sedangkan 'bunga-bunga itu' mempertahankan rujukan demonstratif sumber.
theological_decisions:
- issue: Rujukan gambaran bunga
  choice: Istilah spesifik 'bunga-bunga bakung' dipertahankan.
  alternative: bunga-bunga liar; bunga-bunga
  rationale: Teks Yunani secara khusus memakai κρίνα. Tidak ada alasan teologis untuk menggeneralisasikannya dalam teks utama, tetapi ketidakpastian identifikasi botanis dijelaskan dalam catatan kaki.
- issue: Makna δόξα dalam gambaran Salomo
  choice: kemuliaan
  alternative: kemegahan; semarak
  rationale: '''Kemuliaan'' tetap dapat dipahami sebagai kemegahan kerajaan dalam konteks ini dan mempertahankan resonansi semantis δόξα tanpa membatasi maknanya secara tidak perlu.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Imperatif 'Perhatikanlah' mempertahankan ajakan untuk mengamati dengan saksama. Kata ganti 'Aku' dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus, tanpa menambah penafsiran pada isi ayat.
