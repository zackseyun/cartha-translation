  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: id
  text: Namun, tidak ada sesuatu pun yang tertutup yang tidak akan disingkapkan,[a][c] dan tidak ada sesuatu pun yang tersembunyi[b] yang tidak akan diketahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terselubung”; bahasa Yunani memakai gambaran tentang sesuatu yang telah ditutupi dan kemudian disingkapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dirahasiakan” untuk “tersembunyi.”
    reason: lexical_alternative
  - marker: c
    text: Pernyataan ini dapat merujuk secara luas pada penyingkapan yang akhirnya terjadi, baik pada masa kini maupun pada penghakiman terakhir.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: tidak ada sesuatu pun
  rationale: Menyampaikan cakupan mutlak dari kata ganti negatif netral tunggal secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kelanjutan dengan nuansa pertentangan ringan sesuai konteks, tanpa membuat kontrasnya terlalu tajam.
- source_word: συγκεκαλυμμένον
  choice: yang tertutup
  rationale: Mempertahankan gambaran sesuatu yang telah ditutupi dan kini berada dalam keadaan tertutup, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἀποκαλυφθήσεται
  choice: akan disingkapkan
  rationale: Bentuk pasif futur dipertahankan, dan pilihan ini menjaga kontras gambaran antara yang tertutup dan yang kelak dibuka atau dinyatakan.
- source_word: κρυπτὸν
  choice: yang tersembunyi
  rationale: Padanan alami bagi hal yang tersembunyi; tidak mempersempit makna menjadi rahasia yang sengaja disimpan.
- source_word: γνωσθήσεται
  choice: akan diketahui
  rationale: Mempertahankan bentuk pasif futur dan hasil akhirnya, yakni sesuatu itu kelak diketahui.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: yang tidak akan
  rationale: Menjaga struktur dua klausa relatif paralel dalam bentuk yang alami bagi bahasa Indonesia.
theological_decisions:
- issue: Cakupan dan waktu penyingkapan
  choice: Pernyataan umum bahwa apa yang sekarang tertutup atau tersembunyi pada akhirnya akan disingkapkan dan diketahui.
  alternative: Penyingkapan khusus pada penghakiman terakhir, atau terbongkarnya kemunafikan dalam masa kini.
  rationale: Bentuk-bentuk futur pasif dalam bahasa Yunani menegaskan penyingkapan mendatang tetapi tidak menentukan waktunya; terjemahan tidak membatasi makna hanya pada masa kini atau hanya pada penghakiman terakhir.
translation_notes:
  register: Bahasa Indonesia modern yang baku, jelas, dan bermartabat. Pengulangan “tidak ada sesuatu pun” dipertahankan untuk memperjelas paralelisme Yunani; “disingkapkan” mempertahankan citra penutupan dan pembukaan.
