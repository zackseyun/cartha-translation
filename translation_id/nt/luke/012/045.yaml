id: LUK.12.45
reference: Luke 12:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: id
  text: Namun, jika budak itu[a] berkata dalam hatinya, ‘Tuan saya[b] belum juga datang,’ lalu mulai memukuli para pelayan laki-laki dan perempuan, serta makan, minum, dan bermabuk-mabukan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba”. Kata Yunani δοῦλος menunjuk kepada orang yang berada di bawah kuasa dan kepemilikan seorang tuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tuanku”. Di sini kata Yunani κύριος menunjuk kepada atasan dalam rumah tangga pada perumpamaan ini.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: budak
  rationale: Dalam konteks rumah tangga ini, kata tersebut menunjukkan orang yang berada di bawah kepemilikan dan kuasa tuannya; “budak” mempertahankan kerasnya hubungan sosial itu, sedangkan “pelayan” dapat mengaburkannya.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dalam hatinya
  rationale: Ungkapan Indonesia yang alami dan cukup harfiah untuk pikiran batin yang tidak diucapkan kepada orang lain.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: belum juga datang
  rationale: Ungkapan ini secara alami menyampaikan kedatangan yang terus tertunda tanpa secara tegas menyatakan alasan atau niat sang tuan.
- source_word: κύριός μου
  choice: Tuan saya
  rationale: Dalam dunia cerita, κύριος menunjuk kepada atasan manusia dalam rumah tangga. “Tuan saya” mempertahankan hubungan kuasa tanpa menjadikannya gelar ilahi.
- source_word: ἄρξηται τύπτειν
  choice: mulai memukuli
  rationale: “Mulai” menyampaikan permulaan tindakan, sedangkan “memukuli” menunjukkan kekerasan yang berlangsung atau berulang.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: para pelayan laki-laki dan perempuan
  rationale: Terjemahan ini mempertahankan pasangan maskulin-feminin dalam teks Yunani dan membedakan mereka dari budak yang menjadi pokok kalimat.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: makan, minum, dan bermabuk-mabukan
  rationale: Rangkaian tiga tindakan dipertahankan; “bermabuk-mabukan” merupakan ungkapan Indonesia yang wajar untuk tindakan menjadi mabuk dalam pola hidup memanjakan diri.
theological_decisions:
- issue: κύριος dapat berarti Tuhan atau tuan manusia
  choice: Tuan saya
  alternative: Tuhanku
  rationale: Konteks langsung adalah hubungan dalam rumah tangga pada dunia perumpamaan. Terjemahan ini tidak meniadakan makna perumpamaan, tetapi tidak mencampurkan tokoh cerita dengan gelar ilahi pada tingkat leksikal.
- issue: Status sosial yang dinyatakan oleh δοῦλος
  choice: budak
  alternative: hamba atau pelayan
  rationale: Ayat ini menonjolkan ketimpangan kuasa dan pertanggungjawaban dalam rumah tangga, sehingga “budak” lebih tepat mempertahankan status terikat yang dinyatakan kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Namun” menjaga hubungan pertentangan; “belum juga datang” menyampaikan keluhan batin mengenai penundaan secara alami. Ayat dipertahankan berakhir dengan koma karena kalimat berlanjut ke ayat berikutnya.
