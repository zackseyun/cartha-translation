id: LUK.12.26
reference: Luke 12:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: id
  text: Jadi, jika kalian tidak sanggup melakukan bahkan hal yang paling kecil, mengapa kalian mengkhawatirkan hal-hal lainnya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Jadi, jika
  rationale: Mempertahankan hubungan kesimpulan (οὖν) sekaligus bentuk pengandaian (εἰ) dengan susunan yang alami dalam bahasa Indonesia.
- source_word: οὐδὲ ἐλάχιστον
  choice: bahkan hal yang paling kecil
  rationale: ἐλάχιστον dipakai secara substantival dan eliptis; penambahan 'hal' memperjelas maksud tanpa mempersempit acuannya.
- source_word: δύνασθε
  choice: tidak sanggup melakukan
  rationale: Menyatakan ketidakmampuan atau ketidaksanggupan, sementara 'melakukan' melengkapi ungkapan eliptis secara wajar.
- source_word: τί
  choice: mengapa
  rationale: Dalam pertanyaan retoris ini, τί berfungsi menanyakan alasan, sehingga 'mengapa' merupakan padanan idiomatis yang tepat.
- source_word: περὶ τῶν λοιπῶν
  choice: hal-hal lainnya
  rationale: Mengacu pada perkara-perkara lain atau selebihnya di luar 'hal yang paling kecil' dan mempertahankan cakupan umum frasa Yunani.
- source_word: μεριμνᾶτε
  choice: kalian mengkhawatirkan
  rationale: Mengungkapkan kecemasan atau kekhawatiran yang sedang berlangsung; bentuk 'kalian' menjelaskan bahwa verba Yunani berpersona kedua jamak.
theological_decisions:
- issue: Makna μεριμνάω dalam ajaran Yesus tentang ketergantungan kepada Allah
  choice: mengkhawatirkan
  alternative: mencemaskan; memikirkan dengan cemas
  rationale: '''Mengkhawatirkan'' secara alami menyampaikan kecemasan yang dipersoalkan dalam konteks ini, tanpa mengesankan bahwa segala bentuk perhatian atau perencanaan yang bijaksana dilarang.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipilih untuk menandai orang kedua jamak secara jelas. Pertanyaan retoris dan hubungan logis dengan ayat sebelumnya dipertahankan.
