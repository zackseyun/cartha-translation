id: LUK.12.20
reference: Luke 12:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: id
  text: Namun, Allah berkata kepadanya, “Hai orang bodoh! Malam ini juga nyawamu[a] akan dituntut darimu. Lalu, segala yang telah kausiapkan itu akan menjadi milik siapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupmu” atau “jiwamu.” Kata Yunani ini dapat berarti nyawa, hidup, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Hai orang bodoh!
  rationale: Bentuk vokatif ini merupakan sapaan langsung yang keras. “Hai orang bodoh!” alami dalam bahasa Indonesia dan mempertahankan daya tegurannya.
- source_word: ταύτῃ τῇ νυκτί
  choice: Malam ini juga
  rationale: Ungkapan temporal dengan demonstratif menekankan bahwa peristiwa itu segera terjadi; “malam ini juga” menyampaikan penekanan tersebut secara alami.
- source_word: ψυχήν
  choice: nyawamu
  rationale: Dalam konteks kematian yang segera terjadi, ψυχή menunjuk pada hidup atau nyawa orang itu. “Nyawa” sesuai dengan ungkapan bahwa hal tersebut dituntut darinya, tanpa menetapkan antropologi yang lebih sempit.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: akan dituntut darimu
  rationale: Subjek verba jamak tidak dinyatakan. Bentuk pasif Indonesia mempertahankan pelaku yang tidak disebut dan menghindari penambahan pihak tertentu. “Dituntut” mencerminkan arti meminta atau menagih dengan keharusan; nuansa 'kembali' tidak ditambahkan karena tidak dinyatakan secara eksplisit.
- source_word: ἃ δὲ ἡτοίμασας
  choice: segala yang telah kausiapkan itu
  rationale: Frasa ini menunjuk pada harta benda yang sudah disediakan atau dikumpulkan tokoh tersebut. Pilihan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: τίνι ἔσται
  choice: akan menjadi milik siapa?
  rationale: Datif interogatif dalam konteks ini menanyakan kepemilikan. Ungkapan tersebut jelas, ringkas, dan mempertahankan kekuatan retoris pertanyaannya.
theological_decisions:
- issue: Makna ψυχή dalam konteks kematian
  choice: nyawa
  alternative: hidup; jiwa
  rationale: Ayat ini menyoroti kematian orang itu pada malam tersebut. “Nyawa” paling alami dalam konstruksi ini, sedangkan “jiwa” tetap dicantumkan sebagai kemungkinan leksikal agar keluasan makna istilah Yunani tidak dihapus.
- issue: Pelaku yang menuntut nyawa dalam ἀπαιτοῦσιν
  choice: pasif tanpa menyebut pelaku
  alternative: mereka akan menuntut nyawamu darimu
  rationale: Bahasa Yunani memakai verba orang ketiga jamak tanpa subjek yang disebutkan. Terjemahan pasif mempertahankan ketidakjelasan pelaku dan tidak menafsirkannya sebagai Allah, malaikat, atau pihak lain.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Namun” menandai kontras, “malam ini juga” menyampaikan urgensi, dan bentuk pasif mempertahankan ketidakjelasan subjek verba Yunani.
