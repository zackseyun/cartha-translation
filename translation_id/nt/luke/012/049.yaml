  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: id
  text: Aku datang untuk melemparkan api ke bumi, dan betapa Aku berharap api itu sudah menyala![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “dan apa yang Kukehendaki jika api itu sudah dinyalakan?” Klausa Yunaninya sulit; teks utama mencerminkan kemungkinan makna idiomatisnya sebagai ungkapan kerinduan yang kuat.
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: api
  rationale: Mempertahankan metafora sumber tanpa menafsirkannya secara eksplisit sebagai penghakiman, pemurnian, Roh Kudus, atau perpecahan.
- source_word: ἦλθον
  choice: Aku datang
  rationale: Mencerminkan bentuk aoristus dan menyatakan kedatangan Yesus dalam rangka misi-Nya secara alami dalam bahasa Indonesia.
- source_word: βαλεῖν
  choice: untuk melemparkan
  rationale: Menjaga gambaran tindakan yang kuat dari βάλλω; lebih konkret daripada 'membawa' dan wajar dengan objek 'api'.
- source_word: ἐπὶ τὴν γῆν
  choice: ke bumi
  rationale: Dengan verba gerak 'melemparkan', 'ke bumi' menyampaikan arah secara alami; γῆ dipahami dalam cakupan luas sebagai bumi, bukan tanah atau negeri tertentu.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: dan betapa Aku berharap api itu sudah menyala!
  rationale: Klausa Yunani ini sulit. Terjemahan utama menyampaikan kemungkinan makna idiomatisnya sebagai seruan kerinduan yang kuat, sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa penyalaan itu diharapkan telah terjadi.
- source_word: ἀνήφθη
  choice: menyala
  rationale: Mengungkapkan pasif ἀνάπτω secara idiomatis dalam bahasa Indonesia; api yang 'sudah menyala' secara semantis berarti telah dinyalakan tanpa menghasilkan bentuk pasif yang kaku.
theological_decisions:
- issue: Makna 'api' dalam perkataan Yesus
  choice: Mempertahankan metafora sebagai 'api' tanpa menentukan rujukannya.
  alternative: Menafsirkannya secara langsung sebagai penghakiman, pemurnian, Roh Kudus, atau krisis dan perpecahan yang ditimbulkan oleh misi Yesus.
  rationale: Ayat ini tidak mendefinisikan metafora tersebut. Konteks memberi nuansa konflik dan krisis, tetapi terjemahan perlu mempertahankan keluasan serta ketegangan teologis gambaran aslinya.
- issue: Daya ungkap klausa sulit τί θέλω εἰ ἤδη ἀνήφθη
  choice: 'Menerjemahkannya sebagai seruan kerinduan: ''betapa Aku berharap api itu sudah menyala!'''
  alternative: 'Pertanyaan yang sangat harfiah: ''apa yang Kukehendaki jika api itu sudah dinyalakan?'''
  rationale: Susunan harfiahnya sulit dan maknanya tidak pasti. Pembacaan sebagai seruan keinginan kuat paling koheren dalam konteks dan alami dalam bahasa Indonesia, sedangkan ambiguitas bentuk Yunani tetap didokumentasikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi 'Aku' mengikuti rujukan kepada Yesus. Pengulangan 'api itu' pada klausa kedua memperjelas rujukan dan terdengar lebih alami daripada subjek tersirat.
