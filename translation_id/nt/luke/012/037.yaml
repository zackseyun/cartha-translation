  to: Berbahagialah hamba-hamba yang didapati tuannya[a] tetap berjaga-jaga ketika ia datang. Sesungguhnya Aku berkata kepadamu, tuan itu akan mengikat pinggangnya[b], menyuruh mereka mengambil tempat untuk makan[c], lalu datang kepada mereka dan melayani mereka.
