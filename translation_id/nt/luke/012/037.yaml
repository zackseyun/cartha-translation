id: LUK.12.37
reference: Luke 12:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: id
  text: Berbahagialah hamba-hamba yang didapati tuannya[a] tetap berjaga-jaga ketika ia datang. Sesungguhnya Aku berkata kepadamu, tuan itu akan mengikat pinggangnya[b], menyuruh mereka mengambil tempat untuk makan[c], lalu datang kepada mereka dan melayani mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan”. Kata Yunani kyrios dapat berarti “tuan” dalam perumpamaan ini dan juga dipakai sebagai gelar “Tuhan”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “mengikat pinggangnya” berarti merapikan dan mengikat pakaiannya agar siap bekerja atau melayani.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “menyuruh mereka berbaring”, yakni mengambil posisi berbaring di sisi meja menurut kebiasaan jamuan pada masa itu.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku dan khidmat untuk pernyataan berkat; lebih sesuai daripada sekadar menyatakan perasaan senang atau keberuntungan.
- source_word: δοῦλοι
  choice: hamba-hamba
  rationale: Menunjukkan kedudukan bawahan yang terikat kepada tuan dalam rumah tangga, tetapi tetap alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: κύριος
  choice: tuan
  rationale: Dalam gambaran rumah tangga pada perumpamaan ini, arti langsungnya ialah pemilik atau kepala rumah. Alternatif 'Tuhan' dicatat karena kata Yunani yang sama juga menjadi gelar keagamaan dan dapat menimbulkan gema teologis.
- source_word: γρηγοροῦντας
  choice: tetap berjaga-jaga
  rationale: Menyampaikan baik keadaan tidak tidur maupun kesiapsiagaan yang dituntut konteks.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Mempertahankan rumusan penegasan yang khidmat dan dekat dengan susunan Yunani sambil tetap wajar dalam bahasa Indonesia.
- source_word: περιζώσεται
  choice: akan bersiap untuk melayani mereka
  rationale: Mengungkapkan fungsi tindakan mengikat pakaian pada pinggang untuk bekerja; gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἀνακλινεῖ αὐτούς
  choice: menyuruh mereka mengambil tempat untuk makan
  rationale: Mengomunikasikan tindakan menempatkan mereka sebagai orang yang akan dijamu tanpa memaksakan postur makan kuno ke dalam teks utama.
- source_word: παρελθὼν
  choice: lalu mendatangi mereka
  rationale: Dalam konteks pelayanan meja, partisip ini menggambarkan tuan bergerak menghampiri mereka untuk melayani.
- source_word: διακονήσει αὐτοῖς
  choice: melayani mereka
  rationale: Menyatakan pelayanan praktis, khususnya pelayanan dalam jamuan, secara langsung dan tidak bernuansa kelembagaan gerejawi.
theological_decisions:
- issue: κύριος dalam perumpamaan dapat berarti tuan dan sekaligus menggemakan gelar Tuhan
  choice: tuan
  alternative: Tuhan
  rationale: Latar langsungnya adalah hubungan hamba dengan tuan rumah, sehingga 'tuan' paling alami. Catatan kaki mempertahankan kemungkinan gema teologis tanpa menetapkannya secara sepihak.
- issue: δοῦλος menunjukkan status ketergantungan yang kuat dalam rumah tangga kuno
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' alami dalam ragam Indonesia yang bermartabat dan tetap menunjukkan relasi penguasaan; ''budak'' dapat lebih tegas menandai status perbudakan, tetapi dalam pemakaian Indonesia juga dapat menimbulkan asosiasi regional atau modern yang mengganggu.'
- issue: Pembalikan peran ketika tuan melayani para hamba
  choice: dipertahankan secara eksplisit
  alternative: diparafrasakan sebagai pemberian jamuan
  rationale: 'Teks sengaja menampilkan ketegangan yang mengejutkan: tuan sendiri bersiap dan melayani. Karena itu subjek dan tindakan pelayanan tidak dilunakkan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Aku' mengikuti ujaran langsung Yesus, sedangkan 'ia' dan 'tuan itu' menjaga alur perumpamaan tetap jelas. Pengulangan 'melayani mereka' dipertahankan karena merupakan puncak pembalikan peran dalam ayat.
