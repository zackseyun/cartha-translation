  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: id
  text: 'Dan Aku berkata kepadamu: setiap orang yang mengakui Aku di hadapan manusia, Anak Manusia juga akan mengakui dia[a] di hadapan para malaikat Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi “mengakui dalam Aku ... mengakui dalam dia.” Dalam konteks ini, ungkapan tersebut menyatakan pengakuan terbuka terhadap seseorang.
    reason: Menjelaskan konstruksi Yunani ἐν + datif yang diterjemahkan secara idiomatis dengan objek langsung dalam bahasa Indonesia.
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Dan Aku berkata kepadamu
  rationale: λέγω menyatakan penegasan langsung, sedangkan δέ menghubungkan perkataan ini dengan konteks sebelumnya tanpa harus menyatakan pertentangan kuat. “Dan” mempertahankan hubungan itu secara wajar.
- source_word: πᾶς ὃς ἂν
  choice: Setiap orang yang
  rationale: Konstruksi ini menyatakan kondisi umum yang tidak tertentu dan mencakup siapa pun yang memenuhi syarat tersebut.
- source_word: ὁμολογήσῃ ... ὁμολογήσει
  choice: mengakui ... akan mengakui
  rationale: ὁμολογέω di sini berarti mengakui secara terbuka. Pemakaian kata yang sama pada kedua bagian mempertahankan hubungan timbal balik dalam teks Yunani.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: Aku ... dia
  rationale: Dengan ὁμολογέω, frasa berpreposisi ini paling wajar dipahami sebagai orang yang menjadi sasaran pengakuan. Bahasa Indonesia alami memakai objek langsung, bukan ungkapan harfiah “mengakui di dalam Aku/dia” yang kabur.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di hadapan manusia
  rationale: ἔμπροσθεν berarti “di hadapan” atau “dalam kehadiran”. ἀνθρώπων di sini menunjuk umat manusia atau orang-orang pada umumnya, sehingga “manusia” menyampaikan cakupan representatifnya secara tepat.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar diri Yesus ini dipertahankan dalam bentuk baku agar gema dan bobot teologisnya tidak diparafrasakan.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: di hadapan malaikat-malaikat Allah
  rationale: Terjemahan langsung ini mempertahankan gambaran pengakuan terbuka di hadapan para makhluk surgawi.
theological_decisions:
- issue: Rumus pengakuan timbal balik dengan ἐν dan datif
  choice: Diterjemahkan secara idiomatis sebagai “mengakui Aku ... mengakui dia”.
  alternative: “mengaku di dalam Aku ... mengaku di dalam dia” atau “mengakui berpihak kepada-Ku ... mengakui berpihak kepadanya”.
  rationale: Terjemahan idiomatis menyampaikan tindakan pengakuan terbuka tanpa menambahkan gagasan seperti kesetiaan kepada suatu pihak yang tidak dinyatakan secara eksplisit. Catatan kaki mempertahankan bentuk Yunani yang tidak biasa.
- issue: Cakupan ἀνθρώπων
  choice: “manusia”
  alternative: “orang-orang” atau “laki-laki”
  rationale: Dalam konteks ini bentuk jamak tersebut bersifat representatif bagi manusia pada umumnya, bukan terbatas pada laki-laki. “Manusia” mempertahankan makna kolektif dan ragam yang khidmat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus. Struktur paralel dan pengulangan “mengakui” dipertahankan untuk menonjolkan timbal balik antara pengakuan manusia dan pengakuan Anak Manusia.
