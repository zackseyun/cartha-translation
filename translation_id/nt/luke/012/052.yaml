  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: id
  text: 'Sebab, mulai sekarang lima orang dalam satu rumah akan terpecah[a]: tiga melawan dua dan dua melawan tiga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam satu rumah tangga.” Kata Yunani yang diterjemahkan “rumah” dapat menunjuk pada bangunannya atau pada keluarga yang tinggal di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: akan
  rationale: Bentuk futurum εἰμί menyatakan keadaan yang akan berlaku. Dalam bahasa Indonesia, unsur futur dinyatakan secara alami dengan “akan” bersama predikat “terpecah,” tanpa perlu menerjemahkan kopula secara tersendiri.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan pernyataan sebelumnya tentang perpecahan.
- source_word: ἀπὸ τοῦ νῦν
  choice: mulai sekarang
  rationale: Ungkapan Indonesia yang alami dan tepat untuk makna waktu yang berlangsung dari saat ini ke depan.
- source_word: πέντε
  choice: lima orang
  rationale: Konteks ayat berikutnya menunjukkan bahwa yang dimaksud ialah lima anggota keluarga; penambahan “orang” membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: dalam satu rumah
  rationale: Mempertahankan bentuk konkret οἶκος sekaligus tetap memungkinkan pengertian rumah tangga atau keluarga; kemungkinan nuansa itu dicatat dalam catatan kaki.
- source_word: διαμεμερισμένοι
  choice: terpecah
  rationale: Partisipel perfek pasif ini menggambarkan keadaan yang timbul akibat perpecahan. “Terpecah” menyampaikan keadaan relasional tersebut secara ringkas dan alami.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: tiga melawan dua
  rationale: ἐπί dengan datif di sini menyatakan pertentangan; “melawan” mempertahankan susunan dan daya adversatif teks.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: dan dua melawan tiga
  rationale: Terjemahan sejajar dengan frasa sebelumnya, sehingga simetri pertentangan dalam bahasa Yunani tetap terlihat.
theological_decisions:
- issue: Apakah οἶκος diterjemahkan secara konkret sebagai “rumah” atau secara interpretatif sebagai “rumah tangga”
  choice: rumah
  alternative: rumah tangga
  rationale: Konteks ayat berikutnya memperjelas bahwa yang dimaksud adalah lingkungan keluarga. Namun, “rumah” mempertahankan keluasan makna istilah Yunani, sedangkan alternatif “rumah tangga” dicatat agar nuansa sosial-keluarganya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Mulai sekarang” dipilih daripada bentuk yang lebih kaku, sedangkan “terpecah” dan “melawan” mempertahankan ketegangan relasional dalam teks sumber.
