  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: id
  text: 'Lalu ia berkata, ‘Beginilah yang akan kulakukan: Aku akan merobohkan lumbung-lumbungku[a] dan membangun lumbung-lumbung yang lebih besar. Di sana aku akan mengumpulkan semua biji-bijian[b] dan segala harta bendaku[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gudang-gudang penyimpanan” untuk “lumbung-lumbungku” (ἀποθήκας).
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “biji-bijian” (σῖτος) dalam beberapa konteks dapat lebih khusus berarti “gandum.”
    reason: lexical_alternative
  - marker: c
    text: Atau “segala milikku” untuk “segala harta bendaku” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Beginilah yang akan kulakukan
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan penekanan pada rencana yang segera dijabarkan.
- source_word: καθελῶ
  choice: aku akan merobohkan
  rationale: Menyampaikan tindakan membongkar bangunan yang sudah ada secara konkret dan wajar.
- source_word: ἀποθήκας
  choice: lumbung-lumbungku
  rationale: Dalam konteks pertanian, 'lumbung' merupakan padanan alami untuk bangunan penyimpanan hasil panen, meskipun istilah Yunani dapat berarti tempat penyimpanan secara lebih umum.
- source_word: μείζονας οἰκοδομήσω
  choice: membangun lumbung yang lebih besar
  rationale: Mengungkapkan nomina yang tersirat setelah bentuk komparatif agar jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: συνάξω ἐκεῖ
  choice: Di sana aku akan mengumpulkan
  rationale: Mempertahankan makna dasar 'mengumpulkan' dan keterangan tempat ἐκεῖ tanpa mempersempitnya menjadi tindakan menyimpan.
- source_word: πάντα τὸν σῖτον
  choice: semua gandumku
  rationale: σῖτος menunjuk pada biji-bijian, sering kali gandum; bentuk posesif menghasilkan bahasa Indonesia yang alami dalam konteks ucapan pemilik dan sejajar dengan 'harta bendaku'.
- source_word: τὰ ἀγαθά μου
  choice: segala harta bendaku
  rationale: Menunjuk secara luas pada milik atau kekayaan material tanpa membatasinya pada uang.
