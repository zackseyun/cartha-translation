id: LUK.12.19
reference: Luke 12:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: id
  text: Lalu aku akan berkata kepada jiwaku[a], ‘Jiwa, engkau memiliki banyak harta yang tersimpan untuk bertahun-tahun. Beristirahatlah, makanlah, minumlah, dan bersenang-senanglah.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan ‘jiwa’ juga dapat berarti ‘diri’, ‘hidup’, atau ‘nyawa’, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: aku akan berkata
  rationale: Bentuk futur aktif dari λέγω menyatakan ujaran yang akan dilakukan; frasa ini langsung dan alami dalam bahasa Indonesia.
- source_word: ψυχῇ / Ψυχή
  choice: jiwaku / Jiwa
  rationale: ψυχή di sini menunjuk pada batin atau diri yang disapa oleh tokoh itu sendiri. ‘Jiwa’ mempertahankan citra dan daya retoris sapaan langsung tanpa menjadikannya pernyataan teknis tentang hakikat manusia.
- source_word: ἀγαθὰ
  choice: harta
  rationale: Dalam konteks hasil panen dan lumbung, bentuk substantival ini menunjuk pada barang bernilai atau kekayaan material. ‘Harta’ alami dalam bahasa Indonesia dan sesuai dengan konteks, meski istilah Yunani sendiri cukup luas.
- source_word: κείμενα
  choice: yang tersimpan
  rationale: Partisip κεῖμαι secara harfiah menggambarkan sesuatu yang tersedia atau terletak, dan dalam konteks ini berarti disimpan sebagai persediaan.
- source_word: εἰς ἔτη πολλά
  choice: untuk bertahun-tahun
  rationale: Frasa ini menyatakan persediaan yang dimaksudkan mencukupi selama banyak tahun.
- source_word: ἀναπαύου
  choice: Beristirahatlah
  rationale: Imperatif ini memerintahkan tokoh untuk hidup tenang dan menikmati keleluasaan; ‘beristirahatlah’ dekat dengan bentuk sumber dan tetap alami.
- source_word: φάγε / πίε
  choice: makanlah / minumlah
  rationale: Kedua imperatif diterjemahkan secara langsung dengan bentuk perintah Indonesia yang wajar.
- source_word: εὐφραίνου
  choice: bersenang-senanglah
  rationale: Kata kerja ini berarti bergembira atau menikmati kemeriahan. Dalam rangkaian ini, ‘bersenang-senanglah’ menyampaikan kenikmatan hidup yang dimaksud tanpa memberi nuansa rohani yang tidak dinyatakan.
theological_decisions:
- issue: Makna ψυχή dalam sapaan kepada diri sendiri
  choice: jiwa
  alternative: diri; hidup; nyawa
  rationale: Ayat ini menggambarkan seseorang yang berbicara kepada batinnya sendiri, bukan merumuskan antropologi teknis. ‘Jiwa’ mempertahankan istilah dan ketegangan semantis teks, sementara catatan kaki mengakui kemungkinan makna kontekstual lainnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘jiwaku/Jiwa’ dipertahankan untuk mencerminkan sapaan retoris dalam teks Yunani; bentuk-bentuk imperatif memakai akhiran -lah agar rangkaiannya alami dan tegas.
