id: LUK.12.10
reference: Luke 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: id
  text: Dan setiap orang yang mengatakan sesuatu menentang Anak Manusia[a] akan diampuni[b], tetapi orang yang menghujat Roh Kudus tidak akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengucapkan suatu perkataan menentang Anak Manusia.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal itu akan diampuni baginya”; pelanggaran tersebut tersirat sebagai hal yang diampuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: setiap orang yang
  rationale: Konstruksi ini bersifat distributif dan umum; pilihan ini alami dalam bahasa Indonesia modern serta mempertahankan cakupan universalnya.
- source_word: ἐρεῖ λόγον
  choice: mengatakan sesuatu
  rationale: Secara harfiah berarti 'mengatakan suatu perkataan'. Ungkapan 'mengatakan sesuatu' menyampaikan tindakan berbicara secara alami tanpa memberi kesan bahwa yang dimaksud hanya satu kata.
- source_word: εἰς
  choice: menentang
  rationale: Dalam konteks ujaran yang bermusuhan dan penghujatan, preposisi ini menyatakan arah permusuhan atau perlawanan.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini merupakan padanan baku bagi gelar tersebut dan mempertahankan latar Semitis serta bobot kristologisnya.
- source_word: ἀφεθήσεται αὐτῷ
  choice: akan diampuni
  rationale: Bentuk pasifnya menunjuk pada pengampunan pelanggaran orang itu. Bahasa Indonesia secara alami dapat memakai 'akan diampuni' tanpa menyebut objek tersirat, sambil tetap mempertahankan ketidaklangsungan bentuk Yunani.
- source_word: τῷ ... βλασφημήσαντι
  choice: orang yang menghujat
  rationale: Partisip aoris substantival mengidentifikasi pelaku berdasarkan tindakannya. Bentuk Indonesia ini alami dan tidak memaksakan penafsiran aspek sebagai tindakan yang harus sudah selesai.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Roh Kudus
  rationale: Padanan baku dan jelas dalam bahasa Indonesia modern.
- source_word: οὐκ ἀφεθήσεται
  choice: tidak akan diampuni
  rationale: Menyampaikan negasi futur pasif secara langsung dan mempertahankan ketegasan pernyataan.
theological_decisions:
- issue: Kontras antara perkataan menentang Anak Manusia dan penghujatan terhadap Roh Kudus
  choice: Mempertahankan perbedaan tekstual dalam hal dapat atau tidak dapat diampuni tanpa menjelaskan mekanismenya.
  alternative: Menafsirkan klausa pertama sebagai ketidaktahuan yang lebih ringan dan klausa kedua sebagai ketidakbertobatan final, atau memperluasnya berdasarkan nas paralel.
  rationale: Ayat ini sendiri menyatakan kontras tersebut, tetapi tidak mendefinisikan alasan atau mekanismenya. Terjemahan tidak boleh menyelesaikan ketegangan teologis yang tetap terbuka dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan catatan kaki mempertahankan bentuk ungkapan Yunani yang lebih harfiah.
