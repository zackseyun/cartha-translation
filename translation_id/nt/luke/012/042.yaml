id: LUK.12.42
reference: Luke 12:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: id
  text: Lalu Tuhan berkata, “Jadi, siapakah pengelola yang setia dan bijaksana[a], yang akan diangkat oleh tuannya untuk mengawasi para pelayan di rumahnya, supaya ia membagikan jatah makanan[b] kepada mereka pada waktu yang tepat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berakal sehat”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “jatah gandum”, yaitu porsi makanan terukur yang diberikan kepada setiap pelayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan; tuan
  rationale: Sebutan naratif bagi Yesus diterjemahkan “Tuhan”, sedangkan pemilik rumah dalam gambaran itu diterjemahkan “tuan”. Keduanya mencerminkan rentang makna κύριος sekaligus memperjelas tingkat acuan dalam bahasa Indonesia.
- source_word: πιστός
  choice: setia
  rationale: Dalam konteks tanggung jawab yang dipercayakan, kata ini menyatakan kesetiaan dan sifat dapat dipercaya; “setia” merupakan padanan yang alami dan mapan.
- source_word: οἰκονόμος
  choice: pengelola
  rationale: Kata ini menunjuk orang yang dipercaya mengatur rumah tangga atau harta milik. “Pengelola” menyampaikan fungsi pengurusan itu dengan jelas dalam bahasa Indonesia modern.
- source_word: φρόνιμος
  choice: bijaksana
  rationale: Kata ini menekankan kebijaksanaan praktis dan pertimbangan yang baik. “Bijaksana” alami dalam konteks pengelolaan, sedangkan alternatif leksikal dicatat dalam catatan kaki.
- source_word: καταστήσει
  choice: akan diangkat
  rationale: Dalam konteks ini, kata kerja tersebut berarti menempatkan seseorang dalam kedudukan dengan tanggung jawab tertentu.
- source_word: θεραπεία
  choice: para pelayan di rumahnya
  rationale: Di sini θεραπεία menunjuk kelompok pelayan atau orang-orang yang bekerja dalam rumah tangga, bukan tindakan penyembuhan atau pelayanan secara abstrak.
- source_word: ἐν καιρῷ
  choice: pada waktu yang tepat
  rationale: Ungkapan ini menunjukkan waktu yang sesuai atau telah ditentukan untuk pembagian makanan.
- source_word: σιτομέτριον
  choice: jatah makanan
  rationale: Istilah ini menunjuk porsi makanan yang diukur dan dibagikan, khususnya jatah gandum. “Jatah makanan” menyampaikan fungsinya secara alami, sementara arti harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan dua kemunculan κύριος pada tingkat naratif dan dalam gambaran
  choice: “Tuhan” untuk Yesus sebagai pembicara; “tuan” untuk pemilik rumah dalam gambaran
  alternative: “Tuhan” pada kedua kemunculan
  rationale: Bahasa Yunani memakai kata yang sama, tetapi konteks mengaktifkan nuansa gelar ilahi pada penyebutan naratif dan arti pemilik atau majikan dalam gambaran. Pembedaan kapitalisasi dan pilihan bentuk Indonesia memperjelas acuan tanpa menghapus hubungan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pengelola” dipilih daripada istilah yang lebih arkais seperti “penatalayan”; “mengepalai para pelayan di rumahnya” mengungkapkan hubungan tanggung jawab secara jelas. Penanda catatan kaki ditempatkan tepat sesudah kata atau frasa yang diterangkannya.
