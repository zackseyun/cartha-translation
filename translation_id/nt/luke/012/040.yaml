id: LUK.12.40
reference: Luke 12:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: id
  text: Kalian juga harus siap, karena Anak Manusia datang pada saat yang tidak kalian sangka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada saat yang tidak kalian perkirakan” atau “ketika kalian tidak menduganya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Kalian juga
  rationale: 'Menjaga unsur penyertaan dan penekanan: para pendengar pun, seperti para hamba dalam perumpamaan sebelumnya, harus siap.'
- source_word: γίνεσθε ἕτοιμοι
  choice: harus siap
  rationale: Imperatif kini menyerukan kesiapan sebagai sikap yang terus dipelihara. 'Harus siap' menyampaikan daya perintah secara alami dan tegas dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi perintah untuk siap.
- source_word: ᾗ ὥρᾳ
  choice: pada saat
  rationale: Ungkapan datif relatif ini bersifat temporal. 'Pada saat' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa waktunya diketahui.
- source_word: οὐ δοκεῖτε
  choice: yang tidak kalian sangka
  rationale: δοκέω secara harfiah berkaitan dengan berpikir atau menyangka. Dalam konteks peringatan tentang waktu kedatangan, 'tidak kalian sangka' mempertahankan nuansa tersebut sekaligus terdengar wajar.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar kristologis yang mapan serta gema apokaliptik dan mesianiknya, terutama hubungannya dengan Daniel 7:13–14.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini Yunani dapat berfungsi futuristik. Bahasa Indonesia tidak wajib menandai kala; 'datang' mempertahankan daya langsung peringatan tanpa memaksakan sistem eskatologis tertentu.
theological_decisions:
- issue: Penerjemahan gelar kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Bentuk tradisional yang harfiah ini mempertahankan fungsi ungkapan tersebut sebagai gelar yang digunakan Yesus bagi diri-Nya dan menjaga gema Daniel 7:13–14 tanpa menambahkan klaim doktrinal di luar teks.
- issue: Daya temporal ἔρχεται dalam perkataan eskatologis
  choice: datang
  alternative: akan datang
  rationale: Bentuk kini Yunani dapat menunjuk masa depan dengan kesan dekat dan nyata. Karena verba Indonesia tidak berubah menurut kala, 'datang' mempertahankan ketegangan bentuk tersebut; konteks sudah menunjukkan acuan mendatang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar ὑμεῖς terbaca jelas sebagai jamak. Susunan dibuat ringkas, tegas, dan bermartabat. Istilah 'Anak Manusia' dipertahankan sebagai gelar kanonis yang lazim.
