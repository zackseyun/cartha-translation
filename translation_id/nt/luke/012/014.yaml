base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: id
  text: Namun Yesus berkata kepadanya, “Saudara, siapa yang mengangkat Aku menjadi hakim atau pembagi atas kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Saudara
  rationale: Sapaan langsung kepada seorang laki-laki; dalam bahasa Indonesia modern, “Saudara” terdengar alami dan tegas tanpa kekasaran yang dapat tersirat oleh terjemahan harfiah “Hai manusia”.
- source_word: κατέστησεν
  choice: mengangkat
  rationale: Menyatakan tindakan menetapkan atau menunjuk seseorang pada suatu kedudukan resmi.
- source_word: κριτὴν
  choice: hakim
  rationale: Padanan langsung bagi orang yang berwenang memutus perkara.
- source_word: μεριστὴν
  choice: pembagi warisan
  rationale: Secara leksikal berarti pembagi; konteks permintaan pada ayat 13 menunjukkan pembagian warisan, sehingga objek yang tersirat dibuat eksplisit agar alami dan jelas.
- source_word: ἐφ’ ὑμᾶς
  choice: atas kalian
  rationale: Mempertahankan nuansa kewenangan “atas” kedua pihak; bentuk ὑμᾶς adalah jamak.
theological_decisions:
- issue: Apakah pertanyaan Yesus menyangkal seluruh peran-Nya sebagai hakim?
  choice: Mempertahankan pertanyaan retoris dalam konteks penunjukan untuk sengketa ini
  alternative: Memperluasnya menjadi penyangkalan umum bahwa Yesus adalah hakim
  rationale: Teks menanyakan siapa yang mengangkat-Nya atas mereka dalam perkara tersebut; terjemahan tidak boleh menyelesaikan ketegangan kristologis dengan tambahan penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama “Yesus” digunakan untuk memperjelas subjek pronominal dalam ayat yang berdiri sendiri. “Kalian” menandai bentuk jamak dan mengacu kepada pihak-pihak dalam sengketa.
