  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: id
  text: Siapakah di antara kalian yang, dengan merasa khawatir, mampu menambahkan sehasta pada usia hidupnya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menambahkan sehasta pada tinggi badannya?” Kata Yunani yang diterjemahkan “usia hidup” juga dapat berarti perawakan atau tinggi badan.'
    reason: Menjaga ambiguitas asli ἡλικία dan memberitahukan pembaca tentang penafsiran alternatif yang nyata.
lexical_decisions:
- source_word: μεριμνῶν
  choice: dengan merasa khawatir
  rationale: Partisipel ini menyatakan keadaan atau cara; frasa tersebut alami dalam bahasa Indonesia dan mempertahankan gagasan kekhawatiran.
- source_word: ἡλικίαν
  choice: usia hidupnya
  rationale: Kata ini dapat berarti usia/masa hidup atau perawakan. Dalam konteks kecemasan tentang kehidupan, 'usia hidup' menyampaikan makna yang paling mungkin tanpa menyamarkannya sebagai panjang tubuh.
- source_word: πῆχυν
  choice: sehasta
  rationale: Mempertahankan satuan ukuran kuno secara konkret dan metafora sumber tentang menambahkan suatu ukuran pada usia hidup.
- source_word: δύναται ... προσθεῖναι
  choice: mampu menambahkan
  rationale: Mencerminkan secara langsung unsur kemampuan dan infinitif 'menambahkan'.
theological_decisions:
- issue: Apakah ἡλικία merujuk pada masa hidup atau tinggi badan
  choice: usia hidupnya
  alternative: tinggi badannya
  rationale: Konteks dekat membahas kekhawatiran akan hidup, dan ukuran 'sehasta' dapat dipakai secara metaforis bagi rentang hidup. Namun, ambiguitas leksikal asli tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai sapaan jamak ὑμῶν dengan jelas; 'sehasta' dipertahankan sebagai satuan kuno dan dijelaskan melalui konteks serta catatan kaki.
