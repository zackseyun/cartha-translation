id: LUK.12.58
reference: Luke 12:58
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: id
  text: Sebab, ketika kamu pergi bersama lawan perkaramu menghadap seorang pejabat, berupayalah selagi di perjalanan untuk dibebaskan darinya.[a] Jangan sampai ia menyeretmu menghadap hakim, lalu hakim menyerahkanmu kepada petugas, dan petugas itu menjebloskanmu ke dalam penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menyelesaikan perkara dengannya.” Secara harfiah, teks Yunani berbunyi “untuk dibebaskan darinya”, tetapi dalam konteks ini kemungkinan besar yang dimaksud ialah menyelesaikan perkara sebelum sampai kepada hakim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: lawan perkaramu
  rationale: Dalam konteks hukum, istilah ini menunjuk kepada pihak lawan dalam suatu perkara. Pilihan ini lebih tepat daripada “penuduh” karena teks tidak memastikan bahwa perannya adalah jaksa atau pendakwa resmi.
- source_word: ἄρχοντα
  choice: seorang pejabat
  rationale: Kata ini menunjuk kepada pemegang wewenang sipil. “Pejabat” mempertahankan cakupan istilah Yunani tanpa menyamakannya dengan κριτής, “hakim”, yang muncul kemudian.
- source_word: δὸς ἐργασίαν
  choice: berupayalah
  rationale: Ungkapan ini mendesak tindakan sungguh-sungguh. “Berupayalah” alami dalam bahasa Indonesia modern dan mempertahankan nuansa usaha aktif.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: untuk dibebaskan darinya
  rationale: Terjemahan ini mengikuti bentuk pasif dan ungkapan Yunani secara dekat tanpa langsung menafsirkan tindakan itu sebagai penyelesaian perkara; implikasi kontekstual tersebut dicatat dalam catatan kaki.
- source_word: κατασύρῃ
  choice: menyeretmu
  rationale: Kata kerja ini kuat dan menggambarkan tindakan paksa; “menyeretmu” mempertahankan daya gambarnya.
- source_word: κριτήν / κριτής
  choice: hakim
  rationale: Ini adalah padanan hukum yang jelas dan lazim, serta membedakan hakim dari pejabat yang disebut sebelumnya.
- source_word: παραδώσει
  choice: menyerahkanmu
  rationale: Padanan ini secara alami menyampaikan pemindahan seseorang ke dalam wewenang petugas pelaksana.
- source_word: πράκτορι / πράκτωρ
  choice: petugas
  rationale: Istilah ini menunjuk kepada petugas yang melaksanakan keputusan hakim, mungkin dalam penagihan utang atau penahanan. “Petugas” cukup luas untuk tidak memasukkan jabatan modern tertentu ke dalam teks.
- source_word: βαλεῖ εἰς φυλακήν
  choice: menjebloskanmu ke dalam penjara
  rationale: “Menjebloskan” mempertahankan kekuatan dan ketegasan βάλλω sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὡς γὰρ
  choice: Sebab, ketika
  rationale: “Sebab” mempertahankan hubungan penjelasan yang dinyatakan γάρ, sedangkan “ketika” menyampaikan situasi yang diperkenalkan ὡς dengan alami dalam bahasa Indonesia.
- source_word: ἐν τῇ ὁδῷ
  choice: selagi di perjalanan
  rationale: Padanan ini mempertahankan gambaran perjalanan sekaligus menonjolkan desakan waktu sebelum perkara sampai kepada hakim.
theological_decisions:
- issue: Kekhususan penafsiran perumpamaan hukum
  choice: Mempertahankan gambaran hukum tanpa secara eksplisit mengidentifikasi tokoh-tokohnya dengan Allah, penghakiman terakhir, atau tokoh rohani tertentu.
  alternative: Menerjemahkannya secara langsung sebagai seruan untuk berdamai dengan Allah sebelum penghakiman terakhir.
  rationale: Ayat ini sendiri menyajikan adegan hukum. Meskipun konteks yang lebih luas dapat memberi bobot eskatologis, rujukan teologis tertentu tidak dinyatakan secara eksplisit dan karena itu tidak dimasukkan ke dalam terjemahan.
- issue: Makna ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: Mempertahankan ungkapan “dibebaskan darinya” dalam teks utama.
  alternative: Menerjemahkan secara kontekstual sebagai “menyelesaikan perkara dengannya”.
  rationale: Ungkapan Yunani secara harfiah berbicara tentang dibebaskan dari pihak lawan, sementara penyelesaian perkara merupakan implikasi yang sangat mungkin tetapi lebih interpretatif. Ketegangan ini dipertahankan melalui teks utama dan catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lawan perkara”, “pejabat”, “hakim”, dan “petugas” menjaga alur hukum serta perbedaan peran dalam teks sumber. Bentuk sapaan tunggal dipertahankan dengan “kamu” dan akhiran “-mu”.
