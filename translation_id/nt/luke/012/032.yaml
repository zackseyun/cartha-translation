  terminology: “Kawanan kecil,” “berkenan,” dan “kerajaan” mempertahankan metafora, nada baik hati, dan keluasan βασιλεία tanpa menambah “Allah” atau mempersempit maknanya. Catatan kaki dipertahankan dengan perumusan yang lebih alami.
