source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: id
  text: “Jangan takut, hai kawanan kecil, sebab Bapa kalian berkenan memberikan kerajaan[a] kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kerajaan” juga dapat menekankan pemerintahan atau kuasa rajawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan dengan μή dan imperatif kini disampaikan secara langsung dan wajar dalam bahasa Indonesia, tanpa mempersempitnya menjadi ketakutan terhadap hal tertentu.
- source_word: τὸ μικρὸν ποίμνιον
  choice: hai kawanan kecil
  rationale: Ungkapan ini mempertahankan metafora penggembalaan serta nuansa sapaan yang lembut. Partikel “hai” menandai fungsi vokatif secara alami dan bermartabat.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah untuk tidak takut. “Sebab” jelas, ringkas, dan sesuai dengan laras teks.
- source_word: εὐδόκησεν
  choice: berkenan
  rationale: Pilihan ini menyampaikan kehendak baik dan perkenanan Sang Bapa tanpa mengubahnya menjadi rumusan teknis tentang ketetapan ilahi atau terlalu menonjolkan emosi.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Bapamu
  rationale: Bentuk ini menerjemahkan secara tepat “Bapa kalian” dalam sapaan kepada kelompok dan tidak menambahkan kata “surgawi,” yang tidak terdapat dalam teks Yunani.
- source_word: δοῦναι ὑμῖν
  choice: memberikan ... kepadamu
  rationale: Terjemahan ini mengikuti makna langsung infinitif δίδωμι dengan datif penerima. “Kepadamu” dalam konteks ini dapat merujuk kepada kelompok yang disapa.
- source_word: τὴν βασιλείαν
  choice: kerajaan itu
  rationale: “Kerajaan” mempertahankan ungkapan alkitabiah yang luas, sementara “itu” mencerminkan artikel tertentu tanpa menambahkan “Allah,” yang tidak tertulis dalam ayat ini.
theological_decisions:
- issue: Cakupan makna βασιλεία
  choice: kerajaan itu
  alternative: pemerintahan atau kekuasaan sebagai raja
  rationale: βασιλεία dapat menunjuk baik pada ranah kerajaan maupun pada pemerintahan dan kekuasaan rajawi. Teks utama memakai “kerajaan” agar keluasan maknanya tidak dipersempit, sedangkan catatan kaki menyatakan kemungkinan nuansa pemerintahan.
- issue: Makna εὐδόκησεν sehubungan dengan kehendak ilahi
  choice: berkenan
  alternative: dengan murah hati memilih; menetapkan
  rationale: “Berkenan” menampilkan prakarsa dan kehendak baik Sang Bapa tanpa memasukkan rumusan doktrinal yang lebih teknis daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “hai kawanan kecil” mempertahankan metafora pastoral dan kelembutan teks; “Bapamu” wajar untuk sapaan kepada kelompok, sedangkan “kerajaan” dibiarkan tidak berhuruf kapital agar tidak menambahkan penafsiran tipografis yang tidak ada dalam bahasa sumber.
