  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: id
  text: Namun, Aku harus menjalani suatu baptisan[a][b], dan betapa Aku tertekan sampai hal itu terlaksana![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Aku mempunyai suatu baptisan yang dengannya Aku harus dibaptiskan.” Bahasa Yunani mempertahankan gambaran baptisan secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: “Baptisan” di sini merupakan metafora yang dalam konteksnya menunjuk pada penderitaan dahsyat yang akan Yesus alami.
    reason: alternative_reading
  - marker: c
    text: Atau, “betapa Aku terkekang” atau “betapa Aku terdesak sampai hal itu terlaksana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: suatu baptisan
  rationale: Mempertahankan gambaran metaforis baptisan dalam teks utama, alih-alih langsung menggantinya dengan ‘penderitaan’ atau ‘kematian’.
- source_word: ἔχω βαπτισθῆναι
  choice: Aku harus menjalani suatu baptisan
  rationale: Konstruksi ἔχω dengan infinitif menyatakan keharusan yang akan dihadapi. ‘Harus menjalani’ alami dalam bahasa Indonesia dan tetap menyampaikan nuansa pasif tanpa pengulangan yang kaku.
- source_word: πῶς
  choice: betapa
  rationale: Dipakai secara eksklamatif untuk menegaskan kuatnya keadaan batin Yesus.
- source_word: συνέχομαι
  choice: tertekannya Aku
  rationale: Menyampaikan keadaan terdesak, terkekang, atau tertekan secara batin tanpa mempersempit maknanya hanya menjadi kesedihan atau ketakutan.
- source_word: ἕως ὅτου
  choice: sampai
  rationale: Menandai batas waktu berlangsungnya tekanan tersebut dalam ungkapan Indonesia yang wajar.
- source_word: τελεσθῇ
  choice: hal itu digenapi
  rationale: Bentuk pasif menunjuk pada dibawanya peristiwa tersebut kepada penyelesaian yang dimaksud. ‘Digenapi’ mempertahankan kemungkinan nuansa pemenuhan, tetapi tidak menyamakannya dengan perkataan dalam Yohanes 19:30.
theological_decisions:
- issue: Rujukan metaforis ‘baptisan’
  choice: Gambaran baptisan dipertahankan dalam teks utama, dengan catatan bahwa dalam konteks ini menunjuk pada penderitaan yang akan Yesus alami.
  alternative: Menerjemahkannya langsung sebagai ‘penderitaan’, ‘kematian’, atau memahami baptisan air secara harfiah.
  rationale: Konteks mendukung rujukan kepada penderitaan dan kematian Yesus yang akan datang, tetapi metafora Yunani sebaiknya tidak diratakan menjadi parafrasa interpretatif.
- issue: Nuansa συνέχομαι
  choice: tertekan
  alternative: terkekang; terdesak; diliputi kesusahan
  rationale: Kata Yunani dapat menyatakan tekanan batin maupun keadaan seperti terkekang. Terjemahan utama memakai ungkapan yang jelas bagi pembaca modern, sementara alternatif dicatat untuk mempertahankan keluasan makna.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi ‘Aku’ mengikuti gaya umum terjemahan Alkitab Indonesia ketika merujuk kepada Yesus. Susunan seruan ‘betapa tertekannya Aku’ mempertahankan tekanan eksklamatif πῶς, sedangkan ‘sampai hal itu digenapi’ mempertahankan ambiguitas mengenai penyelesaian peristiwa yang dimaksud.
