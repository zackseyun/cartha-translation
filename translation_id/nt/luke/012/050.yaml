  to: Namun, Aku harus menjalani suatu baptisan[a][b], dan betapa Aku tertekan sampai hal itu terlaksana![c]
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia dan pada padanan τελεσθῇ. Metafora baptisan, keharusan yang tersirat dalam ἔχω βαπτισθῆναι, serta keluasan makna συνέχομαι tetap dipertahankan. Catatan kaki tetap terikat pada unsur leksikal yang relevan dan tidak menetapkan penafsiran denominational.
