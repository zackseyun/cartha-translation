  register: Bahasa Indonesia modern yang alami dan bermartabat. “Lalu” meneruskan alur narasi; kutipan langsung mempertahankan hidupnya monolog batin. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa sasaran.
