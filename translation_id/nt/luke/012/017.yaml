  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: id
  text: Lalu ia berpikir dalam hatinya, “Apa yang akan kulakukan? Sebab aku tidak mempunyai tempat untuk mengumpulkan hasil panenku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: berpikir
  rationale: Bentuk imperfek menggambarkan proses pertimbangan batin yang sedang berlangsung. “Berpikir” alami dalam bahasa Indonesia dan, bersama frasa “dalam hatinya”, menyampaikan perenungan internal tanpa melebihkan nuansa katanya.
- source_word: ἐν ἑαυτῷ
  choice: dalam hatinya
  rationale: Ungkapan idiomatis ini dengan jelas menandai percakapan batin. Terjemahan harfiah “dalam dirinya” kurang alami, sedangkan “dalam hatinya” lazim dan bermartabat dalam bahasa Indonesia.
- source_word: λέγων
  choice: '[disampaikan melalui kutipan langsung tanpa padanan tersendiri]'
  rationale: Dalam bahasa Indonesia, sesudah “berpikir dalam hatinya”, isi pikiran dapat langsung diperkenalkan sebagai kutipan. Menambahkan “katanya” akan terasa berulang dan dapat menyiratkan ucapan yang terdengar.
- source_word: Τί ποιήσω
  choice: Apa yang harus kulakukan?
  rationale: Ini adalah pertanyaan deliberatif. “Harus” secara alami menyatakan kebingungan mengenai tindakan yang akan diambil, sementara bentuk “kulakukan” sesuai dengan tutur batin orang pertama.
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pertanyaan sebelumnya. “Sebab” mempertahankan hubungan kausal secara jelas dan sesuai dengan ragam naratif yang bermartabat.
- source_word: οὐκ ἔχω ποῦ
  choice: aku tidak mempunyai tempat
  rationale: Ungkapan ini berarti bahwa tidak tersedia tempat untuk tindakan berikutnya. Bentuk tersebut alami dalam bahasa Indonesia dan mempertahankan unsur “tempat” dari ποῦ.
- source_word: συνάξω
  choice: mengumpulkan
  rationale: Pilihan ini mempertahankan arti dasar membawa atau menghimpun menjadi satu. Konteks ayat berikutnya dapat memberi nuansa penyimpanan tanpa memasukkannya secara prematur ke dalam verba ini.
- source_word: τοὺς καρπούς μου
  choice: hasil panenku
  rationale: Dalam konteks pertanian, καρποί menunjuk pada hasil tanah atau panen, bukan hanya buah-buahan. “Hasil panen” jelas dan alami bagi pembaca modern.
theological_decisions: []
