base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: id
  text: Sebab hidup itu lebih berharga daripada makanan[a], dan tubuh lebih berharga daripada pakaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jiwa" atau "diri"; kata Yunani ψυχή dapat berarti "hidup", "diri", atau "jiwa". Dalam konteks ini, "hidup" paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai dasar penjelasan bagi larangan untuk khawatir pada ayat sebelumnya.
- source_word: ψυχή
  choice: hidup
  rationale: Dalam konteks makan, kekhawatiran, dan pemeliharaan, kata ini menunjuk pada hidup seseorang, bukan secara khusus jiwa sebagai unsur nonjasmani.
- source_word: πλεῖόν
  choice: lebih daripada
  rationale: Mempertahankan perbandingan nilai tanpa mempersempitnya menjadi sekadar 'lebih penting'.
- source_word: τροφή
  choice: makanan
  rationale: Padanan Indonesia yang lugas dan alami dalam konteks ini.
- source_word: σῶμα
  choice: tubuh
  rationale: Menunjuk secara langsung pada tubuh jasmani yang dipasangkan dengan pakaian.
- source_word: ἔνδυμα
  choice: pakaian
  rationale: Padanan umum dan alami untuk sesuatu yang dikenakan pada tubuh.
theological_decisions:
- issue: Makna ψυχή dalam pengajaran tentang kekhawatiran dan pemeliharaan
  choice: Diterjemahkan 'hidup'.
  alternative: jiwa; diri
  rationale: Kesejajaran antara hidup dan makanan serta antara tubuh dan pakaian menunjukkan bahwa yang dimaksud ialah kehidupan seseorang. Pilihan ini tidak menyangkal bahwa ψυχή dapat berarti 'jiwa' dalam konteks lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'lebih daripada' dipertahankan pada kedua klausa agar perbandingan paralelnya jelas dan alami.
