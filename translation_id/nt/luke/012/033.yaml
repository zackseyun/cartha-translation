id: LUK.12.33
reference: Luke 12:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: id
  text: Juallah harta milikmu dan bersedekahlah[a]. Buatlah bagi dirimu kantong-kantong uang yang tidak akan usang, harta yang tidak akan habis di surga[b], tempat pencuri tidak mendekat dan ngengat tidak merusak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini merujuk pada pemberian sebagai tindakan belas kasih kepada orang yang membutuhkan.
    reason: lexical_clarification
  - marker: b
    text: Teks Yunani memakai bentuk jamak, "di surga-surga."
    reason: source_form
lexical_decisions:
- source_word: πωλήσατε
  choice: Juallah
  rationale: Imperatif aoristus jamak ini menyerukan tindakan tegas. Bentuk "juallah" menyampaikan perintah secara lugas tanpa menambahkan gagasan bahwa seluruh milik harus dilikuidasi.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: harta milikmu
  rationale: Ungkapan ini menunjuk kepada barang atau kekayaan yang dimiliki. "Harta milikmu" alami dalam bahasa Indonesia dan cukup luas untuk mencakup berbagai kepunyaan.
- source_word: δότε ἐλεημοσύνην
  choice: berikanlah sedekah
  rationale: ἐλεημοσύνη menunjuk kepada pemberian sebagai tindakan belas kasih kepada orang yang membutuhkan. "Sedekah" mempertahankan kekonkretan istilah itu dan lebih ringkas daripada menguraikannya dalam teks utama.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Buatlah bagi dirimu
  rationale: Dativus refleksif menyatakan tindakan yang dilakukan demi kepentingan diri sendiri; frasa ini mempertahankan unsur imperatif dan refleksif.
- source_word: βαλλάντια
  choice: pundi-pundi
  rationale: Kata ini berarti kantong uang. "Pundi-pundi" mempertahankan metafora benda konkret dan sesuai dengan register Alkitab yang tetap dapat dipahami pembaca modern.
- source_word: μὴ παλαιούμενα
  choice: yang tidak akan usang
  rationale: Partisip ini secara harfiah menggambarkan sesuatu yang tidak menjadi tua atau lusuh. "Tidak akan usang" alami untuk pundi-pundi dan mempertahankan citra sumber.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: harta yang tidak akan habis
  rationale: ἀνέκλειπτος berarti tidak gagal atau tidak habis. Bentuk klausal ini jelas dalam bahasa Indonesia dan menjaga gagasan bahwa harta tersebut tak pernah berkurang sampai lenyap.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunani berjumlah jamak, "di surga" merupakan padanan idiomatis dalam bahasa Indonesia untuk ranah surgawi yang dimaksud; bentuk sumber dicatat dalam catatan kaki.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: tempat pencuri tidak dapat mendekat
  rationale: Terjemahan ini mempertahankan citra spasial ἐγγίζω, yakni datang atau mendekat, sambil menghasilkan susunan Indonesia yang wajar.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: dan ngengat tidak dapat merusaknya
  rationale: σής adalah ngengat dan διαφθείρω dalam konteks ini berarti merusak atau membinasakan. Pronomina "-nya" memperjelas bahwa harta itulah yang tidak dirusak.
theological_decisions:
- issue: Makna ἐλεημοσύνην dalam perintah mengenai kepunyaan dan harta surgawi
  choice: berikanlah sedekah
  alternative: berikanlah kepada orang miskin
  rationale: '"Sedekah" secara langsung mewakili tindakan belas kasih berupa pemberian kepada orang yang membutuhkan. Catatan kaki menjelaskan sasaran sosialnya tanpa mengubah teks utama menjadi parafrasa atau mengimpor program ekonomi tertentu.'
- issue: Bentuk jamak ἐν τοῖς οὐρανοῖς
  choice: di surga
  alternative: di surga-surga / di langit-langit
  rationale: Bahasa Indonesia modern lazim memakai bentuk tunggal "surga" untuk idiom ini. Catatan kaki mempertahankan informasi bahwa teks Yunani memakai bentuk jamak, tanpa memberi kesan adanya ajaran khusus tentang beberapa surga.
- issue: Hubungan βαλλάντια μὴ παλαιούμενα dengan θησαυρὸν ἀνέκλειπτον
  choice: pundi-pundi yang tidak akan usang, yaitu harta yang tidak akan habis
  alternative: pundi-pundi yang tidak akan usang, harta yang tidak akan habis
  rationale: '"Yaitu" menampilkan frasa tentang harta sebagai penjelasan lebih lanjut atas metafora pundi-pundi. Ini menjaga kesatuan gambaran tanpa menyatakan bahwa keduanya merupakan dua objek terpisah.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk imperatif dengan partikel -lah menjaga nada nasihat yang tegas. "Pundi-pundi" dipakai untuk mempertahankan metafora kantong uang kuno tanpa memakai istilah modern yang anakronistis.
