translation:
  language: id
  text: Hendaklah pakaianmu terikat rapi di pinggang dan pelita-pelitamu tetap menyala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pinggangmu berikat.” Gambaran ini berasal dari kebiasaan mengangkat pakaian panjang lalu mengikatkannya pada pinggang agar siap bekerja atau bergerak.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Hendaklah ... tetap
  rationale: Imperatif orang ketiga kini menyampaikan dorongan agar keadaan kesiapsiagaan ini terus berlangsung; “hendaklah” wajar dalam bahasa Indonesia yang bermartabat, sedangkan “tetap” membantu mengungkapkan aspek berkelanjutan dari kedua frasa partisipial.
- source_word: ὑμῶν
  choice: -mu
  rationale: Pronomina genitif jamak berfungsi posesif bagi kedua frasa nomina. Bahasa Indonesia tidak membedakan jumlah pada bentuk enklitik ini; konteks menunjukkan bahwa perkataan ditujukan kepada para pendengar.
- source_word: ὀσφύες
  choice: pinggang
  rationale: Kata ini menunjuk daerah pinggang. “Pinggang” mempertahankan gambaran tubuh secara alami tanpa memakai istilah “aurat” atau ungkapan anatomis yang dapat mengalihkan makna.
- source_word: περιεζωσμέναι
  choice: berikat
  rationale: Partisipel perfek pasif περιζώννυμι menggambarkan pinggang yang telah diikat dan berada dalam keadaan siap. “Berikat” mempertahankan metafora konkret pakaian yang dikencangkan, sementara makna budayanya dijelaskan dalam catatan kaki.
- source_word: λύχνοι
  choice: pelita-pelita
  rationale: λύχνος adalah pelita minyak yang konkret, bukan cahaya secara abstrak. Bentuk ulang menyatakan nomina jamak secara jelas sesuai teks Yunani.
- source_word: καιόμενοι
  choice: tetap menyala
  rationale: Partisipel kini menggambarkan keadaan yang terus berlangsung. Dalam konteks pelita, “menyala” lebih alami daripada “terbakar,” dan “tetap” menyampaikan nuansa duratif.
theological_decisions:
- issue: Gambaran idiomatis tentang kesiapsiagaan
  choice: Mempertahankan gambaran konkret “pinggangmu tetap berikat” dalam teks utama
  alternative: “Hendaklah kamu siap bertindak” atau “Kenakanlah pakaian yang siap untuk bekerja”
  rationale: Teks Yunani menyatakan kesiapsiagaan melalui gambaran mengikat pakaian panjang pada pinggang. Terjemahan utama mempertahankan metafora itu dan tidak menggantinya dengan penafsiran saja; catatan kaki menjelaskan maknanya bagi pembaca masa kini.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan paralel dipertahankan, dengan “tetap” pada kedua bagian untuk menyampaikan kesiapsiagaan yang berkelanjutan. Metafora budaya tetap hadir dalam teks utama dan dijernihkan melalui catatan kaki.
