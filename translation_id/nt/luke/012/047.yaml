  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: id
  text: Adapun hamba yang mengetahui kehendak tuannya tetapi tidak membuat persiapan atau bertindak sesuai dengan kehendaknya akan menerima banyak pukulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan dipukuli berkali-kali.” Dalam bahasa Yunani, kata benda yang berarti “pukulan” tidak disebutkan, tetapi tersirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam latar rumah tangga perumpamaan ini, istilah tersebut menunjuk kepada bawahan yang terikat di bawah kuasa seorang tuan. 'Hamba' merupakan padanan Indonesia yang alami dan bermartabat, serta tetap menampilkan hubungan kuasa itu tanpa nuansa utama pekerja upahan.
- source_word: γνοὺς
  choice: yang tahu
  rationale: Partisip aoris ini menunjukkan bahwa hamba tersebut telah mengetahui kehendak tuannya. Bentuk 'yang tahu' alami dalam bahasa Indonesia dan tidak memberi penafsiran tambahan.
- source_word: θέλημα
  choice: kehendak
  rationale: '''Kehendak'' adalah padanan baku dan sesuai konteks untuk maksud atau keinginan yang harus dilaksanakan.'
- source_word: κυρίου αὐτοῦ
  choice: tuannya itu
  rationale: κύριος di sini menyatakan atasan atau pemilik hamba dalam latar perumpamaan, bukan secara langsung gelar ilahi. 'Tuannya' mempertahankan hubungan rumah tangga tersebut; 'itu' membantu menandai hubungan dengan hamba yang sedang dibicarakan.
- source_word: μὴ ἑτοιμάσας
  choice: tidak membuat persiapan
  rationale: Bahasa Yunani tidak menyebut objek yang dipersiapkan. 'Membuat persiapan' mempertahankan ketaktersebutan objek itu dan terdengar alami dalam bahasa Indonesia.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: atau bertindak sesuai dengan kehendaknya
  rationale: Ungkapan ini mempertahankan kegagalan kedua yang dibedakan dengan ἢ, yakni tidak melakukan sesuatu selaras dengan kehendak sang tuan.
- source_word: δαρήσεται πολλάς
  choice: akan dipukuli berkali-kali
  rationale: δαρήσεται adalah bentuk pasif futur yang menyatakan pemukulan. πολλάς merupakan kata sifat jamak feminin dengan nomina seperti 'pukulan' yang tersirat; 'dipukuli berkali-kali' menyampaikan idiom tersebut secara konkret dan alami.
theological_decisions:
- issue: Makna κύριος dalam latar rumah tangga perumpamaan
  choice: tuan
  alternative: Tuhan
  rationale: Kalimat ini secara langsung menggambarkan hubungan antara hamba dan atasannya dalam rumah tangga. 'Tuan' menjaga gambaran perumpamaan tanpa menghapus kemungkinan rujukan teologisnya pada tingkat penerapan.
- issue: Ungkapan hukuman δαρήσεται πολλάς
  choice: akan dipukuli berkali-kali
  alternative: akan menerima banyak pukulan
  rationale: Bahasa Yunani membiarkan nomina sesudah πολλάς tersirat. Terjemahan utama menyampaikan pengulangan pukulan dengan bahasa Indonesia yang wajar, sedangkan catatan kaki menjelaskan bentuk elipsis aslinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan serius. Struktur dua kegagalan—tidak bersiap dan tidak bertindak menurut kehendak tuan—dipertahankan, demikian pula gambaran konkret tentang hukuman.
