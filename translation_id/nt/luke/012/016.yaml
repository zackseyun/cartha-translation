base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: id
  text: 'Lalu Yesus menyampaikan sebuah perumpamaan kepada mereka: “Tanah milik seorang pria kaya memberikan hasil yang berlimpah.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Lalu Yesus menyampaikan
  rationale: δέ berfungsi sebagai penghubung ringan dalam alur narasi dan secara wajar diterjemahkan “Lalu”. Subjek tersiratnya diperjelas sebagai “Yesus” sesuai konteks, sedangkan “menyampaikan” mengungkapkan konstruksi idiomatis εἶπεν ... παραβολήν.
- source_word: παραβολὴν
  choice: sebuah perumpamaan
  rationale: “Perumpamaan” adalah istilah baku dan mudah dipahami untuk jenis pengajaran yang dinyatakan oleh παραβολή dalam Injil.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: Terjemahan ini mempertahankan secara jelas kelompok yang menjadi sasaran perkataan Yesus.
- source_word: λέγων
  choice: ':'
  rationale: Partisipel ini memperkenalkan isi perumpamaan; dalam bahasa Indonesia modern, tanda titik dua secara alami menjalankan fungsi tersebut tanpa perlu memakai bentuk kaku “dengan berkata”.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: milik seorang kaya
  rationale: Frasa genetif menyatakan kepemilikan tanah. “Seorang kaya” mempertahankan referen manusia tunggal dan kekayaannya; τινός tidak perlu diterjemahkan “tertentu” karena sifat tak tentu sudah terungkap oleh “seorang” dan “tertentu” akan terasa kurang alami.
- source_word: εὐφόρησεν
  choice: memberikan hasil yang berlimpah
  rationale: Kata ini menggambarkan tanah yang menghasilkan dengan sangat baik. Pilihan ini alami dalam konteks pertanian dan mempertahankan gagasan kelimpahan.
- source_word: ἡ χώρα
  choice: Tanah
  rationale: Dalam konteks ini χώρα menunjuk pada lahan atau tanah pertanian milik orang kaya, bukan negara atau wilayah geopolitik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur Yunani dipertahankan sejauh alami, sementara partisipel λέγων dialihkan menjadi tanda titik dua agar pengantar kutipan tidak terasa kaku.
