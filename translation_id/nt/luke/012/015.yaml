  terminology: '''Ketamakan'' adalah padanan modern yang baik untuk πλεονεξία dalam konteks ini. ''Segala bentuk'' menyampaikan πάσης tanpa mempersempit maknanya. ''Harta miliknya'' secara wajar menerjemahkan τῶν ὑπαρχόντων αὐτῷ.'
