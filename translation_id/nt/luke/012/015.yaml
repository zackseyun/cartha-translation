  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Berjaga-jagalah dan jagalah diri kalian dari segala bentuk ketamakan,[a] sebab hidup seseorang tidak bergantung pada kelimpahan harta miliknya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala keserakahan” atau “segala keinginan untuk memiliki lebih banyak.” Kata Yunani πλεονεξία dapat berarti ketamakan, keserakahan, atau hasrat untuk terus memperoleh lebih banyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε καὶ φυλάσσεσθε
  choice: Berjaga-jagalah dan jagalah dirimu
  rationale: 'Dua bentuk imperatif jamak dipertahankan: yang pertama menyerukan kewaspadaan, sedangkan yang kedua menekankan perlindungan diri. Bentuk “dirimu” secara alami dapat merujuk kepada para pendengar sebagai kelompok.'
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: dari segala bentuk ketamakan
  rationale: πλεονεξία menunjuk pada hasrat serakah untuk memiliki lebih banyak; “ketamakan” bernada bermartabat dan mudah dipahami, sedangkan πάσης menyatakan cakupan menyeluruh yang wajar diungkapkan dengan “segala bentuk”.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi peringatan sebelumnya; “sebab” mempertahankan hubungan kausal dalam ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: sekalipun seseorang berlimpah harta, hidupnya tidak berasal dari apa yang dimilikinya
  rationale: Susunan ini menyampaikan bahwa kehidupan seseorang tidak bersumber atau ditentukan oleh miliknya ketika ia memiliki kelimpahan. Perumusan ulang secara alami menghindari frasa Indonesia yang kaku tanpa menghapus tekanan pada kelimpahan.
theological_decisions:
- issue: Cakupan πλεονεξία
  choice: segala bentuk ketamakan
  alternative: segala keserakahan; segala keinginan untuk memiliki lebih banyak
  rationale: Peringatan ini mencakup dorongan memperoleh lebih banyak secara luas, bukan hanya mengingini barang milik orang lain dalam arti hukum yang sempit.
- issue: Hubungan antara hidup dan harta milik
  choice: hidupnya tidak berasal dari apa yang dimilikinya
  alternative: hidup seseorang tidak terdiri atas kelimpahan hartanya
  rationale: Terjemahan ini mempertahankan penyangkalan bahwa hidup bersumber dari milik seseorang, tanpa menambahkan klaim teologis tentang arti “hidup” yang tidak dijelaskan dalam ayat ini.
- issue: Ungkapan maskulin generik
  choice: seseorang ... hidupnya ... apa yang dimilikinya
  alternative: hidup seseorang ... harta miliknya
  rationale: τινί dan kata ganti maskulin tunggal berfungsi secara generik. Bahasa Indonesia memungkinkan rujukan yang inklusif tanpa mengubah jumlah tunggal atau menonjolkan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Pengulangan dua perintah dipertahankan untuk mencerminkan penekanan teks Yunani; susunan klausa terakhir dibuat idiomatis tanpa menghilangkan hubungan antara kelimpahan, milik, dan hidup.
