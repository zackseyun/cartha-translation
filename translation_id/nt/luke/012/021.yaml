  naturalness: '“Demikianlah halnya dengan ...” adalah bentuk baku dan wajar untuk penerapan perumpamaan. “Menimbun harta bagi dirinya sendiri” juga alami dan tepat. “Tetapi” dapat dipertahankan: meskipun καί secara harfiah berarti “dan,” hubungan antitetisnya nyata dan “tetapi” adalah koordinasi Indonesia yang idiomatis.'
  terminology: “Allah” tepat dan konsisten. “Menimbun harta” mempertahankan hubungan dengan θησαυρίζων. Istilah “kaya di hadapan Allah” merupakan idiom Indonesia yang jelas untuk εἰς θεόν, sambil mempertahankan keterbukaan ungkapan sumber; catatan kaki menyediakan alternatif yang lebih dekat pada orientasi relasional.
