  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: id
  text: Demikianlah halnya dengan orang yang menimbun harta bagi dirinya sendiri, tetapi tidak kaya di hadapan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak kaya terhadap Allah.”'
    reason: Alternatif ini mempertahankan nuansa arah atau orientasi relasional dari εἰς θεόν, sedangkan teks utama memakai idiom Indonesia yang lebih alami.
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Kata ini menerapkan perumpamaan sebelumnya kepada orang dengan watak serupa; bentuk ini ringkas, wajar, dan mempertahankan daya ungkapan pepatah.
- source_word: ὁ θησαυρίζων
  choice: orang yang menimbun harta
  rationale: Partisipel berartikel ini menunjuk secara umum kepada seseorang yang dicirikan oleh tindakan tersebut. 'Menimbun harta' mempertahankan gagasan pengumpulan dan penyimpanan harta, bukan sekadar menabung.
- source_word: ἑαυτῷ
  choice: bagi dirinya sendiri
  rationale: Datif refleksif menyatakan keuntungan atau kepentingan diri; terjemahan ini mempertahankan orientasi yang berpusat pada diri.
- source_word: καὶ μὴ
  choice: tetapi tidak
  rationale: Walaupun καί secara dasar berarti 'dan', dalam bahasa Indonesia kontras antara menimbun bagi diri sendiri dan tidak kaya terhadap Allah lebih alami dan jelas dinyatakan dengan 'tetapi', tanpa mengubah hubungan logisnya.
- source_word: εἰς θεὸν
  choice: terhadap Allah
  rationale: Ungkapan ini mempertahankan arah atau orientasi relasional εἰς dan tidak mempersempit maknanya menjadi sekadar kepemilikan atau penilaian ilahi.
- source_word: πλουτῶν
  choice: kaya
  rationale: Partisipel ini berfungsi secara predikatif; 'kaya' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan kontras dengan harta yang ditimbun.
theological_decisions:
- issue: Jenis kelamin dalam partisipel maskulin tunggal yang bersifat umum
  choice: orang yang
  alternative: laki-laki yang
  rationale: Dalam konteks ini bentuk maskulin tunggal berfungsi sebagai contoh generik. 'Orang yang' menyampaikan cakupan moral umum secara alami dalam bahasa Indonesia tanpa membatasi penerapannya kepada laki-laki.
- issue: Makna ungkapan 'kaya terhadap Allah'
  choice: mempertahankan ungkapan relasional tanpa perluasan tafsiran
  alternative: kaya dalam hal-hal yang berkenan kepada Allah
  rationale: Ayat ini tidak menjabarkan secara eksplisit arti kekayaan tersebut. Terjemahan harfiah yang tetap dapat dipahami menjaga keluasan dan ketegangan teologis teks.
- issue: Hubungan koordinatif καὶ μή
  choice: tetapi tidak
  alternative: dan tidak
  rationale: Kontras sudah melekat dalam dua gambaran yang dikoordinasikan. 'Tetapi' menghasilkan bahasa Indonesia yang lebih alami, tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Menimbun harta' dipilih untuk mempertahankan citra perumpamaan, sedangkan 'kaya terhadap Allah' sengaja dibiarkan sebagai ungkapan relasional yang padat dan terbuka.
