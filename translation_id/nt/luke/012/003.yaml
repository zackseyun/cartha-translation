id: LUK.12.3
reference: Luke 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: id
  text: Karena itu, apa pun yang kalian katakan dalam kegelapan akan terdengar dalam terang, dan apa yang kalian bisikkan[a] di ruang-ruang dalam akan diumumkan dari atap-atap rumah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “kalian katakan ke telinga.”'
    reason: Ungkapan Yunani yang hidup menunjuk pada perkataan yang disampaikan secara sangat pribadi.
  - marker: b
    text: 'Atau: “di atas atap-atap rumah.” Rumah-rumah pada masa itu biasanya beratap datar dan dapat dipakai sebagai tempat menyampaikan pengumuman kepada umum.'
    reason: Mempertahankan alternatif preposisional sekaligus menjelaskan latar gambaran kuno.
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Karena itu
  rationale: Ungkapan ini berfungsi sebagai penarikan kesimpulan dari ayat sebelumnya. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan hubungan inferensial tersebut.
- source_word: ὅσα
  choice: apa pun yang
  rationale: Bentuk relatif tak tentu ini mencakup segala sesuatu yang dikatakan secara tersembunyi.
- source_word: ἐν τῇ σκοτίᾳ ... ἐν τῷ φωτί
  choice: dalam kegelapan ... dalam terang
  rationale: Pasangan ini mempertahankan pertentangan gambaran Yunani serta makna harfiah dan kiasannya.
- source_word: ἀκουσθήσεται
  choice: akan terdengar
  rationale: Bentuk pasif futur dipertahankan secara alami tanpa menentukan pelaku atau mekanisme penyingkapannya.
- source_word: πρὸς τὸ οὖς ἐλαλήσατε
  choice: kalian bisikkan
  rationale: Secara harfiah berarti berbicara ke telinga; “bisikkan” menyampaikan idiom komunikasi pribadi secara alami, dengan ungkapan harfiahnya dicatat dalam catatan kaki.
- source_word: ἐν τοῖς ταμείοις
  choice: di ruang-ruang dalam
  rationale: ταμεῖον dapat berarti ruang dalam, ruang pribadi, atau gudang. Konteks menekankan tempat yang tertutup dan tersembunyi, sehingga pilihan ini tidak mempersempitnya menjadi gudang.
- source_word: κηρυχθήσεται
  choice: akan diumumkan
  rationale: Kata ini menunjuk pada pemberitahuan terbuka oleh seorang bentara; “diumumkan” sesuai dengan konteks tanpa memberi nuansa khusus khotbah keagamaan.
- source_word: ἐπὶ τῶν δωμάτων
  choice: dari atap-atap rumah
  rationale: Walaupun preposisinya dapat diterjemahkan “di atas,” konteks menggambarkan pengumuman kepada umum dari atap rumah yang datar. Pilihan ini menyampaikan arah pengumuman dengan jelas.
theological_decisions:
- issue: Sifat dan waktu penyingkapan hal-hal tersembunyi
  choice: Menyatakan bahwa perkataan tersembunyi akan menjadi terbuka tanpa menentukan waktu atau mekanismenya.
  alternative: Menafsirkannya secara khusus sebagai penyingkapan pada penghakiman terakhir atau semata-mata sebagai terbongkarnya kemunafikan dalam sejarah sekarang.
  rationale: Konteks membahas terbongkarnya hal tersembunyi, tetapi ayat ini tidak membatasi penyingkapan itu pada satu waktu atau cara tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai karena verba Yunani berbentuk orang kedua jamak. Struktur paralel dan pertentangan kegelapan–terang dipertahankan.
