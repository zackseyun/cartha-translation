  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: id
  text: Kemudian seseorang dari antara orang banyak berkata kepada-Nya, “Guru, katakanlah kepada saudara saya agar ia membagi warisan itu dengan saya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Kemudian ... berkata
  rationale: δέ merupakan penghubung ringan; “Kemudian” menyampaikan kelanjutan narasi secara alami tanpa menegaskan pertentangan.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: seseorang dari antara orang banyak
  rationale: τις menunjuk orang yang tidak disebutkan identitasnya, sedangkan ἐκ τοῦ ὄχλου menyatakan bahwa ia berasal dari kalangan orang banyak yang hadir.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Bentuk datif ini merupakan objek tak langsung dan dalam konteks merujuk kepada Yesus; kapitalisasi pronomina mengikuti kebiasaan terjemahan Alkitab Indonesia yang tetap mudah dipahami.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan kepada seorang pengajar; “Guru” mempertahankan arti biasa tanpa menambahkan nuansa jabatan atau kewenangan lain.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: suruhlah saudara saya
  rationale: Secara harfiah berarti “katakanlah kepada saudara saya”; dalam konstruksi dengan infinitif, “suruhlah” merupakan ungkapan Indonesia yang alami bagi permintaan agar saudara itu melakukan tindakan tersebut.
- source_word: μερίσασθαι
  choice: membagi
  rationale: Infinitif aoris medial ini berarti membagi atau membagikan menjadi bagian-bagian; “membagi” sesuai dengan konteks warisan dan tidak menentukan terlebih dahulu besarnya bagian masing-masing.
- source_word: μετ’ ἐμοῦ
  choice: dengan saya
  rationale: μετά dengan genitif menyatakan kebersamaan atau keikutsertaan; terjemahan langsung ini mempertahankan ketidakjelasan apakah yang diminta ialah pembagian bersama atau pemberian bagian tertentu.
- source_word: τὴν κληρονομίαν
  choice: warisan itu
  rationale: Menunjuk harta milik yang diwarisi; “warisan” akurat dan lebih luas daripada istilah hukum yang lebih khusus. Demonstratif “itu” secara alami menandai nomina definit dalam bahasa Indonesia.
