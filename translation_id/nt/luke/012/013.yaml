translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Sapaan “Guru” serta permintaan “suruhlah” mudah dipahami pembaca umum dan tetap bermartabat. Ambiguitas situasi hukum dan pembagian warisan tidak diperjelas melampaui teks Yunani.
