  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Yunani: seseorang dari antara orang banyak berbicara kepada Yesus dan memintanya agar saudaranya membagi warisan dengannya. Namun, “suruhlah” dapat memberi kesan perintah yang lebih tegas daripada εἰπέ (“katakanlah/tell”), yang dalam konteks ini merupakan permintaan agar Yesus berbicara kepada saudaranya.'
  naturalness: Susunan kalimatnya sudah wajar dalam bahasa Indonesia modern. Penggantian “suruhlah saudara saya” dengan “katakanlah kepada saudara saya agar ia” tetap alami, sekaligus lebih dekat dengan konstruksi Yunani εἰπὲ ... μερίσασθαι.
  terminology: “Guru,” “orang banyak,” dan “warisan” tepat. “Saudara saya” dapat dipahami sebagai saudara kandung dalam konteks ini; teks Yunani memang menunjuk saudara laki-laki, tetapi istilah Indonesia tersebut tidak perlu diperluas menjadi “saudara laki-laki” karena konteksnya sudah memadai.
