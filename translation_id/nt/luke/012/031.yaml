  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: id
  text: Tetapi, carilah kerajaan-Nya[b][a], dan hal-hal ini akan ditambahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerajaan Allah”; teks Yunani berbunyi “kerajaan-Nya”, dan acuannya dipahami dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah berbunyi “kerajaan Allah” sebagai ganti “kerajaan-Nya”.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai kontras dengan pengejaran kebutuhan hidup yang dibahas sebelumnya, sambil tetap alami dan ringkas dalam bahasa Indonesia.
- source_word: ζητεῖτε
  choice: carilah
  rationale: Bentuk imperatif kini menyatakan orientasi yang terus berlangsung; dalam bahasa Indonesia, imperatif “carilah” dapat memuat daya tersebut tanpa perlu menambahkan unsur penafsiran seperti “teruslah mencari”.
- source_word: βασιλείαν
  choice: kerajaan
  rationale: “Kerajaan” merupakan padanan yang lazim dan luas, yang dapat mencakup pemerintahan maupun ranah kekuasaan, tanpa mempersempit maknanya menjadi hanya “pemerintahan” atau “kedaulatan”.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Mempertahankan bentuk pronomina Yunani, sementara konteks mengidentifikasi acuannya sebagai Allah.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mengacu pada berbagai kebutuhan hidup dalam konteks sebelumnya. Tidak ditambahkan kata “semua” karena kata itu tidak terdapat dalam teks Yunani ayat ini.
- source_word: προστεθήσεται
  choice: akan ditambahkan
  rationale: Mempertahankan bentuk pasif mendatang dan gambaran tentang sesuatu yang ditambahkan, alih-alih menafsirkannya secara lebih bebas sebagai “akan diberikan” atau “akan disediakan”.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Mewakili datif jamak secara alami. Bentuk “-mu” di sini dipahami sebagai sapaan kepada para pendengar secara kolektif, sesuai pemakaian umum dalam terjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Acuan αὐτοῦ
  choice: Pronomina dipertahankan sebagai “-Nya”, dengan Allah sebagai acuan yang dipasok oleh konteks.
  alternative: Dibuat eksplisit sebagai “kerajaan Allah”.
  rationale: Konteks langsung berbicara tentang Bapa dan pemeliharaan Allah, sehingga acuannya jelas. Mempertahankan pronomina menjaga bentuk teks Yunani dan tidak membuat yang tersirat menjadi eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” memberi kontras yang wajar; “carilah” bersifat langsung dan mudah dipahami. Urutan penanda [b][a] dipertahankan sesuai teks konsultasi, dan setiap penanda muncul dalam teks utama.
