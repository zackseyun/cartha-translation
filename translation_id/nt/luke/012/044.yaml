  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: id
  text: Sesungguhnya, Aku berkata kepada kalian, tuannya akan mengangkat dia untuk mengurus seluruh milik tuannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh harta benda tuannya” atau “semua milik tuannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Sesungguhnya
  rationale: Menegaskan kebenaran dan kesungguhan pernyataan Yesus dengan ungkapan yang wajar serta bermartabat dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan pernyataan berwibawa; bentuk tunggal 'kepadamu' sesuai dengan ὑμῖν yang merujuk kepada para pendengar sebagai kelompok dalam konteks ini.
- source_word: ὅτι
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, isi ujaran dapat diperkenalkan langsung tanpa kata penghubung yang sepadan dengan 'bahwa', sehingga kalimat lebih alami.
- source_word: ἐπὶ
  choice: untuk mengurus
  rationale: Dalam konstruksi dengan καταστήσει, frasa ini menyatakan penempatan dalam kedudukan berwenang atau bertanggung jawab atas milik tuannya.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: segala miliknya
  rationale: Mencakup semua yang dimiliki sang tuan tanpa membatasi maknanya hanya pada jenis harta tertentu.
- source_word: καταστήσει
  choice: akan mengangkat
  rationale: Menyampaikan tindakan menetapkan seseorang pada suatu kedudukan atau tanggung jawab, bukan sekadar menempatkannya secara fisik.
- source_word: αὐτόν
  choice: dia
  rationale: Merujuk kepada hamba atau pengelola laki-laki dalam perumpamaan; bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga.
theological_decisions:
- issue: Subjek tersirat pada καταστήσει
  choice: Dinyatakan sebagai 'tuannya'
  alternative: Memakai 'ia' tanpa menyebut rujukannya
  rationale: Bentuk verba Yunani hanya menyatakan 'dia akan mengangkat', tetapi konteks langsung menunjuk kepada tuan dalam perumpamaan. 'Tuannya' memperjelas rujukan tanpa mengubah peran tokoh.
- issue: Gender tokoh dalam perumpamaan
  choice: Memakai pronomina alami bahasa Indonesia 'dia'
  alternative: Menambahkan penanda laki-laki seperti 'orang itu' atau 'hamba laki-laki itu'
  rationale: Bahasa Indonesia tidak memiliki pronomina orang ketiga bergender. 'Dia' mempertahankan rujukan tunggal tanpa memasukkan penandaan gender yang tidak diperlukan secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Sesungguhnya' mempertahankan penekanan formal ἀληθῶς, sedangkan 'mengangkat dia untuk mengurus' menyampaikan penetapan dalam tanggung jawab secara alami.
