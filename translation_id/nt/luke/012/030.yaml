  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: id
  text: Sebab bangsa-bangsa di dunia[a] mencari semua hal ini, tetapi Bapa kalian tahu bahwa kalian memerlukan hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang bukan Yahudi di dunia.” Kata Yunani yang digunakan dapat berarti “bangsa-bangsa” atau “orang-orang bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα γὰρ πάντα
  choice: Sebab semua hal ini
  rationale: Menampilkan hubungan alasan dari γάρ dan mempertahankan cakupan πᾶς serta rujukan demonstratif kepada kebutuhan jasmani yang disebut sebelumnya.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: bangsa-bangsa di dunia
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang-orang bukan Yahudi. Pilihan utama ini mempertahankan ungkapan yang luas tanpa mempersempitnya secara etnis; alternatif leksikal dicatat dalam catatan kaki.
- source_word: ἐπιζητοῦσιν
  choice: dikejar
  rationale: Bentuk ini menyampaikan pencarian atau pengejaran yang aktif dan sungguh-sungguh. Susunan pasif alami dalam bahasa Indonesia menempatkan 'semua hal ini' di depan, sesuai penekanan wacana Yunani.
- source_word: ὑμῶν δὲ ὁ πατήρ
  choice: tetapi Bapa kalian
  rationale: δὲ membentuk pertentangan, sedangkan ὑμῶν berbentuk jamak. 'Bapa kalian' mempertahankan sapaan kepada para murid tanpa menambahkan 'surgawi', yang tidak terdapat dalam ayat ini.
- source_word: οἶδεν
  choice: tahu
  rationale: Walaupun secara bentuk merupakan perfektum, οἶδα berfungsi dengan makna kini; 'tahu' adalah padanan Indonesia yang langsung dan alami.
- source_word: χρῄζετε τούτων
  choice: kalian memerlukan semuanya itu
  rationale: '''Memerlukan'' menyampaikan χρῄζω dalam ragam baku modern, dan ''semuanya itu'' mempertahankan rujukan eksplisit τούτων kepada hal-hal yang telah disebutkan.'
theological_decisions:
- issue: Pertentangan antara pengejaran dunia dan kepercayaan sebagai anak kepada Bapa
  choice: Mempertahankan 'bangsa-bangsa di dunia' dan 'Bapa kalian' tanpa perluasan tafsiran.
  alternative: Menerjemahkan ἔθνη sebagai 'orang-orang bukan Yahudi' atau menambahkan 'surgawi' pada 'Bapa'.
  rationale: Teks membandingkan pengejaran kebutuhan jasmani oleh bangsa-bangsa di dunia dengan pengetahuan Bapa akan kebutuhan para murid. Terjemahan tidak mempersempit ἔθνη ataupun memasukkan kata dari bagian paralel yang tidak terdapat dalam teks Lukas ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menandai bahwa kata ganti Yunani berbentuk jamak; 'Bapa' dipertahankan sebagai sebutan relasional bagi Allah.
