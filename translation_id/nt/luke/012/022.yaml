  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: id
  text: 'Lalu Ia berkata kepada murid-murid-Nya, “Karena itu Aku berkata kepada kalian: Jangan khawatir[a] tentang hidup kalian, tentang apa yang akan kalian makan; atau tentang tubuh kalian, tentang apa yang akan kalian kenakan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Jangan cemas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Lalu Ia berkata
  rationale: δέ merupakan penghubung ringan. “Lalu” menyampaikan kelanjutan narasi secara alami tanpa menambahkan pertentangan yang kuat.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Bentuk milik αὐτοῦ dinyatakan secara eksplisit, sedangkan μαθηταί secara wajar diterjemahkan “murid-murid” dalam konteks ini.
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini menunjuk kembali kepada pengajaran sebelumnya dan memperkenalkan kesimpulan atau akibat yang ditarik darinya.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Terjemahan ini mempertahankan tindakan berbicara dan sapaan orang kedua jamak ὑμῖν; “kalian” memperjelas bahwa semua murid disapa.
- source_word: μὴ μεριμνᾶτε
  choice: Jangan khawatir
  rationale: Dalam konteks ini μεριμνάω menunjuk pada kekhawatiran atau kecemasan mengenai kebutuhan hidup. “Jangan khawatir” alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: τῇ ψυχῇ
  choice: tentang hidup kalian
  rationale: Di sini ψυχή menunjuk pada kehidupan jasmani atau keberadaan seseorang yang memerlukan makanan, bukan secara khusus pada unsur rohani yang disebut “jiwa”.
- source_word: τί φάγητε
  choice: apa yang akan kalian makan
  rationale: Subjungtif aoris dalam pertanyaan tak langsung ini memiliki arah ke depan dan secara alami dinyatakan dengan “akan”.
- source_word: μηδὲ τῷ σώματι
  choice: ataupun tentang tubuh kalian
  rationale: μηδέ mengoordinasikan unsur larangan kedua. “Ataupun” mempertahankan kesejajaran antara hidup/makanan dan tubuh/pakaian.
- source_word: τί ἐνδύσησθε
  choice: apa yang akan kalian kenakan
  rationale: Bentuk medial ἐνδύω berarti mengenakan pakaian. “Kenakan” bermartabat dan jelas, serta sejajar dengan “apa yang akan kalian makan”.
theological_decisions:
- issue: Makna ψυχή dalam konteks ini
  choice: hidup
  alternative: jiwa
  rationale: Kesejajaran antara makanan bagi ψυχή dan pakaian bagi tubuh menunjukkan kehidupan duniawi atau keberadaan jasmani. Pilihan “hidup” mempertahankan daya praktis ayat ini tanpa memasukkan pandangan dualistis yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “kalian” dipakai untuk menampilkan bentuk orang kedua jamak dalam bahasa Yunani. Huruf kapital pada “Ia”, “Aku”, dan akhiran “-Nya” mengikuti kebiasaan penulisan rujukan ilahi dalam banyak terbitan Alkitab bahasa Indonesia.
