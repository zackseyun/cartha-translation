  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: id
  text: Ia juga berkata kepada orang banyak, “Ketika kalian melihat awan muncul di sebelah barat, kalian segera berkata, ‘Hujan lebat akan datang,’[a] dan begitulah yang terjadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hujan akan datang.” Kata Yunani ὄμβρος dapat berarti hujan secara umum atau, secara lebih khusus, hujan lebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ia juga berkata
  rationale: Imperfek Yunani memberi latar ujaran yang sedang berlangsung atau berulang. Dalam narasi Indonesia, “berkata” lebih alami daripada bentuk progresif yang kaku, sementara konteks tetap menunjukkan kelanjutan perkataan Yesus.
- source_word: δὲ καὶ
  choice: juga
  rationale: Menyampaikan unsur tambahan dan kelanjutan tanpa menerjemahkan δέ secara berlebihan.
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: Ungkapan Indonesia ini alami untuk kelompok-kelompok khalayak dan tidak memakai istilah “massa” yang dapat bernuansa modern-politis.
- source_word: Ὅταν ἴδητε
  choice: Ketika kalian melihat
  rationale: Ὅταν dengan subjungtif menyatakan keadaan umum yang dapat terjadi; “ketika” alami dalam bahasa Indonesia, sedangkan “kalian” mempertahankan orang kedua jamak.
- source_word: νεφέλην ἀνατέλλουσαν
  choice: awan muncul
  rationale: ἀνατέλλω secara harfiah dapat berarti terbit atau naik, tetapi untuk awan dalam pengamatan cuaca, “muncul” lebih alami dan tetap mempertahankan gambaran kemunculannya di cakrawala.
- source_word: ἐπὶ δυσμῶν
  choice: di sebelah barat
  rationale: Menjaga lokasi pengamatan di kawasan barat tanpa memaksakan “dari barat,” meskipun arah asal dapat tersirat oleh konteks.
- source_word: εὐθέως λέγετε
  choice: kalian segera berkata
  rationale: Mempertahankan daya εὐθέως dan tindakan kebiasaan dari bentuk kini λέγετε.
- source_word: Ὄμβρος
  choice: hujan lebat
  rationale: ὄμβρος dapat berarti hujan secara umum atau hujan deras. “Hujan lebat” menangkap kemungkinan intensitasnya, sementara alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Bentuk kini Yunani memiliki makna segera/akan tiba; “akan datang” merupakan prediksi cuaca yang idiomatis dalam bahasa Indonesia.
- source_word: καὶ γίνεται οὕτως
  choice: dan memang terjadilah demikian
  rationale: “Memang” menyampaikan penegasan bahwa peristiwa itu terjadi sesuai perkiraan, sedangkan “demikian” mempertahankan οὕτως.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lisan-naratif. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas. Pronomina “Ia” mengikuti gaya narasi yang bermartabat tanpa menambahkan nama yang tidak terdapat dalam ayat.
