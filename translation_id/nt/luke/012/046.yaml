  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: id
  text: Tuan dari hamba itu akan datang pada hari ketika ia tidak mengharapkannya dan pada saat yang tidak ia ketahui. Tuan itu akan membelahnya menjadi dua[a] dan menetapkan bagiannya di antara orang-orang yang tidak setia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menghukumnya dengan sangat berat.” Kata Yunani ini secara harfiah berarti “akan membelah menjadi dua.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang yang tidak percaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: tuan
  rationale: Dalam hubungan rumah tangga pada perumpamaan ini, κύριος menunjuk kepada tuan yang berkuasa atas seorang hamba, bukan dipakai secara langsung sebagai gelar kristologis.
- source_word: δοῦλος
  choice: hamba
  rationale: Bahasa Indonesia Alkitabiah yang wajar memakai 'hamba' untuk anggota rumah tangga yang berada di bawah kuasa tuannya; hubungan hierarkisnya tetap jelas dari frasa 'tuan hamba itu'.
- source_word: ἥξει
  choice: akan datang
  rationale: Bentuk mendatang ἥξει menyatakan kedatangan sang tuan dan diterjemahkan secara alami serta langsung.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: pada hari ketika ia tidak mengharapkannya
  rationale: προσδοκάω berarti mengharapkan atau menantikan. Akhiran '-nya' secara alami merujuk kepada kedatangan sang tuan tanpa menambahkan objek yang terlalu eksplisit.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: pada saat yang tidak diketahuinya
  rationale: Terjemahan ini mempertahankan arti γινώσκω sebagai 'mengetahui' dan membedakannya dari 'mengharapkan' pada klausa sebelumnya. 'Saat' lebih alami daripada 'jam' untuk waktu yang tidak ditentukan.
- source_word: διχοτομήσει
  choice: akan membelahnya menjadi dua
  rationale: Terjemahan ini mempertahankan arti leksikal dan gambaran keras διχοτομέω secara lebih tepat daripada memperluasnya menjadi 'mencincang'; kemungkinan makna idiomatis dicatat dalam catatan kaki.
- source_word: τὸ μέρος αὐτοῦ
  choice: bagiannya
  rationale: μέρος secara langsung berarti bagian atau jatah. 'Bagiannya' mempertahankan citra penetapan nasib tanpa mengubahnya menjadi istilah tempat yang lebih interpretatif.
- source_word: ἀπίστων
  choice: orang-orang yang tidak setia
  rationale: Dalam konteks perilaku hamba, arti ketidaksetiaan paling sesuai dengan alur perumpamaan. Kemungkinan arti 'orang-orang yang tidak percaya' tetap dicatat.
- source_word: θήσει
  choice: menetapkan
  rationale: τίθημι di sini bermakna menempatkan atau menentukan bagian seseorang bersama suatu kelompok; 'menetapkan' menyampaikan nuansa keputusan tersebut secara alami.
theological_decisions:
- issue: Apakah gambaran hukuman διχοτομήσει diterjemahkan secara harfiah atau dilunakkan menjadi hukuman berat
  choice: Mempertahankan gambaran 'membelahnya menjadi dua' dalam teks utama
  alternative: akan menghukumnya dengan sangat berat
  rationale: Makna konkret verba Yunani patut dipertahankan karena konteks tidak memastikan bahwa ungkapan itu semata-mata idiom. Catatan kaki menjaga kemungkinan penafsiran idiomatis tanpa mengurangi daya peringatan teks.
- issue: Apakah ἀπίστων berarti orang yang tidak setia atau orang yang tidak percaya
  choice: orang-orang yang tidak setia
  alternative: orang-orang yang tidak percaya
  rationale: Ketidaksetiaan cocok dengan tema langsung perumpamaan tentang hamba yang gagal menjalankan tanggung jawabnya, sedangkan arti yang berkaitan dengan ketidakpercayaan tetap mungkin dan disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Pronomina dibuat jelas dengan mengulang 'Tuan itu' pada kalimat kedua agar rujukan pelaku tidak rancu. Kedua penanda catatan kaki muncul dalam teks utama sesuai urutan [a], [b].
