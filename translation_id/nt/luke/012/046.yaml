  source_fidelity: 'Teks draf pada dasarnya setia pada Yunani: κύριος dan δοῦλος dipahami dalam relasi tuan-hamba, dua klausa waktu membedakan ‘mengharapkan’ (προσδοκᾷ) dari ‘mengetahui’ (γινώσκει), dan διχοτομήσει dipertahankan secara harfiah. Namun, ‘menetapkan bagiannya bersama’ kurang idiomatis dalam bahasa Indonesia dan kurang jelas sebagai penetapan nasib/lot dengan suatu kelompok.'
  naturalness: ‘Tuan dari hamba itu’ lebih lancar dan tidak berpotensi terbaca sebagai frasa nominal yang rapat. ‘Pada saat yang tidak ia ketahui’ lebih langsung daripada bentuk pasif ‘yang tidak diketahuinya’. ‘Menetapkan bagiannya di antara’ membuat konstruksi Yunani τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει dapat dipahami secara alami tanpa menghapus citra ‘bagian’ atau ‘jatah’.
  terminology: ‘Tuan’, ‘hamba’, ‘membelahnya menjadi dua’, dan ‘orang-orang yang tidak setia’ sesuai dengan konteks perumpamaan dan keputusan leksikal. Catatan untuk ‘orang-orang yang tidak percaya’ perlu dipertahankan karena ἀπίστων dapat juga bernuansa ‘tidak percaya’. Catatan pertama sebaiknya menyatakan alternatif idiomatis tanpa mengulangi secara tidak perlu makna harfiah yang sudah ada dalam teks utama.
