id: LUK.12.29
reference: Luke 12:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: id
  text: Kalian pun, janganlah mencari apa yang akan kalian makan dan apa yang akan kalian minum, dan janganlah gelisah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah khawatir” atau “janganlah merasa tidak tenteram”; ungkapan Yunaninya dapat menggambarkan keadaan terkatung-katung dalam ketidakpastian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina ini eksplisit dan jamak. “Kalian pun” mempertahankan penekanan kontekstual tanpa tambahan “kalian sendiri” yang terasa berat.
- source_word: ζητεῖτε
  choice: mencari
  rationale: Pilihan ini mempertahankan makna dasar ζητέω dan larangan terhadap pencarian yang menjadi pusat perhatian. Bentuk “janganlah” secara wajar menyampaikan larangan yang berlaku terus.
- source_word: τί φάγητε
  choice: apa yang akan kalian makan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa terbuka atau deliberatif mengenai kebutuhan makanan.
- source_word: τί πίητε
  choice: apa yang akan kalian minum
  rationale: Pilihan ini sejajar dengan frasa tentang makanan dan mempertahankan struktur Yunani.
- source_word: μετεωρίζεσθε
  choice: gelisah
  rationale: Dalam konteks ini kata tersebut menunjuk pada keadaan batin yang tidak tenang karena ketidakpastian. “Gelisah” alami dan tidak membatasi maknanya hanya pada rasa takut.
- source_word: καὶ ... καὶ ... καὶ
  choice: pun ... dan ... dan
  rationale: “Pun” pada awal kalimat menghubungkan perkataan ini dengan konteks sebelumnya serta menonjolkan para pendengar; dua “dan” berikutnya mempertahankan susunan kumulatif teks Yunani.
theological_decisions:
- issue: Apakah larangan ini menolak perencanaan biasa atau kebutuhan jasmani
  choice: Larangan terhadap pencarian yang disertai kegelisahan mengenai makanan dan minuman
  alternative: Larangan terhadap semua perencanaan untuk memperoleh makanan dan minuman
  rationale: Konteks membahas kegelisahan atas kebutuhan hidup. Terjemahan tetap menyampaikan perintah secara langsung tanpa mengubahnya menjadi ajaran asketis atau penolakan terhadap pemeliharaan kebutuhan jasmani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, gaya lugas dan bermartabat. “Janganlah” mempertahankan bobot perintah, sedangkan “gelisah” mudah dipahami pembaca umum.
