review_pass:
  verdict: approve
  source_fidelity: 'Teks Indonesia menyampaikan semua unsur Yunani: καὶ ὑμεῖς melalui “Kalian pun,” larangan berkelanjutan μὴ ζητεῖτε melalui “janganlah mencari,” dua pertanyaan tidak langsung yang sejajar tentang makan dan minum, serta μὴ μετεωρίζεσθε melalui “janganlah gelisah.” “Apa yang akan kalian makan/minum” adalah idiom Indonesia yang wajar untuk pertanyaan deliberatif ini dan tidak mengubahnya menjadi kepastian prediktif yang kaku.'
  naturalness: Bahasa ini baku, jelas, dan mengalir. “Janganlah” cocok dengan register pengajaran Yesus, sedangkan “gelisah” komunikatif dalam bahasa Indonesia modern. Susunan dengan pengulangan “dan” mempertahankan ritme kumulatif sumber tanpa terasa janggal.
  terminology: 'Tidak ada istilah teologis khusus yang memerlukan standardisasi dalam ayat ini. “Gelisah” merupakan pilihan yang aman bagi μετεωρίζεσθε: cukup luas untuk mencakup kegoncangan atau ketidakpastian batin, tanpa memaksakan tafsiran yang lebih sempit. Catatan kaki secara tepat memberi alternatif dan menjelaskan citra harfiahnya. Penanda [a] ditempatkan tepat pada kata yang dijelaskan.'
