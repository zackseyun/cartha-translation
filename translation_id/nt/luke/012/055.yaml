  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: id
  text: Dan ketika angin selatan bertiup, kalian berkata, ‘Udara akan sangat panas,’ dan hal itu pun terjadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: angin selatan
  rationale: Dalam konteks cuaca dan bersama partisipel πνέοντα (‘bertiup’), kata ini menunjuk pada angin yang datang dari selatan. Bahasa Indonesia secara alami menyatakannya sebagai ‘angin selatan’.
- source_word: πνέοντα
  choice: bertiup
  rationale: Partisipel kini ini menggambarkan angin yang sedang bertiup; bentuk ‘ketika ... bertiup’ alami dan tetap mempertahankan aspek pengamatan cuaca.
- source_word: λέγετε
  choice: kalian berkata
  rationale: Bentuk kini memiliki daya kebiasaan atau umum. ‘Kalian’ memperjelas bahwa orang kedua yang dimaksud berbentuk jamak.
- source_word: Καύσων
  choice: udara akan sangat panas
  rationale: Nomina ini menunjuk pada panas yang menyengat atau menindas. Ungkapan predikatif ini terdengar alami dalam bahasa Indonesia dan menyampaikan kuatnya panas tanpa memakai istilah modern yang terlalu khusus.
- source_word: ἔσται
  choice: akan
  rationale: Bentuk futur ini menyatakan ramalan mengenai keadaan cuaca yang akan terjadi.
- source_word: γίνεται
  choice: hal itu pun terjadi
  rationale: Verba ini menyatakan bahwa keadaan yang diramalkan benar-benar terjadi; ‘pun’ menegaskan kesesuaian antara perkataan dan kenyataan secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan ‘kalian’ dipakai untuk mempertahankan orang kedua jamak dalam λέγετε. Tidak diperlukan catatan kaki karena makna meteorologis νότον dan intensitas Καύσων dapat disampaikan secara wajar dalam teks utama.
