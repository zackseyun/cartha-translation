id: LUK.12.59
reference: Luke 12:59
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: id
  text: Aku berkata kepadamu, kamu sama sekali tidak akan keluar dari sana sampai kamu membayar lepton[a] yang terakhir sekalipun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “uang logam kecil.” Lepton adalah uang logam yang nilainya sangat kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Ungkapan sapaan langsung yang mempertahankan bentuk orang pertama tunggal dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: kamu sama sekali tidak akan keluar
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penyangkalan masa depan yang sangat tegas; 'sama sekali tidak akan' mempertahankan penekanan itu tanpa menjadi arkais.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia ini menunjuk gerak keluar dari tempat tersebut; 'dari sana' merupakan padanan Indonesia yang langsung dan alami.
- source_word: ἕως
  choice: sampai
  rationale: Menandai batas waktu berlangsungnya keadaan tidak dapat keluar.
- source_word: καὶ τὸ ἔσχατον
  choice: yang terakhir sekalipun
  rationale: καί bersifat intensif dan menekankan kelengkapan pembayaran; susunan 'yang terakhir sekalipun' secara alami menyampaikan arti 'bahkan yang terakhir'.
- source_word: λεπτόν
  choice: lepton
  rationale: Mempertahankan nama uang logam tertentu dalam latar sejarah teks; catatan kaki menjelaskan bahwa nilainya sangat kecil.
- source_word: ἀποδῷς
  choice: kamu membayar
  rationale: Dalam konteks utang dan penjara, verba ini berarti menyerahkan pembayaran yang diwajibkan. Klausa dengan 'sampai' sudah menyatakan bahwa keluarnya baru mungkin setelah pembayaran itu tuntas.
theological_decisions:
- issue: Acuan kiasan utang dan penjara
  choice: Mempertahankan gambaran utang, penahanan, dan pembayaran penuh tanpa menentukan acuan teologisnya.
  alternative: Menafsirkannya secara khusus sebagai peringatan hukum duniawi, penghakiman ilahi, atau hukuman penyucian setelah kematian.
  rationale: Ayat ini sendiri tidak mengidentifikasi secara eksplisit apa yang dilambangkan oleh penahanan dan pembayaran tersebut. Terjemahan dibiarkan konkret dan tidak memasukkan kesimpulan doktrinal belakangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan langsung yang jelas. Bentuk 'Aku' dipakai bagi Yesus dan 'kamu' bagi lawan bicara tunggal; susunan kalimat mempertahankan ketegasan peringatan serta citra hukum-ekonomi dalam teks sumber.
