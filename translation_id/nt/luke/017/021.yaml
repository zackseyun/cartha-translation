  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: id
  text: Orang juga tidak akan berkata, ‘Lihat, di sini!’ atau ‘Di sana!’ Sebab lihatlah, Kerajaan Allah ada di tengah-tengah kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ada di dalam kalian.” Frasa Yunani ini dapat berarti secara batiniah atau secara korporat, seperti “di antara kalian” atau “di tengah-tengah kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Orang juga tidak akan berkata
  rationale: Melanjutkan penyangkalan pada pernyataan sebelumnya secara alami dalam bahasa Indonesia; subjek tak tentu ‘orang’ sesuai dengan bentuk orang ketiga jamak Yunani.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘Lihat, di sini!’ atau, ‘Di sana!’
  rationale: Mempertahankan penunjukan dua lokasi yang berlawanan; ‘lihat’ merupakan penarik perhatian yang wajar dalam bahasa Indonesia modern.
- source_word: γὰρ ἰδοὺ
  choice: Sebab, lihatlah
  rationale: ‘Sebab’ mempertahankan hubungan penjelas, sedangkan ‘lihatlah’ mempertahankan daya penarik perhatian dari ἰδοὺ tanpa memakai bentuk arkais.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan transparan yang mempertahankan dimensi pemerintahan rajawi maupun realitas kerajaan.
- source_word: ἐντὸς ὑμῶν
  choice: di tengah-tengah kalian
  rationale: Dalam konteks sapaan kepada kelompok jamak, pilihan ini menyampaikan makna korporat ‘di antara/di tengah kalian’; kemungkinan makna batiniah tetap dicatat dalam catatan kaki.
- source_word: ἐστιν
  choice: ada
  rationale: Secara alami menyatakan keberadaan atau kehadiran Kerajaan Allah dalam konstruksi lokatif bahasa Indonesia.
theological_decisions:
- issue: Makna ἐντὸς ὑμῶν
  choice: Kerajaan Allah ada di tengah-tengah kalian
  alternative: Kerajaan Allah ada di dalam diri kalian
  rationale: Frasa Yunani ini sungguh ambigu. Konteks tentang lokasi yang dapat ditunjuk dan sapaan jamak mendukung makna korporat sebagai teks utama, tetapi makna batiniah tetap mungkin secara leksikal dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk menandai dengan jelas bahwa ὑμῶν berbentuk jamak. Pengulangan unsur perhatian Yunani dipertahankan dengan ‘Lihat’ dan ‘lihatlah’.
