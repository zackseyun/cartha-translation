  source_fidelity: 'Terjemahan menyampaikan unsur-unsur utama teks Yunani dengan tepat: tanggapan jamak kepada Yesus, pertanyaan lokasi, sapaan «Tuhan», serta pepatah mengenai tubuh dan burung pemakan bangkai yang akan terkumpul. Penggabungan partisip «menjawab» dan verba ujaran menjadi “Mereka menanggapi-Nya” merupakan penyederhanaan yang wajar dalam bahasa Indonesia dan tidak mengubah makna.'
  naturalness: Bahasanya baku, modern, dan lancar. “Di mana ada tubuh, di situ pula ... akan terkumpul” mempertahankan bentuk pepatah dan terdengar alami. “Burung-burung nasar” jelas serta sesuai dengan konteks bangkai.
  terminology: “Tuhan” merupakan padanan yang layak untuk κύριε dalam sapaan kepada Yesus. “Tubuh” mempertahankan keluasan σῶμα, sementara catatan kaki secara tepat mencatat kemungkinan “mayat.” “Burung-burung nasar” menyampaikan pengertian kontekstual ἀετοί tanpa menghilangkan alternatif “rajawali” dalam catatan kaki. Penanda [b] dan [a] terpasang pada unsur yang dijelaskan.
