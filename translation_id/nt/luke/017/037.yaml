id: LUK.17.37
reference: Luke 17:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: id
  text: Mereka menanggapi-Nya, “Di mana, Tuhan?” Dia berkata kepada mereka, “Di mana ada tubuh[b], di situ pula burung-burung nasar[a] akan terkumpul.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rajawali.” Kata Yunani ini dapat berarti rajawali, tetapi dalam konteks burung yang berkumpul di sekitar tubuh, “burung nasar” kemungkinan menyampaikan maksudnya dengan lebih jelas.
    reason: lexical_alternative
  - marker: b
    text: “Tubuh” juga dapat diterjemahkan “mayat,” sehingga gambaran burung pemakan bangkai menjadi lebih jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: menanggapi-Nya
  rationale: Bentuk partisip ini memperkenalkan tanggapan para murid. Pilihan ini mempertahankan fungsi responsifnya tanpa menghasilkan susunan bahasa Indonesia yang kaku.
- source_word: λέγουσιν
  choice: '[tersirat dalam] menanggapi-Nya'
  rationale: Verba present historis Yunani menyertai partisip dan memperkenalkan ucapan langsung. Dalam bahasa Indonesia, menggabungkannya menjadi satu verba pengantar lebih alami dan tidak mengurangi isi.
- source_word: Ποῦ
  choice: Di mana
  rationale: Kata tanya ini meminta keterangan tempat; “Di mana?” merupakan padanan Indonesia yang langsung dan alami.
- source_word: κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini diterjemahkan dengan gelar yang lazim dan sesuai konteks, tanpa mempersempit kemungkinan nuansa penghormatan yang terkandung dalam κύριος.
- source_word: Ὅπου
  choice: Di mana
  rationale: Susunan ini bersifat pepatah. “Di mana” mempertahankan sifat umum pernyataannya tanpa menambahkan penafsiran.
- source_word: σῶμα
  choice: tubuh
  rationale: Arti dasarnya ialah “tubuh.” Konteks burung pemakan bangkai menyiratkan tubuh yang mati, tetapi teks utama tidak dibuat lebih eksplisit daripada bahasa Yunani.
- source_word: ἀετοὶ
  choice: burung-burung nasar
  rationale: Kata Yunani ini dapat menunjuk rajawali, tetapi dalam gambaran burung yang berkumpul di sekitar tubuh, “burung nasar” paling jelas menyampaikan kemungkinan makna kontekstual sebagai burung pemakan bangkai. Alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: ἐπισυναχθήσονται
  choice: akan terkumpul
  rationale: Bentuk ini menyampaikan hasil berkumpul dan tetap dekat dengan bentuk pasif Yunani, sambil menghindari frasa “akan dikumpulkan” yang dalam bahasa Indonesia dapat terlalu menonjolkan pelaku yang tidak disebutkan.
theological_decisions:
- issue: Makna kiasan pepatah mengenai tubuh dan burung nasar
  choice: Gambaran diterjemahkan apa adanya tanpa menentukan rujukannya.
  alternative: Menafsirkannya secara eksplisit sebagai pasukan Romawi, penghakiman terakhir, atau prinsip umum tentang penghakiman yang tidak terelakkan.
  rationale: Teks Yunani tidak mengidentifikasi rujukan gambaran tersebut. Membiarkannya tetap terbuka mempertahankan ketegangan eskatologis dan keragaman kemungkinan penafsiran.
- issue: Kemungkinan nuansa pasif pada ἐπισυναχθήσονται
  choice: “akan terkumpul,” tanpa menyebutkan pelaku
  alternative: “akan dikumpulkan,” yang dapat lebih kuat mengisyaratkan pelaku ilahi; atau “akan berkumpul,” yang sepenuhnya aktif
  rationale: Pilihan ini mempertahankan ketidakjelasan mengenai apakah bentuk pasif hanya menggambarkan hasil atau menyiratkan pihak yang mengumpulkan.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada ringkas, wajar, dan bermartabat. Struktur pepatah dipertahankan. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya: [b] sesudah “tubuh” dan [a] sesudah “burung-burung nasar”.'
