  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: id
  text: Dan para rasul berkata kepada Tuhan, “Tingkatkanlah[a] iman[b] kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Tambahkanlah iman kepada kami.” Dalam konteks ini kata Yunani yang berarti “tambahkanlah” secara idiomatis bermakna “tingkatkanlah”.
    reason: lexical_alternative
  - marker: b
    text: Kata “iman” juga dapat dipahami sebagai “kepercayaan”; dalam konteks lain kata Yunani ini dapat berarti “kesetiaan”, tetapi makna itu kurang mungkin di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Kata penghubung ini meneruskan alur narasi. “Lalu” terdengar alami dalam bahasa Indonesia tanpa mengubah hubungan antarkalimat secara berlebihan.
- source_word: εἶπαν
  choice: berkata
  rationale: Bentuk aoris indikatif menyatakan tindakan naratif sederhana; “berkata” merupakan padanan Indonesia yang wajar.
- source_word: οἱ ἀπόστολοι
  choice: para rasul
  rationale: “Rasul” adalah istilah Indonesia yang mapan bagi ἀπόστολος dalam Lukas–Kisah Para Rasul, sedangkan “para” menandai bentuk jamak dengan alami.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: κύριος di sini adalah gelar dan sapaan bagi Yesus. “Tuhan” mempertahankan bobot penghormatan dan resonansi kristologisnya.
- source_word: Πρόσθες
  choice: Tingkatkanlah
  rationale: Secara harfiah verba ini berarti “tambahkanlah”, tetapi bersama πίστιν permintaan tersebut secara idiomatis berarti membuat iman mereka bertambah atau menjadi lebih besar.
- source_word: ἡμῖν
  choice: kami
  rationale: Datif ἡμῖν secara harfiah berarti “kepada kami”, tetapi konstruksi Indonesia yang alami dengan “tingkatkanlah” adalah “iman kami”.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada iman atau kepercayaan para rasul; “iman” adalah istilah Indonesia yang mapan dan mempertahankan nuansa teologisnya.
theological_decisions:
- issue: Gelar κύριος bagi Yesus
  choice: Tuhan
  alternative: tuan
  rationale: “Tuhan” mempertahankan baik fungsi sapaan penuh hormat maupun bobot kristologis gelar itu dalam Injil Lukas; “tuan” dapat mengecilkan resonansi tersebut.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Permintaan agar πίστις ditingkatkan paling alami dipahami sebagai permintaan akan iman atau kepercayaan yang lebih besar. Makna “kesetiaan” termasuk dalam rentang semantis kata itu, tetapi kurang mungkin dalam konteks ini dan tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk permintaan langsung serta ketegangan makna πίστις.
