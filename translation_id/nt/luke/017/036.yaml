  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: id
  text: Dua orang[a] akan berada di ladang; yang seorang akan dibawa, dan yang lain akan ditinggalkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Kodeks Sinaitikus dan Vatikanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Namun, ayat ini terdapat dalam tradisi Barat, seperti Kodeks Bezae dari abad ke-5, dalam tradisi mayoritas Bizantin, dan dalam Vulgata Latin. Kemungkinan ayat ini ditambahkan oleh para penyalin kemudian untuk menyelaraskan bagian ini dengan Matius 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: dua orang
  rationale: Kata bilangan ini berdiri sendiri dan mengacu kepada dua orang; penambahan “orang” diperlukan agar wajar dan jelas dalam bahasa Indonesia tanpa menentukan jenis kelamin yang tidak dinyatakan dalam teks Yunani.
- source_word: παραληφθήσεται
  choice: akan dibawa
  rationale: Bentuk pasif futur dari παραλαμβάνω dapat berarti membawa atau menerima seseorang bersama; “akan dibawa” mempertahankan kontras dengan “akan ditinggalkan” tanpa memastikan tujuan atau nasib orang tersebut.
- source_word: ἀφεθήσεται
  choice: akan ditinggalkan
  rationale: Dalam pasangan kontras ini, ἀφίημι berarti membiarkan atau meninggalkan; “akan ditinggalkan” merupakan padanan Indonesia yang alami dan tetap mempertahankan bentuk pasif.
- source_word: ὁ ἕτερος
  choice: yang lain
  rationale: Mengacu kepada orang kedua dari dua orang yang sudah disebut dan berpasangan secara alami dengan “yang seorang” dalam bahasa Indonesia.
theological_decisions:
- issue: Nasib orang yang dibawa dan orang yang ditinggalkan
  choice: Tidak menjelaskan apakah dibawa berarti diselamatkan atau dihukum
  alternative: Menafsirkan secara eksplisit bahwa yang dibawa dikumpulkan untuk keselamatan
  rationale: Ayat ini hanya menyatakan kontras antara dibawa dan ditinggalkan; arah serta nilai teologis tindakan itu tidak dijelaskan secara eksplisit dan perlu dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “yang seorang ... yang lain” dipilih agar kontras dua orang terdengar alami. Penanda catatan ditempatkan setelah “dua orang” untuk menunjukkan bahwa catatan menyangkut keberadaan seluruh ayat, bukan hanya kata tersebut.
