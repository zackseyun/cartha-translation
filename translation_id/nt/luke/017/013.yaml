  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: id
  text: Lalu mereka berseru dengan suara keras[a], “Yesus, Guru[b], kasihanilah kami!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mengangkat suara.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “Guru” adalah epistata, sapaan bagi seseorang yang memiliki wewenang; ini bukan kata yang biasa diterjemahkan “Tuhan” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi bahasa Indonesia, penghubung ini wajar dinyatakan melalui kesinambungan kalimat tanpa harus diterjemahkan secara harfiah sebagai “dan”; “lalu” memberi kelancaran naratif tanpa menambahkan jeda panjang.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Pronomina eksplisit dipertahankan sebagai subjek. Penegasan tambahan seperti “mereka sendiri” akan terdengar berlebihan dalam konteks ini.
- source_word: ἦραν φωνὴν
  choice: berseru dengan suara keras
  rationale: Ungkapan harfiah “mengangkat suara” berarti menyuarakan panggilan dengan keras. Pilihan ini alami dalam bahasa Indonesia dan tetap menyatakan volume serta urgensinya.
- source_word: λέγοντες
  choice: —
  rationale: Partisipel “sambil berkata” dilebur secara alami ke dalam kutipan langsung sesudah verba “berseru”; maknanya tetap hadir tanpa ungkapan yang kaku.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk vokatif nama diri diterjemahkan dengan bentuk baku bahasa Indonesia.
- source_word: ἐπιστάτα
  choice: Guru
  rationale: Sapaan ini menunjuk kepada seseorang yang memiliki wewenang atau kepemimpinan. “Guru” merupakan sapaan Indonesia yang alami bagi Yesus dan tidak menyamakannya dengan κύριος, “Tuhan”.
- source_word: ἐλέησον
  choice: kasihanilah
  rationale: Imperatif aoris ini merupakan permohonan mendesak agar Yesus berbelas kasih dan bertindak menolong. “Kasihanilah” mempertahankan bentuk permohonan langsung.
- source_word: ἡμᾶς
  choice: kami
  rationale: Objek orang pertama jamak eksklusif secara tepat dinyatakan dengan “kami”, yakni para pemohon dan bukan Yesus yang mereka sapa.
theological_decisions:
- issue: Sapaan ἐπιστάτα kepada Yesus
  choice: Guru
  alternative: Tuan; Tuhan
  rationale: ἐπιστάτα menyatakan kewenangan, tetapi bukan kata κύριος. “Tuhan” akan mengaburkan perbedaan leksikal dan dapat memasukkan bobot kristologis yang tidak secara khusus dikandung kata ini. “Guru” mempertahankan sapaan hormat yang lazim kepada Yesus, sedangkan catatan kaki menjelaskan unsur kewenangannya.
- issue: Makna permohonan ἐλέησον
  choice: kasihanilah kami
  alternative: berbelaskasihanlah kepada kami; tolonglah kami
  rationale: Pilihan ini mempertahankan permohonan akan belas kasihan tanpa mempersempitnya hanya menjadi satu bentuk pertolongan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Berseru dengan suara keras” mudah dipahami pembaca umum, sedangkan “kasihanilah kami” mempertahankan kesungguhan permohonan. Semua penanda catatan kaki dicantumkan dalam teks utama.
