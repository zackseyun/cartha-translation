  naturalness: “Kawin dan dikawinkan” terasa kurang alami dalam ragam Indonesia modern untuk manusia dan “kawin” juga lazim berkonotasi reproduksi hewan. “Menikah dan dinikahkan” tetap ringkas, jelas, serta mempertahankan kontras aktif–pasif. Susunan selebihnya alami dan bermartabat.
  terminology: “Nuh,” “bahtera,” dan “air bah” adalah istilah yang mapan dan tepat dalam konteks kisah Nuh. “Membinasakan mereka semua” menyampaikan cakupan πάντας tanpa menambah makna.
