id: LUK.17.27
reference: Luke 17:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: id
  text: Mereka makan dan minum, menikah dan dinikahkan,[a] sampai pada hari ketika Nuh masuk ke dalam bahtera. Lalu datanglah air bah dan membinasakan mereka semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai dua verba yang berbeda: yang pertama aktif (“menikah”) dan yang kedua pasif (“dinikahkan”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: mereka makan dan minum
  rationale: Imperfek menggambarkan kegiatan yang sedang berlangsung atau lazim dilakukan pada masa itu. Dalam bahasa Indonesia, bentuk sederhana dengan konteks temporal sudah menyampaikan keadaan berkelanjutan secara lebih alami daripada pengulangan 'sedang'.
- source_word: ἐγάμουν
  choice: kawin
  rationale: Bentuk aktif γαμέω berarti menikah atau mengambil pasangan. 'Kawin' memungkinkan pasangan aktif-pasif dengan verba berikutnya dipertahankan secara ringkas dan alami.
- source_word: ἐγαμίζοντο
  choice: dikawinkan
  rationale: Bentuk pasif γαμίζω dipertahankan untuk mencerminkan tindakan seseorang yang dikawinkan atau diberikan dalam perkawinan, tanpa menentukan pelaku maupun gender yang tidak dinyatakan secara eksplisit dalam bentuk ini.
- source_word: ἄχρι ἧς ἡμέρας
  choice: sampai pada hari ketika
  rationale: Ungkapan ini menandai batas waktu berlangsungnya kegiatan-kegiatan tersebut dan menghubungkannya secara jelas dengan masuknya Nuh ke bahtera.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nuh masuk ke dalam bahtera
  rationale: Terjemahan langsung dan idiomatis; 'bahtera' merupakan istilah Indonesia yang mapan bagi κιβωτός dalam kisah Nuh.
- source_word: ὁ κατακλυσμός
  choice: air bah
  rationale: '''Air bah'' merupakan ungkapan Indonesia yang lazim dan bermartabat untuk banjir besar dalam kisah Nuh.'
- source_word: ἀπώλεσεν πάντας
  choice: membinasakan mereka semua
  rationale: πάντας menunjuk kepada semua orang yang sedang dibicarakan. 'Mereka semua' membuat objek manusia yang tersirat menjadi jelas dan mempertahankan cakupan menyeluruhnya.
theological_decisions:
- issue: Pembedaan dua verba perkawinan
  choice: kawin dan dikawinkan
  alternative: menikah dan dinikahkan; kawin-mengawinkan
  rationale: Teks Yunani memakai dua verba berbeda, satu aktif dan satu pasif. Pembedaan ini dipertahankan tanpa menambahkan penafsiran teologis atau perincian gender.
- issue: Aspek rangkaian verba imperfek
  choice: bentuk sederhana Indonesia dalam rangkaian kegiatan yang berkelanjutan
  alternative: mereka sedang makan, sedang minum, sedang kawin, dan sedang dikawinkan
  rationale: Imperfek menggambarkan kehidupan biasa yang terus berlangsung sampai datangnya penghakiman. Bahasa Indonesia tidak wajib menandai aspek berkelanjutan pada setiap verba; konteks 'sampai pada hari ketika' mempertahankan nuansa itu secara alami.
- issue: Hubungan datangnya air bah dengan kebinasaan menyeluruh
  choice: Lalu datanglah air bah dan membinasakan mereka semua
  alternative: air bah datang, lalu membinasakan mereka semua
  rationale: Susunan ini mempertahankan dua verba yang dikoordinasikan dalam bahasa Yunani serta penekanan naratif pada kedatangan air bah dan akibatnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Inversi 'datanglah air bah' memberi tekanan naratif tanpa menjadi arkais. 'Kawin dan dikawinkan' mempertahankan pasangan aktif-pasif sumber, sedangkan catatan kaki memberikan padanan modern yang lebih eksplisit.
