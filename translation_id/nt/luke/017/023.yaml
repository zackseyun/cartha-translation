  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: id
  text: Lalu orang-orang akan berkata kepadamu, “Lihat, di sana!” atau “Lihat, di sini!” Jangan pergi dan jangan mengejar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani tidak menyatakan objek dari kata “mengejar”.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐροῦσιν
  choice: akan berkata
  rationale: Bentuk futur aktif λέγω secara alami memperkenalkan ucapan langsung dengan ‘akan berkata’.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Kata penarik perhatian ini diterjemahkan secara lugas dan modern tanpa memakai bentuk arkais.
- source_word: ἐκεῖ / ὧδε
  choice: di sana / di sini
  rationale: Pasangan penunjuk tempat yang kontras dipertahankan secara ringkas dan idiomatis.
- source_word: μὴ ἀπέλθητε
  choice: Jangan pergi
  rationale: Larangan ini memperingatkan para pendengar agar tidak beranjak sebagai tanggapan terhadap seruan tersebut; ‘pergi’ alami dan tidak mempersempit arah geraknya.
- source_word: μηδὲ διώξητε
  choice: dan jangan mengejarnya
  rationale: διώκω menyatakan tindakan mengejar atau mengikuti; objek tunggal netral ‘-nya’ menunjuk secara terbuka kepada apa yang diklaim berada ‘di sana’ atau ‘di sini’, tetapi karena objek Yunani tidak dinyatakan, hal itu dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Objek διώξητε tidak dinyatakan dalam teks Yunani
  choice: Menyediakan objek pronominal ‘-nya’ demi kelancaran bahasa Indonesia, disertai catatan kaki
  alternative: ‘jangan pergi ataupun mengejar’ tanpa objek
  rationale: Bahasa Yunani membiarkan objeknya tersirat. ‘-nya’ membuat kalimat Indonesia alami tanpa secara khusus menetapkan apakah yang dimaksud ialah orang, kabar, atau klaim tertentu; catatan kaki mempertahankan ambiguitas sumber.
- issue: Seruan penunjuk tempat yang berpasangan
  choice: “Lihat, di sana!” atau, “Lihat, di sini!”
  alternative: “Lihatlah, di sana! Lihatlah, di sini!”
  rationale: Terjemahan mempertahankan ketegasan dan kontras lokasi tanpa menambahkan penafsiran eskatologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. ‘Lihat’ lebih wajar bagi pembaca masa kini daripada bentuk yang bernuansa arkais, sedangkan pengulangan struktur ‘di sana/di sini’ mempertahankan daya retoris teks sumber.
