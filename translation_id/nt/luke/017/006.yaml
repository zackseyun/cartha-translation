id: LUK.17.6
reference: Luke 17:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: id
  text: Lalu Tuhan berkata, “Sekiranya kamu mempunyai iman seperti sebutir biji sesawi, kamu akan berkata kepada pohon murbei[a] ini, ‘Tercabutlah dan tertanamlah di laut,’ dan pohon itu akan menaati kamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon sikamin,” sebutan tradisional bagi jenis pohon murbei ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar naratif dan kristologis yang lazim bagi Yesus dalam Injil Lukas.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini menunjuk pada kepercayaan kepada Allah, bukan terutama kesetiaan sebagai sifat moral.
- source_word: ὡς κόκκον σινάπεως
  choice: seperti sebutir biji sesawi
  rationale: Mempertahankan bentuk perbandingan tanpa membatasinya secara eksplisit hanya pada ukuran yang kecil.
- source_word: συκαμίνῳ
  choice: pohon murbei
  rationale: Padanan modern yang jelas bagi συκάμινος; istilah ini berbeda dari pohon ara-murbei atau sycamore-fig.
- source_word: ἐλέγετε ἂν
  choice: kamu akan berkata
  rationale: Menyampaikan daya potensial dari bentuk imperfek dengan ἄν dalam konstruksi bersyarat secara wajar dalam bahasa Indonesia.
- source_word: Ἐκριζώθητι
  choice: Tercabutlah sampai ke akar-akarmu
  rationale: Mengungkapkan imperatif pasif secara hidup dan memperjelas unsur akar yang terkandung dalam verba Yunani.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: tertanamlah di laut
  rationale: Mempertahankan imperatif pasif dan gambaran paradoksal tentang penanaman di laut tanpa menambahkan gagasan pemindahan.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: pohon itu akan menaati kamu
  rationale: ‘Menaati’ paling sesuai dengan gambaran sebuah perintah yang dilaksanakan; subjek disebut kembali agar jelas dan alami.
theological_decisions:
- issue: Makna πίστις dalam perkataan tentang mukjizat
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks menekankan kepercayaan kepada Allah yang terkait dengan hal yang mustahil, bukan terutama keteguhan atau kesetiaan moral.
- issue: Nuansa konstruksi bersyarat
  choice: Sekiranya kamu mempunyai iman ... kamu akan berkata
  alternative: Jika kamu mempunyai iman ... kamu dapat berkata
  rationale: ‘Sekiranya’ menjaga nuansa hipotetis dari εἰ dengan bentuk-bentuk ber-ἄν tanpa memutuskan secara berlebihan apakah para murid sama sekali tidak mempunyai iman; ‘akan’ mempertahankan kesejajaran kedua akibat potensial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah pasif dipertahankan untuk menjaga daya retoris dan gambaran mustahil dalam teks Yunani. Penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskan.
