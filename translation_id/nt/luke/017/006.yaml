  to: Lalu Tuhan berkata, “Sekiranya kamu mempunyai iman seperti sebutir biji sesawi, kamu akan berkata kepada pohon murbei[a] ini, ‘Tercabutlah dan tertanamlah di laut,’ dan pohon itu akan menaati kamu.”
