review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena frasa “Tercabutlah sampai ke akar-akarmu” tidak menyampaikan imperatif pasif ἐκριζώθητι secara tepat. Verba Yunani berarti “tercabutlah/tercabut sampai ke akar,” tetapi tidak memuat gagasan arah “sampai ke akar-akarmu”; akhiran -mu juga membuat pohon seolah-olah diajak bicara dengan struktur yang janggal. Bentuk kondisional “Sekiranya ... kamu akan berkata ... akan menaati” cukup mempertahankan daya hipotesis ἄν.
  naturalness: Secara umum bahasanya baku dan jelas. Mengganti perintah pertama dengan “Tercabutlah” menghasilkan perintah yang lebih alami, padat, dan setia pada citra retoris teks sumber.
  terminology: “Tuhan,” “iman,” “sebutir biji sesawi,” dan “pohon murbei” sesuai. Catatan “pohon sikamin” tepat sebagai alternatif leksikal tradisional dan penandanya terpasang pada istilah yang relevan.
  issues:
  - severity: medium
    issue: “Tercabutlah sampai ke akar-akarmu” menambahkan dan mengaburkan relasi yang tidak ada dalam teks sumber.
    rationale: ἐκριζώθητι adalah imperatif pasif “tercabutlah/be uprooted.” Makna akar sudah tercakup dalam verba tersebut, tetapi Yunani tidak mengatakan “sampai ke akar-akarmu.” Bentuk itu juga kurang wajar sebagai ujaran kepada pohon.
