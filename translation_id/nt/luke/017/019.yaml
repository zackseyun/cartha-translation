  verdict: approve
  source_fidelity: Teks Indonesia secara akurat menerjemahkan καὶ εἶπεν αὐτῷ, Ἀναστὰς πορεύου, dan ἡ πίστις σου σέσωκέν σε. “Bangkitlah dan pergilah” menangkap daya imperatif dari partisip Ἀναστάς dan imperatif πορεύου. “Imanmu telah menyelamatkanmu” mempertahankan keluasan σέσωκέν σε serta aspek perfeknya, tanpa mereduksinya menjadi kesembuhan fisik saja.
  naturalness: Bahasa Indonesia baku, modern, ringkas, dan bernada wajar untuk narasi serta ujaran langsung. “Lalu Ia berkata kepadanya” dan “Bangkitlah dan pergilah” terdengar alami dalam register Alkitab modern.
  terminology: “Iman” merupakan padanan utama yang tepat untuk πίστις, dan “telah menyelamatkanmu” tepat untuk σῴζω dalam konteks ini. Catatan kaki secara memadai menyatakan kemungkinan nuansa percaya, kesetiaan, penyembuhan, dan pemulihan. Penanda [a] dan [b] telah ditempatkan pada kata yang dijelaskan masing-masing.
