id: LUK.17.19
reference: Luke 17:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: id
  text: Lalu Ia berkata kepadanya, “Bangkitlah dan pergilah; imanmu[a] telah menyelamatkanmu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaanmu” atau “sikap percayamu.” Kata Yunani ini juga dapat menyatakan kepercayaan atau kesetiaan, meskipun “iman” merupakan padanan utama di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah menyembuhkanmu” atau “telah membuatmu pulih.” Kata kerja Yunani ini dapat mengacu pada penyelamatan, pelepasan, atau kesembuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Padanan naratif yang alami dan tidak menambahkan identitas atau keterangan yang tidak dinyatakan dalam teks Yunani.
- source_word: Ἀναστὰς
  choice: Bangkitlah
  rationale: Partisip aoris ini berfungsi bersama perintah berikutnya. “Bangkitlah” mempertahankan daya perintah yang ringkas dan sesuai dengan konteks orang itu yang sebelumnya tersungkur di kaki Yesus.
- source_word: πορεύου
  choice: pergilah
  rationale: Padanan imperatif yang jelas, wajar, dan bermartabat untuk πορεύομαι.
- source_word: πίστις
  choice: iman
  rationale: “Iman” merupakan padanan utama yang lazim, sementara nuansa “kepercayaan” tetap dicatat karena kata Yunani ini dapat menunjuk pada tindakan percaya atau bersandar kepada seseorang.
- source_word: σέσωκέν
  choice: telah menyelamatkan
  rationale: Bentuk perfek Yunani menyatakan tindakan dengan hasil yang tetap. “Telah menyelamatkan” mempertahankan keluasan makna σῴζω dan tidak membatasinya hanya pada kesembuhan jasmani.
- source_word: σε
  choice: -mu
  rationale: Pronomina objek orang kedua tunggal dinyatakan secara alami melalui akhiran “-mu” pada kata kerja bahasa Indonesia.
theological_decisions:
- issue: Makna σέσωκέν σε dalam konteks penyembuhan
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu; telah membuatmu pulih
  rationale: σῴζω dapat berarti menyelamatkan, melepaskan, atau menyembuhkan. Karena kesepuluh orang sebelumnya telah ditahirkan, sedangkan orang ini kembali untuk memuliakan Allah, terjemahan utama mempertahankan kemungkinan makna keselamatan yang lebih luas tanpa meniadakan nuansa kesembuhan.
- issue: Makna πίστις dalam perkataan Yesus
  choice: iman
  alternative: kepercayaan; sikap percaya
  rationale: Dalam konteks ini πίστις menunjuk pada respons percaya orang tersebut kepada Yesus. “Iman” dipakai sebagai padanan utama, tetapi catatan kaki mempertahankan nuansa kepercayaan yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Ia” mempertahankan rujukan pronominal sumber tanpa menambahkan nama Yesus. Urutan penanda catatan kaki disesuaikan dengan unsur yang dijelaskannya agar mudah dipahami.
