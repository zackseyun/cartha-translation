  text: μνημονεύετε τῆς γυναικὸς Λώτ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: id
  text: Ingatlah istri Lot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merujuk pada Kejadian 19:26, ketika istri Lot menoleh ke belakang pada waktu Sodom dimusnahkan.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Ingatlah
  rationale: Bentuk imperatif kini aktif orang kedua jamak menyampaikan seruan langsung kepada para pendengar. Bahasa Indonesia tidak menandai jumlah pada bentuk imperatif ini; “Ingatlah” alami, tegas, dan tidak memaksakan nuansa aspek yang tidak dapat dinyatakan secara ringkas.
- source_word: τῆς γυναικὸς
  choice: istri
  rationale: γυνή dapat berarti “perempuan” atau “istri”, tetapi konstruksi dengan nama Lot menunjukkan hubungan perkawinan. Ungkapan “istri Lot” merupakan bentuk Indonesia yang alami bagi frasa harfiah “istri dari Lot”.
- source_word: Λώτ
  choice: Lot
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk baku Alkitab dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk peringatan dan alusi
  choice: 'Mempertahankan perintah singkat dan langsung: “Ingatlah istri Lot.”'
  alternative: “Ingatlah akan istri Lot.” atau “Ingatlah istri dari Lot.”
  rationale: Ucapan ini merupakan peringatan ringkas yang merujuk pada kejadian dalam Kejadian 19:26. Bentuk pilihan mempertahankan daya perintah teks Yunani sekaligus memakai susunan yang alami dalam bahasa Indonesia, tanpa menambahkan penafsiran tentang alasan atau cara mengingatnya.
translation_notes:
  register: Bahasa modern, ringkas, dan berwibawa. “Ingatlah” mempertahankan nada nasihat-peringatan; susunan “istri Lot” lebih alami daripada bentuk genitif yang terlalu harfiah.
