id: LUK.17.34
reference: Luke 17:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: id
  text: 'Aku berkata kepadamu: Pada malam itu, akan ada dua orang di satu tempat tidur; yang seorang akan dibawa[a], dan yang lain akan ditinggalkan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dibawa serta”; verba Yunani di sini tidak dengan sendirinya menyatakan apakah orang itu dibawa untuk diselamatkan atau untuk dihukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dibiarkan”; “ditinggalkan” tidak dimaksudkan untuk memasukkan pengertian eskatologis tertentu yang tidak dinyatakan secara tegas dalam bahasa Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan penegasan formula wacana Yunani dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: ταύτῃ τῇ νυκτί
  choice: pada malam itu
  rationale: Ungkapan waktu datif dengan demonstratif menunjuk kepada malam tertentu yang sedang dibicarakan; “pada malam itu” merupakan bentuk Indonesia yang alami.
- source_word: ἔσονται δύο
  choice: akan ada dua orang
  rationale: Konstruksi eksistensial ini alami dalam bahasa Indonesia; “orang” ditambahkan karena konteks jelas merujuk kepada dua manusia, bukan dua benda.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: di satu tempat tidur
  rationale: κλίνη dapat berarti tempat tidur atau pembaringan. Konteks malam mendukung “tempat tidur”, sedangkan “di” lebih alami daripada “di atas” untuk orang yang sedang berada atau berbaring di tempat tidur.
- source_word: ὁ εἷς
  choice: yang seorang
  rationale: 'Bentuk ini secara alami membuka kontras berpasangan dalam bahasa Indonesia: “yang seorang ... yang lain”.'
- source_word: παραλημφθήσεται
  choice: akan dibawa
  rationale: Bentuk pasif mendatang dari παραλαμβάνω menyatakan bahwa seseorang akan diambil atau dibawa serta. “Dibawa” ringkas dan tidak menentukan apakah tujuannya keselamatan atau penghukuman.
- source_word: ὁ ἕτερος
  choice: yang lain
  rationale: Menyatakan orang kedua yang dibedakan dari orang pertama dalam pasangan tersebut.
- source_word: ἀφεθήσεται
  choice: akan ditinggalkan
  rationale: Dalam kontras ini, ἀφίημι berarti meninggalkan atau membiarkan, bukan mengampuni. “Ditinggalkan” mempertahankan bentuk pasif dan kontras dengan “dibawa” tanpa menambahkan skema eskatologis tertentu.
theological_decisions:
- issue: Apakah orang yang dibawa diselamatkan atau dihukum
  choice: 'Teks utama tetap netral: “yang seorang akan dibawa, dan yang lain akan ditinggalkan.”'
  alternative: Orang yang dibawa dapat dipahami dibawa kepada keselamatan, atau dibawa untuk menerima penghukuman.
  rationale: Kedua verba Yunani dalam ayat ini sendiri tidak memastikan nasib masing-masing orang. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan tafsiran eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan “yang seorang ... yang lain” mempertahankan kontras berpasangan, sedangkan pilihan “dibawa” dan “ditinggalkan” sengaja tidak menentukan nasib teologis kedua orang itu.
