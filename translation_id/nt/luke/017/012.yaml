base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: id
  text: Ketika Yesus sedang memasuki sebuah desa, sepuluh laki-laki yang menderita penyakit kulit[a] menemui-Nya. Mereka berdiri dari jauh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: “orang yang sakit kusta.” Istilah Yunani menunjuk pada penyakit kulit dalam kategori kuno dan tidak selalu sama dengan penyakit Hansen yang kini disebut kusta.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pada jarak tertentu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Ketika Yesus sedang memasuki
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan. Nama “Yesus” dipakai secara alami dalam bahasa Indonesia untuk memperjelas acuan pronomina tanpa mengubah pelakunya.
- source_word: εἴς τινα κώμην
  choice: sebuah desa
  rationale: τινα menyatakan desa yang tidak ditentukan. Dalam bahasa Indonesia modern, “sebuah desa” menyampaikan ketidakspesifikan itu secara wajar; “suatu desa tertentu” akan terdengar kaku dan dapat memberi kesan penekanan yang berlebihan.
- source_word: ἀπήντησαν
  choice: menemui-Nya
  rationale: Kata ini dapat berarti bertemu atau pergi menemui. “Menemui-Nya” alami dalam konteks ini dan tetap tidak merinci gerakan lebih jauh daripada teks.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: sepuluh orang yang menderita penyakit kulit
  rationale: λεπρός menunjuk kategori penyakit kulit dalam dunia kuno dan tidak harus identik dengan diagnosis modern penyakit Hansen. Pilihan ini mudah dipahami, mengutamakan orangnya, dan menghindari ketepatan medis yang tidak dinyatakan teks.
- source_word: οἳ ἔστησαν
  choice: Mereka berdiri
  rationale: Klausa relatif Yunani dialihkan menjadi kalimat baru agar alami dan jelas dalam bahasa Indonesia, sambil mempertahankan tindakan sederhana ‘berdiri’ dan pelaku yang sama.
- source_word: πόρρωθεν
  choice: dari jauh
  rationale: Ungkapan ini ringkas dan alami dalam bahasa Indonesia serta mempertahankan adanya jarak tanpa menentukan ukurannya.
theological_decisions:
- issue: Cakupan penyakit yang disebut λεπροί
  choice: orang yang menderita penyakit kulit
  alternative: orang yang sakit kusta
  rationale: Istilah Yunani merupakan sebutan kuno bagi keadaan kulit yang cakupannya dapat lebih luas daripada penyakit Hansen modern. Terjemahan utama tidak menyamakan keduanya secara pasti, sedangkan istilah tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur partisipial dipertahankan melalui “sedang memasuki”; klausa relatif dipecah menjadi kalimat kedua demi kelancaran. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat berlanjut ke ayat berikutnya.
