id: LUK.17.26
reference: Luke 17:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: id
  text: Dan sebagaimana yang terjadi pada zaman Nuh, demikian juga halnya kelak pada zaman Anak Manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sang Manusia.” Gelar Yunani yang secara tradisional diterjemahkan “Anak Manusia” kemungkinan menggemakan Daniel 7 dan dipertahankan di sini karena makna mesianik dan apokaliptiknya yang telah dikenal.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai perbandingan yang tegas dan berpasangan secara alami dengan “demikian juga” dalam bahasa Indonesia.
- source_word: ἐγένετο
  choice: yang terjadi
  rationale: Mempertahankan makna peristiwa yang berlangsung pada zaman Nuh tanpa memakai ungkapan yang kuno.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: pada zaman Nuh
  rationale: Ungkapan waktu ini lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “pada hari-hari Nuh”.
- source_word: οὕτως
  choice: demikian
  rationale: Menyatakan bagian kedua dari perbandingan secara ringkas dan jelas.
- source_word: ἔσται
  choice: halnya kelak
  rationale: Menyampaikan makna futurum “akan demikian keadaannya” secara alami, tanpa menentukan lebih jauh peristiwa tertentu yang dimaksud.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan unsur penegas yang mempertautkan keadaan pada zaman Anak Manusia dengan keadaan pada zaman Nuh.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah gelar baku Yesus dalam Injil dan mempertahankan bentuk ungkapan serta gema mesianik-apokaliptiknya, khususnya kemungkinan kaitannya dengan Daniel 7.
theological_decisions:
- issue: Penerjemahan gelar τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk tradisional yang telah dikenal luas serta kemungkinan gema Daniel 7. Alternatif “Sang Manusia” dapat menonjolkan kemanusiaan atau sosok manusiawi, tetapi lebih menafsirkan dan mengurangi bentuk khas ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pasangan “sebagaimana … demikian juga” mempertahankan struktur perbandingan Yunani, sedangkan “pada zaman” mengungkapkan idiom waktu secara alami.
