  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: id
  text: Dan jika ia berdosa terhadapmu tujuh kali dalam sehari, lalu tujuh kali kembali kepadamu dan berkata, “Aku bertobat,” engkau harus mengampuninya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau akan mengampuninya”; bentuk kala mendatang dalam bahasa Yunani di sini berfungsi sebagai perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: tujuh kali dalam sehari
  rationale: Ungkapan ini menyatakan tindakan berulang dalam rentang satu hari; bentuk Indonesia ini alami tanpa mengubah batas waktunya.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: berdosa terhadapmu
  rationale: Konstruksi dengan εἰς σέ menunjukkan dosa atau pelanggaran yang ditujukan kepada orang yang diajak bicara.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: kembali kepadamu
  rationale: ἐπιστρέφω dapat berarti berbalik atau kembali; konteks pelanggaran berulang dan pengakuan mendukung makna kembali mendatangi orang yang disakiti.
- source_word: Μετανοῶ
  choice: Aku bertobat
  rationale: Pilihan ini mempertahankan bobot moral μετανοέω dan tidak memperlemahnya menjadi sekadar penyesalan atau permintaan maaf.
- source_word: ἀφήσεις αὐτῷ
  choice: engkau harus mengampuninya
  rationale: Bentuk futurum ἀφήσεις dalam konteks pengajaran ini memiliki daya imperatif; bahasa Indonesia menyatakannya secara alami dengan 'harus'.
theological_decisions:
- issue: Daya bentuk futurum ἀφήσεις
  choice: 'Dipahami sebagai kewajiban: “engkau harus mengampuninya”'
  alternative: 'Prediksi: “engkau akan mengampuninya”'
  rationale: Dalam rangkaian perintah pada konteks ini, bentuk futurum berfungsi sebagai arahan yang mengikat, bukan sekadar ramalan tentang tindakan pendengar.
- issue: Makna Μετανοῶ
  choice: “Aku bertobat”
  alternative: “Aku menyesal”
  rationale: Teks menyebut pertobatan, yang lebih luas daripada perasaan menyesal; terjemahan ini menjaga tuntutan etisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai untuk sapaan tunggal dalam ujaran pengajaran. Konjungsi “Bahkan jika” mencerminkan καὶ ἐὰν secara alami, sedangkan “lalu” menghubungkan pelanggaran dengan tindakan kembali tanpa menambah syarat baru.
