  source_fidelity: Teks Indonesia dengan tepat menyampaikan pertanyaan retoris οὐχ εὑρέθησαν, tindakan kembali (ὑποστρέψαντες), tujuan memberi kemuliaan kepada Allah (δοῦναι δόξαν τῷ θεῷ), dan pengecualian bagi ὁ ἀλλογενὴς οὗτος. “Tidak adakah orang” adalah cara Indonesia yang wajar untuk mempertahankan daya eksistensial bentuk pasif Yunani dalam pertanyaan retoris.
  naturalness: “Tidak adakah orang yang kembali untuk memuliakan Allah selain orang asing ini?” baku, jelas, dan bernada wibawa tanpa menjadi kaku. Susunan kalimat serta penggunaan “memuliakan Allah” sangat alami dalam ragam Alkitab Indonesia modern.
  terminology: “Allah” tepat bagi θεός dalam konteks ini. “Memuliakan” mempertahankan bobot idiom δοῦναι δόξαν. “Orang asing ini” secara memadai menyampaikan ἀλλογενής dan penekanan οὗτος tanpa mengidentifikasi orang itu sebagai Samaria secara eksplisit. Catatan kaki memberikan alternatif yang relevan dan menjelaskan statusnya sebagai pihak di luar Israel.
