  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: id
  text: Tidak adakah orang yang kembali untuk memuliakan Allah selain orang asing ini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang dari bangsa lain ini” atau “pendatang ini”; istilah Yunani menunjuk seseorang dari bangsa lain, seorang yang berada di luar Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: adakah orang
  rationale: Bentuk pasif aoris ini memiliki nuansa keberadaan dalam pertanyaan retoris. Ungkapan Indonesia yang alami, “Tidak adakah orang,” menyampaikan maksud tersebut tanpa mempertahankan bentuk pasif yang kaku.
- source_word: ὑποστρέψαντες
  choice: yang kembali
  rationale: Partisip ini menyatakan tindakan kembali yang dilakukan sebelum atau dalam rangka memberi kemuliaan; klausa relatif ini alami dalam bahasa Indonesia.
- source_word: δοῦναι δόξαν
  choice: untuk memuliakan
  rationale: Idiom harfiahnya adalah “memberikan kemuliaan.” Dalam bahasa Indonesia modern, “memuliakan” menyampaikan idiom itu secara alami dan tetap mempertahankan arah tindakan kepada Allah.
- source_word: τῷ θεῷ
  choice: Allah
  rationale: Dalam konteks ini, datif menandai pihak yang menerima kemuliaan; bentuk verbal “memuliakan” langsung mengambil objek “Allah.”
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam konstruksi pengecualian ini, “selain” ringkas, alami, dan tepat.
- source_word: ἀλλογενής
  choice: orang asing
  rationale: Kata ini menunjuk orang dari bangsa atau kelompok lain, yakni orang di luar Israel. “Orang asing” jelas dalam bahasa Indonesia dan tidak menambahkan identitas yang hanya disimpulkan dari konteks.
- source_word: οὗτος
  choice: ini
  rationale: Kata penunjuk ini mempertahankan penekanan pada orang asing yang hadir tersebut.
theological_decisions:
- issue: Status orang yang disembuhkan sebagai pihak luar secara etnis dan religius
  choice: orang asing ini
  alternative: orang dari bangsa lain ini; pendatang ini
  rationale: Terjemahan ini mempertahankan ironi bahwa orang yang kembali memuliakan Allah adalah pihak luar Israel, tanpa secara eksplisit menyebutnya orang Samaria dalam ayat ini atau memasukkan polemik tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dipertahankan, sedangkan idiom Yunani “memberikan kemuliaan kepada Allah” diterjemahkan secara alami sebagai “memuliakan Allah.”
