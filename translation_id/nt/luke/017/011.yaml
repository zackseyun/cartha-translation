- from: Dalam perjalanan-Nya ke Yerusalem, Yesus melewati daerah perbatasan antara Samaria dan Galilea.[a]
  to: Ketika Yesus sedang dalam perjalanan ke Yerusalem, Ia sedang melintasi daerah antara wilayah Samaria dan Galilea.[a]
