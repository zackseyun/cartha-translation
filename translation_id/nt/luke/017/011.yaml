id: LUK.17.11
reference: Luke 17:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: id
  text: Ketika Yesus sedang dalam perjalanan ke Yerusalem, Ia sedang melintasi daerah antara wilayah Samaria dan Galilea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini juga dapat diterjemahkan “melalui tengah-tengah Samaria dan Galilea.” Ungkapan itu dapat dipahami sebagai perjalanan di antara kedua wilayah tersebut atau melalui bagian tengahnya.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Dalam perjalanan-Nya
  rationale: Formula naratif Lukas ini, bersama konstruksi waktu yang mengikutinya, dialihkan secara alami ke dalam bahasa Indonesia tanpa ungkapan harfiah yang kaku seperti 'dan terjadilah'.
- source_word: ἐν τῷ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: Dalam perjalanan-Nya ke Yerusalem
  rationale: Infinitif berartikel dengan ἐν menyatakan waktu yang bersamaan dan perjalanan yang sedang berlangsung menuju Yerusalem.
- source_word: αὐτός
  choice: Yesus
  rationale: Acuan kata ganti diperjelas dengan nama Yesus agar ayat ini dapat dibaca mandiri; penegasan ringan pada kata ganti Yunani tidak perlu dibuat menjadi 'Ia sendiri'.
- source_word: διήρχετο
  choice: melewati
  rationale: Bentuk imperfek menggambarkan gerak yang sedang berlangsung; 'melewati' merupakan padanan Indonesia yang wajar dalam konteks perjalanan.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: daerah perbatasan antara Samaria dan Galilea
  rationale: Ungkapan ini dapat menunjuk pada gerakan di antara kedua wilayah atau melintasi kawasan yang memisahkan keduanya. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan kemungkinan geografis tersebut.
theological_decisions: []
