  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: id
  text: Lebih baik baginya jika sebuah batu kilangan[a] dikalungkan pada lehernya dan ia dilemparkan ke laut daripada jika ia menyebabkan salah seorang dari mereka yang kecil ini tersandung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih khusus, “sebuah batu kilangan besar.” Frasa Yunani ini dapat menunjuk pada batu penggilingan yang lebih berat.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyebabkan salah seorang dari mereka yang kecil ini berbuat dosa.” Kata kerja Yunani ini mencakup arti menyebabkan seseorang jatuh ke dalam dosa atau mengalami kehancuran rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Lebih baik baginya
  rationale: Ungkapan idiomatis ini menyatakan bahwa suatu akibat lebih baik atau lebih menguntungkan bagi orang tersebut; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya perbandingannya.
- source_word: λίθος μυλικὸς
  choice: sebuah batu kilangan
  rationale: Frasa ini menunjuk pada batu yang digunakan dalam penggilingan. 'Batu kilangan' merupakan padanan Indonesia yang ringkas; kemungkinan bahwa yang dimaksud ialah batu kilangan besar dijelaskan dalam catatan kaki.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: dikalungkan pada lehernya
  rationale: Bentuk Yunani menggambarkan batu itu berada mengelilingi leher. 'Dikalungkan' menyampaikan keadaan hasil tindakan tersebut secara alami dan jelas.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: ia dilemparkan ke laut
  rationale: Bentuk pasif perfektif Yunani menekankan tindakan yang telah terlaksana beserta hasilnya. Dalam konstruksi pengandaian Indonesia, 'dilemparkan' alami dan sejalan dengan 'dikalungkan'.
- source_word: σκανδαλίσῃ
  choice: menyebabkan ... tersandung
  rationale: Kata kerja ini menggambarkan tindakan yang menyebabkan seseorang jatuh ke dalam dosa atau kehancuran rohani. 'Tersandung' mempertahankan metafora Yunani, sedangkan makna yang lebih eksplisit dicantumkan dalam catatan kaki.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: salah seorang dari mereka yang kecil ini
  rationale: Terjemahan ini mempertahankan arti harfiah 'satu dari yang kecil-kecil ini' tanpa membatasi rujukannya hanya kepada anak-anak atau hanya kepada orang percaya.
- source_word: ἢ ἵνα
  choice: daripada ia
  rationale: Bentuk ini menyampaikan perbandingan antara dua akibat dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan ungkapan 'mereka yang kecil ini'
  choice: Diterjemahkan secara umum sebagai 'mereka yang kecil ini' tanpa menentukan bahwa mereka hanya anak-anak atau hanya orang percaya.
  alternative: anak-anak ini; para murid atau orang percaya yang rendah hati ini
  rationale: Teks Yunani tidak mengidentifikasi kelompok itu secara lebih sempit. Terjemahan mempertahankan keluasan dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. Susunan perbandingan dibuat alami, sementara metafora 'tersandung' dan ketidakpastian rujukan 'mereka yang kecil ini' dipertahankan.
