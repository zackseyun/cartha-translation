  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: id
  text: Lalu Ia berkata kepada murid-murid-Nya, “Tidak mungkin hal-hal yang membuat orang tersandung itu tidak datang[a]. Namun, celakalah orang yang melaluinya hal-hal itu datang!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyesatan,” “hal-hal yang menyebabkan orang berdosa,” atau “godaan untuk berbuat dosa.” Kata Yunani σκάνδαλα menggambarkan hal-hal yang menjegal atau membuat orang tersandung secara moral atau rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Lalu Ia berkata
  rationale: δέ merupakan penghubung ringan dalam alur kisah; “lalu” menyatakan kelanjutan narasi secara alami tanpa memberi kesan pertentangan yang kuat.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Terjemahan ini mempertahankan kata ganti kepunyaan αὐτοῦ dan memakai padanan baku μαθηταί dalam konteks pelayanan Yesus.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Tidak mungkin
  rationale: ἀνένδεκτος menyatakan sesuatu yang mustahil atau tidak mungkin terjadi; bersama klausa infinitif negatif berikutnya, ungkapan ini menegaskan keniscayaan datangnya σκάνδαλα.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: tidak akan datang hal-hal yang membuat orang tersandung
  rationale: 'Susunan ini mempertahankan cakupan negasi Yunani: yang tidak mungkin ialah tidak datangnya σκάνδαλα. Bentuk “akan datang” juga wajar dalam bahasa Indonesia untuk menyatakan apa yang pasti terjadi.'
- source_word: σκάνδαλα
  choice: hal-hal yang membuat orang tersandung
  rationale: Padanan ini mempertahankan kiasan tersandung sekaligus menjelaskan bahwa yang dimaksud ialah berbagai hal yang menjerumuskan orang secara moral atau rohani, tanpa mempersempit maknanya hanya menjadi perasaan tersinggung atau godaan.
- source_word: πλὴν οὐαὶ
  choice: Namun, celakalah
  rationale: πλήν menandai peralihan yang membatasi pernyataan sebelumnya, sedangkan οὐαί merupakan seruan kecaman atau peringatan keras; “Namun, celakalah” menyampaikan keduanya dengan alami.
- source_word: δι’ οὗ
  choice: orang yang melaluinya
  rationale: Frasa ini mempertahankan rujukan pribadi tunggal serta gagasan perantaraan yang terkandung dalam διά dengan bentuk genitif.
- source_word: ἔρχεται
  choice: hal-hal itu datang
  rationale: Walaupun bentuk verba Yunani tunggal, rujukan konseptualnya adalah τὰ σκάνδαλα; pengulangan “hal-hal itu” menghasilkan hubungan yang jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σκάνδαλα dalam pengajaran etis
  choice: Diterjemahkan sebagai “hal-hal yang membuat orang tersandung” dalam teks utama.
  alternative: “penyesatan,” “hal-hal yang menyebabkan dosa,” atau “godaan untuk berbuat dosa”
  rationale: 'Kiasan tersandung mempertahankan keluasan makna Yunani: sesuatu yang menjadi jerat, menyebabkan dosa, atau membawa kejatuhan moral dan rohani. Terjemahan ini tidak membatasi maknanya pada satu bentuk penyesatan tertentu.'
- issue: Rujukan pribadi tunggal dalam δι’ οὗ
  choice: Diterjemahkan sebagai “orang yang melaluinya.”
  alternative: “dia yang melaluinya” atau “orang yang menjadi penyebabnya”
  rationale: Pilihan ini mempertahankan bentuk tunggal yang mewakili siapa pun, tanpa menambahkan kekhususan gender dan tanpa mengubah gagasan “melalui” menjadi hubungan sebab-akibat yang lebih sempit.
- issue: Keniscayaan datangnya batu sandungan dan tanggung jawab manusia
  choice: 'Kedua sisi dipertahankan: hal-hal itu pasti datang, tetapi orang yang menjadi salurannya tetap dikenai seruan celaka.'
  alternative: Menjelaskan keniscayaan sebagai penghapusan tanggung jawab pribadi.
  rationale: Teks Yunani menempatkan keniscayaan dan kecaman berdampingan. Terjemahan tidak menyelaraskan ketegangan teologis ini dengan penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Ia” dan akhiran “-Nya” mengikuti kelaziman penulisan rujukan kepada Yesus. Ungkapan “hal-hal yang membuat orang tersandung” dipilih agar kiasan sumber tetap terlihat sekaligus mudah dipahami pembaca umum.
