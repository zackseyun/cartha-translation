translation:
  language: id
  text: Apakah ia berterima kasih kepada budak itu karena ia melakukan apa yang diperintahkan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hamba” atau “pelayan” untuk kata Yunani doulos, yang di sini menunjuk kepada orang yang berada di bawah kuasa seorang tuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Apakah ...?
  rationale: 'Dengan verba indikatif, μή memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk tanya sederhana terdengar alami dalam bahasa Indonesia, sementara konteks menyiratkan jawabannya: tidak.'
- source_word: ἔχει χάριν
  choice: berterima kasih kepada
  rationale: Ungkapan ἔχειν χάριν τινί berarti merasa atau menyatakan terima kasih kepada seseorang. 'Berterima kasih kepada' adalah padanan Indonesia yang alami dan tepat.
- source_word: δούλῳ
  choice: budak
  rationale: Dalam perumpamaan ini, tokoh tersebut berada di bawah kuasa tuannya dan wajib menjalankan perintah. 'Budak' mempertahankan ketimpangan status serta daya retoris teks, tanpa menghaluskannya menjadi sekadar pekerja atau pelayan.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan bagi tindakan berterima kasih yang dipertanyakan.
- source_word: ἐποίησεν
  choice: melakukan
  rationale: ποιέω di sini menunjuk pada pelaksanaan perintah. 'Melakukan' merupakan pilihan yang sederhana dan alami.
- source_word: τὰ διαταχθέντα
  choice: apa yang diperintahkan kepadanya
  rationale: Partisipel pasif substantival ini secara harfiah menunjuk pada 'hal-hal yang telah diperintahkan'. Padanan ini alami dalam bahasa Indonesia, mempertahankan makna pasif, dan memperjelas bahwa budak itulah penerima perintah.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks hubungan tuan-budak pada perumpamaan
  choice: budak
  alternative: hamba; pelayan
  rationale: Alur argumentasi ayat bergantung pada status tokoh yang tunduk dan berkewajiban menaati perintah. 'Budak' mempertahankan realitas sosial dan ketimpangan kuasa yang diasumsikan perumpamaan, tanpa menyatakan persetujuan moral terhadap lembaga perbudakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'budak itu' dipertahankan agar pelaku klausa kedua jelas dan kalimat tidak terasa rancu. Pertanyaan retoris dibiarkan dalam bentuk tanya alami; jawaban negatif yang diharapkan tidak ditambahkan ke dalam teks.
