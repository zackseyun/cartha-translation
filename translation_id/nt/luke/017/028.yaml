id: LUK.17.28
reference: Luke 17:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: id
  text: 'Demikian juga, seperti yang terjadi pada zaman Lot: orang-orang makan dan minum, membeli dan menjual, menanam dan membangun.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Adverbia ini menghubungkan contoh tentang Lot dengan perbandingan sebelumnya; “demikian juga” alami dalam bahasa Indonesia dan mempertahankan daya komparatifnya.
- source_word: καθὼς
  choice: seperti
  rationale: Memperkenalkan klausa perbandingan mengenai keadaan pada zaman Lot; “seperti” menyampaikan hubungan itu secara lugas tanpa membuatnya berlebihan.
- source_word: ἐγένετο
  choice: yang terjadi
  rationale: Bentuk γίνομαι di sini bersifat peristiwa; “terjadi” merupakan padanan modern dan idiomatis.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: pada zaman Lot
  rationale: Ungkapan temporal ini menunjuk pada masa yang dikaitkan dengan Lot; “pada zaman Lot” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “pada hari-hari Lot”.
- source_word: ἤσθιον, ἔπινον
  choice: orang-orang makan dan minum
  rationale: Bentuk imperfek menggambarkan kegiatan biasa yang sedang berlangsung. Bahasa Indonesia tidak wajib menandai aspek progresif, dan rangkaian verba tanpa penanda “sedang” terdengar alami serta tetap menyatakan pola kehidupan sehari-hari.
- source_word: ἠγόραζον, ἐπώλουν
  choice: membeli dan menjual
  rationale: Kedua verba imperfek ini membentuk pasangan kegiatan perdagangan rutin; padanan sederhana ini jelas dan alami.
- source_word: ἐφύτευον, ᾠκοδόμουν
  choice: menanam dan membangun
  rationale: Keduanya dipahami secara harfiah sebagai kegiatan pertanian dan konstruksi yang lazim, bukan secara metaforis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Subjek jamak yang tersirat dalam verba Yunani dinyatakan sebagai “orang-orang” agar rujukannya jelas. Daftar kegiatan dipasangkan dengan “dan” untuk alur Indonesia yang alami, tanpa mengubah cakupan kegiatan dalam teks sumber.
