  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: id
  text: Ia tersungkur dengan wajah ke tanah di dekat kaki Yesus sambil mengucap syukur kepada-Nya. Ia adalah seorang Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: tersungkur dengan wajah ke tanah
  rationale: Gabungan kata kerja πίπτω dan frasa ἐπὶ πρόσωπον menggambarkan tindakan menjatuhkan diri dalam posisi menelungkup. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran jasmaniah serta nuansa penghormatan.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: di dekat kaki Yesus
  rationale: παρά dengan akusatif secara harfiah menunjukkan posisi di dekat kaki-Nya. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah tokoh yang dimaksud.
- source_word: εὐχαριστῶν αὐτῷ
  choice: sambil mengucap syukur kepada-Nya
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan tersungkurnya orang itu. 'Mengucap syukur kepada-Nya' mempertahankan arah ucapan syukur kepada Yesus.
- source_word: Σαμαρίτης
  choice: seorang Samaria
  rationale: Dalam pemakaian Alkitab bahasa Indonesia, 'orang Samaria' atau 'seorang Samaria' merupakan sebutan baku bagi anggota kelompok etnoreligius tersebut; bentuk ini mempertahankan arti sosial dan naratifnya.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Ia adalah seorang Samaria
  rationale: Pronomina eksplisit αὐτός memberi penekanan pada identitas orang itu. Kalimat mandiri mempertahankan pengungkapan identitas yang singkat dan mencolok tanpa menambahkan tafsiran.
theological_decisions:
- issue: Penekanan naratif pada identitas orang yang disembuhkan
  choice: Ia adalah seorang Samaria
  alternative: Ternyata, ia adalah seorang Samaria
  rationale: Pernyataan sederhana mempertahankan daya kejut sosial dan teologis dari identitasnya sebagai orang luar tanpa menambahkan penanda tafsiran seperti 'ternyata'.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Tersungkur dengan wajah ke tanah' menyampaikan postur penghormatan secara jelas; 'mengucap syukur' mengikuti ungkapan Indonesia yang lazim. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang harus ditampilkan kepada pembaca.
