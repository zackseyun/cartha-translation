  source_fidelity: 'Teks Indonesia dengan setia mencerminkan seluruh unsur Yunani: ἔπεσεν ἐπὶ πρόσωπον diterjemahkan sebagai “tersungkur dengan wajah ke tanah”; παρὰ τοὺς πόδας αὐτοῦ sebagai “di dekat kaki Yesus”; dan partisipel εὐχαριστῶν menyatakan tindakan serentak melalui “sambil mengucap syukur kepada-Nya.” Klausa penutup mempertahankan pengungkapan identitas yang singkat dan tanpa penafsiran tambahan: “Ia adalah seorang Samaria.” Penyebutan “Yesus” memperjelas rujukan αὐτοῦ tanpa mengubah makna.'
