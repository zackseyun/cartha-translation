id: LUK.17.29
reference: Luke 17:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: id
  text: Namun, pada hari Lot keluar dari Sodom, api dan belerang turun seperti hujan dari langit dan membinasakan mereka semua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Namun, pada hari
  rationale: Frasa datif relatif ini menyatakan waktu, sedangkan δέ menandai peralihan dengan kontras ringan terhadap gambaran sebelumnya.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Mempertahankan gambaran gerak konkret dari ἐξέρχομαι dan terdengar alami dalam bahasa Indonesia.
- source_word: Λὼτ
  choice: Lot
  rationale: Bentuk nama yang sudah baku dalam Alkitab bahasa Indonesia.
- source_word: ἀπὸ Σοδόμων
  choice: dari Sodom
  rationale: Menyatakan asal gerak secara langsung; Sodom adalah bentuk nama tempat yang baku.
- source_word: ἔβρεξεν
  choice: turun seperti hujan
  rationale: Konstruksi ini mengungkapkan pemakaian impersonal βρέχω secara alami tanpa menambahkan pelaku yang tidak disebutkan dalam teks Yunani.
- source_word: πῦρ καὶ θεῖον
  choice: api dan belerang
  rationale: Belerang adalah padanan modern dan langsung bagi θεῖον serta mempertahankan gambaran penghukuman dalam rujukan kepada Kejadian 19:24.
- source_word: ἀπ’ οὐρανοῦ
  choice: dari langit
  rationale: Dalam konteks sesuatu yang turun seperti hujan, langit adalah padanan Indonesia yang alami bagi οὐρανός tanpa meniadakan nuansa bahwa penghukuman datang dari atas.
- source_word: ἀπώλεσεν πάντας
  choice: membinasakan mereka semua
  rationale: ἀπόλλυμι di sini berarti membinasakan, dan mereka semua menyatakan objek manusia jamak yang tersirat dalam πάντας.
theological_decisions:
- issue: Padanan θεῖον dalam konteks penghukuman
  choice: belerang
  alternative: ungkapan tradisional yang sepadan dengan ‘brimstone’
  rationale: Belerang menyampaikan arti leksikal secara jelas dan modern tanpa mengurangi gambaran penghukuman.
- issue: Padanan οὐρανός
  choice: langit
  alternative: surga
  rationale: Karena teks menggambarkan api dan belerang yang turun seperti hujan, langit paling alami dalam bahasa Indonesia. Pilihan ini tetap mempertahankan arah datangnya penghukuman tanpa memaksakan penafsiran kosmologis.
- issue: Pelaku verba ἔβρεξεν dan ἀπώλεσεν
  choice: api dan belerang diperlakukan sebagai pelaku gramatikal dalam kalimat Indonesia
  alternative: menambahkan Allah atau Tuhan sebagai pelaku
  rationale: Teks Yunani tidak menyebutkan pelaku secara eksplisit. Rumusan ini menjaga ketegangan tersebut dan tidak menambahkan identifikasi teologis yang hanya tersirat dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘turun seperti hujan’ dipilih agar gambaran βρέχω tetap jelas dan alami, sedangkan ‘membinasakan’ mempertahankan bobot penghukuman dalam ayat ini.
