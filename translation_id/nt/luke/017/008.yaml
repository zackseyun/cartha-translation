review_pass:
  verdict: revise
  source_fidelity: Frasa τί δειπνήσω secara harfiah menunjuk pada “sesuatu/apa yang akan kumakan,” bukan secara spesifik “makan malamku.” Walaupun δειπνέω dapat merujuk pada makan utama atau makan malam menurut konteks, “Siapkan sesuatu untuk kumakan” mempertahankan ketaktentuan τί dan tidak membatasi waktu makan. Unsur lain—pertanyaan retoris, perintah untuk mengikat/menyingsingkan pakaian, pelayanan sampai tindakan makan-minum selesai, serta urutan makan bagi lawan bicara—tersampaikan dengan tepat.
  naturalness: Teksnya pada umumnya baku, jelas, dan alami. “Engkau” cocok dalam petikan langsung bernada Alkitab. Penggantian kecil pada objek “Siapkan” membuat kalimat lebih setia pada sumber tanpa mengurangi kelancaran.
  terminology: “Layanilah aku” tepat untuk διακόνει μοι dalam konteks pelayanan meja dan tidak memaksakan konotasi gerejawi. Catatan a menjelaskan praktik menyingsingkan pakaian secara cukup akurat; catatan b tepat menyatakan alternatif yang lebih harfiah. Tidak perlu menambahkan “hamba” atau “budak” karena tidak ada nomina tersebut dalam ayat ini.
  issues:
  - severity: medium
    issue: “makan malamku” membatasi τί δειπνήσω secara berlebihan.
    rationale: τί adalah objek tak tentu (“sesuatu/apa”), dan δειπνήσω berarti “aku makan/dijamu untuk makan.” Konteks dapat mendukung makan malam, tetapi teks Yunani sendiri tidak menuntut pembatasan itu. “Siapkan sesuatu untuk kumakan” mempertahankan keluasan sumber.
  revised_text: Sebaliknya, bukankah ia akan berkata kepadanya, ‘Siapkan sesuatu untuk kumakan, ikatlah pakaianmu agar siap melayani[a], dan layanilah aku sampai aku selesai makan dan minum[b]. Sesudah itu, barulah engkau makan dan minum’?”
