    text: Dapat juga diterjemahkan “sampai aku makan dan minum.” Kata “selesai” memperjelas bahwa ia harus terus melayani hingga tindakan itu rampung.
    reason: lexical_alternative
  revision_rationale: Revisi hanya mengganti “makan malamku” dengan “sesuatu untuk kumakan” agar objek tak tentu τί dan cakupan δειπνήσω tetap terjaga. Struktur kalimat, nuansa retoris, dan catatan kaki dipertahankan.
