id: LUK.17.8
reference: Luke 17:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: id
  text: Sebaliknya, bukankah ia akan berkata kepadanya, ‘Siapkan sesuatu untuk kumakan, ikatlah pakaianmu agar siap melayani[a], dan layanilah aku sampai aku selesai makan dan minum[b]. Sesudah itu, barulah engkau makan dan minum’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ikatlah pinggangmu,” yaitu mengikat atau menyingsingkan pakaian panjang agar siap bekerja.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “sampai aku makan dan minum.” Kata “selesai” memperjelas bahwa ia harus terus melayani hingga tindakan itu rampung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Sebaliknya, bukankah
  rationale: Gabungan ini memperkenalkan pertanyaan retoris yang berlawanan dengan kemungkinan pada ayat sebelumnya dan mengharapkan jawaban positif.
- source_word: ἐρεῖ αὐτῷ
  choice: ia akan berkata kepadanya
  rationale: Mempertahankan verba dasar 'berkata' dan objek tak langsung yang eksplisit tanpa menambahkan sebutan bagi orang itu.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Siapkan makan malamku
  rationale: δειπνέω menunjuk pada makan utama atau makan malam; bentuk ini alami dalam bahasa Indonesia dan menyampaikan apa yang harus disiapkan untuk sang pembicara.
- source_word: περιζωσάμενος
  choice: ikatlah pakaianmu agar siap melayani
  rationale: Mengungkapkan gambaran harfiah mengikat atau menyingsingkan pakaian panjang sebagai persiapan bekerja, tanpa memakai ungkapan Indonesia yang kabur.
- source_word: διακόνει μοι
  choice: layanilah aku
  rationale: Dalam konteks jamuan, verba ini menunjuk pada pelayanan meja; 'layanilah aku' jelas dan tidak bernuansa jabatan gerejawi.
- source_word: ἕως φάγω καὶ πίω
  choice: sampai aku selesai makan dan minum
  rationale: Kata 'selesai' secara alami menonjolkan batas waktu berupa rampungnya tindakan sebelum giliran orang yang melayani.
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: Sesudah itu, barulah engkau makan dan minum
  rationale: '''Sesudah itu'' mempertahankan urutan waktu, sedangkan ''barulah engkau'' menyampaikan penekanan pada σύ dan kontras giliran secara alami.'
theological_decisions:
- issue: Penyebutan peran sosial dalam perumpamaan
  choice: Tidak menambahkan kata 'hamba' atau 'budak' dalam ayat ini.
  alternative: Menambahkan 'hamba itu' atau 'budak itu' demi memperjelas rujukan.
  rationale: Walaupun konteks sebelumnya menyebut δοῦλος, ayat ini sendiri hanya memakai pronomina. Rujukan tetap tersirat agar terjemahan tidak memasukkan nomina yang tidak terdapat dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'engkau' dipakai dalam petikan langsung untuk menjaga kejelasan tunggal dan nuansa sastra Alkitab yang tetap mudah dipahami.
