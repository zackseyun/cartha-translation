  terminology: “Anak Manusia” merupakan padanan baku dan tepat bagi ὁ υἱὸς τοῦ ἀνθρώπου. “Pada hari-Nya” mempertahankan keluasan referen dan tidak mengubahnya menjadi kedatangan, penghakiman, atau peristiwa eskatologis tertentu.
