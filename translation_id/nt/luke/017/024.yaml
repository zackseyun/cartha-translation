  source_fidelity: Teks Indonesia dengan tepat mempertahankan struktur perbandingan ὥσπερ γάρ ... οὕτως, gambaran kilat yang melakukan dua tindakan terkait (ἀστράπτουσα dan λάμπει), futurum ἔσται melalui “kelak,” gelar “Anak Manusia,” serta frasa waktu yang luas ἐν τῇ ἡμέρᾳ αὐτοῦ. “Dari satu ujung langit ke ujung langit yang lain” adalah pengungkapan idiomatis yang setia terhadap cakupan spasial ungkapan Yunani, tanpa memaksakan pengulangan harfiah “di bawah langit.”
