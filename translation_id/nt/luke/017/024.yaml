id: LUK.17.24
reference: Luke 17:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: id
  text: Sebab sama seperti kilat yang memancar dari satu ujung langit ke ujung langit yang lain dan bersinar, demikianlah Anak Manusia kelak pada hari-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pada hari milik-Nya.” Ungkapan ini menunjuk pada waktu yang berkaitan dengan Anak Manusia tanpa merinci peristiwanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab sama seperti
  rationale: Mempertahankan daya penjelas γάρ dan membuka perbandingan ὥσπερ secara wajar dalam bahasa Indonesia.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: kilat yang memancar
  rationale: Mengungkapkan nomina dan partisip yang seakar tanpa menghasilkan pengulangan Indonesia yang kaku seperti 'kilat yang berkilat'.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν
  choice: dari satu ujung langit ke ujung langit yang lain
  rationale: Ungkapan Yunani secara harfiah mengulang 'di bawah langit', tetapi secara idiomatis menunjuk bentangan dari satu bagian cakrawala ke bagian lainnya. Pilihan ini menyampaikan gambaran spasial dengan jelas dan alami.
- source_word: λάμπει
  choice: bersinar
  rationale: Membedakannya dari ἀστράπτουσα dan mempertahankan dua tindakan yang berhubungan tetapi tidak identik.
- source_word: οὕτως ἔσται
  choice: demikianlah ... kelak
  rationale: Menyatakan perbandingan dan nuansa futurum secara alami; kopula 'adalah' dapat dilesapkan dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku dan transparan bagi gelar tersebut, tanpa memparafrasakan identitas atau fungsinya.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: pada hari-Nya
  rationale: Mempertahankan sebutan waktu yang dikaitkan dengan Anak Manusia tanpa mempersempitnya menjadi kedatangan atau penghakiman.
theological_decisions:
- issue: Makna 'Anak Manusia ... pada hari-Nya' dalam konteks eskatologis
  choice: Mempertahankan 'pada hari-Nya' tanpa penjelasan tambahan
  alternative: pada saat kedatangan-Nya; pada hari penghakiman
  rationale: Teks Yunani hanya menyebut hari yang dikaitkan dengan Anak Manusia. Terjemahan tidak menentukan secara eksplisit peristiwa tertentu yang tidak disebut dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Ungkapan spasial dibuat idiomatis agar mudah dipahami, sedangkan frasa eskatologis sengaja dibiarkan luas sesuai teks sumber.
