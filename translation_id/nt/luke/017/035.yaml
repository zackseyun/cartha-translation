id: LUK.17.35
reference: Luke 17:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: id
  text: Akan ada dua perempuan yang menggiling bersama-sama[a]; yang satu akan diambil[b], tetapi yang lain akan ditinggalkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat yang sama.” Ungkapan Yunani ini dapat berarti “bersama-sama” atau “di tempat yang sama.”
    reason: lexical_alternative
  - marker: b
    text: Kata “diambil” sendiri tidak menjelaskan apakah orang itu diambil untuk diselamatkan atau untuk dihakimi; bahasa Yunani membiarkan hal itu ditentukan oleh konteks yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: Akan ada
  rationale: Bentuk futur εἰμί memperkenalkan keadaan yang akan terjadi; “akan ada” alami dalam bahasa Indonesia dan mempertahankan makna futur.
- source_word: δύο ... ἀλήθουσαι
  choice: dua perempuan yang menggiling
  rationale: δύο berarti “dua,” sedangkan bentuk feminin partisipel ἀλήθουσαι menunjukkan bahwa pelakunya perempuan. “Menggiling” menyampaikan kegiatannya tanpa menambahkan objek yang hanya tersirat.
- source_word: ἐπὶ τὸ αὐτό
  choice: bersama-sama
  rationale: Ungkapan ini dapat berarti berada bersama atau di tempat yang sama. “Bersama-sama” paling alami dalam adegan ini, sementara kemungkinan lokatif dicatat dalam catatan kaki.
- source_word: ἡ μία
  choice: yang satu
  rationale: Konstruksi dengan artikel dan numeral membedakan satu dari kedua perempuan; “yang satu” wajar untuk pasangan kontras dalam bahasa Indonesia.
- source_word: παραλημφθήσεται
  choice: akan diambil
  rationale: Bentuk pasif futur παραλαμβάνω. Pilihan ini langsung dan tidak menentukan apakah tindakan tersebut bermakna keselamatan atau penghakiman.
- source_word: ἡ δὲ ἑτέρα
  choice: tetapi yang lain
  rationale: δέ menandai kontras, dan ἑτέρα menunjuk perempuan kedua. “Tetapi yang lain” menyatakan pertentangan itu dengan jelas.
- source_word: ἀφεθήσεται
  choice: akan ditinggalkan
  rationale: Bentuk pasif futur ἀφίημι di sini berarti dibiarkan atau ditinggalkan. “Akan ditinggalkan” mempertahankan kontras dengan “akan diambil” tanpa menambahkan tafsiran.
theological_decisions:
- issue: Apakah “diambil” dan “ditinggalkan” menyiratkan keselamatan atau penghakiman.
  choice: 'Pertahankan rumusan netral: “yang satu akan diambil, tetapi yang lain akan ditinggalkan.”'
  alternative: Menjelaskan bahwa yang diambil diselamatkan dan yang ditinggalkan dihukum, atau bahwa yang diambil dibawa ke penghakiman sedangkan yang ditinggalkan luput.
  rationale: Ayat ini sendiri hanya menyatakan pemisahan dan tidak secara eksplisit menetapkan nilai teologis kedua keadaan itu. Terjemahan harus mempertahankan ketegangan yang ada dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas, alami, dan bermartabat. Pengulangan “akan” mempertahankan kesejajaran kedua klausa serta kejelasan makna futur.
