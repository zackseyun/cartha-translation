    rationale: Partisipel παρελθών mengandung gerak datang atau mendekat sebagai tindakan yang menyertai ἀνάπεσε. “Segera datanglah” menyampaikan unsur tersebut dengan lebih jelas dan alami dalam bahasa Indonesia.
  - severity: low
    issue: Catatan budaya “di dekat meja” kurang presisi.
    rationale: ἀνάπεσε mengacu pada mengambil posisi berbaring untuk makan dalam kebiasaan perjamuan kuno, yaitu di meja makan; frasa “di dekat meja” dapat memberi kesan tidak makan di meja.
