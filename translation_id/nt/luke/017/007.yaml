  to: Namun, siapakah di antara kalian yang mempunyai seorang budak[a] yang sedang membajak atau menggembalakan ternak, akan berkata kepadanya ketika ia pulang dari ladang, “Segera datanglah dan berbaringlah untuk makan[b]”?
  rationale: Revisi terbatas pada kelancaran pertanyaan retoris, kejelasan unsur gerak dalam παρελθών, dan ketepatan catatan budaya. Makna, register modern baku, status sosial yang ditandai oleh δοῦλος, serta ambiguitas generik ποιμαίνοντα tetap dipertahankan.
