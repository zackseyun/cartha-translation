  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: id
  text: Namun, siapakah di antara kalian yang mempunyai seorang budak[a] yang sedang membajak atau menggembalakan ternak, akan berkata kepadanya ketika ia pulang dari ladang, “Segera datanglah dan berbaringlah untuk makan[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani doulos juga dapat diterjemahkan “hamba” atau “pelayan”, tetapi di sini menunjuk kepada orang yang terikat sebagai milik tuannya, bukan pekerja upahan.
    reason: alternative_reading
  - marker: b
    text: Pada zaman itu, orang biasanya makan dengan berbaring di meja makan. Secara lebih bebas, ungkapan ini berarti “duduklah untuk makan”.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: budak
  rationale: Kata ini menunjuk kepada pekerja rumah tangga yang terikat dan berada di bawah kuasa tuannya, bukan pekerja upahan. “Budak” mempertahankan ketimpangan status yang penting bagi perumpamaan ini.
- source_word: ἀροτριῶντα
  choice: sedang membajak
  rationale: Partisipel ini secara khusus menyatakan pekerjaan membajak; bentuk “sedang” menggambarkan kegiatan budak tersebut.
- source_word: ποιμαίνοντα
  choice: menggembalakan ternak
  rationale: Kata kerjanya berarti bertindak sebagai gembala atau menjaga kawanan. “Ternak” ditambahkan secara generik agar ungkapannya wajar dalam bahasa Indonesia tanpa menentukan jenis hewan yang tidak disebutkan teks.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: ketika ia pulang dari ladang
  rationale: Partisipel datif berfungsi secara temporal. “Pulang dari ladang” secara alami menyampaikan gerak masuk setelah pekerjaan di luar selesai.
- source_word: ἐρεῖ αὐτῷ
  choice: akan berkata kepadanya
  rationale: Bentuk futur λέγω diterjemahkan langsung dan mempertahankan susunan pertanyaan retoris.
- source_word: Εὐθέως
  choice: segeralah
  rationale: Adverbia ini menandai tindakan tanpa penundaan dan menyatu secara alami dengan bentuk perintah bahasa Indonesia.
- source_word: παρελθὼν
  choice: kemari
  rationale: Dalam rangkaian dengan perintah berikutnya, partisipel ini menyatakan gerakan mendekat atau mengambil tempat. “Kemari” mempertahankan unsur geraknya tanpa menghasilkan susunan yang kaku.
- source_word: ἀνάπεσε
  choice: berbaringlah untuk makan
  rationale: Kata ini menunjuk pada posisi berbaring ketika makan menurut kebiasaan perjamuan kuno. Terjemahan ini mempertahankan gambaran historisnya, dengan catatan untuk membantu pembaca modern.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam lingkungan rumah tangga perumpamaan
  choice: budak
  alternative: hamba atau pelayan
  rationale: Hubungan kuasa yang tidak seimbang antara tuan dan budak merupakan bagian dari daya retoris ayat ini. “Budak” mempertahankan realitas sosial tersebut tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, sesuai pertanyaan langsung kepada para pendengar. Susunan dibuat alami, tetapi gambaran perjamuan kuno dan kerasnya status sosial δοῦλος tetap dipertahankan.
