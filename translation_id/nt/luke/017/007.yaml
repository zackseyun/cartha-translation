  source_fidelity: 'Makna pokok diteruskan dengan baik: δοῦλον tepat sebagai “budak”, kedua kegiatan pertanian dipertahankan, dan ἀνάπεσε diterjemahkan dengan gambaran berbaring saat makan. Namun, “Segeralah kemari” kurang langsung menyatakan partisipel παρελθών sebagai gerak datang/mendekat yang menyertai perintah berikutnya. Susunan pertanyaan juga perlu sedikit diperjelas agar hubungan antara “siapa” dan “akan berkata” tidak tersendat.'
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. “Siapakah” lebih wajar untuk pertanyaan retoris ini, dan tanda koma sebelum predikat utama membantu pembacaan. “Segera datanglah dan berbaringlah untuk makan” lebih idiomatis serta lebih dekat dengan dua unsur perintah Yunani daripada “Segeralah kemari dan berbaringlah untuk makan”.
  terminology: “Budak” tepat untuk δοῦλος dalam latar rumah tangga perumpamaan dan catatan a secara bertanggung jawab menyebut alternatif tanpa melunakkan status sosialnya. “Menggembalakan ternak” dapat diterima sebagai padanan generik bagi ποιμαίνοντα. Catatan b perlu menjelaskan bahwa berbaring itu dilakukan pada perjamuan/di meja makan, bukan sekadar berbaring sambil makan.
  issues:
