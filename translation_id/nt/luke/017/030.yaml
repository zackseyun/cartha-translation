  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: id
  text: Demikianlah yang akan terjadi pada hari ketika Anak Manusia dinyatakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Demikian pula” atau “Dengan cara yang sama.” Ungkapan Yunani ini merujuk kembali kepada contoh-contoh sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Demikian juga halnya
  rationale: Ungkapan ini merujuk kembali kepada contoh-contoh sebelumnya dan menyatakan kesamaan pola. Pilihan ini alami dalam bahasa Indonesia serta, bersama keterangan waktu berikutnya, mempertahankan orientasi masa depan ayat.
- source_word: ἔσται
  choice: halnya
  rationale: Bentuk futur dari εἰμί menyatakan keadaan yang akan berlaku. Dalam susunan Indonesia, nuansa itu disampaikan secara idiomatis oleh frasa lengkap 'Demikian juga halnya pada hari ketika', tanpa perlu menambahkan kata 'akan' yang terasa kurang alami.
- source_word: ᾗ ἡμέρᾳ
  choice: pada hari ketika
  rationale: Dativ relatif ini berfungsi temporal. 'Pada hari ketika' jelas, wajar, dan mempertahankan kekhususan waktunya.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah gelar khas Yesus dalam Injil dan mempertahankan kaitan mesianik serta apokaliptiknya dengan Daniel 7.
- source_word: ἀποκαλύπτεται
  choice: dinyatakan
  rationale: Bentuk kini pasif ini menunjuk pada penyingkapan atau manifestasi Anak Manusia. 'Dinyatakan' mempertahankan bentuk pasif dan tidak menggantinya dengan gagasan leksikal lain seperti 'datang'.
theological_decisions:
- issue: Penerjemahan gelar eskatologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Bentuk tradisional 'Anak Manusia' mempertahankan pengenalan gelar tersebut dalam Injil dan hubungan antarteksnya dengan Daniel 7, tanpa menyelesaikan ketegangan antara makna harfiah dan fungsi gelarnya.
- issue: Makna ἀποκαλύπτεται dalam konteks
  choice: dinyatakan
  alternative: menampakkan diri; datang
  rationale: Kata kerja Yunani menekankan penyingkapan, bukan semata-mata kedatangan. 'Dinyatakan' menjaga nuansa pasif dan bobot eskatologisnya tanpa memasukkan kata kerja berbeda.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan ringkas mempertahankan hubungan dengan konteks sebelumnya, kekhususan hari tersebut, gelar 'Anak Manusia', dan bentuk pasif dari kata kerja penyingkapan.
