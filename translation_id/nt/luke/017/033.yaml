source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: id
  text: Siapa pun yang berusaha mempertahankan nyawanya[a] akan kehilangan nyawanya, tetapi siapa pun yang kehilangan nyawanya akan memeliharanya tetap hidup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hidupnya" atau "jiwanya". Kata Yunani ψυχή di sini kemungkinan menunjuk pada nyawa atau diri seseorang, bukan khusus pada jiwa sebagai unsur tak berjasmani.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "akan memeliharanya tetap hidup"; dapat juga diterjemahkan "akan menjaga nyawanya tetap hidup" atau, secara tradisional, "akan menyelamatkannya".
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: berusaha
  rationale: Dalam konteks ini, ζητέω menyatakan upaya yang disengaja, bukan sekadar keinginan; 'berusaha' mengungkapkan daya volisional itu secara alami dalam bahasa Indonesia.
- source_word: ψυχὴν
  choice: nyawa
  rationale: Di sini ψυχή menunjuk pada hidup seseorang yang hendak dipertahankan atau dapat hilang, bukan secara khusus unsur rohani tak berjasmani. 'Nyawa' sesuai dengan ancaman kehilangan hidup dan menjaga paradoks ucapan ini.
- source_word: περιποιήσασθαι
  choice: mempertahankan
  rationale: Infinitif medial ini berarti memperoleh atau mengamankan bagi diri sendiri, dan dalam konteks ini bernuansa mempertahankan nyawa melalui upaya melindungi diri.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: akan kehilangan / kehilangan
  rationale: Kedua bentuk ἀπόλλυμι diterjemahkan secara konsisten dengan 'kehilangan' agar paralel dan paradoks dalam ucapan Yesus tetap terlihat.
- source_word: ζῳογονήσει
  choice: akan memeliharanya tetap hidup
  rationale: ζῳογονέω secara harfiah menyatakan menjaga atau memelihara agar tetap hidup. Pilihan ini lebih transparan daripada 'menyelamatkan' dan mempertahankan ketegangan dengan 'kehilangan'.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Siapa pun yang ... tetapi siapa pun yang
  rationale: Konstruksi ini bersifat umum dan bersyarat, sedangkan δέ menandai pertentangan antara kedua bagian.
theological_decisions:
- issue: Makna ψυχή dalam ucapan paradoksal Yesus
  choice: Diterjemahkan 'nyawa'
  alternative: '''hidup'' atau ''jiwa'''
  rationale: Konteksnya berkaitan dengan usaha mempertahankan diri dan kehilangan hidup dalam menghadapi penghakiman. 'Jiwa' dapat memberi kesan dikotomi tubuh-jiwa yang tidak dituntut teks, sedangkan 'nyawa' mempertahankan acuan pada kehidupan pribadi.
- issue: Makna ζῳογονήσει
  choice: Diterjemahkan 'akan memeliharanya tetap hidup'
  alternative: '''akan menyelamatkannya'' atau ''akan mempertahankannya'''
  rationale: Kata Yunani ini bukan verba biasa untuk 'menyelamatkan', melainkan secara lebih khusus berarti menjaga tetap hidup. Terjemahan transparan mempertahankan gambaran dan ketegangan asli tanpa menentukan secara berlebihan bagaimana janji itu digenapi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'nyawanya' dipertahankan untuk memperjelas acuan dan menonjolkan paradoks. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
