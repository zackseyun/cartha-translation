id: LUK.17.20
reference: Luke 17:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: id
  text: Ketika orang-orang Farisi bertanya kepada Yesus kapan Kerajaan Allah akan datang, Ia menjawab mereka, “Kerajaan Allah tidak datang dengan tanda-tanda yang dapat diamati.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan pengamatan,” “dengan cara yang dapat diamati,” atau “dengan pencermatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Ketika orang-orang Farisi bertanya kepada Yesus
  rationale: Partisip aoristus pasif menyatakan keadaan yang mendahului jawaban Yesus. Bentuk aktif dengan pelaku sebagai subjek lebih alami dalam bahasa Indonesia, sementara 'kepada Yesus' memperjelas objek tersirat tanpa mengubah makna. δέ berfungsi sebagai peralihan ringan dan tidak perlu diterjemahkan secara eksplisit di sini.
- source_word: πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: kapan Kerajaan Allah akan datang
  rationale: πότε adalah pertanyaan waktu langsung. Bentuk kini ἔρχεται memiliki arah waktu mendatang dalam pertanyaan ini, sehingga 'akan datang' alami dan jelas dalam bahasa Indonesia.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: Ia menjawab mereka
  rationale: Ungkapan Yunani memakai dua verba yang berdekatan maknanya. Dalam bahasa Indonesia, 'menjawab mereka' menyampaikan keduanya secara alami tanpa pengulangan kaku 'menjawab dan berkata'.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku, transparan, dan tetap mempertahankan bobot teologis ungkapan sumber.
- source_word: Οὐκ ἔρχεται
  choice: tidak datang
  rationale: Bentuk kini menyatakan pernyataan umum tentang cara kedatangan Kerajaan Allah.
- source_word: μετὰ παρατηρήσεως
  choice: dengan tanda-tanda yang dapat diamati
  rationale: παρατήρησις dapat menunjuk pada pengamatan, pengawasan, atau pencermatan. Terjemahan ini menyampaikan bahwa kedatangan kerajaan bukan sesuatu yang ditandai oleh gejala lahiriah yang dapat dipantau, sambil memberi catatan untuk mempertahankan keluasan leksikalnya.
theological_decisions:
- issue: Makna penyangkalan Yesus mengenai cara datangnya Kerajaan Allah
  choice: Kerajaan Allah tidak datang dengan tanda-tanda lahiriah yang dapat diamati atau dipantau.
  alternative: Kerajaan Allah tidak datang melalui pengamatan atau pencermatan.
  rationale: Pilihan utama sesuai konteks pertanyaan tentang waktu kedatangan kerajaan, tetapi catatan kaki mempertahankan ambiguitas παρατήρησις. Terjemahan ini tidak diperluas menjadi penyangkalan mutlak terhadap semua tanda eskatologis dan tidak memaksakan suatu skema eskatologi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aktif pada klausa pembuka dipilih demi kealamian. Sapaan pronominal 'Ia' mempertahankan register Alkitabiah yang umum tanpa menjadi arkais.
