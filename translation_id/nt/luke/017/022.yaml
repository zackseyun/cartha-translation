    issue: “Akan datang waktunya” tidak mempertahankan bentuk jamak ἡμέραι.
    rationale: Teks Yunani berbunyi harfiah “hari-hari akan datang,” dan partitif μίαν τῶν ἡμερῶν kemudian bergantung pada pluralitas itu. Mengganti dengan “waktunya” mengaburkan hubungan tersebut.
  - severity: low
    issue: “Tetapi” memperkuat hubungan antarklausa dibandingkan καί.
    rationale: καί adalah “dan”; hasil negatif memang tersirat secara kontekstual, tetapi tidak perlu dibuat adversatif dalam terjemahan.
