  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: id
  text: Kemudian Ia berkata kepada murid-murid, “Akan datang hari-hari ketika kalian rindu melihat satu saja dari hari-hari Anak Manusia, dan kalian tidak akan melihatnya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hari-hari Anak Manusia” dapat merujuk pada masa kehadiran dan karya-Nya, atau lebih khusus pada penyataan-Nya kelak. Ungkapan Yunani tidak membatasi cakupannya.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Kemudian ia berkata
  rationale: δέ merupakan penghubung ringan yang melanjutkan tuturan; “kemudian” memberi alur naratif alami tanpa menekankan pertentangan.
- source_word: πρὸς τοὺς μαθητάς
  choice: kepada murid-murid
  rationale: Teks Yunani memakai kata sandang tanpa pronomina posesif, sehingga tidak ditambahkan “-Nya”.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Akan datang waktunya
  rationale: Ungkapan Yunani secara harfiah berarti “hari-hari akan datang”; idiom Indonesia ini menyampaikan datangnya suatu masa mendatang secara alami.
- source_word: ἐπιθυμήσετε
  choice: kalian rindu
  rationale: Kata ini menyatakan keinginan yang kuat; “rindu” wajar dan sesuai dengan bobot emosional konteks.
- source_word: μίαν τῶν ἡμερῶν
  choice: satu saja dari hari-hari
  rationale: “Dari” mempertahankan konstruksi partitif, sedangkan “saja” secara alami menonjolkan kerinduan untuk melihat bahkan satu hari.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar ini diterjemahkan secara harfiah untuk mempertahankan gema alkitabiah dan teologisnya.
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: melihat ... tetapi kalian tidak akan melihatnya
  rationale: “Melihat” menerjemahkan kedua bentuk dari ὁράω. “Tetapi” menyatakan kontras alami dalam bahasa Indonesia, dan “-nya” merujuk pada hal yang ingin mereka lihat.
theological_decisions:
- issue: Makna “hari-hari Anak Manusia”
  choice: Ungkapan eskatologis tentang masa Anak Manusia yang cakupannya tetap terbuka
  alternative: Masa pelayanan Yesus di dunia saja, atau secara khusus masa penyataan dan penghakiman-Nya kelak
  rationale: Konteks memungkinkan kerinduan akan kehadiran Yesus sekaligus menunjuk pada penyataan Anak Manusia di masa depan. Terjemahan mempertahankan ungkapan harfiahnya dan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai agar bentuk jamak orang kedua dalam bahasa Yunani tampak jelas. Ungkapan “Akan datang waktunya” dipilih demi kealamian, sementara frasa teologis “hari-hari Anak Manusia” dipertahankan secara dekat dengan sumber.
