  verdict: revise
  source_fidelity: Draf pada umumnya setia pada teks Yunani. Namun, “Akan datang waktunya” mengubah subjek jamak ἡμέραι (“hari-hari”) menjadi ungkapan tunggal “waktunya,” padahal ayat itu kemudian secara eksplisit berbicara tentang “satu dari hari-hari Anak Manusia.” Pengulangan “hari-hari” perlu dipertahankan. Penghubung καί lebih tepat diterjemahkan “dan” daripada “tetapi,” karena teks tidak menyatakan kontras secara eksplisit.
  naturalness: Bahasa draf jelas dan modern. “Akan datang hari-hari ketika” tetap baku serta cukup alami dalam register Alkitab, dan lebih dekat dengan struktur sumber. “Kalian” secara tepat menandai orang kedua jamak.
  terminology: “Anak Manusia” adalah padanan yang tepat dan harus dipertahankan sebagai gelar. Catatan kaki dengan baik mempertahankan keluasan rujukan “hari-hari Anak Manusia” tanpa memutuskan antara masa kehadiran-Nya dan penyataan-Nya di masa depan.
  issues:
