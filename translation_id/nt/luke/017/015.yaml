  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: id
  text: Namun, seorang di antara mereka, ketika melihat bahwa ia telah disembuhkan, kembali sambil memuliakan Allah[a] dengan suara nyaring,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memuji Allah.” Kata kerja Yunani ini dapat berarti “memuliakan” atau “memberikan pujian atau kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Namun, seorang dari antara mereka
  rationale: Frasa ini bersifat partitif, yaitu satu orang dari kelompok yang telah disebut. δέ menandai peralihan sekaligus kontras ringan dengan sembilan orang lainnya; “Namun” menyampaikan fungsi naratif itu secara wajar.
- source_word: ἰδὼν
  choice: ketika melihat
  rationale: Partisip aoris dari ὁράω menunjukkan tindakan yang terjadi sebelum atau berdekatan dengan tindakan kembali. “Ketika melihat” mempertahankan hubungan temporal tanpa membuat urutannya terlalu tegas.
- source_word: ὅτι ἰάθη
  choice: bahwa ia telah disembuhkan
  rationale: ἰάθη adalah bentuk aoris pasif dari ἰάομαι dan secara khusus menunjuk pada penyembuhan. “Telah disembuhkan” menyatakan bahwa kesembuhan itu sudah terjadi ketika ia menyadarinya.
- source_word: ὑπέστρεψεν
  choice: kembali
  rationale: Dalam narasi, ὑποστρέφω lazim berarti kembali ke tempat atau orang sebelumnya. “Kembali” ringkas, alami, dan sesuai dengan gerak kembali kepada Yesus dalam konteks.
- source_word: μετὰ φωνῆς μεγάλης
  choice: dengan suara nyaring
  rationale: Ungkapan ini berarti bersuara keras atau lantang. “Dengan suara nyaring” dekat dengan bentuk Yunani sekaligus alami dan bermartabat dalam bahasa Indonesia.
- source_word: δοξάζων τὸν θεόν
  choice: sambil memuliakan Allah
  rationale: δοξάζω dapat berarti memuliakan atau memberi pujian/kemuliaan. “Memuliakan Allah” mempertahankan kaitan leksikal dengan konsep kemuliaan, sedangkan “sambil” menyatakan tindakan yang menyertai kepulangannya.
theological_decisions:
- issue: Makna δοξάζων dalam tindakan orang yang disembuhkan
  choice: memuliakan Allah
  alternative: memuji Allah
  rationale: Keduanya dimungkinkan secara leksikal. Teks utama memakai “memuliakan” untuk mempertahankan bahasa kemuliaan tanpa meniadakan nuansa pujian; alternatif dicatat agar keluasan makna verba Yunani tetap terlihat.
- issue: Penerjemahan τὸν θεόν
  choice: Allah
  alternative: Tuhan
  rationale: θεός di sini secara langsung merujuk kepada God, sehingga padanan baku “Allah” paling tepat. Tidak diperlukan perluasan kristologis atau doktrinal yang tidak dinyatakan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang mengalir dan bermartabat. Bentuk “seorang dari antara mereka” mempertahankan hubungan partitif, sedangkan “dengan suara nyaring” menghindari ungkapan yang terlalu harfiah atau kaku.
