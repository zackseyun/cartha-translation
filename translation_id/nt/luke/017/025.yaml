  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: id
  text: Namun, terlebih dahulu dia harus menderita banyak hal dan ditolak oleh generasi ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: terlebih dahulu
  rationale: 'Menandai urutan waktu secara alami dan jelas: penderitaan serta penolakan harus terjadi sebelum peristiwa yang baru dibicarakan.'
- source_word: δὲ
  choice: Namun
  rationale: Menyampaikan peralihan yang bernuansa pertentangan ringan dengan konteks sebelumnya.
- source_word: δεῖ
  choice: harus
  rationale: Mempertahankan kekuatan makna keharusan, termasuk kemungkinan nuansa maksud ilahi dalam Lukas, tanpa menambah penjelasan yang tidak dinyatakan.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Anak Manusia dari konteks sebelumnya; huruf kapital mengikuti kebiasaan penulisan Indonesia bagi pronomina yang merujuk kepada Yesus.
- source_word: πολλὰ παθεῖν
  choice: mengalami banyak penderitaan
  rationale: Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan keluasan dan bobot berbagai hal yang akan diderita-Nya.
- source_word: ἀποδοκιμασθῆναι
  choice: ditolak
  rationale: Menyampaikan penolakan sesudah penilaian tanpa memakai istilah teknis atau mempersempit maknanya.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: oleh angkatan ini
  rationale: Dengan verba pasif, ἀπό menunjukkan pelaku atau sumber penolakan. 'Angkatan ini' mempertahankan acuan kepada orang-orang sezaman, bukan sekadar kelompok umur.
theological_decisions:
- issue: Kekuatan δεῖ sehubungan dengan penderitaan Anak Manusia
  choice: Diterjemahkan 'harus' tanpa menjelaskan sumber keharusan itu secara eksplisit.
  alternative: '''merupakan keharusan bagi-Nya'' atau menambahkan bahwa hal itu terjadi menurut rencana Allah'
  rationale: Dalam Lukas, δεῖ kerap mengisyaratkan maksud ilahi, tetapi ayat ini sendiri tidak menyatakannya secara eksplisit. 'Harus' mempertahankan bobot teologis sekaligus ambiguitas sumber keharusan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. 'Namun, terlebih dahulu' dipilih agar hubungan pertentangan dan urutan waktunya sama-sama jelas. Tidak diperlukan catatan kaki.
