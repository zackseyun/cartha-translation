  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: id
  text: Lalu Yesus menjawab, “Bukankah kesepuluh orang itu telah ditahirkan?[a] Tetapi, di manakah sembilan orang itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukankah kesepuluh orang itu telah dibuat bersih?”
    reason: Alternatif leksikal bagi ἐκαθαρίσθησαν, yang menyatakan arti dasar “dibuat bersih.”
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Lalu Yesus berkata
  rationale: Gabungan partisip ἀποκριθεὶς dan verba εἶπεν merupakan rumus pengantar ujaran. Dalam bahasa Indonesia, “Lalu Yesus berkata” menyampaikan perkembangan narasi secara alami tanpa pengulangan kaku seperti “menjawab dan berkata.”
- source_word: Οὐχὶ
  choice: Bukankah
  rationale: Οὐχί memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya. “Bukankah” mempertahankan harapan retoris tersebut dengan wajar.
- source_word: οἱ δέκα
  choice: kesepuluh orang itu
  rationale: Artikel dan bilangan menunjuk kepada kelompok sepuluh orang yang sudah dikenal dari konteks. Bentuk “kesepuluh orang itu” jelas dan alami dalam bahasa Indonesia.
- source_word: ἐκαθαρίσθησαν
  choice: sudah ditahirkan
  rationale: Bentuk pasif καθαρίζω berarti dijadikan bersih atau tahir. Dalam konteks penyakit kulit dan pemeriksaan imam, “ditahirkan” mempertahankan nuansa pemulihan jasmani sekaligus status ketahiran, tidak menyempitkannya menjadi sekadar “disembuhkan.”
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Tetapi, di manakah sembilan orang yang lain?
  rationale: δέ menandai kontras antara satu orang yang kembali dan sembilan lainnya. Susunan ini mempertahankan pertanyaan tentang keberadaan mereka dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna καθαρίζω dalam pemulihan penderita penyakit kulit
  choice: ditahirkan
  alternative: dibersihkan; disembuhkan
  rationale: “Ditahirkan” mempertahankan cakupan istilah Yunani yang dapat mencakup kebersihan atau ketahiran serta pemulihan dari penyakit. Pilihan ini tidak menentukan secara sempit apakah tekanannya hanya ritual atau hanya jasmani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kesepuluh orang itu” dan “sembilan orang yang lain” dipilih agar rujukan kelompok jelas bagi pembaca umum; “ditahirkan” dipertahankan sebagai istilah kontekstual yang tidak menghapus nuansa ketahiran.
