revisions:
- from: Demikian juga kamu. Apabila kamu telah melakukan segala sesuatu yang diperintahkan kepadamu, katakanlah, ‘Kami adalah budak-budak yang tidak layak[a]; kami telah melakukan apa yang wajib kami lakukan[b].’”
  to: Demikian juga kamu, apabila kamu telah melakukan segala sesuatu yang diperintahkan kepada kamu, katakanlah, ‘Kami adalah budak-budak yang tidak berguna[a]; kami telah melakukan apa yang wajib kami lakukan[b].’
  rationale: Revisi mengganti ‘tidak layak’ dengan ‘tidak berguna’ agar arti utama ἀχρεῖοι tetap tampak dalam teks, tanpa meniadakan implikasi kontekstual mengenai tidak adanya hak untuk menuntut penghargaan; implikasi itu dipertahankan dalam catatan kaki. Tanda baca pembuka juga dirapikan untuk mencerminkan hubungan penerapan ‘Demikian juga kamu’ dengan klausa berikutnya, dan tanda kutip penutup yang berlebih dihapus.
