  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: id
  text: Demikian juga kamu, apabila kamu telah melakukan segala sesuatu yang diperintahkan kepada kamu, katakanlah, ‘Kami adalah budak-budak yang tidak berguna[a]; kami telah melakukan apa yang wajib kami lakukan[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak menghasilkan keuntungan.” Kata Yunani ini juga dapat menyiratkan bahwa mereka tidak berhak menuntut penghargaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “apa yang menjadi kewajiban kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga kamu
  rationale: Ungkapan ini menghubungkan penerapan kepada para murid dengan gambaran tentang tuan dan budak dalam ayat-ayat sebelumnya.
- source_word: ὅταν ποιήσητε
  choice: Apabila kamu telah melakukan
  rationale: ὅταν dengan aoristus subjungtif menunjuk pada keadaan umum atau mendatang; bentuk “telah melakukan” menandai bahwa tindakan itu selesai sebelum mereka berkata.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: segala sesuatu yang diperintahkan kepadamu
  rationale: διατάσσω menyatakan perintah yang berwenang, bukan sekadar tugas yang disarankan.
- source_word: λέγετε
  choice: katakanlah
  rationale: Imperatif ini diterjemahkan secara wajar sebagai perintah dalam bahasa Indonesia.
- source_word: Δοῦλοι
  choice: budak-budak
  rationale: Konteks langsung menggambarkan hubungan tuan dan budak; “budak” mempertahankan status terikat dan daya retoris δοῦλος lebih jelas daripada “hamba” atau “pelayan”.
- source_word: ἀχρεῖοί
  choice: yang tidak layak
  rationale: Dalam konteks ini, kata tersebut menegaskan bahwa ketaatan tidak memberi budak hak untuk menuntut penghargaan. Pilihan ini menghindari kesan bahwa mereka sama sekali tidak berguna, sambil mempertahankan kerendahan diri yang dituntut.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: apa yang wajib kami lakukan
  rationale: ὀφείλω menyatakan kewajiban atau utang tanggung jawab; “wajib” merupakan padanan Indonesia yang langsung dan alami.
- source_word: πεποιήκαμεν
  choice: kami telah melakukan
  rationale: Bentuk perfek menyatakan tindakan yang sudah selesai dengan relevansi pada saat berbicara; “telah melakukan” mempertahankan aspek itu secara alami.
theological_decisions:
- issue: Makna δοῦλοι dalam perumpamaan tentang pemuridan
  choice: budak-budak
  alternative: hamba-hamba; pelayan-pelayan
  rationale: Gambaran dalam konteks ialah hubungan tuan-budak. Terjemahan “budak-budak” mempertahankan ketimpangan status dan tuntutan ketaatan dalam ilustrasi tanpa mengubahnya menjadi jabatan pelayanan sukarela.
- issue: Makna ἀχρεῖοι
  choice: tidak layak
  alternative: tidak berguna; tidak menghasilkan keuntungan; tidak berhak menuntut penghargaan
  rationale: Kata Yunani dapat berarti tidak berguna atau tidak menguntungkan. Dalam alur perkataan ini, pokoknya ialah bahwa pelaksanaan kewajiban tidak menghasilkan jasa lebih yang membuat tuan berutang kepada budak. Teks utama mempertahankan gagasan tiadanya kelayakan untuk menuntut imbalan, sedangkan catatan kaki menjaga rentang leksikal yang lebih keras.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” bersifat jamak sesuai konteks sapaan kepada para murid. Istilah “budak-budak” sengaja dipertahankan karena status sosial dalam ilustrasi itu penting, sedangkan catatan kaki pada “tidak layak” menjaga ambiguitas leksikal ἀχρεῖοι.
