review_pass:
  verdict: revise
  source_fidelity: 'Struktur kalimat dan aspek waktu telah diterjemahkan dengan baik: ὅταν ποιήσητε dipahami sebagai tindakan yang telah selesai sebelum perintah λέγετε, πάντα τὰ διαταχθέντα mempertahankan cakupan ‘segala sesuatu’, dan ὀφείλομεν menyatakan kewajiban. Namun, ἀχρεῖοι secara leksikal terutama berarti ‘tidak berguna/tidak menguntungkan’, bukan ‘tidak layak’. Konteks memang mendukung implikasi bahwa para budak tidak dapat menuntut imbalan, tetapi terjemahan utama perlu mempertahankan arti leksikal tersebut dan membiarkan catatan kaki menjelaskan implikasinya.'
  naturalness: Bahasa draft umumnya baku dan jelas. ‘Kami adalah budak-budak yang tidak layak’ kurang idiomatis karena ‘tidak layak’ biasanya memerlukan pelengkap (misalnya, tidak layak menerima apa). ‘Kami adalah budak-budak yang tidak berguna’ lebih langsung dan alami dalam bingkai metafora ini. Tanda kutip penutup ganda pada akhir ayat juga perlu diperbaiki.
  terminology: ‘Budak-budak’ tepat untuk mempertahankan δοῦλοι dalam ilustrasi tuan-budak. ‘Yang tidak berguna’ merupakan padanan utama yang lebih dekat untuk ἀχρεῖοι; catatan kaki dapat memelihara nuansa ‘tidak menghasilkan keuntungan’ dan implikasi tidak adanya hak atas penghargaan. ‘Wajib kami lakukan’ tepat untuk ὃ ὠφείλομεν ποιῆσαι.
