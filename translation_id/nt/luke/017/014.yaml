  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: id
  text: Ketika Ia melihat mereka, Ia berkata kepada mereka, “Pergilah dan perlihatkanlah diri kalian kepada para imam[a].” Ketika mereka sedang dalam perjalanan, mereka ditahirkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perintah untuk memperlihatkan diri kepada para imam berkaitan dengan pemeriksaan oleh imam bagi orang yang telah pulih dari penyakit kulit; lihat Imamat 14.
    reason: cross_reference
  - marker: b
    text: Atau “menjadi tahir.” Kata kerja Yunani ini dapat menunjuk pada pentahiran dalam arti jasmani maupun ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika melihat mereka
  rationale: Partisip aoris ini berhubungan dengan kata kerja utama εἶπεν dan secara alami dinyatakan sebagai anak kalimat waktu. Kata “mereka” disuplai dari konteks serta dari αὐτοῖς yang langsung menyusul.
- source_word: Πορευθέντες
  choice: pergilah
  rationale: Partisip aoris ini berfungsi bersama imperatif ἐπιδείξατε. Bentuk perintah “pergilah” menyampaikan urutan tindakan dengan wajar dalam bahasa Indonesia.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: perlihatkanlah dirimu
  rationale: Ungkapan ini jelas dan alami dalam konteks pemeriksaan oleh para imam. Bahasa Indonesia tidak membedakan bentuk imperatif tunggal dan jamak; konteks menunjukkan bahwa perintah ditujukan kepada mereka semua.
- source_word: τοῖς ἱερεῦσιν
  choice: kepada para imam
  rationale: “Para imam” mempertahankan bentuk jamak dan merujuk kepada imam-imam yang bertugas memeriksa serta mengakui ketahiran menurut Taurat.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: ketika mereka sedang pergi
  rationale: Konstruksi ini menunjukkan bahwa pentahiran terjadi sementara mereka dalam perjalanan. Ungkapan Indonesia ini mempertahankan hubungan waktu tersebut tanpa meniru bentuk Yunani secara kaku.
- source_word: ἐκαθαρίσθησαν
  choice: mereka ditahirkan
  rationale: Bentuk pasif dari καθαρίζω dipertahankan. “Ditahirkan” mencakup pemulihan jasmani sekaligus dimensi ketahiran ritual dengan lebih tepat daripada sekadar “disembuhkan”.
theological_decisions:
- issue: Bahasa pentahiran dalam konteks penyakit kulit dan pemeriksaan imam
  choice: mereka ditahirkan
  alternative: mereka disembuhkan; mereka menjadi tahir
  rationale: Teks Yunani memakai bahasa pentahiran, bukan kata umum untuk penyembuhan. Bentuk ini mempertahankan kaitan antara pemulihan tubuh dan status tahir secara ritual, sekaligus mempertahankan bentuk pasif tanpa menentukan secara eksplisit pelakunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan khidmat. Kata ganti “Ia” mempertahankan kesinambungan subjek dari konteks tanpa mengulang nama Yesus yang tidak terdapat dalam ayat ini. Istilah “ditahirkan” dipilih karena dapat dipahami oleh pembaca umum sekaligus menjaga latar ritual teks.
