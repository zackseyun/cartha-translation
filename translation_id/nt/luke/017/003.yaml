id: LUK.17.3
reference: Luke 17:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: id
  text: Jagalah diri kalian sendiri. Jika saudaramu[b] berbuat dosa[a], tegurlah dia, dan jika dia bertobat, ampunilah dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Jika saudaramu berbuat dosa terhadapmu, tegurlah dia.”
    reason: textual_variant
  - marker: b
    text: Kata “saudara” berbentuk maskulin tunggal dalam bahasa Yunani dan dapat menunjuk secara lebih luas kepada sesama murid.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: Jagalah
  rationale: Bentuk imperatif kini menyerukan kewaspadaan yang terus-menerus. “Jagalah” menyampaikan daya peringatan secara alami dalam bahasa Indonesia.
- source_word: ἑαυτοῖς
  choice: diri kalian sendiri
  rationale: Pronomina refleksif datif berbentuk jamak. Ungkapan ini mempertahankan unsur refleksif dan jumlah jamak tanpa menentukan apakah perhatian itu terutama bersifat pribadi atau timbal balik dalam komunitas.
- source_word: ἁμάρτῃ
  choice: berbuat dosa
  rationale: Teks SBLGNT tidak menyebut objek seperti “terhadapmu”. Karena itu, terjemahan utama mempertahankan cakupan umum verba ini.
- source_word: ὁ ἀδελφός σου
  choice: saudaramu
  rationale: Bahasa Yunani memakai nomina maskulin tunggal. “Saudaramu” dekat dengan bentuk sumber, sedangkan kemungkinan maknanya yang lebih luas sebagai sesama murid dijelaskan dalam catatan kaki.
- source_word: ἐπιτίμησον
  choice: tegurlah
  rationale: Imperatif aoris ini menuntut koreksi verbal secara langsung. “Tegurlah” mempertahankan ketegasannya tanpa memberi kesan hukuman yang tidak dinyatakan teks.
- source_word: μετανοήσῃ
  choice: bertobat
  rationale: “Bertobat” merupakan padanan baku dalam konteks moral dan rohani serta mencakup perubahan sikap yang berkaitan dengan pengampunan.
- source_word: ἄφες
  choice: ampunilah
  rationale: Dalam hubungan antarmanusia, ἀφίημι berarti mengampuni. Bentuk imperatif “ampunilah” jelas dan wajar dalam register Alkitab modern.
theological_decisions:
- issue: Apakah frasa “terhadapmu” perlu dimasukkan setelah “berbuat dosa”
  choice: Tidak memasukkan “terhadapmu” dalam teks utama
  alternative: Jika saudaramu berbuat dosa terhadapmu, tegurlah dia.
  rationale: Teks Yunani yang diberikan hanya berbunyi ἐὰν ἁμάρτῃ ὁ ἀδελφός σου tanpa εἰς σέ atau ungkapan sepadan. Penghilangan itu mempertahankan cakupan bacaan SBLGNT, sedangkan varian yang lebih panjang dicatat dalam catatan kaki.
- issue: Cakupan gender ἀδελφός
  choice: saudaramu
  alternative: saudara atau saudarimu; sesamamu yang percaya
  rationale: Bentuk Yunani adalah maskulin tunggal. Terjemahan mempertahankan bentuk itu, tetapi catatan kaki menjelaskan bahwa dalam konteks ini kata tersebut dapat menunjuk secara lebih luas kepada sesama murid.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” mempertahankan jumlah jamak pada ἑαυτοῖς, sedangkan “saudaramu” mempertahankan peralihan sumber ke bentuk tunggal. Penanda catatan ditempatkan langsung sesudah unsur yang dijelaskannya.
