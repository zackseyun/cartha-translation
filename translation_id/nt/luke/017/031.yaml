  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: id
  text: Pada hari itu, siapa pun yang berada di atas atap rumah[b], sementara barang-barangnya ada di dalam rumah, janganlah turun untuk mengambilnya. Demikian juga, orang yang berada di ladang janganlah berbalik[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah berbalik ke hal-hal yang di belakang.” Ungkapan ini dapat dipahami sebagai larangan untuk kembali kepada apa yang telah ditinggalkan.
    reason: lexical_alternative
  - marker: b
    text: Atap rumah pada masa itu biasanya datar serta dapat dicapai dan digunakan sebagai ruang kegiatan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Pada hari itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tetap mempertahankan penunjukan khusus melalui kata ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: siapa pun yang berada
  rationale: Bentuk relatif dengan verba kala mendatang berfungsi menggeneralisasi orang yang kelak berada dalam keadaan tersebut; rumusan ini alami tanpa menonjolkan unsur waktu secara berlebihan.
- source_word: ἐπὶ τοῦ δώματος
  choice: di atas atap rumah
  rationale: δώμα menunjuk pada bagian atap datar rumah yang dapat diakses dan digunakan. Pilihan ini mempertahankan gambaran konkret serta mudah dipahami pembaca Indonesia.
- source_word: τὰ σκεύη αὐτοῦ
  choice: barang-barangnya
  rationale: σκεύη dapat berarti perkakas, barang, atau harta benda. Dalam konteks ini, 'barang-barangnya' secara wajar mencakup milik pribadi yang dapat diambil dari rumah.
- source_word: μὴ καταβάτω
  choice: janganlah turun
  rationale: Imperatif orang ketiga berbentuk larangan diterjemahkan sebagai larangan tegas, sesuai dengan urgensi perkataan ini.
- source_word: ἆραι αὐτά
  choice: untuk mengambilnya
  rationale: αἴρω di sini berarti mengambil atau membawa barang tersebut. 'Mengambilnya' cukup jelas dalam konteks tanpa menambahkan arah yang tidak perlu.
- source_word: ὁ ἐν ἀγρῷ
  choice: orang yang berada di ladang
  rationale: Artikel substantival dengan frasa preposisional menunjuk pada seseorang sebagai contoh umum; bentuk ini jelas dan menjaga kesejajaran dengan klausa pertama.
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menandai bahwa larangan kedua berlaku dengan cara yang sama seperti larangan pertama, dalam bentuk Indonesia yang alami.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: janganlah berbalik
  rationale: Gabungan ini secara idiomatis menyatakan tindakan berbalik atau kembali ke arah belakang. Terjemahan ringkas ini alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki untuk mempertahankan nuansa sumber.
theological_decisions:
- issue: Gambaran tentang urgensi eskatologis
  choice: Mempertahankan perintah konkret agar tidak turun mengambil barang dan tidak berbalik.
  alternative: Menggeneralisasikannya menjadi nasihat untuk tidak melekat pada harta benda.
  rationale: Teks Yunani menyajikan adegan dan tindakan yang konkret sehubungan dengan 'hari itu'. Mempertahankan gambaran tersebut menjaga urgensi teks dan tidak memasukkan penerapan moral yang lebih luas ke dalam terjemahan.
- issue: Objek tersirat dalam εἰς τὰ ὀπίσω
  choice: Menerjemahkan secara idiomatis sebagai 'berbalik' dan menjelaskan bentuk harfiah dalam catatan kaki.
  alternative: Menerjemahkan sebagai 'kembali untuk mengambil apa yang ditinggalkannya'.
  rationale: Frasa Yunani secara harfiah menunjuk ke arah belakang, tetapi tidak menyebut secara eksplisit bahwa orang itu kembali untuk mengambil barang. Terjemahan utama tidak menambahkan tujuan tersebut, sehingga ambiguitas teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara gambaran konkret dan kekuatan larangan dalam teks Yunani dipertahankan. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
