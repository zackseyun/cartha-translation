review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena πρὸς αὐτήν secara eksplisit merujuk kepada Yerusalem dalam orang ketiga tunggal (“kepadanya”), bukan kepada lawan bicara orang kedua (“kepadamu”). Peralihan yang sesungguhnya ke orang kedua jamak baru terjadi pada οὐκ ἠθελήσατε (“kalian tidak mau”). Selebihnya, ratapan, pengulangan nama kota, tindakan khas dalam partisipel kini, gambaran induk ayam, dan kontras kehendak tersampaikan dengan setia.
  naturalness: Teksnya baku, modern, dan bernada ratapan. “Merajam,” “induk ayam,” dan “kalian tidak mau” natural dalam register Alkitab Indonesia. Penggunaan “kepadanya” tetap jelas dan justru mempertahankan personifikasi Yerusalem dengan lebih tepat.
  terminology: “Yerusalem,” “para nabi,” “merajam,” dan “induk ayam” sesuai penggunaan umum. “Anak-anakmu” mempertahankan metafora tanpa mempersempit referennya. Catatan kaki direvisi agar benar-benar menawarkan alternatif leksikal, bukan menyebut parafrasa yang diberi tambahan verba sebagai terjemahan harfiah.
  issues:
  - severity: medium
    issue: “orang-orang yang diutus kepadamu”
    rationale: Teks Yunani berbunyi τοὺς ἀπεσταλμένους πρὸς αὐτήν, dengan pronomina orang ketiga tunggal feminin (“kepada dia,” yakni Yerusalem), sedangkan draf mengubahnya menjadi orang kedua (“kepadamu”). Hal ini mengaburkan kontras gramatikal dengan penutup, yang memang menggunakan orang kedua jamak.
  - severity: low
    issue: Rumusan catatan kaki “Secara harfiah”
    rationale: Catatan kaki memasukkan “mengumpulkan,” padahal verba tersebut dielipsiskan dalam bagian pembanding Yunani, serta “kelompok anaknya” bukan padanan literal yang perlu. Lebih tepat diberi sebagai alternatif terjemahan untuk ὄρνις dan νοσσιά.
  revised_text: Yerusalem, Yerusalem, yang membunuh para nabi dan merajam orang-orang yang diutus kepadanya—betapa sering Aku ingin mengumpulkan anak-anakmu seperti induk ayam mengumpulkan anak-anaknya di bawah sayapnya,[a] tetapi kalian tidak mau.
