revisions:
- from: Yerusalem, Yerusalem, yang membunuh para nabi dan merajam orang-orang yang diutus kepadamu—betapa sering Aku ingin mengumpulkan anak-anakmu seperti induk ayam mengumpulkan anak-anaknya di bawah sayapnya,[a] tetapi kalian tidak mau.
  to: Yerusalem, Yerusalem, yang membunuh para nabi dan merajam orang-orang yang diutus kepadanya—betapa sering Aku ingin mengumpulkan anak-anakmu seperti induk ayam mengumpulkan anak-anaknya di bawah sayapnya,[a] tetapi kalian tidak mau.
  rationale: Mengganti “kepadamu” dengan “kepadanya” untuk menerjemahkan αὐτήν secara tepat dan mempertahankan pergeseran teks dari Yerusalem yang dipersonifikasikan sebagai tunggal kepada para penolak sebagai jamak. Catatan kaki juga diperjelas sebagai alternatif leksikal yang akurat. Tidak ada perubahan makna lain.
