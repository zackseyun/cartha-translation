id: LUK.13.34
reference: Luke 13:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: id
  text: Yerusalem, Yerusalem, yang membunuh para nabi dan merajam orang-orang yang diutus kepadanya—betapa sering Aku ingin mengumpulkan anak-anakmu seperti induk ayam mengumpulkan anak-anaknya di bawah sayapnya,[a] tetapi kalian tidak mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti seekor burung mengumpulkan anak-anaknya di bawah sayapnya.” Kata Yunani ὄρνις dapat berarti burung secara umum, tetapi dalam gambaran keibuan ini “induk ayam” merupakan padanan yang paling alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Yerusalem, Yerusalem
  rationale: Memakai bentuk baku nama tempat dalam bahasa Indonesia dan mempertahankan pengulangan sebagai seruan ratapan yang penuh penekanan.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: yang membunuh ... dan merajam
  rationale: Klausa relatif paling alami dalam bahasa Indonesia; bentuk kini partisipial Yunani menggambarkan tindakan yang menjadi ciri Yerusalem, bukan semata-mata satu kejadian.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: orang-orang yang diutus kepadamu
  rationale: Mempertahankan bentuk pasif dan mengalihkan orang ketiga Yunani ke orang kedua secara wajar karena Yerusalem sedang disapa langsung.
- source_word: ποσάκις ἠθέλησα
  choice: betapa sering Aku ingin
  rationale: Mengungkapkan frekuensi dalam nada ratapan dan mempertahankan bahasa kehendak atau keinginan dari θέλω.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: mengumpulkan anak-anakmu
  rationale: Mempertahankan personifikasi Yerusalem sebagai kota-ibu tanpa mempersempit siapa yang dimaksud dengan anak-anaknya.
- source_word: ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: seperti induk ayam mengumpulkan anak-anaknya
  rationale: ὄρνις dapat berarti burung secara umum, tetapi gambaran maternal tentang anak-anak yang dinaungi sayap paling alami dinyatakan sebagai induk ayam; νοσσιά disampaikan secara idiomatis sebagai anak-anaknya.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: di bawah sayapnya
  rationale: Padanan langsung dan alami yang mempertahankan gambaran perlindungan.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: tetapi kalian tidak mau
  rationale: Konjungsi καί berfungsi adversatif dalam konteks ini. Bentuk jamak ἠθελήσατε dibuat jelas dengan 'kalian', membedakannya dari Yerusalem tunggal yang dipersonifikasikan.
theological_decisions:
- issue: Rujukan 'anak-anakmu'
  choice: anak-anakmu
  alternative: penduduk Yerusalem; umat yang diwakili oleh Yerusalem
  rationale: Teks menyapa Yerusalem sebagai kota-ibu dan tidak menentukan rujukan itu lebih sempit. Metafora serta ambiguitasnya dipertahankan.
- issue: Kontras kehendak dalam ἠθέλησα / ἠθελήσατε
  choice: Aku ingin ... kalian tidak mau
  alternative: Aku berkehendak ... kalian tidak bersedia
  rationale: Pilihan ini mempertahankan kontras volisional eksplisit tanpa memasukkan kesimpulan doktrinal yang melampaui ayat.
- issue: Peralihan dari Yerusalem tunggal kepada penolak jamak
  choice: kepadamu ... kalian tidak mau
  alternative: kepadanya ... kamu tidak mau
  rationale: Bahasa Yunani beralih dari sapaan kepada Yerusalem sebagai tunggal ke kata kerja orang kedua jamak pada penutup. 'Kalian' menjaga perubahan gramatikal dan membuka kemungkinan bahwa penolakan dilakukan oleh orang-orang Yerusalem, tanpa menjelaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. 'Merajam' dipertahankan sebagai istilah umum untuk membunuh atau menyerang dengan lemparan batu. Huruf kapital pada 'Aku' mengikuti kebiasaan terjemahan Alkitab Indonesia untuk ucapan Yesus. Tanda pisah mempertahankan gerak retoris ratapan; 'kalian' menyatakan bentuk jamak Yunani secara jelas.
