id: LUK.13.30
reference: Luke 13:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: id
  text: Dan lihatlah, ada yang terakhir yang akan menjadi yang pertama, dan ada yang pertama yang akan menjadi yang terakhir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: perhatikanlah
  rationale: Kata ini berfungsi menarik perhatian kepada pernyataan yang menyusul. 'Perhatikanlah' alami, jelas, dan bermartabat dalam bahasa Indonesia modern tanpa kesan terlalu arkais.
- source_word: ἔσχατοι
  choice: orang-orang terakhir
  rationale: Menunjukkan mereka yang berada pada posisi terakhir atau terbawah, serta mempertahankan pertentangan ringkas dengan πρῶτοι tanpa mempersempit maknanya menjadi penilaian moral.
- source_word: πρῶτοι
  choice: orang-orang pertama
  rationale: Padanan langsung dan idiomatis bagi πρῶτοι, sekaligus mempertahankan kesejajaran dengan 'orang-orang terakhir'.
- source_word: οἳ ἔσονται
  choice: yang akan menjadi
  rationale: Menerjemahkan klausa relatif dengan bentuk mendatang secara langsung dan wajar.
- source_word: εἰσὶν
  choice: ada
  rationale: Mempertahankan daya eksistensial ungkapan Yunani. Nomina tersirat dibuat eksplisit sebagai 'orang-orang' agar kalimat alami dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung biasa ini dipertahankan untuk menjaga keseimbangan kedua bagian perkataan tersebut.
theological_decisions:
- issue: Cakupan pembalikan kedudukan
  choice: Diterjemahkan sebagai pernyataan umum tentang pembalikan kedudukan tanpa menentukan kelompok etnis, sosial, atau kategori eskatologis tertentu.
  alternative: Menafsirkannya secara khusus sebagai pembalikan antara bangsa-bangsa lain dan orang Yahudi, antara orang rendah hati dan orang sombong, atau sebagai peringkat dalam penghakiman terakhir.
  rationale: Dalam konteksnya perkataan ini berkaitan dengan masuk ke dalam Kerajaan Allah dan dapat memiliki beberapa lapisan penerapan, tetapi teks Yunani sendiri menyatakannya secara singkat dan umum. Terjemahan mempertahankan keluasan dan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas, berimbang, dan bermartabat. Pengulangan 'orang-orang ... yang akan menjadi' dipertahankan untuk mencerminkan paralelisme aforistis teks Yunani.
