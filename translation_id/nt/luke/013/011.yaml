revisions:
- from: Lihatlah, di situ ada seorang perempuan yang selama delapan belas tahun dirasuki roh yang menyebabkan kelemahan[a]. Tubuhnya bungkuk dan sama sekali tidak dapat berdiri tegak.
  to: Lihatlah, ada seorang perempuan yang selama delapan belas tahun mempunyai roh kelemahan[a]. Ia bungkuk dan tidak dapat menegakkan tubuhnya sepenuhnya.
  rationale: Revisi menghilangkan tambahan makna “dirasuki,” mempertahankan konstruksi sumber yang menyebut perempuan itu mempunyai “roh kelemahan,” dan menerjemahkan εἰς τὸ παντελές sebagai ketidakmampuan untuk menegakkan tubuh sepenuhnya. Makna, nada naratif, dan ambiguitas teologis sumber dipertahankan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:17Z'
review_pass:
  verdict: revise
  source_fidelity: Terjemahan saat ini mempertahankan unsur eksplisit πνεῦμα dan durasi delapan belas tahun, tetapi “dirasuki” menambahkan gagasan kerasukan/penguasaan yang tidak dinyatakan oleh ἔχουσα (“mempunyai”). “Sama sekali tidak dapat berdiri tegak” juga berpotensi menggeser εἰς τὸ παντελές dari ketidakmampuan untuk tegak sepenuhnya menjadi ketidakmampuan mutlak untuk berdiri tegak.
  naturalness: “Lihatlah” dan “seorang perempuan” sesuai register naratif Indonesia standar. “Mempunyai roh kelemahan” cukup langsung dan dapat dipahami, sementara susunan kalimat yang direvisi tetap alami. “Tidak dapat menegakkan tubuhnya sepenuhnya” menyatakan kondisi fisik dengan lebih tepat.
  terminology: “Roh kelemahan” mempertahankan πνεῦμα dan genitif ἀσθενείας tanpa memastikan bahwa roh itu adalah setan atau bahwa perempuan itu kerasukan. Istilah ini juga mempertahankan ambiguitas sumber tentang sifat peranan roh tersebut.
  issues:
  - severity: high
    issue: “dirasuki roh” melebihi makna eksplisit sumber.
    rationale: Yunani memakai γυνὴ πνεῦμα ἔχουσα ἀσθενείας, secara harfiah seorang perempuan “mempunyai roh kelemahan.” Kerasukan adalah penafsiran yang lebih khusus dan sebaiknya tidak ditempatkan dalam teks utama.
  - severity: medium
    issue: “sama sekali tidak dapat berdiri tegak” kurang tepat untuk εἰς τὸ παντελές.
    rationale: Frasa ini terutama menandaskan bahwa ia tidak dapat menegakkan diri dengan sepenuhnya/utuh, bukan mesti bahwa ia sama sekali tidak mampu berdiri tegak dalam arti apa pun.
  - severity: low
    issue: Catatan kaki menyebut bentuk literal yang tidak dipakai dalam teks utama.
    rationale: Setelah teks utama diperbaiki menjadi “mempunyai roh kelemahan,” catatan kaki sebaiknya berfokus pada alternatif dan ambiguitas, bukan memperlakukan teks utama sebagai sekadar bentuk literal yang terpisah.
  revised_text: Lihatlah, ada seorang perempuan yang selama delapan belas tahun mempunyai roh kelemahan[a]. Ia bungkuk dan tidak dapat menegakkan tubuhnya sepenuhnya.
  revised_footnotes:
