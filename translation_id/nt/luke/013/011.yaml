id: LUK.13.11
reference: Luke 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: id
  text: Lihatlah, ada seorang perempuan yang selama delapan belas tahun mempunyai roh kelemahan[a]. Ia bungkuk dan tidak dapat menegakkan tubuhnya sepenuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh yang menyebabkan kelemahan.” Bahasa Yunani secara eksplisit menyebut “roh”, tetapi tidak menjelaskan lebih lanjut sifat atau peranan roh itu.
    reason: Mempertahankan penyebutan eksplisit tentang roh serta ambiguitas ungkapan πνεῦμα ἀσθενείας, tanpa menambahkan gagasan kerasukan atau identifikasi demonologis.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi interjeksi yang menarik perhatian dan menghidupkan narasi, dengan bahasa Indonesia yang tetap wajar dan bermartabat.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Memperkenalkan seorang tokoh perempuan yang belum disebut sebelumnya.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: dirasuki roh yang menyebabkan kelemahan
  rationale: Mempertahankan penyebutan eksplisit tentang roh serta kaitannya dengan kelemahan, tanpa secara khusus menyebut roh itu sebagai setan. Ungkapan 'dirasuki' di sini menyatakan bahwa perempuan itu berada di bawah pengaruh roh tersebut, bukan menetapkan rincian demonologis yang tidak dinyatakan ayat ini.
- source_word: ἔτη δεκαοκτώ
  choice: selama delapan belas tahun
  rationale: Kata 'selama' menyatakan durasi secara alami dalam bahasa Indonesia.
- source_word: συγκύπτουσα
  choice: Tubuhnya bungkuk
  rationale: Menggambarkan kondisi jasmani yang terus-menerus dengan jelas dan alami.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: tidak dapat berdiri tegak
  rationale: Menyampaikan ketidakmampuan untuk menegakkan tubuh dalam konteks kondisi bungkuk.
- source_word: εἰς τὸ παντελές
  choice: sama sekali
  rationale: Mempertahankan penegasan menyeluruh pada ketidakmampuannya; konteksnya memungkinkan nuansa 'sepenuhnya', yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah πνεῦμα ἀσθενείας harus diterjemahkan dengan menghilangkan atau memperkecil unsur peranan roh
  choice: Mempertahankan penyebutan 'roh' dalam teks utama
  alternative: penyakit yang melemahkan; roh kelemahan
  rationale: Bahasa Yunani secara eksplisit menyebut πνεῦμα. Terjemahan mempertahankan unsur rohani itu tanpa menambahkan klaim bahwa ayat ini secara eksplisit menyebut kerasukan setan.
- issue: Cakupan εἰς τὸ παντελές terhadap ketidakmampuan perempuan itu
  choice: sama sekali tidak dapat berdiri tegak
  alternative: tidak dapat menegakkan tubuhnya sepenuhnya
  rationale: Pilihan utama memahami frasa tersebut sebagai penegasan mutlak atas ketidakmampuannya. Karena konstruksi ini juga dapat dipahami sebagai ketidakmampuan menegakkan tubuh sepenuhnya, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. 'Lihatlah' mempertahankan daya tarik perhatian dari ἰδοὺ. Susunan dipecah menjadi dua kalimat agar jelas bagi pembaca umum tanpa menghilangkan hubungan antargagasan.
