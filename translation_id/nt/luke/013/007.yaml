  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: id
  text: Lalu ia berkata kepada penggarap kebun anggur itu, “Lihat, selama tiga tahun ini aku datang mencari buah pada pohon ara ini, tetapi tidak menemukan buah. Tebanglah pohon ini! Mengapa pohon ini juga membuat tanah itu tidak produktif?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa pohon ini juga membuat tanah itu tidak berguna?” Kata kerja Yunani dapat berarti menjadikan tanah tidak berguna atau tidak produktif, bukan sekadar memakai tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: penggarap kebun anggur
  rationale: Istilah ini menunjuk kepada orang yang mengusahakan atau merawat kebun anggur; pilihan ini tepat, jelas, dan mempertahankan latar kebun anggur.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Kata ini menarik perhatian secara tegas dan dapat disampaikan secara wajar dalam bahasa Indonesia modern dengan “Lihat”.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: sudah tiga tahun
  rationale: Ungkapan ini menyatakan rentang waktu dari masa lalu sampai saat berbicara.
- source_word: ἔρχομαι ζητῶν
  choice: aku datang mencari
  rationale: Gabungan verba kini dan partisipel menggambarkan tindakan mencari yang dilakukan dalam kunjungan-kunjungan selama rentang tiga tahun; susunan ini tetap dekat dengan bentuk Yunani dan alami dalam bahasa Indonesia.
- source_word: καρπὸν
  choice: buah
  rationale: Makna harfiah pertanian dipertahankan tanpa memasukkan tafsiran rohani ke dalam teks perumpamaan.
- source_word: συκῇ
  choice: pohon ara
  rationale: Padanan baku dan jelas untuk jenis pohon yang dimaksud.
- source_word: οὐχ εὑρίσκω
  choice: tidak menemukannya
  rationale: Bentuk kini Yunani menyimpulkan hasil pencarian yang terus gagal; dalam konteks Indonesia, bentuk ini mengalir alami setelah “sudah tiga tahun aku datang mencari”.
- source_word: ἔκκοψον αὐτήν
  choice: Tebanglah pohon ini
  rationale: Imperatif aoris menyampaikan perintah langsung untuk menebang pohon; nomina diulang agar rujukannya jelas dan alami.
- source_word: ἱνατί
  choice: Untuk apa
  rationale: Dalam pertanyaan retoris ini, “Untuk apa” menyampaikan gagasan alasan atau tujuan secara alami.
- source_word: καὶ
  choice: saja
  rationale: Partikel καί di sini memberi tekanan tambahan; dalam susunan Indonesia, “saja” menonjolkan bahwa pohon itu tidak berbuah dan hanya membebani tanah.
- source_word: γῆν
  choice: tanah
  rationale: Dalam konteks pertanian, kata ini dapat menunjuk kepada tanah atau lahan tempat pohon tumbuh.
- source_word: καταργεῖ
  choice: terus menghabiskan
  rationale: Pilihan ini menyampaikan dampak praktis pohon yang memakai lahan atau sumber daya tanpa menghasilkan buah, sambil menyisakan alternatif leksikal bahwa tanah dibuat tidak produktif.
theological_decisions:
- issue: Gambaran perumpamaan dan penafsiran teologis
  choice: Mempertahankan bahasa pertanian secara harfiah
  alternative: Menjelaskan pohon yang tidak berbuah sebagai ketidakberbuahan rohani langsung dalam teks
  rationale: Ayat ini merupakan bagian dari perumpamaan; terjemahan tidak boleh memasukkan penafsiran teologis yang tidak dinyatakan secara eksplisit.
- issue: Cakupan makna καταργεῖ
  choice: “terus menghabiskan tanah” dalam teks dengan alternatif pada catatan kaki
  alternative: “membuat tanah tidak berguna/tidak produktif”
  rationale: Verba Yunani dapat menggambarkan pemakaian lahan secara sia-sia maupun akibat menjadikannya tidak produktif. Teks utama dibuat idiomatis, sedangkan ambiguitas yang nyata dipertahankan melalui catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami tanpa menghilangkan ketegasan pemilik kebun. Penanda catatan kaki ditempatkan sesudah pertanyaan yang diterangkannya.
