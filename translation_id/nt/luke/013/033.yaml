id: LUK.13.33
reference: Luke 13:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: id
  text: Namun, Aku harus melanjutkan perjalanan-Ku hari ini, besok, dan lusa[a], karena tidak mungkin seorang nabi binasa di luar Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “hari ini, besok, dan lusa” mungkin digunakan secara idiomatis untuk suatu rangkaian singkat yang sudah ditetapkan, bukan untuk menunjuk tepat tiga hari kalender.
    reason: cultural_note
  - marker: b
    text: Ungkapan ini juga dapat dipahami sebagai “tidak dapat diterima” atau “tidak terpikirkan” bahwa seorang nabi binasa di luar Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai pertentangan atau pembatasan yang kuat terhadap pernyataan sebelumnya dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: δεῖ με
  choice: Aku harus
  rationale: Mempertahankan unsur keharusan yang dapat menyiratkan keniscayaan ilahi tanpa menjelaskannya secara berlebihan.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: hari ini, besok, dan lusa
  rationale: Menjaga urutan waktu tiga tahap secara ringkas dan alami; catatan kaki mempertahankan kemungkinan fungsi idiomatisnya.
- source_word: πορεύεσθαι
  choice: meneruskan perjalanan-Ku
  rationale: Mengungkapkan gerak atau perjalanan yang berlanjut, bukan sekadar tindakan pergi sekali saja.
- source_word: ὅτι
  choice: karena
  rationale: Secara jelas memperkenalkan alasan bagi keharusan yang baru dinyatakan.
- source_word: οὐκ ἐνδέχεται
  choice: tidak mungkin
  rationale: Mempertahankan bahasa ketidakmungkinan atau ketidakpatutan retoris tanpa menentukan apakah perkataan itu harus dipahami secara mutlak atau ironis.
- source_word: προφήτην
  choice: seorang nabi
  rationale: Nomina tunggal tanpa artikel digunakan secara generik, sehingga 'seorang nabi' mempertahankan sifat peribahasa dari pernyataan ini.
- source_word: ἀπολέσθαι
  choice: binasa
  rationale: Mempertahankan keluasan makna yang mencakup mati atau dibinasakan serta nada khidmat teks Yunani.
- source_word: ἔξω Ἰερουσαλήμ
  choice: di luar Yerusalem
  rationale: Padanan ruang yang langsung, tepat, dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya pernyataan bahwa seorang nabi tidak mungkin binasa di luar Yerusalem
  choice: Diterjemahkan sebagai pernyataan ketidakmungkinan, sambil membiarkan kemungkinan ironi atau ketidakpatutan retoris tetap terbuka.
  alternative: Menerjemahkannya sebagai 'tidak patut' atau 'tidak terbayangkan' untuk menonjolkan ironi.
  rationale: οὐκ ἐνδέχεται dapat menunjuk pada sesuatu yang mustahil, tidak patut, atau tidak terpikirkan menurut kebiasaan. Teks utama menjaga bentuk ketidakmungkinan, sedangkan catatan kaki mengakui nuansa lain tanpa menyelesaikan ketegangan teologis dan retorisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina yang merujuk kepada Yesus memakai kapitalisasi sesuai konvensi penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan perkembangan argumentasi Yunani dan membiarkan ironi mengenai Yerusalem tetap tersirat.
