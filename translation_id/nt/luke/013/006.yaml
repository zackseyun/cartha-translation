  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: id
  text: 'Lalu Yesus menyampaikan perumpamaan ini: “Seseorang mempunyai sebatang pohon ara yang ditanam di kebun anggurnya. Ia datang mencari buah pada pohon itu, tetapi tidak menemukan buah.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: Lalu Yesus menyampaikan
  rationale: Imperfek ἔλεγεν memperkenalkan tindakan bertutur dalam alur narasi, sedangkan δέ merupakan penghubung ringan. Nama “Yesus” dipakai sebagai rujukan alami bagi subjek tersirat dari konteks, dan “menyampaikan” cocok dengan objek “perumpamaan” dalam bahasa Indonesia modern.
- source_word: ταύτην τὴν παραβολήν
  choice: perumpamaan ini
  rationale: “Perumpamaan” adalah padanan baku dan tepat untuk παραβολή; demonstrativa ταύτην diterjemahkan “ini”.
- source_word: Συκῆν
  choice: sebatang pohon ara
  rationale: συκῆ secara khusus berarti pohon ara. Kata penggolong “sebatang” menghasilkan ungkapan Indonesia yang alami.
- source_word: εἶχέν τις
  choice: Seseorang mempunyai
  rationale: τις adalah pronomina tak tentu dan tidak secara eksplisit menandai jenis kelamin. “Seseorang” mempertahankan ketidaktentuan itu tanpa menambahkan identitas tokoh.
- source_word: πεφυτευμένην
  choice: yang ditanam
  rationale: Partisip perfek pasif menggambarkan pohon dalam keadaan telah ditanam; konstruksi relatif ini alami dalam bahasa Indonesia dan mempertahankan nuansa pasif.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: di kebun anggurnya
  rationale: ἀμπελών berarti kebun anggur, dan αὐτοῦ diterjemahkan dengan akhiran posesif “-nya”.
- source_word: ἦλθεν ζητῶν
  choice: Ia datang mencari
  rationale: Verba aoris yang disertai partisip kini menyatakan tindakan yang menyertai atau maksud; “datang mencari” ringkas dan alami.
- source_word: καρπὸν ἐν αὐτῇ
  choice: buah pada pohon itu
  rationale: καρπός diterjemahkan langsung sebagai “buah”, sambil mempertahankan kemungkinan gema metaforis. Frasa “pada pohon itu” merupakan ungkapan Indonesia yang alami untuk buah yang dicari pada pohon.
- source_word: καὶ οὐχ εὗρεν
  choice: tetapi tidak menemukannya
  rationale: Dalam konteks ini καί menghubungkan hasil yang berlawanan dengan harapan, sehingga “tetapi” menyampaikan relasi wacananya secara alami. Akhiran “-nya” merujuk pada buah tanpa pengulangan yang kaku.
theological_decisions:
- issue: Subjek tak tentu τις dalam perumpamaan
  choice: Seseorang
  alternative: Seorang laki-laki
  rationale: Bahasa Yunani hanya memakai pronomina tak tentu τις dan tidak menentukan jenis kelamin tokoh secara leksikal. “Seseorang” menjaga ketidaktentuan asli dan tidak memberi bobot teologis tambahan.
- issue: Subjek tersirat pada Ἔλεγεν
  choice: Yesus
  alternative: Ia
  rationale: Subjek gramatikal tidak dinyatakan dalam ayat ini, tetapi jelas dari konteks wacana bahwa Yesuslah penutur perumpamaan. Penyebutan nama menghindari rujukan yang kabur dalam kutipan ayat tunggal tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat mempertahankan alur naratif Yunani, tetapi menghindari bentuk harfiah yang kaku seperti “sedang mengatakan”. Tidak diperlukan catatan kaki karena “seseorang” secara langsung mempertahankan ketidaktentuan τις.
