  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: id
  text: Ia sedang mengajar di salah satu sinagoge pada hari Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari-hari Sabat”; bahasa Yunani memakai bentuk jamak yang sering berfungsi secara idiomatis untuk bentuk tunggal “hari Sabat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Yesus sedang mengajar
  rationale: Konstruksi perifrastis imperfek menyatakan tindakan yang sedang berlangsung pada masa lampau. Subjek tersirat diungkapkan sebagai “Yesus” agar alami dan jelas dalam bahasa Indonesia; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: di salah satu sinagoge
  rationale: Ungkapan partitif ini secara langsung menunjuk pada satu dari sejumlah sinagoge. Istilah “sinagoge” dipertahankan karena menyebut lembaga dan tempat pertemuan Yahudi yang khusus.
- source_word: ἐν τοῖς σάββασιν
  choice: Pada suatu hari Sabat
  rationale: Walaupun bentuk Yunani σάββασιν bersifat jamak, dalam bahasa Yunani Koine bentuk ini lazim dipakai secara idiomatis untuk hari Sabat. “Suatu hari Sabat” juga mempertahankan ketakrifan yang tidak spesifik dalam konteks ini dan terdengar alami dalam narasi Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Penempatan keterangan waktu di awal kalimat memperjelas latar tanpa mengubah makna. Penambahan nama “Yesus” membuat subjek tersirat dari konteks menjadi jelas, sebagaimana lazim diperlukan dalam bahasa Indonesia.
