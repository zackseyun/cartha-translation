  terminology: “Sinagoge” merupakan istilah yang tepat untuk συναγωγή. “Hari Sabat” adalah padanan baku dan tepat untuk σάββατον dalam penggunaan idiomatis tunggal. Catatan kaki mempertahankan kemungkinan pembacaan bentuk jamak tanpa membebani teks utama.
