  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: id
  text: Lalu kamu akan mulai berkata, ‘Kami makan dan minum di hadapanmu, dan engkau mengajar di jalan-jalan kami[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lapangan-lapangan umum kami”; kata Yunani ini dapat menunjuk jalan yang lebar atau tempat terbuka untuk umum di dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan dalam wacana secara ringkas dan alami.
- source_word: ἄρξεσθε λέγειν
  choice: kamu akan mulai berkata
  rationale: Mempertahankan nuansa ingresif bentuk ἄρξεσθε dengan infinitif λέγειν, bukan mereduksinya menjadi sekadar ‘kamu akan berkata’.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Kami makan dan minum
  rationale: Kedua bentuk aoris menyatakan tindakan lampau dalam pengakuan langsung; bahasa Indonesia tidak wajib menandai kala secara morfologis, dan konteks membuat waktunya jelas.
- source_word: ἐνώπιόν σου
  choice: di hadapanmu
  rationale: Mengungkapkan kehadiran atau kedekatan lahiriah tanpa memperkuatnya menjadi persekutuan yang diakui, seperti yang dapat tersirat dalam ‘bersama denganmu’.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: di jalan-jalan kami
  rationale: πλατεῖαι dapat menunjuk jalan-jalan lebar atau ruang terbuka umum dalam kota; ‘jalan-jalan kami’ alami dan tidak mempersempit makna pada alun-alun saja.
- source_word: ἐδίδαξας
  choice: engkau mengajar
  rationale: Menyampaikan fakta tindakan mengajar pada masa lampau secara wajar dalam bahasa Indonesia; konteks ujaran sudah menunjukkan bahwa tindakan itu telah terjadi.
theological_decisions:
- issue: Sifat pembelaan para pembicara berdasarkan hubungan mereka dengan Yesus
  choice: 'Mempertahankan klaim mereka tentang kedekatan lahiriah: mereka makan dan minum di hadapannya serta mendengar pengajarannya di lingkungan mereka.'
  alternative: Menerjemahkan ‘di hadapanmu’ sebagai ‘bersama denganmu’, yang dapat menyiratkan persekutuan atau penerimaan yang lebih kuat.
  rationale: Teks menyatakan dasar pembelaan mereka tanpa mengatakan bahwa sang tuan mengakui adanya hubungan sejati dengan mereka; ketegangan ini tidak boleh diselesaikan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua tunggal dipertahankan sebagai ‘kamu/engkau’ sesuai peralihan dari narasi kepada kutipan langsung; huruf kecil digunakan karena teks Yunani tidak mengodekan kapitalisasi penghormatan.
