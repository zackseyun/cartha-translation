  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: id
  text: Hal itu seperti sebutir biji sesawi yang diambil oleh seorang laki-laki, lalu ia lemparkan ke kebunnya. Biji itu tumbuh dan menjadi pohon[b], lalu burung-burung di langit[a] bersarang di cabang-cabangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “burung-burung langit”; dapat juga diterjemahkan “burung-burung di udara.”
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani mengatakan bahwa biji itu “menjadi pohon”, sehingga mempertahankan gambaran pertumbuhan yang sangat besar dalam perumpamaan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Hal itu seperti
  rationale: Ungkapan ini mempertahankan rumus perbandingan dalam perumpamaan dan secara alami mengacu pada hal yang disebut dalam konteks sebelumnya.
- source_word: κόκκῳ σινάπεως
  choice: sebutir biji sesawi
  rationale: κόκκος berarti butir atau biji; 'sebutir biji sesawi' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: yang diambil seorang laki-laki
  rationale: Bentuk maskulin tunggal dipertahankan sebagai tokoh laki-laki tertentu dalam perumpamaan, bukan dinetralkan menjadi 'seseorang'.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: lalu dilemparkannya ke kebunnya
  rationale: βάλλω memiliki gambaran hidup 'melemparkan', sedangkan κῆπος secara khusus berarti kebun. Terjemahan ini tidak menambahkan gagasan 'menabur' yang tidak dinyatakan oleh verba Yunani.
- source_word: ηὔξησεν
  choice: Biji itu tumbuh
  rationale: Makna intransitif pertumbuhan disampaikan secara jelas; penyebutan ulang 'biji itu' menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: ἐγένετο εἰς δένδρον
  choice: menjadi pohon
  rationale: Menerjemahkan δένδρον secara langsung sebagai 'pohon' dan mempertahankan gambaran pertumbuhan yang mencolok dalam perumpamaan.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pengertian spasial οὐρανός tanpa memberi nuansa teologis yang tidak diperlukan.
- source_word: κατεσκήνωσεν
  choice: bersarang
  rationale: Dalam konteks burung dan cabang, 'bersarang' menyampaikan tindakan menetap dengan jelas dan idiomatis.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: pada cabang-cabangnya
  rationale: κλάδοις diterjemahkan langsung sebagai 'cabang-cabang'; akhiran '-nya' merujuk kepada pohon tersebut.
theological_decisions:
- issue: Rujukan maskulin ἄνθρωπος
  choice: seorang laki-laki
  alternative: seseorang; seorang
  rationale: Tokoh dalam teks Yunani berbentuk maskulin tunggal. Pilihan ini mempertahankan rincian tersebut tanpa mengubahnya menjadi rujukan netral.
- issue: Gambaran δένδρον dalam perumpamaan biji sesawi
  choice: pohon
  alternative: tanaman besar; semak
  rationale: Teks Yunani secara eksplisit memakai δένδρον, 'pohon'. Gambaran yang diperbesar atau mengejutkan itu dipertahankan dan tidak disesuaikan demi kehati-hatian botanis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur kalimat dibagi agar alur perumpamaan mudah dipahami, sementara pilihan 'dilemparkannya', 'pohon', dan 'burung-burung di langit' tetap dekat dengan citra teks Yunani.
