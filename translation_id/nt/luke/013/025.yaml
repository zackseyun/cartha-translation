revisions:
- from: Begitu tuan rumah berdiri dan menutup pintu, kalian akan mulai berdiri di luar dan mengetuk pintu sambil berkata, ‘Tuhan, bukakanlah pintu bagi kami!’ Namun, ia akan menjawab kalian, ‘Aku tidak mengenal kalian—dari mana asal kalian.’[a]
  to: Begitu tuan rumah bangun dan menutup pintu, kalian akan mulai berdiri di luar dan mengetuk pintu sambil berkata, ‘Tuhan, bukakanlah pintu bagi kami!’ Lalu ia akan menjawab kalian, ‘Aku tidak mengenal kalian dan tidak tahu dari mana kalian berasal.’[a]
  rationale: “Bangun” secara tepat membedakan ἐγερθῇ dari ἑστάναι (“berdiri di luar”). Jawaban akhir dibentuk ulang menjadi kalimat Indonesia yang wajar, dengan tetap menyatakan bahwa sang tuan tidak mengenal mereka dan tidak mengetahui asal mereka. “Lalu” mempertahankan urutan naratif tanpa menambahkan kontras.
