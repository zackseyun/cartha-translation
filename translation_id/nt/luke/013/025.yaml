  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: id
  text: Begitu tuan rumah bangun dan menutup pintu, kalian akan mulai berdiri di luar dan mengetuk pintu sambil berkata, ‘Tuhan, bukakanlah pintu bagi kami!’ Lalu ia akan menjawab kalian, ‘Aku tidak mengenal kalian dan tidak tahu dari mana kalian berasal.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “Aku tidak mengenal kalian, dari mana kalian berasal.” Sapaan “Tuhan” (Yunani: κύριε) dalam perumpamaan ini juga dapat dipahami sebagai “Tuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Begitu
  rationale: Konstruksi temporal tak tentu ini menyatakan saat yang segera diikuti akibatnya. “Begitu” alami dalam bahasa Indonesia dan mempertahankan daya “ketika/sekali setelah” tanpa menjadikannya penanda durasi.
- source_word: ἐγερθῇ
  choice: berdiri
  rationale: Dalam konteks ini kata tersebut menunjuk pada tindakan bangun dari posisi duduk atau berbaring, bukan kebangkitan dari kematian. “Berdiri” menyampaikan gerakan itu secara alami dan menghindari asosiasi kebangkitan yang tidak diperlukan.
- source_word: ὁ οἰκοδεσπότης
  choice: tuan rumah
  rationale: Istilah ini menunjuk kepada orang yang berwenang atas rumah. “Tuan rumah” merupakan ungkapan Indonesia yang ringkas dan wajar, serta mempertahankan unsur kewenangannya.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: menutup pintu
  rationale: Verba ini berarti menutup sehingga akses terhalang. Konteks orang-orang yang berada di luar mempertahankan daya eksklusinya tanpa perlu menambahkan “mengunci” yang tidak dinyatakan.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: kalian akan mulai berdiri di luar
  rationale: Bentuk ini menyatakan dimulainya keadaan berdiri di luar. “Akan mulai” sesuai dengan urutan peristiwa yang berorientasi ke depan.
- source_word: κρούειν τὴν θύραν
  choice: mengetuk pintu
  rationale: Ini padanan idiomatis langsung yang tidak melebihkan kekuatan tindakan menjadi menggedor.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan padanan utama κύριος dan kemungkinan gema teologis dalam Injil Lukas, sementara konteks perumpamaan tetap memungkinkan sapaan biasa kepada orang yang berwenang.
- source_word: ἄνοιξον ἡμῖν
  choice: bukakanlah pintu bagi kami
  rationale: Objek “pintu” disediakan secara eksplisit dari konteks agar permintaan terdengar alami dalam bahasa Indonesia; datif ἡμῖν disampaikan dengan “bagi kami”.
- source_word: ἀποκριθεὶς ἐρεῖ ὑμῖν
  choice: ia akan menjawab kalian
  rationale: Gabungan partisip dan verba ujaran diringkas secara alami tanpa kehilangan tindakan menjawab atau penerima jawaban.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Aku tidak mengenal kalian—dari mana asal kalian
  rationale: Terjemahan ini mempertahankan objek eksplisit ὑμᾶς serta frasa asal-usul πόθεν ἐστέ. Tanda pisah menjaga ketegangan dan susunan yang tidak sepenuhnya biasa dalam bahasa Yunani tanpa memaksakan frasa kedua menjadi pertanyaan.
theological_decisions:
- issue: Makna sapaan κύριε dalam perumpamaan
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan padanan leksikal-teologis yang lazim dan membuka kemungkinan gema kristologis dalam konteks Lukas. Catatan kaki mengakui bahwa dalam latar perumpamaan sapaan ini juga dapat berarti “Tuan” tanpa memutuskan ambiguitas secara sepihak.
- issue: Daya ungkapan οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Aku tidak mengenal kalian—dari mana asal kalian
  alternative: Aku tidak tahu dari mana kalian berasal
  rationale: Pilihan utama mempertahankan baik objek langsung “kalian” maupun klausa asal-usul. Alternatif yang lebih lancar dapat melemahkan atau menghilangkan pernyataan relasional “tidak mengenal kalian” yang eksplisit dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat tetapi mudah dipahami. Pronomina “kalian” dipakai karena bentuk Yunani semuanya jamak. “Bukakanlah” menjaga nada permohonan, sedangkan tanda pisah pada jawaban terakhir mempertahankan susunan dan ketegangan teks sumber.
