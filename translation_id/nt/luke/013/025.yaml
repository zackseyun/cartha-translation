    rationale: Dalam konteks rumah tangga, ἐγείρω berarti bangun atau beranjak dari posisi duduk/berbaring. “Berdiri” lebih sempit dan menimbulkan pengulangan yang kurang tepat dengan ἑστάναι, yang memang berarti berada/berdiri di luar.
  - severity: medium
    issue: Jawaban penutup tidak lengkap secara sintaksis dalam bahasa Indonesia.
    rationale: Frasa “Aku tidak mengenal kalian—dari mana asal kalian” membuat klausa kedua tampak seperti pertanyaan atau fragmen. Bahasa Indonesia memerlukan verba yang dinyatakan atau penghubung yang jelas, tanpa menghapus objek ὑμᾶς.
  - severity: low
    issue: “Namun” memberi nuansa pertentangan tambahan.
    rationale: Teks Yunani hanya melanjutkan urutan peristiwa dengan καί. “Lalu” lebih netral dan lebih dekat dengan alur sumber.
