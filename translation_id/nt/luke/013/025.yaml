  naturalness: Teks umumnya jelas dan memakai ragam baku modern. “Tuan rumah,” “kalian,” dan “bukakanlah pintu bagi kami” alami. Namun, “Aku tidak mengenal kalian—dari mana asal kalian” bukan konstruksi pernyataan yang lengkap dalam bahasa Indonesia; “Namun” juga menambahkan kontras yang tidak dinyatakan secara khusus oleh καί.
  terminology: “Tuan rumah” dapat dipertahankan sebagai padanan idiomatis bagi οἰκοδεσπότης dalam perumpamaan ini. “Tuhan” mempertahankan padanan proyek bagi κύριε, dan catatan kaki dengan tepat menjaga kemungkinan arti “Tuan” dalam latar perumpamaan.
