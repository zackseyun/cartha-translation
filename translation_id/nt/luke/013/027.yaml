  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: id
  text: Lalu ia akan berkata kepada kalian, “Aku tidak tahu dari mana kalian berasal. Menjauhlah dari-Ku, kalian semua pelaku kejahatan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: ia akan berkata kepada kalian
  rationale: Gabungan verba utama dan partisip ini bersifat pleonastis sebagai pengantar ujaran langsung. Bahasa Indonesia alami cukup memakai “akan berkata kepada kalian” tanpa menghilangkan makna yang dapat dibedakan.
- source_word: οἶδα
  choice: Aku tidak tahu
  rationale: “Tahu” mempertahankan arti langsung οἶδα; nuansa penolakan untuk mengakui hubungan dibiarkan muncul dari konteks dan tidak dimasukkan secara interpretatif.
- source_word: πόθεν ἐστέ
  choice: dari mana kalian berasal
  rationale: Ungkapan ini menyatakan asal-usul; pilihan tersebut jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Menjauhlah dari-Ku
  rationale: Imperatif aoris menuntut pemisahan yang tegas. “Menjauhlah” menyampaikan gerak menjauh dengan nada perintah yang kuat dan alami.
- source_word: πάντες ἐργάται
  choice: kalian semua yang melakukan
  rationale: Secara harfiah berarti “semua pekerja”, tetapi dalam kolokasi moral ini yang dimaksud ialah orang-orang yang mengerjakan atau mempraktikkan sesuatu. Bentuk verbal lebih alami dalam bahasa Indonesia.
- source_word: ἀδικίας
  choice: ketidakbenaran
  rationale: Pilihan ini mempertahankan cakupan moral luas ἀδικία serta kaitannya dengan gagasan kebenaran, tanpa mempersempitnya menjadi pelanggaran hukum.
theological_decisions:
- issue: Makna ἀδικίας dalam ucapan penghakiman
  choice: ketidakbenaran
  alternative: kejahatan; perbuatan salah; pelanggaran hukum
  rationale: “Ketidakbenaran” mempertahankan daya moral-teologis ἀδικία dan tidak mengimpor gagasan νόμος yang lebih khusus. Ungkapan ini tetap mencakup tindakan salah dan tidak adil.
- issue: Nuansa relasional οἶδα
  choice: Aku tidak tahu
  alternative: Aku tidak mengenal
  rationale: “Tidak mengenal” dapat menonjolkan penolakan relasional, tetapi “tidak tahu” lebih transparan terhadap verba sumber dan membiarkan ketegangan antara pengetahuan dan penolakan ditentukan oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina jamak “kalian” memperjelas bahwa ὑμῖν dan ἐστέ berbentuk jamak. Huruf kapital pada “-Ku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi tanpa menambah gelar ke dalam teks.
