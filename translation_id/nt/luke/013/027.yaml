review_pass:
  verdict: revise
  source_fidelity: Draft ini pada umumnya setia pada teks Yunani. "Ia akan berkata kepada kalian," "Aku tidak tahu dari mana kalian berasal," dan "Menjauhlah dari-Ku" menyampaikan ἐρεῖ λέγων ὑμῖν, οὐκ οἶδα πόθεν ἐστέ, dan ἀπόστητε ἀπ’ ἐμοῦ secara memadai. Bentuk jamak pada ὑμῖν/ἐστέ dan daya panggilan πάντες terpelihara. Namun, "ketidakbenaran" terutama berarti ketidakbenaran sebagai lawan dari kebenaran/falsitas dalam pemakaian Indonesia modern dan kurang tepat/natural untuk ἀδικία dalam kolokasi "para pelaku ...".
  naturalness: Kalimatnya lugas dan registernya sesuai. Akan tetapi, "kalian semua yang melakukan ketidakbenaran" terdengar tidak lazim dalam bahasa Indonesia modern. "Kalian semua pelaku kejahatan" adalah ungkapan yang alami untuk ἐργάται ἀδικίας dan tetap menyatakan praktik yang menjadi ciri mereka.
  terminology: Tidak perlu catatan kaki. "Kejahatan" di sini merupakan padanan Indonesia yang wajar dan cukup luas bagi ἀδικία; kata ini tidak menyempitkan istilah tersebut menjadi "pelanggaran hukum." Pronomina ilahi dengan kapital pada "-Ku" dipertahankan sesuai konvensi yang dinyatakan dalam draf.
  issues:
  - severity: medium
    issue: Padanan "ketidakbenaran" untuk ἀδικίας
    rationale: Dalam bahasa Indonesia modern, "ketidakbenaran" lazimnya mengacu pada sesuatu yang tidak benar atau tidak faktual, bukan terutama pada ketidakadilan, kesalahan moral, atau kejahatan. Dalam frasa "pelaku/pekerja ἀδικίας," padanan ini menghasilkan kolokasi yang janggal dan mengaburkan kecaman moral dalam sumber.
  revised_text: Lalu ia akan berkata kepada kalian, “Aku tidak tahu dari mana kalian berasal. Menjauhlah dari-Ku, kalian semua pelaku kejahatan.”
