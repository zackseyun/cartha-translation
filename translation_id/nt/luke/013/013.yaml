    issue: Penambahan «kembali» pada hasil penyembuhan
    rationale: ἀνωρθώθη tidak memuat unsur leksikal «lagi/kembali». Walaupun konteksnya adalah pemulihan dari keadaan bungkuk, terjemahan utama sebaiknya tidak menambahkan unsur tersebut.
  - severity: low
    issue: Kolokasi «menumpangkan tangan-Nya atas perempuan itu»
    rationale: Dapat dipahami, tetapi «meletakkan tangan-Nya pada perempuan itu» lebih idiomatis dalam bahasa Indonesia modern dan tetap menerjemahkan idiom ἐπιτίθημι τὰς χεῖρας secara konkret.
  revised_text: Lalu Ia meletakkan tangan-Nya pada perempuan itu, dan seketika itu juga perempuan itu menjadi tegak,[a] lalu ia memuliakan Allah.
