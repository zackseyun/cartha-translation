  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: id
  text: Lalu Ia meletakkan tangan-Nya pada perempuan itu, dan seketika itu juga perempuan itu menjadi tegak,[a] lalu ia memuliakan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditegakkan” atau “berdiri tegak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: menumpangkan tangan-Nya atas perempuan itu
  rationale: Ungkapan Yunani untuk tindakan meletakkan tangan diterjemahkan dengan idiom Indonesia yang alami, konkret, dan lazim; bentuk posesif memperjelas bahwa tangan itu milik Yesus.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Menyampaikan bahwa pemulihan terjadi langsung tanpa jeda, dengan ungkapan Indonesia yang alami.
- source_word: ἀνωρθώθη
  choice: menjadi tegak kembali
  rationale: Bentuk pasif ini menggambarkan pemulihan perempuan yang sebelumnya bungkuk kepada keadaan tegak. Kata 'kembali' tersirat dari konteks pemulihan, bukan dinyatakan secara leksikal oleh verba itu sendiri; catatan kaki mempertahankan alternatif yang lebih formal.
- source_word: ἐδόξαζεν
  choice: memuliakan
  rationale: Mempertahankan bobot teologis δοξάζω. Bentuk imperfek dapat menyiratkan tindakan yang berlangsung, tetapi dalam narasi Indonesia bentuk sederhana lebih alami.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk θεός dalam konteks ini.
theological_decisions:
- issue: Hasil penyembuhan yang dinyatakan oleh ἀνωρθώθη
  choice: menjadi tegak kembali
  alternative: ditegakkan; berdiri tegak
  rationale: Konteks menunjukkan pemulihan jasmani perempuan yang bungkuk. Terjemahan ini tidak menambahkan penjelasan mengenai mekanisme penyembuhan, sementara catatan kaki menjaga kemungkinan nuansa pasif dan hasil dari verba Yunani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan 'perempuan itu' menghindari ambiguitas rujukan pronomina, sedangkan 'lalu' pada klausa terakhir mengalir lebih alami daripada pengulangan 'dan' tanpa mengubah urutan peristiwa.
