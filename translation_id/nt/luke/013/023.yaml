  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: id
  text: Lalu seseorang berkata kepada-Nya, “Tuhan,[a] apakah hanya sedikit orang yang sedang diselamatkan?” Dia berkata kepada mereka,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani yang diterjemahkan “Tuhan” juga dapat dipahami sebagai “Tuan,” yakni sapaan hormat; makna penuh gelar itu dibiarkan terbuka oleh bahasa Yunani di sini.
    reason: alternative_reading
  - marker: b
