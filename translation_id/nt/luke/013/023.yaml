    reason: discourse_clarification
lexical_decisions:
- source_word: δέ
  choice: Lalu
  rationale: Penghubung ringan yang melanjutkan alur narasi; “Lalu” alami dalam bahasa Indonesia dan tidak memberi kesan pertentangan yang berlebihan.
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu yang menunjuk kepada orang yang tidak disebutkan identitasnya.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Mempertahankan kata ganti dalam teks Yunani tanpa menambahkan nama Yesus ke dalam ayat ini.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini dapat bermakna hormat atau mengandung bobot kristologis; “Tuhan” mempertahankan keterbukaan tersebut.
- source_word: εἰ ὀλίγοι
  choice: apakah hanya sedikit orang
  rationale: Menghasilkan pertanyaan langsung yang wajar dalam bahasa Indonesia sekaligus menyampaikan jumlah yang kecil dan nuansa pembatas.
- source_word: οἱ σῳζόμενοι
  choice: orang yang sedang diselamatkan
  rationale: Mempertahankan bentuk pasif dan aspek kini dari partisipel Yunani tanpa menetapkan sistem soteriologis tertentu.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Mencerminkan kata ganti jamak dalam bahasa Yunani dan tidak menentukan lebih jauh siapa kelompok yang dimaksud.
theological_decisions:
- issue: Daya makna Κύριε sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Bahasa Yunani memungkinkan sapaan sopan maupun pengakuan yang lebih berbobot. Teks utama memakai “Tuhan,” sedangkan catatan kaki menjaga kemungkinan “Tuan” tanpa menutup ketegangan teologisnya.
- issue: Aspek σῳζόμενοι
  choice: sedang diselamatkan
  alternative: diselamatkan
  rationale: Partisipel kini pasif dapat menggambarkan mereka yang berada dalam proses atau keadaan menerima keselamatan. Pilihan ini mempertahankan aspek dan bentuk pasifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia, sementara identitas-Nya tidak ditambahkan secara eksplisit ke dalam ayat.
