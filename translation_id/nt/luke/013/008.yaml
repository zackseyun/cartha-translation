  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: id
  text: Namun, penggarap kebun itu menjawab, “Tuan, biarkanlah pohon itu tahun ini juga, sampai aku menggali tanah di sekelilingnya dan memberinya pupuk kandang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ
  choice: Namun, penggarap kebun itu menjawab
  rationale: Ungkapan partisip + verba kini merupakan bentuk naratif yang secara alami cukup diterjemahkan dengan 'menjawab' dalam bahasa Indonesia. Subjek tersirat diperjelas dari konteks perumpamaan tanpa mengubah referennya; pronomina objek tidak perlu dinyatakan karena lawan bicara tampak dalam sapaan berikutnya.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam perumpamaan ini κύριε adalah sapaan hormat seorang penggarap kepada pemilik kebun. 'Tuan' mempertahankan fungsi sapaan tersebut tanpa memastikan bahwa gelar ilahi sedang dimaksudkan.
- source_word: ἄφες αὐτὴν
  choice: biarkanlah pohon itu
  rationale: ἀφίημι di sini berarti membiarkannya tetap ada dan tidak ditebang. 'Biarkanlah' mempertahankan arti eksplisit verba tanpa menambahkan gagasan 'ampunilah'; 'pohon itu' lebih alami daripada pronomina benda dalam bahasa Indonesia dan referennya jelas dari konteks.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: tahun ini juga
  rationale: Terjemahan ini mengikuti arti harfiah frasa Yunani dan menyampaikan bahwa pohon itu diberi tambahan waktu, tanpa menggantinya dengan parafrasa 'satu tahun lagi'.
- source_word: ἕως ὅτου
  choice: sampai
  rationale: Kata 'sampai' secara ringkas dan alami memperkenalkan tindakan yang akan dilakukan selama masa penangguhan itu.
- source_word: σκάψω περὶ αὐτὴν
  choice: aku menggali tanah di sekelilingnya
  rationale: σκάπτω berarti 'menggali'. Penambahan objek alami 'tanah' menjelaskan tindakan pertanian yang sudah tersirat, sedangkan 'di sekelilingnya' mempertahankan περὶ αὐτήν.
- source_word: βάλω κόπρια
  choice: memberinya pupuk kandang
  rationale: κόπρια menunjuk pada kotoran hewan yang digunakan sebagai pupuk. 'Pupuk kandang' merupakan istilah Indonesia yang alami dan tetap mempertahankan gambaran pertanian yang konkret, berbeda dari istilah umum 'memupuk'.
theological_decisions:
- issue: Makna κύριε sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks langsung menggambarkan penggarap yang menyapa pemilik kebun, sehingga 'Tuan' menyatakan hubungan sosial dalam cerita tanpa menutup kemungkinan makna simbolis perumpamaan. 'Tuhan' dapat membuat identifikasi teologis eksplisit padahal bentuk sapaan Yunani sendiri tidak menentukannya di sini.
- issue: Daya makna ἄφες dalam permohonan penangguhan
  choice: biarkanlah
  alternative: jangan tebang dahulu / berilah kesempatan
  rationale: Konteks menyiratkan penangguhan penebangan, tetapi verba itu sendiri secara langsung berarti membiarkan. Terjemahan terpilih menjaga implikasi perumpamaan tanpa memasukkannya secara eksplisit ke dalam ucapan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'aku' sesuai dengan percakapan dalam perumpamaan, sedangkan partikel '-lah' memberi nuansa permohonan yang santun. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat dijelaskan dalam dokumentasi tanpa membebani ayat.
