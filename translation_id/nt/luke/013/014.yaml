id: LUK.13.14
reference: Luke 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: id
  text: Namun, pemimpin rumah ibadat itu menanggapi dengan geram karena Yesus menyembuhkan pada hari Sabat. Ia berkata kepada orang banyak, “Ada enam hari ketika orang harus bekerja. Karena itu, datanglah pada hari-hari itu untuk disembuhkan, bukan pada hari Sabat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Namun ... menanggapi
  rationale: δέ menandai pertentangan dengan tindakan penyembuhan sebelumnya, sedangkan ἀποκριθείς memperkenalkan tanggapan sang pemimpin meskipun tidak berupa jawaban atas pertanyaan langsung.
- source_word: ἀρχισυνάγωγος
  choice: pemimpin rumah ibadat
  rationale: Istilah ini menunjuk kepada orang yang mengawasi urusan rumah ibadat; pilihan ini jelas dalam bahasa Indonesia modern dan tidak menyiratkan kekuasaan sipil.
- source_word: ἀγανακτῶν
  choice: dengan geram
  rationale: Partisip ini menyatakan kemarahan atau kejengkelan kuat yang bernuansa keberatan moral; 'dengan geram' mempertahankan intensitasnya secara alami.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: karena Yesus menyembuhkan pada hari Sabat
  rationale: ὅτι bersifat kausal, dan aoristus ἐθεράπευσεν menunjuk kepada penyembuhan yang baru saja terjadi. Bahasa Indonesia tidak memerlukan bentuk lampau sempurna untuk menunjukkan urutan tersebut.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: Ia berkata kepada orang banyak
  rationale: Imperfek ἔλεγεν menyajikan tuturan secara tidak sempurna, tetapi dalam konteks ini bentuk alami bahasa Indonesia 'berkata' cukup tanpa menambahkan gagasan pengulangan yang tidak pasti.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Ada enam hari untuk bekerja
  rationale: Ungkapan ringkas ini menyampaikan adanya enam hari yang ditetapkan atau semestinya digunakan untuk bekerja. Kekuatan normatif δεῖ tetap tampak dalam konteks teguran, tanpa susunan Indonesia yang kaku.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Karena itu, datanglah pada hari-hari itu untuk disembuhkan
  rationale: οὖν menyatakan kesimpulan, ἐρχόμενοι menyuruh mereka datang, dan θεραπεύεσθε di sini paling wajar dipahami sebagai imperatif pasif, 'disembuhkanlah' atau secara idiomatis 'untuk disembuhkan'.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: jangan pada hari Sabat
  rationale: Larangan eliptis ini secara alami melanjutkan perintah sebelumnya. Bentuk singkat mempertahankan daya teguran tanpa mengulang kata kerja secara tidak perlu.
theological_decisions:
- issue: Status pernyataan pemimpin tentang hari bekerja dan penyembuhan
  choice: Disajikan sebagai keberatan normatif sang pemimpin tanpa tanda persetujuan narator
  alternative: Memparafrasakannya sebagai kemunafikan atau sebagai ketetapan ilahi
  rationale: Ayat ini melaporkan sudut pandang pemimpin rumah ibadat. Terjemahan mempertahankan ketegangan naratif dan tidak mendahului penilaian Yesus dalam ayat berikutnya.
- issue: Hubungan penyembuhan dengan pekerjaan pada hari Sabat
  choice: Mempertahankan penyandingan sang pemimpin antara 'bekerja' dan 'disembuhkan'
  alternative: Menjelaskan bahwa penyembuhan dianggap pekerjaan terlarang
  rationale: Teks membiarkan penalaran itu tersirat dalam perkataan sang pemimpin; penjelasan tambahan akan menjadi tafsiran yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk συναγωγή dalam konteks Yahudi. Kalimat langsung dibuat tegas untuk mencerminkan teguran kepada orang banyak. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang perlu ditampilkan kepada pembaca pada ayat ini.
