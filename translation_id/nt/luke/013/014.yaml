  naturalness: Teks pada umumnya alami dalam bahasa Indonesia baku. “Ada enam hari ketika orang harus bekerja” lebih jelas dan tetap wajar. “Bukan pada hari Sabat” menuntaskan kontras eliptis dengan lancar.
  terminology: “Pemimpin rumah ibadat,” “orang banyak,” dan “hari Sabat” tepat, lazim, dan sesuai register. “Dengan geram” cukup kuat untuk ἀγανακτῶν tanpa menambahkan penilaian narator.
