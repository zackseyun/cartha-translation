  to: Namun, pemimpin rumah ibadat itu menanggapi dengan geram karena Yesus menyembuhkan pada hari Sabat. Ia berkata kepada orang banyak, “Ada enam hari ketika orang harus bekerja. Karena itu, datanglah pada hari-hari itu untuk disembuhkan, bukan pada hari Sabat.”
