base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: id
  text: Karena itu, Yesus berkata, “Seperti apakah Kerajaan Allah[a], dan dengan apakah Aku akan membandingkannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemerintahan Allah,” yang menekankan Allah sebagai Pemerintah, bukan suatu wilayah kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Yesus berkata
  rationale: Imperfek Yunani dapat menggambarkan ujaran yang sedang berlangsung, berulang, atau menjadi latar naratif. Dalam bahasa Indonesia, bentuk alami “berkata” cukup menyampaikan tindakan ujaran dalam konteks ini; subjek “Yesus” diperjelas dari konteks agar tidak ambigu.
- source_word: οὖν
  choice: Karena itu
  rationale: Menjaga fungsi penghubung yang menarik kelanjutan atau kesimpulan dari konteks sebelumnya. “Karena itu” lebih jelas mempertahankan daya inferensial daripada sekadar “lalu”.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: Seperti apakah
  rationale: Ungkapan ini secara idiomatis meminta suatu perbandingan. “Seperti apakah” alami, ringkas, dan tetap mempertahankan bentuk pertanyaan.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Istilah baku Alkitab bahasa Indonesia yang mempertahankan medan makna βασιλεία, yang dapat menunjuk baik pemerintahan/kekuasaan Allah maupun ranah kerajaan-Nya.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan dua pertanyaan paralel.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: dengan apakah Aku akan membandingkannya
  rationale: Mempertahankan bentuk deliberatif dari futurum ὁμοιώσω dan hubungan perbandingan, dengan susunan yang wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: “Kerajaan Allah” mempertahankan ungkapan alkitabiah yang mapan dan keluasan metaforanya, sedangkan catatan kaki menyatakan kemungkinan penekanan dinamis pada tindakan Allah memerintah tanpa membatasi makna teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan struktur pertanyaan dipertahankan untuk mencerminkan paralelisme Yunani. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
