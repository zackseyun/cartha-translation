id: LUK.13.31
reference: Luke 13:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: id
  text: Pada saat itu juga, beberapa orang Farisi datang kepada dia dan berkata kepadanya, “Keluarlah dan pergilah dari sini, karena Herodes ingin membunuhmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Pada saat itu juga
  rationale: Ungkapan ini menunjukkan waktu yang spesifik dan langsung; “itu juga” mempertahankan penekanan αὐτῇ secara alami dalam bahasa Indonesia.
- source_word: προσῆλθάν
  choice: datang mendekati
  rationale: Mempertahankan gagasan bergerak mendekat kepada seseorang, bukan sekadar datang.
- source_word: τινες Φαρισαῖοι
  choice: beberapa orang Farisi
  rationale: τινες bersifat tak tentu; pilihan ini alami dalam bahasa Indonesia modern dan tidak menentukan siapa saja mereka.
- source_word: λέγοντες αὐτῷ
  choice: dan berkata kepadanya
  rationale: Partisipel yang menyertai tindakan utama dialihkan menjadi verba finit agar kalimat Indonesia mengalir alami.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Pergilah dan tinggalkan tempat ini
  rationale: Dua perintah dalam bahasa Yunani tetap dinyatakan, tetapi susunannya dibuat idiomatis dalam bahasa Indonesia; ungkapan ini menyampaikan desakan untuk berangkat dari lokasi tersebut.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan bagi peringatan tersebut secara jelas.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: θέλει
  choice: ingin
  rationale: Menyatakan kehendak atau keinginan tanpa memperkuatnya menjadi rencana yang sudah pasti.
- source_word: ἀποκτεῖναι
  choice: membunuh
  rationale: Padanan langsung yang tidak membatasi tindakan itu pada penghukuman atau eksekusi resmi.
theological_decisions:
- issue: Maksud orang-orang Farisi ketika memperingatkan Yesus
  choice: Ucapan mereka diterjemahkan sebagai peringatan langsung tanpa menjelaskan motif mereka.
  alternative: Menampilkan mereka sebagai penolong yang tulus atau sebagai pihak yang hendak menakut-nakuti Yesus agar pergi.
  rationale: Teks Yunani hanya melaporkan tindakan dan perkataan mereka, tanpa menyatakan apakah motif mereka tulus, menipu, atau berkaitan dengan Herodes.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti bagi Yesus ditulis dengan huruf kecil sesuai ejaan umum dan tanpa menambahkan penafsiran teologis yang tidak dinyatakan oleh teks.
