id: LUK.13.24
reference: Luke 13:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: id
  text: Berjuanglah untuk masuk melalui pintu yang sempit[a], sebab banyak orang, Aku berkata kepadamu, akan berusaha masuk, tetapi tidak akan mampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui gerbang yang sempit.” Kata Yunani yang dipakai Lukas berarti “pintu” (θύρα), sedangkan bagian paralel dalam Matius memakai kata “gerbang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Berjuanglah
  rationale: Bentuk imperatif ini menyatakan pengerahan daya yang sungguh-sungguh. “Berjuanglah” mempertahankan kekuatan perintah dan membedakannya dari ζητήσουσιν tanpa menjelaskan lebih jauh bagaimana usaha itu berkaitan dengan keselamatan.
- source_word: εἰσελθεῖν
  choice: untuk masuk / masuk
  rationale: Infinitif dari εἰσέρχομαι secara alami diterjemahkan “masuk”; kedua kemunculannya diterjemahkan secara konsisten.
- source_word: διὰ τῆς στενῆς θύρας
  choice: melalui pintu yang sempit
  rationale: θύρα pada umumnya berarti “pintu”, sedangkan στενῆς menyatakan keadaan sempit. Pilihan ini mengikuti kata yang dipakai Lukas dan tidak menggantinya dengan istilah dari bagian paralel dalam Matius.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan bagi perintah sebelumnya. “Sebab” mempertahankan hubungan kausal dalam ragam bahasa yang wajar dan bermartabat.
- source_word: πολλοί
  choice: banyak orang
  rationale: Kata sifat ini dipakai secara substantival; “banyak orang” jelas dan alami dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Ungkapan ini diterjemahkan secara langsung dan tetap alami sebagai sisipan penegasan dalam perkataan Yesus.
- source_word: ζητήσουσιν
  choice: akan berusaha
  rationale: Dalam konteks ini ζητέω menyatakan upaya untuk masuk. “Berusaha” alami dalam bahasa Indonesia dan tetap dibedakan dari perintah yang lebih kuat, “Berjuanglah”.
- source_word: οὐκ ἰσχύσουσιν
  choice: tidak akan mampu
  rationale: ἰσχύω di sini menunjuk pada kemampuan atau kuasa untuk melakukan sesuatu. “Tidak akan mampu” menyampaikan artinya secara langsung tanpa mengubahnya menjadi sekadar hasil atau keberhasilan.
theological_decisions:
- issue: Usaha manusia dalam bahasa keselamatan
  choice: Mempertahankan perintah kuat “Berjuanglah” dan peringatan bahwa banyak orang tidak akan mampu masuk.
  alternative: Melunakkan perintah menjadi “Berusahalah” atau menambahkan penjelasan mengenai jasa, perbuatan, anugerah, atau kedaulatan ilahi.
  rationale: Ayat ini sendiri menempatkan perintah untuk berjuang berdampingan dengan peringatan tentang upaya yang gagal. Terjemahan mempertahankan ketegangan tersebut tanpa menyelesaikannya menurut suatu sistem doktrin tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. “Berjuanglah” mempertahankan daya retoris perintah Yunani; “pintu” dipilih berdasarkan kosakata Lukas. Kata ganti ilahi “Aku” ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
