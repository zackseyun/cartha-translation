  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: id
  text: Mereka akan datang dari timur dan barat, dari utara dan selatan, dan akan duduk makan[a] dalam Kerajaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan duduk.” Kata Yunani lebih khusus menunjuk pada berbaring di meja dalam suatu perjamuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: akan datang
  rationale: Bentuk mendatang dari ἥκω berarti datang atau tiba. “Akan datang” paling alami dan selaras dengan rangkaian keterangan arah.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: dari timur dan barat
  rationale: Kata-kata jamak yang secara harfiah menunjuk pada tempat matahari terbit dan terbenam merupakan ungkapan bagi arah timur dan barat.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: dari utara dan selatan
  rationale: Terjemahan langsung dan alami ini melengkapi cakupan keempat arah mata angin tanpa menambahkan identitas etnis yang tidak disebutkan dalam ayat.
- source_word: ἀνακλιθήσονται
  choice: lalu duduk makan
  rationale: Dalam konteks perjamuan, ἀνακλίνω berarti mengambil posisi berbaring untuk makan. “Duduk makan” menyampaikan maksud perjamuan secara alami dalam bahasa Indonesia modern, sedangkan gambaran budaya aslinya dijelaskan dalam catatan kaki.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dalam Kerajaan Allah
  rationale: Ungkapan baku dan transparan yang mempertahankan bobot teologis βασιλεία τοῦ θεοῦ tanpa parafrasa.
theological_decisions:
- issue: Gambaran perjamuan dalam Kerajaan Allah
  choice: Mempertahankan tindakan makan melalui ungkapan “duduk makan,” dengan posisi berbaring dalam budaya kuno dijelaskan di catatan kaki.
  alternative: duduk saja dalam Kerajaan Allah; mengambil tempat dalam Kerajaan Allah
  rationale: Kata kerjanya membangkitkan gambaran perjamuan dan bukan sekadar tindakan masuk atau duduk. Terjemahan ini mempertahankan gambaran konkret itu tanpa menambahkan rincian doktrinal.
- issue: Cakupan geografis universal
  choice: Menerjemahkan keempat arah secara langsung tanpa menyebut kelompok etnis tertentu.
  alternative: Menafsirkan secara eksplisit sebagai bangsa-bangsa bukan Yahudi dari seluruh dunia.
  rationale: Ayat ini menggambarkan orang-orang yang datang dari segala arah, tetapi tidak secara eksplisit menyebut identitas etnis mereka. Ambiguitas tersebut perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Duduk makan” dipilih sebagai ungkapan yang mudah dipahami pembaca umum, sementara catatan kaki mempertahankan citra budaya yang lebih khusus dalam bahasa Yunani.
