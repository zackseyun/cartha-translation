  naturalness: Teks revisi tetap baku dan wajar dalam bahasa Indonesia modern. “Sementara” mengalir baik untuk tindakan yang berlangsung bersamaan, dan “segala hal mulia yang sedang dilakukan-Nya” mempertahankan cakupan ungkapan Yunani secara alami.
  terminology: “Menentang-Nya,” “dipermalukan,” “orang banyak,” “bersukacita,” dan “mulia” sesuai register Alkitab Indonesia modern dan tidak menambahkan penafsiran doktrinal. Kapitalisasi pronomina ilahi dipertahankan.
