    rationale: “Mendapat malu” dapat dipahami terutama sebagai rasa malu internal. “Dipermalukan” lebih langsung menyampaikan bentuk pasif dan aib publik yang tersirat, tanpa menentukan siapa yang sengaja mempermalukan mereka.
