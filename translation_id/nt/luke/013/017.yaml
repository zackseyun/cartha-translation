id: LUK.13.17
reference: Luke 13:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: id
  text: Sementara Ia mengatakan hal-hal itu, semua yang menentang-Nya[a] dipermalukan, sedangkan seluruh orang banyak bersukacita atas segala hal mulia[b] yang sedang dilakukan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua lawan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “segala hal yang mengagumkan” atau “segala hal yang gemilang.” Secara harfiah, bahasa Yunani menyebut “hal-hal mulia,” ungkapan luas yang dapat mencakup perbuatan-perbuatan-Nya yang penuh kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Ketika Ia mengatakan hal-hal itu
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan bahwa tindakan berbicara berlangsung bersamaan dengan tanggapan para pendengar. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan waktunya.
- source_word: κατῃσχύνοντο
  choice: mendapat malu
  rationale: Ungkapan ini menyampaikan keadaan dipermalukan atau kehilangan muka di hadapan umum tanpa menyiratkan bahwa Yesus sengaja mempermalukan mereka. Bentuk imperfek menunjukkan keadaan yang timbul ketika Ia berbicara.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: orang yang menentang-Nya
  rationale: Mempertahankan daya verbal partisipel ἀντικείμενοι, yaitu orang-orang yang secara aktif menentang Dia, bukan sekadar kelompok yang diberi label sebagai lawan.
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak
  rationale: Mewakili ungkapan kolektif tunggal dan menandakan bahwa orang banyak itu secara keseluruhan memberi tanggapan positif.
- source_word: ἔχαιρεν
  choice: bersukacita
  rationale: Kata ini lebih kuat daripada sekadar 'senang' dan cocok dengan imperfek yang menggambarkan sukacita yang berlangsung.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: atas segala perbuatan mulia
  rationale: Kata 'mulia' mempertahankan keluasan ἔνδοξος dan tidak membatasinya hanya pada mukjizat; 'atas' menyatakan dasar atau objek sukacita.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: yang dilakukan-Nya
  rationale: Mengungkapkan tindakan yang terjadi dengan Yesus sebagai pelakunya, sesuai dengan ὑπό yang diikuti genitif.
theological_decisions:
- issue: Hakikat hal-hal yang disebut ἔνδοξα
  choice: segala perbuatan mulia
  alternative: segala perbuatan ajaib
  rationale: Konteksnya mencakup penyembuhan, tetapi ἔνδοξος sendiri berarti mulia, gemilang, atau mengagumkan. Terjemahan yang luas tidak mempersempit maknanya menjadi mukjizat saja.
- issue: Pelaku dalam ὑπ’ αὐτοῦ
  choice: yang dilakukan-Nya
  alternative: yang terjadi melalui-Nya
  rationale: Konstruksi Yunani secara wajar menyatakan bahwa Yesus adalah pelaku. Terjemahan ini tidak mengubahnya menjadi perantaraan tidak langsung.
- issue: Nuansa κατῃσχύνοντο
  choice: mendapat malu
  alternative: dipermalukan
  rationale: Bentuk Yunani dapat menyampaikan keadaan malu atau dipermalukan. 'Mendapat malu' mempertahankan nuansa aib di depan umum tanpa secara berlebihan menegaskan tindakan penghinaan yang disengaja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum dalam penerbitan Alkitab Indonesia. Konjungsi 'sedangkan' menampilkan kontras antara rasa malu para penentang dan sukacita orang banyak.
