  naturalness: Dengan «kepada kalian», kalimatnya baku dan alami dalam bahasa Indonesia modern. «Tetapi» menyatakan kontras ἀλλ’ secara lebih langsung daripada «Namun» setelah pemisahan kalimat.
  terminology: «Bertobat» tepat untuk μετανοῆτε dan tidak menambahkan penjelasan doktrinal. «Akan binasa» mempertahankan bobot ἀπολεῖσθε tanpa mereduksinya menjadi kematian fisik semata. Penanda catatan kaki dipindahkan agar jelas melekat pada «juga», unsur yang diterjemahkan dari ὡσαύτως.
