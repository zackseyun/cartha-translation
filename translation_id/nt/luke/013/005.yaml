  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: id
  text: Tidak, Aku berkata kepada kalian, tetapi jika kalian tidak bertobat, kalian semua juga[a] akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan binasa dengan cara yang sama.” Kata Yunani yang diterjemahkan “juga” dapat menunjuk pada penghukuman sebanding dengan contoh-contoh sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Tidak
  rationale: Jawaban negatif langsung dan tegas terhadap pertanyaan tersirat dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan rumusan khas Lukas secara dekat dan tetap wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: Namun, jika ... tidak
  rationale: Menyampaikan peralihan adversatif dan syarat negatif dengan susunan Indonesia yang alami.
- source_word: μετανοῆτε
  choice: kalian ... bertobat
  rationale: ‘Bertobat’ menyampaikan seruan untuk berbalik kepada Allah tanpa membatasinya pada penyesalan emosional atau perubahan pikiran secara intelektual saja.
- source_word: πάντες
  choice: kalian semua
  rationale: Menjaga cakupan menyeluruh dari peringatan itu dan memperjelas bahwa πάντες mengacu kepada seluruh pendengar.
- source_word: ὡσαύτως
  choice: juga
  rationale: ‘Juga’ mempertahankan hubungan perbandingan dengan contoh sebelumnya tanpa menentukan secara berlebihan apakah yang dibandingkan ialah cara, kepastian, atau sifat penghukuman.
- source_word: ἀπολεῖσθε
  choice: akan binasa
  rationale: Menyampaikan ancaman kehancuran atau kebinasaan dengan bobot yang lebih luas daripada sekadar kematian jasmani.
theological_decisions:
- issue: Makna pertobatan dalam peringatan Yesus
  choice: bertobat
  alternative: berubah pikiran; berbalik
  rationale: Istilah ini mempertahankan bobot alkitabiah seruan tersebut tanpa mempersempitnya menjadi penyesalan batin saja ataupun memasukkan rumusan doktrinal yang lebih lengkap.
- issue: Daya ungkap ὡσαύτως ἀπολεῖσθε
  choice: juga akan binasa
  alternative: akan binasa dengan cara yang sama; demikian pula akan binasa
  rationale: Terjemahan utama mempertahankan perbandingan dengan nasib orang-orang dalam peristiwa sebelumnya, tetapi tidak memastikan apakah kesamaannya terletak pada cara, kepastian, atau corak penghukuman. Catatan kaki mencantumkan alternatif yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. Kata ganti jamak ‘kalian’ dipakai untuk menyatakan ὑμῖν dan πάντες dengan jelas; ‘Aku’ mengikuti kebiasaan penulisan untuk perkataan Yesus.
