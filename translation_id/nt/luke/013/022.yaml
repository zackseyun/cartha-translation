  source_fidelity: 'Teks Indonesia mempertahankan semua unsur pokok Yunani: perjalanan yang berlangsung melalui kota-kota dan desa-desa (διεπορεύετο κατὰ πόλεις καὶ κώμας), kegiatan mengajar yang menyertainya (διδάσκων), serta arah perjalanan menuju Yerusalem (πορείαν ποιούμενος εἰς Ἱεροσόλυμα). Frasa “Dalam perjalanan menuju Yerusalem” bersama “melewati” menyampaikan kedua sisi gerak perjalanan tanpa menyatakan bahwa Yesus telah tiba di Yerusalem.'
