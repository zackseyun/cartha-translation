  terminology: “Yerusalem” adalah bentuk nama tempat yang baku. “Kota-kota dan desa-desa” secara wajar mempertahankan pembedaan πόλεις dan κώμας. “Menuju” tepat untuk arah perjalanan yang masih berlangsung, sementara catatan kaki menyediakan alternatif “ke Yerusalem.”
