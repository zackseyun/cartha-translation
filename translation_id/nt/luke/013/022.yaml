id: LUK.13.22
reference: Luke 13:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: id
  text: Dalam perjalanan menuju Yerusalem, Yesus melewati kota-kota dan desa-desa sambil mengajar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus berkeliling dari kota ke kota dan dari desa ke desa, mengajar dalam perjalanan ke Yerusalem.”
    reason: Teks Yunani memungkinkan susunan yang lebih dekat pada urutan katanya dan dapat dipahami secara distributif; catatan ini juga mempertahankan alternatif “ke Yerusalem” untuk εἰς Ἱεροσόλυμα.
lexical_decisions:
- source_word: διεπορεύετο
  choice: melewati
  rationale: Bentuk imperfek menggambarkan perjalanan yang sedang berlangsung melalui berbagai tempat; dalam susunan Indonesia, nuansa ini dibawa oleh frasa pembuka “Dalam perjalanan” dan verba “melewati”.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: kota-kota dan desa-desa
  rationale: κατά dengan akusatif bersifat distributif, menunjuk pada perjalanan melalui sejumlah permukiman besar dan kecil. Pengulangan nomina dalam bahasa Indonesia menyampaikan kemajemukan tersebut secara alami.
- source_word: διδάσκων
  choice: sambil mengajar
  rationale: Partisipel kini menyatakan kegiatan yang menyertai perjalanan. “Sambil mengajar” mempertahankan hubungan simultan itu dengan jelas dan alami.
- source_word: πορείαν ποιούμενος
  choice: Dalam perjalanan
  rationale: Ungkapan ini secara idiomatis berarti melakukan perjalanan atau bergerak menuju suatu tujuan. Pemindahannya ke awal kalimat menghasilkan bahasa Indonesia yang lancar tanpa menghilangkan gerak perjalanan yang disengaja.
- source_word: εἰς Ἱεροσόλυμα
  choice: menuju Yerusalem
  rationale: εἰς di sini menyatakan arah dan tujuan perjalanan yang masih berlangsung. “Menuju” menghindari kesan bahwa Yesus tiba pada saat itu, namun catatan kaki mempertahankan alternatif terjemahan yang lebih langsung.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
theological_decisions:
- issue: Arah perjalanan Yesus ke Yerusalem
  choice: menuju Yerusalem
  alternative: ke Yerusalem
  rationale: Konteks rangkuman perjalanan dalam Lukas menonjolkan gerak yang sedang berlangsung menuju tujuan, bukan kedatangan. Alternatif yang lebih harfiah tetap dicatat karena εἰς lazim pula berarti “ke”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama “Yesus” dinyatakan untuk memperjelas subjek tersirat dalam verba Yunani; struktur kalimat ditata ulang secara wajar sambil mempertahankan perjalanan yang berkelanjutan, kegiatan mengajar, dan arah menuju Yerusalem.
