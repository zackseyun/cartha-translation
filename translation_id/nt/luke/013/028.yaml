id: LUK.13.28
reference: Luke 13:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: id
  text: Di sanalah akan ada tangisan dan kertak gigi ketika kalian melihat Abraham, Ishak, Yakub, dan semua nabi berada dalam Kerajaan Allah, sedangkan kalian sendiri dicampakkan ke luar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedangkan kalian sendiri sedang dicampakkan ke luar.” Partisipium pasif Yunani menekankan bahwa mereka disingkirkan secara paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: di sanalah
  rationale: Adverbia tempat ini menunjuk pada tempat penyingkiran atau penghakiman; partikel -lah secara wajar menonjolkan lokasi itu.
- source_word: ὁ κλαυθμὸς
  choice: tangisan
  rationale: Padanan baku dan lugas untuk ratapan dalam rumusan penghakiman ini, tanpa memperkuat makna melebihi bahasa Yunani.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kertak gigi
  rationale: Ungkapan Indonesia yang mapan untuk tindakan mengertakkan gigi sebagai gambaran penderitaan atau kemarahan.
- source_word: ὅταν ὄψησθε
  choice: ketika kalian melihat
  rationale: ὅταν dengan bentuk subjungtif menunjuk pada peristiwa mendatang; bahasa Indonesia tidak memerlukan penandaan kala secara eksplisit.
- source_word: πάντας τοὺς προφήτας
  choice: semua nabi
  rationale: Mempertahankan πάντας dan menyampaikan frasa tersebut secara langsung serta alami.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: berada dalam Kerajaan Allah
  rationale: Kata 'berada' melengkapi konstruksi Indonesia secara alami, sedangkan 'dalam Kerajaan Allah' mempertahankan citra ruang dan istilah utama teks.
- source_word: ὑμᾶς δὲ
  choice: sedangkan kalian sendiri
  rationale: δέ menandai pertentangan kuat, dan pronomina eksplisit ὑμᾶς diberi tekanan melalui 'sendiri'.
- source_word: ἐκβαλλομένους ἔξω
  choice: dicampakkan ke luar
  rationale: Bentuk pasif partisipial dan ἔξω menggambarkan penyingkiran yang kuat; 'dicampakkan ke luar' mempertahankan unsur paksaan dan arah keluar.
theological_decisions:
- issue: Hakikat gambaran penghakiman
  choice: Mempertahankan gambaran konkret tentang penyingkiran dan penderitaan tanpa menjelaskannya lebih jauh.
  alternative: Memparafrasakannya sebagai 'dukacita mendalam' atau 'penghukuman kekal'.
  rationale: Ayat ini menggambarkan orang-orang yang disingkirkan dari Kerajaan Allah serta tangisan dan kertak gigi, tetapi tidak merumuskan seluruh doktrin penghakiman akhir.
- issue: Makna Kerajaan Allah
  choice: Menerjemahkan secara langsung sebagai 'Kerajaan Allah'.
  alternative: Menafsirkannya sebagai surga, perjamuan mesianik, atau suatu sistem pemerintahan tertentu.
  rationale: Teks menyebut βασιλεία τοῦ θεοῦ tanpa membatasi rujukannya lebih lanjut; ambiguitas teologis itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena pronomina Yunani berbentuk jamak; susunan kalimat mempertahankan kontras antara para leluhur dan nabi di dalam Kerajaan Allah dengan para pendengar yang dicampakkan ke luar.
