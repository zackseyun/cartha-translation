source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: id
  text: Kemudian Yesus berkata kepada mereka, “Pergilah dan katakan kepada si rubah itu, ‘Lihatlah, Aku mengusir roh-roh jahat dan melakukan penyembuhan hari ini dan besok, dan pada hari ketiga Aku dibawa sampai pada penyelesaian.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku mencapai tujuan-Ku,” “Aku disempurnakan,” atau “perjalanan-Ku selesai.” Ungkapan Yunani dapat berarti dibawa sampai pada penyelesaian dan kemungkinan menunjuk pada tuntasnya misi yang ditetapkan bagi Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: si rubah itu
  rationale: Mempertahankan nama hewan dan nada merendahkan dari ungkapan Yunani tanpa menjabarkan metaforanya sebagai ‘licik’.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Penanda wacana yang secara alami mengarahkan perhatian pada pernyataan berikutnya dan tetap memiliki nada bermartabat.
- source_word: ἐκβάλλω δαιμόνια
  choice: Aku mengusir roh-roh jahat
  rationale: Ungkapan Indonesia yang wajar untuk tindakan eksorsisme dalam Injil; ‘roh-roh jahat’ menyampaikan δαιμόνια secara jelas bagi pembaca umum.
- source_word: ἰάσεις ἀποτελῶ
  choice: melakukan penyembuhan
  rationale: Menyampaikan tindakan menghasilkan atau melaksanakan penyembuhan dengan bahasa Indonesia yang alami, tanpa meleburkannya dengan tindakan mengusir roh-roh jahat.
- source_word: σήμερον καὶ αὔριον
  choice: hari ini dan besok
  rationale: Mempertahankan urutan temporal harfiah sekaligus membiarkan kemungkinan bahwa ungkapan itu menunjuk pada suatu masa singkat yang tertentu.
- source_word: τῇ τρίτῃ
  choice: pada hari ketiga
  rationale: Padanan temporal yang jelas dan idiomatis dalam bahasa Indonesia.
- source_word: τελειοῦμαι
  choice: Aku akan dibawa kepada penyelesaian
  rationale: Mempertahankan bentuk pasif dan gagasan mencapai penyelesaian, tanpa menentukan secara eksplisit apakah yang dimaksud ialah akhir pelayanan, kematian, kebangkitan, atau pemuliaan Yesus.
theological_decisions:
- issue: Makna τελειοῦμαι sehubungan dengan penyelesaian misi Yesus dan kemungkinan acuan kepada kematian atau kebangkitan-Nya
  choice: Aku akan dibawa kepada penyelesaian
  alternative: Aku mencapai tujuan-Ku; Aku disempurnakan; perjalanan-Ku selesai
  rationale: Bahasa Yunani membuka kemungkinan penyelesaian karya atau perjalanan yang ditetapkan bagi Yesus, tetapi tidak secara eksplisit menyebut kebangkitan atau pemuliaan. Rumusan utama mempertahankan bentuk pasif serta ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Si rubah itu’ mempertahankan nada tajam perkataan Yesus; konstruksi pada klausa terakhir sengaja agak formal untuk menjaga bentuk pasif dan ambiguitas teks Yunani.
