  to: Kemudian Yesus berkata kepada mereka, “Pergilah dan katakan kepada si rubah itu, ‘Lihatlah, Aku mengusir roh-roh jahat dan melakukan penyembuhan hari ini dan besok, dan pada hari ketiga Aku dibawa sampai pada penyelesaian.’[a]”
