  terminology: Istilah 'rumah', 'Tuhan', dan formula 'Diberkatilah Dia yang datang dalam nama Tuhan' tepat serta mempertahankan gaung Mazmur 118:26. Kapitalisasi pronomina bagi Yesus konsisten dengan register penerbitan yang dinyatakan.
