id: LUK.13.35
reference: Luke 13:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: id
  text: 'Lihatlah, rumah kalian ditinggalkan bagi kalian.[a][b] Namun Aku berkata kepada kalian: kalian sama sekali tidak akan melihat Aku sampai tiba waktunya ketika kalian berkata,[c][d] “Diberkatilah Dia yang datang dalam nama Tuhan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditelantarkan” atau “diserahkan.” Bentuk pasif Yunani ini dapat mengandung nuansa penghakiman, yaitu dibiarkan atau diserahkan kepada akibatnya.
    reason: lexical_alternative
  - marker: b
    text: “Rumah kalian” kemungkinan menunjuk kepada Yerusalem, khususnya Bait Allah, tetapi teks Yunani hanya mengatakan “rumah kalian.”
    reason: alternative_reading
  - marker: c
    text: Ucapan “Diberkatilah Dia yang datang dalam nama Tuhan” menggemakan Mazmur 118:26.
    reason: cross_reference
  - marker: d
    text: Sebagian penafsir menghubungkan perkataan ini dengan masuknya Yesus ke Yerusalem; yang lain memahaminya sebagai pengakuan kepada-Nya pada masa mendatang. Teks Yunani sendiri tidak menetapkan satu waktu tertentu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Seruan ini mempertahankan daya penarik perhatian dan nada khidmat ungkapan Yunani dalam bahasa Indonesia modern.
- source_word: ἀφίεται
  choice: ditinggalkan
  rationale: Bentuk pasif kini dipertahankan tanpa menentukan secara berlebihan apakah maknanya sekadar ditinggalkan, ditelantarkan, atau diserahkan kepada penghukuman.
- source_word: ὁ οἶκος ὑμῶν
  choice: rumahmu
  rationale: Menerjemahkan ungkapan Yunani secara langsung dan tidak mempersempit acuannya menjadi Bait Allah, Yerusalem, atau umat Israel di dalam teks utama.
- source_word: ὑμῖν
  choice: bagimu
  rationale: Mempertahankan relasi datif dalam frasa 'ditinggalkan bagimu', termasuk kemungkinan nuansa penyerahan yang ironis atau bersifat penghakiman.
- source_word: λέγω δὲ ὑμῖν
  choice: Namun Aku berkata kepadamu
  rationale: δέ menandai peralihan dengan sedikit kontras dari pernyataan tentang rumah kepada akibat berikutnya; 'Namun' alami dan tidak terlalu tajam.
- source_word: οὐ μὴ ἴδητέ με
  choice: kamu sama sekali tidak akan melihat Aku
  rationale: Ungkapan 'sama sekali tidak akan' menyampaikan penyangkalan masa depan yang sangat tegas dari οὐ μή dengan subjungtif aoris.
- source_word: ἕως ἥξει ὅτε
  choice: sampai tiba waktunya
  rationale: Menyampaikan idiom temporal Yunani secara jelas dan alami tanpa mengubah arah waktunya.
- source_word: εἴπητε
  choice: kamu berkata
  rationale: Dalam konstruksi sesudah 'sampai tiba waktunya', bentuk ini wajar dalam bahasa Indonesia dan tetap menunjuk pada ucapan pada masa mendatang.
- source_word: Εὐλογημένος
  choice: Diberkatilah
  rationale: Mempertahankan bentuk formula berkat dan gaung kutipan Mazmur 118:26.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang datang
  rationale: Mewakili partisip substantival secara alami tanpa memaksakannya menjadi gelar teknis 'Yang Akan Datang'.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Mempertahankan rumusan alkitabiah yang dikenal serta hubungan langsung dengan teks Mazmur.
theological_decisions:
- issue: Acuan 'rumahmu'
  choice: Tetap memakai 'rumahmu' dalam teks utama
  alternative: Bait Allah; Yerusalem; bangsa atau kaum Israel
  rationale: Konteks ratapan atas Yerusalem sangat mungkin menunjuk kepada Yerusalem, khususnya Bait Allah, tetapi bahasa Yunani hanya mengatakan 'rumahmu'. Terjemahan tidak mempersempit ambiguitas asli.
- issue: Waktu penggenapan ucapan terakhir
  choice: Dibiarkan sebagai pengakuan pada masa mendatang tanpa menetapkan peristiwa tertentu
  alternative: Masuknya Yesus ke Yerusalem; pertobatan Yerusalem/Israel pada masa depan; pengakuan eskatologis ketika Yesus datang kembali
  rationale: Susunan Yunani tidak mengharuskan satu penentuan waktu tertentu. Teks utama mempertahankan ketegangan penafsirannya.
- issue: Daya ἀφίεται
  choice: ditinggalkan
  alternative: ditelantarkan; diserahkan
  rationale: Pilihan utama mempertahankan bentuk pasif dan keluasan semantisnya; kemungkinan nuansa penghakiman dijelaskan dalam catatan kaki tanpa dipaksakan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Bentuk tunggal 'rumahmu' dan 'kepadamu' dipertahankan karena Yerusalem disapa sebagai satu pribadi dalam konteks, sedangkan klausa berikutnya juga diterjemahkan secara tunggal secara idiomatis.
