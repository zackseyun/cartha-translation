  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: id
  text: Dan Ia berkata lagi, “Dengan apakah Aku akan membandingkan Kerajaan Allah?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Penghubung naratif yang alami dalam bahasa Indonesia; menyambungkan perkataan ini dengan perumpamaan sebelumnya tanpa menambahkan hubungan sebab-akibat.
- source_word: πάλιν
  choice: lagi
  rationale: Secara langsung menyatakan pengulangan dan terdengar alami bersama verba 'berkata'.
- source_word: εἶπεν
  choice: Ia berkata
  rationale: Bentuk naratif λέγω yang lazim untuk memperkenalkan ucapan langsung. Huruf kapital pada 'Ia' mengikuti konvensi bahasa Indonesia ketika rujukannya adalah Yesus.
- source_word: Τίνι
  choice: Dengan apakah
  rationale: Bentuk datif interogatif netral ini menanyakan sarana atau objek pembanding, bukan orang; 'dengan apakah' mempertahankan konstruksi perbandingan secara jelas.
- source_word: ὁμοιώσω
  choice: Aku akan membandingkan
  rationale: Mencerminkan bentuk futur orang pertama tunggal sekaligus tetap wajar sebagai pertanyaan retoris dalam bahasa Indonesia.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan alkitabiah yang mapan dan tetap memelihara keluasan makna βασιλεία, yang dapat mencakup pemerintahan maupun ranah kerajaan Allah.
theological_decisions:
- issue: Pemadanan βασιλεία dalam perkataan tentang pemerintahan Allah
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: '''Kerajaan Allah'' mempertahankan ungkapan kanonis dan keluasan semantis istilah Yunani, tanpa mempersempitnya hanya menjadi tindakan memerintah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk pertanyaan retoris dan bentuk futur pada verba Yunani.
