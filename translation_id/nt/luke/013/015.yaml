id: LUK.13.15
reference: Luke 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: id
  text: Namun Tuhan menjawabnya dan berkata, “Hai orang-orang munafik! Bukankah pada hari Sabat setiap orang di antara kalian melepaskan ikatan lembu atau keledainya dari palungan[a], lalu menuntunnya pergi untuk memberinya minum?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat makan ternak.” Kata Yunani yang dipakai dapat merujuk pada wadah atau tempat ternak makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar naratif yang dipakai Lukas bagi Yesus beserta bobot kristologisnya, tanpa menurunkannya menjadi sekadar ‘tuan’.
- source_word: Ὑποκριταί
  choice: Hai orang-orang munafik!
  rationale: Bentuk sapaan jamak yang merupakan teguran langsung dan tajam; ‘hai’ menandai vokatif secara alami dalam bahasa Indonesia.
- source_word: ἕκαστος ὑμῶν
  choice: setiap orang di antara kalian
  rationale: 'Menjaga daya distributif ungkapan Yunani: tindakan yang disebut berlaku pada tiap-tiap pendengar.'
- source_word: τῷ σαββάτῳ
  choice: pada hari Sabat
  rationale: Padanan temporal yang baku, jelas, dan alami dalam bahasa Indonesia modern.
- source_word: λύει
  choice: melepaskan ikatan
  rationale: Dalam konteks ternak yang ditambatkan dekat tempat makannya, frasa ini lebih jelas daripada ‘melepaskan’ saja dan tidak menyiratkan bahwa hewan itu dibebaskan sepenuhnya.
- source_word: βοῦν
  choice: lembu
  rationale: Padanan umum dan bermartabat untuk hewan jenis sapi dalam konteks agraris; tidak memaksakan jenis kelamin atau fungsi khusus yang tidak dinyatakan oleh kata Yunani.
- source_word: ὄνον
  choice: keledai
  rationale: Padanan modern yang jelas dan lazim.
- source_word: φάτνης
  choice: palungan
  rationale: Menggambarkan tempat atau wadah makanan ternak secara ringkas dan konkret, sambil mencatat keluasan maknanya dalam catatan kaki.
- source_word: ἀπαγαγὼν
  choice: lalu menuntunnya pergi
  rationale: Menyampaikan urutan tindakan partisip aoris sebelum tindakan memberi minum dengan susunan Indonesia yang alami.
- source_word: ποτίζει
  choice: memberinya minum
  rationale: Menyatakan tindakan menyediakan air minum bagi hewan secara idiomatis dan tepat.
theological_decisions:
- issue: Gelar naratif κύριος yang diterapkan kepada Yesus
  choice: Tuhan
  alternative: tuan
  rationale: Dalam narasi Lukas, κύριος berfungsi sebagai gelar bagi Yesus dan membawa bobot kristologis. ‘Tuhan’ mempertahankan fungsi itu tanpa menambahkan penjelasan teologis ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ‘kalian’ dipakai karena sapaan dan pertanyaan ditujukan kepada kelompok, sedangkan ‘setiap orang’ mempertahankan unsur distributif. Penanda catatan kaki ditempatkan langsung sesudah ‘palungan’, yaitu kata yang diterangkannya.
