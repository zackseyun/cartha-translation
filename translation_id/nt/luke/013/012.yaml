  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: id
  text: Ketika Yesus melihat perempuan itu, Ia menyapanya dan berkata kepadanya, “Ibu, engkau telah dibebaskan dari kelemahanmu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau telah dilepaskan dari penyakitmu.”
    reason: Alternatif ini mencerminkan kemungkinan makna ἀπολύω sebagai "melepaskan" dan ἀσθένεια sebagai "penyakit" dalam konteks penderitaan jasmani.
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Ketika Yesus melihat perempuan itu
  rationale: Partisip aoristus ἰδών wajar dinyatakan sebagai anak kalimat waktu. δέ berfungsi sebagai penggerak narasi dan tidak harus diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: προσεφώνησεν
  choice: Ia memanggilnya
  rationale: προσφωνέω dapat berarti memanggil atau menyapa seseorang; dalam konteks ini, 'memanggilnya' mempertahankan prakarsa Yesus tanpa memastikan bahwa Ia menyuruhnya mendekat.
- source_word: Γύναι
  choice: Ibu
  rationale: Sapaan γύναι bersifat langsung dan hormat. 'Ibu' menyampaikan kesantunan itu secara alami dalam bahasa Indonesia modern, sedangkan 'Perempuan' sebagai sapaan dapat terdengar kasar.
- source_word: ἀπολέλυσαι
  choice: engkau telah dibebaskan
  rationale: Bentuk perfek pasif menyatakan tindakan pembebasan yang telah terjadi dengan hasil yang tetap berlaku.
- source_word: τῆς ἀσθενείας σου
  choice: dari kelemahanmu
  rationale: ἀσθένεια memiliki cakupan makna kelemahan, penyakit, atau ketidakberdayaan. 'Kelemahan' mempertahankan keluasan istilah sumber tanpa memberikan diagnosis yang terlalu khusus.
theological_decisions:
- issue: Sifat keadaan perempuan dalam ἀσθένεια
  choice: kelemahan
  alternative: penyakit; kelemahan tubuh
  rationale: Konteks menunjukkan penderitaan jasmani, tetapi istilah Yunani tetap luas. Pilihan ini tidak mempersempitnya menjadi diagnosis medis tertentu.
- issue: Aspek dan diatesis ἀπολέλυσαι
  choice: telah dibebaskan
  alternative: sudah bebas; telah dilepaskan
  rationale: Terjemahan ini mempertahankan bentuk pasif serta tindakan yang selesai dengan akibat yang masih berlangsung, tanpa menyatakan pelaku pembebasan yang tidak disebut secara gramatikal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti 'Ia' dan sapaan 'engkau' menjaga register narasi Kitab Suci yang formal tetapi tetap mudah dipahami.
