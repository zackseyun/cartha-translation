base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: id
  text: Dan jika pohon itu menghasilkan buah pada masa mendatang[a]—baiklah; tetapi jika tidak, engkau akan menebangnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tahun depan”. Sejumlah terjemahan memakai jangka waktu yang lebih khusus berdasarkan ayat sebelumnya, tetapi ungkapan Yunani di sini secara lebih harfiah berarti “pada masa mendatang” atau “untuk waktu yang akan datang”.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: Dan jika
  rationale: κἄν menggabungkan καί dan ἐάν, sedangkan μέν menyiapkan pertentangan dengan δέ. “Dan jika” mempertahankan hubungan serta syarat secara alami dalam bahasa Indonesia.
- source_word: ποιήσῃ καρπὸν
  choice: pohon itu menghasilkan buah
  rationale: Dalam konteks pertanian, ποιέω bersama καρπός berarti menghasilkan atau berbuah. Penyebutan “pohon itu” memperjelas rujukan subjek yang tersirat tanpa mengubah metafora.
- source_word: εἰς τὸ μέλλον
  choice: pada waktu mendatang
  rationale: Ungkapan ini secara harfiah menunjuk pada waktu yang akan datang dan tidak secara eksplisit mengatakan “tahun depan”. Pilihan ini mempertahankan keluasan temporal teks Yunani.
- source_word: εἰ δὲ μήγε
  choice: tetapi jika tidak
  rationale: Ungkapan ini memperkenalkan hasil alternatif yang berlawanan dan secara ringkas meniadakan syarat sebelumnya.
- source_word: ἐκκόψεις αὐτήν
  choice: engkau akan menebangnya
  rationale: ἐκκόπτω dalam konteks pohon berarti menebang. Bentuk orang kedua tunggal masa depan dipertahankan dengan “engkau akan”.
theological_decisions:
- issue: Jangka waktu penundaan penghakiman dalam perumpamaan
  choice: Teks utama memakai “pada waktu mendatang” tanpa menetapkan “tahun depan”.
  alternative: “Tahun depan,” dengan mengambil jangka waktu yang lebih khusus dari ayat sebelumnya.
  rationale: εἰς τὸ μέλλον dalam ayat ini tidak secara eksplisit menyebut tahun berikutnya. Mempertahankan ungkapan yang lebih umum menjaga ketegangan antara kesempatan untuk berbuah dan kemungkinan penghakiman tanpa menambahkan ketepatan waktu yang tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Baiklah” melengkapi akibat positif yang dibiarkan tersirat dalam bahasa Yunani, sedangkan tanda pisah mempertahankan jeda dan ketegangan kalimat.
