  to: Kerajaan Allah itu seperti ragi[a] yang diambil seorang perempuan dan disembunyikannya[b] ke dalam tiga sukat tepung[c] sampai seluruh adonan itu beragi.
  rationale: Revisi mempertahankan subjek yang dipulihkan dari konteks, pilihan "ragi", dan makna harfiah "menyembunyikan", sambil memperjelas pelaku perempuan dan mengganti parafrasa hasil "mengembang karena ragi" dengan padanan yang lebih setia untuk ἐζυμώθη ὅλον. Semua jangkar catatan kaki tetap ditempatkan pada unsur yang diterangkan.
