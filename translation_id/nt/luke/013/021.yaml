id: LUK.13.21
reference: Luke 13:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: id
  text: Kerajaan Allah itu seperti ragi[a] yang diambil seorang perempuan dan disembunyikannya[b] ke dalam tiga sukat tepung[c] sampai seluruh adonan itu beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahan peragi”; yang dimaksud ialah bahan fermentasi yang digunakan untuk mengembangkan adonan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini dapat juga dipahami “dicampurkannya”. Kata Yunaninya secara harfiah berarti “disembunyikannya”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tiga sata” (sekitar tiga sea), yaitu jumlah tepung yang besar.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Kerajaan Allah itu seperti
  rationale: Bentuk feminin ὁμοία merujuk pada βασιλεία τοῦ θεοῦ dalam konteks ayat sebelumnya. Subjek dipulihkan agar kalimat Indonesia mandiri dan jelas.
- source_word: ζύμῃ
  choice: ragi
  rationale: Dalam bahasa Indonesia modern, 'ragi' adalah padanan alami bagi bahan peragi dan tidak harus menunjuk produk komersial modern.
- source_word: λαβοῦσα γυνὴ
  choice: yang diambil seorang perempuan
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; susunan ini mempertahankan hubungan sintaksis tanpa terasa kaku.
- source_word: ἔκρυψεν
  choice: disembunyikannya
  rationale: Mempertahankan arti harfiah verba 'menyembunyikan', meskipun dalam konteks pembuatan adonan maksud praktisnya dapat berupa mencampurkan.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: ke dalam tiga sukat tepung
  rationale: '''Sukat'' mempertahankan satuan takaran kuno tanpa menyamakannya secara keliru dengan ukuran modern; catatan menjelaskan besarnya.'
- source_word: ἕως οὗ
  choice: sampai
  rationale: Padanan temporal yang ringkas dan alami.
- source_word: ἐζυμώθη ὅλον
  choice: sampai seluruh adonan itu mengembang karena ragi
  rationale: Ungkapan ini menyampaikan bahwa seluruh campuran terkena daya ragi. 'Adonan' memperjelas acuan netral ὅλον secara alami dalam konteks.
theological_decisions:
- issue: Daya simbolis ragi dalam perumpamaan
  choice: Gambaran ragi diterjemahkan secara netral tanpa dinilai positif atau negatif.
  alternative: Menafsirkan ragi secara khusus sebagai lambang kejahatan atau, sebaliknya, sebagai lambang pertumbuhan Kerajaan Allah.
  rationale: Ayat ini sendiri menekankan kerja ragi yang menjangkau seluruh adonan; terjemahan tidak boleh memasukkan penilaian teologis yang tidak dinyatakan secara eksplisit.
- issue: Subjek tersirat pada ὁμοία ἐστὶν
  choice: Memulihkan 'Kerajaan Allah' dari konteks langsung.
  alternative: Menerjemahkan hanya 'Itu seperti ragi'.
  rationale: Bentuk feminin ὁμοία menunjuk kembali kepada 'Kerajaan Allah' dalam ayat 20. Pemulihan subjek menghasilkan ayat Indonesia yang jelas tanpa mengubah rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah 'sukat' mempertahankan warna budaya kuno, sedangkan catatan kaki menerangkan satuan dan pilihan leksikal. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkan.
