  source_fidelity: 'Draf memulihkan subjek "Kerajaan Allah" dengan tepat dari konteks langsung (Luk. 13:20) dan mempertahankan citra ζύμη sebagai "ragi". Namun, "mengembang karena ragi" bukan padanan yang cukup dekat untuk ἐζυμώθη ὅλον: verba pasif itu menyatakan bahwa seluruh campuran menjadi beragi/terfermentasi, bukan terutama bahwa adonan mengembang, dan frasa tersebut menambahkan hubungan kausal yang tidak dinyatakan secara eksplisit.'
  naturalness: 'Susunan "ragi yang diambil seorang perempuan lalu disembunyikannya" dapat dipahami, tetapi hubungan pelaku lebih jelas dan lebih alami bila "seorang perempuan" menjadi pelaku aktif: "yang diambil seorang perempuan dan disembunyikannya...". "Sampai seluruh adonan itu beragi" adalah ungkapan modern yang ringkas dan tepat dalam konteks pembuatan adonan.'
  terminology: '"Ragi" merupakan padanan modern yang baik untuk ζύμη. "Sukat" dapat dipertahankan sebagai satuan takaran tradisional, dengan catatan yang menerangkan "sata/sea". Catatan mengenai "dicampurkan" perlu tetap menegaskan bahwa arti harfiah ἔκρυψεν ialah "menyembunyikan".'
