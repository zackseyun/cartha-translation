id: LUK.13.16
reference: Luke 13:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: id
  text: Bukankah perempuan ini, seorang anak perempuan Abraham, yang telah diikat oleh Iblis—lihatlah—selama delapan belas tahun, harus dilepaskan dari ikatan ini pada hari Sabat?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: keturunan Abraham
  rationale: Secara harfiah berarti “anak perempuan Abraham”, tetapi dalam konteks ini merupakan ungkapan Semitis tentang keanggotaan dalam umat perjanjian; “keturunan Abraham” menyampaikan maksud itu secara alami tanpa menyiratkan bahwa Abraham adalah ayah langsungnya.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: diikat / dilepaskan / ikatan
  rationale: Mempertahankan rangkaian metafora Yunani yang menghubungkan tindakan Iblis, pembebasan perempuan itu, dan keadaannya.
- source_word: ὁ Σατανᾶς
  choice: Iblis
  rationale: Padanan Indonesia yang lazim untuk nama atau gelar tokoh rohani tersebut dalam konteks Perjanjian Baru.
- source_word: ἰδού
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang eksplisit dalam teks sumber, meskipun posisinya di tengah kalimat terasa retoris.
- source_word: οὐκ ἔδει
  choice: Bukankah ... harus
  rationale: Mewakili pertanyaan retoris negatif yang mengharapkan jawaban ya dan menyatakan kepatutan atau keharusan.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: pada hari Sabat
  rationale: Padanan baku dan langsung bagi keterangan waktu Yunani.
theological_decisions:
- issue: Hubungan penderitaan perempuan itu dengan Iblis
  choice: yang telah diikat Iblis
  alternative: yang penyakitnya diizinkan Iblis
  rationale: Teks secara langsung menyatakan bahwa Iblis mengikatnya; terjemahan tidak melunakkan atau menjelaskan mekanisme penyebab yang tidak dinyatakan.
- issue: Makna “keturunan Abraham”
  choice: Mempertahankan identitasnya sebagai bagian dari garis atau umat Abraham tanpa penjelasan tambahan dalam ayat
  alternative: anak perempuan Abraham
  rationale: Ungkapan itu membawa bobot identitas umat perjanjian, tetapi ayat sendiri tidak merinci apakah tekanannya terutama etnis, iman, atau keduanya; terjemahan tidak menyelesaikan ketegangan tersebut.
- issue: Keharusan pembebasan pada hari Sabat
  choice: harus dilepaskan ... pada hari Sabat
  alternative: boleh dilepaskan ... pada hari Sabat
  rationale: ἔδει lebih kuat daripada sekadar izin; pertanyaan Yesus menegaskan kepatutan atau keharusan pembebasan, bukan hanya kebolehannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur pertanyaan retoris dipertahankan, demikian pula seruan “lihatlah” dan metafora ikatan-pembebasan. “Perempuan ini” dipilih untuk ταύτην agar rujukannya jelas.
