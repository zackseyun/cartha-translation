revisions:
- from: Bukankah perempuan ini, yang adalah keturunan Abraham dan yang telah diikat Iblis selama delapan belas tahun ini—lihatlah—harus dilepaskan dari ikatan itu pada hari Sabat?
  to: Bukankah perempuan ini, seorang anak perempuan Abraham, yang telah diikat oleh Iblis—lihatlah—selama delapan belas tahun, harus dilepaskan dari ikatan ini pada hari Sabat?
  rationale: Revisi mengembalikan makna leksikal eksplisit “anak perempuan Abraham,” mempertahankan rangkaian metafora ikat–lepas, serta menempatkan “lihatlah” sebagai penanda perhatian bagi lamanya penderitaan. Tidak ada penafsiran tambahan mengenai mekanisme tindakan Iblis atau cakupan identitas Abraham.
