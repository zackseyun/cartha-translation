  terminology: '"Pilatus," "orang-orang Galilea," dan "persembahan kurban" sesuai dengan istilah dan register. Rujukan kepada Yesus dapat dinyatakan dengan "kepada-Nya" karena antesedennya jelas dalam konteks langsung. Catatan kaki lama tidak lagi diperlukan: setelah teks dibuat aktif, alternatifnya pada dasarnya mengulangi teks utama.'
