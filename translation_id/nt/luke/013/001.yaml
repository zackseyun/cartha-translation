  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: id
  text: Pada waktu itu, beberapa orang yang hadir memberitahukan kepada-Nya tentang orang-orang Galilea yang darahnya telah dicampurkan Pilatus dengan persembahan kurban mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: beberapa orang yang ada di sana
  rationale: Imperfek πάρειμι menyatakan keberadaan atau kehadiran, sedangkan δέ berfungsi sebagai peralihan ringan yang dalam bahasa Indonesia tidak perlu diterjemahkan dengan kata tersendiri. Susunan ini alami dan tidak mengubahnya menjadi kedatangan.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Pada saat itu juga
  rationale: Ungkapan ini menunjuk secara khusus pada waktu yang sama dengan konteks sebelumnya; 'itu juga' mempertahankan penekanannya.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: memberi tahu Yesus
  rationale: Partisipel ini menyatakan penyampaian laporan atau kabar. Nama 'Yesus' dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia tanpa mengubah referennya.
- source_word: περὶ τῶν Γαλιλαίων
  choice: tentang orang-orang Galilea
  rationale: περί dengan genitif memperkenalkan pokok laporan; bentuk ini jelas dan lazim dalam bahasa Indonesia modern.
- source_word: ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν
  choice: yang darahnya telah dicampurkan Pilatus
  rationale: Relatif posesif dipertahankan, dan bentuk 'telah dicampurkan' menunjukkan bahwa peristiwa itu mendahului laporan tanpa menjelaskan mekanismenya.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: dengan kurban-kurban mereka
  rationale: μετά berarti 'dengan', sedangkan θυσίαι adalah persembahan kurban. Bentuk posesif mempertahankan ketaksaan apakah kurban itu mereka bawa atau sedang mereka persembahkan.
theological_decisions:
- issue: Hakikat historis dan daya moral tindakan Pilatus
  choice: Menerjemahkan secara langsung bahwa Pilatus mencampurkan darah orang-orang Galilea dengan kurban-kurban mereka.
  alternative: Memperjelas secara interpretatif bahwa Pilatus membunuh mereka ketika mereka sedang mempersembahkan kurban.
  rationale: Teks Yunani melaporkan peristiwa yang mengerikan itu tanpa menerangkan mekanisme atau makna teologisnya. Terjemahan mempertahankan ungkapan yang tajam dan tidak menambahkan rincian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kurban' dipilih untuk θυσίαι dalam konteks persembahan keagamaan. Penanda wacana δέ tidak diterjemahkan secara mekanis, dan ketaksaan tentang hubungan orang-orang Galilea dengan kurban mereka tetap dipertahankan.
