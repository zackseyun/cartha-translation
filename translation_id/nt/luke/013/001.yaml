revisions:
- from: Pada saat itu juga, beberapa orang yang ada di sana memberi tahu Yesus tentang orang-orang Galilea yang darahnya telah dicampurkan Pilatus dengan kurban-kurban mereka.[a]
  to: Pada waktu itu, beberapa orang yang hadir memberitahukan kepada-Nya tentang orang-orang Galilea yang darahnya telah dicampurkan Pilatus dengan persembahan kurban mereka.
  rationale: Revisi menghilangkan tambahan lokasi yang tidak ada dalam sumber, memakai "hadir" untuk nilai imperfek statif Παρῆσαν, dan mengembalikan Pilatus sebagai subjek aktif sebagaimana dalam Yunani. "Pada waktu itu" mempertahankan rujukan temporal ἐν αὐτῷ τῷ καιρῷ tanpa memberi tekanan idiomatis tambahan yang mungkin tersirat oleh "itu juga." Ungkapan "persembahan kurban mereka" mempertahankan makna θυσίαι serta ketaksaan sumber mengenai hubungan mereka dengan persembahan itu. Catatan kaki dihapus karena tidak diperlukan bagi teks yang telah direvisi.
