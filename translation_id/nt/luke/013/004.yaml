id: LUK.13.4
reference: Luke 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: id
  text: Atau, kedelapan belas orang yang tertimpa menara di Siloam ketika menara itu roboh dan menewaskan mereka—apakah kalian mengira bahwa mereka menjadi orang-orang yang lebih berutang daripada semua orang yang tinggal di Yerusalem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang lebih berutang.” Maksudnya dapat juga diterjemahkan “lebih berdosa” atau “lebih bersalah.” Kata Yunani yang dipakai berarti “orang yang berutang,” kemungkinan dalam arti moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan contoh lain dalam alur argumen Yesus dan mempertahankan hubungan retoris dengan ayat sebelumnya.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: kedelapan belas orang
  rationale: Numeralia tentu dalam bahasa Indonesia memerlukan nomina penggolong yang alami; 'orang' tidak membatasi rujukan pada laki-laki.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: yang tertimpa menara ... ketika menara itu roboh
  rationale: Mengungkapkan relasi bahwa menara jatuh menimpa mereka dengan bahasa Indonesia yang alami, tanpa mengubahnya menjadi tindakan sengaja.
- source_word: ἐν τῷ Σιλωὰμ
  choice: di Siloam
  rationale: Transliterasi nama tempat dan padanan langsung preposisi lokasi.
- source_word: ἀπέκτεινεν αὐτούς
  choice: menewaskan mereka
  rationale: '''Menewaskan'' wajar untuk akibat bencana dan tidak menyiratkan pembunuhan yang disengaja.'
- source_word: δοκεῖτε ὅτι
  choice: apakah menurut kalian
  rationale: Menyampaikan pertanyaan langsung kepada kelompok pendengar dalam bahasa Indonesia modern.
- source_word: ὀφειλέται ἐγένοντο
  choice: mereka lebih besar utangnya
  rationale: Mempertahankan metafora ὀφειλέται sebagai orang yang berutang dalam arti moral, sambil membuat konstruksi komparatifnya dapat dipahami.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: daripada semua orang
  rationale: παρά dengan akusatif menyatakan perbandingan; ἀνθρώπους di sini merujuk secara umum kepada manusia, sehingga 'orang' tepat dan inklusif.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: yang tinggal di Yerusalem
  rationale: Padanan modern dan alami bagi partisipel yang menunjukkan para penghuni Yerusalem.
theological_decisions:
- issue: Makna moral ὀφειλέται
  choice: lebih besar utangnya
  alternative: lebih berdosa / lebih bersalah
  rationale: Konteks menunjukkan utang moral, tetapi penggunaan metafora 'utang' mempertahankan perbedaan leksikal dari ἁμαρτωλοί ('orang berdosa') pada ayat 2 dan tidak menuntaskan ketegangan teologisnya secara diam-diam.
- issue: Cakupan ἀνθρώπους
  choice: orang
  alternative: laki-laki
  rationale: Rujukannya adalah seluruh penduduk Yerusalem, bukan kelompok yang dinyatakan khusus laki-laki; bahasa Indonesia 'orang' mencerminkan cakupan umum kata Yunani dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kalian' dipakai karena pertanyaan ditujukan kepada sekelompok pendengar. Metafora utang dipertahankan dalam teks utama, dengan makna moral dijelaskan dalam catatan kaki.
