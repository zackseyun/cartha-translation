  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: id
  text: Yesus menjawab mereka, “Apakah kalian mengira bahwa orang-orang Galilea itu menjadi lebih berdosa daripada semua orang Galilea lainnya karena mereka telah mengalami semua itu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: berkata
  rationale: Ungkapan Semitis ini secara harfiah berarti ‘menjawab dan berkata’, tetapi dalam bahasa Indonesia modern cukup diungkapkan secara alami sebagai ‘berkata’; konteks menunjukkan tanggapan Yesus terhadap laporan sebelumnya.
- source_word: ἐγένοντο
  choice: menjadi
  rationale: Mempertahankan nilai dasar verba ‘menjadi’, selaras dengan bentuk sumber dan tanpa menggantinya dengan kopula statis ‘adalah’.
- source_word: ἁμαρτωλοὶ παρὰ πάντας
  choice: lebih berdosa daripada semua
  rationale: παρά dalam konstruksi perbandingan menyatakan taraf yang melampaui; ‘lebih berdosa daripada semua’ menyampaikan perbandingan tersebut secara wajar.
- source_word: πεπόνθασιν
  choice: mengalami
  rationale: Bentuk perfektum πάσχω menunjuk pada penderitaan atau kejadian buruk yang telah menimpa mereka; ‘mengalami’ cocok dengan objek umum ‘hal-hal itu’ dan tidak menambahkan rincian yang tidak disebutkan.
theological_decisions:
- issue: Hubungan antara dosa dan penderitaan
  choice: Pertanyaan Yesus dipertahankan tanpa mengafirmasi bahwa penderitaan membuktikan tingkat keberdosaan yang lebih besar.
  alternative: Menyatakan langsung bahwa mereka dihukum karena lebih berdosa.
  rationale: Ayat berbentuk pertanyaan yang menantang dugaan para pendengar; terjemahan tidak boleh mengubahnya menjadi pernyataan teologis.
- issue: Nuansa ἐγένοντο
  choice: menjadi lebih berdosa
  alternative: lebih berdosa / adalah pendosa yang lebih besar
  rationale: Pilihan ini mempertahankan verba sumber ‘menjadi’ dan ketegangan ungkapannya, meskipun bahasa Indonesia yang lebih idiomatis dapat memakai bentuk statis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ dipakai untuk αὐτοῖς/Δοκεῖτε yang jamak dan sesuai bagi pembaca umum; ‘orang-orang Galilea lainnya’ memperjelas bahwa kelompok tersebut dibandingkan dengan sesama orang Galilea.
