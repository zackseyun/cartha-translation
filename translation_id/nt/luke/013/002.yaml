    rationale: “Lalu Yesus berkata” hanya menyatakan kelanjutan cerita, sedangkan bentuk partisipial ἀποκριθεὶς menunjukkan bahwa Yesus sedang menanggapi apa yang baru disampaikan. “Yesus menjawab mereka” menyampaikan fungsi wacana itu tanpa keharusan menerjemahkan formula secara kaku sebagai “menjawab dan berkata.”
  - severity: low
    issue: Aspek perfektum πεπόνθασιν tidak ditandai.
    rationale: “mengalami” tidak salah secara makna, tetapi “telah mengalami” lebih jelas mencerminkan bahwa hal-hal tersebut sudah menimpa mereka.
