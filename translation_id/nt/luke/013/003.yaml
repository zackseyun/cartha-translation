  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: id
  text: Tidak, Aku berkata kepada kalian; tetapi jika kalian tidak bertobat, kalian semua akan binasa demikian juga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan cara yang serupa.” “Demikian juga” dapat menunjuk pada penghakiman mendadak yang serupa, bukan dengan sendirinya pada cara kematian yang persis sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Tidak
  rationale: Menjawab dengan tegas anggapan tersirat dalam konteks sebelumnya tanpa menambahkan penekanan yang tidak dinyatakan.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan formula ujaran langsung dan sapaan personal; bentuk ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan anggapan yang baru saja ditolak.
- source_word: ἐὰν μὴ
  choice: jika ... tidak
  rationale: Mengungkapkan syarat negatif secara alami dalam susunan kalimat Indonesia.
- source_word: μετανοῆτε
  choice: bertobat
  rationale: Dalam konteks ini kata tersebut menunjuk pada perubahan pikiran dan arah hidup di hadapan Allah, bukan sekadar mempertimbangkan kembali suatu pendapat; 'bertobat' adalah padanan Indonesia yang ringkas dan lazim.
- source_word: πάντες
  choice: kalian semua
  rationale: Menjaga cakupan menyeluruh yang ditujukan kepada para pendengar Yesus.
- source_word: ὁμοίως
  choice: dengan cara yang serupa
  rationale: Mempertahankan perbandingan dengan peristiwa sebelumnya tanpa menuntut cara kematian yang persis sama.
- source_word: ἀπολεῖσθε
  choice: akan binasa
  rationale: Menjaga keluasan makna kehancuran atau kebinasaan dan bobot penghakiman tanpa mempersempitnya menjadi kematian jasmani saja atau secara eksplisit menjadi penghukuman kekal.
theological_decisions:
- issue: Cakupan makna ἀπολεῖσθε dalam peringatan Yesus
  choice: akan binasa
  alternative: akan mati; akan dihancurkan; akan dihukum untuk selama-lamanya
  rationale: Kata Yunani ini menyampaikan kebinasaan dalam penghakiman, tetapi ayat tersebut tidak merinci modus atau cakupannya. Terjemahan ini mempertahankan ketegangan teologis itu.
- issue: Makna pertobatan dalam μετανοῆτε
  choice: bertobat
  alternative: mengubah pikiran; berbalik
  rationale: '''Bertobat'' mencakup perubahan pikiran dan arah hidup yang dituntut dalam konteks panggilan Yesus, tanpa mereduksinya menjadi perubahan pendapat intelektual semata.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk memperjelas ὑμῖν dan πάντες. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ujaran Yesus. Kalimat dibagi dua agar tegas dan mudah dipahami.
