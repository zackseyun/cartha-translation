  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: id
  text: Siang malam kami berdoa dengan sangat sungguh-sungguh agar dapat bertemu muka dengan kalian dan melengkapi apa yang masih kurang dalam iman kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang belum lengkap dalam iman kalian.” Kata-kata Yunani ini juga dapat dipahami secara lebih luas sebagai hal-hal dalam iman mereka yang masih perlu dikuatkan atau disempurnakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Siang malam
  rationale: Ungkapan idiomatis bahasa Indonesia ini menyampaikan kegiatan yang terus-menerus atau berulang dengan wajar; urutan yang lazim dalam bahasa Indonesia dipilih tanpa mengubah makna Yunani.
- source_word: ὑπερεκπερισσοῦ
  choice: dengan sangat sungguh-sungguh
  rationale: Adverbia intensif ini menegaskan tingkat permohonan yang luar biasa. Pilihan ini alami dan mempertahankan daya intensifnya.
- source_word: δεόμενοι
  choice: kami berdoa
  rationale: Partisip Yunani menyatakan permohonan yang sungguh-sungguh. Subjek 'kami' dijelaskan dari konteks dan intensitasnya dibawa oleh frasa adverbial.
- source_word: εἰς τὸ ἰδεῖν
  choice: agar dapat bertemu muka
  rationale: Konstruksi ini menyatakan tujuan. 'Agar dapat' mengungkapkan tujuan permohonan, sedangkan 'bertemu muka' menyampaikan maksud idiomatis melihat wajah secara langsung.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: bertemu muka dengan kalian
  rationale: Secara harfiah merujuk pada 'wajah kalian', tetapi dalam konteks berarti hadir dan bertemu secara langsung. Ungkapan Indonesia ini mempertahankan citra muka sekaligus terdengar alami.
- source_word: καταρτίσαι
  choice: melengkapi
  rationale: Verba ini dapat berarti membenahi, memulihkan, memperlengkapi, atau menyempurnakan. Bersama 'apa yang masih kurang', 'melengkapi' mempertahankan gagasan membawa sesuatu menuju kecukupan tanpa menetapkan caranya.
- source_word: τὰ ὑστερήματα
  choice: apa yang masih kurang
  rationale: Bentuk jamak menunjuk berbagai kekurangan, tetapi ungkapan kolektif ini lebih alami dalam bahasa Indonesia dan tidak menyiratkan bahwa iman mereka sama sekali tidak ada.
- source_word: τῆς πίστεως ὑμῶν
  choice: dalam iman kalian
  rationale: Genitif paling wajar dipahami sebagai ranah tempat kekurangan itu terdapat. 'Iman' mempertahankan padanan utama πίστις dalam konteks kepercayaan mereka yang masih perlu dikuatkan.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konteks ini πίστις terutama menunjuk iman atau kepercayaan jemaat yang perlu dilengkapi, bukan terutama perilaku setia. Namun rentang leksikal istilah itu tidak disangkal.
- issue: Sifat kekurangan dalam iman jemaat
  choice: apa yang masih kurang dalam iman kalian
  alternative: apa yang belum lengkap pada iman kalian; kekurangan iman kalian
  rationale: Rumusan ini mengakui bahwa iman mereka nyata tetapi masih memerlukan penguatan atau penyempurnaan, tanpa menentukan apakah yang kurang adalah pengetahuan, keteguhan, atau praktik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak orang kedua secara jelas dan alami. Frasa 'bertemu muka' menerjemahkan idiom konkret Yunani tanpa menghasilkan ungkapan Indonesia yang kaku.
