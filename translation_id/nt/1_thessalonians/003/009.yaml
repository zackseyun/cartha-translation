  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: id
  text: Sebab, ucapan syukur apakah yang dapat kami berikan kembali kepada Allah mengenai kamu[a], atas segala sukacita yang kami rasakan karena kamu di hadapan Allah kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Bagaimana kami dapat cukup bersyukur kepada Allah karena kamu ...?” Secara lebih harfiah, bahasa Yunaninya berbunyi, “Ucapan syukur apakah yang dapat kami berikan kembali kepada Allah mengenai kamu ...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: ucapan syukur apakah
  rationale: Mempertahankan bentuk pertanyaan retoris dan nomina Yunani, sekaligus menyampaikan bahwa ucapan syukur mereka tidak memadai dibandingkan dengan besarnya sukacita itu.
- source_word: δυνάμεθα
  choice: dapat kami
  rationale: Padanan Indonesia yang wajar untuk kemampuan dalam pertanyaan retoris ini.
- source_word: ἀνταποδοῦναι
  choice: persembahkan kembali
  rationale: Mempertahankan gagasan memberi kembali sebagai tanggapan kepada Allah tanpa menimbulkan kesan sekuat kata 'membayar' bahwa manusia dapat melunasi utang kepada-Nya.
- source_word: περὶ ὑμῶν
  choice: tentang kamu
  rationale: Menandai acuan atau pokok ucapan syukur dan membedakannya dari δι’ ὑμᾶς, yang menyatakan sebab.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: atas segala sukacita
  rationale: Menyatakan dasar atau alasan ucapan syukur dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: ᾗ χαίρομεν
  choice: yang kami rasakan
  rationale: Menghasilkan bahasa Indonesia yang alami dengan menjadikan 'sukacita' sebagai sesuatu yang dialami; pengulangan etimologis χαρά–χαίρομεν tidak dipaksakan karena 'sukacita yang dengannya kami bersukacita' terasa kaku.
- source_word: δι’ ὑμᾶς
  choice: karena kamu
  rationale: Menyampaikan fungsi kausal διά dengan akusatif secara jelas.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: di hadapan Allah kita
  rationale: Mempertahankan metafora kehadiran ilahi dan bentuk inklusif 'Allah kita'.
theological_decisions:
- issue: Bahasa membalas ucapan syukur kepada Allah
  choice: persembahkan kembali kepada Allah
  alternative: membalas kepada Allah; mengucap syukur secukupnya kepada Allah
  rationale: Pilihan ini menjaga unsur timbal balik dalam ἀνταποδοῦναι, tetapi pertanyaan retorisnya menunjukkan ketidakmampuan untuk memberikan syukur yang sepadan, bukan hubungan transaksi dengan Allah.
- issue: Hubungan 'tentang kamu' dan 'karena kamu'
  choice: Kedua frasa dibedakan
  alternative: Keduanya diterjemahkan 'karena kamu' atau 'untuk kamu'
  rationale: περὶ ὑμῶν menyatakan pokok ucapan syukur, sedangkan δι’ ὑμᾶς menyatakan penyebab sukacita; pembedaan ini mempertahankan struktur makna teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Koma penutup dipertahankan karena kalimat Yunani berlanjut ke ayat 10. Bentuk 'kamu' dipakai untuk kelompok pembaca, sesuai pemakaian bahasa Indonesia modern; konteks surat membuat makna jamaknya jelas.
