  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: id
  text: Kiranya Tuhan membuat kasihmu semakin bertambah dan berlimpah kepada satu sama lain dan kepada semua orang[a], sebagaimana kami pun demikian terhadap kamu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap satu sama lain dan terhadap semua orang.”
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir dalam bahasa Yunani berbentuk eliptis, secara harfiah, “sama seperti kami juga kepada kamu.” Maksudnya dilengkapi dari frasa sebelumnya; dapat dipahami sebagai “sama seperti kami pun mengasihi kamu” atau “sama seperti kasih kami juga berlimpah kepada kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμᾶς δὲ
  choice: Kiranya ... kamu
  rationale: δέ melanjutkan doa-harapan dari konteks sebelumnya dan tidak perlu diterjemahkan sebagai pertentangan. Bentuk optatif pada verba-verba berikutnya dinyatakan secara alami dengan “Kiranya,” sedangkan ὑμᾶς dipertahankan sebagai objek dari tindakan Tuhan.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku dan wajar bagi κύριος sebagai gelar ilahi atau kristologis; terjemahan tidak menetapkan referennya lebih jauh daripada teks Yunani.
- source_word: πλεονάσαι
  choice: membuat kamu semakin bertambah
  rationale: Optatif aoris menyatakan harapan atau doa, dan dengan Tuhan sebagai subjek, konstruksi “membuat kamu ... bertambah” mempertahankan nuansa kausatif dalam kalimat.
- source_word: περισσεύσαι
  choice: dan berlimpah
  rationale: Kata ini menguatkan πλεονάσαι dengan gagasan kelimpahan. “Berlimpah” mempertahankan verba kedua tanpa meleburkan pasangan retoris tersebut.
- source_word: τῇ ἀγάπῃ
  choice: dalam kasih
  rationale: Dativus ini menyatakan bidang atau segi pertambahan tersebut. “Dalam kasih” alami dalam ragam bahasa rohani Indonesia dan mempertahankan ἀγάπη sebagai “kasih.”
- source_word: εἰς ἀλλήλους
  choice: kepada satu sama lain
  rationale: εἰς menunjukkan arah kasih. “Kepada satu sama lain” jelas dan alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: καὶ εἰς πάντας
  choice: dan kepada semua orang
  rationale: πάντας berbentuk maskulin jamak dan dalam konteks ini mengacu kepada orang-orang secara luas. “Semua orang” tidak membatasi cakupannya hanya kepada orang percaya.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: sama seperti kami juga kepada kamu
  rationale: Klausa Yunani ini eliptis dan tidak mengulangi verba atau kata “kasih.” Terjemahan utama mempertahankan elipsis itu karena tetap dapat dipahami dalam bahasa Indonesia dari klausa sebelumnya.
theological_decisions:
- issue: Referen ὁ κύριος
  choice: Diterjemahkan hanya sebagai “Tuhan.”
  alternative: Menjelaskannya secara eksplisit sebagai Yesus Kristus atau sebagai Allah.
  rationale: Ayat ini sendiri memakai gelar κύριος tanpa menyebut nama referennya. Bentuk yang tidak diperluas mempertahankan kemungkinan kristologis maupun rujukan ilahi yang dipahami dari konteks.
- issue: Cakupan πάντας
  choice: “semua orang,” tanpa pembatasan kelompok
  alternative: “semua orang percaya” atau kelompok tertentu
  rationale: Bentuk Yunani bersifat luas. Walaupun konteks membedakan kasih timbal balik dalam jemaat dari kasih yang lebih luas, terjemahan tidak membatasi “semua” kepada suatu kelompok.
- issue: Elipsis pada klausa terakhir
  choice: 'Elipsis dipertahankan: “sama seperti kami juga kepada kamu.”'
  alternative: Melengkapinya menjadi “sama seperti kami juga mengasihi kamu” atau “sama seperti kasih kami juga berlimpah kepada kamu.”
  rationale: Teks Yunani tidak menyatakan secara eksplisit verba yang harus dipasok. Mempertahankan elipsis menghindari pemilihan diam-diam antara “mengasihi” dan “berlimpah dalam kasih”; maksudnya tetap dapat ditangkap dari konteks dekat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Kiranya” menyampaikan optatif secara alami. Susunan “bertambah dan berlimpah dalam kasih” sengaja mempertahankan kedua verba Yunani, sedangkan elipsis pada penutup dipertahankan untuk menjaga ambiguitas asli.
