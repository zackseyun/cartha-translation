id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: id
  text: Karena itu, ketika aku pun tidak tahan lagi, aku mengutus untuk mengetahui iman kalian[a], karena khawatir si penggoda barangkali telah menggoda kalian dan jerih payah kami menjadi sia-sia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan kalian” atau “kepercayaan kalian”. Kata Yunani yang dipakai dapat mencakup nuansa-nuansa yang saling bertumpang tindih, bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Atau “tidak menghasilkan apa-apa” atau “percuma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menyatakan hubungan sebab-akibat dengan uraian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: κἀγὼ
  choice: aku
  rationale: Unsur καί tidak perlu dinyatakan tersendiri karena kesinambungannya sudah jelas; pronomina orang pertama mempertahankan suara pribadi Paulus.
- source_word: μηκέτι στέγων
  choice: ketika aku tidak tahan lagi
  rationale: Ungkapan idiomatis yang mempertahankan gagasan bahwa batas ketabahan telah tercapai.
- source_word: ἔπεμψα
  choice: aku mengutus orang
  rationale: Bahasa Indonesia lazimnya memerlukan sasaran tersirat bagi verba 'mengutus'. 'Orang' tidak menamai Timotius secara eksplisit, selaras dengan ayat Yunani ini yang tidak menyebut objeknya.
- source_word: εἰς τὸ γνῶναι
  choice: untuk mencari tahu tentang
  rationale: Menyampaikan tujuan pengutusan dan nuansa memperoleh informasi secara wajar.
- source_word: τὴν πίστιν ὑμῶν
  choice: iman kalian
  rationale: '''Iman'' merupakan padanan utama πίστις dalam konteks ini, sedangkan kemungkinan nuansa ''kesetiaan'' atau ''kepercayaan'' dipertahankan dalam catatan kaki.'
- source_word: μή πως
  choice: Aku khawatir jangan-jangan
  rationale: Mengungkapkan kekhawatiran yang terkandung dalam konstruksi Yunani secara alami; pemisahan menjadi kalimat baru menghindari susunan yang berat tanpa mengubah hubungan maknanya.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: si penggoda telah menggoda kalian
  rationale: Mempertahankan pengulangan akar kata antara pelaku dan tindakannya serta aspek ancaman yang telah mungkin terjadi.
- source_word: ὁ πειράζων
  choice: si penggoda
  rationale: Mempertahankan sebutan deskriptif dalam teks Yunani tanpa menggantinya secara eksplisit dengan nama 'Iblis'.
- source_word: ὁ κόπος ἡμῶν
  choice: jerih payah kami
  rationale: '''Jerih payah'' menyampaikan unsur kerja keras dan keletihan dalam κόπος.'
- source_word: εἰς κενὸν γένηται
  choice: menjadi sia-sia
  rationale: Padanan Indonesia yang alami untuk hasil tanpa guna atau tanpa buah, sambil mempertahankan verba 'menjadi' dari γένηται.
theological_decisions:
- issue: Makna πίστις dalam konteks kekhawatiran Paulus
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: '''Iman'' paling langsung menunjuk pada kelangsungan respons percaya jemaat kepada Injil. Namun, πίστις dapat mengandung nuansa kepercayaan atau kesetiaan, sehingga alternatif tersebut dicatat tanpa dipaksakan ke dalam teks utama.'
- issue: Identitas ὁ πειράζων
  choice: si penggoda
  alternative: Iblis; orang yang menggoda
  rationale: Konteks mengarah kepada Iblis, tetapi teks memakai gelar deskriptif, bukan nama diri. Terjemahan mempertahankan bentuk deskriptif dan tidak menyelesaikan rujukannya secara berlebihan.
- issue: Kemungkinan bahwa pencobaan telah terjadi
  choice: telah menggoda kalian
  alternative: mungkin telah menggoda kalian
  rationale: Bentuk aoris ἐπείρασεν berada dalam lingkup ungkapan kekhawatiran μή πως. 'Jangan-jangan' sudah menandai ketidakpastian, sedangkan 'telah menggoda' mempertahankan sudut pandang bahwa tindakan itu mungkin sudah berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. 'Aku' dan 'kalian' menjaga pembedaan antara penulis tunggal dan para penerima jamak. Kalimat Yunani yang panjang dibagi menjadi dua agar kekhawatiran Paulus terbaca alami, tanpa mengubah hubungan logisnya.
