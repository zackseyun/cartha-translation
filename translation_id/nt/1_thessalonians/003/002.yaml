source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: id
  text: dan kami mengutus Timotius, saudara kami dan rekan sekerja Allah[a] dalam Injil Mesias[b], untuk meneguhkan kalian dan mendorong kalian berkenaan dengan iman kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rekan yang bekerja bersama Allah.” Sejumlah naskah memuat susunan kata yang berbeda, antara lain “pelayan Allah.”
    reason: alternative_reading
  - marker: b
    text: 'Atau, “Kristus.” Yunani: “Kristus”; diterjemahkan “Mesias” di sini karena kata itu menonjol sebagai gelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: kami mengutus
  rationale: Bentuk aoristus diterjemahkan sebagai tindakan lampau sederhana; “mengutus” alami dalam konteks penugasan pelayanan.
- source_word: Τιμόθεον
  choice: Timotius
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: ἀδελφὸν ἡμῶν
  choice: saudara kami
  rationale: Mempertahankan metafora kekeluargaan dalam teks Yunani tanpa memperluasnya menjadi parafrasa seperti “saudara seiman kami”.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: rekan sekerja Allah
  rationale: Mempertahankan ungkapan kuat dan hubungan genitif dengan Allah tanpa melemahkannya menjadi “pelayan Allah” atau secara eksplisit menafsirkannya sebagai “orang yang bekerja bersama Allah”.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: dalam Injil Mesias
  rationale: “Dalam” menyatakan lingkup kegiatan Timotius. Bentuk “Injil Mesias” mempertahankan keluwesan genitif Yunani, yang dapat berkaitan dengan Injil dari, milik, atau tentang Mesias, tanpa memutuskan salah satunya.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konstruksi ini; “Mesias” menyampaikan makna gelarnya secara langsung kepada pembaca Indonesia.
- source_word: εἰς τὸ στηρίξαι ὑμᾶς
  choice: untuk meneguhkan kalian
  rationale: Konstruksi infinitif menyatakan tujuan. “Meneguhkan” menyampaikan gagasan membuat jemaat tetap kokoh, khususnya dalam tekanan.
- source_word: παρακαλέσαι
  choice: memberi kalian dorongan
  rationale: Mempertahankan nuansa dukungan dan penguatan pastoral tanpa mempersempit maknanya hanya menjadi penghiburan atau teguran.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: berkenaan dengan iman kalian
  rationale: Mencerminkan arti ὑπέρ sebagai “mengenai/berkenaan dengan” sambil tidak mengubahnya menjadi hubungan yang lebih khusus daripada yang dinyatakan teks.
- source_word: πίστεως
  choice: iman
  rationale: “Iman” adalah padanan paling langsung dalam konteks keteguhan orang percaya; “kesetiaan” akan menggeser fokus utama ayat.
theological_decisions:
- issue: Ungkapan συνεργὸν τοῦ θεοῦ
  choice: rekan sekerja Allah
  alternative: rekan yang bekerja bersama Allah; pelayan Allah
  rationale: Teks SBLGNT memuat συνεργὸν τοῦ θεοῦ. Terjemahan utama mempertahankan ketegangan teologis ungkapan tersebut dan tidak menggantinya dengan bacaan yang lebih lemah; perbedaan naskah dicatat dalam catatan kaki.
- issue: Gelar Χριστοῦ dalam εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός memiliki daya sebagai gelar. “Mesias” menyatakan makna gelar itu, sedangkan bentuk tradisional “Kristus” tetap dicatat sebagai alternatif.
- issue: Hubungan genitif dalam εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Injil Mesias
  alternative: Injil tentang Mesias; Injil dari Mesias
  rationale: Bentuk ringkas ini tidak menentukan secara sempit apakah genitif terutama objektif, subjektif, atau menyatakan kepunyaan/hubungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai agar bentuk jamak ὑμᾶς/ὑμῶν terlihat jelas. Struktur kalimat mengikuti kesinambungan ayat sumber, sehingga diakhiri dengan koma.
