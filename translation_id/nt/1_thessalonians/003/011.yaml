  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: id
  text: Kiranya Allah dan Bapa kita sendiri serta Tuhan kita Yesus mengarahkan perjalanan kami kepada kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, kata kerja ini berbentuk tunggal meskipun subjeknya mencakup “Allah dan Bapa kita” serta “Tuhan kita Yesus”. Kata ini juga dapat diterjemahkan “meluruskan jalan kami kepada kamu”.
    reason: cross_reference
lexical_decisions:
- source_word: Αὐτὸς
  choice: sendiri
  rationale: Pemakaian intensif αὐτός menekankan bahwa Allah dan Bapa kita secara pribadi bertindak; “sendiri” mempertahankan penekanan itu secara alami.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan ringan menuju doa atau harapan, bukan pertentangan tegas. Bentuk “Kiranya” sudah membuat peralihan itu wajar dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Allah dan Bapa kita
  rationale: Frasa ini menyatukan kedua sebutan pada satu pribadi dan mempertahankan urutan Yunani.
- source_word: καὶ ὁ κύριος ἡμῶν Ἰησοῦς
  choice: bersama Tuhan kita Yesus
  rationale: “Tuhan kita Yesus” mempertahankan gelar, kata ganti kepunyaan, dan nama dari teks Yunani. “Bersama” menyatakan bahwa kedua subjek secara bersama menjadi pelaku tanpa membuat deretan bahasa Indonesia terasa janggal.
- source_word: κατευθύναι
  choice: kiranya ... meluruskan
  rationale: Optatif aoristus menyatakan doa atau harapan. “Kiranya” menyampaikan modus tersebut, sedangkan “meluruskan” mempertahankan gambaran dasar tentang membuat jalan menjadi lurus atau terbuka menuju tujuan.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: jalan kami
  rationale: ὁδός dapat menunjuk jalan secara harfiah maupun perjalanan atau kesempatan untuk pergi. “Jalan kami” mempertahankan keluasan gambaran itu.
- source_word: πρὸς ὑμᾶς
  choice: menuju kamu
  rationale: πρός dengan akusatif menyatakan arah menuju jemaat Tesalonika; “menuju kamu” alami dalam konteks perjalanan.
theological_decisions:
- issue: Kata kerja tunggal dengan dua subjek yang dikoordinasikan, yaitu Allah dan Bapa serta Tuhan Yesus
  choice: Kedua subjek dipertahankan secara jelas sebagai pelaku bersama dari satu tindakan, dengan ungkapan “bersama Tuhan kita Yesus”.
  alternative: Menata ulang kalimat sehingga tindakan itu tampak terutama dilakukan oleh Allah saja, atau mengulang kata kerja untuk masing-masing subjek.
  rationale: Teks Yunani menempatkan Bapa dan Tuhan Yesus bersama-sama sebagai subjek dari satu kata kerja tunggal. Bahasa Indonesia tidak menandai jumlah pada kata kerja, sehingga ciri gramatikal itu dijelaskan dalam catatan tanpa mengurangi ketegangan teologis teks atau menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Kiranya” menyampaikan optatif secara alami; “meluruskan jalan” mempertahankan metafora sumber, sementara catatan memberi padanan yang lebih idiomatis. Kata ganti “kamu” dipakai untuk penerima jamak sesuai konteks surat.
