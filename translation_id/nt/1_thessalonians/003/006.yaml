id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: id
  text: Namun sekarang, Timotius baru saja datang kepada kami dari kalian dan membawa kabar baik kepada kami tentang iman dan kasih kalian[a], serta bahwa kalian selalu mengenang kami dengan baik dan rindu untuk bertemu dengan kami, sama seperti kami juga rindu untuk bertemu dengan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan kalian.” Kata Yunani pistis dapat berarti iman, kepercayaan, atau kesetiaan; teks utama memakai “iman.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Namun sekarang ... baru saja
  rationale: δὲ menandai peralihan yang berkontras ringan dari kecemasan sebelumnya, sedangkan ἄρτι menunjukkan kedatangan yang sangat baru; gabungan ini alami dalam bahasa Indonesia.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Timotius baru saja datang kepada kami dari kalian
  rationale: Konstruksi genitif absolut dialihkan menjadi klausa finit yang wajar; urutan asal dan tujuan dipertahankan.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: membawa kabar baik kepada kami
  rationale: Dalam konteks ini verba tersebut menunjuk pada laporan menggembirakan Timotius, bukan tindakan penginjilan kepada Paulus; 'kabar baik' tetap mempertahankan gema leksikal verba itu.
- source_word: τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν
  choice: iman dan kasih kalian
  rationale: Padanan baku dan lugas; kemungkinan nuansa 'kesetiaan' pada πίστις dipertahankan dalam catatan kaki.
- source_word: ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: kalian selalu mengenang kami dengan baik
  rationale: Ungkapan verbal ini lebih alami daripada nominalisme harfiah 'memiliki kenangan yang baik tentang kami' dan tetap mempertahankan makna positif μνεία ... ἀγαθήν.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: rindu bertemu dengan kami
  rationale: ἐπιποθέω menyatakan kerinduan yang kuat; dalam konteks hubungan timbal balik, 'bertemu dengan' terdengar lebih idiomatis daripada sekadar 'melihat'.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: sama seperti kami pun rindu bertemu dengan kalian
  rationale: Verba dan komplemennya yang tersirat dari klausa sebelumnya dinyatakan kembali demi kejelasan bahasa Indonesia tanpa mengubah perbandingan timbal balik.
theological_decisions:
- issue: Makna πίστις yang dapat menunjuk pada iman, kepercayaan, atau kesetiaan
  choice: iman kalian
  alternative: kesetiaan kalian
  rationale: Dalam konteks ini laporan Timotius terutama menyangkut iman jemaat yang tetap bertahan. Namun, nuansa keteguhan atau kesetiaan tetap mungkin, sehingga alternatif itu dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Pronomina 'kalian' dipakai karena semua bentuk ὑμεῖς dalam ayat ini bersifat jamak. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, sementara hubungan antarklausanya tetap dijaga.
