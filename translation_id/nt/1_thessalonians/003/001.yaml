  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: id
  text: Karena itu, ketika kami tidak sanggup lagi menahannya,[a] kami menganggap baik jika kami ditinggalkan di Atena hanya kami sendiri.[b]
