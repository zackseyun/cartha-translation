lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari konteks sebelumnya dan mempertahankan hubungan logis antarkalimat.
- source_word: μηκέτι στέγοντες
  choice: ketika kami tidak sanggup menahannya lebih lama lagi
  rationale: Ungkapan ini menyatakan batas kemampuan untuk menanggung tekanan batin; bentuk idiomatis ini wajar dalam bahasa Indonesia dan tidak menentukan secara eksplisit objek yang tidak disebutkan dalam bahasa Yunani.
- source_word: εὐδοκήσαμεν
  choice: kami menganggap baik
  rationale: Mempertahankan unsur penilaian positif dan kehendak dalam verba tersebut tanpa menyempitkannya menjadi sekadar keputusan pragmatis atau rasa senang.
- source_word: καταλειφθῆναι
  choice: untuk ditinggalkan
  rationale: Mempertahankan bentuk pasif infinitif aoristus; unsur 'di belakang' tidak dinyatakan secara wajib oleh konteks.
- source_word: ἐν Ἀθήναις
  choice: di Atena
  rationale: Padanan lokatif baku bagi nama kota Ἀθῆναι dalam bahasa Indonesia.
- source_word: μόνοι
  choice: sendirian
  rationale: Menggambarkan pihak yang berbicara sebagai berada tanpa rekan lain, sekaligus mempertahankan ketegangan antara bentuk jamak Yunani dan kemungkinan rekonstruksi historisnya.
theological_decisions:
- issue: Rujukan orang pertama jamak dan ketegangan tunggal-jamak dengan konteks yang lebih luas
  choice: Mempertahankan bentuk jamak 'kami' serta keterangan 'sendirian' sebagaimana terdapat dalam teks Yunani.
  alternative: Menafsirkannya sebagai jamak epistoler yang terutama menunjuk kepada Paulus, atau memparafrasakannya menjadi 'aku memutuskan untuk tinggal sendirian'.
  rationale: εὐδοκήσαμεν dan μόνοι berbentuk jamak. Terjemahan tidak seharusnya menyelesaikan perdebatan historis dengan mengubahnya menjadi bentuk tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'tidak sanggup menahannya' dipilih agar alami bagi pembaca umum, sedangkan 'menganggap baik' mempertahankan nuansa penilaian dan kehendak dari εὐδοκήσαμεν. Bentuk jamak tetap dipertahankan tanpa harmonisasi historis.
