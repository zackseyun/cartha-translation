base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: id
  text: supaya Ia meneguhkan hati kalian agar tidak bercela dalam kekudusan di hadapan Allah dan Bapa kita pada saat kedatangan Tuhan kita Yesus bersama semua yang kudus milik-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama semua orang kudus-Nya.” Ungkapan Yunani yang diterjemahkan “semua yang kudus” dalam konteks ini dapat merujuk kepada umat yang kudus, para malaikat, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: supaya Dia meneguhkan
  rationale: Konstruksi preposisi dengan infinitif berartikel menyatakan tujuan atau hasil yang mengalir dari ayat sebelumnya. Klausa finit dengan “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: ὑμῶν τὰς καρδίας
  choice: hati kalian
  rationale: “Hati” mempertahankan gambaran Paulus mengenai batin atau pusat kehidupan manusia, bukan sekadar perasaan. “Kalian” secara alami menandai orang kedua jamak.
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: tidak bercela dalam kekudusan
  rationale: Ungkapan ini mempertahankan nuansa bebas dari tuduhan yang sah sekaligus keadaan atau kualitas kekudusan, tanpa mengubahnya menjadi perintah.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: di hadapan Allah dan Bapa kita
  rationale: “Di hadapan” menyampaikan gagasan berdiri dalam pandangan Allah, sedangkan struktur “Allah dan Bapa kita” mempertahankan koordinasi frasa Yunani.
- source_word: ἐν τῇ παρουσίᾳ
  choice: pada saat kedatangan
  rationale: Dalam konteks eskatologis, παρουσία menunjuk pada kedatangan atau kehadiran Tuhan kelak. “Pada saat kedatangan” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Tuhan kita Yesus
  rationale: Gelar κύριος diterjemahkan “Tuhan” dan nama Ἰησοῦ mengikuti bentuk baku Indonesia.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: bersama semua yang kudus milik-Nya
  rationale: Nominalisasi “yang kudus” mempertahankan keluasan ἅγιοι tanpa langsung membatasinya pada manusia atau malaikat; “milik-Nya” menyatakan αὐτοῦ secara jelas.
theological_decisions:
- issue: Rujukan πάντων τῶν ἁγίων αὐτοῦ
  choice: semua yang kudus milik-Nya
  alternative: semua orang kudus-Nya; semua malaikat kudus-Nya
  rationale: Dalam latar eskatologis ini, frasa Yunani dapat dipahami sebagai orang-orang kudus, para malaikat, atau keduanya. Teks utama mempertahankan ketaksaan tersebut dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. “Kalian” dipakai untuk menyatakan bentuk jamak secara jelas. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia, sementara susunan kalimat tetap dekat dengan alur teks Yunani.
