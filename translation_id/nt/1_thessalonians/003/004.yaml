source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: id
  text: Sebab, ketika kami bersama kalian, kami berulang kali memberitahukan sebelumnya kepada kalian bahwa kami akan mengalami penderitaan[a], sebagaimana memang terjadi dan kalian ketahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditindas,” “mengalami kesusahan,” atau “mengalami penganiayaan.” Kata Yunani ini dapat merujuk pada tekanan, kesusahan, atau penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya. Nuansa penegasan καί tetap terasa melalui susunan keseluruhan tanpa terjemahan harfiah yang kaku seperti 'sebab bahkan'.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: ketika kami masih bersama kalian
  rationale: Ungkapan ini secara idiomatis menunjukkan keberadaan Paulus dan rekan-rekannya bersama jemaat Tesalonika. 'Masih' wajar dalam bahasa Indonesia untuk menandai masa lampau ketika mereka berada di sana.
- source_word: προελέγομεν ὑμῖν
  choice: kami sudah berulang kali mengatakan kepada kalian
  rationale: Bentuk imperfek mendukung tindakan yang berlangsung atau berulang, sedangkan unsur προ- menyatakan bahwa hal itu dikatakan sebelumnya. 'Sudah' menyampaikan unsur pendahuluan secara alami dalam konteks.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: bahwa kami akan mengalami penderitaan
  rationale: μέλλομεν menunjukkan sesuatu yang akan atau sudah diperkirakan akan terjadi. θλίβεσθαι mencakup tekanan, kesusahan, dan penderitaan tanpa harus dibatasi khusus pada penganiayaan atau kesengsaraan eskatologis.
- source_word: καθὼς καὶ ἐγένετο
  choice: Dan memang itulah yang terjadi
  rationale: καθώς menegaskan kesesuaian antara pemberitahuan sebelumnya dan kejadian nyata, sementara καί memberi penegasan. Dalam bahasa Indonesia, 'memang' menyampaikan penegasan itu secara idiomatis.
- source_word: καὶ οἴδατε
  choice: seperti yang kalian ketahui
  rationale: Terjemahan ini secara alami menyatakan bahwa para pembaca mengetahui terjadinya penderitaan tersebut, meskipun secara sintaksis bahasa Yunani memakai koordinasi 'dan kalian tahu'.
theological_decisions:
- issue: Sifat penderitaan dalam θλίβεσθαι
  choice: penderitaan dalam arti umum yang dapat mencakup tekanan, kesusahan, atau penganiayaan
  alternative: penganiayaan secara khusus; kesengsaraan dalam arti teknis atau eskatologis
  rationale: Konteks mencakup perlawanan dan kesukaran, tetapi verba Yunani tidak dengan sendirinya membatasi penderitaan pada penganiayaan tertentu ataupun kesengsaraan eskatologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan orang kedua jamak dalam teks sumber tetap jelas. Kalimat dibagi dua demi kelancaran, tanpa mengubah hubungan logisnya.
