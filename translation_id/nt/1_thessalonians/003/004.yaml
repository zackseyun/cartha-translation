revisions:
- from: Sebab, ketika kami masih bersama kalian, kami sudah berulang kali mengatakan kepada kalian bahwa kami akan mengalami penderitaan[a]. Dan memang itulah yang terjadi, seperti yang kalian ketahui.
  to: Sebab, ketika kami bersama kalian, kami berulang kali memberitahukan sebelumnya kepada kalian bahwa kami akan mengalami penderitaan[a], sebagaimana memang terjadi dan kalian ketahui.
  rationale: 'Revisi menghapus tambahan nuansa dalam “masih” dan secara eksplisit menyatakan unsur ‘lebih dahulu’ pada προελέγομεν. Susunan akhir dipertahankan dekat dengan καθώς καὶ ἐγένετο καὶ οἴδατε: penderitaan itu terjadi sebagaimana telah diberitahukan dan diketahui oleh para penerima. Makna umum θλίβεσθαι serta jangkar catatan kaki dipertahankan.'
