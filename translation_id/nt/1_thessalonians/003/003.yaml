lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: supaya tidak seorang pun goyah
  rationale: Infinitif berartikel ini menyatakan tujuan/hasil yang terkait dengan ayat sebelumnya. Dalam konteks penderitaan, verba langka σαίνεσθαι paling wajar menunjuk pada keadaan diguncangkan, dibuat gelisah, atau dibuat tidak teguh; “goyah” alami dan ringkas dalam bahasa Indonesia.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: karena berbagai kesusahan ini
  rationale: θλίψεις menunjuk pada tekanan, kesusahan, atau penindasan. Dengan verba “goyah,” ἐν secara idiomatis dapat menyatakan keadaan atau penyebab; “karena” menghasilkan bahasa Indonesia yang alami. Kata “berbagai” membuat bentuk jamak terasa tanpa menyiratkan bahwa kesusahan itu berbeda jenis secara tegas.
- source_word: αὐτοὶ
  choice: kamu sendiri
  rationale: Pronomina ini bersifat emfatis, sehingga “kamu sendiri” mempertahankan penekanannya.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” tepat dan bermartabat dalam konteks ini.
- source_word: οἴδατε
  choice: tahu
  rationale: Walaupun berbentuk perfek, οἴδατε berfungsi dengan arti kini dan secara alami diterjemahkan “tahu.”
- source_word: εἰς τοῦτο
  choice: untuk mengalami hal itu
  rationale: Frasa ini menunjuk kembali kepada kesusahan yang baru disebut. Penambahan “mengalami” diperlukan agar konstruksi Indonesia jelas, tetapi tidak menentukan secara berlebihan siapa pelaku penetapannya.
- source_word: κείμεθα
  choice: kita ditetapkan
  rationale: κεῖμαι secara harfiah berarti berada atau ditempatkan, dan dalam idiom ini menyampaikan gagasan ditetapkan atau diperuntukkan. “Ditetapkan” mempertahankan bentuk pasif dan bobot pernyataannya tanpa memperkenalkan sistem predestinasi tertentu.
theological_decisions:
- issue: Hubungan orang percaya dengan penderitaan dalam εἰς τοῦτο κείμεθα
  choice: kita ditetapkan untuk mengalami hal itu
  alternative: kita ditentukan untuk itu; kita ditempatkan untuk itu
  rationale: Ungkapan tersebut menyatakan bahwa kesusahan merupakan bagian yang telah ditetapkan dalam kehidupan para pengikut Kristus, tetapi tidak merinci pelaku ataupun suatu doktrin predestinasi yang lebih luas. Terjemahan ini mempertahankan bobot teologis dan bentuk pasif teks tanpa menyelesaikan ketegangan itu secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. “Goyah” dipilih karena mudah dipahami dan sesuai dengan kekhawatiran Paulus tentang keteguhan iman. “Kesusahan” lebih alami bagi pembaca umum daripada “tribulasi,” sedangkan alternatif yang lebih kuat dipertahankan dalam catatan kaki.
