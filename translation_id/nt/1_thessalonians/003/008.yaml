  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: id
  text: Sebab sekarang kami hidup[a], jika kamu berdiri teguh di dalam Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kami hidup” kemungkinan merupakan ungkapan retoris yang berarti bahwa Paulus dan rekan-rekannya memperoleh semangat atau daya hidup yang baru, bukan sekadar bahwa mereka masih hidup secara jasmani.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di dalam Tuhan” dapat menunjuk pada keteguhan dalam lingkup hubungan atau persatuan dengan Tuhan.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini, kata penghubung tersebut memberi penjelasan atau alasan bagi penghiburan Paulus pada ayat sebelumnya. “Sebab” menyampaikan hubungan itu secara wajar tanpa menambah penafsiran.
- source_word: νῦν
  choice: sekarang
  rationale: Keterangan waktu ini dipertahankan secara langsung untuk menekankan keadaan Paulus saat ini setelah menerima kabar tentang jemaat Tesalonika.
- source_word: ζῶμεν
  choice: kami hidup
  rationale: Bentuk harfiah ungkapan Yunani dipertahankan. Dalam konteks, ungkapan ini kemungkinan bersifat retoris dan menyatakan semangat atau daya hidup yang diperbarui, tetapi penjelasan itu tidak dimasukkan ke dalam teks utama.
- source_word: ἐὰν
  choice: jika
  rationale: “Jika” mempertahankan bentuk bersyarat dalam bahasa Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ὑμεῖς
  choice: kamu
  rationale: Kata ganti ini merujuk kepada jemaat Tesalonika sebagai satu kelompok. “Kamu” merupakan bentuk baku yang jelas dalam bahasa Indonesia modern.
- source_word: στήκετε
  choice: berdiri teguh
  rationale: Ungkapan ini secara alami menyampaikan keteguhan atau ketabahan yang berkelanjutan. Bahasa Indonesia tidak memerlukan bentuk progresif tersendiri untuk mencerminkan aspek tersebut.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus beserta keluasan maknanya, yaitu keteguhan dalam lingkup hubungan dengan Tuhan, tanpa mempersempitnya menjadi suatu rumusan doktrinal tertentu.
theological_decisions:
- issue: Makna ungkapan “sekarang kami hidup”
  choice: Mempertahankan ungkapan harfiah sebagai pernyataan retoris tentang semangat atau daya hidup yang diperbarui
  alternative: Menerjemahkannya secara eksplisit sebagai “sekarang kami merasa hidup kembali” atau memahaminya hampir secara harfiah sebagai ketergantungan hidup Paulus pada keteguhan mereka
  rationale: Konteks menunjukkan kelegaan dan penghiburan pastoral, tetapi teks Yunani tetap berbunyi “kami hidup.” Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menjelaskan kemungkinan daya retorisnya.
- issue: Makna “di dalam Tuhan”
  choice: Mempertahankan rumusan yang luas mengenai keteguhan dalam hubungan dengan Tuhan
  alternative: “bersatu dengan Tuhan” atau “setia kepada Tuhan”
  rationale: Ungkapan Paulus ini kaya secara teologis dan tidak perlu dipersempit kepada doktrin denominasi tertentu atau kepada satu parafrasa relasional saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat ringkas agar mempertahankan kekuatan retoris teks Yunani. “Kami” membedakan Paulus dan rekan-rekannya dari para penerima surat; “kamu” digunakan sebagai sapaan kepada jemaat secara kolektif.
