  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: id
  text: Karena itu, Saudara-saudara[a], di tengah segala kesesakan dan penderitaan kami, kami terhibur sehubungan dengan kalian melalui iman kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” adalah sapaan yang biasa dipakai Paulus kepada jemaat dan dapat mencakup seluruh komunitas orang percaya.
    reason: cultural_note
  - marker: b
    text: Atau “kesetiaan kalian”. Kata Yunani pistis dapat berarti iman, kepercayaan, atau kesetiaan; di sini kemungkinan juga mencakup keteguhan jemaat Tesalonika dalam iman mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini secara alami menghubungkan penghiburan Paulus dan rekan-rekannya dengan kabar yang disebutkan sebelumnya.
- source_word: παρεκλήθημεν
  choice: kami terhibur
  rationale: Bentuk pasif παρακαλέω di sini menunjuk pada penghiburan atau penguatan yang mereka terima melalui kabar tentang jemaat Tesalonika.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini mempertahankan bentuk kekerabatan yang lazim dipakai Paulus; dalam konteks jemaat, cakupannya dapat meliputi seluruh komunitas orang percaya.
- source_word: ἐφ’ ὑμῖν
  choice: mengenai kalian
  rationale: Frasa ini menyatakan pihak yang menjadi pokok penghiburan mereka dan tidak menyiratkan bahwa jemaat adalah penyebab penderitaan mereka.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: di tengah segala kesesakan dan penderitaan kami
  rationale: Ungkapan 'di tengah' menyampaikan keadaan sulit yang sedang mereka alami; kedua nomina penderitaan tetap dipertahankan.
- source_word: ἀνάγκῃ
  choice: kesesakan
  rationale: Dalam pasangan dengan θλίψει, kata ini merujuk pada tekanan atau keadaan sulit, bukan sekadar kebutuhan atau keharusan.
- source_word: θλίψει
  choice: penderitaan
  rationale: Pilihan ini menyampaikan beratnya kesukaran yang dialami dengan bahasa Indonesia yang jelas dan wajar.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: oleh iman kalian
  rationale: διά dengan genitif menyatakan sarana atau dasar penghiburan. 'Oleh' terdengar alami dalam bahasa Indonesia sambil mempertahankan hubungan tersebut.
- source_word: πίστεως
  choice: iman
  rationale: Makna utama πίστις di sini adalah iman atau kepercayaan yang terus dipegang jemaat, meskipun nuansa kesetiaan atau keteguhan juga mungkin terkandung.
theological_decisions:
- issue: Makna πίστις ketika keteguhan jemaat juga tersirat
  choice: iman
  alternative: kesetiaan; keteguhan iman
  rationale: Teks berbicara tentang kepercayaan jemaat yang tetap bertahan. Terjemahan utama mempertahankan 'iman', sedangkan kemungkinan nuansa kesetiaan dijelaskan dalam catatan agar ambiguitas leksikal tidak dihapus.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk sumber dipertahankan dengan sapaan Indonesia yang lazim dan bermartabat, sementara cakupan komunalnya dijelaskan dalam catatan tanpa membatasi sapaan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Kata ganti 'kalian' dipakai untuk menandai bentuk jamak ὑμῖν/ὑμῶν secara jelas. Susunan frasa menjaga agar 'mengenai kalian' berkaitan dengan penghiburan, bukan dengan kesesakan dan penderitaan.
