  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: id
  text: Sebab kami tidak pernah datang dengan kata-kata sanjungan[a], sebagaimana kamu ketahui, ataupun dengan dalih untuk mencari keuntungan[b]—Allah adalah saksi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan sanjungan”; secara harfiah, “dalam perkataan sanjungan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kedok keserakahan” atau “dengan dalih yang didorong oleh ketamakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Sebab kami tidak pernah
  rationale: γάρ menghubungkan ayat ini dengan pembelaan pada ayat sebelumnya, sedangkan οὔτε bersama ποτέ menyatakan penyangkalan yang tegas sepanjang waktu. Dalam bahasa Indonesia, bentuk alami untuk klausa pertama adalah “tidak pernah”, lalu οὔτε yang kedua diterjemahkan “ataupun”.
- source_word: ἐν λόγῳ κολακείας
  choice: dengan kata-kata sanjungan
  rationale: λόγος di sini menunjuk pada ujaran atau cara berbicara, bukan sekadar satu kata, sedangkan κολακεία berarti sanjungan yang dimaksudkan untuk mengambil hati. Ungkapan ini mempertahankan nuansa instrumental ἐν dengan bahasa Indonesia yang alami.
- source_word: ἐγενήθημεν
  choice: datang
  rationale: Dalam konteks kunjungan para pemberita Injil ke Tesalonika, bentuk γίνομαι ini secara idiomatis menggambarkan bagaimana mereka hadir atau tampil di tengah jemaat. “Datang” sesuai dengan konteks kunjungan tanpa memaksakan arti harfiah “menjadi”.
- source_word: καθὼς οἴδατε
  choice: seperti yang kamu ketahui
  rationale: Terjemahan langsung dan alami yang mempertahankan seruan Paulus kepada pengetahuan para penerima surat sebagai bukti mengenai perilakunya.
- source_word: ἐν προφάσει πλεονεξίας
  choice: dengan dalih yang menutupi keserakahan
  rationale: πρόφασις dapat berarti dalih, kepura-puraan, atau kedok; πλεονεξία adalah hasrat serakah untuk memperoleh lebih banyak. Rumusan ini menyampaikan gagasan bahwa keserakahan dapat disembunyikan di balik alasan lahiriah, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: θεὸς μάρτυς
  choice: Allah adalah saksi
  rationale: Ungkapan ringkas ini mempertahankan seruan khidmat kepada Allah sebagai saksi dan tidak menambahkan kata ganti kepunyaan yang tidak dinyatakan dalam teks Yunani.
theological_decisions:
- issue: Cakupan penyangkalan Paulus mengenai cara dan motif pelayanannya
  choice: Ayat ini menyangkal penggunaan sanjungan dalam perkataan dan keserakahan yang disembunyikan di balik dalih.
  alternative: Ayat ini dipahami sebagai penolakan terhadap segala seni retorika, atau dipersempit hanya menjadi penyangkalan eksploitasi keuangan.
  rationale: Teks Yunani secara khusus menyebut κολακεία dan πλεονεξία. Terjemahan mempertahankan dua tuduhan konkret itu tanpa menjadikannya penolakan terhadap semua retorika dan tanpa membatasi keserakahan hanya pada uang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kamu” dipakai sebagai sapaan jamak sesuai konteks surat kepada jemaat; bahasa Indonesia tidak menandai jumlah pada pronomina ini. Tanda pisah mempertahankan tekanan retoris pada seruan penutup.
