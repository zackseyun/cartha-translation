revisions:
- from: Walaupun sebagai rasul-rasul Mesias kami dapat menunjukkan kewibawaan kami,[a] kami justru bersikap lembut di tengah-tengah kamu, seperti seorang ibu yang menyusui merawat anak-anaknya sendiri dengan penuh kasih.[b]
  to: Walaupun sebagai rasul-rasul Mesias kami dapat menggunakan kewibawaan kami,[a] kami justru menjadi lemah lembut di antara kamu, seperti seorang ibu yang menyusui mengasuh anak-anaknya sendiri dengan penuh kasih.[b]
  rationale: 'Revisi membatasi perubahan pada dua hal yang diperlukan demi kesetiaan sumber: ungkapan tentang ‘bobot’ kerasulan tidak lagi dipersempit menjadi tindakan ‘menunjukkan’ kewibawaan, dan γίνομαι diterjemahkan dengan “menjadi”. Istilah Mesias, gambaran ibu menyusui, penekanan “anak-anaknya sendiri”, serta semua jangkar catatan kaki dipertahankan.'
  reviewer_model: gpt-5.6-terra
