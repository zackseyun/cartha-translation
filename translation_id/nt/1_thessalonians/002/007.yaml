  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: id
  text: Walaupun sebagai rasul-rasul Mesias kami dapat menggunakan kewibawaan kami,[a] kami justru menjadi lemah lembut di antara kamu, seperti seorang ibu yang menyusui mengasuh anak-anaknya sendiri dengan penuh kasih.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Yunani secara harfiah berkaitan dengan “bobot”; dapat juga berarti “mengajukan tuntutan” atau “menjadi beban bagi kamu” sebagai rasul-rasul Mesias. Terjemahan tradisional: “rasul-rasul Kristus.”'
    reason: Mempertahankan metafora dan keluasan makna ἐν βάρει εἶναι, serta mencatat padanan tradisional untuk Χριστοῦ.
  - marker: b
    text: Atau “seperti seorang pengasuh” atau “seorang ibu susu”; gambarannya ialah pemeliharaan lembut oleh seorang perempuan yang menyusui dan mengasuh anak.
    reason: τροφός dapat merujuk kepada ibu yang menyusui atau perempuan lain yang menyusui dan mengasuh seorang anak.
lexical_decisions:
- source_word: δυνάμενοι
  choice: walaupun ... kami dapat
  rationale: Partisip ini bernuansa konsesif karena dikontraskan dengan ἀλλά; susunan ini alami dalam bahasa Indonesia.
- source_word: ἐν βάρει εἶναι
  choice: menunjukkan kewibawaan kami
  rationale: Secara harfiah berarti 'berada dalam bobot'. Dalam konteks kerasulan, ungkapan ini kemungkinan menunjuk pada penggunaan kedudukan atau wibawa, bukan semata-mata menjadi beban keuangan; catatan kaki mempertahankan metafora dan kemungkinan lain.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: sebagai rasul-rasul Mesias
  rationale: Χριστοῦ berfungsi sebagai gelar dan diterjemahkan 'Mesias'; frasa Indonesia ini menyatakan kapasitas mereka sebagai rasul yang menjadi milik atau utusan Mesias.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: kami justru bersikap
  rationale: Kata 'justru' menyampaikan kontras yang kuat dengan hak yang dapat mereka gunakan; 'bersikap' menghasilkan ungkapan Indonesia yang alami bersama 'lembut', meski γίνομαι secara harfiah adalah 'menjadi'.
- source_word: ἤπιοι
  choice: lembut
  rationale: Padanan langsung dan wajar untuk sifat lemah lembut atau tidak keras.
- source_word: ἐν μέσῳ ὑμῶν
  choice: di tengah-tengah kamu
  rationale: Mempertahankan gambaran kehadiran di tengah komunitas dengan bahasa Indonesia yang jelas.
- source_word: ὡς ἐὰν τροφὸς
  choice: seperti seorang ibu yang menyusui
  rationale: τροφός menunjuk pada perempuan yang menyusui dan mengasuh; pilihan ini menyampaikan citra keibuan secara jelas tanpa kesan klinis dari 'perawat'.
- source_word: θάλπῃ
  choice: merawat ... dengan penuh kasih
  rationale: Kata ini secara harfiah berkaitan dengan menghangatkan dan secara kiasan berarti memelihara dengan lembut; frasa ini menyampaikan kepedulian hangat tersebut.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: anak-anaknya sendiri
  rationale: Menerjemahkan τέκνα sebagai 'anak-anak' dan mempertahankan penekanan refleksif ἑαυτῆς dengan 'sendiri'.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός berfungsi sebagai gelar; 'Mesias' mempertahankan makna gelarnya, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Makna kewenangan kerasulan dalam ἐν βάρει εἶναι
  choice: menunjukkan kewibawaan kami
  alternative: menjadi beban bagi kamu
  rationale: Konteks memungkinkan makna menggunakan bobot kedudukan atau mengajukan tuntutan sebagai rasul. Terjemahan utama tidak membatasinya pada beban keuangan, sementara catatan kaki menjaga ambiguitas ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, hangat, dan bermartabat. Bentuk 'kamu' dipertahankan untuk sapaan jamak kepada jemaat. Susunan catatan kaki ditempatkan langsung sesudah frasa terkait dan semua penanda dalam teks memiliki catatan yang sesuai.
