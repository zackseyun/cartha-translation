  text: Sebab seruan[a] kami tidak bersumber dari kesesatan[b] atau kecemaran dan tidak dilakukan dengan tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “nasihat” atau “ajakan.” Kata Yunani παράκλησις dapat berarti seruan, nasihat, ajakan, atau dorongan, tergantung konteksnya.'
