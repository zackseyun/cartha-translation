lexical_decisions:
- source_word: παράκλησις
  choice: seruan
  rationale: Dalam konteks pembelaan Paulus atas pelayanannya, “seruan” mencakup permohonan atau ajakan yang sungguh-sungguh kepada para pendengar tanpa membatasinya pada penghiburan atau sekadar isi berita.
- source_word: πλάνης
  choice: kesesatan
  rationale: Dengan ἐκ, kata ini menunjuk pada sumber seruan itu. “Kesesatan” mempertahankan cakupan makna kekeliruan atau kepalsuan tanpa menyamakannya begitu saja dengan δόλος, yang lebih jelas menunjuk pada tipu daya yang disengaja.
- source_word: ἀκαθαρσίας
  choice: kecemaran
  rationale: “Kecemaran” mempertahankan arti moral yang luas dan tidak mempersempit kata ini hanya pada kenajisan seksual, sebab ayat ini tidak menyebut bentuk kecemaran tertentu.
- source_word: δόλῳ
  choice: tipu daya
  rationale: Ungkapan ἐν δόλῳ menyatakan cara atau sarana. “Dengan tipu daya” menyampaikan gagasan kelicikan atau penipuan yang disengaja dalam bahasa Indonesia modern.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: bersumber dari ... ataupun ... dan ... dengan ...
  rationale: Terjemahan ini membedakan ἐκ/ἐξ yang menunjukkan sumber dari ἐν yang menunjukkan cara, sambil menjaga kalimat tetap alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: “Sebab” mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan pernyataan sebelumnya.
theological_decisions:
- issue: Cakupan ἀκαθαρσία dalam penyangkalan Paulus
  choice: Diterjemahkan secara luas sebagai “kecemaran” tanpa menentukan bahwa yang dimaksud khususnya adalah dosa seksual.
  alternative: kenajisan seksual; ketidakmurnian
  rationale: Walaupun kata ini dapat memiliki nuansa seksual dalam pemakaian Paulus, teks ini sendiri tidak memperinci bentuk kecemaran tersebut. Pilihan yang luas menghindari memasukkan tuduhan khusus yang tidak dinyatakan oleh bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Seruan” dipilih sebagai istilah yang mudah dipahami namun tetap cukup luas; “kecemaran” menjaga nuansa moral tanpa mempersempit makna. Perbedaan antara sumber (ἐκ/ἐξ) dan cara (ἐν) dinyatakan secara eksplisit.
