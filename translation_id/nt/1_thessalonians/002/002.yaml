  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: id
  text: Namun, setelah kami lebih dahulu menderita dan diperlakukan secara hina[a], seperti yang kamu ketahui, di Filipi, kami berani di dalam Allah kita untuk menyampaikan Injil Allah kepada kamu dalam pergumulan yang besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihina”, “diperlakukan secara keji”, atau “diperlakukan sewenang-wenang”. Kata Yunani ini mencakup gagasan perlakuan yang angkuh dan penghinaan terbuka.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah konflik yang hebat”, “dalam banyak pergumulan”, atau “dengan banyak perlawanan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan kuat dengan gagasan sebelumnya; dalam konteks ini lebih tegas daripada sekadar 'tetapi'.
- source_word: προπαθόντες
  choice: meskipun sebelumnya kami telah menderita
  rationale: Partisip aoris menunjukkan penderitaan yang mendahului tindakan utama; 'sebelumnya' menyampaikan unsur προ-, sedangkan 'meskipun' secara alami menghubungkannya dengan keberanian yang menyusul.
- source_word: ὑβρισθέντες
  choice: diperlakukan dengan hina
  rationale: Mencakup perlakuan yang sewenang-wenang, menghina, dan mempermalukan, bukan hanya penghinaan lisan.
- source_word: καθὼς οἴδατε
  choice: seperti yang kamu ketahui
  rationale: Ungkapan parentetis yang langsung dan wajar untuk merujuk pada pengetahuan para penerima surat.
- source_word: ἐν Φιλίπποις
  choice: di Filipi
  rationale: Bentuk baku nama tempat itu dalam bahasa Indonesia.
- source_word: ἐπαρρησιασάμεθα
  choice: kami berani
  rationale: Menyatakan keberanian atau keterusterangan, sementara tindakan berbicara dinyatakan secara tersendiri oleh infinitif λαλῆσαι.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: di dalam Allah kita
  rationale: Mempertahankan ungkapan Yunani yang dapat menunjukkan lingkup atau dasar relasional keberanian itu tanpa mempersempitnya menjadi sarana semata.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: untuk menyampaikan ... kepada kamu
  rationale: '''Menyampaikan'' terdengar alami dalam bahasa Indonesia untuk tindakan mengomunikasikan isi berita, tanpa menambahkan gagasan teknis yang tidak dinyatakan oleh verba tersebut.'
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injil Allah
  rationale: Mempertahankan ungkapan genitif Paulus dan istilah 'Injil' yang lazim serta bermartabat.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: di tengah pergumulan yang berat
  rationale: ἀγών dapat berarti pergumulan, perjuangan, atau konflik; pilihan ini mempertahankan cakupan yang lebih luas daripada secara eksplisit menjadikannya hanya perlawanan dari pihak luar.
theological_decisions:
- issue: Makna ἐν τῷ θεῷ ἡμῶν
  choice: di dalam Allah kita
  alternative: oleh Allah kita; dengan keberanian yang berasal dari Allah kita
  rationale: Terjemahan ini mempertahankan kemungkinan makna lingkup, hubungan, atau dasar keberanian para rasul dan tidak membatasi frasa tersebut pada sebab instrumental.
- issue: Sifat ἀγών dalam pelayanan Paulus
  choice: pergumulan yang berat
  alternative: perlawanan yang hebat; konflik besar
  rationale: Kata Yunani dapat menunjuk perjuangan berat maupun konflik atau perlawanan. Pilihan utama tidak memastikan bahwa seluruh pergumulan itu semata-mata eksternal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan penderitaan terdahulu, keberanian di dalam Allah, penyampaian Injil, dan keadaan pergumulan. Sapaan jamak Yunani diterjemahkan dengan 'kamu', yang tidak menandai jumlah dalam bahasa Indonesia modern.
