  to: Namun, setelah kami lebih dahulu menderita dan diperlakukan secara hina[a], seperti yang kamu ketahui, di Filipi, kami berani di dalam Allah kita untuk menyampaikan Injil Allah kepada kamu dalam pergumulan yang besar[b].
  rationale: Revisi menghapus konsesi tambahan pada "meskipun", menerjemahkan urutan temporal προπαθόντες secara lebih netral dengan "setelah kami lebih dahulu menderita", dan mengganti "yang berat" dengan "yang besar" agar lebih dekat dengan πολλῷ tanpa memutuskan apakah ἀγών terutama perjuangan batin, konflik, atau perlawanan luar. Letak "di Filipi" dipertahankan setelah sisipan "seperti yang kamu ketahui" untuk mengikuti cakupan informasi sumber secara wajar dalam bahasa Indonesia.
