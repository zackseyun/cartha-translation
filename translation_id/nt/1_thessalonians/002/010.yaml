  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: id
  text: Kamulah saksi, dan Allah juga, tentang bagaimana kami hidup dengan saleh, benar, dan tak bercela di antara kamu yang percaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap kamu yang percaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Kamulah saksi-saksinya, demikian juga Allah
  rationale: Mempertahankan penekanan pada sapaan langsung ὑμεῖς serta seruan kepada jemaat dan Allah sebagai saksi, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ὡς
  choice: betapa
  rationale: Memperkenalkan cara atau mutu perilaku para pemberita dan cocok setelah seruan kepada para saksi.
- source_word: ὁσίως
  choice: saleh
  rationale: Menyatakan perilaku yang sesuai dengan kesalehan di hadapan Allah tanpa memakai ungkapan yang kuno.
- source_word: δικαίως
  choice: benar
  rationale: Menyampaikan dimensi moral dari tindakan yang lurus dan adil dalam bahasa Indonesia yang wajar.
- source_word: ἀμέμπτως
  choice: tak bercela
  rationale: Menunjukkan perilaku yang tidak memberikan dasar sah untuk dicela, tanpa menyiratkan kesempurnaan mutlak.
- source_word: ὑμῖν
  choice: terhadap kamu
  rationale: Dativus ini dapat menunjuk hubungan dengan pihak yang menerima atau menyaksikan perilaku tersebut; 'terhadap kamu' mempertahankan orientasi relasional.
- source_word: τοῖς πιστεύουσιν
  choice: kamu yang percaya
  rationale: Mempertahankan daya verbal partisipel kini dan mengidentifikasi jemaat sebagai orang-orang yang percaya.
- source_word: ἐγενήθημεν
  choice: perilaku kami
  rationale: Konstruksi γίνομαι dengan tiga adverbia secara idiomatis menyatakan bagaimana para pemberita hidup atau berperilaku; nominalisasi ini menghasilkan kalimat Indonesia yang lancar tanpa mengubah makna kontekstual.
theological_decisions:
- issue: Tiga keterangan etis mengenai perilaku para rasul
  choice: Diterjemahkan sebagai kesaksian mengenai perilaku nyata yang saleh, benar, dan tak bercela.
  alternative: Memahaminya sebagai klaim kesempurnaan tanpa dosa atau hanya sebagai retorika pembelaan diri.
  rationale: Teks mengajukan jemaat dan Allah sebagai saksi atas integritas perilaku para pemberita. 'Tak bercela' menyatakan tidak adanya alasan sah untuk menuduh, tetapi tidak dengan sendirinya menetapkan kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Kamulah' mempertahankan penekanan pada ὑμεῖς; 'saleh, benar, dan tak bercela' menjaga rangkaian tiga unsur Yunani secara ringkas dan mudah dipahami.
