  terminology: “Saleh,” “benar,” dan “tak bercela” merupakan pilihan yang baik dan menjaga perbedaan tiga adverbia Yunani tanpa menyiratkan kesempurnaan mutlak. “Kamu yang percaya” mempertahankan daya verbal τοῖς πιστεύουσιν.
