id: 1TH.2.6
reference: 1 Thessalonians 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: id
  text: dan kami juga tidak mencari kemuliaan dari manusia[a], baik dari kalian maupun dari orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehormatan” atau “pujian” untuk “kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: mencari
  rationale: Partisipel kini ini meneruskan subjek tersirat dari konteks dan menyatakan tindakan yang berlangsung; 'mencari' alami dan tidak menambahkan penafsiran tentang motif.
- source_word: ἐξ ἀνθρώπων
  choice: dari manusia
  rationale: ἄνθρωποι bersifat generik, bukan khusus laki-laki. 'Manusia' mempertahankan rujukan umum kepada sesama manusia.
- source_word: δόξαν
  choice: kemuliaan
  rationale: δόξα di sini menunjuk pada pengakuan, kehormatan, atau pujian yang berasal dari manusia. 'Kemuliaan' mempertahankan hubungan leksikal dengan istilah Perjanjian Baru yang umum, sedangkan catatan kaki memberi padanan kontekstual.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: juga tidak ... baik ... maupun
  rationale: Rangkaian negatif pertama dihubungkan dengan konteks sebelumnya melalui 'dan ... juga tidak', sementara dua frasa sumber berikutnya disajikan secara alami dalam bahasa Indonesia sebagai 'baik ... maupun' di bawah lingkup penyangkalan.
- source_word: ἀφ’ ὑμῶν
  choice: dari kalian
  rationale: Bentuk orang kedua jamak merujuk langsung kepada jemaat Tesalonika; 'kalian' jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἀπ’ ἄλλων
  choice: dari orang lain
  rationale: ἄλλων secara kontekstual menunjuk kepada orang-orang selain jemaat Tesalonika; 'orang lain' jelas dan idiomatis.
theological_decisions:
- issue: Sifat δόξα yang dicari
  choice: kemuliaan atau pengakuan yang berasal dari manusia
  alternative: kehormatan manusia; pujian manusia
  rationale: Frasa ἐξ ἀνθρώπων memperjelas bahwa yang dimaksud ialah pengakuan dari manusia, bukan kemuliaan yang berasal dari Allah. Terjemahan mempertahankan istilah luas 'kemuliaan' tanpa menutup nuansa kehormatan atau pujian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak secara jelas; susunan kalimat mempertahankan ketergantungan klausa pada konteks ayat sebelumnya.
