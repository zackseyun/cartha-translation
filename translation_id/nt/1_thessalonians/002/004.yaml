source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: id
  text: Sebaliknya, sebagaimana kami telah disetujui oleh Allah untuk dipercayakan Injil, demikianlah kami berbicara—bukan untuk menyenangkan manusia, melainkan untuk menyenangkan Allah, yang menguji hati kami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: telah diuji dan dinyatakan layak
  rationale: Bentuk perfektum pasif menunjuk pada pengujian yang telah menghasilkan persetujuan dan yang hasilnya tetap berlaku. Gabungan ini mempertahankan unsur proses serta hasil, tanpa mengesankan bahwa yang dimaksud hanya sekadar diuji.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: untuk menerima Injil sebagai amanat
  rationale: Konstruksi pasif ini berarti bahwa Injil dipercayakan kepada para rasul, bukan bahwa mereka percaya kepada Injil. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tanggung jawab yang dipercayakan.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: “Injil” merupakan istilah baku dalam konteks Paulus dan mempertahankan bobot teologis kata Yunani tersebut.
- source_word: οὕτως λαλοῦμεν
  choice: demikianlah kami berbicara
  rationale: Terjemahan ini mempertahankan hubungan logis antara penilaian serta amanat dari Allah dan cara para rasul berbicara.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ θεῷ
  choice: bukan untuk menyenangkan manusia, melainkan Allah
  rationale: 'Bahasa Indonesia memungkinkan elipsis yang serupa dengan bahasa Yunani: kata “menyenangkan” hanya dinyatakan pada bagian pertama tetapi dipahami juga pada bagian kedua.'
- source_word: τῷ δοκιμάζοντι
  choice: yang menguji
  rationale: Partisipel kini menyatakan tindakan Allah yang terus berlangsung. “Menguji” juga menjaga kaitan leksikal dengan pengujian pada awal ayat.
- source_word: τὰς καρδίας ἡμῶν
  choice: hati kami
  rationale: “Hati” mempertahankan gambaran antropologis Alkitab dan tidak mempersempit maknanya hanya menjadi pikiran atau perasaan.
theological_decisions:
- issue: Kontras antara menyenangkan manusia dan menyenangkan Allah dalam sintaksis Yunani yang eliptis
  choice: 'Mempertahankan bentuk ringkas: “bukan untuk menyenangkan manusia, melainkan Allah”'
  alternative: “bukan untuk menyenangkan manusia, melainkan untuk menyenangkan Allah”
  rationale: Teks Yunani menyatakan partisipel “menyenangkan” hanya pada bagian pertama dan membiarkannya tersirat pada bagian kedua. Bentuk utama mempertahankan tekanan dan keringkasan Paulus, sedangkan bentuk eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menerima Injil sebagai amanat” dipilih agar gagasan dipercayakan tetap jelas dan alami; tanda pisah mempertahankan perubahan tekanan dalam kalimat Paulus.
