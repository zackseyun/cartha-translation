source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: id
  text: 'Sebab kamu ingat, Saudara-saudara[a], kerja keras dan jerih lelah kami: sambil bekerja malam dan siang agar tidak membebani siapa pun di antara kamu, kami memberitakan Injil Allah kepada kamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk maskulin jamak dan dalam konteks ini mungkin menyapa seluruh jemaat, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: kamu ingat
  rationale: Bentuk kini indikatif orang kedua jamak menyatakan fakta yang sedang berlaku, bukan perintah. Ungkapan ini mengajak jemaat bertumpu pada ingatan mereka sendiri.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini alami dan bermartabat. Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam konteks surat kepada jemaat dapat mencakup seluruh anggota jemaat; kemungkinan itu dijelaskan dalam catatan kaki.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: kerja keras dan jerih lelah kami
  rationale: Kedua nomina yang berdekatan maknanya dipertahankan sebagai pasangan yang mengungkapkan usaha berat dan keletihan yang menyertainya.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: malam dan siang
  rationale: Urutan sumber dipertahankan, dan ungkapan ini menyampaikan kerja yang tekun serta terus-menerus.
- source_word: ἐργαζόμενοι
  choice: sambil bekerja
  rationale: Partisipel ini menerangkan keadaan yang menyertai pemberitaan Paulus dan rekan-rekannya. 'Sambil' menjaga hubungan sintaksis tersebut secara alami dalam bahasa Indonesia.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: agar tidak membebani siapa pun di antara kamu
  rationale: Konstruksi ini menyatakan tujuan. 'Membebani' mempertahankan cakupan beban praktis atau keuangan tanpa mempersempitnya secara tidak perlu.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: kami memberitakan ... kepada kamu
  rationale: '''Memberitakan'' menyampaikan tindakan mengumumkan secara terbuka, sedangkan ''kepada kamu'' mempertahankan arah frasa εἰς ὑμᾶς.'
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injil Allah
  rationale: '''Injil'' merupakan istilah Indonesia yang mapan untuk kabar baik dalam konteks ini. Genitif ''Allah'' dipertahankan tanpa menentukan secara sempit apakah menunjuk pada sumber, kepunyaan, atau isi.'
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara dalam teks utama, dengan catatan tentang kemungkinan cakupan inklusif
  alternative: Saudara-saudara laki-laki dan perempuan
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi sapaan ini lazim dipakai bagi komunitas jemaat secara keseluruhan. Terjemahan utama tidak memperluas bentuk secara eksplisit, sementara catatan menjaga kemungkinan bahwa perempuan juga tercakup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jemaat yang wajar dan nada yang bermartabat. Struktur kalimat mempertahankan hubungan antara pekerjaan terus-menerus, tujuan untuk tidak menjadi beban, dan pemberitaan Injil.
