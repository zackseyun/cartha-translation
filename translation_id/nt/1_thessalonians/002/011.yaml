translation:
  language: id
  text: Sebagaimana kalian ketahui, kami memperlakukan setiap orang di antara kalian seperti seorang ayah memperlakukan anak-anaknya sendiri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sebagaimana kalian ketahui, [kami memperlakukan] setiap orang di antara kalian seperti seorang ayah [memperlakukan] anak-anaknya sendiri.” Klausa Yunani ini eliptis dan bergantung pada kalimat di sekitarnya untuk melengkapi tindakan verbalnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: seperti
  rationale: Memperkenalkan perbandingan dengan mengacu pada apa yang diketahui jemaat; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya bandingnya.
- source_word: οἴδατε
  choice: kalian ketahui
  rationale: Walaupun bentuk Yunaninya secara morfologis perfektum, οἶδα lazim bermakna kini, yaitu 'mengetahui'.
- source_word: ὡς (pertama)
  choice: '[terwakili oleh susunan ''seperti yang kalian ketahui'']'
  rationale: ὡς pertama memperkenalkan isi yang diketahui. Dalam bahasa Indonesia, fungsinya dapat terwakili secara alami oleh keseluruhan susunan tanpa menambahkan kata penghubung yang kaku.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: kalian masing-masing
  rationale: Mempertahankan tekanan distributif bahwa perhatian diberikan kepada setiap orang secara pribadi.
- source_word: ὡς (kedua)
  choice: seperti
  rationale: Menandai perbandingan dengan tindakan seorang ayah.
- source_word: πατὴρ
  choice: seorang ayah
  rationale: Nomina tanpa artikel ini digunakan secara kualitatif dalam perbandingan; 'seorang ayah' merupakan padanan Indonesia yang alami.
- source_word: τέκνα
  choice: anak-anak
  rationale: τέκνα mencakup anak secara umum tanpa membatasi jenis kelamin.
- source_word: ἑαυτοῦ
  choice: sendiri
  rationale: Kata ganti refleksif menegaskan bahwa yang dimaksud ialah anak-anak sang ayah sendiri.
- source_word: '[gagasan verbal eliptis dari konteks]'
  choice: kami memperlakukan ... memperlakukan
  rationale: Klausa Yunani bergantung pada konteks kalimat di sekitarnya. Kata 'memperlakukan' cukup luas untuk melengkapi makna tanpa mempersempitnya menjadi salah satu tindakan khusus pada ayat berikutnya; pengulangan kedua diperlukan agar perbandingan terasa lengkap dalam bahasa Indonesia.
theological_decisions:
- issue: Melengkapi tindakan verbal yang tersirat dalam klausa eliptis
  choice: 'Memakai kata umum yang disisipkan: ''kami memperlakukan kalian masing-masing seperti seorang ayah memperlakukan anak-anaknya sendiri'''
  alternative: Mempertahankan bentuk yang lebih terpenggal, atau menyisipkan tindakan yang lebih khusus seperti 'menasihati'
  rationale: Teks Yunani bersifat eliptis dan memperoleh tindakan verbalnya dari konteks yang lebih luas. Padanan umum menghasilkan kalimat Indonesia yang utuh sambil menghindari pemilihan satu tindakan pastoral tertentu dari rangkaian tindakan dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hangat dan bermartabat. 'Kalian' dipilih untuk menandai sapaan orang kedua jamak kepada jemaat; susunan dibuat alami tanpa menghilangkan sifat eliptis teks sumber, yang dijelaskan dalam catatan kaki.
