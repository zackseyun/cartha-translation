  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: id
  text: yang juga telah membunuh Tuhan Yesus dan para nabi[a], serta mengusir kami[b], tidak berkenan kepada Allah, dan memusuhi semua orang[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menghukum mati Tuhan Yesus.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya secara khusus berarti “menghalau” atau “mengeluarkan”, bukan sekadar gagasan yang lebih luas tentang penganiayaan.
    reason: lexical_alternative
  - marker: c
    text: Secara tata bahasa, gambaran ini melanjutkan penyebutan kelompok tertentu dalam ayat sebelumnya; ini tidak boleh dibaca sebagai pernyataan menyeluruh tentang semua orang Yahudi di setiap tempat dan zaman.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: telah membunuh
  rationale: Kata kerja ini berarti membunuh atau menyebabkan kematian. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan nuansa motif yang tidak dinyatakan secara eksplisit.
- source_word: κύριον Ἰησοῦν
  choice: Tuhan Yesus
  rationale: κύριος berfungsi sebagai gelar kristologis, sedangkan Ἰησοῦν adalah nama pribadi.
- source_word: τοὺς προφήτας
  choice: para nabi
  rationale: Bentuk jamak berartikel menunjuk kepada jajaran nabi yang dikenal; 'para nabi' merupakan padanan Indonesia yang wajar.
- source_word: ἐκδιωξάντων
  choice: mengusir kami
  rationale: Kata ini secara khusus menyatakan tindakan menghalau atau mengeluarkan, lebih konkret daripada sekadar 'menganiaya'.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: tidak menyenangkan Allah
  rationale: Mempertahankan daya deskriptif partisipel kini dan relasi datif terhadap Allah dalam ungkapan Indonesia yang alami.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: memusuhi semua orang
  rationale: ἐναντίος menyatakan sikap menentang atau bermusuhan. 'Memusuhi' menyampaikan daya adversatifnya secara ringkas dan alami.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: yang ... telah membunuh ... mengusir ... Mereka tidak menyenangkan ... dan memusuhi ...
  rationale: Klausa relatif mempertahankan hubungan dengan anteseden pada ayat sebelumnya. Pemecahan menjadi dua kalimat membuat rantai partisipel dapat dipahami dengan jelas dalam bahasa Indonesia tanpa mengubah kelompok yang dirujuk.
- source_word: καὶ
  choice: juga / dan / serta
  rationale: Variasi konjungsi Indonesia mempertahankan penambahan dan daya kumulatif rangkaian tuduhan tanpa menghasilkan susunan yang kaku.
theological_decisions:
- issue: Rujukan rangkaian partisipel
  choice: Dipertahankan sebagai kelanjutan gambaran tentang kelompok yang disebut pada ayat sebelumnya.
  alternative: Memahaminya sebagai kecaman umum terhadap semua orang Yahudi pada segala zaman.
  rationale: Bentuk artikel dan partisipel genitif jamak secara gramatikal berhubungan dengan anteseden dalam 2:14. Terjemahan tidak memperluas cakupan pernyataan melampaui rujukan sastrawinya.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. 'Para nabi' dan 'Tuhan Yesus' mengikuti pemakaian Alkitabiah yang umum. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
