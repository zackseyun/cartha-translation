id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: id
  text: Sebab kamu sendiri tahu, Saudara-saudara[a], bahwa kedatangan kami kepadamu tidaklah sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; bahasa Yunani secara harfiah memakai bentuk “saudara-saudara”, yang sering digunakan untuk menyapa seluruh komunitas orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: kamu sendiri
  rationale: Pemakaian intensif αὐτοὶ menekankan bahwa jemaat Tesalonika mengetahui hal ini berdasarkan pengalaman mereka sendiri.
- source_word: γὰρ
  choice: Sebab
  rationale: γὰρ menghubungkan ayat ini sebagai alasan yang mendukung pernyataan sebelumnya; “Sebab” mempertahankan alur argumentasinya secara alami.
- source_word: οἴδατε
  choice: tahu
  rationale: Walaupun secara bentuk merupakan perfektum, οἴδατε lazim bermakna keadaan kini, yaitu “tahu”.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan maskulin jamak ini dipertahankan dengan padanan Indonesia yang wajar dan bermartabat; dalam pemakaian Paulus sapaan tersebut sering mencakup seluruh jemaat.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: kedatangan kami kepadamu
  rationale: Dalam konteks ini εἴσοδος menunjuk pada kedatangan atau masuknya Paulus dan rekan-rekannya kepada jemaat, bukan sekadar sebuah “kunjungan”; frasa πρὸς ὑμᾶς menyatakan arah kepada mereka.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi dari apa yang diketahui jemaat.
- source_word: οὐ κενὴ γέγονεν
  choice: tidaklah sia-sia
  rationale: κενός di sini menyatakan sesuatu yang tidak kosong, tanpa hasil, atau tanpa makna. “Tidaklah sia-sia” alami dalam bahasa Indonesia dan tetap mempertahankan keluasan nuansa evaluatifnya.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat
  choice: Saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk sapaan yang berwujud maskulin dipertahankan dalam teks utama tanpa menutup kemungkinan bahwa Paulus sedang menyapa seluruh komunitas orang percaya, termasuk perempuan; cakupan itu dijelaskan dalam catatan kaki.
- issue: Makna οὐ κενὴ γέγονεν
  choice: tidaklah sia-sia
  alternative: tidak tanpa hasil; tidak kosong
  rationale: Ungkapan ini dapat menyoroti hasil, isi, atau arti penting kedatangan para rasul. Terjemahan “tidaklah sia-sia” menjaga keluasan tersebut tanpa membatasi maknanya hanya pada keberhasilan pelayanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. “Kamu” dipilih karena Paulus berbicara kepada jemaat secara kolektif dan dekat; bentuk ulang “Saudara-saudara” merupakan sapaan Indonesia yang lazim. Partikel penegas “-lah” pada “tidaklah” membantu menghasilkan irama alami sekaligus menegaskan penyangkalan.
