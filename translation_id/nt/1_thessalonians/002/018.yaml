id: 1TH.2.18
reference: 1 Thessalonians 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: id
  text: Sebab kami ingin datang kepada kalian—aku sendiri, Paulus, lebih dari sekali[a]—tetapi Satan menghalangi kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sekali dan dua kali,” suatu ungkapan yang berarti “lebih dari sekali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan daya penjelasnya secara alami dalam bahasa Indonesia.
- source_word: ἠθελήσαμεν
  choice: kami ingin
  rationale: Menyatakan kehendak atau keinginan; bentuk ini alami dan tidak menambahkan kepastian rencana yang tidak dinyatakan teks.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: datang kepada kalian
  rationale: Mempertahankan gambaran gerak menuju jemaat tanpa menambahkan makna 'berkunjung' atau 'kembali'.
- source_word: ἐγὼ μὲν Παῦλος
  choice: terutama aku, Paulus
  rationale: Menonjolkan Paulus secara khusus dari subjek jamak 'kami'; 'terutama' mengungkap fungsi penekanan μέν tanpa menuntut pasangan eksplisit yang tidak muncul.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: sudah lebih dari sekali
  rationale: Ungkapan harfiah 'sekali dan dua kali' berarti bahwa upaya itu terjadi setidaknya pada dua kesempatan; terjemahan ini jelas dan alami.
- source_word: ἐνέκοψεν
  choice: menghalangi
  rationale: Menyampaikan tindakan merintangi jalan atau kemajuan tanpa memperkuatnya menjadi determinisme mutlak.
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: Mempertahankan nama atau gelar pribadi yang lazim dalam pemakaian Perjanjian Baru dan bahasa Indonesia.
theological_decisions:
- issue: Peran Satan dalam terhalangnya perjalanan Paulus
  choice: tetapi Satan menghalangi kami
  alternative: tetapi Sang Lawan mencegah kami
  rationale: Teks secara eksplisit menyatakan Satan sebagai pelaku. 'Menghalangi' mempertahankan peran pribadi itu tanpa mengubahnya menjadi keadaan impersonal atau menegaskan pencegahan mutlak melebihi daya kata sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk menandai bahwa kata ganti orang kedua dalam sumber berbentuk jamak. Tanda pisah mempertahankan sisipan penegasan Paulus.
