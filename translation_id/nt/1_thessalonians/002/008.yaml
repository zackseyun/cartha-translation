  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: id
  text: Demikianlah, karena sangat merindukan kalian[a], kami dengan senang hati membagikan kepada kalian bukan hanya Injil Allah, melainkan juga hidup kami sendiri[b], sebab kalian telah menjadi orang-orang yang kami kasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah, dengan kerinduan yang mendalam kepada kalian.” Kata Yunani yang langka ini dapat menyatakan kerinduan atau kasih sayang yang mendalam.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Secara harfiah, “jiwa kami sendiri”; dapat juga berarti “diri kami sendiri.” Di sini ungkapan itu menyatakan pemberian diri secara pribadi dan penuh pengorbanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Menghubungkan tindakan para rasul dengan gambaran kasih dan pemeliharaan pada ayat sebelumnya, sambil mempertahankan daya adverbialnya.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: karena sangat merindukan kalian
  rationale: Partisipel yang langka ini menyatakan kerinduan dan kasih sayang yang mendalam. Bentuk kausal menghasilkan bahasa Indonesia yang wajar; kemungkinan konstruksi modal dicatat dalam catatan kaki.
- source_word: εὐδοκοῦμεν
  choice: kami dengan senang hati
  rationale: Mengungkapkan kesediaan yang disertai sukacita, bukan sekadar persetujuan.
- source_word: μεταδοῦναι
  choice: membagikan
  rationale: Menunjukkan pemberian bagian dari sesuatu yang dimiliki sendiri dan dapat dipakai secara alami untuk Injil maupun hidup mereka.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injil Allah
  rationale: Mempertahankan istilah Paulus yang sudah dikenal serta hubungan genitifnya tanpa menentukan apakah genitif itu terutama menyatakan sumber atau kepunyaan.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: hidup kami sendiri
  rationale: Dalam konteks ini ψυχή menunjuk pada hidup atau diri yang diberikan secara pribadi, bukan khusus pada jiwa sebagai unsur nonjasmani. Kata 'sendiri' mempertahankan penekanannya.
- source_word: διότι
  choice: sebab
  rationale: Menandai alasan bagi kesediaan mereka membagikan Injil dan hidup mereka.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: kalian telah menjadi orang-orang yang kami kasihi
  rationale: 'Menyampaikan keadaan relasional yang timbul: jemaat itu telah menjadi orang-orang terkasih bagi Paulus dan rekan-rekannya.'
theological_decisions:
- issue: Makna ψυχάς dalam gambaran pemberian diri para rasul
  choice: hidup kami sendiri
  alternative: jiwa kami sendiri; diri kami sendiri
  rationale: Konteksnya ialah penyerahan diri dan pemeliharaan yang nyata, bukan uraian antropologis tentang pemisahan tubuh dan jiwa.
- issue: Hubungan partisipel ὁμειρόμενοι dengan verba utama
  choice: 'Dipahami secara kausal: karena sangat merindukan'
  alternative: 'Secara modal: dengan kerinduan seperti itu terhadap'
  rationale: Hubungan sintaksisnya tidak harus dibatasi pada satu kategori. Bacaan kausal paling alami dalam bahasa Indonesia, sedangkan kemungkinan modal dipertahankan dalam catatan kaki.
- issue: Daya ἀγαπητοὶ
  choice: orang-orang yang kami kasihi
  alternative: orang-orang yang terkasih bagi kami
  rationale: Pilihan ini mempertahankan kasih pribadi Paulus dan rekan-rekannya tanpa menambahkan konotasi doktrinal yang tidak ditonjolkan dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan jumlah pada teks Yunani tetap jelas. Nada dibuat hangat dan bermartabat, sesuai gambaran kasih pastoral dalam konteks.
