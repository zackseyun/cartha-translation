id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: id
  text: Karena itu, kami juga terus-menerus mengucap syukur kepada Allah, sebab ketika kalian menerima firman Allah yang kalian dengar dari kami,[a] kalian menyambutnya bukan sebagai perkataan manusia, melainkan sebagai firman Allah—dan memang demikianlah adanya.[b] Firman itu juga bekerja di dalam diri kalian yang percaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “pesan Allah yang kalian dengar dari kami.” Ungkapan Yunani ini padat dan dapat diuraikan secara alami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “bukan sebagai pesan manusia, melainkan—sebagaimana yang sebenarnya—sebagai firman Allah.”
    reason: lexical_alternative
  - marker: c
    text: 'Kata ganti relatif dalam bahasa Yunani juga mungkin dipahami mengacu kepada Allah: “Allah juga bekerja di dalam diri kalian yang percaya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Mempertahankan hubungan sebab dengan konteks sebelumnya sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: kami juga terus-menerus mengucap syukur kepada Allah
  rationale: Menyampaikan tindakan yang berkelanjutan atau berulang tanpa memberi kesan bahwa Paulus secara harfiah tidak pernah berhenti berbicara.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: firman Allah yang kalian dengar dari kami
  rationale: Menguraikan susunan genitif Yunani yang padat secara alami, sambil mempertahankan λόγος sebagai 'firman' dan sumber pendengaran sebagai 'dari kami'.
- source_word: ἐδέξασθε
  choice: kalian menyambutnya
  rationale: Menunjukkan penerimaan yang positif, bukan sekadar tindakan mendengar atau menerima secara pasif.
- source_word: οὐ λόγον ἀνθρώπων
  choice: bukan sebagai perkataan manusia
  rationale: '''Perkataan'' menghasilkan kontras Indonesia yang jelas dengan ''firman Allah'', sedangkan ''manusia'' mempertahankan arti generik ἀνθρώπων.'
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: melainkan sebagai firman Allah—dan memang demikianlah adanya
  rationale: Mengungkapkan penegasan parentetis καθὼς ἀληθῶς ἐστὶν secara alami tanpa mengurangi klaim tegas bahwa pesan itu adalah firman Allah.
- source_word: ἐνεργεῖται
  choice: bekerja
  rationale: Menyampaikan daya kerja yang sedang berlangsung tanpa terlalu menentukan nuansa bentuk medial atau pasifnya.
- source_word: τοῖς πιστεύουσιν
  choice: di dalam diri kalian yang percaya
  rationale: Mempertahankan kelompok sasaran dan ciri iman yang dinyatakan oleh partisipel kini.
theological_decisions:
- issue: Acuan kata ganti relatif ὃς
  choice: 'Dipahami terutama mengacu kepada ''firman Allah'': ''Firman itu juga bekerja''.'
  alternative: 'Dapat dipahami mengacu kepada Allah: ''Allah juga bekerja di dalam diri kalian yang percaya.'''
  rationale: λόγον adalah anteseden terdekat dan cocok secara gramatikal dengan ὃς; tema daya kerja firman juga sesuai dengan kalimat. Namun θεοῦ pun maskulin tunggal, sehingga kemungkinan acuannya kepada Allah dipertahankan dalam catatan kaki.
- issue: Bobot ungkapan λόγον θεοῦ
  choice: firman Allah
  alternative: pesan Allah
  rationale: Pilihan ini menjaga pengulangan λόγος dan kontras retoris antara perkataan manusia dan firman Allah, tanpa memperluas pernyataan ayat menjadi rumusan doktrinal yang tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak orang kedua secara jelas; 'firman Allah' mempertahankan bobot dan pengulangan istilah sumber. Tanda pisah mengemas penegasan parentetis Yunani dengan wajar dalam bahasa Indonesia.
