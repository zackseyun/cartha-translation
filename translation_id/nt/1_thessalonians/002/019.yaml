  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: id
  text: Sebab, apakah yang menjadi pengharapan atau sukacita atau mahkota kebanggaan kami—bukankah kalian juga yang menjadi semuanya itu?—di hadapan Tuhan kita Yesus pada kedatangan-Nya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadiran-Nya” atau “ketibaan-Nya”. Kata Yunani παρουσία dapat berarti kehadiran atau ketibaan; dalam konteks ini kata tersebut menunjuk pada kedatangan Tuhan Yesus pada masa yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: apakah yang
  rationale: Kata ini dapat berarti ‘siapa’ atau ‘apa’. Karena diikuti kata benda abstrak ‘pengharapan’, ‘sukacita’, dan ‘mahkota’, bentuk ‘apakah yang’ paling alami dalam bahasa Indonesia, sementara jawabannya tetap menunjuk kepada orang-orang percaya di Tesalonika.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan ayat ini dengan konteks sebelumnya.
- source_word: ἐλπίς
  choice: pengharapan
  rationale: Padanan baku yang menyampaikan harapan atau penantian penuh keyakinan.
- source_word: χαρά
  choice: sukacita
  rationale: Padanan langsung dan wajar yang mempertahankan daya emosional istilah Yunani.
- source_word: στέφανος καυχήσεως
  choice: mahkota kebanggaan
  rationale: στέφανος menunjuk pada mahkota atau karangan kemenangan dan καύχησις pada kebanggaan atau alasan untuk bermegah. Padanan ini dekat dengan bentuk Yunani sekaligus tidak memberi kesan negatif yang tidak diperlukan.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: bukankah kalian juga?
  rationale: Pertanyaan ini mengharapkan jawaban positif. ‘Bukankah’ mempertahankan penekanannya, ‘juga’ mewakili καί, dan ‘kalian’ memperjelas bahwa ὑμεῖς berbentuk jamak.
- source_word: ἔμπροσθεν
  choice: di hadapan
  rationale: Menyatakan keberadaan di depan atau dalam hadirat Tuhan dengan ungkapan Indonesia yang alami.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku κύριος dalam pengakuan tentang Yesus.
- source_word: παρουσία
  choice: kedatangan
  rationale: Dalam konteks eskatologis Paulus, istilah ini menunjuk pada kedatangan Tuhan Yesus kelak. Makna leksikal lain, yaitu ‘kehadiran’, dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna παρουσία dalam konteks eskatologis
  choice: kedatangan
  alternative: kehadiran atau ketibaan
  rationale: Konteks menunjuk pada kedatangan Tuhan Yesus pada masa depan, tetapi παρουσία secara leksikal juga dapat menyatakan kehadiran atau tibanya seseorang. Alternatif itu dicatat agar keluasan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk memperlihatkan bentuk jamak tanpa kekakuan, sedangkan tanda pisah mempertahankan bentuk pertanyaan retoris yang disisipkan dalam kalimat Yunani.
