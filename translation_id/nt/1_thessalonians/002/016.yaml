source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: id
  text: dengan menghalangi kami berbicara kepada orang-orang bukan Yahudi agar mereka diselamatkan, dan dengan demikian mereka senantiasa memenuhi takaran dosa-dosa mereka. Namun murka[b] telah menimpa mereka pada akhirnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “sepenuhnya,” “sampai tuntas,” atau “sampai kesudahannya” untuk “pada akhirnya” (Yunani: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: “Murka” kemungkinan menunjuk kepada penghakiman ilahi, tetapi di sini Paulus tidak menjelaskan apakah yang dimaksud ialah suatu penghakiman historis, penghakiman terakhir, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: dengan menghalangi
  rationale: Partisipel kini melanjutkan uraian sebelumnya dan menyatakan tindakan menghambat yang berlangsung, tanpa mempersempitnya menjadi larangan resmi.
- source_word: τοῖς ἔθνεσιν
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Paulus, istilah ini menunjuk kepada orang-orang non-Yahudi, bukan negara atau bangsa sebagai kesatuan geopolitik.
- source_word: λαλῆσαι
  choice: berbicara
  rationale: Padanan langsung bagi infinitif yang bergantung pada κωλυόντων; isi pemberitaan dipahami dari konteks.
- source_word: ἵνα σωθῶσιν
  choice: agar mereka diselamatkan
  rationale: Mempertahankan klausa tujuan serta bentuk pasif teologis tanpa menentukan pelaku secara eksplisit.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: Dengan demikian ... memenuhi
  rationale: Menyampaikan akibat atau konsekuensi dalam bahasa Indonesia yang alami tanpa menyatakan bahwa memenuhi dosa adalah tujuan sadar mereka.
- source_word: ἀναπληρῶσαι
  choice: memenuhi ukuran
  rationale: Kata kerja menyiratkan membawa sesuatu kepada kepenuhannya; 'ukuran' mengungkapkan gambaran idiomatis tentang dosa yang mencapai batas penuh.
- source_word: πάντοτε
  choice: senantiasa
  rationale: Menyatakan pola yang terus berlangsung dengan register yang wajar dan bermartabat.
- source_word: ἔφθασεν ... ἐπ’ αὐτούς
  choice: telah menimpa mereka
  rationale: Menyatakan tindakan yang telah terjadi dan tetap relevan; 'menimpa' cocok dengan konstruksi ἐπί tanpa memastikan peristiwa historis tertentu.
- source_word: ὀργή
  choice: murka
  rationale: Mempertahankan bobot teologis dan kemungkinan kuat bahwa yang dimaksud ialah murka ilahi, tanpa menggantinya dengan istilah interpretatif seperti 'penghakiman'.
- source_word: εἰς τέλος
  choice: pada akhirnya
  rationale: Padanan alami bagi pengertian kulminatif 'at last', sementara kemungkinan arti 'sepenuhnya' atau 'sampai kesudahannya' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan dan cakupan 'murka'
  choice: Tetap diterjemahkan 'murka' tanpa menentukan bentuk penghakimannya.
  alternative: Penghakiman historis tertentu; penghakiman terakhir; atau pernyataan proleptis yang mencakup keduanya.
  rationale: Ayat ini tidak menyebutkan secara eksplisit apakah Paulus memaksudkan penghakiman historis, eskatologis, atau keduanya.
- issue: Daya εἰς τὸ ἀναπληρῶσαι
  choice: 'Diungkapkan sebagai konsekuensi: ''Dengan demikian''.'
  alternative: 'Tujuan eksplisit: ''supaya memenuhi''.'
  rationale: Konstruksi Yunani dapat menyatakan hasil dalam konteks ini; pilihan tersebut menghindari kesan bahwa mereka secara sadar bertujuan melengkapi dosa mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Bangsa-bangsa bukan Yahudi' dipilih agar makna etnoreligius jelas. Penanda catatan kaki ditempatkan langsung setelah bagian penutup yang diterangkannya.
