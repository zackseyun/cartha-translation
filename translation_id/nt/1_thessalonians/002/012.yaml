base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: id
  text: Kami menasihati, menghibur, dan mendesak kalian supaya kalian hidup dengan cara yang layak bagi Allah,[a] yang memanggil kalian masuk ke dalam kerajaan dan kemuliaan-Nya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “supaya kalian berjalan dengan cara yang layak bagi Allah.” Dalam Alkitab, “berjalan” sering menjadi kiasan untuk cara seseorang menjalani hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: menasihati
  rationale: Dalam rangkaian pelayanan kebapakan Paulus, kata ini menyatakan dorongan atau nasihat pastoral. “Menasihati” alami dalam bahasa Indonesia dan tidak sekeras “memperingatkan”.
- source_word: παραμυθούμενοι
  choice: menghibur
  rationale: Kata ini menunjuk pada perkataan yang menguatkan atau menghibur; pilihan ini menjaga nuansanya tetap berbeda dari παρακαλοῦντες.
- source_word: μαρτυρόμενοι
  choice: mendesak
  rationale: Dalam konteks ini kata tersebut berarti menyatakan dengan sungguh-sungguh atau mendesak. “Mendesak” menyampaikan bobot seruan tanpa menimbulkan kesan bahwa Paulus sedang memberi kesaksian tentang suatu peristiwa.
- source_word: εἰς τὸ περιπατεῖν
  choice: supaya kalian hidup
  rationale: Infinitif berartikula dengan εἰς menyatakan tujuan atau hasil. Metafora harfiah “berjalan” berarti menjalani kehidupan; dalam bahasa Indonesia modern, “hidup” menyampaikan maksudnya dengan jelas dan wajar.
- source_word: ἀξίως τοῦ θεοῦ
  choice: dengan cara yang layak bagi Allah
  rationale: Ungkapan ini mempertahankan hubungan genitif “layak bagi Allah” sambil menghasilkan susunan bahasa Indonesia yang alami.
- source_word: τοῦ καλοῦντος
  choice: yang memanggil
  rationale: Partisipel kini diterjemahkan dengan bentuk kini yang netral, tanpa menetapkan apakah panggilan itu hanya terjadi pada masa lampau atau menambahkan doktrin tentang mekanismenya.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: masuk ke dalam kerajaan dan kemuliaan-Nya sendiri
  rationale: “Masuk ke dalam” mewakili εἰς, sedangkan “-Nya sendiri” mempertahankan tekanan refleksif ἑαυτοῦ. Kedua nomina tetap sejajar di bawah satu preposisi.
theological_decisions:
- issue: Metafora περιπατεῖν sebagai gambaran cara hidup
  choice: Menyampaikan maknanya sebagai “hidup” dalam teks utama
  alternative: “berjalan” atau “menjalani hidup”
  rationale: Dalam bahasa Indonesia, “berjalan dengan layak bagi Allah” mudah disalahpahami secara harfiah dan kurang idiomatis. “Hidup” menjaga maksud etis metafora tanpa menambahkan isi teologis.
- issue: Waktu dan sifat panggilan Allah dalam τοῦ καλοῦντος ὑμᾶς
  choice: “yang memanggil kalian”
  alternative: “yang telah memanggil kalian” atau “yang sedang memanggil kalian”
  rationale: Bentuk kini ini mempertahankan aspek teks Yunani secara wajar dan tidak memaksakan pandangan tertentu mengenai waktu atau cara panggilan Allah.
- issue: Hubungan kerajaan dan kemuliaan
  choice: Mempertahankan keduanya sebagai unsur sejajar yang menjadi tujuan panggilan
  alternative: Menafsirkan kemuliaan sebagai penjelasan tentang kerajaan
  rationale: Satu preposisi menguasai kedua nomina, tetapi teks tidak menjelaskan lebih lanjut hubungan tepat di antara keduanya; karena itu koordinasinya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bahwa pronomina Yunani berbentuk jamak. Rangkaian tiga verba dibuat ringkas sesuai struktur Yunani, dengan satu objek yang berlaku bagi ketiganya.
