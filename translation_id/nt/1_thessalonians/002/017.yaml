review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan kontras δέ dan ἡμεῖς, durasi singkat, serta kontras antara keterpisahan fisik dan keterikatan hati. Namun, “seperti anak yang kehilangan orang tua” menambahkan perbandingan dan menetapkan arah metafora yang tidak dinyatakan oleh teks Yunani. ἀπορφανισθέντες secara harfiah mengandung citra ‘dibuat yatim/piatu’ atau ‘dibuat merasa kehilangan’, tetapi tidak menyebut anak maupun orang tua. Selain itu, “karena kerinduan yang besar” mengubah ἐν πολλῇ ἐπιθυμίᾳ (‘dengan/dalam kerinduan besar’) menjadi hubungan sebab yang tidak eksplisit.
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. “Bertemu muka dengan kalian” dapat dipahami, tetapi “melihat wajah kalian” lebih dekat dengan τὸ πρόσωπον ὑμῶν ἰδεῖν dan tetap alami dalam register surat. “Secara fisik, bukan di dalam hati” merupakan kontras yang jelas dan modern.
  terminology: “Saudara-saudara” cocok sebagai sapaan yang mempertahankan bentuk maskulin ἀδελφοί; catatan cakupan jemaat sudah tepat. “Kalian” sesuai untuk orang kedua jamak dalam bahasa Indonesia modern. Catatan metafora perlu menghindari frasa “kehilangan keluarga,” yang tidak merupakan arti leksikal langsung dan dapat mengaburkan citra sumber.
  issues:
  - severity: medium
    issue: Perbandingan “seperti anak yang kehilangan orang tua” ditambahkan ke dalam teks utama.
    rationale: Teks Yunani memakai partisip pasif ἀπορφανισθέντες, dengan citra dibuat yatim/piatu atau kehilangan melalui perpisahan, tetapi tidak menentukan bahwa Paulus dan rekan-rekannya adalah anak-anak atau bahwa jemaat adalah orang tua mereka.
  - severity: medium
    issue: “Karena kerinduan yang besar” menjadikan kerinduan sebagai sebab eksplisit.
    rationale: 'Frasa ἐν πολλῇ ἐπιθυμίᾳ paling langsung menyatakan cara atau suasana: ‘dengan kerinduan besar,’ bukan hubungan kausal yang perlu ditambahkan.'
  - severity: low
    issue: Catatan kaki b memasukkan alternatif “kehilangan keluarga.”
    rationale: Alternatif ini lebih luas daripada citra leksikal ‘dibuat yatim/piatu’ dan sebaiknya diganti dengan penjelasan singkat mengenai gambaran kehilangan akibat perpisahan.
  revised_text: Namun kami, Saudara-saudara[a], yang terpisah dari kalian untuk waktu yang singkat—secara fisik, bukan di dalam hati—makin sungguh-sungguh berusaha untuk melihat wajah kalian, dengan kerinduan yang besar.
  revised_footnotes:
