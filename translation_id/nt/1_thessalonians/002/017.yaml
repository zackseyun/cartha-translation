  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: id
  text: Namun kami, Saudara-saudara[a], yang terpisah dari kalian untuk waktu yang singkat—secara fisik, bukan di dalam hati—makin sungguh-sungguh berusaha untuk melihat wajah kalian, dengan kerinduan yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Saudara-saudara’ adalah bentuk sapaan Paulus; dalam konteks ini kemungkinan besar sapaan tersebut mencakup seluruh jemaat, termasuk perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Namun kami
  rationale: δέ menandai kontras ringan dengan bagian sebelumnya, sedangkan Ἡμεῖς memberi penekanan pada subjek; 'Namun kami' menyampaikan keduanya secara wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini secara gramatikal berbentuk maskulin, tetapi dalam pemakaian Paulus lazimnya ditujukan kepada seluruh jemaat. 'Saudara-saudara' merupakan sapaan Alkitabiah yang alami dalam bahasa Indonesia; cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: ἀπορφανισθέντες
  choice: terpisah dari kalian seperti anak yang kehilangan orang tua
  rationale: Kata kerja ini secara harfiah memakai gambaran menjadi yatim atau kehilangan keluarga. Ungkapan ini mempertahankan gambaran dukacita akibat perpisahan tanpa menyiratkan secara keliru bahwa jemaat adalah orang tua Paulus.
- source_word: πρὸς καιρὸν ὥρας
  choice: untuk sementara waktu
  rationale: Ungkapan idiomatis ini menunjuk pada masa yang singkat, bukan satu jam secara harfiah.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: secara jasmani, bukan di hati
  rationale: Pasangan datif ini mengontraskan ketidakhadiran fisik dengan kasih dan keterikatan batin yang tetap ada. 'Secara jasmani' lebih alami daripada terjemahan harfiah 'di wajah'.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: semakin berusaha keras
  rationale: περισσοτέρως menguatkan σπουδάζω, yang di sini dapat mencakup kesungguhan hati sekaligus usaha nyata. Pilihan ini mempertahankan kedua nuansa tersebut.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: untuk bertemu muka dengan kalian
  rationale: Secara harfiah berarti 'melihat wajah kalian'. Ungkapan 'bertemu muka' mempertahankan sifat personal dan jasmani dari pertemuan yang dirindukan serta terdengar alami dalam bahasa Indonesia.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: karena kerinduan yang besar
  rationale: ἐπιθυμία di sini menyatakan hasrat atau kerinduan yang kuat, tanpa konotasi negatif. 'Karena' mengungkapkan hubungan motivasional yang wajar dari frasa ἐν dalam konteks ini.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara, dengan catatan bahwa sapaan mencakup seluruh jemaat
  alternative: Saudara-saudari
  rationale: Bentuk sumber yang maskulin tetap terlihat melalui sapaan tradisional Indonesia, sementara catatan kaki menjelaskan bahwa dalam konteks ini Paulus kemungkinan menyapa seluruh komunitas orang percaya, termasuk perempuan.
- issue: Metafora kehilangan dalam ἀπορφανισθέντες
  choice: Mempertahankan metafora melalui perbandingan 'seperti anak yang kehilangan orang tua'
  alternative: terenggut dari kalian / terpisah dari kalian
  rationale: Kata Yunani memakai gambaran kehilangan keluarga yang kuat. Perbandingan eksplisit menjaga daya emosionalnya tanpa menetapkan hubungan keluarga tertentu antara Paulus dan jemaat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Pronomina 'kami' dan 'kalian' mempertahankan pembedaan orang pertama jamak dan orang kedua jamak secara jelas; susunan kalimat menjaga kontras antara keterpisahan jasmani dan kedekatan hati.
