revisions:
- from: Namun kami, Saudara-saudara[a], yang untuk sementara waktu terpisah dari kalian seperti anak yang kehilangan orang tua[b]—secara jasmani, bukan di hati—semakin berusaha keras untuk bertemu muka dengan kalian, karena kerinduan yang besar.
  to: Namun kami, Saudara-saudara[a], yang terpisah dari kalian untuk waktu yang singkat—secara fisik, bukan di dalam hati—makin sungguh-sungguh berusaha untuk melihat wajah kalian, dengan kerinduan yang besar.
  rationale: Revisi menghapus penafsiran relasional yang tidak dinyatakan dalam metafora ἀπορφανισθέντες, sambil mempertahankan kekuatan citranya dalam catatan kaki. “Dengan kerinduan yang besar” mengikuti fungsi ἐν secara lebih netral daripada “karena.” Pilihan “melihat wajah kalian” menjaga unsur προσωπον dan tetap wajar dalam bahasa Indonesia baku.
