  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: id
  text: Sebab kalian, Saudara-saudara, telah menjadi peneladan jemaat-jemaat Allah yang berada di Yudea dan yang ada dalam Mesias Yesus, karena kalian juga mengalami penderitaan yang sama dari orang-orang sebangsa kalian sendiri, seperti halnya mereka dari orang-orang Yahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Atau “orang-orang Yudea.” Istilah Yunani Ἰουδαῖοι dapat menunjuk kepada orang Yahudi atau orang Yudea, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: kalian telah menjadi orang-orang yang meneladani
  rationale: Mempertahankan gagasan ‘menjadi’ dari ἐγενήθητε dan perbandingan eksplisit dari μιμηταί, sambil menghindari ‘peniru’ yang dalam bahasa Indonesia modern dapat bernada negatif.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku dan bermartabat bagi seluruh jemaat; bentuk Indonesia ini tidak harus dibatasi pada laki-laki.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: jemaat-jemaat Allah
  rationale: ‘Jemaat’ merupakan padanan gerejawi yang alami bagi ἐκκλησία, dan bentuk jamak dipertahankan.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: di Yudea
  rationale: Frasa partisipial Yunani mengidentifikasi lokasi jemaat-jemaat tersebut; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Menerjemahkan Χριστός menurut makna gelarnya dan mempertahankan ungkapan Paulus ‘dalam ...’; bentuk tradisional dicatat sebagai alternatif.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: mengalami penderitaan yang sama
  rationale: Menyampaikan makna πάσχω sebagai mengalami kesusahan atau penderitaan, dengan susunan yang alami.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: orang-orang sebangsa kalian sendiri
  rationale: συμφυλέτης menunjuk pada orang dari kelompok bangsa atau masyarakat yang sama, sedangkan ἰδίων memberi penekanan ‘sendiri’.
- source_word: τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Padanan etnoreligius yang paling wajar dalam konteks ini, tanpa menambahkan bahwa yang dimaksud adalah semua orang Yahudi; kemungkinan geografis ‘orang-orang Yudea’ dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk nama tradisional
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός tetap memiliki isi gelar ‘Yang Diurapi/Mesias’; alternatif tradisional disediakan agar pembaca mengetahui bentuk yang lazim.
- issue: Cakupan sebutan τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Istilah Yunani dapat memiliki nuansa etnoreligius atau geografis. Teks utama memakai arti yang paling mungkin di sini, tetapi tidak memperluas acuannya menjadi seluruh orang Yahudi, dan ambiguitas leksikal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk membedakan bentuk jamak ὑμεῖς secara jelas, sedangkan ‘Saudara-saudara’ mempertahankan sapaan pastoral. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan sebab-akibat.
