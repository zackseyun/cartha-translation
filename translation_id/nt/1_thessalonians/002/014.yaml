  to: Sebab kalian, Saudara-saudara, telah menjadi peneladan jemaat-jemaat Allah yang berada di Yudea dan yang ada dalam Mesias Yesus, karena kalian juga mengalami penderitaan yang sama dari orang-orang sebangsa kalian sendiri, seperti halnya mereka dari orang-orang Yahudi[c].
  rationale: Revisi memulihkan hubungan sebab-akibat dari ὅτι, menempatkan ἐν Χριστῷ Ἰησοῦ dengan jelas sebagai keterangan bagi jemaat-jemaat, dan memakai ungkapan Indonesia yang lebih alami untuk μιμηταὶ ἐγενήθητε. Catatan a dan b tetap dicantumkan demi mempertahankan jangkar catatan kaki dan alternatif leksikal, walaupun keduanya tidak dipanggil dalam teks utama.
