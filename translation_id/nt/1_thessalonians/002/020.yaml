  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: id
  text: Sebab kamulah kemuliaan dan sukacita kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebanggaan” atau “kehormatan” untuk “kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kamulah
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit dan bersifat menegaskan. Bentuk '-lah' secara alami menyampaikan penekanan itu dalam bahasa Indonesia.
- source_word: γάρ
  choice: Sebab
  rationale: Kata penghubung ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; 'sebab' mempertahankan hubungan logis tersebut secara ringkas.
- source_word: ἐστε
  choice: adalah (tersirat dalam konstruksi nominal)
  rationale: Kopula kala kini diterjemahkan secara alami melalui konstruksi 'kamulah'; bahasa Indonesia tidak memerlukan kata 'adalah' tersendiri di sini.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: '''Kemuliaan'' mempertahankan padanan utama dan bobot retoris δόξα, sambil membiarkan kemungkinan nuansa kehormatan atau sesuatu yang dibanggakan dijelaskan dalam catatan kaki.'
- source_word: ἡμῶν
  choice: kami
  rationale: Genitif orang pertama jamak menyatakan kepunyaan. 'Kami' sesuai dengan Paulus dan rekan-rekannya serta membedakannya dari para pembaca.
- source_word: ἡ χαρά
  choice: sukacita
  rationale: '''Sukacita'' merupakan padanan nomina yang langsung dan lazim dalam ragam Alkitab Indonesia modern, tanpa menggeser maknanya menjadi tindakan bersukacita.'
theological_decisions:
- issue: Pemaknaan δόξα dalam pernyataan relasional Paulus
  choice: kemuliaan
  alternative: kebanggaan atau kehormatan
  rationale: '''Kemuliaan'' menjaga keluasan makna dan kekuatan retoris istilah Yunani tanpa menyempitkannya menjadi rasa bangga semata. Catatan kaki mempertahankan alternatif leksikal yang benar-benar mungkin.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Kamulah' mempertahankan penekanan pada ὑμεῖς, sedangkan 'kami' mempertahankan pembedaan antara kelompok Paulus dan jemaat Tesalonika.
