  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: id
  text: 'Sebab mereka sendiri memberitakan tentang kami: seperti apa kedatangan kami kepada kalian[a], dan bagaimana kalian berbalik dari berhala-berhala kepada Allah untuk melayani Allah yang hidup dan sejati[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagaimana kami diterima di antara kalian.” Ungkapan Yunani secara harfiah menunjuk pada sifat kedatangan atau jalan masuk kami kepada kalian, dan dalam konteks mencakup dampaknya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bagaimana kalian bertobat kepada Allah dengan meninggalkan berhala-berhala.”
    reason: alternative_reading
  - marker: c
    text: Ungkapan “Allah yang hidup dan sejati” mengontraskan Allah dengan berhala-berhala yang tidak bernyawa; bandingkan Yeremia 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: mereka sendiri
  rationale: Kata ganti intensif ini menegaskan bahwa orang-orang lain itu sendiri menyampaikan laporan tersebut, bukan karena dorongan Paulus.
- source_word: ἀπαγγέλλουσιν
  choice: menceritakan
  rationale: Bentuk kini menunjukkan laporan yang terus beredar; 'menceritakan' alami dalam bahasa Indonesia dan menyampaikan tindakan memberitakan kembali apa yang terjadi.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: bagaimana kami diterima di antara kalian
  rationale: Secara harfiah ungkapan ini berbicara tentang 'seperti apa jalan masuk/kedatangan' Paulus kepada mereka, tetapi dalam konteks mencakup sifat dan hasil kedatangannya. Terjemahan ini alami sambil menyediakan alternatif yang lebih harfiah dalam catatan kaki.
- source_word: πῶς ἐπεστρέψατε
  choice: bagaimana kalian berbalik
  rationale: '''Berbalik'' mempertahankan metafora pertobatan dalam verba Yunani tanpa menggantinya dengan istilah teologis yang lebih teknis.'
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: dari berhala-berhala kepada Allah
  rationale: Susunan Indonesia ini secara alami menyatakan titik asal dan tujuan perubahan arah, dengan keduanya tetap jelas.
- source_word: εἰδώλων
  choice: berhala-berhala
  rationale: Ini padanan langsung dan lazim untuk objek atau ilah kultis yang ditinggalkan jemaat Tesalonika.
- source_word: δουλεύειν
  choice: untuk melayani
  rationale: Dalam konteks pengabdian religius, verba ini menyatakan pelayanan yang tunduk dan setia. 'Melayani' mempertahankan maknanya tanpa memperkerasnya menjadi 'diperbudak' atau mempersempitnya menjadi 'menyembah'.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Allah yang hidup dan benar
  rationale: Frasa ini membedakan Allah dari berhala-berhala yang tidak bernyawa dan palsu; bentuk ini akurat, idiomatis, dan bermartabat.
- source_word: γὰρ
  choice: Sebab
  rationale: '''Sebab'' mempertahankan hubungan penjelasan atau dukungan ayat ini dengan pernyataan sebelumnya.'
theological_decisions:
- issue: Sifat bahasa pertobatan dalam ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: kalian berbalik dari berhala-berhala kepada Allah
  alternative: kalian bertobat/diubahkan kepada Allah dari berhala-berhala
  rationale: Verba aktif Yunani mempertahankan gambaran perubahan arah menuju Allah dan meninggalkan berhala. 'Berbalik' tidak memutuskan secara berlebihan pertanyaan teologis mengenai agensi yang tidak dijelaskan secara lengkap dalam ayat ini.
- issue: Daya makna δουλεύειν dalam hubungan dengan Allah
  choice: melayani
  alternative: menjadi hamba Allah; menyembah
  rationale: '''Melayani'' mencakup pengabdian dan ketaatan religius, tetap dekat dengan ranah makna perhambaan/pelayanan, tetapi tidak memasukkan nuansa keras yang tidak harus ditonjolkan oleh konteks.'
- issue: Kontras θεῷ ζῶντι καὶ ἀληθινῷ dengan berhala
  choice: Allah yang hidup dan benar
  alternative: Allah yang hidup dan sejati
  rationale: '''Benar'' dapat menyatakan bahwa Allah sungguh-sungguh Allah dan bukan ilah palsu. Catatan kaki menjelaskan kontras dengan berhala tanpa menambahkan klaim yang melampaui teks.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. 'Kalian' dipakai untuk menandai bahwa semua pronomina orang kedua dalam ayat ini berbentuk jamak. Struktur kalimat dibuat lancar tanpa menghilangkan hubungan penjelasan yang ditandai γάρ.
