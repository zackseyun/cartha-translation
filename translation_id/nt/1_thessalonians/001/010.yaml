id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: id
  text: dan menantikan Anak-Nya dari surga, yang telah dibangkitkan-Nya dari antara orang mati, yaitu Yesus, yang menyelamatkan kita dari murka yang akan datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: menantikan
  rationale: Kata ini menyatakan penantian yang disertai pengharapan dan secara alami melanjutkan isi pertobatan jemaat dalam ayat 9.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Anak-Nya
  rationale: Terjemahan langsung yang mempertahankan gelar kristologis dan relasi dengan Allah.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dari surga
  rationale: Walaupun bentuk Yunaninya jamak, 'surga' dalam bentuk tunggal merupakan ungkapan Indonesia yang alami untuk makna ini.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: yang telah dibangkitkan-Nya dari antara orang mati
  rationale: Bentuk aktif Yunani tetap tercermin melalui akhiran -Nya yang menunjuk kepada Allah sebagai pelaku; 'dari antara orang mati' menyampaikan frasa sumber secara jelas.
- source_word: Ἰησοῦν
  choice: yaitu Yesus
  rationale: '''Yaitu'' memperjelas bahwa nama Yesus menerangkan ''Anak-Nya'' tanpa menambah isi teologis.'
- source_word: τὸν ῥυόμενον
  choice: yang menyelamatkan
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan partisipel kini sebagai ciri tindakan Yesus, tanpa mempersempitnya menjadi hanya tindakan masa depan.
- source_word: ἐκ τῆς ὀργῆς
  choice: dari murka
  rationale: '''Murka'' mempertahankan kekhususan ὀργή dan tidak memperluasnya menjadi istilah ''penghakiman''.'
- source_word: τῆς ἐρχομένης
  choice: yang akan datang
  rationale: Ungkapan ini alami dan mempertahankan arah eskatologis dari partisipel Yunani.
theological_decisions:
- issue: Hakikat 'murka yang akan datang'
  choice: murka yang akan datang
  alternative: penghakiman yang akan datang; murka yang secara khusus dipahami sebagai kesengsaraan akhir zaman atau penghukuman terakhir
  rationale: Ayat ini tidak menentukan secara sempit bentuk atau tahap murka tersebut. Terjemahan mempertahankan istilah dan ketegangan teologis teks tanpa memasukkan skema eskatologis tertentu.
- issue: Daya partisipel kini ῥυόμενον
  choice: yang menyelamatkan kita
  alternative: yang akan menyelamatkan kita; yang sedang menyelamatkan kita
  rationale: Partisipel kini menggambarkan Yesus sebagai Dia yang menyelamatkan. Konteks 'murka yang akan datang' memiliki orientasi masa depan, tetapi teks tidak memakai bentuk verba masa depan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dijaga dekat dengan alur Yunani, tetapi dibuat alami bagi pembaca umum. Kapitalisasi 'Anak-Nya' mengikuti konvensi penghormatan dalam penerbitan Alkitab bahasa Indonesia.
