id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: id
  text: Sebab, dari kalian firman Tuhan telah bergema, bukan hanya di Makedonia dan Akhaya, tetapi di setiap tempat iman kalian kepada Allah telah tersebar, sehingga kami tidak perlu mengatakan apa pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήχηται
  choice: telah bergema
  rationale: Mempertahankan gambaran bunyi yang kuat dalam verba Yunani sekaligus menyatakan hasil yang masih terasa dari bentuk perfek.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: firman Tuhan
  rationale: Ungkapan baku dan bermartabat dalam bahasa Indonesia yang mempertahankan rumusan Paulus serta keluwesan genitifnya.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Makedonia dan Akhaya
  rationale: Transliterasi nama kedua wilayah sesuai bentuk Yunani dan pemakaian Indonesia yang lazim.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: tetapi di setiap tempat
  rationale: Mempertahankan daya distributif παντί dan nomina konkret τόπῳ; lebih dekat dengan sumber daripada sekadar 'di mana-mana'.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: iman kalian kepada Allah
  rationale: Kepada Allah merupakan ungkapan Indonesia yang alami untuk arah atau orientasi iman yang dinyatakan oleh πρὸς τὸν θεόν.
- source_word: ἐξελήλυθεν
  choice: telah tersebar
  rationale: Dalam konteks kabar mengenai iman, 'telah tersebar' menyampaikan gerak keluar dan hasil berkelanjutan secara alami; terjemahan harfiah 'telah keluar' terasa janggal dalam bahasa Indonesia.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: sehingga kami tidak perlu
  rationale: Menyampaikan konstruksi hasil dengan idiom Indonesia yang jelas dan alami.
- source_word: λαλεῖν τι
  choice: mengatakan apa pun
  rationale: Padanan idiomatis yang tidak menambahkan penekanan di luar teks Yunani.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks menunjuk pada respons percaya jemaat Tesalonika yang terarah kepada Allah, bukan terutama sifat dapat dipercaya; 'iman' juga mempertahankan istilah teologis Paulus tanpa mempersempitnya secara sektarian.
- issue: Relasi genitif dalam ὁ λόγος τοῦ κυρίου
  choice: firman Tuhan
  alternative: pesan dari Tuhan; pesan tentang Tuhan
  rationale: Bentuk ringkas ini mempertahankan kemungkinan bahwa firman itu berasal dari, menjadi milik, atau mengenai Tuhan, tanpa memutuskan nuansa yang tidak ditentukan oleh genitif Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa pronomina orang kedua dalam bahasa Yunani berbentuk jamak. Struktur kalimat tetap mengikuti alur retoris sumber, tetapi ungkapan yang terlalu harfiah diluweskan agar mudah dipahami.
