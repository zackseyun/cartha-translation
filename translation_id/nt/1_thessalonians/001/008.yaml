    issue: “dari antara kalian” untuk ἀφ’ ὑμῶν
    rationale: Preposisi ἀπό dengan pronomina jamak menyatakan asal/sumber, “dari kalian,” bukan “dari antara kalian.” Tambahan “antara” berpotensi membatasi sumber pada suatu bagian dari jemaat, suatu pembatasan yang tidak ada dalam teks.
