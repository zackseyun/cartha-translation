  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: id
  text: sehingga kamu menjadi teladan bagi semua orang percaya di Makedonia dan di Akhaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “contoh” atau “pola.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai hasil dari penerimaan firman dan tindakan meneladani yang disebutkan pada ayat sebelumnya; 'sehingga' secara alami mempertahankan daya konsekutifnya.
- source_word: γενέσθαι
  choice: menjadi
  rationale: Infinitif aoristus sesudah ὥστε menyatakan hasil; konstruksi Indonesia 'sehingga kamu menjadi' menyampaikan maknanya secara wajar.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Merujuk secara jamak kepada jemaat Tesalonika. 'Kamu' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τύπον
  choice: teladan
  rationale: Dalam konteks ini menunjuk kepada contoh yang patut diikuti. 'Teladan' paling alami dan bermartabat; kemungkinan 'contoh' atau 'pola' dipertahankan dalam catatan kaki.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: bagi semua orang percaya
  rationale: Partisipel berfungsi substantival dan menunjuk kepada semua orang yang percaya; 'bagi' menyatakan kelompok yang menerima mereka sebagai teladan.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: di Makedonia
  rationale: Frasa lokatif yang menyebut wilayah Makedonia.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: dan di Akhaya
  rationale: Menghubungkan wilayah kedua sambil mempertahankan pengulangan preposisi dalam bahasa Yunani.
