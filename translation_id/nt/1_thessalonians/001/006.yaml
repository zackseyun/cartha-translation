id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: id
  text: Kalian pun menjadi orang-orang yang meneladani kami dan Tuhan dengan menerima firman itu di tengah penderitaan yang berat, dengan sukacita dari Roh Kudus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan sukacita Roh Kudus”; dapat berarti sukacita yang berasal dari atau dihasilkan oleh Roh Kudus.
    reason: Mempertahankan ambiguitas hubungan genitif χαρᾶς πνεύματος ἁγίου sambil membiarkan terjemahan utama menyatakan pembacaan sumber yang wajar.
lexical_decisions:
- source_word: μιμηταὶ
  choice: peneladan
  rationale: Kata ini menunjuk kepada orang yang meniru atau mencontoh suatu teladan. “Peneladan” mempertahankan bahasa peneladanan Paulus secara lebih tepat daripada sekadar “pengikut”.
- source_word: ἐγενήθητε
  choice: menjadi
  rationale: 'Bentuk aoris γίνομαι menyatakan perubahan keadaan: jemaat Tesalonika menjadi peneladan.'
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Dalam konteks ini κύριος merujuk kepada Yesus sebagai gelar kristologis.
- source_word: δεξάμενοι
  choice: karena kamu menerima
  rationale: Partisip aoris ini menjelaskan keadaan atau cara mereka menjadi peneladan. Klausa dengan “karena” menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan dasarnya secara berlebihan.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: λόγος di sini adalah berita yang diberitakan. “Firman” mempertahankan diksi khas Paulus, sedangkan penunjuk “itu” mencerminkan artikelnya dan merujuk pada pemberitaan yang telah disebut dalam konteks.
- source_word: ἐν θλίψει πολλῇ
  choice: di tengah banyak penderitaan
  rationale: θλῖψις menyatakan tekanan, kesusahan, atau penderitaan. Ungkapan ini alami dalam bahasa Indonesia dan tidak memasukkan konotasi eskatologis yang belum tentu dimaksudkan.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Padanan langsung dan wajar bagi frasa preposisional tersebut.
- source_word: πνεύματος ἁγίου
  choice: dari Roh Kudus
  rationale: Genitif ini paling mungkin menunjukkan sumber sukacita. “Dari Roh Kudus” menyampaikan nuansa itu dengan jelas dan tetap ringkas.
theological_decisions:
- issue: Hubungan genitif dalam χαρᾶς πνεύματος ἁγίου
  choice: sukacita dari Roh Kudus
  alternative: sukacita Roh Kudus; sukacita yang dihasilkan oleh Roh Kudus
  rationale: Konteks mempertentangkan banyak penderitaan dengan sukacita yang bersumber dari Roh Kudus. Terjemahan utama menyatakan nuansa sumber yang paling mungkin tanpa menguraikan cara kerja Roh secara lebih jauh.
- issue: Objek peneladanan
  choice: kami dan Tuhan
  alternative: kami, juga Tuhan
  rationale: Terjemahan mempertahankan dua objek yang sejajar dalam bahasa Yunani tanpa mengaburkan bahwa Paulus dan rekan-rekannya serta Tuhan sama-sama disebut sebagai teladan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipakai sebagai sapaan jamak kepada jemaat sesuai konteks surat; “peneladan” dipilih untuk menjaga istilah eksplisit mengenai imitasi, meskipun sedikit lebih formal daripada “orang yang mencontoh”.
