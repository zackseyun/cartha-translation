revisions:
- from: Kamu pun menjadi peneladan kami dan Tuhan, karena kamu menerima firman itu di tengah banyak penderitaan dengan sukacita dari Roh Kudus.
  to: Kalian pun menjadi orang-orang yang meneladani kami dan Tuhan dengan menerima firman itu di tengah penderitaan yang berat, dengan sukacita dari Roh Kudus[a].
  rationale: Revisi mengganti istilah yang membalik subjek peneladanan, menghindari kausalitas eksplisit yang tidak ditandai dalam Yunani, dan memakai “penderitaan yang berat” untuk θλίψει πολλῇ. Terjemahan “dari Roh Kudus” dipertahankan sebagai pembacaan sumber yang alami, dengan catatan kaki untuk alternatif yang sah.
