  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: id
  text: 'Paulus, Silwanus, dan Timotius, kepada jemaat[a] orang-orang Tesalonika yang ada di dalam Allah Bapa dan Tuhan Yesus, Sang Mesias[b]: Anugerah bagi kalian dan damai sejahtera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perhimpunan.” Kata Yunani ἐκκλησία menunjuk kepada komunitas yang berhimpun.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus.” Gelar Yunani Χριστός berarti “Mesias”; “Kristus” adalah bentuk transliterasi yang sudah lazim.
    reason: alternative_rendering
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk baku nama Παῦλος dalam bahasa Indonesia.
- source_word: Σιλουανὸς
  choice: Silwanus
  rationale: Mentransliterasikan langsung bentuk Yunani Σιλουανός; bentuk ini dibedakan dari nama Σιλᾶς, yang lazim ditulis Silas.
- source_word: Τιμόθεος
  choice: Timotius
  rationale: Bentuk baku nama Τιμόθεος dalam bahasa Indonesia.
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: Dalam konteks surat ini, 'jemaat' secara alami menunjuk kepada komunitas orang percaya yang berhimpun, bukan gedung gereja.
- source_word: Θεσσαλονικέων
  choice: orang-orang Tesalonika
  rationale: Bentuk genitif jamak ini menunjuk kepada penduduk atau orang yang berasal dari Tesalonika.
- source_word: ἐν
  choice: di dalam
  rationale: Mempertahankan bahasa relasional Paulus tanpa mempersempit maknanya menjadi sekadar 'milik' atau 'berhimpun dalam'.
- source_word: θεῷ πατρὶ
  choice: Allah Bapa
  rationale: Bahasa Yunani tidak memuat kata ganti 'kita', sehingga tidak ditambahkan 'Allah Bapa kita'.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks Perjanjian Baru untuk κύριος.
- source_word: Ἰησοῦ Χριστῷ
  choice: Yesus, Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna 'Mesias'; koma dan 'Sang' membuat fungsi gelarnya jelas dan alami dalam bahasa Indonesia.
- source_word: χάρις
  choice: anugerah
  rationale: Padanan wajar bagi istilah khas salam Paulus, dengan nuansa pemberian baik yang tidak diperoleh karena jasa.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia ini mencakup kedamaian sekaligus kesejahteraan yang terkandung dalam salam tersebut.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Anugerah bagi kalian dan damai sejahtera
  rationale: Mempertahankan posisi ὑμῖν setelah χάρις dan tidak menambahkan kata kerja yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Penerjemahan Χριστός dalam salam
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini gelar tersebut masih dapat dipahami menurut makna leksikalnya. 'Sang Mesias' mempertahankan fungsi gelar itu, sedangkan 'Kristus' adalah bentuk transliterasi tradisional.
- issue: Relasi yang dinyatakan oleh ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: yang ada di dalam Allah Bapa dan Tuhan Yesus, Sang Mesias
  alternative: yang menjadi milik Allah Bapa dan Tuhan Yesus, Sang Mesias
  rationale: '''Di dalam'' mempertahankan keluasan dan ketegangan teologis ungkapan Paulus serta hubungan sejajar jemaat dengan Allah Bapa dan Tuhan Yesus, tanpa mengubahnya menjadi parafrasa kepemilikan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan salam dipertahankan ringkas; 'kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν secara jelas, sedangkan 'orang-orang Tesalonika' menjaga rujukan kepada komunitas penduduk dalam bentuk jamak.
