  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: id
  text: sebab Injil yang kami beritakan tidak sampai kepada kalian hanya dengan kata-kata, tetapi juga dengan kuasa, dengan Roh Kudus, dan dengan keyakinan yang penuh[a]. Kalian tahu sendiri seperti apa kami di antara kalian demi kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan kepastian yang besar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bagaimana kami hidup di antara kalian demi kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον ἡμῶν
  choice: Injil yang kami beritakan
  rationale: Ungkapan ini menyatakan Injil yang diberitakan Paulus dan rekan-rekannya, bukan Injil milik mereka; penambahan relasional ini alami dalam bahasa Indonesia dan menghindari kesan kepemilikan.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: sampai kepada kalian
  rationale: Ungkapan idiomatis ini menunjuk pada datangnya pemberitaan Injil kepada jemaat Tesalonika.
- source_word: ἐν λόγῳ μόνον
  choice: hanya dengan kata-kata
  rationale: Menjaga kontras antara penyampaian verbal semata dan pemberitaan yang disertai kuasa serta karya Roh Kudus.
- source_word: ἐν δυνάμει
  choice: dengan kuasa
  rationale: Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan kesejajaran tiga frasa dengan 'dengan'.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dengan Roh Kudus
  rationale: Dalam pemakaian Paulus, frasa ini menunjuk kepada Roh Kudus; kapitalisasi menandai rujukan tersebut tanpa menambahkan penjelasan doktrinal.
- source_word: πληροφορίᾳ πολλῇ
  choice: dengan keyakinan yang penuh
  rationale: Menyampaikan gagasan kepastian atau keyakinan yang utuh sambil tidak menentukan secara eksplisit apakah terutama terdapat pada para pemberita, para pendengar, atau keseluruhan peristiwa pemberitaan.
- source_word: καθὼς οἴδατε
  choice: Kalian sendiri tahu
  rationale: Menyampaikan penegasan bahwa jemaat dapat mengukuhkan hal tersebut dari pengalaman mereka sendiri.
- source_word: οἷοι ἐγενήθημεν ἐν ὑμῖν
  choice: bagaimana kami hidup di antara kalian
  rationale: Ungkapan Yunani menyoroti watak atau corak keberadaan para pemberita di tengah jemaat; bentuk Indonesia ini alami dan tidak menyiratkan bahwa mereka sekadar tampak atau kemudian terbukti demikian.
- source_word: δι’ ὑμᾶς
  choice: demi kepentingan kalian
  rationale: Menyatakan tujuan atau manfaat bagi jemaat, sambil mencerminkan daya ungkap διά dengan akusatif.
theological_decisions:
- issue: Rujukan πνεύματι ἁγίῳ
  choice: Roh Kudus
  alternative: roh yang kudus atau suasana rohani
  rationale: Konteks Paulus dan kontras dengan kata-kata semata mendukung rujukan kepada Roh Kudus sebagai pelaku ilahi.
- issue: Subjek πληροφορίᾳ πολλῇ
  choice: Tidak dinyatakan secara eksplisit dalam teks utama
  alternative: keyakinan besar para pemberita atau kepastian penuh para pendengar
  rationale: Teks Yunani tidak menyebut secara tegas siapa yang mengalami keyakinan atau kepastian itu, sehingga terjemahan tidak mempersempitnya.
- issue: Makna οἷοι ἐγενήθημεν
  choice: bagaimana kami hidup
  alternative: orang seperti apa kami terbukti atau menjadi
  rationale: Pilihan ini menyatakan kualitas kehadiran dan perilaku para misionaris secara alami tanpa memasukkan gagasan pembuktian yang tidak harus tersurat dalam γίνομαι.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipakai karena penerimanya jamak dan bentuk ini lebih jelas daripada 'kamu'; kalimat dipecah menjadi dua agar alami. Semua penanda catatan kaki tercantum dalam teks utama.
