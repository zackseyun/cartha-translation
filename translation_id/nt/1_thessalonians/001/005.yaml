  to: sebab Injil yang kami beritakan tidak sampai kepada kalian hanya dengan kata-kata, tetapi juga dengan kuasa, dengan Roh Kudus, dan dengan keyakinan yang penuh[a]. Kalian tahu sendiri seperti apa kami di antara kalian demi kalian[b].
  rationale: Revisi memulihkan fokus οἷοι ἐγενήθημεν pada kualitas atau macam pribadi para pemberita tanpa memaksakan nuansa ‘terbukti’ atau ‘menjadi’ yang kurang idiomatis dalam susunan Indonesia ini. Catatan b diubah dari klaim harfiah yang tidak tepat menjadi alternatif kontekstual yang wajar. Unsur-unsur lain dipertahankan karena setia pada sumber dan alami dalam bahasa Indonesia modern.
