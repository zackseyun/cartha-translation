review_pass:
  verdict: revise
  source_fidelity: Frasa utama pada awal ayat menyampaikan kedatangan Injil yang bukan hanya melalui perkataan, melainkan juga dalam/oleh kuasa, Roh Kudus, dan kepastian penuh. Namun, “bagaimana kami hidup” mempersempit οἷοι ἐγενήθημεν menjadi perilaku saja, padahal frasa itu terutama menunjuk pada macam atau kualitas pribadi para pemberita di tengah jemaat. Catatan b juga tidak akurat secara formal karena ἐγενήθημεν bukan sekadar “berada.”
  naturalness: Bahasa draft pada umumnya baku dan jelas. “Kalian tahu sendiri seperti apa kami di antara kalian demi kalian” lebih langsung, alami, dan lebih dekat dengan fokus Yunani daripada “bagaimana kami hidup di antara kalian demi kepentingan kalian.”
  terminology: “Injil,” “kuasa,” dan “Roh Kudus” sudah tepat dan lazim. “Keyakinan yang penuh” dapat menyampaikan πληροφορίᾳ πολλῇ tanpa menentukan subjek keyakinan. “Demi kalian” cukup idiomatis untuk δι’ ὑμᾶς dan menghindari perluasan “kepentingan.”
  issues:
  - severity: medium
    issue: “bagaimana kami hidup” menyempitkan οἷοι ἐγενήθημεν.
    rationale: Teks Yunani menekankan ‘orang/macam apakah kami’ atau kualitas para utusan, bukan hanya cara hidup mereka. Perilaku memang tercakup secara kontekstual, tetapi bukan satu-satunya makna yang dinyatakan.
  - severity: medium
    issue: Catatan kaki b menyebut “kami berada” sebagai padanan lebih harfiah untuk ἐγενήθημεν.
    rationale: ἐγενήθημεν adalah bentuk γίνομαι (‘menjadi’/‘ternyata sebagai’ dalam konteks ini), bukan sekadar verba lokasi ‘berada’. Catatan perlu diganti dengan alternatif yang sungguh mencerminkan frasa Yunani.
