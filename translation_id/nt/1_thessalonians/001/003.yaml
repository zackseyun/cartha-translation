id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: id
  text: sambil mengingat pekerjaan yang lahir dari imanmu[a], jerih payah yang lahir dari kasihmu, dan ketekunan yang lahir dari pengharapanmu kepada Tuhan kita Yesus Sang Mesias[b], di hadapan Allah dan Bapa kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan” atau “kesetiaan” untuk “iman”.
    reason: lexical_alternative
  - marker: b
    text: Yunani “Kristus”; di sini diterjemahkan “Sang Mesias” karena Χριστός berfungsi sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: sambil mengingat
  rationale: Partisipel kini ini meneruskan gagasan ayat sebelumnya; bentuk ini menyatakan tindakan yang berlangsung tanpa mengubahnya menjadi kalimat mandiri.
- source_word: ἔργου τῆς πίστεως
  choice: pekerjaan yang lahir dari imanmu
  rationale: Genitif dapat menunjukkan sumber atau ciri. Ungkapan ini mempertahankan hubungan erat antara pekerjaan dan iman sambil menghasilkan bahasa Indonesia yang alami.
- source_word: κόπου τῆς ἀγάπης
  choice: jerih payah yang lahir dari kasihmu
  rationale: κόπος menekankan usaha berat dan melelahkan; 'jerih payah' lebih kuat daripada sekadar 'pekerjaan' serta mempertahankan kesejajaran retoris.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: ketekunan yang lahir dari pengharapanmu
  rationale: ὑπομονή menunjuk pada daya tahan yang teguh di bawah tekanan. 'Ketekunan' merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: kepada Tuhan kita Yesus, Sang Mesias
  rationale: Frasa genitif paling wajar dipahami berhubungan dengan pengharapan sebagai arah atau tumpuannya. Χριστός diterjemahkan sebagai gelar 'Sang Mesias', bukan sekadar ditransliterasikan.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: di hadapan Allah dan Bapa kita
  rationale: '''Di hadapan'' secara alami menyampaikan arti berada dalam hadirat Allah, sedangkan kedua sebutan tetap dipertahankan sesuai struktur Yunani.'
theological_decisions:
- issue: Makna πίστις dalam τῆς πίστεως
  choice: iman
  alternative: kesetiaan atau kepercayaan
  rationale: '''Iman'' paling sesuai dalam konteks triad iman, kasih, dan pengharapan, tetapi πίστις dapat memiliki nuansa kepercayaan atau kesetiaan; alternatif dipertahankan dalam catatan.'
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus. 'Sang Mesias' menyatakan arti gelar itu secara langsung, sementara bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Hubungan frasa genitif iman, kasih, dan pengharapan
  choice: yang lahir dari
  alternative: pekerjaan iman, jerih payah kasih, dan ketekunan pengharapan
  rationale: Genitif Yunani bersifat ringkas dan dapat menyatakan sumber maupun ciri. 'Yang lahir dari' menyampaikan hubungan yang paling mungkin secara alami, tanpa meniadakan kemungkinan bahwa tindakan-tindakan tersebut juga bercirikan iman, kasih, dan pengharapan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur tiga serangkai Paulus dipertahankan melalui 'pekerjaan ... jerih payah ... ketekunan'. Kata ganti milik tunggal 'mu' mencerminkan bentuk jamak Yunani yang ditujukan kepada jemaat secara kolektif, sesuai kebiasaan bahasa Indonesia.
