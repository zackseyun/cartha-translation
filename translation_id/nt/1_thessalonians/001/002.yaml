source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: id
  text: Kami selalu mengucap syukur kepada Allah atas kamu semua dan menyebut kamu dalam doa-doa kami tanpa henti,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tanpa henti” dapat menerangkan tindakan menyebut mereka dalam doa secara khusus atau ucapan syukur secara keseluruhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Kami ... mengucap syukur
  rationale: Bentuk kini aktif indikatif orang pertama jamak. Ungkapan “mengucap syukur” alami dan bermartabat dalam bahasa Indonesia serta mempertahankan arah rasa syukur kepada Allah.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Dativus ini menandai penerima ucapan syukur.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan temporal yang langsung dan alami untuk πάντοτε.
- source_word: περὶ πάντων ὑμῶν
  choice: atas kamu semua
  rationale: περί dengan genitif menyatakan hal atau orang yang menjadi alasan ucapan syukur; “atas” sesuai dengan idiom Indonesia “mengucap syukur ... atas” dan mempertahankan cakupan πάντων.
- source_word: μνείαν ποιούμενοι
  choice: menyebut kamu
  rationale: Idiom partisipial ini secara harfiah berarti “membuat penyebutan”; “menyebut kamu” terdengar alami dan lebih tepat daripada sekadar “mengingat kamu” dalam konteks doa.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: dalam doa-doa kami
  rationale: ἐπί dengan genitif dalam ungkapan ini bermakna dalam atau pada waktu berdoa. Bentuk jamak “doa-doa” mempertahankan bentuk sumber dan menyiratkan kesempatan berdoa yang berulang.
- source_word: ἀδιαλείπτως
  choice: tanpa henti
  rationale: Padanan alami yang mempertahankan tekanan kuat adverbia tersebut pada ketekunan atau kesinambungan.
theological_decisions:
- issue: Cakupan sintaksis ἀδιαλείπτως
  choice: Ditempatkan sesudah “dalam doa-doa kami,” sehingga secara paling dekat menerangkan tindakan menyebut mereka dalam doa.
  alternative: Adverbia itu dapat menerangkan keseluruhan pernyataan tentang ucapan syukur yang terus-menerus.
  rationale: Urutan Yunani membiarkan keterkaitan adverbia ini tetap ambigu, terlebih karena ayat berikutnya melanjutkan struktur kalimat. Catatan kaki mempertahankan kedua kemungkinan tanpa memutuskan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak surat yang wajar dan bermartabat. “Kamu semua” mempertahankan orang kedua jamak dan sifat inklusif teks sumber; “doa-doa” mempertahankan bentuk jamaknya. Tanda koma akhir mencerminkan bahwa kalimat Yunani berlanjut ke ayat berikutnya.
