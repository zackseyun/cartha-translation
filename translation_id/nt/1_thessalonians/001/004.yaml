lexical_decisions:
- source_word: εἰδότες
  choice: Sebab kami tahu
  rationale: Partisipel ini meneruskan alur penjelasan dari ayat sebelumnya. Bentuk verba finit dengan “sebab” menghasilkan bahasa Indonesia yang wajar dan menyatakan hubungan penjelasannya.
- source_word: ἀδελφοὶ
  choice: Saudara-saudara
  rationale: Sapaan ini mempertahankan bentuk sapaan kekeluargaan jamak dalam bahasa Yunani. Dalam surat-surat Paulus, sapaan tersebut lazimnya mencakup seluruh jemaat, baik laki-laki maupun perempuan.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: yang dikasihi Allah
  rationale: Ungkapan ini mempertahankan makna pasif dan keadaan yang dihasilkan oleh kasih Allah, sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἐκλογὴν
  choice: bahwa kamu telah dipilih-Nya
  rationale: Nomina Yunani ἐκλογή dialihkan menjadi konstruksi verbal agar maknanya jelas dan alami dalam bahasa Indonesia. Akhiran “-Nya” menunjuk kepada Allah sebagai pelaku pemilihan tanpa memperluas pernyataan ayat ini menjadi suatu sistem teologis tertentu.
- source_word: ὑμῶν
  choice: kamu
  rationale: Bentuk jamak ini mengacu kepada jemaat Tesalonika secara kolektif. “Kamu” merupakan padanan jamak yang wajar dalam bahasa Indonesia dan cocok dengan sapaan kepada seluruh jemaat.
theological_decisions:
- issue: Penerjemahan ἐκλογή dalam konteks yang diperdebatkan secara teologis
  choice: bahwa kamu telah dipilih-Nya
  alternative: tentang pemilihan atas kamu
  rationale: Pilihan utama menyampaikan tindakan pemilihan Allah secara alami tanpa menentukan mekanisme, dasar, atau implikasi sistematisnya. Alternatif nominal dicatat agar bentuk nomina Yunani dan ketegangan leksikalnya tetap terlihat.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudara laki-laki dan perempuan
  rationale: “Saudara-saudara” mempertahankan bentuk sapaan komunal secara alami. Catatan kaki menjelaskan bahwa dalam pemakaian Paulus sapaan ini lazimnya mencakup seluruh komunitas orang percaya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan sapaan pastoral Paulus, sedangkan bentuk verbal pada bagian akhir dipilih demi kewajaran bahasa Indonesia tanpa meniadakan bentuk nominal Yunani, yang dicatat dalam catatan kaki.
