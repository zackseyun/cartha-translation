  source_fidelity: 'Teks secara akurat mencerminkan semua unsur utama Yunani: penegasan αὐτοὶ (''kamu sendiri''), hubungan penjelas γάρ (''Sebab''), pengetahuan yang saksama dalam ἀκριβῶς οἴδατε (''tahu benar''), serta perumpamaan kedatangan hari Tuhan yang tidak terduga. Susunan ''datang seperti pencuri pada malam hari'' menyampaikan ὡς ... οὕτως ἔρχεται tanpa menambahkan rincian eskatologis.'
