  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: id
  text: Sebab kamu sendiri tahu benar bahwa hari Tuhan datang seperti pencuri pada malam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: kamu sendiri
  rationale: Pronomina intensif ini menegaskan subjek orang kedua yang sudah terkandung dalam οἴδατε; “kamu sendiri” mempertahankan penekanan itu secara alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan fungsi penjelas tersebut.
- source_word: ἀκριβῶς
  choice: benar
  rationale: Dalam gabungan dengan “tahu”, ungkapan “tahu benar” secara idiomatis menyatakan pengetahuan yang pasti atau saksama tanpa terdengar kaku.
- source_word: οἴδατε
  choice: tahu
  rationale: Padanan langsung dan alami untuk verba yang berarti mengetahui.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang mereka ketahui.
- source_word: ἡμέρα κυρίου
  choice: hari Tuhan
  rationale: Ungkapan eskatologis baku yang merujuk pada hari campur tangan atau penghakiman ilahi, bukan hari ibadah mingguan.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: seperti pencuri pada malam hari
  rationale: Mempertahankan perumpamaan Yunani tentang kedatangan yang tidak terduga dalam bahasa Indonesia yang alami.
- source_word: οὕτως
  choice: diungkapkan melalui susunan “datang seperti”
  rationale: Keterangan cara ini menghubungkan kedatangan dengan perumpamaan. Dalam bahasa Indonesia, maknanya tersampaikan secara alami melalui susunan “datang seperti” tanpa perlu menambahkan “demikianlah”.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini Yunani yang merujuk ke masa depan dipertahankan dengan bentuk “datang”, yang juga dapat menyatakan kepastian dan sifat khas peristiwa mendatang.
theological_decisions:
- issue: Ungkapan eskatologis ἡμέρα κυρίου
  choice: hari Tuhan
  alternative: harinya Tuhan
  rationale: Konteks membicarakan hari eskatologis campur tangan atau penghakiman ilahi. “Hari Tuhan” mempertahankan ungkapan profetis yang mapan dan tidak mengalihkannya menjadi hari ibadah mingguan.
- issue: Daya perumpamaan “seperti pencuri pada malam hari”
  choice: Mempertahankan perumpamaan tanpa penjelasan tambahan
  alternative: Memperluasnya menjadi kedatangan yang rahasia atau mengaitkannya dengan sistem waktu eskatologis tertentu
  rationale: Teks menonjolkan sifat kedatangan yang tidak terduga. Terjemahan tidak boleh memasukkan rincian doktrinal yang tidak dinyatakan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kamu” sesuai dengan sapaan jamak kepada jemaat; “tahu benar” dipilih sebagai ungkapan alami bagi pengetahuan yang saksama. Tidak diperlukan catatan kaki.
