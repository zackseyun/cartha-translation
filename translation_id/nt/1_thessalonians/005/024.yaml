id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: id
  text: Dia yang memanggil kamu setia; Dia juga akan melakukannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dia yang memanggil kamu dapat dipercaya; Dia juga akan menggenapinya.”'
    reason: Alternatif ini memperlihatkan nuansa leksikal πιστός sebagai “dapat dipercaya” dan ποιήσει sebagai “akan menggenapinya”.
lexical_decisions:
- source_word: πιστὸς
  choice: setia
  rationale: Sebagai adjektiva predikatif, kata ini menyatakan bahwa Allah dapat diandalkan dan pasti memenuhi maksud-Nya. “Setia” merupakan padanan baku, alami, dan kuat dalam konteks ini.
- source_word: ὁ καλῶν
  choice: Dia yang memanggil
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menunjuk kepada Allah sebagai pihak yang memanggil. Bentuk ini mempertahankan daya partisipelnya dalam bahasa Indonesia yang alami.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Pronomina ini adalah objek orang kedua jamak. “Kamu” dapat dipakai untuk jemaat secara kolektif dalam bahasa Indonesia modern; konteks surat menunjukkan bahwa yang disapa adalah seluruh komunitas.
- source_word: ὃς
  choice: Dia
  rationale: Pronomina relatif Yunani menghubungkan klausa kedua dengan Dia yang memanggil. Pengulangan “Dia” menghasilkan susunan Indonesia yang lebih alami sambil mempertahankan subjek yang sama.
- source_word: καὶ
  choice: juga
  rationale: 'Kata ini menegaskan kesinambungan: Dia yang memanggil adalah juga Dia yang akan bertindak.'
- source_word: ποιήσει
  choice: akan melakukannya
  rationale: Bentuk futurum ποιέω bermakna luas, yaitu melakukan atau melaksanakan. Sufiks “-nya” secara ringkas menyatakan objek tersirat yang mengacu pada karya pengudusan dan pemeliharaan dalam ayat sebelumnya tanpa menjabarkannya secara berlebihan.
theological_decisions:
- issue: Objek tersirat dari ποιήσει
  choice: akan melakukannya
  alternative: akan menggenapinya / akan mewujudkannya
  rationale: Bahasa Yunani tidak menyebut objek secara eksplisit. Konteks terdekat mengarah kepada apa yang didoakan Paulus dalam ayat 23. “Akan melakukannya” mempertahankan keringkasan dan keterbukaan ungkapan sumber tanpa menentukan lebih jauh bagaimana Allah mengerjakannya.
- issue: Identitas pihak yang memanggil
  choice: Tidak menambahkan kata “Allah” ke dalam teks utama
  alternative: Allah yang memanggil kamu setia
  rationale: Konteks menunjukkan bahwa pihak yang memanggil adalah Allah, tetapi teks Yunani ayat ini hanya menyebut “Dia yang memanggil.” Terjemahan mempertahankan bentuk implisit tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan predikat “setia” ditempatkan setelah subjek agar alami dalam bahasa Indonesia. Huruf kapital pada “Dia” membantu menunjukkan rujukan kepada Allah tanpa menambahkan nama yang tidak muncul secara eksplisit dalam ayat.
