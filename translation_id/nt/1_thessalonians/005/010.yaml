  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: id
  text: yang mati untuk kita, supaya, baik kita terjaga maupun tertidur[a], kita hidup bersama-sama dengan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “baik kita tetap berjaga-jaga maupun tidur.” Ungkapan ini mungkin menggemakan ajakan untuk tetap waspada dalam konteks sekitar, meskipun di sini kemungkinan besar menunjuk pada apakah orang percaya masih hidup atau sudah meninggal.
    reason: Menjelaskan ambiguitas kontekstual antara keadaan hidup atau mati dan kewaspadaan atau kelalaian etis.
lexical_decisions:
- source_word: ἀποθανόντος
  choice: yang telah mati
  rationale: Partisip aoristus ini menerangkan Tuhan Yesus yang disebut pada ayat sebelumnya. Klausa relatif alami dalam bahasa Indonesia dan aspek tindakan yang telah terjadi tetap tampak.
- source_word: περὶ ἡμῶν
  choice: bagi kita
  rationale: Dalam konteks keselamatan, περί dengan genitif berarti demi atau untuk kepentingan kita. “Bagi kita” alami dan tidak mempersempit maknanya menjadi suatu rumusan mekanisme penebusan tertentu.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang dimaksudkan secara ringkas dan alami.
- source_word: γρηγορῶμεν
  choice: kita terjaga
  rationale: “Terjaga” mempertahankan gambaran keadaan bangun serta masih memungkinkan gema makna berjaga-jaga atau waspada dalam konteks sekitar.
- source_word: καθεύδωμεν
  choice: tertidur
  rationale: “Tertidur” membentuk pasangan alami dengan “terjaga” dan mempertahankan metafora tidur yang kemungkinan besar menunjuk pada kematian orang percaya.
- source_word: ἅμα σὺν αὐτῷ
  choice: bersama Dia
  rationale: Gabungan ἅμα dan σύν menyatakan kebersamaan dengan Kristus. “Bersama Dia” menyampaikan maknanya tanpa pengulangan yang kaku.
- source_word: ζήσωμεν
  choice: kita dapat hidup
  rationale: Subjungtif di bawah ἵνα menyatakan tujuan yang dimungkinkan oleh kematian Kristus. “Dapat hidup” terdengar alami dan tidak memberi kesan keraguan belaka.
theological_decisions:
- issue: Makna “terjaga maupun tertidur”
  choice: Teks utama mempertahankan metafora, dengan rujukan utama yang mungkin kepada orang percaya yang masih hidup atau sudah meninggal.
  alternative: Ungkapan itu dapat meneruskan seruan etis dalam konteks dekat dan berarti tetap waspada atau lalai secara rohani.
  rationale: Konteks 4:13–15 dan janji untuk hidup bersama Kristus mendukung kontras antara hidup dan mati, tetapi pemakaian kata-kata yang sama dalam 5:6–7 juga menimbulkan gema kewaspadaan etis. Terjemahan tidak menutup salah satu nuansa itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Huruf kapital pada “Dia” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus. Fragmen “yang telah mati” sengaja mempertahankan hubungan sintaksis dengan sebutan Tuhan Yesus pada ayat sebelumnya.
