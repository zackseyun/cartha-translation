id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: id
  text: Namun, karena kita adalah orang-orang siang, marilah kita tetap sadar dengan mengenakan baju zirah iman[a] dan kasih, serta pengharapan akan keselamatan sebagai helm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan”. Kata Yunani pistis dapat berarti “iman”, “kepercayaan”, atau “kesetiaan”; di sini “iman” dipakai dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah menurut urutan katanya: “dan sebagai helm, pengharapan akan keselamatan”.'
    reason: source_word_order
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Namun, karena kita
  rationale: δέ menandai kontras dengan orang-orang yang disebut sebelumnya, sedangkan konstruksi partisipial berikutnya memberi dasar bagi ajakan tersebut. Ungkapan ini menyampaikan keduanya secara wajar dalam bahasa Indonesia.
- source_word: ἡμέρας ὄντες
  choice: kita adalah orang-orang siang
  rationale: Genitif ἡμέρας menyatakan identitas atau lingkup keberadaan, bukan sekadar waktu. Pilihan ini mempertahankan metafora siang dan kontrasnya dengan malam dalam konteks.
- source_word: νήφωμεν
  choice: marilah kita tetap sadar
  rationale: νήφω dapat berarti tidak mabuk dan, secara kiasan, tetap waspada serta mampu mengendalikan diri. 'Tetap sadar' mempertahankan gema harfiah dan kiasannya tanpa mempersempit makna.
- source_word: ἐνδυσάμενοι
  choice: dengan mengenakan
  rationale: Partisip aoris ini menyatakan tindakan yang menyertai atau menjadi cara untuk menjalankan ajakan utama. 'Dengan mengenakan' alami dalam bahasa Indonesia dan mempertahankan gambaran mengenakan perlengkapan perang.
- source_word: θώρακα
  choice: baju zirah
  rationale: Istilah ini menunjuk pada pelindung tubuh dalam perlengkapan perang. 'Baju zirah' mempertahankan metafora militer dan mudah dipahami pembaca modern.
- source_word: πίστεως
  choice: iman
  rationale: Dalam rangkaian bersama kasih dan pengharapan, 'iman' merupakan padanan paling wajar. Kemungkinan nuansa 'kesetiaan' tetap dicatat dalam catatan kaki.
- source_word: ἀγάπης
  choice: kasih
  rationale: '''Kasih'' adalah padanan baku dan sesuai bagi ἀγάπη dalam rangkaian kebajikan ini.'
- source_word: περικεφαλαίαν
  choice: helm
  rationale: '''Helm'' adalah istilah modern dan langsung dipahami untuk pelindung kepala, sekaligus mempertahankan metafora perlengkapan perang.'
- source_word: ἐλπίδα σωτηρίας
  choice: pengharapan akan keselamatan
  rationale: Genitif σωτηρίας paling wajar dipahami sebagai hal yang menjadi arah atau isi pengharapan. Ungkapan ini juga mempertahankan rangkaian iman, kasih, dan pengharapan.
theological_decisions:
- issue: Makna πίστις dalam metafora baju zirah
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Pasangan iman, kasih, dan pengharapan mendukung arti kebajikan 'iman', tetapi πίστις juga dapat bernuansa 'kesetiaan'; kemungkinan itu tidak disingkirkan dan dicatat dalam catatan kaki.
- issue: Daya ungkap ἡμέρας ὄντες
  choice: kita adalah orang-orang siang
  alternative: kita termasuk dalam siang; kita berasal dari siang
  rationale: Pilihan utama mempertahankan identitas metaforis yang dibangun oleh kontras siang dan malam tanpa menambahkan penjelasan teologis yang tidak dinyatakan langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora siang serta perlengkapan perang dipertahankan. 'Helm' dipilih daripada 'ketopong' agar lebih mudah dipahami pembaca masa kini, sedangkan 'tetap sadar' menjaga kemungkinan gema harfiah tentang kemabukan sekaligus makna kiasan berupa kewaspadaan dan pengendalian diri.
