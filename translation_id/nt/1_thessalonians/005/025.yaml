id: 1TH.5.25
reference: 1 Thessalonians 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀδελφοί, ⸀προσεύχεσθε περὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: id
  text: Saudara-saudara[a], berdoalah untuk kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari,” sebab sapaan ini kemungkinan ditujukan kepada seluruh jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Saudara-saudara
  rationale: Bentuk vokatif jamak dari ἀδελφός. Dalam bahasa Indonesia, “saudara-saudara” secara alami dapat menyapa seluruh jemaat, meskipun bentuk Yunani secara gramatikal maskulin; catatan kaki menjelaskan cakupan yang mungkin mencakup laki-laki dan perempuan.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Imperatif kini orang kedua jamak dari προσεύχομαι. “Berdoalah” merupakan perintah yang alami dan ringkas; kemungkinan nuansa tindakan berkelanjutan tidak perlu dibuat eksplisit dalam seruan singkat ini.
- source_word: περὶ
  choice: untuk
  rationale: Dengan bentuk genitif ἡμῶν, περί menyatakan pihak yang menjadi pokok atau sasaran permohonan doa. “Untuk” adalah padanan Indonesia yang paling idiomatis dalam konteks ini.
- source_word: ἡμῶν
  choice: kami
  rationale: Pronomina orang pertama jamak yang merujuk kepada Paulus dan rekan-rekannya serta tidak mencakup para penerima surat, sehingga “kami” tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan Ἀδελφοί yang berbentuk maskulin kepada jemaat yang kemungkinan terdiri atas laki-laki dan perempuan
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: “Saudara-saudara” mempertahankan bentuk sapaan tradisional dan wajar yang dekat dengan bentuk Yunani tanpa harus membatasi rujukannya hanya kepada laki-laki. Alternatif “saudara-saudari” dicatat untuk memperjelas kemungkinan rujukan kepada seluruh jemaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Bentuk “kami” mempertahankan pembedaan inklusif-eksklusif yang tersedia dalam bahasa Indonesia.
