base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: id
  text: Mengenai masa dan saat[a], Saudara-saudara[b], kalian tidak perlu ditulisi apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Masa dan saat” adalah ungkapan berpasangan yang menunjuk pada rentang waktu dan saat-saat tertentu, terutama dalam konteks tentang peristiwa-peristiwa akhir zaman.
    reason: cultural_note
  - marker: b
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” secara harfiah berbentuk maskulin, tetapi kemungkinan besar menyapa seluruh jemaat, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Περὶ memperkenalkan pokok bahasan, sedangkan δέ menandai peralihan. “Mengenai” menyampaikan peralihan topik secara alami tanpa menambahkan kata temporal seperti “sekarang” atau mempertajamnya menjadi pertentangan.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: masa dan saat
  rationale: χρόνος menunjuk pada waktu dalam rentang atau lamanya, sedangkan καιρός sering menunjuk pada saat tertentu atau yang ditetapkan. Pasangan “masa dan saat” mempertahankan perbedaan itu dalam bahasa Indonesia yang ringkas dan wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini secara bentuk adalah jamak maskulin, tetapi dalam pemakaian jemaat dapat mencakup seluruh komunitas orang percaya. “Saudara-saudara” merupakan sapaan Indonesia yang lazim dan bermartabat; cakupan komunitasnya dijelaskan dalam catatan kaki.
- source_word: οὐ χρείαν ἔχετε
  choice: tidak perlu
  rationale: Ungkapan Yunani ini menyatakan tidak adanya keperluan. “Tidak perlu” adalah padanan Indonesia yang langsung dan alami.
- source_word: ὑμῖν γράφεσθαι
  choice: ada apa pun yang dituliskan kepada kalian
  rationale: Bentuk infinitif pasif γράφεσθαι membiarkan penulisnya tidak disebutkan. Susunan ini mempertahankan kepasifan tersebut dan tidak menambahkan subjek seperti “kami” atau “aku”.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat
  choice: Saudara-saudara
  alternative: saudara-saudara laki-laki dan perempuan; saudara seiman
  rationale: Teks utama mempertahankan bentuk sapaan kekerabatan yang dekat dengan bentuk Yunani tanpa membatasi cakupannya secara eksplisit. Catatan kaki menerangkan bahwa sapaan itu kemungkinan besar ditujukan kepada seluruh jemaat.
- issue: Nuansa eskatologis pasangan χρόνοι dan καιροί
  choice: masa dan saat
  alternative: zaman dan waktu yang ditetapkan
  rationale: Teks Yunani memakai pasangan istilah yang dapat menunjuk pada rentang waktu dan saat-saat tertentu, tetapi tidak secara eksplisit menambahkan kata “ditetapkan”. Terjemahan utama mempertahankan keluasan makna itu, sementara konteks eskatologis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina “kalian” dipakai karena ὑμῖν berbentuk jamak dan ditujukan kepada komunitas. Struktur pasif dipertahankan agar tidak memasukkan penulis yang tidak dinyatakan secara eksplisit dalam teks Yunani.
