  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: id
  text: Pastikan agar tidak seorang pun membalas kejahatan dengan kejahatan kepada siapa pun. Sebaliknya, senantiasa usahakanlah yang baik terhadap satu sama lain dan terhadap semua orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “satu sama lain ... semua orang” tampaknya bergerak dari sesama orang percaya kepada semua orang secara lebih luas.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε μή τις
  choice: Pastikanlah supaya tidak seorang pun
  rationale: Kata perintah jamak ὁρᾶτε diikuti μή τις berfungsi sebagai desakan kepada seluruh jemaat agar berjaga-jaga dan memastikan bahwa tindakan tersebut tidak terjadi; ungkapan ini lebih alami daripada terjemahan harfiah yang berkaitan dengan 'melihat'.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: kejahatan dengan kejahatan
  rationale: Mempertahankan pengulangan leksikal dan rumusan pembalasan yang luas secara moral; 'dengan' menyampaikan hal yang diberikan sebagai balasan dalam bahasa Indonesia alami.
- source_word: τινι
  choice: kepada siapa pun
  rationale: Pronomina datif tak tentu menunjukkan penerima tindakan dan menegaskan bahwa larangan ini berlaku tanpa pengecualian.
- source_word: ἀποδῷ
  choice: membalas
  rationale: Dalam konteks ini verba tersebut berarti memberikan kembali sebagai tanggapan atas perlakuan sebelumnya, yakni melakukan pembalasan.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan temporal langsung dan alami.
- source_word: τὸ ἀγαθὸν
  choice: apa yang baik
  rationale: Adjektiva berartikel ini dipakai secara substantival; padanan tersebut alami dan mempertahankan keluasan kategori moralnya.
- source_word: διώκετε
  choice: kejarlah
  rationale: 'Mempertahankan daya aktif kata perintah: bukan sekadar menyukai kebaikan, melainkan dengan sungguh-sungguh mengusahakannya.'
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: bagi satu sama lain dan bagi semua orang
  rationale: Kata 'bagi' menyampaikan arah serta kepentingan sasaran tindakan secara alami. Susunan dua kelompok dipertahankan, dengan 'semua orang' sebagai padanan eksplisit bagi πάντας.
theological_decisions:
- issue: Cakupan kewajiban etis umat percaya
  choice: Mempertahankan pembedaan antara 'satu sama lain' dan 'semua orang', yang secara wajar bergerak dari relasi timbal balik dalam jemaat menuju lingkup yang lebih luas.
  alternative: '''Semua orang'' hanya mengacu kepada semua orang percaya.'
  rationale: Pasangan εἰς ἀλλήλους καὶ εἰς πάντας mengisyaratkan pelebaran cakupan, tetapi teks utama tidak menambahkan identitas kelompok yang tidak dinyatakan secara eksplisit; nuansa ini dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Bentuk jamak imperatif Yunani disampaikan sebagai seruan kepada komunitas tanpa menambahkan pronomina yang tidak diperlukan. Penanda catatan [a] ditempatkan setelah klausa yang dijelaskannya.
