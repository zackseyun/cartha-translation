id: 1TH.5.21
reference: 1 Thessalonians 5:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: id
  text: Namun, ujilah segala sesuatu[a]; berpeganglah pada apa yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semuanya.” Dalam konteks ini, yang terutama termasuk di dalamnya ialah penilaian terhadap perkataan nubuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral akusatif ini bersifat menyeluruh. “Segala sesuatu” alami dalam bahasa Indonesia dan mempertahankan cakupan luas teks tanpa membatasinya hanya pada nubuat.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa pertentangan ringan terhadap larangan sebelumnya. “Namun” menyampaikan hubungan itu tanpa membuat kontrasnya terlalu keras.
- source_word: δοκιμάζετε
  choice: ujilah
  rationale: Imperatif kini aktif menyatakan tindakan evaluatif yang perlu terus dilakukan. “Ujilah” ringkas dan mempertahankan gagasan memeriksa untuk mengetahui keaslian atau nilainya.
- source_word: τὸ καλὸν
  choice: apa yang baik
  rationale: Kata sifat netral tunggal dengan artikel dipakai secara substantival. “Apa yang baik” merupakan padanan Indonesia yang alami dan tidak terdengar terlalu abstrak.
- source_word: κατέχετε
  choice: berpeganglah pada
  rationale: Imperatif ini menyatakan mempertahankan atau melekat dengan teguh setelah pengujian. “Berpeganglah pada” mengungkapkan komitmen aktif dan berkelanjutan.
theological_decisions:
- issue: Cakupan πάντα dalam konteks nubuat dan pengujian
  choice: Diterjemahkan secara menyeluruh sebagai “segala sesuatu”, dengan konteks terdekat terutama mencakup pengujian perkataan nubuat.
  alternative: Membatasi artinya menjadi “semua nubuat” atau “segala sesuatu yang dikatakan”.
  rationale: Walaupun ayat sebelumnya membicarakan nubuat, teks Yunani memakai πάντα tanpa kata benda pembatas. Terjemahan mempertahankan keluasan dan ketegangan kontekstual itu, bukan mempersempit perintah secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Bentuk imperatif “ujilah” dan “berpeganglah” mempertahankan daya perintah teks serta mudah dipahami pembaca umum.
