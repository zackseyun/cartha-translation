translation:
  language: id
  text: Salamilah semua saudara seiman dengan ciuman kudus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua saudara-saudari seiman”, sebab kata “saudara” dapat merujuk kepada seluruh komunitas orang percaya.
    reason: lexical_alternative
