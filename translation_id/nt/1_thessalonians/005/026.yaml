    text: Pada masa itu, “ciuman kudus” merupakan tanda persekutuan dan kasih di antara orang Kristen yang dikenal secara budaya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salamilah
  rationale: Bentuk imperatif aoristis orang kedua jamak ini menyampaikan ajakan langsung. “Salamilah” merupakan padanan Indonesia yang ringkas, alami, dan sesuai dengan tindakan sosial yang dimaksud.
- source_word: τοὺς ἀδελφοὺς πάντας
  choice: semua saudara seiman
  rationale: πάντας menegaskan seluruh kelompok. ἀδελφούς berbentuk jamak maskulin, tetapi dalam sapaan jemaat dapat menunjuk kepada sesama anggota komunitas percaya. “Saudara seiman” mempertahankan citra kekerabatan sekaligus terdengar alami dalam bahasa Indonesia; kemungkinan cakupan laki-laki dan perempuan dijelaskan dalam catatan.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: dengan ciuman kudus
  rationale: ἐν menyatakan cara atau tindakan penyerta dan secara alami diterjemahkan “dengan”. φίλημα berarti “ciuman”, sedangkan ἁγίῳ menandainya sebagai kudus dalam persekutuan umat percaya.
theological_decisions:
- issue: Cakupan gender ἀδελφοί dalam konteks jemaat
  choice: saudara seiman
  alternative: saudara-saudari seiman
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi pemakaiannya dapat mencakup seluruh jemaat. Teks utama memakai ungkapan Indonesia yang mempertahankan bahasa kekerabatan tanpa secara eksplisit memperluas bentuk Yunani, sedangkan cakupan inklusifnya dicatat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Bentuk “Salamilah” sesuai untuk nasihat rasuli, sedangkan “saudara seiman” mudah dipahami pembaca umum dan mempertahankan gambaran kekeluargaan jemaat.
