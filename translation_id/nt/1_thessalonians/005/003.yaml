  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: id
  text: Ketika mereka berkata, “Damai dan keamanan,”[a] maka kebinasaan mendadak akan menimpa mereka, seperti rasa sakit persalinan pada seorang perempuan hamil,[b] dan mereka sama sekali tidak akan lolos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Damai dan aman.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sakit bersalin.”
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Yunani memakai penyangkalan yang sangat tegas: “mereka sekali-kali tidak akan lolos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Ketika mereka berkata
  rationale: ὅταν dengan bentuk subjungtif memperkenalkan peristiwa mendatang yang waktunya tidak ditentukan. “Ketika” terdengar alami dalam konteks peringatan ini, dan subjek jamak yang tidak disebutkan tetap dipertahankan sebagai “mereka”.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Damai dan aman
  rationale: Ungkapan ini menyampaikan εἰρήνη dan ἀσφάλεια secara alami sebagai seruan atau pernyataan umum dalam bahasa Indonesia. “Aman” mencakup gagasan keamanan atau keselamatan tanpa membuat frasa kutipan terasa kaku.
- source_word: τότε
  choice: saat itulah
  rationale: Menandai akibat yang langsung menyusul pernyataan sebelumnya dan mempertahankan tekanan temporal τότε dengan idiom Indonesia yang wajar.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: kebinasaan mendadak menimpa
  rationale: “Mendadak” mempertahankan unsur tiba-tiba dalam αἰφνίδιος, sedangkan “menimpa” menyampaikan datangnya kebinasaan atas mereka. “Kebinasaan” mempertahankan bobot ὄλεθρος tanpa menentukan hakikat atau durasinya secara lebih rinci.
- source_word: ἡ ὠδὶν
  choice: sakit bersalin
  rationale: Merujuk pada rasa sakit yang menyertai proses persalinan. Ungkapan ini alami, jelas, dan mempertahankan gambaran sumber.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: seorang perempuan hamil
  rationale: Ungkapan partisipial Yunani secara harfiah menggambarkan orang yang mengandung dalam rahim. “Seorang perempuan hamil” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: mereka sama sekali tidak akan lolos
  rationale: Gabungan οὐ μή dengan subjungtif aoris merupakan penyangkalan tegas mengenai masa depan. “Sama sekali tidak akan lolos” menyampaikan penekanan itu secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna ὄλεθρος dalam peringatan eskatologis
  choice: kebinasaan
  alternative: kehancuran; malapetaka
  rationale: Ayat ini menegaskan penghakiman yang berat, tetapi ὄλεθρος sendiri tidak merinci apakah yang dimaksud adalah pemusnahan, kehancuran yang menghancurkan keadaan seseorang, atau bentuk hukuman tertentu. “Kebinasaan” mempertahankan keseriusan dan ketegangan tersebut tanpa memasukkan sistem eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada serius dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara hubungan waktu-akibat, perbandingan dengan persalinan, dan penyangkalan tegas dalam bahasa Yunani tetap dipertahankan.
