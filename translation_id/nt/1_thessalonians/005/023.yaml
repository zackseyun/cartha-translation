id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: id
  text: Semoga Allah sendiri, sumber damai sejahtera, menguduskan kamu sepenuhnya, dan semoga seluruh roh, jiwa, dan tubuh kalian[a] terpelihara tanpa cela pada saat kedatangan Tuhan kita Yesus Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus menyebut “roh, jiwa, dan tubuh”. Para penafsir berbeda pendapat apakah ungkapan ini mengajarkan bahwa manusia terdiri atas tiga bagian atau sekadar menekankan seluruh pribadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, menurut bentuk tradisional, “Tuhan kita Yesus Kristus”.
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς
  choice: sendiri
  rationale: Pemakaian intensif αὐτός menegaskan bahwa Allah sendiri adalah pelaku pengudusan; posisi setelah sebutan Allah wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan menuju doa atau harapan penutup. Dalam konteks ayat tunggal ini, penambahan “sekarang”, “dan”, atau “tetapi” berisiko memberi nuansa yang lebih khusus daripada teks sumber.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Allah sumber damai sejahtera
  rationale: Genitif ini menyatakan Allah yang bercirikan dan memberikan εἰρήνη. Ungkapan Indonesia ini alami sekaligus mempertahankan gelar Paulus.
- source_word: ἁγιάσαι
  choice: semoga ... menguduskan
  rationale: Optatif aoris menyatakan doa atau harapan. “Menguduskan” mempertahankan kaitan leksikal dan teologis dengan kekudusan.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Kata ganti orang kedua jamak menunjuk kepada jemaat secara kolektif; “kamu” standar dan tidak menentukan jumlah secara eksplisit dalam bentuknya.
- source_word: ὁλοτελεῖς
  choice: sepenuhnya
  rationale: Menyampaikan kelengkapan pengudusan secara idiomatis tanpa memaksakan analisis bagian-bagian manusia.
- source_word: ὁλόκληρον
  choice: seluruh
  rationale: Menekankan keutuhan atau kelengkapan, lalu mencakup rangkaian roh, jiwa, dan tubuh.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: roh, jiwa, dan tubuhmu
  rationale: Ketiga istilah dipertahankan secara berbeda sesuai teks Yunani, sedangkan pronomina genitif jamak dirender secara alami melalui akhiran “-mu” yang merujuk kepada jemaat.
- source_word: ἀμέμπτως
  choice: tanpa cela
  rationale: Adverbia ini menyatakan keadaan ketika mereka dipelihara; “terpelihara tanpa cela” alami dan dekat dengan makna sumber.
- source_word: ἐν τῇ παρουσίᾳ
  choice: pada saat kedatangan
  rationale: Dalam konteks eskatologis Paulus, παρουσία menunjuk pada kedatangan atau kehadiran tiba Tuhan; rumusan ini jelas dan idiomatis.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός merupakan gelar yang berarti Mesias. “Sang” menandai gelar tersebut secara wajar dalam bahasa Indonesia, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif.
theological_decisions:
- issue: Rangkaian antropologis roh, jiwa, dan tubuh
  choice: Mempertahankan ketiga unsur secara eksplisit tanpa menyatakan bahwa ayat ini mengajarkan pembagian manusia menjadi tiga bagian.
  alternative: Memahami rangkaian itu sebagai cara retoris untuk menunjuk seluruh pribadi manusia, atau sebagai pembagian teknis tiga bagian.
  rationale: Teks Yunani menyebut ketiganya tetapi tidak menjelaskan hubungan ontologis di antara mereka. Terjemahan perlu mempertahankan ungkapan dan ketegangan tafsirnya.
- issue: Makna Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Istilah Yunani berfungsi sebagai gelar. Terjemahan maknanya membuat gelar itu transparan, sedangkan bentuk gerejawi tradisional tetap tersedia dalam catatan kaki.
- issue: Cakupan ἀμέμπτως
  choice: Menghubungkannya dengan keadaan seluruh roh, jiwa, dan tubuh ketika dipelihara.
  alternative: Menghubungkannya secara lebih longgar dengan tindakan memelihara atau dengan seluruh pribadi.
  rationale: Susunan Yunani mendukung keadaan “tanpa cela” dalam pemeliharaan, tetapi tidak boleh dipakai untuk menetapkan sistem antropologi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur doa dengan “Semoga” mempertahankan nilai optatif. “Damai sejahtera” dipilih karena idiomatis dalam register Alkitab Indonesia tanpa menjadi arkais. Penanda catatan kaki ditempatkan tepat pada unsur yang diterangkan.
