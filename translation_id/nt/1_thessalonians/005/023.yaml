  terminology: «Menguduskan», «tanpa cela», dan «Sang Mesias» merupakan padanan yang baik. «Damai sejahtera» merupakan pilihan baku yang wajar untuk εἰρήνη dalam register Alkitab Indonesia dan tidak perlu diubah.
