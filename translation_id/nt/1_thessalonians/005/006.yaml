  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: id
  text: Karena itu, janganlah kita tidur seperti orang-orang lain, tetapi marilah kita tetap terjaga[a] dan sadar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjaga-jaga”. Kata kerja Yunani ini dapat menekankan keadaan terjaga atau sikap waspada.
    reason: lexical_alternative
  - marker: b
    text: Atau “menguasai diri” atau “berpikiran jernih”. Kata kerja Yunani ini mencakup keadaan tidak mabuk dan, secara lebih luas, kesiagaan mental serta pengendalian diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Karena itu
  rationale: Gabungan partikel ini menyatakan kesimpulan dari uraian sebelumnya. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan hubungan penalarannya tanpa menggandakan kata penghubung.
- source_word: μὴ καθεύδωμεν
  choice: janganlah kita tidur
  rationale: Subjungtif hortatoris dengan μή menyampaikan ajakan negatif. Kata “tidur” mempertahankan gambaran metaforis Paulus dan kontrasnya dengan keadaan terjaga.
- source_word: ὡς οἱ λοιποί
  choice: seperti orang-orang lain
  rationale: Ungkapan ini menunjuk kepada orang-orang selebihnya di luar kelompok yang sedang disapa. Pilihan ini jelas dan wajar bagi pembaca Indonesia.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Kata ini menandai pertentangan langsung antara tidur dan tetap terjaga.
- source_word: γρηγορῶμεν
  choice: marilah kita tetap terjaga
  rationale: Kata kerja ini dapat berarti tetap bangun atau berjaga-jaga. “Tetap terjaga” mempertahankan antitesis dengan “tidur”, sementara nuansa kewaspadaannya dicatat dalam catatan kaki.
- source_word: νήφωμεν
  choice: dan sadar
  rationale: Kata kerja νήφω mencakup keadaan tidak mabuk serta, secara kiasan, kejernihan pikiran dan pengendalian diri. “Sadar” cukup alami dan tetap membuka kedua nuansa tersebut; alternatif yang lebih eksplisit diberikan dalam catatan kaki.
theological_decisions:
- issue: Daya metaforis tidur dan keterjagaan
  choice: Mempertahankan gambaran “tidur” dan “tetap terjaga” dalam teks utama sebagai nasihat etis-rohani.
  alternative: Memparafrasakannya sebagai kelalaian moral yang dipertentangkan dengan kewaspadaan.
  rationale: Konteks sekitarnya mempertentangkan anak-anak terang dengan mereka yang berkaitan dengan malam. Mempertahankan metafora menjaga jaringan gambaran teologis Paulus tanpa menafsirkannya secara berlebihan.
- issue: Cakupan makna νήφω
  choice: Menerjemahkannya sebagai “sadar”, dengan alternatif “menguasai diri” dan “berpikiran jernih” dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai “menguasai diri” atau “berpikiran jernih”.
  rationale: Teks dapat memuat sekaligus nuansa harfiah tentang tidak mabuk dan nuansa kiasan tentang kesiagaan mental serta pengendalian diri. Pilihan ini tidak membatasi kata tersebut pada satu kebajikan abstrak saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang wajar dan bermartabat. Bentuk “janganlah kita” dan “marilah kita” mempertahankan sifat hortatoris, sedangkan metafora tidur dan terjaga dipertahankan agar hubungan dengan konteks tetap nyata.
