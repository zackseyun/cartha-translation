  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: id
  text: Sebab orang yang tidur, tidur pada malam hari, dan orang yang mabuk, mabuk pada malam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai dasar penjelasan bagi nasihat sebelumnya, dengan daya kausal yang wajar dalam bahasa Indonesia.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: orang yang tidur, tidur
  rationale: Menerjemahkan partisip berartikel secara umum dan mempertahankan pengulangan kata kerja serta kesejajaran retoris teks Yunani.
- source_word: νυκτός
  choice: pada malam hari
  rationale: Genitif ini berfungsi secara adverbial dan menyatakan waktu; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: orang yang mabuk, mabuk
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pengulangan serta kesejajaran teks, tanpa menambahkan penafsiran metaforis.
- source_word: καί
  choice: dan
  rationale: Mempertahankan hubungan koordinatif sederhana antara kedua klausa yang sejajar.
theological_decisions:
- issue: Makna harfiah atau metaforis dari tidur dan mabuk dalam analogi penjelas
  choice: Mempertahankan gambaran harfiah “tidur” dan “mabuk” dalam teks utama
  alternative: Menafsirkannya langsung sebagai ketidaksiagaan rohani dan kehidupan yang tidak terkendali
  rationale: Dalam konteks langsung, Paulus memakai perilaku yang lazim dikaitkan dengan malam untuk menjelaskan nasihat rohani sebelumnya. Terjemahan harfiah mempertahankan analogi dan ketegangan konteks tanpa memasukkan tafsir ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan sengaja dipertahankan untuk mencerminkan struktur paralel Yunani. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu dijelaskan dalam ayat ini.
