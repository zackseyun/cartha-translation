translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ayat diawali dengan huruf kecil karena καὶ meneruskan konstruksi nasihat dari ayat sebelumnya. Ungkapan 'dalam kasih' dipertahankan untuk menjaga citra dan istilah teologis sumber, sedangkan perintah penutup dibuat idiomatis bagi komunitas.
