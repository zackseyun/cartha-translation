  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: id
  text: dan menghargai mereka setinggi-tingginya dalam kasih karena pekerjaan mereka.[a] Hiduplah dalam damai seorang dengan yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat menghargai mereka dalam kasih.” Kata keterangan Yunani yang dipakai di sini memiliki penekanan yang luar biasa kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: menghargai
  rationale: Dalam rangkaian nasihat ini, verba tersebut menyatakan penilaian atau penghargaan terhadap orang-orang yang disebut pada ayat sebelumnya, bukan tindakan memimpin.
- source_word: ὑπερεκπερισσοῦ
  choice: sangat
  rationale: Adverbia yang sangat intensif ini memperkuat perintah untuk menghargai. Dalam bahasa Indonesia, 'sangat menghargai' menyampaikan tekanan itu secara alami; catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah dan luar biasa kuat.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Terjemahan ini mempertahankan istilah utama ἀγάπη dan bentuk preposisionalnya, serta menyatakan suasana atau cara penghargaan itu diberikan.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: karena pekerjaan mereka
  rationale: διά dengan akusatif menyatakan alasan atau dasar penghargaan tersebut, sementara ἔργον dipertahankan sebagai nomina konkret 'pekerjaan'.
- source_word: εἰρηνεύετε
  choice: Hiduplah dalam damai
  rationale: Imperatif kini menyerukan keadaan atau praktik damai yang terus berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan lebih jelas sebagai nasihat komunal.
- source_word: ἐν ἑαυτοῖς
  choice: seorang dengan yang lain
  rationale: Refleksif jamak dalam konteks ini menunjuk pada hubungan timbal balik di dalam jemaat; ungkapan ini lebih alami daripada terjemahan bentuk yang kaku.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan nasihat tersebut dengan rangkaian seruan pada ayat sebelumnya.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada orang-orang yang bekerja, memimpin, dan menasihati jemaat dalam ayat sebelumnya.
