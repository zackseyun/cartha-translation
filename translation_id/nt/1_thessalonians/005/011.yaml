  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: id
  text: Karena itu, hendaklah kalian saling menguatkan[a] dan saling membangun, seperti yang memang kalian lakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling menasihati” atau “saling mendorong”; kata Yunani παρακαλεῖτε dapat mengandung nuansa menguatkan, mendorong, atau mendesak dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: παρακαλεῖτε
  choice: hendaklah kalian saling menguatkan
  rationale: παρακαλέω dapat berarti mendorong, menasihati, menghibur, atau menguatkan. Dalam konteks saling meneguhkan komunitas, 'menguatkan' menyampaikan cakupan makna yang wajar, sementara catatan kaki mempertahankan kemungkinan nuansa desakan atau nasihat.
- source_word: ἀλλήλους
  choice: saling
  rationale: Padanan timbal balik yang alami dalam bahasa Indonesia dan jelas menunjukkan bahwa tindakan itu dilakukan seorang terhadap yang lain.
- source_word: οἰκοδομεῖτε
  choice: saling membangun
  rationale: Mempertahankan metafora pembangunan dalam bentuk yang lazim dan mudah dipahami, dengan pengertian membina atau meneguhkan sesama.
- source_word: εἷς τὸν ἕνα
  choice: saling
  rationale: Ungkapan Yunani ini menegaskan tindakan timbal balik. Pengulangan 'saling' pada verba kedua mempertahankan penekanan tersebut secara idiomatis.
- source_word: καθὼς καὶ ποιεῖτε
  choice: seperti yang memang sedang kalian lakukan
  rationale: '''Seperti'' menyatakan perbandingan, ''memang'' membawa daya penegasan καί, dan ''sedang ... lakukan'' menunjukkan praktik yang berlangsung saat ini.'
