translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti 'kalian' dipakai untuk menyatakan bentuk jamak Yunani secara jelas. Pengulangan 'saling' mempertahankan penekanan timbal balik dari dua ungkapan Yunani yang berbeda.
