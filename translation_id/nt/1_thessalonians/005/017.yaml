lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: tanpa henti
  rationale: Kata keterangan ini menyatakan tindakan yang terus berlangsung atau dilakukan dengan tekun dan berulang-ulang. “Tanpa henti” mempertahankan daya ungkap bahasa Yunani tanpa harus dipahami sebagai doa lisan yang berlangsung setiap detik.
- source_word: προσεύχεσθε
  choice: Berdoalah
  rationale: Bentuk imperatif kini orang kedua jamak menyerukan kebiasaan yang berkelanjutan. “Berdoalah” menyampaikan perintah secara alami dalam bahasa Indonesia, sedangkan sifat berkelanjutannya ditegaskan oleh “tanpa henti”.
theological_decisions:
- issue: Daya praktis perintah ini
  choice: Nasihat umum untuk bertekun dalam doa
  alternative: Tuntutan harfiah untuk mengucapkan doa tanpa jeda setiap saat
  rationale: Gabungan imperatif kini dengan ἀδιαλείπτως mendorong ketekunan dan kesinambungan dalam doa. Terjemahan mempertahankan ketegangan ungkapan teks tanpa memasukkan penafsiran doktrinal atau asketis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, wajar, dan bermartabat. Frasa “tanpa henti” dikenal luas dan mempertahankan kekuatan retoris teks sumber.
