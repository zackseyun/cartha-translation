id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: id
  text: 'Dan kami mendesak kamu, Saudara-saudara[a]: nasihatilah mereka yang hidup tidak tertib[b], berilah semangat kepada mereka yang tawar hati[c], topanglah mereka yang lemah[d], dan bersabarlah terhadap semua orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “Saudara-saudara” di sini ditujukan kepada seluruh jemaat, termasuk laki-laki dan perempuan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “mereka yang bermalas-malasan” atau “mereka yang tidak taat aturan.”
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “hiburlah mereka yang kecil hati.”
    reason: lexical_alternative
  - marker: d
    text: Dapat juga diterjemahkan “dukunglah” atau “tolonglah mereka yang lemah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: kami mendesak
  rationale: Dalam rangkaian nasihat ini, verba tersebut menyampaikan ajakan yang sungguh-sungguh dan kuat. “Mendesak” alami dalam bahasa Indonesia modern tanpa menjadi seformal “menasihati dengan sungguh-sungguh”.
- source_word: δέ
  choice: Dan
  rationale: Partikel ini melanjutkan atau mengalihkan pembahasan, bukan menyatakan pertentangan yang kuat; “Dan” mempertahankan kaitannya dengan nasihat sebelumnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara harfiah berbentuk maskulin, tetapi dalam konteksnya ditujukan kepada seluruh jemaat. “Saudara-saudara” merupakan sapaan jemaat yang wajar dalam bahasa Indonesia dan dapat mencakup laki-laki maupun perempuan; cakupan itu dijelaskan dalam catatan kaki.
- source_word: νουθετεῖτε
  choice: nasihatilah
  rationale: Verba ini berarti memberi arahan atau peringatan korektif dengan tujuan memperbaiki. “Nasihatilah” mempertahankan unsur pastoral dan korektif tanpa membatasi maknanya pada teguran keras.
- source_word: ἀτάκτους
  choice: mereka yang hidup tidak tertib
  rationale: Istilah ini menggambarkan orang yang tidak berada dalam tatanan atau disiplin yang semestinya. Pilihan ini mempertahankan cakupan luasnya dan tidak langsung membatasinya pada kemalasan.
- source_word: παραμυθεῖσθε
  choice: berilah semangat
  rationale: Verba ini menunjuk pada perkataan yang menghibur, menguatkan, atau membesarkan hati. “Berilah semangat” jelas dan alami dalam konteks penggembalaan.
- source_word: ὀλιγοψύχους
  choice: mereka yang tawar hati
  rationale: Kata ini merujuk kepada orang yang kehilangan keberanian, kecil hati, atau mudah putus asa. “Tawar hati” mempertahankan gambaran keadaan batin itu dengan bahasa Indonesia yang bermartabat.
- source_word: ἀντέχεσθε
  choice: topanglah
  rationale: Dengan objek berkasus genitif, verba ini dapat berarti berpegang pada, mendukung, atau menolong seseorang. “Topanglah” menyampaikan dukungan yang aktif dan berkelanjutan.
- source_word: τῶν ἀσθενῶν
  choice: mereka yang lemah
  rationale: Istilah ini dapat mencakup kelemahan fisik, moral, rohani, atau sosial. “Yang lemah” menjaga keluasan makna tersebut.
- source_word: μακροθυμεῖτε
  choice: bersabarlah
  rationale: Verba ini mengacu pada kesabaran dan kelapangan hati terhadap orang lain. “Bersabarlah” merupakan padanan modern yang jelas.
- source_word: πρὸς πάντας
  choice: terhadap semua orang
  rationale: Frasa ini menyatakan sikap yang diarahkan kepada setiap orang. “Terhadap semua orang” mempertahankan cakupan universal perintah tersebut.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί dalam jemaat
  choice: Menggunakan “Saudara-saudara” dalam teks utama dan menjelaskan bahwa sapaan itu mencakup seluruh jemaat.
  alternative: “Saudara-saudari” atau “semua saudara seiman”
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi konteks menunjukkan bahwa Paulus menyapa jemaat secara keseluruhan. Pilihan utama menjaga bentuk sapaan yang lazim sekaligus tidak menutupi cakupan inklusifnya.
- issue: Jenis kelemahan dalam τῶν ἀσθενῶν
  choice: Mempertahankan ungkapan umum “mereka yang lemah”.
  alternative: “mereka yang lemah imannya” atau “mereka yang sakit”
  rationale: Teks tidak menentukan apakah kelemahan itu terutama bersifat fisik, moral, rohani, atau sosial. Terjemahan tidak boleh menyelesaikan ambiguitas ini secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan pastoral. Bentuk perintah jamak diterjemahkan dengan akhiran -lah agar tegas namun tetap bermartabat. Pengulangan “mereka yang” dipertahankan demi kejelasan kelompok-kelompok yang berbeda, sedangkan jenis ketidaktertiban dan kelemahan tidak dipersempit melampaui teks Yunani.
