  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: id
  text: Kiranya kasih karunia Tuhan kita Yesus Kristus menyertai kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: kasih karunia
  rationale: Dalam salam berkat Paulus, χάρις menunjuk pada kemurahan ilahi yang dianugerahkan; “kasih karunia” merupakan padanan Indonesia yang baku, jelas, dan sarat makna teologis.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος di sini adalah gelar bagi Yesus; “Tuhan” mempertahankan bobot kristologisnya dan merupakan padanan Indonesia yang wajar.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: “Yesus” mengikuti bentuk nama yang baku dalam bahasa Indonesia. Dalam formula tetap ini, Χριστός diterjemahkan “Kristus,” bentuk yang telah mapan dan tetap mempertahankan gelar mesianiknya.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kalian
  rationale: Frasa Yunani secara harfiah berarti “bersama kalian.” Karena berfungsi sebagai formula berkat tanpa verba tersurat, “menyertai” menyampaikan verba yang tersirat secara alami. “Kalian” memperjelas bahwa ὑμῶν berbentuk jamak.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam formula penutup Paulus
  choice: Kristus
  alternative: Mesias
  rationale: Dalam bahasa Indonesia, “Yesus Kristus” adalah formula gelar-nama yang mapan dan alami. Pilihan ini tidak menghapus arti mesianik Χριστός, tetapi menghindari ungkapan “Yesus Mesias” yang kurang lazim dalam formula berkat ini.
- issue: Bentuk berkat Yunani yang tidak memiliki verba tersurat
  choice: menyertai kalian
  alternative: kiranya menyertai kalian
  rationale: Teks Yunani merupakan formula berkat eliptis. Menambahkan verba “menyertai” diperlukan agar kalimat Indonesia lengkap, sedangkan tidak menambahkan “kiranya” menjaga bentuknya tetap dekat dengan sumber tanpa mengubahnya menjadi permohonan yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Kalian” dipilih untuk menyatakan orang kedua jamak secara transparan; kalimat tetap sesuai dengan register berkat penutup surat.
