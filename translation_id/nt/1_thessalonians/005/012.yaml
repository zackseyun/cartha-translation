translation:
  language: id
  text: Kami meminta kamu, Saudara-saudara[a], untuk menghargai mereka yang bekerja keras di antara kamu, yang memimpin kamu dalam Tuhan dan yang menasihati kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani secara harfiah berbentuk maskulin, “saudara-saudara,” tetapi dalam konteks ini ditujukan kepada seluruh jemaat, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Kami meminta
  rationale: Menyampaikan permohonan pastoral yang lembut, bukan perintah keras.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan; dalam bahasa Indonesia, alurnya tetap alami tanpa kata penghubung eksplisit.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jemaat yang alami dan bermartabat dalam bahasa Indonesia; konteksnya mencakup seluruh jemaat.
- source_word: εἰδέναι
  choice: menghargai
  rationale: Dalam konteks ini berarti mengenali dan memberi penghargaan yang semestinya, bukan sekadar mengetahui identitas mereka.
- source_word: κοπιῶντας
  choice: mereka yang bekerja keras
  rationale: Menampilkan unsur jerih payah yang terkandung dalam verba Yunani secara jelas dan alami.
- source_word: ἐν ὑμῖν
  choice: di antara kamu
  rationale: Menunjukkan pelayanan yang berlangsung di tengah jemaat.
- source_word: προϊσταμένους ὑμῶν
  choice: yang memimpin kamu
  rationale: Mencakup kepemimpinan atau pengawasan tanpa memasukkan struktur gerejawi tertentu.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan teologis sumber dan mengaitkan kepemimpinan itu dengan Tuhan.
- source_word: νουθετοῦντας
  choice: yang menasihati kamu
  rationale: Menyampaikan pengajaran korektif dan peringatan pastoral dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudara laki-laki; saudara-saudari
  rationale: Dalam pemakaian surat kepada jemaat, bentuk maskulin jamak ini dapat menyapa seluruh komunitas. Ungkapan Indonesia 'Saudara-saudara' secara alami dapat mencakup laki-laki dan perempuan; hal itu dijelaskan dalam catatan.
- issue: Makna εἰδέναι terhadap para pelayan jemaat
  choice: menghargai
  alternative: mengakui; mengenali
  rationale: Konteks mengarah pada pengenalan yang disertai penghargaan, tetapi tidak menyiratkan ketaatan mutlak atau penghormatan berlebihan.
- issue: Daya makna προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: yang memimpin kamu dalam Tuhan
  alternative: yang mengepalai kamu dalam Tuhan; yang mengurus kamu dalam Tuhan
  rationale: Terjemahan ini mempertahankan unsur kepemimpinan sambil menghindari penetapan model hierarki atau jabatan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kamu' dipakai agar jelas dan mudah dipahami. Struktur tiga partisipel dipertahankan dengan pengulangan 'yang' untuk kelancaran dan kejelasan.
