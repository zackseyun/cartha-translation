  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: id
  text: Jauhilah setiap jenis kejahatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap bentuk kejahatan”; secara tradisional, “setiap yang tampak jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Jauhkanlah dirimu
  rationale: Imperatif kini orang kedua jamak ini menyerukan tindakan berkelanjutan untuk menjaga diri tetap jauh. Bentuk bahasa Indonesia ini alami, tegas, dan dapat ditujukan kepada pembaca secara kolektif.
- source_word: ἀπὸ
  choice: dari
  rationale: Menunjukkan pemisahan atau penjauhan sebagai pelengkap alami bagi ἀπέχεσθε.
- source_word: παντὸς
  choice: setiap
  rationale: Bersama εἴδους, bentuk ini paling alami dipahami sebagai 'setiap jenis'.
- source_word: εἴδους
  choice: jenis
  rationale: Dalam konteks ini, makna 'jenis' atau 'macam' lebih mungkin daripada sekadar sesuatu yang tampak dari luar. Pilihan ini tidak mengubah perintah menjadi larangan atas apa pun yang hanya kelihatan jahat.
- source_word: πονηροῦ
  choice: kejahatan
  rationale: Nomina abstrak ini secara langsung dan wajar menyampaikan hal yang jahat dalam konstruksi 'setiap jenis kejahatan'.
theological_decisions:
- issue: Makna εἴδους dalam frasa ἀπὸ παντὸς εἴδους πονηροῦ
  choice: setiap jenis kejahatan
  alternative: setiap bentuk kejahatan; secara tradisional, setiap penampakan kejahatan
  rationale: Dalam konteks ini, εἶδος lebih mungkin berarti jenis atau bentuk daripada penampilan lahiriah. Alternatif dicatat agar keragaman leksikal dan terjemahan tradisional tetap transparan tanpa memasukkan gagasan bahwa orang percaya harus menjauhi segala sesuatu yang hanya tampak jahat.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. 'Jauhkanlah dirimu' dipilih alih-alih 'berpantanglah' karena lebih mudah dipahami pembaca umum dan tetap mempertahankan daya imperatif serta gagasan pemisahan.
