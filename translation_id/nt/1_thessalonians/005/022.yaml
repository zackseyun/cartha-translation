  verdict: revise
  source_fidelity: Makna utama draft—perintah untuk menjauhi setiap jenis kejahatan—setia kepada ἀπὸ παντὸς εἴδους πονηροῦ. Namun, “dirimu” secara normal bersifat tunggal, sedangkan ἀπέχεσθε adalah imperatif orang kedua jamak. Menggunakan “Jauhilah” mempertahankan sapaan jamak yang lazim tidak ditandai dalam bahasa Indonesia tanpa memasukkan pronomina tunggal.
  naturalness: “Jauhilah setiap jenis kejahatan” ringkas, alami dalam bahasa Indonesia modern, dan sesuai register nasihat apostolik. Bentuk ini lebih idiomatis daripada “Jauhkanlah dirimu,” sekaligus menghindari ketidakselarasan jumlah.
  terminology: “Jenis” merupakan padanan yang tepat dan jelas untuk εἶδος dalam konteks ini. “Kejahatan” tepat untuk πονηροῦ. Catatan kaki mempertahankan alternatif “bentuk” dan menerangkan pembacaan tradisional tanpa menjadikan “penampakan” seolah-olah merujuk pada suatu penampakan atau hantu.
  issues:
  - severity: medium
    issue: Ketidakselarasan jumlah dalam “Jauhkanlah dirimu”
    rationale: Kata “dirimu” biasanya mengacu kepada satu orang, sedangkan ἀπέχεσθε ditujukan kepada “kalian.” Bahasa Indonesia tidak wajib menandai jamak pada verba; karena itu “Jauhilah” menyampaikan imperatif kepada kelompok pembaca dengan lebih baik.
  - severity: low
    issue: “Penampakan kejahatan” kurang alami dan berpotensi bermakna lain dalam bahasa Indonesia modern
    rationale: “Penampakan” dapat dipahami sebagai suatu peristiwa atau sosok yang menampakkan diri. Untuk menjelaskan terjemahan tradisional appearance of evil, frasa “setiap yang tampak jahat” lebih komunikatif, sambil tetap ditandai sebagai tradisional.
  revised_text: Jauhilah setiap jenis kejahatan.[a]
