  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: id
  text: Bersyukurlah dalam segala hal[a], sebab inilah kehendak Allah di dalam Mesias Yesus[b] bagi kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam setiap keadaan.” Bahasa Yunani secara harfiah berbunyi “dalam segala hal” dan menunjuk pada keadaan ketika orang percaya harus bersyukur, bukan berarti mereka harus bersyukur atas kejahatan itu sendiri.'
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “Kristus Yesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Frasa ἐν dengan datif paling wajar menyatakan lingkup atau keadaan tempat orang percaya harus bersyukur. Terjemahan ini mempertahankan bentuk ringkas bahasa Yunani tanpa menyiratkan bahwa mereka harus bersyukur atas kejahatan itu sendiri.
- source_word: εὐχαριστεῖτε
  choice: Bersyukurlah
  rationale: Imperatif aktif kini orang kedua jamak menyerukan kebiasaan yang terus dilakukan. Bentuk Indonesia ini langsung, alami, dan tidak menerjemahkan aspek verba secara berlebihan.
- source_word: τοῦτο
  choice: inilah
  rationale: Kata penunjuk ini terutama menunjuk kembali kepada perintah untuk bersyukur. “Inilah” mempertahankan hubungan tersebut dengan jelas tanpa menambahkan penafsiran.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memberikan alasan bagi perintah sebelumnya; “sebab” menyatakan hubungan itu secara ringkas dan wajar.
- source_word: θέλημα θεοῦ
  choice: kehendak Allah
  rationale: Genitif ini menyatakan bahwa kehendak tersebut adalah kehendak Allah; ungkapan Indonesia ini baku dan jelas.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan “Mesias,” sedangkan ἐν dipertahankan untuk menjaga bahasa khas Paulus mengenai hubungan dengan Mesias tanpa menjelaskannya secara sempit.
- source_word: εἰς ὑμᾶς
  choice: bagi kamu
  rationale: Dalam konstruksi ini εἰς dengan orang menyatakan arah atau acuan. “Bagi kamu” secara alami menyampaikan bahwa kehendak Allah itu berkenaan dengan para penerima surat.
theological_decisions:
- issue: Apakah Χριστῷ diterjemahkan sebagai gelar atau memakai bentuk gerejawi tradisional
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός tetap bermakna sebagai gelar bagi Yang Diurapi dalam rumusan ini. “Mesias” menyampaikan makna gelarnya, sementara bentuk tradisional dicatat dalam catatan kaki.
- issue: Makna bersyukur “dalam segala hal”
  choice: Bersyukur dalam setiap keadaan
  alternative: Bersyukur atas segala sesuatu
  rationale: ἐν παντί paling alami menunjukkan keadaan atau lingkup berlangsungnya ucapan syukur. Pilihan ini tidak memaksakan kesimpulan bahwa kejahatan itu sendiri harus menjadi objek ucapan syukur.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk jamak “kamu” dipertahankan sesuai konteks surat kepada jemaat. Susunan “di dalam Mesias Yesus bagi kamu” sengaja dekat dengan bahasa Yunani agar hubungan sintaksis dan ungkapan khas Paulus tidak dipersempit.
