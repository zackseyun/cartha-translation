  terminology: “Allah,” “murka,” “keselamatan,” “Tuhan,” dan “Sang Mesias” konsisten dengan makna sumber dan register yang ditetapkan. Penerjemahan Χριστός sebagai “Sang Mesias” mempertahankan fungsi gelarnya; catatan kaki secara tepat mencatat bentuk tradisional “Yesus Kristus.” Catatan untuk περιποίησις dengan benar mempertahankan kemungkinan cakupan makna yang lebih luas daripada pilihan utama “memperoleh.”
