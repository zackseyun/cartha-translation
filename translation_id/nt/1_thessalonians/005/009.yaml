  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: id
  text: Sebab Allah tidak menetapkan kita untuk mengalami murka, melainkan untuk memperoleh keselamatan[a] melalui Tuhan kita, Yesus Sang Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memiliki keselamatan”, “mendapatkan keselamatan”, atau mungkin “dipelihara sampai pada keselamatan”; kata Yunani περιποίησις memiliki cakupan makna yang lebih luas daripada “memperoleh”.
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk tradisional: “Yesus Kristus”. Gelar Yunani Χριστός diterjemahkan “Sang Mesias” untuk mempertahankan maknanya.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, ὅτι memperkenalkan alasan bagi nasihat sebelumnya. “Sebab” mempertahankan hubungan kausal itu secara wajar dalam bahasa Indonesia.
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεός
  choice: Allah tidak menetapkan kita
  rationale: Dalam konstruksi ini, τίθημι menyatakan penetapan atau penempatan menuju suatu hasil. “Menetapkan” mempertahankan maknanya tanpa menambahkan gagasan predestinasi yang lebih kuat daripada ungkapan Yunani.
- source_word: εἰς ὀργήν
  choice: untuk mengalami murka
  rationale: ὀργή dalam konteks eskatologis Paulus menunjuk pada murka ilahi. Tambahan “mengalami” membuat konstruksi εἰς + akusatif alami dalam bahasa Indonesia tanpa menggantinya dengan istilah yang lebih interpretatif seperti “penghukuman”.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: untuk memperoleh keselamatan
  rationale: περιποίησις dapat menyatakan perolehan, pemilikan, atau pemeliharaan. “Memperoleh keselamatan” paling alami dalam pertentangan dengan mengalami murka, sementara keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: melalui Tuhan kita, Yesus Sang Mesias
  rationale: διά dengan genitif menyatakan sarana atau perantaraan, sehingga diterjemahkan “melalui”. Χριστός diperlakukan sebagai gelar bermakna dan diterjemahkan “Sang Mesias”; koma memperjelas hubungan gelar dan nama dalam bahasa Indonesia.
theological_decisions:
- issue: Kekuatan teologis ἔθετο
  choice: Allah tidak menetapkan kita untuk mengalami murka
  alternative: Allah tidak menentukan kita untuk mengalami murka
  rationale: “Menetapkan” menyatakan maksud atau penunjukan Allah menuju suatu hasil, tetapi tidak memaksakan rumusan predestinasi yang lebih sistematis daripada yang dinyatakan ayat ini.
- issue: Apakah Χριστοῦ diterjemahkan sebagai gelar atau bentuk nama yang sudah membeku
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός tetap membawa makna gelar mesianik. “Sang Mesias” mempertahankan makna tersebut, sedangkan bentuk tradisional “Kristus” dicantumkan dalam catatan kaki.
- issue: Cakupan makna περιποίησις
  choice: memperoleh keselamatan
  alternative: memiliki keselamatan; dipelihara sampai pada keselamatan
  rationale: Konteks mendukung keselamatan sebagai hasil yang dicapai, tetapi nomina Yunani memiliki cakupan lebih luas. Terjemahan utama dibuat alami tanpa menutup kemungkinan leksikal lain, yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur sebab-akibat dan pertentangan Yunani dipertahankan melalui “Sebab … melainkan …”. Istilah teologis “murka” dan “keselamatan” dipertahankan karena tepat dalam konteks Paulus dan lazim bagi pembaca umum.
