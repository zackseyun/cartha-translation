  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: id
  text: Janganlah meremehkan nubuat-nubuat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan-perkataan nubuat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: nubuat-nubuat
  rationale: Bentuk akusatif jamak dari προφητεία menunjuk pada berbagai nubuat atau penyampaian pesan kenabian, bukan hanya konsep nubuat secara abstrak. Pengulangan kata mempertahankan bentuk jamak Yunani secara jelas dan wajar dalam bahasa Indonesia.
- source_word: μὴ
  choice: Janganlah
  rationale: Negasi bersama imperatif kini paling alami dinyatakan sebagai larangan 'Janganlah'; bentuk ini tegas dan bermartabat tanpa menambahkan penekanan seperti 'jangan pernah'.
- source_word: ἐξουθενεῖτε
  choice: meremehkan
  rationale: Kata kerja ini berarti menganggap tidak bernilai, memandang hina, atau memperlakukan dengan sikap merendahkan. 'Meremehkan' alami dalam bahasa Indonesia dan lebih luas daripada sekadar 'menolak'.
theological_decisions:
- issue: Makna 'nubuat-nubuat' dalam konteks jemaat Kristen mula-mula
  choice: Mempertahankan istilah luas 'nubuat-nubuat' tanpa menentukan mekanisme atau kategori doktrinal tertentu.
  alternative: perkataan-perkataan nubuat; pesan-pesan yang diklaim berasal dari Allah
  rationale: Istilah Yunani merujuk pada berbagai wujud nubuat, tetapi ayat ini tidak menjelaskan mekanismenya atau menentukan hubungan praktik tersebut dengan perdebatan doktrinal pada masa kemudian. Terjemahan langsung mempertahankan keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. 'Janganlah' sesuai untuk larangan langsung; 'meremehkan' mudah dipahami pembaca umum. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
