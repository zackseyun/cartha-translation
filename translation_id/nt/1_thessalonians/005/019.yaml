id: 1TH.5.19
reference: 1 Thessalonians 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ πνεῦμα μὴ σβέννυτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: id
  text: Jangan padamkan Roh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh”. Istilah Yunani ini dapat berarti roh secara lebih umum, tetapi di sini kemungkinan besar menunjuk kepada Roh Kudus, terutama karena sesudahnya disebutkan nubuat.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dengan artikel dan dalam konteks nasihat Paulus, terutama penyebutan nubuat pada ayat berikutnya, frasa ini paling mungkin menunjuk kepada Roh Kudus. Huruf kapital menandai rujukan tersebut dalam bahasa Indonesia, meskipun naskah Yunani tidak membedakannya melalui kapitalisasi.
- source_word: μὴ
  choice: Jangan
  rationale: μή bersama bentuk imperatif kini menyatakan larangan; padanan Indonesia yang alami dan langsung ialah “jangan”.
- source_word: σβέννυτε
  choice: padamkan
  rationale: Kata σβέννυμι berarti memadamkan, khususnya api. “Padamkan” mempertahankan metafora sumber Yunani dan wajar digunakan untuk tindakan menekan atau menghentikan karya Roh.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: Roh Kudus, dinyatakan sebagai “Roh”
  alternative: roh manusia atau semangat/karunia rohani
  rationale: Konteks terdekat, khususnya larangan meremehkan nubuat dalam ayat 20, mendukung rujukan kepada Roh Kudus. Namun, karena istilah Yunani dapat berarti “roh” secara lebih umum, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan larangan langsung mempertahankan ketegasan teks Yunani, sedangkan “padamkan” menjaga metafora api tanpa parafrasa.
