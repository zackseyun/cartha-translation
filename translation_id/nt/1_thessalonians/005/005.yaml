  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: id
  text: Sebab kamu semua adalah anak-anak terang dan anak-anak siang.[a] Kita bukanlah milik malam ataupun milik kegelapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra terang dan putra-putra siang.” Ungkapan Yunani ini berarti orang-orang yang menjadi milik atau bercirikan terang dan siang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Sebab kamu semua
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ, sedangkan susunan “kamu semua” menyampaikan cakupan πάντες secara alami dan tegas dalam bahasa Indonesia.
- source_word: υἱοὶ φωτός
  choice: anak-anak terang
  rationale: Dalam ungkapan Semitis-Yunani ini, υἱοί menyatakan orang-orang yang menjadi milik atau bercirikan sesuatu. “Anak-anak terang” merupakan ungkapan Indonesia yang alami, inklusif sesuai cakupan jamaknya, dan tetap mempertahankan metafora kekeluargaan.
- source_word: υἱοὶ ἡμέρας
  choice: anak-anak siang
  rationale: Pilihan ini mempertahankan kesejajaran dengan “anak-anak terang” serta kontras metaforis antara siang dan malam.
- source_word: οὐκ ἐσμὲν
  choice: Kita bukanlah
  rationale: Peralihan dari orang kedua jamak ὑμεῖς kepada orang pertama jamak ἐσμέν dipertahankan. “Kita” secara wajar mencakup penulis bersama para pembaca, dan “bukanlah” memberi penegasan yang sesuai.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: milik malam ataupun milik kegelapan
  rationale: Genitif predikatif di sini menyatakan kepemilikan, keterikatan, atau golongan. Penambahan “milik” membuat maksud itu jelas dalam bahasa Indonesia tanpa menghilangkan pasangan metaforis malam–kegelapan; “ataupun” menyampaikan οὐδέ dalam rangkaian negatif.
theological_decisions:
- issue: Metafora kekeluargaan bergender dalam υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: anak-anak terang dan anak-anak siang
  alternative: putra-putra terang dan putra-putra siang
  rationale: Walaupun υἱοί secara leksikal berarti “putra-putra”, dalam konstruksi idiomatis ini bentuk tersebut mencakup seluruh jemaat dan terutama menyatakan identitas atau kepemilikan. “Anak-anak” mempertahankan metafora tersebut tanpa menimbulkan kesan keliru bahwa hanya laki-laki yang dimaksud. Bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Peralihan persona dari orang kedua ke orang pertama jamak
  choice: kamu semua ... Kita bukanlah ...
  alternative: kamu semua ... Kamu bukanlah ...
  rationale: Teks Yunani beralih dari ὑμεῖς kepada ἐσμέν. Terjemahan mempertahankan peralihan retoris ini sehingga Paulus dan rekan-rekannya tercakup bersama jemaat, tanpa menyelaraskannya secara diam-diam.
- issue: Makna genitif νυκτός dan σκότους
  choice: milik malam ... milik kegelapan
  alternative: dari malam ... dari kegelapan
  rationale: “Milik” mengungkapkan hubungan identitas atau keberpihakan yang tersirat dalam genitif predikatif, sekaligus menghindari kemungkinan bahwa “dari” hanya dipahami sebagai asal-usul tempat atau waktu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora terang–siang serta malam–kegelapan dipertahankan, sementara hubungan genitif dijelaskan secara alami dengan kata “milik”.
