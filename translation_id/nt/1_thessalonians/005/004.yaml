  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: id
  text: Tetapi kamu, Saudara-saudara[a], tidak berada dalam kegelapan, sehingga hari itu[b] tidak akan menyergap kamu seperti pencuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani yang secara harfiah berarti “saudara-saudara laki-laki” di sini dapat mencakup saudara-saudari seiman, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks langsung, yang dimaksud ialah hari Tuhan.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Tetapi kamu
  rationale: δέ menandai pertentangan dengan orang-orang yang disebut sebelumnya, sedangkan ὑμεῖς yang dinyatakan secara eksplisit memberi penekanan. “Tetapi kamu” mempertahankan keduanya secara wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini secara leksikal berbentuk maskulin jamak, tetapi dalam pemakaian kepada jemaat dapat mencakup laki-laki dan perempuan. “Saudara-saudara” adalah sapaan jemaat yang alami dalam bahasa Indonesia, dengan cakupan inklusif dijelaskan dalam catatan kaki.
- source_word: ἐν σκότει
  choice: dalam kegelapan
  rationale: Ungkapan ini mempertahankan citra metaforis Yunani tentang keadaan moral atau rohani tanpa menggantinya dengan penjelasan interpretatif.
- source_word: ἵνα
  choice: sehingga ... tidak akan
  rationale: 'Dalam konstruksi yang bergantung pada pernyataan negatif, ἵνα menyatakan keadaan atau akibat: mereka tidak berada dalam kegelapan sedemikian rupa sehingga hari itu menyergap mereka. “Sehingga” mempertahankan hubungan tersebut tanpa memutuskan secara berlebihan antara nuansa tujuan dan hasil.'
- source_word: ἡ ἡμέρα
  choice: hari itu
  rationale: Artikel menunjuk kepada hari tertentu yang sudah dibicarakan dalam konteks. “Hari itu” alami dalam bahasa Indonesia, sedangkan identifikasinya sebagai hari Tuhan dijelaskan dalam catatan kaki.
- source_word: ὡς κλέπτης
  choice: seperti pencuri
  rationale: Terjemahan ini mempertahankan perbandingan dan citra kedatangan yang mendadak.
- source_word: καταλάβῃ
  choice: menyergap
  rationale: Dalam konteks gambaran pencuri, kata ini menyampaikan tindakan mendapati atau menguasai seseorang secara tiba-tiba. “Menyergap” alami dan mempertahankan unsur keterkejutan, tanpa menambahkan frasa penjelas seperti “secara tidak terduga”.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί dalam jemaat campuran
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk sumber dipertahankan melalui sapaan Indonesia yang lazim, sementara kemungkinan bahwa seluruh jemaat—laki-laki dan perempuan—dimaksudkan dinyatakan dalam catatan kaki.
- issue: Rujukan eskatologis ἡ ἡμέρα
  choice: hari itu
  alternative: hari Tuhan
  rationale: Konteks langsung mengidentifikasinya sebagai hari Tuhan, tetapi teks ayat ini sendiri hanya mengatakan “hari itu.” Terjemahan utama tidak memperluas bunyi sumber; catatan kaki memberi klarifikasi kontekstual.
- issue: Hubungan logis ἵνα setelah pernyataan negatif
  choice: sehingga hari itu tidak akan menyergap kamu
  alternative: supaya hari itu tidak menyergap kamu
  rationale: “Sehingga” lebih baik mempertahankan kemungkinan nuansa akibat atau keadaan tanpa mengharuskan pembacaan tujuan, sedangkan unsur negatif yang tersirat oleh “tidak berada dalam kegelapan” dinyatakan secara alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Saudara-saudara” sesuai dengan konteks surat kepada jemaat. Citra “kegelapan,” “hari,” dan “pencuri” dipertahankan; susunan kalimat dibuat alami tanpa menghilangkan pertentangan dan penekanan teks Yunani.
