base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: id
  text: Aku mengikat kalian dengan sumpah demi Tuhan[a] agar surat ini dibacakan kepada semua saudara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan Tuhan.” Ungkapan Yunani ini dapat berarti bahwa Paulus dengan sungguh-sungguh mengikat mereka dengan sumpah sambil menyerukan Tuhan sebagai otoritasnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “saudara” berbentuk jamak maskulin, tetapi kemungkinan menunjuk kepada seluruh jemaat, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Aku mengikat kamu dengan sumpah
  rationale: Ungkapan ini mempertahankan daya verba Yunani yang berarti mengikat seseorang dengan sumpah atau kewajiban yang sangat khidmat, sekaligus menghindari kata Indonesia “menyumpahi,” yang lazim dipahami sebagai mengutuk.
- source_word: τὸν κύριον
  choice: demi Tuhan
  rationale: Dalam konstruksi dengan ἐνορκίζω, bentuk akusatif ini dapat menunjuk kepada Tuhan sebagai otoritas yang diseru dalam sumpah. “Demi Tuhan” alami dalam bahasa Indonesia dan mempertahankan kekuatan sumpah tersebut.
- source_word: ἀναγνωσθῆναι
  choice: agar ... dibacakan
  rationale: Infinitif pasif aoris ini menyatakan bahwa surat itu harus dibaca, dan konteksnya menunjuk pada pembacaan kepada jemaat. “Dibacakan” mempertahankan bentuk pasif serta secara alami menyiratkan pembacaan dengan suara nyaring kepada orang lain.
- source_word: τὴν ἐπιστολήν
  choice: surat ini
  rationale: Yang dimaksud ialah dokumen yang sedang ditulis Paulus. “Surat ini” merupakan ungkapan Indonesia modern yang alami dan lebih sesuai daripada istilah teknis “epistel.”
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: kepada semua saudara
  rationale: Kata Yunani ἀδελφοῖς berbentuk jamak maskulin dan secara harfiah berarti “saudara-saudara,” tetapi dalam sapaan Paulus sering mencakup seluruh jemaat. Kata “saudara” mempertahankan citra kekeluargaan tanpa memasukkan penafsiran tambahan ke dalam teks utama.
theological_decisions:
- issue: Cakupan ἀδελφοῖς dalam jemaat yang kemungkinan terdiri atas laki-laki dan perempuan
  choice: semua saudara
  alternative: semua saudara seiman, baik laki-laki maupun perempuan
  rationale: Teks Yunani memakai bentuk jamak maskulin, tetapi pemakaian Paulus kemungkinan mencakup seluruh jemaat. Teks utama mempertahankan istilah kekerabatan sumber, sedangkan cakupan yang mungkin inklusif dijelaskan dalam catatan kaki.
- issue: Hubungan τὸν κύριον dengan tindakan bersumpah
  choice: demi Tuhan
  alternative: di hadapan Tuhan
  rationale: Bentuk Yunani dapat dipahami sebagai Tuhan yang diseru sebagai otoritas sumpah. “Demi Tuhan” menyatakan hal itu secara langsung, sementara kemungkinan nuansa Tuhan sebagai saksi di hadapan-Nya tetap dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Frasa “mengikat kamu dengan sumpah” dipilih untuk menyampaikan kekuatan hukum-religius verba Yunani tanpa konotasi mengutuk yang dapat timbul dari “menyumpahi.” Semua penanda catatan kaki dicantumkan dalam teks utama.
