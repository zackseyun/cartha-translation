id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: id
  text: Sesudah itu, kita yang masih hidup, yang masih tinggal, akan diangkat[a] bersama-sama dengan mereka di dalam awan-awan untuk menemui Tuhan di udara[b]. Dengan demikian, kita akan selalu bersama Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “direnggut ke atas.” Kata kerja Yunani menekankan tindakan yang mendadak dan kuat.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk menyambut Tuhan.” Ungkapan ini dapat menunjuk pada tindakan keluar untuk menemui seseorang, tetapi ayat ini sendiri tidak menjelaskan rangkaian peristiwa yang lebih luas di luar pertemuan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Sesudah itu
  rationale: Menandai urutan waktu sesudah kebangkitan orang-orang yang mati dalam Kristus pada ayat sebelumnya.
- source_word: ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι
  choice: kita yang masih hidup dan masih tinggal
  rationale: 'Mempertahankan kedua keterangan yang berulang dalam bahasa Yunani: mereka hidup dan tetap tinggal hingga saat itu, tanpa menyiratkan bahwa mereka lolos dari bahaya tertentu.'
- source_word: ἅμα σὺν αὐτοῖς
  choice: bersama-sama dengan mereka
  rationale: Mengungkapkan kebersamaan dan keserentakan secara wajar dalam bahasa Indonesia.
- source_word: ἁρπαγησόμεθα
  choice: akan diangkat
  rationale: Bentuk pasif futurum ini menyatakan tindakan yang terjadi atas mereka. Pilihan ini alami dalam konteks gerak ke atas, sedangkan catatan kaki mempertahankan tekanan tindakan mendadak dan kuat dari verba Yunani.
- source_word: ἐν νεφέλαις
  choice: dalam awan-awan
  rationale: Mempertahankan bentuk konkret dan jamak dari ungkapan Yunani serta gema gambaran teofani.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: untuk menemui Tuhan
  rationale: Menyampaikan tujuan gerak secara idiomatis tanpa menetapkan rangkaian eskatologis yang tidak dijelaskan oleh ayat ini.
- source_word: εἰς ἀέρα
  choice: di udara
  rationale: Sesudah verba 'menemui', bentuk lokatif ini paling alami dalam bahasa Indonesia meskipun εἰς sendiri memiliki daya arah.
- source_word: καὶ οὕτως
  choice: Demikianlah
  rationale: Menunjukkan hasil atau keadaan yang terjadi melalui rangkaian peristiwa tersebut.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: kita akan selalu bersama Tuhan
  rationale: Mempertahankan jaminan masa depan dan penekanan klimaks pada kebersamaan yang terus berlangsung dengan Tuhan.
theological_decisions:
- issue: Makna ἁρπαγησόμεθα dalam perdebatan mengenai pengangkatan
  choice: akan diangkat
  alternative: akan direnggut ke atas
  rationale: Terjemahan menyatakan tindakan ilahi yang membawa mereka ke atas, tetapi tidak memasukkan skema denominasi tertentu mengenai waktu atau sifat peristiwa itu. Nuansa mendadak dan kuat dicatat sebagai alternatif.
- issue: Makna εἰς ἀπάντησιν τοῦ κυρίου
  choice: untuk menemui Tuhan
  alternative: untuk menyambut Tuhan
  rationale: Pilihan utama menyatakan pertemuan secara langsung tanpa menentukan dari ayat ini saja ke mana rombongan bergerak setelah perjumpaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pengulangan 'masih' mempertahankan dua frasa partisipial Yunani. 'Awan-awan' mempertahankan bentuk jamak, dan istilah teknis atau bahasa yang terikat pada skema eskatologis tertentu dihindari.
