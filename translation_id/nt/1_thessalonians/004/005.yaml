lexical_decisions:
- source_word: μὴ ἐν
  choice: bukan dalam
  rationale: Mempertahankan penyangkalan dan gambaran lingkup atau cara dari frasa Yunani, sambil meneruskan nasihat pada ayat sebelumnya.
- source_word: πάθει ἐπιθυμίας
  choice: gelora hawa nafsu
  rationale: “Gelora” menyampaikan kuatnya πάθος, sedangkan “hawa nafsu” menyatakan ἐπιθυμία yang tidak teratur dan bernuansa seksual dalam konteks ini. Susunan ini alami dalam bahasa Indonesia dan tetap mencerminkan kedua unsur nomina Yunani.
- source_word: καθάπερ καὶ
  choice: seperti juga
  rationale: Menyatakan perbandingan serta mempertahankan daya καί tanpa menghasilkan ungkapan yang kaku.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa lain
  rationale: Istilah Indonesia yang lazim untuk kelompok non-Yahudi dalam pemakaian Paulus; lebih netral daripada “orang-orang kafir” dan lebih kontekstual daripada sekadar “bangsa-bangsa”.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: yang tidak mengenal Allah
  rationale: Klausa relatif menyampaikan keadaan berkelanjutan yang dinyatakan oleh partisip atributif Yunani; “mengenal” mempertahankan makna relasional dan kognitif εἰδότα.
theological_decisions:
- issue: Cakupan τὰ ἔθνη dalam nasihat moral
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa; orang-orang bukan Yahudi; orang-orang kafir
  rationale: Pilihan ini mempertahankan kategori etnis-religius yang lazim dalam tulisan Paulus tanpa menambahkan nada merendahkan dari “kafir”. Klausa “yang tidak mengenal Allah” sendiri menjelaskan pembandingan moral-religius yang dimaksud.
- issue: Daya πάθει ἐπιθυμίας
  choice: gelora hawa nafsu
  alternative: gairah penuh nafsu; hasrat yang menggebu-gebu
  rationale: Konteks etika seksual mendukung arti hasrat yang tidak teratur, tetapi terjemahan tidak menambahkan gagasan bahwa orang itu sepenuhnya dikuasai olehnya. Kedua unsur ungkapan Yunani tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Gelora hawa nafsu” mudah dipahami dalam konteks seksual tanpa menjadi vulgar. Tanda koma akhir dipertahankan karena ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya dan dalam penyajian sumber diakhiri koma.
