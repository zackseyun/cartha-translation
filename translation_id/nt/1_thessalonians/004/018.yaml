  text: Therefore encourage one another with these words[a].
translation:
  language: id
  text: Karena itu, hendaklah kalian saling menguatkan dengan kata-kata ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saling menghibur dengan kata-kata ini.” Kata kerja Yunani ini dapat berarti menguatkan, menghibur, atau menasihati; dalam konteks ini, penghiburan dan peneguhan hati terutama ditekankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Kata ini menyatakan kesimpulan dari ajaran sebelumnya tentang kedatangan Tuhan, kebangkitan orang percaya yang telah meninggal, dan pertemuan bersama dengan Tuhan.
- source_word: παρακαλεῖτε
  choice: hendaklah ... menguatkan
  rationale: Bentuk imperatif kini menuntut tindakan yang berlangsung atau berulang. Dalam konteks penghiburan bagi mereka yang berdukacita, 'menguatkan' mencakup dorongan dan penghiburan tanpa mempersempit maknanya menjadi sekadar nasihat.
- source_word: ἀλλήλους
  choice: saling
  rationale: '''Saling'' secara alami menyampaikan tindakan timbal balik di antara anggota jemaat.'
- source_word: ἐν
  choice: dengan
  rationale: Preposisi ini menunjukkan sarana atau isi yang dipakai untuk menguatkan; 'dengan' merupakan ungkapan Indonesia yang alami.
- source_word: τοῖς λόγοις τούτοις
  choice: perkataan-perkataan ini
  rationale: Frasa ini merujuk pada pernyataan yang baru saja disampaikan Paulus. Bentuk ini mempertahankan acuan konkret kepada λόγοι, bukan mengabstraksikannya menjadi sekadar gagasan.
