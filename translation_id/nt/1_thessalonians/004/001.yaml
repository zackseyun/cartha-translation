revisions:
- from: 'Selanjutnya, Saudara-saudara[a], kami meminta dan mendesak kalian dalam Tuhan Yesus: sebagaimana kalian telah menerima dari kami petunjuk tentang bagaimana kalian harus hidup dan menyenangkan Allah—dan memang demikianlah kalian hidup—hendaklah kalian semakin melakukannya dengan berlimpah.'
  to: Selanjutnya, Saudara-saudara[a], kami meminta dan mendesak kalian dalam Tuhan Yesus agar, sebagaimana kalian telah menerima dari kami petunjuk tentang bagaimana kalian harus hidup dan menyenangkan Allah—dan memang demikianlah kalian hidup—kalian semakin maju lagi.
  rationale: Revisi mengganti ungkapan akhir yang tidak idiomatis dengan "kalian semakin maju lagi," yang secara alami menyampaikan dorongan agar jemaat terus bertumbuh melampaui keadaan mereka sekarang. Struktur dua klausa "sebagaimana" dan pengakuan bahwa mereka sudah hidup demikian tetap dipertahankan. Catatan kaki juga dirumuskan lebih cermat secara leksikal.
