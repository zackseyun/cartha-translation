id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: id
  text: Selanjutnya, Saudara-saudara[a], kami meminta dan mendesak kalian dalam Tuhan Yesus agar, sebagaimana kalian telah menerima dari kami petunjuk tentang bagaimana kalian harus hidup dan menyenangkan Allah—dan memang demikianlah kalian hidup—kalian semakin maju lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini berbentuk maskulin jamak. Dalam sapaan seperti ini, istilah tersebut sering mencakup seluruh jemaat, baik laki-laki maupun perempuan.
    reason: Menjelaskan bentuk gramatikal Yunani dan cakupan kontekstual sapaan tanpa membatasi arti istilah itu secara tidak perlu.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Selanjutnya
  rationale: Menandai peralihan menuju rangkaian nasihat berikutnya. Dalam konteks ini, 'selanjutnya' lebih alami daripada 'akhirnya' dan tidak harus menyiratkan bahwa surat segera berakhir.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini secara alami dapat mencakup seluruh jemaat, baik laki-laki maupun perempuan, sambil tetap berpadanan dekat dengan bentuk Yunani.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: kami meminta dan mendesak kalian
  rationale: '''Meminta'' menyampaikan unsur permohonan, sedangkan ''mendesak'' mempertahankan daya nasihat kuat dari παρακαλοῦμεν. ''Kalian'' memperjelas bahwa sapaan berbentuk jamak.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  rationale: Mempertahankan preposisi ἐν dan gelar kristologis κύριος tanpa mempersempitnya hanya menjadi sarana atau rumusan sumpah.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: sebagaimana kalian telah menerima dari kami petunjuk tentang bagaimana kalian harus hidup
  rationale: παραλαμβάνω menunjuk pada penerimaan ajaran atau petunjuk. 'Hidup' menyampaikan metafora perilaku dari περιπατεῖν secara wajar dalam bahasa Indonesia modern.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: dan menyenangkan Allah
  rationale: Padanan langsung dan alami bagi infinitif yang dikoordinasikan dengan περιπατεῖν.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: dan memang demikianlah kalian hidup
  rationale: Mengakui bahwa jemaat telah menjalankan ajaran itu. 'Memang' menangkap daya penegasan καί secara alami.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: hendaklah kalian semakin melakukannya dengan berlimpah
  rationale: Menyampaikan isi nasihat sebagai seruan agar mereka melampaui keadaan sekarang. 'Dengan berlimpah' mempertahankan citra περισσεύω, sedangkan 'semakin' menerjemahkan μᾶλλον.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara dalam teks utama, dengan catatan bahwa sapaan mencakup seluruh jemaat
  alternative: Saudara-saudara laki-laki dan perempuan
  rationale: Dalam bahasa Indonesia, 'Saudara-saudara' lazim menjadi sapaan kolektif dan tidak perlu diperpanjang, tetapi catatan menjaga transparansi terhadap bentuk maskulin Yunani serta cakupan kontekstualnya.
- issue: Arti ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  alternative: demi Tuhan Yesus / dengan wewenang Tuhan Yesus
  rationale: Terjemahan 'dalam' mempertahankan keluasan relasi, lingkup, dan kemungkinan nuansa kewenangan tanpa menetapkan hanya satu di antaranya.
- issue: Metafora περιπατεῖν
  choice: hidup
  alternative: berjalan
  rationale: Yang dimaksud ialah cara menjalani hidup. 'Hidup' menghindari salah paham harfiah dalam bahasa Indonesia, sementara makna etis Paulus tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat. Bentuk 'kalian' dipakai untuk membedakan orang kedua jamak dari 'Saudara-saudara' sebagai sapaan. Tanda pisah menata dua klausa καθὼς agar kalimat panjang tetap mudah dipahami.
