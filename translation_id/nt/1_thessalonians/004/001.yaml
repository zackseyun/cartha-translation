    rationale: Ungkapan ini janggal dalam bahasa Indonesia dan kurang tepat bagi περισσεύητε μᾶλλον. Paulus meminta agar mereka semakin maju/unggul dalam pola hidup yang sudah mereka jalankan, bukan agar suatu tindakan tak tentu dilakukan "dengan berlimpah."
  - severity: low
    issue: Rumusan catatan kaki tentang arti harfiah ἀδελφοί
    rationale: Yang perlu dijelaskan adalah bentuk maskulin jamaknya dan cakupan sapaan dalam konteks, bukan menetapkan gloss harfiah "saudara-saudara laki-laki" sebagai satu-satunya nilai leksikal.
