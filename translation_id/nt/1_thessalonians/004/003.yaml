  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: id
  text: 'Sebab inilah kehendak Allah: pengudusanmu, yaitu kamu menjauhkan diri dari percabulan[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekudusanmu.”
    reason: lexical_alternative
  - marker: b
    text: Yunani porneia, istilah luas untuk perilaku seksual yang terlarang. Secara tradisional, “percabulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: kehendak
  rationale: “Kehendak” merupakan padanan baku dan alami untuk maksud Allah yang berotoritas; “keinginan” terlalu lemah, sedangkan “tujuan” dapat menyiratkan ketetapan yang lebih sempit daripada konteks ini.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: pengudusanmu
  rationale: “Pengudusan” mempertahankan cakupan ἁγιασμός sebagai keadaan sekaligus proses hidup yang dikhususkan bagi Allah. Bentuk tunggal “-mu” mencerminkan sapaan jamak secara alami dalam bahasa Indonesia.
- source_word: ἀπέχεσθαι
  choice: agar kamu menjauhkan diri
  rationale: Frasa ini menjelaskan isi atau wujud pengudusan. “Menjauhkan diri” menyampaikan tindakan menahan diri dan menghindari secara alami, sedangkan “agar” membuat hubungan penjelasnya jelas.
- source_word: πορνείας
  choice: percabulan
  rationale: “Percabulan” adalah istilah Indonesia yang ringkas dan lazim dalam register Alkitab untuk perilaku seksual yang terlarang. Catatan kaki menerangkan keluasan istilah Yunani agar maknanya tidak dibatasi pada satu jenis pelanggaran saja.
- source_word: γάρ
  choice: Sebab
  rationale: “Sebab” mempertahankan hubungan ayat ini dengan nasihat sebelumnya sebagai alasan atau dasar bagi seruan tersebut.
theological_decisions:
- issue: Makna ἁγιασμός dalam nasihat etis
  choice: Diterjemahkan “pengudusan,” dengan isi etisnya dijelaskan oleh frasa berikutnya.
  alternative: “kekudusanmu” atau “bahwa kamu menjadi kudus”
  rationale: Pilihan ini menjaga keluasan istilah Paulus tanpa membatasinya hanya pada status atau hanya pada proses moral. Struktur ayat sendiri menghubungkannya dengan kemurnian seksual.
- issue: Cakupan πορνεία
  choice: Diterjemahkan “percabulan,” disertai catatan bahwa istilah Yunani mencakup perilaku seksual terlarang secara luas.
  alternative: “perbuatan seksual yang tidak bermoral” atau “dosa seksual”
  rationale: Pilihan ini alami dan bermartabat dalam bahasa Indonesia, sementara catatan kaki mencegah penafsiran yang terlalu sempit serta tidak menambahkan daftar perilaku yang tidak diberikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sebab” menjaga kaitan argumentatif dengan ayat sebelumnya; “yaitu agar” membuat hubungan antara pengudusan dan penjelasan berikutnya mudah dipahami. Istilah “percabulan” dipertahankan karena ringkas dan lazim dalam register Alkitab, dengan keluasan semantiknya dijelaskan dalam catatan kaki.
