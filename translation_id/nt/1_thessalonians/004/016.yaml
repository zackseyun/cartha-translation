  source_fidelity: 'Makna utama dipertahankan dengan baik: ὅτι sebagai penjelasan diterjemahkan “Sebab”; penekanan αὐτὸς ὁ κύριος tercakup dalam “Tuhan sendiri”; ketiga frasa instrumental, asal “dari surga”, kebangkitan, dan urutan “lebih dahulu” semuanya terwakili. Namun, ἀρχαγγέλου lebih tepat dan lebih lazim diterjemahkan “malaikat penghulu,” bukan “penghulu malaikat,” karena yang dimaksud adalah seorang malaikat dengan status penghulu. Koma sebelum klausa terakhir juga lebih baik mempertahankan koordinasi καί dalam satu rangkaian kalimat.'
