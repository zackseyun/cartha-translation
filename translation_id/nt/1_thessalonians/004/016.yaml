  to: Sebab Tuhan sendiri akan turun dari surga dengan seruan perintah[a], dengan suara seorang malaikat penghulu, dan dengan sangkakala Allah, dan mereka yang mati dalam Mesias akan bangkit lebih dahulu.[b]
  rationale: Revisi terbatas pada susunan istilah untuk ἀρχαγγέλου dan pemulihan hubungan koordinatif klausa terakhir. Pilihan “Mesias” dan seluruh ambiguitas tekstual dipertahankan.
