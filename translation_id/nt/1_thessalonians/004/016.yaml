source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: id
  text: Sebab Tuhan sendiri akan turun dari surga dengan seruan perintah[a], dengan suara seorang malaikat penghulu, dan dengan sangkakala Allah, dan mereka yang mati dalam Mesias akan bangkit lebih dahulu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan aba-aba yang diserukan.” Kata Yunani κέλευσμα dapat berarti panggilan, aba-aba, atau seruan yang memerintah.
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “mereka yang mati dalam Kristus akan bangkit lebih dahulu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata penghubung ini memperkenalkan dasar atau penjelasan bagi penghiburan pada ayat sebelumnya.
- source_word: αὐτὸς ὁ κύριος
  choice: Tuhan sendiri
  rationale: Kata ganti intensif αὐτός menekankan bahwa Tuhan sendirilah yang akan turun.
- source_word: ἐν κελεύσματι
  choice: dengan seruan perintah
  rationale: κέλευσμα menunjuk pada perintah atau panggilan yang diserukan; pilihan ini mempertahankan unsur perintah sekaligus sifatnya yang terdengar.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: dengan suara seorang penghulu malaikat
  rationale: Terjemahan ini mempertahankan hubungan genitif dan bentuk tunggal ἀρχαγγέλου tanpa menyiratkan bahwa teks menyebut penghulu malaikat tertentu.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: dengan sangkakala Allah
  rationale: σάλπιγξ adalah alat tiup untuk memberi tanda; 'sangkakala' sesuai dengan konteks kuno dan ragam bahasa Alkitab yang tetap dipahami.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: akan turun dari surga
  rationale: Ungkapan ini menerjemahkan arah gerak καταβήσεται dan asal ἀπ’ οὐρανοῦ secara langsung dan alami.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: mereka yang mati dalam Mesias
  rationale: Bentuk adjektiva substantival οἱ νεκροί diungkapkan secara alami sebagai 'mereka yang mati', sedangkan Χριστός diterjemahkan sebagai gelar 'Mesias'.
- source_word: ἀναστήσονται πρῶτον
  choice: akan bangkit lebih dahulu
  rationale: Bentuk medial ἀναστήσονται diterjemahkan 'akan bangkit', dan πρῶτον menunjukkan urutan terhadap orang percaya yang masih hidup dalam ayat berikutnya.
theological_decisions:
- issue: Makna hubungan frasa 'suara seorang penghulu malaikat' dengan kedatangan Tuhan
  choice: Tidak menjelaskan siapa yang mengeluarkan suara itu
  alternative: Menafsirkan suara itu sebagai suara Tuhan atau sebagai suara penghulu malaikat yang menyertai-Nya
  rationale: Teks hanya menyatakan bahwa kedatangan itu berlangsung 'dengan suara seorang penghulu malaikat'; identitas pembicara dan hubungan tepat antara ketiga bunyi tersebut tidak dijelaskan lebih lanjut.
- issue: Penerjemahan Χριστῷ dalam frasa ἐν Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' menyampaikan arti gelar itu, sedangkan bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sangkakala' dipertahankan karena sesuai dengan alat pemberi tanda dalam konteks kuno, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia masa kini.
