  terminology: “Tuhan,” “surga,” “sangkakala Allah,” dan “Mesias” sesuai register dan keputusan proyek. Catatan kaki untuk “Kristus” mempertahankan padanan tradisional tanpa mengubah pilihan utama. Tidak perlu menentukan identitas penghulu malaikat atau pihak yang bersuara.
