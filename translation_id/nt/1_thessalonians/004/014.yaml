reference: 1 Thessalonians 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: id
  text: Sebab, jika kita percaya bahwa Yesus telah mati dan bangkit, demikian juga Allah akan membawa orang-orang yang telah tertidur melalui Yesus bersama-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang telah meninggal.” Dalam konteks ini, Paulus memakai “tertidur” sebagai metafora bagi kematian orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Frasa “melalui Yesus” dapat juga dikaitkan dengan kata-kata sebelumnya dan diterjemahkan “orang-orang yang telah tertidur di dalam Yesus.” Frasa Yunani itu dapat dipahami sebagai perantaraan (“melalui Yesus”), hubungan erat (“di dalam Yesus”), atau sebab (“karena Yesus”).
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan fungsi γάρ sebagai alasan bagi pernyataan sebelumnya dan εἰ sebagai bentuk pengandaian, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: πιστεύομεν
  choice: kita percaya
  rationale: Menyatakan keyakinan bersama mengenai kematian dan kebangkitan Yesus.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: telah mati dan bangkit
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyampaikan dua peristiwa yang telah terjadi; ἀνέστη bersifat intransitif, sehingga diterjemahkan 'bangkit', bukan 'dibangkitkan'.
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Mempertahankan hubungan korelatif antara kematian dan kebangkitan Yesus dengan tindakan Allah terhadap orang percaya yang telah meninggal.
- source_word: τοὺς κοιμηθέντας
  choice: orang-orang yang telah tertidur
  rationale: Mempertahankan metafora Paulus tentang kematian, sambil menunjukkan keadaan yang timbul dari peristiwa sebelumnya.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: melalui Yesus
  rationale: Mencerminkan arti biasa διά dengan genetif sebagai perantaraan atau sarana tanpa menutup kemungkinan hubungan sintaksis lain.
- source_word: ἄξει σὺν αὐτῷ
  choice: akan membawa bersama-Nya
  rationale: ἄξει menyatakan tindakan mendatang, sedangkan σύν menyatakan penyertaan; rujukan kata ganti paling wajar adalah Yesus.
theological_decisions:
- issue: Metafora kematian dalam κοιμηθέντας
  choice: Mempertahankan metafora 'telah tertidur'.
  alternative: orang-orang yang telah meninggal
  rationale: Metafora ini penting dalam konteks pengharapan kebangkitan dan tidak seharusnya diratakan menjadi keterangan kematian biasa.
- issue: Hubungan sintaksis dan makna διὰ τοῦ Ἰησοῦ
  choice: Menerjemahkan 'melalui Yesus' dalam teks utama.
  alternative: '''di dalam Yesus'' atau ''karena Yesus'''
  rationale: Frasa Yunani ini dapat dipahami sebagai perantaraan, sebab, atau—jika dilekatkan pada partisipel sebelumnya—hubungan erat dengan Yesus. Teks utama mengikuti nilai paling langsung dari διά dengan genetif, sementara catatan mempertahankan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora asli dipertahankan. Kapital pada '-Nya' mengikuti kebiasaan ortografi Indonesia untuk kata ganti yang merujuk kepada pribadi ilahi. Penanda catatan ditempatkan sesudah frasa yang diperdebatkan agar kaitannya jelas.
