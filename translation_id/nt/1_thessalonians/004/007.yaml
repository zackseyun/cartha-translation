id: 1TH.4.7
reference: 1 Thessalonians 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: id
  text: Sebab Allah memanggil kita bukan untuk hidup dalam kecemaran[a], melainkan dalam kekudusan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenajisan.” Dalam konteks ini, kata Yunani tersebut menunjuk pada kecemaran moral, khususnya kecemaran seksual.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengudusan.” Kata Yunani ini dapat menunjuk pada kekudusan sebagai keadaan maupun pada proses dijadikan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan nasihat sebelumnya sebagai dasar atau alasannya; “sebab” alami dan jelas dalam bahasa Indonesia.
- source_word: ἐκάλεσεν
  choice: memanggil
  rationale: Aoristus diterjemahkan secara wajar dengan bentuk verba Indonesia tanpa penandaan kala khusus. “Memanggil” mempertahankan istilah Alkitabiah tanpa menetapkan mekanisme panggilan secara teologis.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: untuk hidup dalam kecemaran
  rationale: ἐπί dengan datif di sini menunjuk pada tujuan atau corak kehidupan. Tambahan “hidup dalam” membuat hubungan itu alami dalam bahasa Indonesia dan sesuai dengan konteks etis, tanpa membatasi kecemaran hanya pada satu jenis dosa.
- source_word: ἀκαθαρσίᾳ
  choice: kecemaran
  rationale: Istilah ini mempertahankan nuansa ketidakmurnian moral dan gema bahasa kekudusan; dalam konteks dekatnya terutama mencakup kecemaran seksual.
- source_word: ἐν ἁγιασμῷ
  choice: dalam kekudusan
  rationale: Terjemahan ini mempertahankan preposisi ἐν dan menyatakan ranah atau corak kehidupan yang berlawanan dengan kecemaran. Kata ἁγιασμός dapat menunjuk baik pada keadaan kudus maupun proses pengudusan.
theological_decisions:
- issue: Makna panggilan Allah
  choice: Panggilan nyata dari Allah yang menjadi dasar hidup kudus, tanpa merumuskan cara kerjanya sebagai doktrin teknis tertentu
  alternative: Undangan umum atau panggilan efektif dalam arti dogmatis yang khusus
  rationale: Ayat menegaskan bahwa Allah memanggil umat-Nya dan bahwa panggilan itu berhubungan dengan kehidupan kudus, tetapi tidak menjelaskan mekanisme panggilan tersebut.
- issue: Arti ἁγιασμός
  choice: kekudusan, dengan catatan bahwa kata Yunani juga dapat berarti pengudusan
  alternative: pengudusan sebagai penekanan pada proses dijadikan kudus
  rationale: Pertentangan langsung dengan kecemaran mendukung arti keadaan atau corak hidup kudus, tetapi kemungkinan makna proses tidak boleh dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa “hidup dalam” dipakai untuk memperjelas hubungan tujuan atau ranah yang tersirat dalam konstruksi Yunani, sedangkan “kecemaran” dan “kekudusan” menjaga pertentangan etis-teologis ayat.
