  source_fidelity: Terjemahan dengan tepat menyampaikan γάρ sebagai dasar bagi nasihat sebelumnya, panggilan Allah, penolakan terhadap ἀκαθαρσία, dan kontrasnya dengan ἐν ἁγιασμῷ. Frasa “untuk hidup dalam kecemaran” secara wajar mengungkapkan orientasi hidup yang tersirat oleh konstruksi Yunani dan konteks dekatnya, tanpa membatasi makna hanya pada dosa seksual.
