reference: 1 Thessalonians 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: id
  text: supaya kamu hidup dengan pantas di hadapan orang-orang di luar jemaat dan tidak memerlukan apa pun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak bergantung pada siapa pun.” Ungkapan ini mungkin menekankan agar mereka tidak bergantung pada orang lain.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil dari nasihat sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: περιπατῆτε
  choice: kamu hidup
  rationale: Secara harfiah berarti ‘berjalan’, tetapi di sini merupakan metafora Paulus bagi cara menjalani hidup. ‘Hidup’ menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: εὐσχημόνως
  choice: dengan pantas
  rationale: Menyatakan perilaku yang patut, tertib, dan terhormat tanpa mempersempit maknanya hanya pada kesopanan.
- source_word: πρὸς τοὺς ἔξω
  choice: di hadapan orang-orang di luar jemaat
  rationale: Mengungkapkan dimensi sosial dan publik dari perilaku orang percaya terhadap mereka yang berada di luar komunitas jemaat.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: tidak memerlukan apa pun
  rationale: Mencerminkan konstruksi ‘tidak mempunyai kebutuhan akan apa pun’ dan mempertahankan cakupan luas frasa Yunani, termasuk kebutuhan materi, tanpa membatasinya hanya kepada ketergantungan pada orang.
theological_decisions:
- issue: Makna klausa penutup μηδενὸς χρείαν ἔχητε
  choice: tidak memerlukan apa pun
  alternative: tidak bergantung pada siapa pun
  rationale: Bentuk Yunani paling wajar dipahami sebagai tidak berkekurangan atau tidak membutuhkan sesuatu. Namun, konteks tentang bekerja dengan tangan sendiri memungkinkan penekanan pada tidak bergantung kepada orang lain; karena itu, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Metafora ‘berjalan’ dialihkan menjadi ‘hidup’ agar makna idiomatisnya jelas, sedangkan ambiguitas pada klausa terakhir dipertahankan melalui catatan kaki.
