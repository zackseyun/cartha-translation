  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: id
  text: Tentang kasih persaudaraan[a], kalian tidak perlu ditulisi[b], sebab kalian sendiri diajar oleh Allah untuk saling mengasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih kepada saudara-saudari seiman”; istilah Yunani memakai gambaran hubungan keluarga dalam komunitas orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kalian tidak mempunyai kebutuhan untuk menulis kepada kalian.” Subjek dari “menulis” tidak disebutkan secara eksplisit dalam bahasa Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tentang
  rationale: Memperkenalkan pokok baru dengan kesinambungan ringan; bahasa Indonesia tidak memerlukan kata temporal seperti 'sekarang'.
- source_word: τῆς φιλαδελφίας
  choice: kasih persaudaraan
  rationale: Mempertahankan gambaran kekeluargaan dalam komunitas orang percaya sekaligus membedakannya dari verba ἀγαπᾶν kemudian dalam ayat ini.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: kalian tidak perlu diberi nasihat melalui surat
  rationale: Infinitif Yunani tidak menyatakan subjek penulis secara eksplisit. Bentuk pasif Indonesia menghindari penambahan 'kami' atau 'siapa pun', sementara 'melalui surat' menyampaikan makna γράφειν secara wajar dalam konteks.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: sebab kalian sendiri
  rationale: Menangkap penekanan dari rangkaian pronomina Yunani secara alami.
- source_word: θεοδίδακτοί ἐστε
  choice: telah diajar oleh Allah
  rationale: Mengungkapkan adjektiva langka yang berarti diajar atau dididik oleh Allah, dengan pelaku ilahi tetap jelas.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: untuk saling mengasihi
  rationale: Menyampaikan arah atau hasil pengajaran Allah secara alami dan mempertahankan bentuk verbal yang berbeda dari φιλαδελφία.
theological_decisions:
- issue: Pembedaan φιλαδελφία dan ἀγαπᾶν dalam ayat yang sama
  choice: Menerjemahkan φιλαδελφία sebagai 'kasih persaudaraan' dan ἀγαπᾶν sebagai 'mengasihi'.
  alternative: Menerjemahkan keduanya hanya dengan bentuk umum dari kata 'kasih'.
  rationale: Pilihan ini mempertahankan peralihan dari kasih bercitra kekeluargaan di antara sesama orang percaya kepada tindakan saling mengasihi, tanpa memaksakan perbedaan teologis yang melampaui teks.
- issue: Subjek tersirat pada γράφειν
  choice: Menggunakan konstruksi pasif 'diberi nasihat melalui surat' tanpa menyebut penulis tertentu.
  alternative: Mengatakan 'kami menulis kepada kalian' atau 'siapa pun menulis kepada kalian'.
  rationale: Teks Yunani tidak menyatakan subjek infinitif secara eksplisit. Konstruksi pasif mempertahankan ketaktertentuan itu dalam bahasa Indonesia yang wajar.
- issue: Nuansa waktu θεοδίδακτοί ἐστε
  choice: telah diajar oleh Allah
  alternative: diajar oleh Allah
  rationale: Bentuk perfektif Indonesia menegaskan keadaan mereka sebagai orang yang sudah menerima pengajaran Allah, tetapi tidak menutup kemungkinan bahwa pengajaran itu terus berpengaruh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan antara orang kedua jamak dan tunggal tetap jelas. Ungkapan 'kasih persaudaraan' bernada luhur tetapi masih umum dipahami; catatan kaki menjelaskan cakupan inklusifnya.
