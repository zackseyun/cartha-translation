id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: id
  text: supaya jangan seorang pun melanggar batas dan mengambil keuntungan dari saudaranya[b] dalam perkara ini[a], sebab Tuhan adalah pembalas mengenai semua hal ini, seperti yang telah kami katakan sebelumnya dan kami peringatkan dengan sungguh-sungguh kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menipu saudaranya dalam perkara itu.” Kata Yunani yang diterjemahkan “mengambil keuntungan dari” dapat berarti mengambil keuntungan dengan merugikan seseorang. Sebagian orang memahami frasa ini secara lebih sempit sebagai penipuan, tetapi dalam konteksnya peringatan ini kemungkinan besar menyangkut pelanggaran seksual.
    reason: lexical_alternative
  - marker: b
    text: “Saudaranya” menerjemahkan ungkapan Yunani berbentuk maskulin tunggal. Kata ini kemungkinan terutama menunjuk pada saudara seiman, meskipun peringatan etis tersebut dapat berlaku lebih luas di dalam jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: supaya jangan seorang pun melanggar batas
  rationale: Infinitif berartikel ini melanjutkan isi nasihat dari ayat sebelumnya. Ungkapan "melanggar batas" mempertahankan metafora tindakan yang melewati batas moral, sedangkan "seorang pun" menyatakan daya generiknya.
- source_word: πλεονεκτεῖν
  choice: memanfaatkan
  rationale: Kata kerja ini menunjuk pada pengambilan keuntungan yang tidak semestinya dengan merugikan orang lain. "Memanfaatkan" cukup luas untuk konteks pelanggaran seksual tanpa membatasinya pada penipuan keuangan.
- source_word: ἐν τῷ πράγματι
  choice: dalam perkara ini
  rationale: Frasa Yunani ini merujuk pada hal yang sedang dibicarakan, tetapi tidak menyebutkannya secara lebih khusus. Pilihan ini mempertahankan kaitannya dengan konteks kesucian seksual dalam ayat 3–5 tanpa menambahkan rincian yang tidak tersurat.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: Bentuk Yunani adalah maskulin tunggal dan kemungkinan besar menunjuk pada saudara seiman. "Saudaranya" alami dalam bahasa Indonesia serta mempertahankan bentuk sumber tanpa menutup penerapan etis yang lebih luas dalam jemaat.
- source_word: ἔκδικος κύριος
  choice: Tuhan adalah pembalas
  rationale: ἔκδικος menyatakan pihak yang membalas kesalahan atau menegakkan keadilan terhadap pelaku. "Pembalas" mempertahankan daya yudisial ungkapan itu, sedangkan κύριος diterjemahkan "Tuhan".
- source_word: περὶ πάντων τούτων
  choice: atas semuanya itu
  rationale: Ungkapan ini mempertahankan cakupan yang luas terhadap seluruh pelanggaran yang sedang dibahas dan terdengar alami bersama kata "pembalas".
- source_word: προείπαμεν
  choice: telah kami katakan sebelumnya
  rationale: Pilihan ini mempertahankan unsur waktu dalam verba majemuk tersebut tanpa mencampurkannya dengan daya peringatan yang lebih kuat pada verba berikutnya.
- source_word: διεμαρτυράμεθα
  choice: kami peringatkan dengan sungguh-sungguh
  rationale: Dalam konteks nasihat ini, verba tersebut menyatakan kesaksian atau peringatan yang tegas dan khidmat. Ungkapan ini menyampaikan intensitasnya dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Rujukan "perkara ini" dan sifat pelanggarannya
  choice: Ayat ini melanjutkan pengajaran tentang etika seksual dalam ayat 3–5 dan melarang seseorang melanggar serta memanfaatkan saudara seiman dalam perkara tersebut.
  alternative: Ayat ini dapat dipahami sebagai larangan umum terhadap penipuan dalam urusan bisnis atau hubungan antarpribadi.
  rationale: Konteks langsung berbicara tentang pengudusan, percabulan, dan penguasaan tubuh dalam kekudusan. Namun, karena πλεονεκτεῖν juga dapat berarti menipu atau mengambil keuntungan secara lebih umum, teks utama tetap memakai ungkapan yang luas dan catatan kaki mencantumkan alternatifnya.
- issue: Cakupan ἀδελφός
  choice: saudaranya
  alternative: saudara seimannya; sesama anggota jemaat
  rationale: Bentuk sumber adalah maskulin tunggal dan kemungkinan berfokus pada saudara seiman. Implikasi etisnya mungkin berlaku lebih luas di dalam komunitas, sehingga hal itu dijelaskan dalam catatan kaki tanpa mengubah bentuk utama.
- issue: Makna κύριος dan ἔκδικος
  choice: Tuhan adalah pembalas
  alternative: Tuhanlah yang menegakkan keadilan; Tuhan akan menuntut pembalasan
  rationale: Ungkapan ini menggambarkan Tuhan sebagai pihak yang mengadili dan membalas pelanggaran. Terjemahan utama menjaga bentuk predikatif serta ketegangan antara pembalasan dan penegakan keadilan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan khidmat. Struktur awal "supaya jangan" mempertahankan hubungan sintaksis dengan ayat sebelumnya. Pronomina "kalian" dipakai agar sapaan jamak kepada jemaat jelas. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
