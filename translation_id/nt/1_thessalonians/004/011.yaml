  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: id
  text: dan hendaklah kalian berusaha sungguh-sungguh untuk hidup tenang, mengurus urusan kalian sendiri, dan bekerja dengan tangan kalian sendiri, sebagaimana kami telah perintahkan kepada kalian,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: berusahalah
  rationale: Verba ini menyatakan menjadikan sesuatu sebagai ambisi atau kehormatan lalu berupaya sungguh-sungguh mencapainya. 'Berusahalah' alami dalam bahasa Indonesia dan mempertahankan daya dorong nasihat, meski nuansa ambisi dijelaskan melalui keputusan leksikal ini.
- source_word: ἡσυχάζειν
  choice: untuk hidup tenang
  rationale: Dalam konteks nasihat ini, ungkapan tersebut menunjuk pada corak hidup yang tenang dan tertib, bukan semata-mata tidak berbicara.
- source_word: πράσσειν τὰ ἴδια
  choice: mengurus urusanmu sendiri
  rationale: Ungkapan Yunani ini berarti menangani hal-hal yang menjadi urusan sendiri. Terjemahan ini alami dan tidak sekeras ungkapan 'jangan mencampuri urusan orang lain'.
- source_word: ἐργάζεσθαι
  choice: bekerja
  rationale: Padanan umum dan alami yang mencakup arti bekerja atau berjerih lelah dalam konteks mencari nafkah.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: dengan tanganmu sendiri
  rationale: Datif berfungsi instrumental. Kata ganti posesif dipertahankan untuk menonjolkan kerja pribadi dengan tangan sendiri.
- source_word: καθὼς
  choice: seperti
  rationale: Secara alami memperkenalkan kesesuaian dengan perintah apostolik yang telah diberikan sebelumnya.
- source_word: παρηγγείλαμεν
  choice: telah kami perintahkan
  rationale: παραγγέλλω menyatakan pengarahan yang berwibawa; 'perintahkan' mempertahankan kekuatan nasihat apostolik tersebut.
theological_decisions:
- issue: Kekuatan etis pengajaran apostolik
  choice: telah kami perintahkan
  alternative: telah kami ajarkan / pesankan
  rationale: Pilihan ini mempertahankan nada berwibawa dari παραγγέλλω tanpa menambahkan muatan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk tunggal '-mu' dipakai secara kolektif untuk mencerminkan bentuk jamak Yunani secara alami dalam rangkaian nasihat kepada jemaat; bila kebijakan proyek mengharuskan penandaan jamak secara eksplisit, dapat digunakan 'kalian', tetapi bentuk tersebut kurang formal.
