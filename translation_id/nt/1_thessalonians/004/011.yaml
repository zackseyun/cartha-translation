review_pass:
  verdict: revise
  source_fidelity: 'Makna rangkaian infinitif Yunani pada umumnya tersampaikan: hidup tenang, menangani urusan sendiri, bekerja dengan tangan sendiri, dan mengikuti perintah yang telah diberikan. Namun, tiga penggunaan akhiran tunggal “-mu” tidak mencerminkan penerima jamak ὑμῶν/ὑμῖν. Catatan draf yang menyatakan bahwa bentuk tunggal dipakai secara kolektif tidak mengatasi pergeseran jumlah ini dalam terjemahan baku modern.'
  naturalness: Kalimat draf cukup alami, tetapi “kalian” diperlukan agar sapaan kepada komunitas jelas. “Berusahalah sungguh-sungguh” menyampaikan daya dorong φιλοτιμεῖσθαι lebih baik daripada “berusahalah” saja dan tetap wajar dalam bahasa Indonesia modern.
  terminology: “Hidup tenang,” “mengurus urusan ... sendiri,” “bekerja dengan tangan ... sendiri,” dan “kami telah perintahkan” merupakan padanan yang tepat, berwibawa, dan tidak menambahkan penafsiran teologis.
  issues:
  - severity: medium
    issue: Akhiran posesif dan datif tunggal “-mu” dipakai untuk bentuk-bentuk Yunani jamak.
    rationale: χειρσὶν ὑμῶν dan ὑμῖν secara eksplisit merujuk kepada para penerima jamak. Dalam bahasa Indonesia modern, “tanganmu” dan “kepadamu” lazimnya menunjuk seorang penerima; gunakan “kalian” untuk mempertahankan jumlah sumber.
  - severity: low
    issue: “Berusahalah” sendiri agak mereduksi nuansa φιλοτιμεῖσθαι.
    rationale: Verba ini mengandung gagasan menjadikan sesuatu sasaran/ambisi yang sungguh diupayakan. Penambahan “sungguh-sungguh” menyampaikan intensitas itu tanpa ekspansi yang berlebihan.
  revised_text: dan hendaklah kalian berusaha sungguh-sungguh untuk hidup tenang, mengurus urusan kalian sendiri, dan bekerja dengan tangan kalian sendiri, sebagaimana kami telah perintahkan kepada kalian,
