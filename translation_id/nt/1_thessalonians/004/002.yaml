lexical_decisions:
- source_word: οἴδατε
  choice: kamu tahu
  rationale: Bentuk οἶδα bermakna kini dalam bahasa Yunani Koine; “kamu tahu” alami dan tepat.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan antarkalimat.
- source_word: τίνας
  choice: apa
  rationale: Bersama nomina jamak παραγγελίας, kata ini menanyakan isi petunjuk yang sudah diketahui; “petunjuk-petunjuk apa” wajar dalam bahasa Indonesia.
- source_word: παραγγελίας
  choice: petunjuk-petunjuk
  rationale: Mengungkapkan ajaran yang bersifat mengarahkan dan berwenang tanpa mempersempitnya menjadi perintah semata.
- source_word: ἐδώκαμεν
  choice: telah kami berikan
  rationale: Menyampaikan tindakan lampau verba aoris δίδωμι dengan ungkapan Indonesia yang alami.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Menyatakan objek tak langsung secara jelas; bentuk tunggal “-mu” merujuk secara kolektif kepada jemaat.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: melalui Tuhan Yesus
  rationale: Mempertahankan nilai sarana atau perantaraan διά dengan genitif serta tidak menutup kemungkinan nuansa kewenangan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku dan kontekstual bagi κύριος sebagai gelar Yesus.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Daya makna διὰ τοῦ κυρίου Ἰησοῦ
  choice: melalui Tuhan Yesus
  alternative: dengan wewenang Tuhan Yesus
  rationale: Frasa Yunani dapat menunjuk pada sarana atau perantaraan, sekaligus menyiratkan kewenangan. Teks utama mempertahankan ungkapan yang paling dekat dengan bentuk sumber, sedangkan catatan mencatat kemungkinan nuansa kewenangan tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kamu” dipakai untuk sapaan jamak kepada jemaat sesuai pemakaian Indonesia yang alami. Bentuk ulang “petunjuk-petunjuk” mempertahankan jamak παραγγελίας.
