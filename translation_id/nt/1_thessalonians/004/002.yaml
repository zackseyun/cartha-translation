translation:
  language: id
  text: Sebab kamu tahu perintah-perintah apa yang telah kami berikan kepadamu melalui Tuhan Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “atas wewenang Tuhan Yesus.”
