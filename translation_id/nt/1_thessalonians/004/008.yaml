base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: id
  text: Karena itu, siapa pun yang menolak[a] hal ini tidak menolak manusia, melainkan Allah, yang juga memberikan Roh Kudus-Nya kepada kamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja yang diterjemahkan “menolak” juga dapat berarti “tidak mengindahkan” atau “mengesampingkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam kamu.” Dalam konteks ini, bahasa Indonesia lazim memakai “kepada kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari nasihat sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: siapa pun yang menolak ... bukanlah menolak
  rationale: Partisipel berartikel ini bersifat umum. 'Siapa pun' tidak membatasi pelakunya pada laki-laki, sedangkan 'menolak' sesuai dengan tindakan mengesampingkan atau tidak mengindahkan pengajaran yang berwenang.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: bukanlah menolak manusia, melainkan Allah
  rationale: '''Manusia'' mempertahankan arti generik ἄνθρωπον dan kontras ringkas antara manusia dan Allah.'
- source_word: τὸν καὶ διδόντα
  choice: yang juga memberikan
  rationale: Partisipel kini dijadikan klausa relatif yang alami; 'juga' mencerminkan καί tanpa memaksakan aspek temporal yang tidak pasti.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Roh-Nya yang Kudus
  rationale: Susunan ini secara alami merujuk kepada Roh Kudus milik Allah, sambil mempertahankan penekanan adjektiva 'yang Kudus' dalam frasa Yunani.
- source_word: εἰς ὑμᾶς
  choice: kepada kamu
  rationale: Dengan verba 'memberikan', bahasa Indonesia lazim memakai 'kepada'. Bentuk ini menyampaikan penerimaan Roh oleh para pembaca tanpa kekakuan 'ke dalam kamu'.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Roh-Nya yang Kudus, yakni Roh Kudus yang diberikan Allah
  alternative: roh kudus sebagai pemberian atau kecenderungan yang lebih impersonal
  rationale: Konstruksi Yunani dan konteks Paulus secara alami menunjuk kepada Roh Kudus. Huruf kapital menandai rujukan tersebut tanpa menambahkan rumusan doktrinal di luar teks.
- issue: Daya cakup umum ὁ ἀθετῶν
  choice: siapa pun yang menolak
  alternative: orang yang menolak; dia yang menolak
  rationale: Bentuk maskulin tunggal Yunani berfungsi secara generik dan tidak membatasi makna pada laki-laki.
- issue: Arah εἰς ὑμᾶς
  choice: kepada kamu
  alternative: ke dalam kamu
  rationale: Terjemahan utama mengikuti idiom bahasa Indonesia dengan 'memberikan', sedangkan makna harfiah preposisi dipertahankan dalam catatan agar nuansa berdiamnya Roh tidak diam-diam dihapus atau dipastikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' mempertahankan bentuk jamak ὑμᾶς menurut kebiasaan terjemahan Alkitab Indonesia; catatan kaki menjaga alternatif leksikal dan nuansa preposisional sumber.
