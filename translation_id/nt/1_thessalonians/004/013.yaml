  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: id
  text: Namun, saudara-saudara,[a] kami tidak ingin kalian tidak tahu tentang mereka yang telah tertidur,[b] supaya kalian tidak berdukacita seperti orang-orang lain yang tidak memiliki pengharapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “saudara-saudara” di sini ditujukan kepada jemaat dan kemungkinan mencakup laki-laki maupun perempuan.
    reason: cultural_note
  - marker: b
    text: Atau “mereka yang tidur”; di sini Paulus memakai “tidur” sebagai metafora bagi orang yang telah meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: Namun, kami tidak ingin
  rationale: δέ menandai peralihan yang agak kontras; “Namun” alami dalam bahasa Indonesia tanpa memperkeras pertentangan. θέλομεν dengan infinitif diterjemahkan secara idiomatis sebagai “kami tidak ingin ...”.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: kalian tidak mengetahui
  rationale: ἀγνοεῖν berarti tidak tahu atau tidak mendapat informasi. Bentuk ini mempertahankan susunan negatif Yunani dan tidak membawa nada merendahkan seperti “bodoh”.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan ini secara gramatikal berbentuk maskulin jamak, tetapi dalam pemakaian Paulus lazimnya ditujukan kepada seluruh jemaat. “Saudara-saudara” merupakan sapaan jemaat yang wajar dan bermartabat dalam bahasa Indonesia; cakupannya dijelaskan dalam catatan kaki.
- source_word: περὶ τῶν κοιμωμένων
  choice: tentang mereka yang telah tertidur
  rationale: κοιμωμένων memakai metafora tidur bagi orang yang telah meninggal. “Telah tertidur” mempertahankan metafora serta nuansa keadaan yang timbul dari peristiwa sebelumnya, tanpa menggantinya langsung dengan penafsiran “telah meninggal”.
- source_word: ἵνα μὴ λυπῆσθε
  choice: supaya kalian tidak berdukacita
  rationale: ἵνα dengan subjungtif menyatakan tujuan atau hasil yang dimaksudkan. Terjemahan ini mempertahankan tujuan pastoral Paulus dan tidak dengan sendirinya berarti bahwa segala dukacita dilarang.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: seperti orang-orang lain
  rationale: οἱ λοιποί menunjuk kepada orang-orang di luar kelompok jemaat dalam perbandingan ini. “Orang-orang lain” jelas dan alami dalam bahasa Indonesia.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: yang tidak memiliki pengharapan
  rationale: Terjemahan langsung dari frasa partisipial ini. “Pengharapan” mempertahankan bobot eskatologis ἐλπίδα dalam konteks kebangkitan.
theological_decisions:
- issue: Makna κοιμωμένων dalam konteks eskatologis
  choice: Mempertahankan metafora “mereka yang telah tertidur”.
  alternative: “mereka yang telah meninggal” atau “mereka yang tidur”
  rationale: Paulus sengaja memakai metafora tidur bagi orang yang telah meninggal dalam konteks pengharapan kebangkitan. Mempertahankannya menjaga tekstur teologis teks, sedangkan catatan kaki menjelaskan acuannya.
- issue: Cakupan sapaan ἀδελφοί
  choice: Menerjemahkan dengan “saudara-saudara” dan memberi catatan bahwa sapaan ini kemungkinan mencakup laki-laki dan perempuan.
  alternative: “saudara-saudari” atau “sesama saudara seiman”
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi pemakaian sapaan Paulus biasanya mencakup seluruh jemaat. Terjemahan utama mempertahankan bentuk sapaan yang mapan, sementara catatan menjelaskan cakupan pragmatisnya.
- issue: Sifat dukacita yang dimaksud
  choice: “supaya kalian tidak berdukacita seperti orang-orang lain yang tidak memiliki pengharapan”
  alternative: Memahami kalimat sebagai larangan mutlak terhadap segala dukacita
  rationale: Pembanding καθὼς menunjukkan bahwa yang dibedakan ialah corak dukacita tanpa pengharapan, bukan bahwa orang percaya sama sekali tidak boleh bersedih.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμᾶς berbentuk jamak. Metafora tidur dipertahankan, dan susunan kalimat dibuat alami tanpa menghilangkan perbandingan teologis antara dukacita yang berpengharapan dan yang tanpa pengharapan.
