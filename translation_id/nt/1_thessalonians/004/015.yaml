source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: id
  text: 'Sebab, kami mengatakan ini kepadamu berdasarkan firman dari Tuhan[a]: kita yang hidup, yang masih tinggal sampai kedatangan[b] Tuhan, sekali-kali tidak akan mendahului mereka yang telah tertidur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdasarkan firman Tuhan.” Bahasa Yunaninya dapat menunjuk pada perkataan Tuhan Yesus atau pada penyataan yang diberikan dengan wewenang Tuhan.
    reason: alternative_reading
  - marker: b
    text: Kata Yunaninya juga dapat diterjemahkan “kehadiran” atau “ketibaan.”
    reason: lexical_alternative
  - marker: c
    text: “Mereka yang telah tertidur” adalah kiasan bagi orang-orang percaya yang telah meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: berdasarkan firman dari Tuhan
  rationale: Ungkapan ini menyatakan dasar atau wewenang perkataan Paulus tanpa memastikan apakah yang dimaksud ialah perkataan Yesus yang dikenal atau penyataan yang diberikan dengan wewenang Tuhan.
- source_word: παρουσίαν
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, kata tersebut menunjuk pada tibanya Tuhan kelak. 'Kedatangan' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa peristiwa.
- source_word: οἱ ζῶντες
  choice: kita yang hidup
  rationale: Menerjemahkan partisipel kini secara langsung dan wajar; kata ganti inklusif 'kita' sesuai dengan Paulus yang memasukkan dirinya bersama para pembacanya.
- source_word: οἱ περιλειπόμενοι
  choice: yang masih tinggal
  rationale: Menunjuk kepada orang-orang yang tetap hidup hingga waktu yang disebutkan, tanpa memasukkan nuansa tambahan seperti 'selamat bertahan'.
- source_word: οὐ μὴ φθάσωμεν
  choice: sekali-kali tidak akan mendahului
  rationale: Negasi οὐ μή sangat tegas, sedangkan φθάνω dalam konteks ini berarti mendahului. Pilihan ini mempertahankan penegasan kuat teks Yunani.
- source_word: τοὺς κοιμηθέντας
  choice: mereka yang telah tertidur
  rationale: Mempertahankan metafora tidur bagi orang percaya yang telah meninggal, sebagaimana terdapat dalam teks sumber.
- source_word: κύριος / κυρίου
  choice: Tuhan
  rationale: Dalam konteks ini κύριος merujuk kepada Yesus; 'Tuhan' merupakan padanan baku dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat 'firman dari Tuhan' yang menjadi dasar pernyataan Paulus
  choice: Diterjemahkan sebagai 'berdasarkan firman dari Tuhan' agar wewenang ilahinya jelas tanpa menentukan cara firman itu diterima.
  alternative: Firman yang pernah diucapkan langsung oleh Yesus, atau penyataan profetis yang diberikan kepada Paulus.
  rationale: Frasa Yunani menegaskan sumber atau wewenang Tuhan, tetapi tidak menetapkan apakah Paulus mengutip tradisi perkataan Yesus atau menyampaikan penyataan.
- issue: Makna κοιμηθέντας
  choice: Metafora tidur dipertahankan bagi orang percaya yang telah meninggal.
  alternative: Menerjemahkannya secara eksplisit sebagai 'orang-orang yang telah meninggal'.
  rationale: Metafora asli merupakan bagian dari tekstur teologis ayat dalam konteks pengharapan akan kebangkitan, sehingga tidak sepatutnya diratakan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan pengulangan partisipel, penegasan negasi, metafora tidur, dan ambiguitas mengenai sifat firman dari Tuhan.
