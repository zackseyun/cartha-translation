id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: id
  text: supaya kamu masing-masing tahu bagaimana memperoleh[a] bejananya sendiri[b] dalam kekudusan dan kehormatan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut pemahaman lain, menguasai atau mengendalikan.
    reason: Menandai kemungkinan arti kontekstual κτᾶσθαι tanpa menggantikan arti dasarnya dalam teks utama.
  - marker: b
    text: Secara harfiah, bejananya sendiri. Ungkapan ini dapat dipahami sebagai tubuhnya sendiri atau, menurut penafsiran lain, istrinya sendiri.
    reason: Menjelaskan metafora dan mempertahankan ambiguitas asli mengenai rujukan σκεῦος.
lexical_decisions:
- source_word: κτᾶσθαι
  choice: memperoleh
  rationale: Bentuk kini infinitif dari κτάομαι pada dasarnya berarti memperoleh atau mendapatkan. Pilihan ini mempertahankan nuansa tindakan memperoleh tanpa mengubahnya menjadi sekadar menguasai atau mengendalikan.
- source_word: σκεῦος
  choice: bejana
  rationale: Secara harfiah berarti wadah, bejana, atau perkakas. 'Bejana' mempertahankan metafora sumber dan memungkinkan ambiguitas rujukannya tetap terbuka.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: dalam kekudusan dan kehormatan
  rationale: Terjemahan dekat dengan susunan Yunani dan mempertahankan kedua ranah etis tanpa mempersempit hubungan preposisionalnya.
theological_decisions:
- issue: Rujukan 'bejananya sendiri'
  choice: Mempertahankan metafora 'bejana' dalam teks utama
  alternative: Menafsirkannya langsung sebagai 'tubuhnya sendiri' atau 'istrinya sendiri'
  rationale: σκεῦος dapat dipahami sebagai tubuh sendiri atau, menurut penafsiran lain, sebagai istri. Teks Yunani tidak memutuskan ambiguitas itu secara eksplisit, sehingga terjemahan utama tidak boleh diam-diam memilih salah satunya.
- issue: Arti κτᾶσθαι dalam konteks nasihat seksual
  choice: memperoleh
  alternative: menguasai, mengendalikan, atau hidup bersama
  rationale: Pilihan 'memperoleh' mengikuti arti leksikal verba dan bukti revisi, meskipun sebagian penafsir memahami konstruksi ini secara idiomatis sebagai mengendalikan tubuh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'bejana' agak metaforis tetapi tetap dikenal dalam ragam Alkitabiah dan dipertahankan demi ambiguitas teks sumber; catatan kaki memberi penjelasan yang diperlukan.
