source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: id
  text: Sebab memang, kalian melakukan hal itu kepada semua saudara seiman di seluruh Makedonia. Namun, kami mendesak kalian, saudara-saudara[a], agar semakin melimpah dalam hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Saudara-saudara" di sini merupakan sapaan kepada sesama orang percaya dan dalam konteks jemaat mencakup laki-laki maupun perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Memang
  rationale: Dalam konteks ini, gabungan tersebut menegaskan bahwa pujian sebelumnya terbukti dalam tindakan mereka. 'Memang' menyampaikan daya penjelas dan penegasnya secara wajar dalam bahasa Indonesia.
- source_word: ποιεῖτε αὐτὸ
  choice: kalian melakukan hal itu
  rationale: Bentuk kini menunjukkan praktik yang sedang berlangsung, sedangkan 'hal itu' menunjuk kembali kepada kasih persaudaraan dalam ayat sebelumnya.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: kepada semua saudara seiman
  rationale: εἰς menyatakan arah tindakan kasih kepada orang-orang tersebut. 'Saudara seiman' secara alami menunjukkan anggota komunitas orang percaya tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: di seluruh Makedonia
  rationale: Ungkapan ini mempertahankan cakupan geografis yang luas dan distributif dengan bahasa Indonesia yang alami.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Namun, kami mendesak kalian
  rationale: παρακαλέω di sini merupakan desakan yang sungguh-sungguh, sementara δέ menandai peralihan ringan dari pujian menuju nasihat lanjutan.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan kekeluargaan ini mempertahankan citra komunitas dalam bahasa sumber. Catatan kaki menjelaskan bahwa dalam konteks jemaat sapaan tersebut mencakup saudara seiman laki-laki maupun perempuan.
- source_word: περισσεύειν μᾶλλον
  choice: agar semakin melimpah dalam hal itu
  rationale: περισσεύω mempertahankan gambaran kelimpahan, dan μᾶλλον menunjukkan peningkatan melampaui praktik mereka yang sudah dipuji. Tambahan 'dalam hal itu' memperjelas kaitannya dengan kasih persaudaraan tanpa mengganti metaforanya.
theological_decisions:
- issue: Cakupan ἀδελφοί/ἀδελφούς dalam konteks jemaat campuran
  choice: '''Saudara seiman'' untuk penyebutan komunitas dan ''Saudara-saudara'' dalam sapaan, dengan catatan kaki'
  alternative: '''saudara-saudari'' atau ''sesama orang percaya'' di kedua tempat'
  rationale: 'Bahasa Indonesia memungkinkan pembedaan yang alami: ''saudara seiman'' menyatakan seluruh komunitas dengan jelas, sedangkan ''Saudara-saudara'' mempertahankan bentuk sapaan kekeluargaan Yunani. Catatan kaki menjaga agar cakupan campuran tidak disalahpahami.'
- issue: Objek tersirat dalam περισσεύειν μᾶλλον
  choice: mengaitkannya kembali dengan kasih persaudaraan melalui 'dalam hal itu'
  alternative: membiarkan ungkapan mutlak sebagai 'agar semakin melimpah'
  rationale: Secara sintaksis objeknya tersirat, tetapi konteks langsung menunjuk kepada kasih persaudaraan. Frasa rujukan yang umum mempertahankan hubungan konteks tanpa mempersempit kasih itu menjadi tindakan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai karena subjek Yunani berbentuk jamak dan agar pembedaan jumlah tetap jelas; 'kami' mempertahankan bentuk jamak penulis. Struktur pujian lalu desakan dijaga, demikian pula metafora kelimpahan.
