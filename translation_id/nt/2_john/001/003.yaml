source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: id
  text: Kasih karunia, belas kasihan, dan damai sejahtera akan menyertai kita dari Allah Bapa dan dari Yesus Sang Mesias[a], Anak Sang Bapa[b], dalam kebenaran dan kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Gelar Yunani Χριστός dapat ditransliterasikan menjadi “Kristus”; di sini diterjemahkan “Mesias” untuk mempertahankan maknanya sebagai gelar.
    reason: lexical_alternative
  - marker: b
    text: Atau “Anak dari Sang Bapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: akan menyertai kita
  rationale: Bentuk futur indikatif ἔσται dipertahankan dengan “akan,” sedangkan ungkapan “menyertai kita” menyampaikan arti harfiah “akan bersama kita” secara alami dalam bahasa Indonesia.
- source_word: χάρις ἔλεος εἰρήνη
  choice: kasih karunia, belas kasihan, dan damai sejahtera
  rationale: Ketiga nomina ini merupakan subjek ἔσται. Padanan yang dipilih jelas, lazim, dan mempertahankan urutan Yunani.
- source_word: παρὰ θεοῦ πατρός
  choice: dari Allah Bapa
  rationale: παρά dengan genitif menandai sumber. Tidak ditambahkan kata posesif “kita” karena tidak terdapat dalam teks Yunani.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: dari Yesus Sang Mesias
  rationale: παρά kembali menunjukkan sumber. Χριστός diterjemahkan sebagai gelar “Mesias,” bukan sekadar ditransliterasikan, dan “Sang” membuat gelar itu idiomatis dalam bahasa Indonesia.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: Anak Bapa
  rationale: Frasa ini ditempatkan sebagai aposisi yang mengidentifikasi Yesus Sang Mesias. Bentuk ringkas ini mempertahankan hubungan definitif dengan Bapa tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: dalam kebenaran dan kasih
  rationale: ἐν diterjemahkan secara langsung sebagai “dalam.” Kedua nomina tanpa artikel dipertahankan secara kualitatif tanpa menambahkan kata penentu.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus. Menerjemahkannya sebagai “Mesias” mempertahankan makna gelar tersebut; bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Hubungan τοῦ υἱοῦ τοῦ πατρός dengan Yesus
  choice: Aposisi yang mengidentifikasi Yesus Sang Mesias sebagai Anak Bapa
  alternative: 'Frasa deskriptif yang lebih longgar: “Sang Anak dari Bapa”'
  rationale: Susunan genitif itu paling wajar dibaca sebagai aposisi bagi Ἰησοῦ Χριστοῦ. Terjemahan mempertahankan identifikasi kristologis yang tegas tanpa memperluasnya dengan rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Akan menyertai kita” dipilih daripada bentuk lebih harfiah tetapi kaku “akan ada bersama kita.” Istilah surat yang sudah dikenal dipertahankan selama tetap mudah dipahami.
