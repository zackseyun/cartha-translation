source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: id
  text: 'Dan inilah kasih itu: bahwa kita hidup menurut perintah-perintah-Nya. Inilah perintah itu, sebagaimana telah kamu dengar sejak semula: agar kamu hidup di dalamnya[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “agar kamu hidup di dalam kasih”; kata “di dalamnya” mungkin merujuk kepada “kasih”, bukan kepada “perintah itu”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: kasih
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk kasih yang menjadi ciri khas pemakaian Yohanes; mempertahankan kaitan leksikal dengan konteks sekitarnya.
- source_word: ἵνα περιπατῶμεν
  choice: bahwa kita hidup
  rationale: ἵνα di sini menjelaskan isi atau wujud kasih dalam praktik. Metafora 'berjalan' dialihkan menjadi idiom Indonesia yang alami, 'hidup', tanpa menghilangkan makna etisnya.
- source_word: περιπατέω
  choice: hidup
  rationale: Dalam konteks etis, 'hidup' lebih alami bagi pembaca Indonesia daripada terjemahan harfiah 'berjalan'. Kata yang sama dipakai dalam kedua klausa untuk mempertahankan pengulangan sumber.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: menurut perintah-perintah-Nya
  rationale: κατά dengan akusatif menyatakan kesesuaian. Bentuk jamak dipertahankan, demikian pula kaitannya dengan bentuk tunggal pada klausa berikut.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: Inilah perintah itu
  rationale: Bahasa Yunani tidak memiliki kata milik eksplisit. 'Perintah itu' mempertahankan bentuk tunggal dan sifat definitnya tanpa menambahkan 'perintah-Nya'.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: sebagaimana telah kamu dengar sejak semula
  rationale: '''Sejak semula'' mempertahankan ungkapan khas Yohanes; ''telah kamu dengar'' menyatakan tindakan lampau yang tetap relevan bagi pembaca.'
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: yaitu bahwa kamu harus hidup di dalamnya
  rationale: '''Yaitu bahwa'' memperjelas bahwa klausa ini menguraikan isi perintah. ''Di dalamnya'' mempertahankan pronomina feminin Yunani dan ambiguitas rujukannya, yang dijelaskan dalam catatan kaki.'
theological_decisions:
- issue: Rujukan αὐτῇ dalam klausa terakhir
  choice: Dalam teks utama, 'di dalamnya' paling dekat merujuk kepada 'perintah itu'.
  alternative: '''Di dalamnya'' dapat merujuk kepada ''kasih'', sehingga maknanya ialah ''hidup di dalam kasih''.'
  rationale: ἐντολή dan ἀγάπη sama-sama feminin tunggal dalam bahasa Yunani. 'Perintah' adalah anteseden terdekat, tetapi hubungan konseptual dengan 'kasih' membuat alternatif itu tetap nyata dan perlu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Hidup' dipilih untuk metafora etis περιπατέω agar alami bagi pembaca umum, sementara pengulangannya dipertahankan. Kapital pada '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah atau Kristus.
