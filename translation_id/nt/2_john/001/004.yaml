  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: id
  text: Aku sangat bersukacita karena aku telah mendapati sebagian dari anak-anakmu[a] berjalan dalam kebenaran[b], sesuai dengan perintah yang telah kita terima dari Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari antara anak-anakmu.” Ungkapan Yunani menunjukkan sebagian dari mereka, tidak harus semuanya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hidup dalam kebenaran.” Ungkapan ini kemungkinan bukan hanya berarti hidup dengan tulus, melainkan menjalani hidup sesuai dengan kebenaran yang telah dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Aku sangat bersukacita
  rationale: Bentuk aoristus Ἐχάρην menyatakan tanggapan sukacita, sedangkan λίαν menguatkannya. Ungkapan ini alami, jelas, dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: εὕρηκα
  choice: telah mendapati
  rationale: Bentuk perfek menyoroti penemuan yang hasilnya tetap relevan. 'Telah mendapati' mempertahankan nuansa tersebut tanpa terasa kaku.
- source_word: ἐκ τῶν τέκνων σου
  choice: beberapa anakmu
  rationale: Konstruksi partitif ἐκ dengan genitif menunjukkan sebagian dari kelompok itu, bukan dengan tegas semuanya. 'Beberapa anakmu' menyatakannya secara idiomatis.
- source_word: περιπατοῦντας
  choice: berjalan
  rationale: Terjemahan ini mempertahankan metafora etis khas tulisan Yohanes, yakni menjalani kehidupan dengan cara tertentu.
- source_word: ἐν ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Frasa ini kemungkinan menunjuk pada ranah atau patokan kebenaran yang dinyatakan, bukan sekadar ketulusan. Bentuk tanpa artikel dalam bahasa Yunani tetap dapat memiliki makna definit dalam pemakaian Yohanes.
- source_word: καθὼς
  choice: sebagaimana
  rationale: Kata ini menyatakan kesesuaian antara cara hidup mereka dan perintah yang diterima; 'sebagaimana' alami serta bermartabat.
- source_word: ἐντολὴν ἐλάβομεν
  choice: kita telah menerima perintah
  rationale: '''Perintah'' menyampaikan bobot etis ἐντολή secara alami dalam bahasa Indonesia. Kata ganti jamak tetap dipertahankan, dan ''telah menerima'' menunjukkan tindakan penerimaan yang sudah terjadi.'
- source_word: παρὰ τοῦ πατρός
  choice: dari Bapa
  rationale: Terjemahan ini mengikuti ungkapan Yunani tanpa menambahkan kata 'Allah'. Huruf kapital menandai penggunaan 'Bapa' sebagai gelar ilahi dalam konteks Yohanes.
theological_decisions:
- issue: Rujukan 'Bapa'
  choice: Mempertahankan 'dari Bapa' tanpa penambahan
  alternative: '''dari Allah Bapa'''
  rationale: Teks Yunani hanya menyebut 'Bapa'. Konteks Yohanes membuat rujukannya jelas, sehingga penambahan 'Allah' tidak diperlukan.
- issue: Cakupan 'anak-anakmu'
  choice: beberapa anakmu
  alternative: anak-anakmu
  rationale: Konstruksi partitif ἐκ menunjukkan sebagian dari anak-anak itu dan tidak menyatakan bahwa semuanya berjalan dalam kebenaran.
- issue: Makna 'berjalan dalam kebenaran'
  choice: Mempertahankan metafora 'berjalan' dan frasa 'dalam kebenaran'
  alternative: '''hidup sesuai dengan kebenaran'' atau ''hidup dengan tulus'''
  rationale: Metafora berjalan adalah ciri penting bahasa etis Yohanes. Frasa ini lebih luas daripada sekadar ketulusan dan menunjuk pada kehidupan yang selaras dengan kebenaran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Metafora Yohanes 'berjalan' dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum. 'Kita' dipakai untuk ἐλάβομεν agar bentuk jamak inklusif tetap terbuka sebagaimana dalam sumber.
