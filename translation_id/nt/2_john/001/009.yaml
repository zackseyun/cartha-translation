  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: id
  text: Setiap orang yang maju melampaui dan tidak tetap dalam ajaran Mesias tidak memiliki Allah.[a] Orang yang tetap dalam ajaran itu[b] memiliki Bapa dan Anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “maju mendahului” atau “bertindak terlalu jauh”; sebagian naskah berbunyi “melanggar” sebagai ganti “maju melampaui”.
    reason: textual_variant
  - marker: b
    text: Frasa “ajaran Mesias” dapat berarti “ajaran yang disampaikan Mesias” atau “ajaran tentang Mesias”.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Setiap orang yang melangkah lebih jauh
  rationale: πᾶς dengan partisipel berartikel menyatakan golongan umum, sedangkan προάγων menggambarkan gerak maju. 'Melangkah lebih jauh' mempertahankan metafora dan, dalam konteks negatif ini, menyiratkan bergerak melampaui batas ajaran tanpa menyamakannya dengan varian tekstual 'melanggar'.
- source_word: μὴ μένων
  choice: tidak tetap
  rationale: μένω merupakan verba penting dalam tulisan Yohanes dengan arti tinggal, tetap, atau bertahan. 'Tetap' alami dalam bahasa Indonesia modern dan mempertahankan kesinambungan leksikalnya.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: dalam ajaran Mesias
  rationale: διδαχή diterjemahkan 'ajaran', bentuk yang mudah dipahami dan tidak terlalu teknis. Genitif τοῦ Χριστοῦ tetap dibuat ringkas agar dapat menunjuk pada ajaran yang berasal dari Mesias ataupun ajaran tentang Mesias.
- source_word: θεὸν οὐκ ἔχει
  choice: tidak memiliki Allah
  rationale: Terjemahan ini mempertahankan rumusan langsung dan tegas dari bahasa Yunani tanpa memperluasnya menjadi 'tidak memiliki persekutuan dengan Allah'.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Orang yang tetap dalam ajaran itu
  rationale: Partisipel berartikel diterjemahkan secara substantival. 'Ajaran itu' merujuk kembali secara alami kepada ajaran Mesias dalam klausa pertama.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: memiliki baik Bapa maupun Anak
  rationale: Pola korelatif καὶ...καὶ dinyatakan dengan 'baik...maupun', sambil mempertahankan gelar relasional Bapa dan Anak.
theological_decisions:
- issue: Makna προάγων dalam bentuk teks SBLGNT
  choice: '''melangkah lebih jauh'''
  alternative: '''berjalan mendahului'', ''bertindak terlalu jauh'', atau menurut sebagian naskah ''melanggar'''
  rationale: SBLGNT membaca προάγων, bukan παραβαίνων. Pilihan utama mempertahankan citra bergerak maju sekaligus cocok dengan konteks orang yang melampaui ajaran yang benar; varian naskah dicatat tanpa dimasukkan ke teks utama.
- issue: Makna genitif dalam 'ajaran Mesias'
  choice: Ambiguitas dipertahankan dalam frasa 'ajaran Mesias'.
  alternative: '''ajaran yang disampaikan Mesias'' atau ''ajaran tentang Mesias'''
  rationale: Genitif Yunani dapat dipahami secara subjektif maupun objektif. Teks utama tidak memaksakan salah satu tafsiran.
- issue: Gelar Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar di sini; 'Mesias' menyampaikan nilai gelarnya dan sesuai dengan kebijakan proyek.
- issue: Ungkapan 'memiliki Allah'
  choice: Dipertahankan secara langsung sebagai 'memiliki Allah'.
  alternative: '''memiliki persekutuan dengan Allah'''
  rationale: Parafrasa alternatif mungkin menjelaskan implikasinya, tetapi melampaui rumusan tegas teks dan dapat mempersempit cakupan teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pengulangan 'tetap dalam ajaran' dipertahankan demi paralelisme Yohanes. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama pada lokasi yang relevan.
