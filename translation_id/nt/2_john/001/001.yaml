source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: id
  text: Dari penatua kepada nyonya yang terpilih[a] dan anak-anaknya, yang kukasihi dalam kebenaran[b]—dan bukan hanya aku, melainkan juga semua orang yang telah mengenal kebenaran—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada Nyonya Terpilih.” Sebagian memahami “nyonya” secara kiasan sebagai jemaat setempat, dan sebagian menganggap “Kyria” sebagai nama orang.
    reason: alternative_reading
  - marker: b
    text: Atau, “dengan sungguh-sungguh”; ungkapan ini juga dapat mengandung pengertian khas tulisan Yohanes, yaitu “di dalam kebenaran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: penatua
  rationale: Dalam pembukaan surat, istilah ini paling wajar berfungsi sebagai sebutan bagi seorang pemimpin yang diakui, sambil tetap mempertahankan kaitannya dengan usia dan kedudukan tanpa memakai istilah gerejawi yang lebih teknis.
- source_word: ἐκλεκτῇ
  choice: yang terpilih
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan dapat menerangkan seorang perempuan maupun jemaat yang dipersonifikasikan, tanpa menetapkan salah satu tafsiran.
- source_word: κυρίᾳ
  choice: ibu
  rationale: Sapaan “ibu” terdengar alami dan terhormat dalam bahasa Indonesia modern. Kemungkinan bahwa kata ini menunjuk pada jemaat secara kiasan atau merupakan nama diri “Kyria” dicatat dalam catatan kaki.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: anak-anaknya
  rationale: τέκνα bersifat umum dan tidak khusus berarti anak laki-laki. Bentuk ini sesuai baik untuk anak-anak seorang perempuan maupun, secara kiasan, anggota-anggota jemaat.
- source_word: οὓς ἐγὼ ἀγαπῶ
  choice: yang kukasihi
  rationale: Bentuk ini menyampaikan kasih penulis secara langsung dan alami. Kata ganti relatif tetap dapat mengacu pada para penerima sebagai orang-orang tanpa mempersempit identitas mereka.
- source_word: ἐν ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Terjemahan ini mempertahankan kemungkinan makna ketulusan sekaligus nuansa khas tulisan Yohanes tentang hidup dalam lingkup kebenaran.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: dan bukan hanya aku, melainkan juga semua orang
  rationale: Susunan ini mempertahankan kontras dan penekanan Yunani secara alami dalam bahasa Indonesia.
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: yang telah mengenal kebenaran
  rationale: “Telah mengenal” mencerminkan bentuk perfektif yang menunjuk pada pengenalan yang sudah terjadi dan tetap menjadi keadaan mereka sekarang.
theological_decisions:
- issue: Identitas ἐκλεκτῇ κυρίᾳ
  choice: Diterjemahkan “ibu yang terpilih” sebagai sapaan yang pada permukaannya ditujukan kepada seorang perempuan, tanpa menutup kemungkinan bahwa ungkapan itu melambangkan suatu jemaat.
  alternative: Seorang perempuan Kristen tertentu; jemaat setempat yang dipersonifikasikan; atau seorang perempuan bernama Kyria.
  rationale: Bahasa Yunani memungkinkan ketiga pemahaman tersebut. Teks utama memakai arti umum κυρία, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Makna ἐν ἀληθείᾳ
  choice: Diterjemahkan “dalam kebenaran”.
  alternative: “Dengan sungguh-sungguh” atau “di dalam Sang Kebenaran/kebenaran itu”.
  rationale: Ungkapan ini dapat menyatakan ketulusan, tetapi dalam tulisan Yohanes juga dapat memiliki resonansi teologis. Terjemahan utama mempertahankan keluasan makna itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Penatua” mempertahankan sifat sebutan pembuka surat; “ibu” dipilih sebagai sapaan hormat yang lebih alami daripada “nyonya” dalam konteks ini. Tanda pisah penutup dipertahankan karena kalimat berlanjut ke ayat berikutnya.
