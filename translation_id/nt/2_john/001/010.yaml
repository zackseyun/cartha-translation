  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: id
  text: Jika seseorang datang kepada kalian dan tidak membawa ajaran ini[b], jangan menerima dia ke dalam rumah kalian dan jangan mengucapkan salam kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih ringkas, “jangan menyapanya.” Secara harfiah, bahasa Yunani berbunyi, “jangan mengatakan salam kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteksnya, peringatan ini menyangkut orang yang datang tanpa membawa “ajaran ini,” kemungkinan seorang pengajar keliling yang pesannya menyimpang dari pengakuan rasuli yang disebutkan dalam ayat-ayat sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: Ungkapan syarat tak tentu yang memperkenalkan kasus umum; bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat generiknya.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: datang kepada kamu
  rationale: Menyatakan gerak menuju para penerima surat tanpa menambahkan gagasan tentang kunjungan gerejawi yang hanya tersirat dari konteks.
- source_word: ταύτην τὴν διδαχήν
  choice: ajaran ini
  rationale: διδαχή dapat berarti ajaran, pengajaran, atau doktrin. 'Ajaran' jelas, wajar, dan tetap mempertahankan kata penunjuk 'ini'.
- source_word: οὐ φέρει
  choice: tidak membawa
  rationale: Mempertahankan gambaran verba φέρω dan tetap idiomatis untuk orang yang datang dengan membawa suatu ajaran.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: jangan menerima dia di rumahmu
  rationale: λαμβάνω di sini berkaitan dengan penerimaan atau penyambutan dalam kerangka keramahtamahan. 'Di rumahmu' menyampaikan maksud masuk ke lingkungan rumah dengan alami, tanpa menentukan apakah rumah pribadi atau tempat pertemuan jemaat.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: jangan mengucapkan salam kepadanya
  rationale: Mencerminkan bentuk Yunani secara cukup dekat—secara harfiah, 'jangan mengatakan salam kepadanya'—namun tetap alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan terhadap orang yang tidak membawa ajaran ini
  choice: Mempertahankan tindakan konkret berupa menerima di rumah dan mengucapkan salam, dengan konteks yang mengarah pada pengajar keliling dan kemungkinan dukungan atau pengakuan terhadap pelayanannya.
  alternative: Menafsirkannya sebagai larangan mutlak atas semua interaksi sosial, atau membatasinya hanya pada penerimaan resmi dalam pertemuan jemaat.
  rationale: Teks Yunani sendiri tidak menjelaskan seluruh batas penerapannya. Terjemahan tidak memperluas ataupun mempersempit larangan melampaui ungkapan konkret ayat tersebut.
- issue: Rujukan maskulin αὐτόν/αὐτῷ dalam bahasa Indonesia
  choice: dia/kepadanya
  alternative: orang itu/kepada orang itu
  rationale: Bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga. Bentuk tunggal dipertahankan tanpa memasukkan gender yang tidak dapat dinyatakan secara alami oleh pronomina Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'kamu' dipakai sebagai sapaan tunggal generik dalam klausa, sedangkan konteks Yunani menyapa komunitas secara jamak; bahasa Indonesia tidak menandai perbedaan itu secara konsisten tanpa ungkapan yang lebih berat. Penanda catatan kaki ditempatkan sesudah kalimat agar keduanya jelas merujuk pada unsur terkait dalam ayat.
