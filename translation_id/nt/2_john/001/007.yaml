  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: id
  text: Sebab banyak penyesat telah pergi ke dunia, yaitu mereka yang tidak mengaku bahwa Yesus, Sang Mesias, datang dalam daging.[a] Orang seperti itu adalah si penyesat dan antikristus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah datang dalam daging.” Secara harfiah teks Yunani berbunyi “datang dalam daging”; bentuk partisip kini ini menegaskan kemanusiaan Yesus yang sungguh berjasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata ini memperkenalkan alasan bagi nasihat pada ayat sebelumnya; “Sebab” menyampaikan fungsi penjelas tersebut secara alami.
- source_word: πολλοὶ πλάνοι
  choice: banyak penyesat
  rationale: πλάνοι menunjuk pada orang-orang yang menyesatkan orang lain, bukan sekadar orang yang keliru. “Penyesat” juga menjaga kesinambungan dengan bentuk tunggal pada akhir ayat.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: telah muncul di dunia
  rationale: Ungkapan ini menyatakan tampilnya para penyesat dalam lingkup dunia secara terbuka. Terjemahan idiomatis ini menghindari frasa kaku “keluar ke dalam dunia” tanpa menafsirkan κόσμος sebagai sistem dunia.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: yaitu mereka yang tidak mengaku
  rationale: Partisip berartikel ini menunjuk pada kelompok orang yang dimaksud. “Mengaku” mempertahankan nuansa pengakuan terbuka, sedangkan “yaitu” memperjelas hubungan penjelas dengan “banyak penyesat”.
- source_word: Ἰησοῦν Χριστόν
  choice: bahwa Yesus adalah Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam isi pengakuan kristologis ini. Struktur dengan “bahwa ... adalah” menyampaikan isi pengakuan secara wajar dalam bahasa Indonesia.
- source_word: ἐρχόμενον
  choice: yang datang
  rationale: Bentuk partisip kini dipertahankan dengan ungkapan “yang datang,” tanpa mengubahnya secara diam-diam menjadi tindakan lampau yang sudah selesai.
- source_word: ἐν σαρκί
  choice: dalam daging
  rationale: Ungkapan harfiah ini mempertahankan penegasan Yohanes mengenai keberadaan jasmani Yesus yang nyata dan tidak mengalihkannya menjadi “kodrat berdosa”.
- source_word: οὗτός ἐστιν
  choice: Orang seperti itu adalah
  rationale: Demonstrativa tunggal merujuk secara individual kepada setiap orang dari kelompok yang baru disebut. “Orang seperti itu” menjaga daya tunjuk tunggal dengan bahasa Indonesia yang alami.
- source_word: ὁ πλάνος
  choice: si penyesat
  rationale: Pilihan ini menjaga hubungan leksikal dengan “banyak penyesat” dan menyampaikan daya pengidentifikasian artikelnya.
- source_word: ὁ ἀντίχριστος
  choice: antikristus
  rationale: “Antikristus” merupakan istilah baku dalam bahasa Indonesia dan mempertahankan hubungan antarteks dalam tulisan-tulisan Yohanes.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός merupakan gelar yang menjadi bagian utama isi pengakuan tentang identitas Yesus. Catatan kaki mempertahankan padanan tradisional sebagai alternatif.
- issue: Daya makna ἐρχόμενον ἐν σαρκί
  choice: yang datang dalam daging
  alternative: yang telah datang dalam daging
  rationale: Teks Yunani memakai partisip kini. Terjemahan utama mempertahankan bentuk tersebut dan penegasan tentang kemanusiaan jasmani Yesus, sementara kemungkinan pemahaman yang berorientasi pada kedatangan historis dicatat sebagai alternatif.
- issue: Makna σάρξ
  choice: daging, yakni keberadaan jasmani yang nyata
  alternative: kodrat berdosa
  rationale: Dalam konteks kristologis ini, σάρξ menunjuk pada kemanusiaan yang sungguh berjasmani, bukan kerusakan moral atau kodrat berdosa.
- issue: Rujukan tunggal οὗτος setelah kelompok jamak
  choice: Orang seperti itu
  alternative: Inilah
  rationale: Ungkapan ini mempertahankan bentuk tunggal dengan mengindividualkan setiap anggota kelompok, tanpa menetapkan bahwa kata itu hanya menunjuk kepada satu tokoh tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Penyesat,” “Mesias,” “dalam daging,” dan “antikristus” dipertahankan sebagai istilah teologis yang mudah dikenali. Struktur kalimat dibuat alami tanpa menghapus ketegangan aspek pada ἐρχόμενον atau daya tunjuk tunggal pada οὗτος.
