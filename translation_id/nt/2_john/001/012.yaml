  to: Walaupun masih banyak hal untuk kutuliskan kepada kalian, aku tidak ingin menuliskannya dengan kertas dan tinta. Sebaliknya, aku berharap dapat datang kepada kalian dan berbicara bertatap muka, supaya sukacita kalian[a] menjadi penuh.
