  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: id
  text: Walaupun masih banyak hal untuk kutuliskan kepada kalian, aku tidak ingin menuliskannya dengan kertas dan tinta. Sebaliknya, aku berharap dapat datang kepada kalian dan berbicara bertatap muka, supaya sukacita kalian[a] menjadi penuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “sukacita kita”, bukan “sukacita kalian”.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Walaupun ada banyak hal yang ingin kutuliskan kepadamu
  rationale: Partisipel ἔχων dipahami sebagai keadaan konsesif; ungkapan ini mempertahankan jamak Πολλά dan menyampaikan maksud menulis secara alami dalam bahasa Indonesia.
- source_word: οὐκ ἐβουλήθην
  choice: aku tidak mau
  rationale: Bentuk ini menyatakan kehendak atau keinginan; 'tidak mau' jelas, wajar, dan tidak terlalu kaku.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: dengan kertas dan tinta
  rationale: διά dengan genitif menyatakan sarana. 'Dengan' merupakan ungkapan instrumental yang alami dalam bahasa Indonesia.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Sebaliknya, aku berharap dapat datang kepadamu
  rationale: γενέσθαι πρὸς ὑμᾶς secara idiomatis menunjuk pada kedatangan atau kehadiran bersama penerima; 'datang kepadamu' mempertahankan arah πρός.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: berbicara berhadapan muka
  rationale: Ungkapan harfiah 'mulut dengan mulut' berarti percakapan langsung. 'Berhadapan muka' menyampaikan idiom itu tanpa konotasi yang menyesatkan.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: supaya sukacitamu menjadi penuh
  rationale: '''Supaya'' mempertahankan klausa tujuan, sedangkan ''menjadi penuh'' mencerminkan keadaan penuh yang dinyatakan oleh konstruksi partisipel perfek dengan subjungtif.'
theological_decisions:
- issue: Varian pronomina mengenai sukacita siapa yang dimaksud
  choice: sukacitamu
  alternative: sukacita kita
  rationale: Teks dasar SBLGNT membaca ὑμῶν ('kamu'), sehingga bacaan itu ditempatkan dalam teks utama. Bacaan ἡμῶν ('kita') memiliki arti interpretatif dan dicatat tanpa meniadakan ketegangan tekstual.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina tunggal dipakai karena ὑμῖν/ὑμᾶς dan ὑμῶν di sini mengacu kepada penerima surat yang disapa sebagai pribadi kolektif; bentuk terikat 'ku-' dan '-mu' menjaga kelancaran gaya surat pribadi.
