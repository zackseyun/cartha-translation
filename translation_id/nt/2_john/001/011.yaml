  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: id
  text: Sebab siapa pun yang berkata kepadanya, “Salam!”[a] turut mengambil bagian dalam perbuatan jahatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Selamat datang.” Kata Yunani χαίρειν merupakan rumus sapaan yang lazim. Dalam konteks ini, sapaan tersebut dapat menyiratkan penyambutan atau persetujuan, bukan sekadar basa-basi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: orang yang mengucapkan
  rationale: Artikel dengan partisipel kini berfungsi substantival dan menunjuk secara umum kepada siapa pun yang melakukan tindakan ini. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan sifat generiknya.
- source_word: γάρ
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi larangan pada ayat sebelumnya. “Sebab” mempertahankan fungsi penjelasnya secara ringkas dan wajar.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif ini mengacu kepada orang yang dibicarakan pada ayat sebelumnya. Terjemahan tidak memperluas acuannya di dalam teks utama.
- source_word: χαίρειν
  choice: “Salam,”
  rationale: Setelah λέγων, infinitif ini berfungsi secara idiomatis sebagai rumus sapaan. “Salam” menangkap fungsi sapaan konvensional tanpa menerjemahkannya terlalu harfiah sebagai “bersukacitalah” atau langsung menafsirkannya sebagai “selamat datang”.
- source_word: κοινωνεῖ
  choice: turut mengambil bagian dalam
  rationale: Dengan objek datif, kata kerja ini menyatakan partisipasi atau keterlibatan. Pilihan ini jelas dalam bahasa Indonesia modern dan menyampaikan implikasi keterlibatan moral tanpa memasukkan arti persekutuan gerejawi yang lebih sempit.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: dalam perbuatan-perbuatannya yang jahat
  rationale: Frasa datif ini merupakan hal yang di dalamnya seseorang ikut ambil bagian. Bentuk “perbuatan-perbuatan” mempertahankan bentuk jamak ἔργοις, sedangkan “yang jahat” menyatakan sifat moral πονηροῖς dan mempertahankan penekanan konstruksi Yunani.
theological_decisions:
- issue: Apakah sapaan itu sekadar kesopanan atau menyatakan penerimaan dan keterlibatan
  choice: Teks utama mempertahankan rumus sapaan “Salam” dan menyatakan bahwa orang yang memberikannya turut mengambil bagian dalam perbuatan jahat orang tersebut.
  alternative: Menerjemahkan χαίρειν langsung sebagai “selamat datang” atau memahami ayat ini sebagai larangan mutlak atas segala sapaan sopan dalam semua keadaan.
  rationale: Secara leksikal χαίρειν adalah rumus sapaan, sedangkan konteks ayat 10 mengenai menerima orang itu di rumah menunjukkan bahwa sapaan tersebut dapat membawa makna penyambutan atau dukungan. Terjemahan menjaga ketegangan itu tanpa memasukkan seluruh penafsiran kontekstual ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Turut mengambil bagian” dipilih agar gagasan keterlibatan moral terdengar jelas dan alami. Tanda koma mengapit kutipan sapaan, dan penanda catatan kaki ditempatkan tepat setelah kutipan yang dijelaskan.
