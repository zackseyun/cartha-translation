    rationale: Sapaan Yunani berbentuk jamak. “Jagalah diri kalian” menyampaikan imperatif jamak dan refleksivitas dengan idiom Indonesia yang lebih wajar.
  - severity: low
    issue: “Apa yang telah kami kerjakan” berpotensi dipahami hanya sebagai tugas-tugas yang dilakukan.
    rationale: Dalam konteks ini, ἃ εἰργασάμεθα menunjuk pada hasil dari usaha para pekerja. “Apa yang telah kami usahakan” lebih jelas tanpa melampaui teks.
