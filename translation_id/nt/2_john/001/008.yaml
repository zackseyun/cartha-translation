  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: id
  text: Jagalah diri kalian[a], supaya kalian tidak kehilangan apa yang telah kami usahakan, melainkan menerima upah penuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “apa yang telah kamu usahakan”, bukan “apa yang telah kami usahakan”.
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Jagalah dirimu masing-masing
  rationale: Imperatif kini jamak menyerukan kewaspadaan yang terus-menerus. Bentuk distributif ini menyampaikan bahwa seluruh pembaca harus menjaga diri tanpa memakai bentuk yang dapat terdengar janggal dalam bahasa Indonesia.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: supaya kamu tidak kehilangan
  rationale: ἵνα dengan subjungtif menyatakan tujuan atau hasil yang hendak dihindari; dalam konteks hasil pekerjaan dan upah, ἀπόλλυμι berarti kehilangan, bukan membinasakan.
- source_word: ἃ εἰργασάμεθα
  choice: apa yang telah kami kerjakan
  rationale: Mengikuti teks SBLGNT yang memakai orang pertama jamak. Bentuk perfek menunjuk kepada pekerjaan yang telah dilakukan dengan hasil yang masih menjadi perhatian.
- source_word: μισθὸν πλήρη
  choice: upah sepenuhnya
  rationale: μισθός dapat berarti upah atau ganjaran. 'Upah' wajar dalam hubungan dengan pekerjaan, sedangkan 'sepenuhnya' mempertahankan tekanan πλήρη pada penerimaan yang utuh dan menghindari kesan bahwa kualitas upahnya yang sempurna.
- source_word: ἀπολάβητε
  choice: menerima
  rationale: Dalam konteks ini, kata tersebut secara alami berarti menerima atau memperoleh; unsur 'kembali' tidak cukup tegas untuk ditambahkan ke teks utama.
theological_decisions:
- issue: Subjek εἰργασάμεθα
  choice: yang telah kami kerjakan
  alternative: yang telah kamu kerjakan
  rationale: Teks SBLGNT yang diberikan memakai orang pertama jamak, sehingga pekerjaan itu dikaitkan dengan penulis dan rekan-rekannya. Varian orang kedua jamak mengaitkannya dengan para pembaca; varian tersebut dicatat tanpa mengganti bacaan teks utama.
- issue: Makna μισθός
  choice: upah
  alternative: ganjaran
  rationale: Konteks pekerjaan mendukung gambaran upah, tetapi ayat tidak menjelaskan sifat atau dasar upah tersebut. Terjemahan tidak menambahkan rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. 'Jagalah dirimu masing-masing' mempertahankan sapaan jamak secara alami; 'upah sepenuhnya' menyampaikan kelengkapan penerimaan tanpa memperluas makna teologis.
