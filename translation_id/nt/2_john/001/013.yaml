  text: The children of your chosen sister greet you.
translation:
  language: id
  text: Anak-anak dari saudarimu yang terpilih menyampaikan salam kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: menyampaikan salam kepadamu
  rationale: Mengungkapkan idiom salam Yunani secara alami dalam bahasa Indonesia sambil mempertahankan objek tunggal 'kepadamu'.
- source_word: τὰ τέκνα
  choice: Anak-anak
  rationale: Bentuk jamak netral ini paling langsung diterjemahkan sebagai 'anak-anak'.
- source_word: τῆς ἀδελφῆς σου
  choice: dari saudarimu
  rationale: ἀδελφή berarti saudara perempuan; bentuk posesif diterjemahkan ringkas sebagai 'saudarimu'.
- source_word: τῆς ἐκλεκτῆς
  choice: yang terpilih
  rationale: Mempertahankan makna bahwa saudari tersebut dipilih tanpa menentukan pelaku pemilihan yang tidak dinyatakan dalam teks.
theological_decisions:
- issue: Apakah 'saudari' menunjuk seorang perempuan atau suatu jemaat
  choice: Mempertahankan ungkapan 'saudarimu' tanpa penjelasan tambahan
  alternative: Menafsirkan secara eksplisit sebagai jemaat saudari
  rationale: Bahasa surat dapat dipahami secara harfiah maupun sebagai personifikasi jemaat; terjemahan tidak seharusnya menutup ambiguitas tersebut.
- issue: Nuansa ἐκλεκτή
  choice: terpilih
  alternative: pilihan; yang dipilih
  rationale: '''Terpilih'' menyampaikan nuansa pemilihan dengan wajar dan tetap tidak menyebut siapa yang memilih.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas referen 'saudari'.
