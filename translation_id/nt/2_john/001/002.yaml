  source_fidelity: Draf dengan tepat menerjemahkan διά + akusatif sebagai "karena", mempertahankan ἀλήθεια sebagai "kebenaran", dan tidak mempersempit makna Yohanes yang disengaja. "Tetap ada di dalam kita" mencerminkan τὴν μένουσαν ἐν ἡμῖν dengan baik, dan "selama-lamanya" tepat untuk εἰς τὸν αἰῶνα. Namun, klausa "dan akan bersama kita" terlalu eliptis dalam bahasa Indonesia dan tidak secara jelas merepresentasikan ἔσται ("akan ada/be").
  naturalness: Secara umum ragamnya baku dan alami. Penambahan "ada" dalam "akan ada bersama kita" menghasilkan klausa Indonesia yang lengkap dan lebih jelas tanpa menambah gagasan duratif yang tidak diulang dalam bahasa Yunani.
  terminology: '"Kebenaran" adalah padanan yang tepat dan mempertahankan keluasan teologis ἀλήθεια. "Di dalam kita" dapat dipertahankan sebagai terjemahan langsung ἐν ἡμῖν; tidak perlu menggantinya dengan "di antara kita". Catatan "tinggal" merupakan alternatif leksikal yang sah untuk μένω.'
