translation:
  language: id
  text: karena kebenaran yang tetap ada di dalam kita[a] dan akan ada bersama kita selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tinggal di dalam kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: karena
  rationale: Dengan kasus akusatif, διά menyatakan alasan atau sebab. Dalam konteksnya, frasa ini menjelaskan dasar kasih yang disebutkan dalam ayat 1.
- source_word: ἀλήθειαν
  choice: kebenaran
  rationale: Padanan langsung ini mempertahankan keluasan makna teologis ἀλήθεια dalam tulisan Yohanes tanpa mempersempitnya menjadi berita Injil atau ajaran tertentu.
- source_word: τὴν μένουσαν
  choice: yang tetap ada
  rationale: Partisipel kini μένω menyatakan keberadaan yang terus berlangsung. 'Tetap ada' alami dalam bahasa Indonesia modern dan mempertahankan aspek duratifnya.
- source_word: ἐν ἡμῖν
  choice: di dalam kita
  rationale: ἐν dengan datif paling langsung menyatakan keberadaan di dalam diri atau komunitas orang percaya. Pilihan ini juga mempertahankan ungkapan khas Yohanes.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: dan akan bersama kita
  rationale: μετά dengan genitif berarti 'bersama', sedangkan ἔσται adalah bentuk mendatang dari 'ada'. Terjemahan ini tidak menambahkan gagasan 'tetap' yang tidak diulangi pada klausa Yunani ini.
- source_word: εἰς τὸν αἰῶνα
  choice: selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan keberlangsungan tanpa akhir; 'selama-lamanya' merupakan padanan Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Makna teologis 'kebenaran' dalam tulisan Yohanes
  choice: Mempertahankan istilah umum 'kebenaran' tanpa menentukan rujukannya lebih lanjut.
  alternative: Menerjemahkannya sebagai 'kebenaran Injil' atau 'ajaran yang benar'.
  rationale: Konteks memberi istilah ini bobot teologis yang kaya, tetapi teks Yunani tidak secara eksplisit membatasinya pada berita Injil, ajaran tertentu, Kristus, atau karya Roh. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat diawali huruf kecil karena ayat ini melanjutkan susunan kalimat dari ayat 1. 'Kita' dipertahankan sebagai bentuk inklusif yang wajar untuk ἡμῖν.
