id: 2JN.1.5
reference: 2 John 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: id
  text: Sekarang aku memintamu[a], Ibu, bukan seolah-olah aku sedang menuliskan perintah baru kepadamu, melainkan perintah yang sudah kita miliki sejak semula, yaitu supaya kita saling mengasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kepada jemaat”, jika sapaan “Ibu” dipahami secara kiasan; kemungkinan lain, sebagian orang memahami kata Yunani Kyria sebagai nama diri.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: aku memintamu
  rationale: Dalam konteks surat ini, ἐρωτάω berarti meminta atau memohon. 'Memintamu' alami dalam bahasa Indonesia dan tidak memperkuat nadanya menjadi 'mendesak'.
- source_word: κυρία
  choice: Ibu
  rationale: κυρία adalah bentuk sapaan tunggal bagi seorang perempuan terhormat. 'Ibu' merupakan sapaan modern yang wajar dan bermartabat; catatan kaki mempertahankan kemungkinan bahwa sapaan ini bersifat kiasan bagi jemaat atau merupakan nama diri.
- source_word: ἐντολὴν καινὴν
  choice: perintah baru
  rationale: Padanan langsung yang mempertahankan gema ungkapan khas dalam tulisan-tulisan Yohanes.
- source_word: γράφων σοι
  choice: aku sedang menuliskan ... kepadamu
  rationale: Partisipel γράφων dinyatakan secara idiomatis setelah 'seolah-olah', dengan aspek tindakan menulis yang sedang dilakukan tetap terlihat.
- source_word: ἣν εἴχομεν
  choice: perintah yang sudah kita miliki
  rationale: Imperfek εἴχομεν bersama 'sejak semula' menunjukkan kepemilikan yang bermula pada masa lampau dan tetap relevan; 'sudah ... miliki' menyampaikannya secara alami.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Ungkapan ini alami, bermartabat, dan mempertahankan corak khas Yohanes mengenai sesuatu yang ada sejak awal.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: yaitu supaya kita saling mengasihi
  rationale: ἵνα di sini menjelaskan isi perintah sekaligus membawa nuansa tujuan atau ajakan. 'Yaitu supaya' mempertahankan kedua fungsi itu dengan jelas.
theological_decisions:
- issue: Rujukan κυρία
  choice: Menerjemahkannya sebagai sapaan 'Ibu' tanpa menetapkan identitas penerima.
  alternative: Memahaminya sebagai sebutan kiasan bagi jemaat setempat, atau sebagai nama diri Kyria.
  rationale: Bahasa Yunani memungkinkan lebih dari satu penafsiran. Teks utama mempertahankan bentuk sapaan kepada perempuan, sedangkan catatan kaki menyatakan kemungkinan lain tanpa memutuskan persoalan tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada surat yang hangat dan bermartabat. Kata ganti 'aku' dan '-mu' mencerminkan sapaan tunggal serta corak pribadi surat. Struktur Yunani dipertahankan sejauh tetap alami dalam bahasa Indonesia.
