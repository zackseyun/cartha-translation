id: MAT.6.5
reference: Matthew 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: id
  text: “Setiap kali kamu berdoa, janganlah kamu seperti orang-orang munafik. Sebab, mereka suka berdiri dan berdoa di sinagoge-sinagoge dan di sudut-sudut jalan yang lebar[a] supaya dilihat orang. Sesungguhnya Aku berkata kepadamu, mereka sudah menerima upah mereka sepenuhnya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “di sudut-sudut jalan.” Secara lebih harfiah, teks Yunani berbunyi “di sudut-sudut jalan-jalan yang lebar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “mereka telah menerima upah mereka.” Kata kerja Yunani dapat mengandung arti menerima pembayaran secara penuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: setiap kali kamu berdoa
  rationale: Mengungkapkan waktu yang tidak tertentu dan tindakan yang dapat berulang, bukan hanya satu kesempatan.
- source_word: οὐκ ἔσεσθε ὡς
  choice: janganlah kamu seperti
  rationale: Menyampaikan daya larangan dari bentuk futurum Yunani dalam bahasa Indonesia yang wajar dan khidmat.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Padanan Indonesia yang lazim bagi orang yang mempertunjukkan kesalehan demi penampilan.
- source_word: συναγωγαῖς
  choice: sinagoge-sinagoge
  rationale: Mempertahankan kekhususan historis tempat pertemuan dan ibadah Yahudi.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: di sudut-sudut jalan yang lebar
  rationale: Mengikuti gambaran harfiah tentang sudut jalan-jalan atau ruang lalu lintas umum yang lebar, sambil tetap mudah dipahami.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: berdiri dan berdoa
  rationale: Mempertahankan urutan dan gambaran tindakan dalam teks Yunani tanpa menyiratkan bahwa berdiri itu sendiri merupakan masalahnya.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: supaya dilihat orang
  rationale: Menyampaikan tujuan tindakan tersebut; ἀνθρώποις bersifat generik dan merujuk kepada orang pada umumnya.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Ungkapan khidmat dan alami yang mempertahankan fungsi penegasan formula perkataan Yesus.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: mereka telah menerima upah mereka sepenuhnya
  rationale: ἀπέχω dapat dipakai sebagai istilah penerimaan pembayaran secara penuh; bentuk ini menyatakan bahwa pengakuan manusia merupakan seluruh upah yang mereka peroleh.
theological_decisions:
- issue: Sasaran keinginan untuk dilihat
  choice: dilihat orang
  alternative: dilihat manusia
  rationale: Kata Yunani merujuk secara umum kepada para pengamat manusia, bukan khusus kepada laki-laki.
- issue: Daya ungkapan tentang upah
  choice: telah menerima upah mereka sepenuhnya
  alternative: telah menerima upah mereka
  rationale: Kata kerja ἀπέχουσι dapat mengandung nuansa komersial ‘menerima secara penuh’. Terjemahan ini mempertahankan peringatan bahwa pujian yang dicari dari orang adalah upah yang sudah mereka dapatkan, tanpa menentukan lebih lanjut hakikat penghakiman ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Istilah “sinagoge” dipakai untuk menjaga latar Yahudi yang khusus. Bentuk jamak “kamu” tersirat oleh konteks Yunani; bahasa Indonesia tidak membedakan jumlah pada bentuk tersebut.
