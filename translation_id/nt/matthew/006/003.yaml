  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: id
  text: Namun, ketika kamu memberi sedekah[a], jangan biarkan tangan kirimu tahu apa yang dilakukan tangan kananmu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan pemberian amal”; istilah Yunani ini merujuk pada pemberian amal, khususnya bagi orang miskin atau yang membutuhkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Namun, ketika kamu memberi
  rationale: Konstruksi genitif absolut dengan δέ menyatakan kontras dengan ayat sebelumnya. Ungkapan ini dialihkan secara wajar ke dalam bahasa Indonesia sebagai “Namun, ketika kamu memberi.” Kata ποιέω secara harfiah berarti “melakukan”, tetapi bersama ἐλεημοσύνην menunjuk pada tindakan memberi sedekah.
- source_word: ἐλεημοσύνην
  choice: sedekah kepada orang miskin
  rationale: Istilah ini menunjuk pada pemberian amal, khususnya bagi orang miskin. “Sedekah kepada orang miskin” jelas bagi pembaca modern dan tetap mempertahankan gagasan tindakan amal; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: μὴ γνώτω
  choice: jangan biarkan ... tahu
  rationale: Imperatif aoris orang ketiga dengan μή secara alami dinyatakan sebagai larangan “jangan biarkan ... tahu”, sambil mempertahankan personifikasi kedua tangan.
- source_word: ἡ ἀριστερά σου
  choice: tangan kirimu
  rationale: Terjemahan langsung ini mempertahankan metafora dan kesejajaran ungkapan sumber.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: apa yang dilakukan tangan kananmu
  rationale: Bentuk kini ποιεῖ menyatakan tindakan tangan kanan dalam gambaran tersebut. Bentuk “dilakukan” terdengar alami dalam peribahasa Indonesia dan mempertahankan hubungan dengan tindakan memberi.
theological_decisions:
- issue: Makna ungkapan tangan kiri dan tangan kanan
  choice: Mempertahankan metafora sebagai seruan untuk memberi tanpa pamer dan dengan kerahasiaan yang sangat kuat.
  alternative: Menjelaskannya sebagai larangan mutlak terhadap semua pemberian yang terlihat oleh orang lain, atau meratakannya menjadi nasihat umum tentang kerendahan hati.
  rationale: Teks memakai personifikasi dan gaya hiperbolis. Mempertahankan gambaran aslinya menjaga daya ucapannya tanpa memasukkan kesimpulan doktrinal yang lebih sempit daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “kamu”, selaras dengan bentuk tunggal dalam bahasa Yunani. Diksi dibuat alami dan bermartabat; metafora tangan kiri dan tangan kanan dipertahankan. Tanda koma akhir mengikuti ayat yang berlanjut ke kalimat berikutnya.
