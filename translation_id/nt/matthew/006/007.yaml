id: MAT.6.7
reference: Matthew 6:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: id
  text: Ketika kalian berdoa, jangan menumpuk kata-kata kosong[a] seperti orang-orang bukan Yahudi,[b] sebab mereka menyangka bahwa mereka akan didengar karena banyaknya kata-kata mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan berceloteh” atau “jangan mengulang-ulang kata tanpa makna.” Kata kerja Yunani ini langka dan kemungkinan menunjuk pada perkataan yang kosong, mekanis, atau bertele-tele, bukan pada setiap pengulangan doa yang sungguh-sungguh.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang dari bangsa lain”; dapat juga diterjemahkan “orang-orang kafir.” Istilah Yunani ini secara harfiah menunjuk kepada orang-orang dari bangsa-bangsa di luar umat perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: Ketika kalian berdoa
  rationale: Partisip ini berfungsi adverbial dan memperkenalkan keadaan saat larangan berlaku. Bentuk orang kedua jamak dipertahankan secara jelas dengan “kalian”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai kelanjutan pengajaran. Dalam bahasa Indonesia, alurnya tetap alami tanpa konjungsi eksplisit; menerjemahkannya sebagai “tetapi” akan memberi kesan pertentangan yang terlalu kuat.
- source_word: μὴ βατταλογήσητε
  choice: jangan menumpuk kata-kata kosong
  rationale: Kata kerja yang langka ini kemungkinan menunjuk pada ujaran yang kosong, mekanis, atau bertele-tele. Pilihan ini menyampaikan baik banyaknya kata maupun kehampaannya tanpa menyiratkan bahwa semua pengulangan dalam doa dilarang.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: seperti orang-orang bukan Yahudi
  rationale: Dalam konteks Yahudi ini, ἐθνικοί menunjuk kepada orang-orang dari bangsa-bangsa di luar umat perjanjian. “Orang-orang bukan Yahudi” lebih langsung dan tidak seinterpretif “para penyembah berhala”.
- source_word: δοκοῦσιν
  choice: mereka menyangka
  rationale: Kata ini mengungkapkan anggapan mereka mengenai cara doa didengar. “Menyangka” alami dan juga mengisyaratkan bahwa anggapan tersebut keliru.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: karena banyaknya kata-kata mereka
  rationale: Frasa preposisional ini menyatakan dasar yang mereka anggap menyebabkan doa didengar. Terjemahan kausal ini jelas dan tetap dekat dengan πολυλογία, yaitu banyak bicara atau kepanjangan kata.
- source_word: εἰσακουσθήσονται
  choice: mereka akan didengar
  rationale: Bentuk pasif ini berarti memperoleh pendengaran yang berkenan. “Akan didengar” mempertahankan ungkapan sumber tanpa memperkuatnya menjadi “akan dikabulkan”.
theological_decisions:
- issue: Apakah Yesus melarang segala pengulangan dalam doa atau secara khusus ujaran yang kosong dan bertele-tele
  choice: Teks utama memakai “jangan menumpuk kata-kata kosong”, sehingga larangan diarahkan pada banyak bicara yang hampa sebagai cara untuk memperoleh perhatian ilahi.
  alternative: “jangan mengulang-ulang kata tanpa makna” atau “jangan berceloteh”
  rationale: Kata kerja Yunani tersebut langka dan maknanya tidak sepenuhnya pasti. Pilihan utama mempertahankan cakupan maknanya tanpa menyelesaikan ketegangan dengan menyatakan bahwa setiap pengulangan doa pasti dilarang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pengajaran yang lugas dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak Yunani; ungkapan “menumpuk kata-kata kosong” mempertahankan citra banyak bicara sekaligus kehampaan isinya.
