  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: id
  text: 'Perhatikanlah burung-burung di langit: mereka tidak menabur, tidak menuai, dan tidak mengumpulkan hasil ke dalam lumbung, dan Bapamu yang di surga memberi mereka makan. Bukankah kamu lebih berharga daripada mereka?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Perhatikanlah
  rationale: Imperatif aoris ini mengarahkan perhatian dengan sengaja. “Perhatikanlah” alami dalam bahasa Indonesia dan menyampaikan lebih dari sekadar melihat sepintas tanpa melebih-lebihkan intensitasnya.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: πετεινά menunjuk pada burung atau makhluk terbang, sedangkan οὐρανός dalam konteks alam yang terlihat paling wajar diterjemahkan “langit”. Frasa “di langit” lebih alami daripada bentuk kepunyaan harfiah.
- source_word: ὅτι
  choice: ':'
  rationale: Klausa sesudahnya menjelaskan apa yang harus diperhatikan tentang burung-burung itu. Tanda titik dua mempertahankan hubungan penjelas tersebut dalam susunan bahasa Indonesia yang alami tanpa memaksakan “karena” atau “bahwa”.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: mereka tidak menabur, tidak menuai, dan tidak mengumpulkan hasil
  rationale: Pilihan ini mempertahankan rangkaian gambaran pertanian. Kata “hasil” melengkapi objek tersirat dari “mengumpulkan” agar kalimat jelas dan wajar dalam bahasa Indonesia.
- source_word: εἰς ἀποθήκας
  choice: ke dalam lumbung
  rationale: ἀποθήκη adalah tempat menyimpan hasil pertanian. “Lumbung” mempertahankan latar agraris dan mudah dipahami.
- source_word: καί
  choice: tetapi
  rationale: Walaupun καί biasanya berarti “dan”, di sini terdapat pertentangan nyata antara burung yang tidak melakukan pekerjaan pertanian dan Bapa yang tetap memberi mereka makan. “Tetapi” menyatakan hubungan wacana itu secara alami.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Bapamu yang di surga
  rationale: Ungkapan ini mempertahankan sebutan relasional “Bapa” dan sifat surgawi-Nya. Bentuk tunggal “-mu” dalam bahasa Indonesia dapat menyapa kelompok secara kolektif, sesuai ὑμῶν yang jamak.
- source_word: τρέφει αὐτά
  choice: memberi mereka makan
  rationale: τρέφω di sini berarti menyediakan makanan atau memberi makan. Ungkapan ini langsung, alami, dan tidak memperluas maknanya menjadi seluruh pemeliharaan secara umum.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Bukankah kamu lebih berharga daripada mereka?
  rationale: Pertanyaan retoris ini mengharapkan jawaban positif. διαφέρω bersama μᾶλλον menyatakan keunggulan dalam nilai; “lebih berharga” menyampaikan perbandingan itu tanpa menambahkan dasar teologis yang tidak disebutkan.
theological_decisions:
- issue: Nilai manusia dibandingkan dengan burung dalam pemeliharaan Allah
  choice: Ayat ini menyatakan bahwa para pendengar Yesus lebih berharga daripada burung-burung, tanpa menjelaskan dasar doktrinal bagi nilai tersebut.
  alternative: Menjelaskan bahwa manusia lebih berharga karena diciptakan menurut gambar Allah atau semata-mata karena hubungan perjanjian.
  rationale: Teks menegaskan perbandingan nilai, tetapi tidak menyebutkan alasan teologisnya. Terjemahan mempertahankan penegasan itu tanpa memasukkan penjelasan dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “tidak” mempertahankan irama retoris teks Yunani, sedangkan “Perhatikanlah” dan “Bukankah” cocok untuk pengajaran langsung kepada khalayak umum.
