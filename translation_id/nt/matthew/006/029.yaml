id: MAT.6.29
reference: Matthew 6:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: Salomo pun, dalam segala kemegahannya, tidak berpakaian seperti salah satu dari bunga-bunga ini.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: λέγω dengan datif ὑμῖν berarti 'Aku berkata kepadamu'. δέ menyatakan kontras ringan dengan gambaran sebelumnya; 'Namun' alami dan tidak terlalu tajam.
- source_word: οὐδὲ Σολομὼν
  choice: Salomo pun ... tidak
  rationale: οὐδέ memberi penekanan bahwa bahkan Salomo tidak menyamai bunga-bunga itu. Konstruksi 'Salomo pun ... tidak' merupakan padanan Indonesia yang alami.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: dalam segala kemegahannya
  rationale: Dalam konteks ini δόξα menunjuk pada kemegahan atau semarak kerajaan, bukan kemuliaan ilahi. 'Kemegahan' menyampaikan makna kontekstual dengan jelas.
- source_word: περιεβάλετο
  choice: berpakaian
  rationale: Bentuk medium/pasif περιβάλλω di sini berarti mengenakan pakaian atau berada dalam keadaan berpakaian. 'Berpakaian' mempertahankan citra busana secara alami dalam bahasa Indonesia.
- source_word: ὡς ἓν τούτων
  choice: seindah salah satu dari bunga-bunga ini
  rationale: ὡς menyatakan perbandingan, sedangkan ἓν mempertahankan acuan tunggal. Unsur 'indah' dibuat eksplisit secara idiomatis dari perbandingan tentang bagaimana bunga-bunga itu didandani dalam konteks langsung; 'bunga-bunga' memperjelas anteseden τούτων.
theological_decisions:
- issue: Makna δόξα ketika merujuk kepada Salomo
  choice: kemegahan
  alternative: kemuliaan; semarak
  rationale: Konteksnya membandingkan penampilan kerajaan Salomo dengan bunga-bunga, sehingga 'kemegahan' menghindari kesan bahwa yang dimaksud ialah kemuliaan ilahi.
- issue: Daya pembanding περιεβάλετο ὡς
  choice: berpakaian seindah
  alternative: didandani seperti; berpakaian seperti
  rationale: Ungkapan ini menyampaikan perbandingan penampilan secara wajar dalam bahasa Indonesia. Konteks ayat sebelumnya mendukung dimensi keindahan tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ilahi 'Aku' dikapitalisasi menurut konvensi umum Alkitab bahasa Indonesia. Kalimat dibuat mudah dipahami dengan memperjelas acuan 'ini' sebagai bunga-bunga dari konteks sebelumnya.
