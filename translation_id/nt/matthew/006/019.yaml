  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: id
  text: Janganlah kalian menimbun harta bagi diri kalian sendiri di bumi, tempat ngengat dan pelapukan[a] menghancurkannya, dan tempat pencuri membongkar[b] dan mencuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karat”. Kata Yunani ini secara lebih luas dapat berarti proses yang memakan, menghabiskan, atau menyebabkan sesuatu menjadi lapuk.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “menggali menembus”, kemungkinan mengacu pada pencuri yang membobol dinding rumah dari bata lumpur.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Janganlah menimbun
  rationale: Larangan ini diterjemahkan secara alami sambil mempertahankan gagasan mengumpulkan dan menyimpan kekayaan.
- source_word: ὑμῖν
  choice: bagi dirimu
  rationale: Datif ini bersifat refleksif dalam konteks dan menunjuk pada penimbunan demi kepentingan atau kepunyaan sendiri.
- source_word: θησαυροὺς
  choice: harta
  rationale: Dalam bahasa Indonesia modern, 'harta' secara wajar mencakup kekayaan atau barang berharga dan berpasangan alami dengan kata kerja 'menimbun'.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Ungkapan lokatif ini mempertahankan kontras dengan surga pada ayat berikutnya dan terdengar alami dalam bahasa Indonesia.
- source_word: σὴς
  choice: ngengat
  rationale: Padanan langsung yang menggambarkan kerusakan pada pakaian atau barang simpanan.
- source_word: βρῶσις
  choice: pelapukan
  rationale: Kata ini dapat menunjuk pada proses memakan atau menghabiskan, sehingga 'pelapukan' mempertahankan cakupan kerusakan yang lebih luas daripada karat saja.
- source_word: ἀφανίζει
  choice: merusakkannya
  rationale: Kata kerja ini menyatakan tindakan membuat sesuatu lenyap atau rusak; akhiran '-nya' memperjelas bahwa harta itulah yang dirusak.
- source_word: κλέπται
  choice: pencuri
  rationale: Padanan Indonesia yang langsung dan lazim.
- source_word: διορύσσουσιν
  choice: membongkar tembok
  rationale: Secara harfiah berarti menggali atau menembus; dalam konteks rumah kuno, ini kemungkinan menunjuk pada pembobolan dinding. Pilihan ini lebih konkret daripada sekadar 'membobol masuk'.
- source_word: κλέπτουσιν
  choice: mencurinya
  rationale: Padanan langsung; akhiran '-nya' kembali menunjuk pada harta yang dicuri.
theological_decisions:
- issue: Cakupan γῆ dan kontras dengan surga
  choice: di bumi
  alternative: di dunia
  rationale: '''Di bumi'' mempertahankan gambaran tempat dan kontras tekstual dengan surga tanpa memperluasnya menjadi konsep moral ''dunia''.'
- issue: Makna βρῶσις
  choice: pelapukan
  alternative: karat
  rationale: '''Pelapukan'' mempertahankan makna luas berupa proses yang memakan atau menghancurkan, sedangkan ''karat'' mungkin terlalu membatasi kerusakan pada logam. Alternatif tradisional dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'dirimu' mengikuti sapaan orang kedua jamak Yunani sebagai nasihat kolektif yang dalam bahasa Indonesia dapat dinyatakan secara umum; susunan kalimat menjaga pengulangan 'tempat ... dan tempat ...' dari teks sumber.
