review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama karena ὑμῖν berbentuk jamak, sedangkan “dirimu” berbentuk tunggal. Selain itu, “tembok” tidak dinyatakan secara eksplisit dalam διορύσσουσιν; unsur latar budaya itu lebih tepat dipertahankan dalam catatan kaki. “Membongkar” menyampaikan tindakan menembus/membobol secara memadai tanpa menambahkan objek yang tidak ada dalam teks.
  naturalness: Teks revisi memakai bentuk jamak yang jelas dan susunan yang tetap alami dalam bahasa Indonesia baku. “Menghancurkannya” menyatakan daya rusak ἀφανίζει dengan lebih langsung, sedangkan “membongkar dan mencuri” merupakan rangkaian yang lazim dalam register Alkitab modern.
  terminology: “Harta,” “di bumi,” “ngengat,” dan “pencuri” tepat. “Pelapukan” dapat dipertahankan sebagai padanan luas untuk βρῶσις, dengan “karat” dicatat sebagai alternatif. Penanda catatan kaki dipindahkan agar langsung mengacu pada “pelapukan,” bukan pada seluruh klausa.
  issues:
  - severity: medium
    issue: “dirimu” menerjemahkan pronomina datif jamak ὑμῖν dengan bentuk tunggal.
    rationale: Nasihat Yesus dalam teks Yunani ditujukan kepada lebih dari satu orang. “Diri kalian sendiri” mempertahankan nilai refleksif sekaligus jumlah jamaknya.
  - severity: low
    issue: “tembok” ditambahkan ke dalam teks utama untuk διορύσσουσιν.
    rationale: Kata Yunani itu secara harfiah mengandung gagasan menggali/menembus, dan dinding bata lumpur adalah penjelasan latar yang mungkin, bukan objek eksplisit dalam ayat. Penjelasan tersebut sebaiknya tetap di catatan kaki.
  - severity: low
    issue: Penanda [a] ditempatkan setelah “merusakkannya,” bukan pada padanan βρῶσις.
    rationale: Catatan tersebut menjelaskan pilihan leksikal “pelapukan” dan alternatif “karat”; penandanya harus melekat pada kata itu.
