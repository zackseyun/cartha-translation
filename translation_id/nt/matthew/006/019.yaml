revisions:
- from: Janganlah menimbun harta bagi dirimu di bumi, tempat ngengat dan pelapukan merusakkannya,[a] dan tempat pencuri membongkar tembok[b] lalu mencurinya.
  to: Janganlah kalian menimbun harta bagi diri kalian sendiri di bumi, tempat ngengat dan pelapukan[a] menghancurkannya, dan tempat pencuri membongkar[b] dan mencuri.
  rationale: Revisi memulihkan bentuk jamak refleksif dari ὑμῖν, menghindari penambahan “tembok” pada teks utama, dan menautkan catatan kaki leksikal pada “pelapukan.” Makna βρῶσις yang lebih luas daripada korosi logam tetap dipertahankan, sementara alternatif tradisional “karat” tersedia dalam catatan kaki.
