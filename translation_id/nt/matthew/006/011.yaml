  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: id
  text: Berilah kami hari ini roti kami sehari-hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti kami untuk hari ini,” “roti kami untuk hari yang akan datang,” atau “roti yang kami perlukan.” Kata sifat Yunani ἐπιούσιον jarang ditemukan dan makna tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: roti kami
  rationale: ἄρτος secara konkret berarti “roti” dan ἡμῶν menyatakan kepunyaan. Ungkapan konkret ini dipertahankan, meskipun “roti” dapat mewakili makanan atau kebutuhan hidup secara lebih luas.
- source_word: τὸν ἐπιούσιον
  choice: sehari-hari
  rationale: ἐπιούσιος sangat jarang dan maknanya diperdebatkan. “Sehari-hari” merupakan padanan Indonesia yang mapan dan alami dalam Doa Bapa Kami, tetapi alternatif penting tetap dicatat karena kata ini mungkin menunjuk pada kebutuhan hari ini, hari yang akan datang, atau kebutuhan untuk kelangsungan hidup.
- source_word: δὸς ἡμῖν
  choice: Berilah kami
  rationale: δὸς adalah bentuk imperatif dari δίδωμι, sedangkan ἡμῖν adalah penerimanya. “Berilah kami” langsung, wajar, dan sesuai dengan ragam doa yang bermartabat.
- source_word: σήμερον
  choice: hari ini
  rationale: σήμερον berarti “hari ini”; pilihan ini mempertahankan penanda waktu secara jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna ἐπιούσιον dalam Doa Bapa Kami
  choice: sehari-hari
  alternative: untuk hari ini; untuk hari yang akan datang; yang kami perlukan
  rationale: Makna tepat ἐπιούσιος tidak pasti. Teks utama memakai ungkapan yang mapan dan mudah dipahami tanpa menjadikan satu rekonstruksi ilmiah sebagai satu-satunya arti; ketegangan leksikal yang nyata dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam doa yang alami dan bermartabat. Bentuk “Berilah” mempertahankan permohonan langsung; “roti” mempertahankan gambaran konkret sumber.
