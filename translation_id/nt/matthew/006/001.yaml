id: MAT.6.1
reference: Matthew 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: id
  text: Tetapi berhati-hatilah agar tidak melakukan perbuatan benar kalian di hadapan orang-orang dengan maksud supaya dilihat oleh mereka.[a] Jika tidak demikian, kalian tidak mendapat upah dari Bapa kalian yang di surga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kebenaran kalian” atau “perbuatan-perbuatan benar kalian.” Sebagian naskah membaca “sedekah kalian.”
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “di dalam surga-surga”; bahasa Yunani memakai bentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: berhati-hatilah
  rationale: Imperatif kini jamak ini menyerukan kewaspadaan yang terus-menerus; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya peringatannya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari ajaran sebelumnya menuju sebuah peringatan.
- source_word: δικαιοσύνην ὑμῶν
  choice: kebenaran kalian
  rationale: Mempertahankan istilah luas ‘kebenaran’ dan unsur posesif dalam teks sumber, tanpa membatasinya hanya pada pemberian sedekah.
- source_word: μὴ ποιεῖν
  choice: agar kalian tidak melakukan
  rationale: Menyatakan tindakan yang harus dihindari; susunan dengan ‘agar ... tidak’ berpadu alami dengan kata peringatan di awal kalimat.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di hadapan orang lain
  rationale: Mengacu secara umum kepada manusia yang menjadi pengamat, bukan hanya laki-laki; ‘orang lain’ alami dalam konteks sapaan kepada para pendengar.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: dengan maksud supaya dilihat oleh mereka
  rationale: Mempertahankan makna tujuan yang disengaja serta bentuk pasif dari konstruksi Yunani.
- source_word: εἰ δὲ μή γε
  choice: Jika kalian melakukannya
  rationale: Dalam konteks larangan, ungkapan ini menyatakan akibat bila peringatan tersebut tidak diindahkan. Bentuk eksplisit ini lebih alami dan menghindari kemungkinan bahwa ‘jika tidak’ disalahpahami sebagai ‘jika tidak melakukan kebenaran’.
- source_word: μισθὸν
  choice: upah
  rationale: ‘Upah’ mempertahankan citra balasan atau imbalan dalam μισθός dan sesuai dengan rangkaian ajaran pada pasal ini.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: dari Bapa kalian
  rationale: Dalam konteks menerima balasan, παρά dengan datif paling wajar dipahami sebagai sumber upah tersebut.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: yang di surga
  rationale: Ungkapan Indonesia yang alami bagi tempat kediaman ilahi; bentuk jamak Yunani dijelaskan dalam catatan kaki agar ciri sumber tetap diketahui.
theological_decisions:
- issue: Cakupan δικαιοσύνην
  choice: kebenaran dalam arti luas, termasuk praktik hidup benar
  alternative: amal kebajikan; pemberian sedekah
  rationale: Teks SBLGNT membaca δικαιοσύνην, bukan ἐλεημοσύνην. Karena itu, teks utama tidak mempersempit maknanya menjadi pemberian sedekah, sementara kemungkinan makna konkret dan varian naskah dicatat.
- issue: Tujuan perbuatan di hadapan orang
  choice: larangan diarahkan pada maksud supaya dilihat, bukan pada setiap perbuatan benar yang dilakukan di depan umum
  alternative: larangan mutlak melakukan kebenaran di hadapan orang lain
  rationale: Konstruksi πρὸς τὸ θεαθῆναι menyatakan tujuan. Terjemahan mempertahankan hubungan ini agar ketegangan dengan Matius 5:16 tidak diselesaikan dengan menghapus unsur maksud.
- issue: Bentuk jamak τοῖς οὐρανοῖς
  choice: di surga dalam teks utama, dengan bentuk jamak sumber dicatat
  alternative: di surga-surga; di langit-langit
  rationale: Bentuk jamak harfiah terasa tidak alami dan dapat menimbulkan gagasan kosmologis tambahan dalam bahasa Indonesia. Catatan kaki mempertahankan informasi gramatikal tanpa membebani teks utama.
- issue: ἀνθρώπων sebagai sebutan generik
  choice: orang lain
  alternative: manusia; laki-laki
  rationale: Yang dimaksud ialah para pengamat manusia secara umum, bukan khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘kalian’ dipakai karena semua bentuk orang kedua dalam ayat ini jamak. ‘Bapa’ dikapitalisasi sebagai sebutan bagi Allah. Tanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskannya.
