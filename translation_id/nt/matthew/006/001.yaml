revisions:
- from: Namun, berhati-hatilah agar kalian tidak melakukan kebenaran kalian di hadapan orang lain dengan maksud supaya dilihat oleh mereka.[a] Jika kalian melakukannya, kalian tidak akan mendapat upah dari Bapa kalian yang di surga.[b]
  to: Tetapi berhati-hatilah agar tidak melakukan perbuatan benar kalian di hadapan orang-orang dengan maksud supaya dilihat oleh mereka.[a] Jika tidak demikian, kalian tidak mendapat upah dari Bapa kalian yang di surga.[b]
  rationale: Revisi memulihkan arah logis εἰ δὲ μή γε dengan “Jika tidak demikian,” memperjelas δικαιοσύνη sebagai praktik benar yang luas, dan mempertahankan varian “sedekah” hanya dalam catatan kaki. Istilah “surga” dipertahankan dalam teks utama sebagai bentuk Indonesia yang alami, sementara bentuk jamak Yunani dicatat.
