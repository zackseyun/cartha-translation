review_pass:
  verdict: revise
  source_fidelity: Perlu revisi karena klausa εἰ δὲ μή γε diterjemahkan terbalik. Ungkapan itu menyatakan konsekuensi “jika tidak demikian/kalau tidak,” bukan “Jika kalian melakukannya.” Terjemahan juga sebaiknya mempertahankan cakupan luas δικαιοσύνη sebagai perbuatan benar tanpa mengesankannya sebagai ‘kebenaran’ dalam arti lawan kebohongan.
  naturalness: Struktur kalimat umumnya baku, tetapi “melakukan kebenaran kalian” kurang idiomatis dalam bahasa Indonesia modern. “Melakukan perbuatan benar kalian” lebih jelas dalam konteks tindakan yang dipertontonkan.
  terminology: “Bapa,” “upah,” dan “surga” sesuai register dan konteks. Bentuk jamak τοῖς οὐρανοῖς dapat tetap diterjemahkan idiomatis sebagai “surga,” dengan catatan yang menyebut bentuk Yunani jamak. Catatan mengenai δικαιοσύνη perlu membedakan alternatif leksikal dari varian naskah secara lebih tepat.
  issues:
  - severity: high
    issue: Klausa akibat diterjemahkan sebagai “Jika kalian melakukannya.”
    rationale: εἰ δὲ μή γε berarti “jika tidak demikian/kalau tidak”; dalam konteks ini maksudnya jika peringatan itu tidak diperhatikan, yakni jika perbuatan dilakukan untuk dilihat orang. Draf justru membuat akibat berlaku bila mereka tidak melakukan tindakan tersebut.
  - severity: medium
    issue: “melakukan kebenaran kalian” kurang alami dan berpotensi menggeser δικαιοσύνη menjadi ‘kebenaran’ sebagai proposisi.
    rationale: Karena ποιεῖν δικαιοσύνην menunjuk pada pelaksanaan atau praktik yang benar, “perbuatan benar kalian” menyampaikan cakupan praktisnya tanpa mempersempitnya menjadi sedekah.
  - severity: low
    issue: Catatan a menyebut “amal-amal kebenaran” sebagai alternatif tanpa menjelaskan alternatif langsung bagi δικαιοσύνη.
    rationale: Alternatif yang lebih jelas ialah “kebenaran kalian” atau “perbuatan-perbuatan benar kalian”; kemudian varian naskah dapat disebut terpisah sebagai “sedekah kalian.”
