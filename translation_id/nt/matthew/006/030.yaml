id: MAT.6.30
reference: Matthew 6:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: id
  text: Namun, jika Allah mengenakan pakaian pada rumput di ladang, yang hari ini ada dan besok dilemparkan ke dalam tungku[a], sedemikian rupa, bukankah Ia akan terlebih lagi mengenakan pakaian pada kalian, hai kamu yang kurang percaya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah tungku pemanggang; rumput dan tumbuhan ladang yang telah mengering dapat dipakai sebagai bahan bakar.
    reason: cultural_note
  - marker: b
    text: Atau “hai kamu yang kurang beriman.” Kata Yunani ini adalah sapaan langsung berbentuk jamak yang menegur kurangnya iman atau kepercayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: δέ menandai peralihan argumentatif dengan kontras ringan; “Namun, jika” alami dalam bahasa Indonesia dan mempertahankan hubungan dengan ayat sebelumnya.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: rumput di padang
  rationale: χόρτος dapat menunjuk pada rumput atau tumbuhan liar; “rumput di padang” mempertahankan gambaran umum tanpa mempersempitnya menjadi bunga.
- source_word: σήμερον ὄντα
  choice: yang ada hari ini
  rationale: Ungkapan ini menyampaikan keberadaan yang singkat secara wajar, tanpa menambahkan nuansa “hidup” yang tidak dinyatakan secara eksplisit.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: besok dilemparkan ke dalam oven
  rationale: κλίβανος adalah oven pemanggang, sedangkan bentuk pasif βαλλόμενον dipertahankan dengan “dilemparkan”.
- source_word: οὕτως ἀμφιέννυσιν
  choice: mendandani ... seperti itu
  rationale: ἀμφιέννυμι secara harfiah berarti mengenakan pakaian atau mendandani. “Mendandani” paling alami untuk rumput sekaligus mempertahankan metafora pakaian dari konteks.
- source_word: οὐ πολλῷ μᾶλλον
  choice: bukankah Ia akan terlebih lagi
  rationale: Bentuk ini mempertahankan pertanyaan retoris dan daya argumen dari yang lebih kecil kepada yang lebih besar.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini berbentuk jamak. “Kalian” mengungkapkan jumlah tersebut secara jelas dalam bahasa Indonesia modern.
- source_word: ὀλιγόπιστοι
  choice: hai orang-orang yang kurang percaya
  rationale: Vokatif jamak ini merupakan sapaan langsung yang menegur ketidakcukupan iman atau kepercayaan; pilihan ini menjaga daya tegur tanpa gaya arkais.
theological_decisions:
- issue: Argumen pemeliharaan ilahi dari yang lebih kecil kepada yang lebih besar
  choice: Dipertahankan sebagai pertanyaan retoris tentang Allah yang terlebih lagi akan mendandani para murid.
  alternative: Mengubahnya menjadi pernyataan langsung bahwa Allah pasti akan menyediakan pakaian.
  rationale: Susunan Yunani dengan οὐ πολλῷ μᾶλλον dan vokatif penutup mendukung pertanyaan retoris. Bentuk ini mempertahankan ketegangan nasihat Yesus tanpa menambahkan rumusan doktrinal.
- issue: Makna ὀλιγόπιστοι
  choice: orang-orang yang kurang percaya
  alternative: orang-orang yang kurang beriman
  rationale: πίστις dapat mencakup iman maupun kepercayaan. Dalam konteks kekhawatiran akan kebutuhan sehari-hari, “kurang percaya” menyampaikan kurangnya kepercayaan kepada pemeliharaan Allah, sementara catatan kaki menjaga alternatif “kurang beriman”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμᾶς secara jelas. Kapitalisasi “Ia” mengikuti kebiasaan penghormatan dalam teks religius Indonesia. Susunan “seperti itu” sengaja dekat dengan verba “mendandani” sambil tetap terbaca alami.
