  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: id
  text: 'Karena itu, hendaklah kalian berdoa seperti ini: “Bapa kami yang di surga[a], kiranya nama-Mu dikuduskan[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bentuk jamak, yang secara harfiah dapat diterjemahkan “di surga-surga.”
    reason: lexical_alternative
  - marker: b
    text: Artinya, kiranya nama-Mu diakui dan diperlakukan sebagai kudus.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Karena itu, ... seperti ini
  rationale: οὖν menghubungkan perintah ini sebagai kesimpulan dari ajaran sebelumnya, sedangkan Οὕτως menyatakan cara atau pola berdoa.
- source_word: προσεύχεσθε ὑμεῖς
  choice: berdoalah kalian
  rationale: Bentuk imperatif diterjemahkan sebagai perintah langsung. Kata ganti eksplisit ὑμεῖς dipertahankan melalui “kalian” untuk membawa penekanannya dan menunjukkan bahwa yang disapa berbentuk jamak.
- source_word: Πάτερ ἡμῶν
  choice: Bapa kami
  rationale: Sapaan vokatif ini secara alami diterjemahkan “Bapa kami”, dengan tetap mempertahankan sifat komunal kata ganti jamak.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: yang di surga
  rationale: Ungkapan ini menyatakan tempat kediaman Bapa. Bahasa Indonesia modern lazim memakai “surga” dalam bentuk tunggal sebagai padanan idiomatis, sementara bentuk jamak Yunani dijelaskan dalam catatan kaki.
- source_word: ἁγιασθήτω
  choice: kiranya ... dikuduskan
  rationale: Imperatif pasif orang ketiga menyatakan permohonan. “Kiranya ... dikuduskan” mempertahankan bentuk pasif dan bobot teologisnya tanpa menentukan secara sempit siapa pelakunya.
- source_word: τὸ ὄνομά σου
  choice: nama-Mu
  rationale: Terjemahan langsung yang mempertahankan kata “nama”; huruf kapital pada enklitik “-Mu” mengikuti konvensi bahasa Indonesia untuk sapaan kepada Allah.
theological_decisions:
- issue: Bentuk tunggal atau jamak dalam ungkapan τοῖς οὐρανοῖς
  choice: di surga
  alternative: di surga-surga
  rationale: Teks Yunani memakai bentuk jamak, tetapi penggandaan “surga-surga” tidak idiomatis dalam bahasa Indonesia dan dapat memberi kesan adanya beberapa surga yang terpisah. Bentuk sumber tetap dinyatakan secara terbuka dalam catatan kaki.
- issue: Makna dan pelaku ἁγιασθήτω
  choice: kiranya nama-Mu dikuduskan
  alternative: kiranya nama-Mu diperlakukan sebagai kudus
  rationale: Bentuk pasif sumber dipertahankan agar terjemahan tidak membatasi permohonan hanya pada sikap manusia atau secara diam-diam menentukan pelakunya. Catatan kaki menerangkan maknanya dalam bahasa sehari-hari.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Berdoalah kalian” mempertahankan perintah serta penekanan pada kata ganti jamak; “kiranya” menandai permohonan orang ketiga secara alami. Tanda kutip membuka doa yang berlanjut ke ayat-ayat berikutnya.
