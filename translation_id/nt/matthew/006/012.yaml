  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: id
  text: Dan ampunilah utang-utang kami[a], seperti kami juga telah mengampuni[b] orang-orang yang berutang kepada kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “utang-utang”; dalam konteks ini, utang menjadi gambaran bagi dosa atau pelanggaran.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “seperti kami juga mengampuni orang-orang yang berutang kepada kami.” Bentuk Yunani memandang tindakan mengampuni sebagai suatu keseluruhan; “telah mengampuni” menekankan bahwa tindakan itu sudah dilakukan.
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ampunilah
  rationale: Dalam konteks doa dan kesalahan moral yang digambarkan sebagai utang, bentuk imperatif ini paling wajar diterjemahkan sebagai permohonan agar Allah mengampuni, bukan sekadar melepaskan kewajiban keuangan.
- source_word: τὰ ὀφειλήματα
  choice: utang-utang
  rationale: Pilihan ini mempertahankan metafora sumber tentang sesuatu yang wajib dibayar sekaligus menjaga kaitannya dengan kata serumpun ὀφειλέταις. Dalam konteks ini, metafora tersebut menunjuk pada dosa atau pelanggaran.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini mempertahankan hubungan perbandingan antara pengampunan yang dimohon dari Allah dan pengampunan yang telah diberikan kepada sesama, tanpa menjelaskan lebih jauh sifat hubungan itu.
- source_word: καὶ ἡμεῖς
  choice: kami juga
  rationale: Terjemahan ini mempertahankan καὶ yang menekankan bahwa pihak yang berdoa juga melakukan tindakan yang dibandingkan itu.
- source_word: ἀφήκαμεν
  choice: telah mengampuni
  rationale: Aoristus menunjukkan tindakan sebagai suatu keseluruhan. Kata aspek 'telah' secara alami menyatakan tindakan yang sudah dilakukan dan masih relevan bagi permohonan ini, tanpa menjadikannya penanda kala yang terlalu kaku.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: orang-orang yang berutang kepada kami
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bahasa utang yang berhubungan langsung dengan 'utang-utang kami', sedangkan 'para pengutang kami' terdengar kurang lazim.
theological_decisions:
- issue: Metafora moral dalam ὀφειλήματα dan ὀφειλέταις
  choice: Mempertahankan 'utang-utang' dan 'orang-orang yang berutang' dalam teks utama.
  alternative: Menerjemahkannya secara langsung sebagai 'dosa-dosa/pelanggaran-pelanggaran' dan 'orang-orang yang bersalah kepada kami'.
  rationale: Bahasa Yunani sengaja memakai metafora utang untuk kesalahan moral. Mempertahankannya menjaga hubungan leksikal kedua bagian ayat dan tidak menghapus gambaran sumber; makna moral dijelaskan dalam catatan kaki.
- issue: Nuansa aspek ἀφήκαμεν
  choice: Menerjemahkan dengan 'telah mengampuni'.
  alternative: Menerjemahkan dengan 'mengampuni' atau 'sudah mengampuni'.
  rationale: Bentuk aoristus menggambarkan tindakan sebagai keseluruhan, tetapi tidak dengan sendirinya menentukan seluruh nuansa waktu. 'Telah mengampuni' menyampaikan bahwa tindakan itu sudah dilakukan dan relevan sekarang, sedangkan catatan kaki mempertahankan kemungkinan ungkapan Indonesia yang lebih sederhana.
- issue: Hubungan antara pengampunan Allah dan pengampunan manusia yang dinyatakan oleh ὡς
  choice: Memakai 'seperti' tanpa menambahkan penjelasan kausal atau syarat.
  alternative: Menambahkan 'karena', 'dengan syarat', atau 'sebanding dengan'.
  rationale: ὡς secara langsung menyatakan perbandingan. Teks tidak secara eksplisit merumuskan hubungan itu sebagai sebab, dasar jasa, atau persamaan ukuran; karena itu ketegangan teologisnya dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan sesuai dengan register doa. 'Ampunilah' mempertahankan kesantunan serta kekhidmatan tanpa terdengar kuno. Pengulangan bahasa utang sengaja dipertahankan agar metafora dan hubungan kata dalam bahasa Yunani tetap terlihat.
