id: MAT.6.24
reference: Matthew 6:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: id
  text: “Tidak seorang pun dapat mengabdi kepada dua tuan, sebab ia akan membenci yang satu dan mengasihi yang lain, atau ia akan berpaut pada yang satu dan memandang rendah yang lain. Kalian tidak dapat mengabdi kepada Allah dan Mamon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mamon berarti “harta” atau “kekayaan”. Teks Yunani mempertahankan kata pinjaman Semitik yang dapat menggambarkan kekayaan sebagai tuan saingan.
    reason: Menjelaskan arti kata pinjaman sambil mempertahankan personifikasi dan kesejajaran retoris dalam teks utama.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Tidak seorang pun
  rationale: Menyatakan penyangkalan universal secara jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: δύναται / δύνασθε
  choice: dapat / tidak dapat
  rationale: Mempertahankan penekanan pada kemampuan atau ketidakmampuan yang diulang dalam ayat ini.
- source_word: δυσὶ κυρίοις
  choice: dua tuan
  rationale: Dalam gambaran hubungan pengabdian di sini, κύριοι berarti para pemilik atau tuan yang menuntut kesetiaan, bukan gelar ilahi.
- source_word: δουλεύειν
  choice: mengabdi kepada
  rationale: Mengungkapkan pelayanan yang tunduk kepada seorang tuan dengan lebih kuat daripada sekadar 'melayani', sekaligus tetap alami dalam bahasa Indonesia.
- source_word: μισήσει
  choice: akan membenci
  rationale: Mempertahankan kekuatan antitesis Yunani dengan 'mengasihi' tanpa melunakkannya menjadi 'kurang mengasihi'.
- source_word: ἀγαπήσει
  choice: akan mengasihi
  rationale: Padanan yang alami dan bermartabat serta mempertahankan kontras langsung dengan 'membenci'.
- source_word: ἑνὸς ἀνθέξεται
  choice: akan berpaut pada yang satu
  rationale: ἀντέχομαι menyatakan berpegang erat, melekat, atau setia; 'berpaut' mempertahankan gambaran relasional itu secara ringkas.
- source_word: καταφρονήσει
  choice: memandang rendah
  rationale: Menyampaikan sikap meremehkan atau menghina dengan ungkapan Indonesia modern yang jelas.
- source_word: θεῷ
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk θεός ketika menunjuk kepada Allah.
- source_word: μαμωνᾷ
  choice: Mamon
  rationale: Mempertahankan kata pinjaman Semitik dan daya retorisnya sebagai penguasa saingan yang dipertentangkan dengan Allah; maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Arti κύριος dalam konteks sosial, bukan sebagai gelar ilahi
  choice: tuan
  alternative: Tuhan
  rationale: Bentuk jamak dan gambaran pengabdian menunjukkan hubungan dengan dua tuan. 'Tuan' menghindari kesan bahwa ayat ini berbicara tentang dua pribadi ilahi.
- issue: Penerjemahan μαμωνᾶς
  choice: Mamon
  alternative: harta atau uang
  rationale: Mempertahankan kata pinjaman menjaga personifikasi implisitnya sebagai tuan saingan. Padanan maknawi dicantumkan dalam catatan kaki agar pembaca tetap memahami maksudnya.
- issue: Kekuatan kontras μισήσει dan ἀγαπήσει
  choice: membenci dan mengasihi
  alternative: kurang mengasihi dan mengasihi
  rationale: Teks Yunani memakai antitesis yang kuat. Terjemahan tidak melunakkannya, sehingga ketegangan retoris asli tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa δύνασθε berbentuk jamak. 'Mengabdi kepada' mempertahankan nuansa ketundukan kepada tuan tanpa memakai ungkapan yang kaku.
