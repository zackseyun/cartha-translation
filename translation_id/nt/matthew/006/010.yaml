  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: id
  text: Datanglah kerajaan-Mu; jadilah kehendak-Mu, seperti di surga, demikian juga di bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, frasa “seperti di surga, demikian juga di bumi” mungkin berlaku untuk kedua permohonan: agar kerajaan-Mu datang dan kehendak-Mu terjadi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: Datanglah
  rationale: Imperatif aoris orang ketiga tunggal menyatakan permohonan kepada Allah. Dalam doa bahasa Indonesia, bentuk -lah secara wajar menyampaikan permohonan ini tanpa menjadikannya perintah kasar.
- source_word: ἡ βασιλεία σου
  choice: kerajaan-Mu
  rationale: βασιλεία dapat berarti kerajaan, pemerintahan, atau kekuasaan sebagai raja. 'Kerajaan-Mu' merupakan ungkapan yang alami dan mapan dalam konteks Matius, serta tetap dapat mencakup pemerintahan Allah.
- source_word: γενηθήτω
  choice: Terjadilah
  rationale: Imperatif aoris pasif orang ketiga tunggal dari γίνομαι. Bersama θέλημα, bentuk ini memohon agar kehendak Allah terlaksana atau menjadi kenyataan; 'terjadilah' mempertahankan nuansa itu secara ringkas dan alami.
- source_word: τὸ θέλημά σου
  choice: kehendak-Mu
  rationale: θέλημα menunjuk pada apa yang dikehendaki, diinginkan, atau dimaksudkan. 'Kehendak-Mu' mempertahankan keluasan makna dan bobot teologisnya tanpa mempersempitnya menjadi sekadar keinginan atau rencana.
- source_word: ὡς
  choice: seperti
  rationale: 'ὡς memperkenalkan perbandingan. Susunan alami bahasa Indonesia menempatkan frasa bumi lebih dahulu: ''di bumi seperti di surga,'' tanpa mengubah arah perbandingannya.'
- source_word: ἐν οὐρανῷ
  choice: di surga
  rationale: Dalam konteks ruang kediaman dan pemerintahan Allah, οὐρανός tunggal secara alami diterjemahkan 'surga', bukan 'langit' dalam arti bentangan angkasa.
- source_word: ἐπὶ γῆς
  choice: di bumi
  rationale: Walaupun ἐπί dengan genitif secara harfiah dapat berarti 'di atas', ungkapan idiomatis bahasa Indonesia untuk kontras surga dan bumi adalah 'di bumi'.
- source_word: καὶ
  choice: di bumi seperti di surga
  rationale: Dalam konstruksi ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς, καί melengkapi perbandingan. Bahasa Indonesia paling alami mengungkapkannya dengan urutan 'di bumi seperti di surga'; fungsi 'juga/demikian pula' tersampaikan oleh konstruksi perbandingan tersebut.
theological_decisions:
- issue: Cakupan frasa perbandingan ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: Dalam teks utama, frasa itu dihubungkan dengan permohonan terdekat, yaitu 'Terjadilah kehendak-Mu.'
  alternative: 'Frasa ''di bumi seperti di surga'' dapat dipahami berlaku bagi kedua permohonan: datangnya kerajaan Allah dan terjadinya kehendak-Nya.'
  rationale: Tanda baca dalam edisi Yunani modern bersifat editorial. Secara gramatikal, hubungan dengan klausa terdekat paling langsung dan menghasilkan bahasa Indonesia yang alami, tetapi cakupan atas kedua permohonan tetap mungkin sehingga dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada akhiran pronomina '-Mu' mengikuti kebiasaan penulisan rujukan kepada Allah. Bentuk 'Datanglah' dan 'Terjadilah' mempertahankan kesejajaran kedua imperatif Yunani serta cocok dengan register doa.
