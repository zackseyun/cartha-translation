  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: id
  text: Sebab, jika kamu mengampuni kesalahan orang lain, Bapa kalian yang di surga juga akan mengampuni kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kesalahan” juga dapat diterjemahkan “pelanggaran”, “perbuatan salah”, atau “penyimpangan”. Kata Yunani ini menunjuk pada kegagalan moral atau langkah yang menyimpang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sebab, jika
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan atas doa sebelumnya, sedangkan ἐάν dengan bentuk subjungtif menyatakan syarat yang wajar diterjemahkan sebagai “jika”.
- source_word: ἀφῆτε … ἀφήσει
  choice: kamu mengampuni … akan mengampuni kamu
  rationale: Pengulangan akar ἀφίημι dipertahankan dengan verba yang sama agar hubungan timbal balik dalam ayat tetap jelas.
- source_word: τοῖς ἀνθρώποις
  choice: orang lain
  rationale: ἄνθρωποι bersifat umum dan tidak khusus menunjuk laki-laki; dalam konteks hubungan antarmanusia, “orang lain” terdengar alami dalam bahasa Indonesia.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: kesalahan orang lain
  rationale: παράπτωμα menunjuk pada pelanggaran, kekeliruan moral, atau tindakan salah. “Kesalahan” alami dan mudah dipahami, sedangkan rujukan αὐτῶν dinyatakan melalui konstruksi Indonesia yang tidak rancu.
- source_word: καὶ ὑμῖν
  choice: juga akan mengampuni kamu
  rationale: καί diterjemahkan “juga” untuk mempertahankan kesejajaran antara pengampunan manusia dan pengampunan Bapa; datif ὑμῖν menjadi objek “kamu” secara idiomatis.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Bapamu yang di surga
  rationale: Ungkapan ini mempertahankan unsur posesif dan sifat surgawi Bapa dalam bentuk Indonesia yang alami dan khidmat.
theological_decisions:
- issue: Hubungan bersyarat antara pengampunan kepada sesama dan pengampunan ilahi
  choice: Pernyataan diterjemahkan secara langsung sebagai syarat nyata.
  alternative: Menafsirkannya secara khusus sebagai sebab yang menghasilkan pengampunan ilahi, atau hanya sebagai bukti bahwa pengampunan ilahi telah diterima.
  rationale: Teks Yunani menyatakan kondisi secara lugas tanpa menjelaskan kerangka doktrinalnya; ketegangan teologis itu dipertahankan dan tidak diselesaikan dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat namun mudah dipahami. “Kamu” mengikuti sapaan jamak dalam bahasa Yunani secara alami; bentuk posesif “Bapamu” ringkas dan lazim dalam ragam Alkitab Indonesia.
