  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: id
  text: Dan janganlah membawa kami ke dalam pencobaan,[a] tetapi selamatkanlah kami dari si jahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengujian” atau “cobaan.” Kata Yunani ini dapat menunjuk kepada godaan untuk berbuat dosa ataupun suatu keadaan yang menguji.
    reason: lexical_alternative
  - marker: b
    text: Atau “kejahatan.” Frasa Yunani ini dapat dipahami secara personal (“si jahat”) atau impersonal (“kejahatan”).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: janganlah membawa
  rationale: Ungkapan ini mempertahankan bentuk permohonan langsung dalam bahasa Yunani dan tidak menambahkan tafsiran seperti ‘jangan biarkan kami jatuh’.
- source_word: πειρασμόν
  choice: pencobaan
  rationale: ‘Pencobaan’ merupakan padanan Indonesia yang wajar dalam konteks doa ini, tetapi kata Yunani tersebut juga dapat berarti pengujian atau cobaan; keluasan maknanya dicatat dalam catatan kaki.
- source_word: ῥῦσαι
  choice: selamatkanlah
  rationale: Kata kerja ini meminta tindakan penyelamatan secara aktif. ‘Selamatkanlah’ alami, jelas, dan sesuai dengan ragam doa modern.
- source_word: τοῦ πονηροῦ
  choice: si jahat
  rationale: Bentuk Yunani berartikel ini dapat dipahami secara personal sebagai ‘si jahat’ atau secara impersonal sebagai ‘kejahatan’. Teks utama memakai pengertian personal, sedangkan ambiguitas asli dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna τοῦ πονηροῦ
  choice: si jahat
  alternative: kejahatan
  rationale: Bentuk Yunani dapat berjenis maskulin dan menunjuk kepada pribadi yang jahat, atau netral dan menunjuk kepada kejahatan. Konteks memungkinkan pengertian personal, tetapi alternatif impersonal tetap dicatat agar ketegangan teologis teks tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel ‘-lah’ mempertahankan nada permohonan doa tanpa terdengar usang; struktur kalimat tetap dekat dengan susunan Yunani.
