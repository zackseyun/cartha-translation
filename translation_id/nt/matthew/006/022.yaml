  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: id
  text: Mata adalah pelita tubuh. Karena itu, jika matamu sehat[a], seluruh tubuhmu akan terang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunggal”, “jernih”, atau “utuh”. Kata Yunani ini juga dapat mengandung arti tidak terbagi dan, dalam konteks tertentu, murah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: pelita
  rationale: Kata ini menunjuk pada pelita sebagai benda konkret, bukan cahaya secara abstrak; pilihan ini mempertahankan metafora mata sebagai pelita tubuh.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan baku dan alami yang mempertahankan gambaran jasmani dalam ayat ini.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Terjemahan harfiah ini sesuai dengan gambaran fisik sekaligus fungsi metaforisnya.
- source_word: ἐὰν οὖν
  choice: Karena itu, jika
  rationale: οὖν menyatakan kesimpulan atau hubungan logis dengan pernyataan sebelumnya, sedangkan ἐὰν memperkenalkan syarat.
- source_word: ἁπλοῦς
  choice: sehat
  rationale: Dalam konteks mata dan penerangan tubuh, 'sehat' secara alami menggambarkan mata yang berfungsi dengan baik, sambil menghindari ungkapan harfiah 'tunggal' yang kabur dalam bahasa Indonesia modern.
- source_word: ὅλον
  choice: seluruh
  rationale: Mempertahankan cakupan menyeluruh dari kata Yunani tersebut dan terdengar alami bersama 'tubuhmu'.
- source_word: φωτεινὸν
  choice: dipenuhi cahaya
  rationale: Ungkapan ini menyampaikan keadaan terang dalam bahasa Indonesia yang alami dan mempertahankan citra penerangan atas seluruh tubuh.
- source_word: ἔσται
  choice: akan dipenuhi
  rationale: Bentuk mendatang Yunani dipertahankan melalui kata 'akan'; unsur 'dipenuhi' melengkapi ungkapan idiomatis untuk φωτεινόν.
theological_decisions:
- issue: Makna ἁπλοῦς dalam metafora mata
  choice: sehat
  alternative: tunggal, jernih, baik, atau tidak terbagi; dalam konteks tertentu juga dapat bermakna murah hati
  rationale: Konteks langsung membicarakan mata sebagai pelita tubuh dan kemudian mempertentangkannya dengan mata yang buruk. Karena itu, gambaran mata yang berfungsi baik paling jelas dalam teks utama. Namun, keluasan makna kata Yunani dipertahankan dalam catatan kaki agar kemungkinan nuansa ketulusan, ketunggalan arah, atau kemurahan hati tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pelita' dipertahankan sebagai benda konkret yang lazim dalam gaya Alkitab tanpa menjadi sulit dipahami. Struktur kalimat mengikuti logika teks Yunani, sementara 'dipenuhi cahaya' digunakan agar predikat φωτεινόν terdengar alami.
