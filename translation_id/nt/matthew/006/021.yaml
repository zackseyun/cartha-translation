  text: For where your treasure is[a], there your heart will be also.
translation:
  language: id
  text: Sebab di mana hartamu berada, di situ juga hatimu akan berada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab di mana hartamu berada, di situ juga hatimu berada.” Sejumlah terjemahan menyatakannya sebagai prinsip umum dengan kala kini, tetapi verba Yunaninya berbentuk futur (“akan berada”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: di mana
  rationale: Memperkenalkan klausa relatif lokatif dan membentuk pasangan alami dengan ἐκεῖ, yaitu “di mana ... di situ”.
- source_word: γάρ
  choice: sebab
  rationale: Mempertahankan hubungan penjelas dengan ajaran sebelumnya tentang mengumpulkan harta.
- source_word: θησαυρός
  choice: harta
  rationale: “Harta” merupakan padanan Indonesia yang alami dan tetap mempertahankan daya literal maupun metaforis kata tersebut dalam konteks.
- source_word: σου
  choice: -mu
  rationale: Pronomina genitif orang kedua tunggal menyatakan kepunyaan, baik pada “hartamu” maupun “hatimu”.
- source_word: ἐκεῖ
  choice: di situ
  rationale: Berkorelasi dengan ὅπου dan mempertahankan kesejajaran ringkas “di mana ... di situ”.
- source_word: ἔσται
  choice: akan berada
  rationale: Mempertahankan bentuk futur verba Yunani, sekaligus menghasilkan ungkapan lokatif yang wajar dalam bahasa Indonesia.
- source_word: καρδία
  choice: hati
  rationale: Padanan baku yang tetap mencakup keinginan, kesetiaan, dan arah batin tanpa mempersempit maknanya.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan penekanan aditif yang menghubungkan letak hati dengan letak harta.
theological_decisions:
- issue: Daya temporal ἔσται dalam perkataan yang menyerupai pepatah hikmat
  choice: 'Mempertahankan bentuk futur: “akan berada”'
  alternative: 'Menggunakan kala kini: “berada” atau “ada” sebagai prinsip umum yang tidak terikat waktu'
  rationale: Teks Yunani memakai bentuk futur. Mempertahankannya menjaga kemungkinan bahwa perkataan ini tidak hanya menyatakan kesesuaian yang statis, tetapi juga gerak pembentukan arah hati menuju tempat harta diletakkan, tanpa menjadikannya tafsiran dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “di mana ... di situ” mempertahankan paralelisme sumber; “akan berada” menjaga bentuk futur tanpa membuat kalimat terasa kaku.
