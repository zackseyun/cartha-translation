  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: id
  text: Karena itu, janganlah khawatir tentang hari esok, sebab hari esok akan mengkhawatirkan dirinya sendiri. Cukuplah bagi setiap hari kesusahannya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Cukuplah bagi setiap hari kejahatannya sendiri.” Kata Yunani yang digunakan dapat berarti “kejahatan” atau “keburukan”, tetapi dalam konteks ini kemungkinan besar menunjuk pada kesusahan atau kesulitan yang dialami pada hari itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: janganlah khawatir
  rationale: Dalam rangkaian Matius 6:25–34, verba ini menunjuk pada kekhawatiran yang mencemaskan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan tema berulang dalam perikop.
- source_word: εἰς τὴν αὔριον
  choice: tentang hari esok
  rationale: Preposisi menyatakan arah atau sasaran kekhawatiran; frasa ini menyampaikan maknanya secara idiomatis.
- source_word: ἡ αὔριον
  choice: hari esok
  rationale: Ungkapan ini mempertahankan personifikasi hari esok sebagai subjek klausa berikutnya.
- source_word: μεριμνήσει αὑτῆς
  choice: akan mengkhawatirkan dirinya sendiri
  rationale: Terjemahan ini mempertahankan pengulangan verba, bentuk refleksif, serta personifikasi retoris dalam bahasa Yunani.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Setiap hari sudah mempunyai cukup banyak
  rationale: Susunan idiomatis ini menyampaikan kecukupan beban bagi masing-masing hari dan menampilkan nuansa distributif yang wajar dalam konteks.
- source_word: ἡ κακία αὐτῆς
  choice: kesusahannya sendiri
  rationale: Dalam konteks nasihat agar tidak khawatir, κακία paling wajar menunjuk pada kesulitan atau kesusahan yang dibawa oleh hari itu; kata ganti posesif tetap terwakili.
theological_decisions:
- issue: Makna κακία dalam pepatah mengenai kekhawatiran
  choice: kesusahan
  alternative: kejahatan
  rationale: Konteksnya adalah beban dan kecemasan sehari-hari, sehingga 'kesusahan' menyampaikan daya praktis ungkapan tersebut. Namun, karena κακία juga dapat berarti kejahatan atau keburukan, kemungkinan itu dicatat dalam catatan kaki dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'khawatir/mengkhawatirkan' sengaja dipertahankan untuk mencerminkan permainan retoris sumber. Penanda catatan kaki ditempatkan setelah klausa yang menerjemahkan κακία agar kaitannya jelas.
