id: MAT.6.6
reference: Matthew 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: id
  text: Namun, ketika kamu berdoa[a], masuklah ke ruang pribadimu, dan setelah menutup pintumu, berdoalah kepada Bapamu yang ada di tempat tersembunyi. Bapamu, yang melihat di tempat tersembunyi[b], akan memberimu ganjaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang dalam”, “ruang penyimpanan”, atau secara tradisional “bilik”. Kata Yunani ini menunjuk pada ruang di bagian dalam rumah yang dapat digunakan untuk privasi atau menyimpan barang.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan membalas kepadamu” atau “akan memberi kembali kepadamu”. Kata Yunani ini dapat berarti memberi kembali, membalas, atau memberi ganjaran, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Namun, ... kamu
  rationale: Kata ganti yang ditegaskan bersama δέ menunjukkan kontras dengan orang-orang munafik pada ayat sebelumnya; 'Namun' dan penyebutan 'kamu' mempertahankan kontras itu secara alami.
- source_word: ὅταν προσεύχῃ
  choice: ketika kamu berdoa
  rationale: ὅταν dengan bentuk subjungtif menyatakan waktu yang bersifat umum atau berulang. 'Ketika kamu berdoa' alami dalam bahasa Indonesia dan tidak menyiratkan satu kejadian saja.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: masuklah ke ruang dalammu
  rationale: ταμεῖον menunjuk pada ruang interior yang dapat dipakai untuk menyimpan barang atau memperoleh privasi. 'Ruang dalam' mempertahankan gagasan ruang yang terpencil tanpa asosiasi modern yang keliru dari 'lemari'.
- source_word: κλείσας τὴν θύραν σου
  choice: tutuplah pintunya
  rationale: Partisip aoris menunjukkan tindakan yang mendahului doa. Bentuk imperatif berurutan terdengar alami dalam bahasa Indonesia; '-nya' merujuk pada ruang yang baru disebut dan menghindari frasa kaku 'pintumu'.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: lalu berdoalah kepada Bapamu
  rationale: Menerjemahkan imperatif secara langsung dan mempertahankan sebutan relasional 'Bapamu' tanpa menambahkan 'surgawi', yang tidak terdapat dalam teks ini.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: yang ada di tempat tersembunyi
  rationale: Frasa ini menerangkan Bapa dan menyatakan ketersembunyian, dengan kemungkinan nuansa lokatif. 'Di tempat tersembunyi' menjaga ambiguitas tersebut lebih alami daripada 'secara tersembunyi'.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: yang melihat di tempat tersembunyi
  rationale: Terjemahan ini mempertahankan pengulangan ἐν τῷ κρυπτῷ dan tidak menambahkan objek seperti 'apa yang dilakukan', yang tidak dinyatakan secara eksplisit.
- source_word: ἀποδώσει σοι
  choice: akan membalasmu
  rationale: ἀποδίδωμι dapat berarti memberi kembali, membalas, atau memberi ganjaran. 'Membalasmu' mempertahankan keluasan makna timbal balik tanpa menentukan bentuk balasannya.
theological_decisions:
- issue: Makna pengulangan ἐν τῷ κρυπτῷ
  choice: di tempat tersembunyi pada kedua kemunculan
  alternative: secara tersembunyi; dalam rahasia; melihat apa yang dilakukan secara tersembunyi
  rationale: Pengulangan yang sama mempertahankan hubungan retoris antara kehadiran Bapa dan penglihatan-Nya serta kontras dengan kesalehan yang dipamerkan, tanpa membatasi frasa itu hanya pada tempat fisik atau cara bertindak.
- issue: Sebutan πατήρ bagi Allah
  choice: Bapa
  alternative: Bapa surgawi; Allah Bapamu
  rationale: Teks secara langsung memakai sebutan relasional 'Bapa'. Tidak ditambahkan keterangan teologis yang berasal dari konteks lain.
- issue: Sifat balasan dalam ἀποδώσει
  choice: akan membalasmu
  alternative: akan memberimu upah; akan mengganjarmu
  rationale: Pilihan ini tidak menentukan bahwa jawaban atau balasan ilahi harus berupa ganjaran material maupun bentuk tertentu, sehingga ketegangan makna verba sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk 'Bapamu' mempertahankan kedekatan relasional; 'ruang dalam' dan 'tempat tersembunyi' dipilih untuk menjaga citra serta pengulangan teks Yunani tanpa terdengar terlalu arkais.
