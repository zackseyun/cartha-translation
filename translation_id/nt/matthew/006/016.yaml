  source_fidelity: 'Terjemahan dengan setia menyampaikan struktur dan makna utama teks Yunani: keadaan umum/berulang ketika berpuasa, larangan mengambil raut muram seperti orang munafik, tindakan sengaja merusak penampilan wajah demi terlihat berpuasa oleh orang lain, serta idiom bahwa upah mereka telah diterima sepenuhnya. Pergeseran pasif Yunani (“tampak oleh orang”) menjadi bentuk aktif (“orang melihat”) wajar dalam bahasa Indonesia dan tidak mengubah makna.'
