  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: id
  text: “Apabila kamu berpuasa, janganlah memasang wajah muram seperti orang-orang munafik, sebab mereka membuat wajah mereka tampak buruk supaya orang melihat bahwa mereka sedang berpuasa. Sesungguhnya Aku berkata kepadamu, mereka sudah menerima seluruh upah mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Apabila kamu berpuasa
  rationale: Ὅταν dengan bentuk subjungtif menunjuk pada keadaan yang berulang atau tidak ditentukan. “Apabila” menyampaikan arti itu secara alami; δέ berfungsi sebagai penghubung dalam rangkaian ajaran dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: janganlah memasang wajah muram
  rationale: Secara harfiah berarti jangan menjadi muram. Dalam konteks penampilan yang sengaja diperlihatkan, “memasang wajah muram” secara alami menyampaikan tindakan mengambil atau menampilkan raut tersebut tanpa menghilangkan nuansa γίνεσθε.
- source_word: ὡς οἱ ὑποκριταί
  choice: seperti orang-orang munafik
  rationale: ὑποκριτής menunjuk pada orang yang mempertontonkan kesalehan yang tidak sesuai dengan maksud batinnya. “Orang-orang munafik” merupakan padanan Indonesia yang jelas dan mapan.
- source_word: ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν
  choice: sebab mereka membuat wajah mereka tampak buruk
  rationale: ἀφανίζω secara dasar dapat berarti menghilangkan atau merusakkan penampakan. Dalam konteks ini tindakan tepatnya tidak disebutkan; terjemahan ini mempertahankan gagasan bahwa mereka sengaja merusak atau mengabaikan penampilan wajah, tanpa menentukan caranya.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: supaya orang melihat bahwa mereka sedang berpuasa
  rationale: ὅπως menyatakan tujuan, sedangkan φανῶσιν dapat berarti tampak atau terlihat. τοῖς ἀνθρώποις bersifat umum, sehingga “orang” alami dan inklusif dalam bahasa Indonesia.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Formula khidmat ini menegaskan kebenaran dan kewibawaan pernyataan Yesus. “Sesungguhnya Aku berkata kepadamu” mempertahankan bentuk dan bobotnya dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: mereka sudah menerima seluruh upah mereka
  rationale: ἀπέχω merupakan ungkapan komersial tentang penerimaan pembayaran secara penuh. “Sudah menerima seluruh” menyampaikan bahwa ganjaran yang dicari telah dibayar lunas dan tidak menyisakan tuntutan lebih lanjut.
theological_decisions:
- issue: Cakupan τοῖς ἀνθρώποις
  choice: orang
  alternative: manusia; orang-orang
  rationale: Dalam ayat ini bentuk jamak ἄνθρωποι merujuk kepada manusia secara umum, bukan khusus laki-laki. “Orang” menyampaikan cakupan umum itu secara wajar tanpa menambahkan penafsiran teologis.
- issue: Makna penuh ungkapan ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: sudah menerima seluruh upah mereka
  alternative: mereka mendapat upah mereka
  rationale: Ungkapan Yunani mengandung nuansa penerimaan penuh, bukan sekadar kepemilikan upah. Terjemahan mempertahankan kontras tersirat antara pengakuan manusia yang telah mereka peroleh dan ganjaran lain yang tidak lagi dapat mereka tuntut, tanpa memperluasnya menjadi pernyataan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mengikuti sapaan jamak dalam konteks pengajaran kepada para pendengar; kapitalisasi “Aku” menandai Yesus sebagai pembicara sesuai kebiasaan penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat dijelaskan tanpa adanya varian teks atau ambiguitas yang harus ditampilkan kepada pembaca.
