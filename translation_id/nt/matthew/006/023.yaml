  naturalness: Bahasa Indonesia baku, modern, dan mengalir. “Matamu buruk” memang mempertahankan metafora yang agak terbuka, tetapi tetap dapat dipahami dalam register terjemahan Alkitab dan sesuai dengan tujuan optimal-equivalence. Susunan kalimat dan pengulangan “kegelapan” efektif secara retoris.
