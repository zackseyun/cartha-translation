id: MAT.6.23
reference: Matthew 6:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: id
  text: Namun, jika matamu buruk[a], seluruh tubuhmu akan gelap. Jadi, jika terang yang ada di dalam dirimu adalah kegelapan, betapa pekatnya kegelapan itu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jahat”, “tidak sehat”, atau mungkin “kikir”, mengingat ungkapan tentang “mata” dan konteks sekitarnya.
    reason: Alternatif leksikal dan kemungkinan nuansa idiomatis πονηρός.
lexical_decisions:
- source_word: πονηρὸς
  choice: buruk
  rationale: Kata ini dapat berarti buruk atau jahat dan, dalam ungkapan tentang mata, mungkin juga menyiratkan mata yang tidak sehat atau sikap yang kikir. “Buruk” mempertahankan keluasan makna dan tidak membatasi metafora pada satu tafsiran.
- source_word: σκοτεινὸν
  choice: gelap
  rationale: Padanan langsung dan alami bagi adjektiva Yunani ini, dengan tetap mempertahankan metafora terang dan gelap.
- source_word: φῶς
  choice: terang
  rationale: Mempertahankan gambaran konkret dalam bahasa Yunani tanpa menafsirkannya secara eksplisit sebagai pemahaman batin atau kondisi rohani.
- source_word: σκότος
  choice: kegelapan
  rationale: Mempertahankan pertentangan dengan “terang” serta pengulangan klimaktik pada akhir ayat.
- source_word: πόσον
  choice: betapa pekatnya
  rationale: Dalam klausa seruan yang eliptis, kata ini menyatakan kadar. “Betapa pekatnya” terdengar alami dalam bahasa Indonesia dan mengungkapkan intensitas kegelapan tanpa mengubah pokok metafora.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Terjemahan harfiah diperlukan karena perkataan ini dibangun di atas metafora tubuh.
- source_word: ὅλον τὸ σῶμά σου
  choice: seluruh tubuhmu
  rationale: Padanan alami yang mempertahankan penekanan menyeluruh dari ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: terang yang ada di dalam dirimu
  rationale: Dekat dengan susunan Yunani dan lebih jelas dalam bahasa Indonesia daripada ungkapan yang dapat menyiratkan gagasan teknis seperti “terang batin”.
theological_decisions:
- issue: Makna metafora “mata yang buruk”
  choice: Mempertahankan metafora luas dengan “buruk” dalam teks utama.
  alternative: “Jahat,” “tidak sehat,” atau mungkin “kikir” dalam kaitan dengan idiom mata dan konteks harta serta pengabdian.
  rationale: 'Konteks Matius 6:19–24 memungkinkan nuansa yang bertumpang tindih: kerusakan moral, persepsi yang menyimpang, dan mungkin sikap enggan memberi. Teks utama tidak menyelesaikan ketegangan tafsir ini secara sepihak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” dan “jadi” mencerminkan hubungan wacana δέ dan οὖν. Seruan penutup dibuat alami dalam bahasa Indonesia sambil mempertahankan daya retoris teks Yunani.
