id: MAT.6.2
reference: Matthew 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: id
  text: Jadi, apabila engkau memberi sedekah,[a] jangan meniup sangkakala di depanmu,[b] seperti yang dilakukan orang-orang munafik di sinagoge-sinagoge dan di jalan-jalan, supaya mereka dimuliakan orang.[c] Sesungguhnya Aku berkata kepada kalian, mereka telah menerima upah mereka sepenuhnya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi kepada orang yang membutuhkan” atau “melakukan perbuatan belas kasih.” Ungkapan Yunani ini mengacu pada pemberian amal.
    reason: lexical_alternative
  - marker: b
    text: Atau “jangan mengumumkannya dengan bunyi sangkakala.” Teks Yunani secara harfiah berbunyi “jangan meniup sangkakala di depanmu”; gambaran ini mungkin bersifat hiperbolis atau kiasan.
    reason: lexical_alternative
  - marker: c
    text: Atau “supaya mereka dipuji orang” atau “dihormati orang.” Kata kerja Yunaninya secara harfiah berarti “dimuliakan.”
    reason: lexical_alternative
  - marker: d
    text: Ungkapan ini memakai bahasa komersial dan berarti bahwa mereka telah menerima upah itu sepenuhnya—itulah seluruh upah yang akan mereka peroleh.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Jadi, apabila
  rationale: “Jadi” mempertahankan hubungan inferensial dengan ajaran sebelumnya, sedangkan “apabila” menyatakan keadaan umum atau berulang yang diperkenalkan oleh ὅταν dengan bentuk subjungtif.
- source_word: ποιῇς ἐλεημοσύνην
  choice: memberi sedekah
  rationale: Ungkapan ini menunjuk pada pemberian amal kepada orang yang membutuhkan. “Memberi sedekah” ringkas, lazim, dan tetap mempertahankan bentuk konkret tindakan tersebut.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: jangan meniup sangkakala di depanmu
  rationale: Terjemahan mempertahankan gambaran harfiah dan mencolok dalam teks Yunani tanpa memutuskan apakah ungkapan itu hiperbola, metafora, atau merujuk pada suatu praktik tertentu.
- source_word: ὑποκριταὶ
  choice: orang-orang munafik
  rationale: “Munafik” merupakan padanan baku dan tepat dalam konteks orang yang mempertontonkan kesalehan demi penilaian orang lain.
- source_word: συναγωγαῖς
  choice: rumah-rumah ibadat
  rationale: Dalam konteks ini istilah tersebut menunjuk pada tempat pertemuan dan ibadah Yahudi. Padanan ini alami dalam bahasa Indonesia dan tidak mengaburkan fungsi tempatnya.
- source_word: ῥύμαις
  choice: jalan-jalan
  rationale: Kata ini dapat menunjuk pada jalan atau lorong; “jalan-jalan” paling alami untuk ruang publik tempat tindakan itu dapat dilihat orang.
- source_word: δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: dimuliakan orang
  rationale: “Dimuliakan” mempertahankan kekuatan δοξάζω, sementara “orang” menyampaikan ἀνθρώπων secara generik dan alami.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepada kalian
  rationale: Rumusan ini mempertahankan penegasan khidmat ἀμήν dan bentuk ujaran langsung. “Kalian” juga memperlihatkan bahwa ὑμῖν berbentuk jamak.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: mereka sudah menerima seluruh upah mereka
  rationale: ἀπέχω digunakan sebagai ungkapan komersial untuk penerimaan yang sudah lunas atau lengkap. “Seluruh” menyampaikan bahwa tidak ada upah lain yang masih tersisa.
theological_decisions:
- issue: Kekuatan makna δοξασθῶσιν
  choice: dimuliakan orang
  alternative: dipuji orang atau dihormati orang
  rationale: Padanan yang lebih kuat dipertahankan agar kontras retoris antara kemuliaan dari manusia dan upah dari Allah dalam konteks sekitarnya tidak diratakan.
- issue: Makna ἀπέχουσιν sebagai ungkapan komersial
  choice: sudah menerima seluruh upah mereka
  alternative: telah memperoleh upah mereka
  rationale: Terjemahan pilihan menyatakan bahwa penerimaan itu telah lengkap tanpa menetapkan lebih jauh hakikat teologis upah tersebut.
- issue: Pergantian jumlah dari sapaan tunggal ke jamak
  choice: engkau ... kalian
  alternative: kamu ... kamu
  rationale: Teks Yunani mula-mula menyapa pelaku secara tunggal lalu memakai ὑμῖν dalam bentuk jamak. Pergantian ini dipertahankan sejauh wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada khidmat tetapi tetap mudah dipahami. “Engkau” dipakai untuk sapaan tunggal dalam ucapan Yesus dan “kalian” untuk sapaan jamak, sehingga pergantian jumlah dalam teks sumber terlihat. Gambaran sangkakala serta kata kuat “dimuliakan” dipertahankan agar ambiguitas dan daya retoris teks tidak dilunakkan.
