id: MAT.6.25
reference: Matthew 6:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: id
  text: 'Karena itu Aku berkata kepadamu: Jangan khawatir tentang hidupmu[a], yaitu apa yang akan kamu makan, atau tentang tubuhmu, yaitu apa yang akan kamu kenakan. Bukankah hidup lebih daripada makanan dan tubuh lebih daripada pakaian?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: jiwa (Yunani ψυχή). Dalam konteks makanan dan pakaian, “hidup” paling sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai kesimpulan dari ajaran sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Menyampaikan ujaran langsung dengan jelas; bentuk kedua jamak bahasa Yunani diterjemahkan dengan “kamu” yang dapat merujuk kepada para pendengar secara kolektif.
- source_word: μὴ μεριμνᾶτε
  choice: Jangan khawatir
  rationale: Kata kerja ini menunjuk pada kekhawatiran atau kecemasan yang menyita pikiran; ungkapan ini alami dan mudah dipahami tanpa melarang segala bentuk perhatian yang wajar.
- source_word: τῇ ψυχῇ ὑμῶν
  choice: tentang hidupmu
  rationale: Dalam konteks makan dan kebutuhan jasmani, ψυχή menunjuk pada hidup seseorang, bukan secara khusus pada jiwa sebagai unsur tak berwujud.
- source_word: τί φάγητε
  choice: apa yang akan kamu makan
  rationale: Subjungtif dalam pertanyaan tak langsung menyatakan kekhawatiran yang berorientasi pada masa depan.
- source_word: τῷ σώματι ὑμῶν
  choice: tentang tubuhmu
  rationale: Merujuk langsung pada tubuh jasmani dalam kaitannya dengan pakaian.
- source_word: τί ἐνδύσησθε
  choice: apa yang akan kamu kenakan
  rationale: “Kenakan” merupakan padanan alami untuk tindakan berpakaian dan mempertahankan nuansa kata sumber.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: πλεῖόν ... τῆς τροφῆς
  choice: lebih daripada makanan
  rationale: Mempertahankan perbandingan bahwa hidup melampaui makanan dalam arti dan nilainya tanpa menambahkan penafsiran eksplisit.
- source_word: τοῦ ἐνδύματος
  choice: pakaian
  rationale: Istilah umum dan alami bagi sesuatu yang dikenakan, sejajar dengan “makanan”.
theological_decisions:
- issue: Makna ψυχή dalam ajaran Yesus
  choice: Diterjemahkan “hidup”
  alternative: jiwa
  rationale: Konteks langsung membahas makan, tubuh, dan pakaian, sehingga ψυχή di sini paling alami menunjuk pada hidup seseorang. Pilihan ini menghindari memasukkan klaim dualistis yang tidak ditegaskan oleh ayat tersebut.
- issue: Cakupan larangan μεριμνᾶτε
  choice: Diterjemahkan “Jangan khawatir”
  alternative: Jangan memikirkan / jangan peduli
  rationale: Teks melarang kecemasan terhadap kebutuhan hidup, bukan perencanaan atau perhatian yang bertanggung jawab; “khawatir” menjaga ketegangan itu tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Aku” untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia; “kamu” dipilih agar tuturan langsung tetap alami dan dapat dipahami sebagai sapaan kepada para murid secara kolektif. Tanda pisah menata dua pertanyaan tidak langsung dan mempertahankan struktur retoris ayat.
