  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: id
  text: Karena itu, janganlah khawatir[a] sambil berkata, ‘Apa yang akan kita makan?’ atau ‘Apa yang akan kita minum?’ atau ‘Apa yang akan kita kenakan?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah cemas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Karena itu, janganlah khawatir
  rationale: οὖν menyatakan kesimpulan dari uraian sebelumnya dan diterjemahkan dengan ‘Karena itu’. Dalam konteks ini μεριμνάω menunjuk pada kekhawatiran mengenai kebutuhan hidup; ‘janganlah khawatir’ alami dalam bahasa Indonesia dan tetap mempertahankan daya larang konstruksi Yunani.
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisipel ini menerangkan bagaimana atau dalam bentuk apa kekhawatiran itu diungkapkan. ‘Dengan berkata’ memperjelas hubungannya dengan larangan utama tanpa menambah gagasan baru.
- source_word: Τί φάγωμεν;
  choice: Apa yang akan kita makan?
  rationale: Subjungtif deliberatif menyatakan pertanyaan tentang pemenuhan kebutuhan mendatang. Bentuk ‘akan kita makan’ merupakan ungkapan Indonesia yang wajar.
- source_word: Τί πίωμεν;
  choice: Apa yang akan kita minum?
  rationale: Sejajar dengan φάγωμεν dan menyampaikan pertanyaan deliberatif tentang minuman sebagai kebutuhan hidup.
- source_word: Τί περιβαλώμεθα;
  choice: Apa yang akan kita kenakan?
  rationale: περιβάλλω di sini berarti mengenakan pakaian. ‘Kenakan’ ringkas, wajar, dan lebih tepat dalam konteks pakaian daripada terjemahan refleksif yang kaku.
- source_word: ἤ ... ἤ ... ἤ
  choice: atau ... atau ... atau
  rationale: Pengulangan kata penghubung dipertahankan untuk mencerminkan tiga pertanyaan langsung dalam teks Yunani.
theological_decisions:
- issue: Cakupan larangan Yesus mengenai kebutuhan jasmani
  choice: Larangan terhadap kekhawatiran mengenai pemenuhan kebutuhan hidup
  alternative: Larangan mutlak terhadap segala bentuk perhatian atau perencanaan
  rationale: Dalam konteks dekatnya, μεριμνάω berkaitan dengan kecemasan tentang makanan, minuman, dan pakaian. Terjemahan ini tidak memperluas larangan menjadi penolakan terhadap perencanaan yang bijaksana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk ‘janganlah’ mempertahankan nada ajaran yang tegas dan bermartabat; pronomina ‘kita’ sesuai dengan pertanyaan deliberatif orang pertama jamak.
