id: MAT.6.8
reference: Matthew 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: id
  text: Karena itu, janganlah menjadi seperti mereka, sebab Bapamu tahu apa yang kamu perlukan sebelum kamu meminta kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Karena itu, janganlah
  rationale: Menggabungkan larangan μή dengan οὖν yang menyatakan kesimpulan, serta mempertahankan kaitan logis dengan peringatan sebelumnya.
- source_word: ὁμοιωθῆτε
  choice: menjadi seperti
  rationale: Larangan dengan aoristus pasif subjungtif ini secara wajar diungkapkan sebagai larangan mengikuti atau menjadi serupa dengan pola mereka; bentuk ini alami dalam bahasa Indonesia tanpa memaksakan pasif yang kaku.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina ini merujuk kepada orang-orang bukan Yahudi yang disebut dalam konteks langsung; pronomina sederhana sudah jelas.
- source_word: οἶδεν
  choice: tahu
  rationale: 'Walaupun οἶδα berbentuk perfektum, maknanya berfungsi sebagai kala kini: mengetahui.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: Bapamu
  rationale: Menerjemahkan secara ringkas dan alami tanpa menambahkan kata 'surgawi', yang tidak terdapat dalam teks ayat ini.
- source_word: ὧν χρείαν ἔχετε
  choice: apa yang kamu perlukan
  rationale: Ungkapan ini menyatakan hal-hal yang dibutuhkan; pilihan ini jelas, alami, dan tetap dekat dengan makna sumber.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: sebelum kamu meminta kepada-Nya
  rationale: πρὸ τοῦ dengan infinitif menyatakan waktu yang mendahului; 'meminta kepada-Nya' merupakan susunan Indonesia yang alami dan mempertahankan Allah sebagai pihak yang dimintai.
theological_decisions:
- issue: Pengetahuan Bapa sebelum doa dipanjatkan
  choice: Pernyataan diterjemahkan langsung sebagai pengetahuan Bapa akan kebutuhan para murid sebelum mereka meminta.
  alternative: Menambahkan penjelasan bahwa doa bersifat relasional, bukan informasional, atau menekankan suatu rumusan doktrinal tertentu tentang pengetahuan ilahi.
  rationale: Teks menyatakan pengetahuan Bapa sebelumnya tetapi tidak menjelaskan mengapa doa tetap diperlukan. Ketegangan teologis itu dipertahankan tanpa diselesaikan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk 'Bapamu' dan pronomina tunggal 'kamu' mengikuti bentuk Yunani yang menyapa para murid secara kolektif dengan orang kedua jamak, sebagaimana lazim dalam bahasa Indonesia. Huruf kapital pada '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
