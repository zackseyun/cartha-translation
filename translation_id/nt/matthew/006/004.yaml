id: MAT.6.4
reference: Matthew 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: id
  text: supaya pemberianmu kepada orang miskin dilakukan secara tersembunyi[a]; dan Bapamu, yang melihat apa yang tersembunyi, akan memberimu balasan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sedekahmu. Istilah Yunani ini secara khusus berarti pemberian kepada orang miskin.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: akan memberi upah kepadamu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan dan menghubungkan ayat ini dengan perintah pada ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ᾖ
  choice: dilakukan
  rationale: Dalam gabungan dengan frasa pemberian kepada orang miskin dan keterangan secara tersembunyi, pilihan ini mengungkapkan maksud bentuk subjungtif secara wajar tanpa terjemahan yang kaku.
- source_word: ἐλεημοσύνη
  choice: pemberianmu kepada orang miskin
  rationale: Istilah ini secara khusus menunjuk pada pemberian untuk menolong orang miskin, bukan belas kasihan atau amal secara umum.
- source_word: ἐν τῷ κρυπτῷ
  choice: secara tersembunyi / apa yang tersembunyi
  rationale: Ungkapan ini menunjuk pada sesuatu yang tidak dipertontonkan kepada umum. Bentuk Indonesia disesuaikan dengan fungsi sintaksis masing-masing kemunculan, sambil mempertahankan pengulangan gagasan tersembunyi.
- source_word: ὁ πατήρ σου
  choice: Bapamu
  rationale: Teks Yunani hanya menyebut Bapamu dan tidak menambahkan kata surgawi.
- source_word: ὁ βλέπων
  choice: yang melihat
  rationale: Partisip substantival ini paling alami diterjemahkan sebagai klausa relatif dalam bahasa Indonesia.
- source_word: ἀποδώσει σοι
  choice: akan memberimu balasan
  rationale: Pilihan ini menyampaikan tindakan Allah yang membalas atau mengganjar tanpa menentukan bentuk, waktu, atau sifat balasan itu lebih jauh daripada teks sumber.
theological_decisions:
- issue: Sifat balasan ilahi dalam ἀποδώσει
  choice: akan memberimu balasan
  alternative: akan memberi upah kepadamu; akan membalasmu
  rationale: Teks menjanjikan tanggapan Allah atas pemberian yang tersembunyi, tetapi tidak menjelaskan apakah balasan itu bersifat jasmani, rohani, sementara, atau kekal. Kata balasan mempertahankan ketaktertentuan tersebut dan tidak mengubahnya menjadi ajaran khusus tentang upah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk Bapamu dipertahankan tanpa menambahkan surgawi. Frasa apa yang tersembunyi dipakai agar kemunculan kedua ungkapan Yunani tidak terdengar seolah-olah Sang Bapa sendiri sedang bersembunyi.
