  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: id
  text: Namun, jika kamu tidak mengampuni orang lain, Bapamu juga tidak akan mengampuni pelanggaranmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Namun, jika ... tidak
  rationale: ἐὰν memperkenalkan syarat, δέ menandai kontras dengan ayat sebelumnya, dan μή menyangkal tindakan dalam klausa syarat. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan bersyarat.
- source_word: ἀφῆτε
  choice: mengampuni
  rationale: Dalam konteks kesalahan antarmanusia, ἀφίημι berarti mengampuni. Pilihan yang sama dipakai untuk ἀφήσει agar pengulangan dan kesejajaran dalam teks sumber tetap tampak.
- source_word: τοῖς ἀνθρώποις
  choice: orang lain
  rationale: ἄνθρωποι merujuk secara umum kepada manusia, bukan hanya laki-laki. Dalam konteks tindakan saling mengampuni, 'orang lain' merupakan ungkapan Indonesia yang alami dan tidak membatasi gender.
- source_word: οὐδὲ
  choice: juga tidak
  rationale: οὐδέ menghubungkan akibat negatif dengan syarat negatif sebelumnya. 'Juga tidak' menyampaikan bahwa tindakan yang sejajar itu pun tidak akan dilakukan.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Bapamu
  rationale: Teks Yunani hanya menyebut 'Bapamu', tanpa kata 'surgawi'. Bentuk ini tidak menambahkan unsur yang tidak terdapat dalam ayat.
- source_word: ἀφήσει
  choice: akan mengampuni
  rationale: Bentuk futurum ἀφίημι diterjemahkan secara konsisten dengan kemunculan sebelumnya dan mempertahankan hubungan langsung antara kedua klausa.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: pelanggaran-pelanggaranmu
  rationale: παραπτώματα menunjuk pada pelanggaran, kesalahan, atau tindakan menyimpang. 'Pelanggaran-pelanggaran' alami, bermuatan moral, dan cukup luas untuk mempertahankan cakupan istilah Yunani.
theological_decisions:
- issue: Hubungan bersyarat antara pengampunan manusia dan pengampunan Allah
  choice: 'Mempertahankan pernyataan bersyarat secara langsung: jika orang tidak mengampuni, Bapa juga tidak akan mengampuni pelanggarannya.'
  alternative: Menafsirkannya hanya sebagai bukti bahwa seseorang telah diampuni, atau sebagai hilangnya persekutuan dan bukan pengampunan itu sendiri.
  rationale: Teks Yunani menyatakan hubungan bersyarat secara lugas. Terjemahan tidak boleh melunakkan atau menyelesaikan ketegangan teologis tersebut melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti tunggal 'kamu/-mu' mengikuti bentuk jamak Yunani secara distributif dalam sapaan kepada para pendengar; bahasa Indonesia tidak wajib menandai jumlah. 'Namun' menyatakan kontras dengan ayat sebelumnya, sedangkan 'juga tidak' mempertahankan kesejajaran negatif tanpa menghasilkan susunan yang kaku.
