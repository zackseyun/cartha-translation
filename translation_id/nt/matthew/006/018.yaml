id: MAT.6.18
reference: Matthew 6:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: id
  text: supaya engkau tidak tampak sedang berpuasa di hadapan orang-orang, melainkan di hadapan Bapamu yang berada di tempat tersembunyi[a]; dan Bapamu yang melihat di tempat tersembunyi akan memberimu upah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang sama muncul kembali dalam kalimat berikutnya dan dapat juga diterjemahkan “dalam keadaan tersembunyi” atau “dalam rahasia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: engkau terlihat sedang berpuasa bukan oleh orang lain
  rationale: Mempertahankan gagasan terlihat oleh pengamat manusia serta kegiatan berpuasa; susunan 'bukan ... melainkan ...' membuat kontras Yunani jelas dan alami dalam bahasa Indonesia.
- source_word: τοῖς ἀνθρώποις
  choice: oleh orang lain
  rationale: ἄνθρωποι di sini mengacu secara umum kepada para pengamat manusia, bukan hanya laki-laki. 'Orang lain' menyampaikan fungsi kontrasnya dengan Bapa secara wajar.
- source_word: τῷ πατρί σου
  choice: oleh Bapamu
  rationale: Mempertahankan kesejajaran dengan pihak yang melihat dalam klausa sebelumnya dan sapaan relasional kepada Allah.
- source_word: ἐν τῷ κρυφαίῳ
  choice: di tempat tersembunyi
  rationale: Mempertahankan citra ranah atau tempat yang tidak terlihat dan memungkinkan pengulangan frasa Yunani tetap tampak.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: yang melihat di tempat tersembunyi
  rationale: Tidak menambahkan objek seperti 'apa yang dilakukan'; frasa ini mempertahankan bentuk ringkas dan pengulangan sumber.
- source_word: ἀποδώσει σοι
  choice: akan memberimu upah
  rationale: Dalam konteks tindakan saleh dan tanggapan ilahi, verba ini menyatakan pemberian balasan atau upah; pilihan ini jelas tanpa menentukan bentuk upah tersebut.
theological_decisions:
- issue: Rujukan umum τοῖς ἀνθρώποις
  choice: orang lain
  alternative: manusia; orang-orang
  rationale: Konteks menunjuk kepada pengamat manusia pada umumnya, bukan kepada laki-laki saja; 'orang lain' juga membentuk kontras alami dengan Bapa.
- issue: Makna κρυφαίῳ pada kedua kemunculan
  choice: di tempat tersembunyi
  alternative: dalam keadaan tersembunyi; secara tersembunyi; dalam rahasia
  rationale: Pilihan ini mempertahankan pengulangan retoris dan tidak mengubahnya menjadi pernyataan bahwa Bapa melihat secara diam-diam. Catatan kaki mempertahankan keluasan makna ungkapan Yunani.
- issue: Sifat balasan dalam ἀποδώσει σοι
  choice: akan memberimu upah
  alternative: akan membalasmu; akan memberikan balasan kepadamu
  rationale: Konteks mendukung pengertian ganjaran, tetapi terjemahan tidak menjelaskan jenis atau waktu pemberiannya sehingga ketegangan teologis sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina tunggal 'engkau' dipakai karena verba Yunani berbentuk orang kedua tunggal. Struktur 'bukan ... melainkan ...' menghindari elipsis yang kaku sekaligus mempertahankan kontras utama ayat.
