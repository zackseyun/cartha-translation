  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: id
  text: Namun, carilah dahulu Kerajaan-Nya dan kebenaran-Nya[a], dan semuanya itu akan ditambahkan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Nya.” Kata Yunani ini dapat berarti kebenaran atau keadilan; “kebenaran” dipakai di sini karena konteksnya mencakup keadaan dan perilaku yang benar di hadapan Allah, bukan hanya keadilan dalam arti hukum atau sosial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: carilah
  rationale: Imperatif kini jamak menyatakan seruan aktif yang dapat mencakup upaya terus-menerus. Bentuk “carilah” alami dan ringkas dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang berlawanan dengan kekhawatiran dan pengejaran kebutuhan jasmani dalam konteks sebelumnya.
- source_word: πρῶτον
  choice: dahulu
  rationale: Menyampaikan urutan sekaligus prioritas tanpa memperluasnya menjadi parafrasa.
- source_word: βασιλείαν
  choice: kerajaan
  rationale: Padanan baku yang tetap dapat mencakup pemerintahan atau kekuasaan rajawi Allah, bukan hanya wilayah.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam pemakaian Alkitab bahasa Indonesia, “kebenaran” dapat mencakup keadaan benar dan perilaku yang selaras dengan kehendak Allah. Kemungkinan nuansa “keadilan” dipertahankan dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Mempertahankan bentuk pronominal Yunani; rujukannya kepada Allah/Bapa jelas dari konteks.
- source_word: ταῦτα πάντα
  choice: semuanya itu
  rationale: Merujuk kembali pada seluruh kebutuhan jasmani yang baru disebutkan, sambil mempertahankan daya tunjuk frasa Yunani.
- source_word: προστεθήσεται
  choice: akan ditambahkan
  rationale: Mempertahankan bentuk pasif futur dan gagasan bahwa hal-hal tersebut diberikan sebagai tambahan pada pencarian yang utama.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Menyampaikan datif penerima secara langsung. Bentuk tunggal kolektif “-mu” lazim dalam gaya Alkitab Indonesia untuk sapaan jamak Yunani kepada para pendengar.
theological_decisions:
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Istilah ini di sini mencakup keadaan dan perilaku yang benar di hadapan Allah; “keadilan” saja dapat mempersempit cakupannya. Alternatif leksikal tetap dicatat.
- issue: Rujukan αὐτοῦ
  choice: -Nya
  alternative: Allah
  rationale: Pronomina dipertahankan agar tidak melakukan eksplisitasi yang tidak terdapat dalam bentuk Yunani, meskipun konteks menunjuk kepada Allah/Bapa.
- issue: Pelaku tersirat dalam προστεθήσεται
  choice: bentuk pasif “akan ditambahkan”
  alternative: Allah akan menambahkan/memberikan
  rationale: Teks Yunani tidak menyebut pelaku secara eksplisit. Bentuk pasif mempertahankan kemungkinan pasif ilahi tanpa menambah subjek ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami tanpa menghilangkan kontras, prioritas, pronomina, atau bentuk pasif sumber. “Kepadamu” mengikuti register Alkitab Indonesia dan mewakili sapaan jamak Yunani.
