  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: id
  text: Namun, kumpulkanlah bagi kalian sendiri harta di surga, di sana ngengat maupun pelapukan[a] tidak memusnahkannya, dan di sana pencuri tidak membobol[b] ataupun mencuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karat”. Kata Yunani ini dapat merujuk secara lebih luas pada sesuatu yang menggerogoti atau menyebabkan barang rusak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “menggali menembus”, mungkin merujuk pada pencuri yang menembus dinding rumah.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: kumpulkanlah
  rationale: Bentuk imperatif menyuruh para pendengar mengumpulkan atau menimbun harta; “kumpulkanlah” alami dalam bahasa Indonesia dan mempertahankan gambaran penghimpunan harta.
- source_word: δὲ
  choice: Namun
  rationale: Kata ini menandai pertentangan dengan larangan pada ayat sebelumnya. “Namun” menyampaikan daya adversatif itu secara wajar.
- source_word: ὑμῖν
  choice: bagi kalian sendiri
  rationale: Dativus keuntungan mengungkapkan bahwa tindakan itu dilakukan untuk kepentingan para pendengar. “Kalian” juga mempertahankan bentuk jamak Yunani.
- source_word: θησαυροὺς
  choice: harta
  rationale: Dalam bahasa Indonesia, “harta” lazim dipakai sebagai nomina kolektif dan mempertahankan motif kekayaan yang dihimpun tanpa menghasilkan bentuk jamak yang kaku.
- source_word: ἐν οὐρανῷ
  choice: di surga
  rationale: Padanan lokatif yang alami dan tepat untuk nomina tunggal Yunani.
- source_word: ὅπου
  choice: tempat
  rationale: Dalam susunan ini, “tempat” membentuk klausa relatif lokatif yang lebih lancar daripada pengulangan “di mana”.
- source_word: σὴς
  choice: ngengat
  rationale: Merujuk pada ngengat sebagai perusak pakaian dan barang simpanan.
- source_word: βρῶσις
  choice: pelapukan
  rationale: Kata Yunani dapat menunjuk pada proses memakan atau kerusakan yang menghabiskan. “Pelapukan” cukup luas untuk mencakup kemerosotan barang tanpa membatasinya hanya pada karat logam; alternatif leksikal dicatat dalam catatan kaki.
- source_word: ἀφανίζει
  choice: memusnahkannya
  rationale: Mengungkapkan tindakan membuat harta lenyap atau binasa. Pronomina “-nya” memperjelas bahwa harta adalah objek yang dimusnahkan.
- source_word: κλέπται
  choice: pencuri
  rationale: Padanan Indonesia baku; bentuknya dapat merujuk pada satu atau lebih pelaku secara generik.
- source_word: διορύσσουσιν
  choice: membobol
  rationale: Secara harfiah berarti menggali atau menembus, seperti pencuri yang menembus dinding rumah. “Membobol” menyampaikan tindakan masuk secara paksa dengan alami, sementara gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: κλέπτουσιν
  choice: mencurinya
  rationale: Padanan langsung dan alami; pronomina “-nya” kembali menunjuk kepada harta.
theological_decisions:
- issue: Hakikat “harta di surga”
  choice: Metafora “harta di surga” dipertahankan tanpa penjelasan tambahan.
  alternative: pahala surgawi; kekayaan rohani
  rationale: Teks tidak merinci hakikat harta tersebut. Mempertahankan metaforanya menghindari pemasukan ajaran tertentu tentang jasa, pahala, atau kekayaan rohani.
- issue: Cakupan makna βρῶσις
  choice: pelapukan
  alternative: karat; korosi; sesuatu yang menggerogoti
  rationale: Pilihan ini mempertahankan gagasan luas tentang kerusakan yang menghabiskan harta duniawi dan tidak mempersempitnya hanya kepada oksidasi logam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk mempertahankan sapaan jamak Yunani, sedangkan struktur kalimat tetap sederhana dan mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
