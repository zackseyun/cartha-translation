  verdict: approve
  source_fidelity: Terjemahan secara tepat mempertahankan kontras tegas σὺ δέ (“Namun engkau”), nilai temporal partisipel νηστεύων (“ketika berpuasa”), serta dua perintah aoris, ἄλειψαι dan νίψαι. “Olesilah kepalamu dengan minyak” menyampaikan tindakan mengurapi secara jelas dan wajar; minyak merupakan implikasi leksikal-kultural yang tepat dalam konteks ini. “Basuhlah wajahmu” adalah padanan langsung dan idiomatis bagi τὸ πρόσωπόν σου νίψαι.
  naturalness: Bahasa Indonesia baku, jelas, dan cukup bermartabat untuk register pengajaran Yesus. “Namun engkau” dan bentuk imperatif berakhiran -lah terdengar alami dalam gaya Alkitab Indonesia modern. Susunan kedua perintah juga mengalir baik.
  terminology: Istilah “berpuasa,” “kepala,” “minyak,” “basuhlah,” dan “wajah” digunakan secara konsisten dan tidak memaksakan makna ritual atau doktrinal. Catatan a secara tepat menerangkan latar kebiasaan perawatan diri tanpa mengubah teks utama. Catatan b menjelaskan fungsi kontekstual perintah ini tanpa mengklaim bahwa tujuan tersebut dinyatakan lengkap dalam ayat ini saja.
