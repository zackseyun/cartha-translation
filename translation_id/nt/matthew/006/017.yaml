id: MAT.6.17
reference: Matthew 6:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: id
  text: Namun engkau, ketika berpuasa, olesilah kepalamu dengan minyak[a] dan basuhlah wajahmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mengoleskan minyak pada kepala dapat merupakan bagian dari perawatan diri sehari-hari pada masa itu.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, tetaplah berpenampilan seperti biasa dan jangan membuat puasamu tampak jelas bagi orang lain.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Namun engkau
  rationale: Kata ganti σὺ bersifat menegaskan dan, bersama δέ, mengontraskan murid dengan orang-orang munafik pada konteks sebelumnya. Ungkapan ini mempertahankan kontras langsung tanpa menambahkan tafsiran.
- source_word: νηστεύων
  choice: ketika berpuasa
  rationale: Partisipel kini ini berfungsi secara adverbial dan paling alami diterjemahkan sebagai anak kalimat waktu dalam bahasa Indonesia.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: olesilah kepalamu dengan minyak
  rationale: ἀλείφω berarti mengoleskan minyak; dalam konteks ini tindakan tersebut berkaitan dengan perawatan diri yang lazim. Terjemahan ini lebih jelas dan alami daripada bentuk harfiah yang tidak lazim seperti 'minyakilah kepalamu'.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan kedua perintah secara sederhana.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: basuhlah wajahmu
  rationale: νίπτω lazimnya menunjuk pada membasuh bagian tubuh. 'Basuhlah wajahmu' mempertahankan nuansa konkret dan bentuk perintah dari teks Yunani.
theological_decisions:
- issue: Sifat perintah mengenai penampilan saat berpuasa
  choice: Perintah diterjemahkan sebagai tindakan perawatan diri yang normal ketika berpuasa.
  alternative: Tindakan pengurapan ritual, atau larangan terhadap puasa di depan umum.
  rationale: Konteks langsung mengontraskan tindakan ini dengan orang munafik yang membuat wajah mereka tampak muram. Namun, terjemahan utama tidak menambahkan tujuan yang tidak dinyatakan secara eksplisit dalam ayat ini; penjelasan kontekstual ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal yang tegas; 'olesilah ... dengan minyak' dipilih agar makna tindakan budaya tersebut jelas bagi pembaca masa kini.
