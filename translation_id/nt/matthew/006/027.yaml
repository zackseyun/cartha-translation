  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: id
  text: Siapakah di antara kalian yang, dengan merasa khawatir, dapat menambahkan sehasta pada masa hidupnya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada tinggi badannya.” Kata Yunani ini dapat berarti “masa hidup” atau “tinggi badan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Siapakah di antara kalian
  rationale: Ungkapan ini merupakan pertanyaan idiomatis yang berarti ‘siapa di antara kalian’. δέ hanya menghubungkan dengan ringan dan tidak perlu diterjemahkan secara tersendiri agar bahasa Indonesia tetap alami.
- source_word: μεριμνῶν
  choice: karena khawatir
  rationale: Partisipel μεριμνάω menyatakan keadaan khawatir sekaligus sarana yang dipertanyakan; ‘karena khawatir’ menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: δύναται προσθεῖναι
  choice: dapat menambahkan
  rationale: δύναται menyatakan kemampuan, sedangkan προσθεῖναι berarti menambah. Gabungan ini mempertahankan pertanyaan tentang ketidakmampuan kekhawatiran menghasilkan pertambahan.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: pada umur hidupnya
  rationale: ἡλικία dapat berarti umur/masa hidup atau tinggi badan. ‘Umur hidupnya’ dipilih karena sesuai dengan konteks kekhawatiran mengenai hidup, sementara kemungkinan ‘tinggi badan’ dipertahankan dalam catatan kaki.
- source_word: πῆχυν ἕνα
  choice: sehasta
  rationale: πῆχυς adalah hasta, ukuran panjang dari siku hingga ujung jari. ‘Sehasta’ mempertahankan gambaran konkret dan pemakaian ukuran panjang secara metaforis bagi umur hidup.
theological_decisions:
- issue: Makna ἡλικία dalam perkataan ini
  choice: umur hidup
  alternative: tinggi badan
  rationale: Kedua arti didukung secara leksikal. ‘Umur hidup’ cocok dengan pembicaraan tentang pemeliharaan Allah atas hidup dan gagasan memperpanjang jangka hidup; ‘tinggi badan’ tetap mungkin, khususnya karena ukuran ‘sehasta’, sehingga dicantumkan tanpa menghapus ketegangan tafsir.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan jamak ‘kalian’ membuat ἐξ ὑμῶν eksplisit dan mudah dipahami. Bentuk ‘sehasta’ mempertahankan satuan kuno tanpa konversi interpretatif ke ukuran modern.
