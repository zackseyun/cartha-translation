base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: id
  text: Sebab bangsa-bangsa lain[a] mengejar[b] semua itu. Sebab Bapamu yang di surga tahu bahwa kamu memerlukan semuanya itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang bukan Yahudi” atau “bangsa-bangsa.” Istilah Yunani ini dapat berarti bangsa-bangsa pada umumnya, tetapi di sini tampaknya menunjuk kepada mereka yang berada di luar umat perjanjian.
    reason: alternative_reading
  - marker: b
    text: Atau “mencari dengan sungguh-sungguh” atau “terus mencari.” Kata kerjanya menyiratkan pencarian yang tekun atau terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada kelompok-kelompok di luar umat perjanjian dan membedakan mereka dari murid-murid Yesus. Pilihan ini alami dalam bahasa Indonesia serta tidak membawa nuansa merendahkan yang dapat muncul pada 'orang kafir'.
- source_word: ἐπιζητοῦσιν
  choice: mengejar
  rationale: Kata kerja ini menyatakan pencarian yang sungguh-sungguh atau terus-menerus. 'Mengejar' menyampaikan daya itu secara ringkas dan alami tanpa perlu menambahkan kata keterangan.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Bapamu yang di surga
  rationale: Ungkapan ini mempertahankan hubungan 'Bapamu' dan penentuan surgawi secara alami, tanpa mengubahnya menjadi pernyataan tentang sifat ilahi yang lebih luas.
- source_word: οἶδεν
  choice: tahu
  rationale: Walaupun bentuk Yunani ini secara morfologis perfect, maknanya berfungsi sebagai keadaan kini; 'tahu' merupakan padanan Indonesia yang tepat.
- source_word: χρῄζετε
  choice: kamu memerlukan
  rationale: '''Memerlukan'' jelas, bermartabat, dan sesuai dengan makna mempunyai kebutuhan akan sesuatu.'
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: Sebab ... semua itu ... semuanya itu
  rationale: Pengulangan cakupan menyeluruh dalam bahasa Yunani dipertahankan, sementara variasi pronominal kecil membuat kalimat tetap alami dalam bahasa Indonesia.
- source_word: γὰρ ... γὰρ
  choice: Sebab ... [tanpa konjungsi eksplisit kedua]
  rationale: γάρ pertama menghubungkan ayat ini dengan alasan dalam konteks sebelumnya. γάρ kedua menjelaskan dasar bagi pernyataan pertama; dalam bahasa Indonesia hubungan itu tetap jelas melalui urutan dua kalimat, sehingga pengulangan 'sebab' yang kaku tidak diperlukan.
theological_decisions:
- issue: Rujukan τὰ ἔθνη dalam ajaran Yesus
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi; orang kafir; bangsa-bangsa
  rationale: Pilihan ini mempertahankan kontras historis antara para murid dan bangsa-bangsa di luar umat perjanjian, tanpa menyisipkan penilaian moral atau agama yang lebih keras daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sederhana dan bermartabat. 'Bapamu' dipilih sebagai bentuk tunggal yang merujuk kepada para pendengar secara kolektif dan mempertahankan keakraban relasional; huruf kapital mengikuti rujukan kepada Allah. Tanda baca dibagi menjadi dua kalimat agar alur alasan terbaca alami.
