  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: id
  text: 'Dan mengapa kalian khawatir tentang pakaian? Perhatikanlah bunga bakung[a] di ladang, bagaimana mereka tumbuh: mereka tidak bekerja keras dan tidak memintal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunga-bunga liar”. Kata Yunani yang diterjemahkan “bunga bakung” dapat dipahami secara lebih umum sebagai bunga liar.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: tentang pakaian
  rationale: ἔνδυμα berbentuk tunggal, tetapi dalam konteks ini menunjuk pada pakaian sebagai kebutuhan umum, bukan pada satu helai pakaian tertentu.
- source_word: τί μεριμνᾶτε
  choice: mengapa kalian khawatir
  rationale: μεριμνάω di sini menyatakan kekhawatiran mengenai pemenuhan kebutuhan hidup; τί secara idiomatis menyampaikan pertanyaan 'mengapa'. Bentuk jamak Yunani dinyatakan dengan 'kalian'.
- source_word: καταμάθετε
  choice: perhatikanlah
  rationale: Kata perintah ini mengajak pendengar mengamati dengan saksama agar memperoleh pengertian. 'Perhatikanlah' alami dalam bahasa Indonesia dan tetap memuat unsur pengamatan serta perenungan.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: bunga-bunga bakung di ladang
  rationale: κρίνα paling langsung berarti bunga bakung, sedangkan τοῦ ἀγροῦ menunjukkan bunga yang tumbuh di ladang. Kemungkinan makna yang lebih umum dicatat dalam catatan kaki.
- source_word: πῶς αὐξάνουσιν
  choice: bagaimana mereka tumbuh
  rationale: αὐξάνω merujuk pada pertumbuhan alami tanaman; terjemahan ini mempertahankan konstruksi pengamatan dalam bahasa sumber.
- source_word: οὐ κοπιῶσιν
  choice: mereka tidak bekerja keras
  rationale: κοπιάω berarti berjerih lelah atau bekerja keras. Ungkapan ini jelas bagi pembaca modern dan membedakannya dari tindakan khusus 'memintal'.
- source_word: οὐδὲ νήθουσιν
  choice: dan tidak memintal
  rationale: νήθω berarti memintal serat menjadi benang. Objeknya dapat dibiarkan tersirat sebagaimana dalam teks Yunani.
theological_decisions:
- issue: Makna μεριμνάω dalam ajaran Yesus tentang kebutuhan jasmani
  choice: khawatir
  alternative: cemas; merisaukan
  rationale: '''Khawatir'' menyampaikan kegelisahan batin mengenai kebutuhan jasmani tanpa mengubah ayat ini menjadi larangan terhadap perhatian atau perencanaan yang wajar.'
- issue: Identifikasi κρίνα
  choice: bunga-bunga bakung
  alternative: bunga-bunga liar
  rationale: Makna leksikal yang paling langsung dipertahankan dalam teks utama, sementara ketidakpastian mengenai jenis botanis atau pemakaian yang lebih luas tidak diselesaikan secara dogmatis dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa kata ganti Yunani berbentuk jamak. Susunan kalimat mempertahankan pertanyaan, perintah untuk mengamati, dan kesejajaran dua tindakan pada bagian akhir.
