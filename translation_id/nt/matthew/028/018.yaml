  source_fidelity: 'Terjemahan dengan setia menyampaikan urutan dan isi Yunani: Yesus mendekat kepada para murid, berbicara kepada mereka, dan menyatakan bahwa seluruh ἐξουσία di surga dan di bumi telah diberikan kepada-Nya. Bentuk pasif aoris Ἐδόθη dipertahankan dengan tepat melalui “telah diberikan kepada-Ku”; ini tidak mengubahnya menjadi klaim kepemilikan yang tidak menyebut tindakan pemberian.'
  naturalness: “Lalu Yesus mendekati mereka dan berkata” adalah Bahasa Indonesia modern yang alami dan menghindari pengulangan kaku dari ἐλάλησεν ... λέγων. “Di surga dan di bumi” juga idiomatis dan jelas.
  terminology: “Segala wewenang” merupakan padanan yang baik untuk πᾶσα ἐξουσία, karena menekankan otoritas atau hak untuk memerintah, bukan sekadar kemampuan. Kapitalisasi “-Ku” konsisten dengan register Alkitab Indonesia yang umum. Penanda catatan kaki ditempatkan pada unsur yang diterangkan dan isi kedua catatan selaras dengan teks utama.
