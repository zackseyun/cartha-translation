id: MAT.28.18
reference: Matthew 28:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: id
  text: Lalu Yesus mendekati mereka dan berkata, “Segala wewenang[b] di surga dan di bumi telah diberikan kepada-Ku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diberikan kepada-Ku.” Kata kerja Yunani berbentuk aoris pasif; “telah diberikan” menegaskan bahwa tindakan itu sudah selesai dan hasilnya tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: Atau “kuasa.” Kata Yunani ἐξουσία terutama berarti wewenang, hak, atau kekuasaan yang sah, bukan sekadar kekuatan atau kemampuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: mendekati mereka
  rationale: Partisip aoris προσέρχομαι menunjukkan bahwa Yesus bergerak mendekat kepada para murid sebelum berbicara. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna spasialnya.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: berkata
  rationale: Rangkaian harfiah ‘berbicara kepada mereka, dengan berkata’ terasa berulang dalam bahasa Indonesia. ‘Berkata’ secara alami menyampaikan tindakan berbicara kepada mereka sekaligus memperkenalkan kutipan langsung.
- source_word: Ἐδόθη μοι
  choice: telah diberikan kepada-Ku
  rationale: Bentuk aoris pasif dipertahankan sebagai pasif. ‘Telah’ menyatakan tindakan yang sudah selesai dan hasilnya tetap berlaku pada saat Yesus berbicara; ‘kepada-Ku’ menandai penerima.
- source_word: πᾶσα ἐξουσία
  choice: segala wewenang
  rationale: Dengan nomina abstrak tunggal, πᾶσα menyatakan keseluruhan. ἐξουσία terutama menunjuk pada hak atau kewenangan untuk memerintah, bukan semata-mata daya atau kemampuan.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: di surga dan di bumi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan dua ranah yang disebutkan dalam teks Yunani.
theological_decisions:
- issue: Sifat kepemilikan Yesus atas wewenang universal
  choice: segala wewenang ... telah diberikan kepada-Ku
  alternative: segala kuasa ... diberikan kepada-Ku
  rationale: Bentuk pasif Ἐδόθη dipertahankan agar tindakan pemberian wewenang kepada Yesus tidak diubah menjadi sekadar pernyataan bahwa Ia memilikinya. Pilihan ‘wewenang’ mempertahankan penekanan ἐξουσία pada hak memerintah, sedangkan ‘telah diberikan’ menyampaikan tindakan yang telah selesai dengan dampak yang tetap berlaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kutipan dibuat alami tanpa mempertahankan pengulangan Yunani ἐλάλησεν ... λέγων secara kaku. Huruf kapital pada pronomina ‘-Ku’ mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
