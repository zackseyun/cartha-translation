  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: id
  text: Dia tidak ada di sini, sebab Dia telah dibangkitkan[a], seperti yang telah Dia katakan. Mari, lihatlah tempat Dia terbaring[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah bangkit.” Kata kerja Yunani berbentuk pasif (“telah dibangkitkan”), meskipun terjemahan tradisional sering mengungkapkannya secara aktif.
    reason: alternative_reading
  - marker: b
    text: Atau, “tempat Dia berbaring” atau “tempat Dia telah dibaringkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Dia tidak ada di sini
  rationale: Ungkapan Yunani ini menyatakan keberadaan sekaligus lokasi. Subjek yang tersirat dibuat eksplisit sebagai “Dia” agar alami dalam bahasa Indonesia, sedangkan ὧδε diterjemahkan “di sini”.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk aoris pasif ἐγείρω dipertahankan sebagai pasif. “Telah dibangkitkan” menyampaikan peristiwa yang sudah terjadi dan relevan dengan keadaan saat itu tanpa mengubahnya menjadi bentuk aktif.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memperkenalkan alasan mengapa Dia tidak ada di situ. “Sebab” ringkas, jelas, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: καθὼς εἶπεν
  choice: seperti yang telah Dia katakan
  rationale: καθώς menyatakan kesesuaian dengan perkataan Yesus sebelumnya. Kata “telah” memperjelas bahwa perkataan itu mendahului peristiwa ini tanpa menambah gagasan baru.
- source_word: δεῦτε
  choice: Mari
  rationale: δεῦτε merupakan ajakan atau panggilan untuk mendekat. “Mari” menyampaikan ajakan tersebut secara alami kepada lebih dari satu orang.
- source_word: ἴδετε
  choice: lihatlah
  rationale: Imperatif ini meminta para perempuan segera memeriksa tempat itu. “Lihatlah” jelas dan bermartabat tanpa memakai ungkapan arkais.
- source_word: τὸν τόπον
  choice: tempat
  rationale: τόπος menunjuk pada lokasi fisik di dalam makam; “tempat” merupakan padanan Indonesia yang alami dan cukup konkret.
- source_word: ὅπου ἔκειτο
  choice: tempat Dia berbaring
  rationale: κεῖμαι pada konteks ini menyatakan keadaan tubuh yang terbaring atau ditempatkan. “Berbaring” mempertahankan makna statifnya, sementara kemungkinan “dibaringkan” dicatat sebagai alternatif.
theological_decisions:
- issue: Bentuk dan agensi dalam pernyataan kebangkitan
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: ἠγέρθη berbentuk pasif. Terjemahan pasif mempertahankan bentuk teks dan nuansa bahwa kebangkitan merupakan tindakan yang dilakukan terhadap Dia, tanpa meniadakan pernyataan Perjanjian Baru lainnya tentang agensi Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Dia” dipakai secara konsisten untuk referen yang jelas, sedangkan bentuk pasif pada pernyataan kebangkitan dan makna statif κεῖμαι dipertahankan sejauh alami dalam bahasa sasaran.
