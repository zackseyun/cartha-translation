id: MAT.28.1
reference: Matthew 28:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: id
  text: Sesudah hari Sabat[a], ketika fajar mulai menyingsing pada hari pertama minggu itu, Maria Magdalena dan Maria yang lain datang untuk melihat makam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Menjelang akhir hari Sabat, ketika fajar mulai menyingsing pada hari pertama minggu itu.” Frasa Yunani pada awal ayat dapat dipahami sebagai “sesudah hari Sabat” atau “menjelang akhir hari Sabat.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Sesudah hari Sabat
  rationale: ὀψέ dengan bentuk genitif dapat menyatakan waktu sesudah suatu peristiwa. Dalam konteks ini, frasa tersebut paling wajar dipahami sebagai sesudah berakhirnya hari Sabat. Bentuk jamak σαββάτων lazim dipakai secara idiomatis untuk hari Sabat tunggal. Nuansa penghubung δέ tidak perlu dinyatakan dengan kata tersendiri dalam bahasa Indonesia.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: ketika fajar mulai menyingsing
  rationale: Partisipel ἐπιφώσκω di sini menunjuk pada datangnya terang pagi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan aspek permulaan proses.
- source_word: εἰς μίαν σαββάτων
  choice: pada hari pertama minggu itu
  rationale: μίαν σαββάτων merupakan ungkapan Semitis untuk hari pertama dalam satu minggu. Dalam bahasa Indonesia, hubungan waktunya paling alami dinyatakan dengan 'pada' bersama keterangan tentang fajar.
- source_word: ἦλθεν
  choice: datang
  rationale: Bentuk aoris ἔρχομαι dalam narasi ini secara langsung menyatakan bahwa kedua perempuan itu datang ke makam.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Nama pribadi dan sebutan asalnya mengikuti bentuk yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἡ ἄλλη Μαρία
  choice: Maria yang lain
  rationale: Terjemahan ini mempertahankan pembedaan naratif antara Maria Magdalena dan seorang Maria lainnya tanpa menambahkan identitas yang tidak dinyatakan dalam ayat.
- source_word: θεωρῆσαι
  choice: untuk melihat
  rationale: θεωρέω dapat berarti memandang atau mengamati dengan sengaja. 'Melihat' menyampaikan maksud tindakan itu secara alami tanpa melebihkannya sebagai pemeriksaan resmi.
- source_word: τὸν τάφον
  choice: makam itu
  rationale: τάφος menunjuk pada tempat Yesus dikuburkan. 'Makam' merupakan padanan modern yang jelas, sedangkan kata sandang tertentu tercermin dalam 'itu'.
theological_decisions:
- issue: Ungkapan waktu pada awal kisah kebangkitan
  choice: Ayat diterjemahkan sebagai kejadian sesudah hari Sabat berakhir, ketika fajar mulai menyingsing pada hari pertama minggu itu.
  alternative: Frasa pembuka dapat dipahami sebagai 'Menjelang akhir hari Sabat' atau 'Pada akhir hari Sabat'.
  rationale: Ungkapan Yunani ὀψὲ σαββάτων memang dapat diperdebatkan. Gabungan penanda waktu dalam ayat ini paling wajar menunjuk pada waktu sesudah hari Sabat, tetapi kemungkinan pemahaman alternatif tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas ungkapan waktu Yunani dipertahankan melalui catatan kaki.
