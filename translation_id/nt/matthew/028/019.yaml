id: MAT.28.19
reference: Matthew 28:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: id
  text: Karena itu, pergilah dan jadikanlah semua bangsa murid, dengan membaptis mereka ke dalam nama[a] Bapa, Anak, dan Roh Kudus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam nama.” Teks Yunani berbunyi “ke dalam nama,” yang mungkin menekankan masuk ke dalam hubungan atau identifikasi.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: pergilah
  rationale: Partisip aoris ini mendahului imperatif utama μαθητεύσατε dan dalam konteks amanat tersebut memiliki daya pengutusan. Bentuk imperatif idiomatis “pergilah” lebih wajar daripada terjemahan harfiah “setelah pergi” dan tidak melemahkan amanat menjadi sekadar “ketika kalian pergi”.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan yang bertolak dari pernyataan tentang segala kuasa Yesus dalam ayat 18. “Karena itu” mempertahankan hubungan logis tersebut dengan jelas.
- source_word: μαθητεύσατε
  choice: jadikanlah ... murid
  rationale: 'Verba ini bersifat kausatif: membuat seseorang menjadi murid. Ungkapan ini jelas dalam bahasa Indonesia modern dan tidak menambahkan objek kepemilikan seperti “murid-Ku,” yang tidak dinyatakan secara eksplisit dalam teks Yunani.'
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: ἔθνη menunjuk pada bangsa-bangsa atau kelompok-kelompok masyarakat secara luas. “Semua bangsa” menyampaikan cakupan universal tanpa mempersempitnya menjadi hanya bangsa-bangsa bukan Yahudi.
- source_word: βαπτίζοντες
  choice: dengan membaptis
  rationale: Partisip ini menerangkan pelaksanaan perintah menjadikan murid. “Membaptis” mempertahankan istilah ritus Kristen yang baku tanpa memutuskan cara baptisan yang diperdebatkan.
- source_word: εἰς τὸ ὄνομα
  choice: ke dalam nama
  rationale: εἰς secara alami menyatakan gerak masuk dan di sini dapat mengisyaratkan masuk ke dalam hubungan atau identifikasi. “Ke dalam nama” mempertahankan tekstur ungkapan Yunani, sedangkan bentuk tradisional “dalam nama” dicatat sebagai alternatif.
- source_word: τοῦ πατρὸς
  choice: Bapa
  rationale: Dalam rumusan rangkap tiga ini, kata tersebut merupakan gelar ilahi. Huruf kapital menandai rujukan titulernya.
- source_word: τοῦ υἱοῦ
  choice: Anak
  rationale: Dalam koordinasi dengan Bapa dan Roh Kudus, kata ini merupakan gelar ilahi, bukan sebutan umum.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: Ini adalah padanan baku dan modern bagi gelar ilahi tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Terjemahan preposisi baptisan εἰς dalam rumusan rangkap tiga
  choice: ke dalam nama
  alternative: dalam nama
  rationale: “Ke dalam” paling langsung mencerminkan εἰς dan menjaga kemungkinan nuansa masuk ke dalam hubungan atau identifikasi, tanpa menetapkan teori sakramental tertentu. Alternatif idiomatis dan tradisional “dalam nama” tetap diberikan dalam catatan kaki.
- issue: Nama tunggal yang diikuti Bapa, Anak, dan Roh Kudus
  choice: Bapa dan Anak dan Roh Kudus
  alternative: bapa dan anak dan roh kudus
  rationale: Sintaksisnya memakai “nama” dalam bentuk tunggal lalu tiga unsur genitif yang sejajar. Kapitalisasi menunjukkan bahwa ketiganya adalah gelar ilahi personal, tanpa menambahkan penjelasan doktrinal yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk “pergilah” dan “jadikanlah” mempertahankan daya amanat; “dengan membaptis” memperjelas hubungan partisip dengan perintah utama. Penanda catatan ditempatkan tepat setelah frasa yang dijelaskannya.
