  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: id
  text: Kemudian Yesus berkata kepada mereka, “Jangan takut. Pergilah dan beritahukan kepada saudara-saudara-Ku[a] agar mereka pergi ke Galilea, dan di sana mereka akan melihat Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “saudara-saudara-Ku” berbentuk maskulin jamak. Dalam konteks ini, ungkapan tersebut merujuk kepada murid-murid Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa secara alami dalam narasi bahasa Indonesia.
- source_word: λέγει αὐταῖς
  choice: Yesus berkata kepada mereka
  rationale: Kala kini historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar; pronomina feminin jamak tetap diterjemahkan sebagai 'mereka' karena rujukannya jelas dari konteks.
- source_word: Μὴ φοβεῖσθε
  choice: Jangan takut
  rationale: Larangan ini paling alami dan langsung dalam bahasa Indonesia modern.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Pergilah, beritahukan
  rationale: Dua imperatif dipertahankan. 'Beritahukan' menyatakan penyampaian pesan dengan alami tanpa menjadi terlalu resmi.
- source_word: τοῖς ἀδελφοῖς μου
  choice: kepada saudara-saudara-Ku
  rationale: '''Saudara-saudara'' mempertahankan istilah kekerabatan maskulin jamak dalam Yunani dan tidak menggantinya dengan tafsiran ''murid-murid''.'
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: supaya mereka pergi ke Galilea
  rationale: ἵνα dengan subjungtif menyampaikan isi perintah tidak langsung; 'supaya' mempertahankan struktur dan nuansa tersebut dengan jelas.
- source_word: κἀκεῖ με ὄψονται
  choice: Di sanalah mereka akan melihat Aku
  rationale: Bentuk '-lah' menegaskan keterangan tempat yang terkandung dalam κἀκεῖ, sementara 'melihat' mempertahankan arti luas ὄψονται tanpa mempersempitnya menjadi 'menemui'.
theological_decisions:
- issue: Rujukan ungkapan 'saudara-saudara-Ku'
  choice: Istilah kekerabatan dipertahankan dalam teks utama, dengan catatan bahwa dalam konteks ini ungkapan tersebut merujuk kepada murid-murid Yesus.
  alternative: Mengganti langsung dengan 'murid-murid-Ku'.
  rationale: Terjemahan ini mempertahankan bahasa kekeluargaan dan kehangatan teologis teks Yunani tanpa mengaburkan rujukan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur perintah tidak langsung dipertahankan tanpa kekakuan.
