  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: id
  text: 'Pergilah segera dan katakan kepada murid-murid-Nya: ‘Ia telah dibangkitkan dari antara orang mati. Lihatlah, Ia mendahului kalian ke Galilea. Di sana kalian akan melihat-Nya.’ Lihatlah, aku telah mengatakannya kepada kalian.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: Pergilah segera
  rationale: Partisip aoris πορευθεῖσαι bersama ταχύ menyatakan tindakan yang harus segera dilakukan; imperatif alami dalam bahasa Indonesia mempertahankan daya perintahnya.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Dia telah dibangkitkan dari antara orang mati
  rationale: Bentuk pasif Ἠγέρθη dipertahankan, tanpa mengubahnya menjadi bentuk aktif, dan ἀπὸ τῶν νεκρῶν diterjemahkan sebagai keluar dari lingkungan orang-orang mati.
- source_word: προάγει ὑμᾶς
  choice: Dia mendahului kalian
  rationale: Dalam konteks perjalanan menuju Galilea, προάγει berarti pergi lebih dahulu atau mendahului; pilihan ini tidak memaksakan nuansa memimpin.
- source_word: ἰδού
  choice: Lihatlah / Ingatlah
  rationale: Kemunculan pertama mengarahkan perhatian pada kabar bahwa Yesus mendahului mereka; kemunculan kedua berfungsi idiomatis untuk menegaskan bahwa pesan telah disampaikan. Variasi ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan fungsi retoris masing-masing.
- source_word: ὑμᾶς / ὑμῖν
  choice: kalian / kepada kalian
  rationale: Pronomina Yunani berbentuk jamak; 'kalian' menyatakannya secara jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Pelaku dalam kebangkitan
  choice: Dia telah dibangkitkan
  alternative: Dia telah bangkit
  rationale: Bentuk pasif Yunani dipertahankan agar teks tidak secara eksplisit mengubah fokus atau menyebut pelaku yang tidak dinyatakan dalam ayat.
- issue: Makna προάγει
  choice: mendahului kalian ke Galilea
  alternative: memimpin kalian ke Galilea
  rationale: Konteks menyatakan bahwa Yesus pergi lebih dahulu dan akan dijumpai di Galilea; 'mendahului' menjaga makna ini tanpa menambahkan gagasan bahwa Ia sedang menuntun rombongan secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak dinyatakan dengan 'kalian'. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia, sementara kata ganti orang pertama malaikat tetap ditulis 'aku'.
