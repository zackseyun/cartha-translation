base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: id
  text: Mereka segera meninggalkan makam itu. Dengan rasa takut[a] dan sukacita besar, mereka berlari untuk memberitahu murid-murid-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan rasa gentar dan sukacita besar.” Kata Yunani yang diterjemahkan “takut” dalam konteks ini juga dapat mengandung arti rasa takjub penuh hormat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: meninggalkan
  rationale: Partisip aoris ini menyatakan tindakan para perempuan ketika beranjak dari makam; bentuk verbal berurutan lebih alami dalam bahasa Indonesia.
- source_word: ταχὺ
  choice: segera
  rationale: Menunjukkan tindakan yang dilakukan dengan cepat dan tanpa berlambat; 'segera' alami dalam alur naratif Indonesia.
- source_word: μνημείου
  choice: makam
  rationale: Dalam konteks kebangkitan, kata ini menunjuk pada tempat Yesus dimakamkan; 'makam' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: dengan takut dan sukacita yang besar
  rationale: Mempertahankan kedua emosi yang berdampingan dalam teks, tanpa menyempitkan φόβος menjadi hanya ketakutan negatif atau hanya rasa takjub.
- source_word: ἔδραμον
  choice: berlari
  rationale: Menyampaikan tindakan fisik yang gamblang dan hidup, sesuai arti dasar bentuk aoris dari τρέχω.
- source_word: ἀπαγγεῖλαι
  choice: untuk menyampaikan kabar itu
  rationale: Infinitif tujuan ini menyatakan maksud mereka berlari. Objek tidak dinyatakan secara eksplisit dalam bahasa Yunani, tetapi 'kabar itu' secara wajar merujuk pada berita yang baru mereka terima dan membuat kalimat Indonesia lengkap tanpa merinci isinya secara berlebihan.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: μαθηταί paling tepat diterjemahkan 'murid-murid' dalam narasi Injil; αὐτοῦ merujuk kepada Yesus, dan kapitalisasi pronomina mengikuti kelaziman teks Alkitab bahasa Indonesia.
theological_decisions:
- issue: Ketegangan emosi dalam tanggapan para perempuan
  choice: dengan takut dan sukacita yang besar
  alternative: dengan rasa gentar dan sukacita yang besar
  rationale: φόβος dapat mencakup ketakutan maupun rasa gentar atau takjub penuh hormat. Teks utama mempertahankan padanan langsung 'takut' agar ketegangan antara takut dan sukacita tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'lalu' mencerminkan gerak berurutan, sedangkan 'sukacita' dipertahankan sebagai istilah Alkitab yang tetap umum dipahami.
