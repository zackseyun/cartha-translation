id: MAT.28.3
reference: Matthew 28:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: id
  text: Penampilannya seperti kilat[a], dan pakaiannya putih seperti salju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rupanya” atau “wujudnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: δέ merupakan penghubung ringan dalam alur narasi. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya sudah alami tanpa kata penghubung tersendiri.
- source_word: εἰδέα
  choice: rupa
  rationale: εἰδέα menunjuk pada penampilan atau wujud yang tampak. “Rupa” alami, ringkas, dan bermartabat dalam konteks ini.
- source_word: ὡς ἀστραπή
  choice: seperti kilat
  rationale: ὡς menandai perbandingan; “seperti kilat” mempertahankan simile secara alami dalam bahasa Indonesia.
- source_word: ἔνδυμα
  choice: pakaian
  rationale: ἔνδυμα adalah istilah umum untuk pakaian; pilihan ini tidak mempersempit makna menjadi jubah atau jenis pakaian tertentu.
- source_word: λευκόν
  choice: putih
  rationale: λευκόν secara langsung menyatakan warna putih, tanpa mengharuskan tambahan intensitas seperti “putih cemerlang.”
- source_word: ὡς χιών
  choice: seperti salju
  rationale: Ungkapan ini mempertahankan perbandingan kedua, yakni putihnya pakaian dengan salju.
theological_decisions:
- issue: Rujukan αὐτοῦ
  choice: Kata ganti tersirat dalam “rupanya” dan “pakaiannya” merujuk kepada malaikat Tuhan dalam ayat 2.
  alternative: Pembaca dapat mengira kata ganti tersebut merujuk kepada Yesus karena konteks luasnya adalah kebangkitan.
  rationale: Anteseden terdekat adalah malaikat Tuhan yang turun dan menggulingkan batu dalam ayat sebelumnya. Terjemahan mempertahankan bentuk pronominal Yunani dan tidak menambahkan nomina yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur paralel kedua perbandingan dipertahankan, dan kopula yang tersirat pada klausa kedua dibiarkan alami dalam bahasa Indonesia.
