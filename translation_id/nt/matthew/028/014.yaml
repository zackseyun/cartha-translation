id: MAT.28.14
reference: Matthew 28:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: id
  text: Dan jika hal ini sampai terdengar oleh gubernur,[a] kami akan membujuknya dan memastikan kalian tidak mendapat masalah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal ini sampai kepada perhatian gubernur.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuat kalian bebas dari kekhawatiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: sampai terdengar
  rationale: Bentuk pasif dipertahankan secara alami dan menyatakan bahwa perkara itu menjadi diketahui.
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: oleh gubernur
  rationale: Dalam konstruksi ini, laporan tersebut masuk ke lingkup pendengaran atau perhatian gubernur; alternatif idiomatis dijelaskan dalam catatan kaki.
- source_word: ἡγεμόνος
  choice: gubernur
  rationale: Dalam konteks pemerintahan Romawi di Matius, istilah ini menunjuk kepada gubernur provinsi, yaitu Pilatus.
- source_word: πείσομεν αὐτόν
  choice: kami akan membujuknya
  rationale: Menerjemahkan arti lazim πείθω secara transparan tanpa mempersempitnya menjadi tindakan menenangkan atau menyuap.
- source_word: ἀμερίμνους
  choice: tidak mendapat masalah
  rationale: Secara harfiah berarti bebas dari kekhawatiran, tetapi dalam konteks ini menunjuk kepada terbebasnya para penjaga dari konsekuensi atau kesulitan.
- source_word: ποιήσομεν
  choice: memastikan kalian
  rationale: Dengan adjektiva predikatif, ποιέω menyatakan hasil; ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bahwa mereka akan membuat para penjaga berada dalam keadaan aman dari masalah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti “kalian” dipakai karena ὑμᾶς berbentuk jamak dan merujuk kepada para penjaga.
