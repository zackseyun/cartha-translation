  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: id
  text: Sementara mereka sedang dalam perjalanan[a], lihatlah[b], beberapa orang dari pasukan penjaga masuk ke kota dan melaporkan kepada imam-imam kepala segala sesuatu yang telah terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika mereka sedang dalam perjalanan.” Bahasa Yunani memakai konstruksi genitif absolut untuk menetapkan latar waktu bagi peristiwa berikutnya.
    reason: lexical_alternative
  - marker: b
    text: “Lihatlah” menerjemahkan penanda perhatian Yunani ἰδού, yang menandai perkembangan mendadak atau penting dalam narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Sementara mereka dalam perjalanan
  rationale: Konstruksi genitif absolut menetapkan latar waktu bagi peristiwa berikutnya. Terjemahan ini alami dalam bahasa Indonesia dan tidak menambahkan tujuan perjalanan yang tidak disebutkan dalam teks Yunani.
- source_word: ἰδού
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian dalam narasi yang mengisyaratkan perkembangan mendadak atau penting, meskipun bentuk ini sengaja terasa lebih menonjol daripada bahasa naratif biasa.
- source_word: τινες τῆς κουστωδίας
  choice: beberapa orang dari pasukan penjaga
  rationale: κουστωδία menunjuk pada regu penjaga yang ditempatkan di makam. Ungkapan ini jelas dan wajar bagi pembaca Indonesia modern.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: datang ke kota
  rationale: Partisip aoris ini mendahului verba utama dan secara alami menyatakan tindakan yang mengiringi atau mendahului pelaporan. 'Datang ke kota' mempertahankan arah gerak teks tanpa terjemahan partisip yang kaku.
- source_word: ἀπήγγειλαν
  choice: melaporkan
  rationale: Verba ini menyatakan penyampaian suatu laporan atau kabar; 'melaporkan' sesuai dengan tindakan memberikan informasi kepada para pemimpin.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: kepada imam-imam kepala
  rationale: Ini merupakan padanan baku dan jelas bagi bentuk jamak ἀρχιερεῖς dalam konteks kepemimpinan Yahudi pada masa itu.
- source_word: ἅπαντα τὰ γενόμενα
  choice: segala sesuatu yang telah terjadi
  rationale: ἅπαντα menegaskan keseluruhan, sedangkan τὰ γενόμενα menunjuk pada peristiwa-peristiwa yang sudah berlangsung. Pilihan ini alami dan mempertahankan cakupan menyeluruhnya.
