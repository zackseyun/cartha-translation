  register: Bahasa Indonesia modern, jelas, dan bermartabat. Penanda naratif 'lihatlah' dipertahankan karena memiliki fungsi wacana dalam teks sumber, sedangkan susunan partisip Yunani diungkapkan secara alami dalam bahasa Indonesia.
