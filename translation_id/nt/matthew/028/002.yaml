id: MAT.28.2
reference: Matthew 28:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: id
  text: Dan lihatlah, terjadi gempa bumi yang dahsyat, sebab seorang malaikat Tuhan turun dari surga, lalu mendekat, menggulingkan batu itu, dan duduk di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδού
  choice: Dan lihatlah
  rationale: Mempertahankan penanda naratif yang mengarahkan perhatian pembaca pada peristiwa mengejutkan, dengan ungkapan Indonesia yang tetap wajar dan bermartabat.
- source_word: σεισμὸς ... μέγας
  choice: gempa bumi yang dahsyat
  rationale: Menyampaikan arti harfiah 'gempa besar' sekaligus kekuatan peristiwanya dalam bahasa Indonesia alami.
- source_word: ἄγγελος ... κυρίου
  choice: seorang malaikat Tuhan
  rationale: Nomina Yunani tidak berartikel dan paling alami diperkenalkan sebagai 'seorang malaikat'; κυρίου dipertahankan sebagai 'Tuhan' tanpa menentukan secara berlebihan nuansa kepemilikan atau nama ilahi.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: turun dari surga
  rationale: Menerjemahkan partisip aoris secara langsung sebagai tindakan yang mendahului tindakan utama.
- source_word: προσελθών
  choice: lalu datang
  rationale: Menyatakan gerak mendekat dalam rangkaian naratif tanpa menambahkan objek yang tidak dinyatakan secara eksplisit.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: menggulingkan batu itu
  rationale: Kata kerja menunjukkan tindakan menggulirkan atau menggulingkan batu menjauh; 'batu itu' mempertahankan definiteness teks.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: duduk di atasnya
  rationale: Bentuk imperfek menggambarkan keadaan malaikat yang sedang duduk; pronomina dibiarkan merujuk secara alami kepada batu.
theological_decisions:
- issue: Hubungan sebab antara gempa dan turunnya malaikat
  choice: mempertahankan 'sebab'
  alternative: menyajikan turunnya malaikat hanya sebagai peristiwa berikutnya
  rationale: Partikel γάρ secara eksplisit memberikan penjelasan mengenai gempa; terjemahan tidak perlu menentukan lebih jauh mekanisme kausalnya.
- issue: Identitas 'Tuhan' dalam frasa ἄγγελος κυρίου
  choice: malaikat Tuhan
  alternative: malaikat dari Tuhan
  rationale: Frasa tradisional dan alami ini menjaga keluasan konstruksi genitif Yunani serta tidak memaksakan identifikasi teologis yang lebih spesifik.
- issue: Urutan waktu tindakan malaikat
  choice: turun dari surga, lalu datang menggulingkan ... dan duduk
  alternative: telah turun ... dan telah datang
  rationale: Partisip aoris menunjukkan tindakan pendahuluan, sedangkan verba utama melanjutkan adegan; bahasa Indonesia tidak memerlukan bentuk pluperfek untuk menyampaikan urutan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif serta hubungan sebab dipertahankan, tetapi susunan partisip Yunani dialihkan menjadi rangkaian verba yang alami dalam bahasa Indonesia.
