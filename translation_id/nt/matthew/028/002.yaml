  verdict: revise
  source_fidelity: Perlu revisi kecil. προσελθών berarti “mendekat/menghampiri”; “lalu datang menggulingkan” tidak menyatakan gerak mendekat itu dengan cukup jelas. Urutan turun dari surga, mendekat, menggulingkan batu, lalu duduk tetap perlu dipertahankan. Hubungan penjelas γάρ melalui “sebab” sudah tepat.
  naturalness: Teks pada dasarnya alami dan berregister baik. “Mendekat” tanpa objek tetap wajar dalam rangkaian naratif ini dan menghindari penambahan objek seperti “kubur” yang tidak dinyatakan dalam teks Yunani.
  terminology: “Gempa bumi yang dahsyat,” “seorang malaikat Tuhan,” “surga,” dan “batu itu” sesuai dengan makna serta register yang diinginkan. Tidak diperlukan catatan kaki.
  issues:
  - severity: medium
    issue: προσελθών diterjemahkan “lalu datang menggulingkan.”
    rationale: Partisip ini secara khusus menyatakan tindakan mendekat atau menghampiri sebelum menggulingkan batu. “Datang menggulingkan” dapat dipahami hanya sebagai datang untuk melakukan tindakan itu dan tidak memelihara unsur pendekatan secara jelas.
  revised_text: Dan lihatlah, terjadi gempa bumi yang dahsyat, sebab seorang malaikat Tuhan turun dari surga, lalu mendekat, menggulingkan batu itu, dan duduk di atasnya.
