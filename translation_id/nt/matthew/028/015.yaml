revisions:
- from: Maka mereka menerima uang perak itu dan melakukan seperti yang telah diperintahkan kepada mereka. Kabar[a] ini pun tersebar luas di kalangan orang Yahudi sampai hari ini.
  to: Mereka pun menerima uang perak itu dan bertindak sesuai dengan yang telah diajarkan kepada mereka. Kabar[a] ini tersebar luas di kalangan orang Yahudi hingga hari ini.
  rationale: Revisi mengganti ungkapan yang kurang idiomatis dan menghindari penguatan makna διδάσκω menjadi perintah eksplisit. Padanan “kabar” dan frasa “di kalangan orang Yahudi” dipertahankan sebagai terjemahan yang wajar dan setia konteks bagi λόγος serta παρὰ Ἰουδαίοις. Penanda catatan kaki tetap langsung melekat pada unsur leksikal yang dijelaskan.
