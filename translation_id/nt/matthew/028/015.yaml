  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: id
  text: Mereka pun menerima uang perak itu dan bertindak sesuai dengan yang telah diajarkan kepada mereka. Kabar[a] ini tersebar luas di kalangan orang Yahudi hingga hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laporan” atau “kisah.” Kata Yunani λόγος dapat berarti kabar, laporan, atau kisah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: menerima
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Karena pada ayat sebelumnya para pemimpin memberikan uang kepada para serdadu, “menerima” paling alami dalam konteks ini; “mengambil” juga mungkin secara leksikal.
- source_word: τὰ ἀργύρια
  choice: uang perak itu
  rationale: ἀργύρια menunjuk pada perak sebagai uang. “Uang perak itu” mempertahankan unsur konkret sekaligus merujuk kembali pada uang yang disebut dalam konteks sebelumnya, tanpa mempersempitnya menjadi jenis koin tertentu.
- source_word: ἐποίησαν
  choice: melakukan
  rationale: ποιέω di sini berarti melakukan atau melaksanakan sesuatu. Pilihan ini berpadu secara alami dengan klausa tentang perintah yang mereka terima.
- source_word: ὡς ἐδιδάχθησαν
  choice: seperti yang telah diperintahkan kepada mereka
  rationale: Bentuk pasif διδάσκω dapat berarti diajar atau diberi petunjuk. Dalam konteks mereka diberi arahan tentang apa yang harus dikatakan, “diperintahkan” menyampaikan maksud praktisnya dengan wajar.
- source_word: διεφημίσθη
  choice: tersebar luas
  rationale: Verba ini menggambarkan penyebaran luas suatu berita atau laporan. Bentuk Indonesia ini wajar dan tetap menyatakan dampak yang berlanjut hingga masa penulis.
- source_word: ὁ λόγος οὗτος
  choice: kabar ini
  rationale: λόγος mempunyai rentang makna seperti perkataan, kabar, laporan, atau kisah. Di sini yang dimaksud ialah kabar penjelasan yang disebarkan para serdadu; “kabar” alami dan tidak terlebih dahulu menilai benar-tidaknya isi tersebut.
- source_word: παρὰ Ἰουδαίοις
  choice: di kalangan orang Yahudi
  rationale: παρά dengan datif di sini berarti di antara atau dalam lingkungan suatu kelompok. Ungkapan ini menunjuk pada peredaran kabar dalam komunitas Yahudi pada latar narasi tersebut.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: sampai hari ini
  rationale: Ungkapan idiomatis ini berarti bahwa kabar tersebut terus beredar hingga masa kini dari sudut pandang penulis.
theological_decisions:
- issue: Cakupan sebutan Ἰουδαίοις dalam konteks naratif yang dapat disalahpahami sebagai penilaian umum terhadap semua orang Yahudi
  choice: di kalangan orang Yahudi
  alternative: di kalangan orang Yudea
  rationale: Bentuk datif jamak ini secara langsung menunjuk kepada orang Yahudi, dan konteksnya menyoroti peredaran kabar dalam komunitas tersebut, bukan semata-mata identitas geografis. Terjemahan ini tidak memperluas pernyataan narator menjadi tuduhan teologis terhadap semua orang Yahudi di segala tempat dan zaman.
- issue: Ambiguitas λόγος sebagai kabar, laporan, atau kisah
  choice: kabar
  alternative: laporan; kisah
  rationale: “Kabar” cocok dengan sesuatu yang tersebar dan menjaga kenetralan leksikal. Alternatif dicatat agar luas makna λόγος dan nuansa polemis konteks tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Maka” menjaga kesinambungan dengan tindakan pada ayat sebelumnya, sedangkan “pun” menandai perkembangan narasi secara alami. Penanda catatan kaki ditempatkan langsung setelah kata “Kabar,” yaitu unsur yang dijelaskan.
