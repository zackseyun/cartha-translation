id: MAT.28.12
reference: Matthew 28:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: id
  text: Setelah berkumpul dengan para tua-tua dan berunding, mereka memberikan sejumlah besar uang perak kepada para prajurit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναχθέντες
  choice: Setelah berkumpul
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: bersama para tua-tua
  rationale: μετά dengan genitif menyatakan kebersamaan. 'Para tua-tua' merupakan padanan yang lazim bagi para pemimpin Yahudi dalam konteks ini.
- source_word: συμβούλιόν τε λαβόντες
  choice: dan berunding
  rationale: Ungkapan συμβούλιον λαμβάνω berarti mengadakan pertimbangan atau perundingan bersama, bukan sekadar menerima nasihat.
- source_word: ἀργύρια ἱκανὰ
  choice: sejumlah besar uang perak
  rationale: ἀργύρια menunjuk pada uang berbahan perak, sedangkan ἱκανὰ dalam konteks ini menyatakan jumlah yang besar. Susunan ini alami sekaligus mempertahankan unsur 'perak' dalam teks Yunani.
- source_word: ἔδωκαν
  choice: mereka memberikan
  rationale: Padanan langsung dan alami bagi verba aoris δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: kepada para prajurit
  rationale: στρατιώτης secara leksikal berarti prajurit; meskipun mereka bertugas sebagai penjaga, fungsi itu tidak menggantikan sebutan dalam teks.
theological_decisions:
- issue: Identitas subjek tersirat
  choice: '''mereka'' merujuk kepada imam-imam kepala dari ayat sebelumnya'
  alternative: kelompok yang tidak disebutkan secara khusus
  rationale: Partisip dan verba utama berbentuk jamak maskulin, dengan subjek yang berlanjut dari Matius 28:11. Terjemahan mempertahankan pronomina 'mereka' dan tidak mengulang 'imam-imam kepala', karena teks Yunani juga tidak menyebutkannya kembali.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berunding' dipilih sebagai ungkapan yang ringkas dan alami; 'uang perak' mempertahankan bahan atau jenis uang yang disebut dalam bahasa Yunani.
