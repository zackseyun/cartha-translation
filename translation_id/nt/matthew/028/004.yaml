  source_fidelity: Terjemahan dengan tepat menyampaikan hubungan sebab dari ἀπὸ ... φόβου, objek personal αὐτοῦ tanpa mempersempit referennya di teks utama, reaksi jasmani ἐσείσθησαν, subjek substantival οἱ τηροῦντες, perubahan keadaan dalam ἐγενήθησαν, dan perbandingan ὡς νεκροί. Penghilangan δέ secara tersendiri dapat diterima dalam alur bahasa Indonesia.
