  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: id
  text: Karena takut kepadanya, para penjaga itu gemetar dan menjadi seperti orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Akibat rasa takut kepadanya, para penjaga itu terguncang.”'
    reason: Alternatif ini mencerminkan secara lebih harfiah ἀπό sebagai sumber/sebab dan bentuk pasif ἐσείσθησαν sebagai 'terguncang'.
lexical_decisions:
- source_word: ἀπὸ
  choice: karena
  rationale: Dengan bentuk genitif, ἀπό di sini menyatakan sebab atau sumber reaksi para penjaga. 'Karena' menyampaikan hubungan kausal itu secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan dalam alur narasi. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya tetap jelas tanpa kata penghubung khusus; menambahkan 'dan' atau 'tetapi' dapat terasa kurang alami atau terlalu kontras.
- source_word: φόβου αὐτοῦ
  choice: takut kepadanya
  rationale: Ungkapan ini mempertahankan rasa takut serta objek personalnya. Kata ganti tersebut paling wajar merujuk kepada malaikat dalam ayat sebelumnya.
- source_word: ἐσείσθησαν
  choice: gemetar
  rationale: Bentuk pasif dari σείω secara harfiah dapat berarti 'diguncangkan', tetapi dalam konteks reaksi jasmani karena takut, 'gemetar' merupakan padanan idiomatis dan tepat.
- source_word: οἱ τηροῦντες
  choice: para penjaga itu
  rationale: Secara harfiah berarti 'orang-orang yang berjaga'. Dalam konteks makam, 'para penjaga itu' ringkas, jelas, dan mempertahankan fungsi substantival partisip tersebut.
- source_word: ἐγενήθησαν
  choice: menjadi
  rationale: γίνομαι menunjukkan perubahan keadaan, sehingga 'menjadi' lebih tepat daripada sekadar 'seperti orang mati' tanpa verba perubahan.
- source_word: ὡς νεκροί
  choice: seperti orang mati
  rationale: ὡς menyatakan perbandingan, bukan bahwa mereka sungguh-sungguh mati. 'Orang mati' alami dalam bahasa Indonesia dan tidak perlu secara eksplisit menandai gender para penjaga.
theological_decisions:
- issue: Rujukan αὐτοῦ ('-nya')
  choice: Kata ganti diterjemahkan 'kepadanya' dan dipahami paling mungkin merujuk kepada malaikat dalam ayat sebelumnya.
  alternative: Kata ganti dapat dipahami lebih umum sebagai merujuk kepada peristiwa surgawi secara keseluruhan.
  rationale: Tokoh terdekat yang menjadi anteseden ialah malaikat yang penampilannya digambarkan dalam ayat sebelumnya. Terjemahan mempertahankan kata ganti dan tidak menggantinya dengan 'malaikat', sehingga bentuk teks sumber serta sedikit ruang ambiguitas tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kausal ditempatkan di awal mengikuti penekanan teks Yunani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
