base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: id
  text: Namun malaikat itu menjawab dan berkata kepada para perempuan itu, “Kalian jangan takut[a], sebab aku tahu bahwa kalian mencari Yesus yang telah disalibkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani menyebutkan kata ganti “kalian” secara eksplisit untuk memberi penekanan: kata-kata penghiburan ini secara khusus ditujukan kepada para perempuan itu.'
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih ringkas, “Yesus, Sang Tersalib” atau “Yesus yang disalibkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Namun ... berkata
  rationale: Rumus naratif Yunani ‘menjawab dan berkata’ bersifat idiomatis. Dalam bahasa Indonesia modern, ‘berkata’ menyampaikan fungsi pengantar ujaran secara alami, sedangkan ‘Namun’ mempertahankan peralihan ringan yang ditandai δέ.
- source_word: ὁ ἄγγελος
  choice: malaikat itu
  rationale: Dalam konteks kebangkitan ini, ἄγγελος menunjuk kepada makhluk surgawi; bentuk definit ‘itu’ sesuai dengan artikel Yunani dan konteks sebelumnya.
- source_word: ταῖς γυναιξίν
  choice: kepada perempuan-perempuan itu
  rationale: Bentuk jamak γυναιξίν menunjuk kepada para perempuan yang hadir, bukan khusus kepada para istri. Pengulangan ‘perempuan’ merupakan bentuk jamak baku dan mudah dipahami.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Kalian jangan takut
  rationale: ‘Jangan takut’ adalah ungkapan penguatan yang alami. ‘Kalian’ membuat sasaran jamaknya eksplisit dan, dengan ditempatkan di awal, membantu mencerminkan penekanan pada ὑμεῖς tanpa menghasilkan susunan yang janggal.
- source_word: οἶδα γὰρ ὅτι
  choice: sebab aku tahu bahwa
  rationale: γάρ memberikan alasan bagi larangan untuk takut; ‘sebab’ mempertahankan hubungan penjelasannya, sedangkan ὅτι secara wajar diterjemahkan ‘bahwa’.
- source_word: Ἰησοῦν ... ζητεῖτε
  choice: kalian mencari Yesus
  rationale: ‘Mencari’ merupakan padanan langsung dan alami bagi ζητεῖτε dalam konteks para perempuan yang datang untuk menemukan Yesus.
- source_word: τὸν ἐσταυρωμένον
  choice: yang telah disalibkan
  rationale: Partisipel perfektif pasif menunjuk kepada tindakan penyaliban yang sudah selesai dengan keadaan yang tetap relevan. ‘Telah disalibkan’ mempertahankan unsur tersebut dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penekanan pada pronomina eksplisit ὑμεῖς
  choice: Dinyatakan sebagai ‘Kalian jangan takut’ dan dijelaskan dalam catatan kaki.
  alternative: ‘Jangan takut’ atau ‘Kalian sendiri jangan takut.’
  rationale: Bahasa Yunani menampilkan ὑμεῖς secara eksplisit dan dengan demikian memberi penekanan khusus kepada para perempuan. Susunan terpilih mempertahankan penekanan itu tanpa menentukan secara berlebihan siapa yang dikontraskan dengan mereka.
- issue: Nuansa partisipel perfektif τὸν ἐσταυρωμένον
  choice: ‘Yesus yang telah disalibkan’
  alternative: ‘Yesus yang disalibkan’ atau ‘Yesus, Dia yang tersalib.’
  rationale: Pilihan ini mempertahankan tindakan yang telah selesai dan relevansinya yang berlanjut, tanpa menambahkan penafsiran teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. ‘Kalian’ dipakai karena ujaran ditujukan kepada lebih dari satu perempuan dan memungkinkan penekanan pronominal Yunani terdengar alami. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
