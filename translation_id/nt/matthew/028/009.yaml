  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: id
  text: Dan lihatlah, Yesus menemui mereka dan berkata, “Salam!”[a] Lalu mereka mendekat, memegang kaki-Nya, dan menyembah-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Yunani χαίρετε dapat diterjemahkan “Bersukacitalah!” Namun, dalam konteks ini kata tersebut digunakan sebagai salam.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersujud di hadapan-Nya” atau “memberi hormat kepada-Nya.” Kata Yunani προσεκύνησαν dapat menyatakan tindakan bersujud, memberi hormat, atau menyembah; dalam konteks kebangkitan ini, “menyembah” kemungkinan paling tepat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan daya hidup narasi tanpa menghilangkan penanda wacana Yunani.
- source_word: ὑπήντησεν
  choice: bertemu dengan
  rationale: Secara alami menyatakan bahwa Yesus berjumpa dengan mereka, tanpa menambahkan arah atau maksud yang tidak dinyatakan secara eksplisit.
- source_word: Χαίρετε
  choice: Salam!
  rationale: Walaupun secara bentuk merupakan imperatif jamak dari χαίρω, dalam konteks ini kata tersebut berfungsi sebagai salam konvensional.
- source_word: προσελθοῦσαι
  choice: mendekat
  rationale: Menunjukkan gerakan para perempuan menuju Yesus sebelum tindakan-tindakan berikutnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: memegang kaki-Nya
  rationale: Menyampaikan kontak fisik yang nyata dan pegangan yang kuat tanpa nuansa keras yang dapat ditimbulkan oleh pilihan seperti 'mencengkeram'.
- source_word: προσεκύνησαν αὐτῷ
  choice: menyembah-Nya
  rationale: Dalam konteks penampakan Yesus sesudah kebangkitan, pilihan ini menyampaikan bobot religius tindakan tersebut, sementara kemungkinan makna bersujud atau memberi hormat tetap dicatat.
theological_decisions:
- issue: Makna προσκυνέω yang ditujukan kepada Yesus yang telah bangkit
  choice: menyembah-Nya
  alternative: bersujud di hadapan-Nya / memberi hormat kepada-Nya
  rationale: Konteks kebangkitan dan penggambaran Yesus dalam Injil Matius mendukung makna penyembahan, tetapi cakupan leksikal kata Yunani juga dapat menunjuk pada sikap bersujud atau penghormatan; ketegangan ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Lihatlah” mempertahankan penarik perhatian dalam narasi, sedangkan “Salam!” memakai ungkapan sosial yang alami. Bentuk pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
