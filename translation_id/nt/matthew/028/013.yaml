  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: id
  text: seraya berkata, “Katakanlah, ‘Murid-murid-Nya datang pada malam hari[a] dan mencuri-Nya[b] ketika kami sedang tidur.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu malam”. Bentuk Yunani νυκτός dipakai secara adverbial untuk menunjukkan waktu kedatangan mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Dia”, bukan “tubuh-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: seraya berkata
  rationale: Partisipel kini ini memperkenalkan isi instruksi dan berkaitan dengan tindakan pada ayat sebelumnya. “Seraya berkata” mempertahankan bentuk penghubung tanpa menambahkan subjek baru.
- source_word: Εἴπατε
  choice: Katakanlah
  rationale: Imperatif aoris orang kedua jamak ini merupakan perintah langsung. Bahasa Indonesia tidak menandai jumlah pada bentuk imperatif, dan konteks menunjukkan bahwa perintah ditujukan kepada para penjaga.
- source_word: ὅτι
  choice: ditampilkan melalui tanda petik langsung
  rationale: Kata ini memperkenalkan isi perkataan. Dalam bahasa Indonesia, fungsinya wajar dinyatakan dengan susunan kutipan langsung tanpa menambahkan “bahwa”.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Murid-murid-Nya
  rationale: Konstruksi posesif diterjemahkan secara alami dan jelas, dengan bentuk ulang untuk menyatakan jamak.
- source_word: νυκτὸς
  choice: pada malam hari
  rationale: Genitif adverbial ini menunjukkan waktu kedatangan mereka. “Pada malam hari” merupakan padanan modern dan alami.
- source_word: ἐλθόντες
  choice: datang
  rationale: Partisipel aoris menunjukkan tindakan yang mendahului pencurian. Rangkaian “datang ... dan mencuri” menyampaikannya dengan alami dalam bahasa Indonesia.
- source_word: ἔκλεψαν
  choice: mencuri
  rationale: Padanan langsung bagi verba aoris aktif yang menyatakan tindakan pencurian.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk langsung kepada Yesus. Terjemahan mempertahankan pronomina personal dan tidak menambahkan penafsiran “tubuh-Nya”.
- source_word: ἡμῶν κοιμωμένων
  choice: ketika kami sedang tidur
  rationale: Konstruksi genitif absolut ini menyatakan keadaan yang berlangsung pada waktu tindakan tersebut. Bentuk ini jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Acuan αὐτόν dalam laporan rekaan tersebut
  choice: Mempertahankan pronomina personal “Dia”
  alternative: “tubuh-Nya”
  rationale: Teks Yunani memakai pronomina personal αὐτόν, bukan kata untuk “tubuh”. Konteks sudah memperjelas acuannya, sehingga penjelasan interpretatif tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Seraya berkata” mempertahankan hubungan partisipial dengan ayat sebelumnya; kutipan bertingkat dipakai agar perintah dan laporan rekaan tetap jelas. Kapitalisasi pronomina mengikuti kebiasaan umum bahasa Indonesia untuk rujukan kepada Yesus tanpa mengubah makna leksikal teks Yunani.
