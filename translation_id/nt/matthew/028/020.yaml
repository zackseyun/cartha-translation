  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: id
  text: dan mengajar mereka untuk menaati segala sesuatu yang telah Kuperintahkan kepadamu. Dan ketahuilah, Aku menyertai kamu setiap hari sampai kesudahan zaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai akhir zaman.” Secara tradisional diterjemahkan “sampai akhir dunia.” Kata Yunani αἰών menunjuk pada suatu zaman atau kurun, bukan secara khusus dunia fisik.
    reason: Menjelaskan kemungkinan terjemahan frasa συντελείας τοῦ αἰῶνος dan mencegah αἰών disamakan begitu saja dengan dunia fisik.
lexical_decisions:
- source_word: διδάσκοντες
  choice: mengajar
  rationale: Partisipel kini ini melanjutkan cara menjadikan murid pada ayat sebelumnya. Bentuk “mengajar” langsung, alami, dan tetap menyiratkan kegiatan yang berkelanjutan.
- source_word: τηρεῖν
  choice: untuk menaati
  rationale: Dalam konteks perintah, τηρέω berarti memelihara atau menjalankan dengan taat. “Menaati” menyampaikan tuntutan praktisnya dengan jelas tanpa mereduksinya menjadi pengetahuan semata.
- source_word: πάντα ὅσα
  choice: segala sesuatu yang
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari frasa Yunani dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐνετειλάμην
  choice: telah Kuperintahkan
  rationale: ἐντέλλομαι menyatakan pemberian perintah yang berwibawa. “Telah Kuperintahkan” juga menandai tindakan lampau yang menjadi dasar pengajaran berikutnya.
- source_word: ἰδοὺ
  choice: ketahuilah
  rationale: ἰδού menarik perhatian secara tegas dan khidmat. “Ketahuilah” lebih alami daripada terjemahan harfiah visual seperti “lihatlah” dalam konteks janji ini.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Aku menyertai kamu
  rationale: Frasa ini menyatakan kehadiran Yesus bersama para murid. “Menyertai kamu” merupakan ungkapan Indonesia yang alami dan mempertahankan sifat relasional janji tersebut.
- source_word: πάσας τὰς ἡμέρας
  choice: setiap hari
  rationale: Secara harfiah berarti “seluruh hari-hari.” “Setiap hari” mempertahankan nuansa kehadiran dari hari ke hari, bukan sekadar gagasan umum “selalu.”
- source_word: συντελείας
  choice: kesudahan
  rationale: συντέλεια menunjuk pada tercapainya penutup atau penggenapan suatu rentang. “Kesudahan” mempertahankan nuansa eskatologis itu dengan bahasa yang khidmat dan mudah dikenali.
- source_word: αἰῶνος
  choice: zaman ini
  rationale: αἰών menunjuk pada zaman atau kurun, bukan secara khusus dunia fisik. “Zaman ini” menyampaikan rujukan kontekstual kepada zaman yang sedang berlangsung.
theological_decisions:
- issue: Makna temporal ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: sampai kesudahan zaman ini
  alternative: sampai akhir zaman; secara tradisional, sampai akhir dunia
  rationale: Terjemahan utama mempertahankan gabungan makna συντέλεια sebagai kesudahan atau penuntasan dan αἰών sebagai zaman. Terjemahan ini tidak menyimpulkan bahwa yang dimaksud secara khusus adalah kebinasaan dunia fisik.
- issue: Sifat janji μεθ’ ὑμῶν εἰμι
  choice: Aku menyertai kamu
  alternative: Aku ada bersama kamu
  rationale: “Menyertai” menyatakan kehadiran yang aktif tanpa menetapkan cara atau bentuk kehadiran itu, sehingga ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan Alkitab bahasa Indonesia. Bentuk “Kuperintahkan” ringkas dan alami; “kesudahan” dipertahankan karena nuansa eskatologisnya, sedangkan catatan kaki menyediakan padanan yang lebih umum.
