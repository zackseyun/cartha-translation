id: MAT.28.17
reference: Matthew 28:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: id
  text: Ketika melihat Dia, mereka menyembah-Nya, tetapi beberapa orang ragu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bimbang” atau “ragu-ragu.” Kata Yunani ini dapat menunjukkan ketidakpastian, bukan ketidakpercayaan yang menetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika melihat
  rationale: Partisip aoris ἰδόντες dipahami secara temporal dalam hubungannya dengan verba utama; bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan urutan waktu yang terlalu tegas.
- source_word: προσεκύνησαν
  choice: menyembah-Nya
  rationale: Dalam konteks penampakan Yesus yang telah bangkit, προσκυνέω paling tepat menyatakan penyembahan, sambil tetap mengandung latar tindakan bersujud atau memberi hormat.
- source_word: οἱ δὲ
  choice: tetapi beberapa orang
  rationale: Frasa eliptis dan kontras ini paling wajar dipahami sebagai sebagian dari kelompok yang baru disebut, bukan seluruh kelompok.
- source_word: ἐδίστασαν
  choice: ragu
  rationale: διστάζω dapat menyatakan keraguan, kebimbangan, atau keragu-raguan untuk bertindak. 'Ragu' ringkas dan alami, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna προσκυνέω yang ditujukan kepada Yesus yang bangkit
  choice: menyembah-Nya
  alternative: bersujud kepada-Nya; memberi hormat kepada-Nya
  rationale: Konteks kebangkitan dan arah tindakan kepada Yesus mendukung makna penyembahan, tanpa perlu meniadakan dimensi jasmani berupa sujud.
- issue: Nuansa διστάζω
  choice: ragu
  alternative: bimbang; ragu-ragu
  rationale: Teks menyandingkan penyembahan dengan keraguan tanpa menjelaskan sifat atau kadarnya. Terjemahan utama mempertahankan ketegangan itu, dan catatan kaki menunjukkan bahwa yang dimaksud dapat berupa kebimbangan, bukan ketidakpercayaan yang menetap.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia; tanda catatan kaki ditempatkan langsung setelah klausa yang diterangkannya.
