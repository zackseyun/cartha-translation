  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: id
  text: Kesebelas murid itu pergi ke Galilea, ke gunung yang telah Yesus tetapkan untuk mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung yang telah Yesus tunjukkan kepada mereka” atau “gunung yang telah Yesus tetapkan bagi mereka.” Kata kerja Yunani dapat berarti menetapkan, menentukan, mengatur, atau mengarahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan dalam peralihan narasi. Alur bahasa Indonesia sudah alami tanpa menambahkan “kemudian” atau “adapun,” yang dapat memberi nuansa temporal atau kontras lebih kuat daripada teks Yunani.
- source_word: ἕνδεκα μαθηταὶ
  choice: kesebelas murid itu
  rationale: “Murid” adalah istilah baku dan alami untuk μαθητής dalam kisah Injil; “kesebelas” mempertahankan penyebutan khusus kelompok tersebut setelah Yudas tidak lagi bersama mereka.
- source_word: ἐπορεύθησαν
  choice: pergi
  rationale: πορεύομαι dalam konteks ini menyatakan gerak menuju suatu tempat. “Pergi” paling alami dan cukup tepat tanpa meninggikan ragam bahasa secara tidak perlu.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: εἰς menyatakan arah atau tujuan; “ke Galilea” merupakan ungkapan Indonesia yang wajar.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung
  rationale: ὄρος berarti gunung atau kawasan perbukitan. Dengan artikel dan klausa penjelas sesudahnya, ungkapan ini menunjuk pada gunung tertentu; “gunung” mempertahankan arti leksikal dan gema naratif Matius.
- source_word: οὗ
  choice: yang
  rationale: Dalam susunan bahasa Indonesia, hubungan tempat yang dinyatakan οὗ disampaikan secara alami melalui “gunung yang telah ... tentukan,” tanpa perlu memakai bentuk kaku “di mana.”
- source_word: ἐτάξατο
  choice: telah ... tentukan
  rationale: τάσσω dalam bentuk tengah dapat berarti menetapkan, menentukan, mengatur, atau mengarahkan. “Tentukan” menyampaikan bahwa Yesus sebelumnya telah menetapkan lokasi itu, tanpa memberi kesan pengangkatan jabatan atau struktur resmi.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Datif αὐτοῖς secara alami diterjemahkan “bagi mereka” dalam konstruksi Indonesia ini dan mempertahankan hubungan antara penentuan tempat dan para murid.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat penentuan tempat oleh Yesus
  choice: “yang telah Yesus tentukan bagi mereka”
  alternative: “yang telah Yesus perintahkan kepada mereka” atau “yang telah Yesus tetapkan bagi mereka”
  rationale: Konteksnya menunjukkan penentuan lokasi sebelumnya. Terjemahan utama tidak mengubah tindakan itu menjadi pengangkatan resmi atau perintah yang bernuansa lebih kuat, sementara keluasan makna kata Yunani dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. Bentuk “kesebelas murid itu” alami dalam narasi, sedangkan pengulangan “ke” mempertahankan struktur tujuan umum lalu lokasi khusus dalam teks Yunani.
