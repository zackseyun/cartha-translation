id: MAT.14.13
reference: Matthew 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: id
  text: Setelah mendengar hal itu, Yesus pergi dari sana dengan perahu menuju suatu tempat terpencil[a] secara tersendiri. Ketika orang banyak mendengar hal itu, mereka mengikuti-Nya dengan berjalan kaki dari kota-kota[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat yang sunyi” atau “tempat yang sepi.” Kata Yunani ini menunjuk pada daerah yang terasing atau tidak berpenghuni, bukan selalu gurun pasir.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari kota-kota kecil.” Kata Yunani yang dipakai dapat berarti kota atau kota kecil, bergantung pada konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Setelah mendengar hal itu
  rationale: Partisip aoris diterjemahkan sebagai tindakan yang mendahului tindakan utama. δέ menandai perkembangan narasi dan tidak perlu diberi kontras kuat.
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: Kata ini menyatakan pergi atau mengundurkan diri dari suatu tempat, sering sebagai tanggapan terhadap keadaan; “menyingkir” mempertahankan nuansa itu secara alami.
- source_word: ἐν πλοίῳ
  choice: dengan perahu
  rationale: Ungkapan ini menyatakan sarana perjalanan dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: εἰς ἔρημον τόπον
  choice: ke tempat yang sunyi
  rationale: ἔρημος di sini menunjuk pada tempat terpencil atau tidak berpenghuni, bukan harus berupa gurun pasir.
- source_word: κατ’ ἰδίαν
  choice: untuk menyendiri
  rationale: Dalam konteks gerak menuju tempat terpencil, frasa ini secara alami menyatakan bahwa Yesus pergi secara tersendiri atau mencari keadaan tanpa orang lain.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan Indonesia ini lazim untuk kelompok besar dan tidak memaksakan makna teknis pada bentuk jamak Yunani.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mereka mengikuti-Nya
  rationale: Menyampaikan tindakan mengikuti secara harfiah tanpa menambahkan pengertian pemuridan yang tidak dinyatakan secara khusus dalam konteks ini.
- source_word: πεζῇ
  choice: dengan berjalan kaki
  rationale: Menyatakan perjalanan melalui darat dengan kaki, berlawanan dengan perjalanan Yesus menggunakan perahu.
- source_word: ἀπὸ τῶν πόλεων
  choice: dari kota-kota
  rationale: πόλις dapat menunjuk kota maupun permukiman perkotaan yang lebih kecil; “kota-kota” merupakan padanan umum yang tidak terlalu menentukan ukurannya.
theological_decisions:
- issue: Alasan Yesus menyingkir
  choice: Tindakan diterjemahkan secara netral sebagai “menyingkir” tanpa menyatakan motif tertentu.
  alternative: Menafsirkan bahwa Yesus mundur demi keselamatan, berkabung, atau berdoa.
  rationale: Ayat menghubungkan tindakan Yesus dengan apa yang didengar-Nya dan menyebut tujuan-Nya untuk menyendiri, tetapi tidak menjelaskan motif itu secara tegas.
- issue: Isi yang didengar orang banyak
  choice: “mendengar hal itu” mempertahankan rujukan kontekstual yang tidak dijabarkan dalam klausa Yunani.
  alternative: Menentukan secara eksplisit bahwa mereka mendengar kepergian atau lokasi Yesus.
  rationale: Partisip ἀκούσαντες tidak menyebut objek secara eksplisit; terjemahan tidak boleh mengunci satu rujukan yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menolong-Nya” tidak digunakan; kapital pada pronomina “-Nya” mengikuti kebiasaan ejaan religius Indonesia. Penanda catatan kaki ditempatkan langsung pada kata yang dijelaskannya.
