  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: id
  text: Meskipun ia ingin membunuhnya, ia takut kepada orang banyak, sebab mereka menganggapnya seorang nabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: meskipun ia ingin
  rationale: 'Partisip ini secara bentuk berarti ''ingin'', tetapi dalam konteks berhubungan secara konsesif dengan verba utama: keinginannya berlawanan dengan tindakannya karena rasa takut. ''Meskipun'' menyatakan hubungan itu secara alami dalam bahasa Indonesia.'
- source_word: ἀποκτεῖναι
  choice: membunuh
  rationale: Padanan langsung dan wajar untuk tindakan menghilangkan nyawa; 'menghukum mati' akan menambahkan unsur proses hukum yang tidak dinyatakan oleh verba Yunani.
- source_word: ἐφοβήθη
  choice: ia takut kepada
  rationale: Menyampaikan arti aoris deponen φοβέομαι secara lugas dan idiomatis.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: ὄχλος menunjuk kepada kumpulan orang. 'Orang banyak' alami dalam ragam Alkitab Indonesia yang tetap mudah dipahami dan tidak menyiratkan kerumunan yang kebetulan semata.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan ketakutannya dengan jelas dan sesuai dengan ragam naratif yang bermartabat.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: mereka menganggap orang itu seorang nabi
  rationale: Konstruksi ἔχω dengan predikat akusatif menyatakan penilaian atau anggapan. Pengulangan 'orang itu' menghindari rangkaian pronomina Indonesia yang berpotensi kabur tanpa memasukkan nama yang tidak terdapat dalam ayat.
theological_decisions:
- issue: Identitas subjek dan objek dinyatakan dengan pronomina dalam teks Yunani
  choice: Mempertahankan 'ia' untuk subjek dan memakai 'orang itu' pada penyebutan objek berikutnya demi kejelasan rujukan
  alternative: Menyebut nama Herodes dan Yohanes secara eksplisit
  rationale: Konteks langsung mengidentifikasi Herodes dan Yohanes, tetapi ayat Yunani sendiri memakai pronomina. Terjemahan ini tidak menambahkan nama, sekaligus mencegah kekaburan rujukan dalam bahasa Indonesia.
- issue: Hubungan partisip θέλων dengan verba utama ἐφοβήθη
  choice: 'Menerjemahkannya secara konsesif: ''Meskipun ia ingin'''
  alternative: 'Secara lebih harfiah: ''Karena ingin'' atau ''Dengan ingin'''
  rationale: Konteks menunjukkan bahwa rasa takut menghalangi kehendaknya untuk membunuh. Bentuk konsesif membuat hubungan sintaksis tersirat itu alami tanpa mengubah isi pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan 'sebab' sebagai penghubung alasan dan tanpa istilah denominasi.
