  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: id
  text: Sebab Yohanes terus berkata kepadanya, “Engkau tidak diperbolehkan memperistri dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: telah berulang kali berkata
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang pada masa lampau; ungkapan ini menyampaikan daya duratif tersebut secara alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan latar penjelas bagi tindakan Herodes dalam konteks sebelumnya.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus dengan λέγω menandai orang yang menjadi sasaran perkataan Yohanes.
- source_word: ὁ Ἰωάννης
  choice: Yohanes
  rationale: Teks Yunani hanya menyebut nama Yohanes; konteks langsung sudah mengidentifikasinya.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Engkau tidak boleh
  rationale: ἔξεστιν menyatakan apa yang diizinkan atau sah. 'Tidak boleh' menyampaikan larangan hukum-moral secara wajar tanpa mengurangi ketegasannya.
- source_word: ἔχειν αὐτήν
  choice: mengambil perempuan itu sebagai istrimu
  rationale: Dalam konteks ini, ἔχειν menunjuk pada memiliki perempuan tersebut dalam hubungan perkawinan. Terjemahan eksplisit ini mencegah ungkapan 'memiliki dia' terdengar tidak alami atau sekadar menyatakan kepemilikan dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat teguran Yohanes
  choice: 'Diterjemahkan sebagai larangan hukum-moral yang tegas: ''Engkau tidak boleh mengambil perempuan itu sebagai istrimu.'''
  alternative: '''Tidak sah bagimu untuk memperistri dia.'''
  rationale: ἔξεστιν berkenaan dengan izin atau keabsahan, dan konteksnya adalah hubungan Herodes dengan Herodias. Pilihan ini mempertahankan daya larangan tanpa menambahkan rujukan hukum yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Makna hubungan dalam ἔχειν αὐτήν
  choice: Makna perkawinan dibuat eksplisit dengan 'sebagai istrimu'.
  alternative: Terjemahan lebih harfiah 'memiliki dia'.
  rationale: Konteks ayat 3 menunjukkan bahwa Herodes telah mengambil Herodias, istri saudaranya. Dalam bahasa Indonesia, 'memiliki dia' berpotensi mengaburkan makna relasional yang dimaksud oleh ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan fungsi penjelas γάρ, sedangkan aspek imperfek dinyatakan dengan 'telah berulang kali'. Sapaan 'engkau' sesuai dengan teguran langsung dalam register Alkitab yang tetap mudah dipahami.
