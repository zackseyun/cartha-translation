  terminology: “Murid-murid,” “orang banyak,” “desa-desa,” dan “makanan” sesuai register Alkitab Indonesia modern serta makna sumber. “Terpencil” secara aman menggambarkan ἔρημος dalam konteks lokasi jauh dari permukiman. Catatan kaki mempertahankan alternatif leksikal dan penanda ditempatkan pada frasa yang dijelaskan.
