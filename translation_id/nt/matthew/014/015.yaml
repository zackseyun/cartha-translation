id: MAT.14.15
reference: Matthew 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: id
  text: Menjelang petang, murid-murid datang kepada-Nya dan berkata, “Tempat ini terpencil,[a] dan hari sudah larut.[b] Suruhlah orang banyak itu pergi agar mereka dapat pergi ke desa-desa untuk membeli makanan bagi diri mereka sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tempat ini sunyi dan tidak berpenghuni.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “waktunya sudah lewat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Ketika hari mulai malam
  rationale: Konstruksi genitif absolut menandai peralihan waktu. Ungkapan ini alami dalam narasi Indonesia dan mempertahankan makna datangnya petang; δέ berfungsi sebagai penghubung perkembangan narasi dan tidak perlu diterjemahkan dengan kata tersendiri.
- source_word: προσῆλθον αὐτῷ
  choice: datang kepada-Nya
  rationale: προσέρχομαι berarti datang kepada atau mendekati; pilihan ini alami dan tetap dekat dengan bentuk sumber.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk kepada kelompok murid yang sudah dikenal dari konteks. Bahasa Indonesia tidak memerlukan penambahan kata milik seperti “murid-murid-Nya”.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Tempat ini terpencil
  rationale: ἔρημος di sini menggambarkan lokasi yang jauh dari permukiman atau tidak berpenghuni. “Terpencil” menyampaikan keadaan praktis tempat itu tanpa mengesankan bahwa tempat tersebut sebelumnya dihuni lalu ditinggalkan.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: hari sudah larut
  rationale: Secara harfiah frasa ini menyatakan bahwa waktunya telah lewat, tetapi dalam konteks merupakan ungkapan bahwa hari telah larut. Terjemahan utama dibuat idiomatis, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Suruhlah orang banyak itu pergi
  rationale: ἀπολύω dalam konteks ini berarti menyuruh pergi atau membubarkan. Bentuk ini jelas, wajar, dan mempertahankan permintaan imperatif para murid.
- source_word: ἵνα ἀπελθόντες
  choice: supaya mereka dapat pergi
  rationale: Partisip yang diikuti klausa ἵνα menyatakan tindakan yang dimaksudkan. Susunan ini mengungkapkan tujuan secara alami dalam bahasa Indonesia.
- source_word: εἰς τὰς κώμας
  choice: ke desa-desa
  rationale: κώμη berarti desa. Kata “dekat” tidak ditambahkan karena hanya tersirat oleh konteks dan tidak dinyatakan dalam teks Yunani.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: membeli makanan bagi diri mereka sendiri
  rationale: βρώματα berarti makanan, dan frasa “bagi diri mereka sendiri” mempertahankan penekanan refleksif ἑαυτοῖς.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya; ini memperbaiki ketidaksesuaian posisi penanda pada lapisan konsultasi Inggris.
