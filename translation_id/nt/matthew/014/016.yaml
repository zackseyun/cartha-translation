  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: id
  text: Tetapi Yesus berkata kepada mereka, “Mereka tidak perlu pergi; kalian sendiri, berilah mereka sesuatu untuk dimakan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka tidak perlu pergi; kalian sendiri, berilah mereka makanan.”
    reason: Alternatif leksikal yang memakai “makanan” alih-alih “sesuatu untuk dimakan”, sambil mempertahankan perintah dan penekanan pada kalian.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan usul para murid agar orang banyak pergi, sekaligus tetap mengalir sebagai narasi.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Padanan langsung dan wajar untuk pengantar ujaran dalam narasi.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Mereka tidak perlu pergi
  rationale: Mengungkapkan idiom ἔχω χρείαν secara alami dalam bahasa Indonesia dan mempertahankan acuan kepada orang banyak.
- source_word: δότε αὐτοῖς
  choice: berilah mereka
  rationale: Bentuk imperatif diterjemahkan sebagai perintah langsung; akhiran -lah memberi nuansa perintah yang tegas tetapi wajar.
- source_word: ὑμεῖς
  choice: Kalian sendiri
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Yunani bersifat emfatis; 'kalian sendiri' mempertahankan penekanan pada para murid sebagai pelaku.
- source_word: φαγεῖν
  choice: makan
  rationale: Dalam konstruksi dengan 'berilah mereka', infinitif ini secara idiomatis menghasilkan ungkapan Indonesia 'berilah mereka makan' tanpa perlu menambahkan objek yang tidak dinyatakan.
theological_decisions:
- issue: Penekanan pada peran para murid dalam perintah Yesus
  choice: Menerjemahkan ὑμεῖς secara emfatis sebagai 'Kalian sendiri'
  alternative: Menerjemahkannya hanya sebagai 'kalian'
  rationale: Pilihan ini mempertahankan tantangan langsung Yesus kepada para murid sebagaimana ditandai oleh pronomina Yunani yang eksplisit, tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai karena Yesus berbicara kepada lebih dari satu murid; 'berilah' mempertahankan bentuk perintah, sedangkan 'kalian sendiri' menjaga penekanan Yunani.
