    rationale: Walaupun “berilah mereka makan” dapat diterima, “berilah mereka sesuatu untuk dimakan” lebih jelas menyatakan makna idiomatis δότε αὐτοῖς ... φαγεῖν dan selaras dengan cakupan semantis teks sumber.
