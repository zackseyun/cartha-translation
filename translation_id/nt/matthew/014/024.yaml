  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: id
  text: Namun, perahu itu sudah berjarak banyak stadia[b] dari daratan[a] dan dihantam gelombang[c], sebab angin berlawanan dengan arah perahu itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari pantai”. Secara harfiah, teks Yunani berbunyi “dari daratan”.
    reason: lexical_alternative
  - marker: b
    text: Satu stadion adalah satuan jarak kuno, kira-kira 185 meter.
    reason: cultural_note
  - marker: c
    text: Atau “diombang-ambingkan oleh gelombang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: perahu
  rationale: Dalam konteks penyeberangan Danau Galilea, “perahu” merupakan padanan modern yang paling wajar dan tidak memberi kesan kapal berukuran besar.
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa keadaan ini telah terjadi pada titik tersebut dalam alur cerita.
- source_word: σταδίους πολλοὺς
  choice: banyak stadia
  rationale: Mempertahankan satuan jarak kuno dari teks Yunani; penjelasan ukuran diberikan dalam catatan kaki.
- source_word: ἀπὸ τῆς γῆς
  choice: dari daratan
  rationale: γῆ di sini menunjuk pada daratan yang berlawanan dengan perairan; “pantai” tetap mungkin secara kontekstual dan dicatat sebagai alternatif.
- source_word: ἀπεῖχεν
  choice: berjarak ... dari
  rationale: Mengungkapkan jarak ruang secara alami dalam bahasa Indonesia.
- source_word: βασανιζόμενον
  choice: dihantam
  rationale: Dalam konteks maritim, kata ini menggambarkan perahu yang mengalami tekanan keras akibat gelombang. “Dihantam” menyampaikan kekuatan fisiknya tanpa memasukkan nuansa psikologis dari arti harfiah “disiksa”.
- source_word: ὑπὸ τῶν κυμάτων
  choice: gelombang
  rationale: Padanan langsung dan wajar bagi κύματα dalam konteks perairan.
- source_word: ἐναντίος
  choice: dari arah yang berlawanan
  rationale: Menyatakan bahwa angin berlawanan dengan arah perjalanan perahu. Ungkapan ini alami dalam bahasa Indonesia, meskipun objek pertentangan dibiarkan tersirat dalam bahasa Yunani.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif sekaligus kontras ringan antara keadaan Yesus di darat dan kesulitan perahu.
- source_word: γάρ
  choice: sebab
  rationale: 'Mempertahankan hubungan penjelasan: angin yang berlawanan menerangkan mengapa perahu dihantam gelombang.'
theological_decisions: []
