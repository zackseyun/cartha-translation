  text: Ἐν ἐκείνῳ τῷ καιρῷ ἤκουσεν Ἡρῴδης ὁ τετραάρχης τὴν ἀκοὴν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: id
  text: Pada waktu itu, Herodes, sang tetrark, mendengar kabar tentang Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laporan tentang Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Pada waktu itu
  rationale: Ungkapan waktu ini diterjemahkan secara idiomatis dan alami dalam bahasa Indonesia sambil mempertahankan acuan temporal teks Yunani.
- source_word: ἤκουσεν
  choice: mendengar
  rationale: Bentuk aoris ἀκούω memiliki arti lugas 'mendengar'; pilihan ini tidak menambahkan gagasan interpretatif seperti 'mengetahui'.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Bentuk nama yang lazim digunakan dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ τετραάρχης
  choice: sang tetrark
  rationale: Istilah historis-politik yang khusus ini dipertahankan demi ketepatan, alih-alih diparafrasakan sebagai penguasa wilayah.
- source_word: τὴν ἀκοὴν
  choice: kabar
  rationale: Dalam konteks ini, ἀκοή menunjuk pada sesuatu yang didengar, yaitu kabar atau laporan, bukan kemampuan mendengar.
- source_word: Ἰησοῦ
  choice: tentang Yesus
  rationale: Genitif ini secara alami menyatakan isi atau pokok kabar dalam bahasa Indonesia.
