id: MAT.14.21
reference: Matthew 14:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: id
  text: Orang-orang yang makan itu berjumlah kira-kira lima ribu laki-laki, belum termasuk perempuan dan anak-anak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: selain perempuan dan anak-anak.'
    reason: Alternatif leksikal untuk χωρὶς yang tetap menyatakan bahwa mereka tidak termasuk dalam angka lima ribu.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Orang-orang yang makan itu
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk kepada mereka yang ikut makan. Bentuk ini wajar dalam bahasa Indonesia tanpa memaksakan nuansa aspek. Partikel δέ tidak perlu diterjemahkan dengan kata penghubung tersendiri karena peralihan narasinya sudah jelas dari konteks.
- source_word: ἦσαν
  choice: berjumlah
  rationale: Walaupun secara harfiah berarti 'adalah/berada', dalam pernyataan mengenai jumlah orang, 'berjumlah' merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἄνδρες
  choice: laki-laki
  rationale: Kata ini secara khusus menunjuk kepada orang berjenis kelamin laki-laki, bukan manusia secara umum. Pembedaan tersebut dipertahankan karena perempuan dan anak-anak disebut secara terpisah.
- source_word: ὡσεὶ
  choice: kira-kira
  rationale: Menandai perkiraan; 'kira-kira' adalah ungkapan baku dan alami untuk jumlah yang tidak persis.
- source_word: πεντακισχίλιοι
  choice: lima ribu
  rationale: Padanan langsung untuk bilangan kardinal tersebut.
- source_word: χωρὶς
  choice: belum termasuk
  rationale: Dengan bentuk genitif, kata ini menunjukkan bahwa perempuan dan anak-anak tidak termasuk dalam angka lima ribu. 'Belum termasuk' menyampaikan pengecualian dari hitungan secara jelas dan alami.
- source_word: γυναικῶν
  choice: perempuan
  rationale: Dalam konteks penghitungan orang tanpa acuan pada hubungan perkawinan, maknanya adalah 'perempuan', bukan 'istri'.
- source_word: παιδίων
  choice: anak-anak
  rationale: Padanan jamak yang alami dan tidak mempersempit makna menjadi hanya anak yang masih sangat kecil.
theological_decisions:
- issue: Istilah penghitungan khusus laki-laki di tengah kerumunan campuran
  choice: Menerjemahkan ἄνδρες sebagai 'laki-laki' dan mempertahankan bahwa perempuan serta anak-anak tidak termasuk dalam hitungan.
  alternative: Menerjemahkannya sebagai 'orang-orang' atau 'manusia'.
  rationale: Teks Yunani secara khusus menyebut orang laki-laki dan kemudian membedakan perempuan serta anak-anak. Padanan umum seperti 'orang-orang' akan menghapus rincian leksikal dan sosial-historis yang terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan 'berjumlah kira-kira' dipilih agar pernyataan jumlah terdengar alami, sementara 'laki-laki' mempertahankan ketepatan gender sumber. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
