  - severity: low
    issue: Rujukan "saudaranya" berpotensi kurang langsung.
    rationale: Walaupun secara sintaksis dapat mengacu kepada Herodes, "saudara Herodes" lebih jelas bagi pembaca Indonesia dan tetap setia kepada τοῦ ἀδελφοῦ αὐτοῦ.
