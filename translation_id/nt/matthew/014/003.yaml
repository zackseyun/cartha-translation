  source_fidelity: 'Makna pokok terpelihara: γάρ diterjemahkan dengan "Sebab," κρατήσας dipahami sebagai penangkapan, dan tindakan mengikat serta memenjarakan Yohanes diterjemahkan dengan tepat. Namun, "sebelumnya" menambahkan keterangan waktu yang tidak dinyatakan secara mandiri dalam teks Yunani. Partisip aoris memang menandai penangkapan sebagai tindakan pendahuluan terhadap pengikatan dan pemenjaraan, tetapi hal itu sudah cukup diungkapkan oleh "telah menangkap" dalam konteks kalimat Indonesia.'
  naturalness: Kalimatnya umumnya baku dan jelas. Menghapus "sebelumnya" membuatnya lebih ringkas dan lebih alami tanpa mengurangi urutan tindakan. Mengganti "saudaranya" dengan "saudara Herodes" menghilangkan kemungkinan rujukan pronominal yang sesaat ambigu dalam bahasa Indonesia.
  terminology: Nama-nama Herodes, Yohanes, Herodias, dan Filipus sudah sesuai pemakaian Alkitab bahasa Indonesia. "Istri," "mengikat," dan "memasukkannya ke dalam penjara" merupakan padanan modern-baku yang tepat. Frasa "saudara Herodes" mempertahankan fakta bahwa Filipus adalah saudara Herodes, tanpa menambahkan penilaian moral yang baru muncul dalam ayat berikutnya.
