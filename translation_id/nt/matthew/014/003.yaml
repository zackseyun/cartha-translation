id: MAT.14.3
reference: Matthew 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: id
  text: Sebab Herodes telah menangkap Yohanes, mengikatnya, dan memasukkannya ke dalam penjara karena Herodias, istri Filipus, saudara Herodes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan tindakan Herodes dengan konteks sebelumnya.
- source_word: κρατήσας
  choice: sebelumnya ... telah menangkap
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; 'menangkap' alami dalam konteks penahanan, sedangkan 'sebelumnya' memperjelas urutan tanpa mengubah makna.
- source_word: ἔδησεν
  choice: mengikatnya
  rationale: Menerjemahkan makna konkret δέω tanpa menentukan apakah ikatan itu berupa tali atau rantai.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: memasukkannya ke dalam penjara
  rationale: Ungkapan ini secara idiomatis menyatakan pemenjaraan; pilihan tersebut jelas dan alami dalam bahasa Indonesia modern.
- source_word: διὰ Ἡρῳδιάδα
  choice: karena Herodias
  rationale: διά dengan akusatif di sini menyatakan sebab atau alasan.
- source_word: γυναῖκα
  choice: istri
  rationale: Dalam hubungan dengan Filipus, γυνή bermakna 'istri', bukan sekadar 'perempuan'.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filipus, saudaranya
  rationale: Mempertahankan hubungan aposisional Yunani dan menunjukkan bahwa Filipus adalah saudara Herodes.
theological_decisions:
- issue: Pembingkaian historis-moral hubungan Herodias dengan Filipus
  choice: Herodias disebut secara netral sebagai 'istri Filipus, saudaranya'.
  alternative: istri saudaranya, Filipus
  rationale: Ayat ini mengidentifikasi hubungan Herodias dengan Filipus tanpa secara eksplisit menyatakan bahwa hubungan berikutnya dengan Herodes melanggar hukum; penilaian itu baru dinyatakan pada ayat selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, dengan rujukan pronomina 'saudaranya' tetap mengikuti struktur sumber dan mengacu kepada Herodes.
