  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: id
  text: Mereka semua makan sampai kenyang. Kemudian dikumpulkan dua belas keranjang yang penuh dengan potongan-potongan yang tersisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: makan
  rationale: Aoristus indikatif ἐσθίω menyatakan tindakan lampau dalam urutan narasi; bahasa Indonesia tidak memerlukan penandaan kala secara morfologis.
- source_word: πάντες
  choice: mereka semua
  rationale: Mengeksplisitkan subjek jamak yang tersirat dan mempertahankan cakupan universal πάντες secara alami.
- source_word: ἐχορτάσθησαν
  choice: sampai kenyang
  rationale: Bentuk pasif χορτάζω di sini berarti diberi makan hingga puas atau kenyang; ungkapan ini alami dan menyampaikan kecukupan penuh tanpa tafsiran tambahan.
- source_word: ἦραν
  choice: mengumpulkan
  rationale: Walaupun αἴρω secara dasar berarti mengangkat atau mengambil, konteks sisa makanan mendukung padanan kontekstual 'mengumpulkan'.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: potongan-potongan yang tersisa itu
  rationale: Mempertahankan pengertian sesuatu yang berlebih atau tersisa, dengan κλάσματα sebagai potongan-potongan, kemungkinan besar potongan roti, tanpa menambahkan kata 'roti' yang tidak eksplisit di ayat ini.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: sebanyak dua belas keranjang penuh
  rationale: Menyampaikan jumlah dan keadaan keranjang secara jelas; 'sebanyak' membantu menghubungkan ukuran hasil pengumpulan dengan dua belas keranjang penuh.
theological_decisions:
- issue: Bahasa tentang kenyang dalam kisah pemberian makan yang ajaib
  choice: sampai kenyang
  alternative: dipuaskan; makan sepuasnya
  rationale: Pilihan ini mempertahankan makna biasa bahwa semua orang memperoleh makanan yang cukup hingga kenyang, tanpa memperluasnya menjadi pernyataan teologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur dua klausa dipertahankan dengan 'lalu' untuk menunjukkan urutan narasi. Tidak diperlukan catatan kaki karena 'potongan-potongan yang tersisa' sudah mencakup nuansa κλάσματα secara cukup jelas.
