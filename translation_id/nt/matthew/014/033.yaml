base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: id
  text: Lalu orang-orang di perahu itu menyembah Dia[a] dan berkata, “Sungguh, Engkau adalah Anak Allah.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud kepada-Nya” atau “memberi hormat kepada-Nya.” Kata kerja Yunani ini dapat menunjuk pada penghormatan yang dinyatakan dengan berlutut atau bersujud; dalam konteks ini, “menyembah” paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Anak Allah.” Dalam bahasa Yunani, kata “Allah” tidak memakai artikel, tetapi dalam konteks ini frasa tersebut berfungsi sebagai gelar, bukan berarti hanya “seorang anak Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lalu orang-orang
  rationale: δέ merupakan penghubung ringan; “Lalu” menyatakan kelanjutan peristiwa secara alami tanpa memberi kesan pertentangan yang kuat. Artikel οἱ dipakai secara substantival untuk menunjuk orang-orang di dalam perahu.
- source_word: ἐν τῷ πλοίῳ
  choice: yang berada di dalam perahu itu
  rationale: πλοῖον berarti perahu; bentuk ini wajar dalam narasi Indonesia dan mempertahankan acuan pada perahu yang sudah diketahui dari konteks.
- source_word: προσεκύνησαν αὐτῷ
  choice: menyembah Dia
  rationale: προσκυνέω dapat berarti bersujud, memberi hormat, atau menyembah. Dalam konteks kuasa Yesus atas laut dan pengakuan yang langsung menyertainya, “menyembah” paling tepat, sementara kemungkinan gestur bersujud dicatat dalam catatan kaki.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini menyatakan tindakan ujaran yang menyertai tindakan sebelumnya. Dalam bahasa Indonesia, klausa koordinatif “dan berkata” lebih alami daripada bentuk harfiah “sambil mengatakan”.
- source_word: Ἀληθῶς
  choice: Sungguh
  rationale: Kata ini menandai penegasan yang kuat dan khidmat; “Sungguh” alami dalam pengakuan langsung serta mempertahankan bobot pernyataannya.
- source_word: θεοῦ υἱὸς
  choice: Anak Allah
  rationale: Walaupun θεοῦ tidak berartikel, susunan predikatif ini dalam konteks berfungsi sebagai gelar yang definit, bukan berarti sekadar salah satu anak ilahi. Dalam bahasa Indonesia, gelar baku “Anak Allah” sudah definit tanpa memerlukan kata sandang.
- source_word: εἶ
  choice: Engkau adalah
  rationale: Kopula Yunani dinyatakan secara eksplisit dengan “adalah”; “Engkau” mempertahankan ragam yang khidmat dan sesuai untuk sapaan langsung kepada Yesus.
theological_decisions:
- issue: Daya makna προσκυνέω yang ditujukan kepada Yesus
  choice: menyembah Dia
  alternative: bersujud kepada-Nya / memberi hormat kepada-Nya
  rationale: Rentang makna verba mencakup penghormatan dengan bersujud dan penyembahan. Konteks langsung—kuasa Yesus atas laut dan pengakuan sebagai Anak Allah—mendukung “menyembah”, tetapi ambiguitas leksikal yang nyata tetap dicantumkan dalam catatan kaki.
- issue: Ke definitan θεοῦ υἱὸς
  choice: Anak Allah
  alternative: seorang anak Allah
  rationale: Tidak adanya artikel dalam bahasa Yunani tidak dengan sendirinya menghasilkan makna indefinit. Dalam pengakuan ini, frasa tersebut berfungsi sebagai gelar kristologis; “seorang anak Allah” akan melemahkan daya ungkapan dalam konteks. Alternatif idiomatis “Putra Allah” tidak dipilih karena “Anak Allah” lebih umum dan jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dia” dan “Engkau” dipakai untuk keterbacaan dan nada penghormatan; susunan kalimat dibuat alami tanpa menghilangkan hubungan antara tindakan menyembah dan pengakuan lisan.
