  text: But he said[a], “Bring them here to me.”
translation:
  language: id
  text: Namun, Ia berkata[a], “Bawalah semuanya itu kemari kepada-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah roti dan ikan yang disebutkan dalam ayat sebelumnya.
