lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: δέ adalah penghubung ringan yang di sini menandai tanggapan yang berlawanan dengan keberatan para murid; “Namun” alami dan tidak terlalu tajam.
- source_word: εἶπεν
  choice: Ia berkata
  rationale: Bentuk aoris λέγω secara langsung berarti “berkata”; terjemahan ini tidak menambahkan nuansa perintah ke dalam verba pengantar.
- source_word: Φέρετέ
  choice: Bawalah
  rationale: Imperatif kini aktif orang kedua jamak dari φέρω menyatakan perintah kepada para murid untuk membawa benda-benda tersebut; “Bawalah” merupakan padanan Indonesia yang wajar.
- source_word: μοι
  choice: kepada-Ku
  rationale: Pronomina datif ini menunjukkan arah atau penerima tindakan, yang secara alami diterjemahkan “kepada-Ku”.
- source_word: ὧδε
  choice: kemari
  rationale: ὧδε menunjukkan tempat, “di sini/ke sini”; bersama verba gerak, “kemari” secara idiomatis menyampaikan arah menuju tempat Yesus berada.
- source_word: αὐτούς
  choice: semuanya itu
  rationale: Pronomina maskulin jamak ini secara kontekstual merujuk kepada roti dan ikan pada ayat sebelumnya. “Semuanya itu” mempertahankan rujukan pronominal sekaligus terdengar alami untuk dua jenis benda yang disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk “Bawalah” menyampaikan perintah kepada lebih dari satu murid tanpa perlu menandai jamak secara eksplisit.
