id: MAT.14.27
reference: Matthew 14:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: id
  text: Namun, segera Yesus berkata kepada mereka, “Kuatkanlah hatimu! Aku ini.[a] Jangan takut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Aku adalah.” Dalam konteks ini, ungkapan Yunani tersebut dapat berfungsi sebagai pengenalan diri sederhana, meskipun sebagian pembaca menangkap kemungkinan gema penyataan diri ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: saat itu juga
  rationale: Menyampaikan daya temporal ‘segera’ secara alami dalam narasi Indonesia dan menegaskan bahwa Yesus langsung menanggapi ketakutan para murid.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari ketakutan para murid pada ayat sebelumnya kepada tindakan Yesus.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Yesus berbicara kepada mereka, kata-Nya
  rationale: Mempertahankan verba berbicara, objek tidak langsung, dan fungsi partisip λέγων dalam bentuk Indonesia yang wajar serta bermartabat.
- source_word: Θαρσεῖτε
  choice: Tenanglah!
  rationale: Dalam konteks menenangkan orang-orang yang ketakutan, ungkapan ini secara alami menyampaikan seruan agar mereka berbesar hati dan tidak panik; bentuk jamak Yunani tidak dibedakan secara morfologis dalam bahasa Indonesia.
- source_word: ἐγώ εἰμι
  choice: Ini Aku
  rationale: Merupakan pengenalan diri yang alami dalam bahasa Indonesia pada konteks ini, sambil mempertahankan bentuk yang cukup dekat untuk tidak menutup kemungkinan gema teologis; terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: μὴ φοβεῖσθε
  choice: Jangan takut
  rationale: Padanan Indonesia yang langsung dan alami bagi larangan tersebut tanpa memaksakan nuansa aspektual ‘berhentilah takut’.
theological_decisions:
- issue: Apakah ἐγώ εἰμι hanya merupakan pengenalan diri atau juga mungkin menggemakan penyataan diri ilahi
  choice: Teks utama memakai “Ini Aku” sebagai pengenalan diri yang alami dalam konteks.
  alternative: “Aku adalah” atau “Akulah Dia.”
  rationale: Konteks terdekat menunjukkan bahwa Yesus sedang meyakinkan para murid dengan menyatakan identitas-Nya. Catatan kaki mempertahankan bentuk Yunani yang lebih harfiah dan kemungkinan gema penyataan diri ilahi tanpa menetapkannya sebagai satu-satunya maksud.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Saat itu juga” mengalir lebih alami daripada bentuk yang terlalu harfiah; tanda seru mencerminkan daya seruan imperatif. Penanda catatan kaki [a] ditempatkan tepat sesudah ungkapan yang dijelaskan.
