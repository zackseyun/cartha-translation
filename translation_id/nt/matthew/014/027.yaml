    issue: '"Tenanglah" for Θαρσεῖτε weakens the imperative to take courage.'
    rationale: Θαρσεῖτε calls the disciples to courage or confidence, not only to become calm. Since "Jangan takut" separately renders μὴ φοβεῖσθε, retaining "Tenanglah" also makes the two commands unnecessarily overlapping.
  revised_text: Namun, segera Yesus berkata kepada mereka, “Kuatkanlah hatimu! Aku ini.[a] Jangan takut.”
