- from: Namun, saat itu juga Yesus berbicara kepada mereka, kata-Nya, “Tenanglah! Ini Aku.[a] Jangan takut.”
  to: Namun, segera Yesus berkata kepada mereka, “Kuatkanlah hatimu! Aku ini.[a] Jangan takut.”
  rationale: Revised only the rendering of Θαρσεῖτε from "Tenanglah" to "Kuatkanlah hatimu" so that the Indonesian preserves the exhortation to courage and remains distinct from the following prohibition against fear. The wording for ἐγώ εἰμι and its footnote are retained because they naturally express self-identification while preserving the source's possible wider resonance.
