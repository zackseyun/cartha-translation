  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: id
  text: Mereka memohon kepada-Nya agar mereka hanya menyentuh tepi jubah-Nya[a]. Semua orang yang menyentuhnya menjadi sembuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelim” atau “rumbai pada jubah-Nya”; kata Yunani ini dapat menunjuk pinggir atau rumbai pakaian, mungkin termasuk jumbainya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dipulihkan” atau “diselamatkan”. Kata Yunani ini dapat berarti disembuhkan, dipulihkan, atau diselamatkan; dalam konteks ini yang dimaksud terutama adalah kesembuhan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: memohon
  rationale: Bentuk imperfek menunjukkan permohonan yang berlangsung atau berulang. “Memohon” menyampaikan kesungguhan tanpa terdengar berlebihan dalam bahasa Indonesia modern.
- source_word: ἵνα μόνον ἅψωνται
  choice: agar diperbolehkan menyentuh ... saja
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan isi permohonan, sedangkan μόνον menekankan bahwa mereka hanya meminta kesempatan untuk menyentuh. Penambahan “diperbolehkan” membuat hubungan dengan verba memohon alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: τοῦ κρασπέδου
  choice: ujung
  rationale: κράσπεδον dapat menunjuk tepi, kelim, rumbai, atau jumbai pakaian. “Ujung” cukup umum dan alami serta tidak memastikan bentuk tertentu yang tidak ditegaskan teks.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: jubah-Nya
  rationale: ἱμάτιον menunjuk pakaian luar. “Jubah” merupakan padanan Indonesia yang jelas dan lazim dalam konteks ini, meski “pakaian luar” lebih generik.
- source_word: ὅσοι
  choice: semua orang yang
  rationale: 'Ungkapan ini menyampaikan cakupan distributif ὅσοι secara alami: setiap orang dari antara mereka yang menyentuh mengalami hasil tersebut.'
- source_word: ἥψαντο
  choice: menyentuhnya
  rationale: Bentuk tengah ἅπτω di sini bermakna menyentuh. Klitik “-nya” merujuk secara alami pada ujung jubah yang baru disebut.
- source_word: διεσώθησαν
  choice: menjadi sembuh
  rationale: Dalam konteks langsung tentang orang sakit yang mencari sentuhan, verba διασῴζω menyatakan dipulihkan atau dibuat sehat. “Menjadi sembuh” jelas menyampaikan hasil kesembuhan jasmani sambil mencatat keluasan makna verba dalam catatan kaki.
theological_decisions:
- issue: Makna διεσώθησαν dalam konteks mukjizat penyembuhan
  choice: kesembuhan jasmani (“menjadi sembuh”)
  alternative: diselamatkan; dipulihkan; menjadi sehat
  rationale: διασῴζω dapat berarti menyelamatkan atau membawa dengan selamat, tetapi konteks terdekat membicarakan orang sakit dan kesembuhan tubuh. Terjemahan utama mengikuti makna kontekstual tanpa meniadakan rentang maknanya, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Sapaan pronominal ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskannya.
