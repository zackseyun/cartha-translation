  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: id
  text: Karena itu, ia berjanji dengan sumpah untuk memberikan kepada gadis itu apa pun yang akan dimintanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “apa saja yang mungkin dimintanya.” Bahasa Yunani memakai klausa relatif tak tentu (ὃ ἐὰν αἰτήσηται) untuk menyatakan permintaan mendatang yang belum ditentukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Karena itu
  rationale: Kata penghubung ini menyatakan kesimpulan atau akibat dari peristiwa sebelumnya; “Karena itu” mempertahankan daya inferensialnya dalam bahasa Indonesia yang wajar.
- source_word: μετὰ ὅρκου
  choice: dengan sumpah
  rationale: Frasa ini menunjukkan bahwa janji tersebut diteguhkan dengan sumpah. Pilihan ini langsung, alami, dan tetap formal.
- source_word: ὡμολόγησεν
  choice: ia berjanji
  rationale: Dalam konteks ini, verba tersebut berarti membuat komitmen yang tegas, bukan “mengaku.” “Berjanji” sesuai dengan konstruksi infinitif yang mengikutinya.
- source_word: αὐτῇ
  choice: kepada gadis itu
  rationale: Pronomina datif merujuk kepada anak perempuan dalam konteks sebelumnya. Penyebutan “gadis itu” menjernihkan rujukan tanpa menambahkan identitas yang tidak ada dalam teks.
- source_word: δοῦναι
  choice: akan memberikan
  rationale: Infinitif ini menyatakan isi janji. Bentuk “akan memberikan” alami dalam bahasa Indonesia dan mempertahankan arah tindakan yang masih akan dilakukan.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: apa pun yang dimintanya
  rationale: Pronomina relatif dengan ἐάν dan bentuk subjungtif membentuk klausa relatif tak tentu tentang permintaan yang belum ditentukan. “Apa pun yang dimintanya” menyampaikan cakupan terbuka itu secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “ia” dipakai untuk gaya naratif formal; “gadis itu” memperjelas rujukan αὐτῇ dari konteks. Penanda catatan kaki [a] dicantumkan dalam teks utama.
