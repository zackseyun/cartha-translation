  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: id
  text: Ketika Yesus turun dari perahu[a], Ia melihat kerumunan besar. Ia tergerak oleh belas kasihan terhadap mereka[b] dan menyembuhkan orang-orang sakit di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “setelah keluar” atau “ketika Ia keluar.” Dalam konteks ini, kemungkinan besar yang dimaksud ialah Yesus turun dari perahu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia berbelas kasihan kepada mereka” atau “Ia merasa sangat iba terhadap mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ketika Yesus turun dari perahu
  rationale: Partisip ini secara harfiah berarti ‘setelah keluar’ atau ‘ketika keluar’. Dalam konteks kedatangan Yesus dengan perahu, ‘turun dari perahu’ menyampaikan tindakan yang dimaksud secara alami dalam bahasa Indonesia; nama ‘Yesus’ dipakai untuk memperjelas subjek tersirat.
- source_word: εἶδεν
  choice: Ia melihat
  rationale: Padanan langsung dan alami bagi bentuk aoris dari ὁράω.
- source_word: πολὺν ὄχλον
  choice: orang banyak
  rationale: Ungkapan baku bahasa Indonesia untuk kerumunan besar; dalam pemakaian ini, ‘orang banyak’ sudah mengandung gagasan jumlah yang besar tanpa perlu penambahan yang kaku.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: tergerak oleh belas kasihan kepada mereka
  rationale: σπλαγχνίζομαι menyatakan belas kasihan yang mendalam. Ungkapan ini alami, bermartabat, dan mempertahankan daya emosional verba Yunani.
- source_word: ἐθεράπευσεν
  choice: menyembuhkan
  rationale: Dalam konteks ini θεραπεύω jelas merujuk pada penyembuhan fisik.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: orang-orang sakit di antara mereka
  rationale: Adjektiva substantival ἀρρώστους menunjuk kepada orang-orang yang sakit, sedangkan αὐτῶν mengaitkan mereka dengan orang banyak. Bentuk Indonesia ini lebih jelas dan alami daripada ‘orang sakit mereka’.
theological_decisions:
- issue: Penggambaran tanggapan emosional Yesus
  choice: tergerak oleh belas kasihan kepada mereka
  alternative: berbelas kasihan kepada mereka
  rationale: Pilihan ini mempertahankan kedalaman respons batin yang dinyatakan oleh σπλαγχνίζομαι tanpa menambahkan motif atau penjelasan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibagi dengan ‘Lalu’ agar rangkaian melihat, berbelas kasihan, dan menyembuhkan terbaca alami tanpa mengubah hubungan naratifnya.
