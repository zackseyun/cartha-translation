id: MAT.14.19
reference: Matthew 14:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: id
  text: Lalu Ia menyuruh orang banyak duduk di rumput. Ia mengambil lima roti dan dua ikan itu, menengadah ke langit, lalu mengucapkan berkat[a]. Setelah memecah-mecahkan roti-roti itu, Ia memberikannya kepada murid-murid, dan murid-murid membagikannya kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberkati”; dalam bahasa Yunani objeknya tidak dinyatakan. Ungkapan ini juga dapat berarti bahwa Ia memuji Allah atau mengucapkan doa berkat.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: Lalu Ia menyuruh
  rationale: Menyampaikan perintah yang mendahului tindakan utama dengan urutan naratif yang alami dalam bahasa Indonesia.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Padanan Indonesia modern yang wajar bagi kelompok-kelompok orang yang berkumpul; bentuk jamak Yunani tidak perlu dibuat kaku.
- source_word: ἀνακλιθῆναι
  choice: duduk bersandar
  rationale: Menjaga nuansa posisi berbaring atau bersandar saat makan tanpa memakai ungkapan yang terasa janggal bagi pembaca modern.
- source_word: ἐπὶ τοῦ χόρτου
  choice: di atas rumput
  rationale: Menyatakan lokasi secara langsung tanpa menambahkan sifat 'hijau' yang tidak terdapat dalam teks Matius.
- source_word: λαβὼν
  choice: Ia mengambil
  rationale: Partisip aoristus dialihkan menjadi verba finit agar alur narasi Indonesia lancar.
- source_word: τοὺς πέντε ἄρτους
  choice: lima roti
  rationale: Dalam konteks ini ἄρτοι menunjuk pada roti-roti utuh; angka sudah menyatakan keberbilangan sehingga bentuk 'lima roti' alami.
- source_word: τοὺς δύο ἰχθύας
  choice: dua ikan
  rationale: Padanan langsung dan idiomatis.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: menengadah ke langit
  rationale: Ungkapan alami yang tepat menggambarkan tindakan memandang ke atas menuju langit.
- source_word: εὐλόγησεν
  choice: mengucapkan berkat
  rationale: Teks Yunani tidak menyebutkan objek. Ungkapan ini mempertahankan ketakterusan tersebut dan cocok dengan konteks doa sebelum makan.
- source_word: κλάσας
  choice: Setelah memecah-mecahkan roti-roti itu
  rationale: Menandai tindakan yang mendahului pemberian dan menyatakan objek tersirat dari konteks; bentuk ulang menggambarkan pembagian roti menjadi bagian-bagian.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: Ia memberikannya kepada murid-murid
  rationale: Pronomina merujuk pada roti yang baru dipecah-pecahkan dan menghindari pengulangan yang berat.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: dan murid-murid membagikannya kepada orang banyak
  rationale: Verba yang dilesapkan dalam bahasa Yunani dibuat eksplisit dalam bahasa Indonesia; 'membagikan' menyampaikan tindakan penyaluran kepada orang banyak secara alami.
theological_decisions:
- issue: Objek εὐλόγησεν tidak dinyatakan
  choice: mengucapkan berkat
  alternative: memberkati roti dan ikan itu; memuji Allah
  rationale: Bahasa Yunani hanya menyatakan 'memberkati' tanpa objek eksplisit. Terjemahan utama tidak menetapkan roti/ikan atau Allah sebagai objek, sedangkan catatan mempertahankan kedua kemungkinan idiomatis.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Struktur partisip Yunani diurai menjadi kalimat berurutan agar jelas bagi pembaca umum, tanpa menghilangkan urutan tindakan.
