  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: id
  text: Namun, ketika hari ulang tahun Herodes dirayakan,[a] anak perempuan Herodias menari di tengah-tengah dan menyenangkan Herodes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika hari ulang tahun Herodes tiba” atau “pada perayaan ulang tahun Herodes.” Bahasa Yunani menunjuk pada kesempatan ketika ulang tahun Herodes diperingati.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di tengah.” Ungkapan ini kemungkinan berarti di tengah-tengah orang-orang yang hadir.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ketika hari ulang tahun Herodes dirayakan
  rationale: Ungkapan temporal ini menunjuk pada berlangsungnya perayaan atau peringatan ulang tahun Herodes, bukan sekadar tibanya tanggal tersebut. Bentuk pasif idiomatis ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini mengembangkan narasi dengan nuansa peralihan dan sedikit pertentangan terhadap konteks sebelumnya.
- source_word: ὠρχήσατο
  choice: menari
  rationale: Kata kerja ini secara langsung berarti menari; terjemahan sederhana tidak menambahkan rincian mengenai jenis tariannya.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: anak perempuan Herodias
  rationale: Menyatakan hubungan genetif secara lugas tanpa memasukkan nama tradisional yang tidak disebutkan dalam teks.
- source_word: ἐν τῷ μέσῳ
  choice: di tengah-tengah para tamu
  rationale: Secara harfiah berarti 'di tengah-tengah'. Penambahan 'para tamu' menyatakan acuan yang tersirat dalam latar perjamuan, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: menyenangkan hati Herodes
  rationale: Mengungkapkan arti 'menyenangkan' secara alami dalam bahasa Indonesia tanpa menyiratkan rincian tambahan tentang tanggapan Herodes.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herodes
  rationale: Mengikuti bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
