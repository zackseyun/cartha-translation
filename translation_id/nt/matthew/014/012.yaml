id: MAT.14.12
reference: Matthew 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: id
  text: Murid-muridnya datang, mengambil jenazahnya, lalu menguburkannya. Sesudah itu, mereka pergi dan memberitahukan hal itu kepada Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: datang
  rationale: Partisip aoristus προσέρχομαι memperkenalkan tindakan para murid setelah kematian Yohanes. 'Datang' alami dalam narasi Indonesia dan cukup menyampaikan gerak mendekat dalam konteks ini.
- source_word: μαθηταὶ αὐτοῦ
  choice: murid-muridnya
  rationale: Ungkapan ini secara kontekstual menunjuk kepada murid-murid Yohanes Pembaptis. 'Murid-murid' mempertahankan nuansa relasi belajar dari μαθηταί, sedangkan pronomina dibiarkan mengikuti bentuk Yunani.
- source_word: ἦραν
  choice: mengambil
  rationale: Kata αἴρω berarti mengangkat atau mengambil. Dalam konteks pemakaman, 'mengambil' tepat dan tidak menambahkan rincian bahwa mereka membawanya ke tempat tertentu.
- source_word: πτῶμα
  choice: jenazahnya
  rationale: πτῶμα menunjuk pada tubuh yang telah mati. 'Jenazah' menyatakan hal itu dengan jelas, wajar, dan bermartabat dalam bahasa Indonesia, tanpa kekasaran yang dapat terasa pada 'mayat'.
- source_word: ἔθαψαν αὐτόν
  choice: menguburkannya
  rationale: θάπτω secara langsung berarti menguburkan. Pilihan ini tidak memasukkan rincian tentang makam yang tidak dinyatakan dalam ayat.
- source_word: ἐλθόντες
  choice: Sesudah itu, mereka pergi
  rationale: Partisip ini menandai gerak dan urutan tindakan berikutnya. Bentuk klausa finit ini alami dalam bahasa Indonesia dan menyampaikan bahwa setelah pemakaman mereka pergi menghadap Yesus.
- source_word: ἀπήγγειλαν
  choice: memberitahukan hal itu
  rationale: ἀπαγγέλλω berarti melaporkan atau memberitahukan. 'Hal itu' secara alami mengungkapkan objek laporan yang tersirat, yakni peristiwa kematian dan pemakaman Yohanes.
- source_word: τῷ Ἰησοῦ
  choice: kepada Yesus
  rationale: '''Yesus'' adalah bentuk baku bahasa Indonesia untuk Ἰησοῦς, dan ''kepada'' menandai penerima pemberitahuan secara alami.'
theological_decisions:
- issue: Identitas 'murid-muridnya'
  choice: Dibiarkan sebagai 'murid-muridnya', dengan Yohanes Pembaptis sebagai rujukan kontekstual.
  alternative: Menjelaskan langsung sebagai 'murid-murid Yohanes'.
  rationale: Konteks langsung mengenai kematian Yohanes membuat rujukannya jelas. Mempertahankan pronomina menjaga bentuk dan sedikit ambiguitas gramatikal teks Yunani tanpa mengaburkan makna naratif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Jenazah' dipilih karena secara eksplisit berarti tubuh orang yang telah meninggal serta sesuai dengan suasana pemakaman. Struktur dua kalimat membuat rangkaian tindakan jelas tanpa kehilangan hubungan urutannya.
