  source_fidelity: 'Terjemahan menyampaikan seluruh unsur Yunani secara tepat: subjek jamak yang merujuk kepada para murid, ujaran kepada Yesus, negasi kepemilikan, keterangan tempat ὧδε, pengecualian εἰ μή, serta jumlah lima roti dan dua ikan. Urutan “Di sini kami tidak mempunyai apa-apa selain ...” setia pada makna tanpa menciptakan penekanan yang tidak ada dalam sumber.'
