  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: id
  text: Namun, mereka berkata kepada-Nya, “Di sini kami tidak mempunyai apa-apa selain lima roti dan dua ikan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: Kata sandang οἱ menunjuk kembali kepada para murid sebagai subjek, sedangkan δέ menandai pertentangan ringan dengan perintah Yesus sebelumnya. “Namun” menyampaikan hubungan wacana itu secara alami.
- source_word: λέγουσιν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Bentuk Yunani memakai kala kini historis, tetapi bahasa Indonesia tidak menandai kala secara morfologis; “berkata” wajar dalam narasi dan tetap menyampaikan tindakan berbicara kepada Yesus.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Di sini kami tidak mempunyai apa-apa selain
  rationale: Susunan ini mempertahankan penyangkalan dan fungsi pengecualian εἰ μή, sekaligus terdengar alami dalam bahasa Indonesia. ὧδε diterjemahkan “di sini” dan ditempatkan di awal untuk kelancaran.
- source_word: πέντε ἄρτους
  choice: lima roti
  rationale: ἄρτος dapat berarti roti atau sebongkah roti. Dalam bahasa Indonesia, “lima roti” merupakan ungkapan hitungan yang alami dan sesuai dengan konteks pemberian makan.
- source_word: δύο ἰχθύας
  choice: dua ikan
  rationale: ἰχθύας berarti ikan; “dua ikan” adalah padanan langsung dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kata ganti ilahi “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus tanpa menambahkan penafsiran ke dalam isi ayat.
