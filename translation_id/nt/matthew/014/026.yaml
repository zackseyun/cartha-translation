  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: id
  text: Namun, ketika murid-murid melihat Dia berjalan di atas laut, mereka ketakutan dan berkata, “Itu hantu[a]!” Karena takut, mereka pun berteriak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penampakan” atau “fantom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan narasi dengan kontras ringan terhadap ayat sebelumnya dan mengantar reaksi takut para murid.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: Bentuk dengan artikel menunjuk kepada kelompok yang sudah diketahui dalam konteks, yaitu murid-murid Yesus.
- source_word: ἰδόντες αὐτὸν
  choice: ketika murid-murid melihat Dia
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat waktu agar urutan peristiwa jelas dan alami dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: berjalan di atas danau
  rationale: ἐπί dengan genitif menggambarkan gerak pada permukaan danau. Dalam konteks geografis Danau Galilea, 'danau' lebih alami dan tepat bagi pembaca Indonesia daripada 'laut', sedangkan 'di atas' mempertahankan gambaran tindakan itu.
- source_word: ἐταράχθησαν
  choice: mereka ketakutan
  rationale: Kata kerja ini menyatakan keadaan terguncang atau sangat gelisah; konteks seruan tentang hantu dan teriakan karena takut mendukung terjemahan yang menonjolkan rasa takut.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini memperkenalkan ucapan yang menyertai reaksi mereka; bentuk verbal koordinatif lebih alami dalam bahasa Indonesia.
- source_word: Φάντασμά ἐστιν
  choice: Itu hantu!
  rationale: φάντασμα menunjuk pada sosok atau penampakan yang dianggap berasal dari dunia roh. 'Hantu' merupakan padanan modern yang paling langsung dan mudah dipahami, tanpa menyatakan bahwa penilaian para murid itu benar.
- source_word: ἀπὸ τοῦ φόβου
  choice: Karena takut
  rationale: ἀπό menyatakan sebab atau sumber reaksi mereka; frasa ini menyampaikan hubungan sebab-akibat secara alami.
- source_word: ἔκραξαν
  choice: mereka pun berteriak
  rationale: κράζω menyatakan seruan dengan suara keras. 'Berteriak' kuat dan alami; 'pun' menghubungkannya dengan reaksi yang baru saja disebutkan tanpa menambah isi baru.
theological_decisions:
- issue: Hakikat φάντασμα dalam seruan para murid
  choice: Diterjemahkan sebagai 'hantu' dalam teks utama
  alternative: '''penampakan'' atau ''bayangan gaib'''
  rationale: Ayat ini melaporkan kesimpulan para murid yang sedang ketakutan, bukan menetapkan ajaran tentang hakikat roh. 'Hantu' menyampaikan persepsi keliru mereka secara jelas tanpa mengesahkannya sebagai kenyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan rujukan kepada Yesus ditulis 'Dia' sesuai kebiasaan hormat dalam teks religius Indonesia. Struktur kalimat menjaga gerak narasi dan intensitas ketakutan tanpa menambahkan keterangan teologis.
