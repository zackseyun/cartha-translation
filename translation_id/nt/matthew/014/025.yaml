source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: id
  text: Pada jaga malam keempat[a], Yesus datang kepada mereka sambil berjalan di atas laut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jaga malam keempat adalah bagian terakhir malam, kira-kira pukul 03.00–06.00 menurut pembagian waktu Romawi.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “di atas laut.” Ada yang memahami frasa ini sebagai “di tepi laut,” tetapi konteks sangat mendukung arti bahwa Ia berjalan di atas permukaan air.
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: pada giliran jaga malam yang keempat
  rationale: Frasa datif ini menyatakan waktu. 'Giliran jaga malam' mempertahankan kerangka pembagian waktu kuno dan tetap dapat dipahami pembaca Indonesia masa kini.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan; dalam konteks ayat ini, alur bahasa Indonesia lebih alami tanpa kata sambung eksplisit.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Yesus datang kepada mereka
  rationale: Gabungan ἦλθεν dan πρὸς αὐτούς menyatakan gerak menuju para murid. Subjek tersirat diperjelas sebagai 'Yesus' agar wajar dan tidak rancu dalam bahasa Indonesia.
- source_word: περιπατῶν
  choice: dengan berjalan
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan kedatangan Yesus.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: di atas danau
  rationale: Dalam konteks ini, frasa tersebut menyatakan gerak pada permukaan air. 'Danau' memakai sebutan geografis yang alami dalam bahasa Indonesia untuk Danau Galilea, sedangkan catatan mempertahankan padanan leksikal 'laut' dan menjelaskan kemungkinan yang lebih lemah.
theological_decisions:
- issue: Gambaran mukjizat tentang Yesus berjalan di atas air
  choice: berjalan di atas danau
  alternative: berjalan di tepi danau
  rationale: Sintaksis dan konteks kuat menunjuk pada gerak di permukaan air, bukan di sepanjang pantai. Terjemahan mempertahankan daya mukjizat pernyataan Yunani tanpa menambah penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah historis 'giliran jaga malam' dipertahankan dengan penjelasan waktu dalam catatan kaki; nama 'Yesus' digunakan untuk memperjelas subjek tersirat.
