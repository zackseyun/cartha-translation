id: MAT.14.2
reference: Matthew 14:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: id
  text: Lalu ia berkata kepada para pelayannya, “Orang ini adalah Yohanes Pembaptis. Ia telah dibangkitkan dari antara orang mati. Itulah sebabnya kuasa-kuasa itu[a] bekerja di dalam dirinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuasa-kuasa ajaib itu”; secara lebih interpretatif, “mukjizat-mukjizat itu.” Teks Yunani berbunyi “kuasa-kuasa” (αἱ δυνάμεις), yang menunjuk pada kuasa adikodrati yang tampak dalam perbuatan-perbuatan hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: para pelayannya
  rationale: παῖς dapat berarti anak, hamba, atau pelayan. Dalam konteks Herodes yang berbicara kepada orang-orang dalam rumah tangga atau istananya, “para pelayannya” menyampaikan hubungan sosial itu secara wajar tanpa menentukan jabatan mereka secara berlebihan.
- source_word: ὁ βαπτιστής
  choice: Pembaptis
  rationale: “Yohanes Pembaptis” adalah sebutan yang mapan dan alami dalam bahasa Indonesia serta menyampaikan fungsi yang dinyatakan oleh bentuk Yunani tersebut.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk aoristus pasif dari ἐγείρω dipertahankan sebagai pasif. “Telah dibangkitkan” alami dalam konteks ini dan tidak menyiratkan bahwa Yohanes membangkitkan dirinya sendiri.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini menyampaikan secara jelas bahwa ia dibangkitkan dari lingkungan atau kumpulan orang mati, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Pilihan ini mempertahankan hubungan sebab-akibat yang tegas dan terdengar alami sebagai awal kalimat baru dalam bahasa Indonesia.
- source_word: αἱ δυνάμεις
  choice: kuasa-kuasa itu
  rationale: δύναμις di sini menunjuk pada kuasa adikodrati yang tampak dalam perbuatan-perbuatan hebat. “Kuasa-kuasa” mempertahankan nomina jamak dan tidak langsung menyamakannya dengan hasil tindakannya, yaitu mukjizat. Kata “itu” membuat artikel Yunani terasa alami dalam konteks Indonesia.
- source_word: ἐνεργοῦσιν
  choice: bekerja
  rationale: ἐνεργέω berarti aktif atau bekerja secara efektif. “Bekerja” merupakan padanan Indonesia yang sederhana dan alami.
- source_word: ἐν αὐτῷ
  choice: di dalam dirinya
  rationale: Pilihan ini mempertahankan arti paling langsung dari ἐν, yaitu kuasa-kuasa tersebut aktif dalam dirinya. “Melalui dirinya” mungkin secara kontekstual, tetapi lebih interpretatif.
theological_decisions:
- issue: Sifat kembalinya Yohanes dari kematian
  choice: Ia telah dibangkitkan dari antara orang mati
  alternative: Ia bangkit dari antara orang mati
  rationale: Bahasa Yunani memakai bentuk pasif ἠγέρθη. Terjemahan mempertahankan bentuk pasif tanpa menetapkan lebih jauh siapa pelakunya atau membuat klaim doktrinal di luar perkataan Herodes.
- issue: Makna δυνάμεις dalam konteks
  choice: kuasa-kuasa itu bekerja di dalam dirinya
  alternative: kuasa-kuasa ajaib itu bekerja di dalam dirinya; mukjizat-mukjizat terjadi melalui dirinya
  rationale: Istilah ini kemungkinan menunjuk pada kuasa adikodrati yang terwujud dalam perbuatan ajaib. Teks utama mempertahankan “kuasa-kuasa” agar tidak meniadakan perbedaan antara kuasa dan perbuatan yang dihasilkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang ini” alami untuk Οὗτός dalam ucapan Herodes, sedangkan “di dalam dirinya” sengaja mempertahankan gambaran lokatif Yunani dan ambiguitas mengenai cara kuasa-kuasa itu bekerja.
