id: MAT.14.32
reference: Matthew 14:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: id
  text: Setelah mereka naik ke perahu[a], angin pun reda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setelah mereka naik masuk ke dalam perahu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: pun
  rationale: καί melanjutkan urutan narasi. Dalam bahasa Indonesia, partikel "pun" secara alami menandai kejadian berikutnya dan menghubungkan reda angin dengan masuknya mereka ke perahu tanpa menambahkan penafsiran.
- source_word: ἀναβάντων αὐτῶν
  choice: setelah mereka naik
  rationale: Genitivus absolutus ini menyatakan waktu dan secara alami diterjemahkan sebagai anak kalimat temporal. Kata ἀναβαίνω secara harfiah berarti "naik"; dalam konteks εἰς τὸ πλοῖον, ungkapan "naik ke perahu" idiomatis dalam bahasa Indonesia sekaligus dekat dengan bentuk Yunani.
- source_word: εἰς τὸ πλοῖον
  choice: ke perahu
  rationale: πλοῖον menunjuk pada perahu yang digunakan para murid di Danau Galilea. "Perahu" lebih tepat dan wajar daripada "kapal", yang dapat menyiratkan sarana air berukuran lebih besar.
- source_word: ἐκόπασεν
  choice: reda
  rationale: κοπάζω menggambarkan angin yang berhenti atau mereda. "Reda" merupakan padanan Indonesia yang ringkas dan alami, tanpa menambahkan gambaran proses yang tidak ditegaskan oleh bentuk aoris.
- source_word: ὁ ἄνεμος
  choice: angin
  rationale: Subjek berartikel ini secara wajar diterjemahkan "angin" dalam bahasa Indonesia; bahasa Indonesia tidak memiliki artikel tertentu yang harus ditampilkan secara terpisah.
theological_decisions:
- issue: Implikasi naratif tentang kuasa Yesus atas alam
  choice: 'Menyampaikan kejadian secara lugas: angin reda setelah mereka naik ke perahu.'
  alternative: Menambahkan ungkapan yang secara eksplisit menonjolkan bahwa Yesus secara ajaib menghentikan angin.
  rationale: Ayat ini menyatakan urutan kejadian tanpa secara eksplisit menjelaskan sebab atau makna teologisnya. Terjemahan mempertahankan implikasinya dalam konteks dan tidak memasukkan penjelasan yang melampaui bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Frasa "naik ke perahu" mudah dipahami pembaca umum dan mempertahankan citra gerak ἀναβαίνω. Penanda catatan kaki [a] dicantumkan tepat setelah frasa terkait.
