  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: id
  text: Lalu Yesus berkata, “Datanglah!” Maka Petrus turun dari perahu, berjalan di atas air, dan datang ke arah Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan datang kepada Yesus.” Frasa Yunani ini menyatakan gerak menuju Yesus dan tidak dengan sendirinya menegaskan bahwa Petrus telah tiba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Lalu Yesus berkata
  rationale: δέ berfungsi sebagai penghubung naratif ringan, sehingga 'Lalu' mengalir alami. Subjek Yunani hanya berupa kata ganti 'ia', tetapi penyebutan 'Yesus' memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: Ἐλθέ
  choice: Datanglah!
  rationale: Bentuk imperatif aoris dari ἔρχομαι merupakan panggilan langsung. 'Datanglah!' singkat, alami, dan mempertahankan daya perintahnya.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: turun dari perahu
  rationale: Partisip aoris menandai tindakan yang mendahului verba utama. Susunan 'Maka Petrus turun ...' menyampaikan urutan itu secara wajar dalam bahasa Indonesia.
- source_word: πλοίου
  choice: perahu
  rationale: Dalam latar Danau Galilea, 'perahu' merupakan padanan modern yang lebih tepat daripada 'kapal'.
- source_word: περιεπάτησεν
  choice: berjalan
  rationale: Dalam konteks ini περιπατέω secara langsung berarti berjalan; teks tidak perlu diperluas menjadi 'mulai berjalan'.
- source_word: ἐπὶ τὰ ὕδατα
  choice: di atas air
  rationale: ἐπί dengan akusatif menggambarkan gerak pada atau di atas permukaan. Bahasa Indonesia secara alami memakai nomina massa tunggal 'air'.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: dan bergerak ke arah Yesus
  rationale: πρός menandai arah gerak menuju Yesus tanpa harus menyatakan bahwa Petrus telah tiba. 'Bergerak ke arah' mempertahankan nuansa arah itu dan menghindari pengulangan 'datang' yang kaku.
theological_decisions:
- issue: Apakah Petrus dinyatakan telah sampai kepada Yesus
  choice: bergerak ke arah Yesus
  alternative: sampai kepada Yesus
  rationale: Frasa Yunani ἦλθεν πρὸς dapat dipahami sebagai datang menuju atau datang kepada. Konteks langsung berikutnya tidak menuntut kesimpulan bahwa ia sudah tiba; karena itu terjemahan utama mempertahankan arah gerak, sedangkan kemungkinan makna sampai dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Seruan imperatif dipertahankan secara ringkas; ambiguitas tentang arah gerak atau tibanya Petrus dijaga melalui teks utama dan catatan kaki.
