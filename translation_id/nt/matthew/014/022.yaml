    issue: “mendesak” untuk ἠνάγκασεν
    rationale: Kata Yunani ini lebih kuat daripada sekadar mendesak; “memaksa” lebih mempertahankan daya paksa tanpa menambahkan rincian mengenai cara paksaan itu dilakukan.
  - severity: medium
    issue: “sementara Ia menyuruh orang banyak pulang” untuk ἕως οὗ ἀπολύσῃ
    rationale: 'ἕως οὗ dengan aorist subjungtif menandai batas waktu yang akan datang: para murid harus mendahului Yesus sampai Ia membubarkan orang banyak. “Sementara” mengubahnya menjadi tindakan yang hanya berlangsung serentak.'
  revised_text: Segera sesudah itu, Yesus memaksa murid-murid naik ke perahu dan mendahului-Nya ke seberang, sampai Ia membubarkan orang banyak.
