  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Nama 'Yesus' dan pronomina 'Ia/-Nya' digunakan untuk memperjelas rujukan yang dalam bahasa Yunani hanya tersirat dalam bentuk verba atau dinyatakan dengan pronomina.
