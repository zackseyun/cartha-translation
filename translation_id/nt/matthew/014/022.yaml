source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: id
  text: Segera sesudah itu, Yesus memaksa murid-murid naik ke perahu dan mendahului-Nya ke seberang, sampai Ia membubarkan orang banyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: Segera sesudah itu
  rationale: Menyampaikan tindakan yang langsung terjadi sekaligus memberi peralihan naratif yang alami dalam bahasa Indonesia.
- source_word: ἠνάγκασεν
  choice: mendesak
  rationale: Menjaga unsur desakan atau keharusan yang kuat tanpa menyiratkan kekerasan fisik yang tidak dinyatakan teks.
- source_word: τοὺς μαθητάς
  choice: murid-murid
  rationale: Bentuk ulang ini wajar untuk jamak dalam bahasa Indonesia; kelompok yang dimaksud sudah jelas dari konteks sehingga tidak perlu ditambah 'murid-murid-Nya'.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: naik ke perahu
  rationale: Ungkapan Indonesia yang alami untuk tindakan memasuki atau menaiki perahu.
- source_word: πλοῖον
  choice: perahu
  rationale: Konteks menunjukkan perahu tertentu, tetapi bahasa Indonesia tidak memerlukan penanda definit yang eksplisit.
- source_word: προάγειν αὐτόν
  choice: mendahului-Nya
  rationale: Secara ringkas dan tepat menyatakan bahwa para murid pergi lebih dahulu daripada Yesus.
- source_word: εἰς τὸ πέραν
  choice: ke seberang
  rationale: Padanan idiomatis yang jelas bagi sisi lain perairan.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: sementara Ia menyuruh ... pulang
  rationale: Dalam konteks ini konstruksi tersebut menunjukkan bahwa para murid berangkat lebih dahulu selagi Yesus menangani pembubaran orang banyak; 'sementara' menghasilkan hubungan waktu yang alami tanpa membebani bahasa Indonesia dengan bentuk prospektif asing.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: menyuruh orang banyak pulang
  rationale: Mengungkapkan makna kontekstual 'membubarkan/mengirim pergi' dengan bahasa modern yang mudah dipahami.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Ungkapan kolektif baku dan alami dalam bahasa Indonesia; tidak perlu memaksakan morfologi jamak Yunani menjadi bentuk ulang.
