id: MAT.14.11
reference: Matthew 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: id
  text: Kepalanya dibawa di atas sebuah nampan[a] dan diberikan kepada gadis itu, lalu gadis itu membawanya kepada ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baki” atau “pinggan saji.” Kata Yunani πίναξ menunjuk pada nampan, baki, atau pinggan yang digunakan untuk menyajikan makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: dibawa
  rationale: Bentuk aoristus pasif dari φέρω diterjemahkan dengan pasif alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: kepalanya
  rationale: Terjemahan langsung yang wajar; konteks dengan jelas menunjukkan bahwa akhiran -nya merujuk kepada Yohanes.
- source_word: ἐπὶ πίνακι
  choice: di atas sebuah nampan
  rationale: πίναξ menunjuk pada wadah datar untuk menyajikan makanan. 'Nampan' merupakan padanan modern yang jelas, sedangkan 'sebuah' membuat bendanya terdengar alami dalam narasi Indonesia.
- source_word: ἐδόθη
  choice: diberikan
  rationale: Bentuk aoristus pasif dari δίδωμι diterjemahkan secara langsung dan mempertahankan rangkaian pasif teks Yunani.
- source_word: τῷ κορασίῳ
  choice: kepada gadis itu
  rationale: κοράσιον berarti anak perempuan atau gadis. 'Gadis itu' alami dalam konteks dan mengacu kembali kepada anak perempuan yang telah disebutkan.
- source_word: ἤνεγκεν
  choice: gadis itu membawanya
  rationale: Subjek diulang agar rujukannya jelas dalam bahasa Indonesia, sedangkan '-nya' menyatakan objek yang tersirat tetapi sudah jelas, yaitu kepala tersebut.
- source_word: τῇ μητρὶ αὐτῆς
  choice: kepada ibunya
  rationale: Padanan langsung bagi frasa datif; akhiran '-nya' mengacu kepada ibu gadis tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur pasif sumber dipertahankan, tetapi subjek 'gadis itu' diulang pada klausa terakhir demi kejelasan. Penanda catatan kaki ditempatkan sesudah 'nampan', yaitu pada kata yang diterangkan.
