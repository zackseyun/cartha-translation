  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: id
  text: Segera Yesus mengulurkan tangan-Nya, memegangnya, lalu berkata kepadanya, “Hai orang yang kurang percaya, mengapa engkau bimbang?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengapa engkau ragu?” Kata Yunani ini dapat berarti ragu, bimbang, atau goyah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Segera
  rationale: Menyampaikan tindakan yang langsung terjadi dan mempertahankan urgensi narasi dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: —
  rationale: Partikel penghubung ini tidak diterjemahkan secara tersendiri karena kesinambungan narasi sudah jelas dan terjemahan eksplisit akan terasa kaku.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: mengulurkan tangan-Nya
  rationale: Ungkapan Indonesia yang alami dan konkret untuk tindakan mengulurkan tangan.
- source_word: ἐπελάβετο αὐτοῦ
  choice: memegang Petrus
  rationale: Menyatakan tindakan menangkap atau memegang erat tanpa menambahkan rincian cara; nama Petrus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: λέγει αὐτῷ
  choice: lalu berkata kepadanya
  rationale: Kala kini historis dialihkan ke bentuk narasi Indonesia yang alami; 'lalu' memperjelas urutan tindakan tanpa mengubah isinya.
- source_word: Ὀλιγόπιστε
  choice: Hai orang yang kurang percaya
  rationale: Mempertahankan sapaan langsung serta gagasan iman yang tidak memadai, bukan ketiadaan iman sama sekali.
- source_word: εἰς τί
  choice: mengapa
  rationale: Padanan idiomatis dan langsung bagi ungkapan interogatif tersebut.
- source_word: ἐδίστασας
  choice: engkau bimbang
  rationale: Kata 'bimbang' mempertahankan nuansa ragu, goyah, atau terpecah dalam mengambil sikap, sesuai konteks tindakan Petrus.
theological_decisions:
- issue: Makna Ὀλιγόπιστε dalam kaitannya dengan πίστις
  choice: Hai orang yang kurang percaya
  alternative: Hai engkau yang kecil iman
  rationale: Pilihan ini menyatakan kekurangan dalam iman/kepercayaan tanpa menuduh Petrus sama sekali tidak beriman; bentuknya juga lebih alami dalam bahasa Indonesia.
- issue: Nuansa ἐδίστασας
  choice: mengapa engkau bimbang?
  alternative: mengapa engkau ragu?
  rationale: '''Bimbang'' menjaga kemungkinan makna goyah atau ragu-ragu, bukan sekadar ketidakpercayaan intelektual, sehingga ketegangan leksikal teks sumber tetap terpelihara.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai dalam ujaran langsung untuk menjaga nada alkitabiah yang tetap mudah dipahami. Akhiran hormat '-Nya' mengikuti kebiasaan ortografi Indonesia ketika merujuk kepada Yesus.
