id: MAT.14.30
reference: Matthew 14:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: id
  text: Namun, ketika melihat angin yang kencang[a], ia menjadi takut. Ketika ia mulai tenggelam, ia berseru, “Tuhan, selamatkan aku!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “angin yang dahsyat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tolong aku.” Kata kerja Yunani yang dipakai dapat berarti melepaskan seseorang dari bahaya langsung maupun menyelamatkan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων δὲ
  choice: Namun, ketika melihat
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan, sedangkan δέ menandai peralihan yang kontras; susunan ini alami dalam bahasa Indonesia.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: angin yang kencang
  rationale: ἰσχυρός menerangkan kuatnya angin; 'kencang' merupakan padanan Indonesia yang lazim untuk angin.
- source_word: ἐφοβήθη
  choice: ia menjadi takut
  rationale: Mengungkapkan timbulnya rasa takut, sesuai nuansa ingresif yang mungkin pada bentuk aoris ini.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: ketika ia mulai tenggelam
  rationale: Mempertahankan aspek permulaan tindakan tanpa menyiratkan bahwa ia sudah sepenuhnya terbenam atau mati tenggelam.
- source_word: ἔκραξεν λέγων
  choice: ia berseru
  rationale: Bahasa Indonesia tidak memerlukan terjemahan terpisah bagi λέγων; 'berseru' menyampaikan ucapan yang keras dan mendesak secara alami.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini secara wajar mempertahankan bobot κύριος tanpa menambahkan gelar yang tidak terdapat dalam teks.
- source_word: σῶσόν με
  choice: selamatkan aku
  rationale: Imperatif ini adalah permohonan mendesak agar dilepaskan dari bahaya; 'selamatkan' juga mempertahankan jangkauan makna σῴζω.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan / Guru
  rationale: '''Tuhan'' mempertahankan bobot kristologis yang mungkin terkandung dalam sapaan itu, tanpa membuatnya lebih eksplisit daripada teks Yunani.'
- issue: Makna σῴζω dalam bahaya langsung
  choice: selamatkan aku
  alternative: tolong aku / lepaskan aku
  rationale: Konteksnya adalah penyelamatan jasmani yang mendesak, tetapi 'selamatkan' menjaga jangkauan leksikal dan resonansi yang lebih luas dari verba tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bernada khidmat. Pemecahan menjadi dua kalimat memperjelas urutan tindakan tanpa mengubah hubungan maknanya; tanda seru menyampaikan desakan seruan Petrus.
