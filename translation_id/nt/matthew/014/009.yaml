  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: id
  text: Raja itu, meskipun sedih, karena sumpah-sumpahnya dan karena orang-orang yang makan bersamanya,[a] memerintahkan agar permintaan itu dikabulkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang berbaring semeja dengannya.” Berbaring saat makan adalah kebiasaan dalam perjamuan pada masa itu.
    reason: cultural_note
  - marker: b
    text: Bahasa Yunani tidak menyebutkan objek dari “diberikan”; yang dimaksud adalah hal yang diminta dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: meskipun sedih
  rationale: Partisip aoris pasif ini menyatakan bahwa raja merasa sedih; bentuk konsesif menangkap pertentangan antara kesedihannya dan perintah yang tetap ia keluarkan.
- source_word: ὁ βασιλεὺς
  choice: raja itu
  rationale: Padanan langsung dan wajar bagi βασιλεύς, dengan artikel diterjemahkan secara natural dalam konteks narasi.
- source_word: διὰ τοὺς ὅρκους
  choice: karena sumpah-sumpahnya
  rationale: διά dengan akusatif menyatakan sebab. Bentuk jamak dipertahankan, sedangkan pronomina -nya diperjelas secara wajar dari konteks.
- source_word: τοὺς συνανακειμένους
  choice: orang-orang yang makan bersamanya
  rationale: Ungkapan ini menunjuk kepada mereka yang berbaring semeja dengannya menurut kebiasaan makan pada masa itu; terjemahan ini menyampaikan makna sosialnya dengan bahasa Indonesia modern.
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: Menyampaikan arti κελεύω secara tepat dan mempertahankan nada formal narasi.
- source_word: δοθῆναι
  choice: agar permintaan itu dikabulkan
  rationale: Infinitif pasif secara harfiah berarti 'untuk diberikan'. Karena objeknya tersirat dan mengacu pada permintaan dalam konteks sebelumnya, terjemahan idiomatis ini membuat rujukannya jelas tanpa menyebut isi permintaan.
theological_decisions:
- issue: Motif tindakan raja
  choice: 'Mempertahankan dua alasan yang dinyatakan teks: sumpah-sumpahnya dan para tamu yang makan bersamanya.'
  alternative: Menafsirkan bahwa raja bertindak terutama karena takut kehilangan muka di depan para tamu.
  rationale: Teks menyebut kedua unsur dengan καί tetapi tidak menjelaskan hubungan psikologis atau bobot masing-masing; terjemahan tidak menambahkan motif yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat menonjolkan pertentangan konsesif tanpa menjadi kaku. 'Permintaan itu dikabulkan' dipilih sebagai ungkapan Indonesia yang alami untuk elipsis Yunani; catatan kaki tetap menjelaskan bentuk harfiahnya.
