  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: id
  text: Ketika para laki-laki di tempat itu mengenali Yesus, mereka mengirim kabar ke seluruh daerah sekitar itu[a] dan membawa kepada-Nya semua orang yang sakit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka mengirim ke seluruh daerah sekitar itu.” Bahasa Yunani tidak menyebutkan apa atau siapa yang dikirim; maksudnya mungkin mereka mengirim kabar atau mengutus orang-orang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “semua orang yang keadaannya buruk,” sebuah ungkapan yang berarti orang-orang yang sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες αὐτόν
  choice: mengenali Yesus
  rationale: Partisip aoris ἐπιγινώσκω dalam konteks ini menyatakan bahwa mereka mengenali atau mengetahui identitas Yesus. Nama “Yesus” dipakai secara alami dalam bahasa Indonesia untuk menjernihkan rujukan pronomina tanpa mengubah makna.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: orang-orang di tempat itu
  rationale: Walaupun ἄνδρες secara leksikal dapat berarti “laki-laki,” dalam tindakan komunal ini frasa tersebut secara alami merujuk kepada para penduduk setempat yang bertindak; “orang-orang” merupakan ungkapan Indonesia yang wajar tanpa menyimpulkan bahwa seluruh penduduk ikut serta.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: mereka menyebarkan kabar ke seluruh daerah sekitarnya
  rationale: ἀποστέλλω berarti “mengirim,” tetapi objek yang dikirim tidak dinyatakan dalam bahasa Yunani. Konteks menunjukkan penyampaian kabar atau pengutusan orang; “menyebarkan kabar” menyampaikan tindakan komunikatif itu secara alami, sementara catatan kaki mempertahankan elipsis sumber.
- source_word: προσήνεγκαν αὐτῷ
  choice: membawa kepada-Nya
  rationale: προσφέρω di sini berarti membawa orang kepada Yesus, bukan mempersembahkan dalam arti ritual.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: semua orang yang sakit
  rationale: Ungkapan idiomatis κακῶς ἔχειν berarti berada dalam keadaan buruk, khususnya sakit atau tidak sehat; “orang yang sakit” adalah padanan Indonesia yang jelas dan alami.
