translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kapital pada “-Nya” mengikuti kebiasaan penulisan Indonesia untuk pronomina yang merujuk kepada Yesus. Tanda koma penutup ayat sumber tidak dipertahankan karena ayat ini diterbitkan sebagai unit tersendiri.
