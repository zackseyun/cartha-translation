  text: Lalu ia mengutus orang untuk memenggal kepala Yohanes di dalam penjara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Setelah mengutus, ia memenggal kepala Yohanes di dalam penjara.” Bahasa Yunani memakai partisip aoris yang diikuti kata kerja utama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan urutan narasi. Dalam bahasa Indonesia, “Lalu” secara alami menyatakan kelanjutan peristiwa tanpa menambahkan hubungan sebab-akibat.
- source_word: πέμψας
  choice: ia menyuruh orang pergi
  rationale: Partisip aoris dari πέμπω menunjukkan bahwa sang penguasa mengutus seseorang sebelum tindakan utama berlangsung. Ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan adanya pelaksana yang diutus, tanpa menyatakan lebih jauh siapa orangnya.
- source_word: ἀπεκεφάλισεν
  choice: memenggal kepala
  rationale: Verba ἀποκεφαλίζω secara khusus berarti memenggal kepala. Walaupun tindakan itu dilakukan melalui orang yang diutus, tata bahasa Yunani tetap mengaitkannya dengan subjek, sehingga bentuk aktif dipertahankan dan tidak diperluas menjadi “memerintahkan agar ... dipenggal”.
- source_word: τὸν Ἰωάννην
  choice: Yohanes
  rationale: Nama diri itu disebut secara eksplisit, dan konteks langsung sudah menunjukkan Yohanes yang dimaksud; gelar “Pembaptis” tidak ditambahkan.
- source_word: ἐν τῇ φυλακῇ
  choice: di dalam penjara
  rationale: φυλακή di sini menunjuk pada tempat penahanan. “Di dalam penjara” mempertahankan makna lokatif yang konkret dan definit dari frasa Yunani.
