  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan ἀπεκεφάλισεν sebagai tindakan pemenggalan kepala dan mempertahankan lokasi penjara. Namun, “menyuruh orang pergi” lazimnya berarti menyuruh seseorang meninggalkan suatu tempat, bukan mengutus pelaksana; karena itu frasa ini tidak menyampaikan πέμψας secara tepat. Revisi memakai “mengutus orang untuk” agar pengiriman pelaksana dan urutan tindakan tersampaikan secara alami.
  naturalness: “Lalu ia menyuruh orang pergi dan memenggal kepala Yohanes” terasa janggal dan berpotensi dibaca seolah-olah ia menyuruh orang pergi, lalu ia sendiri melakukan pemenggalan. “Lalu ia mengutus orang untuk memenggal kepala Yohanes di dalam penjara” adalah bahasa Indonesia modern yang jelas dan lugas.
  terminology: “Memenggal kepala,” “Yohanes,” dan “di dalam penjara” sesuai dengan makna istilah Yunani dan register naratif. Tidak perlu menambahkan gelar “Pembaptis.”
