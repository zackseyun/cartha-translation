  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: id
  text: Lalu Petrus menjawab-Nya, “Tuhan, jika memang Engkau, perintahkanlah aku datang kepada-Mu di atas air.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Lalu Petrus menjawab-Nya
  rationale: Rumus naratif ini dialihkan secara alami ke dalam bahasa Indonesia; “lalu” menyatakan kesinambungan adegan tanpa memberi pertentangan yang terlalu kuat, dan akhiran “-Nya” mewakili objek datif αὐτῷ.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan “Tuhan” mempertahankan penghormatan sekaligus kemungkinan bobot kristologis κύριε dalam Injil Matius.
- source_word: εἰ σὺ εἶ
  choice: jika memang Engkau
  rationale: Ungkapan ini menyatakan identifikasi pribadi dalam konteks. “Memang” membuat idiom Indonesia alami tanpa mengubah syarat menjadi pernyataan keraguan mutlak.
- source_word: κέλευσόν με
  choice: perintahkanlah aku
  rationale: κελεύω menyatakan arahan yang berwenang; “perintahkanlah” mempertahankan kekuatan imperatif tersebut.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: datang kepada-Mu
  rationale: Gerak menuju Yesus paling alami dinyatakan dengan “datang kepada-Mu” dari sudut pandang percakapan.
- source_word: ἐπὶ τὰ ὕδατα
  choice: di atas air
  rationale: Dalam bahasa Indonesia, nomina “air” lazim dipakai sebagai nomina massa dan tidak memiliki penandaan jamak gramatikal; bentuk ini menyampaikan makna gerak di atas permukaan air secara alami.
theological_decisions:
- issue: Bobot sapaan κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: “Tuhan” tidak mereduksi sapaan itu menjadi kesopanan biasa dan tetap mempertahankan kemungkinan makna kristologisnya tanpa memaksakan penafsiran lebih jauh.
- issue: Nuansa syarat εἰ σὺ εἶ
  choice: jika memang Engkau
  alternative: jika Engkau adalah Dia; jika itu Engkau
  rationale: Pilihan ini mempertahankan identifikasi terhadap sosok yang sedang mendatangi para murid. Kata “memang” bersifat idiomatis dan tidak menentukan apakah Petrus sedang ragu, menguji, atau meminta peneguhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerjemahan Alkitab Indonesia. Tidak diperlukan catatan kaki karena perbedaan bentuk jamak Yunani pada ὕδατα tidak dapat dipertahankan secara alami dalam bahasa Indonesia dan tidak menghasilkan alternatif makna yang penting pada ayat ini.
