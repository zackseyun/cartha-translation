  source_fidelity: 'Teks Indonesia dengan setia menyampaikan unsur-unsur utama Yunani: Petrus menjawab Yesus, sapaan Κύριε sebagai “Tuhan,” syarat identifikasi εἰ σὺ εἶ, perintah berotoritas κέλευσόν, gerak menuju Yesus, dan posisi di atas air. “Jika memang Engkau” secara idiomatis mempertahankan elipsis identifikasi dalam εἰ σὺ εἶ tanpa mempersempit apakah Petrus ragu atau sedang mencari peneguhan.'
  naturalness: Bahasanya baku, lancar, dan sesuai register naratif Alkitab Indonesia modern. “Lalu” merupakan penghubung naratif yang wajar untuk δέ, sedangkan “di atas air” adalah padanan Indonesia yang alami untuk ἐπὶ τὰ ὕδατα; bentuk jamak Yunani tidak menuntut bentuk jamak eksplisit dalam bahasa Indonesia.
  terminology: “Petrus” dan “Tuhan” konsisten dengan pemakaian Indonesia Alkitabiah yang mapan. Kapitalisasi kata ganti bagi Yesus sesuai konvensi luas dan tidak mengubah makna. “Perintahkanlah” menangkap daya imperatif κελεύω dengan baik.
