  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: id
  text: Setelah menyeberang, mereka tiba di daratan Genesaret.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka tiba di daratan, di wilayah Genesaret.” Bahasa Yunani memadukan ungkapan “ke daratan” dengan “ke Genesaret”, yang menunjukkan bahwa mereka tiba di daratan atau tepi danau dalam kawasan Genesaret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: setelah menyeberang
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama. Dalam konteks perjalanan melintasi danau, 'setelah menyeberang' alami dan tidak menambahkan sarana yang tidak disebutkan.
- source_word: ἦλθον
  choice: mereka tiba
  rationale: Aoristus dari ἔρχομαι diikuti frasa tujuan; 'tiba' menyampaikan tercapainya tempat tujuan secara wajar dalam bahasa Indonesia.
- source_word: ἐπὶ τὴν γῆν
  choice: di daratan
  rationale: Secara harfiah berarti 'ke/di atas daratan'. Dalam konteks datang dari perairan, 'tiba di daratan' mempertahankan acuan pada tanah/daratan tanpa mempersempit γῆ menjadi 'pantai'.
- source_word: εἰς Γεννησαρέτ
  choice: Genesaret
  rationale: Frasa ini menunjukkan tujuan atau kawasan tempat mereka tiba. Susunan Indonesia 'daratan Genesaret' mengaitkan daratan itu dengan kawasan Genesaret, sedangkan catatan kaki mempertahankan kemungkinan konstruksi yang lebih harfiah.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: Nama tempat ditransliterasikan dengan bentuk Indonesia yang lazim.
