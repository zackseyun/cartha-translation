  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: id
  text: Setelah menyuruh orang banyak itu pergi, Yesus naik ke gunung seorang diri untuk berdoa.[a] Ketika hari sudah petang, Ia berada di sana sendirian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “secara tersendiri” untuk “seorang diri” (κατ’ ἰδίαν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Setelah menyuruh ... pergi
  rationale: Partisip aoris ini secara wajar menyatakan tindakan yang mendahului kata kerja utama. Ungkapan ini menyampaikan tindakan membubarkan atau menyuruh pergi tanpa kesan kasar.
- source_word: τοὺς ὄχλους
  choice: orang banyak itu
  rationale: Bentuk jamak Yunani menunjuk pada kelompok-kelompok orang yang telah berkumpul; dalam bahasa Indonesia, 'orang banyak itu' adalah ungkapan kolektif yang alami dan merujuk jelas pada kerumunan dalam konteks.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: naik ke gunung
  rationale: Menyampaikan gerak naik menuju kawasan gunung secara ringkas dan idiomatis.
- source_word: κατ’ ἰδίαν
  choice: seorang diri
  rationale: Frasa ini dapat berarti 'secara pribadi' atau 'sendirian'. Dalam konteks penarikan diri untuk berdoa, 'seorang diri' alami dan mempertahankan penekanan pada keterpisahan dari orang lain.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif ini menyatakan tujuan Yesus naik ke gunung.
- source_word: ὀψίας δὲ γενομένης
  choice: Ketika hari mulai malam
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan peralihan menuju waktu petang tanpa menentukan jam secara sempit.
- source_word: μόνος ἦν ἐκεῖ
  choice: Ia berada di sana sendirian
  rationale: Mempertahankan unsur lokasi ἐκεῖ dan penekanan μόνος pada keadaan tanpa orang lain.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yesus' dinyatakan untuk menjernihkan subjek tersirat bahasa Yunani, sedangkan 'Ia' digunakan selanjutnya. Penanda catatan kaki ditempatkan langsung setelah klausa yang memuat frasa terkait.
