  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: id
  text: Lalu gadis itu, setelah didorong oleh ibunya, berkata, “Berikan kepadaku di sini, di atas sebuah talam, kepala Yohanes Pembaptis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: setelah didorong
  rationale: Partisip pasif ini menunjukkan bahwa sang ibu lebih dahulu memengaruhi atau mendorong gadis itu. Ungkapan ini mempertahankan unsur pasif tanpa mempersempit maknanya menjadi perintah atau pengajaran formal.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: oleh ibunya
  rationale: ὑπό dengan genitif menyatakan pelaku dalam konstruksi pasif; 'oleh ibunya' adalah padanan langsung dan alami.
- source_word: Δός μοι
  choice: Berikan kepadaku
  rationale: Imperatif aoris menyampaikan permintaan langsung yang tegas. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan pronomina penerima.
- source_word: φησίν
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai bentuk kini historis, bahasa Indonesia lazim memakai 'berkata' dalam narasi lampau; daya hidup adegan tetap terpelihara tanpa susunan yang janggal.
- source_word: ὧδε
  choice: di sini
  rationale: Adverbia deiktis ini secara langsung berarti 'di sini' dan dapat mengisyaratkan tempat sekaligus tuntutan segera tanpa menambahkan 'sekarang' yang tidak eksplisit.
- source_word: ἐπὶ πίνακι
  choice: di atas sebuah talam
  rationale: πίναξ dalam konteks perjamuan menunjuk pada wadah saji datar. 'Talam' tepat, ringkas, dan cukup dikenal dalam bahasa Indonesia.
- source_word: τὴν κεφαλὴν
  choice: kepala
  rationale: Terjemahan langsung mempertahankan kekerasan dan kekhususan permintaan dalam narasi.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohanes Pembaptis
  rationale: Sebutan baku bahasa Indonesia ini tetap menyampaikan fungsi Yohanes sebagai orang yang membaptis, bukan nama denominasi.
theological_decisions:
- issue: Penerjemahan gelar βαπτιστής bagi Yohanes
  choice: Yohanes Pembaptis
  alternative: Yohanes yang Membaptis
  rationale: '''Yohanes Pembaptis'' adalah bentuk alami dan mapan dalam bahasa Indonesia serta masih mempertahankan daya deskriptif nomina pelaku Yunani. Alternatif yang lebih eksplisit terasa kurang wajar sebagai gelar.'
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Subjek eksplisit 'gadis itu' dipakai untuk menjernihkan rujukan pronomina feminin Yunani dalam ayat yang berdiri sendiri. Susunan permintaan tetap dekat dengan sumber, termasuk unsur 'di sini' dan wadah penyajian.
