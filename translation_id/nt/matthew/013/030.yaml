id: MAT.13.30
reference: Matthew 13:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: id
  text: Biarkan keduanya tumbuh bersama sampai waktu panen, dan pada waktu panen aku akan berkata kepada para penuai, ‘Kumpulkanlah terlebih dahulu gulma[a] itu dan ikatlah menjadi berkas-berkas untuk membakarnya, tetapi kumpulkanlah gandum itu ke dalam lumbungku.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemungkinan sejenis gulma yang disebut darnel; secara tradisional diterjemahkan “lalang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Biarkan
  rationale: Imperatif ini menyatakan izin atau perintah permisif; “biarkan” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: keduanya tumbuh bersama
  rationale: Mempertahankan gagasan eksplisit bahwa kedua jenis tanaman dibiarkan bertumbuh bersamaan.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: sampai waktu panen
  rationale: Menunjuk kepada panen sebagai peristiwa tertentu dalam perumpamaan; penambahan “waktu” membuat ungkapan Indonesia lebih alami.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: pada waktu panen
  rationale: καιρός menunjuk pada waktu yang tepat atau ditetapkan; ungkapan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: θερισταῖς
  choice: para penuai
  rationale: Istilah pertanian yang tepat bagi orang-orang yang melakukan pekerjaan menuai.
- source_word: Συλλέξατε πρῶτον
  choice: Kumpulkanlah terlebih dahulu
  rationale: Menyampaikan perintah dan urutan tindakan secara jelas.
- source_word: τὰ ζιζάνια
  choice: gulma
  rationale: ζιζάνια menunjuk pada tumbuhan pengganggu, kemungkinan darnel. “Gulma” akurat dan mudah dipahami tanpa menyamakan spesies itu dengan lalang Indonesia.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: ikatlah menjadi berkas-berkas
  rationale: Mempertahankan tindakan mengikat dan hasilnya berupa beberapa ikatan atau berkas.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: untuk dibakar
  rationale: Menyampaikan tujuan tindakan tersebut secara alami tanpa menambahkan penafsiran tentang penghukuman.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: tetapi kumpulkanlah gandum itu ke dalam lumbungku
  rationale: “Tetapi” mempertahankan kontras δέ, sedangkan “lumbung” merupakan padanan alami bagi tempat penyimpanan hasil panen.
theological_decisions:
- issue: Gambaran perumpamaan tentang pemisahan terakhir
  choice: Mempertahankan gambaran pertanian sebagaimana diucapkan dalam perumpamaan.
  alternative: Menerjemahkan dengan bahasa yang secara langsung menyebut penghakiman atau kebinasaan terakhir.
  rationale: Penjelasan eskatologis diberikan kemudian dalam pasal ini. Terjemahan ayat ini tidak semestinya memasukkan penjelasan tersebut ke dalam perkataan perumpamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan -lah mempertahankan nada perintah langsung tanpa terdengar kaku. Kata ganti “aku” tidak dikapitalisasi karena pada tingkat cerita penuturnya adalah pemilik ladang dalam perumpamaan.
