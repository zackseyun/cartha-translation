  source_fidelity: Terjemahan sangat dekat dengan teks Yunani. Namun, frasa tujuan «untuk dibakar» menggunakan bentuk pasif yang tidak menyatakan dengan jelas bahwa para penuai diperintahkan untuk membakar gulma itu (πρὸς τὸ κατακαῦσαι αὐτά). «Untuk membakarnya» mempertahankan pelaku tersirat dari perintah dan objek αὐτά.
  naturalness: Bahasa baku, jelas, dan sesuai register perumpamaan. Pengulangan «waktu panen» mencerminkan dua ungkapan temporal Yunani dan tetap dapat diterima dalam bahasa Indonesia.
  terminology: «Gulma», «para penuai», «berkas-berkas», dan «lumbungku» merupakan padanan yang alami dan setia. Catatan kaki dengan tepat mempertahankan identifikasi leksikal yang tidak pasti tanpa menyamakan darnel dengan lalang Indonesia.
