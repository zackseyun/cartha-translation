id: MAT.13.20
reference: Matthew 13:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: id
  text: Adapun yang ditaburkan di tanah berbatu[a] ialah orang yang mendengar firman itu dan segera menerimanya dengan sukacita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “di tempat-tempat berbatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Adapun yang ditaburkan di tanah berbatu
  rationale: Ungkapan partisipial berartikel ini diperlakukan sebagai substantif. “Adapun” menyatakan peralihan ringan dari δέ, sedangkan bentuk pasif “yang ditaburkan” mempertahankan metafora pertanian yang secara padat menghubungkan benih, tanah, dan orang yang dilambangkan.
- source_word: πετρώδη
  choice: tanah berbatu
  rationale: Istilah ini menunjuk pada tempat atau lahan yang berbatu. “Tanah berbatu” alami dalam bahasa Indonesia dan sesuai dengan gambaran tanah dalam perumpamaan.
- source_word: σπαρείς
  choice: ditaburkan
  rationale: Partisip aoris pasif dari σπείρω diterjemahkan dengan bentuk pasif yang ringkas untuk mempertahankan metafora penaburan.
- source_word: οὗτός ἐστιν
  choice: ialah orang
  rationale: Klausa identifikasi ini diterjemahkan secara alami dalam bahasa Indonesia. Kata “orang” memperjelas konstruksi tanpa mengubah hubungan metaforis yang tetap dipertahankan pada frasa sebelumnya.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: orang yang mendengar firman itu
  rationale: Partisip kini berartikel dialihkan menjadi klausa relatif yang idiomatis. “Firman” mempertahankan istilah λόγος dan resonansi tematisnya, sedangkan “itu” menandai rujukan tertentu dalam konteks.
- source_word: εὐθὺς
  choice: segera
  rationale: “Segera” merupakan padanan baku dan jelas yang mempertahankan penekanan pada cepatnya tanggapan.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Terjemahan ini mempertahankan bentuk nomina χαρά dan memberikan ragam bahasa yang wajar serta bermartabat.
- source_word: λαμβάνων αὐτόν
  choice: menerimanya
  rationale: λαμβάνω dalam konteks ini berarti menerima atau menyambut. “Menerimanya” cukup dekat dengan bentuk sumber, dan enklitik “-nya” merujuk pada firman itu.
theological_decisions:
- issue: Rujukan pihak yang ditaburkan dalam penjelasan perumpamaan
  choice: Mempertahankan ungkapan padat “yang ditaburkan di tanah berbatu”, lalu mengidentifikasinya sebagai orang yang mendengar firman.
  alternative: 'Menjelaskan secara lebih interpretatif: “Benih yang ditaburkan di tanah berbatu menggambarkan orang yang ...”'
  rationale: Teks Yunani mempertahankan ketegangan metaforis dengan menyebut “yang ditaburkan” lalu mengidentifikasinya sebagai pendengar. Terjemahan tidak menguraikan metafora itu menjadi parafrasa yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. “Adapun” cocok untuk peralihan antarkategori tanah dalam penjelasan perumpamaan; “sukacita” mempertahankan nuansa biblis yang tetap mudah dipahami.
