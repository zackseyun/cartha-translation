  terminology: “Firman” adalah padanan yang lazim dan tepat dalam register Alkitab untuk λόγος dalam konteks ini. “Sukacita” juga baku dan sesuai register tanpa menjadi tidak dapat dipahami. Catatan kaki menyediakan alternatif leksikal yang sah untuk πετρώδη.
