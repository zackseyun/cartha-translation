  source_fidelity: Terjemahan mempertahankan konstruksi metaforis padat dari ὁ ... σπαρείς dan kemudian mengidentifikasikannya sebagai orang yang mendengar firman. “Tanah berbatu” memadai untuk τὰ πετρώδη, sementara “segera” dan “dengan sukacita” dengan setia menerjemahkan εὐθύς dan μετὰ χαρᾶς. Tidak ada penambahan interpretatif yang menghilangkan ambiguitas metafora.
