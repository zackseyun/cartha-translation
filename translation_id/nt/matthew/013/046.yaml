  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: id
  text: Setelah menemukan sebutir mutiara yang sangat berharga[a], ia pergi, menjual segala miliknya, lalu membeli mutiara itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebutir mutiara yang bernilai tinggi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Setelah menemukan
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba-verba utama. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena urutan narasi sudah jelas.
- source_word: ἕνα
  choice: sebutir
  rationale: Numeralia eksplisit dipertahankan melalui penggolong bilangan alami untuk benda bulat kecil; bentuk ini tetap menonjolkan satu mutiara tertentu.
- source_word: πολύτιμον
  choice: yang sangat berharga
  rationale: Ungkapan ini menyampaikan nilai luar biasa secara alami dalam bahasa Indonesia modern dan tetap memungkinkan makna ‘bernilai tinggi’ maupun ‘berharga’.
- source_word: μαργαρίτην
  choice: mutiara
  rationale: Padanan leksikal baku dan sesuai konteks.
- source_word: ἀπελθὼν
  choice: ia pergi
  rationale: Partisip diterjemahkan sebagai verba berhingga agar urutan tindakan terdengar wajar dalam bahasa Indonesia.
- source_word: πέπρακεν
  choice: menjual
  rationale: Perfek Yunani dipadankan secara idiomatis dalam rangkaian tindakan lampau; aspek tindakan yang telah tuntas tampak dari urutannya sebelum pembelian.
- source_word: πάντα ὅσα εἶχεν
  choice: segala miliknya
  rationale: Padanan ringkas dan alami yang mempertahankan cakupan menyeluruh dari πάντα serta gagasan kepemilikan dalam ὅσα εἶχεν.
- source_word: ἠγόρασεν
  choice: membeli
  rationale: Padanan Indonesia modern yang langsung dan alami.
- source_word: αὐτόν
  choice: mutiara itu
  rationale: Pronomina Yunani merujuk kembali kepada μαργαρίτην. Pengulangan nomina dalam bahasa Indonesia menghindari kerancuan yang dapat timbul dari ‘-nya’ atau ‘itu’ saja.
