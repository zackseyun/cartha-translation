  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: id
  text: Ia menjawab mereka, “Kepadamu telah dikaruniakan untuk mengetahui rahasia-rahasia Kerajaan Surga,[a] tetapi kepada mereka tidak dikaruniakan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “misteri-misteri Kerajaan Surga.” Istilah Yunaninya menunjuk pada perkara ilahi yang dahulu tersembunyi dan kini disingkapkan.
    reason: lexical_alternative
  - marker: b
    text: Bentuk pasif “telah dikaruniakan” dan “tidak dikaruniakan” tidak menyebut pemberinya. Dalam konteks Alkitab, pasif semacam ini sering dipahami merujuk kepada Allah.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani bercorak Semitis yang secara wajar berarti ‘menjawab’; bahasa Indonesia tidak perlu mempertahankan pengulangan ‘menjawab dan berkata’.
- source_word: Ὅτι
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam konteks ini ὅτι memperkenalkan isi jawaban. Kutipan langsung dalam bahasa Indonesia sudah menandai fungsi itu secara alami; menerjemahkannya ‘karena’ dapat memberi kesan hubungan sebab yang terlalu tegas.
- source_word: ὑμῖν δέδοται
  choice: kepadamu telah diberikan
  rationale: Bentuk ini mempertahankan datif penerima, aspek hasil kini dari bentuk perfek, dan konstruksi pasif tanpa menyebut pemberinya.
- source_word: γνῶναι
  choice: untuk mengetahui
  rationale: ‘Mengetahui’ dekat dengan arti dasar γινώσκω dan tidak mempersempitnya menjadi sekadar pemahaman intelektual.
- source_word: τὰ μυστήρια
  choice: rahasia-rahasia
  rationale: Dalam konteks ini μυστήρια menunjuk pada perkara ilahi yang tersembunyi lalu disingkapkan, bukan sesuatu yang sekadar sulit ditebak. ‘Rahasia-rahasia’ menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ini merupakan padanan Indonesia yang alami dan lazim bagi ungkapan khas Matius tersebut; huruf kapital menandai pemerintahan atau ranah kerajaan ilahi, bukan kerajaan biasa.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: tetapi kepada mereka hal itu tidak diberikan
  rationale: ‘Mereka’ alami dalam bahasa Indonesia, sedangkan ‘hal itu’ memperjelas bahwa pemberian yang sama sedang dikontraskan tanpa menambahkan isi baru.
theological_decisions:
- issue: Pelaku ilahi yang tersirat dalam δέδοται
  choice: Mempertahankan bentuk pasif tanpa menyebut Allah secara eksplisit
  alternative: Allah telah memberimu / telah diberikan oleh Allah
  rationale: Teks Yunani membiarkan pemberi tersirat. Bentuk pasif mempertahankan kemungkinan pasif ilahi sekaligus tidak mengubah implikasi menjadi pernyataan eksplisit.
- issue: Makna μυστήρια dalam konteks Kerajaan
  choice: rahasia-rahasia
  alternative: misteri-misteri / perkara-perkara tersembunyi
  rationale: Pilihan ini menyatakan realitas ilahi yang sebelumnya tersembunyi dan kini dikaruniakan untuk diketahui, tanpa memasukkan sistem teologis tertentu atau kesan teka-teki yang tak dapat dipahami.
- issue: Cakupan penyangkalan οὐ δέδοται
  choice: hal itu tidak diberikan
  alternative: mereka tidak diberi kemampuan untuk mengetahuinya
  rationale: Teks meniadakan pemberian tersebut, tetapi tidak menguraikan apakah yang dimaksud adalah kemampuan, izin, atau penyingkapan. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘kepadamu ... tetapi kepada mereka’ mempertahankan penekanan kontras Yunani. ‘Ia’ dipakai sebagai pronomina naratif yang ringkas; ‘Kerajaan Surga’ mengikuti istilah Matius yang lazim.
