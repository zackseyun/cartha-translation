id: MAT.13.56
reference: Matthew 13:56
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: id
  text: Bukankah semua saudara perempuan-Nya ada bersama kita? Jadi, dari mana orang ini memperoleh semuanya itu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat perempuan.” Kata Yunani ini biasanya berarti “saudara perempuan” di sini, tetapi sebagian orang menafsirkannya secara lebih luas berdasarkan perdebatan teologis yang muncul kemudian.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: saudara perempuan
  rationale: Makna kekeluargaan biasa paling sesuai dengan konteks pembicaraan warga tentang keluarga Yesus; pilihan ini tidak memasukkan penafsiran teologis yang muncul kemudian.
- source_word: οὐχὶ πᾶσαι
  choice: Bukankah semua
  rationale: Bentuk pertanyaan retoris ini mengharapkan jawaban ya dan tetap menekankan keseluruhan saudara perempuan-Nya.
- source_word: πρὸς ἡμᾶς
  choice: ada bersama kita
  rationale: Ungkapan ini menyatakan keberadaan atau pergaulan mereka di tengah komunitas setempat dan terdengar alami dalam bahasa Indonesia.
- source_word: πόθεν
  choice: dari mana
  rationale: Mempertahankan pertanyaan mengenai sumber atau asal dari hal-hal yang dimiliki atau dilakukan Yesus.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik warga dari pengetahuan mereka tentang keluarga Yesus.
- source_word: τούτῳ
  choice: orang ini
  rationale: Menjaga daya tunjuk demonstratif dan nada yang agak meremehkan dalam konteks.
- source_word: ταῦτα πάντα
  choice: semuanya itu
  rationale: Secara alami merujuk kembali kepada hikmat dan perbuatan-perbuatan ajaib yang disebutkan dalam konteks sebelumnya.
theological_decisions:
- issue: Arti sebutan bagi saudara-saudara perempuan Yesus
  choice: Menerjemahkan ἀδελφαὶ menurut arti lazimnya sebagai “saudara perempuan”.
  alternative: Kerabat perempuan atau saudara sepupu perempuan.
  rationale: Teks Yunani paling wajar menunjuk kepada saudara perempuan. Terjemahan tidak semestinya menyelesaikan perdebatan teologis yang muncul kemudian dengan memperluas arti kata tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lisan yang tetap bermartabat. “Bukankah” mempertahankan sifat retoris pertanyaan, sedangkan “orang ini” mencerminkan nada warga yang agak meremehkan.
