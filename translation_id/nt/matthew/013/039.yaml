  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: id
  text: Musuh yang menaburkan lalang itu adalah Iblis; masa panen adalah akhir zaman[a], dan para penuai adalah para malaikat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesudahan zaman”; secara tradisional, “akhir dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: musuh
  rationale: Padanan baku dan alami yang mempertahankan gambaran tentang lawan pribadi dalam penjelasan perumpamaan ini.
- source_word: ὁ σπείρας αὐτά
  choice: yang menaburkan benih lalang itu
  rationale: Partisip aoris menunjuk kepada tindakan penaburan yang telah dilakukan. Acuan pronomina αὐτά dibuat eksplisit sebagai benih lalang agar jelas dan alami dalam bahasa Indonesia, sesuai konteks dekat perumpamaan.
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam konteks ini, διάβολος merupakan sebutan bagi pribadi yang dikenal sebagai Iblis, bukan sekadar gambaran etimologis tentang seorang pemfitnah.
- source_word: θερισμὸς
  choice: masa panen
  rationale: Mempertahankan metafora pertanian sekaligus menyatakan peristiwa atau waktu panen secara alami dalam bahasa Indonesia.
- source_word: συντέλεια αἰῶνός
  choice: akhir zaman
  rationale: Ungkapan Indonesia yang alami untuk akhir suatu masa atau tatanan zaman; menghindari kesan bahwa teks secara khusus mengatakan kehancuran dunia material.
- source_word: θερισταὶ
  choice: para penuai
  rationale: Padanan yang jelas bagi orang-orang yang menuai dan mempertahankan hubungan leksikal dengan gambaran panen.
- source_word: ἄγγελοί
  choice: para malaikat
  rationale: Konteks eskatologis menunjukkan makhluk surgawi, sehingga 'malaikat' lebih tepat daripada arti umum 'utusan'.
- source_word: δὲ
  choice: pemisahan kalimat dan koordinasi
  rationale: Pengulangan δέ menggerakkan penjelasan dari satu unsur ke unsur berikutnya; dalam bahasa Indonesia fungsinya disampaikan secara alami melalui pemisahan kalimat dan kata 'dan'.
theological_decisions:
- issue: Makna αἰών dalam frasa eskatologis συντέλεια αἰῶνός
  choice: akhir zaman
  alternative: kesudahan zaman; akhir dunia
  rationale: '''Akhir zaman'' mempertahankan makna temporal αἰών tanpa secara tidak perlu mengartikannya sebagai kebinasaan dunia material. ''Kesudahan zaman'' lebih menonjolkan nuansa penyempurnaan atau penggenapan συντέλεια, tetapi kurang lazim dalam bahasa Indonesia sehari-hari; ''akhir dunia'' bersifat tradisional namun kurang tepat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lugas bagi pembaca umum, sambil mempertahankan metafora pertanian dan ketegangan eskatologis teks sumber.
