  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Metafora “mencekik” dipertahankan, sedangkan rujukan pronomina terakhir diperjelas untuk mencegah ambiguitas gramatikal dalam bahasa Indonesia.
