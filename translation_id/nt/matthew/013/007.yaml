  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: id
  text: Benih-benih yang lain jatuh di antara semak-semak berduri[a], lalu semak-semak berduri itu tumbuh dan mencekik benih-benih tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jatuh ke atas semak-semak berduri”; dalam konteks pertanian, maksudnya benih itu jatuh di tempat semak-semak berduri tumbuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Benih-benih yang lain
  rationale: Adjektiva netral jamak ini dipakai secara substantival dan, dalam konteks perumpamaan, merujuk secara tersirat kepada benih. Menyebutkan “benih-benih” memperjelas rujukannya secara wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: lalu
  rationale: Di sini δέ merupakan penghubung ringan yang meneruskan urutan cerita, bukan pertentangan kuat. “Lalu” terdengar alami dalam narasi Indonesia.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Bentuk aoris dari πίπτω secara langsung berarti “jatuh”. Pilihan ini mempertahankan verba Yunani dan tidak menggantinya dengan ungkapan yang lebih interpretatif seperti “ditaburkan”.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: di antara semak-semak berduri
  rationale: Walaupun ἐπί dengan akusatif secara harfiah dapat berarti “ke atas/di atas”, konteks pertanian menunjukkan benih jatuh di kawasan tempat semak berduri tumbuh. Ungkapan “di antara” alami dan tepat dalam bahasa Indonesia; perbedaan harfiahnya dicatat dalam catatan kaki.
- source_word: ἀκάνθας / ἄκανθαι
  choice: semak-semak berduri
  rationale: ἄκανθα dapat menunjuk pada duri atau tumbuhan berduri. Dalam konteks tumbuhan yang kemudian bertumbuh, “semak-semak berduri” memberikan gambaran yang jelas dan alami.
- source_word: ἀνέβησαν
  choice: tumbuh
  rationale: ἀναβαίνω secara harfiah berarti naik atau muncul ke atas. Dalam konteks tanaman, “tumbuh” menyampaikan gerak pertumbuhan ke atas secara alami tanpa penjelasan berlebih.
- source_word: ἔπνιξαν
  choice: mencekik
  rationale: πνίγω berarti mencekik atau membuat sesak. “Mencekik” mempertahankan metafora Yunani yang kuat tentang semak berduri yang menghalangi kehidupan tanaman lain.
- source_word: αὐτά
  choice: benih-benih tersebut
  rationale: Pronomina netral jamak ini merujuk kembali kepada benih-benih yang tersirat. Rujukannya diungkapkan kembali agar jelas dalam bahasa Indonesia, terutama karena nomina jamak terdekat adalah semak-semak berduri.
