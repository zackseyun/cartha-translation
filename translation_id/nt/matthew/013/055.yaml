  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: id
  text: “Bukankah Dia ini anak tukang kayu? Bukankah ibu-Nya bernama Maria, dan saudara-saudara-Nya[a] Yakobus, Yusuf[b], Simon, dan Yudas?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudara” biasanya berarti saudara laki-laki, tetapi dalam konteks ini sebagian orang memahaminya secara lebih luas sebagai kaum kerabat atau sanak saudara.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah memuat “Yoses” sebagai ganti “Yusuf.”
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: tukang kayu
  rationale: τέκτων menunjuk pada perajin yang bekerja dengan kayu atau dalam bidang pembangunan. “Tukang kayu” merupakan padanan Indonesia yang paling alami dan lazim dalam konteks ini, meskipun cakupan istilah Yunaninya dapat lebih luas.
- source_word: υἱός
  choice: anak
  rationale: Konteks keluarga langsung memastikan makna hubungan anak laki-laki; dalam bahasa Indonesia, “anak” lebih alami daripada “putra” dalam pertanyaan warga sekampung ini.
- source_word: λέγεται
  choice: bernama
  rationale: Bentuk pasif ini secara idiomatis berarti “disebut” atau “bernama.” Karena yang menyusul adalah nama diri, “bernama” paling alami dalam bahasa Indonesia.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Perjanjian Baru bahasa Indonesia.
- source_word: ἀδελφοὶ
  choice: saudara-saudara
  rationale: Makna leksikal yang lazim ialah saudara laki-laki. Bahasa Indonesia tidak selalu menandai gender dalam kata “saudara,” tetapi nama-nama yang menyusul memperjelas bahwa semuanya laki-laki. Kemungkinan pemaknaan hubungan kekerabatan yang lebih luas dicatat tanpa menggantikan makna permukaan teks.
- source_word: Ἰάκωβος
  choice: Yakobus
  rationale: Bentuk nama yang baku dalam tradisi Perjanjian Baru bahasa Indonesia.
- source_word: Ἰωσὴφ
  choice: Yusuf
  rationale: SBLGNT membaca Ἰωσήφ, yang secara baku diterjemahkan “Yusuf”; varian teks “Yoses” dicatat dalam catatan kaki.
- source_word: Σίμων
  choice: Simon
  rationale: Transliterasi baku nama ini dalam bahasa Indonesia.
- source_word: Ἰούδας
  choice: Yudas
  rationale: Transliterasi baku nama Yunani ini dalam konteks Perjanjian Baru bahasa Indonesia.
- source_word: οὐχ ... ;
  choice: Bukankah ...? Bukankah ...?
  rationale: Partikel οὐχ membuka pertanyaan retoris yang mengharapkan jawaban membenarkan. “Bukankah” mempertahankan fungsi dan nada tersebut secara alami.
theological_decisions:
- issue: Makna ἀδελφοὶ αὐτοῦ dalam hubungan keluarga Yesus
  choice: Menerjemahkannya sebagai “saudara-saudara-Nya” dalam teks utama
  alternative: Kaum kerabat-Nya atau sanak saudara-Nya dalam arti hubungan keluarga yang lebih luas
  rationale: Makna biasa kata Yunani itu adalah saudara-saudara, sehingga teks utama mempertahankan makna permukaannya. Catatan kaki mengakui kemungkinan arti kekerabatan yang lebih luas tanpa memutuskan perdebatan teologis tentang hubungan biologis orang-orang ini dengan Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk “Bukankah” menjaga sifat retoris kedua pertanyaan. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan hormat yang lazim dalam penerbitan Alkitab bahasa Indonesia, tanpa mengubah makna sumber.
