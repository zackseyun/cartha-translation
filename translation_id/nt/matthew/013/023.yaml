  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: id
  text: 'Adapun yang ditaburkan di tanah yang baik ialah orang yang mendengar firman dan memahaminya. Orang itu sungguh berbuah dan menghasilkan: ada yang seratus, ada yang enam puluh, dan ada yang tiga puluh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang satu seratus, yang lain enam puluh, dan yang lain tiga puluh”; ini menunjuk pada hasil panen yang berbeda-beda. Banyak terjemahan menyatakannya sebagai “seratus kali lipat ... enam puluh ... tiga puluh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: di tanah yang baik
  rationale: Dalam konteks pertanian, γῆ menunjuk pada tanah tempat benih jatuh. 'Tanah yang baik' alami dalam bahasa Indonesia dan menyampaikan tanah yang cocok atau subur, bukan penilaian moral.
- source_word: σπαρείς
  choice: benih yang ditaburkan
  rationale: Partisip pasif aoristus mempertahankan gambaran penaburan. Kata 'benih' ditambahkan secara wajar dari metafora dalam konteks agar rujukan kepada orang yang dilambangkan oleh benih dapat dipahami.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: orang yang mendengar firman
  rationale: Bentuk partisip kini menggambarkan ciri orang tersebut. 'Firman' mempertahankan idiom Injil dan gaung antarteks tanpa mengubahnya menjadi istilah doktrinal yang lebih khusus.
- source_word: συνιείς
  choice: memahaminya
  rationale: συνίημι menyatakan memahami makna yang didengar; akhiran '-nya' secara alami merujuk kepada firman.
- source_word: δὴ
  choice: benar-benar
  rationale: Partikel δή memberi penegasan. 'Benar-benar' menyampaikan tekanan itu secara alami tanpa melebihkan maknanya.
- source_word: καρποφορεῖ
  choice: berbuah
  rationale: Mempertahankan metafora pertanian yang menjadi pusat perumpamaan dan lazim dipahami dalam bahasa Indonesia.
- source_word: ποιεῖ
  choice: menghasilkan
  rationale: Dalam konteks ini ποιέω menunjuk pada menghasilkan panen. Diterjemahkan tersendiri agar dua verba Yunani, 'berbuah' dan 'menghasilkan', tetap tampak.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: yang satu seratus kali lipat, yang lain enam puluh kali lipat, dan yang lain tiga puluh kali lipat
  rationale: Konstruksi distributif menunjukkan hasil yang berbeda-beda. 'Kali lipat' tidak dinyatakan secara eksplisit, tetapi secara idiomatis menjelaskan angka sebagai perbandingan hasil panen, bukan jumlah mutlak.
theological_decisions:
- issue: Sifat tanggapan terhadap firman dalam perumpamaan
  choice: 'Ayat diterjemahkan secara deskriptif: orang yang dilambangkan oleh tanah yang baik mendengar, memahami, dan berbuah dalam ukuran yang berbeda-beda.'
  alternative: Terjemahan yang lebih interpretatif dapat secara eksplisit menekankan ketekunan atau pertobatan sejati.
  rationale: Teks Yunani menekankan mendengar, memahami, dan berbuah, tetapi tidak secara eksplisit menguraikannya dengan kategori doktrinal yang muncul kemudian. Terjemahan mempertahankan kategori teks tanpa memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Namun' menandai kontras δέ dengan jenis tanah sebelumnya. Struktur kalimat dipecah agar jelas, sementara metafora benih, tanah, dan buah tetap dipertahankan.
