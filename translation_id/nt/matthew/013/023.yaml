  rationale: The revision preserves the Greek metaphor and its description of the good-soil hearer, retains the emphasis of δή with “sungguh,” and keeps the two fruit-production verbs distinct. It removes the non-explicit “kali lipat” from the main text while preserving that familiar interpretive expression in a footnote.
