- from: 'Namun, benih yang ditaburkan di tanah yang baik ialah orang yang mendengar firman dan memahaminya. Ia benar-benar berbuah dan menghasilkan: yang satu seratus kali lipat, yang lain enam puluh kali lipat, dan yang lain tiga puluh kali lipat.[a]'
