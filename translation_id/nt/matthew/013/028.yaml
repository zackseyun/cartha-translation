base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: id
  text: Ia berkata kepada mereka, “Seorang musuh telah melakukan ini.” Lalu budak-budaknya[a] berkata kepadanya, “Kalau begitu, apakah Tuan mau kami pergi dan mengumpulkan lalang-lalang itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambanya.” Kata Yunani doulos/douloi dapat berarti “budak” atau “hamba,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: berkata
  rationale: Verba ujaran standar yang paling langsung dan alami dalam narasi Indonesia.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: seorang musuh
  rationale: Ungkapan ini secara harfiah menyebut seorang manusia yang bermusuhan; bahasa Indonesia secara idiomatis cukup mengatakan ‘seorang musuh’ sambil tetap mengindividualkan pelakunya.
- source_word: τοῦτο ἐποίησεν
  choice: yang melakukan ini
  rationale: Konstruksi ini menyampaikan tindakan lampau secara alami dalam bahasa Indonesia; bentuk relatif menghasilkan jawaban idiomatis atas situasi yang sedang dibicarakan.
- source_word: δοῦλοι
  choice: budak-budaknya
  rationale: Dalam lingkungan rumah tangga dan pertanian kuno ini, istilah tersebut menunjukkan orang-orang yang berada di bawah kepemilikan atau kuasa tuan. ‘Budak’ mempertahankan kenyataan sosial itu; ‘hamba’ dicatat sebagai alternatif.
- source_word: Θέλεις
  choice: apakah Tuan mau
  rationale: ‘Mau’ merupakan padanan modern dan alami untuk kehendak atau keinginan. Sapaan ‘Tuan’ tersirat oleh hubungan para budak dengan pemilik dan diperlukan agar pertanyaan terdengar wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Jadi
  rationale: Di sini οὖν menghubungkan jawaban pemilik dengan usulan berikutnya, sehingga ‘Jadi’ lebih tepat daripada penanda urutan waktu murni.
- source_word: ἀπελθόντες
  choice: kami pergi
  rationale: Partisip ini menyatakan tindakan yang mendahului dan menyertai pengumpulan; koordinasi ‘pergi dan’ alami dalam bahasa Indonesia.
- source_word: συλλέξωμεν
  choice: mengumpulkan
  rationale: Kata ini mempertahankan gambaran mengumpulkan lalang untuk disingkirkan tanpa mempersempitnya menjadi ‘mencabut’, yang baru dinyatakan secara lebih eksplisit dalam konteks lanjutan.
- source_word: αὐτά
  choice: lalang-lalang itu
  rationale: Pronomina netral jamak merujuk pada lalang dalam konteks sebelumnya. Mengulangi nomina memperjelas rujukan yang dalam bahasa Indonesia dapat kabur jika hanya memakai ‘mereka’ atau ‘itu’.
theological_decisions:
- issue: Penerjemahan δοῦλοι dalam konteks perumpamaan
  choice: budak-budaknya
  alternative: hamba-hambanya
  rationale: ‘Budak’ mempertahankan status sosial terikat dan hubungan hierarkis dengan pemilik. Karena ‘hamba’ lazim dalam tradisi Alkitab Indonesia dan dapat sesuai dengan konteks rumah tangga, alternatif itu dipertahankan dalam catatan kaki tanpa mengaburkan makna utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami bagi pembaca umum. ‘Lalang-lalang itu’ memperjelas anteseden αὐτά dari ayat sebelumnya, sedangkan ‘Tuan’ mengungkapkan sapaan yang secara pragmatis tersirat dalam relasi sosial para penutur.
