  naturalness: Teks revisi memakai Bahasa Indonesia baku yang lancar. “Tidak mempunyai akar dalam dirinya sendiri” mempertahankan metafora dan daya refleksif Yunani, sedangkan “hanya bertahan sebentar” menyampaikan πρόσκαιρος secara idiomatis.
  terminology: “Firman” mempertahankan kaitan dengan λόγος dalam perumpamaan. “Penderitaan atau penganiayaan” merupakan padanan modern yang jelas untuk θλῖψις ἢ διωγμός. “Tersandung” mempertahankan metafora dan ambiguitas σκανδαλίζεται tanpa memaksakan kesimpulan doktrinal.
