  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: id
  text: Namun, ia tidak mempunyai akar dalam dirinya sendiri, melainkan hanya bertahan sebentar. Ketika penderitaan atau penganiayaan timbul karena firman itu, ia segera tersandung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia segera jatuh” atau “ia segera berpaling.” Kata Yunani ini dapat berarti tersandung, jatuh, atau menjadi berpaling karena suatu batu sandungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: firman itu tidak berakar dalam dirinya
  rationale: Mempertahankan metafora akar dalam konteks perumpamaan, sambil memakai susunan Indonesia yang alami. Subjek tersirat dipahami dari konteks sebagai firman yang diterima orang itu; frasa 'dalam dirinya' mempertahankan daya refleksif ἐν ἑαυτῷ.
- source_word: πρόσκαιρός
  choice: ia hanya bertahan sebentar
  rationale: Mengungkapkan bahwa orang itu bertahan hanya untuk waktu terbatas. Bentuk ini lebih alami daripada menyebut orang tersebut 'sementara' dan tidak menambahkan durasi tertentu.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: ketika penindasan atau penganiayaan terjadi
  rationale: Genitif absolut diterjemahkan sebagai klausa waktu. 'Penindasan' menyampaikan tekanan atau kesesakan θλῖψις, sedangkan 'penganiayaan' merupakan padanan baku bagi διωγμός.
- source_word: διὰ τὸν λόγον
  choice: karena firman itu
  rationale: Mempertahankan hubungan leksikal dengan λόγος dalam perumpamaan dan menunjukkan bahwa tekanan timbul akibat firman yang diterima.
- source_word: εὐθὺς
  choice: segera
  rationale: Menjaga penekanan pada reaksi yang langsung.
- source_word: σκανδαλίζεται
  choice: meninggalkan imannya
  rationale: Dalam konteks penerimaan firman yang tidak bertahan saat tekanan datang, ungkapan ini menyampaikan kegagalan kesetiaan secara jelas bagi pembaca modern. Catatan kaki mempertahankan keluasan metafora Yunani.
- source_word: δὲ ... ἀλλὰ
  choice: Namun ... sehingga
  rationale: Hubungan pertentangan dengan ayat sebelumnya ditandai oleh 'Namun'; akibat praktis dari tidak berakar disampaikan secara alami dengan 'sehingga' tanpa mengubah alur pemikiran.
theological_decisions:
- issue: Makna σκανδαλίζεται dalam konteks pemuridan
  choice: meninggalkan imannya
  alternative: tersandung; jatuh; berpaling
  rationale: Pilihan utama menyatakan runtuhnya respons iman di bawah tekanan tanpa menetapkan suatu sistem doktrinal mengenai kemurtadan. Alternatif metaforis dicatat agar keluasan istilah Yunani dan ketegangan teologisnya tetap terlihat.
- issue: Subjek yang tidak berakar
  choice: firman itu tidak berakar dalam dirinya
  alternative: ia tidak mempunyai akar dalam dirinya
  rationale: Secara gramatikal, subjek orang tersebut dapat dipahami dari konteks, tetapi metafora benih dan akar dalam perumpamaan membuat ungkapan tentang firman yang tidak berakar alami dalam bahasa Indonesia. Alternatif lebih harfiah tetap mungkin; pilihan ini tidak dimaksudkan untuk memindahkan tanggung jawab teologis dari orang itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora akar dan istilah 'firman' dipertahankan, sedangkan ungkapan durasi dan respons di bawah tekanan dibuat idiomatis. Penanda catatan kaki [a] ditempatkan setelah klausa yang diterangkannya.
