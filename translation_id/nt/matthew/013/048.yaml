  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: id
  text: Ketika jala itu penuh, mereka menariknya ke pantai, lalu duduk dan mengumpulkan ikan yang baik ke dalam wadah-wadah[a], tetapi membuang ikan yang busuk ke luar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana-bejana.” Istilah Yunani yang dipakai bersifat umum untuk wadah penampung, tidak harus keranjang.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang tidak baik.” Kata Yunani ini dapat berarti “busuk,” “rusak,” atau secara lebih umum “tidak berguna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: jala itu
  rationale: Kata ganti relatif feminin ini merujuk kepada jala dalam ayat sebelumnya. Mengulangi nomina tersiratnya menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: ἐπληρώθη
  choice: penuh
  rationale: Bentuk pasif aoris dari πληρόω menyatakan bahwa jala telah terisi penuh; dalam konteks ini, 'jala itu penuh' lebih alami daripada bentuk pasif harfiah 'jala itu dipenuhi'.
- source_word: ἀναβιβάσαντες
  choice: menariknya
  rationale: Partisip ini menggambarkan tindakan menaikkan jala dari air ke pantai. 'Menariknya' menyampaikan tindakan tersebut secara alami tanpa menambahkan cara yang tidak dinyatakan.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ke pantai
  rationale: αἰγιαλός menunjuk pada pantai atau tepian perairan; 'ke pantai' jelas dan sesuai dengan latar penangkapan ikan.
- source_word: καθίσαντες
  choice: lalu duduk
  rationale: Partisip aoris ini menyatakan tindakan berikutnya dalam urutan cerita. 'Lalu' memperjelas urutan tersebut secara wajar dalam bahasa Indonesia.
- source_word: συνέλεξαν
  choice: mengumpulkan
  rationale: Kata kerja ini berarti mengumpulkan menjadi satu dan cocok untuk tindakan memilah hasil tangkapan.
- source_word: τὰ καλά
  choice: ikan yang baik
  rationale: Secara harfiah teks menyebut 'yang baik'; 'ikan' disuplai dari konteks agar rujukannya jelas tanpa mengubah gambaran perumpamaan.
- source_word: εἰς ἄγγη
  choice: ke dalam wadah-wadah
  rationale: ἄγγη adalah istilah umum bagi tempat atau wadah penampung. 'Wadah-wadah' mempertahankan keluasan makna dan tidak mempersempitnya menjadi keranjang.
- source_word: τὰ δὲ σαπρά
  choice: ikan yang busuk
  rationale: σαπρός dapat berarti busuk, rusak, atau secara lebih umum tidak berguna. 'Busuk' mempertahankan gambaran konkret, sedangkan catatan kaki menjaga alternatif maknanya.
- source_word: ἔξω ἔβαλον
  choice: membuang
  rationale: Gabungan ini bermakna melempar atau membuang ke luar. 'Membuang' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan penolakan.
theological_decisions:
- issue: Penafsiran gambaran pemilahan dalam perumpamaan
  choice: Ayat diterjemahkan secara konkret sebagai adegan penangkapan dan pemilahan ikan.
  alternative: Menggunakan bahasa tafsiran yang sejak ayat ini secara langsung menunjuk pada penghakiman terakhir.
  rationale: Ayat ini masih menyajikan gambaran perumpamaan, sedangkan penjelasan teologisnya muncul dalam ayat-ayat berikutnya. Terjemahan tidak mendahului penjelasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang sederhana dan bermartabat. Pengulangan 'ikan' memperjelas kedua kelompok dalam pemilahan, sementara catatan kaki mempertahankan keluasan makna istilah Yunani.
