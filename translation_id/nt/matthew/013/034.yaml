  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: id
  text: Yesus menyampaikan semua hal ini kepada orang banyak dalam perumpamaan-perumpamaan, dan tanpa perumpamaan Ia tidak berbicara kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata kerja Yunani pada klausa kedua berbentuk imperfek dan dapat menekankan kebiasaan: “Ia tidak pernah berbicara kepada mereka tanpa perumpamaan.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Semua hal ini
  rationale: Mempertahankan daya tunjuk Ταῦτα dan cakupan menyeluruh πάντα dalam bahasa Indonesia yang alami.
- source_word: ἐλάλησεν
  choice: disampaikan
  rationale: Aoristus merangkum tindakan Yesus berbicara; bentuk pasif semu 'disampaikan Yesus' terasa wajar dengan objek 'semua hal ini' dan tetap menunjukkan Yesus sebagai pelaku.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan
  rationale: ἐν berdativus menyatakan cara atau sarana; 'dengan perumpamaan' merupakan ungkapan Indonesia yang alami.
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: ὄχλοι berbentuk jamak, tetapi istilah kolektif Indonesia 'orang banyak' secara idiomatis mencakup kelompok-kelompok pendengar tanpa mengesankan hanya satu individu kolektif.
- source_word: χωρὶς παραβολῆς
  choice: tanpa perumpamaan
  rationale: χωρίς dengan genitif berarti 'tanpa'; bahasa Indonesia tidak wajib menandai ketakrifan atau jumlah pada nomina ini, sehingga bentuk tersebut alami sekaligus tidak memperluas makna.
- source_word: οὐδὲν ἐλάλει
  choice: Ia tidak berbicara
  rationale: Negasi οὐδέν dinyatakan secara idiomatis, sedangkan imperfek ἐλάλει dapat menyiratkan kebiasaan atau tindakan berulang; konteks keseluruhan membuat cakupan 'tidak mengatakan apa pun' tetap jelas.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina ini merujuk kembali kepada orang banyak dan dipertahankan tanpa pengulangan yang tidak perlu.
theological_decisions:
- issue: Daya aspek imperfek ἐλάλει pada klausa kedua
  choice: Klausa utama diterjemahkan secara alami sebagai 'Ia tidak berbicara kepada mereka,' dengan catatan bahwa bentuk Yunani dapat menekankan kebiasaan dalam konteks ini.
  alternative: Ia tidak pernah berbicara kepada mereka tanpa perumpamaan.
  rationale: Imperfek dapat membawa nuansa kebiasaan atau keberlangsungan, tetapi penambahan 'tidak pernah' berpotensi terdengar mutlak melampaui latar pengajaran kepada orang banyak dalam bagian ini. Catatan mempertahankan nuansa aspek tanpa menyelesaikan ketegangan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang banyak' dipilih sebagai padanan kolektif yang lazim bagi ὄχλοι; kapitalisasi 'Ia' mengikuti gaya hormat yang umum dalam teks Alkitab bahasa Indonesia.
