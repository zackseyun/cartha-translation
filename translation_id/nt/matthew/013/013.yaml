revisions:
- from: Itulah sebabnya Aku berbicara kepada mereka dengan perumpamaan-perumpamaan, karena meskipun melihat, mereka tidak melihat, dan meskipun mendengar, mereka tidak mendengar ataupun mengerti.[a]
  to: Itulah sebabnya Aku berbicara kepada mereka dengan perumpamaan, karena melihat, mereka tidak melihat, dan mendengar, mereka tidak mendengar dan juga tidak mengerti.[a]
  rationale: Revisi mempertahankan susunan kausal dan paradoks penglihatan serta pendengaran dalam bahasa Yunani, sambil menghindari penetapan nuansa konsesif yang tidak dinyatakan secara eksplisit oleh bentuk partisip. Catatan kaki tetap menyediakan pembacaan konsesif yang didukung konteks. Diksi untuk “perumpamaan” juga dinaturalkan bagi bahasa Indonesia baku modern.
