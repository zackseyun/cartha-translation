  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: id
  text: Itulah sebabnya Aku berbicara kepada mereka dengan perumpamaan, karena melihat, mereka tidak melihat, dan mendengar, mereka tidak mendengar dan juga tidak mengerti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “karena meskipun melihat, mereka tidak melihat, dan meskipun mendengar, mereka tidak mendengar dan juga tidak mengerti.”'
    reason: Menunjukkan pembacaan konsesif yang mungkin bagi partisip Yunani βλέποντες dan ἀκούοντες, tanpa menjadikannya satu-satunya makna dalam teks utama.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Ungkapan ini menyatakan alasan bagi cara Yesus berbicara. “Itulah sebabnya” alami dalam bahasa Indonesia dan mempertahankan daya kausalnya.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan-perumpamaan
  rationale: Preposisi ἐν menyatakan cara atau bentuk berbicara, sedangkan bentuk jamak παραβολαῖς dipertahankan. Pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: αὐτοῖς λαλῶ
  choice: Aku berbicara kepada mereka
  rationale: Menerjemahkan verba kini orang pertama dan objek tak langsungnya secara langsung, dengan susunan yang alami.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan, bukan sekadar isi perkataan.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: meskipun melihat, mereka tidak melihat
  rationale: Bentuk partisip dan verba berulang menghasilkan pertentangan paradoksal. “Meskipun” menyampaikan hubungan konsesif yang tersirat tanpa menjelaskan jenis penglihatan yang dimaksud.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: meskipun mendengar, mereka tidak mendengar
  rationale: Pilihan ini mempertahankan kesejajaran retoris dengan ungkapan tentang melihat.
- source_word: οὐδὲ συνίουσιν
  choice: ataupun mengerti
  rationale: οὐδέ melanjutkan rangkaian negatif, sedangkan συνίημι menunjuk pada menangkap makna. “Mengerti” adalah padanan modern yang jelas dan tidak terlalu menafsirkan.
theological_decisions:
- issue: Daya partisip βλέποντες dan ἀκούοντες
  choice: Diterjemahkan secara konsesif dengan “meskipun melihat” dan “meskipun mendengar”
  alternative: 'Terjemahan lebih formal: “dengan melihat mereka tidak melihat, dan dengan mendengar mereka tidak mendengar”'
  rationale: Bahasa Yunani tidak memakai konjungsi konsesif secara eksplisit, tetapi pengulangan paradoksal dalam konteks mendukung nuansa tersebut. Catatan kaki mempertahankan akses kepada bentuk yang lebih harfiah tanpa menentukan apakah kegagalan itu terutama bersifat rohani, intelektual, atau kehendak.
- issue: Arti συνίουσιν
  choice: mengerti
  alternative: memahami; menangkap maknanya
  rationale: “Mengerti” menyatakan kegagalan menangkap makna tanpa menambahkan penjelasan doktrinal tentang sebab atau tingkat kesalahan para pendengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Aku” mengikuti ujaran langsung Yesus. Pengulangan “melihat” dan “mendengar” sengaja dipertahankan untuk menjaga paradoks dan kesejajaran teks Yunani.
