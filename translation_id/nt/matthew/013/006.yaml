  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: id
  text: Namun, ketika matahari terbit, tanaman itu tersengat terik matahari, dan karena tidak mempunyai akar, tanaman itu mengering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menjadi kering.”'
    reason: alternatif leksikal langsung untuk ἐξηράνθη
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Namun, ketika matahari terbit
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. “Namun” membawa nuansa peralihan atau pertentangan ringan dari δέ, sedangkan “ketika matahari terbit” alami dalam bahasa Indonesia.
- source_word: ἐκαυματίσθη
  choice: tanaman itu terbakar oleh panasnya
  rationale: Bentuk pasif καυματίζω menunjukkan bahwa tanaman terkena panas yang membakar. Penambahan “tanaman itu” memperjelas subjek tersirat dalam konteks perumpamaan tanpa mengubah makna.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: Karena tidak berakar
  rationale: διά dengan infinitif berartikel menyatakan sebab. “Tidak berakar” mempertahankan bentuk tunggal kolektif ῥίζαν secara alami dan ringkas.
- source_word: ἐξηράνθη
  choice: mengering
  rationale: Dalam konteks tumbuhan, ξηραίνω dapat berarti menjadi kering atau layu. “Mengering” mempertahankan citra fisik dan memberi ruang bagi alternatif “layu” dalam catatan kaki.
