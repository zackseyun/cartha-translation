  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: id
  text: Namun, ketika tanaman itu bertunas dan menghasilkan bulir, barulah gulma itu juga tampak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalang”; mungkin sejenis gulma tertentu seperti darnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: ὅτε memperkenalkan anak kalimat waktu, sedangkan δέ menjadi penghubung ringan yang di sini menyatakan peralihan sekaligus sedikit kontras dengan adegan penaburan sebelumnya.
- source_word: ἐβλάστησεν
  choice: bertunas
  rationale: Bentuk aoris dari βλαστάνω menyatakan keluarnya tunas atau mulai tumbuh; 'bertunas' tepat dan alami dalam konteks tanaman.
- source_word: ὁ χόρτος
  choice: tanaman itu
  rationale: χόρτος dapat berarti rumput atau tumbuh-tumbuhan. Dalam ladang pada perumpamaan ini, istilah tersebut menunjuk pada tanaman budidaya yang sedang tumbuh; 'tanaman itu' mempertahankan acuan kontekstual tanpa menyebut jenisnya lebih awal daripada teks.
- source_word: καρπὸν ἐποίησεν
  choice: menghasilkan bulir
  rationale: Ungkapan harfiah 'membuat buah' berarti menghasilkan panen. Karena konteksnya tanaman biji-bijian, 'menghasilkan bulir' lebih alami dan konkret daripada 'menghasilkan buah'.
- source_word: τότε
  choice: pun
  rationale: τότε menandai bahwa kemunculan gulma menjadi nyata pada tahap tersebut. Dalam susunan kalimat Indonesia, urutan waktu sudah dinyatakan oleh anak kalimat 'ketika', sedangkan 'pun' secara alami menonjolkan akibat atau perkembangan berikutnya tanpa pengulangan kaku.
- source_word: ἐφάνη
  choice: tampak
  rationale: Bentuk ini menyatakan menjadi kelihatan atau nyata. 'Tampak' ringkas dan sesuai dengan gagasan bahwa gulma baru dapat dikenali ketika tanaman menghasilkan bulir.
- source_word: καὶ τὰ ζιζάνια
  choice: gulma pun
  rationale: ζιζάνια menunjuk pada tumbuhan pengganggu di ladang, mungkin secara khusus darnel. 'Gulma' mudah dipahami dan tidak memberi kepastian botanis yang tidak diberikan teks; unsur καί yang bersifat menambahkan tercermin dalam 'pun'.
theological_decisions:
- issue: Identifikasi khusus ζιζάνια
  choice: Diterjemahkan secara umum sebagai 'gulma' dalam teks utama.
  alternative: '''lalang'' atau sejenis gulma tertentu seperti darnel'
  rationale: Ayat ini tidak memastikan identifikasi botanis secara mutlak. Pilihan umum menjaga keterbacaan dan ketidakpastian teks, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. 'Tanaman itu' dan 'gulma' mudah dipahami pembaca umum, sementara catatan kaki mempertahankan kemungkinan arti ζιζάνια yang lebih khusus.
