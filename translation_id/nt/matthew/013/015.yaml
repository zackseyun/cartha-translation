  to: Sebab hati bangsa ini telah menjadi tumpul, telinga mereka mendengar dengan susah payah, dan mereka telah menutup mata mereka, supaya jangan mereka melihat dengan mata, mendengar dengan telinga, memahami dengan hati, lalu berbalik[a], dan Aku akan menyembuhkan mereka.[b]
  rationale: Revisi hanya memperjelas futurum Yunani pada 'Aku akan menyembuhkan,' memakai susunan Indonesia yang lebih alami untuk tindakan menutup mata, dan membatasi catatan leksikal agar tidak memasukkan penafsiran tambahan. Klausa 'supaya jangan' dipertahankan untuk menjaga ambiguitas dan ketegangan yang ada dalam μήποτε.
