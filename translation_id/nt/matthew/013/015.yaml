id: MAT.13.15
reference: Matthew 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: id
  text: Sebab hati bangsa ini telah menjadi tumpul, telinga mereka mendengar dengan susah payah, dan mereka telah menutup mata mereka, supaya jangan mereka melihat dengan mata, mendengar dengan telinga, memahami dengan hati, lalu berbalik[a], dan Aku akan menyembuhkan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kembali.”'
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Yesaya 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: telah menjadi tumpul
  rationale: Secara harfiah berarti menjadi tebal atau gemuk; bersama 'hati' ungkapan ini menunjuk pada ketumpulan atau ketidakpekaan batin. 'Menjadi tumpul' alami dalam bahasa Indonesia dan mempertahankan citranya.
- source_word: καρδία
  choice: hati
  rationale: Padanan baku untuk pusat pemahaman dan sikap batin; ayat ini sendiri menghubungkan hati dengan memahami.
- source_word: λαοῦ τούτου
  choice: bangsa ini
  rationale: '''Bangsa'' sesuai untuk λαός dalam kutipan tentang umat Israel, sedangkan ''ini'' mempertahankan tekanan demonstratif.'
- source_word: βαρέως ἤκουσαν
  choice: mendengar dengan susah payah
  rationale: βαρέως secara harfiah berarti 'dengan berat'; dalam kaitan dengan mendengar, frasa ini menyatakan pendengaran yang sulit atau tidak tanggap. Pilihan ini lebih alami daripada 'mendengar dengan berat' tanpa mengubahnya menjadi sekadar 'hampir tidak mendengar'.
- source_word: ἐκάμμυσαν
  choice: telah mereka pejamkan
  rationale: Mempertahankan bentuk aktif dan tindakan sengaja dari pihak mereka; susunan ini juga menegaskan bahwa mata itu milik mereka sendiri.
- source_word: μήποτε
  choice: supaya jangan
  rationale: Mempertahankan daya klausa tujuan/akibat negatif dan ketegangan dalam kutipan tanpa melunakkannya menjadi pernyataan akibat semata.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν
  choice: melihat ... mendengar ... memahami
  rationale: Mempertahankan urutan tindakan dalam bahasa Yunani dengan ungkapan Indonesia yang lugas.
- source_word: ἐπιστρέψωσιν
  choice: berbalik
  rationale: Menjaga makna berbalik atau kembali tanpa memasukkan istilah gerejawi yang lebih khusus seperti 'bertobat' atau bentuk pasif 'dipertobatkan'.
- source_word: ἰάσομαι
  choice: Aku menyembuhkan
  rationale: Dalam rangkaian yang bergantung pada 'supaya jangan', bentuk ini paling alami dalam bahasa Indonesia. Makna dasar ilahi sebagai penyembuh tetap dipertahankan.
theological_decisions:
- issue: Klausa penghakiman yang memuat ketegangan antara tujuan/akibat ilahi dan tanggung jawab manusia
  choice: supaya jangan mereka melihat ... lalu berbalik dan Aku menyembuhkan mereka
  alternative: kalau tidak, mereka akan melihat ... lalu berbalik dan Aku akan menyembuhkan mereka
  rationale: Terjemahan utama mempertahankan daya permukaan μήποτε serta peran aktif bangsa itu dalam memejamkan mata. Ia tidak menyelesaikan perdebatan apakah klausa tersebut menyatakan tujuan, akibat, atau gambaran ironis.
- issue: Makna pertobatan dalam ἐπιστρέψωσιν
  choice: berbalik
  alternative: kembali; bertobat
  rationale: '''Berbalik'' mempertahankan metafora arah dan kemungkinan makna pertobatan tanpa menjadikan tafsiran teologis itu eksplisit di dalam teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel mata–telinga–hati dipertahankan. Ungkapan 'mendengar dengan susah payah' menghindari kekakuan harfiah 'mendengar dengan berat', sedangkan 'supaya jangan' sengaja mempertahankan ketegangan teologis teks sumber.
