  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: id
  text: 'Namun, benih yang lain jatuh ke tanah yang baik dan menghasilkan buah: ada yang seratus kali lipat, ada yang enam puluh kali lipat, dan ada yang tiga puluh kali lipat[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian terakhir dapat diterjemahkan, “yang satu seratus, yang lain enam puluh, dan yang lain tiga puluh.” Ungkapan distributif Yunani dapat dinyatakan dengan “ada yang ... ada yang ...” atau “yang satu ... yang lain ...”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: benih yang lain
  rationale: Bentuk netral jamak ini dipakai secara substantival dan, dalam konteks perumpamaan, merujuk pada benih yang ditaburkan; kata 'benih' ditambahkan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras dengan hasil benih-benih yang disebut sebelumnya; 'Namun' menyampaikan fungsi adversatif itu secara wajar.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Terjemahan langsung mempertahankan gambaran Yunani tentang benih yang jatuh, tanpa mengubahnya menjadi bentuk pasif 'ditaburkan'.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: di tanah yang baik
  rationale: Dalam konteks pertanian, 'tanah' alami dan mudah dipahami; 'baik' menunjukkan tanah yang cocok atau subur tanpa menambahkan penafsiran yang tidak dinyatakan.
- source_word: ἐδίδου καρπόν
  choice: menghasilkan buah
  rationale: Imperfek Yunani menggambarkan proses atau kegiatan yang berlangsung. Dalam bahasa Indonesia, 'menghasilkan buah' menyampaikan hasil pertanian secara alami, sementara konteks mempertahankan nuansa proses tersebut.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ada yang seratus kali lipat, ada yang enam puluh kali lipat, dan ada yang tiga puluh kali lipat
  rationale: Pola 'ada yang ... ada yang ...' secara alami mencerminkan konstruksi distributif Yunani. 'Kali lipat' dijelaskan pada setiap angka agar besarnya hasil tidak disalahpahami sebagai jumlah buah semata.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Benih' dipakai sebagai nomina kolektif, sedangkan pengulangan 'kali lipat' mengutamakan kejelasan bagi pembaca umum.
