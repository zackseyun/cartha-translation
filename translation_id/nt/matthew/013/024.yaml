id: MAT.13.24
reference: Matthew 13:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: id
  text: Ia menyampaikan sebuah perumpamaan lain kepada mereka, kata-Nya, “Kerajaan surga itu seperti seorang yang menaburkan benih yang baik di ladangnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: sebuah perumpamaan lain
  rationale: Ungkapan ini memperkenalkan perumpamaan tambahan dalam rangkaian; susunan ini alami dalam bahasa Indonesia.
- source_word: παρέθηκεν αὐτοῖς
  choice: Ia menyampaikan ... kepada mereka
  rationale: παρατίθημι di sini berarti mengemukakan atau menyajikan bahan pengajaran. 'Menyampaikan' jelas dan wajar dalam bahasa Indonesia tanpa memaksakan metafora harfiah 'menaruh di hadapan'.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini secara alami dialihkan menjadi pengantar kutipan langsung. Bentuk hormat '-Nya' lazim dipakai ketika merujuk kepada Yesus.
- source_word: Ὡμοιώθη
  choice: itu seperti
  rationale: Dalam formula pembuka perumpamaan Matius, bentuk pasif aoris ini berfungsi memperkenalkan perbandingan. 'Itu seperti' menyampaikan maksudnya secara alami tanpa menyiratkan bahwa kerajaan baru berubah menjadi sesuatu.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan surga
  rationale: Ini adalah padanan Indonesia yang mapan dan alami bagi ungkapan khas Matius, dengan 'surga' sebagai bentuk idiomatis untuk jamak Yunani.
- source_word: ἀνθρώπῳ
  choice: seorang
  rationale: Dalam konteks ini, 'seorang' secara alami menunjuk kepada tokoh manusia yang kemudian dijelaskan oleh tindakannya; menyebut 'laki-laki' tidak diperlukan dalam bahasa Indonesia.
- source_word: σπείραντι
  choice: yang menaburkan
  rationale: Partisipel aoris diterjemahkan sebagai klausa relatif yang alami. 'Menaburkan' merupakan kata kerja pertanian yang tepat untuk tindakan menyemai benih.
- source_word: καλὸν σπέρμα
  choice: benih yang baik
  rationale: καλός menyatakan mutu benih yang baik dan mempersiapkan kontras dengan lalang pada konteks berikutnya.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: di ladangnya
  rationale: Padanan ini langsung, ringkas, dan mempertahankan kepemilikan ladang oleh tokoh dalam perumpamaan.
theological_decisions:
- issue: Ungkapan khas Matius tentang kerajaan
  choice: Kerajaan surga
  alternative: Kerajaan segala surga
  rationale: Bentuk tunggal 'surga' adalah ungkapan Indonesia yang wajar dan mempertahankan makna pemerintahan Allah dalam istilah khas Matius tanpa menghasilkan frasa yang kaku.
- issue: Daya Ὡμοιώθη dalam pembuka perumpamaan
  choice: itu seperti
  alternative: telah menjadi seperti / disamakan dengan
  rationale: Dalam formula perumpamaan ini, 'itu seperti' mengungkapkan perbandingan secara alami. Bentuk ini tidak menambahkan klaim bahwa hakikat kerajaan mengalami perubahan, sementara cakupan tepat perbandingannya tetap dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat mudah dipahami pembaca umum. Tidak ada catatan kaki karena tidak ada alternatif yang perlu ditampilkan untuk mencegah hilangnya ambiguitas penting.
