  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: id
  text: Dan Ia tidak melakukan banyak perbuatan ajaib di sana karena ketidakpercayaan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak mukjizat” atau “banyak perbuatan-perbuatan kuasa.” Istilah Yunani ini merujuk pada perbuatan yang menyatakan kuasa dan, dalam konteks ini, menunjuk pada karya-karya ajaib.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Dan Ia tidak melakukan
  rationale: καί melanjutkan narasi, sedangkan οὐκ menegasikan verba aoris ἐποίησεν. Terjemahan ini menyatakan bahwa tindakan itu tidak dilakukan tanpa mengubahnya menjadi pernyataan tentang ketidakmampuan.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Adverbia tempat ini secara langsung menunjuk kepada lokasi tersebut dalam konteks kampung halaman Yesus.
- source_word: δυνάμεις πολλὰς
  choice: banyak perbuatan penuh kuasa
  rationale: Dalam konteks Injil, δύναμις dapat menunjuk pada perbuatan yang memperlihatkan kuasa, khususnya karya ajaib. Pilihan ini mempertahankan unsur leksikal 'kuasa' dan tidak langsung meratakannya menjadi 'mukjizat'; πολλὰς diterjemahkan 'banyak'.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: karena ketidakpercayaan mereka
  rationale: διά dengan akusatif menyatakan sebab. ἀπιστία berarti ketidakpercayaan atau ketiadaan iman; 'ketidakpercayaan' mempertahankan daya negatif kata itu dan sesuai dengan konteks penolakan.
theological_decisions:
- issue: Apakah ayat ini menyatakan ketidakmampuan atau sekadar tidak dilakukannya banyak perbuatan penuh kuasa sebagai tanggapan terhadap ketidakpercayaan
  choice: Ia tidak melakukan banyak perbuatan penuh kuasa
  alternative: Ia tidak dapat melakukan banyak mukjizat
  rationale: Teks Yunani memakai οὐκ ἐποίησεν ('tidak melakukan'), bukan ungkapan ketidakmampuan. Terjemahan mempertahankan pernyataan Matius pada tingkat tindakan dan tidak menambahkan klaim yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. Pronomina “Ia” dipakai untuk Yesus sesuai register Alkitab Indonesia yang lazim; “perbuatan penuh kuasa” dipilih agar alami sekaligus mempertahankan hubungan leksikal dengan kuasa.
