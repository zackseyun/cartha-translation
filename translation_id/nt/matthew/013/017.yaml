id: MAT.13.17
reference: Matthew 13:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: id
  text: 'Sebab sesungguhnya Aku berkata kepadamu: Banyak nabi dan orang benar[a] rindu melihat apa yang kamu lihat, tetapi tidak melihatnya, dan mendengar apa yang kamu dengar, tetapi tidak mendengarnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang-orang benar. Kata Yunani yang dipakai adalah kata sifat yang berfungsi sebagai nomina dan berarti orang-orang yang benar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: sesungguhnya
  rationale: Dalam rumusan ἀμὴν λέγω ὑμῖν, “sesungguhnya” menyampaikan penegasan yang khidmat secara alami dalam bahasa Indonesia tanpa sekadar mentransliterasikan “amin”.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini menghubungkan ayat tersebut sebagai penjelasan atau dasar bagi pernyataan sebelumnya.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Pilihan ini mempertahankan bentuk langsung dan formula Yunani dengan bahasa Indonesia yang wajar.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: banyak nabi dan orang benar
  rationale: “Orang benar” menyatakan adjektiva substantival δίκαιοι sebagai kelompok orang, sedangkan “banyak” secara alami mencakup kedua kelompok yang disebutkan.
- source_word: ἐπεθύμησαν
  choice: rindu
  rationale: Kata ini mengungkapkan keinginan yang kuat dan mendalam tanpa konotasi hasrat yang tidak patut.
- source_word: ἃ βλέπετε
  choice: apa yang kamu lihat
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan objek yang tidak dijelaskan secara eksplisit oleh teks Yunani.
- source_word: οὐκ εἶδαν
  choice: tidak melihatnya
  rationale: Akhiran “-nya” merujuk kembali pada apa yang ingin dilihat dan membuat klausa lengkap secara alami.
- source_word: ἃ ἀκούετε ... οὐκ ἤκουσαν
  choice: apa yang kamu dengar ... tidak mendengarnya
  rationale: Struktur ini mempertahankan kesejajaran dengan bagian tentang melihat dan tidak menambahkan objek yang tidak disebutkan teks.
theological_decisions:
- issue: Cakupan δίκαιοι
  choice: orang benar
  alternative: orang-orang saleh; mereka yang benar
  rationale: Bentuk Yunani adalah adjektiva jamak yang dipakai sebagai nomina. “Orang benar” jelas dan alami serta mempertahankannya sebagai kelompok yang lebih luas di samping para nabi.
- issue: Hakikat dari apa yang dilihat dan didengar
  choice: Objek tetap dinyatakan sebagai “apa yang kamu lihat” dan “apa yang kamu dengar”.
  alternative: Menjelaskannya sebagai Yesus, Mesias, rahasia Kerajaan, atau penggenapan mesianis.
  rationale: Konteks memberi arah bagi penafsiran, tetapi ayat ini sendiri tidak menyebut objek tersebut secara khusus. Terjemahan tidak menyelesaikan ketegangan itu melalui penambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan paralel “melihat ... tidak melihatnya” dan “mendengar ... tidak mendengarnya” dipertahankan. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab berbahasa Indonesia.
