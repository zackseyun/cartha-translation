  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: id
  text: dan mereka akan melemparkan orang-orang itu ke dalam tungku yang menyala-nyala.[a] Di sana akan ada tangisan dan kertakan gigi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tungku api.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini dipertahankan untuk menjaga kesinambungan dengan kalimat sebelumnya.
- source_word: βαλοῦσιν
  choice: akan melemparkan
  rationale: Bentuk futur aktif βάλλω menyatakan tindakan melempar atau mencampakkan; 'melemparkan' alami dalam bahasa Indonesia dan tetap mempertahankan daya tindakannya.
- source_word: αὐτοὺς
  choice: orang-orang itu
  rationale: Pronomina jamak ini menunjuk kembali kepada kelompok yang telah disebut; bentuk ini lebih jelas dan alami daripada 'mereka' sebagai objek dalam susunan tersebut.
- source_word: κάμινον τοῦ πυρός
  choice: tungku yang menyala-nyala
  rationale: Ungkapan genitif ini menggambarkan tungku berapi. Pilihan ini mempertahankan gambaran konkretnya dalam bahasa Indonesia yang alami, sedangkan bentuk yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: ἐκεῖ
  choice: Di sana
  rationale: Mempertahankan makna lokatif yang menunjuk kepada tempat yang baru saja disebut tanpa memperluas artinya.
- source_word: κλαυθμός
  choice: tangisan
  rationale: Menyampaikan tindakan menangis tanpa mempersempitnya menjadi kesedihan saja atau menguatkannya menjadi raungan.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kertak gigi
  rationale: Ungkapan Indonesia yang lazim dan ringkas untuk tindakan mengertakkan gigi, dengan tetap membiarkan nuansa penderitaan, dukacita, atau amarah terbuka sesuai konteks.
theological_decisions:
- issue: Hakikat gambaran penghakiman dalam κάμινον τοῦ πυρός
  choice: Mempertahankan metafora konkret berupa tungku yang menyala-nyala.
  alternative: Menafsirkannya secara langsung sebagai 'api neraka'.
  rationale: Teks memakai gambaran penghakiman yang jelas tetapi tidak menggunakan istilah doktrinal yang lebih khusus; terjemahan tidak boleh menambah penentuan yang tidak dinyatakan.
- issue: Makna ungkapan tangisan dan kertak gigi
  choice: Mempertahankan kedua unsur ungkapan tanpa menjelaskan penyebab atau emosi tunggal di baliknya.
  alternative: Menafsirkan kertak gigi hanya sebagai amarah atau seluruh ungkapan hanya sebagai kesedihan.
  rationale: Ungkapan itu menyatakan penderitaan berat dalam penghakiman dan dapat memuat lebih dari satu nuansa emosi; ambiguitas tersebut perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti alur Yunani dengan tetap terdengar alami; 'Di sana' mempertahankan penunjukan tempat secara langsung.
