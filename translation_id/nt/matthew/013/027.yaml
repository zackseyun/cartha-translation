  terminology: «Budak» secara tepat mempertahankan daya sosial δοῦλοι. «Tuan» tepat sebagai sapaan kepada tokoh perumpamaan dan tidak seharusnya diganti menjadi «Tuhan». «Gulma» menghindari identifikasi botanis keliru yang dapat timbul dari «lalang», sementara catatan kaki mencatat alternatif tradisional dan kemungkinan darnel.
