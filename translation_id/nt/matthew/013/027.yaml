base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: id
  text: Kemudian para budak pemilik rumah itu datang kepadanya dan berkata, “Tuan, bukankah Tuan menabur benih yang baik di ladang Tuan? Jadi, dari mana gulma[a] itu berasal?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalang”; istilah Yunani ini kemungkinan menunjuk kepada darnel, sejenis gulma yang menyerupai gandum pada tahap awal pertumbuhannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: datang kepadanya
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan gerak mendekati tuan rumah.
- source_word: δοῦλοι
  choice: budak
  rationale: Istilah ini menunjukkan orang yang berada di bawah kepemilikan dan kewenangan seorang tuan. “Budak” mempertahankan status sosial tersebut dengan lebih jelas daripada “pelayan” atau “hamba” dalam konteks rumah tangga perumpamaan ini.
- source_word: οἰκοδεσπότου
  choice: tuan rumah
  rationale: Secara harfiah menunjuk kepada orang yang mengepalai rumah tangga. “Tuan rumah” alami dalam bahasa Indonesia serta mempertahankan hubungan kewenangannya atas para budak.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam dialog perumpamaan ini, bentuk sapaan tersebut ditujukan kepada pemilik rumah sebagai sapaan hormat, bukan secara langsung sebagai gelar ilahi. Bahasa Indonesia membedakan “Tuan” dari “Tuhan”, sehingga “Tuan” paling tepat secara kontekstual.
- source_word: οὐχὶ
  choice: bukankah
  rationale: Partikel ini memperkenalkan pertanyaan yang mengharapkan jawaban positif; “bukankah” menyampaikan daya itu secara ringkas dan alami.
- source_word: καλὸν σπέρμα
  choice: benih yang baik
  rationale: Padanan pertanian yang langsung, jelas, dan mempertahankan sifat benih dalam teks sumber.
- source_word: ἔσπειρας
  choice: menabur
  rationale: Verba ini secara khusus berarti menabur benih; “menabur” lebih tepat daripada istilah umum “menanam”.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: di ladang Tuan
  rationale: Menyatakan lokasi sekaligus kepemilikan. Pengulangan “Tuan” merupakan bentuk sapaan hormat yang alami dalam bahasa Indonesia.
- source_word: πόθεν οὖν
  choice: Kalau begitu, dari mana
  rationale: “Dari mana” mempertahankan pertanyaan tentang asal, sedangkan “kalau begitu” menyampaikan hubungan kesimpulan yang dinyatakan oleh οὖν.
- source_word: ἔχει ζιζάνια
  choice: datangnya lalang itu
  rationale: Ungkapan Yunani secara harfiah berbentuk “mempunyai lalang”, tetapi dalam konteks pertanyaan asal-usul, susunan idiomatis Indonesia “dari mana datangnya” menyampaikan maksudnya tanpa menghasilkan kalimat yang kaku.
- source_word: ζιζάνια
  choice: lalang
  rationale: Istilah ini menunjuk kepada gulma berbahaya, kemungkinan besar darnel, yang menyerupai gandum ketika masih muda. “Lalang” merupakan padanan Indonesia yang ringkas dan dikenal dalam konteks Alkitab, sementara ketepatan botanis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan δοῦλοι dalam lingkungan rumah tangga perumpamaan
  choice: budak
  alternative: hamba; pelayan
  rationale: Ayat ini tidak mengajarkan doktrin tentang perbudakan, tetapi istilah sumber menyatakan status orang yang berada di bawah kepemilikan seorang tuan. “Budak” tidak memperhalus hubungan sosial yang digambarkan teks.
- issue: Penerjemahan sapaan κύριε
  choice: Tuan
  alternative: Tuhan; Pak
  rationale: Yang disapa dalam alur perumpamaan adalah kepala rumah tangga. Karena bahasa Indonesia membedakan sapaan manusia “Tuan” dari gelar ilahi “Tuhan”, pilihan “Tuan” mempertahankan fungsi kontekstual tanpa memasukkan klaim kristologis yang tidak dinyatakan langsung dalam dialog ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Susunan pertanyaan terakhir dibuat idiomatis tanpa menghilangkan pertanyaan tentang asal-usul gulma. Huruf kapital pada “Tuan” menandai sapaan langsung yang hormat, bukan gelar ilahi.
