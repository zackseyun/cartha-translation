revisions:
- from: Kemudian para budak tuan rumah itu datang kepadanya dan berkata, “Tuan, bukankah Tuan menabur benih yang baik di ladang Tuan? Kalau begitu, dari mana datangnya lalang[a] itu?”
  to: Kemudian para budak pemilik rumah itu datang kepadanya dan berkata, “Tuan, bukankah Tuan menabur benih yang baik di ladang Tuan? Jadi, dari mana gulma[a] itu berasal?”
  rationale: Revisi terbatas pada dua hal. «Gulma» menggantikan «lalang» agar teks utama tidak mengidentifikasi ζιζάνια dengan alang-alang dalam pengertian Indonesia modern; alternatif tradisional tetap tersedia di catatan kaki. «Pemilik rumah» mengurangi ambiguitas modern pada «tuan rumah» dan tetap mencerminkan kepala/pemilik rumah tangga dalam teks sumber. Pertanyaan terakhir dipertahankan sebagai pertanyaan mengenai asal-usul, sesuai πόθεν οὖν.
