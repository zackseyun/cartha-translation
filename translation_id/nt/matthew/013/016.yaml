base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: id
  text: Namun, berbahagialah matamu karena melihat, dan telingamu karena mendengar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab matamu melihat dan telingamu mendengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan orang-orang yang melihat dan mendengar tetapi tidak memahami dalam konteks sebelumnya.
- source_word: μακάριοι
  choice: berbahagialah
  rationale: Ungkapan yang wajar dan bermartabat dalam konteks ucapan bahagia, serta menyiratkan keadaan yang diperkenan tanpa membatasinya pada perasaan senang.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: matamu
  rationale: Bentuk posesif ini alami dalam bahasa Indonesia dan mempertahankan rujukan langsung kepada para murid.
- source_word: ὅτι βλέπουσιν
  choice: karena melihat
  rationale: ὅτι paling wajar dipahami secara kausal di sini; subjek verba tersirat dan sudah jelas dari 'matamu'.
- source_word: τὰ ὦτα ὑμῶν
  choice: telingamu
  rationale: Padanan posesif alami yang mempertahankan kesejajaran dengan 'matamu'.
- source_word: ὅτι ἀκούουσιν
  choice: karena mendengar
  rationale: Mempertahankan fungsi kausal ὅτι dan kesejajaran sintaksis dengan klausa sebelumnya.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: melihat / mendengar
  rationale: Mempertahankan bahasa indrawi yang sederhana sehingga makna rohaninya tetap disampaikan oleh konteks, bukan ditambahkan ke dalam terjemahan.
theological_decisions:
- issue: Apakah melihat dan mendengar harus dibuat secara eksplisit rohani
  choice: Mempertahankan kata indrawi harfiah 'melihat' dan 'mendengar'.
  alternative: Menerjemahkannya sebagai 'memahami' atau 'mengerti'.
  rationale: Ayat ini sendiri memakai verba melihat dan mendengar. Konteks memberi kedalaman rohani, sehingga terjemahan tidak perlu menghilangkan ketegangan antara indra jasmani dan penerimaan rohani.
- issue: Hubungan ὅτι dengan pernyataan bahwa mata dan telinga berbahagia
  choice: 'Menafsirkannya secara kausal: ''karena''.'
  alternative: 'Menafsirkannya secara deklaratif: ''bahwa matamu melihat dan telingamu mendengar''.'
  rationale: Pembacaan kausal paling alami dalam konteks dan menyatakan alasan mata serta telinga disebut berbahagia, tetapi kemungkinan gramatikal lainnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk tunggal posesif '-mu' mengikuti sapaan jamak Yunani secara idiomatis sebagai sapaan kolektif kepada para murid; kesejajaran 'matamu ... telingamu' dipertahankan.
