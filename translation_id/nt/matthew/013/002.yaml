review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada urutan dan makna ayat. Namun, “di dekat-Nya” terutama menyatakan lokasi, sedangkan πρὸς αὐτόν menyatakan gerak atau arah kepada-Nya. Selain itu, “sedangkan” dapat memberi nuansa pertentangan yang tidak dinyatakan oleh καί.
  naturalness: Bahasa draf alami dan registernya sesuai. “Banyak orang berkumpul kepada-Nya” adalah ungkapan yang wajar dalam ragam Alkitab Indonesia modern dan menyampaikan arah yang dimaksud. Koordinasi dengan “dan” lebih netral daripada “sedangkan.”
  terminology: “Orang banyak,” “perahu,” “pantai,” dan kapitalisasi “-Nya/Ia” konsisten dengan register Alkitab Indonesia modern. Catatan kaki mempertahankan alternatif leksikal yang sah untuk αἰγιαλός.
  issues:
  - severity: medium
    issue: “di dekat-Nya” melemahkan arah dalam πρὸς αὐτόν.
    rationale: Frasa Yunani menunjukkan orang-orang datang atau berkumpul kepada Yesus, bukan hanya berada di lokasi yang dekat dengan-Nya. “Kepada-Nya” mempertahankan arah itu tanpa menambahkan gagasan ‘mengerumuni.’
  - severity: low
    issue: “sedangkan” memberi kontras yang tidak eksplisit.
    rationale: καί hanya menghubungkan keadaan orang banyak dengan tindakan Yesus. “Dan” menyampaikan hubungan itu secara lebih netral.
  revised_text: Banyak orang berkumpul kepada-Nya sehingga Ia naik ke sebuah perahu lalu duduk, dan seluruh orang banyak itu berdiri di pantai.[a]
  revised_footnotes:
