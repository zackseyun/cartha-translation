  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: id
  text: Banyak orang berkumpul kepada-Nya sehingga Ia naik ke sebuah perahu lalu duduk, dan seluruh orang banyak itu berdiri di pantai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tepi perairan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: berkumpul di dekat-Nya
  rationale: Bentuk pasif aoristus συνήχθησαν secara alami dapat dinyatakan secara intransitif dalam bahasa Indonesia. Frasa ini menyampaikan bahwa orang banyak berhimpun menuju dan berada dekat dengan Yesus tanpa memperkuatnya menjadi ‘mengerumuni’.
- source_word: ὄχλοι πολλοί
  choice: begitu banyak orang
  rationale: Secara harfiah frasa jamak ini menunjuk pada banyak kerumunan, tetapi ungkapan Indonesia yang alami menekankan besarnya jumlah orang. Kata ‘begitu’ juga mengalir langsung ke klausa hasil yang diperkenalkan oleh ὥστε.
- source_word: ὥστε
  choice: sehingga
  rationale: '‘Sehingga’ mempertahankan hubungan hasil: banyaknya orang menyebabkan Yesus naik ke perahu dan duduk.'
- source_word: εἰς πλοῖον ἐμβάντα
  choice: naik ke sebuah perahu
  rationale: Dalam konteks kendaraan atau perahu, ‘naik ke’ merupakan padanan Indonesia yang alami bagi tindakan masuk atau menaiki perahu.
- source_word: καθῆσθαι
  choice: lalu duduk
  rationale: ‘Duduk’ menerjemahkan tindakan secara langsung, sementara ‘lalu’ membuat urutan dengan tindakan naik ke perahu jelas dan alami.
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak itu
  rationale: Ungkapan ini mempertahankan peralihan teks Yunani dari kerumunan-kerumunan jamak kepada kumpulan tersebut sebagai satu kesatuan.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: di pantai
  rationale: αἰγιαλός menunjuk pada pantai atau tepian perairan. ‘Pantai’ ringkas, umum, dan tidak menambahkan jenis perairan yang tidak disebutkan dalam ayat ini.
- source_word: εἱστήκει
  choice: berdiri
  rationale: ‘Berdiri’ secara alami menggambarkan keadaan orang banyak di pantai; aspek keadaan yang berlanjut cukup jelas dari konteks.
theological_decisions: []
translation_notes:
