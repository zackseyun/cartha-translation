base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: id
  text: Lalu para murid mendekati Yesus dan berkata kepada-Nya, “Mengapa Engkau berbicara kepada mereka dengan perumpamaan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam konteks ini καί melanjutkan alur narasi. “Lalu” alami dalam bahasa Indonesia dan tidak menambahkan hubungan sebab-akibat.
- source_word: προσελθόντες
  choice: datang mendekati Yesus
  rationale: Partisip aoris προσέρχομαι menyatakan bahwa para murid datang mendekat sebelum berbicara. Objek “Yesus” dibuat eksplisit dalam bahasa Indonesia agar rujukan geraknya jelas dan alami.
- source_word: οἱ μαθηταὶ
  choice: murid-murid itu
  rationale: Artikel Yunani menunjuk kepada kelompok murid yang sudah dikenal dalam konteks. “Murid-murid itu” mempertahankan sifat definit tanpa menambahkan kata “-Nya” yang tidak eksplisit.
- source_word: εἶπαν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Terjemahan ini mempertahankan verba umum λέγω meskipun ucapan langsungnya berbentuk pertanyaan; “bertanya” mungkin secara pragmatis, tetapi kurang formal terhadap bentuk sumber.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif Indonesia yang langsung dan wajar untuk ungkapan yang menanyakan alasan.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan
  rationale: ἐν dengan datif di sini menyatakan cara atau sarana berbicara. “Dengan perumpamaan” merupakan ungkapan Indonesia yang alami.
- source_word: λαλεῖς
  choice: Engkau berbicara
  rationale: Bentuk kini orang kedua tunggal diterjemahkan secara langsung. “Engkau” mempertahankan sapaan tunggal dengan register kitab suci yang tetap dapat dipahami pembaca modern.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif menandai pihak yang menjadi sasaran perkataan Yesus; “kepada mereka” adalah padanan langsung dan alami.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan urutan tindakan: para murid mendekat, lalu berbicara. Tidak diperlukan catatan kaki karena nuansa προσελθόντες dapat dinyatakan langsung dalam teks utama.'
