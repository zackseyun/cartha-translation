  source_fidelity: 'Terjemahan menangkap seluruh unsur utama teks Yunani: kelanjutan naratif, kedatangan/mendekatnya para murid sebelum mereka berbicara, pertanyaan alasan, audiens “mereka,” dan cara Yesus berbicara. “Yesus” sebagai rujukan eksplisit bagi αὐτῷ dapat diterima berdasarkan konteks. Bentuk tunggal generik “perumpamaan” wajar dalam bahasa Indonesia untuk bentuk jamak παραβολαῖς.'
  naturalness: Kalimat draf pada dasarnya baku dan mudah dipahami. Namun, “murid-murid itu” terdengar lebih deiktis atau kontrastif daripada yang diperlukan dalam narasi ini. “Para murid” lebih alami dalam bahasa Indonesia modern dan tetap menyatakan kelompok yang dikenal dari konteks.
  terminology: “Perumpamaan” adalah istilah Alkitab yang mapan untuk παραβολή. Sapaan “Engkau” dan pronomina “-Nya” mempertahankan register hormat yang wajar tanpa menambah penafsiran teologis.
