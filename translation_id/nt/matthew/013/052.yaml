    issue: Nama “Yesus” ditambahkan sebagai subjek.
    rationale: Teks Yunani hanya memakai pronomina tersirat melalui ὁ δέ, “Ia”; nama tersebut dapat disimpulkan dari konteks, tetapi tidak dinyatakan dalam ayat.
  - severity: medium
    issue: “tempat penyimpanannya” terlalu menyempitkan θησαυρός.
    rationale: θήσαυρος dapat menunjuk harta yang tersimpan maupun tempat/penyimpanan harta. “Perbendaharaannya,” dengan catatan kaki, lebih baik menjaga keluasan metafora.
