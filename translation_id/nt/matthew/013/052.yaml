  source_fidelity: Terjemahan pada umumnya setia kepada teks Yunani. Namun, ὁ δὲ εἶπεν berarti “Ia berkata,” bukan penyebutan nama “Yesus”; nama itu tidak ada dalam ayat ini. Selain itu, θησαυρός mencakup harta dan tempat penyimpanan harta; “perbendaharaannya” mempertahankan kedua nuansa itu lebih baik daripada “tempat penyimpanannya,” yang terutama membatasi makna pada lokasi.
  naturalness: Dengan “Lalu Ia berkata” dan “perbendaharaannya,” teks tetap baku, modern, dan mengalir alami. “Ahli Taurat,” “kepala rumah tangga,” dan “hal-hal yang baru dan yang lama” dapat dipahami dengan baik dalam bahasa Indonesia modern.
  terminology: “Ahli Taurat” merupakan padanan yang mapan dan sesuai konteks γραμματεύς. “Kerajaan Surga” mempertahankan ungkapan khas Matius. “Kepala rumah tangga” menyampaikan peran οἰκοδεσπότης tanpa menjadikan “tuan rumah” dalam arti modern sebagai penyambut tamu. Catatan untuk μαθητευθείς dan θησαυρός mempertahankan alternatif semantis yang relevan.
  issues:
