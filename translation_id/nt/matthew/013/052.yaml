id: MAT.13.52
reference: Matthew 13:52
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Karena itu, setiap ahli Taurat yang telah dididik untuk Kerajaan Surga[a] adalah seperti seorang kepala rumah tangga[b] yang mengeluarkan dari perbendaharaannya[c] hal-hal yang baru dan yang lama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah dijadikan murid Kerajaan Surga.” Kata Yunani yang dipakai dapat berarti dididik atau dijadikan murid.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, orang yang menjadi tuan atau penguasa sebuah rumah; dapat juga diterjemahkan “tuan rumah.”
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani ini dapat berarti “harta,” “perbendaharaan,” atau tempat menyimpan barang-barang berharga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Penghubung inferensial yang alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan pembicaraan sebelumnya.
- source_word: πᾶς γραμματεὺς
  choice: setiap ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, γραμματεύς lazim menunjuk orang yang terdidik dalam Taurat; ungkapan Indonesia ini lebih jelas daripada 'juru tulis' tanpa mempersempitnya menjadi jabatan modern.
- source_word: μαθητευθεὶς
  choice: yang telah dididik
  rationale: Partisip pasif ini menyatakan pembentukan atau pengajaran sebagai murid. 'Telah dididik' alami dalam bahasa Indonesia, sementara kemungkinan 'dijadikan murid' dipertahankan dalam catatan.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: untuk Kerajaan Surga
  rationale: Dativus yang tidak biasa ini dipertahankan sebagai orientasi atau tujuan, tanpa memutuskan secara berlebihan apakah artinya 'di dalam' atau 'menjadi murid dari' kerajaan.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: seorang kepala rumah tangga
  rationale: Mengungkapkan peran orang yang berwenang atas rumah tangga secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἐκβάλλει
  choice: mengeluarkan
  rationale: Dalam konteks simpanan, verba ini berarti membawa atau mengeluarkan sesuatu, bukan 'melemparkan keluar'.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: dari tempat penyimpanannya
  rationale: θησαυρός dapat berarti harta maupun tempat penyimpanan. Konteks tindakan mengeluarkan barang mendukung nuansa tempat penyimpanan, sedangkan nuansa benda berharga dijelaskan dalam catatan.
- source_word: καινὰ καὶ παλαιά
  choice: hal-hal yang baru dan yang lama
  rationale: Adjektiva netral jamak menyiratkan benda atau hal yang tidak disebutkan; terjemahan ini mempertahankan urutan serta kontras Yunani.
theological_decisions:
- issue: Makna μαθητευθεὶς sehubungan dengan ahli Taurat dan Kerajaan Surga
  choice: ahli Taurat yang telah dididik untuk Kerajaan Surga
  alternative: ahli Taurat yang telah dijadikan murid Kerajaan Surga
  rationale: Pilihan utama menyampaikan pembentukan pasif tanpa membatasi gambaran hanya pada pertobatan atau pendidikan hukum formal; catatan menjaga nuansa pemuridan yang memang terdapat dalam verba Yunani.
- issue: Hubungan dativus τῇ βασιλείᾳ dengan μαθητευθεὶς
  choice: untuk Kerajaan Surga
  alternative: dalam Kerajaan Surga / menjadi murid Kerajaan Surga
  rationale: Bentuk Yunani memungkinkan hubungan orientasi atau rujukan yang tidak sepenuhnya tegas. 'Untuk' menjaga keterbukaan itu secara ringkas dan tidak mengimpor penafsiran doktrinal tertentu.
- issue: Identitas 'yang baru dan yang lama'
  choice: dibiarkan sebagai hal-hal yang baru dan yang lama
  alternative: ajaran baru dan ajaran lama
  rationale: Teks Yunani tidak menyebut 'ajaran', Taurat, perjanjian, atau kategori teologis tertentu; terjemahan mempertahankan gambaran terbuka tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dibaca. Sebutan 'Yesus' ditambahkan untuk memperjelas subjek pronominal dalam ayat mandiri. 'Ahli Taurat' mengikuti istilah Alkitab Indonesia yang dikenal luas. Kapitalisasi 'Kerajaan Surga' dipakai sebagai sebutan khas dalam Injil Matius. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
