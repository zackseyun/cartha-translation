  to: Lalu Ia berkata kepada mereka, “Karena itu, setiap ahli Taurat yang telah dididik untuk Kerajaan Surga[a] adalah seperti seorang kepala rumah tangga[b] yang mengeluarkan dari perbendaharaannya[c] hal-hal yang baru dan yang lama.”
