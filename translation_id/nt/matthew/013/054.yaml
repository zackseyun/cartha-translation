    text: Atau, “mukjizat-mukjizat”; secara lebih harfiah, “kuasa-kuasa.”
    reason: lexical_alternative
  revision_rationale: Revisi mengganti istilah umum “rumah ibadat” dengan “sinagoge,” memulihkan penanda hasil melalui “sehingga,” dan mencerminkan unsur penunjukan dalam pertanyaan Yunani. Catatan kaki dipadatkan agar membedakan alternatif kontekstual “mukjizat-mukjizat” dari padanan leksikal yang lebih harfiah, “kuasa-kuasa,” tanpa memaksakan salah satunya pada teks utama.
