id: MAT.13.54
reference: Matthew 13:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: id
  text: Setelah tiba di kampung halaman-Nya, Ia mengajar mereka di sinagoge mereka, sehingga mereka takjub dan berkata, “Dari mana orang ini memperoleh hikmat ini dan perbuatan-perbuatan penuh kuasa[a] ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mukjizat-mukjizat”; secara lebih harfiah, “kuasa-kuasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: kampung halaman
  rationale: Dalam konteks ini, kata tersebut menunjuk pada tempat asal Yesus, tempat Ia dibesarkan dan dikenal oleh penduduk setempat, bukan pada sebuah negara. “Kampung halaman” alami dalam bahasa Indonesia modern.
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Bentuk imperfek menggambarkan kegiatan mengajar yang sedang berlangsung. Dalam rangkaian naratif Indonesia, “mengajar” setelah “setibanya” menyampaikan tindakan tersebut secara alami tanpa memaksakan bentuk progresif yang kaku.
- source_word: συναγωγῇ
  choice: rumah ibadat
  rationale: Dalam latar Yahudi ini, kata tersebut menunjuk pada sinagoge. “Rumah ibadat” jelas dan lazim bagi pembaca Indonesia, sementara kata ganti “mereka” mempertahankan αὐτῶν.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Mereka pun takjub dan berkata
  rationale: ὥστε menyatakan hasil dari pengajaran Yesus. Partikel “pun” menghubungkan hasil itu secara alami, sedangkan “takjub” mempertahankan kekuatan reaksi mereka.
- source_word: Πόθεν
  choice: Dari mana ... memperoleh
  rationale: Kata tanya ini mempersoalkan sumber atau asal. Susunan tersebut alami dalam bahasa Indonesia dan tetap menyoroti pertanyaan tentang sumber hikmat serta karya-karya Yesus.
- source_word: τούτῳ
  choice: orang ini
  rationale: Demonstratif datif ini merujuk kepada Yesus dengan nada agak berjarak. “Orang ini” mempertahankan nuansa tersebut lebih baik daripada sekadar “dia”.
- source_word: σοφία
  choice: hikmat
  rationale: Padanan baku yang menyatakan kebijaksanaan atau wawasan luar biasa yang tampak dalam pengajaran Yesus.
- source_word: δυνάμεις
  choice: perbuatan-perbuatan penuh kuasa
  rationale: Bentuk jamak δύναμεις secara leksikal berarti “kuasa-kuasa”, tetapi dalam konteks ini menunjuk secara metonimis pada karya-karya luar biasa. Pilihan ini alami dalam bahasa Indonesia, mempertahankan unsur “kuasa”, dan tidak langsung mempersempit maknanya menjadi istilah teknis “mukjizat”.
theological_decisions:
- issue: Makna δυνάμεις bagi karya-karya luar biasa Yesus
  choice: perbuatan-perbuatan penuh kuasa
  alternative: mukjizat-mukjizat; secara lebih harfiah, kuasa-kuasa
  rationale: Ungkapan ini mempertahankan hubungan leksikal dengan kuasa sekaligus menyampaikan bahwa yang dimaksud ialah perbuatan yang dapat disaksikan. Terjemahan ini tidak menetapkan istilah teologis yang lebih sempit daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kampung halaman” dipilih untuk nuansa lokal πατρίς; “rumah ibadat” mempertahankan kejelasan bagi pembaca umum. Kata ganti yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai gaya teks Alkitab Indonesia yang lazim.
