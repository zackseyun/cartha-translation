source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: id
  text: Ketika ia sedang menabur, sebagian benih[a] jatuh di samping jalan. Burung-burung pun datang dan melahapnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah bahasa Yunani berbunyi, “sebagian jatuh di samping jalan”; kata “benih” dipasok dari konteks penabur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Ketika ia sedang menabur
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan waktu yang bersamaan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan aspek tindakan yang sedang berlangsung.
- source_word: ἃ μὲν
  choice: sebagian benih
  rationale: Pronomina relatif netral jamak secara harfiah berarti 'sebagian hal/barang' dan mengacu pada benih dalam konteks. Kata 'benih' perlu dipasok agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Aoristus indikatif dalam narasi paling wajar diterjemahkan sebagai peristiwa sederhana, 'jatuh'.
- source_word: παρὰ τὴν ὁδόν
  choice: di samping jalan
  rationale: παρά dengan akusatif menunjukkan letak di sisi jalan. 'Di samping jalan' mempertahankan makna spasial tanpa memakai ungkapan yang usang.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: Burung-burung pun datang
  rationale: Partisip aoristus diterjemahkan secara alami sebagai verba berhingga yang menyatakan urutan tindakan. πετεινά berarti burung atau makhluk terbang; 'burung-burung' paling jelas, sedangkan unsur 'di udara' tidak terdapat dalam ayat ini.
- source_word: κατέφαγεν
  choice: melahapnya
  rationale: κατεσθίω menyatakan tindakan memakan sampai habis. 'Melahap' mempertahankan daya intensif verba itu dalam bahasa Indonesia yang alami.
- source_word: αὐτά
  choice: -nya
  rationale: Pronomina ini mengacu pada benih yang jatuh. Enklitik '-nya' memberikan rujukan yang alami dan ringkas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Ia' dipertahankan karena rujukannya adalah penabur dalam perumpamaan, dan 'pun' menandai kelanjutan urutan peristiwa tanpa menambah isi teologis.
