base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: id
  text: Namun, ia berkata, “Tidak, sebab jangan-jangan ketika kalian mengumpulkan lalang[a] itu, kalian juga mencabut gandum bersama lalang itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulma”; mungkin secara khusus “darnel,” sejenis gulma yang pada tahap awal pertumbuhannya dapat menyerupai gandum.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ia berkata
  rationale: Bentuk Yunani adalah present historis, tetapi bentuk lampau lebih alami dalam narasi bahasa Indonesia dan tidak mengubah maknanya.
- source_word: Οὔ
  choice: Jangan
  rationale: Dalam konteks jawaban terhadap usul para hamba untuk mencabut lalang, larangan langsung “Jangan” lebih alami daripada jawaban nominal “Tidak”.
- source_word: μήποτε
  choice: sebab ... mungkin
  rationale: Mengungkapkan peringatan terhadap akibat yang tidak dikehendaki tanpa menyatakan bahwa akibat itu pasti terjadi.
- source_word: συλλέγοντες
  choice: ketika kalian mengumpulkan
  rationale: Partisip ini menunjukkan tindakan yang berlangsung bersamaan dengan kemungkinan tercabutnya gandum; “kalian” memperjelas bahwa perkataan ditujukan kepada para hamba.
- source_word: ζιζάνια
  choice: lalang
  rationale: “Lalang” merupakan istilah Indonesia yang dikenal dalam tradisi perumpamaan ini dan menggambarkan gulma yang menyerupai gandum; kemungkinan identifikasi yang lebih khusus dicatat dalam catatan kaki.
- source_word: ἐκριζώσητε
  choice: tercabut
  rationale: Kata Yunani menunjuk pada pencabutan sampai ke akar. Bentuk ini menghasilkan kalimat Indonesia yang alami dalam konstruksi peringatan tersebut.
- source_word: ἅμα αὐτοῖς
  choice: bersama-sama dengannya
  rationale: Menunjukkan bahwa gandum dapat ikut tercabut bersama lalang. Pronomina tunggal kolektif merujuk pada “lalang” sebagai jenis tumbuhan.
- source_word: σῖτον
  choice: gandum
  rationale: Dalam konteks pertanian dan pertentangannya dengan ζιζάνια, kata ini paling wajar dipahami sebagai gandum, bukan biji-bijian secara umum.
theological_decisions:
- issue: Penerjemahan ζιζάνια dalam perumpamaan yang dikenal luas
  choice: lalang
  alternative: gulma; darnel
  rationale: Istilah ini tidak perlu dipersempit secara pasti pada satu spesies. “Lalang” mempertahankan bentuk yang akrab bagi pembaca Alkitab Indonesia, sedangkan kemungkinan identifikasi botanis yang lebih khusus dicatat tanpa menjadikannya kepastian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami; “kalian” dipakai untuk menandai orang kedua jamak yang tersirat dalam bentuk verba Yunani. Ambiguitas tingkat kepastian pada μήποτε dipertahankan dengan “mungkin”.
