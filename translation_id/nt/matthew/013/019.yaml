source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: id
  text: Setiap orang yang mendengar firman Kerajaan itu dan tidak memahaminya, si jahat[a] datang dan merenggut apa yang telah ditaburkan di dalam hatinya. Orang inilah yang ditabur di tepi jalan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: yang jahat itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: di sepanjang jalan; atau: di pinggir jalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: setiap orang yang mendengar
  rationale: Ungkapan partisipial genitif ini menyatakan keadaan umum. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya distributif πᾶς.
- source_word: λόγον τῆς βασιλείας
  choice: firman Kerajaan itu
  rationale: Firman mempertahankan citra λόγος sebagai sesuatu yang ditaburkan, sedangkan Kerajaan itu merujuk pada Kerajaan yang sedang diberitakan dalam konteks.
- source_word: μὴ συνιέντος
  choice: tidak memahaminya
  rationale: συνίημι menunjuk pada memahami atau menangkap makna; akhiran -nya secara alami merujuk kembali kepada firman Kerajaan.
- source_word: ὁ πονηρὸς
  choice: si jahat
  rationale: Artikel dan konteks mendukung pengertian sebagai pelaku jahat yang personal. Si jahat ringkas, alami, dan tidak menentukan identitasnya lebih jauh daripada teks.
- source_word: ἁρπάζει
  choice: merenggut
  rationale: Kata ini menyampaikan tindakan mengambil dengan kuat dan tiba-tiba, sesuai dengan daya gambar ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: apa yang telah ditaburkan
  rationale: Partisip perfekt pasif netral ini berfungsi sebagai nomina; terjemahan tersebut mempertahankan aspek hasil dan bentuk pasifnya.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: di dalam hatinya
  rationale: Hati mempertahankan istilah antropologis Alkitab, sementara bentuk -nya mencerminkan pronomina tunggal sumber secara alami.
- source_word: οὗτός ἐστιν
  choice: Orang inilah
  rationale: Ungkapan ini menjelaskan bahwa pendengar tersebut diidentifikasikan dengan unsur dalam perumpamaan dan terdengar alami dalam bahasa Indonesia.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: yang ditabur di tepi jalan
  rationale: Terjemahan ini mempertahankan metafora yang mencolok bahwa orang itu disebut sebagai yang ditabur, tanpa mengubahnya secara diam-diam menjadi tanah atau benih.
theological_decisions:
- issue: Identitas ὁ πονηρὸς
  choice: pelaku personal, “si jahat”
  alternative: kejahatan sebagai kekuatan abstrak
  rationale: Dalam penjelasan perumpamaan, sosok ini datang dan mengambil firman, sehingga pembacaan personal paling sesuai. Terjemahan tidak secara eksplisit menamainya sebagai Iblis karena ayat ini sendiri tidak melakukannya.
- issue: Bahasa bergender dalam αὐτοῦ
  choice: akhiran tunggal “-nya” dalam “hatinya”
  alternative: pengulangan “hati orang itu”
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga. Bentuk -nya mempertahankan ketunggalan tanpa menambahkan informasi gender yang tidak dapat diungkapkan secara alami di sini.
- issue: Identifikasi pendengar dengan yang ditabur
  choice: mempertahankan “Orang inilah yang ditabur”
  alternative: menjelaskan sebagai “Orang inilah yang seperti benih yang ditabur”
  rationale: Teks Yunani mengandung peralihan metaforis yang tegang antara orang, benih, dan tempat penaburan. Terjemahan mempertahankan ketegangan itu dan tidak menambahkan unsur perbandingan yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Firman” dipakai untuk menjaga hubungan citrawi antara pesan dan benih, sedangkan “merenggut” mempertahankan kekuatan tindakan. Penanda catatan kaki ditempatkan pada istilah yang benar-benar dijelaskannya.
