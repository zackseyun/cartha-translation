review_pass:
  verdict: revise
  source_fidelity: Terjemahan respons mereka sebagai “tersinggung karena Dia” cukup mencerminkan ἐσκανδαλίζοντο ἐν αὐτῷ dalam konteks ini. Namun, “dihormati di mana-mana” menambahkan cakupan eksplisit “di mana-mana” yang tidak dinyatakan dalam teks Yunani. Pepatah itu lebih baik diterjemahkan langsung dengan pengecualian bagi tempat asal dan lingkungan rumahnya.
  naturalness: Bahasa Indonesia draft pada umumnya baku dan mudah dibaca. “Seorang nabi dihormati, kecuali ...” adalah bentuk pepatah yang alami tanpa perlu menambahkan “di mana-mana”. Penempatan penanda catatan kaki diperjelas agar menempel pada unsur yang dijelaskan.
  terminology: “Nabi,” “kampung halamannya,” dan “rumahnya sendiri” sesuai dengan register modern baku. Catatan untuk οἰκία dengan tepat mempertahankan kemungkinan arti rumah, rumah tangga, atau lingkaran keluarga. Catatan bagi σκανδαλίζομαι sebaiknya tidak menawarkan “menolak Dia” sebagai alternatif leksikal langsung, karena itu lebih merupakan penafsiran akibat daripada padanan idiom tersebut.
  issues:
  - severity: medium
    issue: Frasa “di mana-mana” ditambahkan dalam pepatah Yesus.
    rationale: Teks Yunani menyatakan bahwa seorang nabi tidak tanpa kehormatan kecuali di tempat asal dan rumahnya; kata yang setara dengan “di mana-mana” tidak ada. Walaupun maksud pepatahnya dapat dipahami demikian, terjemahan langsung dapat menghindari penambahan cakupan.
  - severity: low
    issue: Catatan kaki a mencantumkan “menolak Dia” sebagai alternatif terjemahan.
    rationale: Dalam konteks ini ungkapan tersebut memang berkaitan dengan sikap negatif terhadap Yesus, tetapi “menolak” bukan padanan leksikal langsung dari idiom “tersandung/tersinggung oleh karena Dia.”
  - severity: low
    issue: Penanda catatan kaki c ditempatkan setelah tanda titik penutup kutipan.
    rationale: Penanda lebih jelas bila ditempatkan langsung sesudah “sendiri,” yaitu unsur οἰκίᾳ αὐτοῦ yang dijelaskan.
