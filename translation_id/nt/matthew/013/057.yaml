  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: id
  text: Mereka pun tersinggung karena Dia.[a] Namun Yesus berkata kepada mereka, “Seorang nabi dihormati, kecuali di kampung halamannya[b] dan di rumahnya sendiri[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka tersinggung oleh Dia”; secara harfiah, “mereka dibuat tersandung di dalam Dia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “daerah asalnya” atau “tanah asalnya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “di tengah rumah tangganya sendiri” atau “di kalangan keluarganya sendiri.” Kata Yunani yang dipakai dapat menunjuk rumah maupun orang-orang dalam rumah tangga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: tersinggung karena Dia
  rationale: Dalam konteks ini, ungkapan tersebut menyatakan bahwa mereka menolak atau merasa keberatan terhadap Yesus, bukan tersandung secara harfiah. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur rasa tersinggung.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Namun, Yesus berkata kepada mereka
  rationale: δέ menandai peralihan yang mengandung kontras ringan antara reaksi mereka dan jawaban Yesus.
- source_word: προφήτης
  choice: nabi
  rationale: Padanan baku dan langsung yang mempertahankan bentuk pepatah itu.
- source_word: οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ
  choice: Seorang nabi dihormati di mana-mana, kecuali
  rationale: Rumusan positif ini menyampaikan idiom negatif Yunani secara alami dalam bahasa Indonesia sekaligus mempertahankan pola pengecualian dan tema kehormatan.
- source_word: πατρίδι
  choice: daerah asalnya
  rationale: πατρίς dalam konteks Nazaret menunjuk tempat asal atau lingkungan kampung halaman, bukan semata-mata negara atau bangsa.
- source_word: οἰκίᾳ αὐτοῦ
  choice: di rumahnya sendiri
  rationale: οἰκία dapat menunjuk rumah maupun lingkup rumah tangga atau keluarga. Terjemahan utama mempertahankan kata 'rumah', sedangkan catatan menjelaskan keluasan maknanya.
theological_decisions:
- issue: Cakupan pepatah Yesus tentang penolakan seorang nabi
  choice: Menyajikannya sebagai pepatah umum mengenai kurangnya penghormatan di lingkungan asal dan rumah sendiri
  alternative: Memperjelasnya secara interpretatif sebagai ketidakpercayaan keluarga Yesus secara khusus
  rationale: Teks menerapkan sebuah pepatah pada keadaan saat itu, tetapi tidak mengembangkan klaim doktrinal yang lebih luas; terjemahan mempertahankan ketegangan antara pernyataan umum dan penerapannya kepada Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pepatah dibuat alami bagi pembaca umum tanpa menghilangkan tema kehormatan, sedangkan ambiguitas οἰκία dan nuansa idiom σκανδαλίζομαι dijaga melalui catatan kaki.
