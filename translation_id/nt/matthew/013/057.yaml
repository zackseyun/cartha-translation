revisions:
- from: Mereka pun tersinggung karena Dia.[a] Namun, Yesus berkata kepada mereka, “Seorang nabi dihormati di mana-mana, kecuali di daerah asalnya[b] dan di rumahnya sendiri.”[c]
  to: Mereka pun tersinggung karena Dia.[a] Namun Yesus berkata kepada mereka, “Seorang nabi dihormati, kecuali di kampung halamannya[b] dan di rumahnya sendiri[c].”
  rationale: Revisi menghapus penambahan “di mana-mana” untuk mengikuti bentuk dan cakupan pepatah Yunani dengan lebih ketat. Padanan “kampung halamannya” secara alami menyampaikan πατρίδι dalam konteks lokal. Catatan kaki dipersempit pada alternatif leksikal yang benar-benar didukung teks dan penandanya ditempatkan pada kata yang relevan.
