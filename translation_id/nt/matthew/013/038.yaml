  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: id
  text: Ladang itu adalah dunia, dan benih yang baik itu adalah anak-anak Kerajaan. Lalang[a] itu adalah anak-anak si jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gulma”; secara khusus, mungkin darnel, tumbuhan yang menyerupai gandum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: ladang
  rationale: Padanan alami dalam konteks perumpamaan pertanian dan mempertahankan gambaran tempat penaburan.
- source_word: κόσμος
  choice: dunia
  rationale: Menunjuk secara luas pada dunia sebagai ranah tempat penaburan berlangsung.
- source_word: καλὸν σπέρμα
  choice: benih yang baik
  rationale: Mempertahankan metafora pertanian serta kontras dengan lalang.
- source_word: υἱοὶ τῆς βασιλείας
  choice: anak-anak Kerajaan
  rationale: Ungkapan relasional 'anak-anak' dalam bahasa Indonesia mencakup orang-orang yang menjadi milik Kerajaan tanpa menyiratkan hanya laki-laki; huruf kapital menandai Kerajaan Allah yang dimaksud dalam konteks.
- source_word: ζιζάνια
  choice: lalang
  rationale: Padanan Indonesia yang dikenal luas untuk gulma mirip gandum dalam perumpamaan ini dan lebih spesifik daripada 'rumput liar'.
- source_word: υἱοὶ τοῦ πονηροῦ
  choice: anak-anak si jahat
  rationale: Mempertahankan ungkapan relasional dan pembacaan personal atas bentuk articular masculine singular τοῦ πονηροῦ.
theological_decisions:
- issue: Apakah τοῦ πονηροῦ menunjuk pada kejahatan secara abstrak atau sosok personal
  choice: si jahat
  alternative: kejahatan
  rationale: Artikel dan bentuk maskulin tunggal paling wajar menunjuk kepada sosok personal, tetapi terjemahan tidak menambahkan identitas yang tidak dinyatakan langsung dalam ayat.
- issue: Cara menerjemahkan υἱοὶ dalam ungkapan relasional
  choice: anak-anak
  alternative: putra-putra
  rationale: Dalam idiom ini, υἱοὶ menunjuk kepada orang-orang yang tergolong atau menjadi milik suatu pihak. 'Anak-anak' adalah ungkapan Indonesia yang alami dan representatif, sedangkan 'putra-putra' dapat secara keliru membatasi rujukan pada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur tiga penjelasan paralel dipertahankan dengan dua kalimat; koma penutup pada sumber diperlakukan sebagai kelanjutan konteks, bukan bagian yang perlu ditiru. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
