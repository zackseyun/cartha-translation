id: MAT.13.31
reference: Matthew 13:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: id
  text: Ia menyampaikan perumpamaan lain kepada mereka, kata-Nya, “Kerajaan Surga itu seperti sebiji sesawi yang diambil seseorang lalu ditaburkannya di ladangnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: menyampaikan
  rationale: Dalam konteks pengajaran, παρατίθημι berarti mengemukakan atau menyajikan sesuatu kepada para pendengar. “Menyampaikan” wajar dalam bahasa Indonesia dan tetap menunjukkan bahwa perumpamaan itu dikemukakan kepada mereka.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: “Perumpamaan” adalah istilah baku dan tepat bagi παραβολή dalam konteks pengajaran Injil Sinoptik.
- source_word: Ὁμοία ἐστὶν
  choice: itu seperti
  rationale: Ungkapan ini menyampaikan rumus perbandingan Yunani secara alami tanpa menentukan secara berlebihan unsur mana dari keseluruhan perumpamaan yang menjadi titik persamaannya.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ini adalah padanan baku bagi ungkapan khas Matius, mempertahankan cakupan makna kerajaan sebagai pemerintahan sekaligus ranah tanpa mempersempitnya menjadi salah satu saja.
- source_word: κόκκῳ σινάπεως
  choice: sebiji sesawi
  rationale: “Biji sesawi” adalah padanan Indonesia yang lazim untuk κόκκος σινάπεως; bentuk “sebiji” sesuai dengan nomina tunggal dan menghasilkan kalimat yang alami.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: yang diambil seseorang
  rationale: Partisipel λαβών dialihkan secara alami menjadi verba “diambil”, sedangkan ἄνθρωπος di sini tidak menekankan jenis kelamin dan wajar diterjemahkan “seseorang” dalam bahasa Indonesia.
- source_word: ἔσπειρεν
  choice: ditaburkannya
  rationale: σπείρω secara khusus menunjuk tindakan menabur benih. Bentuk ini lebih tepat daripada “ditanamnya” dan merangkai kedua tindakan dalam bahasa Indonesia yang lancar.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: di ladangnya
  rationale: ἀγρός dalam latar pertanian berarti ladang, dan sufiks posesif “-nya” mempertahankan αὐτοῦ secara ringkas dan alami.
theological_decisions:
- issue: Pemadanan βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  alternative: pemerintahan surga
  rationale: “Kerajaan Surga” mempertahankan istilah khas Matius dan membiarkan nuansa pemerintahan serta ranah tetap terbuka, alih-alih membatasinya pada gagasan abstrak tentang tindakan memerintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lancar bagi pembaca umum sambil mempertahankan urutan tindakan dalam teks Yunani. Kapitalisasi “Kerajaan Surga” dipakai sebagai istilah teologis yang mapan; tidak diperlukan catatan kaki.
