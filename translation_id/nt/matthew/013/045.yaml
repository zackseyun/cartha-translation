  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: id
  text: Sekali lagi, Kerajaan Surga itu seperti seorang pedagang yang mencari mutiara-mutiara bermutu tinggi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kerajaan Surga itu seperti seorang manusia, seorang pedagang, yang mencari mutiara-mutiara bermutu tinggi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Sekali lagi
  rationale: Menandai perbandingan lain dalam rangkaian perumpamaan tentang kerajaan dan mempertahankan alur wacana secara alami.
- source_word: ὁμοία ἐστὶν
  choice: itu seperti
  rationale: Ungkapan perbandingan yang alami dalam bahasa Indonesia dan tetap mempertahankan bentuk simile.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan baku dan alami bagi ungkapan khas Matius tanpa membuat bentuk jamak 'langit' yang kaku.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: seorang pedagang
  rationale: ἔμπορος sudah menunjukkan bahwa orang tersebut adalah pedagang; padanan ini ringkas dan alami, sedangkan unsur ἀνθρώπῳ tetap tersirat dalam 'seorang'.
- source_word: ζητοῦντι
  choice: yang mencari
  rationale: Mencerminkan partisipel kini yang menggambarkan kegiatan pedagang tersebut, sekaligus menghasilkan susunan Indonesia yang wajar.
- source_word: καλοὺς μαργαρίτας
  choice: mutiara-mutiara bermutu tinggi
  rationale: Dalam konteks perdagangan, καλός menunjuk pada mutu atau keunggulan; 'bermutu tinggi' lebih tepat daripada sekadar keindahan rupa.
theological_decisions:
- issue: Cakupan perbandingan dalam rumusan perumpamaan
  choice: Kerajaan Surga dibandingkan secara langsung dengan seorang pedagang.
  alternative: Kerajaan Surga seperti keseluruhan keadaan yang melibatkan pedagang yang mencari mutiara bermutu tinggi.
  rationale: Konstruksi Yunani ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ menjadikan pedagang sebagai unsur pembanding langsung. Terjemahan tidak mempersempit atau memperluas makna kiasannya melampaui susunan sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi “Kerajaan Surga” dipakai sebagai sebutan teologis yang mapan. Pengulangan “mutiara-mutiara” menyatakan bentuk jamak sumber dengan wajar.
