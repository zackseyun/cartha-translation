base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: id
  text: 'Ia menyampaikan perumpamaan lain kepada mereka: “Kerajaan Surga itu seperti ragi[a] yang diambil oleh seorang perempuan lalu disembunyikannya[b] ke dalam tiga takaran tepung[c] sampai seluruhnya beragi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahan peragi”, yaitu bahan yang membuat adonan beragi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “menyembunyikannya”; dalam konteks pembuatan adonan dapat dipahami “mencampurkannya” atau “mengadukkannya ke dalam”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “tiga sata tepung”. Sata adalah satuan isi kering kuno; tiga sata merupakan tepung dalam jumlah besar.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Ia menyampaikan perumpamaan lain kepada mereka
  rationale: Ungkapan ini memperkenalkan satu perumpamaan tambahan. “Menyampaikan ... kepada mereka” alami dalam narasi Indonesia dan tetap mempertahankan tindakan berbicara tanpa menambahkan isi.
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan surga itu seperti
  rationale: Ini mempertahankan rumus perbandingan dalam perumpamaan. Bentuk tunggal “surga” merupakan padanan Indonesia yang lazim bagi ungkapan Matius yang dipengaruhi pola bahasa Semitik.
- source_word: ζύμῃ
  choice: ragi
  rationale: ζύμη menunjuk pada bahan peragi yang digunakan dalam adonan. “Ragi” adalah istilah Indonesia modern yang jelas dan tetap netral terhadap penilaian positif atau negatif atas gambaran tersebut.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: yang diambil seorang perempuan
  rationale: Bentuk partisip λαβοῦσα menyatakan tindakan yang mendahului tindakan utama. Susunan ini mempertahankan urutan tindakan secara ringkas dan alami.
- source_word: ἐνέκρυψεν εἰς
  choice: lalu disembunyikannya dalam
  rationale: ἐγκρύπτω secara harfiah berarti menyembunyikan atau membenamkan di dalam. Pilihan ini mempertahankan gambaran sumber; makna kontekstual “mencampurkan” dicatat sebagai alternatif.
- source_word: ἀλεύρου σάτα τρία
  choice: tiga takaran tepung
  rationale: σάτον adalah satuan isi kering. “Takaran” mudah dipahami pembaca modern, sedangkan nama satuan kunonya dan besarnya jumlah itu dijelaskan dalam catatan kaki.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: sampai seluruhnya beragi
  rationale: Bentuk pasif ἐζυμώθη menyatakan bahwa seluruh massa tepung atau adonan terkena daya ragi. “Seluruhnya” mempertahankan ὅλον tanpa secara berlebihan menentukan apakah acuannya tepung atau adonan.
theological_decisions:
- issue: Konotasi ζύμη dalam perumpamaan tentang Kerajaan Surga
  choice: Menerjemahkannya secara netral sebagai “ragi”
  alternative: Memberi kata-kata yang menandakan bahwa ragi di sini secara teologis positif atau negatif
  rationale: Teks membandingkan Kerajaan Surga dengan ragi dan menonjolkan daya kerjanya yang tersembunyi serta menyeluruh, tetapi tidak secara eksplisit menetapkan konotasi moral gambaran itu. Terjemahan tidak boleh menyelesaikan perdebatan penafsiran tersebut.
- issue: Cakupan perbandingan dalam rumus “Kerajaan Surga itu seperti”
  choice: Mempertahankan rumus perbandingan sebagaimana dinyatakan dalam teks
  alternative: Mengubahnya menjadi “cara Kerajaan Surga bekerja seperti” atau secara khusus menyamakan kerajaan dengan perempuan maupun seluruh proses
  rationale: Bentuk Yunani membiarkan cakupan tepat perbandingan tetap terbuka. Terjemahan mempertahankan keluwesan perumpamaan dan tidak mempersempit titik perbandingannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan dengan struktur yang mudah dipahami. “Kerajaan surga” dipertahankan sebagai ungkapan khas Matius. Istilah teknis kuno “sata” tidak dimasukkan ke teks utama agar keterbacaan terjaga, tetapi dicatat untuk ketepatan historis. Semua penanda catatan kaki [a], [b], dan [c] hadir dalam teks utama.
