id: MAT.13.40
reference: Matthew 13:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: id
  text: Karena itu, sama seperti gulma[a] dikumpulkan dan dibakar dengan api, demikian juga akan terjadi pada kesudahan zaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional, “lalang.” Istilah Yunani menunjuk pada gulma berbahaya, kemungkinan darnel.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesudahan dunia”; secara harfiah, “kesudahan zaman.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Karena itu, sama seperti
  rationale: ὥσπερ membuka perbandingan ('sama seperti'), sedangkan οὖν menghubungkannya sebagai kesimpulan atau kelanjutan logis ('karena itu'). Keduanya dipertahankan.
- source_word: συλλέγεται
  choice: dikumpulkan
  rationale: Bentuk kini pasif dengan subjek netral jamak menyatakan bahwa gulma itu dikumpulkan. Bentuk pasif bahasa Indonesia mempertahankan fokus teks.
- source_word: τὰ ζιζάνια
  choice: gulma
  rationale: ζιζάνια menunjuk pada tumbuhan pengganggu yang berbahaya, kemungkinan darnel. 'Gulma' jelas dalam bahasa Indonesia modern dan tidak secara keliru menyamakan tumbuhan itu dengan spesies lalang Indonesia.
- source_word: πυρὶ καίεται
  choice: dibakar dengan api
  rationale: Dativus πυρί dapat dipahami secara instrumental. Terjemahan ini mempertahankan penyebutan api secara eksplisit tanpa menambahkan gagasan bahwa gulma itu pasti habis dilalap.
- source_word: οὕτως ἔσται
  choice: demikian juga akan terjadi
  rationale: Ungkapan ini menghubungkan gambaran sebelumnya dengan penggenapannya pada masa mendatang. 'Akan terjadi' merupakan padanan Indonesia yang alami bagi ἔσται dalam konteks ini.
- source_word: ἐν τῇ συντελείᾳ
  choice: pada kesudahan
  rationale: συντέλεια menyatakan pencapaian akhir atau penuntasan. 'Pada kesudahan' mempertahankan nuansa puncak akhir sekaligus tetap dapat dipahami.
- source_word: τοῦ αἰῶνος
  choice: zaman
  rationale: αἰών di sini terutama memiliki makna temporal, yaitu suatu zaman, bukan kosmos fisik. Bahasa Yunani tidak memuat kata tunjuk, sehingga tidak ditambahkan 'ini'.
theological_decisions:
- issue: Makna eskatologis τοῦ αἰῶνος
  choice: kesudahan zaman
  alternative: akhir dunia
  rationale: Terjemahan 'zaman' mempertahankan dimensi temporal dan sejarah penebusan dari αἰών tanpa menyamakannya dengan kehancuran dunia fisik atau memasukkan skema akhir zaman tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Karena itu, sama seperti ... demikian juga' mempertahankan hubungan logis serta struktur perbandingan Yunani. Istilah 'gulma' dipilih demi ketepatan dan kejelasan; padanan tradisional dijelaskan dalam catatan kaki.
