id: MAT.13.44
reference: Matthew 13:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: id
  text: Kerajaan surga itu seperti harta yang tersembunyi di sebuah ladang,[a] yang ditemukan seorang laki-laki dan disembunyikannya. Karena kegembiraannya, ia pergi lalu menjual segala miliknya dan membeli ladang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kerajaan surga itu seperti harta tersembunyi di ladang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: itu seperti
  rationale: Mengungkapkan rumusan perbandingan dalam perumpamaan secara alami dalam bahasa Indonesia, dengan kopula tersirat yang lazim.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan surga
  rationale: Padanan baku dan wajar bagi ungkapan khas Matius; mempertahankan cakupan βασιλεία tanpa mempersempitnya hanya menjadi wilayah atau tindakan memerintah.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: harta yang tersembunyi di sebuah ladang
  rationale: Bentuk partisipel perfekt pasif menyatakan keadaan harta yang telah disembunyikan dan tetap tersembunyi; 'sebuah ladang' sesuai dengan pengenalan latar yang belum tertentu.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: yang ditemukan oleh seorang laki-laki
  rationale: Susunan pasif menghasilkan bahasa Indonesia yang lancar sambil mempertahankan 'harta' sebagai anteseden dan tokoh laki-laki tunggal dalam sumber.
- source_word: ἔκρυψεν
  choice: lalu disembunyikannya kembali
  rationale: Objeknya ialah harta yang baru ditemukan. 'Kembali' memperjelas bahwa harta itu dikembalikan ke keadaan tersembunyi, suatu implikasi alami dari urutan narasi.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: Karena begitu bersukacita
  rationale: ἀπό di sini menyatakan sebab atau dorongan; bentuk ini menyampaikan hubungan kausal serta kuatnya kegembiraan secara alami.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: ia pergi menjual segala miliknya
  rationale: Mempertahankan urutan tindakan dan cakupan menyeluruh πάντα ὅσα ἔχει dalam ungkapan Indonesia yang ringkas.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: membeli ladang itu
  rationale: Demonstrativa 'itu' menunjuk secara tegas kepada ladang tertentu yang berisi harta tersebut.
theological_decisions:
- issue: Cakupan makna βασιλεία
  choice: Kerajaan
  alternative: pemerintahan
  rationale: βασιλεία dapat menunjuk pemerintahan maupun ranah kerajaan. 'Kerajaan' mempertahankan keluasan maknanya dan merupakan ungkapan Matius yang dikenal tanpa memaksakan salah satu nuansa.
- issue: Penggambaran ἄνθρωπος
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Tokoh dalam teks berbentuk maskulin tunggal; padanan ini mempertahankan gambaran naratif tersebut tanpa menjadikannya tuntutan teologis universal.
- issue: Hubungan ἀπὸ τῆς χαρᾶς αὐτοῦ dengan tindakan berikutnya
  choice: Karena begitu bersukacita, ia pergi menjual segala miliknya
  alternative: ia menyembunyikannya, dan karena sukacitanya ia pergi menjual segala miliknya
  rationale: Frasa preposisional paling wajar menerangkan motivasi tindakan pergi dan menjual. Tanda baca sumber tidak menentukan secara mutlak, sehingga alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Surga' dipilih sebagai bentuk baku modern. Kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan logis atau alur perumpamaan.
