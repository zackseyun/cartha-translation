  source_fidelity: Revisi diperlukan. Kata “kembali” tidak ada dalam ἔκρυψεν dan secara tidak perlu menambahkan nuansa bahwa harta itu dikembalikan ke keadaan semula. Frasa ἀπὸ τῆς χαρᾶς αὐτοῦ lebih langsung dinyatakan sebagai “karena kegembiraannya.”
  naturalness: Teks revisi tetap modern dan alami. Susunan aktif “yang ditemukan seorang laki-laki dan disembunyikannya” mengikuti alur Yunani dengan jelas; “ia pergi lalu menjual” mempertahankan dua tindakan berurutan tanpa terasa kaku.
  terminology: “Kerajaan surga,” “harta,” “ladang,” dan “segala miliknya” adalah padanan yang baik. “Seorang laki-laki” mempertahankan tokoh maskulin tunggal tanpa menambahkan implikasi teologis.
