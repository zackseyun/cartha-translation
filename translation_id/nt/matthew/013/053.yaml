base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: id
  text: Setelah Yesus selesai menyampaikan perumpamaan-perumpamaan itu, Ia pergi dari sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Setelah
  rationale: Gabungan idiom naratif καὶ ἐγένετο dengan klausa waktu ὅτε mengalihkan cerita kepada tindakan berikutnya. Dalam bahasa Indonesia modern, “Setelah” secara alami menyatakan bahwa selesainya pengajaran mendahului kepergian Yesus tanpa mempertahankan ungkapan kaku “dan terjadilah ketika”.
- source_word: ἐτέλεσεν
  choice: selesai menyampaikan
  rationale: τελέω berarti membawa sesuatu sampai selesai. Karena objeknya adalah sejumlah perumpamaan dalam konteks pengajaran, “selesai menyampaikan” terdengar alami dan memperjelas tindakan yang tersirat tanpa mengubah isinya.
- source_word: τὰς παραβολὰς ταύτας
  choice: perumpamaan-perumpamaan itu
  rationale: παραβολή adalah istilah baku untuk genre pengajaran ini, sedangkan ταύτας menunjuk kepada kumpulan perumpamaan yang baru saja disampaikan. Bentuk ulang menandai jamak secara jelas dan wajar.
- source_word: μετῆρεν
  choice: pergi
  rationale: μεταίρω di sini menyatakan meninggalkan suatu tempat atau berangkat darinya. “Pergi” merupakan padanan Indonesia yang alami; keterangan ἐκεῖθεν sudah menyatakan titik keberangkatannya.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia ini berarti “dari sana” dan menunjuk kembali kepada lokasi dalam adegan sebelumnya.
