  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengar!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Siapa yang mempunyai
  rationale: Artikel dengan participel kini berfungsi secara substantival dan merujuk secara umum kepada siapa pun yang memiliki ciri tersebut. Dalam bahasa Indonesia, “Siapa yang mempunyai” menyampaikan acuan generik dengan alami tanpa memasukkan gender yang tidak perlu.
- source_word: ὦτα
  choice: telinga
  rationale: Bentuk Yunani ini jamak, tetapi bahasa Indonesia tidak wajib menandai jamak pada nomina apabila maknanya sudah jelas. “Telinga” merupakan bentuk idiomatis dan tetap mengacu pada organ pendengaran secara umum.
- source_word: ἀκουέτω
  choice: hendaklah ia mendengar
  rationale: Imperatif aktif kini orang ketiga tunggal dipertahankan sebagai seruan langsung. “Mendengar” menjaga hubungan leksikal dengan ἀκούω dan, dalam konteks perkataan Yesus, menyiratkan penerimaan yang penuh perhatian.
theological_decisions:
- issue: Acuan generik maskulin tunggal dalam bahasa Yunani
  choice: Siapa yang mempunyai telinga, hendaklah ia mendengar!
  alternative: Orang yang mempunyai telinga, hendaklah mendengar!
  rationale: Bahasa Indonesia dapat menyatakan acuan generik tanpa pembedaan gender. Kata “ia” mempertahankan acuan tunggal, sedangkan “siapa yang” menyampaikan sifat umum ungkapan Yunani tanpa menjadikannya khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “hendaklah ia mendengar” mempertahankan daya imperatif dan corak aforistis perkataan Yesus; tanda seru menegaskan seruan tersebut tanpa menambah isi.
