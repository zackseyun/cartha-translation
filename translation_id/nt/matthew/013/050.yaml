  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna Yunani: futur βαλοῦσιν diterjemahkan “akan melemparkan,” objek jamak αὐτούς diperjelas secara sah sebagai “orang-orang itu” menurut konteks, dan ἐκεῖ ἔσται diungkapkan dengan tepat melalui “Di sanalah akan ada.” “Perapian yang menyala-nyala” merupakan padanan idiomatis yang memadai untuk κάμινον τοῦ πυρός tanpa menghilangkan citra penghakiman.'
  naturalness: Bahasa Indonesia baku, lancar, dan bernada khidmat. “Tangisan dan kertakan gigi” adalah rumusan yang alami dan sesuai penggunaan Alkitabiah Indonesia; “Di sanalah” mempertahankan penekanan tempat tanpa terasa kaku.
  terminology: Istilah “perapian yang menyala-nyala,” “tangisan,” dan “kertakan gigi” mempertahankan citra konkret serta register Matius. Catatan kaki berjangkar tepat pada frasa yang diterjemahkan secara idiomatis dan dengan benar mencatat bentuk harfiahnya, “perapian api.”
