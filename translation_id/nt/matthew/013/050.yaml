id: MAT.13.50
reference: Matthew 13:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: id
  text: dan mereka akan melemparkan orang-orang itu ke dalam perapian yang menyala-nyala.[a] Di sanalah akan ada tangisan dan kertakan gigi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perapian api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: akan melemparkan
  rationale: Bentuk futur aktif βάλλω menyatakan tindakan melemparkan secara paksa; pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan daya ungkap teks.
- source_word: αὐτοὺς
  choice: orang-orang itu
  rationale: Pronomina maskulin jamak ini mengacu kepada orang-orang jahat dalam konteks sebelumnya. Bentuk eksplisit ini lebih jelas dan alami daripada sekadar 'mereka' sebagai objek.
- source_word: κάμινον τοῦ πυρός
  choice: perapian yang menyala-nyala
  rationale: κάμινος menunjuk pada tungku atau perapian besar, sedangkan genitif τοῦ πυρός secara harfiah berarti 'api'. Ungkapan ini menyampaikan gambaran konkret dengan bahasa Indonesia yang wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἐκεῖ
  choice: Di sanalah
  rationale: Partikel -lah mempertahankan penekanan lokatif ἐκεῖ sekaligus menghasilkan ungkapan Indonesia yang ringkas dan khidmat.
- source_word: ἔσται
  choice: akan ada
  rationale: Konstruksi eksistensial ini secara alami mewakili bentuk futur εἰμί bersama nomina-nomina yang mengikutinya.
- source_word: ὁ κλαυθμὸς
  choice: tangisan
  rationale: κλαυθμός mengacu pada tangis atau ratapan. 'Tangisan' akurat, umum dipahami, dan tidak mempersempit nuansanya.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kertakan gigi
  rationale: Ungkapan ini mempertahankan idiom konkret Matius dan lazim dipahami sebagai gambaran penderitaan atau reaksi keras dalam penghakiman.
theological_decisions:
- issue: Gambaran penghakiman dalam konteks eskatologis
  choice: Mempertahankan gambaran konkret tentang perapian, tangisan, dan kertakan gigi tanpa pelunakan atau penjelasan tambahan.
  alternative: Memparafrasakannya sebagai orang-orang yang menangis dan menggertakkan gigi karena menderita.
  rationale: Teks menyajikan gambaran penghakiman yang keras dalam penjelasan Yesus atas perumpamaan. Terjemahan tidak menentukan lebih jauh sifat atau mekanisme hukuman tersebut dan tidak mengurangi ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Di sanalah' mempertahankan penekanan teks Yunani, sedangkan 'kertakan gigi' menjaga rumusan khas Matius tanpa terdengar terlalu arkais.
