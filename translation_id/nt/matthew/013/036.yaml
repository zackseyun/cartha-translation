  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: id
  text: Kemudian, setelah meninggalkan orang banyak itu, ia masuk ke dalam rumah itu. Murid-muridnya datang kepadanya dan berkata, “Jelaskanlah kepada kami perumpamaan tentang gulma[a] di ladang itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalang”; istilah Yunani ini mungkin secara lebih khusus merujuk pada darnel, sejenis gulma yang menyerupai gandum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu ini melanjutkan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: setelah meninggalkan orang banyak itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama; bentuk ini jelas dan idiomatis. 'Orang banyak' menyampaikan kelompok khalayak dalam konteks tersebut.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: ia masuk ke dalam rumah
  rationale: Dalam konteks perpindahan dari tempat terbuka, 'masuk ke dalam rumah' menyampaikan arah gerak dengan wajar, sementara artikel tertentu dipertahankan sebagai 'rumah' yang sudah dikenal dari konteks.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Murid-muridnya datang kepadanya
  rationale: Mengikuti susunan makna Yunani secara alami dan mempertahankan bentuk jamak 'murid-murid'.
- source_word: Διασάφησον ἡμῖν
  choice: Jelaskanlah kepada kami
  rationale: Imperatif ini meminta agar makna dibuat jelas; 'jelaskanlah' merupakan padanan modern yang tepat tanpa mempersempitnya menjadi penafsiran teknis.
- source_word: τὴν παραβολὴν
  choice: perumpamaan
  rationale: '''Perumpamaan'' adalah padanan baku dan mudah dipahami untuk παραβολή dalam konteks Injil.'
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: tentang gulma di ladang itu
  rationale: '''Gulma'' mudah dipahami dan tidak menyatakan kepastian botani yang tidak diberikan oleh istilah Yunani. Hubungan genitif disampaikan secara idiomatis dengan ''di ladang itu''.'
