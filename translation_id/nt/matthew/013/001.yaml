  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: id
  text: Pada hari itu, Yesus keluar dari rumah lalu duduk di tepi laut[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada hari yang sama,” jika ungkapan ini dipahami menekankan kesinambungan dengan peristiwa sebelumnya, bukan sekadar menunjukkan waktu.
    reason: alternative_reading
  - marker: b
    text: Atau “di dekat laut.” Ungkapan Yunani ini menunjukkan tempat di dekat laut tanpa menentukan jarak yang tepat dari garis air.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Pada hari itu
  rationale: Ungkapan temporal ini diterjemahkan secara alami dan dekat dengan bentuk Yunani. Kata 'itu' menunjuk pada hari yang terkait dengan konteks sebelumnya tanpa secara eksplisit menambahkan gagasan 'yang sama'.
- source_word: ἐξελθὼν
  choice: keluar ... lalu
  rationale: Partisip aoris ini mendahului verba utama. Koordinasi dengan 'lalu' menyampaikan urutan tindakan secara wajar dalam bahasa Indonesia tanpa konstruksi partisipial yang kaku.
- source_word: τῆς οἰκίας
  choice: dari rumah
  rationale: Genitif bersama ἐξέρχομαι menyatakan tempat yang ditinggalkan. Bahasa Indonesia secara idiomatis memakai 'keluar dari rumah'.
- source_word: ἐκάθητο
  choice: duduk
  rationale: Bentuk imperfek menggambarkan Yesus dalam keadaan duduk, tetapi dalam narasi Indonesia 'lalu duduk' secara alami menyampaikan tindakan yang membentuk latar adegan tanpa memaksakan bentuk progresif.
- source_word: παρὰ τὴν θάλασσαν
  choice: di tepi danau
  rationale: παρά dengan akusatif menunjukkan posisi dekat dengan perairan. Dalam konteks Galilea, θάλασσα secara alami disebut 'danau' dalam bahasa Indonesia; 'di tepi' tidak menentukan jarak persis dari garis air.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang baku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Urutan tindakan dijelaskan dengan 'lalu'. 'Danau' dipilih sesuai rujukan geografis, sedangkan bentuk harfiah 'laut' dipertahankan dalam catatan kaki. Semua penanda catatan kaki dicantumkan dalam teks utama.
