  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: id
  text: supaya digenapi apa yang disampaikan melalui nabi itu, yang berkata, “Aku akan membuka mulutku dengan perumpamaan-perumpamaan; aku akan menuturkan hal-hal yang tersembunyi sejak peletakan dasar.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani berbunyi “sejak peletakan dasar”; sejumlah naskah berbunyi “sejak peletakan dasar dunia.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: supaya genaplah
  rationale: Menyampaikan hubungan tujuan/hasil dalam rumusan penggenapan khas Matius secara wajar dan tetap mempertahankan nuansa subjunktif tanpa membuat bahasa Indonesia kaku.
- source_word: τὸ ῥηθὲν
  choice: apa yang disampaikan
  rationale: Padanan idiomatis untuk partisipel pasif berartikel; 'disampaikan' sesuai dengan firman nubuat dan lebih alami daripada 'hal yang dikatakan'.
- source_word: διὰ τοῦ προφήτου λέγοντος
  choice: melalui nabi yang berkata
  rationale: Mempertahankan perantaraan nabi yang ditandai διά dengan genitif serta fungsi partisipel yang memperkenalkan kutipan.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Aku akan membuka mulut-Ku dengan perumpamaan-perumpamaan
  rationale: Mempertahankan citra puitis kutipan dan bentuk jamak παραβολαῖς; 'dengan' terdengar lebih alami daripada 'dalam' untuk cara berbicara.
- source_word: ἐρεύξομαι
  choice: Aku akan mengucapkan
  rationale: Menangkap makna mengeluarkan atau menuturkan dengan lantang tanpa ungkapan yang terlalu arkais atau tafsiran tambahan.
- source_word: κεκρυμμένα
  choice: hal-hal yang tersembunyi
  rationale: Mempertahankan fungsi substantival dan keadaan hasil dari partisipel perfektum pasif, tanpa menafsirkannya langsung sebagai 'rahasia-rahasia'.
- source_word: ἀπὸ καταβολῆς
  choice: sejak dunia dijadikan
  rationale: Walaupun κόσμου tidak tertulis dalam SBLGNT pada tempat ini, καταβολή tanpa pelengkap merupakan ungkapan eliptis yang menunjuk awal penciptaan dunia. Padanan ini alami dan menyampaikan makna idiomatis; bentuk sumber yang lebih singkat serta varian naskah dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas nabi dalam rumusan kutipan
  choice: melalui nabi
  alternative: melalui Asaf sang nabi
  rationale: SBLGNT hanya memuat τοῦ προφήτου dan tidak menyebut nama. Terjemahan tidak menambahkan identitas meskipun kutipan berasal dari Mazmur 78:2.
- issue: Cakupan ungkapan ἀπὸ καταβολῆς
  choice: sejak dunia dijadikan
  alternative: sejak peletakan dasar
  rationale: Ungkapan Yunani secara harfiah tidak menyebut κόσμου, tetapi secara idiomatis menunjuk permulaan dunia. Terjemahan utama mengutamakan kejelasan makna dalam bahasa Indonesia, sementara ketegangan tekstual dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan puitis dipertahankan, sedangkan ungkapan eliptis Yunani dibuat wajar bagi pembaca umum. Huruf kapital pada pronomina yang merujuk kepada pembicara dalam kutipan mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
