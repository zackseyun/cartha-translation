  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: id
  text: 'Dan pada mereka sedang digenapi nubuat Yesaya yang berbunyi: “Kamu sungguh akan mendengar, tetapi sama sekali tidak akan mengerti; dan sambil melihat, kamu sungguh akan melihat, tetapi sama sekali tidak akan memahami.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dengan mendengar kamu akan mendengar ... dan sambil melihat kamu akan melihat.” Pengulangan ini adalah ungkapan penegasan bergaya Ibrani yang disampaikan melalui bahasa Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: genaplah
  rationale: Bentuk pasif kini menyatakan bahwa nubuat itu menjadi nyata pada orang-orang yang dimaksud. “Genaplah” merupakan ungkapan Indonesia yang alami untuk formula penggenapan nubuat tanpa memaksakan arti bahwa penggenapannya bersifat tuntas secara mutlak.
- source_word: αὐτοῖς
  choice: pada mereka
  rationale: Datif ini menunjukkan bahwa nubuat tersebut digenapi dalam hal atau keadaan orang-orang itu. “Pada mereka” alami dalam bahasa Indonesia dan tidak menambahkan mekanisme teologis tertentu.
- source_word: προφητεία Ἠσαΐου
  choice: nubuat Yesaya
  rationale: Genitif ini secara alami menyatakan nubuat yang disampaikan oleh Yesaya.
- source_word: ἡ λέγουσα
  choice: yang berbunyi
  rationale: Partisip atributif memperkenalkan isi kutipan; “yang berbunyi” merupakan rumusan Indonesia yang wajar untuk teks tertulis atau nubuat.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Kamu memang akan mendengar
  rationale: Konstruksi kata benda serumpun dan verba mereproduksi penegasan bergaya Semitis. “Memang” menyampaikan penekanannya tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: οὐ μὴ συνῆτε
  choice: tetapi sama sekali tidak akan mengerti
  rationale: οὐ μή dengan bentuk subjungtif menyatakan penyangkalan yang kuat. “Sama sekali tidak” mempertahankan kekuatan itu, sedangkan “tetapi” mengungkapkan pertentangan yang tersirat dalam konteks.
- source_word: βλέποντες βλέψετε
  choice: kamu memang akan melihat
  rationale: Pengulangan akar makna dalam konstruksi Yunani menegaskan tindakan melihat. “Memang” mempertahankan kesejajaran retoris dengan klausa mendengar secara alami.
- source_word: οὐ μὴ ἴδητε
  choice: tetapi sama sekali tidak akan memahami
  rationale: Verba ἴδητε dapat menunjuk pada melihat dalam arti mengenali atau menangkap makna. “Memahami” membedakannya dari melihat secara indrawi pada klausa sebelumnya, sambil mempertahankan kontras yang dimaksud.
theological_decisions:
- issue: Sifat penggenapan nubuat
  choice: Nubuat Yesaya dinyatakan genap pada tanggapan orang-orang tersebut tanpa menjelaskan mekanisme di balik keadaan mereka.
  alternative: Nubuat itu hanya dicontohkan oleh mereka, atau sebaliknya telah dituntaskan secara mutlak dalam arti yang lebih kuat.
  rationale: “Genaplah” mempertahankan formula penggenapan dalam teks tanpa memasukkan penjelasan denominatif tentang pengerasan hati, predestinasi, atau sekadar kemiripan tipologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran antara mendengar dan melihat dipertahankan, sedangkan “memang” dan “sama sekali tidak” menyampaikan penegasan konstruksi Yunani secara wajar bagi pembaca umum.
