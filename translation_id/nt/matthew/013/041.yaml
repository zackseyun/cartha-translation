    rationale: Partisipel kini τοὺς ποιοῦντας dapat menunjukkan perilaku yang menjadi praktik atau ciri, tetapi tidak dengan sendirinya berarti tindakan yang berlangsung tanpa putus. Nuansa habitual lebih aman dicatat dalam catatan kaki.
  - severity: low
