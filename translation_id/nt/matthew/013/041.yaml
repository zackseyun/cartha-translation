  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur dan makna Yunani dengan baik: subjek bergelar «Anak Manusia», pengutusan para malaikat, pengumpulan keluar dari kerajaan-Nya, serta dua kelompok objek pengumpulan dipertahankan. Namun, «terus melakukan» dapat menyiratkan tindakan yang tanpa henti, sedangkan partisipel kini ποιoῦντας terutama dapat menandai praktik atau ciri perilaku; nuansa itu lebih tepat disampaikan tanpa «terus» dalam teks utama dan dijelaskan dalam catatan kaki.'
  naturalness: Bahasa Indonesia baku dan jelas. «Dari dalam kerajaan-Nya» dapat dipertahankan untuk menyatakan gerak keluar yang terkandung dalam ἐκ. Penggantian «semua orang yang terus melakukan» dengan «orang-orang yang melakukan» lebih luwes dan tidak berlebihan secara aspek.
  terminology: «Anak Manusia», «malaikat-malaikat-Nya», dan «kerajaan-Nya» tepat serta sesuai register Alkitab Indonesia. «Kedurhakaan» adalah padanan yang layak bagi ἀνομία. Untuk σκάνδαλα, «segala sesuatu yang menyebabkan orang jatuh ke dalam dosa» mempertahankan cakupan netral-jamak dan fungsi sebagai penyebab; catatan kaki sebaiknya tidak mempersempit kemungkinan maknanya menjadi khusus meninggalkan iman.
  issues:
