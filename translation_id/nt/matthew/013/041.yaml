  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: id
  text: Anak Manusia akan mengutus malaikat-malaikat-Nya, dan mereka akan mengumpulkan dari dalam kerajaan-Nya segala sesuatu yang menyebabkan orang jatuh ke dalam dosa[a] dan semua orang yang melakukan kedurhakaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “semua batu sandungan.” Kata Yunani σκάνδαλα dapat menunjuk kepada segala sesuatu yang menyebabkan orang tersandung atau jatuh ke dalam dosa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua orang yang melakukan pelanggaran hukum.” Bentuk ungkapannya dapat menekankan perbuatan yang menjadi kebiasaan atau ciri hidup mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: akan mengutus
  rationale: Bentuk futur aktif ἀποστέλλω menyatakan pengutusan dengan tugas tertentu; «akan mengutus» alami dalam bahasa Indonesia dan mempertahankan unsur pemberian mandat.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi gelar ini, sekaligus mempertahankan kaitan antarteks dengan gambaran apokaliptik dalam Daniel 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: malaikat-malaikat-Nya
  rationale: Dalam konteks penghakiman eskatologis ini, ἄγγελοι menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: συλλέξουσιν
  choice: akan mengumpulkan
  rationale: Bentuk futur ini melanjutkan gambaran panen dalam penjelasan perumpamaan dan diterjemahkan secara wajar tanpa mempersempit maknanya.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: dari dalam kerajaan-Nya
  rationale: Frasa ini mempertahankan daya ἐκ sebagai gerakan keluar dari dalam lingkup kerajaan, bukan sekadar asal yang umum.
- source_word: πάντα τὰ σκάνδαλα
  choice: segala sesuatu yang menyebabkan orang jatuh ke dalam dosa
  rationale: σκάνδαλα mencakup hal, pengaruh, atau kemungkinan juga pihak yang menjerumuskan orang. Ungkapan ini mengungkapkan fungsi aktifnya dan lebih jelas daripada metafora harfiah «batu sandungan».
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: semua orang yang terus melakukan kedurhakaan
  rationale: Partisipel kini ποιοῦντας dapat menggambarkan tindakan yang berlangsung atau menjadi ciri; «terus melakukan» menangkap nuansa tersebut. «Kedurhakaan» mempertahankan gagasan pemberontakan moral terhadap hukum atau kehendak Allah tanpa memberi kesan semata-mata pelanggaran hukum negara.
theological_decisions:
- issue: Penerjemahan gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: «Anak Manusia» mempertahankan gelar yang dikenal luas serta gema Daniel 7 tanpa menafsirkan identitasnya secara berlebihan.
- issue: Cakupan πάντα τὰ σκάνδαλα
  choice: segala sesuatu yang menyebabkan orang jatuh ke dalam dosa
  alternative: semua batu sandungan
  rationale: Bentuk netral jamak dapat mencakup berbagai penyebab penyesatan dan tidak perlu dibatasi hanya pada orang. Terjemahan utama mempertahankan keluasan itu sambil menjelaskan akibat moral yang tersirat.
- issue: Nuansa τὴν ἀνομίαν
  choice: kedurhakaan
  alternative: pelanggaran hukum
  rationale: «Kedurhakaan» menyampaikan perlawanan terhadap hukum atau kehendak Allah dan menghindari penyempitan makna menjadi pelanggaran hukum sipil saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina «-Nya» mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus. «Dari dalam» dipilih untuk memperjelas gerak keluar yang dinyatakan oleh ἐκ.
