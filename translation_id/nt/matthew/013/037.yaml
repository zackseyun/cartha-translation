base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: id
  text: Ia menjawab, “Orang yang menaburkan benih yang baik adalah Anak Manusia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sang Manusia.” Gelar Yunani “Anak Manusia” menggemakan Daniel 7 dan dipertahankan di sini karena penggunaannya yang mapan dalam Injil serta makna teologisnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Partisip dan verba finit ini bersama-sama membentuk pengantar jawaban. Bahasa Indonesia secara alami memadatkannya menjadi “Ia menjawab,” tanpa pengulangan harfiah “setelah menjawab, ia berkata.”
- source_word: Ὁ σπείρων
  choice: Orang yang menaburkan
  rationale: Partisip substantival kini menunjuk pelaku berdasarkan tindakannya. Bentuk ini mempertahankan daya generik ungkapan Yunani dan terdengar wajar dalam bahasa Indonesia.
- source_word: τὸ καλὸν σπέρμα
  choice: benih yang baik
  rationale: καλός di sini menyatakan mutu yang baik atau patut, sedangkan σπέρμα berbentuk tunggal kolektif. Frasa ini juga mempertahankan kaitannya dengan perumpamaan yang sedang dijelaskan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah gelar khas yang dipakai Yesus bagi diri-Nya dalam Injil dan bergaung dengan Daniel 7. Padanan yang sudah mapan ini mempertahankan bentuk serta bobot intertekstualnya.
theological_decisions:
- issue: Penerjemahan gelar kristologis υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan gelar Injili yang mapan dan gema apokaliptik Daniel 7, tanpa meratakannya menjadi sekadar sebutan umum bagi manusia. Alternatif dicatat karena frasa Yunani juga dapat dijelaskan secara idiomatis sebagai “Sang Manusia.”
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Ia” dipakai sebagai pronomina naratif yang alami; “menaburkan” dipilih agar sesuai dengan tindakan menyebarkan benih. Tanda catatan kaki ditempatkan langsung setelah gelar yang dijelaskannya.
