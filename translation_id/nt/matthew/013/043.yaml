id: MAT.13.43
reference: Matthew 13:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: id
  text: Pada waktu itu, orang-orang benar akan bersinar[a] seperti matahari dalam Kerajaan Bapa mereka. Siapa yang mempunyai telinga, hendaklah ia mendengar![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan memancarkan sinar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Yunani memakai bentuk tunggal: “Orang yang mempunyai telinga, hendaklah ia mendengar”—seruan kepada setiap orang agar sungguh-sungguh mengindahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu eskatologis dari penjelasan sebelumnya; lebih alami dalam bahasa Indonesia daripada terjemahan harfiah singkat "kemudian" di konteks ini.
- source_word: οἱ δίκαιοι
  choice: orang-orang benar
  rationale: Adjektiva substantival jamak yang menunjuk kepada mereka yang dipandang benar; pilihan ini baku dan mempertahankan cakupan moral serta relasional tanpa mempersempit makna.
- source_word: ἐκλάμψουσιν
  choice: akan bersinar
  rationale: Bentuk futur dari ἐκλάμπω, yakni bersinar atau memancarkan cahaya; "akan bersinar" alami, sedangkan nuansa intensif dicatat dalam catatan kaki.
- source_word: ὡς ὁ ἥλιος
  choice: seperti matahari
  rationale: ὡς memperkenalkan perbandingan; ungkapan ini alami dan mempertahankan citra sumber.
- source_word: ἐν τῇ βασιλείᾳ
  choice: dalam Kerajaan
  rationale: Frasa berpreposisi ini bersifat lokatif; "Kerajaan" mempertahankan aspek ranah sekaligus tidak meniadakan makna pemerintahan.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: Bapa mereka
  rationale: Mengikuti konstruksi genitif sumber tanpa menambahkan "surgawi", yang tidak terdapat dalam ayat ini.
- source_word: ὁ ἔχων ὦτα
  choice: Siapa yang mempunyai telinga
  rationale: Ungkapan partisipial tunggal berfungsi sebagai seruan representatif kepada setiap pendengar; bentuk Indonesia ini alami dan tidak membatasi seruan kepada laki-laki.
- source_word: ἀκουέτω
  choice: hendaklah ia mendengar
  rationale: Imperatif orang ketiga tunggal dipertahankan dengan "hendaklah"; "mendengar" juga menjaga permainan makna antara kemampuan mendengar dan sungguh-sungguh mengindahkan.
theological_decisions:
- issue: Bentuk tunggal representatif dalam seruan penutup
  choice: Siapa yang mempunyai telinga, hendaklah ia mendengar!
  alternative: Barang siapa mempunyai telinga, hendaklah dia mendengar!
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin secara representatif. Bahasa Indonesia tidak memiliki penandaan gender gramatikal yang sepadan; "siapa ... ia" mempertahankan ketunggalan dan daya seru tanpa memasukkan pembatasan gender yang tidak dimaksudkan.
- issue: Makna βασιλεία dalam konteks ini
  choice: Kerajaan
  alternative: pemerintahan
  rationale: Konstruksi "dalam Kerajaan Bapa mereka" secara alami menonjolkan ranah eskatologis tempat orang-orang benar bersinar, sambil tetap membuka dimensi pemerintahan rajawi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi "Kerajaan" dan "Bapa" dipakai sebagai sebutan khusus dalam konteks ilahi. Tanda seru menegaskan daya imperatif seruan penutup tanpa menambah isi.
