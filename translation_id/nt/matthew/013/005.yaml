base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: id
  text: Benih yang lain jatuh di tanah berbatu[a], yang hanya memiliki sedikit tanah. Benih itu segera tumbuh karena tanahnya dangkal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tempat-tempat berbatu”; ungkapan ini menunjuk pada lapisan tanah tipis di atas batuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Benih yang lain
  rationale: Bentuk jamak netral ini secara eliptis mengacu pada benih dalam ayat sebelumnya. Kata “benih” dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Menerjemahkan tindakan dalam gambaran perumpamaan secara langsung tanpa memperluasnya menjadi “ditaburkan”.
- source_word: ἐπὶ τὰ πετρώδη
  choice: di tanah berbatu
  rationale: Ungkapan ini menunjuk pada tempat berbatu, dalam konteks ini lapisan tanah tipis di atas batuan; “tanah berbatu” alami dan mudah dipahami.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: yang tanahnya tidak banyak
  rationale: Mempertahankan gagasan bahwa tempat itu hanya memiliki sedikit tanah, sekaligus menghasilkan susunan yang wajar dalam bahasa Indonesia.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: Benih itu segera tumbuh
  rationale: “Segera” mempertahankan daya temporal εὐθέως, sedangkan “tumbuh” menyampaikan munculnya kecambah secara alami dalam konteks pertanian.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: karena tanahnya tidak dalam
  rationale: Konstruksi διά dengan infinitif menyatakan sebab. Pilihan ini mempertahankan gambaran lapisan tanah yang dangkal dalam bahasa Indonesia yang alami.
