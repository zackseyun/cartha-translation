id: MAT.13.51
reference: Matthew 13:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: id
  text: “Sudahkah kalian memahami semua ini?”[a] Mereka berkata kepadanya, “Ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Apakah kalian memahami semua ini?”
    reason: Alternatif ini menyatakan keadaan pemahaman secara lebih langsung, tetapi kurang menonjolkan nuansa pemahaman yang telah dicapai sampai pada saat pertanyaan itu diajukan.
lexical_decisions:
- source_word: Συνήκατε
  choice: Sudahkah kalian memahami
  rationale: Bentuk aoristus indikatif orang kedua jamak, dalam pertanyaan, secara alami menyoroti pemahaman yang telah dicapai sampai saat itu. Kata “kalian” mempertahankan bentuk jamak yang dinyatakan dalam bahasa Yunani.
- source_word: ταῦτα πάντα
  choice: semua ini
  rationale: Ungkapan ini merujuk secara kolektif pada seluruh pengajaran dan perumpamaan yang baru disampaikan. “Semua ini” alami dalam bahasa Indonesia sekaligus mempertahankan cakupan menyeluruhnya.
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepadanya
  rationale: Bentuk kini historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang wajar. Unsur αὐτῷ tetap dipertahankan sebagai “kepadanya”, tanpa mengganti verba dengan “menjawab” atau menambahkan nama yang tidak ada dalam teks.
- source_word: Ναί
  choice: Ya
  rationale: Partikel ini merupakan jawaban afirmatif sederhana. Tidak ditambahkan sapaan seperti “Tuhan” karena sapaan tersebut tidak terdapat dalam teks sumber.
theological_decisions:
- issue: Apakah jawaban para murid perlu diperluas dengan gelar penghormatan
  choice: Mempertahankan jawaban sederhana “Ya.”
  alternative: “Ya, Tuhan.”
  rationale: Teks Yunani hanya memuat Ναί. Menambahkan gelar akan memasukkan unsur kesalehan atau penafsiran yang tidak dinyatakan oleh sumber.
- issue: Kapitalisasi kata ganti yang merujuk kepada Yesus
  choice: Menggunakan “kepadanya” tanpa kapitalisasi khusus
  alternative: “kepada-Nya”
  rationale: Bahasa Yunani tidak menandai kata ganti ini dengan kapitalisasi penghormatan. Bentuk biasa menjaga terjemahan tetap netral tanpa menyangkal identitas tokoh yang dirujuk.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan mudah dipahami. “Kalian” dipakai untuk memperjelas bahwa pertanyaan ditujukan kepada lebih dari satu orang; “Sudahkah” mempertahankan nuansa aspek aoristus tanpa membuat kalimat terasa kaku.
