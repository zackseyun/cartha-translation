  text: Maka, kalian dengarkanlah perumpamaan tentang orang yang menabur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kalian
  rationale: Kata ganti orang kedua jamak ini dinyatakan secara eksplisit dan mendapat penekanan. “Kalian” mempertahankan baik jumlah jamak maupun penekanannya dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: karena itu
  rationale: Partikel ini menghubungkan perintah tersebut dengan uraian sebelumnya sebagai kesimpulan atau kelanjutan logis. “Karena itu” mempertahankan hubungan wacananya.
- source_word: ἀκούσατε
  choice: dengarkanlah
  rationale: Bentuk imperatif aoris aktif orang kedua jamak dipertahankan sebagai perintah langsung. “Dengarkanlah” lebih alami daripada “dengarlah” untuk ajakan menyimak pengajaran dan tidak menambahkan gagasan “memahami” yang tidak dinyatakan oleh verba ini.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: “Perumpamaan” adalah padanan baku dan tepat dalam konteks pengajaran Yesus.
- source_word: τοῦ σπείραντος
  choice: tentang orang yang telah menabur
  rationale: Partisip aoris berartikel secara harfiah menunjuk kepada “orang yang telah menabur.” Preposisi “tentang” menyampaikan hubungan genitif secara alami dalam judul atau pokok suatu perumpamaan, sedangkan “telah menabur” mempertahankan aspek lampau tanpa menjadikannya gelar tetap “Sang Penabur”.
