id: MAT.13.12
reference: Matthew 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: id
  text: Sebab siapa pun yang mempunyai[a], kepadanya akan diberikan, dan ia akan berkelimpahan; namun siapa pun yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani tidak menyebutkan apa yang dipunyai; demikian pula, tidak disebutkan apa yang akan diberikan.
    reason: preservation_of_ambiguity
lexical_decisions:
- source_word: ὅστις
  choice: siapa pun yang
  rationale: Kata ganti relatif tak tentu ini menyatakan prinsip umum. “Siapa pun yang” alami dalam bahasa Indonesia modern dan mempertahankan makna distributifnya.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan tersebut dengan jelas.
- source_word: ἔχει / οὐκ ἔχει
  choice: mempunyai / tidak mempunyai
  rationale: Objek kata kerja tidak dinyatakan dalam bahasa Yunani. Terjemahan juga membiarkannya tersirat agar tidak membatasi maksudnya hanya pada pengertian, penerimaan, atau wawasan tentang Kerajaan.
- source_word: δοθήσεται αὐτῷ
  choice: kepadanya akan diberikan
  rationale: Bentuk pasif dan datif dipertahankan tanpa menambahkan objek seperti “lebih banyak”, yang hanya tersirat dari konteks dan klausa berikutnya.
- source_word: περισσευθήσεται
  choice: ia akan berkelimpahan
  rationale: Pilihan ini menyampaikan keadaan berlimpah yang dihasilkan dan tetap dekat dengan bentuk ungkapan Yunani tanpa mempersempit hal yang berlimpah itu.
- source_word: δὲ
  choice: namun
  rationale: Menandai pertentangan yang tegas antara kedua bagian pepatah.
- source_word: καὶ ὃ ἔχει
  choice: bahkan apa yang dipunyainya
  rationale: καί bersifat menanjak atau menegaskan di sini; “bahkan” menangkap sifat paradoks bahwa milik yang ada pun akan diambil.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: akan diambil darinya
  rationale: Mengungkapkan tindakan pasif berupa pengambilan atau penyingkiran dari orang tersebut secara langsung dan wajar.
- source_word: αὐτῷ / αὐτοῦ
  choice: kepadanya / darinya
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina ini. Bentuk tunggal dipertahankan tanpa mengubah konstruksi umum sumber menjadi bentuk jamak.
theological_decisions:
- issue: Objek tersirat dari “mempunyai” dan “akan diberikan”
  choice: Objek tetap tidak disebutkan dalam teks utama.
  alternative: Menambahkan “pengertian”, “wawasan tentang Kerajaan”, atau “lebih banyak”.
  rationale: Dalam konteks, perkataan ini berkaitan dengan penerimaan terhadap ajaran Yesus dan rahasia Kerajaan, tetapi teks Yunani tidak menyatakan objeknya. Membiarkannya tersirat mempertahankan keluasan dan ketegangan ungkapan asli.
- issue: Pronomina maskulin tunggal yang digunakan secara umum
  choice: 'Menggunakan pronomina tunggal Indonesia yang tidak bergender: “ia”, “kepadanya”, dan “darinya”.'
  alternative: Mengubahnya menjadi bentuk jamak atau menambahkan kata yang menandai laki-laki.
  rationale: Sumber memakai bentuk maskulin tunggal secara representatif, sedangkan pronomina Indonesia secara alami tidak membedakan gender. Bentuk tunggal mempertahankan struktur sumber tanpa memasukkan gender yang tidak dapat dinyatakan secara idiomatis dalam pronomina Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Siapa pun yang” dipilih daripada “barangsiapa” agar mudah dipahami pembaca masa kini, sedangkan “berkelimpahan” mempertahankan daya ungkap pepatah dan kedekatan dengan sumber.
