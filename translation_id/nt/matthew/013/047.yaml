  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: id
  text: Sekali lagi, Kerajaan Surga itu seperti pukat[a] yang ditebarkan ke laut dan mengumpulkan ikan dari segala jenis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jaring”; kata Yunani ini secara khusus menunjuk pada pukat besar yang dibentangkan atau ditarik di air.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengumpulkan dari setiap jenis”; kata “ikan” tersirat dalam gambaran penangkapan ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Sekali lagi
  rationale: Menandai perumpamaan lain dalam rangkaian; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ὁμοία ἐστὶν
  choice: itu seperti
  rationale: Mempertahankan rumusan perbandingan khas perumpamaan tentang kerajaan dalam bentuk Indonesia yang wajar.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Mempertahankan ungkapan khas Matius dan tidak menggantinya dengan 'Kerajaan Allah' atau menafsirkannya sebagai 'pemerintahan'.
- source_word: σαγήνῃ
  choice: pukat
  rationale: Istilah Yunani menunjuk pada jaring besar yang dibentangkan atau ditarik di air; 'pukat' lebih tepat daripada istilah umum 'jaring'.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: yang ditebarkan ke laut
  rationale: '''Ditebarkan'' merupakan ungkapan Indonesia yang alami untuk penggunaan jaring, sedangkan ''laut'' mempertahankan θάλασσα.'
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: dan mengumpulkan berbagai jenis ikan
  rationale: Secara harfiah objeknya tidak dinyatakan, tetapi ikan jelas tersirat oleh gambaran penangkapan ikan. 'Berbagai jenis' menyampaikan cakupan παντός secara alami tanpa memberi kesan bahwa seluruh ikan dari setiap jenis terkumpul.
theological_decisions:
- issue: Makna ungkapan 'Kerajaan Surga'
  choice: Mempertahankan ungkapan khas Matius 'Kerajaan Surga'.
  alternative: Kerajaan Allah; pemerintahan surga
  rationale: Terjemahan tidak menyamakan atau menguraikan ungkapan tersebut secara teologis, tetapi menjaga bentuk sumber dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pukat' dipilih demi ketepatan konkret, sedangkan catatan kaki menyediakan padanan yang lebih umum. Penambahan 'ikan' dibuat eksplisit untuk kelancaran bahasa Indonesia dan ditandai dalam catatan kaki karena objek itu hanya tersirat dalam bahasa Yunani.
