id: MAT.13.49
reference: Matthew 13:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: id
  text: 'Demikianlah yang akan terjadi pada akhir zaman[a]: para malaikat akan keluar dan memisahkan orang-orang jahat dari antara orang-orang benar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pada penyudahan zaman.” Bahasa Yunani memakai kata yang berarti “zaman” (αἰών), bukan “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: 'Menghubungkan penjelasan ini dengan perumpamaan sebelumnya dan menyatakan kesepadanan cara: seperti itulah halnya nanti.'
- source_word: ἔσται
  choice: yang akan terjadi
  rationale: Mengungkapkan pernyataan futuris secara alami dalam bahasa Indonesia tanpa menambah subjek yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: pada akhir zaman
  rationale: Dalam pemakaian eskatologis bahasa Indonesia, 'akhir zaman' secara alami menunjuk pada penyudahan masa atau tatanan sekarang, bukan kehancuran dunia fisik; catatan kaki mempertahankan nuansa 'penyudahan zaman' dari συντέλεια.
- source_word: ἐξελεύσονται
  choice: akan keluar
  rationale: Padanan langsung dan wajar bagi verba futur ἐξέρχομαι; arah geraknya tidak diperjelas melampaui teks.
- source_word: οἱ ἄγγελοι
  choice: para malaikat
  rationale: Konteks penghakiman terakhir menunjukkan bahwa ἄγγελοι merujuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: ἀφοριοῦσιν
  choice: memisahkan
  rationale: Menyampaikan tindakan memisahkan satu kelompok dari kelompok lain secara jelas dan idiomatis.
- source_word: τοὺς πονηροὺς
  choice: orang-orang jahat
  rationale: Adjektiva substantival ini menunjuk kepada sekelompok orang; bentuk eksplisit ini alami dan tidak mengaburkan rujukan personalnya.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: dari antara orang-orang benar
  rationale: Menunjukkan bahwa orang-orang jahat dipisahkan dari tengah kelompok campuran, sementara δικαίων diterjemahkan dengan istilah moral-teologis yang lazim.
theological_decisions:
- issue: Makna αἰών dalam frasa eskatologis
  choice: zaman
  alternative: dunia
  rationale: αἰών menunjuk pada suatu zaman atau tatanan, bukan secara langsung pada dunia fisik. Pilihan ini menghindari penambahan gagasan tentang pemusnahan kosmos yang tidak diwajibkan oleh teks.
- issue: Nuansa συντέλεια
  choice: akhir, dengan alternatif 'penyudahan' dalam catatan kaki
  alternative: kesudahan
  rationale: Kata ini dapat menandakan penyelesaian atau penyudahan. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan catatan kaki menjaga nuansa leksikal yang lebih penuh.
- issue: Identitas οἱ ἄγγελοι
  choice: para malaikat surgawi
  alternative: para utusan
  rationale: Dalam gambaran penghakiman eskatologis ini, konteks mendukung malaikat surgawi; pilihan tersebut bersifat kontekstual dan tidak bergantung pada kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Demikianlah yang akan terjadi' mempertahankan hubungan penjelas dengan perumpamaan, sedangkan 'orang-orang jahat' dan 'orang-orang benar' jelas bagi pembaca umum. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
