id: MAT.13.32
reference: Matthew 13:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: id
  text: Benih itu memang lebih kecil daripada semua benih lainnya, tetapi apabila sudah tumbuh, lebih besar daripada tanaman-tanaman kebun dan menjadi pohon, sehingga burung-burung di langit[a] datang dan bersarang di cabang-cabangnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “burung-burung di udara,” terjemahan tradisional untuk τὰ πετεινὰ τοῦ οὐρανοῦ.
    reason: lexical_alternative
  - marker: b
    text: Gambaran burung-burung yang bersarang di cabang-cabang mungkin menggemakan gambaran Perjanjian Lama tentang pohon besar yang melambangkan suatu kerajaan (misalnya, Yehezkiel 17:23; Daniel 4:12), tetapi ayat ini tidak menyatakan makna simbolis itu secara eksplisit.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: lebih kecil daripada semua benih lainnya
  rationale: Bentuk komparatif μικρότερον dipertahankan dengan “lebih kecil”, sedangkan “lainnya” membuat perbandingan tersebut wajar dalam bahasa Indonesia tanpa mengubah cakupannya menjadi kategori pertanian yang lebih sempit.
- source_word: μέν ... δέ
  choice: memang ... tetapi
  rationale: Pasangan ini menyatakan kontras antara awal yang kecil dan hasil pertumbuhan yang besar; “memang ... tetapi” alami dan jelas dalam bahasa Indonesia.
- source_word: ὅταν ... αὐξηθῇ
  choice: apabila sudah tumbuh
  rationale: Ungkapan ini menangkap peristiwa pertumbuhan yang dipandang telah tercapai sebelum keadaan berikutnya dinyatakan.
- source_word: μεῖζον τῶν λαχάνων
  choice: ukurannya lebih besar daripada tanaman-tanaman kebun
  rationale: “Tanaman-tanaman kebun” mempertahankan cakupan λάχανα sebagai tanaman budidaya tanpa mempersempitnya menjadi sayuran atau rempah; “ukurannya” memperjelas sifat komparatif yang tersirat dan menghasilkan bahasa Indonesia yang alami.
- source_word: γίνεται δένδρον
  choice: menjadi pohon
  rationale: Terjemahan ini mempertahankan gambaran tegas dalam teks Yunani dan tidak melunakkannya menjadi sekadar “seperti pohon”.
- source_word: ὥστε ἐλθεῖν
  choice: sehingga ... datang
  rationale: ὥστε dengan infinitif menyatakan hasil; “sehingga” menyampaikan hubungan akibat itu secara ringkas.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: “Langit” mencerminkan οὐρανός secara langsung dan tetap alami; alternatif tradisional “di udara” dicatat dalam catatan kaki.
- source_word: κατασκηνοῦν
  choice: bersarang
  rationale: Dalam konteks burung dan cabang, kata ini secara alami menyatakan tindakan menetap atau membuat tempat tinggal, yakni bersarang.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: di cabang-cabangnya
  rationale: Terjemahan lokatif langsung yang mempertahankan bentuk jamak κλάδοις dan merujuk kembali kepada pohon.
theological_decisions:
- issue: Kemungkinan kiasan tentang burung-burung yang berdiam pada pohon kerajaan yang besar
  choice: Mempertahankan gambaran itu secara harfiah tanpa menafsirkannya dalam teks utama
  alternative: Menjelaskan burung-burung sebagai lambang bangsa-bangsa atau orang-orang yang mendapat perlindungan dalam Kerajaan Allah
  rationale: Gambaran ini mungkin menggemakan Yehezkiel 17:23 dan Daniel 4:12, tetapi ayat Yunani tidak memberi penafsiran simbolis secara eksplisit. Terjemahan mempertahankan kemungkinan gema teologis tersebut tanpa menetapkan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Benih itu” dipakai agar rujukan relatif Yunani tetap jelas ketika ayat dibaca tersendiri. Pengulangan “tanaman-tanaman” dan “cabang-cabang” mempertahankan bentuk jamak sumber tanpa terasa teknis.
