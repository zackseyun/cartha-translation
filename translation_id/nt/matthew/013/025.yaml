id: MAT.13.25
reference: Matthew 13:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: id
  text: Namun, ketika orang-orang sedang tidur, musuh orang itu datang dan menaburkan lalang di antara gandum, lalu pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang
  rationale: Dalam konteks ini menunjuk kepada orang-orang yang bekerja atau berjaga di ladang; bentuk Yunani dapat mencakup manusia secara umum, sehingga 'orang-orang' lebih wajar dan tidak mempersempitnya menjadi laki-laki saja.
- source_word: αὐτοῦ ὁ ἐχθρός
  choice: musuh orang itu
  rationale: Pronomina αὐτοῦ merujuk kepada pemilik yang disebut sebelumnya. Ungkapan ini mempertahankan acuan tersebut tanpa memakai 'musuhnya', yang dalam bahasa Indonesia dapat keliru dipahami sebagai musuh milik atau musuh dari subjek terdekat.
- source_word: ἐπέσπειρεν
  choice: menaburkan
  rationale: Menggambarkan tindakan menyebarkan benih di atas atau di sela tanaman yang telah ditabur, dengan nuansa tindakan tambahan yang disengaja.
- source_word: ζιζάνια
  choice: lalang
  rationale: Merujuk pada gulma yang menyerupai gandum pada tahap awal pertumbuhan, secara tradisional dan mudah dikenali diterjemahkan 'lalang' dalam bahasa Indonesia.
- source_word: σῖτος
  choice: gandum
  rationale: Padanan langsung dan alami untuk tanaman biji-bijian yang dimaksud dalam perumpamaan.
theological_decisions:
- issue: Identitas orang-orang yang tidur
  choice: orang-orang
  alternative: para pekerja / laki-laki
  rationale: Ayat ini sendiri tidak secara eksplisit menyebut mereka pekerja, dan ἄνθρωποι tidak harus dibatasi pada laki-laki. Pilihan ini menjaga keluasan ungkapan sumber tanpa menambahkan identitas yang tidak dinyatakan.
- issue: Jenis gulma ζιζάνια
  choice: lalang
  alternative: gulma / ilalang beracun
  rationale: Teks menyebut jenis gulma tertentu yang menyerupai gandum, tetapi tidak secara eksplisit menonjolkan sifat beracunnya. 'Lalang' mempertahankan istilah perumpamaan yang dikenal tanpa menambah penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kontras pembuka, urutan tindakan musuh, dan hubungan lalang dengan gandum.
