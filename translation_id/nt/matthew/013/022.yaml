id: MAT.13.22
reference: Matthew 13:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: id
  text: Adapun yang ditaburkan di antara semak duri ialah orang yang mendengar firman itu. Namun, kekhawatiran zaman ini[a] dan tipu daya kekayaan[b] mencekik firman itu, dan ia menjadi tidak berbuah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kekhawatiran dunia ini.” Secara lebih harfiah, bahasa Yunani berbunyi “kekhawatiran zaman ini.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “penipuan oleh kekayaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: yang ditaburkan di antara semak berduri
  rationale: Bentuk partisipel maskulin tunggal menunjuk kepada orang yang digambarkan melalui benih dalam penjelasan perumpamaan. Ungkapan ini mempertahankan metafora penaburan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: orang yang mendengar firman itu
  rationale: Partisipel kini diterjemahkan secara alami sebagai klausa relatif. λόγος diterjemahkan 'firman' karena dalam konteks ini menunjuk kepada berita yang diberitakan, dengan rujukan tertentu yang ditandai oleh artikel Yunani.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: kekhawatiran zaman ini
  rationale: μέριμνα menyatakan kekhawatiran atau kesibukan batin yang membebani, sedangkan αἰών terutama berarti zaman atau masa. Bentuk tunggal kolektif dipertahankan secara alami dalam bahasa Indonesia.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: tipu daya kekayaan
  rationale: ἀπάτη menunjuk pada penipuan atau sifat memperdaya; konstruksi genitif menggambarkan kekayaan sebagai sesuatu yang menipu. 'Tipu daya kekayaan' ringkas dan idiomatis.
- source_word: συμπνίγει
  choice: mencekik
  rationale: Kata kerja ini menggambarkan tanaman berduri yang menghimpit hingga menghambat kehidupan. 'Mencekik' mempertahankan daya metafora pertanian dan akibat yang mematikan.
- source_word: ἄκαρπος γίνεται
  choice: orang itu tidak berbuah
  rationale: Secara harfiah berarti 'menjadi tidak berbuah'. Penyebutan kembali 'orang itu' memperjelas bahwa yang tidak berbuah adalah si pendengar, bukan firman, sambil mempertahankan citra buah dalam perumpamaan.
theological_decisions:
- issue: Makna αἰών
  choice: zaman ini
  alternative: dunia ini
  rationale: αἰών pada dasarnya menunjuk kepada suatu zaman atau era. 'Zaman ini' mempertahankan dimensi temporal dan moral ungkapan tersebut tanpa mengubahnya menjadi rujukan utama kepada dunia fisik.
- issue: Rujukan pribadi atau bukan pribadi pada klausa terakhir
  choice: orang itu tidak berbuah
  alternative: firman itu tidak berbuah
  rationale: Penjelasan Yesus secara eksplisit mengidentifikasi sosok tersebut sebagai orang yang mendengar firman. Terjemahan pribadi menghindari kesan bahwa firman itu sendiri gagal secara intrinsik, tanpa menghilangkan metafora berbuah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Metafora penaburan, pencekikan, dan berbuah dipertahankan; kalimat dibagi dua agar alur penjelasan jelas tanpa mengubah hubungan maknanya.
