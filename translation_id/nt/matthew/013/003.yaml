lexical_decisions:
- source_word: ἐλάλησεν
  choice: menyampaikan
  rationale: Dalam konteks pengajaran kepada orang banyak, ‘menyampaikan’ terdengar alami dan tetap menyatakan tindakan berbicara.
- source_word: πολλὰ
  choice: banyak hal
  rationale: Mempertahankan cakupan luas bentuk netral jamak Yunani tanpa menambahkan isi tertentu.
- source_word: ἐν παραβολαῖς
  choice: dalam perumpamaan
  rationale: Padanan baku dan jelas untuk cara Yesus mengajar melalui kisah perbandingan.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan yang mengarahkan perhatian pendengar, dengan ragam bahasa yang wajar dan bermartabat.
- source_word: ὁ σπείρων
  choice: seorang penabur
  rationale: Nominalisasi partisipel diterjemahkan secara idiomatis; artikel Yunani tidak harus menunjukkan orang tertentu yang telah dikenal.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: keluar untuk menabur
  rationale: Infinitif genitif menyatakan tujuan; terjemahan ini ringkas dan alami.
