  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: id
  text: Sesungguhnya Aku berkata kepada kalian, semua hal ini[a] akan menimpa generasi ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “semua ini.” Bahasa Yunani berbentuk jamak: “semua hal ini.”'
    reason: lexical_alternative
  - marker: b
    text: “Generasi ini” juga dapat dipahami oleh sebagian orang sebagai “orang-orang ini” atau sebagai generasi lebih luas yang tidak percaya, tetapi bahasa Yunani paling langsung berbunyi “generasi ini.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumus ἀμὴν λέγω ὑμῖν, kata ini merupakan penegasan khidmat yang mengawali perkataan berwibawa. “Sesungguhnya” alami dan bermartabat dalam bahasa Indonesia Alkitabiah modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung yang mempertahankan irama khidmat rumus perkataan tersebut. Bentuk tunggal “kepadamu” dapat mewakili ὑμῖν yang jamak secara idiomatis dalam sapaan kepada kelompok, meski “kepada kalian” juga mungkin.
- source_word: ἥξει
  choice: akan menimpa
  rationale: Secara harfiah berarti “akan datang,” tetapi dengan ἐπὶ dan objek berupa suatu angkatan, “akan menimpa” mengungkapkan secara alami datangnya segala konsekuensi yang baru disebutkan.
- source_word: ταῦτα πάντα
  choice: semua hal ini
  rationale: Mempertahankan bentuk jamak netral Yunani dan rujukannya kepada berbagai perkara atau hukuman dalam konteks sebelumnya.
- source_word: ἐπὶ
  choice: menimpa
  rationale: Makna gerak atau datang ke atas sasaran disatukan secara idiomatis dengan verba sebagai “menimpa,” tanpa memperkerasnya menjadi “melawan.”
- source_word: γενεὰν ταύτην
  choice: angkatan ini
  rationale: “Angkatan ini” merupakan padanan langsung yang tetap wajar untuk γενεὰν ταύτην dan mempertahankan daya temporal serta ketidakpastian mengenai cakupan rujukannya.
theological_decisions:
- issue: Rujukan γενεὰν ταύτην (“angkatan ini”)
  choice: Diterjemahkan secara langsung sebagai “angkatan ini” tanpa perluasan tafsir.
  alternative: “orang-orang ini,” suatu angkatan luas yang tidak percaya, bangsa Yahudi lintas zaman, atau zaman sekarang
  rationale: Bahasa Yunani paling langsung menyatakan “angkatan ini.” Terjemahan tidak menetapkan suatu skema eskatologis tertentu, sehingga ketegangan dan cakupan rujukannya tetap dapat dinilai dari konteks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi “Aku” mengikuti konvensi penghormatan bagi ucapan Yesus. “Semua hal ini” dipilih untuk mempertahankan bentuk jamak Yunani; tidak diperlukan catatan varian karena makna tersebut sudah dinyatakan dalam teks utama.
