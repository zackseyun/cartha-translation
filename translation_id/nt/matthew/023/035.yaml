id: MAT.23.35
reference: Matthew 23:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: id
  text: supaya seluruh darah orang benar yang ditumpahkan di bumi[a] menimpa kalian, mulai dari darah Habel yang benar sampai darah Zakharia anak Berekhya[b], yang kalian bunuh di antara Bait Suci dan mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri itu.” Kata Yunani yang dipakai dapat berarti “bumi” atau “tanah/negeri.”
    reason: lexical_alternative
  - marker: b
    text: Identitas “Zakharia anak Berekhya” diperdebatkan. Ada yang menghubungkannya dengan Nabi Zakharia, sedangkan yang lain menghubungkannya dengan Zakharia anak Yoyada (2 Tawarikh 24:20–22). Terjemahan ini mengikuti teks Yunani sebagaimana tertulis.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ἔλθῃ ἐφ’ ὑμᾶς
  choice: supaya tertanggung atas kalian
  rationale: Ungkapan ini mempertahankan hubungan tujuan/akibat serta nuansa hukum bahwa pertanggungjawaban atas darah itu menimpa mereka, sekaligus terdengar lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'datang atas kalian'.
- source_word: πᾶν αἷμα δίκαιον
  choice: seluruh darah orang benar
  rationale: δίκαιον secara gramatikal menerangkan 'darah' secara metonimis, yakni darah milik orang-orang benar. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kata 'darah' dalam bentuk kolektif.
- source_word: ἐκχυννόμενον
  choice: yang ditumpahkan
  rationale: Partisipel pasif kini menyatakan darah yang dicurahkan atau ditumpahkan. 'Yang ditumpahkan' mempertahankan gambaran ἐκχέω dan dalam konteks ini mencakup rangkaian penumpahan darah sepanjang sejarah.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: γῆ dapat berarti 'bumi' atau 'tanah/negeri'. Cakupan dari Habel dan seterusnya mendukung 'bumi', sedangkan kemungkinan arti yang lebih sempit dicatat dalam catatan kaki.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: mulai dari darah Habel yang benar
  rationale: Mempertahankan konstruksi 'darah Habel' dan julukan τοῦ δικαίου tanpa menjadikannya sekadar keterangan tentang darah.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: sampai darah Zakharia anak Berekhya
  rationale: Menerjemahkan rentang ἀπό...ἕως secara alami dan mempertahankan nama ayah sebagaimana tertulis dalam teks Yunani.
- source_word: ὃν ἐφονεύσατε
  choice: yang kalian bunuh
  rationale: φονεύω menyampaikan pembunuhan yang salah secara moral. Dalam konteks tuduhan langsung ini, 'kalian bunuh' alami dan tetap kuat tanpa memerlukan bentuk yang lebih teknis.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: di antara tempat suci dan mazbah
  rationale: ναός menunjuk bangunan suci atau tempat suci utama, bukan seluruh kompleks Bait Allah; θυσιαστήριον diterjemahkan 'mazbah', istilah baku dan bermartabat untuk altar persembahan.
theological_decisions:
- issue: Identitas Zakharia anak Berekhya
  choice: Mempertahankan nama sebagaimana tertulis dalam teks Yunani tanpa harmonisasi atau emendasi.
  alternative: Mengidentifikasikannya dengan nabi Zakharia anak Berekhya, atau dengan Zakharia anak Yoyada dalam 2 Tawarikh 24:20–22.
  rationale: Terjemahan harus mencerminkan teks Yunani dan tidak menyelesaikan kesulitan historis secara diam-diam. Perdebatan identitas dijelaskan dalam catatan kaki.
- issue: Makna datangnya darah atas para pendengar
  choice: Diterjemahkan sebagai pertanggungjawaban atas darah yang 'tertanggung atas' mereka.
  alternative: Terjemahan lebih harfiah, 'supaya datang atas kalian seluruh darah orang benar'.
  rationale: Metafora Yunani menunjukkan darah atau kesalahan darah yang datang atas mereka dalam penghakiman. Pilihan Indonesia menyampaikan nuansa forensik itu tanpa menetapkan sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk menampilkan bentuk ὑμᾶς dan ἐφονεύσατε secara jelas. 'Tempat suci' membedakan ναός dari seluruh kompleks Bait Allah, dan 'mazbah' mempertahankan register Alkitab yang lazim.
