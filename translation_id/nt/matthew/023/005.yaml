  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: id
  text: Namun, mereka melakukan semua perbuatan mereka supaya dilihat orang. Sebab, mereka melebarkan kotak-kotak ayat mereka[a] dan membesarkan jumbai-jumbai mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kotak-kotak ayat ini, yang juga dikenal sebagai tefilin, adalah wadah kulit kecil berisi petikan Kitab Suci. Sebagian orang Yahudi mengenakannya pada dahi dan lengan sebagai bentuk ketaatan pada nas seperti Ulangan 6:8.
    reason: cultural_note
  - marker: b
    text: Jumbai-jumbai ini dikenakan pada pakaian sesuai perintah dalam Bilangan 15:38–39. Dapat juga diterjemahkan “rumbai-rumbai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: semua perbuatan mereka
  rationale: Menyatakan keseluruhan tindakan mereka dengan ungkapan Indonesia yang alami; “perbuatan” lebih wajar daripada “pekerjaan” dalam konteks perilaku.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya tanpa membuat peralihan terlalu tajam.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: mereka lakukan supaya dilihat orang
  rationale: Mempertahankan tujuan tindakan yang dinyatakan oleh konstruksi Yunani, sementara “orang” mencakup manusia secara umum.
- source_word: γὰρ
  choice: Sebab
  rationale: Memperkenalkan contoh yang menjelaskan tuduhan pada kalimat sebelumnya.
- source_word: πλατύνουσι
  choice: membuat ... lebih lebar
  rationale: Mengungkapkan tindakan menjadikan sesuatu lebar dengan susunan yang alami dalam bahasa Indonesia.
- source_word: φυλακτήρια
  choice: kotak-kotak ayat
  rationale: Istilah deskriptif ini lebih mudah dipahami pembaca umum dan merujuk pada wadah kecil berisi kutipan Kitab Suci; catatan kaki memberi nama budaya dan penjelasan lebih lengkap.
- source_word: μεγαλύνουσι
  choice: membuat ... lebih besar
  rationale: Mempertahankan arti dasar menjadikan besar tanpa menentukan secara berlebihan apakah yang dimaksud khususnya lebih panjang atau lebih lebar.
- source_word: κράσπεδα
  choice: jumbai-jumbai
  rationale: Dalam konteks ini kata tersebut menunjuk pada jumbai pakaian yang dikenakan sesuai perintah Taurat, bukan sekadar pinggiran kain.
theological_decisions:
- issue: Menggambarkan perlengkapan keagamaan Yahudi tanpa menyiratkan bahwa perlengkapan itu sendiri tercela
  choice: Menggunakan “kotak-kotak ayat” dan “jumbai-jumbai,” lalu menjelaskan latar belakang Taurat dalam catatan kaki
  alternative: Menggunakan “tali sembahyang” dan “rumbai-rumbai” tanpa penjelasan
  rationale: Kritik ayat ini diarahkan pada tindakan memamerkan kesalehan agar dilihat orang, bukan pada ketaatan memakai benda-benda tersebut. Istilah konkret dan catatan budaya menjaga pembedaan itu.
- issue: Cakupan πάντα dalam tuduhan Yesus
  choice: Mempertahankan “semua perbuatan mereka”
  alternative: Melunakkan menjadi “perbuatan-perbuatan mereka”
  rationale: πάντα secara eksplisit menyatakan keseluruhan. Terjemahan mempertahankan daya retoris tuduhan itu tanpa mencoba menyelaraskannya atau membatasinya secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan dua kalimat mempertahankan hubungan penjelasan yang ditandai γὰρ. Pengulangan “mereka” mengikuti penekanan sumber, sedangkan istilah budaya dijelaskan tanpa memasukkan nada polemis terhadap praktik Yahudi itu sendiri.
