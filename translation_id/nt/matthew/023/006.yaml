translation:
  language: id
  text: Mereka menyukai tempat kehormatan dalam perjamuan[a] dan tempat duduk utama di rumah-rumah ibadat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “tempat berbaring yang utama.” Dalam perjamuan resmi pada zaman itu, para tamu makan sambil berbaring menurut urutan kehormatan; karena itu, yang ditekankan ialah hasrat akan status yang terlihat di depan umum.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau “tempat duduk yang paling terhormat.” Kata Yunaninya menekankan tempat duduk dengan status atau keutamaan tertinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοῦσι
  choice: suka mendapat
  rationale: Dalam konteks ini φιλέω menyatakan kesukaan atau kegemaran yang kuat, bukan kasih dalam arti teologis. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas bahwa yang mereka dambakan ialah memperoleh kedudukan terhormat.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel δέ bersifat penghubung ringan dan meneruskan uraian sebelumnya. Dalam bahasa Indonesia, hubungan itu sudah alami tanpa kata penghubung eksplisit; menerjemahkannya dengan “tetapi” akan memberi pertentangan yang terlalu kuat.
- source_word: πρωτοκλισίαν
  choice: tempat kehormatan
  rationale: Kata ini menunjuk tempat berbaring yang paling terhormat pada jamuan resmi. “Tempat kehormatan” menyampaikan makna kedudukan sosialnya tanpa mengharuskan pembaca memahami kebiasaan makan sambil berbaring.
- source_word: ἐν τοῖς δείπνοις
  choice: dalam perjamuan
  rationale: δεῖπνον berarti makan malam atau jamuan; dalam konteks persaingan status, “perjamuan” secara wajar menggambarkan acara makan resmi yang menampilkan urutan kehormatan.
- source_word: πρωτοκαθεδρίας
  choice: tempat duduk utama
  rationale: Kata ini menunjuk kursi yang memiliki status atau keutamaan tertinggi. “Tempat duduk utama” mempertahankan gagasan kedudukan terdepan tanpa menyempitkannya menjadi sekadar kursi paling nyaman.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: di rumah-rumah ibadat
  rationale: Frasa lokatif ini menunjuk tempat pertemuan komunitas Yahudi. “Rumah ibadat” merupakan padanan Indonesia yang jelas dan lazim untuk συναγωγή dalam konteks Perjanjian Baru.
