  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: id
  text: Jadi, orang yang bersumpah demi mezbah bersumpah demi mezbah itu dan demi segala sesuatu yang ada di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Jadi, orang yang bersumpah
  rationale: Partisip aoris berartikel berfungsi secara substantival dan generik, yaitu ‘orang yang bersumpah’ atau ‘siapa pun yang bersumpah’. ‘Jadi’ menyampaikan οὖν sebagai penghubung kesimpulan dengan argumen sebelumnya.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: demi mezbah
  rationale: Dalam rumusan sumpah, ἐν bersama ὀμνύω secara idiomatis berarti ‘demi’. ‘Mezbah’ adalah padanan Indonesia yang lazim dan bermartabat untuk θυσιαστήριον.
- source_word: ὀμνύει
  choice: bersumpah
  rationale: Bentuk kini Yunani menyatakan prinsip umum; bentuk ‘bersumpah’ secara alami mempertahankan pengulangan verba dalam bahasa Indonesia.
- source_word: ἐν αὐτῷ
  choice: demi mezbah itu
  rationale: αὐτῷ merujuk kembali kepada mezbah. Nomina diulangi agar rujukannya jelas dan alami dalam bahasa Indonesia, sedangkan ἐν kembali diterjemahkan secara idiomatis sebagai ‘demi’.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: dan demi segala sesuatu yang ada di atasnya
  rationale: Ungkapan substantival ini mencakup semua yang berada atau diletakkan di atas mezbah. Terjemahan tetap umum dan tidak mempersempitnya menjadi hanya ‘persembahan’.
theological_decisions:
- issue: Rujukan πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: segala sesuatu yang ada di atasnya
  alternative: semua persembahan di atasnya; segala sesuatu yang berada di atasnya
  rationale: Konteks membicarakan persembahan di atas mezbah, tetapi frasa Yunani lebih luas daripada satu persembahan tertentu. Terjemahan umum mempertahankan keluasan dan ketegangan teks tanpa menambahkan penafsiran khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Pengulangan ‘mezbah’ dipilih untuk menghindari kemungkinan ambiguitas pronominal, sementara ‘demi’ mempertahankan rumusan sumpah yang alami.
