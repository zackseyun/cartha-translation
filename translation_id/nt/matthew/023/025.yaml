  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: id
  text: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, orang-orang munafik! Sebab kalian membersihkan bagian luar cawan dan pinggan, tetapi bagian dalam keduanya penuh dengan keserakahan dan ketidakmampuan mengendalikan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penuh dengan rampasan atau pemerasan dan pemuasan diri.” Kata-kata Yunani yang dipakai dapat menyatakan tindakan mengambil secara eksploitatif dan penurutan keinginan yang tidak terkendali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Celakalah
  rationale: Mempertahankan daya kecaman kenabian, bukan sekadar ungkapan kesedihan.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Istilah baku dan mudah dipahami dalam bahasa Indonesia untuk para ahli kitab dan hukum agama Yahudi dalam konteks Injil.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok tersebut.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Menyampaikan kecaman terhadap kepura-puraan moral dan keagamaan secara jelas dan wajar.
- source_word: καθαρίζετε
  choice: membersihkan
  rationale: Padanan langsung dan alami bagi verba kini aktif ini.
- source_word: τὸ ἔξωθεν
  choice: bagian luar
  rationale: Mempertahankan pertentangan spasial dengan ἔσωθεν.
- source_word: ποτηρίου
  choice: cawan
  rationale: Padanan yang lazim, bermartabat, dan sesuai untuk wadah minum.
- source_word: παροψίδος
  choice: pinggan
  rationale: Istilah cukup luas bagi wadah hidangan dan tidak membatasi bentuknya menjadi piring atau mangkuk tertentu.
- source_word: ἔσωθεν
  choice: bagian dalam
  rationale: Secara langsung mempertahankan gambaran luar-dalam.
- source_word: γέμουσιν
  choice: bagian dalam keduanya penuh
  rationale: Bentuk verba Yunani bersifat jamak dan menunjuk kepada cawan serta pinggan; 'keduanya' memperjelas jumlah itu secara alami dalam bahasa Indonesia.
- source_word: ἁρπαγῆς
  choice: keserakahan
  rationale: Dalam kecaman moral metaforis ini, kata tersebut menyatakan dorongan mengambil bagi diri sendiri, sambil tetap memiliki kemungkinan nuansa rampasan atau pemerasan.
- source_word: ἀκρασίας
  choice: pemuasan diri
  rationale: Mengungkapkan penurutan keinginan diri yang tidak terkendali; nuansa harfiah 'tidak menguasai diri' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan metaforis kenajisan bagian dalam
  choice: 'Mempertahankan cawan dan pinggan sebagai subjek gambaran: ''bagian dalam keduanya penuh''.'
  alternative: Menguraikan acuannya menjadi 'tetapi di dalam diri kalian penuh dengan ...'.
  rationale: Tata bahasa Yunani mempertahankan gambaran pada kedua wadah melalui verba jamak. Terjemahan tidak secara eksplisit menggantinya dengan batin para pemimpin, meskipun sasaran kiasannya jelas.
- issue: Kekuatan makna ἁρπαγῆς dan ἀκρασίας
  choice: keserakahan dan pemuasan diri
  alternative: rampasan/pemerasan dan tidak adanya penguasaan diri
  rationale: Pilihan utama menghasilkan kecaman batin yang alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan makna yang lebih keras dan konkret.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak 'kalian' dipakai untuk mencerminkan ὑμῖν dan bentuk-bentuk jamak lainnya. Struktur luar-dalam serta metafora cawan dan pinggan dipertahankan.
