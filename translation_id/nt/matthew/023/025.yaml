  terminology: “Celakalah,” “ahli-ahli Taurat,” “orang-orang Farisi,” “orang-orang munafik,” “cawan,” dan “pinggan” semuanya sesuai dengan register Alkitab bahasa Indonesia yang modern dan bermartabat. Penggantian istilah untuk ἀκρασία meningkatkan ketepatan tanpa memaksakan penafsiran doktrinal.
