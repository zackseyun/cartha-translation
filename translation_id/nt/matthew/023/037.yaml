  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: id
  text: “Yerusalem, Yerusalem, engkau yang membunuh para nabi dan merajam orang-orang yang diutus kepadamu! Betapa seringnya Aku ingin mengumpulkan anak-anakmu, seperti induk ayam mengumpulkan anak-anaknya di bawah sayapnya,[a] tetapi kalian tidak mau!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “induk ayam” juga dapat berarti “burung” secara umum, tetapi konteks tentang mengumpulkan anak-anak di bawah sayap menunjuk secara khusus pada induk ayam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Yerusalem, Yerusalem
  rationale: Memakai bentuk nama baku dalam bahasa Indonesia serta mempertahankan pengulangan yang menegaskan seruan ratapan.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: engkau yang membunuh para nabi dan merajam
  rationale: Partisipel kini yang bersifat substantival dan mencirikan Yerusalem diungkapkan dengan klausa relatif yang alami; sapaan langsung 'engkau' mempertahankan personifikasi kota.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: orang-orang yang diutus kepadamu
  rationale: Mempertahankan bentuk pasif dan arah pengutusan kepada Yerusalem; 'kepadamu' selaras dengan sapaan langsung dalam bahasa Indonesia.
- source_word: ποσάκις ἠθέλησα
  choice: Betapa seringnya Aku ingin
  rationale: Menyampaikan ratapan dan kemauan atau keinginan tanpa memperkuatnya menjadi ketetapan teologis.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: mengumpulkan anak-anakmu
  rationale: Mempertahankan metafora relasional 'anak-anakmu' dan hubungan leksikal dengan kata kerja yang sama dalam perumpamaan berikutnya.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: seperti induk ayam mengumpulkan anak-anaknya
  rationale: ὄρνις dapat berarti burung secara umum, tetapi gambaran keibuan tentang anak-anak di bawah sayap secara kontekstual menunjuk pada induk ayam; νοσσία diterjemahkan secara alami sebagai 'anak-anaknya'.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: di bawah sayapnya
  rationale: Terjemahan langsung dan alami yang mempertahankan citra perlindungan.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: tetapi kamu tidak mau
  rationale: Konjungsi diterjemahkan adversatif sesuai pertentangan konteks. Bentuk jamak orang kedua dipertahankan melalui 'kamu', yang dapat merujuk kepada kumpulan anak-anak atau penduduk Yerusalem.
theological_decisions:
- issue: Pertentangan kehendak antara Yesus dan pihak yang disapa
  choice: Aku ingin ... tetapi kamu tidak mau
  alternative: Aku telah menetapkan ... tetapi kamu menolak; Aku rindu ... tetapi kamu tidak bersedia
  rationale: Kedua bentuk θέλω tetap diterjemahkan dengan bahasa kemauan atau keinginan, sehingga ketegangan antara keinginan Yesus dan ketidakmauan pihak yang disapa tidak diselesaikan ke arah doktrin tertentu.
- issue: Acuan 'anak-anakmu' dan peralihan dari tunggal ke jamak
  choice: Mempertahankan 'anak-anakmu' serta 'kamu' jamak tanpa mempersempit acuannya
  alternative: pendudukmu; umatmu; para pemimpinmu
  rationale: Teks mempersonifikasikan Yerusalem lalu memakai bentuk jamak ἠθελήσατε. Terjemahan mempertahankan peralihan itu dan membiarkan cakupan tepat pihak yang tidak mau tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Merajam' dipilih karena merupakan istilah Indonesia yang ringkas dan lazim untuk membunuh atau menyerang dengan lemparan batu. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan ilahi tanpa menambah unsur yang tidak ada dalam teks Yunani.
