  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: id
  text: Hai ular-ular, keturunan ular beludak! Bagaimana kalian akan luput dari penghakiman Gehenna[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penghakiman neraka.” Yunani: “Gehenna.”'
    reason: Padanan alternatif yang umum bagi istilah Yunani γέεννα.
lexical_decisions:
- source_word: ὄφεις
  choice: ular-ular
  rationale: Sapaan langsung bernada kecaman. Bentuk ulang terdengar alami dalam bahasa Indonesia dan menunjukkan bahwa yang disapa jamak.
- source_word: γεννήματα
  choice: keturunan
  rationale: Menyatakan apa yang diperanakkan atau dihasilkan, sekaligus mempertahankan hubungan langsung dengan frasa genitif berikutnya.
- source_word: ἐχιδνῶν
  choice: ular berbisa
  rationale: Mengacu pada jenis ular berbisa, khususnya viper. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada transliterasi nama jenisnya dan tetap mempertahankan intensitas gambaran.
- source_word: πῶς
  choice: bagaimana
  rationale: Memperkenalkan pertanyaan retoris mengenai kemungkinan atau prospek untuk luput tanpa mengubahnya menjadi pernyataan eksplisit tentang ketidakmampuan.
- source_word: φύγητε
  choice: akan luput
  rationale: Dalam pertanyaan retoris ini, kata kerja menyatakan lolos dari akibat penghakiman. 'Akan luput' alami dalam bahasa Indonesia dan mempertahankan orientasi prospektifnya.
- source_word: κρίσεως
  choice: hukuman
  rationale: Dalam konstruksi ini, kata tersebut menunjuk pada putusan atau akibat penghakiman. 'Hukuman' lebih alami daripada 'penghakiman Gehenna' dalam bahasa Indonesia, tetapi tidak menambahkan rincian tentang bentuk hukumannya.
- source_word: γεέννης
  choice: Gehenna
  rationale: Mempertahankan istilah Yunani yang memiliki latar Yahudi dan nuansa eskatologis khusus, alih-alih langsung meratakannya menjadi 'neraka'.
theological_decisions:
- issue: Penerjemahan γέεννα
  choice: Gehenna
  alternative: neraka
  rationale: Transliterasi mempertahankan kekhususan istilah sumber dan latar historis Yahudinya. Padanan umum 'neraka' dicantumkan dalam catatan kaki agar teks tetap dapat dipahami tanpa memasukkan seluruh asosiasi teologis yang mungkin melekat pada istilah tersebut.
- issue: Daya retoris πῶς φύγητε
  choice: Bagaimana kalian akan luput
  alternative: Bagaimana mungkin kalian dapat luput
  rationale: Pilihan utama mempertahankan bentuk pertanyaan dan orientasi ke depan tanpa secara eksplisit menambahkan gagasan ketidakmungkinan yang hanya tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan khidmat. Sapaan 'Hai' menjaga daya kecaman vokatif, sedangkan 'kalian' menandai bentuk jamak secara wajar. Istilah 'Gehenna' dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
