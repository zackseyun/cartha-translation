  source_fidelity: Revisi diperlukan untuk dua istilah utama. κρίσεως berarti “penghakiman/judgment,” bukan terutama “hukuman”; “hukuman” menggeser fokus dari tindakan/putusan pengadilan kepada pidana yang dijatuhkan. Selain itu, ἐχιδνῶν secara khusus merujuk pada beludak (viper), sehingga “ular berbisa” terlalu umum.
  naturalness: Teks yang direvisi tetap modern dan lugas. “Hai ular-ular” serta “Bagaimana kalian akan luput” wajar untuk kecaman langsung berbentuk jamak. “Penghakiman Gehenna” memang bernada formal, tetapi tepat dan dapat dipahami dalam register Alkitabiah modern.
  terminology: “Ular beludak” mempertahankan kekhususan ἐχίδνα. “Gehenna” sebaiknya tetap ditransliterasi, dengan “neraka” sebagai alternatif dalam catatan kaki. Penanda catatan kaki dipindahkan agar melekat langsung pada “Gehenna,” istilah yang dijelaskan.
