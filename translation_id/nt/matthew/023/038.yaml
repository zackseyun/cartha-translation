  text: Look[a], your house is left to you desolate.
translation:
  language: id
  text: Lihatlah, rumah kalian[a] ditinggalkan bagi kalian dalam keadaan terlantar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bait Allah kalian.” Ungkapan “rumah kalian” mungkin secara khusus menunjuk kepada Bait Allah, tetapi bahasa Yunani membiarkan acuannya lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian kepada pengumuman yang khidmat. “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya retorisnya.
- source_word: ἀφίεται
  choice: akan ditinggalkan
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku. Dalam konteks nubuat penghakiman, bentuk kini Yunani dapat menyatakan peristiwa yang segera atau pasti terjadi; bahasa Indonesia lebih alami mengungkapkannya dengan “akan ditinggalkan”.
- source_word: ὑμῖν
  choice: bagimu
  rationale: Dativus dipertahankan untuk mencerminkan bahwa rumah itu dibiarkan atau diserahkan kepada pihak yang disapa, tanpa mempersempit nuansanya menjadi sekadar kepemilikan.
- source_word: ὁ οἶκος ὑμῶν
  choice: rumahmu
  rationale: Terjemahan harfiah ini mempertahankan keluasan ungkapan Yunani. Konteks dapat menunjuk kepada Bait Allah, Yerusalem, atau tatanan umat, tetapi teks tidak menyebut salah satunya secara eksplisit.
- source_word: ἔρημος
  choice: dalam keadaan sunyi
  rationale: Ungkapan ini menyampaikan keadaan terlantar, kosong, atau tandus akibat ditinggalkan. Formulasi tersebut terdengar wajar dalam bahasa Indonesia dan tidak memastikan tingkat kehancuran fisik yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Acuan “rumahmu”
  choice: Tetap diterjemahkan “rumahmu” dalam teks utama.
  alternative: “Bait Allahmu”, “Yerusalem”, atau “kaum Israel”
  rationale: Konteks mengarahkan pembaca terutama kepada Yerusalem dan Bait Allah, tetapi οἶκος lebih luas. Mempertahankan “rumah” menjaga metafora serta ketegangan penafsirannya.
- issue: Waktu dan sifat tindakan ἀφίεται
  choice: “akan ditinggalkan”
  alternative: “ditinggalkan” atau “sedang ditinggalkan”
  rationale: Bentuk kini pasif Yunani dapat menggambarkan penghakiman sebagai sesuatu yang sedang dinyatakan dan pasti terjadi. Bentuk futur dalam bahasa Indonesia menyampaikan implikasi kontekstual itu secara alami tanpa menentukan pelakunya.
translation_notes:
  register: Bahasa modern, khidmat, dan mudah dipahami. “Lihatlah” mempertahankan nada pengumuman kenabian; susunan kalimat tetap dekat dengan struktur Yunani tanpa menjadi kaku.
