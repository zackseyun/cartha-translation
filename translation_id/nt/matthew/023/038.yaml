  source_fidelity: Revisi diperlukan karena ἀφίεται adalah bentuk kini pasif, sedangkan “akan ditinggalkan” memajukan maknanya menjadi futur dalam teks utama. “Ditinggalkan” mempertahankan aspek dan bentuk pasif tanpa menentukan pelaku. Predikat ἔρημος lebih baik diterjemahkan “terlantar” daripada “dalam keadaan sunyi,” yang terutama menyatakan kesenyapan dan terlalu melemahkan nuansa keterlantaran/kegersangan.
  naturalness: “Lihatlah, rumah kalian ditinggalkan bagi kalian dalam keadaan terlantar” merupakan bahasa Indonesia modern yang khidmat dan jelas. Pengulangan “kalian” sedikit mencerminkan dua unsur orang kedua jamak dalam bahasa Yunani (ὑμῶν dan ὑμῖν) dan tetap dapat diterima dalam pengumuman bernada kenabian.
  terminology: “Rumah” dipertahankan untuk οἶκος dan tidak dipersempit menjadi Bait Allah atau Yerusalem. “Terlantar” menyampaikan ἔρημος dalam konteks penghukuman tanpa menambahkan rincian kehancuran fisik. Catatan kaki hanya menjelaskan acuan yang mungkin dari “rumah,” sesuai dengan ambiguitas teks.
