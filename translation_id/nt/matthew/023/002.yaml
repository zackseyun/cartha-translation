review_pass:
  verdict: revise
  source_fidelity: ἐκάθισαν is an aorist active form of καθίζω and, in this setting, most directly states that the scribes and Pharisees sat/have sat in Moses' seat. The draft's “telah menduduki” can suggest taking possession or occupying a position in a potentially hostile sense more strongly than the Greek itself requires. A neutral Indonesian rendering better preserves the source's ambiguity while the note can retain the occupancy/authority nuance.
  naturalness: “Para ahli Taurat dan orang-orang Farisi duduk di kursi Musa” is clear, idiomatic modern Indonesian, and retains the established metaphor. “Kata-Nya” naturally carries the participial connection in Indonesian narrative.
  terminology: “Ahli Taurat,” “orang-orang Farisi,” and “kursi Musa” are appropriate, recognizable Indonesian biblical terms. The divine pronoun suffix in “kata-Nya” is fitting for the immediate context.
  issues:
  - severity: medium
    issue: “telah menduduki” over-specifies the force of ἐκάθισαν.
    rationale: Although it can refer to occupying a position, “menduduki” readily implies assuming or taking possession of an office. The Greek verb can bear a completed/occupancy nuance, but it does not explicitly state that they took the seat for themselves. A neutral main text with a footnote preserves the disputed nuance.
  revised_text: kata-Nya, “Para ahli Taurat dan orang-orang Farisi duduk di kursi Musa.[a]”
  revised_footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah duduk di kursi Musa” atau “telah menduduki kursi Musa.” Kata kerja Yunani dapat dipahami secara lebih netral; terjemahan “telah menduduki” dapat menyiratkan nuansa menempati kedudukan yang berwenang.
    reason: alternative_reading
  revision_rationale: The revision makes the main text reflect the neutral, ordinary sense of the Greek verb while preserving in the footnote the possible nuance of occupying an authoritative teaching position. It does not decide whether that position was self-assumed or legitimately recognized.
