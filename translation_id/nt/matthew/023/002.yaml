  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: id
  text: kata-Nya, “Para ahli Taurat dan orang-orang Farisi duduk di kursi Musa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah duduk di kursi Musa” atau “telah menduduki kursi Musa.” Kata kerja Yunani dapat dipahami secara lebih netral; terjemahan “telah menduduki” dapat menyiratkan nuansa menempati kedudukan yang berwenang.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel kini ini memperkenalkan ucapan Yesus dan menghubungkannya dengan ayat sebelumnya. Dalam bahasa Indonesia, “kata-Nya” merupakan penghubung naratif yang alami tanpa mengubah siapa pembicaranya.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: kursi Musa
  rationale: Ungkapan ini menunjuk pada kedudukan mengajar yang berwenang dan tetap mempertahankan metafora konkret dalam teks Yunani.
- source_word: ἐκάθισαν
  choice: telah menduduki
  rationale: Aoris καθίζω dapat menggambarkan tindakan duduk atau menempati suatu kedudukan. “Telah menduduki” mempertahankan aspek tindakan lampau beserta keadaan yang dihasilkannya, tanpa secara eksplisit menambahkan unsur refleksif ‘menempatkan diri’ yang tidak dinyatakan dalam bahasa Yunani.
- source_word: οἱ γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk pada golongan ahli kitab yang terutama dikenal sebagai pakar dan pengajar Taurat; “para ahli Taurat” jelas dan lazim bagi pembaca Indonesia modern.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Nama kelompok ini ditransliterasikan secara baku dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἐκάθισαν hanya menyatakan bahwa mereka duduk atau menyiratkan bahwa mereka mengambil kedudukan berwenang
  choice: telah menduduki
  alternative: duduk di; telah duduk di; telah menempatkan diri di
  rationale: Pilihan ini mempertahankan gambaran tentang penempatan pada kedudukan pengajaran yang terkait dengan Musa, tetapi tidak memastikan apakah kedudukan itu diambil atas prakarsa sendiri atau diakui secara sah. Catatan kaki mempertahankan kemungkinan pembacaan yang lebih netral maupun lebih bernuansa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kursi Musa” dipertahankan sebagai metafora otoritas mengajar; “telah menduduki” alami dalam bahasa Indonesia sekaligus menjaga ambiguitas kata kerja Yunani.
