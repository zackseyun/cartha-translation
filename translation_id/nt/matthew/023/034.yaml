review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok terjaga: pengutusan para nabi, orang bijaksana, dan ahli Taurat; pembunuhan serta penyaliban; lalu pencambukan dan pengejaran. Namun, “rumah-rumah ibadat” terlalu umum untuk συναγωγαῖς, yang secara khusus berarti sinagoge. “Kalian aniaya dari kota ke kota” juga kurang tepat dan kurang idiomatis untuk διώξετε ἀπὸ πόλεως εἰς πόλιν, yang menyatakan pengejaran/persekusi dari satu kota ke kota lain.'
  naturalness: Struktur kalimat dan pemakaian “kalian” jelas serta modern. “Lihatlah” mempertahankan daya tarik perhatian dari ἰδοὺ, walaupun bernuansa tinggi, dan sesuai register ujaran kenabian. Perbaikan pada verba terakhir membuat kalimat lebih alami dalam bahasa Indonesia.
  terminology: “Ahli-ahli Taurat” merupakan padanan yang dapat diterima untuk γραμματεῖς dalam konteks Matius. “Sinagoge-sinagoge” perlu dipakai demi ketepatan istilah historis dan religius; istilah generik “rumah-rumah ibadat” tidak cukup spesifik.
  issues:
  - severity: medium
    issue: συναγωγαῖς diterjemahkan “rumah-rumah ibadat”.
    rationale: Padanan ini menggeneralisasi istilah yang dalam sumber secara spesifik menunjuk sinagoge. “Sinagoge-sinagoge kalian” mempertahankan rujukan historis tanpa menambahkan tafsiran.
  - severity: medium
    issue: διώξετε ἀπὸ πόλεως εἰς πόλιν diterjemahkan “kalian aniaya dari kota ke kota”.
    rationale: “Aniaya” tidak secara jelas menyampaikan gerak pengejaran, dan frasa itu tidak idiomatis. “Kalian kejar dari kota ke kota” lebih langsung mencerminkan διώκω dan konstruksi arah Yunani.
  revised_text: Karena itu, lihatlah, Aku mengutus kepada kalian nabi-nabi, orang-orang bijaksana, dan ahli-ahli Taurat. Sebagian dari mereka akan kalian bunuh dan salibkan; sebagian lagi akan kalian cambuk di sinagoge-sinagoge kalian dan kalian kejar dari kota ke kota.
