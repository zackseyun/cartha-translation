revisions:
- from: Karena itu, lihatlah, Aku mengutus kepada kalian nabi-nabi, orang-orang bijaksana, dan ahli-ahli Taurat. Sebagian dari mereka akan kalian bunuh dan salibkan; sebagian lagi akan kalian cambuk di rumah-rumah ibadat kalian dan kalian aniaya dari kota ke kota.
  to: Karena itu, lihatlah, Aku mengutus kepada kalian nabi-nabi, orang-orang bijaksana, dan ahli-ahli Taurat. Sebagian dari mereka akan kalian bunuh dan salibkan; sebagian lagi akan kalian cambuk di sinagoge-sinagoge kalian dan kalian kejar dari kota ke kota.
  rationale: 'Revisi terbatas pada dua istilah yang memerlukan ketepatan lebih besar: συναγωγαῖς menjadi “sinagoge-sinagoge,” dan διώξετε menjadi “kalian kejar.” Bentuk kini ἀποστέλλω, penanda ἰδοὺ, bentuk jamak, serta pembagian partitif ἐξ αὐτῶν tetap dipertahankan tanpa penafsiran teologis tambahan.'
