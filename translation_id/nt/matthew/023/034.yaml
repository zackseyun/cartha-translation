  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: id
  text: Karena itu, lihatlah, Aku mengutus kepada kalian nabi-nabi, orang-orang bijaksana, dan ahli-ahli Taurat. Sebagian dari mereka akan kalian bunuh dan salibkan; sebagian lagi akan kalian cambuk di sinagoge-sinagoge kalian dan kalian kejar dari kota ke kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menyatakan hubungan kesimpulan atau akibat dengan konteks sebelumnya secara alami dan langsung.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang tegas dalam ujaran Yesus tanpa memakai bentuk arkais.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Yahudi Matius, istilah ini menunjuk para pakar dan pengajar Taurat, bukan sekadar juru tulis.
- source_word: μαστιγώσετε
  choice: akan kalian cambuk
  rationale: Mengungkapkan tindakan penghukuman fisik secara konkret sesuai makna verba Yunani.
- source_word: διώξετε
  choice: kalian aniaya
  rationale: Menyampaikan pengejaran bermusuhan dan penindasan yang berlangsung dari satu kota ke kota lain.
theological_decisions:
- issue: Identitas pembicara sebagai pengutus para nabi, orang bijaksana, dan ahli Taurat
  choice: Aku mengutus
  alternative: Aku akan mengutus
  rationale: Bentuk kini ἀποστέλλω dipertahankan sebagai 'mengutus', sehingga klaim langsung Yesus tidak dilemahkan atau ditafsirkan ulang; konteks dapat memberi nuansa tindakan yang segera atau prospektif.
- issue: Pembagian nasib para utusan
  choice: Sebagian dari mereka ...; sebagian lagi ...
  alternative: Dari antara mereka ... dan dari antara mereka ...
  rationale: Menyampaikan konstruksi partitif ἐξ αὐτῶν secara alami tanpa menyiratkan bahwa kedua kelompok pasti tidak bertumpang tindih secara mutlak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak ὑμᾶς dinyatakan dengan 'kalian' agar jumlahnya jelas. 'Rumah-rumah ibadat' dipilih sebagai padanan yang mudah dipahami untuk συναγωγαῖς, dengan bentuk jamak dipertahankan.
