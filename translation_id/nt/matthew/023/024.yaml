  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: id
  text: Hai para penuntun buta! Kalian menyaring nyamuk, tetapi menelan unta!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: para penuntun buta
  rationale: Mempertahankan metafora langsung tentang orang yang menuntun orang lain tetapi sendiri tidak mampu melihat; bentuk sapaan dan teguran keras tetap terasa.
- source_word: διϋλίζοντες
  choice: menyaring
  rationale: Kata kerja ini menunjuk pada penyaringan cairan untuk menyingkirkan benda atau kotoran; 'menyaring' alami dalam bahasa Indonesia dan sesuai dengan gambaran tindakan tersebut.
- source_word: τὸν κώνωπα
  choice: nyamuk
  rationale: κώνωψ menunjuk pada serangga kecil sejenis agas atau nyamuk. 'Nyamuk' mudah dipahami pembaca Indonesia dan mempertahankan kontras ukuran dengan unta.
- source_word: τὴν δὲ κάμηλον
  choice: tetapi ... unta
  rationale: δέ menandai kontras tajam antara menyingkirkan hewan yang sangat kecil dan menelan hewan yang sangat besar.
- source_word: καταπίνοντες
  choice: menelan
  rationale: Padanan langsung dan hidup yang mempertahankan hiperbola sumber tanpa menambahkan nuansa yang tidak dinyatakan.
theological_decisions:
- issue: Daya metaforis gambaran kenajisan dan ketimpangan moral
  choice: Mempertahankan gambaran konkret menyaring nyamuk dan menelan unta.
  alternative: Menguraikannya sebagai memperhatikan kesalahan kecil tetapi mengabaikan kesalahan besar.
  rationale: Teks Yunani menyampaikan teguran melalui hiperbola konkret. Mempertahankannya menjaga kaitan dengan hewan yang dianggap najis dan tidak membatasi penerapannya melalui parafrasa penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan berwibawa. 'Hai' menandai sapaan langsung yang keras, sedangkan 'kalian' membuat konstruksi partisipial Yunani menjadi kalimat Indonesia yang alami. Tidak diperlukan catatan kaki karena 'menyaring nyamuk' menyampaikan tindakan Yunani dengan cukup jelas.
