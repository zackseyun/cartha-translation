  source_fidelity: Terjemahan mempertahankan sapaan vokatif tunggal yang tajam (Φαρισαῖε τυφλέ), imperatif aoris dan prioritasnya (καθάρισον πρῶτον), serta gambaran konkret tentang bagian dalam cawan dan pinggan. Klausa tujuan/hasil “supaya ... juga menjadi bersih” dengan tepat menyampaikan ἵνα γένηται ... καθαρόν. Posesif tunggal dalam “bagian luarnya” secara wajar mencerminkan αὐτοῦ tanpa memaksakan penjelasan atas gabungan cawan dan pinggan.
