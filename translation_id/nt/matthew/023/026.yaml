  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: id
  text: Hai orang Farisi yang buta, bersihkanlah dahulu bagian dalam cawan dan pinggan[a] itu, supaya bagian luarnya juga menjadi bersih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring”, “mangkuk”, atau “talam”; kata Yunani παροψίς menunjuk wadah untuk menyajikan makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Hai orang Farisi yang buta
  rationale: Keduanya berbentuk vokatif tunggal dan merupakan sapaan langsung. Ungkapan ini mempertahankan sebutan kelompok serta metafora kebutaan rohani dengan nada teguran yang kuat dan wajar dalam bahasa Indonesia.
- source_word: καθάρισον πρῶτον
  choice: bersihkanlah dahulu
  rationale: Bentuk imperatif aoris menuntut tindakan tegas, sedangkan πρῶτον menyatakan prioritas. 'Bersihkanlah dahulu' alami untuk gambaran perkakas makan dan tetap memungkinkan makna moral.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: bagian dalam cawan
  rationale: τὸ ἐντός menunjuk bagian interior. 'Cawan' merupakan padanan yang lazim dan bermartabat bagi ποτήριον dalam konteks Injil.
- source_word: καὶ τῆς παροψίδος
  choice: dan pinggan
  rationale: παροψίς adalah wadah penyaji makanan yang dapat berupa pinggan, piring, mangkuk, atau talam. 'Pinggan' cukup luas dan berpasangan secara alami dengan 'cawan'; alternatif bentuk wadah dicatat dalam catatan kaki.
- source_word: ἵνα γένηται
  choice: supaya ... menjadi
  rationale: Mempertahankan nuansa hasil dan perubahan dari γίνομαι, bukan sekadar keadaan statis.
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: bagian luarnya juga menjadi bersih
  rationale: καί bersifat adverbial ('juga'), τὸ ἐκτός sejajar dengan bagian dalam, dan αὐτοῦ dinyatakan secara alami melalui akhiran posesif '-nya'. Bentuk tunggal Yunani dipertahankan tanpa memaksakan rujukan jamak.
theological_decisions:
- issue: Gambaran konkret perkakas makan atau penafsiran moral yang dibuat eksplisit
  choice: Mempertahankan gambaran membersihkan bagian dalam dan luar cawan serta pinggan tanpa menjelaskan metaforanya dalam teks utama.
  alternative: Parafrasa seperti 'bersihkan dahulu batinmu, supaya kehidupan lahiriahmu juga bersih'.
  rationale: Bahasa Yunani menyampaikan teguran moral melalui gambaran konkret. Menyebutkan langsung batin dan perilaku lahiriah akan menyelesaikan metafora secara interpretatif dan mengurangi daya retorisnya.
- issue: Rujukan αὐτοῦ yang berbentuk tunggal setelah dua benda
  choice: Menerjemahkan dengan '-nya' pada 'bagian luarnya' dan mempertahankan ketegangan gramatikal sumber.
  alternative: Mengubahnya menjadi 'bagian luar keduanya' atau 'bagian luar masing-masing'.
  rationale: Teks Yunani memakai pronomina genitif tunggal, yang dapat memperlakukan gambaran cawan/pinggan sebagai satu kesatuan. Terjemahan tidak perlu menyelaraskannya secara eksplisit menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang langsung dan bermartabat. 'Hai' menandai sapaan vokatif; 'bersihkanlah dahulu' terdengar alami sekaligus mempertahankan kekuatan imperatif. Catatan kaki ditempatkan tepat setelah 'pinggan'.
