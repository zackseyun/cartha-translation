  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: id
  text: dan menerima salam penghormatan di pasar-pasar, serta dipanggil oleh orang-orang, “Rabi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: salam penghormatan
  rationale: Dalam konteks ini bukan sekadar sapaan biasa, melainkan salam penuh hormat yang disenangi para ahli Taurat dan orang Farisi; frasa ini menyampaikan nuansa sosial tersebut secara wajar.
- source_word: ἀγοραῖς
  choice: pasar-pasar
  rationale: ἀγορά menunjuk ruang pasar yang juga menjadi pusat kehidupan umum; 'pasar-pasar' mempertahankan gambaran konkret teks.
- source_word: καλεῖσθαι
  choice: dipanggil
  rationale: Bentuk pasif infinitif diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: orang
  rationale: Dalam konteks ini ἄνθρωποι bersifat umum, yaitu orang-orang lain, bukan khusus laki-laki; bentuk idiomatis 'dipanggil orang' ringkas dan alami.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Gelar Semitis ini dipertahankan dalam bentuk serapan Indonesia yang lazim dan mencerminkan sebutan kehormatan dalam teks.
theological_decisions:
- issue: Cakupan ἀνθρώπων
  choice: orang
  alternative: laki-laki/manusia
  rationale: Kata Yunani ini di sini menunjuk orang secara umum. 'Orang' menghindari pembatasan gender yang tidak dituntut sumber tanpa mengubah makna teologis.
translation_notes:
  register: Bahasa modern, ringkas, dan bermartabat. Kata 'menerima' ditambahkan secara idiomatis agar objek 'salam penghormatan' selaras dengan rangkaian hal-hal yang mereka sukai dari konteks ayat sebelumnya; kalimat tetap berupa lanjutan sintaksis dari Matius 23:6.
