id: MAT.23.29
reference: Matthew 23:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: id
  text: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, orang-orang munafik, sebab kalian membangun makam para nabi dan menghiasi monumen peringatan[a] orang-orang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makam.” Kata Yunani ini dapat menunjuk pada monumen atau makam peringatan; di sini diterjemahkan “monumen peringatan” untuk membedakannya dari “makam” sebelumnya dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Celakalah
  rationale: Ungkapan kecaman profetis yang kuat dan wajar dalam bahasa Indonesia Alkitabiah modern; mempertahankan nuansa penghakiman, bukan sekadar ratapan.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Sebutan Indonesia yang lazim dan mudah dipahami bagi para pakar kitab suci dan hukum Yahudi; lebih komunikatif daripada transliterasi harfiah 'juru tulis'.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Nama kelompok ditransliterasikan dalam bentuk yang sudah mapan dalam bahasa Indonesia.
- source_word: ὑποκριταί
  choice: hai orang-orang munafik
  rationale: Vokatif ditegaskan dengan 'hai'; 'orang-orang munafik' menyampaikan kepura-puraan moral-keagamaan dalam konteks ini.
- source_word: ὅτι
  choice: sebab
  rationale: Memperlihatkan hubungan kausal antara kecaman dan tindakan yang disebut berikutnya, dengan alur kalimat yang wajar.
- source_word: οἰκοδομεῖτε
  choice: kalian membangun
  rationale: Menerjemahkan kala kini tanpa menambahkan gagasan 'membangun kembali', yang tidak diwajibkan oleh verba Yunani.
- source_word: τάφους
  choice: makam
  rationale: Cocok untuk tempat pemakaman yang dibangun dan membedakannya secara terbatas dari μνημεῖα berikutnya.
- source_word: προφητῶν
  choice: para nabi
  rationale: Bentuk genitif diterjemahkan secara alami sebagai hubungan kepunyaan atau peruntukan.
- source_word: κοσμεῖτε
  choice: menghiasi
  rationale: Padanan modern dan langsung untuk tindakan memperindah atau memberi ornamen.
- source_word: μνημεῖα
  choice: tugu makam
  rationale: Istilah Yunani dapat berarti makam atau monumen peringatan; 'tugu makam' mempertahankan kaitan pemakaman sekaligus membedakannya dari τάφους.
- source_word: δικαίων
  choice: orang-orang benar
  rationale: Adjektiva substantival dinyatakan secara alami dan inklusif sebagai orang yang dipandang benar atau saleh.
theological_decisions:
- issue: Makna substantival δικαίων
  choice: orang-orang benar
  alternative: orang-orang yang saleh
  rationale: Pilihan ini mempertahankan kategori moral-teologis 'benar' tanpa membatasi makna pada kesalehan ritual atau memasukkan kerangka doktrinal tertentu.
translation_notes:
  register: Bahasa modern, tegas, dan bermartabat. Sapaan jamak diterjemahkan dengan 'kalian' agar pembedaan orang kedua jamak jelas; pengulangan 'orang-orang' menjaga kejelasan kelompok yang disapa. Tanda baca menghubungkan kecaman dengan alasannya dalam satu kalimat.
