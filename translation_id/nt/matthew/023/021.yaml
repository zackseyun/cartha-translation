  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: id
  text: Dan siapa pun yang bersumpah demi Bait Allah, ia bersumpah demi Bait Allah itu dan demi Dia yang tinggal di dalamnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam Bait Allah ... di dalamnya”; preposisi Yunaninya secara harfiah berarti “di dalam”, tetapi dalam rumusan sumpah ini bermakna “demi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: siapa pun yang bersumpah
  rationale: Partisipel aoris berartikel ini berfungsi sebagai nomina dan merujuk secara umum kepada setiap orang yang bersumpah. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan sifat generiknya.
- source_word: ἐν τῷ ναῷ
  choice: demi Bait Allah
  rationale: Walaupun ἐν secara harfiah biasanya berarti 'di dalam', dalam rumusan sumpah pada konteks ini preposisi tersebut menyatakan sesuatu yang dijadikan dasar atau saksi sumpah, sehingga 'demi' merupakan padanan idiomatis.
- source_word: ναῷ
  choice: Bait Allah
  rationale: ναός menunjuk pada bait atau tempat suci, khususnya Bait Allah di Yerusalem. 'Bait Allah' jelas, lazim dalam konteks Alkitab, dan membedakannya dari kuil pada umumnya.
- source_word: ὀμνύει
  choice: ia bersumpah
  rationale: Bentuk kini indikatif menyatakan prinsip umum sebagai konsekuensi dari tindakan bersumpah. Pronomina 'ia' membuat klausa Indonesia jelas tanpa membatasi jenis kelamin.
- source_word: ἐν αὐτῷ
  choice: demi Bait Allah itu
  rationale: Preposisi ἐν kembali dipahami dalam rumusan sumpah sebagai 'demi'. Pengulangan nomina menggantikan 'demi itu', yang kurang alami dan berpotensi kabur dalam bahasa Indonesia.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Dia yang tinggal di dalamnya
  rationale: Partisipel kini substantival menunjuk kepada Allah sebagai Dia yang berdiam di Bait Allah. 'Tinggal di dalamnya' mempertahankan gambaran tempat kediaman dan aspek partisipelnya.
- source_word: αὐτόν
  choice: di dalamnya
  rationale: Pronomina ini merujuk kepada ναός, yakni Bait Allah. Bentuk enklitik '-nya' merupakan rujukan alami kepada tempat tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas Dia yang tinggal di dalam Bait Allah
  choice: '''Dia'' dengan huruf kapital, merujuk kepada Allah'
  alternative: '''dia yang tinggal di dalamnya'' tanpa kapitalisasi'
  rationale: Dalam konteksnya, Yesus menyatakan bahwa bersumpah demi Bait Allah juga melibatkan Allah yang berdiam di sana. Kapitalisasi menandai rujukan yang jelas itu tanpa menambahkan nama atau rumusan doktrinal.
- issue: Makna ἐν dalam rumusan sumpah
  choice: diterjemahkan 'demi' dalam teks utama
  alternative: diterjemahkan secara harfiah 'di dalam'
  rationale: Konteks paralel rumusan sumpah menuntut makna instrumental atau invokatif, tetapi arti harfiahnya tetap dicatat dalam catatan kaki agar ambiguitas bentuk Yunani tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Bait Allah' dipakai sebagai istilah umum yang mudah dipahami untuk ναός dalam konteks Yerusalem; struktur pengulangan dipertahankan untuk mencerminkan penegasan teks Yunani.
