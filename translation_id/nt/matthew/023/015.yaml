revisions:
- from: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menjelajahi laut dan darat untuk membuat seorang menjadi proselit[a]. Sesudah ia menjadi proselit, kalian menjadikannya anak Gehena[b], dua kali lipat dibandingkan kalian sendiri.
  to: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menjelajahi laut dan darat untuk menjadikan satu orang proselit[a]. Ketika ia menjadi proselit, kalian menjadikannya anak Gehena[b], dua kali lebih pantas masuk Gehena daripada kalian sendiri.
  rationale: Revisi mengganti “sesudah” dengan “ketika” untuk mencerminkan ὅταν secara lebih tepat, melancarkan ungkapan tentang menjadikan satu orang proselit, dan menjelaskan daya banding διπλότερον ὑμῶν. “Dua kali lebih pantas masuk Gehena” menyampaikan fungsi idiomatis “anak Gehena” sebagai orang yang berada di bawah hukuman Gehena, sambil mempertahankan “anak Gehena” dalam teks utama dan alternatif “anak neraka” di catatan kaki.
