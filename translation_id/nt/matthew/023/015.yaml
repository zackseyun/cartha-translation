  verdict: revise
  source_fidelity: Perlu revisi kecil. Kata penghubung ὅταν berarti “ketika/apabila,” bukan secara spesifik “sesudah”; bentuk “sesudah” mempersempit hubungan waktu yang dinyatakan sumber. Perbandingan διπλότερον ὑμῶν juga perlu diungkapkan lebih jelas sebagai derajat keterarahan kepada Gehena dibanding para lawan bicara.
  naturalness: Teks umumnya modern dan jelas. “Menjadikan seorang menjadi proselit” dapat dibuat lebih alami menjadi “menjadikan satu orang proselit.” Frasa akhir diletakkan ulang agar perbandingan “dua kali lebih” terbaca jelas dalam bahasa Indonesia.
  terminology: “Ahli-ahli Taurat,” “orang-orang Farisi,” “munafik,” “proselit,” dan “Gehena” sesuai register dan cukup setia pada istilah sumber. Catatan Gehena sebaiknya menyatakan bahwa istilah itu dipakai oleh teks Yunani, tanpa menyiratkan bahwa asal-usul katanya adalah Yunani.
  issues:
  - severity: medium
    issue: “Sesudah ia menjadi proselit” untuk ὅταν γένηται
    rationale: Ὅταν adalah penanda waktu/keadaan yang paling langsung diterjemahkan “ketika” atau “apabila.” “Sesudah” menambahkan penegasan urutan temporal yang tidak perlu dinyatakan oleh bentuk Yunani.
  - severity: medium
    issue: Perbandingan akhir kurang jelas terikat pada “anak Gehena”
    rationale: “Anak Gehena, dua kali lipat dibandingkan kalian sendiri” terdengar eliptis dalam bahasa Indonesia. Revisi perlu mempertahankan metafora sumber sambil membuat derajat perbandingannya dapat dipahami.
  - severity: low
