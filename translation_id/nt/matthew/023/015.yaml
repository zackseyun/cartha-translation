id: MAT.23.15
reference: Matthew 23:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: id
  text: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menjelajahi laut dan darat untuk menjadikan satu orang proselit[a]. Ketika ia menjadi proselit, kalian menjadikannya anak Gehena[b], dua kali lebih pantas masuk Gehena daripada kalian sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Proselit ialah orang bukan Yahudi yang beralih memeluk agama Yahudi.
    reason: lexical_explanation
  - marker: b
    text: Atau “anak neraka.” Teks Yunani memakai istilah “Gehena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Celakalah
  rationale: Menyampaikan seruan penghukuman profetis, bukan sekadar ungkapan kesedihan.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Istilah Indonesia yang lazim dan mudah dipahami bagi kelompok cendekiawan serta penafsir hukum Yahudi yang dimaksud.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok Yahudi tersebut.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Padanan alami yang mengungkap kepura-puraan moral dan keagamaan dalam konteks ini.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: menjelajahi laut dan darat
  rationale: Mengungkap upaya perjalanan yang luas dengan bahasa Indonesia alami sambil mempertahankan pasangan 'laut dan darat'.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: untuk membuat seorang menjadi proselit
  rationale: Mempertahankan istilah khusus bagi orang bukan Yahudi yang beralih memeluk agama Yahudi; artinya dijelaskan dalam catatan kaki.
- source_word: ὅταν γένηται
  choice: sesudah ia menjadi proselit
  rationale: Menyatakan hasil yang tersirat dalam bahasa Yunani dan mempertahankan rujukan tunggal maskulin secara alami.
- source_word: υἱὸν γεέννης
  choice: anak Gehena
  rationale: Mempertahankan istilah Yunani dan ungkapan Semitis 'anak Gehena' tanpa meratakannya menjadi konsep umum 'neraka'.
- source_word: διπλότερον ὑμῶν
  choice: dua kali lipat dibandingkan kalian sendiri
  rationale: Mempertahankan perbandingan ganda dengan para ahli Taurat dan orang Farisi, sekalipun ungkapan sumber sengaja tajam dan padat.
theological_decisions:
- issue: Penerjemahan γεέννα
  choice: Gehena
  alternative: neraka
  rationale: Teks Yunani memakai nama Gehena, yang memiliki latar sejarah Yahudi dan makna eskatologis; transliterasi mempertahankan kekhususan itu, sedangkan padanan umum dicantumkan dalam catatan kaki.
- issue: Ungkapan υἱὸν γεέννης
  choice: anak Gehena
  alternative: orang yang ditentukan untuk neraka
  rationale: Bentuk Semitis dalam teks dipertahankan agar hubungan dan akibat yang dikandung metafora itu tidak dipersempit menjadi satu tafsiran saja.
- issue: Rujukan tunggal maskulin setelah προσήλυτον
  choice: ia ... -nya
  alternative: orang itu
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga; 'ia' secara alami mempertahankan ketunggalan tanpa menambahkan informasi yang tidak dinyatakan secara leksikal.
translation_notes:
  register: Bahasanya modern, langsung, dan tetap khidmat. Sapaan jamak 'kalian' memperjelas bahwa teguran ditujukan kepada kelompok yang disebut. Partikel vokatif 'hai' mempertahankan tekanan retoris. Istilah teknis 'proselit' dan 'Gehena' dipertahankan karena ketepatan historis-teologis, lalu dijelaskan melalui catatan kaki.
