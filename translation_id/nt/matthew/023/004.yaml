  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: id
  text: Mereka mengikat beban-beban berat lalu meletakkannya di atas bahu orang-orang, tetapi mereka sendiri tidak mau menggerakkannya dengan satu jari pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: mengikat
  rationale: Kata ini menyatakan tindakan mengikat atau menyatukan; pilihan ini mempertahankan gambaran konkret tentang beban yang dipersiapkan untuk dipikulkan.
- source_word: φορτία βαρέα
  choice: beban-beban berat
  rationale: Ungkapan ini mempertahankan baik gambaran harfiah tentang muatan yang berat maupun daya metaforis tentang tuntutan yang menindas.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: meletakkannya di atas bahu
  rationale: Terjemahan ini mengikuti tindakan menaruh sesuatu di atas bahu dan mempertahankan gambaran jasmani dalam teks Yunani.
- source_word: τῶν ἀνθρώπων
  choice: orang lain
  rationale: Dalam konteks kontras dengan pelaku, ἄνθρωποι merujuk secara umum kepada orang-orang yang dibebani. 'Orang lain' alami dalam bahasa Indonesia dan tidak membatasi rujukan berdasarkan gender.
- source_word: αὐτοὶ δὲ
  choice: tetapi mereka sendiri
  rationale: Kata ganti yang tegas dipertahankan untuk menonjolkan pertentangan antara apa yang mereka bebankan kepada orang lain dan apa yang enggan mereka lakukan.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: dengan satu jari pun
  rationale: Ungkapan Indonesia ini mempertahankan bentuk tunggal dan secara alami menyampaikan bahwa mereka menolak mengerahkan upaya sekecil apa pun.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: tidak mau menggerakkannya
  rationale: Pilihan ini mempertahankan unsur kehendak dalam θέλω dan arti dasar κινέω, yakni menggerakkan, tanpa menggantinya dengan tindakan yang lebih khusus seperti mengangkat.
theological_decisions:
- issue: Apakah beban dipahami secara harfiah atau metaforis
  choice: Mempertahankan gambaran konkret 'beban-beban berat' tanpa menjelaskan apa yang dilambangkannya.
  alternative: Menafsirkannya secara eksplisit sebagai tuntutan hukum atau peraturan agama.
  rationale: Dalam konteksnya, Yesus mengecam para ahli Taurat dan orang Farisi karena membebankan kewajiban yang menindas, tetapi ayat Yunani ini sendiri tidak menyebutkan secara khusus isi beban itu. Metafora dipertahankan agar cakupan maknanya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'beban-beban' mempertahankan jamak sumber; 'dengan satu jari pun' mengungkapkan penolakan terhadap upaya yang paling kecil secara idiomatis tanpa menghilangkan citra aslinya.
