  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: id
  text: Kemudian Yesus berbicara kepada orang banyak dan kepada murid-murid-Nya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Keterangan waktu ini menandai urutan dalam narasi. “Kemudian” alami dalam bahasa Indonesia dan tidak menyiratkan selang waktu tertentu.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Kata sandang Yunani di depan nama diri merupakan pemakaian naratif biasa dan tidak perlu diterjemahkan dalam bahasa Indonesia.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: Bentuk aoris dari λαλέω menyatakan tindakan berbicara. “Berbicara” mempertahankan makna sederhana tanpa menambahkan nuansa resmi seperti “berpidato” atau “menyampaikan amanat.”
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: Walaupun bentuk Yunaninya jamak, ungkapan idiomatis “orang banyak” secara alami menyatakan kumpulan-kumpulan orang dalam bahasa Indonesia tanpa kesan arkais.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana yang menggabungkan kedua kelompok penerima perkataan Yesus.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Bentuk datif jamak dengan genitif posesif diterjemahkan secara alami sebagai “kepada murid-murid-Nya.” Huruf kapital pada “-Nya” mengikuti kelaziman penulisan rujukan kepada Yesus dalam Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur pengulangan “kepada ... dan kepada ...” dipertahankan agar kedua kelompok pendengar tetap disebut secara setara dan dekat dengan susunan sumber Yunani.
