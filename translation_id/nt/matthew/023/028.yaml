review_pass:
  verdict: revise
  source_fidelity: Struktur komparatif οὕτως καί serta kontras ἔξωθεν/ἔσωθεν diterjemahkan dengan baik. "Tampak" secara tepat menyatakan penampilan, bukan status moral yang nyata. Namun, "tampak benar" dapat dalam bahasa Indonesia berarti "kelihatan tepat/tidak salah"; δίκαιοι di sini lebih jelas merujuk pada orang yang dipandang saleh atau benar secara moral-keagamaan. Menambahkan "sebagai orang" memperjelas predikasi tanpa menambah makna. "Kedurhakaan terhadap hukum" mempertahankan unsur ἀνομία sebagai sikap/keadaan yang berlawanan dengan hukum.
  naturalness: Kalimatnya sudah baku, lugas, dan sesuai register teguran. "Secara lahiriah" memberi pasangan yang lebih idiomatis dan seimbang dengan "di dalam" daripada "dari luar", sementara tetap mempertahankan kontras eksternal-internal.
  terminology: '"Kemunafikan" adalah padanan mapan dan tepat untuk ὑποκρίσεως. "Kedurhakaan terhadap hukum" mempertahankan unsur hukum dalam ἀνομία tanpa menetapkan hukum tertentu secara denominatif. "Orang benar" secara idiomatis menyampaikan δίκαιοι dalam konteks etis-keagamaan.'
  issues:
