id: MAT.23.28
reference: Matthew 23:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: id
  text: Demikian juga, secara lahiriah kalian tampak sebagai orang benar di mata orang, tetapi di dalam kalian penuh dengan kemunafikan dan kedurhakaan terhadap hukum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Menghubungkan ayat ini dengan gambaran kuburan yang dilabur putih pada ayat sebelumnya serta mempertahankan daya perbandingannya secara alami.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: dari luar ... di dalam
  rationale: Pasangan ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras antara penampilan lahiriah dan kenyataan batiniah.
- source_word: φαίνεσθε
  choice: tampak
  rationale: Menyatakan kesan yang terlihat oleh pengamat tanpa menegaskan bahwa mereka sungguh-sungguh benar.
- source_word: τοῖς ἀνθρώποις
  choice: di mata orang
  rationale: Menyampaikan datif acuan, yakni bagaimana mereka dinilai manusia, dengan ungkapan Indonesia yang wajar dan generik.
- source_word: δίκαιοι
  choice: benar
  rationale: Dalam konteks ini menunjuk pada kesan bermoral dan berkenan menurut ukuran keagamaan; 'benar' menjaga cakupan etis-religiusnya.
- source_word: μεστοὶ
  choice: penuh dengan
  rationale: Padanan langsung dan alami bagi kata sifat yang berarti penuh.
- source_word: ὑποκρίσεως
  choice: kemunafikan
  rationale: Mengungkap kepura-puraan moral dan keagamaan yang sedang dikecam Yesus.
- source_word: ἀνομίας
  choice: kedurhakaan terhadap hukum
  rationale: Menjaga hubungan leksikal dengan hukum dalam ἀνομία, bukan meratakannya menjadi kejahatan umum; frasa ini juga lebih jelas daripada kata serapan atau istilah arkais.
theological_decisions:
- issue: Apakah δίκαιοι menyatakan status benar yang nyata atau hanya kesan di hadapan manusia
  choice: Kebenaran yang hanya tampak menurut penilaian orang
  alternative: Status benar yang sungguh-sungguh
  rationale: Kata kerja 'tampak' dan kontras dengan keadaan batin yang penuh kemunafikan dan kedurhakaan menunjukkan bahwa Yesus membicarakan penampilan, bukan mengesahkan kebenaran mereka.
- issue: Cakupan ἀνομία
  choice: Kedurhakaan terhadap hukum
  alternative: Kejahatan atau kefasikan secara umum
  rationale: Pilihan ini mempertahankan unsur νόμος, 'hukum', tanpa mempersempitnya melalui penjelasan denominatif mengenai hakikat hukum tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai teguran langsung kepada ahli-ahli Taurat dan orang-orang Farisi dalam konteks. Diksi dibuat lugas dan bermartabat; struktur luar-dalam dipertahankan dengan jelas.
