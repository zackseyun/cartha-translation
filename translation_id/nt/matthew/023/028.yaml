    issue: '"tampak benar" berpotensi ambigu'
    rationale: Dalam pemakaian Indonesia modern, "benar" tanpa nomina dapat dipahami sebagai "tepat" atau "tidak keliru", bukan terutama sebagai kesan bahwa seseorang saleh/berintegritas. δίκαιοι dalam konstruksi ini memerlukan penanda yang jelas bagi kualitas orang tersebut.
