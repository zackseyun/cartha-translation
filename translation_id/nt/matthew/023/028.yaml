  rationale: Revisi terbatas pada penjelasan predikat δίκαιοι sebagai "orang benar" dan penghalusan pasangan keterangan eksternal-internal. Makna penampilan lahiriah yang berlawanan dengan keadaan batin, serta nuansa ἀνομία yang terkait hukum, tetap dipertahankan.
