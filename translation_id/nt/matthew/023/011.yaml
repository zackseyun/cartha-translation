  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: id
  text: Namun, yang terbesar di antara kalian akan menjadi pelayan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “yang lebih besar di antara kalian akan menjadi pelayan kalian.” Bentuk komparatif Yunani dapat dipakai secara idiomatis untuk orang yang berkedudukan paling tinggi dalam kelompok itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan pengejaran gelar dan kedudukan dalam konteks sebelumnya, dengan gaya Indonesia modern dan bermartabat.
- source_word: μείζων
  choice: yang terbesar
  rationale: Bentuk komparatif Yunani ini dapat berfungsi secara idiomatis dengan makna seperti superlatif, yakni orang yang berkedudukan paling tinggi dalam kelompok yang disapa.
- source_word: ὑμῶν (pertama)
  choice: di antara kalian
  rationale: Genitif pertama bersifat partitif dan secara alami menyatakan seseorang dari dalam kelompok para pendengar.
- source_word: ἔσται
  choice: akan menjadi
  rationale: Menerjemahkan bentuk futur εἰμί secara langsung dan alami; 'menjadi' sesuai dengan predikat peran διάκονος.
- source_word: ὑμῶν (kedua)
  choice: kalian
  rationale: Genitif kedua menyatakan hubungan pelayanan kepada kelompok yang disapa; 'pelayan kalian' adalah ungkapan Indonesia yang alami.
- source_word: διάκονος
  choice: pelayan
  rationale: Dalam konteks ini menunjuk kepada orang yang melayani orang lain, bukan jabatan gerejawi teknis; 'pelayan' mempertahankan pembalikan status tanpa memberi kesan jabatan diaken.
theological_decisions:
- issue: Bahasa status dalam ajaran Yesus tentang kebesaran dan pelayanan
  choice: 'Menerjemahkan ucapan ini sebagai pembalikan kedudukan: ''yang terbesar di antara kalian akan menjadi pelayan kalian.'''
  alternative: yang lebih besar dari antara kalian akan menjadi pelayan kalian
  rationale: Pilihan ini menyampaikan bahwa kebesaran sejati terwujud dalam pelayanan, tanpa memasukkan jabatan gerejawi kemudian atau mengurangi ketegangan antara status tinggi dan peran melayani.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kata ganti 'kalian' dipakai untuk menyatakan sapaan jamak secara eksplisit; 'pelayan' dipilih sebagai istilah umum dan nonteknis.
