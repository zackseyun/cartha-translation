id: MAT.23.19
reference: Matthew 23:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: id
  text: 'Hai orang-orang buta! Sebab, manakah yang lebih besar: persembahan[a] atau mazbah yang menguduskan[b] persembahan itu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pemberian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: menjadikan persembahan itu kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: orang-orang buta
  rationale: Kata sifat dalam bentuk vokatif jamak yang dipakai sebagai nomina dan merupakan teguran langsung. Ungkapan ini alami dalam bahasa Indonesia serta tidak menambahkan kata 'bodoh', yang tidak terdapat dalam ayat ini.
- source_word: τί γὰρ μεῖζον
  choice: Sebab, manakah yang lebih besar
  rationale: Kata γάρ diberi daya penjelas dengan 'sebab', sedangkan τί dalam pertanyaan perbandingan diterjemahkan 'manakah'. 'Lebih besar' mempertahankan perbandingan μεῖζον tanpa mempersempitnya menjadi 'lebih penting'.
- source_word: τὸ δῶρον
  choice: persembahan
  rationale: Dalam konteks Bait Allah, δῶρον menunjuk pada sesuatu yang dipersembahkan. 'Persembahan' lebih alami dan langsung dipahami dalam bahasa Indonesia, sementara arti harfiahnya, 'pemberian', dicatat sebagai alternatif.
- source_word: θυσιαστήριον
  choice: mazbah
  rationale: Istilah baku dan ringkas untuk tempat persembahan kurban dalam konteks ibadah, serta mempertahankan corak kultis ayat ini.
- source_word: τὸ ἁγιάζον
  choice: yang menguduskan
  rationale: Partisipel kini ini menerangkan mazbah. 'Menguduskan' mempertahankan bobot leksikal dan teologis ἁγιάζω serta hubungan kekudusan antara mazbah dan persembahan.
theological_decisions:
- issue: Bahasa kultis ἁγιάζω mengenai hubungan antara mazbah dan persembahan
  choice: mazbah yang menguduskan persembahan itu
  alternative: mazbah yang menjadikan persembahan itu kudus
  rationale: Terjemahan ini mempertahankan gagasan dalam argumen Yesus bahwa mazbah memberikan status kudus kepada persembahan, tanpa mereduksinya menjadi tindakan seremonial belaka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Seruan 'Hai' menandai sapaan langsung yang keras, sedangkan 'mazbah' mempertahankan register ibadah yang sesuai dengan konteks Bait Allah.
