  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: id
  text: Jangan pula kamu disebut pembimbing, sebab kamu hanya mempunyai satu pembimbing, yaitu Mesias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Jangan pula
  rationale: Partikel ini melanjutkan rangkaian larangan sebelumnya; “pula” mempertahankan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: κληθῆτε
  choice: kamu disebut
  rationale: Bentuk pasif ini menunjuk pada pemberian atau penggunaan suatu gelar bagi para murid.
- source_word: καθηγηταί / καθηγητής
  choice: pembimbing / Pembimbing
  rationale: Kata ini dapat menunjuk kepada orang yang menuntun atau memberi pengajaran. “Pembimbing” mempertahankan unsur tuntunan dan membedakannya dari διδάσκαλος, “guru”, dalam konteks dekat.
- source_word: ὅτι
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi larangan tersebut.
- source_word: ὑμῶν ἐστιν εἷς
  choice: hanya satu Pembimbingmu
  rationale: Susunan Indonesia ini menyampaikan kepemilikan dan menonjolkan bahwa pembimbing itu satu-satunya.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Dengan artikelnya, Χριστός berfungsi sebagai gelar; “Mesias” menyampaikan makna gelar tersebut dan latar pengharapan Yahudinya.
theological_decisions:
- issue: Makna larangan mengenai gelar καθηγητής
  choice: Disebut “pembimbing”
  alternative: Disebut “pemimpin”, “pengajar”, atau “penuntun”
  rationale: “Pembimbing” mencakup unsur menuntun dan mengajar tanpa memperluas larangan menjadi pernyataan mutlak tentang setiap bentuk kepemimpinan atau pengajaran.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut tampil dengan artikel dan berfungsi jelas sebagai gelar. Catatan kaki mempertahankan padanan tradisional yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Huruf kapital pada “Pembimbing” dalam klausa kedua menandai rujukannya kepada Mesias, sedangkan bentuk pertama tetap sebagai sebutan umum.
