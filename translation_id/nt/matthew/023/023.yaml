  source_fidelity: Terjemahan pada dasarnya setia kepada teks Yunani. “Kesetiaan” merupakan pemaknaan yang layak untuk πίστιν dalam rangkaian tuntutan etis ini, dan catatan kaki perlu mempertahankan alternatif “iman” tanpa menyatakan bahwa satu pembacaan pasti paling benar. Semua unsur utama—kecaman, persepuluhan atas rempah-rempah, pengabaian hal-hal yang lebih berbobot, serta kewajiban melakukan keduanya—telah terwakili.
  naturalness: Bahasa Indonesia modern, jelas, dan bernada kecaman yang sesuai. “Ahli-ahli Taurat,” “orang-orang Farisi,” “persepuluhan,” dan “belas kasihan” terdengar wajar dalam register Alkitab Indonesia. Kalimat penutup jelas dalam konteks dekatnya.
  terminology: Istilah “Taurat,” “persepuluhan,” “keadilan,” “belas kasihan,” dan “kesetiaan” konsisten dan dapat dipertahankan. Catatan kaki semula memasukkan “sikap dapat dipercaya,” yang kurang langsung sebagai padanan πίστις dalam konteks ini, serta memberi penilaian “kemungkinan paling sesuai” yang terlalu mengunci salah satu pemahaman. Catatan direvisi agar netral dan akurat.
  issues:
