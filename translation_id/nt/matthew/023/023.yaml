id: MAT.23.23
reference: Matthew 23:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: id
  text: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian memberikan persepuluhan dari daun mint, adas, dan jintan, tetapi mengabaikan perkara-perkara yang lebih berbobot dalam hukum Taurat, yaitu keadilan, belas kasihan, dan kesetiaan[a]. Yang ini harus kalian lakukan tanpa mengabaikan yang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “iman.” Kata Yunani ini dapat berarti iman, kepercayaan, atau kesetiaan; dalam konteks etis ini, kata ini juga dapat dipahami sebagai “kesetiaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Celakalah
  rationale: Ungkapan kecaman dan penghukuman profetis; bentuk ini mempertahankan daya tegurnya.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Sebutan baku dan mudah dipahami dalam konteks Injil untuk para pakar serta penafsir hukum Taurat.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Menyampaikan makna etis metaforisnya secara alami dalam bahasa Indonesia modern.
- source_word: ἀποδεκατοῦτε
  choice: memberikan persepuluhan dari
  rationale: Menunjukkan tindakan menyerahkan sepersepuluh bagian dan cocok dengan objek berupa rempah-rempah.
- source_word: ἡδύοσμον
  choice: daun mint
  rationale: Nama tumbuhan yang lazim dipahami; 'daun' memperjelas bahwa yang dimaksud ialah herba.
- source_word: ἄνηθον
  choice: adas
  rationale: Padanan Indonesia yang lazim bagi dill dalam konteks tumbuhan rempah.
- source_word: κύμινον
  choice: jintan
  rationale: Padanan Indonesia baku bagi cumin.
- source_word: ἀφήκατε
  choice: mengabaikan
  rationale: Dalam konteks ini berarti membiarkan atau tidak melakukan kewajiban yang lebih penting.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: perkara-perkara yang lebih berbobot dalam hukum Taurat
  rationale: Mempertahankan metafora 'lebih berat' sambil menyatakan tingkat kepentingannya secara jelas.
- source_word: κρίσιν
  choice: keadilan
  rationale: Dalam rangkaian tuntutan etis ini, kata tersebut menunjuk pada pelaksanaan keadilan, bukan sekadar tindakan menghakimi.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan alami yang menyampaikan kemurahan hati terhadap orang yang membutuhkan.
- source_word: πίστιν
  choice: kesetiaan
  rationale: Dalam rangkaian kewajiban etis—keadilan, belas kasihan, dan πίστις—makna fidelity/faithfulness paling sesuai, sambil tetap mengakui kemungkinan 'iman' dalam catatan kaki.
- source_word: ταῦτα ... κἀκεῖνα
  choice: Yang ini ... yang itu
  rationale: 'Mempertahankan kontras demonstratif sumber: kewajiban yang lebih berbobot harus dilakukan tanpa meninggalkan persepuluhan tadi.'
theological_decisions:
- issue: Makna πίστιν dalam rangkaian etis
  choice: kesetiaan
  alternative: iman atau sikap dapat dipercaya
  rationale: Konteksnya menyebut perkara hukum Taurat yang harus dipraktikkan, sehingga 'kesetiaan' paling wajar; karena πίστις juga dapat berarti iman atau kepercayaan, keluasan makna itu dicatat dan tidak dihapus.
- issue: Hubungan antara kewajiban yang lebih berbobot dan persepuluhan
  choice: Yang ini harus dilakukan tanpa mengabaikan yang itu
  alternative: Melakukan yang satu sambil tidak meninggalkan yang lain
  rationale: Teks menegaskan prioritas keadilan, belas kasihan, dan kesetiaan tanpa menyatakan bahwa kewajiban lainnya boleh ditinggalkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak informal-netral 'kalian' dipakai untuk menyampaikan ὑμῖν secara langsung; 'hai' mempertahankan daya seru kecaman. Metafora bobot dipertahankan dalam 'lebih berbobot'.
