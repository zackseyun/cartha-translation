id: MAT.23.17
reference: Matthew 23:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: id
  text: 'Hai orang-orang bodoh dan buta! Sebab, mana yang lebih besar: emas itu atau Bait Allah[a] yang menguduskan emas itu[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai di sini dapat secara lebih khusus menunjuk pada tempat suci dalam kompleks Bait Allah.
    reason: cultural_note
  - marker: b
    text: 'Atau: “yang menjadikan emas itu kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ καὶ τυφλοί
  choice: Hai orang-orang bodoh dan buta!
  rationale: Bentuk sapaan langsung jamak dipertahankan dengan seruan yang tegas dan wajar dalam bahasa Indonesia. Kata "orang-orang" memperjelas bahwa kedua sifat itu ditujukan kepada orang yang sama tanpa menambahkan penanda gender yang tidak tersedia secara alami dalam bahasa Indonesia.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Sebab, mana yang lebih besar
  rationale: '"Mana" secara alami menanyakan pilihan di antara dua hal yang disebutkan. "Sebab" mempertahankan fungsi penjelas γάρ dalam rangkaian argumen.'
- source_word: ὁ χρυσὸς
  choice: emas itu
  rationale: Kata penunjuk "itu" menunjukkan emas tertentu yang sedang dibicarakan dalam konteks sumpah dan mencerminkan fungsi artikel Yunani.
- source_word: ὁ ναὸς
  choice: Bait Allah
  rationale: '"Bait Allah" adalah sebutan Indonesia yang jelas dan lazim untuk bangunan suci di Yerusalem; catatan kaki menjelaskan bahwa ναός dapat menunjuk secara lebih khusus pada bagian tempat sucinya.'
- source_word: ὁ ἁγιάσας
  choice: yang menguduskan
  rationale: Bentuk ini menyampaikan tindakan pemberian status kudus secara alami dalam bahasa Indonesia dan mempertahankan nuansa keagamaan ἁγιάζω. Dalam pertanyaan ini, ungkapan tersebut menyatakan dasar tetap bagi kekudusan emas tanpa harus memaksakan aspek waktu secara kaku.
- source_word: τὸν χρυσόν
  choice: emas itu
  rationale: Pengulangan frasa mempertahankan kesejajaran retoris dan kejelasan objek seperti dalam teks Yunani.
theological_decisions:
- issue: Makna kultis ἁγιάζω dalam hubungan antara Bait Allah dan emas
  choice: menguduskan
  alternative: menjadikan ... kudus
  rationale: '"Menguduskan" mempertahankan register keagamaan dan logika bahwa Bait Allah memberikan status kudus kepada emas, tanpa menjelaskan mekanismenya melampaui teks.'
- issue: Cakupan ναός
  choice: Bait Allah
  alternative: tempat suci Bait Allah
  rationale: Terjemahan utama memakai istilah yang mudah dipahami pembaca umum, sedangkan kemungkinan rujukan yang lebih khusus kepada ruang atau bangunan tempat suci dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa yang dipakai modern, tegas, dan tetap bermartabat. Seruan pembuka mempertahankan kerasnya teguran Yesus, sedangkan susunan pertanyaan dibuat alami bagi pembaca Indonesia tanpa menghilangkan hubungan penjelas yang ditandai oleh γάρ.
