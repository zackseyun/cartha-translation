base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: id
  text: Janganlah menyebut siapa pun di bumi sebagai bapamu, sebab Bapamu satu, Bapa yang di surga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: Janganlah menyebut siapa pun ... sebagai bapamu
  rationale: Bentuk larangan dengan μή dan aoristus subjungtif diterjemahkan sebagai perintah negatif. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pemakaian 'bapa' sebagai sebutan, tanpa menambahkan tafsiran bahwa yang dimaksud ialah ayah biologis.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Menyatakan lingkup duniawi dan mempertahankan kontras dengan Dia yang di surga.
- source_word: εἷς
  choice: hanya satu
  rationale: Walaupun εἷς secara harfiah berarti 'satu', dalam susunan predikatif ini konteksnya menyatakan keeksklusifan; 'hanya satu' merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: ὑμῶν ὁ πατήρ
  choice: Bapamu
  rationale: Genitif ὑμῶν menyatakan hubungan kepunyaan, dan bentuk tunggal kolektif '-mu' secara wajar merujuk kepada para pendengar. Huruf kapital membedakan sebutan bagi Bapa surgawi dalam klausa ini.
- source_word: ὁ οὐράνιος
  choice: yaitu Dia yang di surga
  rationale: Adjektiva berartikel ini dipakai secara substantival untuk mengidentifikasi Bapa sebagai Pribadi surgawi. Terjemahan ini mempertahankan konstruksi yang agak khusus tanpa mengulang kata 'Bapa'.
theological_decisions:
- issue: Cakupan larangan Yesus
  choice: Mempertahankan larangan langsung untuk menyebut siapa pun di bumi sebagai 'bapa', tanpa menjelaskan atau membatasinya dalam teks.
  alternative: Mempersempitnya menjadi larangan terhadap gelar rohani saja, atau memperluasnya secara eksplisit menjadi larangan mutlak atas setiap penggunaan kata 'bapa'.
  rationale: Bahasa Yunani menyatakan larangan secara tegas, tetapi tidak menjelaskan dalam ayat ini hubungannya dengan penggunaan biologis atau sosial. Terjemahan perlu mempertahankan ketegangan tersebut dan membiarkan konteks menentukan penerapannya.
- issue: Identifikasi ὁ οὐράνιος
  choice: Menerjemahkannya sebagai aposisi, 'yaitu Dia yang di surga'.
  alternative: '''Bapa surgawi'' atau ''Dia yang surgawi''.'
  rationale: Bentuk Yunani dapat dipahami sebagai sebutan substantival yang mengidentifikasi Bapa. Pilihan ini menyampaikan hubungan itu dengan jelas tanpa memasukkan rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Bapa' dipilih untuk mempertahankan kesejajaran sebutan dalam kedua klausa serta nuansa religius, sedangkan 'siapa pun' menyatakan objek manusia yang tersirat tanpa membatasi gender. Tidak diperlukan catatan kaki karena alternatif sintaksis tidak mengubah makna secara berarti.
