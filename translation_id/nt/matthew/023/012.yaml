id: MAT.23.12
reference: Matthew 23:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: id
  text: Namun, siapa pun yang meninggikan dirinya akan direndahkan,[a] dan siapa pun yang merendahkan dirinya akan ditinggikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan dibuat rendah” ... “akan diangkat tinggi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: siapa pun yang
  rationale: Pronomina relatif tak tentu ini menyatakan prinsip umum; bentuk ini alami dalam bahasa Indonesia dan mencakup siapa saja.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan konteks sebelumnya sekaligus meneruskan perkataan Yesus.
- source_word: ὑψώσει ἑαυτὸν
  choice: meninggikan dirinya
  rationale: Mempertahankan gambaran harfiah sekaligus menyampaikan makna meninggikan kedudukan atau kehormatan diri.
- source_word: ταπεινωθήσεται
  choice: akan direndahkan
  rationale: Mempertahankan bentuk pasif futurum tanpa menyebut pelakunya; juga menjaga kesejajaran dengan klausa kedua.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana yang mengaitkan dua klausa berimbang.
- source_word: ταπεινώσει ἑαυτὸν
  choice: merendahkan dirinya
  rationale: Ungkapan refleksif yang alami dan langsung, dengan pengertian merendahkan diri, bukan menghina diri.
- source_word: ὑψωθήσεται
  choice: akan ditinggikan
  rationale: Mempertahankan bentuk pasif dan hubungan leksikal dengan 'meninggikan' pada klausa pertama.
theological_decisions:
- issue: Pelaku pada kedua verba pasif
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku
  alternative: 'Mengungkapkan Allah sebagai pelaku: ''Allah akan merendahkan/meninggikan'''
  rationale: Teks Yunani tidak menyatakan pelakunya secara eksplisit. Bentuk pasif mempertahankan keterbukaan teks, meskipun tindakan Allah dapat dipahami secara tersirat.
- issue: Bentuk maskulin tunggal yang berfungsi umum
  choice: Menerjemahkan ὅστις dengan 'siapa pun' dan ἑαυτόν dengan 'dirinya'
  alternative: Memakai bentuk yang secara eksplisit menunjuk laki-laki, seperti 'barangsiapa ... dirinya sendiri' dalam pemakaian yang dianggap maskulin
  rationale: Bahasa Indonesia tidak menandai gender pada 'siapa pun' atau '-nya'. Bentuk ini secara akurat menyampaikan fungsi representatif umum dari maskulin tunggal Yunani tanpa mempersempit cakupannya.
- issue: Makna ὑψόω dan ταπεινόω
  choice: Menjaga pasangan 'meninggikan/direndahkan' dan 'merendahkan/ditinggikan'
  alternative: Menggunakan pasangan 'mengangkat/direndahkan' atau 'merendahkan/diangkat'
  rationale: Pilihan ini mempertahankan simetri retoris dan tema pembalikan kehormatan, tanpa menentukan apakah yang dimaksud terutama status sosial, keadaan batin, atau tindakan ilahi pada penghakiman.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada peribahasa. 'Namun' memberi kontras yang wajar; susunan dua klausa dipertahankan secara sejajar. Penanda catatan kaki [a] ditempatkan sesudah klausa pertama, tetapi catatannya berlaku bagi pasangan ungkapan pasif dalam kedua klausa.
