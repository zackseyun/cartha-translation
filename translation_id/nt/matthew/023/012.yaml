  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur pepatah umum dalam Yunani: ὅστις diterjemahkan “siapa pun yang”; kedua tindakan refleksif dipertahankan (“meninggikan/merendahkan dirinya”); dan kedua verba futurum pasif diterjemahkan “akan direndahkan/ditinggikan” tanpa menambahkan pelaku. Kontras ringan δέ dapat diterjemahkan secara wajar dengan “Namun.”'
