  source_fidelity: Draf dengan tepat menangkap kondisi kontrafaktual masa lampau dan penyangkalan partisipasi bersama. Namun, “dalam menumpahkan darah” mengubah frasa Yunani yang secara harfiah dan sengaja konkret, ἐν τῷ αἵματι τῶν προφητῶν (“dalam darah para nabi”), menjadi penjelasan tindakan yang lebih eksplisit. Karena frasa sumber dapat memuat baik partisipasi dalam kekerasan maupun keterlibatan dalam kesalahan darah, bentuk konkret itu sebaiknya dipertahankan dalam teks utama.
  naturalness: “Ikut ambil bagian bersama mereka” agak bertumpuk karena “ikut,” “ambil bagian,” dan “bersama” menyatakan unsur keterlibatan yang sama. “Mengambil bagian bersama mereka” lebih ringkas, modern, dan tetap bermartabat. “Pada zaman nenek moyang kami” merupakan idiom Indonesia yang alami untuk rujukan kepada generasi pendahulu.
  terminology: “Para nabi” tepat dan mapan. “Nenek moyang kami” menyampaikan fungsi idiomatis πατέρων ἡμῶν dalam konteks historis, tanpa mengklaim bahwa istilah Indonesia itu secara leksikal identik dengan “bapak-bapak.” Istilah “darah para nabi” dipertahankan agar citra dan keluasan semantis sumber tidak hilang.
