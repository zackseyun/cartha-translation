base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: id
  text: dan kamu berkata, “Seandainya kami hidup pada zaman nenek moyang kami, kami tidak akan mengambil bagian bersama mereka[a] dalam darah para nabi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi sekutu mereka” atau “turut serta dengan mereka”; istilah Yunani ini dapat menyatakan keterlibatan atau partisipasi bersama, termasuk dalam tindakan yang bersalah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam darah para nabi”; dalam konteks ini ungkapan tersebut mengacu pada keterlibatan dalam penumpahan darah atau kesalahan atas darah para nabi.
    reason: literal_rendering
lexical_decisions:
- source_word: λέγετε
  choice: kamu berkata
  rationale: Bentuk kini orang kedua jamak diterjemahkan sebagai sapaan langsung dalam kecaman Yesus; bentuk ini alami dan tetap mempertahankan nilai presentis dalam konteks.
- source_word: Εἰ ἤμεθα
  choice: Seandainya kami hidup
  rationale: Imperfek dalam syarat yang berlawanan dengan kenyataan menunjuk pada keadaan hipotetis pada masa lampau. “Seandainya” bersama “tidak akan” menyampaikan sifat kontrafaktualnya secara alami dalam bahasa Indonesia.
- source_word: ἐν ταῖς ἡμέραις
  choice: pada zaman
  rationale: Ungkapan temporal ini berarti “pada masa” atau “semasa.” “Pada zaman” jelas, ringkas, dan sesuai dengan konteks sejarah.
- source_word: τῶν πατέρων ἡμῶν
  choice: leluhur kami
  rationale: πατέρων secara harfiah berarti “bapak-bapak,” tetapi dalam konteks ini menunjuk kepada generasi pendahulu. “Leluhur kami” merupakan padanan Indonesia yang alami tanpa mengubah rujukan historisnya.
- source_word: οὐκ ἂν ἤμεθα
  choice: kami tidak akan
  rationale: οὐκ ἄν dengan imperfek membentuk akibat dari syarat masa lampau yang berlawanan dengan kenyataan. Bahasa Indonesia secara alami menyatakannya dengan “tidak akan” setelah klausa “seandainya.”
- source_word: αὐτῶν κοινωνοὶ
  choice: ikut ambil bagian bersama mereka
  rationale: κοινωνοί menyatakan keterlibatan atau kebersamaan dalam suatu tindakan. Pilihan ini mempertahankan gagasan partisipasi dan kemungkinan implikasi keterlibatan bersalah tanpa mempersempitnya menjadi “kaki tangan.”
- source_word: ἐν τῷ αἵματι
  choice: dalam menumpahkan darah
  rationale: Secara harfiah frasa ini berbunyi “dalam darah,” tetapi dalam konteks darah para nabi, maksud idiomatisnya ialah turut terlibat dalam penumpahan darah mereka. Terjemahan ini membuat hubungan sintaksisnya alami dalam bahasa Indonesia sambil mempertahankan citra “darah.”
- source_word: τῶν προφητῶν
  choice: para nabi
  rationale: προφητῶν secara langsung berarti “nabi-nabi”; “para nabi” adalah bentuk Indonesia baku dan alami.
theological_decisions:
- issue: Tingkat keterlibatan yang dinyatakan oleh κοινωνοὶ ἐν τῷ αἵματι
  choice: ikut ambil bagian bersama mereka dalam menumpahkan darah para nabi
  alternative: menjadi sekutu mereka dalam darah para nabi; turut menanggung kesalahan atas darah para nabi
  rationale: Teks menyangkal keterlibatan dalam kekerasan leluhur terhadap para nabi. Rumusan utama mempertahankan gagasan partisipasi bersama dan citra darah, tetapi tidak secara eksplisit menambahkan konsep “kesalahan darah” yang hanya tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Seandainya” menandai kondisi masa lampau yang berlawanan dengan kenyataan, sedangkan “ikut ambil bagian bersama mereka” menyampaikan nuansa partisipasi dan keterlibatan tanpa menguatkannya secara berlebihan menjadi “kaki tangan.”
