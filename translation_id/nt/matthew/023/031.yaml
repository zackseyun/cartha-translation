id: MAT.23.31
reference: Matthew 23:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: id
  text: Dengan demikian, kalian bersaksi melawan diri kalian sendiri bahwa kalian adalah anak-anak dari mereka yang membunuh para nabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian bersaksi kepada diri kalian sendiri.” Ungkapan Yunani dapat diterjemahkan lebih harfiah demikian, tetapi dalam konteks ini kesaksian mereka justru memberatkan mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Dengan demikian
  rationale: Menandai kesimpulan atau akibat dari perkataan sebelumnya dengan ungkapan Indonesia yang wajar dan tetap tegas.
- source_word: μαρτυρεῖτε
  choice: kalian bersaksi
  rationale: Mempertahankan nuansa kesaksian yang dapat bernada yuridis dalam konteks teguran ini.
- source_word: ἑαυτοῖς
  choice: melawan diri kalian sendiri
  rationale: Secara harfiah datif ini dapat berarti 'kepada diri kalian sendiri', tetapi dalam konteks kesaksian mereka justru memberatkan mereka; pilihan utama menyampaikan daya tuduh tersebut sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian, bukan alasan kausal.
- source_word: υἱοί
  choice: anak-anak
  rationale: Dalam bahasa Indonesia, 'anak-anak dari' mempertahankan gambaran hubungan keluarga dan dapat mencakup keturunan sekaligus keselarasan moral; 'putra-putra' terdengar kurang alami dalam teguran langsung modern.
- source_word: τῶν φονευσάντων
  choice: dari mereka yang membunuh
  rationale: Partisip aoris mengidentifikasi para pendahulu melalui tindakan pembunuhan yang telah mereka lakukan; 'membunuh' secara alami menyampaikan tindakan salah terhadap para nabi.
- source_word: τοὺς προφήτας
  choice: para nabi
  rationale: '''Para nabi'' merupakan padanan Indonesia yang alami untuk kelompok nabi yang dikenal dalam sejarah Israel.'
theological_decisions:
- issue: Apakah υἱοί harus diterjemahkan dengan bentuk maskulin harfiah atau menurut fungsi idiomatisnya sebagai keturunan dan penerus moral.
  choice: anak-anak
  alternative: putra-putra; keturunan
  rationale: Bahasa Indonesia lazim memakai 'anak-anak' tanpa membedakan gender, dan ungkapan ini tetap mempertahankan metafora keluarga serta ketegangan antara garis keturunan dan keselarasan moral. 'Keturunan' akan mempersempit daya metaforis, sedangkan 'putra-putra' kurang alami dalam konteks ini.
- issue: Apakah ἑαυτοῖς menyatakan kesaksian 'kepada' diri sendiri atau kesaksian yang memberatkan diri sendiri.
  choice: melawan diri kalian sendiri
  alternative: kepada diri kalian sendiri
  rationale: Bentuk datif memungkinkan terjemahan lebih harfiah 'kepada diri kalian sendiri', tetapi konteks menunjukkan bahwa pengakuan mereka menjadi bukti yang memberatkan. Alternatif literal dipertahankan dalam catatan kaki agar ambiguitas gramatikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk mempertahankan bahwa teguran ditujukan kepada lebih dari satu orang. Diksi dibuat lugas, bermartabat, dan mudah dipahami; catatan kaki menjaga alternatif harfiah dari konstruksi Yunani.
