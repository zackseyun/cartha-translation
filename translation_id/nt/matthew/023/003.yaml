revisions:
- from: Karena itu, lakukan dan peganglah segala sesuatu yang mereka katakan kepadamu. Namun, jangan lakukan seperti perbuatan mereka,[a] sebab mereka berkata-kata, tetapi tidak melakukannya.
  to: Karena itu, lakukanlah dan peganglah segala sesuatu yang mereka katakan kepadamu. Namun, janganlah bertindak menurut perbuatan mereka,[a] sebab mereka berkata, tetapi tidak melakukannya.
  rationale: The revision preserves the source’s comprehensive command, its distinction between ποιήσατε and τηρεῖτε, and the verbal contrast between saying and doing. It replaces an unnatural construction with idiomatic Indonesian while retaining the sense of conformity expressed by κατά. The footnote remains anchored to the prohibition and gives a natural alternative without making a doctrinal or contextual expansion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:12:19Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the comprehensive force of πάντα ὅσα ἐὰν, the inferential οὖν, and the contrast between what ‘they’ say and do. However, “jangan lakukan seperti perbuatan mereka” is not idiomatic Indonesian and does not clearly express acting in conformity with their deeds. “Berkata-kata” adds an iterative or talkative nuance not required by λέγουσιν, while the Greek’s implied contrast is naturally conveyed by ‘tetapi.’
  naturalness: 'A small revision improves fluency and clarity: use the standard idiom “bertindak menurut perbuatan mereka” for κατὰ τὰ ἔργα αὐτῶν, and “berkata” rather than “berkata-kata.” “Lakukanlah dan peganglah” retains the two imperatives and is understandable in a dignified biblical register.'
  terminology: No names or specialized theological terms occur. “Perbuatan” is appropriate for ἔργα. “Peganglah” suitably represents τηρεῖτε (‘keep/observe’) without narrowing it to mere obedience.
  issues:
  - severity: medium
    issue: “Jangan lakukan seperti perbuatan mereka” is awkward and semantically imprecise.
    rationale: The Greek prohibits action according to the pattern/standard of their deeds (κατὰ τὰ ἔργα αὐτῶν). Indonesian naturally expresses this as “janganlah bertindak menurut perbuatan mereka.”
  - severity: low
    issue: “Berkata-kata” is unnecessarily marked.
    rationale: λέγουσιν simply means ‘they say/speak.’ “Berkata-kata” can suggest habitual chatter or prolix speech, which is not specified in the source.
  revised_text: Karena itu, lakukanlah dan peganglah segala sesuatu yang mereka katakan kepadamu. Namun, janganlah bertindak menurut perbuatan mereka,[a] sebab mereka berkata, tetapi tidak melakukannya.
  revised_footnotes:
