id: MAT.23.3
reference: Matthew 23:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: id
  text: Karena itu, lakukanlah dan peganglah segala sesuatu yang mereka katakan kepadamu. Namun, janganlah bertindak menurut perbuatan mereka,[a] sebab mereka berkata, tetapi tidak melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jangan bertindak seperti mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Karena itu ... segala sesuatu yang
  rationale: πάντα bersama ὅσα ἐὰν membentuk ungkapan menyeluruh, sedangkan οὖν menyatakan kesimpulan dari konteks sebelumnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan cakupan totalnya.
- source_word: εἴπωσιν ὑμῖν
  choice: mereka katakan kepadamu
  rationale: Ungkapan ini menerjemahkan tindakan berkata kepada para pendengar tanpa memperluasnya menjadi 'mengajarkan' atau 'memerintahkan'.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: lakukan dan peganglah
  rationale: Dua imperatif tetap dibedakan. 'Lakukan' menyatakan pelaksanaan, sedangkan 'peganglah' mempertahankan nuansa menaati atau memelihara sesuatu yang disampaikan.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: Namun, jangan lakukan seperti perbuatan mereka
  rationale: κατά menyatakan kesesuaian dengan pola atau standar. Bentuk ini cukup alami dalam bahasa Indonesia serta mempertahankan kata 'lakukan' dan nomina 'perbuatan' sebagai gema ποιέω/ἔργα.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: sebab mereka berkata-kata, tetapi tidak melakukannya
  rationale: Terjemahan mempertahankan pertentangan tajam antara ucapan dan tindakan. 'Berkata-kata' menyatakan kebiasaan berbicara, dan pronomina '-nya' membuat klausa tersebut wajar dalam bahasa Indonesia tanpa menentukan objek yang tidak dinyatakan secara khusus.
theological_decisions:
- issue: Apakah kewenangan mengajar ahli-ahli Taurat dan orang-orang Farisi dari konteks sebelumnya perlu dibuat eksplisit
  choice: Objek tetap implisit; ayat hanya mengatakan apa yang mereka katakan kepada para pendengar.
  alternative: Memperluas menjadi 'segala sesuatu yang mereka ajarkan kepadamu' atau 'yang mereka katakan dari kursi Musa.'
  rationale: Konteks sebelumnya menjelaskan siapa yang dimaksud, tetapi ayat ini tidak mengulangi rincian tersebut. Ekspansi dapat memasukkan penafsiran ke dalam teks.
- issue: Apakah pengulangan kata kerja tindakan perlu diperhalus
  choice: Pertahankan gema 'lakukan ... perbuatan ... lakukan ... melakukannya.'
  alternative: Gunakan variasi seperti 'taati ... jangan meniru ... tidak mempraktikkannya.'
  rationale: Pengulangan keluarga kata ποιέω/ἔργα menajamkan tuduhan kemunafikan dan sebaiknya tidak dihilangkan demi gaya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk 'kepadamu' dipakai untuk sapaan jamak kolektif dalam wacana Alkitabiah; tanda baca membagi perintah positif dan larangan agar alurnya jelas.
