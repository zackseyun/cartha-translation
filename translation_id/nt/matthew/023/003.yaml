    text: 'Atau: “jangan bertindak seperti mereka.”'
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s comprehensive command, its distinction between ποιήσατε and τηρεῖτε, and the verbal contrast between saying and doing. It replaces an unnatural construction with idiomatic Indonesian while retaining the sense of conformity expressed by κατά. The footnote remains anchored to the prohibition and gives a natural alternative without making a doctrinal or contextual expansion.
