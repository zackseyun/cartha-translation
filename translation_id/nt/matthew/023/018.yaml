base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: id
  text: Dan, “Siapa pun yang bersumpah demi mezbah, sumpah itu tidak berarti apa-apa[a]; tetapi siapa pun yang bersumpah demi persembahan yang ada di atasnya, ia terikat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, menurut ajaran yang sedang dikecam Yesus, sumpah demi mezbah dianggap tidak berlaku, sedangkan sumpah demi persembahan di atasnya dianggap mengikat.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: Dan
  rationale: Penghubung sederhana ini melanjutkan rangkaian ajaran yang sedang dikutip dan dikecam Yesus.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Siapa pun yang bersumpah ... tetapi siapa pun yang bersumpah
  rationale: Konstruksi ὅς + ἄν dengan subjungtif aoris menyatakan keadaan umum tak tentu; bentuk ini alami dan mempertahankan cakupan generiknya.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: demi mezbah
  rationale: Dalam ungkapan sumpah, ἐν menunjuk pada hal yang dijadikan dasar sumpah; 'demi' merupakan ungkapan baku bahasa Indonesia.
- source_word: θυσιαστήριον
  choice: mezbah
  rationale: Istilah yang tepat dan lazim untuk tempat persembahan korban dalam konteks Bait Allah.
- source_word: οὐδέν ἐστιν
  choice: sumpah itu tidak berarti apa-apa
  rationale: Subjek tersirat diperjelas secukupnya agar alami dalam bahasa Indonesia, sambil mempertahankan maksud bahwa sumpah tersebut dianggap tidak berlaku.
- source_word: ἐν τῷ δώρῳ
  choice: demi persembahan
  rationale: Dalam konteks Bait Allah, δῶρον adalah pemberian yang dipersembahkan kepada Allah; 'persembahan' lebih langsung dipahami daripada 'pemberian'.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: yang ada di atasnya
  rationale: Menyatakan posisi persembahan di atas mezbah dan mempertahankan rujukan pronominal kepada mezbah.
- source_word: ὀφείλει
  choice: ia terikat oleh sumpahnya
  rationale: Dalam konteks sumpah, kata ini menyatakan kewajiban yang mengikat. Ungkapan ini alami dalam bahasa Indonesia dan membuat implikasi idiom sumpah dapat dipahami.
theological_decisions:
- issue: Objek kewajiban yang tidak dinyatakan dalam ὀφείλει
  choice: ia terikat oleh sumpahnya
  alternative: ia berkewajiban
  rationale: Bahasa Yunani tidak menyebut objek kewajiban. Namun, 'ia berkewajiban' terasa menggantung dalam bahasa Indonesia; rumusan terpilih mengungkapkan implikasi yang sudah jelas dari konteks sumpah tanpa menentukan tindakan pemenuhannya secara lebih rinci.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'mezbah' dipertahankan karena merupakan istilah Alkitab yang mapan; 'persembahan' dipilih agar konteks ibadah di Bait Allah langsung jelas.
