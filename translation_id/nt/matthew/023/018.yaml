  terminology: «Mezbah» tepat untuk θυσιαστήριον dalam konteks Bait Allah. «Persembahan» merupakan padanan yang wajar bagi δῶρον dalam konteks ini dan «yang ada di atasnya» jelas merujuk kepada mezbah.
