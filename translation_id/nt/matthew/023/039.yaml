id: MAT.23.39
reference: Matthew 23:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: id
  text: 'Sebab Aku berkata kepadamu: Mulai sekarang kamu pasti tidak akan melihat Aku sampai kamu berkata[a], “Diberkatilah Dia yang datang dalam nama Tuhan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan atau acuan kepada Mazmur 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepadamu
  rationale: Mempertahankan daya penjelas γάρ dan pola sapaan langsung λέγω ... ὑμῖν dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: οὐ μή ... ἴδητε
  choice: kamu pasti tidak akan melihat Aku
  rationale: οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang tegas; 'pasti tidak akan' menyampaikan penekanan itu tanpa mengubahnya menjadi 'tidak pernah'.
- source_word: ἀπ’ ἄρτι
  choice: mulai sekarang
  rationale: Menunjukkan titik awal waktu pada saat pernyataan itu diucapkan.
- source_word: ἕως ἂν εἴπητε
  choice: sampai kamu berkata
  rationale: Menyampaikan batas waktu atau keadaan pada masa depan tanpa menentukan peristiwa yang dimaksud.
- source_word: Εὐλογημένος
  choice: Diberkatilah
  rationale: Bentuk ini sesuai dengan seruan berkat dalam kutipan Mazmur dan mempertahankan nuansa liturgis tanpa menjadi usang.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang datang
  rationale: Mewakili partisipel berartikel secara alami; huruf kapital pada 'Dia' sesuai karena dalam konteks ini rujukannya adalah Yesus, tetapi tidak menambahkan gelar khusus.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Mempertahankan bentuk frasa Yunani serta gema Kitab Suci; κύριος diterjemahkan 'Tuhan'.
theological_decisions:
- issue: Makna saat mereka akan kembali melihat Yesus dan mengucapkan berkat
  choice: Membiarkan waktu dan peristiwa yang dimaksud tetap tidak ditentukan, sebagaimana teks Yunani.
  alternative: Menetapkannya secara khusus sebagai kedatangan kedua, pertobatan Israel pada masa depan, atau peristiwa historis tertentu.
  rationale: Ayat ini menyatakan ketidakhadiran sampai adanya pengakuan yang dikutip, tetapi tidak secara eksplisit menetapkan peristiwa atau kronologinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal/jamak pada 'kamu' tetap ambigu seperti pemakaian Indonesia biasa, sedangkan ὑμῖν dan verba-verba terkait dalam bahasa Yunani berbentuk jamak. Penekanan οὐ μή dimasukkan ke dalam teks utama sehingga tidak memerlukan catatan varian.
