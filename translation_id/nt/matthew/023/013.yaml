revisions:
- from: Namun, celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menutup Kerajaan Surga[a] di depan orang-orang. Kalian sendiri tidak masuk, dan kalian tidak membiarkan orang-orang yang sedang masuk[b] itu masuk.
  to: Namun, celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menutup Kerajaan Surga[a] di hadapan orang-orang; sebab kalian sendiri tidak masuk dan tidak mengizinkan orang-orang yang sedang masuk[b] untuk masuk.
  rationale: Menambahkan “sebab” pada klausa terakhir untuk menerjemahkan γάρ, memperlancar pengulangan “masuk ... masuk” dengan konstruksi “mengizinkan ... untuk masuk,” dan memperbaiki catatan alternatif agar menjelaskan plural Yunani tanpa menghasilkan bentuk Indonesia yang tidak wajar.
