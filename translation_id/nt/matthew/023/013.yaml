review_pass:
  verdict: revise
  source_fidelity: Teks utama pada dasarnya mencerminkan semua unsur Yunani, termasuk kecaman οὐαί, kelompok yang disapa, metafora menutup kerajaan, dan pengulangan partisipel εἰσερχομένους dengan infinitif εἰσελθεῖν. Namun, γάρ pada klausa terakhir perlu dinyatakan (“sebab”), karena klausa itu memberi alasan/penjelasan lanjutan. Catatan a juga tidak tepat menyebut bentuk literal Indonesia “Kerajaan surga-surga”; plural Yunani tidak sebaiknya dialihkan demikian.
  naturalness: “Yang sedang masuk itu masuk” mempertahankan bentuk sumber tetapi terdengar berat dalam bahasa Indonesia. “Tidak mengizinkan ... untuk masuk” tetap eksplisit dan lebih lancar. “Di hadapan orang-orang” mempertahankan metafora spasial tanpa menambahkan objek seperti “pintu” atau “akses.”
  terminology: “Ahli-ahli Taurat,” “orang-orang Farisi,” “orang-orang munafik,” dan “Kerajaan Surga” sesuai dengan pemakaian Indonesia baku dan register kecaman profetis. “Kalian” secara tepat menyatakan jamak orang kedua.
