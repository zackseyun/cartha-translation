id: MAT.23.13
reference: Matthew 23:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: id
  text: Namun, celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menutup Kerajaan Surga[a] di hadapan orang-orang; sebab kalian sendiri tidak masuk dan tidak mengizinkan orang-orang yang sedang masuk[b] untuk masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kerajaan Langit.” Secara harfiah, ungkapan Yunaninya memakai bentuk jamak “langit.” Matius secara khas memakai ungkapan ini, sedangkan di tempat lain dapat ditemukan “Kerajaan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang berusaha masuk.” Partisipel Yunani dapat menunjuk kepada orang-orang yang sedang dalam proses masuk atau yang hendak masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: celakalah
  rationale: Mempertahankan daya kecaman profetis, bukan sekadar ungkapan kesedihan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras ringan secara alami dalam bahasa Indonesia.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Istilah baku dan jelas dalam konteks Injil untuk para pakar serta penafsir hukum Taurat.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku bagi kelompok tersebut dalam bahasa Indonesia.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Menyampaikan kepura-puraan moral-keagamaan yang dikecam dalam konteks ini.
- source_word: κλείετε
  choice: menutup
  rationale: Mempertahankan metafora tindakan menghalangi akses menuju kerajaan.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan Indonesia yang lazim bagi ungkapan khas Matius tanpa menciptakan pembedaan teologis dari 'Kerajaan Allah'.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di depan orang-orang
  rationale: Mempertahankan gambaran bahwa akses ditutup tepat di hadapan mereka.
- source_word: ἀνθρώπων
  choice: orang-orang
  rationale: Merujuk secara generik kepada manusia, bukan hanya laki-laki.
- source_word: εἰσέρχεσθε
  choice: masuk
  rationale: Ringkas dan sesuai dengan metafora memasuki kerajaan.
- source_word: τοὺς εἰσερχομένους
  choice: orang-orang yang sedang masuk
  rationale: Mempertahankan aspek kini dari partisipel dan tidak membatasi makna pada usaha yang gagal.
- source_word: ἀφίετε
  choice: membiarkan
  rationale: Dalam konstruksi ini berarti mengizinkan atau tidak menghalangi; 'membiarkan' alami dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan khas Matius βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  alternative: kerajaan surga-surga
  rationale: Padanan tunggal merupakan ungkapan Indonesia yang alami; bentuk jamak Yunani tidak perlu dipakai untuk mengimpor pembedaan teologis dari 'Kerajaan Allah'.
- issue: Aspek τοὺς εἰσερχομένους
  choice: orang-orang yang sedang masuk
  alternative: orang-orang yang berusaha masuk
  rationale: Teks dapat menggambarkan proses masuk atau usaha menuju masuk. Teks utama mempertahankan bentuk progresif, sedangkan kemungkinan nuansa usaha dicatat dalam catatan kaki.
- issue: Pengulangan εἰσερχομένους ... εἰσελθεῖν
  choice: yang sedang masuk itu masuk
  alternative: membiarkan masuk orang-orang yang sedang masuk
  rationale: Pengulangan dipertahankan agar hubungan eksplisit kedua bentuk verba Yunani tetap terlihat, meskipun sedikit repetitif dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai agar pembedaan bentuk jamak ὑμῖν/ὑμεῖς tetap jelas; vokatif diterjemahkan dengan 'hai' untuk mempertahankan tekanan kecaman langsung.
