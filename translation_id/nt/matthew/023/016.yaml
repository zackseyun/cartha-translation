  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: id
  text: Celakalah kalian, para penuntun buta! Kalian berkata, ‘Siapa yang bersumpah demi Bait Allah,[a] sumpah itu tidak berarti apa-apa;[b] tetapi siapa yang bersumpah demi emas Bait Allah, ia terikat oleh sumpahnya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “bersumpah di dalam Bait Allah.” Dalam konteks ini, ungkapan tersebut menunjuk pada Bait Allah sebagai dasar sumpah.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “itu bukan apa-apa,” yakni sumpah semacam itu dianggap tidak mengikat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Celakalah kalian
  rationale: Ungkapan kecaman profetis yang kuat dan wajar dalam bahasa Indonesia; bentuk jamak ‘kalian’ menyampaikan ὑμῖν secara jelas.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: para penuntun buta
  rationale: Mempertahankan metafora orang yang menuntun orang lain meskipun dirinya buta; ‘penuntun’ lebih langsung daripada ‘pemimpin’.
- source_word: οἱ λέγοντες
  choice: Kalian berkata
  rationale: Partisipel artikular menjelaskan pihak yang baru disapa; dijadikan kalimat langsung agar alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Siapa yang bersumpah
  rationale: Konstruksi relatif dengan ἄν dan subjungtif menyatakan keadaan umum yang tidak tentu; bentuk Indonesia ini ringkas dan alami.
- source_word: ἐν τῷ ναῷ
  choice: demi Bait Allah
  rationale: Dalam konteks rumusan sumpah, ἐν berfungsi sebagai penanda sesuatu yang dijadikan dasar atau saksi sumpah. ‘Demi’ merupakan ungkapan sumpah yang idiomatis.
- source_word: οὐδέν ἐστιν
  choice: sumpah itu tidak berarti apa-apa
  rationale: Ungkapan Yunani harfiah ‘itu bukan apa-apa’ bersifat eliptis; pilihan ini menjelaskan bahwa sumpah tersebut dianggap tidak mengikat tanpa menambahkan gagasan teologis lain.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: emas Bait Allah
  rationale: Menyampaikan hubungan genitif secara alami dan mempertahankan pertentangan antara Bait Allah dan emasnya.
- source_word: ὀφείλει
  choice: ia terikat oleh sumpahnya
  rationale: Dalam konteks sumpah, verba ini berarti berkewajiban atau terikat. Pelengkap yang tersirat dijelaskan agar maksud hukumnya dapat dipahami pembaca modern.
theological_decisions:
- issue: Bahasa sumpah yang eliptis dan kewajiban yang tersirat
  choice: Kedua ungkapan eliptis dijelaskan sebagai ‘sumpah itu tidak berarti apa-apa’ dan ‘ia terikat oleh sumpahnya.’
  alternative: 'Mempertahankan bentuk lebih harfiah: ‘itu bukan apa-apa ... ia berutang/berkewajiban.’'
  rationale: Ayat ini mengecam pembedaan kasuistis antara sumpah yang dianggap tidak mengikat dan yang dianggap mengikat. Penjelasan terbatas ini menyampaikan kontras yang tersirat dalam bahasa Yunani tanpa menentukan persoalan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada kecaman yang tegas dan bermartabat. ‘Bait Allah’ dipilih sebagai istilah yang umum dan jelas untuk ναός dalam konteks ini. Tanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
