  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: id
  text: Dan kamu, penuhilah takaran nenek moyangmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “genapilah seluruh takaran dosa nenek moyangmu.” Secara harfiah, bahasa Yunani berbunyi “penuhilah takaran nenek moyangmu,” sebuah metafora tentang kesalahan yang terus menumpuk hingga mencapai batasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung yang melanjutkan kecaman dari ayat sebelumnya.
- source_word: ὑμεῖς
  choice: kamu
  rationale: Pronomina eksplisit dalam bahasa Yunani memberi penekanan. Bahasa Indonesia tidak membedakan bentuk tunggal dan jamak di sini, tetapi konteks menunjukkan sapaan kepada kelompok.
- source_word: πληρώσατε
  choice: penuhilah
  rationale: Bentuk aorist imperatif orang kedua jamak dipertahankan sebagai perintah. Pilihan ini juga menjaga metafora tentang membawa suatu takaran sampai penuh.
- source_word: τὸ μέτρον
  choice: takaran
  rationale: Menjaga metafora sumber mengenai jumlah yang terus terkumpul hingga mencapai batasnya.
- source_word: τῶν πατέρων ὑμῶν
  choice: nenek moyangmu
  rationale: Dalam konteks ini πατέρων menunjuk kepada para pendahulu leluhur, bukan hanya ayah biologis. 'Nenek moyang' alami dalam bahasa Indonesia dan mempertahankan hubungan antargenerasi dalam kecaman tersebut.
theological_decisions:
- issue: 'Daya ujar perkataan Yesus: perintah atau ramalan ironis'
  choice: 'Perintah dengan daya ironis dan penghakiman: “penuhilah takaran nenek moyangmu.”'
  alternative: “Kamu sedang/akan memenuhi takaran nenek moyangmu.”
  rationale: Morfologi πληρώσατε adalah imperatif aorist aktif orang kedua jamak. Terjemahan mempertahankan bentuk perintah sambil membiarkan konteks menyampaikan ironi dan kecamannya, bukan mengubahnya menjadi ramalan biasa.
- issue: Isi yang memenuhi 'takaran'
  choice: Tidak menambahkan kata 'dosa' dalam teks utama.
  alternative: “Penuhilah seluruh takaran dosa nenek moyangmu.”
  rationale: Kata 'dosa' tersirat oleh konteks tetapi tidak dinyatakan dalam bahasa Yunani. Metafora dan ketegangan teks dipertahankan dalam teks utama, sedangkan penjelasannya diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Penuhilah takaran' sengaja mempertahankan metafora sumber; 'nenek moyangmu' lebih alami dan tepat secara kontekstual daripada 'bapak-bapakmu'.
