  terminology: Pilihan “penuhilah,” “takaran,” dan “nenek moyangmu” konsisten dengan bentuk imperatif, metafora ukuran yang mencapai kepenuhannya, dan rujukan kepada para pendahulu. Catatan kaki dengan tepat menandai penambahan “dosa” sebagai penjelasan/alternatif, bukan sebagai bagian teks utama.
