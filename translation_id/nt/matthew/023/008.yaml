  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: id
  text: Tetapi kamu jangan disebut “Rabi”[a], sebab guru kalian hanya satu, dan kamu semua adalah saudara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Guru.” “Rabi” adalah gelar Yahudi yang berarti guru. Transliterasi ini mempertahankan latar Yahudi dan membedakannya dari kata “guru” yang muncul kemudian dalam ayat.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ἀδελφοί berbentuk jamak maskulin. Dalam konteks ini, kata tersebut dapat merujuk secara kolektif kepada sesama murid.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: jangan disebut
  rationale: Bentuk pasif dengan μή menyampaikan larangan. “Jangan disebut” mempertahankan bentuk pasif dan terdengar alami dalam bahasa Indonesia.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Transliterasi gelar ini mempertahankan latar Yahudi dan membedakannya dari διδάσκαλος (“guru”) yang muncul kemudian dalam ayat.
- source_word: εἷς
  choice: satu
  rationale: Padanan langsung ini mempertahankan penekanan pada jumlah tunggal tanpa menambahkan kata “hanya,” meskipun makna eksklusif tersirat oleh konteks.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: Gurumu
  rationale: Bentuk ini mengungkapkan hubungan yang dinyatakan oleh ὑμῶν secara ringkas dan wajar. Huruf kapital dipakai karena dalam konteks ini gelar tunggal tersebut menunjuk kepada pribadi tertentu, tanpa menyebut identitas yang tidak dinyatakan dalam ayat.
- source_word: πάντες δὲ ὑμεῖς
  choice: dan kamu semua
  rationale: Susunan ini mempertahankan cakupan kolektif dan penekanan bahwa seluruh kelompok memiliki kedudukan yang sama.
- source_word: ἀδελφοί
  choice: saudara
  rationale: “Saudara” mempertahankan metafora kekeluargaan dan dapat dipakai secara kolektif dalam bahasa Indonesia; catatan kaki menjelaskan bentuk maskulin dalam bahasa Yunani dan cakupan kontekstualnya.
theological_decisions:
- issue: Apakah larangan Yesus merupakan larangan mutlak atas semua gelar manusia atau teguran terhadap pencarian status di kalangan murid
  choice: Terjemahan mempertahankan larangan langsung sebagaimana dinyatakan dalam ayat tanpa memperluas penerapannya menjadi kaidah doktrinal mutlak.
  alternative: Menafsirkannya sebagai larangan mutlak terhadap setiap penggunaan gelar “Rabi” atau gelar sejenis; atau mempersempitnya hanya sebagai kecaman terhadap ambisi munafik.
  rationale: Teks Yunani menyatakan larangan beserta alasannya, tetapi tidak merinci semua penerapannya pada masa kemudian. Karena itu, ketegangan penafsirannya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu semua” dipilih agar sapaan jamak eksplisit tanpa memakai bentuk regional atau terlalu percakapan. Struktur kalimat tetap dekat dengan teks Yunani, tetapi mengalir alami dalam bahasa Indonesia.
