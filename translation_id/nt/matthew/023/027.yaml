id: MAT.23.27
reference: Matthew 23:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: id
  text: Celakalah kalian, para ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menyerupai makam yang dilapisi kapur putih[a], yang dari luar tampak indah, tetapi di dalam penuh dengan tulang-belulang orang mati dan segala kenajisan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “makam yang dilabur dengan kapur.”
    reason: Alternatif ini menjelaskan bahwa makam tersebut diberi lapisan kapur putih, bukan sekadar dicat dengan bahan modern.
  - marker: b
    text: Dalam konteks ini, “kenajisan” dapat mencakup ketidakmurnian ritual maupun keburukan moral.
    reason: Catatan budaya dan teologis ini mempertahankan keluasan makna istilah Yunani tanpa membatasinya pada salah satu pengertian.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Celakalah
  rationale: Mempertahankan daya kecaman dan penghakiman profetis, bukan sekadar ungkapan kesedihan.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Sebutan Indonesia yang mapan dan mudah dipahami bagi golongan pakar kitab suci dan hukum Yahudi ini.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Transliterasi nama golongan yang sudah lazim dalam bahasa Indonesia.
- source_word: ὑποκριταί
  choice: hai orang-orang munafik
  rationale: Menyampaikan sapaan langsung yang mengecam kepura-puraan moral dan keagamaan.
- source_word: παρομοιάζετε
  choice: kalian menyerupai
  rationale: Mempertahankan perbandingan langsung dengan ungkapan Indonesia yang alami.
- source_word: τάφοις κεκονιαμένοις
  choice: makam yang dikapur putih
  rationale: Menggambarkan tempat penguburan yang dilapisi kapur putih secara konkret dan sesuai latar budaya.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: bagian luarnya ... tetapi bagian dalamnya
  rationale: Menghadirkan kontras lahiriah dan batiniah secara jelas serta wajar dalam bahasa Indonesia modern.
- source_word: φαίνονται ὡραῖοι
  choice: tampak indah
  rationale: Menjaga penekanan pada penampilan yang terlihat, bukan keadaan sebenarnya.
- source_word: γέμουσιν
  choice: penuh dengan
  rationale: Padanan idiomatis yang mempertahankan makna dan kala kini.
- source_word: ὀστέων νεκρῶν
  choice: tulang-belulang orang mati
  rationale: Ungkapan alami yang jelas merujuk pada tulang manusia yang telah mati.
- source_word: πάσης ἀκαθαρσίας
  choice: segala kenajisan
  rationale: Padanan luas yang tidak membatasi makna pada ketidakmurnian ritual ataupun keburukan moral saja.
theological_decisions:
- issue: Cakupan makna ἀκαθαρσία dalam metafora makam
  choice: segala kenajisan
  alternative: kenajisan ritual saja; keburukan moral saja
  rationale: Makam membangkitkan gagasan kenajisan ritual dalam konteks Yahudi, sedangkan kecaman Yesus juga menunjuk pada keburukan batin. Terjemahan luas mempertahankan kedua kemungkinan dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada kecaman yang tegas dan bermartabat. Pronomina “kalian” dipakai agar sapaan jamak Yunani tampak jelas. Susunan kalimat dibagi setelah gambaran makam supaya kontras bagian luar dan bagian dalam mudah dipahami.
