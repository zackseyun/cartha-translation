  naturalness: '"Bagian luarnya ... bagian dalamnya" setelah "makam" dalam bentuk jamak terasa agak kaku dan kurang langsung. Bentuk "yang dari luar ... tetapi di dalam ..." lebih alami sambil menjaga kontras retoris μὲν ... δέ. "Dilapisi kapur putih" juga lebih jelas dan idiomatis daripada "dikapur putih."'
  terminology: '"Ahli Taurat," "orang-orang Farisi," "munafik," dan "kenajisan" tepat untuk register baku dan mempertahankan istilah penting. Catatan untuk "kenajisan" dengan tepat tidak mempersempitnya hanya menjadi kenajisan ritual atau keburukan moral.'
