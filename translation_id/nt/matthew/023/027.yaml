  to: Celakalah kalian, para ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian menyerupai makam yang dilapisi kapur putih[a], yang dari luar tampak indah, tetapi di dalam penuh dengan tulang-belulang orang mati dan segala kenajisan[b].
