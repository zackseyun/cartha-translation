  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: id
  text: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian melahap rumah-rumah para janda dan, sebagai kedok, berdoa panjang-panjang. Karena itu, kalian akan menerima hukuman yang lebih berat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani tertua, termasuk Kodeks Sinaitikus dan Vatikanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Namun, ayat ini terdapat dalam tradisi mayoritas Bizantin, Latin Kuno, Vulgata, dan Siria. Kemungkinan besar ayat ini ditambahkan oleh penyalin kemudian untuk menyelaraskannya dengan pernyataan serupa dalam Markus 12:40 dan Lukas 20:47. Naskah-naskah yang memuatnya berbeda-beda dalam menempatkannya sebelum atau sesudah ayat 13.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: kalian melahap harta rumah tangga para janda
  rationale: Ungkapan harfiah 'melahap rumah-rumah para janda' bersifat metaforis. 'Harta rumah tangga' mempertahankan cakupan οἰκίας yang dapat menunjuk pada rumah beserta milik atau penghidupan keluarga, sedangkan 'melahap' menyampaikan eksploitasi yang rakus dan menghancurkan.
- source_word: προφάσει
  choice: sebagai kedok
  rationale: Menunjukkan alasan atau penampilan palsu yang dipakai untuk menutupi maksud sebenarnya; 'kedok' alami dalam bahasa Indonesia modern dan menjaga nada kecaman.
- source_word: μακρὰ προσευχόμενοι
  choice: mengucapkan doa yang panjang-panjang
  rationale: Menyampaikan tindakan berdoa panjang lebar sebagai pertunjukan, tanpa menambahkan keterangan tentang tempat atau cara yang tidak terdapat dalam teks Yunani.
- source_word: περισσότερον κρίμα
  choice: hukuman yang lebih berat
  rationale: Dalam konteks ini κρίμα menunjuk pada putusan penghukuman, dan περισσότερον menyatakan tingkat yang lebih besar atau berat. Pilihan ini lebih alami daripada 'penghakiman yang lebih besar' dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan doa panjang dengan eksploitasi para janda
  choice: Doa panjang dipahami sebagai kedok bagi tindakan eksploitatif.
  alternative: Doa panjang dipahami hanya sebagai tindakan kesalehan yang berdiri sendiri dan turut dikecam.
  rationale: Bentuk προφάσει secara langsung menggambarkan doa panjang sebagai dalih atau penutup, tetapi terjemahan tidak menjelaskan lebih jauh mekanisme eksploitasi yang tidak dinyatakan oleh teks.
- issue: Makna κρίμα
  choice: hukuman
  alternative: penghakiman atau putusan
  rationale: Konteks οὐαί dan perbuatan yang dikecam menunjukkan putusan yang merugikan atau penghukuman, sambil tidak menentukan bentuk atau waktu hukuman tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk ὑμῖν, sesuai teguran langsung kepada kelompok yang disebut. Nada dibuat keras dan bermartabat. 'Ahli-ahli Taurat' dipertahankan sebagai istilah umum yang dikenal pembaca Alkitab Indonesia; 'orang-orang munafik' menerjemahkan vokatif ὑποκριταί secara langsung. Penanda catatan ditempatkan pada akhir ayat karena catatan menyangkut keseluruhan keberadaan dan posisi ayat.
