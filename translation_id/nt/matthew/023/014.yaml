  naturalness: '"Melahap rumah-rumah para janda" adalah metafora keras yang wajar dalam register kecaman kenabian/Yesus dan lebih setia daripada parafrasa. "Berdoa panjang-panjang" lebih langsung dan alami daripada "mengucapkan doa yang panjang-panjang."'
  terminology: '"Ahli-ahli Taurat," "orang-orang Farisi," "orang-orang munafik," "kedok," dan "hukuman yang lebih berat" sesuai dengan register Alkitab Indonesia modern dan dengan daya kecaman teks. Catatan tekstual dipertahankan, dengan "kemungkinan besar" untuk mencerminkan penilaian audit bahasa Inggris bahwa ayat ini kemungkinan ditambahkan kemudian.'
