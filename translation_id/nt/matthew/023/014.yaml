  to: Celakalah kalian, ahli-ahli Taurat dan orang-orang Farisi, hai orang-orang munafik! Sebab kalian melahap rumah-rumah para janda dan, sebagai kedok, berdoa panjang-panjang. Karena itu, kalian akan menerima hukuman yang lebih berat.[a]
  rationale: Revisi mempertahankan metafora Yunani "melahap rumah-rumah para janda" tanpa menambahkan "harta," mengganti ungkapan doa dengan bentuk yang lebih langsung, dan menyelaraskan tingkat kepastian catatan tekstual dengan audit bahasa Inggris. Penanda catatan tetap ditempatkan pada akhir ayat karena mencakup keberadaan dan posisi ayat secara keseluruhan.
