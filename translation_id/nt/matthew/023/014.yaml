    rationale: οἰκίας berarti "rumah-rumah"; dalam konteks ini metafora tersebut memang mengisyaratkan perampasan penghidupan atau milik, tetapi terjemahan utama sebaiknya tidak mengganti citra sumber dengan penjelasan interpretatif.
  - severity: low
