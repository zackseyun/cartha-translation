id: MAT.23.22
reference: Matthew 23:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: id
  text: Dan siapa pun yang bersumpah demi surga bersumpah demi takhta Allah dan demi Dia yang duduk di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang sedang duduk di atasnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: siapa pun yang bersumpah
  rationale: Partisipel aoris berartikel ini berfungsi secara substantival dan generik. Ungkapan ini menyatakan prinsip umum, bukan terutama tindakan pada masa lampau.
- source_word: ἐν
  choice: demi
  rationale: Dalam rumusan sumpah, ἐν dengan datif bermakna sarana atau pihak yang dijadikan jaminan sumpah; 'demi' merupakan padanan idiomatis yang alami dalam bahasa Indonesia.
- source_word: οὐρανῷ
  choice: surga
  rationale: Dalam konteks religius Yahudi ini, οὐρανός menunjuk pada surga, terlebih karena langsung dikaitkan dengan takhta Allah, bukan sekadar langit fisik.
- source_word: ὀμνύει
  choice: bersumpah
  rationale: Indikatif kini menyatakan kebenaran umum; bentuk 'bersumpah' menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: takhta Allah
  rationale: Padanan ini mempertahankan hubungan genitif dan gaya khidmat teks Yunani secara alami.
- source_word: τῷ καθημένῳ
  choice: Dia yang duduk
  rationale: Partisipel substantival κάθημαι menunjuk kepada sosok yang duduk atau bertakhta. Kapitalisasi 'Dia' menandai rujukan yang jelas kepada Allah tanpa mengganti ungkapan tidak langsung dalam teks sumber.
- source_word: ἐπάνω αὐτοῦ
  choice: di atasnya
  rationale: Dalam konteks takhta, frasa ini menggambarkan Dia yang duduk di atas takhta tersebut. Bentuk '-nya' secara alami merujuk kembali kepada 'takhta Allah'.
theological_decisions:
- issue: Rujukan 'Dia yang duduk di atasnya'
  choice: Ungkapan tidak langsung yang penuh hormat bagi Allah yang bertakhta di surga
  alternative: Ungkapan lebih tak tentu, 'orang yang duduk di atasnya'
  rationale: Frasa terdekat, 'takhta Allah', memperjelas rujukannya. Terjemahan mempertahankan ungkapan tidak langsung dari bahasa Yunani dan tidak menggantinya dengan 'Allah' dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Demi' dipakai secara konsisten untuk formula sumpah; 'surga' dipilih sesuai konteks religius; susunan kalimat mempertahankan pengulangan retoris teks sumber.
