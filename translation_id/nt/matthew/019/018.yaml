  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: id
  text: Orang itu berkata kepada-Nya, “Yang mana?” Yesus berkata, “Jangan membunuh, jangan berzina, jangan mencuri, jangan bersaksi dusta,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Orang itu berkata kepada-Nya
  rationale: Subjek yang tersirat dijelaskan secara alami dari konteks percakapan; bentuk kini historis Yunani diterjemahkan dengan bentuk naratif Indonesia.
- source_word: Ποίας
  choice: Yang mana?
  rationale: Mempertahankan pertanyaan ringkas yang merujuk kepada perintah-perintah yang disebut pada ayat sebelumnya.
- source_word: Τὸ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Artikel netral ini memperkenalkan isi perintah-perintah yang kemudian dikutip. Dalam bahasa Indonesia, fungsinya paling alami dinyatakan langsung melalui rangkaian kutipan, tanpa padanan kaku seperti “yang ini:” atau “yaitu:”.
- source_word: Οὐ φονεύσεις
  choice: Jangan membunuh
  rationale: φονεύω menunjuk pada tindakan membunuh manusia secara melawan hukum, bukan setiap tindakan mengambil nyawa; rumusan larangan yang lazim dan jelas dalam bahasa Indonesia.
- source_word: Οὐ μοιχεύσεις
  choice: jangan berzina
  rationale: μοιχεύω secara khusus berarti melakukan perzinaan; pilihan ini mempertahankan cakupan leksikalnya.
- source_word: Οὐ κλέψεις
  choice: jangan mencuri
  rationale: Padanan langsung dan alami untuk κλέπτω.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: jangan bersaksi dusta
  rationale: Mempertahankan unsur kesaksian dalam verba majemuk Yunani dan kaitannya dengan larangan Dekalog.
theological_decisions:
- issue: Cakupan larangan φονεύσεις
  choice: Jangan membunuh
  alternative: Jangan melakukan pembunuhan
  rationale: Pilihan singkat mengikuti bentuk perintah Dekalog dan tidak memperluas larangan menjadi istilah yang secara eksplisit mencakup semua pengambilan nyawa.
- issue: Fungsi artikel Τὸ sebelum daftar perintah
  choice: Daftar diperkenalkan langsung tanpa padanan tersendiri
  alternative: '“Yaitu: Jangan membunuh...”'
  rationale: Artikel tersebut menominalkan atau memperkenalkan kutipan perintah, tetapi tidak menuntut padanan leksikal terpisah. Menghilangkan padanan kaku menjaga makna sambil menghasilkan bahasa Indonesia yang wajar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan pronominal kepada Yesus memakai kapital kehormatan “-Nya”. Tanda koma penutup dipertahankan karena ayat ini berlanjut ke daftar perintah dalam ayat berikutnya.
