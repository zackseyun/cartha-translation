lexical_decisions:
- source_word: λέγει
  choice: Kata
  rationale: Bentuk kini historis Yunani dipertahankan secara alami dengan bentuk naratif Indonesia “kata”, tanpa harus memakai “berkata” yang lebih berat.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativus penerima ujaran dinyatakan dengan “kepada”; huruf kapital mengikuti kebiasaan penerbitan Alkitab Indonesia ketika pronomina merujuk kepada Yesus.
- source_word: ὁ νεανίσκος
  choice: orang muda itu
  rationale: Menerjemahkan νεανίσκος sebagai laki-laki muda yang sudah dikenal dalam konteks, tanpa memasukkan keterangan “pemimpin” dari tradisi sinoptik lain.
- source_word: Πάντα ταῦτα
  choice: Semua itu
  rationale: Merujuk secara ringkas dan alami kepada semua perintah yang baru saja disebutkan.
- source_word: ἐφύλαξα
  choice: sudah kuturuti
  rationale: Dalam konteks perintah, φυλάσσω berarti menaati atau menuruti. “Sudah” mengungkapkan tindakan lampau yang relevan dengan keadaan sekarang.
- source_word: τί
  choice: Apa
  rationale: Memperkenalkan pertanyaan langsung secara wajar dalam bahasa Indonesia.
- source_word: ἔτι
  choice: lagi yang masih
  rationale: Gabungan idiomatis ini menyampaikan gagasan tentang sesuatu yang tetap tersisa; dalam kalimat Indonesia, “apa lagi” dan “masih kurang” terdengar alami.
- source_word: ὑστερῶ
  choice: kurang padaku
  rationale: Mempertahankan arti kekurangan atau ketidakcukupan tanpa menentukan secara lebih sempit bidang kekurangannya.
theological_decisions:
- issue: Penilaian diri tentang ketaatan
  choice: Pernyataan bahwa semua perintah telah dituruti disajikan apa adanya, tanpa tanda persetujuan maupun ironi dari penerjemah.
  alternative: Menandai klaim itu sebagai tulus tetapi keliru, atau sebagai pernyataan yang dibesar-besarkan.
  rationale: Teks Yunani menyampaikan klaim orang muda itu secara langsung; penilaian teologis terhadap klaim tersebut dibiarkan muncul dari konteks narasi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk terikat “kuturuti” menjaga kelancaran dialog. Penanda catatan kaki [a] dan [b] ditempatkan tepat setelah unsur yang dijelaskan.
