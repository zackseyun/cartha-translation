  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: id
  text: Orang muda itu berkata kepada-Nya, “Semua itu sudah kuturuti.[a] Apa yang masih kurang padaku?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semua itu sudah kuturuti.”
