id: MAT.19.6
reference: Matthew 19:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: id
  text: Jadi, mereka bukan lagi dua, melainkan satu daging. Karena itu, apa yang telah dipersatukan Allah janganlah manusia memisahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “manusia” di sini bersifat umum: tidak seorang pun boleh memisahkan apa yang telah dipersatukan Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai hasil dari pernyataan sebelumnya tentang keduanya menjadi satu daging; alami dalam bahasa Indonesia modern dan tetap mempertahankan daya simpulannya.
- source_word: οὐκέτι εἰσὶν δύο
  choice: mereka bukan lagi dua
  rationale: Mengungkapkan perubahan keadaan secara jelas dan mempertahankan pertentangan langsung dengan 'satu daging'.
- source_word: ἀλλὰ σὰρξ μία
  choice: melainkan satu daging
  rationale: Mempertahankan ungkapan penting yang menggemakan bahasa perkawinan dalam Kitab Kejadian, tanpa menggantinya dengan penafsiran seperti 'satu tubuh'.
- source_word: ὃ οὖν
  choice: Karena itu, apa yang
  rationale: Kata ganti relatif netral menunjuk kepada persatuan yang baru disebutkan, sedangkan οὖν menyatakan kesimpulan atau konsekuensi.
- source_word: ὁ θεὸς συνέζευξεν
  choice: yang telah dipersatukan Allah
  rationale: Bentuk pasif dalam bahasa Indonesia terdengar alami dalam klausa relatif dan tetap menyatakan Allah sebagai pelaku yang menyatukan; 'telah' menandai tindakan yang sudah terjadi dengan hasil yang tetap berlaku.
- source_word: ἄνθρωπος μὴ χωριζέτω
  choice: tidak boleh dipisahkan manusia
  rationale: Menyampaikan larangan imperatif dengan jelas. 'Manusia' mempertahankan bentuk tunggal kolektif/generik ἄνθρωπος dan mencakup siapa pun, bukan hanya laki-laki.
theological_decisions:
- issue: Cakupan generik ἄνθρωπος dalam larangan mengenai perkawinan
  choice: manusia
  alternative: seseorang; siapa pun; laki-laki
  rationale: Dalam konteks ini ἄνθρωπος bersifat generik, yaitu manusia sebagai pihak yang tidak boleh memisahkan apa yang Allah persatukan. 'Manusia' akurat dan wajar dalam bahasa Indonesia serta tidak membatasi larangan hanya kepada laki-laki.
- issue: Bahasa persatuan perkawinan yang menggemakan Kejadian
  choice: satu daging
  alternative: satu tubuh
  rationale: Ungkapan ini mempertahankan kaitan tekstual dengan Kejadian dan ketegangan metaforis teks tanpa menjelaskannya secara berlebihan.
- issue: Pelaku penyatuan dan larangan pemisahan
  choice: apa yang telah dipersatukan Allah tidak boleh dipisahkan manusia
  alternative: apa yang telah Allah persatukan, janganlah manusia memisahkannya
  rationale: Susunan ini alami dan bermartabat dalam bahasa Indonesia, menjaga Allah sebagai pelaku penyatuan dan manusia sebagai pihak yang dikenai larangan tanpa menambah klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Ungkapan tradisional 'satu daging' dipertahankan karena nilai intertekstualnya, sementara larangan dirumuskan dengan 'tidak boleh' agar jelas bagi pembaca umum.
