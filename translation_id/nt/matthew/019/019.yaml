id: MAT.19.19
reference: Matthew 19:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: id
  text: Hormatilah ayah dan ibumu, dan kasihilah sesamamu seperti dirimu sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Hormatilah ayah dan ibumu, dan engkau akan mengasihi sesamamu seperti dirimu sendiri.” Bentuk “engkau akan mengasihi” dalam kutipan hukum ini berfungsi sebagai perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Hormatilah
  rationale: Bentuk ini menyampaikan perintah untuk memberikan penghormatan yang semestinya dan mempertahankan bobot rumusan perintah Allah, bukan sekadar sikap menghargai dalam hati.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ayah dan ibumu
  rationale: Walaupun bahasa Yunani memakai kata sandang tanpa pronomina posesif yang tersurat, konteks perintah dan rumusan Dasa Titah secara wajar menunjuk kepada ayah dan ibu orang yang disapa. Dalam bahasa Indonesia, akhiran posesif cukup diletakkan pada unsur terakhir dalam pasangan ini.
- source_word: Ἀγαπήσεις
  choice: kasihilah
  rationale: Bentuk future indicative ini berfungsi sebagai bahasa perintah dalam kutipan Taurat. Imperatif bahasa Indonesia menyampaikan daya perintahnya secara alami dan selaras dengan 'Hormatilah'.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: '''Sesama'' merupakan padanan baku dan alami dalam konteks etis ini serta menunjuk kepada orang lain dalam lingkup hubungan seseorang, bukan hanya orang yang berdekatan secara fisik.'
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Padanan ini mempertahankan perbandingan ringkas dalam bahasa Yunani tanpa menambahkan kata kerja yang tidak tersurat.
theological_decisions:
- issue: Bentuk perintah dalam kutipan hukum Taurat
  choice: 'Kedua klausa diterjemahkan sebagai imperatif: ''Hormatilah ... dan kasihilah ...''.'
  alternative: '''Hormatilah ayah dan ibumu, dan engkau harus mengasihi sesamamu seperti dirimu sendiri.'''
  rationale: Teks Yunani menggabungkan imperatif Τίμα dengan future indicative Ἀγαπήσεις yang berdaya perintah dalam gaya kutipan Taurat. Dua imperatif menghasilkan bahasa Indonesia yang alami sambil mempertahankan fungsi keduanya sebagai perintah; bentuk Yunani yang berbeda dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Hormatilah' dan 'kasihilah' mempertahankan nada perintah Kitab Suci; 'sesamamu' dipilih karena ringkas, lazim, dan mudah dipahami.
