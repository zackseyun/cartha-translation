  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: id
  text: 'Sekali lagi Aku berkata kepada kalian: lebih mudah seekor unta[b] masuk melalui lubang jarum[a] daripada seorang kaya masuk ke dalam Kerajaan Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui mata sebuah jarum.”
    reason: lexical_alternative
  - marker: b
    text: Ada yang mengusulkan “tali” sebagai pengganti “unta”, tetapi teks Yunani di sini berbunyi “unta”.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ
  choice: Sekali lagi
  rationale: πάλιν menyatakan pengulangan, sedangkan δέ merupakan penghubung ringan yang tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia yang wajar.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan rumusan sapaan langsung dan bentuk kini; kapitalisasi “Aku” mengikuti rujukan kepada Yesus.
- source_word: εὐκοπώτερόν ἐστιν
  choice: lebih mudah
  rationale: Padanan idiomatis dan langsung bagi bentuk komparatif yang menghubungkan dua konstruksi infinitif.
- source_word: κάμηλον
  choice: seekor unta
  rationale: κάμηλον berarti “unta”; penggolong “seekor” menghasilkan bahasa Indonesia yang alami tanpa melunakkan gambaran hiperbolisnya.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: melalui lubang jarum
  rationale: Menunjuk pada bukaan sebuah jarum jahit; “lubang jarum” adalah ungkapan Indonesia yang jelas dan alami.
- source_word: εἰσελθεῖν
  choice: masuk melalui
  rationale: Dalam gambaran pertama, verba ini menyatakan gerak memasuki dan melewati bukaan jarum.
- source_word: ἢ πλούσιον
  choice: daripada seorang kaya
  rationale: πλούσιον menunjuk kepada seorang yang kaya. “Seorang kaya” mempertahankan bentuk tunggal representatif tanpa menambahkan kata “laki-laki” yang tidak diperlukan dalam bahasa Indonesia.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: masuk ke dalam Kerajaan Allah
  rationale: “Kerajaan Allah” mempertahankan ungkapan teologis utama, sementara “ke dalam” mencerminkan arah yang dinyatakan oleh εἰς.
theological_decisions:
- issue: Makna gambaran unta dan lubang jarum
  choice: Mempertahankan perbandingan hiperbolis yang menyatakan kemustahilan atau kesulitan ekstrem dari sudut manusia, tanpa mengalegorikannya.
  alternative: Menafsirkannya sebagai pintu sempit bernama “Lubang Jarum”, atau mengganti “unta” dengan “tali”.
  rationale: Teks Yunani secara langsung menyebut unta dan lubang jarum. Konteks berikutnya mengaitkan ketidakmungkinan manusia dengan kemungkinan bagi Allah, sehingga ketegangan gambaran tidak perlu dilunakkan.
- issue: Cakupan πλούσιον
  choice: “seorang kaya”
  alternative: “orang kaya” atau “seorang laki-laki kaya”
  rationale: Bentuk Yunani maskulin tunggal dapat berfungsi secara representatif. Bahasa Indonesia tidak menandai gender pada “seorang kaya”, sehingga terjemahan ini tidak mempersempit cakupan tanpa dasar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua membantu memperjelas pengantar ucapan. “Kerajaan Allah” dikapitalisasi sebagai sebutan teologis yang mapan. Semua penanda catatan kaki ditempatkan langsung dalam teks.
