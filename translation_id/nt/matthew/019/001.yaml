  source_fidelity: 'Terjemahan secara akurat menyampaikan urutan peristiwa: Yesus menyelesaikan perkataan-Nya, meninggalkan Galilea, lalu tiba di wilayah Yudea yang dikualifikasi sebagai berada di seberang Sungai Yordan. "Setelah" merupakan pengungkapan Indonesia yang wajar untuk fungsi temporal naratif Καὶ ἐγένετο ὅτε, tanpa menambah makna. "Wilayah Yudea" mencerminkan cakupan makna τὰ ὅρια τῆς Ἰουδαίας dalam konteks perjalanan.'
