id: MAT.19.1
reference: Matthew 19:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: id
  text: Setelah Yesus selesai menyampaikan perkataan-perkataan itu, Ia meninggalkan Galilea dan tiba di wilayah Yudea di seberang Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di sisi lain Sungai Yordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Setelah
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif dan menandai bahwa selesainya perkataan Yesus mendahului keberangkatan-Nya. 'Setelah' menyampaikan urutan itu secara alami tanpa ungkapan Indonesia yang kaku.
- source_word: ἐτέλεσεν ... τοὺς λόγους τούτους
  choice: selesai menyampaikan perkataan-perkataan itu
  rationale: '''Menyampaikan'' sesuai untuk selesainya suatu rangkaian pengajaran, sedangkan ''perkataan-perkataan itu'' tetap dekat dengan λόγους τούτους tanpa mempersempit maknanya menjadi pepatah atau suatu jenis ajaran tertentu.'
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: meninggalkan Galilea
  rationale: Kata kerja ini menunjukkan keberangkatan dari suatu tempat. 'Meninggalkan' merupakan ungkapan Indonesia yang wajar dan tetap mempertahankan titik asal perjalanan.
- source_word: ἦλθεν εἰς
  choice: tiba di
  rationale: Dalam konteks perjalanan, 'tiba di' secara alami mengungkapkan gerak menuju dan masuk ke wilayah tujuan.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: wilayah Yudea
  rationale: ὅρια dapat menunjuk pada batas, daerah, atau wilayah. Dalam laporan perjalanan ini, 'wilayah' menyampaikan makna geografis tanpa menyiratkan hanya garis perbatasan.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: di seberang Sungai Yordan
  rationale: πέραν menunjuk pada sisi seberang atau sisi yang lebih jauh. Nama 'Sungai Yordan' memperjelas rujukan geografis bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara urutan tindakan dan rincian geografis teks Yunani dipertahankan. Kata ganti ilahi ditulis dengan huruf kapital mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
