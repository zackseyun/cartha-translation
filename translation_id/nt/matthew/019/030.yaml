base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: id
  text: Namun, banyak orang yang pertama akan menjadi yang terakhir, dan yang terakhir akan menjadi yang pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Namun, banyak yang pertama akan menjadi terakhir, dan yang terakhir menjadi pertama.” Bahasa Yunani di sini sangat ringkas dan menyerupai peribahasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival. Dalam bahasa Indonesia, “banyak orang” lebih alami dan jelas daripada “banyak” yang berdiri sendiri.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa kontras ringan terhadap pembahasan sebelumnya. “Namun” mempertahankan hubungan adversatif tersebut dengan ragam yang wajar dan bermartabat.
- source_word: ἔσονται
  choice: akan menjadi
  rationale: Bentuk futurum εἰμί menyatakan keadaan atau kedudukan yang akan berlaku. Dalam konstruksi pembalikan ini, “akan menjadi” alami dalam bahasa Indonesia.
- source_word: πρῶτοι
  choice: yang pertama
  rationale: Kata ini menunjuk urutan atau kedudukan, bukan semata-mata waktu. “Yang pertama” mempertahankan keluasan makna dan daya ungkapan pepatahnya.
- source_word: ἔσχατοι
  choice: yang terakhir
  rationale: Kata ini menjadi lawan langsung πρῶτοι dalam urutan atau kedudukan. “Yang terakhir” mempertahankan antitesis itu tanpa mempersempitnya menjadi “yang paling rendah” atau tafsiran lain.
- source_word: πολλοὶ ... πρῶτοι ἔσχατοι
  choice: banyak orang yang pertama akan menjadi yang terakhir
  rationale: Bahasa Yunani sangat ringkas dan memakai adjektiva secara substantival serta predikatif. Penambahan “orang yang” dan “menjadi” diperlukan agar kalimat alami dan jelas dalam bahasa Indonesia tanpa menambah cakupan makna.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: dan yang terakhir akan menjadi yang pertama
  rationale: Kopula pada klausa kedua dilesapkan dalam bahasa Yunani tetapi dipahami dari klausa pertama. Mengulang “akan menjadi” menghasilkan paralelisme yang alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan perkataan tentang pembalikan
  choice: Dipertahankan sebagai pernyataan umum mengenai pembalikan urutan atau kedudukan.
  alternative: Menafsirkannya secara khusus sebagai pembalikan dalam keselamatan, pahala para murid, kedudukan sosial, atau peringkat eskatologis.
  rationale: Ayat ini sendiri menyampaikan ungkapan pembalikan tanpa menentukan secara tegas satu cakupan doktrinal. Terjemahan karena itu mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas, bermartabat, dan mudah dipahami. Pengulangan “akan menjadi” dipilih demi kejelasan dan keseimbangan alami, sedangkan bentuk Yunani yang lebih padat dicatat dalam catatan kaki.
