revisions:
- from: Yesus berkata kepadanya, “Jika kamu ingin menjadi utuh[a], pergilah, juallah segala milikmu dan berikanlah hasilnya kepada orang-orang miskin. Dengan demikian, kamu akan memiliki harta di surga. Lalu datanglah dan ikutlah Aku.”
  to: Yesus berkata kepadanya, “Jika kamu ingin menjadi sempurna[a], pergilah, juallah segala milikmu dan berikanlah hasil penjualannya kepada orang-orang miskin; kamu akan memiliki harta di surga. Kemudian datanglah dan ikutlah Aku.”
  rationale: Revisi mengganti “utuh” dengan “sempurna” demi ketepatan leksikal yang lebih langsung dan kelaziman bahasa Indonesia, sambil mempertahankan alternatif semantis dalam catatan kaki. “Dengan demikian” dihapus agar tidak menambahkan hubungan inferensial. Objek tersirat dari pemberian dinyatakan sebagai hasil penjualan, yang mengikuti urutan perintah dalam bahasa sumber dan membuat kalimat Indonesia jelas.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:54:02Z'
review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada rangkaian imperatif Yunani dan dengan tepat menyatakan bahwa harta surgawi adalah hasil yang akan datang. Namun, τέλειος lebih aman dan lebih lazim diterjemahkan “sempurna” dalam teks utama; “menjadi utuh” tidak idiomatis dalam konteks ini dan dapat menggeser makna ke arah pemulihan atau integritas batin. Penambahan “Dengan demikian” juga memberi hubungan inferensial yang tidak dinyatakan oleh καί.
  naturalness: “Jika kamu ingin menjadi sempurna” adalah bahasa Indonesia modern yang jelas dan wajar. Penyebutan “hasil penjualannya” menjadikan objek dari “berikanlah” eksplisit secara alami, sesuai urutan perintah menjual lalu memberi. Penghubung “kemudian” menyampaikan urutan yang tersirat dalam δεῦρο tanpa nuansa argumentatif tambahan.
  terminology: “Sempurna” adalah padanan Alkitabiah dan leksikal yang paling mapan untuk τέλειος, dengan alternatif “utuh,” “lengkap,” dan “dewasa” dipertahankan dalam catatan kaki. “Harta di surga” dan “ikutlah Aku” tepat, alami, dan mempertahankan register pemuridan.
  issues:
  - severity: medium
    issue: “menjadi utuh” untuk τέλειος
    rationale: Walaupun “utuh” dapat mencerminkan salah satu nuansa τέλειος, kolokasi “ingin menjadi utuh” kurang alami dalam bahasa Indonesia modern dan berpotensi menyarankan pemulihan dari keadaan rusak. “Sempurna” lebih langsung dan mapan; kemungkinan makna lain dapat dijaga melalui catatan kaki.
  - severity: low
    issue: “Dengan demikian” untuk καί
    rationale: Καί pada bagian ini terutama menghubungkan perintah-perintah dan janji berikutnya. “Dengan demikian” menambahkan penalaran inferensial yang tidak perlu. Penghubung sederhana atau tanda baca lebih setia.
  revised_text: Yesus berkata kepadanya, “Jika kamu ingin menjadi sempurna[a], pergilah, juallah segala milikmu dan berikanlah hasil penjualannya kepada orang-orang miskin; kamu akan memiliki harta di surga. Kemudian datanglah dan ikutlah Aku.”
  revised_footnotes:
  - marker: a
    text: Atau “utuh,” “lengkap,” atau “dewasa.” Kata Yunani ini dapat berarti “sempurna,” “utuh,” “lengkap,” atau “dewasa.”
    reason: lexical_alternative
  revision_rationale: Revisi mengganti “utuh” dengan “sempurna” demi ketepatan leksikal yang lebih langsung dan kelaziman bahasa Indonesia, sambil mempertahankan alternatif semantis dalam catatan kaki. “Dengan demikian” dihapus agar tidak menambahkan hubungan inferensial. Objek tersirat dari pemberian dinyatakan sebagai hasil penjualan, yang mengikuti urutan perintah dalam bahasa sumber dan membuat kalimat Indonesia jelas.
