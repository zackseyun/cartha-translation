  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Jika kamu ingin menjadi sempurna[a], pergilah, juallah segala milikmu dan berikanlah hasil penjualannya kepada orang-orang miskin; kamu akan memiliki harta di surga. Kemudian datanglah dan ikutlah Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utuh,” “lengkap,” atau “dewasa.” Kata Yunani ini dapat berarti “sempurna,” “utuh,” “lengkap,” atau “dewasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Mengikuti susunan wacana Yunani secara alami dalam bahasa Indonesia tanpa menambahkan nuansa cara berbicara.
- source_word: τέλειος
  choice: utuh
  rationale: Dalam konteks ini, kata tersebut menunjuk pada keutuhan atau kelengkapan pengabdian. 'Utuh' mempertahankan tuntutan yang kuat tanpa dengan sendirinya membatasi makna pada kesempurnaan tanpa dosa.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Padanan imperatif yang langsung, wajar, dan sesuai dengan perintah untuk berangkat melakukan tindakan berikutnya.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: juallah segala milikmu
  rationale: Ungkapan Yunani merujuk pada harta benda yang dimiliki orang itu; 'segala milikmu' alami dan mempertahankan cakupan menyeluruh dari perintah tersebut.
- source_word: δὸς πτωχοῖς
  choice: berikanlah hasilnya kepada orang-orang miskin
  rationale: Objek tersirat dari 'berikanlah' secara kontekstual adalah hasil penjualan. Menyatakannya membuat kalimat Indonesia jelas tanpa mengubah arah perintah.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: kamu akan memiliki harta di surga
  rationale: Menyampaikan bentuk futur dan citra harta surgawi secara lugas; bentuk jamak Yunani 'surga-surga' secara idiomatis dinyatakan dengan bentuk tunggal dalam bahasa Indonesia.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Lalu datanglah dan ikutlah Aku
  rationale: Mempertahankan panggilan untuk datang sesudah perintah sebelumnya serta ungkapan khas pemuridan, 'ikutlah Aku'.
theological_decisions:
- issue: Makna τέλειος dalam kaitannya dengan pemuridan
  choice: utuh
  alternative: sempurna; dewasa; lengkap
  rationale: Konteks menyoroti apa yang masih kurang dalam pengabdian orang kaya itu dan menuntut ketaatan tanpa hati yang terbagi. 'Utuh' menjaga nuansa keutuhan tersebut, sementara 'sempurna' tetap merupakan kemungkinan leksikal yang sah dan dicantumkan dalam catatan kaki.
- issue: Hubungan antara penjualan harta dan pemberian kepada orang miskin
  choice: berikanlah hasilnya kepada orang-orang miskin
  alternative: berikanlah kepada orang-orang miskin
  rationale: Bahasa Yunani tidak mengulang objek, tetapi urutan perintah membuat hasil penjualan menjadi objek yang wajar. Penjelasan ini dipakai demi kejelasan bahasa Indonesia dan tidak dimaksudkan untuk mempersempit tuntutan ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif dengan akhiran -lah mempertahankan ketegasan sekaligus kelancaran tuturan. Kata ganti ilahi 'Aku' dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
