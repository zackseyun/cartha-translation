  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: id
  text: Ketika mendengar hal itu, murid-murid sangat terkejut dan berkata, “Kalau begitu, siapa yang dapat diselamatkan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ketika mendengar hal itu
  rationale: Partisip aoris menyatakan keadaan yang mendahului reaksi utama. Klausa temporal alami dalam bahasa Indonesia, sedangkan “hal itu” memperjelas rujukannya kepada perkataan Yesus sebelumnya.
- source_word: δὲ
  choice: tidak dinyatakan secara eksplisit
  rationale: Partikel ini menandai kelanjutan atau kontras ringan. Peralihan sudah tersampaikan secara alami oleh klausa “Ketika mendengar hal itu” sehingga konjungsi tambahan tidak diperlukan.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dan alami dalam konteks Injil bagi para pengikut yang belajar dari Yesus.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: sangat terkejut
  rationale: Bentuk imperfek menggambarkan reaksi mereka, dan σφόδρα memberi intensitas kuat. “Sangat terkejut” alami serta mudah dipahami dalam bahasa Indonesia modern.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip yang menyertai ujaran paling alami dialihkan menjadi verba finit dalam narasi bahasa Indonesia.
- source_word: Τίς ἄρα
  choice: Kalau begitu, siapa
  rationale: ἄρα menarik kesimpulan dari ucapan Yesus sebelumnya dan sekaligus membawa nuansa keheranan. “Kalau begitu” menyampaikan hubungan inferensial itu secara idiomatis.
- source_word: δύναται σωθῆναι
  choice: yang dapat diselamatkan
  rationale: δύναται menyatakan kemampuan atau kemungkinan, sedangkan infinitif pasif σωθῆναι dipertahankan sebagai “diselamatkan” tanpa menentukan pelaku atau mekanismenya.
theological_decisions:
- issue: Makna σωθῆναι dalam konteks
  choice: diselamatkan
  alternative: dilepaskan; diluputkan
  rationale: Konteks tentang masuk ke dalam Kerajaan dan kesulitan orang kaya menunjukkan keselamatan dalam arti teologis yang luas, bukan sekadar pertolongan dari bahaya sementara. Bentuk pasif dan ketegangan teologisnya tetap dipertahankan tanpa menjelaskan mekanisme keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan pertanyaan dibuat idiomatis tanpa mengurangi keterkejutan dan kesimpulan para murid.
