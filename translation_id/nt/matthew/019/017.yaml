id: MAT.19.17
reference: Matthew 19:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: id
  text: Lalu Dia berkata kepadanya[a], “Mengapa kamu bertanya kepada-Ku tentang apa yang baik? Hanya satu yang baik.[b] Tetapi jika kamu ingin masuk ke dalam hidup, taatilah perintah-perintah itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah dan catatan paralel berbunyi, “Mengapa kamu menyebut Aku baik? Tidak ada yang baik selain satu, yaitu Allah.” Teks SBLGNT untuk Matius berbunyi, “Mengapa kamu bertanya kepada-Ku tentang apa yang baik? Hanya satu yang baik.”
    reason: textual_variant
  - marker: b
    text: 'Atau, secara lebih eksplisit: “Hanya ada satu yang baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Mengapa kamu bertanya kepada-Ku tentang apa yang baik?
  rationale: Bentuk netral tunggal τοῦ ἀγαθοῦ paling wajar dipahami secara abstrak atau objektif sebagai ‘apa yang baik’, sesuai sintaksis teks Matius ini dan tanpa menyelaraskannya dengan bentuk pertanyaan dalam Markus dan Lukas.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Hanya satu yang baik
  rationale: Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan pernyataan ringkas bahwa yang baik itu satu. Terjemahan ini tidak menambahkan ‘Allah’, yang tidak disebutkan secara eksplisit dalam teks utama SBLGNT, dan tidak menentukan secara berlebihan apakah ungkapan itu personal atau lebih umum.
- source_word: εἰ δὲ θέλεις
  choice: Tetapi jika kamu ingin
  rationale: θέλω menyatakan keinginan atau kehendak, sehingga ‘ingin’ jelas dan wajar dalam bahasa Indonesia modern. δέ diterjemahkan ‘tetapi’ karena menandai peralihan yang agak kontras.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: masuk ke dalam hidup
  rationale: Terjemahan ini mempertahankan gambaran masuk ke dalam hidup dan tidak memperluasnya menjadi ‘hidup kekal’, sebab kata ‘kekal’ tidak terdapat dalam klausa ini.
- source_word: τήρησον τὰς ἐντολάς
  choice: taatilah perintah-perintah itu
  rationale: Dalam hubungan dengan perintah, τηρέω berarti memelihara dengan menaatinya. ‘Taatilah’ lebih alami dan langsung bagi pembaca Indonesia modern daripada terjemahan harfiah seperti ‘jagalah’.
theological_decisions:
- issue: Hubungan perkataan Yesus dengan kebaikan ilahi dan Kristologi
  choice: Menerjemahkan bentuk teks Matius sebagai pertanyaan tentang ‘apa yang baik’ dan jawaban ‘Hanya satu yang baik’, tanpa menyisipkan nama Allah atau menganggapnya sebagai penyangkalan atas kebaikan Yesus.
  alternative: 'Menyelaraskannya dengan Markus/Lukas: ‘Mengapa kamu menyebut Aku baik? Tidak ada yang baik selain satu, yaitu Allah.’'
  rationale: Teks SBLGNT untuk Matius berbeda dari bentuk paralelnya dalam Markus dan Lukas. Terjemahan perlu mempertahankan redaksi Matius serta ketegangan teologisnya tanpa memaksakan penafsiran Kristologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal ‘kamu’, gaya langsung dan bermartabat. Huruf kapital pada ‘Dia’ dan ‘-Ku’ mengikuti kebiasaan penulisan rujukan kepada Yesus dalam terjemahan Alkitab Indonesia. Penanda catatan [b] ditempatkan setelah klausa yang diterangkannya, bukan setelah ‘hidup’.
