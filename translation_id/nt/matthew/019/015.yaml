  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur utama Yunani dengan setia: partisip aoristus ἐπιθείς sebagai tindakan yang mendahului verba utama melalui “Sesudah menumpangkan”; idiom τὰς χεῖρας αὐτοῖς dengan tepat sebagai “tangan-Nya atas mereka”; ἐπορεύθη sebagai “pergi”; dan ἐκεῖθεν sebagai “dari sana.” Penyebutan “Yesus” menjelaskan subjek yang tersirat tanpa menambahkan makna. Penghilangan terjemahan terpisah untuk καί dapat diterima karena hubungan naratif dan urutan tindakan tersampaikan oleh konstruksi “Sesudah …”.'
