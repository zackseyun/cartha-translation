  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: id
  text: Sesudah menumpangkan tangan-Nya atas mereka, Yesus pergi dari sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθεὶς
  choice: Sesudah menumpangkan
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama. Bentuk “sesudah” menyampaikan urutan tersebut secara alami dalam bahasa Indonesia.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: tangan-Nya atas mereka
  rationale: Ungkapan ini berarti menumpangkan tangan pada seseorang. Sufiks “-Nya” ditambahkan secara wajar karena subjeknya adalah Yesus, sedangkan αὐτοῖς diterjemahkan “atas mereka” sesuai idiom Indonesia “menumpangkan tangan atas”.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Dalam konteks naratif, verba ini menyatakan bahwa Yesus beranjak atau pergi; “pergi” merupakan padanan modern yang jelas tanpa meninggikan ragam bahasa secara tidak perlu.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia tempat ini secara langsung berarti “dari sana” atau “dari tempat itu”; pilihan pertama paling alami dan ringkas.
- source_word: καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Hubungan urutan dengan narasi sebelumnya sudah tersampaikan secara alami melalui konstruksi “Sesudah …”; menambahkan “dan” akan terasa kurang luwes dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Hakikat tindakan Yesus ketika menumpangkan tangan
  choice: Mempertahankan tindakan fisik konkret “menumpangkan tangan” tanpa menggantinya dengan “memberkati”.
  alternative: Menerjemahkan secara interpretatif sebagai “memberkati mereka”.
  rationale: Teks Yunani secara eksplisit menyebut penumpangan tangan. Konteks sebelumnya berkaitan dengan berkat, tetapi ayat ini sendiri tetap diterjemahkan sesuai tindakan yang dinyatakan agar tidak memasukkan kesimpulan teologis atau ritual yang melampaui sumber.
- issue: Subjek tersirat pada ἐπορεύθη
  choice: Menyebut “Yesus” secara eksplisit.
  alternative: Memakai pronomina “Ia” atau “Dia”.
  rationale: Bahasa Yunani mengandalkan subjek yang dipahami dari konteks. Penyebutan nama Yesus menjernihkan rujukan dalam bahasa Indonesia tanpa menambah pelaku baru atau mengubah makna.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Konstruksi “menumpangkan tangan-Nya atas mereka” mempertahankan gambaran konkret sumber dan merupakan ungkapan yang lazim dipahami dalam konteks Alkitab. Tidak diperlukan catatan kaki karena alternatif urutan partisip tidak menghasilkan perbedaan makna yang berarti dalam bahasa Indonesia.
