  terminology: Istilah “menumpangkan tangan” tepat untuk ἐπιτίθημι τὰς χεῖρας dan tidak menggantikannya dengan penafsiran seperti “memberkati.” Kapitalisasi sufiks “-Nya” dan penyebutan “Yesus” konsisten dengan register Alkitab Indonesia. Tidak ada istilah teologis yang dipaksakan atau ambiguitas sumber yang hilang.
