  terminology: '''Musa'', ''surat cerai'', dan ''menceraikan'' sesuai register Alkitab modern dan konteks hukum. Kata ''memerintahkan'' harus dipertahankan karena mencerminkan perumusan para penanya, tanpa mengantisipasi koreksi Yesus pada ayat berikutnya.'
