source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Kalau begitu, mengapa Musa memerintahkan untuk memberikan surat cerai dan menceraikan perempuan itu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyuruhnya pergi.” Kata kerja Yunani ini dapat berarti “menyuruh pergi” dan dalam konteks ini berfungsi sebagai istilah untuk perceraian.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepada-Nya
  rationale: Bentuk kini historis dalam narasi Yunani diterjemahkan dengan bentuk lampau yang tersirat secara alami dalam narasi bahasa Indonesia.
- source_word: Τί οὖν
  choice: Kalau begitu, mengapa
  rationale: Ungkapan ini memperkenalkan sanggahan terhadap pernyataan Yesus sebelumnya; pilihan ini menyampaikan daya argumentatifnya secara alami.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Musa memerintahkan
  rationale: Kata kerja Yunani menyatakan perintah. Rumusan lawan bicara dipertahankan dan tidak diubah menjadi 'mengizinkan' berdasarkan koreksi Yesus pada ayat berikutnya.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: untuk memberikan surat cerai
  rationale: Ungkapan ini menunjuk pada dokumen tertulis yang mengesahkan perceraian; 'surat cerai' adalah istilah Indonesia yang jelas dan lazim.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: dan menyuruh perempuan itu pergi
  rationale: Terjemahan ini mempertahankan arti dasar tindakan menyuruh pergi, sementara konteks surat cerai menunjukkan bahwa tindakan tersebut berfungsi sebagai perceraian.
- source_word: αὐτήν
  choice: perempuan itu
  rationale: Pronomina feminin tunggal merujuk kepada istri dalam perkara perceraian; bahasa Indonesia tidak memiliki pronomina orang ketiga feminin, sehingga rujukannya dibuat jelas tanpa menambahkan 'istrinya' yang tidak eksplisit dalam frasa ini.
theological_decisions:
- issue: Apakah perkataan para penanya perlu diselaraskan lebih dahulu dengan koreksi Yesus pada ayat berikutnya
  choice: Mempertahankan 'memerintahkan'
  alternative: mengizinkan
  rationale: Teks Yunani secara eksplisit memakai kata yang berarti 'memerintahkan'. Terjemahan mempertahankan cara para penanya membingkai hukum Musa, tanpa memasukkan koreksi ayat berikutnya ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalau begitu' menandai hubungan argumentatif dengan perkataan sebelumnya. 'Surat cerai' dipilih sebagai istilah hukum yang ringkas dan mudah dipahami. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
