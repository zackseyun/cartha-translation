id: MAT.19.13
reference: Matthew 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: id
  text: Kemudian, anak-anak dibawa kepada Yesus supaya Ia meletakkan tangan-Nya atas mereka dan berdoa. Namun, murid-murid menegur mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” yang terakhir dapat merujuk kepada anak-anak itu atau kepada orang-orang yang membawa mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai urutan waktu dalam narasi secara ringkas dan alami.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: anak-anak dibawa kepada Yesus
  rationale: Bentuk pasif aoris diterjemahkan secara langsung. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: supaya Ia meletakkan tangan-Nya atas mereka
  rationale: Mempertahankan makna tujuan ἵνα dan bentuk jamak “tangan”; ungkapan ini alami dan tetap dekat dengan susunan Yunani.
- source_word: καὶ προσεύξηται
  choice: dan berdoa
  rationale: Tidak menambahkan objek “bagi mereka” karena objek tersebut tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: οἱ δὲ μαθηταὶ
  choice: Namun, murid-murid
  rationale: δέ menyatakan kontras dengan tindakan membawa anak-anak; “namun” menyampaikan peralihan itu secara wajar.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: menegur mereka
  rationale: “Menegur” menyampaikan daya ἐπιτιμάω dalam bahasa Indonesia modern, sedangkan “mereka” mempertahankan ketidakjelasan rujukan αὐτοῖς.
theological_decisions:
- issue: Rujukan αὐτοῖς yang terakhir
  choice: mereka
  alternative: anak-anak; atau orang-orang yang membawa anak-anak itu
  rationale: Pronomina Yunani dapat merujuk kepada anak-anak atau kepada orang-orang yang membawa mereka. Teks utama tidak memutuskan ketidakjelasan yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Huruf kapital pada “Ia” dan “tangan-Nya” mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus; kapitalisasi ini bukan unsur tata bahasa Yunani.
