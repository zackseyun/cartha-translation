id: MAT.19.23
reference: Matthew 19:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: id
  text: 'Lalu Yesus berkata kepada murid-murid-Nya, “Sesungguhnya Aku berkata kepada kalian: orang kaya akan sulit masuk ke dalam Kerajaan Surga.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Menandai peralihan dan kelanjutan narasi secara alami dalam bahasa Indonesia.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan langsung dan wajar untuk verba pengantar ujaran dalam narasi.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Mempertahankan bentuk jamak serta pronomina posesif αὐτοῦ yang eksplisit.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepada kalian
  rationale: Menyampaikan bobot formula penegasan Yesus dengan bahasa Indonesia modern; bentuk jamak ὑμῖν dinyatakan melalui 'kalian'.
- source_word: πλούσιος
  choice: orang kaya
  rationale: Adjektiva substantival ini menunjuk seorang individu kaya; 'orang kaya' merupakan ungkapan Indonesia yang alami tanpa menambah pembatasan yang tidak diperlukan oleh konteks.
- source_word: δυσκόλως
  choice: akan sulit
  rationale: Mengungkapkan kesulitan masuk tanpa langsung memperkuatnya menjadi kemustahilan; susunan ini alami dalam bahasa Indonesia.
- source_word: εἰσελεύσεται
  choice: masuk
  rationale: Bersama penanda futur 'akan' pada predikat, menyampaikan bentuk futur Yunani secara jelas.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: ke dalam Kerajaan Surga
  rationale: Mempertahankan citra memasuki kerajaan dan memakai ungkapan khas Matius yang sudah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan πλούσιος yang berbentuk maskulin tunggal
  choice: orang kaya
  alternative: seorang laki-laki kaya
  rationale: Maskulin tunggal Yunani dapat berfungsi secara substantival bagi sosok perwakilan. Dalam bahasa Indonesia, 'orang kaya' mempertahankan jumlah tunggal secara semantis dan tidak memasukkan penegasan jenis kelamin yang tidak dituntut oleh pokok perkataan.
- issue: Penerjemahan Ἀμὴν dalam formula perkataan Yesus
  choice: Sesungguhnya
  alternative: Amin
  rationale: '''Sesungguhnya'' menyampaikan fungsi penegasan yang khidmat dan berwibawa dalam bahasa Indonesia modern, sementara ''Amin'' dapat dipahami terutama sebagai penutup doa.'
- issue: Kekuatan δυσκόλως
  choice: akan sulit masuk
  alternative: hampir tidak mungkin masuk
  rationale: Terjemahan pilihan mempertahankan pernyataan tentang kesulitan tanpa mendahului penguatan menuju kemustahilan yang dikembangkan dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'kalian' dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak. Kapitalisasi 'Kerajaan Surga' mengikuti pemakaian religius Indonesia yang mapan.
