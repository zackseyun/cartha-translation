  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama SBLGNT: penghubung naratif δέ (“Lalu”), Yesus berbicara kepada murid-murid-Nya, formula penegasan Ἀμὴν λέγω ὑμῖν, subjek tunggal substantival πλούσιος, kesulitan yang dinyatakan δυσκόλως, futur εἰσελεύσεται, dan tujuan “Kerajaan Surga.” “Orang kaya akan sulit masuk” secara idiomatis mempertahankan makna ‘seorang kaya akan masuk dengan sulit’ tanpa menguatkannya menjadi kemustahilan.'
