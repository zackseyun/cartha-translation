  text: Banyak orang mengikuti dia, dan dia menyembuhkan mereka di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: Bentuk aoris aktif indikatif dari ἀκολουθέω ini menyatakan tindakan mengikuti secara harfiah dalam alur narasi. 'Mengikuti' merupakan padanan Indonesia yang alami tanpa menambahkan makna khusus tentang pemuridan.
- source_word: αὐτῷ
  choice: dia
  rationale: Pronomina datif ini menunjuk kepada orang yang diikuti. Dalam tata bahasa Indonesia, verba 'mengikuti' langsung diikuti objek 'dia'.
- source_word: ὄχλοι πολλοί
  choice: orang banyak berbondong-bondong
  rationale: Frasa ini secara harfiah berarti 'banyak kumpulan orang'. Ungkapan 'orang banyak berbondong-bondong' secara alami menyampaikan besarnya jumlah orang sekaligus menghindari frasa Indonesia yang janggal seperti 'banyak kerumunan'.
- source_word: ἐθεράπευσεν
  choice: dia menyembuhkan
  rationale: Dalam konteks pelayanan Yesus, θεραπεύω berarti memulihkan orang dari penyakit. 'Menyembuhkan' adalah padanan yang jelas, alami, dan lazim dalam narasi Injil.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina akusatif jamak ini merujuk kembali kepada orang banyak dan diterjemahkan langsung sebagai 'mereka'.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Adverbia tempat ini dipertahankan secara ringkas dan alami sebagai 'di sana'.
- source_word: καὶ ... καὶ
  choice: '[tanpa padanan awal eksplisit] ... dan'
  rationale: καί pertama berfungsi menghubungkan ayat ini dengan narasi sebelumnya; dalam bahasa Indonesia modern, hubungan itu dapat dibiarkan tersirat agar pembukaan tidak kaku. καί kedua diterjemahkan 'dan' untuk mempertahankan rangkaian kedua tindakan.
