  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: id
  text: Lalu orang-orang Farisi datang kepada Yesus untuk menguji Dia dan berkata, “Apakah seorang laki-laki boleh menceraikan istrinya dengan alasan apa pun?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “atas dasar apa pun” atau “untuk setiap alasan.” Frasa Yunani ini mengungkapkan pertanyaan hukum yang luas tentang alasan-alasan yang diperbolehkan untuk bercerai.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: datang kepada Yesus
  rationale: Ungkapan ini secara alami menyatakan gerak mendekati seseorang. Nama “Yesus” memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah makna.
- source_word: πειράζοντες αὐτόν
  choice: untuk menguji Dia
  rationale: πειράζω dapat berarti menguji, mencobai, atau menjebak. “Menguji” mempertahankan keluasan makna leksikal dan membiarkan konteks menunjukkan niat yang bermusuhan.
- source_word: ἔξεστιν
  choice: boleh
  rationale: Dalam pertanyaan hukum, kata ini menanyakan apa yang diizinkan. “Boleh” merupakan ungkapan Indonesia yang alami dan jelas, sementara konteks perdebatan mempertahankan nuansa hukumnya.
- source_word: ἀνθρώπῳ
  choice: seorang laki-laki
  rationale: Walaupun ἄνθρωπος dapat bersifat umum, penyebutan “istrinya” membuat rujukan konkretnya seorang laki-laki atau suami.
- source_word: ἀπολῦσαι
  choice: menceraikan
  rationale: Dalam konteks perkawinan, ἀπολύω adalah istilah idiomatis untuk perceraian, bukan sekadar menyuruh pergi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: istrinya
  rationale: γυνή berarti “istri” dalam konteks perceraian, dan bentuk posesif paling alami diterjemahkan “istrinya”.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: dengan alasan apa pun
  rationale: Terjemahan ini mempertahankan cakupan luas πᾶσαν dan menyampaikan pertanyaan mengenai dasar atau alasan yang diperbolehkan untuk bercerai.
theological_decisions:
- issue: Rumusan pertanyaan tentang dasar perceraian dalam perdebatan hukum Yahudi abad pertama
  choice: Apakah seorang laki-laki boleh menceraikan istrinya dengan alasan apa pun?
  alternative: Apakah seorang suami diperbolehkan menceraikan istrinya atas setiap dasar?
  rationale: Pilihan ini mempertahankan pertanyaan hukum yang luas tanpa memasukkan kesimpulan teologis atau pendirian denominasi tertentu mengenai perceraian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Struktur Yunani yang memakai dua partisip diurai menjadi dua kalimat agar mudah dipahami, tanpa menghilangkan hubungan tujuan dan isi pertanyaannya.
