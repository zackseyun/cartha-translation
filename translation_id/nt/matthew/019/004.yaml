revisions:
- from: Ia menjawab, “Tidakkah kamu membaca bahwa Dia yang menciptakan mereka sejak semula menjadikan mereka laki-laki dan perempuan?”[a][b]
  to: Ia menjawab, “Tidakkah kamu pernah membaca[a] bahwa Dia yang menciptakan[b], sejak semula, menjadikan mereka laki-laki dan perempuan?”
  rationale: Revisi mengembalikan αὐτούς kepada verba ἐποίησεν (“menjadikan mereka”), memperbaiki nuansa pertanyaan Yunani dengan “pernah membaca,” dan memindahkan jangkar catatan kaki ke kata atau frasa yang dijelaskan. Frasa “sejak semula” diletakkan secara berhati-hati dalam klausa agar tetap selaras dengan urutan Yunani serta tidak memaksakan satu analisis cakupan yang diperselisihkan.
