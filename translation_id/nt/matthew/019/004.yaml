  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: id
  text: Ia menjawab, “Tidakkah kamu pernah membaca[a] bahwa Dia yang menciptakan[b], sejak semula, menjadikan mereka laki-laki dan perempuan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukankah kamu telah membaca ...?”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Dia yang menciptakan”; dapat juga diterjemahkan, “Sang Pencipta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Ungkapan partisip + verba finit ini secara alami diringkas dalam bahasa Indonesia menjadi ‘Ia menjawab’, tanpa kehilangan makna.
- source_word: Οὐκ ἀνέγνωτε
  choice: Tidakkah kamu membaca
  rationale: Bentuk pertanyaan ini menegur para pendengar dengan merujuk pada Kitab Suci yang semestinya mereka ketahui; ‘Tidakkah kamu membaca’ alami dan mempertahankan daya retorisnya.
- source_word: ὁ κτίσας
  choice: Dia yang menciptakan mereka
  rationale: Frasa ini mempertahankan bentuk partisip substantival Yunani tanpa mengubahnya menjadi gelar ‘Sang Pencipta’; objek ‘mereka’ ditempatkan bersama verba ini agar hubungan sintaksisnya jelas.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Ungkapan ini alami dalam bahasa Indonesia, menggemakan kisah penciptaan, dan dapat dipahami sebagai keterangan bagi tindakan menciptakan.
- source_word: ἄρσεν καὶ θῆλυ
  choice: laki-laki dan perempuan
  rationale: Pilihan ini menyampaikan pasangan jenis kelamin dalam kutipan atau alusi Kejadian secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐποίησεν αὐτούς
  choice: menjadikan mereka
  rationale: ‘Menjadikan’ membedakannya dari κτίσας (‘menciptakan’) dan menghindari pengulangan verba yang sama.
theological_decisions:
- issue: Pernyataan penciptaan dalam hubungannya dengan Kejadian 1:27
  choice: Mempertahankan pasangan penciptaan ‘laki-laki dan perempuan’ dalam teks utama
  alternative: ‘menjadikan mereka sebagai laki-laki dan perempuan’ atau ‘menjadikan mereka pria dan wanita’
  rationale: Yesus merujuk langsung pada kisah penciptaan. Rumusan ini paling dekat dengan bahasa Yunani dan alusi Kejadian tanpa menambahkan kesimpulan doktrinal yang melampaui ayat.
- issue: Hubungan sintaksis ἀπ’ ἀρχῆς
  choice: ‘sejak semula’ ditempatkan setelah ‘menciptakan mereka’
  alternative: ‘bahwa sejak semula Dia yang menciptakan mereka ...’
  rationale: Penempatan ini lebih jelas menghubungkan frasa tersebut dengan tindakan menciptakan, sambil tetap mengakui bahwa susunan Yunani memungkinkan nuansa alusi yang lebih luas kepada permulaan penciptaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ia’ dipakai untuk narasi, sedangkan ‘Dia’ mengacu kepada Allah. Bentuk ‘kamu’ mengikuti sapaan jamak yang tersirat oleh verba Yunani dan tetap mudah dipahami dalam konteks.
