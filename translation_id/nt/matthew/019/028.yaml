id: MAT.19.28
reference: Matthew 19:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: id
  text: 'Lalu Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu: pada waktu pembaruan[a], ketika Anak Manusia duduk di takhta kemuliaan-Nya, kamu yang telah mengikuti Aku juga akan duduk di atas dua belas takhta dan menghakimi[b] kedua belas suku Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu kelahiran kembali,” “di dunia yang baru,” atau “pada waktu penciptaan kembali.” Di sini ungkapan ini kemungkinan besar menunjuk pada pembaruan pada masa depan yang berkaitan dengan pemerintahan Anak Manusia, bukan pada kelahiran baru setiap orang.
    reason: lexical_alternative
  - marker: b
    text: “Menghakimi” juga dapat mengandung arti memerintah atau menjalankan pemerintahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Mengungkapkan formula pembuka yang khidmat dan berwibawa dalam bahasa Indonesia yang alami, tanpa mempertahankan kata pinjaman sebagai istilah yang kurang transparan.
- source_word: ἀκολουθήσαντές μοι
  choice: kamu yang telah mengikuti Aku
  rationale: Menunjukkan kelompok yang disapa berdasarkan tindakan mereka mengikuti Yesus, sekaligus mempertahankan objek personal 'Aku' secara eksplisit.
- source_word: παλιγγενεσίᾳ
  choice: pada waktu pembaruan
  rationale: Kata ini dapat berarti kelahiran kembali atau pembaruan. Dalam konteks penakhtaan Anak Manusia pada masa depan, 'pembaruan' mempertahankan cakupan eskatologisnya tanpa menambahkan 'segala sesuatu' yang tidak eksplisit dalam bahasa Yunani.
- source_word: ὅταν καθίσῃ
  choice: ketika ... duduk
  rationale: Konstruksi temporal ini menunjuk kepada peristiwa masa depan; bentuk kini setelah 'ketika' merupakan ungkapan Indonesia yang wajar dan tidak mengaburkan kepastian peristiwanya.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan baku bagi gelar tersebut dan mempertahankan gema mesianik serta kaitannya dengan Daniel.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: di takhta kemuliaan-Nya
  rationale: Mempertahankan konstruksi genitif dan nada luhur teks. 'Di takhta' merupakan kolokasi Indonesia yang lebih alami untuk tindakan duduk.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: kamu ... juga akan duduk
  rationale: Mempertahankan janji masa depan dan unsur καί yang mengaitkan duduknya para pengikut dengan duduknya Anak Manusia.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: di atas dua belas takhta
  rationale: Menyampaikan relasi lokatif secara jelas dan alami dalam bahasa Indonesia.
- source_word: κρίνοντες
  choice: menghakimi
  rationale: Merupakan padanan paling langsung, sambil tidak menutup kemungkinan bahwa tindakan tersebut juga mencakup pemerintahan.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: kedua belas suku Israel
  rationale: Padanan konvensional dan tepat bagi pembagian suku-suku Israel.
theological_decisions:
- issue: Makna παλιγγενεσία dalam konteks ini
  choice: pembaruan eskatologis yang berkaitan dengan penakhtaan Anak Manusia
  alternative: kelahiran kembali pribadi; zaman baru; dunia baru
  rationale: Konteks langsung berbicara tentang penakhtaan dan penghakiman pada masa depan, bukan pertobatan pribadi. Terjemahan tidak menentukan skema milenial atau kerangka denominasi tertentu.
- issue: Cakupan κρίνοντες
  choice: menghakimi
  alternative: memerintah; mengatur
  rationale: Makna dasarnya adalah menghakimi, meskipun dalam konteks kerajaan dapat mencakup pelaksanaan pemerintahan. Teks utama mempertahankan makna langsung dan catatan kaki menyebutkan nuansa yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Susunan klausa mengikuti alur Yunani sejauh tetap alami; kedua penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan.
