source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: Siapa pun yang menceraikan istrinya, kecuali karena percabulan[a], lalu menikahi perempuan lain, berbuat zina; dan siapa pun yang menikahi perempuan yang telah diceraikan berbuat zina[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kecuali atas dasar percabulan." Kata Yunani porneia dapat menunjuk secara luas pada hubungan atau perilaku seksual yang tidak sah; ada juga yang memahaminya secara lebih sempit sebagai perzinaan, zina sebelum menikah, atau ketidaksetiaan seksual.
    reason: lexical_alternative
  - marker: b
    text: 'Sebagian naskah tidak memuat: "dan siapa pun yang menikahi perempuan yang telah diceraikan berbuat zina."'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: δέ menyatakan peralihan yang bernuansa pertentangan dalam konteks, sedangkan λέγω dengan datif ὑμῖν diterjemahkan secara alami sebagai 'Aku berkata kepadamu.'
- source_word: ὃς ἂν
  choice: Siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan kondisi umum yang tidak tertentu; 'siapa pun yang' mempertahankan daya generiknya.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: menceraikan istrinya
  rationale: Dalam konteks perkawinan, ἀπολύω berarti menceraikan, dan γυνή berarti istri, bukan sekadar perempuan.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: kecuali karena percabulan
  rationale: Ungkapan ini berfungsi sebagai klausul pengecualian. 'Percabulan' mempertahankan cakupan πορνεία sebagai perilaku seksual yang tidak sah tanpa menyamakannya secara sempit dengan perzinaan.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: lalu menikahi perempuan lain
  rationale: καί menghubungkan tindakan berikutnya; dalam bahasa Indonesia, 'lalu' memperjelas urutannya tanpa mengubah hubungan gramatikal. Bentuk feminin ἄλλην dibuat eksplisit sebagai 'perempuan lain.'
- source_word: μοιχᾶται
  choice: berbuat zina
  rationale: Padanan ini menyampaikan tindakan perzinaan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: dan siapa pun yang menikahi perempuan yang diceraikan itu berbuat zina
  rationale: Konstruksi partisipial berartikel diterjemahkan sebagai pernyataan umum. Partisipel pasif perfek ἀπολελυμένην menunjuk kepada perempuan yang telah diceraikan.
theological_decisions:
- issue: Makna πορνεία dalam klausul pengecualian
  choice: Diterjemahkan 'percabulan' sebagai istilah luas bagi hubungan atau perilaku seksual yang tidak sah.
  alternative: perzinaan; ketidaksetiaan seksual; zina sebelum menikah
  rationale: πορνεία lebih luas daripada μοιχεία (perzinaan). Terjemahan utama tidak membatasi pengecualian hanya pada satu bentuk pelanggaran seksual; kemungkinan penafsiran yang lebih sempit dicatat dalam catatan kaki.
- issue: Kehadiran klausa akhir καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Dicantumkan dalam teks utama dengan catatan varian tekstual.
  alternative: Klausa dihilangkan karena tidak terdapat dalam sebagian naskah.
  rationale: SBLGNT yang diberikan memuat klausa tersebut sambil menandai adanya variasi tekstual. Karena itu, klausa diterjemahkan, dan ketidakpastian bukti naskah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'Aku' untuk Yesus mengikuti kebiasaan penulisan Alkitab Indonesia. 'Percabulan' dipilih sebagai istilah yang cukup dikenal dan lebih luas daripada 'perzinaan', sementara catatan kaki menjaga ambiguitas leksikal dan ketegangan penafsirannya.
