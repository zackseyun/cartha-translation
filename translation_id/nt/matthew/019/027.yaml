source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: id
  text: Lalu Petrus menjawab, “Lihat, kami telah meninggalkan segala sesuatu dan mengikuti Engkau. Jadi, apa yang akan kami peroleh?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: berkata
  rationale: Dalam konteks ini, ungkapan Semitis ‘menjawab dan berkata’ secara alami dinyatakan ‘berkata’ dalam bahasa Indonesia; ucapan Petrus menanggapi percakapan sebelumnya.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Mempertahankan seruan yang menarik perhatian pada keadaan para murid, dengan bentuk modern dan langsung.
- source_word: ἀφήκαμεν πάντα
  choice: kami telah meninggalkan segala sesuatu
  rationale: Menyampaikan aspek perfektif aoristus dan cakupan πάντα tanpa mempersempitnya menjadi harta benda saja.
- source_word: ἠκολουθήσαμέν σοι
  choice: mengikuti Engkau
  rationale: Menggunakan padanan alami bagi tindakan menjadi pengikut Yesus; bentuk lampau dipahami bersama ‘telah’ pada predikat sebelumnya.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Jadi, apa yang akan kami peroleh?
  rationale: ἄρα menandai kesimpulan (‘jadi’), sedangkan konstruksi ‘akan ada bagi kami’ secara idiomatis berarti apa yang akan menjadi bagian atau diperoleh oleh mereka.
theological_decisions:
- issue: Sifat pertanyaan Petrus tentang balasan
  choice: apa yang akan kami peroleh
  alternative: apa yang akan tersedia bagi kami
  rationale: Padanan ini menyampaikan makna idiomatis ἔσται ἡμῖν tanpa menentukan jenis balasan atau memberi penilaian moral atas pertanyaan Petrus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti penghormatan ‘Engkau’ dan akhiran ‘-Nya’ digunakan ketika merujuk kepada Yesus. Tidak diperlukan catatan kaki.
