  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: id
  text: Namun, Yesus berkata kepada mereka, “Tidak semua orang dapat menerima perkataan ini[a], melainkan hanya mereka yang kepadanya hal itu telah diberikan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pernyataan ini” atau “pengajaran ini.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melainkan mereka yang kepadanya hal itu telah diberikan.” Bentuk pasif ini kemungkinan menyiratkan Allah sebagai pemberi, tetapi bahasa Yunani tidak menyebutkan pelakunya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoris dari λέγω ini merupakan pengantar ujaran yang lazim; “berkata” paling alami dalam narasi bahasa Indonesia.
- source_word: Οὐ πάντες
  choice: Tidak semua orang
  rationale: Ungkapan ini secara alami mempertahankan negasi universal dalam bahasa Indonesia tanpa menyiratkan bahwa tidak seorang pun mampu menerimanya.
- source_word: χωροῦσι
  choice: dapat menerima
  rationale: Dalam konstruksi dengan λόγον, χωρέω berarti memberi ruang bagi, menampung, atau menerima suatu perkataan. “Dapat menerima” menyampaikan makna idiomatisnya dengan jelas.
- source_word: τὸν λόγον τοῦτον
  choice: perkataan ini
  rationale: λόγος menunjuk pada pernyataan yang baru saja disampaikan dalam konteks. “Perkataan ini” alami dan tetap cukup luas untuk mencakup perkataan atau pengajaran.
- source_word: ἀλλ’ οἷς
  choice: melainkan hanya mereka yang
  rationale: “Melainkan” menyatakan kontras setelah negasi, sedangkan “hanya” memperjelas pembatasan yang terkandung dalam klausa relatif tersebut.
- source_word: δέδοται
  choice: telah dikaruniai kemampuan itu
  rationale: Bentuk perfektum pasif menunjukkan sesuatu yang telah dianugerahkan dengan hasil yang tetap berlaku. Penambahan “kemampuan itu” menjelaskan bahwa yang diberikan ialah kapasitas untuk menerima perkataan tersebut, sambil mempertahankan pelaku yang tidak disebutkan.
theological_decisions:
- issue: Identitas pemberi yang tersirat dalam bentuk pasif δέδοται
  choice: 'Mempertahankan pelaku yang tidak disebutkan: “telah dikaruniai kemampuan itu”'
  alternative: “mereka yang telah diberi Allah kemampuan untuk menerimanya”
  rationale: Bahasa Yunani tidak menyebutkan subjek pemberi. Walaupun bentuk pasif ini sangat mungkin menyiratkan Allah, teks utama tidak boleh menjadikan pelaku tersebut eksplisit.
- issue: Hal yang diberikan dalam δέδοται
  choice: Memahami yang diberikan sebagai kemampuan untuk menerima perkataan tersebut
  alternative: “mereka yang kepadanya hal itu telah diberikan”
  rationale: Konteks dan χωροῦσι menunjukkan bahwa pemberian itu berkaitan dengan kapasitas menerima perkataan. Terjemahan ini memperjelas rujukan yang dalam bahasa Indonesia akan terasa kabur, tanpa menentukan secara lebih khusus sifat karunia tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Nama “Yesus” dipakai untuk memperjelas subjek pronominal dari konteks. “Dikaruniai” mempertahankan nuansa pemberian tanpa secara eksplisit menamai pemberinya; catatan kaki mempertahankan bentuk harfiah dan ambiguitas sumber.
