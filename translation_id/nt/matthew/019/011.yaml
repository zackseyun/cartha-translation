  source_fidelity: Bagian “telah dikaruniai kemampuan itu” menafsirkan objek implisit δέδοται sebagai kemampuan. Walaupun pemahaman ini masuk akal dari konteks, teks Yunani hanya menyatakan bahwa sesuatu “telah diberikan” kepada orang-orang tertentu. Teks Indonesia sebaiknya mempertahankan ketidaktersediaan objek tersebut seperti sumbernya.
  naturalness: Kalimatnya umumnya baku dan jelas. Namun, “melainkan hanya mereka yang kepadanya hal itu telah diberikan” lebih setia kepada bentuk pasif dan ambiguitas sumber, walaupun bernada formal; nada ini sesuai untuk terjemahan Alkitab.
  terminology: “Perkataan ini” merupakan padanan yang baik untuk τὸν λόγον τοῦτον dalam konteks ini. “Diberikan” mempertahankan pasif tanpa menyebut Allah sebagai pelaku. Nama “Yesus” dapat dipertahankan sebagai penjelasan subjek dalam konteks naratif.
