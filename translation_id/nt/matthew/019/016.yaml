id: MAT.19.16
reference: Matthew 19:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: id
  text: Lihatlah, seseorang datang mendekati-Nya dan berkata, “Guru, hal baik apa[a] yang harus kulakukan supaya aku memperoleh hidup kekal?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perbuatan baik apa”. Ungkapan Yunani τί ἀγαθὸν dapat berarti “hal baik apa” atau, bersama kata “melakukan”, menyiratkan “perbuatan baik apa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Lihatlah
  rationale: Menghadirkan daya penarik perhatian dari ἰδού secara wajar dalam narasi Indonesia. Καί berfungsi menghubungkan kelanjutan adegan dan tidak perlu diterjemahkan secara kaku sebagai “dan” pada awal kalimat.
- source_word: εἷς
  choice: seseorang
  rationale: Mempertahankan ketidakspesifikan bentuk Yunani dan tidak memasukkan jenis kelamin atau keterangan bahwa orang itu kaya dan muda sebelum teks sendiri menyatakannya.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: datang mendekati-Nya dan berkata
  rationale: Menyampaikan gerak mendekat yang mendahului perkataan dengan susunan Indonesia yang alami. Akhiran “-Nya” mempertahankan rujukan pronominal tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Padanan langsung dan lazim untuk sapaan kepada seorang pengajar.
- source_word: τί ἀγαθὸν
  choice: hal baik apa
  rationale: Mempertahankan keluasan ungkapan netral tunggal Yunani, yang dapat menunjuk pada suatu hal baik atau, bersama kata kerja ποιέω, pada perbuatan baik.
- source_word: ποιήσω
  choice: yang harus kulakukan
  rationale: Menyampaikan daya pertanyaan deliberatif secara alami tanpa menambahkan kesimpulan teologis tentang jasa atau keselamatan.
- source_word: ἵνα σχῶ
  choice: supaya aku memperoleh
  rationale: “Supaya” mempertahankan hubungan tujuan, sedangkan “memperoleh” mengungkapkan makna kontekstual σχῶ secara lebih alami daripada “memiliki” dalam bahasa Indonesia.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan Indonesia yang mapan, ringkas, dan tepat bagi ungkapan ini.
theological_decisions:
- issue: Identitas orang yang berbicara
  choice: seseorang
  alternative: seorang laki-laki; seorang muda yang kaya
  rationale: Ayat ini hanya menyebut εἷς dan belum menyatakan jenis kelamin, usia, atau kekayaannya. Keterangan dari konteks kemudian atau bagian paralel tidak dimasukkan lebih awal.
- issue: Hubungan tindakan yang ditanyakan dengan hidup kekal
  choice: hal baik apa yang harus kulakukan supaya aku memperoleh hidup kekal?
  alternative: perbuatan baik apa yang harus kulakukan untuk mendapatkan hidup kekal?
  rationale: Terjemahan mempertahankan bentuk pertanyaan yang berorientasi pada tindakan serta hubungan tujuan yang dinyatakan ἵνα, tanpa memutuskan apakah tindakan itu berjasa atau bagaimana pertanyaan tersebut harus dinilai secara doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Lihatlah” mempertahankan kejelasan serta daya hidup naratif teks sumber; “seseorang” menghindari penambahan informasi; bentuk “kulakukan” sesuai dengan tuturan langsung yang wajar.
