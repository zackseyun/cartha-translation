  source_fidelity: 'Terjemahan secara setia menyampaikan unsur-unsur Yunani: penanda perhatian ἰδού, subjek tak tentu εἷς tanpa menambahkan identitasnya, tindakan mendekat sebelum ujaran, sapaan Διδάσκαλε, pertanyaan mengenai τί ἀγαθὸν ποιήσω, serta klausa tujuan ἵνα σχῶ ζωὴν αἰώνιον. “Supaya aku memperoleh hidup kekal” merupakan padanan kontekstual yang dapat diterima untuk σκοπός ἵνα dan σχῶ dalam pertanyaan ini, tanpa menambahkan penilaian teologis.'
  naturalness: Bahasa Indonesia modern, jelas, dan wajar dalam tuturan langsung. “Seseorang datang mendekati-Nya dan berkata” mengalir alami serta cukup mempertahankan urutan tindakan-partisipial teks sumber. “Hal baik apa yang harus kulakukan” juga idiomatis dan tetap terbuka sebagaimana ungkapan Yunani.
