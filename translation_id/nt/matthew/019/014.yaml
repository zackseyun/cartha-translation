revisions:
- from: Namun Yesus berkata, “Biarkanlah anak-anak itu datang kepada-Ku dan jangan menghalangi mereka, sebab orang-orang seperti merekalah yang memiliki Kerajaan Surga.[a]”
  to: Namun Yesus berkata, “Biarkanlah anak-anak itu datang kepada-Ku dan jangan menghalangi mereka datang kepada-Ku, sebab Kerajaan Surga adalah milik orang-orang seperti mereka.[a]”
  rationale: Revisi memulihkan pelengkap infinitif “datang kepada-Ku” dalam larangan, sehingga kedua perintah mencerminkan teks Yunani secara lengkap. Predikasi akhir diubah menjadi bentuk Indonesia yang lebih alami, sambil mempertahankan ambiguitas yang disengaja tentang apakah “orang-orang seperti mereka” hanya mencakup anak-anak yang hadir atau juga suatu golongan yang lebih luas. Catatan kaki dipertahankan pada klausa yang dijelaskannya dan diperbarui agar sesuai dengan terjemahan revisi.
