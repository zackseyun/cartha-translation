id: MAT.19.14
reference: Matthew 19:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: id
  text: Namun Yesus berkata, “Biarkanlah anak-anak itu datang kepada-Ku dan jangan menghalangi mereka datang kepada-Ku, sebab Kerajaan Surga adalah milik orang-orang seperti mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebab milik orang-orang seperti itulah Kerajaan Surga.” Ungkapan “orang-orang seperti mereka” dapat menunjuk bukan hanya kepada anak-anak yang hadir, tetapi juga kepada orang-orang semacam mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Biarkanlah
  rationale: Dalam konteks ini, bentuk perintah dari ἀφίημι menyatakan pemberian izin, bukan meninggalkan. “Biarkanlah” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: τὰ παιδία
  choice: anak-anak itu
  rationale: παιδία menunjuk kepada anak-anak yang hadir dalam adegan tersebut. “Anak-anak itu” akurat tanpa mempersempitnya menjadi bayi atau menambahkan penekanan diminutif yang tidak wajib.
- source_word: μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με
  choice: jangan menghalangi mereka
  rationale: Dengan klausa sebelumnya, tujuan kedatangan sudah dinyatakan secara alami; “jangan menghalangi mereka” menyampaikan larangan κωλύω tanpa pengulangan canggung dalam bahasa Indonesia.
- source_word: τῶν ... τοιούτων
  choice: orang-orang seperti merekalah
  rationale: τοιοῦτος mencakup anak-anak yang hadir sekaligus dapat menunjuk kepada orang-orang dari jenis seperti mereka. Bentuk ini mempertahankan daya representatifnya tanpa menentukan sifat yang dimaksud.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ungkapan khas Matius ini diterjemahkan dengan bentuk Indonesia yang lazim, jelas, dan wajar.
- source_word: ἐστὶν
  choice: yang memiliki
  rationale: Konstruksi genitif τῶν τοιούτων dengan ἐστίν secara idiomatis menyatakan bahwa kerajaan itu menjadi bagian atau milik orang-orang demikian. “Yang memiliki” menyampaikan relasi tersebut dengan jelas tanpa menyamakan mereka dengan kerajaan.
theological_decisions:
- issue: Apakah τοιούτων hanya menunjuk kepada anak-anak yang hadir atau juga kepada orang-orang seperti mereka
  choice: orang-orang seperti merekalah
  alternative: anak-anak inilah; orang-orang yang bersifat seperti anak-anak
  rationale: Bahasa Yunani menunjuk melampaui individu yang hadir kepada golongan seperti mereka, tetapi tidak menjelaskan kualitas apa yang dimaksud. Terjemahan ini mempertahankan ketegangan tersebut dan tidak menambahkan gagasan khusus seperti kepolosan, kerendahan hati, atau iman sederhana.
- issue: Cara menyatakan genitif kepemilikan dalam τῶν ... τοιούτων ἐστὶν ἡ βασιλεία
  choice: orang-orang seperti merekalah yang memiliki Kerajaan Surga
  alternative: orang-orang seperti merekalah yang empunya Kerajaan Surga; karena bagi orang-orang seperti merekalah Kerajaan Surga
  rationale: Bentuk pilihan menyampaikan nilai kepemilikan/keanggotaan secara wajar dalam bahasa Indonesia modern. Catatan kaki mempertahankan susunan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel “-lah” mempertahankan tekanan perintah dan penegasan Yunani secara alami. Kapitalisasi “Kerajaan Surga” mengikuti pemakaian religius Indonesia yang lazim.
