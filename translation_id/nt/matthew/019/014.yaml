review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menangkap perintah untuk membiarkan anak-anak datang dan alasan tentang Kerajaan Surga. Namun, larangan μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με secara eksplisit melarang menghalangi mereka datang kepada Yesus; unsur ini sebaiknya tetap hadir dalam klausa larangan. Selain itu, “orang-orang seperti merekalah yang memiliki Kerajaan Surga” kurang alami dan dapat terdengar seolah-olah mereka secara aktif memiliki kerajaan itu, sedangkan konstruksi Yunani lebih wajar dinyatakan sebagai kepunyaan atau peruntukan Kerajaan Surga bagi orang-orang demikian.
  naturalness: “Biarkanlah” dan “anak-anak itu” sesuai dengan bahasa Indonesia modern yang bermartabat. Kalimat menjadi lebih lancar dan jelas bila “jangan menghalangi mereka” dilengkapi menjadi “jangan menghalangi mereka datang kepada-Ku,” dan predikasi akhir diubah menjadi “Kerajaan Surga adalah milik orang-orang seperti mereka.”
  terminology: “Yesus,” “Kerajaan Surga,” dan “anak-anak” tepat serta konsisten dengan register Alkitab bahasa Indonesia. “Orang-orang seperti mereka” mempertahankan cakupan representatif τοιούτων tanpa menentukan kualitas rohani tertentu.
  issues:
  - severity: medium
    issue: Klausa larangan tidak secara eksplisit memuat tindakan “datang kepada-Ku.”
    rationale: 'Dalam bahasa Yunani, αὐτὰ ἐλθεῖν πρός με adalah pelengkap κωλύετε: “jangan menghalangi mereka datang kepada-Ku.” Meskipun draf dapat dipahami dari klausa sebelumnya, penghilangan ini mengurangi penegasan larangan dalam sumber.'
  - severity: low
    issue: “Orang-orang seperti merekalah yang memiliki Kerajaan Surga” kurang idiomatis dan terlalu aktif dalam nuansa kepemilikan.
    rationale: τῶν ... τοιούτων ἐστὶν ἡ βασιλεία menyatakan bahwa Kerajaan Surga adalah milik/bagi orang-orang seperti itu. Susunan nominal “Kerajaan Surga adalah milik ...” lebih alami dan lebih dekat pada konstruksi sumber.
  revised_text: Namun Yesus berkata, “Biarkanlah anak-anak itu datang kepada-Ku dan jangan menghalangi mereka datang kepada-Ku, sebab Kerajaan Surga adalah milik orang-orang seperti mereka.[a]”
