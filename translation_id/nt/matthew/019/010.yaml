id: MAT.19.10
reference: Matthew 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: id
  text: Murid-murid-Nya berkata kepada-Nya, “Jika demikian halnya seorang laki-laki dengan istrinya,[a] lebih baik tidak menikah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika demikian keadaan seorang laki-laki dengan seorang istri.” Ungkapan Yunani ini padat; kata yang diterjemahkan “halnya” juga dapat berarti “perkara” atau “keadaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Bentuk kini Yunani berfungsi sebagai present historis dalam narasi; bentuk lampau tidak wajib ditandai secara morfologis dalam bahasa Indonesia.
- source_word: οἱ μαθηταί
  choice: murid-murid-Nya
  rationale: ‘Murid’ adalah istilah Injil yang baku dan alami; akhiran posesif memperjelas bahwa mereka murid Yesus sesuai konteks.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Jika demikian halnya
  rationale: Ungkapan ini secara idiomatis mempertahankan daya kondisional οὕτως dan keluasan makna αἰτία sebagai hal, keadaan, atau perkara.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: hubungan seorang laki-laki dengan istrinya
  rationale: Konteksnya adalah perkawinan; ‘laki-laki’ mempertahankan rujukan maskulin, sedangkan γυνή secara wajar berarti ‘istri’ di sini. ‘Hubungan’ membuat konstruksi Yunani yang padat dapat dipahami tanpa menentukan αἰτία terlalu sempit.
- source_word: οὐ συμφέρει
  choice: lebih baik tidak
  rationale: Dalam konteks pertimbangan praktis, ungkapan Indonesia ini menyampaikan bahwa menikah dianggap tidak menguntungkan atau tidak layak dipilih, tanpa nada teknis atau kaku.
- source_word: γαμῆσαι
  choice: menikah
  rationale: Padanan infinitif yang alami dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Bahasa bergender dalam τοῦ ἀνθρώπου ... τῆς γυναικός
  choice: seorang laki-laki dengan istrinya
  alternative: seseorang dengan pasangannya
  rationale: Konteks langsung membahas perkawinan dengan rujukan eksplisit kepada laki-laki dan istri; terjemahan mempertahankan bingkai tersebut dan tidak menetralkannya.
- issue: Penilaian para murid dalam οὐ συμφέρει γαμῆσαι
  choice: lebih baik tidak menikah
  alternative: tidak bermanfaat untuk menikah
  rationale: Terjemahan menyajikan kesimpulan pragmatis para murid tanpa menjadikannya ajaran normatif narator; ketegangan dengan jawaban Yesus pada ayat berikutnya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Bentuk ‘Murid-murid-Nya’ mengikuti konvensi penghormatan dalam penerjemahan Alkitab Indonesia. Catatan kaki mempertahankan kepadatan dan ambiguitas ungkapan Yunani tanpa membebani teks utama.
