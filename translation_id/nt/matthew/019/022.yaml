id: MAT.19.22
reference: Matthew 19:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: id
  text: Namun, ketika orang muda itu mendengar perkataan tersebut[a], ia pergi dengan sedih[b], sebab ia memiliki banyak harta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan itu.” Yang dimaksud ialah perkataan Yesus sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam keadaan berduka.” Bentuk Yunaninya menggambarkan bahwa ia pergi dalam keadaan sedih.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoristus dipahami secara temporal dan diterjemahkan secara alami untuk menunjukkan urutan peristiwa.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang bernuansa kontras antara tuntutan Yesus sebelumnya dan tanggapan orang muda itu.
- source_word: ὁ νεανίσκος
  choice: orang muda itu
  rationale: Istilah Yunani berarti orang muda; terjemahan ini tidak memasukkan sebutan 'pemimpin' dari kisah paralel.
- source_word: τὸν λόγον
  choice: perkataan tersebut
  rationale: Dalam konteks, λόγος menunjuk pada perkataan Yesus yang baru saja disampaikan. 'Tersebut' memperjelas rujukan tanpa menambah isi.
- source_word: ἀπῆλθεν
  choice: ia pergi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan tindakan meninggalkan tempat itu.
- source_word: λυπούμενος
  choice: dengan sedih
  rationale: Partisip kini menggambarkan keadaan yang menyertai kepergiannya; frasa ini mempertahankan nuansa kesedihan secara alami.
- source_word: ἦν γὰρ ἔχων
  choice: sebab ia memiliki
  rationale: Bentuk perifrastik menyatakan keadaan kepemilikan yang berkelanjutan; bahasa Indonesia secara wajar mengungkapkannya dengan 'ia memiliki'.
- source_word: κτήματα πολλά
  choice: banyak harta
  rationale: κτήματα mengacu pada milik atau harta, sedangkan πολλά menekankan jumlah yang banyak. 'Banyak harta' jelas dan idiomatis.
theological_decisions:
- issue: Apakah identifikasi 'pemimpin' dari kisah paralel perlu dimasukkan
  choice: Menerjemahkan νεανίσκος hanya sebagai 'orang muda'
  alternative: orang muda yang menjadi pemimpin
  rationale: Teks Matius pada ayat ini hanya menyebutnya sebagai orang muda. Menambahkan 'pemimpin' akan menyelaraskan ayat ini dengan Lukas, bukan menerjemahkan redaksi Matius secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Orang muda' lebih alami daripada 'pemuda' dalam konteks naratif ini; 'banyak harta' mempertahankan penekanan Yunani pada kuantitas.
