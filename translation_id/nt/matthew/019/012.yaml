id: MAT.19.12
reference: Matthew 19:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: id
  text: Sebab ada orang kasim yang lahir demikian dari rahim ibunya, ada orang kasim yang dijadikan kasim oleh manusia, dan ada orang kasim yang menjadikan dirinya kasim demi Kerajaan Surga.[a] Siapa yang sanggup menerima hal ini, hendaklah ia menerimanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini dapat diterjemahkan lebih eksplisit sebagai “mengebiri dirinya sendiri”; banyak penafsir memahaminya secara kiasan sebagai memilih hidup selibat demi Kerajaan Allah.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “Siapa yang sanggup memberi tempat bagi hal ini, hendaklah ia memberi tempat baginya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: orang kasim
  rationale: Istilah Yunani ini menunjuk pada kasim sebagai suatu kategori, baik yang demikian sejak lahir, dijadikan demikian oleh orang lain, maupun menjadikan dirinya demikian. Pemakaian yang konsisten mempertahankan pengulangan sumber dan tidak langsung menafsirkannya sebagai orang yang hidup selibat.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: lahir demikian dari rahim ibunya
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Yunani serta hubungan οὕτως dengan keadaan yang baru disebutkan, namun tetap wajar dalam bahasa Indonesia modern.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: dijadikan kasim oleh manusia
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan εὐνοῦχοι. Kata 'dikebiri' lebih eksplisit secara anatomis, tetapi dapat mempersempit cakupan sosial istilah sumber.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: menjadikan dirinya kasim
  rationale: Bentuk aktif refleksif diterjemahkan secara langsung untuk mempertahankan ungkapan sumber yang tajam tanpa memutuskan apakah maksudnya harfiah, hiperbolis, atau kiasan.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: demi Kerajaan Surga
  rationale: Kata 'demi' menyampaikan tujuan atau motivasi διά dengan akusatif secara ringkas dan alami.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Siapa yang sanggup menerima hal ini, hendaklah ia menerimanya
  rationale: Di sini χωρέω berarti memberi ruang bagi atau menerima suatu ajaran yang berat. 'Menerima' menyampaikan makna idiomatisnya, sedangkan 'hendaklah' mempertahankan daya imperatif.
theological_decisions:
- issue: Apakah εὐνούχισαν ἑαυτοὺς dimaksudkan secara harfiah atau kiasan
  choice: Mempertahankan bentuk leksikal 'menjadikan dirinya kasim' dalam teks utama.
  alternative: '''mengebiri dirinya sendiri'' atau ''memilih hidup selibat/tidak menikah'''
  rationale: Ayat ini tidak menjelaskan apakah kategori ketiga bersifat harfiah, hiperbolis, atau kiasan untuk pelepasan sukarela dari perkawinan. Terjemahan tidak menyelesaikan ketegangan tersebut secara diam-diam.
- issue: Makna χωρεῖν dalam seruan penutup
  choice: menerima hal ini
  alternative: '''menampung hal ini'' atau ''memberi tempat bagi hal ini'''
  rationale: Kata 'menerima' merupakan ungkapan Indonesia yang paling alami untuk kesediaan memahami dan menjalankan ajaran yang sulit, tanpa mengubah daya seruannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Orang kasim' dipilih daripada 'sida-sida' yang kini terasa lebih arkais. Pengulangan 'kasim' dipertahankan untuk mencerminkan struktur retoris teks Yunani.
