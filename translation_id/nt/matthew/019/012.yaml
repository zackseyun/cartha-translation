  verdict: approve
  source_fidelity: Teks Indonesia secara setia mempertahankan tiga pengulangan εὐνοῦχοι sebagai “orang kasim,” termasuk bentuk refleksif yang sengaja tidak menuntaskan apakah kategori ketiga harfiah atau kiasan. “Lahir demikian dari rahim ibunya,” “dijadikan kasim oleh manusia,” dan “demi Kerajaan Surga” mencerminkan unsur-unsur Yunani dengan baik. Penutup “Siapa yang sanggup menerima hal ini, hendaklah ia menerimanya” menyampaikan fungsi idiomatis χωρεῖν serta daya imperatif χωρείτω.
  naturalness: Bahasa Indonesia modern, jelas, dan cukup lugas. Pengulangan “orang kasim” dan “menerima” memang disengaja untuk mencerminkan retorika serta pengulangan leksikal sumber, dan tidak terasa tidak wajar dalam register Alkitab modern.
  terminology: “Orang kasim” adalah padanan modern yang tepat dan konsisten untuk εὐνοῦχοι; “Kerajaan Surga” mempertahankan istilah khas Matius τῶν οὐρανῶν. Catatan a dengan tepat menyajikan “mengebiri dirinya sendiri” sebagai pengungkapan yang lebih eksplisit dan mencatat pembacaan kiasan tanpa menjadikannya teks utama. Penanda catatan kaki ditempatkan pada klausa yang relevan dalam teks Indonesia.
