id: MAT.19.29
reference: Matthew 19:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: id
  text: Dan setiap orang yang telah meninggalkan rumah, saudara laki-laki, saudara perempuan, ayah, ibu, istri[a], anak-anak, atau ladang demi nama-Ku akan menerima seratus kali lipat dan akan mewarisi hidup yang kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa manuskrip kuno tidak mencantumkan “istri”.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: setiap orang yang
  rationale: Ungkapan ini bersifat distributif dan umum, mencakup tiap orang yang memenuhi keadaan yang disebutkan.
- source_word: ἀφῆκεν
  choice: telah meninggalkan
  rationale: Menunjukkan tindakan meninggalkan yang telah terjadi dan tetap relevan; pilihan ini tidak sekeras 'menelantarkan'.
- source_word: οἰκίας
  choice: rumah
  rationale: Dalam bahasa Indonesia, bentuk 'rumah' setelah verba ini dapat mencakup satu atau beberapa rumah tanpa harus diberi penanda jamak, serta mempertahankan sisi konkret dari harta milik.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: saudara laki-laki, saudara perempuan
  rationale: Kedua istilah kekerabatan disebut secara terpisah dalam bahasa Yunani dan karena itu dipertahankan secara eksplisit.
- source_word: πατέρα ἢ μητέρα
  choice: ayah, ibu
  rationale: Padanan kekerabatan yang langsung, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: γυναῖκα
  choice: istri
  rationale: Dalam daftar hubungan keluarga, γυνή paling wajar menunjuk kepada istri, bukan perempuan secara umum.
- source_word: τέκνα
  choice: anak-anak
  rationale: Padanan lazim untuk keturunan atau anak dalam daftar keluarga.
- source_word: ἀγρούς
  choice: ladang
  rationale: Menjaga gambaran konkret tentang lahan pertanian dan dimensi ekonomi dalam daftar tersebut.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: demi nama-Ku
  rationale: Mempertahankan idiom sumber tentang 'nama' sekaligus mengungkapkan alasan dan kesetiaan kepada Yesus secara alami.
- source_word: ἑκατονταπλασίονα
  choice: seratus kali lipat
  rationale: Padanan Indonesia yang wajar dan langsung untuk besaran seratus kali, tanpa mengurangi daya ungkap janji itu.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: akan mewarisi hidup yang kekal
  rationale: Mempertahankan metafora warisan dan urutan gagasan sumber dengan bahasa Indonesia yang lazim.
theological_decisions:
- issue: Makna γυνή dalam daftar pelepasan demi pemuridan
  choice: istri
  alternative: perempuan
  rationale: Konteksnya adalah daftar anggota keluarga dan milik; 'istri' mempertahankan hubungan rumah tangga yang dimaksud tanpa menyiratkan pelepasan terhadap perempuan secara umum.
- issue: Ungkapan ἕνεκεν τοῦ ὀνόματός μου
  choice: demi nama-Ku
  alternative: demi Aku
  rationale: Menyimpan istilah 'nama' mempertahankan bobot idiom dan kaitannya dengan pribadi, kewibawaan, serta identitas Yesus, tanpa menjelaskannya secara berlebihan.
- issue: Daya ungkap ἑκατονταπλασίονα
  choice: seratus kali lipat
  alternative: seratus kali sebanyak itu
  rationale: Pilihan ini menyampaikan kelimpahan yang dijanjikan dengan ringkas dan alami, sembari mempertahankan bentuk kuantitatif dari teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Daftar keluarga dan harta dipertahankan secara konkret; idiom 'nama-Ku', metafora 'mewarisi', dan besaran 'seratus kali lipat' tidak diparafrasakan secara teologis.
