  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: id
  text: dan berfirman, “Karena itu, seorang laki-laki akan meninggalkan ayah dan ibunya dan bersatu dengan istrinya[a], dan keduanya akan menjadi satu daging?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dilekatkan kepada istrinya” atau “melekat pada istrinya.” Kata kerja Yunani ini menyatakan keterikatan yang erat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Karena itu
  rationale: Ungkapan sebab atau dasar yang alami dalam bahasa Indonesia dan tetap mempertahankan hubungan logis dengan pernyataan sebelumnya.
- source_word: καταλείψει
  choice: akan meninggalkan
  rationale: Mewakili bentuk futurum dalam kutipan Kitab Suci dengan bahasa Indonesia modern dan wajar.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Dalam kutipan mengenai perkawinan ini, bentuk maskulin tunggal menunjuk secara khusus kepada pihak laki-laki yang dipasangkan dengan istrinya.
- source_word: κολληθήσεται
  choice: bersatu dengan
  rationale: Menyampaikan keterikatan erat yang dinyatakan verba pasif κολλάομαι secara alami tanpa membatasinya pada nuansa emosional saja.
- source_word: γυναικὶ αὐτοῦ
  choice: istrinya
  rationale: Dalam konteks perkawinan, γυνή berarti istri, bukan sekadar perempuan.
- source_word: οἱ δύο
  choice: keduanya
  rationale: Mempertahankan rujukan eksplisit kepada dua pihak dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: εἰς σάρκα μίαν
  choice: menjadi satu daging
  rationale: Mempertahankan idiom penting tentang persatuan perkawinan dan nuansa hasil atau keadaan baru dalam ἔσονται ... εἰς.
theological_decisions:
- issue: Bahasa bergender dalam kutipan tentang perkawinan
  choice: seorang laki-laki ... istrinya
  alternative: seseorang ... pasangannya
  rationale: Teks Yunani dalam konteks ini secara khusus merumuskan pasangan laki-laki dan istrinya; bentuk tersebut dipertahankan tanpa digeneralisasi.
- issue: Idiom persatuan dalam perkawinan
  choice: keduanya akan menjadi satu daging
  alternative: keduanya akan menjadi satu tubuh / keduanya adalah satu daging
  rationale: “Satu daging” mempertahankan idiom sumber dan gema Kejadian, sedangkan “akan menjadi” menyatakan gerak menuju hasil persatuan tanpa menafsirkan hakikatnya secara berlebihan.
- issue: Subjek tersirat dari καὶ εἶπεν
  choice: dan berfirman
  alternative: dan berkata
  rationale: Dalam konteks Matius 19:4–5, subjek gramatikal yang berlanjut paling wajar adalah Sang Pencipta; “berfirman” sesuai untuk perkataan Allah, sambil tidak menambahkan nama subjek yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Berfirman” dipakai karena subjek kontekstualnya adalah Sang Pencipta. Istilah tradisional “satu daging” dipertahankan karena merupakan idiom teologis-relasional dari kutipan Kejadian. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
