  source_fidelity: 'Teks Indonesia menyampaikan seluruh isi pokok Yunani dengan tepat: tindakan Yesus memandang mereka, ujaran-Nya, kontras παρά + datif antara manusia dan Allah, kemustahilan, serta cakupan πάντα δυνατά. Penghilangan pengulangan eksplisit “kepada mereka” setelah “memandang mereka” wajar dalam bahasa Indonesia dan tidak mengaburkan penerima ujaran.'
