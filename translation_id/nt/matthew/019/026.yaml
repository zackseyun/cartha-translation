id: MAT.19.26
reference: Matthew 19:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: id
  text: Namun, Yesus memandang mereka dan berkata, “Bagi manusia hal ini mustahil, tetapi bagi Allah segala sesuatu mungkin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: memandang mereka
  rationale: Partisip aoris ini menyatakan bahwa Yesus mengarahkan pandangan kepada mereka. “Memandang mereka” alami dalam bahasa Indonesia dan tidak melebihkan intensitas verba.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan dengan reaksi para murid sebelumnya; “Namun” menyampaikan hubungan itu dengan wajar.
- source_word: εἶπεν αὐτοῖς
  choice: berkata
  rationale: Penerima ujaran sudah dinyatakan dalam frasa “memandang mereka”; mengulang “kepada mereka” terasa kurang alami dalam bahasa Indonesia tanpa menghilangkan rujukannya.
- source_word: παρὰ ἀνθρώποις
  choice: Bagi manusia
  rationale: παρά dengan datif menunjukkan lingkup atau pihak yang bersangkutan. “Bagi manusia” secara alami merujuk kepada umat manusia secara umum dan mempertahankan kontras dengan Allah.
- source_word: τοῦτο
  choice: hal ini
  rationale: Demonstrativa ini menunjuk pada perkara yang baru dibicarakan; “hal ini” jelas dan idiomatis.
- source_word: ἀδύνατόν ἐστιν
  choice: mustahil
  rationale: Padanan langsung dan alami bagi predikat Yunani yang berarti tidak mungkin.
- source_word: παρὰ δὲ θεῷ
  choice: tetapi bagi Allah
  rationale: Pengulangan konstruksi παρά + datif dipertahankan melalui “bagi” agar kesejajaran retoris dengan “bagi manusia” tetap tampak.
- source_word: πάντα δυνατά
  choice: segala sesuatu mungkin
  rationale: Terjemahan ini mempertahankan cakupan πάντα dan bentuk pernyataan ringkas tanpa menambahkan pembatas yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Cakupan ἀνθρώποις dalam pernyataan umum
  choice: manusia
  alternative: orang-orang; umat manusia
  rationale: Bentuk Yunani bersifat jamak, tetapi secara semantis merujuk kepada manusia secara umum. “Manusia” inklusif, ringkas, dan membentuk kontras teologis yang jelas dengan Allah.
- issue: Cakupan pernyataan πάντα δυνατά
  choice: segala sesuatu mungkin
  alternative: semuanya mungkin
  rationale: Ungkapan luas dalam teks dipertahankan tanpa menjelaskan atau membatasinya secara doktrinal; konteks terdekat tetap mengarahkan penerapannya pada keselamatan yang sedang dibicarakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kesejajaran “bagi manusia ... tetapi bagi Allah ...” dipertahankan untuk mencerminkan susunan dan kontras Yunani. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
