  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Karena kekerasan hati kalian, Musa mengizinkan kalian menceraikan istri-istri kalian,[a] tetapi sejak semula tidaklah demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyuruh istri-istri kalian pergi”; dalam konteks ini maksudnya adalah menceraikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Karena kekerasan hatimu
  rationale: Frasa ini menyatakan sebab atau dasar, sekaligus mempertahankan idiom konkret Alkitab mengenai hati yang keras.
- source_word: ἐπέτρεψεν
  choice: mengizinkan
  rationale: Kata ini menunjukkan pemberian izin atau kelonggaran, bukan perintah maupun persetujuan moral.
- source_word: ἀπολῦσαι
  choice: menceraikan
  rationale: Dalam konteks perkawinan, kata ini berarti menceraikan, meskipun secara harfiah dapat berarti menyuruh pergi.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: istrimu
  rationale: Konteks perkawinan memastikan bahwa γυναῖκας berarti istri; bentuk Indonesia ini secara wajar dapat bersifat distributif bagi para pendengar jamak.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan acuan kepada permulaan penciptaan.
- source_word: οὐ γέγονεν οὕτως
  choice: tidaklah demikian
  rationale: Terjemahan ini menyatakan keadaan yang berlaku dan menghindari kekakuan jika aspek perfek Yunani ditiru secara mekanis.
theological_decisions:
- issue: Apakah tindakan Musa merupakan perintah atau izin
  choice: Musa mengizinkan kamu
  alternative: Musa memerintahkan kamu
  rationale: ἐπέτρεψεν jelas menyatakan izin atau kelonggaran, bukan perintah; pembedaan ini penting bagi alur argumen Yesus.
- issue: Seberapa eksplisit acuan kepada tatanan penciptaan
  choice: tetapi sejak semula tidaklah demikian
  alternative: tetapi sejak semula hal itu bukanlah rancangan Allah
  rationale: Rumusan utama mempertahankan ungkapan Yunani tanpa menambahkan penjelasan teologis yang hanya tersirat dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti tunggal posesif dalam “hatimu” dan “istrimu” dipakai secara kolektif/distributif karena para pendengar dalam teks Yunani berbentuk jamak. Tanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
