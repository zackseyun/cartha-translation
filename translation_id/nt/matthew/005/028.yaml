source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: setiap orang yang memandang seorang perempuan[a] dengan maksud menginginkannya[b] sudah berzina dengan perempuan itu di dalam hatinya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai dapat berarti “perempuan” atau “istri”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan maksud bernafsu terhadapnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: Menjaga penekanan pada ἐγώ serta pertentangan yang diperkenalkan oleh δέ. Bentuk ini wajar, langsung, dan bermartabat dalam bahasa Indonesia.
- source_word: πᾶς ὁ βλέπων
  choice: Setiap orang yang memandang
  rationale: Menyampaikan cakupan umum πᾶς dan tindakan βλέπων tanpa mempersempit subjek dengan tambahan yang tidak dinyatakan secara eksplisit.
- source_word: γυναῖκα
  choice: seorang perempuan
  rationale: γυνή dapat berarti perempuan atau istri. Dalam pernyataan etis yang bersifat umum ini, 'perempuan' mempertahankan keluasan ungkapan Yunani, sedangkan konteks perzinaan tetap menunjukkan bobot seksual-etisnya.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: dengan maksud menginginkannya
  rationale: πρός dengan infinitif berartikel menyatakan tujuan atau niat terarah. 'Dengan maksud' mempertahankan unsur kesengajaan, sementara 'menginginkannya' dekat dengan keluasan makna ἐπιθυμέω; konteks menjelaskan bahwa yang dimaksud ialah hasrat seksual yang salah.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: sudah berzina dengan perempuan itu
  rationale: '''Sudah'' menerjemahkan ἤδη dan menegaskan bahwa pelanggaran tersebut telah terjadi pada tingkat batin. ''Berzina dengan'' merupakan ungkapan Indonesia yang alami untuk μοιχεύω dengan objek αὐτήν.'
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: di dalam hatinya
  rationale: Mempertahankan metafora καρδία sebagai pusat pikiran, kehendak, dan hasrat batin, sekaligus tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah γυνή diterjemahkan sebagai 'perempuan' atau 'istri'
  choice: perempuan
  alternative: istri
  rationale: Teks Yunani tidak menentukan status perkawinan perempuan itu secara eksplisit. 'Perempuan' tidak mempersempit pernyataan melampaui sumber, sedangkan kemungkinan makna 'istri' dicatat dalam catatan kaki.
- issue: Apakah ἐπιθυμέω diterjemahkan dengan istilah hasrat seksual yang eksplisit atau dengan kata yang lebih luas
  choice: menginginkannya
  alternative: bernafsu terhadapnya
  rationale: ἐπιθυμέω memiliki rentang makna lebih luas daripada nafsu seksual, tetapi konteks perzinaan memberinya arah seksual yang salah di sini. Terjemahan utama mempertahankan keluasan leksikal, dan alternatif yang lebih eksplisit dicatat.
- issue: Apakah frasa πρὸς τὸ ἐπιθυμῆσαι hanya menyatakan akibat atau tujuan yang disengaja
  choice: tujuan atau maksud yang disengaja
  alternative: sekadar akibat dari memandang
  rationale: Konstruksi πρὸς τό dengan infinitif secara wajar menyatakan tujuan. Karena itu, terjemahan 'dengan maksud' menghindari pemahaman bahwa setiap pandangan yang tanpa sengaja disertai ketertarikan otomatis merupakan hal yang sama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan langsung dan nada ajaran yang khidmat. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ucapan Yesus. Susunan kalimat mempertahankan kontras, unsur kesengajaan, dan penekanan pada pelanggaran batin tanpa menambahkan penjelasan denominasi.
