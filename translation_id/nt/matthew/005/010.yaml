  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan struktur dan makna Yunani: μακάριοι sebagai deklarasi ucapan bahagia, partisipel perfek pasif οἱ δεδιωγμένοι sebagai orang yang dianiaya, ἕνεκεν sebagai alasan, serta alasan penutup bahwa Kerajaan Surga milik mereka. Bentuk umum “orang yang dianiaya” wajar dalam bahasa Indonesia dan tidak menghilangkan aspek keadaan hasil dari perfek secara berarti.'
  naturalness: “Berbahagialah orang yang dianiaya karena kebenaran, sebab Kerajaan Surga adalah milik mereka” terdengar alami, lugas, dan bermartabat dalam bahasa Indonesia modern. Susunan kalimatnya cocok untuk gaya ucapan bahagia tanpa menjadi kuno atau kaku.
