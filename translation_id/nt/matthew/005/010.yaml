id: MAT.5.10
reference: Matthew 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: id
  text: Berbahagialah orang yang dianiaya karena kebenaran[a], sebab Kerajaan Surga adalah milik mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Yunani ini dapat mencakup hidup benar di hadapan Allah maupun keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku dalam ucapan bahagia yang menyatakan keadaan diberkati, bukan sekadar perasaan senang.
- source_word: οἱ δεδιωγμένοι
  choice: orang yang dianiaya
  rationale: Partisipel perfek pasif substantival menunjuk kepada mereka yang telah mengalami penganiayaan dan berada dalam keadaan sebagai orang yang teraniaya; bentuk Indonesia ini alami tanpa membatasi waktunya secara berlebihan.
- source_word: ἕνεκεν
  choice: karena
  rationale: Menyampaikan alasan atau sebab penganiayaan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam konteks Matius, istilah ini mencakup hidup benar yang selaras dengan kehendak Allah; nuansa 'keadilan' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan dasar bagi pernyataan berbahagia dengan hubungan penjelas yang jelas.
- source_word: αὐτῶν ἐστιν
  choice: adalah milik mereka
  rationale: Mengungkapkan konstruksi kepemilikan Yunani secara alami sambil mempertahankan penekanan pada 'mereka'.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan Indonesia yang baku dan alami bagi ungkapan khas Matius tentang pemerintahan atau kerajaan Allah yang berasal dari surga.
theological_decisions:
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Konteks ucapan bahagia terutama menunjuk pada kehidupan benar sesuai kehendak Allah, tetapi kata Yunani ini juga dapat menonjolkan keadilan; ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'Berbahagialah' mempertahankan corak deklaratif ucapan bahagia, sedangkan 'orang yang dianiaya' terdengar alami dan tidak memaksakan batas waktu yang tidak lazim dalam bahasa Indonesia.
source_grounding:
  english_pob_role: consult_only
