id: MAT.5.19
reference: Matthew 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: id
  text: Karena itu, siapa pun yang meniadakan[a] salah satu dari perintah-perintah yang paling kecil ini dan mengajar orang lain berbuat demikian akan disebut yang paling kecil dalam Kerajaan Surga. Namun, siapa pun yang melakukannya dan mengajarkannya, dialah yang akan disebut besar dalam Kerajaan Surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melonggarkan daya ikat” atau “membatalkan”. Kata Yunani ini secara harfiah berarti “melepaskan” dan di sini menunjuk pada tindakan melemahkan atau memperlakukan suatu perintah sebagai tidak mengikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pernyataan sebelumnya tentang Taurat dengan penghubung yang alami dan bernada formal dalam bahasa Indonesia.
- source_word: λύσῃ
  choice: meniadakan
  rationale: Dalam konteks perintah, λύω menunjuk pada tindakan melepaskan daya ikat atau memperlakukan perintah sebagai tidak berlaku. 'Meniadakan' mempertahankan nuansa hukum ini tanpa membatasinya hanya pada pelanggaran pribadi.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: salah satu dari perintah-perintah yang paling kecil ini
  rationale: Mencerminkan konstruksi partitif dan penggolongan sejumlah perintah sebagai yang paling kecil, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: mengajar orang lain berbuat demikian
  rationale: οὕτως mengacu kembali pada tindakan meniadakan perintah, sedangkan ἀνθρώπους bersifat generik. 'Orang lain' menyampaikan cakupan manusia secara umum dengan alami.
- source_word: ἐλάχιστος κληθήσεται
  choice: akan disebut yang paling kecil
  rationale: Mempertahankan bentuk pasif κληθήσεται dan superlatif ἐλάχιστος. Kata 'yang' diperlukan agar ungkapan berfungsi alami sebagai sebutan dalam bahasa Indonesia.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dalam Kerajaan Surga
  rationale: Padanan baku dan idiomatis bagi ungkapan khas Matius; bentuk jamak Yunani οὐρανῶν tidak perlu diterjemahkan secara kaku sebagai 'surga-surga'.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: melakukannya dan mengajarkannya
  rationale: Menerjemahkan kedua verba secara langsung, dengan objek pronominal yang merujuk kepada perintah-perintah tersebut.
- source_word: οὗτος
  choice: dialah
  rationale: Bentuk demonstratif yang ditekankan dipertahankan melalui 'dialah', sehingga kontras dengan orang pada klausa pertama tetap jelas.
- source_word: μέγας
  choice: besar
  rationale: Padanan langsung yang mempertahankan kontras dengan 'yang paling kecil' tanpa menafsirkannya sebagai peringkat teknis tertentu.
theological_decisions:
- issue: Status 'yang paling kecil/besar' dalam Kerajaan Surga
  choice: Mempertahankan pernyataan sebagai status di dalam Kerajaan Surga tanpa menjelaskan mekanisme keselamatan atau pahala.
  alternative: Menafsirkan 'yang paling kecil' sebagai orang yang dikeluarkan dari Kerajaan, atau 'besar' sebagai tingkat pahala teknis.
  rationale: Teks mengatakan bahwa orang itu akan disebut paling kecil 'dalam Kerajaan Surga'. Terjemahan tidak boleh menyelesaikan perdebatan teologis yang tidak diselesaikan oleh ayat ini.
- issue: Rujukan generik τοὺς ἀνθρώπους
  choice: orang lain
  alternative: manusia atau orang-orang
  rationale: Dalam konteks ini bentuk maskulin jamak Yunani merujuk kepada manusia secara umum. 'Orang lain' alami dalam bahasa Indonesia dan memperjelas bahwa mereka diajar untuk bertindak dengan cara yang sama.
- issue: Cakupan objek pada ποιήσῃ καὶ διδάξῃ
  choice: melakukannya dan mengajarkannya, dengan '-nya' merujuk pada perintah-perintah tersebut
  alternative: menaati dan mengajarkan perintah-perintah itu
  rationale: Pilihan ini tetap dekat dengan verba umum ποιέω dan tidak menambahkan nuansa penafsiran yang lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel kedua klausa dipertahankan, sedangkan 'dialah' membawa penekanan demonstratif οὗτος secara alami. Huruf kapital pada 'Kerajaan Surga' dipakai sebagai sebutan khas dalam konteks Matius.
