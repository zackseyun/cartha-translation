  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: id
  text: Kalian telah mendengar bahwa pernah dikatakan,[a] “Kasihilah sesamamu dan bencilah musuhmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian pertama menggemakan Imamat 19:18. Bagian kedua, “dan bencilah musuhmu,” bukan kutipan langsung dari Perjanjian Lama, melainkan mencerminkan ajaran yang telah diterima dan yang sedang dikoreksi Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Kalian telah mendengar
  rationale: Bentuk aoris dalam rumusan pengajaran ini secara alami menyatakan ajaran yang sebelumnya telah diterima para pendengar. Kata ganti jamak eksplisit memperjelas bahwa Yesus menyapa banyak orang.
- source_word: ἐρρέθη
  choice: telah dikatakan
  rationale: Bentuk pasif dipertahankan tanpa menentukan siapa yang mengatakannya.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk future indikatif berfungsi sebagai perintah dalam bahasa kutipan; imperatif Indonesia menyampaikan daya perintah itu dengan wajar.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: Dalam konteks etis dan gema Imamat 19:18, 'sesamamu' merupakan padanan Indonesia yang mapan dan alami untuk πλησίον.
- source_word: μισήσεις
  choice: bencilah
  rationale: Bentuk ini sejajar dengan Ἀγαπήσεις dan juga berdaya perintah; imperatif mempertahankan kesejajaran tersebut.
- source_word: τὸν ἐχθρόν σου
  choice: musuhmu
  rationale: Padanan langsung dan lazim bagi ἐχθρός dalam pertentangan etis ini.
theological_decisions:
- issue: Status frasa 'dan bencilah musuhmu'
  choice: Menampilkannya sebagai bagian dari perkataan yang menurut Yesus telah didengar para pendengar, tanpa menyatakannya sebagai kutipan langsung Kitab Suci.
  alternative: Memperlakukan seluruh perkataan sebagai kutipan langsung Perjanjian Lama, atau menandai frasa kedua sebagai tradisi tafsiran di dalam teks utama.
  rationale: Teks Yunani menyajikan satu perkataan yang dilaporkan sesudah 'telah dikatakan'. Namun, hanya bagian pertama yang menggemakan Imamat 19:18; catatan kaki menjaga pembedaan ini tanpa mengubah struktur perkataan dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak yang tersirat dalam verba Yunani; bentuk perintah 'kasihilah' dan 'bencilah' menjaga kesejajaran retoris.
