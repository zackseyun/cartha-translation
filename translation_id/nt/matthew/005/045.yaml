reference: Matthew 5:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: id
  text: supaya kamu menjadi anak-anak[a] Bapamu yang di surga[b], sebab Ia menerbitkan matahari-Nya atas orang-orang jahat dan orang-orang baik, serta menurunkan hujan atas orang-orang benar dan orang-orang yang tidak benar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki”; dalam konteks ini bentuk jamak Yunani dapat mencakup para murid secara umum.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di surga-surga”; bahasa Indonesia lazim memakai bentuk tunggal “di surga”.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “menghujani orang-orang benar dan orang-orang yang tidak benar.” Ungkapan “menurunkan hujan” dipakai agar alami dalam bahasa Indonesia sambil mempertahankan Allah sebagai pelaku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: γένησθε
  choice: kamu menjadi
  rationale: Mempertahankan daya verbal γίνομαι sebagai “menjadi”, bukan meratakannya menjadi keadaan statis “adalah”.
- source_word: υἱοὶ
  choice: anak-anak
  rationale: Dalam bahasa Indonesia, “anak-anak” merupakan padanan alami bagi bentuk jamak υἱοί ketika yang dimaksud adalah hubungan filial para murid secara umum; nuansa harfiah “anak-anak lelaki” dicatat dalam catatan kaki.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Bapamu yang di surga
  rationale: Mewakili frasa genitif dan keterangan tempat secara eksplisit dan idiomatis; bentuk jamak Yunani “di surga-surga” dicatat sebagai unsur bentuk sumber.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dengan gaya Indonesia yang jelas dan bermartabat.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: Ia menerbitkan matahari-Nya
  rationale: “Menerbitkan” secara idiomatis menyatakan tindakan kausatif Allah terhadap matahari, sementara akhiran posesif mempertahankan αὐτοῦ.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: bagi orang yang jahat dan orang yang baik
  rationale: Adjektiva substantival dibuat eksplisit sebagai orang; “bagi” secara alami menyampaikan manfaat yang diterima kedua golongan tanpa mengubah kesejajarannya.
- source_word: βρέχει
  choice: menurunkan hujan
  rationale: Padanan Indonesia yang alami untuk tindakan Allah memberi hujan dan tetap mempertahankan agensi ilahi.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: bagi orang yang benar dan orang yang tidak benar
  rationale: Mempertahankan pasangan moral δίκαιος/ἄδικος dan paralelismenya tanpa menyempitkan makna pada status hukum semata.
theological_decisions:
- issue: Bahasa filial bergender
  choice: anak-anak Bapamu
  alternative: anak-anak lelaki Bapamu
  rationale: υἱοί secara bentuk berarti “anak-anak lelaki”, tetapi dalam konteks sapaan kepada para murid istilah ini berfungsi representatif. Bahasa Indonesia modern memakai “anak-anak” secara alami untuk hubungan filial umum; catatan kaki mempertahankan transparansi bentuk Yunani tanpa mengesankan bahwa hanya murid laki-laki yang dimaksud.
- issue: Daya γένησθε dalam kaitannya dengan hubungan kepada Bapa
  choice: supaya kamu menjadi
  alternative: supaya kamu terbukti sebagai
  rationale: “Menjadi” mempertahankan arti leksikal dan ketegangan teks. Terjemahan tidak menentukan bahwa tindakan etis menciptakan status adopsi, ataupun membatasi ungkapan itu hanya pada pembuktian identitas.
- issue: Pemeliharaan Allah atas orang baik dan jahat
  choice: Ia menerbitkan matahari-Nya ... serta menurunkan hujan
  alternative: matahari-Nya terbit ... dan hujan turun
  rationale: Bentuk aktif mempertahankan Allah sebagai pelaku pemberian umum kepada kedua kelompok, sebagaimana dinyatakan oleh struktur Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bapamu” menjaga keakraban bentuk orang kedua jamak tanpa menjadi percakapan rendah; “menerbitkan matahari-Nya” dan “menurunkan hujan” mempertahankan kesejajaran puitis serta agensi ilahi.
