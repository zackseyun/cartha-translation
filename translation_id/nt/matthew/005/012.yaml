id: MAT.5.12
reference: Matthew 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: id
  text: Bersukacitalah dan bergembiralah, karena upah kalian besar di surga; sebab demikianlah mereka menganiaya para nabi sebelum kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Bersukacitalah
  rationale: Imperatif kini orang kedua jamak ini menyerukan sukacita yang aktif; bentuk ini alami, bermartabat, dan cocok berpasangan dengan verba berikutnya.
- source_word: ἀγαλλιᾶσθε
  choice: bergembiralah dengan sangat
  rationale: Verba ini menyatakan kegembiraan yang meluap dan menguatkan χαίρετε; frasa ini mempertahankan intensitasnya dalam bahasa Indonesia yang mudah dipahami.
- source_word: μισθὸς
  choice: upah
  rationale: Kata ini dapat berarti upah atau ganjaran. 'Upah' mempertahankan citra leksikal yang konkret tanpa harus menyiratkan transaksi komersial semata.
- source_word: πολὺς
  choice: besar
  rationale: Adjektiva predikatif ini menyatakan besarnya upah; 'besar' merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunani harfiah jamak, dalam pemakaian Matius bentuk itu lazim menunjuk pada ranah surgawi; bahasa Indonesia secara alami memakai bentuk tunggal 'surga'.
- source_word: οὕτως
  choice: demikianlah
  rationale: 'Adverbia ini menunjuk pada kesamaan cara: para murid dianiaya sebagaimana para nabi dahulu dianiaya.'
- source_word: ἐδίωξαν
  choice: mereka menganiaya
  rationale: Dalam konteks ini διώκω jelas berarti mempersekusi atau menganiaya, bukan sekadar mengejar.
- source_word: προφήτας
  choice: nabi-nabi
  rationale: Padanan baku bagi tokoh-tokoh kenabian Israel; pengulangan nomina menyatakan bentuk jamak secara jelas.
- source_word: τοὺς πρὸ ὑμῶν
  choice: yang hidup sebelum kamu
  rationale: Frasa ini menerangkan para nabi yang mendahului para pendengar secara historis; penambahan 'hidup' membuat hubungan waktu itu alami dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Makna ἐν τοῖς οὐρανοῖς
  choice: di surga
  alternative: di langit-langit / di surga-surga
  rationale: Bentuk Yunani adalah jamak, tetapi dalam gaya Matius yang dipengaruhi pemakaian Semitis frasa ini menunjuk pada ranah surgawi. Bentuk tunggal 'surga' menyampaikan rujukannya secara wajar dalam bahasa Indonesia tanpa menetapkan doktrin tambahan.
- issue: Nuansa μισθός
  choice: upah
  alternative: ganjaran
  rationale: '''Upah'' mempertahankan metafora sumber tentang balasan yang diberikan Allah. Pilihan ini tidak dimaksudkan untuk menyatakan bahwa keselamatan diperoleh melalui transaksi jasa.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang khidmat dan mudah dipahami. Bentuk orang kedua 'kamu' dipertahankan karena konteksnya jamak, sebagaimana tampak dari verba dan pronomina Yunani, meskipun bahasa Indonesia tidak menandai jumlah pada 'kamu'.
