id: MAT.5.29
reference: Matthew 5:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: id
  text: Namun, jika mata kananmu membuatmu tersandung[a], cungkillah itu dan buanglah jauh-jauh darimu. Sebab, lebih baik bagimu jika satu anggota tubuhmu binasa daripada seluruh tubuhmu dilemparkan ke dalam Gehena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuatmu berbuat dosa.”'
    reason: lexical_alternative
  - marker: b
    text: Gehena adalah bentuk Yunani dari nama yang berkaitan dengan Lembah Hinom; secara tradisional diterjemahkan “neraka.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: membuatmu tersandung
  rationale: Mempertahankan metafora Yunani tentang tersandung, yang dalam konteks ini menunjuk pada jatuh ke dalam dosa, tanpa mempersempitnya secara diam-diam.
- source_word: ἔξελε
  choice: cungkillah
  rationale: Kata perintah ini menyampaikan tindakan mengeluarkan mata secara paksa dan mempertahankan gambaran yang keras serta mendesak.
- source_word: βάλε ἀπὸ σοῦ
  choice: buanglah jauh-jauh darimu
  rationale: Menerjemahkan baik daya perintah βάλε maupun gagasan pemisahan dalam ἀπὸ σοῦ dengan ungkapan Indonesia yang alami.
- source_word: συμφέρει
  choice: lebih baik bagimu
  rationale: Secara idiomatis menyatakan manfaat atau keuntungan dalam perbandingan yang dibangun ayat ini.
- source_word: ἀπόληται
  choice: binasa
  rationale: Mempertahankan bobot kata ἀπόλλυμι dan gagasan hilangnya satu anggota tubuh tanpa menjelaskan caranya secara berlebihan.
- source_word: μέλος
  choice: anggota tubuh
  rationale: Jelas mencakup mata sebagai bagian tubuh dan mempertahankan kontras dengan seluruh tubuh.
- source_word: βληθῇ
  choice: dilemparkan
  rationale: Mempertahankan bentuk pasif dan daya verba βάλλω dalam bahasa Indonesia modern.
- source_word: γέενναν
  choice: Gehena
  rationale: Mempertahankan istilah khusus Yunani yang berasal dari nama Lembah Hinom, alih-alih langsung meratakannya menjadi istilah teologis yang lebih umum.
- source_word: ὁ δεξιὸς
  choice: kanan
  rationale: Mempertahankan rincian eksplisit bahwa yang dimaksud ialah mata kanan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kelanjutan dengan nuansa pertentangan ringan secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Transliterasi mempertahankan istilah historis dan teologis yang khas dalam teks sumber, sementara padanan tradisional dicatat dalam catatan kaki.
- issue: Daya metaforis σκανδαλίζω
  choice: membuatmu tersandung
  alternative: membuatmu berbuat dosa
  rationale: Teks utama mempertahankan metafora sumber; makna kontekstual yang lebih eksplisit disediakan sebagai alternatif tanpa meniadakan ketegangan ungkapan asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah yang kuat serta hiperbola tubuh dipertahankan; istilah “Gehena” dijelaskan agar dapat dipahami pembaca umum.
