  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: id
  text: Berbahagialah orang yang lapar dan haus akan kebenaran[a], karena mereka akan dipuaskan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Yunani ini dapat berarti kebenaran, keadilan, atau apa yang benar di hadapan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Bentuk baku dan bermartabat untuk ucapan bahagia; menyatakan keadaan yang diperkenan dan diberkati, bukan sekadar perasaan senang.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: orang yang lapar dan haus
  rationale: Mengungkapkan gambaran jasmani serta hasrat yang terus-menerus secara alami dalam bahasa Indonesia.
- source_word: τὴν δικαιοσύνην
  choice: akan kebenaran
  rationale: Dalam idiom Indonesia, lapar dan haus 'akan' sesuatu menyatakan kerinduan mendalam. 'Kebenaran' mempertahankan cakupan moral dan relasional δικαιοσύνη, sementara kemungkinan makna 'keadilan' dicatat dalam catatan kaki.
- source_word: ὅτι
  choice: karena
  rationale: Secara jelas memperkenalkan alasan bagi pernyataan berbahagia tersebut.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Mengacu kembali secara wajar kepada kelompok yang disebut; penegasan Yunani tidak perlu dibuat berat dengan 'mereka sendiri'.
- source_word: χορτασθήσονται
  choice: akan dikenyangkan
  rationale: Mempertahankan bentuk pasif, waktu mendatang, dan gambaran lapar secara lebih konkret daripada 'akan dipuaskan'; pelaku yang mengenyangkan dibiarkan tersirat sebagaimana dalam teks Yunani.
theological_decisions:
- issue: Cakupan makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: δικαιοσύνη dapat menunjuk pada apa yang benar di hadapan Allah, kelurusan hidup, dan keadilan. Teks utama memakai istilah Indonesia yang lazim dalam konteks ini tanpa meniadakan dimensi keadilan, yang dipertahankan dalam catatan kaki.
- issue: Bentuk pasif χορτασθήσονται
  choice: akan dikenyangkan
  alternative: akan dipuaskan
  rationale: Bentuk pasif dipertahankan agar tindakan Allah tetap tersirat tanpa menambahkan nama pelaku yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'lapar dan haus akan' alami serta mempertahankan metafora; 'dikenyangkan' mengikat janji langsung pada gambaran lapar dan haus.
