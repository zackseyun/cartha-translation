  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: id
  text: Berilah kepada orang yang meminta kepadamu, dan janganlah berpaling dari orang yang ingin meminjam darimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah menolak orang yang ingin meminjam darimu.”
    reason: Alternatif leksikal yang menyatakan implikasi idiomatis μὴ ἀποστραφῇς, sementara teks utama mempertahankan gambaran harfiahnya.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: orang yang meminta
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang meminta. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan umum teks.
- source_word: δός
  choice: Berilah
  rationale: Imperatif aoris dari δίδωμι menyampaikan perintah langsung. Bentuk 'Berilah' sesuai dengan ragam bahasa Alkitab yang modern dan bermartabat tanpa menambahkan unsur kewajiban yang tidak dinyatakan.
- source_word: θέλοντα
  choice: orang yang ingin
  rationale: Partisipel kini berartikel ini bersifat substantival. 'Ingin' merupakan padanan alami bagi θέλω dalam konteks keinginan untuk meminjam.
- source_word: ἀπὸ σοῦ
  choice: darimu
  rationale: Frasa preposisional ini menunjukkan sumber, yaitu bahwa orang tersebut hendak meminjam dari pihak yang disapa.
- source_word: δανίσασθαι
  choice: meminjam
  rationale: Infinitif aoris medial dalam konteks ini berarti meminjam. Objeknya tidak disebutkan, sehingga 'meminjam' lebih tepat daripada mempersempitnya menjadi 'meminjam uang'.
- source_word: μὴ ἀποστραφῇς
  choice: janganlah berpaling
  rationale: Konstruksi μή dengan bentuk subjunktif menyatakan larangan. 'Janganlah berpaling' mempertahankan gambaran verbal ἀποστρέφω dan tetap alami dalam bahasa Indonesia; implikasinya adalah tidak menolak orang tersebut.
theological_decisions:
- issue: Cakupan dan daya perintah etis Yesus
  choice: Menerjemahkannya sebagai dua perintah langsung dengan cakupan umum, tanpa pelunakan atau pembatasan yang tidak terdapat dalam teks Yunani.
  alternative: Membatasi perintah hanya kepada peminta yang dianggap layak, atau menerjemahkan bagian kedua secara interpretatif sebagai 'janganlah menolak'.
  rationale: Ayat ini menyampaikan perintah yang lugas dalam Khotbah di Bukit. Terjemahan perlu mempertahankan daya etis dan keumumannya tanpa memasukkan persyaratan yang tidak dinyatakan, sekaligus menjaga metafora 'berpaling'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Berilah' dan 'janganlah' menjaga nada perintah yang tegas, sedangkan 'kepadamu' dan 'darimu' mempertahankan sapaan orang kedua tunggal dalam bahasa Indonesia tanpa kekakuan berlebihan.
