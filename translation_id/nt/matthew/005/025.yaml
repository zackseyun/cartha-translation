id: MAT.5.25
reference: Matthew 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: id
  text: Segeralah bersikap baik terhadap lawanmu dalam perkara[a] selama engkau masih bersamanya di jalan, jangan sampai lawanmu itu menyerahkan engkau kepada hakim, lalu hakim menyerahkan engkau kepada petugas, dan engkau dijebloskan ke dalam penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis dalam konteks hukum ini, “Segeralah mencapai kesepakatan dengan lawanmu dalam perkara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: bersikap baik
  rationale: Ungkapan perifrastis ini secara harfiah menyatakan keadaan atau tindakan terus-menerus untuk beritikad atau bersikap baik terhadap seseorang. Pilihan ini mempertahankan arti dasar εὐνοέω tanpa langsung mempersempitnya menjadi tindakan mencapai kesepakatan.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: lawan ... dalam perkara / lawanmu
  rationale: ἀντίδικος menunjuk pihak lawan dalam sengketa hukum. 'Lawan dalam perkara' menjelaskan nuansa yuridisnya secara alami; penyebutan kedua cukup memakai 'lawanmu' karena konteksnya sudah jelas.
- source_word: ταχὺ
  choice: segeralah
  rationale: Bentuk ini menyampaikan desakan untuk bertindak cepat dan berpadu secara alami dengan perintah pembuka dalam bahasa Indonesia.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: selama engkau masih bersamanya di jalan
  rationale: Terjemahan ini mempertahankan gambaran konkret berada bersama di jalan tanpa menambahkan tujuan 'ke pengadilan', meskipun arah itu tersirat oleh konteks.
- source_word: μήποτέ
  choice: supaya ... jangan
  rationale: Konstruksi ini secara alami menyampaikan peringatan terhadap kemungkinan yang hendak dihindari.
- source_word: παραδῷ
  choice: menyerahkan
  rationale: '''Menyerahkan'' dengan jelas menyatakan pemindahan seseorang ke dalam kuasa pejabat berikutnya dalam rangkaian hukum.'
- source_word: κριτῇ / κριτὴς
  choice: hakim
  rationale: '''Hakim'' merupakan padanan standar dan jelas dalam konteks peradilan.'
- source_word: ὑπηρέτῃ
  choice: petugas
  rationale: Dalam rangkaian ini, ὑπηρέτης adalah bawahan resmi yang melaksanakan keputusan hakim. 'Petugas' cukup luas untuk menghindari jabatan modern atau lokal yang terlalu spesifik.
- source_word: εἰς φυλακὴν
  choice: ke dalam penjara
  rationale: Padanan ini baku dan mempertahankan bobot peringatan hukum.
- source_word: βληθήσῃ
  choice: dijebloskan
  rationale: '''Dijebloskan'' mempertahankan daya ungkap βάλλω yang lebih kuat daripada sekadar ''dimasukkan'', sekaligus lazim dipakai untuk pemenjaraan.'
theological_decisions:
- issue: Apakah perintah pembuka harus diterjemahkan sebagai sikap baik atau langsung sebagai penyelesaian sengketa
  choice: Mempertahankan makna leksikal dengan 'bersikap baik terhadap lawanmu dalam perkara'.
  alternative: Segeralah berdamai atau capailah kesepakatan dengan lawanmu dalam perkara.
  rationale: Konteks hukum memungkinkan makna idiomatis berupa penyelesaian perkara, tetapi εὐνοέω pada dasarnya menyatakan sikap atau itikad baik. Teks utama mempertahankan ketegangan itu, sedangkan implikasi penyelesaian hukum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan tunggal sesuai wacana langsung. Susunan klausa mempertahankan rangkaian penyerahan yuridis dalam teks Yunani dan gambaran konkret 'di jalan'.
