  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: id
  text: Dan siapa pun yang memaksamu[a] berjalan sejauh satu mil, berjalanlah bersamanya sejauh dua mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ini dapat menunjuk pada tindakan memaksa seseorang memberikan jasa atas tuntutan penguasa, seperti praktik pengerahan jasa secara paksa pada zaman Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: siapa pun yang
  rationale: Pronomina relatif tak tentu ini menyatakan kasus umum; “siapa pun yang” alami dalam bahasa Indonesia dan mempertahankan cakupannya yang luas.
- source_word: ἀγγαρεύσει
  choice: memaksamu berjalan
  rationale: Kata kerja ini menunjuk pada tindakan memaksa seseorang memberikan jasa, khususnya melalui tuntutan penguasa. Dalam konteks ukuran jarak, “memaksamu berjalan” menyampaikan unsur paksaan dan gerak secara jelas tanpa menambahkan pelaku tertentu.
- source_word: μίλιον ἕν
  choice: sejauh satu mil
  rationale: μίλιον adalah mil Romawi. “Sejauh satu mil” mempertahankan ukuran konkret dan terdengar wajar sebagai keterangan jarak dalam bahasa Indonesia.
- source_word: ὕπαγε
  choice: berjalanlah
  rationale: Bentuk imperatif ini berarti pergi atau melanjutkan perjalanan. “Berjalanlah” sesuai dengan konteks menempuh jarak dan membentuk kesejajaran alami dengan klausa pertama.
- source_word: μετ’ αὐτοῦ
  choice: bersamanya
  rationale: μετά dengan genetif menyatakan penyertaan. “Bersamanya” menerjemahkan hubungan itu secara langsung tanpa menentukan gender dalam bahasa Indonesia.
- source_word: δύο
  choice: sejauh dua mil
  rationale: Teks Yunani hanya menyebut “dua”, dengan satuan mil dipahami dari klausa sebelumnya. Satuan tersebut diulangi dalam bahasa Indonesia agar kalimat alami dan jelas.
theological_decisions:
- issue: Latar sosial-historis jasa paksa oleh penguasa
  choice: Menerjemahkan ucapan ini sebagai tanggapan terhadap paksaan tanpa menyebut tentara Romawi dalam teks utama.
  alternative: Menafsirkan pelakunya secara eksplisit sebagai tentara Romawi yang memaksa orang membawa barang.
  rationale: Kata ἀγγαρεύω dan penggunaan mil sangat mungkin menggemakan praktik pengerahan jasa secara paksa pada zaman Romawi, tetapi teks Yunani tidak menyebut tentara. Terjemahan mempertahankan unsur paksaan tanpa mempersempit pelakunya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Pengulangan “sejauh ... mil” membuat elipsis Yunani jelas secara alami, sedangkan “bersamanya” mempertahankan penyertaan tanpa menambahkan identitas pelaku.
