  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Yunani dengan tepat: ὅστις sebagai “siapa pun yang,” ἀγγαρεύσει sebagai paksaan untuk menempuh jarak, μίλιον ἕν sebagai “sejauh satu mil,” dan imperatif ὕπαγε μετ’ αὐτοῦ δύο sebagai “berjalanlah bersamanya sejauh dua mil.” Pengulangan “mil” secara tersurat merupakan pengisian elipsis yang wajar dan tidak menambah makna. Terjemahan juga tidak mempersempit pelaku menjadi tentara Romawi, yang tidak disebutkan dalam teks.'
