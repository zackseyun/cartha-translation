id: MAT.5.13
reference: Matthew 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: id
  text: Kamulah garam bumi. Namun, jika garam itu menjadi tawar, dengan apakah garam itu akan diasinkan kembali? Garam itu tidak berguna lagi untuk apa pun selain dibuang ke luar dan diinjak-injak orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kamulah
  rationale: Pronomina eksplisit bersifat emfatis. Bentuk enklitik -lah menyampaikan penekanan secara alami dalam bahasa Indonesia dan bentuk “kamu” sesuai dengan sapaan jamak kepada para murid.
- source_word: τὸ ἅλας τῆς γῆς
  choice: garam dunia
  rationale: γῆ dapat berarti bumi, tanah, atau negeri. Dalam metafora yang berskala luas ini, “dunia” merupakan ungkapan Indonesia yang alami dan dipahami sebagai ranah kehidupan manusia, tanpa mempersempitnya pada tanah atau suatu negeri.
- source_word: μωρανθῇ
  choice: menjadi tawar
  rationale: Dalam kaitannya dengan garam, verba ini berarti kehilangan rasa atau sifat asinnya. “Menjadi tawar” alami dalam bahasa Indonesia dan mempertahankan gambaran garam, sementara permainan etimologis dengan makna “menjadi bodoh” tidak dipaksakan ke dalam terjemahan.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: dengan apakah garam itu akan diasinkan kembali?
  rationale: Pertanyaan pasif ini menanyakan sarana yang dapat membuat garam asin. “Diasinkan kembali” membuat implikasi pemulihan rasa asin jelas dan tetap dekat dengan bentuk pasif Yunani.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: tidak berguna lagi untuk apa pun
  rationale: ἰσχύω di sini menyatakan daya guna atau keefektifan. Ungkapan ini menyampaikan ketidakbergunaan praktis secara jelas dan wajar.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: selain dibuang ke luar
  rationale: “Dibuang ke luar” mempertahankan unsur spasial ἔξω, bukan sekadar menyatakan pembuangan secara umum.
- source_word: καταπατεῖσθαι
  choice: diinjak-injak
  rationale: Bentuk ulang memberi gambaran tindakan menginjak atau menggilas berulang, sepadan dengan citra kuat verba Yunani.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: orang
  rationale: ἀνθρώπων merujuk kepada manusia secara umum, bukan khusus laki-laki. Bahasa Indonesia “orang” secara alami mencakup semua manusia tanpa kehilangan makna sumber.
theological_decisions:
- issue: Lingkup metafora dalam τῆς γῆς
  choice: dunia
  alternative: bumi; tanah
  rationale: Konteks tidak mengharuskan γῆ dibatasi pada tanah fisik atau suatu negeri. “Dunia” mempertahankan cakupan luas metafora dalam bahasa Indonesia yang alami, tanpa menambahkan identifikasi teologis tertentu.
- issue: Makna μωρανθῇ dalam metafora garam
  choice: menjadi tawar
  alternative: kehilangan rasa asinnya; menjadi bodoh
  rationale: Konteks garam mengaktifkan makna menjadi hambar atau tawar. Terjemahan tidak memasukkan secara eksplisit makna “bodoh”, tetapi juga tidak mengembangkan mekanisme ilmiah atau aplikasi rohani yang tidak dinyatakan teks.
- issue: Pelaku umum dalam ὑπὸ τῶν ἀνθρώπων
  choice: orang
  alternative: manusia
  rationale: Frasa Yunani bersifat generik. “Orang” menyatakan referen manusia secara umum dengan alami dan tidak membatasinya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamulah” mempertahankan penekanan pada para pendengar; “garam dunia” memakai ungkapan yang mapan dan mudah dipahami. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas yang harus dijelaskan kepada pembaca.
