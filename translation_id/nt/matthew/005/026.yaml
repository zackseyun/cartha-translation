  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: id
  text: Sesungguhnya, Aku berkata kepadamu, engkau pasti tidak akan keluar dari sana sampai engkau membayar kodrantes[a] yang terakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kodrantes adalah uang logam Romawi yang bernilai sangat kecil.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumus Sinoptik ini, ἀμήν berfungsi sebagai penegasan khidmat yang mengawali pernyataan berwibawa. “Sesungguhnya” menyampaikan fungsi itu secara alami dalam bahasa Indonesia Alkitabiah modern.
- source_word: λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini mempertahankan sapaan langsung dan bobot pernyataan sumber; kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia untuk ucapan Yesus.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: engkau pasti tidak akan keluar
  rationale: Gabungan οὐ μή dengan subjungtif aoristus merupakan negasi yang sangat tegas. “Pasti tidak akan” menjaga penekanan itu tanpa memakai ungkapan arkais.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Kata ini menunjukkan gerakan menjauh dari suatu tempat. “Keluar dari sana” mempertahankan unsur asal tempat secara jelas dan idiomatis.
- source_word: ἕως ἂν ἀποδῷς
  choice: sampai engkau membayar
  rationale: Konstruksi ini menunjukkan batas keadaan sebelumnya pada tindakan pembayaran yang tuntas. Dalam bahasa Indonesia, ketuntasan tersebut cukup jelas dari konteks dan dari frasa “yang terakhir”.
- source_word: τὸν ἔσχατον
  choice: yang terakhir
  rationale: Ungkapan ini menunjuk bagian terakhir dari jumlah yang wajib dibayar; susunan tersebut alami setelah nama mata uang dalam bahasa Indonesia.
- source_word: κοδράντην
  choice: kodrantes
  rationale: κοδράντης adalah nama uang logam Romawi tertentu, dari bahasa Latin quadrans. Bentuk “kodrantes” mempertahankan istilah historis yang lazim ditransliterasikan dalam bahasa Indonesia, sedangkan catatan kaki menjelaskan acuannya.
theological_decisions:
- issue: Apakah perkataan ini harus diterjemahkan sebagai penegasan tentang penghakiman akhir, penyucian, atau hanya gambaran hukum dan penjara
  choice: Mempertahankan gambaran konkret tentang kurungan sampai utang dibayar sepenuhnya tanpa menetapkan tafsiran doktrinal tertentu.
  alternative: Menerjemahkannya secara eksplisit sebagai penghakiman ilahi atau penyucian setelah kematian.
  rationale: Teks Yunani menyatakan bahwa orang itu tidak akan keluar sampai pembayaran terakhir dilakukan, tetapi tidak secara eksplisit menentukan makna doktrinal gambaran tersebut. Terjemahan karena itu mempertahankan ketegangan teologis dan konteks rekonsiliasi tanpa menambahkan kesimpulan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan langsung. Pronomina orang kedua tunggal “engkau” mempertahankan sapaan individual σοι/ἐξέλθῃς/ἀποδῷς, sedangkan istilah mata uang historis dijelaskan melalui catatan kaki.
