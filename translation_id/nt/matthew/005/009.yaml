id: MAT.5.9
reference: Matthew 5:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: id
  text: Berbahagialah para pembawa damai, karena mereka akan disebut anak-anak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Allah.” Bahasa Yunani memakai bentuk filial maskulin jamak dengan daya representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku untuk ucapan bahagia yang menyatakan perkenanan ilahi dan keadaan yang patut dipandang berbahagia, bukan sekadar perasaan senang.
- source_word: εἰρηνοποιοί
  choice: para pembawa damai
  rationale: Menyatakan orang-orang yang secara aktif mengusahakan atau mewujudkan perdamaian, serta terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Mempertahankan hubungan sebab atau dasar yang diperkenalkan oleh konjungsi Yunani.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Pronomina ini bersifat menegaskan dalam bahasa Yunani; dalam susunan ucapan bahagia bahasa Indonesia, 'mereka' menyampaikan rujukan itu secara wajar tanpa penekanan yang kaku.
- source_word: υἱοὶ θεοῦ
  choice: anak-anak Allah
  rationale: Dalam bentuk jamak yang merujuk pada suatu kelompok, 'anak-anak Allah' secara alami menyampaikan daya representatif dan inklusif dari ungkapan filial maskulin Yunani; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: κληθήσονται
  choice: akan disebut
  rationale: Padanan langsung untuk bentuk pasif futurum, tanpa mempersempit maknanya menjadi sekadar pengakuan sosial.
theological_decisions:
- issue: Bahasa filial bergender dalam υἱοὶ θεοῦ
  choice: anak-anak Allah
  alternative: putra-putra Allah
  rationale: Kata Yunani secara harfiah berbentuk maskulin jamak, tetapi di sini memiliki daya representatif bagi kelompok yang disebut berbahagia. 'Anak-anak Allah' menyampaikan cakupan itu secara alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dipertahankan dalam catatan agar nuansa filial sumber tidak tersembunyi.
translation_notes:
  register: Bahasa Indonesia standar modern dengan corak khidmat dan mudah dipahami. 'Berbahagialah' mempertahankan bentuk tradisional ucapan bahagia, sedangkan 'para pembawa damai' menonjolkan tindakan aktif.
