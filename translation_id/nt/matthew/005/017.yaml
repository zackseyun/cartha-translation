id: MAT.5.17
reference: Matthew 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: id
  text: Jangan mengira bahwa Aku datang untuk meniadakan Hukum Taurat atau kitab para nabi. Aku tidak datang untuk meniadakannya, melainkan untuk menggenapinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menggenapi” juga dapat dipahami sebagai “membawa kepada kepenuhan” atau “menyatakannya secara penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Jangan mengira
  rationale: Larangan dengan μή dan subjungtif aoris diterjemahkan secara langsung dan alami sebagai larangan untuk memiliki anggapan tersebut.
- source_word: ἦλθον
  choice: Aku datang
  rationale: Bentuk aoris dapat diterjemahkan secara wajar dengan bentuk lampau/kontekstual bahasa Indonesia, sedangkan waktu kedatangan dipahami dari konteks pelayanan Yesus.
- source_word: καταλῦσαι
  choice: untuk meniadakan
  rationale: Dalam kaitannya dengan Hukum Taurat dan Kitab Para Nabi, kata ini menunjuk pada tindakan membatalkan, menghapuskan keberlakuan, atau meruntuhkan, bukan penghancuran fisik. 'Meniadakan' jelas dan tidak terlalu teknis.
- source_word: τὸν νόμον
  choice: Hukum Taurat
  rationale: Ungkapan ini merujuk pada Taurat sebagai bagian Kitab Suci Israel, bukan hukum secara umum. 'Hukum Taurat' merupakan istilah Indonesia yang jelas dan lazim.
- source_word: τοὺς προφήτας
  choice: Kitab Para Nabi
  rationale: Dalam pasangan 'Hukum Taurat atau Para Nabi', yang dimaksud ialah kumpulan tulisan kenabian dalam Kitab Suci. Penambahan 'Kitab' memperjelas makna korpus tanpa mengubah acuannya.
- source_word: ἀλλὰ πληρῶσαι
  choice: melainkan untuk menggenapinya
  rationale: '''Menggenapi'' mempertahankan keluasan makna πληρόω, termasuk memenuhi maksud, membawa kepada kepenuhan, atau menyatakan secara utuh. Akhiran ''-nya'' merujuk secara kolektif pada Hukum Taurat dan Kitab Para Nabi.'
theological_decisions:
- issue: Makna hubungan Yesus dengan Hukum Taurat dan Kitab Para Nabi dalam πληρῶσαι
  choice: menggenapinya
  alternative: menyempurnakannya; membawanya kepada kepenuhan; mewujudkan maksudnya sepenuhnya
  rationale: Terjemahan utama mempertahankan istilah yang luas dan tidak menetapkan satu penafsiran teologis tertentu tentang cara Yesus menggenapi Kitab Suci.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Aku' mengikuti tuturan langsung Yesus. Istilah 'Hukum Taurat' dan 'Kitab Para Nabi' memperjelas bahwa ungkapan ini merujuk pada bagian-bagian Kitab Suci Israel.
