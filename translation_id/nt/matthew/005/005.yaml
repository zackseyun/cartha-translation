  source_fidelity: 'Teks utama menerjemahkan semua unsur Yunani dengan tepat: μακάριοι sebagai “Berbahagialah,” οἱ πραεῖς sebagai “orang yang lemah lembut,” ὅτι sebagai “karena,” κληρονομήσουσι sebagai “akan mewarisi,” dan τὴν γῆν sebagai “bumi.” Bentuk futurum dan gambaran warisan dipertahankan. Pilihan “bumi” sah, sementara catatan secara tepat menjaga kemungkinan “tanah/negeri” serta gema Mazmur 37:11.'
