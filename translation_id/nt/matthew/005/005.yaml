id: MAT.5.5
reference: Matthew 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: id
  text: Berbahagialah orang yang lemah lembut[a], karena mereka akan mewarisi bumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang lembut hati”; yang dimaksud ialah orang yang rendah hati dan bersikap lembut, bukan orang yang lemah atau penakut.
    reason: lexical_alternative
  - marker: b
    text: Atau “tanah” atau “negeri”. Ungkapan ini kemungkinan menggemakan Mazmur 37:11 sehingga dapat didengar baik dalam kaitan dengan tanah perjanjian maupun dalam arti yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Bentuk yang alami dan bermartabat untuk ucapan bahagia; menyatakan keadaan sejahtera karena perkenanan Allah, bukan sekadar perasaan senang.
- source_word: οἱ πραεῖς
  choice: orang yang lemah lembut
  rationale: Mengungkapkan kerendahan hati dan kelembutan yang terkendali, bukan kelemahan atau sikap penakut.
- source_word: ὅτι
  choice: karena
  rationale: Secara jelas memperkenalkan alasan yang mendasari ucapan bahagia.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Pronomina Yunani ini bersifat menegaskan; dalam kalimat ringkas bahasa Indonesia, penegasan tersebut cukup alami disampaikan dengan 'mereka' sebagai subjek yang menerima janji.
- source_word: κληρονομήσουσι
  choice: akan mewarisi
  rationale: Mempertahankan gambaran menerima warisan serta kaitannya dengan bahasa janji perjanjian.
- source_word: τὴν γῆν
  choice: bumi
  rationale: γῆ dapat berarti 'bumi' atau 'tanah/negeri'. 'Bumi' menyampaikan cakupan luas janji dengan alami, sementara kemungkinan gema Mazmur 37:11 dijelaskan dalam catatan.
theological_decisions:
- issue: Cakupan τὴν γῆν
  choice: bumi
  alternative: tanah atau negeri
  rationale: Teks Yunani memungkinkan pengertian universal maupun pengertian tanah perjanjian. Teks utama memakai 'bumi' tanpa meniadakan gema Mazmur 37:11 dan nuansa tanah perjanjian, yang dipertahankan melalui catatan.
- issue: Makna οἱ πραεῖς
  choice: orang yang lemah lembut
  alternative: orang yang lembut hati atau rendah hati
  rationale: Pilihan ini mempertahankan perpaduan kelembutan dan kerendahan hati, tanpa menafsirkannya sebagai kelemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama singkat dan khidmat yang sesuai bagi rangkaian ucapan bahagia. Ungkapan tradisional 'Berbahagialah' dan 'lemah lembut' dipertahankan karena tetap mudah dipahami, dengan potensi salah paham dijernihkan dalam catatan.
