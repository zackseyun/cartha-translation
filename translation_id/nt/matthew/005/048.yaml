id: MAT.5.48
reference: Matthew 5:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: id
  text: Karena itu, hendaklah kamu sempurna[a], sebagaimana Bapamu yang di surga sempurna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utuh,” “lengkap,” atau “dewasa.” Kata Yunani τέλειος dapat menunjuk pada keutuhan atau kedewasaan, selain kesempurnaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: hendaklah ... sempurna
  rationale: Bentuk futur indikatif dipakai dengan daya perintah atau ajakan dalam konteks ini. “Hendaklah” menyampaikan tuntutan yang khidmat secara alami dalam bahasa Indonesia tanpa menjadikannya sekadar ramalan.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari ajaran sebelumnya, khususnya tentang mengasihi musuh.
- source_word: ὑμεῖς
  choice: kamu
  rationale: Pronomina eksplisit bersifat menegaskan. “Kamu” mempertahankan sapaan jamak dalam pemakaian bahasa Indonesia umum, meskipun bentuknya sendiri dapat juga dipahami sebagai tunggal.
- source_word: τέλειοι / τέλειός
  choice: sempurna
  rationale: Padanan langsung yang mempertahankan pengulangan dan daya retoris perbandingan antara para murid dan Bapa. Cakupan makna ‘utuh/lengkap/dewasa’ dicatat dalam catatan kaki.
- source_word: ὡς
  choice: sebagaimana
  rationale: Memperkenalkan perbandingan dengan Bapa dan terdengar wajar serta bermartabat.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Bapamu yang di surga
  rationale: Menyampaikan konstruksi ‘Bapamu, yang surgawi’ secara idiomatis. Kapitalisasi “Bapa” menunjukkan rujukan kepada Allah tanpa menambah penafsiran.
theological_decisions:
- issue: Makna τέλειος dalam nasihat etis
  choice: sempurna
  alternative: utuh, lengkap, atau dewasa
  rationale: “Sempurna” mempertahankan tuntutan etis yang kuat dan perbandingan eksplisit dengan Bapa. Catatan kaki menjaga keluasan makna Yunani dalam konteks kasih yang tidak terbagi, tanpa menyamakan manusia secara metafisis dengan Allah ataupun membatasi kata itu pada satu penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang ringkas, khidmat, dan mudah dipahami. Susunan kalimat mempertahankan hubungan logis, bentuk nasihat, pengulangan “sempurna,” dan perbandingan dalam teks Yunani.
