id: MAT.5.33
reference: Matthew 5:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: id
  text: Sekali lagi, kamu telah mendengar bahwa kepada orang-orang zaman dahulu telah dikatakan, “Jangan bersumpah palsu[a], tetapi penuhilah sumpahmu kepada Tuhan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan mengingkari sumpah”; kata kerjanya dapat berarti bersumpah palsu atau melanggar sumpah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada TUHAN”, yang mencerminkan nama ilahi perjanjian dalam latar belakang Perjanjian Lama.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Sekali lagi
  rationale: Menandai kelanjutan rangkaian contoh dalam khotbah Yesus dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἠκούσατε
  choice: kamu telah mendengar
  rationale: Menyampaikan ungkapan formulaik ini sebagai sesuatu yang pernah didengar dan tetap relevan bagi para pendengar.
- source_word: ἐρρέθη
  choice: telah dikatakan
  rationale: Mempertahankan bentuk pasif impersonal tanpa menentukan siapa penuturnya.
- source_word: τοῖς ἀρχαίοις
  choice: kepada orang-orang zaman dahulu
  rationale: Menunjuk kepada generasi terdahulu, bukan sekadar orang yang lanjut usia.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Jangan bersumpah palsu
  rationale: ἐπιορκέω dapat berarti bersumpah palsu atau melanggar sumpah; pilihan ini mempertahankan pengertian utama tanpa mempersempitnya menjadi istilah hukum modern.
- source_word: ἀποδώσεις
  choice: penuhilah
  rationale: Dalam konteks sumpah, ἀποδίδωμι berarti melaksanakan kewajiban yang telah diikrarkan.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Menerjemahkan κύριος secara langsung dan menunjukkan bahwa acuannya adalah Allah, sambil mempertahankan kemungkinan latar nama perjanjian dalam catatan kaki.
- source_word: τοὺς ὅρκους σου
  choice: sumpahmu
  rationale: Padanan ringkas dan alami untuk bentuk jamak Yunani yang secara idiomatis dapat dinyatakan dengan nomina kolektif dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam ringkasan atau alusi terhadap Kitab Suci Israel
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κυρίῳ, bukan nama ilahi Ibrani secara langsung. Karena itu, bentuk “Tuhan” dipakai dalam teks utama, sedangkan latar nama perjanjian dipertahankan dalam catatan kaki.
- issue: Cakupan makna ἐπιορκέω
  choice: bersumpah palsu
  alternative: mengingkari sumpah
  rationale: Kata kerja ini dapat menunjuk baik pada sumpah palsu maupun pelanggaran sumpah. Teks utama memakai ungkapan yang luas dan alami, sementara kemungkinan lainnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif dipertahankan untuk mengikuti bentuk Yunani, sedangkan kalimat perintah dibuat langsung dan mudah dipahami. Sapaan “kamu” sesuai dengan bentuk jamak dalam konteks khotbah kepada para pendengar.
