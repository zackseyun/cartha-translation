  naturalness: Teks utama alami, baku, dan sesuai register pengajaran Yesus. Namun, kalimat catatan kaki b, khususnya frasa “latar nama ilahi dalam perjanjian di Perjanjian Lama,” tidak idiomatis dan tidak jelas dalam bahasa Indonesia.
  terminology: “Tuhan” merupakan padanan yang tepat untuk κυρίῳ dalam teks utama. Alternatif “TUHAN” patut dipertahankan sebagai catatan kaki yang menjelaskan latar belakang alusi Perjanjian Lama, tanpa menyamakan secara langsung bentuk Yunani κύριος dengan Tetragramaton.
