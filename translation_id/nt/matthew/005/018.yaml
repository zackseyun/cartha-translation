id: MAT.5.18
reference: Matthew 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: id
  text: 'Sebab, sesungguhnya Aku berkata kepadamu: sampai langit dan bumi berlalu, satu iota[a] atau satu goresan kecil[b] pun tidak akan pernah berlalu dari hukum Taurat sampai semuanya terjadi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iota adalah nama huruf Yunani terkecil; maksudnya, bahkan satu huruf terkecil pun.
    reason: lexical_explanation
  - marker: b
    text: Yaitu, tanda tulisan yang sangat kecil yang membedakan bentuk huruf.
    reason: lexical_explanation
  - marker: c
    text: 'Dapat juga diterjemahkan: “sampai semuanya terlaksana” atau “sampai semuanya digenapi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: sesungguhnya
  rationale: Dalam perkataan Yesus, kata ini menjadi penegasan khidmat yang mengawali pernyataan berwibawa; “sesungguhnya” alami dalam ragam Alkitab Indonesia modern tanpa membiarkan kata pinjaman itu tidak diterjemahkan.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini menghubungkan ayat dengan pernyataan sebelumnya sebagai dasar penjelas; “sebab” mempertahankan hubungan tersebut secara jelas.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung yang mempertahankan nada resmi dan berwibawa. Huruf kapital pada pronomina mengikuti kebiasaan penghormatan dalam bahasa Indonesia.
- source_word: ἕως ἂν παρέλθῃ
  choice: sampai ... berlalu
  rationale: Konstruksi ini menunjukkan batas waktu yang berkaitan dengan keadaan mendatang; “berlalu” sesuai dengan gambaran langit dan bumi.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: langit dan bumi
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan cakupan kosmis frasa Yunani.
- source_word: ἰῶτα ἓν
  choice: satu iota
  rationale: Mempertahankan nama huruf yang dipakai teks Yunani, sedangkan catatan kaki menjelaskan bahwa yang dimaksud ialah huruf yang sangat kecil.
- source_word: μία κεραία
  choice: satu goresan kecil
  rationale: κεραία menunjuk pada guratan atau tonjolan kecil dalam bentuk huruf; pilihan ini jelas bagi pembaca modern dan mempertahankan citra tulisan.
- source_word: οὐ μὴ παρέλθῃ
  choice: pun tidak akan pernah berlalu
  rationale: Gabungan “pun” dan “tidak akan pernah” menyampaikan penyangkalan Yunani yang sangat tegas sekaligus terkait secara alami dengan unsur terkecil yang disebutkan.
- source_word: ἀπὸ τοῦ νόμου
  choice: dari hukum Taurat
  rationale: Dalam konteks Matius 5:17–19, νόμος menunjuk pada hukum dalam Kitab Suci, khususnya Taurat, bukan hukum secara umum. Ungkapan baku Indonesia “hukum Taurat” memperjelas rujukan tanpa menentukan apakah cakupannya meluas secara representatif.
- source_word: ἕως ἂν πάντα γένηται
  choice: sampai semuanya terjadi
  rationale: Pilihan ini mempertahankan arti luas γίνομαι sebagai terjadi atau menjadi kenyataan dan tidak mempersempitnya hanya kepada salah satu skema penggenapan.
theological_decisions:
- issue: Cakupan νόμος dalam perkataan Yesus
  choice: hukum Taurat sebagai hukum Allah dalam Kitab Suci
  alternative: Taurat/Pentateukh secara khusus, atau seluruh Kitab Suci terdahulu secara representatif
  rationale: Konteks langsung menyebut “Hukum Taurat dan Kitab Para Nabi.” Terjemahan menandai rujukan skripturalnya, tetapi tidak menjelaskan di dalam teks seberapa jauh cakupannya meluas.
- issue: Makna πάντα γένηται
  choice: sampai semuanya terjadi
  alternative: sampai semuanya terlaksana atau sampai semuanya digenapi
  rationale: Bahasa Yunani dapat menunjuk pada terjadinya atau terwujudnya segala sesuatu. Rumusan utama mempertahankan keluasan itu, sedangkan alternatif yang menekankan pelaksanaan atau penggenapan dicatat tanpa menetapkan satu skema teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat tetap dekat dengan urutan dan penekanan Yunani, tetapi tanda titik dua dan pilihan frasa disesuaikan agar terbaca alami. Istilah “iota” dipertahankan demi ketepatan leksikal dan dijelaskan dalam catatan kaki.
