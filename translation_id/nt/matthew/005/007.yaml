  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: id
  text: Berbahagialah orang-orang yang berbelas kasih, karena merekalah yang akan menerima belas kasihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani berbentuk pasif dan tidak menyebutkan siapa yang menunjukkan belas kasihan; secara harfiah, “akan dikasihani.”
    reason: Menjelaskan bentuk pasif verba Yunani dan pelaku yang tidak dinyatakan.
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku dan wajar untuk ucapan bahagia yang menunjuk pada keadaan sejahtera karena perkenanan Allah, bukan sekadar perasaan senang.
- source_word: οἱ ἐλεήμονες
  choice: orang yang berbelaskasihan
  rationale: Adjektiva dengan artikel berfungsi sebagai nomina jamak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kaitan leksikal dengan belas kasihan dalam janji berikutnya.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan alasan atau dasar bagi ucapan bahagia secara jelas dalam bahasa Indonesia masa kini.
- source_word: αὐτοὶ
  choice: merekalah yang
  rationale: Bentuk ini menyampaikan penekanan pada pronomina Yunani dan menonjolkan kesesuaian antara orang yang berbelaskasihan dan orang yang kelak menerima belas kasihan.
- source_word: ἐλεηθήσονται
  choice: akan mendapat belas kasihan
  rationale: Menyampaikan makna verba pasif futur secara alami tanpa menyebut pelaku yang tidak dinyatakan dalam bahasa Yunani, sekaligus mempertahankan pengulangan kosakata belas kasihan.
theological_decisions:
- issue: Pelaku yang memberikan belas kasihan
  choice: 'Tidak menyebutkan pelakunya: “akan mendapat belas kasihan.”'
  alternative: “akan dikasihani Allah” atau “akan mendapat belas kasihan dari orang lain”
  rationale: Bentuk pasif Yunani tidak menyatakan pelaku. Dalam konteksnya Allah sangat mungkin tersirat, tetapi terjemahan tidak menambahkan pelaku dan dengan demikian mempertahankan keterbukaan teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk “Berbahagialah” mempertahankan corak khas ucapan bahagia, sedangkan “merekalah yang” menjaga penekanan pronomina Yunani tanpa terdengar kaku.
