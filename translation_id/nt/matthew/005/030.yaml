id: MAT.5.30
reference: Matthew 5:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: id
  text: Dan jika tangan kananmu membuatmu tersandung[a], potonglah tangan itu dan buanglah itu darimu. Sebab, lebih baik bagimu jika satu anggota tubuhmu binasa daripada seluruh tubuhmu masuk ke dalam Gehena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyebabkanmu berbuat dosa.” Kata Yunani yang dipakai secara harfiah berarti “membuat tersandung.”
    reason: lexical_alternative
  - marker: b
    text: Atau “neraka.” Kata Yunani Gehena berasal dari nama Lembah Hinom dan digunakan untuk penghakiman pada akhir zaman.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά σου χεὶρ
  choice: tangan kananmu
  rationale: Ungkapan Indonesia yang wajar dan tepat, sekaligus mempertahankan kekhususan anggota tubuh dalam teks sumber.
- source_word: σκανδαλίζει σε
  choice: membuatmu tersandung
  rationale: Mempertahankan metafora dasar verba Yunani tentang menyebabkan seseorang tersandung atau jatuh, sementara makna kontekstualnya—mendorong orang berbuat dosa—dijelaskan dalam catatan kaki.
- source_word: ἔκκοψον αὐτήν
  choice: potonglah tangan itu
  rationale: Menyampaikan perintah yang tegas dan menentukan; penyebutan ulang 'tangan itu' lebih jelas dan alami daripada pronomina benda dalam bahasa Indonesia.
- source_word: βάλε ἀπὸ σοῦ
  choice: buanglah jauh-jauh
  rationale: Mengungkapkan tindakan membuang sekaligus menjauhkan dari diri dengan bahasa Indonesia yang alami dan kuat.
- source_word: συμφέρει γάρ σοι
  choice: Sebab, lebih baik bagimu
  rationale: Menyatakan keuntungan komparatif dalam konteks peringatan, bukan keuntungan materi.
- source_word: ἵνα ἀπόληται ἓν τῶν μελῶν σου
  choice: jika satu anggota tubuhmu binasa
  rationale: Mempertahankan bobot ἀπόληται dan perbandingan antara satu anggota tubuh dengan seluruh tubuh; 'anggota tubuh' tidak membatasi μέλος hanya pada anggota gerak.
- source_word: ὅλον τὸ σῶμά σου
  choice: seluruh tubuhmu
  rationale: Mempertahankan kontras totalitas dengan satu anggota tubuh.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: masuk ke dalam Gehena
  rationale: Mencerminkan gerak menuju atau masuk ke Gehena tanpa memasukkan gagasan pasif 'dilemparkan' yang tidak terdapat dalam verba ayat ini.
theological_decisions:
- issue: Penerjemahan γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Transliterasi 'Gehena' mempertahankan istilah historis yang berasal dari Lembah Hinom dan muatan penghakiman eskatologisnya, tanpa langsung menyamakannya dengan semua pengertian doktrinal yang kemudian dilekatkan pada kata 'neraka'. Padanan yang lebih dikenal pembaca dicantumkan dalam catatan kaki.
- issue: Makna σκανδαλίζει
  choice: membuatmu tersandung
  alternative: menyebabkanmu berbuat dosa
  rationale: Metafora tersandung dipertahankan karena terdapat dalam verba Yunani, sedangkan makna moralnya dalam konteks tetap disediakan sebagai alternatif agar ketegangan antara gambaran dan maksud tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk perintah dibuat tegas, metafora sumber dipertahankan, dan istilah historis-teologis 'Gehena' dijelaskan tanpa memasukkan kekhasan denominasi.
