base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: id
  text: Tinggalkanlah persembahanmu di sana di depan mazbah, lalu pergilah; terlebih dahulu berdamailah dengan saudaramu,[a] kemudian datanglah dan persembahkanlah persembahanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudaramu” berbentuk maskulin tunggal; dalam konteks ini, prinsip berdamai dapat berlaku lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: tinggalkanlah
  rationale: Imperatif ini memerintahkan agar persembahan dibiarkan tetap di tempatnya; “tinggalkanlah” alami dan tepat dalam konteks konkret ini.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Mempertahankan penekanan tempat dalam teks Yunani.
- source_word: τὸ δῶρόν σου
  choice: persembahanmu
  rationale: Dalam konteks mazbah, δῶρον adalah pemberian yang dipersembahkan kepada Allah; “persembahan” paling jelas dalam bahasa Indonesia.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: di depan mazbah
  rationale: Menyatakan hubungan ruang secara langsung dan alami.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Imperatif gerak yang ringkas dan wajar dalam urutan perintah.
- source_word: πρῶτον
  choice: dahulu
  rationale: Menegaskan bahwa rekonsiliasi harus mendahului penyelesaian persembahan.
- source_word: διαλλάγηθι
  choice: berdamailah
  rationale: Imperatif pasif secara bentuk, tetapi bahasa Indonesia lazim menyatakan tercapainya rekonsiliasi dengan “berdamailah”; ungkapan ini tidak menentukan sepihak bagaimana perdamaian itu dicapai.
- source_word: τῷ ἀδελφῷ σου
  choice: dengan saudaramu
  rationale: Preposisi “dengan” menyampaikan relasi timbal balik yang wajar bersama verba “berdamai”; “saudara” mempertahankan bentuk tunggal tanpa harus menentukan saudara kandung atau sesama anggota komunitas.
- source_word: τότε ἐλθὼν
  choice: kemudian datanglah kembali
  rationale: τότε menyatakan urutan waktu, sedangkan “kembali” tersirat secara kontekstual karena orang itu telah pergi meninggalkan persembahannya di depan mazbah.
- source_word: πρόσφερε
  choice: persembahkanlah
  rationale: Verba kultis ini paling tepat diterjemahkan “mempersembahkan” dalam konteks persembahan di mazbah.
theological_decisions:
- issue: Cakupan ἀδελφός dalam ajaran etika antarpribadi
  choice: saudaramu
  alternative: saudara laki-lakimu; sesamamu
  rationale: “Saudara” merupakan padanan Indonesia yang alami bagi bentuk maskulin tunggal Yunani dan dapat menunjuk saudara atau anggota komunitas tanpa memperluas teks secara tegas menjadi “sesama.” Catatan kaki menjelaskan cakupan kontekstual yang mungkin lebih luas.
- issue: Nuansa pasif διαλλάγηθι
  choice: berdamailah dengan
  alternative: hendaklah engkau didamaikan dengan
  rationale: Terjemahan harfiah pasif terdengar janggal dalam bahasa Indonesia. “Berdamailah dengan” mempertahankan tuntutan rekonsiliasi dan sifat relasionalnya tanpa menyatakan bahwa hasilnya sepenuhnya berada dalam kendali satu pihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan -lah mempertahankan rangkaian perintah. “Mazbah” dipakai sebagai istilah baku untuk tempat persembahan korban, sedangkan pengulangan “persembahanmu” mempertahankan kejelasan dan struktur sumber.
