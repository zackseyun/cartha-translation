id: MAT.5.22
reference: Matthew 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: id
  text: 'Tetapi Aku berkata kepada kalian: Setiap orang yang marah kepada saudaranya[a][e] akan menghadapi penghakiman; siapa yang berkata kepada saudaranya, ‘Raka,’[b] akan menghadapi majelis[c]; dan siapa yang berkata, ‘Bodoh!’ akan menghadapi Gehena yang berapi.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah menambahkan “tanpa alasan” sesudah “marah kepada saudaranya”. Bacaan yang paling awal dan paling kuat dukungannya tidak memuat tambahan itu.
    reason: textual_variant
  - marker: b
    text: “Raka” adalah istilah penghinaan dalam bahasa Aram, kira-kira berarti “otak kosong” atau “orang tak berguna”.
    reason: cultural_note
  - marker: c
    text: Atau “Sanhedrin”, majelis pemerintahan Yahudi.
    reason: alternative_reading
  - marker: d
    text: Atau “neraka yang berapi”. “Gehena” mempertahankan istilah khusus dalam teks, yang berkaitan dengan gambaran Lembah Hinom dan penghakiman.
    reason: alternative_reading
  - marker: e
    text: “Saudara” menerjemahkan istilah maskulin tunggal yang dapat dipakai secara representatif; perkataan ini tidak terbatas pada saudara kandung laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Tetapi Aku berkata kepada kalian
  rationale: Mempertahankan kontras tegas dari ἐγώ dan δέ, sekaligus memakai susunan bahasa Indonesia yang alami. Huruf kapital pada Aku mengikuti kebiasaan penerbitan Alkitab Indonesia ketika Yesus berbicara tentang diri-Nya.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: Setiap orang yang marah
  rationale: Partisipel kini substantival menyatakan kategori umum; terjemahan ini mempertahankan daya pernyataan umum tanpa memaksakan nuansa aspek tertentu.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: kepada saudaranya
  rationale: Konstruksi datif sesudah ὀργίζομαι secara alami menyatakan sasaran kemarahan. ‘Saudara’ mempertahankan istilah kekerabatan dan dalam bahasa Indonesia dapat dipahami lebih luas tanpa menambahkan ‘seiman’ yang tidak eksplisit.
- source_word: ἔνοχος ἔσται
  choice: akan terancam hukuman
  rationale: ἔνοχος di sini menyatakan keadaan dapat dikenai pertanggungjawaban atau sanksi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran yudisial yang berulang.
- source_word: τῇ κρίσει
  choice: hukuman
  rationale: κρίσις dapat menunjuk penghakiman atau badan pengadilan. ‘Hukuman’ sesuai dengan pasangan ἔνοχος dan mempertahankan akibat yudisial tanpa secara pasti mengidentifikasinya sebagai pengadilan lokal.
- source_word: Ῥακά
  choice: Raka
  rationale: Celaan Aram ini ditransliterasikan untuk mempertahankan tekstur historis dan dijelaskan dalam catatan kaki.
- source_word: τῷ συνεδρίῳ
  choice: Mahkamah Agama
  rationale: συνέδριον menunjuk dewan atau majelis peradilan; dalam konteks Yahudi, ‘Mahkamah Agama’ merupakan istilah Indonesia yang dikenal untuk Sanhedrin, sementara kemungkinan arti yang lebih umum dicatat.
- source_word: Μωρέ
  choice: Bodoh!
  rationale: Vokatif ini merupakan celaan langsung. ‘Bodoh’ mempertahankan daya penghinaan tanpa memakai istilah modern yang terlalu khusus atau anakronistis.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: terancam Gehena yang berapi
  rationale: ‘Gehena’ mempertahankan istilah historis yang dipakai dalam teks, sedangkan ‘yang berapi’ menyampaikan genitif τοῦ πυρός secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Varian tekstual sesudah ‘marah kepada saudaranya’
  choice: Mengikuti bacaan tanpa εἰκῇ (‘tanpa alasan’)
  alternative: ‘marah kepada saudaranya tanpa alasan’
  rationale: SBLGNT dan bukti naskah awal yang kuat tidak memuat tambahan itu. Catatan kaki menjaga transparansi tanpa memasukkan bacaan sekunder ke dalam teks.
- issue: Makna γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Transliterasi mempertahankan latar Lembah Hinom dan gambaran penghakiman yang khas, tanpa menyamakan istilah ini secara diam-diam dengan seluruh cakupan konsep ‘neraka’ dalam pemakaian teologis kemudian.
- issue: Identitas συνέδριον
  choice: Mahkamah Agama
  alternative: majelis; Sanhedrin
  rationale: Konteks pengadilan dan pemakaian Yahudi mendukung rujukan kepada majelis tertinggi, tetapi catatan kaki mengakui bahwa istilah Yunani itu sendiri dapat berarti ‘majelis’ secara lebih umum.
- issue: Cakupan ἀδελφός
  choice: saudara
  alternative: saudara laki-laki; saudara seiman
  rationale: ‘Saudara’ secara leksikal dekat dan cukup luas dalam bahasa Indonesia. Terjemahan tidak membatasi ungkapan itu pada saudara kandung laki-laki ataupun menambahkan identitas ‘seiman’ yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Paralelisme tiga peringatan dipertahankan melalui pengulangan ‘akan terancam’. Istilah historis ‘Raka’ dan ‘Gehena’ dipertahankan serta dijelaskan dengan catatan kaki. Semua penanda catatan kaki muncul di teks utama.
