  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: id
  text: 'Tetapi hendaklah perkataanmu berbunyi: ‘Ya, ya,’ atau ‘Tidak, tidak.’ Apa pun yang melebihi itu berasal dari Si Jahat[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berasal dari kejahatan.” Frasa Yunani τοῦ πονηροῦ dapat dipahami secara personal (“Si Jahat”) atau impersonal (“kejahatan”).
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: hendaklah
  rationale: Bentuk imperatif orang ketiga dari εἰμί menyatakan desakan; ‘hendaklah’ menyampaikannya secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: λόγος
  choice: perkataanmu
  rationale: Dalam konteks ini λόγος menunjuk pada apa yang diucapkan. ‘Perkataanmu’ mempertahankan bentuk tunggal kolektif dan daya ungkap yang ringkas.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Ya, ya,’ atau ‘Tidak, tidak’
  rationale: Pengulangan partikel dipertahankan untuk mencerminkan penekanan dan irama teks Yunani; ‘atau’ memperjelas pertentangannya secara alami.
- source_word: περισσὸν
  choice: apa pun yang melebihi
  rationale: Kata sifat yang dipakai secara substantival ini menunjuk pada apa saja yang melampaui jawaban sederhana yang baru disebutkan.
- source_word: τούτων
  choice: itu
  rationale: Kata tunjuk ini merujuk kembali pada kedua rumusan ‘Ya, ya’ dan ‘Tidak, tidak’; bentuk ‘itu’ alami dalam ungkapan Indonesia ‘melebihi itu’.
- source_word: ἐκ
  choice: berasal dari
  rationale: Preposisi ini menandai sumber atau asal; ‘berasal dari’ menyatakan hubungan tersebut dengan jelas.
- source_word: τοῦ πονηροῦ
  choice: si jahat
  rationale: Frasa Yunani dapat dipahami secara personal atau impersonal. Dalam Matius, bentuk ini sering memiliki rujukan personal, sehingga ‘si jahat’ dipakai dalam teks utama sambil mencatat alternatif ‘kejahatan’.
theological_decisions:
- issue: Apakah τοῦ πονηροῦ bersifat impersonal (‘kejahatan’) atau personal (‘si jahat’)
  choice: si jahat
  alternative: kejahatan
  rationale: Secara gramatikal kedua pengertian mungkin. Pemakaian Matius mendukung pengertian personal, tetapi ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada ajaran. Pengulangan ‘Ya, ya’ dan ‘Tidak, tidak’ sengaja dipertahankan, bukan dilunakkan menjadi ‘cukup ya atau tidak’.
