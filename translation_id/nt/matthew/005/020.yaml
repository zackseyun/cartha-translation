id: MAT.5.20
reference: Matthew 5:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: id
  text: 'Sebab Aku berkata kepada kalian: jika kebenaran kalian[a] tidak melebihi kebenaran para ahli Taurat dan orang Farisi, kalian sama sekali tidak akan masuk ke dalam Kerajaan Surga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan.” Kata Yunani yang diterjemahkan “kebenaran” dapat juga berarti “keadilan”; dalam konteks Matius 5, “kebenaran” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab, Aku berkata kepadamu
  rationale: γάρ memberi alasan atau penjelasan bagi pernyataan sebelumnya; bentuk ini mempertahankan sapaan langsung Yesus dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἐὰν μὴ
  choice: Jika ... tidak
  rationale: Gabungan ini menyatakan syarat negatif yang mutlak. Dalam susunan kalimat Indonesia ini, 'jika ... tidak' terdengar lebih alami daripada 'kecuali jika'.
- source_word: περισσεύσῃ ... πλεῖον
  choice: melampaui
  rationale: Bentuk komparatif ini menunjukkan bahwa hidup benar para murid harus lebih besar atau unggul daripada pembandingnya; 'melampaui' ringkas dan alami.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: hidup benar kalian
  rationale: δικαιοσύνη di sini menunjuk pada kebenaran yang tampak dalam kehidupan dan ketaatan. 'Hidup benar' lebih mudah dipahami daripada nomina abstrak 'kebenaran' dan menghindari kesan bahwa yang dibandingkan hanyalah ketepatan suatu pernyataan.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: para ahli Taurat dan orang Farisi
  rationale: γραμματεῖς merujuk pada ahli yang diakui dalam Taurat, sehingga 'ahli Taurat' lebih jelas bagi pembaca Indonesia daripada 'juru tulis'; Φαρισαῖοι diterjemahkan dengan nama kelompok yang baku.
- source_word: οὐ μὴ εἰσέλθητε
  choice: kalian pasti tidak akan masuk
  rationale: οὐ μή dengan subjungtif aoris merupakan penyangkalan yang tegas; 'pasti tidak akan' mempertahankan penekanan tersebut tanpa gaya arkais.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ungkapan khas Matius ini diterjemahkan dengan bentuk Indonesia yang mapan dan alami.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks Matius 5
  choice: hidup benar
  alternative: kebenaran; keadilan
  rationale: Konteks membahas kualitas ketaatan dan perilaku yang sesuai dengan kehendak Allah, bukan sekadar status abstrak. 'Hidup benar' menyampaikan dimensi etisnya, sementara kemungkinan makna 'keadilan' tetap dicatat tanpa memaksakan pembacaan denominasi tertentu.
- issue: Objek perbandingan dalam πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: hidup benar kalian ... hidup benar para ahli Taurat dan orang Farisi
  alternative: kalian lebih benar daripada para ahli Taurat dan orang Farisi
  rationale: Pengulangan 'hidup benar' memperjelas bahwa yang dibandingkan adalah δικαιοσύνη, bukan nilai pribadi kedua kelompok secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk menandai bahwa ὑμῖν dan ὑμῶν berbentuk jamak; kapitalisasi 'Aku' dan 'Kerajaan Surga' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
