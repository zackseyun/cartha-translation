source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: id
  text: Sebab, jika kamu mengasihi orang-orang yang mengasihi kamu, upah apa yang kamu peroleh?[a] Bukankah para pemungut pajak pun berbuat demikian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ganjaran apa yang kamu miliki?” Kata Yunani yang digunakan dapat berarti “upah” atau “ganjaran”; di sini yang dimaksud adalah balasan dalam konteks ajaran Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sebab, jika
  rationale: γάρ menghubungkan ayat ini dengan perintah sebelumnya, sedangkan ἐάν memperkenalkan syarat umum. Bentuk ini mempertahankan kedua fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: ἀγαπήσητε
  choice: kamu mengasihi
  rationale: Aoris subjungtif sesudah ἐάν menyatakan syarat umum; bentuk kini bahasa Indonesia menyampaikan maknanya tanpa menambahkan nuansa aspek yang tidak perlu.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: orang-orang yang mengasihi kamu
  rationale: Partisipel substantival menunjuk pada kelompok yang dicirikan oleh tindakan mereka terhadap para pendengar, sekaligus mempertahankan pengulangan akar kata 'mengasihi'.
- source_word: τίνα μισθὸν ἔχετε
  choice: upah apa yang kamu peroleh
  rationale: μισθός dapat berarti upah atau ganjaran. 'Upah' mempertahankan citra balasan yang konkret, sedangkan 'kamu peroleh' mengungkapkan idiom ἔχετε secara alami dalam pertanyaan bahasa Indonesia.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: οὐχί memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya; 'Bukankah' menyampaikan daya tersebut dengan alami.
- source_word: καὶ οἱ τελῶναι
  choice: para pemungut pajak pun
  rationale: καί bersifat emfatis dan diterjemahkan 'pun', sementara τελῶναι secara jelas dan lazim berarti para pemungut pajak atau cukai.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: berbuat demikian
  rationale: Ungkapan ini berarti melakukan hal yang sama; 'berbuat demikian' ringkas, bermartabat, dan merujuk jelas pada kasih yang timbal balik.
theological_decisions:
- issue: Makna μισθός dalam ajaran etis Yesus
  choice: upah
  alternative: ganjaran
  rationale: '''Upah'' mempertahankan rentang leksikal dan metafora balasan dalam teks tanpa menentukan mekanisme jasa atau pahala. Catatan kaki menjelaskan alternatif ''ganjaran'' dalam konteks ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kamu' mempertahankan sapaan jamak kepada para pendengar tanpa memakai bentuk yang terlalu resmi. Pertanyaan retoris dibuat alami dengan 'Bukankah ... pun'.
