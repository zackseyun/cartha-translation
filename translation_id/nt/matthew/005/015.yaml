id: MAT.5.15
reference: Matthew 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: id
  text: Orang pun tidak menyalakan pelita lalu meletakkannya di bawah wadah takaran[a], melainkan di atas penyangga pelita, dan pelita itu menerangi semua orang di dalam rumah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah gantang.” Kata Yunani μόδιος menunjuk pada takaran bahan kering dan, dengan perluasan makna, pada wadah yang digunakan untuk menakar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Orang juga tidak
  rationale: Menghubungkan perumpamaan ini dengan perkataan sebelumnya sekaligus menyampaikan subjek jamak generik Yunani secara wajar dalam bahasa Indonesia.
- source_word: καίουσιν λύχνον
  choice: menyalakan pelita
  rationale: Ungkapan Indonesia yang alami untuk tindakan menyalakan λύχνος, yaitu lampu minyak kecil; 'pelita' mempertahankan gambaran konkret kuno.
- source_word: τιθέασιν αὐτὸν
  choice: meletakkannya
  rationale: Menyampaikan tindakan menaruh pelita secara langsung dan mempertahankan rujukan pronominal kepada pelita.
- source_word: ὑπὸ τὸν μόδιον
  choice: di bawah gantang
  rationale: μόδιος adalah takaran bahan kering dan juga wadah penakarnya. 'Gantang' merupakan padanan ringkas yang dikenal dalam tradisi Indonesia, sementara catatan kaki menjelaskan bendanya.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: melainkan di atas kaki pelita
  rationale: λυχνία menunjuk penyangga atau tempat untuk menaruh pelita. 'Kaki pelita' jelas, konkret, dan wajar dalam ragam Alkitab Indonesia.
- source_word: καὶ λάμπει
  choice: sehingga pelita itu menerangi
  rationale: Dalam konteks ini καί menyatakan hasil praktis penempatan pelita, dan λάμπει dengan datif orang secara alami diungkapkan sebagai 'menerangi'. Catatan kaki mempertahankan kemungkinan koordinatif yang lebih formal.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: semua orang di dalam rumah
  rationale: Menjaga cakupan universal πᾶσιν dan arti spasial οἰκία tanpa menggesernya menjadi 'seisi rumah' dalam arti anggota keluarga.
theological_decisions:
- issue: Subjek jamak generik tidak dinyatakan secara eksplisit dalam bahasa Yunani
  choice: Orang juga tidak menyalakan pelita
  alternative: Tidak seorang pun menyalakan pelita; Mereka juga tidak menyalakan pelita
  rationale: '''Orang'' menyampaikan kebiasaan manusia secara umum tanpa memasukkan kelompok tertentu sebagai rujukan ''mereka'' atau mengubah bentuknya menjadi subjek tunggal.'
- issue: Hubungan καὶ sebelum λάμπει dengan klausa sebelumnya
  choice: sehingga pelita itu menerangi
  alternative: dan pelita itu menerangi; dan pelita itu bercahaya bagi
  rationale: 'Konteks mendukung nuansa hasil: pelita ditaruh pada kaki pelita agar cahayanya mencapai semua orang. Karena καί sendiri dapat dibaca sederhana sebagai ''dan'', alternatif itu dicatat agar ketegangan sintaksis tidak disembunyikan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pelita', 'gantang', dan 'kaki pelita' mempertahankan latar benda rumah tangga dunia kuno; istilah 'gantang' dijelaskan agar tetap mudah dipahami. Semua penanda catatan kaki muncul dalam teks utama.
