revisions:
- from: Orang juga tidak menyalakan pelita lalu meletakkannya di bawah gantang[a], melainkan di atas kaki pelita, sehingga pelita itu menerangi semua orang di dalam rumah.[b]
  to: Orang pun tidak menyalakan pelita lalu meletakkannya di bawah wadah takaran[a], melainkan di atas penyangga pelita, dan pelita itu menerangi semua orang di dalam rumah.
  rationale: Revisi mempertahankan gambar konkret pelita, wadah takaran, dan penyangga pelita, sambil menerjemahkan hubungan koordinatif καί secara langsung sebagai "dan". Catatan kaki kedua tidak diperlukan lagi karena teks utama tidak lagi mengubah hubungan koordinatif menjadi hubungan hasil; semua penanda catatan kaki yang tersisa hadir dalam teks utama.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:35Z'
review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena καί sebelum λάμπει adalah koordinatif ('dan'), bukan penanda hasil yang perlu diterjemahkan 'sehingga'. Walaupun hubungan tujuan dapat dipahami dari konteks, teks utama sebaiknya tidak mempersempit hubungan sintaksis itu. μόδιος menunjuk takaran kering dan, menurut perluasan makna, wadah takarannya; 'wadah takaran' lebih jelas dalam bahasa Indonesia modern daripada 'gantang' sebagai teks utama.
  naturalness: '"Orang juga tidak" dapat dipahami, tetapi "Orang pun tidak" lebih idiomatis untuk melanjutkan pernyataan negatif sebelumnya. "Penyangga pelita" menyatakan fungsi λυχνία dengan jelas dan lebih alami bagi pembaca modern daripada "kaki pelita", yang dapat disalahpahami sebagai bagian bawah pelita itu sendiri.'
  terminology: '"Pelita" tepat untuk λύχνος dalam gambaran rumah tangga kuno. "Wadah takaran" untuk μόδιος dan "penyangga pelita" untuk λυχνία mempertahankan benda konkret tanpa memakai istilah tradisional yang kurang jelas. Tidak ada istilah teologis khusus dalam ayat ini.'
  issues:
  - severity: medium
    issue: Klausa καὶ λάμπει diterjemahkan "sehingga pelita itu menerangi".
    rationale: καί secara langsung berarti "dan". Nuansa tujuan/hasil dapat tersirat secara pragmatis, tetapi "sehingga" menjadikannya eksplisit dalam teks utama dan mengurangi keterbukaan sintaksis sumber.
  - severity: low
    issue: '"Gantang" dipakai sebagai padanan utama για μόδιος.'
    rationale: Gantang terutama dikenal sebagai satuan takaran dalam penggunaan Indonesia modern, sedangkan konteks Yunani mencakup wadah yang menutupi pelita. "Wadah takaran" lebih jelas; "gantang" dapat dipertahankan sebagai alternatif dalam catatan kaki.
  - severity: low
    issue: '"Kaki pelita" berpotensi ambigu.'
    rationale: λυχνία adalah penyangga/standar tempat pelita diletakkan, bukan terutama kaki atau alas yang menyatu dengan pelita. "Penyangga pelita" menyampaikan referen tersebut dengan lebih jelas.
  revised_text: Orang pun tidak menyalakan pelita lalu meletakkannya di bawah wadah takaran[a], melainkan di atas penyangga pelita, dan pelita itu menerangi semua orang di dalam rumah.
  revised_footnotes:
