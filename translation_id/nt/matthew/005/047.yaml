id: MAT.5.47
reference: Matthew 5:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: id
  text: Dan jika kalian hanya memberi salam kepada saudara-saudara kalian[a], hal luar biasa apa yang kalian lakukan[b]? Bukankah orang-orang bukan Yahudi[c] juga melakukan hal yang sama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara”; istilah Yunani ini dapat merujuk lebih luas kepada sesama anggota kelompok sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau, “apa lagi yang kalian lakukan?”
    reason: lexical_alternative
  - marker: c
    text: Atau, “orang-orang dari bangsa lain” atau “orang-orang kafir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: memberi salam
  rationale: Kata kerja ini menunjuk pada tindakan menyapa atau menyampaikan salam; 'memberi salam' alami dalam bahasa Indonesia dan tidak menambahkan gagasan keramahtamahan yang tidak dinyatakan.
- source_word: ἀδελφοὺς
  choice: saudara-saudara
  rationale: Bentuk Yunani ini secara gramatikal maskulin jamak, tetapi dalam konteks dapat menunjuk lebih luas kepada sesama anggota kelompok. 'Saudara-saudara' mempertahankan istilah kekerabatan dan memungkinkan cakupan sosial yang lebih luas.
- source_word: μόνον
  choice: hanya
  rationale: Kata ini membatasi tindakan memberi salam pada kelompok tertentu; 'hanya' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: τί περισσὸν ποιεῖτε
  choice: apa yang kalian lakukan yang luar biasa
  rationale: περισσόν menyatakan sesuatu yang melampaui kebiasaan atau lebih daripada yang biasa; susunan ini mempertahankan daya retoris pertanyaan tanpa meratakan maknanya menjadi sekadar kuantitas.
- source_word: ἐθνικοὶ
  choice: orang-orang bukan Yahudi
  rationale: Dalam konteks Yahudi ini, istilah tersebut terutama menunjuk kepada bangsa-bangsa lain atau orang non-Yahudi. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada transliterasi 'bangsa-bangsa kafir' dan tidak memperkuat nada keagamaan secara berlebihan.
- source_word: τὸ αὐτὸ
  choice: hal yang sama
  rationale: Padanan ini secara alami menyatakan pengulangan tindakan yang baru disebutkan.
theological_decisions:
- issue: Cakupan ἀδελφοὺς dalam ajaran etis
  choice: Diterjemahkan 'saudara-saudara' dalam teks utama, dengan catatan bahwa istilah itu dapat mencakup sesama anggota kelompok sendiri.
  alternative: saudara laki-laki; saudara-saudari; sesama anggota kelompok
  rationale: Bentuk sumbernya maskulin jamak, tetapi rujukan sosialnya mungkin tidak terbatas pada saudara laki-laki secara harfiah. Catatan kaki mempertahankan ambiguitas itu tanpa memaksakan satu cakupan.
- issue: Makna ἐθνικοὶ
  choice: Diterjemahkan 'orang-orang bukan Yahudi'.
  alternative: bangsa-bangsa lain; orang-orang kafir
  rationale: Pilihan utama mempertahankan kontras etnis-komunal dalam konteks Yahudi dan menghindari muatan polemis tambahan yang dapat timbul dari kata 'kafir'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai karena verba Yunani berbentuk orang kedua jamak. Struktur pertanyaan retoris dipertahankan, termasuk οὐχί yang mengharapkan jawaban afirmatif.
