  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: id
  text: 'Tetapi Aku berkata kepadamu: Janganlah melawan orang jahat.[a] Sebaliknya, jika seseorang menampar pipi kananmu, hadapkanlah juga pipi yang lain kepadanya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Janganlah melawan kejahatan”; kemungkinan lain, “Janganlah melawan si jahat.”
    reason: alternative_reading
  - marker: b
    text: Atau “balikkan juga pipi yang lain kepadanya.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: Mempertahankan kontras δέ dan rumusan pengajaran langsung Yesus dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: μὴ ἀντιστῆναι
  choice: Jangan melawan
  rationale: ἀνθίστημι berarti menentang atau melawan. Pilihan ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada pembalasan atau perlawanan hukum.
- source_word: τῷ πονηρῷ
  choice: orang yang berbuat jahat
  rationale: Bentuk ini secara tata bahasa dapat menunjuk pada kejahatan, orang jahat, atau si jahat. Ilustrasi berikutnya tentang pelaku manusia mendukung rujukan personal-generik dalam teks utama.
- source_word: ὅστις σε ῥαπίζει
  choice: jika seseorang menampar
  rationale: Konstruksi ὅστις di sini memiliki daya tak tentu dan bersifat seperti syarat; ῥαπίζω menunjuk pada pukulan dengan tangan, khususnya tamparan.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: pipi kananmu
  rationale: σιαγών dapat berarti rahang atau pipi; dalam konteks tamparan, 'pipi' merupakan padanan Indonesia yang paling alami.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: berikan juga pipi yang lain kepadanya
  rationale: Secara harfiah berarti membalikkan atau menghadapkan yang lain kepadanya. 'Berikan juga pipi yang lain' merupakan ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
theological_decisions:
- issue: Makna τῷ πονηρῷ
  choice: orang yang berbuat jahat
  alternative: kejahatan; si jahat
  rationale: Frasa Yunani ini sungguh ambigu. Konteks langsung lebih mendukung pelaku manusia, tetapi kemungkinan abstrak dan personal-spesifik tetap dicatat agar ketegangan penafsirannya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal sesuai konteks. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk ucapan Yesus. Teks mengutamakan kejelasan umum sambil mempertahankan ambiguitas penting melalui catatan kaki.
