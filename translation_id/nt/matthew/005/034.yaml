  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: id
  text: 'Namun Aku berkata kepadamu: jangan sekali-kali bersumpah; jangan bersumpah demi surga, karena surga adalah takhta Allah;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Namun Aku berkata kepadamu
  rationale: Menjaga kontras δέ dan penekanan eksplisit pada ἐγώ, sambil memakai susunan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Jangan sekali-kali bersumpah
  rationale: ὅλως memperkuat larangan secara menyeluruh; 'sekali-kali' menyampaikan penegasan itu secara wajar.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: baik demi surga
  rationale: Dalam konteks sumpah, ἐν menyatakan sesuatu yang dijadikan sandaran sumpah, sehingga 'demi' tepat; μήτε membuka unsur pertama dari rangkaian yang berlanjut pada ayat berikutnya.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: karena surga adalah takhta Allah
  rationale: ὅτι dibaca kausal. Subjek 'surga' diulang agar rujukan pronominal tetap jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan bersumpah
  choice: Diterjemahkan secara langsung sebagai 'Jangan sekali-kali bersumpah' tanpa pembatasan tafsir tambahan.
  alternative: Menambahkan keterangan bahwa yang dilarang hanya sumpah palsu, sembrono, atau dalam percakapan biasa.
  rationale: Teks Yunani ayat ini menyatakan larangan secara luas; penjelasan atau harmonisasi teologis tidak boleh disisipkan ke dalam terjemahan.
- issue: Hubungan klausa ὅτι
  choice: '''karena'''
  alternative: '''sebab'' atau pembacaan deklaratif ''bahwa'''
  rationale: Dalam susunan ini ὅτι paling alami memberikan alasan mengapa surga tidak boleh dijadikan dasar sumpah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Aku' mengikuti rujukan kepada Yesus. Tanda titik koma dipertahankan karena kalimat dan rangkaian larangan berlanjut ke ayat berikutnya.
