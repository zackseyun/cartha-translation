review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the contrast (δέ), Jesus' emphatic first person, the comprehensive force of ὅλως, the oath formula involving heaven, and the causal clause that heaven is God's throne. The phrase μήτε is the first member of a continuing negative series; rendering it with an unpaired "baik" is less precise in this verse-by-verse presentation.
  naturalness: The sentence is otherwise clear and suitably dignified. After a colon, "Jangan" should not be capitalized. Recasting the continuing μήτε phrase as "jangan bersumpah demi surga" is idiomatic Indonesian and does not require an unpaired correlative.
  terminology: '"Allah" for θεός and "takhta" for θρόνος are standard and appropriate. "Demi" correctly expresses swearing by heaven in this context. Capitalized "Aku" is consistent with the draft''s reverential register.'
  issues:
  - severity: medium
    issue: '"baik demi surga" leaves the correlative construction incomplete'
    rationale: μήτε means "nor/neither," and its corresponding subsequent items occur in following verses. Indonesian "baik" normally anticipates "maupun"; as this verse ends with a semicolon, the isolated phrase is awkward. "jangan bersumpah demi surga" preserves the negative force and remains coherent across the verse boundary.
  - severity: low
    issue: Capitalization after colon
    rationale: In standard Indonesian prose, the imperative following this colon should begin in lowercase unless it starts a direct quotation or proper name.
  revised_text: 'Namun Aku berkata kepadamu: jangan sekali-kali bersumpah; jangan bersumpah demi surga, karena surga adalah takhta Allah;'
