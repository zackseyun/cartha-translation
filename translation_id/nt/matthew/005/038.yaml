base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: id
  text: Kalian telah mendengar bahwa telah dikatakan, “Mata ganti mata dan gigi ganti gigi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Kalian telah mendengar
  rationale: Aoristus dalam rumusan pengantar ini menunjuk pada ajaran yang telah didengar dan tetap dikenal oleh para pendengar. Bentuk 'telah mendengar' alami dalam bahasa Indonesia dan sapaan 'kalian' menyatakan orang kedua jamak.
- source_word: ὅτι
  choice: bahwa
  rationale: Mengantar isi perkataan yang didengar.
- source_word: ἐρρέθη
  choice: telah dikatakan
  rationale: Mempertahankan bentuk pasif impersonal dari λέγω tanpa menentukan penutur yang tidak disebutkan oleh teks.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Mata ganti mata
  rationale: '''Ganti'' secara ringkas dan idiomatis menyatakan pertukaran atau kesetaraan yang dibawa oleh ἀντί, sekaligus mempertahankan bentuk pepatah hukum yang seimbang.'
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan dua bagian sejajar dalam kutipan.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: gigi ganti gigi
  rationale: Mempertahankan kesejajaran, pengulangan, dan daya ingat rumusan hukum Yunani.
theological_decisions:
- issue: Penerjemahan rumusan hukum pembalasan setimpal
  choice: Mata ganti mata dan gigi ganti gigi
  alternative: Mata sebagai pengganti mata dan gigi sebagai pengganti gigi
  rationale: Rumusan singkat ini akurat terhadap ἀντί dan mudah dikenali sebagai asas hukum yang dikutip Yesus. Terjemahan tidak menentukan apakah penerapannya harus dipahami secara harfiah atau sebagai batas kesetimpalan, sehingga ketegangan teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa subjek Yunani berbentuk jamak. Rumusan kutipan dibuat padat dan berirama agar terdengar sebagai pepatah hukum.
