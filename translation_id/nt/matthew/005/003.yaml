  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: id
  text: Berbahagialah orang-orang yang miskin dalam roh[a], karena Kerajaan Surga adalah milik mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Miskin dalam roh’ juga dapat dipahami sebagai ‘miskin secara rohani’ atau ‘orang-orang yang menyadari kebutuhan rohani mereka.’ Terjemahan ini mempertahankan ungkapan Yunani tanpa mempersempit maknanya.
    reason: alternative_reading
  - marker: b
    text: Dalam bahasa Yunani, kata untuk ‘langit’ berbentuk jamak; ini merupakan ungkapan khas Matius yang lazim diterjemahkan ‘Kerajaan Surga.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Bentuk ini lazim dan bermartabat dalam ucapan bahagia, serta menyatakan keadaan yang patut disebut berbahagia karena perkenanan ilahi, bukan sekadar perasaan senang.
- source_word: οἱ πτωχοὶ
  choice: orang-orang yang miskin
  rationale: Mempertahankan makna kemiskinan atau kekurangan dari πτωχός dan daya substantival artikel οἱ, tanpa mempersempitnya menjadi pengemis.
- source_word: τῷ πνεύματι
  choice: dalam roh
  rationale: Terjemahan ringkas ini mempertahankan keterbukaan ungkapan datif Yunani dan tidak secara khusus menunjuk kepada Roh Kudus atau mengubahnya menjadi penjelasan tafsir.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan bagi pernyataan berbahagia; 'karena' jelas dan alami dalam bahasa Indonesia modern.
- source_word: αὐτῶν ἐστιν
  choice: adalah milik mereka
  rationale: Mengungkapkan konstruksi kepemilikan dalam kala kini secara alami, sambil mempertahankan penekanan bahwa kerajaan itu milik kelompok tersebut sekarang.
- source_word: ἡ βασιλεία
  choice: Kerajaan
  rationale: '''Kerajaan'' merupakan padanan baku dan mudah dipahami yang dapat mencakup baik pemerintahan maupun ranah kekuasaan raja.'
- source_word: τῶν οὐρανῶν
  choice: Surga
  rationale: Walaupun bentuk Yunani harfiah adalah jamak, 'Surga' merupakan ungkapan idiomatis Indonesia untuk formula khas Matius ini.
theological_decisions:
- issue: Makna 'miskin dalam roh'
  choice: Mempertahankan ungkapan 'miskin dalam roh' tanpa perluasan tafsir.
  alternative: miskin secara rohani; orang yang menyadari kebutuhan rohaninya; orang yang rendah hati
  rationale: Ungkapan Yunani bersifat padat dan terbuka terhadap beberapa nuansa. Mempertahankannya menghindari penyempitan makna dan menjaga ketegangan teologis sumber.
- issue: Kala kini dalam kepemilikan kerajaan
  choice: Menerjemahkan ἐστιν dalam kala kini sebagai 'adalah milik mereka'.
  alternative: akan menjadi milik mereka
  rationale: Teks Yunani memakai kala kini; terjemahan tidak boleh menggeser kepemilikan kerajaan menjadi semata-mata upah pada masa depan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'Berbahagialah' mempertahankan corak maklumat ucapan bahagia. Kapitalisasi 'Kerajaan Surga' dipakai sebagai nama konseptual yang telah mapan. Semua penanda catatan kaki dicantumkan dalam teks utama.
