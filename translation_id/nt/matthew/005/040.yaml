  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: id
  text: Dan kepada orang yang hendak menggugatmu[a] untuk mengambil bajumu[b], izinkan dia mengambil juga jubahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawamu ke pengadilan.” Kata Yunani ini secara harfiah merujuk pada diadili dalam perkara hukum.
    reason: lexical_alternative
  - marker: b
    text: “Baju” di sini adalah pakaian sebelah dalam, sedangkan “jubah” adalah pakaian luar.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: kepada orang yang hendak
  rationale: Partisipel berartikel ini menunjuk secara umum kepada siapa pun yang memiliki kehendak tersebut. “Hendak” menyampaikan unsur kemauan dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: σοι κριθῆναι
  choice: menggugatmu
  rationale: Ungkapan ini secara harfiah berkaitan dengan diadili dalam suatu perkara. Dalam konteks pengambilan pakaian melalui proses hukum, “menggugatmu” menyampaikan maksud yuridisnya secara ringkas dan jelas.
- source_word: χιτῶνά
  choice: bajumu
  rationale: χιτών adalah pakaian yang dikenakan di sebelah dalam. “Baju” mudah dipahami pembaca modern, sedangkan perbedaannya dari pakaian luar dijelaskan dalam catatan kaki.
- source_word: λαβεῖν
  choice: mengambil
  rationale: Kata ini menyatakan pengambilan atau perolehan milik dan cocok dengan konteks tuntutan hukum atas pakaian.
- source_word: ἄφες
  choice: biarkan dia memperoleh
  rationale: Imperatif ἀφίημι di sini menyatakan tindakan merelakan atau membiarkan orang lain memiliki sesuatu. Pilihan ini mempertahankan nuansa mengalah tanpa mengubahnya menjadi kata kerja “memberikan” yang tidak terdapat dalam teks Yunani.
- source_word: ἱμάτιον
  choice: jubahmu
  rationale: ἱμάτιον menunjuk pada pakaian luar, berbeda dari χιτών. “Jubah” mempertahankan latar sejarah dan kontras antara kedua jenis pakaian.
- source_word: καὶ ... καὶ
  choice: Dan ... juga
  rationale: Kata pertama menghubungkan perkataan ini dengan ajaran sebelumnya, sedangkan kata kedua menambahkan pakaian luar sebagai respons yang melampaui tuntutan awal.
theological_decisions:
- issue: Daya tuntut etis perintah Yesus dalam sengketa hukum
  choice: Diterjemahkan sebagai perintah langsung untuk mengalah secara radikal dan tidak membalas, dengan gambaran konkret tentang pakaian.
  alternative: Mengungkapkannya secara lebih longgar hanya sebagai prinsip umum untuk melepaskan hak.
  rationale: Bentuk imperatif ἄφες dan gambaran konkret tentang dua pakaian mempertahankan ketajaman ajaran Yesus. Terjemahan tidak mempersempitnya ke dalam sistem doktrinal tertentu dan tidak mengaburkannya menjadi gagasan abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. Bentuk orang kedua tunggal “-mu” dipertahankan sesuai sapaan tunggal dalam teks Yunani. Istilah pakaian dibuat mudah dipahami dalam teks utama, sementara perbedaan budaya antara pakaian dalam dan pakaian luar diterangkan dalam catatan kaki.
