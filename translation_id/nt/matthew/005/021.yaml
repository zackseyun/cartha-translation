  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: id
  text: “Kalian telah mendengar bahwa telah dikatakan kepada orang-orang zaman dahulu[a], ‘Jangan membunuh[b]; dan siapa pun yang membunuh akan bertanggung jawab di hadapan pengadilan.’[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada mereka yang hidup pada zaman dahulu.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani di sini secara khusus berarti membunuh manusia secara tidak sah, bukan membunuh dalam arti yang seluas-luasnya.
    reason: lexical_alternative
  - marker: c
    text: 'Dapat juga dipahami dengan hanya perintah pertama sebagai kutipan: “Jangan membunuh”; kemudian dilanjutkan, “dan siapa pun yang membunuh akan bertanggung jawab di hadapan pengadilan.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Kalian telah mendengar
  rationale: Bentuk orang kedua jamak dipertahankan dengan “kalian”; bentuk perfektif Indonesia menyampaikan ajaran yang pernah didengar dan tetap dikenal oleh para pendengar.
- source_word: ἐρρέθη
  choice: telah dikatakan
  rationale: Bentuk pasif mempertahankan rumusan impersonal teks Yunani tanpa menentukan siapa yang mengatakannya.
- source_word: τοῖς ἀρχαίοις
  choice: kepada orang-orang zaman dahulu
  rationale: Ungkapan ini mempertahankan fungsi datif sebagai penerima perkataan dan merujuk pada orang-orang dari masa lampau.
- source_word: Οὐ φονεύσεις
  choice: Jangan membunuh
  rationale: Ini adalah rumusan larangan yang alami dan dikenal dalam bahasa Indonesia; catatan kaki menjelaskan bahwa φονεύω khususnya menunjuk pada pembunuhan manusia secara tidak sah, bukan segala tindakan mematikan.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: dan siapa pun yang membunuh
  rationale: “Siapa pun” menyampaikan klausa relatif tak tentu dengan ἄν dan subjungtif, sedangkan “dan” mewakili δέ dalam kesinambungan kutipan.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: harus menghadapi pengadilan
  rationale: Ungkapan Indonesia ini menyampaikan pertanggungjawaban atau keterikatan pada proses keputusan hukum, tanpa mengubahnya menjadi pernyataan abstrak tentang rasa bersalah atau langsung menjadi penghukuman ilahi.
theological_decisions:
- issue: Cakupan larangan dalam perintah keenam
  choice: membunuh, dengan penjelasan bahwa yang dimaksud ialah pembunuhan manusia secara tidak sah
  alternative: membunuh dalam arti segala tindakan menghilangkan nyawa
  rationale: φονεύω lebih khusus daripada kata umum untuk membunuh; terjemahan tidak boleh menjadikan ayat ini larangan eksplisit terhadap setiap bentuk penghilangan nyawa.
- issue: Identitas penghakiman dalam τῇ κρίσει
  choice: pengadilan tanpa menentukan secara lebih jauh lembaga atau sifat hukumannya
  alternative: penghakiman atau penghukuman ilahi
  rationale: Konteksnya bersifat yudisial, tetapi teks ini sendiri tidak secara eksplisit menyebut penghakiman Allah; pilihan ini menghindari penetapan teologis yang terlalu dini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lisan-bermartabat. “Kalian” memperjelas bahwa sapaan Yunani berbentuk jamak. Susunan pasif “kepada ... telah dikatakan” sedikit formal tetapi mempertahankan struktur dan ketidakjelasan mengenai pelaku perkataan. Tanda titik koma menyatukan perintah dan konsekuensi hukumnya sebagai satu ajaran yang didengar.
