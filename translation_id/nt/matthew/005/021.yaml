  naturalness: 'Susunan “kepada orang-orang zaman dahulu telah dikatakan” dapat dipahami, tetapi lebih alami dalam bahasa Indonesia baku bila verba mendahului pelengkapnya: “telah dikatakan kepada orang-orang zaman dahulu.” “Akan bertanggung jawab di hadapan pengadilan” menyampaikan akibat hukum secara lebih langsung dan alami daripada “harus menghadapi pengadilan.”'
  terminology: “Jangan membunuh” adalah rumusan Indonesia yang mapan dan alami. Karena φονεύω lebih sempit daripada tindakan membunuh secara umum, catatan kaki yang menjelaskan maksud pembunuhan manusia secara tidak sah perlu dipertahankan. “Pengadilan” secara tepat menjaga nuansa hukum κρίσις tanpa penafsiran teologis tambahan.
