  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: Setiap orang yang menceraikan istrinya, kecuali atas alasan perbuatan seksual yang tidak bermoral[a], menyebabkan istrinya menjadi pezina[b]; dan siapa pun yang menikahi seorang perempuan yang telah diceraikan, berzina.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Perbuatan seksual yang tidak bermoral'' menerjemahkan kata Yunani porneia, istilah luas bagi perilaku seksual yang terlarang; kata ini juga dapat diterjemahkan ''percabulan''.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau, ''membuatnya menjadi perempuan yang berzina''. Infinitif Yunani berbentuk pasif dan dapat juga menyatakan akibat: ia menjadi pezina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: menceraikan / perempuan yang telah diceraikan
  rationale: Dalam konteks perkawinan, ἀπολύω berarti menceraikan, bukan sekadar menyuruh pergi atau melepaskan. Bentuk pasif pada ἀπολελυμένην dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: γυναῖκα
  choice: istri
  rationale: γυνή dapat berarti perempuan atau istri. Kata ganti kepunyaan αὐτοῦ dan konteks perceraian menuntut arti 'istri' di sini.
- source_word: παρεκτὸς λόγου πορνείας
  choice: kecuali karena percabulan
  rationale: παρεκτός menyatakan pengecualian, sedangkan λόγου menunjuk pada perkara atau alasan. 'Percabulan' mempertahankan cakupan πορνεία sebagai istilah luas untuk perilaku seksual terlarang tanpa mempersempitnya menjadi perzinaan saja.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: membuat istrinya berzina
  rationale: Konstruksi ποιέω dengan infinitif menyatakan sebab atau akibat. Ungkapan ini alami dan jelas dalam bahasa Indonesia, sementara bentuk pasif infinitif Yunani dan kemungkinan nuansa resultatifnya dicatat dalam catatan kaki.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: siapa pun yang menikahi
  rationale: Klausa relatif dengan ἐάν menyatakan keadaan umum yang tidak tentu; 'siapa pun yang' menyampaikannya secara ringkas dan alami.
- source_word: μοιχᾶται
  choice: berzina
  rationale: Dalam konteks ini, verba tersebut paling alami diterjemahkan 'berzina'; bentuk kini Yunani tidak perlu dipaksakan menjadi bentuk progresif dalam bahasa Indonesia.
- source_word: πᾶς ὁ ἀπολύων
  choice: setiap orang yang menceraikan
  rationale: Konstruksi partisip maskulin tunggal ini bersifat umum. 'Setiap orang' mempertahankan daya cakupnya, sedangkan konteks laki-laki tetap tampak dari objek 'istrinya'.
theological_decisions:
- issue: Makna klausa pengecualian παρεκτὸς λόγου πορνείας
  choice: 'Diterjemahkan sebagai pengecualian nyata: ''kecuali karena percabulan''.'
  alternative: Kecuali dalam perkara percabulan; kecuali dalam kasus perkawinan yang tidak sah.
  rationale: Bahasa Yunani secara langsung menyatakan pengecualian, tetapi terjemahan tidak menentukan secara lebih sempit cakupan πορνεία. Dengan demikian, ketegangan di antara berbagai penafsiran teologis tetap dipertahankan.
- issue: Daya μοιχευθῆναι sesudah ποιεῖ
  choice: Teks utama memakai ungkapan alami 'membuat istrinya berzina', dengan nuansa bentuk pasif Yunani dijelaskan dalam catatan kaki.
  alternative: Membuatnya menjadi pezina; menyebabkan dia dikenai perzinaan.
  rationale: Infinitif Yunani berbentuk pasif dan dapat dipahami secara resultatif, tetapi terjemahan yang memaksakan bentuk pasif akan terasa janggal dan dapat menutup kemungkinan makna lain. Catatan kaki mempertahankan ambiguitas yang relevan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti penalaran teks Yunani, tetapi pilihan katanya tetap alami bagi pembaca umum. Kata 'Aku' dikapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
