  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: id
  text: Ketika Yesus melihat orang banyak, ia naik ke gunung. Ketika ia duduk[a], murid-muridnya datang kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah ia duduk.” Konstruksi Yunani memakai genitif absolut.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Ketika melihat
  rationale: Partisip aoristus ini menyatakan keadaan yang berkaitan dengan tindakan utama tanpa harus menetapkan urutan waktu secara kaku. Bentuk ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: —
  rationale: Partikel ini hanya menjadi penghubung atau peralihan ringan; tidak perlu diterjemahkan secara eksplisit dalam bahasa Indonesia.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Bentuk Yunani jamak menunjuk pada kumpulan-kumpulan orang. Ungkapan idiomatis Indonesia 'orang banyak' menyampaikan makna kolektif tersebut dengan wajar.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: naik ke gunung
  rationale: Ungkapan ini menyatakan gerakan naik menuju atau memasuki kawasan gunung; 'naik ke gunung' alami dan tidak menentukan topografi secara berlebihan.
- source_word: τὸ ὄρος
  choice: gunung
  rationale: ὄρος lazim berarti gunung atau daerah perbukitan. 'Gunung' mempertahankan padanan langsung tanpa mengubahnya menjadi lereng atau bukit.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Setelah ia duduk
  rationale: Konstruksi genitif absolut menyatakan keadaan temporal yang mendahului datangnya para murid. 'Setelah' menghasilkan alur Indonesia yang alami, sementara alternatif 'ketika' dicatat karena hubungan waktunya tidak harus dipahami sebagai urutan yang sangat tegas.
- source_word: προσῆλθαν αὐτῷ
  choice: datang kepadanya
  rationale: προσέρχομαι berarti datang kepada atau mendekati. Pilihan ini sederhana, alami, dan sesuai dengan alur narasi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-muridnya
  rationale: μαθηταί menunjuk kepada para murid atau pengikut dalam hubungan dengan seorang guru; bentuk ini merupakan padanan baku dan alami.
theological_decisions:
- issue: Artikel tertentu pada τὸ ὄρος
  choice: ke gunung
  alternative: ke sebuah gunung; ke lereng gunung
  rationale: Bahasa Indonesia tidak selalu mengungkapkan artikel tertentu secara terpisah. 'Ke gunung' mempertahankan latar narasi tanpa menyiratkan bahwa gunung itu bernama atau telah diidentifikasi secara khusus.
- issue: Hubungan temporal καθίσαντος αὐτοῦ
  choice: Setelah ia duduk
  alternative: Ketika ia duduk
  rationale: Konstruksi tersebut menghubungkan tindakan duduk dengan kedatangan para murid dan secara wajar dapat dipahami sebagai tindakan yang mendahuluinya. Catatan kaki mempertahankan kemungkinan hubungan temporal yang lebih longgar dan tidak menambahkan makna seremonial pada posisi duduk.
- issue: Subjek tersirat pada verba orang ketiga tunggal
  choice: Yesus
  alternative: ia
  rationale: Nama 'Yesus' dipakai untuk menjernihkan rujukan subjek dalam bahasa Indonesia pada awal ayat. Ini tidak menambah tokoh baru, sebab konteks sebelumnya menetapkan Yesus sebagai subjek.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama 'Yesus' dinyatakan pada awal ayat demi kejelasan rujukan, sedangkan pronomina selanjutnya memakai 'ia'. Tidak digunakan istilah kuno atau bahasa gerejawi yang tidak dituntut oleh teks Yunani.
