id: MAT.5.8
reference: Matthew 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: id
  text: Berbahagialah orang yang murni hatinya,[a] karena merekalah yang akan melihat Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersih hatinya.”
    reason: lexical_alternative
  - marker: b
    text: Janji “akan melihat Allah” dapat menunjuk pada akses langsung ke hadirat Allah, termasuk penggenapannya pada masa mendatang; terjemahan ini mempertahankan ungkapan aslinya tanpa mempersempit maknanya.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Bentuk yang lazim dan bermartabat untuk ucapan bahagia; menyatakan keadaan yang diperkenan dan patut disebut berbahagia, bukan sekadar emosi sesaat.
- source_word: καθαροὶ
  choice: murni
  rationale: Dalam konteks batiniah ini, 'murni' secara alami menyampaikan kemurnian moral dan batin. 'Bersih' tetap merupakan kemungkinan leksikal.
- source_word: τῇ καρδίᾳ
  choice: hatinya
  rationale: Ungkapan Indonesia 'murni hatinya' menyampaikan segi atau ranah tempat kemurnian itu berlaku. 'Hati' di sini menunjuk manusia batiniah, bukan hanya perasaan.
- source_word: ὅτι
  choice: karena
  rationale: Secara jelas memperkenalkan alasan atau dasar ucapan bahagia.
- source_word: αὐτοὶ
  choice: merekalah
  rationale: 'Partikel ''-lah'' mempertahankan penekanan pada αὐτοὶ: justru orang-orang tersebutlah yang menerima janji ini.'
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk θεός dalam konteks ini dan berfungsi sebagai objek langsung dari verba 'melihat'.
- source_word: ὄψονται
  choice: akan melihat
  rationale: Menyampaikan janji dalam bentuk masa depan secara langsung dan alami tanpa menambahkan penafsiran tentang cara atau waktu penglihatannya.
theological_decisions:
- issue: Makna 'melihat Allah'
  choice: Dipertahankan sebagai 'akan melihat Allah' tanpa perluasan tafsir.
  alternative: akan mengalami kehadiran Allah; akan memandang Allah pada penggenapan akhir zaman
  rationale: Ungkapan Yunani itu ringkas dan memiliki kedalaman teologis serta kemungkinan arah eskatologis. Terjemahan langsung mempertahankan keluasan dan ketegangannya tanpa membatasi janji itu pada satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan 'murni hatinya' dipilih karena alami dalam bahasa Indonesia, sedangkan 'merekalah' mempertahankan penekanan pronomina Yunani.
