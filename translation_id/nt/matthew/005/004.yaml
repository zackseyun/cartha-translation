id: MAT.5.4
reference: Matthew 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: id
  text: Berbahagialah mereka yang berduka[a], karena mereka akan dihibur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bersedih hati." Kata Yunani ini bermakna luas dan tidak menyebutkan penyebab dukacita tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Mempertahankan bentuk ucapan bahagia yang mapan serta daya evaluatifnya sebagai pernyataan keadaan yang diperkenan Allah; lebih tepat daripada ungkapan yang hanya menunjuk pada perasaan senang.
- source_word: οἱ πενθοῦντες
  choice: mereka yang berduka
  rationale: Partisip kini berartikel diterjemahkan sebagai kelompok orang dalam bahasa Indonesia yang alami. 'Berduka' cukup luas untuk mencakup ratapan karena kehilangan, penderitaan, dosa, atau sebab lain tanpa mempersempit maksud teks.
- source_word: ὅτι
  choice: karena
  rationale: Menyampaikan hubungan sebab atau dasar bagi pernyataan bahagia secara jelas dalam bahasa Indonesia modern.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Kata ganti Yunani mengandung penegasan tertentu, tetapi bentuk 'mereka sendiri' akan terasa terlalu ditandai dalam bahasa Indonesia; struktur kalimat sudah menjaga fokus pada kelompok yang sama.
- source_word: παρακληθήσονται
  choice: akan dihibur
  rationale: Mempertahankan bentuk pasif masa depan dan makna menerima penghiburan dengan ungkapan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Cakupan dukacita dalam ucapan bahagia
  choice: Diterjemahkan secara luas sebagai 'mereka yang berduka' tanpa menetapkan sebab dukacita.
  alternative: Mereka yang berduka karena dosa; mereka yang mengalami kesedihan secara umum; atau mereka yang meratapi keadaan Israel.
  rationale: Teks Yunani tidak menyebut objek atau sebab dukacita. Terjemahan luas mempertahankan keterbukaan teologis dan pastoral perkataan ini serta tidak memasukkan penafsiran tradisional tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk 'Berbahagialah' mempertahankan pola ucapan bahagia yang dikenal luas, sedangkan 'mereka yang berduka' mudah dipahami dan tidak membatasi penyebab dukacita.
