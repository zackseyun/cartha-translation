source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: id
  text: Jangan juga bersumpah demi kepalamu, sebab kamu tidak dapat membuat sehelai rambut pun menjadi putih atau hitam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Jangan juga
  rationale: Melanjutkan rangkaian larangan sebelumnya secara alami dalam bahasa Indonesia, sambil mempertahankan hubungan koordinatif negatif.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: demi kepalamu
  rationale: Dalam konstruksi dengan ὀμόσῃς, frasa ini menyatakan sesuatu yang dijadikan jaminan atau sandaran sumpah; idiom Indonesia yang tepat ialah 'bersumpah demi'.
- source_word: ὀμόσῃς
  choice: bersumpah
  rationale: Menerjemahkan langsung verba sumpah dalam larangan μήτε dengan subjungtif aoris; bentuk imperatif negatif Indonesia menyampaikan daya larang dengan wajar.
- source_word: ὅτι
  choice: sebab
  rationale: Mempertahankan hubungan kausal yang memberikan alasan bagi larangan tersebut, dengan nada ringkas dan bermartabat.
- source_word: οὐ δύνασαι
  choice: kamu tidak dapat
  rationale: Menyatakan ketidakmampuan manusia secara langsung tanpa memperluasnya menjadi tafsiran mengenai kuasa mutlak.
- source_word: μίαν τρίχα
  choice: sehelai rambut pun
  rationale: '''Sehelai'' merupakan penggolong alami untuk rambut, sedangkan ''pun'' mempertahankan penekanan pada bahkan satu rambut.'
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: putih atau hitam
  rationale: Mempertahankan kedua istilah warna dasar dan kontras tegas dalam teks Yunani tanpa melunakkan 'putih' menjadi 'uban' atau 'hitam' menjadi 'gelap'.
- source_word: ποιῆσαι
  choice: membuat ... menjadi
  rationale: Menyampaikan makna kausatif ποιέω secara alami dalam bahasa Indonesia ketika diikuti warna sebagai keadaan hasil.
theological_decisions:
- issue: Cakupan larangan bersumpah
  choice: Menerjemahkannya sebagai larangan langsung untuk bersumpah demi kepala sendiri.
  alternative: Menjadikannya pernyataan doktrinal eksplisit yang melarang semua sumpah, atau membatasinya hanya pada sumpah manipulatif.
  rationale: Ayat ini secara khusus menyebut sumpah demi kepala dan mendasarkannya pada keterbatasan manusia. Terjemahan tidak menyelesaikan perdebatan teologis yang cakupannya melampaui bunyi ayat.
- issue: 'Dasar larangan: ketidakmampuan manusia'
  choice: Mempertahankan alasan bahwa manusia tidak dapat membuat satu rambut menjadi putih atau hitam.
  alternative: Menjelaskannya sebagai pernyataan eksplisit tentang kedaulatan Allah atas usia atau warna rambut.
  rationale: Gagasan keterbatasan manusia memang hadir dalam teks, tetapi pelaku ilahi dan penerapan khususnya tidak disebutkan secara eksplisit; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. 'Demi kepalamu' mempertahankan idiom sumpah, sedangkan 'sehelai rambut pun' terdengar alami bagi pembaca umum. Tidak diperlukan catatan kaki karena alternatif yang dicantumkan pada lapisan konsultasi Inggris sebenarnya mengulang klausa alasan, bukan varian leksikal yang perlu ditandai dalam ayat ini.
