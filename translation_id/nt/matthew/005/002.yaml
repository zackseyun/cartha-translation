  text: καὶ ἀνοίξας τὸ στόμα αὐτοῦ ἐδίδασκεν αὐτοὺς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: id
  text: 'Dan setelah membuka mulut-Nya, Ia mengajar mereka, kata-Nya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan fungsi καί sebagai penghubung sederhana tanpa menambahkan urutan waktu yang lebih tegas seperti “kemudian”.
- source_word: ἀνοίξας
  choice: setelah membuka
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. “Setelah membuka” menyampaikan hubungan itu secara wajar tanpa menghilangkan ungkapan sumber.
- source_word: τὸ στόμα αὐτοῦ
  choice: mulut-Nya
  rationale: Ungkapan harfiah ini dipertahankan karena memperkenalkan tuturan resmi atau khidmat dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: ἐδίδασκεν
  choice: Ia mengajar
  rationale: Bentuk imperfek menggambarkan tindakan mengajar dari sudut pandang yang sedang berlangsung. Bahasa Indonesia tidak wajib menandai aspek tersebut; penambahan “sedang” atau “mulai” di sini akan terasa kaku atau mempersempit maknanya.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina dipertahankan tanpa menentukan apakah acuannya hanya para murid atau kelompok yang lebih luas.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisip kini ini memperkenalkan isi pengajaran. “Kata-Nya” merupakan pengantar kutipan yang alami dan tetap menunjukkan kaitannya dengan tindakan mengajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, khidmat, dan mudah dipahami. Ungkapan “membuka mulut” sengaja dipertahankan untuk menjaga corak naratif sumber. Huruf kapital pada “Ia” dan enklitik “-Nya” mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus, tanpa menambahkan penafsiran pada identitas acuan “mereka”.
