  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: id
  text: Kalian adalah terang dunia. Sebuah kota yang terletak di atas gunung[a] tidak mungkin tersembunyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebuah kota yang terletak di atas bukit tidak mungkin tersembunyi.”
    reason: ὄρος dapat berarti “gunung” atau “bukit”; kedua padanan ini mungkin dalam citra topografis tersebut.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kalian
  rationale: Pronomina orang kedua jamak dinyatakan secara eksplisit dan bersifat menegaskan. “Kalian” menyampaikan sapaan jamak dengan jelas dalam bahasa Indonesia modern.
- source_word: τὸ φῶς
  choice: terang
  rationale: “Terang” mempertahankan metafora langsung dan merupakan padanan Alkitabiah yang alami serta mudah dipahami; artikel Yunani tidak perlu diterjemahkan secara terpisah dalam bahasa Indonesia.
- source_word: τοῦ κόσμου
  choice: dunia
  rationale: Genitif ini secara alami membentuk frasa “terang dunia,” tanpa menambahkan tafsiran tujuan seperti “bagi dunia.”
- source_word: οὐ δύναται
  choice: tidak mungkin
  rationale: Ungkapan ini menyampaikan ketidakmungkinan secara alami dalam bahasa Indonesia; dalam konstruksi pasif berikutnya, “tidak mungkin tersembunyi” lebih lancar daripada “tidak dapat disembunyikan” dan tetap menjaga nuansa bentuk pasif Yunani.
- source_word: πόλις
  choice: Kota
  rationale: “Kota” adalah padanan umum bagi πόλις dan mempertahankan gambaran permukiman yang tampak jelas.
- source_word: κρυβῆναι
  choice: tersembunyi
  rationale: Bentuk infinitif pasif ini paling alami diterjemahkan “tersembunyi,” dengan arti tidak dapat luput dari pandangan.
- source_word: ἐπάνω ὄρους
  choice: di atas gunung
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan mempertahankan kemungkinan topografis ὄρος sebagai gunung atau bukit, tanpa mempersempitnya secara diam-diam.
- source_word: κειμένη
  choice: yang terletak
  rationale: Partisipel ini berarti berada atau terletak pada suatu tempat. “Yang terletak” alami untuk kota dan tidak menyiratkan tindakan penempatan yang tidak dinyatakan secara tegas.
theological_decisions:
- issue: Identifikasi metaforis para murid sebagai terang
  choice: Kalian adalah terang dunia
  alternative: Kalian adalah terang bagi dunia
  rationale: Metafora identitas dipertahankan secara langsung. Frasa “bagi dunia” akan lebih menonjolkan fungsi atau manfaat dan dengan demikian menafsirkan hubungan genitif secara lebih khusus daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipilih untuk menandai bentuk jamak Ὑμεῖς dengan jelas. Susunan kalimat mempertahankan metafora dan citra konkret teks Yunani.
