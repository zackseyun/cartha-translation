  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: id
  text: Kamu telah mendengar bahwa dikatakan[a], “Jangan berzina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Kamu mendengar bahwa dikatakan.”
    reason: Alternatif leksikal yang mencerminkan bentuk aoristus Yunani secara lebih langsung.
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Kamu telah mendengar
  rationale: Bentuk aoristus dalam pengantar formulaik ini secara wajar menyatakan ajaran yang sudah didengar dan tetap diketahui para pendengar; bentuk perfektif Indonesia menyampaikan daya wacana itu dengan alami.
- source_word: ὅτι
  choice: bahwa
  rationale: Berfungsi sebagai penghubung yang memperkenalkan isi perkataan yang didengar.
- source_word: ἐρρέθη
  choice: telah dikatakan
  rationale: Aoristus pasif dari λέγω diterjemahkan secara impersonal; bentuk ini dekat dengan bahasa Yunani dan tetap alami dalam bahasa Indonesia.
- source_word: Οὐ μοιχεύσεις
  choice: Jangan berzina
  rationale: Future indikatif dengan fungsi larangan paling alami diterjemahkan sebagai larangan langsung dalam bahasa Indonesia. 'Berzina' adalah padanan baku dan tepat bagi μοιχεύω.
theological_decisions:
- issue: Hubungan dengan kutipan Sepuluh Perintah
  choice: Jangan berzina.
  alternative: Engkau tidak boleh berzina.
  rationale: Rumusan singkat berbentuk larangan mempertahankan hubungan yang jelas dengan perintah dalam Dekalog tanpa memakai gaya yang kaku atau menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai bentuk orang kedua jamak yang wajar dalam konteks pengajaran kepada para pendengar; jumlahnya tidak ditandai secara eksplisit dalam bahasa Indonesia. Kutipan perintah dibuat ringkas agar alami sekaligus mempertahankan gema Dekalog.
