  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: id
  text: Namun, telah dikatakan, “Siapa pun yang menceraikan istrinya, hendaklah ia memberikan kepadanya surat cerai.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyuruh istrinya pergi ... surat perceraian.” Kata Yunani yang diterjemahkan “menceraikan” juga dapat berarti “menyuruh pergi”, tetapi dalam konteks hukum perkawinan di sini kata itu mengacu pada perceraian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: telah dikatakan
  rationale: Bentuk aoristus pasif dalam rumusan pengantar kutipan ini secara alami diterjemahkan sebagai “telah dikatakan”, selaras dengan pola dalam konteks Matius 5.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang bernuansa kontras dengan bagian sebelumnya; “Namun” wajar dan tetap menjaga hubungan wacana.
- source_word: Ὃς ἂν
  choice: Siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan kondisi umum tak tentu; “Siapa pun yang” tepat dan alami dalam bahasa Indonesia.
- source_word: ἀπολύσῃ
  choice: menceraikan
  rationale: Walaupun verba ini dapat berarti “menyuruh pergi” atau “melepaskan”, konteks perkawinan dan kehadiran ἀποστάσιον menunjukkan tindakan perceraian secara hukum.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: istrinya
  rationale: Dalam konteks perceraian, γυνή berarti “istri”; unsur posesif αὐτοῦ terwakili oleh akhiran -nya.
- source_word: δότω
  choice: harus memberikan
  rationale: Imperatif orang ketiga menyatakan kewajiban dalam rumusan hukum. “Harus memberikan” lebih alami dalam bahasa Indonesia daripada konstruksi harfiah “hendaklah ia memberikan” sambil tetap mempertahankan daya perintahnya.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Bentuk datif menandai penerima surat tersebut, yaitu sang istri; “kepadanya” menyatakannya dengan jelas.
- source_word: ἀποστάσιον
  choice: surat cerai
  rationale: Nomina ini menunjuk dokumen tertulis yang mengesahkan perceraian; “surat cerai” merupakan istilah Indonesia yang ringkas, jelas, dan lazim.
theological_decisions:
- issue: Hubungan perkataan Yesus dengan ketentuan perceraian dalam hukum Musa
  choice: Menyajikannya sebagai kutipan rumusan hukum tanpa memasukkan persetujuan atau penolakan Yesus ke dalam ayat ini.
  alternative: Menerjemahkannya secara lebih interpretatif sebagai perintah Yesus yang mendukung tata cara perceraian, atau sekadar gambaran ajaran yang lazim.
  rationale: Ayat ini memperkenalkan rumusan yang akan ditanggapi Yesus pada ayat berikutnya. Terjemahan mempertahankan bentuk kutipan hukum dan tidak mendahului penilaian teologis dalam konteks selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. “Namun” mempertahankan transisi wacana, sedangkan “harus memberikan” menyampaikan imperatif hukum secara alami. Penanda catatan kaki [a] ditempatkan setelah kutipan yang memuat istilah terkait.
