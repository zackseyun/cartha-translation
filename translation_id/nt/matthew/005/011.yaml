review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan tiga tindakan terkoordinasi (menghina, menganiaya, dan mengatakan yang jahat), sifat dusta dari tuduhan (ψευδόμενοι), serta alasan yang berpusat pada Yesus (ἕνεκεν ἐμοῦ). Namun, “mengatakan segala macam kejahatan terhadap kalian” kurang idiomatis dan dapat dibaca sebagai mengatakan tindakan-tindakan jahat, bukan ujaran/tuduhan jahat. “Hal jahat tentang kalian” menyampaikan πᾶν πονηρόν καθ’ ὑμῶν secara lebih jelas dalam bahasa Indonesia tanpa mempersempit cakupannya.
  naturalness: “Dengan berdusta mengatakan” dapat dipahami, tetapi susunan “dengan dusta mengatakan” lebih ringkas dan alami dalam register baku. Kolokasi “mengatakan ... terhadap kalian” juga lebih kaku daripada “mengatakan ... tentang kalian” untuk konteks tuduhan atau fitnah.
  terminology: “Berbahagialah,” “menghina,” dan “menganiaya” sesuai dengan formula ucapan bahagia dan cakupan ὀνειδίζω/διώκω. Kapitalisasi “Aku” konsisten dengan konvensi Alkitab Indonesia. “Kalian” adalah pilihan modern baku yang konsisten untuk bentuk jamak.
  issues:
  - severity: medium
    issue: Objek “segala macam kejahatan” tidak secara jelas menunjuk pada perkataan atau tuduhan jahat.
    rationale: πᾶν πονηρὸν dalam konstruksi dengan εἴπωσιν dan καθ’ ὑμῶν berarti mengatakan segala macam hal jahat terhadap/tentang para murid. Dalam bahasa Indonesia, “kejahatan” lazimnya mengacu pada perbuatan jahat; “hal jahat” menghindari pergeseran makna itu.
  - severity: low
    issue: Susunan “dengan berdusta mengatakan” agak berat dan kurang lancar.
    rationale: “Dengan dusta mengatakan” mempertahankan fungsi adverbial ψευδόμενοι sebagai cara atau sifat tindakan berkata, dengan gaya yang lebih alami.
  - severity: low
    issue: Catatan kaki a memuat elipsis di dalam kutipan alternatif yang tidak perlu.
    rationale: 'Alternatif sebaiknya berupa frasa lengkap dan bersih: “mencela kalian.”'
  revised_text: Berbahagialah kalian ketika orang menghina dan menganiaya kalian serta dengan dusta mengatakan segala macam hal jahat tentang kalian karena Aku.[a][b][c]
