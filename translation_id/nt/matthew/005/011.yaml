  to: Berbahagialah kalian ketika orang menghina dan menganiaya kalian serta dengan dusta mengatakan segala macam hal jahat tentang kalian karena Aku.[a][b][c]
  rationale: 'Revisi ini mempertahankan seluruh makna sumber: ucapan bahagia bagi pendengar jamak; penghinaan, penganiayaan, dan tuduhan jahat yang dikoordinasikan; kepalsuan tuduhan; serta alasan “karena Aku.” Perubahan hanya memperjelas bahwa yang dimaksud ialah perkataan/tuduhan jahat dan memperbaiki kelancaran bahasa Indonesia. Tidak ada ambiguitas teologis atau jenis penganiayaan yang ditambahkan maupun dipersempit.'
