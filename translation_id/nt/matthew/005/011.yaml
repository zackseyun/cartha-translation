  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: id
  text: Berbahagialah kalian ketika orang menghina dan menganiaya kalian serta dengan dusta mengatakan segala macam hal jahat tentang kalian karena Aku.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencela kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mengatakan segala jenis hal jahat tentang kalian.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “demi Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Berbahagialah kalian
  rationale: Mempertahankan bentuk ucapan bahagia dan bobot teologis μακάριοι, dengan sapaan jamak yang jelas dalam bahasa Indonesia modern.
- source_word: ὅταν
  choice: ketika
  rationale: Secara alami menyatakan keadaan umum yang mungkin terjadi, sesuai dengan ὅταν diikuti bentuk subjungtif.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: orang menghina ... kalian
  rationale: Mengungkapkan celaan atau penghinaan verbal dengan istilah modern yang mudah dipahami; subjek tak tentu orang wajar untuk bentuk orang ketiga jamak Yunani.
- source_word: διώξωσιν
  choice: menganiaya kalian
  rationale: Menjaga keluasan tindakan permusuhan terhadap para pengikut Yesus tanpa membatasinya pada kekerasan fisik, hukum, atau sosial.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: mengatakan segala macam kejahatan terhadap kalian
  rationale: Menyampaikan luasnya πᾶν πονηρόν sebagai berbagai pernyataan jahat, sedangkan 'terhadap kalian' mencerminkan κατά dengan genitif.
- source_word: ψευδόμενοι
  choice: dengan berdusta
  rationale: Menjelaskan bahwa ucapan jahat itu tidak benar, sambil tetap mempertahankan hubungan adverbial partisipel dengan tindakan mengatakan.
- source_word: ἕνεκεν ἐμοῦ
  choice: karena Aku
  rationale: 'Menyatakan sebab penganiayaan secara langsung dan alami: hubungan atau kesetiaan kepada Yesus.'
theological_decisions:
- issue: Cakupan permusuhan yang digambarkan
  choice: Ayat ini mencakup penghinaan verbal, penganiayaan, dan berbagai tuduhan jahat yang tidak benar karena hubungan dengan Yesus.
  alternative: Membatasi penganiayaan hanya pada kekerasan fisik atau membatasi seluruh ayat hanya pada fitnah.
  rationale: Tiga tindakan yang dikoordinasikan dalam teks Yunani menunjukkan ragam permusuhan. Terjemahan tidak mempersempitnya menjadi satu bentuk tertentu.
- issue: Hubungan ψευδόμενοι dengan tuduhan jahat
  choice: Tuduhan jahat tersebut dinyatakan sebagai dusta.
  alternative: Menganggap semua ucapan negatif, termasuk yang benar, sebagai dasar ucapan bahagia.
  rationale: Partisipel ψευδόμενοι secara eksplisit mensyaratkan bahwa perkataan jahat itu tidak benar; unsur ini perlu tampak jelas tanpa mengubah keluasan πᾶν πονηρόν.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa ὑμεῖς/ὑμᾶς berbentuk jamak. Kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia ketika Yesus berbicara. Susunan tetap dekat dengan koordinasi teks Yunani, tetapi dibuat alami dalam bahasa Indonesia.
