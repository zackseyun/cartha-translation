  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: bumi dipahami dalam formula sumpah, «tumpuan kaki-Nya» merefleksikan ὑποπόδιον τῶν ποδῶν αὐτοῦ, dan εἰς Ἱεροσόλυμα diterjemahkan idiomatis sebagai «demi Yerusalem» dengan nuansa preposisinya dicatat. Namun, μήτε ... μήτε terutama melanjutkan larangan bersumpah dari ayat sebelumnya; pengulangan «ataupun» tanpa larangan tersurat kurang jelas dalam bahasa Indonesia sebagai teks ayat mandiri.'
  naturalness: «Ataupun demi ...; ataupun demi ...» terdengar tidak wajar dan kurang efektif sebagai kelanjutan larangan dalam bahasa Indonesia modern. Menyatakan kembali verba larangan sebagai «Jangan juga bersumpah demi ...» membuat struktur koordinatif dan maksudnya segera jelas. «Raja yang agung» lebih langsung daripada «Sang Raja yang agung» dan tetap mempertahankan ketakrifan serta register luhur dari τοῦ μεγάλου βασιλέως.
  terminology: «Demi», «bumi», «tumpuan kaki-Nya», dan «Yerusalem» sudah tepat. Kapitalisasi -Nya mengikuti konvensi Indonesia untuk rujukan ilahi dan didukung konteks serta alusi Yesaya, tanpa perlu menambahkan nama Allah. Catatan Mazmur 48:3 sesuai dengan penomoran yang lazim dalam Alkitab bahasa Indonesia.
