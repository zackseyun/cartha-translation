  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: id
  text: Jangan juga bersumpah demi bumi[b], karena bumi adalah tumpuan kaki-Nya; jangan juga bersumpah demi Yerusalem[a], karena Yerusalem adalah kota Raja yang agung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke” atau “ke arah Yerusalem”; dalam ungkapan sumpah, frasa Yunani ini dapat berfungsi dengan arti “demi Yerusalem”.
    reason: lexical_alternative
  - marker: b
    text: 'Menggemakan Yesaya 66:1: “bumi adalah tumpuan kaki-Ku.”'
    reason: cross_reference
  - marker: c
    text: Menggemakan Mazmur 48:3, yang menyebut Yerusalem “kota Raja yang agung”.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε … μήτε
  choice: ataupun … ataupun
  rationale: Melanjutkan rangkaian larangan bersumpah dari ayat sebelumnya dengan koordinasi negatif yang alami dalam bahasa Indonesia.
- source_word: ἐν τῇ γῇ
  choice: demi bumi
  rationale: Dalam konteks formula sumpah, ἐν menyatakan sesuatu yang dipakai sebagai jaminan sumpah. 'Demi bumi' alami dan mempertahankan kesejajaran antarklausa.
- source_word: γῇ
  choice: bumi
  rationale: Kontras dengan langit dan Yerusalem menunjukkan bumi secara umum, bukan suatu wilayah tertentu.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi larangan tersebut.
- source_word: ὑποπόδιόν
  choice: tumpuan kaki
  rationale: Padanan Indonesia yang jelas dan lazim untuk benda tempat menumpukan kaki, sekaligus mempertahankan gema bahasa Kitab Suci.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: kaki-Nya
  rationale: Bentuk ini alami dalam bahasa Indonesia; akhiran pronominal mempertahankan ungkapan Yunani, sementara kapitalisasi mengikuti konvensi Indonesia bagi rujukan kepada Allah.
- source_word: εἰς Ἱεροσόλυμα
  choice: demi Yerusalem
  rationale: Walaupun εἰς biasanya bersifat terarah, dalam konteks formula sumpah ungkapan ini paling wajar dipahami sebagai 'demi Yerusalem'. Nuansa bentuk Yunani dicatat dalam catatan kaki.
- source_word: πόλις ἐστὶν τοῦ μεγάλου βασιλέως
  choice: Yerusalem adalah kota Sang Raja yang agung
  rationale: Mengungkapkan hubungan genitif secara alami dan mempertahankan sebutan yang luhur serta gema Mazmur 48:3.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam ungkapan 'tumpuan kaki-Nya'
  choice: Menggunakan 'kaki-Nya', dengan kapitalisasi yang menunjukkan Allah sebagai rujukannya.
  alternative: Menggunakan 'kakinya' agar kapitalisasi tidak memperjelas rujukan yang secara gramatikal tetap tersirat.
  rationale: Konteks sebelumnya dan gema Yesaya 66:1 dengan kuat menunjuk kepada Allah. Kapitalisasi pronomina ilahi merupakan konvensi bahasa Indonesia dan tidak menambahkan nama yang tidak terdapat dalam teks.
- issue: Identitas 'Sang Raja yang agung'
  choice: Mempertahankan gelar tanpa menambahkan 'Allah'.
  alternative: Menerjemahkan 'Allah, Raja yang agung'.
  rationale: Teks Yunani hanya menyebut 'Raja yang agung'. Bentuk ini mempertahankan gema Mazmur dan membiarkan identitasnya dipahami dari konteks tanpa penjelasan tambahan di dalam teks.
translation_notes:
  register: Bahasa modern, jelas, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari larangan pada ayat sebelumnya. 'Sang Raja' memberi nuansa luhur tanpa terdengar usang, sedangkan 'tumpuan kaki' lebih mudah dipahami pembaca umum daripada istilah yang lebih arkais.
