  naturalness: '"Tetapi Aku berkata kepada kalian" merupakan bahasa Indonesia modern baku, alami, dan tetap sesuai dengan register khidmat. "Kasihilah" dan "berdoalah bagi" jelas serta idiomatis.'
  terminology: '"Kasihilah," "musuh-musuh kalian," dan "menganiaya kalian" mempertahankan istilah etis dan tindakan permusuhan dalam teks tanpa mempersempit kasih menjadi emosi atau menambahkan isi doa. Kapitalisasi "Aku" dipertahankan sesuai konvensi register draf bagi perkataan Yesus.'
