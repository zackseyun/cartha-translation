  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: id
  text: 'Tetapi Aku berkata kepada kalian: Kasihilah musuh-musuh kalian dan berdoalah bagi mereka yang menganiaya kalian.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: Menjaga penekanan pada ἐγώ dan pertentangan yang dinyatakan oleh δέ, sekaligus memakai ungkapan Indonesia yang wajar dan bermartabat.
- source_word: ἀγαπᾶτε
  choice: Kasihilah
  rationale: Bentuk imperatif ini menerjemahkan perintah secara langsung tanpa menambahkan penjelasan tentang bentuk atau cakupan kasih tersebut.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: musuh-musuhmu
  rationale: Padanan langsung dan alami yang mempertahankan hubungan permusuhan dalam ἐχθρός.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Padanan baku bagi προσεύχομαι yang mempertahankan daya imperatifnya.
- source_word: ὑπὲρ
  choice: bagi
  rationale: Dalam konstruksi dengan genitif ini, ὑπέρ menyatakan doa demi kepentingan orang yang dimaksud; 'bagi' menyampaikannya secara alami.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: mereka yang menganiaya kamu
  rationale: Mempertahankan sifat verbal partisipel kini dan tidak mereduksinya menjadi sekadar sebutan nominal seperti 'para penganiayamu'.
theological_decisions:
- issue: Cakupan perintah untuk mengasihi musuh
  choice: Kedua perintah diterjemahkan secara langsung tanpa menjelaskan kasih sebagai emosi atau tindakan tertentu dan tanpa menentukan isi doa.
  alternative: Memperluasnya menjadi berbuat baik kepada musuh atau berdoa secara khusus bagi pertobatan maupun berkat mereka.
  rationale: Teks memerintahkan kasih kepada musuh dan doa bagi penganiaya, tetapi tidak merinci seluruh implikasi praktis atau isi doanya; ketegangan etis dan teologis itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Aku' mengikuti rujukan kepada Yesus; 'kepadamu' dan 'kamu' mempertahankan bentuk orang kedua jamak Yunani secara alami karena bahasa Indonesia tidak wajib menandai jumlah.
