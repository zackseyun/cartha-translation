id: MAT.5.16
reference: Matthew 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: id
  text: Demikian juga, hendaklah terang kalian bersinar di hadapan orang-orang, supaya mereka melihat perbuatan baik kalian dan memuliakan Bapa kalian yang ada di surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang ada di surga-surga”; teks Yunani memakai bentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menunjukkan cara dan menghubungkan perintah ini dengan gambaran pelita dalam ayat sebelumnya.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: hendaklah terang kalian bersinar
  rationale: Mempertahankan daya imperatif orang ketiga dari λαμψάτω serta bentuk tunggal kolektif 'terang'; 'kalian' memperjelas bahwa ὑμῶν berbentuk jamak.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di hadapan orang-orang
  rationale: ἄνθρωποι merujuk kepada manusia pada umumnya, bukan hanya laki-laki; ungkapan ini alami dan tetap dekat dengan susunan sumber.
- source_word: ὅπως ἴδωσιν
  choice: supaya mereka melihat
  rationale: Menyampaikan nuansa tujuan dari ὅπως dengan verba subjungtif secara wajar dalam bahasa Indonesia.
- source_word: τὰ καλὰ ἔργα
  choice: perbuatan baik
  rationale: καλά dapat berarti baik, luhur, atau indah; 'perbuatan baik' merupakan padanan yang jelas dan lazim tanpa mempersempit maknanya secara berlebihan.
- source_word: δοξάσωσιν
  choice: memuliakan
  rationale: Padanan baku dan tepat bagi δοξάζω ketika objeknya adalah Allah.
- source_word: τὸν πατέρα ὑμῶν
  choice: Bapa kalian
  rationale: Mempertahankan bahasa relasional dan bentuk posesif jamak dari teks Yunani.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: yang ada di surga
  rationale: Bentuk ini alami dalam bahasa Indonesia; catatan kaki menjelaskan bahwa teks Yunani memakai bentuk jamak.
theological_decisions:
- issue: Cakupan ἀνθρώπων
  choice: orang-orang
  alternative: manusia
  rationale: Kata Yunani ini bersifat generik dalam konteks tersebut. 'Orang-orang' menyampaikan cakupan umum tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- issue: Bentuk jamak οὐρανοῖς
  choice: di surga
  alternative: di surga-surga
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal 'surga' untuk ungkapan ini. Bentuk jamak Yunani dipertahankan sebagai informasi dalam catatan kaki agar bukti sumber tidak disembunyikan.
- issue: Tujuan perbuatan baik yang terlihat
  choice: supaya mereka ... memuliakan Bapa kalian
  alternative: sehingga mereka ... memuliakan Bapa kalian
  rationale: ὅπως mendukung nuansa tujuan, tetapi tidak menetapkan secara terperinci hubungan antara maksud dan hasil. 'Supaya' mempertahankan ketegangan tersebut tanpa menambahkan ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa sapaan Yunani berbentuk jamak, sedangkan 'hendaklah' mempertahankan nada perintah yang bermartabat.
