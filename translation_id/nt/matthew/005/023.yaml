    text: Teks Yunani memakai “saudara” dalam bentuk maskulin tunggal; dalam konteks ini istilah tersebut dapat berfungsi secara representatif.
    reason: lexical_alternative
  revision_rationale: Revisi mengganti istilah persembahan dan idiom keluhan demi kejelasan serta kewajaran bahasa Indonesia modern, tanpa menambah rincian tentang jenis, sebab, atau keabsahan keluhan. Catatan kaki diperbaiki agar mencerminkan fakta bahwa “saudara” dalam bahasa Indonesia tidak secara gramatikal membatasi gender, sementara bentuk Yunani memang maskulin tunggal. Koma akhir dipertahankan karena kalimat berlanjut pada ayat berikutnya.
