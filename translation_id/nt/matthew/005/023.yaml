review_pass:
  verdict: revise
  source_fidelity: Teks pokok mempertahankan struktur kondisional, hubungan inferensial οὖν, latar persembahan di mazbah, dan ketaktertentuan τι. Namun, “mempunyai sesuatu terhadapmu” bukan idiom Indonesia yang memadai untuk ἔχει τι κατὰ σοῦ.
  naturalness: “Pemberianmu” dapat dipahami, tetapi “persembahanmu” jauh lebih lazim dan tepat dalam konteks kultis. “Saudaramu mempunyai sesuatu terhadapmu” terdengar harfiah dan tidak alami; “saudaramu mempunyai keluhan terhadapmu” adalah ungkapan Indonesia yang jelas dan wajar.
  terminology: “Mazbah” tepat untuk θυσιαστήριον. “Persembahan” tepat untuk δῶρον dalam konteks ini. Karena “saudara” dalam bahasa Indonesia tidak menandai gender, catatan kaki perlu menjelaskan bentuk maskulin Yunani tanpa keliru menyajikan “saudara laki-laki atau perempuanmu” sebagai alternatif yang berbeda dari teks utama.
  issues:
  - severity: medium
    issue: Ungkapan “mempunyai sesuatu terhadapmu” tidak idiomatis.
    rationale: ἔχει τι κατὰ σοῦ adalah idiom bagi adanya keluhan atau keberatan terhadap seseorang. “Mempunyai keluhan terhadapmu” menyampaikan idiom itu secara alami, sambil tidak menentukan dasar atau keabsahan keluhan tersebut.
  - severity: low
    issue: “Pemberianmu” kurang idiomatis dalam adegan persembahan di mazbah.
    rationale: Walaupun δῶρον secara leksikal berarti pemberian, “persembahanmu” merupakan padanan Indonesia yang lebih lazim dan kontekstual tanpa mengubah referennya.
  - severity: medium
    issue: Catatan kaki tentang ἀδελφός tidak selaras dengan netralitas gender kata Indonesia “saudara”.
    rationale: Dalam bahasa Indonesia, “saudaramu” sudah dapat mencakup laki-laki atau perempuan. Catatan seharusnya menjelaskan bahwa Yunani memakai bentuk maskulin tunggal yang dapat representatif, bukan menyatakan perluasan itu sebagai alternatif leksikal yang terpisah.
  revised_text: Karena itu, jika engkau sedang mempersembahkan persembahanmu di atas mazbah, lalu di sana engkau teringat bahwa saudaramu[a] mempunyai keluhan terhadapmu,
  revised_footnotes:
