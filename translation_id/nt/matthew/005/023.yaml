  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: id
  text: Karena itu, jika engkau sedang mempersembahkan persembahanmu di atas mazbah, lalu di sana engkau teringat bahwa saudaramu[a] mempunyai keluhan terhadapmu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai “saudara” dalam bentuk maskulin tunggal; dalam konteks ini istilah tersebut dapat berfungsi secara representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Karena itu, jika
  rationale: οὖν menyatakan kesimpulan dari ajaran sebelumnya, sedangkan ἐὰν memperkenalkan kondisi; ungkapan ini mempertahankan keduanya secara alami.
- source_word: προσφέρῃς
  choice: engkau sedang mempersembahkan
  rationale: Bentuk kini subjungtif menggambarkan tindakan yang sedang berlangsung dalam skenario yang hidup; 'mempersembahkan' sesuai dengan konteks ibadah.
- source_word: τὸ δῶρόν σου
  choice: pemberianmu
  rationale: δῶρον secara dasar berarti 'pemberian' dan di sini mengacu pada sesuatu yang dipersembahkan; pilihan ini tidak mempersempit maknanya melebihi teks.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: di atas mazbah
  rationale: ἐπί dengan akusatif dalam konteks ini menunjukkan bahwa pemberian dibawa atau diletakkan ke atas mazbah; terjemahan ini mempertahankan gambaran spasial sumber.
- source_word: κἀκεῖ μνησθῇς
  choice: lalu di sana engkau teringat
  rationale: κἀκεῖ mempertahankan penekanan tempat, sedangkan μνησθῇς secara alami diterjemahkan 'teringat' tanpa menentukan bagaimana ingatan itu muncul.
- source_word: ὁ ἀδελφός σου
  choice: saudaramu
  rationale: ἀδελφός berbentuk maskulin tunggal. 'Saudaramu' mempertahankan bentuk sumber, sementara catatan kaki menjelaskan kemungkinan fungsi representatifnya.
- source_word: ἔχει τι κατὰ σοῦ
  choice: mempunyai sesuatu terhadapmu
  rationale: Ungkapan ini sengaja tidak merinci perkara atau keberatan yang dimiliki saudara itu; terjemahan formal ini menjaga ketidakjelasan τι dan arah κατὰ σοῦ.
theological_decisions:
- issue: Istilah kekerabatan bergender ἀδελφός
  choice: saudaramu
  alternative: saudara laki-laki atau perempuanmu; sesama orang percaya
  rationale: Teks Yunani memakai kata maskulin tunggal. Terjemahan utama mempertahankannya dan catatan kaki mengakui bahwa dalam konteks kata itu dapat berfungsi secara representatif tanpa memasukkan perluasan tersebut ke dalam teks.
- issue: Sifat keberatan dalam ἔχει τι κατὰ σοῦ
  choice: mempunyai sesuatu terhadapmu
  alternative: menaruh keberatan terhadapmu; mempunyai keluhan terhadapmu
  rationale: Teks tidak menyebut apakah keberatan itu sah, berupa keluhan tertentu, atau akibat pelanggaran nyata. Pilihan ini menjaga ketegangan dan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan orang kedua tunggal. 'Mazbah' dipilih sebagai istilah baku untuk altar persembahan, dan struktur kalimat dibiarkan terbuka dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
