revisions:
- from: Karena itu, jika engkau sedang mempersembahkan pemberianmu di atas mazbah, lalu di sana engkau teringat bahwa saudaramu[a] mempunyai sesuatu terhadapmu,
  to: Karena itu, jika engkau sedang mempersembahkan persembahanmu di atas mazbah, lalu di sana engkau teringat bahwa saudaramu[a] mempunyai keluhan terhadapmu,
  rationale: Revisi mengganti istilah persembahan dan idiom keluhan demi kejelasan serta kewajaran bahasa Indonesia modern, tanpa menambah rincian tentang jenis, sebab, atau keabsahan keluhan. Catatan kaki diperbaiki agar mencerminkan fakta bahwa “saudara” dalam bahasa Indonesia tidak secara gramatikal membatasi gender, sementara bentuk Yunani memang maskulin tunggal. Koma akhir dipertahankan karena kalimat berlanjut pada ayat berikutnya.
