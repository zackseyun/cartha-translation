id: MAT.12.40
reference: Matthew 12:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: id
  text: Sebab, sama seperti Yunus berada di dalam perut makhluk laut besar[a] selama tiga hari dan tiga malam, demikian juga Anak Manusia akan berada di dalam jantung bumi[b] selama tiga hari dan tiga malam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ikan besar.” Istilah Yunani ini menunjuk pada makhluk laut berukuran besar dan cakupannya lebih luas daripada satu istilah zoologis tertentu.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “jantung bumi” dapat merujuk pada penguburan, kubur, di kedalaman bumi, atau alam orang mati; metafora bahasa Yunaninya dipertahankan dalam teks utama.
    reason: alternative_reading
  - marker: c
    text: Ungkapan “tiga hari dan tiga malam” kadang dipahami secara idiomatis sehingga mencakup bagian dari tiga hari, tetapi ada juga yang memahaminya secara lebih ketat.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab, sama seperti
  rationale: Mempertahankan fungsi γάρ sebagai penghubung penjelasan dan daya pembandingan ὥσπερ dalam susunan Indonesia yang wajar.
- source_word: Ἰωνᾶς
  choice: Yunus
  rationale: Memakai bentuk nama yang sudah baku dalam bahasa Indonesia dan tradisi Alkitab Indonesia.
- source_word: ἐν τῇ κοιλίᾳ
  choice: di dalam perut
  rationale: κοιλία di sini secara alami menunjuk pada perut; terjemahan ini jelas, langsung, dan sesuai dengan acuan kisah Yunus.
- source_word: τοῦ κήτους
  choice: makhluk laut besar
  rationale: κῆτος menunjuk pada makhluk laut berukuran besar dan lebih luas daripada istilah zoologis tertentu. Pilihan ini tidak mempersempitnya menjadi jenis hewan tertentu.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: tiga hari dan tiga malam
  rationale: Menerjemahkan ungkapan waktu yang diulang dalam bahasa Yunani secara langsung tanpa menentukan terlebih dahulu apakah ungkapan itu idiomatis atau ketat secara kronologis.
- source_word: οὕτως
  choice: demikian juga
  rationale: Menandai bagian kedua perbandingan dengan jelas dan alami dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Merupakan bentuk baku gelar ini dalam bahasa Indonesia serta mempertahankan gema dan ketegangan makna alkitabiahnya.
- source_word: ἔσται
  choice: akan berada
  rationale: Menyampaikan bentuk futur εἰμί tanpa menambahkan gagasan durasi seperti 'akan tinggal'.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: di dalam jantung bumi
  rationale: Mempertahankan metafora καρδία secara konkret. 'Jantung bumi' dapat dipahami dalam bahasa Indonesia sebagai bagian terdalam tanpa menggantinya dengan satu tafsiran teologis tertentu.
theological_decisions:
- issue: Makna 'jantung bumi'
  choice: Metafora dipertahankan sebagai 'jantung bumi' tanpa menetapkan apakah yang dimaksud ialah penguburan, kubur, kedalaman bumi, atau alam orang mati.
  alternative: kubur; kedalaman bumi; alam orang mati
  rationale: Bahasa Yunani bersifat metaforis dan tidak mengharuskan satu penjabaran teologis tertentu; karena itu ketegangan penafsirannya dipertahankan.
- issue: Daya ungkapan 'tiga hari dan tiga malam'
  choice: Ungkapan waktu diterjemahkan secara harfiah dalam teks utama.
  alternative: Ungkapan Semitis yang mencakup bagian dari tiga hari; masa tepat tujuh puluh dua jam
  rationale: Ayat menyatakan ungkapan tersebut secara eksplisit, sedangkan penentuan cara menghitungnya merupakan persoalan penafsiran yang tidak patut diselesaikan diam-diam dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan susunan perbandingan yang jelas. Istilah 'makhluk laut besar' menjaga keluasan makna κῆτος, sedangkan 'jantung bumi' sengaja mempertahankan metafora dan ambiguitas sumber.
