  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: id
  text: Ketika roh najis keluar dari orang itu, roh itu melintasi tempat-tempat yang tidak berair[a] sambil mencari perhentian, tetapi tidak menemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat kering”. Secara harfiah, bahasa Yunani berbunyi “tempat-tempat yang tidak berair”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ketika
  rationale: Ὅταν memperkenalkan keadaan temporal yang bersifat umum. δέ menandai peralihan ringan dalam wacana dan tidak perlu diterjemahkan secara tersendiri bila hasilnya kurang alami dalam bahasa Indonesia.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: roh najis
  rationale: Ungkapan baku dan transparan dalam konteks pengusiran roh di Injil; mempertahankan latar konsep kenajisan tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'setan'.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: keluar dari orang itu
  rationale: Bentuk aoristus subjungtif setelah ὅταν wajar diterjemahkan dengan bentuk umum 'keluar'. ἄνθρωπος di sini berarti manusia/orang, dan artikel menunjuk kepada sosok dalam ilustrasi tanpa menuntut penandaan gender dalam bahasa Indonesia.
- source_word: διέρχεται
  choice: roh itu melewati
  rationale: '''Melewati'' menyampaikan gerak melalui suatu kawasan. Subjek ''roh itu'' diulang agar rujukannya jelas dan kalimat alami dalam bahasa Indonesia.'
- source_word: δι’ ἀνύδρων τόπων
  choice: tempat-tempat yang tidak berair
  rationale: ἄνυδρος secara konkret berarti 'tanpa air'. Pilihan ini mempertahankan citra sumber; alternatif tradisional 'tempat-tempat kering' dicatat dalam catatan kaki.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: untuk mencari perhentian
  rationale: Partisip ζητοῦν menyatakan tindakan yang menyertai gerak dan juga tujuannya dalam konteks. 'Perhentian' mempertahankan makna keadaan beristirahat tanpa mempersempitnya menjadi lokasi tertentu.
- source_word: καὶ οὐχ εὑρίσκει
  choice: tetapi tidak menemukannya
  rationale: καί dapat bernuansa kontras dalam alur kalimat ini dan secara alami dinyatakan dengan 'tetapi'. Akhiran '-nya' merujuk pada perhentian yang dicari, yaitu objek yang tersirat dalam bahasa Yunani.
theological_decisions:
- issue: Terjemahan πνεῦμα dalam konteks pengusiran roh
  choice: roh
  alternative: setan; roh jahat
  rationale: Referennya adalah makhluk rohani yang jahat, tetapi teks Yunani memakai πνεῦμα dengan atribut 'najis', bukan δαιμόνιον. 'Roh najis' mempertahankan ungkapan sumber dan ketegangan konseptualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan citra konkret 'tidak berair' dan istilah sumber 'roh najis'.
