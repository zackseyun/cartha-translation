  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: id
  text: Jadi, betapa jauh lebih berharganya seorang manusia daripada seekor domba! Karena itu, pada hari Sabat diperbolehkan berbuat baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari-hari Sabat.” Bahasa Yunani memakai bentuk jamak, yang lazim digunakan sebagai ungkapan untuk pemeliharaan Sabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: Jadi, betapa jauh lebih
  rationale: Gabungan ini menyampaikan kesimpulan retoris dari yang lebih kecil kepada yang lebih besar. Ungkapan tersebut alami dalam bahasa Indonesia dan mempertahankan daya seru kalimat.
- source_word: διαφέρει
  choice: lebih berharganya
  rationale: Dalam konteks ini, kata kerja tersebut menunjukkan keunggulan nilai, bukan sekadar perbedaan.
- source_word: ἄνθρωπος
  choice: seorang manusia
  rationale: Ἄνθρωπος di sini menunjuk manusia secara umum dalam perbandingan dengan seekor domba; pilihan ini tepat dan alami tanpa mempersempit rujukannya pada laki-laki.
- source_word: προβάτου
  choice: daripada seekor domba
  rationale: Bentuk genitif menandai unsur pembanding; 'seekor domba' merupakan ungkapan Indonesia yang wajar.
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari perbandingan sebelumnya.
- source_word: ἔξεστιν
  choice: diperbolehkan
  rationale: Konteksnya adalah perdebatan mengenai apa yang boleh menurut hukum Sabat; 'diperbolehkan' mempertahankan nuansa legal-etis.
- source_word: τοῖς σάββασιν
  choice: pada hari-hari Sabat
  rationale: Mempertahankan bentuk jamak Yunani secara transparan, sedangkan bentuk tunggal yang idiomatis dijelaskan dalam catatan kaki.
- source_word: καλῶς ποιεῖν
  choice: berbuat baik
  rationale: Padanan ringkas dan alami untuk ungkapan yang berarti melakukan tindakan yang baik atau bermanfaat.
theological_decisions:
- issue: Cakupan ἄνθρωπος
  choice: seorang manusia
  alternative: seorang laki-laki
  rationale: Kata itu berbentuk tunggal dan mewakili umat manusia secara umum; konteksnya membandingkan nilai manusia dengan domba, bukan membedakan jenis kelamin.
- issue: Bentuk jamak Sabat
  choice: pada hari-hari Sabat
  alternative: pada hari Sabat
  rationale: Teks utama mempertahankan bentuk jamak sumber, sementara catatan menjelaskan bahwa bentuk itu dapat berfungsi sebagai idiom umum untuk pemeliharaan Sabat.
- issue: Nuansa ἔξεστιν
  choice: diperbolehkan
  alternative: sah menurut hukum
  rationale: Pilihan utama menyampaikan izin dalam kerangka hukum Sabat tanpa membuat pernyataan lebih teknis daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda seru mempertahankan kekuatan retoris perbandingan, sedangkan struktur dua kalimat menjaga alur dari alasan menuju kesimpulan.
