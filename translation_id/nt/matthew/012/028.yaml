  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: id
  text: Namun, jika Aku mengusir roh-roh jahat oleh Roh Allah[a], berarti Kerajaan Allah telah datang kepada kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Roh Allah.” Frasa Yunani ini dapat diterjemahkan sebagai sarana atau perantaraan, dan juga dapat dipahami sebagai lingkup tindakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah mencapai kalian” atau “telah tiba atas kalian.” Kata kerja Yunaninya menekankan bahwa Kerajaan Allah sudah mencapai mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Menyampaikan syarat sekaligus kontras ringan yang ditandai δέ dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἐν πνεύματι θεοῦ
  choice: dengan Roh Allah
  rationale: ἐν dengan datif di sini paling wajar menyatakan sarana atau perantaraan; pilihan ini tetap memungkinkan nuansa tindakan dalam kuasa Roh tanpa menambahkan penjelasan ke dalam teks.
- source_word: ἐγὼ
  choice: Aku
  rationale: Kata ganti Yunani dinyatakan secara eksplisit dan bersifat menegaskan; huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk kata ganti yang merujuk kepada Yesus.
- source_word: ἐκβάλλω
  choice: mengusir
  rationale: Padanan modern dan jelas untuk tindakan mengeluarkan makhluk roh secara paksa.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Padanan yang lazim dan mudah dipahami bagi δαιμόνια dalam bahasa Indonesia modern; istilah ini menunjuk kepada makhluk roh jahat, bukan sekadar pengaruh abstrak.
- source_word: ἄρα
  choice: berarti
  rationale: Menandai kesimpulan logis dari klausa bersyarat secara ringkas dan alami.
- source_word: ἔφθασεν
  choice: telah datang
  rationale: Menyampaikan bahwa kerajaan itu sudah mencapai atau tiba pada para pendengar, dengan relevansi nyata pada saat itu.
- source_word: ἐφ’ ὑμᾶς
  choice: kepada kalian
  rationale: Mengungkapkan arah dan pencapaian yang terkandung dalam ἐπί dengan akusatif setelah φθάνω; 'kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku yang mempertahankan cakupan makna pemerintahan rajawi maupun ranah kerajaan Allah.
theological_decisions:
- issue: Makna Kerajaan Allah sehubungan dengan pengusiran roh-roh jahat oleh Yesus
  choice: Pengusiran roh-roh jahat dengan Roh Allah menjadi bukti bahwa Kerajaan Allah benar-benar telah mencapai para pendengar Yesus.
  alternative: Kerajaan itu baru mendekat, belum tiba; atau ungkapan ini hanya menunjuk kepada penggenapan pada masa depan.
  rationale: Aoristus ἔφθασεν menyatakan kedatangan atau pencapaian. Terjemahan mempertahankan kenyataan kehadiran kerajaan dalam karya Yesus tanpa menjelaskan atau meniadakan dimensi penggenapannya yang akan datang.
- issue: Rujukan frasa πνεύματι θεοῦ
  choice: Roh Allah sebagai pelaku ilahi yang melalui-Nya Yesus mengusir roh-roh jahat.
  alternative: Kuasa ilahi yang tidak berpribadi.
  rationale: Frasa tersebut dalam konteks ini secara alami merujuk kepada Roh Allah. Terjemahan tidak memperluas pernyataan melampaui yang dikatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun, jika' mempertahankan alur argumentasi; 'berarti' menyatakan kesimpulan dengan alami. Bentuk 'kalian' dipakai untuk menampilkan jamaknya ὑμᾶς. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkan.
