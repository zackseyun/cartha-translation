  verdict: revise
  source_fidelity: Draf pada umumnya setia pada teks Yunani. Namun, klausa tujuan ἵνα κατηγορήσωσιν αὐτοῦ seharusnya langsung menerangkan alasan pertanyaan mereka, bukan dibentuk sebagai kalimat baru yang mengulang “Mereka bertanya.” Revisi mempertahankan tujuan “supaya ... menuduh-Nya” dan rujukan kepada Yesus tanpa menambah makna.
  naturalness: “Lihatlah” sesuai untuk ἰδού, dan bentuk jamak “hari-hari Sabat” dapat dipertahankan demi transparansi sumber. Pengulangan “Mereka bertanya demikian” setelah kutipan terasa tidak alami dan bertele-tele dalam bahasa Indonesia modern; menghubungkan klausa tujuan langsung pada pertanyaan lebih lancar.
  terminology: “Menyembuhkan,” “boleh,” dan “menuduh-Nya” tepat dalam konteks perdebatan Sabat. “Tangannya layu” dengan aman mempertahankan ketidakspesifikan kondisi ξηρά tanpa memaksakan diagnosis medis. Catatan kaki secara tepat menjelaskan bentuk jamak Yunani.
  issues:
