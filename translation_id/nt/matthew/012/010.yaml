id: MAT.12.10
reference: Matthew 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: id
  text: Lihatlah, ada seorang yang tangannya layu. Mereka bertanya kepada Yesus, “Apakah orang boleh menyembuhkan pada hari-hari Sabat[a]?” supaya mereka dapat menuduh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “pada hari Sabat.” Bahasa Yunani memakai bentuk jamak, “pada hari-hari Sabat,” suatu cara yang lazim untuk merujuk kepada hari Sabat secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian pembaca kepada orang yang muncul dalam adegan, dengan bentuk Indonesia yang jelas dan wajar.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Dalam konteks ini nomina tersebut menunjuk kepada seorang laki-laki tertentu. Bahasa Indonesia dapat menyatakannya secara alami dengan 'seorang' tanpa harus mengulang kata 'laki-laki'.
- source_word: χεῖρα ἔχων ξηράν
  choice: yang tangannya layu
  rationale: Menyampaikan gambaran bahwa tangan itu mengering, menyusut, atau kehilangan fungsi tanpa menentukan diagnosis medis yang tidak dinyatakan oleh teks.
- source_word: ἐπηρώτησαν αὐτόν
  choice: Mereka bertanya kepada Yesus
  rationale: Merupakan padanan naratif yang alami. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia; nada bermusuhan tidak dibebankan pada verba ini karena maksud menuduh dinyatakan kemudian.
- source_word: λέγοντες
  choice: langsung diwujudkan sebagai kutipan pertanyaan
  rationale: Partisipel Yunani tidak perlu diterjemahkan secara kaku sebagai 'dengan berkata'; tanda kutip dan verba 'bertanya' sudah menyampaikan fungsinya secara alami.
- source_word: ἔξεστι
  choice: Apakah orang boleh
  rationale: Dalam konteks perdebatan mengenai Sabat, 'boleh' menanyakan apa yang diizinkan menurut hukum, sekaligus tetap alami bagi pembaca Indonesia.
- source_word: τοῖς σάββασιν
  choice: pada hari-hari Sabat
  rationale: Mempertahankan bentuk jamak Yunani secara transparan. Dalam bahasa Indonesia, pengulangan makna jamak melalui 'hari-hari' tetap mudah dipahami.
- source_word: θεραπεύειν
  choice: menyembuhkan
  rationale: Padanan yang paling alami dalam kisah penyembuhan dan tidak membatasi tindakan itu pada suatu teknik pengobatan tertentu.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: supaya dapat menuduh Dia
  rationale: Mempertahankan makna tujuan dari ἵνα dan daya hukum-adversatif dari κατηγορέω tanpa memperberatnya menjadi dakwaan resmi yang belum tentu dimaksudkan.
theological_decisions:
- issue: Bentuk jamak ungkapan Sabat dalam konteks perdebatan hukum
  choice: pada hari-hari Sabat
  alternative: pada hari Sabat
  rationale: Teks Yunani memakai bentuk jamak τοῖς σάββασιν, yang dapat menjadi ungkapan lazim bagi hari Sabat secara umum. Bentuk jamak dipertahankan dalam teks utama, sedangkan bentuk tunggal yang lebih idiomatis dicatat sebagai alternatif.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur Yunani diolah secukupnya agar alami: partisipel ''berkata'' dinyatakan melalui kutipan langsung, dan klausa tujuan terakhir dibuat sebagai kalimat tersendiri demi kejelasan. Kapitalisasi ''Dia'' mengikuti konvensi Indonesia yang umum untuk pronomina yang merujuk kepada Yesus.'
