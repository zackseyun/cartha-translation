  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: id
  text: Dan bangsa-bangsa akan berharap pada nama-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang bukan Yahudi akan berharap pada nama-Nya.”
    reason: ἔθνη dapat berarti bangsa-bangsa secara umum atau, dalam pembedaan dari Israel, orang-orang bukan Yahudi.
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini dipertahankan untuk mengaitkan ayat tersebut dengan bagian sebelumnya dalam kutipan yang sama.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: kepada nama-Nya
  rationale: Dativus sebagai pelengkap ἐλπίζω menyatakan arah atau sasaran pengharapan. Ungkapan ini mempertahankan makna harfiah ὄνομα beserta gaung tentang pribadi dan kewenangan yang diwakili oleh nama itu.
- source_word: ἔθνη
  choice: bangsa-bangsa
  rationale: Dalam konteks kutipan Yesaya, kata ini menunjuk kepada berbagai bangsa, khususnya bangsa-bangsa di luar Israel, tanpa mempersempitnya menjadi label etnis semata.
- source_word: ἐλπιοῦσιν
  choice: akan menaruh harapan
  rationale: Bentuk future active indicative dipertahankan dengan 'akan'. Frasa 'menaruh harapan' mengungkapkan ἐλπίζω secara alami dalam bahasa Indonesia dan lebih tepat daripada sekadar 'percaya'.
theological_decisions:
- issue: Cakupan ἔθνη dalam kutipan mesianik
  choice: bangsa-bangsa
  alternative: orang-orang bukan Yahudi
  rationale: '''Bangsa-bangsa'' mempertahankan cakrawala kutipan Perjanjian Lama dan tetap mencakup pengertian bangsa-bangsa di luar Israel. Alternatif dicatat karena nuansa tersebut juga mungkin dimaksudkan.'
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Menaruh harapan kepada' dipilih sebagai padanan idiomatis yang tetap dekat dengan struktur dan makna sumber.
source_grounding:
  english_pob_role: consult_only
