  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: id
  text: Orang yang tidak bersama-Ku menentang Aku,[a] dan orang yang tidak mengumpulkan bersama-Ku mencerai-beraikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang tidak bersama-Ku menentang Aku, dan siapa yang tidak mengumpulkan bersama-Ku mencerai-beraikan.”
    reason: Alternatif ini menerjemahkan konstruksi substantival Yunani dengan kata ganti generik “siapa”, sedangkan teks utama memakai “orang yang” agar lebih eksplisit dan alami.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: orang yang tidak
  rationale: Artikel dengan partisipel berfungsi substantival dan menunjuk secara umum kepada siapa pun yang dicirikan oleh ketidakbersamaannya dengan Yesus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan acuan personal generik.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: μετά dengan genitif menyatakan kebersamaan atau persekutuan. “Bersama-Ku” langsung, alami, dan mempertahankan makna keberpihakan relasional tanpa mempersempitnya menjadi sekadar “di pihak-Ku”.
- source_word: κατ’ ἐμοῦ
  choice: menentang Aku
  rationale: κατά dengan genitif di sini menyatakan pertentangan. “Menentang Aku” menyampaikan oposisi secara jelas dan idiomatis.
- source_word: συνάγων
  choice: mengumpulkan
  rationale: Partisipel ini menyatakan tindakan menghimpun atau mengumpulkan. Pilihan ini mempertahankan gambaran yang tidak dirinci dalam teks dan membentuk kontras langsung dengan “mencerai-beraikan”.
- source_word: σκορπίζει
  choice: mencerai-beraikan
  rationale: σκορπίζω berarti menyebarkan atau membuat tercerai-berai. “Mencerai-beraikan” merupakan lawan yang alami bagi “mengumpulkan” serta mempertahankan paralelisme antitetis.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan dua pernyataan sejajar secara aditif. “Dan” mempertahankan koordinasi bahasa Yunani tanpa mengubahnya menjadi pertentangan.
theological_decisions:
- issue: Ketegasan antitesis mutlak dalam perkataan Yesus
  choice: Diterjemahkan sebagai pernyataan tegas bahwa orang yang tidak bersama Yesus menentang-Nya, tanpa melunakkan polaritasnya.
  alternative: Parafrasa yang lebih longgar dan mengurangi ketegasan kontras.
  rationale: Bahasa Yunani menyajikan dua klausa sejajar yang tajam tanpa ungkapan pembatas. Terjemahan mempertahankan ketegangan dan eksklusivitas ini tanpa menarik kesimpulan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi pada enklitik “-Ku” mengikuti kebiasaan penulisan rujukan kepada Yesus. Koma sebelum penanda catatan kaki dipertahankan sesuai letak alternatif yang mencakup seluruh ayat.
