  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: id
  text: Dan setelah meninggalkan tempat itu, Yesus masuk ke sinagoge mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Setelah
  rationale: Dalam bahasa Indonesia, hubungan dengan tindakan partisipial berikutnya paling alami dinyatakan sebagai anak kalimat waktu. Unsur penghubung καί tidak diterjemahkan secara terpisah karena urutan naratif sudah tersampaikan dengan jelas.
- source_word: μεταβὰς ἐκεῖθεν
  choice: pergi dari sana
  rationale: Ungkapan ini menyatakan perpindahan dari tempat sebelumnya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan arah keberangkatan tanpa menambahkan rincian.
- source_word: ἦλθεν
  choice: masuk
  rationale: Dalam gabungan dengan εἰς dan rumah ibadat sebagai tujuan, 'masuk' menyampaikan gerak menuju bagian dalam tempat itu secara wajar dalam bahasa Indonesia.
- source_word: εἰς τὴν συναγωγὴν
  choice: ke rumah ibadat
  rationale: Makna arah εἰς terwakili oleh konstruksi Indonesia dengan 'masuk ke'. 'Rumah ibadat' adalah istilah baku dan mudah dipahami untuk tempat pertemuan serta ibadah Yahudi.
- source_word: αὐτῶν
  choice: mereka
  rationale: Mempertahankan kata ganti jamak yang rujukannya tidak diperinci oleh teks Yunani.
- source_word: implicit subject of ἦλθεν
  choice: Yesus
  rationale: Bahasa Yunani mengandalkan subjek yang dipahami dari konteks. Menyebut 'Yesus' menghindari kejanggalan dan ketidakjelasan dalam ayat Indonesia yang berdiri sendiri, tanpa mengubah rujukannya.
theological_decisions:
- issue: Rujukan frasa 'rumah ibadat mereka'
  choice: Dipertahankan secara netral sebagai 'rumah ibadat mereka'.
  alternative: rumah ibadat orang Farisi; rumah ibadat orang Yahudi
  rationale: Kata αὐτῶν tidak mengidentifikasi kelompok itu secara eksplisit. Menentukan kelompok tertentu akan menambahkan penafsiran dan berpotensi memberi nuansa polemis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur partisipial Yunani dialihkan menjadi anak kalimat waktu agar alami. Istilah 'rumah ibadat' dipilih sebagai padanan Indonesia yang lazim bagi συναγωγή.
