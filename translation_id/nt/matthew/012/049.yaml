  source_fidelity: 'Struktur utama dan tindakan yang menyertai ujaran diterjemahkan dengan setia: ἐκτείνας ... εἶπεν ditangkap secara alami oleh “sambil mengulurkan ... Ia berkata,” dan ἐπὶ + akusatif tepat sebagai arah “ke arah.” Namun, “saudara-saudara laki-laki-Ku” terlalu mempersempit οἱ ἀδελφοί μου menjadi laki-laki saja. Bentuk jamak maskulin Yunani dapat mencakup kelompok campuran; dalam konteks ini para murid tidak dibatasi sebagai laki-laki.'
