  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: id
  text: Lalu, sambil mengulurkan tangan-Nya ke arah murid-murid-Nya, Ia berkata, “Lihatlah, inilah ibu-Ku dan saudara-saudara-Ku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: sambil mengulurkan
  rationale: Partisip aoris ini menyatakan tindakan yang menyertai ujaran utama. Bentuk “sambil mengulurkan” alami dalam bahasa Indonesia dan mempertahankan gerak fisik yang dilakukan Yesus.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: tangan-Nya
  rationale: χείρ dalam konteks gerak menunjuk pada tangan; pronomina posesif dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: ἐπὶ
  choice: ke arah
  rationale: Dengan akusatif dalam konteks gerak tangan, ἐπί menyatakan arah menuju para murid, bukan posisi di atas mereka.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: murid-murid-Nya
  rationale: “Murid” adalah padanan baku dan tepat bagi μαθητής, serta mempertahankan hubungan guru-murid.
- source_word: Ἰδοὺ
  choice: Lihatlah, inilah
  rationale: ἰδού berfungsi menarik perhatian sekaligus menunjuk orang-orang yang hadir. Ungkapan ini menyampaikan daya demonstratif dan penekanan secara alami dalam bahasa Indonesia.
- source_word: ἡ μήτηρ μου
  choice: ibu-Ku
  rationale: Padanan langsung bagi istilah kekerabatan μήτηρ.
- source_word: οἱ ἀδελφοί μου
  choice: saudara-saudara laki-laki-Ku
  rationale: ἀδελφοί berbentuk jamak maskulin. Penyebutan “laki-laki” mempertahankan bentuk yang eksplisit dan menghindari perluasan interpretatif menjadi saudara laki-laki dan perempuan.
theological_decisions:
- issue: Bahasa kekerabatan dalam pernyataan Yesus tentang keluarga-Nya
  choice: Mempertahankan istilah konkret “ibu” dan “saudara-saudara laki-laki”
  alternative: Menggunakan istilah lebih luas seperti “keluarga” atau “saudara-saudari”
  rationale: Ayat ini memakai istilah kekerabatan konkret untuk menyamakan para murid dengan keluarga Yesus. Parafrasa yang lebih luas akan mengurangi ketajaman retoris dan menambahkan cakupan yang tidak dinyatakan secara eksplisit oleh bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Lalu” menghubungkan tindakan ini dengan konteks naratif; kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena makna demonstratif ἰδού dan bentuk maskulin ἀδελφοί dapat disampaikan langsung secara jelas dalam teks.
