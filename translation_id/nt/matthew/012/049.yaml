  terminology: “Murid-murid-Nya,” “ibu-Ku,” dan “saudara-saudara-Ku” adalah istilah yang alami dan konsisten. Menghilangkan “laki-laki” mencegah pembatasan makna yang tidak dituntut oleh bentuk maskulin Yunani, tanpa menggantinya dengan perluasan “saudara-saudari.”
