source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: id
  text: Namun, Yesus mengetahui pikiran mereka[a], lalu berkata kepada mereka, “Setiap kerajaan yang terpecah melawan dirinya sendiri menjadi sunyi[b], dan setiap kota atau rumah tangga[c] yang terpecah melawan dirinya sendiri tidak akan bertahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertimbangan” atau “niat batin.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menjadi tandus” atau “dibinasakan.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Yunaninya juga dapat berarti “rumah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: karena mengetahui
  rationale: Partisip aoristus ini menyatakan keadaan yang menyertai dan secara wajar menjadi latar bagi tindakan berkata. Ungkapan ini menyatakan bahwa Yesus mengetahui tanpa menentukan bagaimana Ia mengetahuinya.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa pertentangan ringan terhadap tuduhan atau pemikiran sebelumnya; “Namun” alami dalam bahasa Indonesia modern.
- source_word: ἐνθυμήσεις
  choice: pikiran
  rationale: Kata ini dapat berarti pikiran, pertimbangan batin, atau niat. “Pikiran” paling luas dan jelas, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: Πᾶσα βασιλεία
  choice: Setiap kerajaan
  rationale: πᾶσα dengan nomina tunggal menyatakan prinsip umum; “setiap kerajaan” mempertahankan cakupan universal pernyataan tersebut.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: yang terpecah dan saling melawan
  rationale: Terjemahan ini mengungkapkan pembelahan internal sekaligus daya adversatif κατά. Frasa “melawan dirinya sendiri” lebih harfiah, tetapi kurang alami ketika diterapkan berturut-turut pada kerajaan, kota, dan rumah tangga.
- source_word: ἐρημοῦται
  choice: akan hancur
  rationale: Bentuk kini dalam pepatah menyatakan akibat yang tetap atau lazim. “Akan hancur” menyampaikan akibat berupa kehancuran secara alami dalam bahasa Indonesia, tanpa mempersempitnya menjadi kehancuran fisik semata.
- source_word: πόλις ἢ οἰκία
  choice: kota atau rumah tangga
  rationale: πόλις berarti kota. Dalam rangkaian satuan sosial—kerajaan, kota, οἰκία—“rumah tangga” paling alami untuk οἰκία, sambil mencatat kemungkinan arti bangunan “rumah” dalam catatan kaki.
- source_word: οὐ σταθήσεται
  choice: tidak akan bertahan
  rationale: Dalam idiom ini, bentuk pasif futurum ἵστημι berarti tetap berdiri, mapan, atau bertahan. “Tidak akan bertahan” jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat pengetahuan Yesus tentang pikiran mereka
  choice: Menyatakan hanya bahwa Yesus mengetahui pikiran mereka
  alternative: Menjelaskan pengetahuan itu sebagai kemahatahuan adikodrati, wawasan kenabian, atau kesimpulan berdasarkan keadaan
  rationale: Teks menyatakan fakta bahwa Yesus mengetahui pikiran mereka, tetapi tidak menerangkan caranya. Terjemahan tidak menambahkan penjelasan teologis yang tidak dinyatakan dalam ayat.
- issue: Cakupan οἰκία dalam peribahasa
  choice: rumah tangga
  alternative: rumah
  rationale: Dalam paralel dengan kerajaan dan kota, satuan sosial “rumah tangga” cocok dengan argumen tentang perpecahan internal. Namun, karena οἰκία juga dapat berarti rumah sebagai bangunan, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan kalimat mempertahankan bentuk peribahasa dan paralel antara kerajaan, kota, dan rumah tangga. Nama “Yesus” dipakai sebagai subjek tersurat agar rujukan pronomina jelas dalam ayat yang berdiri sendiri.
