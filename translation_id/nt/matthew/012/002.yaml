id: MAT.12.2
reference: Matthew 12:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: id
  text: Namun, ketika orang-orang Farisi melihat hal itu, mereka berkata kepada-Nya, “Lihat, murid-murid-Mu melakukan apa yang tidak diperbolehkan dilakukan pada hari Sabat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan tindakan para murid dalam ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris diterjemahkan sebagai keterangan waktu; 'hal itu' menyatakan objek yang tersirat dari konteks, yaitu tindakan para murid.
- source_word: εἶπαν αὐτῷ
  choice: mereka berkata kepada-Nya
  rationale: Rumus ujaran yang langsung dan netral; kapitalisasi pronomina mengikuti kelaziman teks Alkitab bahasa Indonesia.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Seruan penunjuk ini menarik perhatian kepada tuduhan dan tetap kuat tanpa terdengar arkais.
- source_word: μαθηταί
  choice: murid-murid
  rationale: Istilah baku yang mempertahankan hubungan guru dan murid dalam konteks Injil.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: melakukan sesuatu yang tidak diperbolehkan
  rationale: Bahasa Indonesia yang wajar menghindari pengulangan kaku 'melakukan ... dilakukan', sambil tetap menyampaikan tindakan dan larangannya.
- source_word: ὃ οὐκ ἔξεστιν
  choice: sesuatu yang tidak diperbolehkan
  rationale: ἔξεστιν menyatakan apa yang diizinkan atau diperbolehkan; pilihan ini mempertahankan nuansa legal-permisif tanpa menentukan sumber aturan tersebut.
- source_word: ἐν σαββάτῳ
  choice: pada hari Sabat
  rationale: Ungkapan temporal yang alami dalam bahasa Indonesia untuk hari atau lembaga Sabat yang dimaksud.
theological_decisions:
- issue: Sifat keberatan orang-orang Farisi
  choice: sesuatu yang tidak diperbolehkan
  alternative: sesuatu yang melanggar hukum
  rationale: Ayat ini melaporkan tuduhan mereka tanpa memastikan apakah larangan itu berasal dari hukum Kitab Suci atau tradisi penafsiran. 'Tidak diperbolehkan' menjaga ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Orang-orang Farisi' dipakai sebagai bentuk kelompok yang alami; ujaran langsung mempertahankan daya tuduhan. Tidak diperlukan catatan kaki karena alternatif leksikal utama telah terwakili secara memadai dalam teks.
