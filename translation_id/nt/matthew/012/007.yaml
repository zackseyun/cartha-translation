id: MAT.12.7
reference: Matthew 12:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: id
  text: Namun, seandainya kalian sudah memahami apa arti perkataan ini—“Yang Kukehendaki adalah belas kasihan dan bukan kurban”[a]—kalian tidak akan menghukum orang-orang yang tidak bersalah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesus mengutip Hosea 6:6.
    reason: cross_reference
  - marker: b
    text: 'Atau: “orang-orang yang tidak mempunyai kesalahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: seandainya kalian memahami
  rationale: Dalam konstruksi syarat yang bertentangan dengan kenyataan, bentuk ini menunjuk pada pemahaman yang seharusnya telah dimiliki. Bahasa Indonesia secara alami menyatakannya dengan 'seandainya ... memahami', sementara akibat lampau diperjelas oleh 'tidak akan menghukum'.
- source_word: τί ἐστιν
  choice: apa arti perkataan ini
  rationale: Ungkapan ini memperkenalkan kutipan Kitab Suci dan menanyakan maknanya, bukan sekadar identitasnya. Penambahan 'perkataan' membuat acuannya jelas dalam bahasa Indonesia.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: '''Belas kasihan'' merupakan padanan Indonesia yang alami dan luas untuk ἔλεος, serta mempertahankan gagasan kemurahan penuh kepedulian tanpa mempersempitnya pada emosi saja.'
- source_word: θέλω
  choice: Yang Kukehendaki adalah
  rationale: '''Kukehendaki'' mempertahankan bobot kehendak ilahi dan register kutipan kenabian; susunan ini juga menghasilkan kontras yang wajar dalam bahasa Indonesia.'
- source_word: θυσίαν
  choice: kurban
  rationale: '''Kurban'' adalah istilah baku untuk persembahan ritual yang dikorbankan dan mempertahankan bentuk tunggal serta kontras tajam dalam kutipan.'
- source_word: κατεδικάσατε
  choice: tidak akan menghukum
  rationale: Bersama ἄν, verba ini menyatakan akibat yang tidak terjadi dalam kondisi yang bertentangan dengan kenyataan. 'Menghukum' menyampaikan tindakan menjatuhkan putusan bersalah secara alami dalam konteks ini.
- source_word: τοὺς ἀναιτίους
  choice: orang-orang yang tidak bersalah
  rationale: Padanan ini mempertahankan nuansa forensik, selaras dengan 'menghukum', dan lebih alami bagi pembaca Indonesia modern daripada bentuk nominal yang lebih kaku.
theological_decisions:
- issue: Kontras dalam kutipan Hosea 6:6 antara belas kasihan dan kurban
  choice: Yang Kukehendaki adalah belas kasihan dan bukan kurban
  alternative: Aku menghendaki belas kasihan, bukan kurban
  rationale: Rumusan terpilih mempertahankan bentuk kontras yang tajam dalam teks Yunani tanpa menjelaskannya sebagai penolakan mutlak terhadap segala kurban. Dengan demikian, prioritas belas kasihan atas ritual tetap terdengar, sementara ketegangan teologis teks tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak yang nyata dalam konteks teguran kepada sekelompok orang. Kutipan dibuat sedikit lebih tinggi register-nya dengan 'Kukehendaki', tetapi tetap mudah dipahami.
