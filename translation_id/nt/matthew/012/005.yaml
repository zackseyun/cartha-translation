review_pass:
  verdict: revise
  source_fidelity: Terjemahan perlu direvisi karena “menajiskan” terutama berarti membuat najis/cemar secara ritual dan tidak tepat menangkap βεβηλοῦσιν, yakni memperlakukan yang kudus sebagai hal biasa atau profan. “Mencemarkan” mempertahankan daya kuat dan ketegangan retoris teks tanpa menyatakan bahwa para imam benar-benar bersalah. Rumusan “tidakkah kalian membaca” lebih setia pada pertanyaan retoris aoris daripada “belum pernahkah kalian membaca,” yang dapat menyiratkan ‘tidak pernah sama sekali’.
  naturalness: Susunan revisi tetap modern dan baku. “Pada hari-hari Sabat” mempertahankan jamak Yunani, sedangkan “hari Sabat” sebagai objek tunggal tetap alami dalam bahasa Indonesia. “Dan tidak bersalah” mengikuti καί tanpa menambahkan kontras eksplikatif yang tidak dinyatakan secara leksikal.
  terminology: “Taurat,” “Bait Allah,” “para imam,” dan “Sabat” tepat dalam register Alkitab bahasa Indonesia. “Mencemarkan hari Sabat” lebih sesuai daripada “menajiskan hari Sabat”; catatan menjelaskan alternatif “melanggar” serta makna dasar kata Yunani.
  issues:
  - severity: medium
    issue: “Menajiskan hari Sabat” tidak akurat secara leksikal.
    rationale: βεβηλόω berarti memperlakukan sebagai biasa/profan, mencemarkan atau melanggar yang kudus; “menajiskan” lazimnya mengacu pada kenajisan atau pencemaran ritual dan dapat menggeser makna.
  - severity: low
    issue: “Belum pernahkah kalian membaca” terlalu menekankan pengalaman ‘tidak pernah’.
    rationale: οὐκ ἀνέγνωτε adalah formula pertanyaan retoris ‘tidakkah kalian membaca’; bentuk Indonesia yang direvisi lebih langsung dan tidak menambah nuansa temporal.
  - severity: low
    issue: Letak jangkar catatan tidak selaras dengan kata atau frasa yang dijelaskan.
    rationale: Catatan tentang jamak Sabat harus ditambatkan pada “hari-hari Sabat,” dan catatan tentang Taurat pada “Taurat,” agar pembaca dapat mengidentifikasi rujukannya.
