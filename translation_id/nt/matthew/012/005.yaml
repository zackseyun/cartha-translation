id: MAT.12.5
reference: Matthew 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: id
  text: Atau, tidakkah kalian membaca dalam Taurat[c] bahwa pada hari-hari Sabat[b] para imam di Bait Allah mencemarkan hari Sabat[a] dan tidak bersalah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melanggar hari Sabat” atau “menodai hari Sabat”. Kata kerja Yunani ini berarti memperlakukan sesuatu yang kudus sebagai sesuatu yang biasa atau profan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada hari-hari Sabat”; bentuk jamak ini kemungkinan menunjuk pada kejadian yang berulang, bukan hanya satu hari Sabat.
    reason: lexical_alternative
  - marker: c
    text: “Taurat” di sini menunjuk pada hukum Musa dalam Kitab Suci, kemungkinan termasuk ketentuan tentang pelayanan imam pada hari Sabat (lih. Bil. 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan argumen alternatif dari Kitab Suci dan mempertahankan alur retoris secara ringkas.
- source_word: οὐκ ἀνέγνωτε
  choice: belum pernahkah kalian membaca
  rationale: Merupakan rumusan pertanyaan retoris tentang pengenalan pembaca terhadap Kitab Suci; bentuk ini alami dalam bahasa Indonesia dan menyampaikan daya aspek aoris dalam konteks.
- source_word: ἐν τῷ νόμῳ
  choice: dalam Taurat
  rationale: Dalam konteks Yahudi, frasa ini menunjuk pada hukum Musa sebagai bagian Kitab Suci, bukan hukum secara abstrak. 'Taurat' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: τοῖς σάββασιν
  choice: pada hari-hari Sabat
  rationale: Mempertahankan bentuk jamak Yunani dan menyatakan kejadian yang berulang pada berbagai hari Sabat.
- source_word: οἱ ἱερεῖς
  choice: para imam
  rationale: Padanan langsung bagi imam-imam yang melaksanakan pelayanan Bait Allah.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah; ungkapan ini alami dan tidak mempersempit makna menjadi ruang kudus tertentu.
- source_word: τὸ σάββατον
  choice: hari Sabat
  rationale: Mempertahankan bentuk tunggal yang menunjuk pada hari atau ketetapan Sabat sebagai objek verba.
- source_word: βεβηλοῦσιν
  choice: menajiskan
  rationale: Mengungkapkan gagasan memperlakukan sesuatu yang kudus sebagai biasa atau cemar dan mempertahankan daya provokatif pernyataan Yesus.
- source_word: ἀναίτιοί εἰσιν
  choice: tidak bersalah
  rationale: Menyatakan tidak adanya kesalahan atau pertanggungjawaban hukum, serta mempertahankan kontras tajam dengan 'menajiskan'.
theological_decisions:
- issue: Apakah pernyataan tentang tindakan para imam perlu diperhalus agar tidak menyiratkan pelanggaran Sabat yang nyata
  choice: Mempertahankan ungkapan kuat 'menajiskan hari Sabat' sekaligus menyatakan bahwa mereka 'tidak bersalah'
  alternative: Melanggar hari Sabat tetapi tidak bersalah; bekerja pada hari Sabat tetapi tidak bersalah
  rationale: 'Teks Yunani sengaja mempertahankan ketegangan: pelayanan imam dapat digambarkan sebagai penajisan Sabat, namun mereka tidak menanggung kesalahan. Terjemahan tidak menyelesaikan ketegangan tersebut secara diam-diam.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan jamak 'kalian' membuat subjek orang kedua jamak yang tersirat dalam verba Yunani menjadi jelas. 'Bait Allah' dipakai sebagai istilah lazim untuk kompleks rumah ibadah di Yerusalem. Penempatan 'tetapi' menyatakan kontras yang terkandung dalam καί pada konteks ini secara alami.
