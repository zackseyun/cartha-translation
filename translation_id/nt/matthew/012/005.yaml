revisions:
- from: Atau, belum pernahkah kalian membaca dalam Taurat bahwa pada hari-hari Sabat para imam di Bait Allah menajiskan hari Sabat[a] tetapi tidak bersalah?[b][c]
  to: Atau, tidakkah kalian membaca dalam Taurat[c] bahwa pada hari-hari Sabat[b] para imam di Bait Allah mencemarkan hari Sabat[a] dan tidak bersalah?
  rationale: Revisi mengganti istilah yang mengarah pada kenajisan ritual dengan “mencemarkan,” yang lebih dekat dengan βεβηλόω dan tetap membiarkan ketegangan antara tindakan para imam dan status mereka yang tidak bersalah. Formula retoris diperbaiki, dan semua jangkar catatan dipindahkan ke unsur yang benar-benar dijelaskan. Tidak ada penafsiran doktrinal tambahan.
