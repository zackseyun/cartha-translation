  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: id
  text: Kemudian, seorang yang kerasukan setan, buta, dan bisu dibawa kepada Yesus. Yesus menyembuhkannya, sehingga orang bisu itu berbicara dan melihat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tuli”. Kata Yunani yang dipakai dapat berarti “tuli” atau “bisu”; dalam konteks ini, makna “bisu” lebih mungkin karena sesudah disembuhkan orang itu berbicara dan melihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang secara alami melanjutkan rangkaian peristiwa.
- source_word: προσηνέχθη αὐτῷ
  choice: dibawalah kepada Yesus
  rationale: Bentuk pasif dipertahankan karena pelakunya tidak disebutkan. Nama 'Yesus' dipakai sebagai rujukan alami bagi αὐτῷ dalam bahasa Indonesia.
- source_word: δαιμονιζόμενος
  choice: kerasukan setan
  rationale: Mengungkapkan secara eksplisit gangguan oleh kuasa roh jahat sebagaimana dinyatakan teks, tanpa menggantinya dengan kategori klinis modern.
- source_word: τυφλὸς
  choice: buta
  rationale: Padanan langsung dan alami.
- source_word: κωφός
  choice: bisu
  rationale: Kata ini dapat berarti tuli atau tidak mampu berbicara; klausa hasil yang menyebut bahwa orang itu berbicara menunjukkan bahwa makna 'bisu' paling sesuai di sini.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Yesus menyembuhkannya
  rationale: Padanan wajar bagi tindakan penyembuhan; subjek diperjelas sebagai Yesus agar hubungan antarklausa tidak canggung dalam bahasa Indonesia.
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai hasil penyembuhan secara tepat dan alami.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: orang bisu itu dapat berbicara dan melihat
  rationale: Mengungkapkan hasil berupa pulihnya kemampuan berbicara dan melihat; 'dapat' membuat pemulihan kemampuan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat gangguan yang dikaitkan dengan setan
  choice: Mempertahankan ungkapan eksplisit 'kerasukan setan'
  alternative: sakit jiwa; menderita gangguan
  rationale: Teks Yunani secara eksplisit mengaitkan keadaan orang itu dengan kuasa setan; terjemahan tidak menaturalisasi atau mengaburkan pernyataan tersebut.
- issue: Makna κωφός dalam konteks ini
  choice: bisu
  alternative: tuli; tuli dan bisu
  rationale: Walaupun κωφός dapat menunjuk pada ketulian atau ketidakmampuan berbicara, hasil penyembuhan yang disebut ialah bahwa ia berbicara dan melihat, bukan mendengar. Catatan kaki tetap menjaga alternatif leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Inversi ringan 'dibawalah' mempertahankan fokus pada orang yang dibawa tanpa menyebut pelaku yang tidak ada dalam teks Yunani.
