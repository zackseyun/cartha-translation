base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: id
  text: Hai keturunan ular beludak[a], bagaimana mungkin kamu mengatakan hal-hal yang baik, padahal kamu jahat? Sebab, dari luapan[b] hati, mulut berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak ular beludak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Sebab, dari kelimpahan hati, mulut berbicara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: keturunan ular beludak
  rationale: γέννημα menunjuk pada sesuatu yang dilahirkan atau dihasilkan; bersama ἐχιδνῶν, ungkapan ini menjadi metafora tajam tentang asal-usul dan watak. “Keturunan ular beludak” mempertahankan citra tersebut dalam bahasa Indonesia modern.
- source_word: πῶς δύνασθε
  choice: bagaimana mungkin kamu
  rationale: Ungkapan ini merupakan pertanyaan retoris yang menekankan ketidakmungkinan atau ketidakmampuan moral, dan diterjemahkan secara idiomatis.
- source_word: ἀγαθὰ λαλεῖν
  choice: mengatakan yang baik
  rationale: ἀγαθά adalah bentuk jamak netral yang berfungsi substantival. “Yang baik” alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: πονηροὶ ὄντες
  choice: padahal kamu jahat
  rationale: Konstruksi partisipial menyatakan keadaan yang bertentangan dengan kemungkinan mengatakan yang baik. “Jahat” mempertahankan bobot moral πονηροί, sedangkan “padahal” menyampaikan hubungan retorisnya secara alami.
- source_word: ἐκ γὰρ τοῦ περισσεύματος
  choice: Sebab, dari luapan
  rationale: περίσσευμα dapat berarti kelimpahan, kelebihan, atau luapan. “Luapan” mempertahankan gambaran tentang sesuatu yang keluar karena memenuhi batin.
- source_word: τῆς καρδίας
  choice: hati
  rationale: καρδία menunjuk pada pusat batin manusia, termasuk pikiran, kehendak, dan perasaan. “Hati” mempertahankan istilah dan keluasan antropologis alkitabiahnya.
- source_word: τὸ στόμα λαλεῖ
  choice: mulut berbicara
  rationale: Terjemahan langsung ini mempertahankan personifikasi mulut sebagai sarana yang menyatakan isi hati dan tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis “hati”
  choice: Mempertahankan “hati” sebagai istilah bagi pusat batin manusia.
  alternative: batin; pikiran
  rationale: Mengganti dengan “pikiran” akan mempersempit cakupan καρδία, sedangkan “batin” akan menghilangkan citra alkitabiah yang terdapat dalam teks.
- issue: Penilaian moral dalam πονηροὶ ὄντες
  choice: jahat
  alternative: buruk; fasik
  rationale: Yesus menyampaikan penilaian moral, bukan sekadar mutu yang buruk. “Jahat” mempertahankan bobot etis tanpa menambahkan nuansa religius khusus yang dapat muncul pada “fasik”.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “Hai” menandai bentuk vokatif dan mempertahankan ketajaman teguran. Susunan kalimat tetap dekat dengan struktur Yunani tanpa menjadi kaku.
