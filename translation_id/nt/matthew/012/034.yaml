  naturalness: Kalimatnya lugas dan wajar dalam bahasa Indonesia modern. “Mengatakan hal-hal yang baik” lebih idiomatis dan lebih jelas daripada “mengatakan yang baik.” Susunan “Sebab, dari luapan hati, mulut berbicara” dapat dipertahankan; ia menjaga metafora sumber dan luapan tanpa menambahkan penafsiran.
  terminology: “Keturunan ular beludak” merupakan padanan yang mapan dan tajam bagi γεννήματα ἐχιδνῶν. “Jahat” tepat untuk πονηροί, dan “hati” sebaiknya dipertahankan bagi καρδία. Catatan untuk “luapan” perlu menyatakan alternatif sebagai frasa lengkap agar cakupan alternatifnya jelas.
