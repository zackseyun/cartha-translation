  verdict: approve
  source_fidelity: Teks dengan setia menerjemahkan γνούς sebagai kesadaran yang mendahului tindakan Yesus, ἀνεχώρησεν sebagai tindakan menyingkir/menjauh, ἐκεῖθεν sebagai “dari sana,” serta cakupan penuh αὐτοὺς πάντας sebagai “mereka semua.” “Hal itu” secara tepat menunjuk pada hal yang tersirat dari konteks sebelumnya tanpa memasukkan rincian tambahan ke dalam ayat.
  naturalness: Bahasa Indonesia baku, lancar, dan bernada naratif yang sesuai. Susunan “setelah mengetahui hal itu, Yesus menyingkir dari sana” jelas dan idiomatis. “Banyak orang mengikuti-Nya” juga merupakan padanan alami bagi πολλοί tanpa mengubahnya menjadi “orang banyak” atau “kerumunan.”
  terminology: “Menyingkir” mempertahankan nuansa penarikan diri dalam ἀναχωρέω tanpa menyatakan motif psikologis yang tidak disebutkan. “Menyembuhkan” adalah istilah standar dan tepat untuk ἐθεράπευσεν. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan konvensi Alkitab Indonesia dan tidak mengubah makna sumber.
