id: MAT.12.15
reference: Matthew 12:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: id
  text: Namun, setelah mengetahui hal itu[a], Yesus menyingkir dari sana. Banyak orang mengikuti-Nya, dan Ia menyembuhkan mereka semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah mengetahuinya.” Dalam bahasa Yunani, objek dari kata “mengetahui” tidak disebutkan; konteks ayat sebelumnya yang menyediakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: setelah mengetahui hal itu
  rationale: Partisip aoris ini menunjukkan bahwa Yesus telah mengetahui keadaan tersebut sebelum Ia menyingkir. “Hal itu” merujuk secara wajar pada rencana orang-orang Farisi dalam ayat sebelumnya, tanpa menjabarkan lebih jauh daripada konteks.
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: Dalam konteks ini, ἀναχωρέω menyiratkan tindakan menjauh dari ancaman atau perlawanan, bukan sekadar berangkat dari suatu tempat. “Menyingkir” mempertahankan nuansa itu tanpa menyiratkan ketakutan.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Ungkapan ringkas dan alami untuk gerakan meninggalkan tempat yang disebut dalam konteks.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: banyak orang mengikuti-Nya
  rationale: πολλοί berarti “banyak” dan tidak secara eksplisit menyebut kerumunan. Penambahan “orang” diperlukan agar ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐθεράπευσεν
  choice: Ia menyembuhkan
  rationale: Dalam kisah-kisah Injil, θεραπεύω secara langsung dan lazim berarti menyembuhkan orang sakit.
- source_word: αὐτοὺς πάντας
  choice: mereka semua
  rationale: Mempertahankan cakupan menyeluruh dari πάντας dalam susunan bahasa Indonesia yang alami.
theological_decisions:
- issue: Objek tersirat dari γνοὺς
  choice: “setelah mengetahui hal itu,” dengan rujukan kontekstual kepada rencana dalam ayat sebelumnya
  alternative: “setelah mengetahuinya” atau membiarkan objek tetap tidak disebutkan
  rationale: Teks Yunani tidak menyatakan objek γνοὺς secara eksplisit. “Hal itu” membuat hubungan dengan konteks sebelumnya jelas, sedangkan catatan kaki mempertahankan kesadaran pembaca bahwa objek tersebut tersirat.
- issue: Nuansa kepergian Yesus
  choice: menyingkir
  alternative: pergi atau berangkat
  rationale: Pilihan ini mempertahankan motif tindakan menjauh sebagai tanggapan terhadap perlawanan, tetapi tidak menambahkan anggapan bahwa Yesus bertindak karena takut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia, tanpa menambahkan penafsiran pada teks sumber.
