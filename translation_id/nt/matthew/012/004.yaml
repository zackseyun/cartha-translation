id: MAT.12.4
reference: Matthew 12:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: id
  text: bagaimana ia masuk ke dalam rumah Allah, lalu mereka memakan roti sajian[a], padahal menurut hukum ia dan orang-orang yang bersamanya tidak boleh memakannya; hanya para imam yang boleh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah atau bacaan berbunyi “ia memakan”, bukan “mereka memakan”. Roti sajian adalah roti kudus yang diletakkan di hadapan Allah.
    reason: textual_variant_and_lexical_explanation
lexical_decisions:
- source_word: πῶς
  choice: bagaimana
  rationale: Secara alami memperkenalkan isi kisah tentang Daud yang dirujuk Yesus.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ia masuk ke dalam rumah Allah
  rationale: Mempertahankan ungkapan sumber 'rumah Allah' tanpa menggantinya dengan rujukan kontekstual yang lebih khusus.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: roti sajian
  rationale: Istilah Indonesia yang ringkas dan dikenal untuk roti kudus yang disajikan di hadapan Allah; catatan menjelaskan makna kultisnya.
- source_word: ἔφαγον
  choice: mereka memakan
  rationale: Mengikuti bacaan jamak teks SBLGNT, selaras dengan penyebutan orang-orang yang bersama Daud. Varian tunggal dicatat.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: padahal menurut hukum ia ... tidak boleh memakannya
  rationale: Menjaga daya hukum/kultis ἐξὸν sekaligus menghasilkan bahasa Indonesia yang wajar.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: dan orang-orang yang bersamanya
  rationale: Menyatakan bahwa larangan yang sama juga berlaku bagi para pengikut Daud tanpa mempersempit mereka menjadi kategori lain.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: hanya para imam yang boleh
  rationale: Mengungkapkan pengecualian dan eksklusivitas secara jelas dan idiomatis.
theological_decisions:
- issue: Daya hukum/kultis dari ἐξὸν
  choice: menurut hukum ... tidak boleh
  alternative: tidak diizinkan
  rationale: Pilihan ini mempertahankan bahwa pembatasan tersebut berlandaskan ketentuan kudus, bukan sekadar izin sosial.
- issue: Subjek tekstual ἔφαγον
  choice: mereka memakan
  alternative: ia memakan
  rationale: Teks SBLGNT yang diberikan memakai bentuk jamak; bacaan tunggal yang penting dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan diteruskan dari ayat sebelumnya. Kata ganti 'ia' dipakai untuk Daud; bentuk jamak verba sumber dinyatakan secara eksplisit dengan 'mereka' agar varian tekstual tidak disamarkan.
