  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: id
  text: Tetapi, ia menjawab orang yang sedang berbicara kepadanya[a], “Siapakah ibu saya, dan siapakah saudara-saudara laki-laki saya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Tetapi, ia menjawab dan berkata kepada orang yang sedang berbicara kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Namun, ia menjawab
  rationale: Konstruksi partisip ἀποκριθεὶς dengan εἶπεν merupakan ungkapan Yunani yang dipengaruhi gaya Semitis, secara harfiah ‘menjawab dan berkata’. Dalam bahasa Indonesia alami, ‘menjawab’ sudah mencakup tindakan berkata, sedangkan δέ diterjemahkan ‘Namun’ untuk menandai peralihan yang berlawanan dengan pemberitahuan sebelumnya.
- source_word: τῷ λέγοντι αὐτῷ
  choice: orang yang sedang berbicara kepadanya
  rationale: Partisip kini substantival λέγοντι menunjuk kepada orang yang tengah menyapa Yesus. ‘Sedang berbicara’ mempertahankan aspek tindakan yang berlangsung tanpa mempersempit maknanya menjadi sekadar ‘memberi tahu’.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Siapakah ibu saya
  rationale: Kata tanya Τίς menanyakan identitas. ‘Siapakah’ alami dalam pertanyaan retoris yang bermartabat, sementara μήτηρ μου diterjemahkan langsung sebagai ‘ibu saya’.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: dan siapakah saudara-saudara saya
  rationale: Bentuk jamak τίνες sejajar dengan Τίς sebelumnya. Pengulangan ‘siapakah’ mempertahankan kesejajaran retoris; ‘saudara-saudara’ merupakan padanan Indonesia yang wajar bagi bentuk maskulin jamak ἀδελφοί dalam konteks keluarga Yesus.
theological_decisions:
- issue: Pertanyaan retoris Yesus tentang identitas keluarga
  choice: Mempertahankan pertanyaan harfiah tanpa penjelasan tambahan
  alternative: Siapa yang terhitung sebagai ibu saya, dan siapa yang terhitung sebagai saudara-saudara saya?
  rationale: Ayat berikutnya mengembangkan makna kekerabatan, tetapi ayat ini sendiri hanya mengajukan pertanyaan. Terjemahan tidak mendahului penjelasan narasi atau meredakan ketegangan teologisnya.
- issue: Cakupan gender οἱ ἀδελφοί μου
  choice: saudara-saudara saya
  alternative: saudara laki-laki saya; saudara-saudari saya
  rationale: Bahasa Indonesia lazim memakai ‘saudara-saudara’ bagi bentuk jamak dalam konteks kekerabatan tanpa harus menambahkan ‘saudari’. Pilihan ini tidak memperluas rujukan secara eksplisit, tetapi juga tidak memaksakan penandaan gender yang kurang alami daripada bentuk sumber dalam bahasa sasaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘ia’ dan ‘saya’ dipilih agar alami dalam narasi serta ujaran langsung; konstruksi Semitis yang berulang dijelaskan dalam catatan kaki.
