  naturalness: Teks revisi tetap menggunakan bahasa Indonesia baku dan modern. “Saudara-saudara laki-laki saya” jelas, alami dalam register naratif bermartabat, dan menjaga pembedaan yang dibuat oleh teks sumber.
  terminology: μήτηρ diterjemahkan “ibu”; ἀδελφοί dalam konteks keluarga diterjemahkan “saudara-saudara laki-laki,” bukan istilah inklusif atau netral. Catatan kaki tetap menjelaskan idiom ἀποκριθεὶς εἶπεν tanpa menjadikannya wajib dalam teks utama.
