id: MAT.12.45
reference: Matthew 12:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: id
  text: Lalu roh itu pergi dan membawa bersamanya tujuh roh lain yang lebih jahat daripada dirinya[a]. Roh-roh itu masuk dan tinggal di sana. Maka keadaan akhir orang itu menjadi lebih buruk daripada keadaannya semula[b]. Demikian juga yang akan terjadi pada generasi yang jahat ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tujuh roh berbeda yang lebih jahat daripada dirinya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal terakhir dari orang itu menjadi lebih buruk daripada yang pertama,” sebuah ungkapan yang berarti bahwa keadaan akhirnya lebih buruk daripada keadaannya semula.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Lalu roh itu pergi
  rationale: τότε menandai langkah berikutnya dalam urutan, sedangkan πορεύεται memakai bentuk kini yang menghidupkan narasi. Subjek tersirat dijelaskan sebagai 'roh itu' agar rujukannya tetap jelas dalam bahasa Indonesia.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: membawa bersamanya
  rationale: Ungkapan ini menyatakan bahwa roh tersebut membawa roh-roh lain untuk menyertainya; terjemahan ini alami dan mempertahankan unsur kebersamaan.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: tujuh roh lain
  rationale: ἕτερα dalam konteks ini paling wajar berarti roh-roh tambahan selain roh pertama, tanpa harus menegaskan bahwa jenis mereka berbeda.
- source_word: πονηρότερα ἑαυτοῦ
  choice: lebih jahat daripada dirinya
  rationale: Bentuk komparatif menyatakan tingkat kejahatan yang lebih besar. 'Jahat' merupakan padanan modern dan langsung bagi πονηρός dalam konteks ini.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Roh-roh itu masuk dan tinggal di sana
  rationale: Partisipel jamak εἰσελθόντα menunjuk kepada roh-roh tersebut. Susunan dua verba finit menyampaikan urutan tindakan secara alami; 'tinggal' mengungkapkan penghunian menetap yang dimaksud κατοικέω.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: Maka keadaan akhir orang itu menjadi lebih buruk daripada keadaannya semula
  rationale: Ungkapan harfiah 'hal-hal terakhir ... daripada yang pertama' bersifat idiomatis dan membandingkan kondisi akhir dengan kondisi sebelumnya. 'Keadaan akhir' dan 'keadaannya semula' membuat perbandingan itu jelas tanpa mengubah makna.
- source_word: οὕτως ἔσται καὶ
  choice: Demikian juga yang akan terjadi
  rationale: Ungkapan ini menerapkan gambaran sebelumnya kepada generasi yang sedang dibicarakan dan mempertahankan hubungan analoginya.
- source_word: τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: pada generasi yang jahat ini
  rationale: '''Generasi'' adalah padanan modern yang jelas bagi γενεά di sini, yakni kelompok sezaman yang menjadi sasaran perkataan Yesus; atribut ''jahat'' dipertahankan secara langsung.'
theological_decisions:
- issue: Istilah πνεύματα dalam konteks roh-roh jahat
  choice: roh
  alternative: setan
  rationale: Teks Yunani memakai πνεύματα, bukan istilah khusus untuk 'setan'. Konteks sudah menunjukkan sifat roh-roh tersebut, sehingga 'roh' mempertahankan pilihan leksikal sumber tanpa mempersempitnya.
- issue: Rujukan τοῦ ἀνθρώπου ἐκείνου
  choice: orang itu
  alternative: laki-laki itu; manusia itu
  rationale: ἄνθρωπος menunjuk seorang manusia dalam contoh ini, tetapi tidak dengan sendirinya menegaskan jenis kelamin biologis. 'Orang itu' adalah padanan Indonesia yang tepat dan alami tanpa menambahkan kekhususan yang tidak dituntut teks.
- issue: Penerapan kepada τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: generasi yang jahat ini
  alternative: angkatan yang jahat ini
  rationale: Terjemahan ini mempertahankan penerapan langsung kepada generasi sezaman yang disebut jahat, tanpa menentukan lebih jauh cakupan historis atau teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan kalimat yang mudah dipahami. Kata 'roh' dipertahankan sesuai sumber, sedangkan pengulangan 'Roh-roh itu' memperjelas subjek jamak dalam bahasa Indonesia.
