id: MAT.12.26
reference: Matthew 12:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: id
  text: Dan jika Satan mengusir Satan[a], ia telah terpecah belah melawan dirinya sendiri[b]. Jadi, bagaimana kerajaannya akan bertahan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghalau Satan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia terpecah belah melawan dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Dan jika
  rationale: Mempertahankan kata penghubung καί dan unsur pengandaian εἰ, sekaligus menjaga alur argumentasi dari ayat sebelumnya.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satan
  rationale: Menggunakan bentuk nama atau gelar yang sudah baku dalam bahasa Indonesia, tanpa menerjemahkannya menjadi 'Lawan' atau 'Penentang'.
- source_word: ἐκβάλλει
  choice: mengusir
  rationale: Dalam konteks pengusiran roh jahat, 'mengusir' merupakan padanan Indonesia yang alami dan tepat untuk tindakan memaksa keluar.
- source_word: ἐφ’ ἑαυτὸν
  choice: melawan dirinya sendiri
  rationale: Menyampaikan pertentangan internal yang dinyatakan oleh konstruksi ἐπί dengan kata ganti refleksif.
- source_word: ἐμερίσθη
  choice: telah terpecah
  rationale: Mencerminkan bentuk aoristus pasif dan keadaan yang dihasilkan oleh tindakan hipotetis itu, tanpa menentukan pelaku pasif yang tidak disebutkan.
- source_word: πῶς οὖν
  choice: Jadi, bagaimana mungkin
  rationale: Mengungkapkan daya simpulan οὖν dan pertanyaan retoris πῶς secara alami dalam bahasa Indonesia.
- source_word: σταθήσεται
  choice: dapat bertahan
  rationale: Dalam konteks kerajaan, metafora 'berdiri' berarti tetap kukuh atau terus ada; 'bertahan' menyampaikan makna kontekstual itu dengan jelas.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: kerajaannya
  rationale: Mempertahankan gambaran suatu wilayah kekuasaan yang terpecah; akhiran '-nya' merujuk kepada Satan.
theological_decisions:
- issue: Makna perpecahan Satan terhadap dirinya sendiri
  choice: 'Ayat disampaikan sebagai argumen reductio: jika Satan mengusir Satan, ia telah terpecah melawan dirinya sendiri sehingga kerajaannya tidak mungkin bertahan.'
  alternative: Mengembangkan gambaran 'rumah yang terpecah' dari konteks ayat sebelumnya.
  rationale: Teks Yunani ayat ini menyatakan perpecahan diri dan ketidakmampuan kerajaan Satan untuk bertahan tanpa mengulangi atau menambahkan gambaran rumah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan pertanyaan retoris dibuat alami tanpa menghilangkan hubungan logis dengan konteks sebelumnya. Istilah 'kerajaan' dipertahankan untuk βασιλεία, dan tidak ditambahkan tafsiran denominasi tertentu.
