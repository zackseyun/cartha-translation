revisions:
- from: Dan jika Satan mengusir Satan[a], ia telah terpecah melawan dirinya sendiri[b]. Jadi, bagaimana mungkin kerajaannya dapat bertahan?
  to: Dan jika Satan mengusir Satan[a], ia telah terpecah belah melawan dirinya sendiri[b]. Jadi, bagaimana kerajaannya akan bertahan?
  rationale: Revisi ini memperbaiki kelancaran idiom Indonesia pada predikat pasif ἐμερίσθη dan menerjemahkan bentuk futurum σταθήσεται dengan lebih langsung. Hubungan argumentatif καὶ εἰ dan οὖν, nama Satan, makna pengusiran, serta metafora kerajaan tetap dipertahankan. Tidak diperlukan catatan tersendiri untuk alternatif “dapat bertahan,” karena pilihan teks utama sudah wajar dan cukup dekat dengan sumber.
