  text: And he warned them not to make him known,[a]
translation:
  language: id
  text: Dan Ia memperingatkan mereka dengan tegas agar tidak memberitahukan tentang Dia kepada orang banyak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memerintahkan mereka dengan tegas agar tidak memberitahukan tentang Dia kepada orang banyak.”
    reason: Alternatif leksikal untuk ἐπετίμησεν, yang dalam konteks ini dapat menyatakan peringatan keras atau perintah tegas.
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi; 'Lalu' terdengar alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: ἐπετίμησεν
  choice: memperingatkan ... dengan tegas
  rationale: Dalam konteks ini, verba tersebut menyatakan peringatan atau larangan yang keras. Pilihan ini mempertahankan ketegasannya tanpa menyiratkan kesalahan moral sekuat 'menegur'.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak ini merujuk kepada orang-orang yang sedang Yesus hadapi dalam konteks sebelumnya.
- source_word: ἵνα μὴ
  choice: agar tidak
  rationale: Gabungan ἵνα dan μή dengan bentuk subjungtif menyatakan isi atau tujuan larangan setelah verba peringatan.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: memberitahukan siapa diri-Nya
  rationale: Ungkapan φανερὸν ποιέω berarti membuat diketahui atau menyatakan kepada umum; rumusan ini alami dalam bahasa Indonesia dan mempertahankan Yesus sebagai objek yang dinyatakan.
theological_decisions:
- issue: Sifat arahan Yesus mengenai publisitas
  choice: Peringatan tegas agar mereka tidak memberitahukan siapa diri-Nya
  alternative: Teguran terhadap mereka atau perintah formal
  rationale: Bahasa Yunani menunjukkan arahan yang kuat, tetapi ayat ini sendiri tidak menjelaskan alasan teologis di balik larangan itu. Terjemahan tidak menambahkan alasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Bentuk 'Ia' dan '-Nya' dipakai sebagai konvensi penghormatan dalam penerbitan Alkitab Indonesia; ketegasan verba Yunani dinyatakan secara eksplisit dengan 'dengan tegas'.
