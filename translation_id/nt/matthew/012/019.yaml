  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: id
  text: Ia tidak akan bertengkar ataupun berteriak, dan tidak seorang pun akan mendengar suara-Nya di jalan-jalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak akan berbantah atau berseru, dan tidak seorang pun akan mendengar suara-Nya di jalan-jalan lebar.”
    reason: Alternatif leksikal bagi ἐρίσει, κραυγάσει, dan πλατείαις; penanda ditempatkan pada akhir kalimat agar mencakup seluruh alternatif.
lexical_decisions:
- source_word: ἐρίσει
  choice: akan bertengkar
  rationale: Kata ἐρίζω menyatakan keterlibatan dalam pertengkaran atau perselisihan. “Bertengkar” alami dalam bahasa Indonesia modern dan menggambarkan sikap Sang Hamba yang tidak suka berbantah tanpa menyiratkan bahwa Ia sama sekali tidak pernah berdebat atau berbicara di muka umum.
- source_word: κραυγάσει
  choice: akan berteriak
  rationale: Kata κραυγάζω berarti berseru atau berteriak dengan suara keras. “Berteriak” mempertahankan unsur kelantangan dan sejajar secara alami dengan “bertengkar”.
- source_word: ἀκούσει τις
  choice: tidak seorang pun akan mendengar
  rationale: Gabungan οὐδέ dengan kata ganti tak tentu τις secara idiomatis diungkapkan sebagai “tidak seorang pun,” dengan tetap mempertahankan penyangkalan kumulatif teks Yunani.
- source_word: ἐν ταῖς πλατείαις
  choice: di jalan-jalan
  rationale: Kata πλατεῖα menunjuk pada jalan yang lebar atau ruang jalan umum. “Di jalan-jalan” merupakan ungkapan Indonesia yang wajar dan mempertahankan latar publik; kemungkinan “di lapangan-lapangan umum” dicatat dalam catatan kaki.
- source_word: φωνὴν αὐτοῦ
  choice: suara-Nya
  rationale: Dalam konteks ini φωνή berarti suara. Kapitalisasi pronomina mengikuti kebiasaan hormat yang lazim dalam penerbitan Alkitab bahasa Indonesia dan acuannya jelas kepada Yesus.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: tidak…ataupun…dan tidak seorang pun…
  rationale: Susunan ini mempertahankan tiga penyangkalan yang bertumpuk sambil menghasilkan kalimat Indonesia modern yang lancar.
theological_decisions:
- issue: Hubungan dengan kutipan tentang Hamba dalam Yesaya dan gambaran mengenai sikap Mesias
  choice: Ayat ini menggambarkan Mesias sebagai sosok yang tidak suka bertengkar dan tidak mencari perhatian melalui keributan di muka umum.
  alternative: Terjemahan yang lebih harfiah dapat memakai “tidak akan berbantah ataupun berseru” untuk menggemakan ragam bahasa kutipan nubuat.
  rationale: Teks Yunani menggambarkan sikap Yesus dalam penggenapan Yesaya 42:2. Terjemahan mempertahankan kelembutan dan sikap-Nya yang tidak mencari publisitas, tanpa mengubahnya menjadi ajaran bahwa Ia tidak pernah berbicara di muka umum atau menghadapi pertentangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk alur naratif yang alami; “suara-Nya” mengikuti konvensi penghormatan yang umum. Tanda catatan kaki [a] ditempatkan tepat setelah klausa yang memiliki alternatif leksikal.
