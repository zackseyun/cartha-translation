  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: id
  text: Orang yang baik mengeluarkan hal-hal yang baik dari simpanannya yang baik[a][b], dan orang yang jahat mengeluarkan hal-hal yang jahat dari simpanannya yang jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perbendaharaannya yang baik.” Kata Yunani menunjuk pada harta atau persediaan yang tersimpan.'
    reason: lexical_alternative
  - marker: b
    text: Konteks langsung membahas perkataan; karena itu, “hal-hal yang baik” dan “hal-hal yang jahat” di sini terutama dapat merujuk pada kata-kata.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: baik / hal-hal yang baik
  rationale: Mempertahankan pengulangan akar kata dan kesejajaran moral dalam bahasa Yunani; bentuk netral jamak substantival diterjemahkan secara alami sebagai “hal-hal yang baik”.
- source_word: ἄνθρωπος
  choice: orang
  rationale: Dalam pepatah berpasangan ini, bentuk tunggal maskulin Yunani dipakai secara representatif. “Orang” merupakan padanan Indonesia yang alami dan tidak mengubah cakupan rujukannya.
- source_word: θησαυρός
  choice: simpanan
  rationale: “Simpanan” menyampaikan gambaran tentang persediaan batin yang menjadi sumber sesuatu, dengan bahasa yang lebih alami bagi pembaca modern daripada “perbendaharaan”; kemungkinan padanan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἐκβάλλει
  choice: mengeluarkan
  rationale: Menjaga citra gerak keluar yang terkandung dalam verba Yunani tanpa memakai ungkapan yang terlalu keras seperti “melemparkan keluar”.
- source_word: πονηρός / πονηρά
  choice: jahat / hal-hal yang jahat
  rationale: Menjaga bobot moral yang kuat serta kesejajaran dengan “baik / hal-hal yang baik”; “buruk” akan terlalu lemah.
- source_word: ἐκ
  choice: dari
  rationale: Padanan lokatif-sumber yang alami dalam bahasa Indonesia dan sesuai dengan gambaran sesuatu yang dikeluarkan dari suatu simpanan.
theological_decisions:
- issue: Cakupan “hal-hal yang baik” dan “hal-hal yang jahat”
  choice: Mempertahankan ungkapan luas “hal-hal”, tanpa menggantinya dengan “perkataan”.
  alternative: Menerjemahkannya secara khusus sebagai “perkataan yang baik” dan “perkataan yang jahat”.
  rationale: Konteks langsung memang membahas perkataan, tetapi teks Yunani memakai adjektiva substantival netral jamak tanpa menyebut kata benda tertentu. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menunjukkan penekanan kontekstualnya.
- issue: Kontras moral dalam bentuk pepatah
  choice: Menggambarkan apa yang keluar dari seseorang sebagai berasal dari simpanan batinnya, tanpa menambahkan kerangka doktrinal tertentu.
  alternative: Menafsirkan ayat secara eksklusif sebagai ajaran tentang ucapan atau secara lebih luas sebagai semua perbuatan.
  rationale: Metafora dan paralelisme teks dibiarkan berbicara tanpa mempersempit atau memperluas rujukannya secara tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kesejajaran serta pengulangan dalam teks Yunani sengaja dipertahankan untuk menjaga daya retoris pepatah ini.
