  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: id
  text: Dan jika Aku mengusir setan-setan dengan kuasa Beelzebul[a], dengan kuasa siapa anak-anakmu mengusir mereka? Karena itu, mereka akan menjadi hakim-hakimmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “Beelzebul”; bentuk “Beelzebub” juga dikenal luas.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  rationale: Dalam konteks tuduhan ini, ἐν berfungsi secara instrumental. Ungkapan “dengan kuasa” menyampaikan sarana atau kuasa yang dianggap bekerja secara alami dalam bahasa Indonesia, sedangkan nama mengikuti bentuk Yunani Βεελζεβούλ.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: mengusir setan-setan
  rationale: ἐκβάλλω dalam konteks eksorsisme berarti mengeluarkan atau mengusir, dan δαιμόνια secara wajar diterjemahkan “setan-setan” dalam bahasa Indonesia umum.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: anak-anakmu
  rationale: Terjemahan ini mempertahankan istilah kekerabatan harfiah dan paralel retoris teks Yunani. Dalam konteks, frasa itu mungkin menunjuk kepada anggota atau murid dari kalangan para pendengar, tetapi teks tidak menjelaskannya secara eksplisit.
- source_word: ἐν τίνι
  choice: dengan kuasa siapa
  rationale: Seperti ἐν sebelumnya, frasa ini bersifat instrumental. “Dengan kuasa siapa” lebih jelas dan alami daripada terjemahan harfiah “di dalam siapa” serta mempertahankan pertanyaan tentang sumber kuasa.
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini memperkenalkan kesimpulan dari pertanyaan retoris sebelumnya dan diterjemahkan secara ringkas serta idiomatis.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: mereka akan menjadi hakimmu
  rationale: Pilihan ini mempertahankan konstruksi predikat nominal, kala mendatang, dan daya retoris pernyataan Yunani tanpa mengubahnya menjadi parafrasa verbal.
theological_decisions:
- issue: Identitas dan ejaan Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Nama ditransliterasikan menurut bentuk dalam teks Yunani SBLGNT, bukan diselaraskan dengan bentuk tradisional yang lebih dikenal. Catatan kaki mempertahankan bentuk alternatif tersebut.
- issue: Rujukan οἱ υἱοὶ ὑμῶν
  choice: anak-anakmu
  alternative: orang-orang dari kalanganmu; murid-muridmu
  rationale: Teks mempertahankan istilah kekerabatan dan tidak menetapkan secara eksplisit apakah yang dimaksud adalah keturunan, anggota kelompok, atau murid. Ambiguitas sumber dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Kata ganti yang merujuk kepada Yesus ditulis “Aku” menurut kebiasaan penerbitan Alkitab Indonesia. “Dengan kuasa” dipakai untuk menyatakan fungsi instrumental ἐν secara alami; bentuk tunggal kolektif “hakimmu” mempertahankan ungkapan langsung kepada kelompok yang disapa.
