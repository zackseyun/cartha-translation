reference: Matthew 12:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: id
  text: Pada penghakiman, para lelaki Niniwe akan bangkit bersama generasi ini dan akan menghukumnya, sebab mereka bertobat sebagai tanggapan atas pemberitaan Yunus,[b] dan lihatlah, sesuatu yang lebih besar daripada Yunus ada di sini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seseorang yang lebih besar daripada Yunus ada di sini.” Bahasa Yunani memakai ungkapan berbentuk netral, secara harfiah “sesuatu yang lebih besar daripada Yunus”; bentuk ini dapat menekankan kenyataan yang lebih besar yang hadir di sini, bukan hanya perbandingan antara dua pribadi.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “karena pemberitaan Yunus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: para lelaki Niniwe
  rationale: ἄνδρες secara eksplisit berbentuk maskulin dan berarti ‘lelaki’; ‘para lelaki Niniwe’ mempertahankan unsur ini dengan ungkapan Indonesia yang jelas.
- source_word: ἀναστήσονται
  choice: akan bangkit
  rationale: Dalam konteks penghakiman eskatologis, kata ini menggambarkan tindakan bangkit dan tetap membuka kemungkinan nuansa kebangkitan tanpa menjelaskannya secara berlebihan.
- source_word: ἐν τῇ κρίσει
  choice: pada penghakiman
  rationale: κρίσις di sini menunjuk pada peristiwa penghakiman; ‘pada penghakiman’ ringkas, wajar, dan tidak menambahkan kata ‘hari’ yang tidak terdapat dalam teks Yunani.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: bersama generasi ini
  rationale: μετά dengan genitif secara langsung berarti ‘bersama’; sifat pertentangannya muncul dari klausa berikutnya, ‘akan menghukumnya’.
- source_word: κατακρινοῦσιν αὐτήν
  choice: akan menghukumnya
  rationale: κατακρίνω berarti menjatuhkan hukuman atau menyatakan bersalah. Akhiran ‘-nya’ mempertahankan pronomina Yunani dan merujuk kembali kepada ‘generasi ini’.
- source_word: μετενόησαν
  choice: mereka bertobat
  rationale: Dalam konteks tanggapan terhadap pemberitaan nabi, μετανοέω menyatakan pertobatan, bukan sekadar perubahan pendapat.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: karena pemberitaan Yunus
  rationale: κήρυγμα adalah pemberitaan atau proklamasi. Dengan μετανοέω, εἰς menyatakan tanggapan yang ditimbulkan atau diarahkan kepada berita Yunus; terjemahan utama dibuat alami, sedangkan nuansa respons eksplisit dicatat dalam catatan kaki.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: ἰδού menarik perhatian secara tegas. ‘Lihatlah’ mempertahankan daya retoris dan nuansa khidmat tanpa memakai bentuk arkais.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: sesuatu yang lebih besar daripada Yunus ada di sini
  rationale: πλεῖον berbentuk netral tunggal, sehingga ‘sesuatu yang lebih besar’ mempertahankan bentuk dan keluasan ungkapan Yunani, alih-alih langsung menormalkannya menjadi rujukan maskulin personal.
theological_decisions:
- issue: Cara menerjemahkan πλεῖον Ἰωνᾶ sebagai rujukan kepada Yesus dan pelayanan-Nya
  choice: sesuatu yang lebih besar daripada Yunus ada di sini
  alternative: seseorang yang lebih besar daripada Yunus ada di sini
  rationale: Bentuk netral πλεῖον tidak sekadar mengatakan bahwa ada seorang lelaki yang lebih besar daripada Yunus. Terjemahan utama mempertahankan ambiguitas antara pribadi Yesus dan kenyataan lebih besar yang hadir dalam diri serta pelayanan-Nya; alternatif personal dicatat tanpa dijadikan penafsiran wajib.
- issue: Penandaan gender dalam ἄνδρες
  choice: para lelaki
  alternative: orang-orang Niniwe
  rationale: Teks Yunani memakai nomina maskulin eksplisit ἄνδρες. Karena itu, terjemahan mempertahankan rujukan kepada lelaki dan tidak menetralkannya menjadi semua penduduk Niniwe.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan awal ‘Pada penghakiman’ menonjolkan latar yudisial tanpa menambahkan ‘hari’. ‘Lihatlah’ mempertahankan penekanan retoris, sedangkan ‘generasi’ dipakai agar hubungan dengan γενεά tetap transparan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
