id: MAT.12.8
reference: Matthew 12:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: id
  text: Sebab Anak Manusia adalah Tuhan atas hari Sabat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Anak Manusia adalah penguasa atas hari Sabat.”
    reason: lexical_alternative
  - marker: b
    text: “Anak Manusia” adalah sebutan khas yang dipakai Yesus bagi diri-Nya dalam kitab-kitab Injil. Ungkapan ini juga dapat diterjemahkan secara lebih umum sebagai “manusia itu”, tetapi terjemahan tersebut melemahkan kemungkinan nuansanya sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan alasan yang dikemukakan sebelumnya.
- source_word: κύριος
  choice: Tuhan
  rationale: Menjaga bobot gelar dan pernyataan kewenangan dalam konteks kristologis ini; 'penguasa' dimungkinkan secara leksikal, tetapi kurang mempertahankan resonansi teologis κύριος.
- source_word: τοῦ σαββάτου
  choice: atas hari Sabat
  rationale: Dalam bahasa Indonesia, 'Tuhan atas hari Sabat' menyatakan lingkup kewenangan dengan alami, sekaligus mencerminkan genitif yang bergantung pada κύριος.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan khas yang dipakai Yesus bagi diri-Nya dalam Injil dan kemungkinan resonansi titulernya, tanpa meratakannya menjadi ungkapan generik tentang manusia.
- source_word: ἐστιν
  choice: adalah
  rationale: Menerjemahkan kopula kini secara langsung dan wajar.
theological_decisions:
- issue: Daya kristologis κύριος ... τοῦ σαββάτου
  choice: Anak Manusia adalah Tuhan atas hari Sabat
  alternative: Anak Manusia adalah penguasa atas hari Sabat
  rationale: Pilihan 'Tuhan' mempertahankan pernyataan kewenangan yang kuat serta bobot teologis κύριος tanpa menambahkan klaim yang tidak dinyatakan teks.
- issue: Pemaknaan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Diperlakukan sebagai sebutan titular 'Anak Manusia'.
  alternative: manusia itu
  rationale: Dalam tradisi Injil frasa ini merupakan sebutan khas Yesus dan mungkin memiliki resonansi apokaliptik atau intertekstual; terjemahan tradisional mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Hari Sabat' dipakai sebagai istilah yang lazim bagi hari kudus Yahudi; kapitalisasi 'Anak Manusia' dan 'Tuhan' menandai penggunaan titular dalam konteks ini.
