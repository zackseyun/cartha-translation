  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: id
  text: Tetapi, setelah keluar, orang-orang Farisi berunding melawan Yesus tentang bagaimana mereka dapat membinasakan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membunuh-Nya.” Kata Yunani yang dipakai berarti “membinasakan” dan dalam konteks ini dapat mencakup niat untuk membunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: keluar
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului persekongkolan; susunan “keluar lalu” menyampaikan urutan itu secara alami.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang berlawanan dari tindakan Yesus sebelumnya kepada tanggapan bermusuhan orang-orang Farisi.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan wajar dalam bahasa Indonesia untuk kelompok Yahudi ini.
- source_word: συμβούλιον ἔλαβον
  choice: bersekongkol
  rationale: Ungkapan harfiahnya berarti “mengambil nasihat/berunding,” tetapi dalam konteks permusuhan dan tujuan berikutnya berarti menyusun rencana bersama untuk mencelakakan Yesus.
- source_word: κατ’ αὐτοῦ
  choice: melawan Yesus
  rationale: κατά dengan genitif memiliki daya adversatif di sini. Nama “Yesus” dipakai untuk menjernihkan rujukan pronomina secara alami tanpa mengubah makna.
- source_word: ὅπως
  choice: untuk mencari cara
  rationale: 'Memperlihatkan sekaligus tujuan dan nuansa deliberatif: mereka bersekongkol mengenai bagaimana rencana itu dapat dilaksanakan.'
- source_word: αὐτὸν ἀπολέσωσιν
  choice: membinasakan-Nya
  rationale: “Membinasakan” mempertahankan keluasan ἀπόλλυμι, yang dalam konteks ini mengandung maksud mematikan tetapi tidak memakai verba Yunani yang secara khusus hanya berarti membunuh.
theological_decisions:
- issue: Tingkat kekhususan terjemahan ἀπολέσωσιν
  choice: membinasakan-Nya
  alternative: membunuh-Nya; membuat-Nya mati
  rationale: Konteks menunjukkan niat yang mematikan, tetapi verba Yunani memiliki cakupan lebih luas daripada kata yang secara eksplisit berarti “membunuh.” Teks utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan maksud yang mungkin tersurat dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menjaga kontras naratif; “bersekongkol” menyampaikan perundingan rahasia yang bermusuhan secara idiomatis. Kapital pada “-Nya” mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
