    issue: “bersekongkol” terlalu spesifik untuk συμβούλιον ἔλαβον.
    rationale: Idiom Yunani ini secara harfiah menyatakan tindakan berunding atau mengambil keputusan bersama. Konteksnya jelas bermusuhan, tetapi teks tidak secara tersendiri menyatakan kerahasiaan atau sifat komplotan yang tersirat dalam “bersekongkol.”
  - severity: low
    issue: “untuk mencari cara” agak memperluas klausa ὅπως.
    rationale: Klausa tersebut menyatakan pokok atau tujuan perundingan—bagaimana mereka dapat membinasakan Dia. “Tentang bagaimana mereka dapat” mempertahankan nuansa itu dengan lebih langsung.
  - severity: low
    issue: Alternatif catatan kaki “membuat-Nya mati” tidak idiomatis.
    rationale: Ungkapan itu bukan padanan modern yang wajar untuk “put him to death” dalam konteks ini; “membunuh-Nya” cukup sebagai alternatif yang lebih eksplisit.
