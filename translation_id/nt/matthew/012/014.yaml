  source_fidelity: 'Teks draf menyampaikan unsur-unsur pokok ayat dengan tepat: keberangkatan orang Farisi, tindakan yang diarahkan melawan Yesus, dan maksud untuk membinasakan-Nya. Namun, “bersekongkol” menambahkan nuansa komplotan rahasia yang tidak dinyatakan secara eksplisit oleh συμβούλιον ἔλαβον, yang secara langsung berarti mereka berunding atau mengambil keputusan bersama. Frasa “untuk mencari cara” juga sedikit lebih bebas daripada klausa ὅπως (“tentang/bagaimana mereka dapat”).'
  naturalness: Bahasa draf umumnya baku dan jelas. “Setelah keluar ... berunding ... tentang bagaimana mereka dapat ...” lebih alami sekaligus lebih dekat dengan struktur dan cakupan makna Yunani. “Namun” dapat dipakai, tetapi “Tetapi” merupakan penghubung naratif yang lebih netral untuk δέ.
  terminology: “Orang-orang Farisi” dan “membinasakan-Nya” dapat dipertahankan. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan kebiasaan penerbitan Alkitab Indonesia. Catatan kaki sebaiknya menghilangkan alternatif “membuat-Nya mati,” yang tidak idiomatis dalam bahasa Indonesia modern; “membunuh-Nya” menyatakan alternatif leksikal yang relevan.
  issues:
