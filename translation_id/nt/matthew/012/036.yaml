  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: id
  text: Namun, Aku berkata kepadamu bahwa pada hari penghakiman manusia akan memberikan pertanggungjawaban atas setiap kata sia-sia[a] yang mereka ucapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kata yang tidak berguna” atau “kata yang ceroboh.” Kata sifat Yunani ini dapat berarti “menganggur,” “tidak menghasilkan,” “tidak berguna,” atau “ceroboh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: δέ memberi peralihan yang agak kontras dengan konteks sebelumnya; “Namun” menyampaikannya secara alami, sedangkan bentuk kini λέγω dipertahankan dengan “Aku berkata”.
- source_word: πᾶν ῥῆμα
  choice: setiap perkataan
  rationale: πᾶν berbentuk distributif, dan ῥῆμα di sini menunjuk pada sesuatu yang diucapkan; “setiap perkataan” alami dan tepat dalam bahasa Indonesia.
- source_word: ἀργὸν
  choice: sia-sia
  rationale: ἀργός dapat berarti tidak bekerja, tidak menghasilkan, atau tidak berguna. “Sia-sia” mempertahankan gambaran perkataan yang tidak menghasilkan kebaikan tanpa membatasi maknanya hanya pada ucapan yang keliru karena kurang hati-hati.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: yang diucapkan manusia
  rationale: οἱ ἄνθρωποι bersifat generik dan mencakup seluruh umat manusia, bukan hanya laki-laki. Bentuk pasif bahasa Indonesia menghindari pengulangan subjek dan tetap menyampaikan tindakan berbicara.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: akan mereka pertanggungjawabkan
  rationale: Ungkapan Yunani secara harfiah berarti memberikan pertanggungjawaban mengenai hal itu. Bentuk verbal “mempertanggungjawabkan” alami dalam bahasa Indonesia dan mempertahankan rujukan kepada setiap perkataan.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: pada hari penghakiman
  rationale: Frasa ini menunjuk pada waktu penghakiman yudisial; “pada hari penghakiman” merupakan padanan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Bobot moral ἀργόν dalam peringatan Yesus
  choice: sia-sia
  alternative: ceroboh; tidak berguna; sembarangan
  rationale: “Sia-sia” mempertahankan rentang makna ucapan yang menganggur, tidak menghasilkan kebaikan, atau tidak berguna dalam konteks pertanggungjawaban ilahi. Catatan kaki menjaga kemungkinan nuansa ceroboh tanpa mempersempit makna utama.
- issue: Cakupan οἱ ἄνθρωποι
  choice: manusia
  alternative: orang-orang; kaum laki-laki
  rationale: Nomina Yunani ini merujuk secara umum kepada manusia dan tidak membatasi peringatan kepada jenis kelamin tertentu.
- issue: Sifat pertanggungjawaban pada hari penghakiman
  choice: akan mereka pertanggungjawabkan
  alternative: akan memberikan pertanggungjawaban tentangnya
  rationale: Pilihan ini mempertahankan kepastian pertanggungjawaban yang dinyatakan oleh bentuk mendatang tanpa menambahkan rincian tentang hasil atau hukuman penghakiman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti ucapan langsung Yesus. Susunan kalimat dekat dengan alur Yunani, tetapi ungkapan pertanggungjawaban dibuat idiomatis dalam bahasa Indonesia.
