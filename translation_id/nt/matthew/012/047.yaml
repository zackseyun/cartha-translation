  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: id
  text: Lalu seseorang berkata kepada-Nya[a], “Lihat, ibu-Mu dan saudara-saudara laki-laki-Mu sedang berdiri di luar dan berusaha untuk berbicara dengan-Mu.”
