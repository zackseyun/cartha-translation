lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Lalu seseorang berkata kepada-Nya
  rationale: δέ berfungsi sebagai penghubung ringan dalam alur cerita, sehingga diterjemahkan secara alami dengan “Lalu”; τις tetap tak tentu sebagai “seseorang”.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Kata ini menarik perhatian pendengar. “Lihat” mempertahankan fungsi tersebut dalam bahasa Indonesia modern tanpa memakai bentuk arkais.
- source_word: ἡ μήτηρ σου
  choice: ibu-Mu
  rationale: Terjemahan langsung dan wajar untuk konstruksi posesif ini; huruf kapital mengikuti kebiasaan bahasa Indonesia ketika pronomina merujuk kepada Yesus.
- source_word: οἱ ἀδελφοί σου
  choice: saudara-saudara laki-laki-Mu
  rationale: Dalam konteks naratif ini bentuk maskulin merujuk kepada anggota keluarga laki-laki; pilihan ini lebih tepat daripada “saudara-saudara” yang dapat ambigu mengenai jenis kelamin.
- source_word: ἔξω ἑστήκασιν
  choice: sedang berdiri di luar
  rationale: Bentuk perfektum ἵστημι menyatakan keadaan kini sebagai hasil mengambil posisi; “sedang berdiri” menyampaikan keadaan itu, sementara “di luar” menerjemahkan ἔξω secara eksplisit.
- source_word: ζητοῦντες
  choice: berusaha
  rationale: Dalam konteks ini ζητέω dengan infinitif menyatakan upaya atau keinginan untuk memperoleh kesempatan berbicara. “Berusaha” terdengar alami dan tidak memastikan bahwa upaya itu berhasil.
- source_word: σοι λαλῆσαι
  choice: berbicara dengan-Mu
  rationale: Ungkapan ini secara alami berarti berbicara kepada atau dengan Yesus. “Berbicara dengan-Mu” merupakan susunan Indonesia yang wajar untuk maksud menemui seseorang guna bercakap.
theological_decisions:
- issue: Status tekstual Matius 12:47
  choice: Ayat dimuat dalam teks utama sesuai teks SBLGNT yang diberikan, dengan catatan tentang penghilangannya dalam sebagian naskah.
  alternative: Menghilangkan seluruh ayat karena tidak terdapat dalam sebagian saksi naskah.
  rationale: Sumber yang ditetapkan memuat ayat ini dengan penanda keraguan tekstual. Memuat terjemahannya sambil memberi catatan menjaga transparansi dan tidak menyelesaikan persoalan kritik teks secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan langsung dibuat alami; pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] dicantumkan dalam teks utama.
