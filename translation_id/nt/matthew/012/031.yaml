  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: id
  text: 'Karena itu, Aku berkata kepadamu: manusia akan diampuni atas setiap dosa dan hujatan, tetapi hujatan terhadap Roh[a] tidak akan diampuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hujatan terhadap Roh Kudus.” Dari konteks sekitarnya, yang dimaksud ialah Roh Kudus, meskipun ayat ini sendiri hanya berbunyi “Roh.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari konteks sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan nada tegas dari rumusan Yunani.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: Setiap dosa dan hujatan
  rationale: Kata 'setiap' mempertahankan daya distributif πᾶσα, sedangkan 'dosa' dan 'hujatan' merupakan padanan baku dalam konteks ini.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: akan diampuni bagi manusia
  rationale: Mempertahankan bentuk pasif dan menampilkan manusia sebagai penerima pengampunan; 'manusia' bersifat generik dan tidak terbatas pada laki-laki.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: tetapi hujatan terhadap Roh
  rationale: Genitif dipahami secara objektif, yaitu Roh sebagai sasaran hujatan; kata 'Kudus' tidak ditambahkan karena tidak terdapat dalam teks ayat ini.
- source_word: οὐκ ἀφεθήσεται
  choice: tidak akan diampuni
  rationale: Menerjemahkan secara langsung bentuk pasif futurum dan mempertahankan kesejajaran dengan klausa sebelumnya.
theological_decisions:
- issue: Apakah πνεύματος diterjemahkan sebagai 'Roh' atau 'Roh Kudus'
  choice: Roh
  alternative: Roh Kudus
  rationale: Teks Yunani ayat ini hanya menyebut 'Roh'. Konteks menunjukkan bahwa yang dimaksud ialah Roh Kudus, tetapi teks utama mempertahankan bentuk eksplisit sumber dan catatan kaki menjelaskan rujukannya.
- issue: Hubungan genitif dalam τοῦ πνεύματος βλασφημία
  choice: hujatan terhadap Roh
  alternative: hujatan Roh
  rationale: 'Konteks menunjukkan genitif objektif: Roh adalah sasaran hujatan, bukan pelaku atau pemilik hujatan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Aku' dan 'Roh' menandai rujukan ilahi. Susunan pasif dipertahankan untuk menjaga kesejajaran retoris kedua klausa; frasa 'bagi manusia' dipilih sebagai ungkapan formal yang tetap mudah dipahami.
