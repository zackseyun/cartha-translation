  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: id
  text: Atau bagaimana seseorang dapat masuk ke rumah orang kuat dan merampas barang-barangnya[a], kecuali ia lebih dahulu mengikat orang kuat itu[b]? Dan kemudian ia akan menjarah rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkakas-perkakasnya” atau “harta bendanya”; kata Yunani ini dapat menunjuk kepada bejana atau perkakas secara harfiah, dan secara lebih luas kepada barang milik.
    reason: lexical_alternative
  - marker: b
    text: Atau “membelenggu orang kuat itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan penghubung yang memperkenalkan perbandingan penjelas sebagai kelanjutan dari argumen sebelumnya.
- source_word: πῶς δύναταί τις
  choice: bagaimana seseorang dapat
  rationale: Mengungkapkan pertanyaan retoris dan subjek tak tentu secara alami dalam bahasa Indonesia.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: masuk ke rumah
  rationale: Padanan langsung dan wajar untuk gerak memasuki sebuah rumah.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: orang kuat / orang kuat itu
  rationale: Bentuk adjektiva substantival Yunani menunjuk kepada seorang laki-laki dalam gambaran konkret; pengulangan kedua diberi 'itu' agar rujukannya jelas.
- source_word: τὰ σκεύη αὐτοῦ
  choice: barang-barangnya
  rationale: Dalam konteks rumah yang dirampok, σκεύη mencakup benda atau milik yang ada di rumah, bukan hanya bejana secara harfiah.
- source_word: ἁρπάσαι
  choice: merampas
  rationale: Menyampaikan tindakan mengambil dengan paksa tanpa menyamakannya sepenuhnya dengan tindakan penjarahan yang lebih luas pada verba terakhir.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: jika ia tidak lebih dahulu mengikat
  rationale: Mempertahankan bentuk syarat dan urutan πρῶτον, serta citra mengikat secara langsung.
- source_word: καὶ τότε
  choice: Sesudah itu, barulah
  rationale: Mengungkapkan urutan yang tegas dan implikasi bahwa penjarahan baru mungkin setelah orang kuat diikat.
- source_word: διαρπάσει
  choice: akan menjarah
  rationale: Menangkap tindakan merampasi rumah secara lebih menyeluruh daripada ἁρπάσαι.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: rumahnya
  rationale: Mempertahankan citra konkret rumah tanpa memasukkan penafsiran alegoris ke dalam teks.
theological_decisions:
- issue: Bahasa maskulin representatif dalam perumpamaan
  choice: orang kuat; seseorang
  alternative: orang yang kuat; siapa pun
  rationale: Teks Yunani memakai bentuk maskulin dalam gambaran konkret. 'Orang kuat' mempertahankan sosok dalam metafora, sedangkan 'seseorang' menerjemahkan subjek tak tentu secara idiomatis.
- issue: Cakupan metaforis rumah dan barang-barang
  choice: Mempertahankan gambaran konkret tentang memasuki dan menjarah rumah
  alternative: Menafsirkan rumah sebagai wilayah kekuasaan dan barang-barang sebagai orang atau milik rohani
  rationale: Konteks berkaitan dengan kuasa atas roh-roh jahat, tetapi ayat ini sendiri menyatakannya melalui metafora. Terjemahan tidak seharusnya memasukkan uraian alegoris yang tidak dinyatakan secara eksplisit.
- issue: Hubungan urutan pada καὶ τότε
  choice: Sesudah itu, barulah
  alternative: Dan kemudian
  rationale: Pilihan ini menyampaikan urutan logis dan temporal secara alami tanpa menambahkan identifikasi teologis terhadap tokoh-tokoh dalam metafora.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur pertanyaan retoris dipertahankan; 'barulah' dipakai untuk menyatakan urutan yang kuat secara alami. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
