  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: id
  text: Lalu Ia berkata kepada orang itu, “Ulurkan tanganmu.” Orang itu pun mengulurkan tangannya, dan tangannya dipulihkan[a] menjadi sehat seperti tangannya yang lain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disembuhkan”; kata kerja Yunani menekankan pemulihan kepada keadaan yang semestinya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sehat seperti yang lain”; “yang lain” merujuk kepada tangan orang itu yang satu lagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan peristiwa secara alami dalam narasi bahasa Indonesia.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini Yunani merupakan present historis yang menghidupkan narasi; bahasa Indonesia lazim memakai bentuk tak bertanda waktu 'berkata' tanpa menghilangkan alur naratif.
- source_word: τῷ ἀνθρώπῳ
  choice: kepada orang itu
  rationale: Merujuk kepada laki-laki tertentu yang telah disebut dalam konteks; 'orang itu' alami dan tidak perlu mengulang keterangan yang sudah jelas.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Ulurkan tanganmu
  rationale: '''Ulurkan'' menyampaikan perintah langsung untuk membentangkan atau mengedepankan tangan dan merupakan ungkapan Indonesia yang alami.'
- source_word: ἐξέτεινεν
  choice: orang itu pun mengulurkannya
  rationale: Mengulang verba perintah untuk mempertahankan hubungan antara perintah dan tanggapan; subjek diungkapkan kembali agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ἀπεκατεστάθη
  choice: tangannya dipulihkan
  rationale: Verba ini menekankan pengembalian kepada keadaan yang semestinya; 'dipulihkan' mempertahankan nuansa itu lebih tepat daripada sekadar 'disembuhkan'.
- source_word: ὑγιὴς
  choice: sehat
  rationale: Menyatakan keadaan yang sehat atau baik secara jasmani dengan kata Indonesia yang jelas dan umum.
- source_word: ὡς ἡ ἄλλη
  choice: seperti tangannya yang lain
  rationale: Bentuk feminin 'yang lain' secara tersirat merujuk kepada tangan yang satunya; menyebut 'tangannya' membuat rujukan itu jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat pemulihan tangan dalam mukjizat ini
  choice: Tangan itu 'dipulihkan' dan menjadi sehat seperti tangan yang lain.
  alternative: Tangan itu 'disembuhkan' atau 'dijadikan utuh'.
  rationale: '''Dipulihkan'' mengikuti penekanan ἀποκαθίστημι pada kembalinya sesuatu kepada keadaan yang semestinya, tanpa menambahkan penafsiran teologis di luar pernyataan teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai sebagai pronomina naratif bagi Yesus sesuai konteks, sedangkan 'orang itu' menjaga kejelasan subjek. Susunan kalimat mempertahankan perintah, tanggapan, dan hasil pemulihan secara ringkas.
