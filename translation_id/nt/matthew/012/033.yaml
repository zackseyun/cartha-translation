id: MAT.12.33
reference: Matthew 12:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: id
  text: “Buatlah pohon itu baik dan buahnya baik, atau buatlah pohon itu busuk dan buahnya busuk; sebab pohon dikenal dari buahnya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “buatlah” dapat berfungsi secara retoris dengan arti “anggaplah” atau “nyatakanlah”, tetapi bentuk Yunaninya adalah imperatif. Kata “busuk” juga dapat berarti buruk, rusak, atau tidak berguna.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: buatlah
  rationale: Bentuk imperatif aoris jamak dipertahankan sebagai perintah langsung. Dalam konteks, ungkapan ini mungkin bersifat retoris dengan arti ‘anggaplah’ atau ‘nyatakanlah’, tetapi ‘buatlah’ menjaga bentuk dan kesejajaran teks Yunani.
- source_word: τὸ δένδρον
  choice: pohon itu
  rationale: Padanan langsung dan alami; artikel Yunani ditampilkan secara idiomatis sebagai ‘itu’ dalam perumpamaan konkret ini.
- source_word: καλός
  choice: baik
  rationale: Menjaga cakupan mutu serta gema moral dalam metafora tanpa mempersempitnya menjadi sekadar ‘sehat’.
- source_word: καρπός
  choice: buah
  rationale: Padanan langsung yang mempertahankan citra metaforis sumber dan lazim dalam bahasa Indonesia.
- source_word: σαπρός
  choice: busuk
  rationale: Mengungkapkan sesuatu yang rusak, buruk, atau tidak berguna dengan citra yang kuat dan dapat diterapkan secara alami pada pohon maupun buah.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: sebab ... dari buahnya
  rationale: ‘Sebab’ menyatakan hubungan penjelasan dari γάρ, sedangkan ‘dari buahnya’ mempertahankan secara wajar daya ἐκ sebagai dasar pengenalan.
- source_word: γινώσκεται
  choice: dikenal
  rationale: Mempertahankan bentuk pasif kini secara ringkas dan langsung; dalam konteks artinya pohon dikenali atau diketahui berdasarkan buahnya.
theological_decisions:
- issue: Daya imperatif dalam metafora Yesus
  choice: 'Imperatif langsung dipertahankan: ‘Buatlah ... atau buatlah ...’'
  alternative: ‘Anggaplah pohon itu baik ...’ atau ‘Nyatakanlah pohon itu baik ...’
  rationale: Teks Yunani memakai dua imperatif aoris yang kemungkinan berfungsi sebagai tantangan retoris. Mempertahankan bentuk imperatif menjaga ketajaman dan ketegangan ungkapan tanpa menetapkan satu penafsiran retoris tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kesejajaran klausa Yunani serta pengulangan ‘buatlah’, ‘baik’, dan ‘busuk’ dipertahankan. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan dua unsur yang berulang dalam keseluruhan kalimat.
