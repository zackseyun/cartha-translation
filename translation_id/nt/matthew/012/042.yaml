id: MAT.12.42
reference: Matthew 12:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: id
  text: Ratu dari Selatan[a] akan bangkit pada waktu penghakiman bersama generasi ini dan akan menghukumnya, sebab ia datang dari ujung-ujung bumi untuk mendengarkan hikmat Salomo. Dan lihatlah, sesuatu yang lebih besar daripada Salomo ada di sini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ratu dari Selatan” mengacu kepada ratu Syeba (1 Raja-Raja 10:1–13; 2 Tawarikh 9:1–12), meskipun teks Yunani tidak menyebut nama Syeba secara langsung.
    reason: cross_reference
  - marker: b
    text: Atau “seseorang yang lebih besar daripada Salomo ada di sini.” Bahasa Yunani memakai bentuk netral (“sesuatu yang lebih besar”), yang dapat menekankan kebesaran luar biasa yang hadir dalam diri dan pelayanan Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Ratu dari Selatan
  rationale: Menerjemahkan konstruksi genitif secara langsung tanpa memasukkan nama Syeba, yang berasal dari latar Perjanjian Lama tetapi tidak disebutkan dalam teks Yunani.
- source_word: ἐγερθήσεται
  choice: akan bangkit
  rationale: Bentuk pasif masa depan ini dapat berarti dibangkitkan atau bangkit. Pilihan ini wajar dalam bahasa Indonesia dan tetap memuat nuansa kebangkitan serta tampilnya sang ratu dalam penghakiman.
- source_word: ἐν τῇ κρίσει
  choice: pada waktu penghakiman
  rationale: Menunjuk kepada penghakiman tertentu. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'di dalam penghakiman'.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: bersama generasi ini
  rationale: μετά dengan genitif pada dasarnya berarti 'bersama'; pertentangan dengan generasi tersebut dinyatakan oleh kata kerja berikutnya, bukan oleh preposisi ini.
- source_word: κατακρινεῖ αὐτήν
  choice: akan menghukumnya
  rationale: κατακρίνω berarti menyatakan bersalah atau menghukum. Akhiran '-nya' merujuk kepada 'generasi ini'.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: dari ujung-ujung bumi
  rationale: Mempertahankan ungkapan sumber yang menggambarkan tempat yang amat jauh.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: untuk mendengarkan hikmat Salomo
  rationale: Infinitif menyatakan tujuan kedatangannya. 'Mendengarkan hikmat Salomo' menyampaikan tindakan mendengar ajaran atau perkataan bijaknya secara alami.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Penanda wacana ini mengarahkan perhatian dengan penekanan; 'lihatlah' tetap khidmat tetapi mudah dipahami pembaca modern.
- source_word: πλεῖον Σολομῶνος
  choice: sesuatu yang lebih besar daripada Salomo
  rationale: πλεῖον berbentuk netral. 'Sesuatu yang lebih besar' mempertahankan bentuk dan keluasan ungkapan itu tanpa langsung mengubahnya menjadi sebutan maskulin bagi seorang pribadi.
- source_word: ὧδε
  choice: ada di sini
  rationale: Menyampaikan arti lokatif 'di sini' dengan menambahkan kopula eksistensial yang diperlukan agar kalimat Indonesia alami.
theological_decisions:
- issue: Cara menerjemahkan bentuk netral πλεῖον dalam kaitannya dengan Yesus
  choice: sesuatu yang lebih besar daripada Salomo
  alternative: seseorang yang lebih besar daripada Salomo
  rationale: Bentuk Yunani yang netral dapat menyoroti kebesaran realitas yang hadir dalam diri dan pelayanan Yesus, bukan hanya membuat perbandingan langsung antara dua orang. Pilihan utama mempertahankan ketegangan gramatikal dan keluasan klaim itu; alternatif personal tetap mungkin menurut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Generasi ini' dipilih karena lebih lazim bagi pembaca masa kini daripada 'angkatan ini'. Pengulangan dan susunan klausa sumber dipertahankan sejauh tetap alami; penanda emphatik ἰδού diterjemahkan 'lihatlah'.
