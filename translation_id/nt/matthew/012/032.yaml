id: MAT.12.32
reference: Matthew 12:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: id
  text: Siapa pun yang mengucapkan suatu perkataan menentang Anak Manusia, ia akan diampuni; tetapi siapa pun yang berbicara menentang Roh Kudus, ia tidak akan diampuni, baik pada zaman ini maupun pada zaman yang akan datang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak pada zaman ini dan tidak pada yang akan datang”; kata “zaman” dipahami juga dalam frasa kedua.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: siapa pun ... tetapi siapa pun
  rationale: Bentuk relatif dengan ἐάν/ἄν menyatakan kondisi umum yang tidak terbatas; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan terbukanya.
- source_word: εἴπῃ λόγον
  choice: mengucapkan sesuatu
  rationale: Secara harfiah berarti mengatakan atau mengucapkan suatu perkataan. 'Mengucapkan sesuatu' mempertahankan tindakan verbal tanpa menghasilkan ungkapan Indonesia yang kaku seperti 'mengucapkan sebuah kata'.
- source_word: κατὰ
  choice: menentang
  rationale: Dengan genetif dalam konteks ini, κατά menunjuk pada ujaran yang diarahkan secara bermusuhan kepada seseorang. 'Menentang' sesuai dalam kedua klausa.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas Yunani beserta gema mesianik dan apokaliptiknya tanpa memparafrasakannya.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: ia akan diampuni / ia tidak akan diampuni
  rationale: Bentuk pasif dipertahankan secara alami dalam bahasa Indonesia. Acuan kepada orangnya jelas, sementara pelaku ilahi tetap tidak disebutkan sebagaimana dalam bahasa Yunani.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Roh Kudus
  rationale: Padanan baku dan alami dalam bahasa Indonesia modern untuk gelar ini.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: baik pada zaman ini maupun pada zaman yang akan datang
  rationale: αἰών di sini bersifat temporal, bukan spasial. Klausa kedua melesapkan kata 'zaman', tetapi bahasa Indonesia secara alami dapat menyatakannya kembali. Dalam cakupan negasi, pola 'tidak ... baik ... maupun ...' menyampaikan pasangan οὔτε ... οὔτε dengan jelas.
theological_decisions:
- issue: Kontras temporal αἰών / μέλλων
  choice: baik pada zaman ini maupun pada zaman yang akan datang
  alternative: baik di dunia ini maupun di dunia yang akan datang
  rationale: Teks membandingkan zaman sekarang dengan zaman mendatang, bukan dua dunia secara spasial. Terjemahan ini mempertahankan kerangka eskatologis tanpa menetapkan sistem doktrinal tertentu.
- issue: Sifat pelanggaran yang tidak diampuni
  choice: Mempertahankan peringatan tentang berbicara menentang Roh Kudus tanpa definisi doktrinal tambahan
  alternative: Menafsirkannya secara khusus sebagai tuduhan historis tertentu atau secara umum sebagai ketidakbertobatan sampai akhir
  rationale: Ayat ini menyatakan tindakan dan akibatnya, tetapi tidak memberikan rumusan teologis lengkap mengenai batas pelanggaran tersebut. Terjemahan tidak boleh menyelesaikan ketegangan itu melalui tambahan tafsiran.
- issue: Pasif ilahi dalam ἀφεθήσεται
  choice: ia akan diampuni
  alternative: Allah akan mengampuninya
  rationale: Teks Yunani memakai bentuk pasif dan tidak menyebut pelaku secara eksplisit. Bentuk pasif Indonesia mempertahankan implikasi ilahi tanpa menambahkan subjek ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Mengucapkan sesuatu' dipakai pada klausa pertama untuk mencerminkan εἴπῃ λόγον secara alami, sedangkan 'berbicara' pada klausa kedua mengikuti bentuk Yunani yang tidak mengulangi λόγον. Penanda catatan [a] ditempatkan sesudah seluruh kontras temporal yang dijelaskannya.
