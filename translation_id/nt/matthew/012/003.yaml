translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” memperjelas bahwa sapaan ditujukan kepada lebih dari satu orang. Huruf kecil pada “ia” mengikuti kaidah umum dan tidak memasukkan pilihan tipografis denominasi tertentu.
