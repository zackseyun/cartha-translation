base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Tidakkah kalian pernah membaca apa yang Daud lakukan ketika ia lapar, dan orang-orang yang bersamanya juga lapar?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang Daud lakukan ketika ia dan orang-orang yang bersamanya lapar?” Dalam bahasa Yunani, rasa lapar dapat dipahami berlaku bagi Daud dan orang-orang yang bersamanya, meskipun kata kerja tunggal secara eksplisit merujuk kepada Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, ia
  rationale: δέ menandai tanggapan yang berlawanan secara ringan terhadap tuduhan sebelumnya. “Namun” alami dalam bahasa Indonesia tanpa memperkeras pertentangannya.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Terjemahan langsung dan alami bagi λέγω dengan objek tak langsung αὐτοῖς.
- source_word: Οὐκ ἀνέγνωτε
  choice: Belum pernahkah kalian membaca
  rationale: Pertanyaan retoris ini menegur lawan bicara karena seharusnya mereka mengenal nas Kitab Suci tersebut. Bentuk ini menyampaikan daya idiom Yunani secara alami dalam bahasa Indonesia modern.
- source_word: τί ἐποίησεν
  choice: apa yang dilakukan
  rationale: ποιέω di sini menyatakan tindakan historis secara sederhana; bentuk pasif relatif Indonesia menghasilkan ungkapan yang wajar.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: ὅτε ἐπείνασεν
  choice: ketika ia lapar
  rationale: πεινάω berarti berada dalam keadaan lapar. “Ia lapar” alami dan tidak memaksakan nuansa ‘menjadi lapar’.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: dan orang-orang yang bersamanya juga lapar
  rationale: Frasa tersebut secara harfiah berarti ‘dan orang-orang yang bersama dia’. Predikat “lapar” dilengkapi dalam bahasa Indonesia agar kalimat utuh, sambil mempertahankan bahwa verba Yunani yang dinyatakan eksplisit berbentuk tunggal dan merujuk kepada Daud.
