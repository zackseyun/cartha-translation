  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: id
  text: 'supaya terpenuhi apa yang telah dikatakan melalui Nabi Yesaya, yang berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya penghubung klausa tujuan/hasil tanpa memutuskan secara berlebihan salah satu nuansa tersebut.
- source_word: πληρωθῇ
  choice: genaplah
  rationale: Padanan alami bagi bentuk pasif subjungtif dalam rumusan penggenapan khas Matius; konstruksi Indonesia menyampaikan terjadinya penggenapan tanpa perlu menambahkan modalitas yang kaku.
- source_word: τὸ ῥηθὲν
  choice: apa yang disampaikan
  rationale: Menerjemahkan partisipel artikular secara idiomatis dan mempertahankan makna pasif; 'disampaikan' cocok dengan konteks pewahyuan melalui seorang nabi.
- source_word: διὰ
  choice: melalui
  rationale: Dengan kasus genitif, kata ini menandai perantaraan; 'melalui' mempertahankan pembedaan antara sumber ilahi dan nabi sebagai penyampai.
- source_word: Ἠσαΐου
  choice: Yesaya
  rationale: Bentuk nama nabi yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: τοῦ προφήτου
  choice: Nabi
  rationale: Mempertahankan identifikasi eksplisit Yesaya sebagai nabi dengan susunan gelar yang alami dalam bahasa Indonesia.
- source_word: λέγοντος
  choice: yang berkata
  rationale: Menghubungkan Nabi Yesaya dengan kutipan langsung yang dimulai pada ayat berikutnya dan mempertahankan fungsi partisipel genitif tersebut.
theological_decisions:
- issue: Perantaraan nabi dalam rumusan kutipan
  choice: melalui Nabi Yesaya
  alternative: oleh Nabi Yesaya
  rationale: '''Melalui'' paling jelas mempertahankan διά dengan genitif sebagai penanda perantaraan, sehingga tidak menyiratkan bahwa Yesaya adalah sumber terakhir perkataan itu.'
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan 'Nabi Yesaya' dipilih daripada 'Yesaya sang nabi' karena lebih lazim. Tanda koma di akhir mempertahankan kaitan langsung dengan kutipan pada ayat berikutnya.
