id: MAT.12.38
reference: Matthew 12:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: id
  text: Lalu beberapa ahli Taurat dan orang Farisi menjawab-Nya, “Guru, kami ingin melihat suatu tanda[a] dari-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda ajaib.” Kata Yunani yang digunakan dapat menunjuk pada tanda yang memiliki makna mukjizat, tetapi teks utama mempertahankan istilah yang lebih luas, “tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Lalu
  rationale: Menandai kelanjutan urutan peristiwa secara alami dalam narasi Indonesia.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: menjawab-Nya
  rationale: Mempertahankan idiom Yunani yang bermakna menjawab atau menanggapi, sekaligus menyatakan orang yang dituju.
- source_word: τινες τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: τινες menunjukkan sebagian dari kelompok itu, sedangkan 'ahli Taurat' merupakan padanan Indonesia yang jelas dan lazim untuk γραμματεῖς dalam konteks Injil.
- source_word: καὶ Φαρισαίων
  choice: dan orang Farisi
  rationale: Sebutan kelompok Yahudi ini dialihaksarakan sesuai pemakaian Indonesia yang lazim.
- source_word: λέγοντες
  choice: '[diungkapkan melalui tanda baca sebelum kutipan langsung]'
  rationale: Dalam bahasa Indonesia, isi tindakan berkata dapat diperkenalkan secara alami langsung sesudah verba 'menjawab' tanpa tambahan 'dengan berkata' yang kaku.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Menyampaikan sapaan kepada Yesus sebagai pengajar tanpa menambahkan nuansa kekuasaan dari padanan seperti 'Tuan'.
- source_word: θέλομεν
  choice: kami ingin
  rationale: Padanan modern dan langsung bagi ungkapan kehendak; 'kami' tepat karena pihak yang diajak bicara, yaitu Yesus, tidak termasuk dalam kelompok penutur.
- source_word: ἀπὸ σοῦ
  choice: dari-Mu
  rationale: Mempertahankan gagasan sumber atau asal tanda yang mereka minta.
- source_word: σημεῖον
  choice: suatu tanda
  rationale: Mempertahankan keluasan istilah Yunani; konteks dapat memberi nuansa mukjizat tanpa memasukkannya secara wajib ke dalam teks utama.
- source_word: ἰδεῖν
  choice: melihat
  rationale: Padanan langsung bagi infinitif ὁράω dan tidak menambahkan gagasan interpretatif seperti 'menyaksikan mukjizat'.
theological_decisions:
- issue: Sifat σημεῖον yang diminta
  choice: tanda
  alternative: tanda ajaib
  rationale: Dalam konteksnya, tanda itu mungkin dimaksudkan sebagai bukti ajaib yang mengesahkan Yesus. Namun, σημεῖον sendiri berarti 'tanda', sehingga teks utama mempertahankan cakupan katanya dan catatan kaki menyajikan kemungkinan nuansa ajaib.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kutipan dibuat alami dalam bahasa Indonesia, sementara bentuk 'menjawab-Nya' mempertahankan idiom naratif Yunani. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
