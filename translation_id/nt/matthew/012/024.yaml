id: MAT.12.24
reference: Matthew 12:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: id
  text: Namun, ketika orang-orang Farisi mendengarnya, mereka berkata, “Orang ini tidak mengusir setan-setan kecuali dengan kuasa Beelzebul[a], penguasa setan-setan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebul: secara tradisional disebut “Beelzebub.”'
    reason: Mencatat bentuk nama tradisional yang berbeda dari transliterasi bentuk Yunani dalam teks sumber.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan antara tanggapan orang-orang Farisi dan reaksi positif sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀκούσαντες
  choice: ketika ... mendengarnya
  rationale: Partisip aoris dipahami secara temporal; akhiran -nya menyatakan objek yang tersirat dari konteks.
- source_word: Οὗτος
  choice: Orang ini
  rationale: Mempertahankan nada meremehkan dari kata tunjuk dalam tuduhan orang-orang Farisi tanpa menambahkan tafsiran.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: mengusir setan-setan
  rationale: Padanan langsung dan lazim untuk tindakan mengeluarkan makhluk-makhluk jahat dalam konteks ini; bentuk jamak Yunani dipertahankan.
- source_word: οὐ ... εἰ μὴ
  choice: tidak ... kecuali
  rationale: Mempertahankan bentuk pembatasan dalam teks Yunani, yakni tuduhan bahwa satu-satunya kuasa yang dipakai berasal dari Beelzebul.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  rationale: ἐν menyatakan sarana atau kuasa dalam konteks ini; frasa ini menyampaikan maksud tuduhan dengan jelas dalam bahasa Indonesia.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Mentransliterasikan bentuk nama yang terdapat dalam SBLGNT; bentuk tradisional Beelzebub dicatat dalam catatan kaki.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: penguasa setan-setan
  rationale: ἄρχων menunjuk pada sosok yang memerintah atau memiliki wewenang; 'penguasa' alami dan tepat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nada kata tunjuk Οὗτος dalam tuduhan terhadap Yesus
  choice: Orang ini
  alternative: Dia
  rationale: '''Orang ini'' mempertahankan nada meremehkan yang mungkin terkandung dalam ujaran para penentang, tanpa memperkerasnya secara berlebihan.'
- issue: Bentuk nama Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Teks utama mengikuti bentuk Yunani sumber, sementara bentuk tradisional yang dikenal luas dipertahankan dalam catatan kaki.
- issue: Daya instrumental frasa ἐν τῷ Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  alternative: melalui Beelzebul
  rationale: Konteks tuduhan menyiratkan kuasa atau sarana yang berasal dari Beelzebul. Pilihan ini tidak menyatakan lebih jauh bagaimana hubungan tersebut dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur 'tidak ... kecuali' mempertahankan bentuk retoris Yunani, sedangkan 'dengan kuasa' menjernihkan fungsi instrumental ἐν secara wajar. Penanda catatan kaki ditempatkan langsung sesudah nama Beelzebul.
