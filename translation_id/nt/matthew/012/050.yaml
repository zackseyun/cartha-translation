  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: id
  text: Sebab siapa pun yang melakukan kehendak Bapa-Ku yang di surga, dialah saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “siapa pun yang melakukan kehendak Bapa-Ku yang di surga, orang itu adalah saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku.” Bentuk tunggal maskulin dalam bahasa Yunani dipakai secara umum untuk siapa saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: siapa pun yang
  rationale: Konstruksi relatif tak tentu dengan ἄν menyatakan syarat umum dan terbuka; “siapa pun yang” wajar dalam bahasa Indonesia serta mencakup laki-laki dan perempuan.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan pernyataan sebelumnya.
- source_word: ποιήσῃ
  choice: melakukan
  rationale: Bersama θέλημα, kata ini secara langsung berarti melakukan atau melaksanakan kehendak; “menaati” akan mempersempit maknanya secara interpretatif.
- source_word: τὸ θέλημα
  choice: kehendak
  rationale: Mempertahankan istilah teologis dan relasional sumber tanpa memparafrasakannya menjadi “apa yang diinginkan”.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Bapa-Ku yang di surga
  rationale: Mencerminkan frasa genitif dan keterangan atributif secara dekat sekaligus tetap alami dalam bahasa Indonesia.
- source_word: αὐτός
  choice: dialah
  rationale: 'Bentuk ini menyampaikan penekanan pada αὐτός: orang itulah yang dinyatakan sebagai anggota keluarga Yesus.'
- source_word: ἀδελφὸς
  choice: saudara laki-laki-Ku
  rationale: Menjaga pembedaan eksplisit dari ἀδελφή dan bentuk tunggal dalam daftar hubungan keluarga.
- source_word: ἀδελφὴ
  choice: saudara perempuan-Ku
  rationale: Padanan langsung yang mempertahankan unsur perempuan yang disebutkan secara tersendiri.
- source_word: μήτηρ
  choice: ibu-Ku
  rationale: Padanan langsung dalam bentuk tunggal dan mempertahankan rangkaian tiga hubungan keluarga.
- source_word: ἐστίν
  choice: adalah (diungkapkan melalui dialah)
  rationale: Kopula kini tersampaikan secara alami melalui konstruksi pronominal “dialah”.
theological_decisions:
- issue: Bentuk maskulin gramatikal dalam pernyataan yang berlaku umum
  choice: siapa pun yang ... dialah saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku
  alternative: siapa pun yang ... orang itu adalah saudara laki-laki-Ku, saudara perempuan-Ku, dan ibu-Ku
  rationale: Bahasa Indonesia tidak memiliki pronomina orang ketiga tunggal yang bergender. “Siapa pun” mempertahankan cakupan umum konstruksi Yunani, sedangkan tiga sebutan keluarga tetap dipertahankan satu per satu. “Dialah” juga menjaga penekanan αὐτός tanpa memasukkan gender yang tidak ditandai oleh tata bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Kapitalisasi pada sebutan yang merujuk kepada Allah dan sufiks kepunyaan yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia. Penanda catatan kaki ditempatkan pada akhir ayat.
