id: MAT.12.18
reference: Matthew 12:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: id
  text: “Lihatlah, hamba-Ku yang telah Kupilih, dia yang Kukasihi, yang kepada-Nya jiwa-Ku berkenan.[a] Aku akan menaruh Roh-Ku ke atas-Nya, dan ia akan memberitakan keadilan[b] kepada bangsa-bangsa.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang kepadanya Aku sangat berkenan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “penghakiman.” Kata Yunani κρίσις dapat berarti keadilan atau penghakiman.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “kepada orang-orang bukan Yahudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi seruan yang mengarahkan perhatian dalam kutipan nubuat, dengan bahasa Indonesia yang jelas dan tetap khidmat.
- source_word: παῖς
  choice: hamba
  rationale: Dalam konteks kutipan tentang Hamba dalam Yesaya, kata ini menunjuk kepada seorang hamba, bukan sekadar anak; pilihan ini menjaga hubungan antarteks tanpa memasukkan istilah filial yang tidak dinyatakan oleh kata tersebut di sini.
- source_word: ᾑρέτισα
  choice: telah Kupilih
  rationale: Bentuk lampau Yunani menyatakan tindakan pemilihan ilahi yang sudah dilakukan; bentuk 'telah Kupilih' alami dalam bahasa Indonesia dan mempertahankan aspek tersebut.
- source_word: ὁ ἀγαπητός μου
  choice: dia yang Kukasihi
  rationale: Mengungkapkan kasih dan keakraban ilahi secara alami serta bermartabat; 'yang Kukasihi' lebih lazim bagi pembaca modern daripada bentuk nominal 'kekasih-Ku' dalam susunan ini.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: yang kepadanya jiwa-Ku berkenan
  rationale: Mempertahankan ungkapan eksplisit 'jiwa-Ku' dan objek relasionalnya, sekalipun susunannya sedikit lebih tinggi daripada bahasa percakapan.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Aku akan menaruh Roh-Ku ke atasnya
  rationale: Mengikuti gambaran penempatan Roh di atas sang hamba dan mempertahankan nuansa pengutusan dalam nubuat. Huruf kapital menandai Roh milik Allah sebagai rujukannya.
- source_word: κρίσιν
  choice: keadilan
  rationale: Dalam misi sang Hamba kepada bangsa-bangsa, 'keadilan' paling baik menyampaikan tatanan benar yang berasal dari Allah; kemungkinan arti 'penghakiman' tetap dicatat.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa
  rationale: Menangkap cakupan universal nubuat dan gema Yesaya, sementara arti kontekstual 'orang-orang bukan Yahudi' tetap tersedia dalam catatan.
- source_word: ἀπαγγελεῖ
  choice: akan memberitakan
  rationale: Menyampaikan tindakan penyataan secara terbuka dan resmi dengan kata Indonesia yang wajar dalam konteks pewartaan nubuat.
theological_decisions:
- issue: Identitas sang Hamba dalam παῖς
  choice: Menerjemahkan παῖς sebagai 'hamba'.
  alternative: '''anak'' atau ''putra'''
  rationale: Konteksnya adalah kutipan bagian Hamba dalam Yesaya. 'Hamba' menjaga peran mesianik yang sedang ditonjolkan tanpa meniadakan atau menyisipkan penekanan kristologis lain ke dalam kata ini.
- issue: Arti κρίσις dalam misi sang Hamba
  choice: Menggunakan 'keadilan' dalam teks utama.
  alternative: '''penghakiman'''
  rationale: Konteks nubuat menyoroti apa yang diberitakan atau dibawa sang Hamba kepada bangsa-bangsa, sehingga 'keadilan' menyatakan tatanan benar Allah dengan baik. Karena istilah Yunani juga dapat berarti 'penghakiman', alternatif itu dipertahankan dalam catatan.
- issue: Ungkapan antropomorfis ἡ ψυχή μου
  choice: Mempertahankan 'jiwa-Ku'.
  alternative: '''Aku berkenan kepadanya'' atau ''hati-Ku berkenan kepadanya'''
  rationale: Teks Yunani secara eksplisit menyebut 'jiwa-Ku'. Mempertahankannya menjaga citra dan daya afektif sumber tanpa menjadikannya pernyataan teknis mengenai susunan hakikat Allah.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami dipadukan dengan sedikit keluhuran gaya untuk menandai kutipan nubuat. Kapitalisasi pada bentuk terikat seperti 'Kupilih', 'Kukasihi', dan 'Roh-Ku' mengikuti kaidah rujukan kepada Allah. Susunan 'jiwa-Ku berkenan' sengaja dipertahankan untuk menjaga citra sumber, dengan ungkapan yang lebih idiomatis diberikan dalam catatan.
