  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: id
  text: Pada waktu itu, Yesus berjalan melalui ladang-ladang gandum pada hari Sabat[a]. Murid-murid-Nya menjadi lapar, lalu mulai memetik bulir-bulir gandum dan memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, secara harfiah “pada hari-hari Sabat”; bentuk jamak ini merupakan ungkapan idiomatis yang berarti “pada hari Sabat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Pada waktu itu
  rationale: Ungkapan ini menandai suatu waktu atau kesempatan dalam alur narasi, bukan waktu menurut jam; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: ἐπορεύθη
  choice: berjalan
  rationale: Dalam konteks perjalanan melewati ladang, 'berjalan' menyampaikan gerak Yesus secara alami tanpa memberi penekanan aspek yang tidak diperlukan.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Walaupun bentuk Yunaninya jamak, ungkapan ini secara idiomatis menunjuk pada hari Sabat; bentuk tunggal paling jelas dalam bahasa Indonesia.
- source_word: διὰ τῶν σπορίμων
  choice: melewati ladang-ladang gandum
  rationale: σπόριμος menunjuk pada lahan yang ditanami, khususnya ladang biji-bijian. 'Ladang-ladang gandum' merupakan ungkapan Indonesia yang jelas dan lazim dalam konteks ini.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Murid-murid-Nya
  rationale: δέ bersifat penghubung ringan di sini; pemisahan menjadi kalimat baru menjaga alur narasi tanpa menciptakan pertentangan yang kuat.
- source_word: ἐπείνασαν
  choice: menjadi lapar
  rationale: Pilihan ini mempertahankan nuansa ingresif aoristus, yaitu mulai timbulnya rasa lapar.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Kata ini menandai permulaan tindakan berikutnya.
- source_word: τίλλειν στάχυας
  choice: memetik bulir-bulir gandum
  rationale: τίλλω berarti mencabut atau memetik dengan tangan, sedangkan στάχυς adalah bulir atau kepala biji-bijian; ungkapan ini tepat dan mudah dipahami.
- source_word: καὶ ἐσθίειν
  choice: dan memakannya
  rationale: Akhiran '-nya' secara alami merujuk kembali kepada bulir-bulir gandum dan membuat koordinasi kedua tindakan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan bentuk jamak σάββασιν
  choice: pada hari Sabat
  alternative: pada hari-hari Sabat
  rationale: Bentuk jamak Yunani ini merupakan pemakaian idiomatis untuk hari Sabat. Terjemahan tunggal menghindari kesan keliru bahwa tindakan tersebut berlangsung pada beberapa hari Sabat, tanpa memasukkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Murid-murid-Nya' mengikuti konvensi ejaan religius Indonesia untuk pronomina yang merujuk kepada Yesus. Istilah 'hari Sabat' dipertahankan karena sudah dikenal luas.
