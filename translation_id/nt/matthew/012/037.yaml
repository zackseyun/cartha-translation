  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: id
  text: Sebab, berdasarkan perkataanmu engkau akan dibenarkan[a], dan berdasarkan perkataanmu engkau akan dinyatakan bersalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan benar,” “dibebaskan,” atau “terbukti benar.” Kata kerja Yunani ini dapat digunakan dalam arti yudisial, yaitu dinyatakan benar atau dibebaskan dalam suatu putusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: berdasarkan
  rationale: Dengan bentuk genitif di sini, ἐκ menyatakan dasar atau bukti bagi putusan. “Berdasarkan” alami dalam bahasa Indonesia dan lebih jelas menyampaikan nuansa yudisial daripada terjemahan harfiah “dari”.
- source_word: γάρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan bagi peringatan sebelumnya tentang ucapan. “Sebab” mempertahankan hubungan logis itu dengan ragam yang wajar dan bermartabat.
- source_word: λόγων
  choice: perkataan
  rationale: Bentuk jamak λόγων menunjuk pada hal-hal yang diucapkan. “Perkataan” mempertahankan kesejajaran pengulangan Yunani dan terdengar alami dalam konteks pertanggungjawaban atas ucapan.
- source_word: σου
  choice: -mu
  rationale: Pronomina genitif ini bersifat posesif dan menerangkan λόγων dalam kedua klausa. Bentuk enklitik “-mu” merupakan padanan Indonesia yang langsung dan alami.
- source_word: δικαιωθήσῃ
  choice: engkau akan dinyatakan benar
  rationale: Bentuk pasif futur dari δικαιόω memiliki arti forensik dalam konteks penghakiman ini. “Dinyatakan benar” menyampaikan tindakan pemberian putusan tanpa mengharuskan pembaca memahami istilah teknis “dibenarkan” dalam arti doktrinal tertentu.
- source_word: καταδικασθήσῃ
  choice: engkau akan dihukum
  rationale: Bentuk pasif futur ini bersifat yudisial dan berlawanan langsung dengan δικαιωθήσῃ. “Dihukum” mempertahankan kontras putusan pengadilan secara jelas; kemungkinan makna “dinyatakan bersalah” dicatat sebagai nuansa dekat.
theological_decisions:
- issue: Makna forensik δικαιόω dalam kaitannya dengan perkataan dan penghakiman
  choice: “Dinyatakan benar,” yakni putusan yang membenarkan seseorang berdasarkan perkataannya sebagai dasar atau bukti dalam penghakiman.
  alternative: “Dibenarkan,” “dibebaskan,” atau “terbukti benar.”
  rationale: Kesejajaran langsung dengan “dihukum” menegaskan latar yudisial. Terjemahan ini mempertahankan makna putusan tanpa memasukkan rumusan doktrinal yang melampaui pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia modern baku dengan ragam bermartabat. “Engkau” dipakai untuk sapaan tunggal sesuai bentuk Yunani, sedangkan pengulangan “berdasarkan perkataanmu” dipertahankan untuk mencerminkan kesejajaran dan tekanan retoris teks sumber.
