  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: id
  text: Sementara Yesus masih berbicara kepada orang banyak, lihatlah, ibu-Nya dan saudara-saudara laki-laki-Nya[a] sedang berdiri di luar, hendak berbicara kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudara-Nya”; istilah Yunani ini berbentuk maskulin jamak dan dalam konteks tertentu dapat digunakan lebih luas bagi kerabat dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Sementara Yesus masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung bersamaan dengan peristiwa utama. Nama “Yesus” dipakai secara alami dalam bahasa Indonesia untuk memperjelas acuan pronomina tanpa mengubah makna.
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: Meskipun bentuk Yunani jamak, ungkapan kolektif “orang banyak” merupakan padanan Indonesia yang alami dan tidak harus menyatakan hanya satu kerumunan.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian pembaca kepada perkembangan baru dalam kisah.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ibu dan saudara-saudara laki-laki-Nya
  rationale: Acuan kepunyaan diterapkan secara alami kepada kedua unsur keluarga. “Saudara-saudara laki-laki” mencerminkan bentuk maskulin jamak ἀδελφοί tanpa menentukan lebih jauh hubungan biologis mereka.
- source_word: εἱστήκεισαν ἔξω
  choice: berdiri di luar
  rationale: Bentuk statif dari ἵστημι menunjukkan keadaan mereka yang sedang berdiri; “di luar” tidak menambahkan lokasi yang tidak dinyatakan dalam ayat.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: berusaha berbicara dengan-Nya
  rationale: ζητέω di sini menyatakan upaya atau maksud yang aktif. “Berbicara dengan” merupakan ungkapan Indonesia yang alami bagi komunikasi yang hendak mereka lakukan.
theological_decisions:
- issue: Hubungan οἱ ἀδελφοί dengan Yesus
  choice: saudara-saudara laki-laki-Nya
  alternative: saudara-saudara-Nya; kerabat-kerabat laki-laki-Nya
  rationale: Bentuk Yunani adalah maskulin jamak dan secara leksikal paling langsung berarti saudara-saudara laki-laki. Terjemahan utama tidak memutuskan apakah mereka saudara kandung atau kerabat dekat, sehingga ketegangan teologis tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lihatlah” mempertahankan daya naratif ἰδού, sedangkan kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
