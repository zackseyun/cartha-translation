  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: id
  text: Semua orang banyak itu takjub dan berkata, “Mungkinkah[b] Dia ini Anak Daud[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Daud” adalah gelar mesianik yang menunjuk kepada pembebas yang dijanjikan dari garis keturunan Daud, yang akan memerintah sebagai raja.
    reason: cross_reference
  - marker: b
    text: Atau, dengan lebih harfiah mencerminkan arah pertanyaannya, “Bukankah Dia ini Anak Daud?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: sangat takjub
  rationale: Bentuk imperfek menggambarkan reaksi ketakjuban yang sedang berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kuatnya reaksi orang banyak.
- source_word: πάντες οἱ ὄχλοι
  choice: semua orang banyak itu
  rationale: Pilihan ini mempertahankan unsur πάντες dan makna kolektif ὄχλοι, sambil tetap lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah plural 'semua kerumunan'.
- source_word: ἔλεγον
  choice: berkata
  rationale: Walaupun bentuk imperfek dapat menyiratkan bahwa mereka terus atau berulang kali mengatakan hal itu, 'berkata' merupakan pengantar ujaran naratif yang alami dan tidak menambahkan penekanan yang tidak pasti.
- source_word: Μήτι
  choice: Mungkinkah
  rationale: Μήτι lazimnya memperkenalkan pertanyaan yang mengharapkan jawaban negatif atau setidaknya menyatakan keraguan. 'Mungkinkah' menjaga nada dugaan yang tercengang tanpa mengubahnya menjadi penyangkalan tegas.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Anak Daud
  rationale: Ungkapan ini dipertahankan sebagai gelar yang sarat makna mesianik, bukan diparafrasakan menjadi 'Mesias'. Kapitalisasi menandai pemakaiannya sebagai gelar dalam konteks ini.
theological_decisions:
- issue: Daya mesianik gelar ὁ υἱὸς Δαυίδ
  choice: Mempertahankan gelar 'Anak Daud' dalam teks utama.
  alternative: Mesias; keturunan Daud yang dijanjikan
  rationale: Teks Yunani memakai gelar itu sendiri. Mempertahankannya menjaga latar historis dan ketegangan teologis teks tanpa menggantikannya dengan tafsiran eksplisit.
- issue: Arah harapan dalam pertanyaan Μήτι
  choice: Menerjemahkan dengan pertanyaan ragu, 'Mungkinkah ...?'
  alternative: Tentunya Dia ini bukan Anak Daud, bukan?
  rationale: Bentuk Yunani condong mengharapkan jawaban negatif, tetapi konteks juga menunjukkan orang banyak sedang bertanya-tanya dalam ketakjuban. Teks utama mempertahankan keterbukaan itu, sedangkan nuansa negatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Dia' dikapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus. Semua penanda catatan kaki dicantumkan dalam teks utama.
