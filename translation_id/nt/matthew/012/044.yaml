  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: id
  text: Lalu roh itu berkata, “Aku akan kembali ke rumahku, dari situ aku keluar.” Ketika ia datang, ia mendapati rumah itu kosong[a], sudah disapu, dan tertata rapi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tidak ditempati.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: dihiasi atau diperindah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: Lalu roh itu berkata
  rationale: τότε menandai tindakan berikutnya dan wajar diterjemahkan “Lalu.” Subjek tersiratnya adalah roh najis dalam konteks sebelumnya; penyebutan “roh itu” memperjelas rujukan dalam bahasa Indonesia. Bentuk kini λέγει merupakan present historis dan secara alami dapat disampaikan dengan bentuk naratif “berkata.”
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Aku akan kembali ke rumahku
  rationale: Mempertahankan arah tindakan dan klaim kepunyaan roh atas “rumah” tanpa menjelaskan metaforanya sebagai orang atau kehidupan.
- source_word: ὅθεν ἐξῆλθον
  choice: yang telah kutinggalkan
  rationale: Secara harfiah berarti “dari mana aku keluar.” Dalam bahasa Indonesia, “rumahku yang telah kutinggalkan” menyampaikan asal keberangkatan secara alami, meskipun citra keluar tidak dinyatakan seharfiah alternatif “tempat aku keluar.”
- source_word: ἐλθὸν εὑρίσκει
  choice: Ketika tiba, ia mendapati
  rationale: Partisip aoris ἐλθὸν menyatakan tindakan yang mendahului εὑρίσκει dan wajar dialihkan menjadi anak kalimat waktu. “Mendapati” merupakan padanan alami bagi εὑρίσκει dalam konteks ini.
- source_word: σχολάζοντα
  choice: kosong
  rationale: Kata ini dapat berarti kosong, lowong, atau tidak ditempati. “Kosong” alami bagi rumah dan tetap membuka kemungkinan bahwa yang dimaksud ialah tidak adanya penghuni; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: σεσαρωμένον
  choice: sudah disapu
  rationale: Partisip perfekt pasif menunjukkan keadaan sebagai hasil tindakan yang telah selesai; “sudah disapu” mempertahankan nuansa hasil tersebut.
- source_word: κεκοσμημένον
  choice: tertata rapi
  rationale: κοσμέω dapat berarti menata, mengatur, menghiasi, atau memperindah. “Tertata rapi” sesuai dengan gambaran kondisi rumah tanpa membatasi makna pada hiasan; kemungkinan “dihiasi” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna metaforis “rumah” dalam perkataan tentang kembalinya roh najis
  choice: Mempertahankan kata “rumah” dalam teks tanpa menggantinya dengan “orang” atau “kehidupan.”
  alternative: Aku akan kembali kepada orang yang telah kutinggalkan.
  rationale: Teks sumber mempertahankan citra rumah. Tidak menjelaskan metafora di dalam terjemahan menjaga gambaran retoris dan menghindari penafsiran yang melampaui ayat.
- issue: Keadaan rumah yang disebut σχολάζοντα
  choice: Menerjemahkan sebagai “kosong” sambil mencatat “tidak ditempati” sebagai alternatif.
  alternative: tidak ditempati
  rationale: Keduanya dimungkinkan secara leksikal. “Kosong” ringkas dan alami, sedangkan catatan kaki menjaga nuansa bahwa rumah itu tersedia atau tanpa penghuni, tanpa memaksakan implikasi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata ganti “ia” merujuk kepada roh itu. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
