revisions:
- from: Lalu roh itu berkata, “Aku akan kembali ke rumahku yang telah kutinggalkan.” Ketika tiba, ia mendapati rumah itu kosong[a], sudah disapu, dan tertata rapi[b].
  to: Lalu roh itu berkata, “Aku akan kembali ke rumahku, dari situ aku keluar.” Ketika ia datang, ia mendapati rumah itu kosong[a], sudah disapu, dan tertata rapi[b].
  rationale: Revisi hanya mengganti bagian yang mengaburkan verba “keluar” dalam teks Yunani. Penyebutan “roh itu” tetap dapat diterima karena subjeknya jelas dari konteks langsung, sedangkan “rumah” dipertahankan sebagai citra teks tanpa penjelasan metaforis tambahan.
