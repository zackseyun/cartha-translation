id: MAT.12.11
reference: Matthew 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: id
  text: Tetapi, Ia berkata kepada mereka, “Siapakah di antara kalian yang mempunyai seekor domba dan, jika domba itu jatuh ke dalam lubang pada hari Sabat,[a] tidak akan memegangnya lalu mengangkatnya keluar?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari-hari Sabat”; bentuk jamak Yunani ini digunakan secara idiomatis untuk hari Sabat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengangkatnya”; kata “keluar” tersirat dari konteks lubang.
    reason: translation_clarity
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Siapa di antara kalian
  rationale: Menyampaikan pertanyaan retoris Yunani secara alami dalam bahasa Indonesia. Kata ἄνθρωπος di sini bersifat representatif dan tidak perlu dinyatakan tersendiri karena sudah tercakup dalam “siapa”.
- source_word: ἕξει πρόβατον ἕν
  choice: mempunyai seekor domba
  rationale: Bentuk futur ἕξει berfungsi dalam gambaran hipotetis dan secara idiomatis dinyatakan dengan bentuk kini. “Seekor” secara alami mempertahankan jumlah satu.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: jika domba itu jatuh
  rationale: Pengulangan “domba itu” memperjelas acuan τοῦτο tanpa menghasilkan pronomina yang janggal dalam bahasa Indonesia.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Bentuk jamak Yunani merupakan ungkapan idiomatis untuk hari Sabat; bentuk tunggal alami dalam bahasa Indonesia dan sesuai dengan konteks perdebatan mengenai Sabat.
- source_word: εἰς βόθυνον
  choice: ke dalam lubang
  rationale: βόθυνος menunjuk pada lubang atau liang; “lubang” cukup luas dan tidak menentukan bentuknya secara berlebihan.
- source_word: οὐχὶ κρατήσει
  choice: tidak akan memegangnya
  rationale: οὐχί menandai pertanyaan yang mengharapkan jawaban positif. Susunan negatif dipertahankan, sementara κρατέω diterjemahkan sebagai tindakan memegang domba itu dengan mantap.
- source_word: καὶ ἐγερεῖ
  choice: dan mengangkatnya keluar
  rationale: ἐγείρω berarti mengangkat atau menaikkan; “keluar” tersirat oleh gambaran domba yang berada di dalam lubang dan membuat kalimat Indonesia jelas serta alami.
theological_decisions:
- issue: Bahasa representatif pada ἄνθρωπος
  choice: Siapa di antara kalian
  alternative: Orang manakah di antara kalian
  rationale: “Siapa” mencakup gagasan orang dalam pertanyaan ini tanpa menambahkan penekanan gender yang tidak wajib secara leksikal dalam bahasa Indonesia, sekaligus mempertahankan bentuk tunggal representatif.
- issue: Bentuk jamak σάββασιν
  choice: pada hari Sabat
  alternative: pada hari-hari Sabat
  rationale: Bentuk jamak tersebut idiomatis dan dalam konteks ini menunjuk pada hari Sabat sebagai latar hukum, bukan pada beberapa hari Sabat tertentu.
- issue: Daya retoris οὐχί
  choice: tidak akan memegangnya dan mengangkatnya keluar?
  alternative: bukankah ia akan memegangnya dan mengangkatnya keluar?
  rationale: Pilihan utama mempertahankan struktur negatif sumber dan tetap jelas mengharapkan jawaban ya, tanpa mengubah pernyataan menjadi rumusan penegasan yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk bentuk jamak ὑμῶν, dan alur pertanyaan retoris dijaga tetap mudah dipahami oleh pembaca umum.
