id: MAT.12.20
reference: Matthew 12:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: id
  text: Buluh yang remuk tidak akan dipatahkannya, dan sumbu yang berasap[a] tidak akan dipadamkannya, sampai dia membuat keadilan menang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rami yang berasap”; rami digunakan sebagai sumbu pelita.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sampai dia membawa penghakiman kepada kemenangan.”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: buluh yang remuk
  rationale: κάλαμος menunjuk pada buluh atau batang buluh, sedangkan συντετριμμένον menggambarkannya sebagai rusak atau remuk, tetapi belum sepenuhnya patah. Ungkapan ini mempertahankan gambaran profetis dan menghindari kesan bahwa buluh itu sudah dipatahkan.
- source_word: οὐ κατεάξει
  choice: tidak akan dipatahkannya
  rationale: κατάγνυμι berarti mematahkan atau meremukkan. Bentuk pasif dengan akhiran pronominal ini alami dalam bahasa Indonesia dan mempertahankan fokus puitis pada buluh.
- source_word: λίνον τυφόμενον
  choice: sumbu yang berasap
  rationale: λίνον secara harfiah adalah rami atau linen, tetapi dalam gambaran pelita menunjuk pada sumbu yang dibuat dari bahan itu. τυφόμενον menggambarkan sumbu yang mengeluarkan asap dan hampir padam.
- source_word: οὐ σβέσει
  choice: tidak akan dipadamkannya
  rationale: σβέννυμι berarti memadamkan. Pilihan ini jelas, wajar, dan tepat bagi sumbu pelita.
- source_word: ἕως ἂν
  choice: sampai
  rationale: Konstruksi ini menunjuk pada batas atau tujuan pada masa mendatang; 'sampai' adalah padanan Indonesia yang ringkas dan alami.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: membuat ... menang
  rationale: Secara harfiah ungkapan ini berarti membawa sesuatu menuju kemenangan. 'Membuat ... menang' menyampaikan hasil yang berhasil secara alami tanpa menghilangkan daya tuju frasa Yunani.
- source_word: τὴν κρίσιν
  choice: keadilan
  rationale: κρίσις dapat berarti penghakiman atau keadilan. Dalam latar kutipan Yesaya tentang Sang Hamba, 'keadilan' paling baik menyampaikan penegakan tatanan yang benar, sementara alternatif 'penghakiman' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna κρίσις dalam kutipan tentang Sang Hamba
  choice: keadilan
  alternative: penghakiman
  rationale: Konteks menggambarkan karya Sang Hamba yang lembut tetapi efektif dalam menegakkan apa yang benar, bukan hanya menjatuhkan vonis. Namun, kemungkinan makna yudisial tetap dipertahankan dalam catatan kaki.
- issue: Tingkat keliteralannya dalam gambaran pelita
  choice: sumbu yang berasap
  alternative: rami yang berasap
  rationale: Bahasa Yunani menyebut bahan rami, tetapi benda yang dimaksud dalam konteks pelita adalah sumbu. Teks utama menyampaikan referennya dengan jelas bagi pembaca modern, sedangkan bentuk harfiahnya dicatat.
- issue: Hubungan εἰς νῖκος dengan κρίσις
  choice: membuat keadilan menang
  alternative: membawa penghakiman kepada kemenangan
  rationale: Pilihan utama menghasilkan bahasa Indonesia yang alami dan mempertahankan gagasan kemenangan. Catatan kaki menjaga bentuk yang lebih formal serta alternatif leksikal 'penghakiman'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan untuk menjaga irama kutipan profetis, sedangkan klausa terakhir dibuat idiomatis agar mudah dipahami.
