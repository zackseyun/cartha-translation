id: MAT.12.6
reference: Matthew 12:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: id
  text: Namun, Aku berkata kepadamu bahwa sesuatu yang lebih besar daripada Bait Allah ada di sini[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seseorang yang lebih besar daripada Bait Allah ada di sini” atau “yang lebih besar daripada Bait Allah ada di sini.” Bahasa Yunani memakai bentuk netral (“lebih besar”), sehingga rujukannya secara tata bahasa tidak dinyatakan.
    reason: alternative_reading
  - marker: b
    text: Atau, “di tempat ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: Rumus sapaan langsung ini diterjemahkan secara wajar dan bermartabat. δέ menyatakan pertentangan ringan dengan uraian sebelumnya, sehingga “Namun” sesuai tanpa melebih-lebihkan kontras.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi perkataan Yesus dan mempertahankan hubungan sintaksis secara jelas dalam bahasa Indonesia.
- source_word: τοῦ ἱεροῦ
  choice: daripada Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah, bukan secara khusus ruang kudus bagian dalam; “Bait Allah” merupakan istilah Indonesia yang alami dan tepat dalam konteks ini.
- source_word: μεῖζόν
  choice: sesuatu yang lebih besar
  rationale: Bentuk komparatif tunggal netral dipakai secara substantival tanpa menyebut rujukannya. “Sesuatu yang lebih besar” mempertahankan bentuk netral dan ketidaktersuratan rujukan dalam bahasa Yunani.
- source_word: ἐστιν
  choice: ada
  rationale: Dalam konstruksi lokatif dengan ὧδε, “ada” menghasilkan ungkapan Indonesia yang alami sambil tetap menyampaikan kopula kini.
- source_word: ὧδε
  choice: di sini
  rationale: Padanan lokatif yang ringkas dan alami; alternatif “di tempat ini” dicatat karena mungkin memberi penekanan tempat yang lebih nyata.
theological_decisions:
- issue: Identitas rujukan yang tidak disebutkan dalam bentuk netral μεῖζόν
  choice: “sesuatu yang lebih besar” dalam teks utama
  alternative: “seseorang yang lebih besar” atau “yang lebih besar”
  rationale: Bahasa Yunani memakai bentuk tunggal netral, bukan maskulin. Walaupun konteks kuat mengarah kepada Yesus dan kewenangan-Nya, teks utama tidak mempersempit rujukan melampaui bentuk sumber, sehingga ketegangan teologisnya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi “Aku” mengikuti kebiasaan luas dalam teks Alkitab Indonesia untuk ucapan Yesus, tanpa menambahkan isi yang tidak terdapat dalam sumber.
