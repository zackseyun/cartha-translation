  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Yunani dengan setia: δέ ditangkap secara wajar oleh “Namun,”, λέγω ... ὑμῖν oleh “Aku berkata kepadamu,” dan ὅτι oleh “bahwa.” “Bait Allah” tepat untuk τοῦ ἱεροῦ dalam konteks ini. “Sesuatu yang lebih besar” dengan baik mempertahankan bentuk netral substantival μεῖζόν dan tidak mengidentifikasi rujukannya secara berlebihan. “Ada di sini” menyampaikan ἐστιν ὧδε secara alami.'
  naturalness: Bahasanya baku, jelas, dan bernada sesuai untuk ucapan Yesus dalam Alkitab Indonesia modern. Susunan “sesuatu yang lebih besar daripada Bait Allah ada di sini” dapat diterima dan mempertahankan penekanan pada subjek yang tidak dinyatakan secara spesifik.
  terminology: “Bait Allah” adalah istilah mapan dan tepat. Kapitalisasi “Aku” selaras dengan kebiasaan luas dalam Alkitab Indonesia dan tidak mengubah makna sumber. Catatan a secara tepat menerangkan bentuk netral Yunani serta mempertahankan kemungkinan rujukan personal tanpa menjadikannya pembacaan utama. Catatan b memberikan alternatif yang sah untuk ὧδε.
