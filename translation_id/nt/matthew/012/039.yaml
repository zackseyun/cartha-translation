  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: id
  text: Namun, Ia menjawab mereka, “Angkatan yang jahat dan pezina[a] mencari tanda, tetapi kepada angkatan itu tidak akan diberikan tanda selain tanda Yunus, sang nabi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “pezina” kemungkinan juga membangkitkan gambaran para nabi tentang ketidaksetiaan umat kepada Allah, selain arti harfiahnya mengenai ketidaksetiaan seksual.
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan “tanda Nabi Yunus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ia menjawab mereka
  rationale: Ungkapan partisip + verba finit ini merupakan rumusan naratif yang lazim. Dalam bahasa Indonesia modern, “menjawab mereka” menyampaikan kedua unsur itu secara wajar tanpa pengulangan kaku “menjawab dan berkata”.
- source_word: Γενεὰ
  choice: angkatan
  rationale: “Angkatan” menunjuk kepada kelompok orang sezaman yang dicirikan secara moral dan mempertahankan daya kolektif nomina tunggal Yunani.
- source_word: πονηρὰ
  choice: jahat
  rationale: “Jahat” merupakan padanan langsung, jelas, dan berbobot bagi kecaman moral dalam konteks ini.
- source_word: μοιχαλὶς
  choice: berzina
  rationale: Pilihan ini mempertahankan gambaran tajam tentang perzinaan dan tidak meratakan kemungkinan gaung profetis tentang ketidaksetiaan terhadap perjanjian menjadi sekadar “tidak setia”.
- source_word: σημεῖον
  choice: tanda
  rationale: “Tanda” mempertahankan keluasan makna istilah Yunani; menambahkan “mukjizat” akan menentukan lebih banyak daripada yang dinyatakan teks.
- source_word: ἐπιζητεῖ
  choice: mencari
  rationale: “Mencari” menyampaikan arti verba secara lugas tanpa menambahkan nuansa “menuntut” yang tidak harus dinyatakan secara eksplisit.
- source_word: δοθήσεται
  choice: tidak akan diberikan
  rationale: Bentuk pasif mendatang dipertahankan secara alami dalam bahasa Indonesia.
- source_word: αὐτῇ
  choice: kepada angkatan itu
  rationale: Pengulangan rujukan menghasilkan bahasa Indonesia yang jelas dan alami, sebab pronomina feminin Yunani merujuk kembali kepada “angkatan” dan tidak memiliki padanan gender yang serupa dalam bahasa Indonesia.
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam konstruksi negatif ini, “selain” secara alami menyatakan satu-satunya pengecualian.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: tanda Yunus, sang nabi
  rationale: Padanan ini mengikuti hubungan frasa Yunani dengan cukup dekat, mengidentifikasi Yunus sebagai nabi, dan membiarkan hakikat tanda tersebut dijelaskan oleh konteks berikutnya.
theological_decisions:
- issue: Makna sebutan μοιχαλὶς dalam kecaman Yesus
  choice: Mempertahankan istilah konkret “berzina” dalam teks utama.
  alternative: tidak setia
  rationale: Istilah Yunani dapat membangkitkan gambaran profetis tentang ketidaksetiaan umat kepada Allah sekaligus tetap menjadi kecaman moral. Terjemahan tidak membatasi kata itu hanya pada satu sisi maknanya.
- issue: Hakikat “tanda Yunus”
  choice: Membiarkan frasa itu tanpa penjelasan interpretatif dalam teks utama.
  alternative: tanda seperti pengalaman Yunus
  rationale: Ayat ini memperkenalkan ungkapan yang diterangkan lebih lanjut oleh konteks sesudahnya. Menjelaskannya di sini akan memilih suatu tafsiran terlalu dini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Angkatan” dipilih karena tetap mudah dipahami serta mempertahankan nuansa kolektif dan corak biblis tanpa menjadi kuno. Koma pada “Yunus, sang nabi” memperjelas bahwa “sang nabi” menerangkan Yunus.
