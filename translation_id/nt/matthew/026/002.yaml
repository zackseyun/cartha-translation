  source_fidelity: 'Terjemahan mempertahankan seluruh unsur utama teks Yunani: sapaan jamak "Kalian tahu," penanda waktu yang idiomatis "dua hari lagi," Paskah yang akan tiba, gelar "Anak Manusia," serta παραδίδοται sebagai "akan diserahkan" tanpa mempersempitnya menjadi pengkhianatan oleh Yudas. Frasa "untuk disalibkan" menyampaikan tujuan/hasil dari εἰς τὸ σταυρωθῆναι secara tepat.'
  naturalness: Kalimat ini alami dalam bahasa Indonesia modern dan tetap memiliki register yang layak untuk narasi Injil. "Dua hari lagi" adalah idiom Indonesia yang wajar bagi rentang waktu menjelang Paskah; "akan tiba" juga jelas dalam konteks perayaan yang mendekat.
  terminology: '"Paskah" dan "Anak Manusia" adalah istilah mapan dan tepat. "Diserahkan" secara baik mempertahankan keluasan παραδίδοται. Catatan kaki secara tepat memberi "dikhianati" sebagai alternatif kontekstual, bukan sebagai pembatasan makna utama.'
