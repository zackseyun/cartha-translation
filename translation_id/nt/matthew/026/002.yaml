id: MAT.26.2
reference: Matthew 26:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: id
  text: Kalian tahu bahwa dua hari lagi Paskah akan tiba, dan Anak Manusia akan diserahkan untuk disalibkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan dikhianati.” Kata kerja Yunani ini dapat berarti “dikhianati”, tetapi maknanya lebih luas, yaitu “diserahkan”.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Kalian tahu
  rationale: Bentuk orang kedua jamak dengan makna kini; “kalian” menyatakan jamak secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: μετὰ δύο ἡμέρας
  choice: dua hari lagi
  rationale: μετά dengan akusatif menyatakan waktu sesudah dua hari; idiom Indonesia “dua hari lagi” menyampaikan maksud temporalnya secara alami.
- source_word: τὸ πάσχα
  choice: Paskah
  rationale: πάσχα menunjuk pada perayaan Paskah Yahudi; nama yang sudah mapan ini cukup tanpa menambahkan kata “perayaan” yang tidak eksplisit.
- source_word: γίνεται
  choice: akan tiba
  rationale: Dalam konteks ini γίνομαι menyatakan datang atau berlangsungnya Paskah yang sudah dekat; “akan tiba” alami dan mempertahankan nuansa mendatang.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi sebutan diri Yesus yang mempertahankan gema biblis dan teologisnya.
- source_word: παραδίδοται
  choice: akan diserahkan
  rationale: Bentuk kini pasif Yunani dipakai untuk peristiwa yang segera dan pasti terjadi. “Diserahkan” mempertahankan cakupan makna yang lebih luas daripada “dikhianati” dan tidak menentukan pelaku yang tidak dinyatakan.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: untuk disalibkan
  rationale: Konstruksi εἰς dengan infinitif artikular menyatakan tujuan atau hasil; padanan ini langsung dan jelas.
theological_decisions:
- issue: Makna παραδίδοται dalam nubuat penderitaan
  choice: akan diserahkan
  alternative: akan dikhianati
  rationale: Konteks dekat mencakup pengkhianatan Yudas, tetapi verba Yunani lebih luas dan juga dapat mencakup tindakan menyerahkan Yesus kepada pihak berwenang. Terjemahan ini menjaga ketegangan tersebut tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipilih untuk menandai orang kedua jamak; susunan kalimat dibuat alami tanpa menghilangkan hubungan erat antara tibanya Paskah dan penyerahan Anak Manusia.
