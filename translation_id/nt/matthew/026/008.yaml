  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: id
  text: Namun, ketika murid-murid melihat hal itu, mereka menjadi geram dan berkata, “Untuk apa pemborosan ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoristus dipahami secara temporal. Objek tidak dinyatakan dalam bahasa Yunani, tetapi dilengkapi sebagai “hal itu” untuk menunjuk pada tindakan pengurapan sebelumnya dan menghasilkan bahasa Indonesia yang alami.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan kontras ringan antara tindakan perempuan itu dan reaksi negatif para murid.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dalam narasi Injil; kata “-Nya” tidak ditambahkan karena tidak dinyatakan dalam teks Yunani.
- source_word: ἠγανάκτησαν
  choice: menjadi geram
  rationale: Mengungkapkan ketidaksenangan kuat dan kemarahan bernada moral, lebih kuat daripada sekadar “kesal”.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini dialihkan menjadi verba koordinatif agar hubungan dengan reaksi mereka terdengar alami dalam bahasa Indonesia.
- source_word: Εἰς τί
  choice: Untuk apa
  rationale: Mempertahankan nuansa pertanyaan mengenai tujuan atau gunanya, bukan hanya sebab.
- source_word: ἡ ἀπώλεια αὕτη
  choice: pemborosan ini
  rationale: Dalam konteks minyak wangi mahal yang dicurahkan, ἀπώλεια menunjuk pada sesuatu yang mereka nilai terbuang atau disia-siakan; “pemborosan” merupakan ungkapan Indonesia yang tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur Yunani dipertahankan sejauh wajar, sementara partisip dialihkan secara idiomatis. Tidak diperlukan catatan kaki karena “Untuk apa” langsung mempertahankan nuansa tujuan dalam Εἰς τί.
