id: MAT.26.58
reference: Matthew 26:58
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: id
  text: Namun, Petrus mengikuti Dia dari jauh sampai ke halaman kediaman imam besar. Setelah masuk ke dalam, ia duduk bersama para petugas[a] untuk melihat kesudahannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pelayan,” “para pembantu,” atau “para penjaga.” Kata Yunani ὑπηρέται dapat menunjuk para bawahan atau pembantu yang menjalankan tugas resmi; peran persis mereka di sini tidak dijelaskan.
    reason: lexical_alternative
  - marker: b
    text: Atau “akhirnya” atau “hasil akhirnya.” Kata Yunani τὸ τέλος secara harfiah dapat berarti “akhir,” dan dalam konteks ini dapat menunjuk pada hasil dari apa yang akan terjadi pada Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; dalam bahasa Indonesia, verba ini secara alami menyampaikan tindakan tersebut tanpa penanda progresif tambahan.
- source_word: ἀπὸ μακρόθεν
  choice: dari jauh
  rationale: Ungkapan Indonesia yang alami dan tepat untuk jarak fisik yang dipertahankan Petrus.
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: sampai ke halaman kediaman imam besar
  rationale: ἕως menyatakan batas gerak, sedangkan αὐλή dalam konteks ini adalah halaman tertutup yang merupakan bagian dari kediaman imam besar.
- source_word: εἰσελθὼν ἔσω
  choice: setelah masuk ke dalam
  rationale: Menyatakan bahwa tindakan partisip ini mendahului tindakan utama dan tetap mempertahankan penegasan ἔσω, 'ke dalam'.
- source_word: ἐκάθητο
  choice: ia duduk
  rationale: Imperfek menunjukkan keadaan yang berlangsung; bentuk sederhana 'duduk' paling alami dalam bahasa Indonesia dan dapat mencakup keadaan tersebut.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: bersama para petugas
  rationale: ὑπηρέται menunjuk orang-orang bawahan yang melayani dalam kapasitas resmi; 'petugas' cukup luas untuk tidak mempersempit mereka menjadi pelayan rumah tangga atau penjaga bersenjata.
- source_word: ἰδεῖν τὸ τέλος
  choice: untuk melihat kesudahannya
  rationale: Infinitif menyatakan tujuan. 'Kesudahannya' mempertahankan hubungan leksikal dengan 'akhir' sekaligus dapat dipahami sebagai hasil akhir peristiwa.
theological_decisions:
- issue: Rujukan pronomina αὐτῷ
  choice: Dia
  alternative: Yesus
  rationale: Teks sumber memakai pronomina, dan konteks sebelumnya menjelaskan bahwa rujukannya adalah Yesus; pronomina dipertahankan agar tidak menambahkan nama yang tidak terdapat dalam ayat ini.
- issue: Makna τὸ τέλος
  choice: kesudahannya
  alternative: hasil akhirnya
  rationale: Pilihan ini mempertahankan kemungkinan makna literal 'akhir' dan makna kontekstual 'hasil', tanpa menentukan lebih jauh sifat kesudahan yang sedang dinantikan Petrus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam teks Yunani. Istilah 'petugas' dan 'kesudahannya' dipilih untuk menjaga keluasan makna sumber; alternatif penting dicatat dalam catatan kaki.
