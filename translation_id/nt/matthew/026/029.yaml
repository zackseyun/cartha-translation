  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: id
  text: 'Namun, Aku berkata kepada kalian: Mulai sekarang, Aku sama sekali tidak akan minum dari hasil pohon anggur ini sampai hari itu, ketika Aku meminumnya sebagai sesuatu yang baru[a] bersama kalian dalam Kerajaan Bapa-Ku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami sebagai “kembali” atau “dengan cara yang baru”. Kata sifat Yunani yang dipakai dapat menyatakan kebaruan dalam jenis atau kualitas dan mungkin menyiratkan bahwa Ia akan meminumnya dengan cara baru dalam Kerajaan yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepada kalian
  rationale: δέ menandai peralihan yang agak kontras tanpa menyatakan pertentangan keras. Bentuk ὑμῖν jamak, sehingga diterjemahkan dengan “kalian”.
- source_word: οὐ μὴ πίω
  choice: Aku sama sekali tidak akan minum lagi
  rationale: οὐ μή dengan subjungtif aoris menyatakan penyangkalan masa depan yang tegas. “Sama sekali tidak akan” mempertahankan penekanannya, sedangkan “lagi” sesuai dengan batas waktu yang dimulai saat ini.
- source_word: ἀπ’ ἄρτι
  choice: Mulai sekarang
  rationale: Frasa ini menetapkan saat sekarang sebagai titik awal dan diterjemahkan secara idiomatis dalam bahasa Indonesia modern.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: dari hasil pokok anggur ini
  rationale: γένημα berarti hasil atau produk. Terjemahan ini mempertahankan ungkapan sumber dan tidak langsung menggantinya dengan “anggur” sebagai nama minuman.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: sampai hari itu
  rationale: Demonstrativa ἐκείνης menunjuk kepada suatu hari mendatang yang tertentu dan tetap dipertahankan.
- source_word: ὅταν αὐτὸ πίνω
  choice: ketika Aku meminumnya
  rationale: ὅταν dengan subjungtif menunjuk kepada peristiwa mendatang pada waktunya; αὐτό merujuk kembali kepada hasil pokok anggur atau isi cawan.
- source_word: καινὸν
  choice: dalam keadaan baru
  rationale: καινόν menerangkan αὐτό dan dapat menunjuk kepada kebaruan dalam sifat atau kualitas. Ungkapan ini mempertahankan kata “baru” tanpa menentukan secara sempit bentuk kebaruannya.
- source_word: μεθ’ ὑμῶν
  choice: bersama kalian
  rationale: Terjemahan ini menyatakan kebersamaan dan sekaligus memperlihatkan bahwa kata ganti sumber berbentuk jamak.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: dalam Kerajaan Bapa-Ku
  rationale: Bentuk ini alami dan khidmat dalam bahasa Indonesia serta mempertahankan sebutan Yesus “Bapa-Ku”.
theological_decisions:
- issue: Apakah isi cawan harus disebut secara eksplisit sebagai minuman anggur
  choice: Ungkapan “hasil pokok anggur” dipertahankan dalam teks utama.
  alternative: minuman anggur
  rationale: Teks Yunani memakai γένημα τῆς ἀμπέλου, bukan οἶνος. Mempertahankan ungkapan itu mengikuti bukti sumber dan tidak menambahkan kekhususan sakramental atau simbolis yang tidak dinyatakan secara langsung.
- issue: Makna καινὸν dalam perjamuan Kerajaan yang akan datang
  choice: “dalam keadaan baru” dipakai tanpa menjelaskan lebih lanjut jenis kebaruannya.
  alternative: kembali; dengan cara yang baru
  rationale: Kata sifat tersebut dapat menyiratkan kebaruan dalam jenis atau kualitas, dan dalam konteks ini mungkin juga dipahami sebagai minum kembali atau dengan cara baru. Teks utama mempertahankan ketegangan itu, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipilih agar bentuk jamak ὑμῖν/ὑμῶν terlihat jelas. Kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
