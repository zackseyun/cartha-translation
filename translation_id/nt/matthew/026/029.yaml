  to: 'Namun, Aku berkata kepada kalian: Mulai sekarang, Aku sama sekali tidak akan minum dari hasil pohon anggur ini sampai hari itu, ketika Aku meminumnya sebagai sesuatu yang baru[a] bersama kalian dalam Kerajaan Bapa-Ku.'
