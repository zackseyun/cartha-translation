base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: id
  text: Orang-orang yang telah menangkap Yesus membawa-Nya pergi kepada Kayafas, imam besar. Di sana, para ahli Taurat dan tua-tua telah berkumpul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah dikumpulkan.” Bentuk kata kerja Yunani di sini dapat dipahami secara pasif (“telah dikumpulkan”) atau sebagai peristiwa intransitif (“telah berkumpul”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: Orang-orang yang telah menangkap
  rationale: Artikel dengan partisip diterjemahkan sebagai frasa substantival. δέ hanya melanjutkan alur dan tidak perlu dinyatakan dengan kata penghubung khusus. Bentuk «telah menangkap» menunjukkan tindakan yang mendahului tindakan utama tanpa memakai konstruksi partisip yang kaku.
- source_word: ἀπήγαγον
  choice: membawa dia
  rationale: Dalam konteks penahanan, ἀπάγω menyatakan membawa seseorang pergi menuju tempat atau orang lain. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak disebutkan.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: kepada Kayafas, imam besar
  rationale: πρός dengan akusatif menunjukkan arah menuju seseorang, sedangkan τὸν ἀρχιερέα merupakan aposisi yang menyebut jabatan Kayafas.
- source_word: οἱ γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, γραμματεῖς menunjuk para ahli hukum Taurat; padanan ini lebih jelas bagi pembaca Indonesia masa kini daripada «ahli-ahli kitab» atau «juru tulis».
- source_word: οἱ πρεσβύτεροι
  choice: tua-tua
  rationale: Istilah ini menunjuk para pemimpin yang diakui dalam masyarakat Yahudi. «Tua-tua» mempertahankan sebutan kelompok tersebut tanpa mempersempitnya menjadi jabatan modern tertentu.
- source_word: συνήχθησαν
  choice: telah berkumpul
  rationale: 'Aoristus pasif ini dalam konteks dapat dipahami sebagai peristiwa intransitif: mereka sudah berkumpul ketika Yesus dibawa ke sana. «Telah berkumpul» menyampaikan urutan naratif itu secara alami.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Yunani dibagi menjadi dua kalimat agar ὅπου dapat dinyatakan secara alami dengan «Di sana» tanpa memberi kesan bahwa kata «tempat» menerangkan Kayafas. Kata ganti «dia» ditulis dengan huruf kecil sesuai ejaan umum dan untuk tidak memasukkan konvensi editorial teologis ke dalam terjemahan.
