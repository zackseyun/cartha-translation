  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: id
  text: 'Namun, Yesus tetap diam. Lalu imam besar itu berkata kepada-Nya, “Aku menuntut Engkau menjawab di bawah sumpah demi Allah yang hidup[b]: katakanlah kepada kami apakah Engkau adalah Mesias[a], Anak Allah.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Christos di sini berfungsi sebagai gelar dan berarti sosok yang diurapi.
    reason: alternative_reading
  - marker: b
    text: Atau “Aku mengadjurasikan Engkau demi Allah yang hidup.” Ungkapan Yunani ini adalah rumusan adjurasi yang khidmat, yang menuntut jawaban di bawah sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: tetap diam
  rationale: Bentuk imperfek menunjukkan bahwa Yesus terus berdiam diri; “tetap diam” menyampaikan aspek berkelanjutan itu secara alami.
- source_word: ἀρχιερεὺς
  choice: imam besar
  rationale: Istilah baku dan tepat bagi jabatan imam tertinggi Yahudi dalam konteks persidangan ini.
- source_word: Ἐξορκίζω σε
  choice: Aku mengikat Engkau dengan sumpah
  rationale: Ungkapan ini menyampaikan tindakan adjurasi yang khidmat dan bersifat yudisial, bukan tindakan pengusiran roh, dengan bahasa Indonesia yang dapat dipahami.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: demi Allah yang hidup
  rationale: Dalam rumusan adjurasi ini, frasa tersebut menyatakan dasar atau Pribadi yang diseru dalam sumpah; “demi Allah yang hidup” merupakan ungkapan Indonesia yang wajar dan khidmat.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: katakanlah kepada kami
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan isi tuntutan sang imam besar; bentuk imperatif ini alami dan mempertahankan desakannya.
- source_word: ὁ χριστὸς
  choice: Mesias
  rationale: Dengan artikel, istilah ini berfungsi sebagai gelar bagi sosok yang diurapi dan dinantikan, bukan sebagai nama diri; “Mesias” mempertahankan latar Yahudinya.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Terjemahan langsung ini mempertahankan gelar kristologis tersebut tanpa memperlemah atau memperluas maknanya.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Namun, Yesus
  rationale: δέ menandai kontras ringan dengan tuduhan atau kesaksian sebelumnya; “Namun” menyampaikan peralihan itu dengan wajar.
theological_decisions:
- issue: Penerjemahan Χριστός dalam pertanyaan kristologis langsung
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pertanyaan imam besar, kata itu jelas berfungsi sebagai gelar bagi sosok yang diurapi. Bentuk “Kristus” dipertahankan sebagai padanan alternatif dalam catatan kaki.
- issue: Daya ungkapan Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Rumus adjurasi atau sumpah yang khidmat
  alternative: Perintah biasa tanpa daya sumpah
  rationale: Ungkapan tersebut secara resmi menyerukan Allah dan sesuai dengan suasana pengadilan. “Aku mengikat Engkau dengan sumpah” mempertahankan daya forensik dan kekhidmatannya tanpa mengartikannya sebagai pengusiran roh.
- issue: Hubungan antara gelar “Mesias” dan “Anak Allah”
  choice: Mempertahankan keduanya sebagai dua sebutan yang berdampingan
  alternative: Menafsirkan sebutan kedua sebagai penjelasan penuh atau persamaan eksplisit dari sebutan pertama
  rationale: Teks Yunani menempatkan kedua gelar itu berdampingan tetapi tidak menjelaskan secara eksplisit hubungan logisnya; terjemahan tidak boleh menyelesaikan ketegangan tersebut secara diam-diam.
translation_notes:
  register: 'Bahasa Indonesia modern, baku, dan khidmat. Sapaan kepada Yesus memakai huruf kapital menurut kelaziman penerbitan Alkitab Indonesia. Tanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya: [a] sesudah “Mesias” dan [b] sesudah seluruh ucapan yang memuat rumus sumpah.'
