  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: id
  text: Setelah Yesus selesai menyampaikan semua perkataan itu, Ia berkata kepada murid-murid-Nya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Setelah
  rationale: Ungkapan naratif bercorak Semitis ini memperkenalkan peralihan waktu. Dalam bahasa Indonesia modern, “Setelah” menyampaikan urutan peristiwa secara alami tanpa mempertahankan ungkapan kaku “Dan terjadilah ketika”.
- source_word: ἐτέλεσεν
  choice: selesai menyampaikan
  rationale: Kata kerja ini menyatakan bahwa tindakan berbicara telah dituntaskan sebelum Yesus berkata kepada para murid. Tambahan “menyampaikan” membuat hubungan dengan “perkataan” alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: πάντας τοὺς λόγους τούτους
  choice: semua perkataan itu
  rationale: “Perkataan” mempertahankan makna λόγους serta fungsi rumusan ini sebagai penutup rangkaian pengajaran; “itu” merujuk kepada perkataan yang baru saja disampaikan.
- source_word: εἶπεν
  choice: Ia berkata
  rationale: Padanan naratif langsung bagi λέγω dan tidak menambahkan nuansa yang tidak dinyatakan dalam teks Yunani.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Bentuk jamak serta unsur kepunyaan αὐτοῦ dipertahankan. “Murid” merupakan padanan baku dan wajar bagi μαθητής.
