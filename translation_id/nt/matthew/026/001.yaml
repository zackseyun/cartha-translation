  source_fidelity: Terjemahan mempertahankan urutan temporal bahwa Yesus terlebih dahulu menuntaskan seluruh perkataan tersebut, lalu berbicara kepada murid-murid-Nya. “Setelah” adalah padanan Indonesia yang alami untuk rumusan naratif Καὶ ἐγένετο ὅτε dalam konteks ini, tanpa mengubah hubungan waktunya. “Selesai menyampaikan semua perkataan itu” menyampaikan makna ἐτέλεσεν πάντας τοὺς λόγους τούτους dengan baik.
  naturalness: Kalimatnya alami, jelas, dan sesuai dengan ragam Alkitab bahasa Indonesia modern. Susunan “Setelah ..., Ia berkata kepada ...” lancar dan tepat untuk pembukaan yang berlanjut pada ayat berikutnya.
  terminology: “Murid-murid-Nya” dengan tepat menerjemahkan τοῖς μαθηταῖς αὐτοῦ serta mempertahankan bentuk jamak dan kepunyaan. “Perkataan” merupakan padanan yang layak untuk λόγοι dalam formula penutup pengajaran Matius. Kapitalisasi “Ia” dan “-Nya” konsisten dengan konvensi editorial yang dinyatakan.
