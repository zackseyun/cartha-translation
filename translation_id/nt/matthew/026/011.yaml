  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: id
  text: Sebab orang-orang miskin[a] selalu ada bersama kalian, tetapi Aku tidak selalu ada bersama kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum miskin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: selalu
  rationale: Adverbia ini menyatakan keberadaan atau ketersediaan yang terus-menerus. Pengulangan “selalu” dalam kedua klausa dipertahankan agar kontrasnya tetap jelas.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberi alasan bagi pernyataan sebelumnya. “Sebab” secara ringkas dan wajar mempertahankan hubungan penjelas tersebut.
- source_word: τοὺς πτωχοὺς
  choice: orang-orang miskin
  rationale: Bentuk jamak ini merujuk secara kolektif kepada orang yang hidup dalam kemiskinan. “Orang-orang miskin” jelas, alami, dan tidak mengubah mereka menjadi gagasan abstrak.
- source_word: ἔχετε
  choice: ada bersama kalian
  rationale: Dalam konteks ini, verba tersebut menyatakan kehadiran atau keberadaan dalam jangkauan para murid, bukan kepemilikan. Ungkapan “ada bersama kalian” menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: μεθ’ ἑαυτῶν
  choice: bersama kalian
  rationale: Frasa ini menunjukkan kehadiran di tengah atau bersama para murid. “Bersama kalian” alami dan mempertahankan relasi yang dimaksud.
- source_word: ἐμὲ
  choice: Aku
  rationale: Pronomina ini merujuk langsung kepada Yesus. Huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada-Nya, tanpa menambahkan makna pada teks Yunani.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai kontras antara keberadaan orang-orang miskin yang terus berlanjut dan keberadaan Yesus bersama para murid yang tidak selalu berlangsung.
- source_word: οὐ πάντοτε
  choice: tidak selalu
  rationale: Ungkapan negatif ini mempertahankan kontras langsung dengan πάντοτε pada klausa pertama tanpa menentukan lebih jauh sifat ketidakhadiran yang dimaksud.
theological_decisions:
- issue: Implikasi kehadiran Yesus
  choice: Ayat ini mengontraskan keberadaan orang-orang miskin yang terus berlanjut dengan terbatasnya waktu kehadiran Yesus bersama para murid.
  alternative: Ayat ini dapat dibaca seolah-olah meremehkan kepedulian terhadap orang miskin.
  rationale: Teks Yunani menyatakan kontras temporal, bukan penilaian moral yang merendahkan orang miskin. Terjemahan mempertahankan ketegangan itu tanpa memasukkan penolakan terhadap belas kasih atau bantuan kepada mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena sapaan Yunani berbentuk jamak dan ditujukan kepada para murid. Susunan kedua klausa dibuat sejajar untuk mempertahankan pengulangan dan kontras dalam teks sumber.
