  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: id
  text: Tetapi setelah Aku dibangkitkan[a], Aku akan mendahului kalian ke Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “setelah Aku bangkit.” Secara lebih harfiah, bahasa Yunani memakai bentuk pasif: “setelah Aku dibangkitkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Tetapi setelah
  rationale: μετά dengan infinitif berartikel menyatakan urutan waktu, sedangkan δέ memberi kontras ringan dengan perkataan sebelumnya.
- source_word: τὸ ἐγερθῆναί με
  choice: Aku dibangkitkan
  rationale: Bentuk infinitif aoris pasif dipertahankan. Ungkapan ini menyatakan bahwa Yesus dibangkitkan tanpa menyebutkan pelakunya secara eksplisit.
- source_word: προάξω
  choice: Aku akan mendahului
  rationale: προάγω di sini berarti pergi lebih dahulu atau berada di depan. 'Mendahului' alami dalam bahasa Indonesia dan tidak menambahkan gagasan kepemimpinan yang tidak dinyatakan secara pasti.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Kata ganti orang kedua jamak diterjemahkan 'kalian' agar jumlah jamaknya jelas dalam bahasa Indonesia.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: εἰς menunjukkan gerak menuju suatu tempat; 'ke Galilea' merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Bentuk pasif dalam ungkapan kebangkitan ἐγερθῆναί
  choice: setelah Aku dibangkitkan
  alternative: setelah Aku bangkit
  rationale: Terjemahan utama mempertahankan bentuk pasif Yunani dan kemungkinan tersiratnya tindakan ilahi tanpa menyatakan pelaku yang tidak disebutkan dalam teks. Bentuk aktif yang alami dicantumkan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' memperjelas bahwa Yesus berbicara kepada lebih dari satu murid; bentuk pasif 'dibangkitkan' mempertahankan susunan sumber Yunani.
