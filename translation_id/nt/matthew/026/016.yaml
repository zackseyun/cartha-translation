  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: id
  text: Sejak saat itu, ia mencari kesempatan untuk menyerahkan Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhianati Yesus.” Kata kerja Yunani secara lebih harfiah berarti “menyerahkan” atau “menyerahkan kepada pihak lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Sejak saat itu
  rationale: Mengungkapkan titik awal tindakan yang terus berlangsung secara alami dalam bahasa Indonesia.
- source_word: ἐζήτει
  choice: mencari
  rationale: Dalam konteks dengan 'sejak saat itu', bentuk ini menyampaikan tindakan berkelanjutan dari verba imperfek tanpa ungkapan yang kaku.
- source_word: εὐκαιρίαν
  choice: kesempatan
  rationale: Padanan alami untuk kesempatan atau saat yang sesuai; nuansa menguntungkan tersirat dari konteks.
- source_word: ἵνα
  choice: untuk
  rationale: Menyatakan tujuan secara ringkas dan alami.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Rujukan pronomina dijelaskan dengan nama Yesus agar jelas dan alami dalam bahasa Indonesia; tidak mengubah referen kontekstualnya.
- source_word: παραδῷ
  choice: menyerahkan
  rationale: Mempertahankan arti dasar παραδίδωμι, yakni menyerahkan kepada pihak lain, tanpa mempersempitnya langsung menjadi 'mengkhianati'.
theological_decisions:
- issue: Makna παραδῷ dalam tindakan Yudas
  choice: menyerahkan
  alternative: mengkhianati
  rationale: Konteks memang menggambarkan pengkhianatan, tetapi verba Yunani memiliki arti yang lebih luas, 'menyerahkan'. Teks utama mempertahankan keluasan leksikal itu, sedangkan alternatif kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Penggunaan nama 'Yesus' menghindari ketidakjelasan pronomina dalam ayat yang berdiri sendiri.
