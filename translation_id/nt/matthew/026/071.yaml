  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: id
  text: Ketika Petrus keluar menuju pintu gerbang, seorang perempuan lain melihatnya dan berkata kepada orang-orang yang ada di situ, “Orang ini bersama Yesus, orang Nazaret itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντα δὲ
  choice: Ketika Petrus keluar
  rationale: Partisip aoristus dipahami secara temporal dalam alur cerita. Nama Petrus dipakai untuk memperjelas subjek tersirat αὐτόν secara alami dalam bahasa Indonesia.
- source_word: εἰς τὸν πυλῶνα
  choice: menuju pintu gerbang
  rationale: πυλών menunjuk area atau pintu gerbang pada jalan keluar, bukan sekadar sebuah pintu biasa.
- source_word: ἄλλη
  choice: seorang perempuan lain
  rationale: Bentuk feminin ἄλλη mengacu kepada perempuan lain, selaras dengan konteks pelayan perempuan pada ayat sebelumnya.
- source_word: λέγει
  choice: berkata
  rationale: Presens historis Yunani diterjemahkan dengan bentuk lampau naratif yang alami dalam bahasa Indonesia tanpa mengubah urutan peristiwa.
- source_word: τοῖς ἐκεῖ
  choice: kepada orang-orang yang ada di situ
  rationale: Menyampaikan rujukan umum kepada mereka yang berada di tempat itu.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Yesus, orang Nazaret itu
  rationale: Ναζωραῖος adalah sebutan geografis bagi Yesus sebagai orang dari Nazaret; bentuk ini mempertahankan fungsi identifikasinya.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Presens historis λέγει dinaturalisasi menjadi “berkata”; tidak diperlukan catatan kaki karena tidak ada ambiguitas teologis atau tekstual penting yang perlu ditandai.
