  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: id
  text: Dan setelah mengambil sebuah cawan dan mengucap syukur, dia memberikannya kepada mereka sambil berkata, “Minumlah dari cawan itu, kalian semua.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: setelah mengambil
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: ποτήριον
  choice: sebuah cawan
  rationale: Nomina Yunani tidak memakai artikel. 'Sebuah cawan' mencerminkan bentuk itu, sedangkan 'cawan itu' tetap mungkin berdasarkan konteks perjamuan.
- source_word: εὐχαριστήσας
  choice: mengucap syukur
  rationale: Menyampaikan makna langsung verba εὐχαριστέω tanpa memasukkan istilah sakramental yang tidak dinyatakan secara eksplisit.
- source_word: ἔδωκεν αὐτοῖς
  choice: dia memberikannya kepada mereka
  rationale: Akhiran '-nya' secara alami merujuk kepada cawan yang telah disebut, sedangkan 'kepada mereka' mewakili objek tak langsung.
- source_word: λέγων
  choice: sambil berkata
  rationale: Mempertahankan fungsi partisip yang mengantar perkataan langsung dengan ungkapan Indonesia yang wajar.
- source_word: Πίετε
  choice: Minumlah
  rationale: Bentuk imperatif jamak diterjemahkan dengan perintah yang alami dan lugas.
- source_word: ἐξ αὐτοῦ
  choice: dari cawan ini
  rationale: Preposisi ἐξ menandai sumber. Mengulang 'cawan' menghindari rujukan 'darinya' yang kaku atau kurang jelas dalam bahasa Indonesia.
- source_word: πάντες
  choice: kalian semua
  rationale: Menunjukkan bahwa perintah itu ditujukan kepada seluruh kelompok, bukan bahwa mereka harus menghabiskan seluruh isi cawan.
theological_decisions:
- issue: Nuansa ekaristis atau sakramental εὐχαριστήσας
  choice: mengucap syukur
  alternative: memberkati cawan itu
  rationale: Makna leksikalnya ialah mengucap syukur. Pilihan ini tidak memasukkan rumusan teologis yang lebih kemudian, tetapi tetap terbuka terhadap pembacaan historis Perjamuan Terakhir.
- issue: Cakupan πάντες dalam perintah
  choice: kalian semua
  alternative: semuanya
  rationale: Secara sintaksis, πάντες paling alami mengacu kepada semua orang yang diperintah untuk minum, bukan kepada seluruh isi cawan. Terjemahan ini tidak menarik kesimpulan mengenai praktik perjamuan di luar cakupan ayat.
- issue: Ketakrifan ποτήριον
  choice: sebuah cawan
  alternative: cawan itu
  rationale: Teks Yunani tidak memakai artikel, tetapi konteks perjamuan dapat membuat acuannya tertentu. Teks utama mempertahankan bentuk anartikular tanpa menutup alternatif kontekstual.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Cawan' dipertahankan karena alami dalam register Alkitab dan lebih sesuai daripada 'gelas' untuk konteks perjamuan. Pronomina 'dia' mengikuti bahasa Indonesia modern; 'kalian semua' memperjelas jamak tanpa kekakuan.
