  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: id
  text: Kemudian, seorang dari kedua belas, yang disebut Yudas Iskariot, pergi kepada para imam kepala,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu ini melanjutkan urutan peristiwa secara alami dalam narasi.
- source_word: πορευθεὶς
  choice: pergi
  rationale: Partisip aoris yang bersifat adverbial dialihkan menjadi verba finit agar alami dalam bahasa Indonesia, sambil mempertahankan gerak menuju para imam kepala.
- source_word: εἷς τῶν δώδεκα
  choice: seorang dari kedua belas murid
  rationale: Ungkapan partitif dipertahankan. Kata 'murid' ditambahkan secara implisit untuk memperjelas rujukan kelompok dalam bahasa Indonesia; bentuk 'seorang dari kedua belas' tetap dicatat sebagai alternatif yang lebih harfiah.
- source_word: ὁ λεγόμενος
  choice: yang disebut
  rationale: Mencerminkan ungkapan partisipial yang mengidentifikasi Yudas secara aposisional.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Yudas Iskariot
  rationale: Nama dan julukan ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: kepada imam-imam kepala
  rationale: πρός dengan akusatif menyatakan arah atau tujuan; 'imam-imam kepala' adalah padanan Indonesia yang lazim bagi para pemimpin senior keimaman.
theological_decisions:
- issue: Penyebutan kelompok τῶν δώδεκα
  choice: kedua belas murid
  alternative: kedua belas; Kedua Belas
  rationale: Pilihan ini memperjelas bahwa angka tersebut menunjuk pada kelompok murid Yesus tanpa menjadikannya gelar melalui kapitalisasi. Karena kata 'murid' tidak dinyatakan secara eksplisit dalam teks Yunani, alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Yunani secara cukup dekat, tetapi bentuk partisip dialihkan secara idiomatis. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
