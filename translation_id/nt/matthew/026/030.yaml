  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: id
  text: Setelah menyanyikan nyanyian pujian[a], mereka pergi ke Bukit Zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah bernyanyi memuji.” Kata kerja Yunani ini dapat merujuk secara umum pada menyanyikan pujian atau himne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: Setelah menyanyikan pujian
  rationale: Partisip aoris ὑμνήσαντες menyatakan tindakan yang mendahului verba utama dan merujuk pada menyanyikan pujian atau nyanyian pujian. Ungkapan ini alami dalam bahasa Indonesia serta tidak menentukan apakah yang dinyanyikan satu atau beberapa mazmur/nyanyian.
- source_word: ἐξῆλθον
  choice: mereka pergi
  rationale: Dalam konteks perpindahan menuju suatu tempat, ἐξῆλθον dapat diterjemahkan secara alami sebagai 'mereka pergi'. Unsur keluar tersirat oleh konteks mereka meninggalkan tempat perjamuan; 'pergi keluar' kurang idiomatis dalam bahasa Indonesia.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ke Bukit Zaitun
  rationale: Ini adalah nama tempat yang sudah mapan dalam bahasa Indonesia. Preposisi εἰς menunjukkan arah tujuan, sehingga diterjemahkan 'ke'.
- source_word: καὶ
  choice: Setelah
  rationale: Hubungan koordinatif καὶ dan urutan waktu yang dinyatakan partisip aoris dialihkan menjadi konstruksi Indonesia yang alami, 'Setelah ..., mereka ...', tanpa menambahkan hubungan sebab-akibat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menyanyikan pujian' mempertahankan keluasan makna Yunani, sedangkan catatan kaki menjelaskan kemungkinan bentuk nyanyian tertentu dalam konteks perjamuan.
