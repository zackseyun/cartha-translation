source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: id
  text: Atau, apakah kamu mengira bahwa Aku tidak dapat memohon kepada Bapa-Ku[a], dan Ia akan segera menyediakan bagi-Ku[b] lebih dari dua belas legiun[c] malaikat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meminta kepada” atau “berseru kepada Bapa-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Ia akan menempatkan di samping-Ku”; maksudnya, membuatnya tersedia untuk menolong-Ku.
    reason: lexical_alternative
  - marker: c
    text: Legiun adalah satuan militer Romawi yang besar; ungkapan ini menekankan kekuatan surgawi yang sangat besar.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan hubungan alternatif dan daya retoris teguran Yesus dalam konteks sebelumnya.
- source_word: δοκεῖς
  choice: apakah kamu mengira
  rationale: Ungkapan alami dalam bahasa Indonesia untuk pertanyaan retoris langsung.
- source_word: οὐ δύναμαι
  choice: Aku tidak dapat
  rationale: Menyatakan kemampuan, bukan izin atau kemauan, sesuai arti δύναμαι.
- source_word: παρακαλέσαι
  choice: meminta kepada
  rationale: Dalam konteks ini menunjuk pada permohonan pertolongan kepada Bapa; pilihan ini wajar dan tidak menambahkan tingkat desakan yang tidak pasti.
- source_word: τὸν πατέρα μου
  choice: Bapa-Ku
  rationale: Menyampaikan hubungan ilahi dan filial secara alami menurut kebiasaan bahasa Indonesia Alkitabiah.
- source_word: παραστήσει μοι
  choice: Ia akan menyediakan bagi-Ku
  rationale: Menangkap arti membuat tersedia untuk menolong, tanpa memberi kesan bahwa teks hanya mengatakan 'mengirim'.
- source_word: ἄρτι
  choice: segera
  rationale: Menyatakan kesiapan dan kesegeraan pertolongan dalam konteks.
- source_word: πλείω δώδεκα
  choice: lebih dari dua belas
  rationale: Padanan langsung dan alami bagi bentuk komparatif dengan bilangan.
- source_word: λεγιῶνας
  choice: legiun
  rationale: Mempertahankan gambaran satuan militer Romawi dan besarnya kekuatan yang dimaksud.
- source_word: ἀγγέλων
  choice: malaikat
  rationale: Konteksnya jelas menunjuk kepada makhluk surgawi, bukan utusan manusia.
theological_decisions:
- issue: Apakah perkataan Yesus menyatakan ketidakmampuan, ketiadaan izin, atau ketidakmauan untuk memperoleh pertolongan ilahi
  choice: Aku tidak dapat meminta kepada Bapa-Ku
  alternative: Aku tidak boleh meminta kepada Bapa-Ku; Aku tidak mau meminta kepada Bapa-Ku
  rationale: δύναμαι berbicara tentang kemampuan atau kuasa. Terjemahan mempertahankan penegasan bahwa Yesus sanggup meminta pertolongan surgawi, tanpa menjelaskan lebih jauh alasan Ia tidak melakukannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti ilahi ditulis dengan huruf kapital mengikuti konvensi umum penerbitan Alkitab Indonesia. Istilah historis “legiun” dipertahankan dan diterangkan dalam catatan kaki.
