id: MAT.26.75
reference: Matthew 26:75
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: id
  text: 'Lalu Petrus teringat akan perkataan yang telah diucapkan Yesus: “Sebelum ayam jantan berkokok, engkau akan menyangkal Aku tiga kali.” Kemudian ia pergi ke luar dan menangis dengan pilu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: teringat
  rationale: Bentuk aoristus ini menyatakan bahwa Petrus teringat kembali pada suatu perkataan. “Teringat” alami dalam bahasa Indonesia dan mempertahankan gerak narasinya tanpa menafsirkan bentuk pasif secara berlebihan.
- source_word: ῥήματος
  choice: perkataan
  rationale: ῥῆμα di sini menunjuk pada sesuatu yang telah diucapkan. “Perkataan” lebih alami daripada “kata” untuk merujuk pada seluruh pernyataan Yesus.
- source_word: εἰρηκότος
  choice: yang telah diucapkan
  rationale: Partisipel perfektum menunjukkan ucapan terdahulu yang tetap relevan. Bentuk ini juga mempertahankan hubungan langsung dengan “perkataan” tanpa menambahkan gelar atau unsur lain.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Sebelum ayam jantan berkokok
  rationale: Konstruksi infinitif temporal dialihkan menjadi anak kalimat yang wajar dalam bahasa Indonesia. Nomina tanpa kata sandang diterjemahkan tanpa penentu, sehingga tidak dipaksakan sebagai seekor ayam tertentu maupun sebagai ayam jantan tertentu.
- source_word: τρὶς
  choice: tiga kali
  rationale: Padanan langsung, jelas, dan lazim dalam bahasa Indonesia modern.
- source_word: ἀπαρνήσῃ
  choice: engkau akan menyangkal
  rationale: ἀπαρνέομαι berarti menyangkal atau tidak mengakui hubungan dengan seseorang. “Menyangkal” jelas dan mempertahankan bobot tindakan Petrus; “engkau” sesuai dengan tuturan langsung yang khidmat namun tetap mudah dipahami.
- source_word: ἐξελθὼν ἔξω
  choice: pergi ke luar
  rationale: Partisipel dan adverbia Yunani sama-sama menekankan gerak meninggalkan tempat itu. “Pergi ke luar” menyampaikannya secara alami tanpa meniru pengulangan Yunani secara kaku.
- source_word: ἔκλαυσεν πικρῶς
  choice: menangis dengan pilu
  rationale: Ungkapan ini menyatakan tangisan yang diliputi kesedihan mendalam. “Dengan pilu” alami dan berbobot dalam bahasa Indonesia, tanpa menambahkan gambaran tentang cara menangis yang tidak dinyatakan teks.
theological_decisions:
- issue: Penyebutan Yesus tanpa gelar
  choice: Yesus
  alternative: Tuhan Yesus
  rationale: Teks Yunani hanya memakai nama Ἰησοῦ. Gelar kristologis tidak ditambahkan karena tidak terdapat dalam sumber.
- issue: Acuan ayam jantan dalam nubuat
  choice: ayam jantan tanpa penentu
  alternative: seekor ayam jantan; ayam jantan itu
  rationale: Bahasa Yunani tidak memakai kata sandang. Bahasa Indonesia dapat mempertahankan ketaktertentuan atau sifat generiknya secara alami dengan tidak memakai penentu.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan kalimat mengikuti alur naratif Yunani, sedangkan ungkapan yang kaku disesuaikan secara idiomatis. Tidak diperlukan catatan kaki karena ketiadaan kata sandang pada ἀλέκτορα dapat dipertahankan secara alami dengan frasa “ayam jantan” tanpa penentu.
