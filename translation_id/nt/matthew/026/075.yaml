  source_fidelity: 'Teks Indonesia dengan setia menyampaikan semua unsur Yunani: Petrus teringat akan perkataan Yesus yang telah diucapkan; nubuat tentang ayam jantan berkokok sebelum penyangkalan tiga kali; lalu kepergiannya ke luar dan tangisnya yang mendalam. “Menangis dengan pilu” merupakan padanan idiomatis yang memadai untuk ἔκλαυσεν πικρῶς, tanpa menambahkan rincian.'
  naturalness: Bahasanya modern, jelas, dan bernada naratif bermartabat. “Teringat akan,” “perkataan yang telah diucapkan Yesus,” dan “pergi ke luar” semuanya alami dalam bahasa Indonesia standar. Pengulangan penghubung “Lalu ... Kemudian” mengalir dengan baik.
