  text: Kalau begitu, bagaimana mungkin Kitab Suci digenapi? Bukankah semuanya harus terjadi demikian?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: Kalau begitu, bagaimana mungkin
  rationale: Ungkapan ini mempertahankan hubungan logis dengan perkataan sebelumnya dan daya pertanyaan retoris. Kata 'mungkin' secara alami menyampaikan nuansa potensial dari bentuk subjungtif berikutnya.
- source_word: πληρωθῶσιν
  choice: digenapi
  rationale: Bentuk pasif aoristus subjungtif dari πληρόω merujuk pada tercapainya penggenapan Kitab Suci; bersama pertanyaan retoris, potensialitasnya disampaikan oleh 'bagaimana mungkin'.
- source_word: αἱ γραφαὶ
  choice: Kitab Suci
  rationale: Bentuk jamak ini secara lazim menunjuk pada kumpulan tulisan suci Israel. Dalam bahasa Indonesia, 'Kitab Suci' merupakan sebutan kolektif yang alami.
- source_word: ὅτι
  choice: bahwa
  rationale: Dipertahankan sebagai pengantar isi yang dinyatakan oleh Kitab Suci, tanpa mengubahnya menjadi hubungan sebab-akibat.
- source_word: οὕτως
  choice: dengan cara ini
  rationale: Menunjuk pada cara rangkaian penangkapan dan penderitaan Yesus sedang berlangsung; terjemahan ini jelas dan tidak arkais.
- source_word: δεῖ γενέσθαι
  choice: hal itu harus terjadi
  rationale: Menyampaikan keharusan dan terjadinya peristiwa secara ringkas tanpa menambahkan sumber atau uraian teologis yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Sifat keharusan yang dinyatakan oleh δεῖ
  choice: hal itu harus terjadi
  alternative: hal itu harus terjadi sesuai dengan rencana Allah
  rationale: Konteks penggenapan Kitab Suci menyiratkan keharusan ilahi, tetapi teks Yunani tidak menjabarkannya. Terjemahan tidak menambahkan penjelasan doktrinal.
- issue: Hubungan ὅτι dengan 'Kitab Suci digenapi'
  choice: bahwa
  alternative: karena
  rationale: 'ὅτι dipahami sebagai pengantar isi: Kitab Suci menyatakan bahwa peristiwa itu harus berlangsung demikian. Karena konstruksinya dapat terasa tidak biasa dalam bahasa Indonesia, sebuah catatan mempertahankan alternatif susunan yang lebih idiomatis tanpa menutup ambiguitas.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalau begitu' dipilih agar hubungan inferensial terdengar alami; 'Kitab Suci' digunakan sebagai sebutan kolektif yang mapan. Susunan utama sengaja mempertahankan hubungan sintaksis ὅτι meskipun sedikit lebih formal.
