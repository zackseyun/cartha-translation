source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: id
  text: Ketika Yesus masih berbicara, lihatlah, datanglah Yudas, salah seorang dari kedua belas itu, bersama kerumunan besar dari imam-imam kepala dan para tua-tua bangsa itu, yang membawa pedang dan pentung-pentung.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang diutus oleh imam-imam kepala dan para tua-tua bangsa itu.” Secara lebih harfiah, teks Yunani berbunyi “dari imam-imam kepala dan para tua-tua bangsa itu.”
    reason: alternative_reading
  - marker: b
    text: Atau, “tongkat-tongkat” atau “batang-batang kayu.” Kata Yunani ini secara harfiah menunjuk pada potongan kayu, yang di sini kemungkinan digunakan sebagai pentung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Ketika Yesus masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan. Nama “Yesus” dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia, sedangkan “masih” mewakili ἔτι.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda wacana yang memberi daya hidup dan kesan langsung pada narasi tanpa menafsirkannya sebagai “tiba-tiba”.
- source_word: Ἰούδας
  choice: Yudas
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: εἷς τῶν δώδεκα
  choice: salah seorang dari kedua belas itu
  rationale: Mempertahankan ungkapan partitif dan tidak menambahkan kata “murid” yang tidak tertulis dalam frasa Yunani, meskipun identitas kelompok itu jelas dari konteks.
- source_word: ἦλθεν
  choice: datanglah
  rationale: Padanan naratif langsung bagi bentuk aoristus ἔρχομαι; partikel -lah membantu menjaga daya naratif setelah “lihatlah”.
- source_word: ὄχλος πολὺς
  choice: kerumunan besar
  rationale: Padanan modern dan netral yang mempertahankan makna kuantitatif πολύς tanpa menambahkan nuansa rusuh yang lebih kuat seperti “gerombolan”.
- source_word: μετὰ μαχαιρῶν
  choice: membawa pedang
  rationale: Dalam konteks ini, μετά menyatakan perlengkapan yang menyertai mereka. “Pedang” cukup luas untuk μάχαιρα tanpa mempersempitnya menjadi jenis senjata tertentu.
- source_word: καὶ ξύλων
  choice: dan pentung
  rationale: ξύλον secara harfiah berarti kayu atau potongan kayu, tetapi dalam konteks persenjataan bentuk jamaknya menunjuk pada benda kayu yang dipakai sebagai pemukul. “Pentung” menyampaikan fungsi tersebut secara wajar.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: dari imam-imam kepala dan para tua-tua bangsa itu
  rationale: “Dari” mempertahankan penandaan sumber oleh ἀπό tanpa secara eksplisit menambahkan kata kerja “diutus”. Istilah “imam-imam kepala” dan “para tua-tua bangsa itu” merupakan padanan yang jelas dan lazim.
theological_decisions:
- issue: Apakah kerumunan itu harus dinyatakan secara eksplisit sebagai utusan resmi para pemimpin
  choice: dari imam-imam kepala dan para tua-tua bangsa itu
  alternative: yang diutus oleh imam-imam kepala dan para tua-tua bangsa itu
  rationale: Konteks mendukung adanya kewenangan atau penugasan, tetapi teks Yunani hanya memakai ἀπό untuk menyatakan sumber. Terjemahan utama mempertahankan keluasan makna itu, sedangkan penafsiran “diutus oleh” dicatat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan dorongan naratif dari ἰδοὺ serta hubungan Yudas dengan kerumunan. Frasa sumber dengan “dari” sengaja tidak diperjelas secara berlebihan agar ambiguitas antara asal, afiliasi, dan penugasan tetap terbuka.
