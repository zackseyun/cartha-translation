  to: Ketika Yesus masih berbicara, lihatlah, datanglah Yudas, salah seorang dari kedua belas itu, bersama kerumunan besar dari imam-imam kepala dan para tua-tua bangsa itu, yang membawa pedang dan pentung-pentung.[a][b]
