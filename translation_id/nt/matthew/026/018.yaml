  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: id
  text: 'Ia berkata, “Pergilah ke kota, kepada seseorang tertentu[a], dan katakan kepadanya, ‘Guru berkata: Waktu-Ku sudah dekat. Aku hendak merayakan Paskah di tempatmu[b] bersama murid-murid-Ku.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada si anu.” Ungkapan Yunani menunjuk kepada orang tertentu yang sengaja tidak disebutkan namanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepadamu.” Dalam konteks ini, frasa tersebut menunjukkan tempat atau keramahtamahan orang itu; karena itu dapat dipahami “di tempatmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Pergilah
  rationale: Bentuk imperatif jamak yang secara wajar diterjemahkan sebagai perintah untuk pergi, tanpa menambahkan penekanan ‘meninggalkan’.
- source_word: πρὸς τὸν δεῖνα
  choice: kepada seseorang tertentu
  rationale: Menunjuk kepada orang tertentu yang sengaja tidak disebutkan namanya. Ungkapan ini lebih bermartabat daripada ‘si anu’ dalam teks utama.
- source_word: Ὁ διδάσκαλος
  choice: Guru
  rationale: Menerjemahkan διδάσκαλος sebagai gelar yang dikenali dan tidak mencampurkannya dengan κύριος (‘Tuhan/Tuan’).
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Waktu-Ku sudah dekat
  rationale: καιρός menunjuk pada waktu yang bermakna atau tepat, tetapi ayat ini tidak menentukan lebih lanjut apakah yang dimaksud khususnya kematian Yesus, perjamuan Paskah, atau puncak karya-Nya.
- source_word: πρὸς σὲ
  choice: di tempatmu
  rationale: Dalam konteks penyediaan tempat untuk perjamuan, frasa ini secara idiomatis menunjukkan lokasi yang berkaitan dengan penerima pesan, tanpa menambahkan kata ‘rumah’ yang tidak terdapat dalam bahasa Yunani.
- source_word: ποιῶ τὸ πάσχα
  choice: Aku hendak merayakan Paskah
  rationale: ποιέω dengan πάσχα merupakan idiom untuk merayakan atau menjalankan Paskah. ‘Hendak merayakan’ menyampaikan maksud yang segera dilaksanakan secara alami dalam bahasa Indonesia.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: bersama murid-murid-Ku
  rationale: ‘Murid-murid’ mempertahankan hubungan khas μαθηταί dengan Yesus dan merupakan padanan baku yang alami.
theological_decisions:
- issue: Cakupan makna καιρός Yesus yang sudah dekat
  choice: Waktu-Ku sudah dekat
  alternative: Saat yang telah ditetapkan bagi-Ku sudah dekat; Saat-Ku sudah dekat
  rationale: Terjemahan utama mempertahankan keluasan ungkapan Yunani dan tidak memutuskan apakah waktu itu terutama menunjuk pada kematian Yesus, perjamuan Paskah, atau keseluruhan puncak misi-Nya.
- issue: Lokasi perayaan dalam πρὸς σὲ
  choice: di tempatmu
  alternative: bersamamu; di rumahmu
  rationale: ‘Di tempatmu’ menyampaikan implikasi keramahtamahan dalam konteks tanpa memastikan bahwa bangunan itu rumah milik orang tersebut; catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Seseorang tertentu’ dipilih daripada ‘si anu’ dalam teks utama; ‘di tempatmu’ menjaga ketepatan tanpa menambahkan ‘rumah’. Kapitalisasi pada Waktu-Ku dan murid-murid-Ku mengikuti gaya penghormatan yang lazim dalam teks Alkitab bahasa Indonesia.
