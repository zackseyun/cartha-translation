  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: id
  text: Petrus sedang duduk di luar, di halaman. Seorang gadis pelayan[a] datang menghampirinya dan berkata, “Kamu juga bersama Yesus, orang Galilea itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelayan perempuan muda” atau “budak perempuan.” Kata Yunani παιδίσκη dapat menunjuk seorang perempuan muda yang bekerja sebagai pelayan, kadang-kadang dengan status sebagai budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: Partikel ini berfungsi sebagai penghubung ringan dalam alur narasi. Pemisahan adegan sudah terbaca secara alami dalam bahasa Indonesia tanpa menambahkan penanda waktu atau pertentangan yang tidak dinyatakan secara tegas.
- source_word: ἐκάθητο ἔξω
  choice: sedang duduk di luar
  rationale: Bentuk imperfek menggambarkan keadaan atau tindakan yang sedang berlangsung pada masa lampau; “sedang duduk” mempertahankan aspek tersebut, sedangkan “di luar” menunjukkan posisinya terhadap pemeriksaan di dalam.
- source_word: ἐν τῇ αὐλῇ
  choice: di halaman
  rationale: Dalam konteks rumah imam besar, αὐλή merujuk pada halaman terbuka. “Halaman” merupakan padanan Indonesia yang alami dan jelas.
- source_word: προσῆλθεν αὐτῷ
  choice: datang menghampirinya
  rationale: Ungkapan ini menyatakan gerak mendekat secara fisik. Pilihan ini alami dalam narasi Indonesia dan tetap mempertahankan tindakan mendekat.
- source_word: μία παιδίσκη
  choice: seorang pelayan perempuan
  rationale: παιδίσκη dapat menunjuk perempuan muda yang bekerja sebagai pelayan dan kadang berstatus budak. “Pelayan perempuan” menyatakan peran sosialnya tanpa memastikan status perbudakan yang tidak ditegaskan oleh konteks; μία tercakup secara alami dalam “seorang”.
- source_word: λέγουσα
  choice: dan berkata
  rationale: Partisipel Yunani dialihkan menjadi verba berhingga agar alur kalimat alami dalam bahasa Indonesia tanpa mengubah hubungan tindakannya.
- source_word: Καὶ σὺ
  choice: Kamu juga
  rationale: καί bersama kata ganti yang tegas menempatkan Petrus sebagai salah seorang yang terkait dengan Yesus. “Kamu juga” mempertahankan penekanan itu.
- source_word: ἦσθα μετὰ
  choice: bersama
  rationale: Padanan langsung ini mempertahankan relasi yang dinyatakan teks tanpa memperluasnya menjadi pernyataan eksplisit tentang status sebagai pengikut.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Yesus, orang Galilea itu
  rationale: Γαλιλαίου berfungsi sebagai sebutan pengenal. “Orang Galilea itu” terdengar alami dalam tuduhan langsung dan mempertahankan identifikasi geografis tersebut.
