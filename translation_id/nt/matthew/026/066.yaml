translation:
  language: id
  text: “Bagaimana pendapat kalian?” Mereka menjawab[a], “Ia layak dihukum mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ia bersalah dan patut dihukum mati” atau “Ia dapat dijatuhi hukuman mati.” Ungkapan Yunani ini merupakan putusan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Bagaimana pendapat kalian?
  rationale: Ungkapan δοκέω dengan datif ὑμῖν meminta pendapat atau putusan para pendengar. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan pertanyaan langsung kepada kelompok tersebut.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Mereka menjawab
  rationale: Gabungan partisip ἀποκριθέντες dan εἶπαν merupakan ungkapan naratif yang wajar diterjemahkan dengan satu verba finit. δέ bersifat penghubung ringan dan tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: Ἔνοχος
  choice: layak dihukum
  rationale: Dalam konteks pengadilan, ἔνοχος dengan θανάτου menyatakan bahwa seseorang dinilai bersalah atau terkena ancaman hukuman mati. 'Layak dihukum' menyampaikan isi putusan secara alami tanpa menyatakan bahwa penilaian dewan itu benar di hadapan Allah.
- source_word: θανάτου
  choice: mati
  rationale: Genitif θανάτου melengkapi ἔνοχος dan menunjuk pada kematian sebagai hukuman. 'Dihukum mati' merupakan ungkapan hukum Indonesia yang jelas dan idiomatis.
- source_word: ἐστίν
  choice: Ia
  rationale: Kopula Yunani beserta subjek tersirat dinyatakan secara alami dalam klausa Indonesia 'Ia layak dihukum mati'; bahasa Indonesia tidak memerlukan padanan tersendiri untuk kopula tersebut.
theological_decisions:
- issue: Daya hukum putusan dewan
  choice: Ia layak dihukum mati
  alternative: Ia bersalah dan patut mati; Ia terkena hukuman mati
  rationale: Terjemahan ini mempertahankan sifat yudisial ucapan itu sebagai putusan para anggota dewan, tanpa mengubahnya menjadi pernyataan penerjemah mengenai kesalahan Yesus di hadapan Allah. Catatan kaki menjaga rentang makna ἔνοχος θανάτου.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak 'kalian' membuat ὑμῖν eksplisit dan sesuai dengan Yesus yang berbicara kepada sekelompok orang. Rumusan 'layak dihukum mati' mempertahankan konteks peradilan dengan ungkapan yang lazim bagi pembaca umum.
