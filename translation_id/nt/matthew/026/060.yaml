  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: id
  text: Dan mereka tidak menemukan apa pun[a], meskipun banyak saksi palsu telah maju. Tetapi kemudian dua orang maju
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka tidak menemukan satu pun”; bahasa Yunani tidak menyebutkan objeknya secara tersurat dan merujuk pada kesaksian atau tuduhan yang sedang dicari.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: mereka tidak menemukan apa pun
  rationale: Objek εὗρον tersirat dari konteks ayat sebelumnya, yakni kesaksian atau tuduhan yang dapat dipakai untuk melawan Yesus. Ungkapan ini mempertahankan ketidaktersuratan objek sambil terdengar alami dalam bahasa Indonesia.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: meskipun banyak saksi palsu telah tampil
  rationale: Genitif absolut berfungsi konsesif dalam konteks ini. 'Saksi palsu' mempertahankan latar pengadilan, sedangkan 'telah tampil' menyatakan bahwa mereka maju untuk memberikan kesaksian.
- source_word: ὕστερον δὲ
  choice: Namun, kemudian
  rationale: ὕστερον menunjukkan tahap yang lebih belakangan dalam pemeriksaan, sementara δέ menandai peralihan yang agak kontras.
- source_word: προσελθόντες δύο
  choice: dua orang tampil
  rationale: Dalam konteks pemeriksaan hukum, προσέρχομαι secara alami berarti tampil atau maju untuk bersaksi. 'Dua orang' mempertahankan jumlah tanpa menambahkan kata 'saksi' yang tidak dinyatakan secara eksplisit pada frasa ini.
