base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Kembalikan pedangmu ke tempatnya, sebab semua orang yang mengangkat pedang[a] akan binasa oleh pedang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengambil pedang”; ungkapan ini kemungkinan menunjuk pada penggunaan kekerasan, bukan sekadar memegang senjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan peristiwa dalam narasi secara alami dalam bahasa Indonesia.
- source_word: λέγει αὐτῷ
  choice: Yesus berkata kepadanya
  rationale: Bentuk kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang wajar tanpa mengubah makna.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Sarungkan kembali pedangmu
  rationale: Ungkapan ini secara alami menyatakan bahwa pedang harus dikembalikan ke tempatnya; konteks mendukung sarung pedang meskipun kata 'sarung' tidak disebutkan secara eksplisit.
- source_word: πάντες ... οἱ λαβόντες μάχαιραν
  choice: semua orang yang mengangkat pedang
  rationale: Partisip berartikel menyatakan prinsip umum. 'Mengangkat pedang' mempertahankan gambaran konkret sekaligus menyiratkan penggunaan kekerasan bersenjata.
- source_word: ἐν μαχαίρῃ ἀπολοῦνται
  choice: akan binasa oleh pedang
  rationale: Dativanya bersifat instrumental, dan 'binasa' mempertahankan bobot ἀπόλλυμι tanpa mempersempitnya secara tidak perlu.
theological_decisions:
- issue: Cakupan perkataan Yesus tentang pedang
  choice: 'Diterjemahkan sebagai prinsip umum: semua orang yang mengangkat pedang akan binasa oleh pedang.'
  alternative: Menjadikannya larangan mutlak atas segala penggunaan kekuatan, atau membatasinya hanya pada keadaan murid itu saat penangkapan.
  rationale: Konstruksi Yunani bersifat umum atau gnomic. Terjemahan mempertahankan keluasan pernyataan tanpa memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Sarungkan kembali' lebih alami daripada terjemahan harfiah 'kembalikan ke tempatnya' dalam konteks pedang yang telah dihunus.
