reference: Matthew 26:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: id
  text: Para murid melakukan sesuai dengan perintah Yesus kepada mereka, dan mempersiapkan Paskah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perjamuan Paskah”; πάσχα dapat merujuk pada perayaan Paskah secara lebih luas, termasuk perjamuan yang dipersiapkan untuk perayaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: melakukan
  rationale: Dalam konstruksi dengan ὡς συνέταξεν, kata ini berarti bertindak sesuai dengan arahan yang diberikan; “melakukan” alami dan tepat dalam bahasa Indonesia.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dalam Injil yang menyatakan para pengikut yang belajar dari Yesus.
- source_word: ὡς
  choice: seperti yang
  rationale: Menyatakan kesesuaian tindakan para murid dengan perintah Yesus.
- source_word: συνέταξεν
  choice: diperintahkan
  rationale: συντάσσω dapat berarti memerintahkan, mengarahkan, atau memberi petunjuk. Bentuk ini mempertahankan otoritas Yesus dan dalam konstruksi Indonesia secara alami menunjukkan perintah yang telah diberikan sebelumnya.
- source_word: ἡτοίμασαν
  choice: mempersiapkan
  rationale: Padanan langsung dan wajar untuk tindakan menyiapkan segala sesuatu yang diperlukan.
- source_word: τὸ πάσχα
  choice: Paskah
  rationale: Mempertahankan keluasan makna πάσχα, yang dapat merujuk pada perayaan Paskah secara umum maupun perjamuan yang terkait dengannya.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna τὸ πάσχα
  choice: Paskah
  alternative: perjamuan Paskah; anak domba Paskah
  rationale: Konteks menunjuk pada persiapan perjamuan, tetapi istilah Yunani tidak secara eksplisit membatasi maknanya pada perjamuan atau anak domba. Teks utama mempertahankan cakupan tersebut, sedangkan catatan kaki menjelaskan kemungkinan makna kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Lalu” menyampaikan kesinambungan narasi; “seperti yang diperintahkan” jelas bagi pembaca umum tanpa menghilangkan otoritas yang terkandung dalam verba Yunani.
