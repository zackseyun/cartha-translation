id: MAT.26.3
reference: Matthew 26:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: id
  text: Kemudian para imam kepala dan para tua-tua bangsa itu berkumpul di pelataran imam besar yang bernama Kayafas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan peristiwa; alami dan jelas dalam bahasa Indonesia modern.
- source_word: συνήχθησαν
  choice: berkumpul
  rationale: Menyampaikan bahwa kelompok itu berhimpun. Walaupun bentuk Yunaninya pasif, verba ini lazim dipahami dengan makna berkumpul dan bentuk pasif harfiah akan kurang alami dalam bahasa Indonesia.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Merujuk pada kalangan pemimpin keimaman, bukan pada beberapa orang yang masing-masing memegang jabatan tunggal imam besar.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: para tua-tua bangsa itu
  rationale: Mewakili konstruksi genitif secara lugas dan menunjuk kepada para pemimpin yang diakui di kalangan bangsa tersebut.
- source_word: εἰς τὴν αὐλὴν
  choice: di pelataran
  rationale: Dengan verba berkumpul, bahasa Indonesia secara alami menonjolkan tempat berkumpul. 'Pelataran' mencakup halaman terbuka yang menjadi bagian dari kediaman besar tanpa memastikan bahwa yang dimaksud seluruh istana.
- source_word: τοῦ ἀρχιερέως
  choice: imam besar
  rationale: Padanan baku untuk pemegang tunggal jabatan keimaman tertinggi dalam konteks ini.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: yang bernama Kayafas
  rationale: Mengidentifikasi imam besar itu dengan nama secara alami; 'bernama' menyampaikan fungsi λεγομένου tanpa kekakuan ungkapan harfiah 'yang disebut'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mengikuti sumber secara dekat, tetapi bentuk pasif Yunani pada συνήχθησαν disampaikan dengan verba intransitif alami 'berkumpul'. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
