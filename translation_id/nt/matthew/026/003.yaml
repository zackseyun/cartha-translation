  source_fidelity: 'Setia pada teks Yunani: Τότε diterjemahkan “Kemudian”; συνήχθησαν tersampaikan secara idiomatis oleh “berkumpul”; ἀρχιερεῖς dibedakan dengan tepat dari ἀρχιερεύς melalui “para imam kepala” dan “imam besar”; πρεσβύτεροι τοῦ λαοῦ diterjemahkan “para tua-tua bangsa itu”; dan frasa lokasi serta identifikasi Kayafas dipertahankan. “Di pelataran” wajar dengan verba “berkumpul,” meskipun εἰς secara harfiah dapat bernuansa arah “ke dalam.”'
