id: MAT.26.65
reference: Matthew 26:65
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: id
  text: Lalu Imam Besar mengoyakkan pakaiannya[a] dan berkata, “Dia telah menghujat! Untuk apa lagi kita memerlukan saksi? Lihat, sekarang kalian telah mendengar hujatan itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tindakan mengoyakkan pakaian merupakan tanda terbuka yang menyatakan keterkejutan, dukacita, atau kemarahan.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Penghubung waktu yang alami dalam narasi dan menandai peristiwa berikutnya.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Sebutan baku bagi pemegang jabatan tunggal tersebut dalam konteks kepemimpinan Yahudi.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: mengoyakkan pakaiannya
  rationale: Menyampaikan tindakan merobek pakaian secara sengaja tanpa mempersempit ἱμάτια menjadi jubah tertentu.
- source_word: Ἐβλασφήμησεν
  choice: Dia telah menghujat
  rationale: Mempertahankan istilah dakwaan religius-hukum dan daya langsung seruan tersebut.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Untuk apa lagi kita memerlukan saksi?
  rationale: Ungkapan Indonesia yang alami sekaligus dekat dengan bentuk harfiah, yaitu mempertanyakan kebutuhan lebih lanjut akan saksi.
- source_word: ἴδε νῦν ἠκούσατε
  choice: Lihat, sekarang kalian telah mendengar
  rationale: Mempertahankan seruan penarik perhatian, keterangan waktu νῦν, dan akibat langsung dari apa yang baru didengar para pendengar.
- source_word: τὴν βλασφημίαν
  choice: hujatan itu
  rationale: Kata tunjuk alami dalam bahasa Indonesia mewakili artikel definit yang menunjuk kembali kepada ucapan yang baru dinilai sebagai hujatan.
theological_decisions:
- issue: Dakwaan βλασφημέω / βλασφημία terhadap Yesus
  choice: Memakai “menghujat” dan “hujatan” sebagai ucapan Imam Besar
  alternative: berkata menghina Allah / perkataan yang menghina Allah
  rationale: Istilah baku mempertahankan bobot religius-hukum dakwaan tersebut. Bingkai ujaran menunjukkan bahwa ini penilaian Imam Besar, bukan pernyataan tersendiri dari narator.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” memperjelas bahwa bentuk ἠκούσατε adalah jamak. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya. Catatan kaki Inggris yang mengaitkan marker a dengan alternatif bagi pertanyaan tampaknya tidak selaras; draf ini menempatkan marker a pada tindakan mengoyakkan pakaian dan memakai catatan budaya yang sesuai.
