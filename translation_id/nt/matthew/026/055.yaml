id: MAT.26.55
reference: Matthew 26:55
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: id
  text: Pada saat itu Yesus berkata kepada orang banyak, “Apakah kalian datang dengan pedang dan pentung untuk menangkap Aku, seolah-olah Aku ini seorang perampok?[a] Hari demi hari Aku duduk mengajar di kompleks Bait Allah, tetapi kalian tidak menangkap Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun” atau “pemberontak bersenjata”; kata Yunani yang dipakai dapat menunjuk lebih dari sekadar pencuri, termasuk perampok yang menggunakan kekerasan atau, dalam konteks tertentu, seorang pemberontak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Pada saat itu
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan tetap menunjukkan waktu yang langsung terkait dengan peristiwa penangkapan.
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: Bentuk Yunani adalah jamak, tetapi ungkapan kolektif 'orang banyak' merupakan padanan Indonesia yang alami tanpa mengubah referennya.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: seolah-olah Aku ini seorang perampok
  rationale: Mengungkapkan perbandingan retoris Yunani dengan wajar. 'Perampok' adalah istilah umum yang mudah dipahami, sedangkan kemungkinan nuansa penyamun bersenjata atau pemberontak dipertahankan dalam catatan kaki.
- source_word: ἐξήλθατε
  choice: kalian datang
  rationale: Dari sudut pandang Yesus, rombongan itu telah datang menghampiri-Nya; 'datang' lebih alami daripada menerjemahkan unsur 'keluar' secara kaku.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: dengan pedang dan pentung
  rationale: Dalam konteks ini ξύλα adalah benda kayu yang dipakai sebagai senjata; 'pentung' menyampaikan fungsinya dengan jelas.
- source_word: συλλαβεῖν με
  choice: untuk menangkap Aku
  rationale: Konteksnya adalah tindakan penahanan oleh rombongan bersenjata, sehingga 'menangkap' tepat dan alami.
- source_word: καθ’ ἡμέραν
  choice: Hari demi hari
  rationale: Mempertahankan daya distributif dan penekanan retoris frasa Yunani.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada kawasan atau kompleks Bait Allah, bukan hanya ruang kudus bagian dalam.
- source_word: ἐκαθεζόμην διδάσκων
  choice: Aku duduk mengajar
  rationale: 'Menyampaikan tindakan yang berlangsung atau berulang: Yesus duduk sambil mengajar.'
- source_word: οὐκ ἐκρατήσατέ με
  choice: kalian tidak menangkap Aku
  rationale: Dalam konteks ini κρατέω berarti memegang atau menangkap. Pengulangan 'menangkap' terdengar alami dalam bahasa Indonesia dan menegaskan kontras antara kegiatan terbuka Yesus dan penangkapan malam itu.
theological_decisions:
- issue: Cakupan makna λῃστής
  choice: perampok
  alternative: penyamun, bandit, atau pemberontak
  rationale: Kata ini dapat menunjuk penjahat dengan kekerasan dan dalam konteks tertentu dapat bernuansa pemberontak. Ayat ini tidak memastikan arti politis yang sempit, jadi teks utama memakai istilah umum dan catatan kaki mempertahankan kemungkinan makna yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Sapaan 'kalian' dipakai karena Yesus berbicara kepada kelompok jamak. Kapitalisasi 'Aku' mengikuti kebiasaan penulisan rujukan ilahi dalam banyak terbitan Alkitab Indonesia tanpa menambahkan penafsiran pada teks sumber.
