base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: id
  text: Sebab, dengan menuangkan minyak wangi ini pada tubuh-Ku, perempuan ini telah mempersiapkan Aku untuk penguburan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk penguburan-Ku.” Kata Yunani yang dipakai mencakup makna mempersiapkan jenazah untuk penguburan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: dengan menuangkan
  rationale: Partisip aoristus βάλλω dalam konteks ini berarti mengoleskan atau menuangkan minyak wangi, bukan secara harfiah melemparkan. Bentuk ini secara alami menghubungkan tindakan tersebut dengan tujuan yang dinyatakan oleh verba utama.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan penjelasan Yesus mengenai makna tindakan perempuan itu.
- source_word: αὕτη
  choice: perempuan ini
  rationale: Demonstrativa feminin ini menunjuk secara tegas kepada perempuan yang sedang dibicarakan; pilihan ini mempertahankan daya tunjuknya.
- source_word: μύρον
  choice: minyak wangi
  rationale: μύρον adalah minyak atau salep harum yang digunakan untuk pengurapan; 'minyak wangi' jelas dan alami dalam bahasa Indonesia modern serta cocok dengan tindakan menuangkan.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: ke atas tubuh-Ku
  rationale: ἐπί dengan genitif menyatakan penerapan atau kontak pada tubuh; ungkapan ini alami dalam konteks menuangkan cairan.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: untuk mempersiapkan Aku bagi penguburan
  rationale: πρός dengan infinitif berartikel menyatakan tujuan, sedangkan ἐνταφιάζω mencakup penyiapan jenazah untuk dimakamkan, bukan hanya tindakan menguburkan.
- source_word: ἐποίησεν
  choice: melakukannya
  rationale: ποιέω merujuk kembali kepada tindakan menuangkan yang baru disebut; pronomina '-nya' menghindari pengulangan tanpa menghilangkan hubungan sintaksis.
theological_decisions:
- issue: Makna ἐνταφιάζω sehubungan dengan kematian Yesus
  choice: Tindakan perempuan itu ditafsirkan sebagai persiapan tubuh Yesus bagi penguburan-Nya.
  alternative: Tindakan itu dilakukan secara umum 'bagi penguburan-Ku' tanpa menyatakan unsur persiapan secara eksplisit.
  rationale: Makna leksikal ἐνταφιάζω mencakup penyiapan jenazah untuk penguburan. Terjemahan ini mempertahankan penafsiran antisipatif Yesus tanpa menambahkan klaim teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Susunan 'dengan menuangkan ... melakukannya' mempertahankan hubungan partisip dengan verba utama, meskipun sedikit lebih formal daripada bahasa percakapan.
