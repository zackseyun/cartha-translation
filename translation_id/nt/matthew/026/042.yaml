  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: id
  text: Untuk kedua kalinya, Ia pergi lagi dan berdoa dengan berkata, “Bapa-Ku, jika hal ini tidak dapat berlalu kecuali Aku meminumnya,[a] jadilah kehendak-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hal ini” dan akhiran “-nya” mengacu pada cawan penderitaan yang disebutkan dalam ayat sebelumnya; dalam bahasa Yunani ayat ini hanya memakai kata “hal ini” dan pronomina yang merujuk kepadanya. Dapat juga diterjemahkan, “jika tidak mungkin hal ini berlalu kecuali Aku meminumnya.”
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Sekali lagi, untuk kedua kalinya
  rationale: Mempertahankan kedua unsur pengulangan dalam bahasa Yunani tanpa meleburkannya, dengan susunan yang tetap wajar dalam narasi Indonesia.
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: Ia pergi dan berdoa, kata-Nya
  rationale: Partisip aoris yang mendahului verba utama dialihkan menjadi rangkaian verba naratif yang alami; λέγων memperkenalkan isi doa.
- source_word: Πάτερ μου
  choice: Bapa-Ku
  rationale: Sapaan vokatif dengan pronomina posesif diterjemahkan secara langsung, alami, dan bermartabat.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: jika hal ini tidak dapat berlalu
  rationale: Menjaga τοῦτο sebagai demonstratif, bukan menambahkan kata 'cawan' yang tidak muncul dalam ayat ini; 'berlalu' mempertahankan gambaran sumber.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: kecuali Aku meminumnya
  rationale: ἐὰν μή dinyatakan sebagai 'kecuali', sedangkan αὐτό dirujuk dengan akhiran pronominal '-nya' secara idiomatis.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: jadilah kehendak-Mu
  rationale: Mempertahankan daya imperatif dalam doa serta keterkaitan ungkapan dengan Matius 6:10.
theological_decisions:
- issue: Apakah 'cawan' perlu disebutkan bagi τοῦτο / αὐτό
  choice: Memakai 'hal ini' dan '-nya' dalam teks utama
  alternative: Memakai 'cawan ini' dan '-nya'
  rationale: Konteks Matius 26:39 menunjukkan bahwa acuannya ialah cawan penderitaan, tetapi ποτήριον tidak diulangi dalam ayat 42. Terjemahan utama tidak menambahkan nomina tersebut, sementara catatan menjelaskan acuannya.
- issue: Rumusan penyerahan diri dalam doa Yesus
  choice: jadilah kehendak-Mu
  alternative: biarlah kehendak-Mu terlaksana
  rationale: Pilihan ini menjaga bentuk permohonan yang kuat, ringkas, dan kaitan intratekstual dengan Matius 6:10 tanpa menambah penafsiran.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Pengulangan πάλιν dan ἐκ δευτέρου dipertahankan demi ketelitian sumber.
