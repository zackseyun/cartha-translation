  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: id
  text: Pada hari pertama perayaan Roti Tidak Beragi[a], murid-murid datang kepada Yesus dan berkata, “Di manakah Engkau ingin kami menyiapkan perjamuan Paskah supaya Engkau dapat menyantapnya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Pada hari pertama Roti Tidak Beragi.” Persoalan kronologi Paskah tidak seharusnya diputuskan melalui terjemahan saja.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Pada hari pertama perayaan Roti Tidak Beragi
  rationale: Frasa datif ini menyatakan waktu. Sebutan perayaan ditambahkan secara wajar dalam bahasa Indonesia untuk menjelaskan pemakaian substantival τῶν ἀζύμων tanpa mengubah rujukan hari rayanya; δέ merupakan penghubung ringan yang tidak perlu dinyatakan tersendiri.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: murid-murid datang kepada Yesus
  rationale: προσέρχομαι berarti datang kepada atau mendekati. Susunan ini alami dalam bahasa Indonesia dan tidak menambahkan kata ganti kepunyaan yang tidak tersurat.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel ini menyertai tindakan utama. Klausa koordinatif lebih alami dalam bahasa Indonesia daripada bentuk harfiah 'sambil berkata' dan tetap tidak mempersempitnya menjadi 'bertanya'.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Di manakah Engkau ingin kami menyiapkan ... untuk-Mu
  rationale: θέλεις menyatakan keinginan, sedangkan bentuk subjungtif orang pertama jamak berfungsi dalam pertanyaan deliberatif tidak langsung. σοι dipertahankan sebagai 'untuk-Mu'.
- source_word: φαγεῖν τὸ πάσχα
  choice: perjamuan Paskah
  rationale: Secara harfiah ungkapan ini berarti 'makan Paskah'. Dalam konteks persiapan, πάσχα menunjuk pada santapan Paskah; 'perjamuan Paskah' menyampaikan maksud itu secara alami dan menghindari konstruksi Indonesia yang janggal.
theological_decisions:
- issue: Ungkapan kronologis 'hari pertama Roti Tidak Beragi' dan waktu perjamuan Paskah
  choice: Mempertahankan 'hari pertama perayaan Roti Tidak Beragi' tanpa harmonisasi kronologis.
  alternative: Menafsirkannya sebagai 'sehari sebelum perayaan Roti Tidak Beragi' atau 'hari pertama Paskah'.
  rationale: Teks Yunani sendiri menyebut hari pertama Roti Tidak Beragi. Terjemahan tidak seharusnya menyelesaikan perdebatan tentang kronologi Injil dengan mengubah ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada sapaan kepada Yesus mengikuti kebiasaan ejaan religius Indonesia. 'Perjamuan Paskah' dipilih karena konteks makan jelas, sedangkan ungkapan hari raya dipertahankan secara dekat dengan teks Yunani.
