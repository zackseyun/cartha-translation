review_pass:
  verdict: revise
  source_fidelity: Makna utama tersampaikan dan urutan tindakan dipertahankan. Namun, ἀφεῖλεν berarti “mengambil/memutuskan” telinga itu; “memotong telinganya” dapat dipahami sekadar melukai atau menyayat telinga tanpa menyatakan bahwa telinga itu terputus. “Memotong telinganya hingga putus” menyatakan hasil yang dimaksud teks tanpa menambahkan rincian.
  naturalness: Terjemahan umumnya alami dalam bahasa Indonesia modern. “Lihatlah” sesuai sebagai penanda naratif yang formal. Rangkaian “mengulurkan ... menghunus ... lalu menebas” jelas, walaupun koordinasi akhir perlu diperbaiki untuk menyatakan hasil tindakan secara lebih tepat.
  terminology: “Hamba” dapat dipakai dalam ragam Alkitab, tetapi dalam bahasa Indonesia modern berpotensi terdengar sebagai sebutan kehormatan atau pengabdi dan kurang jelas menyampaikan status δοῦλος. “Budak” adalah padanan sosial yang lebih langsung di konteks ini; catatan kaki dapat mencantumkan “hamba” sebagai alternatif register.
  issues:
