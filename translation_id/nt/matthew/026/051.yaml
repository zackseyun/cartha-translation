  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: id
  text: Lihatlah, salah seorang yang bersama Yesus mengulurkan tangannya, menghunus pedangnya, lalu menebas budak Imam Besar itu dan memotong telinganya hingga putus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: hamba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menghidupkan adegan dan menandai kejadian mendadak, tanpa menghilangkannya dari terjemahan.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: salah seorang yang bersama Yesus
  rationale: Menyampaikan konstruksi partitif secara alami tanpa menentukan identitas orang tersebut.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: mengulurkan tangannya
  rationale: Ungkapan Indonesia yang wajar untuk gerakan mendahului tindakan menghunus pedang.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: menghunus pedangnya
  rationale: Menggambarkan tindakan menarik senjata secara ringkas dan idiomatis dalam konteks ini.
- source_word: μάχαιραν
  choice: pedang
  rationale: Padanan umum yang cukup akurat; 'pedang pendek' atau 'belati' akan mempersempit makna secara berlebihan.
- source_word: πατάξας
  choice: menebas
  rationale: Dalam konteks serangan dengan pedang yang memutus telinga, 'menebas' secara alami menyatakan pukulan tajam dan keras.
- source_word: δοῦλον
  choice: hamba
  rationale: '''Hamba'' mempertahankan status subordinat yang konkret dan sesuai dengan ragam Alkitab Indonesia, sementara catatan kaki mencantumkan padanan sosial yang lebih eksplisit.'
- source_word: ἀρχιερέως
  choice: Imam Besar
  rationale: Istilah baku dan mudah dipahami untuk jabatan ἀρχιερεύς dalam bentuk tunggal.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: dan memotong telinganya
  rationale: Menerjemahkan verba finit kedua secara koordinatif dan menyampaikan hasil serangan dengan jelas.
- source_word: ὠτίον
  choice: telinga
  rationale: Walaupun bentuk Yunaninya diminutif, konteks tidak menuntut arti khusus seperti 'cuping telinga'.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks sosial konkret
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' alami dalam bahasa Indonesia dan tidak mengubah orang itu menjadi pekerja sukarela semata; karena δοῦλος juga dapat menandakan status perbudakan, alternatif ''budak'' dipertahankan dalam catatan kaki agar kenyataan sosial teks tidak disamarkan.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan tindakan Yunani dipertahankan dengan rangkaian verba, sedangkan 'lalu' membantu kelancaran narasi. Penulisan 'Imam Besar' mengikuti penggunaan gelar jabatan dalam konteks khusus ini.
