    issue: “memotong telinganya” tidak secara eksplisit menyatakan bahwa telinga itu terputus.
    rationale: ἀφεῖλεν αὐτοῦ τὸ ὠτίον secara harfiah berarti “mengambil telinganya”; dalam konteks tebasan pedang, hasilnya ialah telinga terputus. Penambahan “hingga putus” memperjelas hasil yang dikodekan verba tanpa mengkhususkan bagian telinga.
  - severity: low
    issue: “hamba” kurang jelas untuk δοῦλος dalam bahasa Indonesia modern.
    rationale: Walaupun lazim dalam register Alkitab, “hamba” memiliki rentang makna yang lebih luas dan dapat melemahkan status perbudakan. “Budak” lebih langsung, sementara “hamba” dapat dipertahankan sebagai alternatif dalam catatan kaki.
