  rationale: Revisi mengganti “hamba” dengan “budak” untuk mencerminkan δοῦλος secara lebih jelas dalam bahasa Indonesia modern, sambil mempertahankan “hamba” sebagai alternatif. Frasa akhir diperjelas menjadi “memotong telinganya hingga putus” agar hasil dari ἀφεῖλεν tersampaikan secara memadai.
