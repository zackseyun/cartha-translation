reference: Matthew 26:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: id
  text: Ia membawa serta Petrus dan kedua anak Zebedeus, lalu mulai merasa sedih dan sangat tertekan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai berdukacita dan gelisah.”
    reason: Alternatif leksikal untuk λυπεῖσθαι dan ἀδημονεῖν yang mempertahankan rentang makna kesedihan serta kegelisahan berat.
lexical_decisions:
- source_word: παραλαβὼν
  choice: membawa serta
  rationale: Partisip aoris ini menggambarkan Yesus membawa beberapa murid pilihan bersama-Nya. ‘Membawa serta’ alami dalam bahasa Indonesia dan mempertahankan nuansa penyertaan.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: kedua anak Zebedeus
  rationale: Terjemahan ini mempertahankan identifikasi harfiah dalam teks Yunani tanpa menambahkan nama Yakobus dan Yohanes, yang tidak disebutkan dalam ayat ini.
- source_word: ἤρξατο
  choice: mulai
  rationale: Kata ini secara eksplisit menandai awal keadaan emosional yang diterangkan oleh kedua infinitif berikutnya.
- source_word: λυπεῖσθαι
  choice: merasa sedih
  rationale: Ungkapan ini menyampaikan pengalaman kesedihan secara jelas dan wajar dalam bahasa Indonesia modern, dengan ragam yang tetap khidmat.
- source_word: ἀδημονεῖν
  choice: sangat tertekan
  rationale: Kata kerja ini menunjuk pada tekanan batin atau kegelisahan yang berat. ‘Sangat tertekan’ membedakannya dari λυπεῖσθαι dan tidak melampaui bukti leksikal menjadi keputusasaan.
- source_word: καὶ ... καὶ
  choice: dan ... lalu
  rationale: 'Kata penghubung dipadankan secara kontekstual: ‘dan’ menghubungkan kedua keadaan emosional, sedangkan ‘lalu’ secara alami menghubungkan tindakan membawa serta dengan awal kesedihan dan tekanan batin.'
theological_decisions:
- issue: Gambaran keadaan emosional Yesus dalam kaitannya dengan kristologi
  choice: Menerjemahkan kedua kata kerja secara lugas sebagai kesedihan dan tekanan batin yang sungguh-sungguh
  alternative: Melunakkan kerentanan emosional Yesus, atau memperkuatnya menjadi kengerian maupun keputusasaan
  rationale: Teks menggambarkan penderitaan emosional Yesus yang nyata. Terjemahan mempertahankan kemanusiaan-Nya sepenuhnya tanpa mengurangi kekuatan ungkapan atau menambahkan gagasan keputusasaan yang tidak dituntut oleh bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Frasa ‘membawa serta’ menghindari ungkapan yang kaku, sedangkan ‘kedua anak Zebedeus’ mempertahankan bentuk sumber tanpa penjelasan tambahan.
