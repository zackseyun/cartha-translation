  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: id
  text: Sebab, minyak wangi ini dapat dijual dengan harga mahal[a] dan hasilnya diberikan kepada orang-orang miskin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan harga tinggi” atau “dengan harga yang besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: sebenarnya dapat
  rationale: Bentuk imperfek bersama infinitif menyatakan kemungkinan pada masa lampau yang tidak diwujudkan; dalam bahasa Indonesia, konteks dan kata 'sebenarnya' menyampaikan nuansa 'could have been' secara alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ucapan ini dengan keluhan pada ayat sebelumnya.
- source_word: τοῦτο
  choice: minyak itu
  rationale: Kata tunjuk netral ini mengacu pada minyak wangi yang baru disebut. Penyebutan referennya menghasilkan bahasa Indonesia yang lebih jelas dan alami tanpa mengubah acuannya.
- source_word: πραθῆναι
  choice: dijual
  rationale: Infinitif aoris pasif dari πιπράσκω berarti 'dijual'; dipadukan dengan 'dapat' untuk menyatakan kemungkinan yang tidak terjadi.
- source_word: πολλοῦ
  choice: dengan harga mahal
  rationale: Genitif harga menunjukkan besarnya harga penjualan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menetapkan jumlah tertentu.
- source_word: δοθῆναι
  choice: uangnya diberikan
  rationale: Secara harfiah teks berbunyi 'dan diberikan', tetapi yang diberikan kepada orang miskin secara logis ialah hasil penjualan. 'Uangnya' memperjelas elipsis Yunani tanpa mengubah makna.
- source_word: πτωχοῖς
  choice: kepada orang-orang miskin
  rationale: Adjektiva datif jamak yang dipakai sebagai nomina menunjuk kepada orang-orang yang miskin; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan memakai kesepadanan optimal: hubungan penjelas dipertahankan, sedangkan elipsis mengenai hasil penjualan dibuat eksplisit demi kejelasan. Penanda catatan kaki [a] dicantumkan dalam teks utama.'
