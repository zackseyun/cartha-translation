  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: id
  text: Ia segera mendekati Yesus dan berkata, “Salam,[a] Rabi,” lalu menciumnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah kata ini berkaitan dengan perintah “Bersukacitalah,” tetapi lazim dipakai sebagai sapaan: “Salam” atau “Salam sejahtera.”'
    reason: lexical_alternative
  - marker: b
    text: 'Verba Yunani dapat menyiratkan ciuman yang kuat atau berulang: “menciumnya dengan sungguh-sungguh” atau “menciumnya berulang kali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: segera
  rationale: Menyampaikan tindakan yang berlangsung tanpa menunggu, dengan ungkapan Indonesia modern dan alami.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: mendekati Yesus
  rationale: Partisip aoris ini menggambarkan Yudas datang mendekat kepada Yesus sebelum berbicara; bentuk verbal Indonesia menyatakan urutan itu dengan wajar.
- source_word: Χαῖρε
  choice: Salam
  rationale: Dalam konteks ini, kata tersebut berfungsi sebagai sapaan lazim. “Salam” mempertahankan kesopanan sapaan tanpa memakai ungkapan yang kuno atau terlalu santai.
- source_word: ῥαββί
  choice: Rabi
  rationale: Mempertahankan gelar Semitik yang ditransliterasikan dalam teks Yunani dan sudah dikenal dalam bahasa Indonesia.
- source_word: κατεφίλησεν
  choice: menciumnya
  rationale: Terjemahan utama dibuat ringkas dan alami. Bentuk verba Yunani dapat mengandung daya intensif atau repetitif, dan kemungkinan itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna sapaan Χαῖρε
  choice: Salam
  alternative: Bersukacitalah; salam sejahtera
  rationale: Di sini bentuk imperatif yang secara leksikal berkaitan dengan sukacita telah berfungsi sebagai sapaan konvensional, bukan seruan teologis. Terjemahan tidak memperkuat ironi pengkhianatan melalui diksi tambahan.
- issue: Daya intensif κατεφίλησεν
  choice: menciumnya
  alternative: menciumnya dengan sungguh-sungguh; menciumnya berulang kali
  rationale: Awalan pada verba ini mungkin memberi nuansa ciuman yang kuat atau berulang, tetapi tidak memastikan salah satu cara secara khusus. Teks utama tidak menyelesaikan ketaksaan itu, sedangkan catatan kaki menyajikan kemungkinannya.
- issue: Rujukan pronominal kepada Yesus
  choice: -nya dalam “menciumnya”
  alternative: -Nya; mencium Yesus
  rationale: Huruf kecil mengikuti tata bahasa naratif biasa dan menghindari penambahan keputusan kristologis melalui kapitalisasi pronomina yang tidak ditandai dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat mengalir sebagai narasi, gelar “Rabi” dipertahankan, dan nuansa yang tidak pasti ditempatkan dalam catatan kaki.
