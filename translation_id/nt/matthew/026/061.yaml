id: MAT.26.61
reference: Matthew 26:61
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: id
  text: Mereka berkata, “Orang ini berkata, ‘Aku sanggup merobohkan Bait Allah[a] dan membangunnya dalam waktu tiga hari[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yohanes 2:19–21 menjelaskan bahwa perkataan Yesus tentang Bait Allah mengacu pada tubuh-Nya.
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan “dalam jangka waktu tiga hari.” Ungkapan Yunani ini dapat menunjukkan penyelesaian selama rentang waktu tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν
  choice: Mereka berkata
  rationale: Bentuk aoris menyajikan tuduhan para saksi sebagai peristiwa lampau yang utuh; frasa ini alami dalam narasi Indonesia.
- source_word: Οὗτος
  choice: Orang ini
  rationale: Mempertahankan daya tunjuk yang bernada menuduh dalam suasana persidangan, tanpa kekakuan ungkapan harfiah seperti “yang ini”.
- source_word: ἔφη
  choice: berkata
  rationale: Kata ini sekadar memperkenalkan ucapan yang dituduhkan; “berkata” tidak menambahkan nuansa seperti “menyatakan” atau “mengaku”.
- source_word: Δύναμαι
  choice: Aku sanggup
  rationale: Menyatakan kemampuan dan tetap terdengar alami serta tegas dalam kutipan tuduhan.
- source_word: καταλῦσαι
  choice: merobohkan
  rationale: Dalam konteks bangunan, kata ini dapat berarti meruntuhkan atau menghancurkan; “merobohkan” membentuk pasangan alami dengan “membangunnya”.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: Bait Allah
  rationale: Ini adalah ungkapan Indonesia yang jelas dan lazim untuk tempat suci/temple milik Allah, sekaligus mempertahankan bentuk tuduhan sebagaimana diucapkan para saksi.
- source_word: διὰ τριῶν ἡμερῶν
  choice: dalam waktu tiga hari
  rationale: Dengan bentuk genitif, διά menyatakan rentang waktu. Ungkapan ini menyampaikan bahwa pembangunan akan diselesaikan dalam rentang tiga hari tanpa menentukan secara berlebihan cara menghitungnya.
- source_word: οἰκοδομῆσαι
  choice: membangunnya
  rationale: Objeknya diteruskan dari “Bait Allah”; akhiran “-nya” diperlukan agar kalimat Indonesia jelas. “Membangun kembali” dihindari karena unsur “kembali” tidak dinyatakan secara eksplisit dalam kata Yunani.
theological_decisions:
- issue: Acuan “Bait Allah” dalam tuduhan
  choice: Menerjemahkan tuduhan pada taraf makna langsungnya sebagai Bait Allah, tanpa mengganti acuannya dengan tubuh Yesus dalam teks utama.
  alternative: Membuat penafsiran Yohanes 2:21 mengendalikan terjemahan teks utama sehingga “Bait Allah” dijelaskan sebagai tubuh Yesus.
  rationale: Matius sedang melaporkan kesaksian dalam persidangan. Terjemahan perlu mempertahankan isi tuduhan para saksi; hubungan kristologis dengan tubuh dan kebangkitan Yesus lebih tepat disampaikan melalui catatan silang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Orang ini” mempertahankan nada tuduhan; “Aku sanggup” menyatakan kemampuan secara wajar; “Bait Allah” memakai istilah religius yang telah mapan tanpa memasukkan penafsiran Yohanes ke dalam teks utama.
