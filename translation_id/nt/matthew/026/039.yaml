  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: id
  text: Ia pergi sedikit lebih jauh, lalu tersungkur dengan wajah menghadap tanah[a] sambil berdoa dan berkata, “Bapa-Ku, jika mungkin, biarlah cawan ini berlalu dari-Ku[b]. Namun, bukan seperti yang Aku kehendaki, melainkan seperti yang Engkau kehendaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh pada wajah-Nya”; maksudnya, Ia bersujud dengan wajah menghadap tanah.
    reason: lexical_alternative
  - marker: b
    text: “Cawan” adalah gambaran alkitabiah untuk bagian yang ditetapkan bagi seseorang, khususnya penderitaan; bandingkan Matius 20:22 dan 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: maju sedikit
  rationale: Partisip aoris ini menunjukkan bahwa Yesus bergerak sedikit lebih jauh ke depan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: tersungkur dengan wajah ke tanah
  rationale: Ungkapan Yunani menggambarkan sikap tubuh bersujud atau tiarap. Terjemahan ini mempertahankan gambaran fisiknya tanpa menjadikannya sekadar keterangan tentang berlutut.
- source_word: προσευχόμενος καὶ λέγων
  choice: sambil berdoa, kata-Nya
  rationale: Kedua partisip kini berlangsung bersamaan dengan tindakan utama. Susunan ini alami dalam narasi Indonesia dan tetap menyatakan bahwa kata-kata berikut merupakan doa.
- source_word: Πάτερ μου
  choice: Bapa-Ku
  rationale: Sapaan dengan pronomina posesif ini menyatakan kedekatan sekaligus hormat tanpa menambahkan nuansa emosional yang tidak tersurat.
- source_word: εἰ δυνατόν ἐστιν
  choice: jika mungkin
  rationale: Bentuk ringkas ini menyampaikan klausa syarat secara lengkap dan wajar dalam bahasa Indonesia tanpa menambahkan objek yang tidak disebutkan.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: biarlah ... berlalu dari-Ku
  rationale: Imperatif aoris ini berbentuk permohonan. Pilihan tersebut mempertahankan citra sesuatu yang berlalu menjauh dari Yesus dan tidak mengubahnya menjadi pernyataan langsung tentang penghindaran.
- source_word: τὸ ποτήριον τοῦτο
  choice: cawan ini
  rationale: Kata benda harfiahnya dipertahankan karena berfungsi sebagai gambaran alkitabiah yang kaya makna, bukan dijelaskan langsung sebagai penderitaan.
- source_word: πλὴν
  choice: Namun
  rationale: Kata ini memberi pembatasan kuat terhadap permohonan sebelumnya. 'Namun' jelas, bermartabat, dan alami dalam bahasa Indonesia modern.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: bukan seperti yang Aku kehendaki, melainkan seperti yang Engkau kehendaki
  rationale: Kata kerja θέλω diterjemahkan 'kehendaki' untuk mempertahankan bobot pertentangan antara kehendak Yesus dan kehendak Bapa. Kata kerja yang dilesapkan dalam klausa kedua disediakan agar maksudnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna metaforis 'cawan' dalam doa Yesus
  choice: Mempertahankan gambaran harfiah 'cawan ini' dalam teks utama
  alternative: penderitaan ini; nasib ini
  rationale: ποτήριον adalah kata harfiah yang digunakan secara metaforis bagi bagian yang ditetapkan, khususnya penderitaan. Mempertahankan 'cawan' menjaga hubungan antarteks dan tidak mempersempit maknanya secara prematur.
- issue: Kehendak Yesus dalam hubungannya dengan kehendak Bapa
  choice: Menerjemahkan θέλω dengan 'kehendaki'
  alternative: inginkan; mau
  rationale: Ayat ini menyatakan kehendak Yesus yang nyata sekaligus ketundukan-Nya kepada Bapa. 'Kehendaki' mempertahankan bobot sastra dan teologisnya tanpa menyelesaikan ketegangan yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pronomina yang merujuk kepada Yesus dan Bapa ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Citra 'cawan' dan pertentangan antara kedua kehendak dipertahankan tanpa parafrasa doktrinal.
