  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: id
  text: Ketika Yesus datang kembali, Ia mendapati mereka sedang tidur, sebab mata mereka terasa berat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Ketika kembali
  rationale: Partisip aoris yang disertai πάλιν menyatakan tindakan yang mendahului verba utama. Ungkapan ini alami dalam bahasa Indonesia dan tetap menunjukkan bahwa Yesus datang kembali.
- source_word: εὗρεν αὐτοὺς
  choice: Yesus mendapati mereka
  rationale: Verba εὑρίσκω dalam narasi berarti menemukan atau mendapati. Nama 'Yesus' dijelaskan dari konteks sebagai subjek tersirat agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: καθεύδοντας
  choice: sedang tidur
  rationale: Partisip kini menggambarkan keadaan atau tindakan yang sedang berlangsung ketika mereka didapati.
- source_word: ἦσαν γὰρ
  choice: sebab ... terasa
  rationale: γάρ memperkenalkan penjelasan mengapa mereka tidur; 'sebab' mempertahankan hubungan logis tersebut secara wajar.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι
  choice: mata mereka terasa berat
  rationale: Partisip perfekt pasif βεβαρημένοι menyatakan keadaan yang telah terjadi dan masih berlangsung. Dalam konteks kantuk, idiom Indonesia 'mata terasa berat' menyampaikan maknanya dengan jelas tanpa ungkapan pasif yang kaku.
