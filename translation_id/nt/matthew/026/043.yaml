translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mempertahankan urutan kejadian serta alasan yang diberikan teks Yunani. Tidak diperlukan catatan kaki karena alternatif harfiah 'mata mereka dibebani' kurang alami dan tidak menambahkan ambiguitas bermakna.
