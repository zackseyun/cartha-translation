  source_fidelity: Teks Indonesia dengan tepat menerjemahkan genitivus absolutus Τοῦ δὲ Ἰησοῦ γενομένου sebagai latar temporal, tanpa memaksakan arti harfiah γίνομαι. “Ketika Yesus berada di Betania” setia pada fungsi klausa Yunani. “Di rumah Simon si kusta” mempertahankan lokatif ἐν οἰκίᾳ, genitif kepunyaan Σίμωνος, dan julukan pengenal τοῦ λεπροῦ, tanpa menyimpulkan bahwa kondisi tersebut masih dialami Simon pada saat itu. Penghilangan δέ sebagai penghubung ringan dapat diterima dalam sintaks Indonesia.
  naturalness: Kalimatnya wajar dalam bahasa Indonesia modern dan tepat dibiarkan sebagai klausa pembuka yang berlanjut ke ayat berikutnya. “Simon si kusta” merupakan bentuk julukan yang ringkas dan dikenal dalam ragam Alkitab Indonesia; catatan kaki memberikan penjelasan yang memadai mengenai keterbatasan istilah itu.
  terminology: Nama “Yesus,” “Betania,” dan “Simon” konsisten. “Kusta” mempertahankan istilah tradisional untuk λεπρός tanpa mengklaim diagnosis modern. Catatan kaki secara tepat menghindari penyamaan langsung dengan penyakit medis tertentu maupun anggapan bahwa Simon masih sakit.
