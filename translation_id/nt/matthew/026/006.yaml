  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: id
  text: Ketika Yesus berada di Betania[a], di rumah Simon si kusta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sementara Yesus berada di Betania.” Bahasa Yunani memakai konstruksi yang menetapkan latar waktu.
    reason: lexical_alternative
  - marker: b
    text: “Si kusta” menerjemahkan julukan yang dipakai teks Yunani untuk mengenali Simon; julukan ini sendiri tidak menjelaskan apakah ia masih menderita penyakit itu atau pernah menderitanya dahulu. Istilah Yunaninya juga tidak menetapkan diagnosis medis modern secara tepat.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Ketika Yesus berada
  rationale: Konstruksi genitivus absolutus dengan γίνομαι berfungsi menetapkan latar waktu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menerjemahkan γίνομαι secara kaku sebagai “menjadi”.
- source_word: δὲ
  choice: tidak dinyatakan tersendiri
  rationale: δέ merupakan penghubung ringan dalam peralihan narasi. Dalam bahasa Indonesia, hubungan itu sudah cukup tersampaikan oleh klausa pembuka “Ketika ...”, sehingga tambahan “adapun” atau “lalu” terasa tidak perlu.
- source_word: ἐν Βηθανίᾳ
  choice: di Betania
  rationale: Pemakaian lokatif langsung dari ἐν dengan nama tempat.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: di rumah Simon
  rationale: οἰκία menunjuk tempat fisik, sedangkan bentuk genitif Σίμωνος menyatakan kepunyaan. Susunan ini alami dan jelas dalam bahasa Indonesia.
- source_word: τοῦ λεπροῦ
  choice: si kusta
  rationale: λεπρός dipakai sebagai julukan pengenal Simon. “Si kusta” mempertahankan bentuk julukan yang ringkas dan lazim dalam tradisi bahasa Alkitab, tanpa menentukan diagnosis modern atau apakah penyakit itu masih dideritanya.
theological_decisions:
- issue: Apakah julukan Simon menyatakan bahwa ia masih menderita kusta
  choice: Mempertahankan julukan “Simon si kusta” tanpa menentukan keadaan penyakitnya pada saat itu
  alternative: Simon, yang dahulu menderita kusta; Simon, seorang yang berpenyakit kulit
  rationale: Teks Yunani hanya memberi julukan pengenal dan tidak menyebut apakah Simon masih sakit, sudah sembuh, atau tepatnya menderita penyakit yang kini disebut penyakit Hansen.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ayat dipertahankan sebagai klausa yang berlanjut ke ayat berikutnya. Penanda catatan kaki [a] dan [b] ditempatkan langsung sesudah unsur yang dijelaskan.
