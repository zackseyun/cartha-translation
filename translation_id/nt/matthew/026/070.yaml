  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: id
  text: Namun, ia menyangkalnya di hadapan mereka semua sambil berkata, “Aku tidak tahu apa yang kamu katakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: menyangkalnya
  rationale: Kata kerja ini menyatakan penyangkalan Petrus terhadap pernyataan yang baru disampaikan. Akhiran -nya memasok objek tersirat secara wajar tanpa menentukan lebih jauh apa yang disangkal.
- source_word: ἔμπροσθεν πάντων
  choice: di depan mereka semua
  rationale: Frasa ini menyatakan bahwa penyangkalan tersebut dilakukan secara terbuka di hadapan semua orang yang ada di situ.
- source_word: λέγων
  choice: dengan berkata
  rationale: Ungkapan ini mengalihkan participium Yunani ke bentuk Indonesia yang alami sambil mempertahankan hubungan dengan tindakan menyangkal.
- source_word: Οὐκ οἶδα
  choice: Aku tidak tahu
  rationale: Ini merupakan padanan langsung dan alami bagi bentuk negatif kata kerja 'mengetahui'.
- source_word: τί λέγεις
  choice: apa yang kamu katakan
  rationale: Padanan ini dekat dengan susunan Yunani dan tetap alami dalam bahasa Indonesia; kata ganti tunggal 'kamu' sesuai dengan lawan bicara Petrus, yaitu hamba perempuan itu.
theological_decisions:
- issue: Sifat penyangkalan Petrus
  choice: Petrus menyangkal pernyataan atau tuduhan yang baru ditujukan kepadanya, tanpa memperinci objek penyangkalan melebihi konteks.
  alternative: Petrus secara langsung menyangkal Yesus atau menyangkal bahwa ia mengenal hamba perempuan itu.
  rationale: Teks Yunani hanya menyatakan bahwa Petrus 'menyangkal' sebagai tanggapan terhadap ucapan sebelumnya. Bentuk 'menyangkalnya' membuat kalimat Indonesia lengkap tanpa memasukkan penafsiran yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Petrus' dipakai untuk memperjelas rujukan pronomina dalam kalimat mandiri. Dialog memakai 'Aku' dan 'kamu' karena percakapan berlangsung langsung dengan seorang hamba perempuan; pilihan ini alami tanpa mengurangi keseriusan adegan.
