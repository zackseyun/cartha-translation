  source_fidelity: 'Teks pertama menerjemahkan unsur-unsur Yunani dengan baik: ἀναστὰς sebagai tindakan fisik sebelum berbicara, ἀρχιερεύς sebagai “Imam Besar,” dan pertanyaan pertama mempertahankan cakupan negatif οὐδέν. Pertanyaan kedua dengan tepat dipahami sebagai pertanyaan mengenai isi kesaksian yang memberatkan Yesus, bukan pertanyaan alasan. Namun, “persaksikan melawan Engkau” bukan penggunaan verba yang baku atau alami dalam bahasa Indonesia modern.'
  naturalness: “Apa yang mereka ini persaksikan melawan Engkau?” terdengar janggal. Bentuk pasif “Apa yang dipersaksikan mereka ini terhadap-Mu?” menyampaikan pertanyaan yang sama secara idiomatis dan tetap mempertahankan para saksi sebagai pelaku kesaksian.
  terminology: “Imam Besar” tepat untuk ὁ ἀρχιερεύς. “Dip ersaksikan ... terhadap-Mu” (ditulis tanpa spasi dalam teks revisi) mempertahankan nuansa forensik καταμαρτυροῦσιν tanpa mereduksinya menjadi “menuduh.” Pronomina hormat dikonsistenkan sebagai bentuk enklitik “-Mu,” yang lazim dalam register Alkitab Indonesia.
