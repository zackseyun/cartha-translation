  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: id
  text: Lalu Imam Besar berdiri dan berkata kepada-Nya, “Apakah Engkau tidak menjawab apa pun? Apa yang dipersaksikan mereka ini terhadap-Mu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini menyatakan tindakan fisik Imam Besar sebelum berbicara; “berdiri” alami dan tetap mempertahankan daya dramatis adegan pemeriksaan.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku untuk jabatan tunggal ἀρχιερεύς dalam konteks Yahudi.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Mempertahankan pronomina Yunani; huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Apakah Engkau tidak menjawab apa pun?
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bentuk pertanyaan langsung serta cakupan οὐδέν, tanpa mengubahnya menjadi pernyataan.
- source_word: τί
  choice: Apa
  rationale: Interogativa sederhana ini diterjemahkan langsung dan tidak diperluas dengan konstruksi penjelas yang tidak diperlukan dalam bahasa Indonesia.
- source_word: οὗτοί
  choice: mereka ini
  rationale: Menunjukkan orang-orang yang hadir dan sedang memberikan kesaksian tanpa menambahkan nomina “orang” atau “laki-laki” yang tidak dinyatakan secara leksikal.
- source_word: σου
  choice: melawan Engkau
  rationale: 'Dalam konstruksi dengan καταμαρτυρέω, pronomina genitif memiliki daya adversatif: kesaksian itu ditujukan untuk memberatkan pihak yang diperiksa.'
- source_word: καταμαρτυροῦσιν
  choice: persaksikan melawan
  rationale: “Persaksikan” mempertahankan nuansa forensik tindakan memberi kesaksian, sedangkan “melawan” menyatakan arah kesaksian yang memberatkan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan kedua sengaja mempertahankan ketegangan ungkapan sumber: fokusnya dapat dipahami sebagai isi kesaksian yang memberatkan Yesus, tanpa menjadikannya sekadar pertanyaan sebab (“mengapa”).'
