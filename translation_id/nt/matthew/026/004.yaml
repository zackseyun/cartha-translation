  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: id
  text: Mereka bersekongkol untuk menangkap Yesus dengan tipu muslihat dan membunuh-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: berunding
  rationale: Bentuk aoris medial ini menyatakan bahwa mereka bersama-sama menyusun rencana; “berunding” alami dalam bahasa Indonesia dan mempertahankan unsur musyawarah jahat tanpa menambahkan gagasan yang tidak tersurat.
- source_word: δόλῳ
  choice: dengan tipu muslihat
  rationale: Kata ini menunjuk pada cara yang licik atau penuh tipu daya; “dengan tipu muslihat” mempertahankan unsur penipuan lebih tepat daripada sekadar “diam-diam”.
- source_word: κρατήσωσιν
  choice: menangkap
  rationale: Dalam konteks penahanan terhadap Yesus, verba ini berarti menguasai atau menangkap-Nya; “menangkap” adalah padanan Indonesia yang langsung dan wajar.
- source_word: ἀποκτείνωσιν
  choice: membunuh-Nya
  rationale: Menyampaikan tujuan mematikan secara lugas dan mempertahankan Yesus sebagai objek kedua verba.
theological_decisions:
- issue: Hubungan tujuan yang dinyatakan oleh ἵνα
  choice: untuk menangkap Yesus ... dan membunuh-Nya
  alternative: supaya mereka dapat menangkap Yesus ... dan membunuh-Nya
  rationale: Dalam bahasa Indonesia, konstruksi “berunding untuk” secara alami menyatakan tujuan ἵνα tanpa mengubahnya menjadi kepastian hasil. Alternatif lebih eksplisit tetapi terasa lebih berat dan “dapat” dapat memberi nuansa kemampuan yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan umum teks Alkitab Indonesia ketika merujuk kepada Yesus.
