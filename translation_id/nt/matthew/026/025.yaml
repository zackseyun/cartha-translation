  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: id
  text: Lalu Yudas, yang akan menyerahkan Dia, menjawab, “Bukan aku, ya Rabi?” Yesus berkata kepadanya, “Engkau sendiri yang mengatakannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: yang akan menyerahkan Dia
  rationale: Partisipel kini substantival menunjuk Yudas sebagai orang yang menyerahkan Yesus; dalam konteks peristiwa yang segera terjadi, bentuk Indonesia berorientasi ke depan terdengar alami. 'Menyerahkan' mempertahankan cakupan παραδίδωμι tanpa mempersempitnya menjadi motif tertentu.
- source_word: Μήτι ἐγώ εἰμι
  choice: Bukan aku
  rationale: μήτι menandai pertanyaan yang mengharapkan jawaban negatif. Bentuk ringkas ini alami dalam dialog Indonesia dan tetap menyampaikan penyangkalan tersirat Yudas.
- source_word: ῥαββί
  choice: Rabi
  rationale: Mempertahankan gelar sapaan Semitik dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: Σὺ εἶπας
  choice: Engkau sendiri yang mengatakannya
  rationale: Ungkapan Yunani yang ringkas dan tidak langsung dipertahankan sebagai jawaban yang mengembalikan pernyataan itu kepada Yudas, tanpa mengubahnya menjadi pengakuan eksplisit yang lebih tegas.
theological_decisions:
- issue: Daya jawaban Yesus dalam Σὺ εἶπας
  choice: Engkau sendiri yang mengatakannya
  alternative: Ya, benar
  rationale: Terjemahan pilihan mempertahankan ketidaklangsungan dan ketegangan ungkapan asli; alternatif akan menafsirkan jawaban sebagai afirmasi langsung dan menghilangkan nuansa retorisnya.
- issue: Gelar Yudas kepada Yesus
  choice: Rabi
  alternative: Guru
  rationale: Mempertahankan bentuk gelar sumber menghindari penyamaan diam-diam dengan sapaan lain dan menjaga perbedaan leksikal yang mungkin bermakna dalam narasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami tanpa memperjelas secara berlebihan jawaban Yesus yang sengaja tidak langsung.
