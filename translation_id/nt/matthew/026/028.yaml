id: MAT.26.28
reference: Matthew 26:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: id
  text: Sebab inilah darah-Ku, darah perjanjian[a], yang dicurahkan bagi banyak orang[b] untuk pengampunan dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “darah-Ku, darah perjanjian baru.”
    reason: textual_variant
  - marker: b
    text: Atau “demi banyak orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: inilah
  rationale: Kata ganti penunjuk ini merujuk pada apa yang Yesus berikan dalam perjamuan. Teks Yunani hanya menyatakan 'ini', tanpa menambahkan 'cawan'.
- source_word: γάρ
  choice: sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan perintah untuk minum pada ayat sebelumnya.
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: darah-Ku, darah perjanjian
  rationale: Pengulangan 'darah' menghasilkan bahasa Indonesia yang jelas dan wajar, sambil mempertahankan hubungan langsung antara darah Yesus dan perjanjian.
- source_word: περὶ πολλῶν
  choice: bagi banyak orang
  rationale: Dalam konteks pengurbanan, frasa ini menunjukkan manfaat atau tindakan demi orang lain. Terjemahan ini mempertahankan 'banyak' tanpa mengubahnya menjadi 'semua'.
- source_word: ἐκχυννόμενον
  choice: yang dicurahkan
  rationale: Partisip pasif kini diterjemahkan sebagai klausa relatif yang alami dan tetap mempertahankan gambaran darah yang dicurahkan.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: untuk pengampunan dosa
  rationale: Ungkapan ini jelas dan alami serta mempertahankan hubungan tujuan atau hasil dalam bahasa sumber.
theological_decisions:
- issue: Apakah kata 'baru' disertakan bersama 'perjanjian'
  choice: darah perjanjian
  alternative: darah perjanjian baru
  rationale: Teks dasar SBLGNT yang diberikan tidak memuat καινῆς ('baru'). Bacaan alternatif dipertahankan dalam catatan kaki tanpa dimasukkan ke dalam teks utama.
- issue: Makna 'bagi banyak orang' dalam bahasa pendamaian
  choice: bagi banyak orang
  alternative: bagi semua orang
  rationale: Teks Yunani berbunyi πολλῶν, 'banyak'. Terjemahan tidak menyelesaikan perdebatan teologis yang lebih luas tentang cakupan pendamaian dengan menggantinya menjadi 'semua'.
- issue: Nuansa preposisi περί dengan genitif
  choice: bagi banyak orang
  alternative: demi banyak orang
  rationale: '''Bagi'' menyampaikan manfaat atau tindakan atas nama orang lain secara alami, sementara alternatif ''demi'' dicatat agar nuansa perwakilannya tetap terlihat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'darah-Ku' mengikuti kaidah penulisan kata ganti ilahi. Susunan 'darah-Ku, darah perjanjian' dipilih agar konstruksi genitif Yunani jelas tanpa mengurangi bobot perjanjian dan pengurbanannya.
