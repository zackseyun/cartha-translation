  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: id
  text: Namun Petrus menjawab-Nya, “Sekalipun semua orang akan tersandung karena Engkau, aku tidak akan pernah tersandung.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terguncang karena Engkau” atau “berpaling dari kesetiaan karena Engkau.” Kata Yunani ini dapat berarti tersandung, dibuat tersandung, menjadi kecewa, atau berpaling dari kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Namun Petrus menjawab-Nya
  rationale: Gabungan partisip ἀποκριθείς dengan εἶπεν lazimnya merupakan ungkapan naratif ‘menjawab dan berkata’; bahasa Indonesia yang alami cukup memakai ‘menjawab’. δέ menyatakan kontras ringan dengan perkataan Yesus sebelumnya, sehingga diterjemahkan ‘Namun’, dan αὐτῷ dipertahankan melalui akhiran ‘-Nya’.
- source_word: Εἰ πάντες
  choice: Sekalipun semua orang
  rationale: εἰ secara formal berarti ‘jika’, tetapi di sini bernuansa konsesif karena Petrus mempertentangkan dirinya dengan semua orang lain. ‘Sekalipun’ menyampaikan nuansa itu dengan wajar.
- source_word: σκανδαλισθήσονται ἐν σοί
  choice: meninggalkan Engkau
  rationale: Dalam konteks nubuat bahwa para murid akan tercerai-berai, verba pasif σκανδαλίζω menunjuk pada kegagalan kesetiaan atau pembelotan karena apa yang menimpa Yesus. ‘Meninggalkan Engkau’ jelas dan alami, sambil catatan kaki mempertahankan rentang makna metaforisnya.
- source_word: ἐγὼ οὐδέποτε σκανδαλισθήσομαι
  choice: aku tidak akan pernah meninggalkan Engkau
  rationale: Pronina eksplisit ἐγώ bersifat menegaskan dan berkontras dengan πάντες; ‘aku’ dalam susunan ini cukup mempertahankan tekanan tersebut. οὐδέποτε diterjemahkan ‘tidak akan pernah’. Pengulangan verba diterjemahkan konsisten.
theological_decisions:
- issue: Makna σκανδαλίζω dalam konteks kegagalan sebagai murid
  choice: meninggalkan Engkau
  alternative: tersandung karena Engkau; berpaling dari Engkau
  rationale: Konteks dekatnya adalah para murid meninggalkan Yesus ketika Ia ditangkap, sehingga ‘meninggalkan Engkau’ menyampaikan kegagalan kesetiaan secara konkret. Terjemahan ini tidak menentukan apakah tindakan itu merupakan kemurtadan yang final; rentang makna verba dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Engkau’ dipakai untuk sapaan langsung kepada Yesus, sedangkan ‘aku’ mempertahankan nada pribadi dan tegas dari ucapan Petrus. Penanda catatan kaki ditempatkan setelah kalimat yang memuat dua kemunculan verba terkait.
