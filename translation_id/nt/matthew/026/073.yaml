  register: Bahasa Indonesia baku-modern dengan dialog yang alami dan bermartabat. 'Kamu' dipakai karena ini merupakan tuduhan langsung dalam suasana informal, bukan sapaan hormat. Ambiguitas λαλιά dipertahankan melalui 'cara bicaramu', sedangkan catatan kaki menjelaskan ungkapan δῆλόν σε ποιεῖ.
