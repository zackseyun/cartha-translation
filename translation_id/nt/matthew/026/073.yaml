  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: id
  text: Tidak lama kemudian, orang-orang yang berdiri di situ mendekati Petrus dan berkata, “Kamu juga memang salah seorang dari mereka, sebab cara bicaramu[a] pun menunjukkan siapa dirimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “caramu berbicara membuatmu kentara.” Kata Yunani λαλιά dapat berarti tutur, cara berbicara, atau aksen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Tidak lama kemudian
  rationale: Ungkapan waktu ini menyatakan selang waktu yang singkat; bentuk ini alami dalam narasi bahasa Indonesia modern.
- source_word: δὲ
  choice: —
  rationale: Partikel ini berfungsi sebagai penghubung ringan yang melanjutkan narasi dan tidak perlu diterjemahkan dengan kata tersendiri dalam bahasa Indonesia.
- source_word: προσελθόντες
  choice: mendekati
  rationale: Partisip aoris ini menyatakan gerakan menuju Petrus; 'mendekati' jelas, alami, dan dekat dengan makna sumber.
- source_word: οἱ ἑστῶτες
  choice: orang-orang yang berdiri di situ
  rationale: Mempertahankan gambaran orang-orang yang sedang berdiri di dekat tempat kejadian tanpa memadatkannya secara interpretatif menjadi 'orang-orang di sekitar'.
- source_word: εἶπον τῷ Πέτρῳ
  choice: berkata ... kepada Petrus
  rationale: Padanan langsung dan wajar bagi verba berkata dengan objek tak langsung.
- source_word: Ἀληθῶς
  choice: memang
  rationale: Dalam tuduhan langsung ini, 'memang' menyampaikan keyakinan kuat secara alami; 'sungguh' juga mungkin, tetapi terdengar lebih formal.
- source_word: καὶ σὺ
  choice: kamu ... salah seorang
  rationale: Keikutsertaan Petrus dalam kelompok dinyatakan secara idiomatis melalui frasa lengkap 'kamu ... salah seorang dari mereka'; nuansa καί juga diteruskan oleh konteks dan penegasan 'memang'.
- source_word: ἐξ αὐτῶν
  choice: salah seorang dari mereka
  rationale: Padanan idiomatis untuk keanggotaan atau keterkaitan dengan kelompok yang dimaksud.
- source_word: καὶ γὰρ
  choice: pun
  rationale: γάρ memperkenalkan alasan yang tampak dari kalimat berikut, sedangkan καί diberi nuansa penegasan melalui 'pun'; hubungan kausal tetap jelas tanpa penghubung 'sebab' yang lebih kaku.
- source_word: ἡ λαλιά σου
  choice: cara bicaramu
  rationale: λαλιά dapat menunjuk pada tutur, cara berbicara, atau aksen. 'Cara bicaramu' mempertahankan keluasan makna dan tidak memastikan secara berlebihan bahwa yang dimaksud hanya aksen.
- source_word: δῆλόν σε ποιεῖ
  choice: menunjukkan siapa dirimu
  rationale: Ungkapan Yunani secara harfiah membuat Petrus nyata atau dapat dikenali. Padanan ini alami dalam bahasa Indonesia dan menyampaikan bahwa tutur Petrus menyingkapkan identitas atau keterkaitannya.
