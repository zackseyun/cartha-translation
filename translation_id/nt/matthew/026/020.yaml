  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: id
  text: Ketika hari mulai petang, Yesus bersandar[a] untuk makan bersama kedua belas murid-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ia bersandar atau berbaring untuk makan, sesuai kebiasaan perjamuan pada masa itu.
    reason: cultural_clarification
  - marker: b
    text: Sejumlah naskah hanya berbunyi “bersama kedua belas orang itu”, tanpa kata “murid”.
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ketika hari sudah malam
  rationale: Konstruksi genitif absolut ini memberi latar waktu. Ungkapan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan makna temporalnya.
- source_word: ἀνέκειτο
  choice: duduk bersantap
  rationale: Kata kerja ini secara harfiah menggambarkan posisi berbaring atau bersandar saat makan menurut kebiasaan masa itu. 'Duduk bersantap' menyampaikan fungsi idiomatisnya secara alami bagi pembaca Indonesia, sedangkan catatan kaki mempertahankan gambaran budaya aslinya.
- source_word: μετὰ
  choice: bersama
  rationale: Dengan bentuk genitif, μετά berarti 'dengan' atau 'bersama'. 'Bersama' paling alami untuk menyatakan kebersamaan dalam perjamuan.
- source_word: τῶν δώδεκα μαθητῶν
  choice: kedua belas murid-Nya
  rationale: μαθητῶν terdapat dalam teks SBLGNT dan diterjemahkan sebagai 'murid'. Akhiran '-Nya' memperjelas hubungan yang sudah tersirat oleh sebutan khusus 'kedua belas murid' dalam konteks Injil.
