translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama 'Yesus' digunakan untuk subjek pronominal Yunani yang tersirat agar rujukannya jelas dalam ayat yang berdiri sendiri. Ungkapan 'duduk bersantap' menghindari kesan bahwa Yesus sekadar berbaring, sambil mempertahankan detail budaya melalui catatan kaki.
