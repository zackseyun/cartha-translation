id: MAT.26.24
reference: Matthew 26:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: id
  text: Anak Manusia memang pergi sebagaimana telah tertulis tentang Dia. Namun, celakalah orang itu, yang melalui dia Anak Manusia diserahkan[a]! Lebih baik bagi orang itu jika ia tidak dilahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dikhianati.” Verba Yunani ini dapat berarti “diserahkan” atau “dikhianati”; makna kedua sesuai dengan konteks pengkhianatan Yudas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia memang
  rationale: Mempertahankan gelar yang lazim, “Anak Manusia,” sedangkan μὲν diwakili secara ringan oleh “memang” untuk menandai pertentangan dengan δὲ.
- source_word: ὑπάγει
  choice: akan pergi
  rationale: Secara leksikal berarti “pergi”; unsur “akan” membuat kala kini yang merujuk pada peristiwa yang segera terjadi terdengar alami dalam bahasa Indonesia tanpa secara eksplisit menyamakannya dengan kematian.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: seperti yang telah tertulis tentang Dia
  rationale: “Telah tertulis” menyampaikan keadaan yang dihasilkan oleh bentuk perfektum pasif γέγραπται; “tentang Dia” menerjemahkan περὶ αὐτοῦ secara langsung.
- source_word: οὐαὶ δὲ
  choice: Namun, celakalah
  rationale: “Celakalah” mempertahankan daya kenabian dan penghakiman οὐαί, sementara “namun” menandai pertentangan dengan jalan Anak Manusia yang sesuai Kitab Suci.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: orang yang
  rationale: Dalam konstruksi Indonesia, “celakalah orang yang melalui dia ...” lebih alami daripada mengulang demonstratif sebelum klausa relatif; orang yang dimaksud tetap spesifik.
- source_word: δι’ οὗ
  choice: melalui dia
  rationale: Mempertahankan gagasan perantaraan atau keagenan dari διά dengan genitif dan tetap jelas dalam bahasa Indonesia.
- source_word: παραδίδοται
  choice: diserahkan
  rationale: Makna dasar “diserahkan” dipilih agar ambiguitas leksikal παραδίδωμι antara penyerahan dan pengkhianatan tidak dipersempit di teks utama; konteks tetap menunjukkan tindakan Yudas. Alternatif “dikhianati” dicatat dalam catatan kaki.
- source_word: καλὸν ἦν αὐτῷ
  choice: Lebih baik bagi orang itu
  rationale: Ungkapan idiomatis ini menyatakan keadaan yang lebih menguntungkan dalam kondisi kontrafaktual; “lebih baik” adalah padanan Indonesia yang alami.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: sekiranya ia tidak dilahirkan
  rationale: “Sekiranya” menyampaikan sifat kontrafaktual, sedangkan bentuk pasif “dilahirkan” mengikuti ἐγεννήθη. Pronomina menghindari pengulangan yang kaku tanpa mengaburkan acuannya.
theological_decisions:
- issue: Hubungan antara penggenapan Kitab Suci dan tanggung jawab manusia
  choice: Mempertahankan baik perjalanan Anak Manusia sesuai dengan yang tertulis maupun ucapan celaka atas orang yang menyerahkan-Nya.
  alternative: Menonjolkan ketetapan ilahi sehingga tanggung jawab Yudas melemah, atau menonjolkan tindakan manusia sehingga penggenapan Kitab Suci melemah.
  rationale: Teks Yunani menyandingkan kedua penegasan tersebut; terjemahan tidak menyelesaikan ketegangan teologis melampaui apa yang dikatakan ayat.
- issue: Makna ucapan tentang tidak dilahirkan
  choice: Menerjemahkannya sebagai ucapan penghakiman yang sangat berat tanpa menarik kesimpulan sistematis tambahan.
  alternative: Menganggapnya sekadar hiperbola atau menjadikannya bukti eksplisit bagi suatu doktrin terperinci tentang nasib akhir Yudas.
  rationale: Ayat menyatakan bahwa tidak dilahirkan akan lebih baik bagi orang itu, tetapi tidak menjelaskan seluruh implikasi doktrinalnya.
- issue: Cakupan παραδίδοται
  choice: Memakai “diserahkan” dalam teks utama dan memberikan “dikhianati” sebagai alternatif kontekstual dalam catatan kaki.
  alternative: Memakai “dikhianati” saja dalam teks utama.
  rationale: Pilihan ini mempertahankan keluasan makna verba Yunani sekaligus mengakui bahwa pengkhianatan Yudas jelas berada dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum; gelar “Anak Manusia” dipertahankan, dan huruf kapital pada “Dia” mengikuti kebiasaan penghormatan dalam penerbitan Alkitab Indonesia.
