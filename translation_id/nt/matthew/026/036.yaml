- from: Kemudian Yesus tiba bersama mereka di suatu tempat yang disebut Getsemani. Ia berkata kepada murid-murid-Nya, “Duduklah di sini sementara Aku pergi ke sana untuk berdoa.”[a]
  to: Kemudian Yesus datang bersama mereka ke suatu tempat yang disebut Getsemani. Ia berkata kepada murid-murid-Nya, “Duduklah di sini sementara[a] Aku pergi ke sana untuk berdoa.”
  rationale: Revisi terbatas pada pengungkapan gerak menuju tempat tersebut dan penempatan jangkar catatan kaki. Makna dasar, nama tempat, perbedaan “di sini/ke sana,” serta pilihan idiomatis “sementara” tetap dipertahankan.
