id: MAT.26.36
reference: Matthew 26:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: id
  text: Kemudian Yesus datang bersama mereka ke suatu tempat yang disebut Getsemani. Ia berkata kepada murid-murid-Nya, “Duduklah di sini sementara[a] Aku pergi ke sana untuk berdoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Duduklah di sini sampai Aku pergi ke sana dan berdoa.” Ungkapan Yunani dapat diterjemahkan lebih harfiah dengan “sampai”, sedangkan “sementara” lebih alami dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penghubung waktu yang alami untuk melanjutkan urutan peristiwa dalam narasi.
- source_word: ἔρχεται
  choice: tiba
  rationale: Present historis Yunani menyajikan peristiwa secara hidup; dalam narasi Indonesia, bentuk tanpa penandaan kala dapat diterjemahkan secara alami sebagai 'tiba'.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: Menyatakan penyertaan secara langsung dan wajar.
- source_word: χωρίον
  choice: suatu tempat
  rationale: Istilah ini dapat menunjuk tempat, bidang tanah, atau kawasan milik; 'tempat' mempertahankan keluasan maknanya tanpa memasukkan keterangan 'taman' dari Injil Yohanes.
- source_word: λεγόμενον Γεθσημανί
  choice: yang disebut Getsemani
  rationale: Rumus penamaan tempat yang alami dalam bahasa Indonesia; nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: λέγει
  choice: Ia berkata
  rationale: Present historis dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah urutan kejadian.
- source_word: Καθίσατε αὐτοῦ
  choice: Duduklah di sini
  rationale: Imperatif sederhana dengan penunjuk tempat; bentuk '-lah' memberi nada perintah yang wajar dan bermartabat.
- source_word: ἕως οὗ
  choice: sementara
  rationale: Secara harfiah berarti 'sampai', tetapi dalam konteks ini menandai masa para murid menunggu selama Yesus pergi dan berdoa; 'sementara' paling alami dalam bahasa Indonesia. Alternatif harfiah dicatat dalam catatan kaki.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: Aku pergi ke sana untuk berdoa
  rationale: Partisip aoris dan verba utama diungkapkan sebagai tujuan secara alami, sambil mempertahankan perbedaan deiktis antara 'di sini' dan 'ke sana'.
theological_decisions:
- issue: Sifat tempat yang bernama Getsemani
  choice: Menerjemahkan χωρίον sebagai 'tempat'.
  alternative: '''taman'''
  rationale: Matius hanya menyebutnya sebagai χωρίον. 'Taman' akan memasukkan rincian dari Yohanes 18:1 yang tidak dinyatakan dalam ayat ini.
- issue: Hubungan waktu dalam perintah Yesus
  choice: Menggunakan 'sementara' dalam teks utama.
  alternative: '''sampai'''
  rationale: ἕως οὗ secara leksikal dapat diterjemahkan 'sampai', tetapi maksud pragmatisnya di sini ialah para murid tetap duduk selama Yesus pergi dan berdoa. Catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Getsemani' mengikuti bentuk nama yang mapan dalam bahasa Indonesia. Sapaan orang pertama kepada Yesus ditulis 'Aku' sesuai konvensi penerjemahan Alkitab Indonesia; akhiran pronominal pada 'murid-murid-Nya' mempertahankan rujukan secara jelas.
