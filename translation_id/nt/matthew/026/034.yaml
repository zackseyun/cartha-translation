source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Sesungguhnya Aku berkata kepadamu, malam ini juga[a], sebelum ayam berkokok[b], kamu akan menyangkal Aku tiga kali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada malam ini”; kata “ini” mendapat penekanan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sebelum seekor ayam berkokok.” Bahasa Yunani tidak menentukan apakah yang dimaksud seekor ayam tertentu atau tidak tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Susunan ini alami dalam narasi bahasa Indonesia dan tetap mempertahankan penerima ujaran yang dinyatakan oleh αὐτῷ.
- source_word: Ἀμὴν λέγω σοι
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Rumus ini mempertahankan penegasan khidmat dan wibawa ujaran Yesus tanpa membiarkan bentuk Ibrani ἀμήν tidak diterjemahkan.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: malam ini juga
  rationale: Ungkapan ini alami dalam bahasa Indonesia sekaligus menyampaikan penekanan demonstratif ταύτῃ, yakni bahwa hal itu akan terjadi pada malam yang sedang berlangsung.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: sebelum ayam berkokok
  rationale: Konstruksi infinitif Yunani wajar dialihkan menjadi anak kalimat; nomina ἀλέκτορα tidak memakai artikel, dan bahasa Indonesia tidak menandai ketakrifan dengan artikel wajib.
- source_word: τρὶς
  choice: tiga kali
  rationale: Padanan modern, jelas, dan langsung untuk keterangan frekuensi ini.
- source_word: ἀπαρνήσῃ με
  choice: kamu akan menyangkal Aku
  rationale: Menyangkal merupakan padanan yang jelas dan mapan bagi ἀπαρνέομαι dalam konteks penyangkalan Petrus, tanpa memperluasnya secara interpretatif menjadi memutus hubungan atau tidak mengakui sebagai milik.
theological_decisions:
- issue: Rumus pengantar Ἀμὴν λέγω σοι
  choice: Sesungguhnya Aku berkata kepadamu
  alternative: Amin, Aku berkata kepadamu; Aku menegaskan kepadamu
  rationale: Pilihan ini mempertahankan sifat pernyataan yang khidmat dan berwibawa, tetapi tidak mengimpor asosiasi liturgis dari kata “Amin” atau menguraikannya secara interpretatif.
- issue: Objek penyangkalan dalam ἀπαρνήσῃ με
  choice: menyangkal Aku
  alternative: tidak mengakui Aku; menyangkal bahwa kamu mengenal Aku
  rationale: Teks hanya menyatakan bahwa Petrus akan menyangkal Yesus. Terjemahan tidak menambahkan isi khusus penyangkalan yang baru dijelaskan oleh konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” mengikuti konvensi umum Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus. “Malam ini juga” dipilih agar penekanan demonstratif tetap terasa tanpa menghasilkan ungkapan kaku.
