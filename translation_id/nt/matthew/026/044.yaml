  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: id
  text: Lalu Ia meninggalkan mereka dan pergi lagi untuk berdoa untuk ketiga kalinya, dengan mengucapkan perkataan yang sama lagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: Ia meninggalkan mereka
  rationale: Partisip aoris ἀφεὶς menyatakan tindakan meninggalkan para murid; klausa berverba finit lebih alami dalam narasi bahasa Indonesia.
- source_word: πάλιν ἀπελθὼν
  choice: pergi lagi
  rationale: πάλιν menandai pengulangan, sedangkan ἀπελθὼν menyatakan gerak menjauh dari para murid.
- source_word: προσηύξατο ἐκ τρίτου
  choice: berdoa untuk ketiga kalinya
  rationale: Ungkapan ἐκ τρίτου secara idiomatis berarti tindakan yang dilakukan pada kesempatan ketiga.
- source_word: τὸν αὐτὸν λόγον
  choice: perkataan yang sama
  rationale: λόγον berbentuk tunggal dan dalam konteks ini menunjuk pada ucapan atau isi doa yang sama; 'perkataan yang sama' mempertahankan bentuk tunggal tanpa terdengar terlalu teknis.
- source_word: εἰπὼν πάλιν
  choice: dengan mengucapkan ... lagi
  rationale: Partisip εἰπών menerangkan cara atau isi doa, dan πάλιν kedua dipertahankan untuk mencerminkan penekanan pengulangan dalam teks Yunani.
theological_decisions:
- issue: Pengulangan doa Yesus
  choice: Menyatakan baik kesempatan ketiga maupun pengucapan kembali perkataan yang sama.
  alternative: Menghilangkan kata 'lagi' yang terakhir demi kelancaran gaya.
  rationale: Teks Yunani memuat dua kemunculan πάλιν; mempertahankan keduanya menjaga penekanan naratif tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan partisip Yunani diubah menjadi rangkaian verba yang alami, sementara kedua penanda pengulangan tetap dipertahankan.
