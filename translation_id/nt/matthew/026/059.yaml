    reason: lexical_alternative
  revision_rationale: Revisi mengganti ungkapan yang hanya menyatakan vonis dengan “membunuh-Nya,” yang secara langsung mencerminkan θανατώσωσιν tanpa menentukan mekanisme pelaksanaannya. Frasa “terhadap Yesus” mempertahankan fungsi yudisial κατά tanpa menyarankan bahwa kesaksian itu benar-benar memberatkan. Catatan kaki dan penandanya tetap selaras dengan istilah yang diberi anotasi.
