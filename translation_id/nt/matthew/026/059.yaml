revisions:
- from: Para imam kepala dan seluruh Mahkamah Agama[a] terus mencari kesaksian palsu[b] yang memberatkan Yesus supaya mereka dapat menjatuhkan hukuman mati kepada-Nya.
  to: Para imam kepala dan seluruh Mahkamah Agama[a] terus mencari kesaksian palsu[b] terhadap Yesus supaya mereka dapat membunuh-Nya.
  rationale: Revisi mengganti ungkapan yang hanya menyatakan vonis dengan “membunuh-Nya,” yang secara langsung mencerminkan θανατώσωσιν tanpa menentukan mekanisme pelaksanaannya. Frasa “terhadap Yesus” mempertahankan fungsi yudisial κατά tanpa menyarankan bahwa kesaksian itu benar-benar memberatkan. Catatan kaki dan penandanya tetap selaras dengan istilah yang diberi anotasi.
