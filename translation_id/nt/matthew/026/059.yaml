review_pass:
  verdict: revise
  source_fidelity: Terjemahan dengan tepat menyampaikan subjek kolektif, pencarian yang berlangsung (ἐζήτουν), kesaksian palsu, dan tujuan para pemimpin. Namun, “menjatuhkan hukuman mati kepada-Nya” membatasi θανατώσωσιν pada tindakan menjatuhkan vonis, sedangkan verba Yunani itu menyatakan menyebabkan/menaruh ke dalam kematian, yakni membunuh atau menghukum mati. “Yang memberatkan Yesus” juga dapat dipahami sebagai kesaksian yang memang memberatkan secara substantif, bukan terutama kesaksian palsu yang diarahkan terhadap Yesus.
  naturalness: Bahasa draft umumnya baku dan jelas. “Terus mencari” wajar untuk imperfek. “Kesaksian palsu terhadap Yesus” lebih langsung dan lebih setia pada arah κατά daripada “yang memberatkan Yesus.”
  terminology: “Para imam kepala” tepat untuk ἀρχιερεῖς. “Seluruh Mahkamah Agama” adalah padanan pembaca-umum yang dapat dipertahankan, dengan catatan “Sanhedrin” yang memadai. “Kesaksian palsu” tepat untuk ψευδομαρτυρίαν.
  issues:
  - severity: medium
    issue: Padanan θανατώσωσιν terlalu menyempit menjadi penjatuhan vonis.
    rationale: “Menjatuhkan hukuman mati” terutama berarti menjatuhi seseorang hukuman/putusan mati; θανατώσωσιν menyatakan tujuan agar mereka membunuh atau menghukum mati Yesus. Terjemahan perlu mempertahankan hasil tindakan itu, bukan hanya tahap putusan.
  - severity: low
    issue: “Yang memberatkan Yesus” kurang langsung untuk κατὰ τοῦ Ἰησοῦ.
    rationale: Kata ini dapat mengesankan bukti yang sungguh-sungguh memberatkan. “Terhadap Yesus” menyatakan arah tuduhan/kesaksian tanpa menyiratkan validitasnya.
  revised_text: Para imam kepala dan seluruh Mahkamah Agama[a] terus mencari kesaksian palsu[b] terhadap Yesus supaya mereka dapat membunuh-Nya.
