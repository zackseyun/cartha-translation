  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: id
  text: Para imam kepala dan seluruh Mahkamah Agama[a] terus mencari kesaksian palsu[b] terhadap Yesus supaya mereka dapat membunuh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh Sanhedrin”. Istilah Yunani ini menunjuk kepada dewan penguasa Yahudi.
    reason: cultural_note
  - marker: b
    text: Atau “saksi palsu”. Istilah Yunani ini dapat menunjuk kepada kesaksian palsu ataupun saksi palsu dalam konteks hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: dan
  rationale: Kata penghubung ini berfungsi sebagai peralihan naratif ringan; 'dan' mempertahankan kesinambungan tanpa memberi kesan pertentangan atau penanda waktu yang terlalu kuat.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah baku dan tepat bagi kelompok pemimpin senior keimaman, bukan beberapa pemegang jabatan imam besar secara bersamaan.
- source_word: συνέδριον ὅλον
  choice: seluruh Mahkamah Agama
  rationale: '''Mahkamah Agama'' merupakan sebutan Indonesia yang mudah dipahami bagi dewan penguasa Yahudi dalam konteks persidangan; ''seluruh'' mencerminkan ὅλον.'
- source_word: ἐζήτουν
  choice: terus mencari
  rationale: Bentuk imperfek menunjukkan usaha yang sedang dan berulang dilakukan, sehingga aspek berlangsungnya dinyatakan dengan 'terus mencari'.
- source_word: ψευδομαρτυρίαν
  choice: kesaksian palsu
  rationale: Pilihan ini menyatakan isi kesaksian dalam konteks hukum dan menghindari kemungkinan bahwa 'saksi palsu' hanya menunjuk kepada orangnya.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: yang memberatkan Yesus
  rationale: Dalam konteks yudisial, κατά dengan genetif menunjuk pada kesaksian yang diarahkan untuk menentang atau mendakwa Yesus; ungkapan ini alami dalam bahasa hukum Indonesia.
- source_word: ὅπως
  choice: supaya
  rationale: Menyatakan tujuan secara jelas dan alami.
- source_word: θανατώσωσιν
  choice: mereka dapat menjatuhkan hukuman mati kepada-Nya
  rationale: Mencerminkan tujuan yudisial untuk menyebabkan kematian Yesus tanpa mempersempitnya menjadi mekanisme eksekusi tertentu.
theological_decisions:
- issue: Nuansa yudisial dari maksud para pemimpin
  choice: Usaha yang terus berlangsung untuk memperoleh kesaksian palsu digambarkan sebagai sarana agar mereka dapat menjatuhkan hukuman mati kepada Yesus.
  alternative: Mereka mencari saksi palsu agar dapat membunuh Yesus.
  rationale: Pilihan ini mempertahankan aspek imperfek ἐζήτουν dan tujuan dalam ὅπως...θανατώσωσιν, sekaligus menjaga latar persidangan tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Ungkapan 'Mahkamah Agama' dipakai sebagai istilah pembaca umum, disertai alternatif historis 'Sanhedrin' dalam catatan kaki. Kapitalisasi pronomina bagi Yesus mengikuti kelaziman penerbitan Alkitab Indonesia.
