id: MAT.26.46
reference: Matthew 26:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: id
  text: Bangunlah, mari kita pergi. Lihat, orang yang menyerahkan Aku[a] sudah dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, tindakan menyerahkan Yesus merupakan pengkhianatan; karena itu ungkapan ini juga dapat diterjemahkan “orang yang mengkhianati Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bangunlah
  rationale: Imperatif jamak ini ditujukan kepada para murid. “Bangunlah” langsung, wajar, dan sesuai dengan konteks mereka yang sebelumnya tertidur.
- source_word: ἄγωμεν
  choice: mari kita pergi
  rationale: Subjungtif orang pertama jamak berfungsi sebagai ajakan; “mari kita pergi” merupakan padanan alami dalam bahasa Indonesia.
- source_word: ἰδού
  choice: Lihat
  rationale: Partikel ini menarik perhatian pada perkembangan yang mendesak. “Lihat” mempertahankan daya serunya tanpa nada arkais.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfektum menyatakan bahwa orang itu telah mendekat dan kini berada dekat; “sudah dekat” mengungkapkan keadaan kini beserta nuansa tercapainya pendekatan.
- source_word: ὁ παραδιδούς με
  choice: orang yang menyerahkan Aku
  rationale: Partisip substantival ini secara konkret menunjuk orang yang sedang menyerahkan Yesus kepada pihak berwenang. Pilihan ini mempertahankan ungkapan sumber dan tidak membatasi maknanya hanya pada label “pengkhianat”.
theological_decisions:
- issue: Makna παραδιδούς dalam kisah sengsara
  choice: orang yang menyerahkan Aku
  alternative: pengkhianat-Ku; orang yang mengkhianati Aku
  rationale: Dalam konteks ini tindakan menyerahkan Yesus memang merupakan pengkhianatan, tetapi verba Yunani secara konkret berarti “menyerahkan.” Teks utama mempertahankan tindakan konkret sekaligus membiarkan konteks menyampaikan watak pengkhianatannya.
translation_notes:
  register: Bahasa langsung, mendesak, dan bermartabat. “Aku” mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus dalam terjemahan Alkitab bahasa Indonesia; tanda baca dibuat alami bagi pembaca modern.
