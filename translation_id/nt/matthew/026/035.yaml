  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: id
  text: Petrus berkata kepada-Nya, “Sekalipun aku harus mati bersama-Mu, aku sama sekali tidak akan menyangkal-Mu.” Demikian pula semua murid berkata demikian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai present historis, tetapi bentuk lampau naratif tersirat secara alami dalam bahasa Indonesia melalui konteks; 'berkata' mempertahankan fungsi naratif tanpa kekakuan.
- source_word: Κἂν
  choice: Sekalipun
  rationale: κἄν memperkenalkan syarat konsesif; 'sekalipun' mengungkapkan penegasan Petrus secara alami dan bermartabat.
- source_word: δέῃ με
  choice: aku harus
  rationale: Kata kerja ini menyatakan keharusan; 'aku harus' ringkas dan tepat.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: mati bersama-Mu
  rationale: Frasa ini menyatakan kematian yang dialami bersama Yesus; susunan tersebut alami dalam bahasa Indonesia.
- source_word: οὐ μή
  choice: sama sekali tidak akan
  rationale: Gabungan οὐ μή merupakan negasi yang sangat tegas. 'Sama sekali tidak akan' mempertahankan daya penegasannya tanpa menambahkan tafsiran.
- source_word: ἀπαρνήσομαι
  choice: menyangkal Engkau
  rationale: '''Menyangkal'' merupakan padanan yang jelas dan mapan dalam konteks penyangkalan Petrus terhadap Yesus.'
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Padanan ini secara langsung menyampaikan arti 'dengan cara yang sama/demikian pula' dan sesuai dengan register naratif.
- source_word: πάντες οἱ μαθηταὶ
  choice: semua murid yang lain
  rationale: '''Yang lain'' dibuat eksplisit secara kontekstual karena Petrus sendiri termasuk murid, sedangkan klausa ini merujuk kepada seluruh murid selain Petrus yang turut berkata demikian.'
- source_word: εἶπαν
  choice: mengatakan
  rationale: Padanan sederhana ini mempertahankan makna dasar λέγω dan menghindari nuansa tambahan.
theological_decisions:
- issue: Kekuatan pernyataan Petrus bahwa ia tidak akan menyangkal Yesus
  choice: Negasi οὐ μή diterjemahkan 'sama sekali tidak akan'.
  alternative: '''tidak akan pernah'' atau ''pasti tidak akan'''
  rationale: Bahasa Yunani menyatakan negasi masa depan yang sangat tegas. Pilihan ini mempertahankan keyakinan diri Petrus dan ketegangan naratif tanpa menjelaskan atau melunakkan kegagalannya kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang mengacu kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena kekuatan οὐ μή dapat disampaikan langsung dan alami dalam teks utama.
