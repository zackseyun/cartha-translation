  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: id
  text: 'Dan sekali lagi ia menyangkal dengan sumpah: “Aku tidak mengenal orang itu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, “Lalu” alami dalam bahasa Indonesia dan menyambungkan tindakan ini dengan peristiwa sebelumnya tanpa memberi penafsiran tambahan yang berarti.
- source_word: πάλιν
  choice: sekali lagi
  rationale: Menandai pengulangan penyangkalan Petrus dengan jelas dan alami.
- source_word: ἠρνήσατο
  choice: ia menyangkal
  rationale: “Menyangkal” menyampaikan arti menolak atau membantah isi yang kemudian dinyatakan dalam kutipan; bahasa Indonesia tidak memerlukan objek tambahan sebelum kutipan.
- source_word: μετὰ ὅρκου
  choice: dengan bersumpah
  rationale: Menggambarkan bahwa penyangkalan itu disertai sumpah, tanpa menyiratkan suasana persidangan resmi seperti yang mungkin ditimbulkan oleh “di bawah sumpah”.
- source_word: ὅτι
  choice: ','
  rationale: Kata ini memperkenalkan isi penyangkalan; dalam bahasa Indonesia modern, tanda koma diikuti kutipan langsung menyampaikan hubungan tersebut secara alami.
- source_word: Οὐκ οἶδα
  choice: Aku tidak mengenal
  rationale: Dalam konteks hubungan dengan seseorang, οἶδα paling alami diterjemahkan “mengenal,” bukan sekadar mengetahui suatu fakta.
- source_word: τὸν ἄνθρωπον
  choice: orang itu
  rationale: Ungkapan ini mempertahankan sebutan tidak langsung dan berjarak yang dipakai Petrus, tanpa menggantinya dengan nama Yesus atau kata ganti.
theological_decisions:
- issue: Rujukan ungkapan τὸν ἄνθρωπον dalam penyangkalan Petrus
  choice: Mempertahankan ungkapan “orang itu”
  alternative: “dia” atau “Yesus”
  rationale: Teks Yunani secara eksplisit memakai sebutan “orang itu.” Mempertahankannya menjaga nada menjauhkan diri dalam ucapan Petrus dan tidak memasukkan penjelasan tafsir ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” sesuai dengan ujaran langsung Petrus, sedangkan susunan “dengan bersumpah” menghindari kesan sumpah dalam proses hukum formal.
