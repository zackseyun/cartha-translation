  source_fidelity: 'Draf pada dasarnya setia: πάλιν diterjemahkan “sekali lagi,” ἠρνήσατο sebagai “menyangkal,” dan τὸν ἄνθρωπον dipertahankan sebagai “orang itu,” tanpa menggantikannya dengan “Yesus.” Namun, catatan kaki yang ada keliru menyebut “manusia itu” sebagai terjemahan harfiah dan secara tidak perlu mengidentifikasi rujukannya sebagai Yesus.'
