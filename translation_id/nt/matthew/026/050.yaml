  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: id
  text: Tetapi Yesus berkata kepadanya, “Kawan, lakukanlah apa yang menjadi tujuan kedatanganmu.”[a] Lalu mereka mendekati Yesus, memegang-Nya, dan menangkap-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kawan, untuk apa kamu datang?” Ungkapan Yunaninya ringkas dan dapat dipahami sebagai pertanyaan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Kawan
  rationale: Sapaan kepada Yudas ini bernada terkendali dan tidak harus menyiratkan keakraban. “Kawan” alami dalam bahasa Indonesia dan mempertahankan jarak yang dapat terkandung dalam sapaan Yunani ini.
- source_word: ἐφ’ ὃ πάρει
  choice: lakukanlah apa yang menjadi tujuan kedatanganmu
  rationale: Ungkapan Yunani ini sangat ringkas dan secara sintaksis ambigu. Terjemahan utama menyampaikan pemahaman idiomatis bahwa Yesus mempersilakan atau menyingkapkan tujuan Yudas, sedangkan kemungkinan sebagai pertanyaan dipertahankan dalam catatan kaki.
- source_word: προσελθόντες
  choice: mereka maju
  rationale: Partisip aoris ini menyatakan bahwa rombongan penangkap bergerak mendekati Yesus sebelum bertindak.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: menangkap Yesus
  rationale: Ungkapan harfiah tentang menaruh tangan atas seseorang merupakan idiom tindakan fisik yang bermusuhan. “Menangkap Yesus” menyampaikan maknanya secara alami tanpa kekakuan harfiah.
- source_word: ἐκράτησαν αὐτόν
  choice: menahan-Nya
  rationale: Kata ini menunjukkan bahwa mereka memegang dan menguasai Yesus setelah menangkap-Nya. “Menahan-Nya” mempertahankan urutan tindakan tanpa menambahkan nuansa prosedur hukum formal.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan dari tindakan Yudas kepada tanggapan Yesus.
theological_decisions:
- issue: Makna sapaan dan jawaban Yesus kepada Yudas
  choice: Kawan, lakukanlah apa yang menjadi tujuan kedatanganmu.
  alternative: Kawan, untuk apa kamu datang?
  rationale: Teks Yunani mempertahankan ketegangan antara sapaan Yesus yang terkendali dan maksud pengkhianatan Yudas. Klausa sesudah sapaan itu ringkas serta dapat dipahami sebagai ungkapan seperti perintah atau sebagai pertanyaan; terjemahan utama memilih pemahaman idiomatis pertama dan mencatat yang kedua tanpa memutuskannya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Sapaan “Kawan” dipilih agar tidak terlalu akrab; “menangkap ... dan menahan” menghindari ungkapan harfiah yang kurang alami sambil mempertahankan dua tahap tindakan dalam teks Yunani.
