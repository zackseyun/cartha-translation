  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: id
  text: Kemudian Ia berkata kepada mereka, “Jiwa-Ku sangat sedih[a], sampai pada titik kematian.[b] Tinggallah di sini dan tetaplah berjaga-jaga bersama-Ku.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “amat berdukacita,” “sangat berduka,” atau “diliputi kesedihan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bahkan sampai mati.” Ungkapan ini menyatakan kesedihan yang sangat ekstrem.
    reason: lexical_alternative
  - marker: c
    text: Atau “tetaplah terjaga bersama-Ku.” Kata Yunani ini dapat berarti tetap tidak tidur maupun tetap waspada.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Penanda urutan waktu ini secara alami melanjutkan alur narasi dalam bahasa Indonesia.
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Bahasa Indonesia tidak menandai kala pada verba seperti bahasa Yunani; bentuk ini alami dalam narasi dan tidak perlu memaksakan perbedaan antara present historis dan lampau.
- source_word: Περίλυπός
  choice: sangat berdukacita
  rationale: Mengungkapkan kesedihan atau tekanan batin yang amat mendalam dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: ἡ ψυχή μου
  choice: Jiwa-Ku
  rationale: Mempertahankan nomina eksplisit ψυχή dan bobot ungkapan tentang penderitaan batin Yesus, tanpa menjadikannya pernyataan teknis mengenai susunan manusia.
- source_word: ἕως θανάτου
  choice: bahkan sampai mati
  rationale: Mempertahankan ungkapan ringkas tentang kesedihan yang mencapai batas kematian, sekaligus membiarkan nuansa tepatnya tetap terbuka.
- source_word: μείνατε ὧδε
  choice: Tinggallah di sini
  rationale: Menyampaikan perintah agar para murid tetap berada di tempat itu dengan ungkapan Indonesia yang alami.
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Mencakup kewaspadaan yang terus-menerus dan, dalam konteks Getsemani, juga kemungkinan makna harfiah tetap terjaga.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Secara langsung menyatakan penyertaan yang diminta Yesus.
theological_decisions:
- issue: Pemaknaan ψυχή dalam perkataan Yesus
  choice: Jiwa-Ku
  alternative: Aku
  rationale: Nomina ψυχή dipertahankan agar kedalaman penderitaan batin Yesus tidak diratakan menjadi sekadar kata ganti, tetapi tanpa menetapkan antropologi teknis yang melampaui teks.
- issue: Daya ungkapan ἕως θανάτου
  choice: bahkan sampai mati
  alternative: sampai pada titik kematian
  rationale: Pilihan utama mempertahankan ketegangan antara tingkat kesedihan yang ekstrem dan kedekatannya dengan kematian; catatan kaki menjelaskan kemungkinan pemaknaannya tanpa menutup ambiguitas.
- issue: Makna γρηγορεῖτε dalam konteks
  choice: tetaplah berjaga-jaga
  alternative: tetaplah terjaga
  rationale: Perintah ini dapat menunjuk baik pada tidak tertidur maupun pada kewaspadaan. Teks utama memakai ungkapan yang lebih luas, sedangkan makna harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Ia” dan akhiran “-Ku” memakai kapitalisasi penghormatan yang lazim dalam terjemahan Alkitab bahasa Indonesia. “Berjaga-jaga” dipilih untuk mempertahankan perpaduan antara tetap terjaga dan kewaspadaan.
