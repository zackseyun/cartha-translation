  source_fidelity: 'Terjemahan secara akurat mencerminkan unsur-unsur Yunani: παραδιδοὺς sebagai “yang mengkhianati,” σημεῖον sebagai “tanda,” klausa relatif tak tentu Ὃν ἂν φιλήσω sebagai “Orang yang akan kucium,” penegasan αὐτός dalam “Dialah orangnya,” dan imperatif κρατήσατε sebagai “Tangkap Dia.” Bentuk “telah memberi” wajar untuk ἔδωκεν dalam konteks naratif ini.'
