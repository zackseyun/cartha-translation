id: MAT.26.48
reference: Matthew 26:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: id
  text: Orang yang mengkhianati Dia itu telah memberi mereka suatu tanda[a] dengan berkata, “Orang yang akan kucium, Dialah orangnya. Tangkap Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “isyarat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: yang mengkhianati
  rationale: Dalam konteks kisah sengsara, bentuk ini merujuk pada tindakan Yudas menyerahkan Yesus secara khianat. Pilihan ini menyampaikan daya moral konteks tanpa mengaburkan arti dasar ‘menyerahkan’.
- source_word: σημεῖον
  choice: tanda
  rationale: Kata ini menunjuk pada tanda pengenal yang telah disepakati; ‘tanda’ alami dalam bahasa Indonesia dan tetap mencakup fungsi sebagai isyarat.
- source_word: Ὃν ἂν φιλήσω
  choice: Orang yang akan kucium
  rationale: Konstruksi relatif tak tentu dengan ἄν dan subjungtif aoris mengidentifikasi orang melalui tindakan yang akan dilakukan. Bentuk Indonesia ini alami dan mempertahankan daya pengenal tersebut.
- source_word: φιλήσω
  choice: akan kucium
  rationale: Verba ini secara langsung menyatakan tindakan mencium sebagai tanda pengenal; tidak perlu diperluas menjadi ‘kusapa dengan ciuman’.
- source_word: αὐτός ἐστιν
  choice: Dialah orangnya
  rationale: Ungkapan ini menegaskan identitas Yesus. ‘Dialah orangnya’ ringkas, idiomatis, dan mempertahankan penekanan pada αὐτός.
- source_word: κρατήσατε
  choice: Tangkap
  rationale: Dalam konteks penangkapan, kata ini berarti memegang atau menguasai dengan kuat. ‘Tangkap’ menyampaikan tindakan fisik dan maksud penahanan tanpa menambahkan formalitas prosedural.
theological_decisions:
- issue: Daya moral παραδιδοὺς ketika merujuk kepada Yudas
  choice: Diterjemahkan ‘orang yang mengkhianati Dia’
  alternative: orang yang menyerahkan Dia
  rationale: Konteks langsung menggambarkan penyerahan Yesus oleh Yudas sebagai pengkhianatan. Terjemahan utama menyampaikan penilaian naratif itu, sedangkan arti dasar verba dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Penanda [a] ditempatkan sesudah ‘tanda’, sesuai alternatif leksikal σημεῖον. Data konsultasi Inggris tampaknya menukar isi catatan a dan b; draf ini menautkan catatan hanya pada kata yang tepat dan tidak memberi catatan yang salah pada ‘Dialah orangnya’.
