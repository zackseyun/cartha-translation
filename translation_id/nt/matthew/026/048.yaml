  terminology: “Mengkhianati” tepat dalam konteks tindakan Yudas tanpa memaksakan penafsiran doktrinal. “Tanda” tepat untuk σημεῖον, dan catatan “isyarat” adalah alternatif leksikal yang relevan. Kapitalisasi “Dia” konsisten dengan kebiasaan editorial Alkitab Indonesia.
