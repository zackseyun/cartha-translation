  naturalness: Bahasa umumnya baku dan alami. “Domba-domba dari kawanan itu” lebih jelas dan idiomatis untuk hubungan yang dinyatakan teks sumber daripada “domba-domba dalam kawanan itu.”
  terminology: “Tersandung,” “gembala,” dan “tercerai-berai” mempertahankan metafora penting tanpa memaksakan pembacaan teologis tertentu. Catatan leksikal perlu membedakan alternatif makna yang benar-benar bersifat leksikal dari penerapan kontekstual berupa meninggalkan Yesus.
