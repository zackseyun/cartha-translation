  - severity: low
    issue: Catatan a mencantumkan “akan berpaling” sebagai alternatif langsung.
    rationale: “Berpaling” merupakan penyimpulan kontekstual yang mungkin mengenai tindakan para murid, bukan padanan leksikal langsung yang setara dengan σκανδαλισθήσεσθε. Catatan sebaiknya menyatakan makna kontekstual itu sebagai implikasi, bukan sebagai alternatif kata demi kata.
