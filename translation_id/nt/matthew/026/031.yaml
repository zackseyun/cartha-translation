id: MAT.26.31
reference: Matthew 26:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: id
  text: 'Kemudian Yesus berkata kepada mereka, “Malam ini kamu semua akan tersandung karena Aku[a], sebab ada tertulis: ‘Aku akan memukul gembala itu, dan domba-domba dari kawanan itu akan tercerai-berai.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini juga dapat berarti “jatuh,” “dibuat tersandung,” atau “menjadi terguncang.” Dalam konteks ini, Yesus meramalkan bahwa murid-murid akan meninggalkan-Nya pada malam itu; kata tersebut tidak dengan sendirinya menyatakan kemurtadan final.
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Zakharia 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai kelanjutan urutan peristiwa secara alami dalam narasi Indonesia.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani berfungsi menghidupkan narasi. Bahasa Indonesia tidak wajib membedakan bentuk kini dan lampau pada verba, sehingga 'berkata' mempertahankan fungsi naratifnya tanpa ungkapan yang janggal.
- source_word: Πάντες ὑμεῖς
  choice: kamu semua
  rationale: Mempertahankan penekanan ganda pada seluruh murid yang hadir.
- source_word: σκανδαλισθήσεσθε
  choice: akan tersandung
  rationale: '''Tersandung'' mempertahankan metafora dan keluasan makna verba Yunani. Konteks menunjukkan bahwa yang dimaksud mencakup kegagalan kesetiaan dan tercerai dari Yesus pada malam itu, tetapi terjemahan utama tidak menyempitkannya menjadi kemurtadan final.'
- source_word: ἐν ἐμοὶ
  choice: karena Aku
  rationale: Dalam konstruksi ini, frasa tersebut menyatakan bahwa Yesus—khususnya apa yang akan menimpa-Nya—menjadi sebab atau kesempatan mereka tersandung. Ungkapan ini alami dan tetap mempertahankan ketegangan relasional teks.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: Malam ini
  rationale: Padanan Indonesia yang alami dan langsung untuk keterangan waktu tersebut.
- source_word: γέγραπται γάρ
  choice: sebab ada tertulis
  rationale: Rumus lazim untuk memperkenalkan kutipan Kitab Suci dan mempertahankan aspek hasil yang tetap berlaku dari bentuk perfek pasif.
- source_word: Πατάξω
  choice: Aku akan memukul
  rationale: Menyampaikan arti dasar verba tanpa menambahkan secara eksplisit akibat seperti kematian yang tidak dinyatakan oleh kata itu sendiri.
- source_word: τὸν ποιμένα
  choice: gembala itu
  rationale: Mempertahankan metafora dan bentuk definit sumber secara wajar dalam bahasa Indonesia.
- source_word: διασκορπισθήσονται
  choice: akan tercerai-berai
  rationale: Padanan pasif yang alami bagi penghamburan kawanan dan mempertahankan gambaran profetis.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: domba-domba dalam kawanan itu
  rationale: Mempertahankan baik unsur 'domba-domba' maupun 'kawanan' tanpa menghasilkan konstruksi Indonesia yang kaku.
theological_decisions:
- issue: Makna σκανδαλισθήσεσθε dalam hubungan dengan Yesus
  choice: Para murid akan tersandung karena Yesus, dalam konteks berupa kegagalan kesetiaan dan meninggalkan-Nya pada malam itu.
  alternative: Sekadar merasa tersinggung oleh Yesus, atau murtad secara final.
  rationale: Konteks penangkapan dan kutipan tentang tercerai-berainya domba menunjuk pada ditinggalkannya Yesus. Namun, 'tersandung' mempertahankan rentang metaforis kata Yunani dan tidak memaksakan kategori teologis tentang kemurtadan final.
- issue: Kini historis λέγει
  choice: '''berkata'' tanpa penanda waktu tambahan'
  alternative: '''lalu berkatalah'' atau bentuk yang secara eksplisit meniru kala kini'
  rationale: Verba Indonesia tidak berinfleksi menurut kala; bentuk sederhana ini alami sekaligus sesuai dengan fungsi naratif teks Yunani.
- issue: Pelaku dalam kutipan 'Aku akan memukul'
  choice: Mempertahankan orang pertama tanpa menjelaskan identitas pelaku di dalam teks utama.
  alternative: Menjelaskan secara eksplisit bahwa Allah adalah pelakunya.
  rationale: Kutipan mempertahankan suara orang pertama dari Zakharia. Menambahkan identitas pelaku dalam teks utama akan menafsirkan sesuatu yang dibiarkan tersirat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Metafora 'tersandung', 'gembala', dan kawanan domba dipertahankan karena penting bagi hubungan antara nubuat dan peristiwa yang segera menyusul.
