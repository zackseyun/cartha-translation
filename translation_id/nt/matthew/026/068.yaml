  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: id
  text: 'sambil berkata, “Bernubuatlah kepada kami, hai Mesias[a]: siapakah yang memukul Engkau?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός di sini digunakan sebagai gelar dalam sapaan langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: sambil berkata
  rationale: Partisipel kini ini mengantar ucapan para pengolok dan menunjukkan tindakan yang berlangsung bersamaan; bentuk ini alami dalam bahasa Indonesia.
- source_word: Προφήτευσον
  choice: Bernubuatlah
  rationale: Imperatif aoris ini merupakan tuntutan bernada mengejek agar Yesus memakai kemampuan kenabian untuk mengenali orang yang memukul-Nya. Bentuk verba dipertahankan tanpa parafrasa penjelas.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Pronomina datif ini menunjukkan pihak yang diminta menerima nubuat tersebut.
- source_word: χριστέ
  choice: hai Mesias
  rationale: Bentuk vokatif Χριστός berfungsi sebagai gelar sapaan. “Mesias” menyampaikan arti gelar itu, sedangkan “hai” menandai sapaan langsung secara jelas dan wajar.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Siapakah yang memukul Engkau?
  rationale: Partisipel substantival ὁ παίσας menunjuk kepada orang yang melakukan pukulan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan pertanyaan tentang identitas pelaku.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini χριστέ adalah bentuk vokatif dan jelas dipakai sebagai gelar dalam ejekan, bukan terutama sebagai unsur nama. “Mesias” mempertahankan makna gelar tersebut; alternatif tradisional “Kristus” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Engkau” dipakai untuk sapaan kepada Yesus, sementara tanda seru menampilkan kuatnya perintah ejekan tanpa menambahkan makna yang tidak ada dalam sumber.
