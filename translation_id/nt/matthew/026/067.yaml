  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: id
  text: Lalu mereka meludahi wajah-Nya dan meninju-Nya, sedangkan yang lain menampar-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “menampar” dapat juga berarti “memukul dengan tangan terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai peristiwa berikutnya dalam urutan narasi; “Lalu” alami dan ringkas dalam bahasa Indonesia.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: meludahi wajah-Nya
  rationale: Ungkapan Yunani secara harfiah memakai “ke wajah-Nya,” tetapi secara idiomatis menggambarkan tindakan meludah langsung pada wajah; “meludahi wajah-Nya” menyampaikan penghinaan itu secara alami.
- source_word: ἐκολάφισαν αὐτόν
  choice: meninju-Nya
  rationale: κολαφίζω menunjuk pada pukulan dengan kepalan tangan; “meninju” konkret, jelas, dan wajar dalam bahasa Indonesia modern.
- source_word: οἱ δὲ ἐράπισαν
  choice: sedangkan yang lain menampar-Nya
  rationale: Artikel substantival οἱ menunjukkan kelompok lain, sementara ῥαπίζω lazimnya berarti memukul dengan tangan terbuka atau menampar. Objek “-Nya” dipasok dari konteks.
- source_word: δέ
  choice: sedangkan
  rationale: Menandai peralihan ringan sekaligus membedakan tindakan kelompok lain, tanpa memberi pertentangan yang terlalu kuat.
theological_decisions:
- issue: Penggambaran penganiayaan terhadap Yesus di hadapan Mahkamah Agama
  choice: 'Tindakan-tindakannya diterjemahkan secara konkret: meludahi wajah, meninju, dan menampar.'
  alternative: Menggunakan istilah umum seperti “menganiaya” atau “memukuli.”
  rationale: Rincian teks menonjolkan penghinaan dan kekerasan fisik terhadap Yesus. Terjemahan konkret mempertahankan daya naratif tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk pronomina hormat “-Nya” digunakan untuk Yesus sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Penanda catatan ditempatkan setelah klausa yang diterangkannya.
