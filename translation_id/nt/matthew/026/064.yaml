id: MAT.26.64
reference: Matthew 26:64
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: id
  text: 'Yesus berkata kepadanya, “Engkau telah mengatakannya.[a] Namun, Aku berkata kepada kalian: Mulai sekarang kalian akan melihat Anak Manusia duduk di sebelah kanan Yang Mahakuasa[b] dan datang di atas awan-awan langit.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini merupakan jawaban idiomatis yang bersifat menegaskan; dapat juga diterjemahkan, “Engkau yang mengatakannya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kuasa”; suatu cara penuh hormat untuk merujuk kepada Allah.
    reason: cultural_note
  - marker: c
    text: Pernyataan ini mengacu kepada Daniel 7:13 dan Mazmur 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Engkau sendiri telah mengatakannya
  rationale: Mempertahankan bentuk jawaban idiomatis Yunani sebagai penegasan tanpa meratakannya menjadi jawaban lugas ‘Ya’; kata ‘sendiri’ membantu menyampaikan penekanan pada Σὺ.
- source_word: πλὴν
  choice: Namun
  rationale: Menandai peralihan tegas dari jawaban langsung kepada pernyataan khidmat berikutnya dalam bahasa Indonesia yang alami.
- source_word: ἀπ’ ἄρτι
  choice: Mulai sekarang
  rationale: Menyatakan titik awal keadaan baru sejak saat itu tanpa membatasi seluruh penggenapannya pada detik tersebut.
- source_word: ὄψεσθε
  choice: kalian akan melihat
  rationale: Menerjemahkan bentuk orang kedua jamak secara jelas; ‘melihat’ merupakan padanan alami bagi ὁράω.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan yang mapan serta gaung Daniel 7.
- source_word: καθήμενον
  choice: duduk
  rationale: Padanan langsung dan alami; dalam konteks duduk di sebelah kanan, makna penobatan dan kedudukan mulia tetap tersampaikan.
- source_word: ἐκ δεξιῶν
  choice: di sebelah kanan
  rationale: Ungkapan Indonesia yang wajar untuk posisi kehormatan, wewenang, dan kedekatan.
- source_word: τῆς δυνάμεως
  choice: Yang Mahakuasa
  rationale: Menyampaikan ungkapan penghormatan yang menunjuk kepada Allah dalam bahasa Indonesia yang dapat dipahami, tanpa langsung menggantinya dengan nama ‘Allah’; catatan kaki menjelaskan bentuk harfiahnya.
- source_word: ἐρχόμενον
  choice: datang
  rationale: Padanan langsung yang mempertahankan gerak dan gaung eskatologis Daniel 7.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: di atas awan-awan langit
  rationale: Mencerminkan ἐπί dengan bentuk jamak ‘awan-awan’ dan mempertahankan gambaran Daniel 7:13.
theological_decisions:
- issue: Daya jawaban Yesus Σὺ εἶπας kepada Imam Besar
  choice: 'Penegasan dengan mempertahankan bentuk ungkapan sumber: ‘Engkau sendiri telah mengatakannya.’'
  alternative: ‘Ya’; atau jawaban mengelak yang bukan penegasan
  rationale: Ungkapan itu berfungsi sebagai jawaban afirmatif, tetapi terjemahan ‘Ya’ menghilangkan susunan khas yang dipakai Yesus, sedangkan pemahaman sebagai pengelakan melemahkan konteks.
- issue: Rujukan τῆς δυνάμεως
  choice: Ungkapan penghormatan bagi Allah, diterjemahkan ‘Yang Mahakuasa’ dengan catatan bentuk harfiahnya
  alternative: ‘Kuasa’; ‘Allah’; ‘Sang Kuasa’
  rationale: Terjemahan ini menjaga rujukan ilahi dan register hormat sambil tetap memberi pembaca akses kepada bentuk Yunani melalui catatan kaki.
- issue: Cakupan ‘kalian akan melihat’ terhadap kedudukan dan kedatangan Anak Manusia
  choice: Membiarkan kedua gambaran—duduk di sebelah kanan dan datang di atas awan—tetap tergabung tanpa menetapkan satu skema waktu
  alternative: Seluruhnya digenapi segera; atau khusus menunjuk kepada kedatangan kedua pada masa depan
  rationale: Teks Yunani menempatkan kedua partisipel sebagai isi dari apa yang akan dilihat; terjemahan tidak boleh menyelesaikan ketegangan waktu yang memang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai untuk sapaan tunggal kepada Imam Besar, sedangkan ‘kalian’ menandai bentuk jamak ὑμῖν dan ὄψεσθε. Kapitalisasi ‘Aku’, ‘Anak Manusia’, dan ‘Yang Mahakuasa’ mengikuti fungsi sebutan dalam konteks.
