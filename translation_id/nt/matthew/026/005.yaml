  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: id
  text: Tetapi mereka terus berkata, “Bukan pada waktu perayaan[a], agar tidak timbul keributan[b] di antara orang banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hari raya.” Kata Yunani ἑορτή dalam konteks ini dapat berarti perayaan atau hari raya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kegemparan,” “kekacauan,” atau “kerusuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: mereka berkata
  rationale: Bentuk imperfek menggambarkan percakapan atau pertimbangan yang sedang berlangsung. Dalam narasi bahasa Indonesia, “mereka berkata” tetap alami, sedangkan nuansa berlangsungnya tampak dari konteks perundingan.
- source_word: δέ
  choice: Namun
  rationale: 'Menandai perkembangan yang sedikit berlawanan dengan rencana pada ayat sebelumnya: mereka berniat menangkap dan membunuh Yesus, tetapi membatasi waktunya.'
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Jangan pada waktu perayaan
  rationale: Ungkapan eliptis Yunani menyatakan keputusan atau larangan. “Pada waktu” menyampaikan fungsi temporal ἐν, sedangkan “perayaan” mencakup masa perayaan keagamaan yang dimaksud.
- source_word: ἵνα μὴ
  choice: supaya jangan
  rationale: Mempertahankan nuansa tujuan yang hendak dihindari, sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: θόρυβος
  choice: keributan
  rationale: Kata ini menunjuk pada kegemparan atau kekacauan umum. “Keributan” tidak terlalu mempersempit maknanya menjadi kerusuhan besar.
- source_word: γένηται
  choice: timbul
  rationale: Dalam konstruksi ini γίνομαι berarti terjadi atau muncul; “timbul” berpasangan secara alami dengan “keributan”.
- source_word: ἐν τῷ λαῷ
  choice: di antara rakyat
  rationale: λαός di sini menunjuk kepada khalayak atau rakyat yang berkumpul. “Di antara rakyat” mempertahankan cakupan sosial istilah tersebut tanpa menyamakannya begitu saja dengan kerumunan.
