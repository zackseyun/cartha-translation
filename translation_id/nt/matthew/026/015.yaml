  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: id
  text: Ia berkata, “Apa yang bersedia kalian berikan kepadaku, dan aku akan menyerahkan Dia[a] kepada kalian?” Mereka pun menimbang tiga puluh keping perak untuknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengkhianati Dia.” Verba Yunani ini dapat berarti “menyerahkan,” “membawa kepada,” atau, dalam konteks ini, “mengkhianati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Apa yang bersedia kalian berikan kepadaku?
  rationale: θέλω dapat menyatakan keinginan atau kesediaan. Dalam konteks tawar-menawar ini, ‘bersedia ... berikan’ menyampaikan unsur kemauan secara alami dalam bahasa Indonesia.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: Aku akan menyerahkan Dia kepada kalian
  rationale: παραδίδωμι pada dasarnya berarti menyerahkan atau memberikan ke dalam kuasa pihak lain. ‘Menyerahkan’ mempertahankan keluasan maknanya tanpa memasukkan penilaian moral ‘mengkhianati’ langsung ke dalam verba.
- source_word: οἱ δὲ
  choice: Lalu mereka
  rationale: δέ merupakan penghubung ringan; ‘lalu’ mengalir alami dan menunjukkan tanggapan berikutnya tanpa menekankan pertentangan.
- source_word: ἔστησαν αὐτῷ
  choice: mereka menetapkan baginya
  rationale: ἵστημι dalam konstruksi ini paling wajar dipahami sebagai menetapkan atau menentukan jumlah bagi Yudas. Terjemahan ini menghindari kepastian berlebihan bahwa uang itu langsung ditimbang atau dibayarkan, yang tidak dinyatakan secara tegas oleh bentuk Yunani.
- source_word: τριάκοντα ἀργύρια
  choice: tiga puluh keping perak
  rationale: ἀργύρια berarti uang atau keping-keping dari perak tanpa menyebut denominasi. ‘Keping perak’ alami dalam bahasa Indonesia dan tidak menambahkan jenis mata uang tertentu.
theological_decisions:
- issue: Makna παραδώσω dalam tawaran Yudas
  choice: menyerahkan Dia kepada kalian
  alternative: mengkhianati Dia kepada kalian
  rationale: Konteksnya jelas merupakan pengkhianatan, tetapi verba Yunani memiliki arti lebih luas, yakni ‘menyerahkan’. Terjemahan utama mempertahankan keluasan leksikal dan membiarkan konteks menyampaikan penilaian moralnya.
- issue: Tindakan para imam terhadap tiga puluh keping perak
  choice: menetapkan baginya
  alternative: menimbang baginya / membayarkan kepadanya
  rationale: ἔστησαν dapat menunjuk pada penetapan jumlah. Membaca tindakan itu sebagai penimbangan atau pembayaran konkret mungkin sesuai konteks, tetapi lebih spesifik daripada ungkapan sumber; karena itu alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ dipakai untuk bentuk jamak ὑμῖν, sedangkan ‘Dia’ merujuk kepada Yesus sesuai kebiasaan ortografis Indonesia. Struktur pertanyaan dan janji dipisahkan menjadi dua kalimat agar alami tanpa mengubah hubungan tawar-menawar dalam teks.
