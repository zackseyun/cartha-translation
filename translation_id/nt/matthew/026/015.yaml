  naturalness: Kalimat tanya dan janji sebaiknya tetap merupakan satu kalimat, sebagaimana dihubungkan oleh κἀγώ. "Mereka pun" merupakan penghubung naratif yang alami. "Menimbang tiga puluh keping perak untuknya" dapat dipahami dalam bahasa Indonesia modern, meskipun sedikit formal, dan sesuai register naratif Alkitab.
  terminology: '"Menyerahkan Dia kepada kalian" tepat untuk παραδίδωμι dan tidak memaksakan makna "mengkhianati" ke dalam teks utama. "Tiga puluh keping perak" akurat, idiomatis, dan tidak menambahkan denominasi. Kapitalisasi "Dia" konsisten dengan kebiasaan ortografis Kristen Indonesia.'
