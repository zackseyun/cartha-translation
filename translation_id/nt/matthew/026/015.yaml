  to: Ia berkata, “Apa yang bersedia kalian berikan kepadaku, dan aku akan menyerahkan Dia[a] kepada kalian?” Mereka pun menimbang tiga puluh keping perak untuknya.
  rationale: Revisi mengganti "menetapkan baginya" dengan "menimbang tiga puluh keping perak untuknya" agar tindakan konkret dalam ἔστησαν αὐτῷ dan konteks pembayaran dipertahankan, selaras dengan audit sumber bahasa Inggris. Pertanyaan dan tawaran Yudas dipulihkan sebagai satu kesatuan sintaksis. Catatan kaki dipindahkan ke παραδώσω untuk mencatat alternatif "mengkhianati" tanpa menjadikannya pembacaan utama.
