  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan seluruh unsur Yunani: genitif absolut yang menyatakan tindakan bersamaan (“Ketika mereka sedang makan”), formula penegasan Ἀμήν (“Sesungguhnya”), sapaan jamak, ungkapan partitif “salah seorang dari kalian,” serta bentuk masa depan παραδώσει. Pilihan “akan mengkhianati” tepat dalam konteks naratif ini, sementara catatan kaki secara memadai menjaga arti leksikal yang lebih luas, “akan menyerahkan aku.”'
  naturalness: Bahasanya alami dalam Bahasa Indonesia modern dan tetap memiliki register khidmat yang sesuai. “Kalian” dengan jelas menyampaikan bentuk jamak tanpa mengubah makna. Susunan kalimat dan tanda baca dapat dipahami dengan lancar.
  terminology: “Sesungguhnya” merupakan padanan yang mapan dan sesuai untuk Ἀμήν dalam ujaran Yesus. “Mengkhianati” menyampaikan daya kontekstual παραδώσει tanpa memaksakan penafsiran doktrinal; catatan kaki “menyerahkan” melestarikan alternatif harfiahnya. Pronomina huruf kecil konsisten dengan ejaan umum dan tidak memengaruhi kesetiaan sumber.
