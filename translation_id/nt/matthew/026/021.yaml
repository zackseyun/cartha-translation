id: MAT.26.21
reference: Matthew 26:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: id
  text: 'Ketika mereka sedang makan, ia berkata, “Sesungguhnya, aku berkata kepada kalian: salah seorang dari kalian akan mengkhianati aku[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “akan menyerahkan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: ketika mereka sedang makan
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: Ἀμὴν
  choice: sesungguhnya
  rationale: Dalam perkataan Yesus, kata ini menjadi penegasan khidmat yang mengawali pernyataan berwibawa; “sesungguhnya” menyampaikan fungsinya secara alami.
- source_word: λέγω ὑμῖν
  choice: aku berkata kepada kalian
  rationale: Terjemahan ini mempertahankan tindakan berbicara serta sapaan jamak ὑμῖν; “kalian” menghindari ketaksaan jumlah pada “kamu”.
- source_word: εἷς ἐξ ὑμῶν
  choice: salah seorang dari kalian
  rationale: Ungkapan partitif ini diterjemahkan secara jelas dan alami, dengan tetap mempertahankan bahwa orang tersebut berasal dari kelompok yang disapa.
- source_word: παραδώσει
  choice: akan mengkhianati
  rationale: Dalam konteks tindakan Yudas terhadap Yesus, penyerahan itu sekaligus merupakan pengkhianatan. Bentuk masa depan dipertahankan dengan “akan”; cakupan harfiah verba dijelaskan dalam catatan kaki.
- source_word: με
  choice: aku
  rationale: Pronomina objek orang pertama merujuk kepada pembicara dan diterjemahkan langsung.
theological_decisions:
- issue: Makna παραδώσει dalam kisah sengsara
  choice: akan mengkhianati
  alternative: akan menyerahkan
  rationale: Verba Yunani ini pada dasarnya dapat berarti “menyerahkan”, sedangkan konteks menonjolkan tindakan khianat oleh salah seorang dari kelompok Yesus. Teks utama memakai ungkapan Indonesia yang menyampaikan makna kontekstual, sementara catatan kaki mempertahankan keluasan leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. “Kalian” dipakai untuk memperjelas bahwa sapaan Yunani berbentuk jamak. Huruf kecil pada pronomina mengikuti ejaan umum dan tidak menambahkan penandaan teologis yang tidak terdapat dalam teks Yunani.
