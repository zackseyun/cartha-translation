source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: id
  text: Namun, semua ini telah terjadi supaya Kitab-kitab Suci para nabi digenapi. Kemudian semua murid meninggalkan Dia[a] dan melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meninggalkan Dia begitu saja”; dalam konteks ini, ἀφέντες dapat mengandung nuansa meninggalkan atau menanggalkan Dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Namun, semua ini
  rationale: Ungkapan ini menunjuk pada seluruh rangkaian peristiwa sebelumnya. “Namun” mempertahankan fungsi penghubung δέ tanpa membuat pertentangannya terlalu kuat.
- source_word: γέγονεν
  choice: telah terjadi
  rationale: Bentuk perfek menyatakan peristiwa yang sudah berlangsung dan tetap relevan pada saat itu; “telah terjadi” menyampaikan nuansa tersebut secara wajar.
- source_word: ἵνα πληρωθῶσιν
  choice: supaya ... digenapi
  rationale: Bentuk tujuan/hasil dan verba pasif dipertahankan tanpa menentukan secara berlebihan apakah unsur tujuan atau hasil yang lebih dominan.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Kitab Suci para nabi
  rationale: “Kitab Suci” menyatakan bahwa γραφαί merujuk pada tulisan-tulisan suci, sedangkan hubungan genitif “para nabi” dibiarkan ringkas sebagaimana dalam bahasa Yunani.
- source_word: τότε
  choice: Kemudian
  rationale: Kata ini menandai peristiwa berikutnya dalam urutan narasi.
- source_word: οἱ μαθηταὶ πάντες
  choice: semua murid
  rationale: Pilihan ini mempertahankan penekanan bahwa tidak seorang murid pun dikecualikan, tanpa menambahkan kata milik yang tidak dinyatakan secara eksplisit.
- source_word: ἀφέντες αὐτὸν
  choice: meninggalkan Dia
  rationale: Dalam konteks ini ἀφίημι berarti meninggalkan seseorang, dengan kemungkinan nuansa lebih kuat berupa penelantaran; pilihan utama tetap alami dan ringkas, sementara nuansa kuat dicatat dalam catatan kaki.
- source_word: ἔφυγον
  choice: melarikan diri
  rationale: Ungkapan ini secara tepat menyampaikan tindakan lari untuk menjauh, bukan sekadar pergi.
theological_decisions:
- issue: Penggenapan Kitab Suci para nabi
  choice: Mempertahankan rumusan eksplisit “supaya Kitab Suci para nabi digenapi.”
  alternative: supaya apa yang ditulis para nabi menjadi kenyataan
  rationale: Bahasa penggenapan merupakan unsur teologis yang eksplisit dan penting dalam Injil Matius. Rumusan pasif ini mempertahankan hubungan dengan Kitab Suci tanpa menguraikan secara tafsiran siapa pelaku penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan istilah “digenapi” dan hubungan ringkas “Kitab Suci para nabi.”
