  to: Seorang perempuan datang kepada Yesus sambil membawa sebuah wadah alabaster berisi minyak wangi yang sangat mahal.[a] Ia menuangkannya ke atas kepala Yesus ketika Yesus sedang makan sambil bersandar.[b]
  rationale: Revisi mengganti “pualam” dengan “alabaster” demi ketepatan bahan wadah, memakai susunan kalimat Indonesia modern, dan menerjemahkan ἀνακειμένου sebagai makan sambil bersandar tanpa menambahkan rincian yang tidak ada dalam teks. Penamaan Yesus tetap dipertahankan untuk kejelasan rujukan dalam ayat yang berdiri sendiri.
