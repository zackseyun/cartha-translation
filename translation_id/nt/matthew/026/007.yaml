  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Buli-buli' dipilih untuk wadah kecil tradisional, sedangkan catatan kaki menjelaskan alternatif bentuk wadah dan sifat μύρον. Rujukan pronomina diganti dengan 'Yesus' agar ayat mandiri jelas.
