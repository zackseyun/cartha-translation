source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: id
  text: Seorang perempuan datang kepada Yesus sambil membawa sebuah wadah alabaster berisi minyak wangi yang sangat mahal.[a] Ia menuangkannya ke atas kepala Yesus ketika Yesus sedang makan sambil bersandar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah wadah alabaster berisi salep harum yang sangat mahal.” Kata Yunani μύρον dapat berarti minyak harum atau salep, bukan hanya minyak wangi cair dalam pengertian modern.
    reason: lexical_alternative
  - marker: b
    text: Pada masa itu, orang biasanya makan sambil berbaring atau bersandar di sisi meja.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: Datanglah kepada Yesus
  rationale: Mengungkapkan gerak mendekat kepada seseorang secara wajar; nama Yesus dipakai untuk memperjelas rujukan pronomina dalam ayat yang berdiri sendiri.
- source_word: γυνή
  choice: seorang perempuan
  rationale: Nomina tunggal tak tentu tanpa keterangan identitas.
- source_word: ἔχουσα
  choice: yang membawa
  rationale: Dalam konteks ini menyatakan bahwa perempuan itu datang dengan wadah tersebut; lebih alami daripada terjemahan harfiah 'mempunyai'.
- source_word: ἀλάβαστρον μύρου
  choice: sebuah buli-buli pualam berisi minyak wangi
  rationale: ἀλάβαστρον menunjuk wadah kecil yang secara tradisional dibuat dari alabaster, sedangkan μύρον ialah minyak atau salep harum. 'Buli-buli pualam' mempertahankan bentuk wadah dan bahannya dalam bahasa Indonesia yang bermartabat.
- source_word: βαρυτίμου
  choice: yang sangat mahal
  rationale: Mempertahankan penekanan pada nilainya yang amat tinggi.
- source_word: κατέχεεν
  choice: menuangkannya
  rationale: Menyatakan tindakan menuang ke atas; akhiran -nya merujuk secara alami kepada minyak wangi.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ke atas kepala Yesus
  rationale: Mengungkapkan arah sekaligus tempat jatuhnya minyak; nama Yesus memperjelas rujukan.
- source_word: ἀνακειμένου
  choice: ketika Yesus sedang duduk bersandar untuk makan
  rationale: Menggambarkan posisi makan kuno, yaitu bersandar atau berbaring di sisi meja, tanpa menimbulkan kesan bahwa Yesus sekadar beristirahat.
