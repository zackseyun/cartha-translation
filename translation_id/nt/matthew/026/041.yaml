  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: id
  text: Berjaga-jagalah dan berdoalah supaya kamu tidak masuk ke dalam pencobaan.[a]; roh memang bersedia, tetapi daging lemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ujian” atau “cobaan berat”. Kata Yunani ini dapat menunjuk pada godaan untuk berbuat dosa ataupun pengalaman yang menguji seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Berjaga-jagalah
  rationale: Kata kerja imperatif jamak ini berarti tetap terjaga atau waspada. Dalam konteks para murid yang tertidur, “berjaga-jagalah” mempertahankan makna harfiah sekaligus kewaspadaan rohani.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Imperatif ini diterjemahkan dengan bentuk perintah Indonesia yang wajar dan jelas; konteksnya mendukung tindakan doa yang terus dilakukan.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: supaya kamu tidak masuk
  rationale: Ungkapan tujuan atau pencegahan ini mempertahankan metafora Yunani tentang “masuk” ke dalam pencobaan, tanpa menafsirkannya sebagai “jatuh”.
- source_word: πειρασμόν
  choice: pencobaan
  rationale: Dalam konteks ini istilah tersebut terutama menunjuk pada godaan yang dapat membawa para murid kepada kegagalan moral. Karena istilah Yunani juga dapat berarti ujian atau cobaan berat, cakupan itu dicatat dalam catatan kaki.
- source_word: τὸ μὲν πνεῦμα
  choice: Roh memang
  rationale: “Roh” mempertahankan istilah sumber, sedangkan “memang” menyampaikan kontras μέν ... δέ secara alami dalam bahasa Indonesia. Huruf kapital pada awal kalimat tidak menentukan apakah yang dimaksud roh manusia atau Roh Kudus.
- source_word: πρόθυμον
  choice: bersedia
  rationale: Kata ini menyatakan kesiapan, kerelaan, atau kemauan. “Bersedia” alami dalam konteks niat tulus para murid tanpa melebihkan nuansa kegairahan.
- source_word: ἡ δὲ σὰρξ
  choice: tetapi daging
  rationale: “Daging” mempertahankan metafora sumber dan ketegangan dengan “roh”. Pilihan yang lebih interpretatif seperti “tubuh” atau “natur manusia” tidak dimasukkan ke teks utama.
- source_word: ἀσθενής
  choice: lemah
  rationale: “Lemah” menyampaikan ketidakmampuan atau kerapuhan manusia secara ringkas dan tepat dalam kontras ini.
theological_decisions:
- issue: Acuan πνεῦμα
  choice: “Roh” dipertahankan tanpa penjelasan tambahan dalam teks utama
  alternative: roh batin atau kecenderungan batin manusia; Roh Kudus
  rationale: Konteks niat para murid yang tulus tetapi gagal karena kelemahan daging lebih mendukung roh atau kecenderungan batin manusia. Namun, bentuk bahasa Indonesia pada awal kalimat tidak memaksakan penafsiran itu melalui kapitalisasi khusus, sehingga ambiguitas yang mungkin tetap terjaga.
- issue: Makna σάρξ
  choice: daging
  alternative: tubuh; natur manusia; natur berdosa
  rationale: Di sini σάρξ menunjuk pada kerapuhan manusia dalam kontras dengan roh, bukan secara tegas pada kategori “natur berdosa”. “Daging” mempertahankan gambaran dan ketegangan teologis sumber tanpa menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “berjaga-jagalah” sudah lazim serta mencakup keadaan tetap terjaga dan sikap waspada. Kata ganti “kamu” dipakai untuk para murid sebagai kelompok dan tetap mudah dipahami oleh pembaca masa kini.
