  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: id
  text: Lalu ia mulai menyerukan kutukan dan bersumpah[a], “Aku tidak mengenal orang itu.” Saat itu juga, seekor ayam jantan berkokok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mulai menyerukan kutukan dan bersumpah.” Dalam konteks ini, mungkin ia menyerukan kutukan atas dirinya sendiri untuk menguatkan penyangkalannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan peristiwa berikutnya secara ringkas dan alami dalam narasi Indonesia.
- source_word: ἤρξατο
  choice: ia mulai
  rationale: Mempertahankan aspek ingresif yang menunjukkan meningkatnya penyangkalan Petrus.
- source_word: καταθεματίζειν
  choice: mengucapkan kutuk
  rationale: Mengungkap tindakan menyerukan kutuk tanpa secara tidak pasti menetapkan bahwa kutuk itu ditujukan kepada Yesus atau kepada orang lain; konteks sumpah memungkinkan kutuk atas diri sendiri.
- source_word: ὀμνύειν
  choice: bersumpah
  rationale: Padanan Indonesia yang alami untuk tindakan menguatkan pernyataan dengan sumpah.
- source_word: ὅτι
  choice: tanda petik langsung
  rationale: Memperkenalkan isi sumpah sebagai ujaran langsung secara jelas dalam bahasa Indonesia.
- source_word: Οὐκ οἶδα
  choice: Aku tidak mengenal
  rationale: Dalam konteks ini οἶδα menyatakan pengetahuan atau pengenalan terhadap seseorang; 'mengenal' paling alami untuk penyangkalan relasi pribadi.
- source_word: τὸν ἄνθρωπον
  choice: orang itu
  rationale: Mempertahankan rujukan tertentu kepada Yesus tanpa menambahkan unsur penunjuk yang lebih kuat daripada yang diperlukan.
- source_word: καὶ εὐθέως
  choice: Saat itu juga
  rationale: Menyampaikan kesegeraan peristiwa dan kaitannya yang langsung dengan ucapan Petrus dalam bahasa Indonesia yang lancar.
- source_word: ἀλέκτωρ
  choice: seekor ayam jantan
  rationale: Nomina Yunani tidak memakai artikel; bentuk tak tentu ini alami dan tepat dalam bahasa Indonesia.
- source_word: ἐφώνησεν
  choice: berkokok
  rationale: Kata kerja idiomatis bahasa Indonesia untuk bunyi ayam jantan.
theological_decisions:
- issue: Arah kutuk dalam καταθεματίζειν
  choice: Teks utama memakai ungkapan netral 'mengucapkan kutuk'; catatan menjelaskan kemungkinan kutuk atas diri sendiri sebagai penguat sumpah.
  alternative: Menyatakan secara eksplisit bahwa Petrus mengutuk dirinya sendiri, atau bahwa ia mengutuk Yesus.
  rationale: Bersama ὀμνύειν, kata ini sangat mungkin menunjuk pada kutuk yang diserukan atas diri sendiri untuk meneguhkan penyangkalan. Namun, objek kutuk tidak dinyatakan secara eksplisit dalam teks Yunani, sehingga terjemahan utama tidak seharusnya memastikan objeknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Ia' dipakai dalam narasi dan 'Aku' dalam kutipan langsung. Ungkapan 'mengucapkan kutuk' menghindari kesan bahwa Petrus sekadar berkata kasar, sedangkan catatan kaki mempertahankan penjelasan kontekstual tanpa menutup ambiguitas sumber.
