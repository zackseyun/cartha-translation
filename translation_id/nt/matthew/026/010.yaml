  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: id
  text: Namun, Yesus, yang mengetahui hal itu, berkata kepada mereka, “Mengapa kalian menyusahkan perempuan ini?[a] Ia telah melakukan suatu perbuatan yang indah[b] bagi-Ku.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mengapa kalian mengganggu perempuan ini?”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “suatu perbuatan yang baik” atau “suatu perbuatan yang mulia.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “terhadap-Ku” atau “kepada-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: karena mengetahui hal itu
  rationale: Partisip aoristus γινώσκω berfungsi secara sirkumstansial; “hal itu” menyatakan objek yang tersirat dari konteks, yaitu keluhan para murid.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang disertai kontras ringan dari keberatan para murid kepada tanggapan korektif Yesus.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Mengapa kalian menyusahkan perempuan ini?
  rationale: Ungkapan κόπους παρέχετε berarti menimbulkan kesusahan atau gangguan bagi seseorang. “Menyusahkan” menyampaikan teguran itu secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ἔργον καλὸν
  choice: suatu perbuatan yang indah
  rationale: καλός dapat mencakup kebaikan, keluhuran, kepatutan, dan keindahan. “Perbuatan yang indah” mempertahankan nuansa pujian yang lebih luas daripada sekadar penilaian moral.
- source_word: ἠργάσατο
  choice: telah melakukan
  rationale: Bentuk aoristus menyatakan tindakan yang sudah selesai; “telah melakukan” wajar dalam konteks tindakan lampau yang masih menjadi pokok pembicaraan.
- source_word: εἰς ἐμέ
  choice: bagi-Ku
  rationale: εἰς dengan orang dapat menyatakan arah atau hubungan. Dalam konteks tindakan yang dipersembahkan kepada Yesus, “bagi-Ku” paling alami dalam bahasa Indonesia tanpa menambahkan gagasan doktrinal.
theological_decisions:
- issue: Penilaian terhadap tindakan perempuan itu
  choice: suatu perbuatan yang indah
  alternative: suatu perbuatan yang baik; suatu perbuatan yang mulia
  rationale: Terjemahan ini mempertahankan pujian Yesus dan keluasan makna καλός tanpa menjadikan tindakan tersebut dasar bagi ajaran sakramental atau jasa keagamaan tertentu.
- issue: Arah atau manfaat tindakan itu dalam frasa εἰς ἐμέ
  choice: bagi-Ku
  alternative: terhadap-Ku; kepada-Ku
  rationale: “Bagi-Ku” alami dan sesuai konteks, sedangkan catatan kaki mempertahankan kemungkinan nuansa arah atau relasi yang ada dalam preposisi Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. “Kalian” memperjelas bahwa kata ganti Yunani berbentuk jamak. “Perempuan ini” memakai penunjuk yang alami dalam pertanyaan langsung dan tidak menambahkan penilaian negatif.
