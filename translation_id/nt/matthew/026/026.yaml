  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: id
  text: Ketika mereka sedang makan, Yesus mengambil roti. Sesudah mengucapkan berkat,[a] Ia memecahkan roti itu dan memberikannya kepada murid-murid. Ia berkata, “Ambillah, makanlah. Ini adalah tubuh-Ku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah mengucap syukur.” Kata Yunani yang dipakai secara harfiah merujuk pada tindakan memberkati; dalam konteks makan, tindakan ini juga dapat dipahami sebagai pengucapan syukur.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani berbunyi secara langsung, “Ini adalah tubuh-Ku.” Sebagian orang menafsirkannya sebagai “Ini berarti tubuh-Ku” atau “Ini melambangkan tubuh-Ku,” tetapi terjemahan mempertahankan kata-kata teks sumber tanpa menentukan tafsir tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Ketika mereka sedang makan
  rationale: Konstruksi genitif absolut menetapkan latar waktu dengan tindakan yang sedang berlangsung. δέ hanya berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan sebagai pertentangan.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: Yesus mengambil roti
  rationale: Partisip aoris diterjemahkan sebagai verba berurutan agar narasinya alami dalam bahasa Indonesia. ἄρτος cukup tepat diterjemahkan sebagai 'roti' tanpa memastikan bentuknya sebagai satu ketul.
- source_word: εὐλογήσας
  choice: Sesudah mengucapkan berkat
  rationale: Pilihan ini mempertahankan urutan tindakan dan tidak menambahkan objek yang tidak dinyatakan dalam bahasa Yunani. Dalam konteks ini tindakan tersebut juga dapat dipahami sebagai pengucapan syukur, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: ἔκλασεν
  choice: memecah-mecahkan roti itu
  rationale: Verba κλάω berarti memecahkan roti. Pengulangan 'roti itu' menjadikan acuannya jelas dan bentuk 'memecah-mecahkan' sesuai dengan tindakan membagi roti.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: memberikannya kepada murid-murid
  rationale: Partisip diterjemahkan sebagai verba sejajar demi alur bahasa Indonesia yang wajar. Tidak ditambahkan kata 'murid-murid-Nya' karena unsur kepunyaan tidak dinyatakan secara eksplisit.
- source_word: Λάβετε φάγετε
  choice: Ambillah, makanlah
  rationale: Dua imperatif aoris yang berurutan dipertahankan sebagai dua perintah langsung tanpa menambahkan kata sambung.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: Ini adalah tubuh-Ku
  rationale: Kopula ἐστιν diterjemahkan langsung sebagai 'adalah', tanpa menggantinya dengan tafsiran seperti 'berarti' atau 'melambangkan'.
theological_decisions:
- issue: Makna perkataan Yesus tentang roti dalam perjamuan
  choice: Ini adalah tubuh-Ku
  alternative: Ini berarti/melambangkan tubuh-Ku
  rationale: Teks Yunani memakai kopula sederhana ἐστιν. Terjemahan utama mempertahankan susunan sumber dan membiarkan ketegangan teologisnya tetap terbuka, tanpa menetapkan pandangan sakramental tertentu.
translation_notes:
  register: Bahasa yang dipakai bersifat modern, wajar, dan khidmat. Kalimat panjang Yunani dibagi menjadi beberapa kalimat Indonesia agar mudah dipahami, sementara urutan tindakannya tetap dipertahankan. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
