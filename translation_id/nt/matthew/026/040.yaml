  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: id
  text: Lalu ia datang kepada murid-murid dan mendapati mereka sedang tidur. Ia berkata kepada Petrus, “Jadi, tidak sanggupkah[a] kalian tetap terjaga[b] bersama aku selama satu jam?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak dapatkah”.
    reason: lexical_alternative
  - marker: b
    text: Atau “berjaga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: datang
  rationale: Bahasa Indonesia tidak menandai kala secara morfologis; bentuk “datang” dapat mempertahankan gerak narasi yang hidup tanpa memaksakan kala lampau.
- source_word: πρὸς τοὺς μαθητὰς
  choice: kepada murid-murid
  rationale: “Kepada” secara alami menyatakan arah gerak menuju orang-orang dalam konteks ini.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: mendapati mereka sedang tidur
  rationale: “Mendapati” sesuai dengan εὑρίσκει dalam konteks menemukan suatu keadaan, sedangkan “sedang tidur” mempertahankan sifat verbal partisip καθεύδοντας.
- source_word: λέγει τῷ Πέτρῳ
  choice: Ia berkata kepada Petrus
  rationale: Ungkapan ini alami dalam narasi Indonesia dan mempertahankan Petrus sebagai orang yang secara khusus menjadi lawan bicara.
- source_word: Οὕτως
  choice: Jadi
  rationale: Di sini οὕτως memperkenalkan pertanyaan bernada teguran atau keheranan; “Jadi” menyampaikan fungsi itu secara wajar dalam bahasa Indonesia modern.
- source_word: οὐκ ἰσχύσατε
  choice: tidak sanggupkah kalian
  rationale: “Sanggup” mempertahankan unsur kemampuan atau kekuatan dalam ἰσχύω. “Kalian” menyatakan dengan jelas bahwa bentuk verba Yunaninya adalah orang kedua jamak.
- source_word: μίαν ὥραν
  choice: selama satu jam
  rationale: Akusatif menyatakan jangka waktu; “selama satu jam” merupakan bentuk Indonesia yang jelas dan alami.
- source_word: γρηγορῆσαι
  choice: tetap terjaga
  rationale: Dalam kontras langsung dengan para murid yang sedang tidur, “tetap terjaga” mengungkapkan makna konkret γρηγορέω, sementara nuansa kewaspadaan dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: μετ’ ἐμοῦ
  choice: bersama aku
  rationale: Ungkapan ini secara langsung dan alami menyatakan penyertaan yang dimaksud oleh μετ’ ἐμοῦ.
theological_decisions:
- issue: Yesus berbicara kepada Petrus, tetapi ἰσχύσατε berbentuk orang kedua jamak
  choice: Mempertahankan Petrus sebagai lawan bicara khusus dan memakai “kalian” dalam pertanyaannya.
  alternative: Mengubah pertanyaan menjadi tunggal seolah-olah hanya ditujukan kepada Petrus, atau menambahkan penjelasan bahwa Petrus mewakili kelompok.
  rationale: Teks Yunani secara eksplisit menyebut Petrus, tetapi bentuk verba jamaknya mencakup lebih dari satu murid. Terjemahan mempertahankan pergeseran jumlah itu tanpa menjelaskannya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena perlu menampilkan bentuk jamak Yunani secara jelas meskipun ucapan diarahkan kepada Petrus. Kata ganti bagi Yesus tidak dikapitalisasi karena kapitalisasi penghormatan bukan unsur teks sumber.
