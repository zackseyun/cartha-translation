  source_fidelity: Teks dengan tepat mempertahankan alur naratif Yunani, termasuk bentuk historis naratif secara wajar dalam bahasa Indonesia, keadaan para murid yang sedang tidur, sapaan khusus kepada Petrus, dan bentuk orang kedua jamak melalui “kalian”. “Tetap terjaga ... selama satu jam” menyampaikan γρηγορῆσαι dan μίαν ὥραν dengan baik. Pergeseran dari Petrus tunggal kepada “kalian” jamak dipertahankan tanpa penafsiran tambahan.
  naturalness: Kalimatnya alami, lugas, dan sesuai register Indonesia modern. “Jadi” dapat menyampaikan nada teguran/keheranan dari Οὕτως. “Lalu” adalah penghubung naratif yang wajar untuk καί dalam konteks ini.
  terminology: “Murid-murid,” “Petrus,” “sanggup,” dan “tetap terjaga” tepat dan konsisten. Namun, alternatif “berjaga-jaga” kurang tepat sebagai padanan langsung γρηγορέω dalam konteks ini, karena dalam pemakaian modern ia sering bernuansa berhati-hati/waspada terhadap sesuatu. “Berjaga” lebih langsung menyatakan tetap bangun atau menjaga.
