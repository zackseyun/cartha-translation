  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepadamu: di mana pun kabar baik ini diberitakan di seluruh dunia, apa yang dilakukan perempuan ini juga akan diceritakan untuk mengenang dia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Injil ini”; dan “apa yang dilakukan perempuan ini juga akan disebut sebagai peringatan akan dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Mengungkapkan penegasan khidmat yang mengawali perkataan Yesus dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan bentuk sapaan langsung dan rumusan personal dari teks Yunani.
- source_word: ὅπου ἐὰν
  choice: Di mana pun
  rationale: Menyampaikan makna tempat yang tidak tertentu secara ringkas dan alami.
- source_word: κηρυχθῇ
  choice: diberitakan
  rationale: Mencerminkan bentuk pasif dan gagasan pengumuman kepada umum tanpa membatasinya pada khotbah formal.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: kabar baik ini
  rationale: Menerjemahkan makna leksikal εὐαγγέλιον secara transparan dalam bahasa Indonesia modern; istilah tradisional 'Injil ini' tetap merupakan alternatif yang sah.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: di seluruh dunia
  rationale: Ungkapan Indonesia yang wajar untuk cakupan universal frasa Yunani ini.
- source_word: λαληθήσεται
  choice: akan diceritakan
  rationale: Dalam hubungan dengan perbuatan perempuan itu, bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan bentuk pasif futurum.
- source_word: ὃ ἐποίησεν αὕτη
  choice: apa yang dilakukan perempuan ini
  rationale: ὃ menunjuk pada perbuatannya, sedangkan αὕτη secara kontekstual menunjuk kepada perempuan yang baru disebut.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: untuk mengenang dia
  rationale: Menyampaikan tujuan atau hasil peringatan dengan ungkapan Indonesia yang jelas, sambil membiarkan alternatif bernuansa memorial dicatat.
theological_decisions:
- issue: Penerjemahan εὐαγγέλιον
  choice: kabar baik
  alternative: Injil
  rationale: Pilihan ini mengutamakan makna leksikal yang mudah dipahami tanpa mengurangi bobot teologis istilah tersebut; 'Injil' merupakan padanan tradisional yang sah.
- issue: Hubungan εἰς μνημόσυνον dengan pelaporan perbuatan perempuan
  choice: untuk mengenang dia
  alternative: sebagai peringatan akan dia
  rationale: Frasa Yunani dapat dinyatakan secara idiomatis sebagai tujuan mengenang perempuan itu atau secara lebih formal sebagai memorial; terjemahan utama tidak menentukan lebih jauh sifat teologis peringatan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ucapan Yesus. Tanda titik dua membantu memperjelas batas antara rumusan penegasan dan isi pernyataan.
