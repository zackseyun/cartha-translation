  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: id
  text: Ia menjawab, “Orang yang telah mencelupkan tangannya ke dalam mangkuk[a] bersama Aku, dialah yang akan mengkhianati[b] Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pinggan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyerahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani bercorak Semitik yang secara idiomatis berarti ‘menjawab’; menerjemahkan kedua verba secara harfiah akan terasa kaku dalam bahasa Indonesia.
- source_word: ἐμβάψας
  choice: yang mencelupkan
  rationale: Partisip aoris menunjuk pada tindakan pencelupan sebagai ciri pengenal. Bentuk relatif ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang dimaksud.
- source_word: μετ’ ἐμοῦ
  choice: bersama Aku
  rationale: Menyampaikan makna penyertaan dari μετά dengan genitif. Huruf kapital pada ‘Aku’ mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: τὴν χεῖρα
  choice: tangannya
  rationale: Bahasa Yunani lazim memakai artikel untuk anggota tubuh, sedangkan bahasa Indonesia secara alami memakai bentuk posesif untuk menunjukkan tangan milik pelaku.
- source_word: ἐν τῷ τρυβλίῳ
  choice: ke dalam mangkuk
  rationale: τρύβλιον adalah wadah makanan berupa mangkuk atau pinggan. ‘Mangkuk’ jelas dan lazim; ‘pinggan’ dicantumkan sebagai alternatif leksikal.
- source_word: οὗτός
  choice: dialah
  rationale: Bentuk ini mempertahankan penekanan demonstratif οὗτός dengan cara yang alami dan tegas dalam bahasa Indonesia.
- source_word: παραδώσει
  choice: akan mengkhianati
  rationale: Dalam konteks penyerahan Yesus oleh Yudas, verba ini mengandung tindakan menyerahkan secara khianat. Alternatif yang lebih harfiah, ‘akan menyerahkan’, dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna παραδίδωμι dalam konteks Yudas
  choice: akan mengkhianati
  alternative: akan menyerahkan
  rationale: Konteks naratif dan hubungan pribadi membuat nuansa pengkhianatan menonjol, tetapi verba Yunani pada dasarnya juga dapat berarti ‘menyerahkan’. Catatan kaki menjaga keluasan leksikal itu tanpa meniadakan daya kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat langsung dipertahankan, sedangkan ‘dialah’ menyampaikan penekanan demonstratif Yunani tanpa kekakuan.
