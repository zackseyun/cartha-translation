  to: Kemudian Ia datang kepada murid-murid-Nya dan berkata kepada mereka, “Tidurlah terus dan beristirahatlah.[a] Lihat, saatnya sudah dekat,[b] dan Anak Manusia sedang diserahkan ke tangan orang-orang berdosa.[c]”
