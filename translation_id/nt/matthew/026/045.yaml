id: MAT.26.45
reference: Matthew 26:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: id
  text: Kemudian Ia datang kepada murid-murid-Nya dan berkata kepada mereka, “Tidurlah terus dan beristirahatlah.[a] Lihat, saatnya sudah dekat,[b] dan Anak Manusia sedang diserahkan ke tangan orang-orang berdosa.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kalian masih tidur dan beristirahat?” Susunan bahasa Yunani dapat dipahami sebagai pertanyaan retoris; teks utama mempertahankan kemungkinan nada ironisnya.
    reason: alternative_reading
  - marker: b
    text: Atau, “saatnya sudah tiba” atau “saatnya sudah di ambang pintu.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dikhianati.” Kata Yunani yang dipakai memiliki arti lebih luas, yaitu “diserahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἔρχεται
  choice: Kemudian Ia mendatangi
  rationale: τότε menyambungkan urutan peristiwa, sedangkan bentuk kini historis ἔρχεται diterjemahkan secara alami dalam narasi Indonesia tanpa harus mempertahankan kala kini secara kaku.
- source_word: πρὸς τοὺς μαθητάς
  choice: murid-murid-Nya
  rationale: Frasa ini menunjukkan gerak mendekati para murid; akhiran posesif memperjelas rujukan yang sudah nyata dari konteks.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Tidurlah terus sekarang dan beristirahatlah
  rationale: Bentuk permukaan dan ketegangan ironis atau konsesif dipertahankan, sementara kemungkinan membacanya sebagai pertanyaan retoris dicatat dalam catatan kaki.
- source_word: ἰδού
  choice: Lihat
  rationale: Seruan perhatian ini diterjemahkan dengan ungkapan Indonesia modern dan langsung, tanpa memakai bentuk arkais.
- source_word: ἤγγικεν ἡ ὥρα
  choice: saatnya sudah dekat
  rationale: Bentuk perfektum ἤγγικεν menyatakan kedekatan yang telah tercapai; ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi semata-mata 'telah tiba'.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar kristologis yang mapan ini dipertahankan secara langsung dan tidak diparafrasakan.
- source_word: παραδίδοται
  choice: sedang diserahkan
  rationale: Pilihan ini mempertahankan arti luas tindakan menyerahkan dan aspek peristiwa yang sedang berlangsung, tanpa membatasinya hanya pada tindakan mengkhianati.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: ke tangan orang-orang berdosa
  rationale: Metafora konkret bahasa Yunani tetap jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Daya ujar Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Diterjemahkan sebagai pernyataan/perintah bernada ironis atau konsesif: “Tidurlah terus sekarang dan beristirahatlah.”'
  alternative: “Apakah kalian masih tidur dan beristirahat?”
  rationale: Susunan Yunani dapat dipahami sebagai bentuk yang berfungsi imperatif atau sebagai pertanyaan retoris dalam konteks. Teks utama mempertahankan bentuk permukaannya, sedangkan catatan kaki menjaga kemungkinan pertanyaan retoris.
- issue: Makna παραδίδοται dalam kisah sengsara
  choice: sedang diserahkan
  alternative: dikhianati
  rationale: Istilah Yunani lebih luas daripada tindakan pengkhianatan Yudas saja dan dapat mencakup keseluruhan penyerahan Yesus kepada kuasa para penangkap-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk sapaan dan narasi dibuat alami; ambiguitas penting pada ucapan tentang tidur serta keluasan makna παραδίδοται dipertahankan melalui teks dan catatan kaki.
