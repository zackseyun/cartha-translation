  - severity: medium
    issue: “sekarang” untuk τὸ λοιπὸν
    rationale: τὸ λοιπὸν menunjuk pada waktu yang tersisa atau kelanjutan (“seterusnya”), bukan semata-mata “sekarang.” Dalam konteks ini, “terus” sudah menyampaikan nuansa kelanjutan secara lebih baik tanpa membuat ujaran itu canggung.
