  source_fidelity: 'Makna pokok diterjemahkan dengan setia: urutan naratif, seruan perhatian, kedekatan saat itu, gelar “Anak Manusia,” dan arti luas παραδίδοται sebagai “diserahkan” semuanya terpelihara. Namun, “mendatangi” kurang langsung mencerminkan ἔρχεται πρὸς (“datang kepada”), dan “sekarang” tidak secara baik menyampaikan τὸ λοιπὸν (“seterusnya/untuk selebihnya”).'
  naturalness: Bahasa umumnya baku dan jelas. “Tidurlah terus sekarang” terdengar kurang idiomatis dalam bahasa Indonesia modern. “Tidurlah terus dan beristirahatlah” lebih alami sambil tetap membiarkan daya ironis atau konsesifnya tidak diputuskan secara berlebihan.
  terminology: “Anak Manusia,” “orang-orang berdosa,” dan “diserahkan” sudah tepat serta konsisten dengan istilah penting dan keluasan makna Yunani. Catatan untuk “dikhianati” dengan tepat menandai bahwa itu hanya salah satu kemungkinan yang lebih sempit.
