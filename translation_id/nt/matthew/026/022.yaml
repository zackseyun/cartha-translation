  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: id
  text: Mereka sangat sedih, lalu mulai berkata kepada-Nya seorang demi seorang[a], “Tentunya bukan aku, Tuhan?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masing-masing” atau “satu demi satu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kata tanya Yunani μήτι menunjukkan bahwa penanya mengharapkan jawaban negatif: “Tentunya bukan aku, Tuhan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: sangat sedih
  rationale: Partisipel kini menyatakan keadaan emosi yang sedang berlangsung, sedangkan σφόδρα memperkuatnya. “Sangat sedih” alami dalam bahasa Indonesia dan mempertahankan daya emosional teks.
- source_word: ἤρξαντο λέγειν
  choice: mulai berkata
  rationale: Konstruksi ingresif ini menandai awal tindakan berbicara; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativus ini menyatakan pihak yang dituju. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: εἷς ἕκαστος
  choice: seorang demi seorang
  rationale: Ungkapan distributif menekankan bahwa masing-masing murid menanggapi secara individual. Pilihan ini mempertahankan penekanan itu secara idiomatis.
- source_word: Μήτι ἐγώ εἰμι
  choice: Tentunya bukan aku?
  rationale: μήτι memperkenalkan pertanyaan yang mengharapkan jawaban negatif. “Tentunya bukan aku?” menyampaikan harapan tersebut tanpa mengubahnya menjadi pernyataan pasti.
- source_word: κύριε
  choice: Tuhan
  rationale: Dalam sapaan kepada Yesus, “Tuhan” mempertahankan bobot naratif dan teologis κύριε, sekaligus tetap memungkinkan nuansa sapaan hormat dalam konteks.
theological_decisions:
- issue: Terjemahan κύριε sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: “Tuhan” mempertahankan bobot kristologis dan kebiasaan pemakaian gelar ini dalam Matius tanpa menambahkan penjelasan doktrinal ke dalam ayat.
- issue: Daya pragmatis μήτι
  choice: Tentunya bukan aku?
  alternative: Apakah aku?; Bukan aku, bukan?
  rationale: Teks Yunani mengharapkan jawaban negatif, tetapi tetap berbentuk pertanyaan. Terjemahan mempertahankan ketegangan antara kecemasan para murid dan harapan mereka bahwa jawabannya bukan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Seorang demi seorang” dipilih untuk memperjelas respons individual, sedangkan “Tentunya bukan aku” mempertahankan bentuk pertanyaan yang mengharapkan penyangkalan.
