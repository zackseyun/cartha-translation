id: MAT.1.15
reference: Matthew 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: id
  text: Eliud memperanakkan Eleazar, Eleazar memperanakkan Matan, dan Matan memperanakkan Yakub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: δὲ
  choice: (tidak selalu diterjemahkan secara tersendiri); dan
  rationale: Dalam rangkaian silsilah ini, δέ merupakan penghubung ringan. Pengulangan pertama cukup dinyatakan melalui tanda koma, sedangkan unsur terakhir diterjemahkan 'dan' agar kalimat mengalir alami tanpa menghilangkan hubungan berurutan.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ini menyatakan hubungan ayah atau garis keturunan. 'Memperanakkan' ringkas, bermartabat, dan lazim dalam bahasa Alkitab Indonesia, sambil tidak menuntut bahwa setiap mata rantai harus dipahami sebagai generasi yang langsung.
- source_word: τὸν
  choice: (tidak diterjemahkan secara tersendiri)
  rationale: Artikel Yunani menandai objek langsung sebelum nama diri, tetapi bahasa Indonesia tidak memerlukan artikel dalam susunan ini.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Transliterasi nama pribadi yang sudah mapan dalam bahasa Indonesia.
- source_word: Ματθάν
  choice: Matan
  rationale: Bentuk 'Matan' mengikuti penyesuaian ejaan Indonesia bagi Ματθάν dan mudah dibaca oleh pembaca modern.
- source_word: Ἰακώβ
  choice: Yakub
  rationale: Bentuk nama yang sudah mapan dalam Alkitab bahasa Indonesia untuk Ἰακώβ.
theological_decisions:
- issue: Cakupan hubungan yang dinyatakan oleh ἐγέννησεν dalam silsilah
  choice: '''memperanakkan'' dipakai tanpa menambahkan kata ''langsung'' atau penjelasan biologis'
  alternative: '''adalah ayah dari'''
  rationale: Ungkapan Yunani dapat berfungsi dalam penyajian garis keturunan dan tidak dengan sendirinya menyelesaikan pertanyaan apakah setiap hubungan merupakan generasi langsung. Terjemahan mempertahankan keluwesan itu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur berulang dipertahankan untuk mencerminkan gaya silsilah Yunani, dengan tanda baca dan satu konjungsi akhir agar alami dalam bahasa Indonesia modern.
