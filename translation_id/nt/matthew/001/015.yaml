  source_fidelity: 'Teks secara tepat mempertahankan tiga hubungan silsilah yang dinyatakan oleh ἐγέννησεν: Eliud–Eleazar, Eleazar–Matan, dan Matan–Yakub. Penghilangan penerjemahan tersendiri bagi artikel τὸν idiomatis dalam bahasa Indonesia. Penghubung δέ ditangani wajar dalam rangkaian silsilah melalui koma dan ‘dan’ pada hubungan terakhir, tanpa mengubah urutan atau relasi.'
