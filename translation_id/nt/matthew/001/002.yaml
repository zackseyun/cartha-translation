  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: id
  text: Abraham memperanakkan Ishak[a], Ishak memperanakkan Yakub, dan Yakub memperanakkan Yehuda serta saudara-saudara lelakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi ayah dari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, verba γεννάω menyatakan hubungan ayah dengan keturunannya. “Memperanakkan” mempertahankan daya genealogis dan garis paternal teks Yunani, sekaligus tidak memastikan bahwa setiap hubungan harus dipahami sebagai generasi yang langsung.
- source_word: δὲ
  choice: dan / tanpa padanan tersendiri
  rationale: δέ di sini merupakan penghubung ringan dalam rangkaian silsilah, bukan penanda pertentangan. Bahasa Indonesia alami tidak perlu mengulang “dan” pada setiap klausa; koma menghubungkan dua klausa pertama, sedangkan “dan” menandai klausa terakhir.
- source_word: Ἰούδαν
  choice: Yehuda
  rationale: Tokoh yang dimaksud ialah Yehuda, anak Yakub dan leluhur suku Yehuda, bukan Yudas pada zaman Perjanjian Baru. “Yehuda” merupakan bentuk baku Indonesia untuk tokoh ini.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: saudara-saudaranya
  rationale: Dalam konteks anak-anak lelaki Yakub, frasa ini merujuk kepada saudara-saudara laki-laki Yehuda. Bentuk Indonesia ini alami dan konteksnya memperjelas rujukan tersebut.
- source_word: Ἀβραὰμ / Ἰσαὰκ / Ἰακώβ
  choice: Abraham / Ishak / Yakub
  rationale: Nama-nama pribadi memakai bentuk Alkitabiah yang sudah baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: καί
  choice: dan / serta
  rationale: καί mengoordinasikan unsur-unsur dalam kalimat. “Serta” pada bagian akhir menghindari rangkaian “dan” yang kaku tanpa mengubah hubungan koordinatifnya.
theological_decisions:
- issue: Penerjemahan verba silsilah
  choice: Memakai “memperanakkan” secara konsisten
  alternative: “Menjadi ayah dari” atau “menurunkan”
  rationale: “Memperanakkan” mempertahankan penekanan genealogis dari γεννάω dan tetap memungkinkan pola silsilah yang dapat merangkum generasi, tanpa memasukkan klaim tambahan tentang kelangsungan setiap generasi.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur berulang dipertahankan karena merupakan ciri silsilah, sementara penggunaan penghubung disesuaikan agar alami dalam bahasa Indonesia.
