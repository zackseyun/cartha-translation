base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: id
  text: 'Semua ini telah terjadi[a] supaya digenapi apa yang difirmankan oleh Tuhan melalui nabi yang berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seluruh peristiwa ini telah terjadi.” Ungkapan Yunani τοῦτο δὲ ὅλον menekankan keseluruhan peristiwa yang baru saja diceritakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Semua ini
  rationale: Gabungan ini menunjuk pada seluruh rangkaian peristiwa yang baru saja diceritakan. “Semua ini” alami dalam bahasa Indonesia dan mempertahankan penekanan pada keseluruhannya; δέ berfungsi sebagai penghubung naratif dan tidak perlu diberi kata tersendiri.
- source_word: γέγονεν
  choice: telah terjadi
  rationale: Bentuk perfektum γίνομαι menyatakan terjadinya peristiwa dengan relevansi yang masih berlaku. “Telah terjadi” mempertahankan nuansa itu tanpa memakai ungkapan arkais.
- source_word: ἵνα πληρωθῇ
  choice: supaya digenapi
  rationale: ἵνα dengan subjungtif pasif dapat memuat tujuan maupun hasil. “Supaya digenapi” mempertahankan bentuk pasif dan tidak memutuskan secara berlebihan di antara kedua nuansa tersebut.
- source_word: τὸ ῥηθὲν
  choice: apa yang difirmankan
  rationale: Partisip pasif yang disubstantivakan berarti “apa yang dikatakan/diucapkan.” “Difirmankan” merupakan padanan Indonesia yang wajar dan khidmat ketika Tuhan menjadi pelaku ujaran.
- source_word: ὑπὸ κυρίου
  choice: oleh Tuhan
  rationale: ὑπό dengan genitif menandai Tuhan sebagai pelaku utama yang berfirman, tanpa menambahkan kata “Allah” yang tidak terdapat dalam teks Yunani.
- source_word: διὰ τοῦ προφήτου
  choice: melalui nabi
  rationale: διά dengan genitif menyatakan perantaraan; pilihan ini membedakan Tuhan sebagai sumber ujaran dari nabi sebagai perantaranya.
- source_word: λέγοντος
  choice: yang berkata
  rationale: Partisip genitif ini menerangkan nabi dan mengantar kutipan pada ayat berikutnya. “Yang berkata” mempertahankan hubungan gramatikal tersebut dengan jelas.
theological_decisions:
- issue: Pelaku dan perantara dalam perkataan kenabian
  choice: “difirmankan oleh Tuhan melalui nabi”
  alternative: “dikatakan oleh nabi dari Tuhan”
  rationale: Susunan ini mempertahankan pembedaan Yunani antara ὑπό, yang menandai Tuhan sebagai pelaku utama, dan διά, yang menandai nabi sebagai perantara, tanpa mengembangkan doktrin inspirasi melampaui teks.
- issue: Rumusan penggenapan
  choice: “supaya digenapi”
  alternative: “sehingga digenapi”
  rationale: Ungkapan yang dipilih membiarkan ἵνα + subjungtif memuat ketegangan antara tujuan dan hasil, serta mempertahankan gambaran pasif tentang penggenapan perkataan kenabian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan khidmat. “Difirmankan” dipakai khusus karena Tuhan adalah pelaku ujaran; struktur “melalui nabi” menjaga nuansa perantaraan. Tanda titik dua mengantar kutipan langsung pada ayat berikutnya.
