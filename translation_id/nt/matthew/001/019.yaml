  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: id
  text: Yusuf, suaminya[a], adalah orang benar dan tidak ingin mempermalukannya di depan umum[b]; karena itu, ia bermaksud menceraikannya secara diam-diam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunangannya.” Secara harfiah, teks Yunani menyebut Yusuf “laki-laki/suaminya,” sesuai dengan pertunangan Yahudi yang sudah mengikat secara hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadikannya contoh” atau “membuka aibnya di depan umum.”
    reason: lexical_alternative
  - marker: c
    text: Atau “menyuruhnya pergi secara pribadi.” Dalam konteks ini, yang dimaksud ialah perceraian resmi selama masa pertunangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan narasi. Dalam bahasa Indonesia, peralihan tersebut sudah alami tanpa kata penghubung eksplisit.
- source_word: ἀνὴρ αὐτῆς
  choice: suaminya
  rationale: Dalam konteks pertunangan Yahudi yang mengikat secara hukum, ἀνήρ menunjuk pada kedudukan Yusuf sebagai suami. Pilihan ini paling alami dalam bahasa Indonesia; tahap pertunangan dijelaskan dalam catatan kaki.
- source_word: δίκαιος
  choice: seorang yang benar
  rationale: Pilihan ini mempertahankan penilaian moral dan religius terhadap Yusuf tanpa mempersempitnya hanya menjadi ketaatan hukum atau belas kasihan.
- source_word: μὴ θέλων
  choice: tidak ingin
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan ketidaksediaan atau ketidakmauan Yusuf.
- source_word: δειγματίσαι
  choice: mempermalukan ... di depan umum
  rationale: Kata ini menyatakan tindakan menyingkapkan seseorang sehingga menjadi tontonan atau mendapat aib; unsur publisitas dan rasa malu disampaikan secara jelas.
- source_word: ἐβουλήθη
  choice: bermaksud
  rationale: Menyampaikan niat yang telah dipertimbangkan tanpa membuat teks lebih tegas daripada verba Yunani.
- source_word: λάθρᾳ
  choice: secara diam-diam
  rationale: Menyatakan tindakan secara tersembunyi atau privat dan terdengar alami dalam konteks ini.
- source_word: ἀπολῦσαι αὐτήν
  choice: menceraikannya
  rationale: Dalam konteks pertunangan yang mengikat secara hukum, tindakan ini adalah pemutusan resmi hubungan tersebut. 'Menceraikan' mengomunikasikan daya hukum yang dapat kabur jika diterjemahkan sekadar 'menyuruh pergi'.
theological_decisions:
- issue: Makna δίκαιος dalam penggambaran Yusuf
  choice: seorang yang benar
  alternative: orang yang adil; orang yang taat kepada hukum; parafrasa yang hanya menekankan belas kasihan
  rationale: Teks menghubungkan kebenaran Yusuf dengan keengganannya mempermalukan Maria, tetapi tidak menjelaskan apakah δίκαιος terutama menekankan ketaatan hukum, belas kasihan, atau keduanya. Terjemahan mempertahankan ketegangan itu.
- issue: Status hukum Yusuf dan Maria
  choice: suami dan menceraikan
  alternative: tunangan dan membatalkan pertunangan; laki-lakinya dan menyuruhnya pergi
  rationale: Walaupun mereka masih berada pada tahap pertunangan, pertunangan Yahudi pada masa itu mengikat secara hukum dan memerlukan perceraian untuk dibubarkan. Istilah utama menyampaikan kenyataan hukum itu, sedangkan nuansa tahap hubungan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kalimat Yunani dipecah menjadi dua kalimat agar hubungan antargagasan mudah dipahami, tanpa mengubah alasan dan maksud tindakan Yusuf. Nama Maria diulang untuk menghindari ketidakjelasan pronomina.
