  source_fidelity: 'Makna pokoknya tepat: Yusuf disebut suami Maria dalam pengertian hukum pertunangan, ia tidak menghendaki pemaluan di muka umum, dan ia berniat menceraikannya secara privat. Namun, pemecahan kalimat dengan “Karena” secara sintaktis hanya menjadikan keengganan Yusuf sebagai alasan bagi niatnya, sementara konstruksi Yunani menghubungkan kedua partisip “sebagai orang benar” dan “tidak ingin” sebagai latar/alasan bagi niat tersebut.'
  naturalness: Bahasa draf umumnya baku dan jelas. “Orang benar” lebih alami dan lebih mapan dalam register Alkitab bahasa Indonesia daripada “seorang yang benar.” Susunan kalimat revisi juga mempertahankan hubungan antarklausa Yunani tanpa terdengar harfiah.
  terminology: “Suaminya” dan “menceraikannya” tepat untuk menyampaikan daya hukum pertunangan Yahudi; catatan kaki dengan tepat menjaga alternatif “tunangannya.” “Mempermalukannya di depan umum” menyampaikan daya publik dan aib dari δειγματίσαι tanpa berspekulasi mengenai bentuk hukuman.
  issues:
