id: MAT.1.21
reference: Matthew 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: id
  text: Ia akan melahirkan seorang anak laki-laki, dan engkau akan memberi Dia nama Yesus[a], karena Dialah yang akan menyelamatkan umat-Nya dari dosa-dosa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yesus adalah bentuk Yunani dari Yeshua, nama Ibrani/Aram yang berkaitan dengan Yehoshua (Yosua), dan berhubungan dengan gagasan “YHWH menyelamatkan.” Penjelasan “karena Dialah yang akan menyelamatkan” mencerminkan permainan kata pada nama ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: akan melahirkan
  rationale: Bentuk futurum τίκτω dalam konteks persalinan; padanan ini alami dalam bahasa Indonesia dan mempertahankan daya prediktifnya.
- source_word: δὲ
  choice: dan
  rationale: δέ merupakan penghubung ringan; “dan” menjaga kesinambungan kalimat secara alami tanpa memberi kesan pertentangan kuat.
- source_word: υἱὸν
  choice: seorang anak laki-laki
  rationale: Dalam pengumuman kelahiran, ungkapan ini jelas dan alami untuk υἱόν, tanpa memaksakan gelar teologis ke dalam frasa tersebut.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: engkau harus menamai-Nya
  rationale: Ungkapan penamaan Semitis-Yunani disampaikan dalam idiom Indonesia yang alami. “Harus” mempertahankan arahan yang kuat dari bentuk futurum yang berfungsi sebagai perintah.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam Perjanjian Baru bahasa Indonesia; hubungan etimologisnya dengan Yeshua dijelaskan dalam catatan kaki.
- source_word: αὐτὸς
  choice: Dialah yang
  rationale: 'Konstruksi ini mempertahankan penekanan pada subjek: anak yang dinamai Yesus itulah yang akan bertindak menyelamatkan.'
- source_word: γὰρ
  choice: karena
  rationale: Memperkenalkan alasan bagi pemberian nama dan mengalir alami dalam bahasa Indonesia.
- source_word: σώσει
  choice: akan menyelamatkan
  rationale: Menyampaikan makna σῴζω secara langsung; objek dan frasa “dari dosa-dosa mereka” mendukung makna penyelamatan.
- source_word: τὸν λαὸν αὐτοῦ
  choice: umat-Nya
  rationale: “Umat” mempertahankan nuansa kolektif dan potensial-kovenantal λαός, sedangkan akhiran posesif menjaga hubungan “milik-Nya” tanpa menentukan cakupannya lebih jauh.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: dari dosa-dosa mereka
  rationale: “Dari” menyatakan pemisahan yang ditandai ἀπό, dan bentuk jamak “dosa-dosa” mempertahankan plural Yunani.
theological_decisions:
- issue: Penekanan αὐτός pada pelaku penyelamatan
  choice: Dialah yang akan menyelamatkan
  alternative: Ia akan menyelamatkan
  rationale: “Dialah yang” mempertahankan penekanan eksplisit bahwa Yesus sendiri adalah pelaku tindakan itu, tanpa menambahkan penjelasan doktrinal di luar teks.
- issue: Cakupan “umat-Nya”
  choice: umat-Nya
  alternative: umat Israel-Nya; semua orang yang menjadi milik-Nya
  rationale: Ayat ini sendiri tidak mendefinisikan cakupannya secara lebih sempit atau lebih luas; terjemahan mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” sesuai dengan sapaan tunggal dalam konteks malaikat berbicara kepada Yusuf. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia dan tidak mengubah makna sumber.
