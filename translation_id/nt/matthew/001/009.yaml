  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: id
  text: Uzia memperanakkan Yotam[a], Yotam memperanakkan Ahas, dan Ahas memperanakkan Hizkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “memperanakkan” dalam silsilah ini menyatakan hubungan ayah-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Uzia
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menghubungkan tokoh ini dengan raja Yehuda dalam Perjanjian Lama.
- source_word: δὲ
  choice: dan / tidak diterjemahkan secara tersendiri
  rationale: Dalam rangkaian silsilah ini, δέ adalah penghubung ringan. Kata 'dan' dipakai pada klausa terakhir agar kalimat Indonesia mengalir wajar, sedangkan pengulangan sebelumnya tidak selalu dinyatakan tersendiri.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam rumus silsilah, kata ini menyatakan hubungan keturunan dari pihak ayah. 'Memperanakkan' mempertahankan bentuk aktif dan pola berulang teks Yunani secara ringkas dan bermartabat.
- source_word: Ἰωαθάμ
  choice: Yotam
  rationale: Bentuk nama baku yang dikenal pembaca Alkitab bahasa Indonesia untuk raja Yehuda tersebut.
- source_word: Ἀχάζ
  choice: Ahas
  rationale: Bentuk nama baku dalam tradisi Alkitab bahasa Indonesia, sesuai dengan tokoh Perjanjian Lama yang dimaksud.
- source_word: Ἑζεκίαν
  choice: Hizkia
  rationale: Bentuk nama baku yang dikenal dalam Alkitab bahasa Indonesia untuk raja Yehuda tersebut.
theological_decisions:
- issue: Daya genealogis γεννάω
  choice: Diterjemahkan sebagai hubungan keturunan paternal dengan 'memperanakkan'.
  alternative: '''menjadi ayah dari'' atau ''menurunkan'''
  rationale: Teks menyajikan urutan paternal secara langsung melalui rumus silsilah yang berulang. Terjemahan tidak memperluasnya menjadi 'leluhur dari', meskipun silsilah kuno dapat melewatkan generasi, karena perlu mempertahankan apa yang dinyatakan teks dan tidak menutup kemungkinan adanya pemadatan silsilah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur repetitif silsilah dipertahankan, dengan nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia.
