  source_fidelity: 'Teks Indonesia secara akurat mencerminkan Yunani: “Yosia” menerjemahkan Ἰωσίας, “memperanakkan” mempertahankan formula silsilah ἐγέννησεν, “Yekhonya dan saudara-saudaranya” mencakup Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ, dan “pada waktu pembuangan ke Babel” menyampaikan fungsi temporal ἐπὶ τῆς μετοικεσίας Βαβυλῶνος. Terjemahan tidak menambahkan penyelesaian atas persoalan kompresi silsilah.'
