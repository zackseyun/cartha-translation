id: MAT.1.11
reference: Matthew 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: id
  text: Yosia memperanakkan Yekhonya dan saudara-saudaranya pada waktu pembuangan ke Babel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu pemindahan paksa ke Babel.” Kata Yunani yang dipakai dapat menunjuk kepada pemindahan paksa atau masa pembuangan; “pemindahan paksa” menonjolkan sifat peristiwa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam rumusan silsilah Matius, kata ini menyatakan hubungan keturunan dari pihak laki-laki. “Memperanakkan” ringkas, wajar dalam konteks silsilah, dan tidak memaksa kesimpulan bahwa setiap mata rantai selalu merupakan hubungan ayah-anak langsung.
- source_word: Ἰεχονίαν
  choice: Yekhonya
  rationale: Bentuk ini mengikuti ejaan nama Alkitab yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: saudara-saudaranya
  rationale: Bentuk Yunani adalah jamak maskulin dan dalam konteks ini menunjuk kepada saudara laki-laki; bentuk Indonesia ini alami, meskipun secara leksikal dapat lebih luas tanpa konteks.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: pada waktu pembuangan ke Babel
  rationale: Frasa ini berfungsi sebagai penanda waktu. “Pembuangan” mencakup pemindahan paksa sekaligus keadaan hidup jauh dari tanah asal, sedangkan “ke Babel” menyatakan tujuan yang tersirat dalam ungkapan Yunani.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan dalam rangkaian silsilah; penghilangan padanan eksplisit menghasilkan bahasa Indonesia yang lebih alami tanpa mengurangi makna.
theological_decisions:
- issue: Pemadatan generasi dalam silsilah Matius
  choice: Menerjemahkan rumusan silsilah sebagaimana dinyatakan tanpa menyelesaikan persoalan historis di dalam teks utama.
  alternative: Memahami ἐγέννησεν sebagai hubungan leluhur-keturunan yang tidak selalu berarti ayah biologis langsung.
  rationale: Rumusan “memperanakkan” mempertahankan bentuk silsilah Yunani sekaligus tidak menambahkan penjelasan harmonisasi yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “memperanakkan” dipertahankan karena sesuai dengan ragam silsilah, sementara “pembuangan” lebih dikenal luas daripada istilah teknis seperti “deportasi”.
