  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: id
  text: Setelah Yusuf bangun dari tidur, ia melakukan seperti yang diperintahkan malaikat Tuhan kepadanya, lalu menerima istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa istrinya ke rumahnya” atau “menerima istrinya ke dalam rumah tangganya.” Kata kerja Yunani ini dapat mengandung arti membawa atau menerima seseorang ke dalam rumah tangga sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ... ἀπὸ τοῦ ὕπνου
  choice: Setelah bangun dari tidurnya
  rationale: Partisip aoristus ini menunjukkan tindakan yang mendahului tindakan utama. Ungkapan tersebut diterjemahkan secara idiomatis dalam bahasa Indonesia, sementara δέ sebagai penghubung perkembangan narasi tidak perlu dinyatakan tersendiri.
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: melakukan seperti yang diperintahkan ... kepadanya
  rationale: Terjemahan ini mempertahankan gagasan bahwa tindakan Yusuf sesuai dengan perintah yang berwibawa.
- source_word: ὁ ἄγγελος κυρίου
  choice: malaikat Tuhan
  rationale: Ini merupakan padanan Indonesia yang lazim dan jelas bagi ungkapan Yunani tersebut serta mempertahankan κύριος sebagai 'Tuhan'.
- source_word: παρέλαβεν
  choice: menerima ... tinggal bersamanya
  rationale: Dalam konteks perkawinan, verba ini dapat berarti menerima atau membawa seseorang kepada diri sendiri, termasuk ke dalam rumah tangga. Rumusan ini menghindari kemungkinan salah paham dari terjemahan harfiah 'mengambil istrinya'.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: istrinya
  rationale: γυνή berarti 'istri' dalam kerangka legal-perkawinan bagian ini, tanpa menyiratkan bahwa perkawinan itu telah disempurnakan melalui hubungan seksual.
theological_decisions:
- issue: Makna γυνή sebelum perkawinan disempurnakan melalui hubungan seksual
  choice: istrinya
  alternative: perempuan itu
  rationale: Narasi menempatkan Maria dalam kerangka hubungan perkawinan yang sah, sekalipun ayat berikutnya menyatakan bahwa mereka belum berhubungan seksual. 'Istrinya' mempertahankan kerangka itu tanpa menambahkan implikasi lain.
- issue: Penerjemahan κύριος dalam ἄγγελος κυρίου
  choice: malaikat Tuhan
  alternative: malaikat Yahweh
  rationale: Pilihan ini menerjemahkan teks Yunani secara langsung dan memakai ungkapan Alkitabiah yang alami dalam bahasa Indonesia.
- issue: Cakupan makna παραλαμβάνω dalam konteks perkawinan
  choice: menerima istrinya tinggal bersamanya
  alternative: mengambil istrinya
  rationale: Pilihan utama memperjelas dimensi penerimaan ke dalam kehidupan atau rumah tangga bersama tanpa menyatakan lebih dari konteks, sedangkan alternatif yang lebih harfiah dapat terdengar tidak alami atau disalahpahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, sedangkan catatan kaki mempertahankan keluasan makna verba Yunani.
