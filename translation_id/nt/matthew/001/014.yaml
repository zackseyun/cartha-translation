id: MAT.1.14
reference: Matthew 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: id
  text: Azor memperanakkan Zadok, Zadok memperanakkan Akhim, dan Akhim memperanakkan Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Nama pribadi ditransliterasikan ke dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δέ
  choice: dan
  rationale: Dalam silsilah ini δέ berfungsi sebagai penghubung sederhana. Dua kemunculan pertama tersirat melalui susunan klausa berulang, sedangkan kemunculan terakhir diterjemahkan dengan 'dan' agar rangkaian kalimat alami dalam bahasa Indonesia.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ini menyatakan bahwa seorang laki-laki menjadi leluhur melalui garis keturunan. 'Memperanakkan' ringkas, bermartabat, dan mempertahankan bentuk aktif teks Yunani tanpa harus menyiratkan bahwa setiap hubungan selalu merupakan ayah-anak langsung.
- source_word: τὸν
  choice: tidak diterjemahkan secara terpisah
  rationale: Artikel akusatif ini menandai nama sebagai objek langsung dalam tata bahasa Yunani; nama pribadi dalam konstruksi bahasa Indonesia ini tidak memerlukan artikel.
- source_word: Σαδώκ
  choice: Zadok
  rationale: Bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ἀχίμ
  choice: Akhim
  rationale: Transliterasi yang mencerminkan bunyi χ dengan 'kh' sesuai kebiasaan bahasa Indonesia.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Transliterasi nama Yunani yang alami dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan hubungan yang dinyatakan oleh ἐγέννησεν dalam silsilah
  choice: memperanakkan
  alternative: menjadi ayah dari
  rationale: '''Memperanakkan'' mempertahankan rumusan silsilah dan dapat mencakup garis keturunan, sedangkan ''menjadi ayah dari'' lebih mudah dipahami sebagai hubungan biologis langsung dan dapat mempersempit maksud teks.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pola pengulangan dipertahankan untuk mengikuti irama silsilah Yunani, dengan 'dan' hanya sebelum klausa terakhir agar alami bagi pembaca modern.
