  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: id
  text: Dan ia tidak bersetubuh dengan Maria sampai Maria melahirkan seorang anak laki-laki.[a] Dan ia menamai-Nya Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “sampai” menyatakan apa yang berlaku hingga kelahiran Yesus; kata itu sendiri tidak menentukan apa yang terjadi sesudahnya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐγίνωσκεν αὐτήν
  choice: tidak bersetubuh dengan Maria
  rationale: Secara harfiah ungkapan ini berarti 'tidak mengenalnya', tetapi γινώσκω di sini merupakan ungkapan halus untuk hubungan seksual. Terjemahan eksplisit ini lebih jelas dan alami dalam bahasa Indonesia modern; nama 'Maria' dipakai untuk memperjelas rujukan pronomina.
- source_word: ἕως οὗ
  choice: sampai
  rationale: Padanan temporal yang wajar dan ringkas; menyatakan keadaan hingga kelahiran tanpa dengan sendirinya menetapkan apa yang terjadi sesudahnya.
- source_word: ἔτεκεν
  choice: melahirkan
  rationale: Padanan modern dan alami bagi tindakan melahirkan.
- source_word: υἱόν
  choice: seorang anak laki-laki
  rationale: Bentuk tanpa artikel paling wajar diterjemahkan secara tak tentu. 'Anak laki-laki' terdengar lebih alami daripada 'putra' dalam konteks tindakan melahirkan.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ia menamai-Nya Yesus
  rationale: Mengungkapkan idiom Yunani-Semit tersebut secara alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam Perjanjian Baru bahasa Indonesia.
theological_decisions:
- issue: Implikasi kata 'sampai' terhadap hubungan Maria dan Yusuf sesudah kelahiran Yesus
  choice: Menerjemahkan ἕως οὗ sebagai 'sampai' tanpa menyatakan bahwa hubungan suami istri kemudian terjadi atau tidak terjadi.
  alternative: Sebagian pembaca menyimpulkan bahwa hubungan suami istri dimulai sesudah kelahiran; sebagian lain menilai bahwa ungkapan ini tidak menyiratkan perubahan sesudah batas waktu tersebut.
  rationale: Ungkapan Yunani itu hanya menegaskan keadaan yang berlangsung hingga kelahiran Yesus dan tidak dengan sendirinya menyelesaikan pertanyaan mengenai masa sesudahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Bersetubuh' dipilih sebagai istilah yang jelas namun tetap bermartabat; 'menamai-Nya' mengutamakan kelancaran idiomatis. Pronomina penghormatan -Nya digunakan sesuai kebiasaan penulisan Alkitab bahasa Indonesia.
