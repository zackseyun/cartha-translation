  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: id
  text: Kitab silsilah[a] Yesus, Sang Mesias, anak Daud, anak Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “asal-usul” atau “kelahiran”. Kata Yunani yang digunakan dapat memiliki makna lebih luas, yaitu “asal-usul” atau “kelahiran”, meskipun “silsilah” paling sesuai dengan daftar leluhur yang menyusul.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Kitab
  rationale: Dalam judul pembuka ini, βίβλος menunjuk pada kitab atau catatan tertulis. “Kitab” mempertahankan corak formal dan alusi kitabiah secara alami dalam bahasa Indonesia.
- source_word: γενέσεως
  choice: silsilah
  rationale: γένεσις dapat berarti asal-usul, kelahiran, atau silsilah. Karena bagian sesudahnya memuat daftar leluhur, “silsilah” paling sesuai dalam teks utama, sementara cakupan maknanya yang lebih luas dicatat dalam catatan kaki.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Nama diri diterjemahkan menurut bentuk baku bahasa Indonesia.
- source_word: χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar bagi Yesus. “Sang Mesias” menyampaikan arti gelar ‘Yang Diurapi’ secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: υἱοῦ Δαυὶδ
  choice: anak Daud
  rationale: υἱός secara harfiah berarti ‘anak’ dan dalam konteks silsilah dapat berarti keturunan. Bentuk “anak Daud” mempertahankan ungkapan mesianik dan kerajaan dalam sumber.
- source_word: υἱοῦ Ἀβραάμ
  choice: anak Abraham
  rationale: “Anak” mempertahankan ungkapan silsilah sumber serta kaitannya dengan Abraham; dalam konteks ini yang dimaksud ialah keturunan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Kata ini digunakan sebagai gelar yang memperkenalkan identitas mesianik Yesus, bukan semata-mata sebagai unsur nama. Pilihan ini mempertahankan latar Yahudi tentang raja yang diurapi.
- issue: Makna γενέσεως dalam judul
  choice: silsilah
  alternative: asal-usul; kelahiran
  rationale: Konteks langsung berupa daftar leluhur mendukung “silsilah”, tetapi kemungkinan gema makna ‘asal-usul’ atau ‘kelahiran’ tidak disingkirkan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan nominal dipertahankan sebagai judul. Ungkapan “anak Daud, anak Abraham” sengaja dipertahankan alih-alih diperjelas menjadi “keturunan” agar daya genealogis dan mesianik sumber tidak diratakan.
