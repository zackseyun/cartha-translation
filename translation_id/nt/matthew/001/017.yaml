id: MAT.1.17
reference: Matthew 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: id
  text: Jadi, seluruh generasi dari Abraham sampai Daud berjumlah empat belas generasi; dari Daud sampai pembuangan ke Babel, empat belas generasi; dan dari pembuangan ke Babel sampai Mesias[a], empat belas generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Kata Yunani χριστός merupakan gelar yang berarti “Yang Diurapi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Jadi, jumlah seluruh generasi
  rationale: οὖν merangkum silsilah sebelumnya, sedangkan Πᾶσαι αἱ γενεαὶ mencakup seluruh generasi yang dihitung. Susunan ini menyampaikan maknanya secara alami dalam bahasa Indonesia tanpa menghilangkan unsur 'seluruh'.
- source_word: γενεαὶ
  choice: generasi
  rationale: Dalam konteks silsilah, γενεαί menunjuk pada generasi-generasi berturut-turut, sehingga 'generasi' merupakan padanan yang jelas dan lazim.
- source_word: ἀπὸ ... ἕως
  choice: dari ... sampai
  rationale: Pasangan ini menandai rentang di antara dua titik dalam silsilah; 'dari ... sampai' alami dan tepat dalam bahasa Indonesia.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: pembuangan ke Babel
  rationale: μετοικεσία mengacu pada pemindahan atau deportasi ke tempat pembuangan. 'Pembuangan ke Babel' mempertahankan arah perpindahan dan acuan historisnya.
- source_word: τοῦ χριστοῦ
  choice: Mesias
  rationale: Dengan artikelnya dan sebagai puncak silsilah, χριστός berfungsi sebagai gelar. 'Mesias' menerjemahkan makna gelar itu, sementara bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: γενεαὶ δεκατέσσαρες
  choice: empat belas generasi
  rationale: Frasa nominal yang diulang tiga kali dipertahankan untuk mencerminkan pola retoris dan pembagian silsilah dalam teks Yunani.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Abraham / Daud / Babel
  rationale: Bentuk-bentuk ini mengikuti nama baku yang telah mapan dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut berfungsi sebagai gelar pada puncak silsilah, bukan sekadar sebagai nama diri. 'Mesias' menyatakan arti gelarnya tanpa menutup kemungkinan padanan tradisional 'Kristus', yang diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda titik koma membantu mempertahankan kesejajaran tiga rentang silsilah, sedangkan elipsis pada bagian kedua dan ketiga mengikuti struktur ringkas teks sumber tanpa mengurangi kejelasan.
