revisions:
- from: Jadi, jumlah seluruh generasi dari Abraham sampai Daud adalah empat belas generasi; dari Daud sampai pembuangan ke Babel, empat belas generasi; dan dari pembuangan ke Babel sampai Mesias[a], empat belas generasi.
  to: Jadi, seluruh generasi dari Abraham sampai Daud berjumlah empat belas generasi; dari Daud sampai pembuangan ke Babel, empat belas generasi; dan dari pembuangan ke Babel sampai Mesias[a], empat belas generasi.
  rationale: A minor stylistic revision makes the first clause natural in modern standard Indonesian while retaining “seluruh” for Πᾶσαι, the summarizing “Jadi” for οὖν, and the deliberately parallel three-part genealogical count. The footnote remains correctly anchored to “Mesias” and preserves the conventional alternative “Kristus.”
