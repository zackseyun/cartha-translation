  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: id
  text: Aram[a] memperanakkan Aminadab, Aminadab memperanakkan Nahason, dan Nahason memperanakkan Salmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Ram. Teks Yunani berbunyi Aram (Ἀράμ), sedangkan bentuk Ram mengikuti bentuk nama dalam silsilah Ibrani.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Nama ini dialihaksarakan langsung dari bentuk Yunani Ἀράμ. Bentuk tersebut juga sesuai dengan ejaan yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δὲ
  choice: (tidak diterjemahkan secara tersendiri); dan
  rationale: Dalam silsilah ini δέ berfungsi sebagai penghubung yang meneruskan urutan, bukan sebagai penanda pertentangan. Penghilangan pada hubungan pertama dan penggunaan 'dan' pada hubungan terakhir menghasilkan bahasa Indonesia yang alami tanpa mengubah alurnya.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ini menyatakan hubungan ayah atau garis keturunan. 'Memperanakkan' ringkas, bermartabat, dan lazim dalam silsilah Alkitab bahasa Indonesia, sekaligus tidak memaksakan bahwa setiap hubungan harus dipahami sebagai generasi yang langsung.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Bentuk 'Aminadab' mengikuti alih aksara yang lazim dalam bahasa Indonesia dan tetap dekat dengan bentuk Yunani.
- source_word: Ναασσών
  choice: Nahason
  rationale: Bentuk 'Nahason' mengikuti ejaan nama Alkitab yang telah dikenal dalam bahasa Indonesia serta mencerminkan nama Semitik di balik bentuk Yunani Ναασσών.
- source_word: Σαλμών
  choice: Salmon
  rationale: Bentuk 'Salmon' merupakan alih aksara yang jelas dan lazim bagi nama pribadi ini dalam tradisi Alkitab bahasa Indonesia.
