  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: id
  text: Isai memperanakkan Daud, sang raja. Daud memperanakkan Salomo dari istri Uria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi kira-kira “dari [perempuan] Uria,” suatu ungkapan eliptis yang berarti “dari istri Uria.” Matius tidak menyebut nama Batsyeba di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, verba ini menyatakan bahwa seorang laki-laki menjadi leluhur langsung melalui kelahiran. “Memperanakkan” ringkas, lazim dalam gaya silsilah Alkitab Indonesia, dan mempertahankan arah hubungan dari ayah kepada anak.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: Daud, sang raja
  rationale: Frasa ini secara khusus menandai status Daud sebagai raja. “Sang raja” mempertahankan penekanan artikel Yunani sekaligus terdengar wajar dan bermartabat.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: dari istri Uria
  rationale: Ungkapan Yunani bersifat eliptis, harfiah kira-kira “dari [perempuan] milik/yang terkait dengan Uria.” Kata “istri” perlu dilengkapi agar maknanya jelas dalam bahasa Indonesia, sementara nama Batsyeba tidak ditambahkan.
- source_word: Ἰεσσαὶ
  choice: Isai
  rationale: Bentuk nama yang telah mapan dalam tradisi Alkitab berbahasa Indonesia.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: Σολομῶνα
  choice: Salomo
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: Οὐρίου
  choice: Uria
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: δέ
  choice: —
  rationale: Partikel ini merupakan penghubung ringan dalam rangkaian silsilah. Hubungan antarkalimat sudah jelas dalam bahasa Indonesia sehingga tidak perlu dinyatakan secara eksplisit.
theological_decisions:
- issue: Penyebutan Batsyeba secara tidak langsung oleh Matius
  choice: Mempertahankan ungkapan “dari istri Uria” tanpa menyebut nama Batsyeba.
  alternative: “dari Batsyeba” atau “dari perempuan yang dahulu menjadi istri Uria”
  rationale: Teks Yunani sengaja mengidentifikasi perempuan itu melalui hubungannya dengan Uria. Pilihan ini mempertahankan gema naratif dan ketegangan moral kisah 2 Samuel tanpa menambahkan nama atau penjelasan temporal yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat dengan pola silsilah yang mudah dikenali. “Memperanakkan” dipilih untuk ketepatan genealogis; “sang raja” menampilkan penekanan khusus pada kedudukan Daud. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
