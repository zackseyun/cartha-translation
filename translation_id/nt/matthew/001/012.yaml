id: MAT.1.12
reference: Matthew 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: id
  text: Sesudah pembuangan ke Babel[a], Yekhonya memperanakkan Sealtiel, dan Sealtiel memperanakkan Zerubabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pengasingan ke Babel". Kata Yunani ini mengacu pada pemindahan paksa orang-orang itu ke tempat pembuangan di Babel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Sesudah
  rationale: μετά dengan akusatif menyatakan urutan waktu. δέ merupakan penghubung ringan yang secara alami terserap dalam kalimat bahasa Indonesia.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: pembuangan ke Babel
  rationale: μετοικεσία mengacu pada pemindahan paksa ke tempat pembuangan. 'Pembuangan ke Babel' ringkas, alami, dan mempertahankan baik peristiwa pemindahan maupun keadaan sebagai orang buangan.
- source_word: Ἰεχονίας
  choice: Yekhonya
  rationale: Bentuk nama ini mengikuti ejaan Indonesia yang mendekati nama Ibrani dan tetap mudah dikenali dalam konteks Alkitab.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, γεννάω menyatakan garis keturunan melalui pihak laki-laki. 'Memperanakkan' merupakan rumus silsilah yang ringkas dan tidak mengharuskan bahwa setiap hubungan yang disebut adalah antargenerasi langsung.
- source_word: Σαλαθιήλ
  choice: Sealtiel
  rationale: Bentuk Indonesia yang lazim dan mudah dikenali untuk nama yang diwakili oleh Σαλαθιήλ.
- source_word: δὲ
  choice: dan
  rationale: Pada klausa kedua, δέ menghubungkan mata rantai silsilah berikutnya; 'dan' merupakan padanan Indonesia yang alami.
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: Bentuk nama Indonesia yang lazim dan mudah dikenali untuk Ζοροβαβέλ.
theological_decisions:
- issue: Makna γεννάω dalam silsilah
  choice: Menggunakan 'memperanakkan' sebagai rumus garis keturunan tanpa menegaskan kedekatan biologis antargenerasi.
  alternative: '''menjadi ayah dari'' atau ''menurunkan'''
  rationale: Bahasa silsilah dapat menyatakan keturunan melalui garis laki-laki dan tidak selalu dimaksudkan untuk memastikan bahwa tidak ada generasi yang dilewati. Pilihan ini mempertahankan bentuk formula teks tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula 'memperanakkan' dipertahankan karena ringkas dan sesuai dengan ragam silsilah; nama-nama memakai bentuk Indonesia yang dikenal.
