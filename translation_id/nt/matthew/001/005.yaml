id: MAT.1.5
reference: Matthew 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: id
  text: Salmon memperanakkan Boas dari Rahab,[a] Boas memperanakkan Obed dari Rut, dan Obed memperanakkan Isai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai kata yang berarti “dari” pada nama Rahab dan Rut untuk menunjukkan garis keibuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah ini, kata tersebut menyatakan bahwa seorang laki-laki menjadi asal garis keturunan berikutnya. “Memperanakkan” ringkas, lazim dalam ragam silsilah Alkitab Indonesia, dan tidak menuntut bahwa setiap hubungan harus dipahami sebagai ayah-anak langsung tanpa sela generasi.
- source_word: ἐκ
  choice: dari
  rationale: Dengan nama ibu, ἐκ menandai asal atau garis keibuan. “Dari Rahab” dan “dari Rut” alami dalam bahasa Indonesia serta mempertahankan penyebutan ibu secara eksplisit.
- source_word: δὲ
  choice: dan
  rationale: Di sini δέ merupakan penghubung ringan dalam rangkaian silsilah, bukan penanda pertentangan.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Mengikuti bentuk nama yang sudah dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: Βόες
  choice: Boas
  rationale: Bentuk baku bahasa Indonesia untuk tokoh Perjanjian Lama yang dikenal sebagai Boas.
- source_word: Ῥαχάβ
  choice: Rahab
  rationale: Bentuk baku dan mudah dikenali dalam Alkitab bahasa Indonesia.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Bentuk baku bahasa Indonesia yang menjaga kesinambungan dengan tokoh Perjanjian Lama.
- source_word: Ῥούθ
  choice: Rut
  rationale: Bentuk baku bahasa Indonesia untuk nama tokoh dan kitab Perjanjian Lama tersebut.
- source_word: Ἰεσσαί
  choice: Isai
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menghubungkan tokoh ini dengan silsilah Daud.
theological_decisions:
- issue: Rumus silsilah dan penyebutan para ibu
  choice: Mempertahankan nama Rahab dan Rut dengan frasa “dari” di dalam rangkaian paternal “memperanakkan”.
  alternative: Menerjemahkan hanya sebagai “adalah ayah dari”, atau memakai bentuk yang lebih mekanis seperti “memperanakkan ... keluar dari”.
  rationale: Teks Yunani secara khusus menyebut kedua perempuan dengan ἐκ + genitif. Terjemahan perlu mempertahankan unsur keibuan yang menonjol itu tanpa mengaburkan struktur utama silsilah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “memperanakkan” dipertahankan karena sesuai dengan ragam silsilah; nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
