source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: id
  text: Salomo memperanakkan Rehabeam, Rehabeam memperanakkan Abia, dan Abia memperanakkan Asaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Asa”, sesuai dengan nama raja Yehuda dalam 1 Raja-raja 15 dan 2 Tawarikh 14–16; teks Yunani yang dipakai di sini berbunyi “Asaf”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, γεννάω menyatakan hubungan ayah dengan keturunannya. “Memperanakkan” ringkas, lazim dalam gaya silsilah Alkitab bahasa Indonesia, dan tetap dapat mencakup garis keturunan genealogis.
- source_word: δὲ
  choice: dan / tidak diterjemahkan secara tersendiri
  rationale: Di sini δέ adalah penghubung ringan yang melanjutkan urutan silsilah, bukan pertentangan. Bahasa Indonesia alami tidak perlu mengulang “dan” pada setiap klausa; “dan” dipakai sebelum klausa terakhir.
- source_word: Σολομών
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal dalam Alkitab bahasa Indonesia.
- source_word: Ῥοβοάμ
  choice: Rehabeam
  rationale: Bentuk nama yang baku dan dikenal dalam Alkitab bahasa Indonesia serta menjaga kesinambungan dengan tokoh Perjanjian Lama.
- source_word: Ἀβιά
  choice: Abia
  rationale: Bentuk Indonesia yang dikenal untuk nama raja tersebut dan sesuai dengan bentuk Yunani dalam ayat ini.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Teks Yunani SBLGNT yang diberikan berbunyi Ἀσάφ. Terjemahan utama mempertahankan bacaan itu dan tidak secara diam-diam menyelaraskannya menjadi “Asa”.
theological_decisions:
- issue: Apakah nama dalam silsilah harus diselaraskan dengan daftar raja Perjanjian Lama dengan menerjemahkan Ἀσάφ sebagai “Asa”
  choice: Mempertahankan “Asaf” dalam teks utama
  alternative: Menerjemahkan “Asa” agar sesuai dengan raja Yehuda dalam 1 Raja-raja 15 dan 2 Tawarikh 14–16
  rationale: Keutamaan teks sumber menuntut agar bacaan Yunani Ἀσάφ dipertahankan. Bacaan “Asa” dicatat dalam catatan kaki untuk menjaga transparansi mengenai varian tekstual dan ketegangan genealogis.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pola berulang “memperanakkan” dipertahankan karena sesuai dengan bentuk silsilah, sedangkan δέ diterjemahkan secara alami tanpa pengulangan penghubung yang kaku. Penanda catatan kaki ditempatkan tepat setelah “Asaf”, yaitu unsur yang memiliki varian tekstual.
