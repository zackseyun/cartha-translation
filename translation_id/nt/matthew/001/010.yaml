lexical_decisions:
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, kata ini menyatakan hubungan ayah atau garis keturunan. “Memperanakkan” ringkas, lazim dalam konteks silsilah Alkitab berbahasa Indonesia, dan mempertahankan bentuk aktif teks Yunani.
- source_word: Ἑζεκίας
  choice: Hizkia
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: Μανασσῆς
  choice: Manasye
  rationale: Menggunakan bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: Ἀμώς
  choice: Amos
  rationale: Teks SBLGNT berbunyi Ἀμώς, sehingga nama itu diterjemahkan sebagai “Amos”, bukan diselaraskan secara diam-diam menjadi “Amon”.
- source_word: Ἰωσίας
  choice: Yosia
  rationale: Menggunakan bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: δέ
  choice: dan / tanda baca
  rationale: Dalam rangkaian silsilah ini, δέ berfungsi sebagai penghubung yang meneruskan daftar. Dua kemunculan pertama diwujudkan melalui tanda koma, sedangkan yang terakhir diterjemahkan “dan” agar kalimat alami dalam bahasa Indonesia.
theological_decisions:
- issue: Perbedaan nama dalam teks Yunani Matius dan nama raja Yehuda dalam kitab Raja-Raja
  choice: Menggunakan “Amos” dalam teks utama sesuai Ἀμώς
  alternative: Menggunakan “Amon” untuk menyelaraskannya dengan nama raja dalam 2 Raja-Raja 21
  rationale: Teks utama mengikuti bukti sumber Yunani tanpa harmonisasi. Karena tokoh dalam latar sejarah dikenal sebagai Amon, perbedaan itu dijelaskan dalam catatan kaki agar ketegangan tekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pola berulang dipertahankan agar karakter silsilah tetap jelas; bentuk-bentuk nama mengikuti kelaziman Alkitab bahasa Indonesia, kecuali “Amos” yang secara sengaja mengikuti teks Yunani.
