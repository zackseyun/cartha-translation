  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: id
  text: Asaf[a] memperanakkan Yosafat, Yosafat memperanakkan Yoram, dan Yoram memperanakkan Uzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah memuat “Asa” dan bukan “Asaf”; “Asa” juga sesuai dengan nama raja Yehuda dalam silsilah Perjanjian Lama.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Mentransliterasikan bentuk nama Yunani yang terdapat dalam SBLGNT, tanpa diam-diam menyelaraskannya dengan nama Raja Asa dalam silsilah Perjanjian Lama.
- source_word: δὲ
  choice: dan / tanpa padanan tersendiri
  rationale: Dalam silsilah ini δέ merupakan penghubung ringan, bukan pertentangan. Bahasa Indonesia yang wajar cukup memakai 'dan' sebelum mata rantai terakhir.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Istilah ini ringkas, lazim dalam silsilah Alkitab bahasa Indonesia, dan menyampaikan hubungan garis keturunan dari pihak ayah tanpa memakai ungkapan yang terlalu panjang.
- source_word: Ἰωσαφάτ
  choice: Yosafat
  rationale: Bentuk nama baku dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ἰωράμ
  choice: Yoram
  rationale: Mengikuti bentuk pendek nama Yunani dan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: Ὀζίαν
  choice: Uzia
  rationale: Bentuk baku bahasa Indonesia untuk raja Yehuda tersebut, lebih mudah dikenali daripada transliterasi langsung 'Ozia'.
theological_decisions:
- issue: Penyajian rangkaian silsilah dengan δὲ dan ἐγέννησεν yang berulang
  choice: Mempertahankan setiap mata rantai ayah-anak, tetapi merangkainya secara alami dengan 'dan' hanya sebelum klausa terakhir.
  alternative: Mengulang 'dan' pada awal setiap klausa atau memisahkan semua klausa dengan titik koma.
  rationale: Keputusan ini bersifat stilistis; susunan dan seluruh hubungan genealogis tetap dipertahankan.
- issue: Apakah Ἀσὰφ perlu diselaraskan menjadi Asa dalam teks utama
  choice: Mempertahankan 'Asaf' dalam teks utama dan mencantumkan 'Asa' dalam catatan kaki.
  alternative: Memakai 'Asa' dalam teks utama berdasarkan silsilah Perjanjian Lama atau varian naskah.
  rationale: Teks utama mengikuti bentuk yang tercetak dalam SBLGNT, sementara persoalan tekstual dan identifikasi tokohnya disampaikan secara transparan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Memperanakkan' dipertahankan karena jelas serta mapan untuk konteks silsilah; nama-nama memakai bentuk yang lazim bagi pembaca Alkitab bahasa Indonesia, kecuali 'Asaf' yang mengikuti teks Yunani dan dijelaskan melalui catatan kaki.
