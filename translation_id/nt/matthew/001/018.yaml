id: MAT.1.18
reference: Matthew 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: id
  text: 'Kelahiran Yesus Sang Mesias[a] terjadi demikian: ketika Maria, ibu-Nya, telah dipertunangkan dengan Yusuf[b], sebelum mereka bersatu sebagai suami istri[c], Maria didapati sedang mengandung dari Roh Kudus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Kata Yunani Χριστός berarti “Yang Diurapi” dan di sini diterjemahkan sebagai gelar “Mesias.”
    reason: alternative_reading
  - marker: b
    text: “Dipertunangkan” menunjuk pada ikatan resmi yang diakui secara hukum dan lebih mengikat daripada pertunangan pada masa kini.
    reason: cultural_note
  - marker: c
    text: Ungkapan “bersatu sebagai suami istri” dapat mengacu pada penyempurnaan perkawinan melalui hubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: kelahiran
  rationale: Dalam konteks ini, kata tersebut menunjuk pada kelahiran atau awal keberadaan Yesus dalam kisah yang segera menyusul; “kelahiran” merupakan padanan Indonesia yang paling wajar.
- source_word: Ἰησοῦ χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar yang berarti Yang Diurapi. “Sang Mesias” mempertahankan makna gelar itu dalam bahasa Indonesia yang alami dan khidmat.
- source_word: οὕτως ἦν
  choice: terjadi demikian
  rationale: Ungkapan ini memperkenalkan cara peristiwa itu berlangsung. “Terjadi demikian” ringkas dan sesuai dengan fungsi naratifnya.
- source_word: μνηστευθείσης
  choice: telah dipertunangkan
  rationale: Bentuk pasif ini menunjuk pada ikatan pertunangan resmi yang dalam budaya Yahudi lebih mengikat daripada pertunangan modern biasa.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: sebelum mereka hidup bersama sebagai suami istri
  rationale: Ungkapan Yunani secara harfiah menyatakan bahwa mereka belum “berkumpul/bersatu”; dalam konteks perkawinan, ungkapan itu dapat mencakup hidup bersama dan persatuan seksual. Terjemahan ini mempertahankan bahasa yang santun tanpa menyempitkannya hanya pada salah satu unsur.
- source_word: εὑρέθη
  choice: didapati
  rationale: Padanan ini mempertahankan bentuk pasif Yunani tanpa menentukan siapa yang mengetahui keadaan Maria.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: sedang mengandung
  rationale: Ini adalah ungkapan Yunani untuk keadaan hamil; “sedang mengandung” alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐκ πνεύματος ἁγίου
  choice: dari Roh Kudus
  rationale: ἐκ menandai sumber atau asal. “Dari Roh Kudus” mempertahankan nuansa sumber tersebut.
theological_decisions:
- issue: Pemaknaan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut tampil sebagai gelar. Menerjemahkan maknanya sebagai “Sang Mesias” membuat fungsi gelar itu jelas, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Dalam konteks kisah kelahiran menurut Matius, frasa ini merujuk kepada Roh Kudus ilahi. Ketiadaan kata sandang dalam bahasa Yunani tidak dengan sendirinya menjadikannya tidak tentu.
- issue: Cakupan συνελθεῖν
  choice: hidup bersama sebagai suami istri
  alternative: bersatu / melakukan hubungan suami istri
  rationale: Ungkapan sumber bersifat halus dan dapat mencakup dimulainya kehidupan perkawinan serta penyempurnaannya secara seksual. Teks utama tidak membatasinya hanya pada hubungan seksual, dan catatan kaki menjelaskan implikasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan alur satu kalimat dari teks Yunani, sedangkan “tetapi” mengungkapkan pertentangan yang tersirat antara pertunangan dan belum dimulainya kehidupan bersama. Pengulangan nama “Maria” menghindari ketidakjelasan rujukan pronomina dalam kalimat Indonesia.
