  source_fidelity: 'Teks Indonesia secara akurat mencerminkan semua unsur utama Yunani: seruan Ἰδού, παρθένος sebagai “perawan,” masa depan pada konsepsi dan kelahiran, anak laki-laki, subjek jamak tak tentu dalam καλέσουσιν, nama Imanuel, dan penjelasan “Allah beserta kita.” Tidak ada penambahan penafsiran teologis di luar ayat.'
