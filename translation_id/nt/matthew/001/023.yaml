id: MAT.1.23
reference: Matthew 1:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: id
  text: “Sesungguhnya, seorang perawan[a] akan mengandung dan melahirkan seorang anak laki-laki, dan mereka[b] akan menamakan dia Imanuel[c]”—yang diterjemahkan, “Allah beserta kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan muda”. Namun, dalam konteks Matius, kata Yunani παρθένος dan kisah kelahiran di sekitarnya mendukung terjemahan “perawan”.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang dipakai secara harfiah berarti “mereka akan menamakan”; bentuk jamak ini tidak menyebutkan secara khusus siapa pelakunya.
    reason: lexical_alternative
  - marker: c
    text: Nama ini juga dapat ditransliterasikan “Emanuel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Sesungguhnya
  rationale: Dalam kutipan nubuat ini, kata tersebut berfungsi menarik perhatian secara khidmat. “Sesungguhnya” mempertahankan nada yang tinggi dan wajar dalam bahasa Indonesia tanpa menjadi terlalu harfiah.
- source_word: ἡ παρθένος
  choice: seorang perawan
  rationale: Dalam konteks Matius dan kisah kelahiran di sekitarnya, παρθένος menunjuk kepada perempuan yang belum pernah berhubungan seksual. Kata “perawan” adalah padanan Indonesia yang langsung dan alami.
- source_word: ἐν γαστρὶ ἕξει
  choice: akan mengandung
  rationale: Ungkapan Yunani ini secara harfiah berarti “akan mempunyai dalam rahim”; “akan mengandung” menyampaikan idiom tersebut secara alami serta mempertahankan bentuk masa depan.
- source_word: τέξεται υἱόν
  choice: akan melahirkan seorang anak laki-laki
  rationale: Terjemahan ini jelas dan alami dalam bahasa Indonesia, sekaligus mempertahankan tindakan melahirkan dan jenis kelamin anak yang dinyatakan dalam teks.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: mereka akan menamakan dia
  rationale: Bentuk orang ketiga jamak dipertahankan sebagai “mereka”, tanpa menetapkan siapa pelakunya. “Menamakan dia” menyampaikan fungsi ungkapan Semitis mengenai pemberian atau penyebutan nama secara wajar.
- source_word: Ἐμμανουήλ
  choice: Imanuel
  rationale: “Imanuel” adalah transliterasi yang lazim dalam bahasa Indonesia dan selaras dengan arti nama yang langsung dijelaskan oleh Matius.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: yang diterjemahkan
  rationale: Padanan ini mengikuti struktur partisipel penjelas dalam bahasa Yunani dan memperkenalkan arti nama tersebut dengan ringkas.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Allah beserta kita
  rationale: Ini adalah terjemahan Indonesia yang jelas dan mapan bagi penjelasan nama tersebut, tanpa menambahkan penjabaran teologis yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Makna παρθένος dalam ayat yang berkaitan dengan konsepsi dari seorang perawan
  choice: perawan
  alternative: perempuan muda
  rationale: Matius memakai παρθένος dalam konteks langsung konsepsi Yesus yang luar biasa. Karena itu, “perawan” paling tepat untuk teks utama. Alternatif yang muncul dalam pembahasan mengenai latar Yesaya 7:14 tetap dicatat tanpa menggantikan makna yang didukung konteks Matius.
- issue: Makna teologis nama Imanuel
  choice: Allah beserta kita
  alternative: Beserta kita adalah Allah
  rationale: Urutan ini alami dalam bahasa Indonesia dan mempertahankan bobot pernyataan Matius tanpa mengembangkannya menjadi uraian doktrinal tentang inkarnasi.
- issue: Pelaku tak tentu dalam καλέσουσιν
  choice: mereka akan menamakan dia
  alternative: dia akan dinamakan
  rationale: Bentuk jamak aktif dalam bahasa Yunani sengaja dipertahankan agar subjeknya tetap tidak ditentukan, alih-alih diubah menjadi bentuk pasif yang mengurangi ketegangan gramatikal teks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Sesungguhnya” mempertahankan daya panggil nubuat; susunan kalimat tetap dekat dengan bentuk kutipan Yunani, sementara idiom kehamilan dan kelahiran dibuat alami. Kata ganti “dia” ditulis dengan huruf kecil sesuai kaidah umum dan untuk menghindari penambahan penanda penghormatan yang tidak terdapat dalam bentuk Yunani.
