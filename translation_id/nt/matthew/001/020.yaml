id: MAT.1.20
reference: Matthew 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: id
  text: Namun, sementara ia mempertimbangkan hal-hal itu, sesungguhnya, seorang malaikat Tuhan menampakkan diri kepadanya dalam mimpi dan berkata, “Yusuf, anak Daud, jangan takut menerima Maria, istrimu,[a] karena yang dikandungnya berasal dari Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menerima Maria, istrimu.” Dalam konteks ini, ungkapan Yunani itu merujuk pada menerima Maria ke dalam rumah tangga Yusuf dalam perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: sementara ia mempertimbangkan
  rationale: Menyampaikan pertimbangan batin Yusuf yang sedang berlangsung tanpa mengartikannya sebagai keputusan yang sudah bulat.
- source_word: ἰδοὺ
  choice: tiba-tiba
  rationale: Sebagai penanda wacana, kata ini menonjolkan kemunculan yang mengejutkan dan menghidupkan peralihan dalam narasi; padanan ini lebih alami daripada 'lihatlah' dalam narasi Indonesia modern.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: Nomina Yunani ἄγγελος tidak memakai artikel; 'seorang' tidak memaksakan identifikasi dengan figur tertentu, sedangkan κυρίου diterjemahkan 'Tuhan'.
- source_word: κατ’ ὄναρ
  choice: dalam mimpi
  rationale: Padanan idiomatis dan langsung untuk ungkapan Yunani ini.
- source_word: ἐφάνη
  choice: menampakkan diri
  rationale: Mengungkapkan kemunculan yang bersifat penyataan dengan bahasa Indonesia yang alami.
- source_word: υἱὸς Δαυίδ
  choice: anak Daud
  rationale: Mempertahankan sebutan garis keturunan Daud dan kemungkinan gema mesianiknya; 'anak' lazim mencakup keturunan dalam bahasa Alkitab Indonesia.
- source_word: μὴ φοβηθῇς
  choice: jangan takut
  rationale: Padanan larangan yang alami dan tepat.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: menerima Maria, istrimu, ke rumahmu
  rationale: Menjaga bahwa Maria sudah disebut sebagai istri Yusuf dan menjelaskan tindakan παραλαμβάνω dalam konteks perkawinan, yaitu membawanya masuk ke rumah tangga, tanpa menyiratkan bahwa ia baru dijadikan istri pada saat itu.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: yang dikandung di dalam dirinya
  rationale: Mengungkapkan keadaan pranatal secara alami sambil mempertahankan bentuk netral 'yang' dan menghindari penambahan eksplisit 'anak' yang tidak terdapat dalam konstruksi Yunani.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: berasal dari Roh Kudus
  rationale: ἐκ menunjukkan sumber atau asal; 'berasal dari' menyatakannya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna κυρίου dalam ἄγγελος κυρίου
  choice: Tuhan
  alternative: TUHAN/YHWH atau identifikasi khusus sebagai 'Malaikat TUHAN'
  rationale: Menerjemahkan κύριος secara langsung sebagai 'Tuhan' tanpa memaksakan identifikasi teofanik tertentu yang tidak ditentukan oleh konstruksi tanpa artikel ini.
- issue: Rujukan πνεύματός ... ἁγίου
  choice: Roh Kudus
  alternative: suatu roh kudus atau kuasa Roh Kudus
  rationale: Dalam konteks kisah kelahiran Matius, ungkapan ini menunjuk kepada Roh Kudus sebagai sumber ilahi; terjemahan tidak menambahkan kata 'kuasa' yang tidak ada dalam teks.
- issue: Status Maria dalam τὴν γυναῖκά σου
  choice: Maria, istrimu
  alternative: Maria sebagai istrimu
  rationale: Apositif Yunani secara langsung menyebut Maria sebagai istri Yusuf. Terjemahan utama mempertahankan status itu dan tidak menyiratkan perubahan status yang baru terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tiba-tiba' menerjemahkan daya naratif ἰδοὺ secara alami. Frasa 'menerima Maria, istrimu, ke rumahmu' dipilih untuk mempertahankan status Maria sebagai istri sekaligus membuat tindakan yang dimaksud jelas bagi pembaca umum.
