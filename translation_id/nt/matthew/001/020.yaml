  to: Namun, sementara ia mempertimbangkan hal-hal itu, sesungguhnya, seorang malaikat Tuhan menampakkan diri kepadanya dalam mimpi dan berkata, “Yusuf, anak Daud, jangan takut menerima Maria, istrimu,[a] karena yang dikandungnya berasal dari Roh Kudus.”
