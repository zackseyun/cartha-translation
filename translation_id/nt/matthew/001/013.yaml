id: MAT.1.13
reference: Matthew 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: id
  text: Zerubabel memperanakkan Abihud[a], Abihud memperanakkan Elyakim, dan Elyakim memperanakkan Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi ayah dari”; dalam silsilah Alkitab, kata kerja yang diulang ini dapat menyajikan garis keturunan secara ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia dan merujuk kepada tokoh sejarah yang sama.
- source_word: δέ
  choice: — / dan
  rationale: Dalam rangkaian silsilah ini, δέ berfungsi sebagai penghubung ringan yang melanjutkan daftar, bukan sebagai penanda pertentangan. Penghubung tidak perlu diulang pada setiap klausa dalam bahasa Indonesia; kata “dan” pada klausa terakhir mempertahankan alur kumulatifnya.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam rumusan silsilah, γεννάω menyatakan hubungan keturunan dari pihak laki-laki. “Memperanakkan” ringkas, wajar dalam konteks silsilah Alkitab, dan tidak setua bentuk “memperoleh anak” ataupun seluas “merupakan leluhur dari”.
- source_word: Ἀβιούδ
  choice: Abihud
  rationale: Nama diri memakai bentuk Indonesia yang telah lazim dalam tradisi penerjemahan Alkitab.
- source_word: Ἐλιακίμ
  choice: Elyakim
  rationale: Nama diri memakai ejaan Indonesia yang lazim dan tetap mencerminkan bentuk Yunani.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Nama diri ditransliterasikan secara sederhana tanpa tanda diakritik, sesuai praktik umum bahasa Indonesia.
theological_decisions:
- issue: Makna γεννάω dalam silsilah yang mungkin meringkas beberapa generasi
  choice: memperanakkan
  alternative: menjadi ayah dari; merupakan leluhur dari
  rationale: Rumusan “memperanakkan” mempertahankan pola genealogis langsung dalam teks Yunani tanpa secara sengaja memutuskan apakah setiap mata rantai merupakan hubungan ayah-anak langsung atau apakah silsilah itu meringkas beberapa generasi. Alternatif “merupakan leluhur dari” terlalu eksplisit memperluas maknanya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “memperanakkan” dipertahankan untuk mencerminkan formula silsilah Yunani, sedangkan nama-nama mengikuti bentuk yang lazim bagi pembaca Alkitab Indonesia.
