  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: id
  text: Yehuda memperanakkan Peres dan Zerah dari Tamar. Peres memperanakkan Hezron, dan Hezron memperanakkan Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan memakai nama “Ram” di sini, mengikuti bentuk nama dalam tradisi lain; teks Yunani di sini berbunyi “Aram”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Yehuda
  rationale: Dalam konteks silsilah leluhur Israel, bentuk baku Indonesia 'Yehuda' menjaga kesinambungan dengan nama tokoh dan suku dalam Perjanjian Lama serta membedakannya dari tokoh-tokoh Perjanjian Baru yang lazim disebut Yudas.
- source_word: δὲ
  choice: dan / tanda baca
  rationale: δέ berfungsi sebagai penghubung ringan dalam rangkaian silsilah, bukan sebagai pertentangan. Sebagian hubungannya dinyatakan melalui pemenggalan kalimat dan kemunculan terakhir diterjemahkan 'dan' agar alurnya alami.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam silsilah, γεννάω menyatakan hubungan ayah atau garis keturunan. 'Memperanakkan' ringkas, mapan dalam gaya silsilah Alkitab bahasa Indonesia, dan tidak menambahkan penjelasan yang tidak terdapat dalam teks.
- source_word: Φαρὲς
  choice: Peres
  rationale: Bentuk ini selaras dengan nama Ibrani פֶּרֶץ dan pemakaian baku bahasa Indonesia dalam Perjanjian Lama.
- source_word: Ζάρα
  choice: Zerah
  rationale: Bentuk ini selaras dengan nama Ibrani זֶרַח dan menjaga kesinambungan penamaan dengan Perjanjian Lama.
- source_word: ἐκ τῆς Θαμάρ
  choice: dari Tamar
  rationale: ἐκ dengan nama ibu menunjukkan asal maternal. 'Dari Tamar' alami dalam bahasa Indonesia dan mempertahankan penyebutan ibu tanpa memperluas makna.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Bentuk ini sesuai dengan nama Ibrani חֶצְרוֹן dan pemakaian yang dikenal dalam Perjanjian Lama bahasa Indonesia.
- source_word: Ἀράμ
  choice: Aram
  rationale: Teks Yunani SBLGNT yang diberikan berbunyi Ἀράμ, sehingga bentuk 'Aram' dipertahankan dalam teks utama dan tidak diselaraskan secara diam-diam dengan tradisi nama lain.
theological_decisions:
- issue: Apakah nama terakhir perlu diselaraskan dengan bentuk yang lazim dalam silsilah Perjanjian Lama
  choice: Aram
  alternative: Ram
  rationale: Keutamaan diberikan kepada bentuk dalam sumber Yunani yang tersedia, yaitu Ἀράμ. Bentuk 'Ram' dicatat sebagai alternatif tradisional agar perbedaan tetap dapat diaudit tanpa mengubah teks utama.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Istilah 'memperanakkan' dipilih karena ringkas dan masih mudah dipahami dalam konteks silsilah. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia, kecuali 'Aram', yang secara langsung mengikuti teks Yunani yang diberikan.
