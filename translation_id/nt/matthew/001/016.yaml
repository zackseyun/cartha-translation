id: MAT.1.16
reference: Matthew 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: id
  text: Yakub memperanakkan Yusuf, suami Maria; dari Maria lahirlah Yesus, yang disebut Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel δέ hanya meneruskan daftar silsilah. Dalam bahasa Indonesia, kesinambungan itu sudah jelas tanpa kata penghubung tambahan.
- source_word: ἐγέννησεν
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ini menyatakan hubungan keturunan dari pihak laki-laki. 'Memperanakkan' ringkas, lazim dalam gaya silsilah Alkitab, dan tidak searkais 'memperanakkan' dalam konteks lain.
- source_word: τὸν ἄνδρα Μαρίας
  choice: suami Maria
  rationale: Dengan pelengkap 'Maria', ἀνήρ jelas menyatakan hubungan perkawinan, bukan sekadar 'laki-laki'.
- source_word: ἐξ ἧς
  choice: dari Maria
  rationale: Kata ganti relatif Yunani berbentuk feminin tunggal dan secara khusus merujuk kepada Maria. Mengulangi nama Maria menjaga rujukan itu tetap tegas karena bahasa Indonesia tidak memiliki kata ganti relatif bergender.
- source_word: ἐγεννήθη
  choice: lahirlah
  rationale: Bentuk pasif ini mengubah pola dari tindakan memperanakkan oleh laki-laki menjadi kelahiran Yesus dari Maria. 'Lahirlah' alami dan mempertahankan peralihan tersebut.
- source_word: ὁ λεγόμενος
  choice: yang disebut
  rationale: Ungkapan ini secara langsung memperkenalkan sebutan atau gelar yang dikenakan kepada Yesus.
- source_word: χριστός
  choice: Mesias
  rationale: Di sini χριστός berfungsi sebagai gelar dalam ungkapan identifikasi, bukan sebagai unsur nama diri; 'Mesias' menyampaikan makna gelar itu dalam bahasa Indonesia.
theological_decisions:
- issue: Peralihan rumusan silsilah dari Yusuf kepada kelahiran Yesus
  choice: Yakub memperanakkan Yusuf, tetapi Yesus lahir dari Maria
  alternative: Yusuf memperanakkan Yesus
  rationale: Teks Yunani beralih dari bentuk aktif ἐγέννησεν kepada bentuk pasif ἐγεννήθη dan memakai ἐξ ἧς yang feminin tunggal. Terjemahan mempertahankan perbedaan ini tanpa menambahkan penjelasan teologis.
- issue: Penerjemahan gelar χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Frasa 'yang disebut' menunjukkan bahwa χριστός berfungsi sebagai gelar. 'Mesias' mempertahankan fungsi titularnya, sedangkan alternatif tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat. Tanda titik koma mempertahankan satu kesatuan kalimat sekaligus memperjelas perubahan pola silsilah. Nama Maria diulang agar rujukan feminin ἐξ ἧς tidak menjadi kabur dalam bahasa Indonesia.
