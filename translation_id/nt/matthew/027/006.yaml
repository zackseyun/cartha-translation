    rationale: τίμη terutama berarti harga/nilai atau harga yang dibayarkan. “Harga darah” mengikuti hubungan genitif Yunani secara lebih langsung dan tidak menafsirkan “darah” secara sempit. “Uang darah” tetap tepat sebagai alternatif catatan kaki.
  - severity: low
