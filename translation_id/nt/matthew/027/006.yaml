id: MAT.27.6
reference: Matthew 27:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: id
  text: Tetapi imam-imam kepala mengambil keping perak itu dan berkata, “Tidak boleh memasukkannya ke dalam perbendaharaan Bait Allah[a], karena itu adalah harga darah[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yunani korbanan, istilah yang merujuk pada perbendaharaan atau dana suci Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “uang darah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Padanan baku dan alami untuk para pemimpin senior dalam kalangan imam; bentuk jamak Yunani dipertahankan.
- source_word: λαβόντες
  choice: mengambil
  rationale: Partisip aoris menyatakan tindakan yang menyertai atau mendahului perkataan mereka; susunan verba berurutan lebih alami dalam bahasa Indonesia.
- source_word: τὰ ἀργύρια
  choice: keping-keping perak itu
  rationale: Menunjuk kembali kepada pembayaran berupa perak yang telah disebutkan; ungkapan ini mempertahankan wujud konkretnya tanpa menetapkan jenis mata uang yang tidak disebutkan di sini.
- source_word: Οὐκ ἔξεστιν
  choice: Tidak boleh
  rationale: Menyampaikan larangan berdasarkan ketentuan atau kepatutan religius secara alami dan jelas dalam bahasa Indonesia.
- source_word: βαλεῖν
  choice: memasukkannya
  rationale: Dalam konteks perbendaharaan, verba ini berarti menaruh atau memasukkan; pilihan ini lebih alami daripada arti harfiah 'melemparkan'.
- source_word: κορβανᾶν
  choice: perbendaharaan Bait Allah
  rationale: Istilah ini menunjuk kepada perbendaharaan atau dana suci Bait Allah. Maknanya diterjemahkan dalam teks, sedangkan bentuk istilah sumber dipertahankan dalam catatan kaki.
- source_word: ἐπεὶ
  choice: karena
  rationale: Memperkenalkan alasan bagi larangan tersebut secara langsung dan alami.
- source_word: τιμὴ αἵματός
  choice: bayaran untuk darah
  rationale: Mempertahankan hubungan harfiah antara 'bayaran/harga' dan 'darah' tanpa menentukan lebih jauh apakah darah menunjuk pada kematian, penumpahan darah, atau kesalahan yang menyertainya.
theological_decisions:
- issue: Cara menerjemahkan κορβανᾶν tanpa mengaburkan latar sakralnya
  choice: perbendaharaan Bait Allah
  alternative: korbanas; perbendaharaan
  rationale: Konteksnya adalah dana suci Bait Allah dan kepatutan religius. Terjemahan maknawi membuat acuan itu jelas bagi pembaca modern, sementara catatan kaki mempertahankan istilah Yunani.
- issue: Cara mempertahankan ketegangan dalam frasa τιμὴ αἵματός
  choice: bayaran untuk darah
  alternative: uang darah; harga darah
  rationale: Pilihan utama dekat dengan susunan Yunani dan tidak mempersempit 'darah' menjadi satu penafsiran tertentu. Padanan idiomatis 'uang darah' dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “imam-imam kepala” mengikuti istilah umum dalam terjemahan Alkitab Indonesia; “Tidak boleh” menghindari kekakuan sambil tetap menyampaikan larangan religius-hukum.
