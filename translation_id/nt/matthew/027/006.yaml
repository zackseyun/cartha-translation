    rationale: Teks SBLGNT berbunyi κορβανᾶν, yang dapat ditransliterasikan “korbanan.” Catatan direvisi untuk menyebut bentuk yang benar sambil menjelaskan bahwa istilah tersebut merujuk pada dana/perbendaharaan suci Bait Allah.
  revised_text: Tetapi imam-imam kepala mengambil keping perak itu dan berkata, “Tidak boleh memasukkannya ke dalam perbendaharaan Bait Allah[a], karena itu adalah harga darah[b].”
  revised_footnotes:
