revisions:
- from: Tetapi imam-imam kepala mengambil keping-keping perak itu dan berkata, “Tidak boleh memasukkannya ke dalam perbendaharaan Bait Allah[a], karena uang itu adalah bayaran untuk darah[b].”
  to: Tetapi imam-imam kepala mengambil keping perak itu dan berkata, “Tidak boleh memasukkannya ke dalam perbendaharaan Bait Allah[a], karena itu adalah harga darah[b].”
  rationale: Revisi terbatas pada peningkatan ketepatan leksikal dan kelancaran bahasa Indonesia. “Harga darah” mempertahankan cakupan semantis τίμη αἵματος dan catatan a kini mencerminkan bentuk Yunani yang benar dalam teks sumber. Penanda catatan kaki tetap melekat pada istilah yang dijelaskan.
