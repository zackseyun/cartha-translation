  source_fidelity: 'Teks utama pada dasarnya setia kepada Yunani: ἀρχιερεῖς diterjemahkan sebagai “imam-imam kepala,” τὰ ἀργύρια sebagai keping perak, κορβανᾶν dijelaskan sebagai perbendaharaan Bait Allah, dan τίμη αἵματος dipertahankan tanpa mempersempit maknanya menjadi penumpahan darah atau pembunuhan. Namun, “bayaran untuk darah” kurang langsung sebagai padanan τίμη αἵματος; “harga darah” lebih dekat dan alami sambil tetap mempertahankan ambiguitasnya.'
  naturalness: Susunan kalimatnya jelas dan beragam baku modern. “Keping-keping perak” dapat diringkaskan menjadi “keping perak” tanpa kehilangan bentuk jamak, karena nomina takrif dengan penunjuk “itu” dapat menyatakan pluralitas dalam bahasa Indonesia. “Harga darah” lebih idiomatis dan bermartabat daripada “bayaran untuk darah.”
  terminology: “Imam-imam kepala” dan “Bait Allah” konsisten dengan register Alkitab bahasa Indonesia. Catatan untuk κορβανᾶν perlu membedakan bentuk Yunani yang muncul dalam ayat (korbanan) dari lema/bentuk istilah yang lazim disebut Korban/korbanas, agar tidak menyatakan bentuk transliterasi yang tidak tepat sebagai bentuk tekstual.
