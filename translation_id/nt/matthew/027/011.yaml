id: MAT.27.11
reference: Matthew 27:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: id
  text: Yesus berdiri di hadapan gubernur, lalu gubernur itu bertanya kepada-Nya, “Apakah Engkau Raja orang Yahudi[a]?” Yesus berkata, “Engkau berkata demikian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea.” Istilah Yunani ini dapat menunjuk kepada orang Yahudi secara luas atau, dalam konteks tertentu, kepada orang Yudea secara khusus.
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau sendiri yang mengatakannya,” atau “Benar seperti yang engkau katakan.” Jawaban Yesus dalam bahasa Yunani singkat dan agak eliptis.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: berdiri
  rationale: Bentuk aoris pasif yang berfungsi intransitif di sini paling alami diterjemahkan “berdiri”; terjemahan “dibuat berdiri” akan memasukkan unsur penyebab yang tidak dinyatakan secara tegas.
- source_word: ἔμπροσθεν
  choice: di hadapan
  rationale: Ungkapan ini alami dalam bahasa Indonesia, tetap ringkas, dan sesuai dengan suasana pemeriksaan resmi.
- source_word: ἡγεμών / ἡγεμόνος
  choice: gubernur
  rationale: “Gubernur” merupakan sebutan yang jelas dan lazim bagi pejabat Romawi dalam konteks ini; “prefek” terlalu teknis, sedangkan “penguasa” terlalu umum.
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Dalam konteks pengadilan, kata ini menunjuk pada pengajuan pertanyaan. “Bertanya” terdengar alami tanpa menambahkan kesan keras yang dapat timbul dari “menginterogasi”.
- source_word: βασιλεὺς
  choice: Raja
  rationale: Huruf kapital menandai pemakaiannya sebagai gelar tertentu dalam pertanyaan langsung mengenai kedudukan Yesus.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam kisah sengsara, frasa ini paling wajar dipahami sebagai sebutan politik-etnis bagi orang Yahudi; “orang Yudea” tetap merupakan kemungkinan leksikal dan dicatat dalam catatan kaki.
- source_word: ἔφη
  choice: berkata
  rationale: Kata ini secara langsung memperkenalkan tanggapan Yesus; “menjawab” benar menurut konteks, tetapi sedikit lebih interpretatif.
- source_word: Σὺ λέγεις
  choice: Engkau berkata demikian
  rationale: Ungkapan ini mempertahankan jawaban Yunani yang singkat, eliptis, dan tertahan, tanpa mengubahnya menjadi pengakuan tegas ataupun penyangkalan.
theological_decisions:
- issue: Nuansa jawaban Yesus, Σὺ λέγεις
  choice: 'Jawaban tidak langsung dan berkualifikasi: “Engkau berkata demikian.”'
  alternative: 'Penegasan langsung: “Benar seperti yang engkau katakan.”'
  rationale: Susunan Yunani tidak menyangkal gelar itu, tetapi juga tidak mengulanginya dalam kerangka politik sang gubernur sebagai pernyataan tegas. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Di hadapan” mempertahankan suasana resmi, sedangkan “lalu” menghubungkan tindakan secara alami tanpa menambahkan penanda waktu seperti “sekarang” yang tidak terdapat dalam teks sumber.
