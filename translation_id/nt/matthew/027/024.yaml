  to: Ketika Pilatus melihat bahwa usahanya sama sekali tidak berhasil, malah kerusuhan mulai terjadi, ia mengambil air dan membasuh tangannya di hadapan orang banyak sambil berkata, “Aku tidak bersalah atas darah ini.”[a] “Kalian sendiri yang akan mengurusnya.”[b]
