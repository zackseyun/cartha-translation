  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: id
  text: Ketika Pilatus melihat bahwa usahanya sama sekali tidak berhasil, malah kerusuhan mulai terjadi, ia mengambil air dan membasuh tangannya di hadapan orang banyak sambil berkata, “Aku tidak bersalah atas darah ini.”[a] “Kalian sendiri yang akan mengurusnya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Aku tidak bersalah dari darah ini.” Ungkapan ini berarti bahwa Pilatus menyatakan dirinya bebas dari tanggung jawab atas kematian yang akan terjadi.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Kalian sendiri akan melihat.” Ungkapan ini juga dapat berarti, “Kalian sendiri yang akan mengurusnya” atau “Lihatlah sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Ketika Pilatus melihat
  rationale: Partisip aoris dengan δέ melanjutkan alur narasi. Dalam bahasa Indonesia, “Ketika ... melihat” menyampaikan hubungan waktu dan perkembangan adegan secara alami tanpa memaksakan nuansa pertentangan.
- source_word: ὅτι οὐδὲν ὠφελεῖ
  choice: bahwa usahanya sama sekali tidak berhasil
  rationale: Secara harfiah, frasa ini berarti bahwa tidak ada sesuatu pun yang berguna atau menghasilkan manfaat. Subjek tersiratnya adalah upaya Pilatus mengendalikan keadaan; pilihan ini membuat maksudnya jelas dan idiomatis.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: malah kerusuhan mulai terjadi
  rationale: θόρυβος dapat berarti kegaduhan, kekacauan, atau kerusuhan. Konteks massa yang makin tidak terkendali mendukung “kerusuhan,” sedangkan γίνεται menyatakan keadaan yang sedang timbul.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: ia mengambil air dan membasuh tangannya
  rationale: Partisip tindakan pendahuluan diterjemahkan sebagai verba berurutan agar alami. “Membasuh tangannya” mempertahankan tindakan publik dan simbolis Pilatus.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: di hadapan orang banyak
  rationale: Frasa ini menekankan bahwa tindakan tersebut dilakukan secara terbuka dalam pandangan khalayak.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Aku tidak bersalah atas darah ini
  rationale: ἀθῷος menyatakan bebas dari kesalahan atau tanggung jawab. Ungkapan “darah ini” dipertahankan dekat dengan bentuk Yunani dan mengacu pada tanggung jawab atas kematian yang akan terjadi.
- source_word: ὑμεῖς ὄψεσθε
  choice: Kalian sendirilah yang harus menanggungnya
  rationale: Secara harfiah berarti “kalian akan melihat,” tetapi dalam konteks ini merupakan ungkapan yang menyerahkan urusan dan tanggung jawab kepada pihak lain. Pronoun eksplisit ὑμεῖς diberi tekanan melalui “sendirilah.”
theological_decisions:
- issue: Pernyataan Pilatus bahwa dirinya tidak bersalah
  choice: Dipertahankan sebagai klaim Pilatus sendiri dalam ujaran langsung, tanpa dibenarkan oleh narator.
  alternative: Menerjemahkan secara lebih interpretatif sebagai “Aku tidak bertanggung jawab atas kematian orang ini.”
  rationale: '“Aku tidak bersalah atas darah ini” mempertahankan citra darah dan ketegangan moral dalam narasi: Pilatus menyatakan dirinya bebas dari kesalahan, tetapi terjemahan tidak memutuskan apakah klaim itu benar.'
- issue: Penyerahan tanggung jawab kepada orang banyak
  choice: Kalian sendirilah yang harus menanggungnya.
  alternative: Kalian sendiri akan melihat.
  rationale: Ungkapan Yunani dapat diterjemahkan harfiah sebagai “kalian akan melihat,” tetapi di sini secara idiomatis berarti bahwa merekalah yang harus mengurus dan menanggung perkara itu. Catatan kaki menjaga bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Orang banyak” sesuai dengan konteks kerumunan; “kalian” membedakan sapaan jamak yang ditekankan. Citra “darah ini” dipertahankan agar hubungan dengan ungkapan Yunani dan ketegangan moral teks tidak hilang.
