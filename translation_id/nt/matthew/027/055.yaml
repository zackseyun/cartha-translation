  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: id
  text: Di sana ada banyak perempuan yang mengamati dari jauh, yaitu mereka yang telah mengikuti Yesus dari Galilea dan melayani-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membantu memenuhi kebutuhan-Nya.” Kata Yunani untuk “melayani” dapat menunjuk pada pelayanan atau dukungan praktis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Di situ juga ada
  rationale: Bentuk imperfek menyatakan keberadaan mereka di tempat kejadian, sedangkan δέ berfungsi sebagai penghubung ringan. Kata 'juga' menghubungkan adegan secara alami tanpa memberi kesan pertentangan yang kuat.
- source_word: γυναῖκες πολλαὶ
  choice: banyak perempuan
  rationale: Terjemahan langsung dan wajar yang mempertahankan jumlah serta jenis kelamin.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: mengamati dari jauh
  rationale: Partisipel kini menggambarkan pengamatan yang sedang berlangsung; 'mengamati' menyampaikan perhatian visual yang berkelanjutan, dan 'dari jauh' mempertahankan keterangan jarak.
- source_word: αἵτινες
  choice: Mereka
  rationale: Konstruksi relatif Yunani mengidentifikasi para perempuan itu melalui tindakan mereka. Pemecahan menjadi kalimat baru menghasilkan bahasa Indonesia yang alami tanpa menghilangkan hubungan tersebut.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ
  choice: telah mengikuti Yesus
  rationale: Verba aoris menunjuk pada tindakan sebelum adegan penyaliban saat ini; 'telah mengikuti' memperjelas urutan itu. Objek langsung 'Yesus' sesuai dengan tata bahasa Indonesia.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: Menandai titik geografis awal perjalanan mereka bersama Yesus.
- source_word: διακονοῦσαι αὐτῷ
  choice: melayani Dia
  rationale: διακονέω mencakup pelayanan atau dukungan praktis. 'Melayani' mempertahankan keluasan makna tanpa menjadikannya jabatan gerejawi formal.
theological_decisions:
- issue: Makna pelayanan para perempuan kepada Yesus
  choice: melayani Dia
  alternative: mengurus kebutuhan-Nya / membantu-Nya
  rationale: '''Melayani'' cukup luas untuk mencakup bantuan dan dukungan praktis tanpa membatasi peran mereka pada pekerjaan rumah tangga ataupun mengubahnya menjadi jabatan pelayanan formal.'
- issue: Hubungan waktu tindakan mengikuti dengan adegan penyaliban
  choice: telah mengikuti Yesus
  alternative: mengikuti Yesus
  rationale: Kata 'telah' secara alami menandai bahwa tindakan mengikuti dari Galilea mendahului keberadaan mereka pada adegan ini, tanpa menambahkan gagasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat Yunani yang panjang dipecah menjadi dua agar mudah dipahami. Pronomina 'Dia' dipakai bagi Yesus sesuai kelaziman penerbitan Alkitab Indonesia; kapitalisasi tidak berasal dari pembedaan dalam teks Yunani.
