id: MAT.27.9
reference: Matthew 27:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: id
  text: Pada waktu itu genaplah apa yang disampaikan melalui Nabi Yeremia[a], yang berkata, “Mereka mengambil tiga puluh keping perak, yaitu harga orang yang telah dinilai, yang mereka nilai dari antara anak-anak Israel[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matius mengaitkan perkataan nubuat ini dengan Yeremia. Susunannya paling dekat dengan Zakharia 11:12–13. Ada yang memahaminya sebagai kutipan gabungan, sebagai rujukan kepada kumpulan kitab para nabi yang dikaitkan dengan Yeremia, atau sebagai masalah dalam penyalinan teks.
    reason: textual_variant
  - marker: b
    text: 'Frasa Yunaninya sulit. Terjemahan lain yang mungkin: “yang dinilai oleh anak-anak Israel.” Ungkapan “dari antara anak-anak Israel” mencerminkan kemungkinan bahwa frasa itu menunjukkan orang tersebut berasal dari kelompok itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dalam narasi secara alami tanpa menambah hubungan sebab-akibat.
- source_word: ἐπληρώθη
  choice: genaplah
  rationale: Mempertahankan rumusan penggenapan khas Matius serta bentuk pasif dari teks Yunani.
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: apa yang disampaikan melalui Nabi Yeremia
  rationale: Menyampaikan ujaran nubuat terdahulu dan mempertahankan διά sebagai perantaraan, bukan mengubah nama nabi untuk menyelaraskannya dengan Zakharia.
- source_word: λέγοντος
  choice: yang berkata
  rationale: Mempertahankan pengantar partisipial bagi kutipan dan secara gramatikal merujuk kepada Nabi Yeremia.
- source_word: ἔλαβον
  choice: mereka mengambil
  rationale: Bentuk ini sesuai dengan konteks kutipan dan arti konkret λαμβάνω di sini.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: tiga puluh keping perak
  rationale: Ungkapan yang jelas untuk uang atau keping berbahan perak tanpa menentukan jenis mata uang yang tidak disebutkan.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: harga orang yang telah dinilai
  rationale: Menjaga nuansa harga komersial pada τιμή sekaligus mencerminkan bentuk pasif sempurna τετιμημένου dengan bahasa Indonesia yang wajar.
- source_word: ὃν ἐτιμήσαντο
  choice: yang mereka nilai
  rationale: Mempertahankan pengulangan akar τιμάω yang juga terdapat pada τετιμημένου dan tidak memperjelas pelaku secara berlebihan.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: dari antara anak-anak Israel
  rationale: Mempertahankan kemungkinan nuansa partitif ἀπό dan istilah kekerabatan υἱῶν, walaupun susunan Yunani ini sulit.
theological_decisions:
- issue: Matius mengaitkan perkataan nubuat ini dengan Yeremia, sedangkan susunannya paling dekat dengan Zakharia 11:12–13
  choice: Nama Yeremia dipertahankan secara eksplisit dalam teks utama.
  alternative: Mengganti Yeremia dengan Zakharia atau menyamarkan nama nabi.
  rationale: Teks SBLGNT secara eksplisit menyebut Yeremia; terjemahan tidak boleh menyelaraskan atau menyelesaikan persoalan pengaitan nubuat tersebut secara diam-diam.
- issue: Hubungan ἀπὸ υἱῶν Ἰσραήλ dengan orang yang dinilai atau pihak yang menilai
  choice: yang mereka nilai dari antara anak-anak Israel
  alternative: yang dinilai oleh anak-anak Israel
  rationale: Susunan utama mempertahankan pembacaan partitif yang mungkin tanpa menghapus kesulitan gramatikal; alternatif pelaku dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “genaplah” mempertahankan corak rumusan penggenapan Matius; “keping perak” tetap mudah dipahami; dan kesulitan pada bagian akhir tidak dihaluskan dengan penafsiran yang terlalu pasti.
