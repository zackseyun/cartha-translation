  text: For he knew that they had handed him over because of envy[a].
translation:
  language: id
  text: Sebab ia tahu bahwa mereka telah menyerahkan Yesus karena iri hati[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena kecemburuan” atau “dengan motif iri hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ia tahu
  rationale: Bentuk οἶδα menyatakan pengetahuan atau kesadaran. Pilihan ini langsung dan alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan logis tersebut.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi dari apa yang diketahui Pilatus, bukan alasan tingkat kedua.
- source_word: διὰ φθόνον
  choice: karena iri hati
  rationale: διά dengan bentuk akusatif menyatakan sebab, sedangkan φθόνος menunjuk pada rasa iri atau ketidaksenangan terhadap kedudukan atau keberhasilan orang lain.
- source_word: παρέδωκαν
  choice: telah menyerahkan
  rationale: Dalam konteks pengadilan Yesus, παραδίδωμι berarti menyerahkan seseorang kepada pihak berwenang. “Telah” secara alami menunjukkan bahwa tindakan itu sudah terjadi.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina ini mengacu kepada Yesus. Nama “Yesus” dipakai agar rujukannya jelas dalam ayat yang berdiri sendiri.
theological_decisions:
- issue: Motif para penuduh Yesus
  choice: Pilatus mengetahui bahwa mereka menyerahkan Yesus karena iri hati.
  alternative: Pilatus mengetahui bahwa mereka menyerahkan Yesus karena kecemburuan.
  rationale: φθόνος menyatakan iri hati sebagai motif tindakan mereka. Terjemahan ini mempertahankan penilaian moral dan psikologis teks tanpa menambahkan penjelasan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan fungsi penjelas γάρ, sedangkan nama “Yesus” memperjelas rujukan pronomina bagi pembaca ayat tunggal.
