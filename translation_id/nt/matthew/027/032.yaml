  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: id
  text: Ketika mereka keluar, mereka menjumpai seorang dari Kirene yang bernama Simon. Mereka memaksa orang itu untuk memikul salib-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, salib Yesus.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Ketika mereka sedang keluar
  rationale: Partisipel kini memiliki fungsi temporal dan berlangsung bersamaan dengan tindakan utama. δέ merupakan penghubung naratif ringan yang tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: εὗρον
  choice: mereka menjumpai
  rationale: Menunjukkan bahwa mereka bertemu atau mendapati Simon dalam perjalanan; 'menjumpai' alami dalam konteks naratif ini.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: seorang dari Kirene
  rationale: Κυρηναῖον menyatakan asal geografis. Dalam bahasa Indonesia, 'seorang dari Kirene' lebih alami daripada bentuk adjektival yang kaku.
- source_word: ὀνόματι Σίμωνα
  choice: yang bernama Simon
  rationale: Padanan alami bagi ungkapan datif yang menyebutkan nama orang.
- source_word: τοῦτον
  choice: Orang itu
  rationale: Mempertahankan daya tunjuk demonstratif Yunani sekaligus memperjelas bahwa yang dimaksud ialah Simon.
- source_word: ἠγγάρευσαν
  choice: mereka paksa
  rationale: Kata ini menunjuk pada pengerahan wajib yang dipaksakan oleh pihak berwenang; 'paksa' menyampaikan unsur koersifnya dengan jelas dan ringkas.
- source_word: ἵνα ἄρῃ
  choice: untuk memikul
  rationale: ἵνα dengan subjungtif menyatakan tujuan. Dalam konteks salib, 'memikul' merupakan padanan Indonesia yang alami bagi tindakan membawa beban tersebut.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: salib-Nya
  rationale: σταυρός diterjemahkan secara lazim sebagai 'salib'. Pronomina αὐτοῦ dipertahankan sebagai pronomina dan, menurut konteks, merujuk kepada Yesus; huruf kapital mengikuti kebiasaan ejaan religius Indonesia untuk pronomina yang merujuk kepada Tuhan/Yesus.
theological_decisions:
- issue: Acuan αὐτοῦ ('-nya')
  choice: Merujuk kepada Yesus dan diterjemahkan 'salib-Nya'.
  alternative: Diperjelas menjadi 'salib Yesus' atau ditulis 'salibnya', yang secara terisolasi dapat disalahpahami sebagai salib Simon.
  rationale: Konteks prosesi penyaliban menunjukkan bahwa Simon dipaksa memikul salib Yesus. Teks utama tetap memakai pronomina sebagaimana bahasa Yunani, sedangkan catatan kaki menjelaskan acuannya tanpa mengganti bentuk sumber dengan nama diri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'Orang itu mereka paksa' mempertahankan penekanan pada τοῦτον tanpa terasa terlalu harfiah. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
