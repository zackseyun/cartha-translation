  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: id
  text: Karena itu, ladang tersebut dinamakan Ladang Darah sampai hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai hubungan kesimpulan atau akibat dengan penjelasan sebelumnya mengenai pembelian dan penamaan ladang itu; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: ἐκλήθη
  choice: dinamakan
  rationale: Bentuk aoristus pasif dari καλέω menyatakan bahwa ladang itu diberi nama. Bahasa Indonesia tidak perlu menandai aspek kala seperti bentuk sempurna bahasa Inggris; keberlanjutan pemakaian nama sudah dinyatakan oleh frasa 'sampai hari ini'.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ladang tersebut
  rationale: ἀγρός berarti 'ladang', sedangkan ἐκεῖνος menunjuk kembali kepada ladang yang telah disebut. 'Tersebut' terdengar wajar dan tetap mempertahankan rujukan khusus itu.
- source_word: Ἀγρὸς Αἵματος
  choice: Ladang Darah
  rationale: Nama tempat ini terdiri atas ἀγρός dan bentuk genitif αἵματος. 'Ladang Darah' merupakan bentuk nama yang ringkas, transparan, dan mempertahankan pengulangan kata 'ladang' dari klausa sebelumnya.
- source_word: αἵματος
  choice: Darah
  rationale: Genitif tunggal dari αἷμα dan merupakan bagian dari nama tempat; huruf kapital dipakai karena termasuk dalam nama 'Ladang Darah'.
- source_word: ἕως τῆς σήμερον
  choice: sampai hari ini
  rationale: Ungkapan temporal ini menyatakan bahwa nama tersebut masih digunakan hingga masa penulis; padanannya alami dan mudah dipahami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. Pengulangan 'ladang' dipertahankan untuk mencerminkan kaitan verbal antara objek dan nama tempat dalam teks Yunani.
