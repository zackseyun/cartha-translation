  text: καὶ λαβὼν τὸ σῶμα ὁ Ἰωσὴφ ἐνετύλιξεν ⸀αὐτὸ σινδόνι καθαρᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: id
  text: Yusuf mengambil tubuh itu dan membungkusnya dengan kain linen yang bersih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kain kafan linen yang bersih.” Istilah Yunani ini dapat menunjuk pada kain linen yang digunakan untuk membungkus jenazah.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: mengambil
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Dalam narasi Indonesia, rangkaian dengan “mengambil ... dan membungkusnya” menyampaikan urutan itu secara alami.
- source_word: σῶμα
  choice: tubuh itu
  rationale: σῶμα berarti “tubuh”. Kata tunjuk “itu” secara alami mewakili artikel Yunani dan menunjuk kembali kepada tubuh Yesus tanpa menambahkan bentuk posesif yang tidak dinyatakan.
- source_word: ἐνετύλιξεν
  choice: membungkusnya
  rationale: ἐντυλίσσω berarti membungkus atau menyelubungi. “Membungkusnya” merupakan padanan Indonesia yang wajar dalam konteks pemakaman; akhiran -nya merujuk kepada tubuh itu tanpa memaksakan pembedaan antara “itu” dan “dia” yang terdapat dalam bahasa Inggris.
- source_word: σινδόνι
  choice: dengan kain linen
  rationale: σινδών menunjuk pada sehelai kain linen dan dalam konteks ini dapat berfungsi sebagai kain kafan. “Kain linen” mempertahankan arti dasarnya tanpa menjadikan fungsi pemakamannya sebagai satu-satunya arti.
- source_word: καθαρᾷ
  choice: yang bersih
  rationale: καθαρός di sini menerangkan kain linen. “Bersih” adalah pilihan yang alami dan sesuai konteks, sedangkan “murni” dapat menyiratkan gagasan tambahan.
- source_word: καὶ
  choice: dan
  rationale: καί dipertahankan sebagai penghubung naratif sederhana. Dalam susunan Indonesia, penghubung ini ditempatkan di antara kedua tindakan Yusuf agar kalimat tetap alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Tubuh” mempertahankan kedekatan dengan σῶμα, sementara “membungkusnya” secara alami mempertahankan rujukan kepada tubuh Yesus tanpa menimbulkan persoalan gender gramatikal.
