  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: id
  text: Kemudian, ketika Yudas, yang telah mengkhianati[a] Yesus, melihat bahwa Yesus telah dijatuhi hukuman, ia menyesal dan mengembalikan tiga puluh keping uang perak itu kepada para imam kepala dan tua-tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: menyerahkan Yesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda urutan waktu yang alami dalam narasi Indonesia dan sesuai dengan fungsi temporal Τότε.
- source_word: ἰδὼν
  choice: melihat
  rationale: Partisip aoris ini dipadankan dengan verba finit agar susunan kalimat jelas dan alami dalam bahasa Indonesia.
- source_word: Ἰούδας
  choice: Yudas
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: yang telah mengkhianati Yesus
  rationale: Klausa relatif menyatakan peran Yudas dalam konteks ini. Aspek lampau dinyatakan dengan 'telah'; nama 'Yesus' dipakai untuk memperjelas rujukan pronomina tanpa mengubah referennya.
- source_word: ὅτι κατεκρίθη
  choice: bahwa Yesus telah dijatuhi hukuman
  rationale: Bentuk pasif dipertahankan. 'Dijatuhi hukuman' menyampaikan keputusan penghukuman tanpa menentukan bentuk hukuman pada tahap ini.
- source_word: μεταμεληθεὶς
  choice: Ia pun menyesal
  rationale: Menunjukkan penyesalan atau rasa sesal, tetapi tidak memakai 'bertobat', yang dapat memberi klaim teologis lebih kuat daripada verba Yunani ini.
- source_word: ἔστρεψεν
  choice: mengembalikan
  rationale: Dalam konteks uang dan penerimanya, maknanya ialah mengembalikan sesuatu kepada pihak semula.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: tiga puluh keping uang perak itu
  rationale: ἀργύρια menunjuk pada uang dari perak; 'keping uang perak' jelas bagi pembaca modern dan tidak menetapkan denominasi yang tidak disebutkan.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: kepada para imam kepala dan tua-tua
  rationale: Istilah baku untuk dua kelompok pemimpin Yahudi yang dimaksud dalam konteks Matius.
theological_decisions:
- issue: Arti μεταμεληθεὶς dalam tanggapan Yudas
  choice: menyesal
  alternative: bertobat; berubah pikiran
  rationale: '''Menyesal'' mempertahankan bobot emosi dan moral verba μεταμέλομαι tanpa memutuskan bahwa Yudas mengalami pertobatan penuh.'
- issue: Nuansa παραδιδοὺς
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Dalam konteks tindakan Yudas, 'mengkhianati' menyampaikan makna kontekstual dengan wajar; alternatif yang lebih harfiah dicatat karena παραδίδωμι secara leksikal dapat berarti 'menyerahkan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar hubungan tindakan Yudas mudah dipahami. Pengulangan nama 'Yesus' menghindari ketidakjelasan rujukan kata ganti.
