revisions:
- from: Maka pergilah mereka dan mengamankan makam itu dengan memeteraikan batu penutupnya bersama para penjaga.[a]
  to: Maka mereka pergi dan mengamankan makam itu dengan memeteraikan batu itu bersama regu penjaga.[a]
  rationale: Revisi menghilangkan tambahan ‘penutup’ pada ‘batu’, memakai urutan kata yang lebih alami dalam bahasa Indonesia modern, dan menerjemahkan κουστωδία sebagai ‘regu penjaga’ untuk mempertahankan gagasan sebuah detail penjagaan. Catatan kaki diperjelas agar alternatif prosedural tetap tersedia tanpa mengunci makna μετὰ pada ‘di hadapan’ atau pada tindakan kedua yang pasti.
