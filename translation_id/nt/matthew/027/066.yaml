review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya menyampaikan struktur Yunani dengan baik: πορευθέντες sebagai tindakan pengiring, ἠσφαλίσαντο sebagai ‘mengamankan’, dan σφραγίσαντες sebagai sarana. Namun, ‘batu penutupnya’ menambahkan fungsi ‘penutup’ yang tidak dinyatakan oleh τὸν λίθον; konteks memang mengarah ke batu penutup makam, tetapi teks hanya menyebut ‘batu itu’. Frasa ‘bersama para penjaga’ cukup baik untuk μετὰ τῆς κουστωδίας dan tidak menentukan apakah penjaga itu baru ditempatkan atau sekadar hadir/terlibat.'
  naturalness: ‘Maka pergilah mereka’ dapat dipahami, tetapi inversi tersebut terdengar lebih arkais daripada bahasa Indonesia baku modern. ‘Maka mereka pergi’ tetap bernada naratif dan lebih alami. ‘Regu penjaga’ secara idiomatis menangkap κουστωδία sebagai satuan penjagaan tanpa menyatakan identitas mereka.
  terminology: ‘Makam’, ‘mengamankan’, dan ‘memeteraikan’ tepat dan sesuai register. ‘Regu penjaga’ lebih presisi daripada ‘para penjaga’ untuk κουστωδία, sebuah istilah bagi satuan/detail penjaga. Tidak ada dasar tekstual untuk mengidentifikasi mereka sebagai pasukan Romawi atau petugas Bait Allah.
  issues:
  - severity: low
    issue: ‘Batu penutupnya’ menambahkan keterangan fungsi yang tidak eksplisit dalam τὸν λίθον.
    rationale: Walaupun batu itu secara kontekstual adalah batu pada makam, terjemahan optimal-ekuivalen sebaiknya mempertahankan ungkapan sumber yang lebih sederhana, ‘batu itu’.
  - severity: low
    issue: Inversi ‘Maka pergilah mereka’ kurang alami dalam bahasa Indonesia modern.
    rationale: ‘Maka mereka pergi’ mempertahankan kelanjutan naratif δέ dan tindakan pengiring πορευθέντες dengan gaya yang lebih lazim.
  - severity: low
    issue: Catatan kaki ‘di hadapan para penjaga’ terlalu menyempitkan relasi μετὰ.
    rationale: μετά dengan genitif terutama menyatakan kebersamaan/penyertaan; ‘di hadapan’ hanya salah satu pengembangan yang mungkin dan kurang langsung. Catatan kaki sebaiknya menyatakan alternatif tanpa memberi kesan bahwa relasi itu pasti hanya kehadiran pasif.
  revised_text: Maka mereka pergi dan mengamankan makam itu dengan memeteraikan batu itu bersama regu penjaga.[a]
