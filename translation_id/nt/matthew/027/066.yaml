  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: id
  text: Maka mereka pergi dan mengamankan makam itu dengan memeteraikan batu itu bersama regu penjaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan memeteraikan batu itu bersama regu penjaga”; mungkin juga “dengan memeteraikan batu itu dan menempatkan regu penjaga.” Ungkapan Yunani ini ringkas dan dapat menyatakan kebersamaan atau keterlibatan regu penjaga, bukan dua tindakan yang terpisah.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Maka pergilah mereka
  rationale: Partisip aoris πορευθέντες menyertai verba utama dan wajar diungkapkan sebagai verba finit dalam bahasa Indonesia. δέ melanjutkan alur cerita; “Maka” menyatakan kelanjutan tanpa memberi tekanan pertentangan.
- source_word: ἠσφαλίσαντο
  choice: mengamankan
  rationale: ἀσφαλίζω berarti membuat aman atau menjamin keamanan. “Mengamankan” alami dalam bahasa Indonesia dan cocok dengan tindakan mencegah makam diganggu.
- source_word: τὸν τάφον
  choice: makam itu
  rationale: τάφος menunjuk pada tempat Yesus dimakamkan. “Makam” jelas dan lazim; “itu” sesuai dengan artikel Yunani yang merujuk pada makam yang sudah disebutkan.
- source_word: σφραγίσαντες
  choice: dengan memeteraikan
  rationale: Partisip aoris ini paling wajar dipahami sebagai cara mereka mengamankan makam. “Dengan memeteraikan” mempertahankan hubungan instrumental tanpa menambah prosedur yang tidak dinyatakan.
- source_word: τὸν λίθον
  choice: batu penutupnya
  rationale: λίθος adalah batu pada jalan masuk makam. “Batu penutupnya” memperjelas fungsi yang sudah diberikan konteks, tanpa menentukan bentuk atau mekanismenya.
- source_word: μετὰ τῆς κουστωδίας
  choice: bersama para penjaga
  rationale: κουστωδία, kata serapan Latin, menunjuk pada regu penjaga. μετά dengan genitif paling langsung menyatakan kebersamaan. Frasa ini mempertahankan keterlibatan atau kehadiran para penjaga tanpa memastikan bahwa menempatkan penjaga merupakan tindakan kedua yang tersendiri.
theological_decisions:
- issue: Hubungan μετὰ τῆς κουστωδίας dengan tindakan mengamankan makam
  choice: Pemeteraian batu dilakukan bersama para penjaga atau dengan keterlibatan mereka.
  alternative: Mereka memeteraikan batu lalu menempatkan para penjaga sebagai tindakan tersendiri.
  rationale: Ungkapan Yunani ringkas dan memakai μετά dengan genitif, yang secara langsung menunjukkan kebersamaan. Terjemahan tidak menambahkan urutan prosedural yang tidak dinyatakan secara eksplisit dan tetap mempertahankan kemungkinan keterlibatan atau kehadiran regu penjaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk inversi “Maka pergilah mereka” mempertahankan gerak naratif dengan nada Kitab Suci yang tetap mudah dipahami. “Memeteraikan” dipilih karena tepat untuk tindakan memasang meterai resmi; “para penjaga” menyampaikan regu jaga tanpa menentukan apakah mereka tentara Romawi atau petugas Bait Allah.
