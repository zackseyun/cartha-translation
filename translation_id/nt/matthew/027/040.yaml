  source_fidelity: 'Teks menerjemahkan unsur-unsur Yunani dengan setia: partisipel pembuka λέγοντες sebagai kelanjutan narasi, sapaan partisipial Ὁ καταλύων, urutan merobohkan dan membangun, keterangan waktu ἐν τρισὶν ἡμέραις, dua imperatif, serta syarat ejekan εἰ υἱὸς εἶ τοῦ θεοῦ. “Bait Allah,” “Anak Allah,” dan “salib” tepat dalam konteks ini.'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada wajar untuk ujaran ejekan. “Kamu yang merobohkan ... selamatkanlah dirimu!” mempertahankan gaya seruan langsung tanpa menjadi terlalu percakapan atau terlalu formal.
  terminology: “Bait Allah” merupakan padanan mapan bagi ναός dalam konteks Yerusalem; “Anak Allah” mempertahankan gelar yang dipakai teks tanpa penambahan tafsir; “salib” adalah padanan baku untuk σταυρός. Catatan kaki pada “membangunnya” secara tepat membedakan makna leksikal “membangun” dari kemungkinan kontekstual “membangun kembali.”
