id: MAT.27.40
reference: Matthew 27:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: id
  text: dan berkata, “Kamu yang merobohkan Bait Allah dan membangunnya[a] dalam tiga hari, selamatkanlah dirimu! Jika kamu Anak Allah, turunlah dari salib!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membangunnya kembali.” Kata Yunani yang dipakai berarti “membangun,” tetapi konteks ejekan ini dapat menyiratkan pembangunan kembali.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel kini ini melanjutkan tindakan pada konteks narasi sebelumnya. Bentuk “dan berkata” alami dalam bahasa Indonesia tanpa menambahkan subjek yang tidak disebutkan dalam frasa ini.
- source_word: Ὁ καταλύων
  choice: Kamu yang merobohkan
  rationale: Artikel dan partisipel berfungsi sebagai sapaan kepada Yesus. “Kamu yang merobohkan” mempertahankan bentuk ejekan dan tidak menambahkan gagasan tentang niat atau kemampuan yang tidak dinyatakan langsung di sini.
- source_word: καταλύω
  choice: merobohkan
  rationale: Dalam konteks bangunan Bait Allah, “merobohkan” secara alami menyampaikan tindakan membongkar atau menghancurkan bangunan.
- source_word: ναός
  choice: Bait Allah
  rationale: Ναός dapat menunjuk secara khusus pada tempat kudus, tetapi dalam ejekan ini yang dimaksud dipahami sebagai Bait Allah. Pilihan ini alami dan mapan bagi pembaca Indonesia.
- source_word: ἐν τρισὶν ἡμέραις
  choice: dalam tiga hari
  rationale: Padanan temporal yang langsung dan alami, sekaligus mempertahankan rumusan ejekan tersebut.
- source_word: οἰκοδομῶν
  choice: membangunnya
  rationale: Kata kerja Yunani secara harfiah berarti “membangun”; pronomina “-nya” merujuk secara alami kepada Bait Allah. Makna “membangunnya kembali” mungkin tersirat oleh konteks, tetapi tidak dijadikan eksplisit dalam teks utama.
- source_word: σῶσον σεαυτόν
  choice: selamatkanlah dirimu
  rationale: Imperatif aoris dengan pronomina refleksif diterjemahkan langsung sebagai tantangan bernada mengejek.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Jika kamu Anak Allah
  rationale: Mempertahankan syarat dalam ejekan dan gelar kristologisnya secara lugas. Bahasa Indonesia tidak memerlukan kata sandang yang sepadan dengan “the” dalam frasa ini.
- source_word: κατάβηθι
  choice: turunlah
  rationale: Imperatif gerak ke bawah ini paling alami diterjemahkan “turunlah” ketika ditujukan kepada seseorang yang berada di atas salib.
- source_word: σταυρός
  choice: salib
  rationale: “Salib” merupakan padanan baku dan sesuai dengan konteks kisah sengsara.
theological_decisions:
- issue: Penerjemahan gelar υἱὸς τοῦ θεοῦ dalam konteks ejekan
  choice: Anak Allah
  alternative: anak Allah / Putra Allah
  rationale: “Anak Allah” mempertahankan gelar kristologis secara transparan tanpa melemahkan atau memperluas maknanya. Huruf kapital menandai penggunaannya sebagai gelar khusus bagi Yesus, meskipun diucapkan oleh para pengejek.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “kamu” dipakai karena ujaran ini merupakan ejekan langsung; bentuk tersebut juga menghindari kehormatan yang tidak sesuai dengan nada para pengejek. Kapitalisasi “Bait Allah” dan “Anak Allah” mengikuti pemakaian baku untuk nama tempat ibadah dan gelar khusus.
