    rationale: Tambahan ini masuk akal secara naratif, tetapi tidak diperlukan. “Ia pergi” lebih dekat dengan ἀνεχώρησεν.
  revised_text: Setelah melemparkan uang perak itu ke dalam Bait Allah[a], ia pergi, lalu pergi dan menggantung diri.
