  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: id
  text: Setelah melemparkan uang perak itu ke dalam Bait Allah[a], ia pergi, lalu pergi dan menggantung diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam ruang kudus Bait Allah.” Kata Yunani naos sering menunjuk secara khusus pada bangunan atau ruang kudus Bait Allah, bukan seluruh kompleksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: setelah melemparkan
  rationale: Partisip aoristus menyatakan tindakan yang mendahului kata kerja utama; bentuk ini menyampaikan urutan tindakan secara wajar dalam bahasa Indonesia.
- source_word: τὰ ἀργύρια
  choice: uang perak itu
  rationale: Secara leksikal berarti 'perak itu', tetapi dalam konteks menunjuk pada uang pembayaran yang telah disebutkan. 'Uang perak itu' jelas dan alami tanpa harus menambahkan 'keping'.
- source_word: εἰς τὸν ναὸν
  choice: ke dalam Bait Allah
  rationale: ναός di sini menunjuk pada bangunan suci atau ruang kudus Bait Allah, bukan sekadar seluruh kompleksnya. 'Bait Allah' alami dalam teks utama, sedangkan nuansa yang lebih khusus dijelaskan dalam catatan kaki.
- source_word: ἀνεχώρησεν
  choice: ia pergi dari situ
  rationale: Kata ini berarti pergi atau menarik diri. 'Pergi dari situ' mempertahankan gerakan meninggalkan tempat tersebut dalam bahasa Indonesia yang alami.
- source_word: ἀπελθὼν
  choice: lalu
  rationale: Partisip gerak ini menandai bahwa ia pergi sebelum melakukan tindakan berikutnya. Karena ἀνεχώρησεν sudah menyatakan kepergian, 'lalu' menjaga urutan tanpa menghasilkan pengulangan yang kaku.
- source_word: ἀπήγξατο
  choice: menggantung diri
  rationale: Bentuk medium menunjukkan tindakan yang dilakukan terhadap diri sendiri; dalam konteks ini makna yang paling wajar ialah bunuh diri dengan cara menggantung diri.
theological_decisions:
- issue: Cakupan makna ναός dibandingkan istilah untuk seluruh kompleks Bait Allah
  choice: Bait Allah dalam teks utama, dengan nuansa 'ruang kudus' dalam catatan kaki
  alternative: ruang kudus Bait Allah
  rationale: Pilihan ini mempertahankan keterbacaan sekaligus memberi tahu pembaca bahwa istilah Yunani kemungkinan menunjuk secara lebih khusus pada bangunan atau ruang kudus Bait Allah.
- issue: Hubungan antara ἀνεχώρησεν dan ἀπελθὼν
  choice: ia pergi dari situ, lalu menggantung diri
  alternative: ia meninggalkan tempat itu, lalu pergi dan menggantung diri
  rationale: Bahasa Yunani memakai dua bentuk yang berkaitan dengan kepergian. Terjemahan utama menjaga urutan geraknya, tetapi menghindari pengulangan yang tidak alami dalam bahasa Indonesia.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan urutan tiga tindakan: melemparkan uang, meninggalkan tempat itu, dan menggantung diri.'
