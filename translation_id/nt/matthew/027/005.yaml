  source_fidelity: Secara umum setia pada teks Yunani. Namun ἀνεχώρησεν berarti “ia pergi/meninggalkan tempat itu”; unsur “dari situ” tidak dinyatakan secara eksplisit. Lebih penting, partisip ἀπελθών tetap menyatakan gerak kedua sebelum ἀπήγξατο dan sebaiknya tidak diredusir hanya menjadi “lalu”.
  naturalness: Teksnya baku dan mudah dipahami, tetapi “ia pergi dari situ, lalu menggantung diri” menghapus gerak kedua yang ada dalam bahasa sumber. “Ia pergi, lalu pergi dan menggantung diri” terlalu berulang; “ia pergi, kemudian pergi untuk menggantung diri” terdengar tidak alami dan dapat memberi kesan tujuan yang lebih eksplisit. Bentuk “ia pergi, lalu menggantung dirinya” tetap canggung. Terjemahan yang paling wajar sambil mempertahankan kedua verba adalah “ia pergi, lalu pergi dan menggantung diri,” dengan pengulangan yang memang mencerminkan narasi sumber.
  terminology: “Uang perak itu” tepat dan alami untuk τὰ ἀργύρια. “Bait Allah” adalah istilah baku dan sesuai untuk ναός, sementara catatan kaki dengan tepat menerangkan kemungkinan rujukan khusus kepada ruang/bangunan suci. “Menggantung diri” tepat untuk ἀπήγξατο.
  issues:
