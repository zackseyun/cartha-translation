revisions:
- from: Setelah melemparkan uang perak itu ke dalam Bait Allah[a], ia pergi dari situ, lalu menggantung diri.
  to: Setelah melemparkan uang perak itu ke dalam Bait Allah[a], ia pergi, lalu pergi dan menggantung diri.
  rationale: Revisi menghapus tambahan “dari situ” dan memulihkan unsur gerak dalam ἀπελθών. Walaupun pengulangan “pergi, lalu pergi” kurang mulus dalam bahasa Indonesia, ini merupakan cara yang paling langsung untuk mempertahankan dua ungkapan gerak yang dipakai teks Yunani tanpa menambahkan penjelasan mengenai maksud atau tujuan Yudas.
