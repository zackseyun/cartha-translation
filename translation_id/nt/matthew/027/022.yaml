  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: id
  text: Pilatus berkata kepada mereka, “Kalau begitu, apa yang harus kulakukan dengan Yesus yang disebut Mesias[a]?” Mereka semua menjawab, “Biarlah dia disalibkan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Mencatat padanan tradisional bagi gelar Yunani χριστός tanpa menghapus nuansa mesianik pada teks utama.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Kalau begitu, apa yang harus kulakukan
  rationale: Pertanyaan deliberatif dengan aoristus subjungtif ποιήσω secara alami dinyatakan dengan “harus kulakukan”; “kalau begitu” menyampaikan fungsi inferensial οὖν dalam bahasa Indonesia modern.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Nama diri ditransliterasikan menurut bentuk baku bahasa Indonesia.
- source_word: τὸν λεγόμενον χριστόν
  choice: yang disebut Mesias
  rationale: Partisipel pasif atributif λεγόμενον diterjemahkan “yang disebut,” sedangkan χριστός dipahami sebagai gelar dan diterjemahkan “Mesias” untuk mempertahankan makna mesianik Yahudinya.
- source_word: λέγουσιν πάντες
  choice: Mereka semua menjawab
  rationale: Kala kini historis λέγουσιν dialihkan ke bentuk naratif bahasa Indonesia; “menjawab” wajar dalam konteks tanya-jawab, dan “semua” mempertahankan daya kolektif πάντες.
- source_word: Σταυρωθήτω
  choice: Biarlah dia disalibkan
  rationale: Ungkapan ini mempertahankan bentuk imperatif orang ketiga sekaligus diatesis pasif dari aoristus pasif imperatif Σταυρωθήτω.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini χριστός berfungsi sebagai gelar, bukan sekadar unsur nama. “Mesias” menyampaikan arti gelar tersebut, sementara bentuk tradisional “Kristus” dicantumkan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk klitik “kulakukan” alami dalam ujaran langsung. Kata ganti “dia” tidak diberi kapital agar tidak menambahkan penandaan teologis yang tidak terdapat dalam teks Yunani.
