  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: id
  text: Tetapi Yesus kembali berseru dengan suara nyaring dan menyerahkan roh-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengembuskan napas terakhir.” Bahasa Yunani secara harfiah mengatakan “melepaskan roh,” suatu ungkapan untuk mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: δέ melanjutkan narasi dengan nuansa kontras ringan. “Namun” wajar dalam bahasa Indonesia dan menandai peralihan kepada tindakan terakhir Yesus.
- source_word: πάλιν
  choice: kembali
  rationale: πάλιν menyatakan pengulangan; “kembali” alami dalam konstruksi “kembali berseru” dan setara dengan “sekali lagi”.
- source_word: κράξας
  choice: berseru
  rationale: Partisip aoris κράζω menunjuk pada seruan yang kuat. “Berseru” mempertahankan daya vokalnya tanpa terdengar terlalu sehari-hari.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Frasa datif ini menyatakan cara. “Dengan suara nyaring” adalah ungkapan Indonesia yang alami dan mempertahankan penekanan pada kerasnya suara.
- source_word: ἀφῆκεν
  choice: menyerahkan
  rationale: Dalam idiom ἀφῆκεν τὸ πνεῦμα, ἀφίημι berarti melepaskan atau membiarkan pergi. “Menyerahkan” menghasilkan ungkapan kematian yang bermartabat dan cukup dekat dengan gambaran sumber.
- source_word: τὸ πνεῦμα
  choice: nyawa-Nya
  rationale: Dalam konteks idiom kematian, “nyawa” lebih alami daripada “roh” dalam bahasa Indonesia, sambil tetap menunjukkan bahwa Yesus wafat. Huruf kapital pada enklitik -Nya mengikuti konvensi Indonesia untuk rujukan kepada Yesus.
theological_decisions:
- issue: Pemaknaan idiom kematian ἀφῆκεν τὸ πνεῦμα
  choice: menyerahkan nyawa-Nya
  alternative: mengembuskan napas terakhir; menyerahkan roh-Nya
  rationale: “Menyerahkan nyawa-Nya” merupakan idiom Indonesia yang alami dan tetap mencerminkan unsur pelepasan dalam ἀφίημι. “Mengembuskan napas terakhir” menjelaskan kematian secara lebih langsung tetapi menggeser πνεῦμα kepada ‘napas’, sedangkan “menyerahkan roh-Nya” lebih formal dan leksikal tetapi kurang alami serta dapat terdengar sebagai pernyataan antropologis yang lebih khusus daripada yang perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan partisip Yunani dialihkan menjadi dua tindakan berurutan yang dihubungkan dengan “lalu” agar alami dan jelas. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan yang dijelaskan.
