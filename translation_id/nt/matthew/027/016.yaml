  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: id
  text: Pada waktu itu mereka menahan seorang tahanan terkenal bernama Yesus Barabas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah hanya berbunyi “Barabas”, tanpa “Yesus”.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: mereka menahan
  rationale: Bentuk imperfek ἔχω dengan subjek jamak yang tidak disebutkan menunjukkan bahwa pihak berwenang sedang menahan orang itu dalam tahanan. Pilihan ini lebih alami dalam bahasa Indonesia daripada ‘mereka mempunyai’ untuk konteks hukum.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung naratif ringan. Dalam bahasa Indonesia, alur wacana tetap alami tanpa menambahkan ‘adapun’ atau ‘tetapi’, yang dapat memberi penekanan berlebihan.
- source_word: τότε
  choice: pada waktu itu
  rationale: Ungkapan ini mempertahankan acuan waktu yang dinyatakan secara eksplisit.
- source_word: δέσμιον
  choice: seorang tahanan
  rationale: δέσμιος menunjuk kepada orang yang ditahan; ‘tahanan’ merupakan padanan baku dan jelas dalam konteks hukum.
- source_word: ἐπίσημον
  choice: terkenal
  rationale: Kata ini berarti dikenal luas atau menonjol. Konteks seorang tahanan dapat menyiratkan reputasi buruk, tetapi teks tidak menyatakannya secara eksplisit; ‘terkenal’ mempertahankan ruang makna itu tanpa menambahkan penilaian.
- source_word: λεγόμενον
  choice: bernama
  rationale: Partisip ini memperkenalkan nama orang. ‘Bernama’ merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Yesus Barabas
  rationale: Teks SBLGNT mencantumkan nama Ἰησοῦν sebelum Βαραββᾶν, sehingga keduanya dipertahankan dalam teks utama. Ejaan ‘Barabas’ mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk tekstual nama lengkap Barabas
  choice: 'Mencantumkan ‘Yesus’ dalam teks utama: ‘Yesus Barabas’.'
  alternative: Hanya ‘Barabas’, tanpa ‘Yesus’.
  rationale: Teks sumber SBLGNT berbunyi Ἰησοῦν Βαραββᾶν. Karena sejumlah naskah tidak memuat Ἰησοῦν, bentuk yang lebih pendek dicatat dalam catatan kaki tanpa menggantikan bacaan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan waktu, keadaan tahanan, reputasinya, dan bentuk nama dalam teks sumber.
