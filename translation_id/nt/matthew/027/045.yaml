base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: id
  text: Sejak jam keenam, kegelapan meliputi seluruh negeri itu hingga jam kesembilan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jam keenam kira-kira pukul dua belas siang, dan jam kesembilan kira-kira pukul tiga sore.
    reason: cultural_note
  - marker: b
    text: Atau, “seluruh bumi.” Kata Yunani yang digunakan dapat berarti “negeri” atau “bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Mulai
  rationale: ἀπό menandai titik awal waktu. Partikel δέ merupakan penghubung ringan yang tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia karena alur konteks sudah memadai.
- source_word: ἕκτης ὥρας
  choice: jam keenam
  rationale: Mempertahankan cara penghitungan waktu dalam teks sumber; padanan waktu modern dijelaskan dalam catatan kaki.
- source_word: σκότος
  choice: kegelapan
  rationale: Menyampaikan makna dasar berupa keadaan gelap dan mempertahankan ketegasan gambaran dalam narasi.
- source_word: ἐγένετο
  choice: meliputi
  rationale: Dalam konstruksi ini, ἐγένετο menyatakan timbulnya kegelapan. Ungkapan 'kegelapan meliputi' alami dalam bahasa Indonesia dan menyampaikan keadaan yang datang atas suatu wilayah.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: seluruh negeri itu
  rationale: γῆ dapat berarti 'negeri/tanah' maupun 'bumi'. 'Negeri itu' merupakan pilihan yang lebih terbatas secara kontekstual, sementara kemungkinan cakupan 'bumi' tetap dipertahankan dalam catatan kaki.
- source_word: ἕως ὥρας ἐνάτης
  choice: sampai jam kesembilan
  rationale: Mempertahankan ungkapan waktu sumber; perkiraan dalam sistem waktu modern diberikan dalam catatan kaki.
theological_decisions:
- issue: Cakupan γῆ dalam pernyataan tentang kegelapan
  choice: negeri itu
  alternative: seluruh bumi
  rationale: Kata Yunani γῆ memiliki cakupan makna yang luas. Pilihan 'negeri itu' sesuai dengan latar narasi langsung tanpa menetapkan bahwa peristiwa tersebut pasti berskala global; pembacaan kosmis 'seluruh bumi' dicantumkan sebagai alternatif agar ambiguitas dan ketegangan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ungkapan waktu kuno dipertahankan dalam teks utama, dengan penjelasan yang mudah dipahami dalam catatan kaki. Semua penanda catatan kaki dicantumkan dalam teks.
