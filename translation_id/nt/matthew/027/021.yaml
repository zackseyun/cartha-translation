  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: id
  text: Namun gubernur itu menjawab mereka, “Siapakah dari kedua orang ini yang kalian kehendaki untuk kubebaskan untuk kalian?” Mereka berkata, “Barabas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Namun gubernur itu menjawab mereka
  rationale: Konstruksi partisip ἀποκριθείς diikuti εἶπεν secara idiomatis menyatakan tanggapan. Bahasa Indonesia alami cukup memakai 'menjawab' tanpa menggandakan 'menjawab dan berkata'. δέ ditampilkan sebagai 'Namun' untuk menandai peralihan atau kontras ringan, sedangkan ἡγεμών dalam konteks ini berarti gubernur Romawi.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Siapa di antara kedua orang ini
  rationale: Pertanyaan meminta pemilihan satu dari dua orang yang telah disebut. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan makna partitif ἀπὸ τῶν δύο.
- source_word: θέλετε
  choice: yang kalian ingin
  rationale: θέλω menyatakan keinginan atau pilihan. Bentuk 'kalian' tepat karena verba Yunani ini berpersona kedua jamak dan ditujukan kepada orang banyak.
- source_word: ἀπολύσω ὑμῖν
  choice: kubebaskan bagi kalian
  rationale: Dalam konteks hukum, ἀπολύω berarti membebaskan atau melepaskan tahanan. Bentuk 'kubebaskan' mempertahankan subjek orang pertama, sedangkan 'bagi kalian' mewakili datif ὑμῖν sebagai tindakan yang diberikan sesuai pilihan mereka.
- source_word: οἱ δὲ εἶπαν
  choice: Mereka berkata
  rationale: δέ di sini terutama melanjutkan pertukaran ujaran dan tidak perlu diberi penanda kontras tersendiri dalam bahasa Indonesia.
- source_word: Τὸν Βαραββᾶν
  choice: Barabas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; artikel akusatif Yunani tidak perlu dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. 'Gubernur' tepat secara historis; 'kalian' memperjelas bahwa sapaan ditujukan kepada kelompok. Susunan pertanyaan dibuat alami tanpa menghilangkan pilihan di antara dua orang.
