lexical_decisions:
- source_word: οἱ δὲ
  choice: Orang-orang yang
  rationale: δέ merupakan penghubung ringan yang tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia; artikel dan partisip membentuk frasa substantival yang wajar diterjemahkan sebagai 'orang-orang yang'.
- source_word: παραπορευόμενοι
  choice: lewat
  rationale: Partisip kini menggambarkan orang-orang yang sedang melintas di tempat penyaliban; 'yang lewat' alami dan tetap menyampaikan tindakan yang berlangsung.
- source_word: ἐβλασφήμουν
  choice: menghujat
  rationale: Bentuk imperfek menunjukkan tindakan berulang atau berkelanjutan. 'Menghujat' mempertahankan kuatnya verba Yunani, sementara catatan kaki menjelaskan bahwa dalam konteks ini cakupannya juga dapat berupa mencerca atau menista seseorang.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina objek ini merujuk kepada Yesus; huruf kapital mengikuti kelaziman penerbitan Alkitab bahasa Indonesia tanpa menambah informasi pada teks sumber.
- source_word: κινοῦντες
  choice: sambil menggeleng-gelengkan
  rationale: Partisip ini menyatakan gerakan yang menyertai hujatan. Bentuk ulang 'menggeleng-gelengkan' secara alami menggambarkan gerakan kepala yang terus dilakukan sebagai tanda ejekan.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: kepala mereka
  rationale: Ungkapan ini diterjemahkan secara alami dalam bahasa Indonesia; kata 'mereka' mempertahankan kepemilikan jamak meskipun 'kepala' lazim dibiarkan dalam bentuk tunggal kolektif.
theological_decisions:
- issue: Daya makna βλασφημέω ketika ditujukan kepada Yesus dalam kisah sengsara
  choice: Memakai 'menghujat' dalam teks utama
  alternative: mencerca; menista
  rationale: Verba Yunani lebih kuat daripada sekadar mengejek dan dapat membawa bobot teologis dalam konteks ini, tetapi juga dapat berarti melontarkan kata-kata keji atau fitnah terhadap seseorang. Catatan kaki mempertahankan keluasan makna itu tanpa menetapkan bahwa verba tersebut di sini hanya bermakna penghujatan terhadap Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami dengan 'sambil' untuk menunjukkan tindakan yang bersamaan. Rujukan Mazmur disesuaikan dengan penomoran ayat yang umum dalam Alkitab bahasa Indonesia, yaitu Mazmur 22:8 (setara dengan Psalm 22:7 dalam sebagian tradisi penomoran).
