id: MAT.27.47
reference: Matthew 27:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: id
  text: Namun, beberapa orang yang berdiri di situ, ketika mendengarnya, berkata, “Orang ini memanggil Elia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orang-orang itu tampaknya salah memahami seruan Yesus dalam ayat sebelumnya sebagai panggilan kepada Elia.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Namun, beberapa orang
  rationale: τινὲς menunjuk pada sebagian orang yang tidak ditentukan, sedangkan δέ menandai perkembangan atau kontras ringan dalam narasi.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: yang berdiri di situ
  rationale: Mempertahankan gambaran konkret partisipel perfektum substantival tentang orang-orang yang hadir dan sedang berdiri di tempat itu.
- source_word: ἀκούσαντες
  choice: ketika mendengarnya
  rationale: Partisipel aoris menyatakan tindakan yang mendahului verba utama; akhiran -nya secara wajar merujuk pada seruan Yesus dalam ayat sebelumnya.
- source_word: ἔλεγον
  choice: berkata
  rationale: Dalam narasi Indonesia, 'berkata' menyampaikan ujaran mereka secara alami; aspek imperfektif Yunani dapat menunjukkan ujaran yang sedang berlangsung, tetapi tidak perlu dilebihkan menjadi pengulangan yang eksplisit.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Bentuk baku nama nabi tersebut dalam Alkitab bahasa Indonesia.
- source_word: φωνεῖ
  choice: memanggil
  rationale: Padanan langsung dan alami yang tetap membiarkan konteks menentukan apakah maksudnya memanggil, berseru kepada, atau meminta kedatangan Elia.
- source_word: οὗτος
  choice: Orang ini
  rationale: Mempertahankan daya tunjuk demonstratif οὗτος dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Apakah ucapan orang-orang itu harus diterjemahkan seolah-olah Yesus sungguh memanggil Elia atau hanya dianggap demikian oleh mereka
  choice: 'Disajikan sebagai ucapan langsung mereka: “Orang ini memanggil Elia.”'
  alternative: “Dia sedang berseru kepada Elia” atau “Orang ini meminta Elia datang.”
  rationale: Teks Yunani melaporkan penilaian para pendengar tanpa membenarkannya. Terjemahan utama mempertahankan ironi dan ketegangan naratif, sedangkan catatan menjelaskan kaitannya dengan seruan pada ayat sebelumnya tanpa menjadikannya bagian dari ucapan narator.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan gambaran orang-orang yang berdiri di situ atau daya tunjuk 'orang ini'.
