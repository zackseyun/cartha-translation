  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: id
  text: Setelah meludahi dia, mereka mengambil buluh itu[a] dan terus memukuli kepalanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tongkat buluh itu.” Kata Yunani κάλαμος dapat berarti “buluh” atau, dalam penggunaan yang lebih luas, tongkat yang menyerupai atau terbuat dari buluh.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “memukul kepalanya berulang kali.” Bentuk imperfek Yunani dapat menekankan tindakan yang berulang atau sedang berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: Setelah meludahi dia
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama; bentuk ini menyampaikan urutan tersebut secara alami. Dengan ἐμπτύω, εἰς + akusatif berarti meludahi seseorang.
- source_word: ἔλαβον
  choice: mereka mengambil
  rationale: Padanan langsung dan wajar bagi aoris λαμβάνω dalam konteks ini.
- source_word: τὸν κάλαμον
  choice: buluh itu
  rationale: κάλαμος lazim berarti buluh atau benda seperti tongkat yang terbuat dari buluh. Kata penunjuk 'itu' mempertahankan artikel anaforis dan kaitannya dengan buluh yang disebut sebelumnya.
- source_word: ἔτυπτον
  choice: terus memukuli
  rationale: Bentuk imperfek dapat menandai tindakan berulang atau berkelanjutan; 'terus memukuli' menyampaikan aspek tersebut dalam bahasa Indonesia yang alami.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: kepalanya
  rationale: Frasa berpreposisi menunjukkan sasaran pukulan; dengan verba 'memukuli', objek 'kepalanya' merupakan ungkapan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Penggambaran penyiksaan terhadap Yesus oleh para prajurit
  choice: Tindakan penghinaan dan kekerasan disampaikan secara lugas, termasuk sifat pukulan yang berulang atau berkelanjutan.
  alternative: 'Menggunakan susunan lebih formal: ''Sesudah meludahi dia, mereka mengambil buluh itu dan berulang kali memukulnya pada kepala.'''
  rationale: Ayat ini bersifat naratif. Terjemahan mempertahankan penghinaan dan kekerasan dalam teks tanpa memperhalus ataupun menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Dia' dipakai secara alami untuk rujukan kepada Yesus dalam konteks ini; 'memukuli' mempertahankan nuansa pukulan berulang.
