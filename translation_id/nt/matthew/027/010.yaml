    rationale: Teks Yunani memakai ἔδωκαν, «mereka memberikan», bukan verba «membeli». Fungsi uang itu dalam transaksi dapat dipahami dari konteks, tetapi terjemahan ayat ini sebaiknya tidak menambahkan tindakan yang tidak dinyatakan.
  - severity: medium
    issue: Konstruksi «Tuhan memerintahkan kepadaku»
    rationale: Dalam bahasa Indonesia baku, «memerintahkan» biasanya memerlukan isi perintah atau objek yang diperintahkan kepada seseorang. «Tuhan memberi perintah kepadaku» menyampaikan daya perintah συνέταξέν dan relasi datif μοι secara idiomatis.
