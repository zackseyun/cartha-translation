  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: id
  text: dan mereka memberikan uang itu untuk ladang tukang periuk, sebagaimana Tuhan memberi perintah kepadaku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan mengarahkanku” atau “Tuhan memberi petunjuk kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Dalam kutipan atau alusi nubuat ini, Matius mempertahankan bentuk orang pertama “kepadaku”, bukan menyesuaikannya dengan konteks narasi.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν αὐτὰ
  choice: mereka menyerahkan uang itu
  rationale: ἔδωκαν berarti ‘memberikan/menyerahkan’, sedangkan αὐτά berbentuk jamak netral dan dalam konteks merujuk pada keping-keping uang perak. Bahasa Indonesia wajar memakai bentuk kolektif ‘uang itu’ tanpa menghilangkan acuannya.
- source_word: εἰς τὸν ἀγρὸν τοῦ κεραμέως
  choice: untuk membeli ladang tukang periuk
  rationale: Dalam konteks penggunaan uang untuk memperoleh ladang, εἰς menyatakan tujuan atau peruntukan. Penambahan ‘membeli’ membuat hubungan idiomatisnya jelas dalam bahasa Indonesia, sejalan dengan konteks langsung, meskipun kata itu tersirat dan bukan verba tersendiri dalam Yunani.
- source_word: κεραμέως
  choice: tukang periuk
  rationale: κεραμεύς adalah pembuat barang tembikar. ‘Tukang periuk’ merupakan padanan tradisional yang tetap mudah dipahami dan cocok dengan nama ladang dalam konteks.
- source_word: καθὰ
  choice: sebagaimana
  rationale: καθά menyatakan kesesuaian, ‘seperti/sebagaimana’. ‘Sebagaimana’ memberi corak dignified namun tetap lazim.
- source_word: συνέταξέν
  choice: memerintahkan
  rationale: συντάσσω dapat berarti memerintahkan, mengarahkan, atau memberi petunjuk. Dalam konteks tindakan berotoritas oleh Tuhan, ‘memerintahkan’ menyampaikan kekuatan verba secara langsung; alternatif yang lebih lunak dicatat dalam catatan kaki.
- source_word: μοι
  choice: kepadaku
  rationale: Dativa orang pertama dipertahankan secara eksplisit sebagai ‘kepadaku’, tanpa diselaraskan dengan konteks narasi.
- source_word: κύριος
  choice: Tuhan
  rationale: κύριος dalam konteks ini merujuk kepada Tuhan dan secara alami diterjemahkan ‘Tuhan’ dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan pembicara orang pertama dalam kutipan/alusi
  choice: Mempertahankan ‘kepadaku’ sesuai μοι dalam teks Yunani.
  alternative: Menghaluskan atau menyesuaikan orang pertama agar selaras dengan pelaku dalam narasi atau rumusan sumber Perjanjian Lama.
  rationale: Bentuk orang pertama merupakan bagian nyata dari teks Matius. Mempertahankannya menjaga transparansi terhadap sumber dan tidak menyelesaikan secara diam-diam ketegangan dalam cara Matius mengutip atau menggabungkan alusi nubuat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dibuat alami bagi pembaca umum. ‘Uang itu’ dipakai sebagai nomina kolektif Indonesia untuk acuan jamak αὐτά, dan ‘untuk membeli’ mengekspisitkan fungsi εἰς yang tersirat oleh konteks transaksi.
