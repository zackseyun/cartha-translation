  verdict: revise
  source_fidelity: Draf mempertahankan unsur-unsur pokok teks Yunani, termasuk bentuk orang pertama μοι. Namun, «membeli» bukan verba yang terdapat dalam ayat ini; meskipun pembelian jelas dari konteks, penambahan itu lebih eksplisit daripada teks kutipan. Selain itu, «Tuhan memerintahkan kepadaku» tidak idiomatis dalam bahasa Indonesia baku tanpa objek perintah.
  naturalness: «Untuk membeli ladang tukang periuk» sangat alami, tetapi menambahkan tindakan membeli. «Mereka memberikan uang itu untuk ladang tukang periuk» cukup alami dalam konteks transaksi dan lebih dekat dengan εἰς τὸν ἀγρόν. «Tuhan memberi perintah kepadaku» adalah konstruksi baku dan jelas.
  terminology: «Tukang periuk» merupakan padanan yang baik untuk κεραμεύς, dan «Tuhan» tepat untuk κύριος dalam konteks ini. Bentuk «kepadaku» perlu dipertahankan untuk mencerminkan μοι tanpa menafsirkan identitas pembicara.
