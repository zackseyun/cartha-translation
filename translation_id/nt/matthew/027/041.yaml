  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: id
  text: Demikian juga, para imam kepala pun, bersama para ahli Taurat dan tua-tua, mengolok-olok Dia dan berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menandai kesamaan dengan ejekan pada bagian sebelumnya secara ringkas dan alami.
- source_word: καὶ
  choice: juga
  rationale: Menyatakan bahwa para imam kepala turut melakukan tindakan yang sebelumnya dilakukan oleh kelompok lain.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah baku bagi kalangan pemimpin keimaman, bukan sejumlah pemegang satu jabatan imam besar.
- source_word: ἐμπαίζοντες
  choice: mengolok-olok Dia
  rationale: Menyampaikan tindakan mengejek dengan nada menghina; objek 'Dia' dipahami dengan jelas dari konteks.
- source_word: μετὰ
  choice: bersama
  rationale: Dengan bentuk genitif, kata ini paling wajar menunjukkan bahwa para ahli Taurat dan tua-tua ikut dalam tindakan tersebut.
- source_word: γραμματέων
  choice: para ahli Taurat
  rationale: Padanan Indonesia yang lazim dan kontekstual bagi kelompok ahli kitab dan hukum Taurat.
- source_word: πρεσβυτέρων
  choice: tua-tua
  rationale: Mempertahankan arti kelembagaan sebagai para pemimpin masyarakat Yahudi, bukan sekadar orang lanjut usia.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk lampau imperfek menunjukkan ujaran yang sedang atau berulang; bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit dalam klausa pengantar yang berlanjut ke ayat berikut.
theological_decisions:
- issue: Pihak-pihak yang ikut mengolok-olok Yesus
  choice: Para imam kepala, ahli Taurat, dan tua-tua digambarkan bersama-sama mengolok-olok Dia.
  alternative: Para imam kepala mengolok-olok Dia di hadapan para ahli Taurat dan tua-tua.
  rationale: μετά dengan genitif paling alami menyatakan kebersamaan atau keterlibatan, bukan hanya keberadaan di tempat yang sama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan partisip Yunani diungkapkan sebagai rangkaian verba koordinatif agar alami dalam bahasa Indonesia, sementara koma akhir dipertahankan karena perkataan langsung berlanjut pada ayat berikutnya.
