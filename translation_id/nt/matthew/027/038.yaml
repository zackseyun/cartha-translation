  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: id
  text: Kemudian dua orang perampok disalibkan bersama Dia[a], seorang di sebelah kanan dan seorang di sebelah kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun”; istilah Yunani ini dapat menunjuk perampok yang menggunakan kekerasan dan dalam konteks tertentu dapat pula berkaitan dengan kegiatan pemberontakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Kata keterangan waktu ini melanjutkan urutan peristiwa; “Kemudian” alami dan ringkas dalam narasi Indonesia.
- source_word: σταυροῦνται
  choice: disalibkan
  rationale: Bentuk kini pasif yang berfungsi secara naratif. Bahasa Indonesia tidak perlu menandai kala secara morfologis, sehingga “disalibkan” mempertahankan makna pasif dan tindakan penyaliban tanpa ungkapan yang kaku.
- source_word: σὺν αὐτῷ
  choice: bersama Dia
  rationale: σύν dengan datif menyatakan kebersamaan. “Bersama Dia” jelas dan alami; “Dia” merujuk kepada Yesus dalam konteks.
- source_word: δύο λῃσταί
  choice: dua orang perampok
  rationale: λῃστής lazim menunjuk perampok atau penyamun, sering dengan nuansa kekerasan. “Perampok” merupakan padanan modern yang jelas, sedangkan makna politis yang lebih khusus tidak dipaksakan.
- source_word: εἷς ἐκ δεξιῶν
  choice: seorang di sebelah kanan
  rationale: Ungkapan spasial idiomatis yang menunjukkan posisi di sisi kanan.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: dan seorang di sebelah kiri
  rationale: Ungkapan ini berlawanan dengan sisi kanan dan secara alami diterjemahkan sebagai posisi di sebelah kiri.
theological_decisions:
- issue: Identitas λῃσταί
  choice: Diterjemahkan “perampok” tanpa menetapkan identitas politik tertentu.
  alternative: “Penyamun”, “bandit”, atau “pemberontak”
  rationale: Istilah Yunani dapat menunjuk perampok atau bandit yang menggunakan kekerasan dan dalam konteks tertentu dapat bertumpang tindih dengan kegiatan pemberontakan. Namun, ayat ini sendiri tidak menuntut pengertian politis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan urutan informasi Yunani. Kapitalisasi “Dia” mengikuti kebiasaan umum bahasa Indonesia untuk rujukan kepada Yesus tanpa menambahkan keterangan yang tidak terdapat dalam teks.
