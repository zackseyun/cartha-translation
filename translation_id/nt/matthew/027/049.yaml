id: MAT.27.49
reference: Matthew 27:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: id
  text: Tetapi orang-orang lain berkata[a], “Biarkan dia. Mari kita lihat apakah Elia datang untuk menyelamatkan dia.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang lain berkata.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan, “Mari kita lihat apakah Elia akan datang untuk menyelamatkan dia.” Bahasa Yunani memakai bentuk kini (“datang”) dalam pertanyaan tidak langsung yang diperkenalkan dengan “apakah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Tetapi orang-orang lain
  rationale: Frasa ini menunjuk kepada orang-orang selain orang yang baru saja bertindak atau berbicara. 'Orang-orang lain' alami dalam bahasa Indonesia dan mempertahankan kontras yang ditandai oleh δέ.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek dapat menyiratkan ujaran yang berlangsung atau berulang, tetapi dalam narasi Indonesia 'berkata' paling wajar tanpa menafsirkan aspek secara berlebihan.
- source_word: Ἄφες
  choice: Biarkan dia
  rationale: Imperatif tunggal ini secara harfiah berarti 'biarkan'. Objeknya tersirat dalam bahasa Yunani; dalam konteks, 'dia' merujuk kepada Yesus dan menghasilkan ungkapan Indonesia yang alami.
- source_word: ἴδωμεν
  choice: Mari kita lihat
  rationale: Subjungtif aoris orang pertama jamak dipakai sebagai ajakan; 'Mari kita lihat' menyampaikan fungsi itu secara langsung dan alami.
- source_word: εἰ ἔρχεται
  choice: apakah ... datang
  rationale: εἰ memperkenalkan pertanyaan tidak langsung. Bentuk kini ἔρχεται dipertahankan sebagai 'datang', yang dalam bahasa Indonesia dapat menyampaikan tindakan yang sedang dinantikan tanpa harus menambahkan penanda kala.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama nabi yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: σώσων αὐτόν
  choice: untuk menyelamatkan dia
  rationale: Partisip futur σώσων menyatakan tujuan sehubungan dengan ἔρχεται. 'Menyelamatkan' mempertahankan hubungan leksikal dengan σῴζω sekaligus sesuai dengan arti langsung berupa pembebasan dari kematian.
theological_decisions:
- issue: Nuansa teologis σῴζω dalam konteks penyaliban
  choice: '''untuk menyelamatkan dia'' dalam arti langsung pembebasan fisik'
  alternative: '''untuk menolong dia'' atau ''untuk membebaskan dia'''
  rationale: Para pembicara sedang menantikan apakah Elia akan melepaskan Yesus dari salib, bukan merumuskan ajaran tentang keselamatan kekal. 'Menyelamatkan' tetap mempertahankan ironi dan hubungan leksikal dalam kisah sengsara tanpa menjelaskan ketegangan itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dialog dibuat alami bagi pembaca umum, sementara pertanyaan tidak langsung dan ketegangan mengenai tindakan Elia tetap dipertahankan.
