  terminology: “Elia” adalah bentuk nama yang baku dalam bahasa Indonesia. “Menyelamatkan” tepat untuk σώσων dalam konteks pembebasan yang sedang diejek, tanpa mengubahnya menjadi klaim keselamatan kekal. Penulisan “dia” tidak memaksakan kapitalisasi devosional yang tidak ditandai oleh teks sumber.
