  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Yunani dengan setia: δέ sebagai kontras (“Tetapi”), οἱ λοιποί sebagai “orang-orang lain,” imperfek ἔλεγον secara idiomatis sebagai “berkata,” imperatif Ἄφες sebagai “Biarkan dia,” ajakan ἴδωμεν sebagai “Mari kita lihat,” serta pertanyaan tidak langsung εἰ ἔρχεται dan tujuan σώσων αὐτόν. Tidak ada penambahan tafsiran doktrinal.'
