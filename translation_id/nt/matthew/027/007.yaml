  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: id
  text: Lalu, setelah berunding, mereka membeli Tanah Tukang Periuk dengan uang itu[a] untuk dijadikan tempat pemakaman bagi orang-orang asing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari benda-benda itu,” yakni keping-keping perak yang disebut dalam konteks sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “para pendatang” atau “orang-orang luar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: setelah berunding
  rationale: Ungkapan ini secara harfiah berarti ‘setelah mengambil pertimbangan/nasihat’. ‘Setelah berunding’ menyampaikan tindakan deliberatif bersama secara wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ melanjutkan alur cerita, bukan menyatakan pertentangan kuat. ‘Lalu’ merupakan penghubung naratif yang alami.
- source_word: ἠγόρασαν
  choice: mereka membeli
  rationale: Bentuk aoristus aktif dari ἀγοράζω secara langsung berarti tindakan membeli.
- source_word: ἐξ αὐτῶν
  choice: dengan uang itu
  rationale: Secara harfiah frasa ini berarti ‘dari benda-benda itu’ dan kata gantinya berbentuk netral jamak, merujuk pada keping-keping perak dalam konteks sebelumnya. Bahasa Indonesia lebih alami bila menyebut acuannya sebagai ‘uang itu’.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Tanah Tukang Periuk
  rationale: Frasa genitif ini menunjuk pada sebidang tanah yang dikenal berdasarkan kaitannya dengan tukang periuk. Huruf kapital memperlakukannya sebagai sebutan tempat dalam narasi.
- source_word: εἰς ταφὴν
  choice: untuk dijadikan tempat pemakaman
  rationale: εἰς dengan ταφή menyatakan tujuan atau peruntukan. Rumusan ini jelas dan alami dalam bahasa Indonesia.
- source_word: τοῖς ξένοις
  choice: bagi orang-orang asing
  rationale: ξένοις dapat menunjuk pada orang asing, pendatang, atau orang luar. ‘Orang-orang asing’ mempertahankan keluasan dasar istilah tersebut tanpa menentukan kewarganegaraan atau etnis mereka.
theological_decisions:
- issue: Acuan αὐτῶν
  choice: Kata ganti itu dipahami merujuk pada keping-keping perak yang dikembalikan Yudas dan diterjemahkan secara idiomatis sebagai ‘dengan uang itu’.
  alternative: Dapat diterjemahkan lebih harfiah sebagai ‘dari benda-benda itu’.
  rationale: Konteks langsung menunjukkan bahwa para imam menggunakan keping-keping perak tersebut. Terjemahan utama memperjelas acuan gramatikal tanpa menambahkan penafsiran teologis.
- issue: Identitas τοῖς ξένοις
  choice: Diterjemahkan ‘orang-orang asing’ tanpa menetapkan apakah mereka orang non-Yahudi, pendatang, atau sekadar orang yang berasal dari luar daerah.
  alternative: ‘Para pendatang’ atau ‘orang-orang luar’.
  rationale: Teks Yunani sendiri tidak mempersempit identitas kelompok itu; terjemahan mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami, sementara catatan kaki mempertahankan bentuk harfiah dan keluasan makna istilah Yunani.
