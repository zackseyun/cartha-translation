  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: id
  text: Ia menghadap Pilatus dan meminta jenazah Yesus. Lalu Pilatus memerintahkan agar jenazah itu diserahkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Ia
  rationale: Kata penunjuk ini mengacu kepada Yusuf dari Arimatea pada ayat sebelumnya. Dalam narasi bahasa Indonesia, pronomina "ia" lebih wajar daripada "orang ini" ketika acuannya sudah jelas.
- source_word: προσελθὼν
  choice: menghadap
  rationale: Partisip aoris ini menyatakan tindakan mendekati Pilatus sebelum mengajukan permintaan. "Menghadap" secara alami menggambarkan seseorang datang kepada pejabat yang berwenang.
- source_word: ᾐτήσατο
  choice: meminta
  rationale: Bentuk medial αἰτέω berarti meminta sesuatu; "meminta" secara langsung dan wajar mengambil objek "jenazah Yesus".
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: jenazah Yesus
  rationale: σῶμα secara leksikal berarti "tubuh", tetapi dalam konteks sesudah kematian dan permintaan untuk pemakaman, "jenazah" menyampaikan acuannya dengan alami, jelas, dan tetap bermartabat.
- source_word: τότε
  choice: Lalu
  rationale: τότε menandai peristiwa berikutnya dalam urutan narasi; "lalu" merupakan penghubung yang alami dalam bahasa Indonesia modern.
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: κελεύω menyatakan pemberian perintah. "Memerintahkan" tepat untuk tindakan resmi Pilatus.
- source_word: ἀποδοθῆναι
  choice: agar jenazah itu diserahkan kepadanya
  rationale: Infinitif pasif ἀποδίδωμι dapat berarti diberikan atau diserahkan. "Diserahkan" sesuai dengan pemindahan jenazah yang diizinkan Pilatus; "kepadanya" menyatakan penerima yang tersirat jelas dari permintaan Yusuf, sementara catatan kaki menjelaskan bahwa penerima itu tidak disebutkan secara eksplisit dalam bahasa Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. "Menghadap" cocok dengan situasi resmi di hadapan Pilatus, sedangkan "jenazah" lebih wajar daripada "tubuh" untuk tubuh orang yang telah meninggal.
