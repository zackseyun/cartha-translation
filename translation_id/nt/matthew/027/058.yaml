    issue: Pronomina "kepadanya" bersifat ambigu dalam bahasa Indonesia.
    rationale: Walaupun konteks dimaksudkan menunjuk Yusuf, anteceden gramatikal yang paling dekat ialah Pilatus. Selain itu, penerima tidak disebutkan secara eksplisit dalam teks Yunani. Menghilangkannya mempertahankan keterbukaan sintaksis sumber dan menghindari salah baca.
  - severity: low
    issue: Catatan kaki menjadi tidak diperlukan setelah penerima tersirat tidak dieksplisitkan.
    rationale: Tanpa "kepadanya," terjemahan sudah mencerminkan bahwa teks tidak menyebut penerima secara eksplisit; catatan tersebut tidak lagi memberi informasi yang diperlukan.
  revised_text: Ia menghadap Pilatus dan meminta jenazah Yesus. Lalu Pilatus memerintahkan agar jenazah itu diserahkan.
