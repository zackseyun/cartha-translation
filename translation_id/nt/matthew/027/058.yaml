- from: Ia menghadap Pilatus dan meminta jenazah Yesus. Lalu Pilatus memerintahkan agar jenazah itu diserahkan kepadanya.[a]
  to: Ia menghadap Pilatus dan meminta jenazah Yesus. Lalu Pilatus memerintahkan agar jenazah itu diserahkan.
  rationale: Revisi menghapus penerima yang ditambahkan demi mempertahankan ketidaktersuratan teks Yunani dan mencegah ambiguitas rujukan pronomina dalam bahasa Indonesia. Makna kontekstual—bahwa perintah itu berkaitan dengan jenazah yang diminta Yusuf—tetap jelas dari alur narasi.
