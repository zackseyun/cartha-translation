  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: id
  text: Di antara mereka terdapat Maria Magdalena, Maria, ibu dari Yakobus dan Yusuf[a], serta ibu dari anak-anak Zebedeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah atau bacaan mencantumkan “Yoses” sebagai ganti “Yusuf”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Di antara mereka
  rationale: Frasa ini merujuk kembali kepada kelompok perempuan pada ayat sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa perempuan-perempuan yang disebut termasuk dalam kelompok itu.
- source_word: ἦν
  choice: terdapat
  rationale: Kata kerja tunggal Yunani ini berfungsi secara eksistensial sebelum daftar beberapa orang. 'Terdapat' menyampaikan fungsi tersebut tanpa menimbulkan persoalan kesesuaian jumlah dalam bahasa Indonesia.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Bentuk nama dan sebutan yang baku serta mudah dikenali dalam bahasa Indonesia.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Maria ibu Yakobus dan Yusuf
  rationale: Genitif-genitif tersebut mengenali Maria melalui kedua anaknya. Susunan ini dekat dengan bahasa sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: Ἰάκωβος
  choice: Yakobus
  rationale: Bentuk konvensional nama Ἰάκωβος bagi tokoh Perjanjian Baru dalam bahasa Indonesia.
- source_word: Ἰωσὴφ
  choice: Yusuf
  rationale: SBLGNT membaca Ἰωσὴφ, yang lazim diterjemahkan 'Yusuf'. Bacaan varian dicatat dalam catatan kaki.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ibu anak-anak Zebedeus
  rationale: Terjemahan ini mempertahankan hubungan genitif dan cara teks mengidentifikasi perempuan tersebut melalui anak-anak Zebedeus, tanpa menambahkan namanya.
- source_word: Ζεβεδαίου
  choice: Zebedeus
  rationale: Bentuk nama yang lazim digunakan dalam Alkitab bahasa Indonesia.
