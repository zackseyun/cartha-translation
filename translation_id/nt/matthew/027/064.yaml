    issue: καὶ ἔσται diawali ‘Dengan demikian’
    rationale: Konjungsi καί di sini hanya melanjutkan akibat yang dikhawatirkan. ‘Dengan demikian’ menambahkan nuansa inferensial yang tidak perlu.
  - severity: low
    issue: πλάνη diterjemahkan ‘tipu daya’
    rationale: Dalam konteks ini πλάνη dapat berarti penyesatan/deception. ‘Penyesatan’ mempertahankan cakupan makna hasil atau keadaan menyesatkan lebih baik daripada istilah yang terutama menonjolkan siasat.
