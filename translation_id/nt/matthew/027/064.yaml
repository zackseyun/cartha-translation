  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: id
  text: Karena itu, perintahkanlah agar makam itu diamankan sampai hari ketiga, supaya jangan sampai murid-murid-Nya datang[a], mencuri-Nya, dan berkata kepada bangsa ini, ‘Dia telah dibangkitkan[b] dari antara orang mati,’ sehingga penyesatan yang terakhir akan lebih buruk daripada yang pertama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah menambahkan “pada malam hari” sesudah “datang”: “murid-murid-Nya datang pada malam hari dan mencuri-Nya.” Di sini diikuti bacaan yang lebih pendek.'
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “Dia dibangkitkan dari antara orang mati.” Kata Yunani yang digunakan berbentuk pasif.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: perintahkanlah
  rationale: Bentuk imperatif aoris meminta tindakan resmi dan tegas dari Pilatus; “perintahkanlah” alami dan mempertahankan daya perintahnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pernyataan sebelumnya.
- source_word: ἀσφαλισθῆναι
  choice: diamankan
  rationale: Mempertahankan bentuk pasif dan cakupan makna membuat makam aman tanpa membatasi caranya hanya pada penjagaan.
- source_word: τὸν τάφον
  choice: makam itu
  rationale: “Makam” sesuai dengan tempat penguburan yang dipahat pada batu, sedangkan artikel menunjuk pada makam yang sudah disebutkan.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: sampai hari ketiga
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tetap terkait dengan nubuat kebangkitan.
- source_word: μήποτε
  choice: Kalau tidak, ... mungkin
  rationale: Mengungkapkan kemungkinan yang dikhawatirkan dan hendak dicegah secara alami dalam bahasa Indonesia modern.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan posesif yang langsung dan wajar.
- source_word: κλέψωσιν αὐτόν
  choice: mencuri-Nya
  rationale: Mempertahankan objek berupa kata ganti pribadi, bukan menggantinya secara interpretatif dengan “jenazah-Nya” atau “tubuh-Nya”.
- source_word: εἴπωσιν τῷ λαῷ
  choice: berkata kepada rakyat
  rationale: λαός menunjuk kepada rakyat secara umum, bukan hanya kerumunan yang sedang berkumpul.
- source_word: Ἠγέρθη
  choice: Dia telah dibangkitkan
  rationale: Mempertahankan bentuk pasif Yunani dan menyampaikan akibat tindakan lampau yang masih relevan dalam klaim yang dilaporkan.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dari antara orang mati
  rationale: Mempertahankan bentuk jamak Yunani dan gagasan bangkit dari antara mereka yang mati.
- source_word: ἡ ἐσχάτη πλάνη
  choice: tipu daya yang terakhir
  rationale: “Tipu daya” sesuai dengan konteks dugaan tindakan menipu, tanpa mempersempit πλάνη hanya menjadi pernyataan bohong.
theological_decisions:
- issue: Bentuk klaim kebangkitan dalam ujaran yang dilaporkan
  choice: Dia telah dibangkitkan dari antara orang mati
  alternative: Dia telah bangkit dari antara orang mati
  rationale: Teks Yunani memakai bentuk pasif. Bentuk pasif dipertahankan agar tidak mengubahnya menjadi bentuk aktif/intransitif atau menyebutkan pelaku yang tidak dinyatakan secara eksplisit.
- issue: Objek pencurian
  choice: mencuri-Nya
  alternative: mencuri jenazah-Nya
  rationale: Teks Yunani mengatakan “Dia/nya”, bukan secara eksplisit “jenazah”. Pilihan ini mempertahankan ungkapan sumber tanpa meniadakan rujukan kontekstualnya kepada tubuh Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi agar hubungan antara perintah, kemungkinan yang dikhawatirkan, dan akibatnya mudah dipahami. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
