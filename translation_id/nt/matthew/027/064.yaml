  source_fidelity: 'Secara umum setia pada teks Yunani SBLGNT: imperatif, pasif pada ‘diamankan’ dan ‘dibangkitkan’, serta objek προσωπικό pada ‘mencuri-Nya’ dipertahankan. Namun, pemenggalan kalimat setelah ‘hari ketiga’ dan tambahan ‘Dengan demikian’ agak mengaburkan struktur tunggal μήποτε ... καὶ ἔσται. ‘Kalau tidak’ juga kurang tepat untuk μήποτε, yang menyatakan kemungkinan yang dikhawatirkan, bukan akibat alternatif yang pasti.'
