revisions:
- from: Karena itu, perintahkanlah agar makam itu diamankan sampai hari ketiga. Kalau tidak, murid-murid-Nya mungkin datang[a] dan mencuri-Nya, lalu berkata kepada rakyat, ‘Dia telah dibangkitkan[b] dari antara orang mati.’ Dengan demikian, tipu daya yang terakhir akan lebih buruk daripada yang pertama.
  to: Karena itu, perintahkanlah agar makam itu diamankan sampai hari ketiga, supaya jangan sampai murid-murid-Nya datang[a], mencuri-Nya, dan berkata kepada bangsa ini, ‘Dia telah dibangkitkan[b] dari antara orang mati,’ sehingga penyesatan yang terakhir akan lebih buruk daripada yang pertama.
  rationale: Revisi menyatukan kembali struktur perintah dan tujuan pencegahan sebagaimana dalam Yunani, mengganti ‘Kalau tidak’ dengan ‘supaya jangan sampai’, dan menghindari tambahan nuansa inferensial pada kalimat akibat. ‘Bangsa ini’ dipilih sebagai padanan Indonesia yang lazim untuk λαός dalam konteks ini, dan ‘penyesatan’ menjaga keluasan πλάνη. Catatan kaki serta jangkar dipertahankan dan tetap cocok dengan teks revisi.
