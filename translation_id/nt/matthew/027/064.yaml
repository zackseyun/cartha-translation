  terminology: ‘Makam’, ‘diamankan’, ‘murid-murid-Nya’, dan ‘Dia telah dibangkitkan dari antara orang mati’ tepat. ‘Penyesatan terakhir’ lebih dekat dengan πλάνη daripada ‘tipu daya yang terakhir’, karena mencakup tindakan/keadaan menyesatkan tanpa membatasi pada kelicikan sebagai metode.
