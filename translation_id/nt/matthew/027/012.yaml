  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: id
  text: Dan ketika Ia dituduh oleh imam-imam kepala dan para tua-tua, Ia tidak menjawab apa pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: ketika Ia dituduh
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan waktu yang bersamaan. Dalam bahasa Indonesia, “ketika Ia dituduh” mengungkapkan hubungan temporal dan bentuk pasif secara alami tanpa membuat proses tuduhan terlalu eksplisit.
- source_word: κατηγορεῖσθαι
  choice: dituduh
  rationale: Infinitif pasif ini menunjuk pada tuduhan yang diajukan terhadap Yesus. “Dituduh” merupakan padanan hukum dan naratif yang baku serta mudah dipahami.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: oleh imam-imam kepala dan para tua-tua
  rationale: Dalam Injil, ἀρχιερεῖς lazim menunjuk kepada kalangan pemimpin imam, sehingga “imam-imam kepala” lebih tepat daripada bentuk jamak “imam-imam besar”. “Para tua-tua” mempertahankan sebutan kelompok kepemimpinan Yahudi.
- source_word: οὐδὲν
  choice: apa pun
  rationale: Sebagai objek ἀπεκρίνατο dalam kalimat negatif, οὐδέν secara idiomatis diterjemahkan “tidak ... apa pun”, dengan tetap mempertahankan bahwa tidak ada jawaban yang diberikan.
- source_word: ἀπεκρίνατο
  choice: Ia tidak menjawab
  rationale: Verba aoristus deponen ini secara langsung berarti “menjawab”. Gabungannya dengan οὐδέν paling alami dinyatakan “tidak menjawab apa pun”, tanpa menambahkan tafsiran.
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini meneruskan alur narasi secara langsung; “Dan” mempertahankan fungsi tersebut tanpa menambahkan pertentangan.
theological_decisions:
- issue: Sikap diam Yesus di hadapan para penuduh-Nya
  choice: 'Menyatakannya secara langsung sebagai laporan naratif: “Ia tidak menjawab apa pun.”'
  alternative: Memakai ungkapan yang sengaja memperkuat gema Yesaya 53, misalnya “Ia sama sekali tidak membuka mulut-Nya.”
  rationale: Ayat ini melaporkan bahwa Yesus tidak menanggapi tuduhan. Walaupun hal itu dapat menggemakan tema nubuat, teks ayat ini sendiri tidak menyatakan penggenapan atau memakai ungkapan “membuka mulut”, sehingga terjemahan tidak menambahkannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Huruf kapital pada “Ia” mengikuti kebiasaan luas dalam penerjemahan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena ungkapan “tidak menjawab apa pun” sekaligus akurat dan alami; catatan kaki bahasa Inggris tampaknya salah letak karena alternatifnya berkaitan dengan klausa jawaban, bukan “elders”.
