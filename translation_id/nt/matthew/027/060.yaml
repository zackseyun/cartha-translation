  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: id
  text: Lalu ia membaringkan jenazah Yesus di dalam makam baru miliknya, yang telah dipahatnya di dalam batu karang. Sesudah menggulingkan sebuah batu besar ke pintu masuk makam itu[a], ia pun pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «ke pintu makam itu». Kata Yunani yang dipakai dapat berarti “pintu” atau “pintu masuk”; “pintu masuk” dipilih untuk memperjelas konteks makam pahatan batu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: membaringkan jenazah Yesus
  rationale: τίθημι berarti menaruh atau meletakkan. Dalam konteks pemakaman, 'membaringkan' terdengar alami dan bermartabat; 'jenazah Yesus' memperjelas acuan pronomina netral αὐτό yang dalam bahasa Indonesia tidak alami jika diterjemahkan 'itu' saja.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: di dalam makam baru miliknya
  rationale: μνημεῖον menunjuk pada makam dalam konteks penguburan, καινός berarti 'baru', dan αὐτοῦ menyatakan bahwa makam itu milik Yusuf. Terjemahan ini tidak menambahkan gagasan 'belum pernah dipakai' yang hanya tersirat.
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: yang telah dipahatnya pada bukit batu
  rationale: λατομέω menggambarkan memahat atau menggali batu. 'Bukit batu' secara alami menyampaikan bahwa makam dipahat pada massa batu, tanpa memberi kesan bahwa makam dibuat dari bongkahan batu terpisah.
- source_word: προσκυλίσας
  choice: sesudah menggulingkan
  rationale: Partisip aoris menunjukkan tindakan yang mendahului ἀπῆλθεν; 'sesudah' menyatakan urutan itu dengan jelas.
- source_word: λίθον μέγαν
  choice: sebuah batu besar
  rationale: Terjemahan langsung dan alami untuk frasa ini.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: ke pintu masuk makam itu
  rationale: θύρα dapat berarti pintu atau jalan masuk. 'Pintu masuk' jelas dalam konteks makam yang dipahat pada batu dan tidak menyiratkan adanya daun pintu berengsel.
- source_word: ἀπῆλθεν
  choice: ia pun pergi
  rationale: ἀπέρχομαι di sini menyatakan kepergian sederhana. Partikel 'pun' membantu alur narasi tanpa menambahkan makna teologis.
