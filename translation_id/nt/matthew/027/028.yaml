  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: id
  text: Setelah mereka menanggalkan pakaian-Nya, mereka mengenakan mantel merah kirmizi[a] pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah merah kirmizi.” Istilah Yunani ini dapat menunjuk lebih luas pada pakaian luar atau mantel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Setelah ... mereka
  rationale: Hubungan naratif καί dinyatakan secara alami melalui susunan kalimat Indonesia; tindakan partisip mendahului tindakan utama tanpa perlu menerjemahkan καί secara terpisah sebagai “dan”.
- source_word: ἐκδύσαντες αὐτόν
  choice: Setelah menanggalkan pakaian-Nya
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. “Menanggalkan pakaian-Nya” menyampaikan bahwa mereka melucuti pakaian Yesus tanpa terdengar kaku.
- source_word: χλαμύδα
  choice: mantel
  rationale: χλαμύς menunjuk pada pakaian luar atau mantel, sering berupa mantel pendek yang berkaitan dengan tentara atau pejabat. “Mantel” mempertahankan kekhususan leksikalnya tanpa menambahkan makna kerajaan yang tidak dinyatakan langsung oleh kata tersebut.
- source_word: κοκκίνην
  choice: merah menyala
  rationale: κόκκινος menunjukkan warna merah cerah atau merah kirmizi. “Merah menyala” alami dalam bahasa Indonesia modern dan mempertahankan kesan warna yang terang.
- source_word: περιέθηκαν αὐτῷ
  choice: memakaikan ... kepada-Nya
  rationale: Dalam konteks ini περιτίθημι dengan datif berarti mengenakan atau menaruh pakaian pada seseorang. “Memakaikan ... kepada-Nya” merupakan ungkapan Indonesia yang wajar dan tepat.
theological_decisions:
- issue: Jenis pakaian dalam adegan penghinaan
  choice: mantel merah menyala
  alternative: jubah merah menyala
  rationale: Pilihan “mantel” mengikuti arti khusus χλαμύς sebagai pakaian luar, sering berupa mantel pendek, dan tidak memperbesar simbolisme kerajaan melebihi yang dinyatakan teks. Alternatif “jubah” tetap mungkin karena istilah itu dapat dipakai lebih luas untuk pakaian luar.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Kapitalisasi pronomina yang mengacu kepada Yesus mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia.
