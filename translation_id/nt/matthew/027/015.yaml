  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: id
  text: Pada hari raya itu[a], gubernur biasanya membebaskan bagi orang banyak seorang tahanan yang mereka kehendaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perayaan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Pada hari raya itu
  rationale: κατά dengan akusatif menyatakan waktu, yakni pada saat perayaan tersebut. δέ hanya menghubungkan alur secara ringan dan tidak perlu diterjemahkan dengan kata tersendiri dalam bahasa Indonesia.
- source_word: ἑορτὴν
  choice: hari raya
  rationale: ἑορτή berarti perayaan atau hari raya keagamaan; dalam konteks ini acuannya adalah hari raya yang sudah dikenal dari narasi, sehingga 'hari raya itu' alami dan jelas.
- source_word: εἰώθει
  choice: biasa
  rationale: Bentuk imperfek ini menyatakan kebiasaan pada masa lampau. 'Biasa' menyampaikan tindakan yang lazim dilakukan dengan ringkas dan alami.
- source_word: ὁ ἡγεμὼν
  choice: gubernur
  rationale: Dalam konteks pemerintahan Romawi, ἡγεμών menunjuk kepada gubernur provinsi; 'gubernur' merupakan padanan modern yang jelas.
- source_word: ἀπολύειν
  choice: membebaskan
  rationale: ἀπολύω di sini berarti melepaskan seseorang dari tahanan. 'Membebaskan' tepat dalam konteks yudisial.
- source_word: ἕνα ... δέσμιον
  choice: seorang tahanan
  rationale: ἕνα menegaskan satu orang, sedangkan δέσμιος adalah orang yang ditahan. Bahasa Indonesia secara alami merangkumnya sebagai 'seorang tahanan'.
- source_word: τῷ ὄχλῳ
  choice: orang banyak
  rationale: ὄχλος menunjuk kepada kumpulan orang. Hubungan datifnya disampaikan secara alami melalui frasa 'yang dikehendaki orang banyak', tanpa ungkapan kaku 'kepada orang banyak'.
- source_word: ὃν ἤθελον
  choice: yang dikehendaki orang banyak
  rationale: Klausa relatif ini menunjuk kepada tahanan yang menjadi pilihan orang banyak. Penyebutan kembali 'orang banyak' menghindari kata ganti 'mereka' yang dapat kabur dalam bahasa Indonesia.
