source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: id
  text: Segera salah seorang dari mereka berlari, mengambil spons, mengisinya dengan anggur asam[a], memasangnya pada sebatang buluh, lalu memberi Yesus minum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “cuka.” Kata Yunani ὄξος dapat merujuk pada anggur asam atau cuka anggur.'
    reason: lexical_alternative
  - marker: b
    text: 'Kata kerja Yunani berbentuk imperfek dan dapat menonjolkan tindakan yang sedang berlangsung atau berulang: “lalu terus memberi Yesus minum.”'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: segera
  rationale: Padanan alami dan langsung untuk tindakan yang dilakukan tanpa penundaan dalam alur narasi.
- source_word: δραμὼν
  choice: berlari
  rationale: Partisip aoris dialihkan menjadi verba beruntun yang wajar dalam narasi Indonesia dan tetap menyampaikan gerak yang mendesak.
- source_word: εἷς ἐξ αὐτῶν
  choice: salah seorang dari mereka
  rationale: Ungkapan partitif ini paling alami diterjemahkan demikian dalam bahasa Indonesia dan menunjukkan bahwa satu orang dari kelompok itu bertindak.
- source_word: λαβὼν σπόγγον
  choice: mengambil spons
  rationale: Mempertahankan urutan tindakan dengan susunan verbal yang lancar dalam bahasa Indonesia.
- source_word: πλήσας τε ὄξους
  choice: mengisinya dengan anggur asam
  rationale: ὄξος menunjuk pada anggur yang masam atau cuka anggur; 'anggur asam' menghindari kesan cuka dapur modern dan sesuai dengan minuman murah yang dimaksud.
- source_word: περιθεὶς καλάμῳ
  choice: memasangnya pada sebatang buluh
  rationale: Kata kerja menunjukkan spons ditempatkan atau dipasang pada buluh; 'buluh' merupakan padanan langsung bagi κάλαμος dalam konteks ini.
- source_word: ἐπότιζεν αὐτόν
  choice: memberi Yesus minum
  rationale: Menyampaikan makna kausatif ποτίζω secara alami. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah referennya.
theological_decisions:
- issue: Jenis minuman yang diberikan kepada Yesus
  choice: anggur asam
  alternative: cuka atau cuka anggur
  rationale: ὄξος dapat merujuk pada anggur masam atau cuka anggur. Teks utama memakai 'anggur asam' sebagai padanan yang lebih tepat bagi pembaca modern, sedangkan alternatif leksikal dipertahankan dalam catatan kaki.
- issue: Aspek verba ἐπότιζεν
  choice: memberi Yesus minum
  alternative: terus memberi Yesus minum / berusaha memberi Yesus minum
  rationale: Bentuk imperfek bersifat tidak selesai dari sudut pandang aspek, tetapi dalam konteks ini tidak harus berarti tindakan berulang atau usaha yang gagal. Terjemahan utama dibiarkan alami, sementara kemungkinan nuansa berlangsung atau diupayakan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Rangkaian partisip Yunani diterjemahkan sebagai deretan verba agar alami. 'Spons' dan 'buluh' mempertahankan benda konkret dalam teks sumber; 'Yesus' memperjelas pronomina tanpa menambah tafsiran.
