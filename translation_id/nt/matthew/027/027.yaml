  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: id
  text: Kemudian para prajurit gubernur membawa Yesus ke dalam pretorium[a] dan mengumpulkan seluruh kohor itu di sekeliling-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “markas gubernur”. Istilah Yunani ini merujuk pada kediaman resmi atau markas militer gubernur Romawi.
    reason: lexical_alternative
  - marker: b
    text: “Kohor” adalah istilah untuk satuan militer Romawi; ungkapan ini tidak harus berarti bahwa setiap prajurit dari satu kohor lengkap hadir secara fisik.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai kelanjutan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: para prajurit gubernur
  rationale: Mengungkapkan hubungan para prajurit itu dengan gubernur Romawi secara ringkas dan wajar.
- source_word: παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον
  choice: membawa Yesus masuk ke dalam pretorium
  rationale: Mengalihkan bentuk partisip Yunani menjadi verba utama yang alami, sambil mempertahankan arah masuk ke lokasi tersebut.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: mengumpulkan ... mengelilingi Dia
  rationale: Dalam konteks ini, frasa tersebut menggambarkan para prajurit yang dihimpunkan menuju dan di sekitar Yesus.
- source_word: ὅλην τὴν σπεῖραν
  choice: seluruh kohor
  rationale: Mempertahankan istilah satuan militer Romawi dan menerjemahkan ὅλην secara eksplisit sebagai 'seluruh'.
