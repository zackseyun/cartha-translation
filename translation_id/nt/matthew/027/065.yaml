  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: id
  text: Pilatus berkata kepada mereka, “Kalian mempunyai satu regu penjaga.[a] Pergilah dan amankan kubur itu sebaik yang kalian bisa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ambillah satu regu penjaga,” atau mungkin “Kalian mempunyai regu penjaga sendiri.” Ungkapan Yunani ini dapat dipahami sebagai Pilatus memberikan atau mengizinkan penggunaan regu penjaga, atau sebagai rujukan kepada regu penjaga yang sudah tersedia bagi mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: berkata kepada mereka
  rationale: Ungkapan naratif yang wajar untuk verba φημί dengan pronomina datif sebagai penerima perkataan.
- source_word: Ἔχετε
  choice: Kalian mempunyai
  rationale: Mempertahankan bentuk indikatif dan arti leksikal yang paling langsung, sekaligus membiarkan konteks menentukan apakah ini pemberian izin atau rujukan kepada penjaga yang sudah tersedia.
- source_word: κουστωδίαν
  choice: pasukan penjaga
  rationale: Kata pinjaman dari bahasa Latin custodia di sini menunjuk pada satu regu atau kesatuan penjaga, bukan hanya satu orang penjaga.
- source_word: ὑπάγετε
  choice: Pergilah
  rationale: Imperatif keberangkatan yang ringkas, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: ἀσφαλίσασθε
  choice: amankan kubur itu
  rationale: Imperatif medium bermakna membuat aman atau menjamin keamanan. Objek 'kubur itu' dibuat eksplisit dari konteks langsung agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ὡς οἴδατε
  choice: sebaik yang kalian bisa
  rationale: Ungkapan idiomatis ini menyatakan tindakan menurut pengetahuan atau kemampuan mereka; pilihan ini alami dalam bahasa Indonesia tanpa menentukan metode tertentu.
theological_decisions:
- issue: Apakah Ἔχετε κουστωδίαν berarti Pilatus memberikan pasukan Romawi atau menunjuk pada pasukan penjaga yang telah tersedia bagi para pemimpin Yahudi
  choice: Kalian mempunyai pasukan penjaga
  alternative: 'Bawalah pasukan penjaga; atau: Kalian mempunyai pasukan penjaga sendiri'
  rationale: Bentuk Yunani dapat dipahami sebagai pernyataan atau sebagai izin/perintah. Teks utama mempertahankan bentuk indikatif yang paling langsung, sedangkan catatan kaki menjaga ambiguitas historisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “kalian” dipakai karena penerimanya jamak. “Pasukan penjaga” menghindari kesan bahwa κουστωδίαν hanya menunjuk kepada seorang penjaga.
