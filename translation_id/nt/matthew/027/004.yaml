  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: id
  text: katanya, “Aku telah berdosa karena telah menyerahkan darah orang yang tidak bersalah.” Namun, mereka berkata, “Apa urusannya dengan kami? Tanggunglah sendiri.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau akan melihat”; dalam konteks ini ungkapan tersebut berarti, “Itu tanggung jawabmu” atau “Uruslah sendiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Aku telah berdosa
  rationale: Bentuk aoris menyatakan pengakuan atas tindakan yang telah dilakukan; bentuk perfektif bahasa Indonesia secara wajar menonjolkan kesalahan yang kini diakui Yudas.
- source_word: παραδοὺς
  choice: karena menyerahkan
  rationale: Partisip aoris ini paling wajar dipahami sebagai penyebab atau dasar dosa yang diakui. “Menyerahkan” mempertahankan arti dasar παραδίδωμι sekaligus sesuai dengan tindakan Yudas dalam konteks.
- source_word: αἷμα ἀθῷον
  choice: darah orang yang tidak bersalah
  rationale: Ungkapan ini mempertahankan citra “darah” dan daya hukum-moralnya, sambil membuat idiom Yunani jelas dan alami bagi pembaca Indonesia tanpa menyebut Yesus secara eksplisit.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Apa urusannya dengan kami?
  rationale: Padanan idiomatis yang ringkas untuk penolakan keterlibatan atau tanggung jawab oleh para pemimpin imam.
- source_word: σὺ ὄψῃ
  choice: Tanggunglah sendiri
  rationale: Future middle ini berfungsi secara idiomatis sebagai penolakan tajam yang menyerahkan tanggung jawab kembali kepada Yudas; ungkapan Indonesia ini lebih alami daripada terjemahan harfiah dengan verba “melihat”.
theological_decisions:
- issue: Apakah identitas orang yang tidak bersalah perlu disebutkan secara eksplisit
  choice: Referennya tetap implisit dalam frasa “darah orang yang tidak bersalah.”
  alternative: “darah Yesus yang tidak bersalah”
  rationale: Teks Yunani tidak menyebut nama Yesus di sini. Terjemahan mempertahankan implikasi konteks tanpa menambahkan referen ke dalam teks.
- issue: Nuansa σὺ ὄψῃ
  choice: 'Diterjemahkan sebagai penolakan tanggung jawab: “Tanggunglah sendiri.”'
  alternative: “Engkau akan melihatnya” atau “Uruslah sendiri”
  rationale: Makna idiomatisnya ialah bahwa perkara itu menjadi tanggung jawab Yudas. Pilihan utama mempertahankan nada ketus dan langsung tanpa menjadikannya pernyataan ramalan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami, sementara citra darah serta ketegangan moral dalam teks sumber dipertahankan.
