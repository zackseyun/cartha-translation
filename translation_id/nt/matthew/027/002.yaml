  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: id
  text: Lalu, setelah mengikat Yesus[a], mereka membawa-Nya pergi dan menyerahkan-Nya kepada Pilatus, gubernur itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah mereka mengikat-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: setelah mengikat
  rationale: Partisip aoris aktif ini menyatakan tindakan yang mendahului verba-verba utama. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan arti konkret mengikat.
- source_word: αὐτόν
  choice: Yesus / -Nya
  rationale: Acuan pronomina diperjelas sebagai Yesus pada penyebutan pertama demi kewajaran bahasa Indonesia, lalu dinyatakan dengan bentuk pronominal hormat.
- source_word: ἀπήγαγον
  choice: mereka membawa-Nya pergi
  rationale: ἀπάγω berarti membawa atau menggiring pergi. Pilihan ini mempertahankan gerak menjauh dalam konteks tahanan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: παρέδωκαν
  choice: menyerahkan-Nya
  rationale: παραδίδωμι di sini menunjuk pada penyerahan Yesus ke dalam kewenangan atau tahanan Pilatus; 'menyerahkan' jelas, modern, dan tetap dapat memuat gema yuridis maupun teologis.
- source_word: Πιλάτῳ
  choice: kepada Pilatus
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang sudah lazim, dengan preposisi 'kepada' untuk menandai penerima.
- source_word: τῷ ἡγεμόνι
  choice: gubernur itu
  rationale: ἡγεμών adalah pejabat pemerintahan. 'Gubernur' mudah dipahami dan tidak mempersempit istilah Yunani menjadi jabatan historis yang lebih khusus.
- source_word: καὶ ... καὶ
  choice: Lalu ... dan
  rationale: Rangkaian naratif dan koordinasi tindakan dipertahankan secara alami; 'lalu' menghindari pembukaan kalimat yang kaku sambil menyampaikan kelanjutan kisah.
theological_decisions:
- issue: Makna παραδίδωμι dalam kisah sengsara
  choice: menyerahkan-Nya
  alternative: menyerahkan Yesus ke dalam kekuasaan Pilatus
  rationale: Pilihan utama mempertahankan makna langsung berupa penyerahan tahanan sekaligus tidak meniadakan resonansi teologis verba tersebut. Alternatif menjelaskan konteks tetapi menambahkan unsur 'kekuasaan' yang hanya tersirat.
- issue: Penyebutan jabatan Pilatus
  choice: gubernur
  alternative: prefek
  rationale: Teks Yunani memakai istilah umum ἡγεμών, bukan istilah jabatan Latin yang lebih khusus. Karena itu, 'gubernur' lebih setia pada tingkat kekhususan sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia; struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Yunani.
