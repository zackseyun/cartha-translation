  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: id
  text: “Orang lain Ia selamatkan, tetapi Ia tidak dapat menyelamatkan diri-Nya sendiri. Ia Raja Israel; biarlah Ia turun sekarang dari salib[a], maka kami akan percaya kepada-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika Ia Raja Israel, biarlah Ia turun sekarang dari salib, maka kami akan percaya kepada-Nya.” Sejumlah terjemahan menyatakan secara eksplisit makna bersyarat dalam ejekan ini, tetapi teks Yunani menyebut gelar itu secara langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Orang lain Dia selamatkan
  rationale: Susunan ini alami dalam bahasa Indonesia sekaligus menonjolkan kontras ejekan antara orang lain dan diri-Nya sendiri. ‘Selamatkan’ mempertahankan keluasan makna σῴζω, termasuk menyelamatkan, melepaskan, dan menyembuhkan.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: tetapi diri-Nya sendiri tidak dapat Dia selamatkan
  rationale: ‘Diri-Nya sendiri’ mempertahankan tekanan refleksif, sedangkan ‘tidak dapat’ menyampaikan δύναται secara langsung. ‘Tetapi’ menjadikan kontras yang tersirat dalam penjajaran klausa terasa wajar dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: βασιλεὺς Ἰσραήλ ἐστιν
  choice: Dia Raja Israel!
  rationale: Menerjemahkan klausa nominal sebagai pernyataan langsung, bukan sebagai syarat tersirat. Tanda seru menyampaikan nada tantangan dan ejekan dari konteks tanpa menambahkan unsur leksikal.
- source_word: καταβάτω νῦν
  choice: Biarlah sekarang Dia turun
  rationale: ‘Biarlah ... Dia turun’ menyampaikan imperatif orang ketiga sebagai tantangan; ‘sekarang’ mempertahankan desakan νῦν.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: dari salib
  rationale: Padanan langsung dan baku untuk frasa preposisional tersebut.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: kami akan percaya kepada-Nya
  rationale: ‘Percaya kepada-Nya’ secara idiomatis menyatakan kepercayaan yang diarahkan kepada seseorang dan mempertahankan objek personal konstruksi ἐπί dengan akusatif.
theological_decisions:
- issue: Penyajian klaim kerajaan yang dipakai untuk mengejek Yesus
  choice: Dia Raja Israel!
  alternative: Jika Dia Raja Israel
  rationale: Teks Yunani menyatakan gelar itu secara langsung dan tidak memuat partikel bersyarat. Terjemahan utama mempertahankan bentuk pernyataan tersebut serta ketegangan ironisnya; kemungkinan memahami keseluruhan tantangan secara bersyarat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Urutan objek di awal kalimat dipertahankan untuk menegaskan kontras retoris dalam ejekan.
