  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: id
  text: Ketika Pilatus sedang duduk di kursi pengadilan, istrinya mengirim pesan kepadanya, “Jangan mencampuri urusan orang benar itu[a], sebab hari ini aku sangat menderita dalam mimpi karena dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang tidak bersalah itu.” Kata Yunani yang dipakai dapat berarti “orang yang benar,” “adil,” atau, dalam konteks hukum, “tidak bersalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Ketika Pilatus sedang duduk
  rationale: Genitif absolut menyatakan keadaan yang berlangsung bersamaan. Nama Pilatus diperjelas dari konteks agar rujukan pronomina alami dalam bahasa Indonesia.
- source_word: ἐπὶ τοῦ βήματος
  choice: di kursi pengadilan
  rationale: Dalam konteks ini βῆμα menunjuk tempat duduk resmi hakim; frasa ini jelas dan alami bagi pembaca Indonesia.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ
  choice: istrinya mengirim pesan kepadanya
  rationale: Ungkapan ini menyiratkan penyampaian pesan melalui utusan tanpa perlu menentukan medianya.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Jangan turut campur dalam perkara Orang benar itu
  rationale: Idiom eliptis ini merupakan peringatan agar Pilatus tidak melibatkan diri dalam perkara orang tersebut. 'Turut campur dalam perkara' mempertahankan konteks pengadilan dan terdengar wajar dalam bahasa Indonesia.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: Orang benar itu
  rationale: δίκαιος terutama menyatakan sifat benar atau adil, tetapi dalam konteks hukum juga dapat berarti tidak bersalah; alternatif tersebut dicatat dalam catatan kaki.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: sebab hari ini aku sangat menderita dalam mimpi karena Dia
  rationale: Terjemahan ini mempertahankan hubungan alasan, intensitas penderitaan, waktu, pengalaman dalam mimpi, dan penyebab yang dinyatakan teks Yunani.
theological_decisions:
- issue: Makna δίκαιος sebagai sebutan bagi Yesus
  choice: Orang benar
  alternative: orang yang tidak bersalah
  rationale: '''Orang benar'' mempertahankan dimensi moral kata δίκαιος dan gema khas Matius, sedangkan arti hukum ''tidak bersalah'' tetap diakui dalam catatan kaki.'
- issue: Rujukan δι’ αὐτόν
  choice: karena Dia
  alternative: karena orang itu
  rationale: Pronomina mempertahankan bentuk sumber dan secara alami merujuk kepada Yesus tanpa menjelaskan bagaimana mimpi tentang Dia menyebabkan penderitaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kursi pengadilan' menghindari istilah teknis yang kurang dikenal. Kapitalisasi 'Orang' dan 'Dia' mengikuti kebiasaan penghormatan dalam penerbitan Alkitab Indonesia tanpa menambahkan gelar yang tidak terdapat dalam teks.
