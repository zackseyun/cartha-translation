  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: id
  text: Ketika mereka sampai di suatu tempat yang disebut Golgota, yang berarti Tempat Tengkorak,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “yang disebut Tempat Tengkorak.” Ungkapan Yunani ini menjelaskan nama Golgota.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: ketika mereka sampai
  rationale: Partisip aoris ini dipahami secara temporal; bentuk ini alami dalam narasi Indonesia dan mempertahankan urutan peristiwa.
- source_word: τόπον
  choice: suatu tempat
  rationale: Nomina tanpa artikel ini wajar diterjemahkan secara tak tentu sebagai 'suatu tempat'.
- source_word: λεγόμενον
  choice: yang disebut
  rationale: Dalam idiom ini, bentuk dari λέγω menyatakan nama atau sebutan suatu tempat.
- source_word: Γολγοθᾶ
  choice: Golgota
  rationale: Nama tempat ini ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: ὅ ἐστιν
  choice: yang berarti
  rationale: Rumus ini memberi penjelasan arti nama Golgota bagi pembaca; 'yang berarti' menyampaikan fungsi penjelasannya secara alami.
- source_word: Κρανίου Τόπος
  choice: Tempat Tengkorak
  rationale: Frasa genitif ini secara harfiah menunjuk pada tempat yang berkaitan dengan tengkorak. Tanpa artikel dalam bahasa Yunani, bahasa Indonesia tidak perlu menambahkan bentuk definit tertentu.
- source_word: λεγόμενος
  choice: disebut
  rationale: Partisip kedua kembali menyatakan sebutan tempat tersebut; dalam teks utama, maknanya diserap secara alami oleh frasa penjelas 'yang berarti', sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
