  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: id
  text: Demikian juga, bahkan para perampok yang disalibkan bersama Yesus menghina Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencela Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Demikian juga
  rationale: Ungkapan ini berfungsi secara adverbial dan merujuk pada perlakuan berupa ejekan yang baru saja diceritakan; 'Demikian juga' alami dalam bahasa Indonesia dan tetap menyatakan bahwa para perampok bertindak dengan cara yang sama.
- source_word: καὶ
  choice: bahkan
  rationale: 'Dalam konteks ini καί bersifat menegaskan dan klimaktis: bukan hanya orang-orang yang lewat dan para pemimpin, melainkan bahkan para perampok ikut menghina Yesus.'
- source_word: λῃσταὶ
  choice: para perampok
  rationale: Kata λῃστής biasanya menunjuk kepada perampok atau penyamun. 'Perampok' jelas dan umum tanpa secara tidak berdasar menentukan bahwa mereka pemberontak politik.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: yang disalibkan bersama Yesus
  rationale: Partisipel pasif ini menerangkan para perampok sebagai orang-orang yang disalibkan di samping Yesus. Nama 'Yesus' dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: ὠνείδιζον
  choice: menghina
  rationale: Imperfek Yunani menggambarkan tindakan yang berlangsung dalam adegan tersebut. Dalam bahasa Indonesia, aspek duratif terutama disampaikan oleh konteks naratif; 'menghina' merupakan padanan modern dan mudah dipahami untuk mencela atau melontarkan hinaan.
- source_word: αὐτόν
  choice: Dia
  rationale: Objek langsungnya merujuk kepada Yesus. Huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada-Nya.
theological_decisions:
- issue: Apakah bentuk jamak dalam Matius perlu diselaraskan dengan kisah Lukas tentang salah seorang penjahat yang kemudian berbicara secara berbeda
  choice: Mempertahankan pernyataan Matius bahwa para perampok yang disalibkan bersama Yesus menghina Dia, tanpa pembatasan tambahan.
  alternative: Melunakkan bentuk jamak atau menyatakan bahwa hanya salah seorang dari mereka yang menghina Yesus.
  rationale: Teks Yunani memakai bentuk jamak οἱ λῃσταὶ dan verba jamak ὠνείδιζον. Terjemahan harus mempertahankan ketegangan antarkisah Injil dan tidak menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Demikian juga' menerjemahkan idiom Yunani secara alami; 'bahkan' mempertahankan penekanannya. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
