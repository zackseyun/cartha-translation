  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: id
  text: 'Jadi, ketika mereka sudah berkumpul, Pilatus berkata kepada mereka, “Siapa yang kalian inginkan kubebaskan: Yesus Barabas[a] atau Yesus yang disebut Mesias[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah hanya memuat “Barabas”, bukan “Yesus Barabas”.
    reason: textual_variant
  - marker: b
    text: Atau “Kristus”. Gelar Yunani Christos di sini diterjemahkan “Mesias” karena berfungsi sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: ketika mereka sudah berkumpul
  rationale: Partisip genitif absolut ini berfungsi secara temporal. Kata “sudah” menyatakan bahwa berkumpulnya orang banyak telah terjadi ketika Pilatus mengajukan pertanyaan.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan daya penghubung dan inferensial οὖν dalam alur narasi dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: Τίνα
  choice: Siapa
  rationale: Kata tanya ini menunjuk kepada pilihan di antara dua orang yang disebutkan; “siapa” merupakan padanan Indonesia yang alami.
- source_word: θέλετε
  choice: kalian inginkan
  rationale: θέλω di sini menyatakan keinginan atau pilihan. “Kalian” memperjelas bahwa Pilatus berbicara kepada kelompok yang telah berkumpul.
- source_word: ἀπολύσω
  choice: kubebaskan
  rationale: Dalam konteks tahanan dan tindakan penguasa, ἀπολύω berarti melepaskan atau membebaskan. Bentuk “kubebaskan” secara alami menyatakan Pilatus sebagai pelaku.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Yesus Barabas
  rationale: Teks SBLGNT mencantumkan Ἰησοῦν. Mempertahankan kedua nama menjaga kontras retoris antara dua orang yang sama-sama bernama Yesus.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Yesus yang disebut Mesias
  rationale: λεγόμενον diterjemahkan secara langsung sebagai “yang disebut”, tanpa menambahkan nada meremehkan. χριστόν berfungsi sebagai gelar dan karena itu diterjemahkan “Mesias”.
theological_decisions:
- issue: Penerjemahan χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa “yang disebut χριστός”, kata itu jelas berfungsi sebagai gelar. “Mesias” menerjemahkan makna gelar tersebut, sedangkan alternatif “Kristus” dicatat agar pembaca mengenali padanan tradisionalnya.
- issue: Pencantuman nama Yesus sebelum Barabas
  choice: Dicantumkan dalam teks utama sebagai “Yesus Barabas”
  alternative: Barabas
  rationale: Teks sumber SBLGNT yang diberikan memuat Ἰησοῦν sebelum Βαραββᾶν. Varian naskah yang tidak memuat “Yesus” dijaga dalam catatan kaki tanpa menghapus bacaan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa sapaan Pilatus berbentuk jamak; susunan kalimat tetap dekat dengan struktur dan kontras teks Yunani tanpa terasa kaku.
