  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: id
  text: Kira-kira pada jam kesembilan, Yesus berseru dengan suara nyaring[a], kata-Nya, “Eli, Eli, lema sabakhtani?” Artinya, “Allah-Ku, Allah-Ku, mengapa Engkau meninggalkan Aku[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata-kata ini menggemakan Mazmur 22:1.
    reason: cross_reference
  - marker: b
    text: 'Atau: “mengapa Engkau telah meninggalkan Aku?” Kata kerja Yunani berbentuk aoristus; bentuk utama dalam bahasa Indonesia tidak mempersempit hubungan tindakan itu dengan keadaan saat Yesus berseru.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Kira-kira pada jam kesembilan
  rationale: περί dengan akusatif waktu menyatakan waktu perkiraan. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan secara tersendiri. Ungkapan ini mempertahankan sistem penghitungan waktu dalam teks sumber.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: berseru dengan suara nyaring
  rationale: Kata kerja ini menyatakan seruan keras, sedangkan frasa datif menegaskan cara atau kekuatan suara. 'Bersuara nyaring' alami, khidmat, dan mempertahankan penekanan konkret bahasa Yunani.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini memperkenalkan isi seruan. 'Kata-Nya' merupakan konstruksi naratif Indonesia yang alami dan tetap menunjukkan bahwa kata-kata berikut adalah ucapan Yesus.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lema sabakhtani?
  rationale: Matius mempertahankan bunyi seruan Semitik lalu memberikan artinya. Bentuk transliterasi dipertahankan agar susunan naratif dan kaitannya dengan salah paham para saksi dalam konteks berikutnya tidak hilang.
- source_word: τοῦτ’ ἔστιν
  choice: Artinya
  rationale: Formula ini memperkenalkan terjemahan atau penjelasan. 'Artinya' ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: Θεέ μου θεέ μου
  choice: Allah-Ku, Allah-Ku
  rationale: Pengulangan vokatif dipertahankan secara langsung serta menjaga gema Mazmur 22:1.
- source_word: ἱνατί
  choice: mengapa
  rationale: Padanan langsung dan alami bagi kata tanya yang menanyakan alasan.
- source_word: ἐγκατέλιπες
  choice: Engkau meninggalkan Aku
  rationale: Aoristus Yunani menyajikan tindakan itu secara utuh. Bahasa Indonesia tidak mewajibkan pembedaan antara simple past dan present perfect; bentuk tanpa penanda waktu ini alami dan sengaja tidak mempersempit nuansa menjadi semata-mata tindakan lampau atau keadaan kini.
theological_decisions:
- issue: Hubungan seruan Yesus dengan Mazmur 22:1
  choice: Menerjemahkannya sebagai seruan nyata dengan mempertahankan kata-kata dan gema mazmurnya tanpa menjelaskan ketegangan teologis di dalam teks utama.
  alternative: Melunakkan arti ditinggalkan atau menjadikannya semata-mata penanda kutipan Mazmur 22.
  rationale: Teks Yunani menyampaikan seruan dan artinya tanpa kualifikasi penafsiran. Terjemahan seharusnya tidak menyangkal daya pengalaman seruan itu ataupun memaksakan penjelasan doktrinal tertentu.
- issue: Pemertahanan seruan Semitik
  choice: Mempertahankan transliterasi seruan Semitik, kemudian menyajikan artinya dalam bahasa Indonesia.
  alternative: Hanya memberikan terjemahan bahasa Indonesianya.
  rationale: Matius sendiri mempertahankan kedua bentuk tersebut. Mengikuti bentuk sumber menjaga detail naratif dan kaitannya dengan penyebutan Elia dalam konteks selanjutnya.
- issue: Aspek ἐγκατέλιπες
  choice: Menggunakan bentuk Indonesia netral 'meninggalkan Aku' dan mencatat kemungkinan nuansa aspek dalam catatan kaki.
  alternative: Menambahkan 'telah' untuk menonjolkan hasil yang masih dirasakan atau 'dahulu' untuk menonjolkan masa lampau.
  rationale: Aoristus dapat dipahami sebagai tindakan lampau secara utuh, tetapi bahasa Indonesia yang alami dapat membiarkan hubungan tindakan itu dengan keadaan saat seruan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Suara nyaring' dipilih daripada ungkapan yang lebih percakapan. Sapaan ilahi memakai huruf kapital sesuai kebiasaan ejaan keagamaan Indonesia. 'Jam kesembilan' dipertahankan sebagai ungkapan historis teks, tanpa konversi interpretatif ke sekitar pukul tiga sore.
