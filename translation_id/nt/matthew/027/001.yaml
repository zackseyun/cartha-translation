  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: id
  text: Ketika pagi tiba, semua imam kepala dan para tua-tua bangsa berunding melawan Yesus dengan maksud membunuh-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Ketika pagi tiba
  rationale: Konstruksi genitif absolut menandai peralihan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna temporal; δέ cukup tercermin dalam peralihan kalimat tanpa harus diterjemahkan tersendiri.
- source_word: συμβούλιον ἔλαβον
  choice: bermufakat
  rationale: Idiom ini menunjuk pada tindakan berunding atau mengambil keputusan bersama. “Bermufakat” mempertahankan nuansa deliberatif dan formal tanpa menambahkan gagasan persekongkolan secara berlebihan.
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan penekanan bahwa seluruh kelompok pemimpin yang disebut turut serta.
- source_word: οἱ ἀρχιερεῖς
  choice: imam kepala
  rationale: Istilah Indonesia yang lazim untuk kelompok pemimpin keimaman di Yerusalem dan tidak menyiratkan adanya beberapa pemegang jabatan imam besar.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: tua-tua bangsa itu
  rationale: Mempertahankan sebutan resmi bagi para pemimpin masyarakat; “bangsa itu” secara alami merujuk pada umat yang telah dikenal dalam konteks.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: untuk melawan Yesus
  rationale: κατά dengan genitif dalam konteks ini menyatakan sikap bermusuhan, bukan sekadar pokok pembicaraan. “Melawan” mempertahankan daya adversatifnya.
- source_word: ὥστε
  choice: dengan maksud
  rationale: Bersama infinitif, kata ini dapat menyatakan hasil yang dimaksudkan atau tujuan. “Dengan maksud” menyampaikan orientasi tindakan para pemimpin tanpa mengunci konstruksi pada hasil yang telah tercapai.
- source_word: θανατῶσαι αὐτόν
  choice: membunuh Dia
  rationale: Secara langsung menyampaikan tindakan menyebabkan kematian. Konteks peradilan tersedia dari narasi, sedangkan “mengeksekusi” akan lebih mempersempit prosedur daripada yang dinyatakan kata Yunani.
theological_decisions:
- issue: Sifat tindakan para pemimpin terhadap Yesus
  choice: Menggambarkannya sebagai mufakat yang bermusuhan dan bertujuan menyebabkan kematian Yesus.
  alternative: Menerjemahkan secara lebih lemah sebagai “berunding tentang Yesus” atau lebih kuat sebagai “bersekongkol melawan Yesus”.
  rationale: κατὰ τοῦ Ἰησοῦ jelas menyatakan pertentangan dan θανατῶσαι αὐτόν menyatakan tujuan mematikan. “Bermufakat untuk melawan” menjaga bobot teks tanpa menambahkan nuansa komplotan rahasia yang tidak harus terkandung dalam idiom Yunani.
- issue: Hubungan ὥστε dengan infinitif
  choice: “dengan maksud”
  alternative: “sehingga” sebagai hasil atau “supaya” sebagai tujuan langsung.
  rationale: Konstruksi ini dapat berada pada spektrum hasil yang dimaksudkan dan tujuan. Pilihan tersebut mempertahankan unsur intensional tanpa menyatakan bahwa kematian itu sudah menjadi hasil pada saat perundingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Imam kepala” serta “tua-tua” dipertahankan sebagai istilah kelembagaan yang umum dalam terjemahan Alkitab; struktur kalimat dibuat lugas bagi pembaca umum.
