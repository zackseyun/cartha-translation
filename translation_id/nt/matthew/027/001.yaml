review_pass:
  verdict: revise
  source_fidelity: Draf menangkap urutan temporal, keterlibatan seluruh kelompok, permusuhan terhadap Yesus, dan tujuan mematikan. Namun, “bermufakat untuk melawan Yesus” menggeser συμβούλιον ἔλαβον dari tindakan berunding menjadi kesepakatan untuk melakukan perlawanan; selain itu, “tua-tua bangsa itu” kurang alami dalam bahasa Indonesia modern dan kata “itu” tidak diperlukan.
  naturalness: Kalimat draf dapat dipahami, tetapi “bermufakat untuk melawan” terdengar kurang idiomatis untuk musyawarah atau deliberasi dalam konteks ini. “Para tua-tua bangsa” mempertahankan sebutan kelembagaan sambil lebih lancar dalam register Alkitab Indonesia.
  terminology: “Imam kepala” tepat untuk οἱ ἀρχιερεῖς. “Para tua-tua bangsa” mempertahankan πρεσβύτεροι τοῦ λαοῦ tanpa menafsirkannya menjadi jabatan modern. “Membunuh-Nya” secara langsung mencerminkan θανατῶσαι αὐτόν tanpa menambahkan rincian prosedural seperti vonis atau eksekusi.
  issues:
  - severity: medium
    issue: “Bermufakat untuk melawan Yesus” menggeser makna tindakan deliberatif.
    rationale: συμβούλιον ἔλαβον berarti mereka mengambil nasihat/berunding atau mengadakan musyawarah. Frasa draf dapat terdengar seolah-olah inti tindakannya adalah menyetujui aksi perlawanan, bukan berunding secara bermusuhan mengenai Yesus.
  - severity: low
    issue: “Tua-tua bangsa itu” kurang alami dan “itu” tidak perlu.
    rationale: τοῦ λαοῦ berarti “bangsa/rakyat,” sedangkan artikel Yunani tidak menuntut demonstratif “itu.” Bentuk “para tua-tua bangsa” lebih idiomatis dan tetap mempertahankan gelar kelompok tersebut.
  revised_text: Ketika pagi tiba, semua imam kepala dan para tua-tua bangsa berunding melawan Yesus dengan maksud membunuh-Nya.
