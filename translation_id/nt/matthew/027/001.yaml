revisions:
- from: Ketika pagi tiba, semua imam kepala dan tua-tua bangsa itu bermufakat untuk melawan Yesus dengan maksud membunuh Dia.[a]
  to: Ketika pagi tiba, semua imam kepala dan para tua-tua bangsa berunding melawan Yesus dengan maksud membunuh-Nya.
  rationale: Revisi memakai “berunding” untuk mempertahankan arti deliberatif dari συμβούλιον ἔλαβον, sambil mempertahankan daya adversatif κατά melalui “melawan Yesus.” “Dengan maksud membunuh-Nya” menyampaikan orientasi tujuan dari ὥστε dengan infinitif dan arti langsung θανατῶσαι tanpa menambahkan prosedur hukum yang tidak dinyatakan secara eksplisit. Catatan kaki dihapus karena alternatif sebelumnya (“menjatuhkan hukuman mati”) lebih sempit secara prosedural daripada teks Yunani dan tidak diperlukan bagi terjemahan ini.
