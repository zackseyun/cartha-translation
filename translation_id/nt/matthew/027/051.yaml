id: MAT.27.51
reference: Matthew 27:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: id
  text: Dan lihatlah, tirai Bait Allah[a] terbelah menjadi dua, dari atas sampai ke bawah; bumi berguncang, dan batu-batu karang terbelah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tirai ruang suci” atau “tirai tempat kudus.” Kata Yunani καταπέτασμα dapat merujuk pada tirai bagian dalam Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian secara mendadak dan memberi penekanan dramatis; bentuk ini tetap wajar dalam narasi Indonesia yang khidmat.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: tirai ruang suci
  rationale: καταπέτασμα menunjuk pada tirai di dalam ναός, sedangkan ναός di sini lebih khusus berarti ruang suci atau tempat kudus, bukan seluruh kompleks Bait Allah. Pilihan ini jelas bagi pembaca modern tanpa menambahkan penafsiran simbolis.
- source_word: ἐσχίσθη ... εἰς δύο
  choice: terbelah dua
  rationale: Mengungkapkan pasif peristiwa secara alami dalam bahasa Indonesia, tanpa menyebutkan pelaku yang tidak dinyatakan dalam teks Yunani.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: dari atas sampai ke bawah
  rationale: Padanan arah yang alami dan mempertahankan penekanan naratif bahwa pembelahan berlangsung dari atas ke bawah.
- source_word: ἡ γῆ ἐσείσθη
  choice: bumi berguncang
  rationale: γῆ dapat berarti bumi, tanah, atau negeri. Dalam rangkaian tanda yang menyertai kematian Yesus, 'bumi' mempertahankan cakupan luas yang mungkin dimaksud, sedangkan 'berguncang' alami untuk peristiwa gempa.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: batu-batu terbelah
  rationale: πέτραι mengacu pada batu-batu atau massa batuan; 'batu-batu' merupakan padanan Indonesia yang langsung, dan 'terbelah' mempertahankan pengulangan verba σχίζω dalam bahasa sumber.
theological_decisions:
- issue: Makna tanda berupa terbelahnya tirai ruang suci
  choice: Menerjemahkan kejadian itu secara deskriptif tanpa menjelaskan makna teologisnya dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai terbukanya jalan kepada Allah atau sebagai penghakiman atas tata ibadah Bait Allah.
  rationale: Ayat ini melaporkan peristiwa dan tanda-tanda yang menyertainya, tetapi tidak menerangkan sendiri makna simbolisnya. Terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut dengan memasukkan tafsiran.
- issue: Pelaku yang membelah tirai dan batu-batu
  choice: Memakai bentuk pasif/intransitif 'terbelah' tanpa menyebut pelaku.
  alternative: Menambahkan bahwa Allah membelah tirai dan batu-batu.
  rationale: Bentuk pasif Yunani memungkinkan pembaca memahami tindakan ilahi, tetapi pelakunya tidak disebutkan secara eksplisit. Ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. 'Lihatlah' mempertahankan daya seru ἰδοὺ. Kalimat dipecah setelah tanda pertama agar alurnya alami, sementara pengulangan 'terbelah' dipertahankan untuk mencerminkan penggunaan verba Yunani yang sama bagi tirai dan batu-batu.
