  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: id
  text: Dan kuburan-kuburan dibuka, dan banyak tubuh orang-orang kudus yang telah tertidur[a] dibangkitkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tertidur” adalah ungkapan yang lazim untuk “meninggal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung umum ini mempertahankan koordinasi dalam rangkaian narasi tanpa menambahkan makna waktu yang tidak dinyatakan.
- source_word: τὰ μνημεῖα
  choice: kuburan-kuburan
  rationale: Dalam konteks ini μνημεῖον menunjuk pada tempat penguburan. Bentuk ulang menyampaikan jamak secara jelas dan alami dalam bahasa Indonesia.
- source_word: ἀνεῴχθησαν
  choice: terbuka
  rationale: Bentuk pasif aoris menunjukkan bahwa kuburan-kuburan dikenai tindakan. 'Terbuka' menyampaikan keadaan akibat tindakan itu tanpa menambahkan mekanisme penyebabnya.
- source_word: πολλὰ σώματα
  choice: banyak tubuh
  rationale: σῶμα berarti 'tubuh'; pilihan ini mempertahankan ungkapan netral teks dan menghindari kata 'mayat' yang lebih keras serta lebih interpretatif.
- source_word: τῶν κεκοιμημένων
  choice: yang telah tertidur
  rationale: Bentuk perfek mempertahankan keadaan yang dihasilkan oleh tindakan lampau, sedangkan 'tertidur' menjaga idiom umum untuk kematian.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Sebagai substantiva, ἅγιοι menunjuk kepada orang-orang yang kudus. Ungkapan ini lazim dalam bahasa Alkitab Indonesia dan tidak mempersempit identitas mereka melampaui teks.
- source_word: ἠγέρθησαν
  choice: dibangkitkan
  rationale: Bentuk pasif ἐγείρω di sini menyatakan bahwa mereka dibangkitkan. Pilihan ini alami dalam bahasa Indonesia dan tidak menentukan lebih jauh apakah peristiwa itu harus dikategorikan sebagai kebangkitan sementara atau kebangkitan dalam arti eskatologis penuh.
theological_decisions:
- issue: Sifat peristiwa yang dinyatakan oleh ἠγέρθησαν
  choice: dibangkitkan
  alternative: bangkit kembali; dihidupkan kembali
  rationale: '''Dibangkitkan'' mempertahankan bentuk pasif dan bahasa kebangkitan dalam teks tanpa menyelesaikan pertanyaan teologis tentang sifat tepat kebangkitan tersebut.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan koordinatif Yunani dipertahankan secara alami. Istilah 'orang-orang kudus' menjaga kesinambungan istilah Perjanjian Baru, dan idiom 'tertidur' dipertahankan dengan penjelasan singkat dalam catatan kaki.
