  terminology: “Tuan” tepat sebagai vokatif kepada Pilatus tanpa mengimpor makna ilahi. “Penyesat itu” menyampaikan πλάνος dan demonstratif yang berjarak. Kapitalisasi “Aku” dalam kutipan Yesus konsisten dengan konvensi Alkitab Indonesia dan tidak mengubah makna sumber.
