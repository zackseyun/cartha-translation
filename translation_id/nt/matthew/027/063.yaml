  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: id
  text: dengan berkata, “Tuan, kami teringat bahwa ketika masih hidup, penyesat itu berkata, ‘Setelah tiga hari Aku bangkit[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah tiga hari Aku akan bangkit,” atau, “Setelah tiga hari Aku akan dibangkitkan.” Dalam bahasa Yunani digunakan kata kerja berbentuk kini, yang secara harfiah dapat diterjemahkan “Aku bangkit” atau “Aku dibangkitkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisipel kini ini menghubungkan ujaran tersebut dengan tindakan pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksisnya.
- source_word: Κύριε
  choice: Tuan
  rationale: Sapaan hormat kepada Pilatus dalam konteks ini. ‘Tuan’ menyampaikan fungsi vokatif κύριος tanpa menyiratkan bahwa Pilatus dipanggil dengan gelar ilahi.
- source_word: ἐμνήσθημεν
  choice: kami teringat
  rationale: Aoristus dari μιμνῄσκομαι menyatakan bahwa ingatan itu muncul atau disadari; ‘kami teringat’ lebih dekat pada aspek tersebut dan alami dalam percakapan Indonesia.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: penyesat itu
  rationale: πλάνος menunjuk kepada orang yang menyesatkan atau memperdaya, sedangkan ἐκεῖνος memberi nuansa menjauhkan; susunan ‘penyesat itu’ mempertahankan keduanya secara alami.
- source_word: ἔτι ζῶν
  choice: ketika masih hidup
  rationale: Frasa adverbial-partisipial ini menunjukkan waktu perkataan tersebut sebelum kematian Yesus.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Setelah tiga hari
  rationale: μετά dengan akusatif secara langsung berarti ‘setelah’; terjemahan ini tidak menyelaraskannya secara diam-diam dengan ungkapan ‘pada hari ketiga’ di bagian lain.
- source_word: ἐγείρομαι
  choice: Aku bangkit
  rationale: Bentuk kini medio-pasif dapat dipahami secara intransitif (‘bangkit’) atau pasif (‘dibangkitkan’). Dalam kutipan nubuat, bentuk kini dramatis ‘Aku bangkit’ tetap wajar dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan pilihan pasif dan futur sebagai kemungkinan.
theological_decisions:
- issue: Cara menerjemahkan nubuat kebangkitan Yesus yang dikutip
  choice: Setelah tiga hari Aku bangkit
  alternative: Setelah tiga hari Aku akan bangkit / Aku akan dibangkitkan
  rationale: Bentuk Yunani ἐγείρομαι adalah bentuk kini medio-pasif. Teks utama mempertahankan bentuk kini dan memungkinkan nuansa intransitif, sementara catatan kaki mengakui pembacaan futur dan pasif tanpa menetapkan secara berlebihan siapa pelaku tersiratnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Tuan’ dipakai sebagai sapaan kepada Pilatus; ‘penyesat itu’ mempertahankan nada merendahkan dari para pembicara. Urutan ‘ketika masih hidup’ ditempatkan sebelum subjek kutipan demi kelancaran dan kejelasan dalam bahasa Indonesia.
