  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur Yunani: partisipel λέγοντες sebagai “dengan berkata,” sapaan hormat Κύριε sebagai “Tuan,” aoristus ἐμνήσθημεν sebagai “kami teringat,” daya merendahkan ἐκεῖνος ὁ πλάνος sebagai “penyesat itu,” serta χρονologi ἔτι ζῶν sebagai “ketika masih hidup.” “Setelah tiga hari” tepat untuk μετά dengan akusatif. “Aku bangkit” mempertahankan bentuk kini ἐγείρομαι tanpa memaksakan pembacaan pasif atau futur; alternatifnya dicatat dengan memadai.'
