  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: id
  text: Yesus tidak menjawabnya sepatah kata pun, sehingga gubernur itu sangat heran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Bentuk aoristus deponen ini secara wajar berarti ‘menjawab’ atau ‘memberi jawaban’; ‘menjawab’ langsung dan alami dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: -nya
  rationale: Pronomina datif ini menunjuk kepada orang yang tidak dijawab oleh Yesus, yakni gubernur/Pilatus dalam konteks dekat.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: sepatah kata pun tidak
  rationale: Ungkapan ini menegaskan bahwa Yesus tidak memberi jawaban sama sekali. ‘Sepatah kata pun tidak’ merupakan idiom Indonesia yang alami dan mempertahankan penekanan οὐδὲ ἕν.
- source_word: ὥστε
  choice: sehingga
  rationale: ὥστε memperkenalkan akibat; ‘sehingga’ menyampaikan hubungan konsekuensial itu dengan jelas.
- source_word: θαυμάζειν
  choice: sangat heran
  rationale: Infinitif kini setelah ὥστε menyatakan reaksi yang timbul sebagai akibat. ‘Heran’ alami dalam bahasa Indonesia dan tidak menambahkan nuansa yang tidak ada dalam teks.
- source_word: ἡγεμόνα
  choice: gubernur
  rationale: Dalam konteks pemerintahan provinsi Romawi, ἡγεμών merujuk kepada gubernur, yaitu Pilatus.
- source_word: λίαν
  choice: sangat
  rationale: Kata ini memperkuat tingkat keheranan; ‘sangat’ adalah padanan modern, ringkas, dan wajar.
