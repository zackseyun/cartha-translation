  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ‘Yesus’ dipakai untuk memperjelas subjek tersirat dalam verba Yunani berdasarkan konteks ayat, sedangkan pengulangan ‘sama sekali ... sepatah kata pun tidak’ mempertahankan penekanan kuat teks sumber.
