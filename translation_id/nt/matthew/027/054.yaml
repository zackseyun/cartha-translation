    issue: Alternatif catatan kaki memakai frasa “seorang anak ilah.”
    rationale: Kata ‘ilah’ memang dapat dipakai dalam ragam teologis, tetapi ‘seorang anak ilah’ tidak idiomatis dalam bahasa Indonesia modern. Frasa itu juga tidak perlu untuk menandai indefinitas Yunani. “Seorang anak Allah” adalah alternatif yang jauh lebih alami dan secara langsung mempertahankan leksikon θεοῦ, tanpa mengubah teks utama yang bertitular.
