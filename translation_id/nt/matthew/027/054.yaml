id: MAT.27.54
reference: Matthew 27:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: id
  text: Ketika perwira itu dan orang-orang yang bersamanya, yang sedang menjaga Yesus, melihat gempa bumi serta segala yang telah terjadi, mereka menjadi sangat takut dan berkata, “Sungguh, Dia ini adalah Anak Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, Dia ini adalah seorang anak Allah.” Frasa Yunani tidak memakai artikel. Dalam konteks Injil Matius, teks utama memahaminya sebagai gelar “Anak Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: perwira
  rationale: Dalam konteks pasukan Romawi, istilah ini menunjuk kepada seorang centurion. ‘Perwira’ alami dan mudah dipahami dalam bahasa Indonesia; jabatan khususnya tidak perlu dijabarkan dalam ayat ini.
- source_word: τηροῦντες
  choice: yang sedang menjaga
  rationale: Konteks tempat pelaksanaan hukuman menunjukkan tindakan mengawal atau menjaga Yesus, bukan sekadar melihat-Nya.
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoristus diberi fungsi temporal agar hubungan antara apa yang mereka lihat dan ketakutan mereka tersampaikan secara alami.
- source_word: σεισμόν
  choice: gempa bumi
  rationale: Ini merupakan arti biasa σεισμός dan sesuai dengan konteks narasi.
- source_word: τὰ γενόμενα
  choice: segala yang telah terjadi
  rationale: Ungkapan ini mencakup berbagai kejadian yang menyertai kematian Yesus, bukan hanya gempa bumi.
- source_word: ἐφοβήθησαν σφόδρα
  choice: menjadi sangat takut
  rationale: Menyampaikan kekuatan verba dan penegas σφόδρα dengan ungkapan Indonesia yang wajar.
- source_word: Ἀληθῶς
  choice: Sungguh
  rationale: Mempertahankan penegasan khidmat tanpa menentukan lebih jauh kadar pemahaman teologis para penutur.
- source_word: θεοῦ υἱὸς
  choice: Anak Allah
  rationale: Walaupun frasa Yunani tidak memakai artikel, konteks kristologis Injil Matius mendukung pemahaman gelar yang definit. Bahasa Indonesia juga tidak memakai artikel definit seperti bahasa Inggris.
- source_word: οὗτος
  choice: Dia ini
  rationale: Menjaga daya tunjuk langsung οὗτος dengan bentuk yang alami dalam seruan bahasa Indonesia.
theological_decisions:
- issue: Makna θεοῦ υἱὸς dalam pengakuan para penjaga
  choice: Anak Allah
  alternative: seorang anak ilah/dewa
  rationale: Ketiadaan artikel dalam konstruksi predikatif Yunani tidak dengan sendirinya menjadikan frasa ini indefinit. Dalam konteks Injil Matius, ‘Anak Allah’ paling tepat mencerminkan gelar kristologisnya. Namun, kemungkinan bahwa ucapan tokoh Romawi itu dapat dipahami secara indefinit tetap dicatat agar ketegangan penafsirannya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kelompok ‘orang-orang yang bersamanya’ sebagai pihak yang sedang menjaga Yesus. Satu catatan kaki dipakai untuk mempertahankan ambiguitas yang nyata pada frasa θεοῦ υἱὸς; tidak ada penanda catatan lain karena varian susunan bahasa Inggris tidak mewakili alternatif tekstual atau makna yang perlu dibawa ke dalam terjemahan Indonesia.
