  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: id
  text: Setelah menyalibkan Yesus, mereka membagi-bagikan pakaian-Nya dengan membuang undi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Setelah menyalibkan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan narasi. Dalam bahasa Indonesia, hubungan tersebut sudah tersampaikan secara alami melalui susunan kalimat; penambahan 'dan' terasa kurang luwes.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina ini merujuk kepada Yesus. Penyebutan nama menghindari rangkaian bentuk 'Dia/-Nya' yang terasa janggal dan membuat kalimat lebih jelas dalam bahasa Indonesia.
- source_word: διεμερίσαντο
  choice: mereka membagi-bagikan
  rationale: Verba ini berarti membagi atau membagikan di antara beberapa orang. Reduplikasi 'membagi-bagikan' secara alami menyampaikan pembagian pakaian itu kepada para pelaku.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: pakaian-Nya
  rationale: ἱμάτια menunjuk secara umum pada pakaian. 'Pakaian-Nya' bermartabat, mudah dipahami, dan tidak mempersempit makna menjadi hanya pakaian luar.
- source_word: βάλλοντες κλῆρον
  choice: dengan membuang undi
  rationale: Frasa partisipial ini menjelaskan cara pakaian dibagi. 'Membuang undi' merupakan ungkapan Indonesia yang lazim untuk penentuan melalui undian dan mempertahankan bentuk tunggal kolektif κλῆρον secara idiomatis.
theological_decisions:
- issue: Hubungan frasa partisipial βάλλοντες κλῆρον dengan verba utama διεμερίσαντο
  choice: 'Frasa itu diterjemahkan sebagai cara pembagian dilakukan: ''membagi-bagikan pakaian-Nya dengan membuang undi.'''
  alternative: '''membagi-bagikan pakaian-Nya sambil membuang undi'''
  rationale: Partisip tersebut secara wajar menerangkan sarana atau cara pembagian. Kata 'dengan' memperjelas hubungan sintaksis tanpa menambahkan muatan teologis.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Kapitalisasi pada akhiran pronominal '-Nya' mengikuti kebiasaan penulisan Kristen Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena hubungan temporal dan instrumental dapat disampaikan secara alami tanpa menghilangkan ambiguitas penting.
