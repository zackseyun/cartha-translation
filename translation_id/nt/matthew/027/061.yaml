  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: id
  text: Maria Magdalena dan Maria yang lain berada di sana, duduk berhadapan dengan makam itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: berada di sana
  rationale: Walaupun verba Yunani berbentuk tunggal, verba itu mendahului dua subjek yang dikoordinasikan. Bahasa Indonesia tidak menandai jumlah pada verba, dan 'berada di sana' menyampaikan kehadiran mereka secara alami.
- source_word: δὲ
  choice: dan
  rationale: δέ merupakan penghubung ringan dalam alur narasi, bukan pertentangan kuat. 'Dan' mempertahankan kesinambungan naratif tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: ἡ ἄλλη Μαρία
  choice: Maria yang lain
  rationale: ἄλλη membedakan Maria ini dari Maria Magdalena yang baru disebutkan.
- source_word: καθήμεναι
  choice: duduk
  rationale: Partisipel kini ini menerangkan posisi kedua perempuan tersebut; 'duduk' alami dan mempertahankan gambaran keadaan yang sedang berlangsung.
- source_word: ἀπέναντι
  choice: berhadapan dengan
  rationale: Ungkapan ini menyatakan posisi di seberang atau menghadap makam. 'Berhadapan dengan' jelas dan alami tanpa memastikan jarak tertentu.
- source_word: τοῦ τάφου
  choice: makam itu
  rationale: τάφος menunjuk tempat penguburan Yesus yang telah disebutkan dalam konteks. 'Makam' tepat dalam bahasa Indonesia, sedangkan 'itu' mencerminkan artikel definit Yunani dan rujukan kontekstual.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan kedua tokoh, keberadaan mereka di tempat itu, postur mereka, dan posisi mereka terhadap makam. Tidak diperlukan catatan kaki.
