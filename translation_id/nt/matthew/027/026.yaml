id: MAT.27.26
reference: Matthew 27:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: id
  text: Kemudian ia melepaskan Barabas kepada mereka, tetapi sesudah mencambuk[a] Yesus, ia menyerahkan-Nya untuk disalibkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyesah.” Kata kerja Yunani ini mengacu pada hukuman Romawi berupa pencambukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa secara wajar dalam narasi tanpa menambahkan hubungan sebab-akibat.
- source_word: ἀπέλυσεν
  choice: membebaskan
  rationale: Dalam konteks pengadilan, kata ini berarti melepaskan seorang tahanan; “membebaskan” jelas dan alami dalam bahasa Indonesia.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Datif ini dapat menunjukkan pihak yang menerima atau memperoleh manfaat dari pembebasan tersebut. “Bagi mereka” mempertahankan nuansa itu secara alami.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: δὲ
  choice: tetapi
  rationale: Menegaskan kontras antara pembebasan Barabas dan perlakuan terhadap Yesus.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: φραγελλώσας
  choice: setelah mencambuk
  rationale: Partisip aoris ini paling wajar dipahami sebagai tindakan yang mendahului tindakan utama. “Mencambuk” mudah dipahami, sementara catatan kaki menjelaskan konteks hukuman Romawinya.
- source_word: παρέδωκεν
  choice: ia menyerahkan-Nya
  rationale: Mengungkapkan tindakan menyerahkan Yesus kepada pihak yang akan melaksanakan hukuman, tanpa menentukan pihak tersebut lebih jauh daripada teks sumber.
- source_word: ἵνα σταυρωθῇ
  choice: untuk disalibkan
  rationale: Menyampaikan tujuan atau hasil yang dimaksud dengan ringkas dan alami serta mempertahankan bentuk pasif teks Yunani.
theological_decisions:
- issue: Urutan dan pelaku tindakan dalam penghukuman Yesus
  choice: Yesus dicambuk terlebih dahulu, kemudian diserahkan untuk disalibkan.
  alternative: Yesus diserahkan terlebih dahulu, kemudian dicambuk.
  rationale: Partisip aoris φραγελλώσας paling alami menunjukkan tindakan yang terjadi sebelum verba utama παρέδωκεν. Terjemahan mempertahankan urutan dalam teks tanpa menambahkan penjelasan mengenai prosedur Romawi.
- issue: Identitas subjek tersirat
  choice: Mempertahankan kata ganti “ia” sesuai subjek yang sudah jelas dari konteks sebelumnya.
  alternative: Menyebut nama Pilatus secara eksplisit.
  rationale: Teks Yunani tidak menyebut nama Pilatus dalam ayat ini; mempertahankan subjek tersirat menghindari penambahan yang tidak diperlukan, sementara konteks tetap membuat acuannya jelas.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Mencambuk” dipilih untuk keterpahaman umum; istilah “menyesah” dicantumkan sebagai alternatif. Penanda catatan kaki ditempatkan langsung pada kata yang dijelaskannya.
