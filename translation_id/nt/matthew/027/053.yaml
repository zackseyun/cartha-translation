  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: id
  text: Dan sesudah kebangkitan-Nya,[a] mereka keluar dari makam-makam, lalu masuk ke kota suci[b] dan menampakkan diri kepada banyak orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani menempatkan frasa “sesudah kebangkitan-Nya” sesudah “dari makam-makam” dan sebelum “mereka masuk”. Susunan kalimat ini menyatakan bahwa mereka keluar dari makam-makam sesudah kebangkitan-Nya.
    reason: alternative_reading
  - marker: b
    text: “Kota suci” mengacu pada Yerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: setelah keluar
  rationale: Partisip aoris ini dipahami bertaraf waktu dan mendahului verba utama; bentuk ini mempertahankan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: μνημείων
  choice: makam-makam
  rationale: μνημεῖον menunjuk pada tempat penguburan; bentuk jamak dipertahankan sesuai teks dan konteks makam-makam yang terbuka pada ayat sebelumnya.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: sesudah kebangkitan-Nya
  rationale: μετά dengan akusatif menyatakan waktu sesudah, sedangkan ἔγερσις di sini menunjuk pada kebangkitan Yesus. Huruf kapital pada pronomina mengikuti kebiasaan hormat dalam bahasa Indonesia tanpa menambahkan nama yang tidak tersurat.
- source_word: εἰσῆλθον
  choice: mereka masuk
  rationale: Padanan naratif yang langsung dan alami untuk verba aoris ini.
- source_word: τὴν ἁγίαν πόλιν
  choice: kota suci
  rationale: Mempertahankan ungkapan khas Alkitab yang dalam konteks ini mengacu pada Yerusalem tanpa memasukkan nama itu ke dalam teks utama.
- source_word: ἐνεφανίσθησαν
  choice: menampakkan diri
  rationale: Bentuk ini menyampaikan makna menjadi terlihat atau hadir di hadapan orang lain dengan alami dalam narasi Indonesia.
- source_word: πολλοῖς
  choice: kepada banyak orang
  rationale: Kata 'orang' ditambahkan secara wajar untuk membuat adjektiva substantival jamak ini jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan frasa partisipial 'keluar dari makam-makam' dengan keterangan waktu 'sesudah kebangkitan-Nya'
  choice: 'Teks utama menempatkan ''sesudah kebangkitan-Nya'' di dalam klausa partisipial sebelum verba utama: ''setelah keluar dari makam-makam sesudah kebangkitan-Nya, mereka masuk ...''.'
  alternative: 'Kalimat dapat dilancarkan menjadi: ''Sesudah kebangkitan-Nya, mereka keluar dari makam-makam, lalu masuk ...''.'
  rationale: Urutan Yunani menempatkan μετὰ τὴν ἔγερσιν αὐτοῦ sesudah ἐκ τῶν μνημείων dan sebelum verba utama. Terjemahan mempertahankan susunan dan ketegangan waktunya tanpa menyelaraskan peristiwa secara teologis.
- issue: Rujukan kata ganti αὐτοῦ
  choice: Dipahami mengacu kepada Yesus dan diterjemahkan 'kebangkitan-Nya'.
  alternative: Dapat dibuat eksplisit sebagai 'kebangkitan Yesus'.
  rationale: Konteks menjadikan Yesus sebagai rujukan yang jelas, tetapi teks Yunani sendiri memakai kata ganti; terjemahan mempertahankan bentuk pronominal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan utama sengaja agak rapat untuk mempertahankan letak keterangan waktu serta ambiguitas sintaksis Yunani; catatan kaki menyediakan bentuk yang lebih lancar.
