  source_fidelity: 'Teks utama pada dasarnya setia: πέποιθεν dipertahankan sebagai tindakan lampau dengan keadaan yang berlanjut, νῦν sebagai “sekarang,” θέλει sebagai “menghendaki,” dan gelar “Anak Allah” sesuai konteks Matius. Namun, ῥυσάσθω secara khusus adalah seruan agar Allah melepaskan atau menyelamatkan dia dari bahaya; “melepaskan” lebih dekat dengan daya kata ini daripada “menyelamatkan,” yang dalam bahasa Indonesia dapat terdengar lebih luas atau soteriologis.'
