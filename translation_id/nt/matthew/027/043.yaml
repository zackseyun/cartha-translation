  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: id
  text: Ia telah percaya kepada Allah[a]; biarlah Allah melepaskan dia sekarang, jika Allah menghendaki dia, sebab ia berkata[b], “Aku adalah Anak Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menaruh kepercayaan kepada Allah.” Bentuk perfektum Yunaninya menyiratkan kepercayaan yang telah ada dan tetap berlangsung.
    reason: alternative_reading
  - marker: b
    text: Ejekan ini menggemakan Mazmur 22:9 (22:8 dalam sejumlah penomoran), yang menggambarkan penderitaan orang benar. Karena gema itu, “jika Allah menghendaki dia” juga dapat dipahami sebagai “jika Allah berkenan kepadanya.”
    reason: cross_reference_and_alternative_reading
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Ia telah menaruh kepercayaan kepada Allah
  rationale: Bentuk perfektum menyatakan keadaan percaya yang menetap sebagai hasil tindakan sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap memperlihatkan aspek perfektum.
- source_word: ῥυσάσθω
  choice: biarlah Allah menyelamatkan dia
  rationale: Imperatif aoris dari ῥύομαι berarti melepaskan atau menyelamatkan dari bahaya. Subjek yang tersirat dibuat eksplisit sebagai Allah agar rujukannya jelas dalam bahasa Indonesia.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan penekanan pada tindakan segera dalam ejekan itu.
- source_word: εἰ θέλει αὐτόν
  choice: jika Allah menghendaki dia
  rationale: θέλω secara langsung berarti menghendaki, menginginkan, atau berkenan. Nama Allah diulangi untuk menghindari rangkaian pronomina yang rancu, sementara kemungkinan nuansa 'berkenan kepadanya' dicatat dalam catatan kaki.
- source_word: εἶπεν γὰρ
  choice: sebab ia berkata
  rationale: Aoris εἶπεν diterjemahkan sebagai tindakan lampau sederhana dan γάρ menyatakan alasan bagi tantangan para pengejek.
- source_word: Θεοῦ εἰμι υἱός
  choice: Aku adalah Anak Allah
  rationale: Walaupun υἱός tidak berartikel, susunan predikatif dan konteks Injil Matius mendukung makna kualitatif atau gelar, bukan 'seorang anak Allah'.
theological_decisions:
- issue: Makna ungkapan kristologis Θεοῦ εἰμι υἱός
  choice: Aku adalah Anak Allah
  alternative: Aku adalah anak Allah; Aku adalah Putra Allah
  rationale: Dalam konteks narasi Matius, ungkapan ini mengacu pada gelar kristologis yang sudah dikenal. 'Anak Allah' mempertahankan daya gelarnya tanpa menambahkan rumusan teologis di luar teks.
- issue: Nuansa θέλει αὐτόν dalam gema Mazmur 22:9 (penomoran Ibrani; 22:8 dalam sejumlah tradisi)
  choice: jika Allah menghendaki dia
  alternative: jika Allah berkenan kepadanya
  rationale: Arti langsung θέλω dipertahankan dalam teks utama. Nuansa perkenanan yang timbul dari gema mazmur dicantumkan sebagai alternatif agar ambiguitas dan kaitan antarteks tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Allah' menghindari ketidakjelasan rujukan pronomina. 'Ia' digunakan untuk narasi tentang Yesus, sedangkan kutipan langsung memakai 'Aku'.
