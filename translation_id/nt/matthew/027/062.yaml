  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: id
  text: Pada hari berikutnya[a], yaitu sesudah hari Persiapan, imam-imam kepala dan orang-orang Farisi berkumpul menghadap Pilatus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang adalah hari sesudah Persiapan.” Istilah Yunani ini dapat menunjuk pada hari persiapan sebelum hari Sabat; menerjemahkannya sebagai “Jumat” akan lebih interpretatif daripada yang dituntut oleh teks sumber.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Pada hari berikutnya
  rationale: Ungkapan ini menandai kelanjutan waktu. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan dengan kata pembuka tersendiri dalam bahasa Indonesia.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: yaitu sesudah hari Persiapan
  rationale: ἥτις memperkenalkan keterangan penjelas. Bentuk 'yaitu' menyampaikan fungsi tersebut secara alami, sedangkan 'sesudah hari Persiapan' mempertahankan ungkapan kalender dalam sumber.
- source_word: παρασκευήν
  choice: hari Persiapan
  rationale: Dalam konteks Yahudi, istilah ini lazim menunjuk pada hari persiapan sebelum hari Sabat. 'Hari Persiapan' tetap jelas tanpa mempersempitnya secara interpretatif menjadi 'Jumat'.
- source_word: συνήχθησαν
  choice: berkumpul
  rationale: Bentuk pasif Yunani ini berfungsi secara intransitif dengan arti berkumpul atau datang bersama-sama. 'Berkumpul' ringkas dan wajar.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah jamak ini menunjuk pada para pemimpin kalangan imam, bukan pada beberapa orang yang sekaligus memegang satu jabatan imam besar.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Ini adalah bentuk baku dan mudah dipahami untuk nama kelompok Yahudi tersebut.
- source_word: πρὸς Πιλᾶτον
  choice: menghadap Pilatus
  rationale: πρός dengan nama orang setelah verba berkumpul dapat menyatakan gerak menuju atau tampil di hadapan orang itu. 'Menghadap Pilatus' alami dalam konteks pertemuan dengan penguasa.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
