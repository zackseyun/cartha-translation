revisions:
- from: Dan seluruh rakyat itu menjawab[a], “Biarlah darah-Nya ditanggung oleh kami dan anak-anak kami.”
  to: Dan seluruh orang banyak itu menjawab[a], “Biarlah darah-Nya ditanggungkan kepada kami dan kepada anak-anak kami.”
  rationale: The revision replaces the potentially nation-wide "rakyat" with the scene-specific collective "orang banyak," while preserving πᾶς ὁ λαός as a comprehensive response by those assembled. It also makes the two parallel objects of the imprecatory statement explicit in idiomatic Indonesian, without expanding the text into a doctrinal claim.
