    reason: cultural_note
  revision_rationale: The revision replaces the potentially nation-wide "rakyat" with the scene-specific collective "orang banyak," while preserving πᾶς ὁ λαός as a comprehensive response by those assembled. It also makes the two parallel objects of the imprecatory statement explicit in idiomatic Indonesian, without expanding the text into a doctrinal claim.
