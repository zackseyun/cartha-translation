source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: id
  text: Dan seluruh orang banyak itu menjawab[a], “Biarlah darah-Nya ditanggungkan kepada kami dan kepada anak-anak kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah orang banyak yang berkumpul dan berbicara dalam adegan ini; kata-kata ini tidak boleh dipahami sebagai penetapan kesalahan abadi atas semua orang Yahudi di setiap generasi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menjawab
  rationale: Partisip aoris pasif dari ἀποκρίνομαι bersama εἶπεν berfungsi secara idiomatis untuk memperkenalkan tanggapan; dalam bahasa Indonesia cukup diterjemahkan alami sebagai “menjawab”.
- source_word: πᾶς ὁ λαὸς
  choice: seluruh rakyat itu
  rationale: πᾶς dengan nomina tunggal berartikel menyatakan keseluruhan secara kolektif. “Seluruh rakyat itu” mempertahankan arti dasar λαός sebagai rakyat dan, melalui “itu”, menunjuk pada kelompok yang hadir dalam adegan.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: darah-Nya
  rationale: Ungkapan ini secara harfiah berarti “darah-Nya” dan dalam konteks pengadilan menyiratkan tanggung jawab atas kematian-Nya. Implikasi tersebut dipertahankan tanpa diuraikan secara berlebihan.
- source_word: ἐφ’ ἡμᾶς
  choice: ditanggung oleh kami
  rationale: Bahasa Yunani tidak menyertakan verba. “Biarlah ... ditanggung oleh kami” mengungkapkan daya voluntatif atau imprekasi sekaligus membuat idiom tanggung jawab darah dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: dan anak-anak kami
  rationale: τέκνα paling wajar berarti “anak-anak”, bukan cakupan lebih luas “keturunan”. Preposisi yang berlaku dari konstruksi sebelumnya tetap dipahami pada unsur sejajar ini.
theological_decisions:
- issue: Kemungkinan penafsiran anti-Yahudi terhadap πᾶς ὁ λαὸς
  choice: Menerjemahkannya sebagai pernyataan kolektif kelompok yang berkumpul dalam adegan, “seluruh rakyat itu”, tanpa memperluasnya menjadi klaim etnis atau lintas generasi.
  alternative: seluruh orang banyak itu
  rationale: Teks melaporkan jawaban kolektif orang-orang yang hadir. Terjemahan mempertahankan keluasan ungkapan Yunani tetapi tidak memasukkan gagasan bahwa semua orang Yahudi sepanjang masa memikul kesalahan abadi.
- issue: Makna ungkapan darah berada “atas” seseorang
  choice: Memakai “Biarlah darah-Nya ditanggung oleh kami” untuk menyampaikan penerimaan tanggung jawab atas kematian Yesus.
  alternative: Biarlah darah-Nya tertanggung atas kami
  rationale: Ungkapan Yunani bersifat eliptis dan idiomatis. Bentuk yang dipilih menyampaikan daya ucapan itu dalam bahasa Indonesia modern tanpa mengubahnya menjadi penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Seluruh rakyat itu” dipilih untuk mempertahankan λαός serta membatasi rujukannya secara deiktis pada kelompok dalam adegan. Ungkapan “ditanggung oleh” menghindari bentuk harfiah yang kaku, tetapi tetap menjaga gambaran darah dan bobot tanggung jawabnya.
