  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: id
  text: Sesudah mengolok-olok Dia, mereka menanggalkan mantel[a] itu dari-Nya, memakaikan kembali pakaian-Nya kepada-Nya, lalu membawa Dia pergi untuk disalibkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah.” Kata Yunani χλαμύς berarti mantel atau pakaian luar, sering kali yang dikenakan oleh prajurit atau pejabat; dalam konteks ini, pakaian tersebut dikenakan kepada Yesus untuk mengejek-Nya sebagai raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: mengolok-olok
  rationale: Kata kerja ini menyatakan ejekan yang menghina dan kejam. “Mengolok-olok” alami dalam bahasa Indonesia modern serta lebih kuat daripada sekadar “menertawakan”.
- source_word: χλαμύδα
  choice: mantel
  rationale: χλαμύς menunjuk pada pakaian luar, sering berupa mantel militer atau resmi. “Mantel” mempertahankan makna dasarnya tanpa menyatakan bahwa pakaian itu sungguh-sungguh jubah kerajaan; konteks sebelumnya menunjukkan bahwa pakaian itu dipakai untuk mengejek Yesus sebagai raja.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: menanggalkan mantel itu dari-Nya
  rationale: ἐκδύω menyatakan tindakan melepaskan pakaian dari seseorang. “Menanggalkan ... dari-Nya” menyampaikan tindakan itu secara jelas, wajar, dan bermartabat.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: mengenakan kembali pakaian-Nya
  rationale: 'ἐνδύω berarti mengenakan pakaian kepada seseorang, sedangkan ἱμάτια adalah istilah umum untuk pakaian. “Kembali” tersirat dari urutan peristiwa: pakaian-Nya sendiri dikenakan lagi setelah mantel ejekan dilepas.'
- source_word: ἀπήγαγον
  choice: membawa Dia pergi
  rationale: ἀπάγω berarti membawa atau menggiring seseorang pergi. Pilihan ini alami dan tetap sesuai dengan konteks para prajurit yang membawa seorang tahanan.
- source_word: εἰς τὸ σταυρῶσαι
  choice: untuk disalibkan
  rationale: Konstruksi εἰς dengan infinitif artikular menyatakan tujuan. Bentuk pasif Indonesia ini ringkas dan alami, sementara pelaku penyaliban tetap dipahami dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan nada yang bermartabat. Pronomina yang merujuk kepada Yesus memakai huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia. Penanda catatan ditempatkan langsung sesudah “mantel,” yaitu kata yang diterangkan oleh catatan.
