  source_fidelity: Revisi diperlukan agar partisipel καθήμενοι ('sambil duduk/dalam keadaan duduk') tetap berfungsi sebagai tindakan atau keadaan penyerta bagi verba utama ἐτήρουν. Terjemahan 'mereka duduk ... dan terus menjaga' mengubahnya menjadi dua tindakan utama yang berurutan. 'Terus menjaga' pada dasarnya tepat untuk ἐτήρουν yang beraspek imperfek dan dalam konteks ini berarti mengawasi atau menjaga tahanan.
  naturalness: '''Dan sambil duduk di sana, mereka terus menjaga Dia'' adalah bahasa Indonesia modern yang alami, ringkas, dan mempertahankan alur naratif tanpa nuansa temporal tambahan dari ''Lalu''.'
  terminology: '''Menjaga Dia'' sesuai dengan τηρέω dalam konteks penjagaan Yesus oleh para prajurit. Kapitalisasi ''Dia'' dapat dipertahankan sebagai konvensi editorial Alkitab Indonesia. Catatan kaki menyediakan alternatif yang lebih eksplisit terhadap kemungkinan pembacaan partisipel sebagai tindakan yang mendahului.'
  issues:
