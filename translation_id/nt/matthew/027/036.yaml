  text: καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: id
  text: Dan sambil duduk di sana,[a] mereka terus menjaga Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan setelah duduk di sana, mereka menjaga Dia.”
    reason: alternatif leksikal-struktural untuk partisipel καθήμενοι
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi ini, καὶ menghubungkan tindakan berikutnya; “Lalu” terdengar alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: καθήμενοι
  choice: mereka duduk
  rationale: Partisipel dari κάθημαι menggambarkan keadaan atau tindakan penyerta. Klausa setara lebih alami dalam bahasa Indonesia dan tetap mempertahankan bahwa mereka duduk sambil menjaga.
- source_word: ἐτήρουν
  choice: terus menjaga
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung. “Terus menjaga” menyampaikan aspek duratif dan sesuai dengan konteks para prajurit yang mengawasi orang yang disalibkan.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus. Huruf kapital mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada-Nya.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Adverbia tempat ini menandai lokasi tindakan dan secara alami ditempatkan sesudah “duduk” dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur partisipial Yunani diungkapkan sebagai dua verba yang dikoordinasikan agar mudah dipahami, sedangkan “terus” mempertahankan nuansa tindakan berkelanjutan dari bentuk imperfek.
