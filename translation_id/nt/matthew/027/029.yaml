  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: id
  text: Sesudah menganyam sebuah mahkota dari duri, mereka menaruhnya di atas kepala-Nya dan menaruh sebatang buluh di tangan kanan-Nya. Lalu mereka berlutut di hadapan-Nya dan mengolok-olok Dia dengan berkata, “Salam, Raja orang Yahudi![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Raja orang Yudea.” Kata Yunani Ἰουδαίων dapat merujuk kepada orang Yudea atau orang Yahudi; di sini kata itu dipakai dalam gelar kerajaan untuk mengejek Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: sesudah menganyam
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului tindakan utama; bentuk ini menyampaikan urutannya dengan wajar dalam bahasa Indonesia.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: sebuah mahkota dari duri
  rationale: Dalam adegan olok-olok kerajaan ini, στέφανος paling tepat diterjemahkan “mahkota”; “dari duri” mempertahankan bahan pembuatnya tanpa menambahkan tafsiran.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: mereka menaruhnya di atas kepala-Nya
  rationale: Terjemahan langsung dan alami untuk tindakan menempatkan mahkota pada kepala Yesus.
- source_word: κάλαμον
  choice: sebatang buluh
  rationale: κάλαμος secara konkret berarti buluh; terjemahan ini mempertahankan gambarnya tanpa secara eksplisit menjadikannya “tongkat kerajaan,” meskipun itulah fungsi olok-oloknya dalam konteks.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: di tangan kanan-Nya
  rationale: Ungkapan datif ini menunjukkan bahwa buluh ditempatkan pada tangan kanan Yesus.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: mereka berlutut di hadapan-Nya
  rationale: Mengungkapkan tindakan dan posisi mereka secara alami serta mempertahankan nuansa penghormatan pura-pura.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: mengolok-olok Dia
  rationale: Pilihan ini menyampaikan ejekan menghina yang menjadi inti tindakan para serdadu.
- source_word: Χαῖρε
  choice: Salam
  rationale: Dalam konteks ini Χαῖρε merupakan seruan penghormatan kerajaan yang sarkastis. “Salam” terdengar alami dan tetap memungkinkan ironi konteks bekerja tanpa penjelasan tambahan.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  rationale: Bentuk vokatif dipertahankan sebagai sapaan langsung. “Orang Yahudi” merupakan padanan Indonesia yang lazim bagi gelar dalam kisah sengsara, sementara kemungkinan arti regional dicatat dalam catatan kaki.
theological_decisions:
- issue: Mempertahankan ironi dalam penghormatan kerajaan yang pura-pura
  choice: “Salam, Raja orang Yahudi!”
  alternative: “Hiduplah Raja orang Yahudi!”
  rationale: “Salam” menerjemahkan Χαῖρε sebagai sapaan langsung yang formal tanpa memperkuatnya menjadi seruan yang tidak dinyatakan secara eksplisit dalam teks. Konteks dan verba “mengolok-olok” menjaga ironi tersebut.
- issue: Cakupan makna Ἰουδαίων dalam gelar Yesus
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam rumusan gelar kerajaan pada kisah sengsara, “orang Yahudi” paling alami dan mencakup identitas etnoreligius yang terkait dengan tuduhan terhadap Yesus. Namun, karena istilah Yunani juga dapat menunjuk orang Yudea, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “menaruh” dipertahankan demi kejelasan kedua objek. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman register Alkitab Indonesia. Catatan kaki ditempatkan tepat setelah frasa yang memiliki alternatif leksikal.
