  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: id
  text: Lalu Pilatus berkata kepada-Nya, “Tidakkah Engkau mendengar betapa banyak hal yang mereka saksikan terhadap Engkau?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “betapa banyak hal yang mereka sampaikan sebagai kesaksian terhadap Engkau.” Kata kerja Yunani yang digunakan memiliki nuansa hukum, yakni memberikan kesaksian yang memberatkan seseorang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Penanda urutan dalam narasi; “Lalu” alami dalam bahasa Indonesia dan menunjukkan peristiwa berikutnya.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang lazim, sebab bahasa Indonesia tidak menandai kala secara gramatikal.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Mempertahankan pronomina Yunani; huruf kapital mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus dalam Alkitab bahasa Indonesia.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Nama diri diterjemahkan dengan bentuk Indonesia yang mapan tanpa artikel.
- source_word: Οὐκ ἀκούεις
  choice: Tidakkah Engkau mendengar
  rationale: Mempertahankan bentuk pertanyaan negatif dan arti dasar ἀκούω.
- source_word: πόσα
  choice: betapa banyaknya
  rationale: Menyatakan banyaknya hal yang dipersaksikan tanpa menambahkan kata “tuduhan,” yang tidak dinyatakan secara eksplisit.
- source_word: σου ... καταμαρτυροῦσιν
  choice: kesaksian yang mereka sampaikan untuk menentang Engkau
  rationale: Mengungkapkan makna legal-forensik verba καταμαρτυρέω serta arah kesaksian yang merugikan Yesus, dengan susunan Indonesia yang jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Engkau” sesuai dengan tuturan langsung kepada satu orang dalam konteks Alkitab, sedangkan “kepada-Nya” mempertahankan rujukan pronominal kepada Yesus. Penanda catatan kaki ditempatkan setelah kalimat yang diterangkannya.
