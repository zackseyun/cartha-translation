  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: id
  text: Mereka memberi Dia anggur yang dicampur dengan empedu untuk diminum.[a] Namun, setelah mencicipinya, Dia tidak mau meminumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani χολή dapat berarti “empedu” atau, secara lebih umum, suatu bahan pahit. Terjemahan ini mempertahankan “empedu” sesuai dengan kata yang dipakai Matius; bandingkan kisah penderitaan yang berkaitan dalam Markus 15:23, yang menyebut mur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Mereka memberi Dia ... untuk diminum
  rationale: Mencerminkan makna langsung verba δίδωμι beserta objek tak langsung dan infinitif tujuannya, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: οἶνον
  choice: anggur
  rationale: Istilah Yunani biasa untuk minuman anggur; konteks tidak mendukung pelemahan menjadi sekadar 'minuman'.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: yang dicampur dengan empedu
  rationale: Partisip pasif μεμιγμένον menyatakan pencampuran, sedangkan χολή secara harfiah dapat berarti empedu dan secara lebih luas sesuatu yang pahit. 'Empedu' mempertahankan bentuk leksikal dan gema Kitab Suci.
- source_word: καὶ γευσάμενος
  choice: Namun, setelah mengecapnya
  rationale: γευσάμενος berarti 'setelah mengecap/mencicipi'. 'Namun' menyatakan kontras naratif yang timbul dari tindakan berikutnya tanpa mengubah isi dasarnya.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: Dia tidak mau meminumnya
  rationale: θέλω menyatakan kehendak atau kemauan. 'Tidak mau' mempertahankan nuansa volisional dan tidak memperkerasnya menjadi 'menolak'.
theological_decisions:
- issue: Makna χολή dalam kisah penderitaan dan gemanya dengan Mazmur
  choice: empedu
  alternative: bahan pahit / sesuatu yang pahit
  rationale: χոլή dapat menunjuk pada empedu atau, secara lebih umum, zat pahit. 'Empedu' mempertahankan kekhususan leksikal Matius dan kemungkinan gema Kitab Suci tanpa menyelesaikan ambiguitas itu secara diam-diam; alternatifnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Mengecap' dipilih karena alami untuk tindakan mencoba sedikit minuman, sedangkan 'tidak mau' mempertahankan nuansa kehendak dalam teks Yunani.
