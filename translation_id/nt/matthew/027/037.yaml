  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: id
  text: 'Mereka menempatkan di atas kepala-Nya tuduhan terhadap-Nya[a] yang tertulis: “Inilah Yesus, Raja orang Yahudi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dakwaan terhadap-Nya.” Kata Yunani αἰτία memiliki nuansa hukum di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau “Raja orang Yudea.” Kata Yunani Ἰουδαίων dapat berarti “orang Yahudi” atau “orang Yudea,” bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: memasang
  rationale: Kata ini menyatakan tindakan menempatkan tulisan secara fisik; “memasang” alami dalam bahasa Indonesia untuk papan atau tulisan yang ditempelkan pada salib.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: di atas kepala-Nya
  rationale: Frasa ini menunjukkan posisi di atas kepala Yesus, bukan bahwa tulisan itu diletakkan langsung pada kepala-Nya.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: tuduhan terhadap-Nya
  rationale: Dalam konteks pengadilan dan penghukuman, αἰτία berarti tuduhan atau dakwaan. “Tuduhan” mudah dipahami dan tetap mempertahankan nuansa hukum.
- source_word: γεγραμμένην
  choice: yang tertulis
  rationale: Bentuk partisipel pasif perfektum menggambarkan tuduhan tersebut dalam keadaan sudah dituliskan; “yang tertulis” menyampaikannya dengan wajar.
- source_word: Οὗτός ἐστιν
  choice: Inilah
  rationale: “Inilah” merupakan ungkapan Indonesia yang ringkas dan alami untuk tulisan penunjuk Οὗτός ἐστιν, tanpa menambah penafsiran.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ini ditransliterasikan sesuai bentuk baku dalam bahasa Indonesia.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  rationale: Ungkapan ini mempertahankan gelar kerajaan dalam bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam rumusan tuduhan politik pada kisah sengsara, istilah ini secara konvensional menunjuk kepada orang Yahudi, meskipun secara leksikal juga dapat berarti orang Yudea.
theological_decisions:
- issue: Nuansa hukum tulisan pada salib
  choice: tuduhan terhadap-Nya
  alternative: dakwaan terhadap-Nya
  rationale: “Tuduhan” mempertahankan makna yudisial tanpa menyiratkan bahwa tuduhan tersebut benar; “dakwaan” juga mungkin, tetapi terdengar lebih teknis dalam bahasa Indonesia modern.
- issue: Cakupan Ἰουδαίων dalam gelar kerajaan
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam formula tuduhan penyaliban, “Raja orang Yahudi” adalah gelar politik yang paling langsung dan dikenal. Namun, kemungkinan geografis-etnis “orang Yudea” tetap dicatat karena istilah Yunani dapat memuat arti itu menurut konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang lugas dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab Indonesia; gelar “Raja” dikapitalisasi dalam bunyi tulisan resmi tersebut.
