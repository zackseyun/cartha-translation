  source_fidelity: 'Makna pokok sudah tepat: datangnya Yusuf, seorang kaya dari Arimatea, dan statusnya sebagai murid Yesus. Namun, “Ketika hari mulai malam” tidak merupakan ungkapan baku yang alami dan dapat menyiratkan bahwa “hari” mulai menjadi malam, bukan bahwa petang telah tiba. “Ketika hari sudah petang” menyampaikan genitif absolut Ὀψίας δὲ γενομένης dengan lebih tepat dan idiomatis. “Pria” juga secara eksplisit mencerminkan ἄνθρωπος dalam konteks ini.'
  naturalness: Struktur dua kalimat dapat dipertahankan dan “Ia sendiri juga” dengan baik membawa tekanan καὶ αὐτός. Revisi temporal diperlukan demi bahasa Indonesia baku modern yang lancar.
  terminology: Arimatea, Yusuf, dan “murid Yesus” sudah konsisten dan tepat. Catatan kaki mempertahankan alternatif yang relevan untuk ἐμαθητεύθη tanpa memaksakan mekanisme pemuridan.
