  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: id
  text: Ketika hari sudah petang, datanglah seorang pria kaya dari Arimatea bernama Yusuf. Ia sendiri juga telah menjadi murid Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah dijadikan murid oleh Yesus” atau “juga merupakan murid Yesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ketika hari mulai malam
  rationale: Konstruksi genitif absolut menandai peralihan waktu dalam kisah. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan datangnya petang tanpa menambahkan penanda waktu yang tidak ada dalam teks sumber.
- source_word: ἦλθεν
  choice: datanglah
  rationale: Aoristus ἔρχομαι menyatakan tindakan datang; bentuk inversi dengan -lah sesuai dengan alur naratif Indonesia yang bermartabat.
- source_word: ἄνθρωπος πλούσιος
  choice: seorang kaya
  rationale: Dalam konteks ini, 'seorang kaya' merupakan padanan idiomatis dan ringkas bagi seorang laki-laki yang kaya; jenis kelaminnya juga tampak dari nama Yusuf.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: dari Arimatea
  rationale: ἀπό menunjukkan asal; 'dari Arimatea' adalah padanan yang langsung dan jelas.
- source_word: τοὔνομα Ἰωσήφ
  choice: bernama Yusuf
  rationale: Padanan Indonesia yang alami untuk ungkapan pengenal nama ini.
- source_word: ὃς καὶ αὐτὸς
  choice: Ia sendiri juga
  rationale: Mempertahankan tekanan gabungan καί dan αὐτός bahwa Yusuf pun, seperti orang lain, termasuk murid Yesus.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: telah menjadi murid Yesus
  rationale: Bentuk pasif μαθητεύω dapat menunjuk pada masuk atau dijadikannya seseorang ke dalam status murid. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi pengajaran langsung oleh Yesus.
theological_decisions:
- issue: Makna ἐμαθητεύθη dalam hubungan Yusuf dengan Yesus
  choice: telah menjadi murid Yesus
  alternative: telah dijadikan murid oleh Yesus; juga merupakan murid Yesus
  rationale: Teks mengidentifikasi Yusuf sebagai orang yang telah masuk ke dalam status sebagai murid Yesus, tetapi bentuk pasifnya juga dapat dipahami lebih harfiah sebagai 'telah dijadikan murid'. Terjemahan utama menjaga hasil atau status tersebut tanpa menentukan secara berlebihan mekanisme pemuridannya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan dipecah menjadi dua kalimat agar hubungan relatif Yunani terbaca alami, sambil mempertahankan penekanan 'Ia sendiri juga'. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang memiliki kemungkinan terjemahan lain.
