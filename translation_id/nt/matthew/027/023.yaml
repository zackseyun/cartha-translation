  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: id
  text: Namun Pilatus berkata[a], “Kejahatan apa yang telah dilakukan-Nya?” Tetapi mereka semakin gencar berteriak, “Biarlah Dia disalibkan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih idiomatis: “Memangnya, kejahatan apa yang telah dilakukan-Nya?”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Yunani memakai bentuk perintah pasif: “Biarlah Dia disalibkan!”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Namun, Pilatus berkata
  rationale: δέ menandai kontras dengan tuntutan orang banyak. Subjek tersirat diperjelas sebagai Pilatus dari konteks, sedangkan aoristus ἔφη berfungsi sebagai pengantar ujaran sederhana.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Kejahatan apa yang telah dilakukan-Nya?
  rationale: Pertanyaan ini menyampaikan tantangan idiomatis yang dibentuk oleh τί γάρ, sambil mempertahankan bobot moral κακόν melalui ‘kejahatan’. Bentuk ‘telah dilakukan’ menyatakan tindakan lampau yang sedang dipersoalkan.
- source_word: περισσῶς ἔκραζον
  choice: berteriak semakin keras
  rationale: περισσῶς menunjukkan peningkatan intensitas, sedangkan bentuk imperfek ἔκραζον menggambarkan teriakan yang berlangsung. Dalam bahasa Indonesia, gabungan ini alami dinyatakan sebagai ‘berteriak semakin keras’.
- source_word: λέγοντες
  choice: tidak diterjemahkan secara terpisah
  rationale: Partisip ini memperkenalkan isi teriakan. Dalam bahasa Indonesia, kutipan langsung setelah ‘berteriak’ sudah menyampaikan fungsi tersebut tanpa kata ‘dengan berkata’ yang terasa kaku.
- source_word: Σταυρωθήτω
  choice: Salibkan Dia!
  rationale: Imperatif pasif orang ketiga Yunani secara harfiah berarti ‘Biarlah Dia disalibkan’, tetapi tuntutan langsung ‘Salibkan Dia!’ merupakan ungkapan Indonesia yang alami dan mempertahankan daya perintahnya; bentuk pasif dicatat dalam catatan kaki.
theological_decisions:
- issue: Bentuk tuntutan orang banyak mengenai penyaliban
  choice: Salibkan Dia!
  alternative: Biarlah Dia disalibkan!
  rationale: Terjemahan utama memakai tuntutan langsung yang alami dalam bahasa Indonesia tanpa menambahkan pelaku tertentu. Catatan kaki mempertahankan informasi bahwa teks Yunani memakai imperatif pasif.
- issue: Penyebutan subjek ὁ pada pengantar ujaran
  choice: Pilatus
  alternative: ia
  rationale: Bahasa Yunani memakai artikel sebagai pronomina yang merujuk kepada Pilatus dalam konteks. Menyebut namanya memperjelas pergantian pembicara tanpa menambah penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Dilakukan-Nya’ dan ‘Dia’ memakai kapitalisasi penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia. Kontras antara Pilatus dan orang banyak dipertahankan melalui ‘Namun’ dan ‘Tetapi’.
