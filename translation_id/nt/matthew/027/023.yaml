  rationale: Revisi mempertahankan nama Pilatus yang jelas dari konteks, memperbaiki jangkar a agar mencatat fungsi idiomatis τί γάρ, dan memakai «semakin gencar berteriak» untuk intensifikasi yang berlanjut. Tuntutan akhir diubah ke bentuk pasif agar mencerminkan σταυρωθήτω secara langsung, tanpa menambahkan pelaku penyaliban.
