review_pass:
  verdict: revise
  source_fidelity: Teks utama menyampaikan pertanyaan Pilatus dan tuntutan orang banyak dengan tepat secara umum. Namun, «Salibkan Dia!» mengubah imperatif pasif orang ketiga (σταυρωθήτω) menjadi perintah aktif kepada pelaku yang tidak disebutkan. Terjemahan «Biarlah Dia disalibkan!» mempertahankan bentuk dan daya tuntutan sumber tanpa tambahan tersebut. Nuansa γάρ dalam pertanyaan juga lebih baik dicerminkan melalui alternatif idiomatis pada catatan kaki.
  naturalness: «Namun Pilatus berkata» dan «Kejahatan apa yang telah dilakukan-Nya?» wajar dalam bahasa Indonesia modern. «Mereka semakin gencar berteriak» menyampaikan peningkatan intensitas περισσῶς dan sifat berlanjut/berulang dari imperfek ἔκραζον tanpa membatasi intensitas itu hanya pada volume suara.
  terminology: Kapitalisasi «-Nya» dan «Dia» konsisten dengan register Alkitab Indonesia yang dipilih. «Disalibkan» adalah padanan baku dan secara tepat mempertahankan suara pasif Yunani.
  issues:
  - severity: medium
    issue: Tuntutan utama memakai bentuk aktif «Salibkan Dia!» untuk imperatif pasif σταυρωθήτω.
    rationale: Bentuk aktif dapat dipahami secara idiomatis, tetapi menyatakan pelaku tersirat sebagai pihak yang harus menyalibkan. Sumber justru menggunakan perintah pasif orang ketiga. Bentuk pasif Indonesia tersedia, jelas, dan alami.
  - severity: low
    issue: Catatan kaki a menjelaskan rujukan «ia» dan menyebutnya sebagai terjemahan lebih harfiah.
    rationale: Dalam teks utama subjek sudah diterjemahkan sebagai «Pilatus», sehingga catatan itu tidak memberikan alternatif tekstual yang relevan. Catatan lebih tepat dipakai untuk nuansa idiomatis τί γάρ, sesuai jangkar audit bahasa Inggris.
  - severity: low
    issue: «Semakin keras» dapat mempersempit περισσῶς menjadi peningkatan volume.
    rationale: Adverbia tersebut menandakan intensifikasi respons, sedangkan ἔκραζον beraspek imperfek. «Semakin gencar berteriak» mempertahankan eskalasi dan keberlangsungan tanpa terlalu mengkhususkan cara intensitasnya.
