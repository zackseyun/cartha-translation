  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: id
  text: Namun para imam kepala dan para tua-tua membujuk orang banyak agar meminta Barabas, tetapi membinasakan Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghukum mati Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan perkembangan narasi sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah baku bagi kalangan pemimpin imamat di Yerusalem dan bentuk jamaknya dipertahankan.
- source_word: πρεσβύτεροι
  choice: para tua-tua
  rationale: Merujuk pada para pemimpin Yahudi yang diakui; pilihan ini mempertahankan corak kelembagaan dan historis.
- source_word: ἔπεισαν
  choice: membujuk
  rationale: Menyatakan tindakan memengaruhi orang banyak agar mengambil tindakan tertentu.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami bagi massa yang berkumpul; meski Yunani berbentuk jamak, bahasa Indonesia lazim memakai bentuk kolektif ini.
- source_word: ἵνα αἰτήσωνται
  choice: agar meminta
  rationale: ἵνα dengan subjungtif sesudah verba persuasi menyatakan isi atau hasil yang dimaksudkan.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: Mengikuti bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἀπολέσωσιν
  choice: membinasakan
  rationale: Mempertahankan cakupan leksikal ἀπόλλυμι, yakni menyebabkan seseorang binasa, tanpa langsung mempersempitnya menjadi istilah teknis eksekusi.
- source_word: τὸν δὲ Ἰησοῦν
  choice: dan membinasakan Yesus
  rationale: Kontras antara Barabas dan Yesus tetap jelas melalui pasangan objek tindakan, sedangkan 'dan' lebih alami setelah konstruksi 'agar' dalam bahasa Indonesia daripada mengulang penanda adversatif.
theological_decisions:
- issue: Makna ἀπολέσωσιν dalam konteks hukuman mati
  choice: membinasakan Yesus
  alternative: menghukum mati Yesus
  rationale: Verba Yunani lebih luas daripada istilah teknis untuk eksekusi dan berarti menyebabkan binasa. Teks utama mempertahankan keluasan itu, sementara konteks konkret berupa kematian dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dibuat ringkas sambil mempertahankan hubungan sebab-tujuan dan kontras antara permintaan untuk Barabas dan tindakan terhadap Yesus.
