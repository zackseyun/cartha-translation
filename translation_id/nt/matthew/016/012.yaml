base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: id
  text: Lalu mereka mengerti bahwa Ia tidak mengatakan agar mereka waspada terhadap ragi roti[a], melainkan terhadap ajaran orang Farisi dan orang Saduki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani untuk “roti” berbentuk jamak. Beberapa naskah kuno tidak memuat kata ini.
    reason: lexical_alternative_and_textual_uncertainty
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai saat para murid akhirnya memahami maksud Yesus; alami dalam alur narasi bahasa Indonesia.
- source_word: συνῆκαν
  choice: mereka mengerti
  rationale: Menyatakan tercapainya pemahaman tanpa menambahkan unsur tafsiran lain.
- source_word: οὐκ εἶπεν προσέχειν
  choice: yang Ia maksudkan bukanlah agar mereka waspada
  rationale: Dalam konteks kilas balik, ungkapan ini secara wajar menyampaikan bahwa para murid kini memahami maksud perkataan sebelumnya; προσέχειν di sini berarti berjaga-jaga terhadap sesuatu.
- source_word: ἀπὸ τῆς ζύμης
  choice: terhadap ragi
  rationale: Ragi merupakan padanan modern yang jelas bagi ζύμη dan tetap mempertahankan metafora dalam konteks ini.
- source_word: τῶν ἄρτων
  choice: roti
  rationale: Bahasa Indonesia lazim memakai 'roti' tanpa penanda jamak; catatan kaki mencatat bahwa bentuk Yunaninya jamak.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Secara alami menandai koreksi tegas sesudah konstruksi 'bukanlah'.
- source_word: διδαχῆς
  choice: ajaran
  rationale: Padanan modern dan mudah dipahami bagi isi yang diajarkan, tanpa nuansa teknis berlebihan.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: orang Farisi dan orang Saduki
  rationale: Bentuk nama kelompok yang baku dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis 'ragi'
  choice: Mempertahankan 'ragi' dan membiarkan ayat itu sendiri menjelaskannya sebagai ajaran orang Farisi dan orang Saduki.
  alternative: Memperluasnya menjadi 'kemunafikan', 'pengaruh buruk', atau 'ajaran sesat'.
  rationale: Teks ayat ini mengidentifikasi ragi dengan ajaran, tetapi tidak merinci sifat moral ajaran tersebut. Terjemahan tidak melampaui tingkat penjelasan teks.
- issue: Makna οὐκ εἶπεν dalam alur wacana
  choice: yang Ia maksudkan bukanlah
  alternative: Ia tidak berkata
  rationale: Konteks menekankan pemahaman para murid atas maksud perkataan Yesus, bukan penyangkalan bahwa kata-kata itu pernah diucapkan. Rumusan ini alami dalam bahasa Indonesia dan menjaga arah wacana.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia' dipakai bagi Yesus sesuai register Alkitab Indonesia yang umum; 'waspada terhadap' menyampaikan kekuatan peringatan tanpa ungkapan arkais.
