  rationale: Revisi menghilangkan demonstratif yang tidak ada dalam sumber, mengganti 'angkatan' dengan 'generasi' demi penggunaan modern, dan mengganti 'berzina' dengan 'pezina' agar metafora μοιχαλίς tetap tajam serta alami. Frasa 'tanda Yunus' dibiarkan tidak dijelaskan dalam teks utama. Catatan kaki diperjelas sesuai rujukan Matius 12:39–40 tanpa menyamakan secara berlebihan makna frasa dalam ayat ini.
