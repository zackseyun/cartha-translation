id: MAT.16.4
reference: Matthew 16:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: id
  text: Generasi yang jahat dan pezina mencari suatu tanda, tetapi tidak ada tanda yang akan diberikan kepadanya selain tanda Yunus.[a] Setelah meninggalkan mereka, ia pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Matius 12:39–40, “tanda Yunus” dihubungkan dengan Yunus yang berada tiga hari dan tiga malam di dalam perut ikan besar, sebagai pola bagi Anak Manusia.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: angkatan
  rationale: Dalam konteks Matius, γενεά menunjuk pada kelompok orang sezaman yang dicirikan oleh sikap tertentu. 'Angkatan' mempertahankan nuansa kolektif dan lazim dalam ragam Alkitab Indonesia tanpa mengartikannya sekadar sebagai masa.
- source_word: πονηρὰ
  choice: jahat
  rationale: '''Jahat'' adalah padanan langsung dan alami bagi πονηρά sebagai penilaian moral.'
- source_word: μοιχαλὶς
  choice: berzina
  rationale: Kata ini memakai metafora perzinaan dan dapat menggemakan ketidaksetiaan kepada Allah. 'Berzina' mempertahankan ketajaman metafora tanpa membatasinya melalui parafrasa interpretatif.
- source_word: σημεῖον
  choice: tanda
  rationale: '''Tanda'' mempertahankan keluasan makna σημεῖον. Menambahkan ''mukjizat'' akan membuat sifat tanda itu lebih eksplisit daripada teks Yunani.'
- source_word: ἐπιζητεῖ
  choice: mencari
  rationale: '''Mencari'' merupakan padanan langsung; tekanan berupa tuntutan dapat dipahami dari konteks dan tidak perlu dimasukkan ke dalam verba.'
- source_word: δοθήσεται αὐτῇ
  choice: kepadanya tidak akan diberikan
  rationale: Bentuk pasif futur dipertahankan. 'Kepadanya' secara wajar merujuk kembali kepada 'angkatan' sebagai nomina kolektif.
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam konstruksi ini, εἰ μή menyatakan satu-satunya pengecualian.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: tanda Yunus
  rationale: Ungkapan genitif ini dipertahankan secara ringkas dan ambigu, tanpa langsung menafsirkannya sebagai kebangkitan.
- source_word: καταλιπὼν αὐτοὺς
  choice: meninggalkan mereka
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba utama dan dapat diterjemahkan secara alami dengan bentuk ini.
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: '''Pergi'' menyampaikan tindakan meninggalkan tempat itu secara lugas; unsur perpisahan sudah dinyatakan oleh ''meninggalkan mereka''.'
theological_decisions:
- issue: Makna ungkapan 'angkatan ... berzina'
  choice: Metafora perzinaan dipertahankan dalam teks utama.
  alternative: Angkatan yang tidak setia
  rationale: Ungkapan ini mungkin menggemakan bahasa para nabi mengenai ketidaksetiaan umat terhadap Allah, tetapi teks Yunani memakai metafora perzinaan. Mempertahankannya menjaga ketegangan antara arti moral dan arti ketidaksetiaan rohani.
- issue: Makna 'tanda Yunus'
  choice: Ungkapan dipertahankan tanpa penjelasan interpretatif dalam teks utama.
  alternative: Menjelaskannya langsung sebagai kematian dan kebangkitan Yesus
  rationale: Matius 12:39–40 memberikan penjelasan yang lebih lengkap, tetapi ayat ini sendiri tetap ringkas. Terjemahan tidak seharusnya memasukkan penafsiran itu ke dalam teks utama.
- issue: Subjek tersirat pada ἀπῆλθεν
  choice: Nama 'Yesus' dinyatakan agar kalimat Indonesia jelas.
  alternative: Ia pergi
  rationale: Bahasa Yunani mengandalkan subjek dari konteks. Penyebutan 'Yesus' tidak menambah tokoh baru, melainkan memperjelas rujukan dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Angkatan' dipilih untuk γενεά, sedangkan 'berzina' mempertahankan metafora sumber. Penanda catatan [a] ditempatkan tepat sesudah frasa yang dijelaskan.
