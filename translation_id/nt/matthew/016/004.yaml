  naturalness: '''Angkatan'' dapat dipahami, tetapi ''generasi'' lebih lazim dalam bahasa Indonesia modern. Frasa ''generasi yang jahat dan pezina'' lebih idiomatis dan mempertahankan metafora sumber dengan jelas. Susunan ''tidak ada tanda yang akan diberikan kepadanya'' juga lebih wajar daripada pendahuluan ''tetapi kepadanya''.'
  terminology: '''Pezina'' mempertahankan metafora μοιχαλίς tanpa mereduksinya menjadi ''tidak setia''. ''Tanda'', ''Yunus'', dan ''Anak Manusia'' sudah tepat. Subjek eksplisit ''Yesus'' tidak diperlukan; ''ia'' cukup jelas dari konteks dan lebih dekat dengan subjek tersirat Yunani.'
