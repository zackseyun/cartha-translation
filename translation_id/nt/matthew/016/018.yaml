  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: id
  text: 'Dan Aku pun berkata kepadamu: Engkau adalah Petrus, dan di atas batu karang ini[a] Aku akan membangun jemaat-Ku, dan gerbang-gerbang alam maut[b] tidak akan mengalahkannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “batu karang ini” dapat dipahami sebagai merujuk kepada Petrus, kepada pengakuan Petrus, atau kepada Petrus sebagai pengaku dan wakil para rasul.
    reason: alternative_reading
  - marker: b
    text: 'Yunani: Hades, yaitu alam atau ranah orang mati; secara tradisional diterjemahkan “neraka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Dan Aku pun
  rationale: κἀγώ memberi penekanan responsif, sedangkan δέ melanjutkan atau memberi kontras ringan. “Dan Aku pun” alami dalam bahasa Indonesia dan mempertahankan hubungan dengan pengakuan Petrus.
- source_word: σοι λέγω
  choice: berkata kepadamu
  rationale: Mempertahankan bentuk pengantar ujaran langsung dari λέγω secara wajar dan bermartabat.
- source_word: Πέτρος
  choice: Petrus
  rationale: Menggunakan bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia; permainan katanya dengan πέτρα diterangkan tanpa memaksakan tafsiran tertentu.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: di atas batu karang ini
  rationale: Mempertahankan metafora fondasi, penunjuk “ini,” dan ketidakpastian mengenai rujukannya.
- source_word: οἰκοδομήσω
  choice: Aku akan membangun
  rationale: Terjemahan langsung yang mempertahankan metafora pembangunan.
- source_word: μου τὴν ἐκκλησίαν
  choice: jemaat-Ku
  rationale: ἐκκλησία menunjuk komunitas yang berhimpun dan menjadi milik Yesus. “Jemaat” merupakan istilah Indonesia yang alami dan tidak terutama menyiratkan bangunan.
- source_word: πύλαι ᾅδου
  choice: gerbang-gerbang dunia orang mati
  rationale: Mempertahankan bentuk jamak πύλαι dan gambaran gerbang, sambil menerjemahkan ᾅδης sebagai ranah kematian, bukan tempat hukuman akhir.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: tidak akan mengalahkannya
  rationale: κατισχύω menyatakan menjadi lebih kuat, menguasai, atau menang atas. Pilihan ini alami dan mempertahankan makna pertentangan.
theological_decisions:
- issue: Rujukan “batu karang ini” (πέτρᾳ)
  choice: Dibiarkan sebagai “batu karang ini” tanpa menentukan rujukannya.
  alternative: Petrus sendiri; pengakuan Petrus; atau Petrus sebagai pengaku dan wakil para rasul.
  rationale: Bahasa Yunani mengaitkan Πέτρος dengan πέτρα melalui permainan kata, tetapi tidak mengharuskan terjemahan untuk menyelesaikan perdebatan tentang rujukannya. Catatan kaki mempertahankan ketegangan penafsiran.
- issue: Makna ᾅδης
  choice: dunia orang mati
  alternative: Hades; neraka
  rationale: Istilah ini menunjuk ranah orang mati dan tidak sama dengan Gehenna atau secara khusus tempat hukuman akhir. Terjemahan maknawi lebih mudah dipahami pembaca Indonesia.
- issue: Daya “gerbang-gerbang dunia orang mati”
  choice: tidak akan mengalahkan jemaat
  alternative: tidak akan menguasainya; tidak akan lebih kuat darinya
  rationale: Teks menggambarkan kuasa kematian sebagai lawan yang tidak akan unggul atas jemaat, tanpa mempersempit gambaran itu menjadi sistem doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. “Jemaat” dipilih agar ἐκκλησία dipahami sebagai komunitas, sedangkan “dunia orang mati” menjelaskan ᾅδης tanpa menyamakannya dengan hukuman akhir.
