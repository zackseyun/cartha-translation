  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: id
  text: Dan pada pagi hari, ‘Hari ini cuaca buruk, sebab langit merah dan mendung.’ Kalian tahu menafsirkan keadaan langit,[a] tetapi kalian tidak mampu menafsirkan tanda-tanda zaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “wajah langit”.'
    reason: lexical_alternative
  - marker: b
    text: “Tanda-tanda zaman” dapat menunjuk secara lebih khusus pada makna rohani masa yang sedang berlangsung, termasuk karya-karya Yesus sebagai Mesias.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: pada pagi hari
  rationale: Ungkapan waktu adverbial ini diterjemahkan secara alami dan mempertahankan kontras dengan perkataan tentang cuaca pada ayat sebelumnya.
- source_word: χειμών
  choice: cuaca akan buruk
  rationale: Dalam konteks ramalan cuaca, kata ini menunjuk pada cuaca buruk atau berbadai, bukan musim dingin. Bentuk dengan ‘akan’ wajar dalam ujaran prakiraan cuaca bahasa Indonesia.
- source_word: πυρράζει
  choice: merah
  rationale: Kata kerja ini menggambarkan langit yang tampak kemerah-merahan; ‘merah’ jelas dan tidak berlebihan.
- source_word: στυγνάζων
  choice: mendung
  rationale: Partisip ini menggambarkan langit yang muram, gelap, atau mengancam. ‘Mendung’ paling alami dalam konteks cuaca.
- source_word: πρόσωπον
  choice: rupa
  rationale: Secara harfiah berarti ‘wajah’, tetapi dalam ungkapan ini menunjuk pada aspek yang terlihat dari langit. ‘Rupa’ mempertahankan citra sumber sekaligus tetap alami.
- source_word: γινώσκετε διακρίνειν
  choice: tahu menilai
  rationale: Gabungan ini menyatakan pengetahuan atau kecakapan untuk membedakan dan menafsirkan berdasarkan pengamatan.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Pilihan baku ini mempertahankan nuansa bukti yang dapat dikenali sekaligus makna pewahyuan dalam pemakaian Matius.
- source_word: καιρῶν
  choice: zaman
  rationale: Di sini καιρός menunjuk pada masa atau momentum yang bermakna, bukan musim cuaca. ‘Zaman’ mempertahankan keluasan makna tersebut.
- source_word: οὐ δύνασθε
  choice: tidak mampu menilai
  rationale: Terjemahan ini menyatakan ketidakmampuan secara eksplisit dan memasok kembali verba ‘menilai’ yang tersirat dari klausa sebelumnya.
theological_decisions:
- issue: Makna ‘tanda-tanda zaman’
  choice: Mempertahankan ungkapan ‘tanda-tanda zaman’ tanpa mempersempit maknanya.
  alternative: ‘tanda-tanda zaman ini’ atau ‘tanda-tanda zaman Mesias’
  rationale: Ungkapan Yunani dapat mencakup arti penting saat itu, termasuk karya-karya Yesus sebagai Mesias dan kemungkinan dimensi eskatologis. Terjemahan tidak memutuskan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan jamak ‘kalian’ dipakai agar orang kedua jamak dalam bahasa Yunani terlihat jelas. Struktur paralel ‘menilai rupa langit ... menilai tanda-tanda zaman’ dipertahankan untuk menonjolkan teguran Yesus.
