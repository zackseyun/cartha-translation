  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: id
  text: Kemudian Yesus dengan tegas memerintahkan murid-murid-Nya agar tidak memberi tahu siapa pun bahwa Dialah Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Χριστός adalah gelar Yunani yang berarti “Yang Diurapi.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa dalam narasi secara ringkas dan alami.
- source_word: διεστείλατο
  choice: dengan tegas memerintahkan
  rationale: Bentuk ini menyampaikan perintah atau larangan yang kuat; pilihan ini mempertahankan ketegasannya tanpa menambahkan gagasan bahaya yang dapat tersirat dalam 'memperingatkan'.
- source_word: τοῖς μαθηταῖς
  choice: murid-murid-Nya
  rationale: Merujuk kepada kelompok murid Yesus yang sudah dikenal dalam konteks; akhiran '-Nya' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: agar tidak memberi tahu siapa pun
  rationale: ἵνα dengan bentuk subjungtif menyatakan isi perintah; frasa ini alami dan mempertahankan larangan menyeluruh μηδενί.
- source_word: ὅτι αὐτός ἐστιν
  choice: bahwa Dialah
  rationale: Menyampaikan isi pemberitahuan dan mempertahankan kehadiran eksplisit αὐτός; bentuk 'Dialah' memberi fokus predikatif yang wajar dalam bahasa Indonesia tanpa berlebihan.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi sosok yang diurapi; 'Mesias' mempertahankan makna gelarnya dalam pemakaian Indonesia yang umum.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός merupakan gelar mesianik, bukan sekadar nama diri. 'Mesias' menyatakan fungsi gelar tersebut secara langsung, sedangkan 'Kristus' dicantumkan sebagai padanan tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yesus' dinyatakan untuk memperjelas subjek tersirat dari verba Yunani, sementara larangan dan daya perintah dipertahankan dengan susunan yang alami.
