  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: id
  text: Sebab Anak Manusia akan segera datang[a] dalam kemuliaan Bapa-Nya bersama malaikat-malaikat-Nya, dan pada waktu itu Ia akan memberikan balasan kepada setiap orang menurut perbuatannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan datang” atau “hendak datang.” Bahasa Yunani memakai ungkapan yang menyatakan bahwa Ia “akan segera datang,” sehingga mempertahankan kesan kedatangan yang menjelang.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut apa yang telah dilakukannya.” Kata Yunani yang diterjemahkan “perbuatan” berbentuk tunggal dan dipakai secara distributif untuk tindakan atau perilaku setiap orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει ... ἔρχεσθαι
  choice: akan segera datang
  rationale: Ungkapan ini mempertahankan makna kedatangan yang akan terjadi sekaligus nuansa bahwa kedatangan itu sudah dekat atau menjelang, tanpa mengubahnya menjadi sekadar bentuk masa depan.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan pernyataan sebelumnya sebagai alasan atau dasar penjelasan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku ini mempertahankan gelar diri Yesus serta kaitannya dengan gambaran dalam Kitab Daniel.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: dalam kemuliaan Bapa-Nya
  rationale: Kata depan Yunani ἐν dipertahankan dengan 'dalam', yang menyatakan lingkup atau penyataan kemuliaan ketika Ia datang.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: bersama malaikat-malaikat-Nya
  rationale: μετά dengan genitif menyatakan penyertaan; bentuk ulang 'malaikat-malaikat' menyampaikan jamak Yunani dengan jelas.
- source_word: καὶ τότε
  choice: dan pada waktu itu
  rationale: 'Ungkapan ini mempertahankan kata penghubung dan urutan waktu: kedatangan terlebih dahulu, kemudian pembalasan.'
- source_word: ἀποδώσει
  choice: akan membalas
  rationale: Dalam konteks penghakiman, kata ini berarti memberikan kepada seseorang apa yang patut diterimanya; 'membalas' mempertahankan cakupan ganjaran tanpa membatasinya hanya pada pahala atau hukuman.
- source_word: ἑκάστῳ
  choice: setiap orang
  rationale: Padanan ini menyampaikan daya distributif bentuk tunggal Yunani dan menegaskan pertanggungjawaban masing-masing orang.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: menurut perbuatannya
  rationale: '''Perbuatannya'' alami dalam bahasa Indonesia dan dapat merangkum tindakan atau perilaku seseorang, sambil tetap mencerminkan bentuk tunggal distributif teks Yunani.'
theological_decisions:
- issue: Daya eskatologis μέλλει pada kedatangan Anak Manusia
  choice: Memakai 'akan segera datang' untuk mempertahankan nuansa bahwa kedatangan itu menjelang.
  alternative: Memakai 'akan datang' atau 'hendak datang'.
  rationale: Teks Yunani memakai μέλλω dengan infinitif, bukan hanya bentuk masa depan biasa. Terjemahan ini mempertahankan ketegangan mengenai kedekatan waktunya tanpa menyelesaikan perdebatan teologis tentang penggenapannya.
- issue: Penghakiman menurut perbuatan
  choice: Menerjemahkan bahwa Ia 'akan membalas setiap orang menurut perbuatannya'.
  alternative: Ia 'akan memberi upah kepada setiap orang sesuai dengan apa yang telah dilakukannya'.
  rationale: '''Membalas'' tidak mempersempit makna menjadi pemberian pahala saja, sedangkan ''menurut perbuatannya'' menyatakan dasar pembalasan dalam ayat tanpa memasukkan suatu sistem doktrin yang lebih luas.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada 'Ia' dan akhiran '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus dan Bapa. Susunan kalimat dibuat alami tanpa menghilangkan hubungan sebab, urutan waktu, nuansa kedekatan, dan bahasa penghakiman dalam teks Yunani.
