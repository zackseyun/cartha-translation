  to: Sebab Anak Manusia akan segera datang[a] dalam kemuliaan Bapa-Nya bersama malaikat-malaikat-Nya, dan pada waktu itu Ia akan memberikan balasan kepada setiap orang menurut perbuatannya.[b]
  rationale: Revisi tunggal mengganti verba yang berpotensi menggeser sasaran tindakan dalam bahasa Indonesia. 'Memberikan balasan kepada setiap orang' menyampaikan ἀποδίδωμι dengan penerima datif secara alami, tanpa menentukan bahwa balasan itu hanya pahala atau hanya hukuman. Semua unsur makna lain, termasuk nuansa μέλλει dan jangkar catatan kaki, dipertahankan.
