  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: id
  text: Sebab, apa gunanya seseorang memperoleh seluruh dunia, tetapi kehilangan nyawanya? Atau, apa yang akan diberikan seseorang sebagai ganti nyawanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwanya” pada kedua kemunculan “nyawanya”. Kata Yunani ψυχή dapat berarti “nyawa”, “diri”, atau “jiwa”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Sebab, apa gunanya
  rationale: τί membuka pertanyaan retoris, sedangkan γάρ menghubungkannya secara menjelaskan dengan ajaran sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua fungsi tersebut.
- source_word: ὠφεληθήσεται ἄνθρωπος
  choice: apa gunanya seseorang
  rationale: Bentuk pasif ὠφεληθήσεται menyatakan manfaat yang diterima. Idiom Indonesia “apa gunanya seseorang” menyampaikan pertanyaan tentang keuntungan secara wajar tanpa mempertahankan pasif Yunani secara kaku; ἄνθρωπος bersifat generik, sehingga “seseorang” tepat.
- source_word: ἐὰν τὸν κόσμον ὅλον κερδήσῃ
  choice: memperoleh seluruh dunia
  rationale: ἐὰν memperkenalkan keadaan hipotetis, yang dalam konstruksi pertanyaan Indonesia dapat dinyatakan tanpa kata “jika”; κερδήσῃ berarti memperoleh atau mendapatkan keuntungan, dan τὸν κόσμον ὅλον berarti seluruh dunia.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ
  choice: tetapi kehilangan nyawanya
  rationale: ζημιόω berarti menderita kerugian, kehilangan, atau kehilangan sebagai akibat pertukaran. ψυχή dalam konteks ini dapat menunjuk pada nyawa, diri, atau jiwa; “nyawa” mempertahankan kaitan dengan kehidupan seseorang dan menghasilkan kontras yang jelas dengan memperoleh dunia.
- source_word: ἢ τί δώσει ἄνθρωπος
  choice: Atau, apa yang akan diberikan seseorang
  rationale: Terjemahan ini mempertahankan pertanyaan retoris kedua, bentuk futur δώσει, dan pemakaian generik ἄνθρωπος.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: sebagai ganti nyawanya
  rationale: ἀντάλλαγμα adalah sesuatu yang diberikan sebagai pertukaran atau ganti. Frasa “sebagai ganti” alami dan mempertahankan metafora pertukaran tanpa mempersempitnya menjadi istilah tebusan.
theological_decisions:
- issue: Makna ψυχή dalam perkataan tentang kehilangan yang mutlak
  choice: nyawa
  alternative: jiwa
  rationale: Dalam konteks ini ψυχή dapat berarti kehidupan atau diri seseorang secara utuh, bukan secara wajib hanya unsur nonjasmani. “Nyawa” menghindari pemaksaan antropologi teknis, sementara “jiwa” tetap merupakan kemungkinan sah dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, bermartabat, dan mudah dipahami. Struktur pertanyaan retoris dipertahankan, sementara susunan pasif Yunani dialihkan secara idiomatis. Penanda catatan kaki [a] dicantumkan dalam teks utama.
