base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: id
  text: Apakah kalian masih belum mengerti[a] dan tidak ingat tentang lima roti untuk lima ribu orang itu serta berapa keranjang yang kalian kumpulkan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Belum jugakah kalian mengerti?”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kalian ambil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: masihkah ... belum
  rationale: 'Mengungkapkan daya temporal οὔπω secara alami dalam pertanyaan teguran: sampai saat itu mereka masih belum mengerti.'
- source_word: νοεῖτε
  choice: mengerti
  rationale: Dalam konteks ini νοέω menunjuk pada pemahaman akan makna peristiwa sebelumnya, bukan sekadar pengamatan.
- source_word: οὐδὲ
  choice: Tidakkah
  rationale: Menyampaikan kelanjutan negatif menuju pertanyaan kedua dalam susunan yang alami dan jelas dalam bahasa Indonesia.
- source_word: μνημονεύετε
  choice: ingat
  rationale: Secara langsung menyatakan tindakan mengingat mukjizat yang telah terjadi.
- source_word: τοὺς πέντε ἄρτους
  choice: lima roti
  rationale: ἄρτος mengacu pada roti dalam kisah pemberian makan; 'lima roti' merupakan ungkapan Indonesia yang wajar tanpa perlu menambahkan bentuk roti yang tidak dinyatakan secara khusus.
- source_word: τῶν πεντακισχιλίων
  choice: untuk lima ribu orang itu
  rationale: Genitif ini mengacu pada peristiwa pemberian makan kepada lima ribu orang; 'untuk' menyatakan hubungan tersebut dengan jelas, sedangkan 'orang' dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: πόσους κοφίνους
  choice: berapa bakul
  rationale: κόφινος adalah sejenis keranjang atau bakul; 'bakul' mempertahankan gambaran konkret serta istilah yang lazim dalam konteks Alkitab.
- source_word: ἐλάβετε
  choice: kalian kumpulkan
  rationale: Dalam konteks sisa makanan, λαμβάνω merujuk pada mengambil atau mengumpulkannya; pilihan ini jelas dan alami, sambil mencatat terjemahan yang lebih harfiah.
