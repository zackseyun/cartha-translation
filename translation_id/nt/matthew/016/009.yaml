  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa kata kerja Yunani berbentuk jamak. Dua pertanyaan dipisahkan agar teguran retoris terdengar alami tanpa mengubah hubungan antarklausanya.
