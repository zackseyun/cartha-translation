  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: id
  text: Sebab siapa pun yang ingin menyelamatkan nyawanya akan kehilangan nyawanya, tetapi siapa pun yang kehilangan nyawanya demi Aku akan menemukannya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “nyawa” juga dapat berarti “hidup”, “diri”, atau “jiwa”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Sebab siapa pun ... tetapi siapa pun
  rationale: Konstruksi relatif tak tentu dengan ἐὰν/ἂν menyatakan kondisi umum. 'Siapa pun' wajar dalam bahasa Indonesia; γάρ diterjemahkan 'Sebab' untuk menghubungkannya dengan ayat sebelumnya, sedangkan δέ menjadi 'tetapi' untuk menegaskan kontras.
- source_word: θέλῃ
  choice: ingin
  rationale: θέλω menyatakan kehendak atau keinginan; 'ingin' merupakan padanan modern dan alami.
- source_word: ψυχὴν
  choice: nyawa
  rationale: Dalam konteks kehilangan atau mempertahankan kehidupan jasmani demi mengikut Yesus, 'nyawa' menyampaikan paradoks dengan lebih tepat daripada 'jiwa', tetapi keluasan makna ψυχή tetap dicatat dalam catatan kaki.
- source_word: σῶσαι
  choice: menyelamatkan
  rationale: σῴζω berarti menyelamatkan atau mempertahankan; 'menyelamatkan' mempertahankan ungkapan kuat dan kesejajaran dengan 'kehilangan'.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: akan kehilangan / kehilangan
  rationale: ἀπόλλυμι di sini menunjuk pada kehilangan nyawa. Bentuk futur dalam klausa pertama diterjemahkan 'akan kehilangan', sedangkan aoristus subjungtif dalam kondisi umum kedua secara alami menjadi 'kehilangan'.
- source_word: ἕνεκεν ἐμοῦ
  choice: demi Aku
  rationale: ἕνεκεν dengan bentuk genitif menyatakan alasan atau kepentingan. 'Demi Aku' singkat, idiomatis, dan mempertahankan unsur kesetiaan pribadi kepada Yesus.
- source_word: εὑρήσει
  choice: akan menemukannya
  rationale: εὑρίσκω secara langsung berarti 'menemukan'; pilihan ini menjaga paradoks kehilangan dan menemukan tanpa memperluasnya menjadi 'memperoleh'.
- source_word: αὐτοῦ / αὐτήν
  choice: -nya / -nya
  rationale: Bahasa Indonesia tidak perlu menandai gender pada pronomina ini. Akhiran '-nya' secara alami merujuk kepada subjek umum dan kemudian kembali kepada 'nyawa'.
theological_decisions:
- issue: Pemaknaan ψυχή dalam paradoks kemuridan
  choice: nyawa
  alternative: jiwa; hidup; diri
  rationale: Konteks menyangkal diri, memikul salib, dan kemungkinan menghadapi kematian mendukung 'nyawa', yang juga cocok dengan verba menyelamatkan, kehilangan, dan menemukan. Namun, ψυχή memiliki jangkauan makna yang lebih luas, sehingga alternatif penting tidak dihapus dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Siapa pun' bersifat inklusif tanpa mengubah bentuk tunggal generik sumber. Huruf kapital pada 'Aku' mengikuti kebiasaan umum penerjemahan Alkitab Indonesia ketika merujuk kepada Yesus.
