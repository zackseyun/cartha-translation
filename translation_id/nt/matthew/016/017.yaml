id: MAT.16.17
reference: Matthew 16:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: id
  text: Lalu Yesus menjawabnya, “Berbahagialah engkau, Simon Bar-Yona[a], sebab bukan daging dan darah[b] yang menyatakan hal ini kepadamu, melainkan Bapa-Ku yang ada di surga[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Simon anak Yona.” Kata Yunani mempertahankan bentuk patronimik Aram; bar berarti “anak”.
    reason: lexical_alternative
  - marker: b
    text: “Daging dan darah” adalah ungkapan yang berarti manusia atau sumber yang semata-mata manusiawi.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “di surga-surga”; bentuk tunggal “di surga” lebih lazim dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Lalu Yesus menjawabnya
  rationale: Konstruksi partisip dan verba finit ini secara idiomatis berarti ‘menjawab dan berkata’. ‘Menjawabnya’ menyampaikan maknanya secara wajar dalam bahasa Indonesia, sedangkan δέ diterjemahkan ‘lalu’ untuk melanjutkan alur percakapan.
- source_word: Μακάριος
  choice: Berbahagialah
  rationale: Ungkapan ini menyatakan keadaan orang yang diperkenan dan diberkati, bukan sekadar perasaan senang. ‘Berbahagialah’ mempertahankan bobot ucapan Yesus dan merupakan bentuk yang alami dalam konteks ini.
- source_word: Σίμων Βαριωνᾶ
  choice: Simon Bar-Yona
  rationale: Nama Σίμων dialihaksarakan sebagai ‘Simon’, sedangkan bentuk patronimik Aram Βαριωνᾶ dipertahankan sebagai ‘Bar-Yona’. Catatan kaki menjelaskan maknanya bagi pembaca.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan mengapa Simon disebut berbahagia. ‘Sebab’ jelas, ringkas, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: σὰρξ καὶ αἷμα
  choice: daging dan darah
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa sumber dan kontrasnya dengan Bapa. Catatan kaki menerangkan bahwa ungkapan tersebut menunjuk kepada manusia atau sumber yang semata-mata manusiawi.
- source_word: ἀπεκάλυψέν σοι
  choice: yang menyatakan hal ini kepadamu
  rationale: ‘Menyatakan’ menyampaikan gagasan penyingkapan atau pemberitahuan yang sebelumnya tidak diketahui. ‘Hal ini’ ditambahkan secara wajar karena objeknya tersirat dari pengakuan Simon dalam konteks sebelumnya.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: melainkan Bapa-Ku
  rationale: ‘Melainkan’ menandai pertentangan kuat antara sumber manusiawi dan Bapa sebagai sumber penyataan itu.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: yang ada di surga
  rationale: Frasa relatif dipertahankan agar struktur ‘Bapa-Ku yang ...’ tetap terlihat. Bentuk jamak Yunani diterjemahkan dengan bentuk tunggal idiomatis ‘surga’ dalam bahasa Indonesia, dengan keterangan dalam catatan kaki.
theological_decisions:
- issue: Sumber pengakuan Simon
  choice: Ungkapan ‘daging dan darah’ dipertahankan, sehingga teks mengontraskan sumber manusiawi secara umum dengan penyataan dari Bapa.
  alternative: Menafsirkannya secara khusus sebagai penalaran Simon sendiri atau sebagai ajaran dari tokoh manusia tertentu.
  rationale: Bahasa Yunani mengecualikan sumber manusiawi tanpa menentukan apakah yang dimaksud terutama penalaran pribadi, guru manusia, atau kewenangan manusia lainnya. Terjemahan tidak mempersempit cakupannya.
- issue: Cakupan penyataan ilahi
  choice: Terjemahan menyatakan bahwa Bapa menyingkapkan isi pengakuan Simon dalam konteks langsung.
  alternative: Memperluas ayat ini menjadi pernyataan teknis tentang suatu doktrin inspirasi yang lengkap.
  rationale: Ayat tersebut dengan jelas mengaitkan pengenalan Simon dengan Bapa, tetapi tidak merumuskan lebih jauh mekanisme atau cakupan doktrinal penyataan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami untuk percakapan naratif, sementara ungkapan penting ‘daging dan darah’ serta bentuk patronimik ‘Bar-Yona’ dipertahankan dan dijelaskan melalui catatan kaki.
