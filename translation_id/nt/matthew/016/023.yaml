review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk φρονεῖς. Frasa "yang kaupikirkan bukanlah" menggeser struktur Yunani dari penyangkalan langsung atas orientasi Petrus menjadi klausa relatif yang agak janggal. "Engkau tidak memikirkan perkara-perkara Allah" lebih langsung menyampaikan negasi serta orientasi/perhatian yang dimaksud φρονεῖς. "Pergilah ke belakang-Ku" mempertahankan unsur spasial ὀπίσω μου, dan "Iblis" merupakan padanan Indonesia baku yang wajar bagi Σατανᾶ dalam konteks ini.
  naturalness: Teks revisi menggunakan susunan kalimat Indonesia baku yang lebih lancar. "Perkara-perkara Allah/manusia" terdengar alami dalam register Alkitab modern dan tidak membatasi τὰ τοῦ θεοῦ maupun τὰ τῶν ἀνθρώπων hanya sebagai hal-hal yang "berasal dari" salah satu pihak.
  terminology: '"Iblis," "batu sandungan," dan "perkara-perkara Allah/manusia" konsisten dengan istilah Alkitab Indonesia yang dikenal luas. Kapitalisasi pronomina "-Ku" dapat dipertahankan sesuai konvensi penerbitan yang dipakai draf.'
  issues:
