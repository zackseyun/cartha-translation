source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: id
  text: Tetapi Yesus berpaling dan berkata kepada Petrus, “Pergilah ke belakang-Ku, Iblis! Engkau adalah batu sandungan bagi-Ku, sebab engkau tidak memikirkan perkara-perkara Allah, melainkan perkara-perkara manusia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoristus ini dipakai secara intransitif dan menunjukkan bahwa Yesus mengalihkan diri atau arah-Nya sebelum berbicara; “berpaling” alami dan cukup mempertahankan gerak tersebut.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Pergilah ke belakang-Ku
  rationale: Terjemahan ini mempertahankan makna spasial ὀπίσω dan daya imperatif ὕπαγε. Ungkapan tersebut juga dapat menyiratkan bahwa Petrus harus kembali ke tempat seorang pengikut, tetapi terjemahan tidak memaksakan penafsiran itu.
- source_word: Σατανᾶ
  choice: Iblis
  rationale: Dalam bahasa Indonesia, “Iblis” merupakan sebutan baku yang dikenali untuk Satan dalam konteks ini. Pilihan ini mempertahankan kerasnya teguran tanpa menentukan apakah Petrus disamakan dengan Iblis atau sedang bertindak sebagai alatnya.
- source_word: σκάνδαλον
  choice: batu sandungan
  rationale: Ungkapan Indonesia ini mempertahankan metafora rintangan yang menyebabkan orang tersandung dan cocok dengan upaya Petrus menghalangi jalan penderitaan Yesus.
- source_word: ἐμοῦ
  choice: bagi-Ku
  rationale: Genitif yang menyertai σκάνδαλον menyatakan pihak yang terkena atau dihadapkan pada rintangan; “bagi-Ku” alami dalam ungkapan Indonesia “batu sandungan bagi-Ku”.
- source_word: φρονεῖς
  choice: yang kaupikirkan
  rationale: φρονέω menunjuk pada pola pikir, orientasi, atau perhatian. Dalam susunan “yang kaupikirkan bukanlah ...”, bahasa Indonesia menyampaikan fokus batin yang berkelanjutan tanpa menjadi kaku.
- source_word: τὰ τοῦ θεοῦ
  choice: hal-hal yang dari Allah
  rationale: Bentuk substantival ini dipertahankan secara cukup formal agar kontras dengan τὰ τῶν ἀνθρώπων tetap terlihat dan ketaksaan antara perkara, kehendak, serta kepentingan Allah tidak dipersempit.
- source_word: τὰ τῶν ἀνθρώπων
  choice: hal-hal yang dari manusia
  rationale: “Manusia” secara alami mencakup umat manusia dalam bahasa Indonesia dan mempertahankan kontras antara apa yang berasal dari atau menjadi perhatian Allah dan apa yang manusiawi.
theological_decisions:
- issue: Daya sebutan “Iblis” yang ditujukan kepada Petrus
  choice: Mempertahankan sapaan langsung “Iblis” tanpa menjelaskan hubungan Petrus dengan Iblis.
  alternative: Menerjemahkannya sebagai “lawan” atau secara eksplisit mengatakan bahwa Iblis bekerja melalui Petrus.
  rationale: Bahasa Yunani memberi teguran yang sangat tajam tetapi tidak menerangkan apakah Petrus sedang diidentikkan dengan Iblis, berperan sebagai lawan, atau menjadi alat pencobaan. Terjemahan mempertahankan ketegangan itu.
- issue: Makna ὀπίσω μου dalam teguran
  choice: Menerjemahkan secara spasial sebagai “ke belakang-Ku”.
  alternative: “Enyahlah dari hadapan-Ku” atau “Kembalilah menjadi pengikut-Ku”.
  rationale: Ungkapan itu dapat mengandung gema kedudukan seorang murid di belakang gurunya, tetapi makna tersebut tidak dibuat eksplisit agar terjemahan tidak menutup kemungkinan nuansa pengusiran atau penempatan kembali.
- issue: Kontras ilahi dan manusiawi
  choice: “hal-hal yang dari Allah” dan “hal-hal yang dari manusia”.
  alternative: “kepentingan Allah” dan “kepentingan manusia”.
  rationale: Bentuk yang lebih terbuka mempertahankan keluasan substantiva Yunani dan tidak membatasi kontras hanya pada kepentingan, rencana, atau kehendak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau alternatif leksikal yang perlu ditampilkan untuk memahami ayat ini.
