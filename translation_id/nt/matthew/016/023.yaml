    issue: Penyampaian φρονεῖς dan struktur negasinya kurang tepat dan kurang alami.
    rationale: Yunani οὐ φρονεῖς menegaskan bahwa Petrus tidak menaruh pikiran/orientasinya pada perkara Allah. "Yang kaupikirkan bukanlah ..." mengubahnya menjadi fokus pada isi suatu pikiran dan menghasilkan konstruksi yang lebih berbelit.
  - severity: low
    issue: '"Hal-hal yang dari Allah/manusia" cenderung menyempitkan relasi genitif.'
    rationale: τὰ τοῦ θεοῦ dan τὰ τῶν ἀνθρώπων berarti secara luas perkara-perkara yang berkaitan dengan Allah dan manusia; "dari" dapat terutama dibaca sebagai asal. "Perkara-perkara Allah/manusia" lebih terbuka dan idiomatis.
