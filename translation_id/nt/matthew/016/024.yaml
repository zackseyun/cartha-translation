  source_fidelity: Draf pada umumnya setia pada urutan dan isi Yunani. Namun, ἀπαρνησάσθω adalah imperatif orang ketiga, sehingga “hendaklah ia menyangkal dirinya” lebih langsung mencerminkan daya perintahnya daripada “ia harus menyangkal dirinya,” yang dapat terdengar sebagai pernyataan kewajiban.
  naturalness: “Kemudian Yesus berkata kepada murid-murid-Nya” dan bentuk tunggal generik “seseorang ... ia ... dirinya ... salibnya” adalah bahasa Indonesia baku dan alami. “Datang mengikut Aku” dapat dipertahankan untuk mencerminkan ὀπίσω μου ἐλθεῖν tanpa menghapus unsur “datang,” walaupun kemudian muncul pengulangan yang memang berasal dari dua ungkapan Yunani yang berdekatan.
  terminology: “Murid-murid,” “menyangkal dirinya,” “memikul salibnya,” dan “mengikuti Aku” adalah padanan yang mapan serta sesuai register. Bahasa Indonesia tidak menandai gender pada bentuk-bentuk ini, tetapi tetap mempertahankan tunggal generik dari teks sumber.
