  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: id
  text: Kemudian Yesus berkata kepada murid-murid-Nya, “Jika seseorang ingin datang mengikut Aku, hendaklah ia menyangkal dirinya, memikul salibnya, dan mengikuti Aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda urutan waktu dalam narasi; ‘Kemudian’ alami dan tetap menunjukkan kelanjutan peristiwa.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: ‘Murid’ merupakan padanan baku yang mempertahankan hubungan guru-pengikut dalam konteks Injil.
- source_word: Εἴ τις θέλει
  choice: Jika seseorang ingin
  rationale: Menyampaikan syarat terbuka dan unsur kehendak tanpa membatasi cakupannya menurut gender.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: datang mengikut Aku
  rationale: Mengungkapkan idiom pemuridan secara alami dalam bahasa Indonesia sambil tetap mempertahankan gambaran datang di belakang atau mengikut Yesus.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: ia harus menyangkal dirinya
  rationale: Imperatif orang ketiga dinyatakan secara wajar dengan ‘harus’; ‘menyangkal dirinya’ mempertahankan seruan tegas untuk penyangkalan diri.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: memikul salibnya
  rationale: Dalam kolokasi Indonesia, ‘memikul salib’ secara alami mencakup tindakan mengangkat untuk dibawa dan mempertahankan gambaran konkret serta harga pemuridan.
- source_word: ἀκολουθείτω μοι
  choice: mengikuti Aku
  rationale: Padanan langsung dan alami bagi perintah untuk terus hidup sebagai pengikut Yesus; nuansa berkelanjutan dari imperatif kini tersirat dalam konteks pemuridan.
theological_decisions:
- issue: Bentuk tunggal maskulin generik dalam syarat dan perintah
  choice: Menggunakan ‘seseorang ... ia ... dirinya ... salibnya’
  alternative: Menggunakan bentuk yang secara eksplisit bergender laki-laki, seperti ‘seorang laki-laki ... dia’
  rationale: Bahasa Yunani memakai bentuk tunggal yang secara gramatikal maskulin dalam fungsi representatif. Bahasa Indonesia tidak menandai gender pada ‘seseorang’, ‘ia’, dan akhiran ‘-nya’, sehingga bentuk tunggal dan cakupan universal dapat dipertahankan tanpa menambahkan gender yang tidak perlu.
- issue: Hubungan antara ὀπίσω μου ἐλθεῖν dan ἀκολουθείτω μοι
  choice: ‘datang mengikut Aku ... mengikuti Aku’
  alternative: ‘datang di belakang-Ku ... mengikuti Aku’
  rationale: Pilihan utama menjaga gambaran pemuridan dengan bahasa Indonesia yang alami, meskipun menghasilkan pengulangan akar ‘ikut’. Alternatif lebih harfiah tetapi ‘datang di belakang-Ku’ dapat terdengar semata-mata spasial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Struktur tunggal dipertahankan, sementara bahasa Indonesia secara alami tidak memberi penanda gender.
