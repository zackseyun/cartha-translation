  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: id
  text: Simon Petrus menjawab, “Engkaulah Mesias[a], Anak Allah yang hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Kristus”; di sini diterjemahkan “Mesias” untuk mempertahankan fungsinya sebagai gelar dan konteks mesianik Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: menjawab
  rationale: Gabungan partisip ἀποκριθείς dan verba εἶπεν merupakan pengantar ujaran yang secara idiomatis berarti “menjawab”; satu verba Indonesia menghindari ungkapan kaku “menjawab dan berkata”.
- source_word: δὲ
  choice: —
  rationale: Partikel ini menandai kelanjutan atau peralihan ringan. Alur tersebut sudah terasa alami dalam bahasa Indonesia tanpa padanan tersendiri.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Nama pribadi dialihaksarakan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: Σὺ εἶ
  choice: Engkaulah
  rationale: Pronomina eksplisit Σὺ bersifat menonjol. Bentuk “Engkaulah” secara alami mempertahankan penegasan identitas dalam bahasa Indonesia serta sesuai dengan suasana pengakuan langsung kepada Yesus.
- source_word: ὁ χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar mesianik, bukan sekadar unsur nama. “Mesias” mempertahankan fungsi gelar dan latar Yahudinya.
- source_word: ὁ υἱὸς
  choice: Anak
  rationale: Konstruksi berartikel menunjuk pada gelar dan relasi tertentu. Kapitalisasi membantu menunjukkan pemakaian titular tanpa menambahkan penjelasan teologis yang tidak tersurat.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Allah yang hidup
  rationale: Partisip ζῶντος menerangkan Allah secara atributif. “Allah yang hidup” merupakan padanan alami dan tepat yang mempertahankan kontras kualitatif ungkapan Yunani.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pengakuan Petrus, Χριστός jelas berfungsi sebagai gelar mesianik. Padanan alternatif “Kristus” tetap dicatat karena telah mapan dan secara langsung merepresentasikan bentuk Yunani.
- issue: Daya ungkapan “Anak Allah”
  choice: Anak Allah yang hidup
  alternative: —
  rationale: Terjemahan mempertahankan susunan pengakuan dan daya titular teks Yunani tanpa mengembangkannya menjadi rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Engkau” dipakai karena ujaran ditujukan langsung kepada Yesus dan bentuk “Engkaulah” mempertahankan penekanan pronomina Yunani. Tanda catatan kaki [a] ditempatkan langsung setelah istilah yang diterangkan.
