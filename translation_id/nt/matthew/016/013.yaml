id: MAT.16.13
reference: Matthew 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: id
  text: Ketika Yesus tiba di daerah Kaisarea Filipi, Ia bertanya kepada murid-murid-Nya, “Menurut kata orang, siapakah Anak Manusia itu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Manusia” adalah sebutan khas yang digunakan Yesus untuk diri-Nya; ungkapan ini juga dapat diterjemahkan “Sang Manusia”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Ketika ... tiba
  rationale: Partisip aoris membuka adegan baru dan menyatakan keadaan waktu. “Ketika ... tiba” menyampaikan hubungan waktunya secara alami tanpa menambahkan kata waktu yang tidak tersurat.
- source_word: εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου
  choice: di daerah Kaisarea Filipi
  rationale: μέρη menunjuk pada wilayah sekitar kota, bukan “bagian-bagian” secara harfiah. “Kaisarea Filipi” adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: ἠρώτα
  choice: Ia bertanya
  rationale: Bentuk imperfek menggambarkan tindakan bertanya dalam adegan tersebut. Bahasa Indonesia tidak wajib menandai aspek progresif, dan “Ia sedang bertanya” kurang alami untuk pertanyaan tunggal ini.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: “Murid-murid” merupakan padanan mapan bagi μαθηταί, sedangkan akhiran “-Nya” menyatakan hubungan dengan Yesus.
- source_word: λέγων
  choice: tidak dinyatakan secara terpisah
  rationale: Partisip yang secara harfiah berarti “dengan berkata” memperkenalkan kutipan. Dalam bahasa Indonesia, fungsi itu sudah jelas melalui verba “bertanya” dan tanda kutip; menerjemahkannya lagi akan terasa berulang.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Menurut kata orang, siapakah ... itu?
  rationale: Susunan ini menyampaikan wacana tak langsung Yunani secara idiomatis. οἱ ἄνθρωποι bersifat umum, sehingga diterjemahkan “orang”, bukan istilah yang hanya menunjuk laki-laki.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Istilah tradisional ini mempertahankan bentuk ungkapan, fungsi sebagai sebutan khas Yesus bagi diri-Nya, dan kemungkinan gema Daniel 7.
theological_decisions:
- issue: Penerjemahan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” telah mapan dan tetap dekat dengan bentuk Yunani serta latar Semitiknya. Pilihan ini menjaga kemungkinan bahwa ungkapan tersebut sekaligus merupakan sebutan diri dan memiliki bobot gelar, tanpa menetapkan salah satu nuansa secara sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Sapaan ilahi tidak ditambahkan. Pronomina “Ia” dan akhiran “-Nya” mengikuti kelaziman register Alkitab Indonesia yang bermartabat tanpa mengubah makna sumber.
