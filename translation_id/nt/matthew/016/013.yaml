  source_fidelity: Teks Indonesia secara tepat menyampaikan hubungan temporal Ἐλθὼν, lokasi wilayah Kaisarea Filipi, sasaran pertanyaan kepada para murid, serta isi pertanyaan mengenai identitas Anak Manusia. “Menurut kata orang, siapakah Anak Manusia itu?” merupakan padanan idiomatis dan tetap mempertahankan pertanyaan tidak langsung yang tersirat oleh λέγουσιν ... εἶναι. Tidak ada ambiguitas sumber yang dihilangkan secara tidak semestinya.
