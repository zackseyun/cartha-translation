  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: id
  text: Atau tujuh roti untuk empat ribu orang itu, dan berapa bakul besar yang kalian kumpulkan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Atau
  rationale: Dalam rangkaian pertanyaan retoris yang eliptis, οὐδὲ secara alami memperkenalkan peristiwa berikutnya yang harus mereka ingat. 'Atau' paling wajar dalam bahasa Indonesia, sedangkan 'dan juga tidak' terlalu kaku jika ayat ini dibaca tersendiri.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: tujuh roti
  rationale: ἄρτους menunjuk pada roti-roti yang dipakai dalam peristiwa pemberian makan. Bahasa Indonesia lazim memakai kata benda kolektif 'roti' sesudah bilangan tanpa harus mengatakan 'buah' atau mengulanginya.
- source_word: τῶν τετρακισχιλίων
  choice: untuk empat ribu orang itu
  rationale: Genitif ini mengaitkan tujuh roti dengan peristiwa pemberian makan kepada empat ribu orang. 'Untuk' menyatakan hubungan kontekstual itu secara jelas, dan 'orang itu' menandai kelompok yang telah disebut dalam kisah.
- source_word: πόσας
  choice: berapa
  rationale: πόσας adalah kata tanya yang menerangkan σπυρίδας; 'berapa' merupakan padanan Indonesia yang langsung dan alami.
- source_word: σπυρίδας
  choice: bakul besar
  rationale: σπυρίς menunjuk pada jenis keranjang yang besar. 'Bakul besar' mempertahankan pembedaan leksikal dengan κόφινος dalam kisah pemberian makan lainnya sekaligus tetap mudah dipahami.
- source_word: ἐλάβετε
  choice: kalian kumpulkan
  rationale: Dalam konteks sisa makanan, kata kerja ini bermakna mengambil atau mengumpulkan. 'Kumpulkan' menyatakan tindak pengumpulan sisa dengan alami; 'kalian' juga membuat subjek jamak Yunani terlihat jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk 'kalian' dipakai untuk mempertahankan subjek orang kedua jamak yang ditujukan kepada para murid. Susunan pertanyaan tetap mengikuti kesinambungan retoris dari ayat sebelumnya.
