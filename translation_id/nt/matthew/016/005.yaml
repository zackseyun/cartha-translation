  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: id
  text: Ketika murid-murid tiba di seberang, mereka lupa membawa roti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: ketika ... tiba
  rationale: Partisip aoris dipahami secara temporal terhadap verba utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan naratif tanpa membuat bentuk partisip menjadi kaku.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dan kontekstual bagi para pengikut Yesus dalam Injil.
- source_word: εἰς τὸ πέραν
  choice: di seberang
  rationale: Ungkapan ini secara idiomatis menunjuk pada sisi lain danau. Dengan verba 'tiba', preposisi 'di' lebih alami dalam bahasa Indonesia daripada 'ke'.
- source_word: ἐπελάθοντο
  choice: mereka lupa
  rationale: Verba ini berarti 'lupa'. Urutan waktu—kelalaian terjadi sebelum atau diketahui ketika mereka tiba—sudah jelas dari konteks, sehingga bentuk alami 'lupa' tidak memerlukan penandaan khusus seperti 'telah lupa'.
- source_word: ἄρτους
  choice: roti
  rationale: Walaupun bentuk Yunani jamak, 'roti' dalam bahasa Indonesia secara alami dapat berfungsi sebagai nomina umum tanpa harus diterjemahkan 'roti-roti' atau 'beberapa ketul roti'.
- source_word: λαβεῖν
  choice: membawa
  rationale: Dalam konteks perjalanan menyeberang, 'membawa' menyampaikan maksud mengambil roti untuk dibawa serta dan lebih alami daripada 'mengambil'.
