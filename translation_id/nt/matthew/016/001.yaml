id: MAT.16.1
reference: Matthew 16:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: id
  text: Lalu orang-orang Farisi dan Saduki datang kepada Yesus dan, untuk menguji Dia,[a] meminta Dia menunjukkan kepada mereka suatu tanda dari surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mencobai Dia” atau “untuk menjebak Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: datang kepada Yesus
  rationale: Partisip aoristus ini menyatakan gerak mendekat sebelum tindakan utama. Penyebutan Yesus secara eksplisit membuat rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Bentuk baku dan mudah dipahami dalam bahasa Indonesia untuk nama kelompok ini.
- source_word: Σαδδουκαῖοι
  choice: orang-orang Saduki
  rationale: Bentuk baku dan mudah dipahami dalam bahasa Indonesia untuk nama kelompok ini.
- source_word: πειράζοντες
  choice: untuk menguji Dia
  rationale: Konstruksi tujuan ini menyampaikan tindakan yang disengaja dan bernuansa bermusuhan, sambil mempertahankan cakupan leksikal πειράζω tanpa mempertegasnya menjadi upaya menjebak.
- source_word: ἐπηρώτησαν
  choice: meminta
  rationale: Dalam konstruksi dengan infinitif ἐπιδεῖξαι, verba ini secara alami berarti meminta seseorang melakukan sesuatu; 'meminta' lebih idiomatis daripada 'bertanya' dalam bahasa Indonesia.
- source_word: σημεῖον
  choice: suatu tanda
  rationale: Mempertahankan istilah umum Yunani tanpa menambahkan kata 'mukjizat', meskipun konteks mengisyaratkan tanda adikodrati yang mengesahkan.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Ungkapan alami yang mempertahankan makna asal atau sumber tanda tersebut.
- source_word: ἐπιδεῖξαι
  choice: menunjukkan
  rationale: Padanan langsung dan idiomatis untuk infinitif yang menyatakan apa yang mereka minta agar Yesus lakukan.
theological_decisions:
- issue: Nuansa bermusuhan dalam permintaan orang Farisi dan Saduki
  choice: Menerjemahkan πειράζοντες sebagai 'untuk menguji Dia'.
  alternative: '''untuk mencobai Dia'' atau ''untuk menjebak Dia'''
  rationale: '''Menguji'' mempertahankan ketegangan dan cakupan kata Yunani. ''Mencobai'' dapat menyiratkan godaan kepada dosa, sedangkan ''menjebak'' menyatakan motif secara lebih tegas daripada teks sumber.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; penanda [a] ditempatkan tepat sesudah frasa yang memiliki alternatif leksikal.
