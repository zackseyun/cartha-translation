id: MAT.16.19
reference: Matthew 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: id
  text: Aku akan memberikan kepadamu kunci-kunci Kerajaan Surga[a]. Apa pun yang kamu ikat di bumi akan sudah terikat di surga[b][c], dan apa pun yang kamu lepaskan di bumi akan sudah terlepas di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, ungkapan Yunani ini berarti “kerajaan dari langit-langit.” Matius sering memakai ungkapan ini.
    reason: lexical_alternative
  - marker: b
    text: Terjemahan tradisional sering berbunyi “akan diikat ... akan dilepaskan.” Bentuk Yunani juga dapat dipahami sebagai “akan sudah terikat ... akan sudah terlepas.”
    reason: alternative_reading
  - marker: c
    text: “Mengikat” dan “melepaskan” dapat mengandung arti melarang dan mengizinkan, atau memberlakukan dan mencabut kewajiban. Terjemahan utama tetap mempertahankan metafora Yunani.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Aku akan memberikan kepadamu
  rationale: Bentuk futur menyatakan janji yang akan digenapi. Susunan ini alami dan tetap menampilkan penerima pemberian secara jelas.
- source_word: τὰς κλεῖδας
  choice: kunci-kunci
  rationale: Nomina jamak dan metafora aslinya dipertahankan tanpa menjabarkannya sebagai suatu sistem kewenangan tertentu.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ini ungkapan khas Matius. Bentuk tunggal “surga” merupakan padanan Indonesia yang alami bagi bentuk Yunani jamak, sedangkan bentuk sumbernya dijelaskan dalam catatan.
- source_word: ὃ ἐὰν
  choice: apa pun yang
  rationale: Konstruksi relatif tak tentu ini diterjemahkan secara idiomatis dan digunakan sejajar dalam kedua klausa.
- source_word: δήσῃς
  choice: kamu ikat
  rationale: Metafora “mengikat” dipertahankan sehingga nuansa kewenangan, larangan, atau kewajiban tidak dipersempit menjadi satu tafsiran.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Padanan Indonesia yang alami dalam pertentangan rumusan antara bumi dan surga.
- source_word: ἔσται δεδεμένον
  choice: akan sudah diikat
  rationale: Gabungan bentuk futur εἰμί dan partisip perfek pasif menyatakan keadaan mendatang sebagai hasil tindakan yang telah selesai. Susunan yang agak bertanda ini mempertahankan aspek tersebut.
- source_word: λύσῃς
  choice: kamu lepaskan
  rationale: “Melepaskan” menjadi pasangan alami bagi “mengikat” dalam bahasa Indonesia dan tetap mempertahankan metafora Yunani.
- source_word: ἔσται λελυμένον
  choice: akan sudah dilepaskan
  rationale: Terjemahan ini sejajar dengan klausa sebelumnya dan mencerminkan bentuk futur dengan partisip perfek pasif.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Bentuk tunggal adalah ungkapan Indonesia yang wajar; bentuk Yunani jamak tidak perlu ditiru secara kaku.
theological_decisions:
- issue: Aspek dan implikasi teologis rumusan mengikat dan melepaskan
  choice: “akan sudah diikat/dilepaskan di surga”
  alternative: “akan diikat/dilepaskan di surga”
  rationale: Bentuk Yunani ἔσται dengan partisip perfek pasif menunjuk pada keadaan mendatang yang dihasilkan oleh tindakan yang telah selesai. Terjemahan ini memungkinkan tindakan di bumi dipahami bersesuaian dengan ketetapan surgawi, tetapi tidak menjadikan implikasi itu sebagai doktrin denominasi yang dinyatakan secara eksplisit.
- issue: Makna kunci-kunci Kerajaan Surga
  choice: Metafora “kunci-kunci” dipertahankan
  alternative: Menjabarkannya sebagai wewenang untuk menerima dan menolak atau sebagai kewenangan pengelolaan
  rationale: Gambaran itu menyiratkan kewenangan, tetapi ayat ini sendiri berbicara melalui metafora. Mempertahankannya menghindari pemasukan sistem eklesiologis tertentu.
- issue: Makna mengikat dan melepaskan
  choice: Metafora diterjemahkan langsung dan nuansa pemakaiannya dicatat
  alternative: Menerjemahkan langsung sebagai “melarang dan mengizinkan”
  rationale: Ungkapan tersebut dapat memiliki nuansa melarang dan mengizinkan atau memberlakukan dan mencabut kewajiban, tetapi konteks ayat tidak menuntut satu parafrasa tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Aku” dan “kamu” dipakai karena tuturan langsung ditujukan kepada satu orang, tanpa menambahkan gelar atau tafsiran. Ungkapan “akan sudah” sengaja dipertahankan walau agak bertanda dalam bahasa Indonesia, sebab paling ringkas mewakili nuansa futur-perfek sumber.
