  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: id
  text: Ia berkata kepada mereka, “Tetapi menurut kalian, siapakah Aku ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Kala kini historis Yunani lazim digunakan dalam narasi. Bahasa Indonesia alami biasanya mengalihkannya dengan bentuk lampau kontekstual “berkata”; kejelasan naratif diutamakan tanpa mengubah peristiwa yang dirujuk.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak ini menunjukkan pihak yang menjadi tujuan perkataan.
- source_word: Ὑμεῖς
  choice: kalian
  rationale: Pronomina jamak eksplisit ini bersifat menegaskan. “Kalian” dengan jelas membedakan para murid dari orang-orang yang pendapatnya disebut sebelumnya.
- source_word: δὲ
  choice: Tetapi
  rationale: Partikel ini menandai pertentangan antara pendapat orang banyak dan penilaian para murid sendiri.
- source_word: τίνα
  choice: siapakah
  rationale: Pronomina tanya ini menanyakan identitas Yesus; “siapakah” sesuai dengan ragam Indonesia yang bermartabat.
- source_word: με ... εἶναι
  choice: Aku ini
  rationale: Konstruksi Yunani akusatif-dan-infinitif dialihkan secara idiomatis ke bentuk kopulatif bahasa Indonesia. “Aku” mempertahankan rujukan orang pertama, sedangkan “ini” membuat pertanyaan identitas terdengar alami.
- source_word: λέγετε
  choice: menurut kalian
  rationale: Secara harfiah berarti “kalian katakan”, tetapi dalam pertanyaan ini maksud idiomatisnya ialah penilaian atau pengakuan mereka. “Menurut kalian” menyampaikan makna itu dengan wajar tanpa menambahkan isi pengakuan.
theological_decisions:
- issue: Penekanan pada penilaian para murid sendiri
  choice: “Tetapi menurut kalian, siapakah Aku ini?”
  alternative: “Tetapi kalian, siapakah yang kalian katakan tentang diri-Ku?”
  rationale: Rumusan terpilih mempertahankan peralihan dari pendapat umum kepada jawaban para murid dan menegaskan bentuk jamak, tanpa mendahului pengakuan teologis yang baru muncul pada ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Kalian” dipilih untuk menyatakan orang kedua jamak secara tegas; “Ia” menjaga ragam naratif formal. Tidak diperlukan catatan kaki karena konstruksi Yunani dapat disampaikan dengan jelas dan wajar dalam teks utama.
