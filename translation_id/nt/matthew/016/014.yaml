  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: id
  text: 'Mereka menjawab, “Ada yang mengatakan[a]: Yohanes Pembaptis, yang lain Elia, dan yang lain lagi Yeremia atau salah seorang nabi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih eksplisit: “Ada yang mengatakan bahwa Engkau adalah Yohanes Pembaptis, yang lain bahwa Engkau adalah Elia, dan yang lain lagi bahwa Engkau adalah Yeremia atau salah seorang nabi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Jawab mereka
  rationale: Dalam konteks pertanyaan pada ayat sebelumnya, bentuk ini alami dalam bahasa Indonesia dan menyampaikan εἶπαν sebagai tanggapan; δέ berfungsi melanjutkan alur tanpa perlu diterjemahkan tersendiri.
- source_word: Οἱ μὲν
  choice: Ada yang mengatakan
  rationale: μέν membuka pembagian beberapa kelompok pendapat. Ungkapan ini alami dan tetap membiarkan objek identifikasi tersirat sebagaimana dalam teks Yunani.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohanes Pembaptis
  rationale: Bentuk nama dan gelar yang baku serta mudah dikenali dalam bahasa Indonesia.
- source_word: ἄλλοι δὲ
  choice: yang lain
  rationale: Melanjutkan rangkaian kelompok pendapat secara alami tanpa melebih-lebihkan daya kontras δέ.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Bentuk nama nabi yang baku dalam bahasa Indonesia.
- source_word: ἕτεροι δὲ
  choice: dan yang lain lagi
  rationale: Menandai kelompok tambahan dalam rangkaian dan membedakannya dengan jelas dari kelompok sebelumnya.
- source_word: Ἰερεμίαν
  choice: Yeremia
  rationale: Bentuk nama nabi yang baku dalam bahasa Indonesia.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: atau salah seorang nabi
  rationale: Menerjemahkan alternatif yang diperkenalkan oleh ἤ tanpa menambahkan kata 'lain', yang tidak dinyatakan secara eksplisit dalam teks Yunani.
theological_decisions:
- issue: Objek yang tersirat dalam berbagai identifikasi
  choice: 'Teks utama mempertahankan ungkapan eliptis: “Ada yang mengatakan Yohanes Pembaptis ...”'
  alternative: “Ada yang mengatakan bahwa Engkau adalah Yohanes Pembaptis ...”
  rationale: Bahasa Yunani hanya mencantumkan berbagai identifikasi dan mengandalkan pertanyaan sebelumnya untuk objeknya. Bahasa Indonesia masih dapat mempertahankan elipsis ini, sementara catatan kaki menjelaskan bentuk yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Jawab mereka” menjaga hubungan dengan pertanyaan sebelumnya; susunan “yang lain ... dan yang lain lagi” membuat rangkaian pendapat mudah dipahami.
