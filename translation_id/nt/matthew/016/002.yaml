  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: id
  text: Ia menjawab dan berkata kepada mereka, “Ketika petang tiba, kamu berkata, ‘Cuaca cerah, karena langit[a] memerah.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “langit” juga dapat berarti “surga”; dalam konteks ini, pepatah tentang cuaca jelas menunjuk pada langit yang terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: menjawab
  rationale: Ungkapan partisipial Yunani ini secara harfiah berarti ‘menjawab dan berkata’, tetapi dalam bahasa Indonesia modern cukup diterjemahkan ‘menjawab’ agar alami tanpa kehilangan fungsi wacananya.
- source_word: Ὀψίας γενομένης
  choice: ketika hari mulai malam
  rationale: Konstruksi genitif absolut ini menyatakan waktu. Pilihan ini alami dalam bahasa Indonesia dan menggambarkan datangnya petang.
- source_word: λέγετε
  choice: kalian berkata
  rationale: Bentuk kini ini mengungkapkan kebiasaan atau ucapan yang lazim. ‘Kalian’ memperjelas bahwa kata ganti Yunani berbentuk jamak.
- source_word: Εὐδία
  choice: cuaca akan cerah
  rationale: Kata ini menunjuk pada cuaca baik atau cerah. Bentuk berorientasi masa depan sesuai dengan fungsi pepatah tersebut sebagai prakiraan berdasarkan keadaan langit.
- source_word: πυρράζει
  choice: memerah
  rationale: Kata kerja ini menggambarkan langit yang tampak merah. ‘Memerah’ ringkas, alami, dan mempertahankan citra aslinya.
- source_word: οὐρανός
  choice: langit
  rationale: Dalam konteks pengamatan cuaca, kata ini menunjuk pada langit yang terlihat, bukan tempat kediaman ilahi.
