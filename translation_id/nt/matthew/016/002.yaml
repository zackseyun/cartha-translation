  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan ‘kalian’ dipakai untuk menandai bentuk jamak secara jelas. Rumusan pepatah dibuat alami tanpa menghilangkan hubungan sebab-akibat dalam teks Yunani.
