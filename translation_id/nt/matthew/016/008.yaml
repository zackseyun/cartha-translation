  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: id
  text: Namun, Yesus mengetahui hal itu dan berkata, “Kalian yang kurang percaya, mengapa kalian berbicara satu sama lain tentang tidak membawa roti[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “kalian tidak mengambil roti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: mengetahui hal itu
  rationale: Partisip aoris ini menyatakan bahwa Yesus mengetahui pembicaraan para murid sebelum menanggapinya; “hal itu” melengkapi objek yang tersirat dari konteks.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras ketika Yesus menanggapi pembicaraan para murid.
- source_word: διαλογίζεσθε ἐν ἑαυτοῖς
  choice: kalian membicarakan di antara kalian
  rationale: Menggambarkan para murid yang sedang memperbincangkan persoalan tersebut satu sama lain, sambil tetap mempertahankan unsur “di antara kalian” dalam bahasa Yunani.
- source_word: ὀλιγόπιστοι
  choice: kalian yang kurang percaya
  rationale: Mempertahankan teguran langsung terhadap kurangnya iman atau kepercayaan para murid tanpa memperluasnya menjadi pernyataan doktrinal.
- source_word: ἄρτους
  choice: roti
  rationale: Dalam bahasa Indonesia, “roti” secara alami dapat berfungsi sebagai nomina kolektif di konteks ini meskipun bentuk Yunani jamak.
- source_word: οὐκ ἐλάβετε
  choice: tidak membawa
  rationale: Secara leksikal berarti “tidak mengambil”, tetapi dalam konteks perjalanan para murid maksudnya ialah tidak membawa roti sebagai bekal.
theological_decisions:
- issue: Daya teguran ὀλιγόπιστοι
  choice: kalian yang kurang percaya
  alternative: kalian yang sedikit imannya
  rationale: Pilihan ini mempertahankan kritik Yesus terhadap kepercayaan para murid yang tidak memadai dalam situasi tersebut, tanpa menentukan apakah istilah itu harus dipahami sebagai ukuran iman secara teknis.
- issue: Hubungan klausa ὅτι ἄρτους οὐκ ἐλάβετε
  choice: 'isi pembicaraan: bahwa mereka tidak membawa roti'
  alternative: 'alasan pembicaraan: karena mereka tidak membawa roti'
  rationale: ὅτι dapat dipahami sebagai penanda isi atau sebab. Susunan kalimat utama mengikuti pembacaan isi pembicaraan, sedangkan bentuk pertanyaannya tetap tidak mengembangkan penafsiran teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pronomina “kalian” dipakai karena Yesus berbicara kepada sekelompok murid. Sapaan teguran dipindahkan ke awal kalimat langsung agar alami dalam bahasa Indonesia, tanpa mengubah cakupannya.
