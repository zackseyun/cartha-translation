  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: id
  text: Bagaimana mungkin kalian tidak mengerti bahwa Aku tidak berbicara kepada kalian tentang roti? Namun, waspadalah terhadap ragi orang Farisi dan Saduki.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berhati-hatilah terhadap ragi orang Farisi dan Saduki.”
    reason: lexical_alternative
  - marker: b
    text: “Ragi” merupakan metafora di sini; dalam ayat berikutnya, ragi itu dijelaskan sebagai ajaran orang Farisi dan Saduki.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Bagaimana mungkin kalian tidak mengerti
  rationale: Pertanyaan retoris ini menegur kegagalan para murid memahami maksud Yesus. Ungkapan “bagaimana mungkin” mempertahankan daya tegur sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: bahwa Aku tidak berbicara kepada kalian tentang roti
  rationale: Walaupun ἄρτων berbentuk jamak, “roti” sebagai nomina umum paling alami dalam konteks ini. “Berbicara ... tentang” menyampaikan εἶπον dan περὶ secara langsung.
- source_word: προσέχετε δὲ
  choice: Namun, waspadalah
  rationale: προσέχετε merupakan perintah untuk berjaga terhadap bahaya, sehingga “waspadalah” lebih tepat daripada sekadar “perhatikanlah”. δέ menandai peralihan korektif yang wajar diterjemahkan “namun”.
- source_word: ἀπὸ τῆς ζύμης
  choice: terhadap ragi
  rationale: Dengan προσέχετε, ἀπό menunjukkan sesuatu yang harus diwaspadai atau dijauhi. “Ragi” adalah padanan Indonesia yang alami dan mempertahankan metafora ζύμη.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: orang Farisi dan Saduki
  rationale: Ini adalah bentuk nama kelompok yang baku dan mudah dipahami dalam bahasa Indonesia. Genitifnya menyatakan ragi yang menjadi ciri atau berasal dari kedua kelompok tersebut.
theological_decisions:
- issue: Daya metaforis ζύμη
  choice: Mempertahankan metafora “ragi” dalam teks utama
  alternative: Menggantikannya dengan “ajaran orang Farisi dan Saduki”
  rationale: Ayat berikutnya menjelaskan bahwa ragi itu menunjuk pada ajaran mereka, tetapi ayat ini sendiri tetap memakai metafora. Mempertahankannya menjaga alur pengungkapan dan ketegangan dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti “kalian” dipakai karena ὑμῖν berbentuk jamak dan Yesus sedang berbicara kepada para murid. Kapitalisasi “Aku” mengikuti konvensi Alkitab bahasa Indonesia bagi ucapan Yesus.
