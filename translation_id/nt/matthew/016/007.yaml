  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: id
  text: Mereka pun berdiskusi di antara mereka sendiri, sambil berkata, “Kita tidak membawa roti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kita tidak mengambil roti bersama kita.”
    reason: λαμβάνω secara harfiah dapat berarti “mengambil”; dalam konteks perjalanan, bentuk utama “membawa” menyampaikan makna yang dimaksud.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka pun
  rationale: δέ merupakan penghubung naratif ringan; “pun” menjaga kesinambungan cerita tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: διελογίζοντο
  choice: membicarakan
  rationale: Bentuk imperfek menggambarkan pembicaraan atau pertimbangan yang sedang berlangsung. “Membicarakan” alami dalam bahasa Indonesia dan sesuai dengan percakapan para murid.
- source_word: ἐν ἑαυτοῖς
  choice: di antara mereka sendiri
  rationale: Frasa ini menunjukkan bahwa pembicaraan berlangsung dalam kelompok mereka sendiri, bukan ditujukan kepada orang lain.
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisipel ini memperkenalkan isi pembicaraan mereka; “dengan berkata” mempertahankan hubungan tersebut secara jelas.
- source_word: Ἄρτους
  choice: roti
  rationale: Walaupun bentuk Yunaninya jamak, dalam konteks ini kata tersebut merujuk secara umum kepada roti sebagai bekal. Bahasa Indonesia lazim memakai “roti” tanpa penanda jamak.
- source_word: οὐκ ἐλάβομεν
  choice: kita tidak membawa
  rationale: Dalam konteks perjalanan dan bekal, λαμβάνω berarti mengambil atau membawa serta. “Tidak membawa” menyampaikan maksud kontekstualnya secara alami.
theological_decisions:
- issue: Apakah ὅτι perlu diterjemahkan sebagai hubungan sebab, misalnya “Ini karena”
  choice: Tidak menambahkan rumusan sebab; ὅτι dipahami sebagai pengantar isi perkataan mereka.
  alternative: “Ini karena kita tidak membawa roti.”
  rationale: Teks Yunani dapat dibaca sebagai memperkenalkan isi pembicaraan secara langsung. Tidak menambahkan “ini karena” menjaga bentuk ringkas sumber dan tidak secara diam-diam menetapkan hubungan logis yang hanya tersirat dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Hal itu” dipakai sebagai pelengkap yang alami bagi verba transitif “membicarakan,” dengan rujukan pada perkataan Yesus dalam konteks sebelumnya; unsur ini tidak dimaksudkan menambah isi teologis.
