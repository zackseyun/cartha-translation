    issue: Teks utama menambahkan “Allah” dalam terjemahan Ἵλεώς σοι.
    rationale: Walaupun unsur ilahi mungkin dipahami dalam idiom tersebut, tidak eksplisit dalam teks Yunani. Karena maknanya diperdebatkan dan eliptis, penambahan itu sebaiknya tidak dijadikan bagian teks utama.
  - severity: low
    issue: “Menarik Yesus ke samping” berpotensi terlalu fisik.
    rationale: προσλαβόμενος dalam konteks ini berarti membawa atau mengajak Yesus secara terpisah; “membawa ... ke samping” mempertahankan nuansa itu dengan lebih netral.
