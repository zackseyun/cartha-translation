  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: id
  text: Lalu Petrus membawa Yesus ke samping dan mulai menegur-Nya[a], sambil berkata, “Kiranya hal itu dijauhkan dari-Mu, Tuhan! Hal itu sama sekali tidak akan terjadi pada-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang menyusul bersifat idiomatis dan eliptis. Dapat juga diterjemahkan, “Jangan sampai hal itu terjadi pada-Mu, Tuhan!” atau, “Kiranya belas kasihan menyertai-Mu, Tuhan!”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: menarik Yesus ke samping
  rationale: Partisip medium ini dalam konteks tersebut menunjukkan bahwa Petrus membawa Yesus menyendiri untuk berbicara kepada-Nya; nama 'Yesus' dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: mulai menegur
  rationale: Mencerminkan konstruksi ingresif ἤρξατο dengan infinitif dan mempertahankan kuatnya tindakan Petrus tanpa memakai ungkapan Indonesia yang berlebihan.
- source_word: Ἵλεώς σοι
  choice: Kiranya Allah menjauhkan hal itu dari-Mu
  rationale: Ungkapan Yunani ini idiomatis dan eliptis. Pilihan ini menyampaikan doa atau harapan agar hal tersebut tidak menimpa Yesus, sedangkan unsur 'Allah' dibuat eksplisit demi kealamian namun dicatat dalam catatan kaki karena tidak disebutkan secara langsung.
- source_word: κύριε
  choice: Tuhan
  rationale: Mempertahankan nilai leksikal dan gema kristologis κύριος sekaligus menjadi sapaan yang wajar dalam bahasa Indonesia.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Hal itu sama sekali tidak akan terjadi pada-Mu
  rationale: Gabungan οὐ μή dengan bentuk futur menyatakan penyangkalan yang sangat tegas; 'sama sekali tidak akan' menyampaikan penekanan itu secara alami.
theological_decisions:
- issue: Cara menerjemahkan protes Petrus tanpa menambahkan kepastian teologis yang tidak dinyatakan teks
  choice: Kiranya Allah menjauhkan hal itu dari-Mu, Tuhan!
  alternative: Jangan sampai hal itu terjadi pada-Mu, Tuhan! / Kiranya belas kasihan menyertai-Mu, Tuhan!
  rationale: Ἵλεώς σοι merupakan ungkapan eliptis yang dapat dipahami sebagai permohonan akan kemurahan ilahi atau penolakan kuat, yakni 'jangan sampai.' Teks utama menyampaikan daya idiomatisnya, sementara catatan kaki menjaga ambiguitas dan menyatakan bahwa kata 'Allah' tersirat, bukan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia. Tanda seru mencerminkan kuatnya protes Petrus.
