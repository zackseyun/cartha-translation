  to: Lalu Petrus membawa Yesus ke samping dan mulai menegur-Nya[a], sambil berkata, “Kiranya hal itu dijauhkan dari-Mu, Tuhan! Hal itu sama sekali tidak akan terjadi pada-Mu.”
  rationale: Revisi menghapus penambahan “Allah” dari teks utama agar ambiguitas idiom Ἵλεώς σοι tetap terjaga, sambil mempertahankan daya permohonan/penolakan yang kuat. Kata kerja pembuka juga dibuat lebih netral dan idiomatis dalam bahasa Indonesia modern.
