review_pass:
  verdict: revise
  source_fidelity: Ungkapan Ἵλεώς σοι bersifat idiomatis dan eliptis; teks utama tidak sebaiknya menyisipkan “Allah” sebagai pelaku, karena kata itu tidak hadir dalam bahasa Yunani. “Kiranya hal itu dijauhkan dari-Mu” menyampaikan permohonan/penolakan idiomatis tanpa penambahan tersebut. “Mulai menegur-Nya” dan “sama sekali tidak akan terjadi pada-Mu” dengan baik mencerminkan ἤρξατο ἐπιτιμᾶν dan negasi tegas οὐ μή.
  naturalness: “Menarik Yesus ke samping” dapat dipahami, tetapi “membawa Yesus ke samping” lebih netral dan lebih alami untuk tindakan mengambil seseorang secara pribadi, tanpa memberi kesan menarik secara fisik. Susunan “sambil berkata” juga lebih lancar dalam narasi Indonesia baku.
  terminology: “Tuhan” tepat untuk κύριε. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan gaya yang dinyatakan. Penanda catatan kaki [a] sudah tertambat pada unsur idiomatis yang tepat.
  issues:
