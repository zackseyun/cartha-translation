id: MAT.16.6
reference: Matthew 16:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: id
  text: Namun, Yesus berkata kepada mereka, “Waspadalah dan berhati-hatilah terhadap ragi[a] orang Farisi dan orang Saduki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ragi di sini dipakai sebagai kiasan; maknanya dijelaskan kemudian dalam ayat 12.
    reason: Menandai penggunaan metaforis tanpa mengganti gambaran yang terdapat dalam teks Yunani.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang disertai kontras ringan dengan konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Mencerminkan verba λέγω beserta objek tak langsungnya secara wajar dan cukup formal.
- source_word: Ὁρᾶτε καὶ προσέχετε
  choice: Waspadalah dan berhati-hatilah
  rationale: Kedua imperatif itu bersama-sama menyampaikan peringatan yang diperkuat. Padanan ini mempertahankan pengulangan retoris tanpa menjadi kaku.
- source_word: ἀπὸ
  choice: terhadap
  rationale: Dengan verba yang menyatakan kewaspadaan, ἀπό paling alami diungkapkan dengan 'terhadap' dalam bahasa Indonesia.
- source_word: ζύμης
  choice: ragi
  rationale: '''Ragi'' adalah padanan Indonesia yang alami dan mempertahankan kiasan dalam teks Yunani tanpa menjelaskannya terlalu dini.'
- source_word: Φαρισαίων
  choice: orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok ini.
- source_word: Σαδδουκαίων
  choice: orang Saduki
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok ini.
theological_decisions:
- issue: Daya kiasan ζύμης
  choice: Mempertahankan 'ragi' sebagai kiasan dalam teks utama
  alternative: Menggantikannya dengan 'ajaran' atau 'pengaruh'
  rationale: Ayat ini sendiri memakai gambaran ragi, sedangkan penjelasannya baru dinyatakan kemudian dalam konteks. Mempertahankan kiasan menghindari penafsiran yang dimasukkan terlalu dini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pasangan imperatif dipertahankan untuk mencerminkan penegasan teks sumber; 'orang Farisi' dan 'orang Saduki' mengikuti pemakaian Alkitabiah Indonesia yang umum.
source_grounding:
  english_pob_role: consult_only
