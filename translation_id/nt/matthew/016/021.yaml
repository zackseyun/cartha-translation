id: MAT.16.21
reference: Matthew 16:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: id
  text: Sejak saat itu, Yesus mulai menunjukkan kepada murid-murid-Nya bahwa Ia harus pergi ke Yerusalem, mengalami banyak penderitaan dari para tua-tua, imam-imam kepala, dan ahli-ahli Taurat, lalu dibunuh dan dibangkitkan pada hari ketiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “bangkit pada hari ketiga.” Teks Yunani memakai bentuk pasif: “dibangkitkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Sejak saat itu
  rationale: Menandai titik balik dalam alur kisah dan awal tahap baru pengajaran Yesus.
- source_word: ἤρξατο δεικνύειν
  choice: mulai menunjukkan
  rationale: Mempertahankan makna permulaan tindakan dan arti dasar 'menunjukkan/membuat jelas' tanpa mempersempitnya menjadi sekadar penjelasan lisan.
- source_word: δεῖ αὐτὸν
  choice: Ia harus
  rationale: Menyampaikan keharusan yang kuat tanpa menjelaskan sumber keharusan itu melebihi bunyi klausa Yunani.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: pergi ke Yerusalem
  rationale: Ungkapan Indonesia yang alami dan tepat untuk gerak menuju Yerusalem.
- source_word: πολλὰ παθεῖν
  choice: mengalami banyak penderitaan
  rationale: Bahasa Indonesia alami yang tetap mencerminkan jamaknya πολλὰ dan beragamnya hal yang diderita.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: dari para tua-tua, imam-imam kepala, dan ahli-ahli Taurat
  rationale: Mempertahankan ἀπό sebagai 'dari' sehingga hubungan sumber atau pelaku tetap tidak diperjelas secara berlebihan.
- source_word: πρεσβυτέρων
  choice: para tua-tua
  rationale: Padanan tradisional dan cukup transparan bagi kelompok pemimpin Yahudi ini.
- source_word: ἀρχιερέων
  choice: imam-imam kepala
  rationale: Menunjuk kelompok pemimpin keimaman, bukan beberapa orang yang sekaligus menjabat sebagai Imam Besar.
- source_word: γραμματέων
  choice: ahli-ahli Taurat
  rationale: Padanan Indonesia yang dikenal luas dan menjelaskan fungsi para ahli kitab hukum Yahudi.
- source_word: ἀποκτανθῆναι
  choice: dibunuh
  rationale: Padanan pasif yang langsung, jelas, dan alami.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: dibangkitkan pada hari ketiga
  rationale: Mempertahankan bentuk pasif dan keterangan waktu dari teks Yunani.
theological_decisions:
- issue: Daya δεῖ dalam pemberitahuan penderitaan Yesus
  choice: Ia harus
  alternative: Ia perlu; sudah semestinya Ia
  rationale: Teks menyatakan keharusan, tetapi dalam klausa ini tidak secara eksplisit menentukan apakah sumbernya adalah ketetapan Allah, penggenapan Kitab Suci, atau hal lain.
- issue: Bentuk pasif ἐγερθῆναι
  choice: dibangkitkan
  alternative: bangkit
  rationale: Bentuk pasif Yunani dipertahankan agar tidak menghapus implikasi adanya pelaku yang membangkitkan, sekaligus tanpa menambahkannya secara eksplisit.
- issue: Cakupan ἀπό pada rangkaian penderitaan dan pembunuhan
  choice: Menempatkan 'dari para tua-tua, imam-imam kepala, dan ahli-ahli Taurat' sesudah 'mengalami banyak penderitaan'
  alternative: Mengalami banyak penderitaan dan dibunuh di tangan para tua-tua, imam-imam kepala, dan ahli-ahli Taurat
  rationale: Susunan utama mengikuti kedekatan sintaksis ἀπό dengan παθεῖν dan tidak memaksakan frasa tersebut untuk secara eksplisit menerangkan 'dibunuh', meskipun konteks memungkinkan para pemimpin itu dipahami sebagai pihak yang menyebabkan keseluruhan penderitaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Istilah 'tua-tua', 'imam-imam kepala', dan 'ahli-ahli Taurat' dipertahankan karena dikenal pembaca Alkitab Indonesia; kalimat tetap dibuat alami dengan 'mengalami banyak penderitaan'.
