  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: id
  text: Sesungguhnya, Aku berkata kepadamu, di antara orang-orang yang berdiri di sini ada beberapa yang pasti tidak akan mengecap kematian sampai mereka melihat Anak Manusia datang dalam kerajaan-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam pemerintahan-Nya” atau “dalam pemerintahan-Nya sebagai raja.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “Anak Manusia datang dalam kerajaan-Nya” dapat menunjuk pada pemuliaan di gunung, kebangkitan dan peninggian-Nya, Pentakosta, penghakiman atas Yerusalem, atau kedatangan-Nya yang terakhir; teks ini sendiri tidak menentukan peristiwa yang dimaksud.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Menyampaikan penegasan khidmat yang mengawali perkataan berwibawa ini dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan bentuk formula yang khidmat; 'kepadamu' dapat menunjuk kepada kelompok dalam bahasa Indonesia.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: di antara orang-orang yang berdiri di sini ada beberapa
  rationale: 'Mengungkapkan dengan jelas makna partitif: beberapa orang dari antara mereka yang hadir dan berdiri di situ.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: pasti tidak akan mengecap kematian
  rationale: Mempertahankan metafora 'mengecap kematian' sekaligus menyatakan kuatnya negasi οὐ μή.
- source_word: ἕως ἂν ἴδωσιν
  choice: sebelum mereka melihat
  rationale: Dalam konstruksi negatif ini, 'sebelum' menyampaikan batas waktu yang dinyatakan oleh ἕως ἄν secara alami dalam bahasa Indonesia.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas ini beserta gema alkitabiah dan apokaliptiknya tanpa parafrasa.
- source_word: ἐρχόμενον
  choice: datang
  rationale: Menerjemahkan partisip yang menerangkan Anak Manusia secara langsung tanpa menambahkan unsur seperti 'dengan kuasa' yang tidak terdapat dalam ayat ini.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: dalam kerajaan-Nya
  rationale: Mempertahankan citra konkret dan istilah kunci βασιλεία, sambil mengakui bahwa kata itu juga dapat menekankan pemerintahan atau kekuasaan sebagai raja.
theological_decisions:
- issue: Rujukan peristiwa dalam ungkapan 'Anak Manusia datang dalam kerajaan-Nya'
  choice: Ungkapan diterjemahkan apa adanya tanpa menentukan satu peristiwa tertentu.
  alternative: Pemuliaan di gunung, kebangkitan dan peninggian, Pentakosta, penghakiman atas Yerusalem, atau kedatangan terakhir.
  rationale: Teks Yunani tidak menentukan rujukannya secara tegas; terjemahan perlu mempertahankan ambiguitas dan ketegangan penafsirannya.
- issue: Cakupan makna βασιλεία
  choice: kerajaan
  alternative: pemerintahan atau kekuasaan-Nya sebagai raja
  rationale: '''Kerajaan'' mempertahankan istilah dan gambaran teks, sedangkan kemungkinan nuansa pemerintahan dijelaskan dalam catatan tanpa mempersempit teks utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora alkitabiah 'mengecap kematian' serta gelar 'Anak Manusia' dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan ditempatkan setelah klausa yang diterangkannya.
