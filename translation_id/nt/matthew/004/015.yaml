  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: id
  text: “Tanah Zebulon dan tanah Naftali, jalan menuju laut, di seberang Sungai Yordan, Galilea bangsa-bangsa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Galilea orang-orang bukan Yahudi.”'
    reason: 'Alternatif kontekstual untuk "bangsa-bangsa" (Yunani: ethne); teks utama mempertahankan cakupan leksikal yang lebih luas.'
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Tanah / tanah
  rationale: Mempertahankan pengulangan dan kesejajaran dalam kutipan; dalam konteks ini menunjuk pada wilayah geografis, bukan bumi atau tanah sebagai bahan.
- source_word: Ζαβουλὼν
  choice: Zebulon
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: ὁδὸν θαλάσσης
  choice: jalan menuju laut
  rationale: Ungkapan yang alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan bahwa frasa ini menunjuk pada sebuah jalur atau wilayah yang terkait dengan laut.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: di seberang Sungai Yordan
  rationale: Menyampaikan idiom geografis Yunani tanpa menentukan sudut pandang secara lebih sempit; penambahan 'Sungai' memperjelas nama geografis bagi pembaca umum.
- source_word: Γαλιλαία
  choice: Galilea
  rationale: Bentuk baku nama wilayah tersebut dalam bahasa Indonesia.
- source_word: τῶν ἐθνῶν
  choice: wilayah bangsa-bangsa lain
  rationale: ἐθνῶν dapat berarti bangsa-bangsa dan, dalam konteks Yahudi, orang-orang bukan Yahudi. Ungkapan ini menyampaikan kontras etnoreligius secara wajar tanpa istilah teknis yang kurang umum.
theological_decisions:
- issue: Makna ἐθνῶν dalam kutipan Yesaya
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa; orang-orang bukan Yahudi
  rationale: Dalam konteks Matius, frasa ini mengaitkan Galilea dengan penduduk non-Yahudi, tetapi bentuk Yunani tetap secara harfiah berarti 'bangsa-bangsa'. Pilihan ini mempertahankan kedua nuansa tanpa mengunci maknanya pada istilah teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Struktur puitis kutipan dipertahankan, termasuk rangkaian nama wilayah dan tanda pisah yang menunjukkan kalimat berlanjut ke ayat berikutnya.
