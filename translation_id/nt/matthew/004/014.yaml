  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: id
  text: 'supaya apa yang telah disampaikan melalui nabi Yesaya terpenuhi, yang berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan maksud atau hasil. “Supaya” alami dalam bahasa Indonesia modern dan mempertahankan daya teleologis klausa tersebut.
- source_word: πληρωθῇ
  choice: genaplah
  rationale: Bentuk aoris pasif subjungtif dari πληρόω. Dalam rumusan khas Matius, “genaplah” secara wajar mempertahankan gagasan penggenapan Kitab Suci; bentuk pasifnya dapat dipahami dari konstruksi bahasa Indonesia ini tanpa menyebut pelaku.
- source_word: τὸ ῥηθὲν
  choice: apa yang telah disampaikan
  rationale: Artikel netral dengan partisip pasif berfungsi substantival. “Apa yang telah disampaikan” alami dan menunjukkan bahwa perkataan itu mendahului peristiwa yang sedang diceritakan.
- source_word: διὰ
  choice: melalui
  rationale: Dengan genetif dan perantara manusia, διά menyatakan perantaraan atau agensi. “Melalui” mempertahankan peran Yesaya sebagai penyampai nubuat.
- source_word: Ἠσαΐου
  choice: Yesaya
  rationale: Bentuk nama nabi yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: τοῦ προφήτου
  choice: Nabi
  rationale: Keterangan aposisional yang mengenali peran Yesaya. Dipertahankan secara eksplisit; kapitalisasi mengikuti pemakaian gelar yang melekat pada nama dalam bahasa Indonesia.
- source_word: λέγοντος
  choice: 'yang berkata:'
  rationale: Partisip kini aktif yang memperkenalkan kutipan berikutnya. “Yang berkata:” lebih alami daripada partisip harfiah dan tetap mengaitkan perkataan dengan Nabi Yesaya.
theological_decisions:
- issue: Rumusan penggenapan dalam Matius
  choice: Menerjemahkan πληρωθῇ dengan “genaplah” dan mempertahankan motif penggenapan secara eksplisit.
  alternative: “menjadi kenyataan” atau “terpenuhilah”
  rationale: Matius sengaja memakai bahasa penggenapan yang terkait dengan Kitab Suci. “Genaplah” mempertahankan kaitan tekstual dan teologis itu tanpa menambahkan penafsiran mengenai cara atau lingkup penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan rumusan penggenapan, perantaraan Yesaya, dan pengantar menuju kutipan langsung.
