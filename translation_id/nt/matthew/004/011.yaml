id: MAT.4.11
reference: Matthew 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: id
  text: Kemudian Iblis meninggalkan Dia. Dan lihatlah, malaikat-malaikat datang dan melayani Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “datang dan terus melayani Dia.” Bentuk kata kerja Yunani dapat menyiratkan tindakan yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan waktu dalam narasi secara alami dalam bahasa Indonesia.
- source_word: ἀφίησιν
  choice: meninggalkan
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia; dalam konteks ini berarti Iblis pergi meninggalkan Yesus.
- source_word: αὐτὸν / αὐτῷ
  choice: Dia
  rationale: Kedua pronomina merujuk kepada Yesus. Huruf kapital mengikuti kelaziman penerbitan Alkitab bahasa Indonesia untuk pronomina ilahi, tanpa menambah unsur yang tidak ada dalam sumber.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks kisah pencobaan, istilah ini berfungsi sebagai sebutan pribadi bagi lawan yang mencobai Yesus; 'Iblis' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian pembaca pada perkembangan yang mendadak.
- source_word: ἄγγελοι
  choice: malaikat-malaikat
  rationale: Konteks menunjukkan makhluk surgawi, bukan sekadar utusan manusia; bentuk ulang menyatakan jamak secara jelas.
- source_word: προσῆλθον
  choice: datang
  rationale: Padanan ringkas dan alami untuk tindakan datang atau mendekat.
- source_word: διηκόνουν
  choice: melayani
  rationale: Mencakup makna memberi pelayanan atau pertolongan. Bentuk imperfek menyiratkan tindakan yang berlangsung, tetapi bahasa Indonesia tidak wajib menandainya secara gramatikal.
theological_decisions:
- issue: Identitas ὁ διάβολος dalam kisah pencobaan
  choice: Iblis
  alternative: pemfitnah
  rationale: Di sini kata tersebut merupakan sebutan bagi tokoh pribadi yang mencobai Yesus. Padanan harfiah 'pemfitnah' dapat mengaburkan rujukannya.
- issue: Nuansa aspek διηκόνουν
  choice: melayani
  alternative: terus melayani / sedang melayani
  rationale: Terjemahan utama dibiarkan alami dalam bahasa Indonesia, sementara kemungkinan nuansa tindakan berkelanjutan dijelaskan dalam catatan tanpa menentukan bentuk atau isi pelayanan secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Dan lihatlah' dipertahankan untuk membawa daya penarik perhatian dari καὶ ἰδοὺ. Tanda titik memisahkan dua perkembangan naratif agar jelas, tanpa mengubah hubungan koordinatifnya.
source_grounding:
  english_pob_role: consult_only
