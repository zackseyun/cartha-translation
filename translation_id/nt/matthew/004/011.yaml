  source_fidelity: 'Teks menerjemahkan seluruh unsur Yunani dengan setia: τότε sebagai “Kemudian”; ἀφίησιν dalam bentuk naratif sebagai “meninggalkan”; ὁ διάβολος sebagai “Iblis”; serta καὶ ἰδοὺ sebagai “Dan lihatlah.” “Malaikat-malaikat datang dan melayani Dia” secara memadai mencerminkan ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ. Bentuk imperfek διηκόνουν tidak harus ditandai secara wajib dalam bahasa Indonesia, dan nuansa duratifnya dicatat.'
