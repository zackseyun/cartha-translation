  terminology: “Iblis” dan “malaikat-malaikat” adalah istilah yang lazim dan tepat dalam konteks ini. “Melayani” mempertahankan keluasan makna διακονέω tanpa menentukan bentuk pelayanan. Kapitalisasi “Dia” konsisten dengan konvensi penerbitan yang dinyatakan dalam draf.
