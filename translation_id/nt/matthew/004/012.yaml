  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: id
  text: Ketika mendengar bahwa Yohanes telah diserahkan[a], Yesus menyingkir ke Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih khusus dalam konteks ini, “telah ditangkap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Ketika mendengar
  rationale: Partisip aoris ini berfungsi temporal terhadap verba utama. Bentuk ini alami dalam bahasa Indonesia; subjeknya, Yesus, dibuat eksplisit pada klausa utama demi kejelasan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung naratif ringan. Dalam bahasa Indonesia, peralihan ini sudah mengalir alami tanpa kata penghubung tambahan; menerjemahkannya sebagai “tetapi” akan memberi kesan kontras yang terlalu kuat.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: παρεδόθη
  choice: telah diserahkan
  rationale: Bentuk pasif παραδίδωμι memiliki arti lebih luas daripada istilah teknis untuk penangkapan. “Telah diserahkan” mempertahankan keluasan dan kemungkinan gaung leksikalnya, sedangkan konteks dapat menunjuk secara lebih khusus pada penangkapan.
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: ἀναχωρέω di sini menyatakan pergi atau mengundurkan diri sebagai tanggapan terhadap keadaan. “Menyingkir” mempertahankan nuansa itu tanpa menyiratkan ketakutan secara berlebihan.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: “Ke” menyampaikan arah gerak εἰς secara alami dalam bahasa Indonesia; “masuk ke Galilea” akan terasa terlalu menekankan batas wilayah.
theological_decisions:
- issue: Makna παραδίδωμι sehubungan dengan Yohanes
  choice: telah diserahkan
  alternative: telah ditangkap
  rationale: Teks utama mempertahankan cakupan leksikal verba Yunani dan kemungkinan gaung istilah yang sama di bagian lain Matius, tanpa menentukan pelaku atau mekanisme penyerahan. Makna kontekstual yang lebih khusus dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Yesus” dinyatakan pada klausa utama untuk menghindari subjek tersirat yang kurang alami atau ambigu dalam bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
