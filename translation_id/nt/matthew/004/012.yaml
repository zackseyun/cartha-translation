  source_fidelity: 'Terjemahan secara tepat mencerminkan struktur dan makna inti teks Yunani: partisip temporal Ἀκούσας diterjemahkan sebagai “Ketika mendengar”; παρεδόθη dipertahankan dalam bentuk pasif yang luas melalui “telah diserahkan”; ἀνεχώρησεν diterjemahkan dengan nuansa responsif sebagai “menyingkir”; dan εἰς τὴν Γαλιλαίαν diterjemahkan alami sebagai “ke Galilea.” Subjek Yesus yang tersirat dalam Yunani dijelaskan secara wajar pada klausa utama tanpa menambah makna.'
