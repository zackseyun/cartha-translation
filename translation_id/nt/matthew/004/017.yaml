  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: id
  text: Sejak saat itu, Yesus mulai memberitakan[c], “Bertobatlah, sebab Kerajaan Surga[b] sudah dekat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah mendekat” atau “sudah datang mendekat.” Bentuk perfektum Yunani menekankan bahwa Kerajaan itu telah mendekat dan tetap dekat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kerajaan surga-surga.” Matius kerap memakai ungkapan ini, sedangkan bagian lain sering memakai “Kerajaan Allah.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “memberitakan dan berkata.” Dalam bahasa Indonesia, kutipan langsung secara alami menyatakan isi pemberitaan itu.
    reason: source_form
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Sejak saat itu
  rationale: Menandai titik peralihan dalam narasi dan secara alami menyiratkan bahwa pelayanan pemberitaan Yesus berlangsung mulai saat itu.
- source_word: ἤρξατο
  choice: mulai
  rationale: Padanan langsung dan wajar untuk bentuk verba yang diikuti kegiatan pemberitaan.
- source_word: κηρύσσειν
  choice: memberitakan
  rationale: Menyampaikan gagasan pengumuman di depan umum tanpa membatasinya pada khotbah dalam konteks ibadah.
- source_word: καὶ λέγειν
  choice: dinyatakan secara idiomatis melalui kutipan langsung
  rationale: Dalam konteks ini, verba kedua memperkenalkan isi pemberitaan. Bahasa Indonesia alami tidak perlu mengulang ‘dan berkata’; nuansanya dicatat dalam catatan kaki.
- source_word: Μετανοεῖτε
  choice: Bertobatlah
  rationale: Mencakup perubahan pikiran, arah hidup, dan tindakan sebagai tanggapan terhadap pemerintahan Allah, tanpa mempersempitnya menjadi perubahan intelektual saja.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfektum Yunani menunjukkan bahwa kedekatan itu telah tiba dan tetap berlaku. ‘Sudah dekat’ alami dalam bahasa Indonesia dan mempertahankan hasil yang kini berlaku.
- source_word: βασιλεία
  choice: Kerajaan
  rationale: Padanan yang dikenal luas dan tetap dapat mencakup pemerintahan atau kekuasaan kerajaan, bukan hanya wilayah.
- source_word: τῶν οὐρανῶν
  choice: Surga
  rationale: Bentuk Yunani secara harfiah jamak, tetapi bentuk tunggal merupakan ungkapan idiomatis dalam bahasa Indonesia dan mempertahankan istilah khas Matius.
theological_decisions:
- issue: Makna βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  alternative: pemerintahan surga; Kerajaan segala surga
  rationale: Mempertahankan ungkapan khas Matius dalam bentuk Indonesia yang dikenal, sambil tidak menentukan apakah βασιλεία terutama menunjuk pada pemerintahan atau wilayah.
- issue: Daya perintah Μετανοεῖτε
  choice: Bertobatlah
  alternative: Berbaliklah; ubahlah pikiranmu
  rationale: ‘Bertobatlah’ mempertahankan bobot moral dan rohani dari perintah tersebut tanpa membatasinya pada perubahan pikiran atau memasukkan rumusan doktrinal tertentu.
- issue: Aspek perfektum ἤγγικεν
  choice: sudah dekat
  alternative: telah mendekat; sudah datang mendekat
  rationale: Pilihan ini menunjukkan keadaan dekat yang kini berlaku, tetapi tidak menetapkan secara teologis cara atau tahap kedatangan Kerajaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Sejak saat itu’ menandai peralihan naratif; ‘memberitakan’ mudah dipahami tanpa nuansa gerejawi yang terlalu khusus. Kapitalisasi ‘Kerajaan Surga’ dipakai sebagai sebutan khas dalam konteks ini.
