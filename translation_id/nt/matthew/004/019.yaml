  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Mari, ikutlah Aku, dan Aku akan menjadikan kalian penjala manusia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Indonesia tidak menandai kala secara morfologis; dalam konteks narasi, “berkata” menyampaikan present historis Yunani secara alami tanpa memaksakan penanda waktu.
- source_word: Δεῦτε ὀπίσω μου
  choice: Mari, ikutlah Aku
  rationale: Ungkapan ini menggabungkan seruan untuk datang dengan gerak mengikuti Yesus. Terjemahan tersebut alami dalam bahasa Indonesia serta mempertahankan daya ajakan dan makna pemuridan.
- source_word: ποιήσω ὑμᾶς
  choice: Aku akan menjadikan kalian
  rationale: Bentuk futurum menyatakan tindakan Yesus yang dijanjikan, sedangkan “kalian” memperjelas bahwa kata ganti Yunani itu jamak.
- source_word: ἁλιεῖς
  choice: penjala
  rationale: “Penjala” mempertahankan gambaran pekerjaan menangkap ikan dan cocok dengan metafora yang dilanjutkan oleh objek “manusia.”
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Dalam konteks ini, bentuk jamak ἄνθρωπος merujuk kepada umat manusia secara umum. Kata Indonesia “manusia” secara tepat mencakup laki-laki dan perempuan tanpa menghilangkan bentuk metaforis sumber.
theological_decisions:
- issue: Makna metafora ἁλιεῖς ἀνθρώπων
  choice: penjala manusia
  alternative: orang yang menjala manusia
  rationale: “Penjala manusia” mempertahankan metafora ringkas dari teks Yunani dan janji bahwa Yesus sendiri akan membentuk para murid bagi tugas tersebut, tanpa menjelaskan secara berlebihan bagaimana metafora itu harus diterapkan.
- issue: Cakupan ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: Kata “manusia” secara alami menyatakan cakupan umum seluruh umat manusia dalam bahasa Indonesia dan tidak mengimpor pembatasan gender yang tidak dimaksudkan dalam konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Ia” dipakai untuk narasi, sedangkan “Aku” mengikuti ujaran langsung Yesus. “Kalian” dipilih untuk menandai bentuk jamak secara terang; metafora tradisional “penjala manusia” dipertahankan karena tetap mudah dipahami.
