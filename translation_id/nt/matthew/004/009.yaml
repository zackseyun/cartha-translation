base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: id
  text: Dan ia berkata kepada-Nya, “Semua ini akan kuberikan kepada-Mu, jika Engkau sujud dan menyembah aku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud kepadaku” atau “memberi hormat kepadaku.” Kata kerja Yunani ini dapat berarti bersujud atau memberi penghormatan, tetapi dalam konteks ini makna “menyembah” lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi ini, καί menghubungkan tindakan berikutnya; “Lalu” alami dalam bahasa Indonesia tanpa memberi urutan waktu yang lebih kuat daripada konteks.
- source_word: εἶπεν αὐτῷ
  choice: ia berkata kepada-Nya
  rationale: Mempertahankan pronomina dalam teks Yunani. Huruf kapital pada pronomina objek mengikuti kebiasaan penghormatan dalam bahasa Indonesia karena acuannya adalah Yesus, tanpa menambahkan nama yang tidak terdapat dalam klausa.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Semua ini akan kuberikan kepada-Mu
  rationale: “Semua ini” secara alami mempertahankan cakupan πάντα dan rujukan demonstratif Ταῦτα kepada kerajaan-kerajaan serta kemegahannya pada ayat sebelumnya. Bentuk “akan kuberikan” menyampaikan futurum dan objek tak langsung secara idiomatis.
- source_word: ἐὰν
  choice: jika
  rationale: Padanan langsung dan wajar untuk penanda syarat.
- source_word: πεσὼν
  choice: sujud
  rationale: Dalam konteks προσκυνέω, bentuk ini menyatakan tindakan merendahkan tubuh atau menjatuhkan diri. “Sujud” menangkap gambaran jasmaninya secara alami, tanpa perlu terjemahan kaku “jatuh ke bawah”.
- source_word: προσκυνήσῃς μοι
  choice: menyembah aku
  rationale: Konteks pencobaan dan jawaban Yesus pada ayat berikutnya memberi tindakan ini bobot ibadah. “Menyembah aku” mengungkapkan tuntutan itu dengan jelas, sementara keluasan makna leksikal dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna προσκυνέω dalam tuntutan Iblis kepada Yesus
  choice: menyembah aku
  alternative: bersujud kepadaku; memberi hormat kepadaku
  rationale: Jawaban Yesus pada ayat berikutnya menegaskan bahwa penyembahan hanya patut diberikan kepada Allah, sehingga konteks mendukung makna religius “menyembah”. Namun, karena verba Yunani juga dapat menunjuk pada tindakan bersujud atau memberi penghormatan, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan kepada Yesus memakai pronomina berhuruf kapital sesuai konvensi umum terjemahan Alkitab Indonesia; ucapan Iblis tentang dirinya sendiri tetap memakai “aku” dengan huruf kecil.
