id: MAT.4.21
reference: Matthew 4:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: id
  text: Setelah melanjutkan perjalanan dari sana, Yesus melihat dua saudara laki-laki lain, Yakobus anak Zebedeus dan Yohanes, saudaranya, yang sedang berada di dalam perahu bersama Zebedeus, ayah mereka, sambil memperbaiki jala mereka. Lalu Yesus memanggil mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Setelah pergi dari sana
  rationale: Partisip aoris προβὰς menyatakan gerak maju dari tempat sebelumnya, sedangkan ἐκεῖθεν berarti 'dari sana'. Bentuk ini alami dalam narasi Indonesia dan tidak menambahkan jarak atau tujuan yang tidak disebutkan.
- source_word: εἶδεν
  choice: melihat
  rationale: Padanan langsung dan wajar bagi bentuk aoris naratif dari ὁράω; tidak ditinggikan menjadi 'memperhatikan' atau 'menjumpai'.
- source_word: ἄλλους δύο ἀδελφούς
  choice: dua saudara lainnya
  rationale: ἄλλους menunjukkan bahwa pasangan ini merupakan tambahan pada dua saudara yang disebut sebelumnya; 'saudara' di sini jelas menunjuk pada saudara laki-laki berdasarkan nama dan konteks.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Yakobus anak Zebedeus
  rationale: Genitif identifikasi menyatakan hubungan anak dan ayah. 'Yakobus' dan 'Zebedeus' adalah bentuk nama yang mapan dalam Alkitab bahasa Indonesia.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Yohanes saudaranya
  rationale: αὐτοῦ paling alami merujuk kepada Yakobus; susunan ini ringkas dan jelas dalam bahasa Indonesia.
- source_word: ἐν τῷ πλοίῳ
  choice: di dalam perahu
  rationale: πλοῖον dalam konteks penangkapan ikan menunjuk pada perahu, bukan kapal besar.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: bersama Zebedeus, ayah mereka
  rationale: μετά dengan genitif menyatakan kebersamaan. Aposisi 'ayah mereka' mempertahankan identifikasi eksplisit dalam teks Yunani.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: sedang memperbaiki jala mereka
  rationale: καταρτίζω berarti membuat sesuatu kembali layak atau lengkap; dalam konteks jala, 'memperbaiki' lebih tepat dan umum daripada istilah yang dapat menyiratkan sekadar persiapan.
- source_word: ἐκάλεσεν αὐτούς
  choice: memanggil mereka
  rationale: καλέω diterjemahkan secara sederhana sebagai 'memanggil'. Konteks menyiratkan panggilan menjadi murid, tetapi objek atau tujuan panggilan tidak dieksplisitkan dalam ayat ini.
theological_decisions:
- issue: Implikasi pemuridan dalam ἐκάλεσεν
  choice: Yesus memanggil mereka
  alternative: Yesus memanggil mereka untuk mengikuti-Nya
  rationale: Konteks dekat menunjukkan panggilan untuk mengikuti Yesus, tetapi teks ayat ini hanya menyatakan bahwa ia memanggil mereka. Terjemahan tidak menambahkan isi panggilan yang dibiarkan tersirat.
- issue: Subjek tersirat pada verba orang ketiga tunggal
  choice: Nama 'Yesus' dinyatakan pada awal dan akhir kalimat
  alternative: Menggunakan 'Ia' atau 'dia' sesuai bentuk Yunani yang hanya menyiratkan subjek
  rationale: Subjek Yunani tersirat dan merujuk kepada Yesus dari konteks. Penyebutan nama dalam bahasa Indonesia mencegah ambiguitas akibat hadirnya beberapa tokoh laki-laki, tanpa mengubah referen.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar referen dan tindakan jelas. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas penting yang perlu ditampilkan kepada pembaca dalam ayat ini.
