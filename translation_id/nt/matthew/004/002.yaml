  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: id
  text: Setelah berpuasa selama empat puluh hari dan empat puluh malam, kemudian Dia merasa lapar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesudah berpuasa empat puluh hari dan empat puluh malam, kemudian Dia menjadi lapar.”
    reason: Alternatif ini menampilkan ἐπείνασεν dengan nuansa inkoatif, yaitu mulainya keadaan lapar.
lexical_decisions:
- source_word: νηστεύσας
  choice: setelah berpuasa
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Frasa ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: selama empat puluh hari dan empat puluh malam
  rationale: Bentuk akusatif menyatakan rentang waktu; kata 'selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
- source_word: ὕστερον
  choice: akhirnya
  rationale: Adverbia ini menandai keadaan yang terjadi sesudah masa puasa. 'Akhirnya' mempertahankan urutan waktu tanpa mengulang kata 'setelah' secara kaku.
- source_word: ἐπείνασεν
  choice: Dia merasa lapar
  rationale: Ungkapan ini menyampaikan secara wajar bahwa Yesus sungguh mengalami lapar setelah berpuasa, tanpa gaya arkais.
- source_word: καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam konteks ayat tunggal, hubungan naratifnya telah tersampaikan secara alami oleh klausa 'Setelah...'; menerjemahkannya sebagai 'dan' akan terasa kurang luwes dalam bahasa Indonesia.
theological_decisions:
- issue: Penekanan naratif pada kebutuhan manusiawi Yesus sesudah berpuasa
  choice: Dia merasa lapar
  alternative: Dia menjadi lapar
  rationale: Pilihan ini secara jelas menyampaikan pengalaman lapar yang nyata tanpa menjadikannya pernyataan doktrinal yang melampaui makna leksikal ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Dia' dipakai sebagai konvensi penghormatan bagi Yesus. Penanda catatan kaki ditempatkan langsung sesudah kalimat yang diterangkannya.
