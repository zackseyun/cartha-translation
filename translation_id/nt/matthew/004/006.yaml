id: MAT.4.6
reference: Matthew 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: id
  text: 'Lalu ia berkata kepada-Nya, “Jika Engkau Anak Allah, lemparkanlah diri-Mu ke bawah[a], sebab ada tertulis: ‘Ia akan memberi perintah kepada malaikat-malaikat-Nya tentang Engkau,’ dan ‘Mereka akan menatang Engkau di atas tangan mereka[b], agar kaki-Mu jangan sampai terantuk batu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terjunkanlah diri-Mu ke bawah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mereka akan menopang Engkau di atas tangan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini Yunani berfungsi sebagai present historis dalam narasi; bahasa Indonesia secara alami dapat memakai verba tanpa penandaan kala.
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk tantangan bersyarat tanpa mengubahnya menjadi pernyataan ‘karena’ atau ‘memang’.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Anak Allah
  rationale: Dalam konteks Matius, frasa ini berfungsi sebagai gelar kristologis; bentuk ini juga merupakan ungkapan gelar yang wajar dalam bahasa Indonesia.
- source_word: βάλε σεαυτὸν κάτω
  choice: terjunkanlah diri-Mu ke bawah
  rationale: Menyampaikan perintah untuk melemparkan diri dari tempat tinggi dengan bahasa Indonesia modern dan jelas.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku untuk kutipan Kitab Suci yang mempertahankan nuansa bahwa teks itu telah tertulis dan tetap berlaku.
- source_word: ἐντελεῖται
  choice: Ia akan memberi perintah
  rationale: Menunjukkan perintah berotoritas dan mempertahankan bentuk waktu mendatang dari sumber.
- source_word: περὶ σοῦ
  choice: tentang Engkau
  rationale: Padanan langsung bagi περί dengan genitif, tanpa menambahkan tujuan perlindungan yang tidak terdapat dalam kutipan Matius ini.
- source_word: ἐπὶ χειρῶν
  choice: di atas tangan mereka
  rationale: Mempertahankan gambaran seseorang yang ditopang pada tangan para malaikat.
- source_word: ἀροῦσίν σε
  choice: Mereka akan menatang Engkau
  rationale: ‘Menatang’ secara alami menggambarkan mengangkat dan menopang dengan tangan; pilihan lain dicatat dalam catatan kaki.
- source_word: μήποτε προσκόψῃς πρὸς λίθον
  choice: agar kaki-Mu jangan sampai terantuk batu
  rationale: Mengungkapkan maksud pencegahan μήποτε dan benturan kaki dengan batu secara idiomatis dalam bahasa Indonesia.
- source_word: τὸν πόδα σου
  choice: kaki-Mu
  rationale: Mempertahankan bentuk tunggal sumber Yunani.
theological_decisions:
- issue: Daya kristologis gelar υἱὸς ... τοῦ θεοῦ dalam tantangan si pencoba
  choice: Diterjemahkan sebagai gelar ‘Anak Allah’
  alternative: ‘seorang anak Allah’
  rationale: Dalam alur Matius, frasa ini menunjuk pada gelar yang dikenali, bukan sekadar anggota suatu golongan; terjemahan tidak menambahkan uraian doktrinal di luar teks.
- issue: Iblis mengutip Mazmur 91
  choice: Kutipan diterjemahkan sebagaimana diucapkan tanpa koreksi atau keterangan tafsir dalam teks utama
  alternative: Menambahkan penjelasan dalam teks bahwa kutipan itu disalahgunakan
  rationale: Teks menampilkan si pencoba mengutip Kitab Suci; ketegangan naratif dan teologis itu perlu dipertahankan tanpa menyisipkan tafsir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti yang merujuk kepada Yesus dan Allah memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Struktur kutipan dipertahankan, termasuk penghilangan frasa Mazmur 91 yang memang tidak muncul dalam teks Yunani Matius.
