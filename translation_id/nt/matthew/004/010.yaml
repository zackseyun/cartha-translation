reference: Matthew 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: id
  text: Kemudian Yesus berkata kepadanya, “Pergilah, Iblis! Sebab ada tertulis, ‘Engkau harus menyembah[a] Tuhan, Allahmu, dan hanya kepada Dia engkau harus beribadah.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud di hadapan Tuhan, Allahmu.” Kata kerja Yunani ini secara lebih harfiah dapat berarti bersujud atau membungkuk dengan penuh hormat.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “beribadah” dapat secara khusus menunjuk pada pelayanan suci atau keagamaan yang dipersembahkan kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam narasi secara alami dan ringkas dalam bahasa Indonesia.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani berfungsi menghidupkan narasi; bahasa Indonesia baku lebih alami memakai bentuk netral “berkata” tanpa penandaan kala.
- source_word: Ὕπαγε
  choice: Pergilah
  rationale: Imperatif ini merupakan perintah tegas untuk pergi; partikel -lah menyampaikan daya perintah dengan wajar dan bermartabat.
- source_word: Σατανᾶ
  choice: Iblis
  rationale: Padanan baku bahasa Indonesia untuk nama atau gelar Σατανᾶ dalam konteks ini.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Mempertahankan rumusan tetap yang memperkenalkan kutipan Kitab Suci dan nuansa keadaan hasil dari bentuk perfect pasif.
- source_word: Κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: 'Mencerminkan konstruksi aposisional: Tuhan yang dimaksud ialah Allahmu. Koma memperjelas hubungan tersebut tanpa menambahkan tafsiran.'
- source_word: προσκυνήσεις
  choice: engkau harus menyembah
  rationale: Dalam konteks pengabdian kepada Allah, “menyembah” menyampaikan makna religius utama; nuansa harfiah bersujud dicatat dalam catatan kaki.
- source_word: αὐτῷ μόνῳ
  choice: hanya kepada Dia
  rationale: Urutan ini secara alami menegaskan bahwa Dia sajalah penerima ibadah; “kepada” juga sesuai dengan objek datif dari λατρεύω.
- source_word: λατρεύσεις
  choice: engkau harus beribadah
  rationale: “Beribadah” mempertahankan nuansa pelayanan religius atau sakral dan tetap membedakannya dari προσκυνέω, “menyembah”.
theological_decisions:
- issue: Pembedaan προσκυνέω dan λατρεύω
  choice: Menerjemahkan προσκυνήσεις sebagai “menyembah” dan λατρεύσεις sebagai “beribadah”
  alternative: Menerjemahkan keduanya dengan istilah “menyembah”, atau menerjemahkan προσκυνήσεις sebagai “bersujud” dan λατρεύσεις sebagai “melayani”
  rationale: Teks Yunani memakai dua kata kerja yang berkaitan tetapi berbeda. Pilihan ini menjaga perbedaan antara tindakan penyembahan dan ibadah atau pelayanan religius, tanpa menentukan teologi yang lebih sempit daripada teks.
- issue: Cakupan penegasan μόνῳ
  choice: “hanya kepada Dia engkau harus beribadah”
  alternative: “kepada Dia saja engkau harus beribadah” atau “engkau harus beribadah hanya kepada Dia”
  rationale: Semua alternatif menempatkan eksklusivitas pada pribadi yang menerima ibadah. Bentuk terpilih alami dalam bahasa Indonesia dan mempertahankan penekanan Yunani pada αὐτῷ μόνῳ.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas dan bermartabat. Kata ganti “engkau” dipakai dalam kutipan Kitab Suci karena jelas, tunggal, dan sesuai dengan register tinggi tanpa menjadi arkais. Huruf kapital pada “Dia” mengikuti kebiasaan editorial Indonesia untuk rujukan kepada Allah.
