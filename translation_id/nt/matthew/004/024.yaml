  source_fidelity: 'Terjemahan menyampaikan seluruh unsur teks Yunani dengan tepat: kabar tentang Yesus tersebar ke seluruh Siria; orang-orang membawa kepada-Nya semua yang sakit, termasuk yang menderita beragam penyakit dan penderitaan, yang dikuasai roh-roh jahat, yang mengalami kejang-kejang, dan yang lumpuh; lalu Ia menyembuhkan mereka. Pemecahan kalimat tidak mengubah relasi maupun urutan pokok dalam sumber.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. Bentuk "membawa kepada-Nya" dan penggunaan titik dua efektif untuk menjelaskan rangkaian kelompok yang termasuk di antara orang sakit, tanpa menghilangkan gaya naratif yang bermartabat.
  terminology: '"Siria" sesuai penggunaan Alkitab Indonesia untuk wilayah kuno ini. "Orang-orang yang dikuasai roh-roh jahat" mempertahankan rujukan adikodrati δαιμονιζομένους tanpa memaksakan kategori klinis atau doktrinal yang lebih sempit; alternatif "kerasukan" dicatat. "Mengalami kejang-kejang" merupakan padanan modern yang wajar bagi σεληνιαζομένους, sedangkan catatan kaki dengan tepat mempertahankan latar harfiah dan tradisional istilah tersebut.'
