id: MAT.4.24
reference: Matthew 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: id
  text: 'Kabar tentang Dia pun tersebar ke seluruh Siria. Orang-orang membawa kepada-Nya semua orang yang sakit, yang menderita berbagai penyakit dan siksaan: orang-orang yang dikuasai roh-roh jahat,[a] orang-orang yang mengalami kejang-kejang,[b] dan orang-orang lumpuh. Lalu Ia menyembuhkan mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang kerasukan roh-roh jahat.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya secara harfiah berkaitan dengan orang yang dianggap dipengaruhi bulan; secara tradisional diterjemahkan “penderita epilepsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: kabar tentang Dia
  rationale: Dalam konteks ini berarti kabar yang terdengar dan beredar mengenai Yesus, bukan kemampuan mendengar.
- source_word: ἀπῆλθεν
  choice: tersebar
  rationale: Menyampaikan metafora gerak dalam bahasa Yunani secara alami dalam bahasa Indonesia ketika subjeknya adalah kabar.
- source_word: Συρίαν
  choice: Siria
  rationale: Bentuk nama wilayah yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: κακῶς ἔχοντας
  choice: semua orang yang sakit
  rationale: Ungkapan idiomatis Yunani ini menunjuk kepada orang-orang yang berada dalam keadaan tidak sehat.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: yang menderita berbagai penyakit dan siksaan
  rationale: Mencakup keragaman penyakit serta penderitaan berat; 'menderita' menghasilkan ungkapan Indonesia yang wajar tanpa mengurangi intensitas βασάνοις.
- source_word: δαιμονιζομένους
  choice: orang-orang yang dikuasai roh-roh jahat
  rationale: Menegaskan sumber adikodrati penderitaan tanpa memaksakan kategori teknis modern yang lebih sempit; alternatif tradisional dicatat dalam catatan kaki.
- source_word: σεληνιαζομένους
  choice: orang-orang yang mengalami kejang-kejang
  rationale: Mengungkapkan gejala yang kemungkinan dimaksud bagi pembaca modern tanpa mengesahkan anggapan bahwa bulan adalah penyebabnya.
- source_word: παραλυτικούς
  choice: orang-orang lumpuh
  rationale: Padanan Indonesia yang alami dan tepat untuk orang yang mengalami kelumpuhan.
- source_word: ἐθεράπευσεν
  choice: Ia menyembuhkan
  rationale: Padanan langsung dan lazim bagi tindakan penyembuhan Yesus.
theological_decisions:
- issue: Cakupan δαιμονιζομένους
  choice: orang-orang yang dikuasai roh-roh jahat
  alternative: orang-orang yang kerasukan roh-roh jahat
  rationale: Terjemahan utama mempertahankan kenyataan pengaruh roh jahat, tetapi tidak menentukan secara berlebihan tingkat atau bentuk penguasaan yang tidak dirinci oleh istilah Yunani.
- issue: Makna σεληνιαζομένους
  choice: orang-orang yang mengalami kejang-kejang
  alternative: orang-orang yang dianggap dipengaruhi bulan; penderita epilepsi
  rationale: Pilihan utama menyampaikan gejala yang dapat dipahami pembaca sekarang tanpa memasukkan etiologi kuno atau menetapkan diagnosis klinis modern secara pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar rangkaian panjang Yunani tetap jelas. Tanda titik dua memperlihatkan bahwa kelompok-kelompok sesudahnya menjabarkan semua orang sakit yang dibawa kepada Yesus.
