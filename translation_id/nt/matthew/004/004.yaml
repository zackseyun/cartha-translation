id: MAT.4.4
reference: Matthew 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: id
  text: Tetapi Ia menjawab, “Ada tertulis, ‘Manusia[a] tidak akan hidup dari roti saja, melainkan dari setiap firman yang keluar melalui mulut Allah[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bentuk tunggal maskulin dengan daya representatif; yang dimaksud ialah manusia pada umumnya.
    reason: lexical_alternative
  - marker: b
    text: Banyak terjemahan memakai “dari mulut Allah”. Secara harfiah, bahasa Yunani di sini berbunyi “melalui mulut Allah”, yang mempertahankan gambaran setiap firman yang tersampaikan lewat ujaran Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Ungkapan naratif ini secara harfiah memuat unsur ‘menjawab’ dan ‘berkata’, tetapi dalam bahasa Indonesia modern keduanya cukup diwakili secara alami oleh ‘menjawab’.
- source_word: Γέγραπται
  choice: Ada tertulis
  rationale: Rumus baku untuk memperkenalkan kutipan Kitab Suci; bentuk ini juga menyiratkan bahwa apa yang telah ditulis tetap berlaku.
- source_word: ἄρτῳ μόνῳ
  choice: dari roti saja
  rationale: ‘Roti’ mempertahankan arti langsung ἄρτος dan ‘saja’ menyampaikan pembatasan μόνῳ tanpa memperluasnya menjadi ‘makanan’.
- source_word: ζήσεται
  choice: tidak akan hidup
  rationale: Bentuk masa depan Yunani dinyatakan secara eksplisit dengan ‘akan’.
- source_word: ὁ ἄνθρωπος
  choice: Manusia
  rationale: Dalam konteks ini bentuk tunggal maskulin Yunani dipakai secara representatif untuk manusia pada umumnya, bukan hanya seorang laki-laki tertentu.
- source_word: παντὶ ῥήματι
  choice: setiap firman
  rationale: ῥῆμα menunjuk pada sesuatu yang diucapkan Allah; ‘firman’ merupakan padanan Indonesia yang alami dan sesuai dengan konteks ilahi.
- source_word: ἐκπορευομένῳ
  choice: yang keluar
  rationale: Padanan ini mempertahankan gambaran ujaran yang keluar dari mulut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: διὰ στόματος θεοῦ
  choice: melalui mulut Allah
  rationale: διά dengan genetif secara langsung berarti ‘melalui’; terjemahan ini mempertahankan gambaran bahwa firman itu tersampaikan melalui ujaran Allah.
theological_decisions:
- issue: Cakupan umum ὁ ἄνθρωπος
  choice: Manusia
  alternative: orang; umat manusia
  rationale: Pernyataan ini berlaku bagi manusia secara umum. ‘Manusia’ mempertahankan bentuk tunggal representatif tanpa membatasinya pada laki-laki.
- issue: Daya tetap rumus Γέγραπται
  choice: Ada tertulis
  alternative: Telah tertulis
  rationale: ‘Ada tertulis’ adalah rumus kutipan yang wajar dan tidak menambahkan penafsiran, sambil menyampaikan bahwa teks Kitab Suci itu tetap hadir sebagai tulisan yang berwibawa.
- issue: Relasi διὰ στόματος θεοῦ
  choice: melalui mulut Allah
  alternative: dari mulut Allah
  rationale: Pilihan ‘melalui’ mengikuti preposisi διά dan mempertahankan metafora ujaran ilahi tanpa mengubahnya menjadi rumusan teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara bentuk masa depan, metafora roti, cakupan umum ‘manusia’, serta ungkapan ‘melalui mulut Allah’ dipertahankan dari teks Yunani.
