id: MAT.4.18
reference: Matthew 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: id
  text: Ketika sedang berjalan di tepi Danau Galilea, ia melihat dua orang bersaudara, yaitu Simon yang disebut Petrus dan Andreas, saudaranya. Mereka sedang menebarkan jala[a] ke danau, sebab mereka adalah nelayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini merujuk pada jala ikan yang dilemparkan ke air.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Ketika sedang berjalan
  rationale: Partisipel kini ini menyatakan tindakan yang sedang berlangsung bersamaan dengan verba utama; klausa temporal ini alami dalam bahasa Indonesia.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: di tepi Danau Galilea
  rationale: παρά dengan akusatif menunjukkan gerak di sepanjang atau dekat tepi. “Danau Galilea” adalah nama geografis baku dan alami dalam bahasa Indonesia meskipun θάλασσα secara leksikal berarti “laut”.
- source_word: εἶδεν
  choice: ia melihat
  rationale: Bentuk aoris indikatif dari ὁράω menyampaikan tindakan naratif sederhana; “melihat” mempertahankan makna langsungnya.
- source_word: δύο ἀδελφούς
  choice: dua orang bersaudara
  rationale: Konteks menunjukkan dua saudara kandung laki-laki; ungkapan ini alami dan tidak menambahkan hubungan yang tidak dinyatakan.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simon yang disebut Petrus
  rationale: Partisipel pasif λεγόμενον diterjemahkan dengan klausa relatif yang jelas dan alami.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: Andreas, saudaranya
  rationale: Frasa aposisional ini mengidentifikasi Andreas sebagai saudara Simon; bentuk pronominalnya ringkas dan idiomatis.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: sedang menebarkan jala
  rationale: Partisipel kini menggambarkan kegiatan mereka saat terlihat. ἀμφίβληστρον adalah jala ikan yang dilemparkan; “menebarkan jala” merupakan ungkapan Indonesia yang alami, dengan kekhususan alat dijelaskan dalam catatan kaki.
- source_word: εἰς τὴν θάλασσαν
  choice: ke danau
  rationale: εἰς menyatakan arah gerak. “Danau” menjaga keselarasan dengan nama geografis “Danau Galilea” dalam bahasa Indonesia.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: sebab mereka adalah nelayan
  rationale: γάρ memberikan alasan atau keterangan penjelas, yang disampaikan secara jelas oleh “sebab”; ἁλιεῖς berarti orang yang pekerjaannya menangkap ikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibagi dua agar mudah dibaca tanpa mengubah urutan peristiwa atau hubungan penjelas dalam teks Yunani. Pronomina “ia” mempertahankan subjek tersirat dari konteks tanpa menambahkan nama Yesus ke dalam ayat.
