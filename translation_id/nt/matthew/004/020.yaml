  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: id
  text: Mereka pun segera meninggalkan jala-jala itu dan mengikuti Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: pun
  rationale: Dalam konteks ini δέ merupakan penghubung ringan yang melanjutkan alur cerita. Partikel “pun” secara alami menandai tanggapan mereka tanpa memberi kesan pertentangan yang kuat.
- source_word: εὐθέως
  choice: segera
  rationale: Kata εὐθέως menekankan cepatnya tanggapan mereka; “segera” merupakan padanan Indonesia yang baku, alami, dan jelas.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: 'Partisip aoris ini menyatakan tindakan yang mendahului verba utama: mereka meninggalkan jala, lalu mengikuti Dia. Koordinasi dengan “dan” menyampaikan urutan itu secara wajar dalam narasi Indonesia.'
- source_word: τὰ δίκτυα
  choice: jala-jala itu
  rationale: Dalam konteks penangkapan ikan, δίκτυα berarti jala. Bentuk ulang menyatakan jamak, sedangkan “itu” mencerminkan artikel Yunani tanpa menambahkan kepemilikan yang tidak dinyatakan.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti Dia
  rationale: Ungkapan ini dapat mencakup tindakan mengikuti secara fisik sekaligus keterikatan sebagai murid. “Mengikuti Dia” mempertahankan kedua lapisan makna tersebut secara alami.
theological_decisions:
- issue: Nuansa pemuridan dalam ἠκολούθησαν αὐτῷ
  choice: mengikuti Dia
  alternative: pergi mengikut Dia
  rationale: Verba ἀκολουθέω dalam konteks Injil dapat menunjuk baik pada gerak harfiah maupun tindakan menjadi pengikut. “Mengikuti Dia” mempertahankan keluasan makna ini tanpa memperjelasnya secara doktrinal melebihi teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan kecepatan respons, urutan tindakan, dan kemungkinan nuansa pemuridan.
