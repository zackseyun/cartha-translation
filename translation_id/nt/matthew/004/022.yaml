  verdict: approve
  source_fidelity: Teks Indonesia dengan setia menerjemahkan οἱ δὲ sebagai “Mereka pun,” εὐθέως sebagai “segera,” ἀφέντες sebagai “meninggalkan,” dan ἠκολούθησαν αὐτῷ sebagai “mengikuti Dia.” “Lalu” secara wajar menyatakan tindakan meninggalkan yang mendahului tindakan mengikuti, sebagaimana ditunjukkan oleh partisip aoris, tanpa menambahkan makna yang tidak didukung teks.
  naturalness: Kalimatnya baku, jelas, dan alami dalam bahasa Indonesia modern. “Mereka pun segera meninggalkan perahu dan ayah mereka, lalu mengikuti Dia” mempertahankan alur naratif dan ketegasan respons para murid.
  terminology: “Perahu” tepat untuk πλοῖον dalam konteks nelayan. “Meninggalkan” tidak secara tidak semestinya menguatkan makna menjadi penelantaran permanen. Kapitalisasi “Dia” konsisten dengan register Alkitab Indonesia yang bermartabat. Catatan kaki memberikan alternatif idiomatis yang sah bagi εὐθέως.
