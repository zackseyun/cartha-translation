  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: id
  text: Mereka pun segera meninggalkan perahu dan ayah mereka, lalu mengikuti Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “saat itu juga.”'
    reason: Alternatif leksikal bagi εὐθέως yang menekankan kesegeraan dengan ungkapan idiomatis.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka pun
  rationale: Artikel substantival οἱ menunjuk kembali kepada kedua saudara itu, sedangkan δέ menjadi penghubung ringan yang melanjutkan narasi. “Mereka pun” alami dalam bahasa Indonesia dan tidak menambahkan pertentangan yang tidak dinyatakan.
- source_word: εὐθέως
  choice: segera
  rationale: “Segera” menyampaikan ketanggapan dan desakan waktu yang ditandai oleh εὐθέως, dengan bahasa Indonesia yang baku dan mudah dipahami.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: 'Partisip aoris ini menyatakan tindakan yang mendahului verba utama: mereka meninggalkan perahu dan ayah mereka, kemudian mengikuti Yesus. “Meninggalkan” mempertahankan ketegasan tindakan tanpa menyiratkan secara berlebihan bahwa perpisahan itu pasti bersifat permanen.'
- source_word: τὸ πλοῖον
  choice: perahu
  rationale: Dalam konteks penangkapan ikan di danau, “perahu” lebih tepat dan alami daripada “kapal”.
- source_word: τὸν πατέρα αὐτῶν
  choice: ayah mereka
  rationale: Ungkapan ini secara langsung menyatakan hubungan keluarga dan mempertahankan bobot pengorbanan dalam tanggapan mereka.
- source_word: ἠκολούθησαν αὐτῷ
  choice: lalu mengikuti Dia
  rationale: ἀκολουθέω mencakup gerak mengikuti sekaligus nuansa pemuridan. “Lalu” membuat urutan antara partisip ἀφέντες dan verba utama jelas secara alami; “Dia” merujuk kepada Yesus dalam konteks dekat.
theological_decisions:
- issue: Tanggapan sebagai murid dan perpisahan dari keluarga
  choice: Teks menyatakan bahwa mereka segera meninggalkan perahu dan ayah mereka untuk mengikuti Yesus, tanpa menegaskan bahwa tindakan itu merupakan penelantaran permanen.
  alternative: Menerjemahkan ἀφέντες dengan istilah yang menyiratkan bahwa mereka membuang atau menelantarkan ayah mereka untuk selamanya.
  rationale: Ayat ini menekankan tanggapan yang segera dan tegas, tetapi ἀφέντες tidak dengan sendirinya menentukan lamanya perpisahan. “Meninggalkan” mempertahankan ketegangan naratif tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, lugas, dan bermartabat. Susunan kalimat dibuat alami dengan “pun” sebagai penghubung naratif ringan dan “lalu” untuk mencerminkan urutan tindakan.
