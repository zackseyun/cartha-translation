id: MAT.4.23
reference: Matthew 4:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: id
  text: Yesus berkeliling di seluruh Galilea, mengajar di sinagoge-sinagoge mereka, memberitakan kabar baik[a] tentang Kerajaan, serta menyembuhkan setiap penyakit dan setiap kelemahan di tengah masyarakat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Injil Kerajaan.”
    reason: Alternatif tradisional untuk “kabar baik” (εὐαγγέλιον); “Kerajaan” menerjemahkan genitif τῆς βασιλείας secara ringkas.
lexical_decisions:
- source_word: περιῆγεν
  choice: berkeliling
  rationale: Bentuk imperfek menggambarkan kegiatan perjalanan yang berlangsung dari tempat ke tempat; “berkeliling” menyampaikan gerak itineran itu secara alami.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: di seluruh Galilea
  rationale: Dengan verba gerak, frasa ini menyatakan cakupan kegiatan di seluruh wilayah Galilea.
- source_word: διδάσκων
  choice: mengajar
  rationale: Partisipel kini menyatakan kegiatan yang berlangsung bersamaan dengan perjalanan Yesus.
- source_word: συναγωγαῖς αὐτῶν
  choice: rumah-rumah ibadat mereka
  rationale: “Rumah ibadat” merupakan padanan Indonesia yang jelas bagi tempat pertemuan dan ibadah Yahudi, sedangkan “mereka” mempertahankan αὐτῶν.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Pilihan ini menyampaikan tindakan mengumumkan secara terbuka dan berwibawa dengan bahasa Indonesia yang wajar.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: kabar baik tentang Kerajaan
  rationale: “Kabar baik” menerjemahkan makna leksikal εὐαγγέλιον secara transparan, dan “tentang” mengungkapkan hubungan isi atau pokok berita yang dapat dikandung oleh bentuk genitif.
- source_word: θεραπεύων
  choice: menyembuhkan
  rationale: Dalam konteks ini verba tersebut menunjuk pada pemulihan dari penyakit atau kelemahan.
- source_word: πᾶσαν νόσον
  choice: segala penyakit
  rationale: “Penyakit” adalah padanan langsung dan tetap dibedakan dari μαλακία.
- source_word: πᾶσαν μαλακίαν
  choice: segala kelemahan
  rationale: μαλακία dapat berarti kelemahan, sakit, atau kelemahan jasmani; “kelemahan” mempertahankan perbedaan leksikal dari νόσος tanpa membatasi jenis gangguan secara berlebihan.
- source_word: ἐν τῷ λαῷ
  choice: di antara orang banyak
  rationale: Frasa ini menunjukkan lingkungan masyarakat tempat penyembuhan terjadi; “orang banyak” alami dalam konteks pelayanan umum, tanpa memberi tekanan teknis yang tidak diperlukan.
theological_decisions:
- issue: Hubungan genitif dalam τὸ εὐαγγέλιον τῆς βασιλείας
  choice: kabar baik tentang Kerajaan
  alternative: kabar baik Kerajaan
  rationale: Genitif dapat menyatakan pokok atau ciri kabar baik itu. “Tentang Kerajaan” terdengar alami dan mempertahankan fokus pada Kerajaan tanpa menentukan lebih jauh hubungan teologisnya.
- issue: Cakupan πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: segala penyakit dan segala kelemahan
  alternative: setiap penyakit dan setiap sakit
  rationale: Pengulangan πᾶσαν dipertahankan melalui dua kali “segala” untuk menyampaikan keluasan yang ditekankan teks, tanpa menambahkan klaim di luar lingkup pelayanan yang sedang diringkas.
- issue: Subjek tersirat pada περιῆγεν
  choice: Yesus
  alternative: Dia
  rationale: Bahasa Yunani mengandalkan subjek dari konteks sebelumnya. Menyebut “Yesus” membuat ayat mandiri dan jelas dalam bahasa Indonesia tanpa mengubah referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga kegiatan dipertahankan dengan verba sejajar. “Kerajaan” ditulis dengan huruf kapital sebagai sebutan ringkas bagi pemerintahan Allah dalam konteks ini, tanpa menambahkan kata “Allah” yang tidak terdapat secara eksplisit dalam ayat.
