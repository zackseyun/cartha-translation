  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: id
  text: Lalu penggoda itu datang menghampiri-Nya dan berkata kepada-Nya, “Jika[a] Engkau adalah Anak Allah, katakanlah supaya batu-batu ini menjadi roti[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena Engkau adalah Anak Allah.” Bentuk syarat Yunani ini dapat berfungsi sebagai tantangan, bukan sekadar menyatakan keraguan.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani untuk “roti” berbentuk jamak dan dapat diterjemahkan “roti-roti” atau “beberapa roti”; bahasa Indonesia lazim memakai “roti” tanpa bentuk jamak di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: datang mendekat
  rationale: Partisip aoris προσέρχομαι menyatakan gerak menghampiri Yesus sebelum tindakan berkata. “Datang mendekat” alami dalam bahasa Indonesia dan mempertahankan unsur pendekatan.
- source_word: ὁ πειράζων
  choice: si penggoda
  rationale: Partisip substantival ini menunjuk kepada tokoh yang sedang menggoda atau mencobai Yesus. “Si penggoda” berfungsi sebagai sebutan tokoh dan sesuai dengan konteks permusuhan ini.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Padanan langsung dan wajar bagi λέγω dengan objek tak langsung; pronomina tetap merujuk kepada Yesus tanpa menambahkan nama yang tidak ada dalam teks.
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk syarat Yunani dan tidak memutuskan apakah perkataan itu menyatakan keraguan, tantangan, atau asumsi retoris.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Anak Allah
  rationale: Konstruksi predikatif tanpa artikel ini secara alami menyatakan gelar yang mengidentifikasi Yesus. Bahasa Indonesia tidak memerlukan kata sandang tertentu untuk mempertahankan makna gelar tersebut.
- source_word: εἰπὲ
  choice: katakanlah
  rationale: Imperatif aoris λέγω diterjemahkan secara langsung tanpa memperkuatnya menjadi “perintahkanlah”, yang akan menambahkan unsur leksikal yang tidak eksplisit.
- source_word: ἵνα
  choice: agar
  rationale: Sesudah imperatif, ἵνα memperkenalkan isi atau hasil yang dimaksud. “Agar” menghasilkan susunan Indonesia yang jelas dan tetap dekat dengan bentuk sumber.
- source_word: οἱ λίθοι οὗτοι
  choice: batu-batu ini
  rationale: Bentuk jamak dan penunjuk dipertahankan. “Batu” merupakan padanan alami bagi λίθος dalam latar padang gurun.
- source_word: ἄρτοι
  choice: roti
  rationale: ἄρτοι berbentuk jamak dan dapat menunjuk pada beberapa ketul roti, tetapi dalam bahasa Indonesia “roti” lazim dipakai tanpa pengulangan untuk bahan atau makanan ini.
- source_word: γένωνται
  choice: menjadi
  rationale: Padanan netral dan langsung bagi subjunktif aoris γίνομαι, tanpa nuansa tambahan yang mungkin timbul dari “berubah menjadi”.
theological_decisions:
- issue: Daya klausa bersyarat Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: “Jika Engkau adalah Anak Allah” dipertahankan sebagai syarat yang terbuka secara retoris.
  alternative: “Karena Engkau adalah Anak Allah” atau “Jika Engkau memang Anak Allah”.
  rationale: Kondisi Yunani dapat berfungsi sebagai tantangan dan tidak harus menyatakan keraguan sederhana. “Jika” mempertahankan ketegangan itu tanpa menentukan maksud si penggoda secara berlebihan.
- issue: Gelar kristologis υἱὸς τοῦ θεοῦ
  choice: “Anak Allah”.
  alternative: “seorang anak Allah”.
  rationale: Dalam konstruksi predikatif dan konteks Matius, ungkapan ini mengidentifikasi Yesus melalui gelar yang dikenal, bukan sebagai salah satu anggota suatu golongan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Engkau” dan “-Nya” menandai rujukan kepada Yesus sesuai kelaziman penerbitan Alkitab Indonesia. Susunan “katakanlah agar” sengaja mempertahankan bentuk λέγω + ἵνα dan menghindari penambahan makna yang lebih kuat seperti “perintahkanlah”.
