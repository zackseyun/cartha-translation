  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: id
  text: 'Yesus berkata kepadanya, “Ada tertulis juga: ‘Janganlah engkau mencobai[a] Tuhan[b], Allahmu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah engkau menguji Tuhan, Allahmu.” Kata Yunani ἐκπειράζω dapat diterjemahkan “menguji” atau “mencobai”.
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini berasal dari Ulangan 6:16. Sebutan “Tuhan” dalam teks Yunani mengikuti terjemahan Septuaginta untuk nama ilahi.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Susunan ini merupakan pengantar ujaran yang alami dalam bahasa Indonesia dan tetap menyatakan penerima perkataan melalui bentuk datif αὐτῷ.
- source_word: Πάλιν γέγραπται
  choice: Ada tertulis juga
  rationale: γέγραπται dipertahankan sebagai rumusan kutipan Kitab Suci yang berwibawa, sedangkan πάλιν dalam konteks ini menandai kutipan balasan atau tambahan; 'juga' lebih alami daripada 'lagi' dalam rumusan ini.
- source_word: Οὐκ ἐκπειράσεις
  choice: Janganlah engkau mencobai
  rationale: Bentuk futurum ini berfungsi sebagai larangan. 'Mencobai' menyampaikan tindakan menguji Allah secara lancang dalam konteks ini, tanpa menghilangkan kemungkinan padanan 'menguji' yang dicatat dalam catatan kaki.
- source_word: κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: κύριον diterjemahkan 'Tuhan' sesuai bentuk teks Yunani, dan τὸν θεόν σου menjadi aposisi 'Allahmu'. Tanda koma membantu memperjelas hubungan aposisional dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Kitab Suci yang merujuk kepada Allah Israel
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks sumber langsung adalah bahasa Yunani κύριον, bukan bentuk Ibrani nama ilahi. Karena itu, teks utama menerjemahkannya 'Tuhan', sementara latar Septuaginta dan nama ilahi dijelaskan dalam catatan kaki.
- issue: Nuansa larangan ἐκπειράζω terhadap Allah
  choice: mencobai
  alternative: menguji
  rationale: '''Mencobai Tuhan'' merupakan ungkapan Indonesia yang wajar untuk tindakan menantang Allah agar membuktikan diri. Karena verba Yunani juga dapat diterjemahkan ''menguji'', alternatif itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'engkau' dipakai dalam kutipan hukum untuk mempertahankan sapaan orang kedua tunggal. Penanda catatan kaki ditempatkan tepat setelah kutipan yang dijelaskannya.
