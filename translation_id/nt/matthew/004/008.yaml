  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: id
  text: Sekali lagi, Iblis membawa-Nya ke sebuah gunung yang sangat tinggi dan memperlihatkan kepada-Nya semua kerajaan dunia beserta kemuliaan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kemegahan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Sekali lagi
  rationale: Menandai pengulangan dalam rangkaian pencobaan dengan ungkapan Indonesia yang alami.
- source_word: παραλαμβάνει
  choice: membawa-Nya
  rationale: Mengungkapkan tindakan membawa serta ke tempat lain tanpa menambahkan cara atau sifat perjalanan yang tidak dinyatakan teks.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Sebutan baku dan mudah dipahami dalam bahasa Indonesia untuk tokoh yang dimaksud dalam konteks ini.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: ke sebuah gunung yang sangat tinggi
  rationale: Mempertahankan arah gerak dan penekanan λίαν pada tingginya gunung dalam susunan Indonesia yang alami.
- source_word: δείκνυσιν
  choice: memperlihatkan
  rationale: Padanan langsung dan wajar bagi tindakan menunjukkan sesuatu kepada seseorang.
- source_word: πάσας τὰς βασιλείας τοῦ κόσμου
  choice: semua kerajaan dunia
  rationale: Mempertahankan cakupan menyeluruh serta makna politis-regal βασιλεία; frasa ini alami dalam bahasa Indonesia.
- source_word: τὴν δόξαν αὐτῶν
  choice: kemuliaannya
  rationale: Mempertahankan hubungan leksikal δόξα dengan 'kemuliaan', sementara makna kontekstual berupa kemegahan dicatat sebagai alternatif.
theological_decisions:
- issue: Sifat adegan di gunung dalam kisah pencobaan
  choice: Menerjemahkan adegan sebagaimana dikisahkan, tanpa menentukan mekanisme bagaimana semua kerajaan diperlihatkan.
  alternative: Menafsirkannya secara khusus sebagai panorama geografis harfiah atau sebagai penglihatan/adikodrati.
  rationale: Teks Yunani hanya menyatakan bahwa Iblis membawa Yesus ke gunung yang sangat tinggi dan memperlihatkan semua kerajaan dunia beserta kemuliaannya; terjemahan tidak perlu menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina yang mengacu kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia; bentuk tunggal 'kemuliaannya' secara alami merujuk secara kolektif kepada semua kerajaan.
