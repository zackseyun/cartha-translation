id: MAT.4.16
reference: Matthew 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: id
  text: Orang-orang yang duduk dalam kegelapan telah melihat terang yang besar; dan terang telah terbit bagi mereka yang duduk di wilayah dan bayang-bayang maut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: bangsa
  rationale: Dalam kutipan profetis ini, bentuk tunggal kolektif paling wajar dipertahankan sebagai 'bangsa'; pilihan ini menyatakan suatu kelompok manusia tanpa harus berarti negara modern.
- source_word: καθήμενος / καθημένοις
  choice: duduk
  rationale: Terjemahan harfiah ini mempertahankan gambaran yang hidup serta kesejajaran dengan teks Yesaya; 'tinggal' mungkin secara idiomatis, tetapi mengurangi citra tersebut.
- source_word: σκοτίᾳ
  choice: kegelapan
  rationale: Padanan baku yang mempertahankan kemungkinan makna harfiah maupun kiasan tanpa membatasinya menjadi keadaan rohani, moral, atau politis tertentu.
- source_word: φῶς εἶδεν μέγα
  choice: telah melihat terang yang besar
  rationale: Bentuk lampau menyatakan peristiwa profetis sebagai kenyataan yang terjadi, sedangkan 'terang yang besar' mempertahankan penekanan pada μέγα dan terdengar alami dalam bahasa Indonesia.
- source_word: χώρᾳ
  choice: wilayah
  rationale: Menyampaikan arti geografis tanpa konotasi negara modern dan cocok dengan konteks wilayah yang disebut dalam ayat sebelumnya.
- source_word: σκιᾷ θανάτου
  choice: bayang-bayang maut
  rationale: Mempertahankan unsur eksplisit θανάτου, 'maut', beserta gema ungkapan alkitabiahnya; tidak dilebur menjadi sekadar 'kelam pekat'.
- source_word: ἀνέτειλεν
  choice: telah terbit
  rationale: Mencerminkan citra terbitnya benda langit atau cahaya dan merupakan ungkapan Indonesia yang alami dengan subjek 'terang'.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Datif penerima dinyatakan secara alami sebagai 'bagi mereka'; rujukannya tetap jelas kepada orang-orang yang duduk di wilayah dan bayang-bayang maut.
theological_decisions:
- issue: Hakikat gambaran kegelapan dan terang
  choice: Mempertahankan gambaran tanpa menentukan apakah kegelapan itu bersifat rohani, moral, politis, atau eksistensial.
  alternative: Menafsirkan kegelapan secara eksplisit sebagai dosa atau ketidaktahuan bangsa-bangsa lain, dan terang secara eksplisit sebagai penyataan keselamatan Mesias.
  rationale: Kutipan profetis ini sarat makna teologis, tetapi klausa Yunani sendiri tidak mempersempit arti kegelapan atau terang. Terjemahan menjaga keluasan metafora dan ketegangan teologisnya.
- issue: Makna σκιᾷ θανάτου
  choice: Menerjemahkan 'bayang-bayang maut' dengan tetap menyebut maut.
  alternative: Menerjemahkan sebagai 'kelam pekat'.
  rationale: Teks Yunani Matius secara eksplisit memuat θανάτου, sehingga unsur maut perlu tampak dalam teks utama meskipun latar Ibraninya dapat dipahami sebagai kegelapan yang sangat pekat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel serta citra profetis dipertahankan tanpa menjadi kaku. 'Maut' dipilih alih-alih 'kematian' untuk menjaga kepekatan idiom 'bayang-bayang maut' yang masih mudah dipahami pembaca umum.
