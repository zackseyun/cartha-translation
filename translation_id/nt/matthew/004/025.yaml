  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: id
  text: Banyak orang mengikuti Yesus dari Galilea, Dekapolis, Yerusalem, Yudea, dan wilayah seberang Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari seberang Sungai Yordan.”
    reason: Frasa Yunani πέραν τοῦ Ἰορδάνου dapat dipahami sebagai sebutan kawasan di seberang Yordan dalam daftar asal orang banyak, atau diterjemahkan secara lebih langsung sebagai “dari seberang Sungai Yordan.”
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti Yesus
  rationale: Dalam konteks naratif, ἀκολουθέω berarti mengikuti atau pergi di belakang seseorang. Nama “Yesus” dipakai secara alami dalam bahasa Indonesia sebagai rujukan bagi pronomina αὐτῷ, tanpa menyiratkan bahwa semua orang itu sudah menjadi murid yang berkomitmen.
- source_word: ὄχλοι πολλοί
  choice: orang banyak berbondong-bondong
  rationale: Ungkapan ini menyampaikan banyaknya orang dan besarnya arus massa dalam bahasa Indonesia yang wajar, bukan secara kaku “banyak kerumunan”.
- source_word: ἀπό
  choice: dari
  rationale: Menandai asal orang banyak dan secara sintaksis berlaku atas seluruh daftar tempat.
- source_word: Γαλιλαίας
  choice: Galilea
  rationale: Bentuk nama wilayah yang baku dalam bahasa Indonesia.
- source_word: Δεκαπόλεως
  choice: Dekapolis
  rationale: Nama wilayah yang berkaitan dengan sepuluh kota; transliterasi ini lazim dan mempertahankan nama diri sumber.
- source_word: Ἱεροσολύμων
  choice: Yerusalem
  rationale: Bentuk nama kota yang baku dalam bahasa Indonesia.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Bentuk nama wilayah yang baku dalam bahasa Indonesia.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: daerah di seberang Sungai Yordan
  rationale: πέραν dengan genitif menunjuk kawasan di sisi seberang Yordan. Penambahan “daerah” memperjelas bahwa frasa ini merupakan unsur geografis sejajar dengan wilayah-wilayah sebelumnya.
- source_word: καὶ ... καὶ ... καὶ
  choice: Galilea, Dekapolis, Yerusalem, Yudea, dan ...
  rationale: Bahasa Indonesia modern secara alami memakai koma dan “dan” sebelum unsur terakhir; susunan kumulatif semua lokasi tetap dipertahankan.
theological_decisions:
- issue: Makna “mengikuti” bagi orang banyak
  choice: mengikuti
  alternative: menjadi pengikut
  rationale: “Mengikuti” mempertahankan kemungkinan makna gerak fisik dan ketertarikan kepada Yesus tanpa menyatakan bahwa seluruh orang banyak telah menjadi murid atau penganut yang berkomitmen.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “Sungai Yordan” memperjelas nama geografis bagi pembaca umum. Ungkapan “berbondong-bondong” dipakai untuk menyampaikan besarnya jumlah orang secara idiomatis.
