  naturalness: “Banyak orang mengikuti Yesus” adalah bahasa Indonesia modern yang alami dan jelas. Daftar asal dengan koma serta “dan” pada unsur terakhir juga wajar. “Wilayah seberang Sungai Yordan” terdengar alami sebagai sebutan kawasan, sementara catatan kaki menyediakan alternatif yang lebih harfiah.
  terminology: “Yesus,” “Galilea,” “Dekapolis,” “Yerusalem,” “Yudea,” dan “Sungai Yordan” tepat dan lazim dalam bahasa Indonesia. “Mengikuti” mempertahankan keterbukaan makna naratif tanpa mengubah orang banyak menjadi murid yang sudah berkomitmen.
