    rationale: ἔρχομαι berarti datang. Terjemahan "pergi" mengubah arah deiktis yang dipilih teks, meskipun konteks juga menyebut ia meninggalkan Nazara.
  - severity: low
    issue: '"di tepi danau" untuk τὴν παραθαλασσίαν'
    rationale: Kata Yunani memakai unsur θάλασσα, "laut". Bahwa yang dimaksud ialah Danau Galilea dapat dijelaskan dalam catatan atau konteks, tetapi teks terjemahan sebaiknya mempertahankan "tepi laut".
