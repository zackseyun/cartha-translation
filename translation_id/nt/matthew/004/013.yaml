  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: id
  text: Setelah meninggalkan Nazara[a], ia datang dan menetap di Kapernaum yang terletak di tepi laut, di wilayah Zebulon dan Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “Nazara”; banyak terjemahan memakai “Nazaret”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: setelah meninggalkan
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama; bentuk ini menyampaikan urutan tersebut secara alami dalam bahasa Indonesia.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Mengikuti bentuk nama yang terdapat dalam teks Yunani, Ναζαρά, tanpa menggantinya secara diam-diam dengan bentuk yang lebih dikenal.
- source_word: ἐλθὼν
  choice: ia pergi
  rationale: Partisip aoristus ἔρχομαι menyatakan perpindahan menuju Kapernaum; dalam bahasa Indonesia, klausa berverba finit menyampaikan rangkaian tindakan dengan wajar. 'Pergi' dipilih karena titik pandangnya berawal dari tempat yang ditinggalkan.
- source_word: κατῴκησεν
  choice: menetap
  rationale: Kata κατοικέω di sini menunjukkan bahwa ia mengambil tempat tinggal, bukan sekadar singgah atau berada untuk sementara.
- source_word: Καφαρναοὺμ
  choice: Kapernaum
  rationale: Bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
- source_word: τὴν παραθαλασσίαν
  choice: di tepi danau
  rationale: Ungkapan ini menggambarkan Kapernaum sebagai tempat di sisi 'laut'; dalam konteks geografis Indonesia, perairan yang dimaksud lazim dan lebih jelas disebut danau, yakni Danau Galilea.
- source_word: ἐν ὁρίοις
  choice: di wilayah
  rationale: Bentuk jamak ὅρια dapat menunjuk daerah, batas-batas, atau kawasan; 'wilayah' mempertahankan cakupan geografisnya secara ringkas.
- source_word: Ζαβουλὼν
  choice: Zebulon
  rationale: Bentuk nama suku dan wilayah yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Bentuk nama suku dan wilayah yang baku dalam bahasa Indonesia.
