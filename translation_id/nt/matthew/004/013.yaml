review_pass:
  verdict: revise
  source_fidelity: Perlu revisi. ἐλθών berarti "datang", bukan "pergi"; sudut pandang "pergi" tidak dinyatakan oleh teks Yunani. Selain itu, παραθαλάσσιος secara harfiah menyatakan letak "di tepi laut". Walaupun perairan rujukannya secara geografis adalah Danau Galilea, penggantian eksplisit menjadi "danau" menambahkan penafsiran geografis yang tidak ada dalam ungkapan sumber.
  naturalness: Kalimat revisi memakai bahasa Indonesia baku dan modern. Klausa relatif "yang terletak di tepi laut" secara alami menerangkan Kapernaum dan menghindari pengulangan preposisi yang kurang luwes.
  terminology: '"Nazara" patut dipertahankan sesuai bentuk SBLGNT, dengan catatan kaki yang menyebut bentuk "Nazaret" yang lebih lazim. "Kapernaum", "Zebulon", dan "Naftali" merupakan bentuk yang lazim dalam bahasa Indonesia. "Tepi laut" mempertahankan diksi sumber tanpa memaksakan identifikasi modern ke dalam teks.'
  issues:
