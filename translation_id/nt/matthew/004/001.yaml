id: MAT.4.1
reference: Matthew 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: id
  text: Kemudian Yesus dibawa oleh Roh ke padang gurun untuk dicobai oleh Iblis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diuji”; kata kerja Yunani yang dipakai dapat berarti “dicobai” atau “diuji”, meskipun konteks langsung di sini lebih mendukung “dicobai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang alami dalam bahasa Indonesia dan menunjukkan kelanjutan peristiwa sesudah pembaptisan Yesus.
- source_word: ἀνήχθη
  choice: dibawa
  rationale: Mempertahankan bentuk pasif dan tindakan pengarahan oleh Roh. Nuansa harfiah gerak 'ke atas' tidak dibuat eksplisit karena 'dibawa naik ke padang gurun' kurang alami dan dapat menyiratkan rincian topografis yang tidak perlu dalam bahasa Indonesia.
- source_word: εἰς τὴν ἔρημον
  choice: ke padang gurun
  rationale: Ungkapan baku dan mudah dipahami untuk wilayah sunyi atau tandus, tanpa membatasi maknanya pada gurun pasir.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: oleh Roh
  rationale: Konteks langsung sesudah pembaptisan menunjukkan Roh Allah; kapitalisasi menyatakan rujukan tersebut tanpa menambahkan kata 'Kudus' yang tidak terdapat dalam ayat ini.
- source_word: πειρασθῆναι
  choice: untuk dicobai
  rationale: Karena pelakunya adalah Iblis dan konteks berikutnya berupa godaan untuk berbuat salah, 'dicobai' paling sesuai; kemungkinan arti 'diuji' dipertahankan dalam catatan kaki.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: oleh Iblis
  rationale: Dalam konteks ini διάβολος berfungsi sebagai sebutan bagi musuh pribadi; 'Iblis' merupakan padanan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Identitas τοῦ πνεύματος
  choice: Roh merujuk kepada Roh Allah
  alternative: suatu roh atau roh manusia
  rationale: Konteks naratif langsung, yaitu Roh yang turun atas Yesus pada pembaptisan-Nya, sangat mendukung rujukan kepada Roh Allah. Terjemahan 'Roh' mempertahankan bentuk ringkas teks Yunani.
- issue: Makna πειρασθῆναι
  choice: dicobai
  alternative: diuji
  rationale: Agen yang disebut ialah Iblis dan narasi selanjutnya menampilkan godaan menuju pelanggaran, sehingga 'dicobai' tepat dalam teks utama. Namun, karena verba Yunani juga dapat berarti 'diuji', ketegangan maknanya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk pasif, agen ilahi, tujuan peristiwa, dan ambiguitas leksikal yang penting melalui catatan kaki.
