id: MAT.4.5
reference: Matthew 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: id
  text: Kemudian Iblis membawa-Nya ke kota suci[a] dan menempatkan-Nya di puncak Bait Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, Yerusalem.
    reason: cross_reference
  - marker: b
    text: Atau “sayap Bait Allah”; kata Yunani ini dapat menunjuk pada tepi yang menonjol atau bagian tertinggi dari kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa secara alami dalam narasi Indonesia.
- source_word: παραλαμβάνει
  choice: membawa-Nya
  rationale: Kata ini menyatakan bahwa Iblis membawa Yesus bersamanya; bentuk kini Yunani berfungsi sebagai present historis, yang secara wajar dinarasikan dalam bahasa Indonesia tanpa penandaan kala khusus.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks ini διάβολος merupakan sebutan pribadi bagi sang penggoda; “Iblis” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: ke kota suci
  rationale: Mempertahankan sebutan deskriptif Yunani tanpa langsung menggantinya dengan nama Yerusalem; “ke” secara alami menyatakan gerak menuju tempat tersebut.
- source_word: ἔστησεν
  choice: menempatkan-Nya
  rationale: Bentuk transitif-kausatif ini berarti membuat seseorang berdiri atau berada di suatu tempat; “menempatkan” jelas dan alami.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: di puncak
  rationale: Memberikan ungkapan Indonesia yang mudah dipahami untuk suatu ujung atau bagian tinggi yang menonjol, sementara ketidakpastian arsitekturalnya dipertahankan dalam catatan kaki.
- source_word: τοῦ ἱεροῦ
  choice: Bait Allah
  rationale: ἱερόν menunjuk kompleks Bait Allah secara luas. “Bait Allah” merupakan istilah Indonesia yang mapan, meskipun bukan hanya ruang kudus bagian dalam.
theological_decisions:
- issue: Identitas “kota suci”
  choice: Mempertahankan sebutan “kota suci” dalam teks utama.
  alternative: Yerusalem
  rationale: Teks Yunani memakai sebutan kehormatan, bukan nama diri; identitasnya dijelaskan dalam catatan kaki agar bentuk sumber tetap terpelihara.
- issue: Makna πτερύγιον τοῦ ἱεροῦ
  choice: “puncak Bait Allah” dalam teks utama, disertai catatan tentang ketidakpastian istilah.
  alternative: “sayap Bait Allah” atau “bagian tertinggi kompleks Bait Allah”
  rationale: Acuan arsitektural tepatnya tidak pasti. “Puncak” mudah dipahami dan sesuai dengan penafsiran tradisional, tetapi catatan kaki mencegah terhapusnya ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum. Kapitalisasi “-Nya” mengikuti kebiasaan luas penulisan rujukan kepada Yesus dalam teks Alkitab Indonesia; “Bait Allah” dipakai sebagai istilah mapan bagi kompleks bait.
