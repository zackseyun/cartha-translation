reference: Matthew 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: id
  text: Ketika Yesus masuk ke rumah Petrus, Ia melihat ibu mertua Petrus sedang terbaring dan demam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν … εἰς
  choice: ketika … masuk ke
  rationale: Partisip aoris ini menyatakan waktu atau urutan tindakan. Ungkapan ini wajar dalam bahasa Indonesia dan sesuai dengan gerak menuju serta memasuki rumah yang dinyatakan oleh konteks.
- source_word: οἰκίαν Πέτρου
  choice: rumah Petrus
  rationale: Genitif menyatakan kepunyaan; frasa ini langsung, alami, dan dekat dengan makna οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: ibu mertua Petrus
  rationale: πενθερά berarti ibu mertua. Nama Petrus diulang agar rujukan αὐτοῦ tidak disalahpahami sebagai Yesus.
- source_word: βεβλημένην
  choice: sedang terbaring
  rationale: Partisip perfek pasif ini digunakan secara idiomatis untuk keadaan terbaring. Terjemahan ini mempertahankan keadaan yang dihasilkan tanpa menambahkan 'di tempat tidur', yang tidak dinyatakan secara eksplisit.
- source_word: πυρέσσουσαν
  choice: demam
  rationale: Partisip kini ini menggambarkan kondisi yang sedang berlangsung. 'Demam' merupakan ungkapan Indonesia yang ringkas dan alami tanpa menambahkan kadar penderitaan atau intensitas panas.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam frasa 'ibu mertuanya'
  choice: Perempuan itu disebut secara eksplisit sebagai ibu mertua Petrus.
  alternative: Menggunakan 'ibu mertuanya', yang secara tata bahasa Indonesia dapat keliru dipahami sebagai ibu mertua Yesus.
  rationale: Secara sintaksis dan kontekstual, αὐτοῦ merujuk kepada Petrus. Pengulangan nama memperjelas rujukan tanpa menarik kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan narasi Yunani. 'Sedang' menaungi kedua keadaan, yakni terbaring dan demam; tidak ditambahkan 'di tempat tidur' atau 'menderita' karena keduanya tidak dinyatakan secara eksplisit dalam teks sumber.
