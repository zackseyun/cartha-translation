  source_fidelity: Terjemahan secara akurat menyampaikan urutan temporal dari ἐλθών, gerak masuk ke rumah Petrus, serta objek yang dilihat Yesus. “Ibu mertua Petrus” dengan tepat menjelaskan bahwa αὐτοῦ merujuk kepada Petrus. “Sedang terbaring dan demam” menyatakan keadaan berbaring (βεβλημένην) dan kondisi demam yang berlangsung (πυρέσσουσαν), tanpa menambahkan “di tempat tidur” atau unsur penderitaan yang tidak eksplisit.
