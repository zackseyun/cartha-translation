  naturalness: “Ketika Yesus melihat banyak orang mengelilingi-Nya” dan “ke seberang” alami dalam bahasa Indonesia modern. “Ia memberi perintah untuk pergi ke seberang” juga alami dan lebih dekat pada keterbukaan sintaksis sumber.
