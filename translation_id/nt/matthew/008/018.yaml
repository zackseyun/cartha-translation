  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: id
  text: Ketika Yesus melihat banyak orang mengelilingi-Nya, Ia memberi perintah untuk pergi ke seberang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: banyak orang
  rationale: Secara harfiah berarti “banyak kumpulan orang”; dalam bahasa Indonesia modern, “banyak orang” menyampaikan gambaran kerumunan besar dengan lebih alami tanpa mengubah maksudnya.
- source_word: περὶ αὐτόν
  choice: mengelilingi-Nya
  rationale: Mengungkapkan posisi orang banyak yang berada di sekitar Yesus secara ringkas dan alami.
- source_word: ἐκέλευσεν ἀπελθεῖν
  choice: Ia memerintahkan agar mereka pergi
  rationale: ἐκέλευσεν menyatakan perintah, sedangkan infinitif ἀπελθεῖν menyatakan tindakan pergi. Subjek tersirat infinitif dibuat eksplisit sebagai “mereka” berdasarkan konteks perjalanan bersama para murid, tanpa menyatakan bahwa orang banyak ikut pergi.
- source_word: εἰς τὸ πέραν
  choice: ke seberang
  rationale: Ungkapan ini menunjuk ke sisi seberang danau; “ke seberang” merupakan padanan Indonesia yang wajar tanpa menambahkan “danau” yang tidak eksplisit dalam ayat ini.
theological_decisions:
- issue: Subjek tersirat dalam ἀπελθεῖν
  choice: mereka
  alternative: Ia / rombongan itu
  rationale: Bahasa Yunani tidak menyebut subjek infinitif secara eksplisit. “Mereka” mempertahankan rujukan kontekstual kepada Yesus dan para murid sebagai rombongan yang akan menyeberang, sekaligus menghindari kesan bahwa Yesus memerintahkan orang banyak untuk pergi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk pronomina penghormatan “-Nya” dan “Ia” digunakan untuk Yesus sesuai kelaziman penerjemahan Alkitab Indonesia.
