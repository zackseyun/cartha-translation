source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: id
  text: Ia berkata kepada mereka, “Mengapa kalian takut, hai, kalian yang imannya kecil?” Lalu Ia bangun dan menghardik angin serta danau itu. Maka danau itu menjadi sangat tenang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: takut
  rationale: Dalam konteks ancaman badai, kata ini menunjuk pada rasa takut atau gentar; “takut” merupakan ungkapan Indonesia yang paling alami tanpa mengurangi teguran Yesus.
- source_word: ὀλιγόπιστοι
  choice: orang-orang yang kurang percaya
  rationale: Sapaan ini secara harfiah menggambarkan mereka sebagai orang yang imannya kecil atau kurang. Pilihan ini mempertahankan teguran tentang kekurangan iman tanpa menyiratkan bahwa mereka sama sekali tidak beriman.
- source_word: ἐγερθεὶς
  choice: bangun
  rationale: Bentuk partisip ini merujuk pada tindakan Yesus bangun dari tidur, sesuai konteks ayat sebelumnya.
- source_word: ἐπετίμησεν
  choice: menghardik
  rationale: Kata ini menyatakan teguran atau perintah keras dan mempertahankan gambaran otoritas Yesus atas angin dan danau.
- source_word: θάλασσα
  choice: danau
  rationale: Walaupun kata Yunani ini dapat berarti “laut”, dalam konteks geografis yang dimaksud ialah Danau Galilea; “danau” lebih jelas bagi pembaca Indonesia.
- source_word: γαλήνη μεγάλη
  choice: sangat tenang
  rationale: Ungkapan Yunani secara harfiah berarti “ketenangan besar”. Bentuk predikatif ini terdengar alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
theological_decisions:
- issue: Makna ὀλιγόπιστοι sebagai teguran kepada murid-murid
  choice: orang-orang yang kurang percaya
  alternative: kalian yang imannya kecil
  rationale: Pilihan utama mempertahankan adanya iman sekaligus kekurangannya dan tidak mengubah teguran itu menjadi pernyataan bahwa para murid tidak beriman sama sekali.
- issue: Objek yang menjadi tenang dalam klausa terakhir
  choice: danau menjadi sangat tenang
  alternative: terjadilah ketenangan yang besar
  rationale: Teks Yunani menyatakan secara impersonal bahwa “terjadilah ketenangan besar”. Terjemahan utama mengungkapkan hasilnya secara alami sesuai konteks, tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai karena Yesus berbicara kepada beberapa murid; “Ia” mempertahankan gaya naratif Alkitab yang lazim. Tidak diperlukan catatan kaki.
