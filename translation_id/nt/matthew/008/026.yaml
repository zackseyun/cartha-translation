  source_fidelity: 'Terjemahan umumnya setia pada urutan dan isi teks Yunani: Yesus berbicara kepada para murid, bangun, menghardik angin dan air, lalu terjadi ketenangan besar. "Danau" dapat diterima secara kontekstual untuk θάλασσα, yang dalam peristiwa ini menunjuk pada Danau Galilea. Namun, "orang-orang yang kurang percaya" dalam bahasa Indonesia mudah berarti orang yang tidak percaya atau bersikap skeptis, sedangkan ὀλιγόπιστοι secara khusus menegur iman mereka yang kecil/tidak memadai.'
  naturalness: Kalimatnya modern dan jelas. "Kalian yang imannya kecil" adalah sapaan yang lebih alami dan lebih langsung daripada "orang-orang yang kurang percaya."
  terminology: Sapaan "kalian yang imannya kecil" mempertahankan unsur iman (πίστις) dan ukuran/kekurangannya (ὀλιγο-), tanpa menyatakan bahwa murid-murid sama sekali tidak percaya. "Menghardik" tepat untuk ἐπετίμησεν.
