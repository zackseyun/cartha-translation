reference: Matthew 8:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: id
  text: Kemudian mereka datang kepada-Nya dan membangunkan-Nya, sambil berkata, “Tuhan, selamatkanlah kami![a] Kami sedang binasa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tolonglah kami.” Kata Yunani σῶσον dapat berarti pembebasan segera dari bahaya maupun “menyelamatkan” dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: mendekati
  rationale: Partisip aoris προσέρχομαι menyatakan gerakan mendekat kepada Yesus sebelum mereka membangunkan-Nya. 'Mendekati' alami dalam bahasa Indonesia dan tidak menambahkan unsur yang tidak dinyatakan.
- source_word: ἤγειραν
  choice: membangunkan
  rationale: Dalam konteks ini ἐγείρω berarti membangunkan seseorang dari tidur, bukan 'membangkitkan' dalam arti kebangkitan.
- source_word: λέγοντες
  choice: sambil berkata
  rationale: Partisip kini ini memperkenalkan isi ucapan mereka. 'Sambil berkata' menghubungkan tindakan membangunkan dengan perkataan tanpa menambahkan keterangan emosi seperti 'berseru'.
- source_word: Κύριε
  choice: Tuhan
  rationale: Vokatif κύριος dipertahankan sebagai gelar 'Tuhan', sehingga rentang maknanya—dari sapaan hormat hingga bobot kristologis—tidak dipersempit menjadi sekadar 'Guru'.
- source_word: σῶσον
  choice: selamatkanlah kami
  rationale: Imperatif aoris σῴζω di sini merupakan permohonan agar segera dilepaskan dari bahaya. Objek 'kami' tersirat dari konteks dan dari klausa jamak orang pertama berikutnya, serta diperlukan oleh ungkapan Indonesia yang alami.
- source_word: ἀπολλύμεθα
  choice: kita akan binasa
  rationale: Bentuk kini tengah/pasif ini menyatakan kebinasaan atau kematian yang segera mengancam. Ungkapan 'akan binasa' menyampaikan bahaya yang sudah mendesak secara alami dalam bahasa Indonesia tanpa membatasi maknanya menjadi hanya 'mati'.
theological_decisions:
- issue: Gelar κύριος yang ditujukan kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: '''Tuhan'' mempertahankan kemungkinan bahwa sapaan itu memiliki bobot lebih daripada sekadar hubungan murid dengan guru, tanpa memaksakan penafsiran kristologis tertentu.'
- issue: Objek jamak yang tersirat dalam σῶσον
  choice: selamatkanlah kami
  alternative: selamatkanlah
  rationale: Bahasa Indonesia paling alami menyatakan objeknya, dan ἀπολλύμεθα ('kita akan binasa') membuat rujukan jamak tersebut jelas. Penambahan 'kami' bersifat idiomatis, bukan penambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dia' ditulis dengan huruf kapital sebagai pronomina yang merujuk kepada Yesus. 'Kami' dipakai dalam permohonan kepada Yesus karena Yesus tidak termasuk kelompok pembicara; 'kita' dipakai dalam pernyataan tentang bahaya bersama karena Yesus berada bersama mereka di perahu.
