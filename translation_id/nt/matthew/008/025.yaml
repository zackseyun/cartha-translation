revisions:
- from: Lalu mereka mendekati dan membangunkan Dia sambil berkata, “Tuhan, selamatkanlah kami![a] Kita akan binasa!”
  to: Kemudian mereka datang kepada-Nya dan membangunkan-Nya, sambil berkata, “Tuhan, selamatkanlah kami![a] Kami sedang binasa!”
  rationale: The revision resolves the incomplete Indonesian verb construction, uses the noninclusive plural pronoun appropriate to the disciples’ plea to Jesus, and more closely reflects the present-tense urgency of ἀπολλύμεθα. It retains the established rendering “Tuhan,” the explicit idiomatic object “kami,” and the lexical-alternative footnote anchored to “selamatkanlah kami.”
