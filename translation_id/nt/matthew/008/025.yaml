review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly understands the sequence: the disciples approach Jesus, wake him, address him as Tuhan, and plead for rescue because they are perishing. However, “mendekati” is incomplete in this construction because Indonesian normally requires its object (“mendekati-Nya”) or uses “datang kepada-Nya.” Further, “kita” in the final clause inclusively can include Jesus, whereas the Greek first-person plural refers to the speakers seeking rescue; “kami” is the appropriate Indonesian pronoun here. “Sedang binasa” better reflects the Greek present ἀπολλύμεθα than the future-oriented “akan binasa.”'
  naturalness: “Datang kepada-Nya dan membangunkan-Nya” is clear, idiomatic modern standard Indonesian. “Sambil berkata” is acceptable, though a direct speech introduction with “dan berkata” reads more naturally and does not change the participial relationship. The urgent cry “Kami sedang binasa!” is natural and preserves the unfolding danger.
  terminology: “Tuhan” appropriately retains κύριε as the established title. “Selamatkanlah kami” accurately renders the urgent imperative σῶσον. The footnote’s alternative “tolonglah kami” is usable, but “selamatkan kami” without the exhortative suffix is a cleaner quoted alternative; its explanation appropriately distinguishes immediate rescue from the broader lexical range.
  issues:
  - severity: medium
    issue: “Mendekati” lacks the required object.
    rationale: προσελθόντες means that they came/approached Jesus. In Indonesian, “mereka mendekati dan membangunkan Dia” leaves “mendekati” syntactically incomplete. “Mereka datang kepada-Nya” supplies the relationship naturally without adding meaning.
  - severity: medium
    issue: The final “kita” may incorrectly include Jesus.
    rationale: The Greek first-person plural is spoken by the disciples about their own peril. Since Jesus is the addressee, Indonesian “kami” is the unambiguous noninclusive pronoun. The source does not state that Jesus shares their threatened destruction.
  - severity: low
    issue: “Akan binasa” weakens the present aspect of ἀπολλύμεθα.
    rationale: The present form depicts ongoing/imminent perishing. “Sedang binasa” represents this more closely than a straightforward future expression.
  revised_text: Kemudian mereka datang kepada-Nya dan membangunkan-Nya, sambil berkata, “Tuhan, selamatkanlah kami![a] Kami sedang binasa!”
  revised_footnotes:
  - marker: a
    text: Atau “tolonglah kami.” Kata Yunani σῶσον dapat berarti pembebasan segera dari bahaya maupun “menyelamatkan” dalam arti yang lebih luas.
    reason: lexical_alternative
