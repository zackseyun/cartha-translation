  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: id
  text: Ketika hari sudah petang, orang-orang membawa kepada-Nya banyak orang yang kerasukan setan[a]. Ia mengusir roh-roh dengan sepatah kata dan menyembuhkan semua orang yang sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang diganggu setan.” Partisip Yunani menunjuk kepada orang-orang yang berada di bawah pengaruh kuasa setan; “kerasukan setan” adalah padanan ringkas yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ketika hari sudah petang
  rationale: Konstruksi genitif absolut ini menyatakan waktu. Ungkapan tersebut alami dalam bahasa Indonesia modern dan tetap mempertahankan peralihan waktu menuju petang.
- source_word: προσήνεγκαν αὐτῷ
  choice: orang-orang membawa kepada-Nya
  rationale: Bentuk verba προσφέρω di sini berarti membawa orang-orang kepada Yesus. Subjek jamak yang tidak disebutkan secara khusus diterjemahkan secara wajar sebagai 'orang-orang'.
- source_word: δαιμονιζομένους πολλούς
  choice: banyak orang yang kerasukan setan
  rationale: '''Kerasukan setan'' merupakan padanan ringkas dan lazim untuk orang-orang yang berada di bawah pengaruh kuasa setan, tetapi catatan kaki mempertahankan kemungkinan cakupan makna yang lebih luas.'
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: Ia mengusir roh-roh itu
  rationale: ἐκβάλλω dalam konteks pengusiran setan berarti 'mengusir'. 'Roh-roh' mempertahankan objek Yunani secara langsung, sedangkan 'itu' mencerminkan artikel tertentu dan kaitannya dengan orang-orang yang baru disebut.
- source_word: λόγῳ
  choice: dengan sepatah kata
  rationale: Datif ini menyatakan sarana. 'Dengan sepatah kata' alami dalam bahasa Indonesia dan menonjolkan kewibawaan perintah Yesus tanpa menambahkan unsur yang tidak eksplisit.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: semua orang yang sakit
  rationale: Ungkapan idiomatis κακῶς ἔχειν berarti berada dalam keadaan sakit. Padanan ini jelas dan sesuai dengan konteks penyembuhan.
- source_word: ἐθεράπευσεν
  choice: menyembuhkan
  rationale: θεραπεύω dalam kisah-kisah penyembuhan Injil secara tepat diterjemahkan 'menyembuhkan'.
theological_decisions:
- issue: Makna δαιμονιζομένους dan τὰ πνεύματα
  choice: 'Mempertahankan kerasukan atau penderitaan akibat setan sebagai kategori nyata dalam narasi: ''kerasukan setan'' dan ''roh-roh itu''.'
  alternative: banyak orang yang diganggu setan; banyak orang yang menderita gangguan kejiwaan
  rationale: Ayat ini membedakan pengusiran roh dari penyembuhan orang sakit. Terjemahan mempertahankan kategori narasi itu dan tidak mengubahnya menjadi diagnosis psikologis modern, sambil mengakui melalui catatan kaki bahwa partisip Yunani tidak harus menentukan kadar penguasaan secara lebih sempit.
- issue: Daya instrumental λόγῳ
  choice: dengan sepatah kata
  alternative: dengan firman-Nya; dengan berbicara
  rationale: Terjemahan instrumental ini menampilkan kewibawaan ucapan Yesus tanpa menambahkan kata ganti kepunyaan atau rumusan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kepada-Nya' mengikuti konvensi penghormatan bagi rujukan kepada Yesus. Struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan atau pembedaan antara pengusiran roh dan penyembuhan.
