base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: id
  text: Roh-roh jahat itu terus memohon kepada-Nya[a] sambil berkata, “Jika Engkau mengusir kami, kirimlah kami ke dalam kawanan babi itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berulang kali memohon kepada-Nya”; bentuk kata kerja Yunani menunjukkan tindakan yang sedang berlangsung atau dilakukan berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: roh-roh jahat
  rationale: Ungkapan ini alami dan jelas dalam bahasa Indonesia serta mempertahankan pengertian tentang makhluk roh jahat yang berpribadi, tanpa mengaburkannya dengan sebutan yang dapat disalahartikan sebagai Iblis sendiri.
- source_word: παρεκάλουν
  choice: terus memohon
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau dilakukan berulang kali; “terus memohon” menyampaikan aspek tersebut dengan wajar.
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel yang memperkenalkan ucapan langsung dialihkan menjadi klausa pengantar yang alami dalam narasi bahasa Indonesia.
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk bersyarat dari sudut pandang para roh jahat dan tidak mengubahnya menjadi pernyataan sebab atau kepastian.
- source_word: ἐκβάλλεις
  choice: Engkau mengusir
  rationale: “Mengusir” merupakan padanan Indonesia yang tepat dan lazim untuk tindakan mengeluarkan roh jahat.
- source_word: ἀπόστειλον ἡμᾶς
  choice: suruhlah kami masuk
  rationale: Menyampaikan permintaan imperatif agar Yesus mengarahkan mereka masuk ke tujuan yang disebutkan; bentuk ini lebih alami daripada “kirimlah kami” dalam konteks makhluk roh.
- source_word: ἀγέλην τῶν χοίρων
  choice: kawanan babi itu
  rationale: “Kawanan” adalah sebutan alami untuk sekelompok hewan, sedangkan “babi” merupakan istilah modern dan umum untuk χοῖρος.
- source_word: οἱ δὲ
  choice: Roh-roh jahat itu
  rationale: δέ berfungsi sebagai penghubung kelanjutan narasi; dalam bahasa Indonesia hubungan tersebut dapat dibiarkan tersirat tanpa menambahkan kontras yang lebih kuat daripada teks sumber.
theological_decisions:
- issue: Penyebutan makhluk roh jahat
  choice: roh-roh jahat
  alternative: demon-demon
  rationale: Pilihan ini mempertahankan penggambaran mereka sebagai makhluk supernatural yang berbicara kepada Yesus, tanpa mengimpor penjelasan doktrinal tambahan dan tanpa menyamakan mereka dengan Iblis.
- issue: Nuansa syarat dalam permohonan
  choice: Jika Engkau mengusir kami
  alternative: Karena Engkau mengusir kami
  rationale: εἰ dibiarkan sebagai syarat, sehingga ketegangan dan sudut pandang para pembicara tidak ditafsirkan lebih jauh menjadi sebab atau kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
