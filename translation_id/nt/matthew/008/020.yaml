reference: Matthew 8:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Rubah mempunyai liang, dan burung-burung di langit mempunyai sarang, tetapi Anak Manusia[a] tidak mempunyai tempat untuk meletakkan kepala-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Manusia” adalah sebutan yang Yesus gunakan untuk diri-Nya sendiri; sebagai alternatif, sebagian menerjemahkannya “Sang Insan.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani berfungsi sebagai gaya naratif. Bahasa Indonesia secara alami memakai “berkata” tanpa penandaan waktu yang kaku.
- source_word: ἀλώπεκες
  choice: rubah
  rationale: Padanan langsung dan umum untuk hewan yang dimaksud; bentuk nomina bahasa Indonesia tidak perlu diulang karena predikat menunjukkan makna umum jamak.
- source_word: φωλεοὺς
  choice: liang
  rationale: “Liang” adalah sebutan alami bagi tempat tinggal rubah dan mempertahankan gambaran konkretnya.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan hubungan burung dengan οὐρανός tanpa memakai “surga”, yang dalam konteks ini dapat memberi kesan teologis yang tidak dimaksudkan.
- source_word: κατασκηνώσεις
  choice: sarang
  rationale: Dalam konteks burung, “sarang” merupakan padanan modern yang paling alami, meskipun kata Yunani secara lebih luas dapat berarti tempat bernaung atau berdiam.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan diri Yesus yang mapan beserta kemungkinan gema dan ketegangan teologisnya, tanpa memparafrasakannya sebagai sekadar “manusia”.
- source_word: οὐκ ἔχει ποῦ
  choice: tidak mempunyai tempat untuk
  rationale: Mengungkapkan konstruksi negatif Yunani secara wajar dalam bahasa Indonesia tanpa menghilangkan makna bahwa tidak ada tempat yang tersedia.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: meletakkan kepala-Nya
  rationale: Padanan idiomatis yang tetap mempertahankan gambaran konkret tindakan membaringkan atau menyandarkan kepala untuk beristirahat.
theological_decisions:
- issue: Penerjemahan sebutan diri Yesus ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk ungkapan dan resonansi mesianik yang telah dikenal, termasuk kemungkinan kaitannya dengan Daniel 7, sambil tidak memutuskan seluruh lapisan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara kontras antara tempat tinggal hewan dan ketiadaan tempat bagi Anak Manusia dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah keseluruhan ucapan karena catatan menjelaskan gelar di dalam kalimat.
