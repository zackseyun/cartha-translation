  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: id
  text: Orang-orang itu takjub dan berkata, “Orang macam apakah dia ini[a], sampai-sampai angin dan laut pun taat kepadanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang seperti apakah dia ini?” Ungkapan Yunani menanyakan macam atau kualitas orang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Orang-orang itu
  rationale: Frasa ini menunjuk kepada orang-orang yang berada di situ, dalam konteksnya para murid di perahu. Bentuk ini alami dalam bahasa Indonesia dan tidak memperluas rujukannya menjadi umat manusia pada umumnya.
- source_word: ἐθαύμασαν
  choice: takjub
  rationale: Kata ini menyatakan reaksi keheranan yang kuat dan penuh kekaguman; “takjub” ringkas, wajar, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel Yunani diungkapkan sebagai verba berkoordinasi agar hubungan tindakan tetap jelas dan alami dalam narasi bahasa Indonesia.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Orang macam apakah dia ini
  rationale: ποταπός menanyakan macam, sifat, atau kualitas seseorang. Susunan ini mempertahankan nada pertanyaan yang diliputi keheranan tanpa menjelaskan identitas Yesus melampaui teks.
- source_word: ὅτι
  choice: sampai-sampai
  rationale: Dalam pertanyaan ini ὅτι memperkenalkan keadaan yang menjadi dasar keheranan. “Sampai-sampai” menyampaikan hubungan tersebut secara idiomatis sekaligus menonjolkan sifat luar biasa dari ketaatan alam.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: angin dan laut pun
  rationale: 'Partikel “pun” menyampaikan daya tekan καί: bahkan angin dan laut termasuk yang tunduk kepada perintahnya. “Laut” mempertahankan sebutan naratif Yunani θάλασσα.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: taat kepadanya
  rationale: ὑπακούω menyatakan mendengarkan dengan tunduk atau menaati. Pilihan ini mempertahankan gambaran tentang kuasa pribadi yang ditaati oleh angin dan laut.
theological_decisions:
- issue: Bobot kristologis pertanyaan para murid
  choice: Pertanyaan diterjemahkan secara langsung sambil mempertahankan implikasi bahwa Yesus berkuasa atas alam ciptaan.
  alternative: Menambahkan kesimpulan eksplisit mengenai identitas ilahi Yesus, atau mereduksinya menjadi sekadar reaksi terhadap mukjizat.
  rationale: Teks menimbulkan pertanyaan mengenai identitas Yesus melalui ketaatan angin dan laut, tetapi belum menyatakan jawabannya secara eksplisit dalam ayat ini. Terjemahan mempertahankan ketegangan naratif dan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. “Takjub,” “sampai-sampai,” dan “taat kepadanya” dipilih agar ayat mudah dipahami tanpa mengurangi daya keheranan dan bobot pertanyaannya.
