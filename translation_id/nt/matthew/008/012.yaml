id: MAT.8.12
reference: Matthew 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: id
  text: Namun, anak-anak kerajaan itu[a] akan dicampakkan ke dalam kegelapan yang paling luar. Di sanalah akan ada tangisan dan kertak gigi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra kerajaan”; suatu ungkapan bagi orang-orang yang dipandang sebagai ahli waris atau anggota yang semestinya dari kerajaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Namun, anak-anak kerajaan itu
  rationale: δέ menyatakan kontras dengan ayat sebelumnya, sehingga diterjemahkan “Namun”. Ungkapan Semitis “anak-anak kerajaan” mempertahankan idiom Yunani dan ironi bahwa orang-orang yang dianggap sebagai anggota atau ahli waris kerajaan justru dikeluarkan.
- source_word: ἐκβληθήσονται
  choice: akan dicampakkan
  rationale: Bentuk pasif futur dari ἐκβάλλω menyatakan pengusiran yang kuat. “Dicampakkan” mempertahankan daya ungkap itu dalam ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: ke dalam kegelapan yang paling luar
  rationale: Terjemahan ini mempertahankan gambaran spasial dan bentuk komparatif ἐξώτερον yang dipakai secara idiomatis, tanpa menggantinya dengan istilah teologis yang lebih khusus.
- source_word: ἐκεῖ
  choice: Di sanalah
  rationale: Partikel penegas “-lah” menampilkan tekanan lokatif yang muncul karena ἐκεῖ ditempatkan di awal klausa Yunani.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: tangisan dan kertak gigi
  rationale: “Tangisan” menyampaikan ratapan tanpa melebihkan intensitas κλαυθμός, sedangkan “kertak gigi” merupakan ungkapan Indonesia yang ringkas dan dikenal untuk tindakan mengertakkan gigi.
theological_decisions:
- issue: Gambaran penghakiman dan pengucilan
  choice: Mempertahankan gambaran dicampakkan ke dalam kegelapan yang paling luar serta tangisan dan kertak gigi
  alternative: Menggantikannya dengan istilah penafsiran seperti “neraka” atau “hukuman kekal”
  rationale: Ayat ini menggambarkan pengucilan dan penderitaan yang berat, tetapi tidak memakai istilah Yunani khusus untuk “neraka”. Mempertahankan metaforanya menghindari penambahan suatu sistem doktrinal yang tidak dinyatakan langsung dalam ayat.
- issue: Ungkapan υἱοὶ τῆς βασιλείας
  choice: anak-anak kerajaan
  alternative: putra-putra kerajaan; para ahli waris kerajaan
  rationale: “Anak-anak kerajaan” mempertahankan bentuk idiom sumber secara alami dalam bahasa Indonesia dan dapat mencakup orang-orang yang dipandang berhak atau semestinya termasuk dalam kerajaan. “Putra-putra” terlalu mudah dipahami sebagai keturunan laki-laki secara biologis, sedangkan “para ahli waris” menjelaskan salah satu nuansa tetapi mempersempit ambiguitas idiom.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Di sanalah” menekankan tempat penghakiman tanpa pengulangan yang janggal. Istilah “kerajaan” dibiarkan tanpa tambahan “Allah” atau “surga” karena teks Yunani ayat ini hanya menyebut “kerajaan”.
