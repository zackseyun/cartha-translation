  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: id
  text: Ketika Yesus memasuki Kapernaum, seorang perwira[a] datang kepada-Nya dan memohon kepada-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala seratus”; seorang komandan pasukan yang biasanya disebut senturion.
    reason: lexical_clarification
  - marker: b
    text: Atau “meminta dengan sungguh-sungguh kepada-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Ketika Yesus memasuki
  rationale: Konstruksi genitif absolut dengan partisip aoris diterjemahkan sebagai anak kalimat waktu. “Ketika” mempertahankan hubungan waktu tanpa memastikan bahwa tindakan berikutnya terjadi persis saat atau sesudah Ia masuk. Nama “Yesus” dipakai berdasarkan konteks agar rujukan kata ganti jelas dalam bahasa Indonesia.
- source_word: εἰς Καφαρναοὺμ
  choice: Kapernaum
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia; preposisi εἰς sudah tercakup secara alami dalam verba “memasuki”.
- source_word: προσῆλθεν αὐτῷ
  choice: datang kepada-Nya
  rationale: Ungkapan ini secara wajar berarti datang kepada atau menghampiri seseorang. “Datang kepada-Nya” mempertahankan gerak mendekat tanpa menambah nuansa yang tidak dinyatakan.
- source_word: ἑκατόνταρχος
  choice: seorang perwira
  rationale: Istilah ini menunjuk seorang komandan yang secara harfiah berkaitan dengan seratus prajurit. “Perwira” alami dan mudah dipahami dalam bahasa Indonesia, sementara rincian pangkatnya dipertahankan dalam catatan kaki.
- source_word: παρακαλῶν αὐτὸν
  choice: dan memohon kepada-Nya
  rationale: Dalam konteks ini παρακαλέω menyatakan permintaan yang sungguh-sungguh. “Memohon” lebih kuat daripada sekadar “meminta”, tetapi tidak harus menyiratkan luapan emosi seperti “mengiba-iba”. Kata “dan” membuat partisip penyerta ini alami dalam narasi Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk sapaan ilahi “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia. Koma penutup dipertahankan karena kalimat berlanjut ke ayat berikutnya.
