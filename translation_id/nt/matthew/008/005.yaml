  source_fidelity: 'Terjemahan mempertahankan urutan dan relasi sintaksis Yunani dengan baik: konstruksi genitif absolut diterjemahkan wajar sebagai klausa waktu, εἰς terserap dalam “memasuki,” προσῆλθεν menyatakan gerak mendekat, dan παρακαλῶν dipertahankan sebagai tindakan memohon yang menyertai kedatangan perwira itu. Penyebutan “Yesus” tepat berdasarkan konteks dan tidak menambahkan makna teologis.'
  naturalness: Bahasa Indonesia baku dan mengalir. “Ketika Yesus memasuki Kapernaum, seorang perwira datang kepada-Nya dan memohon kepada-Nya” jelas, bermartabat, dan cocok dengan gaya naratif. Koma terakhir tepat karena ujaran/perincian permohonan berlanjut pada ayat berikutnya.
  terminology: “Kapernaum” dan bentuk hormat “-Nya” konsisten dengan penggunaan Alkitab bahasa Indonesia. “Perwira” adalah padanan umum yang alami untuk ἑκατόνταρχος; catatan kaki pada kata tersebut secara memadai menjaga kekhususan makna “kepala seratus”/senturion. “Memohon” sesuai dengan παρακαλέω dalam konteks permintaan yang mendesak tanpa menguatkannya secara berlebihan.
