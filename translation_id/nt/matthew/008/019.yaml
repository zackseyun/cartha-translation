  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: id
  text: Kemudian seorang ahli Taurat datang kepada Yesus dan berkata kepada-Nya, “Guru, aku akan mengikuti-Mu ke mana pun Engkau pergi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke mana pun Engkau berangkat” atau “ke mana pun Engkau pergi meninggalkan suatu tempat.” Kata kerja Yunani yang dipakai dapat secara lebih khusus berarti pergi atau berangkat meninggalkan suatu tempat, meskipun dalam konteks ini wajar diterjemahkan “pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: datang mendekati
  rationale: Partisip aoris ini menunjukkan gerak mendekat sebelum orang itu berbicara. Ungkapan “datang mendekati” alami dalam bahasa Indonesia dan mempertahankan unsur pendekatan.
- source_word: εἷς
  choice: seorang
  rationale: Numeralia ini secara idiomatis memperkenalkan satu individu. “Seorang” menyampaikan maknanya dengan wajar tanpa memberi kesan bahwa ia pasti salah satu anggota kelompok yang baru disebut.
- source_word: γραμματεὺς
  choice: ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk kepada orang yang ahli dalam Kitab Suci dan hukum Taurat. “Ahli Taurat” merupakan padanan baku dan lebih mudah dipahami daripada “juru tulis”.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Yesus. Kapitalisasi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia tanpa menambah gelar yang tidak terdapat dalam teks Yunani.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini menerjemahkan makna dasar διδάσκαλος secara langsung dan tidak memasukkan nuansa tambahan dari “Tuan” atau gelar “Rabi”.
- source_word: ἀκολουθήσω
  choice: aku akan mengikuti
  rationale: Bentuk futur menyatakan tekad atau niat orang itu. Padanan ini mempertahankan arti harfiah mengikuti sekaligus kemungkinan nuansa menjadi pengikut.
- source_word: ὅπου ἐὰν
  choice: ke mana pun
  rationale: Gabungan ini menyatakan tempat atau tujuan yang tidak terbatas. Karena verba berikutnya menyatakan gerak, “ke mana pun” lebih idiomatis daripada “di mana pun”.
- source_word: ἀπέρχῃ
  choice: Engkau pergi
  rationale: Walaupun verba ini dapat secara lebih khusus berarti pergi meninggalkan suatu tempat atau berangkat, dalam konteks ini “pergi” menyampaikan gerak menuju tujuan mana pun secara alami.
theological_decisions:
- issue: Sapaan διδάσκαλος bagi Yesus
  choice: Guru
  alternative: Tuan; Rabi
  rationale: “Guru” mempertahankan arti leksikal dan sikap hormat dalam sapaan itu tanpa menaikkan bobot kristologisnya atau menggantinya dengan gelar Yahudi yang berbeda.
- issue: Nuansa ἀκολουθήσω
  choice: aku akan mengikuti-Mu
  alternative: aku akan menjadi pengikut-Mu
  rationale: Bentuk yang dipilih mempertahankan ketegangan antara tindakan mengikuti secara fisik dan makna pemuridan, tanpa membatasi perkataan itu hanya pada salah satu makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan khidmat. “Aku–Engkau” dipakai dalam ujaran langsung kepada Yesus, sedangkan “ahli Taurat” mempertahankan istilah yang lazim dikenal pembaca Alkitab Indonesia.
