id: MAT.8.17
reference: Matthew 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: id
  text: 'supaya terpenuhi apa yang disampaikan melalui nabi Yesaya, yang berkata: “Ia sendiri mengambil kelemahan kita[a] dan menanggung penyakit kita.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sakit kita” atau “penyakit kita.” Kata Yunani ini dapat berarti kelemahan, ketidakberdayaan, atau sakit.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “menanggung” juga dapat berarti “membawa” atau “memikul.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: supaya terpenuhi
  rationale: Menjaga nuansa tujuan/hasil dalam rumusan penggenapan Matius dengan bahasa Indonesia yang wajar.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: apa yang disampaikan melalui Nabi Yesaya
  rationale: “Melalui” mempertahankan διά dengan genetif sebagai perantaraan; “disampaikan” terdengar alami untuk perkataan nubuat.
- source_word: λέγοντος
  choice: ':'
  rationale: Dalam bahasa Indonesia, tanda titik dua secara alami memperkenalkan isi perkataan tanpa perlu menambahkan frasa kaku seperti “yang berkata”.
- source_word: Αὐτὸς
  choice: Dia sendiri
  rationale: Mempertahankan penekanan pada pronomina Yunani.
- source_word: ἀσθενείας
  choice: kelemahan-kelemahan
  rationale: Mempertahankan keluasan makna yang dapat mencakup kelemahan, ketidakberdayaan, atau sakit, sementara konteksnya tetap berkaitan dengan penyembuhan.
- source_word: ἔλαβεν
  choice: mengambil
  rationale: Padanan langsung yang tidak menambahkan gagasan “menyingkirkan” dan tetap membedakannya dari βαστάζω.
- source_word: νόσους
  choice: penyakit-penyakit
  rationale: Menyatakan penyakit jasmani secara jelas dan sesuai dengan konteks pelayanan penyembuhan Yesus.
- source_word: ἐβάστασεν
  choice: menanggung
  rationale: Mencakup arti membawa atau memikul serta mempertahankan gema kutipan Yesaya tanpa memaksakan penafsiran teologis tertentu.
theological_decisions:
- issue: Makna kutipan Yesaya 53:4 dalam konteks penyembuhan Matius
  choice: 'Menggunakan istilah jasmani namun tetap luas: “kelemahan-kelemahan” dan “penyakit-penyakit.”'
  alternative: “sakit-penyakit kita” atau istilah yang lebih eksplisit bernuansa penggantian.
  rationale: Konteks langsung berbicara tentang penyembuhan jasmani, tetapi ἀσθένεια memiliki cakupan lebih luas daripada penyakit saja. Terjemahan ini menjaga hubungan dengan konteks sekaligus tidak mempersempit ketegangan teologis kutipan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kutipan dibuat alami dalam bahasa Indonesia; bentuk jamak ulang dipakai untuk menampilkan kedua nomina jamak Yunani dengan jelas.
