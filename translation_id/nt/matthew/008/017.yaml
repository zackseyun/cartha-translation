  verdict: revise
  source_fidelity: 'Draf pada dasarnya setia kepada teks Yunani: "supaya terpenuhi," perantaraan "melalui nabi Yesaya," penekanan "Ia sendiri," serta pembedaan ἔλαβεν dan ἐβάστασεν dipertahankan. Namun, λέγοντος ("yang berkata") tidak sebaiknya dihilangkan seluruhnya hanya dengan titik dua, karena partisip itu secara eksplisit menghubungkan kutipan dengan Yesaya. Penambahan "yang berkata" memulihkan unsur tersebut tanpa membuat kalimat tidak alami.'
  naturalness: Bentuk ulang "kelemahan-kelemahan" dan "penyakit-penyakit" tidak diperlukan untuk menyatakan bentuk jamak Yunani dan terdengar kurang idiomatis dalam bahasa Indonesia modern. Nomina tanpa pengulangan tetap dapat bersifat generik/jamak menurut konteks. "Ia" lebih lazim daripada "Dia" dalam prosa Alkitab Indonesia yang baku, sementara "Ia sendiri" mempertahankan tekanan αὐτός.
  terminology: '"Kelemahan" secara leksikal dapat mencakup ἀσθένεια dan tidak menghapus keluasan istilah itu; catatan kaki dengan alternatif "sakit" dan "penyakit" menolong pembaca melihat relevansinya dalam konteks penyembuhan. "Penyakit" tepat untuk νόσους. "Menanggung" merupakan padanan yang wajar untuk ἐβάστασεν dan mempertahankan gema Yesaya tanpa menetapkan tafsiran teologis tertentu.'
