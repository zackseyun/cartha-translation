  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: id
  text: Lalu Yesus menyentuh tangannya, dan demam itu meninggalkannya. Ia pun bangun dan melayani Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai melayani Yesus.” Bentuk imperfek Yunani dapat sekadar menggambarkan tindakan yang sedang atau terus berlangsung, tetapi juga dapat menyiratkan bahwa ia mulai melayani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: menyentuh tangannya
  rationale: Bentuk tengah ἅπτομαι dengan genitif berarti menyentuh atau mengadakan kontak. Ungkapan ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan tindakan sebagai memegang.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: demam itu meninggalkannya
  rationale: ἀφίημι di sini berarti meninggalkan atau pergi dari. Terjemahan ini mempertahankan konstruksi Yunani yang menggambarkan demam sebagai pelaku.
- source_word: πυρετός
  choice: demam
  rationale: Kata benda ini secara langsung menunjuk pada demam; tidak diperlukan perluasan menjadi penyakit tertentu.
- source_word: ἠγέρθη
  choice: ia pun bangun
  rationale: Bentuk pasif ἐγείρω dapat berfungsi secara intransitif dalam konteks ini dan menyatakan bahwa perempuan itu bangun sesudah sembuh. Partikel 'pun' menandai kelanjutan hasil secara alami tanpa menambahkan gagasan teologis.
- source_word: διηκόνει αὐτῷ
  choice: melayani Yesus
  rationale: διακονέω berarti melayani atau mengurus kebutuhan seseorang. Imperfek menggambarkan tindakan yang sedang atau terus berlangsung, tetapi tidak harus diterjemahkan secara inseptif sebagai 'mulai melayani'. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina laki-laki karena bahasa Indonesia tidak membedakan 'dia' menurut gender.
theological_decisions:
- issue: Kemungkinan membaca ἠγέρθη sebagai ungkapan kebangkitan
  choice: ia pun bangun
  alternative: ia dibangkitkan
  rationale: Dalam konteks langsung, kata itu menyatakan bahwa perempuan tersebut bangun setelah demamnya lenyap. Terjemahan tidak memasukkan asosiasi kebangkitan yang tidak dituntut oleh narasi.
- issue: Daya aspek imperfek διηκόνει
  choice: melayani Yesus
  alternative: mulai melayani Yesus
  rationale: Imperfek dapat menggambarkan tindakan yang berlangsung dan dalam konteks tertentu dapat dipahami secara inseptif. Karena permulaan tindakan tidak dinyatakan secara eksplisit, teks utama memakai bentuk netral dan catatan kaki mempertahankan kemungkinan alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kalimat Yunani yang berantai dipecah menjadi dua kalimat agar jelas. 'Yesus' menggantikan pronomina datif αὐτῷ untuk menghindari ketaksaan pronomina Indonesia, tanpa mengubah rujukannya.
