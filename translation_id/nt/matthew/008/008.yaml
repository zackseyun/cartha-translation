id: MAT.8.8
reference: Matthew 8:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: id
  text: Perwira itu menjawab, “Tuhan, aku tidak layak jika Engkau masuk ke bawah atap rumahku. Namun, ucapkanlah sepatah kata saja, maka hambaku[a] akan disembuhkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak laki-lakiku” atau “anakku.” Kata Yunani yang dipakai dapat berarti anak, anak muda, atau hamba, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔφη
  choice: menjawab
  rationale: Gabungan partisip ἀποκριθείς dengan verba ujaran ἔφη merupakan pengantar tutur idiomatis; satu verba Indonesia, “menjawab,” mempertahankan daya responsif tanpa pengulangan kaku “menjawab dan berkata.”
- source_word: ἑκατόνταρχος
  choice: perwira
  rationale: Istilah ini menunjuk komandan pasukan yang secara tradisional disebut senturion. “Perwira” alami dan mudah dipahami dalam bahasa Indonesia; identitas militernya jelas dari konteks perikop.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan arti utama κύριος dan kemungkinan bobot kristologis sapaan kepada Yesus, tanpa membatasinya menjadi sekadar sapaan sopan seperti “Tuan.”
- source_word: οὐκ εἰμὶ ἱκανός
  choice: aku tidak layak
  rationale: Dalam ungkapan ini ἱκανός menyatakan ketidaklayakan atau ketidakpantasan, bukan ketidakmampuan praktis.
- source_word: ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς
  choice: menerima Engkau di bawah atap rumahku
  rationale: Rumusan ini mempertahankan citra harfiah “di bawah atapku” sambil mengungkapkan secara alami maksud masuknya Yesus ke rumah si perwira.
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: Namun, ucapkanlah sepatah kata saja
  rationale: Terjemahan ini mempertahankan pembatas μόνον dan ungkapan Yunani “berkata dengan/sebuah kata” dalam bahasa Indonesia yang alami; maksudnya ialah bahwa ucapan Yesus saja sudah cukup.
- source_word: ἰαθήσεται
  choice: akan disembuhkan
  rationale: Bentuk pasif futur ἰάομαι paling langsung dan wajar diterjemahkan “akan disembuhkan” dalam konteks penyembuhan mukjizat.
- source_word: παῖς
  choice: hambaku
  rationale: παῖς dapat berarti anak, anak muda, atau hamba. Konteks perwira dan paralel naratif mendukung “hamba,” tetapi ambiguitas leksikalnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna κύριος sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” menjaga kemungkinan makna yang lebih tinggi daripada kesopanan biasa tanpa memaksakan penjelasan kristologis tambahan ke dalam ayat.
- issue: Identitas παῖς
  choice: hamba
  alternative: anak laki-laki atau anak
  rationale: Konteks sosial paling mendukung “hamba,” tetapi kata Yunani itu sendiri lebih luas sehingga alternatifnya perlu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” mengikuti tuturan langsung pribadi, sedangkan “Engkau” menandai sapaan hormat kepada Yesus. Citra “di bawah atap rumahku” dipertahankan karena hidup dan mudah dipahami.
