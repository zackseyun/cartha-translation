id: MAT.8.10
reference: Matthew 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: id
  text: Ketika mendengar itu,[a] Yesus kagum lalu berkata kepada orang-orang yang mengikuti-Nya, “Sesungguhnya Aku berkata kepadamu, Aku belum pernah menemukan iman sebesar ini pada siapa pun di Israel.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Setelah mendengar.” Kata “itu” mengacu pada perkataan perwira sebelumnya.'
    reason: implicit_context
  - marker: b
    text: 'Dapat juga diterjemahkan: “Pada siapa pun di Israel belum pernah Aku menemukan iman yang demikian besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Ketika mendengar itu
  rationale: Partisipel aoris menyatakan keadaan yang mendahului tindakan utama. Kata “itu” ditambahkan secara wajar untuk menunjuk pada perkataan perwira dalam konteks sebelumnya.
- source_word: ἐθαύμασεν
  choice: kagum
  rationale: Mengungkapkan rasa takjub Yesus secara alami dalam bahasa Indonesia tanpa menambahkan gagasan ketidaktahuan atau kekeliruan.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: kepada orang-orang yang mengikuti-Nya
  rationale: Partisipel kini menunjuk kepada orang-orang yang sedang menyertai Yesus, bukan harus berarti suatu kelompok atau jabatan resmi.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Mempertahankan sifat khidmat dan penegasan formula ucapan Yesus dengan ungkapan Indonesia yang mapan dan jelas.
- source_word: παρ’ οὐδενὶ
  choice: pada siapa pun ... belum pernah
  rationale: παρά dengan datif menyatakan keberadaan atau kasus seseorang; bersama negasi, konstruksi Indonesia ini menyampaikan bahwa tidak ada seorang pun yang pada dirinya Yesus menemukan iman demikian.
- source_word: τοσαύτην πίστιν
  choice: iman sebesar ini
  rationale: τοσαύτην menekankan derajat atau besarnya iman. Ungkapan ini alami dan secara eksplisit mempertahankan penekanan tersebut.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: di Israel
  rationale: Menerjemahkan cakupan lokatif-korporat frasa Yunani secara langsung, yang dapat merujuk kepada Israel sebagai umat dalam konteks ini.
- source_word: εὗρον
  choice: belum pernah menemukan
  rationale: Aoris diterjemahkan secara idiomatis untuk menyatakan pengalaman Yesus sampai saat itu; “belum pernah” juga bekerja dengan “siapa pun” untuk menyampaikan negasi Yunani dengan jelas.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; keyakinan
  rationale: Dalam konteks ini πίστις menunjuk pada keyakinan perwira terhadap kuasa dan kewenangan Yesus. “Iman” mempertahankan istilah teologis yang umum tanpa meniadakan nuansa percaya.
- issue: Ruang lingkup “di Israel”
  choice: pada siapa pun di Israel
  alternative: di antara umat Israel
  rationale: Teks dapat dipahami secara lokatif maupun korporat. Terjemahan utama mempertahankan bentuk yang ringkas dan tidak memaksakan apakah penekanannya terutama pada wilayah atau umat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia; susunan kalimat dibuat alami sambil mempertahankan penegasan pada luar biasanya iman perwira.
