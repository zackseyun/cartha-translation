  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: id
  text: Namun, Yesus berkata kepadanya, “Ikutlah Aku, dan biarkanlah orang-orang mati[a] menguburkan orang-orang mati mereka sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sebutan pertama “orang-orang mati” sering dipahami secara kiasan: orang-orang yang tidak peka secara rohani dapat menguburkan mereka yang mati secara jasmani.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai tanggapan Yesus yang berlawanan secara ringan dengan permintaan sebelumnya tanpa melebih-lebihkan kontras.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani dinaturalkan menjadi bentuk lampau naratif Indonesia; bahasa Indonesia tidak memiliki padanan gramatikal langsung yang perlu mempertahankan peralihan kala tersebut.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Imperatif langsung yang secara alami menyatakan tindakan mengikuti sekaligus panggilan menjadi murid.
- source_word: ἄφες
  choice: biarkan
  rationale: Menyampaikan perintah untuk melepaskan urusan atau tanggung jawab itu kepada pihak lain; lebih alami dalam konstruksi Indonesia dengan verba berikutnya.
- source_word: νεκρούς ... νεκρούς
  choice: orang-orang mati ... orang-orang mati
  rationale: Mempertahankan pengulangan kata Yunani yang sama serta permainan makna dan ketegangan antara kemungkinan makna kiasan pada pemakaian pertama dan makna harfiah pada pemakaian kedua.
- source_word: θάψαι
  choice: menguburkan
  rationale: Padanan Indonesia yang langsung dan wajar untuk infinitif tujuan/pelengkap sesudah ἄφες.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: orang-orang mati mereka sendiri
  rationale: Mempertahankan penekanan posesif refleksif ἑαυτῶν melalui frasa 'mereka sendiri'.
theological_decisions:
- issue: Makna 'orang-orang mati' dalam perkataan Yesus
  choice: 'Teks utama mempertahankan ungkapan yang sama pada kedua kemunculan: ''orang-orang mati ... orang-orang mati mereka sendiri''.'
  alternative: Kemunculan pertama dijelaskan langsung sebagai 'orang-orang yang mati secara rohani', sedangkan yang kedua sebagai orang yang mati secara jasmani.
  rationale: Bahasa Yunani menggunakan kata yang sama dua kali. Terjemahan tidak menambahkan 'secara rohani', sehingga permainan kata, daya kejut, dan ketegangan teologis perkataan itu tetap terpelihara; tafsiran kiasan yang umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus. Pengulangan yang terasa tajam dipertahankan karena merupakan ciri retoris sumber.
