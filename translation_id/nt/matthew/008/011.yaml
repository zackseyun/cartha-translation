  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: banyak orang akan datang dari timur dan barat dan akan duduk makan[a] bersama Abraham, Ishak, dan Yakub di dalam Kerajaan Surga[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring” atau “bersandar”; pada zaman itu orang mengambil tempat demikian ketika makan dalam suatu perjamuan.
    reason: cultural_note
  - marker: b
    text: Ungkapan “dari timur dan barat” mengisyaratkan orang-orang yang datang dari berbagai wilayah jauh dan, dalam konteks ini, kemungkinan mencakup orang-orang dari luar Israel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: δέ menandai peralihan yang bernuansa kontras dengan perkataan sebelumnya. “Namun” menyampaikan hubungan itu secara wajar, sedangkan “Aku berkata kepadamu” mempertahankan bentuk langsung dan khidmat.
- source_word: πολλοὶ
  choice: Banyak orang
  rationale: Kata sifat ini dipakai secara substantival. Bahasa Indonesia memerlukan “orang” agar maknanya jelas dan alami.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: dari timur dan barat
  rationale: Bentuk jamak Yunani ini merupakan ungkapan bagi arah atau wilayah. Terjemahan ini mempertahankan cakupan geografis yang luas tanpa menambahkan identitas kelompok tertentu.
- source_word: ἥξουσιν
  choice: akan datang
  rationale: ἥκω berarti datang atau tiba; “akan datang” merupakan padanan yang langsung dan alami dalam konteks orang-orang dari wilayah jauh.
- source_word: ἀνακλιθήσονται
  choice: lalu duduk makan
  rationale: Kata kerja ini secara harfiah menggambarkan berbaring atau bersandar pada meja menurut kebiasaan perjamuan kuno. “Duduk makan” menyampaikan fungsi tindakan itu secara alami bagi pembaca Indonesia modern, sementara catatan kaki mempertahankan gambaran budaya aslinya.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: bersama Abraham, Ishak, dan Yakub
  rationale: μετά dengan genitif menyatakan kebersamaan, di sini dalam perjamuan. Nama-nama memakai bentuk Indonesia yang lazim.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: di dalam Kerajaan Surga
  rationale: Ungkapan khas Matius ini diterjemahkan dengan istilah Indonesia yang mapan. “Di dalam” menegaskan ranah kerajaan tanpa menerjemahkan bentuk jamak harfiah “surga-surga”, yang tidak idiomatis.
theological_decisions:
- issue: Gambaran perjamuan dan persekutuan eskatologis
  choice: Mempertahankan konteks makan melalui “duduk makan” dan menjelaskan postur harfiahnya dalam catatan kaki.
  alternative: “akan duduk bersama Abraham, Ishak, dan Yakub” atau “akan berbaring bersama”
  rationale: Teks menggambarkan keikutsertaan dalam perjamuan, bukan sekadar keberadaan di tempat yang sama. Terjemahan utama dibuat alami, sedangkan catatan menjaga detail budaya tindakan bersandar saat makan.
- issue: Cakupan “banyak orang” dari timur dan barat
  choice: Menerjemahkannya secara geografis tanpa menyebut mereka secara eksplisit sebagai bangsa-bangsa lain.
  alternative: “Banyak orang dari bangsa-bangsa lain akan datang dari timur dan barat”
  rationale: Konteks mengisyaratkan penerimaan orang dari luar Israel, tetapi teks Yunani hanya menyebut “banyak orang” dari timur dan barat. Ketegangan dan implikasi itu tidak diperjelas melampaui sumber.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan ilahi “Aku” memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Duduk makan” dipilih agar mudah dipahami, dengan detail postur perjamuan kuno dijaga dalam catatan kaki. Semua penanda catatan kaki muncul dalam teks utama.
