revisions:
- from: Lalu Yesus berkata kepada perwira itu, “Pergilah. Seperti yang engkau percayai, terjadilah bagimu.” Pada saat itu juga hambanya[a] disembuhkan.
  to: Lalu Yesus berkata kepada perwira itu, “Pergilah. Sebagaimana engkau telah percaya, terjadilah bagimu.” Pada saat itu hambanya disembuhkan.
  rationale: Revisi memperjelas bahwa Yesus merujuk pada tindakan percaya sang perwira, tanpa mengubahnya menjadi istilah nominal seperti «iman». Penanda waktu dikembalikan ke ungkapan yang lebih dekat dengan teks Yunani. Catatan kaki mempertahankan ambiguitas leksikal παῖς tanpa menambahkan kepemilikan pada alternatifnya.
