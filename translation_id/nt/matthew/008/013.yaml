  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: id
  text: Lalu Yesus berkata kepada perwira itu, “Pergilah. Sebagaimana engkau telah percaya, terjadilah bagimu.” Pada saat itu hambanya disembuhkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: perwira
  rationale: Istilah ini menunjuk kepada seorang perwira yang memimpin kira-kira seratus prajurit. Dalam konteks Injil, “perwira” merupakan padanan Indonesia yang ringkas, alami, dan cukup dikenal tanpa perlu menambahkan keterangan yang tidak dinyatakan langsung dalam ayat.
- source_word: Ὕπαγε
  choice: Pergilah
  rationale: Bentuk imperatif ini menyuruh seseorang pergi. “Pergilah” jelas, wajar, dan mempertahankan kekuatan perintah dalam bahasa Indonesia.
- source_word: ὡς ἐπίστευσας
  choice: Seperti yang engkau percayai
  rationale: Terjemahan ini mempertahankan bentuk verbal πιστεύω dan tindakan pribadi sang perwira, tanpa mengubahnya menjadi frasa nominal yang lebih interpretatif seperti “sesuai dengan imanmu”.
- source_word: γενηθήτω σοι
  choice: terjadilah bagimu
  rationale: Bentuk imperatif pasif γίνομαι dipakai secara yusif. “Terjadilah bagimu” mempertahankan daya kehendak/perintah ungkapan tersebut serta hubungannya dengan apa yang dipercayai sang perwira.
- source_word: παῖς
  choice: hamba
  rationale: παῖς dapat berarti hamba, anak laki-laki, atau anak. Dalam konteks ini, hubungan dengan bawahan perwira dan pemakaian δοῦλος dalam perikop mendukung “hamba”; kemungkinan makna lainnya dipertahankan dalam catatan kaki.
- source_word: ἰάθη
  choice: disembuhkan
  rationale: Bentuk pasif ἰάομαι menyatakan bahwa orang itu mengalami penyembuhan. “Disembuhkan” mempertahankan bentuk pasif dan merupakan ungkapan Indonesia yang lazim.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: Pada saat itu juga
  rationale: Ungkapan ini menyatakan waktu terjadinya penyembuhan dan dalam konteks menekankan kesegeraannya. “Pada saat itu juga” alami dalam bahasa Indonesia tanpa mengharuskan arti satu jam penuh.
theological_decisions:
- issue: Penerjemahan bahasa πιστεύω/πίστις
  choice: percayai
  alternative: imanmu; engkau percayakan
  rationale: Bentuk verbal “percayai” paling langsung mencerminkan ἐπίστευσας dan mempertahankan tindakan pribadi sang perwira. Terjemahan ini tidak mengubahnya menjadi konsep nominal “iman” ataupun mempersempitnya menjadi nuansa khusus “memercayakan diri”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Engkau” dipakai dalam kutipan langsung untuk mempertahankan bentuk tunggal dan register Alkitab yang tetap dapat dipahami pembaca umum. Susunan “Seperti yang engkau percayai, terjadilah bagimu” sengaja mempertahankan hubungan dan ketegangan ungkapan Yunani tanpa menjelaskannya secara berlebihan.
