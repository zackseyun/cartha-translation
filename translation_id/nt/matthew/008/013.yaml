review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Yunani. Namun, «Seperti yang engkau percayai» kurang tepat secara bentuk dan idiom: dalam bahasa Indonesia bentuk itu lazim dipahami sebagai klausa relatif kini dengan objek tersirat, sedangkan ὡς ἐπίστευσας merujuk pada tindakan percaya sang perwira. «Pada saat itu juga» juga sedikit mempertegas kesegeraan dibandingkan ἐν τῇ ὥρᾳ ἐκείνῃ, yang secara harfiah menyatakan waktu tersebut.'
  naturalness: Register dan pilihan «engkau» sesuai untuk bahasa Indonesia baku bernuansa Alkitab. «Terjadilah bagimu» dapat dipertahankan sebagai padanan yusif yang padat. Susunan yang direvisi membuat hubungan antara percaya dan penggenapan lebih alami.
  terminology: «Perwira» merupakan padanan yang wajar untuk ἑκατοντάρχης dalam konteks ini, dan «hamba» dapat dipertahankan untuk παῖς sambil mencatat kemungkinan makna usia muda. Catatan kaki perlu menghindari alternatif posesif «anak laki-lakinya», karena alternatif leksikal παῖς sendiri tidak menyatakan kepemilikan secara eksplisit.
  issues:
  - severity: medium
    issue: «Seperti yang engkau percayai» tidak menyampaikan ὡς ἐπίστευσας secara idiomatis.
    rationale: Frasa tersebut cenderung berarti “seperti hal yang engkau percayai,” bukan “sebagaimana engkau telah percaya.” Bentuk lampau/perfektif Yunani tidak perlu ditonjolkan secara berlebihan, tetapi tindakan percaya pribadi perlu tetap jelas.
  - severity: low
    issue: «Pada saat itu juga» menambahkan penekanan kesegeraan.
    rationale: ἐν τῇ ὥρᾳ ἐκείνῃ secara langsung berarti “pada waktu/jam itu.” Konteks mendukung kedekatan waktunya, tetapi teks Indonesia sebaiknya tidak memperkuatnya dengan «juga».
  - severity: low
    issue: Alternatif catatan kaki «anak laki-lakinya» menambahkan posesif ke alternatif leksikal.
    rationale: Catatan lebih akurat bila menyebut «seorang anak laki-laki» atau «seorang anak», sambil menjelaskan bahwa dalam konteks ini «hamba» paling sesuai.
  revised_text: Lalu Yesus berkata kepada perwira itu, “Pergilah. Sebagaimana engkau telah percaya, terjadilah bagimu.” Pada saat itu hambanya disembuhkan.
  revised_footnotes:
  - marker: a
    text: Atau “seorang anak laki-laki” atau “seorang anak”; kata Yunani παῖς dapat menunjuk kepada seorang hamba atau orang muda. Dalam konteks ini, “hamba” paling sesuai karena orang tersebut adalah bawahan sang perwira.
    reason: lexical_alternative
