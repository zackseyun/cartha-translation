  text: And he says to him[a], “I will come and heal him.”
translation:
  language: id
  text: Dan Yesus berkata kepadanya[a], “Aku akan datang dan menyembuhkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah Aku akan datang dan menyembuhkannya?” Sebagian penafsir, berdasarkan konteks, memahami perkataan Yesus sebagai pertanyaan, tetapi susunan bahasa Yunaninya sendiri lebih alami dibaca sebagai pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, καὶ di sini secara wajar diterjemahkan “Lalu”; pilihan ini menjaga kesinambungan kisah tanpa menambahkan hubungan sebab-akibat.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani menghidupkan narasi, tetapi dalam narasi Indonesia bentuk takbertanda “berkata” lebih alami dan tidak menghilangkan isi atau urutan tindakan.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus sebagai objek tak langsung λέγει secara langsung dan alami diterjemahkan “kepadanya”.
- source_word: Ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit memberi sedikit penekanan pada pembicara; “Aku” mempertahankan penyebutan itu tanpa menambahkan penegasan berlebihan seperti “Aku sendiri”.
- source_word: ἐλθὼν
  choice: akan datang dan
  rationale: Partisip aoris bersama verba utama berwaktu mendatang menyatakan tindakan yang mendahului atau menyertai tindakan utama. Susunan “akan datang dan” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: θεραπεύσω
  choice: menyembuhkan
  rationale: Dalam konteks orang sakit, θεραπεύω paling tepat berarti memulihkan kesehatan, yaitu “menyembuhkan”.
- source_word: αὐτόν
  choice: -nya
  rationale: Pronomina maskulin akusatif merujuk kepada hamba yang sakit; enklitik “-nya” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Apakah perkataan Yesus diterjemahkan sebagai pernyataan atau pertanyaan
  choice: 'Pernyataan: “Aku akan datang dan menyembuhkannya.”'
  alternative: 'Pertanyaan: “Haruskah Aku datang dan menyembuhkannya?” atau “Apakah Aku akan datang dan menyembuhkannya?”'
  rationale: Teks Yunani tidak memakai partikel interogatif dan secara sintaksis paling alami dibaca sebagai pernyataan. Pembacaan sebagai pertanyaan dimungkinkan oleh pertimbangan konteks, sehingga dicatat dalam catatan kaki tanpa menggantikan pembacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama “Yesus” dinyatakan untuk menjernihkan subjek yang tersirat dalam verba Yunani sesuai konteks dekat. Sapaan ilahi memakai “Aku” dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia; tanda baca mempertahankan catatan alternatif tanpa mengaburkan pembacaan utama.
