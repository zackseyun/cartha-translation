  source_fidelity: Terjemahan dengan tepat menyampaikan tindakan pendahuluan ἐκτείνας τὴν χεῖρα, sentuhan (ἥψατο αὐτοῦ), kehendak Yesus (Θέλω), perintah pentahiran (καθαρίσθητι), dan hasil yang segera (εὐθέως). Peralihan subjek hasil dari ‘kustanya’ dalam bahasa Yunani kepada orang yang menjadi tahir merupakan penyesuaian sintaksis Indonesia yang sah dan tidak mengubah makna.
  naturalness: Susunan kalimat pada dasarnya alami dan registernya sesuai. Namun, ‘penyakit kustanya’ agak berlebih, karena ‘kusta’ sendiri sudah menunjuk penyakit. ‘Ia menjadi tahir dari kustanya’ lebih ringkas, alami, dan tetap mempertahankan bahasa pentahiran.
  terminology: ‘Tahir’ tepat untuk mempertahankan medan makna καθαρίζω, termasuk nuansa kenajisan/pentahiran, dan konsisten antara perintah serta hasil. ‘Kusta’ dapat dipertahankan dalam teks utama, dengan catatan yang tidak menyamakan λέπρα secara langsung dengan penyakit Hansen modern.
