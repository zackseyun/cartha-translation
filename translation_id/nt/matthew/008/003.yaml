    rationale: Istilah Yunani λέπρα tidak selalu dapat dipetakan secara pasti kepada kategori klinis modern atau tingkat keparahan tertentu. Catatan yang menyebut ‘berbagai kondisi kulit’ lebih berhati-hati dan tetap informatif.
