  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: id
  text: Lalu Yesus mengulurkan tangan-Nya, menyentuh orang itu, dan berkata, “Aku mau, jadilah tahir!” Seketika itu juga ia menjadi tahir dari kustanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “kusta” dapat mencakup berbagai kondisi kulit, bukan hanya penyakit Hansen yang dalam pengertian modern disebut kusta.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: mengulurkan tangan-Nya
  rationale: Ungkapan ini menyampaikan gerakan konkret yang mendahului sentuhan secara alami dalam bahasa Indonesia.
- source_word: ἥψατο αὐτοῦ
  choice: menyentuh orang itu
  rationale: Kata kerja ἅπτομαι dengan objek genitif di sini paling wajar berarti menyentuh; penyebutan 'orang itu' menghindari ketaksaan pronomina.
- source_word: Θέλω
  choice: Aku mau
  rationale: Jawaban ini menyatakan kehendak atau kesediaan Yesus sebagai tanggapan langsung terhadap permohonan orang itu. 'Aku mau' ringkas, alami, dan mempertahankan daya ujaran Yunani.
- source_word: καθαρίσθητι
  choice: Jadilah tahir
  rationale: Bentuk imperatif pasif ini mempertahankan bahasa pentahiran yang mencakup pemulihan jasmani sekaligus status kenajisan, bukan sekadar kesembuhan medis.
- source_word: εὐθέως
  choice: Seketika itu juga
  rationale: Ungkapan ini menegaskan bahwa hasilnya terjadi langsung tanpa jeda.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: orang itu menjadi tahir dari penyakit kustanya
  rationale: Bahasa Yunani secara harfiah menjadikan 'kustanya' sebagai subjek yang ditahirkan. Bahasa Indonesia lebih alami dengan orang itu sebagai subjek, sementara ungkapan 'menjadi tahir' tetap mempertahankan hubungan leksikal dengan perintah sebelumnya.
- source_word: ἡ λέπρα
  choice: penyakit kustanya
  rationale: Istilah tradisional 'kusta' tetap mudah dikenali, sedangkan 'penyakit' memperjelas acuannya. Catatan kaki menerangkan bahwa cakupan istilah Yunani lebih luas daripada diagnosis modern tertentu.
theological_decisions:
- issue: Bahasa pentahiran dalam καθαρίζω
  choice: Memakai 'tahir' baik dalam perintah maupun dalam hasilnya
  alternative: Menerjemahkannya hanya dengan bahasa 'sembuh'
  rationale: Pengulangan akar kata Yunani menonjolkan pentahiran, yang dalam konteks ini memiliki dimensi jasmani dan kemurnian ritual. 'Sembuh' saja akan mempersempit maknanya.
- issue: Makna Θέλω dalam jawaban Yesus
  choice: Aku mau
  alternative: Aku bersedia
  rationale: '''Aku mau'' mempertahankan pernyataan kehendak yang lugas dan menjawab pertanyaan tersirat mengenai kesediaan Yesus, tanpa mengubahnya menjadi pernyataan tentang masa depan.'
- issue: Subjek gramatikal pada hasil mukjizat
  choice: Mengalihkan subjek menjadi orang itu demi kewajaran bahasa Indonesia
  alternative: Penyakit kustanya ditahirkan
  rationale: Alternatif tersebut lebih dekat dengan susunan Yunani, tetapi terdengar tidak alami karena penyakit biasanya tidak disebut 'ditahirkan' dalam bahasa Indonesia. Rumusan terpilih mempertahankan hasil pentahiran tanpa membuat kalimat janggal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata 'tahir' dipertahankan karena penting bagi makna jasmani sekaligus ritual dalam teks, sedangkan struktur kalimat disesuaikan agar alami bagi pembaca masa kini.
