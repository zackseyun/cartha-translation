  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: id
  text: dan berkata, “Tuhan, hambaku terbaring lumpuh di dalam rumah, sangat menderita.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “hamba” juga dapat berarti “anak laki-laki” atau “anak”; “sangat menderita” juga dapat diterjemahkan “sangat tersiksa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: dan berkata
  rationale: Partisipel λέγων dihubungkan dengan narasi sebelumnya; bentuk finit “dan berkata” lebih alami dalam bahasa Indonesia daripada “dan sambil berkata” tanpa mengubah alur.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini dapat menyatakan penghormatan ataupun pengakuan yang lebih tinggi. “Tuhan” mempertahankan keterbukaan makna tersebut.
- source_word: ὁ παῖς μου
  choice: hambaku
  rationale: παῖς dapat berarti hamba, anak laki-laki, atau anak. Dalam konteks seorang perwira, “hamba” paling sesuai, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: βέβληται
  choice: terbaring
  rationale: Bentuk perfek pasif ini secara idiomatis menggambarkan keadaan yang berlanjut; “terbaring” menyampaikan keadaan itu dengan wajar.
- source_word: ἐν τῇ οἰκίᾳ
  choice: di rumah
  rationale: Padanan lokatif yang alami dan langsung dalam bahasa Indonesia.
- source_word: παραλυτικός
  choice: lumpuh
  rationale: Padanan adjektival modern dan jelas bagi keadaan yang dinyatakan oleh παραλυτικός.
- source_word: δεινῶς βασανιζόμενος
  choice: sangat menderita
  rationale: Ungkapan ini menyatakan penderitaan atau siksaan yang hebat. “Sangat menderita” alami dan tidak menentukan secara berlebihan jenis penderitaannya.
theological_decisions:
- issue: Daya sapaan Κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan kemungkinan bahwa sapaan itu lebih dari sekadar kesopanan, tetapi konteksnya tetap tidak dipaksa menjadi pengakuan teologis yang lengkap.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “terbaring lumpuh di rumah” dipilih agar alami; satu catatan kaki mempertahankan ambiguitas παῖς dan nuansa kuat βασανιζόμενος.
