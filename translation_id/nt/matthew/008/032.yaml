revisions:
- from: Lalu Ia berkata kepada mereka, “Pergilah!” Mereka pun keluar dan masuk ke dalam babi-babi itu. Lihatlah, seluruh kawanan itu berlari kencang menuruni lereng terjal[a] menuju laut, lalu mati di dalam air.[b]
  to: Lalu Ia berkata kepada mereka, “Pergilah!” Mereka pun keluar dan masuk ke dalam babi-babi itu. Lihatlah, seluruh kawanan itu berlari kencang menuruni lereng terjal[a] ke dalam laut, lalu mati di dalam air.[b]
  rationale: Perubahan utama mengganti “menuju laut” dengan “ke dalam laut” untuk menerjemahkan εἰς secara utuh. Catatan kaki a dibatasi pada rentang makna yang lebih tepat bagi κρημνός. Catatan kaki b tetap membedakan inferensi bahwa kawanan itu tenggelam dari ungkapan eksplisit Yunani bahwa mereka mati di dalam air.
