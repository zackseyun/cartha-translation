id: MAT.8.32
reference: Matthew 8:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Pergilah!” Mereka pun keluar dan masuk ke dalam babi-babi itu. Lihatlah, seluruh kawanan itu berlari kencang menuruni lereng terjal[a] ke dalam laut, lalu mati di dalam air.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menuruni tebing.” Kata Yunani ini dapat menunjuk lereng curam atau tebing.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tenggelam hingga mati di dalam air.” Secara lebih harfiah, teks Yunani berbunyi “mati di dalam air.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Pergilah!
  rationale: Imperatif singkat ini mempertahankan ketegasan perintah Yesus dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐξελθόντες
  choice: keluar
  rationale: Partisip ini menyatakan bahwa roh-roh itu keluar, dengan acuannya dipertahankan dari konteks, tanpa menambahkan objek yang tidak disebutkan dalam ayat.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: masuk ke dalam babi-babi itu
  rationale: Ungkapan ini secara langsung menggambarkan perpindahan roh-roh tersebut ke dalam babi-babi.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian pembaca kepada kejadian dramatis berikutnya dan tidak diredam menjadi sekadar penanda urutan.
- source_word: πᾶσα ἡ ἀγέλη
  choice: seluruh kawanan itu
  rationale: Pilihan ini secara alami menyampaikan cakupan πᾶσα dan sifat kolektif ἀγέλη.
- source_word: ὥρμησεν
  choice: berlari kencang
  rationale: Frasa ini menyampaikan gerakan mendadak dan kuat tanpa menambahkan gagasan bahwa kawanan itu sengaja menyerang atau melemparkan diri.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: menuruni lereng terjal
  rationale: κρημνός dapat menunjuk lereng curam, tebing, atau jurang; pilihan utama ini jelas dan tidak mempersempit maknanya menjadi tebing tegak.
- source_word: τὴν θάλασσαν
  choice: laut
  rationale: Terjemahan ini mengikuti kata Yunani θάλασσα secara langsung, tanpa menggantinya dengan penjelasan geografis 'danau'.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: mati di dalam air
  rationale: Ini mempertahankan pernyataan eksplisit bahwa kawanan itu mati di air; 'tenggelam' merupakan kesimpulan yang sangat mungkin, tetapi lebih spesifik daripada verba Yunani.
theological_decisions:
- issue: Tingkat kekhususan dalam menggambarkan kematian kawanan babi
  choice: mati di dalam air
  alternative: tenggelam di dalam air
  rationale: Konteks sangat menyiratkan bahwa kawanan itu tenggelam, tetapi teks Yunani hanya menyatakan bahwa mereka mati di dalam air. Terjemahan utama mempertahankan ungkapan sumber tanpa menambahkan cara kematian secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “Ia” dipakai bagi Yesus sesuai gaya prosa religius Indonesia yang umum, sedangkan “mereka pun” menjaga kesinambungan tindakan. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
