id: MAT.8.33
reference: Matthew 8:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: id
  text: Para penjaga kawanan itu pun melarikan diri. Setelah pergi ke kota, mereka melaporkan segala sesuatu, termasuk apa yang terjadi pada orang-orang yang kerasukan roh jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “dan hal-hal mengenai orang-orang yang kerasukan roh jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Para penjaga kawanan itu pun
  rationale: Partisipel βόσκοντες menunjuk kepada orang-orang yang memberi makan atau menjaga kawanan babi. “Para penjaga kawanan” alami dalam bahasa Indonesia dan tidak perlu mengulang kata “babi” yang sudah jelas dari konteks; δέ ditampilkan dengan “pun” sebagai penghubung perkembangan kisah.
- source_word: ἔφυγον
  choice: melarikan diri
  rationale: Bentuk aoristis φεύγω menyatakan tindakan lari meninggalkan tempat karena takut atau bahaya; “melarikan diri” merupakan padanan langsung dan wajar.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: Setelah pergi ke kota
  rationale: Partisipel aoristis paling alami dinyatakan sebagai tindakan yang mendahului pelaporan. “Ke kota” mempertahankan arah yang dinyatakan oleh εἰς.
- source_word: ἀπήγγειλαν πάντα
  choice: mereka melaporkan segala sesuatu
  rationale: ἀπαγγέλλω berarti menyampaikan atau melaporkan kabar, sedangkan πάντα menegaskan keseluruhan laporan.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: termasuk apa yang terjadi pada orang-orang yang kerasukan roh jahat
  rationale: Ungkapan eliptis ini secara harfiah berarti “dan hal-hal mengenai orang-orang yang dirasuki roh jahat.” Dalam konteks, “termasuk apa yang terjadi pada” menyampaikan maksudnya dengan jelas, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: δαιμονιζομένων
  choice: orang-orang yang kerasukan roh jahat
  rationale: Istilah ini menggambarkan orang yang berada di bawah kuasa roh jahat. Ungkapan Indonesia ini jelas bagi pembaca umum dan menghindari penyamaan setiap δαιμόνιον secara langsung dengan Iblis sebagai tokoh tunggal.
theological_decisions:
- issue: Cara menerjemahkan δαιμονιζομένων tanpa menambahkan rincian doktrinal yang tidak dinyatakan teks
  choice: orang-orang yang kerasukan roh jahat
  alternative: orang-orang yang dikuasai roh jahat
  rationale: “Kerasukan roh jahat” mempertahankan kenyataan penderitaan yang bersifat demonis dalam narasi, tetapi tidak menetapkan teori lebih terperinci mengenai sifat atau tingkat penguasaan tersebut.
- issue: Hubungan καὶ τὰ τῶν δαιμονιζομένων dengan πάντα
  choice: termasuk apa yang terjadi pada orang-orang yang kerasukan roh jahat
  alternative: dan hal-hal mengenai orang-orang yang kerasukan roh jahat
  rationale: καί di sini secara wajar dapat memperkenalkan bagian khusus dari “segala sesuatu.” Terjemahan utama membuat hubungan itu alami dalam bahasa Indonesia, sedangkan alternatif yang lebih harfiah dicatat agar kelonggaran ungkapan Yunani tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah “penjaga kawanan” mudah dipahami dalam konteks, sedangkan “kerasukan roh jahat” merupakan ungkapan umum tanpa nada teknis atau arkais.
