  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: id
  text: Ketika Yesus turun dari gunung itu, orang banyak dalam jumlah besar mengikuti-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “banyak kerumunan mengikuti-Nya.” Susunan ini lebih dekat dengan bentuk jamak dalam bahasa Yunani, tetapi kurang alami dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Ketika Yesus turun
  rationale: Konstruksi genitivus absolutus dengan partisip aoris paling alami diterjemahkan sebagai anak kalimat waktu. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: ἀπὸ τοῦ ὄρους
  choice: dari gunung itu
  rationale: ὄρος dapat berarti gunung atau bukit. “Gunung itu” mempertahankan acuan tertentu kepada lokasi dalam konteks sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti-Nya
  rationale: ἀκολουθέω dengan pelengkap datif menyatakan tindakan mengikuti seseorang. Bentuk ini ringkas, alami, dan mempertahankan verba naratif sumber.
- source_word: ὄχλοι πολλοί
  choice: orang banyak berbondong-bondong
  rationale: Frasa ini secara harfiah berarti “banyak kumpulan orang.” Ungkapan “orang banyak berbondong-bondong” secara alami menyampaikan besarnya jumlah orang, meski tidak menampilkan bentuk jamak ὄχλοι secara formal.
