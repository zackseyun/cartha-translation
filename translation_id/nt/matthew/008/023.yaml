  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: id
  text: Lalu ketika Yesus naik ke perahu[a][b], murid-muridnya mengikuti dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah perahu”. Kata benda Yunani di sini tidak memakai artikel.
    reason: lexical_alternative
  - marker: b
    text: Atau “setelah Yesus naik ke perahu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: ketika Yesus naik
  rationale: Partisip aoris ini paling wajar dialihkan menjadi anak kalimat waktu dalam bahasa Indonesia. Kata “naik” lazim dipakai untuk gerakan masuk ke perahu, sedangkan “ketika” mempertahankan keluwesan hubungan waktunya tanpa memaksakan urutan yang terlalu tegas.
- source_word: πλοῖον
  choice: perahu
  rationale: Dalam latar Danau Galilea, “perahu” lebih alami dan tepat daripada “kapal”. Kata benda Yunani ini tidak memakai artikel; bahasa Indonesia memungkinkan pembacaan tertentu maupun tak tentu, sementara “ke perahu” wajar dalam kesinambungan narasi.
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: Pilihan ini menyampaikan tindakan fisik para murid sekaligus mempertahankan kemungkinan gema kemuridan yang sering melekat pada ἀκολουθέω dalam Injil Matius.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: “Murid-murid” adalah padanan baku dan alami bagi para pengikut yang belajar dari Yesus, tanpa mempersempit artinya menjadi sekadar pelajar formal.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: Yesus ... dia ... -nya
  rationale: Semua pronomina merujuk kepada Yesus dalam konteks. Nama “Yesus” dipakai pada penyebutan pertama demi kejelasan bahasa Indonesia, lalu “dia” dan akhiran “-nya” mempertahankan rujukan berikutnya. Huruf kecil mengikuti ejaan pronomina Indonesia yang netral dan tidak menambahkan penandaan teologis yang tidak terdapat dalam bahasa sumber.
theological_decisions:
- issue: Kemungkinan nuansa kemuridan dalam ἀκολουθέω
  choice: mengikuti
  alternative: pergi bersama dia; menjadi pengikutnya
  rationale: Ayat ini terutama menceritakan gerakan fisik, tetapi pemakaian kata tersebut dalam Matius dapat sekaligus membangkitkan gagasan kemuridan. “Mengikuti” mempertahankan kedua lapisan itu tanpa menjelaskan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan “Lalu, ketika ...” mempertahankan penghubung naratif Καί sekaligus mengalihkan partisip Yunani secara alami. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kecil agar terjemahan tidak memasukkan kebiasaan penghormatan ortografis yang tidak ditandai oleh teks Yunani.
