id: MAT.8.34
reference: Matthew 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: id
  text: Dan lihatlah, seluruh penduduk kota itu keluar untuk menemui Yesus. Ketika mereka melihat Dia, mereka memohon agar Dia pergi dari wilayah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daerah mereka”; secara lebih harfiah, “batas-batas mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menarik perhatian dan menghidupkan narasi, dengan bentuk yang tetap wajar dalam bahasa Indonesia.
- source_word: πᾶσα ἡ πόλις
  choice: seluruh penduduk kota itu
  rationale: Ungkapan Yunani menyebut kota secara metonimis untuk penduduknya. Pilihan ini menyampaikan maknanya secara alami tanpa menyiratkan bahwa bangunan atau tempat kotanya bergerak.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Menyatakan gerakan keluar dari kota secara langsung dan ringkas.
- source_word: εἰς ὑπάντησιν
  choice: untuk menemui
  rationale: Menyampaikan idiom tujuan dalam bahasa Yunani secara alami dan tepat.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Mengikuti bentuk baku nama tersebut dalam bahasa Indonesia.
- source_word: ἰδόντες αὐτὸν
  choice: Ketika melihat Dia
  rationale: Partisip aoris dipahami secara temporal, menyampaikan urutan narasi tanpa membuat hubungan sebab-akibat yang tidak dinyatakan.
- source_word: παρεκάλεσαν
  choice: memohon
  rationale: Menunjukkan permintaan yang sungguh-sungguh; lebih kuat daripada sekadar 'meminta' tanpa harus menambahkan nada atau motif yang tidak disebutkan.
- source_word: ὅπως μεταβῇ
  choice: agar Dia pergi
  rationale: Mengungkapkan isi permohonan dengan konstruksi tujuan/isi yang alami dalam bahasa Indonesia.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: dari wilayah mereka
  rationale: ὅρια secara harfiah berkaitan dengan batas-batas, tetapi di sini menunjuk pada kawasan atau daerah yang dibatasi itu. 'Wilayah' mempertahankan arti geografis secara alami.
theological_decisions:
- issue: Alasan penduduk kota meminta Yesus pergi
  choice: Teks hanya menyatakan bahwa mereka memohon agar Yesus pergi dari wilayah mereka.
  alternative: Menjelaskan bahwa mereka bertindak karena takut akan kuasa Yesus, marah akibat hilangnya kawanan babi, atau merasa gentar karena peristiwa tersebut.
  rationale: Teks Yunani tidak menyatakan motif mereka. Terjemahan mempertahankan ketegangan naratif dan tidak memasukkan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lihatlah' mempertahankan penanda perhatian dalam narasi; 'memohon' menyampaikan kesungguhan tanpa terdengar terlalu arkais. Huruf kapital pada 'Dia' mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
