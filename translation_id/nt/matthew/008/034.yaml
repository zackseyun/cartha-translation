review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan penduduk kota yang keluar menemui Yesus, lalu memohon dengan sungguh-sungguh agar Ia meninggalkan wilayah mereka. Namun, penghubung naratif καί pada awal ayat belum tercermin. Dalam terjemahan optimal-ekuivalen, “Dan” dapat dipertahankan secara alami bersama penanda ἰδού.
  naturalness: “Seluruh penduduk kota itu” dan “memohon agar Dia pergi dari wilayah mereka” merupakan bahasa Indonesia baku dan jelas. Menambahkan “mereka” pada klausa temporal membuat subjek partisip jamak ἰδόντες lebih eksplisit dan lancar tanpa mengubah makna.
  terminology: Nama “Yesus” tepat. “Wilayah” merupakan padanan kontekstual yang baik untuk ὅρια; catatan kaki dengan tepat mempertahankan alternatif “daerah” dan arti harfiah “batas-batas.” Kapitalisasi “Dia” adalah konvensi penerbitan yang dapat diterima.
  issues:
  - severity: low
    issue: Penghubung awal καί tidak diterjemahkan.
    rationale: Teks Yunani dimulai καὶ ἰδού. Walaupun καί kadang dapat tidak diterjemahkan secara idiomatis, “Dan lihatlah” wajar dalam register naratif Alkitab dan lebih baik mempertahankan penghubung serta penanda perhatian tersebut.
  - severity: low
    issue: Subjek dalam klausa “Ketika melihat Dia” tersirat.
    rationale: Subjeknya dapat dipahami dari klausa sebelumnya, tetapi “Ketika mereka melihat Dia” lebih jelas mencerminkan partisip jamak ἰδόντες dan lebih lancar dalam bahasa Indonesia modern.
