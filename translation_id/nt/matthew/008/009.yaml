  to: Sebab aku sendiri juga seorang yang berada di bawah wewenang dan mempunyai prajurit di bawah perintahku. Aku berkata kepada yang satu, ‘Pergilah!’ dan ia pergi; kepada yang lain, ‘Datanglah!’ dan ia datang; dan kepada hambaku[a], ‘Lakukan ini!’ dan ia melakukannya.
