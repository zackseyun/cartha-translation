id: MAT.8.9
reference: Matthew 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: id
  text: Sebab aku sendiri juga seorang yang berada di bawah wewenang dan mempunyai prajurit di bawah perintahku. Aku berkata kepada yang satu, ‘Pergilah!’ dan ia pergi; kepada yang lain, ‘Datanglah!’ dan ia datang; dan kepada hambaku[a], ‘Lakukan ini!’ dan ia melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak”.
    reason: Alternatif leksikal bagi kata Yunani δοῦλος, yang dapat menunjuk kepada hamba atau budak menurut konteks.
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: Sebab aku sendiri juga
  rationale: γάρ memperkenalkan alasan bagi keyakinan perwira itu, sedangkan καί dan pronomina ἐγώ memberi nuansa bahwa ia sendiri pun berada dalam suatu tata kewenangan.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: seorang yang berada di bawah wewenang
  rationale: Ungkapan ini mempertahankan gagasan bahwa perwira tersebut tunduk pada kewenangan di atasnya tanpa menambahkan siapa pemegang kewenangan itu.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: mempunyai prajurit-prajurit di bawah perintahku
  rationale: Frasa ini menyatakan kedudukan para prajurit di bawah kewenangan operasional perwira; ‘di bawah perintahku’ alami dalam konteks militer Indonesia.
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: Aku berkata kepada yang satu ... kepada yang lain
  rationale: Susunan ini mempertahankan pola distributif antara τούτῳ dan ἄλλῳ dengan bahasa Indonesia yang wajar.
- source_word: Πορεύθητι ... Ἔρχου ... Ποίησον τοῦτο
  choice: Pergilah! ... Datanglah! ... Lakukan ini!
  rationale: Bentuk-bentuk imperatif diterjemahkan sebagai perintah langsung dan ringkas, sesuai dengan ilustrasi tentang kewenangan serta ketaatan segera.
- source_word: δοῦλος
  choice: hamba
  rationale: ‘Hamba’ mempertahankan hubungan ketundukan pribadi dan rumah tangga yang lebih kuat daripada ‘pelayan’, sementara kemungkinan makna ‘budak’ dicantumkan dalam catatan.
theological_decisions:
- issue: Makna sosial δοῦλος dalam contoh perwira
  choice: hamba
  alternative: budak
  rationale: Pokok ayat ini ialah kewenangan dan ketaatan, bukan penjelasan status hukum orang tersebut. ‘Hamba’ mempertahankan ketundukan tanpa menetapkan secara berlebihan jenis perhambaannya; ‘budak’ tetap diakui sebagai kemungkinan leksikal dalam catatan.
- issue: Hubungan perwira dengan kewenangan
  choice: berada di bawah wewenang
  alternative: tunduk kepada wewenang seseorang
  rationale: Teks Yunani tidak menyebut secara eksplisit orang yang berwenang atas perwira itu. Terjemahan dipertahankan terbuka agar analogi mengenai kewenangan yang diterima dan dijalankan tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk ‘aku’ dipertahankan karena merupakan ujaran langsung seorang perwira kepada Yesus. Pengulangan pola perintah dan tindakan dijaga untuk menampilkan rantai kewenangan serta ketaatan yang menjadi inti pernyataan.
