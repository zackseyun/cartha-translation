  to: Lalu Yesus berkata kepadanya, “Jangan sampai engkau memberi tahu siapa pun. Namun, pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah pemberian yang diperintahkan Musa[a] sebagai kesaksian kepada mereka.”[b]
