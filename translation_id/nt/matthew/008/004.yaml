source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Jangan sampai engkau memberi tahu siapa pun. Namun, pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah pemberian yang diperintahkan Musa[a] sebagai kesaksian kepada mereka.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perintah ini mengacu pada tata cara yang ditetapkan Musa bagi orang yang telah ditahirkan dari penyakit kulit; lihat Imamat 14.
    reason: cross_reference
  - marker: b
    text: Atau, “untuk menjadi kesaksian bagi mereka.” Kesaksian itu mungkin merupakan bukti yang ditunjukkan kepada para imam; sebagian orang memahaminya sebagai kesaksian yang memberatkan mereka yang tidak mau percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Ingatlah, jangan beri tahu siapa pun
  rationale: Ὅρα berfungsi idiomatis sebagai peringatan atau penegasan, sedangkan μηδενὶ εἴπῃς menyatakan larangan. Ungkapan ini mempertahankan daya perintahnya dalam bahasa Indonesia yang wajar tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Padanan imperatif gerak yang langsung dan alami.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: perlihatkanlah dirimu kepada imam
  rationale: Mempertahankan konstruksi refleksif dan kaitannya dengan pemeriksaan oleh imam. Bahasa Indonesia tidak memerlukan kata sandang untuk menunjukkan imam yang berwenang dalam prosedur tersebut.
- source_word: προσένεγκον τὸ δῶρον
  choice: persembahkanlah pemberian
  rationale: Kata kerja προσφέρω dalam konteks ibadah bermakna mempersembahkan, sedangkan δῶρον secara langsung berarti pemberian dan di sini menunjuk pada pemberian ritual yang diwajibkan.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: yang diperintahkan Musa
  rationale: Menyampaikan makna perintah atau ketetapan Musa tanpa memperluasnya.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  rationale: Mempertahankan kemungkinan makna tujuan atau hasil serta tidak menentukan siapa yang dimaksud dengan αὐτοῖς.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Lalu Yesus berkata kepadanya
  rationale: Kala kini historis diterjemahkan dengan bentuk lampau naratif yang alami; 'lalu' menghubungkan ucapan ini dengan tindakan sebelumnya.
theological_decisions:
- issue: Acuan dan daya ungkapan εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  alternative: sebagai bukti bagi para imam; sebagai kesaksian yang memberatkan mereka
  rationale: Teks Yunani tidak menyebutkan secara tegas siapa 'mereka' dan tidak memastikan apakah kesaksian itu bersifat positif atau memberatkan. Terjemahan mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan akhiran -lah mempertahankan nada perintah tanpa terdengar kasar. Ambiguitas mengenai pihak yang dimaksud oleh 'mereka' sengaja dipertahankan.
