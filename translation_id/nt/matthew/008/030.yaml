  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: id
  text: Jauh dari mereka[a] ada kawanan besar babi yang sedang makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "agak jauh dari mereka."'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ada
  rationale: Bentuk ἦν menyatakan keberadaan, yang secara alami diterjemahkan dengan “ada”. Partikel δέ merupakan penghubung naratif ringan dan tidak perlu diberi padanan tersendiri dalam kalimat Indonesia ini.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: agak jauh dari mereka
  rationale: Ungkapan ini menyatakan jarak ruang. “Agak jauh dari mereka” alami dalam bahasa Indonesia dan mempertahankan kemungkinan nuansa jarak tanpa memaksakan ukuran tertentu.
- source_word: ἀγέλη
  choice: sekawanan
  rationale: Kata ini menunjuk pada sekelompok hewan; “sekawanan” merupakan padanan Indonesia yang wajar untuk kelompok babi.
- source_word: χοίρων
  choice: babi
  rationale: “Babi” adalah padanan modern dan langsung bagi χοῖρος.
- source_word: πολλῶν
  choice: besar
  rationale: Secara harfiah berarti “banyak”, tetapi ketika menerangkan kawanan, bahasa Indonesia secara alami memakai “sekawanan besar” untuk menyatakan banyaknya hewan.
- source_word: βοσκομένη
  choice: sedang mencari makan
  rationale: Partisip ini menggambarkan kawanan yang tengah makan atau merumput. “Mencari makan” sesuai bagi babi dan tidak menambahkan gagasan bahwa mereka sedang digembalakan.
