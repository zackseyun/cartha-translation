id: MAT.8.2
reference: Matthew 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: id
  text: Dan lihatlah, seorang yang menderita kusta datang lalu sujud di hadapan-Nya[a] dan berkata, “Tuhan, jika Engkau bersedia, Engkau sanggup mentahirkan aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Nya”; kata kerja Yunani ini dapat berarti bersujud dengan hormat, memberi penghormatan, atau menyembah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi partikel yang mengarahkan perhatian dan menghidupkan adegan, dengan bentuk yang tetap wajar dalam narasi Indonesia yang khidmat.
- source_word: λεπρὸς
  choice: seorang yang menderita kusta
  rationale: Menyatakan orang yang terkena penyakit kulit yang secara tradisional disebut kusta, tanpa mereduksi orang tersebut menjadi penyakitnya.
- source_word: προσελθὼν
  choice: datang
  rationale: Partisip ini menunjukkan gerak mendekati Yesus; 'datang' ringkas dan alami dalam urutan narasi.
- source_word: προσεκύνει
  choice: sujud di hadapan-Nya
  rationale: Menampilkan tindakan merendahkan diri secara jasmani dan penuh hormat tanpa memutuskan secara berlebihan apakah dalam konteks ini tindakan itu harus dipahami khusus sebagai penyembahan.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat dan kewibawaan serta kemungkinan bobot kristologis yang terkandung dalam sapaan kepada Yesus.
- source_word: ἐὰν θέλῃς
  choice: jika Engkau bersedia
  rationale: Mengungkapkan syarat yang berkaitan dengan kehendak Yesus dalam bahasa Indonesia modern dan hormat.
- source_word: δύνασαί
  choice: Engkau sanggup
  rationale: Menyatakan kemampuan atau kuasa dengan lebih tegas daripada sekadar bentuk percakapan 'bisa'.
- source_word: καθαρίσαι
  choice: menahirkan aku
  rationale: '''Menahirkan'' mempertahankan dimensi jasmani sekaligus ritual dari καθαρίζω dalam konteks penyakit kusta, bukan hanya gagasan penyembuhan umum.'
theological_decisions:
- issue: Makna προσκυνέω yang diarahkan kepada Yesus
  choice: sujud di hadapan-Nya
  alternative: menyembah-Nya
  rationale: Kata Yunani ini dapat merujuk pada tindakan bersujud sebagai penghormatan, pemberian sembah, atau penyembahan. Terjemahan utama mempertahankan tindakan yang tampak dan membiarkan bobot teologisnya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. 'Menahirkan' dipilih untuk mempertahankan gema jasmani dan ritual, meskipun lebih berciri ragam Alkitab daripada bahasa percakapan.
