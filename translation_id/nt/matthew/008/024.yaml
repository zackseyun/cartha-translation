id: MAT.8.24
reference: Matthew 8:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: id
  text: Lihatlah, badai besar[a] timbul di laut, sehingga ombak terus menutupi perahu itu[b]. Namun, dia sedang tidur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang digunakan secara harfiah menunjuk pada “guncangan hebat” dan sering berarti “gempa bumi”; dalam konteks ini, kata itu mengacu pada badai dahsyat di laut.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perahu itu sedang diliputi ombak.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian dan membuat adegan terasa mendadak serta hidup.
- source_word: σεισμὸς μέγας
  choice: badai besar
  rationale: σεισμός pada dasarnya menunjuk pada guncangan hebat dan sering berarti gempa bumi, tetapi konteks laut, perahu, dan ombak menunjukkan pergolakan berupa badai dahsyat.
- source_word: ἐγένετο
  choice: timbul
  rationale: Ungkapan alami dalam bahasa Indonesia untuk menyatakan mulainya badai.
- source_word: ἐν τῇ θαλάσσῃ
  choice: di laut
  rationale: Mempertahankan istilah sumber θάλασσα dan menyatakan tempat terjadinya pergolakan.
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai hasil dari dahsyatnya badai.
- source_word: τὸ πλοῖον
  choice: perahu itu
  rationale: Dalam latar pelayanan di Danau Galilea, 'perahu' lebih alami daripada 'kapal' dan tetap sesuai dengan cakupan makna πλοῖον.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: ombak terus menutupi perahu itu
  rationale: Susunan aktif lebih alami dalam bahasa Indonesia, sedangkan 'terus' menyampaikan tindakan yang sedang berlangsung dari infinitif kini pasif καλύπτεσθαι.
- source_word: αὐτὸς δὲ
  choice: Namun, dia
  rationale: Menyampaikan kontras antara pergolakan di sekitar perahu dan keadaan Yesus tanpa menambahkan penekanan berlebihan.
- source_word: ἐκάθευδεν
  choice: sedang tidur
  rationale: Menjaga aspek berlangsung dari bentuk imperfek.
theological_decisions:
- issue: Sifat peristiwa yang disebut σεισμός
  choice: Diterjemahkan secara kontekstual sebagai 'badai'.
  alternative: Diterjemahkan lebih harfiah sebagai 'gempa bumi' atau 'guncangan'.
  rationale: Ini merupakan keputusan leksikal-kontekstual, bukan penetapan doktrinal. Gambaran laut, perahu, dan ombak menunjukkan pergolakan hebat di perairan; 'gempa bumi' dapat menimbulkan gambaran yang menyesatkan dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Lihatlah' dipertahankan sebagai penanda perhatian yang bernada luhur, sedangkan susunan aktif 'ombak terus menutupi' menghindari bentuk pasif yang kaku.
