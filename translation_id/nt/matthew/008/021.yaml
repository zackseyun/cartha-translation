  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: id
  text: Lalu seorang murid yang lain berkata kepada-Nya, “Tuhan, izinkanlah aku pergi lebih dahulu untuk menguburkan ayahku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Permintaan ini dapat berarti bahwa ayahnya perlu segera dikuburkan, atau, secara lebih luas, bahwa ia hendak menunaikan kewajiban sebagai anak sampai ayahnya meninggal. Teks Yunani tidak menjelaskannya.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: Lalu seorang lain dari antara murid-murid
  rationale: ἕτερος menunjuk kepada orang tambahan yang berbeda dari pembicara sebelumnya; konstruksi genitif menyatakan bahwa ia termasuk kelompok murid. δέ berfungsi sebagai penghubung naratif ringan, sehingga 'Lalu' wajar dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: '''Tuhan'' merupakan padanan baku κύριος dalam sapaan kepada Yesus serta mempertahankan baik nuansa penghormatan maupun kemungkinan bobot teologisnya.'
- source_word: ἐπίτρεψόν μοι
  choice: izinkanlah aku
  rationale: Ungkapan ini merupakan permohonan izin. 'Izinkanlah aku' alami, santun, dan sesuai dengan nada hormat sapaan tersebut.
- source_word: πρῶτον ἀπελθεῖν
  choice: pergi lebih dahulu
  rationale: πρῶτον menyatakan prioritas urutan, sedangkan ἀπελθεῖν berarti pergi dari tempat itu. Susunan ini alami dalam bahasa Indonesia tanpa kehilangan maknanya.
- source_word: θάψαι τὸν πατέρα μου
  choice: menguburkan ayahku
  rationale: Terjemahan langsung dan idiomatis dari tindakan serta objeknya.
theological_decisions:
- issue: Maksud permohonan untuk menguburkan ayah
  choice: Menerjemahkan permohonan secara langsung tanpa menentukan apakah sang ayah baru saja meninggal atau belum.
  alternative: Menafsirkan bahwa pemakaman harus segera dilakukan, atau bahwa orang itu hendak tinggal di rumah sampai ayahnya kelak meninggal.
  rationale: Teks Yunani tidak menjelaskan waktu kematian sang ayah. Karena itu, terjemahan utama mempertahankan ketidakjelasan tersebut dan catatan kaki menyebutkan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kepada-Nya' mengikuti kelaziman penulisan Kristen Indonesia untuk rujukan kepada Yesus; 'izinkanlah' mempertahankan nada permohonan yang hormat tanpa terdengar kaku.
