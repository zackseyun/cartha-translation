id: MAT.8.28
reference: Matthew 8:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: id
  text: Ketika Yesus tiba di seberang, di wilayah orang Gadara,[a] dua orang yang kerasukan setan, yang keluar dari makam-makam, menemui-Nya. Mereka begitu ganas[b] sehingga tidak seorang pun dapat melewati jalan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memiliki “orang Gergesa” atau “orang Gerasa” sebagai ganti “orang Gadara.”
    reason: textual_variant
  - marker: b
    text: 'Atau: “sangat berbahaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ketika Yesus tiba
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia. Nama “Yesus” memperjelas acuan pronomina tanpa mengubah tokoh yang dimaksud dalam konteks.
- source_word: τὸ πέραν
  choice: di seberang
  rationale: Ungkapan ini menunjuk ke sisi seberang dan secara alami diterjemahkan “di seberang” dalam konteks perjalanan melintasi danau.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: wilayah orang Gadara
  rationale: χώρα berarti wilayah atau daerah, sedangkan bentuk gentilika Γαδαρηνῶν menunjuk kepada penduduk Gadara. Bentuk ini mengikuti bacaan utama SBLGNT.
- source_word: δύο δαιμονιζόμενοι
  choice: dua orang yang kerasukan setan
  rationale: Ungkapan ini menyatakan dua orang yang berada di bawah kuasa demonis. “Kerasukan setan” merupakan ungkapan Indonesia yang jelas dan lazim tanpa menambahkan perincian yang tidak dinyatakan teks.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: mereka keluar dari makam-makam
  rationale: μνημεῖον dalam konteks ini adalah tempat penguburan atau makam. Bentuk jamak dipertahankan, dan partisipelnya disajikan sebagai kalimat tersendiri agar jelas dan alami.
- source_word: χαλεποὶ λίαν
  choice: begitu ganas
  rationale: χαλεπός di sini dapat berarti ganas, berbahaya, atau keras; λίαν menguatkannya. “Begitu ganas” cocok dengan klausa akibat berikutnya tanpa membatasi makna hanya pada kekerasan fisik.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: sehingga tidak seorang pun dapat melewati jalan itu
  rationale: ὥστε menyatakan akibat, ἰσχύειν menyatakan kemampuan dalam konteks ini, dan διὰ τῆς ὁδοῦ menunjukkan jalan sebagai rute yang dilalui.
theological_decisions:
- issue: Bahasa untuk keadaan di bawah kuasa demonis
  choice: kerasukan setan
  alternative: dikuasai roh-roh jahat
  rationale: Terjemahan utama menyampaikan adanya kuasa demonis pribadi sebagaimana dinyatakan δαιμονιζόμενοι, tetapi tidak memperluas teks menjadi uraian teknis mengenai tingkat atau mekanisme penguasaan tersebut.
- issue: Varian tekstual nama tempat
  choice: orang Gadara
  alternative: orang Gergesa atau orang Gerasa
  rationale: Teks utama mengikuti Γαδαρηνῶν dalam SBLGNT. Bacaan lain yang cukup penting dalam tradisi manuskrip dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah setelah pertemuan untuk menghindari rangkaian partisipel yang kaku, sambil mempertahankan urutan peristiwa dan hubungan akibat dalam teks Yunani.
