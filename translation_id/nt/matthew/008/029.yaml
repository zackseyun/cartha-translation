id: MAT.8.29
reference: Matthew 8:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: id
  text: Dan lihatlah, mereka berteriak dan berkata, “Apa urusan kami dengan-Mu[a], Anak Allah? Apakah Engkau datang ke sini sebelum waktu yang ditetapkan[b] untuk menyiksa kami?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Apa hubungan antara kami dan Engkau?” Ungkapan ini menyatakan penolakan atau sikap menjaga jarak.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebelum waktunya.” Kata Yunani yang digunakan dapat menunjuk pada waktu yang telah ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: Mempertahankan penanda wacana yang menarik perhatian dan memberi kesan kejadian yang mendadak serta hidup.
- source_word: ἔκραξαν λέγοντες
  choice: mereka berteriak dan berkata
  rationale: Menyampaikan kerasnya seruan dalam κράζω sekaligus mempertahankan unsur λέγοντες dengan susunan Indonesia yang jelas.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Apa urusan kami dengan-Mu
  rationale: Ungkapan ini menyatakan penolakan atau jarak yang bersifat menantang. Terjemahan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk idiom sumber tanpa menjelaskan maksudnya secara berlebihan.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Anak Allah
  rationale: Menerjemahkan gelar kristologis ini secara langsung. Huruf kapital menandai gelar yang ditujukan kepada Yesus.
- source_word: ἦλθες ὧδε
  choice: Apakah Engkau datang ke sini
  rationale: Menyampaikan kedatangan yang menjadi pokok pertanyaan, sedangkan 'ke sini' mempertahankan unsur lokatif ὧδε.
- source_word: πρὸ καιροῦ
  choice: sebelum waktu yang ditetapkan
  rationale: καιρός dapat menunjuk pada waktu tertentu atau waktu yang telah ditentukan. Pilihan ini mempertahankan nuansa penghakiman pada waktu yang telah ditetapkan tanpa merinci siapa yang menetapkannya di dalam teks utama.
- source_word: βασανίσαι
  choice: untuk menyiksa
  rationale: Dalam konteks ini kata tersebut menunjuk pada penderitaan berat atau siksaan. 'Menyiksa' merupakan padanan Indonesia yang kuat dan langsung.
- source_word: ἡμᾶς
  choice: kami
  rationale: Kata ganti orang pertama jamak ini merujuk kepada roh-roh jahat yang berbicara melalui kedua orang tersebut.
theological_decisions:
- issue: Pengakuan roh-roh jahat tentang identitas Yesus
  choice: Anak Allah
  alternative: anak Allah
  rationale: Teks secara eksplisit menampilkan sapaan υἱὲ τοῦ θεοῦ kepada Yesus. Terjemahan mempertahankan gelar itu tanpa melemahkan atau memperluas pengakuannya.
- issue: Nuansa eskatologis καιρός
  choice: sebelum waktu yang ditetapkan
  alternative: sebelum waktunya
  rationale: Pertanyaan itu menyiratkan adanya waktu tertentu bagi penghukuman. Pilihan utama mempertahankan nuansa tersebut, sementara catatan kaki mengakui bahwa bahasa Yunani tidak menyebutkan pelaku yang menetapkan waktu itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti yang merujuk kepada Yesus ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk sapaan dan pertanyaan mempertahankan ketegangan konfrontatif dalam teks sumber.
