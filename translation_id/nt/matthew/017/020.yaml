source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: id
  text: 'Ia berkata kepada mereka, “Karena kecilnya iman kalian.[a] Sesungguhnya aku berkata kepada kalian: Jika kalian mempunyai iman sebesar biji sesawi,[b] kalian akan berkata kepada gunung ini, ‘Pindahlah dari sini ke sana,’ dan gunung itu akan berpindah. Tidak ada sesuatu pun yang mustahil bagi kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Karena kalian kurang percaya.” Kata Yunani ini lebih khusus menunjuk pada iman yang kecil atau tidak memadai, bukan ketidakpercayaan sama sekali.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “iman seperti biji sesawi.” Perbandingan ini menunjuk pada sesuatu yang sangat kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani menghidupkan narasi, tetapi bahasa Indonesia secara alami dapat memakai bentuk netral waktu ‘berkata’ tanpa kehilangan aspek tersebut.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Karena iman kalian kecil
  rationale: ὀλιγοπιστία menunjuk pada iman yang kecil atau tidak memadai, bukan dengan tegas pada ketiadaan iman sama sekali.
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam ucapan Yesus, ἀμήν memperkenalkan pernyataan yang sungguh-sungguh dan berwibawa; ‘sesungguhnya’ mempertahankan fungsi penegas ini dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada kepercayaan kepada kuasa Allah; ‘iman’ adalah padanan Indonesia yang lazim dan tidak mempersempitnya menjadi doktrin keselamatan tertentu.
- source_word: ὡς κόκκον σινάπεως
  choice: sebesar biji sesawi
  rationale: Perbandingan itu menonjolkan ukuran yang sangat kecil. ‘Sebesar’ mengungkapkan maksud kontekstual secara alami, sementara bentuk Yunani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Pindahlah dari sini ke sana
  rationale: Kata kerja μεταβαίνω menyatakan perpindahan tempat; ‘pindahlah’ sesuai untuk perintah yang ditujukan kepada gunung.
- source_word: μεταβήσεται
  choice: gunung itu akan berpindah
  rationale: Bentuk ini bersifat intransitif dalam konteksnya. Mengulang ‘gunung itu’ memperjelas rujukan secara alami dalam bahasa Indonesia.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: Tidak ada sesuatu pun yang mustahil bagi kalian
  rationale: Ungkapan Yunani berarti bahwa tidak ada sesuatu yang akan terbukti mustahil bagi mereka; padanan ini jelas dan idiomatis.
theological_decisions:
- issue: Makna πίστις dalam konteks mukjizat
  choice: iman
  alternative: kepercayaan
  rationale: Konteksnya menyangkut kepercayaan para murid yang tidak memadai terhadap kuasa Allah. ‘Iman’ mempertahankan istilah teologis yang luas tanpa mengartikannya secara khusus sebagai iman yang menyelamatkan atau kesetiaan.
- issue: Cakupan janji ‘tidak ada sesuatu pun yang mustahil’
  choice: Mempertahankan pernyataan umum sebagaimana teks Yunani
  alternative: Membatasi secara eksplisit pada pelayanan, kehendak Allah, atau mukjizat tertentu
  rationale: Teks ayat ini tidak menyatakan pembatas tersebut secara eksplisit. Terjemahan tidak menambah penjelasan doktrinal yang akan menyelesaikan ketegangan pernyataan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ dipakai untuk bentuk jamak ὑμεῖς; pronomina yang merujuk kepada Yesus ditulis dengan huruf kecil sesuai kaidah umum dan agar tidak memasukkan penandaan interpretatif yang tidak terdapat dalam naskah Yunani.
