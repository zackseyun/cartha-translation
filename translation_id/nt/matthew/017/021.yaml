id: MAT.17.21
reference: Matthew 17:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: id
  text: Namun, jenis ini tidak keluar kecuali melalui doa dan puasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Kodeks Sinaiticus dan Vaticanus dari abad ke-4, maupun dalam terjemahan Suryani dan Koptik awal. Namun, ayat ini terdapat dalam mayoritas naskah tradisi Bizantin, tradisi Latin, dan sebagian besar naskah Suryani. Kemungkinan ayat ini ditambahkan oleh penyalin kemudian untuk menyelaraskannya dengan Markus 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: jenis
  rationale: Dalam konteks ini, kata tersebut menunjuk pada golongan atau kategori roh jahat; “jenis” adalah padanan Indonesia yang alami dan tidak mempersempit maknanya secara berlebihan.
- source_word: ἐκπορεύεται
  choice: keluar
  rationale: Kata ini menggambarkan roh jahat keluar dari orang yang dirasuk; “keluar” mempertahankan gambaran arah dalam teks Yunani secara lugas.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Ungkapan ini berfungsi membatasi cara yang disebutkan, sehingga paling alami diterjemahkan “kecuali”.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: melalui doa dan puasa
  rationale: Preposisi ἐν di sini menyatakan sarana atau lingkungan tindakan; “melalui” menyampaikan fungsi instrumentalnya secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan “jenis ini”
  choice: Dibiarkan sebagai “jenis ini” tanpa menambahkan “roh jahat”.
  alternative: “Jenis roh jahat ini”
  rationale: Teks Yunani hanya menyatakan τοῦτο τὸ γένος. Konteks memungkinkan acuan kepada jenis roh jahat, tetapi terjemahan tidak perlu menambahkan unsur yang tidak dinyatakan secara eksplisit.
- issue: Hubungan doa dan puasa dengan pengusiran
  choice: Dipertahankan sebagai syarat eksklusif sebagaimana susunan ayat.
  alternative: Menjelaskannya sebagai disiplin persiapan rohani atau formula pengusiran.
  rationale: Teks tidak menjelaskan mekanisme atau waktu doa dan puasa, sehingga ketegangan penafsirannya tidak diselesaikan di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Namun” mempertahankan hubungan kontras δέ; susunan kalimat tetap dekat dengan teks Yunani tanpa terdengar kaku. Penanda catatan kaki ditempatkan pada akhir ayat.
