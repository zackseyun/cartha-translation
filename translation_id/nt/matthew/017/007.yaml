reference: Matthew 17:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: id
  text: Lalu Yesus mendekati mereka, menyentuh mereka, dan berkata, “Bangunlah dan jangan takut.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: mendekati
  rationale: Kata προσέρχομαι menyatakan gerak menuju seseorang. “Mendekati” alami dalam bahasa Indonesia modern dan tidak menambahkan nuansa yang tidak terdapat dalam teks.
- source_word: ἁψάμενος αὐτῶν
  choice: menyentuh mereka
  rationale: Partisip aoris ἅπτω dengan bentuk genitif berarti menyentuh. Klausa koordinatif ini wajar dalam bahasa Indonesia dan mempertahankan urutan tindakan tanpa memperinci bahwa Yesus menumpangkan tangan.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan langsung dan netral bagi λέγω dalam konteks ujaran langsung.
- source_word: Ἐγέρθητε
  choice: Bangunlah
  rationale: Perintah ini meminta para murid bangkit dari posisi tersungkur dalam konteks ayat sebelumnya. “Bangunlah” jelas dan alami tanpa menentukan secara berlebihan bahwa mereka harus berdiri tegak.
- source_word: μὴ φοβεῖσθε
  choice: jangan takut
  rationale: Ungkapan ini merupakan padanan Indonesia yang alami dan langsung bagi larangan untuk merasa takut. Bentuk kini Yunani tidak harus ditafsirkan secara lebih khusus sebagai “berhentilah merasa takut.”
- source_word: καὶ
  choice: lalu / dan
  rationale: Καί pertama diterjemahkan “Lalu” agar alur narasi Indonesia alami, sedangkan penghubung tindakan dan perintah dipertahankan dengan “dan”; tidak ada hubungan kausal tambahan yang dimasukkan.
theological_decisions:
- issue: Menerjemahkan perintah penghiburan Yesus tanpa menambahkan nuansa pastoral atau doktrinal
  choice: Bangunlah dan jangan takut
  alternative: Bangkitlah dan janganlah merasa takut
  rationale: Terjemahan mempertahankan dua perintah langsung—bangkit dari keadaan tersungkur dan tidak takut—tanpa memperluas alasan, sifat penghiburan, atau makna teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bangunlah” mempertahankan bentuk perintah dengan akhiran -lah, sedangkan “jangan takut” terdengar alami dan tidak kaku. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
