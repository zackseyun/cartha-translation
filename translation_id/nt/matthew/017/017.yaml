  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: id
  text: Lalu Yesus menjawab, “Hai angkatan yang tidak percaya[a] dan sesat[b], sampai kapan Aku akan bersama kalian? Sampai kapan Aku akan bersabar terhadap kalian? Bawalah dia kemari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak setia.” Kata Yunani ini dapat berarti “tidak percaya” atau “tidak setia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang bengkok,” “yang menyimpang,” atau “yang rusak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Lalu Yesus menjawab
  rationale: Ungkapan ἀποκριθεὶς ... εἶπεν secara idiomatis berarti ‘menjawab’; δέ di sini berfungsi sebagai penghubung naratif yang menandai peralihan, sehingga ‘lalu’ alami dalam bahasa Indonesia tanpa memperkuat pertentangan secara berlebihan.
- source_word: Ὦ γενεὰ
  choice: Hai angkatan
  rationale: ‘Hai’ mempertahankan seruan langsung dan nada teguran. ‘Angkatan’ menunjuk kepada kelompok sezaman serta mempertahankan gema profetis dari γενεά.
- source_word: ἄπιστος
  choice: yang tidak percaya
  rationale: Dalam konteks kegagalan para murid yang berkaitan dengan iman, frasa ini menyampaikan ketiadaan iman dengan jelas. Kemungkinan arti ‘tidak setia’ dipertahankan dalam catatan kaki.
- source_word: διεστραμμένη
  choice: menyimpang
  rationale: Bentuk partisipel perfektum pasif ini menggambarkan keadaan yang telah dibengkokkan atau diselewengkan. ‘Menyimpang’ menyampaikan kerusakan arah moral secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: sampai kapan Aku akan bersama kalian?
  rationale: Menerjemahkan pertanyaan retoris dan bentuk futurum secara langsung. ‘Kalian’ menunjukkan bahwa ὑμῶν berbentuk jamak.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: sampai kapan Aku akan bersabar terhadap kalian?
  rationale: ἀνέχομαι berarti bertahan menghadapi atau menanggung seseorang. ‘Bersabar terhadap’ mengungkapkan daya tahan dalam menghadapi orang lain secara alami tanpa nada bahasa sehari-hari yang terlalu santai.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Bawalah dia kemari kepada-Ku
  rationale: Perintah jamak φέρετε diterjemahkan secara alami sebagai ‘bawalah’; αὐτόν merujuk kepada anak laki-laki dalam konteks, dan ὧδε berarti ‘kemari’.
theological_decisions:
- issue: Cakupan makna ἄπιστος dalam teguran Yesus
  choice: yang tidak percaya
  alternative: yang tidak setia
  rationale: Konteks langsung menyoroti kekurangan iman, tetapi kata Yunani itu juga dapat menyatakan ketidaksetiaan. Terjemahan utama mengikuti konteks, sedangkan catatan kaki mempertahankan ambiguitas leksikal.
- issue: Pihak yang disapa dengan γενεὰ dan kata ganti jamak
  choice: Tidak diperinci lebih jauh daripada ‘angkatan’ dan ‘kalian’
  alternative: Membatasi sapaan hanya kepada para murid atau memperluasnya secara eksplisit kepada seluruh orang banyak
  rationale: Ayat ini sendiri tidak menentukan dengan tegas batas kelompok yang ditegur. Terjemahan mempertahankan keluasan sapaan tersebut tanpa menyelesaikan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang khidmat tetapi tetap mudah dipahami. ‘Aku’ dan ‘-Ku’ dipakai untuk ucapan Yesus sesuai kelaziman gaya Alkitab bahasa Indonesia; ‘kalian’ memperjelas bentuk jamak tanpa memakai bentuk yang kaku.
