  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: id
  text: Ketika mendengar suara itu,[a] murid-murid tersungkur dengan wajah menghadap tanah[b] dan menjadi sangat takut.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “setelah mendengar”; bentuk partisip Yunani dapat dipahami sebagai “ketika mendengar” atau “setelah mendengar”. “Suara itu” mengacu pada suara dari awan dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jatuh pada wajah mereka”, yaitu tersungkur dengan wajah menghadap tanah.
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani yang dipakai menegaskan bahwa mereka merasa amat takut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ketika mendengar suara itu
  rationale: Partisip aoris ini paling alami dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia. Objek yang tersirat diperjelas sebagai 'suara itu' berdasarkan konteks langsung, yaitu suara dari awan pada ayat sebelumnya.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku dan alami bagi para pengikut Yesus dalam konteks Injil.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: tersungkur dengan wajah ke tanah
  rationale: '''Tersungkur'' menyampaikan gerakan jatuh menelungkup, sedangkan frasa tambahan mempertahankan gambaran konkret bahwa wajah mereka menghadap tanah tanpa menentukan motif teologisnya.'
- source_word: ἐφοβήθησαν
  choice: menjadi takut
  rationale: Bentuk aoris menyatakan timbulnya respons takut; 'menjadi takut' alami dan tetap dekat dengan aspek peristiwa dalam narasi.
- source_word: σφόδρα
  choice: sangat
  rationale: Adverbia ini memperkuat tingkat ketakutan; 'sangat' merupakan padanan Indonesia modern yang jelas dan wajar.
theological_decisions:
- issue: Sifat respons murid-murid terhadap suara ilahi
  choice: Menggambarkan mereka tersungkur dan menjadi sangat takut tanpa menamai tindakan itu sebagai penyembahan atau ketakutan itu sebagai rasa gentar yang khidmat.
  alternative: Menafsirkan respons tersebut secara khusus sebagai penyembahan penuh hormat atau sebagai teror di hadapan penyataan ilahi.
  rationale: Teks Yunani menyebut postur tubuh dan ketakutan yang kuat, tetapi tidak menjelaskan sifat teologisnya secara lebih khusus. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan naratif, postur fisik, dan kuatnya rasa takut dalam teks Yunani.
