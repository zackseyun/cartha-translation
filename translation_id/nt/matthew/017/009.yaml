id: MAT.17.9
reference: Matthew 17:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: id
  text: Ketika mereka sedang turun dari gunung itu, Yesus memerintahkan mereka, “Jangan ceritakan penglihatan itu kepada siapa pun sampai Anak Manusia dibangkitkan dari antara orang mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Ketika mereka sedang turun dari gunung itu
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan; ungkapan ini alami dalam bahasa Indonesia serta mempertahankan acuan khusus gunung yang baru disebutkan.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Yesus memerintahkan mereka
  rationale: ἐνετείλατο menyatakan perintah tegas. λέγων berfungsi memperkenalkan perkataan langsung dan tidak perlu diterjemahkan secara kaku sebagai 'dengan berkata' dalam bahasa Indonesia.
- source_word: Μηδενὶ εἴπητε τὸ ὅραμα
  choice: Jangan ceritakan penglihatan itu kepada siapa pun
  rationale: Bentuk larangan diterjemahkan secara alami dan tegas. 'Penglihatan' mempertahankan nuansa revelatoris ὅραμα tanpa mengubahnya menjadi parafrasa 'apa yang kalian lihat'.
- source_word: ἕως οὗ
  choice: sampai
  rationale: Menandai batas waktu berlakunya larangan secara tepat dan idiomatis.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar diri Yesus dan gema teologisnya tanpa parafrasa.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mencerminkan secara lebih penuh ungkapan Yunani tentang keluar dari kalangan orang-orang mati, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: ἐγερθῇ
  choice: dibangkitkan
  rationale: Mempertahankan bentuk pasif aoristus subjungtif dan tidak menyebutkan pelaku secara lebih eksplisit daripada teks sumber.
theological_decisions:
- issue: Bentuk pasif dalam bahasa kebangkitan
  choice: dibangkitkan dari antara orang mati
  alternative: bangkit dari antara orang mati
  rationale: Bentuk pasif Yunani dipertahankan agar kemungkinan implikasi tindakan ilahi tetap ada tanpa menjadikan pelakunya eksplisit.
- issue: Makna τὸ ὅραμα
  choice: penglihatan itu
  alternative: apa yang kalian lihat
  rationale: Pilihan utama mempertahankan istilah sumber dan nuansa pengalaman pewahyuan tanpa memastikan secara berlebihan sifat ontologis peristiwa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Struktur partisipial Yunani diungkapkan secara idiomatis; kutipan langsung tidak dibebani formula 'dengan berkata' yang terasa kaku.
