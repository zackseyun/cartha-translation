id: MAT.17.27
reference: Matthew 17:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: id
  text: Namun, supaya kita tidak menyinggung mereka[a], pergilah ke laut, lemparkan kail, lalu ambillah ikan pertama yang muncul. Ketika kamu membuka mulutnya, kamu akan menemukan satu keping stater[b]. Ambillah uang itu dan berikan kepada mereka sebagai pembayaran bagi-Ku dan bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat mereka tersandung” atau “menjadi batu sandungan bagi mereka.”
    reason: lexical_alternative
  - marker: b
    text: Satu stater bernilai kira-kira empat drakhma, cukup untuk membayar pajak Bait Allah bagi dua orang.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: menyinggung
  rationale: Dalam konteks ini, kata tersebut menunjuk pada timbulnya keberatan atau rasa tersinggung yang tidak perlu, bukan terutama menyebabkan orang berbuat dosa. Catatan kaki mempertahankan gambaran harfiahnya.
- source_word: θάλασσαν
  choice: laut
  rationale: Mempertahankan istilah Yunani bagi perairan itu, meskipun secara geografis Laut Galilea merupakan sebuah danau.
- source_word: ἄγκιστρον
  choice: kail
  rationale: Istilah Indonesia yang alami dan tepat untuk alat pancing yang dimaksud.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: ikan pertama yang muncul
  rationale: Mengungkapkan ikan pertama yang naik atau muncul setelah kail dilemparkan tanpa membuat susunan Indonesia terasa kaku.
- source_word: ἆρον
  choice: ambillah
  rationale: Dalam rangkaian tindakan ini, maknanya ialah mengambil ikan yang tertangkap.
- source_word: στατῆρα
  choice: sekeping uang stater
  rationale: Mempertahankan nama khusus mata uang Yunani sambil memakai penggolong yang membuat rujukannya jelas; nilainya dijelaskan dalam catatan kaki.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: untuk-Ku dan untukmu
  rationale: Menyampaikan bahwa uang itu diberikan sebagai pembayaran bagi kedua orang tersebut tanpa menambahkan penafsiran di luar ungkapan sumber.
- source_word: πορευθεὶς
  choice: pergilah
  rationale: Partisip ini menyatakan tindakan pendahulu yang secara alami diungkapkan sebagai perintah dalam bahasa Indonesia.
- source_word: δὸς αὐτοῖς
  choice: berikanlah kepada mereka
  rationale: Mempertahankan verba umum 'memberikan'; konteks pasal membuat fungsi pembayaran itu jelas.
theological_decisions:
- issue: Makna σκανδαλίζω sehubungan dengan pembayaran pajak Bait Allah oleh Yesus
  choice: Yesus memerintahkan pembayaran agar mereka tidak menimbulkan keberatan atau menyinggung para pemungut pajak, tanpa membatalkan pernyataan sebelumnya bahwa anak-anak bebas.
  alternative: Yesus membayar karena Ia mengakui kewajiban mutlak, atau pembayaran itu semata-mata merupakan pertunjukan mukjizat.
  rationale: Klausa tujuan pada ayat ini menyatakan alasan praktis untuk membayar, sedangkan 17:24–26 tetap mempertahankan kebebasan anak-anak. Terjemahan tidak menyelesaikan ketegangan itu dengan menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah dibuat alami, sedangkan nama mata uang dan metafora alternatif dipertahankan melalui catatan kaki. Penanda catatan kaki diselaraskan dengan isi catatannya.
