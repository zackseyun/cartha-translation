id: MAT.17.5
reference: Matthew 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: id
  text: Ketika Petrus masih berbicara, lihatlah, awan yang bercahaya menaungi mereka, dan lihatlah, suara dari awan itu berkata, “Inilah Anak-Ku yang Kukasihi; kepada-Nya Aku berkenan. Dengarkanlah Dia!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dengarkanlah” juga mengandung arti mengindahkan perkataan-Nya, bukan sekadar mendengar bunyinya.
    reason: lexical_alternative
  - marker: b
    text: Kata “menaungi” dapat menggemakan bahasa Alkitab tentang kehadiran Allah yang dinyatakan.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Ketika Petrus masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung ketika peristiwa berikutnya menyela. Nama Petrus dijelaskan dari konteks ayat sebelumnya agar rujukan pronominal alami dalam bahasa Indonesia.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan kedua penanda pengarah perhatian yang menambah daya dramatik adegan, dengan bentuk Indonesia yang jelas dan bermartabat.
- source_word: νεφέλη φωτεινὴ
  choice: awan yang bercahaya
  rationale: Menyampaikan arti terang atau bersinar tanpa menjelaskan simbolisme teologisnya secara berlebihan.
- source_word: ἐπεσκίασεν
  choice: menaungi
  rationale: Menjaga gambaran awan yang meliputi atau membayangi mereka serta kemungkinan gaung bahasa penampakan ilahi.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: terdengar suara dari dalam awan itu berkata
  rationale: Susunan ini alami dalam narasi Indonesia dan mempertahankan asal suara dari awan.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Anak-Ku yang Kukasihi
  rationale: Menyatakan hubungan sebagai Anak dan kasih Sang Pembicara dengan bahasa Indonesia yang wajar, tanpa memasukkan rumusan doktrinal tambahan.
- source_word: ἐν ᾧ εὐδόκησα
  choice: kepada-Nyalah Aku berkenan
  rationale: Menyampaikan perkenanan ilahi secara relasional dan idiomatis, sementara partikel -lah memberi tekanan yang sepadan.
- source_word: ἀκούετε αὐτοῦ
  choice: Dengarkanlah Dia
  rationale: Imperatif ini menuntut pendengaran yang penuh perhatian dan mengandung makna mengindahkan, tanpa memperluasnya secara eksplisit menjadi 'taatilah'.
theological_decisions:
- issue: Pernyataan ilahi tentang identitas Yesus
  choice: Inilah Anak-Ku yang Kukasihi; kepada-Nyalah Aku berkenan
  alternative: Inilah Anak-Ku, Yang Kukasihi; di dalam Dia Aku berkenan
  rationale: Terjemahan mempertahankan identifikasi langsung Yesus sebagai Anak, kasih kepada-Nya, dan perkenanan ilahi, tanpa mengimpor istilah dogmatis yang tidak terdapat dalam teks.
- issue: Daya perintah ἀκούετε αὐτοῦ
  choice: Dengarkanlah Dia
  alternative: Indahkanlah Dia
  rationale: '''Dengarkanlah'' tetap berakar pada citra mendengar dan dalam konteks perintah dapat mencakup mengindahkan, sedangkan ''indahkanlah'' berisiko menghapus unsur pendengaran.'
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kedua kemunculan ἰδού dipertahankan sebagai “lihatlah” untuk menjaga daya dramatik. Tanda seru pada perintah penutup mencerminkan ketegasan imperatif tanpa menambah isi.
