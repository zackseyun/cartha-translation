  terminology: “Anak-Ku yang Kukasihi,” “Aku berkenan,” dan “Dengarkanlah Dia” merupakan padanan yang setia dan lazim. “Menaungi” mempertahankan citra ἐπεσκίασεν tanpa menafsirkan makna teologisnya secara berlebihan.
