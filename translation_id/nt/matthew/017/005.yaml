revisions:
- from: Ketika Petrus masih berbicara, lihatlah, awan yang bercahaya menaungi mereka. Lalu, lihatlah, terdengar suara dari dalam awan itu berkata, “Inilah Anak-Ku yang Kukasihi; kepada-Nyalah Aku berkenan. Dengarkanlah Dia!”[a][b]
  to: Ketika Petrus masih berbicara, lihatlah, awan yang bercahaya menaungi mereka, dan lihatlah, suara dari awan itu berkata, “Inilah Anak-Ku yang Kukasihi; kepada-Nya Aku berkenan. Dengarkanlah Dia!”[a][b]
  rationale: Revisi memulihkan alur tunggal kalimat Yunani, mempertahankan kedua penanda perhatian ἰδού sebagai “lihatlah,” dan mengganti ungkapan yang kurang alami serta lebih sempit “terdengar suara dari dalam awan itu berkata” dengan “suara dari awan itu berkata.” Makna ayat dan jangkar catatan kaki dipertahankan.
