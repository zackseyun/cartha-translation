  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: id
  text: Kemudian murid-murid datang kepada Yesus secara tersendiri dan berkata, “Mengapa kami tidak mampu mengusirnya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ini dapat merujuk kepada roh jahat itu atau kepada anak itu.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan peristiwa; alami dalam bahasa Indonesia modern.
- source_word: προσελθόντες
  choice: mendekati
  rationale: Partisip aoris προσέρχομαι menyatakan tindakan datang menghampiri; 'mendekati' mempertahankan nuansa geraknya dengan wajar.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Padanan baku μαθηταί dalam konteks Injil, yakni para murid Yesus.
- source_word: τῷ Ἰησοῦ
  choice: Yesus
  rationale: Objek datif dari προσέρχομαι; nama pribadi mengikuti bentuk baku bahasa Indonesia.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Ungkapan idiomatis yang berarti tersendiri, tidak di hadapan orang banyak.
- source_word: εἶπον
  choice: berkata
  rationale: Menerjemahkan verba λέγω secara langsung; bentuk pertanyaan sudah tampak dari ujaran yang mengikutinya.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan alami bagi frasa interogatif yang menanyakan alasan.
- source_word: ἡμεῖς
  choice: kami
  rationale: Karena para murid berbicara kepada Yesus, pronomina eksklusif 'kami' tepat dan tetap mencerminkan pronomina Yunani yang dinyatakan secara eksplisit.
- source_word: οὐκ ἠδυνήθημεν
  choice: tidak mampu
  rationale: Menyatakan ketidakmampuan secara langsung dan alami.
- source_word: ἐκβαλεῖν
  choice: mengusir
  rationale: Padanan lazim dan jelas untuk tindakan mengeluarkan roh jahat dalam konteks eksorsisme.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina netral ini kemungkinan menunjuk kepada roh jahat, tetapi secara gramatikal dapat pula dipahami menunjuk kepada anak itu; bentuk '-nya' mempertahankan ketaksaan rujukan tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan αὐτό dalam konteks pengusiran roh jahat
  choice: Menggunakan pronomina '-nya' yang tidak menandai gender atau jenis rujukan.
  alternative: Menjelaskan objek sebagai 'roh itu' atau 'anak itu'.
  rationale: Konteks paling mungkin menunjuk kepada roh jahat sebagai objek ἐκβαλεῖν, tetapi bentuk Yunani juga telah dipahami merujuk kepada anak itu. Bahasa Indonesia memungkinkan ketaksaan asli dipertahankan tanpa menetapkan salah satu tafsiran di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Secara pribadi' mempertahankan makna κατ’ ἰδίαν, sedangkan '-nya' menjaga ketaksaan rujukan αὐτό. Penanda catatan kaki ditempatkan langsung setelah pronomina yang dijelaskan.
