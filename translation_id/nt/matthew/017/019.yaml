review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: urutan waktu, para murid datang kepada Yesus, percakapan pribadi, dan pertanyaan tentang kegagalan mengusir objek tersebut. Pronomina ''-nya'' secara baik mempertahankan ketaksaan αὐτό, dan catatan kaki mendokumentasikan kedua rujukan yang mungkin. Namun, ''secara pribadi'' dalam bahasa Indonesia umumnya berarti ''personally'' (oleh/dalam kapasitas pribadi), bukan ''secara tersendiri/in private''; sehingga tidak tepat untuk κατ’ ἰδίαν.'
  naturalness: Kalimatnya jelas dan berregister baik, tetapi 'mendekati Yesus secara pribadi' terdengar seolah-olah mereka bertindak atas inisiatif atau kapasitas pribadi. 'Datang kepada Yesus secara tersendiri' adalah ungkapan modern yang lebih alami dan tepat untuk percakapan yang tidak terbuka.
  terminology: Nama 'Yesus,' 'murid-murid,' dan 'mengusir' sesuai penggunaan Injil dalam bahasa Indonesia. 'Kami' tepat karena lawan bicara tidak termasuk dalam kelompok penutur. Tidak perlu menyebut 'roh jahat' dalam teks utama karena rujukan αὐτό memang patut dibiarkan terbuka.
