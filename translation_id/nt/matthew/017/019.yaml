  rationale: Mengganti 'mendekati Yesus secara pribadi' dengan 'datang kepada Yesus secara tersendiri' untuk menerjemahkan κατ’ ἰδίαν secara idiomatis dan tepat, sambil mempertahankan semua unsur makna lain serta ketaksaan rujukan αὐτό.
