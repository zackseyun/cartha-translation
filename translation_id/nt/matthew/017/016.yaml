  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: id
  text: Aku membawanya kepada murid-murid-Mu, tetapi mereka tidak mampu menyembuhkannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: membawanya kepada
  rationale: Dalam konstruksi ini, bentuk aoristus dari προσφέρω berarti membawa seseorang kepada orang lain. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah tindakan kepada para murid.
- source_word: μαθηταῖς σου
  choice: murid-murid-Mu
  rationale: μαθητής dalam konteks Injil menunjuk kepada para pengikut yang belajar dari seorang guru. 'Murid-murid-Mu' merupakan padanan baku, jelas, dan sesuai konteks.
- source_word: οὐκ ἠδυνήθησαν
  choice: tidak mampu
  rationale: δύναμαι menyatakan kemampuan. 'Tidak mampu' menyampaikan ketidakmampuan para murid secara langsung tanpa menambahkan penyebabnya.
- source_word: θεραπεῦσαι
  choice: menyembuhkannya
  rationale: θεραπεύω di sini berarti menyembuhkan anak yang menderita itu. 'Menyembuhkan' merupakan padanan yang alami dan sesuai dengan konteks mukjizat penyembuhan.
- source_word: καὶ ... καὶ
  choice: Aku ... tetapi
  rationale: καί pertama melanjutkan laporan sang ayah dari konteks sebelumnya dan tidak perlu diterjemahkan secara mekanis pada awal ayat Indonesia. καί kedua secara wajar diterjemahkan 'tetapi' karena klausa berikut menyatakan hasil yang berlawanan dengan tujuan membawa anak itu, tanpa mengubah isi proposisional.
- source_word: αὐτόν
  choice: -nya
  rationale: Pronomina ini merujuk kepada anak laki-laki yang menderita dalam konteks langsung; bentuk enklitik '-nya' jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kegagalan para murid
  choice: Pernyataan diterjemahkan hanya sebagai ketidakmampuan untuk menyembuhkan anak itu.
  alternative: Menjelaskan secara eksplisit bahwa mereka gagal mengusir setan atau bahwa kegagalan itu disebabkan oleh kurangnya iman.
  rationale: Ayat ini sendiri hanya menyatakan bahwa para murid tidak mampu menyembuhkannya. Penjelasan dari konteks sekitar tidak dimasukkan ke dalam terjemahan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapital pada enklitik '-Mu' mengikuti kebiasaan ejaan teks Alkitab bahasa Indonesia untuk sapaan kepada Yesus. Tidak diperlukan catatan kaki karena alternatif 'tidak dapat' tidak menghasilkan perbedaan makna yang berarti.
