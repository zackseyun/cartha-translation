  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: id
  text: Ketika mereka tiba di Kapernaum, para pemungut pajak dua drakhma[a][b] datang kepada Petrus dan bertanya, “Apakah Guru kalian tidak membayar pajak dua drakhma?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua drakhma”; yaitu pajak Bait Allah sebesar dua drakhma.
    reason: cultural_note
  - marker: b
    text: Atau, “orang-orang yang menerima dua drakhma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Setelah mereka tiba
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan temporal; δέ cukup tercermin melalui peralihan kalimat tanpa harus diterjemahkan tersendiri.
- source_word: Καφαρναοὺμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: προσῆλθον
  choice: datang kepada
  rationale: Kata kerja ini berarti mendekat atau datang kepada seseorang; pilihan ini jelas dan wajar dalam konteks.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: para pemungut pajak dua drakhma
  rationale: Frasa partisipial ini mengenali orang-orang tersebut berdasarkan tugas mereka. Dalam konteks, λαμβάνοντες berarti memungut pembayaran, sehingga 'para pemungut' menyampaikan fungsi itu secara ringkas.
- source_word: δίδραχμα
  choice: pajak dua drakhma
  rationale: Bentuk Yunani menunjuk pada pembayaran senilai dua drakhma. Penambahan 'pajak' menyatakan fungsi pembayaran dalam konteks, sedangkan 'drakhma' mempertahankan satuan uang kuno.
- source_word: τῷ Πέτρῳ
  choice: kepada Petrus
  rationale: Dativus ini menunjukkan orang yang didatangi atau diajak bicara; nama Πέτρος memakai bentuk Indonesia yang lazim.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: Guru kalian
  rationale: διδάσκαλος berarti guru, dan ὑμῶν berbentuk jamak. 'Kalian' mempertahankan bahwa pertanyaan itu menyebut guru Petrus beserta kelompoknya, bukan Petrus seorang.
- source_word: οὐ τελεῖ
  choice: tidak membayar
  rationale: Dalam konteks kewajiban pajak, τελέω berarti membayar. Bentuk pertanyaan negatif dipertahankan dan tidak diubah menjadi pertanyaan positif.
theological_decisions:
- issue: Identifikasi δίδραχμα sebagai pajak, bukan sekadar keping uang
  choice: pajak dua drakhma
  alternative: dua keping drakhma / dua drakhma
  rationale: Konteks menanyakan pemenuhan suatu pembayaran wajib. 'Pajak' memperjelas fungsi kontekstualnya tanpa memasukkan kesimpulan doktrinal ke dalam teks.
- issue: Daya pragmatis pertanyaan negatif οὐ τελεῖ
  choice: Apakah Guru kalian tidak membayar ...?
  alternative: Guru kalian membayar ..., bukan?
  rationale: Bahasa Yunani kemungkinan mengharapkan jawaban positif, tetapi bentuk negatifnya sengaja dipertahankan agar nada dan ketegangannya tidak ditentukan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bermartabat. Bentuk jamak 'kalian' dipakai untuk menerjemahkan ὑμῶν secara tepat. Istilah kuno 'drakhma' dipertahankan, lalu dijelaskan melalui catatan kaki.
