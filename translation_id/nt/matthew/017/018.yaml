  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: id
  text: Yesus menghardik setan itu, lalu setan itu keluar dari anak itu; dan anak itu sembuh sejak saat itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai saat itu.”
    reason: Alternatif idiomatis untuk ungkapan waktu Yunani ἀπὸ τῆς ὥρας ἐκείνης.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: menghardik
  rationale: Kata ini menyatakan teguran keras dan berwibawa. “Menghardik” alami dalam konteks pengusiran setan dan tidak mempersempit maknanya menjadi sekadar “memerintahkan”.
- source_word: αὐτῷ
  choice: -nya
  rationale: Pronomina datif Yunani secara gramatikal dapat menunjuk kepada anak itu atau setan, walaupun kelanjutan kalimat sangat mendukung setan sebagai acuannya. Bentuk “-nya” mempertahankan pronomina tanpa mengganti sumber dengan nomina eksplisit.
- source_word: τὸ δαιμόνιον
  choice: setan itu
  rationale: Dalam bahasa Indonesia umum, “setan” merupakan padanan langsung dan wajar bagi δαιμόνιον. “Roh najis” akan memasukkan istilah yang tidak terdapat dalam ayat ini.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: keluar dari anak itu
  rationale: Ungkapan ini mempertahankan gambaran konkret pengusiran setan. “Anak itu” memperjelas acuan pronomina kedua agar kalimat Indonesia tidak kabur secara tidak perlu.
- source_word: ἐθεραπεύθη
  choice: sembuh
  rationale: Bentuk pasif Yunani menyatakan bahwa anak itu mengalami kesembuhan. Predikat “sembuh” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan hasil tindakan tersebut.
- source_word: ὁ παῖς
  choice: anak itu
  rationale: Dalam konteks ini παῖς adalah anak laki-laki yang dibawa ayahnya. “Anak itu” terdengar alami dan tidak mengimpor kemungkinan makna “hamba” yang tidak sesuai konteks.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: sejak waktu itu
  rationale: Terjemahan ini cukup dekat dengan ungkapan waktu Yunani sekaligus alami dalam bahasa Indonesia. Maknanya ialah kesembuhan yang terjadi sejak titik waktu tersebut.
theological_decisions:
- issue: Acuan αὐτῷ dalam tindakan Yesus menghardik
  choice: Memakai pronomina “-nya”, dengan setan sebagai acuan yang paling mungkin menurut konteks
  alternative: Memperjelasnya menjadi “Yesus menghardik setan itu” atau menafsirkannya sebagai anak itu
  rationale: Klausa berikutnya—setan itu keluar dari anak itu—sangat mendukung bahwa hardikan ditujukan kepada setan. Namun, penggunaan pronomina mempertahankan bentuk dan sedikit ambiguitas teks Yunani tanpa menyesatkan pembaca.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa mempertahankan gerak narasi Yunani, sementara pengulangan “anak itu” dipakai untuk memperjelas acuan dalam bahasa Indonesia.
