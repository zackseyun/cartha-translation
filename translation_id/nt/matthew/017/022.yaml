id: MAT.17.22
reference: Matthew 17:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: id
  text: Ketika mereka sedang berkumpul di Galilea,[a] Yesus berkata kepada mereka, “Anak Manusia akan diserahkan ke tangan manusia.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berhimpun di Galilea.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat berarti, “ke dalam kuasa manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: berkumpul
  rationale: Partisip genitif dari συστρέφω menggambarkan mereka sedang berkumpul atau berada bersama sebagai satu kelompok; ‘berkumpul’ alami dalam bahasa Indonesia dan tetap mempertahankan makna kolektifnya.
- source_word: δὲ
  choice: ketika
  rationale: Dalam konstruksi genitif absolut, δέ menghubungkan keadaan mereka di Galilea dengan perkataan Yesus; ‘ketika’ menghasilkan hubungan temporal yang alami tanpa memberi penekanan berlebihan.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: di Galilea
  rationale: Padanan lokatif langsung dan alami.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Menerjemahkan λέγω dengan objek tak langsung secara dekat dan tetap wajar dalam ragam Indonesia yang bermartabat.
- source_word: Μέλλει
  choice: akan segera
  rationale: Menyampaikan tindakan yang akan atau hampir terjadi tanpa memasukkan gagasan takdir yang lebih kuat daripada teks.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ungkapan baku yang mempertahankan bentuk harfiah serta gema intertekstual dan teologis sebutan diri Yesus.
- source_word: παραδίδοσθαι
  choice: diserahkan
  rationale: Mempertahankan bentuk pasif dan keluasan makna ‘diserahkan/diberikan ke dalam kuasa’, tanpa mempersempitnya hanya menjadi pengkhianatan Yudas.
- source_word: εἰς χεῖρας
  choice: ke tangan
  rationale: Mempertahankan metafora Yunani yang juga jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: ἀνθρώπων merujuk kepada para pelaku manusia dan membentuk permainan bunyi-konsep dengan ‘Anak Manusia’; ‘manusia’ wajar, inklusif, dan dekat dengan bentuk sumber.
theological_decisions:
- issue: Penerjemahan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: ‘Anak Manusia’ mempertahankan ungkapan tradisional-harfiah dan gema Alkitabiahnya; ‘Sang Manusia’ lebih interpretatif dan mengurangi hubungan verbal tersebut.
- issue: Nuansa παραδίδοσθαι dalam pemberitahuan penderitaan
  choice: diserahkan
  alternative: dikhianati
  rationale: ‘Diserahkan’ mempertahankan bentuk pasif dan tidak menentukan secara sempit siapa pelaku atau jenis penyerahannya; ‘dikhianati’ hanya mengungkap salah satu kemungkinan dalam rangkaian peristiwa.
- issue: Daya temporal μέλλει
  choice: akan segera
  alternative: ditakdirkan untuk
  rationale: ‘Akan segera’ menyampaikan sifat mendatang atau dekat dari tindakan itu tanpa memasukkan konsep penetapan nasib yang tidak harus dinyatakan oleh μέλλει.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan bermartabat. ‘Anak Manusia’ dipertahankan sebagai sebutan yang sudah dikenal. Tanda catatan ditempatkan tepat setelah unsur yang dijelaskan.
