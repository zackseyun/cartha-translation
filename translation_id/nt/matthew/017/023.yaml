id: MAT.17.23
reference: Matthew 17:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: id
  text: Dan mereka akan membunuh Dia, dan pada hari ketiga Dia akan dibangkitkan.[a] Dan mereka sangat berdukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Dia akan bangkit.” Kata kerja Yunani berbentuk pasif: “Dia akan dibangkitkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: mereka akan membunuh Dia
  rationale: Bentuk aktif futur jamak berarti bahwa mereka akan membunuh-Nya. 'Membunuh' merupakan padanan langsung dan alami; 'menghukum mati' akan menambahkan nuansa proses hukum yang tidak dinyatakan oleh verba Yunani.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Frasa datif ini menyatakan waktu terjadinya peristiwa. 'Pada hari ketiga' adalah ungkapan Indonesia yang baku dan tepat tanpa penambahan penafsiran.
- source_word: ἐγερθήσεται
  choice: Dia akan dibangkitkan
  rationale: Bentuk futur pasif dari ἐγείρω dipertahankan sebagai pasif. Ungkapan ini juga alami dalam bahasa Indonesia dan tidak mengaburkan kemungkinan pelaku ilahi yang tersirat.
- source_word: ἐλυπήθησαν σφόδρα
  choice: mereka sangat berdukacita
  rationale: '''Berdukacita'' menyampaikan kesedihan yang mendalam, sedangkan ''sangat'' secara langsung mewakili penguatan oleh σφόδρα.'
- source_word: καὶ ... καὶ ... καὶ
  choice: dan ... dan ... Lalu
  rationale: Dua kata penghubung pertama dipertahankan untuk mengikuti rangkaian Yunani. Pada klausa terakhir, 'Lalu' mengungkapkan kelanjutan naratif secara alami tanpa menyatakan hubungan sebab-akibat secara lebih tegas daripada teks.
theological_decisions:
- issue: Bentuk pasif atau aktif dalam nubuat kebangkitan
  choice: Dia akan dibangkitkan
  alternative: Dia akan bangkit
  rationale: Teks Yunani memakai bentuk futur pasif. Mempertahankan bentuk pasif melestarikan susunan sumber dan nuansa tindakan ilahi tanpa menentukan pelaku secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kapitalisasi 'Dia' dipakai bagi Yesus sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan tetap dekat dengan alur parataktis Yunani, tetapi penghubung terakhir dibuat alami dalam narasi Indonesia.
