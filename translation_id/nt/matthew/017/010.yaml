id: MAT.17.10
reference: Matthew 17:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: id
  text: Lalu murid-murid bertanya kepada-Nya, “Kalau begitu, mengapa para ahli Taurat mengatakan bahwa Elia harus datang lebih dahulu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: bertanya
  rationale: Bentuk aoris ἐπερωτάω memperkenalkan pertanyaan langsung; “bertanya” alami dalam bahasa Indonesia modern dan tidak menambahkan nuansa formal yang tidak diperlukan.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk kelompok yang sudah dikenal dalam konteks. Bahasa Indonesia tidak memiliki artikel definit; “murid-murid” cukup jelas tanpa menambahkan “murid-murid-Nya,” karena αὐτοῦ tidak terdapat dalam teks.
- source_word: λέγοντες
  choice: bertanya ... [diikuti kutipan langsung]
  rationale: Partisip ini memperkenalkan isi ujaran. Dalam bahasa Indonesia, menerjemahkannya secara terpisah sebagai “dengan berkata” terasa kaku dan berlebihan setelah “bertanya”; fungsi partisip dipadukan secara alami ke dalam konstruksi pertanyaan langsung.
- source_word: Τί οὖν
  choice: Kalau begitu, mengapa
  rationale: Dalam idiom ini τί meminta alasan, sedangkan οὖν menghubungkan pertanyaan dengan konteks sebelumnya. “Kalau begitu, mengapa” menyampaikan kedua unsur secara wajar.
- source_word: οἱ γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, γραμματεῖς menunjuk para pakar dan pengajar Taurat. “Para ahli Taurat” merupakan padanan Indonesia yang mapan, jelas, dan tidak sekadar menggambarkan pekerjaan menyalin naskah.
- source_word: λέγουσιν ὅτι
  choice: mengatakan bahwa
  rationale: Padanan langsung dan alami untuk verba kini yang diikuti klausa isi dengan ὅτι.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: δεῖ ἐλθεῖν
  choice: harus datang
  rationale: δεῖ menyatakan keharusan; “harus datang” ringkas, alami, dan mempertahankan daya ungkap sumber.
- source_word: πρῶτον
  choice: lebih dahulu
  rationale: Di sini πρῶτον menunjukkan urutan, yakni datang sebelum peristiwa atau tokoh yang sedang dibicarakan. “Lebih dahulu” lebih alami daripada “pertama” dalam konstruksi Indonesia ini.
theological_decisions:
- issue: Daya interpretatif pertanyaan murid-murid tentang kedatangan Elia
  choice: Pertanyaan diterjemahkan tanpa menentukan apakah ajaran para ahli Taurat sedang dibenarkan, diragukan, atau akan dikoreksi sebagian.
  alternative: Terjemahan yang lebih interpretatif dapat menyiratkan keraguan terhadap para ahli Taurat atau memasukkan latar Maleakhi secara eksplisit.
  rationale: Ayat ini hanya melaporkan pertanyaan para murid. Jawaban dan penjelasan Yesus terdapat dalam ayat 11–13, sehingga ketegangan teologisnya perlu dipertahankan di sini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Lalu” menyampaikan καί sebagai kelanjutan narasi; “kepada-Nya” mempertahankan objek αὐτόν. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang harus dijelaskan kepada pembaca pada ayat ini.
