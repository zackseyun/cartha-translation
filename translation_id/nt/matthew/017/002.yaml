  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: id
  text: Dan Ia berubah rupa di hadapan mereka[a]. Wajah-Nya bersinar seperti matahari, dan pakaian-Nya menjadi putih seperti cahaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia mengalami perubahan rupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: rupa-Nya berubah
  rationale: Bentuk pasif aoris ini menyatakan perubahan yang tampak. Ungkapan Indonesia ini alami dalam konteks dan menghindari istilah teknis yang kurang umum, sambil mempertahankan bahwa penampilan-Nya berubah.
- source_word: ἔμπροσθεν αὐτῶν
  choice: di depan mereka
  rationale: Menerjemahkan ungkapan ruang secara langsung dan menyatakan bahwa perubahan itu terjadi di hadapan para murid.
- source_word: ἔλαμψεν
  choice: bersinar
  rationale: Padanan langsung dan alami untuk tindakan memancarkan cahaya.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: Wajah-Nya
  rationale: Dalam konteks ini πρόσωπον menunjuk pada wajah Yesus secara fisik.
- source_word: ὡς ὁ ἥλιος
  choice: seperti matahari
  rationale: Mempertahankan perbandingan eksplisit yang diperkenalkan oleh ὡς.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: pakaian-Nya
  rationale: Padanan umum dan wajar untuk pakaian tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: ἐγένετο λευκὰ
  choice: menjadi putih
  rationale: Menyampaikan perubahan keadaan secara langsung tanpa menambahkan tingkat kecemerlangan yang tidak dinyatakan secara leksikal.
- source_word: ὡς τὸ φῶς
  choice: seperti cahaya
  rationale: Mempertahankan metafora perbandingan dengan cahaya; bahasa Indonesia tidak memerlukan artikel tertentu seperti bahasa Yunani.
theological_decisions:
- issue: Penggambaran peristiwa perubahan rupa Yesus
  choice: rupa-Nya berubah
  alternative: Ia berubah rupa; Ia ditransfigurasikan
  rationale: Pilihan ini menggambarkan perubahan yang terlihat dalam kemuliaan sesuai konteks, tanpa menentukan lebih jauh hakikat perubahan itu. Bentuk pasif Yunani tidak mempunyai padanan pasif yang sama alaminya dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Kalimat Yunani yang berantai dibagi menjadi dua kalimat agar alami dan mudah dibaca tanpa mengubah hubungan gagasannya.
