base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: id
  text: dan berkata, “Tuhan, kasihanilah anak laki-laki saya, karena ia mengalami kejang-kejang[a] dan sangat menderita; sebab ia sering jatuh ke dalam api dan sering ke dalam air.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “terpengaruh bulan”; istilah Yunani ini merupakan ungkapan kuno untuk keadaan yang menyerupai kejang-kejang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan langsung yang penuh hormat kepada Yesus; padanan baku dan wajar untuk κύριος dalam konteks ini.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: kasihanilah anak saya
  rationale: Menyampaikan permohonan belas kasihan secara alami dalam bahasa Indonesia. υἱός berarti anak laki-laki, tetapi dalam kepemilikan bahasa Indonesia, 'anak saya' lebih alami dan konteks pronomina berikutnya menunjukkan laki-laki.
- source_word: σεληνιάζεται
  choice: mengalami kejang-kejang
  rationale: Menggambarkan gejala yang tampak tanpa menetapkan diagnosis medis modern atau mengesahkan anggapan bahwa bulan adalah penyebabnya.
- source_word: κακῶς πάσχει
  choice: sangat menderita
  rationale: Ungkapan Indonesia yang alami dan tetap menyampaikan kuatnya penderitaan yang dinyatakan oleh κακῶς.
- source_word: πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ
  choice: Ia sering jatuh ke dalam api dan juga ke dalam air
  rationale: '''Sering'' berlaku secara alami bagi kedua kejadian; ''juga'' mempertahankan kesejajaran tanpa pengulangan yang kaku, sedangkan γάρ dipahami sebagai penjelasan dari penderitaan yang baru disebutkan.'
- source_word: καὶ λέγων
  choice: dan berkata
  rationale: Menghubungkan ucapan ini dengan tindakan dalam ayat sebelumnya secara wajar dalam narasi bahasa Indonesia.
theological_decisions:
- issue: Makna σεληνιάζεται dalam konteks penyembuhan dan pengusiran roh
  choice: mengalami kejang-kejang
  alternative: menderita epilepsi; terkena pengaruh bulan
  rationale: Ayat ini menyampaikan gambaran sang ayah tentang keadaan anak itu, bukan diagnosis klinis modern. Pilihan ini mempertahankan fenomena yang dilaporkan tanpa menentukan penyebab medis atau teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan permohonan yang mendesak tetapi mudah dipahami. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
