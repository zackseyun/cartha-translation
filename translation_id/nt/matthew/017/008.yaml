  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: id
  text: Ketika mereka mengangkat pandangan, mereka tidak melihat siapa pun selain Yesus seorang diri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάραντες
  choice: Ketika mereka mengangkat
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba utama; bentuk temporal ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan; kesinambungan sudah terasa alami tanpa konjungsi eksplisit dalam bahasa Indonesia.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: mata
  rationale: Ungkapan konkret Yunani dipertahankan; subjek 'mereka' pada klausa sudah menyatakan pemiliknya secara alami.
- source_word: οὐδένα εἶδον
  choice: mereka tidak melihat siapa pun
  rationale: Menyampaikan negasi dan objek personal dengan jelas serta wajar dalam bahasa Indonesia.
- source_word: εἰ μὴ
  choice: selain
  rationale: Sesudah pernyataan negatif, frasa ini menandai pengecualian.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: Yesus seorang diri
  rationale: Ungkapan ini mempertahankan penekanan eksklusif bahwa hanya Yesus yang terlihat, tanpa menghasilkan susunan Indonesia yang kaku atau berlebihan.
theological_decisions:
- issue: Penekanan bahwa Yesus adalah satu-satunya sosok yang masih terlihat
  choice: Yesus seorang diri
  alternative: hanya Yesus; Yesus saja
  rationale: Konstruksi εἰ μὴ + αὐτὸν + μόνον memberi tekanan kumulatif pada eksklusivitas. 'Yesus seorang diri' secara alami menegaskan bahwa Musa dan Elia tidak lagi terlihat, tanpa menambahkan kesimpulan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan temporal dibuat alami, sedangkan ungkapan konkret 'mengangkat mata' dipertahankan.
source_grounding:
  english_pob_role: consult_only
