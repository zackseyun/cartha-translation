  source_fidelity: Revisi diperlukan karena κατ’ ἰδίαν menerangkan tindakan Yesus membawa mereka naik secara terpisah dari orang lain. Pemecahan draf menjadi “Di sana mereka menyendiri” menambahkan penanda tempat “Di sana”, mengubahnya menjadi keadaan sesudah tiba, dan dapat menyiratkan bahwa hanya tiga murid itu yang menyendiri tanpa Yesus. Revisi menempatkan makna tersebut pada tindakan naik gunung. Hubungan Yohanes sebagai saudara Yakobus dipertahankan, dengan bentuk pronominal Yunani dijelaskan dalam catatan kaki.
  naturalness: “Yesus mengajak ... dan membawa mereka naik ke sebuah gunung tinggi, hanya mereka saja” adalah bahasa Indonesia modern yang lancar dan jelas. Bentuk “gunung tinggi” lebih ringkas serta alami daripada “gunung yang tinggi” tanpa kehilangan arti.
  terminology: Nama Petrus, Yakobus, dan Yohanes sesuai pemakaian baku Alkitab bahasa Indonesia. “Mengajak” memadai untuk παραλαμβάνει, sedangkan “membawa mereka naik” menyampaikan ἀναφέρει. Catatan untuk “saudaranya” menjaga bentuk sumber sambil menjelaskan rujukan kontekstualnya.
