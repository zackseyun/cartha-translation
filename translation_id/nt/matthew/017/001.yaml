  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: id
  text: Setelah enam hari, Yesus mengajak Petrus, Yakobus, dan Yohanes, saudaranya[a], dan membawa mereka naik ke sebuah gunung tinggi, hanya mereka saja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saudaranya.” Dalam konteks, ini paling mungkin merujuk kepada Yakobus.'
    reason: source_form_and_pronoun_reference
  - marker: b
    text: 'Atau: “secara tersendiri” atau “secara pribadi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Setelah enam hari
  rationale: Ungkapan μετά dengan bentuk akusatif menyatakan urutan waktu. Terjemahan ini dekat dengan susunan Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: παραλαμβάνει
  choice: mengajak
  rationale: Dalam konteks ini παραλαμβάνω berarti membawa atau mengikutsertakan seseorang bersama diri sendiri. “Mengajak” menyampaikan bahwa Yesus membawa ketiga murid itu menyertai-Nya tanpa pengulangan kata “membawa” yang kaku.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petrus, Yakobus, dan Yohanes
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudara Yakobus
  rationale: Frasa ini merupakan aposisi yang menerangkan Yohanes, dan kata ganti αὐτοῦ paling wajar merujuk kepada Yakobus. Nama Yakobus dinyatakan agar hubungan itu jelas dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀναφέρει
  choice: membawa mereka naik
  rationale: ἀναφέρω di sini menyatakan gerak membawa ke arah atas. Pilihan ini mengungkapkan baik tindakan membawa maupun pendakian menuju gunung.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: ke sebuah gunung yang tinggi
  rationale: εἰς menyatakan tujuan gerak, sedangkan ὄρος ὑψηλόν berarti gunung yang tinggi. Bentuk tak tentu diterjemahkan dengan “sebuah”.
- source_word: κατ’ ἰδίαν
  choice: Di sana mereka menyendiri
  rationale: Ungkapan ini berarti berada secara tersendiri, terpisah dari orang lain. Kalimat tersendiri membuat cakupannya jelas dan menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Kala kini historis dalam narasi Injil
  choice: Tidak menandai kala lampau atau kini secara khusus dalam verba bahasa Indonesia
  alternative: Memakai penanda seperti “kemudian Yesus mengambil” atau gaya kini yang dibuat eksplisit
  rationale: Bahasa Indonesia tidak menginfleksikan verba menurut kala. Bentuk “mengajak” dan “membawa” mempertahankan alur naratif tanpa memaksakan penanda waktu yang tidak terdapat pada verba Indonesia.
- issue: Rujukan kata ganti pada τὸν ἀδελφὸν αὐτοῦ
  choice: Menjelaskan Yohanes sebagai saudara Yakobus
  alternative: “Yohanes, saudaranya”
  rationale: Secara sintaksis dan dalam konteks, αὐτοῦ paling wajar merujuk kepada Yakobus. Terjemahan utama dibuat jelas bagi pembaca Indonesia, sedangkan bentuk yang lebih harfiah dipertahankan dalam catatan kaki agar bentuk sumber tetap terlihat.
translation_notes:
  register: Bahasa yang dipakai modern, lugas, dan bermartabat. “Mengajak” serta “membawa mereka naik” membedakan dua verba Yunani secara alami. Pemecahan bagian terakhir menjadi kalimat pendek menghindari susunan yang kaku, tanpa mengubah urutan peristiwa.
