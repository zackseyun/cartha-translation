id: MAT.17.12
reference: Matthew 17:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: id
  text: Namun, Aku berkata kepadamu bahwa Elia sudah datang, tetapi mereka tidak mengenalinya[a]. Sebaliknya, mereka memperlakukan dia sesuka hati mereka[b]. Demikian juga Anak Manusia akan segera menderita di tangan mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tidak mengetahui siapa dia” atau “tidak mengakuinya.” Kata Yunani di sini dapat menunjuk pada kegagalan mengenali identitas atau perannya dengan tepat.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “melakukan terhadapnya apa saja yang mereka kehendaki” atau “memperlakukan dia sekehendak mereka.” Ungkapan Yunani ini menggambarkan tindakan terhadap dirinya menurut kemauan mereka, tanpa membatasi jenis tindakannya.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “akan menderita.” Bentuk Yunani menyatakan penderitaan Anak Manusia sebagai peristiwa yang akan terjadi dan sedang mengancam.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Namun, Aku berkata kepadamu
  rationale: Bentuk ini mempertahankan pengantar perkataan langsung dan daya kontras δέ dengan konteks sebelumnya, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: ἤδη ἦλθεν
  choice: sudah datang
  rationale: Gabungan adverbia ἤδη dan aoristus ἦλθεν menyatakan kedatangan yang telah terjadi; 'sudah datang' mengungkapkannya secara alami tanpa menambahkan rincian waktu.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: mereka tidak mengenalinya
  rationale: Dalam konteks ini ἐπιγινώσκω menunjuk pada kegagalan mengenali identitas atau perannya, bukan sekadar tidak mengenal secara pribadi.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: mereka berbuat terhadapnya sesuka hati
  rationale: Ungkapan idiomatis ini menyatakan bahwa mereka bertindak terhadap dia menurut kehendak mereka sendiri. Terjemahan ini mempertahankan keluasan tindakan tanpa mempersempitnya pada satu perlakuan tertentu.
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Ungkapan ini secara jelas menandai kesejajaran antara perlakuan terhadap Elia dan penderitaan Anak Manusia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah padanan baku yang mempertahankan fungsi gelar serta gema biblis ungkapan tersebut.
- source_word: μέλλει πάσχειν
  choice: akan segera menderita
  rationale: μέλλω dengan infinitif menunjukkan penderitaan yang akan terjadi dan sudah mendekat. 'Akan segera' mempertahankan unsur keakanan dan kedekatannya tanpa menambahkan gagasan keharusan ilahi yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: ὑπ’ αὐτῶν
  choice: di tangan mereka
  rationale: ὑπό dengan genitif menandai pelaku. Idiom Indonesia ini menyampaikan dengan jelas bahwa merekalah yang menyebabkan penderitaan itu.
theological_decisions:
- issue: Identitas Elia yang sudah datang
  choice: Nama 'Elia' dipertahankan tanpa menyisipkan nama Yohanes Pembaptis ke dalam ayat.
  alternative: Menjelaskan langsung dalam teks bahwa yang dimaksud ialah Yohanes Pembaptis.
  rationale: Konteks berikutnya menjelaskan cara para murid memahami perkataan ini, tetapi ayat ini sendiri menyebut Elia. Terjemahan membiarkan konteks memberikan identifikasi tersebut.
- issue: Daya makna μέλλει dalam penderitaan Anak Manusia
  choice: Diterjemahkan 'akan segera menderita' sebagai peristiwa mendatang yang sudah dekat.
  alternative: Akan menderita; ditakdirkan untuk menderita.
  rationale: Klausa ini menegaskan penderitaan yang akan segera terjadi, tetapi tidak dengan sendirinya memakai rumusan eksplisit tentang keharusan atau penetapan ilahi. Terjemahan tidak memasukkan penegasan teologis yang lebih kuat daripada bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Kapitalisasi 'Aku' mengikuti kebiasaan teks Alkitab bahasa Indonesia untuk perkataan Yesus. Struktur dibuat jelas bagi pembaca umum, sementara ambiguitas pengenalan Elia dan nuansa kedekatan μέλλει tetap dipertahankan.
