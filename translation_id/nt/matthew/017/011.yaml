  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: id
  text: Ia menjawab, “Elia memang akan datang dan akan memulihkan segala sesuatu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani yang dipengaruhi pola Semitis. Dalam bahasa Indonesia alami, “Ia menjawab” mempertahankan daya responsifnya tanpa pengulangan yang tidak perlu seperti “menjawab dan berkata”.
- source_word: Ἠλίας
  choice: Elia
  rationale: Nama pribadi ini memakai bentuk baku yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: μέν
  choice: memang
  rationale: μέν memberi penegasan sekaligus menyiapkan kontras yang berlanjut pada ayat berikutnya. “Memang” menyampaikan kedua fungsi itu secara alami.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Walaupun berbentuk kala kini dalam bahasa Yunani, dalam konteks ini verba tersebut berorientasi ke masa depan. “Akan datang” menyampaikan makna temporalnya dengan jelas dalam bahasa Indonesia.
- source_word: ἀποκαταστήσει
  choice: akan memulihkan
  rationale: Bentuk indikatif futur aktif menunjuk pada tindakan mendatang. “Akan memulihkan” mempertahankan gagasan pemulihan tanpa menentukan secara berlebihan bentuk atau hasilnya.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini luas dan menyeluruh. “Segala sesuatu” mempertahankan cakupannya tanpa menambahkan objek yang tidak disebutkan.
theological_decisions:
- issue: Sifat dan cakupan karya pemulihan Elia
  choice: akan memulihkan segala sesuatu
  alternative: akan membereskan semuanya; akan memulihkan segala sesuatu kepada keadaan semestinya
  rationale: Teks Yunani menyatakan pemulihan secara menyeluruh, tetapi tidak menjelaskan cakupan tepatnya dalam ayat ini. Rumusan luas dipertahankan agar tidak dibatasi menjadi pembaruan rohani, reformasi sosial, atau penyempurnaan eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina “Ia” dipakai untuk Yesus sesuai konteks, sedangkan struktur ringkas mempertahankan ketegasan ucapan Yunani.
