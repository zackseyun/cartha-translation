    issue: οἱ υἱοί diterjemahkan “anak-anak raja.”
    rationale: “Anak-anak” menetralkan bentuk maskulin plural υἱοί, sedangkan teks sumber menyatakan “putra-putra/para putra.” Selain itu, “raja” hanya tersirat dari konteks sebelumnya, bukan dinyatakan dalam ayat ini. Terjemahan perlu mempertahankan “para putra itu.”
  - severity: low
    issue: Catatan kaki menyebut “putra-putra itu bebas” sebagai terjemahan harfiah, padahal teks utama memilih bentuk netral.
    rationale: Setelah teks utama diperbaiki menjadi “para putra itu bebas,” catatan tersebut menjadi berlebihan dan tidak lagi menyediakan alternatif leksikal yang diperlukan.
  revised_text: Ketika Petrus menjawab, “Dari orang lain,” Yesus berkata kepadanya, “Jadi, para putra itu bebas.”
