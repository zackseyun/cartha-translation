  verdict: revise
  source_fidelity: Perlu revisi kecil. οἱ υἱοί secara eksplisit berarti “para putra/anak laki-laki,” bukan “anak-anak” dalam arti netral. Penambahan “raja” dapat dipahami dari konteks sebelumnya, tetapi tidak hadir dalam teks ayat ini dan tidak perlu untuk menerjemahkan frasa Yunani yang ada.
  naturalness: Kalimatnya secara umum alami. “Para putra itu” tetap wajar dalam bahasa Indonesia modern yang bermartabat dan lebih tepat daripada “anak-anak raja” untuk mempertahankan bentuk maskulin sumber.
  terminology: “Dari orang lain,” “Jadi,” dan “bebas” menyampaikan kontras rumah tangga serta kesimpulan dan status bebas dari kewajiban tanpa mempersempitnya hanya menjadi pajak. “Para putra itu” mempertahankan istilah υἱοί dan tidak menambahkan penafsiran teologis.
  issues:
