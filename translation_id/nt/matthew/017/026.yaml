  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: id
  text: Ketika Petrus menjawab, “Dari orang lain,” Yesus berkata kepadanya, “Jadi, para putra itu bebas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Ketika Petrus menjawab
  rationale: Genetif absolut ini merujuk kepada Petrus sebagai penjawab dalam konteks ayat sebelumnya. Nama Petrus dibuat eksplisit agar alurnya alami dalam bahasa Indonesia; verba 'menjawab' sesuai dengan fungsi ujarannya sebagai respons terhadap pertanyaan Yesus.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Dari orang lain
  rationale: ἀλλότριοι menunjuk kepada mereka yang bukan anggota keluarga raja, berlawanan dengan anak-anaknya. 'Orang lain' mempertahankan kontras relasional tanpa memberi kesan etnis yang dapat timbul dari 'orang asing'.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Padanan naratif yang langsung dan wajar untuk φημί dengan objek tidak langsung αὐτῷ.
- source_word: Ἄρα γε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik Yesus dari jawaban Petrus secara ringkas dan alami.
- source_word: ἐλεύθεροί
  choice: bebas
  rationale: Mempertahankan arti luas adjektiva Yunani. Dalam konteks, kebebasan tersebut berarti tidak wajib membayar pajak, tetapi terjemahan tidak mempersempit ungkapan menjadi hanya 'dibebaskan dari pajak'.
- source_word: οἱ υἱοί
  choice: anak-anak raja
  rationale: υἱοί secara harfiah berarti 'anak-anak lelaki', tetapi dalam analogi ini mereka dibedakan dari orang di luar keluarga raja. Penambahan 'raja' yang tersirat oleh konteks sebelumnya memperjelas hubungan tersebut dalam bahasa Indonesia tanpa mengubah acuannya.
theological_decisions:
- issue: Makna kebebasan anak-anak dalam analogi kerajaan dan pajak
  choice: bebas
  alternative: bebas dari kewajiban membayar pajak
  rationale: Teks Yunani hanya menyatakan bahwa anak-anak itu 'bebas'. Konteks mengimplikasikan pembebasan dari pajak, tetapi pilihan yang lebih harfiah mempertahankan kemungkinan gaung teologis yang lebih luas mengenai status sebagai anak.
- issue: Penerjemahan οἱ υἱοί dalam pernyataan representatif
  choice: anak-anak raja
  alternative: putra-putra raja
  rationale: Dalam bahasa Indonesia modern, 'anak-anak raja' merupakan ungkapan alami untuk keturunan raja dan dapat mencakup kategori keluarga yang menjadi inti analogi. Namun, karena bentuk Yunani secara khusus maskulin, alternatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Subjek Petrus dieksplisitkan dari konteks untuk menghindari rujukan pronominal yang kabur. Ungkapan 'orang lain' dipilih daripada 'orang asing' agar kontrasnya tetap menyangkut keanggotaan dalam keluarga raja, bukan kebangsaan.
