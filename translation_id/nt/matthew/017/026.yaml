  rationale: 'Revisi membatasi perubahan pada οἱ υἱοί: “para putra itu” mempertahankan maskulin plural dan artikel definit sumber tanpa menambahkan “raja,” yang tidak tertulis dalam ayat ini. Frasa lain sudah setia pada teks dan alami dalam bahasa Indonesia modern. Catatan kaki dihapus karena hanya mengulang bentuk yang kini digunakan dalam teks utama.'
