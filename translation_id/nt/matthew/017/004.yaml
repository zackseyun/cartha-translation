source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: id
  text: 'Lalu Petrus berkata kepada Yesus, “Tuhan, baik bagi kita berada di sini. Jika Engkau menghendaki, aku akan mendirikan tiga kemah[a] di sini: satu untuk-Mu, satu untuk Musa, dan satu untuk Elia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pondok,” “tabernakel,” atau “tempat berteduh”; kata Yunani σκηνάς menunjuk pada kemah atau naungan sementara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Lalu ... berkata
  rationale: Gabungan partisip ἀποκριθείς dengan εἶπεν merupakan formula pengantar tuturan. Dalam bahasa Indonesia modern, “Lalu ... berkata” menyampaikan perkembangan narasi dan pengantar ucapan secara alami tanpa frasa kaku “menjawab dan berkata”; konteksnya juga tidak memuat pertanyaan langsung.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan sapaan penuh hormat kepada Yesus sekaligus tidak meniadakan bobot teologis yang mungkin terkandung dalam κύριος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: baik sekali kita berada di sini
  rationale: Ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia serta mempertahankan penilaian positif yang kuat tanpa menambahkan penafsiran.
- source_word: εἰ θέλεις
  choice: Jika Engkau menghendaki
  rationale: θέλω dapat menyatakan kehendak atau keinginan. “Menghendaki” sesuai dengan sapaan hormat dalam adegan ini dan tetap mempertahankan bentuk bersyarat.
- source_word: ποιήσω
  choice: aku akan mendirikan
  rationale: Untuk bangunan atau naungan sementara, “mendirikan” lebih alami daripada terjemahan harfiah “membuat” dan tetap menyampaikan tawaran Petrus dalam bentuk orang pertama tunggal.
- source_word: σκηνάς
  choice: tempat berteduh
  rationale: σκηνή menunjuk pada kemah, pondok, atau naungan sementara. “Tempat berteduh” jelas bagi pembaca modern dan tidak dengan sendirinya menetapkan kaitan khusus dengan Hari Raya Pondok Daun.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: satu untuk-Mu, satu untuk Musa, dan satu untuk Elia
  rationale: Pengulangan “satu” mempertahankan penekanan distributif dari μίαν yang diulang dalam teks Yunani.
- source_word: ὧδε
  choice: di sini
  rationale: Kedua kemunculan ὧδε diterjemahkan “di sini” sehingga pengulangan dalam sumber tetap tampak.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: “Tuhan” mempertahankan rentang makna gelar tersebut, termasuk penghormatan dan kemungkinan bobot kristologisnya, sedangkan “Guru” akan mempersempit maknanya.
- issue: Makna σκηνάς dalam konteks transfigurasi
  choice: tempat berteduh
  alternative: kemah; pondok; tabernakel
  rationale: Ayat ini tidak secara eksplisit menghubungkan bangunan tersebut dengan Hari Raya Pondok Daun. Karena itu, teks utama memakai istilah netral, sementara kemungkinan nuansa kemah, pondok, atau tabernakel dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina sapaan ilahi memakai kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan “di sini” dan “satu” yang terdapat dalam teks Yunani.
