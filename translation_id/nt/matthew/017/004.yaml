  naturalness: Susunan dialognya lancar dan register hormatnya sesuai bahasa Indonesia modern. “Baik bagi kita berada di sini” tetap jelas, cukup alami dalam dialog bernuansa tinggi, dan lebih dekat dengan konstruksi Yunani daripada “baik sekali.” “Kemah” merupakan nomina yang lazim dan konkret untuk struktur yang Petrus tawarkan untuk didirikan.
  terminology: “Tuhan” tepat untuk Κύριε. “Kemah” menerjemahkan σκηνάς secara langsung tanpa memaksakan identifikasi dengan Hari Raya Pondok Daun; alternatif “pondok,” “tabernakel,” dan “tempat berteduh” dipertahankan dalam catatan kaki.
