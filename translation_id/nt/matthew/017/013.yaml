  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: id
  text: Kemudian, para murid mengerti bahwa ia telah berbicara kepada mereka tentang Yohanes Pembaptis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yohanes yang membaptis.”
    reason: Alternatif leksikal bagi βαπτιστής yang menonjolkan kegiatan membaptis.
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai saat ketika para murid memahami maksud perkataan sebelumnya dan berfungsi sebagai penghubung naratif yang alami.
- source_word: συνῆκαν
  choice: mengertilah
  rationale: Aoristus συνίημι menyatakan bahwa mereka sampai pada pemahaman; bentuk inversi ini tetap alami dalam narasi Indonesia dan menyoroti terjadinya pengertian itu.
- source_word: οἱ μαθηταὶ
  choice: murid-murid itu
  rationale: Padanan baku bagi para pengikut Yesus yang sudah dikenal dalam konteks.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi yang dipahami para murid, bukan alasan sebab-akibat.
- source_word: περὶ
  choice: tentang
  rationale: Dengan genetif, περί menunjukkan pokok yang dibicarakan.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Yohanes Pembaptis
  rationale: Sebutan yang lazim dan mudah dikenali dalam bahasa Indonesia; secara leksikal βαπτιστής juga dapat dipahami sebagai orang yang membaptis.
- source_word: εἶπεν αὐτοῖς
  choice: ia telah berbicara kepada mereka
  rationale: Aoristus Yunani menyatakan tindakan berbicara, sedangkan 'telah' secara alami menunjukkan bahwa perkataan itu mendahului pemahaman para murid tanpa menambahkan isi yang tidak tersurat.
theological_decisions:
- issue: Identitas sosok Elia dalam konteks langsung
  choice: Ayat ini menyatakan bahwa para murid memahami Yesus sedang berbicara tentang Yohanes Pembaptis.
  alternative: Membiarkan rujukannya tidak disebutkan atau memperluas penjelasan hubungan Yohanes dengan Elia.
  rationale: Narator sendiri menyebut Yohanes Pembaptis sebagai rujukan perkataan Yesus. Terjemahan menyatakannya dengan jelas tanpa mengembangkan implikasi teologis di luar bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Lalu mengertilah murid-murid itu' mempertahankan alur naratif dengan ungkapan yang tetap mudah dipahami; 'ia' tidak dikapitalisasi karena teks Yunani hanya memakai bentuk verba orang ketiga dan identitas Yesus tersedia dari konteks.
