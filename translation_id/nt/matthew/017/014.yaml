  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: id
  text: Ketika mereka sampai kepada orang banyak, seorang laki-laki datang kepada Yesus dan berlutut di hadapannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “menjatuhkan diri berlutut di hadapannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ketika
  rationale: Hubungan dengan kisah sebelumnya tetap tersirat dalam pembukaan kalimat. Bahasa Indonesia tidak memerlukan padanan tersendiri bagi Καὶ sebelum anak kalimat waktu agar alurnya terasa alami.
- source_word: ἐλθόντων πρὸς τὸν ὄχλον
  choice: mereka tiba di tengah kerumunan orang
  rationale: Genitif absolut menyatakan waktu dengan subjek jamak yang dipahami dari konteks. 'Tiba di tengah kerumunan orang' merupakan ungkapan Indonesia yang alami untuk gerakan menuju orang banyak.
- source_word: προσῆλθεν αὐτῷ
  choice: datang kepada Yesus
  rationale: προσέρχομαι menyatakan tindakan mendekat atau datang kepada seseorang. Nama 'Yesus' dipakai untuk memperjelas acuan pronomina tanpa mengubah identitas tokoh dalam konteks.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Dalam konteks ini kata tersebut menunjuk kepada satu orang dewasa berjenis kelamin laki-laki, sehingga padanan ini lebih tepat daripada istilah generik.
- source_word: γονυπετῶν αὐτὸν
  choice: berlutut di hadapannya
  rationale: Partisipel ini menggambarkan sikap tubuh orang itu terhadap Yesus. 'Berlutut di hadapannya' tepat, ringkas, dan tidak menambahkan makna menyembah yang tidak harus dinyatakan oleh kata tersebut.
theological_decisions:
- issue: Apakah tindakan γονυπετῶν harus diterjemahkan sebagai penyembahan
  choice: berlutut di hadapannya
  alternative: menyembahnya
  rationale: Kata Yunani secara langsung menggambarkan tindakan berlutut dan dapat menyiratkan permohonan atau penghormatan. Terjemahan utama mempertahankan tindakan fisiknya tanpa menentukan secara berlebihan makna teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan mudah dipahami. 'Kerumunan orang' dipilih sebagai padanan modern bagi ὄχλος. Pronomina untuk Yesus tidak diberi kapital khusus agar kapitalisasi tidak memuat penafsiran teologis yang tidak terdapat dalam naskah Yunani.
