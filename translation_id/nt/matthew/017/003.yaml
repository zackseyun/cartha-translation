base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: id
  text: Dan lihatlah, Musa dan Elia menampakkan diri kepada mereka dan sedang berbicara dengan dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “terlihat oleh mereka.” Kata kerja Yunani berbentuk pasif, tetapi “menampakkan diri kepada mereka” lebih alami dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian serta memberi kesan mendadak dan hidup, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Bentuk pasif aoris ὁράω secara idiomatis dapat menyatakan bahwa seseorang tampak atau muncul dalam penglihatan. Pilihan ini alami dalam bahasa Indonesia tanpa menentukan lebih jauh hakikat penampakan itu.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif ini menunjuk para saksi yang melihat penampakan; 'kepada mereka' merupakan padanan langsung yang tidak berlebihan.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: συλλαλοῦντες
  choice: sedang berbicara
  rationale: Partisip ini menggambarkan kegiatan berbicara bersama yang sedang berlangsung; 'sedang berbicara' alami dan mempertahankan nilai aspektualnya.
- source_word: μετ’ αὐτοῦ
  choice: dengan dia
  rationale: μετά dengan genitif menyatakan kebersamaan. Pronomina dipertahankan seperti dalam bahasa Yunani; konteks menunjukkan bahwa acuannya ialah Yesus.
theological_decisions:
- issue: Acuan αὐτοῦ
  choice: '''dia'' mengacu kepada Yesus'
  alternative: Mengganti pronomina dengan nama 'Yesus'
  rationale: Konteks langsung peristiwa transfigurasi membuat acuannya jelas. Mempertahankan pronomina menghindari penjelasan tambahan yang tidak terdapat dalam teks Yunani.
- issue: Sifat peristiwa yang dinyatakan oleh ὤφθη
  choice: Musa dan Elia tampak secara kasatmata kepada para murid
  alternative: '''Musa dan Elia terlihat oleh mereka'''
  rationale: Teks menyatakan suatu penampakan yang dapat dilihat, tetapi tidak menjelaskan modus atau hakikat kehadiran mereka. Terjemahan tidak menambahkan penentuan teologis mengenai hal itu.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Lihatlah' mempertahankan seruan pengarah perhatian; susunan kalimat dibuat lancar tanpa menghilangkan pronomina atau menjelaskan hakikat penampakan.
