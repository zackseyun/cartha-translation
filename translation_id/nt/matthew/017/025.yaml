  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: id
  text: Ia menjawab, “Ya.” Ketika ia masuk ke rumah, Yesus lebih dahulu berkata kepadanya, “Bagaimana pendapatmu, Simon? Dari siapakah raja-raja dunia memungut bea[a] atau pajak kepala[b]—dari putra-putra mereka sendiri atau dari orang lain[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cukai.” Kata Yunani ini menunjuk pada pungutan tidak langsung, berbeda dari pajak kepala yang disebut sesudahnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “upeti.” Kata Yunani κῆνσος dapat menunjuk pada pajak perorangan atau pajak upeti.
    reason: lexical_alternative
  - marker: c
    text: Atau “orang-orang luar.” Maksudnya ialah mereka yang bukan anggota keluarga raja, bukan terutama orang asing dari bangsa lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Ya
  rationale: Jawaban afirmatif sederhana; “Ya” merupakan padanan paling alami dalam bahasa Indonesia modern.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Ketika ia masuk ke rumah
  rationale: Partisip akusatif ini mengacu kepada Petrus sebagai objek yang dipahami dari προέφθασεν; klausa waktu menyampaikan susunan Yunani dengan jelas.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: Yesus lebih dahulu berkata kepadanya
  rationale: Ungkapan ini menunjukkan bahwa Yesus mengambil inisiatif dan berbicara sebelum Petrus sempat menyampaikan maksudnya.
- source_word: Τί σοι δοκεῖ
  choice: Bagaimana pendapatmu
  rationale: Ungkapan Indonesia yang alami untuk meminta penilaian Simon.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: raja-raja dunia
  rationale: Mempertahankan cakupan umum γῆ tanpa membatasinya pada suatu negeri tertentu.
- source_word: τέλη
  choice: bea
  rationale: Menunjuk pada pungutan tidak langsung, termasuk bea atau cukai, dan tetap dibedakan dari κῆνσον.
- source_word: κῆνσον
  choice: pajak kepala
  rationale: Menunjuk pada pajak perorangan atau upeti yang dikenakan per kepala; pilihan ini mempertahankan perbedaannya dari τέλη.
- source_word: υἱῶν αὐτῶν
  choice: putra-putra mereka sendiri
  rationale: Mempertahankan arti harfiah “putra” dan kontras kekeluargaan yang penting bagi kelanjutan perumpamaan.
- source_word: ἀλλοτρίων
  choice: orang lain
  rationale: Dalam konteks ini berarti orang yang bukan anggota keluarga raja; “orang lain” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi orang asing berkewarganegaraan lain.
theological_decisions:
- issue: Implikasi teologis dari “putra-putra” dalam perbandingan Yesus
  choice: Mempertahankan bahasa kekeluargaan harfiah “putra-putra mereka sendiri” tanpa menjelaskan implikasi kristologisnya di dalam teks utama.
  alternative: anak-anak mereka sendiri; rakyat mereka
  rationale: Pokok langsungnya ialah bahwa keluarga raja tidak diperlakukan seperti pihak lain dalam hal pajak. Kata “putra-putra” juga menyiapkan implikasi teologis ayat berikutnya tanpa menafsirkannya secara berlebihan di sini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Lebih dahulu berkata kepadanya” menghindari terjemahan harfiah yang janggal atas προέφθασεν, sedangkan “putra-putra” dipertahankan untuk menjaga kontras keluarga dan ketegangan teologis teks.
