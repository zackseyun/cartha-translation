  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: id
  text: Maka ia bangun, membawa Anak itu dan ibu-Nya, lalu masuk ke tanah Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Maka
  rationale: Kata ini menandai kelanjutan alur cerita, bukan pertentangan yang kuat; “Maka” menghubungkan tindakan ini secara alami dengan perintah sebelumnya.
- source_word: ἐγερθεὶς
  choice: pun bangun
  rationale: Partisip aoris pasif ini dipakai secara intransitif dengan arti bangun atau berdiri untuk bertindak; bentuk Indonesia ini alami dan mempertahankan urutan tindakan.
- source_word: παρέλαβε
  choice: membawa
  rationale: Dalam konteks ini παραλαμβάνω berarti mengajak atau membawa serta bersama dirinya; “membawa” paling wajar dalam narasi Indonesia.
- source_word: τὸ παιδίον
  choice: Anak itu
  rationale: παιδίον menunjuk kepada anak yang sudah dikenal dalam konteks. Huruf kapital dipakai sebagai penghormatan karena acuannya adalah Yesus, tanpa menambah gelar kristologis pada teks.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ibu-Nya
  rationale: Kata ganti αὐτοῦ paling alami mengacu kepada Anak itu. Bentuk “ibu-Nya” ringkas dan lazim dalam bahasa Indonesia.
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: εἰσέρχομαι berarti masuk atau pergi ke dalam; “masuk” tepat dan alami bersama frasa tujuan yang mengikutinya.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ke tanah Israel
  rationale: Frasa ini menyatakan wilayah geografis-nasional; “tanah Israel” mempertahankan ungkapan sumber secara wajar tanpa menafsirkannya sebagai batas politik modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada naratif yang bermartabat. Nama “Yusuf” dibuat eksplisit untuk menghindari kekaburan subjek yang terasa tidak alami dalam ayat mandiri; acuannya jelas dari konteks Yunani sebelumnya. Tidak diperlukan catatan kaki.
