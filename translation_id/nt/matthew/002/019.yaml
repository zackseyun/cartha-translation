id: MAT.2.19
reference: Matthew 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: id
  text: Namun, setelah Herodes meninggal, lihatlah, seorang malaikat Tuhan[a] menampakkan diri dalam mimpi kepada Yusuf ketika ia berada di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malaikat Tuhan itu.” Bahasa Yunani tidak memakai kata sandang di depan “malaikat.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: setelah Herodes meninggal
  rationale: Partisip aoris dalam konstruksi genitif absolut menyatakan waktu yang mendahului peristiwa utama; bentuk ini alami dalam bahasa Indonesia dan tetap menunjukkan urutan kejadian.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan sedikit nuansa kontras terhadap ancaman Herodes dalam bagian sebelumnya.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang hidup dan bernada sastra dalam narasi Matius.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: ἄγγελος tidak memakai artikel, sehingga bentuk tak tentu paling langsung; konstruksi kepunyaan κυρίου diterjemahkan secara idiomatis sebagai 'Tuhan'.
- source_word: φαίνεται
  choice: menampakkan diri
  rationale: Bentuk kini historis mempertahankan kejelasan dan daya hidup narasi; verba medio-pasif ini secara idiomatis berarti tampil atau menampakkan diri.
- source_word: κατ’ ὄναρ
  choice: dalam mimpi
  rationale: Ungkapan khas Matius untuk penyataan yang diterima melalui mimpi.
- source_word: τῷ Ἰωσὴφ
  choice: kepada Yusuf
  rationale: Dativus menyatakan orang yang mengalami penampakan; 'Yusuf' adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἐν Αἰγύπτῳ
  choice: di Mesir
  rationale: Frasa lokatif yang menunjukkan tempat Yusuf berada.
theological_decisions:
- issue: Pemaknaan κύριος dalam ἄγγελος κυρίου
  choice: Tuhan
  alternative: tuan
  rationale: Dalam konteks formula ini, κύριος menunjuk kepada Allah; 'Tuhan' merupakan padanan baku dan wajar tanpa menambahkan kekhususan denominasi.
- issue: Ketaktentuan ἄγγελος tanpa artikel
  choice: seorang malaikat Tuhan
  alternative: malaikat Tuhan itu
  rationale: Ketiadaan artikel paling wajar dipertahankan dengan 'seorang'. Namun, bahasa Yunani tanpa artikel tidak selalu meniadakan kekhususan, sehingga alternatif tradisional dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Kala kini historis φαίνεται
  choice: menampakkan diri
  alternative: menampakkan diri kala itu
  rationale: Bahasa Indonesia tidak menandai kala secara morfologis, sehingga bentuk yang sama dapat mempertahankan kehadiran naratif verba kini Yunani tanpa harus menambahkan penanda lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-sastra. 'Lihatlah' mempertahankan daya retoris ἰδού, sedangkan 'menampakkan diri' lebih alami dan tepat daripada terjemahan harfiah pasif. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
