  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: id
  text: Mereka berkata kepadanya, “Di Betlehem di Yudea, sebab demikianlah telah tertulis melalui nabi:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka
  rationale: Artikel yang dipakai secara substantival menunjuk kembali kepada para imam kepala dan ahli Taurat pada ayat sebelumnya. Partikel δέ berfungsi sebagai penghubung ringan dan tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia.
- source_word: εἶπαν αὐτῷ
  choice: berkata kepadanya
  rationale: Menerjemahkan secara langsung verba λέγω dengan objek tak langsung αὐτῷ tanpa menambahkan gagasan bahwa mereka sekadar memberi tahu atau menjawab.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Di Betlehem di Yudea
  rationale: Ungkapan genitif mengidentifikasi Betlehem yang dimaksud sebagai Betlehem di wilayah Yudea. Bentuk ini lebih alami dalam bahasa Indonesia daripada 'Betlehem dari Yudea'.
- source_word: οὕτως γὰρ
  choice: sebab beginilah
  rationale: γάρ memperkenalkan dasar jawaban mereka, sedangkan οὕτως menunjuk ke depan kepada kutipan nubuat yang menyusul.
- source_word: γέγραπται
  choice: yang telah tertulis
  rationale: Bentuk perfek pasif dipertahankan dengan 'telah tertulis', yang menyatakan bahwa tulisan itu dibuat pada masa lampau dan tetap berlaku sebagai teks tertulis.
- source_word: διὰ τοῦ προφήτου
  choice: melalui nabi
  rationale: διά dengan genitif menyatakan perantaraan; 'melalui nabi' mempertahankan nabi sebagai penyampai nubuat tanpa menentukan secara eksplisit pelaku utama yang tersirat.
theological_decisions:
- issue: Perantaraan dalam penyampaian nubuat
  choice: melalui nabi
  alternative: oleh nabi
  rationale: '''Melalui nabi'' mempertahankan nuansa perantaraan dari διά + genitif dan tidak meratakan hubungan antara sumber ilahi dan penyampai manusia.'
- issue: Daya berlaku teks Kitab Suci
  choice: yang telah tertulis
  alternative: yang tertulis
  rationale: Pilihan ini mencerminkan aspek perfek Yunani—telah ditulis dan tetap berada dalam keadaan tertulis—tanpa menambahkan klaim teologis di luar bentuk gramatikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan jawaban langsung serta alasan berdasarkan nubuat sebagai satu rangkaian kutipan; tanda titik dua menyiapkan kutipan nubuat pada ayat berikutnya.
