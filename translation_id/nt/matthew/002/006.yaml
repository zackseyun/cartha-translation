id: MAT.2.6
reference: Matthew 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: id
  text: Dan engkau, Betlehem, tanah Yehuda, sama sekali bukanlah yang terkecil di antara para penguasa Yehuda; sebab dari engkau akan muncul[a] seorang pemimpin yang akan menggembalakan[b] umat-Ku, Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan keluar”.
    reason: lexical_alternative
  - marker: b
    text: “Menggembalakan” juga dapat mengandung arti “memerintah”, sehingga citra kepemimpinan kerajaan tetap berdampingan dengan pemeliharaan seorang gembala.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: tanah
  rationale: Dalam aposisi dengan Betlehem dan diikuti genitif Yehuda, kata ini menunjuk pada wilayah yang terkait dengan Yehuda. “Tanah Yehuda” alami dalam bahasa Indonesia dan mempertahankan nuansa geografis.
- source_word: οὐδαμῶς
  choice: sama sekali bukanlah
  rationale: Ungkapan ini mempertahankan penyangkalan yang sangat tegas, bukan sekadar “bukan”.
- source_word: ἐλαχίστη
  choice: yang terkecil
  rationale: Bentuk superlatif ini menyatakan kedudukan atau arti penting yang paling rendah; “yang terkecil” mempertahankan citra ukuran sekaligus memungkinkan makna status dalam konteks.
- source_word: ἡγεμόσιν
  choice: para penguasa
  rationale: Bentuk jamak ini menunjuk kepada pihak-pihak yang memerintah di Yehuda. “Para penguasa” mempertahankan arti pemerintahan tanpa membatasi pada jabatan politik tertentu.
- source_word: ἐξελεύσεται
  choice: akan muncul
  rationale: Bentuk mendatang dari ἐξέρχομαι secara harfiah berarti keluar atau pergi keluar. Dalam konteks asal seorang pemimpin dari Betlehem, “akan muncul” menyampaikan maksudnya secara alami; arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἡγούμενος
  choice: seorang pemimpin
  rationale: Partisip substantival ini menyatakan seseorang yang memimpin atau memerintah. “Seorang pemimpin” alami dan tidak menentukan secara berlebihan bentuk jabatan politiknya.
- source_word: ποιμανεῖ
  choice: akan menggembalakan
  rationale: Kata ini secara harfiah menggambarkan pekerjaan seorang gembala dan secara metaforis juga dapat berarti memerintah. Terjemahan ini mempertahankan citra penggembalaan yang penting.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: umat-Ku, Israel
  rationale: Pilihan ini mempertahankan ungkapan perjanjian “umat-Ku” dan hubungan aposisional Israel secara jelas dan ringkas.
theological_decisions:
- issue: Nuansa kerajaan dan pastoral dalam gambaran tentang tokoh yang akan datang
  choice: Mempertahankan kedua dimensi dengan menerjemahkan ἡγούμενος sebagai “seorang pemimpin” dan ποιμανεῖ sebagai “akan menggembalakan”.
  alternative: Menerjemahkan keduanya sepenuhnya dengan bahasa politik (“penguasa” dan “akan memerintah”) atau sepenuhnya dengan bahasa pastoral.
  rationale: Ayat ini memadukan kepemimpinan pemerintahan dengan citra penggembalaan. Mempertahankan keduanya menghindari penyempitan makna hanya kepada kekuasaan politik atau hanya kepada pemeliharaan pastoral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kutipan dipertahankan dekat dengan bahasa Yunani, sedangkan “akan muncul” dipilih agar ungkapan asal dari Betlehem terdengar alami. Kapital pada “-Ku” mengikuti kaidah umum penulisan rujukan kepada Allah dalam penerbitan Alkitab bahasa Indonesia.
