id: MAT.2.18
reference: Matthew 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: id
  text: '“Di Rama terdengar suatu suara: tangisan dan ratapan yang hebat. Rahel menangisi anak-anaknya dan tidak mau dihibur,[a] karena mereka sudah tiada.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menolak untuk dihibur.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “karena mereka tidak ada.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: Di Rama terdengar suatu suara
  rationale: Mempertahankan susunan laporan pasif dan lokasi dalam teks Yunani. ‘Suara’ menjaga nada profetis dan personifikasi kutipan.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: tangisan dan ratapan yang hebat
  rationale: Membedakan dua istilah dukacita yang berdekatan; ‘yang hebat’ menyampaikan daya penguat πολύς secara alami.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Rahel menangisi anak-anaknya
  rationale: Partisip kini diterjemahkan sebagai tindakan yang berlangsung dalam ungkapan Indonesia yang wajar; τέκνα bersifat umum dan tidak dibatasi pada anak laki-laki.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: tidak mau dihibur
  rationale: Dekat dengan arti θέλω, yaitu tidak menghendaki atau tidak mau, tanpa memperkuatnya menjadi penolakan eksplisit.
- source_word: ὅτι οὐκ εἰσίν
  choice: karena mereka sudah tiada
  rationale: Menyampaikan idiom kehilangan secara alami sambil mempertahankan ketidaklangsungan ungkapan Yunani yang tidak secara eksplisit mengatakan ‘mati’.
theological_decisions:
- issue: Hakikat tokoh Rahel dalam kutipan nubuat
  choice: Mempertahankan Rahel sebagai figur ibu dalam kutipan tanpa menjelaskan simbolismenya di teks utama.
  alternative: Menafsirkan Rahel secara eksplisit sebagai lambang para ibu Israel atau sebagai ibu historis yang berbicara secara harfiah.
  rationale: Teks Yunani hanya menyajikan kutipan tersebut; terjemahan tidak seharusnya menuntaskan hubungan tipologis atau simbolis yang dibiarkan tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Tanda baca membentuk kutipan puitis yang jelas tanpa menambahkan penafsiran denominasi.
