  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur utama Yunani: lokasi Rama, suara yang terdengar, tangisan dan ratapan besar, Rahel yang menangisi anak-anaknya, keengganannya untuk dihibur, serta alasan idiomatis bahwa mereka “sudah tiada.” Terjemahan tidak menambahkan keterangan bahwa anak-anak itu mati dan dengan demikian mempertahankan ketidaklangsungan οὐκ εἰσίν.'
  naturalness: Bahasa Indonesia baku, modern, dan cukup khidmat. “Di Rama terdengar suatu suara” serta “Rahel menangisi anak-anaknya” terdengar wajar dalam register kutipan kenabian. “Ratapan yang hebat” dapat dipahami secara alami sebagai ratapan yang besar atau dahsyat.
  terminology: “Rahel” adalah bentuk nama yang lazim dalam Alkitab Indonesia. “Anak-anaknya,” “dihibur,” dan “sudah tiada” akurat serta sesuai register. Catatan [a] memberi alternatif yang sah untuk οὐκ ἤθελεν tanpa menjadikannya pilihan teks utama; catatan [b] dengan tepat menjelaskan bentuk harfiah alasan Yunani.
