  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: id
  text: Ketika melihat bintang itu, mereka bersukacita dengan sukacita yang sangat besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Yunani, “mereka bersukacita dengan sukacita yang besar, sangat”; ini adalah ungkapan yang sangat menekankan sukacita mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika melihat
  rationale: Partisip aoris dari ὁράω berfungsi secara temporal dalam kaitannya dengan verba utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan partisipial tanpa menambahkan subjek yang sudah jelas dari konteks.
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: δέ merupakan penghubung naratif ringan. Dalam bahasa Indonesia, peralihan ini sudah tersampaikan secara alami tanpa konjungsi; menerjemahkannya sebagai 'dan' justru dapat terasa kaku.
- source_word: τὸν ἀστέρα
  choice: bintang itu
  rationale: ἀστήρ berarti 'bintang', dan artikelnya menunjuk kepada bintang tertentu yang telah disebutkan sebelumnya.
- source_word: ἐχάρησαν
  choice: mereka bersukacita
  rationale: Bentuk aoris ini bermakna aktif secara idiomatis. 'Bersukacita' mempertahankan daya verbal dan ragam yang bermartabat.
- source_word: χαρὰν μεγάλην
  choice: dengan sukacita yang besar
  rationale: Akusatif serumpun ini memperkuat verba χαίρω. Terjemahan tersebut sengaja mempertahankan pengulangan akar makna 'sukacita' dan intensitas konstruksi Yunani.
- source_word: σφόδρα
  choice: sangat
  rationale: Adverbia ini memperkuat seluruh ungkapan sukacita. Penempatannya sebelum 'bersukacita' menghasilkan bahasa Indonesia yang alami sambil tetap menyampaikan penekanan kuat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan 'bersukacita dengan sukacita' dipertahankan karena merupakan unsur retoris penting dalam sumber Yunani, sedangkan 'sangat' ditempatkan secara idiomatis agar kalimat tetap mudah dipahami.
