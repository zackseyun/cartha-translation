id: MAT.2.14
reference: Matthew 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: id
  text: Maka ia bangun, membawa anak itu dan ibunya pada malam hari, lalu berangkat ke Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Maka
  rationale: Kata penghubung ringan ini melanjutkan alur sekaligus menunjukkan tindakan sebagai tanggapan terhadap perintah sebelumnya.
- source_word: ἐγερθεὶς
  choice: ia bangun
  rationale: Partisip aoris ini menyatakan tindakan awal yang segera diikuti tindakan utama; bentuk ini alami dalam narasi Indonesia.
- source_word: παρέλαβε
  choice: membawa
  rationale: Dalam konteks ini παραλαμβάνω berarti membawa seseorang bersama diri sendiri, bukan sekadar menerima.
- source_word: τὸ παιδίον
  choice: anak itu
  rationale: Padanan langsung dan wajar bagi παιδίον tanpa menambahkan penekanan usia yang tidak diperlukan.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ibunya
  rationale: Pronomina Yunani secara alami merujuk kepada anak itu. Bentuk 'ibunya' ringkas dan jelas dalam urutan kalimat ini.
- source_word: νυκτὸς
  choice: pada malam hari
  rationale: Genitif waktu ini menunjukkan bahwa tindakan tersebut berlangsung pada waktu malam; terjemahan ini jelas dan tidak secara berlebihan menetapkan malam tertentu.
- source_word: ἀνεχώρησεν
  choice: berangkat
  rationale: ἀναχωρέω di sini menyatakan kepergian menuju tempat lain. 'Berangkat' menyampaikan gerak yang disengaja secara alami tanpa menambahkan motif yang tidak dinyatakan dalam ayat ini.
- source_word: εἰς Αἴγυπτον
  choice: ke Mesir
  rationale: εἰς menandai arah atau tujuan gerak; 'ke Mesir' merupakan padanan Indonesia yang langsung dan idiomatis.
theological_decisions:
- issue: Rujukan subjek tersirat pada ἐγερθεὶς dan ἀνεχώρησεν
  choice: ia
  alternative: Yusuf
  rationale: Teks Yunani tidak mengulang nama Yusuf dalam ayat ini. Pronomina 'ia' mempertahankan kesinambungan dengan konteks tanpa menambahkan nama yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur tindakan berurutan dipertahankan dengan 'Maka' dan 'lalu'. Tidak digunakan catatan kaki karena alternatif bahasa Inggris 'to Egypt' sudah terwakili langsung oleh 'ke Mesir', sedangkan penanda catatan kaki pada lapisan konsultasi Inggris tampaknya tidak selaras dengan isi catatannya.
