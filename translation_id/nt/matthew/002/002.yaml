  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: id
  text: Mereka berkata, “Di manakah Dia yang telah lahir sebagai Raja orang Yahudi? Sebab kami telah melihat bintang-Nya di timur[a] dan datang untuk bersujud kepada-Nya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika bintang-Nya terbit.” Frasa Yunani ini dapat berarti “di timur” atau menunjuk pada saat bintang itu terbit.
    reason: alternative_reading
  - marker: b
    text: Atau “menyembah-Nya.” Kata kerja Yunani ini dapat berarti bersujud sebagai penghormatan kepada seorang raja ataupun menyembah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Mereka bertanya
  rationale: Partisipel ini memperkenalkan perkataan langsung. Karena isi perkataan berupa pertanyaan, ‘Mereka bertanya’ merupakan ungkapan naratif yang alami dalam bahasa Indonesia.
- source_word: Ποῦ ἐστιν
  choice: Di manakah
  rationale: Menyampaikan pertanyaan lokatif secara langsung dan wajar.
- source_word: ὁ τεχθεὶς
  choice: Dia yang telah lahir
  rationale: Mempertahankan fungsi substantival partisipel pasif dan fokus pada kelahiran, tanpa menambahkan gagasan bahwa anak itu baru saja lahir.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: sebagai Raja orang Yahudi
  rationale: Ungkapan ‘lahir sebagai Raja’ secara alami menyampaikan bahwa gelar raja melekat pada-Nya sejak lahir, sambil mempertahankan daya politis dan mesianis frasa Yunani.
- source_word: εἴδομεν γὰρ
  choice: Sebab kami telah melihat
  rationale: γάρ memberi alasan bagi pertanyaan mereka. Bentuk perfektif Indonesia ‘telah melihat’ cocok dalam ujaran langsung karena penglihatan itu telah terjadi dan tetap relevan bagi kedatangan mereka.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: bintang-Nya
  rationale: Menyampaikan genitif posesif secara ringkas tanpa menentukan hakikat tanda astronomis tersebut.
- source_word: ἐν τῇ ἀνατολῇ
  choice: di timur
  rationale: Ini adalah pembacaan geografis yang wajar dan tradisional; kemungkinan makna astronomis ‘ketika terbit’ dipertahankan dalam catatan kaki.
- source_word: ἤλθομεν
  choice: datang
  rationale: Dalam koordinasi setelah ‘kami telah melihat’, bentuk ini secara alami menyatakan kedatangan yang sudah terlaksana dan menghasilkan keberadaan mereka di tempat itu sekarang.
- source_word: προσκυνῆσαι αὐτῷ
  choice: untuk sujud menghormati-Nya
  rationale: ‘Sujud menghormati’ mempertahankan unsur gerak tubuh dan penghormatan kepada raja, tanpa membatasi kata itu hanya pada penghormatan politis atau secara dini menetapkannya sebagai penyembahan ilahi.
theological_decisions:
- issue: Makna προσκυνῆσαι terhadap Yesus yang masih kanak-kanak
  choice: untuk sujud menghormati-Nya
  alternative: untuk menyembah-Nya
  rationale: Dalam konteks langsung, orang-orang itu mencari ‘Raja orang Yahudi’, sehingga penghormatan kerajaan menonjol. Namun verba Yunani juga dapat berarti penyembahan; catatan kaki mempertahankan bobot kristologis dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Semua penanda catatan kaki ditempatkan tepat sesudah frasa terkait.
