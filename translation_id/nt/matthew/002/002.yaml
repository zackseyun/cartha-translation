  naturalness: “Mereka berkata” diikuti pertanyaan langsung sangat alami dalam narasi Indonesia baku. “Bersujud kepada-Nya” lebih lazim dan lebih langsung daripada “sujud menghormati-Nya,” sambil tetap menyatakan tindakan penghormatan tanpa memutuskan apakah konteksnya penghormatan kerajaan atau penyembahan.
  terminology: “Raja orang Yahudi” mempertahankan gelar sumber. “Bersujud kepada-Nya” menjaga rentang makna προσκυνέω; catatan kaki “menyembah-Nya” dengan tepat memelihara alternatif leksikal. Kapitalisasi pronomina dan gelar konsisten dengan kebiasaan Alkitab Indonesia dan tidak mengubah makna sumber.
