  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: id
  text: Ketika Raja Herodes mendengar hal itu, ia menjadi gelisah, dan seluruh Yerusalem juga gelisah bersama dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seluruh Yerusalem” memakai nama kota untuk mengacu kepada penduduknya secara kolektif; ungkapan ini dapat merupakan generalisasi atau hiperbola tentang kegelisahan yang meluas di kota itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ... mendengar hal itu
  rationale: Partisip aoristus ini berfungsi secara temporal. Klausa dengan “ketika” alami dalam bahasa Indonesia, sedangkan “hal itu” menyatakan objek yang tersirat dari konteks langsung, yaitu kabar yang disampaikan orang-orang Majus.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan atau peralihan; dalam susunan ini fungsinya sudah terwakili secara alami oleh klausa temporal “ketika”.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Raja Herodes
  rationale: Bentuk ini merupakan susunan gelar dan nama yang wajar dalam bahasa Indonesia serta mempertahankan gelar βασιλεύς.
- source_word: ἐταράχθη
  choice: menjadi gelisah
  rationale: Kata ini menyatakan gangguan batin, keguncangan, atau rasa cemas. “Menjadi gelisah” alami dan cukup kuat tanpa menetapkan sebab atau kadar emosi secara berlebihan.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: seluruh Yerusalem
  rationale: Terjemahan ini mempertahankan metonimia bahasa Yunani, yaitu nama kota yang mengacu secara kolektif kepada penduduknya, tanpa mempersempitnya hanya kepada kelompok tertentu.
- source_word: μετ’ αὐτοῦ
  choice: demikian juga ...
  rationale: Ungkapan ini menyampaikan bahwa seluruh Yerusalem turut mengalami kegelisahan bersama Herodes. Susunan “demikian juga” lebih alami daripada “bersama dengannya” dalam konteks emosi bahasa Indonesia.
theological_decisions:
- issue: Cakupan πᾶσα Ἱεροσόλυμα
  choice: Mempertahankan ungkapan kolektif “seluruh Yerusalem”
  alternative: “seluruh penduduk Yerusalem,” “banyak orang di Yerusalem,” atau khususnya kalangan pemimpin Yerusalem
  rationale: Teks Yunani menyebut kota itu secara keseluruhan melalui metonimia dan mungkin menggunakan generalisasi atau hiperbola. Terjemahan utama tidak mempersempit cakupannya kepada para pemimpin maupun mengubahnya menjadi klaim statistik tentang setiap penduduk.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur naratif Yunani dengan idiom Indonesia yang alami. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
