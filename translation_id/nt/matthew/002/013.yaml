id: MAT.2.13
reference: Matthew 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: id
  text: Setelah mereka pergi, tampaklah seorang malaikat Tuhan kepada Yusuf dalam mimpi dan berkata, “Bangunlah, bawalah anak itu beserta ibunya dan larilah ke Mesir. Tinggallah di sana sampai aku memberitahumu, sebab Herodes akan segera mencari anak itu untuk membinasakannya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk membunuhnya.” Kata Yunani yang diterjemahkan “membinasakannya” di sini berarti menyebabkan kematiannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Setelah mereka pergi
  rationale: Konstruksi genitif absolut menandai tindakan yang telah terjadi lebih dahulu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya; ‘mereka’ merujuk kepada para pengunjung dalam konteks sebelumnya.
- source_word: ἰδοὺ … φαίνεται
  choice: tampaklah
  rationale: Bentuk dengan partikel -lah mempertahankan nuansa naratif yang hidup dan kemunculan mendadak yang ditandai ἰδοὺ, sekaligus menerjemahkan φαίνεται secara wajar tanpa ungkapan kaku ‘lihatlah … tampak’.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: ἄγγελος tidak memakai kata sandang, sehingga ‘seorang malaikat’ sesuai dalam bahasa Indonesia. κύριος dipertahankan sebagai gelar ‘Tuhan’ tanpa mempersempit identitas malaikat itu.
- source_word: κατ’ ὄναρ
  choice: dalam mimpi
  rationale: Ini adalah ungkapan idiomatis yang berarti penampakan melalui mimpi, bukan sekadar sesuatu yang terjadi saat tidur.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Bangunlah, bawalah
  rationale: Walaupun Ἐγερθεὶς secara bentuk adalah partisip, dalam rangkaian perintah ini berfungsi sebagai suruhan. παράλαβε berarti membawa serta atau mengambil bersama diri sendiri.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: anak itu beserta ibunya
  rationale: Pilihan ini jelas, alami, dan mempertahankan cara teks menempatkan anak itu lebih dahulu serta menyebut Maria melalui hubungannya dengan anak tersebut.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: larilah ke Mesir
  rationale: φεῦγε menyatakan pelarian dari bahaya dengan desakan kuat; ‘larilah’ mempertahankan daya perintah tersebut.
- source_word: ἴσθι ἐκεῖ
  choice: Tinggallah di sana
  rationale: Secara harfiah berarti ‘beradalah di sana’, tetapi dalam konteks ini menunjuk pada keberadaan yang berlanjut, sehingga ‘tinggallah’ lebih alami.
- source_word: ἕως ἂν εἴπω σοι
  choice: sampai aku memberitahumu
  rationale: Konstruksi ini menyatakan batas waktu yang bergantung pada pemberitahuan pada masa mendatang.
- source_word: μέλλει … ζητεῖν
  choice: akan segera mencari
  rationale: μέλλει menyatakan tindakan yang akan atau hampir dilakukan; ‘akan segera’ menjaga unsur kemendesakan tanpa menambahkan kepastian di luar konteks.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: untuk membinasakannya
  rationale: ἀπόλλυμι berarti membinasakan atau menyebabkan kematian. ‘Membinasakan’ mempertahankan keluasan leksikal kata Yunani, sedangkan catatan menjelaskan maknanya dalam konteks ini.
theological_decisions:
- issue: Makna κύριος dalam ἄγγελος κυρίου
  choice: Tuhan
  alternative: tuan
  rationale: Dalam ungkapan Alkitabiah ini κύριος secara wajar menunjuk kepada Tuhan. Terjemahan ‘Tuhan’ mempertahankan gelar tersebut tanpa menyatakan bahwa malaikat itu sendiri adalah Tuhan.
- issue: Kapitalisasi kata ganti yang merujuk kepada anak dan malaikat
  choice: 'Huruf kecil: ‘ibunya’, ‘aku’, ‘memberitahumu’, ‘membinasakannya’'
  alternative: 'Kapitalisasi penghormatan: ‘ibu-Nya’, ‘Aku’, ‘memberitahumu’, ‘membinasakan-Nya’'
  rationale: Teks Yunani tidak mengodekan kapitalisasi penghormatan. Huruf kecil menghindari pemasukan kebiasaan konfesional, sementara identitas rujukannya tetap jelas dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang khidmat. Partikel -lah mempertahankan daya naratif serta rangkaian perintah tanpa terasa kuno. Tanda [a] ditempatkan langsung setelah klausa yang dijelaskannya.
