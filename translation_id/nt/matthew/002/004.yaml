id: MAT.2.4
reference: Matthew 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: id
  text: Lalu, setelah mengumpulkan semua imam kepala dan ahli Taurat bangsa itu, ia menanyakan kepada mereka di mana Mesias[a] akan dilahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini untuk mempertahankan konteks pengharapan mesianik Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: setelah mengumpulkan
  rationale: Partisip aoristus ini menunjukkan tindakan yang mendahului verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakannya.
- source_word: πάντας
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari kata Yunani tanpa penambahan.
- source_word: ἀρχιερεῖς
  choice: imam kepala
  rationale: Merujuk pada kalangan pemimpin imam, bukan pada beberapa orang yang masing-masing menjabat sebagai imam besar.
- source_word: γραμματεῖς
  choice: ahli Taurat
  rationale: Padanan Indonesia yang lazim dan jelas untuk para pakar serta penafsir hukum keagamaan Yahudi.
- source_word: τοῦ λαοῦ
  choice: bangsa itu
  rationale: Mempertahankan rujukan kontekstual kepada bangsa tersebut tanpa menambahkan kata 'Yahudi' yang tidak dinyatakan secara eksplisit di sini.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: ia menanyakan kepada mereka
  rationale: Mengungkapkan tindakan bertanya dalam aspek belum tuntas dari bentuk imperfek, tanpa melebih-lebihkannya sebagai pertanyaan yang terus-menerus.
- source_word: ποῦ
  choice: di mana
  rationale: Padanan langsung bagi adverbia interogatif tempat.
- source_word: ὁ χριστὸς
  choice: Mesias
  rationale: Dalam konteks ini Χριστός berfungsi sebagai gelar bagi penguasa terurapi yang dinantikan dalam nubuat Yahudi.
- source_word: γεννᾶται
  choice: akan dilahirkan
  rationale: Bentuk kini pasif dalam pertanyaan tentang tempat kelahiran tokoh yang dinantikan secara alami menyatakan orientasi masa depan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Herodes menanyakan penguasa terurapi yang diharapkan berdasarkan nubuat Yahudi; karena itu, 'Mesias' mempertahankan konteks pengharapan Yahudi dan fungsi istilah tersebut sebagai gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan, keluasan kata 'semua', serta nuansa pertanyaan tidak langsung.
source_grounding:
  english_pob_role: consult_only
