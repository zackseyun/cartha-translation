id: MAT.2.1
reference: Matthew 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: id
  text: Setelah Yesus lahir di Betlehem di Yudea pada zaman Raja Herodes, lihatlah, orang-orang majus[a] dari timur tiba di Yerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini menunjuk kepada kaum terpelajar dari Timur, yang mungkin berkaitan dengan astrologi atau kebijaksanaan istana.
    reason: Menjelaskan makna budaya μάγοι tanpa memasukkan anggapan kemudian bahwa mereka adalah raja atau berjumlah tiga.
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Setelah Yesus lahir
  rationale: Konstruksi genitif absolut memberi latar waktu yang mendahului tindakan utama. “Setelah Yesus lahir” menyampaikan urutan itu secara alami; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan dengan kata tersendiri.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betlehem di Yudea
  rationale: Bentuk ini alami dalam bahasa Indonesia dan membedakan Betlehem tersebut berdasarkan wilayahnya.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: pada zaman Raja Herodes
  rationale: Ungkapan ini menempatkan peristiwa dalam masa pemerintahan Herodes dengan bahasa Indonesia yang ringkas dan wajar.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Kata ini mempertahankan fungsi penarik perhatian dan daya naratif penanda Yunani tersebut.
- source_word: μάγοι
  choice: orang-orang majus
  rationale: “Majus” merupakan istilah Indonesia yang dikenal untuk kaum terpelajar dari Timur ini dan lebih dekat dengan istilah Yunani daripada sebutan umum “orang-orang bijak”; catatan kaki menjelaskan cakupan maknanya tanpa memasukkan tradisi bahwa mereka raja atau berjumlah tiga.
- source_word: ἀπὸ ἀνατολῶν
  choice: dari timur
  rationale: Walaupun bentuk Yunaninya jamak, ungkapan kolektif “dari timur” adalah padanan Indonesia yang alami dan mempertahankan ketidakpastian mengenai daerah asal mereka.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: tiba di Yerusalem
  rationale: Kata kerja tersebut menyatakan kedatangan, dan gabungan “tiba di” merupakan bentuk idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Menerjemahkan μάγοι tanpa memasukkan tradisi kemudian
  choice: orang-orang majus
  alternative: orang-orang bijak; ahli-ahli perbintangan
  rationale: Istilah sumber menunjuk kepada tokoh-tokoh terpelajar dari Timur yang mungkin terkait dengan astrologi atau kebijaksanaan istana. “Orang-orang majus” tidak menyebut mereka sebagai raja, tidak menentukan jumlah mereka, dan tidak mempersempit peran mereka secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif luhur. “Lihatlah” sengaja dipertahankan sebagai penarik perhatian yang menonjol. Tanda koma terakhir mengikuti struktur ayat yang berlanjut ke ucapan pada ayat berikutnya.
