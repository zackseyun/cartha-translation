id: MAT.2.16
reference: Matthew 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: id
  text: Kemudian, ketika Herodes menyadari bahwa ia telah diperdaya[a] oleh orang-orang majus[b], ia menjadi sangat marah. Ia mengutus orang untuk membunuh semua anak laki-laki di Betlehem dan di seluruh daerah sekitarnya yang berumur dua tahun ke bawah, sesuai dengan waktu yang telah ia pastikan dari orang-orang majus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “telah dipermainkan” atau “telah diperolok.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “orang-orang bijak.” Istilah Yunani magoi merujuk kepada para cendekiawan atau ahli-perbintangan dari Timur.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda urutan waktu yang alami dalam bahasa Indonesia dan tetap dekat dengan fungsi naratif Yunani.
- source_word: ἰδὼν ὅτι
  choice: ketika ... menyadari bahwa
  rationale: Mengungkapkan persepsi Herodes atas keadaan yang telah terjadi; 'menyadari' lebih alami daripada terjemahan harfiah 'melihat' dalam konteks ini.
- source_word: ἐνεπαίχθη
  choice: telah diperdaya
  rationale: Dalam konteks ini Herodes merasa telah dipermainkan karena orang-orang majus tidak kembali. 'Diperdaya' menyampaikan akibat kontekstualnya tanpa menutup arti harfiah 'dipermainkan', yang dicatat dalam catatan kaki.
- source_word: ὑπὸ τῶν μάγων
  choice: oleh orang-orang majus
  rationale: Istilah Indonesia 'orang-orang majus' mempertahankan sebutan historis bagi para ahli-perbintangan atau cendekiawan dari Timur dan menghindari gambaran tradisional yang terlalu spesifik.
- source_word: ἐθυμώθη λίαν
  choice: menjadi sangat marah
  rationale: Mewakili perubahan keadaan pada verba dan penguat λίαν secara lugas.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Ia mengutus orang untuk membunuh
  rationale: Partisipel ἀποστείλας menunjukkan bahwa Herodes mengirim para pelaksana, sedangkan ἀνεῖλεν menyatakan tindakan membunuh. Susunan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Herodes melakukannya dengan tangannya sendiri.
- source_word: πάντας τοὺς παῖδας
  choice: semua anak laki-laki
  rationale: Dalam konteks pencarian seorang anak laki-laki, bentuk maskulin παῖδας merujuk kepada anak-anak laki-laki; pilihan ini lebih tepat daripada 'semua anak'.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: di Betlehem dan di seluruh daerah sekitarnya
  rationale: ὅρια di sini menunjuk wilayah sekitar atau kawasan yang berbatasan dengan Betlehem, bukan hanya garis batas.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: yang berumur dua tahun ke bawah
  rationale: Ungkapan Indonesia ini secara alami menyatakan batas usia atas yang inklusif.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: sesuai dengan waktu yang telah ia pastikan dari orang-orang majus
  rationale: Mempertahankan gagasan kesesuaian dengan keterangan waktu yang Herodes peroleh secara saksama dari orang-orang majus.
theological_decisions:
- issue: Makna ἐνεπαίχθη
  choice: telah diperdaya
  alternative: telah dipermainkan
  rationale: Konteks mendukung arti bahwa Herodes merasa dibuat seperti orang bodoh karena para majus tidak kembali, tetapi arti yang lebih harfiah tetap disediakan dalam catatan kaki.
- issue: Sebutan μάγοι
  choice: orang-orang majus
  alternative: orang-orang bijak
  rationale: '''Orang-orang majus'' lebih dekat dengan istilah Yunani dan identitas historis para pendatang dari Timur, tanpa memasukkan gambaran tradisional tambahan.'
- issue: Pelaku pembunuhan dalam ἀποστείλας ἀνεῖλεν
  choice: Ia mengutus orang untuk membunuh
  alternative: setelah mengutus orang, ia membunuh
  rationale: Ungkapan terpilih memperjelas bahwa pembunuhan dilaksanakan melalui utusan Herodes, sebagaimana tersirat oleh partisipel ἀποστείλας, tanpa menyatakan bahwa Herodes membunuh mereka sendiri secara langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan urutan tindakan dalam teks Yunani.
