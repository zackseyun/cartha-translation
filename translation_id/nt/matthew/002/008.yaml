  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: id
  text: Setelah mengutus mereka ke Betlehem, Herodes berkata, “Pergilah, dan carilah dengan teliti anak itu. Apabila kalian menemukannya, laporkanlah kepadaku, agar aku juga datang dan menyembah dia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud menghormati dia” atau “memberi hormat kepadanya.” Kata kerja Yunani yang digunakan dapat berarti menyembah atau melakukan tindakan penghormatan di hadapan seorang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: menyuruh
  rationale: Dalam konteks Herodes mengutus orang-orang majus ke Betlehem, ‘menyuruh’ secara alami menyampaikan tindakan pengiriman sekaligus kewibawaan pemberi perintah; urutan tindakan dipertahankan dengan ‘lalu’ sebelum verba utama ‘berkata’.
- source_word: Πορευθέντες
  choice: Pergilah
  rationale: Partisip ini berfungsi bersama perintah ἐξετάσατε; bentuk imperatif ‘Pergilah’ wajar dalam bahasa Indonesia dan mempertahankan dorongan untuk berangkat.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: carilah dengan teliti
  rationale: Gabungan verba dan adverbia ini menunjukkan pencarian atau penyelidikan yang saksama. ‘Carilah dengan teliti’ jelas dan sesuai dengan tujuan menemukan anak itu.
- source_word: περὶ τοῦ παιδίου
  choice: anak itu
  rationale: Dengan verba pencarian, περί secara idiomatis terwakili melalui objek yang dicari; ‘anak itu’ mengacu kepada anak yang telah menjadi pokok pembicaraan.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Apabila kalian menemukannya
  rationale: ἐπάν dengan subjungtif menyatakan kemungkinan pada masa mendatang yang diharapkan terjadi. ‘Apabila’ mempertahankan unsur kontingensi tanpa menyiratkan keraguan yang berlebihan.
- source_word: ἀπαγγείλατέ μοι
  choice: laporkanlah kepadaku
  rationale: ἀπαγγέλλω mengandung nuansa menyampaikan kembali suatu laporan; ‘laporkanlah’ lebih tepat daripada sekadar ‘beritahukanlah’.
- source_word: ὅπως κἀγὼ
  choice: supaya aku juga
  rationale: ‘Supaya’ mempertahankan hubungan tujuan yang dinyatakan ὅπως, sedangkan ‘juga’ mencerminkan κἀγώ dan klaim Herodes bahwa ia memiliki maksud yang sama.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: dapat pergi dan menyembah dia
  rationale: Partisip ἐλθών dan verba utama diterjemahkan sebagai tindakan berurutan yang alami dalam bahasa Indonesia. ‘Menyembah’ berada dalam cakupan makna προσκυνέω, sementara kemungkinan makna penghormatan kepada tokoh kerajaan dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna προσκυνήσω αὐτῷ ketika anak Yesus menjadi objeknya
  choice: menyembah dia
  alternative: bersujud menghormati dia; memberi hormat kepadanya
  rationale: προσκυνέω dapat menunjuk kepada penyembahan maupun tindakan bersujud sebagai penghormatan kepada seorang raja. ‘Menyembah’ mempertahankan kemungkinan bobot teologis dalam Injil Matius, tanpa meniadakan makna penghormatan kerajaan yang dicantumkan dalam catatan kaki. Ucapan Herodes sendiri bersifat pura-pura menurut alur narasi, tetapi hal itu tidak mengubah rentang leksikal katanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Kalian’ memperjelas bahwa perintah ditujukan kepada beberapa orang. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
