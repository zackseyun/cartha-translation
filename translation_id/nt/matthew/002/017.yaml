  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: id
  text: 'Pada waktu itu, genaplah apa yang telah disampaikan melalui Nabi Yeremia, yang berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dalam narasi secara alami; pilihan ini mempertahankan hubungan dengan peristiwa sebelumnya.
- source_word: ἐπληρώθη
  choice: genaplah
  rationale: Bentuk pasif aoris dari πληρόω dalam rumusan penggenapan Matius. Ungkapan idiomatis Indonesia ini mempertahankan gagasan bahwa firman nubuat mencapai penggenapannya.
- source_word: τὸ ῥηθὲν
  choice: apa yang telah disampaikan
  rationale: Partisip berartikel ini berfungsi sebagai nomina. 'Apa yang telah disampaikan' alami dalam bahasa Indonesia dan mencakup tindakan mengucapkan pesan tanpa mempersempitnya menjadi teks tertulis.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: melalui Nabi Yeremia
  rationale: διά dengan genitif menyatakan perantaraan; 'melalui' mempertahankan Yeremia sebagai penyampai perkataan nubuat. Dalam pemakaian Indonesia, gelar 'Nabi' sebelum nama sudah menyampaikan fungsi apposisional τοῦ προφήτου secara wajar.
- source_word: λέγοντος
  choice: ketika ia berkata
  rationale: Partisip genitif ini secara gramatikal berkaitan dengan Yeremia dan memperkenalkan kutipan berikutnya. Bentuk klausa ini lebih alami daripada 'yang berkata' sekaligus mempertahankan Yeremia sebagai pelaku perkataan.
theological_decisions:
- issue: Rumusan penggenapan dalam Matius
  choice: Mempertahankan bahasa penggenapan secara eksplisit dengan 'genaplah'.
  alternative: terjadilah apa yang disampaikan
  rationale: Matius secara sengaja menyajikan peristiwa tersebut sebagai penggenapan perkataan nubuat; terjemahan tidak melunakkan klaim teologis-sastrawi itu.
- issue: Pelaku dalam λέγοντος
  choice: 'Menghubungkan ''berkata'' dengan Yeremia: ''ketika ia berkata''.'
  alternative: 'Menghubungkannya secara idiomatis dengan isi nubuat: ''yang berbunyi''.'
  rationale: Bentuk genitif maskulin tunggal λέγοντος paling langsung berkaitan dengan Ἰερεμίου τοῦ προφήτου. Terjemahan utama mempertahankan hubungan gramatikal itu, sementara catatan kaki memberi bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Inversi 'genaplah' dipertahankan karena alami dalam gaya Alkitab Indonesia dan memberi penekanan yang sesuai pada penggenapan, tanpa menjadi usang.
