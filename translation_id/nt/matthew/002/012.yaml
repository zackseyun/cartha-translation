  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: id
  text: Setelah diperingatkan[a] dalam mimpi agar tidak kembali kepada Herodes, mereka pulang ke negeri mereka melalui jalan lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah menerima peringatan ilahi.” Bentuk pasif dalam bahasa Yunani menyiratkan bahwa peringatan itu berasal dari Allah, meskipun Allah tidak disebutkan secara eksplisit dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui rute lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: diperingatkan
  rationale: Bentuk partisip pasif ini dalam konteks Matius menyatakan penerimaan peringatan atau petunjuk ilahi. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: κατ’ ὄναρ
  choice: dalam mimpi
  rationale: Ungkapan ini secara idiomatis menunjuk pada pesan yang diterima dalam mimpi; 'dalam mimpi' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: μὴ ἀνακάμψαι
  choice: agar tidak kembali
  rationale: Infinitif dengan μή menyampaikan isi peringatan. 'Tidak kembali' tepat untuk konteks perjalanan.
- source_word: πρὸς Ἡρῴδην
  choice: kepada Herodes
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang; 'kepada Herodes' merupakan ungkapan Indonesia yang alami dalam konteks kembali menemui seseorang.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: melalui jalan lain
  rationale: ὁδός dapat berarti jalan atau rute. 'Melalui jalan lain' mempertahankan gambaran konkret perjalanan dan terdengar alami.
- source_word: ἀνεχώρησαν
  choice: mereka pulang
  rationale: ἀναχωρέω berarti pergi, berangkat, atau menyingkir. Karena tujuan mereka adalah negeri asal, 'pulang' secara ringkas dan alami menyampaikan gerak keberangkatan menuju tempat asal.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: ke negeri mereka
  rationale: χώρα dapat berarti negeri, wilayah, atau daerah. Dalam konteks orang-orang majus kembali ke asal mereka, 'negeri mereka' jelas tanpa menambahkan kata 'sendiri' yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku ilahi yang tersirat dalam peringatan
  choice: Menggunakan bentuk pasif 'diperingatkan' tanpa menambahkan 'oleh Allah' dalam teks utama.
  alternative: diperingatkan oleh Allah; menerima peringatan ilahi
  rationale: Konteks dan pemakaian χρηματίζω menyiratkan sumber ilahi, tetapi Allah tidak disebutkan secara eksplisit dalam ayat Yunani. Bentuk pasif mempertahankan implikasi sekaligus ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, sederhana, dan bermartabat. Susunan kalimat mengikuti alur Yunani secara alami. 'Pulang' dipakai untuk menghindari konstruksi kaku 'berangkat ke negeri mereka', sementara dua catatan kaki mempertahankan nuansa sumber ilahi dan alternatif bagi ὁδός.
