  naturalness: Teksnya umumnya jelas dan modern. “Katanya” pada awal ayat terdengar lebih percakapan dan bergantung kuat pada konteks kalimat sebelumnya; “Ia berkata” lebih wajar dan tetap mencerminkan λέγων. Susunan “bawalah Anak itu dan ibu-Nya” lugas dan alami.
  terminology: “Anak itu,” “ibu-Nya,” “tanah Israel,” dan “sudah mati” tepat. Kapitalisasi rujukan kontekstual pada Anak dan -Nya dapat dipertahankan. Tidak diperlukan catatan kaki, karena terjemahan idiomatis yang direvisi sudah jelas tanpa menambahkan penafsiran teologis.
