id: MAT.2.20
reference: Matthew 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: id
  text: Ia berkata, “Bangunlah, bawalah Anak itu dan ibu-Nya, lalu pergilah ke tanah Israel, sebab orang-orang yang berusaha membunuh Anak itu sudah mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel kini ini memperkenalkan ucapan malaikat dan menghubungkannya dengan ayat sebelumnya. Dalam bahasa Indonesia, “katanya” menjaga hubungan tersebut secara alami tanpa harus memakai bentuk harfiah yang kaku.
- source_word: Ἐγερθείς
  choice: Bangunlah
  rationale: Partisipel aoris pasif ini dipakai secara idiomatis bersama perintah berikutnya. “Bangunlah” menyampaikan daya perintahnya dengan wajar.
- source_word: παράλαβε
  choice: bawalah ... serta
  rationale: Dalam konteks ini παραλαμβάνω berarti membawa seseorang bersama diri sendiri. Ungkapan “bawalah ... serta” memperjelas makna penyertaan secara alami.
- source_word: τὸ παιδίον
  choice: Anak itu
  rationale: παιδίον berarti anak; unsur penentu diterjemahkan dengan “itu”. Huruf kapital dipakai sebagai rujukan kontekstual kepada Yesus, tanpa menambahkan gelar teologis.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ibu-Nya
  rationale: Frasa ini secara langsung berarti ibu anak tersebut. Bentuk “ibu-Nya” alami dalam bahasa Indonesia dan mempertahankan rujukan pronominal sumber.
- source_word: πορεύου
  choice: pergilah
  rationale: Imperatif πορεύομαι di sini merupakan perintah langsung untuk pergi; “pergilah” adalah padanan Indonesia yang lugas.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ke tanah Israel
  rationale: γῆ dengan Ἰσραήλ menunjuk wilayah atau tanah Israel. “Ke tanah Israel” mempertahankan unsur geografis sumber.
- source_word: τεθνήκασιν
  choice: sudah mati
  rationale: Bentuk perfek menekankan keadaan sekarang sebagai hasil kematian. “Sudah mati” secara alami memuat baik peristiwa yang telah terjadi maupun keadaan yang dihasilkan.
- source_word: οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου
  choice: orang-orang yang hendak membunuh Anak itu
  rationale: Ungkapan Semitis ‘mencari nyawa seseorang’ dalam konteks ancaman maut berarti berusaha membunuhnya. Padanan ini menyampaikan maksud idiom secara jelas dan alami.
theological_decisions:
- issue: Makna ψυχή dalam konteks ancaman maut
  choice: nyawa, yang secara idiomatis diterjemahkan dalam klausa sebagai “hendak membunuh”
  alternative: jiwa; mencari nyawa Anak itu
  rationale: Di sini ψυχή menunjuk kehidupan jasmani yang terancam, bukan unsur nonjasmani manusia. Menerjemahkannya sebagai “jiwa” akan memasukkan nuansa teologis yang tidak dimaksudkan konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah memakai akhiran -lah. Ungkapan ancaman maut diterjemahkan secara idiomatis agar mudah dipahami pembaca umum, sementara makna sumber tetap terjaga.
