  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: id
  text: dan ia tinggal di sana sampai Herodes meninggal, supaya digenapi apa yang difirmankan oleh Tuhan melalui nabi yang berkata, “Dari Mesir Kupanggil anak-Ku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan ini berasal dari Hosea 11:1. Dalam konteks aslinya, “anak-Ku” merujuk kepada Israel; di sini Matius menyatakannya digenapi dalam diri Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: tinggal di sana
  rationale: Secara harfiah berarti 'berada di sana', tetapi dalam konteks menetap sampai suatu waktu, 'tinggal di sana' lebih alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak tersirat.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: sampai Herodes meninggal
  rationale: τελευτή menunjuk pada kematian atau akhir hidup. Bentuk verbal ini paling alami dalam bahasa Indonesia dan menyampaikan makna konstruksi nominal Yunani dengan tepat.
- source_word: ἵνα πληρωθῇ
  choice: supaya digenapi
  rationale: Mempertahankan rumusan penggenapan khas Matius dan daya tujuan/hasil dari ἵνα dengan bentuk pasif πληρωθῇ.
- source_word: τὸ ῥηθὲν
  choice: apa yang telah difirmankan
  rationale: Partisipel pasif berartikel diterjemahkan secara idiomatis. 'Difirmankan' sesuai karena Tuhan adalah sumber perkataan, sedangkan 'telah' menandai bahwa firman itu disampaikan sebelumnya tanpa mengubah makna.
- source_word: ὑπὸ κυρίου
  choice: oleh Tuhan
  rationale: Menunjukkan Tuhan sebagai sumber utama perkataan. Tidak ditambahkan kata 'Allah' karena tidak terdapat dalam teks Yunani.
- source_word: διὰ τοῦ προφήτου
  choice: melalui nabi
  rationale: διά dengan genitif menyatakan perantaraan, sehingga membedakan Tuhan sebagai sumber dari nabi sebagai penyampai.
- source_word: λέγοντος
  choice: yang berkata
  rationale: Mengantar kutipan secara alami dalam bahasa Indonesia sambil tetap mengaitkannya dengan nabi secara gramatikal.
- source_word: Ἐξ Αἰγύπτου
  choice: Dari Mesir
  rationale: ἐξ menyatakan asal atau gerak keluar. 'Dari Mesir' adalah ungkapan Indonesia yang alami dan tetap mempertahankan makna dasar.
- source_word: ἐκάλεσα
  choice: Kupanggil
  rationale: καλέω di sini berarti memanggil, dengan konteks memanggil keluar. Bentuk terikat 'Ku-' menghasilkan kutipan yang ringkas dan bermartabat.
- source_word: τὸν υἱόν μου
  choice: Anak-Ku
  rationale: υἱός secara khusus berarti anak laki-laki/putra. Dalam bahasa Alkitab Indonesia, 'Anak-Ku' secara alami mempertahankan hubungan filial dan hubungan antarteks dengan Hosea; kapitalisasi menandai penerapannya kepada Yesus dalam konteks Matius tanpa mengubah kata sumber.
theological_decisions:
- issue: Rumusan penggenapan dan kutipan Hosea 11:1
  choice: Mempertahankan pernyataan bahwa peristiwa itu menggenapi firman Tuhan melalui nabi, tanpa menentukan cara penggenapannya dalam teks utama.
  alternative: Membatasi penggenapan sebagai nubuat langsung saja, atau menjelaskannya secara eksplisit sebagai pengulangan tipologis pengalaman Israel oleh Mesias.
  rationale: Matius menyatakan penggenapan, tetapi teks tidak menguraikan mekanismenya. Terjemahan mempertahankan ketegangan antara konteks awal Hosea tentang Israel dan penerapannya oleh Matius kepada Yesus.
- issue: κύριος dalam rumusan penggenapan
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κυρίου. 'Tuhan' menerjemahkan bentuk Yunani secara langsung tanpa memasukkan tipografi khusus untuk nama ilahi dari konteks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur dibuat lancar bagi pembaca umum, sementara bentuk pasif rumusan penggenapan, pembedaan antara Tuhan sebagai sumber dan nabi sebagai perantara, serta ketegangan antarteks Hosea–Matius tetap dipertahankan.
