id: MAT.2.9
reference: Matthew 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: id
  text: Setelah mendengar raja itu, mereka berangkat. Dan lihatlah, bintang yang telah mereka lihat di timur[a] itu berjalan di depan mereka hingga tiba dan berhenti di atas tempat anak itu berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pada saat terbitnya"; ungkapan Yunani ini dapat menunjuk ke timur sebagai wilayah atau arah, atau pada saat sebuah bintang terbit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Setelah mendengarkan raja itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului keberangkatan. Genitif τοῦ βασιλέως menunjukkan orang yang didengar; terjemahan ini mempertahankan sebutan eksplisit 'raja itu' tanpa menambahkan nama Herodes.
- source_word: ἐπορεύθησαν
  choice: mereka pun berangkat
  rationale: πορεύομαι menyatakan pergi atau menempuh perjalanan. 'Berangkat' alami dalam alur narasi setelah pertemuan dengan raja, sedangkan 'pun' menandai kelanjutan tindakan tanpa menambah isi.
- source_word: ἰδοὺ
  choice: Dan lihatlah
  rationale: Penanda wacana ini dipertahankan untuk mengarahkan perhatian pembaca pada kemunculan bintang secara hidup dan mendadak.
- source_word: ὁ ἀστήρ
  choice: bintang
  rationale: Padanan leksikal langsung dan wajar dalam konteks ini.
- source_word: ὃν εἶδον
  choice: yang telah mereka lihat
  rationale: '''Telah'' memperjelas bahwa mereka melihat bintang itu sebelum peristiwa bintang tersebut mendahului mereka dalam adegan ini.'
- source_word: ἐν τῇ ἀνατολῇ
  choice: di timur
  rationale: Ungkapan Yunani ini dapat menunjuk wilayah atau arah timur, tetapi juga dapat berarti saat sebuah bintang terbit. Bacaan geografis yang lazim ditempatkan dalam teks utama, sementara kemungkinan astronomis dipertahankan dalam catatan kaki.
- source_word: προῆγεν αὐτούς
  choice: bergerak mendahului mereka
  rationale: προάγω berarti pergi di depan atau memimpin maju. 'Bergerak mendahului' alami untuk subjek bintang dan tidak menentukan mekanisme pergerakannya.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: sampai tiba dan berhenti
  rationale: Rangkaian partisip dan verba utama menggambarkan kedatangan lalu keadaan berhenti. 'Tiba dan berhenti' menyampaikan urutan itu secara alami.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: di atas tempat anak itu berada
  rationale: Terjemahan ini mempertahankan relasi posisi ἐπάνω dan rujukan tempat melalui οὗ, tanpa menambahkan rincian mengenai bangunan atau lokasi.
theological_decisions:
- issue: Makna ἐν τῇ ἀνατολῇ dalam kisah bintang
  choice: di timur
  alternative: ketika terbitnya / pada waktu bintang itu terbit
  rationale: Frasa tersebut secara leksikal dapat dipahami secara geografis maupun astronomis. Teks utama memakai ungkapan geografis yang ringkas dan lazim, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin agar ambiguitas sumber tidak dihapus.
- issue: Kapitalisasi παιδίον
  choice: anak itu
  alternative: Anak itu
  rationale: Bahasa Yunani tidak memberi penanda kapitalisasi teologis pada kata ini. Huruf kecil menghindari pemasukan penafsiran teologis melalui tata tulis, sementara identitas anak tersebut tetap jelas dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. 'Lihatlah' mempertahankan daya retoris ἰδού; struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan atau ambiguitas penting dalam frasa mengenai timur/terbitnya bintang.
