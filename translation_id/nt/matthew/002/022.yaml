id: MAT.2.22
reference: Matthew 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: id
  text: Namun, ketika mendengar bahwa Arkhelaus memerintah atas Yudea menggantikan ayahnya, Herodes, ia takut pergi ke sana. Setelah diperingatkan[a] dalam mimpi, ia menyingkir ke daerah-daerah Galilea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah menerima petunjuk”; kata kerja ini biasanya menyiratkan peringatan atau petunjuk ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Namun, ketika mendengar
  rationale: Partisip aoris menyatakan keadaan yang mendahului tindakan utama, sedangkan δέ menandai perkembangan yang berlawanan dengan rencana sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan waktunya.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: memerintah atas Yudea
  rationale: βασιλεύω menyatakan pemerintahan sebagai raja; dengan wilayah dalam bentuk genitif, 'memerintah atas Yudea' menyampaikan cakupan kekuasaannya tanpa harus menambahkan gelar yang tidak dinyatakan secara eksplisit.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: menggantikan ayahnya, Herodes
  rationale: ἀντί di sini menunjukkan penggantian atau suksesi. Bentuk ini lebih alami daripada 'di tempat ayahnya' dan aposisi 'Herodes' memperjelas bahwa Herodes adalah sang ayah.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ia takut pergi ke sana
  rationale: Terjemahan ini mempertahankan rasa takut sebagai alasan untuk tidak menuju tempat tersebut dan memakai susunan Indonesia yang lugas.
- source_word: χρηματισθεὶς
  choice: setelah diperingatkan
  rationale: Partisip pasif ini merujuk pada peringatan atau petunjuk yang diterima, dalam konteks Matius biasanya dari Allah. Bentuk pasif dipertahankan agar sumber yang tidak disebutkan secara eksplisit dalam ayat ini tidak ditambahkan ke teks utama.
- source_word: κατ’ ὄναρ
  choice: dalam mimpi
  rationale: Ini adalah ungkapan lazim dalam Matius untuk komunikasi yang diterima ketika tidur; 'dalam mimpi' merupakan padanan Indonesia yang alami.
- source_word: ἀνεχώρησεν
  choice: ia menyingkir
  rationale: ἀναχωρέω sering menunjukkan kepergian yang disengaja sebagai tanggapan terhadap bahaya atau keadaan. 'Menyingkir' mempertahankan nuansa itu lebih baik daripada sekadar 'pergi'.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: ke wilayah Galilea
  rationale: Bentuk jamak μέρη menunjuk pada kawasan atau daerah. Dalam bahasa Indonesia, bentuk kolektif 'wilayah Galilea' terdengar alami tanpa menghilangkan gagasan tentang kawasan tujuan.
theological_decisions:
- issue: Apakah sumber ilahi dari peringatan dalam χρηματισθείς perlu disebutkan secara eksplisit
  choice: Teks utama memakai bentuk pasif 'setelah diperingatkan' tanpa menambahkan 'oleh Allah'.
  alternative: setelah diperingatkan oleh Allah; setelah menerima petunjuk ilahi
  rationale: Dalam pemakaian Matius, kata kerja ini lazim menyiratkan komunikasi ilahi, tetapi pelakunya tidak disebutkan dalam bahasa Yunani ayat ini. Bentuk pasif mempertahankan ketegangan tersebut, sementara catatan kaki menjelaskan implikasi leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan naratif yang mudah dipahami. Nama 'Arkhelaus' mengikuti transliterasi Yunani Ἀρχέλαος. Koma penutup dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya.
