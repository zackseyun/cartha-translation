    issue: '"Mereka membuka harta mereka"'
    rationale: Ungkapan ini tidak alami dalam bahasa Indonesia karena "harta" biasanya berarti kekayaan/isi, bukan sesuatu yang dibuka. Bentuk Yunani θησαυρούς memungkinkan arti simpanan harta atau tempat penyimpanannya; "simpanan harta" mempertahankan keluasan itu dan membuat tindakan membuka dapat dipahami.
  - severity: low
    issue: Hubungan antara "sujud" dan "memberi hormat" kurang eksplisit
    rationale: Partisip πεσόντες menggambarkan tindakan tersungkur yang mendahului atau menyertai tindakan utama. "Tersungkur lalu memberi hormat" menyampaikan urutan tersebut dengan lebih jelas dan alami.
