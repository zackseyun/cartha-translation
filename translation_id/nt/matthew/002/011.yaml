  to: 'Setelah mereka masuk ke rumah itu, mereka melihat Anak itu bersama Maria, ibu-Nya. Lalu mereka tersungkur dan memberi hormat kepada-Nya.[a] Mereka membuka simpanan harta mereka dan mempersembahkan kepada-Nya hadiah-hadiah: emas, kemenyan, dan mur.'
  rationale: Revisi terbatas pada kelancaran dan ketepatan makna. "Simpanan harta" memungkinkan objek itu dibuka tanpa mempersempitnya menjadi peti, sedangkan "tersungkur" menyatakan postur πεσόντες secara jelas. Catatan kaki tetap mempertahankan alternatif "menyembah-Nya" untuk προσκυνέω.
