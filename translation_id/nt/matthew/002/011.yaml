id: MAT.2.11
reference: Matthew 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: id
  text: 'Setelah mereka masuk ke rumah itu, mereka melihat Anak itu bersama Maria, ibu-Nya. Lalu mereka tersungkur dan memberi hormat kepada-Nya.[a] Mereka membuka simpanan harta mereka dan mempersembahkan kepada-Nya hadiah-hadiah: emas, kemenyan, dan mur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Nya.” Kata kerja Yunani ini dapat berarti menyembah atau memberi penghormatan dengan penuh takzim, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: rumah
  rationale: Padanan langsung dan alami untuk tempat tinggal konkret yang disebutkan dalam konteks ini.
- source_word: παιδίον
  choice: Anak
  rationale: Menunjuk seorang anak tanpa menambahkan batas usia yang tidak dinyatakan oleh teks Yunani; huruf kapital dipakai sebagai sapaan naratif bagi Yesus.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: bersama Maria, ibu-Nya
  rationale: Mempertahankan makna μετά dengan genitif dan hubungan aposisional yang mengidentifikasi Maria sebagai ibu Anak itu.
- source_word: πεσόντες
  choice: sujud
  rationale: Mengungkapkan tindakan merendahkan tubuh hingga ke tanah secara alami dalam bahasa Indonesia, sesuai gerak yang mendahului tindakan memberi hormat.
- source_word: προσεκύνησαν
  choice: memberi hormat
  rationale: Mempertahankan kemungkinan penghormatan mendalam kepada seorang raja tanpa memaksakan arti teologis 'menyembah'; alternatif itu dicantumkan dalam catatan kaki.
- source_word: θησαυροὺς
  choice: harta
  rationale: Menjaga keluasan arti 'treasures' atau simpanan berharga tanpa mempersempitnya menjadi peti tertentu.
- source_word: προσήνεγκαν
  choice: mempersembahkan
  rationale: Sesuai dengan tindakan menyampaikan pemberian secara khidmat dan lebih tepat daripada sekadar 'membawa'.
- source_word: δῶρα
  choice: pemberian
  rationale: Padanan netral untuk hadiah yang tidak dengan sendirinya menetapkannya sebagai persembahan ritual.
- source_word: λίβανον
  choice: kemenyan
  rationale: Istilah Indonesia yang lazim bagi resin aromatik frankincense dalam konteks Alkitab.
- source_word: σμύρναν
  choice: mur
  rationale: Istilah baku bahasa Indonesia untuk myrrh.
theological_decisions:
- issue: Makna προσκυνέω terhadap Anak Yesus
  choice: memberi hormat
  alternative: menyembah
  rationale: Kata Yunani ini dapat menyatakan penghormatan dengan bersujud ataupun penyembahan. Teks utama tidak mempersempit daya maknanya, sedangkan alternatif teologis yang lebih kuat dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipecah agar alur tindakan jelas. Bentuk “Anak” dan pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia saat merujuk kepada Yesus, tanpa menambahkan gelar yang tidak terdapat dalam teks sumber.
