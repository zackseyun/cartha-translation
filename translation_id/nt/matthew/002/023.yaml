id: MAT.2.23
reference: Matthew 2:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: id
  text: 'Ia datang dan tinggal di sebuah kota bernama Nazaret agar terpenuhi apa yang disampaikan melalui para nabi: “Ia akan disebut orang Nazaret.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Nazorean.” Latar belakang nubuat bagi perkataan “Ia akan disebut orang Nazaret” diperdebatkan; Matius mungkin sedang merangkum tema-tema dari para nabi, bukan mengutip satu teks tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ia datang
  rationale: Partisip aoris yang mendahului verba utama dialihkan secara alami sebagai verba finit untuk mempertahankan urutan tindakan.
- source_word: κατῴκησεν
  choice: tinggal
  rationale: Menunjukkan bahwa ia menetap atau berdiam di tempat itu; 'tinggal' merupakan padanan Indonesia modern yang wajar tanpa melebihkan nuansa permanensi.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: di sebuah kota bernama Nazaret
  rationale: Dengan verba κατοικέω, εἰς secara idiomatis menyatakan tempat tinggal. 'Kota' menerjemahkan πόλις secara langsung.
- source_word: ὅπως πληρωθῇ
  choice: Dengan demikian, terpenuhilah
  rationale: Mengungkapkan hubungan tujuan/hasil dalam formula penggenapan Matius secara alami, sambil mempertahankan bentuk pasif dan tidak memaksakan perbedaan modalitas yang tidak lazim dalam bahasa Indonesia.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: apa yang disampaikan melalui para nabi
  rationale: '''Disampaikan'' mencakup perkataan profetik, sedangkan ''melalui'' mempertahankan nuansa perantaraan διά dengan genitif. Bentuk jamak ''para nabi'' dipertahankan.'
- source_word: Ναζωραῖος
  choice: orang Nazaret
  rationale: Dalam konteks ini istilah tersebut menunjuk pada sebutan yang berkaitan dengan Nazaret. Padanan ini alami dalam bahasa Indonesia dan tidak menyamakannya dengan orang nazir.
- source_word: κληθήσεται
  choice: Ia akan disebut
  rationale: Mempertahankan kala mendatang dan bentuk pasif καλέω dalam gaya pernyataan profetik.
theological_decisions:
- issue: Sifat kutipan penggenapan tanpa satu sumber Perjanjian Lama yang persis
  choice: Formula diterjemahkan sebagai kesaksian jamak dari para nabi tanpa menentukan satu sumber tertentu dalam teks utama.
  alternative: Mengaitkannya secara khusus dengan Yesaya 11:1, merangkumnya sebagai tema kerendahan Mesias, atau menafsirkannya sebagai rujukan kepada orang nazir.
  rationale: Teks Yunani secara eksplisit memakai bentuk jamak 'para nabi', sehingga identifikasi dengan satu ayat tertentu tidak boleh dimasukkan ke dalam terjemahan. Istilah Ναζωραῖος juga berbeda dari istilah bagi orang yang menjalani nazar kenaziran.
- issue: Padanan Ναζωραῖος
  choice: orang Nazaret
  alternative: orang Nazorean
  rationale: Konteks menghubungkan sebutan itu dengan Nazaret. Namun, karena bentuk istilah Yunani dan latar belakang nubuatnya diperdebatkan, alternatif yang lebih formal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Dengan demikian, terpenuhilah' dipilih agar hubungan penggenapan terdengar alami tanpa menghilangkan nuansa tujuan/hasil. Penanda catatan kaki ditempatkan sesudah 'Nazaret' sesuai pembahasan istilah terkait.
