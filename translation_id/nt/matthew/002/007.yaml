  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: id
  text: Kemudian Herodes diam-diam memanggil orang-orang majus itu dan mencari tahu dengan saksama dari mereka kapan bintang itu tampak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang bijak.” Kata Yunani μάγοι lebih khusus merujuk kepada orang-orang majus, yaitu ahli perbintangan terpelajar dari Timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan narasi secara alami dalam bahasa Indonesia modern.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: λάθρᾳ
  choice: diam-diam
  rationale: Mengungkapkan tindakan yang dilakukan secara tersembunyi; alami dan jelas bagi pembaca Indonesia.
- source_word: καλέσας
  choice: memanggil
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; konstruksi Indonesia mengalirkannya sebagai verba berurutan tanpa mempertahankan bentuk partisip secara kaku.
- source_word: τοὺς μάγους
  choice: orang-orang majus itu
  rationale: Mempertahankan istilah khusus μάγοι dan tidak memasukkan gambaran tradisional tentang raja; penunjuk 'itu' menandai kelompok yang telah disebut.
- source_word: ἠκρίβωσεν
  choice: mencari tahu dengan saksama
  rationale: Menyampaikan unsur penyelidikan atau penetapan yang teliti, bukan sekadar memperoleh informasi.
- source_word: παρ’ αὐτῶν
  choice: dari mereka
  rationale: παρά dengan genitif menunjukkan sumber informasi.
- source_word: τὸν χρόνον
  choice: kapan
  rationale: Dalam klausa Indonesia, 'kapan' secara alami mengungkapkan waktu yang hendak diketahui tanpa pengulangan yang kaku.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: bintang itu mulai tampak
  rationale: Genitif dengan partisip kini dapat menunjuk waktu kemunculan atau penampakan bintang. 'Mulai tampak' menyampaikan awal penampakannya secara alami tanpa memastikan bahwa bintang itu muncul secara mendadak.
