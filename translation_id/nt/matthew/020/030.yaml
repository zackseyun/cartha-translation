  source_fidelity: 'Terjemahan secara tepat mencerminkan unsur utama teks Yunani: penanda perhatian ἰδού, dua orang buta yang duduk di pinggir jalan, informasi bahwa Yesus sedang lewat, seruan yang kuat, serta sapaan dan gelar “Tuhan” dan “Anak Daud.” Hubungan temporal dalam “Ketika mendengar” sesuai dengan partisipel aoristus ἀκούσαντες. Pemecahan kalimat tidak mengubah urutan maupun makna peristiwa.'
  naturalness: Bahasa Indonesia modern dan jelas. “Lihatlah” mempertahankan register naratif yang agak ditinggikan dari ἰδού secara wajar; “di pinggir jalan,” “sedang lewat,” dan “mereka berseru” semuanya idiomatis. “Kasihanilah kami” merupakan permohonan yang alami dan cukup kuat untuk ἐλέησον ἡμᾶς.
  terminology: “Tuhan” mempertahankan kemungkinan bobot hormat dan mesianik dari Κύριε dalam konteks “Anak Daud,” tanpa memaksakan penafsiran lebih jauh. “Anak Daud” secara tepat mempertahankan gelar yang digunakan teks. Tidak ada catatan kaki atau jangkar catatan kaki yang diperlukan dalam ayat ini.
