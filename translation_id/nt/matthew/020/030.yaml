id: MAT.20.30
reference: Matthew 20:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: id
  text: Lihatlah, ada dua orang buta yang sedang duduk di pinggir jalan. Ketika mendengar bahwa Yesus sedang lewat, mereka berseru, “Tuhan, kasihanilah kami, Anak Daud!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian dan menghidupkan narasi, dengan bentuk Indonesia yang wajar serta bermartabat.
- source_word: δύο τυφλοὶ
  choice: dua orang buta
  rationale: Menunjuk dua individu laki-laki dalam konteks ini; bahasa Indonesia lazim memakai 'orang buta' tanpa perlu menambahkan 'laki-laki' ketika jenis kelamin tidak penting bagi alur.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: yang sedang duduk di pinggir jalan
  rationale: Mengungkapkan keadaan yang berlangsung dan lokasi mereka secara alami dalam bahasa Indonesia.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Ketika mendengar bahwa Yesus sedang lewat
  rationale: Partisipel aoristus dipahami secara temporal; 'sedang lewat' menyampaikan tindakan παράγει dalam konteks perjalanan.
- source_word: ἔκραξαν λέγοντες
  choice: mereka berseru
  rationale: '''Berseru'' mempertahankan intensitas κράζω, sedangkan λέγοντες tidak perlu diterjemahkan terpisah karena isi seruan langsung mengikutinya.'
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini memiliki bobot hormat dan kemungkinan daya kristologis, terlebih karena dipasangkan dengan gelar mesianik 'Anak Daud'.
- source_word: ἐλέησον ἡμᾶς
  choice: kasihanilah kami
  rationale: Bentuk imperatif ini diterjemahkan sebagai permohonan langsung akan belas kasihan dan pertolongan; ungkapan tersebut alami serta mempertahankan bentuk verbal sumber.
- source_word: υἱὸς Δαυίδ
  choice: Anak Daud
  rationale: Mempertahankan bentuk gelar mesianik yang khas dalam Injil Matius dan tidak mereduksinya menjadi sekadar keterangan silsilah.
theological_decisions:
- issue: Makna κύριος sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks permohonan yang disertai gelar 'Anak Daud', 'Tuhan' paling baik mempertahankan bobot penghormatan dan potensi makna kristologis tanpa menjelaskannya secara berlebihan.
- issue: Daya mesianik υἱὸς Δαυίδ
  choice: Anak Daud
  alternative: keturunan Daud
  rationale: Frasa ini berfungsi sebagai gelar mesianik dalam Matius. Bentuk tradisional dan harfiah mempertahankan gema kerajaan serta mesianiknya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Lihatlah' sengaja mempertahankan penanda perhatian naratif, sedangkan struktur kalimat dibagi agar mudah dipahami pembaca umum.
