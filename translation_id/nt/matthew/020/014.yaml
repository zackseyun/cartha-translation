base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: id
  text: Ambillah milikmu dan pergilah. Tetapi Aku mau memberikan kepada orang terakhir ini[a] sama seperti kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada yang terakhir ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆρον
  choice: Ambillah
  rationale: Imperatif aoris αἴρω di sini memerintahkan pekerja itu mengambil apa yang menjadi bagiannya. 'Ambillah' alami dan mempertahankan ketegasan perintah.
- source_word: τὸ σὸν
  choice: bagianmu
  rationale: Frasa substantival netral ini secara harfiah berarti 'milikmu'. Dalam konteks pembayaran, 'bagianmu' terdengar alami tanpa mempersempitnya secara eksplisit menjadi 'upahmu'.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Imperatif ὑπάγω berfungsi sebagai perintah untuk beranjak. 'Pergilah' ringkas dan tidak menambahkan nada permusuhan.
- source_word: θέλω δὲ
  choice: Namun, aku mau
  rationale: θέλω menyatakan kehendak, sedangkan δέ menandai kontras ringan. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: kepada pekerja yang datang terakhir ini
  rationale: Secara leksikal berarti 'kepada orang terakhir ini'. Konteks menunjukkan seorang pekerja laki-laki yang direkrut terakhir; penyebutan 'pekerja yang datang terakhir' memperjelas acuan tanpa memakai ungkapan Indonesia yang kaku.
- source_word: δοῦναι
  choice: memberikan
  rationale: Infinitif δίδωμι berarti 'memberikan'. Pilihan ini mempertahankan makna umum sumber dan tidak menggantinya dengan 'membayar', meskipun pembayaran merupakan konteksnya.
- source_word: ὡς καὶ σοί
  choice: sama seperti kepadamu
  rationale: ὡς καί dengan datif menyatakan perlakuan atau pemberian yang setara. Terjemahan ini menyampaikan perbandingan tersebut secara wajar.
theological_decisions:
- issue: Rujukan personal maskulin tunggal
  choice: pekerja yang datang terakhir ini
  alternative: orang terakhir ini
  rationale: Bentuk Yunani merujuk kepada seorang pekerja laki-laki dalam perumpamaan. Pilihan ini menjaga acuan personal dan konteksnya, sementara bahasa Indonesia tidak perlu menambahkan kata 'laki-laki' untuk menyatakan gender gramatikal yang tidak dimilikinya.
- issue: Kesetaraan pemberian
  choice: sama seperti kepadamu
  alternative: seperti juga kepadamu
  rationale: Terjemahan menyatakan kesetaraan yang tersirat oleh ὡς καὶ σοί, tanpa menjelaskan lebih lanjut dasar atau makna teologis tindakan pemilik kebun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Pronomina 'aku' dipakai sesuai tuturan langsung pemilik kebun; sufiks '-lah' mempertahankan bentuk perintah tanpa membuat nadanya lebih keras daripada teks Yunani.
