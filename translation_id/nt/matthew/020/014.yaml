revisions:
- from: Ambillah bagianmu dan pergilah. Namun, aku mau memberikan kepada pekerja yang datang terakhir ini sama seperti kepadamu.[a]
  to: Ambillah milikmu dan pergilah. Tetapi Aku mau memberikan kepada orang terakhir ini[a] sama seperti kepadamu.
  rationale: Revisi mengganti ungkapan yang menambahkan ‘datang’ dengan padanan yang lebih dekat pada frasa Yunani, mengganti “bagianmu” dengan “milikmu” untuk mempertahankan keluasan τὸ σὸν, dan memindahkan serta menyesuaikan catatan kaki agar benar-benar menjelaskan frasa sumber yang relevan. Kapitalisasi “Aku” dipertahankan sebagai gaya tuturan naratif yang wajar dan tidak mengubah makna.
