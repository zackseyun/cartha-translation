review_pass:
  verdict: revise
  source_fidelity: Draf menangkap perintah untuk mengambil miliknya, pergi, dan kehendak tuan untuk memberi secara setara. Namun, “pekerja yang datang terakhir” menambahkan gagasan ‘datang’ yang tidak dinyatakan oleh τούτῳ τῷ ἐσχάτῳ; konteks memang melibatkan pekerja, tetapi teks Yunani di ayat ini hanya menyebut ‘yang terakhir ini’. “Milikmu” juga lebih langsung mencerminkan τὸ σὸν daripada “bagianmu.”
  naturalness: “Ambillah milikmu dan pergilah” serta “Aku mau memberikan kepada orang terakhir ini sama seperti kepadamu” adalah bahasa Indonesia baku modern, jelas, dan sesuai dengan tuturan langsung. Penempatan penanda catatan kaki sesudah frasa yang diterangkan lebih tepat daripada di akhir kalimat.
  terminology: Tidak ada istilah teologis teknis dalam ayat ini. “Orang terakhir ini” mempertahankan rujukan personal tanpa menambahkan rincian kontekstual; bahasa Indonesia tidak menandai gender gramatikal pada nomina ini.
  issues:
  - severity: medium
    issue: Penambahan “yang datang” dalam “pekerja yang datang terakhir ini”
    rationale: τούτῳ τῷ ἐσχάτῳ secara harfiah merujuk kepada ‘yang/orang terakhir ini’. ‘Datang’ dapat disimpulkan dari konteks perumpamaan, tetapi tidak dinyatakan dalam frasa Yunani ini dan sebaiknya tidak ditambahkan dalam terjemahan utama.
  - severity: low
    issue: “bagianmu” kurang langsung untuk τὸ σὸν
    rationale: Frasa Yunani berarti ‘milikmu/yang menjadi milikmu’. “Bagianmu” dapat dipahami sebagai jatah, sedangkan “milikmu” mempertahankan keluasan frasa sumber.
  - severity: low
    issue: Penanda catatan kaki tidak melekat pada frasa yang diberi alternatif
    rationale: Catatan menjelaskan τούτῳ τῷ ἐσχάτῳ, sehingga penanda sebaiknya ditempatkan segera setelah “orang terakhir ini.”
  revised_text: Ambillah milikmu dan pergilah. Tetapi Aku mau memberikan kepada orang terakhir ini[a] sama seperti kepadamu.
