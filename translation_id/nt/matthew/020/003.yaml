id: MAT.20.3
reference: Matthew 20:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: id
  text: Sekitar jam ketiga[a], ia keluar dan melihat orang-orang lain berdiri menganggur[b] di pasar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekitar pukul sembilan pagi.” Ungkapan “jam ketiga” mengikuti penghitungan waktu siang orang Yahudi yang dimulai dari matahari terbit.
    reason: cultural_note
  - marker: b
    text: Atau “tidak bekerja.” Kata Yunani yang dipakai berarti menganggur atau tidak sedang bekerja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ia keluar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama; susunan klausa berurutan terasa alami dalam bahasa Indonesia.
- source_word: περὶ τρίτην ὥραν
  choice: sekitar jam ketiga
  rationale: Mempertahankan cara penghitungan waktu Yahudi dalam teks utama sekaligus menerjemahkan περί sebagai perkiraan.
- source_word: εἶδεν
  choice: melihat
  rationale: Padanan langsung dan wajar bagi bentuk lampau ὁράω dalam narasi.
- source_word: ἄλλους
  choice: orang-orang lain
  rationale: Adjektiva ini digunakan secara substantival; 'orang-orang lain' jelas tanpa mempersempitnya secara eksplisit menjadi laki-laki.
- source_word: ἑστῶτας
  choice: berdiri
  rationale: Mencerminkan daya statif partisip perfektum ἵστημι, yakni keadaan mereka sedang berdiri.
- source_word: ἀγορᾷ
  choice: pasar
  rationale: ἀγορά adalah kawasan pasar atau ruang umum tempat para pekerja berkumpul; 'pasar' merupakan padanan modern yang ringkas dan mudah dipahami.
- source_word: ἀργούς
  choice: menganggur
  rationale: Dalam konteks pekerja yang menunggu untuk dipekerjakan, kata ini menyatakan bahwa mereka tidak sedang bekerja; padanan ini alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ungkapan waktu sumber dipertahankan demi transparansi budaya, dengan padanan waktu modern dalam catatan kaki.
