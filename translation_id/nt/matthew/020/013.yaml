revisions:
- from: Namun ia menjawab salah seorang dari mereka, “Saudara, aku tidak bertindak tidak adil terhadapmu.[a] Bukankah engkau sudah sepakat denganku untuk upah satu dinar[b]?”
  to: Namun, ia menjawab dan berkata kepada salah seorang dari mereka, “Saudara, aku tidak berlaku tidak adil terhadapmu. Bukankah engkau sudah sepakat denganku dengan upah satu dinar[a]?”
  rationale: Revisi memulihkan struktur tanggapan dan ujaran dalam bahasa Indonesia yang tetap jelas, memperhalus padanan ἀδικέω, serta menyederhanakan catatan kaki agar hanya memuat keterangan budaya yang berguna dan ditambatkan pada istilah yang dijelaskan. Tidak ada ambiguitas tekstual atau keputusan teologis tambahan yang diperkenalkan.
