  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: id
  text: Namun, ia menjawab dan berkata kepada salah seorang dari mereka, “Saudara, aku tidak berlaku tidak adil terhadapmu. Bukankah engkau sudah sepakat denganku dengan upah satu dinar[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinar di sini adalah denarius, koin perak Romawi yang lazim dipandang sebagai upah sehari bagi seorang pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ia menjawab
  rationale: Partisip aoris yang diikuti verba ‘berkata’ berfungsi memperkenalkan tanggapan. Bahasa Indonesia alami cukup memakai ‘menjawab’ tanpa menggandakan ungkapan menjadi ‘menjawab dan berkata’.
- source_word: ἑνὶ αὐτῶν
  choice: salah seorang dari mereka
  rationale: 'Menyampaikan datif tunggal dengan genitif partitif: ia berbicara kepada satu orang yang termasuk dalam kelompok itu.'
- source_word: Ἑταῖρε
  choice: Saudara
  rationale: Sapaan ini tidak harus menyatakan keakraban yang hangat dan dalam konteks dapat bernada berjarak. ‘Saudara’ merupakan sapaan modern yang sopan tetapi tertahan.
- source_word: οὐκ ἀδικῶ σε
  choice: aku tidak bertindak tidak adil terhadapmu
  rationale: Mempertahankan makna ἀδικέω sebagai bertindak tidak adil atau berbuat salah kepada seseorang, sekaligus mempertahankan objek personal σε.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban membenarkan.
- source_word: δηναρίου
  choice: untuk upah satu dinar
  rationale: Genitif menyatakan harga dalam kesepakatan kerja. ‘Dinar’ mempertahankan mata uang historis, sedangkan ‘upah’ membuat hubungan transaksionalnya wajar dan jelas dalam bahasa Indonesia.
- source_word: συνεφώνησάς μοι
  choice: engkau sudah sepakat denganku
  rationale: Menyatakan kesepakatan yang telah dicapai sebelumnya; ‘sudah’ secara alami membawa acuan lampau aoris dalam dialog Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa dialog dibuat modern, jelas, dan bermartabat. Kata ganti ‘aku–engkau’ mempertahankan corak langsung dalam perumpamaan tanpa menjadi terlalu santai. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
