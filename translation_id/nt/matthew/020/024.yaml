  text: Καὶ ἀκούσαντες οἱ δέκα ἠγανάκτησαν περὶ τῶν δύο ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: id
  text: Ketika kesepuluh murid yang lain mendengar hal itu, mereka menjadi geram terhadap kedua saudara itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: kesepuluh murid yang lain
  rationale: Secara harfiah berarti 'kesepuluh orang'; konteks menjelaskan bahwa mereka adalah sepuluh murid selain kedua bersaudara itu. Penambahan 'murid yang lain' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἠγανάκτησαν
  choice: menjadi geram
  rationale: Kata ini menyatakan kemarahan atau kejengkelan kuat; 'menjadi geram' mempertahankan intensitasnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: terhadap kedua saudara itu
  rationale: περί dengan verba emosi di sini menunjuk sasaran atau pihak yang menimbulkan kemarahan. 'Terhadap' alami dalam bahasa Indonesia tanpa menentukan secara berlebihan alasan batin mereka.
theological_decisions:
- issue: Sasaran kemarahan sepuluh murid
  choice: terhadap kedua saudara itu
  alternative: mengenai kedua saudara itu
  rationale: Konstruksi Yunani menunjukkan bahwa kedua saudara itu menjadi sasaran atau pokok kemarahan. 'Terhadap' menyampaikan relasi ini dengan jelas, tetapi tidak menambahkan penilaian teologis mengenai motif kemarahan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur Yunani sambil memperjelas rujukan 'kesepuluh' secara kontekstual.
