id: MAT.20.32
reference: Matthew 20:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: id
  text: Yesus berhenti, lalu memanggil mereka dan berkata, “Apa yang kalian ingin Aku lakukan bagi kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: berhenti
  rationale: Partisip aoristus dari ἵστημι di sini mendahului verba utama dan secara idiomatis menyatakan bahwa Yesus menghentikan langkah-Nya. “Berhenti” alami dan tepat dalam bahasa Indonesia modern.
- source_word: ἐφώνησεν
  choice: memanggil
  rationale: φωνέω dapat berarti memanggil atau menyuruh datang. Dalam konteks ini, “memanggil” ringkas dan wajar karena Yesus kemudian berbicara langsung kepada kedua orang itu.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina akusatif jamak ini merujuk kepada kedua orang buta dalam konteks sebelumnya.
- source_word: Τί
  choice: Apa
  rationale: Pronomina tanya ini secara langsung membuka pertanyaan tanpa memerlukan perluasan.
- source_word: θέλετε
  choice: kalian ingin
  rationale: θέλω menyatakan kehendak atau keinginan. “Kalian ingin” alami dalam bahasa Indonesia modern, sedangkan bentuk jamak “kalian” memperjelas bahwa Yesus menyapa kedua orang itu.
- source_word: ποιήσω
  choice: Aku lakukan
  rationale: Subjungtif aoristus sesudah θέλετε menyatakan tindakan yang mereka kehendaki agar Yesus lakukan. Susunan “ingin Aku lakukan” mempertahankan hubungan sintaksis itu secara alami.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: 'Dativus jamak ini bersifat benefaktif: tindakan tersebut akan dilakukan demi kepentingan mereka. “Bagi kalian” mempertahankan nuansa itu.'
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim; artikel Yunani tidak perlu diterjemahkan.
theological_decisions:
- issue: Nada dan daya pertanyaan Yesus
  choice: 'Pertanyaan langsung dan personal: “Apa yang kalian ingin Aku lakukan bagi kalian?”'
  alternative: “Apa yang kalian kehendaki supaya Aku perbuat bagi kalian?”
  rationale: Teks tidak perlu dibuat lebih formal atau ditafsirkan lebih jauh. Pilihan ini mempertahankan keterlibatan pribadi Yesus, bentuk sapaan jamak, dan keterusterangan pertanyaan Yunani tanpa mengurangi martabat tuturan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipilih untuk menyatakan orang kedua jamak secara eksplisit, sesuai θέλετε dan ὑμῖν. “Lalu” membantu mengungkapkan urutan tindakan partisip στὰς terhadap verba utama tanpa menghasilkan susunan yang kaku.
