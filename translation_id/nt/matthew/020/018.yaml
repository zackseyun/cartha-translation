id: MAT.20.18
reference: Matthew 20:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: id
  text: “Lihat, kita sedang naik ke Yerusalem, dan Anak Manusia[a] akan diserahkan[b] kepada imam-imam kepala dan ahli-ahli Taurat. Mereka akan menjatuhkan hukuman mati atas-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Manusia” adalah sebutan khas yang dipakai Yesus tentang diri-Nya dan mungkin menggemakan Daniel 7:13–14.
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan “akan diserahkan ke dalam kuasa mereka”; dalam konteks yang lebih sempit, kata ini dapat berarti “akan dikhianati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dalam bahasa Indonesia modern tanpa memakai bentuk yang terlalu arkais.
- source_word: ἀναβαίνομεν
  choice: kita sedang pergi
  rationale: Bentuk kini menunjukkan perjalanan yang sedang berlangsung. Unsur harfiah ‘naik’ tidak dinyatakan dalam teks utama karena ‘pergi ke Yerusalem’ lebih wajar dalam bahasa Indonesia dan arah perjalanan sudah jelas dari konteks.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan khas yang dipakai Yesus tentang diri-Nya dan kemungkinan gemanya terhadap Daniel 7:13–14.
- source_word: παραδοθήσεται
  choice: akan diserahkan
  rationale: Menyatakan penyerahan ke dalam kuasa pihak lain tanpa mempersempit maknanya hanya pada tindakan pengkhianatan.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: kepada imam-imam kepala
  rationale: Sebutan baku bagi para pemimpin kalangan imam; bentuk jamak sumber dipertahankan.
- source_word: γραμματεῦσιν
  choice: ahli-ahli Taurat
  rationale: Padanan Indonesia yang lazim dan mudah dipahami untuk para pakar serta penafsir hukum Taurat.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: Mereka akan menjatuhkan hukuman mati kepada-Nya
  rationale: 'Mengungkapkan secara alami makna yudisial: menetapkan kematian sebagai hukuman atas Dia.'
theological_decisions:
- issue: Penerjemahan gelar kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Manusia itu
  rationale: Menjaga gelar yang mengakar dalam teks Injil dan kemungkinan kaitannya dengan Daniel 7 tanpa mereduksinya menjadi ungkapan antropologis biasa.
- issue: Cakupan makna παραδοθήσεται
  choice: akan diserahkan
  alternative: akan dikhianati
  rationale: Tidak memasukkan rincian pelaku atau cara penyerahan yang tidak disebutkan dalam ayat ini; bentuk pasif menonjolkan perpindahan ke dalam kuasa pihak yang memusuhi-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi dua agar mudah dibaca. Kapitalisasi pronomina ‘-Nya’ mengikuti kebiasaan penghormatan dalam teks Alkitab bahasa Indonesia tanpa menambah isi semantis.
