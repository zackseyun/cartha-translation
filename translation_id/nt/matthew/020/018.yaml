  terminology: “Yerusalem,” “Anak Manusia,” “imam-imam kepala,” dan “ahli-ahli Taurat” merupakan padanan yang mapan dan sesuai. Catatan untuk “Anak Manusia” dan “diserahkan” mempertahankan nuansa tanpa memaksakan penafsiran.
