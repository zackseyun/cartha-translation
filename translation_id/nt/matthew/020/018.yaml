  to: “Lihat, kita sedang naik ke Yerusalem, dan Anak Manusia[a] akan diserahkan[b] kepada imam-imam kepala dan ahli-ahli Taurat. Mereka akan menjatuhkan hukuman mati atas-Nya.”
