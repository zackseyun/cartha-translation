    rationale: Dalam pemakaian Indonesia, hukuman dijatuhkan “atas” seseorang, atau seseorang “dijatuhi” hukuman. Revisi memperbaiki kelancaran tanpa mengubah makna κατακρινοῦσιν αὐτὸν θανάτῳ.
