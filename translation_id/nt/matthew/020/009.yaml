  source_fidelity: Draf menyampaikan penerimaan satu dinar untuk setiap orang dan mempertahankan keterangan waktu "sekitar jam sebelas." Namun, "Ketika" tidak menerjemahkan καὶ secara memadai sebagai penghubung naratif, sementara pengulangan "datang ... tiba" menjadikan satu tindakan ἐλθόντες seolah-olah dua tindakan.
