  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: id
  text: Dan mereka yang datang sekitar jam sebelas menerima masing-masing satu dinar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinar adalah koin perak Romawi, yang umumnya dipahami sebagai upah sehari yang lazim bagi seorang pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Ketika
  rationale: Dalam hubungan dengan partisip ἐλθόντες dan verba utama ἔλαβον, bahasa Indonesia alami dapat menyatakan hubungan waktunya dengan 'ketika'. Ini tidak menambahkan urutan yang melampaui tindakan kedatangan sebelum penerimaan upah.
- source_word: ἐλθόντες
  choice: yang datang ... tiba
  rationale: Partisip aoris ini menyatakan kedatangan kelompok tersebut. Konstruksi Indonesia memakai 'orang-orang yang datang ... itu' untuk mengidentifikasi kelompok dan 'tiba' dalam anak kalimat waktu agar hubungan dengan verba utama tetap jelas dan alami.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: orang-orang yang datang sekitar jam sebelas itu
  rationale: περὶ dengan penunjuk waktu diterjemahkan 'sekitar', dan bentuk berartikel dinyatakan dengan 'orang-orang ... itu'. Kata 'dipekerjakan' tidak ditambahkan karena tidak terdapat dalam klausa ini.
- source_word: ἔλαβον
  choice: menerima
  rationale: Dalam konteks pembayaran upah, 'menerima' menyampaikan bahwa pembayaran diberikan kepada mereka dan lebih tepat daripada 'mengambil'.
- source_word: ἀνὰ
  choice: masing-masing
  rationale: Preposisi distributif ἀνά menunjukkan satu dinar untuk setiap orang; 'masing-masing' adalah padanan Indonesia yang jelas dan alami.
- source_word: δηνάριον
  choice: satu dinar
  rationale: Istilah historis untuk koin dipertahankan sebagai 'dinar', sedangkan 'satu' memperjelas nilai tunggal yang dibagikan kepada setiap orang tanpa menggantinya dengan tafsiran berupa upah sehari.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Jam sebelas' mempertahankan cara penyebutan waktu dalam perumpamaan; dalam perhitungan waktu Yahudi saat itu, ini kira-kira pukul lima sore. Informasi tambahan tersebut tidak dimasukkan ke teks agar terjemahan tetap dekat dengan bentuk sumber.
