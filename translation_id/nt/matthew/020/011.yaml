  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: id
  text: Setelah menerimanya, mereka mulai bersungut-sungut terhadap pemilik kebun itu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Setelah menerimanya
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului kata kerja utama. Akhiran -nya secara wajar merujuk pada upah satu dinar dalam konteks sebelumnya, meskipun objeknya tersirat dalam teks Yunani.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel δέ berfungsi sebagai penghubung naratif ringan. Dalam bahasa Indonesia, urutan yang dibuka dengan 'Setelah' sudah menyampaikan alurnya secara alami tanpa perlu menambahkan 'dan' atau 'tetapi'.
- source_word: ἐγόγγυζον
  choice: mulai bersungut-sungut
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung atau baru mulai. 'Mulai bersungut-sungut' sesuai dengan urutan setelah penerimaan upah dan mempertahankan nuansa keluhan yang tidak puas.
- source_word: κατὰ
  choice: terhadap
  rationale: Dengan bentuk genitif, κατά menyatakan sikap menentang yang diarahkan kepada seseorang. 'Terhadap' alami dalam konstruksi bahasa Indonesia ini dan tidak sekeras 'melawan'.
- source_word: τοῦ οἰκοδεσπότου
  choice: tuan pemilik kebun itu
  rationale: οἰκοδεσπότης berarti kepala atau penguasa rumah tangga maupun kawasan miliknya. Dalam konteks perumpamaan tentang pekerja kebun anggur, ungkapan ini jelas dan alami, sekaligus mempertahankan unsur kewenangan dalam sebutan 'tuan'.
