id: MAT.20.8
reference: Matthew 20:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: id
  text: Ketika hari sudah petang, tuan kebun anggur itu berkata kepada pengurusnya, ‘Panggillah para pekerja dan bayarkan upah mereka, mulai dari mereka yang terakhir hingga mereka yang pertama.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Ketika hari sudah petang
  rationale: Mengungkapkan penanda waktu secara alami dan tetap mempertahankan arti bahwa petang telah tiba.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: tuan kebun anggur itu
  rationale: κύριος di sini menunjuk pemilik atau penguasa kebun dalam perumpamaan; 'tuan' sesuai konteks tanpa memasukkan gelar ilahi.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: kepada pengurusnya
  rationale: ἐπίτροπος menunjuk orang yang dipercayakan mengelola urusan tuannya; 'pengurus' jelas dan lazim dalam bahasa Indonesia.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: bayarkan upah mereka
  rationale: ἀπόδος mengandung arti memberikan apa yang menjadi hak atau kewajiban; bentuk ini alami untuk pembayaran upah.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: mulai dari mereka yang terakhir hingga mereka yang pertama
  rationale: Mempertahankan urutan dan kontras sumber tanpa mempersempit 'terakhir' menjadi kelompok tertentu secara eksplisit.
theological_decisions:
- issue: Kala kini historis pada λέγει
  choice: berkata
  alternative: 'berkata (secara harfiah: ''mengatakan'') / lalu berkata'
  rationale: Bahasa Yunani memakai kala kini historis untuk menghidupkan narasi. Dalam bahasa Indonesia, kala tidak ditandai secara morfologis; 'berkata' secara alami menyampaikan tindakan naratif tanpa mengubah makna atau menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan bentuk perintah hormat-naratif ‘Panggillah’ serta ‘bayarkan’. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan bagi pembaca.
