  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: id
  text: Bukankah aku berhak melakukan apa yang kuinginkan dengan apa yang menjadi milikku? Atau apakah matamu jahat karena aku baik?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah kamu iri karena aku baik?” Ungkapan “matamu jahat” adalah idiom untuk iri hati atau rasa dongkol karena tidak rela melihat kemurahan hati kepada orang lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: berhak
  rationale: Dalam pertanyaan retoris ini, kata tersebut menyatakan kebebasan yang sah atau hak untuk bertindak. 'Berhak' alami dalam bahasa Indonesia dan mempertahankan nuansa kewenangan yang sah.
- source_word: ὃ θέλω ποιῆσαι
  choice: melakukan apa yang kuinginkan
  rationale: Ungkapan ini menyatakan kehendak pribadi; pilihan ini jelas, modern, dan setia pada makna θέλω.
- source_word: ἐν τοῖς ἐμοῖς
  choice: dengan milikku sendiri
  rationale: Frasa ini menunjuk pada apa yang menjadi kepunyaan sang pemilik tanah. 'Dengan milikku sendiri' menyampaikan kepemilikan dengan jelas dalam konteks perumpamaan.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: apakah matamu jahat
  rationale: Terjemahan ini mempertahankan citra harfiah idiom Yunani dan kontrasnya dengan kebaikan sang pemilik, sementara makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: ἀγαθός
  choice: baik
  rationale: '''Baik'' adalah padanan langsung yang mempertahankan kontras leksikal dengan ''jahat''; kemurahan hati tersirat oleh konteks tanpa dimasukkan secara eksklusif ke dalam teks utama.'
theological_decisions:
- issue: Apakah idiom ὁ ὀφθαλμός σου πονηρός perlu ditafsirkan langsung dalam teks utama
  choice: Mempertahankan ungkapan 'apakah matamu jahat' dalam teks utama
  alternative: Apakah kamu iri karena aku murah hati?
  rationale: Bentuk harfiah mempertahankan citra sumber serta ketegangan antara mata yang jahat dan pemilik yang baik. Catatan kaki memberi pembaca makna idiomatis yang mungkin dimaksud tanpa membatasi teks utama pada satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti orang pertama memakai bentuk terikat 'ku-' dan '-ku' sesuai ujaran langsung. Metafora sumber dipertahankan, dengan penjelasan idiom dalam catatan kaki.
