  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Pergilah kalian juga ke kebun anggur, dan Aku akan memberi kalian apa yang adil.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang benar” atau “apa yang wajar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: kepada mereka
  rationale: Bentuk datif jamak ini menunjuk kepada para pekerja lain yang baru disebut; pronomina sederhana alami dan jelas dalam konteks.
- source_word: εἶπεν
  choice: ia berkata
  rationale: Padanan naratif yang lazim bagi λέγω dan mempertahankan pengantar ujaran langsung tanpa menambahkan nuansa perintah yang tidak dinyatakan oleh verba ini.
- source_word: Ὑπάγετε
  choice: pergilah
  rationale: Imperatif jamak ὑπάγω di sini merupakan perintah langsung untuk pergi ke kebun anggur; bentuk ini alami dalam bahasa Indonesia.
- source_word: καὶ ὑμεῖς
  choice: kalian juga
  rationale: Gabungan ini menekankan bahwa mereka pun, seperti para pekerja sebelumnya, diutus. 'Kalian' dengan jelas menandai orang kedua jamak.
- source_word: ἀμπελῶνα
  choice: kebun anggur
  rationale: Padanan baku ἀμπελών dalam bahasa Indonesia dan sesuai dengan latar perumpamaan.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: apa pun yang benar
  rationale: Klausa relatif netral ini berarti apa pun yang benar atau adil. 'Benar' mempertahankan cakupan moralnya tanpa membatasinya pada keadilan hukum atau gagasan subjektif tentang kewajaran.
- source_word: δώσω ὑμῖν
  choice: aku akan memberikan kepada kalian
  rationale: Mempertahankan arti dasar δίδωμι, yaitu 'memberikan'. Walaupun konteksnya menyangkut upah, sumber Yunani tidak memakai verba khusus untuk membayar.
theological_decisions:
- issue: Pemaknaan δίκαιον dalam konteks penetapan upah
  choice: benar
  alternative: adil; wajar
  rationale: '''Benar'' mempertahankan dimensi etis δίκαιον dan ambiguitasnya, tanpa mempersempitnya menjadi keadilan legal atau kewajaran yang dirasakan.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk memperjelas bentuk jamak ὑμεῖς; 'aku' sesuai dengan ujaran langsung seorang tokoh dalam narasi. Penempatan catatan kaki langsung sesudah frasa yang dijelaskan.
