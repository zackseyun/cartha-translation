  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: id
  text: Mereka menjawab kepadanya, “Karena tidak seorang pun mempekerjakan kami.” Ia berkata kepada mereka, “Pergilah juga kalian ke kebun anggur itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Jawab mereka
  rationale: Bentuk kini historis berfungsi menghidupkan narasi. Dalam bahasa Indonesia, bentuk tanpa penandaan waktu sudah alami; 'jawab' memperjelas bahwa ucapan ini merupakan tanggapan terhadap pertanyaan sebelumnya.
- source_word: Ὅτι
  choice: Karena
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan mengapa mereka masih berada di sana, sehingga 'karena' paling alami.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan bermartabat yang mempertahankan penyangkalan menyeluruh.
- source_word: ἐμισθώσατο
  choice: mempekerjakan
  rationale: Kata ini menunjuk pada tindakan menyewa atau mengupah orang sebagai pekerja. 'Mempekerjakan' menyampaikan maknanya secara jelas dalam bahasa Indonesia modern.
- source_word: λέγει
  choice: Katanya
  rationale: Bentuk kini historis Yunani tidak perlu ditandai secara temporal dalam bahasa Indonesia. 'Katanya' mengalir alami dalam narasi dan tetap memperkenalkan ujaran langsung.
- source_word: Ὑπάγετε
  choice: Pergilah
  rationale: Imperatif ini adalah perintah langsung untuk pergi; partikel '-lah' memberi bentuk perintah yang alami dan dignified tanpa terdengar kasar.
- source_word: καὶ ὑμεῖς
  choice: juga kalian
  rationale: Mempertahankan penekanan inklusif bahwa kelompok ini pun disuruh pergi, bersama kelompok-kelompok sebelumnya.
- source_word: ἀμπελῶνα
  choice: kebun anggur itu
  rationale: Padanan lazim bagi ἀμπελών. Artikel tertentu merujuk pada kebun anggur yang sudah dikenal dalam konteks perumpamaan, sehingga diterjemahkan 'itu'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Bentuk kini historis Yunani diterjemahkan dengan konstruksi naratif Indonesia yang tidak menandai waktu secara eksplisit, sehingga catatan kaki tidak diperlukan. Pronomina 'kalian' dipakai untuk menunjukkan bahwa bentuk Yunani bersifat jamak.
