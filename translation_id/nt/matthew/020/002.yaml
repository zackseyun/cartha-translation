  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: id
  text: Setelah ia bersepakat dengan para pekerja itu mengenai upah satu dinar sehari[a], ia mengirim mereka ke kebun anggurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu dinar merupakan upah harian yang lazim bagi seorang pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Setelah menyepakati
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tercapainya kesepakatan.
- source_word: δὲ
  choice: —
  rationale: Di sini δέ merupakan penghubung naratif ringan yang tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia karena anak kalimat pembuka sudah menghubungkan alur dengan wajar.
- source_word: ἐργατῶν
  choice: para pekerja
  rationale: Padanan modern dan umum yang sesuai dengan konteks orang-orang yang diupah untuk bekerja di kebun anggur.
- source_word: ἐκ δηναρίου
  choice: upah satu dinar
  rationale: Frasa ini menyatakan jumlah upah yang disepakati. Kata 'upah' memperjelas fungsi jumlah tersebut, sedangkan nama mata uang kuno 'dinar' dipertahankan.
- source_word: τὴν ἡμέραν
  choice: untuk sehari
  rationale: Akusatif durasi ini menunjukkan bahwa satu dinar adalah upah untuk satu hari, tanpa menambahkan rincian yang tidak dinyatakan dalam teks Yunani.
- source_word: ἀπέστειλεν
  choice: ia menyuruh mereka pergi
  rationale: Dalam konteks pengiriman pekerja ke tempat kerja, ungkapan ini terdengar lebih alami daripada 'mengutus' dan tetap menyampaikan tindakan menyuruh mereka menuju kebun.
- source_word: ἀμπελῶνα
  choice: kebun anggur
  rationale: Padanan baku dan jelas untuk kebun tempat tanaman anggur dibudidayakan.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Bentuk posesif ini secara langsung mengacu pada kebun anggur milik tuan tanah tersebut.
