  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: id
  text: Maka mereka pun pergi. Kemudian, sekitar jam dua belas siang dan jam tiga sore,[a] ia keluar lagi dan berbuat demikian juga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sekitar jam keenam dan kesembilan,” menurut perhitungan waktu Yahudi.'
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Maka mereka pun pergi
  rationale: οἱ menunjuk kembali kepada para pekerja yang baru diajak berbicara; δέ merupakan penghubung ringan, sedangkan ἀπῆλθον berarti pergi atau berangkat. Ungkapan ini alami dalam narasi Indonesia.
- source_word: πάλιν ἐξελθὼν
  choice: ia keluar lagi
  rationale: πάλιν menyatakan pengulangan, dan partisip aoris ἐξελθών menyatakan tindakan yang berkaitan secara temporal dengan verba utama. Susunan Indonesia ini alami tanpa memperinci hubungan waktunya secara berlebihan.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: sekitar jam dua belas siang dan jam tiga sore
  rationale: περί berarti 'sekitar'. Jam keenam dan kesembilan menurut perhitungan waktu Yahudi kira-kira sama dengan pukul dua belas siang dan pukul tiga sore; waktu modern dipakai dalam teks agar langsung dipahami pembaca umum.
- source_word: ἐποίησεν ὡσαύτως
  choice: berbuat demikian juga
  rationale: ἐποίησεν memperoleh isi dari ὡσαύτως, yang berarti 'dengan cara yang sama'. 'Berbuat demikian juga' ringkas dan mempertahankan rujukannya kepada tindakan sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Waktu dikonversi ke padanan modern dalam teks, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
