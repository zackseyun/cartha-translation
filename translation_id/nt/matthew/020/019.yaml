  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: id
  text: Mereka akan menyerahkan Dia kepada orang-orang bukan Yahudi untuk diolok-olok, dicambuk, dan disalibkan, dan pada hari ketiga Dia akan dibangkitkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan bangkit.” Verba Yunani berbentuk pasif (“Dia akan dibangkitkan”), suatu ungkapan kebangkitan yang lazim dan dapat menyiratkan tindakan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: akan menyerahkan
  rationale: Menyatakan pemindahan seseorang ke dalam kuasa pihak lain tanpa mempersempit maknanya menjadi tindakan pengkhianatan.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Dalam konteks nubuat penderitaan yang berlatar Yahudi, frasa ini menunjuk kepada orang-orang bukan Yahudi; ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: untuk diolok-olok
  rationale: Menyampaikan tujuan atau hasil yang dinyatakan konstruksi εἰς dengan infinitif, serta mempertahankan bahwa Dia menjadi sasaran tindakan itu.
- source_word: μαστιγῶσαι
  choice: dicambuk
  rationale: Padanan modern dan mudah dipahami bagi pencambukan sebagai hukuman, tanpa memakai istilah yang arkais.
- source_word: σταυρῶσαι
  choice: disalibkan
  rationale: Secara langsung menyatakan hukuman mati melalui penyaliban dan secara alami berbagi subjek penderita dengan dua verba pasif sebelumnya.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Padanan temporal yang tepat dan idiomatis.
- source_word: ἐγερθήσεται
  choice: Dia akan dibangkitkan
  rationale: Mempertahankan bentuk pasif masa depan dalam bahasa Yunani dan nuansa bahwa kebangkitan terjadi oleh tindakan Allah.
theological_decisions:
- issue: Bentuk verba kebangkitan
  choice: Dia akan dibangkitkan
  alternative: Dia akan bangkit
  rationale: Bentuk Yunani adalah pasif; terjemahan pasif mempertahankan ungkapan sumber dan kemungkinan nuansa tindakan ilahi tanpa meniadakan pernyataan lain mengenai peran Kristus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian pasif “diolok-olok, dicambuk, dan disalibkan” dipilih agar alami dalam bahasa Indonesia sekaligus menjaga satu sasaran yang sama. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
