  terminology: ‘Orang-orang bukan Yahudi’ merupakan padanan yang lebih presisi untuk τοῖς ἔθνεσιν dalam konteks penderitaan Yesus. Istilah ‘dibangkitkan’ dan catatan alternatif ‘bangkit’ dengan tepat mempertahankan ketegangan bentuk pasif Yunani tanpa memaksakan penafsiran doktrinal.
