  rationale: Revisi hanya memperjelas rujukan kontekstual τοῖς ἔθνεσιν menjadi ‘orang-orang bukan Yahudi’ dan merapikan penghubung kalimat. Bentuk pasif pada tindakan penghinaan hingga penyaliban tetap wajar dalam bahasa Indonesia dan sesuai dengan Yesus sebagai sasaran bersama dari infinitif-infinitif Yunani. Bentuk pasif ‘akan dibangkitkan’ serta catatan alternatif dipertahankan.
