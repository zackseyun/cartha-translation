  source_fidelity: 'Struktur dasar dan makna tindakan yang dinubuatkan akurat: παραδώσουσιν diterjemahkan tepat sebagai penyerahan kepada pihak berkuasa, tiga infinitif tindakan terhadap Yesus tersampaikan, dan ἐγερθήσεται dipertahankan dalam bentuk pasif. Namun, τοῖς ἔθνεσιν dalam konteks ini secara khusus berarti orang-orang bukan Yahudi/Gentiles, bukan ‘bangsa-bangsa lain’ dalam arti bangsa atau negara lain secara umum.'
