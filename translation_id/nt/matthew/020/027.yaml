base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: id
  text: Dan siapa pun yang ingin menjadi yang pertama di antara kalian akan menjadi budak kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hamba.” Kata Yunani doulos lebih kuat daripada kata yang diterjemahkan “pelayan” dalam ayat sebelumnya dan biasanya menunjuk seorang budak atau hamba yang terikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: siapa pun yang ingin
  rationale: Gabungan pronomina relatif, ἄν, dan bentuk subjungtif menyatakan kondisi umum atau tak tentu. Frasa ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur kehendak pada θέλῃ.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Dalam konteks kedudukan sosial di dalam komunitas, frasa ini menunjukkan posisi di antara para murid, bukan sekadar lokasi fisik.
- source_word: εἶναι πρῶτος
  choice: menjadi yang pertama
  rationale: Ungkapan ini menyatakan keinginan mencapai kedudukan teratas. 'Menjadi yang pertama' lebih alami dalam bahasa Indonesia daripada 'berada sebagai yang pertama' dan tidak mengurangi makna statusnya.
- source_word: ἔσται
  choice: akan menjadi
  rationale: Bentuk futur diterjemahkan secara langsung. Dalam konteks, perkataan ini memiliki daya normatif, tetapi terjemahan futur mempertahankan bentuk serta ketegangan ungkapan Yunani tanpa mengubahnya menjadi 'harus menjadi'.
- source_word: ὑμῶν
  choice: kalian
  rationale: 'Bentuk genitif ini menunjukkan hubungan dengan seluruh kelompok: orang tersebut menjadi budak bagi kalian.'
- source_word: δοῦλος
  choice: budak
  rationale: δοῦλος lebih kuat daripada διάκονος dalam ayat sebelumnya dan lazim menunjuk orang yang berada dalam status perbudakan. 'Budak' mempertahankan peningkatan retoris dan kerasnya pembalikan status yang disampaikan Yesus.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perkataan tentang kemuridan
  choice: budak
  alternative: pelayan; hamba
  rationale: Perkataan ini membalik ambisi akan kedudukan dengan perendahan diri yang radikal. Karena ayat sebelumnya memakai διάκονος, menerjemahkan δοῦλος sebagai 'pelayan' akan mengaburkan peningkatan kekuatan istilah. 'Budak' mempertahankan perbedaan leksikal tanpa melunakkan ketegangan teologis dan sosialnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai karena sapaan ditujukan kepada kelompok murid dan selaras dengan bentuk jamak ὑμῖν/ὑμῶν. Istilah 'budak' sengaja dipertahankan untuk mencerminkan kekuatan δοῦλος serta kontras dengan ayat sebelumnya.
