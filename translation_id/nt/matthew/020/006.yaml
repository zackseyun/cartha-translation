  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: id
  text: Kira-kira pada jam kesebelas, ia keluar dan menemukan orang-orang lain yang sedang berdiri. Lalu ia berkata kepada mereka,[a] “Mengapa kalian berdiri di sini sepanjang hari tanpa bekerja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai bentuk kini historis: “ia berkata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Kira-kira pada jam kesebelas
  rationale: περί dengan akusatif menyatakan perkiraan waktu. Ungkapan 'jam kesebelas' mempertahankan cara penghitungan waktu dalam perumpamaan; catatan kaki memberi padanan waktu modern.
- source_word: ἐξελθὼν
  choice: ia keluar
  rationale: Partisip aoris mendahului verba utama dan secara alami diterjemahkan sebagai tindakan berurutan dalam bahasa Indonesia.
- source_word: εὗρεν ἄλλους ἑστῶτας
  choice: menemukan beberapa orang lain berdiri di sana
  rationale: Terjemahan ini mempertahankan makna dasar εὗρεν, bentuk substantival ἄλλους, dan keadaan berdiri yang dinyatakan oleh partisip perfek ἑστῶτας. 'Beberapa orang lain' lebih wajar daripada hanya 'yang lain' dalam konteks ini tanpa menentukan gender.
- source_word: καὶ λέγει αὐτοῖς
  choice: Lalu ia berkata kepada mereka
  rationale: Bahasa Indonesia lazim memakai bentuk lampau kontekstual dalam narasi karena tidak memiliki kala gramatikal yang setara. Catatan kaki menjelaskan present historis Yunani.
- source_word: Τί ὧδε ἑστήκατε
  choice: Mengapa kalian berdiri ... di sini
  rationale: Τί berfungsi idiomatis sebagai 'mengapa'; perfek ἑστήκατε menggambarkan keadaan berdiri yang berlangsung, yang dalam bahasa Indonesia cukup dinyatakan oleh 'berdiri' bersama keterangan durasi.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: menganggur ... sepanjang hari
  rationale: '''Menganggur'' menyampaikan keadaan tidak bekerja dari ἀργοί tanpa harus dibatasi pada status sosial-ekonomi formal, sedangkan ''sepanjang hari'' merupakan padanan alami bagi frasa durasi tersebut.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan 'kalian' dipakai karena αὐτοῖς dan verba orang kedua jamak menunjuk kepada sejumlah pekerja. Struktur kalimat dibuat alami tanpa menghilangkan idiom waktu kuno atau nuansa keadaan tidak bekerja.
