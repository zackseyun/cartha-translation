revisions:
- from: Kira-kira pada jam kesebelas, ia keluar dan menemukan beberapa orang lain berdiri di sana.[a] Lalu ia berkata kepada mereka,[b] “Mengapa kalian berdiri menganggur di sini sepanjang hari?”
  to: Kira-kira pada jam kesebelas, ia keluar dan menemukan orang-orang lain yang sedang berdiri. Lalu ia berkata kepada mereka,[a] “Mengapa kalian berdiri di sini sepanjang hari tanpa bekerja?”
  rationale: Teks direvisi untuk tidak menambahkan nuansa ‘beberapa’ pada ἄλλους dan untuk memperbaiki catatan penjelas. Penanda catatan dipindahkan agar catatan kini historis tetap melekat pada ‘ia berkata’; catatan tentang jam kesebelas tidak diperlukan untuk kelancaran teks, tetapi disediakan sebagai catatan leksikal tambahan. Makna ayat tidak diubah.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:54:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Teks utama pada dasarnya setia kepada Yunani: περί + akusatif diterjemahkan dengan ‘kira-kira’, jam kesebelas dipertahankan, dan pertanyaan tentang keadaan menganggur sepanjang hari tersampaikan. Namun, ‘beberapa orang lain’ menambahkan nuansa kuantitas yang tidak dinyatakan secara khusus oleh ἄλλους, dan catatan a secara keliru menyebut seluruh penjelasannya ‘secara harfiah’ serta menyajikan pukul lima sore sebagai keterangan tanpa syarat.'
  naturalness: Bahasa Indonesia draf umumnya alami dan baku. ‘Orang-orang lain yang sedang berdiri’ lebih idiomatis dan tidak menambahkan kuantitas tertentu. ‘Mengapa kalian berdiri di sini sepanjang hari tanpa bekerja?’ jelas, alami, dan menangkap ἀργοί dalam konteks pekerjaan harian.
  terminology: Tidak ada istilah teologis atau nama yang memerlukan penyesuaian. ‘Jam kesebelas’ tepat dipertahankan sebagai bingkai waktu perumpamaan. Catatan waktu modern harus diberi sebagai perkiraan berdasarkan penghitungan waktu siang kuno, bukan sebagai bagian dari makna harfiah frasa Yunani.
  issues:
  - severity: medium
    issue: Catatan kaki a mencampurkan terjemahan harfiah dengan konversi waktu kontekstual.
    rationale: περὶ τὴν ἑνδεκάτην secara harfiah berarti ‘kira-kira pada jam kesebelas’; ‘sekitar pukul lima sore’ adalah perkiraan yang bergantung pada penghitungan jam siang dari sekitar matahari terbit. Karena itu, penjelasan tersebut tidak boleh diperkenalkan seluruhnya sebagai ‘secara harfiah’ atau dinyatakan tanpa kualifikasi.
  - severity: low
    issue: ‘Beberapa orang lain’ memberi nuansa jumlah yang tidak eksplisit.
    rationale: ἄλλους berbentuk jamak dan berarti ‘orang-orang lain/yang lain’, tetapi tidak secara khusus berarti ‘beberapa’. Menghilangkan ‘beberapa’ menjaga ketepatan tanpa mengurangi kelancaran.
  revised_text: Kira-kira pada jam kesebelas, ia keluar dan menemukan orang-orang lain yang sedang berdiri. Lalu ia berkata kepada mereka,[a] “Mengapa kalian berdiri di sini sepanjang hari tanpa bekerja?”
  revised_footnotes:
