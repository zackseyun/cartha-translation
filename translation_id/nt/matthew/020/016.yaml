  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: id
  text: Demikianlah, yang terakhir akan menjadi yang pertama, dan yang pertama akan menjadi yang terakhir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Menandai kesimpulan atau penerapan dari perumpamaan sebelumnya dengan daya inferensial yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἔσονται
  choice: akan menjadi
  rationale: Menerjemahkan bentuk futur εἰμί secara langsung dan wajar dalam bahasa Indonesia.
- source_word: οἱ ἔσχατοι
  choice: orang-orang yang terakhir
  rationale: Adjektiva berartikel digunakan secara substantival. Bentuk ini jelas dan tetap mempertahankan gagasan urutan atau kedudukan tanpa menafsirkannya sebagai 'yang paling rendah'.
- source_word: πρῶτοι
  choice: yang pertama
  rationale: Mempertahankan predikat dan pertentangan ringkas dengan 'yang terakhir'.
- source_word: καὶ
  choice: dan
  rationale: Mencerminkan koordinasi sederhana dalam teks Yunani tanpa menambahkan nuansa pertentangan eksplisit seperti 'tetapi'.
- source_word: οἱ πρῶτοι
  choice: orang-orang yang pertama
  rationale: Menerjemahkan adjektiva substantival secara paralel dengan 'orang-orang yang terakhir' dan menjaga keseimbangan ungkapan pembalikan.
- source_word: ἔσχατοι
  choice: yang terakhir
  rationale: Melengkapi rumusan pembalikan secara simetris dan tidak mempersempit maknanya menjadi nilai sosial atau keselamatan.
theological_decisions:
- issue: Sifat pembalikan dalam perkataan ini
  choice: Diterjemahkan sebagai ungkapan pembalikan yang ringkas tanpa menentukan apakah 'terakhir/pertama' menunjuk pada urutan waktu, kedudukan sosial, upah, atau keselamatan.
  alternative: Menafsirkannya secara khusus sebagai pembalikan sosial, pembalikan upah dalam pemuridan, atau urutan keselamatan.
  rationale: Teks Yunani menyatakan pembalikan itu tanpa mempersempit cakupannya; terjemahan mempertahankan ketegangan dan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada wajar dan bermartabat. Struktur paralel dipertahankan untuk membawa daya retoris teks Yunani; pengulangan 'orang-orang yang' dipilih demi kejelasan bagi pembaca umum.
