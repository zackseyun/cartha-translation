  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: id
  text: Tidak akan demikian di antara kalian.[a] Sebaliknya, siapa pun yang ingin menjadi besar di antara kalian harus menjadi pelayan kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidaklah demikian di antara kalian.” Kata kerja Yunani berbentuk futur (“akan terjadi/berlaku”), yang dalam konteks ini dapat menyatakan bagaimana keadaan itu tidak seharusnya berlaku di antara para pengikut Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Namun, tidaklah demikian di antara kalian
  rationale: 'Bentuk futur ἔσται dipahami memiliki daya normatif dalam ajaran Yesus: keadaan seperti itu tidak boleh berlaku dalam komunitas para murid. Bahasa Indonesia yang alami menyatakannya dengan ''tidaklah demikian'', sementara catatan kaki mempertahankan kemungkinan terjemahan futur yang lebih harfiah.'
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Sebaliknya, siapa pun yang ingin
  rationale: ὃς ἂν dengan subjungtif menyatakan kondisi umum atau tak tentu, sehingga tepat diterjemahkan 'siapa pun'. θέλῃ menyatakan kehendak atau keinginan dan secara alami diterjemahkan 'ingin'.
- source_word: μέγας γενέσθαι
  choice: menjadi besar
  rationale: γενέσθαι menunjukkan proses atau peralihan menjadi sesuatu, bukan sekadar keadaan; karena itu 'menjadi besar' mempertahankan nuansa ingrisifnya.
- source_word: διάκονος
  choice: pelayan
  rationale: Dalam konteks ini διάκονος menunjuk kepada orang yang melayani, bukan secara khusus jabatan gerejawi di kemudian hari. 'Pelayan' juga membedakannya dari istilah yang terutama menekankan status sebagai budak.
- source_word: ὑμῶν
  choice: kalian
  rationale: Genitif ini menyatakan relasi pelayanan kepada kelompok para murid dan secara alami diterjemahkan 'pelayan kalian'.
theological_decisions:
- issue: Hakikat kebesaran dalam komunitas para pengikut Yesus
  choice: Pernyataan diterjemahkan sebagai pembalikan normatif atas pola kekuasaan duniawi, dengan kebesaran diwujudkan melalui pelayanan.
  alternative: Memahami διάκονος sebagai jabatan gerejawi 'diaken', atau mengaburkan gambaran konkret pelayanan menjadi nasihat umum tentang kerendahan hati.
  rationale: Konteks membandingkan cara para penguasa bangsa-bangsa memerintah dengan standar Yesus bagi murid-murid-Nya. Terjemahan mempertahankan bahasa konkret tentang pelayanan tanpa memasukkan struktur gerejawi yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menandai bahwa sapaan Yunani berbentuk jamak. 'Sebaliknya' menyampaikan kontras kuat ἀλλά secara alami.
