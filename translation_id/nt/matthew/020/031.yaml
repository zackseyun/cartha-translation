id: MAT.20.31
reference: Matthew 20:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: id
  text: Orang banyak menegur mereka agar mereka diam, tetapi mereka justru berseru lebih keras lagi[a], “Tuhan, kasihanilah kami, Anak Daud!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semakin gencar.” Kata Yunani berbentuk perbandingan ini dapat menekankan meningkatnya kegigihan secara umum atau kerasnya suara secara khusus.
    reason: lexical_alternative
  - marker: b
    text: “Anak Daud” adalah gelar mesianik, bukan sekadar pernyataan tentang garis keturunan.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: orang banyak
  rationale: Ungkapan ini alami dalam narasi Indonesia dan tepat menyatakan sekelompok besar orang.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Kata ini mempertahankan tindakan mencela atau melarang dengan tegas tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: ἵνα σιωπήσωσιν
  choice: supaya mereka diam
  rationale: Terjemahan ini menyampaikan tujuan teguran orang banyak secara jelas dan alami.
- source_word: μεῖζον
  choice: semakin keras
  rationale: Dalam kaitannya dengan berseru, komparatif ini secara alami menunjukkan peningkatan kerasnya seruan, meskipun dapat pula dipahami lebih umum sebagai 'semakin gencar'.
- source_word: ἔκραξαν
  choice: berseru
  rationale: Kata ini menyampaikan seruan lantang dan mendesak dengan register naratif yang wajar.
- source_word: Κύριε
  choice: Tuhan
  rationale: Pilihan ini mempertahankan sapaan hormat sekaligus kemungkinan bobot kristologisnya tanpa mempersempitnya menjadi sekadar 'Guru' atau 'Tuan'.
- source_word: ἐλέησον ἡμᾶς
  choice: kasihanilah kami
  rationale: Ungkapan ini alami, langsung, dan mempertahankan permohonan belas kasihan dalam bentuk imperatif.
- source_word: υἱὸς Δαυίδ
  choice: Anak Daud
  rationale: Terjemahan harfiah ini mempertahankan bentuk gelar kerajaan dan mesianik dalam Injil Matius, bukan sekadar menjelaskan garis keturunan.
theological_decisions:
- issue: Gelar mesianik yang dikenakan kepada Yesus
  choice: Anak Daud
  alternative: keturunan Daud
  rationale: Bentuk gelar dipertahankan karena membawa makna kerajaan dan mesianik dalam konteks Matius; 'keturunan Daud' akan mempersempitnya menjadi keterangan silsilah.
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: ‘Tuhan’ mempertahankan ketegangan antara sapaan hormat dan kemungkinan bobot kristologis, tanpa memutuskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Partikel ‘malah’ menyampaikan kontras kuat antara upaya membungkam dan respons kedua orang itu.
