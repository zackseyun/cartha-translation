  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: id
  text: Namun, Yesus menjawab, “Kamu tidak tahu apa yang kamu minta. Sanggupkah kamu meminum cawan yang akan Kuminum?”[a] Mereka berkata kepada-Nya, “Kami sanggup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “cawan penderitaan yang akan Kuminum.” Dalam Alkitab, “cawan” sering menjadi gambaran untuk bagian yang ditetapkan bagi seseorang, khususnya penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Namun, Yesus menjawab
  rationale: Dalam bahasa Indonesia, satu verba 'menjawab' secara wajar mewakili rumusan naratif Yunani yang memakai partisipel dan verba 'berkata'; 'namun' menyampaikan kontras ringan dari δέ tanpa menghasilkan ungkapan kaku 'menjawab dan berkata'.
- source_word: Οὐκ οἴδατε
  choice: Kamu tidak tahu
  rationale: Mempertahankan arti dasar οἶδα sebagai 'tahu' dan tidak mempersempitnya secara interpretatif menjadi 'mengerti'.
- source_word: τί αἰτεῖσθε
  choice: apa yang kamu minta
  rationale: Ungkapan Indonesia yang alami untuk permintaan yang sedang diajukan; bentuk 'kamu' dapat merujuk kepada kedua murid dalam konteks.
- source_word: δύνασθε
  choice: Sanggupkah kamu
  rationale: '''Sanggup'' menekankan kemampuan atau kapasitas dan sesuai dengan bobot pertanyaan ini.'
- source_word: πιεῖν τὸ ποτήριον
  choice: minum dari cawan
  rationale: Mempertahankan metafora 'cawan'. Bahasa Indonesia secara alami mengatakan 'minum dari cawan', meskipun Yunani secara harfiah berbunyi 'meminum cawan'.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: yang akan segera Kuminum
  rationale: '''Akan segera'' menyampaikan daya prospektif atau kedekatan waktu dari μέλλω, sementara bentuk ''Kuminum'' mempertahankan metafora dengan susunan Indonesia yang lancar.'
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepada-Nya
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: Δυνάμεθα
  choice: Kami sanggup
  rationale: Menggemakan pilihan 'sanggupkah' untuk menjaga kesinambungan leksikal dan penekanan pada kemampuan.
theological_decisions:
- issue: Daya metaforis 'cawan'
  choice: Mempertahankan 'cawan' dalam teks utama dan menjelaskan kaitannya dengan bagian yang ditetapkan, terutama penderitaan, dalam catatan kaki.
  alternative: penderitaan yang akan segera Kualami
  rationale: Teks Yunani mempertahankan metafora yang kaya secara alkitabiah. Menggantinya dengan 'penderitaan' akan menutup keluasan citra dan menyelesaikan ketegangan teologis secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kamu' dipakai secara alami untuk sapaan jamak kepada kedua murid; kapitalisasi pada bentuk yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat setelah pertanyaan yang memuat metafora cawan.
