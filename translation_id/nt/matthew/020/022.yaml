  naturalness: '"Meminum cawan yang akan Kuminum" adalah bahasa Indonesia baku yang alami dalam register Alkitabiah serta mempertahankan metafora sumber. Selebihnya, susunan dialog, sapaan jamak "kamu," dan "Kami sanggup" sudah jelas dan wajar.'
  terminology: '"Cawan" tepat dan harus dipertahankan sebagai metafora. "Sanggup" konsisten untuk δύνασθε/Δυνάμεθα. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan kebiasaan penerbitan Alkitab Indonesia.'
