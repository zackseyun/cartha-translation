id: MAT.20.34
reference: Matthew 20:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: id
  text: Yesus, tergerak oleh belas kasihan, menyentuh mata mereka. Seketika itu juga mereka dapat melihat[a] dan mengikuti-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "melihat kembali." Kata Yunani ini dapat berarti "mendapatkan kembali penglihatan" atau, secara lebih harfiah, "menengadah"; dalam konteks ini, kata tersebut menunjuk pada diperolehnya penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: tergerak oleh belas kasihan
  rationale: Partisip ini menyatakan belas kasihan yang mendalam dan mendorong tindakan; ungkapan ini alami dalam bahasa Indonesia serta mempertahankan daya emosionalnya.
- source_word: δὲ
  choice: Karena
  rationale: δέ adalah penghubung ringan dalam alur cerita dan tidak harus diterjemahkan tersendiri. Susunan kalimat Indonesia menghubungkan partisip sebab dengan tindakan Yesus secara alami tanpa memberi nuansa pertentangan.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Dalam konteks penyembuhan, kata ini menunjuk pada sentuhan fisik dan paling jelas diterjemahkan dengan 'menyentuh'.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: mata mereka
  rationale: Genitif yang menyertai ἅπτομαι secara wajar diungkapkan sebagai objek langsung dalam bahasa Indonesia.
- source_word: εὐθέως
  choice: Seketika itu juga
  rationale: Ungkapan ini menegaskan bahwa hasil tindakan Yesus terjadi langsung dan tetap terasa alami serta bermartabat.
- source_word: ἀνέβλεψαν
  choice: mereka dapat melihat
  rationale: Dalam konteks penyembuhan orang buta, verba ini berarti memperoleh atau mendapatkan kembali penglihatan. Pilihan ini jelas tanpa menentukan apakah mereka buta sejak lahir atau pernah dapat melihat sebelumnya.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti-Nya
  rationale: Pilihan ini mempertahankan arti harfiah mengikuti Yesus sekaligus kemungkinan gema pemuridan, tanpa menyatakan lebih daripada teks.
theological_decisions:
- issue: Hasil penyembuhan dalam ἀνέβλεψαν
  choice: mereka dapat melihat
  alternative: mereka melihat kembali; mereka menengadah
  rationale: Konteks mukjizat dan εὐθέως menunjukkan bahwa penglihatan mereka dipulihkan dengan segera. Namun, 'dapat melihat' tidak memaksakan anggapan bahwa keduanya pernah melihat sebelumnya.
- issue: Makna ἠκολούθησαν αὐτῷ
  choice: mengikuti-Nya
  alternative: menjadi murid-Nya
  rationale: Teks mengatakan bahwa mereka mengikuti Yesus dan mungkin menggemakan pemuridan, tetapi tidak secara eksplisit menjelaskan status, kedalaman, atau lamanya tindakan itu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Urutan klausa disesuaikan agar partisip Yunani terdengar wajar. Bentuk 'dapat melihat' dipilih untuk mempertahankan kepastian penyembuhan tanpa menambahkan riwayat kebutaan yang tidak dinyatakan teks.
