  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: id
  text: Ketika mereka keluar dari Yerikho, sejumlah besar orang mengikuti Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: ketika mereka keluar
  rationale: Partisipel kini genitif jamak berfungsi sebagai keterangan waktu. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan tindakan yang berlangsung bersamaan dengan tindakan utama.
- source_word: ἀπὸ Ἰεριχὼ
  choice: dari Yerikho
  rationale: Preposisi ἀπό menandai gerak menjauh dari suatu tempat; dalam konstruksi bahasa Indonesia, 'keluar dari Yerikho' menyampaikan maknanya secara jelas dan idiomatis.
- source_word: ἠκολούθησεν
  choice: mengikuti
  rationale: Aoristus aktif indikatif dari ἀκολουθέω menyatakan tindakan mengikuti seseorang; 'mengikuti' merupakan padanan modern yang langsung dan sesuai konteks.
- source_word: αὐτῷ
  choice: Dia
  rationale: Pronomina datif tunggal paling wajar merujuk kepada Yesus. Huruf kapital membantu menunjukkan rujukannya tanpa mengganti bentuk tunggal Yunani dengan bentuk jamak.
- source_word: ὄχλος πολύς
  choice: orang banyak
  rationale: Gabungan nomina dan adjektiva ini menunjuk pada kerumunan yang berjumlah besar. 'Orang banyak' merupakan ungkapan Alkitabiah yang tetap mudah dipahami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan pronomina tunggal αὐτῷ sesudah klausa partisipel berpelaku jamak
  choice: Orang banyak mengikuti Yesus ('Dia').
  alternative: Orang banyak mengikuti rombongan itu ('mereka').
  rationale: Teks Yunani beralih dari bentuk jamak 'mereka keluar' ke bentuk tunggal 'mengikuti Dia'. Konteks paling wajar menempatkan Yesus sebagai rujukan tunggal, dan terjemahan mempertahankan peralihan tersebut tanpa meratakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan temporal serta peralihan dari subjek jamak ke objek tunggal. Tidak ditambahkan catatan kaki karena alternatif 'berangkat dari Yerikho' tidak membawa perbedaan makna yang cukup penting dalam bahasa Indonesia.
