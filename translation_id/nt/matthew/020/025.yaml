  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: id
  text: Namun, Yesus memanggil mereka mendekat kepada-Nya lalu berkata, “Kalian tahu bahwa para penguasa bangsa-bangsa bukan Yahudi[a] memerintah mereka dengan sewenang-wenang, dan para pembesar[b] menjalankan kekuasaan atas mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para penguasa bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang besar mereka” atau “para pejabat tinggi mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil mereka untuk mendekat
  rationale: Partisip aoris medium ini menggambarkan Yesus memanggil para murid datang kepada-Nya. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan gerak mendekat tanpa menerjemahkan bentuk medium secara berlebihan.
- source_word: Οἴδατε
  choice: Kalian tahu
  rationale: Walaupun berbentuk perfek, οἶδα memiliki makna kini. “Kalian tahu” merupakan padanan Indonesia yang idiomatis; “kalian” cocok karena Yesus berbicara langsung kepada sekelompok murid.
- source_word: ἄρχοντες
  choice: para penguasa
  rationale: Kata ini menunjuk kepada orang-orang yang memerintah. “Para penguasa” luas, jelas, dan sesuai dengan konteks pemerintahan.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Yahudi, ἔθνη lazim menunjuk kepada bangsa-bangsa bukan Yahudi. “Bangsa-bangsa lain” mempertahankan nuansa itu secara alami, sementara catatan kaki mencatat padanan yang lebih harfiah.
- source_word: κατακυριεύουσιν
  choice: berkuasa dengan sewenang-wenang atas
  rationale: Verba majemuk ini menyatakan penggunaan kekuasaan atau ketuanan secara menindas. Padanan ini mempertahankan daya negatifnya dan lebih alami daripada terjemahan harfiah seperti “bertuan atas”.
- source_word: οἱ μεγάλοι
  choice: para pembesar
  rationale: Adjektiva substantival ini menunjuk kepada orang-orang terkemuka atau pejabat tinggi. “Para pembesar” ringkas, bermartabat, dan sesuai dengan ranah sosial-politik ayat ini.
- source_word: κατεξουσιάζουσιν
  choice: menjalankan kekuasaan atas
  rationale: Padanan ini mempertahankan arti penggunaan wewenang atas pihak lain serta paralelnya dengan klausa sebelumnya, tanpa menyamakan sepenuhnya kedua verba Yunani.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada bangsa-bangsa sebagai orang-orang yang diperintah. “Mereka” mempertahankan bentuk pronominal dan menghindari pengulangan yang berat.
theological_decisions:
- issue: Makna ἐθνῶν dalam perkataan Yesus yang berlatar Yahudi
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa; bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini ungkapan tersebut kemungkinan besar membedakan pola pemerintahan bangsa-bangsa bukan Yahudi dari pola yang harus berlaku di antara murid-murid. Namun, karena kata Yunani itu secara leksikal juga berarti “bangsa-bangsa”, alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Penggambaran penggunaan kekuasaan dalam κατακυριεύουσιν dan κατεξουσιάζουσιν
  choice: membedakan “berkuasa dengan sewenang-wenang” dari “menjalankan kekuasaan”
  alternative: menerjemahkan keduanya dengan “menguasai” atau “menindas”
  rationale: Kedua verba sejajar dan sama-sama dapat bernuansa negatif, tetapi tidak identik. Terjemahan utama mempertahankan daya menindas pada verba pertama serta gagasan penggunaan wewenang pada verba kedua, tanpa menambahkan penilaian teologis yang melampaui teks.
- issue: Rujukan οἱ μεγάλοι
  choice: para pembesar
  alternative: orang-orang besar mereka; para pejabat tinggi mereka
  rationale: Bentuk Yunani secara gramatikal maskulin dan menunjuk kepada tokoh terkemuka dalam tatanan kekuasaan. “Para pembesar” tidak meniadakan latar tersebut, tetapi juga tidak mempersempit rujukannya hanya kepada satu jabatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam lisan yang bermartabat untuk perkataan langsung. “Kalian” dipakai karena sapaan ditujukan kepada sekelompok murid; “namun” dan “lalu berkata” menjaga alur narasi tetap alami. Dua ungkapan kekuasaan dibedakan untuk mencerminkan paralelisme tanpa menghapus perbedaan leksikal Yunani.
