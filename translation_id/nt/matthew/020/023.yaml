  to: Ia berkata kepada mereka, “Cawan-Ku memang akan kamu minum,[a] tetapi duduk di sebelah kanan-Ku dan di sebelah kiri-Ku[b] bukanlah wewenang-Ku untuk memberikannya, melainkan bagi mereka yang untuknya hal itu telah dipersiapkan oleh Bapa-Ku.”
  rationale: Revisi mengganti “hak-Ku” dengan “wewenang-Ku” agar lebih dekat dengan οὐκ ἔστιν ἐμὸν δοῦναι tanpa menafsirkan ketegangan kristologis. Klausa eliptis terakhir dirumuskan kembali menjadi bahasa Indonesia baku yang jelas, sambil mempertahankan bahwa tempat tersebut telah dipersiapkan oleh Bapa. Jangkar dan substansi catatan tetap sesuai dengan teks.
