review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: masa depan pada πίεσθε, penegasan μὲν, metafora “cawan,” serta pembatasan mengenai pemberian tempat di kanan dan kiri dipertahankan. Namun, “bukanlah hak-Ku” menambah nuansa hak/prerogatif yang tidak dinyatakan secara langsung oleh οὐκ ἔστιν ἐμὸν δοῦναι; padanan yang lebih dekat ialah “bukanlah wewenang-Ku untuk memberikannya” atau “bukanlah milik-Ku untuk memberikannya.” Klausa akhir juga perlu diperbaiki karena “mereka yang baginya hal itu” tidak gramatikal dan mengaburkan relatif jamak οἷς.'
  naturalness: Kalimat pertama alami. Kalimat kedua dalam draf, khususnya “bagi mereka yang baginya hal itu telah dipersiapkan,” tidak alami dalam bahasa Indonesia baku. Bentuk “melainkan bagi mereka yang untuknya hal itu telah dipersiapkan” jelas, tetap mempertahankan elipsis dan pasif perfektum sumber, serta tidak menambahkan penafsiran.
  terminology: “Cawan,” “Bapa-Ku,” dan bentuk hormat -Ku/-Nya sesuai register Alkitab Indonesia modern. Catatan cawan secara umum memadai, meskipun “nasib” dapat terdengar kurang terarah; “jalan yang telah ditetapkan” lebih idiomatis dan tetap bersifat penjelasan metaforis. Jangkar catatan b ditempatkan tepat pada frasa tempat duduk dan alternatifnya relevan.
  issues:
  - severity: medium
    issue: Padanan “bukanlah hak-Ku untuk memberikannya”
    rationale: Kata “hak” dapat menggeser οὐκ ἔστιν ἐμὸν δοῦναι ke ranah entitlement/hak. “Wewenang-Ku” lebih langsung bagi kemampuan atau kewenangan untuk menganugerahkan tempat kehormatan, tanpa harmonisasi doktrinal tambahan.
  - severity: high
    issue: Klausa “bagi mereka yang baginya hal itu telah dipersiapkan” tidak gramatikal dan repetitif
    rationale: Struktur ini tidak menyatakan relatif οἷς secara alami. “Bagi mereka yang untuknya hal itu telah dipersiapkan oleh Bapa-Ku” memulihkan relasi yang dimaksud, mempertahankan pasif ἡτοίμασται dan agen ὑπὸ τοῦ πατρός μου.
  - severity: low
    issue: Catatan a memakai “nasib”
    rationale: Bukan kesalahan makna, tetapi “jalan yang telah ditetapkan” lebih lazim dan kurang berkonotasi fatalistis dalam bahasa Indonesia modern.
  revised_text: Ia berkata kepada mereka, “Cawan-Ku memang akan kamu minum,[a] tetapi duduk di sebelah kanan-Ku dan di sebelah kiri-Ku[b] bukanlah wewenang-Ku untuk memberikannya, melainkan bagi mereka yang untuknya hal itu telah dipersiapkan oleh Bapa-Ku.”
