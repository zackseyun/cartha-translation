source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Cawan-Ku memang akan kamu minum,[a] tetapi duduk di sebelah kanan-Ku dan di sebelah kiri-Ku[b] bukanlah wewenang-Ku untuk memberikannya, melainkan bagi mereka yang untuknya hal itu telah dipersiapkan oleh Bapa-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cawan” adalah kiasan untuk penderitaan atau jalan yang telah ditetapkan bagi Yesus, yang juga akan dialami oleh murid-murid-Nya.
    reason: metaphor_explanation
  - marker: b
    text: Atau, “di sisi kanan-Ku dan di sisi kiri-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Bentuk kini historis Yunani dialihkan menjadi bentuk naratif lampau yang alami dalam bahasa Indonesia, tanpa mengubah maknanya.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Cawan-Ku memang akan kamu minum
  rationale: Metafora “cawan” dipertahankan, sedangkan “memang” menyampaikan daya penegasan μὲν sebelum kontras berikutnya.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: duduk di sebelah kanan-Ku dan di sebelah kiri-Ku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan tempat kehormatan di samping Yesus tanpa menafsirkannya secara berlebihan.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: bukanlah hak-Ku untuk memberikannya
  rationale: Ungkapan ini menyampaikan bahwa pemberian kedudukan tersebut bukan prerogatif Yesus dalam pernyataan ini. Kata “memberikannya” tetap dekat dengan δοῦναι.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: Kedudukan itu diperuntukkan bagi mereka yang baginya hal itu telah dipersiapkan
  rationale: Klausa Yunani bersifat eliptis. Penyebutan “kedudukan itu” memperjelas acuannya dalam bahasa Indonesia, sementara bentuk pasif perfektum dipertahankan dengan “telah dipersiapkan”.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: oleh Bapa-Ku
  rationale: Terjemahan langsung yang mempertahankan Bapa sebagai pelaku dalam konstruksi pasif, tanpa menambahkan kata seperti “saja” yang tidak tersurat.
theological_decisions:
- issue: Implikasi kristologis dari perkataan bahwa kedudukan itu bukan hak Yesus untuk diberikan
  choice: Pernyataan diterjemahkan secara langsung tanpa tambahan yang menjelaskan atau mengurangi ketegangannya.
  alternative: Menambahkan penjelasan seperti “bukan hak-Ku untuk memberikannya terlepas dari Bapa” atau memparafrasakannya agar ketegangan kristologis tidak terasa.
  rationale: Teks sumber membedakan peran Yesus dan Bapa dalam pemberian kedudukan tersebut. Terjemahan tidak seharusnya menyisipkan harmonisasi doktrinal yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora “cawan,” bentuk pasif “telah dipersiapkan,” dan ketegangan teologis dalam pernyataan Yesus tetap dipertahankan.
