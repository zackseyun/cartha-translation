  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: id
  text: sama seperti Anak Manusia datang bukan untuk dilayani, melainkan untuk melayani dan untuk memberikan nyawa-Nya sebagai tebusan bagi banyak orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “sebagai tebusan sebagai ganti banyak orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: sama seperti
  rationale: Menghubungkan teladan Anak Manusia dengan ajaran sebelumnya dan mempertahankan daya perbandingannya secara alami dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan baku yang mempertahankan fungsi gelar serta kaitan antarteksnya, termasuk gema Daniel.
- source_word: οὐκ ἦλθεν
  choice: datang bukan
  rationale: Menyampaikan aoristus sebagai tindakan lampau dalam ungkapan Indonesia yang alami; susunan ini juga menjaga pertentangan dengan tujuan kedatangan yang berikutnya.
- source_word: διακονηθῆναι
  choice: untuk dilayani
  rationale: Mempertahankan bentuk pasif dan memakai kosakata umum, bukan istilah gerejawi yang lebih sempit.
- source_word: ἀλλὰ διακονῆσαι
  choice: melainkan untuk melayani
  rationale: Menjaga pertentangan verbal langsung antara dilayani dan melayani.
- source_word: καὶ δοῦναι
  choice: dan untuk memberikan
  rationale: Mempertahankan koordinasi infinitif dengan tujuan kedatangan sebelumnya tanpa menambahkan gagasan penyerahan yang tidak harus dinyatakan oleh kata ini.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawa-Nya
  rationale: Dalam konteks kematian, ψυχή menunjuk pada hidup yang diserahkan. 'Nyawa-Nya' alami dan lebih tepat daripada 'jiwa-Nya', yang dapat disalahpahami hanya sebagai unsur nonjasmani.
- source_word: λύτρον
  choice: tebusan
  rationale: Menyatakan harga yang diberikan untuk pembebasan dan mempertahankan makna penebusan secara ringkas.
- source_word: ἀντὶ πολλῶν
  choice: bagi banyak orang
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tidak meniadakan nuansa penggantian; daya ἀντί yang lebih eksplisit dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya ἀντί dalam perkataan tentang tebusan
  choice: bagi banyak orang
  alternative: sebagai tebusan untuk menggantikan banyak orang
  rationale: Ayat ini menggambarkan kematian Yesus dalam corak perwakilan atau penggantian. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan kemungkinan menyatakan daya pertukaran atau penggantian ἀντί dengan lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'untuk' dipertahankan untuk memperjelas kesejajaran tujuan kedatangan. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerjemahan Alkitab Indonesia tanpa menambah isi semantis.
