  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: id
  text: kata mereka, “Orang-orang yang datang terakhir ini bekerja satu jam, dan engkau menyamakan mereka dengan kami[a] yang telah menanggung beban sepanjang hari dan panas terik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperlakukan mereka sama dengan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel kini nominatif jamak ini melanjutkan tindakan pada ayat sebelumnya. Dalam bahasa Indonesia, klausa langsung “kata mereka” lebih alami daripada bentuk partisipial, tanpa mengubah hubungan naratifnya.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Orang-orang yang datang terakhir ini
  rationale: Dalam konteks perumpamaan, ungkapan ini menunjuk kepada para pekerja yang datang atau dipekerjakan paling akhir. Pilihan ini alami dan memperjelas acuan kontekstual tanpa menambahkan penafsiran teologis.
- source_word: μίαν ὥραν ἐποίησαν
  choice: hanya bekerja satu jam
  rationale: ποιέω bersama keterangan waktu secara idiomatis berarti bekerja atau menghabiskan waktu tersebut. “Hanya” menyampaikan daya keluhan yang tersirat oleh kontras satu jam dengan kerja sepanjang hari.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: engkau menyamakan mereka dengan kami
  rationale: Terjemahan ini mempertahankan gambaran langsung konstruksi Yunani, yaitu membuat mereka setara dengan para pekerja yang bekerja lebih lama.
- source_word: τοῖς βαστάσασι
  choice: yang telah menanggung
  rationale: βαστάζω dapat berarti membawa atau menanggung. Dalam konteks kerja berat, “menanggung” mencakup beban fisik sekaligus ketahanan menjalani kondisi tersebut.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: beban kerja sepanjang hari
  rationale: Ungkapan ini menggambarkan beratnya kerja selama satu hari penuh. “Beban kerja sepanjang hari” mempertahankan citra beban sambil terdengar wajar dalam bahasa Indonesia modern.
- source_word: τὸν καύσωνα
  choice: panas terik
  rationale: καύσων menunjuk pada panas yang membakar atau menyengat. “Panas terik” merupakan padanan Indonesia yang alami dan kuat.
theological_decisions:
- issue: Keluhan dalam perumpamaan mengenai kesetaraan dan keadilan
  choice: Keluhan para pekerja disampaikan secara lugas melalui “engkau menyamakan mereka dengan kami.”
  alternative: Menerjemahkannya secara lebih interpretatif sebagai tuduhan bahwa pemilik kebun telah bertindak tidak adil.
  rationale: Teks menyampaikan protes para pekerja, tetapi tidak secara eksplisit menyebut tindakan pemilik kebun tidak adil. Terjemahan mempertahankan ketegangan perumpamaan tanpa menyelesaikan persoalan teologisnya di dalam redaksi ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “engkau” dipertahankan karena sesuai dengan dialog langsung dalam gaya Alkitab Indonesia, sedangkan “panas terik” dan “beban kerja sepanjang hari” mudah dipahami pembaca umum.
