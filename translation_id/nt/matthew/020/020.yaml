base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: id
  text: Kemudian ibu dari anak-anak Zebedeus datang kepada Yesus bersama anak-anaknya, sambil sujud di hadapan-Nya[a] dan meminta sesuatu dari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Nya”; kata Yunani yang digunakan dapat berarti sujud dengan penuh hormat, memberi penghormatan, atau menyembah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penghubung waktu yang alami dalam bahasa Indonesia dan menunjukkan kelanjutan urutan peristiwa.
- source_word: προσῆλθεν αὐτῷ
  choice: datang kepada Yesus
  rationale: προσέρχομαι menyatakan gerak mendekat kepada seseorang. Nama “Yesus” dipakai agar rujukan pronominal jelas dan alami dalam bahasa Indonesia.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ibu anak-anak Zebedeus
  rationale: Mempertahankan konstruksi relasional Yunani secara ringkas dan jelas tanpa menambahkan nama perempuan tersebut.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: bersama anak-anaknya
  rationale: μετά dengan genitif menyatakan penyertaan; bentuk ini alami dalam bahasa Indonesia.
- source_word: προσκυνοῦσα
  choice: sujud di hadapan-Nya
  rationale: Mengungkapkan tindakan merendahkan diri dan memberi hormat tanpa memastikan bahwa tindakan itu harus dipahami secara khusus sebagai penyembahan.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: dan meminta sesuatu dari-Nya
  rationale: Mempertahankan objek tak tentu τι, “sesuatu,” dan makna sumber pada παρά dengan genitif.
theological_decisions:
- issue: Makna προσκυνοῦσα ketika tindakan itu ditujukan kepada Yesus
  choice: sujud di hadapan-Nya
  alternative: menyembah-Nya; memberi hormat kepada-Nya
  rationale: προσκυνέω dapat menunjuk pada sujud sebagai penghormatan ataupun penyembahan. Teks utama mempertahankan tindakan fisik-reverensial yang lebih luas, sedangkan kemungkinan makna “menyembah” dicatat tanpa memutuskan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sujud di hadapan-Nya” mudah dipahami serta mempertahankan rentang makna tindakan penghormatan tanpa memaksakan penafsiran teologis yang lebih sempit.
