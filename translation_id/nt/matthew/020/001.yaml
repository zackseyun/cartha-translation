id: MAT.20.1
reference: Matthew 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: id
  text: Sebab Kerajaan Surga itu seperti seorang pemilik rumah yang pergi pagi-pagi sekali untuk mengupah para pekerja untuk bekerja di kebun anggurnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία γάρ ἐστιν
  choice: Sebab ... itu seperti
  rationale: Mempertahankan hubungan penjelas γάρ dengan konteks sebelumnya dan perbandingan yang diperkenalkan oleh ὁμοία.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk idiom Matius, dengan makna pemerintahan atau kedaulatan surgawi tetap terbuka dari konteks.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: seorang tuan rumah
  rationale: οἰκοδεσπότης sudah menyatakan seorang manusia yang menjadi kepala atau pemilik rumah; menerjemahkan kedua unsur secara terpisah akan terasa berlebihan dalam bahasa Indonesia.
- source_word: ἅμα πρωῒ
  choice: pagi-pagi sekali
  rationale: Menyampaikan waktu yang sangat pagi atau saat fajar secara alami tanpa menetapkan jam tertentu.
- source_word: μισθώσασθαι ἐργάτας
  choice: untuk mengupah para pekerja
  rationale: Menunjukkan tindakan mempekerjakan dengan bayaran, bukan sekadar mengajak bekerja.
- source_word: εἰς τὸν ἀμπελῶνα αὐτοῦ
  choice: bagi kebun anggurnya
  rationale: Dalam konteks perekrutan, εἰς menyatakan tujuan atau tempat penugasan para pekerja; 'bagi' terdengar alami dan jelas.
theological_decisions:
- issue: Cakupan perbandingan Kerajaan Surga
  choice: Mempertahankan bentuk umum 'Kerajaan Surga itu seperti seorang tuan rumah'
  alternative: Menjelaskan bahwa seluruh kisah atau tindakan sang tuan rumahlah yang menjadi perbandingan
  rationale: Teks Yunani secara gramatikal langsung membandingkan kerajaan dengan seorang οἰκοδεσπότης; terjemahan tidak mempersempit atau menjelaskan lebih jauh daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Tuan rumah' dipakai dalam arti kepala atau pemilik rumah tangga, sesuai konteks pemilik kebun anggur.
