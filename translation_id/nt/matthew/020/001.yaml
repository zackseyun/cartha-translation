    rationale: Dalam bahasa Indonesia modern, “tuan rumah” lazimnya berarti host, sedangkan οἰκοδεσπότης menunjuk pada pemilik atau kepala rumah tangga; konteks berikutnya memperlihatkan bahwa ia juga pemilik kebun anggur.
  - severity: low
    issue: “bagi kebun anggurnya” kurang jelas untuk εἰς τὸν ἀμπελῶνα αὐτοῦ.
    rationale: Preposisi εἰς dalam konstruksi ini menunjukkan tujuan atau lokasi para pekerja dipekerjakan. “Untuk bekerja di kebun anggurnya” menyampaikan hal itu dengan jelas dan alami.
