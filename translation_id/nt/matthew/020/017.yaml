review_pass:
  verdict: revise
  source_fidelity: Draf menyampaikan tujuan perjalanan, kedua belas murid, percakapan yang berlangsung dalam perjalanan, dan kelanjutan ujaran dengan baik. Namun, ἀναβαίνων secara khusus memuat arah “naik” ke Yerusalem, yang dapat dipertahankan secara alami dalam bahasa Indonesia. Selain itu, “mengajak ... menyendiri” dapat terdengar seolah-olah para murid diajak melakukan tindakan menyendiri, bukan bahwa Yesus memisahkan mereka sebagai kelompok untuk berbicara secara pribadi.
  naturalness: Bahasa draf umumnya modern dan lancar. “Ke tempat tersendiri” lebih jelas dan idiomatis untuk menyatakan pemisahan kelompok itu dari orang lain. “Di tengah perjalanan” menghindari pengulangan langsung dengan frasa pembuka.
  terminology: “Yesus,” “Yerusalem,” dan “kedua belas murid itu” tepat dan konsisten dengan penggunaan Injil dalam bahasa Indonesia. Tidak ada istilah teologis khusus yang memerlukan perubahan.
  issues:
  - severity: medium
    issue: Arah “naik” dalam ἀναβαίνων tidak terwakili.
    rationale: Walaupun “pergi ke” atau “menuju” alami, kata Yunani ini secara eksplisit menyatakan perjalanan naik ke Yerusalem. “Sedang naik ke Yerusalem” mempertahankan unsur tersebut tanpa menjadi tidak wajar.
  - severity: medium
    issue: “Mengajak kedua belas murid itu menyendiri” kurang jelas untuk κατ’ ἰδίαν.
    rationale: Frasa ini dapat dipahami sebagai ajakan agar murid-murid menyendiri, sedangkan teks menyatakan bahwa Yesus membawa mereka sebagai kelompok ke sisi/tempat yang terpisah. “Membawa ... ke tempat tersendiri” menyatakan fungsi idiom itu dengan lebih jelas.
  revised_text: Ketika Yesus sedang naik ke Yerusalem, Ia membawa kedua belas murid itu ke tempat tersendiri. Di tengah perjalanan, Ia berkata kepada mereka,
  revised_footnotes: []
  revision_rationale: Revisi mempertahankan aspek arah dalam ἀναβαίνων dan memperjelas bahwa κατ’ ἰδίαν menggambarkan Yesus memisahkan kedua belas murid itu untuk berbicara kepada mereka, bukan tindakan menyendiri yang dilakukan para murid. Koma akhir dipertahankan karena ujaran Yesus berlanjut pada ayat berikutnya.
