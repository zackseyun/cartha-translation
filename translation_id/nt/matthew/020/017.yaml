  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: id
  text: Ketika Yesus sedang naik ke Yerusalem, Ia membawa kedua belas murid itu ke tempat tersendiri. Di tengah perjalanan, Ia berkata kepada mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: sedang pergi
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan tindakan utama. Dalam bahasa Indonesia, “sedang pergi” alami; unsur harfiah “naik” tidak dinyatakan karena perjalanan ke Yerusalem secara idiomatis tidak selalu disebut “naik” dalam bahasa Indonesia modern.
- source_word: εἰς Ἱεροσόλυμα
  choice: ke Yerusalem
  rationale: Preposisi εἰς dengan nama kota secara alami menyatakan tujuan, sehingga diterjemahkan “ke”.
- source_word: παρέλαβεν
  choice: mengajak
  rationale: Dalam konteks ini, kata kerja tersebut berarti membawa atau mengikutsertakan orang bersama diri sendiri. “Mengajak” terdengar alami dan, bersama “menyendiri,” menyampaikan bahwa Yesus membawa para murid terpisah dari orang lain.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: kedua belas murid itu
  rationale: Terjemahan ini mempertahankan angka dan nomina μαθητάς, sekaligus memakai penanda definit yang alami dalam bahasa Indonesia.
- source_word: κατ’ ἰδίαν
  choice: menyendiri
  rationale: Ungkapan ini menunjukkan bahwa Yesus dan kedua belas murid memisahkan diri dari orang lain untuk berbicara secara khusus. “Menyendiri” mempertahankan nuansa pemisahan, bukan sekadar kerahasiaan.
- source_word: ἐν τῇ ὁδῷ
  choice: Dalam perjalanan
  rationale: Padanan alami yang mempertahankan latar perjalanan tanpa membatasi makna pada jalan fisik tertentu.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Menerjemahkan verba umum λέγω secara langsung dan membiarkan isi perkataan muncul pada ayat berikutnya.
