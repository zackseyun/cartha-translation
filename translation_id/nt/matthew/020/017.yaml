revisions:
- from: Ketika Yesus sedang pergi ke Yerusalem, Ia mengajak kedua belas murid itu menyendiri. Dalam perjalanan, Ia berkata kepada mereka,
  to: Ketika Yesus sedang naik ke Yerusalem, Ia membawa kedua belas murid itu ke tempat tersendiri. Di tengah perjalanan, Ia berkata kepada mereka,
  rationale: Revisi mempertahankan aspek arah dalam ἀναβαίνων dan memperjelas bahwa κατ’ ἰδίαν menggambarkan Yesus memisahkan kedua belas murid itu untuk berbicara kepada mereka, bukan tindakan menyendiri yang dilakukan para murid. Koma akhir dipertahankan karena ujaran Yesus berlanjut pada ayat berikutnya.
