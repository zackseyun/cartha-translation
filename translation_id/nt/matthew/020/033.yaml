  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Tuhan,[a] kiranya mata kami dibuka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan”.
    reason: κύριος dalam sapaan ini dapat berarti “Tuhan” atau sapaan hormat “Tuan”.
lexical_decisions:
- source_word: λέγουσιν
  choice: Mereka berkata
  rationale: Bentuk kini historis Yunani diterjemahkan dengan bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina datif menandai pihak yang menjadi tujuan perkataan; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: Κύριε
  choice: Tuhan
  rationale: Vokatif κύριος dapat menyatakan sapaan hormat maupun pengakuan otoritas; “Tuhan” mempertahankan bobot sapaan kepada Yesus tanpa memastikan seberapa penuh pengertian para pembicara.
- source_word: ἵνα ἀνοιγῶσιν
  choice: bukalah
  rationale: Klausa ἵνα dengan bentuk pasif subjungtif menyatakan isi permohonan. Imperatif Indonesia menghasilkan permohonan yang alami; makna bahwa mata mereka menerima tindakan dipahami dari konteks.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: mata kami
  rationale: Artikel, nomina, dan pronomina genitif secara alami dinyatakan sebagai frasa posesif “mata kami”.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” sesuai dengan penggunaan Matius dan mempertahankan kemungkinan makna teologis, sedangkan “Tuan” juga mungkin secara leksikal sebagai sapaan hormat. Alternatif dicatat agar ambiguitas sumber tidak disembunyikan.
- issue: Bentuk permohonan agar mata dibuka
  choice: bukalah mata kami
  alternative: agar mata kami dibukakan
  rationale: Pilihan utama lebih alami sebagai jawaban langsung atas pertanyaan Yesus, sementara alternatif lebih dekat kepada struktur pasif subjungtif Yunani. Keduanya tidak menentukan pelaku secara eksplisit di luar lawan bicara mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Permohonan langsung “bukalah mata kami” dipilih agar alami bagi pembaca umum, dengan ambiguitas sapaan κύριος dipertahankan melalui catatan kaki.
