  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: id
  text: Ketika para pekerja yang pertama itu datang[a], mereka mengira bahwa mereka akan menerima lebih banyak. Tetapi mereka juga menerima masing-masing satu dinar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika mereka yang pertama datang”; yang dimaksud ialah para pekerja yang dipekerjakan paling awal dalam perumpamaan ini.
    reason: lexical_alternative
  - marker: b
    text: Dinar adalah uang logam yang lazim menjadi upah harian seorang pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: maju
  rationale: Partisip aoris ini berfungsi secara temporal. Dalam konteks pembagian upah, 'maju' secara alami menyatakan bahwa mereka datang menghadap untuk menerima bayaran.
- source_word: οἱ πρῶτοι
  choice: para pekerja yang datang pertama itu
  rationale: Ungkapan ini menunjuk kepada kelompok pekerja yang dipekerjakan paling awal dalam perumpamaan, bukan kepada peringkat abstrak. 'Para pekerja' disediakan dari konteks agar rujukannya jelas.
- source_word: ἐνόμισαν
  choice: mereka menyangka
  rationale: νομίζω menyatakan dugaan atau harapan yang ternyata keliru; 'menyangka' menyampaikan nuansa itu dengan wajar.
- source_word: πλεῖον
  choice: lebih banyak
  rationale: Bentuk komparatif ini mengacu pada jumlah upah yang lebih besar; 'lebih banyak' ringkas dan alami.
- source_word: λήμψονται
  choice: akan menerima
  rationale: Bentuk futur dalam isi pikiran mereka secara alami diterjemahkan 'akan menerima' dalam bahasa Indonesia tanpa keharusan mengubah kala seperti dalam bahasa Inggris.
- source_word: τὸ ἀνὰ δηνάριον
  choice: masing-masing satu dinar
  rationale: ἀνά dengan akusatif menyatakan pembagian per orang. Artikel menunjuk pada upah yang telah disepakati, sedangkan 'masing-masing satu dinar' mengungkapkan makna distributif dengan jelas.
- source_word: καὶ αὐτοί
  choice: mereka pun
  rationale: Ungkapan ini menekankan bahwa kelompok pertama juga menerima jumlah yang sama; 'pun' mempertahankan penekanan tambahan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Maju' dipilih sesuai adegan penerimaan upah; 'para pekerja yang datang pertama' memperjelas rujukan tanpa mengubah makna. Istilah budaya 'dinar' dipertahankan dan dijelaskan dalam catatan kaki.
