revisions:
- from: Lalu Yesus berkata kepadanya, “Apa yang kauinginkan?” Perempuan itu berkata kepada-Nya, “Perintahkanlah[a] agar kedua anakku ini duduk, yang seorang di sebelah kanan-Mu dan yang seorang lagi di sebelah kiri-Mu, dalam kerajaan-Mu[b].”
  to: Lalu Yesus berkata kepadanya, “Apa yang kauinginkan?” Perempuan itu berkata kepada-Nya, “Katakanlah[a] agar kedua putraku ini duduk, yang seorang di sebelah kanan-Mu dan yang seorang lagi di sebelah kiri-Mu, dalam kerajaan-Mu[b].”
  rationale: Revisi mengembalikan Εἰπὲ kepada padanan utama yang lebih dekat, “Katakanlah,” sambil mencatat kemungkinan kontekstualnya. “Kedua anakku ini” diganti menjadi “kedua putraku ini” agar makna maskulin υἱοί tetap terlihat. Struktur permintaan, lokasi di kanan dan kiri, dan ambiguitas βασιλεία tetap dipertahankan.
