  verdict: revise
  source_fidelity: Revisi diperlukan pada δύο υἱοί μου dan Εἰπὲ. Υἱοί secara khusus berarti “putra-putra/anak-anak laki-laki,” sehingga “kedua anakku” menghilangkan penandaan gender yang ada dalam teks Yunani. Εἰπὲ secara dasar adalah “katakanlah”; “Perintahkanlah” merupakan pengembangan kontekstual yang mungkin, tetapi lebih kuat daripada verba sumber dan tidak perlu untuk menghasilkan bahasa Indonesia yang alami.
  naturalness: Teks pada umumnya alami, jelas, dan berregister modern-baku. “Katakanlah agar ...” adalah konstruksi Indonesia yang wajar dalam permintaan langsung ini. Bentuk “yang seorang ... dan yang seorang lagi ...” mempertahankan kesejajaran sumber dengan baik.
  terminology: “Kerajaan-Mu” merupakan padanan yang tepat dan mapan bagi βασιλείᾳ σου serta tidak memaksakan penafsiran mengenai bentuk atau waktu kerajaan itu. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan konvensi penerbitan Alkitab Indonesia.
  issues:
  - severity: medium
    issue: “kedua anakku” tidak menerjemahkan penandaan maskulin pada υἱοί.
    rationale: Kata Yunani υἱοί berarti “putra-putra” atau “anak-anak laki-laki,” bukan sekadar “anak-anak.” “Kedua putraku ini” mempertahankan informasi leksikal tersebut secara alami.
  - severity: medium
    issue: “Perintahkanlah” lebih interpretatif daripada Εἰπὲ.
    rationale: Verba sumber adalah imperatif dari λέγω, “katakanlah.” Konteks memang menyiratkan bahwa ucapan Yesus akan berwibawa, tetapi terjemahan utama sebaiknya tidak menaikkan makna menjadi perintah. Alternatif kontekstual dapat dicatat dalam catatan kaki.
