  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Apa yang kauinginkan?” Perempuan itu berkata kepada-Nya, “Katakanlah[a] agar kedua putraku ini duduk, yang seorang di sebelah kanan-Mu dan yang seorang lagi di sebelah kiri-Mu, dalam kerajaan-Mu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetapkanlah” atau “Perintahkanlah.” Secara harfiah, “Katakanlah.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “kerajaan” juga dapat berarti “pemerintahan” atau “kekuasaan sebagai raja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Apa yang kauinginkan?
  rationale: Pertanyaan ini secara langsung menanyakan permintaan perempuan itu. Bentuk ini wajar dalam bahasa Indonesia modern dan mempertahankan daya lugas θέλω.
- source_word: Εἰπὲ
  choice: Perintahkanlah
  rationale: Secara leksikal berarti “katakanlah”, tetapi dalam konstruksi permohonan ini ucapan Yesus dimaksudkan menetapkan tempat duduk tersebut. “Perintahkanlah” menghasilkan bahasa Indonesia yang lebih alami tanpa mengubahnya menjadi “kabulkanlah”, yang akan lebih interpretatif.
- source_word: ἵνα καθίσωσιν
  choice: agar ... duduk
  rationale: Klausa ἵνα menyatakan isi permintaan, yaitu supaya kedua anak itu mendapat tempat duduk tersebut. Bentuk aktif mempertahankan καθίσωσιν tanpa menambahkan gagasan bahwa mereka didudukkan oleh pihak lain.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: kedua anakku ini
  rationale: Susunan ini alami dalam bahasa Indonesia serta mempertahankan demonstratif οὗτοι dan hubungan kepunyaan μου. Dalam konteks, “anak” jelas mengacu kepada dua anak laki-lakinya.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: yang seorang di sebelah kanan-Mu dan yang seorang lagi di sebelah kiri-Mu
  rationale: Ungkapan ruang ini diterjemahkan secara idiomatis dan paralel. “Yang seorang ... yang seorang lagi” menyampaikan pembagian εἷς ... καὶ εἷς dengan jelas.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: dalam kerajaan-Mu
  rationale: “Kerajaan” merupakan padanan yang wajar dan mapan bagi βασιλεία dalam konteks kedudukan kehormatan kerajaan, sambil tetap memungkinkan nuansa pemerintahan atau kekuasaan raja.
theological_decisions:
- issue: Hakikat tempat duduk yang diminta dalam hubungannya dengan kedudukan Yesus sebagai Raja
  choice: Permintaan diterjemahkan sebagai tempat kehormatan di sisi kanan dan kiri Yesus “dalam kerajaan-Mu”, tanpa menentukan tahap atau lokasi kerajaan itu.
  alternative: Menafsirkannya secara khusus sebagai kerajaan Mesianik di bumi atau sebagai kerajaan surgawi pada penggenapannya.
  rationale: Teks Yunani tidak menetapkan apakah yang dimaksud adalah fase duniawi atau surgawi. Terjemahan mempertahankan gambaran kerajaan dan kehormatan tanpa memasukkan suatu skema eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan orang kedua memakai bentuk terikat “kau-” dalam pertanyaan langsung, sedangkan huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Pengulangan “yang seorang ... yang seorang lagi” dipertahankan demi kejernihan dan kesejajaran.
