  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: id
  text: Karena itu, seharusnya engkau menyimpan uangku pada para bankir,[a] dan ketika aku datang, aku tentu sudah menerima kembali milikku dengan bunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menaruh uang perakku pada para bankir.”'
    reason: alternatif leksikal untuk βαλεῖν dan ἀργύρια
lexical_decisions:
- source_word: ἔδει
  choice: seharusnya engkau
  rationale: Bentuk imperfek impersonal ini menyatakan kewajiban atau tindakan yang semestinya dilakukan pada masa lampau; 'seharusnya engkau' alami dalam bahasa Indonesia dan mempertahankan nada teguran.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari tuduhan pada ayat sebelumnya dan secara jelas menunjukkan hubungan logis.
- source_word: βαλεῖν
  choice: menitipkan
  rationale: Secara harfiah berarti 'menaruh', tetapi dalam konteks uang yang diserahkan kepada τραπεζίταις untuk menghasilkan bunga, 'menitipkan' menyampaikan tindakan menaruh dana pada pihak pengelola tanpa memakai istilah teknis modern yang berlebihan.
- source_word: τὰ ἀργύριά μου
  choice: uangku
  rationale: ἀργύριον dapat berarti perak atau uang. Dalam konteks transaksi ini, 'uangku' adalah padanan fungsional yang paling jelas bagi pembaca modern.
- source_word: τοῖς τραπεζίταις
  choice: kepada para bankir
  rationale: Istilah ini menunjuk orang yang menjalankan kegiatan perbankan atau penukaran uang. Adanya τόκος mendukung 'bankir' karena konteksnya adalah penempatan uang yang menghasilkan bunga.
- source_word: ἐλθὼν ἐγὼ
  choice: ketika aku kembali
  rationale: Partisip aoris menyatakan waktu sebelum tindakan menerima kembali; dalam konteks perumpamaan, kedatangan itu adalah kepulangan sang tuan, sehingga 'kembali' wajar dan jelas.
- source_word: ἐκομισάμην ἂν
  choice: aku akan menerima kembali
  rationale: Bentuk medium κομίζω dapat berarti memperoleh atau menerima kembali, sedangkan ἄν menyatakan hasil hipotetis yang tidak terjadi. Konstruksi Indonesia ini mempertahankan makna tersebut.
- source_word: τὸ ἐμὸν
  choice: milikku
  rationale: Kata milik yang disubstantifkan menekankan apa yang menjadi kepunyaan sang tuan; 'milikku' ringkas dan alami.
- source_word: σὺν τόκῳ
  choice: beserta bunganya
  rationale: τόκος di sini berarti bunga atas uang. 'Bunga' adalah istilah Indonesia modern yang netral dan tidak dengan sendirinya menyiratkan riba atau bunga yang berlebihan.
theological_decisions:
- issue: Bahasa keuangan dalam perumpamaan dan kemungkinan penilaian moral terhadap pengambilan bunga
  choice: Istilah keuangan diterjemahkan secara lugas dan netral sebagai bagian dari gambaran perumpamaan.
  alternative: Memakai 'riba' sehingga mengesankan kecaman moral terhadap praktik tersebut.
  rationale: Ayat ini menggunakan transaksi keuangan sebagai unsur perumpamaan, bukan secara langsung mengajarkan pembenaran atau kecaman atas semua pengambilan bunga. 'Bunga' tidak memasukkan perdebatan teologis kemudian ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal dalam dialog perumpamaan; 'bankir' dan 'bunga' mudah dipahami, sedangkan catatan kaki mencatat gambaran harfiah perak dan verba 'menaruh'.
