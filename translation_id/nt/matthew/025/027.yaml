review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk menyatakan dengan jelas hasil pengandaian yang tidak terjadi dalam ἐκομισάμην ἂν. Bentuk "aku akan menerima kembali" dapat terbaca sebagai masa depan biasa; "aku tentu sudah menerima kembali" menyampaikan nuansa kontrafaktualnya dengan lebih tepat. "Ketika aku datang" juga lebih dekat dengan ἐλθών daripada "ketika aku kembali," meskipun konteks perumpamaan memang melibatkan kepulangan sang tuan.
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku dan modern. "Menyimpan uangku pada para bankir" wajar dalam konteks simpanan uang dan menghindari nuansa penitipan barang semata yang mungkin timbul dari "menitipkan."
  terminology: '"Bankir" dan "bunga" merupakan padanan netral dan tepat untuk τραπεζίταις dan τόκος dalam gambaran ekonomi perumpamaan. "Uang" tepat untuk ἀργύρια dalam konteks ini; catatan kaki mempertahankan alternatif harfiahnya, "uang perak."'
  issues:
  - severity: medium
    issue: '"Aku akan menerima kembali" tidak cukup menandai pengandaian lampau yang tidak terjadi.'
    rationale: Kombinasi infinitif aoris βαλεῖν sesudah ἔδει dan ἐκομισάμην ἄν menyatakan akibat yang semestinya akan terjadi jika tindakan terdahulu dilakukan. Dalam bahasa Indonesia, "tentu sudah menerima kembali" membedakannya dari prediksi masa depan biasa.
  - severity: low
    issue: '"Ketika aku kembali" menambahkan gagasan kembali yang tidak dinyatakan secara leksikal dalam ἐλθών.'
    rationale: Konteks naratif mendukung kepulangan, tetapi "ketika aku datang" mempertahankan bentuk sumber tanpa penambahan.
  - severity: low
    issue: Letak penanda catatan kaki tidak berdekatan dengan ungkapan yang dijelaskan.
    rationale: Catatan menjelaskan alternatif untuk "menyimpan uangku," terutama unsur "uang perak" dan "menaruh"; penanda sebaiknya ditempatkan setelah frasa tersebut.
  revised_text: Karena itu, seharusnya engkau menyimpan uangku pada para bankir,[a] dan ketika aku datang, aku tentu sudah menerima kembali milikku dengan bunga.
