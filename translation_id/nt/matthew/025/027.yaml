- from: Karena itu, seharusnya engkau menitipkan uangku kepada para bankir. Dengan demikian, ketika aku kembali, aku akan menerima kembali milikku beserta bunganya.[a]
  to: Karena itu, seharusnya engkau menyimpan uangku pada para bankir,[a] dan ketika aku datang, aku tentu sudah menerima kembali milikku dengan bunga.
  rationale: Revisi memperjelas bahwa sang tuan sedang menyatakan akibat yang akan telah diterimanya seandainya hamba itu menyimpan uang tersebut, tanpa mengubah istilah keuangan yang netral atau menambahkan penilaian moral atas bunga. Catatan kaki dipertahankan, dengan jangkar dipindahkan ke frasa yang dijelaskannya.
