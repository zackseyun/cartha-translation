base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: id
  text: Kemudian orang yang menerima dua talenta itu juga datang menghadap dan berkata, ‘Tuan[a], engkau telah menyerahkan dua talenta kepadaku. Lihatlah, aku telah memperoleh dua talenta lagi.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan.” Kata Yunani kyrios lazim diterjemahkan “Tuhan”; dalam perumpamaan ini kata tersebut juga dapat menjadi sapaan hormat kepada seorang tuan atau majikan.
    reason: alternative_reading
  - marker: b
    text: Talenta adalah satuan uang yang bernilai sangat besar, bukan bakat atau kemampuan alami.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: datang
  rationale: Partisip aoris προσέρχομαι menunjukkan bahwa hamba itu mendekat untuk memberikan laporannya. Dalam alur narasi ini, 'datang' terdengar alami dan cukup menyampaikan gerak mendekat.
- source_word: δὲ καὶ
  choice: Kemudian ... juga
  rationale: Gabungan ini meneruskan urutan narasi sekaligus menambahkan hamba berikutnya yang bertindak sejajar dengan hamba sebelumnya.
- source_word: ὁ τὰ δύο τάλαντα
  choice: orang yang menerima dua talenta itu
  rationale: Frasa berartikel ini mengidentifikasi orang tersebut berdasarkan jumlah yang dipercayakan kepadanya. Kata 'menerima' dibuat eksplisit dari konteks agar rujukannya jelas dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuan
  rationale: Vokatif κύριος di sini merupakan sapaan hormat seorang hamba kepada majikannya dalam perumpamaan. 'Tuan' mempertahankan fungsi sosial langsungnya tanpa memaksakan gelar ilahi, sementara kemungkinan 'Tuhan' dicatat dalam catatan kaki.
- source_word: παρέδωκας
  choice: telah menyerahkan
  rationale: παραδίδωμι berarti menyerahkan atau memberikan ke dalam penguasaan orang lain. 'Menyerahkan' mempertahankan daya konkret verba sumber; konteks menunjukkan bahwa uang itu dipercayakan untuk dikelola.
- source_word: μοι
  choice: kepadaku
  rationale: Pronomina datif menandai penerima penyerahan dan secara alami diterjemahkan 'kepadaku'.
- source_word: ἴδε
  choice: Lihatlah
  rationale: Interjeksi ini menarik perhatian kepada hasil yang ditunjukkan. 'Lihatlah' mempertahankan daya deiktisnya dalam bahasa Indonesia modern yang tetap bermartabat.
- source_word: ἄλλα δύο τάλαντα
  choice: dua talenta lagi
  rationale: ἄλλα bersama bilangan menunjukkan tambahan dalam jumlah yang sama. 'Dua talenta lagi' merupakan ungkapan Indonesia yang alami.
- source_word: ἐκέρδησα
  choice: aku telah memperoleh
  rationale: κερδαίνω berarti memperoleh keuntungan atau mendapatkan tambahan. 'Memperoleh' menyatakan hasil tanpa menentukan secara berlebihan cara komersialnya.
- source_word: τάλαντα
  choice: talenta
  rationale: τάλαντον adalah satuan berat dan nilai uang yang sangat besar. Istilah tradisional 'talenta' dipertahankan, dengan catatan budaya untuk mencegah pemahaman sebagai bakat alami.
theological_decisions:
- issue: Penerjemahan κύριος sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks langsung adalah laporan seorang hamba kepada majikannya, sehingga 'Tuan' paling alami dan mempertahankan fungsi sapaan sosial. Karena κύριος juga lazim diterjemahkan 'Tuhan' dan perumpamaan dapat memiliki daya teologis, alternatif itu dicatat tanpa meniadakan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Bentuk 'engkau' dan 'aku' mempertahankan sapaan langsung yang wajar dalam perumpamaan. Penanda catatan [a] ditempatkan setelah sapaan yang dijelaskan, sedangkan [b] ditempatkan pada akhir kalimat yang memuat istilah 'talenta'.
