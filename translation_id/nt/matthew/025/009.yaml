source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: id
  text: Tetapi mereka yang bijaksana itu menjawab, “Tidak, jangan-jangan sama sekali tidak akan cukup bagi kami maupun kalian.[a] Sebaliknya, pergilah kepada para penjual dan belilah untuk diri kalian sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “jangan-jangan sama sekali tidak akan cukup bagi kami maupun kalian.” Ungkapan Yunani ini memadukan μήποτε (“jangan-jangan”) dengan penyangkalan tegas, sehingga menekankan kekhawatiran bahwa jumlahnya tidak akan mencukupi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: Namun, mereka yang bijaksana itu menjawab
  rationale: Ungkapan ini mempertahankan kontras δέ dan sifat substantival αἱ φρόνιμοι tanpa mengulang kata benda dari konteks sebelumnya. Partisipel λέγουσαι tidak diterjemahkan secara terpisah karena 'menjawab dengan berkata' terasa berlebihan dalam bahasa Indonesia.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Tidak, nanti tidak cukup
  rationale: '''Tidak'' menyatakan penolakan yang tersirat, sedangkan ''nanti tidak cukup'' secara wajar menyampaikan kekhawatiran kuat akan ketidakcukupan tanpa menambahkan objek seperti minyak yang tidak disebutkan secara eksplisit dalam ayat ini.'
- source_word: ἡμῖν καὶ ὑμῖν
  choice: untuk kami dan kalian
  rationale: Dativus kepentingan diterjemahkan secara idiomatis dengan 'untuk'; 'kalian' dengan jelas menyatakan orang kedua jamak.
- source_word: πορεύεσθε μᾶλλον
  choice: Lebih baik pergilah
  rationale: μᾶλλον menunjukkan tindakan alternatif yang lebih tepat; 'lebih baik' alami dalam nasihat langsung bahasa Indonesia.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: kepada para penjual
  rationale: Partisipel substantival diterjemahkan ringkas sebagai 'para penjual' tanpa menambahkan barang yang dijual.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: belilah untuk kalian sendiri
  rationale: Bentuk imperatif dan dativus refleksif dipertahankan secara jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak 'kalian' dipilih agar perbedaan antara 'kami' dan orang kedua jamak tetap jelas. Tanda baca menempatkan penanda catatan kaki langsung sesudah klausa yang dijelaskan.
