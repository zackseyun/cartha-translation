  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: id
  text: Dan semua bangsa akan dikumpulkan di hadapan-Nya[a], dan Ia akan memisahkan mereka satu dari yang lain, sama seperti gembala memisahkan domba dari kambing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua suku bangsa”; secara harfiah, “semua bangsa” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ἐρίφων dapat secara lebih khusus berarti “kambing muda” atau “anak kambing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: akan dikumpulkan
  rationale: Bentuk pasif futur diterjemahkan secara langsung dan alami tanpa menambahkan pelaku yang tidak dinyatakan dalam teks.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: di hadapan-Nya
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta sesuai dengan suasana penghakiman.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: Mempertahankan keluasan makna ἔθνη sebagai bangsa-bangsa atau kelompok-kelompok masyarakat tanpa mempersempitnya menjadi bangsa-bangsa bukan Yahudi.
- source_word: ἀφορίσει
  choice: akan memisahkan
  rationale: Menyatakan tindakan membagi satu kelompok dari kelompok lain secara jelas dan langsung.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: mereka seorang dari yang lain
  rationale: Mempertahankan gagasan pemisahan di antara mereka, bukan sekadar pemisahan dari sesuatu di luar kelompok.
- source_word: ὥσπερ
  choice: sama seperti
  rationale: Menandai perbandingan dengan jelas dalam bahasa Indonesia yang wajar.
- source_word: ὁ ποιμὴν
  choice: gembala
  rationale: Nomina tentu Yunani berfungsi secara generik dalam perumpamaan; bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: τὰ πρόβατα
  choice: domba
  rationale: Mempertahankan gambaran konkret hewan, bukan menggantinya dengan istilah kolektif seperti kawanan.
- source_word: τῶν ἐρίφων
  choice: kambing
  rationale: Merupakan pasangan kontras yang paling alami dengan domba dalam bahasa Indonesia; nuansa kambing muda dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan πάντα τὰ ἔθνη
  choice: semua bangsa
  alternative: semua suku bangsa; semua bangsa bukan Yahudi
  rationale: Terjemahan mempertahankan keluasan leksikal frasa Yunani dan tidak menetapkan terlebih dahulu identitas kelompok yang dihakimi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur pasif dan gambaran gembala dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
