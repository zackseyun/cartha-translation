  rationale: Revisi memulihkan urutan tindakan dalam λαβοῦσαι dan unsur “keluar” dalam ἐξῆλθον, sambil mempertahankan rumusan perumpamaan yang idiomatis (“akan seperti”) serta catatan tentang bentuk pasif Yunani. Penggantian “gadis” dengan “perawan” mengikuti makna leksikal yang lebih langsung dari παρθένοις tanpa menghapus kemungkinan nuansa sosial yang lebih luas, yang dicatat sebagai alternatif.
