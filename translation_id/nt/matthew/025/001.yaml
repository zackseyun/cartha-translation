  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: id
  text: “Pada waktu itu, Kerajaan Surga akan seperti[a] sepuluh perawan[b] yang mengambil pelita[c] mereka lalu keluar untuk menyambut mempelai laki-laki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan disamakan dengan” atau “akan diumpamakan dengan”; kata kerja Yunani berbentuk pasif.
    reason: lexical_alternative
  - marker: b
    text: Atau “gadis” atau “perempuan muda yang belum menikah.”
    reason: lexical_alternative
  - marker: c
    text: Atau “obor”; istilah Yunani dapat menunjuk kepada sumber cahaya genggam dalam sebuah arak-arakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pada waktu itu
  rationale: Penanda waktu ini menghubungkan perumpamaan dengan pembicaraan sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kaitan temporalnya.
- source_word: ὁμοιωθήσεται
  choice: akan seperti
  rationale: Bentuk Yunani adalah futur pasif, tetapi rumusan idiomatis bahasa Indonesia untuk membuka perumpamaan ialah “akan seperti.” Nuansa pasif dipertahankan dalam catatan kaki.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ini adalah padanan baku dan alami bagi ungkapan khas Matius tersebut; bentuk jamak Yunani tidak perlu ditiru secara kaku dalam bahasa Indonesia.
- source_word: δέκα παρθένοις
  choice: sepuluh gadis
  rationale: Dalam konteks pesta pernikahan, παρθένος menunjuk kepada perempuan muda yang belum menikah, dengan keperawanan yang tersirat secara konvensional. “Gadis” adalah ungkapan modern yang alami; makna yang lebih harfiah dicatat.
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: yang membawa pelita mereka
  rationale: Partisip aoris menyatakan tindakan yang mendahului atau menyertai keberangkatan. “Membawa” lebih alami daripada “mengambil” dalam konteks arak-arakan, sedangkan λαμπάς dapat berarti pelita atau obor.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: lalu pergi menyambut
  rationale: Ungkapan ini menyatakan gerak keluar dengan tujuan menemui dan menerima kedatangan seseorang. “Pergi menyambut” menyampaikan fungsi sosialnya secara alami.
- source_word: τοῦ νυμφίου
  choice: mempelai laki-laki
  rationale: νυμφίος secara khusus menunjuk kepada pihak laki-laki dalam pernikahan; padanan ini jelas, dignified, dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Rumus perbandingan dalam perumpamaan
  choice: Kerajaan Surga akan seperti
  alternative: Kerajaan Surga akan disamakan dengan
  rationale: Teks Yunani memakai bentuk futur pasif, tetapi “akan seperti” merupakan rumusan Indonesia yang lebih alami tanpa mengubah inti perbandingan. Bentuk pasif sumber tetap dinyatakan dalam catatan kaki.
- issue: Makna παρθένοις
  choice: gadis
  alternative: perawan; perempuan muda yang belum menikah
  rationale: “Gadis” sesuai dengan latar pesta pernikahan dan mudah dipahami pembaca modern. Karena kata Yunani dapat menekankan status belum menikah dan secara konvensional keperawanan, nuansa itu tidak dihapus, melainkan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami untuk pembaca umum, sementara bentuk pasif pada rumus perbandingan serta ambiguitas παρθένος dan λαμπάς dipertahankan melalui catatan kaki.
