  naturalness: Register draf umumnya baku dan wajar. “Dalam sedikit hal” menyampaikan kontras dengan “banyak hal” secara lebih langsung dan alami. “Menempatkanmu untuk mengurus banyak hal” lebih idiomatis daripada “mengangkat engkau untuk bertanggung jawab atas banyak perkara,” sambil tetap menyatakan penunjukan ke tanggung jawab yang lebih luas.
  terminology: “Tuan,” “hamba,” dan “setia” konsisten dan tepat bagi konteks perumpamaan. Catatan kaki tentang kemungkinan “budak” memadai serta tidak memaksakan satu pemahaman sosial yang lebih spesifik daripada yang diperlukan oleh konteks.
