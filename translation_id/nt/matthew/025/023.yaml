  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: id
  text: Tuannya berkata kepadanya, “Bagus sekali, hai hamba yang baik dan setia![a] Engkau telah setia dalam sedikit hal; aku akan menempatkanmu untuk mengurus banyak hal. Masuklah ke dalam sukacita tuanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak yang baik dan setia.” Kata Yunani δοῦλος dapat berarti hamba atau budak, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: berkata
  rationale: Bentuk naratif langsung yang alami untuk memperkenalkan ucapan.
- source_word: κύριος
  choice: tuan
  rationale: Dalam dunia cerita perumpamaan ini, kata tersebut menunjuk kepada atasan atau pemilik hamba, bukan dipakai langsung sebagai gelar ilahi.
- source_word: δοῦλε
  choice: hamba
  rationale: Dalam bahasa Indonesia, 'hamba' mempertahankan hubungan hierarkis dan cocok dengan latar perumpamaan; kemungkinan arti yang lebih tegas, 'budak', dicatat dalam catatan kaki.
- source_word: Εὖ
  choice: Bagus sekali
  rationale: Ungkapan pujian yang wajar dalam bahasa Indonesia dan menyampaikan penilaian positif εὖ dalam konteks ini.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: yang baik dan setia
  rationale: Mempertahankan pasangan sifat serta hubungan leksikal antara πιστέ dan πιστός yang muncul sesudahnya.
- source_word: ἐπὶ ὀλίγα
  choice: dalam perkara-perkara kecil
  rationale: Menyampaikan lingkup tanggung jawab yang terbatas dengan bahasa Indonesia yang alami, tanpa membatasi acuannya hanya pada benda.
- source_word: πιστός
  choice: setia
  rationale: Menjaga pengulangan akar makna dengan 'setia' pada sapaan sebelumnya dan menekankan keterandalan dalam tugas.
- source_word: ἐπὶ πολλῶν
  choice: atas banyak perkara
  rationale: Menjaga kontras dengan perkara-perkara kecil serta menyatakan lingkup tanggung jawab yang diperluas.
- source_word: καταστήσω
  choice: aku akan mengangkat engkau untuk bertanggung jawab
  rationale: Menjelaskan makna penempatan atau pengangkatan ke dalam tanggung jawab tanpa kehilangan nuansa penunjukan.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Masuklah ke dalam sukacita
  rationale: Mempertahankan metafora masuk ke dalam sukacita, alih-alih meratakannya menjadi sekadar ikut bersukacita.
- source_word: τοῦ κυρίου σου
  choice: tuanmu
  rationale: Konsisten dengan κύριος sebelumnya dan sesuai dengan hubungan dalam cerita.
theological_decisions:
- issue: Penerjemahan κύριος dalam perumpamaan tentang seorang atasan manusia
  choice: tuan
  alternative: Tuhan
  rationale: Acuan langsung dalam dunia cerita adalah tuan si hamba. Pilihan 'tuan' mencegah gelar ilahi dimasukkan secara eksplisit, sambil tetap membiarkan makna teologis perumpamaan muncul dari konteks.
- issue: Penerjemahan δοῦλος dalam konteks ini
  choice: hamba
  alternative: budak
  rationale: Fokus ayat ialah kesetiaan dalam tanggung jawab. 'Hamba' alami dan bermartabat dalam register Alkitab bahasa Indonesia, sedangkan kemungkinan bahwa δοῦλος menunjukkan status budak tetap dinyatakan dalam catatan kaki.
- issue: Metafora sukacita sang tuan
  choice: masuklah ke dalam sukacita tuanmu
  alternative: ikutlah bersukacita bersama tuanmu
  rationale: Bentuk yang dipilih mempertahankan gambaran harfiah εἴσελθε εἰς dan tidak memutuskan apakah sukacita itu terutama milik sang tuan, perayaan yang diselenggarakannya, atau sukacita yang dibagikan bersamanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Bagus sekali' dipilih sebagai pujian yang alami; 'hai' mempertahankan nuansa sapaan vokatif tanpa terasa terlalu kuno. Huruf kecil pada 'aku' dan 'tuanmu' mengikuti acuan langsung kepada tokoh tuan manusia dalam perumpamaan.
