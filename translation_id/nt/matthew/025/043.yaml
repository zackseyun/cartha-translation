  rationale: Revisi memulihkan pola koordinatif teks sumber dengan “dan kamu tidak,” menghapus penambahan status “sebagai tamu,” dan memakai “telanjang” sebagai padanan langsung γυμνός. Catatan kaki tetap menjaga alternatif leksikal dan nuansa tindakan penuh kepedulian pada ἐπισκέπτομαι.
