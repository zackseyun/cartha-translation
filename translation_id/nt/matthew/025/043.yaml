  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. “Telanjang” merupakan padanan langsung dan jelas bagi γυμνός; “menjenguk” cocok untuk ἐπεσκέψασθέ dalam konteks orang sakit maupun orang di penjara.
  terminology: “Orang asing” mempertahankan kerentanan sosial ξένος tanpa membatasi maknanya pada kewarganegaraan. “Menerima Aku” dijelaskan melalui catatan kaki sebagai penerimaan yang ramah atau memberi tumpangan. “Menjenguk” disertai catatan bahwa kunjungan itu bernuansa perhatian atau perawatan.
