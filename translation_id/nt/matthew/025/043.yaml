source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: id
  text: Aku adalah orang asing dan kamu tidak menerima Aku[a]; Aku telanjang dan kamu tidak memberi Aku pakaian; Aku sakit dan di dalam penjara, dan kamu tidak menjenguk Aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyambut Aku” atau “menampung Aku.” Kata Yunani ini secara harfiah berarti “mengumpulkan,” tetapi di sini menunjuk pada menerima orang asing dengan keramahtamahan.
    reason: lexical_alternative
  - marker: b
    text: “Menjenguk Aku” juga dapat mengandung arti memperhatikan atau merawat Aku, bukan sekadar datang berkunjung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: orang asing
  rationale: Padanan ini mempertahankan gagasan tentang seseorang yang berada di luar lingkup rumah tangga atau komunitas dan membutuhkan penerimaan, tanpa mempersempitnya menjadi orang berkewarganegaraan asing.
- source_word: συνηγάγετέ
  choice: menerima ... sebagai tamu
  rationale: Dalam hubungan dengan ξένος, verba ini menyatakan membawa masuk atau menerima dengan keramahtamahan. Ungkapan ini lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah 'mengumpulkan'.
- source_word: γυμνός
  choice: tidak berpakaian
  rationale: Padanan ini mempertahankan daya ungkap langsung teks Yunani sekaligus cocok dengan tindakan pasangan, yaitu memberi pakaian; dalam konteks, kata ini juga dapat mencakup kekurangan pakaian yang layak.
- source_word: περιεβάλετέ
  choice: memberi ... pakaian
  rationale: Verba ini secara harfiah berarti mengenakan sesuatu di sekeliling dan dalam konteks berarti memakaikan atau menyediakan pakaian. Ungkapan yang dipilih alami dan jelas bagi pembaca Indonesia.
- source_word: ἀσθενής
  choice: sakit
  rationale: Walaupun dapat berarti lemah, dalam daftar tindakan belas kasih ini makna penyakit fisik paling wajar.
- source_word: ἐν φυλακῇ
  choice: berada dalam penjara
  rationale: φυλακή di sini menunjuk keadaan dipenjarakan, bukan pos penjagaan; 'penjara' merupakan padanan Indonesia yang baku.
- source_word: ἐπεσκέψασθέ
  choice: menjenguk
  rationale: Kata ini menyatakan kunjungan yang disertai perhatian dan kepedulian. 'Menjenguk' cocok untuk orang sakit maupun orang dalam penjara dan lebih bernuansa peduli daripada sekadar 'mengunjungi'.
theological_decisions:
- issue: Nuansa tindakan belas kasih dalam ἐπεσκέψασθέ με
  choice: menjenguk Aku
  alternative: mengunjungi Aku; memperhatikan dan merawat Aku
  rationale: Pilihan ini mempertahankan tindakan konkret berupa kehadiran kepada orang yang rentan tanpa membatasi maknanya pada kunjungan sosial biasa. Catatan kaki menjaga nuansa perhatian dan kepedulian yang terkandung dalam verba Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan dipertahankan agar daftar kelalaian tetap tegas. Kapitalisasi 'Aku' mengikuti rujukan pembicara kepada dirinya sendiri dalam konteks ucapan Yesus.
