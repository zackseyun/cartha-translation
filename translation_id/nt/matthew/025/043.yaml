    rationale: συναγάγω dalam konteks ξένος menunjuk penerimaan yang ramah atau memberi tumpangan kepada orang asing. Menyebutnya “sebagai tamu” dapat membuat status tamu menjadi bagian eksplisit dari teks, padahal itu hanya kemungkinan penjelasan konteks.
