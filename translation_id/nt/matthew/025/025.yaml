  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: id
  text: Karena takut, aku pergi dan menyembunyikan talentamu[a] di dalam tanah. Lihat, ini milikmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejumlah besar uang”; satu talenta adalah satuan uang bernilai sangat tinggi, bukan sebutan untuk bakat alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Karena takut
  rationale: Partisip aoris ini menyatakan keadaan atau alasan yang menyertai tindakan hamba. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan rasa takut sebagai motif yang dinyatakan hamba tanpa menafsirkannya sebagai rasa hormat religius.
- source_word: ἀπελθὼν
  choice: aku pergi
  rationale: Partisip aoris ini mendahului verba utama ἔκρυψα. Rangkaian alami 'aku pergi dan menyembunyikan' mempertahankan urutan tindakannya.
- source_word: ἔκρυψα
  choice: menyembunyikan
  rationale: κρύπτω berarti menyembunyikan atau merahasiakan. Keterangan 'di dalam tanah' sudah menyiratkan penguburan, sehingga verba ini tidak perlu diperluas menjadi 'menguburkan'.
- source_word: τὸ τάλαντόν σου
  choice: talentamu
  rationale: τάλαντον adalah satuan berat dan uang bernilai sangat besar. Istilah historis 'talenta' dipertahankan, sedangkan catatan kaki menjelaskan bahwa yang dimaksud adalah uang, bukan bakat alami.
- source_word: ἐν τῇ γῇ
  choice: di dalam tanah
  rationale: γῆ di sini menunjuk pada tanah sebagai tempat benda itu disembunyikan. Frasa ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἴδε
  choice: Lihat
  rationale: ἴδε adalah seruan untuk mengarahkan perhatian. 'Lihat' merupakan padanan langsung dan tidak arkais.
- source_word: ἔχεις τὸ σόν
  choice: ini milikmu
  rationale: Ungkapan Yunani ini eliptis dan menekankan kepunyaan sang tuan. 'Ini milikmu' menyampaikannya secara alami sambil mempertahankan klaim hamba bahwa ia mengembalikan milik tuannya.
theological_decisions:
- issue: Makna τάλαντον dalam perumpamaan yang kemudian sering dikaitkan dengan bakat alami
  choice: Mempertahankan istilah historis 'talenta' dalam teks utama dan menjelaskan makna moneternya dalam catatan kaki.
  alternative: sejumlah besar uang
  rationale: Kata Yunani tersebut menunjuk pada satuan berat atau uang bernilai tinggi, bukan kemampuan bawaan. Mempertahankan 'talenta' menjaga warna historis perumpamaan, sedangkan catatan kaki mencegah kesalahpahaman modern.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'aku' dan akhiran '-mu' sesuai dengan tuturan langsung seorang hamba kepada tuannya; susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Yunani.
