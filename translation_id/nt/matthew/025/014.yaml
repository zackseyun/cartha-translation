  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: id
  text: 'Sebab, hal itu sama seperti seorang laki-laki yang hendak bepergian: ia memanggil budak-budaknya sendiri[a] dan memercayakan hartanya kepada mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambanya sendiri.” Kata Yunani doulos dapat berarti hamba atau budak, bergantung pada konteks. Di sini kata itu menunjuk kepada orang-orang yang menjadi milik dan berada di bawah wewenang tuannya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Sebab, hal itu sama seperti
  rationale: Frasa ini memperkenalkan perbandingan yang menjelaskan perkataan sebelumnya. Kata “hal itu” melengkapi ungkapan Yunani yang eliptis secara wajar dalam bahasa Indonesia tanpa menentukan rujukannya lebih jauh.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Dalam perumpamaan ini nomina maskulin tunggal tersebut menunjuk kepada tokoh laki-laki tertentu, bukan kepada manusia secara umum.
- source_word: ἀποδημῶν
  choice: ketika hendak bepergian
  rationale: Partisip ini menyatakan keberangkatan ke tempat lain; pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi perjalanan ke luar negeri.
- source_word: ἐκάλεσεν
  choice: memanggil
  rationale: Padanan langsung dan alami yang tetap dapat menyiratkan panggilan berwibawa dari seorang tuan.
- source_word: τοὺς ἰδίους δούλους
  choice: hamba-hambanya sendiri
  rationale: “Hamba” merupakan padanan Indonesia yang bermartabat dan mudah dipahami untuk δοῦλος dalam latar rumah tangga ini; “sendiri” mempertahankan penekanan ἰδίους pada hubungan kepunyaan mereka dengan sang tuan. Catatan kaki menjelaskan status sosial yang juga dapat disebut budak.
- source_word: παρέδωκεν
  choice: memercayakan
  rationale: Dalam konteks pengelolaan harta, kata ini menyampaikan penyerahan yang disertai tanggung jawab, bukan sekadar pemindahan barang.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: hartanya
  rationale: Ungkapan ini menunjuk kepada segala milik atau kekayaan laki-laki itu. “Hartanya” ringkas, alami, dan sesuai dengan konteks ekonomi perumpamaan.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam rumah tangga perumpamaan
  choice: hamba
  alternative: budak
  rationale: '“Hamba” dipilih dalam teks utama karena alami dalam register Alkitab Indonesia dan tidak menimbulkan ambiguitas modern “budak” sebagai anak di sejumlah ragam Melayu. Namun, hubungan kepemilikan dan kewenangan tuan tidak dilunakkan: catatan kaki menyatakan bahwa δοῦλος juga dapat diterjemahkan “budak” dan menunjuk kepada orang yang berada di bawah kuasa tuannya.'
- issue: Pelengkapan perbandingan eliptis Ὥσπερ γὰρ
  choice: hal itu sama seperti
  alternative: sebab sama seperti
  rationale: Teks Yunani tidak menyebut subjek perbandingan secara eksplisit. “Hal itu” hanya melengkapi tata bahasa Indonesia dan sengaja tidak mengidentifikasinya secara lebih khusus sebagai kerajaan atau kedatangan, sehingga ketegangan hubungan dengan konteks sebelumnya tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan “ketika hendak bepergian” membuat hubungan partisip Yunani jelas dan alami, sedangkan “lalu” menghubungkan kedua tindakan utama tanpa menambahkan hubungan teologis baru.
