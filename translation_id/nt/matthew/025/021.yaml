  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: id
  text: Tuannya berkata kepadanya, ‘Bagus sekali, hamba yang baik dan setia![a] Engkau setia atas sedikit hal; aku akan menetapkan engkau atas banyak hal. Masuklah ke dalam sukacita tuanmu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Yunani doulos juga dapat diterjemahkan “budak”: “Bagus sekali, budak yang baik dan setia!” Dalam konteks ini, kata tersebut menunjukkan seseorang yang berada di bawah wewenang tuannya.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: berkata
  rationale: Padanan naratif yang wajar untuk φημί ketika memperkenalkan perkataan langsung.
- source_word: κύριος
  choice: tuan
  rationale: Dalam latar perumpamaan, kata ini menunjuk pada orang yang berwenang atas hambanya. 'Tuan' mempertahankan hubungan sosial tersebut tanpa menjadikannya gelar kristologis secara eksplisit.
- source_word: δοῦλε
  choice: hamba
  rationale: '''Hamba'' merupakan padanan Indonesia yang alami dan bermartabat serta tetap menunjukkan kedudukan di bawah seorang tuan; cakupan maknanya di sini dapat mencakup status budak.'
- source_word: Εὖ
  choice: Bagus sekali
  rationale: Ungkapan pujian yang alami dalam bahasa Indonesia dan sesuai dengan fungsi adverbia εὖ dalam konteks ini.
- source_word: ἀγαθὲ
  choice: baik
  rationale: Padanan langsung yang mempertahankan pujian atas karakter hamba tersebut.
- source_word: πιστέ / πιστός
  choice: setia
  rationale: Mempertahankan pengulangan leksikal dan menyampaikan sifat dapat dipercaya serta keteguhan dalam menjalankan amanat.
- source_word: ἐπὶ ὀλίγα
  choice: dalam perkara-perkara kecil
  rationale: Menyampaikan lingkup tanggung jawab yang terbatas dengan bahasa Indonesia yang alami; bentuk jamak mempertahankan ὀλίγα.
- source_word: καταστήσω
  choice: aku akan mengangkat engkau untuk bertanggung jawab
  rationale: Dalam konteks ini καθίστημι menyatakan penetapan seseorang pada tanggung jawab atau kewenangan yang lebih besar.
- source_word: ἐπὶ πολλῶν
  choice: atas perkara-perkara besar
  rationale: Mengungkapkan kontras idiomatis dengan 'perkara-perkara kecil'. Bentuk Yunani secara harfiah berarti 'atas banyak perkara', tetapi dalam paralel ini yang ditekankan ialah tanggung jawab yang jauh lebih besar.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Masuklah dan turutlah dalam sukacita
  rationale: Mempertahankan gambaran 'masuk' dari εἴσελθε sekaligus membuat makna partisipasi dalam sukacita dapat dipahami secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: κύριος dalam perumpamaan yang tokohnya dapat dipahami melambangkan Allah atau Kristus
  choice: tuan
  alternative: Tuhan
  rationale: Pada tingkat cerita, relasinya adalah antara hamba dan tuannya. 'Tuan' mempertahankan latar perumpamaan dan tidak secara diam-diam mengubah kata tersebut menjadi gelar ilahi, tanpa meniadakan makna tipologis yang mungkin ditangkap pembaca.
- issue: Status sosial yang dinyatakan oleh δοῦλος
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' adalah padanan yang lazim dalam register Alkitab Indonesia dan mempertahankan relasi ketundukan, sedangkan ''budak'' lebih eksplisit menandai status kepemilikan. Kemungkinan tersebut dijelaskan dalam catatan kaki.'
- issue: Metafora masuk ke dalam sukacita sang tuan
  choice: Masuklah dan turutlah dalam sukacita tuanmu
  alternative: Masuklah ke dalam sukacita tuanmu
  rationale: Terjemahan ini mempertahankan metafora ruang sekaligus menjelaskan partisipasi yang tersirat, tanpa menentukan apakah sukacita itu terutama pesta, kebahagiaan sang tuan, atau sukacita eskatologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'engkau' dan bentuk 'tuanmu' menjaga nuansa langsung perumpamaan. Huruf kecil pada 'tuan' dan 'aku' mengikuti tingkat cerita, bukan menolak kemungkinan rujukan teologis perumpamaan.
