id: MAT.25.4
reference: Matthew 25:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: id
  text: Namun, gadis-gadis yang bijaksana membawa minyak dalam wadah bersama pelita mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “obor” untuk “pelita” (Yunani: lampadas); istilah ini dapat berarti obor atau pelita, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: bijaksana
  rationale: Kata ini menunjuk pada kebijaksanaan atau kehati-hatian praktis. “Bijaksana” mempertahankan kontras dengan gadis-gadis yang bodoh dalam konteks tanpa mempersempit maknanya menjadi sekadar “siap”.
- source_word: ἔλαβον
  choice: membawa
  rationale: Dalam konteks perjalanan dan persiapan ini, bentuk dari λαμβάνω berarti mengambil serta membawa sesuatu. “Membawa” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “mengambil”.
- source_word: ἔλαιον
  choice: minyak
  rationale: Kata ini lazim berarti minyak, sering kali minyak zaitun. Teks tidak perlu diperinci menjadi “minyak zaitun”.
- source_word: ἀγγείοις
  choice: wadah
  rationale: Istilah ini bersifat umum untuk tempat menampung sesuatu dan tidak menetapkan bentuk atau bahannya.
- source_word: λαμπάδων
  choice: pelita
  rationale: λαμπάς dapat berarti pelita atau obor. “Pelita” alami dalam konteks adanya persediaan minyak, sementara kemungkinan “obor” dipertahankan dalam catatan kaki.
- source_word: ἑαυτῶν
  choice: mereka
  rationale: Kepemilikan refleksifnya dapat dinyatakan secara alami dengan “mereka”; penambahan “sendiri” tidak diperlukan.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: bersama pelita mereka
  rationale: 'μετά dengan genitif menyatakan penyertaan: minyak dibawa dalam wadah di samping pelita yang mereka bawa.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Gadis-gadis” memasok subjek yang tersirat oleh artikel feminin jamak dan konteks ayat sebelumnya; “namun” menyatakan kontras δέ secara alami.
