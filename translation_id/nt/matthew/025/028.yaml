  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: id
  text: Karena itu, ambillah talenta itu dari dia[a] dan berikanlah kepada orang yang mempunyai sepuluh talenta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ambil talenta itu dari dia.” Kata kerja Yunani ini dapat diterjemahkan “ambil” atau “ambil kembali.”'
    reason: lexical_alternative
  - marker: b
    text: Talenta adalah satuan berat kuno dan, dalam konteks ini, satuan nilai uang yang besar.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: ambillah
  rationale: Bentuk imperatif aoris aktif jamak dari αἴρω menyampaikan perintah langsung untuk mengambil atau menyingkirkan sesuatu. Dalam konteks ini, “ambillah ... darinya” alami dalam bahasa Indonesia dan menyatakan pemindahan kepemilikan dengan jelas.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan yang ditarik dari putusan sebelumnya; “karena itu” mempertahankan hubungan logis tersebut secara jelas dan wajar.
- source_word: ἀπ’ αὐτοῦ
  choice: darinya
  rationale: ἀπό dengan bentuk genitif menyatakan pemisahan dari hamba yang baru saja dijatuhi putusan. “Darinya” merupakan padanan langsung dan alami.
- source_word: τὸ τάλαντον
  choice: talenta itu
  rationale: τάλαντον adalah satuan berat yang besar dan, dalam konteks ini, sejumlah uang. Istilah historis “talenta” dipertahankan, sedangkan “itu” mencerminkan artikel Yunani dan menunjuk pada talenta tertentu yang telah disebut.
- source_word: δότε
  choice: berikanlah
  rationale: Bentuk imperatif aoris aktif jamak dari δίδωμι. “Berikanlah” mempertahankan daya perintah dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: τῷ ἔχοντι
  choice: kepada orang yang mempunyai
  rationale: Partisipel berartikel ini berfungsi sebagai nomina. Ungkapan tersebut alami dalam bahasa Indonesia dan tidak menambahkan identitas yang tidak dinyatakan oleh teks.
- source_word: τὰ δέκα τάλαντα
  choice: sepuluh talenta
  rationale: Menunjuk pada jumlah tertentu yang sudah dikenal dari alur perumpamaan. Dalam bahasa Indonesia, kekhususan itu dapat dipahami dari konteks tanpa menerjemahkan artikel secara tersendiri.
theological_decisions:
- issue: Makna τάλαντον dalam konteks perumpamaan
  choice: Mempertahankan istilah historis “talenta” dengan catatan bahwa ini adalah satuan berat dan, dengan perluasan makna, uang.
  alternative: “sejumlah uang” atau “uang itu”
  rationale: Perumpamaan berbicara tentang harta yang dipercayakan dan pertanggungjawaban, bukan tentang bakat bawaan. Istilah historis menjaga latar budaya teks, sementara catatan kaki mencegah pembaca memahami “talenta” dalam arti kemampuan alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Akhiran -lah mempertahankan daya imperatif tanpa terdengar kasar. Istilah “talenta” dipakai sebagai istilah historis, bukan dalam arti bakat atau kemampuan alami.
