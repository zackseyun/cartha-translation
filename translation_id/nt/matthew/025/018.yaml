id: MAT.25.18
reference: Matthew 25:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: id
  text: Tetapi orang yang telah menerima satu talenta itu pergi, menggali tanah, lalu menyembunyikan uang tuannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “perak milik tuannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Tetapi orang ... itu
  rationale: δέ menandai pertentangan dengan tindakan hamba-hamba sebelumnya, sedangkan artikel substantival menunjuk kepada orang yang dicirikan oleh klausa berikutnya.
- source_word: τὸ ἓν
  choice: satu talenta
  rationale: Kata benda tidak diulangi dalam bahasa Yunani, tetapi angka 'satu' merujuk kembali kepada talenta dalam Matius 25:15; penyebutan 'talenta' diperlukan agar jelas dalam bahasa Indonesia.
- source_word: λαβὼν
  choice: yang telah menerima
  rationale: Partisip ini menyatakan tindakan yang mendahului verba utama; 'telah menerima' juga sesuai dengan konteks harta yang dipercayakan kepadanya.
- source_word: ἀπελθὼν
  choice: pergi
  rationale: Menyampaikan gerak menjauh dan urutan tindakan secara alami tanpa memakai ungkapan yang terlalu formal.
- source_word: ὤρυξεν γῆν
  choice: menggali tanah
  rationale: Ungkapan ini secara ringkas dan alami menyampaikan tindakan menggali ke dalam tanah tanpa menambahkan kata 'lubang' yang hanya tersirat.
- source_word: ἔκρυψεν
  choice: menyembunyikan
  rationale: Padanan langsung dan wajar untuk tindakan menyembunyikan sesuatu dari pandangan atau pengetahuan.
- source_word: τὸ ἀργύριον
  choice: uang
  rationale: ἀργύριον dapat berarti 'perak' atau 'uang'; dalam konteks dana yang dipercayakan, 'uang' paling jelas bagi pembaca modern, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: tuannya
  rationale: Dalam dunia cerita, κύριος menunjuk kepada atasan manusia dari hamba tersebut; 'tuan' mempertahankan hubungan wewenang tanpa menjadikannya gelar ilahi secara langsung.
theological_decisions:
- issue: Pemadanan κύριος dalam rujukan parabel yang secara langsung bersifat manusiawi
  choice: tuan
  alternative: Tuhan
  rationale: Referen langsung dalam alur cerita ialah tuan dari para hamba. 'Tuan' mempertahankan hubungan sosial dan wewenang serta tidak memaksakan gelar ilahi, tanpa menutup kemungkinan makna parabel yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. 'Lalu' memperjelas urutan tindakan partisipial dan verba utama. Istilah 'talenta' dipertahankan sebagai satuan uang kuno dalam konteks perumpamaan.
