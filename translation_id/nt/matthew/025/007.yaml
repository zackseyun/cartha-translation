  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: id
  text: Lalu semua gadis itu bangun dan menyiapkan pelita mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “obor” untuk “pelita” (Yunani: λαμπάδας); kata ini dapat menunjuk sumber cahaya yang dibawa dengan tangan, dan konteks tentang minyak serta persiapan memungkinkan kedua terjemahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai peristiwa berikutnya dalam urutan narasi secara alami dalam bahasa Indonesia.
- source_word: ἠγέρθησαν
  choice: bangun
  rationale: Dalam konteks mereka sebelumnya tertidur, bentuk ini paling wajar dipahami sebagai bangun lalu berdiri untuk bertindak; tidak perlu dibuat pasif sebagai 'dibangunkan'.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: semua gadis itu
  rationale: Dalam konteks pernikahan, παρθένοι menunjuk para gadis yang menyongsong mempelai. 'Gadis' alami dalam bahasa Indonesia dan tidak searkais 'perawan', meski unsur belum menikah tetap tersirat oleh konteks.
- source_word: ἐκόσμησαν
  choice: menyiapkan
  rationale: κοσμέω berarti menata atau membereskan. Untuk sumber cahaya, tindakan ini mencakup membuatnya siap digunakan, mungkin dengan mengatur sumbu dan minyak. 'Menyiapkan' tidak menambahkan rincian teknis yang tidak dinyatakan.
- source_word: λαμπάδας
  choice: pelita
  rationale: λαμπάς dapat berarti pelita atau obor. Konteks minyak dan tindakan menyiapkannya mendukung 'pelita', sementara kemungkinan 'obor' dipertahankan dalam catatan kaki.
- source_word: ἑαυτῶν
  choice: mereka
  rationale: Genitif refleksif menyatakan bahwa pelita itu milik para gadis sendiri; bahasa Indonesia lazim menyatakannya cukup dengan 'mereka' tanpa penekanan tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Menyiapkan pelita' dipilih daripada ungkapan teknis seperti 'merapikan sumbu' agar tidak memasukkan tindakan yang hanya tersirat. Penanda [a] dicantumkan langsung setelah frasa terkait.
