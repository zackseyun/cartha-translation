id: MAT.25.34
reference: Matthew 25:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: id
  text: Kemudian Raja itu akan berkata kepada mereka yang berada di sebelah kanan-Nya, “Datanglah, kalian yang diberkati oleh Bapa-Ku, warisilah kerajaan yang telah disiapkan bagi kalian sejak dunia dijadikan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam adegan penghakiman secara alami dalam bahasa Indonesia.
- source_word: ὁ βασιλεὺς
  choice: Raja itu
  rationale: Artikel Yunani menunjuk kepada Raja tertentu dalam konteks; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi gelarnya.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: kepada mereka yang berada di sebelah kanan-Nya
  rationale: Mempertahankan posisi ruang kelompok itu tanpa mempersempit makna kehormatan yang tersirat dalam konteks.
- source_word: Δεῦτε
  choice: Datanglah
  rationale: Merupakan seruan imperatif kepada kelompok tersebut; tidak memakai 'Mari' agar tidak menyiratkan bahwa sang Raja ikut datang bersama mereka.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: kalian yang diberkati oleh Bapa-Ku
  rationale: Partisipel perfek pasif menyatakan keadaan sebagai orang-orang yang telah menerima berkat, sedangkan genitif secara wajar menyatakan sumber atau pelaku berkat itu.
- source_word: κληρονομήσατε
  choice: warisilah
  rationale: Mempertahankan citra menerima sebagai warisan, bukan sekadar menerima atau mengambil.
- source_word: τὴν ἡτοιμασμένην ὑμῖν βασιλείαν
  choice: kerajaan yang telah disiapkan bagi kalian
  rationale: Partisipel perfek pasif menunjukkan persiapan yang telah selesai dan tetap berlaku bagi mereka.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Ungkapan Indonesia yang alami untuk titik awal sejak berdirinya dunia; menghindari frasa harfiah 'peletakan dasar dunia' yang kaku.
theological_decisions:
- issue: Hubungan genitif τοῦ πατρός μου dengan οἱ εὐλογημένοι
  choice: 'Dipahami sebagai sumber atau pelaku: ''diberkati oleh Bapa-Ku.'''
  alternative: '''orang-orang yang diberkati milik Bapa-Ku'' atau bentuk sangat harfiah ''yang diberkati dari Bapa-Ku'''
  rationale: Dalam susunan ini genitif paling wajar menunjuk kepada Bapa sebagai sumber berkat. Terjemahan tersebut jelas tanpa menambahkan sistem teologis tertentu.
- issue: Makna βασιλεία sebagai objek warisan
  choice: kerajaan
  alternative: pemerintahan atau kekuasaan sebagai raja
  rationale: Karena kerajaan itu diwarisi dan telah disiapkan bagi penerimanya, konteks mendukung pengertian ranah kerajaan eskatologis, sambil tetap membiarkan nuansa pemerintahan ilahi hadir dalam istilah tersebut.
- issue: Kaitan ἀπὸ καταβολῆς κόσμου
  choice: Dihubungkan dengan 'telah disiapkan bagi kalian.'
  alternative: Dihubungkan secara longgar dengan seluruh undangan
  rationale: Partisipel 'yang telah disiapkan' merupakan unsur terdekat dan hubungan sintaksis yang paling alami. Terjemahan tidak menarik kesimpulan doktrinal lebih jauh dari pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'kalian' dipakai untuk menandai bentuk jamak secara jelas. Kapitalisasi pada 'Raja', 'Bapa-Ku', dan pronomina '-Nya' mengikuti penggunaan hormat bagi rujukan ilahi; 'kerajaan' tetap huruf kecil karena merupakan nomina dalam kalimat, bukan nama diri.
