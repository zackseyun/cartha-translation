  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: id
  text: Kepada seorang ia memberikan lima talenta[a], kepada yang lain dua, dan kepada yang lain lagi satu, masing-masing sesuai dengan kesanggupannya. Lalu ia segera pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talenta adalah satuan uang bernilai sangat besar, bukan bakat atau kemampuan alami.
    reason: lexical_alternative
  - marker: b
    text: 'Kata “segera” juga dapat dipahami sebagai pembuka tindakan hamba yang menerima lima talenta pada ayat berikutnya: “Segera orang itu pergi dan mengusahakan talenta-talenta itu.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talenta
  rationale: Istilah historis ini mempertahankan satuan berat atau uang yang sangat besar dalam perumpamaan dan tidak menggantinya dengan nilai mata uang modern yang spekulatif. Catatan kaki menegaskan bahwa yang dimaksud bukan bakat alami.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: kepada yang seorang ... kepada yang lain ... dan kepada yang lain lagi
  rationale: Rangkaian ini menyatakan pembagian kepada tiga penerima yang berbeda dan mempertahankan kontras μέν/δέ dalam bahasa Indonesia yang wajar.
- source_word: ἕν
  choice: satu
  rationale: Kata benda 'talenta' tersirat dari unsur sebelumnya sehingga tidak perlu diulang.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: masing-masing sesuai dengan kesanggupannya
  rationale: δύναμις di sini berarti kapasitas atau kemampuan pribadi, bukan kuasa mukjizat. Bentuk distributif tunggal dipertahankan secara alami melalui 'masing-masing' dan '-nya'.
- source_word: ἀπεδήμησεν
  choice: ia pergi
  rationale: Kata kerja ini berarti pergi meninggalkan tempat, sering kali untuk melakukan perjalanan. 'Pergi' ringkas dan tidak menambahkan tujuan yang tidak disebutkan.
- source_word: εὐθέως
  choice: segera
  rationale: Adverbia ini menyatakan tindakan tanpa penundaan. Dalam teks utama, kata ini dihubungkan dengan kepergian, sedangkan kemungkinan hubungannya dengan tindakan hamba pada ayat berikutnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna τάλαντα dalam perumpamaan
  choice: talenta sebagai satuan uang atau berat yang bernilai sangat besar
  alternative: sejumlah besar uang
  rationale: Konteksnya adalah harta yang dipercayakan, bukan bakat bawaan. Istilah historis dipertahankan, dengan penjelasan agar pengertian modern kata 'talenta' tidak mengaburkan makna.
- issue: Rujukan distributif dalam κατὰ τὴν ἰδίαν δύναμιν
  choice: masing-masing sesuai dengan kesanggupannya
  alternative: kepada setiap orang menurut kesanggupannya sendiri
  rationale: Pilihan ini mempertahankan hubungan antara setiap penerima dan kapasitas pribadinya tanpa memaksakan penekanan gender yang tidak diperlukan dalam tata bahasa Indonesia.
- issue: Keterkaitan sintaksis εὐθέως
  choice: dihubungkan dengan kepergian sang tuan
  alternative: dihubungkan dengan tindakan hamba pertama pada ayat berikutnya
  rationale: Urutan kata memungkinkan pembacaan bersama kepergian, seperti dalam lapisan konsultasi Inggris, tetapi tanda baca edisi SBLGNT dan alur ayat berikutnya mendukung kemungkinan bahwa εὐθέως membuka tindakan berikutnya. Ambiguitas tekstual-sintaksis ini dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan distributif dibuat alami bagi pembaca umum. Istilah historis 'talenta' dipertahankan karena dikenal dalam tradisi perumpamaan, tetapi diberi catatan untuk mencegah salah pengertian sebagai bakat alami.
