  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: id
  text: Lima di antara mereka bodoh dan lima lainnya bijaksana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: lima orang
  rationale: Angka kardinal diterjemahkan secara langsung. Kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia karena yang dihitung adalah lima perempuan dalam kelompok yang telah disebutkan; pengulangan 'lima orang' mempertahankan keseimbangan dan pertentangan dalam teks Yunani.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini bersifat penghubung ringan dalam uraian naratif. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya sudah jelas tanpa kata penghubung tambahan; menerjemahkannya sebagai 'tetapi' akan memberi kesan pertentangan yang terlalu kuat.
- source_word: ἐξ αὐτῶν
  choice: dari mereka
  rationale: Ungkapan partitif ini menunjukkan bahwa kelima orang tersebut merupakan bagian dari kelompok yang telah disebutkan.
- source_word: ἦσαν
  choice: '[tersirat dalam predikat adjektival]'
  rationale: Kopula lampau Yunani tidak perlu dinyatakan secara eksplisit dalam kalimat nominal bahasa Indonesia. Konteks naratif sudah menunjukkan waktu lampau.
- source_word: μωραὶ
  choice: bodoh
  rationale: Kata ini menunjukkan kurangnya pengertian atau pertimbangan. 'Bodoh' merupakan padanan langsung dan mempertahankan kontras tajam dalam perumpamaan.
- source_word: καὶ πέντε φρόνιμοι
  choice: dan lima orang bijaksana
  rationale: φρόνιμος dapat berarti bijaksana, arif, atau berakal sehat. 'Bijaksana' alami dalam bahasa Indonesia dan mempertahankan kontras tradisional serta kontekstual dengan 'bodoh'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan mudah dipahami. Susunan dua bagian yang sejajar dipertahankan untuk mencerminkan keseimbangan retoris teks Yunani. Jenis kelamin para tokoh sudah tersedia dari konteks ayat sebelumnya, sehingga tidak perlu menambahkan kata 'perempuan' di ayat ini.
