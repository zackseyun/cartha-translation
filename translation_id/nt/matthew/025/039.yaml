  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: id
  text: Dan kapankah kami melihat Engkau sakit atau dalam penjara, dan kami datang kepada-Mu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengunjungi-Mu.” Secara lebih harfiah, bahasa Yunani berbunyi: “datang kepada-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kapankah
  rationale: Kata keterangan tanya ini menanyakan waktu. Bentuk "kapankah" alami dalam pertanyaan langsung dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: δέ
  choice: dan
  rationale: Di sini δέ merupakan penghubung ringan dalam rangkaian pertanyaan, bukan pertentangan yang kuat.
- source_word: εἴδομεν
  choice: kami melihat
  rationale: Bentuk aoristus merujuk pada tindakan melihat di masa lampau; dalam bahasa Indonesia, konteks pertanyaan sudah cukup menyampaikan rujukan waktunya tanpa penanda kala khusus.
- source_word: ἀσθενοῦντα
  choice: sakit
  rationale: Partisipel ini dalam konteks menyatakan keadaan sakit secara jasmani. "Sakit" jelas, lazim, dan tidak seluas arti "lemah".
- source_word: ἐν φυλακῇ
  choice: di dalam penjara
  rationale: φυλακή di sini menunjuk pada tempat penahanan. "Di dalam penjara" merupakan padanan baku yang tidak memasukkan pembedaan hukum modern.
- source_word: ἤλθομεν πρός σε
  choice: kami datang kepada-Mu
  rationale: Ungkapan Yunani secara langsung menyatakan gerak datang kepada seseorang. Terjemahan ini mempertahankan kesederhanaan sumber tanpa mempersempitnya menjadi tindakan berkunjung.
theological_decisions:
- issue: Apakah ἤλθομεν πρός σε diterjemahkan secara idiomatis sebagai "mengunjungi-Mu" atau lebih dekat pada bentuk sumber sebagai "datang kepada-Mu"
  choice: datang kepada-Mu
  alternative: mengunjungi-Mu
  rationale: Konteksnya memang menyangkut tindakan belas kasih, tetapi ungkapan Yunani sendiri tidak memakai kata kerja khusus yang berarti "mengunjungi". Pilihan utama mempertahankan keluasan ungkapan sumber, sedangkan alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur pertanyaan dipertahankan alami tanpa menambahkan penanda kala yang tidak dimiliki bahasa Indonesia.
