  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: id
  text: Namun, gadis-gadis yang bodoh itu berkata kepada gadis-gadis yang bijaksana, “Berilah kami sedikit minyak kalian, karena pelita[a] kami sedang padam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “obor” untuk “pelita” (Yunani: λαμπάδες); istilah ini dapat menunjuk pada sumber cahaya menyala yang dibawa dengan tangan, dan terjemahannya bergantung pada bagaimana adegan ini dipahami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: gadis-gadis yang bodoh
  rationale: Adjektiva substantival ini menunjuk kembali kepada para gadis dalam perumpamaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan kelompok yang bijaksana.
- source_word: φρονίμοις
  choice: gadis-gadis yang bijaksana
  rationale: Istilah ini menyatakan kebijaksanaan praktis yang terlihat dalam kesiapan. Penyebutan ulang 'gadis-gadis' memperjelas rujukannya dalam bahasa Indonesia.
- source_word: Δότε
  choice: Berilah
  rationale: Imperatif aoristis jamak ini merupakan permintaan langsung. Bentuk 'Berilah' sesuai dengan tuturan yang wajar dan bermartabat.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: sedikit minyak kalian
  rationale: ἐκ dengan genitif memiliki nuansa partitif, yakni meminta sebagian dari persediaan minyak mereka. 'Sedikit minyak kalian' menyampaikan hal itu secara alami.
- source_word: λαμπάδες
  choice: pelita
  rationale: λαμπάς dapat berarti pelita atau obor. 'Pelita' cocok dengan konteks penggunaan minyak dan lazim dipahami pembaca Indonesia, sementara kemungkinan 'obor' dipertahankan dalam catatan kaki.
- source_word: σβέννυνται
  choice: hampir padam
  rationale: Bentuk kini ini menggambarkan nyala yang sedang menuju padam. 'Hampir padam' merupakan ungkapan Indonesia yang alami untuk proses tersebut, tanpa menyatakan bahwa nyalanya sudah sepenuhnya mati.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan permintaan dan paling jelas diterjemahkan 'karena' dalam bahasa Indonesia modern.
