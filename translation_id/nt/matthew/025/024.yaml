  to: Kemudian, orang yang telah menerima satu talenta itu juga datang dan berkata, “Tuan, aku tahu bahwa Tuan adalah orang yang keras[a], yang menuai di tempat yang tidak Tuan taburi dan mengumpulkan dari tempat yang tidak Tuan taburkan[b].”
