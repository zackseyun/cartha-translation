  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: id
  text: Kemudian, orang yang telah menerima satu talenta itu juga datang dan berkata, “Tuan, aku tahu bahwa Tuan adalah orang yang keras[a], yang menuai di tempat yang tidak Tuan taburi dan mengumpulkan dari tempat yang tidak Tuan taburkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasar” atau “kejam”. Kata Yunani yang dipakai dapat menunjuk pada sifat keras, kasar, atau tegas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengumpulkan dari tempat yang tidak Tuan serakkan.” Yang disebarkan atau diserakkan tidak disebutkan dalam bahasa Yunani; dalam gambaran pertanian ini, kemungkinan yang dimaksud ialah benih.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: datang
  rationale: Partisip aoristus ini mendahului tindakan berbicara. 'Datang' alami dalam urutan naratif bahasa Indonesia dan tidak sekaku 'menghampiri'.
- source_word: δὲ καὶ
  choice: Kemudian ... juga
  rationale: δέ menggerakkan alur, sedangkan καί memasukkan hamba ini ke dalam rangkaian orang yang menghadap. Gabungan ini mempertahankan kedua fungsi tersebut secara wajar.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: orang yang menerima satu talenta itu
  rationale: Konstruksi partisipial berartikel mengenali hamba berdasarkan apa yang diterimanya. Bahasa Indonesia tidak memerlukan bentuk kala lampau sempurna; konteks dan penunjuk 'itu' menyampaikan rujukan yang sudah dikenal.
- source_word: τάλαντον
  choice: talenta
  rationale: Mempertahankan istilah ukuran uang kuno dan kaitan leksikalnya dalam perumpamaan tanpa mengkhususkannya sebagai emas atau nilai tertentu.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam adegan perumpamaan ini, κύριε adalah sapaan hormat seorang hamba kepada tuannya. 'Tuan' paling alami dalam bahasa Indonesia dan tetap membedakannya dari gelar ilahi yang tidak harus dimaksudkan pada tingkat cerita.
- source_word: ἔγνων σε ὅτι
  choice: aku tahu bahwa
  rationale: Walaupun σε hadir dalam bahasa Yunani, konstruksi keseluruhannya menyatakan pengetahuan tentang watak orang yang disapa. 'Aku tahu bahwa' alami dan tidak menghasilkan bentuk Indonesia yang janggal seperti 'aku mengenal Tuan bahwa'.
- source_word: σκληρὸς
  choice: keras
  rationale: σκληρός dapat berarti keras, kasar, atau tegas. 'Keras' mempertahankan keluasan makna dan nada tuduhan tanpa mempersempitnya menjadi 'kejam'.
- source_word: ἄνθρωπος
  choice: orang
  rationale: Dalam predikat 'orang yang keras', 'orang' merupakan padanan modern dan alami; jenis kelamin tokoh sudah jelas dari konteks dan sapaan.
- source_word: θερίζων
  choice: yang menuai
  rationale: Mempertahankan citra pertanian serta hubungan langsung dengan tindakan menabur.
- source_word: ὅπου οὐκ ἔσπειρας
  choice: di tempat yang tidak Tuan taburi
  rationale: σπείρω berarti menabur. Bentuk transitif Indonesia dengan tempat sebagai sasaran tetap jelas tanpa menambahkan objek 'benih' yang tidak tersurat.
- source_word: συνάγων
  choice: mengumpulkan
  rationale: Padanan luas yang cocok dengan konteks hasil pertanian dan sejajar dengan 'menuai'.
- source_word: ὅθεν οὐ διεσκόρπισας
  choice: dari tempat yang tidak Tuan sebari
  rationale: ὅθεν secara eksplisit berarti 'dari tempat mana', sedangkan διασκορπίζω berarti menyebarkan atau menyerakkan. 'Sebari' mempertahankan gambaran menyebar tanpa memasukkan 'benih' yang tidak disebutkan.
theological_decisions:
- issue: Sapaan κύριος dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Pada tingkat cerita, seorang hamba sedang menyapa majikannya. 'Tuan' menyampaikan relasi dan kesantunan itu dengan alami, tanpa memaksakan bahwa sapaan tersebut merupakan pengakuan gelar ilahi.
- issue: Penilaian terhadap watak sang tuan
  choice: Pernyataan diterjemahkan sebagai tuduhan hamba tanpa dilunakkan atau dibenarkan
  alternative: Memakai 'kejam' atau 'tegas' untuk menentukan penilaian moral
  rationale: '''Keras'' membiarkan ketegangan naratif tetap ada: teks melaporkan pandangan hamba, tetapi ayat ini sendiri tidak memutuskan apakah pandangan itu benar.'
- issue: Objek tersirat pada διεσκόρπισας
  choice: Tidak menambahkan 'benih' dalam teks utama
  alternative: Menambahkan 'benih' demi memperjelas gambaran pertanian
  rationale: Bahasa sumber tidak menyebut objek. Ungkapan Indonesia 'tempat yang tidak Tuan sebari' masih dapat dipahami dalam paralel dengan menabur dan mempertahankan ketakterangan sumber.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Huruf kapital pada 'Tuan' dipakai secara konsisten sebagai pronomina sapaan hormat. Struktur paralel 'menuai ... dan mengumpulkan ...' dipertahankan, sementara idiom Yunani disesuaikan secukupnya agar alami tanpa menghapus ambiguitas.
