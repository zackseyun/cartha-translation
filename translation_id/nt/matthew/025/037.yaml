id: MAT.25.37
reference: Matthew 25:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: id
  text: Lalu orang-orang benar itu akan menjawab-Nya, “Tuhan, kapan kami melihat Engkau lapar dan memberi-Mu makan, atau haus dan memberi-Mu minum?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan dalam wacana secara ringkas dan alami.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: akan menjawab-Nya
  rationale: Bentuk futur ἀποκρίνομαι bermakna aktif; akhiran -Nya menyatakan objek tak langsung secara wajar dalam bahasa Indonesia.
- source_word: οἱ δίκαιοι
  choice: orang-orang benar itu
  rationale: Adjektiva substantival ini menunjuk kepada kelompok tertentu dalam adegan tersebut; bentuk ini mempertahankan makna benar tanpa menambahkan penafsiran mengenai dasar kebenaran mereka.
- source_word: λέγοντες
  choice: dinyatakan melalui pengantar langsung kepada kutipan
  rationale: Dalam bahasa Indonesia, verba 'menjawab' yang langsung diikuti ujaran sudah secara alami memuat fungsi partisipel 'berkata'; menerjemahkannya lagi akan terasa berlebihan.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini mempertahankan nuansa penghormatan sekaligus resonansi kristologis κύριος tanpa mempersempitnya menjadi sekadar 'Guru' atau 'Tuan'.
- source_word: πότε
  choice: kapan
  rationale: Padanan interogatif temporal yang langsung dan wajar dalam bahasa Indonesia modern.
- source_word: σε εἴδομεν πεινῶντα
  choice: kami melihat Engkau lapar
  rationale: Konstruksi melihat dengan partisipel sebagai pelengkap objek diterjemahkan secara alami tanpa mengubah aspek keadaan yang diamati.
- source_word: ἐθρέψαμεν
  choice: memberi-Mu makan
  rationale: Menyampaikan tindakan konkret memberi makan dengan ungkapan Indonesia yang lebih alami daripada 'memelihara' atau 'menutrisi'.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: haus dan memberi-Mu minum
  rationale: Mempertahankan kesejajaran dengan keadaan lapar dan tindakan memberi makan; 'memberi minum' merupakan padanan alami dan dekat bagi ποτίζω.
theological_decisions:
- issue: Sebutan κύριος dalam sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan baik penghormatan dalam sapaan maupun kemungkinan bobot kristologisnya, tanpa menjelaskan lebih jauh daripada teks.'
- issue: Identitas dan status οἱ δίκαιοι
  choice: orang-orang benar itu
  alternative: orang-orang yang dibenarkan itu
  rationale: Teks menyebut mereka 'yang benar' tetapi tidak secara eksplisit menyatakan dalam ayat ini proses atau dasar mereka menjadi benar; terjemahan tidak menambahkan bentuk pasif teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada akhiran pronominal dan kata ganti untuk Yesus mengikuti kebiasaan penulisan Alkitab Indonesia. Partisipel λέγοντες tidak diterjemahkan secara terpisah karena fungsi pengantar ujarannya sudah jelas dalam pola 'menjawab-Nya' yang diikuti kutipan langsung.
