  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: id
  text: Namun, ketika Anak Manusia datang dalam kemuliaan-Nya dan semua malaikat bersama-Nya, saat itu Ia akan duduk di takhta kemuliaan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “takhta-Nya yang mulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Namun, ketika
  rationale: Ὅταν memperkenalkan satu peristiwa mendatang, sehingga 'ketika' wajar dalam konteks eskatologis. δὲ menandai peralihan dengan nuansa pertentangan ringan, yang diterjemahkan 'Namun'.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar baku Yesus serta gaung Daniel 7 tanpa menafsirkannya menjadi sebutan lain.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: dalam kemuliaan-Nya
  rationale: δόξα di sini menunjuk pada keagungan dan kehormatan yang dinyatakan; 'kemuliaan' mempertahankan resonansi alkitabiahnya.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: semua malaikat bersama-Nya
  rationale: Mengikuti bentuk Yunani 'semua malaikat' tanpa menambahkan kata milik yang tidak tertulis, dan menerjemahkan μετ’ αὐτοῦ sebagai penyertaan.
- source_word: τότε καθίσει
  choice: saat itu Ia akan duduk
  rationale: τότε menandai urutan sesudah kedatangan tersebut; bentuk futurum καθίσει diterjemahkan langsung sebagai 'akan duduk'.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: di takhta kemuliaan-Nya
  rationale: Terjemahan ini mempertahankan konstruksi genitif Yunani dan ambiguitas apakah kemuliaan itu terutama mencirikan takhta atau merupakan kemuliaan Sang Anak Manusia, sambil tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Gelar tradisional ini mempertahankan kaitan antarteks dengan Daniel 7 serta peran mesianik dan penghakiman dalam konteks.
- issue: Konstruksi θρόνου δόξης αὐτοῦ
  choice: takhta kemuliaan-Nya
  alternative: takhta-Nya yang mulia
  rationale: Bentuk yang lebih formal dipilih untuk menjaga struktur dan ketegangan makna teks sumber; alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Anak Manusia mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia dan membantu kejelasan rujukan tanpa menambahkan isi leksikal.
