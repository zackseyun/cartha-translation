base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: id
  text: Sebab gadis-gadis bodoh itu, ketika mengambil pelita mereka, tidak membawa minyak bersama mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “obor” untuk “pelita” (Yunani: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan atas pernyataan sebelumnya dan mempertahankan daya penghubung teks Yunani.
- source_word: μωραὶ
  choice: gadis-gadis yang bodoh itu
  rationale: Adjektiva feminin jamak ini merujuk kembali kepada gadis-gadis dalam perumpamaan; penyebutan nomina membuat rujukannya jelas dan wajar dalam bahasa Indonesia.
- source_word: λαβοῦσαι
  choice: ketika ... membawa
  rationale: Partisip aoris dipahami secara temporal terhadap verba utama; 'ketika' mengungkapkan hubungan itu dengan alami.
- source_word: λαμπάδας
  choice: pelita
  rationale: Padanan tradisional dan wajar dalam konteks penerangan dengan minyak; 'obor' tetap merupakan kemungkinan leksikal yang dicatat dalam catatan kaki.
- source_word: οὐκ ἔλαβον
  choice: tidak membawa
  rationale: Mempertahankan pengulangan verba yang sama dengan λαβοῦσαι sejauh mungkin dalam bahasa Indonesia.
- source_word: μεθ’ ἑαυτῶν
  choice: bersama mereka
  rationale: Padanan idiomatis bagi frasa refleksif Yunani tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἔλαιον
  choice: minyak
  rationale: Padanan langsung; dalam konteks ini minyak digunakan untuk pelita atau obor.
