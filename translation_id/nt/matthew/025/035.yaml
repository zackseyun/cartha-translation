  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: id
  text: Sebab Aku lapar dan kamu memberi Aku makan; Aku haus dan kamu memberi Aku minum; Aku seorang asing dan kamu menyambut Aku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima Aku” atau “menampung Aku.” Kata Yunani yang dipakai secara harfiah berarti “mengumpulkan” atau “menghimpunkan,” tetapi dalam konteks ini menunjuk pada penerimaan ramah terhadap seorang asing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: Aku lapar
  rationale: Bentuk aoris ini menyatakan pengalaman lapar pada masa lampau dalam rangkaian kisah; bahasa Indonesia tidak perlu menandai kala pada verba, dan bentuk ini paling wajar.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel γάρ memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut secara ringkas.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: kamu memberi Aku makan
  rationale: Konstruksi δίδωμι dengan datif dan infinitif berarti memberi seseorang sesuatu untuk dimakan. Ungkapan Indonesia “memberi Aku makan” menyampaikan maknanya secara alami tanpa harus menambahkan kata “sesuatu”.
- source_word: ἐδίψησα
  choice: Aku haus
  rationale: Bentuk ini menyatakan pengalaman haus. Ungkapan keadaan tanpa penanda kala merupakan padanan Indonesia yang alami.
- source_word: ἐποτίσατέ με
  choice: kamu memberi Aku minum
  rationale: ποτίζω di sini berarti memberi minum, selaras dengan tindakan memberi makan pada klausa sebelumnya; tidak dibatasi menjadi “air” karena sumber tidak menyebut jenis minuman.
- source_word: ξένος
  choice: seorang asing
  rationale: ξένος menunjuk pada seseorang yang tidak dikenal atau tidak memiliki tempat dalam lingkungan sosial setempat. “Seorang asing” mempertahankan cakupan ini tanpa membatasinya pada kewarganegaraan atau status hukum.
- source_word: συνηγάγετέ με
  choice: kamu menyambut Aku
  rationale: Walaupun συνάγω pada dasarnya berarti mengumpulkan atau membawa bersama, dalam pasangan ξένος ... συνηγάγετέ με ungkapan ini menunjuk pada penerimaan yang ramah terhadap orang asing. “Menyambut Aku” alami dalam bahasa Indonesia, sedangkan kemungkinan nuansa menerima atau menampung dijelaskan dalam catatan.
theological_decisions:
- issue: Makna keramahtamahan dalam ξένος ἤμην καὶ συνηγάγετέ με
  choice: Aku seorang asing dan kamu menyambut Aku
  alternative: Aku seorang asing dan kamu menerima/menampung Aku
  rationale: Terjemahan utama mempertahankan tindakan pribadi berupa penerimaan yang ramah tanpa mempersempit ξένος menjadi kategori etnis, politik, atau hukum. Catatan menjaga nuansa bahwa penyambutan itu dapat mencakup penerimaan ke dalam rumah atau lingkungan.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Pengulangan “Aku ... dan kamu ...” dipertahankan untuk mengikuti kesejajaran retoris teks Yunani. Huruf kapital pada “Aku” mengikuti rujukannya kepada Sang Raja dalam konteks langsung.
