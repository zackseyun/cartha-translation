id: MAT.25.36
reference: Matthew 25:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: id
  text: Aku telanjang, dan kalian memberi-Ku pakaian; Aku sakit, dan kalian menjenguk-Ku[a]; Aku berada di penjara, dan kalian datang kepada-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “menjenguk” juga dapat mencakup perhatian dan kepedulian terhadap orang yang dikunjungi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: telanjang
  rationale: Ini padanan langsung bagi keadaan tanpa pakaian. Dalam konteks ini dapat pula menyiratkan kekurangan pakaian yang layak, tetapi “telanjang” mempertahankan ungkapan konkret dan hubungannya dengan tindakan memberi pakaian.
- source_word: περιεβάλετέ με
  choice: kalian memberi-Ku pakaian
  rationale: Secara harfiah verba ini menggambarkan mengenakan atau menyelubungi seseorang dengan pakaian. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan tindakan konkret menyediakan pakaian.
- source_word: ἠσθένησα
  choice: Aku sakit
  rationale: Verba ini dapat berarti lemah, tetapi dalam rangkaian tindakan belas kasih ini makna sakit paling sesuai dan paling alami.
- source_word: ἐπεσκέψασθέ με
  choice: kalian menjenguk-Ku
  rationale: “Menjenguk” menyampaikan tindakan datang menemui orang sakit dengan perhatian, tanpa memperluasnya secara tegas menjadi merawat.
- source_word: ἐν φυλακῇ ἤμην
  choice: Aku berada di penjara
  rationale: Padanan ini mempertahankan konstruksi keadaan dalam bahasa Yunani dan memakai istilah umum bagi tempat penahanan.
- source_word: ἤλθατε πρός με
  choice: kalian datang kepada-Ku
  rationale: Terjemahan ini mempertahankan kesederhanaan ungkapan Yunani dan tidak menambahkan gagasan “menjenguk” yang tidak dinyatakan dalam klausa ini.
theological_decisions:
- issue: Tingkat perluasan makna dalam tindakan belas kasih
  choice: Mempertahankan tindakan konkret memberi pakaian, menjenguk, dan datang kepada Yesus.
  alternative: Memperluasnya menjadi “merawat-Ku” atau “datang mengunjungi-Ku.”
  rationale: Bahasa Yunani menekankan tindakan nyata dengan ungkapan sederhana. Terjemahan tidak menambahkan penerapan pastoral atau doktrinal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan bahwa kata ganti Yunani berbentuk jamak. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi penulisan religius Indonesia.
