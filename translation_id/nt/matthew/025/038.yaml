  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: id
  text: Dan kapan kami melihat Engkau sebagai orang asing[a] dan memberi-Mu tumpangan[b], atau tanpa pakaian[c] dan memberi-Mu pakaian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang luar” atau “pendatang.” Kata Yunani ini dapat menunjuk kepada seseorang yang tidak dikenal atau berasal dari luar lingkaran sendiri; dalam konteks ini, orang tersebut membutuhkan keramahtamahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengumpulkan masuk” atau “menerima”; dalam konteks ini maksudnya memberi tumpangan atau menerima seseorang dengan keramahtamahan.
    reason: lexical_alternative
  - marker: c
    text: Atau “kekurangan pakaian.” Kata Yunani ini dapat berarti telanjang ataupun tidak memiliki pakaian yang memadai.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kapan
  rationale: Kata keterangan tanya ini menanyakan waktu; “kapan” merupakan padanan Indonesia yang langsung dan alami.
- source_word: δέ
  choice: dan
  rationale: Di sini δέ menghubungkan pertanyaan ini dengan rangkaian sebelumnya secara ringan, bukan menyatakan pertentangan yang kuat.
- source_word: ξένον
  choice: sebagai orang asing
  rationale: ξένος menunjuk kepada orang yang tidak dikenal atau berasal dari luar lingkaran seseorang dan membutuhkan keramahtamahan. Frasa ini juga mempertahankan fungsi predikatifnya setelah “melihat Engkau”.
- source_word: συνηγάγομεν
  choice: menerima Engkau sebagai tamu
  rationale: Dalam konteks ini συνάγω, yang secara harfiah dapat berarti “mengumpulkan” atau “membawa masuk,” mengacu pada menerima seseorang dengan keramahtamahan. Padanan ini alami dalam bahasa Indonesia dan memperjelas tindakan yang dimaksud tanpa mengubahnya menjadi sekadar sambutan lisan.
- source_word: γυμνὸν
  choice: tanpa pakaian
  rationale: γυμνός dapat berarti telanjang atau tidak memiliki pakaian yang memadai. “Tanpa pakaian” menyampaikan makna dasarnya, sedangkan keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: περιεβάλομεν
  choice: memberi Engkau pakaian
  rationale: περιβάλλω di sini berarti mengenakan atau menyediakan pakaian bagi seseorang. “Memberi Engkau pakaian” terdengar alami dan tepat dalam konteks tindakan belas kasih.
theological_decisions:
- issue: Makna ξένος dalam perumpamaan tentang penghakiman dan tindakan belas kasih
  choice: orang asing
  alternative: orang luar; pendatang
  rationale: “Orang asing” mempertahankan arti sosial seseorang yang tidak dikenal atau tidak termasuk dalam lingkaran sendiri serta membutuhkan penerimaan, tanpa membatasi maknanya pada kewarganegaraan atau kelompok etnis tertentu.
- issue: Cakupan γυμνός
  choice: tanpa pakaian
  alternative: kekurangan pakaian; berpakaian tidak layak
  rationale: Teks utama mempertahankan makna lugas, sementara catatan kaki menjaga kemungkinan bahwa yang dimaksud bukan ketelanjangan mutlak, melainkan ketiadaan pakaian yang memadai.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “Engkau” dipertahankan karena para pembicara sedang menyapa Sang Raja secara langsung. Struktur pertanyaan paralel dibuat ringkas sesuai teks Yunani, dengan kata kerja “melihat” dipahami juga pada bagian kedua.
