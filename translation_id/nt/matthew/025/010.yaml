id: MAT.25.10
reference: Matthew 25:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: id
  text: Namun, sementara mereka pergi untuk membeli, mempelai laki-laki itu datang. Mereka yang sudah siap masuk bersamanya ke pesta pernikahan[a], lalu pintu ditutup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perjamuan pernikahan” atau cukup “pernikahan.” Bentuk jamak dalam bahasa Yunani dapat merujuk pada seluruh perayaan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Namun, sementara mereka pergi untuk membeli
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan, sedangkan infinitif aoris menyatakan tujuan. Objek yang hendak dibeli tidak disebutkan dalam ayat ini, sehingga terjemahan juga tidak menambahkannya.
- source_word: ὁ νυμφίος
  choice: mempelai laki-laki itu
  rationale: Pilihan ini merupakan padanan Indonesia yang tepat bagi laki-laki yang menikah serta mempertahankan gambaran perumpamaan tanpa menambahkan tafsir kristologis ke dalam teks.
- source_word: αἱ ἕτοιμοι
  choice: mereka yang sudah siap
  rationale: Adjektiva feminin jamak ini dipakai secara substantival dan menunjuk kepada para gadis yang siap. Kata 'sudah' menyampaikan keadaan siap yang telah tercapai secara wajar dalam bahasa Indonesia.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: masuk bersamanya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan dengan tepat menyampaikan gerak masuk bersama mempelai laki-laki.
- source_word: εἰς τοὺς γάμους
  choice: ke pesta pernikahan
  rationale: Bentuk Yunani yang secara gramatikal jamak dapat mengacu pada seluruh perayaan pernikahan. 'Pesta pernikahan' jelas dan alami dalam konteks ini.
- source_word: ἐκλείσθη ἡ θύρα
  choice: pintu ditutup
  rationale: Bentuk pasif aoris dipertahankan. Ungkapan ringkas ini menyampaikan tindakan penutupan dan kesan final dalam adegan tersebut tanpa menentukan pelakunya.
theological_decisions:
- issue: Gambaran pernikahan dalam konteks perumpamaan
  choice: Mempertahankan 'mempelai laki-laki' dan 'pesta pernikahan' sebagai gambaran naratif biasa.
  alternative: Menjelaskan secara eksplisit identitas simbolis mempelai laki-laki atau memakai istilah yang lebih interpretatif.
  rationale: Makna teologis perumpamaan sebaiknya muncul dari konteks, bukan dimasukkan sebagai penjelasan ke dalam terjemahan ayat.
- issue: Objek dari tindakan membeli
  choice: 'Tidak menyebutkan objek: ''pergi untuk membeli''.'
  alternative: Menambahkan 'minyak' berdasarkan ayat sebelumnya.
  rationale: Teks Yunani ayat ini tidak menyebutkan objeknya. Meskipun konteks menjadikannya jelas, mempertahankan bentuk tanpa objek menghindari penambahan yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan khidmat. Struktur kalimat dibagi dua agar alami dan mudah dipahami, sambil mempertahankan urutan kejadian serta hubungan antarklausa dalam teks Yunani. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskan oleh catatan tersebut.
