  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: id
  text: Karena itu, tetaplah berjaga-jaga[a], sebab kalian tidak tahu hari maupun jamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetaplah terjaga” atau “waspadalah.” Bentuk perintah Yunani menyiratkan kewaspadaan yang terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Imperatif kini aktif orang kedua jamak menyerukan kewaspadaan yang terus-menerus. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran berjaga dalam perumpamaan.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari perumpamaan sebelumnya.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah dan terdengar wajar dalam ragam Indonesia yang bermartabat.
- source_word: οὐκ οἴδατε
  choice: kalian tidak tahu
  rationale: Menerjemahkan secara langsung verba pengetahuan yang dinegasikan dalam bentuk orang kedua jamak; 'kalian' membuat bentuk jamaknya jelas.
- source_word: τὴν ἡμέραν
  choice: hari
  rationale: Mempertahankan ungkapan sumber tanpa menambahkan secara eksplisit peristiwa yang dimaksud oleh konteks.
- source_word: οὐδὲ τὴν ὥραν
  choice: maupun jamnya
  rationale: Menghubungkan unsur negatif kedua secara alami; sufiks '-nya' menandai jam tertentu yang tidak diketahui tanpa memperluas tafsir.
theological_decisions:
- issue: Gambaran imperatif tentang kewaspadaan
  choice: tetaplah berjaga-jaga
  alternative: tetaplah terjaga; waspadalah
  rationale: Pilihan ini menyampaikan kesiapsiagaan berkelanjutan serta mempertahankan gambaran perumpamaan, tanpa membatasinya pada suatu sistem eskatologis tertentu.
- issue: Cakupan ungkapan 'hari maupun jamnya'
  choice: mempertahankan ungkapan tanpa penjelasan interpretatif
  alternative: hari maupun jam kedatangan Anak Manusia; waktu yang ditetapkan
  rationale: Walaupun konteks lebih luas berkenaan dengan penghakiman dan kedatangan Anak Manusia, ayat ini sendiri hanya menyebut hari dan jam; terjemahan tidak menambahkan keterangan teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Bentuk jamak 'kalian' dipakai untuk menyatakan orang kedua jamak dalam teks Yunani. 'Tetaplah berjaga-jaga' menjaga metafora kontekstual sekaligus menyampaikan tindakan berkelanjutan.
