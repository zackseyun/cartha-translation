  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: id
  text: Ia akan menempatkan domba-domba di sebelah kanan-Nya, sedangkan anak-anak kambing[a] di sebelah kiri-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kambing-kambing muda.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Yunani berbunyi “dari sebelah kanan-Nya ... dari sebelah kiri”; ini merupakan ungkapan untuk penempatan di sisi kanan dan sisi kiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: akan menempatkan
  rationale: 'Bentuk futur aktif dari ἵστημι di sini bersifat kausatif: membuat berdiri atau menempatkan pada posisi tertentu. ''Akan menempatkan'' alami dalam bahasa Indonesia dan sesuai dengan adanya dua objek langsung.'
- source_word: τὰ μὲν πρόβατα
  choice: domba-domba
  rationale: πρόβατα adalah istilah umum untuk domba. Reduplikasi menyatakan jamak secara jelas dan alami dalam konteks dua kelompok yang diperbandingkan.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: di sebelah kanan-Nya
  rationale: Ungkapan ἐκ + genitif dalam konteks penempatan menyatakan posisi di sisi kanan. Terjemahan ini menyampaikan idiom tersebut dengan wajar tanpa menambahkan makna simbolis.
- source_word: τὰ δὲ ἐρίφια
  choice: sedangkan kambing-kambing muda
  rationale: ἐρίφια secara lebih khusus menunjuk kambing muda atau anak kambing. 'Kambing-kambing muda' mempertahankan nuansa usia tanpa kemungkinan ambiguitas kata 'anak' dalam bahasa Indonesia.
- source_word: ἐξ εὐωνύμων
  choice: di sebelah kiri-Nya
  rationale: Ungkapan ini secara idiomatis berarti di sisi kiri. Pronomina posesif disediakan dalam bahasa Indonesia agar pasangan kanan-kiri jelas dan seimbang; acuannya tetap kepada tokoh yang sama.
- source_word: μὲν ... δὲ
  choice: sedangkan
  rationale: Pasangan partikel ini membedakan dua kelompok secara kontras. 'Sedangkan' menghasilkan susunan yang alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah makna simbolis posisi kanan dan kiri perlu dinyatakan secara eksplisit
  choice: 'Menerjemahkannya hanya sebagai posisi ruang: ''di sebelah kanan-Nya ... di sebelah kiri-Nya'''
  alternative: Menjelaskannya sebagai tempat perkenanan dan tempat penolakan
  rationale: Teks Yunani menyatakan penempatan kedua kelompok. Nilai simbolis kanan dan kiri muncul dari konteks penghakiman, tetapi tidak perlu disisipkan ke dalam terjemahan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Ia' dipakai untuk subjek, dan bentuk '-Nya' mengikuti konvensi penghormatan dalam teks Alkitab Indonesia. Nuansa khusus ἐρίφια dipertahankan dalam teks utama, sementara padanan alternatif dicatat dalam catatan kaki.
