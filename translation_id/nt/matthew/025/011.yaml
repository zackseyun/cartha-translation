base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: id
  text: Kemudian gadis-gadis lainnya juga datang dan berkata, “Tuhan, Tuhan, bukakanlah[a] bagi kami!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, objek “pintu” tidak disebutkan; objek itu tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Kemudian
  rationale: Keterangan waktu ini menandai tindakan yang terjadi sesudah peristiwa sebelumnya; “kemudian” alami dalam narasi Indonesia.
- source_word: δὲ
  choice: —
  rationale: Partikel penghubung ringan ini tidak diterjemahkan tersendiri karena peralihan sudah jelas melalui “Kemudian”.
- source_word: ἔρχονται
  choice: datang
  rationale: Bentuk kini naratif dipadankan secara alami dengan “datang”, yang tetap mempertahankan gerak masuk ke dalam adegan.
- source_word: καὶ
  choice: juga
  rationale: Menyatakan bahwa kelompok gadis yang tersisa turut datang.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: gadis-gadis yang lain itu
  rationale: λοιπαί berarti yang lain atau yang tersisa. Dalam konteks perumpamaan ini, παρθένοι secara wajar merujuk kepada gadis-gadis muda yang belum menikah; pilihan ini lebih alami dalam bahasa Indonesia daripada “perawan-perawan” tanpa mengubah rujukannya.
- source_word: λέγουσαι
  choice: dan berkata
  rationale: Partisipel yang memperkenalkan ucapan langsung diungkapkan dengan rangkaian verba yang alami dalam bahasa Indonesia.
- source_word: Κύριε κύριε
  choice: Tuhan, Tuhan
  rationale: Pengulangan dipertahankan untuk menyampaikan desakan, sedangkan “Tuhan” menjaga kemungkinan makna sapaan hormat sekaligus gema teologis dalam Injil Matius.
- source_word: ἄνοιξον ἡμῖν
  choice: bukakanlah bagi kami
  rationale: Imperatif aoristus dengan datif meminta agar sesuatu yang tersirat dari konteks, yakni pintu, dibuka demi memberi mereka jalan masuk. Objek tidak ditambahkan ke teks utama.
theological_decisions:
- issue: Pemadanan κύριος dalam sapaan langsung
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: “Tuhan” mempertahankan ketegangan antara sapaan hormat dalam cerita dan bobot teologis kata tersebut dalam Injil Matius, tanpa membatasinya pada salah satu makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Gadis-gadis” dipilih agar alami bagi pembaca umum; partikel “-lah” menyampaikan permohonan mendesak tanpa terdengar kasar.
