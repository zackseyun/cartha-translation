  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: id
  text: Namun, sementara pengantin laki-laki itu tak kunjung datang[a], mereka semua mengantuk lalu tertidur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sementara pengantin laki-laki itu lama datangnya” atau “sementara pengantin laki-laki itu tertunda.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka semua menjadi mengantuk dan sedang tidur.” Bahasa Yunani membedakan mulai menjadi mengantuk (ἐνύσταξαν) dari berada dalam keadaan tidur (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: lama datangnya
  rationale: Partisipel kini dalam konstruksi genitif absolut menyatakan bahwa kedatangan pengantin laki-laki memakan waktu lebih lama daripada yang diharapkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kemungkinan makna ‘tertunda’ tanpa menentukan penyebab keterlambatan.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai perkembangan narasi dengan nuansa kontras ringan antara penantian dan akibat lamanya kedatangan.
- source_word: νυμφίου
  choice: pengantin laki-laki
  rationale: νυμφίος secara khusus menunjuk kepada mempelai atau pengantin laki-laki. Pilihan ini jelas bagi pembaca modern serta mempertahankan gambaran pernikahan dalam perumpamaan.
- source_word: ἐνύσταξαν
  choice: mengantuk
  rationale: νυστάζω menyatakan mulai atau menjadi mengantuk. Kata ini membedakan tahap kantuk dari tidur yang disebut sesudahnya.
- source_word: πᾶσαι
  choice: mereka semua
  rationale: Bentuk feminin jamak ini merujuk kepada seluruh gadis dalam perumpamaan. ‘Mereka semua’ menyampaikan cakupan menyeluruh secara alami.
- source_word: ἐκάθευδον
  choice: lalu tertidur
  rationale: καθεύδω berarti tidur; bentuk imperfek dapat menggambarkan keadaan sedang tidur. Dalam rangkaian setelah ‘mengantuk’, ‘lalu tertidur’ menyampaikan perkembangan alami menuju tidur, sedangkan catatan kaki mempertahankan nuansa aspek alternatif.
theological_decisions:
- issue: Gambaran perumpamaan tentang pengantin laki-laki
  choice: Mempertahankan ‘pengantin laki-laki’ sebagai tokoh dalam gambaran perumpamaan tanpa menambahkan identifikasi kristologis secara eksplisit.
  alternative: Menggunakan sebutan yang lebih interpretatif atau secara langsung menyebut Kristus.
  rationale: Konteks Injil Matius dapat memberi gambaran ini resonansi teologis, tetapi ayat tersebut sendiri tetap berada pada tingkat cerita perumpamaan. Terjemahan tidak boleh menyelesaikan implikasi itu dengan penambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. ‘Lama datangnya’ lebih idiomatis daripada bentuk pasif yang dapat menyiratkan adanya pihak luar sebagai penyebab keterlambatan. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
