  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: id
  text: Kemudian mereka juga akan menjawab, ‘Tuhan, kapan kami melihat Engkau lapar atau haus, sebagai orang asing, telanjang, sakit, atau di dalam penjara, dan tidak melayani Engkau[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “menolong Engkau” atau “merawat Engkau” untuk “melayani Engkau” (Yunani: διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam adegan penghakiman secara alami dalam bahasa Indonesia.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: mereka juga akan menjawab
  rationale: Mengungkapkan jawaban kelompok ini sebagaimana kelompok sebelumnya; λέγοντες tidak perlu diterjemahkan tersendiri karena sudah tersirat secara alami dalam pengantar ujaran langsung bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus yang mempertahankan bobot gelar κύριος tanpa mempersempitnya menjadi sekadar 'Tuan'.
- source_word: πεινῶντα ἢ διψῶντα
  choice: lapar atau haus
  rationale: Partisip predikatif Yunani paling alami dinyatakan sebagai adjektiva keadaan dalam bahasa Indonesia.
- source_word: ξένον
  choice: sebagai orang asing
  rationale: Menunjukkan keadaan orang yang berada di luar lingkungan rumah atau komunitas dan membutuhkan penerimaan, tanpa membatasi pada etnis atau kewarganegaraan.
- source_word: γυμνὸν
  choice: telanjang
  rationale: Mempertahankan daya leksikal langsung, meskipun dalam konteks dapat mencakup keadaan kekurangan pakaian.
- source_word: ἀσθενῆ
  choice: sakit
  rationale: Dalam daftar kebutuhan jasmani dan sosial ini, makna penyakit lebih sesuai daripada kelemahan umum.
- source_word: ἐν φυλακῇ
  choice: di dalam penjara
  rationale: Padanan langsung dan alami untuk keadaan dipenjarakan.
- source_word: οὐ διηκονήσαμέν σοι
  choice: tidak melayani Engkau
  rationale: Mempertahankan cakupan διακονέω sebagai pelayanan atau pertolongan praktis kepada seseorang.
theological_decisions:
- issue: Gelar κύριος dalam sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: ‘Tuhan’ mempertahankan sapaan hormat sekaligus gema kristologis dalam Injil Matius tanpa menambahkan klaim di luar teks.
- issue: Cakupan διακονέω pada klausa terakhir
  choice: melayani Engkau
  alternative: menolong Engkau / merawat Engkau
  rationale: ‘Melayani’ mempertahankan cakupan luas tindakan praktis dan hubungan pelayanan kepada Sang Raja; catatan kaki memberi alternatif yang lebih kontekstual.
- issue: Hubungan οὐ dengan pertanyaan dan rangkaian keadaan
  choice: tetapi tidak melayani
  alternative: dan tidak melayani
  rationale: ‘Tetapi’ membuat kontras implisit antara melihat kebutuhan dan tidak bertindak menjadi alami dalam bahasa Indonesia, tanpa mengubah isi pertanyaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi kata ganti ‘Engkau’ dipakai dalam sapaan langsung kepada Tuhan sesuai kebiasaan luas penerbitan Alkitab Indonesia. Struktur daftar dipertahankan, sementara ‘mengatakan’ tidak ditambahkan setelah ‘menjawab’ karena terasa berlebih dalam bahasa Indonesia.
