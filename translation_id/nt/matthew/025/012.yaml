  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: id
  text: 'Tetapi ia menjawab, “Sesungguhnya aku berkata kepada kalian: Aku tidak mengenal kalian.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tidak mengakui kalian.” Secara lebih harfiah, teks Yunani berbunyi “Aku tidak mengenal kalian”; dalam konteks ini, ungkapan tersebut dapat menyiratkan ketidakpengakuan relasional.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Namun, ia menjawab
  rationale: Bentuk partisip + verba finit merupakan rumus naratif yang secara harfiah berulang. Ungkapan alami bahasa Indonesia cukup memakai 'ia menjawab', sedangkan δέ diterjemahkan 'Namun' untuk menandai pertentangan dengan permohonan sebelumnya.
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumus khidmat Ἀμὴν λέγω ὑμῖν, 'Sesungguhnya' menyampaikan penegasan dengan jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini mempertahankan tindakan berbicara dan sapaan langsung. 'Kepadamu' dapat merujuk kepada kelompok, seperti lazim dalam bahasa Indonesia, sementara konteks menunjukkan bahwa yang disapa lebih dari satu orang.
- source_word: οὐκ οἶδα ὑμᾶς
  choice: Aku tidak mengenal kalian
  rationale: οἶδα pada dasarnya berarti 'mengetahui/mengenal'. Untuk orang sebagai objek, 'mengenal' lebih alami dan tetap mempertahankan kemungkinan makna relasional tanpa menguraikannya secara berlebihan. 'Kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
theological_decisions:
- issue: Daya ungkapan 'Aku tidak mengenal kalian' dalam perumpamaan
  choice: Mempertahankan ungkapan sederhana namun berbobot secara relasional, 'Aku tidak mengenal kalian'.
  alternative: Aku tidak mengakui kalian / Aku tidak mempunyai hubungan dengan kalian
  rationale: Dalam konteks, perkataan itu menyatakan penolakan dan tidak diakuinya suatu relasi, tetapi teks tidak menjabarkan implikasi doktrinalnya. Terjemahan utama tidak boleh mempersempit ketegangan tersebut menjadi penafsiran yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ucapan tokoh yang dalam konteks perumpamaan melambangkan Tuhan, tanpa menambahkan penjelasan doktrinal ke dalam ayat.
