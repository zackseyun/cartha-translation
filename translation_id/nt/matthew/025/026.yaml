base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: id
  text: Namun, tuannya menjawabnya, “Hai hamba[a] yang jahat dan malas, engkau tahu bahwa aku menuai di tempat aku tidak menabur dan mengumpulkan dari tempat aku tidak menebarkan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hai budak yang jahat dan malas.” Kata Yunani doulos dapat berarti “hamba” atau “budak”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Kalimat ini juga dapat dibaca sebagai pernyataan: “Engkau tahu bahwa aku menuai di tempat aku tidak menabur dan mengumpulkan dari tempat aku tidak menebarkan.” Kata “benih” dapat dipahami sebagai objek yang tersirat, tetapi tidak disebutkan dalam teks Yunani.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Namun, ... menjawab
  rationale: Formula naratif ini menyatakan jawaban dengan peralihan ringan yang bersifat kontras; “Namun” wajar dalam bahasa Indonesia dan sesuai dengan tanggapan tuan terhadap dalih hambanya.
- source_word: ὁ κύριος αὐτοῦ
  choice: tuannya
  rationale: Dalam latar perumpamaan ini, κύριος menunjuk pada tuan dalam hubungan sosial dengan seorang δοῦλος, bukan secara langsung pada gelar kristologis “Tuhan”.
- source_word: Πονηρὲ
  choice: jahat
  rationale: Kata ini merupakan penilaian moral, bukan sekadar menyatakan mutu yang buruk; “jahat” mempertahankan daya tegurannya.
- source_word: δοῦλε
  choice: hamba
  rationale: “Hamba” merupakan padanan Indonesia yang alami dan bermartabat dalam konteks perumpamaan, sekaligus mempertahankan hubungan ketundukan; kemungkinan arti status yang lebih tegas, “budak”, dicatat dalam catatan kaki.
- source_word: ὀκνηρέ
  choice: malas
  rationale: Kata ini menunjuk pada keengganan bertindak atau kemalasan; “malas” jelas dan modern.
- source_word: ᾔδεις
  choice: engkau tahu
  rationale: Bentuk οἶδα di sini menyatakan pengetahuan yang dianggap dimiliki hamba itu. Bentuk sekarang dalam bahasa Indonesia wajar untuk isi pengetahuan yang dikutip dan tetap dapat berfungsi dalam pertanyaan retoris.
- source_word: θερίζω
  choice: aku menuai
  rationale: “Menuai” mempertahankan metafora pertanian dan berpasangan alami dengan “menabur”.
- source_word: ὅπου οὐκ ἔσπειρα
  choice: di tempat aku tidak menabur
  rationale: Terjemahan langsung dan alami dari klausa relatif tersebut.
- source_word: συνάγω
  choice: mengumpulkan
  rationale: Padanan umum yang cocok dengan gambaran hasil panen.
- source_word: ὅθεν οὐ διεσκόρπισα
  choice: dari tempat aku tidak menebarkan
  rationale: ὅθεν secara lebih tepat berarti “dari tempat mana”, sedangkan διασκορπίζω berarti “menyebarkan/menebarkan”. Objek yang tersirat tidak ditambahkan ke teks utama agar ketakterucapan dalam bahasa Yunani tetap terpelihara.
theological_decisions:
- issue: Daya kalimat terakhir dan tanda baca
  choice: Diterjemahkan sebagai pertanyaan retoris
  alternative: 'Dibaca sebagai pernyataan: “Engkau tahu bahwa aku menuai di tempat aku tidak menabur dan mengumpulkan dari tempat aku tidak menebarkan.”'
  rationale: Teks Yunani tidak memiliki tanda baca asli yang menentukan daya kalimat ini. Pertanyaan retoris sesuai dengan alur argumentasi, yakni tuan membalikkan alasan hamba itu kepadanya, tetapi pembacaan sebagai pernyataan tetap mungkin dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. “Engkau” dan “aku” dipakai untuk menjaga gaya dialog perumpamaan yang khidmat tanpa menjadi arkais. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
