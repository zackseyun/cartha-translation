id: MAT.25.40
reference: Matthew 25:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: id
  text: 'Lalu Raja itu akan menjawab mereka, “Sesungguhnya Aku berkata kepadamu: sejauh kamu melakukannya kepada salah seorang dari saudara-saudara-Ku yang paling hina ini, kamu telah melakukannya kepada-Ku.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “saudara-saudara-Ku yang paling hina ini” dapat dipahami secara khusus sebagai murid atau utusan Yesus, secara umum sebagai orang percaya, atau secara lebih luas sebagai orang yang membutuhkan dan rentan. Teks mempertahankan ungkapan Yunani tanpa menentukan tafsirnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: akan menjawab
  rationale: Partisip aoris bersama verba futur secara alami menyatakan satu tindakan responsif dalam bahasa Indonesia; 'akan menjawab' mempertahankan makna gabungan 'menjawab lalu berkata' tanpa susunan yang kaku.
- source_word: ὁ βασιλεὺς
  choice: Raja itu
  rationale: Artikel Yunani menunjuk kembali kepada tokoh raja dalam perumpamaan. Huruf kapital menandai gelar tokoh yang dalam konteks merujuk kepada Sang Anak Manusia, tanpa mengganti sebutan eksplisit 'Raja'.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: '''Sesungguhnya'' menyampaikan daya penegasan ἀμήν secara wajar dan khidmat dalam bahasa Indonesia, sedangkan ''berkata kepadamu'' mempertahankan bentuk formula Yunani.'
- source_word: ἐφ’ ὅσον
  choice: sejauh
  rationale: '''Sejauh'' mempertahankan nuansa ukuran atau cakupan dari ungkapan Yunani dan tidak mengubahnya menjadi klausa relatif bebas seperti ''apa pun yang''.'
- source_word: ἐποιήσατε
  choice: kamu melakukannya / kamu telah melakukannya
  rationale: Akhiran '-nya' menyatakan tindakan yang tersirat dari konteks. Bentuk kedua memakai 'telah' agar hasil identifikasi tindakan itu terdengar alami, sambil mempertahankan pengulangan verba Yunani.
- source_word: ἑνὶ τούτων
  choice: kepada salah seorang ... ini
  rationale: '''Salah seorang'' mempertahankan daya individual dari ἑνί, dan ''kepada'' cocok dengan datif orang bersama ποιέω.'
- source_word: τῶν ἀδελφῶν μου
  choice: saudara-saudara-Ku
  rationale: '''Saudara-saudara'' adalah padanan Indonesia yang alami bagi bentuk jamak maskulin ἀδελφῶν. Ungkapan ini mempertahankan hubungan dengan Sang Raja tanpa menentukan secara eksplisit cakupan kelompok tersebut.'
- source_word: τῶν ἐλαχίστων
  choice: yang paling hina
  rationale: Dalam konteks perlakuan sosial terhadap orang lapar, asing, telanjang, sakit, dan dipenjarakan, 'paling hina' menyampaikan status yang dianggap rendah. Pilihan ini tetap membiarkan identitas kelompok tersebut terbuka.
- source_word: ἐμοὶ
  choice: kepada-Ku
  rationale: Padanan datif langsung ini mempertahankan identifikasi tegas antara tindakan kepada saudara-saudara Sang Raja dan tindakan kepada Raja sendiri.
theological_decisions:
- issue: Rujukan frasa 'saudara-saudara-Ku ... ini'
  choice: Mempertahankan frasa relasional tanpa menetapkan identitas kelompoknya.
  alternative: Menjelaskannya sebagai murid atau utusan Yesus, semua orang percaya, atau semua orang yang membutuhkan dan rentan.
  rationale: Ayat ini sendiri tidak menyelesaikan perdebatan mengenai rujukannya. Terjemahan tidak memasukkan salah satu tafsiran ke dalam teks.
- issue: Cakupan gender ἀδελφῶν
  choice: saudara-saudara-Ku
  alternative: saudara-saudari-Ku atau sesama-Ku
  rationale: Bentuk sumber adalah jamak maskulin. 'Saudara-saudara' mempertahankan bentuk itu secara idiomatis dalam bahasa Indonesia, sedangkan perluasan eksplisit atau penggantian dengan 'sesama' akan menambahkan keputusan mengenai cakupan kelompok.
- issue: Makna τῶν ἐλαχίστων
  choice: yang paling hina
  alternative: yang paling kecil; yang paling rendah; yang paling tidak berarti
  rationale: Pilihan ini menyatakan kerendahan status dalam konteks tanpa memastikan apakah yang dimaksud ialah kerendahan sosial, kedudukan dalam komunitas murid, atau keduanya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kata ganti yang merujuk kepada Sang Raja ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Penanda catatan ditempatkan sesudah seluruh ucapan karena catatan menjelaskan frasa di dalamnya.
