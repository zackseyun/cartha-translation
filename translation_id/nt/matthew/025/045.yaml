  naturalness: 'Teks revisi memakai susunan dialog Indonesia baku yang lebih lancar: «ia akan menjawab mereka: ...»; ini menyampaikan fungsi λέγων tanpa pengulangan pengantar ujaran yang janggal. «Untuk salah seorang ... / untukku» juga lebih alami daripada «bagi ... / bagiku» dalam konteks tindakan belas kasih.'
  terminology: «Sesungguhnya» mempertahankan daya penegasan Ἀμήν; «mereka yang paling kecil ini» mempertahankan frasa terbuka tanpa menetapkan apakah yang dimaksud hanya murid Yesus atau semua orang yang rendah dan berkekurangan. Tidak ada penambahan penafsiran teologis.
