revisions:
- from: Kemudian ia akan menjawab mereka, katanya, “Sesungguhnya aku berkata kepada kalian[a], sejauh kalian tidak melakukannya bagi salah seorang dari mereka yang paling kecil ini[b], kalian juga tidak melakukannya bagiku.”
  to: 'Kemudian ia akan menjawab mereka: “Sesungguhnya aku berkata kepada kalian[a], sejauh kalian tidak melakukannya untuk salah seorang dari mereka yang paling kecil ini[b], kalian juga tidak melakukannya untukku.”'
  rationale: Revisi terbatas pada kelancaran sintaksis dan idiom bahasa Indonesia. Tanda titik dua menggantikan «katanya» untuk mencerminkan pengantar ujaran λέγων secara alami, sedangkan «untuk» menggantikan «bagi» agar relasi tindakan terhadap «salah seorang» dan Yesus terdengar wajar. Frasa yang diperdebatkan tetap tidak ditafsirkan secara sempit atau luas dalam teks utama, dan semua jangkar catatan kaki dipertahankan.
