  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: id
  text: 'Kemudian ia akan menjawab mereka: “Sesungguhnya aku berkata kepada kalian[a], sejauh kalian tidak melakukannya untuk salah seorang dari mereka yang paling kecil ini[b], kalian juga tidak melakukannya untukku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Amin, aku berkata kepada kalian.”
    reason: lexical_alternative
  - marker: b
    text: “Mereka yang paling kecil ini” dapat dipahami secara khusus sebagai murid-murid Yesus atau secara lebih luas sebagai orang-orang yang rendah dan berkekurangan; terjemahan mempertahankan frasa sebagaimana dinyatakan dalam teks.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam adegan penghakiman dengan bentuk yang alami dan tetap formal dalam bahasa Indonesia.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: ia akan menjawab mereka, katanya
  rationale: Mempertahankan makna futurum, penerima jawaban, dan unsur pengantar ujaran tanpa membuat susunan Indonesia terasa terlalu kaku.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya aku berkata kepada kalian
  rationale: Menyampaikan formula penegasan khas Yesus secara jelas dan khidmat; 'kalian' menunjukkan bahwa ὑμῖν berbentuk jamak.
- source_word: ἐφ’ ὅσον
  choice: sejauh
  rationale: Mempertahankan nuansa ukuran atau cakupan tindakan, alih-alih meratakannya menjadi hubungan sebab dengan 'karena'.
- source_word: οὐκ ἐποιήσατε
  choice: kalian tidak melakukannya
  rationale: Objek tersirat dari konteks dinyatakan dengan '-nya' agar alami dalam bahasa Indonesia.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: bagi salah seorang dari mereka yang paling kecil ini
  rationale: Menjaga bentuk tunggal representatif ἑνί dan superlatif ἐλαχίστων tanpa menentukan secara tafsir siapa kelompok tersebut.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: kalian juga tidak melakukannya bagiku
  rationale: Menjaga pengulangan verba dan hubungan negatif yang menegaskan bahwa kelalaian terhadap mereka merupakan kelalaian terhadap Yesus.
theological_decisions:
- issue: Identitas “mereka yang paling kecil ini”
  choice: Frasa dibiarkan terbuka dan hubungan langsung mereka dengan Yesus dipertahankan.
  alternative: Menentukan frasa itu secara khusus sebagai murid atau utusan Yesus, atau secara lebih luas sebagai orang yang rendah dan berkekurangan.
  rationale: Ayat ini menegaskan identifikasi dengan Yesus, tetapi tidak dengan sendirinya menyelesaikan perdebatan mengenai cakupan kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti ilahi tidak diberi kapitalisasi khusus karena kapitalisasi tersebut bukan unsur teks Yunani. Bentuk 'kalian' dipakai untuk memperjelas kata ganti orang kedua jamak.
