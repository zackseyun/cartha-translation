id: MAT.25.41
reference: Matthew 25:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: id
  text: Kemudian Ia juga akan berkata kepada mereka yang di sebelah kiri-Nya, “Pergilah dari hadapan-Ku, hai orang-orang terkutuk, masuklah ke dalam api kekal yang telah disediakan bagi Iblis dan para malaikatnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam adegan penghakiman secara wajar dan jelas.
- source_word: ἐρεῖ
  choice: Ia ... akan berkata
  rationale: Mempertahankan bentuk futur dan tindak tutur sederhana dari λέγω.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: kepada mereka yang di sebelah kiri-Nya
  rationale: Mengungkapkan posisi kelompok itu di sebelah kiri Sang Raja sesuai konteks langsung.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Pergilah dari hadapan-Ku
  rationale: Menyampaikan perintah untuk pergi dan berpisah dari pembicara dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: οἱ κατηραμένοι
  choice: hai orang-orang terkutuk
  rationale: Mempertahankan fungsi sapaan dari partisip pasif perfek serta daya ucapannya tanpa memakai bentuk arkais.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: masuklah ke dalam api kekal
  rationale: Mempertahankan arah gerak yang dinyatakan εἰς dan menerjemahkan αἰώνιον dengan padanan lazim dalam konteks penghakiman akhir.
- source_word: τὸ ἡτοιμασμένον
  choice: yang telah disediakan
  rationale: Bentuk ini mencerminkan keadaan kini sebagai hasil persiapan sebelumnya yang tersirat dalam partisip perfek pasif.
- source_word: τῷ διαβόλῳ
  choice: bagi Iblis
  rationale: διάβολος di sini merupakan sebutan pribadi yang mapan bagi Iblis, bukan sekadar kata umum untuk pemfitnah.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: para malaikatnya
  rationale: Dalam konteks penghakiman eskatologis, ἄγγελοι menunjuk kepada makhluk surgawi yang berpihak kepada Iblis, bukan utusan manusia.
theological_decisions:
- issue: Makna αἰώνιον dalam konteks penghakiman
  choice: kekal
  alternative: berlangsung sepanjang zaman
  rationale: “Kekal” adalah padanan Indonesia yang paling wajar bagi αἰώνιον dalam konteks ini dan mempertahankan bobot pernyataan tanpa menambahkan penjelasan sistem teologis tertentu.
- issue: Rujukan διάβολος dan ἄγγελοι
  choice: Iblis dan para malaikatnya
  alternative: pemfitnah dan para utusannya
  rationale: Konteks penghakiman dan pemakaian yang sudah mapan menunjukkan Iblis beserta makhluk-makhluk malaikat yang mengikutinya; padanan generik akan mengaburkan rujukan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “hai” dipertahankan untuk memperjelas fungsi vokatif οἱ κατηραμένοι. Frasa “masuklah ke dalam” membuat arah εἰς eksplisit dalam bahasa Indonesia, sementara “dari hadapan-Ku” mengungkapkan pemisahan dari pribadi pembicara secara alami.
