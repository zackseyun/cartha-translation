  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: id
  text: Orang yang telah menerima lima talenta[b] itu pun maju dan membawa lima talenta lagi. Ia berkata, ‘Tuan[a], lima talenta telah Tuan serahkan kepada saya. Lihat, saya telah memperoleh lima talenta lagi.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Tuhan”. Yunani: kyrios.'
    reason: alternative_reading
  - marker: b
    text: Talenta adalah satuan bobot dan nilai uang yang sangat besar pada zaman itu.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: maju
  rationale: Partisip aoris ini menggambarkan orang itu mendekat untuk menghadap dan menyampaikan hasilnya; “maju” alami dalam adegan semacam ini.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: orang yang telah menerima lima talenta itu
  rationale: Konstruksi partisip berartikel mengidentifikasi orang tersebut berdasarkan penerimaan sebelumnya; “telah menerima” menandai tindakan yang mendahului tindakan utama tanpa menambahkan kata “laki-laki” yang tidak dinyatakan dalam bahasa Yunani.
- source_word: τάλαντα
  choice: talenta
  rationale: “Talenta” mempertahankan nama satuan uang/bobot kuno itu dan tidak mempersempitnya menjadi jenis logam atau bentuk uang tertentu; maknanya dijelaskan dalam catatan kaki.
- source_word: προσήνεγκεν
  choice: membawa
  rationale: Dalam konteks ini προσφέρω berarti membawa tambahan uang itu ke hadapan tuannya; “membawa” jelas dan tidak menimbulkan nuansa persembahan ritual.
- source_word: ἄλλα πέντε τάλαντα
  choice: lima talenta lagi
  rationale: Ungkapan ini secara alami menyatakan tambahan sejumlah lima talenta dan mempertahankan pengulangan dalam teks sumber.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam dunia cerita, κύριε adalah sapaan seorang hamba kepada pemilik atau majikannya. “Tuan” merupakan sapaan Indonesia yang alami dan tetap membiarkan kemungkinan resonansi naratif yang lebih luas dijelaskan melalui catatan.
- source_word: παρέδωκας
  choice: telah menyerahkan
  rationale: “Menyerahkan ... kepada” dekat dengan arti dasar παραδίδωμι, yaitu menyerahkan atau memberikan ke dalam penguasaan pihak lain, tanpa secara eksplisit menambahkan gagasan “memercayakan”.
- source_word: ἴδε
  choice: Lihat
  rationale: Kata seru ini menarik perhatian lawan bicara kepada hasil yang kini ditunjukkan; “Lihat” alami dalam bahasa Indonesia modern.
- source_word: ἐκέρδησα
  choice: saya telah memperoleh
  rationale: κερδαίνω menyatakan mendapat keuntungan atau pertambahan. “Telah memperoleh” menyampaikan tindakan yang selesai dengan hasil yang kini ada, tanpa menyiratkan upah.
theological_decisions:
- issue: Terjemahan κύριος sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Acuan langsungnya ialah majikan dalam perumpamaan, sehingga “Tuan” paling alami dan tidak secara prematur mengidentikkan tokoh itu secara eksplisit dengan Allah atau Kristus. Catatan kaki mempertahankan informasi bahwa kata Yunani yang sama juga dapat diterjemahkan “Tuhan”.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “Tuan” dipilih sesuai konteks majikan-hamba, sedangkan “saya” menjaga kesopanan dalam ujaran langsung. Penanda [a] ditempatkan sesudah sapaan yang dijelaskan, dan [b] sesudah ayat sebagai catatan budaya mengenai talenta.
