  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: id
  text: Dan mereka ini akan pergi menuju hukuman kekal[a], tetapi orang-orang benar menuju hidup kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hukuman sepanjang zaman” ... “hidup sepanjang zaman.” Arti kata sifat Yunani αἰώνιος diperdebatkan dalam beberapa konteks. Di sini kata yang sama menerangkan baik “hukuman” maupun “hidup”, sehingga terjemahan mempertahankan kesejajarannya dengan memakai “kekal” dalam kedua klausa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: akan pergi
  rationale: Bentuk futur dari ἀπέρχομαι menyatakan kepergian. 'Akan pergi' alami dalam bahasa Indonesia dan mempertahankan gambaran gerak tanpa menambahkan tafsiran.
- source_word: οὗτοι
  choice: mereka ini
  rationale: Kata tunjuk ini merujuk kembali kepada kelompok yang baru disebut dan menjaga kontras dengan 'orang-orang benar'.
- source_word: κόλασιν
  choice: hukuman
  rationale: Dalam konteks penghakiman ini, κόλασις paling wajar menunjuk pada hukuman atau konsekuensi penghukuman, bukan sekadar didikan korektif.
- source_word: αἰώνιον
  choice: kekal
  rationale: Kata sifat yang sama menerangkan 'hukuman' dan 'hidup'. 'Kekal' merupakan padanan Indonesia yang baku dan mempertahankan kesejajaran kedua klausa.
- source_word: δίκαιοι
  choice: orang-orang benar
  rationale: Kata sifat yang dipakai sebagai nomina ini menunjuk kepada mereka yang benar. Ungkapan ini alami dan mempertahankan makna moral serta relasionalnya.
- source_word: ζωὴν
  choice: hidup
  rationale: Padanan langsung dan lazim bagi ζωή dalam ungkapan 'hidup kekal'.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai pertentangan antara kedua kelompok dan tujuan akhir mereka.
theological_decisions:
- issue: Makna αἰώνιον dalam pasangan κόλασιν αἰώνιον dan ζωὴν αἰώνιον
  choice: Menerjemahkan αἰώνιον sebagai 'kekal' dalam kedua klausa
  alternative: '''sepanjang zaman'' atau ''selama suatu zaman'' dalam kedua klausa'
  rationale: Karena kata Yunani yang sama menerangkan baik 'hukuman' maupun 'hidup', terjemahan mempertahankan kesejajaran itu dan tidak membedakan durasi atau sifat keduanya secara diam-diam. Alternatif leksikal dicatat dalam catatan kaki karena cakupan αἰώνιος diperdebatkan dalam sejumlah konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel sumber dipertahankan. 'Mereka ini' dipilih agar rujukan demonstratif οὗτοι tetap terasa, sedangkan elipsis verba pada klausa kedua dipertahankan secara alami.
