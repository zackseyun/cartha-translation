  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: id
  text: Demikian juga[a], orang yang menerima dua talenta itu memperoleh dua talenta lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan cara yang sama, orang yang menerima dua talenta itu memperoleh dua talenta lagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Demikian juga
  rationale: Ungkapan ini secara alami menghubungkan tindakan hamba tersebut dengan tindakan hamba sebelumnya dalam ayat 16 serta mempertahankan daya bandingnya.
- source_word: ὁ τὰ δύο
  choice: orang yang memegang dua talenta itu
  rationale: Konstruksi eliptis ini menunjuk kepada hamba yang dikenali dari dua talenta dalam konteks. Kata 'memegang' mempertahankan keringkasan tanpa menyatakan secara eksplisit sesuatu yang hanya tersirat, yaitu bahwa ia telah menerimanya.
- source_word: ἐκέρδησεν
  choice: memperoleh
  rationale: Dalam konteks keuangan, kata ini menyatakan hasil tambahan dari kegiatan yang berhasil. 'Memperoleh' wajar dalam bahasa Indonesia dan tidak menyiratkan upah sekuat 'menghasilkan' atau 'mendapat upah'.
- source_word: ἄλλα δύο
  choice: dua talenta lagi
  rationale: Frasa ini berarti tambahan dua benda sejenis. Penyebutan 'talenta' dijelaskan dari konteks agar kalimat Indonesia tetap jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. 'Talenta' dipertahankan sebagai satuan uang dalam konteks perumpamaan, bukan dalam arti modern 'bakat'.
