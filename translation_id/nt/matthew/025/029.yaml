id: MAT.25.29
reference: Matthew 25:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: id
  text: Sebab setiap orang yang mempunyai akan diberi, dan ia akan berlimpah[a]. Namun, dari orang yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "ia akan berkelimpahan."
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Sebab, setiap orang yang mempunyai
  rationale: γάρ menjelaskan pernyataan sebelumnya, sehingga diterjemahkan “Sebab”; konstruksi partisip datif substantival dengan παντί bersifat distributif dan wajar diterjemahkan “setiap orang yang mempunyai”.
- source_word: δοθήσεται
  choice: akan diberi lagi
  rationale: Bentuk pasif futur dipertahankan. “Lagi” menyatakan tambahan yang tersirat oleh konteks pemberian kepada orang yang sudah mempunyai, tanpa menyebutkan pelaku.
- source_word: καὶ περισσευθήσεται
  choice: sehingga ia berkelimpahan
  rationale: καί di sini menyambungkan pemberian dengan keadaan berlimpah yang dihasilkannya. “Berkelimpahan” mempertahankan daya ungkap περισσεύω dan terdengar alami dalam bahasa Indonesia.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: Namun, dari orang yang tidak mempunyai
  rationale: δέ menandai kontras, sedangkan bentuk genitif substantival diterjemahkan dengan frasa “dari orang”. Bentuk tunggal representatif dipertahankan.
- source_word: καὶ ὃ ἔχει
  choice: bahkan apa yang dipunyainya
  rationale: καί bersifat asensif, yakni “bahkan”, dan menonjolkan paradoks bahwa orang yang disebut tidak mempunyai tetap memiliki sesuatu yang kemudian diambil.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: akan diambil darinya
  rationale: Bentuk pasif futur dan gagasan pemisahan dari ἀπό dipertahankan secara ringkas dan alami.
theological_decisions:
- issue: Acuan maskulin generik dalam konstruksi partisip tunggal
  choice: Memakai “setiap orang/orang” dengan pronomina tunggal “ia/-nya”
  alternative: Mengubahnya menjadi bentuk jamak “orang-orang ... mereka” atau mengulang nomina untuk menghindari pronomina
  rationale: Bahasa Yunani memakai partisip maskulin tunggal dengan fungsi generik. Bahasa Indonesia tidak menandai gender pada “orang” dan “ia”, sehingga bentuk tunggal representatif dapat dipertahankan tanpa memasukkan pembatasan gender.
- issue: Ketegangan antara “tidak mempunyai” dan “apa yang dipunyainya”
  choice: Mempertahankan kedua ungkapan secara harfiah dan tidak menjelaskan objeknya
  alternative: Menambahkan objek seperti “tidak mempunyai hasil” atau “apa yang dianggapnya milik”
  rationale: Teks sengaja menyandingkan ketiadaan dengan kepunyaan dalam ungkapan yang paradoksal. Menambahkan objek atau tafsiran akan menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mempunyai” dipilih untuk kesejajaran antarklausa; “berkelimpahan” menyampaikan hasil yang berlimpah tanpa mempersempitnya menjadi kekayaan materi. Tidak diperlukan catatan kaki karena alternatif leksikal dapat ditampung dengan jelas dalam teks utama.
