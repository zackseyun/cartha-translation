revisions:
- from: Sebab, setiap orang yang mempunyai akan diberi lagi sehingga ia berkelimpahan. Namun, dari orang yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil darinya.
  to: Sebab setiap orang yang mempunyai akan diberi, dan ia akan berlimpah[a]. Namun, dari orang yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil darinya.
  rationale: Revisi memulihkan koordinasi καί dengan "dan," menghapus tambahan "lagi," dan memakai "akan berlimpah" sebagai padanan Indonesia yang alami untuk περισσευθήσεται. Catatan kaki mempertahankan alternatif "berkelimpahan" tanpa mengubah makna. Struktur kontras, bentuk pasif, dan ambiguitas mengenai apa yang "dipunyai" tetap terjaga.
