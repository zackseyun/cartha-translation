  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: id
  text: Orang yang telah menerima lima talenta[a] itu pergi dan mengusahakannya, lalu memperoleh lima talenta lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talenta adalah satuan uang bernilai sangat besar, bukan bakat atau kemampuan alami.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama. Terjemahan finite 'pergi' alami dalam bahasa Indonesia dan tidak menambahkan gagasan 'segera' yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Orang yang telah menerima lima talenta itu
  rationale: Konstruksi partisip berartikel mengenali hamba tersebut berdasarkan apa yang telah diterimanya. 'Telah menerima' menjaga hubungan waktu, sedangkan 'orang ... itu' terdengar alami tanpa menambah sebutan yang tidak ada dalam frasa ini.
- source_word: τάλαντα
  choice: talenta
  rationale: Istilah tradisional ini mempertahankan satuan uang dalam sumber. Catatan kaki diperlukan karena dalam pemakaian Indonesia modern 'talenta' lazim berarti bakat.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: mengusahakannya
  rationale: Ungkapan ini menggambarkan penggunaan aktif atas uang tersebut untuk menghasilkan keuntungan. 'Mengusahakannya' lebih alami daripada terjemahan harfiah 'bekerja dengan semuanya' dan tidak mempersempit kegiatannya secara khusus menjadi perdagangan.
- source_word: ἐκέρδησεν
  choice: memperoleh
  rationale: Dalam konteks ini verba tersebut berarti mendapatkan hasil atau keuntungan. 'Memperoleh' jelas dan bermartabat, dengan hasilnya dinyatakan oleh 'lima talenta lagi'.
- source_word: ἄλλα πέντε
  choice: lima talenta lagi
  rationale: Pengulangan 'talenta' menjernihkan acuan yang tersirat dalam bahasa Yunani, sedangkan 'lagi' menyampaikan makna tambahan dari ἄλλα.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan tindakan dipertahankan tanpa menambahkan 'segera'. Istilah 'talenta' dipertahankan demi kesinambungan dengan perumpamaan dan dijelaskan melalui catatan kaki.
