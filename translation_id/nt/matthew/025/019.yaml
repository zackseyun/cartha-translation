  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: id
  text: Setelah waktu yang lama, tuan budak-budak itu[a] datang dan mengadakan perhitungan dengan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “tuan” juga dapat berarti “Tuhan”, dan kata yang diterjemahkan “budak-budak” juga dapat diterjemahkan “hamba-hamba”. Di sini teks utama memakai istilah yang paling jelas untuk hubungan dalam rumah tangga dan kegiatan ekonomi yang digambarkan oleh perumpamaan ini.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Setelah waktu yang lama
  rationale: μετά dengan bentuk akusatif menyatakan urutan waktu, yaitu “setelah”. δέ hanya merupakan penghubung ringan; alur narasi bahasa Indonesia sudah jelas tanpa menambahkan “lalu” atau “adapun”.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini historis Yunani memberi daya hidup pada narasi. Kata “datang” dalam bahasa Indonesia tidak menandai kala secara morfologis dan secara alami mempertahankan gerak narasi itu.
- source_word: ὁ κύριος
  choice: tuan
  rationale: Dalam konteks perumpamaan ini, κύριος menunjuk kepada orang yang berkuasa atas para δοῦλοι miliknya. “Tuan” menyampaikan hubungan sosial tersebut tanpa secara otomatis menjadikannya gelar kristologis “Tuhan”.
- source_word: τῶν δούλων ἐκείνων
  choice: dari hamba-hamba itu
  rationale: δοῦλος dapat menunjuk kepada hamba atau budak. “Hamba-hamba” merupakan ungkapan Indonesia yang wajar dalam hubungan dengan seorang tuan dan tetap dapat mencakup status terikat, sedangkan “budak-budak” dalam pemakaian modern dapat membawa nuansa tambahan yang terlalu menonjol.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: menyelesaikan perhitungan dengan mereka
  rationale: Ungkapan ini berarti mengadakan atau menyelesaikan perhitungan dengan seseorang. Pilihan ini mempertahankan gambaran pembukuan dan pertanggungjawaban dalam perumpamaan tanpa membatasinya hanya pada audit dokumen.
theological_decisions:
- issue: Pemaknaan κύριος dalam perumpamaan
  choice: tuan
  alternative: Tuhan
  rationale: Referen langsung dalam kalimat adalah pemilik atau penguasa rumah tangga dalam cerita. Terjemahan “tuan” menjaga peran naratif itu dan tidak memaksakan gelar ilahi ke dalam ungkapan Yunani yang secara leksikal tetap dapat berarti keduanya.
- issue: Pemaknaan δοῦλος
  choice: hamba-hamba
  alternative: budak-budak
  rationale: Hubungan ketundukan dan kepemilikan tetap tampak melalui pasangan “tuan” dan “hamba”. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih tegas mengenai status sosial mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat langsung dan mudah dipahami, sementara istilah “menyelesaikan perhitungan” mempertahankan metafora ekonomi sumber Yunani.
