  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: id
  text: Dan campakkanlah hamba[a] yang tidak berguna itu ke dalam kegelapan di luar. Di sanalah akan ada tangisan dan kertakan gigi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak”. Kata Yunani doulos dapat berarti “hamba” atau “budak”; dalam latar perumpamaan ini, kata tersebut menunjukkan seseorang yang berada di bawah kuasa seorang tuan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: tidak berguna
  rationale: Ungkapan ini secara alami menyatakan bahwa hamba tersebut dinilai tidak memberi manfaat bagi tuannya, sambil mempertahankan kerasnya penilaian tanpa menambahkan gagasan bahwa dirinya sama sekali tidak bernilai sebagai manusia.
- source_word: δοῦλον
  choice: hamba
  rationale: Dalam konteks perumpamaan tentang tuan dan orang yang terikat kepadanya, “hamba” merupakan padanan Indonesia yang wajar dan bermartabat. Catatan kaki mempertahankan kemungkinan arti sosial yang lebih tegas, yaitu “budak”.
- source_word: ἐκβάλετε
  choice: campakkanlah
  rationale: Bentuk perintah ini keras dan menggambarkan pengusiran secara paksa. “Campakkanlah” mempertahankan daya ungkap tersebut dalam bahasa Indonesia yang alami dan khidmat.
- source_word: σκότος τὸ ἐξώτερον
  choice: kegelapan di luar
  rationale: Frasa ini secara langsung menyatakan kegelapan yang berada di luar, sehingga menonjolkan pengucilan dari tempat sang tuan tanpa menambahkan penafsiran tentang hakikat hukuman itu.
- source_word: ἐκεῖ
  choice: Di sanalah
  rationale: Partikel “-lah” mempertahankan penekanan pada tempat yang baru saja disebutkan.
- source_word: κλαυθμὸς
  choice: tangisan
  rationale: “Tangisan” menyampaikan dukacita atau penderitaan dengan jelas tanpa menentukan intensitas atau penyebabnya secara lebih khusus daripada teks.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kertak gigi
  rationale: “Kertak gigi” adalah ungkapan Indonesia yang ringkas dan lazim untuk tindakan menggertakkan gigi serta tetap membuka nuansa penderitaan dan/atau kemarahan.
theological_decisions:
- issue: Hakikat gambaran penghakiman dalam perumpamaan
  choice: Mempertahankan gambaran pengucilan ke dalam kegelapan serta tangisan dan kertak gigi tanpa menjelaskan lebih jauh jenis hukumannya.
  alternative: Menyebutnya secara eksplisit sebagai neraka, penghakiman terakhir, atau sekadar hukuman sementara/metaforis.
  rationale: Bahasa Yunani memakai gambaran penghakiman khas Matius, tetapi ayat ini sendiri tidak memberikan uraian doktrinal lebih lanjut. Terjemahan mempertahankan ketegangan dan cakupan gambaran asli.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Campakkanlah” mempertahankan kerasnya perintah; “kegelapan di luar” lebih transparan bagi pembaca umum daripada ungkapan yang terlalu membeku. Penanda catatan kaki ditempatkan langsung sesudah kata yang diterangkannya.
