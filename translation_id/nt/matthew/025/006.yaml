  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: id
  text: Namun, pada tengah malam terdengarlah seruan, “Lihat, pengantin laki-laki itu! Keluarlah untuk menyambut dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Namun, pada tengah malam
  rationale: Frasa genitif ini merupakan ungkapan waktu yang berarti ‘pada tengah malam’. δέ diterjemahkan ‘Namun’ untuk menandai peralihan naratif dengan nuansa kontras ringan.
- source_word: κραυγὴ γέγονεν
  choice: terdengarlah seruan
  rationale: Ungkapan ini menyatakan terjadinya seruan secara mendadak. ‘Terdengarlah seruan’ alami dalam bahasa Indonesia dan sesuai dengan konteks orang-orang yang mendengar pengumuman tersebut.
- source_word: Ἰδού
  choice: Lihat
  rationale: Kata ini berfungsi menarik perhatian. ‘Lihat’ mempertahankan daya serunya dalam bahasa Indonesia modern tanpa memakai ungkapan arkais.
- source_word: ὁ νυμφίος
  choice: pengantin laki-laki itu
  rationale: νυμφίος secara khusus menunjuk kepada pengantin laki-laki dalam konteks pernikahan; ‘itu’ menandai sosok tertentu yang sedang dinantikan.
- source_word: ἐξέρχεσθε
  choice: Keluarlah
  rationale: Imperatif jamak ini memerintahkan para pendengar untuk keluar. Bentuk ‘-lah’ memberi daya ajakan/perintah yang wajar dan bermartabat.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: untuk menyambut dia
  rationale: Ungkapan ini berarti pergi menemui seseorang yang datang. Dalam konteks arak-arakan pernikahan, ‘menyambut dia’ lebih alami dan lebih tepat daripada sekadar ‘bertemu dengannya’.
theological_decisions:
- issue: Rujukan simbolis νυμφίος dalam perumpamaan
  choice: pengantin laki-laki itu
  alternative: Pengantin Laki-laki itu
  rationale: Huruf kecil mempertahankan tingkat cerita perumpamaan. Walaupun dalam konteks yang lebih luas tokoh ini dipahami melambangkan Yesus, terjemahan tidak membuat identifikasi teologis itu eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kalimat langsung dibuat hidup tanpa kosakata arkais; tanda seru mempertahankan sifat mendesak dari seruan tengah malam.
