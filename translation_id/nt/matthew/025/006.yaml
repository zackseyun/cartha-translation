  source_fidelity: Terjemahan dengan tepat mencerminkan μέσης δὲ νυκτός sebagai penanda waktu dan transisi naratif, κραυγὴ γέγονεν sebagai seruan yang terdengar, ἰδού sebagai panggilan perhatian, serta dua imperatif/plural yang tersirat dalam panggilan untuk keluar menyambut pengantin laki-laki. “Menyambut dia” merupakan padanan yang wajar bagi εἰς ἀπάντησιν αὐτοῦ dalam konteks arak-arakan pernikahan.
