  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: id
  text: Sebab Aku lapar dan kamu tidak memberi Aku makan; Aku haus dan kamu tidak memberi Aku minum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: ketika Aku lapar
  rationale: Bentuk aoristus menyatakan keadaan lapar pada masa yang dibicarakan. Dalam bahasa Indonesia, klausa waktu dengan 'ketika' mengungkapkan hubungan keadaan dan tindakan secara alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel γάρ menjelaskan alasan bagi putusan dalam konteks sebelumnya; 'Sebab' mempertahankan fungsi penjelas tersebut.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: kamu tidak memberi Aku makan
  rationale: Ungkapan ini secara harfiah berarti 'kamu tidak memberi kepada-Ku untuk makan'. 'Tidak memberi Aku makan' merupakan padanan Indonesia yang alami, tetap verbal, dan mempertahankan fokus pribadi pada Aku.
- source_word: ἐδίψησα
  choice: ketika Aku haus
  rationale: Bentuk ini sejajar dengan ἐπείνασα. 'Ketika Aku haus' mempertahankan kesejajaran dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐποτίσατέ με
  choice: kamu tidak memberi Aku minum
  rationale: ποτίζω di sini berarti memberi minum. Pilihan ini alami, mempertahankan objek pribadi, dan sejajar dengan 'memberi Aku makan'.
theological_decisions:
- issue: Tingkat keharfiahan pada dua klausa tentang tidak diberi makan dan minum
  choice: kamu tidak memberi Aku makan/minum
  alternative: kamu tidak memberi kepada-Ku untuk makan/minum
  rationale: Pilihan utama menyampaikan kelalaian pribadi yang menjadi dasar penghakiman tanpa memasukkan penafsiran tambahan. Susunannya alami dalam bahasa Indonesia dan tetap dekat dengan bentuk verbal Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Pengulangan 'ketika' memperjelas kesejajaran kedua klausa.
