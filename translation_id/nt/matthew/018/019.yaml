id: MAT.18.19
reference: Matthew 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: id
  text: 'Sekali lagi, sesungguhnya Aku berkata kepadamu: Jika dua orang di antara kamu di bumi sepakat mengenai perkara apa pun yang mereka minta,[a] hal itu akan dilakukan bagi mereka oleh Bapa-Ku yang di surga.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteksnya, perkataan ini mengikuti ajaran Yesus tentang wewenang dan disiplin komunitas (18:15–18), meskipun kata-kata dalam ayat ini sendiri berbicara secara luas tentang permintaan yang disepakati.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, bahasa Yunani memakai bentuk jamak, “di surga-surga”; di sini diterjemahkan secara idiomatis sebagai “di surga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Sekali lagi
  rationale: Menandai perkataan tambahan atau pembaruan yang tetap terhubung dengan ajaran sebelumnya.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: sesungguhnya Aku berkata kepadamu
  rationale: Ungkapan Indonesia yang wajar dan khidmat untuk formula penegasan Yesus, dengan tetap mempertahankan tekanannya.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: jika dua orang di antara kamu ... sepakat
  rationale: Menyampaikan συμφωνέω sebagai kesepakatan dan mempertahankan arti ἐξ ὑμῶν, yaitu bahwa keduanya berasal dari antara para murid.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Padanan Indonesia yang alami serta mempertahankan kontras dengan Bapa di surga.
- source_word: περὶ παντὸς πράγματος
  choice: mengenai perkara apa pun
  rationale: πρᾶγμα memiliki cakupan luas, yakni perkara, hal, atau urusan; pilihan ini wajar dan tidak mempersempit makna.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: yang mereka minta
  rationale: Menyampaikan konstruksi relatif tak tentu secara alami tanpa menambahkan objek atau pembatas yang tidak dinyatakan.
- source_word: γενήσεται αὐτοῖς
  choice: hal itu akan dilakukan bagi mereka
  rationale: Dengan frasa berikutnya yang menunjuk kepada Bapa sebagai pelaku atau sumber, bentuk ini alami dan mempertahankan nuansa hasil yang terjadi bagi mereka.
- source_word: παρὰ τοῦ πατρός μου
  choice: oleh Bapa-Ku
  rationale: Dalam hubungan dengan γενήσεται, παρά dengan genitif dapat menyatakan sumber atau pelaku; 'oleh' cocok dengan 'akan dilakukan' sambil memperjelas tindakan Bapa.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: yang di surga
  rationale: Bentuk jamak Yunani οὐρανοῖς lazim dinyatakan secara idiomatis dengan bentuk tunggal 'surga' dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan janji dalam konteks
  choice: Menerjemahkan pernyataan secara lugas tanpa menambahkan pembatas tentang doa, disiplin jemaat, atau kehendak Allah.
  alternative: Membatasi janji secara eksplisit pada keputusan disiplin jemaat, atau memperluasnya menjadi jaminan tanpa syarat bagi setiap permintaan doa.
  rationale: Konteks langsung membahas penanganan dosa dan wewenang komunitas, sedangkan αἰτέω menunjuk pada meminta, kemungkinan dalam kesepakatan doa. Namun, ayat ini sendiri tidak menyatakan pembatas atau perluasan doktrinal tersebut, sehingga terjemahan mempertahankan keluasan dan ketegangan kontekstualnya.
- issue: Nuansa παρά sebagai sumber atau pelaku
  choice: oleh Bapa-Ku
  alternative: dari Bapa-Ku
  rationale: Keduanya dimungkinkan secara gramatikal. Pilihan 'oleh' selaras dengan ungkapan 'akan dilakukan', tanpa menyangkal bahwa Bapa juga merupakan sumber terlaksananya permintaan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan hubungan bumi–surga dan keluasan 'perkara apa pun' tanpa menambahkan penafsiran denominasi.
