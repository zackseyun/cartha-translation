  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: id
  text: Karena itu[a], ketika hamba-hamba lain yang juga menjadi hamba tuan itu[b] melihat apa yang telah terjadi, mereka merasa sangat sedih. Mereka lalu datang dan melaporkan kepada tuan mereka[c] segala sesuatu yang telah terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Maka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sesama budaknya,” yaitu orang-orang yang sama-sama berada di bawah tuan yang sama.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “majikan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan fungsi penghubung yang menunjukkan akibat atau kelanjutan logis dari tindakan dalam ayat sebelumnya; dalam alur narasi juga dapat dipahami sebagai “Maka”.
- source_word: σύνδουλοι
  choice: sesama hambanya
  rationale: Menunjukkan orang-orang yang sama-sama berstatus hamba di bawah tuan yang sama. “Hamba” alami dalam perumpamaan berbahasa Indonesia, sedangkan unsur “sesama” mempertahankan makna awalan συν-.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: apa yang telah terjadi / segala sesuatu yang telah terjadi
  rationale: Menerjemahkan partisip substantival γίνομαι secara idiomatis, sambil mempertahankan penegasan πάντα pada kemunculan kedua.
- source_word: ἐλυπήθησαν σφόδρα
  choice: mereka merasa sangat sedih
  rationale: Menyampaikan kesedihan atau dukacita yang kuat dari λυπέω dan mempertahankan intensitas σφόδρα tanpa ungkapan yang kaku.
- source_word: ἐλθόντες
  choice: Mereka lalu datang
  rationale: Partisip aoris ini menyatakan tindakan pendahulu yang mengiringi verba utama. Bentuk klausa dengan “lalu” menghasilkan urutan naratif yang wajar.
- source_word: διεσάφησαν
  choice: melaporkan
  rationale: Dalam konteks para hamba yang memberi tahu tuan mereka, “melaporkan” menyampaikan tindakan menerangkan atau memberitahukan secara jelas; kelengkapannya ditegaskan oleh “segala sesuatu”.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: kepada tuan mereka
  rationale: κύριος di sini menunjuk kepada atasan manusia dalam perumpamaan. “Tuan” mempertahankan hubungan kewenangan dan cocok dengan sebutan “hamba”.
theological_decisions:
- issue: Penerjemahan istilah keluarga δοῦλος dalam latar sosial perumpamaan
  choice: sesama hambanya
  alternative: sesama budaknya
  rationale: σύνδουλοι menyatakan status bersama di bawah satu tuan. “Hamba” mempertahankan hubungan ketundukan dalam ragam Alkitab Indonesia yang bermartabat, sementara catatan kaki menjaga kemungkinan terjemahan yang lebih harfiah dan keras, “budak”, tanpa melunakkan bukti sumber secara diam-diam.
- issue: Penerjemahan κύριος bagi atasan manusia
  choice: tuan mereka
  alternative: majikan mereka
  rationale: Tokoh ini adalah seorang penguasa manusia dalam perumpamaan, bukan penyebutan langsung kepada Allah. “Tuan” selaras dengan pasangan leksikal “hamba”, sedangkan “majikan” tetap dicatat sebagai padanan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dibaca, tanpa menghilangkan urutan tindakan atau pengulangan yang disengaja dalam teks Yunani.
