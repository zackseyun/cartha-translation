id: MAT.18.8
reference: Matthew 18:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: id
  text: Jika tanganmu atau kakimu membuatmu tersandung[a], potonglah itu dan buanglah dari dirimu. Lebih baik bagimu masuk ke dalam hidup dengan anggota tubuh yang tidak lengkap atau dengan kaki pincang daripada memiliki dua tangan atau dua kaki tetapi dilemparkan ke dalam api kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuatmu berbuat dosa.” Kata kerja Yunani ini secara harfiah menggambarkan tindakan membuat seseorang tersandung.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: membuatmu tersandung
  rationale: Mempertahankan metafora Yunani tentang tersandung, sementara catatan kaki menjelaskan makna moralnya dalam konteks.
- source_word: ἔκκοψον
  choice: potonglah itu
  rationale: Menyampaikan perintah aoris yang tegas dan konkret; pronomina tunggal mencakup tangan ataupun kaki.
- source_word: βάλε ἀπὸ σοῦ
  choice: buanglah jauh darimu
  rationale: Mengungkapkan tindakan membuang sekaligus pemisahan yang kuat dari diri sendiri dalam bahasa Indonesia alami.
- source_word: καλόν σοί ἐστιν
  choice: Lebih baik bagimu
  rationale: Konteks perbandingan dengan ἤ menuntut pengertian komparatif, bukan sekadar 'baik'.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: masuk ke dalam hidup
  rationale: Mempertahankan kata 'hidup' tanpa menambahkan 'kekal'; konteks pertentangannya memberi nuansa eskatologis.
- source_word: κυλλὸν
  choice: dengan anggota tubuh yang tidak lengkap
  rationale: Mengacu pada keadaan kehilangan atau kerusakan anggota tubuh akibat pemotongan; ungkapan ini jelas dan tidak memakai istilah Indonesia yang merendahkan.
- source_word: χωλόν
  choice: dengan kaki timpang
  rationale: Menyampaikan keadaan yang secara khusus berkaitan dengan gangguan pada kaki dan selaras dengan konteks kaki yang dipotong.
- source_word: ἔχοντα
  choice: memiliki
  rationale: Mewakili partisip Yunani secara eksplisit dan mempertahankan kontras antara kondisi tubuh pada kedua kemungkinan.
- source_word: βληθῆναι
  choice: dilemparkan
  rationale: Padanan pasif yang langsung, kuat, dan lazim dalam bahasa Indonesia modern.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: api kekal
  rationale: Padanan alami bagi ungkapan Yunani dalam konteks penghakiman, tanpa memperluas atau mempersempit acuannya.
theological_decisions:
- issue: Apakah σκανδαλίζει dimoralisasi menjadi 'membuatmu berbuat dosa' atau metafora tersandung dipertahankan
  choice: membuatmu tersandung
  alternative: membuatmu berbuat dosa
  rationale: Teks Yunani mempertahankan gambaran tersandung. Makna moral diterangkan dalam catatan kaki tanpa meratakan metafora dalam teks utama.
- issue: Makna 'hidup' dalam εἰς τὴν ζωὴν
  choice: mempertahankan 'hidup'
  alternative: hidup kekal
  rationale: Konteksnya bersifat eskatologis, tetapi teks hanya menyebut 'hidup'. Kontras dengan 'api kekal' dibiarkan membawa bobot teologisnya.
- issue: Sifat perintah memotong anggota tubuh
  choice: menerjemahkan perintah secara konkret tanpa menjelaskan apakah itu hiperbola
  alternative: memparafrasakannya sebagai seruan kiasan untuk pertobatan radikal
  rationale: Bahasa sumber sengaja keras. Terjemahan mempertahankan ketegangan tersebut dan tidak menyisipkan penyelesaian tafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk terikat '-mu' dan '-lah' menjaga sapaan tunggal serta daya perintah. Ungkapan tentang kondisi tubuh dipilih agar spesifik pada konteks tanpa memakai istilah yang kini dapat terdengar merendahkan.
