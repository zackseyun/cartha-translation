id: MAT.18.9
reference: Matthew 18:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: id
  text: Dan jika matamu menyebabkan engkau tersandung[a], cungkillah itu dan buanglah jauh-jauh darimu. Lebih baik bagimu masuk ke dalam kehidupan dengan satu mata daripada, dengan dua mata, dilemparkan ke dalam Gehena api.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyebabkan engkau berbuat dosa.” Kata kerja Yunani ini dapat berarti menyebabkan seseorang tersandung, jatuh, atau berbuat dosa.
    reason: lexical_alternative
  - marker: b
    text: “Gehena” menunjuk pada tempat penghakiman terakhir; secara tradisional diterjemahkan “neraka.”
    reason: term_explanation
lexical_decisions:
- source_word: σκανδαλίζει
  choice: menyebabkan engkau tersandung
  rationale: Mempertahankan metafora tersandung dalam verba Yunani, sambil memberi catatan bahwa dalam konteks ini ungkapan tersebut dapat berarti menyebabkan jatuh ke dalam dosa.
- source_word: ἔξελε
  choice: cungkillah
  rationale: Imperatif aoris ini keras dan mendesak. 'Cungkillah' merupakan ungkapan Indonesia yang alami untuk tindakan mencabut mata secara paksa dan mempertahankan tajamnya gambaran.
- source_word: βάλε ἀπὸ σοῦ
  choice: buanglah jauh-jauh darimu
  rationale: Menyatakan penyingkiran yang tegas dan menyeluruh dengan bahasa Indonesia modern yang alami.
- source_word: καλόν σοί ἐστιν
  choice: lebih baik engkau
  rationale: Dalam konstruksi perbandingan dengan ἤ, καλόν menyatakan keadaan yang lebih baik atau lebih menguntungkan.
- source_word: μονόφθαλμον
  choice: dengan satu mata
  rationale: Padanan alami bagi kata sifat 'bermata satu' dalam susunan kalimat ini.
- source_word: εἰς τὴν ζωὴν
  choice: masuk ke dalam kehidupan
  rationale: Mempertahankan kata 'kehidupan' tanpa menambahkan 'kekal', karena unsur itu tidak dinyatakan secara eksplisit dalam frasa Yunani.
- source_word: βληθῆναι
  choice: dilemparkan
  rationale: Mencerminkan infinitif pasif secara langsung dan alami.
- source_word: γέενναν
  choice: Gehena
  rationale: Mempertahankan istilah khusus Yunani yang berlatar Yahudi dan berkaitan dengan penghakiman akhir, tanpa langsung menyamakannya dengan istilah teologis yang lebih luas.
- source_word: τοῦ πυρός
  choice: yang bernyala-nyala
  rationale: Mengungkapkan gambaran Gehena yang berapi dengan idiom Indonesia yang alami, tanpa menghilangkan citra api.
theological_decisions:
- issue: Penerjemahan γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Teks memakai istilah khusus γέεννα. Transliterasi mempertahankan kekhususan historis dan eskatologisnya; catatan menjelaskan maknanya bagi pembaca umum.
- issue: Penerjemahan εἰς τὴν ζωήν
  choice: masuk ke dalam kehidupan
  alternative: masuk ke dalam kehidupan kekal
  rationale: Walaupun konteksnya kemungkinan menunjuk pada kehidupan eskatologis, teks Yunani tidak memuat kata 'kekal'. Terjemahan tidak menambahkannya.
- issue: Kerasnya perintah mencungkil mata
  choice: mempertahankan gambaran harfiah dan keras
  alternative: melunakkan menjadi 'singkirkanlah penyebab dosa'
  rationale: Teks menyampaikan gambaran tubuh yang sengaja mengejutkan. Terjemahan mempertahankannya tanpa memasukkan penjelasan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti tunggal 'engkau' dipakai agar sesuai dengan bentuk tunggal dalam bahasa Yunani dan dengan gaya wacana pengajaran. Metafora tersandung serta gambaran keras mencungkil mata dipertahankan; istilah 'Gehena' dijelaskan melalui catatan kaki.
