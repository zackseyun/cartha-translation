id: MAT.18.25
reference: Matthew 18:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: id
  text: Namun, karena ia tidak mampu membayar, tuannya[a] memerintahkan agar ia dijual bersama istri dan anak-anaknya serta segala miliknya[b], dan agar pembayaran dilakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani κύριος dapat berarti “Tuhan” atau “tuan”, bergantung pada konteks. Di sini kata itu menunjuk kepada atasan manusia dari hamba dalam perumpamaan ini.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ia dan keluarganya akan dijual, demikian pula segala miliknya, supaya hasilnya digunakan sebagai pembayaran.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Namun, karena ia tidak mampu membayar
  rationale: Konstruksi genitif absolut menyatakan keadaan atau alasan. Secara harfiah ia ‘tidak mempunyai untuk membayar kembali’; dalam konteks utang, ‘tidak mampu membayar’ menyampaikan maksudnya secara wajar tanpa menyatakan bahwa ia sama sekali tidak memiliki apa pun.
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: Kata κελεύω menunjukkan perintah yang berwibawa; ‘memerintahkan’ alami dan tepat dalam konteks hubungan tuan-hamba.
- source_word: ὁ κύριος
  choice: tuannya
  rationale: Dalam perumpamaan ini κύριος menunjuk kepada atasan manusia dari hamba tersebut, bukan gelar ilahi langsung. Bentuk posesif tersirat oleh konteks dan alami dalam bahasa Indonesia.
- source_word: πραθῆναι
  choice: agar ia dijual
  rationale: Infinitif pasif dari πιπράσκω berarti ‘dijual’ dan merupakan isi perintah sang tuan.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: bersama istri dan anak-anaknya
  rationale: Artikel Yunani tidak perlu diterjemahkan secara harfiah; hubungan keluarga dibuat jelas secara idiomatis dalam bahasa Indonesia.
- source_word: πάντα ὅσα ἔχει
  choice: segala miliknya
  rationale: Ungkapan ini mencakup seluruh harta atau kepunyaannya dan diterjemahkan secara ringkas tanpa mempersempit cakupannya.
- source_word: καὶ ἀποδοθῆναι
  choice: dan agar pembayaran dilakukan
  rationale: Bentuk pasif mempertahankan ketidakjelasan pelaku pembayaran dan menyatakan tujuan atau hasil yang diperintahkan tanpa menambahkan rincian yang tidak disebutkan.
theological_decisions:
- issue: Arti κύριος dalam konteks perumpamaan
  choice: tuannya
  alternative: Tuhan; sang tuan
  rationale: Tokoh yang dimaksud adalah atasan manusia dalam dunia cerita. Huruf kecil dan padanan ‘tuan’ menghindari kesan bahwa kata ini merupakan gelar ilahi langsung, sedangkan bentuk ‘-nya’ menjelaskan hubungan dengan hamba secara alami.
- issue: Ketidakjelasan dalam bentuk pasif ἀποδοθῆναι
  choice: agar pembayaran dilakukan
  alternative: agar utangnya dilunasi
  rationale: Terjemahan yang dipilih mempertahankan bentuk pasif dan tidak secara eksplisit menambahkan ‘utang’, meskipun utang jelas dari konteks. Alternatif lebih alami, tetapi sedikit lebih eksplisit daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rangkaian perintah dalam teks Yunani; ‘agar pembayaran dilakukan’ sengaja mempertahankan bentuk pasif meskipun sedikit formal.
