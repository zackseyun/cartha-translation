  source_fidelity: Terjemahan secara akurat mencerminkan genitif absolut kausal μὴ ἔχοντος ... ἀποδοῦναι sebagai ketidakmampuan membayar, perintah berwibawa ἐκέλευσεν, penjualan sang hamba bersama istri, anak-anak, dan seluruh miliknya, serta perintah supaya pembayaran dilakukan. Bentuk pasif pada πραθῆναι dan ἀποδοθῆναι dipertahankan dengan baik tanpa menambahkan pelaku atau rincian utang yang tidak dinyatakan dalam ayat ini.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register naratif perumpamaan. Rangkaian “memerintahkan agar ... dan agar ...” memang agak formal, tetapi tetap alami dan efektif untuk mempertahankan struktur perintah dalam teks sumber.
  terminology: “Tuannya” tepat untuk κύριος dalam konteks seorang atasan manusia di dalam perumpamaan dan menghindari pembacaan sebagai gelar ilahi langsung. “Tidak mampu membayar,” “dijual,” dan “segala miliknya” merupakan padanan yang setia dan idiomatis.
