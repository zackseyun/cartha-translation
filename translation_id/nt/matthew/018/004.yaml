  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: id
  text: Karena itu, siapa pun yang merendahkan dirinya seperti anak ini, dialah yang terbesar dalam Kerajaan Surga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: siapa pun yang
  rationale: Menyampaikan acuan umum dan tidak tertentu dari kata ganti relatif ini secara alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari tindakan simbolis dan pengajaran Yesus dalam konteks sebelumnya.
- source_word: ταπεινώσει ἑαυτόν
  choice: merendahkan dirinya
  rationale: Mempertahankan bentuk refleksif dan gagasan tindakan sadar untuk mengambil kedudukan rendah, tanpa mempersempitnya menjadi sekadar perasaan rendah hati.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: seperti anak ini
  rationale: Mengikuti perbandingan eksplisit dengan anak yang hadir dalam adegan tersebut.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: dialah yang terbesar
  rationale: Konstruksi fokus ini mempertahankan penegasan οὗτός dan predikat superlatif secara idiomatis, tanpa pengulangan kaku 'ia adalah'.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dalam Kerajaan Surga
  rationale: Istilah baku dan wajar dalam bahasa Indonesia untuk ungkapan khas Matius; kapitalisasi menandai pemerintahan ilahi sebagai konsep khusus.
theological_decisions:
- issue: Dasar kebesaran dalam Kerajaan Surga
  choice: Teks mempertahankan paradoks bahwa orang yang merendahkan diri seperti anak ini disebut terbesar.
  alternative: Menafsirkan 'seperti anak ini' secara eksplisit sebagai kepolosan, iman, ketergantungan, atau status sosial tertentu.
  rationale: Ayat ini sendiri tidak menjelaskan aspek perbandingan itu lebih lanjut; terjemahan tidak boleh memasukkan tafsiran tertentu ke dalam teks.
- issue: Penegasan subjek pada οὗτός
  choice: Menggunakan 'dialah' untuk mempertahankan tekanan demonstratif.
  alternative: Menghilangkan penegasan dan menerjemahkan hanya 'adalah yang terbesar'.
  rationale: οὗτός merujuk kembali dengan tekanan kepada siapa pun yang merendahkan diri; bentuk 'dialah' alami dalam bahasa Indonesia dan menjaga penekanan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab-akibat, tindakan refleksif, perbandingan dengan anak, serta penegasan pada hasilnya.
