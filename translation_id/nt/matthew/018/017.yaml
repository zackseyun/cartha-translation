id: MAT.18.17
reference: Matthew 18:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: id
  text: Namun, jika ia tidak mau mendengarkan mereka, sampaikanlah perkara itu kepada jemaat.[a] Dan jika ia juga tidak mau mendengarkan jemaat, biarlah ia bagimu seperti orang bukan Yahudi dan pemungut pajak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "perkumpulan" atau "gereja"; Yunani: ekklēsia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: tidak mau mendengarkan
  rationale: Dalam konteks penanganan kesalahan ini, kata tersebut menyiratkan penolakan untuk mengindahkan, bukan sekadar tidak mendengar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur kesengajaan tanpa memperkuatnya menjadi 'tidak taat'.
- source_word: εἰπὸν
  choice: sampaikanlah perkara itu
  rationale: Imperatif ini memerintahkan agar masalah yang sedang dibicarakan disampaikan kepada komunitas. 'Perkara itu' membuat objek tersiratnya jelas secara alami tanpa menambahkan isi baru.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: jemaat
  rationale: '''Jemaat'' menunjuk komunitas orang yang berkumpul dan merupakan padanan Indonesia yang alami dalam konteks Matius, tanpa harus menyiratkan gedung atau struktur denominasi tertentu.'
- source_word: ἔστω σοι
  choice: biarlah ia bagimu
  rationale: Pilihan ini mempertahankan bentuk imperatif dan datif σοι serta menghindari penafsiran tambahan yang terkandung dalam ungkapan seperti 'anggaplah dia' atau 'perlakukanlah dia'.
- source_word: ὥσπερ
  choice: seperti
  rationale: Padanan perbandingan yang langsung dan alami, sekaligus mempertahankan bentuk simile dalam teks Yunani.
- source_word: ὁ ἐθνικὸς
  choice: orang bukan Yahudi
  rationale: Dalam wacana berlatar Yahudi, istilah ini menunjuk orang dari bangsa-bangsa lain, yakni orang bukan Yahudi. Bentuk ini lebih mudah dipahami pembaca Indonesia modern daripada istilah serapan 'non-Yahudi' atau istilah yang dapat menambah nuansa peyoratif.
- source_word: ὁ τελώνης
  choice: pemungut pajak
  rationale: Padanan langsung dan lazim bagi pejabat atau agen pemungut pajak; bentuk tanpa artikel tak tentu tetap dapat menyatakan kategori perwakilan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan ἐκκλησία dalam konteks disiplin komunitas pada Injil Matius
  choice: jemaat
  alternative: perkumpulan; gereja
  rationale: '''Jemaat'' secara alami menyatakan komunitas yang berkumpul dan tidak mengharuskan pembacaan sebagai lembaga denominasi atau gedung. Catatan kaki mempertahankan alternatif leksikal yang mungkin.'
- issue: Kekuatan tindakan terhadap orang yang tetap tidak mau mendengarkan
  choice: biarlah ia bagimu seperti orang bukan Yahudi dan pemungut pajak
  alternative: perlakukanlah dia sebagai orang luar; anggaplah dia orang bukan Yahudi dan pemungut pajak
  rationale: Terjemahan mempertahankan simile dan bentuk perintah Yunani tanpa mengubahnya menjadi rumusan prosedural yang lebih tegas atau memasukkan doktrin pengucilan yang lebih lengkap daripada yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'tidak mau mendengarkan' serta 'jemaat' dipertahankan karena bersifat retoris dan struktural dalam teks Yunani. 'Namun' dipakai untuk δέ pertama, sedangkan δέ kedua diterjemahkan 'Dan' agar alur bertahap tetap jelas.
source_grounding:
  english_pob_role: consult_only
