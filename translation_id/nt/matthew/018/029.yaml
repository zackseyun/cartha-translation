  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: id
  text: Maka sesama budak itu tersungkur dan memohon kepadanya, katanya, “Bersabarlah menghadapi aku, dan aku akan melunasi utangku kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: budak yang sama-sama mengabdi
  rationale: Kata majemuk ini menunjuk pada orang yang berstatus budak di bawah tuan yang sama. Ungkapan ini mempertahankan kenyataan sosial tentang perbudakan sekaligus menyatakan hubungan antartokoh secara alami dalam bahasa Indonesia.
- source_word: πεσὼν
  choice: tersungkur
  rationale: Partisip ini menggambarkan tindakan menjatuhkan diri sebagai sikap merendah ketika memohon; 'tersungkur' ringkas dan jelas dalam konteks ini.
- source_word: οὖν
  choice: Maka
  rationale: Penghubung ini melanjutkan alur sekaligus menunjukkan tanggapan tokoh terhadap tindakan sebelumnya. 'Maka' sesuai dengan gaya naratif yang bermartabat.
- source_word: παρεκάλει
  choice: memohon
  rationale: Dalam konteks permintaan putus asa mengenai utang, kata ini menyatakan permohonan yang sungguh-sungguh. Bentuk imperfek Yunani menampilkan tindakan yang sedang atau terus dilakukan, tetapi tidak perlu diberi penanda tambahan dalam bahasa Indonesia.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Bersabarlah terhadap aku
  rationale: Ungkapan ini meminta kelapangan hati atau penangguhan tindakan terhadap seseorang. 'Bersabarlah terhadap aku' mempertahankan hubungan ἐπί dengan objek orang dan terdengar wajar serta bermartabat.
- source_word: ἀποδώσω
  choice: aku akan membayar kembali
  rationale: Dalam konteks utang, verba ini berarti melunasi atau mengembalikan apa yang terutang. Terjemahan ini mempertahankan bentuk janji pada masa mendatang tanpa menambahkan kepastian yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan bahasa δοῦλος dalam σύνδουλος
  choice: budak yang sama-sama mengabdi
  alternative: sesama hamba
  rationale: Konteks perumpamaan menonjolkan status orang-orang yang berada di bawah kuasa tuan yang sama. 'Budak' mempertahankan ketidakbebasan sosial yang terkandung dalam istilah sumber, sedangkan keterangan 'yang sama-sama mengabdi' memperjelas unsur σύν- tanpa mengurangi kerasnya realitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi 'budak' dipakai untuk ketepatan historis, bukan sebagai istilah merendahkan masa kini. Ujaran langsung memakai 'aku' karena merupakan permohonan pribadi kepada rekan yang setara statusnya.
