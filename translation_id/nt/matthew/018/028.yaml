id: MAT.18.28
reference: Matthew 18:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: id
  text: Namun, setelah budak itu keluar, ia menemukan seorang sesama budak yang berutang kepadanya seratus dinar.[a] Ia menangkap orang itu dan mulai mencekiknya sambil berkata, “Bayarlah apa pun yang menjadi utangmu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu dinar adalah upah yang lazim untuk satu hari kerja seorang pekerja atau prajurit.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “Bayarlah jika engkau berutang apa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: budak
  rationale: Status keterikatan dan kuasa paksa menonjol dalam perumpamaan ini; “budak” menyatakan realitas sosial tersebut lebih jelas daripada “pelayan” atau “hamba”.
- source_word: ἐξελθὼν δὲ
  choice: Namun, setelah ... keluar
  rationale: Menyampaikan peralihan naratif δέ dan hubungan waktu dari partisip aoris dalam bahasa Indonesia yang alami.
- source_word: συνδούλων
  choice: sesama budak
  rationale: Mempertahankan unsur σύν- (‘sesama’) dan konsisten dengan terjemahan δοῦλος.
- source_word: ὤφειλεν
  choice: berutang
  rationale: Kata ini menunjuk pada kewajiban finansial dan diterjemahkan dengan istilah Indonesia yang lugas.
- source_word: ἑκατὸν δηνάρια
  choice: seratus dinar
  rationale: Mempertahankan satuan uang kuno agar perbandingan jumlah utang dalam perumpamaan tidak diratakan menjadi nilai modern.
- source_word: κρατήσας
  choice: menangkap orang itu
  rationale: Mengungkapkan tindakan fisik yang kuat tanpa mengurangi kekerasan adegan.
- source_word: ἔπνιγεν
  choice: mulai mencekiknya
  rationale: Aspek imperfek dapat menyatakan tindakan yang sedang berlangsung atau mulai dilakukan; pilihan ini menyampaikan permulaan tindakan keras secara alami.
- source_word: Ἀπόδος
  choice: Bayarlah
  rationale: Dalam konteks utang, imperatif ini merupakan tuntutan tegas untuk membayar kembali.
- source_word: εἴ τι ὀφείλεις
  choice: apa pun yang menjadi utangmu
  rationale: Menjaga nuansa tak tentu dari εἴ τι dalam ungkapan Indonesia yang wajar; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perumpamaan
  choice: budak / sesama budak
  alternative: hamba / sesama hamba; pelayan / sesama pelayan
  rationale: Ayat ini menggambarkan seseorang yang berada di bawah kuasa tuan dan menggunakan kekerasan terhadap orang lain dengan status terikat yang sama. “Budak” mempertahankan dimensi kepemilikan dan kuasa paksa tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti “ia” dipakai untuk narasi, sedangkan “-mu” mempertahankan tuntutan langsung dan keras. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
