  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: id
  text: Maka budak itu tersungkur, lalu bersujud di hadapannya[a] sambil berkata, “Bersabarlah terhadapku, dan aku akan membayar semuanya kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membungkuk dengan hormat di hadapannya”. Kata Yunani yang dipakai di sini juga dapat berarti “menyembah” dalam konteks lain, tetapi di sini menggambarkan tindakan merendahkan diri di hadapan seorang majikan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: tersungkur
  rationale: Partisip aoris dari πίπτω menggambarkan tindakan fisik budak itu menjatuhkan diri. “Tersungkur” secara wajar menyampaikan sikap merendahkan diri dalam konteks ini.
- source_word: οὖν
  choice: Maka
  rationale: Menandai akibat dari tindakan sang raja pada ayat sebelumnya sekaligus melanjutkan alur cerita secara alami.
- source_word: δοῦλος
  choice: budak
  rationale: δοῦλος menunjuk pada orang yang berada dalam status perbudakan. Dalam perumpamaan tentang utang dan kewajiban penuh ini, “budak” mempertahankan realitas sosial tersebut dengan lebih tepat daripada “hamba” atau “pelayan”.
- source_word: προσεκύνει αὐτῷ
  choice: bersujud di hadapannya
  rationale: Dalam konteks seorang budak menghadap majikan manusia, προσκυνέω menyatakan penghormatan dan permohonan dengan merendahkan tubuh. “Bersujud di hadapannya” mempertahankan tindakan fisik itu tanpa memastikan bahwa yang dimaksud adalah penyembahan religius.
- source_word: λέγων
  choice: sambil berkata
  rationale: Partisip ini memperkenalkan ucapan langsung dan menunjukkan bahwa perkataan itu menyertai tindakan bersujud.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Bersabarlah terhadapku
  rationale: Imperatif ini meminta tenggang waktu dan kesabaran dari pihak yang berhak menagih. Ungkapan tersebut jelas dan alami dalam bahasa Indonesia modern.
- source_word: πάντα
  choice: semuanya
  rationale: Bentuk netral jamak ini bersifat menyeluruh. Dalam konteks utang, “semuanya” secara alami menunjuk pada seluruh jumlah yang harus dibayar.
- source_word: ἀποδώσω σοι
  choice: aku akan melunasi ... kepadamu
  rationale: Bentuk futurum ἀποδίδωμι dalam konteks utang berarti membayar kembali. “Melunasi” menyampaikan janji pembayaran penuh secara ringkas dan alami.
theological_decisions:
- issue: Makna προσκυνέω terhadap seorang majikan manusia
  choice: Diterjemahkan sebagai tindakan bersujud untuk menyatakan hormat dan memohon
  alternative: “menyembahnya”
  rationale: Tokoh yang menjadi sasaran tindakan ini adalah raja atau majikan dalam dunia perumpamaan. Konteks langsung mendukung sikap takzim dengan merendahkan tubuh, sedangkan “menyembahnya” dapat memberi kesan religius yang lebih kuat daripada yang dipastikan konteks. Catatan kaki tetap mengakui rentang makna verba Yunani itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Budak” mempertahankan status sosial δοῦλος, sedangkan “bersujud di hadapannya” menyampaikan tindakan penghormatan tanpa memaksakan makna penyembahan religius.
