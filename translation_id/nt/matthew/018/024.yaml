reference: Matthew 18:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: id
  text: Ketika ia mulai mengadakan perhitungan, seorang yang berutang sepuluh ribu talenta[a] dibawa menghadap kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talenta adalah satuan uang yang sangat besar; dalam latar perumpamaan ini, “sepuluh ribu talenta” menggambarkan utang yang tak terbayangkan besarnya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Ketika ia mulai
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu yang mengantar tindakan utama. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan urutan waktu secara berlebihan.
- source_word: συναίρειν
  choice: mengadakan perhitungan
  rationale: Dalam konteks keuangan, kata ini menunjuk pada pemeriksaan dan penyelesaian rekening. Pilihan ini mempertahankan gambaran pembukuan sekaligus mudah dipahami.
- source_word: προσηνέχθη
  choice: dibawa menghadap
  rationale: Bentuk pasif aoristus menunjukkan bahwa orang itu dibawa oleh pihak lain. 'Dibawa menghadap' menyampaikan gerak ke hadapan raja secara alami tanpa menyebut pelaku yang tidak dinyatakan.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Datif ini menyatakan kepada siapa orang berutang itu dibawa; bentuk pronominal mempertahankan acuan yang ada dalam teks Yunani.
- source_word: εἷς ὀφειλέτης
  choice: seorang yang berutang
  rationale: '''Seorang'' mempertahankan unsur εἷς sambil menghasilkan ungkapan Indonesia yang lebih alami daripada istilah teknis ''seorang debitur''.'
- source_word: μυρίων ταλάντων
  choice: sepuluh ribu talenta
  rationale: μύριοι secara harfiah berarti 'sepuluh ribu' dan di sini menyatakan jumlah uang yang luar biasa besar. Satuan historis 'talenta' dipertahankan karena konversi tepat ke mata uang modern tidak pasti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah teknis keuangan yang kurang umum dihindari, sedangkan satuan historis 'talenta' dipertahankan dan dijelaskan dalam catatan kaki.
