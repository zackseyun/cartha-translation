  - severity: low
    issue: Diksi “memanggil dia” dan sapaan “Hai”
    rationale: Keduanya dapat dipahami, tetapi “memanggilnya” dan vokatif langsung “Budak jahat” lebih lancar dalam bahasa Indonesia modern sambil mempertahankan nada kecaman.
