  source_fidelity: 'Makna dasar diterjemahkan dengan tepat: tuan memanggil budaknya, mengecamnya, dan menyatakan bahwa seluruh utangnya telah dihapus karena ia memohon. Namun, kapitalisasi kata ganti orang pertama bagi tokoh tuan melampaui teks sumber, yang hanya menyebutnya sebagai tuan dalam perumpamaan.'
  naturalness: 'Kalimat direvisi agar lebih alami dalam bahasa Indonesia modern: “memanggilnya” lebih ringkas daripada “memanggil dia,” dan “Budak jahat” mempertahankan vokatif yang keras tanpa sapaan “Hai” yang cenderung lebih arkais.'
  terminology: “Budak” tepat untuk δοῦλος dalam relasi tuan-budak yang menjadi unsur penting perumpamaan. “Menghapus” sesuai dengan objek “utang,” sedangkan catatan kaki mempertahankan kemungkinan makna “mengampuni” dari ἀφίημι.
