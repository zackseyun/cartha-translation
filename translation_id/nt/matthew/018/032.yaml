  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: id
  text: Kemudian tuannya memanggilnya dan berkata kepadanya, “Budak jahat, Aku sudah menghapus seluruh utangmu itu karena engkau memohon kepadaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Penanda urutan naratif yang alami dalam bahasa Indonesia dan sesuai dengan perkembangan perumpamaan.
- source_word: προσκαλεσάμενος
  choice: memanggil dia
  rationale: Bentuk ini menyatakan tindakan memanggil seseorang untuk datang menghadap; dalam konteks tuan dan budak, kewibawaan panggilan sudah tersirat.
- source_word: ὁ κύριος αὐτοῦ
  choice: tuannya
  rationale: κύριος di sini menunjuk kepada tuan dalam hubungan sosial perumpamaan, bukan gelar ilahi.
- source_word: λέγει αὐτῷ
  choice: berkata kepadanya
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang wajar tanpa mengubah makna.
- source_word: Δοῦλε
  choice: budak
  rationale: δοῦλος menunjukkan orang yang berada dalam ikatan kepemilikan dan ketergantungan kepada tuannya; unsur ini penting dalam perumpamaan tersebut.
- source_word: πονηρέ
  choice: yang jahat
  rationale: Menyampaikan kecaman moral secara jelas dan wajar dalam sapaan bahasa Indonesia.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: seluruh utangmu itu
  rationale: Mengungkapkan baik keseluruhan utang maupun rujukan kepada utang besar yang telah disebut sebelumnya; sufiks -mu memperjelas pihak yang berutang secara alami.
- source_word: ἀφῆκά σοι
  choice: telah Kuhapuskan
  rationale: Dalam konteks utang, ἀφίημι berarti membebaskan atau menghapus utang. Pilihan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kaitannya dengan kosakata pengampunan.
- source_word: ἐπεὶ
  choice: karena
  rationale: Memperkenalkan alasan tindakan sang tuan secara langsung dan jelas.
- source_word: παρεκάλεσάς με
  choice: engkau memohon kepada-Ku
  rationale: παρακαλέω di sini menyatakan permohonan sungguh-sungguh; 'memohon' sesuai dengan ragam yang bermartabat dan tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam hubungan tuan-budak pada perumpamaan
  choice: budak
  alternative: hamba
  rationale: '''Budak'' menyatakan status terikat yang nyata dan mempertahankan ketimpangan hukum serta ekonomi yang penting bagi daya dorong perumpamaan. Alternatif yang lebih halus dicantumkan agar rentang makna istilah tetap terlihat.'
- issue: Penerjemahan ἀφίημι dalam konteks utang
  choice: menghapuskan
  alternative: mengampuni
  rationale: Objek langsungnya adalah utang, sehingga 'menghapuskan' paling alami dan tepat secara kontekstual. Catatan kaki mempertahankan ambiguitas penting bahwa verba yang sama juga berarti 'mengampuni', yang menghubungkan gambaran utang dengan tema pengampunan dalam Injil Matius.
- issue: Huruf kapital pada kata ganti sang tuan
  choice: Kuhapuskan; kepada-Ku
  alternative: kuhapuskan; kepadaku
  rationale: Dalam alur perumpamaan, sang tuan melambangkan raja dan akhirnya Bapa surgawi; kapitalisasi mempertahankan pembacaan teologis yang lazim dalam bahasa Indonesia tanpa mengganti sebutan naratif 'tuan' menjadi gelar ilahi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “Hai budak yang jahat” mempertahankan bentuk vokatif dan kerasnya kecaman. Bentuk “engkau” dipakai karena sesuai dengan dialog perumpamaan yang resmi, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
