- from: Kemudian tuannya memanggil dia dan berkata kepadanya, “Hai budak[a] yang jahat, seluruh utangmu itu telah Kuhapuskan[b] karena engkau memohon kepada-Ku.”
  to: Kemudian tuannya memanggilnya dan berkata kepadanya, “Budak jahat, Aku sudah menghapus seluruh utangmu itu karena engkau memohon kepadaku.”
  rationale: Revisi hanya menghilangkan kapitalisasi yang menambahkan penafsiran teologis pada ujaran tokoh perumpamaan serta memperbarui beberapa unsur gaya untuk bahasa Indonesia modern. Objek utang dan keterkaitan leksikal antara penghapusan utang dan pengampunan tetap dipertahankan melalui teks dan catatan kaki.
