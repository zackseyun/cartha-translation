  naturalness: Teksnya umumnya jelas dan memakai register Indonesia modern yang pantas. Susunan “secara pribadi, hanya antara engkau dan dia” dapat dirapikan menjadi “secara pribadi, antara engkau dan dia saja,” yang tetap setia pada penekanan eksklusif Yunani dan lebih idiomatis.
  terminology: “Saudaramu,” “berbuat dosa,” dan “tegurlah” sesuai dengan bentuk dan makna sumber. Catatan tentang bentuk maskulin tunggal dapat dipertahankan, tanpa memperluas teks utama secara interpretatif.
