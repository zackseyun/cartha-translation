  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: id
  text: Namun, jika saudaramu berbuat dosa terhadapmu[a], pergilah dan tegurlah dia secara pribadi, antara engkau dan dia saja. Jika dia mendengarkanmu, engkau telah mendapatkan saudaramu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah tidak memuat “terhadapmu”, sehingga berbunyi, “Jika saudaramu berbuat dosa, pergilah dan tegurlah dia secara pribadi, antara engkau dan dia saja.”
    reason: textual_variant
  - marker: b
    text: Kata “saudara” berbentuk maskulin tunggal; dalam konteks ini istilah tersebut dapat merujuk lebih luas kepada sesama murid.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: berbuat dosa
  rationale: Mempertahankan bobot moral dan religius ἁμαρτάνω; bentuk kondisional Yunani disampaikan secara alami dengan 'jika ... berbuat dosa'.
- source_word: εἰς σέ
  choice: terhadapmu
  rationale: Padanan Indonesia yang alami untuk pelanggaran yang ditujukan kepada lawan bicara; frasa ini dipertahankan karena terdapat dalam SBLGNT, sedangkan varian yang menghilangkannya dicatat dalam catatan kaki.
- source_word: ὁ ἀδελφός σου
  choice: saudaramu
  rationale: Mengikuti bentuk maskulin tunggal Yunani sekaligus tetap alami dalam konteks komunitas murid; cakupannya dapat lebih luas daripada saudara kandung.
- source_word: ὕπαγε
  choice: pergilah
  rationale: Imperatif langsung dan wajar dalam bahasa Indonesia.
- source_word: ἔλεγξον
  choice: tegurlah
  rationale: Menyampaikan tindakan menunjukkan kesalahan secara langsung. 'Konfrontasilah' kurang alami, sedangkan 'hardiklah' terlalu keras.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: secara pribadi, hanya antara engkau dan dia
  rationale: Menjelaskan penekanan Yunani pada privasi dan pembatasan percakapan kepada kedua pihak dengan bahasa Indonesia yang alami.
- source_word: ἀκούσῃ
  choice: mendengarkanmu
  rationale: Mencakup mendengar dengan sikap menerima tanpa mempersempit makna menjadi ketaatan penuh.
- source_word: ἐκέρδησας
  choice: telah mendapatkan kembali
  rationale: Dalam konteks pemulihan hubungan, κερδαίνω menyatakan keberhasilan memperoleh kembali saudara yang terancam hilang; kata 'kembali' memperjelas implikasi kontekstual, sementara metafora mendapatkan tetap dipertahankan.
theological_decisions:
- issue: Cakupan ἀδελφός dalam komunitas murid
  choice: saudaramu
  alternative: saudara seimanmu / saudara laki-laki atau perempuan
  rationale: Teks utama mempertahankan bentuk tunggal maskulin sumber tanpa membatasi istilah itu pada saudara kandung; catatan menerangkan kemungkinan cakupan kontekstualnya.
- issue: Status tekstual εἰς σέ
  choice: memasukkan 'terhadapmu' dalam teks utama
  alternative: 'menghilangkan frasa itu: ''jika saudaramu berbuat dosa'''
  rationale: SBLGNT memuat εἰς σέ. Karena varian pendek memengaruhi apakah petunjuk ini secara eksplisit menyangkut dosa terhadap lawan bicara, varian tersebut dicatat, bukan diselesaikan secara diam-diam.
- issue: Nuansa rekonsiliasi dalam ἐκέρδησας
  choice: engkau telah mendapatkan kembali saudaramu
  alternative: engkau telah mendapatkan saudaramu / engkau telah memenangkan saudaramu
  rationale: Konteks menunjukkan pemulihan seorang saudara dalam relasi. 'Mendapatkan kembali' alami dalam bahasa Indonesia, tetapi nuansa literal 'mendapatkan' dicatat sebagai alternatif agar implikasi kontekstual tidak dianggap satu-satunya kemungkinan leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Engkau' dipakai untuk menjaga wacana langsung tunggal dan nada Kitab Suci; 'secara pribadi' membuat ungkapan privasi alami tanpa menghilangkan penekanan 'hanya antara engkau dan dia'.
