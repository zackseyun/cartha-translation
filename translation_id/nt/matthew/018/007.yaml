revisions:
- from: Celakalah dunia karena hal-hal yang menyebabkan orang jatuh ke dalam dosa![a] Sebab, hal-hal semacam itu memang harus datang, tetapi celakalah orang yang melaluinya hal yang menyebabkan orang jatuh itu datang![b]
  to: Celakalah dunia karena batu-batu sandungan![a] Sebab, batu-batu sandungan itu memang harus datang, tetapi celakalah orang[b] yang melaluinya batu sandungan itu datang.
  rationale: Revisi mengganti parafrasa yang sempit dengan “batu sandungan,” istilah Indonesia yang alami dan mapan serta paling baik mempertahankan metafora dan ambiguitas σκάνδαλον. Bentuk jamak dan tunggal dipertahankan, begitu pula pengulangan “datang” dan keharusan yang tidak dijelaskan dasarnya. Catatan kaki b dikoreksi agar pernyataan gramatikalnya akurat dan jangkar catatan ditempatkan langsung pada “orang.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Draf mempertahankan struktur utama dengan baik: dua seruan οὐαί, sebab ἀπό, keharusan ἀνάγκη, pertentangan πλήν, serta pengulangan “datang.” Namun, padanan parafrastis “hal-hal yang menyebabkan orang jatuh ke dalam dosa” mempersempit dan memperpanjang metafora σκάνδαλον, sedangkan klausa tunggal kemudian tidak lagi memuat “ke dalam dosa,” sehingga paralelisme makna menjadi kurang konsisten.'
  naturalness: Bahasanya umumnya modern dan jelas. “Batu sandungan” lebih ringkas, lazim, dan mempertahankan metafora Yunani tanpa memutuskan apakah tekanan utamanya adalah godaan, pelanggaran, atau penyebab dosa. Susunan “orang yang melaluinya batu sandungan itu datang” tetap dapat dipahami secara alami dalam ragam Alkitab modern.
  terminology: “Celakalah,” “dunia,” “Sebab,” “harus,” dan “tetapi” tepat. “Batu sandungan” adalah istilah yang mapan untuk σκάνδαλον dan, dengan catatan kaki, lebih setia daripada penjelasan utama yang hanya menekankan kejatuhan ke dalam dosa. Catatan kaki tentang “orang” perlu diperbaiki karena bukan kata Indonesia “orang” yang berbentuk maskulin tunggal, melainkan kata Yunani ἀνθρώπῳ.
  issues:
  - severity: medium
    issue: Padanan utama σκάνδαλα/σκάνδαλον terlalu eksplikatif dan tidak sepenuhnya paralel.
    rationale: “Hal-hal yang menyebabkan orang jatuh ke dalam dosa” menafsirkan metafora sebagai penyebab dosa, sedangkan σκάνδαλον juga dapat mencakup sandungan, jerat, atau pelanggaran. Dalam klausa kedua, unsur “ke dalam dosa” bahkan hilang. “Batu-batu sandungan/batu sandungan” menjaga bentuk jamak-tunggal, metafora, dan keluasan makna.
  - severity: medium
    issue: Catatan kaki b keliru menyatakan bahwa kata “orang” berbentuk tunggal dalam bahasa Yunani.
    rationale: Yang berbentuk datif maskulin tunggal adalah ἀνθρώπῳ, bukan kata Indonesia “orang.” Catatan perlu menyebut kata Yunani itu dan tetap menjelaskan daya generiknya.
