base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: id
  text: Celakalah dunia karena batu-batu sandungan![a] Sebab, batu-batu sandungan itu memang harus datang, tetapi celakalah orang[b] yang melaluinya batu sandungan itu datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelanggaran-pelanggaran,” “hal-hal yang menyebabkan orang berdosa,” atau “jerat-jerat.” Kata Yunani σκάνδαλον/σκάνδαλα menunjuk pada sesuatu yang membuat orang tersandung, termasuk godaan, pelanggaran, atau kesempatan untuk berbuat dosa.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “orang” berbentuk maskulin tunggal, tetapi di sini menunjuk secara umum kepada siapa pun yang menjadi jalan datangnya batu sandungan itu.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Celakalah
  rationale: Mempertahankan daya kecaman dan peringatan profetis, serta pengulangannya dalam kedua klausa.
- source_word: κόσμῳ
  choice: dunia
  rationale: Merujuk secara luas kepada dunia manusia, bukan hanya ciptaan fisik.
- source_word: ἀπὸ
  choice: karena
  rationale: Dalam konteks ini menyatakan sebab dari celaka yang menimpa dunia.
- source_word: σκάνδαλα / σκάνδαλον
  choice: hal-hal yang menyebabkan orang jatuh ke dalam dosa / hal yang menyebabkan orang jatuh
  rationale: Mengungkapkan fungsi metaforis σκάνδαλον secara jelas dalam bahasa Indonesia sambil tetap mempertahankan gambaran tentang jatuh; bentuk jamak dan tunggal dibedakan.
- source_word: ἀνάγκη
  choice: memang harus
  rationale: Mempertahankan gagasan keharusan atau keniscayaan tanpa menentukan dasar keharusan itu.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa klausa berikut menjelaskan pernyataan sebelumnya.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: datang ... datang
  rationale: Mempertahankan pengulangan verba dan citra sumber Yunani.
- source_word: πλήν
  choice: tetapi
  rationale: Menandai peralihan kuat dari keniscayaan umum kepada tanggung jawab pribadi.
- source_word: ἀνθρώπῳ
  choice: orang
  rationale: Dalam bahasa Indonesia, 'orang' secara alami dapat merujuk kepada satu individu tanpa menentukan jenis kelamin; ini menyampaikan fungsi representatif kata Yunani maskulin tunggal.
- source_word: δι’ οὗ
  choice: yang melaluinya
  rationale: Menyatakan orang tersebut sebagai perantara atau pelaku yang melalui dirinya penyebab kejatuhan itu datang.
theological_decisions:
- issue: Sifat keharusan dalam ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Diterjemahkan sebagai 'memang harus datang' tanpa menyebut penyebab ilahi.
  alternative: Penyebab-penyebab itu tidak terelakkan atau pasti akan muncul.
  rationale: Bahasa Yunani menegaskan keharusan, tetapi tidak menerangkan dasarnya; terjemahan mempertahankan ketegangan itu tanpa menetapkan dekret ilahi ataupun sekadar keniscayaan praktis.
- issue: Daya representatif ἀνθρώπῳ
  choice: Diterjemahkan 'orang' sebagai individu tunggal yang berlaku umum.
  alternative: laki-laki itu; siapa pun
  rationale: ἀνθρώπῳ berbentuk maskulin tunggal, tetapi dalam konteks ini berfungsi generik. Bahasa Indonesia tidak memiliki keharusan gramatikal untuk menandai gender pada 'orang', sehingga pilihan ini akurat dan alami tanpa mempersempit cakupan peringatan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ungkapan penjelas dipilih agar metafora tersandung tetap terasa sekaligus makna moralnya mudah dipahami. Pengulangan 'celakalah' dan 'datang' dipertahankan untuk menjaga struktur retoris ayat.
