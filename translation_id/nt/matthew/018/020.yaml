  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: id
  text: Sebab, di mana dua atau tiga orang berkumpul dalam nama-Ku, di situ Aku ada di tengah-tengah mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara mereka.”
    reason: Alternatif leksikal yang alami untuk ἐν μέσῳ αὐτῶν; bentuk utama lebih dekat mempertahankan citra “di tengah”.
lexical_decisions:
- source_word: οὗ
  choice: di mana
  rationale: Membuka klausa lokatif dan berpasangan secara alami dengan “di situ”; tidak diperluas menjadi “di mana pun” karena bentuk Yunani tidak menuntut penekanan itu.
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan perkataan ini dengan konteks sebelumnya.
- source_word: δύο ἢ τρεῖς
  choice: dua atau tiga orang
  rationale: Menerjemahkan ungkapan angka secara langsung; “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa yang dimaksud adalah manusia.
- source_word: συνηγμένοι
  choice: berkumpul
  rationale: Mengungkapkan keadaan bersama yang dihasilkan oleh tindakan berkumpul dengan bahasa Indonesia yang alami. Bentuk harfiah pasif “dikumpulkan” dapat menyiratkan pelaku tertentu secara lebih kuat daripada yang perlu dinyatakan dalam terjemahan.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: dalam nama-Ku
  rationale: Ungkapan Indonesia yang mapan dan ringkas untuk pertemuan yang berhubungan dengan nama, kewenangan, dan kesetiaan kepada Yesus, tanpa membatasi frasa itu hanya pada salah satu nuansa tersebut.
- source_word: ἐκεῖ
  choice: di situ
  rationale: Berkorelasi dengan “di mana” dan mempertahankan susunan lokatif Yunani secara alami.
- source_word: εἰμι
  choice: Aku ada
  rationale: Menerjemahkan pernyataan keberadaan atau kehadiran secara langsung tanpa menambahkan penjelasan tentang cara kehadiran itu berlangsung.
- source_word: ἐν μέσῳ αὐτῶν
  choice: di tengah-tengah mereka
  rationale: Mempertahankan citra ruang dari ungkapan Yunani dan tetap alami; “di antara mereka” dicatat sebagai alternatif yang sah.
theological_decisions:
- issue: Makna kehadiran Kristus di tengah para murid yang berkumpul
  choice: Pernyataan diterjemahkan langsung sebagai “Aku ada di tengah-tengah mereka.”
  alternative: Terjemahan yang lebih menjelaskan seperti “Aku hadir bersama mereka,” atau penafsiran sakramental maupun eklesiologis tertentu.
  rationale: Ayat ini menegaskan kehadiran Yesus, tetapi tidak menjelaskan hakikat atau cara metafisis kehadiran tersebut. Terjemahan mempertahankan penegasan itu tanpa memasukkan rumusan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pronomina ilahi (“-Ku”, “Aku”) mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya, bukan sesudah “nama-Ku”.
