id: MAT.18.1
reference: Matthew 18:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: id
  text: Pada waktu itu murid-murid datang kepada Yesus dan bertanya, “Jadi, siapakah yang lebih besar dalam Kerajaan Surga?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Pada waktu itu
  rationale: Ungkapan waktu ini diterjemahkan secara alami dan tetap dekat dengan bentuk Yunani.
- source_word: λέγοντες
  choice: dan bertanya
  rationale: Secara harfiah berarti 'berkata', tetapi karena ujaran langsungnya berbentuk pertanyaan, 'bertanya' lebih alami dalam bahasa Indonesia tanpa mengubah fungsi naratifnya.
- source_word: Τίς ἄρα
  choice: Jadi, siapakah
  rationale: ἄρα memberi nuansa kesimpulan atau kelanjutan pemikiran; 'jadi' mempertahankan nuansa tersebut.
- source_word: μείζων
  choice: lebih besar
  rationale: Bentuk komparatif dipertahankan sebagai 'lebih besar', bukan diubah menjadi superlatif 'terbesar', sehingga ambiguitas dan tekanan teks sumber tetap terjaga.
- source_word: βασιλείᾳ τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan baku dan mudah dipahami untuk ungkapan khas Matius, dengan 'Kerajaan' menunjuk pada pemerintahan atau ranah kekuasaan Allah.
theological_decisions:
- issue: Komparatif μείζων dalam pertanyaan tentang kedudukan
  choice: lebih besar
  alternative: terbesar
  rationale: Teks Yunani memakai bentuk komparatif. Terjemahan tidak mengubahnya menjadi superlatif dan dengan demikian tidak menyelesaikan secara diam-diam ketegangan makna dalam pertanyaan para murid.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan bentuk komparatif yang penting dalam teks sumber.
