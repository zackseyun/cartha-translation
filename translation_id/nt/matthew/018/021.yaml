  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: id
  text: Kemudian Petrus menghampiri Yesus dan berkata, “Tuhan, berapa kali saudaraku[a] akan berbuat dosa terhadapku dan aku akan mengampuninya? Sampai tujuh kali?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai kata “saudara” dalam bentuk maskulin tunggal; dalam konteks ini kata tersebut dapat menunjuk lebih luas kepada sesama murid.
    reason: Menjelaskan bentuk gramatikal sumber sekaligus kemungkinan cakupan kontekstualnya tanpa memperluas teks utama secara diam-diam.
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai urutan dalam alur percakapan secara alami tanpa memperberatnya menjadi keterangan waktu yang lebih panjang.
- source_word: προσελθὼν αὐτῷ
  choice: menghampiri Yesus
  rationale: Partisip aorist προσέρχομαι menyatakan gerak mendekat. Nama “Yesus” memperjelas acuan αὐτῷ secara wajar dalam bahasa Indonesia.
- source_word: ὁ Πέτρος εἶπεν
  choice: Petrus ... berkata
  rationale: Mempertahankan verba tutur umum εἶπεν; bentuk pertanyaan sudah tampak dari isi ujarannya.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan baku bagi sapaan κύριε kepada Yesus, yang mempertahankan penghormatan sekaligus kemungkinan resonansi teologisnya.
- source_word: ποσάκις
  choice: berapa kali
  rationale: Menyatakan frekuensi yang dihitung dan selaras dengan batas angka yang diajukan sesudahnya.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: akan berbuat dosa terhadap aku
  rationale: Mempertahankan bentuk futur ἁμαρτήσει dan arah pelanggaran yang dinyatakan oleh εἰς ἐμέ.
- source_word: ὁ ἀδελφός μου
  choice: saudaraku
  rationale: Padanan Indonesia yang alami untuk hubungan yang dinyatakan ἀδελφός μου; catatan kaki menjelaskan bahwa bentuk Yunani secara gramatikal maskulin dan mungkin dipakai lebih luas dalam konteks.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: dan aku mengampuninya
  rationale: ἀφίημι dalam konteks etis ini berarti mengampuni. Susunan koordinatif dengan καί dipertahankan agar ketegangan bentuk pertanyaan Yunani tidak diubah menjadi rumusan interpretatif seperti “harus mengampuni.”
- source_word: ἕως ἑπτάκις
  choice: Sampai tujuh kali?
  rationale: ἕως menyatakan batas yang diusulkan, sedangkan ἑπτάκις berarti tujuh kali.
theological_decisions:
- issue: Cakupan ἀδελφός dalam konteks komunitas murid
  choice: “saudaraku” dalam teks utama, dengan penjelasan bentuk maskulin Yunani dalam catatan kaki
  alternative: “saudara laki-lakiku” atau “sesama murid”
  rationale: Kata Yunani berbentuk maskulin tunggal, tetapi dalam konteks dapat menunjuk lebih luas kepada sesama murid. “Saudaraku” mempertahankan istilah kekerabatan secara alami tanpa memaksakan atau menutup cakupan kontekstualnya.
- issue: Hubungan antara dosa saudara dan tindakan mengampuni
  choice: Mempertahankan koordinasi “dan aku mengampuninya”
  alternative: “berapa kali aku harus mengampuni saudaraku jika ia berdosa terhadap aku?”
  rationale: Alternatif tersebut lebih idiomatis tetapi memasukkan unsur kewajiban (“harus”) dan hubungan bersyarat (“jika”) yang tidak dinyatakan secara eksplisit dalam teks Yunani. Terjemahan utama mempertahankan bentuk dan ketegangan pertanyaan sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk futur dinyatakan dengan “akan” pada verba pertama, sedangkan klausa kedua dibiarkan sebagai “aku mengampuninya” agar tetap alami sekaligus mengikuti koordinasi Yunani. Istilah “terhadap aku” dipilih daripada “kepadaku” untuk menegaskan arah pelanggaran.
