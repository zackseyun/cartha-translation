  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: id
  text: '“Sesungguhnya, Aku berkata kepada kalian: Apa pun yang kalian ikat di bumi akan telah diikat di surga, dan apa pun yang kalian lepaskan di bumi akan telah dilepaskan di surga.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “akan diikat di surga ... akan dilepaskan di surga.” Bentuk Yunani dapat diterjemahkan demikian, tetapi terjemahan utama mencerminkan verba masa depan dengan partisipel perfek, yang dapat menunjukkan keadaan yang telah berlaku di surga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Berfungsi sebagai penegasan khidmat yang mengawali perkataan berwibawa. “Sesungguhnya” jelas dan wajar dalam ragam Indonesia yang bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan ujaran langsung dan bentuk jamak ὑμῖν. “Kalian” memperjelas bahwa perkataan ini ditujukan kepada lebih dari satu orang.
- source_word: ὅσα ἐὰν
  choice: apa pun yang
  rationale: Menyampaikan cakupan umum tak tentu dari konstruksi relatif dengan ἐάν secara alami dalam bahasa Indonesia.
- source_word: δήσητε
  choice: kalian ikat
  rationale: Mempertahankan metafora dasar δέω dan tidak mempersempitnya menjadi hanya “melarang” atau suatu tindakan yuridis tertentu.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Padanan idiomatis yang jelas bagi ruang duniawi, yang dikontraskan dengan surga.
- source_word: ἔσται δεδεμένα
  choice: akan sudah diikat
  rationale: 'Mencerminkan verba masa depan bersama partisipel pasif perfek: pada waktu yang dimaksud, keadaan terikat itu sudah berlaku sebagai hasil tindakan sebelumnya. Susunan ini sengaja mempertahankan nuansa aspek Yunani meskipun agak lebih formal daripada bentuk pasif masa depan sederhana.'
- source_word: ἐν οὐρανῷ
  choice: di surga
  rationale: Padanan Indonesia yang lazim untuk bentuk tunggal οὐρανῷ sebagai ranah surgawi.
- source_word: λύσητε
  choice: kalian lepaskan
  rationale: Mempertahankan pasangan metaforis dengan “ikat” dan tidak membatasi maknanya hanya menjadi “mengizinkan” atau “membebaskan” dalam satu pengertian khusus.
- source_word: ἔσται λελυμένα
  choice: akan sudah dilepaskan
  rationale: Sejajar dengan klausa pertama dan mencerminkan konstruksi masa depan dengan partisipel pasif perfek, yakni keadaan yang pada saat itu sudah berlaku.
theological_decisions:
- issue: Daya temporal dan teologis rumusan mengikat dan melepaskan
  choice: “akan sudah diikat/dilepaskan di surga”
  alternative: “akan diikat/dilepaskan di surga”
  rationale: Konstruksi Yunani ἔσται dengan partisipel pasif perfek dapat menunjukkan keadaan mendatang yang merupakan hasil tindakan yang telah terjadi. Terjemahan utama mempertahankan kemungkinan bahwa tindakan di bumi bersesuaian dengan keadaan yang sudah ditetapkan di surga, tanpa menetapkan teori denominasi tertentu mengenai wewenang jemaat. Catatan kaki tetap mengakui terjemahan pasif masa depan sederhana yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kalian” dipilih untuk menyatakan bentuk jamak Yunani dengan jelas. Pasangan “ikat/lepaskan” dipertahankan agar metafora dan keluasan maknanya tidak dipersempit. Ungkapan “akan sudah” bersifat agak formal, tetapi dipakai untuk menyampaikan nuansa aspek konstruksi Yunani secara ringkas.
