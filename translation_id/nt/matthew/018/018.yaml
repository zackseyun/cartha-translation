review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan bentuk jamak pada ὑμῖν, cakupan tak tentu ὅσα ἐὰν, serta pasangan metaforis δήσητε/λύσητε sebagai “ikat” dan “lepaskan.” Konstruksi ἔσται + partisipel pasif perfek layak diterjemahkan dengan bentuk masa depan perfek untuk menyatakan keadaan surgawi yang telah berlaku. Namun, “akan sudah diikat/dilepaskan” kurang idiomatis dalam bahasa Indonesia baku; “akan telah diikat/dilepaskan” lebih jelas menyampaikan tindakan pasif yang telah selesai.
  naturalness: Ragam keseluruhan sesuai untuk teks Alkitab modern yang bermartabat. “Aku berkata kepada kalian” dan “apa pun” terdengar alami. Penggantian “akan sudah” dengan “akan telah” meningkatkan kelancaran tanpa mengurangi nuansa aspek.
  terminology: “Sesungguhnya,” “ikat,” “lepaskan,” “bumi,” dan “surga” tepat, konsisten, dan tidak mempersempit kemungkinan makna yuridis-metaforis dari istilah Yunani. Catatan kaki sebaiknya tidak mengatakan keadaan itu “sudah ditetapkan,” karena “ditetapkan” menambahkan penafsiran yang tidak secara eksplisit dinyatakan oleh δεδεμένα/λελυμένα.
  issues:
  - severity: medium
    issue: Ungkapan “akan sudah diikat/dilepaskan” kurang lazim dalam bahasa Indonesia baku.
    rationale: Walaupun dimaksudkan untuk menandai future perfect, susunan ini terasa janggal. “Akan telah diikat/dilepaskan” lebih idiomatis dan tetap merepresentasikan masa depan dengan hasil tindakan pasif yang sudah terjadi.
  - severity: low
    issue: Catatan kaki memakai “sudah ditetapkan di surga.”
    rationale: Kata “ditetapkan” dapat menyiratkan keputusan atau dekret, sedangkan teks secara metaforis hanya menyatakan keadaan “terikat” dan “terlepas.” Catatan perlu mempertahankan istilah yang lebih netral.
  revised_text: '“Sesungguhnya, Aku berkata kepada kalian: Apa pun yang kalian ikat di bumi akan telah diikat di surga, dan apa pun yang kalian lepaskan di bumi akan telah dilepaskan di surga.”[a]'
  revised_footnotes:
