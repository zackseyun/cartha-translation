- from: '“Sesungguhnya, Aku berkata kepada kalian: Apa pun yang kalian ikat di bumi akan sudah diikat di surga, dan apa pun yang kalian lepaskan di bumi akan sudah dilepaskan di surga.”[a]'
  to: '“Sesungguhnya, Aku berkata kepada kalian: Apa pun yang kalian ikat di bumi akan telah diikat di surga, dan apa pun yang kalian lepaskan di bumi akan telah dilepaskan di surga.”[a]'
  rationale: Revisi terbatas pada bentuk future perfect dan penjelasan catatan kaki. “Akan telah diikat/dilepaskan” menyampaikan secara lebih alami bahwa, pada waktu tindakan di bumi dipertimbangkan, keadaan pasif itu telah berlaku di surga. Istilah “ditetapkan” dihapus agar catatan kaki tidak menambahkan tafsiran teologis tentang mekanisme atau dasar otoritas tersebut.
