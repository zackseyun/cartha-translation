id: MAT.18.23
reference: Matthew 18:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: id
  text: Karena itu, Kerajaan Surga diumpamakan[a] dengan seorang raja yang hendak mengadakan perhitungan dengan para budaknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini secara harfiah berarti “disamakan” atau “dibandingkan dengan.” Frasa berikutnya secara harfiah berbunyi, “dengan seorang manusia, seorang raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hamba-hambanya” atau “pelayan-pelayannya”; kata Yunani δοῦλοι dapat menunjuk kepada orang-orang yang berstatus terikat sebagai budak di bawah kuasa tuannya.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Menyampaikan hubungan sebab-akibat atau kesimpulan dengan pengajaran sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὡμοιώθη
  choice: diumpamakan dengan
  rationale: Mempertahankan bentuk pasif aoristus dan gagasan bahwa suatu perbandingan dibuat, tanpa mengubahnya menjadi sekadar pernyataan statis 'seperti'.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk rumusan khas Matius, dengan 'Kerajaan' menunjuk pada pemerintahan atau kekuasaan Allah.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: seorang raja
  rationale: βασιλεῖ menjelaskan ἀνθρώπῳ; bahasa Indonesia secara alami meringkasnya menjadi 'seorang raja' tanpa kehilangan makna.
- source_word: ἠθέλησεν
  choice: hendak
  rationale: Mengungkapkan kehendak atau niat sang raja secara alami dan bermartabat dalam konteks naratif.
- source_word: συνᾶραι λόγον
  choice: mengadakan perhitungan
  rationale: Menyampaikan idiom pemeriksaan dan penyelesaian rekening atau kewajiban; pilihan ini juga memungkinkan perkembangan narasi utang dalam ayat-ayat berikutnya.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: dengan para budaknya
  rationale: δοῦλοι dalam konteks kekuasaan raja, utang, dan ancaman penjualan menunjukkan status terikat di bawah kepemilikan atau kuasa sang raja, bukan semata-mata pekerja upahan.
theological_decisions:
- issue: Terjemahan δοῦλος dalam konteks perumpamaan kerajaan dan utang
  choice: budak
  alternative: hamba atau pelayan
  rationale: Konteks menonjolkan status terikat dan kuasa besar raja atas mereka. 'Budak' menyatakan unsur itu dengan jelas, sedangkan alternatif yang lebih halus dicatat agar rentang makna istilah Yunani tetap terlihat.
- issue: Bentuk perbandingan Kerajaan Surga dengan seorang raja
  choice: diumpamakan dengan seorang raja
  alternative: menjadi seperti seorang raja; dapat dibandingkan dengan seorang raja
  rationale: Bentuk pasif ὡμοιώθη dipertahankan. Catatan menjelaskan ungkapan Yunani yang secara harfiah memuat unsur 'seorang manusia, yaitu raja', tanpa memaksakan bahwa kerajaan itu identik hanya dengan tokoh raja dan bukan keseluruhan kisah perumpamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Karena itu' menjaga kaitan dengan konteks sebelumnya; 'diumpamakan dengan' mempertahankan bentuk pasif; 'mengadakan perhitungan' cukup alami sekaligus mempertahankan nuansa ekonomi dan pertanggungjawaban.
