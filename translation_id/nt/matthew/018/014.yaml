  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: id
  text: Demikian juga, Bapamu yang di surga tidak menghendaki agar satu pun dari yang kecil ini binasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hilang.” Kata kerja Yunani yang dipakai dapat berarti “binasa” atau “hilang”; konteks langsung tentang domba yang tersesat mendukung nuansa yang kedua.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menghubungkan pernyataan ini dengan perumpamaan dan penerapannya pada ayat-ayat sebelumnya, sekaligus menyampaikan daya bandingnya secara wajar dalam bahasa Indonesia.
- source_word: θέλημα ἔμπροσθεν τοῦ πατρός
  choice: Bapamu ... tidak menghendaki
  rationale: Ungkapan Yunani ini menyatakan apa yang dikehendaki di hadapan atau menurut Sang Bapa. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'bukanlah kehendak di hadapan Bapamu', tanpa mengubah maksudnya.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Bapamu yang di surga
  rationale: Mempertahankan sapaan orang kedua jamak dalam bentuk Indonesia yang alami dan menyampaikan frasa lokatif Yunani tanpa menjadikannya sekadar gelar.
- source_word: ἵνα ἀπόληται
  choice: agar ... binasa
  rationale: ἀπόλλυμι dapat berarti binasa atau hilang. 'Binasa' mempertahankan bobot akibat buruk yang dinyatakan, sedangkan nuansa 'hilang' dari konteks domba yang tersesat dicatat dalam catatan kaki.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: seorang pun dari mereka yang kecil ini
  rationale: '''Seorang pun'' secara idiomatis menegaskan bahwa tidak satu orang pun dikecualikan dalam konstruksi negatif. ''Mereka yang kecil ini'' mempertahankan sebutan yang dapat merujuk lebih luas daripada anak-anak secara usia.'
theological_decisions:
- issue: Makna ἀπόληται dalam kaitannya dengan perumpamaan domba yang tersesat
  choice: binasa
  alternative: hilang
  rationale: Kata Yunani tersebut dapat menunjuk pada kebinasaan ataupun keadaan hilang. Teks utama mempertahankan bobot peringatannya dengan 'binasa', sementara catatan kaki menjaga kemungkinan makna 'hilang' yang didukung konteks terdekat.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Bentuk 'Bapamu' mengikuti sapaan Alkitabiah yang masih mudah dipahami; 'mereka yang kecil ini' sengaja tidak dipersempit menjadi anak-anak.
