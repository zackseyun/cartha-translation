    issue: Unsur refleksif dalam προσκαλεσάμενος tidak terungkap.
    rationale: Partisip ini menyatakan bahwa Yesus memanggil anak itu datang kepada diri-Nya. Tambahan “kepada-Nya” menyampaikan unsur tersebut secara eksplisit dan tetap alami.
  - severity: low
    issue: Nuansa membuat anak itu berdiri dalam ἔστησεν tidak tampak dalam “menempatkannya.”
    rationale: Dalam konteks ini ἔστησεν lazim berarti membuat atau menyuruh anak itu berdiri di tengah kelompok. “Membuatnya berdiri” mempertahankan detail tindakan tanpa menambahkan alasan atau keadaan sebelumnya.
  revised_text: Lalu Yesus memanggil seorang anak kecil kepada-Nya dan membuatnya berdiri di tengah mereka.
