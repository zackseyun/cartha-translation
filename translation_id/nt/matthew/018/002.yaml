  text: And calling a child to himself, he stood him in their midst.
translation:
  language: id
  text: Lalu Yesus memanggil seorang anak kecil kepada-Nya dan membuatnya berdiri di tengah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip aoris ini menyatakan tindakan Yesus memanggil anak itu agar datang kepada-Nya; dalam bahasa Indonesia, objek tidak langsung 'kepada-Nya' sudah tersirat secara alami oleh konteks.
- source_word: παιδίον
  choice: seorang anak kecil
  rationale: παιδίον menunjuk kepada seorang anak; 'anak kecil' mempertahankan nuansa usia muda tanpa menentukan umur atau jenis kelamin.
- source_word: ἔστησεν
  choice: menempatkannya
  rationale: Bentuk kausatif dari ἵστημι berarti membuat seseorang berdiri atau menempatkannya. 'Menempatkannya' alami dalam bahasa Indonesia dan tidak menambahkan anggapan bahwa anak itu sebelumnya duduk.
- source_word: ἐν μέσῳ αὐτῶν
  choice: di tengah-tengah mereka
  rationale: Menyampaikan lokasi anak itu di antara kelompok para murid secara jelas dan dekat dengan susunan Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama 'Yesus' dipakai sebagai subjek eksplisit karena bahasa Indonesia kurang alami jika hanya memakai 'ia' tanpa konteks ayat sebelumnya; rujukannya tidak ambigu dalam konteks Matius 18.
