  source_fidelity: Draf menyampaikan tindakan utama dengan tepat, tetapi προσκαλεσάμενος secara eksplisit berarti “memanggil kepada diri-Nya,” bukan sekadar memanggil. ἔστησεν paling langsung berarti “membuatnya berdiri/menempatkannya berdiri”; terjemahan “menempatkannya” dapat diterima secara umum, tetapi kehilangan unsur berdiri yang dipilih dalam jejak audit bahasa Inggris.
  naturalness: “Lalu Yesus memanggil seorang anak kecil kepada-Nya dan membuatnya berdiri di tengah mereka” alami dalam bahasa Indonesia modern. “Di tengah mereka” lebih idiomatis daripada pengulangan “di tengah-tengah mereka” tanpa kehilangan makna.
  terminology: “Yesus” dan “anak kecil” sesuai. Tidak ada istilah teologis khusus atau nama lain yang perlu disesuaikan.
  issues:
