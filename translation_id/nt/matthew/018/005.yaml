base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: id
  text: Dan siapa pun yang menerima seorang anak seperti ini dalam nama-Ku, menerima Aku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyambut”. Kata kerja Yunani yang dipakai dapat berarti “menerima” atau “menyambut”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “satu anak seperti ini”; teks Yunani tidak memuat kata sifat “kecil” dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: siapa pun yang
  rationale: Gabungan pronomina relatif dengan ἐάν menyatakan kondisi umum atau tak tentu. Frasa ini alami dalam bahasa Indonesia dan mempertahankan cakupan umum tersebut.
- source_word: δέξηται / δέχεται
  choice: menerima / menerima
  rationale: δέχομαι dapat berarti menerima, menyambut, atau menyetujui. Pengulangan 'menerima' mempertahankan pengulangan verba Yunani dan hubungan langsung antara menerima anak itu dan menerima Yesus.
- source_word: ἓν παιδίον τοιοῦτο
  choice: seorang anak seperti ini
  rationale: Ungkapan ini secara harfiah menunjuk kepada 'satu anak seperti ini'. Dalam bahasa Indonesia, 'seorang anak seperti ini' lebih alami, tetap mempertahankan unsur tunggal, dan tidak menambahkan sifat 'kecil' yang tidak terdapat dalam ayat ini.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Frasa ini menyatakan penerimaan yang dilakukan dengan mengacu pada nama, wewenang, atau kesetiaan kepada Yesus. 'Dalam nama-Ku' alami dalam ragam Alkitab Indonesia dan tidak mempersempit maknanya pada satu nuansa saja.
- source_word: ἐμὲ
  choice: Aku
  rationale: Pronomina objek yang mendapat penekanan ini diterjemahkan secara alami sebagai 'Aku'. Posisi pada akhir kalimat dan pengulangan verba sudah menonjolkan identifikasi tersebut.
theological_decisions:
- issue: Identifikasi representatif antara anak itu dan Yesus
  choice: Ayat ini menyatakan bahwa menerima seorang anak seperti ini dalam nama Yesus sama dengan menerima Yesus sendiri.
  alternative: Penerimaan anak itu hanya dapat dipahami sebagai tindakan menghormati Yesus.
  rationale: Peralihan objek dari 'seorang anak seperti ini' kepada 'Aku' dengan verba yang sama menyatakan identifikasi representatif yang kuat. Terjemahan mempertahankannya tanpa menambahkan implikasi sakramental atau gerejawi yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk 'nama-Ku' dan 'Aku' mengikuti kebiasaan ejaan teks Alkitab Indonesia untuk ujaran Yesus. Pengulangan 'menerima' sengaja dipertahankan untuk mencerminkan struktur dan penekanan teks Yunani.
