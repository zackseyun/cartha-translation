  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: id
  text: Namun, ia tidak mau[a]. Sebaliknya, ia pergi dan menjebloskan kawannya itu ke dalam penjara[b] sampai ia melunasi utangnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "tidak bersedia" atau "menolak"; secara harfiah: "tidak mau."'
    reason: lexical_alternative
  - marker: b
    text: Atau "memasukkannya ke dalam penjara"; kata Yunani yang dipakai lebih keras dan secara harfiah dapat berarti "melemparkan."
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: "apa yang terutang"; dapat juga diterjemahkan "jumlah yang terutang."'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, ia
  rationale: Artikel yang dipakai secara substantival menunjuk kembali kepada hamba pertama, sedangkan δέ menandai pertentangan. Pronomina 'ia' wajar dalam bahasa Indonesia.
- source_word: οὐκ ἤθελεν
  choice: tidak mau
  rationale: Ungkapan ini mempertahankan unsur kehendak dalam θέλω dan terdengar alami; 'menolak' mungkin secara kontekstual, tetapi sedikit lebih tegas.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menampilkan pertentangan kuat antara permohonan kawannya dan tindakan yang kemudian diambil.
- source_word: ἀπελθὼν
  choice: ia pergi
  rationale: Partisip aoristus dialihkan menjadi klausa berverba finit demi bahasa Indonesia yang alami, sambil mempertahankan urutan tindakan.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: menjebloskan kawannya itu ke dalam penjara
  rationale: '''Menjebloskan'' mempertahankan daya keras βάλλω dengan lebih alami daripada terjemahan harfiah ''melemparkan''; ''kawannya itu'' memperjelas rujukan αὐτόν dalam konteks perumpamaan.'
- source_word: ἕως οὗ
  choice: sampai
  rationale: Menyatakan batas waktu pemenjaraan secara tepat dan idiomatis.
- source_word: ἀποδῷ
  choice: ia melunasi
  rationale: Dalam konteks utang, ἀποδίδω berarti membayar kembali. 'Melunasi' menyampaikan penyelesaian pembayaran yang diantisipasi oleh bentuk subjungtif sesudah ἕως οὗ.
- source_word: τὸ ὀφειλόμενον
  choice: utangnya
  rationale: Partisip substantival berarti 'apa yang terutang'. 'Utangnya' ringkas dan alami dalam konteks, tanpa mengubah pokok maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menjebloskan' dipilih untuk menyampaikan kerasnya tindakan tanpa memakai ungkapan kaku 'melemparkan ke dalam penjara'. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
