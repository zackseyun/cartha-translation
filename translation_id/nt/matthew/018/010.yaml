id: MAT.18.10
reference: Matthew 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: id
  text: “Berhati-hatilah, janganlah kamu meremehkan seorang pun dari mereka yang kecil ini.[a] Sebab Aku berkata kepadamu bahwa malaikat-malaikat mereka[b] di surga senantiasa memandang wajah Bapa-Ku yang di surga.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah kamu memandang rendah salah seorang dari mereka yang kecil ini.”
    reason: lexical_alternative
  - marker: b
    text: “Malaikat-malaikat mereka” dapat menunjuk kepada malaikat yang berhubungan dengan atau mewakili mereka yang kecil ini; ayat ini sendiri tidak menetapkan secara lengkap ajaran tentang malaikat pelindung.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, kata Yunani pada kedua kemunculan frasa ini berbentuk jamak, “di surga-surga”; diterjemahkan secara idiomatis sebagai “di surga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Ingatlah, jangan meremehkan
  rationale: Ὁρᾶτε memperkenalkan peringatan yang menuntut perhatian sungguh-sungguh, sedangkan konstruksi μή dengan aoristus subjungtif menyatakan larangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya teguran teks.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: seorang pun dari mereka yang kecil ini
  rationale: Bentuk partitif berarti satu dari kelompok tersebut. 'Mereka yang kecil' mempertahankan keluasan μικροί, yang dapat menunjuk kepada anak-anak atau orang yang dianggap kecil dan rendah, tanpa membatasinya hanya kepada anak kecil.
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab, Aku berkata kepadamu
  rationale: Terjemahan langsung yang mempertahankan fungsi γάρ sebagai alasan bagi larangan sebelumnya dan formula perkataan Yesus.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: malaikat-malaikat mereka
  rationale: Genitif posesif diterjemahkan secara langsung tanpa menetapkan apakah yang dimaksud ialah malaikat pelindung pribadi atau hubungan perwakilan maupun pelayanan lain.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunani secara gramatikal jamak, 'di surga' merupakan padanan idiomatis bahasa Indonesia dalam konteks ini.
- source_word: διὰ παντὸς
  choice: senantiasa
  rationale: Idiom ini menyatakan keberlangsungan atau 'pada segala waktu'; 'senantiasa' alami, ringkas, dan sesuai dengan aspek tindakan βλέπουσι.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: memandang wajah
  rationale: Mempertahankan gambaran alkitabiah tentang akses langsung atau kehadiran di hadapan Allah, tanpa menguraikan metaforanya dalam teks utama.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Bapa-Ku yang di surga
  rationale: Mempertahankan sebutan relasional khas Yesus, 'Bapa-Ku', serta frasa atributif yang menyatakan lokasi.
theological_decisions:
- issue: Rujukan 'mereka yang kecil ini'
  choice: Memakai ungkapan luas 'mereka yang kecil ini'.
  alternative: Menerjemahkannya secara khusus sebagai 'anak-anak kecil ini'.
  rationale: Konteks Matius 18 mencakup anak dan kerendahan seperti anak, tetapi frasa Yunani tidak mengharuskan pembatasan rujukan hanya pada anak-anak. Terjemahan luas menjaga kemungkinan bahwa yang dimaksud juga para murid atau orang percaya yang dipandang kecil.
- issue: Makna 'malaikat-malaikat mereka'
  choice: Mempertahankan frasa tersebut tanpa menetapkan doktrin formal tentang malaikat pelindung individual.
  alternative: Menafsirkannya secara eksplisit sebagai malaikat pelindung yang ditugaskan kepada setiap anak atau orang percaya.
  rationale: Teks menyatakan adanya hubungan antara para malaikat itu dan mereka yang kecil, tetapi tidak menjelaskan secara tuntas sifat hubungan tersebut. Terjemahan tidak boleh menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh ayat.
- issue: Melihat wajah Bapa
  choice: Mempertahankan gambaran 'memandang wajah Bapa-Ku'.
  alternative: Menjelaskannya dalam teks sebagai 'selalu berada di hadapan Bapa-Ku' atau 'memiliki akses kepada Bapa-Ku'.
  rationale: Gambaran wajah dapat menyiratkan kehadiran dan akses langsung, tetapi terjemahan harfiah yang alami menjaga citra sumber tanpa menggantikannya dengan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Ingatlah' membawa nada peringatan, 'meremehkan' lazim tetapi tetap berbobot, dan 'senantiasa memandang wajah' mempertahankan citra sumber. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
