id: MAT.18.16
reference: Matthew 18:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: id
  text: Namun, jika ia tidak mau mendengarkan, ajaklah satu atau dua orang lagi bersamamu, supaya berdasarkan keterangan dua atau tiga orang saksi setiap perkara dapat diteguhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini menggemakan Ulangan 19:15, yang menetapkan bahwa suatu perkara harus diteguhkan berdasarkan keterangan dua atau tiga orang saksi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: mau mendengarkan
  rationale: Dalam konteks teguran, kata ini berarti mendengar dengan sikap mengindahkan, bukan sekadar menangkap bunyi. Bentuk negatifnya diterjemahkan secara alami sebagai 'tidak mau mendengarkan'.
- source_word: παράλαβε μετὰ σοῦ
  choice: ajaklah ... bersamamu
  rationale: Gabungan ini menyatakan tindakan membawa orang lain untuk menyertai pembicara. 'Ajaklah ... bersamamu' mempertahankan daya imperatif dan terdengar alami dalam bahasa Indonesia.
- source_word: ἔτι ἕνα ἢ δύο
  choice: satu atau dua orang lagi
  rationale: ἔτι menunjukkan tambahan, sedangkan konteks menuntut acuan kepada orang. 'Orang lagi' menyampaikan keduanya tanpa menentukan peran mereka lebih awal.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dari mengajak satu atau dua orang tambahan.
- source_word: ἐπὶ στόματος
  choice: berdasarkan keterangan
  rationale: Ungkapan harfiah 'di atas mulut' merupakan idiom hukum Semitis. 'Berdasarkan keterangan' menyampaikan fungsi kesaksian secara jelas dalam bahasa Indonesia modern.
- source_word: δύο μαρτύρων ἢ τριῶν
  choice: dua atau tiga orang saksi
  rationale: Menyampaikan jumlah dan fungsi hukum para penyerta sesuai gema Ulangan 19:15.
- source_word: σταθῇ
  choice: dapat diteguhkan
  rationale: Dalam konteks hukum, verba pasif ini berarti suatu perkara dibuat berdiri kukuh, ditetapkan, atau dikukuhkan. 'Diteguhkan' mempertahankan nuansa pengesahan tanpa menyempitkannya menjadi tuduhan saja.
- source_word: πᾶν ῥῆμα
  choice: setiap perkara
  rationale: Secara harfiah berarti 'setiap perkataan', tetapi dalam formula hukum yang dikutip maknanya mencakup setiap perkara yang sedang dipersoalkan.
theological_decisions:
- issue: Gema hukum Ulangan 19:15 dalam konteks disiplin komunitas
  choice: Gunakan rumusan hukum yang jelas, 'berdasarkan keterangan dua atau tiga orang saksi', dan pertahankan cakupan umum 'setiap perkara'.
  alternative: 'Terjemahan lebih harfiah: ''atas mulut dua atau tiga orang saksi setiap perkataan dapat berdiri.'''
  rationale: Pilihan ini mempertahankan fungsi para saksi dalam peneguhan perkara dan gema hukum Taurat, tetapi tidak membatasi πᾶν ῥῆμα hanya pada 'tuduhan' atau menyiratkan kesimpulan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menjaga kontras; 'ajaklah' memberi perintah yang langsung tetapi wajar; istilah hukum disampaikan dengan jelas tanpa mempertahankan idiom Yunani-Semit yang terasa janggal. Penanda catatan kaki [a] tercantum dalam teks utama.
source_grounding:
  english_pob_role: consult_only
