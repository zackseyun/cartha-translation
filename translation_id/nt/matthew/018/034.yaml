  source_fidelity: 'Teks Indonesia setia pada unsur-unsur utama Yunani: ὀργισθείς diterjemahkan “menjadi marah”; κύριος dalam konteks perumpamaan tepat sebagai “tuannya”; παρέδωκεν sebagai “menyerahkan”; βασανισταῖς dengan kekuatan makna yang memadai sebagai “para penyiksa”; serta ἕως οὗ ἀποδῷ sebagai “sampai dia melunasi.” “Seluruh utangnya” secara wajar menyampaikan πᾶν τὸ ὀφειλόμενον dalam konteks naratif utang, tanpa menambah klaim teologis.'
