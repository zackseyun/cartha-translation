id: MAT.18.34
reference: Matthew 18:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: id
  text: Maka tuannya menjadi marah dan menyerahkan dia kepada para penyiksa sampai dia melunasi seluruh utangnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Tuhan". Kata Yunani kyrios di sini menunjuk kepada tuan hamba itu dalam perumpamaan, sehingga "tuan" dipakai dalam teks utama.
    reason: alternative_reading
  - marker: b
    text: Atau "orang-orang yang menyiksa"; dalam arti yang lebih lemah, "para penjaga penjara". Istilah Yunani ini menunjuk kepada mereka yang menimpakan siksaan, bukan sekadar penjaga biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: menjadi marah
  rationale: Partisip aoristus ini menerangkan keadaan yang menyertai dan memotivasi tindakan utama. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan nuansa timbulnya kemarahan.
- source_word: κύριος
  choice: tuan
  rationale: Dalam alur perumpamaan, kata ini menunjuk kepada atasan atau pemilik hamba tersebut. 'Tuan' mempertahankan hubungan sosial dalam cerita tanpa menjadikannya gelar kristologis secara eksplisit.
- source_word: παρέδωκεν
  choice: menyerahkan
  rationale: Kata ini menyatakan penyerahan seseorang ke dalam kekuasaan pihak lain, dengan nuansa hukuman atau tindakan hukum yang sesuai dengan konteks.
- source_word: βασανισταῖς
  choice: para penyiksa
  rationale: Istilah Yunani ini menunjuk kepada orang-orang yang menyiksa atau menimpakan siksaan, bukan sekadar penjaga penjara biasa. 'Para penyiksa' mempertahankan kerasnya istilah sumber.
- source_word: ἕως οὗ
  choice: sampai
  rationale: Konstruksi temporal ini secara langsung dan alami diterjemahkan 'sampai'.
- source_word: ἀποδῷ
  choice: dia melunasi
  rationale: Dalam konteks jumlah yang terutang, ἀποδίδωμι berarti membayar kembali. Bentuk subjungtif sesudah ἕως οὗ menyatakan titik akhir yang diharapkan; bahasa Indonesia tidak perlu menandai modus itu secara khusus.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: seluruh utangnya
  rationale: Ungkapan ini berarti seluruh jumlah yang masih terutang. 'Seluruh utangnya' ringkas, alami, dan jelas dalam konteks perumpamaan tentang utang.
theological_decisions:
- issue: Apakah κύριος harus diterjemahkan dengan gelar ilahi 'Tuhan'
  choice: tuan
  alternative: Tuhan
  rationale: Referen langsungnya adalah tuan dari hamba dalam dunia cerita. 'Tuan' menjaga makna naratif tanpa meniadakan hubungan teologis perumpamaan dengan ayat berikutnya.
- issue: Kerasnya makna βασανισταῖς dalam konteks hukuman perumpamaan
  choice: para penyiksa
  alternative: para penjaga penjara
  rationale: Pilihan ini mempertahankan daya leksikal dan kerasnya peringatan dalam perumpamaan, tanpa menarik kesimpulan tambahan tentang sifat atau lamanya penghakiman akhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur dibuat alami bagi pembaca umum, sementara kerasnya gambaran hukuman dan ketegangan teologis teks tetap dipertahankan.
