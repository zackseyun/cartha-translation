  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: id
  text: 'Dan jika ia menemukannya[a], sesungguhnya Aku berkata kepada kamu: ia lebih bersukacita atas domba itu daripada atas kesembilan puluh sembilan yang tidak tersesat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “jika terjadi bahwa ia menemukannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang tidak menyimpang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung sederhana yang meneruskan perumpamaan dari ayat sebelumnya.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: jika ternyata ia menemukannya
  rationale: Ungkapan ini menyatakan kemungkinan terjadinya penemuan. “Ternyata” mempertahankan nuansa bahwa penemuan itu sungguh terjadi tanpa memberi kesan kebetulan acak yang dapat muncul dari kata “kebetulan”.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: sesungguhnya Aku berkata kepada kalian
  rationale: “Sesungguhnya” menyampaikan penegasan khidmat ἀμὴν, sedangkan “kalian” memperlihatkan bahwa ὑμῖν berbentuk jamak.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: ia lebih bersukacita atas domba itu
  rationale: “Bersukacita” mempertahankan kekuatan χαίρει. “Domba itu” memperjelas acuan kata ganti αὐτῷ secara alami dalam bahasa Indonesia berdasarkan konteks langsung.
- source_word: μᾶλλον ἢ
  choice: lebih ... daripada
  rationale: Menyampaikan perbandingan langsung dalam teks Yunani tanpa mengubahnya menjadi pilihan yang meniadakan sukacita atas yang lain.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: kesembilan puluh sembilan
  rationale: Kata “domba” tetap tersirat sebagaimana dalam teks Yunani dan dapat dipahami dengan jelas dari konteks.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: yang tidak tersesat
  rationale: 'Menyatakan keadaan yang dihasilkan oleh bentuk partisip perfek: mereka tidak menyimpang atau berkeliaran meninggalkan jalan yang semestinya.'
theological_decisions:
- issue: Kekuatan perbandingan sukacita gembala
  choice: Menyatakan bahwa ia lebih bersukacita atas domba yang ditemukan daripada atas kesembilan puluh sembilan yang tidak tersesat.
  alternative: Melunakkan perbandingan agar tidak terkesan bahwa yang satu lebih diutamakan, atau menafsirkannya sebagai bukti bahwa kesembilan puluh sembilan kurang berharga.
  rationale: μᾶλλον ἢ merupakan perbandingan yang nyata. Terjemahan mempertahankan ketegangan perkataan itu tanpa menyimpulkan bahwa gembala tidak memedulikan kesembilan puluh sembilan atau bahwa mereka lebih rendah nilainya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “kalian” dipakai untuk menampakkan bentuk jamak Yunani; huruf kapital pada “Aku” mengikuti acuan kepada Yesus. Tanda titik dua membantu memperlihatkan bahwa klausa sesudah formula khidmat merupakan isi perkataan-Nya.
