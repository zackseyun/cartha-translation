  verdict: revise
  source_fidelity: Klausa bersyarat ἐὰν γένηται εὑρεῖν αὐτό menyatakan kemungkinan/kejadian kontingen. “Jika ternyata ia menemukannya” memberi nuansa retrospektif atau kejutan setelah fakta yang tidak diperlukan oleh Yunani. Bentuk yang lebih langsung mempertahankan syarat tersebut. Perbandingan μᾶλλον ἢ, acuan kepada domba yang ditemukan, dan keterangan tentang kesembilan puluh sembilan pada dasarnya telah diterjemahkan dengan setia.
  naturalness: “Dan jika ia menemukannya” adalah bahasa Indonesia baku dan alami dalam konteks perumpamaan. “Sesungguhnya Aku berkata kepada kamu” mempertahankan register khidmat formula ucapan Yesus tanpa penggunaan “kalian”, yang dapat terdengar lebih percakapan dalam konteks ini.
  terminology: “Bersukacita”, “domba”, dan “tersesat” sesuai dengan citra serta register teks. “Domba itu” merupakan penjelasan acuan αὐτό yang aman karena nomina πρόβατον telah disebut dalam konteks langsung. Catatan alternatif untuk πεπλανημένοις sebaiknya memakai “menyimpang” daripada “berkeliaran menjauh”, sebab yang terakhir menambahkan gambaran gerak yang tidak perlu.
  issues:
  - severity: medium
    issue: Nuansa “ternyata” dalam klausa bersyarat
    rationale: “Ternyata” lazimnya menandai hasil yang kemudian diketahui atau mengandung unsur kejutan. ἐὰν γένηται εὑρεῖν hanya menyatakan, secara idiomatis, “jika terjadi bahwa ia menemukannya”; tidak perlu menyiratkan kejutan.
  - severity: low
    issue: Alternatif catatan kaki b terlalu ekspansif
    rationale: “Berkeliaran menjauh” menambahkan gambaran berkeliaran. “Menyimpang” adalah alternatif yang lebih dekat bagi keadaan tidak tersesat/tidak menyimpang dalam konteks domba.
