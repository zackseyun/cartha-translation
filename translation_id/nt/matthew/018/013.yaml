revisions:
- from: 'Dan jika ternyata ia menemukannya[a], sesungguhnya Aku berkata kepada kalian: ia lebih bersukacita atas domba itu daripada atas kesembilan puluh sembilan yang tidak tersesat[b].'
  to: 'Dan jika ia menemukannya[a], sesungguhnya Aku berkata kepada kamu: ia lebih bersukacita atas domba itu daripada atas kesembilan puluh sembilan yang tidak tersesat[b].'
