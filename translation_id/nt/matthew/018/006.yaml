  terminology: '"Orang-orang kecil ini yang percaya kepada-Ku" mempertahankan keluasan rujukan, tanpa memaksakan pembacaan bahwa mereka hanya anak-anak. "Tersandung," "batu kilangan," "lehernya," dan "laut lepas" tepat dan sesuai register.'
