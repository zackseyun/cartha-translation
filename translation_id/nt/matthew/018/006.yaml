id: MAT.18.6
reference: Matthew 18:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: id
  text: Namun, siapa pun yang menyebabkan salah seorang dari orang-orang kecil ini yang percaya kepada-Ku tersandung[a], lebih baik baginya jika sebuah batu kilangan yang diputar oleh keledai[b] digantungkan pada lehernya dan ia ditenggelamkan di laut lepas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyebabkan ... berbuat dosa.” Kata kerja Yunani ini dapat berarti menyebabkan seseorang tersandung, jatuh, atau berbuat dosa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “batu kilangan keledai,” yaitu batu kilangan besar yang diputar oleh seekor keledai.
    reason: cultural_note
  - marker: c
    text: Atau “di kedalaman laut.” Ungkapan Yunani secara khusus menunjuk pada laut terbuka atau laut lepas.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: menyebabkan ... tersandung
  rationale: Mempertahankan metafora Yunani serta cakupan makna yang dapat mencakup menyebabkan berdosa, jatuh, atau meninggalkan iman; catatan kaki menjelaskan alternatifnya.
- source_word: μικρῶν τούτων
  choice: mereka yang kecil ini
  rationale: Tidak membatasi rujukan hanya kepada anak-anak; ungkapan ini dapat menunjuk kepada para pengikut Yesus yang rendah, lemah, atau rentan, sementara konteks anak tetap terasa.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: yang percaya kepada-Ku
  rationale: Padanan langsung dan wajar untuk frasa partisipial yang mengidentifikasi mereka sebagai orang-orang yang percaya kepada Yesus.
- source_word: συμφέρει αὐτῷ
  choice: lebih baik baginya
  rationale: Mengungkapkan gagasan keuntungan komparatif secara idiomatis dalam konteks peringatan yang keras.
- source_word: μύλος ὀνικὸς
  choice: sebuah batu kilangan yang diputar oleh keledai
  rationale: Menjelaskan bahwa yang dimaksud adalah batu kilangan besar yang digerakkan keledai, bukan batu kilangan tangan, sekaligus mempertahankan unsur ὀνικός.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: pada lehernya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk benda yang digantungkan pada leher seseorang.
- source_word: καταποντισθῇ
  choice: ia ditenggelamkan
  rationale: Menyampaikan bentuk pasif dan akibat tindakan berupa penenggelaman tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: di laut lepas
  rationale: πέλαγος menunjuk pada bentangan laut terbuka atau laut dalam yang jauh dari pantai; 'laut lepas' merupakan padanan ringkas dan tepat.
theological_decisions:
- issue: Cakupan ungkapan 'mereka yang kecil ini'
  choice: Dibiarkan luas sebagai orang-orang kecil atau rentan yang percaya kepada Yesus.
  alternative: Membatasinya menjadi 'anak-anak kecil ini yang percaya kepada-Ku'.
  rationale: Konteks langsung memang menghadirkan seorang anak, tetapi keterangan 'yang percaya kepada-Ku' memungkinkan rujukan yang lebih luas kepada para murid yang rendah atau rentan. Terjemahan mempertahankan ketegangan ini.
- issue: Cakupan σκανδαλίσῃ
  choice: Diterjemahkan secara metaforis sebagai 'menyebabkan ... tersandung'.
  alternative: Menafsirkannya secara lebih sempit sebagai 'menyebabkan ... berbuat dosa'.
  rationale: Kata Yunani dapat mencakup dosa, kejatuhan rohani, atau kemurtadan. Metafora yang dipertahankan menghindari penyempitan makna secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Susunan kalimat dibuat alami tanpa mengurangi kerasnya peringatan. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
