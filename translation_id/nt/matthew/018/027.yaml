  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: id
  text: Lalu tuan budak itu, tergerak oleh belas kasihan, melepaskannya dan menghapus utangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih khusus: pinjamannya, yaitu sesuatu yang telah dipinjamkan kepadanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: tergerak oleh belas kasihan
  rationale: Ungkapan ini menyampaikan rasa iba yang mendalam dan tetap alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ melanjutkan alur cerita, bukan menyatakan pertentangan yang kuat.
- source_word: κύριος
  choice: tuan
  rationale: Dalam perumpamaan ini kata tersebut menunjuk kepada seorang tuan manusia yang memiliki wewenang atas budaknya; 'tuan' alami dan tidak memberi kesan bahwa ini gelar ilahi langsung.
- source_word: δοῦλου
  choice: budak
  rationale: Status keterikatan dan hubungan kuasa dalam perumpamaan ini penting, sehingga 'budak' lebih konkret daripada 'pelayan'.
- source_word: ἀπέλυσεν αὐτόν
  choice: melepaskannya
  rationale: Pilihan ini mempertahankan arti membiarkan orang itu pergi tanpa memastikan bahwa ia dimerdekakan dari status perbudakannya.
- source_word: τὸ δάνειον
  choice: utangnya
  rationale: Dalam konteks kewajiban yang dihapus, 'utang' merupakan ungkapan Indonesia yang paling jelas dan alami; kekhususan makna 'pinjaman' dicatat dalam catatan kaki.
- source_word: ἀφῆκεν αὐτῷ
  choice: menghapus utangnya
  rationale: Dengan objek berupa kewajiban keuangan, ἀφίημι berarti membebaskan orang itu dari tuntutan pembayaran atau membatalkan utangnya.
theological_decisions:
- issue: Kemungkinan κύριος dibaca sebagai gelar ilahi
  choice: tuan
  alternative: Tuhan
  rationale: Acuan langsung dalam narasi adalah tuan manusia dalam perumpamaan. Terjemahan tidak menyamakan tokoh itu secara eksplisit dengan Allah, tetapi juga tidak meniadakan fungsi analogis perumpamaan tersebut.
- issue: Makna pelepasan dalam ἀπέλυσεν
  choice: melepaskannya
  alternative: memerdekakannya
  rationale: Teks menyatakan bahwa ia dilepaskan dalam situasi itu, tetapi tidak secara tegas mengatakan bahwa statusnya sebagai budak dihapuskan.
- issue: Hubungan antara pengampunan dan pembatalan kewajiban keuangan
  choice: menghapus utangnya
  alternative: mengampuni utangnya
  rationale: Pilihan ini mempertahankan gambaran konkret tentang pembatalan kewajiban finansial tanpa menghilangkan gema tema pengampunan dalam konteks perumpamaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat menjaga gerak naratif serta hubungan hierarkis yang nyata antara tuan dan budak, tanpa menjadikan κύριος gelar ilahi atau menafsirkan pelepasan sebagai pemerdekaan permanen.
