id: MAT.18.33
reference: Matthew 18:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: id
  text: Bukankah seharusnya engkau juga berbelas kasihan kepada sesama hambamu[a], sama seperti aku telah berbelas kasihan kepadamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesama budakmu.” Kata Yunani σύνδουλος menunjuk kepada seseorang yang menjadi hamba di bawah tuan yang sama.
    reason: Menjelaskan status bersama dan nuansa keterikatan dalam istilah Yunani tanpa membuat teks utama terasa kaku.
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Bukankah seharusnya
  rationale: Bentuk pertanyaan retoris ini menyatakan kewajiban moral sekaligus teguran. Ungkapan tersebut alami dalam bahasa Indonesia dan mempertahankan daya tegurnya.
- source_word: καὶ
  choice: juga
  rationale: Kata ini menghubungkan tindakan yang seharusnya dilakukan hamba itu dengan belas kasihan yang sebelumnya ia terima.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: berbelas kasihan / telah berbelas kasihan
  rationale: Pilihan yang sama untuk kedua bentuk ἐλεάω mempertahankan pengulangan leksikal dan kesejajaran etis dalam ayat ini.
- source_word: τὸν σύνδουλόν σου
  choice: sesama hambamu
  rationale: Σύνδουλος menunjuk kepada orang yang berstatus hamba di bawah tuan yang sama. 'Sesama hambamu' terdengar alami dan bermartabat dalam bahasa Indonesia, sementara nuansa keterikatan status dijelaskan dalam catatan kaki.
- source_word: ὡς κἀγὼ
  choice: sama seperti aku
  rationale: Ungkapan ini mempertahankan perbandingan langsung antara belas kasihan sang tuan dan kewajiban hamba tersebut.
- source_word: σὲ
  choice: engkau / kepadamu
  rationale: Pronomina 'engkau' sesuai dengan teguran langsung dalam latar perumpamaan dan menjaga register yang dignified tanpa menjadi terlalu sehari-hari.
theological_decisions:
- issue: Penerjemahan istilah keluarga δοῦλος dalam σύνδουλος
  choice: sesama hambamu
  alternative: sesama budakmu
  rationale: '''Hamba'' merupakan istilah Indonesia yang alami dalam konteks seorang raja atau tuan, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih tegas menandai status terikat. Terjemahan utama tidak menghapus gagasan bahwa keduanya berada di bawah tuan yang sama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas namun wajar. Pengulangan 'berbelas kasihan' dipertahankan untuk mencerminkan pengulangan verba Yunani, dan 'engkau' dipakai sesuai register naratif-perumpamaan.
