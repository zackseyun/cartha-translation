  source_fidelity: Teks Indonesia secara akurat menyampaikan Οὕτως καὶ sebagai “Demikian juga,” subjek “Bapa-Ku yang surgawi,” tindakan bersifat anaforis dalam ποιήσει ὑμῖν, serta syarat negatif dan kewajiban distributifnya. “Dari hati kalian” mempertahankan jamak καρδιῶν ὑμῶν dan tidak mempersempit atau memperluas cakupan peringatan.
