  terminology: “Bapa-Ku yang surgawi,” “mengampuni,” dan “saudaranya” sesuai dengan register Alkitab modern dan makna sumber. Catatan kaki secara tepat menjelaskan maskulin tunggal ἀδελφῷ tanpa mengubah rujukan representatifnya dalam teks utama.
