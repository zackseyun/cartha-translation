id: MAT.18.35
reference: Matthew 18:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: id
  text: Demikian juga Bapa-Ku yang surgawi akan melakukan hal yang sama terhadap kalian jika kalian masing-masing tidak mengampuni saudaranya[a] dari hati kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudaranya” berbentuk maskulin tunggal; dalam konteks ini kata itu berfungsi secara representatif untuk sesama murid atau sesama orang percaya.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Demikian juga
  rationale: Menunjukkan bahwa perkataan ini menerapkan tindakan sang tuan dalam perumpamaan sebelumnya kepada para pendengar, sambil mempertahankan daya perbandingan dan kesimpulannya.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Bapa-Ku yang surgawi
  rationale: Mempertahankan unsur kepunyaan dalam μου dan bentuk adjektival οὐράνιος, sekaligus memakai ungkapan Indonesia yang ringkas dan bermartabat.
- source_word: ποιήσει ὑμῖν
  choice: akan melakukan hal yang sama terhadap kalian
  rationale: Secara alami merujuk kembali kepada tindakan sang tuan dalam perumpamaan. Frasa ini tidak menjabarkan lebih jauh bentuk penghakiman yang hanya tersirat oleh konteks.
- source_word: ἐὰν μὴ
  choice: jika ... tidak
  rationale: Mempertahankan bentuk syarat negatif secara jelas; alternatif alami lainnya ialah 'kecuali jika'.
- source_word: ἀφῆτε
  choice: mengampuni
  rationale: Dalam konteks kesalahan antarpribadi dan gambaran utang, ἀφίημι berarti mengampuni, bukan sekadar melepaskan.
- source_word: ἕκαστος
  choice: kalian masing-masing
  rationale: Mengungkapkan kewajiban distributif dari bentuk tunggal ἕκαστος kepada seluruh kelompok yang disapa dengan bentuk jamak.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: saudaranya
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal serta hubungan distributif dengan 'masing-masing'. Catatan kaki menjelaskan bentuk maskulin Yunani dan fungsi representatifnya dalam konteks.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: dari hati kalian
  rationale: Mengikuti gambaran sumber secara dekat dan mempertahankan sapaan jamak, dengan penekanan bahwa pengampunan harus berasal dari batin, bukan hanya secara lahiriah.
theological_decisions:
- issue: Cakupan dan bobot peringatan
  choice: Peringatan langsung bahwa Bapa akan bertindak terhadap para pendengar sebagaimana sang tuan dalam perumpamaan bertindak terhadap hambanya
  alternative: Memperlunak menjadi 'akan memperlakukan kalian dengan cara serupa' atau memperluasnya menjadi penjelasan khusus tentang penghukuman kekal maupun hilangnya upah
  rationale: Teks Yunani menyampaikan peringatan bersyarat yang serius, tetapi ayat ini sendiri tidak menetapkan kategori teologis sistematis dari penghakiman tersebut. Terjemahan mempertahankan ketegangan itu.
- issue: Bahasa gender dalam ἀδελφῷ
  choice: saudaranya, dengan catatan mengenai bentuk maskulin dan fungsi representatif
  alternative: saudara laki-lakinya; saudara atau saudarinya; sesama orang percaya
  rationale: Kata Yunani berbentuk maskulin tunggal, tetapi dalam konteksnya menunjuk secara representatif kepada sesama murid atau orang percaya. 'Saudaranya' merupakan padanan Indonesia yang alami tanpa menambahkan pasangan kata yang tidak tertulis dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan antara ὑμῖν/ὑμῶν yang jamak dan kewajiban distributif ἕκαστος tetap jelas. Nada dipertahankan lugas, khidmat, dan tegas.
