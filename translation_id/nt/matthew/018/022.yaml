  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: id
  text: Yesus berkata kepadanya, “Aku tidak berkata kepadamu sampai tujuh kali, melainkan sampai tujuh puluh tujuh kali.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tujuh puluh kali tujuh.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan dengan bentuk naratif Indonesia yang alami; bahasa Indonesia tidak mewajibkan pembedaan kala kini dan lampau pada verba.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Mempertahankan pronomina objek tak langsung sebagaimana teks Yunani, tanpa menggantinya dengan nama Petrus dari konteks.
- source_word: Οὐ λέγω σοι
  choice: Aku berkata kepadamu, bukan
  rationale: Susunan ini alami dalam bahasa Indonesia untuk menyangkal batas angka yang disebut sesudahnya, sekaligus tetap dekat dengan bentuk Yunani.
- source_word: ἕως
  choice: sampai
  rationale: Dalam konteks penghitungan, 'sampai' menyatakan batas jumlah secara jelas dan wajar.
- source_word: ἑπτάκις
  choice: tujuh kali
  rationale: Adverbia ini menyatakan frekuensi, sehingga 'tujuh kali' merupakan padanan modern yang langsung.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: '''Melainkan'' secara alami menghubungkan koreksi setelah penyangkalan ''bukan''.'
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: tujuh puluh tujuh kali
  rationale: Frasa Yunani dapat dipahami sebagai 'tujuh puluh tujuh kali' atau 'tujuh puluh kali tujuh'; bacaan pertama dipilih sebagai pembacaan langsung yang masuk akal, sementara ambiguitas dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Ungkapan angka yang ambigu dalam ajaran Yesus tentang pengampunan
  choice: tujuh puluh tujuh kali
  alternative: tujuh puluh kali tujuh
  rationale: Sintaksis ἑβδομηκοντάκις ἑπτά memungkinkan kedua pemahaman tersebut. Teks utama memilih 'tujuh puluh tujuh kali', tetapi tidak menjadikan angka itu sebagai tafsiran eksplisit tentang batas pengampunan; alternatif tradisional dicatat untuk menjaga ketegangan dan transparansi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Aku' dan 'kamu' dipakai secara alami dalam dialog Yesus dengan seorang murid; bentuk 'kepadanya' mempertahankan pronomina sumber. Penempatan penanda catatan setelah frasa ambigu memperjelas bahwa catatan berkaitan dengan angka tersebut.
