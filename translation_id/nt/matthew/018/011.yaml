  text: Sebab Anak Manusia[a] datang untuk menyelamatkan yang hilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Kodeks Sinaitikus dan Vatikanus dari abad ke-4, maupun dalam terjemahan-terjemahan Koptik awal. Namun, ayat ini terdapat dalam Kodeks Beza dari abad ke-5, tradisi mayoritas Bizantium, dan Vulgata Latin. Kemungkinan ayat ini ditambahkan oleh para penyalin kemudian untuk menyelaraskannya dengan Lukas 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: ἀπολωλός
  choice: yang hilang
  rationale: Partisipel perfekt aktif netral tunggal ini dipakai secara substantif. Ungkapan “yang hilang” mempertahankan bentuk yang ringkas dan cukup luas, tanpa membatasi acuannya secara eksplisit pada satu orang atau benda.
- source_word: σῶσαι
  choice: untuk menyelamatkan
  rationale: Infinitif aoristus aktif dari σῴζω menyatakan tujuan kedatangan Anak Manusia; “menyelamatkan” merupakan padanan Indonesia yang alami dan tepat dalam konteks keselamatan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi gelar Yunani ini, dengan kapitalisasi untuk menunjukkan penggunaannya sebagai gelar diri Yesus.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini menghubungkan ayat dengan alasan bagi pernyataan sebelumnya; “Sebab” mempertahankan fungsi penjelasnya.
