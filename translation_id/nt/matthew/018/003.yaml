  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: id
  text: Lalu Yesus berkata, “Sesungguhnya Aku berkata kepadamu, jika kamu tidak berbalik[a] dan menjadi seperti anak-anak, kamu sama sekali tidak akan masuk ke dalam Kerajaan Surga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dibalikkan” atau “berpaling”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Menandai pernyataan yang sungguh-sungguh dan berwibawa; bentuk ini alami dalam ragam Alkitab bahasa Indonesia dan lebih jelas daripada transliterasi 'Amin' di tengah tuturan.
- source_word: στραφῆτε
  choice: berbalik
  rationale: Bentuk ini dapat dipahami secara intransitif maupun pasif, yakni 'berbalik' atau 'dibalikkan'. 'Berbalik' menyampaikan perubahan arah yang tegas tanpa menentukan pelakunya secara berlebihan.
- source_word: γένησθε
  choice: menjadi
  rationale: Secara langsung menyatakan perubahan keadaan dan mempertahankan koordinasinya dengan 'berbalik'.
- source_word: ὡς τὰ παιδία
  choice: seperti anak-anak
  rationale: Dalam bahasa Indonesia, bentuk tanpa penentu paling alami untuk perbandingan generik. Terjemahan ini tidak menambahkan sifat tertentu seperti kepolosan atau kerendahan hati yang tidak dinyatakan dalam ayat ini.
- source_word: οὐ μὴ εἰσέλθητε
  choice: kamu sama sekali tidak akan masuk
  rationale: Ungkapan 'sama sekali tidak akan' mempertahankan kekuatan negasi emfatis οὐ μή dalam bahasa Indonesia modern.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan baku dan alami bagi ungkapan khas Matius ini; tidak memaksakan bentuk harfiah 'kerajaan langit-langit'.
theological_decisions:
- issue: Makna bahasa yang menyerupai pertobatan dalam στραφῆτε
  choice: berbalik
  alternative: dibalikkan; bertobat
  rationale: '''Berbalik'' mempertahankan seruan kepada perubahan arah yang tegas sekaligus tidak mengimpor istilah teknis teologis atau menentukan secara mutlak apakah bentuk Yunani harus dipahami aktif atau pasif.'
- issue: Sifat seperti anak yang dimaksud dalam παιδία
  choice: seperti anak-anak
  alternative: seperti anak kecil; seperti anak-anak itu
  rationale: Ayat ini menyatakan perbandingan dengan anak-anak, tetapi tidak secara tersurat menentukan sifat seperti kepolosan atau kerendahan hati. Terjemahan mempertahankan keterbukaan penafsiran itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Subjek 'Yesus' dinyatakan agar rujukan pronomina jelas dalam kutipan ayat tunggal. Tanda titik dua sesudah formula ujaran membantu keterbacaan. Kapitalisasi 'Aku' mengikuti kebiasaan terjemahan Alkitab Indonesia saat merujuk kepada Yesus, sedangkan 'Kerajaan Surga' diperlakukan sebagai istilah khas Matius.
