  naturalness: Ragamnya baku, modern, dan khidmat. Namun, titik dua setelah "kepadamu" dan huruf kapital pada "Jika" kurang wajar karena klausa pengandaian itu meneruskan satu kalimat ujaran. Koma dan huruf kecil lebih lancar dalam ejaan Indonesia modern.
  terminology: '"Berbalik," "menjadi," "anak-anak," dan "Kerajaan Surga" tepat dan tidak menambahkan penafsiran mengenai sifat kekanak-kanakan yang dimaksud. Catatan kaki sebaiknya membatasi diri pada alternatif yang benar-benar ditopang oleh bentuk pasif Yunani; "bertobat" lebih lazim menerjemahkan μετανοέω dan dapat mengarahkan pembaca kepada istilah teologis yang tidak dipakai dalam teks ini.'
