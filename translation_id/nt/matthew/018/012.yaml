  source_fidelity: 'Terjemahan secara akurat mencerminkan struktur dan makna Yunani: pertanyaan pembuka kepada pendengar jamak, keadaan memiliki seratus domba, satu yang tersesat, pertanyaan retoris futurum, sembilan puluh sembilan di pegunungan, serta tindakan pergi mencari domba itu. Nuansa partisipel kini pada τὸ πλανώμενον dipertahankan dengan “yang sedang tersesat.”'
