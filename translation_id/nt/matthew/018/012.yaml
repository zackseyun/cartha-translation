id: MAT.18.12
reference: Matthew 18:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: id
  text: Bagaimana pendapat kalian? Jika seorang laki-laki mempunyai seratus ekor domba dan seekor di antaranya tersesat,[a] bukankah ia akan meninggalkan yang sembilan puluh sembilan ekor di pegunungan[b] lalu pergi mencari domba yang sedang tersesat itu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkeliaran” atau “menyimpang.” Kata kerja Yunani ini juga dapat berarti “disesatkan” dalam konteks tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “di perbukitan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang sedang tersesat”; secara tradisional sering diterjemahkan “yang hilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Bagaimana pendapat kalian?
  rationale: Ungkapan ini secara idiomatis meminta penilaian para pendengar; bentuk jamak 'kalian' mempertahankan ὑμῖν dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Jika seorang laki-laki mempunyai
  rationale: Konstruksi γίνομαι dengan datif di sini menyatakan kepemilikan atau keadaan. 'Seorang laki-laki' mempertahankan bentuk maskulin tunggal sumber tanpa menyiratkan tokoh tertentu.
- source_word: ἑκατὸν πρόβατα
  choice: seratus ekor domba
  rationale: Kata penggolong 'ekor' merupakan bentuk alami dalam bahasa Indonesia untuk menghitung hewan.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: seekor di antaranya tersesat
  rationale: '''Tersesat'' mempertahankan kemungkinan nuansa menyimpang atau berkeliaran tanpa menentukan apakah domba itu disesatkan oleh pihak lain.'
- source_word: οὐχὶ ἀφήσει
  choice: bukankah ia akan meninggalkan
  rationale: Pertanyaan dengan οὐχί mengharapkan jawaban ya; 'bukankah' menyampaikan daya retoris itu, sedangkan 'akan meninggalkan' mencerminkan bentuk futurum.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: yang sembilan puluh sembilan ekor
  rationale: Terjemahan numerik langsung dengan elipsis 'domba' yang wajar dan jelas dalam bahasa Indonesia.
- source_word: ἐπὶ τὰ ὄρη
  choice: di pegunungan
  rationale: Mempertahankan gambaran topografis jamak ὄρη secara alami; 'di perbukitan' tetap merupakan kemungkinan kontekstual.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: lalu pergi mencari
  rationale: Partisip πορευθείς diungkapkan sebagai tindakan berurutan yang alami, sementara ζητεῖ diterjemahkan langsung dengan 'mencari'.
- source_word: τὸ πλανώμενον
  choice: domba yang sedang tersesat itu
  rationale: Bentuk partisipel kini dipertahankan dengan 'sedang tersesat', bukan digeser menjadi 'yang hilang'; penyebutan 'domba' memperjelas acuannya.
theological_decisions:
- issue: Bentuk maskulin generik ἀνθρώπῳ
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Pilihan ini mempertahankan bentuk maskulin tunggal Yunani sekaligus tetap alami dalam bahasa Indonesia, tanpa menjadikannya nama atau identitas khusus.
- issue: Nuansa πλανάω dalam metafora domba
  choice: tersesat / yang sedang tersesat
  alternative: berkeliaran; menyimpang; disesatkan; yang hilang
  rationale: Pilihan ini menjaga gema leksikal dalam kedua kemunculan dan tidak menetapkan agensi, kesalahan moral, atau keadaan hilang secara lebih tegas daripada teks sumber.
- issue: Lokasi sembilan puluh sembilan domba
  choice: di pegunungan
  alternative: di perbukitan
  rationale: ὄρη secara harfiah menunjuk gunung atau daerah pegunungan; terjemahan ini menjaga citra konkret tanpa menambahkan penjelasan tentang keamanan kawanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-retoris yang bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menunjukkan bahwa ὑμῖν berbentuk jamak; 'bukankah' mempertahankan pertanyaan yang mengharapkan persetujuan. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
