  verdict: revise
  source_fidelity: Draf umumnya mengikuti urutan dan makna Yunani dengan baik. Namun, «disuruh keluar» terutama menyatakan bahwa orang banyak diperintahkan pergi, sedangkan ἐξεβλήθη menyatakan bahwa mereka telah dikeluarkan/diusir. Bentuk «dikeluarkan» mempertahankan pasif tanpa menambahkan kesan kekerasan yang tidak perlu. Pengulangan «anak itu» juga menghilangkan penandaan perempuan dalam κοράσιον pada penyebutan kedua.
  naturalness: Kalimat revisi tetap baku dan lancar dalam bahasa Indonesia modern. «Setelah orang banyak itu dikeluarkan» dan «gadis itu bangkit» jelas dalam narasi dan menghindari pengulangan yang janggal.
  terminology: «Gadis» secara wajar menerjemahkan κοράσιον dalam konteks ini. «Bangkit» merupakan terjemahan idiomatis yang sah untuk ἠγέρθη; catatan kaki dengan tepat memberi alternatif pasif «dibangkitkan» tanpa menetapkan pelaku atau penafsiran teologis tertentu.
  issues:
