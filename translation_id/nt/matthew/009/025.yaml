source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: id
  text: Namun, setelah orang banyak itu dikeluarkan, Yesus masuk, memegang tangan gadis itu, lalu gadis itu bangkit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibangkitkan.” Kata kerja Yunani ini berbentuk pasif, tetapi dapat diterjemahkan secara idiomatis sebagai “bangkit.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, setelah
  rationale: ὅτε memperkenalkan hubungan waktu, sedangkan δέ menandai peralihan narasi yang ringan. Dalam konteks tindakan yang telah selesai sebelum Yesus masuk, 'Namun, setelah' terdengar alami dan mempertahankan urutannya.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: orang banyak itu disuruh keluar
  rationale: Bentuk pasif ἐξεβλήθη dipertahankan tanpa memakai ungkapan yang menyiratkan kekerasan berlebihan; ὁ ὄχλος diterjemahkan secara wajar sebagai 'orang banyak itu'.
- source_word: εἰσελθὼν
  choice: Yesus masuk
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama. Subjek tersirat dibuat eksplisit sebagai 'Yesus' agar kalimat Indonesia jelas dan alami berdasarkan konteks langsung.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: memegang tangan anak perempuan itu
  rationale: κρατέω dengan genitif berarti memegang atau menggenggam. 'Memegang tangan' merupakan ungkapan Indonesia yang alami dan tidak menambahkan rincian tentang kuatnya pegangan.
- source_word: τὸ κοράσιον
  choice: anak itu
  rationale: κοράσιον menunjuk kepada seorang anak perempuan. Penyebutan pertama dalam klausa diterjemahkan 'anak perempuan itu', lalu diringkas menjadi 'anak itu' untuk menghindari pengulangan yang kaku.
- source_word: ἠγέρθη
  choice: bangkit
  rationale: Bentuk aoris pasif ἐγείρω dapat menyatakan bahwa anak itu bangun/bangkit atau dibangkitkan. 'Bangkit' alami dalam konteks ini dan tidak menyebutkan pelaku secara eksplisit.
theological_decisions:
- issue: Makna dan bentuk ἠγέρθη dalam konteks pemulihan hidup
  choice: bangkit
  alternative: dibangkitkan
  rationale: Bentuk Yunani adalah pasif dan dapat diterjemahkan 'dibangkitkan', tetapi dalam pemakaian naratif dapat diungkapkan secara idiomatis sebagai 'bangkit'. Catatan kaki mempertahankan kemungkinan pasif dan ketegangan mengenai pelaku tanpa memaksakan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan bermartabat. 'Disuruh keluar' menghindari kesan eksorsisme atau kekerasan dari terjemahan harfiah 'dilemparkan ke luar'. Penanda catatan kaki ditempatkan tepat setelah bagian yang dijelaskannya.
