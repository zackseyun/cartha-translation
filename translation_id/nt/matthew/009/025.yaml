    issue: «disuruh keluar» tidak sepenuhnya mencerminkan tindakan pasif ἐξεβλήθη.
    rationale: Ungkapan itu berfokus pada perintah untuk keluar, sementara Yunani menyatakan bahwa orang banyak itu sudah dikeluarkan. «Dikeluarkan» lebih dekat dengan bentuk dan hasil tindakan sumber.
  - severity: low
    issue: «anak itu» pada akhir ayat tidak mempertahankan gender κοράσιον.
    rationale: Walaupun konteksnya jelas, «gadis itu» mempertahankan rujukan kepada anak perempuan dan menggemakan nomina Yunani yang diulang.
  revised_text: Namun, setelah orang banyak itu dikeluarkan, Yesus masuk, memegang tangan gadis itu, lalu gadis itu bangkit.[a]
