id: MAT.9.35
reference: Matthew 9:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: id
  text: Yesus berkeliling ke semua kota dan desa. Ia mengajar di sinagoge-sinagoge mereka, memberitakan kabar baik Kerajaan[a], dan menyembuhkan setiap penyakit dan setiap kelemahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Injil Kerajaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “setiap penyakit dan setiap gangguan kesehatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: berkeliling
  rationale: Bentuk imperfek menggambarkan kegiatan perjalanan yang berlangsung atau berulang; “berkeliling” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: τὰς πόλεις πάσας καὶ τὰς κώμας
  choice: ke semua kota dan desa
  rationale: Mempertahankan cakupan menyeluruh serta perbedaan antara pusat permukiman yang lebih besar dan desa yang lebih kecil.
- source_word: διδάσκων
  choice: mengajar
  rationale: Padanan langsung dan wajar yang mempertahankan tindakan yang menyertai perjalanan Yesus.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: di rumah-rumah ibadat mereka
  rationale: “Rumah ibadat” merupakan istilah Indonesia yang lazim untuk sinagoge dalam konteks Yahudi, sementara “mereka” mempertahankan αὐτῶν.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Menyampaikan unsur pengumuman terbuka dalam κηρύσσω tanpa membatasinya pada pengertian khotbah gerejawi.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: kabar baik tentang Kerajaan
  rationale: “Kabar baik” transparan bagi pembaca modern. “Tentang Kerajaan” merupakan ungkapan Indonesia yang alami tanpa menambahkan “Allah,” yang tidak dinyatakan secara eksplisit dalam frasa Yunani ini.
- source_word: θεραπεύων
  choice: menyembuhkan
  rationale: Padanan yang alami dan tepat dalam konteks pelayanan penyembuhan Yesus.
- source_word: πᾶσαν νόσον
  choice: setiap penyakit
  rationale: Menerjemahkan cakupan distributif πᾶσαν dan makna umum νόσος secara jelas.
- source_word: πᾶσαν μαλακίαν
  choice: setiap kelemahan
  rationale: Mempertahankan perbedaan leksikal dari νόσος dan rentang makna μαλακία sebagai kelemahan atau keadaan sakit; alternatif “gangguan kesehatan” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna relasi genitif dalam τὸ εὐαγγέλιον τῆς βασιλείας
  choice: kabar baik tentang Kerajaan
  alternative: Injil Kerajaan
  rationale: Genitif dapat dinyatakan secara alami sebagai isi berita tanpa menjelaskan lebih jauh sifat Kerajaan atau menambahkan “Allah.” Alternatif tradisional dipertahankan dalam catatan kaki.
- issue: Cakupan πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: setiap penyakit serta setiap kelemahan
  alternative: segala penyakit dan segala gangguan kesehatan
  rationale: Pengulangan “setiap” mempertahankan penekanan komprehensif dari kedua kemunculan πᾶσαν, sementara dua istilah yang berbeda tetap dibedakan tanpa mempersempit klaim teologis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami; hubungan tindakan tetap jelas melalui subjek “Ia”. Kapitalisasi “Kerajaan” menandai pemakaian khusus dalam pewartaan Yesus tanpa menambahkan keterangan yang tidak terdapat dalam teks sumber.
