  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: id
  text: Yesus, yang mengetahui[a] pikiran mereka, berkata, “Mengapa kalian memikirkan hal-hal jahat dalam hati kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyadari pikiran mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mengetahui
  rationale: Partisip ini menyatakan bahwa Yesus mengetahui pertimbangan batin mereka. “Mengetahui” ringkas, alami, dan tidak memperluas pernyataan teks.
- source_word: ἐνθυμήσεις
  choice: pikiran
  rationale: Kata ini menunjuk pada pemikiran atau pertimbangan batin. “Pikiran” merupakan padanan modern yang alami dan sesuai dengan konteks.
- source_word: Ἱνατί
  choice: Mengapa
  rationale: Kata tanya ini meminta alasan atau motif; “mengapa” adalah padanan langsung dan wajar.
- source_word: ἐνθυμεῖσθε
  choice: kalian memikirkan
  rationale: Bentuk verba kini menunjuk pada kegiatan berpikir atau mempertimbangkan dalam batin. “Kalian memikirkan” mempertahankan hubungan leksikal dengan “pikiran” sebelumnya.
- source_word: πονηρὰ
  choice: hal-hal jahat
  rationale: Adjektiva netral jamak ini dipakai secara substantival. “Hal-hal jahat” mempertahankan bentuk jamaknya tanpa menentukan secara sempit apakah yang dimaksud adalah pikiran, niat, atau pertimbangan.
- source_word: καρδίαις
  choice: hati
  rationale: Dalam konteks ini, “hati” menunjuk pada batin sebagai tempat pikiran dan niat. Pilihan ini mempertahankan metafora sumber dan gaung teologisnya.
theological_decisions:
- issue: Pengetahuan Yesus tentang pikiran yang tidak diucapkan
  choice: Yesus mengetahui pikiran mereka
  alternative: Yesus menyadari pikiran mereka
  rationale: Teks menyatakan bahwa Yesus mengetahui pertimbangan batin mereka. Terjemahan ini mempertahankan klaim tersebut tanpa menjadikannya uraian doktrinal yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” menandai bahwa sapaan Yesus berbentuk jamak; “dalam hati kalian” mempertahankan ungkapan sumber sambil tetap alami dalam bahasa Indonesia.
