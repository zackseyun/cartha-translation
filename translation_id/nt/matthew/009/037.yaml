  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: id
  text: Kemudian Ia berkata kepada murid-murid-Nya, “Tuaian memang banyak, tetapi pekerja sedikit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam narasi secara ringkas dan alami.
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Indonesia tidak menandai kala pada verba; bentuk ini alami dalam narasi dan tidak memaksakan pembedaan antara present historis dan bentuk lampau.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Mempertahankan bentuk jamak serta kata ganti kepunyaan αὐτοῦ yang dinyatakan secara eksplisit.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: memang ... tetapi
  rationale: Menyampaikan kontras μέν...δέ dengan ungkapan Indonesia yang alami dan tetap tegas.
- source_word: θερισμός
  choice: tuaian
  rationale: Mempertahankan metafora pertanian dan cocok dengan gambaran para pekerja yang menuai.
- source_word: πολύς
  choice: banyak
  rationale: Padanan langsung dan wajar yang menyatakan besarnya tuaian tanpa menambahkan tafsiran.
- source_word: ἐργάται
  choice: pekerja
  rationale: Istilah modern, jelas, dan mencakup orang-orang yang bekerja dalam konteks tuaian.
- source_word: ὀλίγοι
  choice: sedikit
  rationale: Padanan langsung yang mempertahankan kontras dengan banyaknya tuaian.
theological_decisions:
- issue: Daya metaforis perkataan tentang tuaian
  choice: Metafora pertanian dipertahankan tanpa menjelaskan rujukan misionernya di dalam teks.
  alternative: Menjelaskan bahwa tuaian adalah orang-orang yang siap menerima pelayanan Yesus.
  rationale: Ayat ini menyajikan metafora tanpa menguraikan rujukannya; penjelasan tambahan akan mempersempit makna dan memasukkan tafsiran ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kapitalisasi pada “Ia” dan akhiran “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. “Tuaian” dipilih karena mempertahankan gambaran pertanian secara jelas dan selaras dengan “pekerja”.
