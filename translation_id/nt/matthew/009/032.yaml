base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: id
  text: Ketika mereka sedang keluar, lihatlah, orang-orang membawa seorang laki-laki bisu[a] yang dirasuki setan[b] kepada Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tuli”. Kata Yunani yang dipakai dapat berarti “bisu” atau “tuli”, bergantung pada konteks. Pernyataan pada ayat berikutnya bahwa orang itu berbicara mendukung terjemahan “bisu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berada di bawah kuasa setan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Sementara mereka sedang keluar
  rationale: Konstruksi genitif absolut menyatakan waktu dan sekaligus peralihan adegan; bentuk ini alami dalam bahasa Indonesia tanpa menerjemahkan δέ secara berlebihan.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan kejelasan naratif ἰδού.
- source_word: προσήνεγκαν αὐτῷ
  choice: orang-orang membawa kepada Yesus
  rationale: Subjek jamak tak tentu dibuat eksplisit secara wajar, sedangkan rujukan pronomina αὐτῷ diperjelas sebagai Yesus sesuai konteks agar tidak rancu dalam bahasa Indonesia.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Dalam narasi ini kata tersebut menunjuk kepada seorang individu laki-laki; pilihan ini jelas dan alami.
- source_word: κωφὸν
  choice: bisu
  rationale: κωφός dapat berarti tuli atau bisu. Ayat berikutnya menyoroti bahwa orang itu kemudian berbicara, sehingga 'bisu' paling sesuai dengan konteks, sementara kemungkinan 'tuli' dipertahankan dalam catatan kaki.
- source_word: δαιμονιζόμενον
  choice: yang dirasuki setan
  rationale: Ungkapan ini lazim, jelas, dan menyampaikan keadaan yang dinyatakan oleh δαιμονίζομαι tanpa menambahkan rincian tentang cara atau tingkat penguasaan roh jahat.
theological_decisions:
- issue: Bahasa untuk penderitaan akibat roh jahat
  choice: yang dirasuki setan
  alternative: yang berada di bawah kuasa setan
  rationale: Teks menyatakan penderitaan demoniak secara langsung tetapi tidak menjelaskan mekanismenya. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan spekulasi demonologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Lihatlah' mempertahankan penanda perhatian dalam teks sumber; 'orang-orang' menyatakan subjek jamak tak tentu secara alami. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkannya.
