id: MAT.9.20
reference: Matthew 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: id
  text: Dan lihatlah, seorang perempuan yang sudah dua belas tahun menderita pendarahan mendekati Yesus dari belakang dan menyentuh jumbai[a][b] jubah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumbai,” “tepi,” atau “kelim.” Kata Yunani ini dapat menunjuk pada jumbai atau bagian tepi pakaian, mungkin termasuk jumbai yang dikenakan orang Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Lihat Bilangan 15:38 dan Ulangan 22:12 mengenai latar belakang jumbai pada pakaian dalam hukum Israel.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: Mempertahankan penanda wacana sekaligus daya penarik perhatian dari ἰδού dalam ungkapan Indonesia yang alami dan tetap bermartabat.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Menyatakan acuan tak tentu secara wajar tanpa menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: αἱμορροοῦσα
  choice: menderita pendarahan
  rationale: Partisipel ini menunjukkan keadaan perdarahan yang terus berlangsung; ungkapan tersebut alami dalam bahasa Indonesia dan tidak menyiratkan kejadian akut saja.
- source_word: δώδεκα ἔτη
  choice: sudah dua belas tahun
  rationale: Menyampaikan lamanya keadaan secara idiomatis dalam bahasa Indonesia.
- source_word: προσελθοῦσα ὄπισθεν
  choice: mendekati Yesus dari belakang
  rationale: Mengungkapkan gerakan mendekat dan arah datangnya perempuan itu. Nama Yesus dieksplisitkan demi kejelasan acuan dalam bahasa Indonesia.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Sesuai dengan arti kontekstual bentuk tengah ἅπτω dan tidak melebih-lebihkan kontak sebagai memegang erat.
- source_word: τοῦ κρασπέδου
  choice: jumbai
  rationale: κράσπεδον dapat menunjuk pada jumbai, rumbai, atau tepi pakaian. 'Jumbai' mempertahankan kemungkinan kaitan dengan jumbai pakaian Yahudi tanpa menjadikannya pasti.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: jubah-Nya
  rationale: ἱμάτιον menunjuk pada pakaian luar; 'jubah' merupakan padanan Indonesia yang jelas dan lazim dalam konteks ini, sedangkan akhiran hormat -Nya merujuk kepada Yesus.
theological_decisions:
- issue: Kemungkinan makna Yahudi dari κράσπεδον sebagai jumbai pada tepi pakaian
  choice: Menggunakan 'jumbai' dalam teks utama sambil menjelaskan rentang maknanya dalam catatan kaki
  alternative: Menggunakan 'tepi' atau 'kelim' untuk tidak menonjolkan kemungkinan jumbai ritual
  rationale: Kata Yunani memungkinkan arti jumbai maupun bagian tepi pakaian. Pilihan ini mempertahankan latar budaya yang mungkin dimaksud, tetapi catatan kaki menegaskan bahwa istilah tersebut tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang hidup dan bermartabat. 'Dan lihatlah' mempertahankan seruan perhatian dalam teks Yunani. Susunan penanda catatan [a][b] ditempatkan langsung sesudah kata yang diterangkan.
