  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: id
  text: Namun, tidak seorang pun menambalkan secarik kain yang belum susut[a] pada pakaian tua, sebab tambalan itu akan merobek bagian dari pakaian tersebut, dan robekannya menjadi lebih parah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain yang belum melalui proses fulling.” Kata Yunani ini menggambarkan kain yang belum selesai diolah; kain itu masih dapat menyusut dan dengan demikian menarik atau merobek pakaian tua tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Namun, tidak seorang pun
  rationale: οὐδεὶς menyatakan subjek negatif universal, sedangkan δὲ menandai peralihan dengan kontras ringan terhadap konteks sebelumnya.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: menambalkan secarik kain
  rationale: Secara harfiah verba itu berarti mengenakan atau menaruh, tetapi dalam konteks perbaikan pakaian, 'menambalkan' menyampaikan tindakan yang dimaksud secara wajar; ἐπίβλημα adalah bahan tambalan.
- source_word: ῥάκους ἀγνάφου
  choice: kain yang belum susut[a]
  rationale: ἄγναφος menunjuk pada kain yang belum melalui proses pengolahan akhir; 'belum susut' menjelaskan akibat praktis yang penting bagi perumpamaan tanpa menghilangkan alternatif teknisnya.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: pada pakaian tua
  rationale: ἱμάτιον dapat menunjuk pakaian atau pakaian luar; padanan umum 'pakaian' mempertahankan keluasan maknanya, dan παλαιός diterjemahkan 'tua'.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: akan tertarik lepas dari pakaian tersebut
  rationale: Dalam konteks ini αἴρει menggambarkan tambalan yang terangkat atau tertarik menjauh dari pakaian. Bentuk pasif idiomatis ini menjelaskan pemisahan akibat penyusutan kain tanpa menambahkan pelaku.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: tambalan itu
  rationale: Ungkapan harfiahnya berarti 'pengisi/yang mengisi', dan dalam konteks ini merujuk kembali pada bahan tambalan.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: sehingga robekannya menjadi lebih parah
  rationale: καί di sini menghubungkan akibat lanjutan; χεῖρον adalah bentuk komparatif dan σχίσμα berarti robekan. Susunan ini alami dalam bahasa Indonesia serta mempertahankan gagasan bahwa kerusakan memburuk.
