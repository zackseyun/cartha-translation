source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: id
  text: 'Sebab manakah yang lebih mudah: mengatakan, “Dosa-dosamu diampuni”[a], atau mengatakan, “Bangunlah dan berjalanlah”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dosa-dosamu telah diampuni.” Bentuk kini pasif dalam bahasa Yunani dapat dipahami sebagai keadaan yang merupakan hasil suatu tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Sebab, manakah yang lebih mudah
  rationale: τί bersama bentuk komparatif εὐκοπώτερον meminta pilihan antara dua hal, sehingga “manakah yang lebih mudah” alami dalam bahasa Indonesia. γάρ diterjemahkan “Sebab” untuk mempertahankan hubungan penjelas dengan ayat sebelumnya.
- source_word: εἰπεῖν
  choice: mengatakan
  rationale: Infinitif ini menunjuk pada tindakan berkata secara biasa. Bentuk yang sama dipakai dalam kedua klausa demi kejelasan dan kesejajaran.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Dosa-dosamu diampuni
  rationale: Bentuk kini pasif dengan “dosa-dosa” sebagai subjek paling langsung diterjemahkan sebagai keadaan bahwa dosa-dosa itu diampuni. Rumusan ini tidak memaksakan penentuan waktu yang lebih khusus.
- source_word: ἁμαρτίαι
  choice: dosa-dosa
  rationale: Bentuk jamak dipertahankan secara wajar tanpa memperluasnya menjadi metafora utang.
- source_word: σου
  choice: -mu
  rationale: Genitif orang kedua tunggal dinyatakan dengan enklitik kepunyaan Indonesia “-mu”.
- source_word: Ἔγειρε
  choice: Bangunlah
  rationale: Dalam konteks penyembuhan, imperatif ini merupakan perintah agar orang tersebut bangkit secara fisik; “Bangunlah” alami dan jelas.
- source_word: καὶ περιπάτει
  choice: dan berjalanlah
  rationale: Imperatif kini περιπάτει menyuruh orang itu berjalan setelah bangun. “Berjalanlah” menyampaikan tindakan tersebut secara alami tanpa penambahan tafsiran.
theological_decisions:
- issue: Waktu dan nuansa pernyataan pengampunan oleh Yesus
  choice: Dosa-dosamu diampuni
  alternative: Dosa-dosamu telah diampuni
  rationale: Bentuk kini pasif Yunani dapat menyatakan keadaan yang sedang berlaku atau keadaan sebagai hasil tindakan. Terjemahan utama mempertahankan rumusan pasif yang sederhana, sedangkan alternatif dicatat tanpa menetapkan nuansa waktu secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan pertanyaan yang jelas dan bernada hormat. Bentuk jamak “dosa-dosamu” serta kesejajaran “mengatakan ... atau mengatakan ...” dipertahankan untuk mencerminkan struktur Yunani.
