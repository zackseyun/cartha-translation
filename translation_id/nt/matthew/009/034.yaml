id: MAT.9.34
reference: Matthew 9:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: id
  text: Namun, orang-orang Farisi terus berkata, “Dengan kuasa penguasa setan-setan[a], dia mengusir setan-setan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemimpin setan-setan.”'
    reason: Alternatif leksikal bagi ἄρχων; 'penguasa' menonjolkan wewenang, sedangkan 'pemimpin' menonjolkan kedudukan sebagai kepala.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan tanggapan positif orang banyak dalam konteks sebelumnya, dengan penghubung yang wajar dalam bahasa Indonesia modern.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami untuk kelompok Yahudi tersebut; bentuk jamak dinyatakan secara alami dalam bahasa Indonesia.
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek menunjukkan ujaran yang sedang berlangsung atau berulang, bukan sekadar satu pernyataan sesaat.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Dengan kuasa penguasa
  rationale: ἐν dengan datif berfungsi instrumental di sini. Ungkapan 'dengan kuasa' menjelaskan bahwa tuduhannya menyangkut sumber kuasa yang dipakai untuk mengusir setan-setan.
- source_word: ἄρχοντι
  choice: penguasa
  rationale: Padanan langsung dan wajar bagi sosok yang memiliki wewenang; 'pemimpin' tetap mungkin dan dicatat sebagai alternatif.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: setan-setan
  rationale: Menerjemahkan δαιμόνια secara konsisten sebagai makhluk-makhluk jahat adikodrati dan mempertahankan bentuk jamaknya.
- source_word: ἐκβάλλει
  choice: mengusir
  rationale: Padanan Indonesia yang alami dan mapan dalam konteks pengusiran setan.
theological_decisions:
- issue: Sumber kuasa yang dituduhkan kepada Yesus
  choice: Dengan kuasa penguasa setan-setan
  alternative: Oleh penguasa setan-setan
  rationale: Terjemahan ini mempertahankan tuduhan bahwa pengusiran itu dilakukan melalui kuasa atau perantaraan kepala setan-setan, tanpa menyatakan bahwa tuduhan tersebut benar.
- issue: Penerjemahan δαιμόνια
  choice: setan-setan
  alternative: roh-roh jahat
  rationale: Istilah 'setan-setan' secara langsung menyatakan makhluk adikodrati yang dimaksud δαιμόνια dan membedakannya dari istilah Yunani yang secara harfiah berarti 'roh-roh'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kata ganti 'dia' tidak dikapitalisasi karena kapitalisasi kata ganti ilahi bukan ciri gramatikal bahasa sumber dan dalam ayat ini muncul di dalam tuduhan para penentang.
