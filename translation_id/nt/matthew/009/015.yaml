id: MAT.9.15
reference: Matthew 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Para pengiring mempelai laki-laki[a] tidak mungkin berkabung selama mempelai laki-laki itu masih bersama mereka, bukan? Namun, waktunya akan tiba ketika mempelai laki-laki itu diambil dari mereka[b], dan pada waktu itulah mereka akan berpuasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak ruang pengantin,” sebuah ungkapan bagi para sahabat atau pengiring mempelai laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “disingkirkan dari mereka.” Bentuk pasifnya menyiratkan lebih dari sekadar kepergian biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: para pengiring mempelai laki-laki
  rationale: Ungkapan harfiah ‘anak-anak ruang pengantin’ merupakan idiom bagi orang-orang yang menyertai mempelai laki-laki dalam perayaan pernikahan. Pilihan ini menyampaikan peran sosialnya secara jelas tanpa mempertahankan idiom Semitis yang akan terasa kabur dalam bahasa Indonesia.
- source_word: πενθεῖν
  choice: berkabung
  rationale: Kata ini menunjuk pada berkabung atau berdukacita dan membentuk kontras yang kuat dengan suasana pesta pernikahan serta tindakan berpuasa.
- source_word: ἐφ’ ὅσον
  choice: selama
  rationale: Ungkapan temporal ini secara alami menyatakan jangka waktu keberadaan mempelai bersama para pengiringnya.
- source_word: νυμφίος
  choice: mempelai laki-laki
  rationale: Istilah ini lazim, jelas, dan mempertahankan citra metaforis pernikahan dalam teks.
- source_word: ἀπαρθῇ
  choice: diambil
  rationale: Bentuk pasifnya menyiratkan bahwa mempelai bukan sekadar pergi atas kehendaknya sendiri. ‘Diambil’ mempertahankan kemungkinan nuansa pemindahan paksa tanpa menjelaskan implikasinya secara berlebihan.
- source_word: νηστεύσουσιν
  choice: mereka akan berpuasa
  rationale: Terjemahan langsung dan alami untuk bentuk futur yang menyatakan tindakan berpuasa.
- source_word: Μὴ δύνανται ... ;
  choice: tidak mungkin ..., bukan?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. Bentuk pertanyaan berekor ‘bukan?’ mempertahankan daya retorisnya dalam bahasa Indonesia.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Namun, waktunya akan tiba
  rationale: Secara harfiah ‘hari-hari akan datang’; ungkapan Indonesia ini lebih alami dan tetap menyampaikan tibanya masa yang dimaksud, sedangkan ‘Namun’ membawa kontras δέ.
theological_decisions:
- issue: Makna kristologis potensial dari gambaran mempelai laki-laki
  choice: Mempertahankan ‘mempelai laki-laki’ sebagai metafora tanpa secara eksplisit mengidentifikasinya sebagai gelar mesianik bagi Yesus.
  alternative: Memperluas terjemahan untuk menyatakan bahwa Yesus adalah mempelai laki-laki mesianik.
  rationale: Ayat ini membiarkan pendengar menyimpulkan rujukan metaforis tersebut. Terjemahan tidak seharusnya menambahkan penjelasan teologis yang tidak dinyatakan secara eksplisit.
- issue: Nuansa pasif ἀπαρθῇ
  choice: Menerjemahkan ‘diambil dari mereka’ untuk mempertahankan kesan bahwa perpisahan itu dikenakan kepada mempelai.
  alternative: Menerjemahkan secara netral sebagai ‘pergi meninggalkan mereka’.
  rationale: Bentuk pasif Yunani menyiratkan lebih dari keberangkatan biasa dan dapat membayangkan kematian Yesus, tetapi terjemahan tidak menjadikan bayangan itu sebagai tafsir eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. ‘Para pengiring mempelai laki-laki’ menjernihkan idiom budaya sumber, sedangkan ‘diambil’ mempertahankan ambiguitas dan ketegangan teologis teks.
