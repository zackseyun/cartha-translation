source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: id
  text: Kemudian murid-murid Yohanes datang kepada Yesus dan berkata, “Mengapa kami dan orang-orang Farisi sering berpuasa,[a] tetapi murid-murid-Mu tidak berpuasa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak berpuasa” atau “berpuasa berkali-kali”; kata Yunani πολλά bersama “berpuasa” menunjukkan praktik yang kerap dilakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang menghubungkan peristiwa ini dengan rangkaian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: προσέρχονται αὐτῷ
  choice: datang kepada Yesus
  rationale: Mengungkapkan gerak mendekat secara wajar; nama Yesus dipakai untuk memperjelas rujukan pronomina dalam ayat yang berdiri sendiri.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: murid-murid Yohanes
  rationale: Bentuk genitif diterjemahkan secara alami sebagai hubungan antara Yohanes dan para muridnya.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel yang menyertai verba utama diungkapkan dengan konstruksi koordinatif yang alami dalam bahasa Indonesia.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan langsung dan idiomatis untuk pertanyaan tentang alasan.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: kami dan orang-orang Farisi
  rationale: Mempertahankan penekanan pada kelompok penanya serta kelompok pembanding; 'kami' tepat karena Yesus bukan bagian dari kelompok penutur.
- source_word: νηστεύομεν
  choice: berpuasa
  rationale: Istilah baku Indonesia untuk praktik tidak makan sebagai tindakan keagamaan.
- source_word: πολλά
  choice: sering
  rationale: Bersama verba 'berpuasa', bentuk ini berfungsi adverbial dan paling wajar menunjukkan frekuensi, sambil mencatat kemungkinan harfiahnya dalam catatan kaki.
- source_word: οἱ δὲ μαθηταί σου
  choice: tetapi murid-murid-Mu
  rationale: δέ menyatakan kontras; 'tetapi' mempertahankan pertentangan dalam pertanyaan. Huruf kapital pada pronomina mengikuti gaya penghormatan Indonesia untuk sapaan kepada Yesus.
- source_word: οὐ νηστεύουσιν
  choice: tidak berpuasa
  rationale: Kala kini dalam konteks ini menunjuk pada kebiasaan umum, bukan hanya tindakan yang sedang berlangsung.
theological_decisions:
- issue: Sifat keberatan mengenai puasa
  choice: Pertanyaan diterjemahkan sebagai perbandingan kebiasaan berpuasa antara kelompok-kelompok tersebut.
  alternative: Menjadikannya tuduhan eksplisit bahwa murid-murid Yesus melalaikan kewajiban, atau membatasinya pada satu kesempatan puasa tertentu.
  rationale: Bentuk kala kini dan πολλά mendukung pola kebiasaan. Terjemahan mempertahankan ketegangan pertanyaan tanpa menambahkan penilaian doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mempertahankan alur serta kontras teks Yunani tanpa terasa kaku. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
