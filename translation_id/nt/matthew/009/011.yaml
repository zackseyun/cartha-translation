id: MAT.9.11
reference: Matthew 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: id
  text: Ketika orang-orang Farisi melihat hal itu[a], mereka berkata kepada murid-murid-Nya, “Mengapa gurumu makan bersama para pemungut pajak dan orang-orang berdosa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Ketika melihat, orang-orang Farisi berkata kepada murid-murid-Nya....” Bahasa Yunani tidak menyebutkan objek dari kata “melihat”; konteksnya menunjuk pada suasana perjamuan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Ketika ... melihat hal itu
  rationale: Partisip aoris dari ὁράω dipahami secara temporal sesuai alur narasi. Objeknya tidak dinyatakan dalam bahasa Yunani; “hal itu” ditambahkan secara wajar dalam bahasa Indonesia untuk menunjuk pada suasana perjamuan dalam konteks.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Bentuk ini merupakan sebutan baku dan alami dalam bahasa Indonesia bagi kelompok tersebut.
- source_word: ἔλεγον
  choice: mereka berkata
  rationale: Imperfek Yunani memiliki aspek belum selesai dan dapat berarti mereka sedang atau mulai berkata. Dalam narasi Indonesia, “berkata” paling alami tanpa menegaskan pengulangan yang tidak pasti.
- source_word: μαθηταῖς
  choice: murid-murid
  rationale: Padanan baku yang mempertahankan relasi guru-murid dalam narasi Injil.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang langsung, alami, dan tepat.
- source_word: τελωνῶν
  choice: para pemungut pajak
  rationale: Padanan modern yang jelas bagi petugas atau pengusaha pungutan pajak yang distigmatisasi secara sosial pada masa itu.
- source_word: ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: Padanan langsung yang mempertahankan muatan moral sekaligus penyebutan suatu kelompok sosial dalam konteks.
- source_word: ἐσθίει
  choice: makan
  rationale: Menyampaikan arti dasar verba kini dalam pertanyaan langsung tanpa menambahkan formalitas.
- source_word: ὁ διδάσκαλος ὑμῶν
  choice: gurumu
  rationale: “Guru” adalah arti transparan διδάσκαλος. Sufiks -mu secara alami merujuk kepada para murid sebagai kelompok dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah objek dari tindakan “melihat” perlu dibuat eksplisit
  choice: Menambahkan “hal itu” dengan catatan kaki
  alternative: “Ketika melihatnya” atau bentuk yang membiarkan objek tetap implisit
  rationale: Bahasa Yunani tidak menyatakan objek ἰδόντες, tetapi konteks menunjuk pada perjamuan. Bahasa Indonesia lebih alami dengan objek eksplisit; catatan kaki menjaga kesadaran bahwa unsur tersebut tersirat, bukan tertulis.
- issue: Aspek imperfek ἔλεγον
  choice: “mereka berkata”
  alternative: “mereka sedang berkata” atau “mereka terus berkata”
  rationale: Imperfek mempertahankan kemungkinan aspek duratif atau inseptif, tetapi konteks tidak mewajibkan tindakan berulang. Bentuk naratif sederhana menghindari penegasan berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan dibuat alami bagi pembaca umum; “gurumu” mempertahankan sapaan kepada para murid secara kolektif. Kapitalisasi “-Nya” mengikuti konvensi umum teks Alkitab bahasa Indonesia.
