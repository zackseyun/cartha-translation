id: MAT.9.13
reference: Matthew 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: id
  text: 'Namun, pergilah dan pelajarilah apa artinya ini: “Yang Kukehendaki adalah belas kasihan, bukan kurban.”[a] Sebab, Aku datang bukan untuk memanggil orang benar,[b] melainkan orang berdosa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Hosea 6:6.
    reason: cross_reference
  - marker: b
    text: Mungkin juga yang dimaksud ialah “orang yang menganggap dirinya benar”; teks Yunani hanya mengatakan “orang benar”.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: pergilah
  rationale: Partisip aoris ini dipakai secara idiomatis bersama imperatif berikutnya; bentuk perintah alami dalam bahasa Indonesia mempertahankan daya tegurannya.
- source_word: μάθετε
  choice: pelajarilah
  rationale: Imperatif ini menyerukan agar para pendengar mempelajari dan memahami makna kutipan, bukan sekadar mendengarnya.
- source_word: τί ἐστιν
  choice: apa artinya ini
  rationale: Ungkapan idiomatis ini memperkenalkan makna kutipan; terjemahan ini alami tanpa mengubah maksudnya.
- source_word: Ἔλεος
  choice: belas kasihan
  rationale: Padanan Indonesia yang umum dan jelas untuk tindakan penuh kemurahan terhadap orang lain, serta tetap membawa gema etis dari Hosea 6:6.
- source_word: θέλω
  choice: Yang Kukehendaki adalah
  rationale: Menyampaikan kehendak ilahi dengan register yang bermartabat dan memberi tekanan alami pada belas kasihan.
- source_word: θυσίαν
  choice: kurban
  rationale: Padanan baku bagi persembahan ritual dalam konteks Kitab Suci; bentuk tunggal dipertahankan.
- source_word: ἦλθον
  choice: Aku datang
  rationale: Aoris menyatakan kedatangan dan misi Yesus; bentuk lampau eksplisit tidak diperlukan karena bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: καλέσαι
  choice: untuk memanggil
  rationale: Mempertahankan keluasan makna panggilan atau undangan tanpa mempersempit jenis respons yang dimaksud.
- source_word: δικαίους
  choice: orang benar
  rationale: Adjektiva substantival diterjemahkan secara alami sambil mempertahankan kategori yang dinyatakan teks Yunani.
- source_word: ἁμαρτωλούς
  choice: orang berdosa
  rationale: Padanan langsung dan lazim yang mempertahankan kontras tajam dengan orang benar.
theological_decisions:
- issue: Daya kutipan Hosea 6:6
  choice: Pertahankan kontras, “belas kasihan, bukan kurban,” sebagaimana bunyi kutipan.
  alternative: Memperluasnya menjadi penolakan mutlak terhadap semua kurban, atau melembutkannya menjadi sekadar pilihan situasional.
  rationale: Teks menyatakan prioritas profetis yang tajam, tetapi tidak dengan sendirinya menjelaskan seluruh teologi tentang kurban.
- issue: Rujukan 'orang benar'
  choice: Terjemahkan secara langsung sebagai 'orang benar'.
  alternative: orang yang menganggap dirinya benar
  rationale: Konteks mungkin memungkinkan nada ironis, tetapi bahasa Yunani tidak menyatakannya secara eksplisit; ambiguitas itu dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “pergilah dan pelajarilah” menjaga nada teguran rabinik; kapitalisasi pronomina ilahi mengikuti konvensi umum Alkitab bahasa Indonesia. Istilah “kurban” dipilih menurut ejaan baku.
