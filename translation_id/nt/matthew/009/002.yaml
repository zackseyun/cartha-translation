id: MAT.9.2
reference: Matthew 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: id
  text: Lihatlah, orang-orang membawa seorang lumpuh yang terbaring di atas tempat tidur kepada-Nya. Ketika Yesus melihat iman mereka[a], Ia berkata kepada orang lumpuh itu, “Kuatkan hatimu, Nak! Dosa-dosamu diampuni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani memakai bentuk jamak, “iman mereka”. Ini dapat menunjuk kepada orang-orang yang membawa orang lumpuh itu, atau juga mencakup orang lumpuh tersebut.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “Dosa-dosamu telah diampuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian dan menghidupkan adegan, dengan ungkapan Indonesia yang jelas dan wajar.
- source_word: προσέφερον
  choice: orang-orang membawa
  rationale: Subjek jamak tersirat dalam bentuk verba Yunani. Bentuk lampau imperfektif menggambarkan tindakan dalam adegan, tetapi bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit; 'membawa' terdengar alami dalam narasi.
- source_word: παραλυτικὸν
  choice: seorang lumpuh
  rationale: Menerjemahkan adjektiva yang dipakai sebagai nomina secara ringkas dan alami tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: yang terbaring di atas tempat tidur
  rationale: Menggambarkan keadaan atau posisi orang itu secara alami. 'Tempat tidur' lebih pasti bagi κλίνη daripada 'tikar'.
- source_word: πίστιν
  choice: iman
  rationale: Padanan baku yang di sini mencakup kepercayaan yang tampak melalui tindakan.
- source_word: Θάρσει
  choice: Kuatkan hatimu
  rationale: Imperatif ini menyampaikan penguatan dan penenteraman. Ungkapan tersebut alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: τέκνον
  choice: Nak
  rationale: Sapaan Indonesia yang hangat dan alami bagi τέκνον, tanpa menjadikannya sapaan biologis atau menambahkan jenis kelamin yang tidak dinyatakan oleh kata itu sendiri.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Dosa-dosamu diampuni
  rationale: Bentuk pasif mempertahankan pelaku pengampunan yang tidak disebutkan dalam bahasa Yunani dan menyampaikan pernyataan pengampunan secara langsung.
- source_word: ἁμαρτίαι
  choice: dosa-dosa
  rationale: Mempertahankan bentuk jamak konkret dari pelanggaran-pelanggaran yang diampuni.
theological_decisions:
- issue: Cakupan τὴν πίστιν αὐτῶν
  choice: Mempertahankan bentuk jamak 'iman mereka' tanpa menentukan secara tegas siapa saja yang termasuk.
  alternative: Iman para pengusung saja, atau iman orang lumpuh bersama mereka.
  rationale: Kata ganti jamak paling wajar menunjuk kepada kelompok yang berkaitan dengan orang lumpuh itu, sekurang-kurangnya mereka yang membawanya. Teks tidak secara tegas memasukkan atau mengeluarkan orang lumpuh itu.
- issue: Daya pernyataan pengampunan Yesus
  choice: Menggunakan pernyataan pasif 'Dosa-dosamu diampuni.'
  alternative: Mengungkapkannya sebagai tindakan ilahi yang terjadi saat itu atau sebagai keadaan yang telah selesai.
  rationale: Bahasa Yunani menyatakan pengampunan dengan bentuk pasif dan tidak menyebut pelakunya. Terjemahan pasif menjaga ketegangan tersebut tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Nak' dipakai sebagai sapaan hangat yang wajar; kapitalisasi kata ganti untuk Yesus mengikuti gaya Alkitab Indonesia yang umum tanpa mengubah makna sumber.
