  source_fidelity: 'Terjemahan mencerminkan unsur-unsur Yunani dengan baik: καὶ ἰδού diterjemahkan “Dan lihatlah,”, τινες τῶν γραμματέων menjadi “beberapa ahli Taurat,” dan tuduhan βλασφημεῖ dipertahankan secara langsung sebagai “menghujat.” “Berkata dalam hati mereka” merupakan pemahaman yang wajar untuk εἶπαν ἐν ἑαυτοῖς dan tidak mengubahnya menjadi sekadar pikiran.'
