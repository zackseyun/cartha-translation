id: MAT.9.3
reference: Matthew 9:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: id
  text: Dan lihatlah, beberapa ahli Taurat berkata dalam hati mereka[a], “Orang ini menghujat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkata di antara mereka sendiri.” Ungkapan Yunani ini dapat menunjuk perkataan pribadi atau pertimbangan dalam batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung naratif sederhana pada awal ayat.
- source_word: ἰδού
  choice: lihatlah
  rationale: Mencerminkan penanda wacana yang mengarahkan perhatian dan menghidupkan narasi, dengan bentuk yang tetap wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: τινες τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: τινες menyatakan sebagian yang tidak ditentukan, sedangkan γραμματεῖς dalam konteks Injil menunjuk para pakar atau pengajar Taurat; 'ahli Taurat' merupakan padanan Indonesia yang mapan dan jelas.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: berkata dalam hati mereka
  rationale: Mempertahankan unsur 'berkata' serta sifat batin atau pribadi dari ungkapan Yunani, tanpa menyederhanakannya menjadi 'berpikir'.
- source_word: Οὗτος
  choice: Orang ini
  rationale: Menyampaikan acuan demonstratif secara alami dan mempertahankan kemungkinan nada merendahkan tanpa menambah kekasaran.
- source_word: βλασφημεῖ
  choice: menghujat
  rationale: Padanan langsung dan alami bagi tuduhan bahwa perkataan Yesus menghina atau melanggar kehormatan ilahi; kala kini Yunani tidak perlu dibuat progresif secara eksplisit dalam bahasa Indonesia.
theological_decisions:
- issue: Tuduhan para ahli Taurat terhadap Yesus
  choice: Orang ini menghujat
  alternative: Dia mengucapkan hujat
  rationale: Terjemahan mempertahankan tuduhan langsung dan ketegangan naratif tanpa menjelaskan terlebih dahulu apakah tuduhan itu benar atau salah.
- issue: Apakah perkataan itu batin atau diucapkan secara pribadi
  choice: berkata dalam hati mereka
  alternative: berkata di antara mereka sendiri
  rationale: Konteks lanjutan mendukung deliberasi batin, tetapi ungkapan Yunani dapat mencakup perkataan pribadi; catatan kaki mempertahankan kemungkinan alternatif itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lihatlah' mempertahankan daya pengarah perhatian dari ἰδού, sedangkan 'ahli Taurat' memakai istilah Injil yang telah dikenal luas.
