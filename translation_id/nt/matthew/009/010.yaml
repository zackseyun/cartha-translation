  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: id
  text: Ketika Yesus sedang duduk bersandar untuk makan di rumah itu,[a] lihatlah,[b] banyak pemungut pajak dan orang berdosa datang, lalu duduk bersandar untuk makan bersama Yesus dan murid-murid-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih idiomatis: “sedang makan di rumah itu.” Bahasa Yunani secara khusus menggambarkan posisi duduk bersandar yang lazim ketika makan pada masa itu.'
    reason: lexical_alternative
  - marker: b
    text: Teks hanya menyebut “di rumah itu” dan dalam ayat ini tidak secara eksplisit menyatakan siapa pemilik rumah tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: Ketika Yesus sedang duduk bersandar untuk makan
  rationale: Ungkapan καὶ ἐγένετο berfungsi sebagai peralihan naratif dan, bersama konstruksi genitif absolut, paling alami disampaikan sebagai anak kalimat waktu. Nama Yesus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἀνακειμένου
  choice: duduk bersandar untuk makan
  rationale: Dalam konteks perjamuan, verba ini menunjuk pada posisi bersandar di tempat makan. Rumusan ini mempertahankan gambaran postur kuno sekaligus menjelaskan bahwa yang dimaksud adalah makan.
- source_word: ἐν τῇ οἰκίᾳ
  choice: di rumah itu
  rationale: Artikel definit Yunani dipertahankan dengan 'itu', tanpa menentukan siapa pemilik rumah tersebut.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian pembaca kepada kejadian berikutnya.
- source_word: τελῶναι
  choice: pemungut pajak
  rationale: Padanan baku dan jelas dalam konteks Injil, serta tetap membawa kategori sosial kelompok tersebut.
- source_word: ἁμαρτωλοὶ
  choice: orang berdosa
  rationale: Adjektiva ini digunakan secara substantival dan secara wajar diterjemahkan sebagai sebutan bagi orang-orang yang dipandang berdosa.
- source_word: ἐλθόντες
  choice: datang
  rationale: Partisip aoris disampaikan sebagai verba berurutan yang alami dalam narasi Indonesia.
- source_word: συνανέκειντο
  choice: turut duduk bersandar untuk makan bersama
  rationale: Verba majemuk ini menyatakan bahwa mereka mengambil posisi makan bersama Yesus dan para murid-Nya; 'turut' menangkap unsur kebersamaan tanpa menambahkan tafsiran.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: murid-murid-Nya
  rationale: '''Murid'' merupakan padanan baku bagi μαθητής dan mempertahankan hubungan guru-pengikut.'
theological_decisions:
- issue: Postur makan dan persekutuan semeja
  choice: Mempertahankan gambaran 'duduk bersandar untuk makan' dan 'bersama'.
  alternative: sedang makan; makan bersama
  rationale: Teks menyebut postur makan yang khas dan kebersamaan semeja. Terjemahan mempertahankan keduanya tanpa mengembangkan implikasi teologis lebih jauh.
- issue: Identitas rumah
  choice: Tidak menyebut pemilik rumah dalam teks utama.
  alternative: di rumah Matius; di rumahnya
  rationale: Frasa Yunani hanya mengatakan 'di rumah itu'; identitas pemiliknya tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'duduk bersandar untuk makan' dipilih agar pembaca umum memahami postur perjamuan kuno. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
