  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: id
  text: Lalu terbukalah mata mereka. Yesus dengan tegas memperingatkan mereka,[a] kata-Nya, “Jangan sampai seorang pun mengetahuinya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tegas memerintahkan mereka” atau “menegur mereka dengan keras.” Kata Yunani yang dipakai menyiratkan emosi kuat dan ketegasan dalam peringatan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Pastikanlah agar tidak seorang pun tahu.” Objek yang diketahui tidak disebutkan dalam bahasa Yunani, tetapi tersirat dari konteks penyembuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: terbukalah mata mereka
  rationale: Bentuk pasif aoristus menyatakan pemulihan penglihatan tanpa menyebutkan pelaku secara eksplisit. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan ungkapan Yunani.
- source_word: ἐνεβριμήθη αὐτοῖς
  choice: memperingatkan mereka dengan keras
  rationale: Verba ἐμβριμάομαι mengandung emosi kuat dan ketegasan. Dalam konteks larangan yang langsung menyusul, ungkapan ini menyampaikan peringatan yang tegas tanpa menambahkan alasan atau motif.
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini memperkenalkan isi peringatan. Dalam bahasa Indonesia, 'kata-Nya' menghubungkannya secara alami dengan ucapan langsung.
- source_word: Ὁρᾶτε μηδεὶς γινωσκέτω
  choice: Jangan sampai ada seorang pun yang mengetahuinya
  rationale: Ὁρᾶτε berfungsi sebagai seruan kewaspadaan, sedangkan μηδεὶς γινωσκέτω merupakan larangan orang ketiga. 'Jangan sampai' mempertahankan daya perintahnya; akhiran '-nya' memasok objek yang tersirat dari konteks agar kalimat Indonesia tetap alami.
theological_decisions:
- issue: Kekuatan perintah Yesus sesudah penyembuhan
  choice: Yesus memberikan larangan keras agar peristiwa itu tidak diketahui orang lain.
  alternative: Yesus menegur mereka atau memerintahkan mereka dengan keras.
  rationale: Teks menunjukkan ketegasan perintah, tetapi tidak menerangkan motif Yesus. Terjemahan mempertahankan kekuatan dan ketegangan tersebut tanpa memasukkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu terbukalah mata mereka' mempertahankan idiom sumber tanpa terasa kaku; 'Jangan sampai' menyampaikan larangan tegas secara wajar. Semua penanda catatan kaki ditempatkan dalam teks utama.
