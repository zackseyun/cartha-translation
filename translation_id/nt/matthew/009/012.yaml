id: MAT.9.12
reference: Matthew 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: id
  text: Namun, ketika mendengarnya, Yesus berkata, “Bukan orang sehat yang memerlukan tabib, melainkan orang sakit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika mendengarnya
  rationale: Partisip aoris ini paling alami dipahami secara temporal. Akhiran -nya menyatakan objek tersirat dari konteks sebelumnya tanpa memperberat kalimat.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan kontras ringan terhadap perkataan sebelumnya; “Namun” alami dan tidak terlalu tajam.
- source_word: εἶπεν
  choice: Yesus berkata
  rationale: Kata kerja ini adalah verba ujaran biasa. Subjek eksplisit “Yesus” digunakan agar rujukan pronomina jelas dalam bahasa Indonesia, tanpa mengubah fungsi ujarannya menjadi “menjawab”.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Bukan ... yang memerlukan
  rationale: Konstruksi Indonesia ini menyampaikan penyangkalan kebutuhan secara idiomatis sekaligus mempertahankan pertentangan antara dua kelompok.
- source_word: οἱ ἰσχύοντες
  choice: orang sehat
  rationale: Walaupun ἰσχύω secara dasar berkaitan dengan kekuatan, dalam pertentangan medis dengan οἱ κακῶς ἔχοντες ungkapan ini secara idiomatis menunjuk kepada orang yang sehat.
- source_word: ἰατροῦ
  choice: tabib
  rationale: ἰατρός berarti dokter atau tabib. “Tabib” mempertahankan nada pepatah yang bermartabat dan tetap mudah dipahami dalam konteks Alkitab.
- source_word: οἱ κακῶς ἔχοντες
  choice: orang sakit
  rationale: Ungkapan idiomatis κακῶς ἔχω dalam konteks medis berarti sakit; “orang sakit” adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Makna metaforis dibandingkan makna medis harfiah dalam pepatah
  choice: Menerjemahkan perkataan itu dengan gambaran medis secara langsung dan membiarkan konteks menjelaskan penerapan rohaninya.
  alternative: Menambahkan bahasa yang secara eksplisit menyebut kebutuhan rohani orang berdosa.
  rationale: Teks Yunani menyatakan pepatah dalam istilah medis. Tidak memperjelas metaforanya di dalam ayat ini menjaga ketegangan teologis dan menghindari penambahan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur dibuat alami bagi pembaca umum. “Tabib” dipilih untuk nada pepatah; “orang sehat” dan “orang sakit” mempertahankan kontras medis yang jelas.
