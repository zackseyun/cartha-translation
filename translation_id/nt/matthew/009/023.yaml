  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: id
  text: Ketika Yesus masuk ke rumah pemimpin itu[a] dan melihat para peniup seruling[b] serta orang banyak yang sedang membuat kegaduhan[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat itu”; berdasarkan perbandingan dengan kisah-kisah paralel, “pemimpin rumah ibadat itu.” Namun, kata yang dipakai Matius di sini hanya berarti “pemimpin.”
    reason: alternative_reading
  - marker: b
    text: Para peniup seruling lazim hadir dalam perkabungan; mereka termasuk orang-orang yang diupah untuk meratapi orang mati.
    reason: cultural_note
  - marker: c
    text: Atau “berada dalam keributan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ketika Yesus tiba
  rationale: Partisip aoris menyatakan urutan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: οἰκίαν
  choice: rumah
  rationale: Padanan langsung yang sesuai dengan latar narasi.
- source_word: ἄρχοντος
  choice: pemimpin
  rationale: Istilah Yunani ini bersifat umum; 'pemimpin' mempertahankan keluasan maknanya tanpa menyisipkan identifikasi yang lebih khusus dari kisah paralel.
- source_word: ἰδὼν
  choice: melihat
  rationale: Padanan naratif yang langsung dan wajar.
- source_word: αὐλητὰς
  choice: para peniup seruling
  rationale: Menunjuk kepada orang-orang yang memainkan seruling atau suling; ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: ὄχλον
  choice: orang banyak
  rationale: Padanan idiomatis bagi kerumunan dalam konteks naratif.
- source_word: θορυβούμενον
  choice: sedang membuat kegaduhan
  rationale: Menggambarkan keramaian yang gaduh tanpa menentukan emosi atau maksudnya secara berlebihan.
theological_decisions:
- issue: Identifikasi pemilik rumah
  choice: pemimpin
  alternative: pejabat; pemimpin rumah ibadat
  rationale: Matius hanya memakai ἄρχων, istilah umum bagi seorang pemimpin atau penguasa. Terjemahan utama tidak mengharmoniskannya dengan identifikasi yang lebih khusus dalam kisah paralel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Pemimpin' dipilih agar cukup luas sesuai teks Yunani. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan; [a] diletakkan pada akhir ayat karena menjelaskan sebutan 'pemimpin itu' sekaligus menjaga aliran kalimat.
