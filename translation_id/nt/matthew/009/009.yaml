id: MAT.9.9
reference: Matthew 9:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: id
  text: Ketika Yesus meneruskan perjalanan dari sana, Ia melihat seorang laki-laki bernama Matius sedang duduk di tempat pemungutan pajak[a]. Yesus berkata kepadanya, “Ikutlah Aku.” Matius pun bangkit dan mengikuti-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kantor pemungutan pajak” atau “pos pemungutan bea.” Yunani τελώνιον dapat menunjuk pada tempat atau meja tempat pajak, cukai, atau bea dipungut; bentuk tepat tempat itu tidak dijelaskan.
    reason: Menjaga kemungkinan makna τελώνιον tanpa menetapkan bentuk fisik tempat pemungutan itu.
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: ketika Yesus pergi dari sana
  rationale: Partisipel kini παράγων menggambarkan tindakan yang sedang berlangsung dalam alur cerita, sedangkan ἐκεῖθεν menyatakan titik keberangkatan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang pria tertentu, yaitu Matius.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: sedang duduk di pos pemungutan pajak
  rationale: Bentuk partisipel menunjukkan Matius sedang duduk di tempat ia menjalankan pemungutan pajak atau bea. 'Pos pemungutan pajak' jelas dan sesuai dengan latar yang mungkin dimaksud.
- source_word: Μαθθαῖον λεγόμενον
  choice: bernama Matius
  rationale: '''Bernama Matius'' merupakan padanan Indonesia yang alami untuk menyatakan nama yang dengannya orang itu dikenal.'
- source_word: λέγει αὐτῷ
  choice: Yesus berkata kepadanya
  rationale: Bahasa Yunani memakai present historis untuk menghidupkan narasi. Bahasa Indonesia tidak menandai kala secara morfologis; 'berkata' alami dalam narasi dan acuannya diperjelas dengan menyebut Yesus.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Imperatif ini menyampaikan panggilan langsung untuk mengikuti Yesus. Partikel '-lah' memberikan bentuk perintah yang tegas tetapi wajar tanpa menambahkan penjelasan teologis.
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Partisipel aoris menyatakan tindakan Matius bangun dari posisi duduk sebelum mengikuti Yesus. 'Bangkit' ringkas dan bermartabat.
- source_word: ἠκολούθησεν αὐτῷ
  choice: mengikuti-Nya
  rationale: Padanan ini mempertahankan tindakan konkret sekaligus kemungkinan makna kemuridan tanpa menguraikannya secara berlebihan.
theological_decisions:
- issue: Sifat panggilan Yesus kepada Matius
  choice: Ikutlah Aku
  alternative: Jadilah murid-Ku
  rationale: Konteks menyiratkan panggilan kepada kemuridan, tetapi teks Yunani hanya memerintahkan Matius untuk mengikuti Yesus. Terjemahan tidak menambahkan penafsiran yang mengubah implikasi itu menjadi penjelasan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama diri dipakai kembali untuk memperjelas pelaku dan menghindari rangkaian pronomina yang berpotensi kabur. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia tanpa menambahkan gelar atau tafsiran.
