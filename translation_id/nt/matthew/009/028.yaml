id: MAT.9.28
reference: Matthew 9:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: id
  text: Ketika dia masuk ke dalam rumah itu[a], orang-orang buta itu mendekatinya. Yesus bertanya kepada mereka, “Percayakah kalian bahwa Aku sanggup melakukan hal ini?” Mereka menjawab, “Ya, Tuhan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Setelah dia masuk ke rumah itu, orang-orang buta itu datang kepadanya.”
    reason: alternative_rendering
  - marker: b
    text: Atau “Tuan.” Kata Yunani κύριε dapat menjadi sapaan hormat, tetapi juga dapat menyatakan pengakuan terhadap kewibawaan Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Ketika dia masuk ke dalam rumah itu
  rationale: Partisip aoris memperkenalkan peristiwa berikutnya secara temporal. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan acuan pronominal bahasa Yunani tanpa menambahkan nama Yesus.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: orang-orang buta itu mendekatinya
  rationale: προσέρχομαι menyatakan gerak mendekat kepada seseorang. Bentuk jamak substantival οἱ τυφλοί diterjemahkan secara wajar sebagai 'orang-orang buta itu' tanpa memasukkan jumlah yang tidak dinyatakan dalam ayat ini.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus bertanya kepada mereka
  rationale: Karena ujaran berikut berbentuk pertanyaan langsung, 'bertanya' lebih alami daripada 'berkata' dalam bahasa Indonesia. Bahasa Indonesia tidak menandai kala gramatikal, sehingga bentuk ini tidak menghapus nuansa present historis Yunani.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Percayakah kalian bahwa Aku sanggup melakukan hal ini?
  rationale: '''Percayakah kalian'' menyampaikan pertanyaan jamak secara jelas; ''sanggup'' mempertahankan penekanan δύναμαι pada kemampuan, dan ''hal ini'' menunjuk pada tindakan penyembuhan yang dimohon.'
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: Mereka menjawab, “Ya”
  rationale: Dalam konteks tanya-jawab, 'menjawab' merupakan ungkapan Indonesia yang alami bagi λέγουσιν, sedangkan Ναί adalah jawaban afirmatif sederhana.
- source_word: κύριε
  choice: Tuhan
  rationale: '''Tuhan'' mempertahankan kemungkinan pengakuan terhadap kewibawaan Yesus, sementara catatan kaki menjaga kemungkinan bahwa kata itu hanya merupakan sapaan hormat, ''Tuan''.'
theological_decisions:
- issue: Makna κύριε sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks memungkinkan sapaan hormat maupun pengakuan yang lebih dalam terhadap kewibawaan Yesus. Teks utama memakai 'Tuhan', tetapi catatan kaki mempertahankan ambiguitas yang sungguh ada dalam bahasa Yunani.
- issue: Present historis λέγει dan λέγουσιν
  choice: Disampaikan dengan verba Indonesia tanpa penanda kala
  alternative: Menambahkan penanda waktu yang mengesankan kala lampau atau kini
  rationale: Bahasa Indonesia tidak menginfleksikan verba menurut kala. Karena itu, terjemahan alami dapat mempertahankan urutan dan daya hidup narasi tanpa memaksakan penanda waktu yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Kalian' dipakai untuk memperjelas bahwa pertanyaan ditujukan kepada lebih dari satu orang. Pronomina naratif ditulis dengan huruf kecil menurut kaidah umum, sedangkan 'Aku' dalam kutipan dipertahankan sebagai gaya Alkitab Indonesia yang dikenal luas. Struktur kalimat dipecah agar alurnya lancar dan tidak membentuk rangkaian klausa yang berat.
