  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: id
  text: Lalu ia menyentuh mata mereka sambil berkata, “Terjadilah bagi kalian sesuai dengan iman kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terjadilah bagi kalian sesuai dengan kepercayaan kalian.” Kata Yunani pistis juga dapat diterjemahkan “kepercayaan” atau, dalam konteks tertentu, “kesetiaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai peristiwa berikutnya dalam urutan narasi secara alami dan ringkas.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Bentuk tengah ἅπτω di sini menyatakan sentuhan fisik; padanan ini lugas dan tidak memperluas tindakan.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: mata mereka
  rationale: Genitif sesudah ἅπτομαι menunjukkan bagian yang disentuh; susunan objek langsung ini idiomatis dalam bahasa Indonesia.
- source_word: λέγων
  choice: dan berkata
  rationale: Partisipel kini menyertai tindakan utama; bentuk klausa setara lebih alami dalam narasi Indonesia tanpa mengubah hubungan waktunya.
- source_word: Κατὰ
  choice: sesuai dengan
  rationale: κατά dengan akusatif menyatakan kesesuaian atau ukuran, bukan dengan tegas sebab atau dasar jasa.
- source_word: τὴν πίστιν ὑμῶν
  choice: imanmu
  rationale: πίστις dalam konteks ini menunjuk pada kepercayaan kedua orang itu kepada kemampuan Yesus; 'iman' merupakan padanan baku dan tetap wajar. Bentuk tunggal '-mu' dapat merujuk kepada lebih dari satu orang dalam bahasa Indonesia.
- source_word: γενηθήτω
  choice: Jadilah
  rationale: Imperatif pasif aoristus dari γίνομαι berfungsi sebagai pernyataan yang mewujudkan tindakan. 'Jadilah' mempertahankan daya imperatif dan ketaktertentuan pelaku tanpa menambahkan objek yang tidak tersurat.
- source_word: ὑμῖν
  choice: bagimu
  rationale: Datif ini menyatakan pihak yang mengalami atau menerima hasilnya; 'bagimu' mempertahankan bentuk ringkas dan mencakup kedua orang yang disapa.
theological_decisions:
- issue: Makna πίστις dalam perkataan penyembuhan
  choice: iman
  alternative: kepercayaan
  rationale: Konteks menunjuk pada keyakinan kedua orang buta kepada Yesus, bukan terutama kesetiaan sebagai sifat moral. 'Iman' mempertahankan istilah teologis yang lazim, sedangkan alternatif 'kepercayaan' dicatat agar nuansa relasionalnya terlihat.
- issue: Hubungan iman dengan hasil penyembuhan
  choice: sesuai dengan imanmu
  alternative: berdasarkan imanmu
  rationale: Ungkapan 'sesuai dengan' menjaga nuansa kesesuaian atau ukuran dalam κατά dan tidak mempertegas iman sebagai sebab berjasa.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan 'Jadilah bagimu' sengaja agak formal untuk mempertahankan bentuk imperatif pasif/performatif Yunani. Penanda catatan kaki ditempatkan sesudah seluruh ucapan karena catatan menjelaskan πίστις sekaligus menawarkan terjemahan alternatif bagi klausa tersebut.
