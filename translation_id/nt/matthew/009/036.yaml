  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: id
  text: Ketika melihat orang banyak itu, ia tergerak oleh belas kasihan kepada mereka, karena mereka didera dan terkapar,[a] seperti domba-domba yang tidak mempunyai gembala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tertekan dan tidak berdaya.” Kedua istilah Yunani itu juga dapat dipahami secara lebih interpretatif sebagai gambaran tentang orang banyak yang telah dilelahkan dan tidak mampu mengurus diri mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: Ketika melihat orang banyak itu
  rationale: Partisipel aoris Ἰδών dinyatakan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia. δέ merupakan penghubung naratif ringan dan tidak perlu diterjemahkan tersendiri. Bentuk jamak ὄχλους diterjemahkan secara idiomatis sebagai kelompok kolektif ‘orang banyak itu’.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: ia tergerak oleh belas kasihan kepada mereka
  rationale: σπλαγχνίζομαι menyatakan belas kasihan yang mendalam. Ungkapan ini mempertahankan daya emosionalnya dalam bahasa Indonesia yang alami tanpa menambahkan penafsiran tentang tindakan selanjutnya.
- source_word: ὅτι ἦσαν
  choice: karena mereka
  rationale: ὅτι memperkenalkan alasan belas kasihan itu, sehingga ‘karena’ merupakan padanan sebab yang jelas; kopula ἦσαν tersirat secara wajar dalam konstruksi predikatif bahasa Indonesia.
- source_word: ἐσκυλμένοι καὶ ἐρριμμένοι
  choice: didera dan terkapar
  rationale: ‘Didera’ menyampaikan keadaan akibat tekanan atau perlakuan buruk yang terkandung dalam ἐσκυλμένοι, sedangkan ‘terkapar’ mempertahankan citra pasif ἐρριμμένοι, yakni telah dilemparkan atau dijatuhkan. Catatan kaki mencantumkan pemaknaan yang lebih interpretatif.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: seperti domba-domba yang tidak mempunyai gembala
  rationale: Terjemahan ini mempertahankan perbandingan pastoral serta bentuk klausa partisipial Yunani dengan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Bahasa belas kasihan Yesus
  choice: ia tergerak oleh belas kasihan kepada mereka
  alternative: ia berbelas kasihan kepada mereka
  rationale: Pilihan utama memperlihatkan kedalaman respons batin yang dinyatakan oleh verba Yunani tanpa memperluasnya menjadi klaim teologis tambahan.
- issue: Keadaan orang banyak
  choice: didera dan terkapar
  alternative: tertekan dan tidak berdaya
  rationale: Pilihan utama mempertahankan citra kuat dan bentuk pasif kedua partisipel Yunani. Alternatif yang lebih interpretatif dicatat karena kedua istilah dapat menggambarkan orang-orang yang telah dilelahkan dan tidak mampu menolong diri sendiri.
- issue: Metafora domba tanpa gembala
  choice: seperti domba-domba yang tidak mempunyai gembala
  alternative: seperti kawanan domba tanpa gembala
  rationale: Teks Yunani menyebut domba secara umum, bukan secara eksplisit ‘kawanan’; karena itu pilihan utama mempertahankan metafora tanpa menambahkan unsur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘ia’ tidak dikapitalisasi agar kapitalisasi teologis tidak dimasukkan ke dalam teks sumber. Koma sebelum penanda catatan kaki mengikuti batas frasa yang diterangkan.
