id: MAT.9.33
reference: Matthew 9:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: id
  text: Ketika setan itu telah diusir, orang bisu itu[a] berbicara. Orang banyak pun takjub dan berkata, “Belum pernah tampak hal seperti ini di Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang tuli itu.” Kata Yunani yang dipakai dapat berarti “tuli” atau “bisu”; di sini konteks lebih mendukung “bisu” karena yang ditekankan adalah bahwa orang itu berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: ketika ... telah diusir
  rationale: Partisip aoris pasif dalam konstruksi genitif absolut menunjukkan bahwa pengusiran setan mendahului tindakan utama; bentuk ini menyampaikan hubungan waktunya secara wajar dalam bahasa Indonesia.
- source_word: δαιμονίου
  choice: setan
  rationale: Dalam konteks pengusiran kuasa jahat dalam Injil, δαιμόνιον secara tepat dan ringkas diterjemahkan sebagai “setan”.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: Aoris sederhana λαλέω menyatakan bahwa orang itu berbicara, tanpa harus menambahkan nuansa “mulai” yang tidak dinyatakan secara eksplisit.
- source_word: ὁ κωφός
  choice: orang bisu itu
  rationale: κωφός dapat berarti tuli atau bisu, tetapi hasil langsung yang disebutkan adalah bahwa orang tersebut berbicara; karena itu, “bisu” paling sesuai dengan fokus konteks. Kata “orang” disediakan secara idiomatis dari konteks.
- source_word: ἐθαύμασαν
  choice: takjub
  rationale: Kata ini menyatakan rasa heran atau kagum yang kuat; “takjub” jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Bentuk jamak ini menunjuk kepada kumpulan orang. “Orang banyak” merupakan ungkapan Indonesia yang alami tanpa harus memaksakan penandaan jamak leksikal.
- source_word: Οὐδέποτε
  choice: belum pernah
  rationale: Dalam seruan mengenai kejadian yang tidak memiliki preseden sampai saat itu, “belum pernah” menyampaikan nilai temporal kata Yunani secara alami.
- source_word: ἐφάνη
  choice: tampak
  rationale: Bentuk ini dapat menyampaikan gagasan “muncul/tampak” atau secara idiomatis “terlihat”. “Tampak” mempertahankan keluasan tersebut dan sesuai dengan seruan orang banyak.
- source_word: οὕτως
  choice: hal seperti ini
  rationale: οὕτως menunjuk pada sifat atau cara peristiwa yang baru disaksikan. Ungkapan “hal seperti ini” menjadikan kalimat lengkap dan alami dalam bahasa Indonesia.
- source_word: ἐν τῷ Ἰσραήλ
  choice: di Israel
  rationale: Terjemahan ringkas ini dapat mencakup Israel sebagai umat maupun lingkup tempatnya, tanpa mempersempit makna yang tidak dipastikan oleh teks.
theological_decisions:
- issue: Rentang makna κωφός dalam konteks penyembuhan dan pengusiran setan
  choice: orang bisu itu
  alternative: orang tuli itu
  rationale: Walaupun κωφός dapat menunjuk pada ketulian atau kebisuan, pernyataan berikutnya—bahwa orang itu berbicara—menunjukkan bahwa ketidakmampuan berbicara adalah kondisi yang ditekankan. Catatan kaki mempertahankan alternatif leksikal yang sungguh ada.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan kalimat mempertahankan urutan peristiwa dalam teks Yunani, sementara “orang banyak pun” menyampaikan kesinambungan narasi καί tanpa pengulangan kata sambung yang kaku.
