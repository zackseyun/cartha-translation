id: MAT.9.22
reference: Matthew 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: id
  text: Namun Yesus berpaling dan melihat perempuan itu, lalu berkata, “Teguhkanlah hatimu, anak-Ku; imanmu telah menyelamatkanmu.”[a] Sejak saat itu, perempuan itu sembuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “imanmu telah menyembuhkanmu” atau “imanmu telah memulihkanmu.” Kata Yunani yang digunakan dapat berarti menyelamatkan, menyembuhkan, atau memulihkan keadaan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoris ini dipakai secara intransitif. 'Berpaling' menyatakan gerakan Yesus secara alami tanpa menambahkan arah yang tidak disebutkan.
- source_word: ἰδὼν
  choice: melihat
  rationale: Partisip ini berkaitan erat dengan στραφεὶς dan mendahului ujaran utama; rangkaian 'berpaling dan melihat ... lalu berkata' alami dalam bahasa Indonesia.
- source_word: Θάρσει
  choice: Teguhkanlah hatimu
  rationale: Imperatif θαρσέω menyerukan keberanian atau keteguhan. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: θύγατερ
  choice: anak-Ku
  rationale: Sapaan harfiah 'anak perempuan' terdengar kaku dalam konteks ini. 'Anak-Ku' mempertahankan kehangatan sapaan kekeluargaan tanpa menambahkan kata sifat seperti 'sayang'.
- source_word: πίστις
  choice: iman
  rationale: '''Iman'' merupakan padanan baku dan sesuai konteks untuk kepercayaan perempuan itu kepada Yesus.'
- source_word: σέσωκέν σε
  choice: telah menyelamatkanmu
  rationale: Bentuk perfektum σῴζω dapat mencakup penyelamatan dan pemulihan jasmani. Padanan ini mempertahankan keluasan maknanya dalam perkataan Yesus.
- source_word: ἐσώθη
  choice: sembuh
  rationale: Dalam kesimpulan naratif, konteks menjelaskan bahwa hasil langsungnya ialah pemulihan jasmani perempuan itu.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: Sejak saat itu
  rationale: Ungkapan temporal ini secara idiomatis menunjukkan bahwa kesembuhan berlaku mulai pada waktu tersebut.
- source_word: γυνή
  choice: perempuan itu
  rationale: Padanan referensial yang wajar untuk perempuan yang telah disebutkan dalam narasi.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan
  rationale: '''Iman'' menjaga istilah teologis yang lazim, sedangkan konteks tetap menunjukkan unsur kepercayaan pribadi.'
- issue: Makna σῴζω dalam perkataan Yesus dan kesimpulan narator
  choice: '''telah menyelamatkanmu'' dalam perkataan Yesus dan ''sembuh'' dalam kesimpulan narator'
  alternative: '''telah menyembuhkanmu'' dan ''sembuh'' pada kedua kemunculan'
  rationale: Kata Yunani yang sama memuat gema penyelamatan sekaligus kesembuhan. Perbedaan padanan ini mempertahankan keluasan perkataan Yesus sambil menjelaskan hasil jasmani yang langsung dalam narasi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'anak-Ku' dipilih agar kehangatan θύγατερ terdengar alami; tanda hubung mengikuti ejaan sapaan dengan enklitik -ku yang merujuk kepada penutur.
