  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: id
  text: Ketika orang banyak melihat hal itu, mereka menjadi takut[a] dan memuliakan Allah yang telah memberikan wewenang seperti itu kepada manusia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diliputi rasa gentar.” Kata Yunani secara lebih harfiah berarti “menjadi takut,” tetapi rasa takut itu dapat mencakup ketakjuban yang penuh hormat.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini berbentuk jamak dan dapat merujuk kepada manusia pada umumnya.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris diterjemahkan sebagai klausa waktu yang alami dalam bahasa Indonesia. 'Hal itu' menyatakan objek yang tersirat dari konteks tanpa menentukan hanya satu unsur peristiwa.
- source_word: δὲ
  choice: ketika
  rationale: δέ berfungsi sebagai peralihan naratif; dalam susunan bahasa Indonesia, peralihan itu cukup diungkapkan melalui klausa waktu tanpa konjungsi adversatif yang dapat memberi kesan pertentangan terlalu kuat.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami untuk kelompok khalayak; bentuk ini dapat menyampaikan jamak kolektif Yunani tanpa memakai 'kerumunan-kerumunan' yang kaku.
- source_word: ἐφοβήθησαν
  choice: menjadi takut
  rationale: Mempertahankan arti dasar φοβέομαι, yaitu takut, sambil membiarkan konteks mencakup rasa gentar atau takjub yang penuh hormat.
- source_word: ἐδόξασαν
  choice: memuliakan
  rationale: Mempertahankan bobot teologis dan konsistensi leksikal δοξάζω, bukan mempersempitnya menjadi sekadar 'memuji'.
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Padanan baku dalam bahasa Indonesia untuk θεός dalam konteks ini.
- source_word: τὸν δόντα
  choice: yang telah memberikan
  rationale: Partisip aoris atributif diterjemahkan sebagai klausa relatif; 'telah' menyatakan tindakan pemberian yang mendahului tanggapan orang banyak.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan otoritas atau hak yang diberikan, bukan hanya kemampuan atau kuasa efektif.
- source_word: τοιαύτην
  choice: seperti itu
  rationale: Padanan alami yang mengacu pada jenis wewenang yang baru saja terlihat dalam narasi.
- source_word: τοῖς ἀνθρώποις
  choice: kepada manusia
  rationale: ἄνθρωποι di sini dapat dipakai secara umum untuk umat manusia. 'Manusia' mempertahankan makna generiknya dan sekaligus membiarkan ketegangan bahwa orang banyak berbicara dalam bentuk jamak ketika menanggapi tindakan Yesus.
theological_decisions:
- issue: Apakah reaksi orang banyak harus diterjemahkan sebagai takut atau diperhalus menjadi takjub
  choice: mereka menjadi takut
  alternative: mereka diliputi rasa gentar / mereka takjub
  rationale: Kata kerja Yunani secara langsung menyatakan takut. Nuansa rasa gentar penuh hormat mungkin ada, tetapi teks utama mempertahankan ketegangan leksikal itu.
- issue: Cakupan τοῖς ἀνθρώποις
  choice: kepada manusia
  alternative: kepada orang-orang / kepada kaum laki-laki
  rationale: Dalam konteks ini bentuk jamak ἄνθρωπος dapat mewakili manusia secara umum. Terjemahan tidak membatasi pemberian wewenang itu kepada laki-laki, dan tidak mengubah bentuk jamak menjadi rujukan eksklusif kepada Yesus.
- issue: Makna ἐξουσία dalam konteks pengampunan dan penyembuhan
  choice: wewenang
  alternative: kuasa
  rationale: '''Wewenang'' lebih tepat mempertahankan gagasan otoritas atau hak yang diberikan, tanpa mereduksinya menjadi kemampuan melakukan mukjizat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sedangkan istilah 'memuliakan' dan 'wewenang' mempertahankan bobot teologis teks. Semua penanda catatan kaki dicantumkan dalam teks utama.
