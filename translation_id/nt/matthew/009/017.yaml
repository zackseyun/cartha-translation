  to: Orang juga tidak menuangkan anggur baru ke dalam kantong kulit yang sudah tua. Jika orang melakukannya, kantong-kantong itu akan pecah, anggurnya tertumpah, dan kantong-kantong itu pun rusak. Sebaliknya, orang menuangkan anggur baru ke dalam kantong kulit yang masih baru[a], dan keduanya terpelihara.
  rationale: Revisi hanya mengganti 'sehingga' dengan 'dan' pada kalimat terakhir, agar hubungan antarklausa tidak dibuat lebih eksplisit daripada καί dalam teks Yunani. Penyederhanaan bentuk jamak pada penyebutan awal 'kantong kulit' adalah penggunaan Indonesia yang alami; jamaknya tetap jelas dari rujukan berikutnya dan dari konteks.
