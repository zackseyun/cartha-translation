  terminology: '''Anggur baru'' dan ''kantong kulit'' adalah pilihan yang jelas dan sesuai register. Catatan kaki secara tepat menjelaskan perbedaan leksikal νέος dan καινός tanpa menjadikannya tafsiran teologis. ''Terpelihara'' sesuai untuk συντηροῦνται dalam konteks ini.'
