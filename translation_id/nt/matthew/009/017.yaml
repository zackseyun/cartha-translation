id: MAT.9.17
reference: Matthew 9:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: id
  text: Orang juga tidak menuangkan anggur baru ke dalam kantong kulit yang sudah tua. Jika orang melakukannya, kantong-kantong itu akan pecah, anggurnya tertumpah, dan kantong-kantong itu pun rusak. Sebaliknya, orang menuangkan anggur baru ke dalam kantong kulit yang masih baru[a], dan keduanya terpelihara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai kata yang berbeda untuk “baru” pada anggur (νέος, baru dalam waktu) dan pada kantong kulit (καινός, baru atau segar dalam kondisi).
    reason: Menjelaskan perbedaan leksikal dalam teks sumber tanpa memaksakan makna teologis tertentu.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: Orang juga tidak menuangkan
  rationale: οὐδέ melanjutkan contoh negatif sebelumnya, sedangkan βάλλω dalam konteks memasukkan cairan ke wadah paling alami diterjemahkan 'menuangkan', bukan 'melemparkan'.
- source_word: οἶνον νέον
  choice: anggur baru
  rationale: Ungkapan ini menunjuk pada anggur yang baru dibuat dan mempertahankan pasangan adjektiva-nomina secara langsung.
- source_word: ἀσκοὺς παλαιούς
  choice: kantong-kantong kulit yang sudah tua
  rationale: ἀσκός adalah wadah dari kulit untuk menyimpan anggur. 'Kantong kulit' lebih mudah dipahami pembaca modern daripada 'kirbat', sementara 'sudah tua' menyampaikan umur sekaligus kondisi wadah.
- source_word: εἰ δὲ μή γε
  choice: Jika orang melakukannya
  rationale: Ungkapan kondisional ini menyatakan akibat bila praktik terlarang tadi dilakukan. Bentuk eksplisit ini menghindari ambiguitas frasa Indonesia 'jika tidak'.
- source_word: ῥήγνυνται
  choice: akan pecah
  rationale: Kata ini menggambarkan kantong kulit yang terbelah karena tekanan; 'pecah' alami dan jelas dalam bahasa Indonesia.
- source_word: ἐκχεῖται
  choice: tertumpah
  rationale: Bentuk ini menyatakan anggur keluar dan hilang sebagai akibat pecahnya wadah; 'tertumpah' menyampaikan akibat yang tidak dikehendaki.
- source_word: ἀπόλλυνται
  choice: rusak
  rationale: Dalam konteks ini kantong kulit menjadi tidak dapat digunakan lagi. 'Rusak' menyampaikan kehancuran praktis tanpa memberi kesan bahwa benda itu hidup.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Kata ini memperkenalkan praktik yang benar sebagai kontras dengan tindakan sebelumnya.
- source_word: ἀσκοὺς καινούς
  choice: kantong-kantong kulit yang masih baru
  rationale: καινός menyoroti kebaruan atau kondisi yang belum usang. 'Masih baru' membedakannya secara halus dari anggur yang baru dibuat.
- source_word: ἀμφότεροι συντηροῦνται
  choice: keduanya tetap terpelihara
  rationale: '''Keduanya'' merujuk pada anggur dan kantong-kantong kulit, sedangkan ''tetap terpelihara'' mempertahankan nuansa penjagaan atau kelestarian pada verba Yunani.'
theological_decisions:
- issue: Pembedaan νέος dan καινός dalam ayat yang sama
  choice: Menerjemahkan νέος sebagai 'baru' dan καινός sebagai 'masih baru' serta memberi catatan kaki
  alternative: Menerjemahkan keduanya hanya sebagai 'baru' tanpa penjelasan
  rationale: Bahasa Yunani memakai dua adjektiva berbeda. Terjemahan ini tidak membangun tafsiran teologis di atas perbedaan tersebut, tetapi tetap memberi pembaca akses kepada nuansa leksikalnya.
- issue: Rujukan ἀμφότεροι ('keduanya')
  choice: Mempertahankan rujukan kepada anggur dan kantong-kantong kulit secara bersama-sama
  alternative: Memperjelas hanya salah satunya atau menafsirkan keduanya secara alegoris
  rationale: Teks secara gramatikal merujuk kepada kedua unsur dalam gambaran itu dan tidak menjelaskan makna alegorisnya di dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Istilah 'kantong kulit' dipilih daripada 'kirbat' agar benda kuno tersebut langsung dipahami pembaca modern. Pengulangan 'kantong-kantong' dipertahankan demi kejelasan dan mengikuti penekanan teks sumber.
