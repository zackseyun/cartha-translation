  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: id
  text: Lalu Yesus bangkit dan mengikuti dia, dan murid-murid-Nya juga ikut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: bangkit
  rationale: Partisip aoris pasif dari ἐγείρω dipakai secara intransitif untuk menggambarkan Yesus beranjak sebelum mengikuti orang itu. “Bangkit” ringkas, wajar dalam ragam naratif Alkitab, dan mempertahankan kaitan leksikal tanpa menyiratkan kebangkitan dari kematian dalam konteks ini.
- source_word: ἠκολούθει
  choice: mengikuti
  rationale: Imperfek ἀκολουθέω menggambarkan tindakan mengikuti yang berlangsung. Dalam narasi Indonesia, “mengikuti” sesudah “bangkit dan” secara alami menyampaikan tindakan tersebut tanpa perlu bentuk progresif yang berat.
- source_word: αὐτῷ
  choice: dia
  rationale: Pronomina datif ini menjadi pelengkap ἀκολουθέω dan mengacu kepada pemimpin dalam ayat sebelumnya. Bahasa Indonesia baku memakai “mengikuti dia” tanpa preposisi.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: “Murid-murid” adalah padanan baku dan kontekstual bagi μαθηταί, serta mempertahankan hubungan guru-murid.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: dan murid-murid-Nya juga ikut
  rationale: Klausa Yunani tidak mengulang verba. “Juga ikut” menghasilkan elipsis yang alami dalam bahasa Indonesia, dengan “-Nya” yang mengacu kepada Yesus, sekaligus menyatakan bahwa para murid turut mengikuti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina “-Nya” mengikuti konvensi umum teks Alkitab bahasa Indonesia untuk rujukan kepada Yesus; “dia” tetap huruf kecil karena mengacu kepada pemimpin yang disebut pada ayat sebelumnya.
