  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: id
  text: Karena itu, berdoalah dengan sungguh-sungguh kepada Tuhan yang memiliki tuaian supaya Ia mengutus para pekerja ke dalam tuaian-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengusir” para pekerja; kata kerja Yunani yang dipakai lebih kuat daripada sekadar “mengutus,” tetapi di sini menunjuk pada pengerahan para pekerja ke dalam tuaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: berdoalah dengan sungguh-sungguh
  rationale: Bentuk imperatif dari δέομαι menyatakan permohonan yang mendesak. Ungkapan ini mempertahankan konteks doa dan kesungguhannya dalam bahasa Indonesia yang wajar.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pernyataan sebelumnya tentang tuaian yang banyak dan pekerja yang sedikit.
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: Tuhan yang empunya tuaian
  rationale: Mempertahankan κύριος sebagai 'Tuhan' sekaligus menyatakan wewenang dan kepemilikan-Nya atas tuaian dengan ungkapan Alkitabiah yang tetap mudah dipahami.
- source_word: ὅπως
  choice: supaya
  rationale: Memperkenalkan isi sekaligus tujuan permohonan secara alami dalam bahasa Indonesia.
- source_word: ἐκβάλῃ
  choice: mengutus
  rationale: Dalam konteks ini verba tersebut berarti mengerahkan atau mengirim pekerja, meskipun secara leksikal memiliki daya yang lebih kuat daripada sekadar 'mengutus'; nuansa itu dicatat dalam catatan kaki.
- source_word: ἐργάτας
  choice: para pekerja
  rationale: Padanan modern dan jelas bagi orang-orang yang bekerja dalam tuaian.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ke dalam tuaian-Nya
  rationale: Mempertahankan gambaran tuaian, gerak ke dalam lingkup pekerjaan itu, dan pronomina kepunyaan tanpa menambahkan 'ladang' yang tidak tersurat.
theological_decisions:
- issue: Identitas 'Tuhan yang empunya tuaian'
  choice: Gelar tersebut dibiarkan tanpa menentukan secara khusus siapa rujukannya.
  alternative: Menafsirkannya secara eksplisit sebagai Bapa atau sebagai Yesus.
  rationale: Ayat ini sendiri tidak mengidentifikasi rujukannya lebih jauh. Membiarkannya sebagaimana dinyatakan teks menjaga ambiguitas dan ketegangan teologis yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'yang empunya tuaian' mempertahankan nuansa gelar dan kepemilikan yang dikenal dalam bahasa Alkitab, sedangkan susunan ayat dibuat tetap jelas bagi pembaca umum.
