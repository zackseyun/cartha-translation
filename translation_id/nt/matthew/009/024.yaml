base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: id
  text: Ia berkata, “Pergilah! Sebab anak perempuan itu tidak mati, tetapi sedang tidur.” Dan mereka menertawakan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengejek Dia.” Kata kerja Yunani ini dapat berarti menertawakan seseorang dengan maksud mengejek.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menggambarkan ujaran dalam adegan yang sedang berlangsung dan dapat pula menyiratkan ujaran berulang. Dalam narasi bahasa Indonesia, “berkata” merupakan padanan alami tanpa memaksakan pengulangan yang tidak dinyatakan secara pasti.
- source_word: Ἀναχωρεῖτε
  choice: Pergilah!
  rationale: Imperatif jamak ini menyuruh orang-orang yang hadir untuk meninggalkan tempat itu. “Pergilah” jelas, tegas, dan alami dalam bahasa Indonesia modern.
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ memperkenalkan alasan bagi perintah sebelumnya; “sebab” mempertahankan hubungan logis tersebut secara ringkas.
- source_word: ἀπέθανεν
  choice: tidak mati
  rationale: Aoristus menunjuk pada kematian sebagai peristiwa. “Tidak mati” mempertahankan penyangkalan langsung dalam bahasa Indonesia tanpa mengubahnya menjadi penjelasan tentang keadaan.
- source_word: τὸ κοράσιον
  choice: anak perempuan itu
  rationale: κοράσιον merujuk pada seorang anak perempuan atau gadis muda. “Anak perempuan itu” sesuai dengan konteks dan tidak menambahkan penekanan seperti “gadis kecil”.
- source_word: ἀλλὰ καθεύδει
  choice: tetapi sedang tidur
  rationale: Bentuk kini menunjukkan tindakan atau keadaan yang sedang berlangsung. “Sedang tidur” alami dan mempertahankan kontras serta metafora sumber.
- source_word: κατεγέλων αὐτοῦ
  choice: mereka menertawakan Dia
  rationale: Kata kerja ini berarti menertawakan seseorang dengan nada mengejek. Pilihan ini mempertahankan citra leksikal ‘tertawa’ sekaligus dapat dipahami sebagai ejekan; bentuk imperfek menempatkan tindakan itu sebagai bagian dari adegan yang berlangsung.
theological_decisions:
- issue: Pernyataan Yesus bahwa anak itu “tidak mati, tetapi sedang tidur”
  choice: Mempertahankan kata-kata harfiah “tidak mati, tetapi sedang tidur” tanpa penjelasan interpretatif dalam teks utama.
  alternative: Menerjemahkan “hanya tidur” atau menjelaskan bahwa “tidur” adalah metafora bagi kematian.
  rationale: Teks sumber menyajikan perkataan Yesus dalam bentuk yang sengaja menimbulkan ketegangan naratif dan teologis. Terjemahan tidak menentukan apakah perkataan itu metaforis, fenomenologis, atau antisipatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Tanda seru pada “Pergilah!” menyampaikan daya imperatif. Kata ganti “Dia” dikapitalisasi sesuai kebiasaan umum dalam teks Kristen Indonesia ketika merujuk kepada Yesus.
