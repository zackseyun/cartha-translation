base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: id
  text: Lalu, setelah naik ke sebuah perahu, Yesus menyeberang dan tiba di kota-Nya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kota-Nya sendiri.” Ini mungkin merujuk pada kota yang terkait dengan Yesus pada tahap kisah ini, kemungkinan Kapernaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, καί secara alami diterjemahkan “Lalu” dalam bahasa Indonesia sambil tetap menunjukkan kelanjutan peristiwa.
- source_word: ἐμβὰς
  choice: setelah naik
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; “setelah naik” mempertahankan urutan waktunya secara alami.
- source_word: πλοῖον
  choice: sebuah perahu
  rationale: πλοῖον adalah istilah umum untuk kendaraan air; dalam konteks Danau Galilea, “perahu” lebih tepat daripada “kapal”. Bentuk tanpa artikel wajar diterjemahkan “sebuah perahu”.
- source_word: διεπέρασεν
  choice: menyeberang
  rationale: διαπεράω berarti bergerak dari satu sisi ke sisi lain, khususnya melintasi perairan; “menyeberang” menyampaikan makna itu dengan ringkas.
- source_word: ἦλθεν
  choice: tiba
  rationale: Dalam konteks tujuan perjalanan, “tiba” merupakan padanan Indonesia yang alami bagi ἦλθεν dan menghindari ketidakalamian sudut pandang antara “datang” dan “pergi”.
- source_word: τὴν ἰδίαν πόλιν
  choice: kota-Nya sendiri
  rationale: Ungkapan ini dipertahankan secara langsung untuk menyatakan hubungan atau keterkaitan Yesus dengan kota tersebut tanpa mempersempit artinya menjadi tempat kelahiran atau kampung halaman.
theological_decisions:
- issue: Rujukan “kota-Nya sendiri”
  choice: Teks utama tidak menyebut nama kota dan mempertahankan ungkapan “kota-Nya sendiri”.
  alternative: Mengidentifikasinya sebagai Kapernaum atau menerjemahkannya “kampung halaman-Nya”.
  rationale: Bahasa Yunani tidak menamai kota itu. Konteks narasi mungkin menunjuk kepada Kapernaum sebagai pangkalan pelayanan Yesus, tetapi identifikasi tersebut tidak boleh dimasukkan secara pasti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Yesus” dipakai untuk memperjelas subjek yang tersirat dalam verba Yunani, karena ayat ini membuka bagian baru dan bahasa Indonesia lebih alami dengan subjek eksplisit. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia.
