  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: id
  text: Ketika Yesus beranjak dari sana, dua orang buta mengikuti-Nya sambil berseru, “Kasihanilah kami, Anak Daud[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Daud” adalah gelar kerajaan-mesianik yang mengidentifikasi Yesus sebagai keturunan Daud yang dijanjikan.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Ketika Yesus beranjak dari sana
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan tindakan utama. “Beranjak dari sana” secara alami menggambarkan Yesus meninggalkan tempat itu dan meneruskan perjalanan.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti-Nya
  rationale: Mengungkapkan arti naratif biasa ἀκολουθέω, yaitu mengikuti secara fisik.
- source_word: δύο τυφλοὶ
  choice: dua orang buta
  rationale: Bentuk maskulin jamak menunjuk kepada dua laki-laki; ungkapan ini alami dan jelas dalam bahasa Indonesia tanpa menjadikan kebutaan sebagai keseluruhan identitas mereka.
- source_word: κράζοντες καὶ λέγοντες
  choice: sambil berseru
  rationale: κράζω menyiratkan seruan yang keras dan mendesak. Dalam bahasa Indonesia, satu verba ujaran sudah secara alami mencakup λέγοντες sehingga terhindar dari susunan kaku “berseru dan berkata” tanpa kehilangan makna.
- source_word: Ἐλέησον ἡμᾶς
  choice: Kasihanilah kami
  rationale: Imperatif aoris ini merupakan permohonan langsung agar Yesus bertindak dengan belas kasihan. “Kasihanilah kami” mempertahankan bentuk permohonan yang ringkas dan khidmat.
- source_word: υἱὲ Δαυίδ
  choice: Anak Daud
  rationale: Mempertahankan gelar tradisional yang memiliki resonansi kerajaan dan mesianik, alih-alih mereduksinya menjadi keterangan silsilah “keturunan Daud”.
theological_decisions:
- issue: Makna mesianik gelar υἱὲ Δαυίδ
  choice: Menerjemahkannya sebagai gelar “Anak Daud” dalam teks utama
  alternative: “Keturunan Daud” atau penjelasan eksplisit “Mesias, Anak Daud”
  rationale: Bahasa Yunani memakai gelar tradisional tanpa uraian tambahan. “Anak Daud” mempertahankan gema kerajaan-mesianiknya sekaligus tidak memasukkan penafsiran eksplisit ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk “-Nya” dipakai sesuai konvensi ejaan untuk rujukan kepada Yesus; seruan dibuat ringkas agar urgensinya terasa.
