  text: And he got up and went away to his house[a].
translation:
  language: id
  text: Ia pun bangun dan pergi ke rumahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur narasi ini, καί menghubungkan tindakan tersebut dengan perintah Yesus sebelumnya. “Lalu” menyampaikan kelanjutan peristiwa secara alami tanpa menambah hubungan sebab-akibat.
- source_word: ἐγερθεὶς
  choice: orang itu bangun
  rationale: Partisip aoris pasif ἐγείρω digunakan dengan makna intransitif. “Bangun” merupakan ungkapan Indonesia yang alami; subjek “orang itu” dinyatakan agar kalimat jelas dan lancar.
- source_word: ἀπῆλθεν
  choice: pulang
  rationale: ἀπέρχομαι menyatakan pergi meninggalkan tempat itu. Karena tujuannya adalah rumahnya sendiri, “pulang” secara alami mencakup tindakan pergi dari sana menuju rumah, tanpa mengubah arah geraknya.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: ke rumahnya
  rationale: εἰς menyatakan gerak menuju atau masuk ke tempat tujuan, sedangkan οἶκος adalah rumah atau tempat tinggal. “Ke rumahnya” mempertahankan gambaran konkret dan tidak memastikan apakah fokusnya pada tiba di rumah atau masuk ke dalamnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bernada naratif. Susunan partisip Yunani dialihkan menjadi dua verba berurutan yang alami dalam bahasa Indonesia. Tidak diperlukan catatan kaki karena alternatif “pergi ke rumahnya” tidak membawa perbedaan makna yang cukup penting untuk edisi pembaca umum.
