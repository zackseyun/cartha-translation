id: MAT.9.18
reference: Matthew 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: id
  text: Sementara Yesus sedang mengatakan hal-hal ini kepada mereka, lihatlah, seorang pemimpin datang dan sujud di hadapan-Nya sambil berkata, “Anak perempuan saya baru saja meninggal. Namun, datanglah dan letakkan tangan-Mu atasnya, maka ia akan hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tampaklah
  rationale: Mempertahankan fungsi penarik perhatian dalam narasi dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: ἄρχων
  choice: seorang pemimpin
  rationale: Istilah Yunani ini tidak merinci jabatan atau lembaga yang dipimpinnya; terjemahan umum mempertahankan ketidakspesifikan itu.
- source_word: προσεκύνει
  choice: sujud di hadapan-Nya
  rationale: Menggambarkan tindakan merendahkan diri atau memberi hormat tanpa menentukan apakah tindakan itu secara khusus merupakan penyembahan ilahi.
- source_word: ἄρτι ἐτελεύτησεν
  choice: baru saja meninggal
  rationale: Menyampaikan aspek waktu ἄρτι dan makna langsung verba tersebut secara wajar dalam bahasa Indonesia.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: letakkan tangan-Mu ke atasnya
  rationale: Mengikuti bentuk tunggal 'tangan' dan tindakan konkret dalam teks sumber.
- source_word: ζήσεται
  choice: ia akan hidup
  rationale: Mempertahankan pernyataan masa depan yang tegas dari sang pemimpin.
theological_decisions:
- issue: Makna προσεκύνει dalam tindakan sang pemimpin kepada Yesus
  choice: sujud di hadapan-Nya
  alternative: menyembah-Nya
  rationale: Verba dapat mencakup penghormatan mendalam maupun penyembahan. Konteks ini tidak dengan sendirinya mewajibkan salah satu pengertian teologis secara eksklusif, sehingga tindakan fisiknya diterjemahkan tanpa mempersempit ambiguitas.
- issue: Kepastian pernyataan καὶ ζήσεται
  choice: maka ia akan hidup
  alternative: maka ia akan hidup kembali
  rationale: Teks mengatakan 'akan hidup' tanpa unsur leksikal eksplisit untuk 'kembali'; terjemahan mempertahankan bentuk ringkas dan keyakinan tegas pembicara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan 'saya' mencerminkan perkataan hormat kepada Yesus; huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambahkan unsur pada teks sumber.
