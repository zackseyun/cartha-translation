  to: Sementara Yesus sedang mengatakan hal-hal ini kepada mereka, lihatlah, seorang pemimpin datang dan sujud di hadapan-Nya sambil berkata, “Anak perempuan saya baru saja meninggal. Namun, datanglah dan letakkan tangan-Mu atasnya, maka ia akan hidup.”
