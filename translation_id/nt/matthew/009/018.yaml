  verdict: revise
  source_fidelity: 'Makna pokok draft setia pada teks Yunani: seorang ἄρχων datang, merendahkan diri di hadapan Yesus, melaporkan bahwa putrinya baru saja meninggal, lalu memohon agar Yesus meletakkan tangan-Nya atas anak itu. Namun, ἰδού terutama berfungsi sebagai penanda perhatian naratif, bukan sebagai pernyataan bahwa sang pemimpin ''tampak''; karena itu perlu diperbaiki.'
  naturalness: '"Tampaklah seorang pemimpin datang" kurang alami dalam bahasa Indonesia modern dan menggeser fungsi ἰδού. "Lihatlah, seorang pemimpin datang" mempertahankan penanda perhatian tersebut dengan jelas. "Sedang mengatakan" juga lebih wajar untuk genitif absolut Ταῦτα αὐτοῦ λαλοῦντος.'
  terminology: '"Seorang pemimpin" tepat karena ἄρχων tidak menyebut jabatan spesifik. "Sujud di hadapan-Nya" dengan aman mempertahankan tindakan hormat tanpa memaksakan makna penyembahan ilahi. "Ia akan hidup" tidak menambahkan unsur "kembali" yang tidak eksplisit dalam ζήσεται.'
