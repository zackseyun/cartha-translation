base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: id
  text: Sebab ia berkata dalam hatinya, “Jika aku hanya menyentuh pakaian-Nya, aku akan diselamatkan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan disembuhkan” atau “aku akan menjadi sehat kembali.” Kata Yunani yang dipakai berarti “diselamatkan,” tetapi dalam konteks ini juga dapat merujuk pada kesembuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: terus berkata
  rationale: Bentuk imperfek menggambarkan ujaran batin yang berlangsung atau berulang; “terus berkata” mempertahankan aspek itu secara wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi narasi di sekitarnya; “sebab” mempertahankan fungsi penjelasnya.
- source_word: ἐν ἑαυτῇ
  choice: dalam hatinya
  rationale: Ungkapan ini menunjuk pada ujaran atau pikiran batin. “Dalam hatinya” merupakan ungkapan Indonesia yang alami dan tidak menyiratkan bahwa ia berbicara kepada orang lain.
- source_word: Ἐὰν μόνον
  choice: Asalkan
  rationale: Gabungan ini menekankan satu syarat minimal. “Asalkan” secara alami menyampaikan gagasan bahwa sentuhan itu saja sudah cukup menurut keyakinannya.
- source_word: ἅψωμαι
  choice: aku menyentuh
  rationale: Aoristus subjungtif setelah ἐάν membentuk syarat yang mengarah ke masa depan; bahasa Indonesia secara alami memakai “menyentuh” tanpa penanda modus khusus.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: pakaian-Nya
  rationale: ἱμάτιον merujuk pada pakaian, khususnya pakaian luar. “Pakaian” cukup luas sehingga tidak menentukan bentuk pakaian secara berlebihan.
- source_word: σωθήσομαι
  choice: aku akan diselamatkan
  rationale: Bentuk pasif futurum dari σῴζω dapat berarti diselamatkan, disembuhkan, atau dipulihkan. Terjemahan utama mempertahankan keluasan leksikal teks Yunani, sedangkan makna penyembuhan dalam konteks dijelaskan melalui catatan kaki.
theological_decisions:
- issue: Terjemahan σωθήσομαι dalam konteks penyembuhan
  choice: aku akan diselamatkan
  alternative: aku akan disembuhkan; aku akan menjadi sehat kembali
  rationale: Konteks langsung menyangkut kesembuhan jasmani, tetapi verba Yunani σῴζω lebih luas daripada istilah medis yang sempit. “Diselamatkan” mempertahankan keluasan dan kemungkinan gema teologisnya tanpa memaksakan penafsiran tertentu; catatan kaki menjelaskan makna kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
