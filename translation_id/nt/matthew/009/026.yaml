  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: id
  text: Dan kabar ini tersebar ke seluruh daerah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke seluruh wilayah itu” atau “di seluruh kawasan itu.” Kata Yunani γῆ dapat berarti tanah, negeri, atau daerah; di sini kemungkinan besar yang dimaksud ialah wilayah sekitar, bukan seluruh bumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Konjungsi ini meneruskan alur narasi secara langsung tanpa menambahkan hubungan sebab-akibat atau urutan waktu yang tidak dinyatakan.
- source_word: ἐξῆλθεν
  choice: tersebar
  rationale: Secara harfiah berarti 'keluar', tetapi bersama φήμη ungkapan ini secara alami menyatakan bahwa sebuah kabar menyebar dari tempat kejadian. 'Tersebar' merupakan padanan Indonesia yang wajar tanpa mengubah cakupan peristiwa.
- source_word: ἡ φήμη αὕτη
  choice: kabar ini
  rationale: φήμη menunjuk pada kabar atau laporan yang beredar; 'kabar' tidak menyiratkan ketidakbenaran seperti yang dapat tersirat dalam 'desas-desus'. αὕτη diterjemahkan 'ini' karena menunjuk pada kabar tentang peristiwa yang baru diceritakan.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: ke seluruh daerah itu
  rationale: Dalam konteks ini γῆ menunjuk pada wilayah sekitar, bukan seluruh bumi. 'Ke seluruh daerah itu' mempertahankan arah εἰς dan cakupan ὅλην dengan bahasa Indonesia yang alami.
