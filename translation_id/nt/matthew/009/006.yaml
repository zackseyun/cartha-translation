  to: Tetapi supaya kamu tahu bahwa Anak Manusia[a] berwenang di bumi untuk mengampuni dosa—lalu Ia berkata kepada orang yang lumpuh itu, “Bangunlah, angkat tempat tidurmu[b], dan pergilah ke rumahmu.”
