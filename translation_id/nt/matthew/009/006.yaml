  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: id
  text: Tetapi supaya kamu tahu bahwa Anak Manusia[a] berwenang di bumi untuk mengampuni dosa—lalu Ia berkata kepada orang yang lumpuh itu, “Bangunlah, angkat tempat tidurmu[b], dan pergilah ke rumahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sang Manusia.” Terjemahan tradisional “Anak Manusia” dipertahankan karena merupakan sebutan khas Yesus dan kemungkinan menggemakan Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: Atau “tilammu.” Kata Yunani κλίνη dapat berarti tempat tidur, dipan, atau alas tidur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Tetapi supaya kamu tahu
  rationale: δέ menandai peralihan atau pertentangan ringan, sedangkan ἵνα memperkenalkan tujuan. Susunan ini mempertahankan keduanya secara wajar dalam bahasa Indonesia.
- source_word: ἐξουσίαν ἔχει
  choice: berwenang
  rationale: ἐξουσία menunjuk pada wewenang atau hak yang sah, bukan sekadar kemampuan. Bentuk 'berwenang' ringkas dan jelas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan tradisional ini mempertahankan sebutan khas yang digunakan Yesus bagi diri-Nya serta kemungkinan gaung Daniel 7.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Frasa ini menunjuk pada ranah tempat wewenang tersebut berlaku dan diterjemahkan secara langsung tanpa mempersempitnya menjadi wilayah atau tanah tertentu.
- source_word: ἀφιέναι ἁμαρτίας
  choice: untuk mengampuni dosa
  rationale: Dalam konteks ini ἀφίημι berarti mengampuni atau menghapuskan tanggungan dosa; 'mengampuni dosa' adalah ungkapan Indonesia yang tepat dan lazim.
- source_word: τότε λέγει τῷ παραλυτικῷ
  choice: lalu Ia berkata kepada orang lumpuh itu
  rationale: λέγει adalah bentuk kini historis, tetapi bahasa Indonesia tidak menandai kala secara morfologis; 'berkata' menyampaikan tindakan naratif dengan alami. παραλυτικός substantival diterjemahkan secara umum dan mudah dipahami sebagai 'orang lumpuh'.
- source_word: Ἐγερθεὶς
  choice: Bangunlah
  rationale: Partisip aoris ini berfungsi seperti perintah dalam rangkaian perintah. 'Bangunlah' mempertahankan daya suruhnya dalam bahasa Indonesia yang wajar.
- source_word: ἆρόν σου τὴν κλίνην
  choice: angkat tempat tidurmu
  rationale: αἴρω berarti mengangkat atau membawa, sementara κλίνη dapat menunjuk pada tempat tidur, dipan, atau tilam. 'Angkat tempat tidurmu' cukup luas dan mempertahankan gambaran tindakan itu.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: pergilah ke rumahmu
  rationale: Terjemahan ini mengikuti perintah ὕπαγε dan arti dasar οἶκος secara dekat tanpa menambahkan gagasan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Gelar Kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Pilihan tradisional mempertahankan bentuk gelar Yesus dan kemungkinan kaitannya dengan Daniel 7, tanpa menutup ambiguitas antara ungkapan kemanusiaan dan gelar eskatologis.
- issue: Sifat ἐξουσία dalam pengampunan dosa
  choice: berwenang
  alternative: berkuasa
  rationale: Ayat ini menekankan kewenangan yang sah untuk mengampuni dosa, bukan hanya daya atau kemampuan melakukan mukjizat. 'Berwenang' menjaga pembedaan itu tanpa memperluas klaim ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kamu' tetap dipakai karena bentuk Yunani εἰδῆτε adalah orang kedua jamak. Huruf kapital pada 'Ia' mengikuti register Alkitab Indonesia yang umum tanpa menambahkan keterangan teologis. Tanda pisah mempertahankan interupsi naratif dalam ucapan Yesus.
