id: MAT.9.31
reference: Matthew 9:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: id
  text: Namun, setelah mereka keluar, mereka menyebarkan kabar tentang dia ke seluruh daerah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke seluruh negeri itu.” Kata Yunani γῆ dapat berarti “tanah,” “negeri,” “wilayah,” atau “daerah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan larangan Yesus pada ayat sebelumnya sekaligus mempertahankan alur narasi secara wajar.
- source_word: ἐξελθόντες
  choice: setelah mereka keluar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama; bentuk ini mempertahankan urutan waktunya dalam bahasa Indonesia yang alami.
- source_word: διεφήμισαν
  choice: mereka menyebarkan kabar
  rationale: Kata kerja ini berarti menyebarluaskan berita atau membuat sesuatu dikenal; ungkapan ini alami dan menangkap gagasan publikasi secara luas.
- source_word: αὐτὸν
  choice: tentang dia
  rationale: Dengan frasa 'menyebarkan kabar', objek langsung Yunani paling alami dialihkan menjadi isi kabar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: ke seluruh daerah itu
  rationale: γῆ dapat berarti tanah, negeri, wilayah, atau daerah. Dalam konteks geografis setempat ini, 'daerah' menyampaikan cakupan lokal dengan alami, sedangkan 'ke seluruh' menangkap penyebaran kabar di segenap kawasan tersebut.
theological_decisions:
- issue: Cakupan geografis γῆ
  choice: daerah
  alternative: negeri
  rationale: Konteksnya menggambarkan tersebarnya kabar tentang Yesus dalam kawasan setempat. 'Daerah' tidak melebih-lebihkan cakupan geografis, sementara kemungkinan arti 'negeri' tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat sederhana, alami, dan bermartabat. Kata ganti 'dia' ditulis dengan huruf kecil sesuai kaidah umum dan tanpa memasukkan konvensi teologis tambahan. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
