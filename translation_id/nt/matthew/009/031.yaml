  source_fidelity: 'Terjemahan secara tepat mencerminkan urutan dan makna teks Yunani: δὲ sebagai kontras naratif ringan (“Namun”), partisip aoris ἐξελθόντες sebagai tindakan pendahuluan (“setelah mereka keluar”), διεφήμισαν sebagai penyebarluasan berita, αὐτόν sebagai acuan isi berita (“tentang dia”), dan cakupan lokal ἐν ὅλῃ τῇ γῇ ἐκείνῃ sebagai “ke seluruh daerah itu.”'
