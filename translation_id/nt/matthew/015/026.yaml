base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: id
  text: Namun Ia menjawab, “Tidak patut mengambil roti anak-anak dan melemparkannya kepada anjing-anjing kecil[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anjing-anjing rumahan” atau “anak-anak anjing”; bahasa Yunani memakai bentuk diminutif yang menonjolkan anjing kecil dan dalam konteks ini mungkin juga mengacu kepada anjing peliharaan rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Gabungan partisip dan verba finit ini secara harfiah berarti ‘setelah menjawab, Ia berkata’, tetapi merupakan ungkapan Yunani bercorak Semitis yang secara alami dan tepat diringkas dalam bahasa Indonesia menjadi ‘Ia menjawab’.
- source_word: καλὸν
  choice: patut
  rationale: Dalam ungkapan ini, καλόν menyatakan kepantasan atau kelayakan, bukan sekadar kebaikan moral. ‘Patut’ menyampaikan nuansa itu secara wajar.
- source_word: λαβεῖν
  choice: mengambil
  rationale: Infinitif ini menunjuk pada tindakan mengambil sesuatu; ‘mengambil’ merupakan padanan langsung dan sesuai konteks.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: roti anak-anak
  rationale: ‘Roti’ mempertahankan gambaran konkret dalam metafora, sedangkan τέκνα bersifat inklusif gender dan tepat diterjemahkan ‘anak-anak’.
- source_word: βαλεῖν
  choice: melemparkannya
  rationale: Verba βάλλω berarti ‘melemparkan’. Bentuk dengan akhiran ‘-nya’ secara alami merujuk kembali kepada roti dan mempertahankan ketajaman gambaran tersebut.
- source_word: κυναρίοις
  choice: anjing-anjing kecil
  rationale: Bentuk diminutif κυνάρια menunjuk kepada anjing kecil dan mungkin anjing peliharaan rumah. ‘Anjing-anjing kecil’ mempertahankan nuansa bentuk sumber tanpa menetapkan secara pasti bahwa yang dimaksud adalah anak anjing atau anjing rumahan.
theological_decisions:
- issue: Metafora tentang anak-anak dan anjing dapat ditafsirkan sebagai rujukan kepada kelompok-kelompok dalam konteks sekitarnya, tetapi ayat ini sendiri tidak menjelaskan semua rujukannya.
  choice: Mempertahankan metafora secara langsung sebagai ‘roti anak-anak’ dan ‘anjing-anjing kecil’.
  alternative: Menjelaskan referen etnis atau teologis metafora itu langsung di dalam teks.
  rationale: Terjemahan ini mempertahankan daya dan ketegangan perkataan Yesus tanpa memasukkan penafsiran tambahan mengenai identitas pihak-pihak dalam metafora atau nada ucapan-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Namun’ menandai tanggapan yang berlawanan dalam konteks; ‘tidak patut’ alami bagi pembaca masa kini. Pronomina ‘Ia’ mengikuti register Alkitab Indonesia yang hormat tanpa menambahkan gelar yang tidak terdapat dalam ayat.
