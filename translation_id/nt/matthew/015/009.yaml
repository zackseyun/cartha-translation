  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: id
  text: Namun, mereka menyembah Aku dengan sia-sia, sambil mengajarkan perintah-perintah manusia sebagai ajaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengajarkan ajaran-ajaran yang berupa perintah-perintah manusia.”'
    reason: Ungkapan Yunani padat; kata “ajaran-ajaran” dan “perintah-perintah manusia” dapat dipahami dalam hubungan aposisional.
lexical_decisions:
- source_word: μάτην
  choice: sia-sia
  rationale: Mengungkapkan makna ‘tanpa hasil/tujuan’ secara alami dan tetap mempertahankan nada teguran nubuat.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kelanjutan dengan pertentangan ringan dalam konteks teguran.
- source_word: σέβονταί με
  choice: mereka menyembah Aku
  rationale: σέβομαι dengan objek Allah menunjuk pada penghormatan religius atau penyembahan; ‘menyembah’ adalah padanan Indonesia yang paling wajar.
- source_word: διδάσκοντες
  choice: dengan mengajarkan
  rationale: Partisipel kini menyatakan cara atau keadaan yang menyertai penyembahan mereka, tanpa memaksakan nuansa waktu.
- source_word: διδασκαλίας
  choice: sebagai ajaran
  rationale: Menunjukkan bahwa perintah manusia diajarkan dengan kedudukan sebagai ajaran berotoritas, sambil menjaga hubungan sintaksis yang padat dalam bahasa Yunani.
- source_word: ἐντάλματα
  choice: perintah-perintah
  rationale: Mengacu pada ketetapan atau perintah yang diwajibkan; bentuk ulang mempertahankan makna jamak.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Istilah ini bersifat generik dan menekankan asal manusiawi sebagai lawan dari asal ilahi, bukan jenis kelamin laki-laki.
theological_decisions:
- issue: Hubungan διδασκαλίας dengan ἐντάλματα ἀνθρώπων
  choice: mengajarkan perintah-perintah manusia sebagai ajaran
  alternative: mengajarkan ajaran-ajaran yang merupakan perintah-perintah manusia
  rationale: Pilihan utama menyampaikan bahwa perintah manusia diberi status sebagai ajaran, tetapi catatan kaki mempertahankan kemungkinan hubungan aposisional dalam ungkapan Yunani yang padat.
- issue: Daya generik ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: ‘Manusia’ secara alami mencakup semua orang dan mempertahankan pertentangan teologis antara sumber manusiawi dan sumber ilahi tanpa memasukkan pembedaan gender yang tidak dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada ‘Aku’ mengikuti rujukan langsung kepada Allah dalam kutipan. Susunan kalimat dibuat alami tanpa menghilangkan ketegangan antara penyembahan kepada Allah dan otoritas yang diberikan kepada perintah manusia.
