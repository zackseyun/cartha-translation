    issue: '"turun ke perut" untuk χωρεῖ'
    rationale: χωρεῖ menyatakan bergerak atau masuk ke perut; gagasan gerak "turun" tidak eksplisit dalam teks Yunani. "Masuk ke perut" menerjemahkan makna tanpa penambahan arah.
  - severity: low
    issue: '"dibuang ke jamban" untuk ἐκβάλλεται'
    rationale: Kata Yunani pasif ini menggambarkan sesuatu yang dikeluarkan/terbuang dari tubuh ke ἀφεδρών. "Dikeluarkan" lebih dekat dengan proses yang dimaksud dan kurang mengesankan tindakan membuang secara sengaja.
  revised_text: Tidakkah kalian mengerti bahwa segala sesuatu yang masuk ke dalam mulut masuk ke perut, kemudian dikeluarkan ke jamban?[a]
