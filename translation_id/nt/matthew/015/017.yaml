  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: id
  text: Tidakkah kalian mengerti bahwa segala sesuatu yang masuk ke dalam mulut masuk ke perut, kemudian dikeluarkan ke jamban?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa pun yang masuk ke dalam mulut ... dikeluarkan ke kakus.”
    reason: Alternatif leksikal untuk konstruksi generik πᾶν τὸ εἰσπορευόμενον dan ἀφεδρών.
lexical_decisions:
- source_word: νοεῖτε
  choice: mengerti
  rationale: Dalam konteks ini, νοέω menunjuk pada pemahaman mental atas maksud Yesus. 'Mengerti' alami dalam bahasa Indonesia modern dan sesuai dengan nada pertanyaan yang menegur.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: segala sesuatu yang masuk
  rationale: Konstruksi partisip berartikel yang netral dan generik ini mencakup apa pun yang masuk melalui proses makan. Ungkapan ini mempertahankan cakupan umum teks.
- source_word: εἰς τὸ στόμα
  choice: ke dalam mulut
  rationale: εἰς menyatakan gerak masuk; 'ke dalam mulut' menyampaikan gambaran fisiknya secara langsung.
- source_word: κοιλίαν
  choice: perut
  rationale: Dalam konteks pencernaan, κοιλία menunjuk pada bagian dalam tubuh atau perut. 'Perut' lebih alami dan tidak terlalu teknis bagi pembaca Indonesia daripada 'lambung', tanpa menuntut ketepatan anatomi yang tidak dimaksudkan teks.
- source_word: χωρεῖ
  choice: turun ke
  rationale: χωρέω di sini menggambarkan makanan yang bergerak masuk dalam saluran pencernaan. 'Turun ke perut' merupakan ungkapan Indonesia yang alami dan menjaga urutan gambaran tersebut.
- source_word: ἀφεδρῶνα
  choice: jamban
  rationale: ἀφεδρών menunjuk pada tempat pembuangan kotoran, yakni jamban atau kakus. 'Jamban' akurat, bermartabat, dan cukup dikenal dalam bahasa Indonesia.
- source_word: ἐκβάλλεται
  choice: dibuang
  rationale: Bentuk pasifnya menyoroti hasil akhir proses pencernaan. 'Dibuang' jelas dan alami, sekaligus mempertahankan gagasan pengeluaran tanpa menjadi kasar.
theological_decisions:
- issue: Hubungan perkataan Yesus dengan hukum kenajisan ritual
  choice: Menerjemahkan pernyataan fisiologis ini apa adanya tanpa menambahkan rumusan bahwa semua makanan dinyatakan halal atau tahir.
  alternative: Menambahkan penjelasan interpretatif bahwa dengan demikian semua makanan dinyatakan halal atau tahir.
  rationale: Ayat ini menyatakan proses pencernaan sebagai bagian dari argumen Yesus mengenai apa yang menajiskan manusia, tetapi tidak memuat komentar interpretatif yang terdapat dalam Markus 7:19. Terjemahan tidak menambahkan kesimpulan teologis yang tidak dinyatakan secara eksplisit di ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kalian' dipakai karena verba Yunani νοεῖτε berpersona kedua jamak. Tanda tanya mempertahankan bentuk pertanyaan retoris. Penanda catatan kaki [a] dicantumkan dalam teks utama.
