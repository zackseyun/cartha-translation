  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: id
  text: Namun, Ia menjawab mereka, “Mengapa kalian juga melanggar perintah Allah karena tradisi kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Namun, Ia menjawab mereka
  rationale: Konstruksi partisip + verba finit merupakan ungkapan Yunani bercorak Semitik. Dalam bahasa Indonesia modern, ‘menjawab mereka’ menyampaikan maknanya secara wajar; δέ diterjemahkan ‘Namun’ untuk menandai tanggapan yang berlawanan arah.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif alami untuk menanyakan alasan.
- source_word: καὶ ὑμεῖς
  choice: kalian juga
  rationale: 'Mempertahankan kaitan retoris dengan tuduhan sebelumnya: mereka pun melakukan pelanggaran. ‘Kalian’ membedakan bentuk jamak yang jelas dalam bahasa Indonesia.'
- source_word: παραβαίνετε
  choice: melanggar
  rationale: Secara tepat menyatakan tindakan menyalahi atau menerobos batas suatu perintah, dengan ragam modern yang tetap bermartabat.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: perintah Allah
  rationale: ‘Perintah’ merupakan padanan alami bagi ἐντολή dan mempertahankan sumber kewenangannya, yaitu Allah.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: demi tradisi kalian
  rationale: διά dengan akusatif dapat menyatakan alasan atau kepentingan. ‘Demi’ mempertahankan kemungkinan bahwa tradisi itu bukan hanya penyebab, melainkan hal yang mereka utamakan sehingga melanggar perintah Allah.
theological_decisions:
- issue: Kontras antara kewenangan ilahi dan tradisi manusia
  choice: perintah Allah … tradisi kalian
  alternative: perintah Allah … adat atau ajaran kalian
  rationale: ‘Tradisi’ mempertahankan gagasan sesuatu yang diteruskan dan membuat teguran ini khusus pada tradisi mereka yang sedang dipersoalkan, tanpa menyiratkan bahwa semua tradisi pasti salah.
- issue: Nuansa διά dengan akusatif
  choice: demi tradisi kalian
  alternative: karena tradisi kalian
  rationale: ‘Demi’ mempertahankan nuansa bahwa mereka mengutamakan tradisi itu, sedangkan ‘karena’ hanya menonjolkan sebab. Keduanya dimungkinkan, tetapi konteks kontras kewenangan mendukung ‘demi’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti jamak ‘kalian’ dipakai karena Yesus berbicara kepada sekelompok orang; kapitalisasi ‘Ia’ mengikuti ragam Alkitab Indonesia yang lazim tanpa menambah isi pada teks sumber.
