  naturalness: '"Kemudian, orang Farisi dan ahli Taurat dari Yerusalem datang kepada Yesus dan berkata," merupakan bahasa Indonesia baku, alami, dan cukup jelas. Dalam penggunaan Indonesia, nama kelompok "orang Farisi" dan jabatan/kelompok "ahli Taurat" dapat berfungsi secara kolektif tanpa reduplikasi yang terasa berat.'
