  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: id
  text: Kemudian, orang Farisi dan ahli Taurat dari Yerusalem datang kepada Yesus dan berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu dan wacana yang secara alami membuka episode berikutnya dalam narasi.
- source_word: προσέρχονται
  choice: datang kepada
  rationale: Mengungkapkan gerak mendekati seseorang dengan bahasa Indonesia yang alami; bentuk kini historis dialihkan ke bentuk naratif Indonesia yang tidak menandai kala secara gramatikal.
- source_word: τῷ Ἰησοῦ
  choice: kepada Yesus
  rationale: Datif menandai orang yang didekati.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: dari Yerusalem
  rationale: ἀπό menyatakan asal; frasa ini tidak dibuat lebih spesifik seolah-olah menunjukkan utusan resmi.
- source_word: Φαρισαῖοι
  choice: orang Farisi
  rationale: Sebutan historis-keagamaan yang lazim dalam bahasa Indonesia; kata 'orang' memperjelas bahwa yang dimaksud ialah sejumlah anggota kelompok tersebut.
- source_word: γραμματεῖς
  choice: ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk para pakar hukum Kitab Suci; padanan ini lebih jelas bagi pembaca Indonesia modern daripada 'juru tulis'.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan kedua kelompok secara sederhana.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel ini memperkenalkan ucapan langsung pada ayat berikutnya; konstruksi verba berurutan lebih alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk kini historis dalam narasi
  choice: 'Diterjemahkan dengan verba Indonesia tanpa penanda waktu eksplisit: ''datang ... dan berkata'''
  alternative: Menambahkan nuansa kini, misalnya 'datanglah ... lalu berkata'
  rationale: Bahasa Indonesia tidak menginfleksikan verba menurut kala. Bentuk yang dipilih menjaga alur dan kedekatan naratif tanpa menambahkan penanda aspek yang tidak ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'beberapa orang Farisi dan ahli Taurat dari Yerusalem' dipakai agar jelas bahwa subjeknya tidak harus mencakup seluruh kelompok. Tidak diperlukan catatan kaki karena 'ahli Taurat' menyampaikan fungsi γραμματεῖς secara wajar dalam konteks ini.
