id: MAT.15.32
reference: Matthew 15:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: id
  text: Lalu Yesus memanggil murid-murid-Nya mendekat dan berkata, “Aku berbelas kasihan kepada orang banyak,[a] karena mereka sudah tiga hari tetap bersama-Ku dan tidak mempunyai apa pun untuk dimakan. Aku tidak mau menyuruh mereka pergi tanpa makan,[b] nanti mereka kehabisan tenaga di jalan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Hati-Ku tergerak oleh belas kasihan kepada orang banyak.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang digunakan secara harfiah berarti “dalam keadaan berpuasa” atau “tanpa makanan”; di sini maksudnya belum makan, bukan sedang menjalankan puasa keagamaan.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “nanti mereka pingsan di jalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil ... untuk mendekat
  rationale: Partisipel medial ini menggambarkan Yesus memanggil para murid kepada diri-Nya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa arah tersebut.
- source_word: Σπλαγχνίζομαι
  choice: Aku berbelaskasihan
  rationale: Kata kerja ini menyatakan belas kasihan yang mendalam. Pilihan ini jelas, bermartabat, dan mempertahankan kekuatan emosional teks.
- source_word: ὄχλον
  choice: orang banyak ini
  rationale: Dalam konteks naratif ini, frasa tersebut merupakan padanan Indonesia yang alami bagi kelompok besar yang sedang bersama Yesus; kata penunjuk memperjelas kelompok yang dimaksud tanpa mengubah acuannya.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: sudah tiga hari mereka tetap bersama-Ku
  rationale: Terjemahan ini mempertahankan gagasan bahwa mereka terus berada bersama Yesus selama tiga hari.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: mereka tidak mempunyai apa pun untuk dimakan
  rationale: Ini menyampaikan secara alami bahwa mereka tidak memiliki makanan.
- source_word: ἀπολῦσαι
  choice: menyuruh mereka pulang
  rationale: Dalam konteks membubarkan orang banyak agar mereka pergi, pilihan ini lebih alami daripada 'melepaskan' dan menyampaikan arah perjalanan yang tersirat oleh kekhawatiran Yesus mengenai jalan.
- source_word: νήστεις
  choice: tanpa makan
  rationale: Kata ini secara harfiah berarti berpuasa atau belum makan. 'Tanpa makan' mempertahankan keadaan mereka tanpa menyiratkan puasa keagamaan yang disengaja.
- source_word: μήποτε
  choice: supaya ... jangan
  rationale: Konstruksi ini secara alami menyampaikan akibat yang dikhawatirkan dalam bahasa Indonesia.
- source_word: ἐκλυθῶσιν
  choice: kehabisan tenaga
  rationale: Dalam konteks perjalanan, verba ini dapat menyatakan menjadi lemah atau lunglai. Pilihan ini mempertahankan makna tanpa memastikan bahwa mereka benar-benar akan pingsan.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Ungkapan ini alami dan merujuk pada perjalanan mereka setelah meninggalkan tempat itu.
theological_decisions: []
