  to: Lalu Yesus memanggil murid-murid-Nya mendekat dan berkata, “Aku berbelas kasihan kepada orang banyak,[a] karena mereka sudah tiga hari tetap bersama-Ku dan tidak mempunyai apa pun untuk dimakan. Aku tidak mau menyuruh mereka pergi tanpa makan,[b] nanti mereka kehabisan tenaga di jalan.”[c]
