  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk sapaan ilahi memakai kapital pada enklitik “-Nya” dan “-Ku” sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur sebab dan akibat dipertahankan, sementara urutan klausa dibuat alami tanpa menghilangkan ketegangan leksikal pada νήστεις dan ἐκλυθῶσιν.
