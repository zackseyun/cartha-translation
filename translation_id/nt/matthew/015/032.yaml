    issue: “Menyuruh mereka pulang” menerjemahkan ἀπολῦσαι terlalu khusus.
    rationale: Verba ini berarti menyuruh pergi atau membubarkan. Walaupun orang banyak mungkin akan pulang, tujuan mereka tidak disebutkan dalam teks sumber.
  - severity: low
    issue: “Orang banyak ini” menambahkan kata penunjuk yang tidak ada dalam teks sumber.
    rationale: Tambahan ini tidak mengubah makna pokok, tetapi “orang banyak” lebih dekat dengan ὄχλον dan lebih ekonomis.
  - severity: low
    issue: Konstruksi “supaya mereka jangan” kurang langsung menyatakan hasil yang dikhawatirkan.
    rationale: μήποτε menandai kekhawatiran akan kemungkinan akibat. “Nanti mereka kehabisan tenaga” lebih idiomatis dalam bahasa Indonesia modern dan mempertahankan nuansa tersebut.
