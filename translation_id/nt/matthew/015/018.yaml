  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: id
  text: Namun, hal-hal yang keluar dari mulut berasal dari hati, dan hal-hal itulah yang menajiskan manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat manusia menjadi najis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: hal-hal yang keluar
  rationale: Partisipel netral jamak ini berfungsi sebagai nomina dan menunjuk secara umum pada apa yang keluar, khususnya perkataan dalam konteks ini. Bentuk "hal-hal yang keluar" mempertahankan gambaran konkret dan nuansa jamaknya.
- source_word: στόματος
  choice: mulut
  rationale: Padanan langsung ini mempertahankan gambaran jasmani yang dipakai Yesus dan sesuai dengan konteks perkataan.
- source_word: καρδίας
  choice: hati
  rationale: Dalam antropologi Alkitab, "hati" menunjuk pada batin manusia, termasuk pikiran, kehendak, dan niat moral. Padanan baku ini mempertahankan keluasan maknanya.
- source_word: ἐξέρχεται
  choice: berasal
  rationale: Dalam susunan ini kata kerja tersebut menyatakan sumber dari hal-hal yang keluar dari mulut. "Berasal dari hati" alami dalam bahasa Indonesia tanpa menghilangkan hubungan asal yang dinyatakan teks Yunani.
- source_word: κἀκεῖνα
  choice: dan hal-hal itulah
  rationale: Bentuk ini berarti "dan hal-hal itu" serta merujuk kembali secara tegas kepada hal-hal yang keluar dari mulut. Partikel "-lah" menampilkan penekanan anaforisnya secara alami.
- source_word: κοινοῖ
  choice: menajiskan
  rationale: Dalam konteks kenajisan, κοινόω berarti menjadikan najis atau mencemarkan. "Menajiskan" mempertahankan kaitan dengan kategori kenajisan yang sedang diperdebatkan, sementara alternatif yang lebih analitis dicatat dalam catatan kaki.
- source_word: τὸν ἄνθρωπον
  choice: manusia
  rationale: Kata benda tunggal ini dipakai secara representatif untuk manusia pada umumnya. Bahasa Indonesia secara alami memakai "manusia" tanpa membatasi rujukannya pada laki-laki dan tetap mempertahankan bentuk tunggal kolektif.
theological_decisions:
- issue: Sumber batiniah kenajisan moral
  choice: Ayat ini menyatakan bahwa hal-hal yang menajiskan manusia berasal dari hati dan keluar melalui mulut.
  alternative: Membatasi maknanya hanya pada kenajisan ritual yang disebabkan oleh ucapan.
  rationale: Konteks terdekat mempertentangkan apa yang masuk dari luar dengan apa yang keluar dari dalam. Pemakaian "hati" dan "menajiskan" mempertahankan baik dimensi batiniah-moral maupun bahasa kenajisan tanpa mereduksinya menjadi satu kategori saja.
- issue: Cakupan generik τὸν ἄνθρωπον
  choice: manusia
  alternative: orang itu; laki-laki itu
  rationale: Bentuk tunggal Yunani bersifat representatif dan merujuk kepada manusia secara umum, bukan khusus kepada seorang laki-laki. "Manusia" menyampaikan cakupan tersebut dengan wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan pengulangan gambaran “keluar dari mulut” dan “berasal dari hati,” sedangkan “hal-hal itulah” menegaskan rujukan κἀκεῖνα secara alami.
