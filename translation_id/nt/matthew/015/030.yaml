  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sebutan bagi penyandang disabilitas dibuat jelas tanpa ungkapan yang tidak perlu terasa kasar. Struktur kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dibaca, dan seluruh penanda catatan kaki muncul dalam teks utama.
