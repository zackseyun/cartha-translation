  to: Banyak orang datang berbondong-bondong kepada-Nya sambil membawa orang bisu[a], orang buta, orang lumpuh, orang dengan anggota tubuh cacat[b], dan banyak orang lain. Mereka meletakkan orang-orang itu di dekat kaki Yesus, dan Ia menyembuhkan mereka.
