id: MAT.15.30
reference: Matthew 15:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: id
  text: Banyak orang datang berbondong-bondong kepada-Nya sambil membawa orang bisu[a], orang buta, orang lumpuh, orang dengan anggota tubuh cacat[b], dan banyak orang lain. Mereka meletakkan orang-orang itu di dekat kaki Yesus, dan Ia menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang tuli.” Kata Yunani κωφούς dapat mengacu kepada orang yang tuli, bisu, atau keduanya, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani κυλλούς mengacu secara luas kepada orang yang anggota tubuhnya tidak sempurna bentuknya, rusak, atau tidak berfungsi dengan baik.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: datang kepada-Nya
  rationale: Mengungkapkan gerak mendekati Yesus secara alami dalam narasi Indonesia.
- source_word: ὄχλοι πολλοὶ
  choice: orang banyak berbondong-bondong
  rationale: Ungkapan idiomatis ini menyampaikan banyaknya orang yang datang, tanpa frasa kaku 'banyak kerumunan'.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: sambil membawa
  rationale: Dalam konteks, mereka bukan sekadar bersama orang-orang tersebut, tetapi membawa mereka kepada Yesus.
- source_word: κωφούς
  choice: orang bisu
  rationale: κωφός dapat berarti bisu, tuli, atau keduanya. 'Orang bisu' cocok dengan konteks daftar penyembuhan, sementara ambiguitas leksikal dipertahankan dalam catatan kaki.
- source_word: τυφλούς
  choice: orang buta
  rationale: Padanan Indonesia yang langsung dan lazim untuk τυφλός.
- source_word: χωλούς
  choice: orang lumpuh
  rationale: Padanan ringkas dan umum untuk orang yang mengalami gangguan berjalan; dalam daftar ini dibedakan dari κυλλούς.
- source_word: κυλλούς
  choice: orang yang anggota tubuhnya cacat
  rationale: Menyampaikan gangguan, cacat bentuk, atau kehilangan fungsi anggota tubuh tanpa memakai sebutan yang terdengar merendahkan.
- source_word: ἑτέρους πολλούς
  choice: banyak orang lain
  rationale: Padanan alami yang menunjukkan masih ada banyak penderita lain di luar kelompok yang disebutkan.
- source_word: ἔρριψαν
  choice: membaringkan
  rationale: Walau verba ini secara harfiah dapat berarti 'melemparkan', konteks membawa orang sakit mendukung tindakan menaruh atau membaringkan mereka, bukan perlakuan kasar.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: di dekat kaki Yesus
  rationale: παρά dengan akusatif di sini menunjukkan penempatan di sisi atau dekat kaki-Nya. Nama 'Yesus' memperjelas rujukan pronomina secara alami.
- source_word: ἐθεράπευσεν αὐτούς
  choice: Ia menyembuhkan mereka
  rationale: Padanan baku dan jelas bagi tindakan penyembuhan dalam narasi Injil.
