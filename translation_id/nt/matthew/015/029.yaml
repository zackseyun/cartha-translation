  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: id
  text: Setelah berangkat dari sana, Yesus datang ke tepi[a] Danau Galilea, lalu setelah naik ke gunung, ia duduk di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyusuri Danau Galilea.” Kata depan Yunani yang dipakai dapat menunjukkan gerakan sepanjang sisi danau atau kedatangan di tepinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς
  choice: setelah berangkat
  rationale: Partisip aoris menandai tindakan yang mendahului verba utama; ungkapan ini menyampaikan urutan secara alami dalam bahasa Indonesia.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia tempat ini menunjukkan gerak meninggalkan lokasi sebelumnya.
- source_word: ἦλθεν
  choice: tiba
  rationale: Dalam konteks gerak menuju kawasan danau, 'tiba' menyampaikan tercapainya lokasi secara wajar tanpa menentukan sudut pandang 'datang' atau 'pergi'.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: di sepanjang Danau Galilea
  rationale: παρά dengan akusatif bersama verba gerak dapat menunjuk gerakan sepanjang atau menuju sisi danau. 'Di sepanjang' mempertahankan nuansa lintasan, sementara alternatif lokasi statis dicatat dalam catatan kaki.
- source_word: ἀναβὰς
  choice: setelah naik
  rationale: Partisip aoris menunjukkan tindakan naik yang mendahului tindakan duduk.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung itu
  rationale: εἰς menyatakan arah atau tujuan gerak. 'Gunung itu' mempertahankan artikelnya tanpa menyiratkan nama tertentu.
- source_word: ἐκάθητο
  choice: ia duduk
  rationale: Imperfek menggambarkan keadaan atau tindakan yang sedang berlangsung, tetapi bahasa Indonesia lazim memakai bentuk sederhana 'duduk'; nuansa duratif tidak perlu dipaksakan karena konteks dapat menampungnya.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan langsung dan alami bagi adverbia tempat ini.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku bahasa Indonesia.
