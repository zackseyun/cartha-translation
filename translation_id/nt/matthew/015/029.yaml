translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Danau Galilea' dipilih sebagai sebutan geografis alami dalam bahasa Indonesia untuk θάλασσα τῆς Γαλιλαίας. Pronomina 'ia' menjaga alur tanpa mengulang nama Yesus.
