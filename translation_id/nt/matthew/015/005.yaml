  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: id
  text: Tetapi kalian berkata, “Siapa pun yang berkata kepada ayah atau ibunya, ‘Apa pun yang dapat engkau terima dariku adalah pemberian[a],’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan”. Maksudnya, apa yang dapat digunakan untuk menopang orang tua dinyatakan telah dikhususkan bagi Allah; bandingkan Markus 7:11, yang memakai istilah “Korban”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Tetapi kalian berkata
  rationale: δὲ menyatakan pertentangan dengan perintah Allah yang dikutip sebelumnya. ὑμεῖς bersifat jamak dan ditegaskan, sehingga 'kalian' mempertahankan kontras itu secara alami.
- source_word: Ὃς ἂν εἴπῃ
  choice: Siapa pun yang berkata
  rationale: Konstruksi pronomina relatif dengan ἄν dan subjungtif aoris menyatakan keadaan umum yang tidak tertentu; ungkapan ini alami dalam bahasa Indonesia.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: kepada ayah atau ibunya
  rationale: Kasus datif menandai pihak yang diajak bicara. Akhiran '-nya' menyampaikan hubungan orang tua dengan orang yang berkata tanpa memaksakan gender dalam bahasa Indonesia.
- source_word: Δῶρον
  choice: persembahan
  rationale: Dalam konteks ini δῶρον adalah sesuatu yang dinyatakan sebagai pemberian yang diperuntukkan bagi Allah. 'Persembahan' menyampaikan nuansa kultis tersebut lebih jelas daripada 'pemberian', tanpa memasukkan istilah 'Korban' dari Markus 7:11.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Apa pun yang seharusnya dapat kauterima dariku
  rationale: Frasa ini menunjuk pada manfaat atau bantuan yang semestinya dapat diperoleh orang tua dari anaknya. 'Kauterima' menghasilkan bahasa Indonesia yang alami, sedangkan 'dariku' mempertahankan arah ἐξ ἐμοῦ.
theological_decisions:
- issue: Apakah istilah teknis 'Korban' dari Markus 7:11 perlu dimasukkan ke dalam teks Matius
  choice: Memakai 'persembahan' sesuai δῶρον dalam Matius
  alternative: Korban; pemberian yang dipersembahkan kepada Allah
  rationale: Matius memakai δῶρον, bukan κορβᾶν. Terjemahan mempertahankan pilihan leksikal Matius, sementara makna pengkhususannya bagi Allah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk mempertahankan ὑμεῖς yang eksplisit. Bentuk 'kauterima' dipakai sebagai bentuk baku dan ringkas dalam kutipan langsung. Kalimat sengaja dibiarkan terbuka karena ayat ini berlanjut ke ayat berikutnya.
