base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: id
  text: sehingga orang banyak takjub melihat orang bisu berbicara[a], orang yang anggota tubuhnya cacat menjadi sehat[b], orang lumpuh berjalan, dan orang buta melihat; dan mereka memuliakan Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang tuli berbicara.” Kata Yunani ini dapat berarti tuli atau bisu; di sini “bisu” dipilih karena yang langsung ditekankan ialah kemampuan berbicara.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang yang anggota tubuhnya cacat dipulihkan” atau “orang yang anggota tubuhnya cacat menjadi utuh.” Ungkapan Yunani menggambarkan orang dengan anggota tubuh yang cacat atau rusak menjadi sehat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai hasil dari rangkaian penyembuhan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: Padanan naratif yang umum, jelas, dan bermartabat untuk ὄχλος.
- source_word: θαυμάσαι
  choice: takjub
  rationale: Menyampaikan reaksi keheranan yang kuat sebagai akibat dari mukjizat-mukjizat itu.
- source_word: βλέποντας
  choice: ketika melihat
  rationale: Partisip ini menerangkan keadaan yang melatarbelakangi ketakjuban orang banyak.
- source_word: κωφοὺς λαλοῦντας
  choice: orang bisu berbicara
  rationale: κωφός dapat berarti tuli atau bisu, tetapi pasangan dengan λαλοῦντας menonjolkan pulihnya kemampuan berbicara.
- source_word: κυλλοὺς ὑγιεῖς
  choice: orang yang anggota tubuhnya cacat menjadi sehat
  rationale: Mengungkap kondisi anggota tubuh yang rusak atau tidak berfungsi dan keadaan sehat yang tampak sesudah penyembuhan, tanpa menyamakan kelompok ini dengan χωλοί.
- source_word: χωλοὺς περιπατοῦντας
  choice: orang lumpuh berjalan
  rationale: Padanan ringkas dan alami untuk mereka yang sebelumnya tidak dapat berjalan dengan baik lalu berjalan.
- source_word: τυφλοὺς βλέποντας
  choice: orang buta melihat
  rationale: Mempertahankan bentuk daftar yang langsung dan kontras mukjizat dalam bahasa Yunani.
- source_word: ἐδόξασαν
  choice: memuliakan
  rationale: Mempertahankan nuansa pemberian kemuliaan dan penghormatan kepada Allah.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Allah Israel
  rationale: Padanan langsung dan lazim bagi sebutan genitif Yunani tersebut.
theological_decisions:
- issue: Makna κωφούς dalam κωφοὺς λαλοῦντας
  choice: orang bisu berbicara
  alternative: orang tuli berbicara
  rationale: Kata κωφός memiliki rentang makna tuli atau bisu. Konteks langsung, yaitu 'berbicara', lebih kuat menunjuk pada ketidakmampuan berbicara, sementara alternatif dicatat agar ambiguitas leksikal tetap terlihat.
- issue: Perbedaan κυλλούς dan χωλούς
  choice: orang yang anggota tubuhnya cacat ... orang lumpuh
  alternative: orang buntung dipulihkan ... orang timpang
  rationale: Terjemahan membedakan kecacatan atau kerusakan anggota tubuh dari hambatan berjalan, sesuai dua istilah Yunani yang berbeda, tanpa merinci jenis cedera yang tidak dinyatakan teks.
- issue: Arti δοξάζω sebagai tanggapan kepada Allah
  choice: memuliakan Allah Israel
  alternative: memuji Allah Israel
  rationale: '''Memuliakan'' mempertahankan bobot tindakan mengakui dan menyatakan kemuliaan Allah, sedangkan ''memuji'' lebih sempit.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang jelas. Istilah bagi kondisi fisik digunakan secara deskriptif dan setia pada kontras Yunani; catatan kaki mempertahankan ambiguitas leksikal yang nyata.
