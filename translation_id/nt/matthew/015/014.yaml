  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: id
  text: Biarkanlah mereka. Mereka adalah penuntun buta bagi orang-orang buta. Tetapi jika orang buta menuntun orang buta,[a] keduanya akan jatuh ke dalam lubang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk tunggal dalam pepatah ini bersifat representatif dan berlaku umum.
    reason: cultural_note
  - marker: b
    text: 'Atau: “parit”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Biarkanlah mereka
  rationale: Imperatif aoris ἄφετε di sini berarti membiarkan atau tidak menghiraukan mereka, bukan mengampuni; bentuk ini alami dan tetap mempertahankan daya perintah.
- source_word: τυφλοί
  choice: buta
  rationale: Mempertahankan metafora sumber tanpa menambahkan penafsiran seperti 'buta secara rohani'.
- source_word: ὁδηγοὶ τυφλῶν
  choice: penuntun buta bagi orang-orang buta
  rationale: ὁδηγός berarti penuntun; genitif τυφλῶν dapat menyatakan orang-orang yang dituntun. Rumusan ini jelas dalam bahasa Indonesia dan menjaga citra penuntunan.
- source_word: τυφλὸς ... τυφλὸν
  choice: seorang buta ... seorang buta
  rationale: Mempertahankan bentuk tunggal representatif dari pepatah Yunani; dalam bahasa Indonesia ungkapan ini berlaku umum dan tidak menandai jenis kelamin.
- source_word: ἐὰν ὁδηγῇ
  choice: jika ... menuntun
  rationale: ἐάν dengan subjungtif kini membentuk syarat umum; 'jika ... menuntun' merupakan padanan Indonesia yang alami.
- source_word: ἀμφότεροι
  choice: keduanya
  rationale: Menyatakan dengan ringkas bahwa penuntun dan yang dituntun mengalami akibat yang sama.
- source_word: εἰς βόθυνον
  choice: ke dalam lubang
  rationale: βόθυνος dapat berarti lubang, liang, atau parit; 'lubang' luas cakupannya dan mempertahankan gambaran kejatuhan.
- source_word: πεσοῦνται
  choice: akan jatuh
  rationale: Menyampaikan hasil mendatang dari syarat tersebut secara lugas.
theological_decisions:
- issue: Daya metaforis 'buta'
  choice: Mempertahankan kata 'buta' tanpa penjelasan dalam teks utama.
  alternative: buta secara rohani; tidak memiliki pengertian
  rationale: Teks Yunani menyampaikan teguran melalui metafora dan tidak menjelaskan acuannya di dalam ayat ini; penambahan akan mempersempit makna.
- issue: Hubungan genitif dalam ὁδηγοὶ τυφλῶν
  choice: penuntun buta bagi orang-orang buta
  alternative: penuntun-penuntun yang buta
  rationale: Frasa Yunani secara harfiah menunjuk kepada 'penuntun orang-orang buta', sementara varian tekstual yang penting menghilangkan τυφλῶν. Terjemahan utama mengikuti teks SBLGNT yang diberikan dan mencatat variannya.
- issue: Bentuk tunggal representatif dalam pepatah
  choice: seorang buta ... seorang buta
  alternative: orang buta ... orang buta; seorang laki-laki buta ... seorang laki-laki buta
  rationale: Nomina substantival maskulin tunggal Yunani berfungsi secara generik. Bahasa Indonesia dapat mempertahankan ketunggalan pepatah tanpa memasukkan jenis kelamin yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Penuntun' dipilih untuk menjaga kesinambungan metafora, sedangkan pengulangan 'seorang buta' mempertahankan bentuk pepatah sumber.
