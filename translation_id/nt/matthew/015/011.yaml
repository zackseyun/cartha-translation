id: MAT.15.11
reference: Matthew 15:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: id
  text: Bukan apa yang masuk ke dalam mulut yang menajiskan orang[a], melainkan apa yang keluar dari mulut—itulah yang menajiskan orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat orang menjadi najis.” Kata Yunaninya dapat menunjuk pada tindakan menjadikan seseorang najis atau tercemar dalam pengertian kemurnian.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: menajiskan
  rationale: Dalam konteks kemurnian, kata kerja ini berarti menjadikan seseorang najis atau tercemar. “Menajiskan” mempertahankan kaitan dengan kenajisan di hadapan Allah tanpa membatasinya pada kotor secara jasmani.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: apa yang masuk ke dalam mulut
  rationale: Partisip berartikel ini berfungsi sebagai nomina. Ungkapan tersebut diterjemahkan secara alami sambil mempertahankan gambaran konkret dan arah yang dinyatakan oleh εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: apa yang keluar dari mulut
  rationale: Terjemahan ini menyampaikan partisip substantival dan unsur gerak keluar yang dinyatakan oleh ἐκπορευόμενον dan ἐκ dalam bahasa Indonesia yang wajar.
- source_word: ἄνθρωπον
  choice: orang
  rationale: Ἄνθρωπος di sini menunjuk secara umum kepada seorang manusia. “Orang” mempertahankan bentuk tunggal dan cakupan generiknya secara alami dalam bahasa Indonesia tanpa menambahkan penandaan gender yang tidak dimiliki leksem ini.
- source_word: τοῦτο
  choice: itulah
  rationale: Bentuk penegas “itulah” mempertahankan fokus demonstratif Yunani pada hal yang keluar dari mulut sebagai hal yang menajiskan.
- source_word: οὐ ... ἀλλὰ
  choice: Bukan ... melainkan ...
  rationale: Pasangan ini menyampaikan pertentangan tegas dalam teks sumber dengan susunan bahasa Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Makna kemurnian dalam κοινόω
  choice: menajiskan
  alternative: membuat orang menjadi najis; mencemarkan
  rationale: “Menajiskan” mempertahankan gema kemurnian ritual sekaligus kemungkinan daya moralnya. Pilihan ini tidak mempersempit ucapan Yesus hanya pada kebersihan jasmani atau hanya pada status seremonial.
- issue: Daya generik ἄνθρωπον
  choice: orang
  alternative: manusia; seseorang
  rationale: Dalam konteks ini bentuk tunggal tersebut mewakili manusia pada umumnya. Bahasa Indonesia “orang” menyampaikan daya generik itu dengan tepat dan alami tanpa perlu memasukkan pembedaan gender.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan paralel serta penegasan “itulah” mempertahankan antitesis dan tekanan retoris teks Yunani.
