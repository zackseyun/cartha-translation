id: MAT.15.12
reference: Matthew 15:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: id
  text: Kemudian murid-murid datang dan berkata kepada-Nya, “Tahukah Engkau bahwa orang-orang Farisi tersinggung[a] setelah mendengar perkataan itu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merasa tersandung”; secara lebih harfiah, “dibuat tersandung.”
    reason: lexical_alternative
  - marker: b
    text: “Perkataan itu” merujuk pada pernyataan Yesus sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Kata keterangan waktu ini melanjutkan urutan peristiwa; “Kemudian” merupakan penghubung naratif yang alami dalam bahasa Indonesia.
- source_word: προσελθόντες οἱ μαθηταὶ λέγουσιν αὐτῷ
  choice: murid-murid datang dan berkata kepada-Nya
  rationale: Konstruksi partisip aoris yang diikuti verba historis kini disampaikan secara alami sebagai dua tindakan berurutan, tanpa menambahkan kata ganti kepunyaan yang tidak dinyatakan dalam teks Yunani.
- source_word: Οἶδας
  choice: Tahukah Engkau
  rationale: Bentuk pertanyaan langsung dipertahankan. “Tahukah” lebih dekat dengan makna mengetahui daripada pilihan yang lebih interpretatif seperti “Sadarkah”.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan kelompok ini diterjemahkan dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: ἀκούσαντες τὸν λόγον
  choice: setelah mendengar perkataan itu
  rationale: Partisip aoris menyatakan reaksi yang terjadi sesudah mereka mendengar. “Perkataan itu” mempertahankan λόγος dan menunjuk secara alami kepada ucapan Yesus sebelumnya.
- source_word: ἐσκανδαλίσθησαν
  choice: tersinggung
  rationale: Dalam konteks ini kata tersebut menyatakan reaksi negatif orang-orang Farisi terhadap pengajaran Yesus. “Tersinggung” alami dalam bahasa Indonesia, sedangkan nuansa harfiah tentang tersandung dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna σκανδαλίζω dalam konteks reaksi terhadap perkataan Yesus
  choice: tersinggung
  alternative: merasa tersandung; dibuat tersandung
  rationale: Konteks langsung menyoroti penolakan atau rasa tersinggung akibat ucapan Yesus, bukan secara eksplisit kemurtadan atau kejatuhan moral. Catatan kaki mempertahankan citra dan keluasan makna kata Yunani tanpa memaksakan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “Engkau” dan akhiran “-Nya” dipakai untuk Yesus sesuai register Alkitab Indonesia yang lazim; susunan kalimat dibuat alami sambil mempertahankan pertanyaan langsung dan hubungan waktu dalam teks Yunani.
