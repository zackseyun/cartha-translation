  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: id
  text: Yesus bertanya kepada mereka, “Berapa roti yang kalian punya?” Mereka menjawab, “Tujuh, dan beberapa ikan kecil.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: bertanya
  rationale: Secara leksikal berarti ‘berkata’, tetapi karena ujaran langsungnya berbentuk pertanyaan, ‘bertanya’ menyampaikan fungsi tuturan secara alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: Πόσους ἄρτους
  choice: Berapa roti
  rationale: ἄρτους adalah bentuk jamak yang dapat dihitung, tetapi dalam bahasa Indonesia nomina setelah ‘berapa’ lazim tidak direduplikasi; ‘roti’ secara kontekstual berarti sejumlah roti.
- source_word: ἔχετε
  choice: yang kalian punya
  rationale: Memberikan pertanyaan bahasa Indonesia modern yang alami. ‘Kalian’ menunjukkan bahwa Yesus berbicara kepada lebih dari satu orang, sesuai bentuk jamak Yunani.
- source_word: οἱ δὲ εἶπαν
  choice: Mereka menjawab
  rationale: δέ di sini menggerakkan narasi, sedangkan εἶπαν memperkenalkan tanggapan atas pertanyaan; ‘menjawab’ paling alami dalam konteks Indonesia.
- source_word: Ἑπτά
  choice: Tujuh
  rationale: Padanan langsung angka tersebut; nomina ‘roti’ dipahami dari pertanyaan sebelumnya.
- source_word: ὀλίγα
  choice: beberapa
  rationale: Padanan alami bagi jumlah kecil yang tidak ditentukan.
- source_word: ἰχθύδια
  choice: ikan kecil
  rationale: Bentuk diminutif Yunani secara wajar dipertahankan dengan ‘kecil’, meskipun dalam konteks tertentu bentuk ini dapat dipahami hanya sebagai ‘ikan’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Konjungsi pembuka καί dan penghubung δέ tidak diterjemahkan secara mekanis karena hubungan antarkalimat sudah jelas dalam bahasa Indonesia. Tidak diperlukan catatan kaki karena nuansa diminutif ἰχθύδια dipertahankan langsung dalam teks sebagai ‘ikan kecil’.
