  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: id
  text: Lalu Petrus menjawab kepada-Nya, “Jelaskanlah[a] perumpamaan ini kepada kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Beritahukanlah perumpamaan ini kepada kami” atau “Jadikanlah perumpamaan ini jelas bagi kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Namun Petrus berkata kepada-Nya
  rationale: Ungkapan partisip Ἀποκριθεὶς yang diikuti εἶπεν merupakan idiom naratif untuk tanggapan dalam percakapan. Bahasa Indonesia modern tidak perlu menggandakan verba menjadi 'menjawab dan berkata'; 'berkata' dalam konteks ini menyampaikan respons secara alami. δέ diterjemahkan 'Namun' untuk menandai peralihan ringan dari ucapan sebelumnya.
- source_word: Φράσον
  choice: Jelaskanlah
  rationale: Imperatif φράζω di sini meminta agar makna perkataan kiasan dibuat jelas. 'Jelaskanlah' alami, tepat, dan tetap membuka alternatif makna 'beritahukanlah' atau 'buatlah jelas' dalam catatan kaki.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Pronomina datif ini menunjukkan penerima penjelasan. 'Kami' bersifat eksklusif dan sesuai karena Petrus berbicara kepada Yesus atas nama kelompok murid.
- source_word: τὴν παραβολὴν ταύτην
  choice: perumpamaan ini
  rationale: '''Perumpamaan'' mempertahankan istilah Injil yang lazim untuk παραβολή, sedangkan ''ini'' menunjuk pada perkataan Yesus yang baru saja disampaikan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Bentuk hormat '-Nya' dipakai untuk rujukan kepada Yesus menurut konvensi umum penerbitan Alkitab Indonesia. Struktur idiom Yunani 'menjawab dan berkata' dipadatkan agar tidak terasa kaku, tanpa menghilangkan fungsi tanggapannya.
