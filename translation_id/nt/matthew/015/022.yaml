source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: id
  text: Lihatlah, seorang perempuan Kanaan keluar dari daerah itu lalu terus berseru, “Kasihanilah aku, ya Tuhan, Anak Daud! Anak perempuanku sangat kerasukan setan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat dikuasai oleh setan” atau “sangat disiksa oleh setan.”
    reason: Alternatif leksikal ini mempertahankan keluasan makna δαιμονίζεται dan menghindari kesan bahwa teks Yunani menjelaskan secara tepat bentuk pengaruh setan tersebut.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian pembaca dan memberi daya hidup pada peralihan adegan.
- source_word: Χαναναία
  choice: perempuan Kanaan
  rationale: Matius secara eksplisit memakai sebutan ‘Kanaan’; terjemahan ini mempertahankan gema sejarah hubungan Israel dengan orang Kanaan dan tidak mengimpor sebutan ‘Siro-Fenisia’ dari kisah paralel dalam Markus.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: dari daerah itu
  rationale: Dalam konteks ini, ὅρια menunjuk pada wilayah atau kawasan. Bentuk tunggal kolektif ‘daerah itu’ alami dalam bahasa Indonesia dan tetap menyampaikan acuan geografisnya.
- source_word: ἐξελθοῦσα
  choice: datang
  rationale: Partisip aoris disampaikan sebagai verba berurutan yang alami dalam bahasa Indonesia. Dalam gabungan ‘datang dari daerah itu’, unsur keluar dari wilayah asal tetap tersirat tanpa menghasilkan ungkapan kaku.
- source_word: ἔκραζεν
  choice: terus berseru
  rationale: Kata ‘terus’ mempertahankan aspek imperfektif yang menggambarkan seruan yang berlangsung atau berulang.
- source_word: Ἐλέησόν με
  choice: Kasihanilah aku
  rationale: Ungkapan ini alami, mendesak, dan mempertahankan kosakata belas kasihan yang terdapat dalam verba Yunani.
- source_word: κύριε
  choice: ya Tuhan
  rationale: Sapaan ‘ya Tuhan’ wajar dalam bahasa Indonesia dan, ketika disandingkan dengan ‘Anak Daud’, mempertahankan kemungkinan bobot penghormatan serta kemesiasan tanpa mereduksinya menjadi sekadar ‘Tuan’.
- source_word: υἱὸς Δαυίδ
  choice: Anak Daud
  rationale: Terjemahan harfiah ini mempertahankan gelar kerajaan dan kemesiasan yang dikenal dalam Injil Matius.
- source_word: κακῶς
  choice: sangat menderita
  rationale: Dalam konstruksi ini κακῶς memperberat keadaan anak itu. Ungkapan tersebut menyampaikan parahnya penderitaan secara alami dalam bahasa Indonesia.
- source_word: δαιμονίζεται
  choice: kerasukan setan
  rationale: Ini adalah padanan ringkas dan lazim untuk keadaan di bawah kuasa roh jahat. Karena verba Yunani tidak dengan sendirinya menjabarkan mekanisme atau tingkat penguasaan itu, pilihan alternatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna κύριε dalam sapaan yang disertai gelar mesianik
  choice: ya Tuhan
  alternative: ya Tuan
  rationale: Gelar ‘Anak Daud’ menunjukkan bahwa sapaan ini mungkin lebih dari sekadar kesopanan. ‘Ya Tuhan’ mempertahankan daya penghormatan dan kemungkinan bobot mesianiknya, tanpa menyatakan secara berlebihan bahwa perempuan itu telah mengungkapkan pengakuan kristologis yang lengkap.
- issue: Cara menyampaikan δαιμονίζεται
  choice: kerasukan setan
  alternative: dikuasai atau disiksa oleh setan
  rationale: Teks jelas mengaitkan keadaan anak itu dengan kuasa setan, tetapi verba Yunani tidak menentukan fenomenologinya setepat istilah modern ‘kerasukan’. Terjemahan utama memakai ungkapan Indonesia yang lazim, sedangkan catatan kaki mempertahankan kelonggaran makna sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. ‘Lihatlah’ sengaja dipertahankan sebagai penanda perhatian yang agak menonjol. Susunan seruan dibuat alami dalam dialog Indonesia, sementara ‘terus berseru’ menampilkan tindakan yang berlangsung atau berulang.
