source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: id
  text: Lalu murid-murid berkata kepada-Nya, “Dari mana kita bisa memperoleh roti sebanyak itu di tempat terpencil ini untuk mengenyangkan orang sebanyak ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: berkata
  rationale: Bentuk kini historis dalam narasi Yunani diterjemahkan dengan bentuk naratif Indonesia yang wajar; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: οἱ μαθηταί
  choice: murid-murid
  rationale: Artikel menunjuk kepada kelompok murid yang sudah dikenal dalam konteks; tidak perlu menambahkan 'para' atau 'murid-murid-Nya'.
- source_word: Πόθεν ἡμῖν
  choice: Dari mana kita bisa memperoleh
  rationale: Ungkapan ini menanyakan sumber persediaan. 'Memperoleh' menyampaikan makna yang tersirat secara alami tanpa menentukan cara mendapatkannya.
- source_word: ἐν ἐρημίᾳ
  choice: di tempat terpencil ini
  rationale: ἐρημία menunjuk kawasan yang sepi atau tidak berpenghuni, bukan selalu gurun; 'ini' wajar merujuk keadaan setempat.
- source_word: ἄρτοι τοσοῦτοι
  choice: roti sebanyak itu
  rationale: Bentuk jamak ἄρτοι secara harfiah menunjuk roti-roti atau ketul-ketul roti, sedangkan 'roti' sebagai nomina massa lebih alami dalam bahasa Indonesia; τοσοῦτοι tetap dinyatakan dengan 'sebanyak itu'.
- source_word: ὥστε χορτάσαι
  choice: untuk mengenyangkan
  rationale: Konstruksi ὥστε dengan infinitif menyatakan hasil atau kecukupan yang dimaksud; χορτάσαι berarti memberi makan sampai kenyang.
- source_word: ὄχλον τοσοῦτον
  choice: orang sebanyak ini
  rationale: Terjemahan ini alami dalam pertanyaan langsung dan mempertahankan penekanan kuantitatif τοσοῦτον; ὄχλος dipahami secara kolektif sebagai kerumunan orang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan 'roti sebanyak itu ... orang sebanyak ini' mempertahankan kesejajaran dua bentuk τοσοῦτος dalam teks Yunani. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan perbedaan makna yang penting dalam bahasa Indonesia.
