  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: id
  text: ia sama sekali tidak perlu menghormati ayahnya.[a] Dan kamu telah membatalkan firman Allah[b] demi tradisimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menghormati” di sini kemungkinan mencakup kewajiban nyata untuk memenuhi kebutuhan orang tua, bukan hanya menunjukkan rasa hormat.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah memuat “perintah Allah” sebagai ganti “firman Allah”.
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ
  choice: sama sekali tidak perlu
  rationale: Negasi kuat οὐ μή dipertahankan dengan “sama sekali”; dalam konteks keputusan tradisional yang meniadakan kewajiban, “tidak perlu” menyampaikan nuansa pembebasan dari kewajiban dengan wajar.
- source_word: τιμήσει
  choice: menghormati
  rationale: Kata τιμάω pada dasarnya berarti menghormati. Pilihan ini mempertahankan kaitannya dengan perintah tentang orang tua, sedangkan implikasi bantuan praktis dijelaskan dalam catatan kaki.
- source_word: πατέρα αὐτοῦ
  choice: ayahnya
  rationale: Teks Yunani yang diberikan secara eksplisit menyebut ayah dalam bentuk tunggal; terjemahan tidak memperluasnya menjadi ayah dan ibu.
- source_word: ἠκυρώσατε
  choice: telah membatalkan
  rationale: ἀκυρόω berarti membuat tidak berlaku atau meniadakan keabsahan. “Membatalkan” jelas, kuat, dan alami dalam bahasa Indonesia modern.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Mengikuti bacaan SBLGNT λόγον, bukan varian ἐντολήν. “Firman Allah” merupakan padanan Indonesia yang alami dan tetap membedakannya dari “perintah Allah” dalam varian teks.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: demi tradisimu
  rationale: διά dengan akusatif dapat menyatakan alasan atau kepentingan. “Demi” mempertahankan tuduhan bahwa tradisi mereka diutamakan sehingga firman Allah dibatalkan.
- source_word: καί
  choice: Dengan demikian
  rationale: Dalam alur argumen, καί menghubungkan hasil praktik yang baru disebut dengan kesimpulan Yesus. “Dengan demikian” membuat hubungan konsekuensial itu jelas tanpa mengubah isi tuduhan.
theological_decisions:
- issue: Apakah ‘menghormati’ perlu diperjelas sebagai memberi dukungan materi kepada orang tua
  choice: Mempertahankan “menghormati” dalam teks utama dan menjelaskan cakupan praktisnya dalam catatan kaki.
  alternative: Menerjemahkan “menafkahi” atau “memelihara”.
  rationale: Konteks menyangkut kewajiban nyata terhadap orang tua, tetapi verba Yunani tetap τιμάω. Pilihan umum menjaga gema perintah Kitab Suci tanpa mempersempit artinya secara berlebihan.
- issue: Apakah ayat harus diselaraskan dengan konteks atau varian teks
  choice: Menerjemahkan “ayahnya” dan “firman Allah” sesuai teks SBLGNT.
  alternative: Memakai “ayah atau ibunya” dan/atau “perintah Allah”.
  rationale: Teks utama mengikuti bukti sumber yang diberikan. Bacaan varian yang penting dicatat, bukan dimasukkan diam-diam ke dalam terjemahan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. “Sama sekali tidak perlu” mengungkapkan negasi tegas sekaligus nuansa pembebasan dari kewajiban. Penempatan penanda catatan kaki mengikuti unsur yang diterangkan: [a] sesudah klausa tentang menghormati ayah dan [b] sesudah “firman Allah”.'
