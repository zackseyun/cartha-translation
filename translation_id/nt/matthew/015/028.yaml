  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: id
  text: Kemudian Yesus menjawabnya, “Wahai perempuan, besar imanmu[a]! Terjadilah bagimu seperti yang engkau kehendaki.” Dan sejak saat itu[b] anak perempuannya sembuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “besar kepercayaanmu.” Kata Yunani πίστις juga dapat mengandung arti kepercayaan atau kesetiaan, tetapi dalam konteks ini “iman” merupakan padanan utama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sejak jam itu.” Ungkapan Yunani ini dapat berarti “sejak saat itu juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Penanda waktu dan alur yang menghubungkan jawaban Yesus dengan percakapan sebelumnya; “Kemudian” alami dalam narasi Indonesia.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: menjawabnya
  rationale: Gabungan partisip dan verba ujaran ini bersifat idiomatis. “Menjawabnya” menyampaikan tindakan menjawab sekaligus mempertahankan rujukan kepada perempuan itu tanpa pengulangan yang kaku.
- source_word: Ὦ γύναι
  choice: Hai perempuan
  rationale: “Hai” mempertahankan seruan dalam sapaan langsung, sedangkan “perempuan” adalah padanan langsung γύναι. Dalam konteks ini sapaan tersebut tegas dan penuh perhatian, bukan hinaan; “Ibu” akan menambahkan nuansa yang tidak dinyatakan teks Yunani.
- source_word: μεγάλη σου ἡ πίστις
  choice: besar imanmu
  rationale: Susunan ini mempertahankan penekanan pada “besar” dan tetap ringkas serta wajar dalam bahasa Indonesia.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks permohonan perempuan itu kepada Yesus, “iman” paling tepat menyampaikan keyakinan dan kepercayaannya, sementara nuansa “kepercayaan” tetap dicatat sebagai alternatif.
- source_word: γενηθήτω σοι
  choice: Terjadilah bagimu
  rationale: Bentuk imperatif pasif γίνομαι dipertahankan dengan ungkapan performatif yang menyatakan pengabulan oleh Yesus tanpa menjelaskan mekanismenya secara berlebihan.
- source_word: ὡς θέλεις
  choice: seperti yang engkau kehendaki
  rationale: Menyampaikan keinginan perempuan itu dengan register yang bermartabat dan mempertahankan bentuk perbandingan ὡς.
- source_word: ἰάθη
  choice: sembuh
  rationale: Bentuk pasif Yunani secara alami dinyatakan dengan verba keadaan “sembuh” dalam bahasa Indonesia; makna penyembuhan tetap jelas dari konteks mukjizat.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: sejak saat itu
  rationale: Ungkapan Yunani secara harfiah menyebut “jam”, tetapi secara idiomatis menunjuk waktu atau saat tersebut. “Sejak saat itu” alami dan tidak mengesankan durasi satu jam.
theological_decisions:
- issue: Makna πίστις dalam pujian Yesus
  choice: iman
  alternative: kepercayaan
  rationale: Konteks menyoroti keyakinan dan ketergantungan perempuan itu kepada Yesus. “Iman” mempertahankan istilah teologis yang lazim tanpa menyingkirkan nuansa relasional “kepercayaan”, yang dicantumkan dalam catatan kaki.
- issue: Daya ujaran γενηθήτω
  choice: Terjadilah bagimu
  alternative: Biarlah terjadi bagimu
  rationale: Pilihan utama mempertahankan bentuk perintah pasif dan daya performatif ucapan Yesus. Alternatif dapat terdengar lebih permisif, seolah-olah Yesus hanya membiarkan sesuatu terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Hai perempuan” mempertahankan bentuk langsung teks Yunani tanpa melunakkannya menjadi sapaan kekerabatan. “Engkau” dipakai dalam ucapan Yesus untuk register yang khidmat namun tetap mudah dipahami.
