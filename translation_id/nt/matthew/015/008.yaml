id: MAT.15.8
reference: Matthew 15:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: id
  text: Bangsa ini menghormati Aku dengan bibir mereka,[a] tetapi hati mereka jauh dari-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan bibir”; ungkapan ini menunjuk pada penghormatan yang diucapkan, berlawanan dengan keadaan batin mereka.
    reason: clarification
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Bangsa ini
  rationale: λαός menunjuk pada suatu kelompok secara kolektif. “Bangsa ini” mempertahankan daya demonstratif οὗτος dan gema kutipan kenabian tanpa mengubahnya menjadi “orang-orang” atau “kerumunan”.
- source_word: τοῖς χείλεσίν
  choice: dengan bibir mereka
  rationale: Datif ini bersifat instrumental. Ungkapan tersebut mempertahankan gambaran konkret χείλη dan tetap alami dalam bahasa Indonesia.
- source_word: με
  choice: Aku
  rationale: με adalah objek langsung dari τιμᾷ. Huruf kapital mengikuti kebiasaan penulisan kata ganti yang merujuk kepada Allah dalam ragam Alkitab Indonesia.
- source_word: τιμᾷ
  choice: menghormati
  rationale: τιμάω di sini berarti memberikan atau menunjukkan hormat; “menghormati” menyampaikan makna itu tanpa memperkuatnya menjadi “memuliakan”.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: tetapi hati mereka
  rationale: καρδία berbentuk tunggal dan kemungkinan digunakan secara kolektif bagi sikap batin bangsa itu. Bahasa Indonesia memungkinkan “hati mereka” tetap alami sekaligus mempertahankan bentuk tunggal sumber; δέ berfungsi adversatif.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: jauh dari-Ku
  rationale: Gabungan πόρρω dan ἀπέχει ἀπό menyatakan keberadaan pada jarak yang jauh. “Jauh dari-Ku” ringkas, alami, dan mempertahankan nuansa keterpisahan relasional.
theological_decisions:
- issue: Hati tunggal kolektif atau hati jamak distributif
  choice: 'Mempertahankan bentuk tunggal: “hati mereka”'
  alternative: “hati mereka masing-masing” atau bentuk yang secara eksplisit menjamakkan hati
  rationale: καρδία berbentuk tunggal dan menggambarkan bangsa itu sebagai satu kesatuan dengan sikap batin bersama. Bahasa Indonesia tidak menandai jumlah pada nomina tanpa reduplikasi, sehingga “hati mereka” dapat mempertahankan ambiguitas asli secara alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Struktur antitesis “dengan bibir ... tetapi hati ...” dipertahankan. Penulisan “Aku” dan “-Ku” mengikuti konvensi umum Alkitab bahasa Indonesia untuk rujukan ilahi.
