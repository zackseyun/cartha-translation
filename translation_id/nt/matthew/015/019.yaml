  source_fidelity: Terjemahan setia pada teks Yunani. “Sebab dari hati timbul” menyampaikan daya jelas γάρ, asal yang ditandai ἐκ, dan kemunculan dari dalam pada ἐξέρχονται. Unsur-unsur daftar diterjemahkan lengkap dan tanpa penambahan makna yang tidak ada dalam sumber.
