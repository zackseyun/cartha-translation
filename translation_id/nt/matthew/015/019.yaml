  terminology: “Hati,” “perzinaan,” dan “kesaksian palsu” tepat serta konsisten dengan register Alkitab yang modern. Pemilihan “fitnah” untuk βλασφημίαι sah dalam konteks daftar keburukan umum, karena istilah Yunani itu dapat berarti ucapan yang mencemarkan orang maupun penghujatan terhadap Allah. Catatan kaki dengan tepat memelihara kemungkinan kedua tanpa memaksakannya ke dalam teks utama. Penanda catatan kaki ditempatkan pada “fitnah,” yaitu kata yang dijelaskan.
