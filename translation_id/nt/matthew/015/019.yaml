  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: id
  text: Sebab dari hati timbul pikiran-pikiran jahat, pembunuhan, perzinaan, perbuatan cabul, pencurian, kesaksian palsu, dan fitnah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghujatan.” Kata Yunani ini dapat berarti fitnah atau ucapan yang mencemarkan nama orang, dan dapat pula berarti penghinaan terhadap Allah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Sebab dari hati
  rationale: γάρ memberi penjelasan atas pernyataan sebelumnya, sedangkan ἐκ menyatakan sumber. 'Dari hati' mempertahankan metafora hati sebagai pusat batin manusia.
- source_word: ἐξέρχονται
  choice: timbul
  rationale: Kata kerja ini menyatakan keluar atau muncul dari suatu sumber. 'Timbul' alami dalam bahasa Indonesia bersama 'dari hati' dan tetap menyampaikan asal tindakan-tindakan tersebut.
- source_word: διαλογισμοὶ πονηροί
  choice: pikiran-pikiran jahat
  rationale: διαλογισμοί dapat berarti pikiran, pertimbangan, atau rancangan. Bentuk ini mempertahankan keluasan makna tanpa mempersempitnya menjadi siasat terencana.
- source_word: φόνοι
  choice: pembunuhan
  rationale: Istilah ini menunjuk pada tindakan membunuh secara melawan moral atau hukum; 'pembunuhan' tepat dan lazim dalam daftar keburukan.
- source_word: μοιχεῖαι
  choice: perzinaan
  rationale: Menunjuk pada pelanggaran kesetiaan perkawinan. Dalam bahasa Indonesia, nomina massal ini alami walaupun bentuk Yunani berjumlah jamak.
- source_word: πορνεῖαι
  choice: perbuatan cabul
  rationale: πορνεῖαι mencakup berbagai perilaku seksual yang tidak patut. 'Perbuatan cabul' cukup luas, konkret, dan dapat dipahami pembaca modern tanpa memakai istilah teknis denominasi.
- source_word: κλοπαί
  choice: pencurian
  rationale: Padanan langsung dan alami untuk tindakan mengambil milik orang lain secara tidak sah.
- source_word: ψευδομαρτυρίαι
  choice: kesaksian palsu
  rationale: Mempertahankan nuansa memberikan kesaksian yang tidak benar, termasuk konteks hukum, tanpa memaksakan bentuk jamak yang kurang alami dalam bahasa Indonesia.
- source_word: βλασφημίαι
  choice: fitnah
  rationale: Dalam daftar keburukan umum ini, kata tersebut dapat menunjuk pada ucapan yang mencemarkan nama orang. 'Fitnah' mempertahankan arti sosial yang paling wajar, sementara kemungkinan arti penghujatan terhadap Allah dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan βλασφημίαι dalam daftar keburukan
  choice: fitnah
  alternative: penghujatan
  rationale: Konteks tidak menyebut sasaran ucapan tersebut secara khusus. Terjemahan utama memakai arti pencemaran nama terhadap manusia, tetapi kemungkinan rujukan kepada penghinaan terhadap Allah tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang ringkas dan bermartabat. Bentuk-bentuk tunggal kolektif dipakai karena lebih alami dalam bahasa Indonesia, meskipun beberapa nomina Yunani berbentuk jamak.
