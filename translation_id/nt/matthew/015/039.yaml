id: MAT.15.39
reference: Matthew 15:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: id
  text: Sesudah menyuruh orang banyak itu pergi, ia naik ke perahu dan tiba di daerah Magadan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Magdala”, bukan “Magadan”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: sesudah menyuruh ... pergi
  rationale: Partisip aoristis menunjukkan tindakan yang mendahului verba utama. Ungkapan ini secara alami menyatakan bahwa orang banyak disuruh pergi tanpa menambahkan gagasan yang tidak terdapat dalam bahasa Yunani.
- source_word: τοὺς ὄχλους
  choice: orang banyak itu
  rationale: Bentuk jamak Yunani merujuk kepada kumpulan-kumpulan orang dalam konteks tersebut. Dalam bahasa Indonesia, 'orang banyak itu' lebih alami daripada bentuk harfiah yang menonjolkan kejamakan.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: naik ke perahu
  rationale: Ungkapan Yunani berarti masuk atau naik untuk berlayar; 'naik ke perahu' merupakan ungkapan Indonesia yang alami dan konkret.
- source_word: ἦλθεν
  choice: tiba
  rationale: Dalam konteks perjalanan, 'tiba' menyampaikan hasil gerak menuju wilayah tersebut secara alami, tanpa memaksakan pembedaan deiktis antara 'datang' dan 'pergi'.
- source_word: τὰ ὅρια
  choice: daerah
  rationale: Bentuk jamak yang secara harfiah berarti batas-batas dipakai secara idiomatis untuk wilayah atau kawasan geografis; 'daerah' menyampaikan maksud itu dengan jelas.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: Teks SBLGNT berbunyi Μαγαδάν, sehingga nama tempat itu ditransliterasikan sebagai 'Magadan'. Varian 'Magdala' dicatat dalam catatan kaki.
theological_decisions:
- issue: Bentuk nama tempat pada akhir ayat
  choice: Magadan
  alternative: Magdala
  rationale: Ini merupakan persoalan varian teks dan nama tempat, bukan penetapan teologis. Teks utama mengikuti bacaan SBLGNT, sedangkan bacaan alternatif yang dikenal luas dipertahankan dalam catatan kaki demi keterbukaan tekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang alami dan bermartabat. Pronomina 'ia' mempertahankan subjek tersirat dari konteks tanpa menambahkan nama Yesus ke dalam teks.
