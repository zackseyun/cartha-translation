  source_fidelity: 'Teks Indonesia dengan setia mencerminkan urutan tindakan dalam Yunani: setelah mengutus/membubarkan orang banyak, ia naik ke perahu, lalu tiba di wilayah Magadan. “Daerah” menyampaikan penggunaan idiomatis τὰ ὅρια sebagai wilayah, bukan semata-mata garis perbatasan. “Tiba” wajar untuk ἦλθεν dalam konteks perjalanan dan tidak mengubah makna.'
