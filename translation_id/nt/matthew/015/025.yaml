  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: id
  text: Namun, perempuan itu datang dan berlutut di hadapan-Nya[a], katanya, “Tuhan, tolonglah aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Nya.” Kata Yunani yang digunakan dapat berarti bersujud dengan hormat, memberi penghormatan, atau menyembah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan tanggapan sebelumnya dan menonjolkan kegigihan perempuan itu.
- source_word: ἐλθοῦσα
  choice: perempuan itu datang
  rationale: Partisip aoris dialihkan menjadi verba finit yang alami dalam bahasa Indonesia, sambil mempertahankan geraknya mendekati Yesus.
- source_word: προσεκύνει αὐτῷ
  choice: berlutut di hadapan-Nya
  rationale: Menggambarkan tindakan jasmani penuh hormat tanpa memastikan apakah tindakan itu harus dipahami secara khusus sebagai penyembahan; kemungkinan tersebut dipertahankan dalam catatan kaki.
- source_word: λέγουσα
  choice: katanya
  rationale: Memperkenalkan ucapan langsung secara ringkas dan alami dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini berbobot dan penuh hormat; 'Tuhan' sesuai dengan penggunaan κύριος dalam konteks Injil ini.
- source_word: βοήθει μοι
  choice: tolonglah aku
  rationale: Menyampaikan permohonan mendesak secara langsung, singkat, dan alami.
theological_decisions:
- issue: Makna προσκυνέω yang ditujukan kepada Yesus
  choice: berlutut di hadapan-Nya
  alternative: menyembah-Nya
  rationale: Verba ini dapat menunjuk pada sujud atau penghormatan, dan juga dapat berarti menyembah. Teks utama mempertahankan tindakan jasmaninya tanpa menyelesaikan ketegangan teologis secara berlebihan, sedangkan alternatif yang sah dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'tolonglah aku' mempertahankan desakan singkat dalam permohonan perempuan itu.
