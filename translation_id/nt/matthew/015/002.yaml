id: MAT.15.2
reference: Matthew 15:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: id
  text: “Mengapa murid-murid-Mu melanggar tradisi para tetua? Sebab mereka tidak membasuh tangan ketika makan roti[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah praktik pembasuhan tangan yang diwajibkan oleh tradisi para tetua, bukan sekadar soal kebersihan biasa.
    reason: cultural_note
  - marker: b
    text: Atau “ketika makan”; kata Yunani untuk “roti” kadang-kadang dapat merujuk pada makanan secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang alami dalam bahasa Indonesia untuk menanyakan alasan.
- source_word: οἱ μαθηταί σου
  choice: murid-murid-Mu
  rationale: Bentuk ulang menyatakan jamak secara jelas; huruf kapital pada pronomina mengikuti konvensi hormat bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: παραβαίνουσιν
  choice: melanggar
  rationale: Menyampaikan tindakan menyalahi ketentuan atau tradisi yang dipandang berwibawa tanpa menggunakan istilah yang terlalu teknis.
- source_word: τὴν παράδοσιν
  choice: tradisi
  rationale: Menunjuk pada ajaran atau kebiasaan yang diwariskan; 'tradisi' mempertahankan bobot otoritatifnya lebih baik daripada sekadar 'kebiasaan'.
- source_word: τῶν πρεσβυτέρων
  choice: para tua-tua
  rationale: Dalam konteks ini menunjuk kepada para pendahulu atau pemuka berwibawa yang terkait dengan tradisi Yahudi, bukan hanya orang-orang berusia lanjut.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: mereka tidak membasuh tangan
  rationale: νίπτω lazimnya berarti membasuh bagian tubuh; kepemilikan tangan sudah alami dan jelas dalam susunan bahasa Indonesia tanpa 'mereka' yang kedua.
- source_word: ὅταν
  choice: ketika
  rationale: Mengungkapkan keadaan waktu yang lazim atau berulang secara alami dalam bahasa Indonesia.
- source_word: ἄρτον
  choice: roti
  rationale: Mempertahankan arti harfiah kata Yunani, sementara kemungkinan makna metonimis 'makanan' atau 'perjamuan' dicatat dalam catatan kaki.
- source_word: ἐσθίωσιν
  choice: makan
  rationale: Bentuk sederhana bahasa Indonesia secara alami menyampaikan tindakan kebiasaan dalam klausa dengan ὅταν.
theological_decisions:
- issue: Sifat pembasuhan tangan yang dipersoalkan
  choice: Teks utama menyajikannya sebagai pelanggaran terhadap tradisi para tua-tua tanpa secara eksplisit menyebutnya pembasuhan ritual.
  alternative: Menafsirkannya secara eksplisit sebagai pembasuhan seremonial atau sebagai kebersihan biasa.
  rationale: Ayat itu sendiri mengaitkan pembasuhan tersebut dengan tradisi para tua-tua, tetapi tidak menjelaskan sifatnya lebih jauh. Catatan kaki memberi konteks tanpa menutup ketegangan dalam teks.
- issue: Cakupan makna ἄρτον
  choice: Mempertahankan 'roti' dalam teks utama.
  alternative: Menerjemahkannya sebagai 'makanan' atau 'makan'.
  rationale: Arti leksikal langsungnya adalah roti, tetapi penggunaannya dapat meluas secara metonimis; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Membasuh' dipilih daripada 'mencuci' untuk menjaga nuansa praktik tradisional tanpa secara eksplisit menetapkannya sebagai ritual; susunan kalimat tetap mudah dipahami pembaca umum.
