  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: id
  text: Orang-orang yang telah makan itu berjumlah empat ribu laki-laki, belum termasuk perempuan dan anak-anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Yang makan
  rationale: Artikel dengan partisipel diterjemahkan secara substantival sebagai kelompok orang yang makan. Dalam konteks, peristiwa makan telah selesai, tetapi bahasa Indonesia secara alami dapat memakai bentuk tanpa penandaan kala ini tanpa kehilangan makna.
- source_word: ἦσαν τετρακισχίλιοι
  choice: berjumlah empat ribu
  rationale: Ungkapan ini menyampaikan kopula dan jumlah dengan idiom Indonesia yang alami dan jelas.
- source_word: ἄνδρες
  choice: laki-laki
  rationale: Kata ἀνήρ di sini menunjuk secara khusus kepada laki-laki, bukan orang secara umum, sebagaimana ditegaskan oleh penyebutan perempuan dan anak-anak secara terpisah.
- source_word: χωρὶς
  choice: belum termasuk
  rationale: Dalam rumusan penghitungan ini, χωρίς menunjukkan bahwa perempuan dan anak-anak tidak termasuk dalam angka empat ribu; pilihan ini alami dalam bahasa Indonesia.
- source_word: γυναικῶν καὶ παιδίων
  choice: perempuan dan anak-anak
  rationale: Makna umum kedua nomina dipertahankan tanpa mempersempit γυναικῶν menjadi istri atau παιδίων menjadi anak kecil saja.
theological_decisions:
- issue: Rumusan penghitungan berdasarkan jenis kelamin
  choice: Mempertahankan “laki-laki” dan menyebut perempuan serta anak-anak sebagai kelompok yang tidak termasuk dalam angka empat ribu.
  alternative: Menggunakan “orang” sebagai istilah inklusif.
  rationale: Teks Yunani secara khusus memakai ἄνδρες dan kemudian menyebut perempuan serta anak-anak secara terpisah. Menggunakan “orang” akan menghapus pembedaan yang nyata dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Konjungsi δέ tidak dinyatakan secara tersendiri karena hanya berfungsi sebagai penghubung ringan dan alur ayat tetap alami tanpa “tetapi” atau “adapun”.
