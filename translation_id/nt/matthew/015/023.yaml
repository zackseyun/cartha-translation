  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: id
  text: Namun, Ia tidak menjawab sepatah kata pun kepadanya. Lalu murid-murid-Nya datang dan terus meminta kepada-Nya, “Suruhlah dia pergi[a], sebab dia terus berseru di belakang kita[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat dipahami sebagai “Kabulkanlah permintaannya, lalu suruh dia pergi,” atau sekadar “Suruhlah dia menjauh dari kita.” Perkataan para murid tidak menjelaskan maksud mana yang mereka kehendaki.
    reason: alternative_reading
  - marker: b
    text: Atau “mengikuti kita.” Ungkapan Yunani dapat menunjukkan posisi (“di belakang kita”) ataupun tindakan mengejar atau mengikuti (“mengikuti kita”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: tidak menjawab sepatah kata pun kepadanya
  rationale: Ungkapan ini mempertahankan penekanan idiom Yunani bahwa Yesus sama sekali tidak memberikan jawaban, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: προσελθόντες
  choice: datang
  rationale: Partisip ini menunjukkan bahwa para murid bergerak mendekati Yesus; 'datang' ringkas dan wajar dalam narasi Indonesia.
- source_word: ἠρώτουν
  choice: terus meminta
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang. 'Terus meminta' menyampaikan aspek itu tanpa melebihkan maknanya menjadi 'memohon dengan sangat'.
- source_word: Ἀπόλυσον αὐτήν
  choice: Suruhlah dia pergi
  rationale: ἀπολύω berarti menyuruh pergi atau membiarkan pergi. Pilihan ini alami dan tetap tidak menentukan apakah para murid menginginkan permintaannya dikabulkan lebih dahulu.
- source_word: κράζει
  choice: terus berseru-seru
  rationale: κράζω menunjuk pada seruan keras. 'Terus berseru-seru' menyampaikan tindakan yang sedang berlangsung dan intensitasnya tanpa mereduksinya menjadi sekadar berteriak.
- source_word: ὄπισθεν ἡμῶν
  choice: di belakang kita
  rationale: Ungkapan ini secara langsung dapat menyatakan posisi di belakang, tetapi juga dapat bermakna mengikuti; alternatif tersebut dicatat dalam catatan kaki.
theological_decisions:
- issue: Maksud para murid dalam Ἀπόλυσον αὐτήν
  choice: Diterjemahkan secara netral sebagai 'Suruhlah dia pergi'.
  alternative: '''Kabulkanlah permintaannya, lalu suruh dia pergi'' atau ''Usirlah dia dari sini''.'
  rationale: Perintah Yunani tidak menjelaskan apakah mereka meminta Yesus mengabulkan permintaan perempuan itu lalu menyuruhnya pergi, atau sekadar menyingkirkannya. Terjemahan utama mempertahankan ketegangan naratif ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan tindakan pada bentuk imperfek dan ambiguitas utama teks Yunani.
