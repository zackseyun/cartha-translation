translation:
  language: id
  text: Namun, Yesus berkata, “Apakah kalian juga masih belum mengerti?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan responsif dengan kontras ringan terhadap pertanyaan para murid; “Namun” alami dan bermartabat dalam narasi Indonesia.
- source_word: ὁ … εἶπεν
  choice: Yesus berkata
  rationale: Artikel ὁ berfungsi secara pronominal dan menunjuk kepada Yesus dalam konteks. Penyebutan nama memperjelas subjek secara alami dalam bahasa Indonesia.
- source_word: Ἀκμὴν
  choice: masih
  rationale: Dalam pertanyaan teguran ini, ἀκμήν menyatakan keadaan yang terus berlangsung sampai saat itu. “Masih” menyampaikan makna tersebut secara ringkas tanpa pengulangan yang janggal.
- source_word: καὶ ὑμεῖς
  choice: kalian juga
  rationale: καί memasukkan para murid ke dalam kelompok yang belum memahami, sedangkan ὑμεῖς bersifat jamak. “Kalian juga” mempertahankan penekanan itu dengan jelas.
- source_word: ἀσύνετοί ἐστε
  choice: belum mengerti
  rationale: Ungkapan ini menunjuk pada kurangnya pengertian atau pemahaman. Dalam gabungan dengan ἀκμήν, “masih belum mengerti” adalah ungkapan Indonesia yang alami dan tidak memperkeras teguran menjadi kecaman moral.
theological_decisions:
- issue: Nada teguran Yesus kepada para murid
  choice: Pertanyaan tajam tentang ketidakmengertian yang masih berlanjut
  alternative: “Apakah kalian juga masih begitu bodoh?”
  rationale: ἀσύνετος dalam konteks ini berkaitan dengan kegagalan memahami pengajaran. “Belum mengerti” mempertahankan teguran Yesus tanpa menaikkannya menjadi vonis moral yang lebih keras.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” karena Yesus berbicara kepada para murid. Susunan pertanyaan dibuat alami, jelas, dan tetap mempertahankan tekanan pada “juga” serta keberlanjutan keadaan melalui “masih belum”.
