  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: id
  text: Lalu Yesus memanggil orang banyak mendekat dan berkata kepada mereka, “Dengarkan dan pahamilah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi; “Lalu” wajar dalam narasi Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: προσκαλεσάμενος
  choice: memanggil ... mendekat
  rationale: Partisip aoris medium ini menyatakan tindakan memanggil ke arah diri subjek yang mendahului atau menyertai ujaran utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur arah tersebut.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: ὄχλος menunjuk kepada sekumpulan orang. “Orang banyak” merupakan ungkapan Alkitabiah yang tetap jelas dan wajar dalam bahasa Indonesia modern.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Terjemahan langsung dan alami untuk verba λέγω dengan objek tak langsung αὐτοῖς.
- source_word: Ἀκούετε
  choice: Dengarkan
  rationale: Imperatif kini jamak ini meminta perhatian aktif. “Dengarkan” lebih idiomatis daripada “Dengarlah” untuk perintah agar memperhatikan ucapan berikutnya.
- source_word: συνίετε
  choice: pahamilah
  rationale: Imperatif ini meminta pendengar menangkap makna, bukan hanya mendengar bunyi. Akhiran -lah menyampaikan perintah secara wajar dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Yesus” dinyatakan untuk menjernihkan subjek yang tersirat dalam bentuk verba Yunani; konteks sebelumnya mengidentifikasi pembicara. Tidak diperlukan catatan kaki karena alternatif “dengar” tidak menimbulkan perbedaan makna penting dalam bahasa sasaran.
