  source_fidelity: Teks Indonesia dengan tepat menyampaikan urutan naratif Καὶ, tindakan προσκαλεσάμενος terhadap τὸν ὄχλον, dan dua imperatif Ἀκούετε καὶ συνίετε. “Memanggil orang banyak mendekat” secara wajar mengungkapkan unsur mengumpulkan orang banyak kepada pembicara. Penyebutan “Yesus” merupakan penjelasan subjek yang aman dari konteks dekat dan tidak mengubah makna.
  naturalness: Bahasa baku, jelas, dan lancar untuk pembaca Indonesia modern. “Lalu Yesus memanggil orang banyak mendekat dan berkata kepada mereka” berfungsi baik sebagai narasi. “Dengarkan dan pahamilah” adalah seruan yang alami dan mempertahankan pembedaan antara menyimak dan memahami.
  terminology: “Orang banyak” adalah padanan yang mapan dan tetap mudah dipahami untuk ὄχλος. Istilah “Dengarkan” dan “pahamilah” akurat tanpa menambahkan penafsiran teologis. Tidak ada istilah teologis khusus yang perlu distandardisasi dalam ayat ini.
