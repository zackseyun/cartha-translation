  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan urutan dasar Yunani: Yesus meninggalkan tempat sebelumnya (ἐξελθὼν ἐκεῖθεν), lalu ἀνεχώρησεν ke kawasan yang dikaitkan dengan Tirus dan Sidon. “Menyingkir” merupakan padanan yang layak untuk ἀνεχώρησεν dan mempertahankan nuansa menjauh/berundurnya tanpa menyatakan motif yang tidak disebutkan teks. “Ke daerah Tirus dan Sidon” tepat untuk εἰς τὰ μέρη Τύρου καὶ Σιδῶνος dan tidak menyiratkan bahwa ia pasti memasuki kedua kota itu.'
