id: MAT.15.21
reference: Matthew 15:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: id
  text: Kemudian Yesus pergi dari sana dan menyingkir ke daerah Tirus dan Sidon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berangkat ke wilayah Tirus dan Sidon.” Kata Yunani yang diterjemahkan “menyingkir” juga dapat diterjemahkan secara lebih netral, tetapi “menyingkir” mencerminkan pemakaian kata tersebut yang berulang dalam Injil Matius.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kemudian
  rationale: Berfungsi sebagai penghubung alur cerita. Dalam narasi Indonesia, “Kemudian” menghubungkan tindakan ini dengan konteks sebelumnya secara alami tanpa menambahkan penekanan sebab-akibat.
- source_word: ἐξελθὼν
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. “Pergi dari sana” menyampaikan gerak meninggalkan tempat sebelumnya dengan wajar; unsur keluar dipahami dari frasa tersebut.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Menyatakan titik keberangkatan dari lokasi dalam konteks sebelumnya dan merupakan ungkapan Indonesia yang lugas.
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: Dalam Injil Matius, verba ini kerap mengandung nuansa mengundurkan diri atau menjauh. “Menyingkir” mempertahankan nuansa itu tanpa menyatakan bahwa Yesus melarikan diri atau menjelaskan motif-Nya.
- source_word: εἰς τὰ μέρη
  choice: ke daerah
  rationale: Menunjuk gerak menuju kawasan umum yang berkaitan dengan kedua kota, tanpa memastikan bahwa Yesus memasuki kota-kota itu sendiri.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Tirus dan Sidon
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia; kedua bentuk genetif menerangkan daerah yang berkaitan dengan kota-kota tersebut.
theological_decisions:
- issue: Nuansa pergerakan Yesus menuju wilayah yang berkaitan dengan bangsa-bangsa bukan Yahudi
  choice: Menerjemahkan ἀνεχώρησεν sebagai “menyingkir” tanpa menyebutkan motif teologis atau psikologis.
  alternative: “berangkat” atau “pergi” sebagai padanan yang lebih netral; “mundur” sebagai padanan yang lebih kuat.
  rationale: Kata Yunani dapat menyiratkan tindakan menjauh atau mengundurkan diri, khususnya dalam pemakaian Matius, tetapi ayat ini tidak menjelaskan alasan Yesus pergi. Terjemahan mempertahankan nuansa naratif itu tanpa menafsirkan motif-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Daerah” dipilih sebagai istilah umum yang mudah dipahami, dan susunan kalimat mengikuti alur tindakan Yunani secara alami.
