  terminology: Nama tempat “Tirus” dan “Sidon” mengikuti penggunaan Alkitab bahasa Indonesia yang lazim. Istilah “daerah” sesuai register dan cakupan makna μέρη. Catatan kaki berjangkar tepat pada keseluruhan tujuan perjalanan dan secara memadai menjelaskan alternatif leksikal tanpa menambahkan tafsiran teologis.
