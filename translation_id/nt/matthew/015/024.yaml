  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: id
  text: Namun, Yesus menjawab, “Aku diutus hanya kepada domba-domba yang hilang dari umat Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku tidak diutus kecuali kepada domba-domba yang hilang dari rumah Israel.”'
    reason: Menampilkan bentuk negatif-ekseptif Οὐκ ... εἰ μή serta idiom οἴκου Ἰσραήλ, yang dalam teks utama diterjemahkan secara alami.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Namun, Yesus menjawab
  rationale: Konstruksi partisip aoris diikuti verba finit diterjemahkan secara idiomatis sebagai ‘menjawab’. Subjek ‘Yesus’ dijelaskan dari konteks agar alami dalam bahasa Indonesia; δέ ditampilkan sebagai ‘Namun’ untuk menandai peralihan yang kontras.
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: Aku diutus hanya kepada
  rationale: Bentuk pasif aoris menyatakan pengutusan atau mandat. Gabungan negatif dengan εἰ μή membatasi tujuan pengutusan; ‘hanya kepada’ menyampaikan maknanya secara alami sambil mempertahankan pembatasan yang tegas.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: domba-domba yang hilang
  rationale: Citra domba dipertahankan, dan partisip perfek ἀπολωλότα diterjemahkan ‘yang hilang’, bukan ‘yang binasa’, karena konteksnya menggambarkan domba yang tersesat atau hilang tanpa menegaskan kebinasaan akhir.
- source_word: οἴκου Ἰσραήλ
  choice: kaum Israel
  rationale: Dalam bahasa Indonesia modern, ‘kaum Israel’ secara alami menyampaikan idiom kolektif-semitik ‘rumah Israel’ sebagai bangsa atau umat Israel. Bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan misi Yesus dalam perkataan ini
  choice: 'Pernyataan diterjemahkan sebagai pembatasan tegas: ‘hanya kepada ... kaum Israel’.'
  alternative: Mengartikannya sekadar sebagai prioritas bagi Israel, atau memperluasnya berdasarkan misi kemudian kepada bangsa-bangsa lain.
  rationale: Pola Yunani Οὐκ ... εἰ μὴ bersifat membatasi. Terjemahan mempertahankan ketegangan naratif dan teologis itu tanpa melunakkannya atau menyelaraskannya secara eksplisit dengan perkembangan kanonis selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘Aku’ mengikuti gaya langsung perkataan Yesus. ‘Kaum Israel’ dipilih agar mudah dipahami pembaca umum, sedangkan bentuk ‘rumah Israel’ dipertahankan dalam catatan kaki. Penanda catatan kaki ditempatkan setelah kutipan.
