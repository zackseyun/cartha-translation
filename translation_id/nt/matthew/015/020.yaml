id: MAT.15.20
reference: Matthew 15:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: id
  text: Hal-hal inilah yang menajiskan seseorang,[a] tetapi makan dengan tangan yang tidak dibasuh tidak menajiskan seseorang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat seseorang menjadi najis.” Kata Yunani yang digunakan dapat menunjuk pada keadaan najis secara ritual; dalam konteks ini, “menajiskan” juga mempertahankan makna pencemaran moral yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: Hal-hal inilah yang
  rationale: Ungkapan ini mempertahankan penekanan demonstratif pada ταῦτα dan tetap alami dalam bahasa Indonesia modern.
- source_word: κοινοῦντα / κοινοῖ
  choice: menajiskan / menajiskan
  rationale: Dalam konteks perdebatan tentang kemurnian, κοινόω berarti menjadikan seseorang najis, dengan cakupan yang dapat mencakup kenajisan ritual maupun pencemaran moral. 'Menajiskan' mempertahankan kedua nuansa itu.
- source_word: τὸν ἄνθρωπον
  choice: seseorang
  rationale: Bentuk tunggal Yunani dipakai secara umum untuk seorang manusia. 'Seseorang' mempertahankan makna tunggal dan universal secara alami tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: τὸ ... ἀνίπτοις χερσὶν φαγεῖν
  choice: makan dengan tangan yang tidak dibasuh
  rationale: Susunan ini menerjemahkan infinitif φαγεῖν serta frasa datif ἀνίπτοις χερσίν dengan jelas dan mempertahankan kaitannya dengan persoalan pembasuhan tangan.
- source_word: δέ
  choice: tetapi
  rationale: Kata ini menyatakan pertentangan antara hal-hal yang benar-benar menajiskan dan makan tanpa membasuh tangan.
theological_decisions:
- issue: Cakupan makna κοινόω dalam perdebatan mengenai kemurnian
  choice: menajiskan
  alternative: membuat seseorang menjadi najis
  rationale: '''Menajiskan'' mempertahankan latar kemurnian ritual sekaligus daya moral perkataan Yesus, tanpa membatasi maknanya pada salah satu sisi saja.'
- issue: Bentuk tunggal generik ἄνθρωπον
  choice: seseorang
  alternative: manusia itu
  rationale: Bahasa Indonesia tidak perlu memakai bentuk bergender untuk mempertahankan bentuk tunggal representatif. 'Seseorang' menyampaikan kebenaran umum tentang setiap manusia dengan wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan 'menajiskan seseorang' dipertahankan untuk mencerminkan kontras dan kesejajaran dalam teks Yunani. Istilah 'dibasuh' dipilih daripada 'dicuci' karena lebih sesuai dengan latar pembasuhan ritual.
