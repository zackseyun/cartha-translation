  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: id
  text: Sebab Allah berfirman, “Hormatilah ayahmu dan ibumu,” dan, “Siapa yang mencaci ayah atau ibu harus dihukum mati.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang mengutuki ayah atau ibu harus dihukum mati.”
    reason: «Mengutuki» adalah alternatif leksikal yang mungkin untuk κακολογῶν, sedangkan «mencaci» lebih baik mempertahankan cakupan luas kata Yunani tersebut dalam terjemahan utama.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς εἶπεν
  choice: Sebab Allah berfirman
  rationale: γάρ memberi alasan bagi argumen Yesus, sehingga diterjemahkan “Sebab”. Dalam konteks kutipan Kitab Suci, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat untuk εἶπεν tanpa mengubahnya menjadi verba yang secara eksplisit berarti “memerintahkan”.
- source_word: Τίμα
  choice: Hormatilah
  rationale: Bentuk imperatif τιμάω menuntut pemberian hormat yang semestinya; “Hormatilah” mempertahankan bobot etis perintah tersebut.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ayahmu dan ibumu
  rationale: Akhiran posesif orang kedua membuat perintah ini alami dalam bahasa Indonesia dan selaras dengan bentuk perintah yang dikutip, tanpa mengubah acuannya.
- source_word: Ὁ κακολογῶν
  choice: Siapa yang mengutuki
  rationale: Partisipel substantival diterjemahkan secara idiomatis sebagai “Siapa yang”. Dalam konteks hukum tentang orang tua, κακολογέω berarti mencaci atau mengutuki; “mengutuki” mempertahankan kekuatan ungkapan tersebut.
- source_word: πατέρα ἢ μητέρα
  choice: ayah atau ibunya
  rationale: “Ayah atau ibunya” menyatakan hubungan orang tua secara wajar dalam bahasa Indonesia; konjungsi “atau” mempertahankan ἢ.
- source_word: θανάτῳ τελευτάτω
  choice: harus dihukum mati
  rationale: Ungkapan ini merupakan formula hukuman mati. Bahasa Indonesia “harus dihukum mati” menyampaikan akibat hukum secara jelas dan alami, meskipun bentuk Yunani secara harfiah tidak menyebut pelaksana hukuman.
theological_decisions:
- issue: Cara menerjemahkan formula hukuman mati θανάτῳ τελευτάτω
  choice: harus dihukum mati
  alternative: harus mati
  rationale: Konteksnya adalah kutipan hukum yang menetapkan hukuman, sehingga “harus dihukum mati” menyampaikan fungsi yuridis formula itu secara jelas. Alternatif “harus mati” lebih dekat pada bentuk tanpa pelaku, tetapi dalam bahasa Indonesia dapat terdengar seperti sekadar prediksi kematian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” sesuai dengan konteks perkataan Allah; “ayahmu dan ibumu” mudah dipahami pembaca umum. Tidak diperlukan catatan kaki karena pilihan utama menyampaikan makna hukum dan leksikal secara memadai.
