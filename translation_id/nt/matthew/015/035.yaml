lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan rangkaian tindakan dalam narasi; 'Lalu' terdengar alami dalam bahasa Indonesia modern.
- source_word: παραγγείλας
  choice: setelah menyuruh
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama pada ayat berikutnya. 'Menyuruh' mempertahankan daya direktifnya tanpa terdengar terlalu keras.
- source_word: τῷ ὄχλῳ
  choice: orang banyak itu
  rationale: Frasa ini adalah objek tak langsung dari παραγγείλας. 'Orang banyak itu' alami dalam narasi Alkitab bahasa Indonesia dan merujuk kepada kelompok yang sudah hadir dalam konteks.
- source_word: ἀναπεσεῖν
  choice: duduk
  rationale: Dalam konteks jamuan, verba ini berarti mengambil posisi untuk makan, yang pada zaman itu kerap dilakukan dengan berbaring atau bersandar. 'Duduk' paling mudah dipahami pembaca Indonesia, sementara nuansa postur aslinya dipertahankan dalam catatan kaki.
- source_word: ἐπὶ τὴν γῆν
  choice: di tanah
  rationale: Di sini γῆ menunjuk permukaan tanah tempat orang banyak mengambil posisi, bukan bumi secara global. 'Di tanah' merupakan ungkapan Indonesia yang wajar dengan verba 'duduk'.
