  text: 'Hai orang-orang munafik! Tepat sekali Yesaya bernubuat tentang kalian ketika ia berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hai orang-orang munafik!
  rationale: Bentuk vokatif jamak ini merupakan sapaan langsung yang bernada kecaman keras. Partikel “Hai” membuat fungsi sapaan itu jelas dalam bahasa Indonesia tanpa melunakkan tuduhannya.
- source_word: καλῶς
  choice: Tepat sekali
  rationale: Adverbia ini menyatakan bahwa nubuat Yesaya sungguh tepat atau sesuai bagi para lawan bicara Yesus. “Tepat sekali” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: ἐπροφήτευσεν
  choice: bernubuat
  rationale: Padanan langsung dan lazim untuk tindakan menyampaikan nubuat, serta mempertahankan kaitan Yesaya dengan perannya sebagai nabi.
- source_word: περὶ ὑμῶν
  choice: tentang kalian
  rationale: περί dengan genetif berarti “tentang” atau “mengenai.” “Kalian” menyatakan orang kedua jamak secara jelas dan wajar.
- source_word: Ἠσαΐας
  choice: Yesaya
  rationale: Bentuk nama nabi yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: λέγων
  choice: ketika ia berkata,
  rationale: Partisipel ini memperkenalkan kutipan yang menyusul. Bentuk ini alami dalam bahasa Indonesia dan membuat Yesaya tetap jelas sebagai pelaku perkataan.
theological_decisions:
- issue: Kekuatan sapaan Yesus kepada orang Farisi dan ahli Taurat
  choice: 'Sapaan langsung yang mengecam: “Hai orang-orang munafik!”'
  alternative: Ungkapan yang lebih lunak seperti “orang-orang yang berpura-pura”
  rationale: ὑποκριταί dalam konteks ini merupakan tuduhan moral-keagamaan yang tegas. Pelunakan akan mengurangi bobot penghakiman Yesus dan kaitannya dengan kutipan Yesaya yang menyusul.
- issue: Hubungan nubuat Yesaya dengan para lawan bicara Yesus
  choice: Yesaya bernubuat “tentang kalian”
  alternative: Yesaya hanya mengatakan sesuatu yang secara umum dapat diterapkan kepada mereka
  rationale: περὶ ὑμῶν secara langsung menghubungkan isi nubuat dengan para lawan bicara Yesus. Terjemahan mempertahankan ketegangan retoris ini tanpa menjelaskan lebih jauh bagaimana nubuat tersebut berlaku atas mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Hai” menandai vokatif dengan jelas; “kalian” dipakai karena acuannya jamak. Tanda koma pada akhir ayat menunjukkan bahwa perkataan berikutnya merupakan kutipan langsung.
