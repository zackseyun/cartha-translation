  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: id
  text: Namun Ia menjawab, “Setiap tanaman[a] yang tidak ditanam oleh Bapa-Ku yang di surga akan dicabut sampai ke akar-akarnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap sesuatu yang ditanam.”
    reason: φυτεία dapat menunjuk pada tanaman sebagai hasil penanaman atau pada sesuatu yang ditanam; alternatif ini mempertahankan keluasan leksikal tersebut.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Ungkapan ini merupakan formula naratif Yunani yang dipengaruhi gaya Semitis. Dalam bahasa Indonesia modern, “Ia menjawab” sudah menyampaikan fungsi kedua verba secara alami tanpa pengulangan “menjawab dan berkata” yang terasa kaku.
- source_word: Πᾶσα
  choice: Setiap
  rationale: “Setiap” menyampaikan makna distributif dan sesuai dengan nomina tunggal yang mengikutinya.
- source_word: φυτεία
  choice: tanaman
  rationale: Kata ini dapat berarti sesuatu yang ditanam atau suatu penanaman. “Tanaman” paling alami dalam metafora ini dan selaras dengan tindakan mencabutnya sampai ke akar.
- source_word: ἐφύτευσεν
  choice: ditanam
  rationale: Terjemahan langsung ini mempertahankan metafora pertanian dan hubungan leksikal dengan “tanaman”.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Bapa-Ku yang di surga
  rationale: Ungkapan ini alami dalam bahasa Indonesia, mempertahankan kepemilikan “-Ku,” dan menyampaikan sifat surgawi Bapa tanpa terdengar kaku.
- source_word: ἐκριζωθήσεται
  choice: akan dicabut sampai ke akar-akarnya
  rationale: Frasa ini menyatakan dengan jelas tindakan mencabut dari akar dan mempertahankan gambaran pertanian sekaligus nuansa penghakiman dalam bentuk pasif futur.
theological_decisions:
- issue: Rujukan metaforis “setiap tanaman”
  choice: Metafora dipertahankan sebagai “setiap tanaman” tanpa menentukan rujukannya.
  alternative: Setiap ajaran; setiap tradisi; setiap orang yang tidak ditanam oleh Bapa.
  rationale: Teks Yunani membiarkan rujukan metafora ini terbuka dalam konteksnya. Mempertahankan gambaran tanaman menghindari pemaksaan satu tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur kalimat mempertahankan metafora pertanian dan bentuk pasif, sementara formula naratif diringkas secara idiomatis.
