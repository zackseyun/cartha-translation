id: MAT.15.36
reference: Matthew 15:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: id
  text: Ia mengambil ketujuh roti dan ikan-ikan itu. Setelah mengucap syukur, Ia memecah-mecahkannya dan terus memberikannya kepada murid-murid, lalu murid-murid membagikannya kepada orang banyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: mengambil
  rationale: Dalam urutan tindakan ini, λαμβάνω menyatakan bahwa Yesus mengambil makanan itu sebelum mengucap syukur dan membagikannya; 'mengambil' merupakan padanan naratif yang alami.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ketujuh roti
  rationale: ἄρτος di sini menunjuk pada roti-roti yang dapat dihitung. Dalam bahasa Indonesia, 'ketujuh roti' menyatakan jumlahnya dengan alami tanpa harus menambahkan kata penggolong.
- source_word: τοὺς ἰχθύας
  choice: ikan-ikan itu
  rationale: Bentuk ulang menandai jamak yang nyata dalam konteks ini, sedangkan 'itu' mempertahankan sifat tertentu dari artikel Yunani.
- source_word: εὐχαριστήσας
  choice: setelah mengucap syukur
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan memecah-mecahkan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: ἔκλασεν
  choice: Ia memecah-mecahkannya
  rationale: κλάω menunjuk pada tindakan memecah makanan agar dapat dibagikan. Bentuk ulang memberi gambaran tindakan memecah menjadi bagian-bagian, sedangkan '-nya' memasok objek yang tersirat oleh konteks.
- source_word: ἐδίδου
  choice: terus memberikannya
  rationale: Bentuk imperfek menggambarkan tindakan pemberian yang berlangsung atau berulang selama pembagian makanan.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: Datif menandai para penerima. Kata milik seperti 'murid-murid-Nya' tidak ditambahkan karena tidak dinyatakan secara eksplisit.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: lalu murid-murid membagikannya kepada orang banyak
  rationale: Klausa Yunani menghilangkan verba yang dipahami dari konteks. Bahasa Indonesia memerlukan verba yang dinyatakan; 'membagikannya' menyampaikan bahwa para murid meneruskan makanan itu kepada khalayak.
theological_decisions:
- issue: Kemungkinan gema ekaristis dalam εὐχαριστήσας
  choice: setelah mengucap syukur
  alternative: memakai ungkapan liturgis yang lebih khusus untuk menonjolkan kaitan dengan Perjamuan Tuhan
  rationale: Ayat ini mungkin menggemakan pola yang kemudian dikaitkan dengan Perjamuan Tuhan, tetapi secara langsung hanya menceritakan Yesus mengucap syukur atas makanan. Terjemahan tidak memperluas maknanya menjadi pernyataan sakramental.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Ia' dipakai sebagai pronomina naratif yang ringkas. Klausa eliptis Yunani dilengkapi secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran teologis.
