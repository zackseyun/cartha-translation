id: MAT.15.27
reference: Matthew 15:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: id
  text: Namun perempuan itu berkata, “Ya, Tuhan,[a] sebab bahkan anjing-anjing kecil makan dari remah-remah yang jatuh dari meja tuan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Tuhan” juga dapat dipahami sebagai sapaan hormat, “Tuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Benar
  rationale: Jawaban afirmatif ini mengakui perkataan Yesus sebelumnya; “Benar” terdengar alami dalam dialog dan lebih lancar daripada “Ya” sebelum sapaan “Tuhan”.
- source_word: κύριε
  choice: Tuhan
  rationale: Dalam sapaan kepada Yesus, “Tuhan” mempertahankan kemungkinan makna yang lebih dalam daripada sekadar sapaan hormat, tanpa meniadakan arti “Tuan” dalam konteks percakapan.
- source_word: καὶ γὰρ
  choice: tetapi ... pun
  rationale: 'Dalam konteks ini, ungkapan tersebut mendukung tanggapan yang menerima gambaran sebelumnya sekaligus mengajukan alasan balik: bahkan anjing kecil mendapat remah. “Tetapi ... pun” menyampaikan alur argumentasi itu secara alami dalam bahasa Indonesia.'
- source_word: κυνάρια
  choice: anjing-anjing kecil
  rationale: Bentuk diminutif Yunani dipertahankan dengan “kecil”; ungkapan ini dapat menunjuk anjing kecil atau anjing rumah tanpa mempersempitnya menjadi anak anjing.
- source_word: ἐσθίει
  choice: makan
  rationale: Arti dasarnya adalah “makan”; subjek netral jamak dalam bahasa Yunani dapat memakai verba tunggal, sedangkan bahasa Indonesia tidak memerlukan penyesuaian jumlah pada verba.
- source_word: ψιχίων
  choice: remah-remah
  rationale: Kata ini menunjuk potongan makanan yang sangat kecil dan paling tepat diungkapkan sebagai “remah-remah” dalam gambaran meja makan.
- source_word: τῶν πιπτόντων
  choice: yang jatuh
  rationale: Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan tindakan umum yang dinyatakan oleh partisipel kini.
- source_word: τραπέζης
  choice: meja
  rationale: Padanan langsung dan alami yang mempertahankan latar rumah tangga dalam perumpamaan singkat ini.
- source_word: τῶν κυρίων αὐτῶν
  choice: tuan mereka
  rationale: Di sini κύριος menunjuk orang yang memiliki atau menguasai anjing-anjing itu. “Tuan mereka” mempertahankan hubungan tersebut dan juga permainan leksikal dengan sapaan “Tuhan,” meski kapitalisasi membedakan acuannya.
theological_decisions:
- issue: Makna κύριε sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” merupakan sapaan Injil yang lazim dan menjaga kemungkinan pengakuan akan kewibawaan Yesus. Namun, bahasa Yunani juga memungkinkan sapaan hormat biasa, sehingga alternatif itu dicatat.
- issue: Daya diminutif κυνάρια dalam metafora yang keras
  choice: anjing-anjing kecil
  alternative: anjing; anjing rumah; anak anjing
  rationale: Terjemahan ini mempertahankan bentuk diminutif tanpa menghapus ketegangan metafora atau secara pasti menentukan usia maupun status domestik hewan itu.
- issue: Hubungan logis καὶ γὰρ dengan perkataan sebelumnya
  choice: tetapi ... pun
  alternative: sebab bahkan; karena ... juga
  rationale: Ucapan perempuan itu menyetujui premis sebelumnya, tetapi memakai gambaran yang sama untuk mendukung permohonannya. Pilihan ini membuat gerak argumentatif tersebut jelas tanpa menolak perkataan Yesus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Namun perempuan itu berkata” mempertahankan peralihan naratif δὲ. Pengulangan “anjing-anjing kecil” dan “remah-remah” sesuai kaidah Indonesia dan menjaga nuansa jamak serta diminutif. Penanda catatan kaki [a] ditempatkan langsung sesudah sapaan yang dijelaskan.
