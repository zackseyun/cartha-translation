  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: id
  text: Mereka semua makan sampai kenyang, lalu mereka memungut tujuh bakul[a] yang penuh dengan potongan-potongan yang tersisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bakul” di sini dapat merujuk pada jenis bakul yang lebih besar daripada keranjang yang disebut dalam beberapa kisah pemberian makan lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον πάντες
  choice: mereka semua makan
  rationale: Menyatakan subjek jamak yang tersirat dan mempertahankan cakupan universal πάντες dalam bahasa Indonesia yang alami.
- source_word: ἐχορτάσθησαν
  choice: sampai kenyang
  rationale: Dalam konteks ini χορτάζω berarti diberi makan hingga kenyang; ungkapan ini alami dan jelas bagi pembaca modern.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: potongan-potongan yang tersisa
  rationale: Menerjemahkan partisip substantival τὸ περισσεῦον beserta genitif κλασμάτων secara alami tanpa menentukan lebih jauh jenis makanannya.
- source_word: ἦραν
  choice: mengumpulkan
  rationale: Dalam konteks pengumpulan sisa makanan, αἴρω paling wajar diterjemahkan sebagai tindakan mengumpulkan atau memungut.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: tujuh bakul penuh
  rationale: Mempertahankan jumlah, jenis wadah, dan sifatnya yang penuh. 'Bakul' merupakan padanan Indonesia yang konkret dan bermartabat untuk σπυρίς.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan seluruh unsur makna sumber Yunani; penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
