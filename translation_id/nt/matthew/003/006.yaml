  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: id
  text: Dan mereka dibaptis[a] olehnya di Sungai Yordan sambil mengakui dosa-dosa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “dibaptis”; bentuk imperfek Yunani dapat menekankan tindakan yang sedang berlangsung atau terjadi berulang kali: “sedang dibaptis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: dibaptis
  rationale: Bentuk imperfek pasif menunjukkan tindakan yang berlangsung atau berulang dalam alur cerita. Bahasa Indonesia tidak perlu menandai aspek ini secara eksplisit dalam teks utama; alternatif aspek dijelaskan dalam catatan kaki. Istilah ritual “dibaptis” dipertahankan tanpa menentukan caranya.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: di Sungai Yordan
  rationale: ἐν dengan datif bersifat lokatif, sedangkan ποταμῷ secara eksplisit menyebut Yordan sebagai sungai. “Di Sungai Yordan” alami dalam bahasa Indonesia modern.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: ὑπό dengan genitif menandai pelaku. Pronomina tersebut dipertahankan, tanpa menggantinya secara eksplisit dengan “Yohanes” dari konteks.
- source_word: ἐξομολογούμενοι
  choice: sambil mengakui
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan pembaptisan. “Sambil mengakui” menyampaikan hubungan waktu itu secara alami dan tetap mempertahankan makna pengakuan terbuka atas kesalahan.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: dosa-dosa mereka
  rationale: Terjemahan langsung yang mempertahankan bentuk jamak dan kepemilikan.
- source_word: καὶ
  choice: Mereka
  rationale: Kata penghubung καί mengaitkan ayat ini dengan ayat sebelumnya. Dalam bahasa Indonesia, kesinambungan narasi dapat dinyatakan secara alami tanpa menerjemahkannya secara mekanis sebagai “dan” pada awal kalimat.
theological_decisions:
- issue: Istilah dan cara baptisan
  choice: Menggunakan “dibaptis” tanpa merinci caranya.
  alternative: dicelupkan; dibasuh
  rationale: Ayat ini menyatakan bahwa orang-orang itu dibaptis di Sungai Yordan oleh Yohanes, tetapi tidak secara tersurat mendefinisikan cara pelaksanaannya. “Dibaptis” mempertahankan istilah ritual dan tidak memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan “sambil mengakui” memperjelas bahwa pengakuan dosa berlangsung bersamaan dengan pembaptisan. Penanda catatan kaki ditempatkan sesudah “Sungai Yordan” agar selaras dengan lapisan konsultasi, meskipun catatannya menerangkan aspek verba “dibaptis”.
