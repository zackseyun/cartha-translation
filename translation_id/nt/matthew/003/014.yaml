  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: id
  text: Namun, Yohanes terus berusaha mencegah-Nya[a] sambil berkata, “Akulah yang perlu dibaptis oleh-Mu, dan Engkau datang kepadaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yohanes berusaha mencegah-Nya.” Bentuk imperfek kata kerja Yunani dapat menunjukkan tindakan yang berulang atau berlanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: terus berusaha mencegah-Nya
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau dilakukan berulang kali; ungkapan ini menyampaikan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisip ini menghubungkan usaha Yohanes mencegah Yesus dengan perkataan yang menjelaskan keberatannya.
- source_word: χρείαν ἔχω
  choice: Akulah yang perlu
  rationale: Idiom ini berarti ‘aku perlu’; partikel -lah memberi penekanan alami pada ἐγώ tanpa membuat kalimat kaku.
- source_word: ὑπὸ σοῦ
  choice: oleh-Mu
  rationale: Dengan infinitif pasif βαπτισθῆναι, ὑπό dengan genitif menandai pelaku pribadi.
- source_word: βαπτισθῆναι
  choice: dibaptis
  rationale: Terjemahan ini mempertahankan bentuk pasif dan tidak menentukan cara pelaksanaan baptisan lebih jauh daripada teks.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: tetapi Engkau justru datang kepadaku?
  rationale: Dalam pertanyaan retoris ini, καί menonjolkan kontras. ‘Justru’ menyampaikan keheranan Yohanes secara wajar, sedangkan bentuk kini diterjemahkan dengan ‘datang’.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras dengan kedatangan Yesus kepada Yohanes dalam ayat sebelumnya.
theological_decisions:
- issue: Keberatan Yohanes untuk membaptis Yesus
  choice: Pernyataan diterjemahkan sebagai pengakuan Yohanes bahwa ia sendiri perlu dibaptis oleh Yesus, tanpa menjelaskan dasar teologisnya lebih jauh.
  alternative: Menafsirkannya secara khusus sebagai pernyataan tentang ketidakberdosaan Yesus atau semata-mata tentang kedudukan dan wewenang.
  rationale: Ayat ini menunjukkan keunggulan Yesus dan kebutuhan Yohanes, tetapi tidak menguraikan sepenuhnya alasan teologisnya; ketegangan itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Susunan dialog dibuat alami sambil mempertahankan penekanan pada ‘aku’ dan kontras dengan kedatangan Yesus.
