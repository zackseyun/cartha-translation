id: MAT.3.15
reference: Matthew 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: id
  text: Namun, Yesus menjawabnya, “Izinkanlah hal itu untuk saat ini, karena demikianlah sepatutnya kita menggenapi seluruh kebenaran[a].” Lalu Yohanes mengizinkan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh keadilan.” Kata Yunani yang digunakan dapat berarti kebenaran atau keadilan; di sini “kebenaran” lebih sesuai dengan penekanan Matius pada hidup dan tindakan yang selaras dengan kehendak Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Namun, Yesus menjawabnya
  rationale: Ungkapan ἀποκριθεὶς ... εἶπεν secara idiomatis berarti ‘menjawab’; δέ menandai pertentangan dengan keberatan Yohanes pada ayat sebelumnya, sehingga diterjemahkan ‘Namun’.
- source_word: Ἄφες ἄρτι
  choice: Biarkanlah hal itu terjadi sekarang
  rationale: Dalam konteks ini ἀφίημι berarti membiarkan atau mengizinkan, bukan mengampuni. Tambahan ‘hal itu terjadi’ menyatakan objek yang tersirat—pembaptisan Yesus oleh Yohanes—tanpa mempersempit maknanya lebih jauh; ἄρτι menunjuk pada saat ini.
- source_word: οὕτως γὰρ
  choice: karena dengan cara demikian
  rationale: Terjemahan ini mempertahankan daya tunjuk οὕτως kepada tindakan yang baru dibicarakan, yaitu Yohanes membaptis Yesus.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: sudah sepatutnya kita
  rationale: πρέπον menyatakan sesuatu yang patut atau sesuai. ‘Sudah sepatutnya’ alami dalam bahasa Indonesia dan tetap membawa bobot moral serta situasional frasa Yunani.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: menggenapi seluruh kebenaran
  rationale: ‘Menggenapi’ mempertahankan resonansi khas πληρόω dalam Matius dengan maksud ilahi. ‘Seluruh kebenaran’ menjaga keluasan dan ketegangan teologis δικαιοσύνη tanpa mengubahnya menjadi uraian tentang tuntutan hukum tertentu.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Lalu Yohanes mengizinkan Dia
  rationale: Bentuk kini ἀφίησιν berfungsi sebagai present historis. Nama ‘Yohanes’ memperjelas pelaku yang dapat membingungkan jika hanya diterjemahkan ‘ia’, sedangkan ‘Dia’ mewakili objek αὐτόν, yaitu Yesus. ‘Mengizinkan’ sesuai dengan makna kontekstual bahwa Yohanes bersedia melaksanakan pembaptisan.
theological_decisions:
- issue: Makna πᾶσαν δικαιοσύνην (‘seluruh kebenaran’)
  choice: Ungkapan luas tentang menggenapi apa yang sesuai dengan kehendak Allah yang benar dalam peristiwa ini
  alternative: Menggenapi setiap tuntutan hukum; atau ‘seluruh keadilan’
  rationale: Konteks langsung menghubungkannya dengan pembaptisan Yesus oleh Yohanes, tetapi ayat ini tidak menjelaskannya sebagai sekadar pemenuhan hukum. Terjemahan harfiah yang wajar mempertahankan keluasan maksud Matius dan tidak memasukkan sistem doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. ‘Namun’ menyambungkan ayat ini dengan keberatan Yohanes sebelumnya. Perintah dibuat alami melalui ‘hal itu terjadi’, sedangkan istilah teologis ‘kebenaran’ dipertahankan dan alternatif leksikalnya dicatat dalam catatan kaki.
