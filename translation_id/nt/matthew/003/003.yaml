  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: id
  text: 'Sebab dialah yang dimaksudkan dalam perkataan yang disampaikan melalui Nabi Yesaya: “Suara seseorang yang berseru di padang belantara[a]: ‘Persiapkanlah jalan Tuhan[b]; luruskanlah jalan-jalan-Nya.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Suara seseorang yang berseru: ‘Di padang belantara, persiapkanlah jalan Tuhan ….’”'
    reason: Frasa “di padang belantara” dapat dipahami sebagai keterangan bagi perintah berikutnya, sesuai dengan susunan Yesaya 40:3 dalam teks Ibrani.
  - marker: b
    text: Atau, “TUHAN”; kutipan ini menggemakan Yesaya 40:3, yang dalam teks Ibrani memakai nama ilahi YHWH.
    reason: Menjelaskan latar belakang nama ilahi dalam sumber Ibrani sambil mempertahankan κυρίου sebagai “Tuhan” dalam teks utama.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν ὁ ῥηθεὶς
  choice: Sebab, dialah yang dimaksudkan dalam perkataan
  rationale: Ungkapan ini menjelaskan bahwa Yohaneslah tokoh yang dimaksud oleh nubuat tersebut. “Dialah” mempertahankan penunjukan tegas οὗτος, sedangkan “dimaksudkan dalam perkataan” menyampaikan fungsi partisip pasif ὁ ῥηθεὶς secara wajar dalam bahasa Indonesia.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου λέγοντος
  choice: yang disampaikan melalui Nabi Yesaya ketika ia berkata
  rationale: “Melalui” mempertahankan fungsi διά dengan genitif sebagai perantaraan kenabian. “Ketika ia berkata” memperkenalkan kutipan secara alami dan mengacu kepada Yesaya.
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: Ada suara orang yang berseru di padang belantara
  rationale: “Ada suara” mencerminkan φωνή tanpa kata sandang; “orang yang berseru” mempertahankan konstruksi genitif βοῶντος. “Padang belantara” sesuai dengan wilayah sunyi yang terkait dengan pelayanan Yohanes dan gema Yesaya 40:3.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Siapkanlah jalan bagi Tuhan
  rationale: Bentuk imperatif dipertahankan dengan “Siapkanlah”. “Jalan bagi Tuhan” alami dalam bahasa Indonesia dan tetap mempertahankan metafora kenabian serta κύριος dalam teks Yunani.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: luruskanlah jalan-jalan-Nya
  rationale: “Luruskanlah” menyampaikan perintah untuk membuat lurus, sedangkan bentuk jamak “jalan-jalan” mempertahankan τὰς τρίβους. “-Nya” mempertahankan rujukan pribadi αὐτοῦ dan mengikuti kaidah penulisan Indonesia untuk pronomina yang merujuk kepada Tuhan.
theological_decisions:
- issue: Penerjemahan κυρίου dalam kutipan Yesaya 40:3, yang teks Ibraninya memakai nama ilahi YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Matius memakai κυρίου, sehingga teks utama menerjemahkannya “Tuhan”. Catatan kaki menjelaskan bahwa kutipan ini menggemakan Yesaya 40:3, tempat teks Ibrani memakai nama ilahi YHWH, tanpa mengaburkan hubungan antarteks tersebut.
- issue: Keterkaitan frasa ἐν τῇ ἐρήμῳ dalam kutipan
  choice: di padang belantara menerangkan tempat orang itu berseru
  alternative: di padang belantara menerangkan tempat jalan Tuhan harus disiapkan
  rationale: Susunan dan tanda baca teks Yunani yang diberikan mendukung pembacaan utama “berseru di padang belantara”, tetapi tradisi teks Yesaya memungkinkan frasa itu dibaca bersama perintah berikutnya. Ambiguitas antarteks ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan bertingkat dipertahankan, tetapi rumusan dibuat cukup alami untuk dibaca nyaring. “Padang belantara” dipilih daripada “gurun” karena cakupan ἔρημος tidak selalu menunjuk gurun pasir.
