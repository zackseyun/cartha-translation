  text: dan berkata, “Bertobatlah[a], sebab Kerajaan Surga[b] sudah dekat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bertobatlah” menunjuk pada perubahan mendasar dalam pikiran, sikap, dan arah hidup, bukan sekadar merasa bersalah.
