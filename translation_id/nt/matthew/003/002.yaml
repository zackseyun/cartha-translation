lexical_decisions:
- source_word: καὶ λέγων
  choice: dan berkata
  rationale: Menerjemahkan penghubung καί dan partisip kini λέγων secara langsung serta mempertahankan kaitannya dengan subjek pada ayat sebelumnya.
- source_word: Μετανοεῖτε
  choice: Bertobatlah
  rationale: Imperatif jamak ini menyerukan perubahan mendasar dalam pikiran, sikap, dan arah hidup. Dalam bahasa Indonesia, “bertobatlah” merupakan ungkapan yang paling alami dan mapan serta tidak membatasi maknanya pada rasa bersalah saja.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai alasan bagi seruan sebelumnya dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfekt menyatakan bahwa kerajaan itu telah mendekat dan kini berada dekat. “Sudah dekat” menyampaikan keadaan hasil tersebut secara alami.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Mempertahankan ungkapan khas Matius dan cakupan βασιλεία sebagai pemerintahan maupun kerajaan, tanpa menggantinya secara interpretatif dengan “pemerintahan Allah”.
theological_decisions:
- issue: Makna seruan μετανοεῖτε
  choice: Bertobatlah
  alternative: Ubahlah pikiranmu; Berubahlah arah
  rationale: “Bertobatlah” secara wajar mencakup perubahan batin dan arah hidup. Catatan kaki menjaga nuansa perubahan pikiran agar seruan ini tidak dipersempit menjadi sekadar penyesalan emosional.
- issue: Makna “Kerajaan Surga”
  choice: Mempertahankan ungkapan khas Matius “Kerajaan Surga”
  alternative: Pemerintahan Surga; Kerajaan Allah
  rationale: 'Pilihan ini menjaga diksi dan ketegangan semantis teks Matius: βασιλεία dapat menunjuk pemerintahan maupun ranah kerajaan, sedangkan “surga” berfungsi sebagai ungkapan yang berkaitan dengan Allah tanpa menyebut-Nya secara langsung.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pewartaan. “Sebab” dipilih agar hubungan alasan jelas, sedangkan “sudah dekat” terdengar alami sekaligus mempertahankan dampak aspek perfekt Yunani.
