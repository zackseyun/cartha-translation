  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: id
  text: Kapak itu sudah terletak pada akar pohon-pohon.[a] Karena itu, setiap pohon yang tidak menghasilkan buah yang baik ditebang dan dilemparkan ke dalam api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kapak itu sudah ditempatkan pada akar pohon-pohon.”'
    reason: κείμαι dapat berarti “terletak” atau “ditempatkan”; alternatif ini mempertahankan gambaran kapak yang telah diposisikan pada akar.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: sudah
  rationale: ἤδη menyatakan bahwa penghakiman telah dekat dan siap berlangsung. δέ bersifat penghubung ringan; dalam bahasa Indonesia alurnya tetap alami tanpa harus diterjemahkan tersendiri.
- source_word: ἡ ἀξίνη
  choice: kapak
  rationale: Padanan umum dan konkret bagi alat penebang dalam gambaran penghakiman ini.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: terletak pada akar pohon-pohon itu
  rationale: Mempertahankan arti dasar κεῖται, yaitu 'terletak/berada', serta gambaran kapak yang sudah ditempatkan dekat akar dan siap digunakan.
- source_word: πᾶν οὖν δένδρον
  choice: Karena itu, setiap pohon
  rationale: οὖν menyatakan kesimpulan dari gambaran kapak yang telah siap; 'karena itu' mengungkapkan hubungan logis tersebut dengan jelas.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: yang tidak menghasilkan buah yang baik
  rationale: Menyampaikan tindakan khas atau berkelanjutan dari partisipel ποιοῦν dan mempertahankan metafora καρπὸν καλόν secara jelas.
- source_word: ἐκκόπτεται
  choice: akan ditebang
  rationale: Dalam konteks pohon, 'ditebang' merupakan padanan Indonesia yang paling alami. Bentuk kini Yunani menggambarkan kepastian tindakan; bentuk 'akan' sesuai dengan ancaman penghakiman yang segera terjadi dalam konteks.
- source_word: εἰς πῦρ βάλλεται
  choice: dilemparkan ke dalam api
  rationale: Padanan langsung dan alami yang mempertahankan daya gambaran penghakiman tanpa menjelaskan identitas api secara lebih sempit.
theological_decisions:
- issue: Hakikat gambaran api
  choice: Dipertahankan sebagai 'api' tanpa penjelasan tambahan.
  alternative: Menafsirkannya secara khusus sebagai penghakiman akhir, penghakiman temporal, atau neraka.
  rationale: Ayat ini jelas memakai gambaran penghakiman, tetapi tidak merinci hakikat api tersebut. Terjemahan mempertahankan ketegangan teologis teks.
- issue: Aspek waktu pada dua verba pasif
  choice: '''akan ditebang'' lalu ''dilemparkan'''
  alternative: 'Terjemahan kini secara harfiah: ''ditebang dan dilemparkan''.'
  rationale: Present tense Yunani memberi gambaran tindakan yang pasti dan berlaku sebagai pola penghakiman, sedangkan konteks kapak yang sudah siap juga mengarah pada tindakan yang segera menyusul. Bahasa Indonesia alami memakai 'akan' pada verba pertama dan membiarkannya menaungi verba kedua.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat menjaga metafora pohon, buah, kapak, dan api. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang diterangkannya.
