revisions:
- from: Kapak sudah terletak pada akar pohon-pohon itu.[a] Karena itu, setiap pohon yang tidak menghasilkan buah yang baik akan ditebang dan dilemparkan ke dalam api.
  to: Kapak itu sudah terletak pada akar pohon-pohon.[a] Karena itu, setiap pohon yang tidak menghasilkan buah yang baik ditebang dan dilemparkan ke dalam api.
  rationale: Revisi menghapus demonstratif yang tidak ada dalam sumber, mempertahankan aspek kini pada verba-verba pasif utama, dan mengganti alternatif catatan kaki dengan padanan yang lebih dekat pada arti κέῖται. Ambiguitas dan citra penghakiman dalam “api” tetap dipertahankan tanpa penafsiran doktrinal tambahan.
