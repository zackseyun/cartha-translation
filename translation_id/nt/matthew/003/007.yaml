source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: id
  text: Namun, ketika Yohanes melihat banyak orang dari kalangan Farisi dan Saduki datang ke baptisan yang dilakukannya, ia berkata kepada mereka, “Hai keturunan ular beludak! Siapa yang memperingatkan kalian supaya melarikan diri dari murka yang akan datang?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Namun, ketika Yohanes melihat
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat waktu agar alami dalam bahasa Indonesia. Nama Yohanes disebut untuk memperjelas subjek yang tersirat dari konteks, sedangkan δέ dipertahankan sebagai peralihan ringan dengan “Namun”.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: banyak orang dari kalangan Farisi dan Saduki
  rationale: Konstruksi partitif menunjukkan banyak anggota dari kedua kelompok itu, bukan seluruh orang Farisi dan Saduki tanpa kecuali.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: datang ke tempat pembaptisannya
  rationale: Ungkapan ini mempertahankan gerak menuju kegiatan baptisan Yohanes tanpa menyatakan secara pasti bahwa mereka semua menerima baptisan. “Tempat” ditambahkan secara idiomatis agar frasa tidak disalahpahami sebagai baptisan yang diterima Yohanes sendiri.
- source_word: Γεννήματα ἐχιδνῶν
  choice: keturunan ular beludak
  rationale: “Keturunan” mencerminkan γεννήματα, yaitu yang dihasilkan atau diperanakkan, sedangkan “ular beludak” menyampaikan gambaran ular berbisa dari ἐχιδνῶν.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Siapa yang memperingatkan kalian
  rationale: Dalam konteks ajakan melarikan diri dari murka, ὑποδείκνυμι paling tepat menyatakan tindakan memperingatkan, bukan sekadar menunjukkan atau memberi tahu.
- source_word: φυγεῖν ἀπὸ
  choice: supaya melarikan diri dari
  rationale: φυγεῖν menggambarkan tindakan lari untuk menjauh; “melarikan diri” mempertahankan desakan gambaran tersebut.
- source_word: τῆς μελλούσης ὀργῆς
  choice: murka yang akan datang
  rationale: “Murka” mempertahankan bobot ὀργή, dan “yang akan datang” menyampaikan orientasi mendatang atau eskatologis dari μελλούσης tanpa menentukan waktunya secara lebih sempit.
theological_decisions:
- issue: Cakupan kelompok yang ditegur
  choice: Yohanes menegur banyak orang dari kalangan Farisi dan Saduki yang hadir.
  alternative: Yohanes menggolongkan semua orang Farisi dan Saduki tanpa kecuali dalam teguran ini.
  rationale: Bentuk partitif Yunani menunjuk pada sejumlah besar anggota kedua kelompok, sehingga terjemahan tidak boleh memperluas teguran itu secara gramatikal kepada setiap anggotanya.
- issue: Apakah mereka datang untuk benar-benar dibaptis
  choice: Mereka datang menuju tempat atau kegiatan baptisan Yohanes; ayat ini sendiri tidak memastikan bahwa mereka menerima baptisan.
  alternative: Mereka datang dengan maksud pasti untuk dibaptis oleh Yohanes.
  rationale: ἐπὶ τὸ βάπτισμα αὐτοῦ menunjuk kepada baptisan Yohanes, tetapi tidak secara eksplisit mengatakan bahwa baptisan itu benar-benar mereka terima.
- issue: Makna eskatologis ὀργή
  choice: murka
  alternative: penghakiman atau hukuman
  rationale: “Murka” mempertahankan bahasa teologis dan daya profetis teks, sedangkan “penghakiman” atau “hukuman” akan menafsirkan akibat murka itu dan mempersempit istilah sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang tegas. “Kalian” dipakai karena sapaan Yunani berbentuk jamak dan ditujukan langsung kepada kelompok yang hadir. Seruan “Hai” menandai bentuk vokatif tanpa membuat bahasanya terlalu arkais.
