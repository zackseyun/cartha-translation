  to: Namun, ketika Yohanes melihat banyak orang dari kalangan Farisi dan Saduki datang ke baptisan yang dilakukannya, ia berkata kepada mereka, “Hai keturunan ular beludak! Siapa yang memperingatkan kalian supaya melarikan diri dari murka yang akan datang?”
