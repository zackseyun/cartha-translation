  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: id
  text: Pada waktu itu, Yohanes Pembaptis[a] datang[b] dan berkhotbah di padang belantara Yudea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yohanes yang membaptis.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tampil.” Kata Yunaninya memakai bentuk kini historis dalam penuturan kisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Pada waktu itu
  rationale: Frasa ini menandai peralihan waktu dalam kisah. “Pada waktu itu” lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “pada hari-hari itu,” sementara daya penghubung δέ tidak perlu dibuat sebagai pertentangan.
- source_word: παραγίνεται
  choice: datang
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami. “Datang” menggambarkan Yohanes memasuki panggung kisah tanpa menyiratkan kemunculan ajaib.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Yohanes Pembaptis
  rationale: Nama ditulis menurut bentuk Indonesia yang lazim, dan gelar βαπτιστής dipertahankan sebagai “Pembaptis,” sebutan yang alami serta dikenali luas.
- source_word: κηρύσσων
  choice: dan berkhotbah
  rationale: Partisipel ini menyatakan kegiatan yang menyertai kedatangan Yohanes. Koordinasi dengan “dan” alami dalam bahasa Indonesia, sedangkan “berkhotbah” dapat berdiri tanpa objek tambahan yang tidak disebutkan dalam ayat.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: di padang belantara Yudea
  rationale: ἔρημος menunjuk kawasan sepi atau tidak berpenghuni, bukan harus gurun pasir. “Padang belantara” menjaga nuansa geografis itu, dan Ἰουδαία adalah wilayah Yudea.
theological_decisions:
- issue: Gelar Yohanes, βαπτιστής
  choice: Pembaptis
  alternative: orang yang membaptis
  rationale: “Pembaptis” berfungsi sebagai gelar pengenal yang mapan dalam bahasa Indonesia. Alternatif menjelaskan fungsi verbal kata itu, tetapi kurang ringkas sebagai gelar; keputusan ini bersifat leksikal dan tidak menetapkan pandangan denominasi tentang baptisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; koma penutup dipertahankan karena kalimat dan pemberitaan Yohanes berlanjut pada ayat berikutnya.
