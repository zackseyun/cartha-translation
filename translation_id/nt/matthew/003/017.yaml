  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: id
  text: Dan lihatlah, ada suara dari langit[a] yang berkata, “Inilah Anak-Ku yang Kukasihi. Kepada-Nyalah Aku berkenan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai bentuk jamak untuk “langit”; dalam bahasa Indonesia ungkapan ini lazim diterjemahkan “dari langit.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “Di dalam Dia Aku berkenan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: ἰδού berfungsi sebagai penanda wacana yang mengarahkan perhatian kepada peristiwa penting. “Lihatlah” mempertahankan daya seru dan nuansa khidmatnya, tetapi tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: φωνὴ
  choice: ada suara
  rationale: φωνή di sini adalah suara yang dapat berkata-kata, bukan sekadar bunyi. Susunan “ada suara ... yang berkata” alami dalam bahasa Indonesia dan mempertahankan suara itu sebagai subjek.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dari langit
  rationale: Walaupun bentuk Yunaninya jamak, “langit” adalah ungkapan baku dan alami dalam bahasa Indonesia untuk asal surgawi ini. Bentuk jamak sumber dicatat dalam catatan kaki.
- source_word: λέγουσα
  choice: yang berkata
  rationale: Partisip ini menerangkan “suara” dan memperkenalkan perkataan langsung. Klausa relatif merupakan padanan Indonesia yang alami.
- source_word: Οὗτός ἐστιν
  choice: Inilah
  rationale: “Inilah” menyampaikan fungsi demonstratif dan identifikasional frasa Yunani secara langsung serta idiomatis.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Anak-Ku yang Kukasihi
  rationale: Terjemahan ini mempertahankan hubungan sebagai Anak dan arti ἀγαπητός sebagai yang dikasihi, tanpa menambahkan konsep yang tidak dinyatakan dalam teks.
- source_word: ἐν ᾧ
  choice: Kepada-Nyalah
  rationale: Secara harfiah preposisinya berarti “di dalam,” tetapi bersama εὐδοκέω ungkapan “kepada-Nyalah” menyampaikan sasaran perkenanan secara alami. Bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: εὐδόκησα
  choice: Aku berkenan
  rationale: Aoristus dalam pernyataan ilahi formulaik ini secara idiomatis menyatakan perkenanan Allah. “Aku berkenan” mempertahankan makna persetujuan dan kesenangan tanpa memaksakan aspek waktu yang lebih sempit.
theological_decisions:
- issue: Pernyataan ilahi tentang hubungan Yesus sebagai Anak
  choice: Anak-Ku yang Kukasihi
  alternative: Anak-Ku, Yang Terkasih
  rationale: Pilihan ini mempertahankan sebutan Anak dan kasih yang dinyatakan secara eksplisit dalam bahasa Yunani, tanpa menguraikannya ke dalam rumusan teologis tambahan.
- issue: Hubungan sintaksis ἐν ᾧ εὐδόκησα
  choice: Kepada-Nyalah Aku berkenan
  alternative: Di dalam Dia Aku berkenan
  rationale: Pilihan utama mengungkapkan perkenanan terhadap Sang Anak secara idiomatis dalam bahasa Indonesia, sedangkan kemungkinan bentuk yang lebih harfiah tetap disediakan agar ketegangan leksikal preposisi ἐν tidak hilang.
- issue: Bentuk jamak οὐρανῶν
  choice: dari langit
  alternative: dari langit-langit
  rationale: Bahasa Indonesia lazim memakai “langit” sebagai nomina yang tidak perlu dijamakkan dalam konteks ini. Catatan kaki tetap memberitahukan bahwa teks Yunani memakai bentuk jamak.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk “lihatlah” mempertahankan penekanan wacana sumber. Kapitalisasi “Anak-Ku,” “Kukasihi,” dan “-Nya” mengikuti konvensi penulisan rujukan ilahi dalam terjemahan Alkitab bahasa Indonesia tanpa menambahkan kata atau gelar baru.
