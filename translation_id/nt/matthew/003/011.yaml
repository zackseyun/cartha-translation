id: MAT.3.11
reference: Matthew 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: id
  text: “Aku membaptis kamu dalam air[a] untuk pertobatan[b]. Namun, Dia yang datang sesudah aku lebih berkuasa daripada aku. Aku tidak layak membawa sandal-Nya. Dialah yang akan membaptis kamu dalam Roh Kudus dan api[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan air”; preposisi Yunani ἐν dapat menyatakan tempat atau sarana, baik di sini maupun dalam frasa “dalam Roh Kudus dan api.”
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani dapat juga dipahami sebagai “menuju pertobatan”; frasa itu menyatakan arah atau tujuan tanpa menjelaskan secara pasti apakah pertobatan mendahului baptisan atau ditandai olehnya.
    reason: lexical_alternative
  - marker: c
    text: “Api” dapat menunjuk pada pemurnian atau penghakiman; ungkapan Yunani membiarkan citra itu tetap terbuka, dan konteks sekitarnya perlu dipertimbangkan.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: membaptis / akan membaptis
  rationale: Mempertahankan istilah baku untuk tindakan baptisan tanpa mempersempit maknanya menjadi suatu cara pelaksanaan tertentu.
- source_word: ἐν ὕδατι
  choice: dalam air
  rationale: Mencerminkan konstruksi Yunani secara dekat dan mempertahankan kesejajarannya dengan frasa ἐν πνεύματι ἁγίῳ; kemungkinan instrumental ‘dengan air’ dicatat dalam catatan kaki.
- source_word: εἰς μετάνοιαν
  choice: untuk pertobatan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan arah atau tujuan dari εἰς tanpa menetapkan secara khusus urutan antara pertobatan dan baptisan.
- source_word: ὁ ... ὀπίσω μου ἐρχόμενος
  choice: Dia yang datang sesudah aku
  rationale: Menyampaikan partisipel substantival dan makna urutan ὀπίσω μου secara alami.
- source_word: ἰσχυρότερός μού
  choice: lebih berkuasa daripada aku
  rationale: Dalam konteks perbandingan pribadi dan karya yang akan dilakukan, ‘lebih berkuasa’ menyampaikan kekuatan atau kemampuan yang lebih besar dengan bahasa Indonesia yang wajar.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Aku tidak layak
  rationale: Dalam ungkapan kerendahan hati ini, ‘tidak layak’ menyampaikan daya idiomatis ἱκανός lebih tepat daripada sekadar ‘tidak mampu’.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: membawa sandal-Nya
  rationale: βαστάσαι berarti membawa atau menanggung, bukan melepaskan; ‘sandal’ sesuai dengan benda yang dimaksud dalam konteks kuno.
- source_word: αὐτός
  choice: Dialah
  rationale: Bentuk ini mempertahankan penekanan pada pribadi yang akan datang dan kontras dengan baptisan yang dilakukan Yohanes.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Mempertahankan konstruksi berulang dengan ἐν dan memakai sebutan baku bagi Roh Kudus sebagai referen personal dalam konteks ini.
- source_word: καὶ πυρί
  choice: dan api
  rationale: Terjemahan langsung ini mempertahankan citra api tanpa menentukan apakah api menunjuk pada pemurnian, penghakiman, atau nuansa keduanya.
theological_decisions:
- issue: Makna ‘Roh Kudus dan api’
  choice: Mempertahankan frasa harfiah ‘dalam Roh Kudus dan api’.
  alternative: ‘dalam Roh Kudus dan api pemurnian’ atau ‘dalam Roh Kudus dan api penghakiman’
  rationale: Teks tidak menjelaskan citra api di dalam ayat ini. Konteks dapat mengarah pada pemurnian maupun penghakiman, sehingga terjemahan utama tidak menyelesaikan ketegangan tersebut.
- issue: Referen πνεύματι ἁγίῳ
  choice: Roh Kudus
  alternative: roh kudus atau kuasa roh yang kudus
  rationale: Dalam konteks Matius, frasa ini paling wajar merujuk kepada Roh Kudus; terjemahan tidak menambahkan uraian doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipecah secara wajar agar mudah dipahami, sementara penekanan αὐτός dipertahankan melalui ‘Dialah’. Kapitalisasi pronomina ‘Dia/-Nya’ mengikuti register Alkitab Indonesia yang lazim tanpa menambahkan gelar yang tidak terdapat dalam teks.
