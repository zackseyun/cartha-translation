revisions:
- from: 'Jangan mengira bahwa kalian dapat berkata di antara kalian sendiri[a], ‘Abraham adalah bapak kami.’ Sebab, aku berkata kepada kalian: Allah sanggup membangkitkan anak-anak bagi Abraham dari batu-batu ini.'
  to: 'Jangan mengira bahwa kalian dapat berkata di antara sesama kalian[a], ‘Abraham adalah bapak kami.’ Sebab, aku berkata kepada kalian: Allah sanggup menjadikan keturunan bagi Abraham dari batu-batu ini.'
  rationale: Revisi mengganti “membangkitkan” dengan “menjadikan” agar ἐγεῖραι dalam konteks penciptaan atau pengadaan keturunan tidak terdengar sebagai pernyataan tentang kebangkitan orang mati. Penyesuaian idiom pada frasa kelompok dan pada “keturunan bagi Abraham” meningkatkan kelancaran tanpa menghilangkan klaim tentang Abraham sebagai bapak atau daya retoris batu-batu ini. Catatan kaki tetap menjaga dua kemungkinan yang sah bagi ἐν ἑαυτοῖς.
