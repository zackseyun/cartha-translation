id: MAT.3.9
reference: Matthew 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: id
  text: 'Jangan mengira bahwa kalian dapat berkata di antara sesama kalian[a], ‘Abraham adalah bapak kami.’ Sebab, aku berkata kepada kalian: Allah sanggup menjadikan keturunan bagi Abraham dari batu-batu ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkata dalam hati masing-masing.” Frasa Yunani ini dapat merujuk pada perkataan batin ataupun pada apa yang mereka katakan di antara sesama mereka sebagai suatu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: Jangan mengira bahwa kalian dapat
  rationale: Larangan dengan μή dan subjungtif aoris memperingatkan mereka agar tidak merasa dapat bersandar pada anggapan yang keliru. Rumusan ini menyampaikan keyakinan lancang secara alami tanpa membuat makna mental δόξητε terlalu sempit.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: berkata di antara kalian sendiri
  rationale: Frasa Yunani ini dapat menunjuk pada perkataan batin ataupun perkataan dalam kelompok. Bentuk utama mempertahankan daya jamak refleksif; kemungkinan batin dicatat dalam catatan kaki.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Abraham adalah bapak kami
  rationale: Ungkapan idiomatis ini mempertahankan klaim keturunan dan hak istimewa leluhur, tanpa menyiratkan bahwa kebapaan historis Abraham disangkal.
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab, aku berkata kepada kalian
  rationale: Mempertahankan γάρ sebagai penjelas dan λέγω secara cukup formal, dengan pronomina jamak yang jelas.
- source_word: δύναται
  choice: sanggup
  rationale: ‘Sanggup’ secara ringkas dan wajar menyatakan kemampuan atau kuasa Allah dalam bahasa Indonesia modern.
- source_word: ἐκ τῶν λίθων τούτων
  choice: dari batu-batu ini
  rationale: Mempertahankan sumber yang dinyatakan oleh ἐκ dan penunjuk τούτων, serta menjadikan bentuk jamak λίθων eksplisit.
- source_word: ἐγεῖραι
  choice: membangkitkan
  rationale: Kata ini dapat berarti membuat muncul atau menghadirkan keturunan. ‘Membangkitkan’ mempertahankan metafora dan gema leksikalnya tanpa menyatakan bahwa konteks ini khusus berbicara tentang kebangkitan dari kematian.
- source_word: τέκνα
  choice: anak-anak
  rationale: τέκνα bersifat inklusif dan di sini menunjuk pada anak-anak atau keturunan, bukan hanya anak laki-laki.
- source_word: τῷ Ἀβραάμ
  choice: bagi Abraham
  rationale: 'Dativus menyatakan relasi atau kepentingan: anak-anak yang terhitung dalam hubungan dengan Abraham. ‘Bagi Abraham’ alami dan tidak mempersempitnya menjadi keturunan biologis semata.'
theological_decisions:
- issue: Makna keturunan Abraham dalam peringatan Yohanes
  choice: Ayat ini menolak keyakinan bahwa keturunan jasmani dari Abraham dengan sendirinya menjamin kedudukan yang benar di hadapan Allah.
  alternative: Ayat ini sekadar hiperbola tanpa kritik terhadap kebanggaan akan garis keturunan, atau menyatakan penggantian Israel etnis secara menyeluruh.
  rationale: Klaim ‘Abraham adalah bapak kami’ ditegur secara langsung, tetapi teks tidak menyangkal kebapaan historis Abraham dan tidak merumuskan suatu sistem teologi penggantian. Terjemahan membiarkan ketegangan itu tetap ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. ‘Kalian’ dipakai untuk menandai bentuk jamak ὑμῖν dan ἑαυτοῖς secara jelas. Kapitalisasi ‘Allah’ mengikuti kelaziman bahasa Indonesia; ‘aku’ mempertahankan tuturan langsung tanpa menambahkan gelar.
