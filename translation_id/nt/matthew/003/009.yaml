review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk ἐγεῖραι. Dalam konteks ini verba tersebut berarti menghadirkan atau menjadikan keturunan, bukan secara khusus membangkitkan dari kematian. Terjemahan utama juga mempertahankan larangan terhadap anggapan percaya diri yang keliru serta ambiguitas ἐν ἑαυτοῖς melalui catatan kaki.
  naturalness: “Di antara kalian sendiri” dapat dipahami, tetapi “di antara sesama kalian” lebih alami dalam bahasa Indonesia baku. “Anak-anak bagi Abraham” juga kurang lazim dan dapat terdengar seperti pemberian anak kepada Abraham; “keturunan bagi Abraham” menyampaikan relasi keturunan yang dimaksud secara alami.
  terminology: “Bapak kami,” “Allah,” dan “keturunan” sesuai dengan register modern baku dan makna ayat. “Menjadikan” menghindari konotasi kebangkitan jasmani yang terlalu kuat dari “membangkitkan,” sambil mempertahankan gambaran bahwa Allah dapat menghasilkan keturunan dari batu-batu tersebut.
  issues:
  - severity: medium
    issue: “membangkitkan anak-anak” untuk ἐγεῖραι
    rationale: Walaupun ἐγείρω secara harfiah dapat diterjemahkan “membangkitkan,” dalam ayat ini maksudnya ialah Allah mampu menghadirkan/menjadikan keturunan bagi Abraham dari batu-batu. Dalam bahasa Indonesia modern, “membangkitkan anak-anak” terutama mengisyaratkan kebangkitan dari kematian dan berisiko mengubah pemahaman konteks.
  - severity: low
    issue: “di antara kalian sendiri” dan “anak-anak bagi Abraham” kurang idiomatis
    rationale: “Di antara sesama kalian” lebih lancar untuk ujaran dalam kelompok. “Keturunan bagi Abraham” lebih wajar daripada “anak-anak bagi Abraham” serta tetap mencakup τέκνα sebagai keturunan, bukan hanya anak laki-laki.
  revised_text: 'Jangan mengira bahwa kalian dapat berkata di antara sesama kalian[a], ‘Abraham adalah bapak kami.’ Sebab, aku berkata kepada kalian: Allah sanggup menjadikan keturunan bagi Abraham dari batu-batu ini.'
  revised_footnotes:
