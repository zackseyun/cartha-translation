    reason: lexical_alternative
  revision_rationale: Revisi mengganti “membangkitkan” dengan “menjadikan” agar ἐγεῖραι dalam konteks penciptaan atau pengadaan keturunan tidak terdengar sebagai pernyataan tentang kebangkitan orang mati. Penyesuaian idiom pada frasa kelompok dan pada “keturunan bagi Abraham” meningkatkan kelancaran tanpa menghilangkan klaim tentang Abraham sebagai bapak atau daya retoris batu-batu ini. Catatan kaki tetap menjaga dua kemungkinan yang sah bagi ἐν ἑαυτοῖς.
