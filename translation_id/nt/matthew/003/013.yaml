  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: id
  text: Kemudian Yesus datang dari Galilea ke Sungai Yordan kepada Yohanes untuk dibaptis olehnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan peristiwa; 'Kemudian' alami dan ringkas dalam narasi Indonesia.
- source_word: παραγίνεται
  choice: datang
  rationale: Verba ini berbentuk present historis yang menghidupkan narasi. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga 'datang' mempertahankan kelangsungan naratif tanpa memaksakan bentuk lampau.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: ἀπό menyatakan asal atau titik keberangkatan.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: ke Sungai Yordan
  rationale: ἐπί dengan akusatif dalam konteks gerak menyatakan arah tujuan. Penambahan 'Sungai' memperjelas nama geografis secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: πρὸς τὸν Ἰωάννην
  choice: kepada Yohanes
  rationale: πρός dengan akusatif menyatakan gerak menuju seseorang. 'Kepada Yohanes' membedakan tujuan personal dari tujuan tempat sebelumnya dan tidak menambahkan gelar yang tidak terdapat dalam ayat.
- source_word: τοῦ βαπτισθῆναι
  choice: untuk dibaptis
  rationale: Infinitif berartikel ini menyatakan tujuan; 'untuk dibaptis' menyampaikan tujuan dengan jelas dan wajar.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: ὑπό dengan genitif menandai pelaku; pronomina dipertahankan sebagaimana teks Yunani, dengan Yohanes sebagai anteseden terdekat.
theological_decisions:
- issue: Bentuk present historis παραγίνεται
  choice: Diterjemahkan dengan verba netral kala 'datang'
  alternative: '''datanglah'' atau bentuk lampau eksplisit'
  rationale: Bahasa Indonesia tidak mewajibkan penandaan kala. Pilihan ini mempertahankan daya naratif tanpa menambahkan nuansa imperatif atau penekanan yang tidak ada.
- issue: Gelar Yohanes
  choice: Hanya 'Yohanes'
  alternative: '''Yohanes Pembaptis'''
  rationale: Teks ayat ini hanya menyebut nama Yohanes; gelar tidak ditambahkan dari konteks.
- issue: Tujuan kedatangan Yesus
  choice: '''untuk dibaptis olehnya'''
  alternative: '''supaya ia membaptis-Nya'''
  rationale: Bentuk pasif Yunani dipertahankan dan tujuan dinyatakan secara langsung, tanpa memperluas struktur atau menafsirkan makna baptisan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'ke Sungai Yordan, kepada Yohanes' mempertahankan dua frasa arah dalam bahasa Yunani sambil membedakan tujuan tempat dan tujuan personal. Kapitalisasi pronomina ilahi tidak dipakai karena teks Yunani tidak menandainya dan acuan 'olehnya' adalah Yohanes.
