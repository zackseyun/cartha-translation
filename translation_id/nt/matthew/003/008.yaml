review_pass:
  verdict: revise
  source_fidelity: Teks Yunani memerintahkan tindakan tegas (ποιήσατε) yang menghasilkan ‘buah’ sebagai hasil atau bukti nyata. Frasa ἄξιον τῆς μετανοίας menyatakan kesesuaian buah dengan pertobatan, bukan buah yang ditujukan untuk memperoleh pertobatan. ‘Layak bagi pertobatan’ dapat dibaca dalam bahasa Indonesia sebagai buah yang cocok untuk atau demi pertobatan, sehingga hubungan yang dimaksud kurang jelas.
  naturalness: ‘Karena itu, hasilkanlah buah’ dapat dipahami dan register-nya baik. Namun, ‘buah yang sesuai dengan pertobatan’ lebih alami dan lebih tepat menyampaikan relasi semantis frasa Yunani daripada ‘buah yang layak bagi pertobatan’.
  terminology: ‘Pertobatan’ adalah padanan baku dan tepat bagi μετανοίας dalam konteks ini. Metafora ‘buah’ serta bentuk tunggal kolektif dipertahankan. ‘Hasilkanlah’ mempertahankan kekuatan imperatif tanpa menambahkan tafsiran.
