  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: id
  text: Karena itu, hasilkanlah buah yang sesuai dengan pertobatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasilkanlah buah yang sepadan dengan pertobatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: hasilkanlah
  rationale: Bentuk imperatif aoris aktif orang kedua jamak menyampaikan perintah tegas kepada para pendengar. Dalam metafora buah, “hasilkanlah” mempertahankan arti dasar ποιέω sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari seruan dan peringatan sebelumnya; “karena itu” menyatakan hubungan logis tersebut dengan jelas.
- source_word: καρπὸν
  choice: buah
  rationale: Padanan baku bagi καρπός. Bentuk tunggal dipertahankan sebagai nomina kolektif dan secara metaforis menunjuk pada hasil nyata dalam kehidupan.
- source_word: ἄξιον
  choice: yang layak bagi
  rationale: Dengan bentuk genitif, ἄξιος menyatakan kelayakan atau kesesuaian. Padanan ini mempertahankan ungkapan sumber tanpa mengubahnya menjadi penjelasan tafsiran.
- source_word: μετανοίας
  choice: pertobatan
  rationale: “Pertobatan” adalah padanan Indonesia yang mapan dan mencakup perubahan batin serta berbaliknya arah hidup, bukan sekadar perubahan pikiran.
theological_decisions:
- issue: Makna frasa καρπὸν ἄξιον τῆς μετανοίας
  choice: Perintah untuk menghasilkan buah yang layak bagi pertobatan
  alternative: Perintah untuk menghasilkan buah yang sesuai dengan pertobatan
  rationale: Konstruksi ini menyatakan kelayakan atau kesesuaian buah dengan pertobatan, bukan bahwa perbuatan menghasilkan, membeli, atau memperoleh pertobatan. Teks utama mempertahankan ketegangan ungkapan sumber, sedangkan catatan kaki menjelaskan kemungkinan ungkapan yang lebih idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk “-lah” mempertahankan daya perintah, sementara metafora buah dan bentuk tunggal kolektif tetap dipertahankan.
