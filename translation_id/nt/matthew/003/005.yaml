  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: id
  text: Pada waktu itu, orang-orang dari Yerusalem, dari seluruh Yudea, dan dari seluruh daerah di sekitar Sungai Yordan[a] terus berdatangan kepada Yohanes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “seluruh Yudea” dan “seluruh daerah di sekitar Sungai Yordan” menggambarkan tanggapan yang sangat luas, bukan berarti setiap orang tanpa kecuali datang.
    reason: cultural_note
  - marker: b
    text: 'Bentuk kata kerja Yunani menunjukkan tindakan yang berlangsung atau berulang: orang-orang terus berdatangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Penanda waktu ini menghubungkan tanggapan masyarakat dengan pelayanan Yohanes yang baru saja digambarkan; frasa ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐξεπορεύετο
  choice: terus berdatangan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang pada masa lampau. “Berdatangan” juga secara alami menyatakan datangnya banyak orang dari berbagai tempat.
- source_word: πρὸς αὐτόν
  choice: kepada Yohanes
  rationale: Kata ganti Yunani merujuk kepada Yohanes dalam konteks sebelumnya. Menyebut namanya membuat rujukan jelas dan alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: Ἱεροσόλυμα
  choice: orang-orang dari Yerusalem
  rationale: Nama kota dipakai secara metonimis bagi penduduknya. Ungkapan eksplisit ini menghindari kesan janggal bahwa kota itu sendiri bergerak.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: dari seluruh Yudea
  rationale: Mempertahankan cakupan geografis yang luas sambil mengikuti susunan alami bahasa Indonesia setelah “orang-orang dari”.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: dari seluruh daerah di sekitar Sungai Yordan
  rationale: περίχωρος menunjuk daerah sekitar; penyebutan “Sungai Yordan” memperjelas bahwa Yordan adalah nama sungai bagi pembaca modern.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: Pengulangan kata penghubung menggabungkan ketiga wilayah secara kumulatif dan dipertahankan secara wajar.
theological_decisions:
- issue: Cakupan ungkapan geografis yang menyeluruh
  choice: Mempertahankan “seluruh” sebagai gambaran tanggapan luas dari ketiga kawasan
  alternative: Menafsirkan ungkapan itu secara mutlak sebagai setiap penduduk tanpa pengecualian
  rationale: Dalam konteks ini, ungkapan geografis tersebut menggambarkan luasnya sambutan terhadap pelayanan Yohanes, tetapi tidak harus berarti bahwa setiap orang secara individual datang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Metonimia geografis Yunani dijelaskan secara alami melalui “orang-orang dari”, sedangkan aspek imperfek dipertahankan dengan “terus berdatangan”.
