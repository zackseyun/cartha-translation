id: MAT.3.12
reference: Matthew 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: id
  text: Alat penampi-Nya ada di tangan-Nya[a]. Ia akan membersihkan tempat pengirikan-Nya sampai tuntas dan mengumpulkan gandum-Nya ke dalam lumbung[b], tetapi sekam akan dibakar-Nya habis dengan api yang tidak dapat dipadamkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “garpu penampi” atau “sekop penampi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “gudang penyimpanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: alat penampi
  rationale: Menunjuk pada alat pertanian untuk melontarkan hasil irikan agar gandum terpisah dari sekam. Istilah umum ini alami dalam bahasa Indonesia dan tidak memastikan secara berlebihan apakah bentuk alat itu garpu atau sekop.
- source_word: διακαθαριεῖ
  choice: akan membersihkan ... sampai tuntas
  rationale: Mengungkapkan daya intensif verba majemuk, yaitu membersihkan atau mengosongkan sepenuhnya.
- source_word: ἅλωνα
  choice: tempat pengirikan
  rationale: Padanan pertanian yang tepat bagi area tempat hasil panen diirik dan ditampi.
- source_word: σῖτον
  choice: gandum
  rationale: Walaupun dapat berarti biji-bijian secara lebih umum, dalam pertentangan dengan sekam pada gambaran penampian, 'gandum' merupakan padanan yang alami dan tepat.
- source_word: ἀποθήκην
  choice: lumbung
  rationale: Dalam konteks hasil panen, 'lumbung' secara alami menyatakan tempat penyimpanan biji-bijian tanpa menambahkan rincian yang tidak ada dalam bahasa Yunani.
- source_word: ἄχυρον
  choice: sekam
  rationale: Dalam gambaran penampian, istilah ini menunjuk pada bagian tanaman yang tidak berguna dan dipisahkan dari gandum; 'sekam' mempertahankan kontras tersebut dengan jelas.
- source_word: κατακαύσει
  choice: akan dibakar-Nya habis
  rationale: Kata 'habis' mempertahankan nuansa pembakaran menyeluruh yang terkandung dalam verba majemuk Yunani.
- source_word: πυρὶ ἀσβέστῳ
  choice: dengan api yang tidak dapat dipadamkan
  rationale: Mempertahankan fungsi instrumental bentuk datif dan arti ἄσβεστος sebagai api yang tidak bisa dipadamkan.
- source_word: οὗ
  choice: -Nya
  rationale: Pronomina relatif genitif merujuk kepada Dia yang akan datang dalam ayat sebelumnya; bentuk posesif Indonesia menghubungkan kalimat secara alami dengan rujukan tersebut.
theological_decisions:
- issue: Gambaran penghakiman yang memisahkan gandum dan sekam
  choice: Metafora pertanian dan bahasa penghakiman pada masa mendatang dipertahankan secara konkret.
  alternative: Menjelaskan langsung dalam teks bahwa gandum dan sekam melambangkan kelompok manusia tertentu.
  rationale: Ayat ini sendiri menyampaikan penghakiman melalui metafora. Terjemahan tidak boleh menggantinya dengan tafsiran eksplisit atau melunakkan akibat yang digambarkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Bentuk '-Nya' dipakai secara konsisten untuk mempertahankan rangkaian posesif Yunani. Struktur kalimat dibuat alami tanpa mengurangi intensitas tindakan membersihkan dan membakar.
