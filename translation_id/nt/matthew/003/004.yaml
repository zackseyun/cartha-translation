id: MAT.3.4
reference: Matthew 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: id
  text: Yohanes sendiri mengenakan pakaian yang terbuat dari bulu unta[b][c] dan ikat pinggang kulit di pinggangnya.[a] Makanannya adalah belalang dan madu hutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pakaian Yohanes mengingatkan pada penampilan Nabi Elia dalam 2 Raja-raja 1:8, suatu latar penting bagi cara Matius menggambarkan Yohanes.
    reason: cross_reference
  - marker: b
    text: Atau, “pakaiannya terbuat dari bulu unta.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “mempunyai pakaian yang terbuat dari bulu unta.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Yohanes sendiri
  rationale: αὐτός memberi penekanan pada Yohanes. δέ merupakan penghubung ringan yang tidak perlu selalu dinyatakan dengan kata tersendiri dalam bahasa Indonesia.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: mengenakan pakaian
  rationale: Secara harfiah berarti ‘mempunyai pakaiannya’, tetapi dalam konteks ini menggambarkan apa yang dikenakan Yohanes. ‘Mengenakan pakaian’ alami dan menghindari kesan bahwa ia menyuruh orang membuatkannya.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: yang terbuat dari bulu unta
  rationale: ἀπό menyatakan bahan pembuat pakaian; terjemahan ini menyampaikan komposisinya dengan jelas.
- source_word: ζώνην δερματίνην
  choice: ikat pinggang kulit
  rationale: ζώνη menunjuk pada ikat pinggang atau sabuk, sedangkan δερματίνην menyatakan bahwa bahannya kulit.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: di pinggangnya
  rationale: ὀσφύς berarti pinggang atau bagian tubuh sekitar pinggang. Ungkapan ini alami dalam bahasa Indonesia dan menghindari istilah arkais.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: Makanannya adalah
  rationale: τροφή berarti makanan atau santapan. Pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang lancar tanpa mengubah hubungan deskriptif antarklausa.
- source_word: ἀκρίδες
  choice: belalang
  rationale: Makna leksikal bakunya adalah serangga belalang; konteks tidak mendukung pengertian nonharfiah.
- source_word: μέλι ἄγριον
  choice: madu hutan
  rationale: ἄγριον menunjukkan madu yang ditemukan di alam liar. ‘Madu hutan’ merupakan padanan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Gambaran asketis dan kemiripan Yohanes dengan Elia
  choice: Menerjemahkan pakaian dan makanan Yohanes secara langsung, serta menaruh kaitan dengan Elia dalam catatan kaki.
  alternative: Memakai ungkapan dalam teks utama yang secara lebih eksplisit menyamakan Yohanes dengan Elia.
  rationale: Ayat ini sendiri hanya menggambarkan pakaian dan makanan Yohanes. Gema 2 Raja-raja 1:8 penting, tetapi sebaiknya tidak diubah menjadi penafsiran eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mengenakan’ dipilih sebagai ungkapan naratif yang alami; ‘madu hutan’ lebih lazim daripada terjemahan kaku ‘madu liar’. Semua hubungan teologis implisit dipertahankan tanpa dimasukkan sebagai tafsiran ke dalam teks utama.
