source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: id
  text: Sesudah dibaptis, Yesus segera keluar dari air.[a] Lihatlah, langit terbuka,[b] dan Ia melihat Roh Allah turun seperti burung merpati dan datang kepada-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: naik dari air.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani memakai bentuk jamak untuk "langit"; dalam bahasa Indonesia, bentuk tunggal lebih lazim.
    reason: source_form
  - marker: c
    text: 'Atau: datang ke atas-Nya. Kata Yunaninya berarti “datang”, bukan secara khusus “hinggap”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Sesudah dibaptis, Yesus
  rationale: Partisip aoris pasif menunjukkan bahwa baptisan mendahului tindakan utama. Susunan ini alami dalam bahasa Indonesia dan mempertahankan bentuk pasif tanpa menyebut pelaku baptisan.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: segera keluar dari air
  rationale: εὐθύς menyatakan urutan yang langsung. Dalam konteks orang yang berada di air, ἀναβαίνω ἀπό secara alami diterjemahkan 'keluar dari air'; catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian yang hidup, dengan bentuk baku dan tetap mudah dipahami.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: langit terbuka
  rationale: Bahasa Indonesia lazim memakai 'langit' sebagai nomina kolektif tanpa perlu meniru bentuk jamak Yunani. Bentuk 'terbuka' mempertahankan keadaan yang dihasilkan oleh verba pasif tanpa terasa kaku.
- source_word: εἶδεν
  choice: Ia melihat
  rationale: Menerjemahkan verba persepsi secara langsung. Huruf kapital pada pronomina mengikuti register Alkitab Indonesia yang bermartabat ketika merujuk kepada Yesus.
- source_word: πνεῦμα θεοῦ
  choice: Roh Allah
  rationale: Mempertahankan konstruksi genitif dan ungkapan teks, tanpa menggantinya dengan gelar yang lebih interpretatif, 'Roh Kudus'.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: turun seperti burung merpati
  rationale: ὡσεὶ menandai perbandingan. 'Seperti burung merpati' tidak menyatakan bahwa Roh secara harfiah adalah seekor merpati.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: datang ke atas-Nya
  rationale: Mempertahankan verba umum ἔρχομαι dan arah ἐπί tanpa mempersempitnya menjadi tindakan khusus seperti 'hinggap'.
theological_decisions:
- issue: Apakah πνεῦμα θεοῦ diterjemahkan sebagai sebutan khusus atau secara generik
  choice: Roh Allah
  alternative: suatu roh dari Allah; Roh Kudus
  rationale: Konteks mendukung rujukan kepada Roh Kudus, tetapi terjemahan mengikuti ungkapan Yunani secara langsung dan tidak mengganti sebutannya.
- issue: Apakah ὡσεὶ περιστερὰν menyatakan identitas atau perbandingan
  choice: turun seperti burung merpati
  alternative: turun sebagai burung merpati
  rationale: Partikel ὡσεὶ menyatakan kemiripan; terjemahan tidak mengidentifikasi Roh secara harfiah sebagai burung merpati.
- issue: Rujukan subjek εἶδεν tidak dinyatakan ulang dalam bahasa Yunani
  choice: Ia, yaitu Yesus, melihat
  alternative: Yohanes melihat
  rationale: Subjek gramatikal yang berlanjut dari klausa utama paling alami adalah Yesus. Terjemahan mempertahankan pembacaan ini tanpa menambahkan nama dalam klausa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lihatlah' mempertahankan daya naratif ἰδού. Ungkapan 'burung merpati' dipilih karena lebih alami dan jelas daripada hanya 'merpati'. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
