  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: id
  text: Namun kemudian ia mengutus putranya kepada mereka[a], sambil berkata, “Mereka akan menghormati putraku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka akan menaruh hormat kepada putraku.” Kata kerja Yunani ini dapat berarti menunjukkan hormat atau segan; dalam konteks lain, kata ini juga dapat berarti “merasa malu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: kemudian
  rationale: Menandai urutan waktu, yaitu ‘kemudian’ atau ‘sesudah itu’, tanpa menambahkan kesan mutlak ‘akhirnya’.
- source_word: δὲ
  choice: Namun
  rationale: 'Menandai perkembangan yang agak kontras: sesudah para hamba diutus dan diperlakukan buruk, pemilik itu beralih mengutus anaknya.'
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Secara langsung menyatakan tindakan mengirim seseorang sebagai utusan; ‘mengutus’ wajar dalam konteks ini dan tidak perlu diberi makna teknis kerasulan.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: Dengan verba pengutusan, πρός dan akusatif menunjukkan arah kepada orang-orang yang dituju.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: anaknya
  rationale: Padanan Indonesia yang alami bagi ‘anak laki-lakinya’; konteks sudah menunjukkan kedudukan khusus anak itu tanpa perlu menambahkan ‘sendiri’ atau ‘terkasih’.
- source_word: λέγων
  choice: dengan berkata
  rationale: Memperkenalkan isi perkataan atau pertimbangan si pengutus secara alami dalam bahasa Indonesia.
- source_word: Ἐντραπήσονται
  choice: Mereka akan menghormati
  rationale: Dengan objek langsung ‘anakku’, verba ini bermakna menunjukkan rasa hormat atau segan. ‘Menghormati’ jelas dan alami, sedangkan ‘memuliakan’ akan terlalu kuat dan ‘merasa malu’ kurang sesuai dengan konstruksi ini.
- source_word: τὸν υἱόν μου
  choice: anakku
  rationale: Mempertahankan bentuk orang pertama dan daya relasional dari ucapan pemilik itu.
theological_decisions:
- issue: Penyebutan anak dalam perumpamaan tanpa menafsirkan rujukan kristologis secara berlebihan
  choice: anaknya / anakku
  alternative: Anaknya yang terkasih / Sang Anak
  rationale: Teks memakai υἱός biasa tanpa ἀγαπητός dan tanpa penanda gramatikal yang menuntut gelar khusus. Bentuk biasa mempertahankan alur perumpamaan sambil membiarkan konteks menyampaikan rujukannya kepada Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum; ‘Namun, kemudian’ mempertahankan baik nuansa perkembangan kontras δέ maupun urutan waktu ὕστερον. Tidak ada catatan kaki karena alternatif leksikal ἐντρέπω tidak perlu ditampilkan untuk memahami ayat ini dan terjemahan utama cukup mewakili makna kontekstualnya.
