  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: id
  text: Karena itu, ketika pemilik[a] kebun anggur itu datang, apa yang akan dilakukannya terhadap para penggarap[b] itu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tuan.” Kata Yunani kyrios sering diterjemahkan “Tuhan,” tetapi di sini menunjuk kepada pemilik atau tuan kebun anggur dalam perumpamaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “para petani penyewa.” Konteks perumpamaan menunjukkan bahwa mereka menggarap kebun milik orang lain, meskipun kata Yunaninya sendiri secara lebih umum berarti petani atau penggarap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Bersama bentuk subjungtif ἔλθῃ, kata ini memperkenalkan saat yang akan terjadi dan dinantikan dalam alur perumpamaan; “ketika” lebih tepat daripada ungkapan berulang seperti “setiap kali”.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan atau peralihan logis dari jalan cerita sebelumnya menuju pertanyaan Yesus.
- source_word: ἔλθῃ
  choice: datang
  rationale: Bentuk aoris subjungtif setelah ὅταν secara wajar diterjemahkan sebagai peristiwa yang akan datang dalam klausa waktu.
- source_word: κύριος
  choice: pemilik
  rationale: Dalam konstruksi “κύριος τοῦ ἀμπελῶνος” dan dunia cerita perumpamaan ini, kata tersebut menunjuk kepada orang yang memiliki atau menguasai kebun anggur, bukan berfungsi langsung sebagai gelar ilahi.
- source_word: ἀμπελῶνος
  choice: kebun anggur
  rationale: Padanan baku dan alami bagi ἀμπελών dalam konteks pertanian dan perumpamaan.
- source_word: τί ποιήσει
  choice: apa yang akan dilakukannya
  rationale: Mempertahankan pertanyaan mengenai tindakan yang kelak diambil oleh pemilik; pronomina terikat “-nya” merujuk dengan wajar kepada pemilik.
- source_word: γεωργοῖς
  choice: para penggarap
  rationale: γεωργός berarti orang yang mengolah tanah. “Penggarap” alami dalam konteks kebun dan tidak memasukkan gagasan penyewaan secara mutlak ke dalam kata itu sendiri.
- source_word: ἐκείνοις
  choice: itu
  rationale: Demonstrativa ini memberi kekhususan dan sedikit jarak; dalam bahasa Indonesia hal tersebut alami dinyatakan melalui frasa “para penggarap itu”.
theological_decisions:
- issue: Pemaknaan κύριος dalam konteks perumpamaan
  choice: pemilik
  alternative: tuan
  rationale: Konteks langsung menunjuk kepada pemilik atau penguasa kebun dalam dunia cerita. “Pemilik” menghindari kesan bahwa κύριος di sini harus dibaca langsung sebagai gelar kristologis, tanpa meniadakan makna simbolis perumpamaan.
- issue: Status para γεωργοί
  choice: para penggarap
  alternative: para petani penyewa
  rationale: Konteks perumpamaan menunjukkan bahwa mereka mengelola kebun milik orang lain, tetapi kata γεωργός sendiri lebih umum dan tidak secara eksplisit berarti penyewa. Teks utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan kemungkinan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
