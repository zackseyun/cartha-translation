  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: id
  text: Sekali lagi ia mengutus hamba-hamba lain[a], lebih banyak daripada kelompok pertama, dan para penggarap itu memperlakukan mereka dengan cara yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "budak-budak lain." Kata Yunani doulous dapat berarti "hamba-hamba" atau "budak-budak," bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan tindakan dan terdengar alami dalam urutan narasi Indonesia.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Mengungkapkan tindakan mengirim dengan suatu tugas; 'mengutus' tepat bagi hamba-hamba yang menjadi utusan dalam perumpamaan.
- source_word: ἄλλους δούλους
  choice: hamba-hamba lain
  rationale: δοῦλος dapat berarti hamba atau budak. Dalam konteks ini peran mereka sebagai bawahan yang diutus lebih ditonjolkan daripada status hukum mereka, sehingga 'hamba-hamba' dip natural dan tetap akurat.
- source_word: πλείονας τῶν πρώτων
  choice: lebih banyak daripada yang pertama
  rationale: Bentuk komparatif ini menyatakan bahwa kelompok berikutnya lebih besar jumlahnya daripada kelompok pertama.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: para penggarap itu memperlakukan mereka dengan cara yang sama
  rationale: Ungkapan Yunani merujuk kembali pada perlakuan terhadap para hamba sebelumnya. Subjek eksplisit 'para penggarap itu' dan verba 'memperlakukan' membuat rujukannya jelas dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perumpamaan
  choice: hamba
  alternative: budak
  rationale: Fokus narasi ialah fungsi mereka sebagai orang-orang yang diutus dan dianiaya, bukan status hukum perbudakan mereka. Alternatif leksikal tetap dicatat karena δοῦλος memang dapat berarti 'budak'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kemudian ... lagi' menjaga kelancaran narasi; 'para penggarap itu' memperjelas subjek tersirat berdasarkan konteks ayat sebelumnya.
