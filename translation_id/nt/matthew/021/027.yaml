id: MAT.21.27
reference: Matthew 21:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: id
  text: Mereka menjawab Yesus, “Kami tidak tahu.” Lalu Ia berkata kepada mereka, “Aku pun tidak akan mengatakan kepadamu dengan wewenang apa Aku melakukan hal-hal ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: menjawab
  rationale: Partisipel ini memperkenalkan tanggapan mereka. Bentuk verbal sederhana alami dalam bahasa Indonesia dan tetap mempertahankan fungsi responsifnya.
- source_word: Οὐκ οἴδαμεν
  choice: Kami tidak tahu
  rationale: Penyangkalan langsung atas pengetahuan mereka. 'Kami' sesuai karena para pemimpin berbicara sebagai kelompok kepada Yesus.
- source_word: ἔφη
  choice: berkata
  rationale: Padanan netral dan alami bagi verba ujaran ini tanpa menambahkan tekanan yang tidak ada dalam teks.
- source_word: καὶ αὐτός
  choice: Lalu Ia ... pun
  rationale: Partikel καί bersama αὐτός menandai tanggapan timbal balik Yesus. 'Pun' menyampaikan bahwa Yesus pada gilirannya menanggapi mereka, sedangkan 'lalu' menjaga alur narasi yang alami.
- source_word: Οὐδὲ ἐγὼ
  choice: Aku pun tidak akan
  rationale: 'Menyampaikan penolakan timbal balik: karena mereka tidak menjawab, Yesus juga tidak akan memberi tahu mereka. ''Tidak akan'' merupakan ungkapan penolakan yang alami dalam konteks Indonesia.'
- source_word: λέγω ὑμῖν
  choice: mengatakan kepadamu
  rationale: Menyatakan bahwa Yesus tidak akan menyampaikan informasi yang diminta. 'Kepadamu' mempertahankan objek tak langsung jamak tanpa membebani kalimat.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: dengan wewenang apa
  rationale: Mengungkapkan dasar atau kapasitas resmi yang memungkinkan tindakan Yesus. Susunan ini alami dan mempertahankan pertanyaan tentang legitimasi tindakan-Nya.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mempertahankan bentuk jamak demonstratif yang menunjuk kepada berbagai tindakan Yesus yang sedang dipersoalkan.
- source_word: ποιῶ
  choice: Aku melakukan
  rationale: Bentuk kini Yunani merujuk pada tindakan-tindakan Yesus dalam konteks langsung dan secara umum; bentuk Indonesia ini cukup alami tanpa harus menambahkan aspek progresif.
theological_decisions:
- issue: Makna ἐξουσία dalam jawaban Yesus
  choice: wewenang
  alternative: kuasa; hak
  rationale: '''Wewenang'' menonjolkan legitimasi atau dasar resmi untuk bertindak, yang menjadi pokok sengketa dalam konteks ini. Pilihan ini tidak mempersempit maknanya menjadi kemampuan atau kekuatan semata.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'Ia' dan 'Aku' mengikuti dialog langsung serta menjaga kejelasan rujukan. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan kepada pembaca.
