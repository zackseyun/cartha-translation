    issue: “pergi ke tempat yang jauh” untuk ἀπεδήμησεν
    rationale: Ungkapan Indonesia ini menyatakan tujuan yang jauh, sedangkan teks Yunani hanya mengatakan bahwa ia pergi meninggalkan tempatnya. Terjemahan “lalu pergi” mempertahankan keterbukaan sumber.
  - severity: low
    issue: “menanami kebun anggur”
    rationale: Bentuk ini dapat dipahami, tetapi “menanam sebuah kebun anggur” lebih idiomatis untuk tindakan mendirikan/menanami suatu kebun anggur dan tetap mempertahankan citra konkret φυτεύω.
