  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: id
  text: Dengarkanlah perumpamaan yang lain. Ada seorang pemilik tanah yang menanam sebuah kebun anggur. Ia memasang pagar di sekelilingnya,[a] menggali tempat pemerasan anggur di dalamnya, dan membangun sebuah menara.[b] Kemudian ia menyewakan kebun itu kepada para penggarap[c] lalu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memasang pagar tanaman di sekelilingnya.” Kata Yunaninya dapat menunjuk pada berbagai penghalang keliling, seperti pagar atau pagar tanaman.
    reason: lexical_alternative
  - marker: b
    text: Gambaran tentang menanam kebun anggur, mengelilinginya dengan pagar, menggali tempat pemerasan anggur, dan membangun menara menggemakan Yesaya 5:1–2.
    reason: cross_reference
  - marker: c
    text: Atau “para petani penyewa.” Mereka menyewa kebun itu untuk menggarapnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Dengarkanlah perumpamaan yang lain
  rationale: Bentuk imperatif jamak ἀκούσατε disampaikan sebagai perintah langsung yang wajar dalam bahasa Indonesia; παραβολή diterjemahkan dengan istilah baku “perumpamaan”.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Ada seorang pemilik tanah
  rationale: Dalam latar kebun anggur yang disewakan, οἰκοδεσπότης menunjuk pada pemilik rumah atau lahan; “pemilik tanah” menyatakan perannya secara alami.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: menanami kebun anggur
  rationale: Ungkapan ini mempertahankan tindakan konkret menanam serta citra kebun anggur. “Menanami kebun anggur” lebih alami daripada seolah-olah menanam kebun sebagai satu benda.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: memasang pagar di sekelilingnya
  rationale: φραγμός berarti penghalang keliling dan dapat berupa pagar atau tanaman pagar. “Pagar” jelas dan tidak menentukan bahannya.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: menggali tempat pemerasan anggur di dalamnya
  rationale: ληνός menunjuk pada tempat atau bak pemerasan anggur, sedangkan ὀρύσσω berarti menggali. Pilihan ini mempertahankan gambaran fasilitas yang dibuat dengan penggalian.
- source_word: ᾠκοδόμησεν πύργον
  choice: membangun sebuah menara
  rationale: πύργος secara langsung berarti “menara”; fungsi khususnya sebagai menara pengawas tidak dinyatakan dalam teks.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: menyewakan kebun itu kepada para penggarap
  rationale: Bentuk tengah ἐκδίδωμι berarti menyewakan, dan γεωργοί adalah orang-orang yang menggarap lahan. “Para penggarap” menangkap fungsi mereka tanpa menambahkan rincian sistem sewanya.
- source_word: ἀπεδήμησεν
  choice: pergi ke tempat yang jauh
  rationale: ἀποδημέω menyatakan pergi meninggalkan daerah tempat tinggal, sering untuk suatu perjalanan. Frasa ini mengungkapkan unsur keberangkatan jauh tanpa menetapkan negara tujuan.
theological_decisions:
- issue: Gema gambaran kebun anggur dalam Yesaya 5:1–2
  choice: Mempertahankan rincian konkret kebun anggur dalam teks utama dan menjelaskan gemanya dalam catatan kaki.
  alternative: Menggunakan istilah yang lebih tradisional atau menyebut Yesaya secara langsung dalam teks utama.
  rationale: Bahasa Matius sendiri membangkitkan gema Yesaya tanpa menjelaskannya secara eksplisit. Terjemahan tidak boleh mengubah kiasan antarteks menjadi penafsiran tersurat.
- issue: Identitas dan hubungan ekonomi γεωργοί
  choice: para penggarap
  alternative: para petani penyewa
  rationale: Kata kerja “menyewakan” sudah menyatakan hubungan ekonomi, sedangkan “para penggarap” mempertahankan cakupan γεωργοί dan menghindari pengulangan yang kaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan yang bermartabat. Rangkaian klausa Yunani dipecah menjadi beberapa kalimat agar jelas bagi pembaca umum, tanpa menghilangkan urutan tindakan. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
