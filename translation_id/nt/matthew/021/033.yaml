  source_fidelity: Frasa terakhir, “pergi ke tempat yang jauh,” menambahkan unsur jarak yang tidak dinyatakan secara eksplisit oleh ἀπεδήμησεν. Kata ini menyatakan bahwa pemilik itu pergi/berangkat meninggalkan tempat tinggalnya, tanpa menetapkan bahwa tempat tujuannya jauh. Rincian tindakan lainnya pada dasarnya setia kepada teks Yunani.
  naturalness: Bahasa draf umumnya baku dan jelas. “Menanam sebuah kebun anggur” lebih lancar daripada “menanami kebun anggur,” dan “lalu pergi” menyampaikan penutup kalimat dengan alami tanpa tambahan makna.
  terminology: “Perumpamaan,” “pemilik tanah,” “kebun anggur,” “pagar,” “menara,” dan “para penggarap” sesuai dengan register Indonesia modern dan cakupan istilah Yunani. Catatan alternatif untuk φραγμός lebih alami dengan “pagar tanaman” daripada “tanaman pagar.”
  issues:
