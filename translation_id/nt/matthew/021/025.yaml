  source_fidelity: 'Makna pokok diterjemahkan dengan setia: pertanyaan tentang asal baptisan Yohanes, kontras “dari surga” dan “dari manusia,” serta pertimbangan para pemimpin dan konsekuensi jawaban mereka tetap terpelihara. Namun, “katanya” tidak tepat untuk partisipel jamak λέγοντες dan membuat konstruksi kalimat Indonesia tidak wajar.'
  naturalness: Bahasa pada umumnya baku dan jelas, tetapi “Mereka membicarakannya di antara mereka sendiri, katanya” janggal secara sintaksis. “Mereka berunding di antara mereka sendiri sambil berkata” merupakan bentuk modern dan alami, serta menyampaikan deliberasi yang sedang berlangsung.
  terminology: “Baptisan Yohanes,” “dari surga,” dan “dari manusia” tepat. “Memercayainya” lebih idiomatis dan lebih langsung untuk πιστεύω dengan datif daripada “percaya kepadanya,” tanpa mempersempit cakupan maknanya. Catatan kaki mempertahankan alternatif serta fungsi ungkapan “surga” dengan baik.
