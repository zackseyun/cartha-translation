id: MAT.21.25
reference: Matthew 21:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: id
  text: “Baptisan Yohanes itu berasal dari mana? Dari surga[a] atau dari manusia[b]?” Mereka berunding di antara mereka sendiri sambil berkata, “Jika kita menjawab, ‘Dari surga,’ Ia akan berkata kepada kita, ‘Kalau begitu, mengapa kalian tidak memercayainya?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari Allah”; “dari surga” adalah cara penuh hormat untuk menyatakan asal ilahi.
    reason: lexical_alternative
  - marker: b
    text: “Dari manusia” berarti berasal dari manusia semata, sebagai lawan dari asal ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: baptisan
  rationale: Istilah ini menunjuk pada baptisan sebagai ritus dan pelayanan Yohanes, bukan sekadar tindakan yang sedang berlangsung.
- source_word: τὸ Ἰωάννου
  choice: Yohanes
  rationale: Genitif mengaitkan baptisan itu dengan Yohanes; susunan alami bahasa Indonesia adalah “Baptisan Yohanes”.
- source_word: πόθεν
  choice: berasal dari mana
  rationale: Menanyakan sumber atau asal-usul, dan ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἐξ οὐρανοῦ
  choice: dari surga
  rationale: Mempertahankan ungkapan harfiah Yunani dan acuan tak langsung yang penuh hormat kepada asal ilahi.
- source_word: ἐξ ἀνθρώπων
  choice: dari manusia
  rationale: Menunjukkan asal yang semata-mata manusiawi dan tidak membatasi maknanya pada laki-laki.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: membicarakannya di antara mereka sendiri
  rationale: Menangkap proses pertimbangan bersama yang sedang berlangsung dengan bahasa Indonesia yang wajar.
- source_word: Ἐὰν εἴπωμεν
  choice: Jika kita menjawab
  rationale: Dalam konteks pertanyaan Yesus, “menjawab” lebih alami daripada “berkata” sambil tetap menyampaikan isi kondisi Yunani.
- source_word: ἐρεῖ ἡμῖν
  choice: Ia akan berkata kepada kita
  rationale: Mempertahankan bentuk ujaran langsung dan pengulangan verba berkata.
- source_word: Διὰ τί οὖν
  choice: Kalau begitu, mengapa
  rationale: Menyampaikan daya inferensial οὖν secara alami dalam dialog Indonesia.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: kalian tidak percaya kepadanya
  rationale: πιστεύω dengan datif di sini berarti memercayai Yohanes, termasuk menerima kesaksian dan kewenangannya.
theological_decisions:
- issue: Makna “dari surga”
  choice: Mempertahankan “dari surga” dalam teks utama.
  alternative: dari Allah
  rationale: Ungkapan Yunani merujuk dengan penuh hormat kepada asal atau kewenangan ilahi; bentuk harfiahnya menjaga gaya dan ketegangan retoris sumber.
- issue: Makna ἀνθρώπων dalam pertentangan dengan surga
  choice: Menggunakan “dari manusia”.
  alternative: dari orang-orang
  rationale: Yang dipertentangkan ialah asal manusiawi dengan asal ilahi, bukan laki-laki dengan perempuan.
- issue: Cakupan “percaya kepadanya”
  choice: Mempertahankan ungkapan umum “percaya kepadanya”.
  alternative: menerima kewenangannya
  rationale: Teks dapat mencakup kepercayaan kepada berita maupun kewenangan Yohanes; terjemahan tidak mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada dialogis yang bermartabat. “Kalian” dipakai karena pihak yang disapa jamak. Penanda catatan kaki ditempatkan tepat pada ungkapan yang diterangkan.
