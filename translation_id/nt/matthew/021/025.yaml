  - severity: low
    issue: “Percaya kepadanya”
    rationale: Ungkapan ini dapat dipahami sebagai “percaya kepada” dalam arti iman kepada seseorang. Dalam konteks πιστεύω dengan datif, “memercayainya” lebih idiomatis untuk “believe him / take him at his word,” sambil tetap mencakup penerimaan terhadap kesaksian dan kewenangan Yohanes.
