revisions:
- from: “Yang manakah dari keduanya melakukan kehendak ayahnya?” Mereka menjawab, “Yang pertama.” Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu, para pemungut pajak dan para pelacur sedang mendahului kamu menuju Kerajaan Allah.[a]”
  to: “Yang manakah dari keduanya melakukan kehendak ayahnya?” Mereka menjawab, “Yang pertama.” Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu, para pemungut pajak dan para pelacur mendahului kamu dalam memasuki Kerajaan Allah.[a]”
  rationale: Revisi terbatas pada penggantian «sedang mendahului kamu menuju Kerajaan Allah» dengan «mendahului kamu dalam memasuki Kerajaan Allah». Ini menghindari pelemahan makna εἰς oleh «menuju», sambil tetap tidak menambahkan kesimpulan tentang pengecualian akhir para pendengar dari Kerajaan Allah. Catatan kaki tetap berfungsi untuk menyatakan alternatif yang lebih eksplisit dan batas makna yang tidak boleh dipaksakan dari προάγουσιν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:54:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Yunani. Namun, «menuju Kerajaan Allah» untuk εἰς τὴν βασιλείαν τοῦ θεοῦ kurang tepat: εἰς di sini mengarah pada masuk ke dalam kerajaan, bukan sekadar bergerak menuju kerajaan itu. Frasa revisi mempertahankan metafora προάγουσιν sebagai mendahului tanpa menyatakan bahwa lawan bicara pasti tidak akan masuk.'
  naturalness: Bahasa draf baku, jelas, dan bernada khidmat. «Mendahului kamu dalam memasuki Kerajaan Allah» lebih alami dan lebih jelas daripada «sedang mendahului kamu menuju Kerajaan Allah». Penghilangan «sedang» tidak mengubah daya aspek secara material dalam bahasa Indonesia dan menghindari kesan peristiwa yang hanya sedang berlangsung pada saat ujaran.
  terminology: «Kehendak ayahnya», «Sesungguhnya Aku berkata kepadamu», «para pemungut pajak», «para pelacur», dan «Kerajaan Allah» sesuai dengan register Alkitab Indonesia modern serta dengan makna istilah Yunani. Kapitalisasi sapaan/perkataan Yesus konsisten dengan konvensi editorial yang dipakai draf.
