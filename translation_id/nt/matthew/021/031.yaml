id: MAT.21.31
reference: Matthew 21:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: id
  text: “Yang manakah dari keduanya melakukan kehendak ayahnya?” Mereka menjawab, “Yang pertama.” Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu, para pemungut pajak dan para pelacur mendahului kamu dalam memasuki Kerajaan Allah.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “masuk ke dalam Kerajaan Allah lebih dahulu daripada kamu.” Kata Yunani yang digunakan berarti “mendahului kamu” dan menekankan bahwa mereka lebih dahulu, tanpa dengan sendirinya menyatakan bahwa kamu akhirnya tidak akan masuk.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Yang manakah dari keduanya
  rationale: 'Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna partitif: memilih satu dari dua orang yang telah disebutkan dalam perumpamaan.'
- source_word: ἐποίησεν
  choice: melakukan
  rationale: Padanan langsung dan wajar bagi ποιέω ketika digunakan dengan ‘kehendak’, tanpa mengurangi unsur tindakan nyata.
- source_word: τὸ θέλημα τοῦ πατρός
  choice: kehendak ayahnya
  rationale: Bentuk posesif membuat hubungan dengan kedua anak dalam perumpamaan jelas dan alami dalam bahasa Indonesia; yang dimaksud pada tingkat cerita adalah ayah dalam perumpamaan.
- source_word: Ὁ πρῶτος
  choice: Yang pertama
  rationale: Jawaban ringkas ini mempertahankan bentuk eliptis bahasa Yunani dan terdengar alami.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepadamu
  rationale: Mempertahankan sifat khidmat dan tegas dari rumusan perkataan Yesus dalam bahasa yang jelas dan bermartabat.
- source_word: τελῶναι
  choice: para pemungut pajak
  rationale: Padanan modern yang lazim bagi para petugas pemungut pendapatan yang dipandang rendah dalam konteks Injil.
- source_word: πόρναι
  choice: para pelacur
  rationale: Padanan modern yang spesifik bagi perempuan yang menjajakan seks; lebih tepat daripada istilah luas seperti ‘perempuan amoral’ dan tidak arkais.
- source_word: προάγουσιν ὑμᾶς
  choice: sedang mendahului kamu
  rationale: Mempertahankan aspek kini/progresif dan gambaran gerak mendahului, tanpa menyatakan secara lebih tegas daripada teks bahwa para lawan bicara pasti tidak akan masuk.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: menuju Kerajaan Allah
  rationale: ‘Menuju’ mempertahankan arah yang dinyatakan oleh εἰς serta berpadu alami dengan gambaran ‘mendahului’; istilah ‘Kerajaan Allah’ dipertahankan secara utuh.
theological_decisions:
- issue: Daya makna προάγουσιν ὑμᾶς sehubungan dengan masuk ke dalam Kerajaan Allah
  choice: sedang mendahului kamu menuju Kerajaan Allah
  alternative: masuk ke dalam Kerajaan Allah lebih dahulu daripada kamu
  rationale: Kata προάγω menyatakan gerak mendahului. Terjemahan utama mempertahankan penekanan pada urutan atau keutamaan tanpa diam-diam menyimpulkan bahwa para pemimpin agama sama sekali tidak akan masuk. Alternatif menjelaskan kemungkinan makna kontekstual yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Kata ganti untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
