id: MAT.21.9
reference: Matthew 21:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: id
  text: Orang banyak yang berjalan di depan Yesus dan mereka yang mengikuti-Nya terus berseru, “Hosana[a] bagi Anak Daud[b]! Diberkatilah dia yang datang dalam nama Tuhan![c] Hosana di tempat yang mahatinggi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” berasal dari ungkapan Ibrani yang kira-kira berarti “selamatkanlah, kiranya” atau “selamatkanlah sekarang”; di sini kata itu berfungsi sebagai seruan pujian.
    reason: lexical_alternative
  - marker: b
    text: “Anak Daud” adalah gelar kerajaan yang berkaitan dengan Mesias.
    reason: cultural_note
  - marker: c
    text: Kalimat ini menggemakan Mazmur 118:26. Dalam teks Ibrani mazmur itu terdapat nama ilahi YHWH, yang diterjemahkan “Tuhan” dalam frasa ini.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan menggambarkan massa orang yang berkumpul tanpa nuansa arkais.
- source_word: οἱ προάγοντες αὐτὸν
  choice: yang berjalan di depan Yesus
  rationale: Partisip ini menunjuk kepada orang-orang yang bergerak di depan Yesus dalam arak-arakan. Nama Yesus dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: οἱ ἀκολουθοῦντες
  choice: mereka yang mengikuti-Nya
  rationale: Terjemahan ini mempertahankan gambaran kelompok yang berada di belakang dan mengikuti Yesus dalam arak-arakan.
- source_word: ἔκραζον λέγοντες
  choice: terus berseru
  rationale: Kata 'terus' menyampaikan aspek imperfektum, yaitu seruan yang berlangsung atau berulang. Isi kutipan sudah memenuhi fungsi λέγοντες sehingga tambahan 'dengan berkata' tidak diperlukan dalam bahasa Indonesia.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Transliterasi mempertahankan bentuk seruan liturgis yang dikenal dan nuansa pujiannya, sedangkan arti asalnya dijelaskan dalam catatan kaki.
- source_word: τῷ υἱῷ Δαυίδ
  choice: bagi Anak Daud
  rationale: Kata depan 'bagi' mengungkapkan datif yang menyertai seruan 'Hosana' secara alami, sementara gelar 'Anak Daud' dipertahankan tanpa diparafrasakan.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Diberkatilah dia yang datang
  rationale: Terjemahan ini mempertahankan bentuk berkat dan partisip substantival tunggal tanpa mengubahnya menjadi gelar atau penjelasan tambahan.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Ungkapan ini setia pada bentuk Yunani, mempertahankan gema Kitab Suci dan makna kewenangan ilahi tanpa menggantinya dengan parafrasa.
- source_word: ἐν τοῖς ὑψίστοις
  choice: di tempat yang tertinggi
  rationale: Ungkapan ini mempertahankan gaya seruan yang luhur dan rujukan ruang surgawi tanpa memperjelasnya secara berlebihan sebagai 'surga tertinggi'.
theological_decisions:
- issue: Gelar kerajaan mesianik dalam τῷ υἱῷ Δαυίδ
  choice: Mempertahankan 'Anak Daud' sebagai gelar dalam teks utama.
  alternative: Mesias
  rationale: Teks Yunani memakai gelar Daud, bukan kata 'Mesias'. Mempertahankannya menjaga tekstur historis dan teologis serta tidak memasukkan tafsiran ke dalam teks utama.
- issue: Makna dan fungsi Ὡσαννά
  choice: Memakai 'Hosana' dalam teks utama dan menjelaskan arti asalnya dalam catatan kaki.
  alternative: Selamatkanlah kami sekarang / Tolong selamatkan
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai seruan liturgis yang juga bernuansa pujian, bukan semata-mata permohonan yang transparan.
- issue: Rujukan κυρίου dalam kutipan Mazmur
  choice: Menerjemahkan κύριος sebagai 'Tuhan' sambil mencatat latar nama ilahi YHWH.
  alternative: TUHAN
  rationale: Teks Yunani berbunyi κυρίου. Bentuk 'Tuhan' mengikuti sumber Perjanjian Baru, sedangkan catatan kaki menjaga hubungan dengan nama ilahi dalam Mazmur 118:26.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'terus berseru' menyampaikan tindakan yang berlangsung; susunan seruan dipertahankan agar irama liturgis ayat tetap terasa. Kapitalisasi 'Tuhan' dan 'Anak Daud' mengikuti fungsi sebutan dan gelar, sedangkan 'dia' tidak dikapitalisasi agar tidak menambahkan penandaan teologis yang tidak terdapat dalam teks Yunani.
