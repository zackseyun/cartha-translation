  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: id
  text: Dan apa pun yang kalian minta[a] dalam doa dengan percaya[b], akan kalian terima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala sesuatu yang kalian minta” atau “semua yang kalian minta.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan menaruh kepercayaan”; partisipel Yunani menunjukkan sikap percaya ketika berdoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: apa pun yang
  rationale: Gabungan πᾶς dan ὅσος merupakan ungkapan menyeluruh yang secara alami berarti 'apa pun yang' dalam bahasa Indonesia, tanpa membatasi cakupannya.
- source_word: ἂν αἰτήσητε
  choice: kalian minta
  rationale: ἄν dengan subjungtif aoris membentuk klausa relatif tak tentu. Dalam bahasa Indonesia, nuansa itu sudah disampaikan secara alami oleh 'apa pun yang kalian minta' tanpa perlu menambahkan modalitas.
- source_word: ἐν τῇ προσευχῇ
  choice: dalam doa
  rationale: Frasa datif ini secara idiomatis berarti 'dalam doa'. Artikel Yunani tidak menuntut bentuk definit dalam bahasa Indonesia.
- source_word: πιστεύοντες
  choice: dengan percaya
  rationale: Partisipel kini menunjukkan tindakan atau sikap yang menyertai permintaan dalam doa. 'Dengan percaya' mempertahankan hubungan itu tanpa mengubahnya menjadi syarat eksplisit.
- source_word: λήμψεσθε
  choice: akan kalian terima
  rationale: Bentuk futur dari λαμβάνω secara alami diterjemahkan 'akan kalian terima'; bentuk medialnya tidak memerlukan penandaan khusus dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan iman dengan terkabulnya doa
  choice: dengan percaya
  alternative: jika kalian percaya
  rationale: Teks Yunani memakai partisipel, bukan klausa syarat yang eksplisit. Terjemahan ini tetap menghubungkan doa dengan iman tanpa menyelesaikan secara tersirat perdebatan teologis mengenai mekanisme atau cakupan jawaban atas doa.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pronomina jamak 'kalian' dipakai untuk menyatakan orang kedua jamak yang eksplisit dalam verba Yunani. Susunan 'dengan percaya' mempertahankan fungsi partisipel secara alami dan menghindari penambahan klausa syarat eksplisit.
