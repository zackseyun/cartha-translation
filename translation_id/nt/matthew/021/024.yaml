  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: id
  text: Namun, Yesus menjawab mereka, “Aku juga akan mengajukan satu pertanyaan kepada kalian.[a] Jika kalian menjawabnya, Aku juga akan memberi tahu kalian dengan wewenang apa Aku melakukan hal-hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu perkara”; secara lebih harfiah, “satu kata”. Kata Yunani λόγον dapat menunjuk pada pertanyaan atau perkara yang sedang dibicarakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Namun, Yesus menjawab mereka
  rationale: Gabungan partisip ἀποκριθείς dengan εἶπεν merupakan ungkapan naratif idiomatis untuk suatu jawaban. 'Menjawab' menghindari pengulangan kaku, sedangkan 'Namun' menyampaikan peralihan yang bernuansa kontras dari δέ.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Aku juga akan mengajukan ... kepada kalian
  rationale: Bentuk mendatang ἐρωτήσω menyatakan pertanyaan balasan, dan κἀγώ menekankan timbal balik. 'Mengajukan pertanyaan' terdengar alami dalam bahasa Indonesia dan mempertahankan penekanan 'Aku juga'.
- source_word: λόγον ἕνα
  choice: satu pertanyaan
  rationale: Secara harfiah λόγος dapat berarti 'kata' atau 'perkara', tetapi dalam konteks ini menunjuk pada hal yang diajukan untuk dijawab. 'Satu pertanyaan' paling jelas dan alami tanpa mengubah fungsi ungkapan tersebut.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Jika kalian menjawabnya
  rationale: Secara bentuk berarti kira-kira 'yang jika kalian katakan kepada-Ku', tetapi dalam konteks pertanyaan, maksudnya adalah memberikan jawaban. Rumusan ini mempertahankan syarat secara alami.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: Aku juga akan memberi tahu kalian
  rationale: Pilihan ini mempertahankan pola timbal balik κἀγώ dan menyampaikan ἐρῶ secara idiomatis dalam bahasa Indonesia.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: dengan wewenang apa
  rationale: ἐν di sini menunjukkan dasar atau lingkup tindakan yang berwenang. 'Dengan wewenang apa' merupakan padanan Indonesia yang alami dan tepat.
- source_word: ταῦτα ποιῶ
  choice: Aku melakukan hal-hal ini
  rationale: Rumusan ini mempertahankan bentuk jamak ταῦτα dan aspek kini ποιῶ yang menunjuk secara umum pada tindakan-tindakan Yesus yang sedang dipersoalkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Aku' dan 'kalian' menjaga kejelasan pelaku serta bentuk jamak ὑμᾶς/ὑμῖν. Susunan kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan bersyarat dan timbal balik dalam teks Yunani.
