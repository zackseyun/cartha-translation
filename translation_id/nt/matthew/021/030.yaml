id: MAT.21.30
reference: Matthew 21:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: id
  text: Kemudian ia mendatangi anak yang kedua dan mengatakan hal yang sama. Anak itu menjawab, “Saya akan pergi,[a] Pak,[b]” tetapi ia tidak pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bahasa Yunani berbunyi “Saya, Pak”—jawaban eliptis yang berarti “Saya akan pergi.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani κύριε juga dapat diterjemahkan “Tuan” atau, dalam konteks lain, “Tuhan”. Di sini kata itu merupakan sapaan hormat kepada seorang ayah manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Kemudian ia mendatangi
  rationale: Partisip aoris προσελθών menyatakan gerak sang ayah kepada anak berikutnya, sedangkan δέ meneruskan alur cerita. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa ia menghampiri anak itu.
- source_word: τῷ δευτέρῳ
  choice: anak yang kedua
  rationale: Teks Yunani secara harfiah hanya menyebut 'yang kedua', tetapi 'anak' tersirat jelas dari konteks. Menyatakannya membuat rujukan alami dan jelas dalam bahasa Indonesia.
- source_word: ὡσαύτως
  choice: hal yang sama
  rationale: Kata ini menunjuk pada perintah yang sama seperti yang telah disampaikan kepada anak pertama.
- source_word: ἀποκριθεὶς εἶπεν
  choice: menjawab
  rationale: Ungkapan Yunani harfiah 'setelah menjawab, ia berkata' merupakan rumusan yang cukup diwakili oleh verba Indonesia 'menjawab' tanpa pengulangan yang kaku.
- source_word: Ἐγώ
  choice: Saya akan pergi
  rationale: Bahasa Yunani hanya memakai pronomina emfatis 'saya/aku' sebagai jawaban eliptis. Dalam konteks, maksudnya adalah kesediaan untuk pergi; verba tersirat ditambahkan agar wajar dan jelas dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: κύριε
  choice: Pak
  rationale: Vokatif ini merupakan sapaan hormat seorang anak kepada ayah manusia. 'Pak' menyampaikan rasa hormat secara alami dalam bahasa Indonesia tanpa memberi kesan gelar ilahi.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: tetapi ia tidak pergi
  rationale: Walaupun καί biasanya berarti 'dan', hubungan kalimat di sini bersifat kontras antara ucapan dan tindakan; 'tetapi' menyatakannya secara idiomatis tanpa mengubah isi.
theological_decisions:
- issue: Makna κύριε sebagai sapaan kepada ayah
  choice: Pak
  alternative: Tuan; Tuhan
  rationale: Konteks perumpamaan menunjukkan sapaan hormat kepada ayah manusia, bukan pengakuan kristologis atau sapaan kepada Allah. 'Pak' menjaga kesopanan dan hubungan keluarga; 'Tuhan' akan memasukkan nuansa teologis yang tidak dituntut konteks.
- issue: Pelengkapan jawaban eliptis Ἐγώ
  choice: Saya akan pergi
  alternative: Saya, Pak; Ya, Pak
  rationale: Jawaban Yunani mempertahankan ketegangan antara pengakuan lisan dan ketidaktaatan dalam tindakan. Pelengkapan verba membuat maksudnya dapat dipahami secara alami, sementara catatan kaki mempertahankan bentuk eliptis sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “Pak” dipilih karena alami dalam hubungan anak dengan ayah dan tetap hormat. Struktur kalimat mempertahankan kontras utama antara janji anak dan tindakannya.
