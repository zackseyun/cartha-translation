  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: id
  text: Para petani penggarap itu menangkap budak-budaknya[a]; yang seorang mereka pukul, yang lain mereka bunuh, dan yang lain lagi mereka rajam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “budak” juga dapat diterjemahkan “hamba” atau “pelayan”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: para petani penggarap
  rationale: Dalam konteks perumpamaan tentang kebun anggur yang disewakan, istilah ini menunjuk kepada orang-orang yang menggarap lahan milik orang lain. “Petani penggarap” menyampaikan pekerjaan pertanian sekaligus hubungan mereka dengan pemiliknya.
- source_word: λαβόντες
  choice: menangkap
  rationale: Partisip aoris ini mendahului tindakan-tindakan utama. Dalam konteks kekerasan terhadap para utusan, “menangkap” lebih alami dan cukup kuat daripada terjemahan harfiah “mengambil”.
- source_word: δούλους
  choice: hamba-hambanya
  rationale: “Hamba” mempertahankan gagasan bahwa mereka berada di bawah kuasa dan mewakili tuannya, sekaligus tidak menutup ambiguitas kontekstual antara budak dan pelayan.
- source_word: ἔδειραν
  choice: mereka pukul
  rationale: Kata kerja ini berarti memukul atau mendera. “Pukul” alami dalam bahasa Indonesia modern dan tidak menentukan alat atau cara yang tidak dinyatakan oleh teks.
- source_word: ἀπέκτειναν
  choice: mereka bunuh
  rationale: Padanan langsung ini mempertahankan tindakan membunuh tanpa menambahkan kategori hukum seperti “membunuh secara keji” atau bentuk penghukuman resmi.
- source_word: ἐλιθοβόλησαν
  choice: mereka rajam
  rationale: “Merajam” adalah padanan ringkas dan baku untuk menyerang atau membunuh dengan lemparan batu; teks tidak secara tersendiri menyatakan hasil akhirnya bagi orang ketiga.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: yang seorang ... yang lain ... yang lain lagi
  rationale: Susunan distributif ini dengan jelas membedakan perlakuan terhadap tiga orang tanpa mengubahnya menjadi kelompok-kelompok yang jumlahnya tidak pasti.
theological_decisions:
- issue: Makna δοῦλος dalam kisah perumpamaan
  choice: hamba
  alternative: budak; pelayan
  rationale: “Hamba” menyatakan kedudukan di bawah kuasa tuan dan fungsi sebagai utusan. Catatan kaki mempertahankan kemungkinan makna sosial yang lebih tegas, yaitu “budak”, serta kemungkinan kontekstual “pelayan”, tanpa memaksakan salah satunya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan Yunani dipertahankan, sementara partisip pembuka dialihkan menjadi verba finit agar alami. Bentuk “hamba-hambanya” menunjukkan bahwa mereka adalah milik atau berada di bawah wewenang pemilik kebun; akhiran -nya merujuk kepada pemilik tersebut.
