  naturalness: Susunan kalimatnya lugas dan registernya sesuai. “Buah-buahnya” terdengar kurang alami dan memiliki anteseden yang kabur dalam bahasa Indonesia. Menyebut “buah-buah Kerajaan itu” tetap cukup dekat dengan teks, memperjelas rujukan pronomina Yunani, dan terdengar lebih wajar dalam konteks ini.
  terminology: “Kerajaan Allah” merupakan padanan yang baik dan mapan untuk ἡ βασιλεία τοῦ θεοῦ. “Suatu bangsa” mempertahankan keluasan ἔθνει tanpa menetapkan identitas teologisnya. Catatan “suatu umat” tepat sebagai alternatif leksikal.
