  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: id
  text: 'Karena itu, Aku berkata kepada kalian: Kerajaan Allah akan diambil dari kalian dan diberikan kepada suatu bangsa[a] yang menghasilkan buah-buah Kerajaan itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu umat.” Kata Yunani ἔθνος dapat berarti bangsa atau kelompok umat; di sini kata itu menunjuk suatu kelompok sebagai penerima yang dicirikan oleh buah yang dihasilkannya, tanpa diperinci lebih lanjut siapa yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai kesimpulan dari perumpamaan dan kutipan sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan logis.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan rumusan tutur langsung serta sapaan orang kedua jamak; dalam bahasa Indonesia, bentuk “kepadamu” tidak membedakan tunggal dan jamak.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: akan diambil darimu
  rationale: Mempertahankan bentuk pasif dan gagasan pemisahan atau hilangnya sesuatu dari para pendengar.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku yang mempertahankan keluasan makna βασιλεία, baik pemerintahan maupun ranah kerajaan, tanpa mempersempitnya melalui parafrasa.
- source_word: δοθήσεται
  choice: dan diberikan
  rationale: Mempertahankan bentuk pasif futurum yang sejajar dengan ἀρθήσεται; subjek yang sama dapat dipahami secara alami tanpa diulang.
- source_word: ἔθνει
  choice: kepada suatu bangsa
  rationale: ἔθνος tunggal menunjuk kelompok korporat dan dapat berarti bangsa atau suatu umat. “Suatu bangsa” merupakan padanan langsung tanpa menentukan identitas teologis kelompok itu.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: yang menghasilkan buah-buahnya
  rationale: Mempertahankan partisipel aktif yang mencirikan bangsa tersebut melalui tindakan berkelanjutan, bentuk jamak καρπούς, dan pronomina yang paling wajar merujuk kepada Kerajaan Allah.
theological_decisions:
- issue: Identitas ἔθνει
  choice: Diterjemahkan secara umum sebagai “suatu bangsa” dan diberi alternatif “suatu umat” dalam catatan.
  alternative: Menentukan kelompok itu sebagai gereja, bangsa-bangsa bukan Yahudi, atau umat Allah yang diperbarui.
  rationale: Teks menyebut suatu kelompok korporat yang dikenal melalui buahnya, tetapi tidak secara eksplisit menetapkan salah satu identifikasi teologis yang lebih sempit.
- issue: Makna Kerajaan Allah dalam perkataan penghakiman ini
  choice: Mempertahankan istilah “Kerajaan Allah”.
  alternative: Memparafrasakannya sebagai pemerintahan Allah atau hak istimewa menjadi umat Allah.
  rationale: Istilah sumber memiliki cakupan teologis yang luas; parafrasa akan mempersempit maknanya dan menjelaskan bentuk penghakiman melampaui yang dinyatakan teks.
- issue: Rujukan αὐτῆς dalam “buah-buahnya”
  choice: Dipertahankan sebagai pronomina yang secara gramatikal paling wajar merujuk pada Kerajaan Allah.
  alternative: Menafsirkannya sebagai buah-buah bangsa tersebut.
  rationale: Bentuk feminin tunggal αὐτῆς cocok dengan βασιλεία dan tidak cocok secara gramatikal dengan ἔθνει yang netral, sehingga relasi sumber dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi “Aku” mengikuti tuturan Yesus dan “Kerajaan Allah” diperlakukan sebagai sebutan teologis baku. Bentuk “buah-buahnya” sengaja mempertahankan jamak Yunani, meskipun “buahnya” lebih idiomatis dalam sebagian konteks Indonesia.
