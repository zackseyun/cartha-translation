base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: id
  text: 'Hal itu terjadi supaya genaplah apa yang disampaikan melalui nabi[a] yang berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh nabi.” Secara lebih harfiah, bahasa Yunani memakai ungkapan “melalui nabi,” yang menekankan perantaraan nabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: Hal itu
  rationale: Kata tunjuk netral tunggal ini merujuk pada peristiwa yang baru saja diceritakan sebagai satu kesatuan; “hal itu” alami dalam narasi Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini bersifat penghubung ringan. Dalam bahasa Indonesia, kesinambungan narasi sudah jelas tanpa penanda tambahan seperti “adapun” atau “lalu”, yang dapat memberi tekanan berlebihan.
- source_word: γέγονεν
  choice: terjadi
  rationale: Bentuk perfek γίνομαι dalam rumusan penggenapan secara idiomatis menyatakan berlangsungnya suatu peristiwa; “terjadi” ringkas dan wajar.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan nuansa tujuan/hasil dalam rumusan penggenapan tanpa memutuskan secara berlebihan hubungan teologis di antara keduanya.
- source_word: πληρωθῇ
  choice: genaplah
  rationale: Bentuk pasif ini lazim dan bermartabat dalam bahasa Indonesia untuk menyatakan bahwa perkataan sebelumnya mencapai penggenapannya.
- source_word: τὸ ῥηθὲν
  choice: apa yang disampaikan
  rationale: Menerjemahkan partisipel pasif bersubstantiva secara alami sekaligus mempertahankan bahwa perkataan itu disampaikan, tanpa menambahkan subjek yang tidak dinyatakan.
- source_word: διὰ τοῦ προφήτου
  choice: melalui nabi
  rationale: διά dengan genitif menandai perantaraan atau keagenan; “melalui nabi” mempertahankan nuansa bahwa nabi menjadi perantara penyampaian.
- source_word: λέγοντος
  choice: yang berkata
  rationale: Partisipel ini secara gramatikal merujuk kepada nabi dan memperkenalkan kutipan yang menyusul.
theological_decisions:
- issue: Penggenapan dan perantaraan nabi
  choice: “apa yang disampaikan melalui nabi”
  alternative: “apa yang dikatakan oleh nabi”
  rationale: Pilihan utama mempertahankan tekanan Yunani pada nabi sebagai perantara penyampaian, tanpa secara eksplisit menambahkan siapa penutur utama yang tidak disebut dalam ayat ini.
- issue: Hubungan tujuan dan hasil dalam ἵνα
  choice: “supaya genaplah”
  alternative: “sehingga genaplah”
  rationale: “Supaya” mempertahankan daya telik ἵνα, sedangkan konteks tetap memungkinkan pembaca menangkap hasil yang benar-benar terjadi tanpa terjemahan menyelesaikan seluruh ketegangan tujuan/hasil.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan “genaplah” mempertahankan corak rumusan penggenapan yang dikenal luas, sedangkan “apa yang disampaikan” tetap mudah dipahami pembaca umum.
