id: MAT.21.46
reference: Matthew 21:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: id
  text: Mereka berusaha menangkap dia, tetapi mereka takut kepada orang banyak, sebab orang banyak menganggap dia seorang nabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang dia sebagai nabi” atau “berpendapat bahwa dia seorang nabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: ingin
  rationale: Partisipel kini ini menyatakan niat yang sedang berlangsung. Dalam hubungan dengan verba utama, “ingin” secara alami menyampaikan bahwa mereka berniat menangkap dia, tetapi tertahan oleh rasa takut.
- source_word: κρατῆσαι
  choice: menangkap
  rationale: Dalam konteks permusuhan ini, kata tersebut berarti menangkap atau menahan seseorang, bukan sekadar memegang secara fisik.
- source_word: ἐφοβήθησαν
  choice: mereka takut kepada
  rationale: Bentuk aoris ini diterjemahkan secara langsung tanpa memaksakan nuansa bahwa rasa takut itu baru mulai timbul.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami untuk kelompok-kelompok masyarakat yang berkumpul; bentuk ini dapat menyampaikan jamak kolektif tanpa memakai istilah yang kaku.
- source_word: ἐπεὶ εἰς
  choice: sebab
  rationale: Memperkenalkan alasan mereka takut kepada orang banyak dengan hubungan sebab yang jelas.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: orang banyak menganggap dia seorang nabi
  rationale: Konstruksi idiomatis ini menyatakan penilaian orang banyak terhadap dia. Subjek “orang banyak” diulangi agar pergantian subjek yang tersirat dalam bahasa Yunani jelas dalam bahasa Indonesia.
- source_word: προφήτην
  choice: seorang nabi
  rationale: Nomina tanpa artikel ini menunjuk pada dia sebagai orang yang termasuk dalam kategori nabi; “seorang nabi” merupakan bentuk Indonesia yang alami.
theological_decisions:
- issue: Cara menyampaikan penilaian orang banyak bahwa dia adalah προφήτην tanpa menambah atau menyangkal klaim kristologis lain
  choice: orang banyak menganggap dia seorang nabi
  alternative: orang banyak memandang dia sebagai nabi; orang banyak berpendapat bahwa dia seorang nabi
  rationale: Ayat ini melaporkan pandangan orang banyak, bukan memberikan definisi lengkap tentang identitas Yesus. Pilihan ini mempertahankan sudut pandang naratif tanpa menyiratkan bahwa dia hanyalah seorang nabi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. Konjungsi “tetapi” menyatakan pertentangan kontekstual antara niat menangkap dan ketakutan yang menahan mereka. Kata ganti “dia” tidak diberi kapital karena kapitalisasi teologis tidak ditandai dalam teks Yunani.
