  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Ia akan membinasakan orang-orang jahat itu secara mengenaskan,[a] lalu menyewakan kebun anggur itu kepada para penggarap lain,[b] yang akan menyerahkan hasil kebun itu kepadanya pada waktu-waktu yang semestinya.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Ia akan membinasakan orang-orang jahat itu dengan cara yang jahat/buruk.” Bahasa Yunani memakai kata sifat dan kata keterangan dari akar yang sama untuk menegaskan kerasnya hukuman.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menyewakan kebun anggur itu kepada para penyewa lain.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “yang akan menyerahkan buah-buahnya kepadanya pada waktu-waktu yang semestinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepada-Nya
  rationale: Bentuk kini Yunani berfungsi sebagai present historis dalam narasi; bentuk lampau dengan ‘berkata’ lebih wajar dalam bahasa Indonesia.
- source_word: Κακοὺς κακῶς
  choice: orang-orang jahat itu secara mengenaskan
  rationale: Pasangan kata sifat dan kata keterangan yang berakar sama menegaskan buruknya para penggarap sekaligus dahsyatnya kebinasaan mereka. Bahasa Indonesia tidak dapat mempertahankan permainan kata itu secara alami, sehingga unsur tersebut dijelaskan dalam catatan kaki.
- source_word: ἀπολέσει
  choice: akan membinasakan
  rationale: Kata ini menyatakan penghukuman yang menentukan dan berat tanpa menetapkan secara lebih khusus cara pelaksanaannya.
- source_word: τὸν ἀμπελῶνα
  choice: kebun anggur itu
  rationale: Padanan baku yang mempertahankan gambaran pertanian dan gema perumpamaan tentang kebun anggur.
- source_word: ἐκδώσεται
  choice: menyewakan
  rationale: Dalam konteks pertanian, kata ini menunjuk pada penyerahan lahan kepada penggarap berdasarkan perjanjian sewa.
- source_word: ἄλλοις γεωργοῖς
  choice: kepada para penggarap lain
  rationale: ‘Penggarap’ mencakup orang yang mengusahakan kebun sebagai penyewa dan sesuai dengan hubungan sewa yang dinyatakan oleh kata kerja sebelumnya.
- source_word: οἵτινες
  choice: yang
  rationale: Kata penghubung relatif ini cukup menyampaikan bahwa para penggarap tersebut adalah orang-orang yang akan memenuhi kewajiban mereka.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: akan menyerahkan ... kepadanya
  rationale: Kata kerja ini berarti memberikan atau membayarkan apa yang menjadi hak seseorang; ‘menyerahkan’ mempertahankan nuansa kewajiban tanpa mempersempitnya menjadi pembayaran uang.
- source_word: τοὺς καρποὺς
  choice: hasil kebun itu
  rationale: Dalam konteks kebun anggur, ungkapan ini menunjuk pada buah atau hasil kebun yang wajib diberikan kepada pemilik. Pilihan ini alami sekaligus mempertahankan citra pertanian.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: pada musim-musimnya
  rationale: Bentuk jamak menunjuk pada waktu atau musim yang sesuai bagi hasil kebun tersebut; terjemahan ini mempertahankan latar pertanian.
theological_decisions:
- issue: Berat dan sifat penghukuman dalam jawaban para pendengar
  choice: Ia akan membinasakan orang-orang jahat itu secara mengenaskan
  alternative: Ia akan mendatangkan kebinasaan yang mengerikan atas orang-orang jahat itu
  rationale: Teks Yunani memakai permainan kata yang bersifat menegaskan, bukan istilah teknis mengenai bentuk penghukuman tertentu. Terjemahan mempertahankan kerasnya penghakiman tanpa menambahkan rincian doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat dan mudah dipahami. Sapaan pronominal kepada Yesus ditulis ‘kepada-Nya’ menurut kebiasaan penerbitan Alkitab Indonesia; kata ganti ‘Ia’ dalam kutipan mengacu pada pemilik kebun dalam perumpamaan.
