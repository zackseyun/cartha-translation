  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: id
  text: Jika seseorang berkata sesuatu kepada kalian, katakanlah, “Tuhan[a] memerlukan keduanya,” dan ia akan segera mengirimkan keduanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuan”.'
    reason: lexical_alternative
  - marker: b
    text: Verba Yunani berbentuk orang ketiga tunggal (“ia akan mengirimkan”), tetapi pelakunya tidak disebutkan dengan nomina. Dalam konteks, pelakunya kemungkinan adalah orang yang berbicara kepada para murid.
    reason: ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: Jika ada orang mengatakan sesuatu kepada kalian
  rationale: Ungkapan bersyarat tak tentu ini mencakup siapa saja yang mungkin menegur atau mempertanyakan tindakan para murid. “Kalian” menyatakan bahwa ὑμῖν berbentuk jamak, sedangkan “mengatakan sesuatu” tidak mempersempitnya menjadi pertanyaan.
- source_word: ἐρεῖτε
  choice: katakanlah
  rationale: Bentuk futurum ini berfungsi sebagai perintah atau petunjuk. Bentuk imperatif Indonesia menyampaikan daya instruksionalnya secara wajar.
- source_word: Ὁ κύριος
  choice: Tuhan
  rationale: Pilihan ini mempertahankan bobot gelar κύριος dan memungkinkan perkataan tersebut menunjuk kepada Yesus sebagai Tuhan, tanpa menutup kemungkinan arti kontekstual “Tuan”.
- source_word: αὐτῶν χρείαν ἔχει
  choice: memerlukan keduanya
  rationale: Ungkapan χρείαν ἔχει berarti “memerlukan”. Kata ganti jamak merujuk kepada keledai betina dan anaknya yang disebut sebelumnya; “keduanya” menjadikan rujukan itu jelas dalam bahasa Indonesia.
- source_word: εὐθὺς
  choice: segera
  rationale: Kata ini menyatakan tindakan tanpa penundaan; “segera” ringkas, alami, dan sesuai dengan register narasi.
- source_word: ἀποστελεῖ αὐτούς
  choice: ia akan ... mengirimkan keduanya
  rationale: Terjemahan ini mempertahankan arti dasar “mengirim” dan kata ganti subjek yang secara gramatikal tidak disebutkan secara eksplisit, sehingga ambiguitas sumber tidak diselesaikan diam-diam.
theological_decisions:
- issue: Arti dan rujukan Ὁ κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan kemungkinan kuat bahwa Yesus menyebut diri-Nya dengan gelar yang berwibawa dan bernilai kristologis. Namun, karena κύριος juga dapat berarti “tuan”, kemungkinan leksikal itu dicatat tanpa menjadikan sosok tersebut sekadar pemilik hewan.
- issue: Subjek ἀποστελεῖ
  choice: Kata ganti “ia” dipertahankan dan ambiguitasnya dijelaskan dalam catatan kaki
  alternative: orang itu akan mengirimkan keduanya
  rationale: Subjek yang paling wajar adalah orang yang sebelumnya berbicara kepada para murid, tetapi bahasa Yunani tidak menyatakannya secara eksplisit. Mempertahankan kata ganti menghindari kepastian tafsir yang melebihi teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Kalian” dipakai untuk memperjelas sapaan jamak kepada para murid; “katakanlah” menyampaikan petunjuk dengan alami.
