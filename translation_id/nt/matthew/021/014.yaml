id: MAT.21.14
reference: Matthew 21:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: id
  text: Orang-orang buta dan orang-orang lumpuh datang kepada-Nya di kompleks Bait Allah,[a] lalu Ia menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk kepada kompleks atau kawasan Bait Allah, bukan khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: datang kepada-Nya
  rationale: Kata kerja προσέρχομαι menyatakan gerak mendekati seseorang. “Datang kepada-Nya” alami dalam bahasa Indonesia dan mempertahankan arah gerak yang ditandai oleh αὐτῷ.
- source_word: τυφλοὶ
  choice: orang-orang buta
  rationale: Adjektiva jamak yang dipakai secara substantival ini menunjuk kepada orang yang buta. Bentuk ini jelas, wajar, dan tidak mengubahnya menjadi istilah abstrak.
- source_word: χωλοὶ
  choice: orang-orang lumpuh
  rationale: Adjektiva substantival jamak ini menunjuk kepada orang yang mengalami gangguan berjalan. “Orang-orang lumpuh” merupakan padanan Indonesia yang lazim dan sesuai dengan konteks penyembuhan.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk kepada keseluruhan kawasan atau pelataran Bait Allah, bukan khusus ruang suci bagian dalam. “Kompleks Bait Allah” menyampaikan cakupan ruang itu secara tepat dan mudah dipahami.
- source_word: ἐθεράπευσεν
  choice: Ia menyembuhkan
  rationale: Dalam kisah mukjizat Injil, θεραπεύω berarti memulihkan dari penyakit atau disabilitas. “Menyembuhkan” adalah padanan yang jelas dan lazim.
theological_decisions:
- issue: Lokasi penyembuhan yang dinyatakan oleh ἱερόν
  choice: Yesus menyembuhkan mereka di kompleks Bait Allah.
  alternative: Yesus menyembuhkan mereka di pelataran Bait Allah.
  rationale: ἱερόν biasanya mencakup kawasan Bait Allah secara luas dan tidak menyatakan bahwa mereka masuk ke ruang suci bagian dalam. Terjemahan utama mempertahankan cakupan luas itu tanpa menentukan pelataran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “orang-orang” menjaga kejelasan dua kelompok, sedangkan “lalu” menghubungkan kedatangan mereka dengan tindakan penyembuhan secara alami.
