  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: id
  text: Orang banyak itu berkata[a], “Inilah Nabi Yesus dari Nazaret di Galilea.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang berkata” atau “terus berkata.” Bentuk imperfek kata kerja Yunani dapat menggambarkan perkataan yang sedang berlangsung atau diulang.
    reason: aspectual_alternative
  - marker: b
    text: Atau, “seorang nabi.” Teks Yunani berbunyi “nabi itu,” yang mungkin mencerminkan pengenalan orang banyak terhadap Yesus sebagai seorang tokoh nabi yang dikenal.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Orang banyak itu
  rationale: Bentuk jamak Yunani menunjuk pada kelompok-kelompok orang yang berkumpul. Dalam bahasa Indonesia, 'orang banyak' merupakan ungkapan kolektif yang alami; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan tersendiri di sini.
- source_word: ἔλεγον
  choice: berkata berulang-ulang
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung atau diulang oleh orang banyak. Pilihan ini menyatakan aspek tersebut secara wajar tanpa menyiratkan desakan yang lebih kuat.
- source_word: Οὗτός ἐστιν
  choice: Inilah
  rationale: Ungkapan identifikasi ini diterjemahkan secara ringkas dan idiomatis, sambil mempertahankan penunjukan langsung kepada Yesus.
- source_word: ὁ προφήτης
  choice: Nabi
  rationale: Artikel Yunani memungkinkan identifikasi sebagai sosok nabi yang dikenal atau diharapkan, bukan sekadar salah seorang nabi. Dalam konstruksi Indonesia 'Nabi Yesus', ketakrifan tidak dinyatakan dengan artikel; huruf kapital membantu menandai gelar identifikasional tanpa menjelaskan implikasinya secara berlebihan.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang sudah baku.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: dari Nazaret di Galilea
  rationale: Frasa ini mengidentifikasi asal Yesus. 'Di Galilea' adalah cara Indonesia yang alami untuk menjelaskan letak Nazaret dan menyampaikan hubungan genitif geografis τῆς Γαλιλαίας.
theological_decisions:
- issue: Apakah ὁ προφήτης dipahami secara takrif atau tak takrif
  choice: Nabi
  alternative: seorang nabi
  rationale: Artikel Yunani dipertahankan secara fungsional melalui konstruksi gelar 'Nabi Yesus', sehingga kemungkinan bahwa orang banyak mengenali Yesus sebagai sosok nabi tertentu tetap terbuka. Catatan kaki mempertahankan kemungkinan pemahaman tak takrif tanpa memutuskan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan 'Inilah Nabi Yesus' mempertahankan daya identifikasi teks Yunani. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
