source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: id
  text: Ketika imam-imam kepala dan orang-orang Farisi mendengar perumpamaan-perumpamaan Yesus, mereka menyadari bahwa ia berbicara tentang mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengenai mereka”; maksudnya, mereka mengenali bahwa perumpamaan-perumpamaan itu ditujukan kepada mereka. Terjemahan “menentang mereka” lebih bersifat interpretatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ketika ... mendengar
  rationale: Partisip aoris yang mendahului verba utama secara alami dinyatakan sebagai anak kalimat temporal dalam bahasa Indonesia.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Padanan baku bagi bentuk jamak yang menunjuk pada kalangan pemimpin imamat, bukan beberapa orang yang masing-masing sedang menjabat sebagai imam besar.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Nama kelompok Yahudi ini secara konvensional ditransliterasikan; bentuk ini alami dan mudah dikenali dalam bahasa Indonesia.
- source_word: παραβολὰς
  choice: perumpamaan-perumpamaan
  rationale: Padanan yang mapan dan tepat bagi bentuk jamak, serta mempertahankan kategori sastra ajaran Yesus.
- source_word: αὐτοῦ
  choice: Yesus
  rationale: Pronomina Yunani berarti 'miliknya/yang disampaikan olehnya'; penyebutan kembali nama Yesus membuat rujukan alami dan jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἔγνωσαν
  choice: menyadari
  rationale: Aoris γινώσκω dalam konteks ini menyatakan pengenalan atau sampainya mereka pada suatu kesadaran; 'menyadari' lebih idiomatis daripada 'mengetahui' untuk nuansa tersebut.
- source_word: περὶ αὐτῶν
  choice: tentang mereka
  rationale: περί dengan genitif secara langsung berarti 'tentang/mengenai'; pilihan ini tidak menambahkan arti adversatif 'menentang' yang hanya tersirat dari konteks.
- source_word: λέγει
  choice: ia berbicara
  rationale: Kala kini Yunani dalam isi kesadaran mereka dapat dinyatakan secara alami dengan bentuk tak bertanda waktu dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah terjemahan perlu menyatakan secara eksplisit bahwa perumpamaan Yesus menentang atau mengecam para pemimpin itu
  choice: berbicara tentang mereka
  alternative: berbicara menentang mereka
  rationale: Teks Yunani memakai περὶ αὐτῶν, yaitu 'tentang mereka'. Konteks menunjukkan nada kritik, tetapi terjemahan utama tidak seharusnya memasukkan makna adversatif yang tidak dinyatakan oleh preposisinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mengikuti urutan logis teks Yunani. 'Ia' dipakai untuk Yesus dalam klausa terakhir; kapitalisasi pronomina ilahi tidak diterapkan karena bukan tuntutan teks sumber dan agar gaya tetap netral.
