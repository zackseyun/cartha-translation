  to: Ketika melihat sebatang pohon ara di tepi jalan, Yesus mendekatinya, tetapi tidak menemukan apa-apa pada pohon itu selain daun saja. Lalu Ia berkata kepadanya, “Semoga mulai sekarang tidak ada lagi buah darimu selama-lamanya.” Seketika itu juga pohon ara itu langsung mengering.
  rationale: Revisi hanya memperbaiki daya ujar dan kelancaran bahasa Indonesia. “Semoga” menyatakan nilai jussif/imprekatoris tanpa menafsirkan ucapan itu sebagai ramalan. “Mulai sekarang ... selama-lamanya” menyampaikan gabungan μηκέτι dan εἰς τὸν αἰῶνα. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau ambiguitas sumber yang perlu diberi jangkar dalam terjemahan ini.
