id: MAT.21.19
reference: Matthew 21:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: id
  text: Ketika melihat sebatang pohon ara di tepi jalan, Yesus mendekatinya, tetapi tidak menemukan apa-apa pada pohon itu selain daun saja. Lalu Ia berkata kepadanya, “Semoga mulai sekarang tidak ada lagi buah darimu selama-lamanya.” Seketika itu juga pohon ara itu langsung mengering.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: sebatang pohon ara
  rationale: μίαν memperkenalkan satu pohon tertentu; kata penggolong 'sebatang' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: di tepi jalan
  rationale: Ungkapan lokatif ini paling wajar dipahami sebagai letak pohon di sisi jalan, bukan di atas permukaan jalan.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: mendekatinya
  rationale: Gabungan verba gerak dan preposisi menyatakan gerakan menuju pohon; 'mendekatinya' ringkas dan alami.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: tidak menemukan apa-apa pada pohon itu selain daun saja
  rationale: '''Pada pohon itu'' merupakan ungkapan Indonesia yang alami, sedangkan ''selain daun saja'' mempertahankan penekanan bahwa hanya daun yang ditemukan.'
- source_word: λέγει αὐτῇ
  choice: Ia berkata kepadanya
  rationale: Kala kini historis dialihkan ke bentuk naratif Indonesia tanpa menghilangkan tindakan Yesus yang berbicara langsung kepada pohon.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Jangan pernah lagi ada buah darimu untuk selama-lamanya
  rationale: Terjemahan mempertahankan bentuk larangan/pernyataan kutuk, citra buah yang berasal dari pohon, serta unsur keberlakuan permanen.
- source_word: ἐξηράνθη παραχρῆμα
  choice: Seketika itu juga ... menjadi kering
  rationale: '''Menjadi kering'' menyampaikan perubahan keadaan pohon, dan ''seketika itu juga'' mempertahankan kuatnya makna kesegeraan.'
theological_decisions:
- issue: Daya ujar perkataan Yesus kepada pohon ara
  choice: 'Diterjemahkan sebagai pernyataan larangan atau kutuk: “Jangan pernah lagi ada buah darimu untuk selama-lamanya.”'
  alternative: “Tidak akan pernah lagi ada buah darimu untuk selama-lamanya.”
  rationale: Subjungtif γένηται bersama Μηκέτι mendukung daya jussif atau imprekatoris. Terjemahan tidak mengubahnya menjadi ramalan biasa dan tidak memasukkan penafsiran simbolis pohon ara ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yesus' disebut untuk memperjelas subjek dalam ayat yang berdiri sendiri; sapaan kepada pohon dipertahankan secara literal. Tidak diperlukan catatan kaki karena tidak ada alternatif penting yang perlu ditampilkan dalam teks publikasi ini.
