id: MAT.21.32
reference: Matthew 21:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: id
  text: Sebab Yohanes datang kepadamu menempuh jalan kebenaran[a], tetapi kamu tidak memercayainya. Namun, para pemungut pajak dan para pelacur memercayainya. Bahkan setelah melihat hal itu, kamu tidak juga kemudian berubah pikiran[c] untuk memercayainya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan cara hidup yang benar” atau “di jalan kebenaran.” Frasa Yunani ini dapat menggambarkan cara hidup dan pelayanan Yohanes, atau jalan benar yang diberitakannya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menaruh kepercayaan kepadanya.” Kata kerja Yunani ini dapat berarti percaya atau memercayai seseorang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “kemudian menyesal” atau “kemudian bertobat.” Kata Yunani di sini adalah μεταμέλομαι, bukan μετανοέω yang lebih umum; kata ini secara khusus dapat menyiratkan perubahan pikiran atau penyesalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ Ἰωάννης πρὸς ὑμᾶς
  choice: Sebab Yohanes datang kepadamu
  rationale: Menerjemahkan hubungan penjelas γάρ dengan 'sebab' dan πρός dengan akusatif secara langsung sebagai 'kepada'.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: menempuh jalan kebenaran
  rationale: Mempertahankan metafora ὁδός secara alami dalam bahasa Indonesia sekaligus membiarkan frasa itu mencakup cara hidup, pelayanan, dan jalan benar yang diberitakan Yohanes.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: kamu tidak memercayainya / memercayainya
  rationale: πιστεύω dengan datif menunjuk pada percaya atau menaruh kepercayaan kepada seseorang; bentuk yang sama dipertahankan untuk menonjolkan kontras.
- source_word: οἱ τελῶναι καὶ αἱ πόρναι
  choice: para pemungut pajak dan para pelacur
  rationale: Padanan modern yang langsung dan jelas, dengan artikel jamak direpresentasikan secara wajar oleh 'para'.
- source_word: ἰδόντες
  choice: setelah melihat hal itu
  rationale: Partisip aoris dipahami secara temporal; 'hal itu' memperjelas bahwa yang mereka lihat ialah tanggapan para pemungut pajak dan pelacur.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: kamu tidak juga kemudian berubah pikiran
  rationale: Membedakan μεταμέλομαι dari istilah pertobatan yang lebih lazim, sambil mempertahankan urutan waktu ὕστερον dan daya tekan οὐδέ.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: sehingga memercayainya
  rationale: Infinitif genitif menyatakan hasil atau tujuan perubahan pikiran dalam konteks ini; 'sehingga' menjaga hubungan tanpa memaksakan satu analisis secara berlebihan.
theological_decisions:
- issue: Makna δικαιοσύνη dalam frasa ἐν ὁδῷ δικαιοσύνης
  choice: jalan kebenaran
  alternative: jalan hidup yang benar; jalan keadilan
  rationale: '''Kebenaran'' merupakan padanan Alkitabiah Indonesia yang luas bagi δικαιοσύνη di sini dan mencakup keselarasan moral dengan kehendak Allah; catatan kaki menjaga kemungkinan bahwa frasa menerangkan cara hidup atau jalan yang diberitakan Yohanes.'
- issue: Makna πιστεύω dengan datif αὐτῷ
  choice: memercayainya
  alternative: percaya kepadanya; menaruh kepercayaan kepadanya
  rationale: Bentuk ini menunjuk pada penerimaan terhadap Yohanes dan pesannya tanpa mengimpor rumusan 'beriman di dalam' yang tidak dinyatakan oleh konstruksi Yunani.
- issue: Makna μεταμέλομαι
  choice: berubah pikiran
  alternative: menyesal; bertobat
  rationale: Pilihan ini menjaga perbedaan leksikal dari μετανοέω dan tidak memutuskan apakah penyesalan batin penuh dimaksudkan, meskipun konteksnya jelas menuntut perubahan tanggapan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Kepadamu' mempertahankan sapaan jamak yang secara bentuk tidak dibedakan dalam bahasa Indonesia. Susunan kalimat terakhir mempertahankan penekanan Yunani pada kegagalan para lawan bicara untuk berubah bahkan sesudah melihat tanggapan kelompok yang dipandang rendah.
