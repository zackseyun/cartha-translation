  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: id
  text: Mereka membawa keledai betina itu dan anak keledai itu, lalu meletakkan pakaian luar mereka di atas kedua hewan itu. Kemudian Ia duduk di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia duduk di atas pakaian luar itu,” yang telah diletakkan pada kedua hewan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: membawa
  rationale: Bentuk aoris dari ἄγω dapat berarti membawa atau menuntun. Dalam konteks ini, “membawa” paling alami dan tetap menyampaikan bahwa para murid menghadirkan kedua hewan itu kepada Yesus.
- source_word: τὴν ὄνον
  choice: keledai betina itu
  rationale: ὄνος berarti keledai, dan artikel feminin di sini menunjukkan bahwa hewan tersebut betina. Penyebutan ini juga memperjelas hubungan adegan dengan anak keledai yang disebut sesudahnya.
- source_word: τὸν πῶλον
  choice: anak keledai itu
  rationale: πῶλος menunjuk pada hewan muda; dalam konteks ini hewan tersebut adalah anak keledai. Pilihan ini lebih jelas dalam bahasa Indonesia modern daripada istilah yang dapat mengacu pada anak kuda.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: menaruh pakaian luar mereka di atas kedua keledai itu
  rationale: ἱμάτια adalah pakaian luar. Kata ganti kepunyaan “mereka” disediakan oleh konteks, sedangkan αὐτῶν merujuk secara alami kepada dua hewan yang baru disebut.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Ia duduk di atas semua itu
  rationale: Kata ganti αὐτῶν berbentuk jamak dan dapat merujuk kepada kedua hewan atau kepada pakaian luar yang diletakkan di atasnya. Ungkapan “semua itu” mempertahankan bentuk jamak dan kejanggalan naratif yang ada tanpa menetapkan satu anteseden.
theological_decisions:
- issue: Acuan kata ganti jamak αὐτῶν dalam καὶ ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Mempertahankan acuan terbuka dengan “Ia duduk di atas semua itu”
  alternative: “Ia duduk di atas pakaian luar itu” atau “Ia duduk di atas salah satu keledai itu”
  rationale: Ini merupakan ambiguitas sintaksis dan naratif, bukan persoalan yang perlu diselesaikan secara doktrinal. Teks utama mempertahankan kata ganti jamak, sedangkan catatan kaki memberi penjelasan yang lazim bahwa Yesus duduk di atas pakaian yang telah ditaruh pada hewan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Pakaian luar” dipilih sebagai padanan yang jelas untuk ἱμάτια, sementara pengulangan “keledai itu” menjaga kejelasan dua hewan yang disebut dalam teks Yunani.
