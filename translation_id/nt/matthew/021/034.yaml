  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: id
  text: Ketika musim panen sudah dekat, ia mengutus hamba-hambanya[a] kepada para penggarap[b] untuk mengambil hasil panennya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budaknya.” Kata Yunani doulos dapat berarti “hamba” atau “budak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para petani.” Dalam konteks perumpamaan ini, mereka adalah petani yang menggarap kebun milik orang lain, sehingga dapat dipahami sebagai petani penyewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ketika
  rationale: ὅτε membentuk anak kalimat waktu, sedangkan δέ merupakan penghubung ringan yang dalam bahasa Indonesia wajar dibiarkan tersirat di sini.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: musim panen buah anggur sudah dekat
  rationale: καιρός dalam konteks pertanian menunjuk musim atau waktu yang tepat; τῶν καρπῶν adalah hasil kebun anggur. Penambahan 'panen' membuat hubungan idiomatis dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Dalam konteks pengiriman wakil pemilik kebun, 'mengutus' secara alami menyampaikan tindakan mengirim dengan tugas tertentu.
- source_word: τοὺς δούλους αὐτοῦ
  choice: hamba-hambanya
  rationale: δοῦλος dapat berarti hamba atau budak. 'Hamba' mempertahankan hubungan ketundukan dan fungsi mereka sebagai utusan tanpa memaksakan status hukum secara lebih spesifik.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: kepada para penggarap kebun anggur
  rationale: γεωργός berarti orang yang mengolah tanah. Konteks perumpamaan menunjukkan bahwa mereka menggarap kebun anggur milik orang lain; pilihan ini alami dan tidak memastikan bentuk sewa tertentu yang tidak dinyatakan oleh kata itu sendiri.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: untuk menerima bagian hasil yang menjadi haknya
  rationale: λαβεῖν berarti mengambil atau menerima, dan καρπούς menunjuk hasil kebun. Dalam konteks penggarapan oleh pihak lain, maksudnya adalah memperoleh hasil milik sang pemilik. Kata 'bagian' menjelaskan praktik bagi hasil yang tersirat oleh konteks, sedangkan catatan kaki menjaga bentuk harfiahnya.
