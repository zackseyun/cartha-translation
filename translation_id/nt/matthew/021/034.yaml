review_pass:
  verdict: revise
  source_fidelity: 'Draf menambahkan beberapa rincian yang tidak dinyatakan secara langsung oleh teks Yunani: «buah anggur», «bagian», dan «yang menjadi haknya». Walaupun kebun anggur dan hak pemilik jelas dari konteks perumpamaan yang lebih luas, ayat ini sendiri hanya menyebut musim buah/hasil dan pengambilan buah-buah miliknya. Selain itu, catatan b keliru menyebut bentuk harfiah «dari para penggarap»; πρὸς berarti bahwa para hamba diutus kepada para penggarap, bukan bahwa buah itu secara gramatikal diterima ‘dari’ mereka.'
  naturalness: «Ketika musim panen sudah dekat» dan «untuk mengambil hasil panennya» adalah bahasa Indonesia modern yang alami, padat, dan menyampaikan hubungan pertanian dalam ayat tanpa penambahan penafsiran kontraktual.
  terminology: «Hamba-hambanya» dapat dipertahankan dengan alternatif «budak-budaknya» dalam catatan kaki untuk δοῦλοι. «Para penggarap» merupakan padanan yang wajar bagi γεωργοί; kemungkinan ‘petani penyewa’ dapat dicatat sebagai penjelasan kontekstual, bukan sebagai arti harfiah yang dipaksakan.
  issues:
  - severity: medium
    issue: Penambahan «buah anggur»
    rationale: Kata καρποί berarti buah/hasil, tetapi tidak secara leksikal menyebut anggur dalam ayat ini. Konteks memang sebuah kebun anggur, namun terjemahan ayat sebaiknya tidak menambahkan spesifikasi tersebut.
  - severity: high
    issue: Penambahan «bagian hasil yang menjadi haknya»
    rationale: λαμβάνειν τοὺς καρποὺς αὐτοῦ berarti mengambil/menerima buah-buah atau hasilnya. «Bagian» dan «yang menjadi haknya» menafsirkan pengaturan bagi hasil dan hak kontraktual yang tidak diungkapkan dalam bentuk tersebut.
  - severity: medium
    issue: Catatan kaki b tidak tepat secara gramatikal
    rationale: 'Catatan itu mengklaim bentuk harfiah «untuk menerima buah-buahnya dari para penggarap», padahal πρὸς τοὺς γεωργούς melekat pada ἀπέστειλεν: ia mengutus kepada para penggarap.'
  revised_text: Ketika musim panen sudah dekat, ia mengutus hamba-hambanya[a] kepada para penggarap[b] untuk mengambil hasil panennya.
