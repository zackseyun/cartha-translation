- from: Ketika musim panen buah anggur sudah dekat, ia mengutus hamba-hambanya[a] kepada para penggarap kebun anggur[b] untuk menerima bagian hasil yang menjadi haknya.
  to: Ketika musim panen sudah dekat, ia mengutus hamba-hambanya[a] kepada para penggarap[b] untuk mengambil hasil panennya.
  rationale: Revisi menghilangkan spesifikasi anggur serta penafsiran mengenai bagian dan hak pemilik, lalu menerjemahkan καρποί secara idiomatis sebagai «hasil panen». Catatan b diperbaiki agar tidak salah menggambarkan susunan Yunani, sambil tetap menyampaikan nuansa kontekstual para penggarap sebagai petani penyewa.
