base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: id
  text: Ia menjawab, “Aku tidak mau.” Namun, kemudian ia berubah pikiran[a] dan pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyesal” atau “menarik kembali keputusannya.” Kata Yunani ini dapat mencakup penyesalan yang menghasilkan perubahan sikap dan tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dia menjawab
  rationale: Partisip aoris ini merupakan rumusan naratif yang wajar diterjemahkan sebagai verba finit dalam bahasa Indonesia, tanpa kehilangan makna.
- source_word: Οὐ θέλω
  choice: Aku tidak mau
  rationale: Ungkapan ini menyatakan ketidakinginan atau ketidakbersediaan secara langsung. ‘Aku tidak mau’ alami dalam bahasa Indonesia dan tidak sekeras ‘Aku tidak akan pergi.’
- source_word: ὕστερον
  choice: kemudian
  rationale: Adverbia ini menunjukkan tindakan yang terjadi sesudah penolakan; ‘kemudian’ ringkas dan alami dalam narasi.
- source_word: μεταμεληθεὶς
  choice: berubah pikiran
  rationale: Kata ini dapat mencakup penyesalan yang menghasilkan perubahan sikap. Dalam konteks ini, ‘berubah pikiran’ mempertahankan fokus pada pembalikan keputusan tanpa mempersempitnya menjadi istilah teologis ‘bertobat.’
- source_word: ἀπῆλθεν
  choice: lalu pergi
  rationale: Dalam konteks perumpamaan, ia pergi untuk melakukan permintaan ayahnya. ‘Lalu pergi’ menyampaikan tindakan berikutnya dengan alami tanpa menambahkan tujuan yang tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Makna μεταμεληθεὶς dalam konteks perumpamaan
  choice: berubah pikiran
  alternative: menyesal; mengurungkan penolakannya; bertobat
  rationale: Ayat ini menekankan perubahan dari penolakan kepada tindakan. ‘Berubah pikiran’ tidak meniadakan unsur penyesalan, tetapi menghindari penetapan nuansa pertobatan teologis yang lebih khusus daripada yang diwajibkan oleh kata Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ‘dia’ dipakai untuk narasi, sedangkan ‘Aku’ mempertahankan bentuk orang pertama dalam kutipan langsung. Struktur partisip Yunani dialihkan menjadi rangkaian verba yang alami dalam bahasa Indonesia.
