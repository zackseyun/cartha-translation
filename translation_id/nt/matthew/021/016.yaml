reference: Matthew 21:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: id
  text: Lalu mereka berkata kepada-Nya, “Apakah Engkau mendengar apa yang dikatakan anak-anak ini?” Yesus berkata kepada mereka, “Ya. Belum pernahkah kalian membaca, ‘Dari mulut anak-anak kecil dan bayi-bayi yang masih menyusu Engkau telah menyediakan pujian’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesus mengutip Mazmur 8:2 menurut tradisi Kitab Suci Yunani. Teks Ibraninya lazim diterjemahkan, “Dari mulut anak-anak kecil dan bayi-bayi yang masih menyusu Engkau telah menegakkan kekuatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Apakah Engkau mendengar
  rationale: Bentuk kini dalam pertanyaan langsung diterjemahkan secara lugas dan mempertahankan nada tantangan kepada Yesus.
- source_word: τί οὗτοι λέγουσιν
  choice: apa yang mereka katakan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan tindakan yang sedang berlangsung; kata ganti 'mereka' cukup merujuk kepada orang-orang yang dimaksud tanpa menambahkan nomina.
- source_word: λέγει
  choice: Yesus berkata
  rationale: Bahasa Indonesia lazim memakai bentuk lampau netral dalam alur narasi; pilihan ini tetap menyampaikan pergantian penutur tanpa kekakuan dari pemindahan harfiah kala kini historis Yunani.
- source_word: Ναί
  choice: Ya
  rationale: Jawaban afirmatif yang paling langsung dan alami.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Belum pernahkah kalian membaca
  rationale: Pertanyaan retoris ini terdengar alami dalam bahasa Indonesia serta mempertahankan teguran mengenai ketidakakraban mereka dengan Kitab Suci.
- source_word: Ἐκ στόματος
  choice: Dari mulut
  rationale: Mencerminkan frasa preposisional Yunani secara dekat dan wajar dalam kutipan puitis Indonesia.
- source_word: νηπίων
  choice: anak-anak kecil
  rationale: Menunjukkan anak yang masih sangat muda, tetapi tetap membedakannya dari θηλαζόντων, yakni bayi yang masih menyusu.
- source_word: θηλαζόντων
  choice: bayi-bayi yang masih menyusu
  rationale: Menyatakan secara jelas dan modern mereka yang sedang menyusu serta mempertahankan gambaran konkret teks.
- source_word: κατηρτίσω
  choice: Engkau telah menyediakan
  rationale: Menyampaikan tindakan menyiapkan atau menghasilkan sebagaimana bunyi kutipan Yunani dalam Matius, tanpa menggantinya dengan bacaan Ibrani 'menegakkan kekuatan'.
- source_word: αἶνον
  choice: puji-pujian
  rationale: Padanan Indonesia yang alami bagi nomina abstrak 'pujian' dalam konteks ungkapan pujian yang keluar dari mulut anak-anak.
theological_decisions:
- issue: Bunyi kutipan Mazmur dalam argumen Yesus
  choice: Memakai bunyi teks Yunani Matius, 'Engkau telah menyediakan puji-pujian,' dalam teks utama
  alternative: Mengikuti bunyi teks Ibrani Mazmur 8:2, 'Engkau telah menegakkan kekuatan'
  rationale: Terjemahan harus menyajikan kutipan sebagaimana terdapat dalam teks Yunani Matius, bukan menyelaraskannya secara diam-diam dengan teks Ibrani. Perbedaan yang penting bagi pembaca dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan kepada Yesus memakai 'Engkau' dan akhiran '-Nya'; sapaan kepada para pemimpin memakai 'kalian' agar bentuk jamaknya jelas dan tetap alami. Kutipan Mazmur dipertahankan agak puitis.
