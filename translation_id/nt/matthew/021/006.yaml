  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: id
  text: Lalu murid-murid itu pergi dan melakukan seperti yang Yesus perintahkan kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti yang Yesus instruksikan kepada mereka.” Kata kerja Yunani ini dapat berarti memberi perintah atau petunjuk; dalam konteks ini keduanya dimungkinkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan berikutnya; dalam narasi Indonesia, bentuk verba berurutan 'pergi dan melakukan' lebih alami daripada konstruksi harfiah 'setelah pergi'.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel δέ melanjutkan alur narasi dan di sini paling wajar dinyatakan dengan 'Lalu', yang menunjukkan respons para murid terhadap arahan sebelumnya.
- source_word: οἱ μαθηταὶ
  choice: murid-murid itu
  rationale: '''Murid-murid'' merupakan padanan baku μαθηταί dalam Injil, sedangkan ''itu'' menandai kelompok yang sudah diketahui dari konteks.'
- source_word: ποιήσαντες
  choice: melakukan
  rationale: Partisip aoris kedua dikoordinasikan dengan πορευθέντες. 'Melakukan' mempertahankan makna umum ποιέω dan berpadu alami dengan klausa 'tepat seperti...'.
- source_word: καθὼς
  choice: tepat seperti
  rationale: καθώς menyatakan kesesuaian tindakan para murid dengan arahan Yesus; 'tepat seperti' menegaskan kesesuaian itu tanpa menambah gagasan baru.
- source_word: συνέταξεν
  choice: diperintahkan
  rationale: συντάσσω dapat berarti memberi perintah atau petunjuk. Dalam konstruksi Indonesia ini, 'diperintahkan ... kepada mereka' menyampaikan otoritas arahan Yesus secara alami, sambil mencatat alternatif yang lebih lunak dalam catatan kaki.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif berfungsi sebagai penerima perintah dan secara alami diterjemahkan 'kepada mereka'.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri dengan artikel ini secara wajar diterjemahkan cukup sebagai 'Yesus'.
