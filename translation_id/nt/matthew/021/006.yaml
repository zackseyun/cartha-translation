  source_fidelity: Teks Yunani menyatakan bahwa para murid pergi lalu bertindak sesuai dengan arahan Yesus. Terjemahan mempertahankan urutan naratif ini dan makna συντάσσω sebagai memberi perintah atau petunjuk. Partisip-partisip aoris diterjemahkan secara idiomatis sebagai rangkaian tindakan, tanpa memaksakan urutan waktu yang berlebihan.
  naturalness: Frasa draf “melakukan tepat seperti yang diperintahkan Yesus kepada mereka” dapat dipahami, tetapi susunan “seperti yang Yesus perintahkan kepada mereka” lebih lancar dalam bahasa Indonesia modern. Kata “tepat” tidak diperlukan untuk menyampaikan καθώς dan dapat terdengar agak kaku dalam konstruksi ini.
