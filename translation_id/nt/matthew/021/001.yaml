id: MAT.21.1
reference: Matthew 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: id
  text: Ketika mereka mendekati Yerusalem dan tiba di Betfage, di Bukit Zaitun[a], Yesus kemudian mengutus dua orang murid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke Bukit Zaitun”; frasa ini dapat menunjukkan arah perjalanan atau menerangkan letak Betfage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: mendekati
  rationale: Bentuk aoris dari ἐγγίζω menyatakan gerak mendekat secara fisik. “Mendekati” alami dalam bahasa Indonesia dan tidak menyatakan bahwa mereka sudah memasuki Yerusalem.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: ἦλθον
  choice: tiba
  rationale: Secara dasar berarti “datang”, tetapi dalam rangkaian perjalanan ini “tiba” membedakannya secara wajar dari tindakan mendekati Yerusalem dan menyatakan bahwa mereka mencapai Betfage.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Transliterasi nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: di Bukit Zaitun
  rationale: Dalam rangkaian geografis ini frasa tersebut menempatkan Betfage di kawasan Bukit Zaitun. “Di” lebih alami daripada terjemahan harfiah “ke” dan tidak memberi kesan bahwa bukit itu sendiri dimasuki.
- source_word: τότε
  choice: pada saat itu
  rationale: Mempertahankan penanda peralihan waktu dalam narasi secara jelas dan alami.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Menyatakan bahwa Yesus menyuruh para murid pergi untuk melaksanakan tugas; “mengutus” merupakan padanan naratif yang wajar dan bermartabat.
- source_word: δύο μαθητὰς
  choice: dua orang murid
  rationale: “Murid” adalah padanan baku μαθητής dalam kisah Injil, sedangkan penggolong “orang” menghasilkan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Subjek tersirat pada kata kerja jamak sebelum nama Yesus disebut
  choice: Memakai pronomina “mereka” tanpa menambahkan “Yesus dan murid-murid-Nya”.
  alternative: Menulis secara eksplisit “Yesus dan murid-murid-Nya mendekati Yerusalem”.
  rationale: Teks Yunani memakai subjek jamak yang tersirat dan baru menyebut Yesus secara eksplisit pada klausa utama. Pilihan ini mempertahankan kehematan naratif dan tidak menambahkan identifikasi yang tidak dinyatakan dalam ayat.
- issue: Hubungan geografis Betfage dengan Bukit Zaitun
  choice: Menerjemahkan “di Bukit Zaitun” dalam teks utama sambil mencatat bentuk harfiahnya.
  alternative: Menerjemahkan “ke Bukit Zaitun” atau “menuju Bukit Zaitun”.
  rationale: Preposisi εἰς biasanya menunjukkan arah, tetapi di sini frasa tersebut paling mungkin menerangkan lokasi Betfage. Catatan kaki mempertahankan kemungkinan pembacaan arah tanpa memaksakan penyelesaian atas susunan Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan narasi Yunani, tetapi memakai “tiba” dan “di” agar hubungan gerak serta lokasi terdengar alami bagi pembaca umum.
