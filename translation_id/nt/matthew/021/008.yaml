  - marker: b
    text: Atau “mantel mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Sebagian besar orang dalam kerumunan itu
  rationale: πλεῖστος dengan nomina kolektif menunjuk pada mayoritas atau bagian terbesar dari kerumunan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak terdapat dalam teks Yunani.
- source_word: ἔστρωσαν
  choice: menghamparkan
  rationale: Kata ini menggambarkan tindakan membentangkan atau menaruh pakaian di permukaan jalan; “menghamparkan” tepat dan jelas dalam konteks ini.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: pakaian luar mereka
  rationale: ἱμάτια lazim menunjuk pada pakaian, khususnya pakaian luar, sedangkan kata ganti refleksif menunjukkan bahwa pakaian itu milik mereka sendiri. Dalam bahasa Indonesia, “mereka” sudah menyampaikan kepemilikan itu secara alami.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Dalam konteks benda yang dihamparkan pada permukaan jalan, “di jalan” merupakan ungkapan bahasa Indonesia yang alami dan tetap menunjuk pada lokasi fisik.
- source_word: ἄλλοι δὲ
  choice: sedangkan yang lain
  rationale: Ungkapan ini memperkenalkan kelompok lain dalam kerumunan. “Sedangkan” menandai peralihan ringan tanpa memberi kesan pertentangan yang kuat.
- source_word: ἔκοπτον
  choice: sedang memotong
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam adegan tersebut; “sedang memotong” mempertahankan aspek itu.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: dahan-dahan dari pepohonan
  rationale: κλάδους berarti cabang atau dahan, dan ἀπό menunjukkan bahwa dahan-dahan itu dipotong dari pohon. “Dahan” lebih tepat daripada “ranting” yang biasanya lebih kecil.
- source_word: καὶ ἐστρώννυον
  choice: dan menghamparkannya
  rationale: Kata kerja imperfek kedua melanjutkan gambaran tindakan yang berlangsung. Dalam koordinasi dengan “sedang memotong,” bentuk ini alami dan tetap berada dalam cakupan aspek progresif.
