  source_fidelity: 'Terjemahan pada dasarnya setia kepada teks Yunani: πλεῖστος ὄχλος diterjemahkan sebagai mayoritas kerumunan; ἱμάτια sebagai pakaian luar; dan pengulangan ἐν τῇ ὁδῷ dipertahankan. Bentuk imperfek pada tindakan kelompok kedua tersampaikan secara wajar melalui “sedang memotong ... dan menghamparkannya.” Namun, δέ pada ἄλλοι δέ lebih baik diterjemahkan secara aditif dengan “dan,” bukan “sedangkan,” yang dapat memberi nuansa perbandingan atau pertentangan yang tidak diperlukan.'
  naturalness: Bahasa Indonesia draft jelas dan modern. Penggantian “sedangkan yang lain” menjadi “dan yang lain” lebih lancar dalam alur naratif dan lebih dekat dengan hubungan antarklausa dalam sumber. “Menghamparkan” dan “di jalan” sama-sama alami dalam konteks ini.
  terminology: “Kerumunan itu,” “pakaian luar mereka,” dan “dahan-dahan” merupakan pilihan yang tepat. Catatan kaki untuk ἱμάτια sebaiknya memakai alternatif yang lebih dekat dengan makna pakaian luar atau selubung luar daripada “jubah,” karena “jubah” dalam pemakaian Indonesia lazimnya menunjuk jenis pakaian panjang tertentu.
