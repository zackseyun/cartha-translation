  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: id
  text: Sebagian besar orang dalam kerumunan itu[a] menghamparkan pakaian luar mereka[b] di jalan, dan yang lain sedang memotong dahan-dahan dari pepohonan dan menghamparkannya di jalan.
  philosophy: optimal-equivalence
  footnotes:
