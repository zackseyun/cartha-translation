translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “di jalan” dipertahankan karena terdapat dalam teks Yunani dan menegaskan tindakan kedua kelompok. Istilah “kerumunan” dipilih agar ὄχλος mudah dipahami oleh pembaca masa kini.
