  naturalness: Bahasanya baku, jelas, dan lancar untuk narasi Alkitab Indonesia modern. Pemakaian «kalian» secara konsisten menandai alamat jamak. «Tertambat» dan «anak keledai» mudah dipahami serta sesuai register.
  terminology: «Keledai betina» dan «anak keledai» menyampaikan informasi leksikal dan gramatikal tanpa memaksakan hubungan induk-anak lebih jauh daripada yang tersirat. Kapitalisasi «-Ku» konsisten dengan konvensi penerbitan Alkitab Indonesia. Catatan kaki b dan c akurat serta jangkar catatan kaki ditempatkan pada unsur yang relevan.
