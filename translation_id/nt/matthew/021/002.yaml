  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: id
  text: berkata kepada mereka, “Pergilah ke desa yang ada di seberang kalian[a]. Kalian akan segera menemukan seekor keledai betina yang tertambat dan seekor anak keledai bersamanya[b]. Lepaskanlah keduanya, lalu bawalah kepada-Ku.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang ada di hadapan kalian.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “anak keledai” berarti seekor hewan muda; konteks menunjukkan bahwa hewan itu adalah keledai.
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah, bahasa Yunani memakai sebuah partisipel, “setelah melepaskan,” yang diikuti perintah “bawalah.” Dalam bahasa Indonesia, urutan itu secara alami dinyatakan sebagai dua perintah: “Lepaskanlah keduanya, lalu bawalah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: berkata kepada mereka
  rationale: Mempertahankan bentuk partisipel yang mengantar perkataan Yesus dan menghubungkannya dengan konteks ayat sebelumnya.
- source_word: Πορεύεσθε
  choice: Pergilah
  rationale: Imperatif ini secara alami menyatakan perintah untuk pergi dalam narasi.
- source_word: κώμην
  choice: desa
  rationale: κώμη menunjuk pada permukiman yang lebih kecil daripada kota; “desa” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: κατέναντι ὑμῶν
  choice: yang ada di seberang kalian
  rationale: Ungkapan ini menyatakan letak desa di hadapan atau berseberangan dengan para murid; “di seberang kalian” alami sekaligus mempertahankan gambaran ruangnya.
- source_word: εὐθέως
  choice: segera
  rationale: Mempertahankan daya temporal εὐθέως tanpa membuat kalimat terasa kaku.
- source_word: ὄνον δεδεμένην
  choice: seekor keledai betina yang tertambat
  rationale: Bentuk feminin dan kata ganti αὐτῆς mendukung penyebutan keledai betina, sedangkan “tertambat” secara alami menggambarkan hewan yang berada dalam keadaan terikat.
- source_word: πῶλον
  choice: seekor anak keledai
  rationale: πῶλος berarti hewan muda; konteks keledai betina memastikan bahwa yang dimaksud ialah anak keledai. Padanan ini lebih langsung bagi pembaca Indonesia daripada istilah khusus yang dapat kabur.
- source_word: μετ’ αὐτῆς
  choice: bersamanya
  rationale: Mempertahankan rujukan feminin tunggal kepada keledai betina tanpa menyatakan secara eksplisit hubungan induk-anak yang hanya tersirat.
- source_word: λύσαντες
  choice: Lepaskanlah keduanya
  rationale: Partisipel aoris ini menyatakan tindakan yang mendahului perintah berikutnya. Bentuk perintah koordinatif alami dalam bahasa Indonesia; “keduanya” memperjelas bahwa kedua hewan harus dilepaskan.
- source_word: ἀγάγετέ μοι
  choice: lalu bawalah kepada-Ku
  rationale: ἄγω dapat berarti membawa atau menuntun. “Bawalah” alami dalam konteks ini, sementara “lalu” menunjukkan urutan tindakan yang terkandung dalam konstruksi Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “kalian” dipakai karena ὑμῶν jamak dan menghindari ketidakjelasan jumlah pada “kamu”. Kapital pada “-Ku” mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus dalam penerbitan Alkitab bahasa Indonesia.
