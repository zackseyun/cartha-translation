  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: id
  text: Pagi-pagi sekali, ketika Yesus sedang kembali ke kota, ia mulai merasa lapar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Pagi-pagi
  rationale: Menunjukkan waktu pada bagian awal hari dan terdengar alami dalam narasi bahasa Indonesia modern.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung ringan dalam kelanjutan narasi; urutan kalimat bahasa Indonesia sudah menyampaikan peralihan tersebut tanpa perlu menambahkan kata penghubung.
- source_word: ἐπανάγων
  choice: ketika ... sedang kembali
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan verba utama; bentuk ini mempertahankan hubungan waktunya secara alami.
- source_word: εἰς τὴν πόλιν
  choice: ke kota
  rationale: Menyatakan gerak menuju kota tanpa harus menyiratkan bahwa ia sudah tiba atau masuk ke dalamnya.
- source_word: ἐπείνασεν
  choice: ia merasa lapar
  rationale: Mengungkapkan timbulnya rasa lapar secara wajar dalam bahasa Indonesia; pilihan ini lebih idiomatis daripada bentuk harfiah seperti 'menjadi lapar'.
theological_decisions:
- issue: Implikasi kristologis dari rasa lapar Yesus
  choice: Pernyataan diterjemahkan secara langsung sebagai pengalaman lapar yang nyata.
  alternative: Menguraikan atau melemahkan rasa lapar sebagai ungkapan kiasan.
  rationale: Narasi menyatakan pengalaman manusiawi Yesus dengan lugas. Terjemahan tidak menambah penjelasan doktrinal dan tidak mengurangi kenyataan pengalaman tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek yang tersirat dalam bentuk verba Yunani karena ayat ini disajikan secara mandiri; pronomina 'ia' mengikuti gaya naratif umum.
