  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: id
  text: Namun, ketika para penggarap kebun anggur itu melihat anak itu, mereka berkata di antara mereka, “Inilah ahli warisnya. Mari kita bunuh dia dan kuasai warisannya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kita miliki warisannya”; dalam konteks ini maksudnya ialah mengambil warisan itu menjadi milik mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: para penggarap kebun anggur
  rationale: Dalam konteks perumpamaan, mereka menggarap kebun anggur milik orang lain. Pilihan ini menyatakan pekerjaan mereka secara alami tanpa menambahkan rincian sistem sewa yang tidak dinyatakan langsung oleh kata Yunani.
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat waktu untuk menyampaikan urutan tindakan secara wajar dalam bahasa Indonesia.
- source_word: τὸν υἱὸν
  choice: anak tersebut
  rationale: Bahasa Yunani memakai artikel tanpa kata milik eksplisit. 'Anak tersebut' merujuk kembali secara jelas kepada anak dalam cerita tanpa menambahkan identifikasi Kristologis ke dalam teks.
- source_word: ἐν ἑαυτοῖς
  choice: satu sama lain
  rationale: Dalam kelompok jamak ini, ungkapan tersebut menunjukkan percakapan internal di antara para penggarap.
- source_word: κληρονόμος
  choice: ahli waris
  rationale: '''Ahli waris'' adalah padanan Indonesia yang baku dan alami serta mempertahankan pengertian hukum mengenai warisan.'
- source_word: δεῦτε
  choice: Mari
  rationale: Kata ini berfungsi sebagai ajakan untuk melakukan tindakan berikutnya; 'Mari' mengungkapkan fungsi tersebut secara idiomatis.
- source_word: ἀποκτείνωμεν
  choice: kita bunuh
  rationale: Subjungtif ajakan diterjemahkan secara alami bersama 'Mari'; 'bunuh' mempertahankan arti langsung tanpa memberi nuansa penghukuman resmi.
- source_word: σχῶμεν
  choice: kita kuasai
  rationale: Secara harfiah verba ini berarti 'kita miliki/peroleh', tetapi dalam konteks pembunuhan ahli waris maksudnya adalah mengambil warisan itu menjadi milik mereka. 'Kuasai' menyampaikan perebutan kepemilikan tanpa sekeras 'rampas'.
- source_word: κληρονομίαν αὐτοῦ
  choice: warisannya
  rationale: Pilihan ini menerjemahkan baik 'warisan' maupun pronomina 'miliknya' dan mempertahankan hubungan dengan sebutan 'ahli waris'.
theological_decisions:
- issue: Rujukan perumpamaan kepada sang anak
  choice: Mempertahankan sebutan pada tingkat cerita sebagai 'anak tersebut'.
  alternative: Menerjemahkan secara interpretatif sehingga secara eksplisit mengidentifikasi anak itu sebagai Yesus.
  rationale: Dalam konteks Injil Matius, anak itu menunjuk kepada Yesus, tetapi ayat ini sendiri tetap berada pada tingkat cerita perumpamaan. Terjemahan tidak menyisipkan identifikasi teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan dialog dibuat alami, sementara hubungan hukum antara ahli waris dan warisan tetap jelas. Penanda catatan kaki ditempatkan setelah bagian yang diterangkannya.
