id: MAT.21.12
reference: Matthew 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: id
  text: Lalu Yesus masuk ke pelataran Bait Allah dan mengusir semua orang yang berjual beli di sana.[a] Ia membalikkan meja-meja para penukar uang dan kursi-kursi para penjual burung merpati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah” atau “kompleks Bait Allah”; kata Yunani yang dipakai menunjuk pada seluruh kawasan Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: pelataran Bait Allah
  rationale: Kata ini menunjuk pada kompleks Bait Allah secara luas, bukan secara khusus ruang kudus bagian dalam (ναός). Dalam konteks kegiatan jual beli, 'pelataran Bait Allah' menyampaikan lokasi yang dimaksud secara alami dan tepat.
- source_word: ἐξέβαλεν
  choice: mengusir
  rationale: Kata kerja ini menyatakan tindakan mengeluarkan dengan tegas atau paksa. 'Mengusir' merupakan padanan Indonesia modern yang lugas dan kuat.
- source_word: πάντας
  choice: semua orang
  rationale: Padanan ini mempertahankan cakupan eksplisit πάντας terhadap orang-orang yang sedang berjual beli.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: orang yang berjual beli
  rationale: '''Berjual beli'' adalah ungkapan Indonesia yang alami dan mencakup kedua kelompok, yakni penjual dan pembeli, tanpa menghilangkan salah satunya.'
- source_word: τράπεζας
  choice: meja-meja
  rationale: Makna biasa kata ini adalah meja; bentuk ulang menandai jamak secara alami dalam bahasa Indonesia.
- source_word: κολλυβιστῶν
  choice: para penukar uang
  rationale: Istilah ini menunjuk kepada orang yang menukarkan mata uang atau koin. 'Para penukar uang' jelas dan lazim dalam konteks Bait Allah.
- source_word: κατέστρεψεν
  choice: membalikkan
  rationale: Dalam konteks meja, kata ini berarti menjungkirkan atau membalikkan. Pilihan ini hidup dan tidak menyiratkan bahwa meja-meja itu dihancurkan.
- source_word: καθέδρας
  choice: bangku-bangku
  rationale: Kata ini berarti tempat duduk. 'Bangku-bangku' alami untuk tempat duduk para pedagang dalam latar ini, sementara 'kursi-kursi' juga mungkin.
- source_word: περιστεράς
  choice: burung merpati
  rationale: περιστερά dapat menunjuk merpati atau dara. 'Burung merpati' adalah istilah modern yang jelas dan sesuai dengan konteks hewan persembahan.
theological_decisions:
- issue: Cakupan ἱερόν sehubungan dengan tindakan Yesus
  choice: Yesus masuk ke pelataran dalam kompleks Bait Allah, bukan dinyatakan masuk ke ruang kudus bagian dalam.
  alternative: Menerjemahkannya secara umum sebagai 'Bait Allah' tanpa memperinci pelatarannya.
  rationale: Pembedaan leksikal antara ἱερόν dan ναός penting secara historis dan spasial. 'Pelataran Bait Allah' menghindari kesan bahwa Yesus memasuki ruang kudus bagian dalam, tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Bait Allah' dipertahankan sebagai istilah yang dikenal luas; 'pelataran' memperjelas lokasi historis. Pengulangan 'di pelataran Bait Allah' pada klausa kedua dipadatkan menjadi 'di sana' agar alami tanpa mengubah rujukan.
