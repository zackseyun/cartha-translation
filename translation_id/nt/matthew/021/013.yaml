id: MAT.21.13
reference: Matthew 21:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Ada tertulis[a], ‘Rumah-Ku akan disebut rumah doa,’ tetapi kalian menjadikannya sarang para perampok[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesus menggabungkan Yesaya 56:7 dengan Yeremia 7:11.
    reason: cross_reference
  - marker: b
    text: Atau “para penyamun” atau “para bandit.” Istilah Yunani ini dapat merujuk kepada perampok atau penyamun yang melakukan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani menyemarakkan narasi, tetapi dalam narasi bahasa Indonesia modern bentuk tak bertanda “berkata” lebih alami dan tidak menentukan waktu secara morfologis.
- source_word: Γέγραπται
  choice: Ada tertulis
  rationale: Ungkapan baku untuk formula kutipan Kitab Suci dalam bentuk perfektif pasif, yang menyiratkan bahwa teks itu telah tertulis dan tetap berlaku.
- source_word: οἶκός μου
  choice: Rumah-Ku
  rationale: Mempertahankan metafora harfiah “rumah” dan gema kutipan Yesaya, tanpa mempersempitnya secara interpretatif menjadi “Bait Allah-Ku”.
- source_word: οἶκος προσευχῆς
  choice: rumah doa
  rationale: Padanan Indonesia yang alami dan ringkas bagi konstruksi genitif, sekaligus mempertahankan ungkapan kitabiah.
- source_word: κληθήσεται
  choice: akan disebut
  rationale: Menyampaikan bentuk futur pasif secara langsung dan wajar.
- source_word: ποιεῖτε
  choice: kalian menjadikannya
  rationale: Menyampaikan tindakan para lawan bicara yang sedang berlangsung; “menjadikannya” alami dalam bahasa Indonesia dan dekat dengan makna ποιέω.
- source_word: σπήλαιον
  choice: sarang
  rationale: Dalam konteks ini menunjuk tempat persembunyian atau markas para penyamun, bukan sekadar gua fisik; “sarang” juga mempertahankan daya tuduhan profetis.
- source_word: λῃστῶν
  choice: para perampok
  rationale: Padanan umum yang alami; catatan kaki mempertahankan kemungkinan arti yang lebih keras, yakni penyamun atau bandit bersenjata.
theological_decisions:
- issue: Kutipan dan alusi Perjanjian Lama
  choice: Mempertahankan ungkapan “Rumah-Ku ... rumah doa” dan “sarang para perampok” agar kaitan dengan Yesaya 56:7 dan Yeremia 7:11 tetap tampak.
  alternative: Menggunakan parafrasa modern yang mengaburkan hubungan antarteks.
  rationale: Ucapan Yesus menggabungkan bahasa dari kedua teks Kitab Suci itu; mempertahankan gemanya penting bagi transparansi teologis.
- issue: Cakupan makna λῃστῶν
  choice: Teks utama memakai “para perampok”, dengan alternatif “penyamun” atau “bandit” dalam catatan kaki.
  alternative: Menetapkan “bandit bersenjata” dalam teks utama.
  rationale: Istilah Yunani dapat merujuk baik kepada perampok maupun penyamun yang melakukan kekerasan; terjemahan utama tetap umum tanpa meniadakan nuansa alternatif.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. “Kalian” dipakai karena Yesus berbicara kepada sekelompok orang dan bentuk ini alami bagi pembaca umum. Kapital pada “Rumah-Ku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Allah.
