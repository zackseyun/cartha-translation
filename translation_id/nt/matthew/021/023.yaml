id: MAT.21.23
reference: Matthew 21:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: id
  text: Ketika Yesus masuk ke kompleks Bait Allah[a], imam-imam kepala dan para tua-tua bangsa itu mendekati-Nya saat Ia sedang mengajar. Mereka bertanya, “Dengan wewenang apa Engkau melakukan semua ini? Siapa yang memberi-Mu wewenang itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang digunakan di sini menunjuk seluruh kompleks atau kawasan Bait Allah, termasuk pelatarannya, bukan secara khusus ruang kudus di bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Ketika Yesus masuk
  rationale: Genitivus absolutus ini menyatakan keadaan yang menyertai dengan nuansa waktu. Nama “Yesus” dipakai secara alami dalam bahasa Indonesia untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: ἱερὸν
  choice: kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam (ναός). Pilihan ini menghindari kesan bahwa Yesus memasuki tempat kudus yang hanya boleh dimasuki imam.
- source_word: προσῆλθον αὐτῷ
  choice: mendekati-Nya
  rationale: Ungkapan ini secara langsung dan wajar menyampaikan tindakan datang menghampiri Yesus.
- source_word: διδάσκοντι
  choice: saat Ia sedang mengajar
  rationale: Partisipel kini menunjukkan bahwa kegiatan mengajar berlangsung bersamaan dengan tindakan para pemimpin mendekati Yesus.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk para pemimpin kalangan imam, bukan beberapa orang yang sekaligus menjabat sebagai Imam Besar.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: para tua-tua bangsa itu
  rationale: Frasa ini menunjuk para pemimpin awam yang diakui di antara bangsa Israel; “bangsa itu” mempertahankan hubungan definit dengan λαοῦ dalam konteks naratif.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Dengan wewenang apa
  rationale: ἐξουσία di sini berkaitan dengan dasar atau hak yang sah untuk bertindak. “Wewenang” alami dalam bahasa Indonesia dan menonjolkan tantangan terhadap legitimasi tindakan Yesus.
- source_word: ταῦτα ποιεῖς
  choice: Engkau melakukan semua ini
  rationale: Bentuk kini merujuk pada tindakan-tindakan Yesus yang sedang dipersoalkan; “semua ini” merupakan padanan Indonesia yang alami bagi ταῦτα.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: Siapa yang memberi-Mu wewenang itu?
  rationale: Aoristus ἔδωκεν menunjuk tindakan pemberian wewenang. Bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia karena konteks dan verba sudah menyampaikannya.
theological_decisions:
- issue: Makna ἐξουσία dalam tantangan para pemimpin
  choice: wewenang
  alternative: kuasa; hak
  rationale: Konteksnya mempersoalkan legitimasi atau pemberian hak kepada Yesus untuk mengajar dan bertindak di kompleks Bait Allah, bukan semata-mata kemampuan atau kekuatan. “Wewenang” mempertahankan daya institusional dan teologisnya tanpa menentukan dari awal sumber wewenang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan langsung kepada Yesus memakai “Engkau”; pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Susunan dua pertanyaan dipertahankan untuk menjaga tekanan retoris teks.
