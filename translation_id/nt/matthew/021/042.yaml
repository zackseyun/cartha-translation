id: MAT.21.42
reference: Matthew 21:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: id
  text: Yesus berkata kepada mereka, “Belum pernahkah kamu membaca dalam Kitab Suci, ‘Batu yang ditolak oleh para tukang bangunan, batu itulah yang telah menjadi batu penjuru[a]. Hal ini berasal dari Tuhan[b], dan menakjubkan di mata kita’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu puncak”; secara harfiah “kepala sudut.”
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani berbunyi “dari Tuhan”; sumber Ibrani kutipan ini memakai “dari TUHAN” (YHWH).
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: berkata
  rationale: Bentuk Yunani adalah present historis, tetapi bentuk lampau naratif dipahami secara alami dalam bahasa Indonesia melalui konteks dan tidak perlu ditandai secara khusus.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Belum pernahkah kamu membaca
  rationale: Ungkapan ini mempertahankan daya retoris pertanyaan Yunani dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: γραφαῖς
  choice: Kitab Suci
  rationale: Dalam konteks ini kata tersebut menunjuk pada kumpulan tulisan suci Israel, bukan sekadar tulisan pada umumnya.
- source_word: Λίθον
  choice: Batu
  rationale: Walaupun tanpa artikel dalam bahasa Yunani, kutipan ini berbicara tentang batu tertentu; bahasa Indonesia tidak memerlukan penanda definit eksplisit di sini.
- source_word: ἀπεδοκίμασαν
  choice: ditolak
  rationale: Kata kerja ini menyatakan penolakan karena dianggap tidak layak; 'ditolak' menyampaikan makna itu secara ringkas dan alami.
- source_word: οἱ οἰκοδομοῦντες
  choice: para tukang bangunan
  rationale: Partisip ini berfungsi sebagai nomina dan menunjuk kepada orang-orang yang membangun; pilihan ini jelas bagi pembaca umum.
- source_word: οὗτος
  choice: batu itulah
  rationale: Pengulangan 'batu' bersama '-lah' mempertahankan penekanan demonstratif Yunani tanpa menghasilkan susunan yang kaku.
- source_word: ἐγενήθη εἰς
  choice: telah menjadi
  rationale: Pilihan ini menyatakan perubahan menuju suatu kedudukan yang sudah terwujud dan tetap relevan.
- source_word: κεφαλὴν γωνίας
  choice: batu penjuru
  rationale: Ini adalah padanan Indonesia yang mapan dan mudah dipahami untuk batu utama pada sudut bangunan; kemungkinan 'batu puncak' dicatat dalam catatan kaki.
- source_word: παρὰ κυρίου
  choice: berasal dari Tuhan
  rationale: παρά dengan genitif menandai sumber atau asal. 'Berasal dari Tuhan' menyatakan hubungan itu dengan jelas.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: menakjubkan di mata kita
  rationale: Terjemahan ini mempertahankan citraan sumber sekaligus tetap jelas dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Mazmur
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani berbunyi κυρίου, sehingga teks utama menerjemahkannya 'Tuhan'. Karena sumber Ibrani kutipan memakai nama ilahi YHWH, bentuk 'TUHAN' dicatat sebagai informasi tekstual dalam catatan kaki.
- issue: Penerapan mesianik dari gambaran batu
  choice: Mempertahankan metafora tanpa penjelasan interpretatif
  alternative: Secara eksplisit menyebut batu itu sebagai Mesias
  rationale: Dalam konteksnya Yesus menerapkan kutipan tersebut, tetapi ayat ini sendiri tidak menyisipkan penjelasan identitas batu. Terjemahan tidak menambahkan klaim yang tidak dinyatakan secara eksplisit dalam kalimat.
- issue: Rujukan αὕτη
  choice: Hal ini
  alternative: Batu ini
  rationale: Bentuk feminin αὕτη paling alami merujuk pada peristiwa atau perkembangan yang baru disebut, bukan langsung pada λίθος yang maskulin. 'Hal ini' mempertahankan rujukan tersebut tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan dapat dipahami pembaca umum. Pertanyaan retoris dibuat alami tanpa mengurangi tekanannya; citraan utama dari kutipan Kitab Suci dipertahankan.
