reference: Matthew 21:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: id
  text: 'Lalu Yesus menjawab mereka, “Sesungguhnya Aku berkata kepada kalian: Jika kalian memiliki iman dan tidak bimbang[a], kalian bukan hanya akan melakukan apa yang terjadi pada pohon ara itu, tetapi bahkan jika kalian berkata kepada gunung ini, ‘Terangkatlah dan terlemparlah ke dalam laut,’ hal itu akan terjadi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ragu” atau “tidak terpecah dalam pikiran.”
    reason: Alternatif leksikal untuk μὴ διακριθῆτε, yang dapat menggambarkan keraguan, kegoyahan, atau keadaan batin yang terbagi.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lalu Yesus menjawab mereka
  rationale: Partisipel ἀποκριθείς memperkenalkan tanggapan Yesus, sedangkan δέ menandai peralihan ringan. “Lalu” menyampaikan alur narasi secara alami tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepada kalian
  rationale: “Sesungguhnya” menyampaikan daya penegasan ἀμήν dalam rumusan pernyataan berwibawa; “kalian” memperjelas bahwa ὑμῖν berbentuk jamak.
- source_word: ἐὰν ἔχητε πίστιν
  choice: jika kalian memiliki iman
  rationale: Dalam konteks ini πίστις menunjuk pada keyakinan yang bersandar kepada Allah, bukan terutama sifat setia. “Memiliki iman” dekat dengan bentuk Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: μὴ διακριθῆτε
  choice: tidak bimbang
  rationale: Dalam konteks ini διακρίνω menyatakan kebimbangan atau keraguan batin. “Tidak bimbang” mempertahankan nuansa goyah atau terbelah dalam pikiran; alternatif dijelaskan dalam catatan kaki.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: kalian bukan saja akan melakukan apa yang telah dilakukan terhadap pohon ara itu
  rationale: Ungkapan Yunani bersifat eliptis dan merujuk pada peristiwa yang baru dialami pohon ara. Rumusan ini membuka elipsis secara wajar sambil mempertahankan verba “melakukan” dan bentuk pasif yang tidak menyebut pelaku.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: bahkan jika kalian berkata kepada gunung ini
  rationale: κἄν memperluas pernyataan kepada contoh yang lebih mencolok. “Bahkan jika” menyampaikan daya peningkatan tersebut, dan “gunung ini” mempertahankan penunjukan langsung τούτῳ.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Terangkatlah dan terlemparlah ke dalam laut
  rationale: Kedua imperatif aoris berbentuk pasif. Terjemahan ini mempertahankan suara pasif dan gambaran fisiknya tanpa mengubahnya menjadi penjelasan metaforis.
- source_word: γενήσεται
  choice: hal itu akan terjadi
  rationale: Bentuk mendatang γίνομαι menyatakan bahwa peristiwa yang diperintahkan itu akan berlangsung. Rumusan ini alami dalam bahasa Indonesia modern dan tidak kuno.
theological_decisions:
- issue: Makna πίστις dalam perkataan tentang tindakan yang luar biasa
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks menekankan keyakinan yang tidak bimbang. “Iman” mempertahankan istilah teologis yang lazim tanpa menggesernya menjadi kesetiaan sebagai sifat moral.
- issue: Sifat perkataan tentang memindahkan gunung
  choice: Mempertahankan gambaran gunung yang terangkat dan terlempar ke laut tanpa menentukan apakah harus dipahami secara harfiah atau kiasan
  alternative: Janji yang semata-mata harfiah tentang relokasi ajaib; metafora murni untuk mengatasi kesulitan
  rationale: Bahasa sumber menggunakan gambaran yang kuat. Terjemahan tidak seharusnya menyelesaikan ketegangan penafsiran dengan membatasi perkataan itu pada salah satu pembacaan.
- issue: Pelaku dalam tindakan terhadap pohon ara dan gunung
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku
  alternative: Menambahkan Allah sebagai pelaku tersurat; menjadikan para murid pelaku langsung
  rationale: Teks Yunani tidak menyebut pelaku dalam ungkapan pasif tersebut. Menambahkannya akan mempersempit ambiguitas yang ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai untuk menandai bentuk jamak Yunani secara jelas. Imperatif pasif “Terangkatlah dan terlemparlah” sengaja dipertahankan agar gambaran dan struktur sumber tidak diperlemah.
