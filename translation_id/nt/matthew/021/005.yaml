base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: id
  text: Katakanlah kepada putri Sion, “Lihatlah, Rajamu datang kepadamu; Ia lemah lembut dan menunggang seekor keledai, dan seekor anak keledai[a], anak dari hewan pengangkut beban.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Matius mempertahankan susunan nubuat yang memuat dua ungkapan hewan yang saling berkaitan: “seekor keledai, dan seekor anak keledai, anak dari hewan pengangkut beban.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Katakanlah
  rationale: Bentuk perintah jamak aoristus dari λέγω. “Katakanlah” mempertahankan daya perintah dan secara alami memperkenalkan kutipan.
- source_word: τῇ θυγατρὶ Σιών
  choice: kepada putri Sion
  rationale: Mempertahankan personifikasi profetis dalam teks Yunani dan latar Perjanjian Lama, tanpa meratakannya menjadi “penduduk Sion” atau “penduduk Yerusalem”.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Partikel penunjuk yang mengarahkan perhatian. “Lihatlah” jelas, wajar, dan tetap bernada luhur tanpa menjadi terlalu kuno.
- source_word: ὁ βασιλεύς σου
  choice: Rajamu
  rationale: Mewakili konstruksi posesif secara ringkas serta mempertahankan daya kerajaan dan mesianiknya.
- source_word: ἔρχεταί σοι
  choice: datang kepadamu
  rationale: Mengungkapkan kedatangan sang raja dengan langsung dan alami dalam bahasa Indonesia; konteks memberi nuansa peristiwa yang sedang menjelang atau berlangsung.
- source_word: πραῢς
  choice: dengan lemah lembut
  rationale: πραΰς dapat berarti lemah lembut, tidak keras, atau rendah hati. “Dengan lemah lembut” alami untuk menerangkan cara atau sifat kedatangan sang raja, sedangkan alternatif “rendah hati” dicatat dalam catatan kaki.
- source_word: ἐπιβεβηκὼς
  choice: menunggang
  rationale: Partisip perfek dari ἐπιβαίνω menggambarkan keadaan setelah naik ke atas tunggangan. “Menunggang” merupakan ungkapan Indonesia yang paling alami dalam konteks ini.
- source_word: ἐπὶ ὄνον
  choice: seekor keledai
  rationale: Padanan langsung dan umum untuk ὄνος dalam konteks hewan tunggangan.
- source_word: πῶλον
  choice: seekor anak keledai
  rationale: πῶλος berarti hewan muda; konteks dan frasa penjelas berikutnya menunjukkan anak keledai. Pilihan ini lebih mudah dipahami pembaca umum daripada istilah yang dapat diasosiasikan khusus dengan anak kuda.
- source_word: υἱὸν ὑποζυγίου
  choice: anak dari hewan pengangkut beban
  rationale: Mempertahankan ungkapan bercorak Semitis yang secara harfiah menunjuk pada keturunan hewan yang digunakan untuk mengangkut beban, tanpa menerjemahkan υἱός secara kaku sebagai “putra”.
theological_decisions:
- issue: Kutipan mesianik dari Zakharia 9:9 dan kemungkinan menyelaraskan redaksinya dengan teks Ibrani atau tradisi terjemahan yang dikenal
  choice: 'Mempertahankan redaksi Yunani Matius secara alami: “dengan lemah lembut dan menunggang seekor keledai, dan seekor anak keledai, anak dari hewan pengangkut beban.”'
  alternative: Memakai “rendah hati” agar lebih dekat dengan sejumlah terjemahan Zakharia 9:9, atau melebur kedua ungkapan tentang hewan menjadi satu rujukan yang tidak berulang.
  rationale: Terjemahan harus mencerminkan bentuk teks Matius, bukan menyelaraskannya secara diam-diam dengan bentuk lain dari kutipan nubuat. Dua ungkapan hewan tetap dipertahankan karena keduanya hadir dalam bahasa Yunani Matius dan mengandung ketegangan penafsiran yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Personifikasi “putri Sion” dan pengulangan ungkapan tentang hewan dipertahankan karena merupakan unsur penting teks sumber. Tanda catatan kaki ditempatkan pada kata atau frasa yang benar-benar dijelaskannya.
