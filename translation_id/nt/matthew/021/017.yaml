  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: id
  text: Lalu Ia meninggalkan mereka dan pergi ke luar kota menuju Betania. Ia bermalam di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menginap di sana" atau "melewatkan malam di sana."
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: Ia meninggalkan mereka
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan rujukan pronominal yang tidak diperjelas secara berlebihan.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: pergi ke luar kota
  rationale: Gabungan verba dan keterangan tempat menegaskan gerak meninggalkan wilayah kota; ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: εἰς Βηθανίαν
  choice: menuju Betania
  rationale: Preposisi εἰς menunjukkan arah ke suatu tempat. 'Menuju Betania' mengungkapkan arah itu dengan alami tanpa menyiratkan rincian tambahan.
- source_word: ηὐλίσθη ἐκεῖ
  choice: Ia bermalam di sana
  rationale: Verba αὐλίζομαι dalam konteks ini berarti menginap atau melewatkan malam. 'Bermalam' ringkas, modern, dan tepat, sedangkan ἐκεῖ diterjemahkan langsung sebagai 'di sana'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ayat dibagi menjadi dua kalimat agar alurnya alami dan mudah dipahami.
