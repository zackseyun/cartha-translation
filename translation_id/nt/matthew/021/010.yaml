  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: id
  text: Ketika dia masuk ke Yerusalem, seluruh kota menjadi gempar[a] dan berkata, “Siapakah ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terguncang.” Kata kerja Yunani ini dapat berarti diguncang secara fisik atau, seperti di sini, menggambarkan kegemparan di tengah masyarakat.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: ketika dia masuk
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia, tanpa menentukan bahwa tindakan itu sudah selesai sebelum reaksi kota terjadi.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: ἐσείσθη
  choice: menjadi gempar
  rationale: Kata kerja σείω secara harfiah berkaitan dengan guncangan, tetapi di sini menggambarkan kegemparan atau keresahan umum akibat kedatangan Yesus. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya ungkap reaksi seluruh kota.
- source_word: πᾶσα ἡ πόλις
  choice: seluruh kota
  rationale: Ungkapan idiomatis yang mempertahankan cakupan menyeluruh sekaligus metonimia kota bagi penduduknya.
- source_word: λέγουσα
  choice: dan berkata
  rationale: Mempertahankan arti dasar partisip ‘berkata’; bentuk pertanyaan dalam kutipan sudah menunjukkan fungsi ujaran itu tanpa perlu menerjemahkannya secara lebih interpretatif sebagai ‘bertanya’.
- source_word: Τίς ἐστιν οὗτος;
  choice: Siapakah dia ini?
  rationale: Menerjemahkan pertanyaan secara langsung tanpa menambahkan kata ‘orang’ atau ‘laki-laki’ yang tidak dinyatakan dalam teks Yunani.
theological_decisions:
- issue: Arti harfiah atau kiasan dari reaksi kota
  choice: menjadi gempar
  alternative: terguncang
  rationale: Konteks menggambarkan reaksi kolektif kota terhadap masuknya Yesus, bukan secara eksplisit suatu guncangan fisik. Terjemahan utama menyampaikan arti kiasannya, sedangkan kemungkinan metafora guncangan dipertahankan dalam catatan kaki.
- issue: Kapitalisasi kata ganti yang merujuk kepada Yesus
  choice: dia
  alternative: Dia atau Ia
  rationale: Teks Yunani memakai kata ganti biasa tanpa pembedaan kapitalisasi. Huruf kecil mengikuti ejaan bahasa Indonesia modern dan tidak memasukkan konvensi penghormatan teologis yang tidak ditandai dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan personifikasi Yunani bahwa ‘seluruh kota’ berkata. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
