  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: id
  text: Mereka menangkap dia, melemparkannya ke luar kebun anggur, lalu membunuhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: menangkap
  rationale: Partisip aoris ini mendahului verba-verba utama dan dalam konteks para penggarap yang memegang anak itu untuk mengusir serta membunuhnya berarti mengambil atau menangkap. “Menangkap” menyampaikan tindakan tersebut secara wajar tanpa memperkuatnya menjadi “menyergap” atau “meringkus”.
- source_word: ἐξέβαλον (ἐκβάλλω)
  choice: melemparkannya ke luar
  rationale: Dalam konstruksi dengan ἔξω τοῦ ἀμπελῶνος, verba ini menyatakan pengusiran secara fisik. “Melemparkannya ke luar” mempertahankan daya ungkap Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ke luar kebun anggur
  rationale: Frasa ini menunjukkan gerakan dari dalam menuju bagian luar kebun anggur. Preposisi “ke luar” cocok dengan verba gerak dan tidak mengubahnya menjadi sekadar keterangan lokasi.
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: kebun anggur
  rationale: Padanan baku dan tepat untuk lahan yang ditanami tanaman anggur, khususnya dalam konteks perumpamaan ini.
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: membunuhnya
  rationale: Padanan langsung dan alami yang tidak menambahkan penilaian leksikal seperti “membantainya” atau nuansa yuridis seperti “menghukumnya mati”.
theological_decisions:
- issue: Urutan pengusiran dan pembunuhan dibandingkan dengan kisah-kisah sejajar
  choice: Anak itu dilemparkan ke luar kebun anggur, lalu dibunuh.
  alternative: Menyelaraskan dengan Markus/Lukas dengan menyiratkan bahwa ia dibunuh lebih dahulu dan kemudian dilemparkan ke luar.
  rationale: 'Urutan teks Yunani Matius jelas: mereka menangkapnya, melemparkannya ke luar kebun anggur, dan membunuhnya. Terjemahan mempertahankan urutan khas Matius dan tidak menyelaraskannya secara diam-diam dengan kisah sejajar.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Lalu” memperjelas rangkaian tindakan yang sudah tersirat oleh koordinasi Yunani tanpa menambahkan penafsiran teologis. Tidak digunakan catatan kaki karena tidak ada ambiguitas penting yang memerlukan alternatif; catatan kaki bahasa Inggris tampaknya salah penempatan, sebab alternatifnya berkaitan dengan ἐξέβαλον, bukan λαβόντες.
