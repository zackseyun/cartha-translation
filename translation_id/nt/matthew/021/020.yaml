  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: id
  text: Ketika murid-murid melihat hal itu, mereka takjub dan berkata, “Bagaimana pohon ara itu bisa mengering seketika?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris ini dipahami secara temporal. “Hal itu” disediakan secara wajar dalam bahasa Indonesia dan mengacu pada keadaan pohon ara yang telah mengering dalam konteks sebelumnya.
- source_word: οἱ μαθηταί
  choice: murid-murid
  rationale: Padanan Indonesia yang baku dan alami untuk para pengikut Yesus dalam konteks ini.
- source_word: ἐθαύμασαν
  choice: mereka takjub
  rationale: Kata ini menyatakan rasa heran atau kagum yang kuat. “Takjub” mempertahankan bobot maknanya dalam ragam yang bermartabat.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip yang menyertai tindakan utama diungkapkan sebagai verba berkoordinasi agar alurnya alami dalam bahasa Indonesia.
- source_word: Πῶς
  choice: bagaimana ... bisa
  rationale: “Bagaimana” mempertahankan pertanyaan tentang cara terjadinya peristiwa itu, sedangkan “bisa” membuat bentuk pertanyaan tersebut idiomatis tanpa menetapkan penjelasan tertentu.
- source_word: παραχρῆμα
  choice: langsung
  rationale: Menunjukkan bahwa pohon itu mengering dengan segera atau seketika. “Langsung” jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐξηράνθη
  choice: menjadi kering
  rationale: Bentuk pasif aoris ini menyatakan bahwa pohon tersebut menjadi layu atau kering. “Menjadi kering” mempertahankan perubahan keadaan tanpa perlu menyebut pelakunya.
- source_word: ἡ συκῆ
  choice: pohon ara itu
  rationale: συκῆ secara khusus berarti pohon ara; unsur penentu diterjemahkan dengan “itu” karena merujuk pada pohon yang sudah dikenal dari konteks.
