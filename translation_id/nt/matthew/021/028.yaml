base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: id
  text: “Namun, bagaimana pendapat kalian? Seorang laki-laki mempunyai dua anak. Ia mendatangi anak yang pertama lalu berkata, ‘Nak, pergilah hari ini dan bekerjalah di kebun anggur.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Namun, bagaimana pendapat kalian?
  rationale: Ungkapan ini meminta penilaian para pendengar. ‘Namun’ mempertahankan daya penghubung ringan δέ, sedangkan ‘bagaimana pendapat kalian?’ alami dalam bahasa Indonesia dan mencerminkan bentuk jamak ὑμῖν.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Dalam konstruksi bahasa Indonesia, ‘ada seorang’ secara alami memperkenalkan tokoh laki-laki yang kemudian dipahami sebagai ayah; penyebutan ‘laki-laki’ tidak diperlukan agar kalimat tetap wajar.
- source_word: τέκνα δύο
  choice: dua anak
  rationale: τέκνα berarti ‘anak-anak’ dan tidak secara leksikal membatasi jenis kelamin, sehingga ‘dua anak’ lebih tepat daripada ‘dua anak laki-laki’.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Ia mendatangi anak yang pertama
  rationale: Partisip aoristus diterjemahkan sebagai tindakan yang mendahului verba utama. ‘Mendatangi’ menyampaikan gerak mendekat secara alami, dan nomina ‘anak’ diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: Τέκνον
  choice: Anakku
  rationale: Sapaan τέκνον berarti ‘anak’. Bentuk ‘Anakku’ merupakan sapaan orang tua kepada anak yang alami dan menyatakan relasi yang sudah jelas dari konteks tanpa mempersempitnya menjadi ‘Nak laki-lakiku’ atau ‘putraku’.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: pergilah bekerja ... hari ini
  rationale: Dua imperatif dipertahankan melalui ‘pergilah’ dan ‘bekerja’; posisi ‘hari ini’ di akhir kalimat terdengar alami dan tetap menerangkan perintah untuk bekerja.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: di kebun anggur
  rationale: ‘Di kebun anggur’ adalah padanan Indonesia yang alami bagi lokasi kerja dan mempertahankan citra pertanian perumpamaan.
theological_decisions:
- issue: Apakah τέκνα/τέκνον harus diterjemahkan secara tradisional sebagai anak laki-laki/putra
  choice: dua anak / Anakku
  alternative: dua anak laki-laki / Putraku
  rationale: Teks Yunani memakai istilah umum τέκνα dan τέκνον, bukan υἱοί/υἱέ. Terjemahan mempertahankan keluasan leksikal sumber dan tidak mempersempit jenis kelamin berdasarkan tradisi terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti ‘kalian’ dipakai karena ὑμῖν berbentuk jamak dan Yesus menyapa sekelompok pendengar. Dialog menggunakan sapaan keluarga yang alami, ‘Anakku’.
