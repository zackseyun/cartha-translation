language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: id
  text: Namun, ketika para imam kepala dan ahli Taurat melihat hal-hal menakjubkan yang Ia lakukan serta anak-anak yang berseru di Bait Allah[a] sambil berkata, “Hosana[b] bagi Anak Daud!” mereka menjadi gusar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν mengacu pada seluruh kompleks atau pelataran Bait Allah, bukan secara khusus pada ruang sucinya.
    reason: cultural_note
  - marker: b
    text: “Hosana” adalah seruan yang berasal dari bahasa Ibrani dan berarti kira-kira “Selamatkanlah kiranya” atau “Selamatkanlah sekarang”; pada masa itu, ungkapan ini juga telah menjadi seruan pujian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoris ini menyatakan keadaan temporal yang mengantar pada verba utama; bentuk ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bersifat kontras dengan kejadian sebelumnya.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Mengacu pada kelompok pemimpin keimaman, bukan hanya seorang imam besar.
- source_word: γραμματεῖς
  choice: ahli Taurat
  rationale: Istilah Indonesia yang lazim dan mudah dipahami bagi para pakar serta penafsir hukum Kitab Suci dalam konteks ini.
- source_word: τὰ θαυμάσια
  choice: hal-hal menakjubkan
  rationale: Mempertahankan cakupan luas ungkapan Yunani tanpa membatasinya hanya pada mukjizat.
- source_word: ἐποίησεν
  choice: yang Ia lakukan
  rationale: Padanan langsung dan alami bagi verba aoris sederhana; kata ganti merujuk kepada Yesus dalam konteks.
- source_word: παῖδας
  choice: anak-anak
  rationale: Makna yang paling sesuai dengan konteks; 'hamba-hamba' tidak mungkin di sini, sedangkan 'anak laki-laki' terlalu sempit.
- source_word: κράζοντας
  choice: yang berseru
  rationale: Menyampaikan seruan lantang di muka umum tanpa memberi kesan permusuhan.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: Ungkapan alami dalam bahasa Indonesia; cakupan ἱερόν sebagai seluruh kompleks dijelaskan dalam catatan kaki.
- source_word: λέγοντας
  choice: '[diwujudkan sebagai kutipan langsung setelah ''berseru'']'
  rationale: Dalam bahasa Indonesia, isi seruan dapat langsung mengikuti verba 'berseru' tanpa tambahan 'berkata', sehingga kalimat lebih alami dan maknanya tetap utuh.
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: Mempertahankan aklamasi liturgis yang diserap ke dalam bahasa Yunani serta ketegangan antara permohonan keselamatan dan seruan pujian; maknanya dijelaskan dalam catatan kaki.
- source_word: τῷ υἱῷ Δαυίδ
  choice: bagi Anak Daud
  rationale: Menerjemahkan datif secara alami sekaligus mempertahankan gelar mesianik itu secara harfiah.
- source_word: ἠγανάκτησαν
  choice: mereka menjadi gusar
  rationale: Mengungkapkan kemarahan atau kejengkelan yang kuat dengan bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Makna mesianik gelar 'Anak Daud'
  choice: Mempertahankan gelar harfiah 'Anak Daud'.
  alternative: '''keturunan Daud'' atau ''pewaris Daud'''
  rationale: Dalam Matius, frasa ini berfungsi sebagai gelar mesianik; parafrasa akan melemahkan kaitan naratif dan teologisnya.
- issue: Makna aklamasi Ὡσαννά
  choice: Mentransliterasikannya sebagai 'Hosana' dalam teks utama.
  alternative: '''Selamatkanlah kiranya'' atau ''Selamatkanlah sekarang'''
  rationale: Dalam konteks ini ungkapan tersebut sekaligus berakar pada permohonan keselamatan dan berfungsi sebagai seruan pujian. Transliterasi mempertahankan kedua nuansa itu, sementara arti leksikalnya diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para imam kepala' dan 'ahli Taurat' mempertahankan istilah yang dikenal luas tanpa memperumit kalimat. Susunan kalimat mengikuti hubungan temporal dan kontras dalam bahasa Yunani, sedangkan kutipan langsung ditempatkan segera setelah 'berseru' agar alami dalam bahasa Indonesia.
