id: MAT.21.26
reference: Matthew 21:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: id
  text: Tetapi jika kita berkata, ‘Dari manusia,’[a] kita takut kepada orang banyak, sebab mereka semua menganggap Yohanes sebagai nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berasal dari manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Tetapi jika kita berkata
  rationale: ἐὰν dengan aoristus subjungtif εἴπωμεν menyatakan kemungkinan bersyarat dalam pertimbangan mereka. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya kondisionalnya.
- source_word: Ἐξ ἀνθρώπων
  choice: Dari manusia
  rationale: Ungkapan ini merupakan jawaban tersirat mengenai sumber baptisan atau wewenang Yohanes dan berlawanan langsung dengan ‘dari surga’ pada ayat sebelumnya. ‘Manusia’ di sini bersifat generik, bukan khusus laki-laki.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: kita takut kepada orang banyak
  rationale: φοβούμεθα di sini bermakna aktif, sedangkan ὄχλος menunjuk kepada kumpulan orang yang hadir. Terjemahan ini langsung dan sesuai dengan konteks naratif.
- source_word: πάντες
  choice: mereka semua
  rationale: Bentuk jamak ini merujuk kembali kepada orang banyak dan menegaskan luasnya pandangan mereka.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: menganggap Yohanes sebagai nabi
  rationale: Susunan ἔχω dengan objek dan ὡς menyatakan penilaian atau anggapan mengenai seseorang. ‘Menganggap ... sebagai’ menyampaikan idiom tersebut secara alami tanpa menambahkan penafsiran.
- source_word: προφήτην
  choice: nabi
  rationale: Predikat tanpa artikel ini menyatakan bahwa Yohanes dipandang sebagai seorang yang termasuk golongan nabi; bahasa Indonesia tidak memerlukan kata sandang tak tentu.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Nama ini memakai bentuk baku yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Kontras antara sumber surgawi dan sumber manusia dalam Ἐξ ἀνθρώπων
  choice: Dari manusia
  alternative: Berasal dari manusia
  rationale: Pilihan ini mempertahankan bentuk ringkas dan kontras sumber dengan ‘dari surga’ dalam konteks langsung. Kata ‘manusia’ mencakup manusia secara umum dan tidak dibatasi pada laki-laki.
- issue: Sikap orang banyak terhadap Yohanes
  choice: mereka semua menganggap Yohanes sebagai nabi
  alternative: mereka semua memandang Yohanes sebagai nabi
  rationale: Teks melaporkan penilaian orang banyak tanpa secara tersendiri mengukuhkan atau menyangkalnya dalam ayat ini. Terjemahan mempertahankan batas pernyataan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Orang banyak’ dipertahankan sebagai ungkapan naratif yang lazim untuk ὄχλος, sedangkan ‘manusia’ dipakai secara generik untuk menonjolkan kontras dengan sumber surgawi.
