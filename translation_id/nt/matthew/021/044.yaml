base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: id
  text: “Siapa pun yang jatuh ke atas batu ini akan hancur berkeping-keping; tetapi siapa pun yang ditimpa batu itu akan dilumatkan oleh batu itu[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau dengan gambaran yang lebih kuat, “akan menghancurkannya menjadi debu” atau “akan menghamburkannya seperti sekam.”
    reason: lexical_alternative
  - marker: b
    text: Ayat ini tidak terdapat dalam beberapa naskah Matius, tetapi memiliki kesejajaran dalam Lukas 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: orang yang jatuh
  rationale: Partisipel berartikel ini menunjuk secara umum kepada seseorang. Ungkapan ini mempertahankan bentuk tunggal dan terdengar wajar dalam bahasa Indonesia.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: di atas batu ini
  rationale: Terjemahan spasial yang langsung dan mempertahankan kata konkret 'batu' serta kaitannya dengan gambaran batu dalam konteks terdekat.
- source_word: συνθλασθήσεται
  choice: akan pecah berkeping-keping
  rationale: Bentuk pasif futur menyatakan bahwa orang tersebut akan mengalami kehancuran berat. Pilihan ini tetap membedakannya dari λικμήσει yang lebih kuat pada klausa berikutnya.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: tetapi jika batu itu jatuh menimpa seseorang
  rationale: 'Klausa ini membalik arah benturan: batu menjadi subjek yang jatuh. Pengulangan ''batu itu'' memperjelas subjek tersirat secara alami tanpa mengubah gambaran sumber.'
- source_word: λικμήσει
  choice: akan melumatkan
  rationale: Kata kerja ini dapat menggambarkan penghancuran menyeluruh, bahkan hingga menjadi debu atau seperti sekam yang dihamburkan. 'Melumatkan' jelas, kuat, dan tetap membuka nuansa yang lebih hidup dalam catatan kaki.
- source_word: αὐτόν
  choice: orang tersebut
  rationale: Pronomina tunggal ini merujuk kembali kepada orang dalam konstruksi umum. Bahasa Indonesia tidak menandai gender pada rujukan semacam ini, sehingga 'orang tersebut' mempertahankan jumlah dan rujukannya tanpa menambahkan jenis kelamin yang tidak perlu.
theological_decisions:
- issue: Gambaran batu dan metafora penghakiman
  choice: Mempertahankan bahasa konkret tentang batu dan dua arah benturan tanpa penjelasan teologis tambahan dalam teks utama.
  alternative: Mengidentifikasi batu secara eksplisit sebagai Mesias/Yesus atau menyamakan kedua kata kerja sebagai satu gagasan umum tentang kebinasaan.
  rationale: Konteks sekitarnya menerapkan gambaran batu, tetapi ayat ini sendiri berbentuk pernyataan peribahasa. Terjemahan mempertahankan metafora dan kerasnya penghakiman tanpa memasukkan tafsiran ke dalam teks.
- issue: Rujukan tunggal yang bersifat umum
  choice: Menggunakan 'seseorang' dan 'orang tersebut'.
  alternative: Menggunakan bentuk jamak atau pronomina yang dapat terasa kurang jelas acuannya.
  rationale: Konstruksi Yunani berbentuk tunggal dan bersifat umum. Pilihan bahasa Indonesia ini mempertahankan kedua unsur tersebut secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Pecah berkeping-keping' dan 'melumatkan' mempertahankan perbedaan kekuatan kedua kata kerja Yunani. Pengulangan 'batu itu' dipakai demi kejelasan arah tindakan dalam bahasa Indonesia.
