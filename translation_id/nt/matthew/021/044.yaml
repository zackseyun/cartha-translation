  naturalness: Bahasa draf umumnya baku dan jelas, tetapi pengulangan “batu itu” dan “orang tersebut” dalam klausa kedua agak berat. Revisi mempertahankan ketegasan dan keterbacaan modern tanpa mengurangi gambaran konkret.
