  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: id
  text: Siapa pun yang tidak memikul salibnya[a] dan mengikuti Aku[b] tidak layak bagi-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai bentuk maskulin tunggal yang bersifat umum: setiap orang memikul salibnya sendiri.'
    reason: lexical_alternative
  - marker: b
    text: 'Dalam bahasa Yunani, ungkapannya lebih eksplisit: “mengikuti di belakang-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: siapa pun yang
  rationale: Menyampaikan konstruksi relatif tak tentu yang bersifat umum secara alami dalam bahasa Indonesia, tanpa membatasi rujukannya pada orang tertentu.
- source_word: λαμβάνει
  choice: memikul
  rationale: Dalam kolokasi dengan “salib”, “memikul” merupakan ungkapan Indonesia yang alami dan tepat, serta mempertahankan gambaran konkret tentang menerima beban dan konsekuensi sebagai murid.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: salibnya
  rationale: Mempertahankan gambaran konkret salib dan bentuk tunggal yang menunjuk pada salib masing-masing orang. Sufiks “-nya” dalam bahasa Indonesia secara alami dapat berfungsi generik tanpa menentukan jenis kelamin.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: mengikuti Aku
  rationale: Ini bentuk yang paling alami dalam bahasa Indonesia untuk tindakan mengikuti Yesus. Nuansa eksplisit ὀπίσω, yaitu berada atau berjalan di belakang, dicatat dalam catatan kaki agar tidak hilang.
- source_word: ἄξιος
  choice: layak
  rationale: “Layak” secara langsung dan wajar menyampaikan penilaian relasional yang dinyatakan oleh ἄξιος.
- source_word: μου ἄξιος
  choice: layak bagi-Ku
  rationale: Mempertahankan hubungan pribadi dengan Yesus tanpa memperluasnya menjadi tafsiran seperti “layak menjadi murid-Ku” atau “layak menjadi milik-Ku”.
theological_decisions:
- issue: Perkataan tentang memikul salib dalam pemuridan
  choice: Mempertahankan gambaran konkret “memikul salibnya” sebagai tuntutan kesetiaan yang siap menanggung penderitaan dan kehinaan dalam mengikuti Yesus.
  alternative: Menguraikannya sebagai “menerima penderitaan” atau “menyangkal diri”.
  rationale: Teks sumber memakai gambaran konkret salib. Menggantinya dengan abstraksi akan mempersempit kekayaan historis dan teologis perkataan tersebut.
- issue: Rujukan tunggal generik pada αὐτοῦ
  choice: Menerjemahkannya dengan sufiks tunggal generik “-nya” dan menjelaskan cakupannya dalam catatan kaki.
  alternative: Menambahkan “sendiri” dalam teks utama atau memakai bentuk yang secara eksplisit menyebut laki-laki dan perempuan.
  rationale: Bahasa Indonesia tidak menandai gender pada “-nya”; bentuk ini mempertahankan bilangan tunggal dan secara alami mencakup setiap orang tanpa menambahkan unsur yang tidak dinyatakan secara eksplisit.
- issue: Nuansa ὀπίσω dalam tindakan mengikuti
  choice: Memakai ungkapan alami “mengikuti Aku” dalam teks utama dan mempertahankan nuansa “di belakang-Ku” dalam catatan kaki.
  alternative: Menerjemahkan secara lebih harfiah “mengikuti di belakang-Ku”.
  rationale: Alternatif harfiah dapat terdengar kaku atau terlalu menekankan posisi fisik dalam bahasa Indonesia. Catatan kaki mempertahankan bukti leksikal tanpa mengorbankan kelancaran teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan khidmat. Kapitalisasi pada “Aku” dan “-Ku” mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab bahasa Indonesia. Susunan kalimat mempertahankan kesejajaran dua tindakan negatif sebelum penilaian penutup.
