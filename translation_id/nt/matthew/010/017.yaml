  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: id
  text: Namun, waspadalah terhadap orang-orang[a], sebab mereka akan menyerahkan kalian kepada majelis-majelis, dan di sinagoge-sinagoge mereka, mereka akan mencambuk kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “manusia”; istilah Yunani di sini merujuk secara umum kepada orang-orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: waspadalah
  rationale: Bentuk imperatif jamak ini menyampaikan peringatan agar para murid berjaga-jaga terhadap bahaya; “waspadalah” alami, ringkas, dan mempertahankan daya peringatannya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang bernuansa kontras dari arahan sebelumnya menuju peringatan tentang penganiayaan.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: terhadap orang-orang
  rationale: Dengan προσέχετε, ἀπό menunjuk pihak yang menjadi sumber bahaya. “Orang-orang” menyampaikan acuan generik tanpa membatasinya pada laki-laki.
- source_word: παραδώσουσιν
  choice: akan menyerahkan
  rationale: Kata ini menggambarkan tindakan menyerahkan seseorang kepada pihak berwenang; pilihan ini mempertahankan nuansa hukum tanpa menambahkan gagasan pengkhianatan yang tidak dinyatakan secara eksplisit.
- source_word: συνέδρια
  choice: majelis-majelis
  rationale: Bentuk jamak ini menunjuk badan-badan pemerintahan atau peradilan setempat, bukan hanya satu Sanhedrin tertentu. “Majelis-majelis” menjaga keluasan acuannya.
- source_word: συναγωγαῖς
  choice: rumah-rumah ibadat
  rationale: Istilah ini menunjuk tempat pertemuan dan ibadah Yahudi. “Rumah ibadat” merupakan padanan Indonesia yang lazim dan mudah dipahami dalam konteks ini.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif ini menyatakan hubungan atau kepemilikan pada rumah-rumah ibadat tersebut.
- source_word: μαστιγώσουσιν
  choice: akan mencambuk
  rationale: Kata kerja ini menunjuk hukuman badan dengan cambuk. “Mencambuk” jelas, wajar dalam bahasa Indonesia modern, dan mempertahankan kerasnya tindakan itu.
theological_decisions:
- issue: Cakupan gender ἀνθρώπων
  choice: orang-orang
  alternative: laki-laki
  rationale: Walaupun bentuk Yunaninya maskulin jamak secara gramatikal, acuannya di sini bersifat generik kepada manusia yang akan menganiaya para murid, bukan secara khusus kepada laki-laki.
- issue: Acuan jamak συνέδρια
  choice: majelis-majelis
  alternative: Mahkamah Agama
  rationale: Bentuk jamak menunjuk berbagai dewan lokal. Padanan yang terlalu teknis dapat keliru membatasi acuan kepada Sanhedrin di Yerusalem.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “kalian” dipakai untuk menampilkan bentuk orang kedua jamak dalam sumber. Pengulangan “mereka” sebelum “akan mencambuk” memperjelas subjek klausa kedua secara alami.
