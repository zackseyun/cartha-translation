  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: id
  text: Namun, bahkan semua rambut di kepalamu sudah terhitung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dihitung.” Bentuk perfek pasif Yunani dapat menekankan tindakan yang telah selesai dengan hasil yang masih berlaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: -mu
  rationale: Genitif orang kedua jamak menyatakan kepunyaan. Bahasa Indonesia secara alami memakai enklitik posesif “-mu”; bentuk ini dapat merujuk kepada para pendengar secara kolektif sesuai konteks.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan terhadap konteks sebelumnya; “Namun” mempertahankan hubungan wacana tanpa membuat pertentangannya terlalu kuat.
- source_word: καὶ
  choice: bahkan
  rationale: Di sini καὶ bersifat emfatis, menyoroti bahwa sampai hal sekecil rambut pun tercakup.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: rambut di kepalamu
  rationale: Ungkapan ini menerjemahkan konstruksi genitif secara idiomatis dalam bahasa Indonesia, sambil mempertahankan gambaran konkret tentang rambut kepala.
- source_word: πᾶσαι
  choice: semua
  rationale: Mempertahankan penekanan pada keseluruhan tanpa pengecualian.
- source_word: ἠριθμημέναι εἰσίν
  choice: sudah terhitung
  rationale: Perifrasa perfek pasif menunjukkan tindakan yang telah selesai dengan keadaan hasil yang tetap berlaku. “Sudah terhitung” alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
theological_decisions:
- issue: Cakupan pengetahuan atau pemeliharaan ilahi yang tersirat
  choice: Pernyataan diterjemahkan secara langsung sebagai “semua rambut ... sudah terhitung,” tanpa memperluasnya menjadi uraian doktrinal.
  alternative: Menjelaskannya secara interpretatif sebagai bukti bahwa Allah mengetahui, menjaga, atau mengendalikan setiap rincian kehidupan.
  rationale: Teks menyajikan gambaran konkret tentang rambut yang terhitung. Implikasi mengenai pengetahuan dan pemeliharaan Allah sebaiknya muncul dari konteks, bukan dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Rambut di kepalamu” lebih alami daripada “rambut dari kepalamu,” sedangkan “sudah terhitung” mempertahankan keadaan hasil dari bentuk perfek pasif Yunani.
