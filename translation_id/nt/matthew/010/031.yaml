  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: id
  text: Jadi, jangan takut; kalian lebih berharga daripada banyak burung pipit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Jadi, jangan takut
  rationale: μή dengan imperatif kini φοβεῖσθε menyatakan larangan, sedangkan οὖν menarik kesimpulan dari uraian sebelumnya tentang pemeliharaan Bapa. “Jadi” menyampaikan hubungan logis itu secara alami dalam bahasa Indonesia.
- source_word: πολλῶν στρουθίων
  choice: daripada banyak burung pipit
  rationale: Dalam konteks langsung Matius 10:29, στρουθίον menunjuk kepada burung pipit. Bentuk genitif ini mengikuti διαφέρετε dalam perbandingan.
- source_word: διαφέρετε
  choice: lebih berharga
  rationale: Dalam konteks ini διαφέρω berarti melampaui dalam nilai atau kepentingan, bukan sekadar berbeda. “Lebih berharga” menyampaikan perbandingan tersebut secara ringkas dan alami.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina eksplisit memberi penekanan kepada para murid sebagai kelompok dan dikontraskan dengan burung-burung pipit. “Kalian” mempertahankan bentuk jamak yang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Nilai relatif manusia dan burung pipit dalam ajaran Yesus
  choice: kalian lebih berharga daripada banyak burung pipit
  alternative: kalian jauh lebih bernilai daripada banyak burung pipit
  rationale: Terjemahan ini mempertahankan perbandingan yang dinyatakan teks tentang perhatian Allah kepada para murid, tanpa menyiratkan bahwa Allah tidak memedulikan makhluk lain. Kata “lebih” menjaga perbandingan tanpa menambahkan intensitas yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμεῖς berbentuk jamak; “burung pipit” mempertahankan rujukan konkret dari konteks sebelumnya.
