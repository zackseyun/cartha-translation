  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: id
  text: Simon Kanani[a], dan Yudas Iskariot, yang juga mengkhianati Dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Simon orang Zelot.” Teks Yunani berbunyi “Kanani,” kemungkinan mencerminkan sebutan Aram/Ibrani yang secara tradisional dipahami sebagai “orang Zelot.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang juga menyerahkan Dia.” Verba Yunani dapat berarti “menyerahkan”, tetapi dalam konteks Yudas, “mengkhianati” sesuai dengan jalan ceritanya.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: orang Kanana
  rationale: Mentransliterasikan sebutan Yunani yang kemungkinan mencerminkan istilah Aram/Ibrani, alih-alih langsung menafsirkannya sebagai 'orang Zelot'. Bentuk ini juga membedakannya dari 'orang Kanaan'.
- source_word: Ἰσκαριώτης
  choice: Iskariot
  rationale: Mengikuti transliterasi baku dalam bahasa Indonesia untuk julukan atau nama ini.
- source_word: παραδοὺς
  choice: mengkhianati
  rationale: Walaupun verba ini secara luas berarti 'menyerahkan', dalam konteks Yudas tindakan tersebut merupakan pengkhianatan. Padanan yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: yang juga mengkhianati Dia
  rationale: Artikel dan partisip diterjemahkan sebagai klausa relatif yang wajar dalam bahasa Indonesia; 'juga' mempertahankan καί, dan 'Dia' merujuk kepada Yesus.
theological_decisions:
- issue: Apakah παραδοὺς diterjemahkan secara netral sebagai 'menyerahkan' atau secara kontekstual sebagai 'mengkhianati'
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Dalam daftar para rasul ini, Yudas dikenali melalui tindakannya terhadap Yesus, dan konteks Injil memberi tindakan itu daya moral sebagai pengkhianatan. Namun, karena verba Yunani memiliki arti yang lebih luas, 'menyerahkan' dipertahankan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sebutan 'orang Kanana' dipertahankan untuk menjaga bentuk sumber serta menghindari kerancuan dengan 'orang Kanaan'; alternatif interpretatif diberikan dalam catatan kaki. Huruf kapital pada 'Dia' mengikuti kebiasaan hormat yang lazim dalam terjemahan Alkitab Indonesia tanpa mengubah rujukan teks.
