  naturalness: «Simon Kanani» merupakan aposisi nama/julukan yang lebih ringkas dan lazim dalam bahasa Indonesia modern daripada «Simon orang Kanana». Klausa «yang juga mengkhianati Dia» tetap lugas dan sesuai register Alkitab baku.
  terminology: «Iskariot» sudah tepat sebagai transliterasi mapan. «Kanani» dipakai sebagai transliterasi julukan, bukan «Kanaan» atau penafsiran langsung «Zelot». Catatan kaki mempertahankan «orang Zelot» sebagai pemahaman alternatif. «Mengkhianati» dan alternatif «menyerahkan» menjaga nuansa leksikal παραδίδωμι tanpa memaksakan pembacaan doktrinal.
