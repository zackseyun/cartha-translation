  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: id
  text: Lihat, Aku mengutus kalian seperti domba di tengah-tengah serigala. Karena itu, hendaklah kalian cerdik seperti ular dan tulus seperti merpati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Mempertahankan seruan yang menarik perhatian secara langsung dan alami dalam bahasa Indonesia.
- source_word: ἀποστέλλω
  choice: mengutus
  rationale: Menyatakan pengiriman dengan mandat atau tugas, sesuai konteks pengutusan para murid.
- source_word: ἐν μέσῳ λύκων
  choice: ke tengah-tengah kawanan serigala
  rationale: Ungkapan 'ke tengah-tengah' menyampaikan keadaan berbahaya yang akan mereka masuki; 'kawanan' membuat gambaran jamak alami tanpa mengubah metafora.
- source_word: φρόνιμοι
  choice: cerdik
  rationale: Mencakup kebijaksanaan praktis, kewaspadaan, dan kecermatan, bukan kelicikan moral.
- source_word: ἀκέραιοι
  choice: tulus
  rationale: Dalam konteks moral, menyatakan kemurnian niat dan ketiadaan maksud jahat; lebih alami daripada padanan harfiah yang berarti 'tidak bercampur'.
- source_word: ὄφεις / περιστεραί
  choice: ular / merpati
  rationale: Bahasa Indonesia lazim memakai bentuk tanpa penanda jamak dalam perbandingan generik ini, sementara makna kolektif tetap jelas.
theological_decisions:
- issue: Ketegangan antara kecerdikan dan ketulusan
  choice: cerdik seperti ular dan tulus seperti merpati
  alternative: bijaksana seperti ular dan tidak bersalah seperti merpati
  rationale: Terjemahan ini mempertahankan keseimbangan yang disengaja antara kecakapan menghadapi bahaya dan kemurnian moral, tanpa menganggap kecerdikan sebagai kelicikan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa objek dan perintahnya jamak. Huruf kapital pada 'Aku' mengikuti kelaziman penerbitan Alkitab Indonesia untuk ucapan Yesus.
