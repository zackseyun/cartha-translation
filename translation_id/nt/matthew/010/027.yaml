base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: id
  text: Apa yang Kukatakan kepadamu dalam kegelapan[a], katakanlah dalam terang; dan apa yang kamu dengar di telinga[b], beritakanlah di atas atap rumah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara rahasia ... secara terbuka”; teks Yunani mempertahankan gambaran “dalam kegelapan ... dalam terang”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di telinga” menggambarkan komunikasi pribadi yang harus diumumkan kepada umum. Atap rumah pada zaman itu biasanya datar dan dapat menjadi tempat yang terlihat untuk menyampaikan pengumuman.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Apa yang Kukatakan kepadamu
  rationale: Menerjemahkan pronomina relatif substantival dan verba secara alami dalam bahasa Indonesia, sambil mempertahankan ujaran langsung Yesus.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dalam kegelapan
  rationale: Mempertahankan citra Yunani dan pertentangannya dengan 'dalam terang', tanpa langsung mereduksinya menjadi 'secara rahasia'.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: katakanlah dalam terang
  rationale: Bentuk imperatif dipertahankan, demikian pula citra terang yang berlawanan dengan kegelapan.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: apa yang kamu dengar dibisikkan ke telinga
  rationale: Ungkapan Yunani secara harfiah mengacu pada mendengar 'ke dalam telinga'; penambahan 'dibisikkan' menyampaikan idiom komunikasi pribadi secara wajar dalam bahasa Indonesia tanpa menghilangkan citra telinga.
- source_word: κηρύξατε
  choice: beritakanlah
  rationale: Menyampaikan tindakan mengumumkan secara terbuka dan luas tanpa membatasinya pada khotbah formal.
- source_word: ἐπὶ τῶν δωμάτων
  choice: dari atas atap rumah
  rationale: Ungkapan Indonesia ini alami dan mempertahankan gambaran atap datar rumah sebagai tempat tinggi untuk pengumuman terbuka.
theological_decisions:
- issue: Apakah bahasa kegelapan/terang dan telinga/atap harus dijelaskan sebagai rahasia/terbuka dalam teks utama
  choice: Mempertahankan citra 'dalam kegelapan ... dalam terang ... ke telinga ... dari atas atap rumah'.
  alternative: Menerjemahkannya sepenuhnya secara interpretatif sebagai 'secara rahasia ... secara terbuka ... secara pribadi ... di depan umum'.
  rationale: Citra antitetis dalam perkataan Yesus memiliki daya retoris dan keluasan makna yang patut dipertahankan; catatan kaki dapat menjelaskan implikasi pribadi dan publik tanpa menggantikan citra sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman Alkitab bahasa Indonesia. Bentuk tunggal 'telinga' mempertahankan citra sumber, sedangkan 'dibisikkan' membuat idiomnya dapat dipahami pembaca umum.
