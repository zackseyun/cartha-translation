  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: id
  text: Dan musuh seseorang ialah anggota rumah tangganya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang seisi rumahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan fungsi penghubung sederhana dengan konteks sebelumnya tanpa menambahkan hubungan sebab-akibat.
- source_word: ἐχθροὶ
  choice: musuh
  rationale: Kata benda jamak ini menunjuk kepada orang-orang yang memusuhi; dalam bahasa Indonesia, bentuk “musuh” tidak perlu ditandai jamak.
- source_word: τοῦ ἀνθρώπου
  choice: orang itu
  rationale: Frasa genitif menyatakan orang yang menjadi sasaran permusuhan. “Orang itu” mempertahankan bentuk tunggal representatif dan terdengar wajar dalam pepatah ini.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: orang-orang seisi rumahnya
  rationale: Menunjuk kepada para anggota rumah tangga, bukan bangunan rumah; “seisi rumahnya” juga mempertahankan hubungan kepunyaan yang dinyatakan oleh αὐτοῦ.
theological_decisions:
- issue: Bahasa representatif pada ἀνθρώπου
  choice: orang itu
  alternative: seseorang
  rationale: Bahasa Indonesia tidak wajib menandai jenis kelamin pada “orang”. Pilihan ini mempertahankan ketunggalan dan corak representatif teks Yunani tanpa memasukkan jenis kelamin yang tidak dinyatakan secara leksikal oleh ἄνθρωπος dalam konteks ini.
- issue: Cakupan οἰκιακοί
  choice: orang-orang seisi rumahnya
  alternative: keluarganya sendiri
  rationale: “Seisi rumah” mempertahankan cakupan rumah tangga yang dapat lebih luas daripada keluarga inti, sehingga tidak mempersempit kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pepatah. Huruf awal “dan” dibuat kecil karena ayat ini secara sintaksis melanjutkan perkataan pada ayat sebelumnya.
