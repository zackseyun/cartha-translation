id: MAT.10.21
reference: Matthew 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: id
  text: Seorang saudara laki-laki akan menyerahkan saudara laki-lakinya untuk dibunuh[a], dan seorang ayah akan menyerahkan anaknya untuk dibunuh. Anak-anak akan bangkit melawan orang tua mereka dan membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkan saudara laki-lakinya kepada kematian”; kata kerja “menyerahkan” juga dapat berarti “mengkhianati” dalam konteks pengkhianatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: akan menyerahkan
  rationale: Kata kerja ini menggambarkan tindakan menyerahkan seseorang kepada pihak yang bermusuhan atau kepada kematian. Pilihan ini mempertahankan gambaran konkretnya tanpa mempersempit makna menjadi ‘mengkhianati’.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: seorang saudara ... saudaranya
  rationale: Dalam bahasa Indonesia, ‘saudara’ dapat merujuk kepada saudara laki-laki maupun hubungan persaudaraan secara umum. Bentuk ini alami dan mempertahankan konstruksi tunggal yang representatif.
- source_word: εἰς θάνατον
  choice: untuk dibunuh
  rationale: Frasa ini menyatakan tujuan atau hasil penyerahan, yaitu kematian. Bentuk pasif ini secara alami menghubungkan penyerahan dengan tindakan pihak yang menerima orang tersebut.
- source_word: πατὴρ τέκνον
  choice: seorang ayah ... anaknya
  rationale: τέκνον berarti ‘anak’ tanpa menentukan jenis kelamin. Kata ‘-nya’ melengkapi hubungan keluarga yang tersirat dalam bahasa Yunani.
- source_word: ἐπαναστήσονται
  choice: akan bangkit melawan
  rationale: Pilihan ini mempertahankan gambaran hidup dari kata Yunani serta menyatakan perlawanan aktif tanpa mempersempitnya menjadi pemberontakan politik.
- source_word: τέκνα
  choice: anak-anak
  rationale: Istilah ini mencakup anak laki-laki dan perempuan.
- source_word: ἐπὶ γονεῖς
  choice: melawan orang tua mereka
  rationale: Dengan verba permusuhan, ἐπί berfungsi dalam arti ‘melawan’. ‘Mereka’ ditambahkan agar hubungan keluarga jelas dan alami dalam bahasa Indonesia.
- source_word: θανατώσουσιν αὐτούς
  choice: membuat mereka dihukum mati
  rationale: θανατόω berarti menyebabkan seseorang mati dan dapat mengandung nuansa tindakan resmi atau eksekusi. ‘Membuat ... dihukum mati’ mempertahankan kemungkinan bahwa anak-anak menyebabkan kematian orang tua melalui pihak berwenang.
theological_decisions:
- issue: Istilah keluarga yang bergender dan representatif
  choice: Menggunakan ‘saudara’ untuk ἀδελφός, ‘ayah’ untuk πατήρ, serta ‘anak-anak/orang tua’ untuk istilah yang cakupannya lebih luas
  alternative: Menerjemahkan ἀδελφός secara khusus sebagai ‘saudara laki-laki’
  rationale: Bahasa Indonesia modern lazim memakai ‘saudara’ tanpa menandai gender, meskipun bentuk Yunani tunggalnya maskulin. ‘Ayah’ tetap dipertahankan secara khusus, sedangkan τέκνα dan γονεῖς diterjemahkan sesuai cakupan inklusifnya.
- issue: Cara anak-anak menyebabkan kematian orang tua
  choice: ‘membuat mereka dihukum mati’
  alternative: ‘membunuh mereka’ atau ‘membuat mereka mati’
  rationale: Bentuk kausatif ini menjaga kemungkinan tindakan melalui penyerahan atau proses resmi, tanpa memastikan bahwa anak-anak sendiri menjadi pelaksana pembunuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan hubungan keluarga, peningkatan konflik, dan nuansa penyerahan kepada kematian.
