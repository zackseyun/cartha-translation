revisions:
- from: Seorang saudara akan menyerahkan saudaranya untuk dibunuh[a], dan seorang ayah akan menyerahkan anaknya. Anak-anak akan bangkit melawan orang tua mereka dan membuat mereka dihukum mati.
  to: Seorang saudara laki-laki akan menyerahkan saudara laki-lakinya untuk dibunuh[a], dan seorang ayah akan menyerahkan anaknya untuk dibunuh. Anak-anak akan bangkit melawan orang tua mereka dan membunuh mereka.
  rationale: Revisi menghapus implikasi pengadilan yang tidak ada dalam θανατώσουσιν, memperjelas bahwa kedua tindakan penyerahan berujung pada kematian, dan mencerminkan bentuk maskulin ἀδελφός. Tidak ada perubahan doktrinal atau penambahan rincian historis.
