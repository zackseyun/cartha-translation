review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena θανατώσουσιν menyatakan bahwa anak-anak akan menyebabkan kematian orang tua mereka secara langsung; “membuat mereka dihukum mati” menambahkan unsur vonis/proses hukum yang tidak dinyatakan oleh teks Yunani. Selain itu, εἰς θάνατον berlaku juga bagi objek kedua yang dikoordinasikan, yaitu anak yang diserahkan oleh ayah.
  naturalness: Kalimat revisi tetap baku dan jelas dalam bahasa Indonesia modern. Pengulangan predikat pada klausa tentang ayah diperlukan agar elipsis Yunani tidak menghasilkan ketaksaan dalam bahasa Indonesia.
  terminology: “Saudara laki-laki” mencerminkan ἀδελφός yang maskulin dalam konteks ini; “anak-anak” dan “orang tua” tetap tepat untuk τέκνα dan γονεῖς. “Menyerahkan ... untuk dibunuh” menyampaikan παραδίδωμι εἰς θάνατον tanpa menuntut bahwa pelaku penyerahan sendiri membunuh korban. “Membunuh” untuk θανατόω tidak secara tidak perlu membatasi kematian itu pada eksekusi hukum.
  issues:
  - severity: medium
    issue: “membuat mereka dihukum mati” terlalu menspesifikkan θανατώσουσιν.
    rationale: Kata θανατόω berarti menyebabkan kematian atau membunuh; meskipun kadang berhubungan dengan eksekusi, teks ini tidak menyebut pengadilan, hukuman, atau pihak berwenang. Frasa draf juga membuat tindakan anak-anak tampak semata-mata tidak langsung.
  - severity: low
    issue: Akibat “untuk dibunuh” tidak diulang pada klausa tentang ayah.
    rationale: Dalam Yunani, εἰς θάνατον melingkupi “saudara” dan “ayah”; dalam bahasa Indonesia, pengulangan membuat cakupan itu eksplisit dan alami.
  - severity: low
    issue: “saudara” tidak menandai maskulinitas ἀδελφός.
    rationale: Karena istilah sumber berbentuk dan bermakna maskulin di sini, “saudara laki-laki” lebih setia, sementara istilah keluarga lain yang inklusif tetap diterjemahkan inklusif.
  revised_text: Seorang saudara laki-laki akan menyerahkan saudara laki-lakinya untuk dibunuh[a], dan seorang ayah akan menyerahkan anaknya untuk dibunuh. Anak-anak akan bangkit melawan orang tua mereka dan membunuh mereka.
  revised_footnotes:
