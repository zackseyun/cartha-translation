id: MAT.10.41
reference: Matthew 10:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: id
  text: Siapa yang menyambut seorang nabi sebagai nabi[a] akan menerima upah seorang nabi; dan siapa yang menyambut orang benar sebagai orang benar[b] akan menerima upah orang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam nama seorang nabi”; dapat juga dipahami, “karena ia seorang nabi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam nama orang benar”; dapat juga dipahami, “karena ia orang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: siapa yang menyambut
  rationale: Partisipel kini dengan artikel menunjuk secara umum kepada siapa pun yang melakukan tindakan itu. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat umum pernyataan tersebut.
- source_word: προφήτην
  choice: seorang nabi
  rationale: Padanan langsung yang mempertahankan sebutan peran dalam teks sumber.
- source_word: εἰς ὄνομα προφήτου
  choice: sebagai nabi
  rationale: Ungkapan Yunani secara harfiah berbunyi 'dalam nama seorang nabi', tetapi dalam konteks ini menyatakan bahwa orang itu disambut berdasarkan identitas atau kedudukannya sebagai nabi. 'Sebagai nabi' menyampaikan idiom tersebut secara alami tanpa menambahkan gagasan 'atas nama' yang dalam bahasa Indonesia dapat berarti mewakili seseorang.
- source_word: μισθὸν προφήτου
  choice: upah seorang nabi
  rationale: 'Bentuk ini mempertahankan hubungan genitif yang ambigu: upah yang diterima nabi atau upah yang berkaitan dengan penerimaan seorang nabi.'
- source_word: λήμψεται
  choice: akan menerima
  rationale: Menyampaikan bentuk futurum secara lugas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: δίκαιον
  choice: orang benar
  rationale: Adjektiva maskulin substantival ini paling alami diterjemahkan sebagai 'orang benar'. Bahasa Indonesia tidak menandai gender gramatikal di sini, sehingga 'orang benar' tetap setia pada makna tanpa menambahkan jenis kelamin yang tidak perlu.
- source_word: εἰς ὄνομα δικαίου
  choice: sebagai orang benar
  rationale: Mempertahankan kesejajaran dengan klausa pertama dan menyatakan penerimaan berdasarkan identitas orang itu sebagai orang benar.
- source_word: μισθὸν δικαίου
  choice: upah orang benar
  rationale: Menjaga kesejajaran dan ambiguitas hubungan genitif sebagaimana dalam 'upah seorang nabi'.
theological_decisions:
- issue: Makna idiom εἰς ὄνομα + genitif
  choice: sebagai nabi / sebagai orang benar
  alternative: dalam nama seorang nabi / dalam nama orang benar; karena ia seorang nabi / karena ia orang benar
  rationale: Terjemahan 'sebagai' secara alami mengungkapkan penerimaan seseorang berdasarkan identitas atau kedudukannya, sedangkan catatan kaki mempertahankan bentuk harfiah dan kemungkinan nuansa kausal agar ketegangan idiom tidak hilang.
- issue: Maskulinitas gramatikal δίκαιον / δικαίου
  choice: orang benar
  alternative: laki-laki yang benar
  rationale: Bahasa Indonesia tidak memiliki gender gramatikal pada kata 'orang'. Menambahkan 'laki-laki' akan membuat jenis kelamin lebih tegas daripada yang diperlukan untuk ungkapan umum ini.
- issue: Makna μισθὸν προφήτου dan μισθὸν δικαίου
  choice: mempertahankan bentuk ambigu 'upah seorang nabi' dan 'upah orang benar'
  alternative: upah yang akan diterima seorang nabi / orang benar; upah karena menyambut nabi / orang benar
  rationale: Teks Yunani tidak secara eksplisit menentukan apakah genitif menunjuk pada upah yang diberikan kepada tokoh tersebut atau upah yang terkait dengan orang yang menyambutnya. Terjemahan tidak menetapkan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Menyambut' dipilih karena mencakup menerima seseorang dengan terbuka atau ramah. Pengulangan sengaja dipertahankan untuk mencerminkan kesejajaran retoris teks Yunani; 'Demikian juga' memperjelas hubungan kedua klausa tanpa mengubah isinya.
