  naturalness: '"Salah seorang dari mereka yang kecil ini" kurang idiomatis dan dapat memberi kesan rujukan kepada kelompok yang telah disebutkan. "Salah seorang dari orang-orang kecil ini" lebih alami sambil mempertahankan ungkapan terbuka dari teks. "Kepada kalian" secara alami menyampaikan sapaan jamak.'
  terminology: '"Murid", "sesungguhnya", dan "upah" sesuai register Alkitab Indonesia yang baku. "Orang-orang kecil ini" mempertahankan ambiguitas μικρῶν tanpa membatasinya kepada anak-anak atau kelompok teologis tertentu.'
