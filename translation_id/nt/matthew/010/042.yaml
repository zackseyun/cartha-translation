revisions:
- from: Dan siapa pun yang memberi salah seorang dari mereka yang kecil ini secangkir air sejuk saja karena ia seorang murid,[a] sesungguhnya Aku berkata kepadamu, orang itu pasti tidak akan kehilangan upahnya.[b]
  to: Dan siapa pun yang memberi salah seorang dari orang-orang kecil ini[b] hanya secangkir air dingin karena ia seorang murid,[a] sesungguhnya Aku berkata kepada kalian, orang itu pasti tidak akan kehilangan upahnya.
  rationale: Revisi memperbaiki idiom bahasa Indonesia, menerjemahkan ψυχροῦ secara lebih langsung sebagai "dingin", menyatakan sapaan jamak Yunani, dan memindahkan penanda catatan b ke frasa yang benar-benar dijelaskannya. Terjemahan "karena ia seorang murid" tetap merupakan penyampaian idiomatis yang sah untuk εἰς ὄνομα μαθητοῦ, sementara bentuk yang lebih formal dipertahankan dalam catatan kaki.
