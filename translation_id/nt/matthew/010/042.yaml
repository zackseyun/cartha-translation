  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: id
  text: Dan siapa pun yang memberi salah seorang dari orang-orang kecil ini[b] hanya secangkir air dingin karena ia seorang murid,[a] sesungguhnya Aku berkata kepada kalian, orang itu pasti tidak akan kehilangan upahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dalam nama seorang murid.” Maksudnya, pemberian itu dilakukan karena penerima dikenal sebagai murid.'
    reason: alternative_reading
  - marker: b
    text: Ungkapan “orang-orang kecil ini” dalam konteks ini kemungkinan menunjuk kepada para pengikut Yesus yang rendah kedudukannya atau dianggap tidak penting, bukan hanya kepada anak-anak.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan keadaan umum yang tidak terbatas; bentuk ini alami dalam bahasa Indonesia.
- source_word: ποτίσῃ
  choice: memberi ... secangkir air sejuk
  rationale: Secara harfiah berarti memberi minum; ungkapan ini menyampaikan tindakan menyediakan minuman secara alami.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: salah seorang dari mereka yang kecil ini
  rationale: Mempertahankan gambaran 'yang kecil' tanpa membatasinya hanya pada anak-anak atau menetapkan status tertentu secara eksplisit.
- source_word: ποτήριον ψυχροῦ
  choice: secangkir air sejuk
  rationale: ψυχροῦ secara wajar menyiratkan air; 'air sejuk' merupakan ungkapan Indonesia yang alami untuk air yang menyegarkan.
- source_word: μόνον
  choice: saja
  rationale: Menandai kecil dan sederhananya pemberian itu secara langsung.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: karena ia seorang murid
  rationale: Menyampaikan bahwa tindakan itu dilakukan berdasarkan identitas penerima sebagai murid; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: sesungguhnya Aku berkata kepadamu
  rationale: Mempertahankan bobot formula pernyataan khidmat dan berwibawa dalam bahasa Indonesia yang dikenal luas.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: pasti tidak akan kehilangan
  rationale: Menyampaikan negasi Yunani yang sangat tegas.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: upahnya
  rationale: μισθός dapat berarti upah atau ganjaran; 'upah' mempertahankan metafora imbalan tanpa menjelaskan sumber atau waktunya.
theological_decisions:
- issue: Rujukan 'mereka yang kecil ini'
  choice: Dibiarkan sebagai ungkapan terbuka yang dalam konteks menunjuk kepada murid-murid yang rendah atau dianggap tidak penting.
  alternative: Anak-anak secara harfiah saja; atau hanya orang percaya baru dan lemah.
  rationale: Konteks membahas penerimaan terhadap para murid, tetapi teks tidak menghapus daya gambarnya atau secara eksplisit membatasi kelompok tersebut.
- issue: Makna εἰς ὄνομα μαθητοῦ
  choice: Diterjemahkan secara idiomatis 'karena ia seorang murid'.
  alternative: '''dalam nama seorang murid'' atau ''atas nama seorang murid''.'
  rationale: Frasa itu menyatakan dasar tindakan, yakni identitas penerima sebagai murid. Terjemahan idiomatis menghindari kesan bahwa ini suatu formula ucapan, sementara bentuk formal dicantumkan dalam catatan.
- issue: Identitas pemberi dan penerima dalam pronomina
  choice: '''ia'' merujuk kepada penerima, sedangkan ''orang itu'' memperjelas bahwa janji berlaku bagi pemberi.'
  alternative: Mempertahankan pronomina yang sama tanpa penjelasan, sehingga rujukannya lebih mudah tertukar.
  rationale: Bahasa Yunani menghubungkan identitas murid dengan penerima dan upah dengan pelaku pemberian; perbedaan ungkapan memperjelas struktur tanpa menambah isi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Aku' mengikuti ucapan Yesus. 'Kepadamu' mempertahankan bentuk kolektif Yunani tanpa menambahkan 'kalian'. Semua penanda catatan kaki ditempatkan tepat pada unsur yang diterangkan.
