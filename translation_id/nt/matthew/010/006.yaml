  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: id
  text: Sebaliknya, pergilah kepada domba-domba yang hilang dari kaum Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: pergilah
  rationale: Bentuk imperatif jamak ini menyampaikan perintah untuk pergi; akhiran -lah membuat perintah tersebut alami dan tetap lugas dalam bahasa Indonesia.
- source_word: δὲ μᾶλλον
  choice: Sebaliknya
  rationale: Gabungan ini mengalihkan tujuan para murid secara kontras dari larangan pada ayat sebelumnya. “Sebaliknya” menyampaikan pertentangan dan pengalihan itu secara ringkas dan alami.
- source_word: πρὸς
  choice: kepada
  rationale: Dengan verba gerak, πρός menunjukkan arah atau tujuan. “Kepada” cocok karena tujuan tersebut digambarkan sebagai sekelompok orang melalui metafora domba.
- source_word: τὰ πρόβατα
  choice: domba-domba
  rationale: Bentuk jamak dipertahankan untuk menjaga metafora pastoral yang eksplisit dan kaitan sastrawinya dengan gambaran Kitab Suci.
- source_word: τὰ ἀπολωλότα
  choice: yang hilang
  rationale: Partisip perfek ini dalam metafora domba paling wajar berarti “yang hilang,” tanpa mempersempitnya menjadi sekadar tersesat ataupun memperkerasnya menjadi binasa.
- source_word: οἴκου Ἰσραήλ
  choice: dari kaum Israel
  rationale: Dalam ungkapan korporat ini, “kaum Israel” menyampaikan makna ‘keluarga/umat Israel’ secara alami dan bermartabat; terjemahan harfiah “rumah Israel” kurang lazim dalam bahasa Indonesia modern.
theological_decisions:
- issue: Gambaran metaforis tentang Israel
  choice: Mempertahankan ungkapan “domba-domba yang hilang dari kaum Israel.”
  alternative: orang-orang Israel yang telah tersesat
  rationale: Teks Yunani secara eksplisit memakai metafora domba, yang memiliki bobot sastra dan teologis dari Kitab Suci. Mempertahankannya menghindari penambahan tafsiran.
- issue: Hubungan sintaksis antara “yang hilang” dan “kaum Israel”
  choice: Teks utama memakai susunan yang dapat dipahami sebagai domba-domba hilang yang termasuk dalam kaum Israel.
  alternative: domba-domba yang telah hilang dari kaum Israel
  rationale: Bahasa Yunani memungkinkan pembacaan alternatif bahwa domba-domba itu telah hilang atau terpisah dari kaum Israel. Kemungkinan ini dipertahankan dalam catatan kaki tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Sebaliknya” menyatakan kontras dengan ayat sebelumnya, sedangkan metafora “domba-domba” dan sebutan korporat “kaum Israel” dipertahankan.
