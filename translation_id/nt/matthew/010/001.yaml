    text: 'Atau: “kuasa atas roh-roh najis.” Kata Yunani yang dipakai dapat menunjuk pada wewenang atau hak yang diberikan untuk bertindak.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “setiap penyakit dan setiap kelemahan” menerjemahkan dua kata Yunani yang berkaitan, nosos dan malakia. Bagian terakhir juga dapat diterjemahkan “setiap gangguan kesehatan” atau “setiap kelemahan.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unexpressed qualifier “tubuh” from the rendering of μαλακία and simplifies the summons wording while retaining its movement-toward-Jesus nuance. It preserves the Greek’s paired terms, the authority sense of ἐξουσία, and the open purpose/result force of ὥστε with the Indonesian “untuk.”
