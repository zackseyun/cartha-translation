review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the twelve disciples, the delegated authority over unclean spirits, their expulsion, and the paired healing expression. However, “kelemahan tubuh” adds the explicit qualification “tubuh,” which is not stated in μαλακία and can narrow the broader sense of weakness, infirmity, or sickness.
  naturalness: The sentence is clear and modern. “Memanggil ... untuk datang kepada-Nya” is natural, though the simpler “memanggil ... kepada-Nya” more closely reflects the Greek summons without unnecessary expansion. “Setiap penyakit dan setiap kelemahan” is understandable in standard Indonesian and preserves the source’s two related terms.
  terminology: “Wewenang,” “roh-roh najis,” and “mengusir” are apt, consistent Gospel terminology. Retaining “kelemahan” without “tubuh” avoids an added limitation while allowing the footnote to explain its semantic range.
  issues:
  - severity: medium
    issue: “Kelemahan tubuh” adds a bodily qualifier to μαλακία.
    rationale: Although μαλακία occurs in a healing context and can denote infirmity, the Greek does not explicitly say “body.” “Kelemahan” preserves the lexical distinction from νόσος without adding a qualifier.
  - severity: low
    issue: The footnote’s alternative “setiap gangguan kesehatan” does not preserve the repeated distributive “setiap.”
    rationale: The source has πᾶσαν with each noun. An alternative such as “setiap penyakit dan setiap kelemahan”/“setiap penyakit dan setiap gangguan kesehatan” should retain that repetition if it is offered for the full pair.
  revised_text: Yesus memanggil kedua belas murid-Nya kepada-Nya dan memberi mereka wewenang atas roh-roh najis[a] untuk mengusir roh-roh itu dan menyembuhkan setiap penyakit dan setiap kelemahan.[b]
  revised_footnotes:
