revisions:
- from: Lalu Yesus memanggil kedua belas murid-Nya untuk datang kepada-Nya dan memberi mereka wewenang atas roh-roh najis[a] untuk mengusir roh-roh itu dan menyembuhkan setiap penyakit dan setiap kelemahan tubuh.[b]
  to: Yesus memanggil kedua belas murid-Nya kepada-Nya dan memberi mereka wewenang atas roh-roh najis[a] untuk mengusir roh-roh itu dan menyembuhkan setiap penyakit dan setiap kelemahan.[b]
  rationale: The revision removes the unexpressed qualifier “tubuh” from the rendering of μαλακία and simplifies the summons wording while retaining its movement-toward-Jesus nuance. It preserves the Greek’s paired terms, the authority sense of ἐξουσία, and the open purpose/result force of ὥστε with the Indonesian “untuk.”
  reviewer_model: gpt-5.6-terra
