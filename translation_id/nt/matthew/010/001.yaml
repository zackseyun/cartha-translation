id: MAT.10.1
reference: Matthew 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: id
  text: Yesus memanggil kedua belas murid-Nya kepada-Nya dan memberi mereka wewenang atas roh-roh najis[a] untuk mengusir roh-roh itu dan menyembuhkan setiap penyakit dan setiap kelemahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kuasa atas roh-roh najis.” Kata Yunani yang dipakai dapat menunjuk pada wewenang atau hak yang diberikan untuk bertindak.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “setiap penyakit dan setiap kelemahan” menerjemahkan dua kata Yunani yang berkaitan, nosos dan malakia. Bagian terakhir juga dapat diterjemahkan “setiap gangguan kesehatan” atau “setiap kelemahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil ... untuk datang kepada-Nya
  rationale: Verba aoris medium προσκαλέομαι menyatakan tindakan memanggil atau mengundang seseorang datang kepada diri sendiri. Ungkapan ini mempertahankan nuansa refleksifnya dalam bahasa Indonesia yang alami.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: kedua belas murid-Nya
  rationale: μαθητής secara lazim berarti “murid” dalam konteks Injil, dan αὐτοῦ dinyatakan dengan enklitik posesif “-Nya” yang merujuk kepada Yesus.
- source_word: ἔδωκεν
  choice: memberi
  rationale: δίδωμι secara langsung berarti “memberi”; bentuk ini tidak menambahkan nuansa penafsiran yang tidak diperlukan.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: ἐξουσία menunjuk pada otoritas atau hak untuk bertindak, khususnya wewenang yang diberikan. “Wewenang” membedakannya dari kekuatan semata.
- source_word: πνευμάτων ἀκαθάρτων
  choice: atas roh-roh najis
  rationale: Genitif sesudah ἐξουσία menyatakan objek yang berada di bawah wewenang tersebut. “Roh-roh najis” merupakan padanan yang tepat dan lazim bagi ungkapan Injil ini.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: untuk mengusir roh-roh itu
  rationale: ὥστε dengan infinitif dapat mengandung nuansa tujuan atau hasil; “untuk” mempertahankan keluwesan itu secara alami. Referen αὐτά diperjelas sebagai “roh-roh itu” agar tidak ambigu dalam bahasa Indonesia.
- source_word: θεραπεύειν
  choice: menyembuhkan
  rationale: Dalam konteks penyakit, θεραπεύω berarti menyembuhkan.
- source_word: πᾶσαν νόσον
  choice: setiap penyakit
  rationale: νόσος berarti penyakit; “setiap” mempertahankan bentuk distributif πᾶσαν.
- source_word: πᾶσαν μαλακίαν
  choice: setiap kelemahan tubuh
  rationale: μαλακία dapat berarti kelemahan, kerapuhan, atau keadaan sakit. “Kelemahan tubuh” mempertahankan perbedaannya dari νόσος tanpa memakai istilah Indonesia yang terlalu kuno.
theological_decisions:
- issue: Sifat pemberian kepada kedua belas murid
  choice: Yesus memberi mereka wewenang atas roh-roh najis
  alternative: Yesus memberi mereka kuasa atas roh-roh najis
  rationale: ἐξουσία terutama menyoroti otoritas atau hak yang diberikan untuk bertindak, bukan sekadar daya atau kekuatan. Terjemahan ini mempertahankan gagasan wewenang yang berasal dari Yesus tanpa menambahkan rumusan doktrinal.
- issue: Hubungan ὥστε dengan tindakan mengusir dan menyembuhkan
  choice: diterjemahkan “untuk,” dengan kemungkinan tujuan dan hasil tetap terbuka
  alternative: “sehingga” atau “supaya”
  rationale: Konstruksi ὥστε dengan infinitif tidak harus dipersempit menjadi tujuan murni atau hasil murni. “Untuk” alami dalam bahasa Indonesia dan tidak menutup ketegangan semantis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Istilah “wewenang” dipilih untuk ketepatan semantis, sedangkan dua istilah penyakit dipertahankan agar pasangan kata Yunani tidak dilebur.
