  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: id
  text: 'Dalam perjalananmu, beritakanlah: “Kerajaan surga[b] sudah dekat.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mendekat” atau “sudah datang mendekat.” Verba perfek Yunani menekankan bahwa Kerajaan itu telah mendekat dan keadaan ini tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: Matius secara khas memakai ungkapan “Kerajaan surga”, sedangkan Injil-Injil lain sering memakai “Kerajaan Allah”.
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: Pergilah
  rationale: Partisipel kini yang menyertai imperatif utama dapat berfungsi sebagai tindakan pengiring. Dalam konteks pengutusan ini, bentuk imperatif alami dalam bahasa Indonesia menyampaikan perintah untuk pergi tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: δὲ
  choice: dan
  rationale: Penghubung ringan yang meneruskan rangkaian perintah; “dan” mempertahankan alur tanpa memberi kesan pertentangan.
- source_word: κηρύσσετε
  choice: beritakanlah
  rationale: Imperatif untuk mengumumkan secara terbuka dan berwibawa. “Beritakanlah” alami, jelas, dan tidak membatasi tindakan itu pada khotbah gerejawi.
- source_word: λέγοντες
  choice: tanda titik dua sebelum kutipan
  rationale: Partisipel ini memperkenalkan isi pemberitaan. Dalam bahasa Indonesia modern, titik dua menyampaikan fungsi “dengan berkata” secara alami dan menghindari ungkapan berulang “beritakanlah dengan berkata”.
- source_word: ὅτι
  choice: kutipan langsung
  rationale: ὅτι memperkenalkan isi perkataan; kutipan langsung tanpa padanan leksikal tersendiri merupakan bentuk Indonesia yang alami.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Perfek Yunani menyatakan kedekatan yang telah tiba dan tetap berlaku. “Sudah dekat” mempertahankan hasil kini itu dengan bahasa Indonesia yang wajar.
- source_word: ἡ βασιλεία
  choice: Kerajaan
  rationale: “Kerajaan” merupakan padanan luas yang dapat mencakup pemerintahan maupun ranah kekuasaan tanpa mempersempit maknanya.
- source_word: τῶν οὐρανῶν
  choice: surga
  rationale: Padanan idiomatis bagi bentuk genitif jamak Yunani dan mempertahankan ungkapan khas Matius tanpa menyelaraskannya menjadi “Allah”.
theological_decisions:
- issue: Makna ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan surga
  alternative: pemerintahan surga; Kerajaan Allah
  rationale: Ungkapan khas Matius dipertahankan. “Kerajaan” membiarkan cakupan pemerintahan dan ranah tetap terbuka, sedangkan “surga” tidak diselaraskan dengan ungkapan Injil lain.
- issue: Aspek verba ἤγγικεν
  choice: sudah dekat
  alternative: telah mendekat; dekat
  rationale: Pilihan ini menyampaikan keadaan dekat yang telah tercapai dan masih berlaku, tanpa menentukan lebih jauh bagaimana kedatangan Kerajaan harus dipahami secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Struktur partisipel Yunani dibuat alami sebagai rangkaian imperatif, dan λέγοντες diwakili oleh tanda titik dua yang memperkenalkan kutipan.
