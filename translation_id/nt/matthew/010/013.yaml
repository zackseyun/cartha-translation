id: MAT.10.13
reference: Matthew 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: id
  text: Dan jika rumah itu layak[a], biarlah damaimu datang atasnya; tetapi jika rumah itu tidak layak[b], biarlah damaimu kembali kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah tangga” atau “seisi rumah”; kata Yunani yang berarti “rumah” juga dapat mencakup orang-orang yang tinggal di dalamnya.
    reason: lexical_alternative
  - marker: b
    text: “Layak” di sini berarti patut menerima para utusan dan damai yang mereka bawa, bukan berarti tanpa dosa secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκία
  choice: rumah
  rationale: Padanan langsung yang alami. Dalam konteks ini kata tersebut juga dapat mencakup seisi rumah, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: ἀξία
  choice: layak
  rationale: Mempertahankan penilaian dalam teks tanpa mempersempit maknanya menjadi sekadar 'mau menerima'. Di sini kelayakan berkaitan dengan penerimaan terhadap para utusan dan salam damai mereka.
- source_word: ἐλθάτω
  choice: biarlah ... turun
  rationale: Bentuk imperatif orang ketiga dipertahankan dengan 'biarlah'. 'Turun atasnya' merupakan ungkapan Indonesia yang alami bagi gambaran damai yang datang dan berdiam atas rumah itu.
- source_word: εἰρήνη ὑμῶν
  choice: damaimu
  rationale: Mempertahankan gambaran konkret tentang damai yang dibawa atau diucapkan para murid, tanpa mereduksinya menjadi salam biasa ataupun menjadikannya daya mekanis.
- source_word: ἐπ’ αὐτήν
  choice: atasnya
  rationale: Mencerminkan arah ἐπί dengan akusatif dan mempertahankan rujukan pronominal kepada rumah.
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: biarlah damaimu kembali kepadamu
  rationale: Menyampaikan gerak kembali menuju para murid secara alami dan tetap mempertahankan bentuk imperatif orang ketiga.
- source_word: μὲν ... δὲ
  choice: jika ...; tetapi jika ...
  rationale: Menampilkan struktur kontras Yunani dengan susunan Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Hakikat 'damaimu'
  choice: Dibiarkan sebagai damai milik para murid yang dapat turun atas rumah atau kembali kepada mereka.
  alternative: Menjelaskannya sebagai 'salam damai', 'berkat', atau suatu kuasa rohani yang berpindah.
  rationale: Teks menggambarkan damai secara konkret dalam konteks pengutusan, tetapi tidak menjelaskan mekanismenya. Terjemahan mempertahankan gambaran dan ketegangan teologis itu.
- issue: Makna kelayakan rumah
  choice: Menggunakan 'layak' dan menjelaskan konteksnya dalam catatan kaki.
  alternative: Mengganti dengan 'mau menerima' atau memahami 'layak' sebagai kesempurnaan moral.
  rationale: ἀξία bersifat evaluatif, tetapi konteks mengaitkannya dengan penerimaan terhadap utusan. Catatan mencegah salah paham tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'biarlah' mempertahankan daya imperatif, sedangkan 'damaimu' menjaga gaya ringkas serta gambaran konkret teks sumber.
