base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: id
  text: Jangan memperoleh emas, perak, atau tembaga[a] untuk disimpan dalam ikat pinggang kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perunggu” untuk “tembaga.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, uang yang dibawa dalam ikat pinggang atau dalam pundi-pundi uang yang dikenakan di pinggang.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Jangan memperoleh
  rationale: κτάομαι berarti memperoleh atau mendapatkan. Pilihan ini mempertahankan gagasan bahwa mereka tidak boleh mengusahakan atau menyediakan uang bagi diri sendiri, bukan sekadar tidak membawanya.
- source_word: χρυσὸν
  choice: emas
  rationale: Istilah bahan yang lugas; dalam konteks ini menunjuk pada uang emas.
- source_word: ἄργυρον
  choice: perak
  rationale: Istilah bahan yang lugas; dalam konteks ini menunjuk pada uang perak.
- source_word: χαλκὸν
  choice: tembaga
  rationale: χαλκός dapat berarti tembaga atau perunggu. Dalam daftar uang bersama emas dan perak, “tembaga” wajar untuk mata uang bernilai rendah; alternatif “perunggu” dipertahankan dalam catatan kaki.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: untuk ikat pinggang kalian
  rationale: ζώνη berarti ikat pinggang atau sabuk, yang pada masa itu dapat digunakan untuk menyimpan uang. “Untuk ikat pinggang kalian” mempertahankan konstruksi sumber tanpa memasukkan penjelasan budaya langsung ke dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti jamak “kalian” menyatakan bahwa perintah ditujukan kepada para murid. Urutan penanda catatan kaki diselaraskan secara alfabetis, dan setiap penanda muncul dalam teks utama.
