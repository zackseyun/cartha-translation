  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: id
  text: Namun, ketika mereka menyerahkan kalian, janganlah khawatir[a] tentang bagaimana atau apa yang harus kalian katakan, sebab pada saat itu akan diberikan kepada kalian apa yang harus kalian katakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah cemas tentang bagaimana kalian harus berbicara atau apa yang harus kalian katakan.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk pasif “akan diberikan” tidak menyebut siapa pemberinya dalam ayat ini; ayat berikutnya menyatakan bahwa Roh Bapa berbicara melalui mereka.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, ketika
  rationale: ὅταν menunjuk pada kemungkinan pada masa mendatang, sedangkan δέ menandai peralihan ringan yang secara alami dinyatakan dengan “Namun” dalam konteks ini.
- source_word: παραδῶσιν ὑμᾶς
  choice: mereka menyerahkan kalian
  rationale: παραδίδωμι berarti menyerahkan atau membawa seseorang ke dalam kuasa pihak lain. “Menyerahkan” mempertahankan nuansa hukum dan permusuhan tanpa mempersempit maknanya menjadi “mengkhianati”; “kalian” mencerminkan bentuk jamak ὑμᾶς.
- source_word: μὴ μεριμνήσητε
  choice: janganlah khawatir
  rationale: μεριμνάω di sini menunjuk pada kekhawatiran atau kecemasan menghadapi kesaksian yang akan diberikan. “Janganlah khawatir” jelas, alami, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: πῶς ἢ τί
  choice: bagaimana atau apa
  rationale: Terjemahan ini mempertahankan pembedaan dalam bahasa Yunani antara cara berbicara dan isi perkataan, serta mempertahankan ἤ sebagai “atau”.
- source_word: λαλήσητε
  choice: harus kalian katakan
  rationale: Dalam pertanyaan tak langsung ini, bentuk subjungtif mengacu pada perkataan yang perlu disampaikan. “Harus kalian katakan” lebih alami daripada terjemahan harfiah “harus kalian bicarakan” dan tetap mempertahankan maksudnya.
- source_word: δοθήσεται
  choice: akan diberikan kepada kalian
  rationale: Bentuk pasif futurum dipertahankan agar pemberinya tetap tersirat sebagaimana dalam teks Yunani.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: pada saat itu
  rationale: Ungkapan ini menyatakan waktu ketika pertolongan diperlukan. “Pada saat itu” merupakan padanan Indonesia yang alami bagi idiom tersebut dan mempertahankan kesegeraannya.
- source_word: τί λαλήσητε
  choice: apa yang harus kalian katakan
  rationale: Pengulangan frasa yang sama mempertahankan penekanan dan kesejajaran dalam teks Yunani.
theological_decisions:
- issue: Pelaku ilahi tersirat dalam bentuk pasif δοθήσεται
  choice: Mempertahankan bentuk pasif “akan diberikan” tanpa menyebut pemberinya dalam teks utama.
  alternative: “Allah akan memberikannya kepada kalian” atau “Roh akan memberikannya kepada kalian.”
  rationale: Ayat ini sendiri tidak menyebut Allah atau Roh sebagai pemberi. Ayat berikutnya menjelaskan bahwa Roh Bapa berbicara melalui para murid, sehingga terjemahan ini mempertahankan pengungkapan bertahap dalam teks dan tidak memasukkan penjelasan ayat berikut ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai untuk memperjelas bahwa semua pronomina orang kedua dalam bahasa Yunani berbentuk jamak. Susunan kalimat mempertahankan pengulangan “apa yang harus kalian katakan” dan bentuk pasif teologis tanpa terasa terlalu harfiah.
