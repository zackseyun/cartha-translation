  text: As you enter the house[a], greet it.
translation:
  language: id
  text: Ketika kalian masuk ke rumah itu[a], berilah salam kepada rumah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seisi rumah itu.” Teks Yunani berbunyi “berilah salam kepadanya,” dengan kata ganti yang merujuk kepada rumah itu, kemungkinan sebagai metonimia bagi orang-orang yang tinggal di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Ketika kalian masuk
  rationale: Partisipel kini nominatif jamak berfungsi adverbial terhadap imperatif. Klausa temporal ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktu antara masuk dan memberi salam.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan; kesinambungan wacananya sudah tersampaikan secara alami oleh klausa temporal “Ketika kalian masuk”, tanpa perlu menambahkan pertentangan yang tidak ada.
- source_word: οἰκίαν
  choice: rumah itu
  rationale: οἰκία dapat berarti bangunan rumah atau seisi rumah. Dalam konteks tindakan masuk, makna konkret “rumah” paling langsung, sementara kemungkinan metonimia bagi para penghuninya tetap dipertahankan melalui catatan kaki.
- source_word: ἀσπάσασθε
  choice: berilah salam
  rationale: Imperatif aoris tengah orang kedua jamak ini menyampaikan perintah langsung. “Berilah salam” merupakan ungkapan Indonesia yang jelas, wajar, dan bermartabat.
- source_word: αὐτήν
  choice: kepadanya
  rationale: Pronomina feminin tunggal ini merujuk secara gramatikal kepada οἰκίαν. Bentuk “kepadanya” mempertahankan rujukan tunggal kepada rumah tanpa secara diam-diam menggantinya dengan para penghuni.
theological_decisions:
- issue: Sapaan metonimis kepada rumah atau rujukan eksplisit kepada para penghuninya
  choice: 'Mempertahankan rujukan kepada rumah dalam teks utama: “berilah salam kepadanya”'
  alternative: “berilah salam kepada seisi rumah itu” atau “berilah salam kepada orang-orang di dalamnya”
  rationale: Teks Yunani memakai αὐτήν, pronomina feminin tunggal yang merujuk kepada οἰκίαν. Terjemahan utama mempertahankan bentuk dan ketegangan metonimis itu; kemungkinan bahwa yang dimaksud ialah para penghuni dijelaskan dalam catatan kaki, bukan dimasukkan sebagai penafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak eksplisit “kalian” untuk mencerminkan subjek jamak Yunani. Ungkapan “berilah salam” dipilih karena alami dan tetap bermartabat. Penanda catatan kaki [a] ditempatkan sesudah “rumah itu” untuk menjelaskan cakupan makna οἰκία.
