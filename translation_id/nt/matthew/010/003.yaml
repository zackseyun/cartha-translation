  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Lebeus” (atau “Lebeus yang disebut Tadeus”), sedangkan daftar para rasul dalam Lukas pada tempat yang bersesuaian mencantumkan Yudas yang dikaitkan dengan Yakobus.
