lexical_decisions:
- source_word: Φίλιππος
  choice: Filipus
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: Βαρθολομαῖος
  choice: Bartolomeus
  rationale: Transliterasi Indonesia yang baku untuk nama pribadi ini.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Bentuk Indonesia modern yang lazim untuk nama pribadi ini.
- source_word: Μαθθαῖος
  choice: Matius
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ τελώνης
  choice: pemungut pajak
  rationale: Ungkapan modern dan jelas yang mencakup orang yang memungut pajak atau bea; lebih wajar daripada istilah lama 'pemungut cukai' dalam konteks umum.
- source_word: Ἰάκωβος
  choice: Yakobus
  rationale: Bentuk konvensional bahasa Indonesia untuk Ἰάκωβος dalam konteks Perjanjian Baru.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: anak Alfeus
  rationale: Konstruksi genitif menyatakan hubungan keturunan; 'anak Alfeus' ringkas, jelas, dan alami dalam daftar nama.
- source_word: Ἁλφαίου
  choice: Alfeus
  rationale: Bentuk transliterasi Indonesia yang lazim untuk nama ini.
- source_word: Θαδδαῖος
  choice: Tadeus
  rationale: Menerjemahkan langsung bacaan SBLGNT Θαδδαῖος dengan bentuk nama Indonesia yang lazim; varian naskah dicatat dalam catatan kaki.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi sederhana dalam daftar Yunani dengan konjungsi Indonesia yang alami.
theological_decisions:
- issue: Identitas rasul terakhir dalam daftar
  choice: Tadeus
  alternative: Lebeus; Lebeus yang disebut Tadeus; Yudas anak Yakobus
  rationale: Teks dasar SBLGNT berbunyi Θαδδαῖος, sehingga teks utama memakai 'Tadeus'. Varian naskah dan nama dalam daftar paralel Lukas dipertahankan dalam catatan kaki tanpa menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan berpasangan dari teks Yunani dipertahankan. Aposisi 'pemungut pajak' dipisahkan dengan koma agar jelas menerangkan Matius.
