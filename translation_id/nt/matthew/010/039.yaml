  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: id
  text: Orang yang menemukan hidupnya akan kehilangannya,[a] dan orang yang kehilangan hidupnya demi Aku akan menemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwanya” dalam kedua klausa. Kata Yunani ψυχή dapat berarti “hidup” atau “jiwa”; dalam konteks ini, “hidup” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: orang yang mempertahankan
  rationale: Secara harfiah berarti ‘orang yang menemukan’. Namun, dalam paradoks ini, ‘menemukan hidup’ berarti memperoleh atau mengamankan hidup bagi diri sendiri. ‘Mempertahankan’ mengungkapkan maksud kontekstual itu dalam bahasa Indonesia yang alami, sementara bentuk ‘orang yang’ mempertahankan daya generik partisip substantival.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: hidupnya
  rationale: Dalam konteks pemuridan dan ancaman kehilangan nyawa, ψυχή menunjuk pada hidup atau nyawa seseorang, bukan secara khusus jiwa sebagai unsur tak berjasmani. ‘Hidupnya’ juga memungkinkan pengulangan yang alami dalam kedua klausa.
- source_word: ἀπολέσει αὐτήν
  choice: akan kehilangannya
  rationale: Bentuk mendatang ἀπολέσει di sini menyatakan kehilangan, bukan pemusnahan. Akhiran ‘-nya’ mempertahankan rujukan tunggal kepada hidup tersebut.
- source_word: ὁ ἀπολέσας
  choice: orang yang kehilangan
  rationale: Walaupun partisipnya berbentuk aoris, konstruksi pepatah ini mempunyai daya umum. Bentuk kini ‘kehilangan’ paling alami dalam bahasa Indonesia sebelum verba mendatang ‘akan mendapatkan’.
- source_word: ἕνεκεν ἐμοῦ
  choice: demi Aku
  rationale: Frasa ini menyatakan sebab atau motif yang berpusat pada kesetiaan kepada Yesus. ‘Demi Aku’ ringkas, wajar, dan mempertahankan penekanan pribadi; huruf kapital mengikuti kebiasaan ejaan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: εὑρήσει αὐτήν
  choice: akan mendapatkannya
  rationale: Secara leksikal berarti ‘akan menemukannya’, tetapi setelah ‘kehilangan hidup’, bahasa Indonesia lebih alami memakai ‘mendapatkannya’ untuk pemulihan atau perolehan hidup. Pilihan ini tetap mempertahankan paradoks memperoleh apa yang dilepaskan.
theological_decisions:
- issue: Makna ψυχή dalam paradoks pemuridan
  choice: hidup
  alternative: jiwa; nyawa
  rationale: Ayat ini terutama berbicara tentang upaya mempertahankan hidup dan kesediaan kehilangan hidup karena kesetiaan kepada Yesus. ‘Hidup’ mempertahankan cakupan yang lebih luas daripada sekadar kematian jasmani, sedangkan ‘jiwa’ dapat menyiratkan dikotomi tubuh-jiwa yang tidak dituntut konteks. Alternatif leksikal tetap dicatat dalam catatan kaki.
- issue: Hubungan retoris εὑρίσκω pada awal dan akhir ayat
  choice: mempertahankan ... mendapatkan
  alternative: menemukan ... menemukan
  rationale: Terjemahan harfiah ‘menemukan hidupnya’ terdengar kurang jelas dan dapat menyesatkan dalam bahasa Indonesia. Pasangan ‘mempertahankan ... mendapatkan’ menyampaikan arah paradoks tanpa meniadakan ketegangan antara penyelamatan diri dan penyerahan diri demi Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa yang sejajar dipertahankan. ‘Orang yang’ dipakai sebagai bentuk generik yang alami tanpa menambahkan pembedaan gender yang tidak perlu; pronomina objek tetap tunggal melalui akhiran ‘-nya’.
