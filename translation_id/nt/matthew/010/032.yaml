  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: id
  text: Karena itu, siapa pun yang mengakui Aku[a] di hadapan manusia, Aku pun akan mengakuinya[b] di hadapan Bapa-Ku yang di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bahasa Yunani berbunyi “mengaku di dalam Aku”; dalam konteks ini maksudnya mengakui Yesus secara terbuka.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mengaku di dalam dia” atau “mengaku berkenaan dengan dia.” Ungkapan ini sejajar dengan ungkapan pada bagian pertama ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Karena itu, siapa pun yang
  rationale: Gabungan Πᾶς dan ὅστις menyatakan cakupan umum dan inklusif; “siapa pun yang” merupakan ungkapan Indonesia yang alami. οὖν diterjemahkan “Karena itu” untuk mempertahankan hubungan kesimpulan dengan konteks sebelumnya.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: mengakui Aku
  rationale: Dalam konteks ini ὁμολογέω menunjuk pada pengakuan terbuka terhadap Yesus. Bahasa Indonesia secara idiomatis memakai objek langsung, sedangkan bentuk Yunani yang tidak lazim dengan ἐν dicatat dalam catatan kaki.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di hadapan manusia
  rationale: ἔμπροσθεν berarti “di hadapan” atau “di hadirat.” ἀνθρώπων di sini merujuk secara umum kepada manusia, sehingga “manusia” akurat tanpa membatasi rujukan pada laki-laki.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: Aku pun akan mengakuinya
  rationale: Pemakaian “mengakui” dipertahankan untuk mencerminkan pengulangan ὁμολογέω. κἀγώ diberi tekanan timbal balik melalui “Aku pun,” dan ἐν αὐτῷ diterjemahkan secara idiomatis dengan akhiran objek “-nya”; bentuk harfiahnya dicatat.
- source_word: ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: di hadapan Bapa-Ku yang di surga
  rationale: Terjemahan ini mempertahankan bahasa relasional “Bapa-Ku” dan makna lokatif ungkapan khas Matius. Walaupun οὐρανοῖς berbentuk jamak, “surga” adalah ungkapan Indonesia yang alami.
theological_decisions:
- issue: Pengakuan terbuka terhadap Yesus dan pengakuan timbal balik oleh Yesus
  choice: Ayat diterjemahkan sebagai janji pengakuan timbal balik di hadapan Bapa tanpa menambahkan kerangka doktrinal lain.
  alternative: Menafsirkannya secara khusus sebagai pernyataan forensik pada penghakiman terakhir, atau terutama sebagai bahasa pemuridan pada masa kini.
  rationale: Teks menyatakan tindakan timbal balik itu, tetapi tidak secara eksplisit menentukan seluruh waktu, mekanisme keselamatan, atau kerangka penghakimannya.
- issue: Nuansa konstruksi ὁμολογέω dengan ἐν
  choice: Gunakan bentuk Indonesia yang idiomatis dalam teks utama dan pertahankan bentuk Yunani yang tidak lazim dalam catatan kaki.
  alternative: Terjemahkan secara harfiah “mengaku di dalam Aku” dan “mengaku di dalam dia.”
  rationale: Terjemahan harfiah akan kabur dan tidak alami dalam bahasa Indonesia, tetapi konstruksi sumber cukup penting dan ambigu sehingga tidak boleh dihilangkan tanpa catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Siapa pun” memberi bentuk umum yang alami, “di hadapan” mempertahankan suasana publik dan formal, dan kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan Alkitab bahasa Indonesia.
