id: MAT.10.25
reference: Matthew 10:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: id
  text: Cukuplah bagi seorang murid untuk menjadi seperti gurunya, dan bagi seorang budak untuk menjadi seperti tuannya. Jika mereka menyebut kepala rumah tangga itu Beelzebul[a], apalagi anggota rumah tangganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Beelzebub”, bentuk nama varian yang lazim dalam tradisi.
    reason: Mencatat bentuk varian/tradisional tanpa menggantikan bentuk Βεελζεβούλ dalam teks sumber.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Cukuplah
  rationale: Mempertahankan ungkapan kecukupan yang ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: μαθητῇ
  choice: seorang murid
  rationale: “Murid” mempertahankan hubungan pembelajaran dan pengikutan yang menonjol dalam konteks Injil.
- source_word: ἵνα γένηται
  choice: untuk menjadi
  rationale: Menyampaikan konstruksi ἵνα sesudah ἀρκετόν secara alami tanpa menetapkan secara berlebihan apakah nuansanya terutama tujuan atau hasil.
- source_word: διδάσκαλος
  choice: gurunya
  rationale: Dalam pasangan murid-guru, “guru” merupakan padanan yang paling jelas dan membedakannya dari κύριος.
- source_word: δοῦλος
  choice: budak
  rationale: Konteks membandingkan status sosial δοῦλος dengan κύριος; “budak” mempertahankan hubungan ketundukan yang lebih kuat daripada “pelayan”.
- source_word: κύριος
  choice: tuannya
  rationale: Dalam analogi budak dan pemilik ini, κύριος berfungsi dalam arti sosial, bukan sebagai gelar ilahi yang eksplisit.
- source_word: οἰκοδεσπότην
  choice: tuan rumah
  rationale: Padanan alami untuk kepala atau penguasa sebuah rumah tangga, sekaligus mempertahankan kaitan dengan οἰκιακούς.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Mengikuti bentuk nama dalam teks Yunani SBLGNT; bentuk tradisional “Beelzebub” dicatat dalam catatan kaki.
- source_word: ἐπεκάλεσαν
  choice: menyebut ... itu
  rationale: Dalam konteks ini verba tersebut berarti menyebut atau menjuluki seseorang dengan suatu nama.
- source_word: πόσῳ μᾶλλον
  choice: apalagi
  rationale: Ungkapan Indonesia yang wajar untuk argumen a fortiori “betapa lebih lagi”.
- source_word: οἰκιακοὺς
  choice: orang-orang seisi rumahnya
  rationale: Mencakup para anggota rumah tangga secara luas, tidak terbatas pada budak atau pelayan.
theological_decisions:
- issue: Arti κύριος dalam analogi rumah tangga
  choice: tuan
  alternative: Tuhan
  rationale: Paralel langsung dengan δοῦλος menunjukkan relasi sosial budak-tuan; menerjemahkannya “Tuhan” akan memasukkan penekanan kristologis yang tidak dinyatakan secara langsung dalam klausa ini.
- issue: Arti δοῦλος
  choice: budak
  alternative: pelayan
  rationale: Kontras hierarkis dengan κύριος membuat status perbudakan menonjol; “pelayan” berpotensi memperlunak hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel murid-guru dan budak-tuan dipertahankan; “apalagi” dipilih agar penalaran perbandingan terdengar alami.
