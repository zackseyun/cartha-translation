  to: Cukuplah bagi seorang murid untuk menjadi seperti gurunya, dan bagi seorang budak untuk menjadi seperti tuannya. Jika mereka menyebut kepala rumah tangga itu Beelzebul[a], apalagi anggota rumah tangganya.
