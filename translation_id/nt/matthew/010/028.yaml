id: MAT.10.28
reference: Matthew 10:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: id
  text: Janganlah takut kepada mereka yang membunuh tubuh, tetapi tidak mampu membunuh jiwa. Sebaliknya, takutlah kepada dia yang mampu membinasakan baik jiwa maupun tubuh di Gehena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di neraka.” Yunani: “di Gehena,” istilah yang berasal dari nama Lembah Hinom dan digunakan untuk menyebut tempat penghakiman terakhir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: takut / takutlah
  rationale: Pengulangan verba dipertahankan dalam kedua klausa untuk menjaga antitesis dan daya peringatannya. Bentuk imperatif alami dalam bahasa Indonesia memerlukan partikel -lah pada perintah positif.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: kepada mereka yang membunuh
  rationale: Partisipel berartikel menunjuk pada kelompok secara umum; ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada tindakan yang sedang berlangsung.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan langsung dan lazim bagi tubuh jasmani.
- source_word: ψυχήν
  choice: jiwa
  rationale: Dalam pertentangannya dengan tubuh, 'jiwa' mempertahankan pembedaan yang dinyatakan teks. 'Nyawa' atau 'hidup' akan mengaburkan pertentangan tersebut.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: tidak mampu membunuh
  rationale: Mencerminkan penekanan teks pada ketidakmampuan, sekaligus tetap lugas dalam bahasa Indonesia.
- source_word: μᾶλλον
  choice: sebaliknya
  rationale: 'Menandai koreksi dan kontras: bukan takut kepada pihak pertama, melainkan kepada pihak berikutnya. Ini lebih alami daripada terjemahan harfiah ''lebih'' dalam konteks ini.'
- source_word: τὸν δυνάμενον
  choice: Dia yang mampu
  rationale: Menerjemahkan partisipel substantival tanpa menambahkan nama atau identitas eksplisit. Kapitalisasi memberi bentuk pronominal yang wajar bagi rujukan personal dalam konteks, tetapi tidak menyisipkan nama ke dalam teks.
- source_word: ἀπολέσαι
  choice: membinasakan
  rationale: Menyampaikan kehancuran atau kebinasaan dalam penghakiman secara tegas tanpa merinci mekanisme metafisiknya.
- source_word: ἐν γεέννῃ
  choice: di Gehena
  rationale: Transliterasi mempertahankan istilah Yunani yang berlatar Lembah Hinom dan tidak langsung menggantikannya dengan istilah teologis tradisional yang lebih luas.
theological_decisions:
- issue: Identitas 'Dia yang mampu membinasakan baik jiwa maupun tubuh di Gehena'
  choice: Identitas tidak disebutkan secara eksplisit dalam teks utama.
  alternative: Allah; Iblis
  rationale: Konteks paling wajar menunjuk kepada Allah sebagai pemegang wewenang penghakiman terakhir, tetapi ungkapan Yunani tidak menyebut nama referennya. Terjemahan mempertahankan ketakterusterangan itu.
- issue: Penerjemahan γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Transliterasi mengutamakan bentuk dan latar istilah sumber. Padanan interpretatif yang lazim dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. Struktur antitesis dipertahankan. 'Baik ... maupun ...' menyatakan dengan jelas cakupan atas jiwa dan tubuh. Penanda catatan kaki ditempatkan langsung sesudah 'Gehena' karena catatan menjelaskan istilah tersebut.
