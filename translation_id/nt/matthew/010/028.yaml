review_pass:
  verdict: revise
  source_fidelity: Struktur utama, pengulangan takut, kontras tubuh/jiwa, ketidakmampuan manusia, dan cakupan “jiwa maupun tubuh” sudah setia pada Yunani. Namun, kapitalisasi “Dia” secara konvensional mengidentifikasi referen sebagai Allah, sedangkan τὸν δυνάμενον tidak menyebut identitasnya secara eksplisit. Bentuk huruf kecil mempertahankan ketakterusterangan sumber.
  naturalness: Teksnya lugas dan baku. “Sebaliknya, takutlah” merupakan kontras yang alami untuk μᾶλλον dalam konteks ini. Catatan kaki diperhalus agar hubungan istilah Gehena dengan tempat penghakiman dinyatakan lebih idiomatis.
  terminology: “Tubuh,” “jiwa,” “membinasakan,” dan “Gehena” merupakan padanan yang sesuai. “Gehena” mempertahankan istilah Yunani; alternatif “neraka” tepat ditempatkan dalam catatan kaki.
  issues:
  - severity: medium
    issue: Kapitalisasi “Dia” dalam “kepada Dia yang mampu”
    rationale: Dalam pemakaian Indonesia, kapitalisasi pronomina ini biasanya menandai Allah. Karena teks Yunani hanya menyatakan “yang mampu” tanpa menyebut identitasnya, kapitalisasi tersebut mempersempit ambiguitas sumber.
  - severity: low
    issue: Redaksi catatan kaki “digunakan untuk tempat penghakiman terakhir”
    rationale: Redaksi ini kurang idiomatis; istilah tersebut lebih tepat dikatakan “digunakan untuk menyebut tempat” penghakiman terakhir.
