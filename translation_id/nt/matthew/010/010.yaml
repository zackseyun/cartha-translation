id: MAT.10.10
reference: Matthew 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: id
  text: Jangan membawa tas bekal untuk perjalanan,[a] atau dua helai tunik, atau sandal, atau tongkat, sebab seorang pekerja layak mendapat makanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian orang memahami larangan membawa “tongkat” sebagai larangan membawa tongkat tambahan, terutama karena Markus 6:8 mengizinkan para murid membawa tongkat.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: tas bekal
  rationale: Kata πήρα menunjuk pada tas yang dibawa dalam perjalanan, khususnya untuk membawa bekal. “Tas bekal” alami dalam bahasa Indonesia dan mempertahankan fungsi konkretnya.
- source_word: εἰς ὁδὸν
  choice: untuk perjalanan
  rationale: Ungkapan ini menyatakan sesuatu yang dibawa sebagai perlengkapan perjalanan; “untuk perjalanan” jelas dan wajar dalam bahasa Indonesia.
- source_word: δύο χιτῶνας
  choice: dua helai tunik
  rationale: χιτών adalah pakaian dasar pada zaman itu. “Tunik” mempertahankan ketepatan historis, sedangkan penggolong “helai” membuat frasa alami.
- source_word: ὑποδήματα
  choice: sandal
  rationale: Dalam konteks abad pertama, ὑπόδημα paling tepat merujuk pada alas kaki berupa sandal.
- source_word: ῥάβδον
  choice: tongkat
  rationale: ῥάβδος di sini adalah tongkat yang dipakai dalam perjalanan. “Tongkat” merupakan padanan Indonesia yang ringkas dan alami tanpa menyelaraskan ayat ini dengan Markus 6:8.
- source_word: ἄξιος
  choice: layak mendapat
  rationale: Frasa ini menyampaikan makna bahwa pekerja patut atau berhak menerima makanan, sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: ὁ ἐργάτης
  choice: seorang pekerja
  rationale: ἐργάτης berarti orang yang bekerja. Bentuk generik “seorang pekerja” jelas dan tidak memasukkan istilah gerejawi teknis.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: mendapat makanannya
  rationale: τροφή secara langsung berarti makanan atau nutrisi. Terjemahan ini mempertahankan gambaran konkret, bukan memperluasnya menjadi “dukungan” atau “nafkah”.
theological_decisions:
- issue: Kemungkinan penyelarasan dengan kisah sejajar mengenai perlengkapan perjalanan yang diizinkan
  choice: Mempertahankan larangan membawa “tongkat” dalam teks utama sesuai bunyi Matius.
  alternative: Menafsirkan larangan itu sebagai larangan membawa tongkat tambahan, terutama dengan mempertimbangkan Markus 6:8.
  rationale: Teks Yunani Matius secara langsung mencantumkan ῥάβδον di antara barang yang tidak boleh dibawa. Ketegangan dengan Markus 6:8 dipertahankan dan dijelaskan dalam catatan, bukan diselesaikan secara diam-diam dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Istilah historis “tunik” dipertahankan; susunan kalimat dibuat mudah dipahami pembaca umum.
