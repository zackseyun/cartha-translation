id: MAT.10.37
reference: Matthew 10:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: id
  text: Orang yang mengasihi ayah atau ibu lebih daripada Aku tidak layak bagi-Ku; dan orang yang mengasihi anak laki-laki atau anak perempuan lebih daripada Aku tidak layak bagi-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: orang yang mengasihi
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang dicirikan oleh tindakan mengasihi. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: πατέρα ἢ μητέρα
  choice: ayah atau ibu
  rationale: Nomina relasional tanpa artikel diterjemahkan langsung tanpa menambahkan kata ganti kepunyaan yang tidak dinyatakan dalam teks Yunani.
- source_word: ὑπὲρ ἐμέ
  choice: lebih daripada Aku
  rationale: Dalam konstruksi perbandingan ini, ὑπέρ menyatakan kasih atau penghargaan yang lebih besar kepada seseorang daripada kepada Yesus. Bentuk ini jelas dan tetap mempertahankan perbandingan langsung.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: tidak layak bagi-Ku
  rationale: Ungkapan ini mempertahankan hubungan ἄξιος dengan genitif μου secara alami dalam bahasa Indonesia tanpa menambahkan gagasan eksplisit tentang menjadi milik atau kecakapan yang tidak dinyatakan dalam teks.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi sederhana ini mempertahankan susunan paralel kedua bagian ayat.
- source_word: υἱὸν ἢ θυγατέρα
  choice: anak laki-laki atau anak perempuan
  rationale: Kedua nomina relasional diterjemahkan secara langsung dan jelas tanpa menambahkan kata ganti kepunyaan.
theological_decisions:
- issue: Tuntutan Yesus dalam kaitannya dengan kasih dan kesetiaan kepada keluarga
  choice: Ayat diterjemahkan sebagai tuntutan agar kasih kepada Yesus memiliki prioritas tertinggi, bahkan di atas ikatan keluarga terdekat.
  alternative: Melunakkan perbandingan menjadi sekadar mengasihi Yesus sama banyaknya, atau memperkerasnya menjadi perintah membenci keluarga.
  rationale: Bahasa Yunani menyatakan perbandingan melalui ὑπὲρ ἐμέ dan menghubungkannya dengan penilaian tentang kelayakan. Terjemahan mempertahankan tuntutan yang tegas tanpa menyangkal kebaikan kasih keluarga atau memasukkan bahasa yang lebih keras dari bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Aku” dan akhiran “-Ku” memakai huruf kapital karena dalam konteks ini penuturnya adalah Yesus. Pengulangan struktur dipertahankan untuk mencerminkan paralelisme teks Yunani.
