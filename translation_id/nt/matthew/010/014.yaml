  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: id
  text: Jika ada orang yang tidak menerima kamu atau tidak mendengarkan perkataanmu[a], ketika kamu keluar dari rumah itu atau kota itu[b], kebaskanlah debu dari kakimu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mendengar perkataanmu.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “kota” juga dapat menunjuk sebuah kota kecil atau permukiman.
    reason: lexical_alternative
  - marker: c
    text: Mengibaskan debu dari kaki merupakan tindakan simbolis untuk memutuskan hubungan dan menyatakan penghakiman terhadap orang-orang yang menolak berita itu.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: siapa pun yang tidak
  rationale: Konstruksi relatif dengan ἄν bersifat tak tentu dan umum. Ungkapan ini langsung dan wajar dalam bahasa Indonesia serta mempertahankan arti ‘barang siapa’ tanpa kesan kuno.
- source_word: δέξηται ὑμᾶς
  choice: menerima kamu
  rationale: δέχομαι dalam konteks ini mencakup penerimaan terhadap para utusan, termasuk penyambutan dan penerimaan atas misi mereka. ‘Menerima’ mempertahankan keluasan makna itu.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: atau tidak mendengarkan perkataanmu
  rationale: ἀκούω dapat berarti mendengar atau mendengarkan. Dalam konteks penolakan terhadap berita para murid, ‘mendengarkan’ menyiratkan perhatian tanpa mempersempit maknanya menjadi menaati. Bentuk ‘perkataanmu’ alami dalam bahasa Indonesia dan mempertahankan λόγους.
- source_word: ἐξερχόμενοι ἔξω
  choice: ketika kamu keluar dari
  rationale: Partisipel ἐξερχόμενοι bersama ἔξω menyatakan tindakan keluar yang menyertai perintah utama. ‘Ketika kamu keluar dari’ mempertahankan hubungan waktunya dan unsur gerak keluar.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: rumah atau kota itu
  rationale: Terjemahan ini mempertahankan dua kemungkinan tempat yang disebut teks dan daya tunjuk ἐκείνης. ‘Kota’ adalah padanan Indonesia yang lazim bagi πόλις, meskipun istilah Yunani itu tidak selalu menunjuk pusat perkotaan besar.
- source_word: ἐκτινάξατε
  choice: kebaskanlah
  rationale: Kata kerja ini menggambarkan tindakan menyingkirkan debu dengan gerakan kuat. ‘Kebaskanlah’ konkret, ringkas, dan wajar untuk debu pada kaki.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: debu dari kakimu
  rationale: κονιορτός secara khusus berarti debu, sedangkan bentuk genitif menunjukkan debu yang disingkirkan dari kaki. Ungkapan Indonesia ini mempertahankan gambaran konkretnya.
theological_decisions:
- issue: Tindakan simbolis terhadap orang yang menolak para murid dan berita mereka
  choice: Mempertahankan perintah konkret ‘kebaskanlah debu dari kakimu’ dalam teks utama.
  alternative: Menambahkan tafsiran seperti ‘sebagai kesaksian terhadap mereka’ atau memparafrasakannya sebagai pernyataan penghukuman.
  rationale: Ayat ini sendiri menyebut tindakan simbolis tersebut tanpa menjelaskan maknanya secara eksplisit. Terjemahan tidak memasukkan kata-kata dari perikop sejajar atau mengubah lambang itu menjadi tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘kamu’ dipertahankan karena Yesus berbicara kepada para murid secara jamak; bahasa Indonesia tidak wajib menandai jumlah pada bentuk ini. Susunan kalimat mengikuti alur teks Yunani tanpa menjadi kaku.
