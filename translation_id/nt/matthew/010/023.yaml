id: MAT.10.23
reference: Matthew 10:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: id
  text: 'Namun, setiap kali mereka menganiaya kalian di kota ini, larilah ke kota yang lain.[a] Sesungguhnya Aku berkata kepada kalian: kalian sama sekali tidak akan selesai mendatangi kota-kota Israel[b] sampai Anak Manusia datang.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke yang lain,” dengan kata “kota” dipahami dari klausa sebelumnya. Dapat juga diterjemahkan “ke kota berikutnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kalian sama sekali tidak akan menyelesaikan kota-kota Israel.” Kata “mendatangi” menjelaskan perjalanan pelayanan yang tersirat dalam konteks.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “sampai Anak Manusia datang” sengaja dibiarkan terbuka. Ada yang memahaminya sebagai pembenaran Yesus, kedatangan dalam penghakiman, atau kedatangan-Nya yang terakhir.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: setiap kali
  rationale: Mencerminkan klausa waktu tak tentu yang dapat berlaku berulang kali atau sewaktu-waktu, bukan hanya satu kejadian tertentu.
- source_word: διώκωσιν
  choice: mereka menganiaya
  rationale: Dalam konteks pengutusan ini, kata tersebut menunjuk pada tindakan bermusuhan berupa penganiayaan, bukan sekadar pengejaran.
- source_word: πόλει ταύτῃ
  choice: di kota ini
  rationale: Mempertahankan demonstrativa proksimal dan kelangsungan instruksi Yesus.
- source_word: φεύγετε
  choice: larilah
  rationale: Bentuk imperatif ini menuntut keberangkatan segera ketika penganiayaan terjadi; 'larilah' alami dan tegas dalam bahasa Indonesia.
- source_word: εἰς τὴν ἑτέραν
  choice: ke kota yang lain
  rationale: Kata 'kota' tersirat dari klausa sebelumnya. 'Kota yang lain' mempertahankan ketaktertentuan ἑτέραν tanpa memaksakan arti urutan 'kota berikutnya'.
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Menyampaikan formula pembuka pernyataan yang khidmat dan berwibawa dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: οὐ μὴ τελέσητε
  choice: kalian pasti belum selesai mendatangi
  rationale: Kata 'pasti' menyampaikan negasi Yunani yang sangat tegas. 'Mendatangi' mengungkapkan kegiatan perjalanan pelayanan yang tersirat oleh objek kota-kota, sementara 'belum selesai' sesuai dengan batas waktu yang menyusul.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: kota-kota Israel
  rationale: Ungkapan genitif ini secara alami menunjuk pada kota-kota di Israel atau milik umat Israel tanpa mempersempit rujukannya lebih jauh.
- source_word: ἕως ἂν ἔλθῃ
  choice: sampai ... datang
  rationale: Mempertahankan konstruksi temporal yang menunjuk pada batas mendatang sebelum tindakan tersebut selesai.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku yang mempertahankan bentuk harfiah serta resonansi teologis dan Danieliknya.
theological_decisions:
- issue: Makna kedatangan Anak Manusia dalam konteks ini
  choice: Mempertahankan ungkapan 'sampai Anak Manusia datang' tanpa menentukan peristiwa yang dimaksud.
  alternative: Menafsirkannya secara eksplisit sebagai kebangkitan dan pembenaran Yesus, penghakiman atas Yerusalem, atau kedatangan-Nya yang terakhir.
  rationale: Teks Yunani tidak menentukan secara tegas peristiwa mana yang dimaksud. Terjemahan karena itu mempertahankan ketegangan eskatologis dan tidak memasukkan skema tafsir tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa ὑμᾶς dan ὑμῖν bersifat jamak; 'Aku' mengikuti kebiasaan penulisan ucapan Yesus. Struktur kalimat dijaga lugas, sedangkan ambiguitas eskatologis tetap dipertahankan.
