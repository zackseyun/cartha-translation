id: MAT.10.29
reference: Matthew 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: id
  text: Bukankah dua ekor burung pipit dijual seharga satu asarion?[a] Namun, tidak seekor pun dari keduanya akan jatuh ke tanah tanpa Bapamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asarion adalah uang logam tembaga Romawi yang nilainya sangat rendah.
    reason: cultural_note
  - marker: b
    text: Atau “terlepas dari Bapamu.” Ungkapan Yunani ini dapat menyiratkan bahwa hal itu tidak terjadi di luar pengetahuan, pemeliharaan, atau kehendak Bapa, tetapi tidak menyebutkan secara khusus yang mana.
    reason: alternative_reading
lexical_decisions:
- source_word: στρουθία
  choice: burung pipit
  rationale: Dalam konteks ini, kata tersebut lazim dipahami sebagai burung pipit, bukan sekadar burung kecil secara umum.
- source_word: ἀσσαρίου
  choice: satu asarion
  rationale: Mempertahankan nama uang logam Romawi ini menjaga kekhususan historis; nilainya dijelaskan dalam catatan kaki.
- source_word: πωλεῖται
  choice: dijual
  rationale: Bentuk pasif kini dalam bahasa Yunani diterjemahkan secara alami dengan bentuk pasif Indonesia.
- source_word: ἓν ἐξ αὐτῶν
  choice: seekor pun dari keduanya
  rationale: Ungkapan ini mempertahankan acuan kepada dua burung sekaligus menyampaikan penekanan negatif secara wajar dalam bahasa Indonesia.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: akan jatuh ke tanah
  rationale: Padanan alami yang mempertahankan bentuk mendatang dan arah jatuhnya burung.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: tanpa Bapamu
  rationale: Terjemahan ini dekat dengan susunan Yunani dan tidak mempersempit maknanya menjadi hanya pengetahuan, kehendak, izin, atau pemeliharaan Bapa.
- source_word: οὐχὶ ... ;
  choice: Bukankah ...?
  rationale: Bentuk pertanyaan retoris ini mengharapkan jawaban ya dan diterjemahkan secara alami dengan 'Bukankah'.
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks ini, kata penghubung tersebut menonjolkan kontras antara rendahnya nilai burung-burung itu dan perhatian Bapa terhadap seekor pun.
theological_decisions:
- issue: Makna frasa 'tanpa Bapamu' dalam kaitannya dengan pemeliharaan ilahi
  choice: Mempertahankan ungkapan luas 'tanpa Bapamu'.
  alternative: tanpa sepengetahuan Bapamu; tanpa kehendak Bapamu
  rationale: Ayat ini menegaskan keterlibatan Bapa, tetapi teks Yunani tidak menentukan apakah yang dimaksud secara khusus ialah pengetahuan, kehendak, izin, kehadiran, atau pemeliharaan-Nya. Karena itu, terjemahan utama tidak memilih salah satu penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk 'Bapamu' mempertahankan sapaan tunggal secara gramatikal kepada komunitas melalui bentuk Indonesia yang alami, sedangkan 'asarion' menjaga latar historis dan dijelaskan lewat catatan kaki.
