base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: id
  text: Seorang murid tidak lebih tinggi daripada gurunya, dan seorang budak[a] pun tidak lebih tinggi daripada tuannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba” untuk “budak”; kata Yunani δοῦλος dapat merujuk kepada budak atau hamba, bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani κύριος juga dapat diterjemahkan “Tuhan”, tetapi di sini menunjuk kepada seorang tuan manusia dalam analogi ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: murid
  rationale: “Murid” mempertahankan makna relasional sebagai orang yang belajar dan mengikuti seorang guru, serta lebih alami daripada istilah yang hanya bernuansa akademis.
- source_word: ὑπέρ
  choice: lebih tinggi daripada
  rationale: Dengan bentuk akusatif, ὑπέρ menyatakan keunggulan dalam kedudukan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan perbandingan tanpa mempersempit maknanya.
- source_word: διδάσκαλος
  choice: guru
  rationale: “Guru” merupakan padanan langsung dan jelas, sekaligus membedakannya dari pasangan budak–tuan pada klausa kedua.
- source_word: δοῦλος
  choice: budak
  rationale: Dalam analogi status sosial ini, “budak” paling jelas mempertahankan hubungan ketundukan dan kepemilikan yang tersirat dalam pasangan δοῦλος–κύριος.
- source_word: κύριος
  choice: tuan
  rationale: Dalam pasangan dengan δοῦλος, kata ini menunjuk kepada atasan atau pemilik manusia, bukan gelar ilahi; “tuan” paling sesuai dengan konteks.
- source_word: αὐτοῦ
  choice: -nya
  rationale: Akhiran posesif “-nya” secara alami menyatakan bahwa yang dimaksud adalah tuan dari budak tersebut tanpa menambahkan penentuan gender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: οὐδέ
  choice: dan ... tidak
  rationale: Bentuk ini menghubungkan klausa negatif kedua secara alami dalam bahasa Indonesia; “maupun” juga mungkin, tetapi susunan ini lebih langsung dan mudah dipahami.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam analogi non-soteriologis
  choice: budak
  alternative: hamba; pelayan
  rationale: Kontras dengan κύριος menonjolkan perbedaan status dan ketundukan. “Budak” mempertahankan daya ungkap sosial istilah Yunani, sementara alternatif yang lebih lunak dicatat dalam catatan kaki.
- issue: Penerjemahan κύριος dalam konteks rumah tangga manusia
  choice: tuan
  alternative: Tuhan
  rationale: Konteks analogi budak–tuan menunjukkan seorang atasan manusia. Karena itu, menerjemahkannya sebagai gelar ilahi akan mengaburkan perbandingan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan agar bentuk pepatah dan perbandingan status dalam teks Yunani tetap jelas.
