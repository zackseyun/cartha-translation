  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: id
  text: Kamu akan dibenci oleh semua orang karena nama-Ku.[a] Namun, orang yang bertahan[b] sampai akhir, dialah yang akan diselamatkan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi nama-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bertekun.”
    reason: lexical_alternative
  - marker: c
    text: “Akan diselamatkan” juga dapat dipahami sebagai “akan dilepaskan” atau “akan diluputkan,” bergantung pada bagaimana konteksnya dipahami.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: akan dibenci
  rationale: Gabungan ἔσεσθε dan partisipel menyatakan keadaan pada masa mendatang; bentuk pasif “akan dibenci” wajar dalam bahasa Indonesia dan mempertahankan makna langsung μισέω.
- source_word: ὑπὸ πάντων
  choice: oleh semua orang
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif, sedangkan πάντων mencakup orang-orang secara menyeluruh. “Oleh semua orang” jelas dan alami.
- source_word: διὰ τὸ ὄνομά μου
  choice: karena nama-Ku
  rationale: διά dengan akusatif menyatakan sebab. “Nama-Ku” mempertahankan ungkapan sumber yang menunjuk kepada pribadi, kewibawaan, dan hubungan dengan Yesus tanpa menguraikannya di dalam teks.
- source_word: ὁ δὲ ὑπομείνας
  choice: Namun, orang yang bertahan
  rationale: Partisipel aoris berartikel berfungsi sebagai nomina. “Bertahan” sesuai dengan konteks tekanan dan penganiayaan serta tidak memasukkan istilah teologis yang lebih khusus. δέ diterjemahkan “Namun” untuk menandai peralihan yang kontras.
- source_word: εἰς τέλος
  choice: sampai akhir
  rationale: Ungkapan ini menunjukkan ketahanan hingga titik akhir. “Sampai akhir” merupakan padanan Indonesia yang ringkas dan alami tanpa menentukan secara eksplisit akhir apa yang dimaksud.
- source_word: οὗτος
  choice: dialah yang
  rationale: Kata ganti οὗτος merangkum kembali subjek panjang sebelumnya dan memberinya penekanan. Konstruksi Indonesia “dialah yang” mempertahankan penekanan itu secara alami.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk pasif μέλλον dari σῴζω dapat menunjuk pada diselamatkan, dilepaskan, atau diluputkan. “Akan diselamatkan” mempertahankan keluasan makna dan nuansa teologisnya tanpa mempersempitnya menjadi pertolongan jasmani semata.
theological_decisions:
- issue: Makna keselamatan dan hubungannya dengan ketahanan sampai akhir
  choice: Memakai “akan diselamatkan” tanpa menentukan jenis keselamatan atau merumuskan suatu ajaran ketekunan tertentu.
  alternative: “Akan dilepaskan” atau “akan diluputkan,” atau penjelasan eksplisit bahwa yang dimaksud ialah keselamatan eskatologis.
  rationale: Ayat ini menghubungkan ketahanan di tengah kebencian dengan keselamatan, tetapi konteks dan kata σῴζω tetap memiliki keluasan makna. Terjemahan sebaiknya mempertahankan ketegangan itu dan tidak menyelesaikan perdebatan teologis kemudian.
- issue: Penekanan pada orang yang bertahan
  choice: Menerjemahkan οὗτος dengan “dialah yang.”
  alternative: Menghilangkan kata ganti resumtif dan menulis “orang yang bertahan sampai akhir akan diselamatkan.”
  rationale: Bahasa Indonesia memungkinkan penekanan Yunani dipertahankan dengan lancar melalui “dialah yang,” tanpa menjadikannya dasar bagi rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Sapaan jamak Yunani diterjemahkan dengan “kamu,” yang dalam bahasa Indonesia tidak menandai jumlah; konteks menunjukkan bahwa Yesus sedang berbicara kepada para murid. Bentuk “dialah yang” mempertahankan penekanan sumber secara alami.
