id: MAT.10.34
reference: Matthew 10:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: id
  text: “Jangan mengira bahwa Aku datang untuk membawa damai ke bumi. Aku datang bukan untuk membawa damai, melainkan pedang.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran “pedang” dalam konteks ini menunjuk pada perpecahan yang timbul karena tanggapan orang terhadap Yesus, bukan anjuran untuk melakukan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Jangan mengira
  rationale: Bentuk larangan dengan μή dan subjungtif aoris diterjemahkan secara langsung dan wajar; ‘mengira’ mempertahankan nuansa penilaian atau anggapan.
- source_word: ἦλθον
  choice: Aku datang
  rationale: Aoris ini menyatakan kedatangan Yesus dalam kaitannya dengan tujuan misi-Nya. Bahasa Indonesia tidak perlu membedakan ‘datang’ dan ‘telah datang’ secara kaku.
- source_word: βαλεῖν
  choice: untuk membawa
  rationale: Walaupun arti harfiahnya dapat berupa ‘melemparkan’, dalam konstruksi ini ‘membawa’ menyampaikan hasil atau dampak kedatangan secara alami tanpa menimbulkan gambaran yang keliru.
- source_word: εἰρήνην
  choice: damai
  rationale: ‘Damai’ merupakan padanan baku dan alami untuk εἰρήνη dalam konteks ini.
- source_word: ἐπὶ τὴν γῆν
  choice: ke bumi
  rationale: Dengan verba βαλεῖν, preposisi ἐπί berakusatif secara alami menunjukkan arah atau jangkauan menuju bumi. ‘Ke bumi’ menjaga hubungan sintaksis dengan ‘membawa’ dan cakupan luas γῆ.
- source_word: ἀλλὰ μάχαιραν
  choice: melainkan pedang
  rationale: ‘Melainkan’ menandai pertentangan tegas setelah penyangkalan, sedangkan ‘pedang’ mempertahankan gambaran konkret dari μάχαιρα.
theological_decisions:
- issue: Apakah μάχαιραν perlu dijelaskan sebagai ‘perpecahan’ langsung dalam teks utama
  choice: Mempertahankan ‘pedang’ dalam teks utama
  alternative: perpecahan
  rationale: Teks Yunani memakai gambaran konkret ‘pedang’. Konteks berikutnya menunjukkan dampak berupa perpecahan, tetapi mengganti metafora itu dalam teks utama akan menghilangkan ketegangan dan daya retoris ucapan tersebut.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Kapitalisasi ‘Aku’ mengikuti kebiasaan teks keagamaan Indonesia ketika merujuk kepada Yesus. Pengulangan ‘Aku datang ... membawa damai’ dipertahankan untuk menjaga penekanan retoris sumber.
