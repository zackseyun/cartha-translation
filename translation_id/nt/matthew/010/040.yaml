  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: id
  text: Siapa pun yang menerima kalian, menerima Aku[a], dan siapa pun yang menerima Aku, menerima Dia yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyambut”; kata Yunani ini dapat berarti menerima atau menyambut, khususnya dalam arti menerima seorang utusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Siapa pun yang menerima
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menyatakan pelaku secara umum. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan umum bentuk Yunani.
- source_word: δέχομαι / δέχεται
  choice: menerima
  rationale: Pengulangan kata kerja membentuk rantai hubungan yang disengaja. 'Menerima' mempertahankan pengulangan itu dan dapat mencakup makna menyambut maupun mengakui para utusan.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina objek orang kedua jamak ini merujuk kepada para murid. 'Kalian' menyatakan bentuk jamak secara jelas dalam bahasa Indonesia modern.
- source_word: ἐμέ
  choice: Aku
  rationale: Pronomina objek orang pertama tunggal ini merujuk kepada Yesus. Kapitalisasi mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada Pribadi ilahi.
- source_word: τὸν ἀποστείλαντά με
  choice: Dia yang mengutus Aku
  rationale: Partisipel aoris aktif berartikel ini berfungsi sebagai nomina. 'Dia yang mengutus Aku' alami dan personal, tanpa menambahkan identitas yang tidak disebutkan secara eksplisit dalam teks Yunani.
theological_decisions:
- issue: Identitas Dia yang mengutus Yesus
  choice: Dia yang mengutus Aku
  alternative: Bapa yang mengutus Aku
  rationale: Konteks dan teologi Matius mengarah kepada Bapa, tetapi teks Yunani hanya menyebut 'Dia yang mengutus Aku'. Terjemahan mempertahankan apa yang dinyatakan teks tanpa memperjelasnya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk menandai secara tegas bahwa ὑμᾶς berbentuk jamak. Pengulangan 'menerima' dipertahankan untuk mencerminkan susunan retoris teks sumber.
