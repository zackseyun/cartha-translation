id: MAT.10.26
reference: Matthew 10:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: id
  text: Karena itu, janganlah takut kepada mereka. Sebab, tidak ada sesuatu pun yang tertutup yang tidak akan disingkapkan, dan tidak ada sesuatu pun yang tersembunyi yang tidak akan diketahui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Karena itu, janganlah takut kepada mereka
  rationale: οὖν menyatakan kesimpulan dari konteks sebelumnya; bentuk larangan aoris pasif φοβηθῆτε secara alami diterjemahkan sebagai larangan langsung, dan αὐτούς dipertahankan sebagai “mereka”.
- source_word: κεκαλυμμένον
  choice: yang tertutup
  rationale: Partisip perfektum pasif dari καλύπτω menggambarkan sesuatu dalam keadaan tertutup. “Tertutup” mempertahankan metafora sumber dan berbeda secara wajar dari κρυπτόν.
- source_word: ἀποκαλυφθήσεται
  choice: akan disingkapkan
  rationale: Bentuk futurum pasif dipertahankan, sementara “disingkapkan” secara alami menyampaikan tindakan membuka apa yang tertutup.
- source_word: κρυπτὸν
  choice: yang tersembunyi
  rationale: Menunjukkan sesuatu yang tersembunyi atau rahasia; “tersembunyi” mempertahankan kesejajaran tanpa menyamakannya sepenuhnya dengan “tertutup”.
- source_word: γνωσθήσεται
  choice: akan diketahui
  rationale: Futurum pasif dari γινώσκω diterjemahkan secara langsung dan tidak menambahkan pelaku yang tidak dinyatakan dalam teks Yunani.
theological_decisions:
- issue: Pelaku yang menyingkapkan dan mengetahui tidak dinyatakan
  choice: 'Mempertahankan konstruksi pasif: “akan disingkapkan” dan “akan diketahui”'
  alternative: Menambahkan Allah sebagai pelaku, misalnya “akan Allah singkapkan”
  rationale: Teks Yunani memakai bentuk pasif tanpa menyebut pelaku. Terjemahan tidak menentukan apakah ini pasif ilahi atau menunjuk pada penyingkapan secara lebih umum.
- issue: Cakupan pernyataan tentang hal yang tertutup dan tersembunyi
  choice: Mempertahankan rumusan universal tanpa penjelasan tambahan
  alternative: Membatasi secara eksplisit pada penganiayaan, ajaran, atau penghakiman terakhir
  rationale: Ayat itu sendiri menyatakan prinsip secara luas; konteks dapat membimbing pembaca tanpa terjemahan mengunci satu penerapan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme klausa Yunani dipertahankan dengan pengulangan “tidak ada sesuatu pun,” yang lebih alami dan jelas dalam bahasa Indonesia daripada menghilangkan unsur predikatif pada klausa kedua.
