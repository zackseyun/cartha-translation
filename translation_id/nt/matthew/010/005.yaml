id: MAT.10.5
reference: Matthew 10:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: id
  text: 'Yesus mengutus kedua belas orang itu dengan memberi mereka perintah berikut: “Jangan pergi melalui jalan yang menuju bangsa-bangsa lain,[a] dan jangan masuk ke kota orang Samaria.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ke jalan bangsa-bangsa lain.” Ungkapan Yunani memakai bahasa jalan atau arah perjalanan dan kemungkinan menunjuk pada perjalanan menuju wilayah bangsa-bangsa lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke sebuah kota Samaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: kedua belas orang itu
  rationale: Mempertahankan penunjukan kepada kelompok yang baru disebut tanpa menambahkan ‘murid’, yang tidak terdapat dalam frasa Yunani.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: ‘Mengutus’ secara alami menyatakan pengiriman untuk suatu tugas, sesuai nuansa ἀποστέλλω.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: dengan memberi mereka perintah berikut
  rationale: Ungkapan ini menyampaikan daya direktif παραγγέλλω dan memperkenalkan ucapan langsung secara wajar dalam bahasa Indonesia tanpa mengulang ‘berkata’ secara kaku.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Jangan pergi melalui jalan yang menuju bangsa-bangsa lain
  rationale: Mempertahankan gambaran jalan dalam ὁδός sekaligus menyampaikan bahwa larangan itu berkaitan dengan bergerak menuju wilayah orang non-Yahudi. ‘Bangsa-bangsa lain’ jelas dalam konteks dan lebih umum dipahami daripada istilah teknis ‘bangsa-bangsa bukan Yahudi’.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: jangan masuk ke kota orang Samaria
  rationale: ‘Kota’ sesuai dengan cakupan πόλις, sedangkan bentuk genitif Σαμαριτῶν dipertahankan secara alami sebagai ‘orang Samaria’.
theological_decisions:
- issue: Cakupan dan jangka waktu larangan mengenai bangsa-bangsa lain dan orang Samaria
  choice: Menyajikannya sebagai perintah langsung dalam pengutusan khusus kedua belas orang itu, tanpa keterangan tambahan mengenai jangka waktunya.
  alternative: Merumuskannya sebagai larangan mutlak dan permanen terhadap pelayanan kepada bangsa-bangsa lain dan orang Samaria.
  rationale: Ayat ini sendiri memberikan larangan yang tegas dalam konteks pengutusan tersebut, tetapi tidak menyatakan bahwa larangan itu berlaku untuk segala masa. Terjemahan mempertahankan ketegasannya tanpa memasukkan kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. ‘Kedua belas orang itu’ menghindari penambahan unsur yang tidak eksplisit, sedangkan ‘memberi mereka perintah berikut’ menjaga kekuatan ujaran dan kelancaran kalimat.
