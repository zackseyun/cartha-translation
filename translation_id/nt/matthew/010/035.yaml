  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: id
  text: Sebab Aku datang untuk membuat seorang laki-laki melawan ayahnya[a], seorang anak perempuan melawan ibunya, dan seorang menantu perempuan melawan ibu mertuanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memisahkan”; kata kerja Yunani yang dipakai secara lebih harfiah berarti membelah atau menyebabkan perpecahan, sedangkan rangkaian “melawan” berikutnya memperjelas bahwa yang dimaksud ialah pertentangan dalam hubungan.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani νύμφη dalam konteks lain dapat berarti “pengantin perempuan”; di sini artinya “menantu perempuan” karena dipasangkan dengan “ibu mertua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: Aku datang
  rationale: Bentuk aoristus dalam perkataan Yesus ini menunjuk pada kedatangan dan misi-Nya; bentuk lampau sederhana tetap alami dan langsung dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memberi alasan atau penjelasan bagi pernyataan sebelumnya; 'Sebab' mempertahankan hubungan logis tersebut.
- source_word: διχάσαι
  choice: untuk membuat ... melawan
  rationale: Infinitif ini berarti membelah atau menimbulkan perpecahan. Rangkaian κατά dengan genitif menjelaskan bahwa perpecahan itu berupa pertentangan antarpihak; susunan ini menyampaikan daya ungkap tersebut secara alami.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Walaupun dapat berarti manusia atau orang secara umum, di sini kata tersebut menjadi unsur laki-laki dalam tiga pasangan keluarga, sejajar dengan anak perempuan dan menantu perempuan.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: melawan ayahnya
  rationale: κατά dengan genitif menyatakan pertentangan; 'melawan ayahnya' ringkas dan idiomatis.
- source_word: θυγατέρα
  choice: seorang anak perempuan
  rationale: Padanan langsung dan wajar bagi nomina feminin tunggal ini.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: melawan ibunya
  rationale: Mempertahankan pola pertentangan yang sama dalam bahasa Indonesia yang alami.
- source_word: νύμφην
  choice: seorang menantu perempuan
  rationale: νύμφη dapat berarti pengantin perempuan, tetapi pasangannya dengan πενθερά menunjukkan hubungan menantu perempuan dan ibu mertua.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: melawan ibu mertuanya
  rationale: Padanan hubungan kekerabatan yang tepat dan mempertahankan pola berulang dalam ayat ini.
theological_decisions:
- issue: Sifat misi Yesus yang dinyatakan dalam konteks ini
  choice: Menggambarkan kedatangan Yesus sebagai menimbulkan pertentangan bahkan di dalam keluarga, tanpa melunakkan ketegasan perkataan itu atau menyatakan bahwa permusuhan keluarga merupakan tujuan akhir yang disenangi-Nya.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'memisahkan', atau menambahkan penjelasan bahwa konflik timbul khususnya karena kesetiaan kepada Yesus.
  rationale: Bahasa Yunani secara tajam menyatakan tindakan membelah dan kemudian merincinya sebagai pertentangan antaranggota keluarga. Terjemahan mempertahankan ketegangan teologis itu tanpa memasukkan penjelasan kontekstual tambahan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan 'melawan' dipertahankan untuk mencerminkan pola retoris sumber Yunani. Istilah kekerabatan dipilih agar jelas bagi pembaca umum.
