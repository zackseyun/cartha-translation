  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: id
  text: Sebab, bukan kalian yang berbicara, melainkan Roh Bapa kalian yang berbicara di dalam kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui kalian.” Teks Yunani berbunyi “di dalam kalian,” yang dalam konteks ini juga dapat menyiratkan bahwa perkataan itu disampaikan melalui para murid.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab bukan
  rationale: γάρ menjelaskan jaminan pada ayat sebelumnya, sedangkan οὐ menyangkal bahwa para muridlah sumber perkataan itu.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: kamu yang berbicara
  rationale: Pronomina ὑμεῖς dinyatakan secara eksplisit dan mendapat penekanan; susunan ini mempertahankan kontras identitas pembicara secara wajar dalam bahasa Indonesia.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Dalam konstruksi penyangkalan yang diikuti koreksi, “melainkan” menyatakan kontras kuat dengan lebih tepat daripada “tetapi”.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Roh Bapamu
  rationale: Konteks menunjuk kepada Roh ilahi. “Bapamu” mempertahankan hubungan genitif dan sapaan jamak secara alami tanpa menambahkan kata “surgawi” yang tidak terdapat dalam ayat ini.
- source_word: τὸ λαλοῦν
  choice: yang berbicara
  rationale: Partisipel kini berartikel menerangkan Roh dan mengungkapkan tindakan berbicara yang sedang berlangsung.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Ini mempertahankan arti paling langsung dari ἐν dan tidak menutup kemungkinan bahwa Roh berbicara melalui para murid.
theological_decisions:
- issue: Apakah ἐν ὑμῖν menyatakan kehadiran di dalam para murid atau perantaraan melalui mereka
  choice: di dalam kamu
  alternative: melalui kamu
  rationale: Arti langsung preposisi ἐν adalah “di dalam.” Konteks juga memungkinkan nuansa bahwa perkataan itu disampaikan melalui para murid, tetapi teks Yunani tidak memaksa penerjemah memilih hanya nuansa instrumental. Karena itu, teks utama mempertahankan ketegangan tersebut dan mencatat alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kamu” dipakai sebagai bentuk jamak sesuai konteks; “Bapamu” ringkas dan alami. Pengulangan “yang berbicara” dipertahankan untuk mencerminkan kontras serta pengulangan λαλοῦντες/λαλοῦν dalam teks Yunani.
