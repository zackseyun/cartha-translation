review_pass:
  verdict: approve
  source_fidelity: Teks Indonesia mengikuti seluruh rangkaian imperatif Yunani dan menjaga kesejajaran δωρεὰν ... δωρεάν dengan pengulangan “dengan cuma-cuma.” “Bangkitkanlah orang mati” tepat untuk νεκροὺς ἐγείρετε, sedangkan “tahirkanlah” dengan baik mempertahankan nuansa καθαρίζετε yang tidak terbatas pada penyembuhan fisik.
  naturalness: Bahasanya baku, jelas, dan wajar untuk register pengutusan Injil. Bentuk-bentuk imperatif berakhiran -lah konsisten dan tidak berlebihan. “Orang yang terkena penyakit kulit” merupakan ungkapan modern yang dapat dipahami.
  terminology: “Orang sakit,” “orang mati,” “tahirkanlah,” dan “setan-setan” setia pada istilah dan konteks sumber. Pilihan istilah penyakit kulit menghindari penyamaan λεπροί dengan penyakit Hansen modern; catatan b menjelaskan istilah tradisional “orang kusta.” Catatan a secara tepat menandai ketidakpastian tekstual yang tercermin oleh tanda kurung tekstual dalam SBLGNT.
