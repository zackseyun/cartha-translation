id: MAT.10.8
reference: Matthew 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: id
  text: Sembuhkanlah orang sakit, bangkitkanlah orang mati[a], tahirkanlah orang yang terkena penyakit kulit[b], dan usirlah setan-setan. Kamu telah menerima dengan cuma-cuma; berilah dengan cuma-cuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat “bangkitkanlah orang mati.”
    reason: textual_variant
  - marker: b
    text: Secara tradisional diterjemahkan “orang kusta.” Dalam pemakaian Alkitab, istilah ini dapat mencakup berbagai penyakit kulit serius dan tidak selalu sama dengan penyakit Hansen yang kini disebut kusta.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: orang sakit
  rationale: Partisipel ini menunjuk kepada mereka yang sedang sakit; “orang sakit” alami dan tepat dalam konteks penyembuhan.
- source_word: θεραπεύετε
  choice: Sembuhkanlah
  rationale: Dalam konteks pelayanan mukjizat, kata ini berarti menyembuhkan, bukan sekadar merawat.
- source_word: νεκροὺς ἐγείρετε
  choice: bangkitkanlah orang mati
  rationale: ἐγείρω di sini berarti membangkitkan dari kematian; bentuk perintah jamak dipertahankan secara langsung.
- source_word: λεπροὺς
  choice: orang yang terkena penyakit kulit
  rationale: Istilah Yunani dalam pemakaian Alkitab dapat mencakup penyakit kulit serius yang lebih luas daripada penyakit Hansen modern; pilihan ini menghindari penyamaan medis yang terlalu sempit.
- source_word: καθαρίζετε
  choice: tahirkanlah
  rationale: Kata ini memuat dimensi jasmani sekaligus ketahiran ritual; “tahirkanlah” mempertahankan kedua nuansa itu lebih baik daripada hanya “sembuhkanlah”.
- source_word: δαιμόνια ἐκβάλλετε
  choice: usirlah setan-setan
  rationale: Ungkapan ini secara langsung menggambarkan pengusiran makhluk-makhluk jahat; “usirlah” merupakan bahasa Indonesia yang jelas dan wajar.
- source_word: δωρεὰν
  choice: dengan cuma-cuma
  rationale: Adverbia ini berarti tanpa bayaran atau sebagai pemberian. Pengulangannya mempertahankan kesejajaran retoris kedua klausa.
- source_word: ἐλάβετε
  choice: telah menerima
  rationale: Bentuk aoristus menunjuk kepada apa yang sudah diterima para murid; “telah menerima” alami dalam bahasa Indonesia dan tidak menambahkan objek yang tidak dinyatakan dalam bahasa Yunani.
- source_word: δότε
  choice: berilah
  rationale: Bentuk perintah diterjemahkan langsung, sedangkan cara memberi dinyatakan oleh “dengan cuma-cuma”.
theological_decisions:
- issue: Cakupan perintah-perintah mukjizat
  choice: Menerjemahkan semuanya sebagai perintah langsung kepada kedua belas murid dalam wacana pengutusan ini.
  alternative: Memahami beberapa tindakan secara metaforis atau membatasinya pada praktik gerejawi kemudian.
  rationale: Teks Yunani menyajikan rangkaian imperatif jamak yang konkret. Terjemahan mempertahankan daya historis dan teologis perintah itu tanpa menentukan penerapannya melampaui konteks.
- issue: Makna καθαρίζετε bagi penderita penyakit kulit
  choice: Memakai “tahirkanlah” agar nuansa pemulihan jasmani dan ketahiran ritual tetap terbuka.
  alternative: Memakai “sembuhkanlah”, yang hanya menonjolkan pemulihan jasmani.
  rationale: Dalam konteks Alkitab, pemulihan orang dengan penyakit kulit berkaitan dengan status tahir; terjemahan tidak boleh menghapus ketegangan antara aspek jasmani dan ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan akhiran -lah mempertahankan nada pengutusan tanpa terdengar kasar. Kesejajaran “dengan cuma-cuma” dipertahankan untuk mencerminkan susunan retoris Yunani.
