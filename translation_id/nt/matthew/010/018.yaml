  source_fidelity: Terjemahan dengan tepat mempertahankan futur pasif ἀχθήσεσθε ("akan dibawa"), nuansa hadir di hadapan pejabat dalam ἐπὶ dengan akusatif ("menghadap"), sebab dalam ἕνεκεν ἐμοῦ, dan fungsi kesaksian dalam εἰς μαρτύριον. Namun, βασιλεῖς berbentuk jamak dan sebaiknya dinyatakan sebagai "raja-raja". Untuk τοῖς ἔθνεσιν, "bangsa-bangsa bukan Yahudi" lebih jelas menyampaikan pemakaian istilah itu dalam konteks Matius, sambil menyediakan alternatif literal "bangsa-bangsa" dalam catatan.
  naturalness: Kalimat revisi tetap baku, langsung, dan alami dalam bahasa Indonesia modern. "Para gubernur dan raja-raja" lazim dalam gaya Alkitab dan secara jelas mempertahankan jamak sumber. "Bangsa-bangsa bukan Yahudi" jelas dan tidak mengubahnya menjadi "orang-orang".
  terminology: '"Kesaksian kepada mereka" dengan tepat mempertahankan datif αὐτοῖς secara netral; catatan alternatif "melawan mereka" tetap diperlukan untuk mencatat kemungkinan pembacaan kontekstual tanpa memaksakannya. "Bangsa-bangsa bukan Yahudi" merupakan padanan yang tepat bagi ἔθνη di sini; catatan menyediakan kemungkinan leksikal yang lebih literal, "bangsa-bangsa."'
