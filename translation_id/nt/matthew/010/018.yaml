source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: id
  text: Kamu juga akan dibawa menghadap para gubernur dan raja-raja karena Aku, sebagai kesaksian kepada mereka[b] dan kepada bangsa-bangsa bukan Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “kepada mereka” juga dapat dipahami sebagai “melawan mereka”, meskipun bentuk datif dalam bahasa Yunani tidak menyatakannya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς
  choice: menghadap para gubernur dan raja
  rationale: Sesudah verba pasif ἀχθήσεσθε, ἐπί dengan akusatif menunjuk pada dibawanya para murid ke hadapan para penguasa. 'Menghadap' alami dalam konteks pemeriksaan resmi; 'gubernur' merupakan padanan khusus bagi ἡγεμών, sedangkan βασιλεῖς berarti 'raja-raja'.
- source_word: ἀχθήσεσθε
  choice: akan dibawa
  rationale: Bentuk futur pasif dari ἄγω. 'Akan dibawa' mempertahankan bentuk pasif dan sesuai dengan suasana hukum tanpa menambahkan unsur kekerasan yang tidak dinyatakan.
- source_word: ἕνεκεν ἐμοῦ
  choice: karena Aku
  rationale: ἕνεκεν dengan genitif menyatakan sebab. 'Karena Aku' jelas, ringkas, dan mempertahankan rujukan pribadi kepada Yesus.
- source_word: εἰς μαρτύριον
  choice: sebagai kesaksian
  rationale: 'Frasa ini menyatakan fungsi atau hasil: kemunculan mereka di hadapan penguasa akan menjadi kesaksian. Pilihan ini mempertahankan bentuk nomina μαρτύριον.'
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif ini paling wajar merujuk kepada para gubernur dan raja. Dativus Yunani tidak secara eksplisit menyatakan bahwa kesaksian itu melawan mereka, sehingga terjemahan netral mempertahankan ambiguitasnya.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Dalam Matius, ἔθνη sering menunjuk kepada bangsa-bangsa bukan Yahudi. 'Bangsa-bangsa lain' mudah dipahami dalam bahasa Indonesia modern dan juga mempertahankan hubungan leksikalnya dengan makna dasar 'bangsa-bangsa'.
theological_decisions:
- issue: Daya makna μαρτύριον αὐτοῖς
  choice: '''kesaksian kepada mereka'' yang netral'
  alternative: '''kesaksian melawan mereka'''
  rationale: Dativus αὐτοῖς tidak dengan sendirinya menyatakan pertentangan atau penghukuman. Terjemahan netral mempertahankan ketegangan bahwa kesaksian itu dapat diterima sebagai pemberitaan, tetapi dapat pula menjadi kesaksian yang memberatkan bila ditolak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. 'Kamu' mengikuti sapaan jamak kepada para murid dalam konteks, sedangkan 'Aku' dikapitalisasi sebagai rujukan kepada Yesus menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Partikel δέ diwakili oleh 'juga' agar kesinambungan dan penambahan dari ayat sebelumnya tetap terasa.
