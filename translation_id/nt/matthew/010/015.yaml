  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: id
  text: Sesungguhnya, Aku berkata kepadamu, pada hari penghakiman, bagi negeri Sodom dan Gomora hal itu akan lebih dapat ditanggung daripada bagi kota itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumusan khidmat ἀμὴν λέγω ὑμῖν, “Sesungguhnya” menyampaikan penegasan yang kuat secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: 'Terjemahan ini mempertahankan bentuk ujaran langsung serta pembedaan jumlah: pembicara tunggal dan para murid sebagai kelompok yang disapa.'
- source_word: ἀνεκτότερον ἔσται
  choice: hukuman ... akan lebih ringan
  rationale: Secara harfiah ungkapan ini berarti keadaan itu akan lebih dapat ditanggung. Dalam konteks hari penghakiman, konstruksi Indonesia “hukuman ... akan lebih ringan” menyampaikan perbandingan yang dimaksud dengan jelas tanpa menentukan bentuk hukumannya.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: bagi negeri Sodom dan Gomora
  rationale: “Negeri” mempertahankan rujukan geografis γῇ dan bentuk genitif nama tempat, sementara “bagi” mencerminkan datif pihak yang mengalami keadaan tersebut.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: pada hari penghakiman
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukan kepada suatu hari penghakiman tanpa menguraikan skema eskatologis lebih lanjut.
- source_word: τῇ πόλει ἐκείνῃ
  choice: bagi kota itu
  rationale: “Kota” adalah padanan langsung dan luas bagi πόλις; penunjuk “itu” merujuk kembali kepada kota yang menolak para utusan.
theological_decisions:
- issue: Sifat “hari penghakiman”
  choice: Diterjemahkan sebagai “hari penghakiman,” dengan orientasi mendatang yang muncul dari bentuk verba, tanpa rincian doktrinal tambahan.
  alternative: Memahaminya sebagai masa penghakiman secara umum.
  rationale: Frasa Yunani secara alami menunjuk kepada hari penghakiman ilahi, tetapi ayat ini sendiri tidak menjelaskan urutan atau bentuk peristiwa tersebut.
- issue: Perbandingan beratnya penghakiman
  choice: Dinyatakan sebagai hukuman yang “lebih ringan” bagi negeri Sodom dan Gomora.
  alternative: “Akan lebih dapat ditanggung oleh negeri Sodom dan Gomora.”
  rationale: Pilihan utama membuat implikasi konteks penghakiman terbaca alami dalam bahasa Indonesia, namun tetap mempertahankan perbandingan tingkat tanpa menjelaskan dasar atau bentuk hukumannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, khidmat, dan mudah dipahami. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk perkataan Yesus. “Kepadamu” mempertahankan bentuk jamak Yunani secara netral karena bahasa Indonesia tidak menandai jumlah pada pronomina ini.
