id: MAT.10.2
reference: Matthew 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: id
  text: 'Inilah nama-nama kedua belas rasul itu: pertama[a], Simon yang disebut Petrus, dan Andreas, saudaranya; Yakobus anak Zebedeus, dan Yohanes, saudaranya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pertama” mungkin menyiratkan kedudukan yang menonjol di antara kedua belas rasul, bukan hanya urutan pertama dalam daftar.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel δέ menandai peralihan ringan. Dalam bahasa Indonesia, alur itu sudah wajar tanpa kata penghubung tambahan; menerjemahkannya sebagai “sekarang” akan memberi kesan waktu yang tidak dinyatakan secara eksplisit.
- source_word: δώδεκα ἀποστόλων
  choice: kedua belas rasul
  rationale: “Rasul” adalah padanan Indonesia yang lazim dan tepat bagi ἀπόστολος dalam konteks kelompok yang diutus Yesus.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Inilah nama ... itu
  rationale: Rumusan ini mempertahankan fungsi demonstratif ταῦτα sekaligus menghasilkan pembukaan daftar yang alami dalam bahasa Indonesia.
- source_word: πρῶτος
  choice: pertama
  rationale: Kata ini paling langsung menandai urutan dalam daftar tanpa menetapkan bahwa Petrus memiliki kedudukan otoritatif tertentu.
- source_word: ὁ λεγόμενος
  choice: yang disebut
  rationale: Padanan ini secara transparan menyampaikan ungkapan partisipial yang mengidentifikasi Simon dengan nama Petrus.
- source_word: Πέτρος
  choice: Petrus
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: saudaranya
  rationale: ἀδελφός di sini menunjuk pada saudara laki-laki kandung. Dalam konteks nama-nama laki-laki ini, “saudaranya” alami dan tidak menimbulkan ambiguitas praktis.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: anak Zebedeus
  rationale: Konstruksi genitif ini menyiratkan hubungan anak dengan ayah; “anak Zebedeus” merupakan ungkapan Indonesia yang ringkas dan idiomatis.
theological_decisions:
- issue: Makna πρῶτος yang dikenakan pada Simon/Petrus
  choice: Diterjemahkan “pertama” sebagai urutan dalam daftar, tanpa klaim eksplisit mengenai keutamaan otoritas.
  alternative: “Pertama” dapat juga menyiratkan kedudukan menonjol di antara kedua belas rasul.
  rationale: πρῶτος dapat menyatakan urutan dan dalam konteks tertentu juga keutamaan. Teks utama mempertahankan nilai leksikal sederhananya, sedangkan catatan kaki menjaga kemungkinan nuansa kedudukan tanpa menetapkan kesimpulan denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan susunan daftar yang jelas. Bentuk “kedua belas” dipakai untuk kelompok tertentu, dan tanda koma mengapit keterangan hubungan keluarga agar mudah dibaca.
