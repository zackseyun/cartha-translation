source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: id
  text: Kota atau desa mana pun yang kalian masuki, carilah tahu[a] siapa di sana yang layak[b], dan tinggallah di sana sampai kalian pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanyakanlah dengan saksama” atau “selidikilah”.
    reason: lexical_alternative
  - marker: b
    text: “Layak” di sini kemungkinan berarti cocok atau terbuka untuk menerima para utusan, bukan orang yang telah memperoleh perkenanan Allah karena jasanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: Kota atau desa mana pun
  rationale: Ungkapan ini menyatakan tempat mana saja yang mungkin dimasuki para murid. Susunan Indonesia yang alami menyampaikan sifat tak tentu dari ἄν, sedangkan verba berikutnya tetap menyatakan tindakan masuk.
- source_word: εἰσέλθητε
  choice: yang kalian masuki
  rationale: Bentuk orang kedua jamak diarahkan kepada para murid; 'kalian' menyatakannya dengan jelas dalam bahasa Indonesia modern.
- source_word: ἐξετάσατε
  choice: selidikilah
  rationale: Kata ini memerintahkan pemeriksaan atau pencarian informasi yang sungguh-sungguh, bukan sekadar melihat secara sepintas.
- source_word: τίς ἐν αὐτῇ
  choice: siapa di sana
  rationale: Frasa ini menanyakan orang tertentu yang berada di kota atau desa yang baru disebutkan.
- source_word: ἄξιός ἐστιν
  choice: yang layak
  rationale: '''Layak'' mempertahankan penilaian yang terkandung dalam ἄξιος tanpa menentukan secara berlebihan apakah kelayakan itu terutama moral atau berupa kesediaan menjadi tuan rumah.'
- source_word: κἀκεῖ μείνατε
  choice: lalu tinggallah di situ
  rationale: Terjemahan ini mempertahankan hubungan dengan tempat atau rumah yang ditemukan serta menyampaikan perintah untuk tidak berpindah-pindah.
- source_word: ἕως ἂν ἐξέλθητε
  choice: sampai kalian pergi
  rationale: Ungkapan ini menyatakan batas waktu tinggal hingga keberangkatan mereka, tanpa menambahkan objek yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
theological_decisions:
- issue: Arti 'layak' dalam petunjuk pengutusan
  choice: Mempertahankan kata 'layak' dalam teks utama.
  alternative: Menerjemahkannya secara lebih sempit sebagai 'bersedia menerima kalian' atau 'pantas menjadi tuan rumah'.
  rationale: Dalam konteks ini, kelayakan kemungkinan berkaitan dengan kecocokan atau keterbukaan untuk menerima para utusan, tetapi ἄξιος sendiri tetap memiliki nuansa penilaian yang lebih luas. Terjemahan utama tidak menyamakannya dengan memperoleh keselamatan karena jasa dan tidak menutup kemungkinan nuansa moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk menyatakan bentuk orang kedua jamak dalam bahasa sumber. Nada perintah dipertahankan melalui 'selidikilah' dan 'tinggallah'.
