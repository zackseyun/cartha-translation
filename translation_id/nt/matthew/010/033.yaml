  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: id
  text: Tetapi siapa pun yang menyangkal Aku di hadapan manusia, Aku pun akan menyangkal dia di hadapan Bapa-Ku yang di surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang di dalam langit-langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Tetapi siapa pun yang
  rationale: ὅστις dengan ἄν memperkenalkan keadaan umum yang berlaku bagi siapa saja, sedangkan δέ menandai pertentangan dengan ayat sebelumnya. Frasa ini alami dalam bahasa Indonesia dan mempertahankan cakupan umum serta hubungan kontrasnya.
- source_word: ἀρνήσηταί με
  choice: menyangkal Aku
  rationale: ἀρνέομαι berarti menyangkal atau tidak mengakui. Pilihan ini langsung, sesuai dengan konteks pengakuan di muka umum, dan tidak menambahkan gagasan seperti ‘menyangkal mengenal’ yang tidak dinyatakan secara eksplisit.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: di hadapan manusia
  rationale: ἔμπροσθεν menyatakan keberadaan di depan atau dalam kehadiran pihak lain. Bentuk jamak ἀνθρώπων bersifat umum; ‘manusia’ dalam bahasa Indonesia secara alami mencakup semua orang tanpa menghapus cakupan sumber.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: Aku pun akan menyangkal dia
  rationale: κἀγώ menyatakan korespondensi yang tegas, ‘Aku juga/Aku pun’. Pengulangan verba ‘menyangkal’ mempertahankan kesejajaran retoris dengan tindakan pada klausa pertama.
- source_word: τοῦ πατρός μου
  choice: Bapa-Ku
  rationale: Sebutan relasional Yesus diterjemahkan secara langsung. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk sapaan dan pronomina yang merujuk kepada pribadi ilahi.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: yang di surga
  rationale: Bahasa Yunani secara harfiah memakai bentuk jamak ‘di surga-surga’, tetapi bentuk tunggal ‘di surga’ merupakan ungkapan Indonesia yang alami dengan makna yang sama; bentuk sumber dicatat dalam catatan kaki.
theological_decisions:
- issue: Korespondensi penyangkalan manusia dengan penyangkalan oleh Yesus
  choice: menyangkal Aku ... Aku pun akan menyangkal dia
  alternative: tidak mengakui Aku ... Aku pun tidak akan mengakui dia
  rationale: Memakai verba Indonesia yang sama pada kedua klausa mempertahankan simetri yang khidmat dalam teks tanpa memperlunak atau memperluas akibat teologisnya.
- issue: Cakupan umum ἀνθρώπων dan rujukan tunggal αὐτόν
  choice: di hadapan manusia ... menyangkal dia
  alternative: di hadapan orang-orang ... menyangkal orang itu
  rationale: ‘Manusia’ menyampaikan cakupan umum ἀνθρώπων secara alami, sedangkan ‘dia’ mempertahankan rujukan tunggal kepada siapa pun yang melakukan tindakan tersebut tanpa menentukan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat mempertahankan kontras dengan ayat sebelumnya serta kesejajaran antara penyangkalan terhadap Yesus dan penyangkalan oleh Yesus. ‘Manusia’ dipakai dalam arti umum dan inklusif yang sudah alami dalam bahasa Indonesia.
