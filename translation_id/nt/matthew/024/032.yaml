    issue: “ranting-rantingnya” menerjemahkan nomina Yunani tunggal ὁ κλάδος.
    rationale: Walaupun bentuk jamak dapat terdengar alami, teks sumber menunjuk kepada “rantingnya” sebagai bagian dari pohon; bentuk tunggal dapat dipertahankan secara alami dalam bahasa Indonesia.
  - severity: medium
    issue: “daun-daunnya bertunas” kurang tepat secara semantis dan idiomatis untuk τὰ φύλλα ἐκφύῃ.
    rationale: Verba ἐκφύῃ menggambarkan daun-daun yang tumbuh keluar/keluar pada ranting. “Rantingnya ... mengeluarkan daun” menyampaikan relasi dan gambaran pertumbuhan itu dengan lebih tepat.
  - severity: low
    issue: Catatan kaki a tidak selaras sepenuhnya dengan teks utama semula.
    rationale: Jika teks utama memakai “daun-daunnya bertunas,” alternatif “mengeluarkan daun-daun” justru lebih dekat dengan bentuk sumber. Sesudah revisi, catatan dapat menyajikan “daunnya bertunas” sebagai alternatif yang lebih idiomatis.
