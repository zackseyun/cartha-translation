  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: id
  text: 'Belajarlah perumpamaan dari pohon ara: ketika rantingnya sudah menjadi lunak dan mulai mengeluarkan daun,[a] kalian tahu bahwa musim panas sudah dekat.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daunnya bertunas.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani θέρος dapat berarti “musim panas” dan, dalam konteks tertentu, masa panen. Di sini arti musim paling sesuai dengan gambaran pohon ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν
  choice: Belajarlah perumpamaan dari pohon ara
  rationale: Imperatif μάθετε diterjemahkan langsung sebagai “Belajarlah”; ἀπό dengan genitif mempertahankan pohon ara sebagai sumber pelajaran. παραβολή tetap diterjemahkan “perumpamaan,” istilah Injil yang wajar dalam bahasa Indonesia.
- source_word: ὅταν ἤδη
  choice: ketika ... mulai
  rationale: ὅταν menyatakan keadaan temporal umum, sedangkan ἤδη menandai bahwa perubahan itu telah mulai tampak. Gabungan “ketika ... mulai” alami dalam bahasa Indonesia tanpa memperkerasnya menjadi urutan waktu yang terlalu presisi.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλός
  choice: ranting-rantingnya mulai lunak
  rationale: ἁπαλός menunjuk pada keadaan lunak atau lentur dari pertumbuhan baru. Bentuk tunggal kolektif Yunani dinaturalkan menjadi jamak dalam bahasa Indonesia karena pohon biasanya diamati melalui ranting-rantingnya.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: dan daun-daunnya bertunas
  rationale: ἐκφύῃ berarti tumbuh atau muncul keluar. “Daun-daunnya bertunas” menyampaikan kemunculan daun baru secara ringkas dan alami.
- source_word: γινώσκετε
  choice: kalian tahu
  rationale: Bentuk kini indikatif orang kedua jamak menyatakan pengetahuan umum, bukan perintah. “Kalian” membuat bentuk jamaknya nyata dalam bahasa Indonesia modern.
- source_word: ἐγγὺς τὸ θέρος
  choice: musim panas sudah dekat
  rationale: Dalam gambaran perubahan musiman pada pohon ara, θέρος paling wajar berarti “musim panas.” “Sudah dekat” menyampaikan kedekatan yang dikenali dari tanda tersebut.
theological_decisions:
- issue: Makna pohon ara
  choice: Dibiarkan sebagai perumpamaan musiman tanpa mengidentifikasi pohon ara secara simbolis.
  alternative: Menafsirkan pohon ara sebagai lambang Israel, atau menegaskan bahwa pohon itu hanya contoh alam biasa.
  rationale: Ayat Yunani sendiri menekankan pengenalan akan kedekatan melalui tanda yang dapat diamati. Identifikasi simbolis yang lebih khusus tidak dinyatakan dalam ayat ini dan karena itu tidak dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas. Urutan penanda catatan kaki dibuat sesuai kemunculannya dalam teks.
