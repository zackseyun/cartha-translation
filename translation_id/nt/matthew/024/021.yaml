id: MAT.24.21
reference: Matthew 24:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: id
  text: Sebab pada waktu itu akan terjadi kesengsaraan besar[a], yang belum pernah terjadi sejak awal dunia sampai sekarang dan tidak akan pernah terjadi lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesusahan besar” atau “penderitaan besar.” Kata Yunani ini dapat menunjuk pada kesulitan berat, tekanan, atau penindasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Sebab pada waktu itu
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ terhadap peringatan sebelumnya, sedangkan “pada waktu itu” menyampaikan τότε secara alami dalam bahasa Indonesia.
- source_word: ἔσται ... θλῖψις μεγάλη
  choice: akan terjadi kesengsaraan besar
  rationale: Susunan ini merupakan bentuk eksistensial yang alami dalam bahasa Indonesia. “Kesengsaraan” mencakup penderitaan atau tekanan berat tanpa membatasi maknanya pada satu bentuk bencana tertentu, dan “besar” menerjemahkan μεγάλη secara langsung.
- source_word: οἵα οὐ γέγονεν
  choice: yang belum pernah terjadi
  rationale: Klausa ini mengungkapkan perbandingan kualitatif dan keadaan yang belum pernah terwujud hingga saat yang dimaksud. Bentuk “belum pernah terjadi” menyampaikan daya aspek perfektum γέγονεν secara idiomatis.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: sejak awal dunia sampai sekarang
  rationale: “Dunia” menerjemahkan κόσμος tanpa memperluasnya menjadi “penciptaan,” dan keseluruhan frasa mempertahankan rentang waktu dari awal hingga masa kini.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: dan tidak akan pernah terjadi lagi
  rationale: “Tidak akan pernah” menyampaikan negasi masa depan yang sangat tegas dari οὐ μή, sedangkan “lagi” secara alami mengaitkan penyangkalan itu dengan kejadian yang baru saja dibandingkan.
theological_decisions:
- issue: Padanan bagi θλῖψις dalam konteks khotbah eskatologis
  choice: kesengsaraan
  alternative: kesusahan; penderitaan
  rationale: “Kesengsaraan” mempertahankan bobot berat dan resonansi eskatologis istilah Yunani tanpa memasukkan skema penafsiran tertentu. Catatan kaki menjaga keluasan leksikalnya.
- issue: Cakupan pernyataan tentang keunikan peristiwa
  choice: yang belum pernah terjadi ... dan tidak akan pernah terjadi lagi
  alternative: yang belum pernah ada ... dan tidak akan pernah ada
  rationale: Padanan dengan “terjadi” mencerminkan pemakaian eventif γίνομαι dalam konteks ini, sambil mempertahankan klaim tegas teks tanpa menjelaskan identitas atau durasi peristiwa tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Struktur kalimat mempertahankan hubungan penjelas dengan ayat sebelumnya serta penegasan bahwa kesengsaraan itu belum pernah terjadi dan tidak akan terulang.
