id: MAT.24.11
reference: Matthew 24:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: id
  text: Dan banyak nabi palsu akan muncul dan menyesatkan banyak orang.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperdaya banyak orang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dibangkitkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak
  rationale: Padanan kuantitatif yang langsung, alami, dan sesuai dengan bentuk jamak Yunani.
- source_word: ψευδοπροφῆται
  choice: nabi palsu
  rationale: Padanan Indonesia yang mapan dan tepat untuk nabi yang tidak benar atau menipu, tanpa mempersempit bentuk kepalsuannya.
- source_word: ἐγερθήσονται
  choice: akan muncul
  rationale: Dalam konteks tampilnya tokoh-tokoh penyesat, ungkapan ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa yang dimaksud ialah kebangkitan dari kematian; kemungkinan bentuk pasif dicatat dalam catatan kaki.
- source_word: πλανήσουσιν
  choice: menyesatkan
  rationale: Mencakup tindakan membawa orang menyimpang atau memperdaya, sekaligus mempertahankan keluasan makna verba Yunani.
- source_word: πολλούς
  choice: banyak orang
  rationale: Objek personal tersirat oleh bentuk Yunani; 'banyak orang' lebih jelas dan alami daripada hanya 'banyak' dalam bahasa Indonesia.
- source_word: καὶ ... καὶ
  choice: Dan ... dan
  rationale: Mempertahankan koordinasi dua tindakan yang dinyatakan secara berurutan dalam teks Yunani.
theological_decisions:
- issue: Sifat penyesatan yang dinyatakan oleh πλανήσουσιν
  choice: Ayat ini menyatakan bahwa nabi-nabi palsu akan menyesatkan banyak orang tanpa menentukan apakah penyesatan itu terutama bersifat doktrinal, moral, atau eskatologis.
  alternative: Menerjemahkannya secara lebih sempit sebagai penipuan doktrinal, moral, atau eskatologis tertentu.
  rationale: Verba Yunani πλανάω memiliki cakupan luas. Terjemahan 'menyesatkan' menjaga keluasan dan ketegangan teologis itu.
- issue: Nuansa bentuk pasif ἐγερθήσονται
  choice: Teks utama memakai 'akan muncul' sebagai ungkapan kontekstual yang alami.
  alternative: Akan dibangkitkan.
  rationale: Bentuk Yunani secara morfologis pasif dan dapat diterjemahkan lebih harfiah, tetapi dalam konteks ini juga dapat berfungsi idiomatis untuk kemunculan tokoh. Alternatif dipertahankan dalam catatan kaki tanpa menetapkan siapa pelakunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. 'Nabi palsu' mempertahankan istilah Alkitabiah yang lazim, sedangkan 'menyesatkan banyak orang' jelas bagi pembaca umum. Semua penanda catatan kaki dicantumkan dalam teks utama.
