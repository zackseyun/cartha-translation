  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: id
  text: Orang yang sedang berada di atap rumah janganlah turun untuk mengambil barang-barang dari rumahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atap rumah pada masa itu biasanya datar dan dapat digunakan sebagai tempat beraktivitas.
