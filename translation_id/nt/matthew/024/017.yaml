lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Orang yang sedang berada di atap rumah
  rationale: Frasa berartikel ini berfungsi sebagai nomina dan menunjuk kepada siapa pun yang berada di bagian atas rumah. Bentuk tunggal dipertahankan tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: δώματος
  choice: atap rumah
  rationale: δώμα menunjuk pada atap atau bagian atas rumah, yang dalam lingkungan Mediterania kuno umumnya datar dan dapat digunakan. 'Atap rumah' alami dalam bahasa Indonesia dan mempertahankan latar arsitekturalnya.
- source_word: μὴ καταβάτω
  choice: janganlah turun
  rationale: Bentuk larangan imperatif diterjemahkan sebagai perintah langsung yang mendesak. 'Turun' mempertahankan gerak dari atap ke bagian bawah rumah.
- source_word: ἆραι
  choice: untuk mengambil
  rationale: Infinitif aoris menyatakan tujuan tindakan turun; 'untuk mengambil' menyampaikan hubungan itu secara jelas.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: barang-barang dari rumahnya
  rationale: Artikel netral jamak secara eliptis menunjuk pada benda atau milik yang hendak diambil dari rumah. 'Barang-barang' lebih alami daripada 'hal-hal' dan tidak mempersempitnya pada jenis milik tertentu.
- source_word: οἰκίας αὐτοῦ
  choice: rumahnya
  rationale: '''Rumah'' mempertahankan arti bangunan konkret dalam konteks turun dari atap. Sufiks ''-nya'' secara alami mempertahankan rujukan orang ketiga tunggal tanpa menambahkan penandaan gender yang tidak diwajibkan tata bahasa Indonesia.'
theological_decisions:
- issue: Rujukan maskulin representatif
  choice: 'Gunakan bentuk tunggal netral secara gramatikal: ''orang ... rumahnya'''
  alternative: Gunakan 'laki-laki ... rumahnya' atau bentuk jamak 'mereka'
  rationale: Bahasa Yunani memakai konstruksi tunggal maskulin dengan daya rujuk representatif, bukan pembatasan teologis kepada laki-laki. Bahasa Indonesia tidak menandai gender pada 'orang' atau '-nya', sehingga bentuk tunggal dan cakupan generiknya dapat dipertahankan tanpa menambahkan gender atau mengubahnya menjadi jamak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Sedang berada' memperjelas keadaan orang itu pada saat perintah diberikan; 'janganlah' mempertahankan nada perintah yang tegas tanpa terdengar kasar.
