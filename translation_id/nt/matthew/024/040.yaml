  source_fidelity: Teks Indonesia secara setia menerjemahkan τότε, dua subjek maskulin dalam adegan ini, lokasi di ladang, serta kontras pasif παραλαμβάνεται dan ἀφίεται. Pemakaian “akan” wajar dalam konteks futurum wacana ini. “Dibawa” mempertahankan ketidakjelasan tujuan tindakan tersebut.
