  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: id
  text: Pada waktu itu, dua laki-laki akan berada di ladang; yang seorang akan dibawa[a] dan yang lain ditinggalkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibawa serta.” Kata kerja ini sendiri tidak menentukan apakah orang itu dibawa untuk diselamatkan atau untuk dihukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai waktu dan menghubungkan perkataan ini dengan konteks eskatologis sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan urutan yang lebih tegas daripada teks Yunani.
- source_word: δύο ἔσονται
  choice: dua laki-laki akan berada
  rationale: Secara harfiah berarti 'dua akan berada'. Bentuk maskulin εἷς ... εἷς dan contoh sejajar tentang perempuan pada ayat berikutnya mendukung penyebutan dua laki-laki secara eksplisit dalam bahasa Indonesia.
- source_word: ἐν τῷ ἀγρῷ
  choice: di ladang
  rationale: Padanan lokatif langsung dan alami untuk tempat mereka berada.
- source_word: εἷς ... εἷς
  choice: yang seorang ... yang lain
  rationale: Menyampaikan kontras antara dua orang secara ringkas dan idiomatis tanpa mengulang kata 'laki-laki'.
- source_word: παραλαμβάνεται
  choice: akan dibawa
  rationale: Bentuk pasif kini berada dalam adegan yang berorientasi ke masa depan. 'Akan dibawa' mempertahankan ketidakjelasan mengenai tujuan tindakan itu dan tidak dengan sendirinya menyiratkan penyelamatan ataupun penghukuman.
- source_word: ἀφίεται
  choice: ditinggalkan
  rationale: Padanan pasif yang langsung. Ungkapan ini tidak ditambah menjadi 'ditinggalkan di belakang' dan tidak diperkuat menjadi 'ditelantarkan', sehingga menghindari muatan tafsir yang tidak dinyatakan oleh kata Yunani.
theological_decisions:
- issue: Apakah παραλαμβάνεται menyiratkan penyelamatan atau penghukuman
  choice: Memakai ungkapan netral 'akan dibawa' dalam teks utama
  alternative: '''dibawa untuk diselamatkan'' atau ''dibawa untuk dihukum'''
  rationale: Konteks perbandingan dengan zaman Nuh memungkinkan perdebatan tentang nasib orang yang dibawa. Terjemahan mempertahankan ketegangan tersebut dan tidak memilih suatu skema eskatologis tertentu.
- issue: Apakah rujukan maskulin perlu dinyatakan secara eksplisit
  choice: dua laki-laki
  alternative: dua orang
  rationale: Walaupun δύο sendiri hanya berarti 'dua', bentuk maskulin εἷς ... εἷς serta contoh perempuan yang sejajar pada ayat berikutnya menunjukkan adegan yang merujuk kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Bentuk 'yang seorang ... yang lain' menjaga kesejajaran Yunani, sedangkan 'akan' membuat orientasi masa depan jelas dan alami.
