    rationale: Χρονίζει terutama menyatakan penundaan atau kelambatan yang berlangsung; teks tidak menyebut tenggat atau bahwa sang tuan secara objektif sudah terlambat. ‘Lambat datang’ mempertahankan penilaian sang hamba dengan lebih netral.
  - severity: low
