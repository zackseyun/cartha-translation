  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: id
  text: Namun, jika hamba yang jahat itu berkata dalam hatinya, ‘Tuanku lambat datang,’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak yang jahat itu.” Kata Yunani doulos dapat berarti “hamba” atau “budak,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “Majikanku.” Kata Yunani kyrios di sini menunjuk kepada tuan dalam rumah tangga pada perumpamaan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Namun, jika
  rationale: ἐὰν dengan bentuk subjungtif memperkenalkan keadaan bersyarat, sedangkan δέ memberi peralihan yang agak kontras. ‘Namun, jika’ alami dalam bahasa Indonesia dan mempertahankan kedua nuansa itu.
- source_word: εἴπῃ
  choice: berkata
  rationale: 'Aoris subjungtif sesudah ἐὰν paling alami diterjemahkan sebagai verba biasa dalam klausa bersyarat bahasa Indonesia: ‘jika ... berkata’.'
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: hamba yang jahat itu
  rationale: κακός menyatakan keburukan moral; ‘jahat’ jelas dan wajar. δοῦλος diterjemahkan ‘hamba’ karena konteksnya adalah seorang bawahan dalam rumah tangga, sambil mempertahankan kemungkinan ‘budak’ dalam catatan kaki. ἐκεῖνος dipertahankan dengan ‘itu’.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dalam hatinya
  rationale: Terjemahan ini mempertahankan metafora Yunani bagi pikiran atau perkataan batin dan tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: Χρονίζει
  choice: terlambat datang
  rationale: χρονίζω menyatakan bahwa seseorang menunda atau lama datang. Dalam konteks penantian akan kepulangan tuan, ‘terlambat datang’ menyampaikan anggapan hamba itu secara alami tanpa menyatakan alasan penundaan.
- source_word: μου ὁ κύριος
  choice: Tuanku
  rationale: κύριος dalam latar rumah tangga menunjuk kepada orang yang berkuasa atas hamba tersebut. ‘Tuanku’ mempertahankan hubungan personal dari μου dan nuansa sapaan/pengakuan otoritas, tanpa harus memakai gelar ilahi ‘Tuhan’.
theological_decisions:
- issue: Penerjemahan κύριος dalam konteks perumpamaan rumah tangga
  choice: Tuanku
  alternative: Tuhanku; majikanku
  rationale: Pada tingkat cerita, κύριος adalah tuan dari seorang hamba, sehingga ‘Tuanku’ mencerminkan hubungan itu dan tetap memungkinkan pembaca menangkap rujukan perumpamaannya. ‘Tuhanku’ dapat terlalu cepat memberi kapitalisasi teologis, sedangkan ‘majikanku’ lebih sempit dan bernuansa hubungan kerja modern.
- issue: Penerjemahan δοῦλος
  choice: hamba
  alternative: budak
  rationale: ‘Hamba’ cocok dengan peran rumah tangga yang dipercayakan dalam perumpamaan dan memiliki register Alkitab yang masih dapat dipahami. Karena δοῦλος juga dapat berarti ‘budak’, alternatif itu dicatat agar cakupan leksikalnya tidak disembunyikan.
- issue: Makna Χρονίζει
  choice: terlambat datang
  alternative: menunda kedatangannya; lama datang
  rationale: Konteks menunjukkan ketidakhadiran sang tuan dan penantian akan kepulangannya. Terjemahan ini tidak menentukan apakah keterlambatan tersebut objektif atau hanya penilaian hamba yang jahat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Dalam hatinya’ mempertahankan ungkapan sumber. ‘Tuanku’ dipilih untuk latar rumah tangga sekaligus menghindari penghilangan gema teologis secara berlebihan. Kedua penanda catatan kaki ditempatkan dalam teks utama.
