lexical_decisions:
- source_word: ἰδού
  choice: Ingatlah
  rationale: Dalam konteks peringatan ini, kata tersebut berfungsi menarik perhatian dengan tegas; “Ingatlah” terdengar alami dalam bahasa Indonesia dan mengarahkan pembaca pada peringatan yang baru diberikan.
- source_word: προείρηκα
  choice: sudah mengatakannya ... sebelumnya
  rationale: Bentuk perfektum menyatakan bahwa Yesus telah memberi tahu mereka lebih dahulu dan pemberitahuan itu tetap relevan; “sudah” bersama “sebelumnya” mempertahankan aspek dan unsur waktu dari verba tersebut.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Pronomina Yunani berbentuk jamak, tetapi bahasa Indonesia tidak membedakan tunggal dan jamak pada “kamu”; bentuk ini alami untuk sapaan Yesus kepada para murid sebagai kelompok.
