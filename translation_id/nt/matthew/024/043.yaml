id: MAT.24.43
reference: Matthew 24:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: id
  text: 'Namun, ketahuilah hal ini: Seandainya tuan rumah tahu pada giliran jaga malam yang mana pencuri akan datang, ia tentu tetap berjaga dan tidak akan membiarkan rumahnya dibobol.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahnya digali tembus,” menggambarkan rumah pada zaman dahulu yang dapat diterobos dengan menggali tembok atau atapnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Namun, ketahuilah hal ini
  rationale: Mempertahankan peralihan wacana yang ditandai δέ dan daya langsung γινώσκετε, dengan susunan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: οἰκοδεσπότης
  choice: tuan rumah
  rationale: Menyatakan kepala atau penguasa rumah tangga tanpa membatasi makna pada kepemilikan properti modern.
- source_word: ποίᾳ φυλακῇ
  choice: pada giliran jaga malam yang mana
  rationale: φυλακή di sini menunjuk pada salah satu pembagian waktu malam; ungkapan ini mempertahankan unsur budaya sekaligus menjelaskan acuan waktunya.
- source_word: ὁ κλέπτης ἔρχεται
  choice: pencuri akan datang
  rationale: Bentuk kini Yunani berada dalam keadaan hipotetis yang dipandang dari pengetahuan sebelumnya; bentuk futur dalam anak kalimat bahasa Indonesia menyampaikan hubungan waktunya secara alami.
- source_word: ἐγρηγόρησεν ἂν
  choice: ia tentu tetap berjaga
  rationale: Menyampaikan makna kontrafaktual ἄν serta arti γρηγορέω sebagai tetap terjaga atau waspada, selaras dengan gambaran pencuri pada malam hari.
- source_word: οὐκ ἂν εἴασεν
  choice: tidak akan membiarkan
  rationale: Padanan alami yang mempertahankan gagasan bahwa tuan rumah tidak akan mengizinkan peristiwa itu terjadi.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: rumahnya dibobol
  rationale: Secara idiomatis menyampaikan penerobosan rumah oleh pencuri, sementara makna harfiah 'digali tembus' dan latar bangunan kuno dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penggambaran οἰκοδεσπότης
  choice: tuan rumah
  alternative: pemilik rumah; kepala rumah tangga
  rationale: Ini merupakan gambaran perumpamaan, bukan gelar doktrinal. 'Tuan rumah' mempertahankan peran sosialnya tanpa mengimpor asumsi modern tentang status kepemilikan.
- issue: Gambaran budaya tentang pembobolan
  choice: rumahnya dibobol
  alternative: rumahnya digali tembus
  rationale: Terjemahan idiomatis membuat tindakan pencuri jelas bagi pembaca modern, sedangkan gambaran harfiah yang berkaitan dengan konstruksi rumah kuno tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Ungkapan 'giliran jaga malam' mempertahankan pembagian waktu malam dalam dunia kuno tanpa memerlukan catatan tambahan; 'dibobol' dipilih sebagai verba yang lazim dan jelas untuk penerobosan rumah.
