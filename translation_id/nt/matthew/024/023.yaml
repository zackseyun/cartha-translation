base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: id
  text: Pada waktu itu, jika ada orang berkata kepada kalian, “Lihat, Mesias ada di sini!” atau, “Dia ada di sini!” jangan percaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai hubungan waktu dengan uraian sebelumnya secara alami dalam bahasa Indonesia; dalam konteks ini lebih jelas daripada sekadar “lalu”.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: jika ada orang berkata kepada kalian
  rationale: Mempertahankan konstruksi bersyarat dan subjek tak tentu; “kalian” menyatakan bentuk jamak ὑμῖν.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Seruan untuk menarik perhatian yang wajar dalam bahasa Indonesia modern dan tetap mempertahankan daya deiktisnya.
- source_word: ὧδε
  choice: di sini / di sana
  rationale: Secara leksikal berarti “di sini”. Pada klausa kedua, “di sana” dipakai sebagai ungkapan deiktis alami dari sudut pandang penutur Indonesia dalam pasangan “di sini ... di sana”, tanpa mengubah inti klaim tentang lokasi.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi sosok yang diurapi, bukan sebagai nama diri; “Mesias” menyampaikan fungsi gelar itu secara alami.
- source_word: ἤ· Ὧδε
  choice: atau, “Dia ada di sana!”
  rationale: Bahasa Yunani berbentuk elipsis. Subjek dan predikat tersirat dilengkapi agar alami dan jelas dalam bahasa Indonesia, sambil mempertahankan klaim penunjukan lokasi.
- source_word: μὴ πιστεύσητε
  choice: jangan percaya
  rationale: Larangan ini secara alami dipahami mengacu pada klaim yang baru saja dikutip; bahasa Indonesia tidak memerlukan objek eksplisit.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Artikel dan konteks pengakuan palsu menunjukkan bahwa kata ini dipakai sebagai gelar bagi sosok yang dinantikan. “Mesias” mempertahankan fungsi gelar tersebut tanpa menjadikannya sekadar nama.
- issue: Acuan larangan untuk percaya
  choice: jangan percaya
  alternative: jangan memercayainya
  rationale: Teks Yunani tidak menyebut objek secara eksplisit. Bentuk tanpa objek menjaga keterbukaan apakah yang ditekankan adalah perkataan, klaim, atau orang yang mengatakannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipilih untuk memperlihatkan bahwa ὑμῖν berbentuk jamak. Elipsis pada klausa kedua dilengkapi secara minimal demi kelancaran.
