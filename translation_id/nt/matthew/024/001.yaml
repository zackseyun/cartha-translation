source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: id
  text: Yesus keluar dari Bait Allah[a], lalu pergi. Murid-murid-Nya datang kepada-Nya untuk memperlihatkan kepada-Nya bangunan-bangunan Bait Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “Bait Allah” menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: setelah keluar
  rationale: 'Partisip aoris ini menyatakan tindakan yang mendahului verba utama: Yesus keluar terlebih dahulu, kemudian berjalan meninggalkan tempat itu. Bentuk ini mempertahankan urutan tindakan secara alami dalam bahasa Indonesia.'
- source_word: ἱεροῦ
  choice: Bait Allah
  rationale: Ἱερόν menunjuk pada seluruh kompleks atau lingkungan bait, bukan hanya ruang suci bagian dalam. “Bait Allah” merupakan padanan baku dan mudah dipahami; cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: ἐπορεύετο
  choice: berjalan meninggalkannya
  rationale: Bentuk imperfek πορεύομαι menggambarkan gerak yang sedang berlangsung menjauh dari Bait Allah. Ungkapan ini lebih alami daripada terjemahan harfiah “sedang berjalan pergi” dan tetap mempertahankan arah geraknya.
- source_word: προσῆλθον
  choice: datang
  rationale: Aoris προσέρχομαι di sini berarti para murid datang atau menghampiri Yesus. “Datang” wajar dalam alur narasi, sedangkan infinitif berikutnya menyatakan tujuan mereka.
- source_word: ἐπιδεῖξαι
  choice: untuk memperlihatkan
  rationale: Infinitif ini menyatakan tujuan kedatangan para murid. “Memperlihatkan” mempertahankan makna tindakan menunjukkan sesuatu kepada Yesus.
- source_word: οἰκοδομὰς
  choice: bangunan-bangunan
  rationale: Bentuk jamak οἰκοδομάς menunjuk pada berbagai bangunan atau struktur dalam kompleks Bait Allah. Bentuk ulang mempertahankan kejamakan yang eksplisit dalam teks Yunani.
- source_word: τοῦ ἱεροῦ
  choice: Bait Allah
  rationale: Genitif ini menerangkan bahwa bangunan-bangunan tersebut merupakan bagian dari kompleks Bait Allah. Pengulangan istilah mempertahankan penekanan teks sumber.
theological_decisions:
- issue: Pembedaan ἱερόν dan ναός
  choice: Bait Allah dalam teks utama, dengan penjelasan cakupan makna dalam catatan kaki
  alternative: kompleks Bait Allah
  rationale: Teks memakai ἱερόν, yang mencakup seluruh kompleks dan pelataran Bait Allah, bukan hanya ruang suci bagian dalam yang biasanya disebut ναός. Padanan baku “Bait Allah” menjaga kelancaran dan kelaziman bahasa, sedangkan catatan kaki mencegah pembaca memahami istilah itu secara terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Setelah keluar” menjadikan hubungan waktu partisip Yunani jelas tanpa mengubah urutan peristiwa. “Berjalan meninggalkannya” dipilih untuk mengungkapkan gerak yang sedang berlangsung secara idiomatis. Pronomina hormat bagi Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
