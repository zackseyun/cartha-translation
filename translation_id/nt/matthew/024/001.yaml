  to: Yesus keluar dari Bait Allah[a], lalu pergi. Murid-murid-Nya datang kepada-Nya untuk memperlihatkan kepada-Nya bangunan-bangunan Bait Allah.
  rationale: Revisi memperjelas bahwa para murid menghampiri Yesus, sebagaimana ditunjukkan oleh προσῆλθον, dan mengganti ungkapan yang kurang luwes dengan narasi Indonesia yang alami. Bentuk “lalu pergi” tidak menandai aspek imperfek secara leksikal, tetapi secara idiomatis menyampaikan gerak menjauh dalam alur naratif tanpa menambah makna. Catatan kaki dipertahankan dan sedikit dipertegas dengan “pelataran.”
