base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: id
  text: Sebab, sebagaimana halnya pada zaman Nuh, demikian pula halnya kelak pada kedatangan[a] Anak Manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadiran”. Kata Yunani ini dapat berarti “kehadiran” atau “kedatangan”; di sini konteksnya menunjuk pada kedatangan Anak Manusia pada masa mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: sebagaimana ... demikian pula
  rationale: Mempertahankan pola perbandingan korelatif Yunani dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan ayat ini dengan perkataan sebelumnya.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: keadaan pada zaman Nuh
  rationale: Ungkapan Yunani bersifat eliptis. Tambahan 'keadaan' membuat perbandingannya jelas dalam bahasa Indonesia tanpa menentukan secara khusus unsur zaman Nuh yang dimaksud.
- source_word: Νῶε
  choice: Nuh
  rationale: Menggunakan bentuk nama yang sudah baku dalam tradisi dan pemakaian bahasa Indonesia.
- source_word: ἔσται
  choice: kelak
  rationale: Keterangan 'kelak' menyampaikan acuan masa depan dari bentuk verba Yunani secara alami dalam susunan kalimat Indonesia.
- source_word: παρουσία
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, 'kedatangan' menyampaikan daya peristiwa dari istilah tersebut dengan jelas; kemungkinan arti 'kehadiran' dicatat dalam catatan kaki.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar yang mapan serta kaitan antarteksnya, tanpa menggantinya dengan parafrasa yang lebih interpretatif.
theological_decisions:
- issue: Makna παρουσία dalam perkataan eskatologis
  choice: kedatangan
  alternative: kehadiran
  rationale: Konteks menunjuk ke peristiwa pada masa mendatang, sehingga 'kedatangan' paling jelas dalam bahasa Indonesia. Namun, rentang makna istilah Yunani tidak disembunyikan dan alternatifnya dicatat.
- issue: Unsur zaman Nuh yang dibandingkan dengan kedatangan Anak Manusia
  choice: dibiarkan umum sebagai 'keadaan pada zaman Nuh'
  alternative: menentukan bahwa yang dibandingkan ialah perilaku manusia, ketidaksiapan, atau datangnya penghakiman
  rationale: Ayat ini sendiri tidak menyebut secara khusus unsur perbandingannya. Terjemahan tidak boleh menyelesaikan ketegangan itu sebelum penjelasan dalam konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pola 'sebagaimana ... demikian pula' mempertahankan struktur retoris sumber, sedangkan 'keadaan' melengkapi perbandingan eliptis dengan tambahan seminimal mungkin.
