  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: id
  text: 'Demikian juga kalian, ketika kalian melihat semua hal ini, ketahuilah: sudah dekat, di ambang pintu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia sudah dekat.” Bahasa Yunani tidak menyatakan subjeknya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga kamu
  rationale: Menjaga hubungan perbandingan dengan perumpamaan pohon ara sebelumnya sekaligus mempertahankan penekanan pada para murid.
- source_word: ὅταν ἴδητε
  choice: ketika kamu melihat
  rationale: ὅταν dengan aorist subjungtif di sini menunjuk pada keadaan pada masa mendatang; 'ketika' lebih alami daripada bentuk yang menyiratkan pengulangan.
- source_word: πάντα ταῦτα
  choice: semua hal ini
  rationale: Mewakili bentuk jamak netral secara eksplisit tanpa menambahkan penafsiran seperti 'peristiwa-peristiwa'.
- source_word: γινώσκετε
  choice: ketahuilah
  rationale: Mempertahankan daya imperatif kata Yunani dan merupakan ungkapan Indonesia yang wajar dalam konteks ini.
- source_word: ἐγγύς
  choice: sudah dekat
  rationale: '''Dekat'' adalah padanan langsung; ''sudah'' mengungkapkan keadaan yang telah mencapai titik kedekatan tanpa menambahkan penanda intensitas yang tidak ada.'
- source_word: ἐπὶ θύραις
  choice: di ambang pintu
  rationale: Ungkapan Indonesia yang alami untuk kedekatan yang sangat segera. Walaupun θύραις berbentuk jamak, penerjemahan harfiah 'di pintu-pintu' tidak idiomatis dan dapat menyesatkan dalam bahasa Indonesia.
- source_word: ἐγγύς ἐστιν
  choice: ia sudah dekat
  rationale: Bahasa Indonesia memungkinkan pronomina 'ia' tanpa menetapkan secara tegas apakah acuannya pribadi atau nonpribadi; catatan kaki menjelaskan bahwa subjek tidak dinyatakan dalam bahasa Yunani.
theological_decisions:
- issue: Subjek tersirat dalam ἐγγύς ἐστιν
  choice: Menggunakan 'ia' dengan catatan bahwa subjek Yunani tidak dinyatakan
  alternative: '''Dia sudah dekat''; ''hal itu sudah dekat''; ''waktunya sudah dekat'''
  rationale: Teks Yunani tidak menyebutkan subjek. 'Ia' relatif terbuka dalam bahasa Indonesia dan tidak memutuskan apakah yang dimaksud ialah Anak Manusia, suatu peristiwa, kerajaan, atau penggenapannya; catatan kaki mempertahankan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. 'Di ambang pintu' dipilih sebagai idiom alami, sedangkan ambiguitas subjek dipertahankan melalui 'ia' dan dijelaskan dalam catatan kaki.
