id: MAT.24.10
reference: Matthew 24:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: id
  text: Kemudian banyak orang akan berpaling[a]. Mereka akan saling mengkhianati[b] dan saling membenci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan tersandung” atau “akan merasa tersinggung.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan saling menyerahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: kemudian
  rationale: Menandai urutan dalam rangkaian perkataan Yesus dan secara alami menghubungkan ayat ini dengan peristiwa sebelumnya.
- source_word: σκανδαλισθήσονται
  choice: akan berpaling
  rationale: Dalam konteks tekanan dan penganiayaan, bentuk pasif ini menunjuk pada kegagalan atau pembelotan yang serius. 'Berpaling' menyampaikan hal itu tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani dan tanpa mempersempit maknanya menjadi rumusan doktrinal tertentu.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival; 'banyak orang' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: ἀλλήλους
  choice: saling
  rationale: Menyampaikan tindakan timbal balik secara ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: παραδώσουσιν
  choice: akan saling mengkhianati
  rationale: Walaupun makna harfiahnya adalah 'menyerahkan', konteks permusuhan antarmanusia mendukung nuansa pengkhianatan; alternatif harfiah tetap dicatat dalam catatan kaki.
- source_word: μισήσουσιν
  choice: saling membenci
  rationale: Menyampaikan permusuhan aktif serta mempertahankan makna timbal balik dari ἀλλήλους.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Kemudian ... Mereka akan ... dan ...
  rationale: Susunan ini mempertahankan urutan dan perkembangan tindakan, tetapi membaginya menjadi dua kalimat agar terdengar alami dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna σκανδαλισθήσονται dalam konteks penganiayaan pada akhir zaman
  choice: akan berpaling
  alternative: akan tersandung; akan merasa tersinggung
  rationale: '''Berpaling'' mempertahankan keseriusan tindakan meninggalkan kesetiaan yang tersirat dalam konteks, tanpa secara eksplisit menambahkan ''iman'' atau memakai istilah teologis yang lebih sempit seperti ''murtad''.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Berpaling' dipilih untuk menjaga keluasan makna sumber, sedangkan 'saling' secara alami menyatakan tindakan timbal balik.
