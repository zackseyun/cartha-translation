  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: id
  text: tuan[a] budak itu[b] akan datang pada hari yang tidak ia duga dan pada saat yang tidak ia ketahui,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "majikan". Kata Yunani kyrios dapat berarti "tuan" atau "majikan"; di sini kata itu menunjuk kepada atasan manusia dalam perumpamaan.
    reason: lexical_alternative
  - marker: b
    text: Atau "hamba" atau "pelayan". Kata Yunani doulos menunjuk kepada seorang budak atau orang yang berada dalam hubungan pengabdian yang terikat di bawah seorang tuan, bukan sekadar pekerja upahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: akan datang
  rationale: Bentuk mendatang dari ἥκω menyatakan kedatangan; ungkapan ini alami dalam konteks kepulangan sang tuan yang tidak terduga.
- source_word: κύριος
  choice: tuan
  rationale: Dalam dunia cerita perumpamaan ini, kata tersebut menunjuk kepada atasan manusia dalam hubungan rumah tangga, bukan secara langsung kepada gelar ilahi.
- source_word: δούλου
  choice: hamba
  rationale: Dalam bahasa Indonesia, 'hamba' secara wajar menyatakan orang yang berada di bawah kuasa seorang tuan dan mempertahankan pasangan istilah tuan–hamba; alternatif yang lebih tegas tentang status terikat dicatat dalam catatan kaki.
- source_word: ἐκείνου
  choice: itu
  rationale: Kata tunjuk ini merujuk kembali kepada hamba tertentu yang sedang dibicarakan.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: pada hari yang tidak diduganya
  rationale: Terjemahan ini mempertahankan ketidakpastian harinya dan menjadikan hamba sebagai subjek tersirat dari tindakan menduga.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: pada saat yang tidak diketahuinya
  rationale: '''Saat'' menyampaikan arti temporal ὥρα secara alami tanpa menyiratkan bahwa yang dimaksud harus satu jam penuh, serta mempertahankan kesejajaran hari–saat.'
theological_decisions:
- issue: Makna κύριος dalam konteks rumah tangga perumpamaan
  choice: tuan
  alternative: Tuhan; majikan
  rationale: '''Tuan'' mempertahankan gambaran hubungan manusia dalam cerita tanpa menghapus kemungkinan makna eskatologis perumpamaan atau langsung mengubah kata itu menjadi gelar kristologis.'
- issue: Makna δοῦλος dan status sosialnya
  choice: hamba
  alternative: budak; pelayan
  rationale: '''Hamba'' adalah istilah Indonesia yang wajar dalam pasangan tuan–hamba. Namun, karena δοῦλος dapat menandakan status pengabdian yang terikat dan bukan sekadar pekerjaan sukarela, alternatif ''budak'' dicantumkan agar kekuatan sosial istilah Yunani tidak disembunyikan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'tuan dari hamba itu' dipilih untuk memperjelas hubungan kepemilikan/otoritas, sedangkan pasangan 'hari' dan 'saat' mempertahankan kesejajaran temporal Yunani secara alami.
