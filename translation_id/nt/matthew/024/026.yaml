  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: id
  text: Jadi, jika mereka berkata kepadamu, “Lihat, dia ada di padang belantara,” jangan keluar; “Lihat, dia ada di ruang-ruang dalam[a],” jangan percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang-ruang penyimpanan” atau “kamar-kamar tersembunyi.” Kata Yunani ini dapat menunjuk ruang-ruang bagian dalam atau ruang-ruang pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Jadi, jika
  rationale: οὖν menghubungkan ayat ini sebagai kesimpulan atau kelanjutan dari peringatan sebelumnya, sedangkan ἐὰν memperkenalkan keadaan bersyarat. “Jadi, jika” mempertahankan keduanya secara wajar dalam bahasa Indonesia.
- source_word: εἴπωσιν ὑμῖν
  choice: mereka berkata kepadamu
  rationale: Bentuk orang ketiga jamak tidak menunjuk kelompok tertentu. Terjemahan ini mempertahankan ketidakjelasan pelakunya dan objek tak langsung tunggal.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: ἰδού berfungsi menarik perhatian dengan segera. “Lihat” alami, langsung, dan tidak bernuansa arkais.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: ἔρημος dapat berarti kawasan sepi, padang gurun, atau belantara. “Padang belantara” tidak membatasi gambaran pada gurun pasir dan cocok dengan konteks tempat terpencil.
- source_word: ἐστίν
  choice: dia ada
  rationale: Bahasa Indonesia memerlukan subjek yang tersirat dari konteks. “Dia” merujuk kepada sosok yang diberitakan tanpa menambahkan gelar seperti Mesias atau Anak Manusia.
- source_word: μὴ ἐξέλθητε
  choice: jangan pergi ke sana
  rationale: Larangan ini secara harfiah menyatakan agar mereka tidak keluar. Dalam konteks laporan lokasi, “jangan pergi ke sana” menyampaikan gerak menuju tempat yang disebut dengan alami tanpa mengubah maksud.
- source_word: ἐν τοῖς ταμείοις
  choice: di kamar-kamar dalam
  rationale: ταμεῖον dapat menunjuk kamar bagian dalam, kamar pribadi, atau ruang penyimpanan. “Kamar-kamar dalam” mempertahankan gagasan ruang tertutup di bagian dalam tanpa memastikan fungsi atau unsur kerahasiaannya.
- source_word: μὴ πιστεύσητε
  choice: jangan percaya
  rationale: πιστεύω di sini melarang menerima kebenaran laporan tersebut. Dalam bahasa Indonesia, objeknya dapat dibiarkan tersirat dengan jelas dari konteks.
theological_decisions:
- issue: Rujukan subjek tersirat pada ἐστίν
  choice: “dia ada,” tanpa menambahkan gelar
  alternative: “Mesias ada” atau “dia ada di sana”
  rationale: Konteks menunjuk kepada sosok yang kehadirannya diberitakan secara palsu, tetapi klausa Yunani tidak menyebut gelarnya. “Dia” memenuhi kebutuhan tata bahasa Indonesia tanpa menyelesaikan rujukan itu secara lebih eksplisit daripada sumber.
- issue: Hubungan dua laporan lokasi
  choice: Mempertahankan dua klausa sejajar yang dipisahkan titik koma tanpa menambahkan “atau”
  alternative: Menambahkan “atau” sebelum laporan kedua
  rationale: Teks Yunani mengulang Ἰδοὺ tanpa konjungsi disjungtif. Titik koma menjaga kesejajaran dan kesinambungan satu skenario bersyarat tanpa memasukkan hubungan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. “Dia” dipakai sebagai pronomina umum modern, sementara tanda baca mempertahankan struktur paralel teks Yunani.
