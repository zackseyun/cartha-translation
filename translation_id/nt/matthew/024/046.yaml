  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: id
  text: Berbahagialah hamba itu yang didapati tuannya sedang melakukan demikian ketika tuannya datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Ungkapan berkat yang wajar dan bermartabat dalam bahasa Indonesia, bukan sekadar gambaran perasaan senang.
- source_word: δοῦλος
  choice: hamba
  rationale: Mencerminkan kedudukan seorang yang berada di bawah kuasa tuannya dan selaras dengan gaya perumpamaan.
- source_word: κύριος
  choice: tuan
  rationale: Dalam hubungan dengan hamba, kata ini secara kontekstual menunjuk kepada tuannya; pilihan ini mempertahankan relasi tersebut tanpa memaksakan gelar ilahi dalam kalimat perumpamaan.
- source_word: ἐλθὼν ... εὑρήσει
  choice: didapati ... ketika ia datang
  rationale: Mengungkapkan secara alami bahwa pada saat sang tuan tiba, ia menemukan hambanya dalam keadaan sedang melakukan tugas itu.
- source_word: οὕτως ποιοῦντα
  choice: sedang berbuat demikian
  rationale: Mempertahankan rujukan anaforis kepada tindakan yang diperintahkan dalam ayat sebelumnya serta aspek tindakan yang sedang berlangsung.
theological_decisions:
- issue: Apakah κύριος harus diterjemahkan sebagai gelar ilahi atau sebutan bagi pemilik hamba
  choice: tuan
  alternative: Tuhan
  rationale: Pada tingkat cerita, κύριος αὐτοῦ berarti tuan dari hamba itu. Terjemahan ini membiarkan penerapan kristologis dalam konteks yang lebih luas tetap tersirat tanpa memasukkannya secara eksplisit ke dalam istilah perumpamaan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami dengan menempatkan keterangan waktu di akhir; pronomina “ia” secara gramatikal merujuk kepada sang tuan.
