  verdict: revise
  source_fidelity: Draf secara umum menyampaikan pertanyaan retoris, penegasan 'Sesungguhnya', lokasi 'di sini', dan nubuat penghancuran dengan baik. Namun, 'tetap tersusun' menambahkan unsur yang tidak dinyatakan secara eksplisit, sedangkan 'semuanya akan diruntuhkan' mengubah klausa relatif Yunani menjadi pernyataan tambahan yang lebih luas. Revisi mempertahankan struktur dan cakupan klausa relatif tersebut.
  naturalness: Bahasa draf cukup alami dan bernada khidmat. Revisi memakai susunan yang lebih dekat dengan teks sumber tanpa menjadi tidak wajar dalam bahasa Indonesia baku modern.
  terminology: '''Sesungguhnya'', ''batu'', dan ''diruntuhkan'' sesuai untuk register Alkitab Indonesia modern. ''Diruntuhkan'' adalah padanan yang baik bagi καταλυθήσεται dalam konteks bangunan, dan catatan kaki leksikal tetap relevan.'
  issues:
  - severity: medium
    issue: Frasa 'dibiarkan tetap tersusun' menambahkan keterangan 'tetap tersusun'.
    rationale: Teks Yunani hanya menyatakan bahwa tidak satu batu akan 'dibiarkan' di atas batu lain. Keadaan tersusun memang tersirat oleh idiom tersebut, tetapi tidak perlu dieksplisitkan sebagai tambahan dalam terjemahan optimal-ekuivalen.
  - severity: medium
    issue: Klausa 'semuanya akan diruntuhkan' tidak mempertahankan bentuk klausa relatif 'yang tidak akan diruntuhkan'.
    rationale: Walaupun maknanya berdekatan, 'semuanya' dapat terdengar lebih luas daripada anteseden 'satu batu pun'. Bentuk relatif dapat dipertahankan secara jelas dalam bahasa Indonesia.
  - severity: low
    issue: '''Namun'' kurang tepat menangkap δέ dalam konteks ini.'
    rationale: δέ di sini terutama melanjutkan narasi ('Lalu'/'Tetapi'), bukan menyatakan kontras kuat. 'Lalu' lebih netral dan alami.
