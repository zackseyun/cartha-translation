revisions:
- from: 'Namun, Ia menjawab mereka, “Tidakkah kalian melihat semuanya ini? Sesungguhnya Aku berkata kepada kalian: di sini tidak akan ada satu batu pun yang dibiarkan tetap tersusun di atas batu yang lain; semuanya akan diruntuhkan.[a]”'
  to: 'Lalu Ia menjawab dan berkata kepada mereka, “Tidakkah kalian melihat semuanya ini? Sesungguhnya Aku berkata kepada kalian: tidak satu batu pun di sini akan dibiarkan di atas batu yang lain, yang tidak akan diruntuhkan.[a]”'
  rationale: Revisi menghapus tambahan makna 'tetap tersusun', mengganti penghubung pembuka dengan kelanjutan naratif yang lebih netral, dan memulihkan klausa relatif yang menyatakan bahwa tidak ada batu yang akan luput dari peruntuhan. Catatan kaki tetap ditempatkan pada 'diruntuhkan', istilah yang dijelaskannya.
