base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: id
  text: 'Lalu Ia menjawab dan berkata kepada mereka, “Tidakkah kalian melihat semuanya ini? Sesungguhnya Aku berkata kepada kalian: tidak satu batu pun di sini akan dibiarkan di atas batu yang lain, yang tidak akan diruntuhkan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibongkar.” Kata kerja Yunani ini dapat menunjuk pada pembongkaran atau penghancuran suatu bangunan; “diruntuhkan” mempertahankan gambaran batu-batu yang dijatuhkan dari tempatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ia menjawab mereka
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani yang dipengaruhi gaya Semitis. Dalam bahasa Indonesia modern, ‘menjawab mereka’ menyampaikan kedua unsur tersebut secara alami tanpa pengulangan ‘menjawab dan berkata’ yang terasa kaku.
- source_word: Οὐ βλέπετε
  choice: Tidakkah kalian melihat
  rationale: Bentuk pertanyaan retoris ini mengharapkan persetujuan. ‘Melihat’ mempertahankan arti penglihatan langsung sekaligus kemungkinan nuansa memahami apa yang ada di hadapan mereka.
- source_word: ταῦτα πάντα
  choice: semuanya ini
  rationale: Ungkapan ini mewakili demonstrativa netral jamak beserta πᾶς dan dalam konteks menunjuk kepada seluruh bangunan Bait Allah yang baru disebutkan.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya Aku berkata kepada kalian
  rationale: ‘Sesungguhnya’ menyampaikan daya penegasan khidmat ἀμήν, sementara susunan lengkap mempertahankan rumusan khas perkataan Yesus.
- source_word: οὐ μὴ ἀφεθῇ
  choice: tidak akan ada satu batu pun yang dibiarkan
  rationale: Gabungan οὐ μή dengan subjungtif aoris merupakan penyangkalan yang sangat tegas. Bentuk ‘tidak akan ada satu ... pun’ menyampaikan penegasan itu secara wajar dalam bahasa Indonesia.
- source_word: ὧδε
  choice: di sini
  rationale: Adverbia tempat ini menunjuk secara langsung kepada lokasi Bait Allah dalam konteks terdekat.
- source_word: λίθος ἐπὶ λίθον
  choice: satu batu ... di atas batu yang lain
  rationale: Ungkapan konkret ini dipertahankan dengan susunan Indonesia yang alami dan menggambarkan batu-batu yang masih tersusun.
- source_word: καταλυθήσεται
  choice: akan diruntuhkan
  rationale: Dalam konteks bangunan, καταλύω menunjuk pada pembongkaran atau penghancuran struktur. ‘Diruntuhkan’ mempertahankan gambaran fisik batu-batu yang dijatuhkan dari tempatnya.
theological_decisions:
- issue: Cakupan dan daya nubuat Yesus mengenai Bait Allah
  choice: Ayat ini disajikan sebagai nubuat konkret tentang keruntuhan menyeluruh bangunan tersebut.
  alternative: Menafsirkannya terutama sebagai lambang penghakiman atau mengikatnya pada suatu kerangka eskatologis tertentu.
  rationale: Bahasa tentang batu yang tersusun dan diruntuhkan bersifat konkret serta arsitektural. Terjemahan mempertahankan daya tersebut tanpa memasukkan sistem eskatologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. ‘Kalian’ dipakai karena αὐτοῖς dan ὑμῖν berbentuk jamak. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda catatan kaki ditempatkan pada ‘diruntuhkan’, yakni kata yang diterangkan oleh catatan tersebut.
