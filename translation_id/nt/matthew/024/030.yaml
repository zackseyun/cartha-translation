id: MAT.24.30
reference: Matthew 24:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: id
  text: Lalu tanda Anak Manusia akan tampak di langit[a]. Pada waktu itu semua suku di bumi akan meratap[b], dan mereka akan melihat Anak Manusia datang di atas awan-awan langit[c] dengan kuasa dan kemuliaan yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di surga.” Kata Yunani οὐρανός dapat berarti “langit” atau “surga,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua suku di negeri.” Kata Yunani γῆ dapat berarti “bumi” atau “negeri.”
    reason: alternative_reading
  - marker: c
    text: Ungkapan “datang di atas awan-awan langit” menggemakan Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: akan tampak
  rationale: Bentuk ini paling wajar dipahami secara intransitif, yakni menjadi kelihatan atau muncul; “akan tampak” alami dalam bahasa Indonesia dan mempertahankan unsur penampakan yang dapat dilihat.
- source_word: τὸ σημεῖον
  choice: tanda
  rationale: “Tanda” merupakan padanan langsung dan umum, tanpa mempersempit maknanya menjadi isyarat atau pertanda tertentu.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ungkapan “tanda Anak Manusia” mempertahankan konstruksi genitif yang dapat menunjuk pada tanda yang berkaitan dengan Anak Manusia tanpa menetapkan bahwa tanda itu adalah Anak Manusia sendiri.
- source_word: ἐν τῷ οὐρανῷ
  choice: di langit
  rationale: Dalam konteks sesuatu yang tampak, “di langit” merupakan ungkapan Indonesia yang paling alami. Makna alternatif ranah surgawi dipertahankan dalam catatan kaki.
- source_word: κόψονται
  choice: akan meratap
  rationale: Dalam pemakaian ini kata tersebut menyatakan perkabungan atau ratapan. “Meratap” menyampaikan intensitasnya tanpa mewajibkan pembaca membayangkan gerak ritual tertentu.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: semua suku di bumi
  rationale: “Suku” mempertahankan arti dasar φυλή dan gema profetisnya, sedangkan “bumi” sesuai dengan cakrawala kosmis perikop ini; kemungkinan “negeri” dicatat sebagai alternatif.
- source_word: ὄψονται
  choice: mereka akan melihat
  rationale: Padanan langsung dan alami untuk bentuk futurum ὁράω.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: datang di atas awan-awan langit
  rationale: Terjemahan ini mempertahankan gambaran spasial dan gema kuat Daniel 7:13. Bentuk jamak “awan-awan” mencerminkan νεφελῶν.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: dengan kuasa dan kemuliaan yang besar
  rationale: Susunan ini secara alami mengaitkan sifat “besar” dengan “kemuliaan,” sebagaimana posisi πολλῆς dalam bahasa Yunani, tanpa membuat bahasa Indonesia terasa kaku.
theological_decisions:
- issue: Makna “tanda Anak Manusia”
  choice: Mempertahankan ungkapan genitif “tanda Anak Manusia” tanpa menjelaskan identitas tanda itu.
  alternative: “tanda milik Anak Manusia” atau “tanda, yaitu Anak Manusia sendiri”
  rationale: Bahasa Yunani tidak memastikan apakah tanda tersebut berkaitan dengan Anak Manusia, dimiliki-Nya, atau adalah penampakan diri-Nya; ambiguitas eskatologis ini tidak boleh diselesaikan secara diam-diam.
- issue: Cakupan γῆ
  choice: “bumi” dalam teks utama
  alternative: “negeri”
  rationale: Konteks kosmis dan apokaliptis mendukung cakupan universal, tetapi gema kenabian dapat memungkinkan pengertian yang berpusat pada suatu negeri; alternatif tersebut dipertahankan dalam catatan.
- issue: Gema Daniel 7:13
  choice: Mempertahankan rumusan “datang di atas awan-awan langit.”
  alternative: “datang bersama awan-awan langit”
  rationale: Ungkapan spasial merupakan pembacaan langsung yang menjaga hubungan sastra dengan gambaran Anak Manusia dalam Daniel, tanpa menambahkan penjelasan doktrinal ke teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Pada waktu itu” menghindari pengulangan kaku “lalu ... lalu” sambil tetap mewakili καὶ τότε yang kedua. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
