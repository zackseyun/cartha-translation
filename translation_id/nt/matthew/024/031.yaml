id: MAT.24.31
reference: Matthew 24:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: id
  text: Dan Dia akan mengutus malaikat-malaikat-Nya dengan bunyi sangkakala yang nyaring[a], dan mereka akan mengumpulkan orang-orang pilihan-Nya[b] dari keempat penjuru angin[c], dari ujung langit yang satu sampai ke ujung yang lain[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan sangkakala yang besar” atau “dengan tiupan sangkakala yang dahsyat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang terpilih-Nya.”'
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “keempat penjuru angin” berarti segala arah atau tempat-tempat yang paling jauh di setiap arah.
    reason: cultural_note
  - marker: d
    text: 'Secara harfiah: “dari ujung-ujung langit sampai ke ujung-ujungnya,” yaitu dari satu ekstrem sampai ke ekstrem lainnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: akan mengutus
  rationale: Bentuk futur aktif ἀποστέλλω menyatakan pengutusan atau pengiriman dengan tujuan tertentu; “mengutus” alami dan tepat dalam konteks para malaikat.
- source_word: ἀγγέλους
  choice: malaikat-malaikat
  rationale: Dalam konteks eskatologis ini, yang dimaksud ialah makhluk surgawi, bukan utusan manusia.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: dengan bunyi sangkakala yang nyaring
  rationale: μετά dengan genitif menyatakan penyertaan. σάλπιγξ adalah sangkakala, sedangkan μεγάλη dapat menunjuk pada kebesaran atau kuatnya bunyi; penyebutan “bunyi” menghasilkan bahasa Indonesia yang wajar tanpa menghilangkan citra sangkakala.
- source_word: ἐπισυνάξουσιν
  choice: mereka akan mengumpulkan
  rationale: Bentuk futur aktif jamak dengan para malaikat sebagai subjek; “mengumpulkan” sudah mencakup gagasan membawa bersama-sama.
- source_word: ἐκλεκτούς
  choice: orang-orang pilihan
  rationale: Menyampaikan arti leksikalnya dengan bahasa Indonesia yang jelas tanpa menetapkan suatu kerangka teologis sistematis yang tidak dijelaskan dalam ayat ini.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: dari keempat penjuru angin
  rationale: Mempertahankan citra empat angin sekaligus memakai susunan yang dapat dipahami sebagai segala arah.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: dari ujung langit yang satu sampai ke ujung yang lain
  rationale: Ungkapan merismatik ini menyatakan jangkauan menyeluruh. Bentuk idiomatis Indonesia mengomunikasikan dua ekstrem tanpa terjemahan harfiah yang janggal.
theological_decisions:
- issue: Pemaknaan ἐκλεκτούς dalam konteks eskatologis
  choice: orang-orang pilihan-Nya
  alternative: orang-orang terpilih-Nya
  rationale: Pilihan ini mempertahankan makna bahwa mereka dipilih oleh-Nya, tetapi tidak memasukkan rincian doktrinal tentang cara atau dasar pemilihan yang tidak diterangkan oleh ayat.
- issue: Cakupan gambaran pengumpulan
  choice: dari keempat penjuru angin, dari ujung langit yang satu sampai ke ujung yang lain
  alternative: dari keempat arah, dari satu ujung bumi ke ujung lainnya
  rationale: Terjemahan utama mempertahankan keluasan dan citra kosmis teks Yunani, serta tidak mempersempitnya menjadi rujukan geografis kepada bumi saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dia” dipakai untuk subjek ilahi sesuai kebiasaan kapitalisasi dalam teks Alkitab Indonesia; “sangkakala” dipertahankan sebagai istilah biblikal yang umum. Struktur kalimat mengikuti alur Yunani sambil tetap alami dalam bahasa Indonesia.
