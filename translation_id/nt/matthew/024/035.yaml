  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: id
  text: Langit dan bumi akan berlalu, tetapi perkataan-Ku sama sekali tidak akan berlalu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: langit
  rationale: Dalam pasangan eskatologis dengan γῆ, bentuk tunggal ini menunjuk pada langit sebagai bagian dari seluruh tatanan ciptaan, bukan sekadar angkasa yang tampak.
- source_word: ἡ γῆ
  choice: bumi
  rationale: Dalam ungkapan “langit dan bumi”, γῆ menunjuk pada bumi atau dunia, bukan suatu wilayah tertentu.
- source_word: παρελεύσεται
  choice: akan berlalu
  rationale: Ungkapan ini menyatakan berlalunya tatanan ciptaan yang sekarang. “Akan berlalu” alami dalam bahasa Indonesia dan tidak menambahkan penjelasan tentang bagaimana hal itu terjadi.
- source_word: δὲ
  choice: tetapi
  rationale: Kata ini menandai pertentangan antara berlalunya langit dan bumi dengan tetap berlakunya perkataan Yesus.
- source_word: οἱ λόγοι μου
  choice: perkataan-Ku
  rationale: λόγοι di sini merujuk pada segala sesuatu yang diucapkan atau diajarkan Yesus. Bentuk tunggal kolektif “perkataan-Ku” alami dan bermartabat dalam bahasa Indonesia.
- source_word: οὐ μὴ παρέλθωσιν
  choice: sama sekali tidak akan berlalu
  rationale: Konstruksi οὐ μή dengan subjungtif aoristus merupakan penyangkalan yang tegas. “Sama sekali tidak akan” mempertahankan penekanan itu dengan jelas tanpa bahasa arkais.
theological_decisions:
- issue: Bobot pernyataan Yesus mengenai kekekalan perkataan-Nya
  choice: Menerjemahkannya sebagai pertentangan tegas antara tatanan ciptaan yang akan berlalu dan perkataan Yesus yang sama sekali tidak akan berlalu.
  alternative: Menambahkan penafsiran eksplisit mengenai kewibawaan ilahi atau penggenapan setiap nubuat.
  rationale: Ayat ini sendiri menegaskan kepastian dan ketahanan perkataan Yesus. Terjemahan mempertahankan bobot tersebut tanpa memasukkan kesimpulan doktrinal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, khidmat, dan mudah dipahami. Kapital pada akhiran pronomina “-Ku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena penegasan οὐ μή dapat disampaikan langsung secara alami dalam teks utama.
