  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: id
  text: 'Sesungguhnya, Aku berkata kepada kalian: generasi ini pasti tidak akan berlalu sebelum semua hal ini terjadi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum ini” atau “ras ini.” Kata Yunani yang diterjemahkan “generasi” dapat dipahami secara lebih luas, tetapi “generasi” adalah padanan yang paling langsung di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumusan khidmat ἀμὴν λέγω ὑμῖν, “Sesungguhnya” menyampaikan penegasan yang kuat secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini mempertahankan orang pertama, sapaan jamak yang dalam bahasa Indonesia lazim diwakili oleh “kamu”, dan corak pernyataan langsung.
- source_word: ὅτι
  choice: ':'
  rationale: Dalam bahasa Indonesia, isi pernyataan setelah rumusan pembuka lebih alami diperkenalkan dengan tanda titik dua daripada konjungsi “bahwa”.
- source_word: οὐ μὴ παρέλθῃ
  choice: pasti tidak akan berlalu
  rationale: Gabungan οὐ μή dengan aoristus subjungtif menyatakan penyangkalan yang sangat tegas; “pasti tidak akan” mempertahankan daya penegasannya.
- source_word: ἡ γενεὰ αὕτη
  choice: generasi ini
  rationale: “Generasi” adalah padanan paling langsung untuk γενεά dalam konteks ini dan mempertahankan ketegangan penafsiran tanpa menentukan kerangka eskatologis tertentu.
- source_word: ἕως ἂν
  choice: sebelum
  rationale: Dalam konstruksi negatif ini, “sebelum” mengungkapkan batas waktu yang ditandai ἕως ἂν dengan jelas dan alami; “sampai” juga mungkin.
- source_word: πάντα ταῦτα
  choice: semuanya itu
  rationale: Padanan ini mewakili keseluruhan rangkaian hal yang baru disebut dan terdengar lebih alami daripada “semua hal ini” dalam bahasa Indonesia.
- source_word: γένηται
  choice: terjadi
  rationale: Dalam konteks peristiwa, γίνομαι berarti berlangsung atau menjadi kenyataan; “terjadi” adalah padanan modern yang langsung.
theological_decisions:
- issue: Makna “generasi ini” (ἡ γενεὰ αὕτη) dalam khotbah eskatologis
  choice: Diterjemahkan secara leksikal sebagai “generasi ini” tanpa perluasan tafsir.
  alternative: “orang-orang ini”, “bangsa ini”, atau kelompok sezaman dengan Yesus
  rationale: Padanan langsung mempertahankan ambiguitas dan ketegangan eskatologis teks Yunani, tanpa memasukkan suatu skema akhir zaman tertentu ke dalam terjemahan.
- issue: Batas waktu dalam ἕως ἂν πάντα ταῦτα γένηται
  choice: “sebelum semuanya itu terjadi”
  alternative: “sampai semuanya itu terjadi”
  rationale: Keduanya dapat menyampaikan batas waktu, tetapi sesudah klausa negatif, “sebelum” lebih lancar dalam bahasa Indonesia dan tidak mengubah urutan logis pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Huruf kapital pada “Aku” mengikuti kebiasaan penulisan rujukan kepada Yesus dalam teks Alkitab Indonesia. Tanda titik dua membuat rumusan pembuka lebih alami tanpa harus menerjemahkan ὅτι secara kaku.
