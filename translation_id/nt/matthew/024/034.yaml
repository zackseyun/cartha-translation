  verdict: revise
  source_fidelity: Teks utama pada dasarnya setia. Namun, ὑμῖν berbentuk jamak dan lebih baik dinyatakan sebagai “kepada kalian.” Selain itu, πάντα ταῦτα secara eksplisit menunjuk kepada “semua hal ini”; “semuanya itu” dapat dipahami, tetapi kurang mempertahankan demonstratif plural Yunani.
  naturalness: 'Susunan “Sesungguhnya, Aku berkata kepada kalian: ...” baku, khidmat, dan alami dalam bahasa Indonesia modern. “Tidak akan berlalu sebelum semua hal ini terjadi” menyampaikan batas temporal ἕως ἄν dengan wajar setelah negasi tegas.'
  terminology: '“Generasi ini” adalah padanan leksikal yang tepat bagi ἡ γενεὰ αὕτη dan mempertahankan persoalan tafsir tanpa menyelesaikannya. Catatan kaki perlu diperbaiki: “bangsa ini” terutama berarti nation, bukan alternatif “race” yang dimaksud dalam jejak audit bahasa Inggris. “Kaum ini” dan “ras ini” lebih tepat sebagai alternatif yang dicatat.'
  issues:
  - severity: medium
    issue: Sapaan jamak ὑμῖν diterjemahkan “kepadamu.”
    rationale: “Kepadamu” lazimnya bertanda tunggal dalam bahasa Indonesia, sedangkan ὑμῖν adalah bentuk jamak. “Kepada kalian” mempertahankan jumlah tanpa mengubah register secara tidak wajar.
  - severity: low
    issue: πάντα ταῦτα diterjemahkan “semuanya itu.”
    rationale: Terjemahan ini cukup idiomatis, tetapi “itu” mengurangi penunjukan dekat “ταῦτα” dan bentuk plural eksplisit. “Semua hal ini” lebih dekat pada sumber dan tetap alami.
  - severity: medium
    issue: Catatan kaki memakai “bangsa ini” sebagai alternatif bagi makna lebih luas dari γενεά.
    rationale: Dalam pemakaian Indonesia modern, “bangsa” terutama mengacu pada bangsa atau nation. Untuk alternatif yang sepadan dengan “this people” atau “this race,” “kaum ini” atau “ras ini” lebih akurat.
  revised_text: 'Sesungguhnya, Aku berkata kepada kalian: generasi ini pasti tidak akan berlalu sebelum semua hal ini terjadi.[a]'
