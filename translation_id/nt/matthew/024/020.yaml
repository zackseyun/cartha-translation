  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: id
  text: Namun, berdoalah supaya pelarian kalian tidak terjadi pada musim dingin atau pada hari Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada Sabat”; bentuk Yunaninya tidak memakai kata sandang.
    reason: Menjelaskan ambiguitas bentuk anartikular yang tidak dapat direproduksi secara langsung dan alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Bentuk imperatif kini orang kedua jamak; dalam bahasa Indonesia, “berdoalah” menyampaikan perintah secara alami dan bermartabat tanpa harus mengeksplisitkan aspek berkelanjutan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari peringatan sebelumnya; “Namun” alami dalam ragam tulis dan tidak sekeras “tetapi” dalam konteks ini.
- source_word: ἵνα μὴ γένηται
  choice: supaya ... tidak terjadi
  rationale: Sesudah προσεύχεσθε, konstruksi ἵνα dengan subjungtif menyatakan isi atau tujuan doa; “supaya ... tidak terjadi” merupakan padanan Indonesia yang idiomatis.
- source_word: ἡ φυγὴ ὑμῶν
  choice: pelarian kalian
  rationale: φυγή berarti tindakan melarikan diri. “Pelarian” mempertahankan fokus pada peristiwa melarikan diri tanpa menyiratkan bahwa upaya itu pasti berhasil, sedangkan “kalian” menyatakan bentuk jamak secara jelas.
- source_word: χειμῶνος
  choice: pada musim dingin
  rationale: Genitif waktu atau musim ini secara alami diterjemahkan “pada musim dingin” dalam bahasa Indonesia.
- source_word: μηδὲ σαββάτῳ
  choice: atau pada hari Sabat
  rationale: μηδέ mengoordinasikan keadaan negatif kedua. σαββάτῳ menunjuk pada hari Sabat; bahasa Indonesia lazim tidak memakai artikel tak tentu atau tentu, sehingga “pada hari Sabat” mempertahankan referennya tanpa memaksakan pembedaan artikel bahasa Inggris.
theological_decisions:
- issue: Keberadaan atau ketiadaan artikel pada σαββάτῳ
  choice: pada hari Sabat
  alternative: pada suatu hari Sabat; pada hari Sabat itu
  rationale: Bahasa Yunani tidak memakai artikel, tetapi bahasa Indonesia tidak memiliki sistem artikel definit seperti bahasa Inggris. “Pada hari Sabat” adalah bentuk paling alami dan tidak secara teologis memutuskan apakah yang dimaksud ialah suatu hari Sabat atau Sabat sebagai institusi. Alternatif yang memakai “suatu” atau “itu” akan menambahkan ketentuan yang tidak dinyatakan dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. “Kalian” dipilih untuk menyatakan orang kedua jamak secara eksplisit. “Hari Sabat” mengikuti istilah Alkitab Indonesia yang umum, sedangkan struktur kalimat tetap ringkas dan dekat dengan urutan gagasan Yunani.
