  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: id
  text: Di mana pun ada mayat, di situ burung nasar akan berkumpul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “burung rajawali.” Kata Yunani ini biasanya berarti rajawali, tetapi “burung nasar” lebih cocok dengan gambaran burung-burung yang berkumpul di sekitar mayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Di mana pun ada
  rationale: Gabungan ὅπου, ἐάν, dan bentuk subjungtif ᾖ menyatakan tempat yang tidak tertentu. “Di mana pun ada” alami dalam bahasa Indonesia dan mempertahankan makna “wherever.”
- source_word: πτῶμα
  choice: bangkai
  rationale: πτῶμα berarti tubuh yang telah mati. Dalam gambaran burung pemakan bangkai, “bangkai” paling alami dan tidak menentukan apakah tubuh itu manusia atau hewan.
- source_word: συναχθήσονται
  choice: akan berkumpul
  rationale: Walaupun bentuk Yunaninya pasif, dalam konteks ini kata tersebut secara alami menyatakan bahwa burung-burung itu berkumpul. Terjemahan ini mempertahankan makna tanpa bentuk pasif yang kaku.
- source_word: ἀετοί
  choice: burung nasar
  rationale: ἀετός lazim berarti “rajawali,” tetapi dapat merujuk kepada burung pemangsa besar. Konteks burung yang berkumpul pada bangkai paling sesuai dengan “burung nasar”; alternatif leksikalnya tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna kiasan peribahasa ini
  choice: Menerjemahkan gambaran tersebut secara langsung tanpa menetapkan rujukan eskatologisnya.
  alternative: Menafsirkannya secara eksplisit sebagai penghakiman yang tak terelakkan, kedatangan Anak Manusia yang terlihat jelas, kehancuran Yerusalem, atau panji-panji Romawi.
  rationale: Teks Yunani tidak menjelaskan apa yang dilambangkan oleh bangkai atau burung-burung itu. Karena itu, terjemahan mempertahankan gambaran dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan “Di mana pun ... di situ ...” mempertahankan bentuk peribahasa Yunani dengan jelas. “Burung nasar” dipilih sebagai istilah umum yang mudah dipahami.
