  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: id
  text: Sebab bangsa akan bangkit melawan bangsa[a], dan kerajaan melawan kerajaan, dan akan ada kelaparan serta gempa bumi di berbagai tempat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan bangkit menentang bangsa.” Ungkapan Yunani ini menggambarkan pecahnya permusuhan di antara bangsa-bangsa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di tempat-tempat yang berbeda” atau “dari satu tempat ke tempat lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: akan bangkit
  rationale: Bentuk futur ini, dalam ungkapan ἔθνος ἐπὶ ἔθνος, menyatakan munculnya tindakan bermusuhan. “Akan bangkit” mempertahankan gambaran teks tanpa menyiratkan secara eksplisit bahwa Allah membangkitkannya.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini menghubungkan ayat tersebut sebagai penjelasan bagi perkataan sebelumnya; “sebab” mempertahankan hubungan wacana itu secara wajar dalam bahasa Indonesia.
- source_word: ἔθνος
  choice: bangsa
  rationale: Dalam kesejajaran dengan βασιλεία, kata ini menunjuk pada kelompok bangsa dalam konflik. “Bangsa” alami dan tidak mempersempit artinya menjadi bangsa-bangsa bukan Yahudi.
- source_word: ἐπὶ ἔθνος
  choice: melawan bangsa
  rationale: ἐπί dengan akusatif dalam ungkapan permusuhan ini berarti “melawan,” bukan sekadar “atas.”
- source_word: βασιλεία
  choice: kerajaan
  rationale: Di sini kata tersebut menunjuk pada ranah politik yang diperintah seorang raja dan sejajar dengan “bangsa.”
- source_word: ἔσονται
  choice: akan ada
  rationale: Pemakaian eksistensial εἰμί paling alami diterjemahkan “akan ada,” tanpa menambahkan gagasan kausal.
- source_word: λιμοὶ
  choice: kelaparan
  rationale: Kata jamak ini menunjuk pada keadaan kekurangan makanan yang parah. Dalam bahasa Indonesia, “kelaparan” dapat dipakai sebagai nomina massal tanpa penanda jamak.
- source_word: σεισμοὶ
  choice: gempa bumi
  rationale: Dalam konteks ini σεισμός merujuk pada gempa bumi; bentuk Indonesia tidak perlu diulang untuk menyatakan jamak.
- source_word: κατὰ τόπους
  choice: di berbagai tempat
  rationale: Frasa distributif ini menyatakan kejadian di sejumlah lokasi. “Di berbagai tempat” alami sekaligus mempertahankan cakupan yang tidak ditentukan.
theological_decisions:
- issue: Cakupan ἔθνος dalam perkataan mengenai konflik akhir zaman
  choice: bangsa
  alternative: suku bangsa; bangsa-bangsa bukan Yahudi
  rationale: Kesejajarannya dengan “kerajaan” mendukung pengertian kelompok bangsa dalam pergolakan sosial-politik. Pilihan ini tidak memasukkan pembatasan etnis atau teologis yang tidak dinyatakan.
- issue: Daya bentuk pasif ἐγερθήσεται
  choice: akan bangkit melawan
  alternative: akan dibangkitkan untuk melawan
  rationale: Ungkapan ini menggambarkan pecahnya konflik. Terjemahan aktif alami dalam bahasa Indonesia dan tidak mengubah bentuk pasif Yunani menjadi pernyataan eksplisit tentang pelaku ilahi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan verba pada bagian “kerajaan melawan kerajaan” dilesapkan secara alami, mengikuti kesejajaran eliptis teks Yunani. Kalimat dibagi menjadi dua agar daftar bencana mudah dipahami tanpa menghilangkan hubungan antarklausa.
