  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: id
  text: Jadi, siapakah hamba[a] yang setia dan bijaksana, yang diangkat oleh tuannya[b] atas para pelayan rumah tangganya untuk memberi mereka makanan pada waktu yang tepat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak.” Kata Yunani ini dapat berarti budak atau hamba; dalam gambaran ini orang tersebut sepenuhnya berada di bawah wewenang tuannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Tuhan.” Dalam gambaran rumah tangga ini, kata Yunani tersebut diterjemahkan “tuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Jadi, siapakah
  rationale: Partikel ἄρα menarik kesimpulan atau kelanjutan dari ajaran sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya retoris pertanyaannya.
- source_word: πιστὸς
  choice: setia
  rationale: Dalam konteks tugas yang dipercayakan, πιστός menggambarkan orang yang dapat diandalkan. 'Setia' mempertahankan nuansa keandalan sekaligus bobot moralnya.
- source_word: δοῦλος
  choice: hamba
  rationale: '''Hamba'' merupakan padanan Indonesia yang wajar dalam gambaran hubungan dengan seorang tuan dan tidak menghapus kenyataan bahwa orang tersebut berada di bawah wewenang tuannya. Kemungkinan arti yang lebih tegas, ''budak'', dicatat dalam catatan kaki.'
- source_word: φρόνιμος
  choice: bijaksana
  rationale: φρόνιμος menunjuk pada hikmat praktis atau kecakapan bertindak dengan tepat. 'Bijaksana' alami dan sesuai dengan pemakaian istilah ini dalam Injil Matius.
- source_word: κατέστησεν
  choice: ditugaskan
  rationale: Kata ini menyatakan penempatan atau pengangkatan seseorang ke dalam tanggung jawab tertentu. Dalam susunan Indonesia, 'ditugaskan ... untuk mengurus' menyampaikan pendelegasian wewenang dengan lancar.
- source_word: κύριος
  choice: tuan
  rationale: Konteks langsungnya ialah pengelolaan rumah tangga dan hubungan seorang hamba dengan tuannya. 'Tuan' mempertahankan gambaran sosial tersebut tanpa meniadakan kemungkinan bahwa perumpamaan ini mengacu kepada Tuhan.
- source_word: οἰκετείας
  choice: para pelayan rumah tangganya
  rationale: οἰκετεία dapat menunjuk pada sekelompok orang yang menjadi bagian dari rumah tangga, khususnya para pelayan domestik. Padanan ini membuat acuan jamak αὐτοῖς ('mereka') jelas dalam bahasa Indonesia.
- source_word: τοῦ δοῦναι
  choice: untuk ... memberi
  rationale: Infinitif berartikel ini menyatakan tujuan penugasan. 'Untuk ... memberi' menyampaikan fungsi tujuan itu secara alami.
- source_word: τροφὴν
  choice: makanan
  rationale: τροφή berarti makanan atau pemeliharaan. 'Makanan' jelas tanpa mempersempit maknanya menjadi jatah tertentu.
- source_word: ἐν καιρῷ
  choice: pada waktu yang semestinya
  rationale: καιρός menunjuk pada waktu yang sesuai atau tepat, bukan sekadar satu titik waktu. Ungkapan ini mempertahankan nuansa pemberian yang tepat waktu.
theological_decisions:
- issue: Pemaknaan κύριος dalam gambaran rumah tangga
  choice: tuan
  alternative: Tuhan
  rationale: Pada lapisan cerita, κύριος ialah pemilik atau tuan yang memberi tugas kepada hambanya. Terjemahan 'tuan' mempertahankan gambaran rumah tangga, sedangkan kemungkinan pembacaan 'Tuhan' sebagai acuan yang dituju oleh perumpamaan tetap disediakan dalam catatan kaki.
- issue: Status sosial yang dinyatakan oleh δοῦλος
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' terdengar wajar dan bermartabat dalam bahasa Indonesia Alkitabiah modern, tetapi dapat terasa lebih lunak daripada δοῦλος. Karena kata Yunani itu juga dapat menyatakan seorang budak yang sepenuhnya berada di bawah kuasa tuannya, alternatif tersebut dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada bermartabat. Susunan 'ditugaskan ... untuk mengurus' dipilih agar hubungan wewenang dan tujuan penugasan jelas tanpa terasa kaku. Semua kata ganti jamak merujuk secara terang kepada para pelayan rumah tangga.
