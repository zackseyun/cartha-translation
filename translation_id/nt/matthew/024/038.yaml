  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: id
  text: Sebab, sebagaimana pada hari-hari sebelum air bah mereka makan dan minum, menikah dan mengawinkan[a], sampai hari Nuh masuk ke dalam bahtera,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menikah dan dinikahkan.” Kata Yunani membedakan tindakan menikah dari tindakan mengawinkan seseorang, tetapi kata yang kedua juga dapat dipahami sebagai “dinikahkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Sebab, sebagaimana
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ, sedangkan “sebagaimana” menyatakan perbandingan yang diperkenalkan oleh ὡς.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: mereka makan dan minum
  rationale: Konstruksi imperfek perifrastis menggambarkan kegiatan yang terus berlangsung. Dalam bahasa Indonesia, bentuk sederhana ini secara alami menyampaikan keadaan tersebut tanpa memberi kesan pesta pora yang tidak dinyatakan teks.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: pada hari-hari sebelum air bah
  rationale: Ungkapan ini bersifat temporal. “Air bah” merupakan istilah Indonesia yang lazim untuk banjir besar dalam kisah Nuh dan mempertahankan kaitannya dengan Kitab Kejadian.
- source_word: γαμοῦντες
  choice: menikah
  rationale: Kata ini secara langsung menyatakan tindakan memasuki perkawinan. “Menikah” alami, modern, dan tidak membatasi pelakunya pada salah satu jenis kelamin.
- source_word: γαμίζοντες
  choice: mengawinkan
  rationale: Pilihan ini mempertahankan pembedaan leksikal dari γαμοῦντες dengan menyatakan tindakan mengawinkan orang lain, sambil tetap mengakui melalui catatan kaki bahwa bentuk Yunani dapat dipahami secara lain.
- source_word: ἄχρι ἧς ἡμέρας
  choice: sampai pada hari
  rationale: Frasa ini menandai batas akhir kegiatan yang sedang berlangsung dan terdengar wajar dalam bahasa Indonesia.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nuh masuk ke dalam bahtera
  rationale: Bentuk aoris menunjuk pada peristiwa penentu. “Bahtera” adalah istilah baku dalam bahasa Indonesia bagi κιβωτός dalam kisah Nuh dan menjaga hubungan antarteks dengan Kitab Kejadian.
theological_decisions:
- issue: Apakah kegiatan yang disebutkan harus digambarkan sebagai tindakan berdosa atau sebagai kehidupan biasa yang terus berlangsung sebelum penghakiman
  choice: Kegiatan-kegiatan itu diterjemahkan secara netral sebagai tindakan manusia sehari-hari.
  alternative: Memberinya nuansa berlebihan, pemuasan diri, atau kelalaian moral.
  rationale: Partisip-partisip Yunani menyebut makan, minum, dan perkawinan tanpa penilaian moral yang eksplisit. Dalam konteksnya, tekanannya adalah kehidupan normal yang berlangsung tanpa menyadari datangnya penghakiman, bukan bahwa kegiatan-kegiatan itu sendiri berdosa.
- issue: Makna γαμίζοντες dalam pasangan dengan γαμοῦντες
  choice: mengawinkan
  alternative: dinikahkan
  rationale: Bentuk aktif paling langsung mendukung arti menyebabkan atau memberikan seseorang dalam perkawinan. Namun, karena pemakaian dan tradisi teks memungkinkan pemahaman “dinikahkan,” alternatif itu dipertahankan dalam catatan kaki tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk perbandingan serta koma penutup karena ayat ini berlanjut ke ayat berikutnya. “Mereka” mengikuti subjek tersirat dalam bahasa Yunani tanpa menambahkan penilaian terhadap orang-orang pada zaman Nuh.
