  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: id
  text: Kalian akan mendengar tentang peperangan dan kabar tentang peperangan[a]. Janganlah kalian cemas, sebab hal-hal itu harus terjadi, tetapi kesudahannya belum tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “desas-desus tentang peperangan.” Ungkapan Yunani ini dapat berarti kabar, berita, laporan, atau desas-desus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: akan
  rationale: Bentuk mendatang dari μέλλω menyatakan sesuatu yang diperkirakan atau akan terjadi. Dalam bahasa Indonesia, “akan” menyampaikan daya prospektif itu secara alami tanpa melebih-lebihkan unsur kesegeraan.
- source_word: ἀκούειν πολέμους
  choice: mendengar tentang peperangan
  rationale: Dalam konteks menerima informasi mengenai perang, “mendengar tentang” lebih alami daripada sekadar “mendengar” dan tidak menyiratkan bahwa suara pertempuran didengar secara langsung.
- source_word: ἀκοὰς πολέμων
  choice: kabar tentang peperangan
  rationale: ἀκοή dapat berarti kabar, berita, atau laporan. “Kabar” cukup luas dan tidak menyiratkan bahwa informasi itu belum tentu benar, sedangkan alternatif tradisional “desas-desus” dicantumkan dalam catatan kaki.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Jangan sampai kalian panik
  rationale: ὁρᾶτε memperkuat larangan berikutnya sebagai peringatan, sedangkan θροεῖσθε menunjuk pada keadaan terguncang atau menjadi panik. Ungkapan ini ringkas, alami, dan mempertahankan daya peringatannya.
- source_word: δεῖ γὰρ γενέσθαι
  choice: sebab hal-hal itu harus terjadi
  rationale: δεῖ menyatakan keharusan dan γενέσθαι berarti terjadi. “Hal-hal itu” membuat subjek tersiratnya jelas dengan merujuk pada peperangan dan kabar yang baru disebutkan, tanpa menentukan penyebab atau skema eskatologisnya.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: tetapi kesudahannya belum tiba
  rationale: “Kesudahan” mempertahankan cakupan eskatologis τὸ τέλος secara luas, sedangkan “belum tiba” merupakan ungkapan Indonesia yang alami dan tidak menambahkan penentuan waktu.
theological_decisions:
- issue: Cakupan eskatologis τὸ τέλος
  choice: kesudahannya
  alternative: akhir zaman; penggenapan terakhir
  rationale: Terjemahan ini sengaja tetap luas seperti bahasa Yunani dan tidak mengaitkannya dengan skema milenium, masa kesusahan, atau kronologi denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan tetap bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan orang kedua berbentuk jamak. Pengulangan “peperangan” dipertahankan agar sejalan dengan struktur dan penekanan teks Yunani.
