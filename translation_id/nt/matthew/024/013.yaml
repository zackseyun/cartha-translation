  text: But the one who endures to the end will be saved[a][b].
translation:
  language: id
  text: Namun, orang yang bertahan sampai akhir akan diselamatkan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hingga akhir.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dilepaskan.” Kata kerja Yunani yang diterjemahkan “diselamatkan” dapat berarti menyelamatkan atau melepaskan; ungkapan yang lebih luas dipertahankan dalam teks utama karena konteksnya tidak mengharuskan maknanya dipersempit.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan peringatan sebelumnya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: ὁ ... ὑπομείνας
  choice: orang yang bertahan
  rationale: Artikel dan partisip aoris ini berfungsi substantival. Klausa relatif Indonesia menyatakan seorang wakil secara umum tanpa menentukan gender dan tanpa menjadikan tindakan itu khusus sebagai masa lampau.
- source_word: ὑπομείνας (ὑπομένω)
  choice: bertahan
  rationale: Menyampaikan gagasan tetap teguh di bawah tekanan atau pencobaan dengan ungkapan yang langsung dan mudah dipahami; 'bertekun' mungkin, tetapi dapat terdengar lebih bernuansa religius.
- source_word: εἰς τέλος
  choice: sampai akhir
  rationale: Menunjukkan keberlangsungan hingga suatu titik akhir. Ungkapan Indonesia ini alami dan tidak menentukan lebih jauh apa yang dimaksud dengan 'akhir'.
- source_word: οὗτος
  choice: tercermin melalui fokus pada 'orang yang ...'
  rationale: Pronomina penunjuk Yunani bersifat resumtif dan memberi penekanan. Mengulang 'orang itulah' akan lebih harfiah, tetapi kurang alami; konstruksi klausa Indonesia mempertahankan fokus tanpa pengulangan kaku.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk pasif futur ini dapat menunjuk pada keselamatan atau pelepasan. 'Diselamatkan' mempertahankan cakupan yang lebih luas serta bentuk pasif ilahi tanpa mempersempitnya menjadi perlindungan jasmani saja.
theological_decisions:
- issue: Cakupan σωθήσεται dalam konteks ketekunan eskatologis
  choice: akan diselamatkan
  alternative: akan dilepaskan; akan memperoleh keselamatan akhir
  rationale: Ayat ini tidak menjelaskan apakah yang dimaksud khususnya keselamatan eskatologis akhir, pelepasan dari kesusahan, atau keduanya. Terjemahan utama mempertahankan ketegangan tersebut tanpa memasukkan kesimpulan doktrinal tertentu.
- issue: Identitas 'akhir' dalam εἰς τέλος
  choice: akhir
  alternative: kesudahan; akhir hidup; akhir masa kesusahan
  rationale: Teks Yunani tidak menentukan titik akhir itu di dalam frasa ini. Karena itu, terjemahan tidak menambahkan penafsiran yang mempersempit acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan mudah dipahami. 'Namun' menjaga kontras; 'bertahan' menghindari jargon teologis; susunan kalimat dibuat alami sambil mempertahankan ambiguitas asli mengenai 'akhir' dan jenis keselamatan.
