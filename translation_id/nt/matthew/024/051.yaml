  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: id
  text: dan akan membelahnya menjadi dua[a] dan menetapkan bagiannya bersama orang-orang munafik.[b] Di sanalah akan ada tangisan dan kertakan gigi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “menghukumnya dengan sangat berat.” Kata kerja Yunani secara harfiah berarti “membelah menjadi dua.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagiannya” atau “jatahnya bersama orang-orang munafik.” Istilah ini dapat mencakup jatah, nasib, atau tempat yang ditetapkan baginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: akan membelah orang itu menjadi dua
  rationale: Mempertahankan arti konkret verba Yunani, yaitu membelah menjadi dua, serta daya kejut gambaran penghakiman tanpa menggantinya dengan parafrasa.
- source_word: μέρος
  choice: bagiannya
  rationale: Secara langsung mempertahankan gagasan 'bagian' atau 'jatah' yang ditetapkan bagi seseorang, tanpa mempersempitnya menjadi lokasi semata.
- source_word: ὑποκριτῶν
  choice: orang-orang munafik
  rationale: Padanan Indonesia yang baku dan mempertahankan tema khas Matius tentang orang yang penampilan lahiriahnya tidak sesuai dengan kenyataannya.
- source_word: ἐκεῖ
  choice: Di sanalah
  rationale: Menunjuk kembali secara alami dan tegas kepada keadaan atau tempat penghakiman yang baru disebut.
- source_word: κλαυθμὸς
  choice: tangisan
  rationale: Padanan alami yang konsisten dengan rumusan penghakiman berulang dalam Matius.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: kertakan gigi
  rationale: Ungkapan baku dan hidup dalam bahasa Indonesia untuk frasa Yunani tersebut.
theological_decisions:
- issue: Apakah διχοτομήσει perlu dilunakkan menjadi ungkapan hukuman berat
  choice: Mempertahankan gambaran konkret 'membelah orang itu menjadi dua' dalam teks utama
  alternative: menghukumnya dengan sangat berat
  rationale: Arti leksikal yang konkret didukung langsung oleh bahasa Yunani. Mempertahankannya menjaga kerasnya peringatan tanpa menetapkan secara dogmatis apakah gambaran itu harfiah atau kiasan.
- issue: Cara mengungkapkan τὸ μέρος αὐτοῦ ... θήσει
  choice: menetapkan bagiannya bersama orang-orang munafik
  alternative: menempatkannya bersama orang-orang munafik
  rationale: Pilihan ini mempertahankan bahasa pembagian atau penetapan nasib dalam sumber dan tidak menyempitkan 'bagian' hanya menjadi suatu tempat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan kalimat mempertahankan kekuatan gambaran Yunani, sedangkan 'Di sanalah' memberi penekanan alami pada ἐκεῖ. Penanda catatan kaki ditempatkan langsung setelah klausa yang diterangkannya.
