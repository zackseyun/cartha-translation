  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: id
  text: Yesus menjawab mereka, “Waspadalah supaya jangan ada seorang pun yang menyesatkan kalian.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menipu kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: menjawab mereka
  rationale: Gabungan partisip ἀποκριθεὶς dengan εἶπεν merupakan ungkapan naratif yang secara harfiah dapat berbunyi ‘menjawab, berkata kepada mereka’. ‘Menjawab mereka’ menyampaikan makna respons dan tindakan berbicara secara alami tanpa pengulangan yang kaku.
- source_word: Βλέπετε
  choice: Waspadalah
  rationale: Imperatif ini dalam konteks tersebut berarti berjaga-jaga atau berhati-hati. ‘Waspadalah’ alami dalam bahasa Indonesia dan dengan jelas menyampaikan kekuatan perintahnya.
- source_word: μή τις
  choice: supaya jangan ada seorang pun
  rationale: μή dengan bentuk subjungtif sesudah imperatif menyatakan pencegahan. Ungkapan ini mempertahankan cakupan tak tentu τις dan menyampaikan maksud ‘pastikan agar tidak seorang pun’ secara wajar.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina Yunani ini berbentuk jamak. ‘Kalian’ membuat jumlah jamaknya jelas dan sesuai dengan tuturan langsung kepada para murid.
- source_word: πλανήσῃ
  choice: menyesatkan
  rationale: πλανάω dapat berarti menyebabkan orang menyimpang, menyesatkan, atau menipu. ‘Menyesatkan’ mempertahankan gambaran penyimpangan dari jalan yang benar sekaligus mencakup unsur penipuan.
theological_decisions:
- issue: Cakupan peringatan dalam πλανήσῃ
  choice: menyesatkan
  alternative: menipu
  rationale: ‘Menyesatkan’ mempertahankan cakupan yang lebih luas, yaitu dibawa menyimpang melalui tuntunan atau klaim palsu, dan tidak membatasi peringatan ini hanya pada penipuan intelektual. Alternatif ‘menipu’ dicantumkan dalam catatan kaki untuk mempertahankan kemungkinan leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Waspadalah’ mempertahankan nada peringatan yang tegas, sedangkan ‘kalian’ menandai bentuk jamak ὑμᾶς dengan jelas.
