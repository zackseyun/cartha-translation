  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: id
  text: Dua perempuan sedang menggiling dengan batu kilangan[a]; yang satu dibawa, dan yang satu ditinggalkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang menggiling di kilangan” atau “dengan batu giling.” Kata Yunani dapat menunjuk pada kilangan atau batu kilangan.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani hanya mengatakan “yang satu dibawa, dan yang satu ditinggalkan,” tanpa menjelaskan di sini apakah yang dibawa itu menuju keselamatan atau penghukuman.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Dua perempuan sedang menggiling
  rationale: Partisipel ἀλήθουσαι berbentuk feminin jamak dan berarti ‘menggiling’; karena tidak ada nomina yang dinyatakan, bahasa Indonesia secara wajar menyebut subjeknya sebagai ‘perempuan’. Bentuk ‘sedang menggiling’ menggambarkan kegiatan yang tengah berlangsung.
- source_word: ἐν τῷ μύλῳ
  choice: dengan batu kilangan
  rationale: μύλος dapat menunjuk pada kilangan atau batu kilangan. Dalam konteks pekerjaan rumah tangga, ‘dengan batu kilangan’ menyampaikan alat yang dipakai tanpa mengandaikan bangunan penggilingan.
- source_word: μία ... μία
  choice: yang satu ... yang satu
  rationale: Ungkapan distributif ini membedakan kedua perempuan secara alami dalam bahasa Indonesia.
- source_word: παραλαμβάνεται
  choice: dibawa
  rationale: Bentuk pasif ini dapat berarti diambil atau dibawa serta. ‘Dibawa’ ringkas dan tidak menentukan apakah tindakan tersebut bermakna keselamatan atau penghukuman.
- source_word: καὶ
  choice: dan
  rationale: Mencerminkan konjungsi koordinatif Yunani tanpa menambahkan pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: ἀφίεται
  choice: ditinggalkan
  rationale: Padanan langsung yang mempertahankan kontras dengan ‘dibawa’ tanpa memperkuatnya menjadi ‘ditelantarkan’.
theological_decisions:
- issue: Subjek feminin yang tersirat dalam partisipel Yunani
  choice: Menyatakan subjek sebagai ‘perempuan’
  alternative: Dua orang sedang menggiling
  rationale: Bentuk feminin jamak ἀλήθουσαι secara khusus menunjukkan bahwa kedua subjek adalah perempuan.
- issue: Makna eskatologis ‘dibawa’ dan ‘ditinggalkan’
  choice: Mempertahankan ungkapan netral tanpa menentukan hasil akhirnya
  alternative: Menjelaskan bahwa yang dibawa diselamatkan atau dihukum
  rationale: Ayat ini sendiri tidak secara eksplisit menetapkan apakah tindakan membawa itu menuju keselamatan atau penghukuman; ambiguitas dan ketegangan teologisnya perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Batu kilangan’ dipilih sebagai istilah yang mudah dipahami dalam konteks kuno; struktur paralel ‘yang satu ... dan yang satu ...’ mempertahankan keseimbangan kalimat Yunani.
