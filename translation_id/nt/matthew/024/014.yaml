id: MAT.24.14
reference: Matthew 24:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: id
  text: Dan kabar baik ini tentang Kerajaan akan diberitakan di seluruh dunia[a] sebagai kesaksian kepada semua bangsa[b], lalu akhir itu akan datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seluruh dunia yang dihuni”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada semua suku bangsa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: akan diberitakan
  rationale: Bentuk pasif futur ini menunjuk pada penyampaian di muka umum. “Akan diberitakan” alami dalam bahasa Indonesia dan tidak membatasi tindakan itu pada khotbah gerejawi.
- source_word: εὐαγγέλιον
  choice: kabar baik
  rationale: Menyampaikan makna dasar istilah Yunani secara transparan bagi pembaca modern; “Injil” tetap dicatat sebagai alternatif yang lazim.
- source_word: τῆς βασιλείας
  choice: tentang Kerajaan
  rationale: Dalam konteks ini, genitif tersebut menjelaskan pokok kabar baik, yaitu Kerajaan atau pemerintahan Allah. “Tentang” lebih alami dalam bahasa Indonesia daripada “dari” tanpa mengubah acuannya.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: di seluruh dunia
  rationale: Ungkapan ini secara idiomatis menyampaikan cakupan οἰκουμένη, yakni dunia yang dihuni, sambil menjaga keluasan pernyataannya.
- source_word: εἰς μαρτύριον
  choice: sebagai kesaksian
  rationale: 'Mempertahankan nuansa tujuan atau hasil: pemberitaan itu berfungsi sebagai kesaksian, tanpa menentukan secara eksplisit apakah kesaksian tersebut mendukung atau menentang para pendengarnya.'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: kepada semua bangsa
  rationale: “Bangsa” mempertahankan hubungan leksikal dan gema biblis ἔθνη, tanpa mempersempitnya menjadi hanya orang bukan Yahudi.
- source_word: ἥξει
  choice: akan datang
  rationale: Padanan yang langsung dan wajar bagi ἥκω dalam konteks ini.
- source_word: τὸ τέλος
  choice: kesudahan itu
  rationale: “Kesudahan” mengungkapkan akhir atau penyelesaian dengan bobot eskatologis yang wajar. Artikel Yunani dipertahankan melalui “itu” tanpa menjelaskan lebih jauh hal yang akan berakhir.
theological_decisions:
- issue: Cakupan οἰκουμένη dan ἔθνη dalam perkataan eskatologis
  choice: Menggunakan bahasa bercakupan universal, yaitu “di seluruh dunia” dan “kepada semua bangsa”.
  alternative: “Di seluruh dunia yang dihuni” dan “kepada semua suku bangsa”.
  rationale: Terjemahan menjaga keluasan pernyataan tanpa membatasinya pada Kekaisaran Romawi ataupun menjadikannya kategori teknis misi modern, serta tidak menetapkan skema waktu penggenapannya.
- issue: Makna τὸ τέλος
  choice: “Kesudahan itu” tanpa penjelasan tambahan.
  alternative: “Akhir itu” atau “penggenapan itu”.
  rationale: Teks menyebut suatu akhir yang tertentu dalam konteks, tetapi tidak merincinya dalam ayat ini. Terjemahan tidak memasukkan kerangka eskatologis tertentu.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi “Kerajaan” menandai Kerajaan Allah yang tersirat dari konteks, tanpa menambahkan kata “Allah” ke dalam teks. Susunan kalimat mempertahankan alur Yunani: pemberitaan universal, fungsi sebagai kesaksian, kemudian datangnya kesudahan.'
