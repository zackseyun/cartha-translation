  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: id
  text: Sebab sama seperti kilat memancar dari timur dan terlihat sampai ke barat, demikian pula kedatangan Anak Manusia akan terjadi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadiran”. Kata Yunani παρουσία dapat berarti “kehadiran” atau “kedatangan”, tetapi dalam konteks ini menunjuk pada kedatangan Anak Manusia pada masa mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab sama seperti
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ, sedangkan “sama seperti” menyampaikan perbandingan ὥσπερ secara alami dalam bahasa Indonesia.
- source_word: ἡ ἀστραπή
  choice: kilat
  rationale: ἀστραπή dalam perumpamaan ini menunjuk pada fenomena kilat, bukan sekadar cahaya atau sinar.
- source_word: ἐξέρχεται
  choice: memancar
  rationale: Secara harfiah berarti ‘keluar’ atau ‘muncul’. Untuk kilat, “memancar” menyampaikan kemunculan yang terlihat secara alami tanpa mengubahnya menjadi sekadar ‘bersinar’.
- source_word: ἀπὸ ἀνατολῶν
  choice: dari timur
  rationale: Dalam pertentangan arah dengan δυσμῶν, ἀνατολῶν secara jelas dan idiomatis berarti “timur”.
- source_word: φαίνεται
  choice: terlihat
  rationale: Bentuk ini menyatakan bahwa kilat tampak atau dapat dilihat; “terlihat” mempertahankan sifat publik dan kasatmata dari perbandingan tersebut.
- source_word: ἕως δυσμῶν
  choice: sampai ke barat
  rationale: ἕως menyatakan batas jangkauan, dan δυσμῶν menunjuk pada arah barat; ungkapan ini mempertahankan bentangan timur-ke-barat.
- source_word: οὕτως ἔσται
  choice: demikian pula kelak
  rationale: “Demikian pula” mempertahankan hubungan perbandingan, dan “kelak” menyampaikan daya futur bentuk ἔσται secara wajar tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ἡ παρουσία
  choice: kedatangan
  rationale: παρουσία dapat berarti kehadiran atau kedatangan. Dalam konteks eskatologis ini, “kedatangan” paling jelas menyampaikan peristiwa mendatang, sementara alternatif leksikalnya dipertahankan dalam catatan kaki.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini merupakan padanan baku bagi gelar tersebut dan mempertahankan kaitan antarteksnya, termasuk dengan Daniel 7.
theological_decisions:
- issue: Pemaknaan παρουσία dalam perkataan eskatologis
  choice: kedatangan
  alternative: kehadiran
  rationale: Perbandingan dengan kilat menekankan manifestasi yang nyata dan tidak tersembunyi. Dalam konteks ini, “kedatangan” paling alami menyampaikan arti peristiwa mendatang tanpa memasukkan skema doktrinal tertentu. Karena παρουσία juga dapat berarti “kehadiran”, kemungkinan itu dicatat tanpa menghapus ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan perbandingan dibuat alami bagi pembaca umum, sementara istilah gelar “Anak Manusia” dan ambiguitas παρουσία dipertahankan.
