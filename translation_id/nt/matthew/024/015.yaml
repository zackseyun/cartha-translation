id: MAT.24.15
reference: Matthew 24:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: id
  text: Jadi, ketika kamu melihat “kekejian yang mendatangkan kehancuran,” yang telah dikatakan melalui nabi Daniel, berdiri di suatu tempat suci[a]—hendaklah pembaca memahaminya—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “di tempat suci itu.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan “kekejian kehancuran” atau “kekejian yang menghancurkan”; ungkapan tersebut menggemakan Kitab Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Jadi, ketika
  rationale: Mengungkapkan peralihan/inferensi οὖν dan keadaan masa depan yang diperkenalkan ὅταν secara alami dalam bahasa Indonesia.
- source_word: ἴδητε
  choice: kamu melihat
  rationale: Padanan langsung bagi bentuk orang kedua jamak; bahasa Indonesia tidak menandai jumlah pada pronomina ini, tetapi konteks sapaan tetap terpelihara.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: kekejian yang mendatangkan kehancuran
  rationale: Mengungkapkan hubungan genitif yang ambigu secara wajar, sambil mempertahankan gema ungkapan dalam Daniel; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: yang dibicarakan melalui Nabi Daniel
  rationale: Bentuk pasif partisipial diterjemahkan dengan klausa relatif alami, sedangkan διά dengan genitif dipertahankan sebagai perantaraan melalui Daniel.
- source_word: ἑστὸς
  choice: berdiri
  rationale: Padanan langsung bagi partisip perfektum ἵστημι tanpa menafsirkan referennya sebagai orang atau benda yang didirikan.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: di suatu tempat suci
  rationale: Kata sandang tak tentu 'suatu' mencerminkan frasa Yunani tanpa artikel dan menghindari pembatasan otomatis pada satu bagian tertentu dari Bait Allah.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: hendaklah pembaca memahaminya
  rationale: Mempertahankan seruan parentetis dan daya imperatif νοείτω dalam ragam Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Ketakrifan τόπῳ ἁγίῳ dan kemungkinan rujukan khusus kepada Bait Allah
  choice: di suatu tempat suci
  alternative: di tempat suci itu
  rationale: Bahasa Yunani tidak memakai artikel. Rujukan kepada Bait Allah mungkin tersirat oleh konteks, tetapi teks utama tidak mempersempitnya secara paksa.
- issue: Makna frasa Danielik βδέλυγμα τῆς ἐρημώσεως
  choice: kekejian yang mendatangkan kehancuran
  alternative: kekejian kehancuran; kekejian yang menghancurkan
  rationale: Pilihan utama terdengar alami dan mempertahankan kemungkinan bahwa kekejian itu menghasilkan kehancuran, sementara catatan kaki menjaga bentuk genitif yang lebih formal dan alternatif desolatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang bermartabat. Tanda petik menandai ungkapan Danielik; sisipan penulis dipertahankan dengan tanda pisah. Semua penanda catatan kaki muncul dalam teks utama.
