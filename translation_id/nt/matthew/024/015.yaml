  - severity: low
    issue: Kapitalisasi “Nabi Daniel”
    rationale: 'Dalam bahasa Indonesia baku, “nabi” sebagai jabatan umum sebelum nama diri lazimnya ditulis huruf kecil: “nabi Daniel.”'
