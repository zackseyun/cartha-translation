  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: id
  text: Orang yang berada di ladang janganlah kembali untuk mengambil jubahnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaiannya” atau “pakaian luarnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: orang yang berada di ladang
  rationale: Frasa berartikel ini berfungsi sebagai substantif dan menunjuk kepada seseorang yang berada di ladang. Pilihan ini mempertahankan bentuk tunggal yang representatif tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: janganlah kembali
  rationale: Imperatif aoris dengan μή menyatakan larangan, sedangkan ὀπίσω bersama ἐπιστρεψάτω bermakna kembali, bukan sekadar bergerak ke arah belakang. 'Janganlah kembali' menyampaikan desakan secara wajar dan bermartabat.
- source_word: ἆραι
  choice: untuk mengambil
  rationale: Infinitif aoris ini menyatakan tujuan dari tindakan kembali. 'Untuk mengambil' merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: jubahnya
  rationale: ἱμάτιον lazim menunjuk pada pakaian luar atau kain penutup. 'Jubah' sesuai dengan konteks dunia kuno dan adegan pelarian mendesak, sementara catatan kaki mempertahankan cakupan leksikal yang lebih luas.
theological_decisions:
- issue: Representasi gender pada artikel maskulin yang dipakai secara substantival
  choice: orang yang berada di ladang
  alternative: laki-laki yang berada di ladang
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dalam konteks peringatan ini bersifat umum dan representatif. 'Orang' tidak mempersempit rujukan kepada laki-laki dan tetap mempertahankan fokus pada individu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan mendesak. Bentuk 'janganlah' mempertahankan daya larangan tanpa terdengar terlalu percakapan; 'jubah' diberi alternatif karena ἱμάτιον dapat merujuk lebih umum pada pakaian atau pakaian luar.
