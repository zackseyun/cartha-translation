  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: id
  text: lalu mulai memukuli sesama budaknya[a], serta makan dan minum bersama orang-orang yang suka mabuk[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesama hambanya.” Secara harfiah, kata Yunani ini berarti orang-orang yang sama-sama berstatus budak di bawah satu tuan.
    reason: alternative_reading
  - marker: b
    text: Atau “bersama para pemabuk.” Bentuk Yunani ini dapat menunjuk orang-orang yang dicirikan oleh kebiasaan mabuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: mulai memukuli
  rationale: Gabungan verba ini menyatakan awal tindakan. Bentuk berulang “memukuli” secara alami menyampaikan kekerasan yang berkelanjutan atau berulang dalam konteks ini.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: sesama budaknya
  rationale: σύνδουλος menunjuk budak lain yang berada di bawah tuan yang sama. “Sesama budaknya” mempertahankan status sosial bersama itu dan hubungan kepemilikan yang dinyatakan αὐτοῦ.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: serta makan dan minum
  rationale: Terjemahan ini mempertahankan pasangan verba Yunani dan alur daftar tindakan; δέ di sini bersifat penghubung ringan.
- source_word: μετὰ τῶν μεθυόντων
  choice: bersama orang-orang yang suka mabuk
  rationale: Partisipel kini dapat menggambarkan orang yang berciri kebiasaan bermabuk-mabukan. Ungkapan ini mempertahankan nuansa karakteristik tanpa menjadikannya sekadar keadaan mabuk sesaat.
theological_decisions:
- issue: Penerjemahan istilah keluarga δοῦλος dalam συνδούλους
  choice: sesama budaknya
  alternative: sesama hambanya
  rationale: Latar rumah tangga perumpamaan menonjolkan bahwa mereka sama-sama berada di bawah kuasa satu tuan. “Budak” lebih langsung mempertahankan realitas keterikatan sosial dalam istilah Yunani, sedangkan catatan kaki menyediakan padanan yang lebih tradisional.
- issue: Nuansa τῶν μεθυόντων
  choice: orang-orang yang suka mabuk
  alternative: para pemabuk
  rationale: Pilihan utama mempertahankan bentuk deskriptif partisipel dan kemungkinan nuansa kebiasaan, tanpa mengubahnya menjadi label substantif yang lebih tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat sengaja diawali dengan huruf kecil dan diakhiri koma karena ayat ini merupakan kelanjutan langsung dari konteks sintaksis ayat-ayat sekitarnya.
