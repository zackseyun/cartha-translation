id: MAT.24.3
reference: Matthew 24:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: id
  text: Ketika Ia sedang duduk di Bukit Zaitun, murid-murid datang kepada-Nya secara tersendiri dan berkata, “Katakanlah kepada kami, kapan semua itu akan terjadi, dan apa tanda kedatangan-Mu[a] dan kesudahan zaman[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadiran-Mu” atau “tibanya-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penyelesaian zaman”; secara tradisional, “akhir dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Ketika Dia sedang duduk
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu yang sedang berlangsung. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan aspek duratifnya.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: Bukit Zaitun
  rationale: Nama tempat yang baku dan mudah dikenali dalam bahasa Indonesia untuk lokasi yang secara harfiah berarti ‘Gunung Zaitun’.
- source_word: προσῆλθον αὐτῷ
  choice: datang kepada-Nya
  rationale: Menyampaikan gerak mendekati Yesus secara wajar tanpa menambah rincian yang tidak dinyatakan teks.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Ungkapan ini berarti terpisah dari orang lain atau dalam suasana privat; padanan yang dipilih ringkas dan alami.
- source_word: Εἰπὸν ἡμῖν
  choice: Katakanlah kepada kami
  rationale: Mempertahankan bentuk permintaan langsung dari imperatif aoris λέγω dalam register yang wajar dan bermartabat.
- source_word: πότε ταῦτα ἔσται
  choice: kapan semua itu akan terjadi
  rationale: ‘Akan terjadi’ merupakan padanan idiomatis untuk futuritas ἔσται dalam pertanyaan tentang berbagai hal yang baru saja disebutkan.
- source_word: σημεῖον
  choice: tanda
  rationale: Padanan baku yang mempertahankan fungsi indikatif atau pengenal dari σημεῖον.
- source_word: παρουσίας
  choice: kedatangan
  rationale: Dalam pertanyaan yang berorientasi pada masa depan ini, ‘kedatangan’ menyampaikan daya eskatologis istilah tersebut secara jelas, sementara kemungkinan arti ‘kehadiran’ dipertahankan dalam catatan kaki.
- source_word: συντελείας
  choice: kesudahan
  rationale: ‘Kesudahan’ menyatakan penyelesaian atau titik akhir dengan register yang bermartabat dan tidak menyederhanakan istilah itu menjadi kehancuran.
- source_word: αἰῶνος
  choice: zaman
  rationale: αἰών menunjuk pada zaman atau kurun, bukan secara langsung pada dunia fisik; ‘zaman’ mencegah penambahan klaim kosmologis yang tidak dinyatakan.
theological_decisions:
- issue: Makna παρουσία dalam wacana eskatologis
  choice: kedatangan
  alternative: kehadiran; tibanya Engkau
  rationale: Konteks pertanyaan para murid mengarah pada peristiwa mendatang, sehingga ‘kedatangan’ paling jelas. Namun, rentang leksikal yang mencakup ‘kehadiran’ tidak dihapus dan dicatat sebagai alternatif.
- issue: Makna συντελείας τοῦ αἰῶνος
  choice: kesudahan zaman
  alternative: penggenapan zaman; akhir zaman; secara tradisional, akhir dunia
  rationale: Frasa Yunani berbicara tentang penyelesaian atau akhir suatu zaman, bukan secara eksplisit tentang musnahnya dunia fisik. Pilihan ini mempertahankan ketegangan eskatologis tanpa melampaui teks.
- issue: Hubungan tanda dengan kedatangan dan kesudahan zaman
  choice: tanda kedatangan-Mu dan kesudahan zaman
  alternative: tanda bagi kedatangan-Mu dan bagi kesudahan zaman
  rationale: Susunan ringkas mempertahankan kemungkinan bahwa satu tanda berkaitan dengan kedua hal tersebut, tanpa menjelaskan hubungan keduanya lebih jauh daripada konstruksi Yunani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan kapital menurut kebiasaan umum penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskan.
