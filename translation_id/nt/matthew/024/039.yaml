  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: id
  text: Mereka tidak tahu sampai air bah datang dan menghanyutkan mereka semua. Demikian juga akan terjadi pada kedatangan Anak Manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: tidak menyadarinya
  rationale: Dalam konteks orang-orang sebelum air bah yang tidak tanggap terhadap apa yang akan terjadi, ungkapan ini secara alami menyatakan bahwa mereka tidak menyadari bahaya yang mendekat; akhiran -nya menjaga objek tetap tersirat seperti dalam bahasa sumber.
- source_word: κατακλυσμός
  choice: air bah
  rationale: Istilah baku dan mudah dipahami untuk banjir besar pada zaman Nuh.
- source_word: ἦρεν ἅπαντας
  choice: menghanyutkan mereka semua
  rationale: ἀίρω secara harfiah dapat berarti 'mengambil/mengangkat', tetapi dengan air bah sebagai pelaku, 'menghanyutkan' menyampaikan tindakan yang konkret dan akibat penghukuman tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: οὕτως ... καί
  choice: Demikian juga
  rationale: Mencerminkan perbandingan οὕτως serta unsur aditif καί dalam teks kritis.
- source_word: παρουσία
  choice: kedatangan
  rationale: Padanan Indonesia yang alami untuk kehadiran melalui kedatangan dalam konteks eskatologis ini, tanpa memasukkan istilah doktrinal tambahan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar tradisional dan jelas dalam bahasa Indonesia, dengan kapitalisasi yang menunjukkan pemakaiannya sebagai gelar bagi Yesus.
theological_decisions:
- issue: Sifat ketidaktahuan orang-orang sebelum air bah
  choice: tidak menyadarinya
  alternative: tidak mengetahui
  rationale: Pilihan ini mempertahankan ketidaktanggapan mereka tanpa menentukan secara berlebihan apakah mereka sama sekali tidak pernah menerima peringatan.
- issue: Daya banding antara air bah dan kedatangan Anak Manusia
  choice: Demikian juga kelak kedatangan Anak Manusia
  alternative: Demikianlah kedatangan Anak Manusia nanti
  rationale: Ungkapan ini mempertahankan analogi dan unsur 'juga' dalam καί, serta menyatakan orientasi masa depan dari ἔσται tanpa menjelaskan aspek kedatangannya lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua kalimat dipakai agar mudah dibaca, sementara hubungan perbandingan tetap jelas. Tidak diperlukan catatan kaki.
