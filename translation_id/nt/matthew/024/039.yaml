  naturalness: “Demikian juga kelak kedatangan Anak Manusia” merupakan fragmen nominal dalam prosa Indonesia modern dan terdengar tidak lengkap. “Demikian juga akan terjadi pada kedatangan Anak Manusia” alami, lengkap, dan mempertahankan hubungan perbandingan.
  terminology: “Air bah,” “menghanyutkan mereka semua,” dan “Anak Manusia” adalah pilihan yang tepat dan lazim. “Kedatangan” tetap dipertahankan sebagai padanan παρουσία.
