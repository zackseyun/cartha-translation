  text: then those in Judea must flee to the mountains,[a]
translation:
  language: id
  text: maka orang-orang yang berada di Yudea harus melarikan diri ke pegunungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hendaklah mereka melarikan diri ke pegunungan.”'
    reason: Alternatif ini mencerminkan bentuk imperatif orang ketiga secara lebih formal.
lexical_decisions:
- source_word: τότε
  choice: maka
  rationale: Menandai urutan waktu sekaligus kelanjutan akibat dalam wejangan Yesus; “maka” alami dalam konteks ini dan mempertahankan gerak maju tuturan.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: orang-orang yang berada di Yudea
  rationale: Artikel dengan frasa preposisional berfungsi substantival dan menunjuk kepada orang-orang yang berada di wilayah itu. Bentuk ini jelas dan tidak mempersempit rujukannya.
- source_word: Ἰουδαίᾳ
  choice: Yudea
  rationale: Bentuk nama geografis yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: φευγέτωσαν
  choice: harus melarikan diri
  rationale: Imperatif aktif kini orang ketiga jamak menyampaikan perintah yang mendesak. “Harus melarikan diri” mengungkapkan daya imperatif secara alami dalam bahasa Indonesia modern.
- source_word: ἐπὶ τὰ ὄρη
  choice: ke pegunungan
  rationale: Dengan verba gerak, ἐπί berakusatif menunjukkan arah atau tujuan. “Ke pegunungan” mempertahankan bentuk jamak ὄρη dan lebih tepat daripada “ke bukit-bukit”.
theological_decisions:
- issue: Daya imperatif dalam peringatan eskatologis
  choice: 'Diterjemahkan sebagai perintah langsung dan mendesak: “harus melarikan diri.”'
  alternative: “hendaklah mereka melarikan diri”
  rationale: Ayat ini memberi petunjuk praktis tanpa menetapkan skema eskatologis tertentu. Pilihan ini mempertahankan urgensi perintah dan tidak menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Maka” menjaga kesinambungan wacana; “harus melarikan diri” menyampaikan urgensi tanpa terdengar kaku. Penanda catatan kaki [a] dicantumkan dalam teks utama.
