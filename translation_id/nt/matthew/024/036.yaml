  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: id
  text: Namun, tentang hari dan saat itu, tidak seorang pun tahu—bahkan para malaikat di surga dan Sang Anak pun tidak tahu—kecuali Bapa saja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat frasa “dan Sang Anak pun tidak tahu.” Teks utama mengikuti bacaan SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Namun, tentang
  rationale: περί dengan bentuk genitif memperkenalkan pokok pembicaraan, sedangkan δέ menandai peralihan dengan nuansa pertentangan ringan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kedua fungsi itu.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: hari dan saat itu
  rationale: Satu kata penunjuk ἐκείνης menerangkan rangkaian 'hari dan saat' sebagai satu kesatuan. 'Saat' menyampaikan ὥρα secara alami tanpa menyempitkannya secara tidak perlu menjadi jam tertentu.
- source_word: οὐδεὶς οἶδεν
  choice: tidak seorang pun tahu
  rationale: οὐδείς menyatakan penyangkalan universal yang tegas, dan οἶδεν bermakna 'tahu' dalam pemakaian kini.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: bahkan malaikat-malaikat di surga pun tidak
  rationale: οὐδέ menambahkan unsur negatif dengan penekanan, yang secara idiomatis disampaikan oleh pola 'bahkan ... pun tidak'. Bentuk jamak 'malaikat-malaikat' mempertahankan οἱ ἄγγελοι, sementara 'di surga' merupakan ungkapan Indonesia yang alami bagi τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: demikian juga Sang Anak
  rationale: οὐδέ mengoordinasikan Sang Anak dengan unsur sebelumnya dalam cakupan 'tidak tahu'. 'Demikian juga' menghindari rangkaian penyangkalan yang kaku tetapi tidak melunakkan pernyataannya. 'Sang Anak' mempertahankan fungsi frasa itu sebagai gelar yang dikenal.
- source_word: εἰ μὴ
  choice: selain
  rationale: Sesudah pernyataan negatif, εἰ μή berfungsi sebagai pengecualian, bukan syarat.
- source_word: ὁ πατὴρ μόνος
  choice: Bapa saja
  rationale: μόνος membatasi pengetahuan itu secara eksklusif kepada Bapa. 'Bapa saja' alami dan tegas dalam bahasa Indonesia.
theological_decisions:
- issue: Implikasi kristologis frasa οὐδὲ ὁ υἱός
  choice: Mempertahankan frasa 'demikian juga Sang Anak' dalam teks utama tanpa pelunakan atau penjelasan tambahan.
  alternative: Menghilangkan frasa tersebut berdasarkan varian naskah tertentu, atau memparafrasakannya untuk mengurangi ketegangan teologis.
  rationale: SBLGNT memuat οὐδὲ ὁ υἱός. Terjemahan mempertahankan pernyataan bahwa Sang Anak juga tidak tahu tentang hari dan saat itu, tanpa mencoba menyelesaikan ketegangan kristologis melalui terjemahan. Varian tekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, bermartabat, dan mudah dipahami. Tanda pisah membantu memperlihatkan urutan penegasan dalam kalimat Yunani. Istilah 'Sang Anak' digunakan sebagai gelar yang dikenali dan dibedakan dari sebutan anak biasa.
