  naturalness: Kalimat draf dapat dipahami, tetapi “selain Bapa saja” terasa berlebihan dan “demikian juga Sang Anak” agak kaku dalam rangkaian eliptis setelah “pun tidak”. Susunan revisi lebih lancar dalam bahasa Indonesia baku modern.
  terminology: “Bapa” dan “Sang Anak” tepat sebagai gelar dalam konteks ini. “Para malaikat di surga” merupakan padanan alami untuk οἱ ἄγγελοι τῶν οὐρανῶν.
