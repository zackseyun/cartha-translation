id: MAT.24.22
reference: Matthew 24:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: id
  text: Dan seandainya hari-hari itu tidak dipersingkat[a], tidak seorang manusia pun akan diselamatkan[b]. Namun, demi orang-orang pilihan, hari-hari itu akan dipersingkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “diperpendek.” Kata Yunani ini dapat berarti memendekkan atau mempersingkat lamanya hari-hari tersebut.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tidak ada satu daging pun.” Ungkapan “semua daging” berarti seluruh umat manusia; dalam klausa negatif ini artinya tidak seorang manusia pun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: tidak diperpendek / akan diperpendek
  rationale: κολοβόω menyatakan pemendekan atau pemotongan durasi. Dalam bahasa Indonesia, "hari-hari ... diperpendek" alami dan jelas untuk menunjukkan bahwa lamanya masa itu dikurangi, tanpa menambahkan siapa pelakunya.
- source_word: οὐκ ἂν ἐσώθη
  choice: tidak ... akan diselamatkan
  rationale: Konstruksi ini menyatakan akibat yang tidak terjadi dalam keadaan berlawanan dengan kenyataan. "Diselamatkan" mempertahankan cakupan makna σῴζω, sementara konteks kesengsaraan mengarahkan pembaca pada penyelamatan nyawa.
- source_word: πᾶσα σάρξ
  choice: tidak seorang manusia pun
  rationale: Secara harfiah frasa ini berarti "semua daging", tetapi dalam klausa negatif merupakan idiom bagi tidak satu pun manusia. Padanan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia modern tanpa menyiratkan "tabiat berdosa".
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: Namun, demi orang-orang pilihan
  rationale: διά dengan akusatif menyatakan alasan atau kepentingan. "Demi" menangkap nuansa "untuk kepentingan/karena mempertimbangkan", sedangkan "orang-orang pilihan" mempertahankan sebutan kelompok itu tanpa menentukan identitas teologisnya lebih lanjut.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: hari-hari itu
  rationale: Padanan langsung dan alami yang mempertahankan daya tunjuk ἐκεῖναι.
- source_word: καὶ εἰ μὴ
  choice: Dan sekiranya ... tidak
  rationale: '"Sekiranya" secara alami memperkenalkan kondisi berlawanan dengan kenyataan yang, bersama bentuk akibatnya, merujuk pada keadaan hipotetis masa lampau.'
theological_decisions:
- issue: Identitas οἱ ἐκλεκτοί dalam wacana eskatologis
  choice: orang-orang pilihan
  alternative: umat pilihan Allah; orang-orang percaya; kaum sisa yang setia
  rationale: Ayat ini menyebut kelompok tersebut sebagai "yang dipilih" tanpa menetapkan di sini cakupan identitasnya. Terjemahan tidak menyelesaikan perdebatan apakah yang dimaksud ialah Israel, gereja, atau kelompok sisa tertentu.
- issue: Makna σῴζω dalam konteks
  choice: diselamatkan
  alternative: bertahan hidup; tetap hidup
  rationale: Konteks langsung menunjuk pada terpeliharanya kehidupan di tengah malapetaka, tetapi "diselamatkan" menjaga keluasan leksikal kata Yunani dan tidak mempersempitnya secara mutlak menjadi sekadar bertahan hidup.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. "Tidak seorang manusia pun" menerjemahkan idiom Yunani agar segera dipahami, sementara catatan kaki mempertahankan bentuk harfiahnya. Bentuk pasif dipertahankan untuk tidak menyebut pelaku yang tidak dinyatakan secara eksplisit dalam teks.
