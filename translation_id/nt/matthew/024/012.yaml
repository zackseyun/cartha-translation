  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: id
  text: Dan karena kedurhakaan akan semakin bertambah[a], kasih banyak orang akan menjadi dingin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena bertambahnya kedurhakaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kasih dari banyak orang akan menjadi dingin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: karena ... akan semakin merajalela
  rationale: διά dengan infinitif berartikel menyatakan sebab. Dalam konteks nubuat ini, bentuk aoris pasif πληθυνθῆναι menunjuk pada bertambah atau meluasnya kedurhakaan. Ungkapan 'akan semakin merajalela' menyampaikan peningkatan dan penyebarannya secara alami dalam bahasa Indonesia.
- source_word: ἀνομίαν
  choice: kedurhakaan
  rationale: ἀνομία menunjuk pada sikap atau tindakan yang mengabaikan dan melanggar hukum, khususnya hukum Allah. 'Kedurhakaan' cukup lazim, bermartabat, dan lebih spesifik daripada 'kejahatan'.
- source_word: ψυγήσεται
  choice: akan menjadi dingin
  rationale: Bentuk mendatang ψυγήσεται mempertahankan metafora mendinginnya kasih. 'Akan menjadi dingin' alami dalam bahasa Indonesia dan tidak mengubah metafora menjadi sekadar melemah atau hilang.
- source_word: ἀγάπη
  choice: kasih
  rationale: '''Kasih'' adalah padanan baku dan mudah dipahami bagi ἀγάπη dalam konteks Alkitab, tanpa menentukan secara lebih sempit bentuk atau objek kasih itu.'
- source_word: τῶν πολλῶν
  choice: banyak orang
  rationale: Frasa genitif ini menyatakan bahwa kasih milik banyak orang akan menjadi dingin. 'Banyak orang' mempertahankan cakupan yang luas tetapi tidak pasti dan tidak menafsirkannya sebagai 'kebanyakan orang'.
theological_decisions:
- issue: Cakupan 'kasih banyak orang'
  choice: Tidak menentukan apakah yang dimaksud ialah umat manusia pada umumnya, orang-orang yang mengaku sebagai murid, atau kelompok campuran.
  alternative: Kasih di antara orang percaya akan menjadi dingin; kasih manusia dalam masyarakat akan menjadi dingin.
  rationale: τῶν πολλῶν tidak secara eksplisit mengidentifikasi kelompok tersebut. Terjemahan ini mempertahankan ketidakpastian dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Struktur sebab-akibat dipertahankan, sedangkan metafora 'dingin' dan cakupan tak tentu 'banyak orang' tidak diperjelas secara interpretatif.
