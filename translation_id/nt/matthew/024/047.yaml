  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: id
  text: 'Sesungguhnya Aku berkata kepadamu: ia akan mengangkatnya untuk mengurus seluruh miliknya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia akan mengangkatnya untuk mengurus semua yang dimilikinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Menyampaikan pembukaan pernyataan yang khidmat dan berwibawa secara alami dalam bahasa Indonesia serta mempertahankan corak formula ucapan Yesus.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung yang mempertahankan bentuk formula khidmat dalam bahasa sumber.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi pernyataan dalam bahasa Indonesia; menerjemahkannya dengan 'bahwa' juga mungkin, tetapi kurang luwes setelah formula ini.
- source_word: καταστήσει αὐτόν
  choice: Ia akan mengangkat dia
  rationale: Dalam konteks ini, καθίστημι berarti menempatkan atau mengangkat seseorang ke dalam tanggung jawab tertentu, bukan sekadar memindahkannya secara fisik. Pronomina maskulin tunggal dipertahankan.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: untuk mengurus semua milik-Nya
  rationale: Frasa ini menyatakan lingkup tanggung jawab yang diberikan kepadanya. 'Semua milik-Nya' menerjemahkan benda-benda yang dimiliki sang tuan secara ringkas dan alami; unsur pengawasan dibuat jelas melalui 'untuk mengurus'.
theological_decisions:
- issue: Sifat pengangkatan atau ganjaran dari sang tuan
  choice: Pernyataan diterjemahkan sebagai pengangkatan untuk mengurus seluruh milik sang tuan dalam kerangka perumpamaan.
  alternative: Menafsirkannya secara khusus sebagai kewenangan gerejawi atau sebagai ganjaran surgawi pada akhir zaman.
  rationale: Ayat ini sendiri menggambarkan perluasan tanggung jawab. Terjemahan tidak memasukkan sistem penafsiran eklesiologis atau eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Huruf kapital pada 'Aku', 'Ia', dan '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus dan tokoh tuan yang mewakili-Nya dalam perumpamaan.
