id: MAT.24.19
reference: Matthew 24:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: id
  text: Celakalah mereka yang sedang mengandung dan mereka yang sedang menyusui pada hari-hari itu!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: Celakalah
  rationale: Mempertahankan daya seru profetis yang menyatakan ratapan sekaligus kesusahan berat yang akan menimpa, lebih kuat daripada sekadar 'sayang sekali'.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dari peringatan sebelumnya. Dalam bahasa Indonesia, alur tersebut lebih alami tanpa kata penghubung eksplisit; 'tetapi' dapat memberi kesan pertentangan yang terlalu kuat.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: mereka yang sedang mengandung
  rationale: Ungkapan ἐν γαστρὶ ἔχω merupakan idiom untuk keadaan hamil. 'Sedang mengandung' alami, jelas, dan mempertahankan fokus pada kondisi orang-orang tersebut.
- source_word: ταῖς θηλαζούσαις
  choice: mereka yang sedang menyusui
  rationale: θηλάζω berarti menyusui seorang anak. Dalam bahasa Indonesia, objeknya dapat tetap tersirat secara alami seperti dalam bahasa Yunani tanpa mengurangi kejelasan.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: pada hari-hari itu
  rationale: Padanan temporal yang langsung, alami, dan sesuai dengan ragam bahasa Indonesia modern yang bermartabat.
theological_decisions:
- issue: Rujukan bentuk datif dan partisip feminin
  choice: Diterjemahkan sebagai 'mereka yang sedang mengandung' dan 'mereka yang sedang menyusui'.
  alternative: '''perempuan-perempuan yang sedang mengandung'' dan ''perempuan-perempuan yang sedang menyusui'''
  rationale: Bentuk Yunani secara gramatikal feminin, tetapi bahasa Indonesia dapat menyatakan rujukannya secara wajar tanpa menambahkan nomina 'perempuan' yang tidak dinyatakan tersendiri dalam teks. Kondisi mengandung dan menyusui tetap membuat rujukan itu jelas.
- issue: Nuansa οὐαί
  choice: Celakalah
  alternative: Aduhai
  rationale: '''Celakalah'' mempertahankan ketegangan antara ratapan dan pernyataan tentang kesusahan yang akan datang, tanpa menentukan bahwa ungkapan ini semata-mata kutukan atau semata-mata rasa iba.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas, alami, dan bermartabat. Tanda seru digunakan untuk mencerminkan sifat seruan οὐαί. Tidak diperlukan catatan kaki karena alternatif dengan kata 'perempuan' tidak mengubah makna dan bentuk utama sudah jelas dalam bahasa Indonesia.
