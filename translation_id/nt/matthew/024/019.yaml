  source_fidelity: Teks Indonesia dengan setia menerjemahkan οὐαί sebagai seruan ratapan/kesusahan, mempertahankan dua kelompok yang ditandai partisip feminin—yang mengandung dan yang menyusui—serta keterangan waktu ἐν ἐκείναις ταῖς ἡμέραις. Tidak ada penambahan makna teologis atau penyempitan rujukan yang tidak didukung sumber.
