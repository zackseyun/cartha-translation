  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: id
  text: Namun, semua ini adalah permulaan sakit bersalin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sakit melahirkan” atau “nyeri persalinan.” Kata Yunani ini menggambarkan rasa sakit saat melahirkan sebagai kiasan bagi tahap awal kesusahan yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ... ταῦτα
  choice: semua hal ini
  rationale: Frasa ini secara alami merujuk kembali kepada seluruh peristiwa yang baru saja disebutkan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari daftar peristiwa sebelumnya kepada penilaian Yesus tentang maknanya.
- source_word: ἀρχὴ
  choice: barulah permulaan
  rationale: Kata 'permulaan' menyatakan tahap awal; 'barulah' secara wajar menegaskan bahwa peristiwa-peristiwa itu belum merupakan kesudahannya, sesuai konteks dekat, tanpa menambahkan skema khusus.
- source_word: ὠδίνων
  choice: rasa sakit bersalin
  rationale: Mempertahankan gambaran konkret tentang sakit saat melahirkan dalam bahasa Indonesia modern dan wajar.
theological_decisions:
- issue: Daya metaforis ὠδίνων
  choice: Mempertahankan metafora persalinan sebagai 'rasa sakit bersalin'.
  alternative: penderitaan; kesusahan; sakit melahirkan
  rationale: Teks menggambarkan pergolakan sebelumnya sebagai tahap awal dari proses yang lebih besar. Metafora persalinan dipertahankan tanpa menentukan secara lebih rinci hasil atau urutan eskatologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rasa sakit bersalin' dipilih karena mudah dipahami sekaligus mempertahankan metafora sumber; 'barulah' memberi penekanan kontekstual bahwa ini masih tahap awal.
