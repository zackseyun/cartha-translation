  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: id
  text: Karena itu, hendaklah kamu juga siap, sebab Anak Manusia datang pada saat yang tidak kamu duga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada saat yang tidak kamu sangka.” Kata kerja Yunani yang dipakai dapat berarti “berpikir” atau “menyangka” dan, sesuai konteks ini, dapat menyiratkan “menduga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Frasa ini menunjuk kembali kepada peringatan sebelumnya dan menyatakan kesimpulan beralasan. “Karena itu” alami dalam bahasa Indonesia serta mempertahankan kaitan tersebut.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: καί bersama pronomina eksplisit memberi penekanan dan mencakup para pendengar. “Kamu juga” mempertahankan nuansa itu tanpa berlebihan.
- source_word: γίνεσθε ἕτοιμοι
  choice: hendaklah kamu ... siap
  rationale: Bentuk imperatif kini ini menyerukan keadaan atau sikap siap yang berkelanjutan. “Hendaklah ... siap” menyampaikan daya perintah dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ὅτι
  choice: sebab
  rationale: Di sini ὅτι memperkenalkan alasan bagi perintah, sehingga “sebab” menyampaikan fungsi kausalnya dengan jelas.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: pada saat yang tidak kamu duga
  rationale: Ungkapan datif relatif ini bersifat temporal. Dalam konteks peringatan tentang waktu yang tidak diketahui, “duga” secara alami menyampaikan δοκεῖτε, sambil mencatat arti harfiahnya yang lebih luas dalam catatan kaki.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan gelar yang harfiah dan mapan ini mempertahankan latar Semitik, kemungkinan gema Daniel, dan bobot kristologisnya tanpa parafrasa.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini Yunani dapat menunjuk pada peristiwa mendatang dengan daya yang hidup. Bahasa Indonesia dapat memakai “datang” tanpa penanda kala, sehingga nuansa kini-futuristik tidak perlu dipersempit menjadi “akan datang”.
theological_decisions:
- issue: Penerjemahan gelar kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk gelar, gema Daniel, dan pemakaiannya yang telah mapan dalam Injil. Alternatifnya lebih interpretatif dan dapat mengaburkan latar Semitik gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. “Kamu” dipakai sesuai sapaan jamak dalam konteks, sedangkan struktur “hendaklah ... siap” mempertahankan daya perintah tanpa terdengar kaku. Catatan kaki ditempatkan pada padanan δοκεῖτε yang dijelaskannya.
