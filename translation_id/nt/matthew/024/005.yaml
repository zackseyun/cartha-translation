  terminology: “Mesias” tepat untuk ὁ χριστός dalam klaim identitas ini dan lebih transparan sebagai gelar daripada “Kristus,” yang dalam penggunaan Indonesia sering terdengar sebagai bagian dari nama Yesus. Kapitalisasi nama-Ku konsisten dengan register Alkitab Indonesia. Tidak diperlukan catatan kaki; tidak ada ambiguitas tekstual atau istilah yang perlu diberi jangkar dalam terjemahan ini.
