  source_fidelity: 'Terjemahan mencerminkan seluruh unsur teks Yunani: γάρ sebagai “Sebab,” πολλοί sebagai “banyak orang,” futurum ἐλεύσονται dan πλανήσουσιν sebagai “akan datang” dan “akan menyesatkan,” serta objek πολλούς sebagai “banyak orang.” Frasa ἐπὶ τῷ ὀνόματί μου diterjemahkan secara idiomatis “dengan memakai nama-Ku,” yang sesuai konteks para pengklaim identitas mesianik tanpa membatasi maknanya menjadi sekadar perutusan resmi. “Akulah Mesias” dengan tepat menyampaikan penekanan ἐγώ dan gelar ὁ χριστός.'
