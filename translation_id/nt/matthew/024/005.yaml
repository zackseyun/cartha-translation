id: MAT.24.5
reference: Matthew 24:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: id
  text: Sebab banyak orang akan datang dengan memakai nama-Ku dan berkata, “Akulah Mesias,” lalu mereka akan menyesatkan banyak orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Subjek jamak substantival ini paling alami dan jelas dalam bahasa Indonesia sebagai “banyak orang”.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan peringatan pada ayat sebelumnya.
- source_word: ἐλεύσονται
  choice: akan datang
  rationale: Padanan langsung dan idiomatis bagi bentuk futurum ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dengan memakai nama-Ku
  rationale: Dalam konteks para penuntut identitas mesianik, frasa ini menyatakan bahwa mereka datang dengan menggunakan atau mengatasnamakan nama Yesus; pilihan ini lebih jelas dalam bahasa Indonesia daripada “dalam nama-Ku” tanpa menutup nuansa klaim identitas.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Mengungkapkan partisipel yang memperkenalkan isi pernyataan mereka secara alami tanpa menambahkan penilaian seperti “mengaku”.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Akulah Mesias
  rationale: Bentuk “Akulah” menangkap penekanan ἐγώ, sedangkan “Mesias” menyampaikan χριστός sebagai gelar, bukan nama diri.
- source_word: πλανήσουσιν
  choice: akan menyesatkan
  rationale: Mencakup gagasan menyebabkan orang menyimpang dan tertipu, serta merupakan ungkapan Indonesia yang wajar.
- source_word: πολλοὺς
  choice: banyak orang
  rationale: Objek substantival ini perlu dinyatakan dengan “orang” agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan ὁ χριστός dalam klaim mesianik palsu
  choice: Mesias
  alternative: Kristus
  rationale: Dalam kalimat ini χριστός jelas berfungsi sebagai gelar yang diklaim para pendatang. “Mesias” menyampaikan fungsi gelar itu secara transparan, sedangkan “Kristus” dalam pemakaian Indonesia lebih mudah terdengar seperti bagian dari nama Yesus.
- issue: Makna ἐπὶ τῷ ὀνόματί μου
  choice: dengan memakai nama-Ku
  alternative: dalam nama-Ku; atas nama-Ku
  rationale: Konteks langsung menunjukkan penggunaan nama atau identitas Yesus untuk mendukung klaim “Akulah Mesias.” Terjemahan ini mempertahankan kaitan itu tanpa menentukan secara sempit bahwa mereka hanya bertindak sebagai utusan resmi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi “-Ku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Tanda kutip digunakan untuk ucapan langsung.
