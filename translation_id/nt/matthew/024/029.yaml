id: MAT.24.29
reference: Matthew 24:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: id
  text: Namun, segera sesudah kesusahan pada hari-hari itu, matahari akan menjadi gelap, bulan tidak akan memancarkan cahayanya, bintang-bintang akan jatuh dari langit[a], dan kuasa-kuasa di langit akan diguncangkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surga” untuk “langit”.
    reason: lexical_alternative
  - marker: b
    text: “Kuasa-kuasa di langit” dapat merujuk pada kekuatan kosmis, benda-benda langit, atau kuasa-kuasa surgawi; ungkapan Yunani ini dibiarkan tetap luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Namun, segera
  rationale: “Segera” mempertahankan daya temporal yang kuat dari Εὐθέως, sedangkan “namun” menandai peralihan dengan sedikit nuansa kontras dari δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: sesudah kesusahan pada hari-hari itu
  rationale: “Kesusahan” menyampaikan tekanan dan penderitaan dalam θλῖψις tanpa bergantung pada istilah teknis denominasi tertentu. Susunan ini wajar dalam bahasa Indonesia sekaligus tetap mengaitkan kesusahan itu dengan hari-hari tersebut.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: matahari akan menjadi gelap
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna pasif/intransitif dari nubuat tersebut tanpa menentukan penyebabnya.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: bulan tidak akan memancarkan cahayanya
  rationale: “Memancarkan cahayanya” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran bulan yang tidak memberikan terang.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: bintang-bintang akan jatuh dari langit
  rationale: Terjemahan langsung ini mempertahankan citra apokaliptik. οὐρανός dapat berarti langit atau surga, tetapi “langit” paling alami untuk tempat bintang-bintang tampak berada; alternatif dicatat dalam catatan kaki.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: kuasa-kuasa di langit
  rationale: “Kuasa-kuasa” mempertahankan keluasan makna δυνάμεις, sedangkan “di langit” menghasilkan frasa Indonesia yang dapat dipahami tanpa menetapkan apakah yang dimaksud ialah kekuatan kosmis, benda langit, atau kuasa surgawi.
- source_word: σαλευθήσονται
  choice: akan diguncangkan
  rationale: Mempertahankan bentuk pasif futur dan nada nubuat yang kuat dari kata Yunani tersebut.
theological_decisions:
- issue: Sifat tanda-tanda kosmis dalam wacana apokaliptik
  choice: Mempertahankan gambaran kosmis secara langsung tanpa menentukan apakah penggenapannya harfiah, simbolis, atau mencakup keduanya.
  alternative: Menafsirkannya secara khusus sebagai keruntuhan astronomis harfiah atau sebagai lambang pergolakan politik dan penghakiman.
  rationale: Bahasa sumber memakai citra kenabian-apokaliptik dan tidak menjelaskan cara penggenapannya. Terjemahan karena itu harus mempertahankan ketegangan tersebut.
- issue: Rujukan “kuasa-kuasa di langit”
  choice: Membiarkan rujukannya tetap luas dan menjelaskannya dalam catatan kaki.
  alternative: Menentukannya secara eksklusif sebagai malaikat, benda langit, atau kekuatan kosmis.
  rationale: Frasa Yunani αἱ δυνάμεις τῶν οὐρανῶν sendiri tidak memaksa hanya satu dari rujukan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan bernuansa nubuat. Istilah dibuat mudah dipahami pembaca umum, sementara citra kosmis dan ambiguitas sumber dipertahankan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan oleh masing-masing catatan.
