  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: id
  text: Pada waktu itu, mereka akan menyerahkan kalian kepada kesengsaraan[a] dan membunuh kalian, dan kalian akan dibenci oleh semua bangsa[b] karena nama-Ku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkan kalian untuk mengalami penderitaan” atau “menyerahkan kalian untuk dianiaya.” Kata Yunani ini dapat berarti tekanan, penderitaan, penindasan, atau kesengsaraan.
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh semua orang bukan Yahudi,” meskipun dalam konteks ini “oleh semua bangsa” lebih mungkin.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “karena nama-Ku.” Ungkapan ini menunjuk pada kesetiaan kepada Yesus dan pada apa yang diwakili oleh nama-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dalam wacana Yesus dengan ungkapan Indonesia yang alami dan tetap jelas.
- source_word: παραδώσουσιν ὑμᾶς
  choice: orang akan menyerahkan kalian
  rationale: Bentuk orang ketiga jamak tanpa subjek eksplisit diterjemahkan secara alami dengan 'orang'; 'menyerahkan' mempertahankan arti diserahkan ke dalam kuasa pihak lain, sedangkan 'kalian' menyatakan jamak.
- source_word: εἰς θλῖψιν
  choice: untuk ditindas
  rationale: Dalam konstruksi ini, θλῖψις menunjuk pada tekanan, penderitaan, atau penindasan yang dikenakan kepada para murid. Bentuk verbal pasif menghasilkan bahasa Indonesia yang alami tanpa menghilangkan nuansa permusuhan.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: dan dibunuh
  rationale: Menyampaikan arti langsung 'membunuh' dan secara alami berbagi subjek pasien 'kalian' dari klausa sebelumnya.
- source_word: ἔσεσθε μισούμενοι
  choice: Kalian akan dibenci
  rationale: Mencerminkan konstruksi futur perifrastik pasif secara lugas.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: oleh semua bangsa
  rationale: ἔθνη di sini paling wajar menunjuk pada bangsa-bangsa secara luas, bukan secara khusus orang bukan Yahudi.
- source_word: διὰ τὸ ὄνομά μου
  choice: karena nama-Ku
  rationale: Mempertahankan ungkapan sumber tentang 'nama' dan hubungan kausalnya tanpa memparafrasakan maknanya ke dalam teks utama.
theological_decisions:
- issue: Nuansa θλῖψις dalam wacana eskatologis
  choice: ditindas
  alternative: mengalami kesengsaraan; dianiaya
  rationale: Pilihan ini mempertahankan gagasan tekanan atau penindasan nyata dalam konteks penyerahan dan pembunuhan, tetapi catatan kaki menjaga rentang makna yang juga dapat mencakup kesengsaraan dan penganiayaan tanpa menjadikannya istilah teknis suatu sistem akhir zaman.
- issue: Cakupan ἔθνη
  choice: semua bangsa
  alternative: semua orang bukan Yahudi
  rationale: Konteks lebih mendukung cakupan permusuhan yang luas daripada kontras etnis Yahudi–bukan Yahudi; kemungkinan leksikal lainnya tetap dicatat.
- issue: Makna 'karena nama-Ku'
  choice: mempertahankan ungkapan nama-Ku
  alternative: karena menjadi pengikut-Ku
  rationale: Ungkapan sumber dibiarkan utuh agar bobot representatif 'nama' dan kaitannya dengan kesetiaan kepada Yesus tidak dipersempit menjadi satu parafrasa.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Susunan dipecah menjadi dua kalimat agar alami dalam bahasa Indonesia, tanpa mengubah hubungan gagasannya.
