id: MAT.24.42
reference: Matthew 24:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: id
  text: Karena itu, berjaga-jagalah, sebab kamu tidak tahu pada hari apa Tuhanmu datang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "akan datang". Bahasa Yunani memakai bentuk kala kini.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: berjaga-jagalah
  rationale: Bentuk imperatif kini jamak menyerukan kewaspadaan yang terus-menerus. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran dasar tentang tetap terjaga.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pengajaran sebelumnya.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah; bentuk ini ringkas, jelas, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: οὐκ οἴδατε
  choice: kamu tidak tahu
  rationale: Menerjemahkan secara langsung verba pengetahuan yang dinegasikan tanpa menambahkan unsur kepastian yang tidak dinyatakan dalam teks Yunani.
- source_word: ποίᾳ ἡμέρᾳ
  choice: pada hari apa
  rationale: Menyampaikan datif waktu secara alami dan mempertahankan ketidakpastian mengenai hari tertentu.
- source_word: ὁ κύριος ὑμῶν
  choice: Tuhanmu
  rationale: Mengungkapkan artikel dan pronomina posesif secara idiomatis, sambil mempertahankan κύριος sebagai gelar yang menyatakan otoritas.
- source_word: ἔρχεται
  choice: datang
  rationale: Bahasa Indonesia tidak wajib menandai kala seperti bahasa Yunani; bentuk ini alami dan tetap dapat menyatakan kedatangan yang sedang dinantikan atau bersifat futuristik sesuai konteks.
theological_decisions:
- issue: Daya eskatologis bentuk kini ἔρχεται
  choice: datang
  alternative: akan datang
  rationale: Bentuk tanpa penanda kala eksplisit paling baik mempertahankan keluwesan bentuk kini Yunani dalam bahasa Indonesia, tanpa menetapkan waktu kedatangan secara lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, bermartabat, dan mudah dipahami. Bentuk jamak "kamu" mengikuti sapaan kepada para murid; reduplikasi "berjaga-jagalah" menyampaikan perintah berkelanjutan secara idiomatis.
source_grounding:
  english_pob_role: consult_only
