id: MAT.24.24
reference: Matthew 24:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: id
  text: Sebab mesias-mesias palsu[a] dan nabi-nabi palsu akan muncul. Mereka akan mengadakan tanda-tanda besar dan keajaiban untuk menyesatkan[b], jika mungkin[c], bahkan orang-orang pilihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus-Kristus palsu.” Kata Yunani memakai gelar Christos; di sini diterjemahkan “mesias” karena berfungsi sebagai gelar, bukan seperti nama diri.
    reason: alternative_reading
  - marker: b
    text: Atau, “menipu.” Kata kerja ini dapat berarti menyebabkan seseorang menyimpang atau tersesat.
    reason: lexical_alternative
  - marker: c
    text: Atau, “sekiranya mungkin.” Teks Yunani hanya mengatakan “jika mungkin” dan tidak menyatakan lebih lanjut implikasi teologisnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: akan muncul
  rationale: Dalam konteks ini bentuk pasif futur dari ἐγείρω bersifat idiomatis bagi orang-orang yang tampil atau muncul, bukan dibangkitkan dari kematian.
- source_word: ψευδόχριστοι
  choice: mesias-mesias palsu
  rationale: Χριστός di sini berfungsi sebagai gelar, sehingga 'mesias' mempertahankan latar dan makna titularnya; bentuk ulang menyatakan jamak secara jelas dan alami.
- source_word: ψευδοπροφῆται
  choice: nabi-nabi palsu
  rationale: Padanan langsung dan lazim untuk nomina majemuk Yunani tersebut.
- source_word: δώσουσιν
  choice: akan mengadakan
  rationale: Walaupun arti dasarnya 'memberikan', bersama 'tanda-tanda dan keajaiban' verba ini menunjuk pada tindakan menghasilkan atau melakukan pertunjukan tersebut; 'mengadakan' alami dalam bahasa Indonesia.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: tanda-tanda besar dan berbagai keajaiban
  rationale: '''Tanda-tanda'' mempertahankan daya isyarat atau pembuktian σημεῖα, sedangkan ''keajaiban'' menyampaikan sifat menakjubkan τέρατα. Kata ''berbagai'' menolong bentuk jamak terdengar alami tanpa mengubah jenis peristiwa.'
- source_word: ὥστε πλανῆσαι
  choice: untuk menyesatkan
  rationale: Ungkapan ini mempertahankan keterarahan konstruksi ὥστε dengan infinitif tanpa memutuskan secara kaku apakah nuansanya semata-mata tujuan atau hasil.
- source_word: εἰ δυνατὸν
  choice: jika mungkin
  rationale: Padanan langsung bagi frasa ringkas Yunani dan tidak menambahkan nuansa kontrafaktual yang tidak dinyatakan secara eksplisit.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: bahkan orang-orang pilihan
  rationale: καί bersifat askensif, maka diterjemahkan 'bahkan'; 'orang-orang pilihan' adalah padanan Indonesia yang jelas dan alami untuk ἐκλεκτούς.
theological_decisions:
- issue: Makna ψευδόχριστοι sebagai gelar
  choice: mesias-mesias palsu
  alternative: Kristus-Kristus palsu
  rationale: Dalam konteks ini Χριστός adalah gelar bagi tokoh yang mengaku sebagai yang diurapi atau Mesias, bukan pemakaian yang menyerupai nama diri.
- issue: Daya kondisional εἰ δυνατὸν sehubungan dengan orang-orang pilihan
  choice: jika mungkin
  alternative: sekiranya mungkin
  rationale: Terjemahan mempertahankan syarat yang diungkapkan teks dan tidak menentukan apakah keadaan itu sebenarnya mustahil, sehingga ketegangan teologis tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan dipecah menjadi dua kalimat agar alurnya wajar, sementara hubungan sebab, tindakan, tujuan/hasil, syarat, dan penekanan pada orang-orang pilihan tetap dipertahankan.
