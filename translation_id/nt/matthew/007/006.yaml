  terminology: “Yang kudus,” “anjing-anjing,” “mutiaramu,” “babi-babi,” dan “mencabik-cabik” mempertahankan citra, ketajaman, serta tingkat kekerasan bahasa Yunani. “Yang kudus” menjaga keluasan substantiva τὸ ἅγιον tanpa menentukan referennya.
