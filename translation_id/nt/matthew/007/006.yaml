id: MAT.7.6
reference: Matthew 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: id
  text: Jangan memberikan yang kudus kepada anjing-anjing, dan jangan melemparkan mutiaramu di hadapan babi-babi, agar mereka tidak menginjak-injaknya dengan kaki mereka, lalu berbalik dan mencabik-cabik kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: apa yang kudus
  rationale: Adjektiva netral tunggal yang dipakai secara substantival ini dibiarkan luas cakupannya dan tidak dipersempit menjadi ajaran, benda persembahan, atau hal tertentu.
- source_word: τοῖς κυσίν
  choice: kepada anjing
  rationale: Padanan langsung yang mempertahankan kekuatan dan ketajaman metafora asli.
- source_word: βάλητε
  choice: lemparkan
  rationale: Padanan modern dan alami untuk tindakan melempar, sekaligus sesuai dengan bentuk larangan.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: mutiaramu
  rationale: Mempertahankan nomina jamak sebagai nomina kolektif alami dalam bahasa Indonesia serta pronomina orang kedua jamak yang secara bentuk tidak dibedakan dalam bahasa Indonesia.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: ke hadapan babi
  rationale: Ungkapan ini mempertahankan citra spasial teks sumber; 'babi' merupakan padanan modern yang wajar.
- source_word: μήποτε
  choice: supaya jangan
  rationale: Menyampaikan peringatan akan akibat yang hendak dihindari tanpa memaksakan pembedaan tegas antara tujuan dan hasil.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: diinjak-injaknya mutiara itu
  rationale: Bentuk pasif idiomatis mengungkapkan tindakan menginjak berulang atau keras; penyebutan 'mutiara itu' memperjelas acuan αὐτούς yang berjenis maskulin dan merujuk kepada mutiara.
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: lalu babi-babi itu berbalik dan mencabik-cabik kamu
  rationale: Mempertahankan urutan tindakan partisip aoris dan kekerasan verba ῥήγνυμι. Subjek diulang agar pergantian dari akhiran -nya ke pelaku jamak tetap jelas.
theological_decisions:
- issue: Acuan metafora 'apa yang kudus', 'anjing', 'mutiara', dan 'babi'
  choice: Semua metafora dipertahankan tanpa penjelasan interpretatif di dalam teks.
  alternative: Menafsirkannya secara eksplisit sebagai ajaran suci atau berita Kerajaan dan sebagai orang-orang fasik atau yang memusuhi Injil.
  rationale: Ayat ini tidak menjabarkan padanan setiap unsur metafora. Mempertahankan citranya menghindari penyempitan makna dan menjaga ambiguitas serta ketegangan teologis teks.
- issue: Hubungan μήποτε dengan rangkaian akibat
  choice: Diterjemahkan 'supaya jangan' untuk memperkenalkan seluruh peringatan.
  alternative: Menggunakan 'kalau tidak' atau 'agar mereka tidak'.
  rationale: Pilihan ini dapat mencakup nuansa tujuan maupun akibat yang dikhawatirkan, sebagaimana dimungkinkan oleh konstruksi Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kamu' secara alami dapat menunjuk tunggal ataupun jamak, sedangkan konteks Yunani memakai orang kedua jamak. Metafora keras dipertahankan tanpa pelunakan atau perluasan denominatif.
