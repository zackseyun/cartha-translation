  rationale: Revisi memulihkan keterangan eksplisit “dengan kaki mereka,” mengganti konstruksi akibat yang kurang idiomatis dengan bentuk aktif yang jelas, dan mempertahankan metafora tanpa perluasan penafsiran. Kata “mereka” secara wajar mengacu kepada babi-babi sebagai anteseden terdekat, sebagaimana dalam konstruksi Yunani.
