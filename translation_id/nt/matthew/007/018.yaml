  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: id
  text: Pohon yang baik[a] tidak dapat menghasilkan buah yang buruk[b], dan pohon yang busuk[c] tidak dapat menghasilkan buah yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon yang sehat” untuk “pohon yang baik”.
    reason: lexical_alternative
  - marker: b
    text: Atau “buah yang jahat” untuk “buah yang buruk”.
    reason: lexical_alternative
  - marker: c
    text: Atau “pohon yang lapuk” untuk “pohon yang busuk”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: pohon yang baik
  rationale: ἀγαθός pada dasarnya berarti ‘baik’. Pilihan ini mempertahankan gambaran harfiah sekaligus daya penilaian moralnya tanpa mempersempit makna menjadi kesehatan pohon.
- source_word: οὐ δύναται ... ποιεῖν
  choice: tidak dapat menghasilkan
  rationale: δύναται menyatakan kemampuan atau kesanggupan, sedangkan ποιεῖν dengan καρπούς secara idiomatis berarti menghasilkan buah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan ketidakmungkinan yang tegas.
- source_word: καρποὺς πονηρούς
  choice: buah yang buruk
  rationale: πονηρός dapat berarti buruk, jahat, atau rusak. Dalam metafora buah, ‘buruk’ alami dan cukup luas, serta tetap membuka dimensi mutu dan moral.
- source_word: οὐδέ
  choice: dan ... tidak
  rationale: οὐδέ menghubungkan klausa kedua sebagai negasi sejajar. Bentuk ‘dan ... tidak’ terdengar alami dalam bahasa Indonesia sambil mempertahankan kesejajaran kedua pernyataan.
- source_word: δένδρον σαπρόν
  choice: pohon yang busuk
  rationale: σαπρός menunjuk pada sesuatu yang busuk, lapuk, atau rusak. ‘Busuk’ mempertahankan citra yang kuat dan kontras langsung dengan pohon yang baik.
- source_word: καρποὺς καλούς
  choice: buah yang baik
  rationale: καλός di sini menggambarkan buah yang bermutu baik. ‘Buah yang baik’ alami dan mempertahankan kontras serta paralelisme ayat.
theological_decisions:
- issue: Sifat ketidakmungkinan dalam metafora
  choice: 'Pernyataan diterjemahkan sebagai ketidakmampuan kategoris: ‘tidak dapat’.'
  alternative: ‘biasanya tidak menghasilkan’ atau ‘seharusnya tidak menghasilkan’
  rationale: δύναται yang dinegasikan menyatakan ketidakmampuan, bukan sekadar ketidaklaziman atau larangan. Terjemahan mempertahankan ketegasan perkataan Yesus tanpa menarik kesimpulan doktrinal tambahan dari metafora tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur dua klausa yang sejajar dipertahankan; kosakata konkret menjaga daya metafora asli.
