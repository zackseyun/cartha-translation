  text: Atau jika anaknya meminta ikan—masakan ia akan memberinya ular?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Atau jika
  rationale: Memperkenalkan contoh kedua dalam rangkaian pertanyaan retoris; bentuk ini alami dalam bahasa Indonesia tanpa menerjemahkan καί secara berlebihan.
- source_word: ἰχθὺν
  choice: ikan
  rationale: Makna biasa kata benda ini sesuai dengan konteks makanan dalam keluarga.
- source_word: αἰτήσει
  choice: meminta
  rationale: Walaupun bentuk Yunaninya adalah futurum indikatif, bahasa Indonesia secara alami memakai bentuk tak bertanda waktu dalam contoh bersyarat yang bersifat umum.
- source_word: μὴ
  choice: apakah ... akan ...?
  rationale: Dalam pertanyaan langsung, μή mengisyaratkan jawaban negatif; susunan pertanyaan bahasa Indonesia ini mempertahankan daya retoris tersebut.
- source_word: ὄφιν
  choice: ular
  rationale: Padanan umum dan alami dalam bahasa Indonesia; kata ini mencakup makna Yunani tanpa menambahkan nuansa khusus.
- source_word: ἐπιδώσει
  choice: memberinya
  rationale: Dalam konteks ini berarti memberikan atau menyerahkan sesuatu kepada seseorang; 'memberinya' paling jelas dan alami.
- source_word: αὐτῷ
  choice: -nya dalam 'memberinya'
  rationale: Pronomina datif ini dinyatakan secara alami sebagai akhiran objek tak langsung dalam bahasa Indonesia.
theological_decisions:
- issue: Daya pertanyaan retoris
  choice: 'Pertahankan sebagai pertanyaan yang mengharapkan jawaban negatif: ''apakah ia akan memberinya ular?'''
  alternative: 'Nyatakan sebagai pernyataan tegas: ''ia tidak akan memberinya ular'''
  rationale: μή pada pertanyaan langsung mengarahkan pendengar kepada jawaban negatif. Bentuk pertanyaan mempertahankan daya argumen Yesus tanpa meratakannya menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata 'anaknya' disertakan untuk membuat rujukan subjek tersirat dari konteks ayat sebelumnya tetap alami dalam bahasa Indonesia; tanda pisah mempertahankan jeda retoris teks sumber.
