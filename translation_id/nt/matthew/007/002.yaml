id: MAT.7.2
reference: Matthew 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: id
  text: Sebab dengan penghakiman yang kamu gunakan untuk menghakimi, kamu akan dihakimi; dan dengan ukuran yang kamu gunakan untuk mengukur, akan diukurkan kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan diukurkan kembali kepadamu.” Kata “kembali” tidak dinyatakan secara eksplisit dalam bahasa Yunani, meskipun makna timbal baliknya tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: penghakiman / menghakimi / dihakimi
  rationale: Rangkaian kata serumpun ini mempertahankan pengulangan dan hubungan timbal balik dalam bahasa Yunani tanpa mempersempit maknanya menjadi penghukuman.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: ukuran / mengukur / diukurkan
  rationale: Pilihan ini mempertahankan permainan kata dan kesejajaran pepatah dalam teks sumber, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: dengan ... yang kamu pakai untuk
  rationale: Ungkapan ini menyatakan sarana atau patokan. Susunan tersebut menyampaikan maknanya secara alami sambil mempertahankan kesejajaran kedua klausa.
- source_word: μετρηθήσεται ὑμῖν
  choice: akan diukurkan kepadamu
  rationale: Bentuk pasif dan datif diterjemahkan tanpa menambahkan kata 'kembali', yang tersirat oleh hubungan timbal balik tetapi tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini mempertahankan hubungan penjelas dengan larangan pada ayat sebelumnya.
theological_decisions:
- issue: Pelaku penghakiman timbal balik
  choice: Bentuk pasif dipertahankan tanpa menyebut siapa yang menghakimi atau mengukurkan.
  alternative: Allah akan menghakimi kamu dengan patokan yang sama; atau orang lain akan memperlakukan kamu dengan patokan yang sama.
  rationale: Teks Yunani tidak menyebut pelakunya. Terjemahan tidak membatasi makna hanya pada penghakiman ilahi atau hanya pada timbal balik antarmanusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan kata serumpun sengaja dipertahankan untuk mencerminkan struktur retoris teks Yunani.
