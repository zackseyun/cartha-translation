base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: id
  text: Setiap pohon yang tidak menghasilkan buah yang baik ditebang dan dilemparkan ke dalam api.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tidak berbuah baik.”
    reason: lexical_alternative
  - marker: b
    text: “Api” merupakan gambaran penghukuman; ayat ini sendiri tidak menjelaskan lebih khusus apakah yang ditekankan ialah penghukuman dalam sejarah, penghukuman pada akhir zaman, atau keduanya.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Setiap pohon
  rationale: πᾶν dengan nomina tunggal bersifat distributif, sehingga menunjuk kepada tiap-tiap pohon dan mempertahankan daya ungkapan peribahasanya.
- source_word: μὴ ποιοῦν
  choice: yang tidak menghasilkan
  rationale: Partisipel kini ποιοῦν menggambarkan tindakan atau ciri yang berlangsung. 'Menghasilkan' cukup dekat dengan ποιέω sekaligus wajar dalam bahasa Indonesia; 'berbuah' merupakan alternatif idiomatis.
- source_word: καρπὸν καλὸν
  choice: buah yang baik
  rationale: καλός di sini menyatakan buah yang baik, sehat, atau patut, dengan nuansa penilaian yang sesuai konteks.
- source_word: ἐκκόπτεται
  choice: ditebang
  rationale: Bentuk pasif kini menyatakan apa yang dilakukan terhadap pohon semacam itu. Untuk sebuah pohon utuh, 'ditebang' adalah padanan Indonesia yang paling alami.
- source_word: εἰς πῦρ βάλλεται
  choice: dilemparkan ke dalam api
  rationale: βάλλεται berbentuk pasif, sedangkan εἰς menyatakan gerak masuk. Bahasa Indonesia tidak memerlukan kata sandang, sehingga 'api' mempertahankan citra penghukuman tanpa mempersempit rujukannya.
theological_decisions:
- issue: Citra penghukuman melalui api
  choice: Mempertahankan gambaran pohon yang ditebang dan dilemparkan ke dalam api tanpa menentukan secara lebih khusus apa yang dirujuk oleh api.
  alternative: Penghukuman dalam sejarah, penghukuman eskatologis, atau neraka.
  rationale: Ayat ini jelas menyampaikan peringatan tentang penghukuman melalui gambaran pertanian, tetapi tidak dengan sendirinya menetapkan waktu atau cakupannya secara tepat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas, lugas, dan bermartabat. Susunan pasif paralel 'ditebang dan dilemparkan' mempertahankan struktur serta ketegasan teks Yunani.
