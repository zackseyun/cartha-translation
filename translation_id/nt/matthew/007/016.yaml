source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: id
  text: Dari buah merekalah kamu akan mengenali mereka.[a] Apakah orang memetik buah anggur dari semak duri, atau buah ara dari rumput berduri?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari buah merekalah kamu akan mengenal mereka.”
    reason: lexical_alternative
  - marker: b
    text: 'Pertanyaan ini mengharapkan jawaban “tidak”: orang tidak memetik buah anggur dari semak duri ataupun buah ara dari rumput berduri.'
    reason: rhetorical_force
lexical_decisions:
- source_word: καρπῶν
  choice: buah
  rationale: Bentuk Yunani jamak, tetapi bahasa Indonesia secara idiomatis dapat memakai nomina kolektif "buah". Istilah konkret dipertahankan agar metafora hasil atau perbuatan yang terlihat tidak dipersempit.
- source_word: ἐπιγνώσεσθε
  choice: akan mengenali
  rationale: Bentuk futur ini menyatakan bahwa mereka akan dikenali berdasarkan pengamatan. "Mengenali" lebih tepat dalam konteks membedakan nabi palsu daripada sekadar "mengetahui", tanpa melebihkan menjadi "mengenal sepenuhnya".
- source_word: μήτι
  choice: Apakah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif; bentuk "Apakah orang ...?" menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: συλλέγουσιν
  choice: memetik
  rationale: Dalam konteks hasil tanaman, "memetik" merupakan padanan Indonesia yang alami, meskipun verba Yunani juga dapat berarti mengumpulkan.
- source_word: ἀκανθῶν
  choice: semak duri
  rationale: Kata ini dapat menunjuk duri atau tumbuhan berduri. "Semak duri" membuat sumber tanaman dalam gambaran pertanian ini jelas dan alami.
- source_word: σταφυλάς
  choice: buah anggur
  rationale: Padanan langsung dan lazim untuk objek jamak tersebut; bahasa Indonesia biasanya memakai bentuk kolektif "buah anggur".
- source_word: τριβόλων
  choice: rumput berduri
  rationale: Istilah Yunani menunjuk sejenis gulma atau tumbuhan berduri. Padanan umum ini menjaga perbedaannya dari ἀκανθῶν tanpa mengklaim spesies botani tertentu.
- source_word: σῦκα
  choice: buah ara
  rationale: Padanan baku dalam bahasa Indonesia untuk buah yang dimaksud.
- source_word: αὐτῶν / αὐτούς
  choice: mereka / mereka
  rationale: Kedua pronomina merujuk kepada orang-orang yang sedang dibicarakan, yakni nabi-nabi palsu dalam konteks dekat.
theological_decisions:
- issue: Daya metaforis "buah" sebagai dasar untuk mengenali orang
  choice: Mempertahankan metafora "buah"
  alternative: Menerjemahkannya secara interpretatif sebagai "perbuatan" atau "hasil yang mereka timbulkan"
  rationale: Metafora pertanian merupakan bagian pokok perkataan Yesus dan membiarkan cakupan acuannya tetap terbuka, sehingga terjemahan tidak membatasinya hanya pada perbuatan atau hanya pada hasil pelayanan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan awal "Dari buah merekalah" mempertahankan penekanan Yunani pada dasar pengenalan. Pengulangan "buah" pada nama hasil tanaman dipakai secara idiomatis.
