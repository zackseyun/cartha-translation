source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: id
  text: Setelah Yesus selesai menyampaikan perkataan-perkataan ini,[a] orang banyak takjub akan pengajaran-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan-ucapan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Setelah
  rationale: Rangkaian ini merupakan formula naratif peralihan yang mengantar anak kalimat waktu. Dalam bahasa Indonesia modern, 'Setelah' mengungkapkan hubungan temporal secara alami; menerjemahkan unsur-unsurnya secara harfiah sebagai 'Dan terjadilah ketika' akan terasa kaku.
- source_word: ἐτέλεσεν
  choice: selesai menyampaikan
  rationale: Kata kerja ini menyatakan bahwa Yesus menuntaskan wacana tersebut. Tambahan 'menyampaikan' membuat hubungan dengan 'perkataan-perkataan' wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: τοὺς λόγους τούτους
  choice: perkataan-perkataan ini
  rationale: λόγοι dapat berarti perkataan, ucapan, atau ajaran. 'Perkataan-perkataan ini' mempertahankan bentuk jamak serta penunjuk τούτους dan tidak memasukkan label tafsir seperti 'khotbah'.
- source_word: ἐξεπλήσσοντο
  choice: takjub
  rationale: Bentuk imperfek menggambarkan reaksi orang banyak, sedangkan 'takjub' secara alami menyampaikan keterkejutan dan kekaguman yang kuat dalam bahasa Indonesia.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan baku Indonesia 'orang banyak' merujuk pada kumpulan orang secara kolektif dan lebih alami daripada 'kerumunan-kerumunan', meskipun bentuk Yunani secara gramatikal jamak.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: akan pengajaran-Nya
  rationale: Dengan ἐξεπλήσσοντο, ἐπί berdatif menunjukkan hal atau dasar yang menimbulkan ketakjuban. 'Takjub akan pengajaran-Nya' merupakan padanan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Acuan perkataan Yesus
  choice: '''perkataan-perkataan ini'' mengacu pada pengajaran yang baru saja Yesus tuntaskan'
  alternative: '''ucapan-ucapan ini''; ''khotbah ini'''
  rationale: Terjemahan mempertahankan acuan langsung kepada wacana sebelumnya tanpa menambahkan label teologis atau sastra yang tidak terdapat dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula naratif Yunani dialihkan secara alami menjadi anak kalimat waktu; kapitalisasi pronomina 'Nya' mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
