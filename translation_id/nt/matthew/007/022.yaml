review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future claim, the temporal phrase “pada hari itu,” the doubled vocative, the negative question expecting affirmation, and all three repetitions of “dalam nama-Mu.” “Roh-roh jahat” is a defensible Indonesian rendering of δαιμόνια. However, “karya penuh kuasa” is an overly literal and somewhat opaque rendering of δυνάμεις πολλὰς ἐποιήσαμεν.
  naturalness: The verse is generally fluent in modern standard Indonesian. Replacing “karya penuh kuasa” with “perbuatan ajaib” substantially improves idiomatic clarity while the footnote retains the broader lexical nuance of δύναμις.
  terminology: “Tuhan, Tuhan” appropriately retains κύριε κύριε, and “bernubuat” is standard. “Roh-roh jahat” avoids conflating the plural δαιμόνια with Satan and remains comprehensible. The revised main rendering for δυνάμεις uses natural Indonesian; its possible sense of deeds of power/miracles is preserved by the note.
  issues:
  - severity: medium
    issue: “karya penuh kuasa” is not idiomatic modern Indonesian and is semantically opaque.
    rationale: Although it attempts to retain the δύναμις/kuasa connection, this phrase reads as a calque. In this Gospel context, “perbuatan ajaib” naturally communicates deeds marked by divine power without requiring the main text to decide the full lexical range; the footnote can state “mukjizat” and “perbuatan yang berkuasa” as alternatives.
  revised_text: Banyak orang akan berkata kepada-Ku pada hari itu, “Tuhan, Tuhan, bukankah kami telah bernubuat dalam nama-Mu, mengusir roh-roh jahat dalam nama-Mu, dan melakukan banyak perbuatan ajaib[a] dalam nama-Mu?”
