  to: Banyak orang akan berkata kepada-Ku pada hari itu, “Tuhan, Tuhan, bukankah kami telah bernubuat dalam nama-Mu, mengusir roh-roh jahat dalam nama-Mu, dan melakukan banyak perbuatan ajaib[a] dalam nama-Mu?”
