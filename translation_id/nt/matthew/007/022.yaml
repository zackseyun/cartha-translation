  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: id
  text: Banyak orang akan berkata kepada-Ku pada hari itu, “Tuhan, Tuhan, bukankah kami telah bernubuat dalam nama-Mu, mengusir roh-roh jahat dalam nama-Mu, dan melakukan banyak perbuatan ajaib[a] dalam nama-Mu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “banyak mukjizat” atau “banyak perbuatan yang berkuasa.” Ungkapan Yunani secara harfiah menyebut banyak “kuasa”; dalam Injil, istilah ini sering dipakai untuk perbuatan ajaib.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Banyak orang
  rationale: Adjektiva maskulin jamak ini dipakai secara substantival. Bahasa Indonesia memerlukan nomina tersiratnya dinyatakan agar kalimat alami; “orang” sesuai dengan rujukan manusia dalam konteks.
- source_word: ἐροῦσίν μοι
  choice: akan berkata kepada-Ku
  rationale: Bentuk futur λέγω dengan pronomina datif diterjemahkan langsung dan alami sebagai “akan berkata kepada-Ku.”
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Ungkapan waktu ini diterjemahkan menurut idiom Indonesia. Nuansa eskatologisnya dipertahankan tanpa memperjelasnya menjadi “pada hari penghakiman.”
- source_word: Κύριε κύριε
  choice: Tuhan, Tuhan
  rationale: Pengulangan bentuk sapaan dipertahankan untuk menyampaikan desakan permohonan, sementara “Tuhan” menjaga bobot biasa maupun kristologis κύριος.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: bukankah kami telah bernubuat
  rationale: Pertanyaan dengan οὐ mengharapkan jawaban yang membenarkan klaim mereka. “Bukankah” menyampaikan hal itu secara alami, dan “telah bernubuat” mewakili tindakan lampau bentuk aoristus.
- source_word: τῷ σῷ ὀνόματι
  choice: dalam nama-Mu
  rationale: Ungkapan ini menyatakan tindakan dengan menyebut atau di bawah kewenangan nama seseorang. Pengulangannya tiga kali dipertahankan demi tekanan retoris teks.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: mengusir roh-roh jahat
  rationale: Dalam konteks ini ἐκβάλλω berarti mengusir, sedangkan δαιμόνια merujuk pada makhluk-makhluk roh jahat. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: melakukan banyak karya penuh kuasa
  rationale: δύναμις secara harfiah berkaitan dengan kuasa dan dalam Injil sering menunjuk kepada perbuatan ajaib. Pilihan ini mempertahankan hubungan leksikal dengan kuasa tanpa langsung membatasi maknanya pada “mukjizat.”
theological_decisions:
- issue: Penerjemahan κύριος sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: “Tuhan” mempertahankan arti gelar yang lazim serta bobot kristologisnya tanpa menambahkan klaim yang tidak dinyatakan secara eksplisit oleh ayat.
- issue: Daya eskatologis ungkapan “hari itu”
  choice: pada hari itu
  alternative: pada hari penghakiman
  rationale: Konteks mengarah pada penghakiman terakhir, tetapi teks Yunani hanya mengatakan “hari itu.” Terjemahan mempertahankan ungkapan dan ketegangan implisit tersebut.
- issue: Makna δυνάμεις dalam klaim para pembicara
  choice: karya penuh kuasa
  alternative: mukjizat
  rationale: Dalam konteks Injil istilah ini dapat menunjuk pada mukjizat, tetapi secara leksikal berarti “kuasa-kuasa” atau karya yang memperlihatkan kuasa. Terjemahan utama tidak menutup keluasan itu; padanan yang lebih eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab Indonesia. Pengulangan “dalam nama-Mu” dipertahankan karena merupakan unsur retoris penting dalam teks Yunani.
