  terminology: “Nabi-nabi palsu” tepat untuk ψευδοπροφητῶν. “Serigala-serigala buas” secara idiomatis menyampaikan sifat ἅρπαγες yang memangsa, merampas, dan merusak; alternatif “perampas” dipertahankan dalam catatan kaki.
