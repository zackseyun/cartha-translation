  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: id
  text: Waspadalah terhadap nabi-nabi palsu[a] yang datang kepadamu dengan mengenakan pakaian domba[b], tetapi sebenarnya mereka adalah serigala-serigala buas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berjaga-jagalah terhadap nabi-nabi palsu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dalam pakaian domba.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “tetapi di dalam diri mereka adalah serigala-serigala perampas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Waspadalah terhadap
  rationale: Imperatif kini jamak menyerukan kewaspadaan yang terus-menerus; konstruksi dengan ἀπό secara alami dinyatakan dengan 'terhadap' dalam bahasa Indonesia.
- source_word: ψευδοπροφητῶν
  choice: nabi-nabi palsu
  rationale: Padanan baku yang mencakup orang yang mengaku memiliki kewibawaan kenabian secara palsu atau menyampaikan kepalsuan sebagai nabi.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: yang datang kepadamu
  rationale: Mengungkapkan pendekatan mereka kepada para pendengar secara lugas dan alami tanpa menghilangkan sifat deskriptif klausa relatif.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: dengan berpakaian seperti domba
  rationale: Ungkapan ini mempertahankan citra penyamaran sebagai domba dan terdengar lebih jelas bagi pembaca Indonesia masa kini daripada terjemahan harfiah 'dalam pakaian domba'.
- source_word: ἔσωθεν δέ εἰσιν
  choice: tetapi di dalam diri mereka adalah
  rationale: Mempertahankan pertentangan tegas antara penampilan lahiriah dan kenyataan batin serta metafora identitas yang dinyatakan dengan εἰσιν.
- source_word: λύκοι ἅρπαγες
  choice: serigala-serigala buas
  rationale: ἅρπαγες menggambarkan sifat pemangsa, perampas, dan merusak; 'buas' alami dalam bahasa Indonesia dan menjaga daya gambar tersebut.
theological_decisions:
- issue: Sifat peringatan terhadap pemimpin keagamaan yang menipu
  choice: Menerjemahkan gambaran itu secara langsung sebagai peringatan moral-rohani terhadap nabi palsu.
  alternative: Mempersempitnya secara khusus kepada guru bidat menurut kategori doktrinal atau kelembagaan yang muncul kemudian.
  rationale: Ayat ini sendiri berbicara tentang nabi-nabi palsu melalui pertentangan antara penampilan dan kenyataan. Terjemahan tidak boleh memasukkan kategori denominasi atau gerejawi yang tidak dinyatakan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. Bentuk ulang pada 'nabi-nabi' dan 'serigala-serigala' mempertahankan bentuk jamak Yunani; 'kepada-mu' disatukan sebagai 'kepadamu' menurut ejaan baku.
