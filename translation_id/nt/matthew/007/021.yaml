source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: id
  text: Bukan setiap orang yang berkata kepada-Ku, ‘Tuhan, Tuhan,’ akan masuk ke dalam Kerajaan Surga[a], melainkan orang yang melakukan kehendak Bapa-Ku yang di surga akan masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kerajaan dari langit-langit.” Matius kerap memakai bentuk jamak ini; dalam bahasa Indonesia diterjemahkan secara idiomatis sebagai “Kerajaan Surga.” Pada akhir ayat, bentuk jamak Yunani yang sama juga diterjemahkan “surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Bukan setiap orang yang berkata kepada-Ku
  rationale: 'Οὐ bersama πᾶς menyatakan penyangkalan sebagian: bukan setiap orang, bukan tidak seorang pun. Partisipel kini λέγων dialihkan menjadi klausa relatif yang alami dalam bahasa Indonesia.'
- source_word: Κύριε κύριε
  choice: Tuhan, Tuhan
  rationale: Sapaan κύριε diterjemahkan dengan padanan baku “Tuhan”; pengulangannya dipertahankan untuk mencerminkan penekanan dalam teks Yunani.
- source_word: εἰσελεύσεται
  choice: akan masuk
  rationale: Bentuk futur εἰσελεύσεται secara alami menyatakan tindakan mendatang. Kata kerja ini diulangi pada akhir kalimat dalam bahasa Indonesia untuk memperjelas kontras yang secara eliptis dinyatakan dalam bahasa Yunani.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: ke dalam Kerajaan Surga
  rationale: βασιλεία diterjemahkan “Kerajaan,” sedangkan bentuk jamak khas Matius τῶν οὐρανῶν dialihkan secara idiomatis sebagai “Surga.” “Ke dalam” mempertahankan arah masuk yang dinyatakan oleh εἰς.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: melainkan orang yang melakukan
  rationale: ἀλλά setelah penyangkalan paling alami diterjemahkan “melainkan.” Partisipel substantival tunggal ὁ ποιῶν diterjemahkan sebagai “orang yang melakukan,” dengan daya umum dari bentuk kini tetap terpelihara.
- source_word: τὸ θέλημα
  choice: kehendak
  rationale: “Kehendak” merupakan padanan yang jelas dan lazim untuk θέλημα dalam konteks etis-teologis ini, tanpa mempersempitnya hanya menjadi keinginan atau perintah.
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: Bapa-Ku yang di surga
  rationale: Hubungan kepunyaan dan bahasa filial dipertahankan dalam “Bapa-Ku.” Frasa atributif τοῦ ἐν τοῖς οὐρανοῖς diterjemahkan secara idiomatis “yang di surga,” tanpa menyisipkan kata sifat yang tidak ada dalam teks.
theological_decisions:
- issue: Hubungan antara pengakuan lisan kepada Yesus sebagai Tuhan dan melakukan kehendak Bapa
  choice: Mempertahankan kontras langsung antara berkata “Tuhan, Tuhan” dan melakukan kehendak Bapa, tanpa merumuskan sistem keselamatan yang lebih luas.
  alternative: Menafsirkan ayat ini sebagai pembenaran oleh perbuatan, atau sebaliknya sebagai pernyataan bahwa pengakuan lisan saja sudah memadai.
  rationale: Teks secara eksplisit membedakan perkataan dari tindakan, tetapi ayat ini sendiri tidak memaparkan keseluruhan ajaran tentang keselamatan. Terjemahan harus menjaga peringatan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kepada-Ku” dan “Bapa-Ku” mengikuti konvensi ejaan Alkitab Indonesia bagi rujukan ilahi. Pengulangan “akan masuk” pada klausa terakhir membuat kontras lengkap dan alami dalam bahasa Indonesia meskipun kata kerjanya tersirat dalam klausa Yunani kedua.
