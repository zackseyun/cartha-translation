review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “seorang bijaksana” tidak secara memadai mengungkapkan ἀνδρὶ φρονίμῳ, yang menunjuk kepada seorang laki-laki yang bijaksana. Bentuk futur pasif ὁμοιωθήσεται tetap tercermin oleh “akan disamakan dengan,” dan “telah membangun” menyampaikan aoris ᾠκοδόμησεν dengan lebih jelas dalam konteks perbandingan ini.
  naturalness: “Seorang bijaksana” tidak lazim sebagai nomina untuk seseorang dalam bahasa Indonesia modern. “Seorang laki-laki bijaksana” adalah baku, jelas, dan tetap wajar. “Yang telah membangun rumahnya” memperjelas bahwa pembangunan rumah mendahului akibat yang digambarkan dalam ayat berikutnya.
  terminology: “Perkataan-Ku,” “melakukannya,” dan “batu karang” merupakan padanan yang baik dan bernada baku. Kapitalisasi “-Ku” konsisten dengan konvensi Alkitab Indonesia. Catatan alternatif diperbaiki agar konstruksi Indonesia bagi makna perbandingan lebih idiomatis.
  issues:
  - severity: medium
    issue: Frasa “seorang bijaksana” menghilangkan rujukan eksplisit kepada laki-laki dalam ἀνδρὶ φρονίμῳ dan terdengar tidak alami.
    rationale: ἀνήρ secara khusus berarti laki-laki, bukan sekadar orang secara umum. Terjemahan utama sebaiknya mempertahankan unsur ini; catatan kaki tidak semestinya menjadi satu-satunya tempat informasi leksikal tersebut muncul.
  - severity: low
    issue: “Yang membangun” kurang jelas menyatakan tindakan pembangunan yang sudah selesai dalam ᾠκοδόμησεν.
    rationale: Walaupun bentuk relatif tanpa penanda waktu mungkin dapat dipahami, “yang telah membangun” secara alami menandai tindakan lampau/aoristis tanpa menambahkan rincian makna.
  - severity: low
    issue: Alternatif “akan diumpamakan dengan” kurang idiomatis.
    rationale: Dalam bahasa Indonesia, seseorang lazim “diumpamakan kepada” seseorang lain, atau “disamakan dengan” seseorang.
  revised_text: Karena itu, setiap orang yang mendengar perkataan-Ku ini dan melakukannya akan disamakan dengan seorang laki-laki bijaksana yang telah membangun rumahnya di atas batu karang.[a][b]
  revised_footnotes:
