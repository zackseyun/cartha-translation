id: MAT.7.24
reference: Matthew 7:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: id
  text: Karena itu, setiap orang yang mendengar perkataan-Ku ini dan melakukannya akan disamakan dengan seorang laki-laki bijaksana yang telah membangun rumahnya di atas batu karang.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan diumpamakan kepada” atau “akan seperti.”
    reason: lexical_alternative
  - marker: b
    text: 'Teks Yunani memakai bentuk maskulin: “seorang laki-laki bijaksana.”'
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Karena itu, setiap orang yang
  rationale: Πᾶς bersama ὅστις menyatakan cakupan distributif dan umum, sedangkan οὖν menandai kesimpulan dari ajaran sebelumnya.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: mendengar perkataan-Ku ini
  rationale: λόγους dapat berarti kata-kata atau perkataan; 'perkataan' terdengar alami dalam bahasa Indonesia dan tetap menunjuk pada ajaran Yesus. Bentuk '-Ku' mempertahankan μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: dan melakukannya
  rationale: ποιεῖ menyatakan melakukan apa yang telah didengar. Bentuk ini mempertahankan kesejajaran langsung antara mendengar dan melakukan.
- source_word: ὁμοιωθήσεται
  choice: akan disamakan dengan
  rationale: Bentuk pasif futur dipertahankan secara wajar dan membuka kemungkinan makna 'disamakan' atau 'diumpamakan', tanpa mengubahnya menjadi pernyataan identitas sederhana.
- source_word: ἀνδρὶ φρονίμῳ
  choice: seorang bijaksana
  rationale: Dalam bahasa Indonesia, 'seorang bijaksana' secara alami menunjuk kepada seorang manusia dan mempertahankan sifat φρόνιμος. Karena konteks berikutnya memakai '-nya', jenis kelamin tokoh tidak perlu dinyatakan secara eksplisit; catatan menjelaskan bentuk maskulin sumber.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: yang membangun rumahnya
  rationale: Terjemahan langsung dan alami yang mempertahankan tindakan membangun serta kepemilikan rumah.
- source_word: ἐπὶ τὴν πέτραν
  choice: di atas batu karang
  rationale: '''Batu karang'' menyampaikan πέτρα sebagai dasar batu yang kukuh tanpa mempersempitnya secara berlebihan menjadi istilah teknis geologis.'
theological_decisions:
- issue: Bahasa representatif bergender dalam perbandingan
  choice: seorang bijaksana
  alternative: seorang laki-laki bijaksana
  rationale: ἀνήρ berbentuk maskulin dan dapat berarti laki-laki, tetapi penambahan eksplisit 'laki-laki' terasa berat dalam bahasa Indonesia. Terjemahan utama tetap alami, sementara catatan mempertahankan informasi gramatikal sumber tanpa mengubah cakupan umum 'setiap orang'.
- issue: Nuansa pasif ὁμοιωθήσεται
  choice: akan disamakan dengan
  alternative: akan seperti
  rationale: Pilihan ini mempertahankan bentuk pasif dan ketegangan semantis apakah orang itu 'disamakan', 'diumpamakan', atau secara idiomatis 'akan seperti' tokoh dalam perbandingan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pada '-Ku' mengikuti konvensi penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Kedua penanda catatan kaki dicantumkan dalam teks utama.
