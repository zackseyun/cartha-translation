revisions:
- from: Karena itu, setiap orang yang mendengar perkataan-Ku ini dan melakukannya akan disamakan dengan seorang bijaksana yang membangun rumahnya di atas batu karang.[a][b]
  to: Karena itu, setiap orang yang mendengar perkataan-Ku ini dan melakukannya akan disamakan dengan seorang laki-laki bijaksana yang telah membangun rumahnya di atas batu karang.[a][b]
  rationale: Revisi mempertahankan makna inferensial, cakupan umum, hubungan antara mendengar dan melakukan, serta bentuk perbandingan pasif. Rujukan maskulin ἀνήρ kini hadir dalam teks utama, sementara catatan kaki tetap memberi transparansi mengenai bentuk gramatikal sumber. Tidak ada persoalan tekstual yang menuntut pelestarian ambiguitas.
