  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: id
  text: Mintalah[a], dan akan diberikan kepada kalian; carilah, dan kalian akan menemukan; ketuklah, dan akan dibukakan bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk imperatif kini dalam bahasa Yunani juga dapat dipahami dengan nuansa berkelanjutan: “Teruslah meminta ... teruslah mencari ... teruslah mengetuk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Mintalah
  rationale: Imperatif aktif orang kedua jamak. “Mintalah” merupakan perintah yang alami dan menjaga makna meminta tanpa menjadikan nuansa keberlangsungan aspek Yunani sebagai sesuatu yang wajib.
- source_word: δοθήσεται
  choice: akan diberikan
  rationale: Bentuk futur pasif dipertahankan, sementara pelaku pemberian tetap tidak disebutkan sebagaimana dalam teks Yunani.
- source_word: ὑμῖν
  choice: kepadamu / bagimu
  rationale: Pronomina datif dinyatakan secara alami menurut konstruksi Indonesianya. “Kamu” dapat menyapa para pendengar secara kolektif tanpa ungkapan yang kaku.
- source_word: ζητεῖτε
  choice: carilah
  rationale: Imperatif “carilah” alami dalam bahasa Indonesia dan dapat mencakup pencarian harfiah maupun kiasan.
- source_word: εὑρήσετε
  choice: kamu akan menemukan
  rationale: Menyampaikan futur aktif secara langsung dan jelas.
- source_word: κρούετε
  choice: ketuklah
  rationale: Imperatif ini mempertahankan gambaran mengetuk pintu yang tersirat oleh pasangan kalimat berikutnya.
- source_word: ἀνοιγήσεται
  choice: akan dibukakan
  rationale: “Dibukakan” mempertahankan makna pasif serta hubungan benefaktif dengan “bagimu”; pelakunya tidak dinyatakan.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi sederhana ini dipertahankan dalam ketiga rangkaian untuk menjaga kesejajaran dan irama teks Yunani tanpa menambahkan makna akibat melalui “maka”.
theological_decisions:
- issue: Aspek ketiga imperatif kini
  choice: 'Ketiga perintah diterjemahkan sebagai imperatif biasa: “Mintalah ... carilah ... ketuklah.”'
  alternative: “Teruslah meminta ... teruslah mencari ... teruslah mengetuk.”
  rationale: Bentuk present imperative Yunani memungkinkan nuansa tindakan yang berlanjut atau berulang, tetapi tidak dengan sendirinya mewajibkan parafrasa eksplisit “teruslah.” Nuansa alternatif dicatat dalam catatan kaki agar kegigihan tidak dipaksakan ataupun dihilangkan.
- issue: Pelaku dalam kedua verba pasif
  choice: 'Pelaku tidak disebutkan: “akan diberikan” dan “akan dibukakan.”'
  alternative: Menyebut Allah sebagai pelaku secara eksplisit.
  rationale: Konteks dapat mengarahkan pembaca kepada Allah sebagai pelaku, tetapi teks Yunani memakai bentuk pasif dan tidak menyebut-Nya dalam ayat ini. Terjemahan mempertahankan ketakterucapan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Akhiran “-lah” memberi bentuk perintah yang wajar. Pola tiga bagian dan bentuk pasif teks sumber dipertahankan; “dan” dipilih alih-alih “maka” supaya tidak menambahkan hubungan konsekuensial yang tidak dinyatakan secara eksplisit.
