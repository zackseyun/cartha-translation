  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: id
  text: Masuklah melalui pintu yang sempit. Sebab pintu itu lebar dan jalan yang menuju kebinasaan[b] itu luas[a], dan banyak orang masuk melaluinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lapang.” Kata Yunani εὐρύχωρος dapat berarti luas, lapang, atau lebar.
    reason: lexical_alternative
  - marker: b
    text: Atau “kehancuran” atau “keruntuhan.” Kata Yunani ἀπώλεια dapat menunjuk pada kebinasaan, kehancuran, atau keadaan yang berakhir dalam keruntuhan.
    reason: lexical_alternative
  - marker: c
    text: Kata “-nya” secara tata bahasa dapat mengacu pada pintu atau jalan; konteks gambaran masuk melalui sebuah pintu mendukung acuan kepada pintu.
    reason: referent_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Masuklah
  rationale: Imperatif aoris orang kedua jamak diterjemahkan sebagai perintah langsung. Bentuk “-lah” menyampaikan dorongan tegas dengan wajar dalam bahasa Indonesia.
- source_word: διὰ τῆς στενῆς πύλης
  choice: melalui pintu yang sempit
  rationale: διά dengan genitif menyatakan gerak melalui sesuatu; “pintu yang sempit” merupakan padanan alami dan mempertahankan gambaran ruang dalam teks.
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi perintah sebelumnya. “Sebab” ringkas, jelas, dan sesuai dengan ragam bermartabat.
- source_word: πλατεῖα ἡ πύλη
  choice: pintu itu lebar
  rationale: πλατεῖα berarti lebar. Susunan Indonesia yang lazim dipilih tanpa menghilangkan pertentangannya dengan pintu sempit.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: jalan ... itu luas
  rationale: εὐρύχωρος dapat berarti luas, lapang, atau lebar. “Luas” terdengar alami untuk jalan dan membedakannya secara stilistis dari “lebar” pada pintu tanpa mengubah kontrasnya.
- source_word: ἡ ἀπάγουσα
  choice: yang menuju
  rationale: Partisipel kini yang menerangkan jalan diterjemahkan dengan klausa relatif yang alami serta mempertahankan arah dan hasil perjalanan tersebut.
- source_word: εἰς τὴν ἀπώλειαν
  choice: menuju kebinasaan
  rationale: ἀπώλεια mencakup kebinasaan, kehancuran, atau keruntuhan. “Kebinasaan” mempertahankan bobot serius peringatan ini tanpa menentukan lebih jauh hakikat akhir tersebut.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: banyak orang masuk melaluinya
  rationale: Ungkapan ini mempertahankan penekanan pada banyaknya orang. Pronomina “-nya” mencerminkan αὐτῆς tanpa secara eksplisit mengganti acuannya dengan nomina yang tidak diulang dalam bahasa Yunani.
theological_decisions:
- issue: Makna ἀπώλεια dalam peringatan Yesus
  choice: kebinasaan
  alternative: kehancuran atau keruntuhan
  rationale: Teks menyatakan akhir yang membawa malapetaka, tetapi tidak menjelaskan seluruh sifat teologis akhir itu. “Kebinasaan” mempertahankan keseriusan sekaligus ketegangan maknanya.
- issue: Acuan αὐτῆς dalam frasa terakhir
  choice: melaluinya
  alternative: melalui pintu itu atau melalui jalan itu
  rationale: Baik πύλη (pintu) maupun ὁδός (jalan) berjenis feminin dalam bahasa Yunani, sehingga bentuk pronominanya sendiri tidak sepenuhnya meniadakan ambiguitas. Terjemahan dengan “-nya” tidak memaksakan penyelesaian yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat alami dan bernada tegas. Metafora pintu dan jalan dipertahankan secara konkret. Pengulangan “itu” membantu kejelasan kontras tanpa menambahkan penafsiran doktrinal.
