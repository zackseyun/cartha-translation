    issue: Padanan ἀνομία sebagai “kedurhakaan” kurang eksplisit menyatakan unsur hukum.
    rationale: ἀνομία secara leksikal menunjuk pada lawlessness, yakni keadaan atau tindakan yang melanggar/menolak hukum. “Kedurhakaan” dapat dipahami lebih umum sebagai ketidaktaatan atau pembangkangan, sehingga unsur tersebut kurang jelas.
  - severity: low
    issue: “Enyahlah dari hadapan-Ku” agak lebih idiomatis-tradisional dan lebih keras daripada padanan modern langsung untuk ἀποχωρεῖτε ἀπ’ ἐμοῦ.
    rationale: “Pergilah dari-Ku” menyampaikan perintah untuk pergi menjauh dari pembicara secara cukup tegas, tanpa memperluas ungkapan sumber menjadi perintah untuk lenyap atau menekankan pengusiran secara berlebihan.
