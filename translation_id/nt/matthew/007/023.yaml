  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: id
  text: Lalu Aku akan menyatakan kepada mereka, ‘Aku tidak pernah mengenal kalian.[a] Pergilah dari-Ku, kalian yang melakukan pelanggaran hukum[b]!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku tidak pernah mengakui kalian.” Kata Yunani yang diterjemahkan “mengenal” dapat menunjuk pada pengenalan atau hubungan pribadi, bukan sekadar mengetahui fakta.
    reason: lexical_alternative
  - marker: b
    text: Atau “kalian yang melakukan kedurhakaan” atau “kalian yang berbuat jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Lalu
  rationale: Menandai hubungan dan urutan dengan konteks sebelumnya secara alami dalam bahasa Indonesia; unsur penghubung καί tercakup dalam alur kata “Lalu”.
- source_word: ὁμολογήσω
  choice: Aku akan menyatakan
  rationale: Dalam konteks penghakiman, verba ini menunjuk pada pernyataan terbuka dan tegas, bukan pengakuan kesalahan.
- source_word: Οὐδέποτε
  choice: tidak pernah
  rationale: Mempertahankan penyangkalan mutlak dan tegas dari adverbia Yunani.
- source_word: ἔγνων
  choice: mengenal
  rationale: Mempertahankan ungkapan relasional dari γινώσκω tanpa mempersempitnya menjadi sekadar mengetahui fakta, mengakui, atau menyetujui.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: Enyahlah dari hadapan-Ku
  rationale: Menyampaikan perintah pengusiran yang tegas dan khidmat. “Dari hadapan-Ku” alami dalam bahasa Indonesia dan menyatakan pemisahan dari pembicara.
- source_word: οἱ ἐργαζόμενοι
  choice: kalian yang melakukan
  rationale: Partisipel menunjuk pada orang-orang yang menjalankan perbuatan tersebut; bentuk ini lugas dan tidak menambahkan penjelasan tentang frekuensi atau kebiasaan yang tidak dinyatakan secara eksplisit.
- source_word: τὴν ἀνομίαν
  choice: kedurhakaan
  rationale: “Kedurhakaan” menyampaikan pelanggaran dan penolakan terhadap hukum atau kehendak Allah dengan bahasa Indonesia yang wajar dan bermartabat; catatan kaki mempertahankan alternatif yang lebih harfiah.
theological_decisions:
- issue: Makna ‘Aku tidak pernah mengenal kalian’
  choice: Ungkapan relasional “tidak pernah mengenal” dipertahankan tanpa parafrasa doktrinal.
  alternative: Aku tidak pernah mengakui kalian / Aku tidak pernah berkenan kepada kalian
  rationale: Teks Yunani memakai bahasa pengenalan relasional. Menggantinya dengan “mengakui,” “menyetujui,” atau penjelasan mengenai status keselamatan akan menyelesaikan ketegangan teologis yang dibiarkan tersirat oleh ayat.
- issue: Daya makna ἀνομία
  choice: kedurhakaan
  alternative: pelanggaran hukum / kejahatan
  rationale: Pilihan ini mempertahankan dimensi moral sekaligus sikap menentang hukum atau kehendak Allah, tanpa memasukkan kerangka doktrinal denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan tegas. “Kalian” dipakai karena objek Yunani berbentuk jamak dan untuk membedakannya dari bentuk tunggal. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi Alkitab bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
