- from: Lalu Aku akan menyatakan kepada mereka, ‘Aku tidak pernah mengenal kalian.[a] Enyahlah dari hadapan-Ku, kalian yang melakukan kedurhakaan!’[b]
  to: Lalu Aku akan menyatakan kepada mereka, ‘Aku tidak pernah mengenal kalian.[a] Pergilah dari-Ku, kalian yang melakukan pelanggaran hukum[b]!’
  rationale: Revisi memperjelas unsur “hukum” dalam ἀνομία dan memakai perintah pemisahan yang lebih alami dalam bahasa Indonesia standar modern. Ungkapan “Aku tidak pernah mengenal kalian” dipertahankan agar nuansa relasional/yudisial teks tidak digantikan oleh penafsiran teologis. Penanda catatan kaki diposisikan tepat pada unsur yang dijelaskan.
