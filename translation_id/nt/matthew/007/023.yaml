  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia pada urutan dan daya kalimat Yunani. Namun, “kedurhakaan” lebih luas dan kurang secara langsung menyampaikan ἀνομία, yaitu pelanggaran atau pengabaian hukum. “Pergilah dari-Ku” menyampaikan imperatif ἀποχωρεῖτε ἀπ’ ἐμοῦ dengan lebih alami dalam bahasa Indonesia standar modern tanpa menambah daya pengusiran yang dapat dibawa oleh “Enyahlah.”
  naturalness: Kalimat revisi tetap khidmat, tegas, dan modern. “Pergilah dari-Ku” lebih lazim dan langsung daripada “Enyahlah dari hadapan-Ku,” sementara tetap sesuai dengan register penghakiman dalam konteks ini.
  terminology: “Mengenal” tepat untuk ἔγνων dan membiarkan nuansa relasional/yudisialnya terbuka. “Menyatakan” tepat untuk ὁμολογήσω. “Pelanggaran hukum” lebih transparan dan lebih dekat dengan daya moral-legal ἀνομία daripada “kedurhakaan.”
  issues:
