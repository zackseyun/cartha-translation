  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: id
  text: Jadi, jika kamu, walaupun jahat, tahu memberikan pemberian yang baik kepada anak-anakmu, terlebih lagi Bapamu yang ada di surga[a] akan memberikan hal-hal yang baik[b] kepada orang-orang yang meminta kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Yunani memakai bentuk jamak: “di surga-surga.” Dalam bahasa Indonesia, ungkapan yang lazim ialah “di surga.”'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani di sini hanya mengatakan “hal-hal yang baik”; kata “pemberian” dari klausa sebelumnya tidak diulangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὄντες
  choice: Jadi, jika kamu, walaupun jahat
  rationale: Susunan ini mempertahankan hubungan kesimpulan οὖν dan daya konsesif partisip πονηροὶ ὄντες. Kata «jahat» menyampaikan penilaian teks secara langsung tanpa memperluasnya menjadi rumusan doktrinal tertentu. «Kamu» secara alami dapat menyapa kelompok dalam bahasa Indonesia.
- source_word: οἴδατε ... διδόναι
  choice: tahu memberikan
  rationale: Dengan infinitif pelengkap, ungkapan ini menyatakan pengetahuan atau kecakapan praktis. Bentuk ini alami dalam bahasa Indonesia dan tidak perlu ditambah «bagaimana caranya».
- source_word: δόματα ἀγαθὰ
  choice: pemberian yang baik
  rationale: «Pemberian» menyampaikan δόματα secara wajar dan bermartabat; bentuk nomina tanpa pengulangan tetap dapat dipahami secara jamak dalam bahasa Indonesia. «Yang baik» menerjemahkan sifat ἀγαθὰ.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: kepada anak-anakmu
  rationale: τέκνα mencakup anak laki-laki dan perempuan. «Anak-anakmu» akurat, inklusif, dan alami.
- source_word: πόσῳ μᾶλλον
  choice: terlebih lagi
  rationale: 'Ungkapan ini menyampaikan argumen a fortiori secara jelas dan idiomatis: jika manusia yang jahat dapat memberi yang baik, Bapa jauh lebih pasti akan melakukannya.'
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Bapamu yang ada di surga
  rationale: «Bapamu» mempertahankan relasi langsung dalam teks, sedangkan klausa «yang ada di surga» mempertahankan bentuk lokatif, bukan mengubahnya menjadi gelar adjektival. Bahasa Indonesia lazim memakai «surga» sebagai nama ranah tanpa penandaan jumlah; bentuk jamak Yunani dijelaskan dalam catatan.
- source_word: δώσει ἀγαθὰ
  choice: akan memberikan hal-hal yang baik
  rationale: Karena δόματα tidak diulangi dalam klausa kedua, «hal-hal yang baik» menerjemahkan adjektiva substantival ἀγαθὰ tanpa menyisipkan kembali kata «pemberian».
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: kepada orang-orang yang meminta kepada-Nya
  rationale: Partisip kini yang substantival menunjuk pada golongan umum. Bentuk ini alami dan mempertahankan tindakan meminta yang diarahkan kepada Bapa.
theological_decisions:
- issue: Daya antropologis frasa πονηροὶ ὄντες
  choice: Mempertahankan sebutan langsung «walaupun jahat».
  alternative: «walaupun berdosa» atau «walaupun tidak sempurna»
  rationale: «Jahat» mempertahankan ketegangan perbandingan Yesus antara keadaan moral manusia dan kebaikan Bapa. «Berdosa» dapat membawa perumusan teologis tambahan, sedangkan «tidak sempurna» terlalu melunakkan teks.
- issue: Bentuk jamak ἐν τοῖς οὐρανοῖς
  choice: Memakai ungkapan Indonesia yang idiomatis «di surga» dalam teks dan menjelaskan bentuk jamak Yunani dalam catatan.
  alternative: «di surga-surga»
  rationale: Bahasa Yunani memakai bentuk jamak, tetapi penggandaan «surga-surga» dalam bahasa Indonesia dapat menyiratkan kosmologi berlapis yang tidak harus dimaksudkan oleh bentuk Yunani itu. Catatan menjaga transparansi terhadap sumber tanpa menimbulkan tafsiran tambahan.
- issue: Perbedaan antara δόματα ἀγαθὰ dan ἀγαθὰ pada klausa kedua
  choice: Menerjemahkan yang pertama «pemberian yang baik» dan yang kedua «hal-hal yang baik».
  alternative: Mengulang «pemberian yang baik» pada kedua klausa.
  rationale: Pilihan ini mempertahankan perbedaan bentuk Yunani dan tidak menyelaraskan klausa kedua secara berlebihan, sekaligus tetap menunjukkan hubungan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan alur argumentasi dari yang lebih kecil kepada yang lebih besar. Kapitalisasi «Bapa» dan bentuk terikat «-Nya» mengikuti kebiasaan ejaan religius Indonesia tanpa menambah gelar yang tidak terdapat dalam teks.
