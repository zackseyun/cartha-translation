id: MAT.7.14
reference: Matthew 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: id
  text: Sebab pintu itu sempit dan jalan yang menuju kepada kehidupan itu sukar dilalui, dan hanya sedikit orang yang menemukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: sempit
  rationale: Secara langsung mempertahankan gambaran pintu yang sempit dengan ungkapan Indonesia yang alami.
- source_word: τεθλιμμένη
  choice: sukar dilalui
  rationale: Bentuk ini secara harfiah menggambarkan sesuatu yang tertekan atau terhimpit; dalam konteks jalan, terjemahan ini menyampaikan bahwa jalan tersebut sempit dan berat ditempuh tanpa memakai ungkapan Indonesia yang janggal.
- source_word: ζωήν
  choice: kehidupan
  rationale: Mempertahankan istilah umum Yunani dan cakupan teologisnya tanpa mempersempitnya secara eksplisit menjadi kehidupan kekal.
- source_word: ὀλίγοι
  choice: hanya sedikit orang
  rationale: Menyatakan jumlah yang kecil secara alami dalam bahasa Indonesia serta mempertahankan penekanan kontras dalam ayat.
- source_word: εὑρίσκοντες
  choice: menemukannya
  rationale: Padanan langsung yang mempertahankan metafora menemukan jalan menuju kehidupan.
theological_decisions:
- issue: Makna kehidupan
  choice: kehidupan
  alternative: kehidupan kekal
  rationale: Teks Yunani hanya menyebut ζωή tanpa kata 'kekal'; terjemahan tidak menambahkan penjelasan teologis yang tidak dinyatakan langsung.
- issue: Sifat jalan menuju kehidupan
  choice: sukar dilalui
  alternative: terhimpit
  rationale: Pilihan ini menjaga gagasan kesesakan dan kesulitan yang terkandung dalam τεθλιμμένη, tetapi tidak menentukan secara khusus sumber atau bentuk kesulitan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur kalimat mempertahankan kesejajaran antara pintu, jalan, kehidupan, dan sedikitnya orang yang menemukannya.
source_grounding:
  english_pob_role: consult_only
