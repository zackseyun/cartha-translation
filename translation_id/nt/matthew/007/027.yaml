  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: id
  text: Hujan turun, air bah[a] datang, angin bertiup dan menghantam rumah itu. Rumah itu pun roboh, dan hebat sekali kerobohannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sungai-sungai datang.” Dalam konteks ini, ungkapan itu dapat menggambarkan air sungai yang meluap atau banjir yang datang melanda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Hujan turun
  rationale: Mengungkapkan gerak turun dalam καταβαίνω secara alami dalam bahasa Indonesia tanpa mengubah βροχή, 'hujan'.
- source_word: ἦλθον οἱ ποταμοί
  choice: air bah datang
  rationale: ποταμοί secara harfiah berarti 'sungai-sungai', tetapi dalam gambaran badai ini menunjuk pada air yang datang melanda. 'Air bah' menyampaikan daya rusaknya secara alami; arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: angin bertiup
  rationale: Padanan langsung dan wajar bagi frasa Yunani ini; bentuk jamak Yunani tidak perlu dipaksakan dalam bahasa Indonesia.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: menghantam rumah itu
  rationale: Dalam konteks badai, προσκόπτω menyatakan benturan terhadap rumah, bukan tindakan tersandung. 'Menghantam' mempertahankan kekuatan tindakan secara ringkas dan alami.
- source_word: ἔπεσεν
  choice: roboh
  rationale: Untuk sebuah rumah, 'roboh' merupakan padanan idiomatis bagi 'jatuh' dan tidak memerlukan penjelasan tambahan.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: hebat sekali kerobohannya
  rationale: Mempertahankan nomina πτῶσις dan penekanan μεγάλη dalam ungkapan Indonesia yang kuat serta mudah dipahami.
theological_decisions:
- issue: Kerasnya gambaran kehancuran pada penutup perumpamaan
  choice: hebat sekali kerobohannya
  alternative: kehancurannya sangat dahsyat
  rationale: Terjemahan mempertahankan kuatnya peringatan dalam gambaran rumah yang roboh, tetapi tidak memperluasnya menjadi pernyataan eksplisit mengenai penghakiman eskatologis yang tidak disebutkan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama naratif yang ringkas dan bermartabat. Pengulangan penghubung Yunani diringankan agar alami, tanpa mengurangi urutan hujan, air bah, angin, hantaman, dan kerobohan.
