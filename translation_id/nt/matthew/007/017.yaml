  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: id
  text: Demikianlah[a], setiap pohon yang baik menghasilkan buah yang baik, tetapi pohon yang busuk[b] menghasilkan buah yang buruk[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Jadi” atau “Dengan cara demikian”.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani sapros juga dapat berarti “rusak”, “buruk”, atau “bobrok”.
    reason: lexical_alternative
  - marker: c
    text: “Buah yang buruk” dapat juga diterjemahkan “buah yang jahat”; kata “buruk” terdengar alami dalam metafora pertanian, sedangkan konteks tetap memberi implikasi moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Menandai kesimpulan atau perbandingan dengan gambaran sebelumnya. Bentuk ini alami dan tetap mempertahankan daya inferensial teks Yunani.
- source_word: πᾶν δένδρον
  choice: setiap pohon
  rationale: πᾶν dengan nomina tunggal memiliki arti distributif; 'setiap pohon' mempertahankan sifat umum dan pepatah dari pernyataan ini.
- source_word: ἀγαθὸν
  choice: yang baik
  rationale: Menggambarkan mutu positif pohon secara luas. 'Baik' mempertahankan kesejajaran sederhana dengan buah yang baik tanpa mempersempitnya menjadi sekadar sehat secara fisik.
- source_word: καρποὺς καλοὺς
  choice: buah yang baik
  rationale: καλός dapat berarti baik, elok, atau bermutu; dalam konteks penilaian hasil, 'buah yang baik' paling wajar dalam bahasa Indonesia.
- source_word: ποιεῖ
  choice: menghasilkan
  rationale: Walaupun ποιέω secara harfiah berarti membuat atau melakukan, dalam hubungan pohon dan buah, 'menghasilkan' merupakan padanan Indonesia yang alami dan jelas.
- source_word: τὸ δὲ
  choice: tetapi pohon
  rationale: δέ menandai pertentangan antara kedua jenis pohon, sehingga 'tetapi' menyampaikan hubungan adversatif itu dengan tepat.
- source_word: σαπρὸν
  choice: yang busuk
  rationale: σαπρός menunjuk pada sesuatu yang busuk, rusak, atau tidak berguna. 'Busuk' konkret dan kuat dalam gambaran pohon, sekaligus tidak menghilangkan implikasi moral konteksnya.
- source_word: καρποὺς πονηροὺς
  choice: buah yang buruk
  rationale: πονηρός dapat berarti jahat atau buruk. 'Buah yang buruk' paling alami dalam metafora pertanian sambil tetap memungkinkan konteks memberi muatan moral.
theological_decisions:
- issue: Daya moral dibandingkan daya pertanian dari gambaran pohon dan buah
  choice: Mempertahankan metafora konkret tentang pohon dan buah tanpa menjelaskan penerapan moralnya di dalam teks ayat.
  alternative: Memakai bahasa yang lebih interpretatif, seperti 'pohon yang sehat menghasilkan buah yang bermanfaat' atau 'pohon yang bobrok menghasilkan buah yang jahat'.
  rationale: Dalam konteksnya, ayat ini berfungsi sebagai pepatah dalam peringatan Yesus tentang nabi-nabi palsu. Namun, teks Yunani sendiri menyatakan metaforanya, bukan penafsirannya; karena itu terjemahan membiarkan konteks menyampaikan daya moralnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang sederhana, bernada luhur, dan mudah dipahami. Pengulangan 'baik' dipertahankan karena mencerminkan kesejajaran retoris teks sumber. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
