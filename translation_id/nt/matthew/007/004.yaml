  naturalness: Teksnya pada dasarnya baku dan alami. “Biarkan aku mengeluarkan,” “serpihan,” dan “balok” jelas serta mempertahankan gambaran hiperbolis. Bentuk revisi tetap lancar dalam bahasa Indonesia modern.
