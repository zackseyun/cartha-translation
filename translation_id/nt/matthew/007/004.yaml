id: MAT.7.4
reference: Matthew 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: id
  text: Atau, bagaimana kamu akan berkata kepada saudaramu[a], ‘Biarkan aku mengeluarkan serpihan[b] dari matamu,’ dan lihatlah, ada balok[c] di matamu sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani untuk “saudaramu” berbentuk maskulin tunggal dan dapat dipakai secara representatif untuk sesama murid.
    reason: cultural_note
  - marker: b
    text: Atau “selumbar”; kata Yunani κάρφος berarti sepotong kecil bahan kering.
    reason: lexical_alternative
  - marker: c
    text: Atau “kayu besar”; kata Yunani δοκός menunjuk pada sepotong besar kayu, khususnya balok bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan alternatif retoris berikutnya dalam rangkaian argumen Yesus.
- source_word: πῶς ἐρεῖς
  choice: bagaimana mungkin kamu berkata
  rationale: Mengungkapkan pertanyaan retoris yang menantang kelayakan tindakan itu; ‘mungkin’ membuat daya retorisnya alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: τῷ ἀδελφῷ σου
  choice: kepada saudaramu
  rationale: ‘Saudara’ merupakan padanan alami yang dapat mempertahankan rujukan kepada sesama murid tanpa memaksakan hubungan biologis.
- source_word: Ἄφες ἐκβάλω
  choice: Biarkan aku mengeluarkan
  rationale: Ἄφες berfungsi sebagai permintaan izin, sedangkan ἐκβάλω dalam konteks mata secara alami berarti mengeluarkan.
- source_word: τὸ κάρφος
  choice: serpihan
  rationale: Menunjuk pada potongan kecil bahan kering dan mempertahankan kontras hiperbolis dengan balok.
- source_word: καὶ ἰδοὺ
  choice: padahal lihatlah
  rationale: ‘Padahal’ menyatakan pertentangan kontekstual, dan ‘lihatlah’ mempertahankan fungsi ἰδού sebagai penarik perhatian.
- source_word: ἡ δοκὸς
  choice: balok
  rationale: Padanan tepat untuk kayu besar atau kayu struktural dan mempertahankan ketimpangan gambaran dengan serpihan.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: ada ... di matamu sendiri
  rationale: Menyatakan keberadaan balok di mata secara alami; ‘sendiri’ menegaskan kontras yang tersirat kuat dalam konteks.
theological_decisions:
- issue: Cakupan gender dan relasi pada ἀδελφῷ
  choice: saudaramu
  alternative: saudara laki-lakimu; sesama orang percaya
  rationale: Bentuk Yunani adalah maskulin tunggal, tetapi dalam konteks pengajaran kepada para murid dapat dipakai secara representatif. ‘Saudaramu’ mempertahankan citra kekerabatan dan membiarkan cakupan kontekstual tetap terbuka.
- issue: Kontras hiperbolis κάρφος dan δοκός
  choice: serpihan / balok
  alternative: selumbar / gelondongan; serpihan / papan
  rationale: Pasangan ini menjaga ketimpangan yang disengaja dalam gambaran Yesus tanpa mempersempit κάρφος menjadi jenis serpihan tertentu atau mengubah δοκός menjadi papan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ‘kamu’, kalimat langsung yang alami, dan nada pengajaran yang tetap bermartabat. ‘Lihatlah’ dipertahankan untuk daya penarik perhatian dari ἰδού.
