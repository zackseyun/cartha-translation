  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: id
  text: Jadi, dari buah mereka kamu akan mengenali mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, dari buah mereka kamu akan mengetahui siapa mereka.”
    reason: Alternatif ini menampilkan penekanan inferensial ἄρα γε dan kemungkinan menerjemahkan ἐπιγνώσεσθε dengan “mengetahui”.
lexical_decisions:
- source_word: ἄρα γε
  choice: Jadi
  rationale: Gabungan ini menyatakan kesimpulan dengan sedikit penegasan. “Jadi” menyampaikan daya simpulan secara alami dalam bahasa Indonesia modern.
- source_word: ἀπὸ
  choice: dari
  rationale: Preposisi ini menunjukkan dasar yang darinya pengenalan dilakukan; “dari” mempertahankan bentuk ungkapan Yunani dan tetap wajar dalam konteks ini.
- source_word: καρπῶν
  choice: buah-buah
  rationale: Bentuk jamak Yunani dipertahankan, sekaligus menjaga metafora tentang hasil atau perbuatan yang dapat diamati.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif ini menerangkan “buah-buah” dan secara alami diterjemahkan sebagai “mereka” dalam frasa “buah-buah mereka”.
- source_word: ἐπιγνώσεσθε
  choice: kamu akan mengenali
  rationale: Bentuk futur orang kedua jamak ini menunjuk pada pengenalan atau identifikasi berdasarkan bukti yang tampak. “Mengenali” lebih tepat dalam konteks daripada sekadar “mengetahui”.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada orang-orang yang sedang dibicarakan.
theological_decisions:
- issue: Pemakaian metaforis “buah-buah” untuk menilai orang
  choice: Mempertahankan metafora “buah-buah” tanpa menjabarkannya dalam teks utama.
  alternative: perbuatan mereka; hasil-hasil mereka
  rationale: Konteks mengarah pada hal-hal yang dapat diamati, tetapi teks memakai metafora buah. Mempertahankannya menjaga hubungan dengan konteks langsung dan tidak mempersempit maknanya secara tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan “dari buah-buah mereka” sengaja mempertahankan gambaran serta arah ungkapan sumber, sementara “mengenali” menyampaikan tindakan mengidentifikasi orang berdasarkan bukti yang terlihat.
