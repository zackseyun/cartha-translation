review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan hujan turun, angin bertiup, rumah tidak roboh, dan fondasi yang sudah ada sebelumnya. Namun, οἱ ποταμοί secara leksikal adalah “sungai-sungai,” bukan “banjir”; “banjir” dapat dipakai sebagai padanan kontekstual bila alternatif harfiahnya dicatat dengan lebih netral. Selain itu, προσέπεσαν berbentuk jamak dan secara alami melanjutkan rangkaian unsur badai; terjemahan utama sebaiknya tidak membatasi hantaman hanya pada angin.
  naturalness: Bahasa draf umumnya baku dan lancar. “Namun” menambahkan kontras yang tidak perlu karena Yunani hanya memakai καί. Pengulangan “rumah itu” dan penggantian “lalu” dengan “dan” menghasilkan rangkaian yang lebih dekat pada gaya sumber tanpa menjadi tidak alami. “Fondasi rumah itu telah diletakkan” lebih jelas daripada “fondasinya telah diletakkan” setelah subjek kalimat bergeser ke angin.
  terminology: “Batu” merupakan padanan aman bagi πέτρα dan tidak memaksakan penafsiran simbolis. “Fondasi” mempertahankan citra θεμελιόω. Catatan untuk ποταμοί perlu membedakan alternatif leksikal “sungai-sungai” dari penafsiran kontekstual “banjir,” dan catatan untuk προσέπεσαν sebaiknya tidak memakai “menyerbu,” yang menambahkan nuansa agresi.
  issues:
  - severity: medium
    issue: Klausa “angin bertiup lalu menghantam rumah itu” membatasi προσέπεσαν pada angin saja.
    rationale: Verba προσέπεσαν berbentuk jamak setelah penyebutan sungai-sungai dan angin-angin. Walaupun hubungan sintaktis tepatnya dapat dipahami dalam rangkaian badai, terjemahan tidak sebaiknya secara eksplisit mengecualikan unsur air dari serangan terhadap rumah.
  - severity: low
    issue: Catatan a memuat penjelasan interpretatif “air sungai yang meluap atau arus banjir.”
    rationale: ποταμοί berarti “sungai-sungai”; kemungkinan banjir sudah tercermin dalam padanan utama, tetapi catatan alternatif sebaiknya menyajikan pilihan leksikal tanpa mengubahnya menjadi definisi yang lebih spesifik.
  - severity: low
    issue: “Namun” tidak memiliki padanan eksplisit dalam teks Yunani.
    rationale: Klausa terakhir diawali καί (“dan”). Kontrasnya dapat dipahami dari isi, tetapi tidak perlu ditandai dengan penghubung adversatif tambahan.
