base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: id
  text: Hujan pun turun, banjir datang[a], dan angin bertiup; semuanya menghantam rumah itu[b]. Rumah itu tidak roboh, sebab fondasi rumah itu telah diletakkan di atas batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sungai-sungai datang”; Yunani ποταμοί secara harfiah berarti “sungai-sungai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “jatuh menimpa” atau “menghantam” rumah itu. Kata kerja Yunani berbentuk jamak dan melanjutkan rangkaian unsur badai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Hujan pun turun
  rationale: Menyampaikan gerak turun yang dinyatakan καταβαίνω secara wajar dalam bahasa Indonesia; partikel “pun” membantu mempertahankan rangkaian naratif καί.
- source_word: οἱ ποταμοί
  choice: banjir
  rationale: Secara leksikal berarti “sungai-sungai,” tetapi dalam gambaran badai, bentuk jamak ini menunjuk pada aliran air yang datang mengancam rumah. “Banjir” paling alami dan jelas dalam bahasa Indonesia; arti harfiahnya dicatat dalam catatan kaki.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: angin bertiup
  rationale: Padanan langsung dan alami untuk verba πνέω dengan ἄνεμοι sebagai subjek. Bentuk tunggal kolektif “angin” lebih idiomatis dalam bahasa Indonesia.
- source_word: προσέπεσαν
  choice: menghantam
  rationale: Dalam konteks badai, kata ini menggambarkan angin yang jatuh atau menerjang rumah dengan keras. “Menghantam” menyampaikan daya bentur itu secara ringkas tanpa menentukan bahwa rumah roboh.
- source_word: οὐκ ἔπεσεν
  choice: tidak roboh
  rationale: Untuk sebuah bangunan, “roboh” merupakan padanan kontekstual yang alami bagi πίπτω dan tidak menambahkan gagasan di luar akibat yang dinyatakan.
- source_word: τεθεμελίωτο
  choice: fondasinya telah diletakkan
  rationale: Mempertahankan citra fondasi, bentuk pasif, serta keadaan yang sudah terwujud sebelum badai datang sebagaimana dinyatakan bentuk pluperfek Yunani.
- source_word: ἐπὶ τὴν πέτραν
  choice: di atas batu
  rationale: Padanan langsung yang mempertahankan gambaran perumpamaan tanpa mempersempit πέτρα menjadi istilah geologis yang lebih khusus seperti “batuan dasar.”
theological_decisions:
- issue: Makna simbolis batu dalam perumpamaan
  choice: di atas batu
  alternative: di atas batu karang atau di atas batu dasar
  rationale: Ayat ini mempertahankan gambaran konkret tanpa secara eksplisit mengidentifikasi batu itu secara teologis. Terjemahan tidak menambahkan penafsiran doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rentetan unsur badai, sedangkan “Namun” memperjelas kontras yang secara wajar terkandung dalam klausa berikutnya. Istilah “fondasi” dipilih karena umum dipahami dan mempertahankan citra dasar bangunan.
