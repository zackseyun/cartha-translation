  rationale: Revisi mempertahankan “banjir” sebagai padanan kontekstual yang wajar sambil memberi alternatif leksikal yang tepat untuk ποταμοί. Subjek “semuanya” mencakup rangkaian unsur badai tanpa memutuskan secara berlebihan unsur mana yang secara khusus menjadi pelaku προσέπεσαν. Penghapusan “Namun” mengikuti penghubung καί, dan frasa fondasi dipertegas agar keadaan pasif yang telah berlangsung sebelum badai tetap jelas.
