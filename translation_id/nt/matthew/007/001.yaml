id: MAT.7.1
reference: Matthew 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: id
  text: Jangan menghakimi[a], supaya kamu tidak dihakimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan menghukum, supaya kamu tidak dihukum.” Kata kerja Yunani yang dipakai dapat, dalam konteks tertentu, berarti menghukum, tetapi “menghakimi” memiliki cakupan lebih luas dan mempertahankan pengulangan kata dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: Jangan menghakimi
  rationale: μή dengan imperatif kini membentuk larangan. “Jangan menghakimi” menyampaikan larangan itu secara alami dan mempertahankan keluasan makna κρίνω.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Ungkapan ini menyatakan tujuan atau akibat yang dimaksud; “supaya ... tidak” alami dalam bahasa Indonesia dan mempertahankan hubungan antarklausa.
- source_word: κριθῆτε
  choice: kamu tidak dihakimi
  rationale: Bentuk pasif aoristus subjungtif diterjemahkan secara pasif dan memakai akar yang sama dengan κρίνετε, sehingga pengulangan retoris teks Yunani tetap tampak.
theological_decisions:
- issue: Cakupan makna κρίνω dalam larangan Yesus
  choice: Memakai istilah luas “menghakimi”, bukan mempersempitnya menjadi “menghukum”.
  alternative: Jangan menghukum, supaya kamu tidak dihukum.
  rationale: Ayat ini sendiri tidak merinci seluruh batas penilaian moral. “Menghakimi” mempertahankan ketegangan makna dan membiarkan konteks Matius 7:2–5 memperjelas jenis penghakiman yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, bermartabat, dan mudah dipahami. Pronomina “kamu” dipakai untuk orang kedua jamak sesuai bentuk verba Yunani dan kelaziman bahasa Indonesia.
