  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: id
  text: sebab Ia mengajar mereka sebagai orang yang memiliki wewenang[a], dan tidak seperti para ahli Taurat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “dengan wewenang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: sebab Ia mengajar
  rationale: Konstruksi perifrastik imperfek menyatakan tindakan mengajar yang berlangsung pada waktu lampau. "Sebab" mempertahankan fungsi penjelas γάρ dan menghubungkannya dengan ketakjuban orang banyak pada ayat sebelumnya.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina objek ini mengacu kepada orang banyak atau para pendengar Yesus.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: sebagai orang yang memiliki wewenang
  rationale: Ungkapan ini mempertahankan bentuk perbandingan personal dalam bahasa Yunani. ἐξουσία menunjuk pada wewenang atau hak yang sah, bukan sekadar rasa percaya diri atau daya retoris.
- source_word: καὶ οὐχ ὡς
  choice: dan tidak seperti
  rationale: Terjemahan ini menyampaikan perbandingan kontras secara alami dalam bahasa Indonesia.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ahli-ahli Taurat mereka
  rationale: Dalam konteks Injil, γραμματεῖς adalah para pakar dan pengajar Taurat. "Mereka" mempertahankan αὐτῶν dan menunjuk pada para ahli Taurat yang dikenal oleh orang banyak itu.
theological_decisions:
- issue: Sifat wewenang Yesus dalam mengajar
  choice: 'Pernyataan diterjemahkan secara deskriptif sebagai perbandingan cara mengajar: "sebagai orang yang memiliki wewenang."'
  alternative: Menjelaskannya secara eksplisit sebagai wewenang ilahi, atau memperlemahnya menjadi sekadar keyakinan dan kekuatan retoris.
  rationale: Ayat ini menyatakan bahwa wewenang Yesus nyata dan membedakan pengajaran-Nya dari pengajaran para ahli Taurat, tetapi tidak menjelaskan secara langsung dasar teologis wewenang tersebut. Terjemahan mempertahankan klaim dan ketegangan teks tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Ahli-ahli Taurat" dipilih karena lebih mudah dipahami daripada "para ahli kitab" dan merupakan istilah yang mapan dalam konteks Perjanjian Baru. Kapitalisasi pronomina "Ia" mengikuti kebiasaan religius Indonesia tanpa memperluas isi ayat.
