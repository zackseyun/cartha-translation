id: MAT.7.12
reference: Matthew 7:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: id
  text: Karena itu, dalam segala hal, apa pun yang kamu kehendaki supaya orang lain[a] lakukan kepadamu, lakukanlah demikian juga kepada mereka, sebab inilah Hukum Taurat dan Para Nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang” atau “manusia”; istilah Yunani di sini digunakan secara umum untuk manusia, bukan hanya laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: dalam segala hal
  rationale: Bersama ὅσα, bentuk ini menyatakan cakupan yang menyeluruh. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keluasan prinsip tersebut.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari ajaran sebelumnya dan mempertahankan hubungan logisnya secara jelas.
- source_word: ὅσα ἐὰν θέλητε
  choice: apa pun yang kamu kehendaki
  rationale: Konstruksi relatif dengan ἐὰν menyatakan hal yang tidak dibatasi atau digeneralisasi. Pilihan ini alami, bermartabat, dan tetap mencerminkan makna kehendak.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: supaya orang lain lakukan kepadamu
  rationale: ἵνα dengan bentuk subjungtif sesudah θέλητε menyatakan tindakan yang dikehendaki. 'Orang lain' menyampaikan pemakaian ἄνθρωποι secara generik dan menghasilkan susunan Indonesia yang wajar.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: lakukanlah demikian juga kepada mereka
  rationale: ποιεῖτε adalah imperatif kini yang menyerukan pola perilaku. Terjemahan ini mempertahankan kesejajaran dan daya timbal balik οὕτως καὶ tanpa mempersempit jenis tindakannya.
- source_word: οὗτος γάρ ἐστιν
  choice: sebab inilah
  rationale: Menerjemahkan klausa ekuatif dan fungsi penjelas γάρ secara ringkas dan alami.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Hukum Taurat dan Para Nabi
  rationale: Mempertahankan rumusan Yahudi/Matius yang merangkum kesaksian Kitab Suci tanpa mengubahnya menjadi parafrasa teologis. Kapitalisasi menandai penggunaan sebagai sebutan yang dikenal.
theological_decisions:
- issue: Cakupan οἱ ἄνθρωποι yang berbentuk maskulin gramatikal
  choice: orang lain
  alternative: laki-laki; manusia
  rationale: Dalam konteks ini istilah tersebut bersifat generik dan merujuk kepada sesama manusia, bukan khusus kepada laki-laki. 'Orang lain' mempertahankan cakupan universal sekaligus terdengar alami dalam kalimat Indonesia.
- issue: Cakupan rumusan 'Hukum Taurat dan Para Nabi'
  choice: Mempertahankannya sebagai rumusan ringkas bagi kesaksian Kitab Suci
  alternative: seluruh ajaran etis Kitab Suci; inti Taurat dan ajaran para nabi
  rationale: Teks Yunani memakai rumusan yang mapan. Mempertahankan bentuknya menjaga gema antarteks dan ketegangan teologis tanpa memasukkan penjelasan tafsir ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Sapaan jamak Yunani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat berfungsi tanpa membedakan jumlah; imperatif 'lakukanlah' mempertahankan daya perintah. Rumusan 'Hukum Taurat dan Para Nabi' dipertahankan tanpa parafrasa.
source_grounding:
  english_pob_role: consult_only
