  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: id
  text: Dan setiap orang yang mendengar perkataan-Ku ini dan tidak melakukannya akan seperti seorang laki-laki bodoh[a] yang membangun rumahnya di atas pasir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang yang bodoh.” Teks Yunani secara harfiah menyebut “seorang laki-laki bodoh,” dengan bahasa maskulin yang mewakili siapa pun dalam perbandingan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: setiap orang yang mendengar
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan bersifat umum. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan universalnya.
- source_word: μου τοὺς λόγους τούτους
  choice: perkataan-Ku ini
  rationale: Mempertahankan penekanan demonstratif dan hubungan kepemilikan. 'Perkataan' sesuai dengan λόγοι dalam konteks ajaran Yesus.
- source_word: μὴ ποιῶν αὐτούς
  choice: tidak melakukannya
  rationale: ποιέω di sini berarti melakukan atau menjalankan apa yang didengar. Bentuk ini cukup dekat dengan bahasa sumber dan alami dalam bahasa Indonesia.
- source_word: ὁμοιωθήσεται
  choice: akan menjadi seperti
  rationale: Bentuk pasif masa depan menyatakan perbandingan. 'Akan menjadi seperti' menyampaikan gambaran tersebut dengan lancar tanpa pasif yang kaku.
- source_word: ἀνδρὶ μωρῷ
  choice: seorang laki-laki bodoh
  rationale: ἀνήρ secara khusus menunjuk kepada seorang laki-laki, sedangkan μωρός berarti bodoh atau tidak bijaksana. Terjemahan ini mempertahankan bentuk maskulin dalam perumpamaan.
- source_word: ὅστις
  choice: yang
  rationale: Pronomina relatif ini memperkenalkan tindakan tokoh dalam perbandingan; 'yang' merupakan padanan Indonesia yang alami.
- source_word: ᾠκοδόμησεν
  choice: membangun
  rationale: Verba aoris ini secara langsung berarti membangun. Bahasa Indonesia tidak menandai aspek aoris secara morfologis.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: rumahnya
  rationale: οἰκία menunjuk kepada bangunan rumah dalam gambaran ini, dan pronomina kepemilikannya tersampaikan secara alami melalui sufiks '-nya'.
- source_word: ἐπὶ τὴν ἄμμον
  choice: di atas pasir
  rationale: ἐπί dengan akusatif dalam gambaran ini menunjukkan tempat atau landasan bangunan. 'Di atas pasir' jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa maskulin yang berfungsi sebagai wakil dalam perbandingan
  choice: seorang laki-laki bodoh
  alternative: seorang yang bodoh
  rationale: Bahasa Yunani memakai ἀνήρ, nomina maskulin tunggal yang secara khusus berarti laki-laki, dalam perbandingan yang penerapannya bersifat umum. Teks utama mempertahankan bentuk maskulin sumber, sedangkan catatan menjelaskan daya jangkau perbandingannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dibuat mudah dipahami pembaca umum, sambil mempertahankan hubungan erat antara mendengar dan melakukan serta gambaran membangun di atas pasir.
