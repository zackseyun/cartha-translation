id: MAT.7.9
reference: Matthew 7:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: id
  text: Atau, adakah orang[a] di antara kamu yang, jika putranya meminta roti kepadanya, akan memberinya batu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “manusia”; di sini dipakai dalam arti representatif untuk seseorang di antara para pendengar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Menghubungkan pertanyaan retoris ini dengan pernyataan sebelumnya dan mempertahankan alur argumentasi.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: adakah orang di antara kamu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pertanyaan tentang seseorang dari antara para pendengar; ἄνθρωπος di sini dipakai secara representatif.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: yang, jika putranya meminta roti kepadanya
  rationale: Susunan bersyarat menghasilkan bahasa Indonesia yang wajar bagi situasi umum dalam pertanyaan retoris, sambil mempertahankan putra, permintaan, roti, dan penerima permintaan.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: putranya
  rationale: Mempertahankan makna laki-laki dari υἱός dan hubungan kepemilikan tanpa memperluasnya menjadi anak secara umum.
- source_word: ἄρτον
  choice: roti
  rationale: Padanan langsung dan sesuai konteks; 'makanan' terlalu luas, sedangkan 'sepotong roti' lebih khusus daripada teks Yunani.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: akan memberinya batu?
  rationale: μή menandai pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk pertanyaan bahasa Indonesia menyampaikan harapan itu secara alami tanpa menambahkan kata 'tidak' ke dalam proposisi.
theological_decisions:
- issue: Bahasa manusia yang representatif
  choice: orang
  alternative: laki-laki
  rationale: ἄνθρωπος menunjuk manusia atau orang dan di sini bersifat representatif; bahasa Indonesia 'orang' adalah padanan alami tanpa menghapus jenis kelamin yang secara khusus dinyatakan oleh υἱός, yang diterjemahkan 'putra'.
- issue: Daya pertanyaan retoris dengan μή
  choice: akan memberinya batu?
  alternative: tidak mungkin akan memberinya batu, bukan?
  rationale: Pertanyaan langsung mempertahankan ketegangan retoris dan jawaban negatif yang diharapkan tanpa memperkuat teks dengan ungkapan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Putra' dipilih untuk mempertahankan kekhususan υἱός, sedangkan susunan 'jika ... meminta' membuat hubungan klausa Yunani alami dalam bahasa Indonesia.
