  source_fidelity: 'Teks secara tepat menyampaikan pertanyaan retoris Yunani: seseorang di antara para pendengar, putranya yang meminta roti, dan kontras yang tidak masuk akal berupa pemberian batu. Susunan bersyarat “jika putranya meminta” adalah penataan ulang yang wajar dalam bahasa Indonesia bagi konstruksi relatif Yunani. Pertanyaan tanpa penyangkalan eksplisit tetap menyampaikan daya retoris μή, yang mengharapkan jawaban negatif.'
  naturalness: “Atau, adakah orang di antara kamu yang, jika putranya meminta roti kepadanya, akan memberinya batu?” merupakan bahasa Indonesia baku, jelas, dan lancar. “Putranya” secara alami mempertahankan rujukan kepada anak laki-laki.
