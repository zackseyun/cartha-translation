id: MAT.7.3
reference: Matthew 7:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: id
  text: Namun, mengapa kamu melihat serpihan kecil di mata saudaramu, tetapi tidak memperhatikan balok di matamu sendiri?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: mengapa
  rationale: Dalam pertanyaan retoris dengan βλέπεις, τί berfungsi secara idiomatis sebagai ‘mengapa’, bukan ‘apa’.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa pertentangan ringan terhadap ajaran sebelumnya.
- source_word: βλέπεις
  choice: melihat
  rationale: Mempertahankan gambaran konkret dan membedakannya dari κατανοεῖς.
- source_word: κάρφος
  choice: serpihan kecil
  rationale: Menggambarkan partikel kecil dan kering yang mungkin berupa serpihan kayu, jerami, atau sekam, tanpa terlalu menentukan bahannya.
- source_word: ἀδελφοῦ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan tunggal maskulin dalam sumber; dalam bahasa Indonesia ‘saudara’ juga wajar dalam sapaan relasional.
- source_word: τῷ σῷ ὀφθαλμῷ
  choice: di matamu sendiri
  rationale: Kata ‘sendiri’ menyampaikan penekanan posesif dan kontras dengan mata saudara.
- source_word: δοκόν
  choice: balok
  rationale: δοκός adalah balok kayu besar, sehingga mempertahankan kontras hiperbolis dengan serpihan kecil.
- source_word: οὐ κατανοεῖς
  choice: tidak memperhatikan
  rationale: κατανοέω berarti mencermati, menyadari, atau memperhatikan; pilihan ini mempertahankan pembedaan retoris dari ‘melihat’.
- source_word: ὀφθαλμῷ
  choice: mata
  rationale: Padanan baku dan alami bagi ὀφθαλμός dalam gambaran ini.
theological_decisions:
- issue: Istilah kekerabatan ἀδελφοῦ yang bergender
  choice: saudaramu
  alternative: sesamamu
  rationale: ‘Saudaramu’ lebih dekat dengan istilah kekerabatan sumber dan tidak menetralkannya menjadi istilah yang lebih luas, meskipun penerapan perkataan ini tidak harus dibatasi pada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pertanyaan retoris serta kontras antara kekurangan kecil orang lain dan kekurangan besar diri sendiri dipertahankan.
source_grounding:
  english_pob_role: consult_only
