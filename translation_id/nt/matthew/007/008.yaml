id: MAT.7.8
reference: Matthew 7:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: id
  text: Sebab setiap orang yang meminta menerima, orang yang mencari menemukan, dan bagi orang yang mengetuk akan dibukakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani tidak menyebutkan “pintu” secara eksplisit; hal itu tersirat dari gambaran orang yang mengetuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: setiap orang
  rationale: Dipakai secara substantival bersama partisipel untuk menyatakan kelompok secara umum; pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan universal.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan dorongan pada ayat sebelumnya.
- source_word: ὁ αἰτῶν
  choice: orang yang meminta
  rationale: Mencerminkan konstruksi artikel dan partisipel substantival serta makna umum atau berulang dari bentuk kini.
- source_word: λαμβάνει
  choice: menerima
  rationale: Padanan langsung dan wajar yang mempertahankan kesejajaran ungkapan.
- source_word: ὁ ζητῶν
  choice: orang yang mencari
  rationale: Mempertahankan susunan paralel artikel-partisipel dalam bahasa Indonesia yang alami.
- source_word: εὑρίσκει
  choice: menemukan
  rationale: Padanan sederhana dan tepat yang menjaga irama serta hubungan langsung antara mencari dan menemukan.
- source_word: τῷ κρούοντι
  choice: bagi orang yang mengetuk
  rationale: Mewakili datif penerima secara alami dan mempersiapkan klausa pasif berikutnya.
- source_word: ἀνοιγήσεται
  choice: akan dibukakan
  rationale: Mempertahankan bentuk pasif futurum dan tidak menambahkan subjek tersurat seperti 'pintu', yang hanya tersirat oleh gambaran mengetuk.
theological_decisions:
- issue: Cakupan dan daya janji
  choice: Pernyataan jaminan umum dengan cakupan universal sebagaimana tertulis, tanpa menambahkan pembatasan atau jaminan bahwa setiap permintaan tertentu dikabulkan persis seperti diminta.
  alternative: Menjadikannya janji mutlak bahwa setiap permintaan spesifik dikabulkan tepat seperti diminta, atau membatasinya dalam terjemahan hanya pada permintaan rohani tertentu.
  rationale: Bahasa Yunani memakai ungkapan universal. Terjemahan mempertahankan keluasan dan ketegangan penafsirannya tanpa memasukkan penyelesaian teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas, bermartabat, dan mudah diingat. Kesejajaran tiga klausa dipertahankan; bentuk “akan dibukakan” menjaga subjek tetap tidak disebutkan seperti dalam bahasa Yunani.
