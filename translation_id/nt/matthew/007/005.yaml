id: MAT.7.5
reference: Matthew 7:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: id
  text: Hai orang munafik, keluarkanlah dahulu balok[a] dari matamu. Barulah engkau akan melihat dengan jelas untuk mengeluarkan serpihan[b] dari mata saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu gelondongan” atau “papan besar” untuk δοκός.
    reason: lexical_alternative
  - marker: b
    text: Atau “selumbar” atau “potongan jerami” untuk κάρφος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Hai orang munafik
  rationale: Bentuk vokatif tunggal ini merupakan sapaan teguran langsung. Partikel “hai” menandai sapaan secara alami dalam bahasa Indonesia dan mempertahankan ketajaman tegurannya.
- source_word: ἔκβαλε
  choice: keluarkanlah
  rationale: Imperatif aoris dari ἐκβάλλω. “Keluarkanlah” sesuai dengan gambaran mengambil benda asing dari mata dan mempertahankan daya perintahnya.
- source_word: πρῶτον
  choice: dahulu
  rationale: Menandai urutan dan prioritas tindakan; “dahulu” alami setelah verba imperatif dalam bahasa Indonesia.
- source_word: δοκόν
  choice: balok
  rationale: δοκός menunjuk pada balok kayu besar, sehingga “balok” mempertahankan gambaran struktural dan kontras hiperbolis dengan κάρφος yang kecil.
- source_word: ὀφθαλμοῦ
  choice: mata
  rationale: Padanan langsung dan lazim bagi ὀφθαλμός dalam metafora jasmani ini.
- source_word: διαβλέψεις
  choice: engkau akan melihat dengan jelas
  rationale: διαβλέπω menyatakan melihat dengan jelas; bentuk futur diterjemahkan secara eksplisit tanpa menghilangkan nuansa intensif verba tersebut.
- source_word: ἐκβαλεῖν
  choice: untuk mengeluarkan
  rationale: Infinitif ini berkaitan dengan kemampuan melihat dengan jelas. Pengulangan “mengeluarkan” menjaga hubungan leksikal dengan imperatif ἔκβαλε.
- source_word: κάρφος
  choice: serpihan
  rationale: κάρφος dapat menunjuk pada partikel kecil kering, selumbar, atau potongan jerami. “Serpihan” mempertahankan sifat bendawi dan kontras ukurannya dengan balok.
- source_word: ἀδελφοῦ
  choice: saudaramu
  rationale: ἀδελφός berbentuk maskulin tunggal dan secara harfiah berarti saudara laki-laki; “saudaramu” mempertahankan istilah relasional dalam komunitas tanpa menggantinya dengan sebutan umum.
theological_decisions:
- issue: Istilah relasional bergender ἀδελφοῦ
  choice: saudaramu
  alternative: mata orang lain / mata sesamamu
  rationale: Teks Yunani memakai bentuk maskulin tunggal yang secara harfiah berarti “saudara.” Pilihan ini mempertahankan bahasa relasional dalam wacana tentang penghakiman di antara anggota komunitas dan tidak menetralkannya tanpa tuntutan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas namun wajar. “Engkau” dipakai untuk mempertahankan sapaan tunggal dan gaya wacana langsung yang bermartabat. Tanda catatan kaki ditempatkan pada istilah yang diterangkannya, bukan mengikuti penempatan penanda yang tampak tertukar dalam lapisan konsultasi bahasa Inggris.
