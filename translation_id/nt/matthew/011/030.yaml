  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: id
  text: Sebab kuk-Ku itu baik dan beban-Ku ringan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: kuk
  rationale: Padanan konkret dan lazim untuk alat pemikul yang juga mempertahankan metafora tentang ketundukan kepada pengajaran dan tuntunan Yesus.
- source_word: χρηστός
  choice: baik
  rationale: Kata ini dapat berarti baik, ramah, menyenangkan, atau mudah digunakan. 'Baik' mempertahankan nuansa sifat kuk tersebut tanpa menyempitkannya hanya menjadi 'mudah'.
- source_word: φορτίον
  choice: beban
  rationale: Padanan langsung dan alami yang mempertahankan kesejajaran dengan 'kuk'.
- source_word: ἐλαφρόν
  choice: ringan
  rationale: Padanan langsung yang menyampaikan kontras dengan beban yang berat.
theological_decisions:
- issue: Makna metaforis 'kuk-Ku'
  choice: kuk yang Kupasang
  alternative: kuk-Ku
  rationale: Ungkapan ini memperjelas secara alami bahwa Yesuslah yang memasang atau memberikan kuk tersebut, tanpa menjelaskan metaforanya secara doktrinal atau menghapus citra aslinya.
- issue: Nuansa χρηστός
  choice: baik
  alternative: mudah / nyaman
  rationale: '''Baik'' menjaga keluasan makna leksikal dan selaras dengan sifat penuh kebaikan dari kuk itu, sedangkan ''mudah'' berisiko dipahami sebagai janji bahwa pemuridan tidak menuntut pengorbanan.'
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia.
