  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: id
  text: Orang yang mempunyai telinga[a], hendaklah ia mendengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang mempunyai telinga, hendaklah mendengar.” Bahasa Yunani memakai ungkapan tunggal yang bermakna umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Orang yang mempunyai
  rationale: Artikel dengan partisipel kini berfungsi secara substantival dan menunjuk secara umum kepada siapa pun yang memiliki ciri tersebut. Ungkapan ini mempertahankan bentuk tunggal representatif tanpa membatasi maknanya pada orang tertentu.
- source_word: ὦτα
  choice: telinga
  rationale: Bentuk Yunani ini jamak, tetapi bahasa Indonesia lazim memakai nomina tanpa penanda jamak ketika makna jamaknya sudah jelas. Pengulangan “telinga-telinga” tidak alami, sedangkan “telinga” tetap menyampaikan seruan idiomatis untuk menangkap dan memperhatikan.
- source_word: ἀκουέτω
  choice: hendaklah ia mendengar
  rationale: Imperatif orang ketiga kini diterjemahkan dengan “hendaklah,” yang mempertahankan daya perintah. “Mendengar” menjaga keluasan ungkapan Yunani, termasuk nuansa memperhatikan dan mengindahkan, tanpa mempersempitnya menjadi sekadar “menyimak.”
theological_decisions:
- issue: Ungkapan maskulin tunggal yang bermakna umum
  choice: Orang yang mempunyai telinga, hendaklah ia mendengar.
  alternative: Siapa yang mempunyai telinga, hendaklah mendengar.
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada “orang” atau “ia.” Bentuk tunggal “orang ... ia” mempertahankan struktur tunggal representatif teks Yunani sekaligus tetap berlaku umum dan tidak memasukkan pembatasan gender yang tidak dinyatakan secara leksikal dalam bahasa sasaran.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. “Hendaklah” dipilih sebagai bentuk imperatif orang ketiga yang lazim dalam teks Alkitab dan masih mudah dipahami; “ia” menjaga acuan tunggal tanpa menandai gender.
