  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: id
  text: Dialah yang tentangnya tertulis, “Lihatlah, Aku mengutus utusan-Ku di depan wajah-Mu[a], yang akan menyiapkan jalan-Mu di hadapan-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih idiomatis: “di hadapan-Mu” atau “di depan-Mu.” Teks Yunani mempertahankan ungkapan konkret “di depan wajah-Mu” dari kutipan Kitab Suci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Dialah
  rationale: Bentuk ini mempertahankan penegasan identifikasi dalam kata tunjuk Yunani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: περὶ οὗ
  choice: yang tentangnya
  rationale: περί dengan bentuk genitif berarti ‘tentang/mengenai’; susunan ini mempertahankan hubungan langsung dengan orang yang sedang diidentifikasi.
- source_word: γέγραπται
  choice: tertulis
  rationale: Bentuk pasif perfek ini merupakan rumusan pengutipan Kitab Suci. ‘Tertulis’ alami dalam bahasa Indonesia dan menyampaikan hasil yang tetap berlaku.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian dalam kutipan kenabian. ‘Lihatlah’ mempertahankan nada yang khidmat tanpa menjadi usang.
- source_word: ἀποστέλλω
  choice: Aku mengutus
  rationale: Kala kini Yunani dalam nubuat memiliki daya yang hidup dan dapat menunjuk tindakan yang akan segera terjadi. Bahasa Indonesia tidak wajib menandai aspek progresif, sehingga ‘mengutus’ mempertahankan keluwesan itu.
- source_word: ἄγγελόν
  choice: utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang pembawa pesan manusia, yakni Yohanes, bukan harus kepada makhluk surgawi.
- source_word: πρὸ προσώπου σου
  choice: di depan wajah-Mu
  rationale: Terjemahan ini mempertahankan ungkapan konkret ‘di depan wajahmu’ dari kutipan Kitab Suci, walaupun bentuk yang lebih idiomatis tersedia dalam bahasa Indonesia.
- source_word: κατασκευάσει
  choice: akan menyiapkan
  rationale: Bentuk mendatang ini berarti membuat siap atau mempersiapkan. ‘Akan menyiapkan’ ringkas dan sesuai dengan gambaran jalan.
- source_word: τὴν ὁδόν σου
  choice: jalan-Mu
  rationale: ‘Jalan’ mempertahankan baik gambaran harfiah maupun kemungkinan makna kiasannya.
- source_word: ἔμπροσθέν σου
  choice: di hadapan-Mu
  rationale: Ungkapan ini berarti ‘di depan/di hadapan-Mu’. Pilihan tersebut alami dan membedakannya dari ungkapan konkret πρὸ προσώπου σου sebelumnya.
theological_decisions:
- issue: Dua frasa tempat yang hampir sejajar dalam kutipan Kitab Suci
  choice: Keduanya dipertahankan sebagai ‘di depan wajah-Mu’ dan ‘di hadapan-Mu’.
  alternative: Melebur atau menyeragamkan keduanya menjadi ‘di depan-Mu’ atau ‘mendahului-Mu’.
  rationale: Teks Yunani memuat baik πρὸ προσώπου σου maupun ἔμπροσθέν σου. Mempertahankan keduanya menjaga bentuk dan penekanan kutipan tanpa menghapus pengulangannya demi kelancaran gaya.
translation_notes:
  register: Bahasa modern, khidmat, dan mudah dipahami. Kapitalisasi pada kata ganti yang merujuk kepada Allah atau Mesias mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Ungkapan ‘di depan wajah-Mu’ sengaja sedikit lebih formal untuk mempertahankan bentuk konkret kutipan sumber.
