id: MAT.11.26
reference: Matthew 11:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: id
  text: Ya, Bapa, karena demikianlah yang berkenan di hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab itulah yang menjadi kesenangan-Mu” atau “sebab demikianlah yang berkenan di hadapan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ya
  rationale: Ungkapan persetujuan yang langsung dan alami dalam konteks doa.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Bentuk nominatif yang berfungsi sebagai sapaan; 'Bapa' merupakan sapaan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: 'Menampilkan hubungan kausal: pernyataan ini memberi dasar bagi persetujuan yang baru diucapkan.'
- source_word: οὕτως
  choice: demikianlah
  rationale: Menunjuk kembali kepada cara Bapa menyembunyikan dan menyatakan yang disebut dalam ayat sebelumnya.
- source_word: εὐδοκία ἐγένετο
  choice: yang berkenan
  rationale: Menyampaikan bahwa hal tersebut menyenangkan atau mendapat perkenanan tanpa mempersempit maknanya menjadi ketetapan atau tujuan ilahi.
- source_word: ἔμπροσθέν σου
  choice: di hadapan-Mu
  rationale: Padanan alami bagi ungkapan harfiah 'di depan-Mu', dengan nuansa penilaian atau pandangan pribadi Bapa.
theological_decisions:
- issue: Apakah εὐδοκία menyiratkan ketetapan/tujuan ilahi atau kesenangan/perkenanan ilahi
  choice: yang berkenan di hadapan-Mu
  alternative: sesuai dengan kehendak-Mu yang baik; merupakan kesenangan-Mu
  rationale: Pilihan ini mempertahankan penekanan pada perkenanan Bapa dan tidak memasukkan nuansa ketetapan yang lebih kuat daripada yang dituntut oleh susunan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada akhiran pronomina '-Mu' mengikuti kebiasaan penulisan rujukan kepada Allah. Susunan 'demikianlah yang berkenan' mempertahankan rujukan οὕτως kepada tindakan Bapa dalam konteks sebelumnya.
