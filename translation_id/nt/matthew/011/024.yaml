base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: id
  text: 'Namun, Aku berkata kepadamu: pada hari penghakiman, penghakiman itu akan lebih dapat ditanggung[a] bagi negeri Sodom daripada bagimu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lebih ringan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Di sini πλὴν menandai pertentangan tegas sekaligus peralihan menuju pernyataan penghakiman; “Namun” alami dan bermartabat dalam bahasa Indonesia.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan formula ujaran langsung dan pronomina orang kedua tunggal yang mengacu pada kota yang disapa secara personifikasi dalam konteks.
- source_word: γῇ Σοδόμων
  choice: negeri Sodom
  rationale: Menerjemahkan γῇ secara eksplisit sebagai wilayah atau negeri yang berkaitan dengan Sodom, bukan menghilangkannya menjadi nama kota saja.
- source_word: ἀνεκτότερον ἔσται
  choice: hukuman atas ... akan lebih ringan
  rationale: Secara harfiah berarti keadaan itu akan lebih dapat ditanggung. Dalam konstruksi Indonesia, penambahan tersirat “hukuman atas” menjelaskan hal yang dibandingkan tanpa mengubah arah makna dalam konteks hari penghakiman.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: pada hari penghakiman
  rationale: Padanan waktu yang alami dan tetap dekat dengan konstruksi Yunani serta nuansa eskatologisnya.
- source_word: ἢ σοί
  choice: daripada hukuman atasmu
  rationale: Mempertahankan sapaan orang kedua tunggal kepada kota yang dipersonifikasikan; pengulangan “hukuman atas” membuat perbandingan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan pronomina tunggal σοί
  choice: Mempertahankan bentuk tunggal “kepadamu/atasmu” sebagai sapaan langsung kepada kota yang dipersonifikasikan.
  alternative: Memperluasnya menjadi “kalian” atau “pendudukmu”.
  rationale: Teks Yunani memakai bentuk tunggal dan meneruskan gaya nubuat yang menyapa sebuah kota. Terjemahan tidak mengubahnya menjadi kelompok jamak.
- issue: Hal yang dibandingkan oleh ἀνεκτότερον
  choice: Menyatakan secara eksplisit “hukuman atas” sebagai unsur yang tersirat oleh konteks hari penghakiman.
  alternative: “Keadaan negeri Sodom akan lebih dapat ditanggung baginya daripada bagimu.”
  rationale: Bahasa Yunani membiarkan hal yang lebih dapat ditanggung tetap implisit. Dalam bahasa Indonesia, ungkapan “hukuman ... lebih ringan” menyampaikan relasi perbandingan secara wajar, sedangkan catatan kaki mempertahankan padanan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi “Aku” mengikuti sapaan diri Yesus dalam tradisi penerjemahan Indonesia. Struktur mempertahankan sapaan tunggal kepada kota, sementara ungkapan idiomatis “hukuman ... lebih ringan” dipakai agar perbandingan alami bagi pembaca umum.
