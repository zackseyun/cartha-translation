source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: id
  text: Namun, sejak zaman Yohanes Pembaptis sampai sekarang, Kerajaan Surga mengalami kekerasan, dan orang-orang yang memakai kekerasan merebutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kerajaan Surga bergerak maju dengan penuh kekuatan, dan orang-orang yang penuh kekuatan merebutnya.” Kata kerja Yunani yang diterjemahkan “mengalami kekerasan” juga dapat dipahami dalam arti medial.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Namun, sejak
  rationale: ἀπό menandai titik awal, sedangkan δέ merupakan penghubung ringan yang mengalihkan alur. 'Namun, sejak' alami dalam bahasa Indonesia tanpa memberi pertentangan yang terlalu kuat.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: zaman Yohanes Pembaptis
  rationale: '''Zaman'' menyampaikan idiom temporal Yunani secara wajar dan bermartabat; terjemahan harfiah ''hari-hari Yohanes'' terasa kurang alami dalam bahasa Indonesia modern.'
- source_word: ἕως ἄρτι
  choice: sampai sekarang
  rationale: Ungkapan Indonesia yang lazim dan tepat untuk rentang waktu yang berlanjut hingga saat Yesus berbicara.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan Surga
  rationale: Padanan baku dan alami bagi ungkapan khas Matius, yang dapat menunjuk pada kerajaan maupun pemerintahan yang berasal dari surga. Huruf kapital dipakai sebagai sebutan konseptual yang mapan.
- source_word: βιάζεται
  choice: mengalami kekerasan
  rationale: Bentuk ini dapat dipahami secara pasif ('mengalami kekerasan') atau secara medial/intransitif ('bergerak maju dengan penuh kekuatan'). Bacaan pasif dipilih dalam teks utama karena selaras dengan klausa berikutnya, sedangkan ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: βιασταὶ
  choice: orang-orang yang memakai kekerasan
  rationale: Mengungkapkan pelaku yang bertindak dengan kekuatan atau kekerasan tanpa menyiratkan bahwa kelompok itu semata-mata berjenis kelamin laki-laki; bentuk maskulin jamak Yunani dapat berfungsi generik. Frasa ini juga menjaga kaitan leksikal dengan 'kekerasan' pada klausa sebelumnya.
- source_word: ἁρπάζουσιν αὐτήν
  choice: merebutnya
  rationale: '''Merebut'' menyampaikan tindakan mengambil dengan paksa secara ringkas dan alami, serta mempertahankan daya keras ἁρπάζω.'
theological_decisions:
- issue: Makna βιάζεται dalam hubungannya dengan Kerajaan Surga
  choice: 'Bacaan pasif dalam teks utama: ''Kerajaan Surga mengalami kekerasan'''
  alternative: 'Bacaan medial/intransitif: ''Kerajaan Surga bergerak maju dengan penuh kekuatan'''
  rationale: Bahasa Yunani sungguh ambigu. Bacaan pasif berhubungan erat dengan penyebutan orang-orang yang memakai kekerasan dan tindakan merebut, tetapi bacaan medial/intransitif juga mungkin secara tata bahasa dan leksikal. Karena itu, teks utama memilih satu bacaan yang dapat dipertanggungjawabkan dan catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat cukup dekat dengan sumber Yunani, tetapi idiom 'hari-hari Yohanes' dinaturalkan menjadi 'zaman Yohanes'. Ambiguitas utama pada βιάζεται tidak dihapus, melainkan disajikan melalui catatan kaki.
