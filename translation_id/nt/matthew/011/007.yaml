  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: id
  text: Sementara murid-murid Yohanes itu sedang pergi, Yesus mulai berbicara kepada orang banyak tentang Yohanes, “Untuk melihat apa kalian pergi ke padang belantara? Sebatang buluh yang digoyangkan angin?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran buluh yang digoyangkan angin dapat menyiratkan ketidakstabilan atau sikap mudah berubah. Pertanyaan Yesus mengharapkan jawaban “tidak” mengenai Yohanes.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Ketika murid-murid Yohanes itu pergi
  rationale: Genitivus absolutus menyatakan tindakan yang berlangsung bersamaan. Berdasarkan konteks langsung (Mat. 11:2–6), kata ganti ini merujuk kepada murid-murid Yohanes; penyebutan eksplisit membuat bahasa Indonesia alami tanpa mengubah alur.
- source_word: ἤρξατο ... λέγειν
  choice: mulai berbicara
  rationale: Konstruksi ἄρχομαι dengan infinitif berarti mulai melakukan sesuatu; 'mulai berbicara' wajar untuk ujaran yang ditujukan kepada orang banyak.
- source_word: τοῖς ὄχλοις
  choice: kepada orang banyak
  rationale: Walaupun bentuk Yunaninya jamak, 'orang banyak' merupakan ungkapan kolektif yang alami dalam bahasa Indonesia dan tidak menyiratkan hanya satu individu atau kelompok kecil.
- source_word: περὶ Ἰωάννου
  choice: tentang Yohanes
  rationale: περί dengan genitif menandai topik pembicaraan; 'tentang' adalah padanan modern yang langsung.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Apa yang hendak kalian lihat ketika pergi ke padang belantara?
  rationale: τί dipertahankan sebagai pertanyaan 'apa', bukan 'mengapa'. θεάομαι menyatakan melihat atau mengamati, dan konstruksi infinitif tujuan diungkapkan secara alami dengan 'hendak ... lihat'. 'Padang belantara' cocok untuk wilayah tandus yang tidak dihuni tanpa menyiratkan hutan.
- source_word: κάλαμον
  choice: sebatang buluh
  rationale: κάλαμος berarti buluh atau gelagah; 'sebatang buluh' mempertahankan citra tunggal dan terdengar alami.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: yang digoyangkan angin
  rationale: Partisip pasif yang menerangkan buluh dipertahankan dengan klausa relatif pasif; agen ὑπὸ ἀνέμου diterjemahkan ringkas sebagai 'angin'.
theological_decisions:
- issue: Rujukan Τούτων ('mereka/orang-orang ini')
  choice: murid-murid Yohanes itu
  alternative: mereka itu
  rationale: Konteks langsung mengidentifikasi orang-orang yang sedang pergi sebagai murid-murid Yohanes. Eksplisitasi ini bersifat naratif, bukan penambahan doktrinal.
- issue: Makna retoris buluh yang digoyangkan angin
  choice: Citra dipertahankan dalam teks tanpa menambahkan tafsiran
  alternative: Menjelaskannya dalam teks sebagai lambang orang yang tidak teguh
  rationale: Pertanyaan retoris kemungkinan menyiratkan ketidakstabilan atau sikap mudah berubah dan mengharapkan jawaban negatif mengenai Yohanes, tetapi teks Yunani sendiri membiarkan citra itu berbicara secara tidak langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' memperjelas bentuk orang kedua jamak tanpa menjadi terlalu resmi. Susunan pertanyaan dibuat alami dalam bahasa Indonesia sambil mempertahankan pertanyaan 'apa' dan citra retoris teks Yunani.
