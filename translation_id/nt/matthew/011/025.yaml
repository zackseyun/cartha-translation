  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: id
  text: Pada waktu itu Yesus berkata, “Aku memuji-Mu[a], ya Bapa, Tuhan langit dan bumi, sebab Engkau menyembunyikan hal-hal ini dari orang-orang bijak dan berpengertian, dan mengungkapkannya kepada anak-anak kecil[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku bersyukur kepada-Mu.” Kata Yunani ini dapat menyatakan syukur, pujian, atau pengakuan secara terbuka.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “bayi-bayi.” Di sini sebutan itu kemungkinan dipakai secara kiasan bagi mereka yang bersikap seperti anak kecil dan terbuka menerima.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang wajar dalam bahasa Indonesia dan tetap mempertahankan latar naratif tanpa mempersempitnya menjadi satu momen tertentu.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: berkata
  rationale: Secara harfiah berbentuk ‘menjawab ... berkata’, tetapi dalam konstruksi naratif Yunani ini ἀποκριθείς dapat memperkenalkan tanggapan tanpa adanya pertanyaan eksplisit. ‘Berkata’ terdengar alami dalam bahasa Indonesia dan tidak menimbulkan kesan keliru bahwa ada pertanyaan yang tidak dicatat.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Aku memuji Engkau
  rationale: Dalam sapaan kepada Bapa, verba ini menyatakan pengakuan terbuka yang bernada pujian atau syukur. ‘Memuji’ mempertahankan nada doksologis; kemungkinan ‘bersyukur’ dicatat dalam catatan kaki.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: ya Bapa, Tuhan atas langit dan bumi
  rationale: Rangkaian sapaan dipertahankan. ‘Tuhan atas’ menyatakan kedaulatan yang terkandung dalam κύριε secara jelas dan alami.
- source_word: ὅτι
  choice: sebab
  rationale: Menandai alasan atau dasar pujian Yesus secara alami dalam bahasa Indonesia.
- source_word: ἔκρυψας
  choice: Engkau menyembunyikan
  rationale: Mempertahankan verba aktif dengan Bapa sebagai pelaku, tanpa melunakkannya menjadi tindakan permisif.
- source_word: ταῦτα ... αὐτά
  choice: hal-hal ini ... -nya
  rationale: Menjaga rujukan tetap terbuka sebagaimana teks Yunani; akhiran ‘-nya’ merujuk kembali secara alami kepada ‘hal-hal ini’.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: dari orang-orang bijak dan berpengertian
  rationale: Adjektiva substantival dinyatakan sebagai orang-orang yang memiliki sifat tersebut. ‘Bijak’ dan ‘berpengertian’ menjaga perbedaan nuansa antara σοφός dan συνετός tanpa tafsiran tambahan.
- source_word: καί
  choice: tetapi
  rationale: Walaupun secara leksikal berarti ‘dan’, hubungan antarklausa jelas bersifat kontras; ‘tetapi’ menyampaikan hubungan wacana itu secara alami tanpa mengubah isi proposisional.
- source_word: ἀπεκάλυψας
  choice: mengungkapkannya
  rationale: ‘Mengungkapkan’ menyampaikan tindakan menyingkapkan atau membuat diketahui dan sesuai dengan objek pronominal dalam kalimat Indonesia.
- source_word: νηπίοις
  choice: kepada anak-anak kecil
  rationale: Mempertahankan citra konkret yang dalam konteks kemungkinan bersifat metaforis. Padanan literal alternatif ‘bayi-bayi’ dicatat tanpa menggantinya dengan tafsiran abstrak seperti ‘orang rendah hati’.
theological_decisions:
- issue: Tindakan ilahi dalam menyembunyikan dan mengungkapkan
  choice: 'Mempertahankan atribusi langsung kepada Bapa: ‘Engkau menyembunyikan ... tetapi mengungkapkannya.’'
  alternative: Melunakkan menjadi ‘Engkau membiarkan hal-hal ini tetap tersembunyi.’
  rationale: Teks Yunani memakai verba aktif dengan Bapa sebagai subjek. Terjemahan mempertahankan ketegangan teologis ini tanpa menjelaskannya melalui doktrin predestinasi, penghukuman, atau izin ilahi.
- issue: Makna νηπίοις
  choice: anak-anak kecil
  alternative: bayi-bayi; orang-orang rendah hati
  rationale: ‘Anak-anak kecil’ mempertahankan metafora dan kontrasnya dengan orang bijak dan berpengertian. Terjemahan tidak mereduksinya menjadi kategori teologis abstrak, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan bermartabat. Kapitalisasi kata ganti yang mengacu kepada Allah dipakai menurut kebiasaan luas penerbitan Alkitab Indonesia. Bentuk ‘kepada-Mu’ hanya muncul dalam catatan kaki; teks utama memakai ‘Engkau’ agar sapaan langsung tetap jelas.
