    rationale: “Seperti anak kecil dalam menerima penyataan” tidak lazim dan “penyataan” bukan padanan terbaik bagi konsep penerimaan yang dimaksud. Redaksi yang menyebut sikap terbuka menerima lebih jelas tanpa mengunci metafora pada tafsiran doktrinal.
