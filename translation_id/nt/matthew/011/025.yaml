  naturalness: Teks umumnya baku, jelas, dan bernada hormat. “Aku memuji Engkau” dapat dipahami, tetapi “Aku memuji-Mu” lebih alami dalam prosa Indonesia modern sambil mempertahankan sapaan langsung kepada Bapa.
  terminology: “Bapa,” “Tuhan,” “menyembunyikan,” dan “mengungkapkan” cocok. “Anak-anak kecil” mempertahankan metafora νηπίοις tanpa menafsirkannya menjadi “orang rendah hati.” Catatan b sebaiknya menghindari frasa “menerima penyataan,” yang kurang alami dan kurang tepat untuk maksud metaforisnya.
