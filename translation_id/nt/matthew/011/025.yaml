  - severity: low
    issue: “Tuhan atas langit dan bumi”
    rationale: Frasa genitif τοῦ οὐρανοῦ καὶ τῆς γῆς paling langsung dan idiomatis diterjemahkan “Tuhan langit dan bumi.” Bentuk dengan “atas” memperjelas kedaulatan, tetapi menambah nuansa relasional yang tidak perlu.
  - severity: low
