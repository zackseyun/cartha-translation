id: MAT.11.21
reference: Matthew 11:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: id
  text: “Celakalah engkau, Korazim! Celakalah engkau, Betsaida! Sebab, seandainya perbuatan-perbuatan penuh kuasa[a] yang telah terjadi di antara kalian itu terjadi di Tirus dan Sidon, tentu mereka sudah lama bertobat dengan kain kabung dan abu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “mukjizat-mukjizat”; Yunani: “perbuatan-perbuatan kuasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Celakalah engkau
  rationale: Ungkapan ini mempertahankan daya kecaman kenabian sekaligus nuansa dukacita dan ancaman penghukuman; bentuk tunggal sesuai dengan sapaan kepada masing-masing kota.
- source_word: Χοραζίν
  choice: Khorazim
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi seruan celaka sebelumnya.
- source_word: εἰ ... ἂν
  choice: seandainya ... tentu
  rationale: Konstruksi ini menyampaikan pengandaian yang berlawanan dengan kenyataan secara alami dalam bahasa Indonesia.
- source_word: αἱ δυνάμεις
  choice: perbuatan-perbuatan penuh kuasa
  rationale: Pilihan ini mempertahankan kaitan leksikal dengan kuasa dan menunjuk pada tindakan luar biasa, tanpa langsung mempersempit maknanya menjadi kategori modern ‘mukjizat’.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: terjadi ... yang terjadi
  rationale: Pengulangan verba sumber dipertahankan karena tetap jelas dan wajar dalam bahasa Indonesia serta menegaskan perbandingan hipotetisnya.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengah kalian
  rationale: Pronomina jamak merujuk kepada penduduk kedua kota dan menunjukkan bahwa perbuatan itu berlangsung di antara mereka, bukan di dalam diri mereka.
- source_word: πάλαι
  choice: sudah lama
  rationale: Ungkapan ini menyampaikan bahwa pertobatan itu secara hipotetis telah terjadi jauh sebelum saat tersebut.
- source_word: μετενόησαν
  choice: mereka bertobat
  rationale: Dalam konteks kecaman dan penghakiman, kata ini secara alami menyatakan pertobatan, bukan sekadar perubahan pikiran.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: dengan kain kabung dan abu
  rationale: Ungkapan ini mempertahankan gambaran budaya tentang perkabungan dan pertobatan sambil menggunakan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perbandingan Yesus dengan Tirus dan Sidon
  choice: Pernyataan sungguh-sungguh tentang kesalahan yang lebih besar pada kota-kota yang menyaksikan perbuatan penuh kuasa tetapi tidak bertobat
  alternative: Gaya bahasa berlebihan semata tanpa perbandingan penghakiman yang nyata
  rationale: Pengandaian yang berlawanan dengan kenyataan mempertajam kesalahan Khorazim dan Betsaida. Terjemahan mempertahankan ketegangan perbandingan itu tanpa menambahkan kesimpulan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘engkau’ dipakai kepada masing-masing kota, sedangkan ‘kalian’ mencerminkan bentuk jamak Yunani yang merujuk kepada penduduk kedua kota. Struktur pengandaian dibuat alami tanpa menghilangkan sifatnya yang berlawanan dengan kenyataan.
