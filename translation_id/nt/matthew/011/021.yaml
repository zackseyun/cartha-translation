review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: seruan penghukuman, pengandaian berlawanan dengan kenyataan, perbuatan kuasa, pertobatan, serta kain kabung dan abu semuanya terpelihara. Revisi kecil memperjelas urutan temporal dan hubungan lokasi tanpa menambah tafsiran.'
  naturalness: Teks draf dapat dipahami, tetapi pengulangan “yang terjadi di tengah-tengah kalian terjadi” terasa berat dalam bahasa Indonesia modern. “Di antara kalian” lebih luwes, dan penataan ulang kalimat menjaga pengulangan konseptual Yunani tanpa pengulangan yang kaku.
  terminology: “Bertobat,” “kain kabung,” dan “abu” tepat. Bentuk nama Indonesia yang lebih lazim adalah “Korazim,” bukan “Khorazim.” Catatan kaki sebaiknya menyatakan bahwa “perbuatan-perbuatan kuasa” adalah padanan/glosa Yunani, bukan mengklaimnya sebagai terjemahan harfiah yang tidak bernuansa.
  issues:
  - severity: medium
    issue: Nama tempat “Khorazim” tidak mengikuti bentuk Indonesia yang lazim.
    rationale: Dalam penggunaan Alkitab bahasa Indonesia modern, bentuk yang mapan ialah “Korazim.” Pembetulan ini meningkatkan konsistensi nama tanpa mengubah rujukan tempat.
  - severity: low
    issue: Pengulangan “yang terjadi di tengah-tengah kalian terjadi” kurang alami.
    rationale: Dua pemakaian γίνομαι memang hadir dalam Yunani, tetapi bahasa Indonesia tidak perlu mempertahankan pengulangan bentuk yang sama. “Yang telah terjadi di antara kalian itu terjadi” menyampaikan kedua unsur secara jelas.
  - severity: low
    issue: Frasa catatan kaki “secara harfiah” terlalu mutlak.
    rationale: δυνάμεις secara leksikal menunjuk pada tindakan/deed of power; “perbuatan-perbuatan kuasa” merupakan glosa yang berguna, tetapi lebih baik diberi label “Yunani” daripada “secara harfiah.”
  revised_text: “Celakalah engkau, Korazim! Celakalah engkau, Betsaida! Sebab, seandainya perbuatan-perbuatan penuh kuasa[a] yang telah terjadi di antara kalian itu terjadi di Tirus dan Sidon, tentu mereka sudah lama bertobat dengan kain kabung dan abu.”
