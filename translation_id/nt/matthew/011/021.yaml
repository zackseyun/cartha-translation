  to: “Celakalah engkau, Korazim! Celakalah engkau, Betsaida! Sebab, seandainya perbuatan-perbuatan penuh kuasa[a] yang telah terjadi di antara kalian itu terjadi di Tirus dan Sidon, tentu mereka sudah lama bertobat dengan kain kabung dan abu.”
