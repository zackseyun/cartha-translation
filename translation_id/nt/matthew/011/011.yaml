id: MAT.11.11
reference: Matthew 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: id
  text: Sesungguhnya, Aku berkata kepadamu, di antara orang-orang yang dilahirkan oleh perempuan tidak pernah muncul seorang pun yang lebih besar daripada Yohanes Pembaptis; tetapi orang yang paling kecil[a] dalam Kerajaan Surga lebih besar daripada dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang lebih kecil.” Kata Yunani yang digunakan berbentuk komparatif; dalam konteks ini ungkapan tersebut dapat menunjuk kepada orang yang paling rendah kedudukannya dalam Kerajaan Surga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya, Aku berkata kepadamu
  rationale: Mempertahankan rumusan khidmat dan berwibawa yang khas dalam ucapan Yesus, dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: οὐκ ἐγήγερται
  choice: tidak pernah tampil
  rationale: Dalam konteks ini, bentuk perfek tersebut paling wajar menunjuk kepada tampil atau munculnya seseorang dalam sejarah, bukan kebangkitan dari kematian.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: di antara mereka yang dilahirkan oleh perempuan
  rationale: Mempertahankan ungkapan Semitis dalam teks sumber, yang secara kontekstual merujuk kepada manusia.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: seorang pun yang lebih besar daripada Yohanes Pembaptis
  rationale: Mengungkapkan konstruksi perbandingan Yunani secara jelas dan alami dalam bahasa Indonesia.
- source_word: τοῦ βαπτιστοῦ
  choice: Pembaptis
  rationale: Sebutan baku dan mudah dikenali bagi Yohanes, sekaligus mencerminkan perannya sebagai orang yang membaptis.
- source_word: ὁ δὲ μικρότερος
  choice: tetapi orang yang paling kecil
  rationale: Walaupun bentuk Yunani secara morfologis bersifat komparatif, dalam konteks tingkatan atau kedudukan ungkapan ini dapat menunjuk kepada orang yang paling kecil. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dalam Kerajaan Surga
  rationale: Padanan Indonesia yang baku dan alami untuk ungkapan khas Matius, tanpa memaksakan bentuk jamak harfiah 'surga-surga'.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: lebih besar daripada dia
  rationale: Mempertahankan perbandingan paradoksal secara langsung tanpa menerangkan jenis kebesaran yang dimaksud.
theological_decisions:
- issue: Hubungan kebesaran Yohanes dengan orang yang paling kecil dalam Kerajaan Surga
  choice: Pernyataan paradoksal diterjemahkan secara langsung tanpa menjelaskan dasar atau jenis kebesaran tersebut.
  alternative: Menafsirkan perbandingan sebagai perbedaan kedudukan dalam sejarah keselamatan, hak istimewa perjanjian, atau kesalehan pribadi.
  rationale: Ayat itu sendiri tidak menerangkan mekanisme teologis perbandingan tersebut; terjemahan sebaiknya mempertahankan ketegangannya.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat. Ungkapan Semitis 'dilahirkan oleh perempuan' dipertahankan agar tekstur sumber tetap terasa, sedangkan 'tidak pernah tampil' dipilih untuk mencegah kesan bahwa ayat ini berbicara tentang kebangkitan.
