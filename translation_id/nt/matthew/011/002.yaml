  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: id
  text: Ketika Yohanes mendengar di penjara tentang karya-karya Mesias[a], ia mengirim pesan melalui murid-muridnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Mempertahankan padanan tradisional bagi Χριστός sebagai alternatif.
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan narasi; dalam bahasa Indonesia, peralihannya sudah berlangsung alami tanpa kata penghubung tambahan.
- source_word: ἀκούσας
  choice: Ketika Yohanes mendengar
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama dan paling alami diterjemahkan sebagai anak kalimat waktu.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: di dalam penjara
  rationale: Ungkapan ini menyatakan lokasi Yohanes ketika ia mendengar kabar tersebut.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Pilihan ini mempertahankan cakupan luas ἔργα, yang dapat mencakup karya pelayanan maupun perbuatan-perbuatan penuh kuasa.
- source_word: τοῦ χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga maknanya diterjemahkan, bukan sekadar ditransliterasikan.
- source_word: πέμψας
  choice: ia mengirim pesan
  rationale: Objek pesannya tersirat dan dijelaskan oleh ayat berikutnya; frasa ini menyampaikan bahwa Yohanes mengutus komunikasi melalui para muridnya.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: melalui murid-muridnya
  rationale: διά dengan genitif menunjukkan perantaraan atau agensi.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut berfungsi sebagai gelar yang menunjuk kepada sosok yang diurapi; alternatif tradisional tetap dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ulang pada “perbuatan-perbuatan” mempertahankan nuansa jamak sumber, sedangkan “murid-muridnya” secara alami menyatakan kelompok murid Yohanes.
