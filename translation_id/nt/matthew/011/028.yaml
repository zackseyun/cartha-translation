id: MAT.11.28
reference: Matthew 11:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: id
  text: Datanglah kepada-Ku, kalian semua yang berjerih lelah dan dibebani[a], dan Aku akan memberi kalian kelegaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah diberi beban.” Bentuk Yunani menggambarkan mereka yang telah dibebani dan tetap berada dalam keadaan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “istirahat” atau “kesegaran.” Kata Yunani ini dapat berarti menyebabkan seseorang beristirahat atau memulihkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Datanglah kepada-Ku
  rationale: Ungkapan ajakan ini secara alami menyatakan gerak menuju Yesus; bentuk -lah mempertahankan nada undangan langsung dan bermartabat.
- source_word: πάντες
  choice: kalian semua
  rationale: Menyatakan cakupan menyeluruh sekaligus memperjelas bahwa kata ganti Yunani dalam ayat ini berbentuk jamak.
- source_word: οἱ κοπιῶντες
  choice: yang berjerih lelah
  rationale: Mempertahankan unsur aktif dari berusaha atau bekerja keras sampai letih, dengan ungkapan Indonesia yang alami.
- source_word: πεφορτισμένοι
  choice: dibebani
  rationale: Partisip perfek pasif menggambarkan orang-orang yang telah diberi beban dan tetap berada dalam keadaan terbebani.
- source_word: κἀγὼ
  choice: dan Aku
  rationale: Mempertahankan subjek yang dinyatakan secara eksplisit serta penekanan ringan dalam bahasa Yunani tanpa melebih-lebihkannya.
- source_word: ἀναπαύσω ὑμᾶς
  choice: Aku akan memberi kalian kelegaan
  rationale: Mengungkapkan tindakan menyebabkan seseorang beristirahat atau memperoleh kelegaan dalam bahasa Indonesia yang wajar, tanpa mempersempit jenis kelegaan yang dijanjikan.
theological_decisions:
- issue: Hakikat kelegaan yang dijanjikan dalam ἀναπαύσω
  choice: Aku akan memberi kalian kelegaan
  alternative: Aku akan menyegarkan kalian; Aku akan memberi kalian istirahat
  rationale: Ayat ini tidak menentukan apakah kelegaan tersebut bersifat rohani, eskatologis, emosional, atau jasmani. Terjemahan yang luas mempertahankan kekayaan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang hangat dan bermartabat. “Kalian” dipakai untuk memperlihatkan bentuk jamak ὑμᾶς, sedangkan “berjerih lelah” mempertahankan unsur kerja keras dan keletihan. Huruf kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
