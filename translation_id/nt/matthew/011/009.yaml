base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: id
  text: Namun, ketika kalian pergi ke luar, apa yang hendak kalian lihat? Seorang nabi? Ya, Aku berkata kepada kalian, bahkan lebih daripada seorang nabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seseorang yang lebih besar daripada seorang nabi.” Secara lebih harfiah, bahasa Yunani berbunyi “lebih daripada seorang nabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras dengan rangkaian pertanyaan retoris sebelumnya secara alami dan bermartabat.
- source_word: τί ἐξήλθατε
  choice: untuk melihat apa kalian pergi ke luar
  rationale: Mempertahankan τί sebagai 'apa', bukan 'mengapa', dan bersama infinitif berikutnya menyatakan sasaran yang hendak dilihat.
- source_word: ἰδεῖν
  choice: untuk melihat
  rationale: Infinitif tujuan setelah ἐξήλθατε; 'melihat' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: προφήτην
  choice: seorang nabi
  rationale: Nomina tunggal tanpa artikel dalam pertanyaan ini secara alami diterjemahkan dengan penanda tak tentu 'seorang'.
- source_word: ναί
  choice: Ya
  rationale: Jawaban afirmatif langsung terhadap pertanyaan retoris.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan bentuk formula ujaran Yunani dengan bahasa Indonesia yang jelas; 'kalian' menyatakan penerima jamak.
- source_word: καὶ περισσότερον προφήτου
  choice: bahkan lebih daripada seorang nabi
  rationale: καί di sini berdaya penegas dan περισσότερον dengan genitif menyatakan perbandingan; terjemahan ini dekat dengan bentuk Yunani tanpa menambahkan subjek eksplisit.
theological_decisions:
- issue: Identitas dan kedudukan Yohanes Pembaptis dalam perkataan Yesus
  choice: lebih daripada seorang nabi
  alternative: seorang yang lebih besar daripada nabi
  rationale: Frasa ini meninggikan Yohanes melampaui kategori nabi tanpa menjelaskan caranya. Bentuk yang dipilih mempertahankan ketegangan dan kepadatan ungkapan Yunani serta tidak memasukkan penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan pertama sengaja agak formal untuk mempertahankan τί sebagai 'apa'; sapaan jamak ὑμῖν dinyatakan dengan 'kalian'. Kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
