  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: id
  text: Sebab Yohanes datang tanpa makan maupun minum, dan mereka berkata, “Ia kerasukan setan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ia mempunyai setan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: datang
  rationale: Aoristus ἔρχομαι menunjuk pada tampilnya Yohanes di tengah masyarakat; “datang” mempertahankan arti dasar verba dan wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan pernyataan sebelumnya; “Sebab” menyatakan hubungan penjelas itu secara ringkas dan alami.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: dengan tidak makan dan tidak minum
  rationale: Ungkapan berpasangan ini menggambarkan pola hidup asketis Yohanes. Terjemahan tidak menambahkan “roti” atau “anggur”, yang tidak disebut dalam ayat ini; kata “dengan” membantu menyatakan cara hidup, bukan penolakan mutlak atas semua makanan dan minuman.
- source_word: καὶ λέγουσιν
  choice: dan mereka berkata
  rationale: Kala kini λέγουσιν bersifat hidup dan menggeneralisasi tuduhan para penentang. “Mereka” mempertahankan subjek yang tidak diperinci oleh teks.
- source_word: Δαιμόνιον ἔχει
  choice: Ia kerasukan setan
  rationale: Idiom Yunani harfiahnya berarti “ia mempunyai roh jahat/setan”; dalam bahasa Indonesia modern, “kerasukan setan” menyampaikan makna idiomatis tuduhan tersebut dengan jelas. Alternatif harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Cara menerjemahkan tuduhan Δαιμόνιον ἔχει
  choice: Ia kerasukan setan
  alternative: Ia mempunyai setan
  rationale: Ayat ini melaporkan tuduhan orang terhadap Yohanes, bukan penegasan narator. Terjemahan idiomatis dipakai dalam teks utama, sementara bentuk harfiah dipertahankan dalam catatan agar nuansa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur “dengan tidak makan dan tidak minum” mempertahankan ungkapan ringkas Yunani sambil menandai bahwa yang dimaksud ialah corak hidup asketis Yohanes.
