base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: id
  text: Mereka berkata, ‘Kami meniup seruling untuk kalian, tetapi kalian tidak menari; kami menyanyikan ratapan, tetapi kalian tidak berkabung[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kalian tidak memukul-mukul diri,” yakni melakukan gerakan berkabung yang lazim, seperti memukul dada.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Mereka berkata
  rationale: Bentuk kini menghadirkan keluhan anak-anak secara hidup dalam perumpamaan; bahasa Indonesia secara wajar memakai bentuk tak bertanda waktu ‘berkata’.
- source_word: Ηὐλήσαμεν
  choice: Kami telah meniup seruling
  rationale: αὐλέω secara khusus berarti memainkan seruling atau suling; ‘meniup seruling’ alami dalam bahasa Indonesia dan mempertahankan jenis alat musiknya.
- source_word: ὑμῖν
  choice: untuk kalian
  rationale: Datif menunjukkan permainan musik yang ditujukan kepada kelompok lain; ‘untuk kalian’ paling alami dalam konteks pertunjukan.
- source_word: ὠρχήσασθε
  choice: kalian tidak menari
  rationale: Bentuk medium ini secara idiomatis berarti menari tanpa perlu menambahkan nuansa refleksif.
- source_word: ἐθρηνήσαμεν
  choice: kami telah menyanyikan ratapan
  rationale: θρηνέω menunjuk pada ratapan, khususnya ratapan kematian; ungkapan ini mempertahankan kesejajaran performatif dengan permainan seruling.
- source_word: ἐκόψασθε
  choice: kalian tidak berkabung
  rationale: Dalam konteks ini κόπτω bentuk medium menunjuk pada tindakan berkabung, lazimnya dengan memukul dada; terjemahan utama menyampaikan maknanya secara alami, sedangkan gestur harfiahnya dijelaskan dalam catatan kaki.
