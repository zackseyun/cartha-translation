  verdict: revise
  source_fidelity: Draf mempertahankan imperatif, metafora "kuk", belajar dari Yesus, serta sifat lemah lembut dan rendah hati. Namun, "kuk yang Kupasang" mengubah kepunyaan eksplisit μου ("kuk-Ku") menjadi klausa yang menyatakan tindakan memasang, yang tidak dinyatakan dalam teks Yunani. "Mendapat ketenangan" juga lebih interpretatif daripada ἀνάπαυσις, dan "maka" menggantikan sambungan καί dengan hubungan hasil yang lebih tegas.
  naturalness: Bahasa draf pada umumnya alami dan berdaftar khidmat. Bentuk revisi mempertahankan kelancaran bahasa Indonesia modern sambil menghindari klausa relatif tambahan dan memakai "menemukan perhentian", yang jelas serta lazim dalam register Alkitab.
  terminology: '"Kuk", "lemah lembut", "rendah hati", dan "jiwa" merupakan padanan yang baik. "Perhentian" lebih dekat dengan ἀνάπαυσις daripada "ketenangan" dan tetap membiarkan cakupan kelegaan/rest yang dimaksud teks terbuka.'
  issues:
  - severity: medium
    issue: '"kuk yang Kupasang" menggantikan "kuk-Ku".'
    rationale: μου adalah penanda kepunyaan ("milik-Ku"), bukan verba "Kupasang". Walaupun kuk secara implisit dikenakan oleh Yesus, tambahan itu bukan isi eksplisit sumber dan menggeser gambaran dari kuk milik Yesus menjadi kuk yang Ia pasangkan.
  - severity: low
    issue: '"maka" setelah "sebab" mempertegas relasi hasil.'
    rationale: Teks memakai καί sebelum janji "kamu akan menemukan". Hubungan janji itu dapat tersirat dalam konteks, tetapi sambungan "dan" lebih dekat pada bentuk dan keluwesan sumber.
  - severity: low
    issue: '"mendapat ketenangan" mempersempit ἀνάπαυσις.'
    rationale: '"Ketenangan" terutama menunjuk keadaan tenang; ἀνάπαυσις mencakup perhentian, kelegaan, atau istirahat. "Perhentian" mempertahankan istilah yang lebih luas dan dekat dengan sumber.'
  revised_text: Pikullah kuk-Ku dan belajarlah dari-Ku, sebab Aku lemah lembut dan rendah hati, dan kamu akan menemukan perhentian bagi jiwamu.
