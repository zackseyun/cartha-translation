  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: id
  text: Pikullah kuk-Ku dan belajarlah dari-Ku, sebab Aku lemah lembut dan rendah hati, dan kamu akan menemukan perhentian bagi jiwamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Pikullah kuk yang Kupasang
  rationale: Ungkapan ini mempertahankan metafora kuk sekaligus menyampaikan tindakan menerima kuk itu pada diri sendiri dalam bahasa Indonesia yang wajar. Frasa relatif mencegah bentuk kaku seperti 'pikullah kuk-Ku ke atasmu'.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: belajarlah dari-Ku
  rationale: Terjemahan langsung dan alami untuk perintah belajar dari Yesus, dengan kemungkinan nuansa pemuridan tetap terbuka.
- source_word: ὅτι
  choice: sebab
  rationale: Menandai alasan mengapa Yesus patut dijadikan guru tanpa membuat hubungan antarklausa terasa terlalu analitis.
- source_word: πραΰς
  choice: lemah lembut
  rationale: Padanan Indonesia yang mapan untuk sikap lembut dan tidak keras, tanpa menyiratkan kelemahan moral.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: rendah hati
  rationale: Ungkapan Indonesia alami yang menyatakan kerendahan batin; unsur καρδίᾳ terwakili secara idiomatis dalam istilah 'rendah hati'.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: kamu akan mendapat ketenangan
  rationale: Dalam konteks beban dan kuk, 'mendapat ketenangan' menyampaikan janji kelegaan atau perhentian secara alami, tanpa membatasinya pada tidur atau berhenti bekerja.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: bagi jiwamu
  rationale: Mempertahankan ψυχή sebagai 'jiwa' dan menerjemahkan datif secara idiomatis sebagai penerima manfaat.
theological_decisions:
- issue: Gambaran watak Yesus dalam πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: Aku lemah lembut dan rendah hati
  alternative: Aku lembut dan rendah dalam hati
  rationale: Pilihan ini menjaga pernyataan diri Yesus sebagai pribadi yang tidak keras dan memiliki kerendahan batin, tanpa menambahkan kesimpulan doktrinal.
- issue: Makna ἀνάπαυσις bagi ψυχή
  choice: ketenangan bagi jiwamu
  alternative: perhentian bagi jiwamu
  rationale: Kata 'ketenangan' cocok dengan janji kelegaan dalam konteks, sementara dimensi rohani dan batiniah tetap dipertahankan oleh 'jiwa'; terjemahan tidak menentukan secara sempit apakah yang dimaksud hanya kelegaan sekarang atau perhentian eskatologis.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Metafora 'kuk' dipertahankan karena penting bagi ayat dan konteksnya.
