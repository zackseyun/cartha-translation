source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: id
  text: Segala sesuatu telah diserahkan kepada-Ku oleh Bapa-Ku, dan tidak seorang pun mengenal[a] Anak selain Bapa, dan tidak seorang pun mengenal Bapa selain Anak serta kepada siapa pun yang Anak pilih untuk menyatakan Bapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenal sepenuhnya” atau “benar-benar mengenal”; kata Yunani ini dapat menyiratkan pengenalan yang penuh atau mendalam. Hal yang sama berlaku pada kata “mengenal” berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “serta kepada siapa pun yang Anak kehendaki untuk menyatakan Bapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Segala sesuatu
  rationale: Bentuk jamak netral ini memiliki cakupan luas. “Segala sesuatu” mempertahankan sifat menyeluruh tanpa menentukan ranah yang tidak disebutkan teks.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: telah diserahkan kepada-Ku oleh Bapa-Ku
  rationale: Aoristus pasif παρεδόθη menyatakan tindakan penyerahan kepada Anak oleh Bapa. “Telah diserahkan” mengungkapkan tindakan yang sudah terjadi beserta keadaan yang dihasilkannya.
- source_word: ἐπιγινώσκει
  choice: mengenal
  rationale: Dalam konteks hubungan pribadi antara Bapa dan Anak, “mengenal” lebih tepat daripada “mengetahui”. Kata majemuk ini tidak selalu menuntut tambahan eksplisit “sepenuhnya”; kemungkinan nuansa pengenalan penuh atau mendalam dicatat dalam catatan kaki.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: Anak / Bapa
  rationale: Keduanya merupakan sebutan relasional yang saling berpadanan dalam konteks ini, sehingga kapitalisasi mempertahankan fungsi titularnya.
- source_word: εἰ μὴ
  choice: selain
  rationale: Sesudah pernyataan negatif, “selain” secara alami menyampaikan pengecualian eksklusif.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: siapa pun yang kepadanya Anak memilih untuk menyatakan-Nya
  rationale: Susunan ini mempertahankan inisiatif dan kehendak Anak dalam tindakan penyataan. “Memilih” merupakan padanan Indonesia modern yang jelas bagi βούληται, sedangkan “menyatakan-Nya” mempertahankan arti ἀποκαλύψαι dan rujukannya kepada Bapa.
theological_decisions:
- issue: Kekuatan ἐπιγινώσκω dalam pernyataan tentang pengenalan timbal balik
  choice: Diterjemahkan “mengenal”, dengan kemungkinan nuansa “mengenal sepenuhnya” dicatat
  alternative: mengenal sepenuhnya
  rationale: Konteks menegaskan pengenalan yang unik dan eksklusif antara Bapa dan Anak, tetapi bentuk verba itu sendiri tidak selalu mengharuskan intensifikasi eksplisit. Pilihan ini menjaga penekanan konteks tanpa memasukkan kadar makna yang diperdebatkan ke dalam teks utama.
- issue: Bahasa kehendak dalam βούληται
  choice: memilih
  alternative: menghendaki; berkenan
  rationale: “Memilih” menyampaikan tindakan kehendak yang nyata dan inisiatif Anak secara wajar dalam bahasa Indonesia modern, tanpa mereduksinya menjadi sekadar keinginan atau menambahkan nuansa kesenangan yang tidak wajib.
- issue: Objek tersirat dari ἀποκαλύψαι
  choice: Dinyatakan dengan pronomina “-Nya” yang merujuk kepada Bapa
  alternative: menyatakan Bapa
  rationale: Bahasa Yunani membiarkan objek dipahami dari “Bapa” dalam klausa sebelumnya. Pronomina mempertahankan kesinambungan itu tanpa pengulangan yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bapa” dan “Anak” dipertahankan sebagai sebutan relasional ilahi; pronomina terikat yang merujuk kepada pribadi ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan logis antarklausanya.
