review_pass:
  verdict: revise
  source_fidelity: The draft generally reflects the Greek rhetorical sequence and retains the repeated μαλακά as “pakaian halus.” However, “apa yang hendak kalian lihat ketika kalian pergi ke luar?” changes the purpose construction τί ἐξήλθατε ἰδεῖν (“what did you go out to see?”) into a temporal question and introduces “ke luar,” which is not the intended sense here. “Tinggal di istana raja-raja” also narrows εἰσίν (“are”) to residence and interprets “houses” as palaces.
  naturalness: 'The revised wording uses modern standard Indonesian while retaining the pointed rhetorical force: “untuk melihat apa kalian pergi?” is a natural, compact way to express the Greek purpose construction. “Berada di rumah-rumah raja” is clear and avoids unnecessary interpretive specification.'
  terminology: “Pakaian halus” appropriately preserves the concrete lexical repetition of μαλακοῖς / τὰ μαλακά while allowing its contextual implication of fine or luxurious clothing. “Rumah-rumah raja” closely represents τοῖς οἴκοις τῶν βασιλέων; an alternative footnote may give “istana-istana kerajaan.”
  issues:
  - severity: medium
    issue: The first question renders the purpose construction as a temporal clause and adds “ke luar.”
    rationale: τί ἐξήλθατε ἰδεῖν asks what the listeners went out in order to see. “Ketika kalian pergi ke luar” means “when you went outside,” which both weakens the purposive relation and introduces a misleading spatial sense.
  - severity: medium
    issue: “Tinggal di istana raja-raja” is more specific than the source.
    rationale: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν literally says they “are in the houses of kings.” “Tinggal” implies residence, while “istana” interprets houses as palaces. The source wording can be retained naturally in Indonesian.
  revised_text: Namun, untuk melihat apa kalian pergi? Seorang laki-laki yang mengenakan pakaian halus?[a] Lihatlah, orang-orang yang mengenakan pakaian halus berada di rumah-rumah raja.[b]
  revised_footnotes:
