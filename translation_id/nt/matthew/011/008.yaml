id: MAT.11.8
reference: Matthew 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: id
  text: Namun, untuk melihat apa kalian pergi? Seorang laki-laki yang mengenakan pakaian halus?[a] Lihatlah, orang-orang yang mengenakan pakaian halus berada di rumah-rumah raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dikenakan pakaian-pakaian yang lembut.” Ungkapan ini dapat merujuk pada pakaian yang halus atau mewah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berada di istana-istana kerajaan.” Secara harfiah, “berada di rumah-rumah raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras lanjutan dalam rangkaian pertanyaan retoris Yesus dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: apa yang hendak kalian lihat ketika kalian pergi ke luar
  rationale: Mempertahankan τί sebagai 'apa' dan menyatakan tujuan yang terkandung dalam infinitif ἰδεῖν secara alami dalam bahasa Indonesia.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Sesuai dengan bentuk tunggal dan konteks yang secara khusus merujuk kepada Yohanes Pembaptis.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: yang mengenakan pakaian halus
  rationale: Mengungkapkan keadaan berpakaian dan mempertahankan gambaran konkret μαλακοῖς, yang di sini menyiratkan pakaian lembut, mewah, atau indah.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Seruan pengarah perhatian yang alami dalam ragam Indonesia modern dan tetap mempertahankan daya retoris teks.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: orang-orang yang mengenakan pakaian halus
  rationale: Bentuk partisipel menunjukkan orang-orang yang biasa mengenakan pakaian demikian; pengulangan 'pakaian halus' menjaga kaitan leksikal dengan klausa sebelumnya.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: tinggal di istana raja-raja
  rationale: '''Istana raja-raja'' menyampaikan secara alami makna rumah atau kediaman para raja; ''tinggal'' mengungkapkan keberadaan mereka dalam lingkungan tersebut tanpa mengubah pokok kontras.'
