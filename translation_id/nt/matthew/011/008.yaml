revisions:
- from: Namun, apa yang hendak kalian lihat ketika kalian pergi ke luar? Seorang laki-laki yang mengenakan pakaian halus?[a] Lihatlah, orang-orang yang mengenakan pakaian halus tinggal di istana raja-raja.[b]
  to: Namun, untuk melihat apa kalian pergi? Seorang laki-laki yang mengenakan pakaian halus?[a] Lihatlah, orang-orang yang mengenakan pakaian halus berada di rumah-rumah raja.[b]
  rationale: The revision restores the Greek purposive question without adding “outside,” and it renders the final clause without implying that the people reside permanently in palaces. It preserves the rhetorical questions, plural second-person address, lexical repetition of “pakaian halus,” and the source’s plural “raja.”
