id: MAT.11.3
reference: Matthew 11:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: id
  text: dan berkata kepada-Nya, “Engkaukah Dia yang akan datang itu[a], atau haruskah kami menantikan orang lain?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dia yang datang.” Ungkapan Yunani ini dapat berfungsi sebagai gelar mesianik.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: dan berkata kepada-Nya
  rationale: Kata εἶπεν berarti ‘berkata’. Kata ‘dan’ dipakai untuk menyambungkan penggalan ini secara wajar dengan narasi ayat sebelumnya, meskipun tidak diwakili oleh kata tersendiri dalam teks Yunani yang diberikan. Bentuk ‘-Nya’ mengikuti rujukannya kepada Yesus.
- source_word: Σὺ εἶ
  choice: Apakah Engkau
  rationale: Susunan ini membentuk pertanyaan langsung yang alami dalam bahasa Indonesia. Pronomina eksplisit σύ memberi sedikit penekanan, yang tetap tercermin dengan hadirnya ‘Engkau’.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang Akan Datang[a]
  rationale: Partisipel kini dengan artikel ini berfungsi sebagai nomina dan dalam konteksnya dapat bernuansa gelar bagi tokoh yang dinantikan. Terjemahan ini mempertahankan gambaran ‘datang’ tanpa langsung menggantinya dengan sebutan ‘Mesias’.
- source_word: ἢ
  choice: atau
  rationale: Konjungsi pemisah yang memperkenalkan pilihan kedua dalam pertanyaan.
- source_word: ἕτερον
  choice: orang lain
  rationale: Bentuk ini berarti seorang yang lain atau berbeda. ‘Orang lain’ alami dalam bahasa Indonesia dan menyatakan bahwa yang dimaksud adalah pribadi, tanpa menambahkan identitas tertentu.
- source_word: προσδοκῶμεν
  choice: haruskah kami menantikan
  rationale: Dalam pertanyaan deliberatif ini, bentuk kini tersebut secara alami menyatakan apa yang patut dilakukan. ‘Menantikan’ mencakup unsur menunggu dengan pengharapan dan sesuai dengan konteks kedatangan tokoh yang dijanjikan.
theological_decisions:
- issue: Daya mesianik atau titular dari ὁ ἐρχόμενος
  choice: Dia yang Akan Datang
  alternative: dia yang sedang datang; orang yang akan datang; Mesias yang dinantikan
  rationale: Artikel, bentuk partisipel substantival, dan konteks pertanyaan Yohanes mendukung pemahaman sebagai sebutan bagi tokoh yang dinantikan. Huruf kapital menandai fungsi seperti gelar, tetapi teks utama tidak mempersempit ungkapan Yunani dengan menerjemahkannya langsung sebagai ‘Mesias’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ serta bentuk rujukan ‘-Nya’ dipakai sesuai register Alkitab Indonesia yang umum; kalimat tetap mudah dipahami pembaca masa kini.
