  to: dan berkata kepada-Nya, “Engkaukah Dia yang akan datang itu[a], atau haruskah kami menantikan orang lain?”
  rationale: The revision improves idiomatic modern Indonesian question form and adjusts capitalization while preserving the source’s emphasis, the potentially titular expression for the expected one, and the open alternative of another person. The footnote is narrowed to a lexically sound alternative and continues to identify the possible messianic-title function without imposing it as the only reading.
