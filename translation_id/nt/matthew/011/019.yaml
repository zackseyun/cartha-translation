id: MAT.11.19
reference: Matthew 11:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: id
  text: Anak Manusia datang, makan dan minum, lalu mereka berkata, “Lihat, seorang pelahap dan pemabuk, sahabat para pemungut pajak dan orang-orang berdosa!” Dan hikmat dibenarkan oleh perbuatan-perbuatannya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan hikmat terbukti benar oleh perbuatan-perbuatannya.”
    reason: lexical_alternative
  - marker: b
    text: 'Sebagian naskah membaca “anak-anak” sebagai ganti “perbuatan-perbuatan”: “Dan hikmat dibenarkan oleh anak-anaknya.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan baku bagi gelar ini, yang mempertahankan latar Semitik serta gaung mesianik dan teologisnya tanpa parafrasa.
- source_word: ἐσθίων καὶ πίνων
  choice: dengan makan dan minum
  rationale: Menggambarkan kebiasaan secara lugas dan mempertahankan kontras dengan cara hidup asketis Yohanes tanpa melebihkannya menjadi berpesta.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Padanan modern dan wajar yang mempertahankan daya seru dalam tuduhan terbuka tersebut.
- source_word: φάγος
  choice: seorang pelahap
  rationale: Menangkap kata benda bernada menghina yang menuduh seseorang makan secara berlebihan.
- source_word: οἰνοπότης
  choice: pemabuk
  rationale: Menyampaikan tuduhan tentang kebiasaan minum berlebihan, bukan sekadar bahwa ia meminum anggur.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: sahabat para pemungut pajak dan orang-orang berdosa
  rationale: Mempertahankan susunan dan daya sosial-keagamaan kedua sebutan itu dalam bahasa Indonesia yang alami.
- source_word: ἐδικαιώθη
  choice: dibenarkan
  rationale: Dekat secara formal dengan δικαιόω dan mempertahankan kaitan verbal dengan pemakaian alkitabiah yang lebih luas; arti kontekstual 'terbukti benar' dicatat dalam catatan kaki.
- source_word: ἡ σοφία
  choice: hikmat
  rationale: Mempertahankan ungkapan personifikasi tanpa mengidentifikasikannya secara eksplisit dengan Yesus atau rencana ilahi.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: melalui perbuatan-perbuatannya
  rationale: Menyampaikan bahwa kebenaran hikmat ditunjukkan oleh apa yang dihasilkannya, sambil mempertahankan personifikasi tanpa memakai pronomina bergender yang tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'hikmat' dalam klausa penutup
  choice: Mempertahankan ungkapan 'hikmat' yang dipersonifikasikan tanpa identifikasi eksplisit.
  alternative: Hikmat secara khusus merujuk kepada Yesus atau kepada rencana keselamatan Allah.
  rationale: Teks tidak menyelesaikan identitas personifikasi itu; terjemahan mempertahankan ketegangan sastra dan teologisnya.
- issue: Bentuk teks pada klausa terakhir
  choice: Mengikuti bacaan SBLGNT ἔργων, 'perbuatan-perbuatan'.
  alternative: τέκνων, 'anak-anak', sebagaimana terdapat dalam sebagian naskah dan paralel Lukas 7:35.
  rationale: Teks sumber yang diberikan membaca ἔργων; varian penting dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan tuduhan dibuat tajam tetapi tetap alami. Penanda catatan ditempatkan sesudah klausa penutup karena kedua catatan menjelaskan klausa tersebut; semua penanda hadir dalam teks utama.
