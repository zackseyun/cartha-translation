revisions:
- from: Anak Manusia datang dengan makan dan minum, lalu mereka berkata, “Lihat, seorang pelahap dan pemabuk, sahabat para pemungut pajak dan orang-orang berdosa!” Dan hikmat dibenarkan melalui perbuatan-perbuatannya.[a][b]
  to: Anak Manusia datang, makan dan minum, lalu mereka berkata, “Lihat, seorang pelahap dan pemabuk, sahabat para pemungut pajak dan orang-orang berdosa!” Dan hikmat dibenarkan oleh perbuatan-perbuatannya.[a][b]
  rationale: Revisi terbatas pada kelancaran dan ketepatan idiom bahasa Indonesia. Terjemahan mempertahankan urutan dasar, nada tuduhan, personifikasi “hikmat,” bacaan SBLGNT “perbuatan-perbuatan,” serta catatan varian “anak-anak,” tanpa menyelesaikan ambiguitas teologis atau tekstual yang tidak diselesaikan oleh sumber.
