  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: id
  text: Orang buta melihat, orang lumpuh berjalan, orang yang sakit kusta ditahirkan, orang tuli mendengar, orang mati dibangkitkan, dan kepada orang miskin diberitakan kabar baik.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “kepada orang miskin diberitakan Injil.” Verba Yunaninya berbentuk pasif: mereka menjadi penerima kabar baik yang diberitakan.'
    reason: lexical_alternative
  - marker: b
    text: Daftar ini menggema Yesaya 35:5–6 dan 61:1 serta menampilkan tanda-tanda yang berkaitan dengan karya Mesias.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: orang buta dapat melihat
  rationale: Ungkapan ini menyampaikan pemulihan atau penerimaan penglihatan dalam konteks mukjizat, bukan sekadar tindakan menengadah. Bentuknya alami dalam bahasa Indonesia dan mempertahankan gaya daftar yang ringkas.
- source_word: χωλοὶ περιπατοῦσιν
  choice: orang lumpuh berjalan
  rationale: Terjemahan langsung dan wajar yang mempertahankan bentuk kini serta kesejajaran dalam daftar.
- source_word: λεπροὶ καθαρίζονται
  choice: orang yang sakit kusta ditahirkan
  rationale: Sebutan berbasis orang lebih alami dan santun dalam bahasa Indonesia modern. “Ditahirkan” mempertahankan cakupan καθαρίζονται yang mencakup pemulihan jasmani sekaligus status tahir, bukan hanya kesembuhan medis.
- source_word: κωφοὶ ἀκούουσιν
  choice: orang tuli mendengar
  rationale: Dalam pasangan dengan ἀκούουσιν, κωφοί jelas berarti orang tuli, bukan orang bisu.
- source_word: νεκροὶ ἐγείρονται
  choice: orang mati dibangkitkan
  rationale: Bentuk pasif Yunani dipertahankan dan menyiratkan tindakan yang dilakukan atas orang mati tanpa menambahkan pelaku yang tidak disebutkan dalam ayat.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: kepada orang miskin diberitakan kabar baik
  rationale: Susunan ini mempertahankan orang miskin sebagai penerima pemberitaan dan mencerminkan bentuk pasif verba Yunani, sambil memakai ungkapan yang mudah dipahami dan tidak mempersempitnya menjadi jargon gerejawi.
theological_decisions:
- issue: Makna εὐαγγελίζονται dan hubungannya dengan istilah Injil
  choice: kepada orang miskin diberitakan kabar baik
  alternative: orang miskin menerima pemberitaan Injil
  rationale: Pilihan utama mempertahankan gagasan kabar baik dan sifat pasif verba Yunani tanpa mengimpor pemakaian teknis yang lebih kemudian. Alternatif yang memakai “Injil” dicatat karena secara leksikal tetap mungkin.
- issue: Daftar mukjizat sebagai gema nubuat Yesaya tentang karya Mesias
  choice: mempertahankan pernyataan-pernyataan mukjizat tanpa menambahkan bahasa penggenapan
  alternative: menyebutkan penggenapan nubuat Yesaya secara eksplisit dalam teks utama
  rationale: Ayat ini menggema Yesaya 35:5–6 dan 61:1, tetapi tidak secara eksplisit memakai istilah “digenapi”. Hubungan tersebut dijelaskan dalam catatan kaki agar teks utama tidak menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pola berulang “orang …” mempertahankan irama daftar Yunani sekaligus menghindari pelabelan yang terasa kasar. Istilah “ditahirkan” dipertahankan karena maknanya lebih luas daripada sekadar “disembuhkan” dan penting bagi latar budaya serta keagamaan teks.
