  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia pada daftar tindakan dalam teks Yunani dan mempertahankan bentuk pasif pada “ditahirkan,” “dibangkitkan,” dan pemberitaan kabar baik kepada orang miskin. Namun, “orang buta dapat melihat” terutama menyatakan kemampuan, sedangkan ἀναβλέπουσιν dalam konteks ini menyatakan penerimaan/pemulihan penglihatan. Mengganti dengan “orang buta melihat” lebih tepat menangkap hasil pemulihan dalam gaya daftar yang ringkas tanpa memaksakan bahwa semua sebelumnya pernah dapat melihat.
  naturalness: Bahasa Indonesia baku, jelas, dan ritmis. “Orang buta melihat” lebih padat serta lebih alami untuk daftar mukjizat daripada “orang buta dapat melihat.” “Orang yang sakit kusta ditahirkan” tetap dapat dipahami dan menjaga bahasa yang berpusat pada orang.
  terminology: “Ditahirkan” tepat untuk καθαρίζονται karena tidak menyempitkan makna menjadi kesembuhan medis saja. “Kabar baik” tepat untuk εὐαγγελίζονται dan susunan “kepada orang miskin diberitakan” menjaga mereka sebagai penerima tindakan pasif. Catatan alternatif “Injil” dan catatan gema Yesaya sesuai, tanpa memasukkan penafsiran ke dalam teks utama.
  issues:
