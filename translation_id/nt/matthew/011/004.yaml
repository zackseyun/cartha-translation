    issue: Nuansa 'Lalu'
    rationale: καί terutama merupakan penghubung naratif sederhana. 'Lalu' dapat dibaca sebagai penambahan urutan temporal; penghilangan penghubung pada awal kalimat lebih wajar dalam bahasa Indonesia dan tidak menambahkan nuansa.
  - severity: medium
    issue: Pronomina 'kamu' tidak jelas jumlahnya
    rationale: αὐτοῖς dan bentuk perintah ditujukan kepada para utusan Yohanes, sehingga 'kalian' secara eksplisit mempertahankan acuan jamak dalam bahasa Indonesia modern.
  - severity: medium
    issue: Tanda petik penutup tidak ada
    rationale: Teks terjemahan membuka kutipan langsung tetapi tidak menutupnya setelah titik dua, sehingga teks perlu diperbaiki secara struktural.
  - severity: low
    issue: Catatan kaki tidak mencerminkan καί awal
    rationale: Alternatif yang lebih harfiah sebaiknya berbunyi 'Dan Yesus ...' karena teks Yunani diawali καί.
