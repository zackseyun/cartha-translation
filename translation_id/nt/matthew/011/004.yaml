  source_fidelity: Draf pada dasarnya menyampaikan rumus jawaban Yesus, perintah untuk pergi dan melaporkan, penerima laporan, serta pasangan 'mendengar dan melihat' dengan tepat. Namun, 'Lalu' memberi nuansa temporal yang tidak diperlukan oleh καί, dan pronomina 'kamu' kurang jelas untuk para utusan yang jamak.
  naturalness: Bahasa draf umumnya baku dan wajar. Menggunakan 'kalian' memperjelas bahwa perintah dan pengamatan itu ditujukan kepada lebih dari satu orang. Tanda petik penutup juga perlu ditambahkan agar kutipan lengkap secara struktural.
  terminology: Nama 'Yesus' dan 'Yohanes' sudah tepat. 'Laporkan kepada' merupakan padanan yang baik untuk ἀπαγγείλατε ... Ἰωάννῃ. Catatan kaki dipertahankan, dengan bentuk harfiah yang juga mencerminkan καί pada awal kalimat.
  issues:
