  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: id
  text: Yesus menjawab mereka[a], “Pergilah dan laporkan kepada Yohanes apa yang kalian dengar dan lihat:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dan Yesus menjawab dan berkata kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi; “Lalu” terdengar alami dalam narasi Indonesia tanpa mengubah hubungan antarklausa.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Yesus menjawab mereka
  rationale: Rumus naratif Yunani secara harfiah berarti “menjawab dan berkata kepada mereka,” tetapi dalam bahasa Indonesia modern fungsi wacananya tersampaikan secara alami dan utuh dengan “menjawab mereka.”
- source_word: Πορευθέντες
  choice: Pergilah
  rationale: 'Partisip aoris ini mendampingi imperatif berikutnya dan memiliki daya perintah: mereka harus pergi lalu menyampaikan laporan.'
- source_word: ἀπαγγείλατε
  choice: laporkan
  rationale: Kata ini menyatakan penyampaian kembali suatu kabar atau hasil pengamatan; “laporkan” tepat bagi para utusan Yohanes yang kembali membawa kesaksian.
- source_word: Ἰωάννῃ
  choice: kepada Yohanes
  rationale: Bentuk datif menandai penerima laporan dan secara alami diterjemahkan dengan “kepada.”
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: apa yang kamu dengar dan lihat
  rationale: Terjemahan ini mempertahankan kedua pengalaman indrawi dalam bentuk kini serta urutan sumber.
theological_decisions:
- issue: Rumus naratif ἀποκριθεὶς ... εἶπεν
  choice: Yesus menjawab mereka
  alternative: Yesus menjawab dan berkata kepada mereka
  rationale: Bentuk ringkas menghindari ungkapan yang kaku dalam bahasa Indonesia tanpa menghilangkan tindakan menjawab atau pengantar perkataan. Bentuk lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. “Kamu” digunakan sebagai bentuk jamak yang ditentukan oleh konteks para utusan Yohanes; bahasa Indonesia tidak menandai jumlah pada pronomina ini.
