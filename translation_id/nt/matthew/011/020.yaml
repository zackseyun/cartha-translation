id: MAT.11.20
reference: Matthew 11:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: id
  text: Kemudian Yesus mulai mengecam kota-kota tempat sebagian besar perbuatan-Nya yang penuh kuasa[a] telah dilakukan, karena penduduknya tidak bertobat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “mukjizat-mukjizat-Nya” atau “karya-karya kuasa-Nya” (Yunani: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang secara alami memperkenalkan tahap berikutnya dalam narasi.
- source_word: ἤρξατο ὀνειδίζειν
  choice: mulai mengecam
  rationale: Mempertahankan aspek ingresif ἤρξατο dan menyampaikan teguran keras dalam ὀνειδίζω tanpa mengartikannya sebagai penghukuman resmi.
- source_word: τὰς πόλεις ἐν αἷς
  choice: kota-kota tempat
  rationale: Ungkapan relatif ini alami dalam bahasa Indonesia dan mempertahankan kota-kota sebagai sasaran kecaman.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: sebagian besar perbuatan-Nya yang penuh kuasa telah dilakukan
  rationale: Menyampaikan πλεῖσται sebagai mayoritas, δυνάμεις sebagai perbuatan yang menunjukkan kuasa, dan tindakan yang telah terjadi sebelum kecaman itu.
- source_word: ὅτι οὐ μετενόησαν
  choice: karena penduduknya tidak bertobat
  rationale: ὅτι menyatakan alasan. 'Bertobat' mempertahankan bobot moral-rohani μετανοέω; 'penduduknya' memperjelas bahwa manusia di kota-kota itulah yang tidak bertobat.
theological_decisions:
- issue: Makna δυνάμεις dalam konteks karya mukjizat Yesus
  choice: perbuatan-Nya yang penuh kuasa
  alternative: mukjizat-mukjizat-Nya; karya-karya kuasa-Nya
  rationale: Pilihan ini mempertahankan penekanan leksikal pada kuasa tanpa mempersempit istilah Yunani menjadi satu kategori modern saja.
- issue: Makna μετενόησαν
  choice: tidak bertobat
  alternative: tidak berbalik; tidak mengubah pikiran
  rationale: '''Bertobat'' secara alami menyampaikan tanggapan moral dan rohani yang dituntut teks tanpa menambahkan rumusan denominasi tertentu.'
- issue: Subjek tersirat yang tidak bertobat
  choice: penduduknya
  alternative: mereka
  rationale: Secara gramatikal, kata ganti Yunani merujuk kepada kota-kota, tetapi secara maknawi yang bertobat atau tidak bertobat adalah para penduduknya. Eksplisitasi ini mencegah personifikasi yang janggal dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama 'Yesus' dibuat eksplisit agar rujukan pronomina jelas dalam ayat yang berdiri sendiri; kapitalisasi '-Nya' mengikuti kebiasaan hormat yang umum dalam penerbitan Alkitab Indonesia.
