  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: id
  text: Dan berbahagialah orang yang tidak tersandung karena Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak tersinggung karena Aku” atau “tidak menjadi kecewa karena Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Dan
  rationale: Mempertahankan hubungan langsung dengan perkataan dan konteks sebelumnya.
- source_word: μακάριος
  choice: berbahagialah
  rationale: Ungkapan ini lazim dalam ucapan bahagia dan mempertahankan bobot religius sebagai pernyataan perkenanan atau keadaan yang diberkati, bukan sekadar perasaan senang.
- source_word: ὃς ἐὰν μὴ
  choice: orang yang tidak
  rationale: Menyatakan siapa pun secara umum dengan bentuk yang alami dalam bahasa Indonesia, tanpa membatasi rujukannya pada orang tertentu.
- source_word: σκανδαλισθῇ
  choice: tidak tersandung
  rationale: Mempertahankan metafora tersandung serta kemungkinan makna menjadi goyah, jatuh, atau menolak karena Yesus; bentuk ini lebih luas daripada sekadar merasa tersinggung.
- source_word: ἐν ἐμοί
  choice: karena Aku
  rationale: Dalam konstruksi ini Yesus adalah sebab atau batu sandungan yang mungkin membuat seseorang goyah. 'Karena Aku' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Yesus dengan sengaja menjatuhkan orang itu.
theological_decisions:
- issue: Cakupan makna σκανδαλισθῇ dalam kaitannya dengan Yesus
  choice: Mempertahankan metafora 'tidak tersandung karena Aku' dalam teks utama.
  alternative: tidak menolak Aku; tidak merasa terganggu karena Aku
  rationale: Metafora ini menjaga ketegangan antara iman dan kemungkinan menjadi goyah atau berpaling karena identitas serta karya Yesus. Terjemahan yang hanya menyatakan perasaan tersinggung akan mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Bentuk 'berbahagialah' mempertahankan corak ucapan bahagia, sedangkan 'tersandung' menjaga citra sumber tanpa menjadi kaku. Huruf kapital pada 'Aku' menandai bahwa Yesus sedang berbicara.
