  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: id
  text: Namun, dengan apakah Aku akan membandingkan angkatan ini? Angkatan ini seperti anak-anak yang duduk di pasar-pasar[a] dan berseru kepada yang lain[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lapangan-lapangan pasar.” Kata Yunani ἀγοραῖς menunjuk pada kawasan pasar yang juga menjadi tempat umum untuk berkumpul.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada yang lain.” Dalam perumpamaan ini, konteksnya dapat menyiratkan anak-anak yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: dengan apakah akan Kubandingkan
  rationale: Datif interogatif Τίνι menyatakan pembanding, sedangkan bentuk futur ὁμοιώσω dipakai secara retoris. Susunan ini mempertahankan pertanyaan deliberatif dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa pertentangan ringan. 'Namun' menyampaikan hubungan itu tanpa membuat kontrasnya terlalu tajam.
- source_word: τὴν γενεὰν ταύτην
  choice: angkatan ini
  rationale: γενεά di sini menunjuk kepada orang-orang sezaman yang dipandang sebagai suatu kelompok. 'Angkatan ini' merupakan padanan yang ringkas dan lazim dalam konteks perkataan Yesus.
- source_word: ὁμοία ἐστὶν
  choice: Mereka seperti
  rationale: Walaupun bentuk Yunani secara harfiah berarti 'ia serupa', antesedennya adalah sekelompok orang. Pronomina jamak 'mereka' alami dalam bahasa Indonesia dan tidak mengubah acuannya.
- source_word: παιδίοις
  choice: anak-anak
  rationale: παιδίον merujuk pada anak-anak; konteks tidak menuntut penambahan arti diminutif seperti 'anak-anak kecil'.
- source_word: καθημένοις
  choice: yang duduk
  rationale: Partisipel kini menggambarkan posisi anak-anak dalam adegan tersebut; 'yang duduk' jelas dan alami.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: di tempat-tempat umum
  rationale: ἀγορά adalah kawasan pasar sekaligus ruang publik tempat orang berkumpul. 'Tempat-tempat umum' menyampaikan fungsi lokasinya, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: προσφωνοῦντα
  choice: berseru
  rationale: Kata ini menyatakan tindakan menyapa atau memanggil dengan suara. 'Berseru' cocok dengan adegan anak-anak yang memanggil kelompok lain di ruang publik.
- source_word: τοῖς ἑτέροις
  choice: kepada anak-anak yang lain
  rationale: Teks Yunani secara eksplisit hanya mengatakan 'kepada yang lain', tetapi konteks perumpamaan menunjukkan anak-anak lain. Penjelasan ini menghasilkan bahasa Indonesia yang alami, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
