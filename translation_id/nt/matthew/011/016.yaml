  register: Bahasa Indonesia baku modern dengan nada lisan-retoris yang bermartabat. Kapitalisasi 'Ku-' mengikuti kebiasaan penulisan pronomina yang mengacu kepada Yesus sebagai pembicara ilahi. Tanda koma akhir dipertahankan karena ayat ini berlanjut langsung ke ucapan dalam ayat berikutnya.
