  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: id
  text: Dan jika kalian bersedia menerimanya,[a] dialah Elia yang akan datang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika kalian bersedia menerima hal ini.”
    reason: lexical_alternative
  - marker: b
    text: Di sini Yohanes Pembaptis diidentifikasi sebagai Elia yang akan datang; bandingkan Maleakhi 4:5 dan Matius 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan hubungan langsung dengan perkataan sebelumnya tanpa menafsirkan relasi wacananya secara berlebihan.
- source_word: εἰ θέλετε δέξασθαι
  choice: jika kalian bersedia menerimanya
  rationale: θέλετε dengan infinitif menyatakan kesediaan, sedangkan δέξασθαι menyatakan penerimaan. Akhiran -nya melengkapi objek yang tersirat secara wajar dalam bahasa Indonesia, yakni pernyataan atau pengenalan yang baru disampaikan.
- source_word: αὐτός
  choice: dialah
  rationale: Mengacu kepada Yohanes Pembaptis dan secara alami mempertahankan penekanan pada αὐτός lebih baik daripada sekadar 'dia'.
- source_word: ἐστιν Ἠλίας
  choice: Elia
  rationale: Nama Ἠλίας diterjemahkan dengan bentuk baku Indonesia 'Elia'; kopula tercakup dalam konstruksi 'dialah Elia'.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: yang akan datang
  rationale: Mempertahankan pengharapan berorientasi masa depan dalam ungkapan Yunani serta gema nubuatannya, tanpa mempersempitnya menjadi kedatangan yang segera.
theological_decisions:
- issue: Pengenalan Yohanes Pembaptis sebagai Elia
  choice: dialah Elia yang akan datang
  alternative: dia menjalankan peran Elia; dia seperti Elia
  rationale: Teks Yunani menyatakan pengenalan itu secara langsung, tetapi mendahuluinya dengan syarat mengenai kesediaan para pendengar untuk menerima. Terjemahan mempertahankan ketegasan sekaligus ketegangan teologis tersebut, tanpa mengubahnya menjadi sekadar kemiripan atau menjelaskan hakikat pengenalannya di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' menyatakan bentuk jamak dari θέλετε dengan jelas dan tetap mudah dipahami. Susunan penanda catatan kaki mengikuti unsur yang diterangkannya.
