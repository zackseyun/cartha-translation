  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: id
  text: Sebab semua nabi dan Hukum Taurat bernubuat hingga Yohanes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hingga zaman Yohanes.” Frasa ini dapat menampilkan Yohanes sebagai puncak kesaksian kenabian atau sebagai batas yang menandai peralihannya.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: semua
  rationale: Menerangkan seluruh kelompok nabi secara kolektif dan wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: οἱ προφῆται
  choice: para nabi
  rationale: Padanan baku bagi orang-orang yang menyampaikan pesan kenabian atas nama Allah.
- source_word: ὁ νόμος
  choice: Hukum Taurat
  rationale: Dalam pasangan dengan para nabi, frasa ini menunjuk pada Taurat sebagai korpus Kitab Suci Israel, bukan hukum secara umum.
- source_word: ἕως Ἰωάννου
  choice: sampai kepada Yohanes
  rationale: Menyatakan batas waktu secara ringkas sambil mempertahankan ambiguitas apakah Yohanes merupakan puncak kesaksian kenabian atau batas peralihannya.
- source_word: ἐπροφήτευσαν
  choice: bernubuat
  rationale: Padanan langsung yang mempertahankan personifikasi bahwa baik para nabi maupun Hukum Taurat memberikan kesaksian kenabian.
theological_decisions:
- issue: Apakah ὁ νόμος merupakan sebutan bagi korpus Kitab Suci atau hukum secara umum
  choice: Hukum Taurat
  alternative: hukum
  rationale: Konteks pasangan “para nabi dan Hukum Taurat” menunjuk pada kesaksian Kitab Suci Israel. Pilihan ini memperjelas rujukan tanpa menambahkan gagasan baru.
- issue: Apakah ἕως Ἰωάννου mencakup Yohanes dalam zaman kenabian atau hanya menjadikannya titik akhir
  choice: sampai kepada Yohanes
  alternative: hingga zaman Yohanes
  rationale: Bahasa Yunani tidak sepenuhnya menentukan apakah Yohanes termasuk sebagai puncak atau berdiri pada batas peralihan; terjemahan utama menjaga ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hukum Taurat” dipakai sebagai istilah yang mudah dikenali pembaca umum; susunan kalimat tetap mempertahankan bahwa Hukum Taurat, bersama para nabi, menjadi subjek kata kerja “bernubuat”.
