id: MAT.11.22
reference: Matthew 11:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: id
  text: 'Namun, Aku berkata kepada kalian: Pada hari penghakiman, bagi Tirus dan Sidon hal itu akan lebih mudah ditanggung[a] daripada bagi kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lebih tertanggungkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai pertentangan tegas dengan kecaman sebelumnya, dengan gaya yang wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan rumusan ujaran langsung dan sapaan jamak dalam bahasa Yunani; 'kalian' membuat bentuk jamaknya jelas.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Tirus dan Sidon
  rationale: Nama kedua kota dipertahankan dalam bentuk baku bahasa Indonesia. Hubungan datif komparatif diungkapkan melalui konstruksi 'apa yang dialami ... daripada apa yang ... alami'.
- source_word: ἀνεκτότερον
  choice: lebih ringan
  rationale: Ungkapan Indonesia yang alami untuk sesuatu yang secara perbandingan lebih mudah ditanggung. Catatan kaki mempertahankan padanan yang lebih harfiah.
- source_word: ἔσται
  choice: akan
  rationale: Menandai aspek masa depan dari ἔσται secara alami dalam bahasa Indonesia.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: Pada hari penghakiman
  rationale: Mengungkapkan waktu peristiwa penghakiman yang dimaksud tanpa menambahkan rincian doktrinal.
- source_word: κρίσεως
  choice: penghakiman
  rationale: Mempertahankan arti peristiwa atau tindakan yudisial, bukan mempersempitnya menjadi hasil berupa penghukuman.
- source_word: ἢ ὑμῖν
  choice: daripada apa yang kalian alami
  rationale: Melengkapi perbandingan dan mempertahankan sapaan jamak; pengulangan 'alami' menghasilkan kalimat Indonesia yang jelas.
theological_decisions:
- issue: Hakikat penghakiman yang akan datang
  choice: hari penghakiman
  alternative: suatu hari penghakiman
  rationale: Dalam konteks Matius, frasa ini secara idiomatis menunjuk kepada peristiwa penghakiman yang dikenal. Terjemahan ini tidak menambahkan penjelasan mengenai bentuk atau hasil akhirnya.
- issue: Hal yang menjadi lebih ringan
  choice: apa yang dialami Tirus dan Sidon
  alternative: hukuman Tirus dan Sidon
  rationale: Konstruksi ini menghindari penyempitan ἀνεκτότερον dan κρίσις menjadi 'hukuman' saja, sambil menyampaikan secara alami bahwa pengalaman mereka pada penghakiman akan lebih dapat ditanggung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk menyatakan jamaknya ὑμῖν secara eksplisit. Susunan impersonal bahasa Yunani dialihkan menjadi 'apa yang dialami' agar alami dalam bahasa Indonesia tanpa menentukan secara berlebihan bentuk penghakiman tersebut.
