id: MAT.11.23
reference: Matthew 11:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: id
  text: Dan engkau, Kapernaum, apakah engkau akan ditinggikan sampai ke surga? Engkau akan turun ke Hades.[a] Sebab, seandainya perbuatan-perbuatan penuh kuasa yang terjadi di tengah-tengahmu itu pernah terjadi di Sodom, kota itu tentu masih ada sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alam orang mati”. Yunaninya Hades, bukan Gehenna.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang baku dan lazim dalam bahasa Indonesia.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: apakah engkau akan ditinggikan sampai ke surga?
  rationale: μή bersama bentuk verba ini paling wajar dipahami sebagai pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk pasif dan metafora spasial dipertahankan tanpa menentukan siapa pelakunya.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Engkau akan turun ke Hades
  rationale: καταβαίνω berarti turun, sedangkan ᾅδης ditransliterasikan sebagai Hades agar tidak disamakan begitu saja dengan istilah hukuman akhir seperti Gehenna atau neraka.
- source_word: δυνάμεις
  choice: perbuatan-perbuatan penuh kuasa
  rationale: Ungkapan ini mempertahankan unsur perbuatan konkret sekaligus kuasa, tanpa mempersempit maknanya hanya menjadi mukjizat dalam pengertian modern.
- source_word: γενόμεναι ἐν σοί
  choice: yang terjadi di tengah-tengahmu
  rationale: Menyampaikan bahwa perbuatan-perbuatan itu berlangsung di dalam wilayah kota yang sedang disapa sebagai pribadi.
- source_word: ἐγενήθησαν
  choice: terjadi
  rationale: Dalam konstruksi pengandaian yang berlawanan dengan kenyataan, bahasa Indonesia tidak memerlukan bentuk kala khusus; seandainya menandai sifat kontrafaktualnya.
- source_word: ἔμεινεν ἂν
  choice: kota itu tentu masih ada
  rationale: Subjek tunggalnya adalah Sodom sebagai sebuah kota. Masih ada menyampaikan keberlangsungan hingga masa kini, sedangkan tentu menandai akibat hipotesis ἄν.
- source_word: μέχρι τῆς σήμερον
  choice: sampai hari ini
  rationale: Padanan alami dan langsung bagi batas waktu yang dinyatakan teks Yunani.
theological_decisions:
- issue: Pemaknaan ᾅδης
  choice: Hades
  alternative: alam orang mati; neraka
  rationale: Transliterasi Hades mempertahankan istilah Yunani dan menghindari penyamaan tanpa dasar dengan Gehenna atau konsep populer tentang neraka. Catatan kaki memberi padanan maknawi yang membantu pembaca.
- issue: Bentuk ujaran μὴ ἕως οὐρανοῦ ὑψωθήσῃ
  choice: 'pertanyaan retoris: apakah engkau akan ditinggikan sampai ke surga?'
  alternative: engkau tidak akan ditinggikan sampai ke surga
  rationale: μή paling mungkin memperkenalkan pertanyaan yang mengharapkan jawaban negatif. Bentuk pertanyaan mempertahankan daya retoris serta ambiguitas sintaksis yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal engkau dipakai karena kota dipersonifikasikan. Frasa di tengah-tengahmu lebih alami daripada di dalammu untuk sebuah kota, dan kota itu memperjelas bahwa Sodom adalah subjek tunggal yang tetap ada.
