  verdict: revise
  source_fidelity: Makna pokok diterjemahkan dengan setia. Pertanyaan retoris dengan μή dipertahankan, demikian pula kontras spasial surga–Hades, sifat kontrafaktual pengandaian tentang Sodom, dan kelangsungan sampai masa kini. Hades tepat dipertahankan sebagai transliterasi, bukan disamakan dengan Gehenna.
  naturalness: Bahasa umumnya baku dan jelas. Namun, pengulangan langsung “yang terjadi ... terjadi” terasa kurang luwes dalam bahasa Indonesia. Penambahan “pernah” pada kejadian hipotetis di Sodom membuat hubungan kontrafaktual lampau lebih alami tanpa mengubah makna.
  terminology: “Kapernaum,” “surga,” “Hades,” “Gehenna,” dan “perbuatan-perbuatan penuh kuasa” konsisten dengan sumber dan register modern baku. Catatan kaki secara tepat membedakan Hades dari Gehenna.
  issues:
