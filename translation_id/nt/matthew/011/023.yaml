    issue: Pengulangan verba “terjadi” dalam anak kalimat pengandaian.
    rationale: Walaupun mencerminkan dua bentuk γίνομαι dalam bahasa Yunani, susunan “yang terjadi di tengah-tengahmu terjadi di Sodom” terdengar berulang dalam bahasa Indonesia. “Pernah terjadi di Sodom” tetap menyampaikan peristiwa yang secara kontrafaktual ditempatkan pada masa lampau.
