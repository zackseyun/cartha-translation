id: MAT.11.1
reference: Matthew 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: id
  text: Setelah Yesus selesai memberikan petunjuk kepada kedua belas murid-Nya[a], Ia berangkat dari sana untuk mengajar dan berkhotbah di kota-kota mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberikan perintah kepada kedua belas murid-Nya”.'
    reason: lexical_alternative
  - marker: b
    text: Frasa “kota-kota mereka” ambigu dalam bahasa Yunani; frasa ini dapat menunjuk pada kota-kota para murid atau, secara lebih umum, kota-kota penduduk di wilayah sekitar.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Setelah
  rationale: Ungkapan peralihan naratif khas Matius ini membentuk latar waktu bagi tindakan utama. “Setelah” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia tanpa mempertahankan bentuk Semitis yang terasa kaku.
- source_word: ἐτέλεσεν
  choice: selesai
  rationale: Kata ini menandai bahwa pemberian petunjuk telah rampung sebelum Yesus berangkat.
- source_word: διατάσσων
  choice: memberikan petunjuk
  rationale: Partisip ini berarti memberi arahan atau perintah. “Memberikan petunjuk” sesuai dengan konteks pengarahan kepada para murid dan tetap mengisyaratkan otoritas, sedangkan kemungkinan arti yang lebih tegas dicatat dalam catatan kaki.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: kepada kedua belas murid-Nya
  rationale: “Murid” adalah padanan baku dan tepat bagi μαθητής dalam konteks Injil; jumlah dua belas dan hubungan dengan Yesus dipertahankan secara eksplisit.
- source_word: μετέβη ἐκεῖθεν
  choice: Ia berangkat dari sana
  rationale: Ungkapan ini secara alami menyatakan perpindahan Yesus dari tempat sebelumnya ke tempat lain.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: untuk mengajar dan berkhotbah
  rationale: Infinitif berartikel menyatakan tujuan. Dua kegiatan yang berbeda tetap dipertahankan; “berkhotbah” merupakan padanan Indonesia yang alami bagi pemberitaan terbuka dalam konteks pelayanan Yesus.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: di kota-kota mereka
  rationale: Terjemahan ini mempertahankan πόλεις sebagai “kota-kota” dan membiarkan rujukan kata ganti αὐτῶν tetap ambigu sebagaimana dalam teks Yunani.
theological_decisions:
- issue: Rujukan αὐτῶν dalam frasa ἐν ταῖς πόλεσιν αὐτῶν
  choice: Mempertahankan ungkapan ambigu “kota-kota mereka”.
  alternative: Menentukan frasa itu sebagai kota-kota asal para murid atau sebagai kota-kota penduduk di wilayah tersebut.
  rationale: Teks Yunani tidak menyebutkan secara tegas siapa yang dirujuk oleh kata ganti tersebut. Terjemahan tidak seharusnya menyelesaikan ketidakjelasan yang dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi “Ia” dan bentuk enklitik “-Nya” dipakai sebagai penghormatan kepada Yesus tanpa menambahkan penafsiran pada teks.
