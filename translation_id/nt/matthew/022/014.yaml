  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: id
  text: Sebab banyak yang dipanggil[a], tetapi sedikit yang dipilih[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diundang”; dalam konteks perjamuan ini, kata tersebut dapat mengandung nuansa undangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “terpilih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak
  rationale: Adjektiva ini dipakai secara substantival dan berkontras langsung dengan ὀλίγοι; “banyak” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: γάρ
  choice: sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan penjelas tersebut dengan gaya yang wajar dan bermartabat.
- source_word: εἰσιν
  choice: yang
  rationale: Dalam konstruksi Indonesia “banyak yang dipanggil,” fungsi kopula Yunani dinyatakan secara alami melalui pola “banyak yang ...”; menerjemahkannya secara terpisah sebagai “adalah” akan terasa kaku.
- source_word: κλητοὶ
  choice: dipanggil
  rationale: Kata ini dapat berarti “dipanggil” atau, dalam konteks perjamuan, “diundang.” “Dipanggil” mempertahankan keluasan makna dan kontras leksikal-teologisnya dengan ἐκλεκτοί, sementara nuansa undangan dicatat dalam catatan kaki.
- source_word: ὀλίγοι
  choice: sedikit
  rationale: Padanan langsung yang alami bagi lawan πολλοί dan mempertahankan bentuk pepatah yang singkat.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menyatakan kontras antara banyak yang dipanggil dan sedikit yang dipilih.
- source_word: ἐκλεκτοί
  choice: dipilih
  rationale: “Dipilih” menyampaikan arti dasar kata Yunani secara jelas dalam bahasa Indonesia masa kini tanpa menjadikan istilah teologis teknis sebagai satu-satunya tafsiran.
theological_decisions:
- issue: Penerjemahan ἐκλεκτοί dalam ayat yang sering dikaitkan dengan doktrin pemilihan
  choice: dipilih
  alternative: orang-orang pilihan
  rationale: Bentuk “dipilih” mempertahankan arti leksikal dasar dan ketegangan teologis teks tanpa memasukkan rumusan denominasi tertentu. Alternatif nominal “orang-orang pilihan” tetap sah dan dicantumkan dalam catatan kaki.
- issue: Penerjemahan κλητοί dalam konteks perumpamaan perjamuan kawin
  choice: dipanggil
  alternative: diundang
  rationale: “Diundang” sangat sesuai dengan gambaran perjamuan, tetapi “dipanggil” mempertahankan jangkauan semantis yang lebih luas serta hubungan ungkapan ini dengan tema panggilan. Catatan kaki menjaga kemungkinan kontekstual “diundang”.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada pepatah. Koma sesudah “Sebab” membantu alur baca, sedangkan pola “banyak yang ... sedikit yang ...” menghindari kopula yang kaku dan mempertahankan kesejajaran Yunani.
