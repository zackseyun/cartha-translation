id: MAT.22.5
reference: Matthew 22:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: id
  text: Tetapi mereka tidak mengindahkannya[a] dan pergi, yang seorang ke ladangnya sendiri, yang lain ke usahanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memedulikannya” atau “mengabaikannya”; yang dimaksud dalam konteks ialah undangan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: tidak mengindahkannya
  rationale: Partisip ini menyatakan sikap tidak peduli atau mengabaikan. Bentuk dengan -nya secara wajar merujuk pada undangan atau panggilan raja dalam konteks, tanpa mempersempitnya secara berlebihan.
- source_word: ἀπῆλθον
  choice: pergi
  rationale: Pilihan ini alami dalam narasi Indonesia dan mempertahankan gerak meninggalkan panggilan tersebut tanpa nuansa formal berlebihan.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: yang seorang ... yang lain
  rationale: Konstruksi distributif ini membedakan tujuan masing-masing orang dan dipertahankan dalam bentuk Indonesia yang jelas serta wajar.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: ke ladangnya sendiri
  rationale: Ladang merupakan padanan langsung bagi ἀγρός, sedangkan sendiri mempertahankan penekanan ἴδιον pada miliknya pribadi.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: ke usahanya
  rationale: ἐμπορία menunjuk pada kegiatan dagang atau bisnis. Usaha adalah padanan Indonesia modern yang alami dan cukup luas untuk mempertahankan cakupan maknanya.
theological_decisions:
- issue: Objek tersirat dari ἀμελήσαντες
  choice: Menggunakan pronomina “-nya” yang dalam konteks merujuk pada undangan atau panggilan raja.
  alternative: “mengabaikan undangan itu” atau “tidak memedulikannya”
  rationale: Bahasa Yunani tidak menyebutkan objek secara eksplisit, tetapi konteks langsung menyediakannya. Pronomina mempertahankan sebagian sifat implisit itu sambil menghasilkan bahasa Indonesia yang alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan “yang seorang ... yang lain” mempertahankan kesejajaran distributif teks Yunani.
