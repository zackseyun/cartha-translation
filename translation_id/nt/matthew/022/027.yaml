  text: Last of all[a], the woman died.
translation:
  language: id
  text: Akhirnya, perempuan itu pun meninggal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada akhirnya, perempuan itu meninggal”; secara harfiah, “Belakangan/terakhir dari semuanya, perempuan itu meninggal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Akhirnya
  rationale: Dalam gabungan dengan πάντων, kata ini menyatakan urutan terakhir dalam rangkaian peristiwa; “akhirnya” alami dan jelas dalam bahasa Indonesia.
- source_word: δὲ
  choice: pun
  rationale: δέ merupakan penghubung ringan. Partikel “pun” secara alami menandai kelanjutan sekaligus peristiwa penutup tanpa memberi pertentangan yang terlalu kuat.
- source_word: πάντων
  choice: setelah mereka semua
  rationale: Genitif jamak ini merujuk kepada semua saudara yang telah disebutkan. Ungkapan ini mempertahankan unsur “semua” serta hubungan urutan yang tersirat dalam konstruksi Yunani.
- source_word: ἀπέθανεν
  choice: meninggal
  rationale: Kata kerja ini menyatakan kematian secara langsung. “Meninggal” adalah padanan baku, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: ἡ γυνή
  choice: perempuan itu
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Dalam skenario yang melibatkan beberapa suami, “perempuan itu” mempertahankan acuan Yunani tanpa mengaitkannya secara khusus dengan satu suami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “setelah mereka semua” memperjelas bahwa perempuan itu meninggal sesudah semua laki-laki yang disebut sebelumnya, sedangkan “akhirnya” mempertahankan fungsi rangkuman urutan.
