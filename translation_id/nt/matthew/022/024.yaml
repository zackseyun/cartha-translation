  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: id
  text: kata mereka, “Guru, Musa berkata, ‘Jika seorang laki-laki meninggal tanpa mempunyai anak, saudaranya harus menikahi jandanya[a] dan memberikan keturunan bagi saudaranya itu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “saudaranya harus menjalankan kewajiban sebagai saudara ipar terhadap janda saudaranya.” Kata Yunani ini secara khusus menunjuk pada perkawinan levirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan langsung kepada Yesus sebagai pengajar; jelas, alami, dan sesuai dengan pemakaian modern.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Jika seorang laki-laki meninggal
  rationale: Konteks hukum perkawinan levirat secara khusus membicarakan seorang laki-laki yang meninggal; terjemahan ini mempertahankan peran gender dalam sumber.
- source_word: μὴ ἔχων τέκνα
  choice: tanpa mempunyai anak
  rationale: τέκνα berarti anak-anak secara umum, bukan khusus anak laki-laki; bentuk ini alami dan tetap dekat dengan konstruksi partisipial Yunani.
- source_word: ἐπιγαμβρεύσει
  choice: harus menikahi jandanya
  rationale: Kata kerja ini menunjuk pada kewajiban perkawinan levirat. 'Menikahi jandanya' menyampaikan tindakan dan memperjelas status perempuan tersebut dalam bahasa Indonesia.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: jandanya
  rationale: Dalam konteks, perempuan itu adalah istri laki-laki yang telah meninggal dan karena itu kini menjadi jandanya; pilihan ini mencegah rujukan pronominal yang rancu.
- source_word: ἀναστήσει σπέρμα
  choice: memberikan keturunan
  rationale: Ungkapan idiomatis ini berarti menghasilkan keturunan yang diperhitungkan bagi saudara yang meninggal; 'memberikan keturunan' alami dalam bahasa Indonesia dan mempertahankan arah relasionalnya.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: bagi saudaranya itu
  rationale: 'Datif menyatakan manfaat atau peruntukan: keturunan tersebut diperhitungkan bagi saudara yang telah meninggal. Kata ''itu'' membantu memperjelas rujukannya.'
theological_decisions:
- issue: Pengungkapan contoh hukum dengan peran gender tertentu
  choice: Memakai 'seorang laki-laki' dan 'saudaranya' sesuai peran laki-laki dalam kasus hukum ini
  alternative: Jika seseorang meninggal ... saudara orang itu
  rationale: Ayat ini mengutip hukum perkawinan levirat Musa yang dirumuskan dengan peran keluarga laki-laki tertentu; menetralkannya dapat mengaburkan sifat kasus hukum yang sedang dibahas.
- issue: Status keturunan dalam perkawinan levirat
  choice: Mempertahankan frasa 'bagi saudaranya itu' tanpa menjelaskan lebih jauh di dalam teks
  alternative: memberikan keturunan yang akan dianggap sebagai keturunan saudaranya yang meninggal
  rationale: Teks Yunani menyatakan peruntukan keturunan bagi saudara yang meninggal, tetapi tidak merinci mekanisme hukum atau teologisnya. Terjemahan mempertahankan kepadatan dan ketegangan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada percakapan yang tetap bermartabat. 'Kata mereka' melanjutkan konstruksi dari ayat sebelumnya. Istilah teknis 'levirat' ditempatkan dalam catatan kaki dan dijelaskan dengan bahasa umum.
