base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Milik Kaisar.” Lalu ia berkata kepada mereka, “Karena itu, serahkanlah[a] kepada Kaisar apa yang menjadi milik Kaisar, dan kepada Allah apa yang menjadi milik Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini juga dapat berarti “berikanlah kembali”, “bayarlah”, atau “tunaikanlah yang menjadi kewajibanmu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Mereka berkata kepadanya
  rationale: Bentuk kini Yunani berfungsi sebagai bentuk kini historis; bentuk lampau dipahami secara alami dari alur narasi bahasa Indonesia tanpa perlu penanda waktu tambahan. Dativa αὐτῷ dinyatakan dengan “kepadanya”.
- source_word: Καίσαρος
  choice: Milik Kaisar
  rationale: Genitiva ini menjawab pertanyaan tersirat tentang pemilik gambar dan tulisan pada uang itu. “Milik Kaisar” merupakan jawaban ringkas dan alami dalam bahasa Indonesia.
- source_word: τότε λέγει αὐτοῖς
  choice: Lalu ia berkata kepada mereka
  rationale: “Lalu” menandai urutan percakapan, sedangkan bentuk kini historis λέγει dialihkan secara alami dalam narasi Indonesia.
- source_word: Ἀπόδοτε
  choice: serahkanlah
  rationale: ἀποδίδωμι dapat berarti memberikan kembali, membayar, atau menyerahkan apa yang menjadi hak pihak lain. “Serahkanlah” mempertahankan tuntutan untuk memberikan kepada pihak yang berhak tanpa membatasi perkataan ini hanya pada pembayaran pajak.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata ini menyatakan kesimpulan yang ditarik dari jawaban mereka mengenai Kaisar.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: kepada Kaisar apa yang menjadi milik Kaisar
  rationale: Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan gagasan kepunyaan dan sasaran pemberian.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: kepada Allah apa yang menjadi milik Allah
  rationale: Pilihan ini mempertahankan kesejajaran retoris dengan klausa tentang Kaisar dan tidak mempersempit cakupan tuntutan Allah.
theological_decisions:
- issue: Cakupan kewajiban kepada penguasa dan kepada Allah
  choice: Mempertahankan dua klausa sejajar tanpa menjabarkannya menjadi teori politik atau membatasinya pada pajak semata
  alternative: Menafsirkannya hanya sebagai perintah membayar pajak, atau sebagai pengesahan mutlak atas kuasa negara
  rationale: Teks Yunani membedakan apa yang menjadi milik Kaisar dari apa yang menjadi milik Allah, tetapi tidak menguraikan batas keduanya. Terjemahan mempertahankan ketegangan dan keterbukaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel perkataan Yesus dipertahankan. Kata ganti “ia” tidak diberi kapital khusus agar teks tidak memasukkan konvensi penghormatan yang tidak ditandai dalam bahasa Yunani.
