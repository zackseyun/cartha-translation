  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: id
  text: Lalu mereka mengutus murid-murid mereka bersama orang-orang Herodian kepada Yesus, sambil berkata, “Guru, kami tahu bahwa Engkau benar dan mengajarkan jalan Allah sesuai dengan kebenaran. Engkau tidak terpengaruh oleh siapa pun, karena Engkau tidak memandang muka orang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: mereka mengutus
  rationale: Present historis Yunani dialihkan secara alami dalam alur naratif Indonesia; bentuk ini tidak memaksakan keterangan waktu tambahan.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: murid-murid mereka
  rationale: Mempertahankan istilah Injil yang lazim untuk para pengikut atau pelajar mereka.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: bersama para pendukung Herodes
  rationale: Ἡρῳδιανοί menunjuk kelompok yang bersekutu dengan atau mendukung dinasti Herodes; bentuk deskriptif ini lebih mudah dipahami daripada transliterasi yang tidak lazim.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan alami dan tepat bagi orang yang mengajar, tanpa menambahkan nuansa hierarkis.
- source_word: ἀληθὴς εἶ
  choice: Engkau tulus
  rationale: Dalam konteks sanjungan tentang watak dan pengajaran Yesus, 'tulus' menyampaikan bahwa Ia benar atau jujur, bukan sekadar bahwa keberadaan-Nya nyata.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: jalan Allah
  rationale: Mempertahankan metafora sumber yang dapat mencakup kehendak Allah dan cara hidup yang dikehendaki-Nya.
- source_word: ἐν ἀληθείᾳ
  choice: sesuai dengan kebenaran
  rationale: Ungkapan Indonesia yang alami untuk tindakan mengajar yang selaras dengan kebenaran, sambil mempertahankan hubungan eksplisit dengan ἀλήθεια.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Engkau tidak terpengaruh oleh siapa pun
  rationale: Dalam hubungan dengan klausa berikutnya, idiom ini menyatakan bahwa penilaian atau kedudukan orang tidak menggoyahkan Yesus, bukan bahwa Ia tidak peduli terhadap manusia.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: karena Engkau tidak memandang kedudukan orang
  rationale: Menyampaikan idiom Semitik/Yunani tentang tidak memihak berdasarkan muka, status, atau kedudukan; terjemahan harfiah 'melihat wajah' mudah disalahpahami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ketidakberpihakan dalam dua klausa terakhir
  choice: “Engkau tidak terpengaruh oleh siapa pun, karena Engkau tidak memandang kedudukan orang”
  alternative: “Engkau tidak peduli kepada siapa pun, karena Engkau tidak melihat wajah manusia”
  rationale: Alternatif harfiah dapat menyiratkan ketidakpedulian moral dan tindakan melihat wajah secara fisik. Konteks perangkap mengenai pajak menunjukkan maksudnya ialah Yesus tidak dapat dipengaruhi oleh pendapat atau status sosial siapa pun. Terjemahan utama mengungkapkan daya idiom itu tanpa memasukkan ajaran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Sapaan kepada Yesus memakai 'Engkau' sebagai konvensi Alkitab Indonesia. Kalimat panjang Yunani dipecah setelah penyebutan para pendukung Herodes agar mudah dibaca tanpa mengubah hubungan gagasannya.
