  to: Lalu mereka mengutus murid-murid mereka bersama orang-orang Herodian kepada Yesus, sambil berkata, “Guru, kami tahu bahwa Engkau benar dan mengajarkan jalan Allah sesuai dengan kebenaran. Engkau tidak terpengaruh oleh siapa pun, karena Engkau tidak memandang muka orang.”
  rationale: Revisi memperbaiki padanan ἀληθής, mempertahankan identitas historis Ἡρῳδιανοί, dan menggunakan idiom Indonesia yang jelas bagi ketidakberpihakan tanpa menambahkan tafsiran doktrinal. Tidak diperlukan catatan kaki, karena idiom utama telah tersampaikan secara alami dan tidak ada jangkar catatan kaki yang harus dipertahankan.
