    rationale: '"Tulus" terutama menunjuk kemurnian atau ketidakberpura-puraan niat. Dalam konteks ini ἀληθής mencakup bahwa Yesus benar/jujur dan bahwa pengajaran-Nya benar; "Engkau benar" lebih luas dan lebih dekat pada sumber.'
  - severity: low
    issue: '"para pendukung Herodes" menggantikan nama kelompok "Herodian"'
