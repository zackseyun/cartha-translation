id: MAT.22.30
reference: Matthew 22:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: id
  text: Sebab dalam kebangkitan orang tidak menikah ataupun dinikahkan, melainkan seperti para malaikat Allah di surga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: dalam kebangkitan
  rationale: Mempertahankan preposisi ἐν dan dapat menunjuk pada keadaan atau masa kehidupan sesudah dibangkitkan; ungkapan ini juga menjaga keluasan makna sumber.
- source_word: γαμοῦσιν
  choice: menikah
  rationale: Padanan Indonesia modern yang alami bagi tindakan memasuki perkawinan tanpa mempersempitnya hanya kepada laki-laki.
- source_word: γαμίζονται
  choice: dinikahkan
  rationale: Bentuk pasif ini dibedakan dari γαμοῦσιν dan menyatakan bahwa seseorang diberikan atau diserahkan dalam perkawinan.
- source_word: ὡς
  choice: seperti
  rationale: Menandai perbandingan, bukan persamaan identitas; manusia yang dibangkitkan tidak dinyatakan menjadi malaikat.
- source_word: ἄγγελοι θεοῦ
  choice: malaikat-malaikat Allah
  rationale: Mewakili bentuk jamak ἄγγελοι serta genitif θεοῦ secara transparan dan wajar dalam bahasa Indonesia.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam konteks tempat keberadaan malaikat, οὐρανός menunjuk pada surga, bukan langit fisik.
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga hubungan penjelasan atau alasan dengan pernyataan pada ayat sebelumnya.
theological_decisions:
- issue: Sifat perbandingan dengan malaikat
  choice: Orang yang dibangkitkan seperti malaikat, terutama dalam kaitannya dengan tidak menikah atau dinikahkan.
  alternative: Perbandingan itu dapat dipahami lebih luas sebagai cara keberadaan yang menyerupai malaikat.
  rationale: ὡς menyatakan kemiripan, bukan perubahan identitas. Konteks langsung menonjolkan ketiadaan perkawinan, tetapi terjemahan tidak menambahkan pembatas seperti 'dalam hal ini saja' yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Orang' ditambahkan secara wajar sebagai subjek umum yang tersirat dalam verba orang ketiga jamak Yunani. Tidak digunakan catatan kaki karena alternatif 'pada waktu kebangkitan' tidak diperlukan untuk memahami ayat dan bukan varian teks.
