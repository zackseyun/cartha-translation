id: MAT.22.12
reference: Matthew 22:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Saudara, bagaimana kamu bisa masuk ke sini tanpa mengenakan pakaian pesta pernikahan?” Namun, orang itu tidak dapat menjawab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dibuat terdiam.” Kata kerja Yunani ini juga dapat berarti “diberangus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Saudara
  rationale: Sapaan ini dapat terdengar sopan, tetapi dalam konteksnya berjarak dan menegur. “Saudara” merupakan sapaan Indonesia yang alami dan tidak menambahkan kehangatan ataupun permusuhan yang tidak dinyatakan oleh teks Yunani.
- source_word: πῶς
  choice: bagaimana
  rationale: Kata ini menanyakan cara atau keadaan yang memungkinkan orang itu masuk, bukan secara langsung menanyakan motifnya.
- source_word: εἰσῆλθες ὧδε
  choice: kamu bisa masuk ke sini
  rationale: Ungkapan ini menyampaikan tindakan masuk yang sudah terjadi dan membuat pertanyaan tersebut alami dalam bahasa Indonesia; “bisa” di sini menyatakan keheranan tentang bagaimana hal itu terjadi, bukan kemampuan umum.
- source_word: μὴ ἔχων
  choice: tanpa mengenakan
  rationale: Dalam hubungannya dengan pakaian, bentuk partisip Yunani ini paling alami diterjemahkan “tanpa mengenakan,” sambil tetap menyatakan bahwa pakaian yang dimaksud tidak ada padanya.
- source_word: ἔνδυμα γάμου
  choice: pakaian pesta pernikahan
  rationale: Frasa ini menunjuk pada pakaian yang berkaitan dengan pesta pernikahan tanpa menentukan secara lebih sempit apakah itu jubah atau jenis pakaian tertentu.
- source_word: ἐφιμώθη
  choice: tidak dapat menjawab
  rationale: Bentuk pasif verba ini secara harfiah dapat berarti dibuat diam atau diberangus. Dalam konteks pertanyaan tersebut, hasilnya ialah orang itu tidak mampu memberikan jawaban; alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Nada sapaan tuan rumah kepada tamu yang tidak berpakaian semestinya
  choice: Sapaan sopan tetapi berjarak dan bernada teguran, “Saudara”
  alternative: “Kawan” atau “Teman”
  rationale: 'Pilihan ini menjaga ketegangan naratif: sapaan tersebut tidak harus dibaca sebagai keramahan yang akrab ataupun penghinaan terbuka.'
- issue: Makna ἐφιμώθη
  choice: 'Hasil kontekstual: “tidak dapat menjawab”'
  alternative: 'Terjemahan lebih harfiah: “dibuat terdiam” atau “diberangus”'
  rationale: Terjemahan utama menyatakan respons orang itu terhadap pertanyaan tanpa menetapkan apakah kebisuannya terutama karena malu, bersalah, atau dipaksa diam; citra harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Dialog memakai “kamu” karena relasi vertikal tuan rumah dengan tamu dalam perumpamaan, sedangkan “Saudara” mempertahankan sapaan yang sopan namun berjarak. Penanda catatan kaki ditempatkan langsung setelah klausa yang dijelaskannya.
