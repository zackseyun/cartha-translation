  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: id
  text: Setelah mendengar itu[a], mereka takjub, lalu meninggalkan Dia dan pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “itu” tidak dinyatakan secara eksplisit dalam teks Yunani, tetapi tersirat dari konteks.
    reason: clarification_of_implicit_object
lexical_decisions:
- source_word: ἀκούσαντες
  choice: setelah mendengar itu
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului kata kerja utama. Bentuk klausa waktu alami dalam bahasa Indonesia, sedangkan “itu” menyatakan objek yang tersirat dari konteks.
- source_word: ἐθαύμασαν
  choice: mereka takjub
  rationale: Kata kerja ini menyatakan rasa heran atau kagum yang kuat. “Takjub” ringkas, alami, dan sesuai dengan reaksi mereka terhadap jawaban Yesus.
- source_word: ἀφέντες αὐτὸν
  choice: meninggalkan Dia
  rationale: Dalam konteks ini ἀφίημι berarti meninggalkan seseorang. “Meninggalkan Dia” mempertahankan pronomina Yunani tanpa menambahkan gagasan bahwa Dia ditinggalkan sendirian.
- source_word: ἀπῆλθαν
  choice: pergi
  rationale: ἀπέρχομαι berarti pergi atau beranjak dari suatu tempat. Karena tindakan meninggalkan sudah disebutkan, “pergi” menyampaikan gerak naratif secara alami tanpa pengulangan yang kaku.
- source_word: καὶ ... καὶ
  choice: lalu ... dan
  rationale: Rangkaian tindakan yang dihubungkan dengan καί diungkapkan secara alami dalam bahasa Indonesia dengan “lalu” dan “dan”, sambil mempertahankan urutan peristiwanya.
