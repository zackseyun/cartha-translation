  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: id
  text: Lalu salah seorang di antara mereka, seorang ahli Taurat,[a] bertanya kepada Yesus untuk menguji-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang ahli hukum Taurat." Istilah Yunani ini menunjuk kepada orang yang ahli dalam hukum Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, kata ini mengaitkan tindakan tersebut dengan konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐπηρώτησεν
  choice: bertanya kepada
  rationale: Menyampaikan tindakan mengajukan pertanyaan dengan wajar tanpa menambahkan objek seperti 'sebuah pertanyaan' yang tidak dinyatakan tersendiri dalam teks Yunani.
- source_word: εἷς ἐξ αὐτῶν
  choice: seorang dari antara mereka
  rationale: Mempertahankan ungkapan partitif bahwa orang tersebut merupakan anggota kelompok yang baru disebutkan.
- source_word: νομικὸς
  choice: seorang ahli Taurat
  rationale: Dalam konteks Yahudi, istilah ini menunjuk kepada orang yang ahli dalam hukum Taurat, bukan pengacara dalam pengertian hukum sipil modern.
- source_word: πειράζων
  choice: untuk menguji-Nya
  rationale: Partisipel ini paling alami dipahami sebagai maksud dari pertanyaannya; 'menguji' mempertahankan nuansa penyelidikan yang bersifat menantang tanpa membatasinya pada godaan untuk berbuat dosa.
- source_word: αὐτόν
  choice: Yesus / -Nya
  rationale: Rujukan pronomina diperjelas sebagai Yesus pada klausa utama agar ayat dapat dipahami dengan mudah; bentuk pronominal dipakai pada klausa tujuan.
theological_decisions:
- issue: Nuansa πειράζων terhadap Yesus
  choice: untuk menguji-Nya
  alternative: sambil mencobai-Nya
  rationale: Kata Yunani dapat berarti menguji atau mencobai. Dalam konteks ini, pertanyaan tersebut merupakan ujian yang menantang; terjemahan ini tidak menyiratkan secara sempit upaya membujuk Yesus berbuat dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ahli Taurat' dipilih karena lazim dipahami dalam konteks Perjanjian Baru, sedangkan catatan kaki memperjelas fungsi orang tersebut sebagai pakar hukum Yahudi.
