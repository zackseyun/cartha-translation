  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: id
  text: Pada kedua perintah inilah seluruh Taurat dan Para Nabi bergantung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Taurat dan Para Nabi” adalah sebutan bagi keseluruhan kesaksian Kitab Suci.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: Pada kedua perintah inilah
  rationale: Kata depan ἐν secara harfiah berarti 'di dalam', tetapi bersama κρέμαται frasa ini menyatakan tumpuan atau dasar. 'Pada ... inilah' mempertahankan metafora kebergantungan secara alami dalam bahasa Indonesia, sedangkan partikel '-lah' mencerminkan penekanan demonstratif ταύταις.
- source_word: ὅλος ὁ νόμος
  choice: seluruh Taurat
  rationale: ὅλος menegaskan keseluruhan. Dalam konteks ungkapan Yahudi-Matius, νόμος merujuk pada Taurat, bukan hukum secara abstrak; karena itu 'seluruh Taurat' lebih tepat dan alami daripada 'seluruh hukum'.
- source_word: κρέμαται
  choice: bergantung
  rationale: κρέμαται secara konkret berarti 'tergantung' atau 'menggantung', dan secara metaforis menyatakan bahwa sesuatu bertumpu atau bergantung pada sesuatu yang lain. 'Bergantung' mempertahankan metafora sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: καὶ οἱ προφῆται
  choice: dan Kitab Para Nabi
  rationale: Dalam formula 'Taurat dan Para Nabi', οἱ προφῆται menunjuk pada bagian atau kesaksian Kitab Suci, bukan semata-mata orang-orang nabi. Penambahan 'Kitab' membuat rujukan literernya jelas bagi pembaca Indonesia tanpa mengganti formula itu dengan parafrasa yang lebih luas.
theological_decisions:
- issue: Makna formula 'Taurat dan Kitab Para Nabi'
  choice: Rujukan kepada keseluruhan kesaksian Kitab Suci yang diringkas sebagai bertumpu pada kedua perintah kasih
  alternative: Rujukan yang lebih sempit hanya kepada ajaran etis dalam hukum dan tulisan para nabi
  rationale: Dalam Injil Matius, formula ini merupakan sebutan mapan bagi kesaksian Kitab Suci yang berwibawa. Terjemahan mempertahankan formula tersebut dan metafora 'bergantung', tanpa menjelaskan secara berlebihan apakah maksudnya terutama ketergantungan, rangkuman, atau pemenuhan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan penekanan pada 'kedua perintah' serta metafora κρέμαται. Istilah 'Taurat' dan 'Kitab Para Nabi' dipilih agar formula Kitab Suci Yahudi dapat dipahami pembaca umum.
