  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: id
  text: “Tunjukkan kepada-Ku uang logam untuk membayar pajak itu[a].” Lalu mereka membawa sekeping dinar kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pajak kepala” atau “pajak sensus”; Yunani κῆνσος menunjuk pada pajak kekaisaran Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Tunjukkan kepada-Ku
  rationale: Bentuk imperatif ini meminta para lawan bicara memperlihatkan benda tersebut untuk diperiksa; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur visual verba Yunani.
- source_word: νόμισμα
  choice: uang logam
  rationale: Istilah ini menunjuk pada uang yang beredar, khususnya sekeping uang logam dalam konteks ini. 'Uang logam' jelas dan wajar bagi pembaca Indonesia.
- source_word: τοῦ κήνσου
  choice: untuk membayar pajak itu
  rationale: κήνσος adalah kata serapan Latin yang menunjuk pada pajak kekaisaran Romawi yang sedang dibicarakan. Ungkapan ini alami, ringkas, dan tidak mempersempitnya secara tidak perlu menjadi jenis pajak tertentu.
- source_word: προσήνεγκαν
  choice: membawa ... kepada-Nya
  rationale: Dalam adegan naratif ini, 'membawa' menyampaikan tindakan menghadirkan uang tersebut kepada Yesus dengan lugas.
- source_word: δηνάριον
  choice: sekeping dinar
  rationale: Dinar mempertahankan nama historis mata uang δηνάριον, sedangkan 'sekeping' memperjelas bahwa yang dibawa adalah sebuah uang logam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena makna pajak Romawi dapat dipertahankan tanpa memaksakan padanan teknis yang lebih sempit.
