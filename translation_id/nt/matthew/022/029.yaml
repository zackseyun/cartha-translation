  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: id
  text: Namun, Yesus menjawab mereka, “Kalian keliru[a] karena tidak mengenal Kitab Suci ataupun kuasa Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tersesat” atau “tertipu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Namun, Yesus menjawab mereka
  rationale: Rangkaian partisip dan verba ini merupakan rumus jawaban yang idiomatis. “Menjawab” menghindari pengulangan kaku “setelah menjawab, berkata,” sedangkan “namun” menyampaikan daya transisional-adversatif δέ dalam konteks sanggahan.
- source_word: Πλανᾶσθε
  choice: Kalian keliru
  rationale: Bentuk ini dapat menyatakan berada dalam kekeliruan atau tersesat. “Keliru” jelas dan alami dalam bahasa Indonesia serta tidak membatasi makna pada penipuan oleh pihak luar.
- source_word: μὴ εἰδότες
  choice: karena tidak mengenal
  rationale: Partisip ini secara wajar menyatakan sebab kekeliruan mereka. “Mengenal” di sini mencakup pemahaman, bukan sekadar mengetahui keberadaan Kitab Suci dan kuasa Allah.
- source_word: τὰς γραφὰς
  choice: Kitab Suci
  rationale: Dalam konteks Yahudi dan Kristen awal, bentuk jamak γραφαί menunjuk pada tulisan-tulisan suci. “Kitab Suci” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ataupun kuasa Allah
  rationale: Sesudah klausa negatif, μηδέ secara alami dipadankan dengan “ataupun,” sehingga kedua objek ketidaktahuan tetap sejajar. δύναμις dan τοῦ θεοῦ diterjemahkan langsung sebagai “kuasa Allah.”
theological_decisions:
- issue: Penyebab kekeliruan orang Saduki
  choice: Kekeliruan mereka disebabkan oleh tidak mengenal Kitab Suci maupun kuasa Allah.
  alternative: Ucapan itu hanya menuduh mereka tersesat tanpa menyatakan penyebabnya.
  rationale: Konstruksi partisip μὴ εἰδότες paling alami menjelaskan sebab Πλανᾶσθε, dan μηδέ menghubungkan dua hal yang sama-sama tidak mereka kenal.
- issue: Nuansa Πλανᾶσθε
  choice: keliru
  alternative: tersesat; tertipu
  rationale: Bentuk Yunani memungkinkan nuansa salah, tersesat, atau tertipu. Teks utama memakai padanan netral “keliru,” sementara catatan kaki mempertahankan kemungkinan nuansa lainnya tanpa menentukan apakah penyebabnya terutama dari diri sendiri atau pihak luar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas; “Kitab Suci” dan “kuasa Allah” mempertahankan istilah keagamaan yang umum dipahami.
