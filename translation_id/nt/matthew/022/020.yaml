  yaml_path: translation/nt/matthew/022/020.yaml
  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Gambar dan tulisan ini milik siapa?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Milik siapakah gambar dan tulisan ini?” Bentuk genitif kata tanya Yunani menanyakan kepunyaan atau keterkaitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini Yunani berfungsi sebagai kala kini historis dalam narasi; bentuk lampau 'berkata' lebih alami dalam bahasa Indonesia modern tanpa mengubah maknanya.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak ini menandai pihak yang diajak bicara.
- source_word: Τίνος
  choice: milik siapa
  rationale: Bentuk interogatif genitif menanyakan kepunyaan atau keterkaitan; 'milik siapa' merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: εἰκών
  choice: gambar
  rationale: Dalam konteks uang logam, kata ini menunjuk pada gambar atau sosok penguasa yang tercetak; 'gambar' tepat, umum, dan tidak menambahkan penafsiran.
- source_word: αὕτη
  choice: ini
  rationale: Kata penunjuk ini menerangkan gambar yang sedang diperlihatkan.
- source_word: ἐπιγραφή
  choice: tulisan
  rationale: Kata ini menunjuk pada tulisan yang tertera pada uang logam; 'tulisan' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini menyatukan 'gambar' dan 'tulisan' sebagai dua unsur yang ditanyakan.
theological_decisions: []
