  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan 'Gambar dan tulisan ini milik siapa?' dipilih karena alami dalam percakapan, sementara catatan kaki mempertahankan bentuk Yunani yang lebih formal. Pronomina 'Ia' merujuk kepada Yesus sesuai konteks dekat.
