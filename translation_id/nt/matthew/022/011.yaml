    rationale: ἔνδυμα memang berbentuk tunggal, tetapi “sehelai” bukan padanan yang diperlukan dan dapat membuat alternatif terasa lebih spesifik daripada teks. “Pakaian pernikahan” merupakan alternatif leksikal yang netral.
