  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: id
  text: Namun, ketika raja itu masuk untuk melihat para tamu yang berbaring di sekeliling meja[a], ia melihat di sana seorang laki-laki yang tidak mengenakan pakaian pesta pernikahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam perjamuan resmi pada zaman itu, para tamu biasanya makan sambil berbaring menyamping di sekeliling meja.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “pakaian pernikahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ ὁ βασιλεὺς
  choice: Namun, ketika raja itu masuk
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba utama, sedangkan δέ menandai perkembangan narasi dengan sedikit pertentangan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan peralihan yang menegangkan dalam perumpamaan.
- source_word: θεάσασθαι
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan kedatangan raja. 'Untuk melihat' mempertahankan makna dasar tanpa memperkuatnya menjadi pemeriksaan resmi.
- source_word: τοὺς ἀνακειμένους
  choice: para tamu yang berbaring di dekat meja
  rationale: Dalam konteks perjamuan, verba ini menunjuk pada kebiasaan tamu bersantap sambil berbaring. 'Para tamu' memperjelas peran mereka, sedangkan keterangan tentang berbaring mempertahankan latar budaya kuno.
- source_word: εἶδεν ἐκεῖ
  choice: ia melihat di sana
  rationale: Terjemahan langsung dan alami bagi verba aoristus εἶδεν dan adverbia tempat ἐκεῖ.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Nomina tunggal maskulin ini menunjuk kepada seorang tokoh laki-laki tertentu dalam perumpamaan, bukan kepada manusia secara umum.
- source_word: οὐκ ἐνδεδυμένον
  choice: yang tidak mengenakan
  rationale: Partisip perfek menggambarkan keadaan orang itu pada saat ditemukan. 'Tidak mengenakan' merupakan ungkapan Indonesia yang wajar dan mempertahankan hubungan verbal dengan pakaian.
- source_word: ἔνδυμα γάμου
  choice: pakaian pesta pernikahan
  rationale: Frasa ini menunjuk pada pakaian yang berkaitan dengan pesta pernikahan. Kata 'pakaian' dapat berfungsi secara kolektif dalam bahasa Indonesia, sebagaimana nomina tunggal Yunani dapat merujuk pada busana.
theological_decisions:
- issue: Gambaran sikap tubuh dalam perjamuan
  choice: Mempertahankan keterangan bahwa para tamu berbaring, sambil menjelaskan bahwa mereka berada di dekat meja.
  alternative: Menerjemahkan hanya sebagai 'para tamu' atau 'orang-orang yang sedang makan'.
  rationale: Detail ini merupakan bagian dari latar historis perumpamaan. Terjemahan tidak menghapusnya, tetapi catatan kaki membantu pembaca modern memahami kebiasaan tersebut.
- issue: Makna ἔνδυμα γάμου
  choice: pakaian pesta pernikahan
  alternative: pakaian yang layak untuk pesta pernikahan; sehelai pakaian pernikahan
  rationale: Teks menyebut pakaian yang berkaitan dengan pernikahan, tetapi tidak secara eksplisit menjelaskan asal, bentuk, atau siapa yang menyediakannya. Terjemahan ini tidak memasukkan penafsiran teologis tambahan.
- issue: Jenis kelamin tokoh ἄνθρωπον
  choice: seorang laki-laki
  alternative: seseorang; seorang tamu
  rationale: Bentuk maskulin tunggal menunjuk pada tokoh laki-laki tertentu dalam cerita. Pilihan ini mempertahankan informasi dalam teks sumber tanpa menggeneralisasikannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Nada naratif tetap bermartabat; detail budaya kuno dipertahankan dalam teks dan dijelaskan secara ringkas melalui catatan kaki.
