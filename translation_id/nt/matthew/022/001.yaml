base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: id
  text: 'Dan Yesus menjawab dan kembali berbicara kepada mereka dalam perumpamaan-perumpamaan,[a] kata-Nya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Yesus menanggapi dan kembali berkata kepada mereka dalam perumpamaan-perumpamaan.” Bahasa Yunani memakai ungkapan naratif umum “menjawab” meskipun tidak ada pertanyaan langsung yang disebutkan tepat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Penghubung naratif yang alami dalam bahasa Indonesia; meneruskan alur tanpa memberi urutan waktu yang terlalu tegas.
- source_word: ἀποκριθεὶς
  choice: menjawab
  rationale: Mempertahankan ungkapan naratif Yunani yang lazim, meskipun tidak ada pertanyaan langsung tepat sebelumnya.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri diterjemahkan dengan bentuk baku bahasa Indonesia; artikel Yunani tidak perlu dinyatakan.
- source_word: πάλιν
  choice: kembali
  rationale: Secara alami menyatakan bahwa tindakan berbicara dilakukan lagi.
- source_word: εἶπεν
  choice: berbicara
  rationale: Menghindari pengulangan yang kaku dengan λέγων, sambil tetap menyampaikan tindakan ujaran.
- source_word: ἐν παραβολαῖς
  choice: dengan perumpamaan-perumpamaan
  rationale: ἐν menyatakan cara atau sarana, sedangkan bentuk jamak παραβολαῖς dipertahankan secara eksplisit.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menyatakan penerima ujaran sesuai fungsi datif.
- source_word: λέγων
  choice: kata-Nya
  rationale: Ungkapan Indonesia yang alami untuk memperkenalkan isi ujaran berikutnya; akhiran hormat mengikuti kebiasaan penerbitan Alkitab Indonesia.
theological_decisions:
- issue: Ungkapan 'menjawab' ketika tidak ada pertanyaan langsung tepat sebelumnya
  choice: Mempertahankan 'menjawab'
  alternative: menanggapi; mulai berbicara
  rationale: Kata Yunani ini merupakan ungkapan naratif umum dan tidak harus menunjuk kepada pertanyaan eksplisit. Pilihan ini menjaga bentuk sumber tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk jamak 'perumpamaan-perumpamaan' dipertahankan karena teks Yunani memakai bentuk jamak, walaupun konteks sesudahnya segera menampilkan satu perumpamaan.
