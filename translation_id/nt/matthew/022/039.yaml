  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: id
  text: 'Dan perintah yang kedua serupa dengan itu: “Kasihilah sesamamu seperti dirimu sendiri.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα
  choice: perintah yang kedua
  rationale: Adjektiva feminin tanpa artikel ini dipakai secara substantival dan dalam konteks menunjuk pada perintah kedua. Bahasa Indonesia memerlukan nomina tersirat itu dinyatakan agar alami dan jelas.
- source_word: δὲ
  choice: Dan
  rationale: Partikel ini berfungsi sebagai penghubung ringan yang melanjutkan pembicaraan, bukan sebagai pertentangan kuat.
- source_word: ὁμοία αὐτῇ
  choice: serupa dengan itu
  rationale: Frasa ini menyatakan keserupaan dengan perintah pertama yang baru disebut, tanpa menyamakan kedua perintah tersebut.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk future indikatif dalam kutipan ini berdaya imperatif. Bentuk imperatif Indonesia menyampaikan tuntutan perintah dengan wajar sekaligus mempertahankan ragam bahasa Kitab Suci.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: Ungkapan ini berarti orang lain yang dipandang sebagai sesama, bukan sekadar orang yang berdekatan secara ruang. 'Sesamamu' merupakan padanan Indonesia yang mapan dan alami.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini memperkenalkan tolok ukur perbandingan dan secara alami diterjemahkan 'seperti'.
- source_word: σεαυτόν
  choice: dirimu sendiri
  rationale: Pronomina refleksif ini kembali kepada subjek tunggal 'kamu'; bentuk tersebut jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan perintah kedua dengan perintah pertama
  choice: perintah yang kedua serupa dengan itu
  alternative: ada perintah kedua yang serupa dengan itu
  rationale: Dalam konteks, Δευτέρα menunjuk pada urutan perintah yang sedang disebut, sedangkan ὁμοία mempertahankan keserupaan tanpa meleburkan keduanya atau menjelaskan lebih jauh derajat keserupaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kasihilah' mempertahankan nada perintah dalam kutipan Kitab Suci; 'sesamamu' dipilih karena ringkas, lazim, dan mudah dipahami.
