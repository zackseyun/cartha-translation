  text: καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: id
  text: Ketika orang banyak mendengar hal itu,[a] mereka takjub akan pengajaran-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setelah mendengar hal itu”; secara lebih harfiah, “Sesudah mendengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ketika ... mendengar hal itu
  rationale: Partisip aoris ini secara alami diungkapkan sebagai anak kalimat waktu dalam bahasa Indonesia. “Hal itu” menyatakan objek yang tersirat dari konteks, yaitu jawaban Yesus sebelumnya.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami untuk kelompok khalayak; walaupun bentuk Yunaninya jamak, bahasa Indonesia tidak perlu menandai jamak secara morfologis di sini.
- source_word: ἐξεπλήσσοντο
  choice: mereka takjub
  rationale: Menyampaikan reaksi kuat berupa keheranan atau kekaguman dalam bahasa Indonesia modern tanpa melebih-lebihkan nuansanya.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: akan pengajaran-Nya
  rationale: ἐπί dengan datif menunjukkan dasar atau hal yang menimbulkan ketakjuban. “Pengajaran” mempertahankan makna διδαχή tanpa kesan teknis dari “doktrin”.
- source_word: καὶ
  choice: Ketika
  rationale: Hubungan naratif tetap terpelihara secara alami melalui konstruksi temporal; menerjemahkan καί secara tersendiri sebagai “dan” akan terasa kurang luwes pada awal kalimat Indonesia ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan umum teks Alkitab Indonesia untuk rujukan kepada Yesus. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
