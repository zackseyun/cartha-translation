id: MAT.22.34
reference: Matthew 22:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: id
  text: Namun, ketika orang-orang Farisi mendengar bahwa Yesus telah membungkam orang-orang Saduki[a], mereka berkumpul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “memasang berangus pada orang-orang Saduki.” Kata Yunani ini dapat berarti memasang berangus pada mulut binatang, tetapi di sini digunakan secara kiasan untuk membuat mereka tidak mampu menjawab dalam perdebatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan nuansa kontras terhadap percakapan sebelumnya; 'Namun' alami dan bermartabat dalam bahasa Indonesia.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Bentuk baku bahasa Indonesia untuk nama kelompok Yahudi ini.
- source_word: ἀκούσαντες
  choice: ketika ... mendengar
  rationale: Partisip aoris ini paling wajar dipahami secara temporal, yaitu tindakan mendengar yang mendahului tindakan berkumpul.
- source_word: ἐφίμωσεν
  choice: telah membungkam
  rationale: Menyampaikan daya ungkapan Yunani yang secara harfiah dapat berarti memasang berangus, tetapi di sini digunakan secara kiasan untuk membuat lawan tidak mampu menjawab dalam perdebatan.
- source_word: τοὺς Σαδδουκαίους
  choice: orang-orang Saduki
  rationale: Bentuk baku bahasa Indonesia untuk nama kelompok Yahudi ini.
- source_word: συνήχθησαν
  choice: mereka berkumpul
  rationale: Bentuk pasif Yunani berfungsi dengan makna intransitif dalam konteks ini; 'berkumpul' merupakan padanan Indonesia yang alami.
- source_word: ἐπὶ τὸ αὐτό
  choice: berkumpul
  rationale: Ungkapan ini berarti bersama-sama atau di tempat yang sama. Dalam bahasa Indonesia, unsur kebersamaan sudah terkandung secara alami dalam verba 'berkumpul', sehingga pengulangan 'berkumpul bersama-sama' dihindari.
theological_decisions:
- issue: Subjek tersirat pada ἐφίμωσεν
  choice: Yesus
  alternative: Ia
  rationale: Bahasa Yunani hanya menyiratkan subjek orang ketiga tunggal, yang berdasarkan konteks sebelumnya adalah Yesus. Penyebutan nama memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bernada naratif. Istilah kelompok memakai bentuk yang lazim dalam Alkitab bahasa Indonesia. Citra kuat verba Yunani dipertahankan melalui 'membungkam' dan dijelaskan lebih harfiah dalam catatan kaki.
