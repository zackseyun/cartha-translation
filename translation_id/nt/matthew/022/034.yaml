  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama Yunani dengan tepat: peralihan δέ, subjek orang-orang Farisi, hubungan waktu ἀκούσαντες, tindakan figuratif ἐφίμωσεν, kelompok Saduki, dan tindakan berhimpun dalam ἐπὶ τὸ αὐτό. Penambahan eksplisit “Yesus” sah karena subjeknya jelas dari konteks langsung, tanpa menambah isi.'
