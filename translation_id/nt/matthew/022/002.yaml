  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: id
  text: Kerajaan surga diumpamakan dengan seorang raja yang mengadakan pesta pernikahan bagi putranya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dapat diumpamakan dengan.” Kata kerja Yunani secara harfiah berbentuk “diumpamakan dengan” atau “dibuat menjadi serupa dengan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pernikahan-pernikahan” (bentuk jamak), suatu ungkapan untuk perayaan atau jamuan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: diumpamakan dengan
  rationale: Bentuk aoristus pasif ini secara harfiah menyatakan bahwa kerajaan surga 'diumpamakan dengan' atau 'dibuat menjadi serupa dengan'. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan nuansa modal yang tidak dinyatakan secara eksplisit.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Kerajaan surga
  rationale: Mempertahankan ungkapan khas Matius tanpa menyelaraskannya menjadi 'Kerajaan Allah'. Kata 'kerajaan' tetap dapat mencakup nuansa wilayah maupun pemerintahan.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: seorang raja
  rationale: Walaupun frasa Yunani memuat ἄνθρωπος dan βασιλεύς, susunan itu secara wajar menunjuk kepada seorang manusia yang adalah raja. 'Seorang raja' merupakan ungkapan Indonesia yang alami dan tidak perlu diperberat menjadi 'seorang manusia, seorang raja'.
- source_word: ὅστις
  choice: yang
  rationale: Kata ganti relatif ini memperkenalkan tindakan sang raja; 'yang' menyampaikan fungsinya secara tepat tanpa melebihkan tekanannya.
- source_word: ἐποίησεν
  choice: mengadakan
  rationale: Bersama γάμους, ποιέω bermakna idiomatis mengadakan atau menyelenggarakan perayaan pernikahan, bukan sekadar 'membuat'.
- source_word: γάμους
  choice: pesta pernikahan
  rationale: Bentuk jamak Yunani dapat menunjuk pada rangkaian perayaan atau jamuan pernikahan. 'Pesta pernikahan' alami dan sesuai dengan konteks perjamuan dalam perumpamaan ini.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: bagi anaknya
  rationale: Datif tersebut menyatakan bahwa pesta diadakan bagi anak sang raja. 'Anaknya' mempertahankan arti υἱός dalam konteks ini tanpa pengulangan kata 'pernikahan'.
theological_decisions:
- issue: Makna ungkapan 'Kerajaan surga'
  choice: Mempertahankan 'Kerajaan surga' sebagai ungkapan khas Matius tanpa penggantian interpretatif.
  alternative: Kerajaan Allah; pemerintahan surga
  rationale: Terjemahan ini menjaga kekhasan sastra dan teologis Matius serta membiarkan nuansa kerajaan sebagai wilayah maupun pemerintahan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang wajar, khidmat, dan mudah dipahami. Susunan pasif dipertahankan untuk mencerminkan bentuk Yunani, sedangkan idiom pernikahan dialihkan secara alami.
