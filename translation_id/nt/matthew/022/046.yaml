  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: id
  text: Tidak seorang pun sanggup menjawab-Nya sepatah kata pun, dan sejak hari itu tidak seorang pun berani mengajukan pertanyaan lagi kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Menyatakan ketiadaan siapa pun secara menyeluruh dan merupakan ungkapan baku dalam bahasa Indonesia.
- source_word: ἐδύνατο
  choice: sanggup
  rationale: Menyampaikan ketidakmampuan pada waktu lampau secara alami dalam konstruksi negatif Indonesia.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: menjawab-Nya sepatah kata pun
  rationale: Mempertahankan unsur λόγον dan daya tekan idiom Yunani, sekaligus memakai ungkapan Indonesia yang alami untuk ketidakmampuan memberikan jawaban sedikit pun.
- source_word: οὐδὲ
  choice: dan ... tidak ... pun
  rationale: Menghubungkan klausa negatif kedua dengan klausa pertama secara wajar dalam bahasa Indonesia; bentuk harfiah 'maupun' akan terasa kaku dalam susunan ini.
- source_word: ἐτόλμησέν τις
  choice: tidak seorang pun berani
  rationale: Menyatakan bahwa tak ada siapa pun yang berani mengambil tindakan tersebut tanpa menambah motif yang tidak disebutkan teks.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: sejak hari itu
  rationale: Menandai titik awal keadaan yang berlanjut dan secara alami berpadu dengan 'lagi'.
- source_word: ἐπερωτῆσαι
  choice: mengajukan pertanyaan ... kepada-Nya
  rationale: Dalam konteks perdebatan, verba ini menunjuk pada tindakan menanyai Yesus; pilihan ini lebih jelas daripada sekadar 'bertanya' dan tidak sekeras 'menginterogasi'.
- source_word: οὐκέτι
  choice: lagi
  rationale: Dengan 'sejak hari itu', kata ini secara ringkas dan alami menyatakan bahwa tindakan tersebut tidak berlanjut sesudahnya.
theological_decisions:
- issue: Daya naratif dari diamnya para penentang setelah jawaban Yesus
  choice: Menyatakan ketidakmampuan mereka menjawab dan ketidakberanian mereka untuk bertanya lagi tanpa menambahkan penilaian teologis.
  alternative: Memperjelas dalam terjemahan bahwa Yesus menang karena hikmat atau otoritas-Nya lebih tinggi.
  rationale: Konteks menyiratkan kemenangan Yesus dalam perdebatan, tetapi ayat ini sendiri hanya melaporkan bahwa tidak seorang pun mampu menjawab dan tidak seorang pun berani bertanya lagi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk hormat pronominal '-Nya' dipakai untuk Yesus sesuai kebiasaan luas dalam penerjemahan Alkitab Indonesia. Ungkapan 'sepatah kata pun' mengalihkan idiom Yunani secara alami, sehingga catatan kaki tidak diperlukan.
