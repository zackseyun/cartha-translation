  source_fidelity: 'Terjemahan pada umumnya mengikuti teks Yunani dengan baik: urutan “kaki dan tangannya,” daya perintah dari Δήσαντες dan ἐκβάλετε, serta gambaran dan ketegangan penghakiman dipertahankan tanpa penafsiran doktrinal tambahan. Namun, “lemparkan dia ke luar, ke dalam kegelapan yang paling luar” menghasilkan pengulangan arah yang janggal dalam bahasa Indonesia dan “yang paling luar” kurang alami sebagai pemodifikasi bagi “kegelapan.”'
