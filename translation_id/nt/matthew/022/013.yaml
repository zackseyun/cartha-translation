  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: id
  text: Lalu raja itu berkata kepada para pelayan, “Ikatlah kaki dan tangannya, lalu lemparkan dia ke dalam kegelapan di luar.[a] Di sanalah akan ada tangisan dan kertakan gigi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke dalam kegelapan yang paling luar.”'
    reason: Menunjukkan susunan yang lebih dekat dengan bentuk superlatif spasial ἐξώτερον, sementara teks utama memakai ungkapan Indonesia yang lebih alami.
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai kelanjutan peristiwa dalam narasi secara alami dan jelas.
- source_word: ὁ βασιλεὺς
  choice: raja itu
  rationale: Mempertahankan gambaran kerajaan dalam perumpamaan; artikel Yunani wajar dinyatakan dengan 'itu' karena tokohnya sudah tertentu.
- source_word: τοῖς διακόνοις
  choice: kepada para pelayan
  rationale: Dalam konteks perjamuan, istilah ini menunjuk orang-orang yang melayani raja; 'pelayan' alami dan tidak memasukkan nuansa jabatan gerejawi.
- source_word: Δήσαντες
  choice: Ikatlah
  rationale: Partisip aoristis yang mendahului imperatif utama secara wajar dialihkan sebagai perintah yang berurutan; 'ikatlah' jelas, langsung, dan modern.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: kaki dan tangannya
  rationale: Mempertahankan urutan Yunani, yakni kaki lalu tangan, dengan susunan posesif yang alami dalam bahasa Indonesia.
- source_word: ἐκβάλετε αὐτὸν
  choice: lemparkan dia ke luar
  rationale: Menyampaikan tindakan pengusiran yang keras dan mendadak tanpa memakai ungkapan yang terlalu arkais.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: ke dalam kegelapan yang paling luar
  rationale: Mempertahankan ungkapan khas Matius dan citra ruangnya; catatan kaki menyediakan alternatif Indonesia yang lebih idiomatis.
- source_word: ἐκεῖ
  choice: Di sanalah
  rationale: Menegaskan lokasi penderitaan sebagaimana partikel lokatif Yunani, dengan bentuk Indonesia yang alami.
- source_word: ὁ κλαυθμὸς
  choice: tangisan
  rationale: Menyatakan ratapan atau tangis tanpa mempersempit kadar emosinya.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: kertakan gigi
  rationale: Padanan Indonesia yang mapan bagi idiom tentang penderitaan dan/atau kemarahan, tanpa menentukan salah satunya.
theological_decisions:
- issue: Hakikat gambaran pengusiran dalam perumpamaan
  choice: Mempertahankan gambaran konkret tentang pengusiran ke dalam 'kegelapan yang paling luar'.
  alternative: Menafsirkannya secara eksplisit sebagai neraka atau, sebaliknya, membatasinya pada pengusiran sosial dari perjamuan.
  rationale: Teks Yunani memakai gambaran penghakiman yang kuat tetapi tidak menjelaskan referennya lebih lanjut dalam ayat ini; terjemahan tidak boleh mempersempit ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat perintah dibuat tegas sesuai adegan penghakiman, tetapi istilah gerejawi atau penafsiran doktrinal tambahan dihindari.
