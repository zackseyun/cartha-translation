id: MAT.22.32
reference: Matthew 22:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: id
  text: ‘Akulah Allah Abraham, Allah Ishak, dan Allah Yakub.’ Dia bukanlah Allah orang mati, melainkan Allah orang hidup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini menyampaikan identifikasi diri dalam kala kini secara alami dan tegas dalam bahasa Indonesia, sekaligus mempertahankan bobot argumentasi Yesus dari bunyi kutipan Kitab Suci.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: Pengulangan θεός dipertahankan untuk menjaga penekanan retoris teks Yunani; hubungan genitif dinyatakan secara idiomatis tanpa kata 'dari'.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Dia bukanlah Allah
  rationale: Kata ganti 'Dia' secara alami merujuk kembali kepada Allah yang baru disebut, sedangkan 'bukanlah' menandai pertentangan predikatif dengan jelas.
- source_word: νεκρῶν
  choice: orang mati
  rationale: Adjektiva jamak yang dipakai secara substantival diterjemahkan sebagai kelompok manusia; 'orang mati' merupakan ungkapan Indonesia yang ringkas dan wajar.
- source_word: ζώντων
  choice: orang hidup
  rationale: Partisipel kini jamak yang substantival diterjemahkan secara sejajar dengan 'orang mati', mempertahankan antitesis yang padat tanpa menambahkan penjelasan teologis.
theological_decisions:
- issue: Implikasi bahwa para leluhur tetap hidup di hadapan Allah dalam argumentasi Yesus tentang kebangkitan
  choice: Pernyataan diterjemahkan langsung sebagai 'Dia bukanlah Allah orang mati, melainkan Allah orang hidup.'
  alternative: 'Allah bukanlah Allah orang mati, melainkan Allah orang hidup; atau: orang-orang yang hidup bagi-Nya'
  rationale: Terjemahan mempertahankan daya argumentasi ayat tanpa memperluasnya menjadi pernyataan eksplisit tentang keadaan antara kematian dan kebangkitan. Ambiguitas dan ketegangan teologis teks tetap dijaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Allah' pada nama ketiga leluhur dipertahankan sesuai teks Yunani, sementara kata ganti 'Dia' pada kalimat kedua dipilih agar alami. Tidak diperlukan catatan kaki karena peralihan dari nomina Yunani yang diulang menjadi kata ganti Indonesia tidak mengubah rujukan atau makna.
