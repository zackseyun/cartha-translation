base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: id
  text: Jadi, pada waktu kebangkitan, perempuan itu akan menjadi istri siapakah di antara ketujuh orang itu? Sebab mereka semua pernah memperistrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka semua memilikinya”; dalam konteks ini maksudnya ialah bahwa ketujuh orang itu pernah memperistrinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: kebangkitan
  rationale: Dalam konteks perdebatan dengan orang Saduki, kata ini menunjuk pada kebangkitan orang mati. Frasa ἐν τῇ ἀναστάσει diterjemahkan secara temporal dan situasional sebagai “pada waktu kebangkitan”.
- source_word: οὖν
  choice: Jadi
  rationale: Kata ini menghubungkan pertanyaan dengan uraian sebelumnya sebagai kesimpulan atau kelanjutan logis.
- source_word: τίνος τῶν ἑπτὰ
  choice: siapa dari antara ketujuh orang itu
  rationale: Bentuk genitif interogatif menanyakan kepada siapa hubungan sebagai istri itu berlaku, dari kelompok tujuh orang yang telah disebutkan.
- source_word: ἔσται γυνή
  choice: akan menjadi istri
  rationale: γυνή dapat berarti “perempuan” atau “istri”, tetapi konstruksi dan konteks perkawinan menuntut arti “istri”; bentuk futurum ἔσται dipertahankan dengan “akan menjadi”.
- source_word: πάντες γὰρ
  choice: Sebab, mereka semua
  rationale: γάρ memberi alasan bagi pertanyaan tersebut, sedangkan πάντες mencakup ketujuh orang itu.
- source_word: ἔσχον αὐτήν
  choice: pernah memperistrinya
  rationale: Secara harfiah frasa ini berarti “memilikinya”, tetapi dalam konteks rangkaian perkawinan, “memperistrinya” menyampaikan maksudnya secara alami dan jelas dalam bahasa Indonesia; “pernah” menunjukkan bahwa hal itu berlaku pada masing-masing orang dalam rangkaian masa lampau.
theological_decisions:
- issue: Arti ἀνάστασις dalam tantangan orang Saduki
  choice: Kebangkitan orang mati yang akan datang
  alternative: Keadaan hidup sesudah kematian secara umum
  rationale: Konteks langsung membahas penyangkalan orang Saduki terhadap kebangkitan, dan jawaban Yesus selanjutnya tetap berpusat pada kebangkitan. Terjemahan “kebangkitan” mempertahankan pokok ajaran yang konkret tanpa menambah penjelasan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. “Pada waktu kebangkitan” menghindari ungkapan kaku “dalam kebangkitan”, sedangkan “memperistrinya” menyampaikan idiom Yunani dengan jelas tanpa menghilangkan bentuk harfiahnya, yang dicatat dalam catatan kaki.
