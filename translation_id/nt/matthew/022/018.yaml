  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: id
  text: Namun, Yesus mengetahui niat jahat mereka dan berkata, “Mengapa kalian menguji Aku[a], hai orang-orang munafik?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencobai Aku.” Kata Yunani ini dapat berarti “menguji,” “mencoba,” atau “mencobai,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: mengetahui
  rationale: Partisip aoris dari γινώσκω menyatakan bahwa Yesus mengetahui atau menyadari keadaan batin mereka sebelum Ia berbicara; “mengetahui” ringkas, alami, dan tidak menambahkan penafsiran.
- source_word: δὲ
  choice: Namun
  rationale: 'δέ menandai peralihan dengan kontras ringan: pendekatan mereka tampak hormat, tetapi Yesus mengetahui maksud yang sebenarnya.'
- source_word: τὴν πονηρίαν αὐτῶν
  choice: niat jahat mereka
  rationale: πονηρία dapat berarti kejahatan, kefasikan, atau kedengkian. Dalam konteks pertanyaan yang dirancang untuk menjebak, “niat jahat” menyampaikan daya kontekstualnya secara alami.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini τί menanyakan alasan; padanan idiomatis bahasa Indonesia ialah “Mengapa”.
- source_word: πειράζετε
  choice: menguji
  rationale: πειράζω dapat berarti menguji, mencoba, atau mencobai. “Menguji” mempertahankan keluasan makna verba, sedangkan catatan kaki mencatat alternatif yang relevan.
- source_word: ὑποκριταί
  choice: orang-orang munafik
  rationale: Istilah ini menunjuk kepada orang yang berpura-pura tulus sambil menyembunyikan maksud yang berlawanan. “Orang-orang munafik” adalah padanan baku dan mudah dipahami.
theological_decisions:
- issue: Pengetahuan Yesus tentang motif lawan-lawannya
  choice: Yesus mengetahui niat jahat mereka.
  alternative: Yesus menyadari kejahatan atau kedengkian mereka.
  rationale: Terjemahan menegaskan pengetahuan Yesus sebagaimana dinyatakan ayat ini, tanpa memperluasnya menjadi rumusan doktrinal di luar teks.
- issue: Nuansa πειράζετε
  choice: menguji Aku
  alternative: mencobai Aku
  rationale: Konteks menunjukkan upaya untuk menguji dan menjebak Yesus. “Menguji” menjaga ambiguitas leksikal, sementara alternatif “mencobai” dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Kalian” dipakai karena sapaan berbentuk jamak, sedangkan “hai” mempertahankan daya panggilan langsung tanpa terdengar terlalu arkais. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
