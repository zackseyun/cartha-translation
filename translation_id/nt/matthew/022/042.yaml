  source_fidelity: Terjemahan dengan tepat menyampaikan partisipel pengantar ujaran, pertanyaan jamak tentang Mesias, pertanyaan mengenai garis keturunan-Nya, serta jawaban eliptis yang menunjuk kepada Daud. “Menjawab-Nya” merupakan penghalusan kontekstual yang wajar untuk λέγουσιν αὐτῷ setelah sebuah pertanyaan dan tidak menambah makna substantif.
