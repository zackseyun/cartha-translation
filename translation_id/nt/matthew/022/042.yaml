id: MAT.22.42
reference: Matthew 22:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: id
  text: kata-Nya, “Apa pendapat kalian tentang Mesias[a]? Anak siapakah dia?” Mereka menjawab-Nya, “Anak Daud.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός (Christos) di sini digunakan dalam arti mesianik.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel kini λέγω memperkenalkan perkataan Yesus dan bergantung pada verba dalam ayat sebelumnya. “kata-Nya” merupakan penghubung naratif yang alami dalam bahasa Indonesia.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Apa pendapat kalian
  rationale: Ungkapan δοκέω dengan datif meminta penilaian atau pendapat para pendengar. Bentuk ini alami dan tetap mempertahankan pertanyaan langsung kepada bentuk jamak ὑμῖν.
- source_word: περὶ τοῦ χριστοῦ
  choice: tentang Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar dalam pembahasan mesianik Yahudi, sehingga “Mesias” menyampaikan maknanya lebih jelas daripada bentuk serapan “Kristus” yang dapat terdengar seperti nama diri.
- source_word: τίνος υἱός ἐστιν
  choice: Anak siapakah dia?
  rationale: Pertanyaan ini menanyakan garis keturunan atau hubungan dinastik. “Anak siapakah dia?” mempertahankan unsur υἱός dan terdengar wajar dalam bahasa Indonesia.
- source_word: λέγουσιν αὐτῷ
  choice: Mereka menjawab-Nya
  rationale: Walaupun secara harfiah berarti “mereka berkata kepada-Nya,” konteks pertanyaan membuat “menjawab-Nya” menjadi padanan Indonesia yang alami tanpa mengubah isi ujaran. Kala kini historis dialihkan ke bentuk naratif Indonesia.
- source_word: Τοῦ Δαυίδ
  choice: Anak Daud
  rationale: Jawaban Yunani berbentuk genitif eliptis, secara harfiah “milik/dari Daud,” dengan υἱός dipahami dari pertanyaan. Bahasa Indonesia memerlukan pelengkapan “Anak Daud” agar jawaban ringkas itu jelas dan alami.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini istilah tersebut jelas merupakan gelar yang sedang dibahas, bukan sebutan yang berfungsi seperti nama diri. Catatan kaki mempertahankan hubungan dengan padanan tradisional “Kristus” tanpa mengaburkan fungsi mesianiknya.
- issue: Makna “anak Daud”
  choice: Mempertahankan ungkapan garis keturunan tanpa penjelasan tambahan
  alternative: Menjelaskannya sebagai keturunan atau pewaris dinasti Daud
  rationale: Teks hanya menyatakan jawaban singkat “Anak Daud.” Penjelasan teologis atau dinastik tambahan akan mendahului argumentasi yang dikembangkan Yesus dalam ayat-ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipilih untuk menyatakan bentuk jamak ὑμῖν dengan jelas. Kapitalisasi pada akhiran pronominal “-Nya” mengikuti konvensi Indonesia bagi rujukan kepada Yesus, sedangkan “dia” dibiarkan huruf kecil karena secara gramatikal merujuk kepada tokoh Mesias dalam pertanyaan hipotetis.
