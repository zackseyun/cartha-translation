  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: id
  text: Budak-budak itu pun pergi ke jalan-jalan dan mengumpulkan semua orang yang mereka temukan, baik yang jahat maupun yang baik.[a] Lalu tempat pesta pernikahan itu[b] penuh dengan para tamu yang bersandar sambil bersantap.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “jahat” juga dapat diterjemahkan “buruk.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pernikahan”; dalam konteks ini istilah tersebut dapat merujuk pada pesta pernikahan atau tempat pesta itu berlangsung.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “orang-orang yang bersandar”; pada masa itu, orang biasanya bersandar atau berbaring ketika bersantap dalam jamuan resmi.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: budak-budak
  rationale: Kata δοῦλοι menunjuk orang-orang yang terikat di bawah kuasa tuannya. “Budak-budak” mempertahankan kenyataan sosial tersebut dan tidak memperhalusnya menjadi sekadar pelayan.
- source_word: ὁδοὺς
  choice: jalan-jalan
  rationale: Bentuk jamak ὁδοὺς merujuk secara luas pada jalan atau jalur umum tempat orang dapat dijumpai.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: mengumpulkan semua orang yang mereka temukan
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντας dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: baik yang jahat maupun yang baik
  rationale: Pilihan ini mempertahankan pertentangan moral yang kuat dalam bahasa Yunani sekaligus menonjolkan bahwa mereka mengumpulkan kedua golongan tanpa membatasi undangan.
- source_word: γάμος
  choice: tempat pesta pernikahan
  rationale: γάμος dapat menunjuk pernikahan atau perayaannya. Karena hal itu dikatakan menjadi penuh dengan orang yang bersantap, konteks membayangkan tempat berlangsungnya pesta; kata “tempat” membuat gambaran tersebut alami dalam bahasa Indonesia tanpa menghapus makna pesta pernikahan.
- source_word: ἐπλήσθη
  choice: penuh
  rationale: Bentuk pasif ini menyatakan bahwa tempat tersebut menjadi penuh; “penuh” merupakan ungkapan naratif yang ringkas dan alami.
- source_word: ἀνακειμένων
  choice: para tamu yang duduk bersantap
  rationale: Kata ini secara khusus menggambarkan orang yang berbaring atau bersandar saat makan menurut kebiasaan jamuan kuno. Dalam teks utama, “duduk bersantap” menyampaikan fungsi adegan secara alami, sedangkan postur harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penilaian moral terhadap orang-orang yang dikumpulkan
  choice: baik yang jahat maupun yang baik
  alternative: baik yang buruk maupun yang baik
  rationale: “Jahat” mempertahankan ketajaman moral πονηρούς. Ayat ini tetap menyatakan luasnya pengumpulan tanpa menyimpulkan bagaimana kehadiran mereka berkaitan dengan tanggapan yang layak dalam kelanjutan perumpamaan.
- issue: Makna γάμος dalam gambaran jamuan
  choice: tempat pesta pernikahan
  alternative: pesta pernikahan
  rationale: Konteks menunjukkan ruang atau tempat jamuan yang dipenuhi orang-orang yang sedang makan. Terjemahan ini menjernihkan gambaran fisiknya, sementara catatan kaki mempertahankan keluasan makna istilah Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. “Budak-budak” sengaja dipakai untuk mempertahankan status sosial δοῦλοι, sedangkan “duduk bersantap” dipakai dalam teks utama agar mudah dipahami pembaca masa kini; rincian budaya tentang postur makan dijelaskan dalam catatan kaki.
