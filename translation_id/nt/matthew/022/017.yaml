id: MAT.22.17
reference: Matthew 22:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: id
  text: Jadi, katakanlah kepada kami, bagaimana pendapat-Mu? Apakah diperbolehkan membayar pajak kepala kepada Kaisar atau tidak?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: bagaimana pendapat-Mu?
  rationale: Ungkapan ini secara alami menanyakan penilaian atau pendapat Yesus; huruf kapital pada enklitik -Mu mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada pribadi ilahi.
- source_word: ἔξεστιν
  choice: apakah diperbolehkan
  rationale: Menyampaikan pertanyaan tentang apa yang sah atau diizinkan tanpa membatasi pertanyaan itu hanya pada hukum Romawi atau hukum agama.
- source_word: δοῦναι
  choice: membayar
  rationale: Walaupun secara harfiah berarti 'memberikan', dalam konteks pajak bahasa Indonesia secara idiomatis memakai 'membayar'.
- source_word: κῆνσον
  choice: pajak kepala
  rationale: Merujuk pada pajak langsung Romawi atas orang perorangan, bukan pajak secara umum.
- source_word: Καίσαρι
  choice: kepada Kaisar
  rationale: Mempertahankan gelar penguasa Romawi dan relasi penerima yang dinyatakan oleh bentuk datif.
theological_decisions:
- issue: Dasar dari apa yang 'diperbolehkan'
  choice: Tidak diperinci
  alternative: Apakah menurut hukum Taurat diperbolehkan
  rationale: Teks Yunani tidak menyebutkan secara eksplisit hukum atau otoritas mana yang menjadi dasar pertanyaan, sehingga ambiguitasnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pertanyaan dibuat alami tanpa menghilangkan nada jebakan dalam konteksnya. Tidak ada penanda catatan kaki karena tidak diperlukan.
