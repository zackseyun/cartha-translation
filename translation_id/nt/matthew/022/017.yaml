  source_fidelity: Teks Indonesia dengan tepat menyampaikan εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ dan pertanyaan ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ. “Membayar pajak kepala kepada Kaisar” merupakan padanan idiomatis yang setia bagi “memberikan pajak kepala kepada Kaisar”; kata kerja “membayar” tidak mengubah makna dalam konteks pungutan pajak.
  naturalness: Susunannya alami dalam bahasa Indonesia modern dan bernada sopan namun langsung. “Jadi” memadai untuk οὖν, sedangkan “bagaimana pendapat-Mu?” secara wajar mengungkapkan τί σοι δοκεῖ.
