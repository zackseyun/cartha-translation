  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: id
  text: Ketika orang-orang Farisi sedang berkumpul, Yesus bertanya kepada mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: sedang berkumpul
  rationale: Partisip aoristus dalam konstruksi genitif absolut memberi latar keadaan bagi tindakan utama. Bentuk “sedang berkumpul” menyampaikan keadaan yang berlangsung tanpa membuatnya menjadi tindakan utama.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dalam alur. Dalam bahasa Indonesia, hubungan itu sudah mengalir alami melalui anak kalimat pembuka “Ketika ...”, sehingga penambahan “lalu” atau “adapun” tidak diperlukan.
- source_word: τῶν Φαρισαίων
  choice: orang-orang Farisi
  rationale: Sebutan kelompok ini diterjemahkan dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia; kasus genitifnya merupakan bagian dari konstruksi genitif absolut.
- source_word: ἐπηρώτησεν
  choice: bertanya kepada
  rationale: Dalam konteks ini verba tersebut memperkenalkan pertanyaan Yesus. “Bertanya kepada” merupakan padanan Indonesia yang alami dan tidak menambahkan kesan interogasi yang terlalu keras.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada orang-orang Farisi dan menjadi pihak yang ditanyai.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri yang berfungsi sebagai subjek; artikel Yunani tidak perlu diterjemahkan dalam bahasa Indonesia.
