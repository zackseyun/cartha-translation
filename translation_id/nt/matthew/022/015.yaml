  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: id
  text: Kemudian orang-orang Farisi pergi dan berunding tentang bagaimana mereka dapat menjebak Yesus melalui perkataan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersekongkol untuk menjebak Dia dengan apa yang Dia katakan.”
    reason: Alternatif leksikal yang menampilkan nuansa perencanaan bermusuhan dan kemungkinan lain untuk ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa secara ringkas dan alami dalam narasi bahasa Indonesia.
- source_word: πορευθέντες
  choice: pergi
  rationale: Partisip aoris ini mendahului verba utama dan secara idiomatis menyatakan tindakan yang dilakukan sebelum mereka berunding.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok tersebut.
- source_word: συμβούλιον ἔλαβον
  choice: berunding
  rationale: Menyampaikan makna idiom 'mengambil nasihat/mengadakan permufakatan' dengan bahasa Indonesia yang alami, tanpa memasukkan unsur permusuhan lebih awal daripada klausa tujuan.
- source_word: ὅπως
  choice: tentang bagaimana
  rationale: Dalam konstruksi setelah 'berunding', ungkapan ini secara alami menyampaikan isi sekaligus tujuan perundingan.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Rujukan pronomina diperjelas agar alami dan tidak ambigu bagi pembaca ayat tunggal; konteks menunjuk kepada Yesus.
- source_word: παγιδεύσωσιν
  choice: menjebak
  rationale: Mempertahankan metafora menangkap dengan perangkap serta maksud bermusuhan yang jelas.
- source_word: ἐν λόγῳ
  choice: melalui perkataan-Nya
  rationale: Menyampaikan bahwa jebakan itu hendak dilakukan melalui sesuatu yang Yesus ucapkan; bentuk sumber tetap memungkinkan nuansa 'dalam perkataan' atau 'dengan suatu ucapan'.
theological_decisions:
- issue: Tingkat permusuhan dalam συμβούλιον ἔλαβον
  choice: Frasa diterjemahkan secara relatif netral sebagai 'berunding', sedangkan maksud jahat dinyatakan oleh 'menjebak'.
  alternative: bersekongkol / membuat rencana jahat
  rationale: Teks sudah menyatakan permusuhan melalui klausa tujuan. Pilihan netral pada idiom pertama menghindari penambahan muatan yang tidak perlu.
- issue: Rujukan αὐτὸν dalam penyajian ayat tunggal
  choice: Yesus
  alternative: Dia
  rationale: Dalam konteks Injil, pronomina itu merujuk kepada Yesus. Penyebutan nama memperjelas ayat yang disajikan tersendiri tanpa mengubah identitas rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Berunding' menjaga corak deliberatif; 'menjebak' menyatakan maksud bermusuhan dengan jelas. Penanda catatan kaki [a] dicantumkan dalam teks utama.
