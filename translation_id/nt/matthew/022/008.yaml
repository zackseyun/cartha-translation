  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: id
  text: Kemudian ia berkata kepada hamba-hambanya, “Perjamuan pernikahan sudah siap, tetapi orang-orang yang telah diundang[a] itu tidak layak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang telah dipanggil.” Dalam konteks perjamuan ini, kata Yunani tersebut mengacu kepada orang-orang yang diundang ke perjamuan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan tindakan dalam kisah secara alami dan langsung.
- source_word: λέγει
  choice: ia berkata
  rationale: Walaupun bentuk Yunaninya adalah present historis, bentuk lampau lebih alami dalam narasi bahasa Indonesia dan tetap menyampaikan urutan peristiwa tanpa mengubah makna.
- source_word: δούλοις
  choice: kepada hamba-hambanya
  rationale: Dalam latar rumah tangga atau istana pada perumpamaan ini, 'hamba' mempertahankan relasi sosial yang tersirat oleh δοῦλος dan sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: Ὁ μὲν γάμος
  choice: Perjamuan pernikahan
  rationale: Dalam konteks ini γάμος menunjuk pada perayaan atau jamuan pernikahan yang telah disiapkan, bukan hanya peristiwa perkawinannya. Kontras μὲν ... δὲ tercermin melalui 'tetapi'.
- source_word: ἕτοιμός ἐστιν
  choice: sudah siap
  rationale: Ungkapan ini alami dalam bahasa Indonesia; 'sudah' menegaskan keadaan siap pada tahap cerita tersebut tanpa mengubah konstruksi menjadi tindakan pasif.
- source_word: οἱ δὲ κεκλημένοι
  choice: orang-orang yang telah diundang
  rationale: Partisipel perfek pasif dari καλέω dalam konteks jamuan menunjuk kepada para tamu yang sebelumnya menerima undangan. Bentuk 'telah diundang' juga mempertahankan aspek keadaan yang timbul dari tindakan sebelumnya.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: tidak layak
  rationale: '''Tidak layak'' mempertahankan penilaian yang terkandung dalam ἄξιοι tanpa menjelaskan alasan ketidaklayakan secara berlebihan.'
theological_decisions:
- issue: Kemungkinan nuansa teologis κεκλημένοι ('yang dipanggil')
  choice: orang-orang yang telah diundang
  alternative: orang-orang yang telah dipanggil
  rationale: Konteks langsungnya adalah para tamu perjamuan yang telah diundang. Terjemahan utama memakai makna sosial yang paling jelas, sedangkan terjemahan yang lebih harfiah dicatat agar kemungkinan nuansa kata sumber tetap terlihat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Hamba' dipilih daripada 'pelayan' untuk mempertahankan cakupan sosial δοῦλος, sedangkan 'perjamuan pernikahan' memperjelas bahwa yang telah siap adalah perayaannya.
