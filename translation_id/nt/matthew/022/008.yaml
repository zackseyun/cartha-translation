  source_fidelity: Terjemahan dengan tepat menyampaikan urutan τότε, ujaran kepada para δοῦλοι, makna γάμος sebagai perjamuan pernikahan, keadaan siap, serta kontras antara perjamuan yang siap dan mereka yang telah diundang tetapi tidak layak. Bentuk lampau «berkata» wajar dalam narasi Indonesia dan tidak mengubah makna present historis Yunani secara material.
