  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: id
  text: Ia mengutus hamba-hambanya[a] untuk memanggil orang-orang yang sudah diundang[b] ke pesta pernikahan[c], tetapi mereka tidak mau datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak-budaknya.” Kata Yunani yang dipakai dapat berarti hamba atau budak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “orang-orang yang sudah dipanggil.” Dalam konteks ini, panggilan itu adalah undangan yang telah diberikan sebelumnya.
    reason: lexical_alternative
  - marker: c
    text: Atau, “perjamuan perkawinan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: menyuruh
  rationale: Dalam konstruksi dengan tujuan καλέσαι, 'menyuruh ... memanggil' secara alami menyampaikan bahwa ia mengutus para hambanya untuk melakukan tugas tertentu.
- source_word: δούλους
  choice: hamba-hambanya
  rationale: δοῦλος dapat berarti hamba atau budak. Dalam perumpamaan ini yang ditonjolkan ialah peran mereka sebagai pelaksana perintah, sehingga 'hamba' tepat dan wajar; alternatif 'budak' dicatat.
- source_word: καλέσαι
  choice: memanggil
  rationale: '''Memanggil'' mempertahankan hubungan leksikal dengan κεκλημένους, meskipun bentuk kedua diterjemahkan secara kontekstual sebagai ''yang sudah diundang''.'
- source_word: κεκλημένους
  choice: orang-orang yang sudah diundang
  rationale: Partisipel perfek pasif menunjukkan orang-orang yang sebelumnya telah menerima undangan; 'sudah diundang' menyatakan keadaan hasil tersebut dengan jelas.
- source_word: εἰς τοὺς γάμους
  choice: ke perjamuan kawin
  rationale: Dalam konteks ini bentuk jamak γάμοι menunjuk pada perayaan atau jamuan perkawinan, bukan hanya upacara pernikahan.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: mereka tidak mau datang
  rationale: Ungkapan ini mempertahankan unsur kemauan dalam ἤθελον tanpa memperkuatnya menjadi 'menolak'.
theological_decisions:
- issue: Pemaknaan δοῦλος dalam narasi perumpamaan
  choice: hamba
  alternative: budak
  rationale: Fokus ayat berada pada tugas mereka sebagai utusan sang raja, bukan pada status hukum perbudakan. Catatan kaki mempertahankan alternatif leksikal yang sah.
- issue: Hubungan καλέσαι dan κεκλημένους
  choice: '''memanggil'' dan ''yang sudah diundang'''
  alternative: '''memanggil'' dan ''orang-orang yang sudah dipanggil'''
  rationale: Terjemahan ini menjaga sebagian pengulangan akar kata sekaligus menjelaskan bahwa pemanggilan terdahulu merupakan undangan ke perjamuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Perjamuan kawin' dipilih untuk membedakan jamuan perayaan dari upacara pernikahan; 'tidak mau datang' mempertahankan tekanan pada kehendak. Penanda catatan kaki ditempatkan pada akhir ayat agar teks utama tetap lancar.
