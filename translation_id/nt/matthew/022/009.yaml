  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: id
  text: Karena itu, pergilah ke persimpangan-persimpangan jalan[a], dan undanglah siapa saja yang kalian temukan ke perjamuan pernikahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tempat-tempat jalan bercabang atau bertemu”; frasa Yunani dapat merujuk pada jalan keluar, persimpangan, atau pertemuan jalan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke pernikahan-pernikahan”; bentuk jamak dalam bahasa Yunani di sini merupakan ungkapan untuk perayaan atau jamuan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: pergilah
  rationale: Bentuk imperatif ini menyampaikan perintah langsung. “Pergilah” alami, jelas, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan atau akibat dari perintah sebelumnya dan mempertahankan hubungan logis antarkalimat.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: ke persimpangan-persimpangan jalan
  rationale: Frasa ini menunjuk pada tempat jalan-jalan keluar, bercabang, atau bertemu. “Persimpangan-persimpangan jalan” merupakan padanan modern yang jelas tanpa menentukan secara berlebihan bentuk tempatnya.
- source_word: ὅσους ἐὰν εὕρητε
  choice: sebanyak mungkin orang yang kalian temukan
  rationale: 'Mengungkapkan keluasan yang tidak ditentukan dan nuansa kuantitatif ὅσους dengan ἐάν: semua orang sebanyak yang berhasil ditemukan.'
- source_word: καλέσατε
  choice: undanglah
  rationale: Dalam konteks pesta, καλέω berarti mengundang, bukan sekadar memanggil.
- source_word: εἰς τοὺς γάμους
  choice: ke perjamuan pernikahan
  rationale: Bentuk jamak γάμους di sini merujuk secara idiomatis pada perayaan atau jamuan pernikahan, bukan beberapa pernikahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kata ganti “kalian” dipakai karena semua verba perintah dan kata ganti dalam ayat ini berbentuk jamak. Pengulangan “persimpangan-persimpangan” mempertahankan bentuk jamak sumber dan tetap mudah dipahami.
