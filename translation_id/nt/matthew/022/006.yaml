  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: id
  text: Tetapi yang lain menangkap hamba-hambanya[a], lalu menganiaya dan membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budaknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Tetapi orang-orang lainnya
  rationale: λοιποί menunjuk kepada para undangan lain yang tersisa, sedangkan δέ memberi kontras ringan dengan mereka yang pergi dalam ayat sebelumnya.
- source_word: κρατήσαντες
  choice: menangkap
  rationale: Dalam konteks tindakan kekerasan terhadap para utusan, κρατέω berarti menangkap atau menguasai mereka. Rangkaian verba bahasa Indonesia menyampaikan bahwa tindakan ini mendahului penganiayaan dan pembunuhan.
- source_word: τοὺς δούλους αὐτοῦ
  choice: hamba-hambanya
  rationale: Dalam konteks istana dan perutusan raja, 'hamba' merupakan padanan Indonesia yang alami dan bermartabat, sekaligus tetap mencerminkan kedudukan yang berada di bawah kuasa tuannya. Alternatif yang lebih menonjolkan status kepemilikan dicatat dalam catatan kaki.
- source_word: ὕβρισαν
  choice: menganiaya mereka
  rationale: ὑβρίζω mencakup perlakuan kasar, kejam, dan menghina, bukan hanya penghinaan lisan. 'Menganiaya' menyampaikan cakupan kekerasan itu secara ringkas dan alami.
- source_word: ἀπέκτειναν
  choice: membunuh mereka
  rationale: Padanan langsung dan netral bagi ἀποκτείνω, tanpa menambahkan kategori hukum yang tidak dinyatakan oleh verba Yunani.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perumpamaan tentang seorang raja
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' sesuai dengan peran mereka sebagai orang-orang yang berada di bawah kuasa raja dan diutus olehnya, serta alami dalam narasi Indonesia. Karena δοῦλος juga dapat secara lebih tegas menyatakan status perbudakan, ''budak'' dipertahankan sebagai alternatif dalam catatan kaki tanpa memaksakan penafsiran teologis.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas. Kata 'lalu' memperjelas urutan tindakan yang tersirat oleh partisip aoris κρατήσαντες tanpa membuat konstruksi Indonesia terasa kaku.
