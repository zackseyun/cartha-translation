  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: id
  text: Demikian juga dengan yang kedua dan yang ketiga, sampai ketujuh-tujuhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menyatakan bahwa hal yang sama seperti pada ayat sebelumnya terjadi pada saudara-saudara berikutnya, sekaligus mempertahankan hubungan wacananya.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: dengan yang kedua dan yang ketiga
  rationale: Kata bilangan bertingkat berfungsi sebagai nomina. Kata 'saudara' tetap dibiarkan tersirat sebagaimana dalam teks Yunani, sedangkan 'dengan' membuat ungkapan ini alami dalam bahasa Indonesia setelah 'Demikian juga'.
- source_word: ἕως τῶν ἑπτά
  choice: sampai ketujuh-tujuhnya
  rationale: Menunjukkan bahwa pola tersebut berlanjut hingga mencakup seluruh tujuh saudara. Bentuk reduplikasi 'ketujuh-tujuhnya' secara idiomatis berarti semuanya yang berjumlah tujuh.
