  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: id
  text: 'Ia berkata kepada mereka, “Kalau begitu, bagaimana Daud, dalam Roh[a], menyebut dia Tuhan[b] dengan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh Roh.” Frasa Yunani ini dapat menyatakan lingkup atau perantaraan; “dalam Roh” lebih dekat dengan susunan katanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Tuan.” Kata Yunani κύριος dapat berarti “tuan” atau “Tuhan”; di sini digunakan sebagai gelar dalam kutipan Mazmur.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Bentuk kini Yunani berfungsi sebagai kala kini historis; bentuk lampau lebih alami dalam narasi bahasa Indonesia.
- source_word: Πῶς οὖν
  choice: Kalau begitu, bagaimana mungkin
  rationale: Ungkapan ini mempertahankan daya tanya πῶς dan hubungan inferensial οὖν; kata 'mungkin' membuat konstruksi pertanyaan berikutnya wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: ἐν πνεύματι
  choice: dalam Roh
  rationale: Mengikuti susunan Yunani dengan dekat dan mempertahankan kemungkinan nuansa lingkup maupun perantaraan; huruf kapital menunjukkan bahwa Roh Kudus paling mungkin dimaksud.
- source_word: καλεῖ αὐτὸν κύριον
  choice: menyebut Dia Tuhan
  rationale: Kata 'Tuhan' mempertahankan bobot gelar κύριος serta kaitan argumentasi dengan Mazmur 110; 'Dia' merujuk kepada sosok Mesias yang sedang dibicarakan.
- source_word: λέγων
  choice: ketika berkata
  rationale: Menghubungkan tindakan Daud menyebut Dia Tuhan dengan kutipan yang langsung menyusul secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan πνεύματι dalam ἐν πνεύματι
  choice: Roh Kudus
  alternative: roh Daud sendiri atau keadaan rohaninya
  rationale: Dalam konteks perkataan Daud dalam Kitab Suci, frasa ini paling wajar menunjuk kepada Roh Kudus, tetapi terjemahan 'dalam Roh' tidak mempersempit nuansa preposisinya menjadi perantaraan saja.
- issue: Terjemahan κύριος
  choice: Tuhan
  alternative: tuan
  rationale: Dalam pertanyaan mesianis yang mengutip Mazmur 110, 'Tuhan' mempertahankan fungsi gelarnya dan ketegangan kristologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan dibuat alami tanpa menghilangkan hubungan logis dengan ayat sebelumnya. Terjemahan mempertahankan frasa 'dalam Roh' dan gelar 'Tuhan' serta tidak menjelaskan identitas Mesias melampaui teks.
