  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: id
  text: Tuhan berkata kepada Tuanku[a], ‘Duduklah di sebelah kanan-Ku sampai Aku menempatkan musuh-musuhmu di bawah kakimu’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengikuti ungkapan Ibrani dalam Mazmur 110:1, “menjadikan musuh-musuhmu sebagai tumpuan kakimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: berkata
  rationale: Bentuk aoris dari λέγω menyatakan tindakan berkata secara lugas; “berkata” alami dan tidak menambahkan kekuatan makna seperti “menyatakan” atau “berfirman”.
- source_word: κύριος
  choice: Tuhan
  rationale: Kedua kemunculan κύριος diterjemahkan dengan gelar yang sama, sesuai teks Yunani. Bentuk “Tuanku” pada kemunculan kedua menyatakan hubungan yang ditandai oleh μου tanpa mengganti gelarnya dengan “tuan” atau “majikan”.
- source_word: τῷ κυρίῳ μου
  choice: kepada Tuanku
  rationale: Bentuk datif menandai pihak yang menerima perkataan, sedangkan μου berarti “-ku”. Terjemahan ini mempertahankan gelar κύριος dan hubungan yang penting bagi argumen dalam konteks.
- source_word: Κάθου
  choice: Duduklah
  rationale: Imperatif kini dari κάθημαι diterjemahkan secara alami sebagai perintah untuk duduk; bentuk ini sesuai dengan konteks penobatan atau pemberian tempat terhormat.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ungkapan ini menunjuk pada tempat di sisi kanan, yakni kedudukan terhormat. “Di sebelah kanan-Ku” merupakan padanan Indonesia yang alami dan jelas.
- source_word: ἕως ἂν θῶ
  choice: sampai Aku menempatkan
  rationale: Konstruksi ἕως ἂν dengan subjungtif aoris mengarah pada tindakan mendatang. “Menempatkan” mempertahankan gagasan θῶ tanpa menambahkan citra yang tidak dinyatakan langsung dalam teks Yunani.
- source_word: τοὺς ἐχθρούς σου
  choice: musuh-musuhmu
  rationale: Bentuk jamak dan kata ganti kepunyaan diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: di bawah kakimu
  rationale: Ini mengikuti susunan eksplisit teks Yunani, yang secara harfiah menempatkan musuh-musuh di bawah kaki pihak yang disapa. Citra tumpuan kaki dari teks Ibrani Mazmur dicantumkan sebagai alternatif dalam catatan kaki.
theological_decisions:
- issue: Dua kemunculan κύριος dalam kutipan Mazmur 110:1
  choice: Tuhan berkata kepada Tuanku
  alternative: TUHAN berkata kepada Tuanku; Tuhan berkata kepada tuanku
  rationale: Teks Yunani memakai κύριος untuk kedua rujukan. Terjemahan mempertahankan gelar yang sama, sementara bentuk kepunyaan “Tuanku” menyatakan perbedaan relasional yang terdapat dalam τῷ κυρίῳ μου. Bentuk “TUHAN” akan memasukkan pembedaan berdasarkan nama ilahi dalam teks Ibrani yang tidak ditandai secara grafis oleh kutipan Yunani ini; “tuanku” dengan huruf kecil dapat melemahkan kesejajaran gelar yang menjadi bagian dari ketegangan argumentatif ayat tersebut.
- issue: Citra penaklukan musuh dalam kutipan Mazmur
  choice: menempatkan musuh-musuhmu di bawah kakimu
  alternative: menjadikan musuh-musuhmu tumpuan kakimu
  rationale: Teks Matius dalam bahasa Yunani secara eksplisit berbunyi “di bawah kakimu”, sedangkan citra “tumpuan kaki” mencerminkan idiom sumber Ibrani Mazmur 110:1. Teks utama mengikuti bentuk Yunani dan catatan kaki mempertahankan alternatif dari latar Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Berkata” dipilih agar tidak menambahkan nuansa khusus di luar verba Yunani yang umum. Kapitalisasi “Tuhan”, “Tuanku”, “-Ku”, dan “Aku” mengikuti rujukan personal dalam kutipan tanpa mengubah kedua kemunculan κύριος menjadi dua gelar leksikal yang berbeda.
