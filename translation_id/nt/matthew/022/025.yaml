  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: id
  text: Di antara kami ada tujuh saudara laki-laki. Yang pertama menikah lalu meninggal. Karena tidak mempunyai keturunan[a], ia meninggalkan istrinya kepada saudaranya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mempunyai benih.” Di sini “benih” berarti keturunan.
    reason: lexical_alternative
  - marker: b
    text: 'Ini mengacu pada perkawinan levirat: saudara laki-laki dari seorang pria yang meninggal diharapkan menikahi jandanya untuk memperoleh keturunan bagi saudara yang meninggal itu; lihat Ulangan 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: di antara kami
  rationale: παρά dengan datif menyatakan keberadaan atau hubungan di tengah kelompok yang dimaksud. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sudut pandang para penutur.
- source_word: ἑπτὰ ἀδελφοί
  choice: tujuh orang bersaudara
  rationale: Dalam konteks perkawinan levirat, ἀδελφοί menunjuk kepada tujuh saudara laki-laki. Bentuk 'orang bersaudara' terdengar alami, sedangkan konteks selanjutnya memperjelas bahwa mereka laki-laki.
- source_word: ὁ πρῶτος
  choice: yang pertama
  rationale: πρῶτος menunjukkan urutan dalam kelompok, bukan dengan pasti urutan usia; karena itu tidak diterjemahkan 'yang sulung'.
- source_word: γήμας
  choice: menikah
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kematian. Susunan 'menikah, lalu meninggal' menyampaikan urutannya secara wajar.
- source_word: ἐτελεύτησεν
  choice: meninggal
  rationale: τελευτάω berarti mati atau mencapai akhir hidup. 'Meninggal' merupakan ungkapan baku, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: μὴ ἔχων σπέρμα
  choice: tanpa mempunyai keturunan
  rationale: σπέρμα secara harfiah berarti 'benih', tetapi dalam konteks keluarga dan hukum ini berarti keturunan. 'Keturunan' mempertahankan nuansa genealogisnya.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: ia meninggalkan istrinya
  rationale: ἀφίημι di sini berarti meninggalkan seseorang ketika meninggal, bukan menceraikan atau menelantarkannya. Konteks kematian menjelaskan makna tersebut.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: kepada saudaranya
  rationale: Datif menandai saudara yang menerima janda itu menurut kebiasaan perkawinan levirat. Terjemahan ini tidak menambahkan kata 'untuk dinikahi', yang tidak dinyatakan secara eksplisit dalam teks Yunani.
theological_decisions:
- issue: Apakah latar perkawinan levirat perlu dijelaskan dalam teks utama
  choice: 'Mempertahankan ungkapan tersirat sebagaimana dalam teks Yunani: ''meninggalkan istrinya kepada saudaranya''.'
  alternative: Memperluasnya menjadi 'meninggalkan istrinya untuk dinikahi saudaranya'.
  rationale: Ulangan 25:5 dan konteks percakapan membuat maksud hukumnya jelas, tetapi teks Yunani tidak secara eksplisit mengatakan 'untuk dinikahi'. Penjelasan budaya ditempatkan dalam catatan kaki agar teks utama tidak melampaui sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Kata penghubung δέ tidak diberi padanan mandiri karena hubungan wacananya sudah wajar dalam konteks. Tanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan masing-masing catatan.
