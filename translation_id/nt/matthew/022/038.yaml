  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: id
  text: Inilah perintah yang agung dan yang pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Inilah perintah yang terutama.” Secara lebih harfiah, bahasa Yunani memakai dua sebutan: “perintah yang agung dan yang pertama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Inilah
  rationale: Kata tunjuk ini merujuk kembali kepada perintah yang baru dikutip pada ayat 37; “Inilah” wajar dalam bahasa Indonesia dan mempertahankan daya rujuknya.
- source_word: ἐστὶν
  choice: adalah (tersirat dalam “Inilah”)
  rationale: Kopula Yunani dinyatakan secara alami melalui konstruksi “Inilah”, tanpa perlu menambahkan “adalah” yang akan terasa kaku.
- source_word: μεγάλη
  choice: agung
  rationale: Dalam konteks ini kata tersebut menyatakan kebesaran dalam arti kepentingan atau kedudukan, bukan ukuran fisik. “Agung” mempertahankan bentuk positif dan ragam bahasa yang bermartabat.
- source_word: πρώτη
  choice: yang pertama
  rationale: Menerjemahkan secara langsung gagasan urutan atau peringkat dan tetap membedakannya dari μεγάλη.
- source_word: ἐντολή
  choice: perintah
  rationale: “Perintah” adalah padanan Indonesia modern yang alami dan tetap sesuai dengan konteks pembicaraan tentang hukum; “perintah Allah” tidak perlu ditambahkan karena konteks sudah jelas.
theological_decisions:
- issue: Hubungan μεγάλη dan πρώτη dalam menerangkan perintah
  choice: 'Kedua kata sifat diterjemahkan secara koordinatif: “yang agung dan yang pertama.”'
  alternative: “perintah yang terutama” atau “perintah yang paling agung dan yang pertama”
  rationale: Teks Yunani memakai dua kata sifat bentuk positif yang sama-sama menerangkan ἐντολή. Mempertahankan keduanya menghindari peleburan menjadi satu gagasan superlatif dan menjaga perbedaan antara keagungan dan keutamaan urutan atau peringkat.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Konstruksi “Inilah” menghindari susunan kaku “Ini adalah”, sedangkan pengulangan “yang” memperjelas bahwa kedua sifat menerangkan “perintah” secara sejajar.
