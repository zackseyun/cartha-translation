id: MAT.22.36
reference: Matthew 22:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: id
  text: “Guru, perintah manakah yang terutama[a] dalam Hukum Taurat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “besar”; dalam konteks ini dapat juga diterjemahkan “paling utama”.'
    reason: Menjaga bentuk positif μεγάλη sekaligus menunjukkan daya pembandingan yang tersirat dalam konteks.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Bentuk sapaan kepada Yesus; “Guru” merupakan padanan Indonesia yang wajar dan langsung bagi διδάσκαλος dalam konteks ini.
- source_word: ποία
  choice: manakah
  rationale: Kata tanya ini meminta identifikasi satu perintah dari sekumpulan perintah; bentuk “manakah” alami dalam pertanyaan ini.
- source_word: ἐντολὴ
  choice: perintah
  rationale: “Perintah” adalah padanan Indonesia yang jelas bagi ἐντολή dan sesuai dengan konteks ketetapan dalam Taurat.
- source_word: μεγάλη
  choice: terutama
  rationale: Walaupun bentuk Yunani adalah adjektiva positif, dalam konteks pertanyaan tentang kedudukan perintah, “terutama” menyampaikan daya pembandingan secara alami tanpa secara kaku memakai “besar”.
- source_word: ἐν τῷ νόμῳ
  choice: dalam Hukum Taurat
  rationale: νόμος di sini menunjuk pada Taurat sebagai hukum yang diakui dalam Kitab Suci; “Hukum Taurat” jelas dan lazim bagi pembaca Indonesia.
theological_decisions:
- issue: Apakah μεγάλη diterjemahkan secara harfiah sebagai bentuk positif atau secara idiomatis dengan daya pembandingan
  choice: terutama
  alternative: besar; paling utama
  rationale: Bahasa Yunani memakai adjektiva positif μεγάλη, tetapi konteksnya menanyakan kedudukan satu perintah di antara berbagai perintah. “Terutama” mempertahankan makna idiomatis itu tanpa memaksakan bentuk superlatif eksplisit; bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “Guru” dan istilah “Hukum Taurat” mudah dipahami pembaca umum serta sesuai dengan konteks Yahudi.
