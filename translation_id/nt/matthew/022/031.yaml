  to: 'Mengenai kebangkitan orang mati, tidakkah kalian membaca apa yang difirmankan Allah kepada kalian ketika Ia berfirman:'
  rationale: Revisi menghilangkan implikasi berlebihan dari “belum pernahkah,” menandai jamak pada kedua rujukan kepada pendengar, dan memperbaiki pengantar kutipan agar fungsi λέγοντος tersampaikan secara idiomatis. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas tekstual yang perlu dipertahankan dalam ayat ini.
