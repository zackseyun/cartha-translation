review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan topik “kebangkitan orang mati,” agensi Allah, dan arah sapaan kepada para pendengar. Namun, “belum pernahkah” menambahkan penekanan ‘tidak pernah sama sekali’ yang tidak diperlukan oleh aoris ἀνέγνωτε dalam pertanyaan retoris ini. Selain itu, “demikian:” tidak cukup jelas mewakili λέγοντος sebagai pengantar perkataan Allah yang akan dikutip.
  naturalness: Kalimatnya umumnya baku, tetapi “apa yang difirmankan Allah kepadamu demikian:” terasa kurang lancar dalam bahasa Indonesia modern. Penggunaan “kamu” dengan “kepadamu” juga secara bentuk cenderung tunggal, padahal bentuk Yunani adalah jamak.
  terminology: “Kebangkitan orang mati” dan “Allah” sudah tepat, baku, dan sesuai register Alkitab. “Difirmankan” layak dipertahankan karena menyatakan perkataan ilahi tanpa menambahkan klaim teologis di luar teks.
  issues:
  - severity: medium
    issue: “belum pernahkah” terlalu kuat untuk οὐκ ἀνέγνωτε
    rationale: Pertanyaan retoris Yunani menantang apakah mereka tidak membaca Kitab Suci; bentuk ini tidak dengan sendirinya berarti bahwa mereka ‘belum pernah’ membaca sama sekali. “Tidakkah kalian membaca” menyampaikan tantangan itu tanpa penambahan makna.
  - severity: medium
    issue: Kata ganti sasaran tidak mencerminkan bentuk jamak ὑμῖν secara alami
    rationale: “Kepadamu” lazimnya tunggal, sedangkan Yesus berbicara kepada beberapa orang. “Kepada kalian” memperjelas bentuk jamak dan tetap baku.
  - severity: low
    issue: “demikian:” kurang idiomatis sebagai padanan λέγοντος
    rationale: Partisip λέγοντος memperkenalkan kutipan sebagai perkataan Allah. “Ketika Ia berfirman:” menghubungkan pengantar kutipan dengan jelas dan tetap mempertahankan Allah sebagai pelaku ujaran.
