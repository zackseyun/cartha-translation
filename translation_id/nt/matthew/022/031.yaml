base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: id
  text: 'Mengenai kebangkitan orang mati, tidakkah kalian membaca apa yang difirmankan Allah kepada kalian ketika Ia berfirman:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Tentang
  rationale: περί dengan bentuk genitif memperkenalkan pokok pembicaraan, sedangkan δέ menandai peralihan. Dalam bahasa Indonesia, “Tentang” menyampaikan pergantian topik secara alami tanpa melebihkan nuansa pertentangan.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: kebangkitan orang mati
  rationale: Ungkapan ini menunjuk pada bangkitnya orang-orang mati sebagai pokok perdebatan. “Kebangkitan orang mati” merupakan padanan Indonesia yang baku dan jelas.
- source_word: οὐκ ἀνέγνωτε
  choice: belum pernahkah kamu membaca
  rationale: Bentuk aoris menyatakan tindakan membaca, sementara pertanyaan retoris menyoroti ketidakacuhan mereka terhadap Kitab Suci yang semestinya telah mereka baca. “Belum pernahkah” alami dalam bahasa Indonesia untuk tantangan retoris ini.
- source_word: τὸ ῥηθὲν
  choice: apa yang difirmankan
  rationale: Partisip berartikel ini berfungsi sebagai nomina, yakni “apa yang dikatakan.” Karena pelakunya Allah, “difirmankan” merupakan ungkapan Indonesia yang wajar dan bermartabat, sekaligus mempertahankan bentuk pasif.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Bentuk datif berfungsi sebagai objek tak langsung dan menunjukkan bahwa perkataan Kitab Suci itu ditujukan kepada para pendengar Yesus.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Allah
  rationale: ὑπό dengan genitif menandai pelaku. Dalam konstruksi pasif Indonesia “difirmankan Allah,” agensi ilahi tetap jelas tanpa harus memakai “oleh,” yang akan terasa lebih kaku.
- source_word: λέγοντος
  choice: 'demikian:'
  rationale: Partisip ini memperkenalkan kutipan langsung pada ayat berikutnya. “Demikian:” merupakan pengantar kutipan yang alami dalam bahasa Indonesia dan menghindari bentuk canggung “dengan berkata.”
theological_decisions:
- issue: Allah sebagai sumber perkataan dan Kitab Suci sebagai sapaan kepada pendengar
  choice: apa yang difirmankan Allah kepadamu
  alternative: apa yang Allah firmankan kepadamu; apa yang dikatakan kepadamu oleh Allah
  rationale: Terjemahan mempertahankan baik agensi Allah maupun kenyataan bahwa perkataan itu ditujukan kepada para pendengar Yesus, tanpa menambahkan teori inspirasi yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti “kamu” dipakai sebagai bentuk jamak yang ditentukan konteks; kalimat sengaja diakhiri titik dua karena λέγοντος memperkenalkan kutipan dalam ayat berikutnya.
