id: MAT.22.4
reference: Matthew 22:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: id
  text: 'Sekali lagi ia mengutus hamba-hamba yang lain[a], sambil berkata, ‘Katakanlah kepada orang-orang yang telah diundang: “Lihat, aku telah menyiapkan jamuanku; lembu-lembu jantanku dan hewan ternak yang telah digemukkan telah disembelih, dan semuanya sudah siap. Datanglah ke perjamuan nikah[b].”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “hamba-hamba” juga dapat berarti “budak-budak”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke perayaan pernikahan”; bentuk jamak dalam bahasa Yunani dapat menunjuk pada rangkaian perayaan pernikahan secara keseluruhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Sekali lagi
  rationale: Menandai tindakan yang diulang dan terdengar alami dalam narasi Indonesia.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Mengungkapkan tindakan mengirim orang dengan tugas tertentu; lebih tepat bagi utusan pembawa pesan daripada sekadar 'mengirim'.
- source_word: ἄλλους δούλους
  choice: hamba-hamba yang lain
  rationale: Dalam bahasa Indonesia, 'hamba' mempertahankan kedudukan di bawah kuasa tuan dalam rumah tangga kerajaan tanpa memakai 'budak', yang dapat terlalu menonjolkan aspek kepemilikan; ambiguitas leksikal dijelaskan dalam catatan.
- source_word: λέγων
  choice: dengan pesan
  rationale: Mengalihkan participium Yunani menjadi ungkapan pengantar pesan yang wajar dalam narasi Indonesia.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Katakanlah kepada orang-orang yang telah diundang
  rationale: Bentuk perfek pasif menunjukkan bahwa undangan telah diberikan dan status mereka sebagai orang yang diundang masih berlaku.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Seruan modern dan langsung untuk menarik perhatian, tanpa nada arkais.
- source_word: τὸ ἄριστόν μου
  choice: jamuanku
  rationale: Menunjuk pada hidangan atau jamuan yang telah disiapkan; dalam konteks pesta nikah, 'jamuan' lebih alami daripada penentuan waktu makan seperti 'makan siang'.
- source_word: ἡτοίμακα
  choice: aku telah menyiapkan
  rationale: 'Mempertahankan aspek perfek: persiapan telah selesai dengan hasil yang berlaku sekarang.'
- source_word: οἱ ταῦροί μου
  choice: lembu-lembu jantanku
  rationale: ταῦροι menunjuk pada bovina jantan; pilihan ini lebih tepat daripada 'lembu' saja dan lebih mudah dipahami daripada istilah teknis.
- source_word: τὰ σιτιστὰ
  choice: ternak-ternak gemukanku
  rationale: Menunjuk pada hewan ternak yang secara khusus digemukkan, tanpa mempersempitnya menjadi anak lembu karena jenis atau usia hewan tidak dinyatakan dalam bahasa Yunani.
- source_word: τεθυμένα
  choice: telah disembelih
  rationale: Dalam konteks hidangan, kata ini berarti hewan-hewan dibunuh untuk dimakan, bukan dikurbankan dalam ritus.
- source_word: καὶ πάντα ἕτοιμα
  choice: dan semuanya sudah siap
  rationale: Ungkapan Indonesia yang alami dan mempertahankan cakupan menyeluruh πάντα.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Datanglah ke perjamuan nikah
  rationale: δεῦτε merupakan ajakan untuk datang, sedangkan bentuk jamak γάμους dapat menunjuk pada rangkaian perayaan atau pesta nikah.
theological_decisions:
- issue: Makna δοῦλος dalam rumah tangga kerajaan pada perumpamaan
  choice: hamba-hamba
  alternative: budak-budak
  rationale: '''Hamba'' mempertahankan hubungan ketundukan kepada raja dan merupakan istilah Indonesia yang wajar dalam konteks Alkitab. Catatan mengakui bahwa kata Yunani juga dapat berarti budak sehingga realitas sosialnya tidak disembunyikan.'
- issue: Cakupan τοὺς γάμους
  choice: perjamuan nikah
  alternative: pernikahan / pesta-pesta pernikahan
  rationale: Bentuk jamak idiomatis dapat menunjuk pada seluruh perayaan pernikahan. Konteks persiapan makanan mendukung 'perjamuan nikah', tetapi catatan mempertahankan kemungkinan cakupan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk ulang dipakai untuk menyatakan jamak secara jelas. Sapaan dalam kutipan menggunakan 'aku' karena merupakan ujaran langsung sang raja, sedangkan narasi memakai 'ia'.
