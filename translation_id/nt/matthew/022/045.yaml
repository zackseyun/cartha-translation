  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: id
  text: Jadi, jika Daud menyebut dia “Tuhan,” bagaimana mungkin dia adalah anak Daud?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan rujukan konteks dinyatakan lebih jelas: “Jadi, jika Daud menyebut Mesias itu ‘Tuhan,’ bagaimana mungkin Mesias adalah anak Daud?”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Jadi, jika
  rationale: Mempertahankan daya kondisional εἰ dan hubungan kesimpulan οὖν dalam susunan yang alami dalam bahasa Indonesia.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: καλεῖ
  choice: menyebut
  rationale: Menyampaikan makna ‘menyebut atau memanggil sebagai’ dalam konstruksi predikatif ini; lebih tepat daripada sekadar ‘berkata’.
- source_word: αὐτὸν
  choice: dia
  rationale: Pronomina ini merujuk kepada Mesias dari konteks sebelumnya tanpa menambahkan sebutan yang tidak eksplisit dalam ayat ini.
- source_word: κύριον
  choice: “Tuhan”
  rationale: Mempertahankan gelar κύριος dan gaung Mazmur 110:1. Tanda petik memperjelas bahwa ‘Tuhan’ adalah sebutan yang diberikan Daud kepadanya.
- source_word: πῶς
  choice: bagaimana mungkin
  rationale: Mengungkapkan pertanyaan mengenai hubungan logis secara alami, tanpa menjelaskan atau menyelesaikan ketegangan retorisnya.
- source_word: υἱὸς αὐτοῦ
  choice: anak Daud
  rationale: Bahasa Indonesia lazim mengulang anteseden untuk menghindari kerancuan dua pronomina yang sama-sama berbentuk ‘dia’. ‘Anak’ mempertahankan bahasa kekerabatan dan kerajaan, bukan menafsirkannya menjadi ‘keturunan’.
- source_word: ἐστιν
  choice: adalah
  rationale: Padanan langsung untuk kopula kini, sesuai dengan konstruksi nominal bahasa Indonesia baku.
theological_decisions:
- issue: Daya mesianik dan kristologis dari tindakan Daud menyebut sosok itu ‘Tuhan’ sementara ia juga anak Daud
  choice: Mempertahankan ‘Tuhan’ dan ‘anak Daud’ tanpa penjelasan doktrinal dalam teks utama.
  alternative: 'Menambahkan ‘Mesias’ secara eksplisit dalam teks utama: ‘Jika Daud menyebut Mesias itu “Tuhan,” bagaimana mungkin Mesias adalah anak Daud?’'
  rationale: Bahasa Yunani ayat ini memakai pronomina yang rujukannya dibawa dari konteks sebelumnya. Terjemahan utama mempertahankan bentuk tersebut dan membiarkan ketegangan antara status sebagai anak Daud dan sebutan ‘Tuhan’ tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Susunan ‘Jadi, jika’ alami untuk argumen retoris. Pengulangan ‘Daud’ pada bagian akhir mencegah ambiguitas pronominal, sedangkan ‘dia’ pada bagian awal mempertahankan ketidaktersuratan kata ‘Mesias’ dalam bahasa Yunani. Penanda catatan kaki [a] ditempatkan pada akhir ayat.
