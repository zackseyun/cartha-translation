  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: id
  text: Namun, raja itu menjadi marah. Ia lalu mengirim pasukannya, membinasakan para pembunuh itu, dan membakar kota mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: menjadi marah
  rationale: Menyampaikan verba aoris pasif berbentuk deponen secara alami tanpa menambah intensitas yang tidak dinyatakan.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: pasukannya
  rationale: Bentuk jamak Yunani menunjuk pada kekuatan-kekuatan militer milik raja; 'pasukannya' merupakan ungkapan Indonesia yang alami dan dapat mencakup keseluruhannya.
- source_word: ἀπώλεσεν
  choice: membinasakan
  rationale: Menunjukkan penghancuran mematikan terhadap para pembunuh, sesuai konteks tindakan militer dan objek personal.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: para pembunuh itu
  rationale: Mempertahankan acuan demonstratif dan sebutan tegas bagi orang-orang yang telah membunuh para hamba.
- source_word: ἐνέπρησεν
  choice: membakar
  rationale: Secara langsung menyampaikan tindakan membakar kota, tanpa menambahkan keterangan mengenai hasil akhirnya.
theological_decisions:
- issue: Hubungan raja, pasukan, dan dua tindakan penghukuman
  choice: Ia mengirim pasukannya untuk membinasakan para pembunuh itu dan membakar kota mereka.
  alternative: Setelah mengirim pasukannya, ia membinasakan para pembunuh itu dan membakar kota mereka.
  rationale: Subjek gramatikal verba-verba utama tetap 'raja', tetapi secara wajar ia melaksanakan tindakan itu melalui pasukannya. Penggunaan 'untuk' memperjelas hubungan tindakan dalam bahasa Indonesia tanpa memasukkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. 'Namun' menandai kontras δέ secara alami; kalimat dibagi dua agar alur tindakan jelas bagi pembaca modern.
