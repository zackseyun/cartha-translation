  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: id
  text: Pada hari itu, orang-orang Saduki, yang mengatakan bahwa tidak ada kebangkitan, datang kepadanya dan bertanya kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Pada hari itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tetap mempertahankan rujukan temporal teks Yunani.
- source_word: προσῆλθον αὐτῷ
  choice: datang kepada Yesus
  rationale: προσέρχομαι berarti datang kepada atau mendekati. Nama “Yesus” memperjelas acuan kata ganti dalam konteks ayat tanpa mengubah tokoh yang dimaksud.
- source_word: Σαδδουκαῖοι
  choice: orang-orang Saduki
  rationale: Bentuk baku dan mudah dipahami dalam bahasa Indonesia untuk nama kelompok Yahudi tersebut.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: yang mengatakan bahwa tidak ada kebangkitan
  rationale: Klausa relatif secara alami menyampaikan partisipel Yunani sebagai ciri pandangan kelompok itu, tanpa menyatakan bahwa narator membenarkan pandangan mereka.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Istilah Indonesia yang lazim dan tepat untuk ἀνάστασις dalam konteks kebangkitan orang mati.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: bertanya kepadanya
  rationale: ἐπερωτάω dapat berarti bertanya atau mengajukan pertanyaan. “Bertanya” alami dalam narasi dan tidak menambahkan kadar permusuhan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penyajian penyangkalan orang Saduki terhadap kebangkitan
  choice: yang mengatakan bahwa tidak ada kebangkitan
  alternative: sambil mengatakan bahwa tidak ada kebangkitan
  rationale: Partisipel λέγοντες dapat dibaca sebagai keterangan yang mencirikan keyakinan orang Saduki atau sebagai tindakan yang menyertai kedatangan mereka. Terjemahan utama mengikuti pembacaan pencirian yang paling alami dalam konteks, sementara catatan kaki mempertahankan kemungkinan yang lebih adverbial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Kalimat mempertahankan satu rangkaian naratif serta menggunakan nama “Yesus” untuk memperjelas acuan αὐτῷ dalam ayat yang disajikan tersendiri.
