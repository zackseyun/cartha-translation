    issue: Nama “Yesus” ditambahkan pada terjemahan αὐτῷ.
    rationale: Teks Yunani memakai pronomina “kepadanya,” bukan nama. Walaupun acuannya jelas dari konteks, mempertahankan pronomina lebih setia pada bentuk sumber dalam ayat ini.
  - severity: low
    issue: Catatan kaki menawarkan “sambil mengatakan,” yang kurang diperlukan dan kurang tepat sebagai alternatif utama.
    rationale: Dalam konteks ini λέγοντες terutama mencirikan orang Saduki berdasarkan pandangan mereka. Terjemahan utama sudah menangkap fungsi itu, sehingga catatan tersebut tidak menambahkan alternatif leksikal yang berguna.
  revised_text: Pada hari itu, orang-orang Saduki, yang mengatakan bahwa tidak ada kebangkitan, datang kepadanya dan bertanya kepadanya.
