  verdict: revise
  source_fidelity: Draf secara umum menyampaikan urutan dan isi Yunani dengan tepat. Namun, αὐτῷ pada προσῆλθον dan αὐτόν pada ἐπηρώτησαν keduanya adalah pronomina yang merujuk kepada tokoh yang sama; penggantian αὐτῷ dengan nama “Yesus” menambahkan nama yang tidak dinyatakan dalam ayat ini. Terjemahan revisi mempertahankan rujukan pronominal tersebut.
  naturalness: Kalimat revisi tetap baku dan alami dalam bahasa Indonesia modern. Pengulangan “kepadanya” mencerminkan dua hubungan verba yang berbeda dan tidak mengaburkan acuan dalam konteks naratif.
  terminology: “Orang-orang Saduki,” “kebangkitan,” dan “bertanya” sesuai dengan pemakaian Indonesia yang lazim serta dengan Σαδδουκαῖοι, ἀνάστασις, dan ἐπηρώτησαν. Klausa “yang mengatakan bahwa tidak ada kebangkitan” dengan tepat menyajikan partisipel λέγοντες sebagai ciri kelompok tersebut.
  issues:
