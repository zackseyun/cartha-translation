  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Kasihilah Tuhan, Allahmu, dengan segenap hatimu, dengan segenap jiwamu,[a] dan dengan segenap pikiranmu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “jiwa” juga dapat berarti “nyawa” atau “diri”.
    reason: lexical_alternative
  - marker: b
    text: Atau “akal budimu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Jawab
  rationale: Dalam alur dialog ini, δέ adalah penghubung ringan. Bahasa Indonesia secara alami dapat menyerap fungsi penghubung itu ke dalam klausa ujaran tanpa menerjemahkannya secara terpisah.
- source_word: ἔφη αὐτῷ
  choice: Yesus kepadanya
  rationale: ἔφη berarti 'berkata'; karena subjek tersiratnya adalah Yesus dan ujaran ini merupakan tanggapan dalam dialog, 'Jawab Yesus kepadanya' alami tanpa menambahkan isi pada perkataan.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk future indicative ini menggemakan perintah dalam Ulangan dan berfungsi imperatif. Bentuk imperatif Indonesia menyampaikan daya perintah dengan jelas dan wajar.
- source_word: κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: Ini adalah padanan baku dan alami bagi sebutan perjanjian dalam kutipan tersebut; tanda koma menunjukkan bahwa 'Allahmu' menerangkan 'Tuhan'.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: dengan segenap hatimu
  rationale: Walaupun ἐν secara dasar berarti 'di/dalam', konstruksi ini secara idiomatis menyatakan sarana atau keseluruhan keterlibatan. 'Dengan segenap' alami dan mempertahankan penekanan pada totalitas.
- source_word: ψυχῇ
  choice: jiwa
  rationale: ψυχή dapat menunjuk pada jiwa, nyawa, atau diri. 'Jiwa' mempertahankan pembedaan leksikal dalam rangkaian hati–jiwa–pikiran, sementara catatan kaki mengakui keluasan maknanya.
- source_word: διανοίᾳ
  choice: pikiran
  rationale: διάνοια menunjuk pada kemampuan berpikir atau memahami. 'Pikiran' merupakan padanan Indonesia yang ringkas dan alami; 'akal budi' tetap merupakan kemungkinan kontekstual.
theological_decisions:
- issue: Bentuk kutipan perintah utama dari Ulangan
  choice: Mempertahankan tiga unsur 'hati ... jiwa ... pikiran' dan pengulangan 'dengan segenap'
  alternative: Melebur ketiganya menjadi ungkapan umum seperti 'dengan seluruh keberadaanmu'
  rationale: Teks Yunani sengaja menyebut tiga unsur dan mengulang konstruksi totalitas. Terjemahan mempertahankan perbedaan serta tekanan itu tanpa menetapkan pembagian antropologis yang kaku.
- issue: Daya perintah bentuk Ἀγαπήσεις
  choice: Kasihilah
  alternative: Engkau harus mengasihi
  rationale: Future indicative Yunani berfungsi sebagai perintah dalam kutipan Kitab Suci. Imperatif Indonesia menyampaikan fungsi itu dengan lugas tanpa membuat modalitasnya lebih berat daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'Jawab Yesus kepadanya' mempertahankan gerak dialog; 'segenap' memberi nuansa kutipan Kitab Suci tanpa menjadi kuno. Semua penanda catatan kaki muncul dalam teks utama.
