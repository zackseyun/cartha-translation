base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: id
  text: supaya orang Allah[a] itu lengkap dan diperlengkapi sepenuhnya[b] untuk setiap pekerjaan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “manusia Allah.” Ungkapan maskulin tunggal ini mungkin merupakan sebutan alkitabiah yang terutama menunjuk pelayan Allah dalam konteks ini, tetapi dapat juga diterapkan secara lebih luas kepada orang percaya yang dibentuk oleh Kitab Suci.
    reason: cultural_note
  - marker: b
    text: Atau, “dipersiapkan dengan sempurna” atau “dilengkapi sepenuhnya.” Bentuk Yunani ἐξηρτισμένος menyatakan keadaan telah dipersiapkan atau dibekali dengan menyeluruh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan klausa tujuan yang melanjutkan gagasan ayat 16; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya telik ungkapan Yunani.
- source_word: ἄρτιος
  choice: cakap sepenuhnya
  rationale: Mengungkapkan keadaan lengkap, layak, dan mampu menjalankan tugas tanpa memberi kesan kesempurnaan tanpa dosa. Kata 'sepenuhnya' mempertahankan kekuatan makna yang lebih mudah dipahami daripada 'lengkap' bila dikenakan langsung kepada seseorang.
- source_word: ᾖ
  choice: menjadi
  rationale: Dalam konstruksi dengan ἵνα, bentuk subjungtif ini menyatakan hasil yang dimaksudkan; 'supaya ... menjadi' merupakan padanan Indonesia yang wajar.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: orang yang menjadi milik Allah
  rationale: ἄνθρωπος dapat menunjuk manusia atau orang, sedangkan genitif τοῦ θεοῦ menyatakan hubungan dengan Allah. Ungkapan ini alami dalam bahasa Indonesia, tidak menambahkan gagasan 'pelayan' ke dalam teks utama, dan tetap memungkinkan sebutan alkitabiah itu mula-mula menunjuk pelayan Allah dalam konteks.
- source_word: πρὸς
  choice: untuk
  rationale: Menunjukkan kesiapan atau kecocokan bagi suatu tujuan.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: setiap pekerjaan baik
  rationale: Mempertahankan daya distributif πᾶν dan cakupan luas ἔργον, bukan membatasinya pada tindakan tertentu.
- source_word: ἐξηρτισμένος
  choice: diperlengkapi
  rationale: Partisipel perfek pasif ini menggambarkan seseorang yang telah dibuat siap atau telah dibekali secara memadai. Bentuk pasif Indonesia mempertahankan struktur dan hasil yang berkelanjutan.
theological_decisions:
- issue: Cakupan ungkapan ὁ τοῦ θεοῦ ἄνθρωπος
  choice: orang yang menjadi milik Allah
  alternative: abdi Allah
  rationale: Ungkapan Yunani berbentuk tunggal dan mungkin merupakan sebutan alkitabiah yang secara khusus mengarah kepada pelayan Allah dalam konteks. Namun, ἄνθρωπος sendiri tidak harus berarti laki-laki, dan 'abdi' akan mempersempit makna menjadi pelayan. Terjemahan utama mempertahankan cakupan yang dapat berlaku lebih luas, sementara kemungkinan fungsi khusus dicatat dalam catatan kaki.
- issue: Hubungan ἄρτιος dengan ἐξηρτισμένος
  choice: cakap sepenuhnya dan diperlengkapi
  alternative: lengkap, diperlengkapi sepenuhnya
  rationale: 'Kedua istilah yang berdekatan sengaja dipertahankan agar penegasan bertahap dalam bahasa Yunani tetap tampak: keadaan orang itu memadai, dan ia telah disiapkan bagi setiap pekerjaan baik. Terjemahan ini tidak menafsirkan ἄρτιος sebagai kesempurnaan moral tanpa dosa.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang yang menjadi milik Allah' dipilih daripada 'manusia Allah' yang kurang alami atau 'abdi Allah' yang lebih sempit. Susunan kalimat mempertahankan hubungan tujuan dengan ayat sebelumnya serta kesejajaran antara kecakapan dan kesiapan untuk bekerja.
