  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: id
  text: dan bahwa sejak bayi engkau telah mengenal tulisan-tulisan suci[a], yang dapat membuatmu bijaksana untuk keselamatan melalui iman kepada Mesias Yesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Suci.” Secara harfiah, bahasa Yunani berbunyi “tulisan-tulisan suci.”
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin “melalui kesetiaan Mesias Yesus,” walaupun “melalui iman kepada Mesias Yesus” merupakan pengertian yang lebih alami di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: sejak bayi
  rationale: βρέφος menunjuk pada anak yang masih sangat kecil, bahkan bayi. “Sejak bayi” mempertahankan kekuatan ungkapan Yunani dengan bahasa Indonesia yang alami.
- source_word: ἱερὰ γράμματα
  choice: tulisan-tulisan suci
  rationale: Ungkapan ini secara harfiah berarti tulisan-tulisan yang suci. Pilihan ini dekat dengan bentuk Yunani dan tetap jelas merujuk pada tulisan Kitab Suci yang dikenal Timotius.
- source_word: οἶδας
  choice: telah mengenal
  rationale: Walaupun berbentuk perfek dengan makna kini, bersama “sejak bayi” bentuk “telah mengenal” secara alami menyatakan pengetahuan yang dimulai dahulu dan tetap dimiliki.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: yang dapat membuatmu bijaksana
  rationale: Partisip tersebut menerangkan tulisan-tulisan suci, sedangkan σοφίσαι berarti menjadikan bijaksana atau memberi hikmat.
- source_word: εἰς σωτηρίαν
  choice: untuk memperoleh keselamatan
  rationale: εἰς menyatakan arah atau tujuan. Penambahan “memperoleh” menghasilkan bahasa Indonesia yang alami tanpa menyatakan bahwa tulisan itu sendiri menjadi penyebab keselamatan.
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: διά dengan genitif menyatakan sarana; πίστις di sini paling wajar berarti iman.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kepada Mesias Yesus
  rationale: Dalam hubungan dengan “iman”, ἐν secara idiomatis menyatakan pribadi yang menjadi sasaran atau lingkup iman. Χριστός dipertahankan sebagai gelar dan diterjemahkan “Mesias”.
theological_decisions:
- issue: Χριστός sebagai gelar atau unsur nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός masih membawa arti gelar “Yang Diurapi”; “Mesias Yesus” mempertahankan makna gelar itu tanpa memperlakukannya semata-mata sebagai nama.
- issue: Makna πίστεως dalam διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: melalui iman kepada Mesias Yesus
  alternative: melalui kesetiaan Mesias Yesus
  rationale: Susunan dengan ἐν paling alami menunjuk pada iman seseorang yang tertuju kepada atau berada dalam Mesias Yesus. Kemungkinan “kesetiaan Mesias Yesus” dicatat agar ketegangan leksikal πίστις tidak dihilangkan, walaupun kurang wajar dalam konstruksi ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Kata ganti “engkau” dipakai karena ayat ini merupakan sapaan pribadi Paulus kepada Timotius. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
