id: 2TI.3.7
reference: 2 Timothy 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: id
  text: yang selalu belajar, tetapi tidak pernah dapat sampai pada pengetahuan tentang kebenaran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengetahuan penuh tentang kebenaran.” Kata Yunani yang dipakai dapat mengandung arti pengetahuan yang lebih penuh atau lebih lengkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: selalu
  rationale: Menunjukkan tindakan yang terus berlangsung atau berulang dan mempertahankan kontras retoris dengan μηδέποτε.
- source_word: μανθάνοντα
  choice: belajar
  rationale: Partisipel kini ini menggambarkan proses menerima pengetahuan atau pengajaran yang terus berlangsung tanpa menentukan apakah prosesnya formal atau informal.
- source_word: μηδέποτε
  choice: tidak pernah
  rationale: Menyampaikan penyangkalan temporal yang tegas dan berlawanan langsung dengan 'selalu'.
- source_word: εἰς ἐπίγνωσιν
  choice: sampai pada pengetahuan
  rationale: Mengungkapkan gerak menuju atau tibanya seseorang pada pengetahuan. Kata 'pengetahuan' tidak memaksakan nuansa 'penuh', yang mungkin tetapi tidak wajib dalam konteks ini.
- source_word: ἀληθείας
  choice: tentang kebenaran
  rationale: Genitif ini menerangkan isi pengetahuan. Ungkapan Indonesia tersebut alami dan tetap menunjuk kepada kebenaran yang dimaksud dalam konteks Paulus.
- source_word: ἐλθεῖν
  choice: sampai
  rationale: Dalam konstruksi ini, 'sampai' secara alami mempertahankan metafora kedatangan atau pencapaian suatu tujuan.
- source_word: δυνάμενα
  choice: dapat
  rationale: Menyatakan kemampuan. Bentuknya merujuk kepada para perempuan dalam ayat sebelumnya, sehingga subjek tidak perlu diulang dalam fragmen ayat ini.
theological_decisions:
- issue: Nuansa ἐπίγνωσις dalam pemakaian Paulus
  choice: pengetahuan
  alternative: pengetahuan penuh
  rationale: Istilah ini dapat mengandung gagasan pengetahuan yang lebih penuh atau lengkap, tetapi konteks terutama menekankan ketidakmampuan mereka tiba pada pengetahuan sejati meskipun selalu belajar. Nuansa yang lebih kuat dipertahankan dalam catatan kaki tanpa dijadikan satu-satunya tafsiran dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur fragmen dipertahankan karena ayat ini melanjutkan gambaran tentang para perempuan pada ayat sebelumnya; 'tetapi' memperjelas kontras kuat antara selalu belajar dan tidak pernah sampai pada pengetahuan tentang kebenaran.
