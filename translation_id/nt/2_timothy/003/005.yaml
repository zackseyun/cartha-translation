  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: id
  text: Mereka memiliki bentuk kesalehan[a], tetapi telah menyangkal kuasanya. Jauhilah[b] orang-orang seperti itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penampilan kesalehan.” Kata Yunani ini dapat menekankan bentuk atau penampilan lahiriah; “bentuk” dipilih untuk mempertahankan pertentangannya dengan “kuasa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Berpalinglah dari” atau “Hindarilah.” Kata kerjanya mengandung arti menjauhkan diri dari mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: Mereka memiliki
  rationale: Partisipel kini ini meneruskan gambaran tentang orang-orang dalam konteks sebelumnya. Klausa mandiri dengan subjek tersurat terasa alami dalam bahasa Indonesia.
- source_word: μόρφωσιν
  choice: bentuk
  rationale: Kata ini dapat menunjuk pada bentuk atau penampilan lahiriah. “Bentuk” mempertahankan pertentangan yang disengaja dengan “kuasa” tanpa menafsirkan secara berlebihan.
- source_word: εὐσεβείας
  choice: kesalehan
  rationale: Dalam surat-surat Pastoral, istilah ini menunjuk pada kehidupan yang hormat dan terarah kepada Allah. “Kesalehan” merupakan padanan Indonesia yang alami dan tidak membatasinya hanya pada kegiatan ibadah.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: tetapi ... kuasanya
  rationale: “Kuasanya” mempertahankan hubungan kata ganti dengan kesalehan dan membiarkan cakupan kuasa itu tetap luas sebagaimana dalam teks Yunani.
- source_word: ἠρνημένοι
  choice: telah menyangkal
  rationale: Partisipel perfek menunjukkan sikap penyangkalan yang telah diambil dan tetap berlaku. “Telah menyangkal” mempertahankan nuansa keadaan yang dihasilkan itu.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Jauhilah orang-orang seperti itu
  rationale: Imperatif kini medial memerintahkan Timotius untuk berpaling atau menjaga jarak dari golongan yang baru digambarkan. “Orang-orang seperti itu” menyatakan rujukan jamak τούτους dengan wajar.
theological_decisions:
- issue: Pertentangan antara bentuk lahiriah kesalehan dan realitasnya yang berkuasa
  choice: bentuk kesalehan ... kuasanya
  alternative: penampilan kesalehan ... kuasanya
  rationale: Terjemahan mempertahankan pertentangan Paulus tanpa menentukan bahwa “kuasa” hanya berarti mukjizat, perubahan moral, atau karya Roh Kudus; ungkapan Yunani tetap lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kesalehan” dipilih alih-alih “ibadah” agar maknanya tidak menyempit menjadi kegiatan peribadatan. Aspek perfek pada ἠρνημένοι dipertahankan dengan “telah,” sedangkan perintah penutup dibuat langsung dan alami.
