  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: id
  text: Namun, orang-orang jahat dan penipu akan semakin memburuk,[b] menyesatkan dan disesatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menipu dan ditipu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “akan maju menuju yang lebih buruk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: jahat
  rationale: Menunjukkan keburukan moral, bukan sekadar mutu yang buruk.
- source_word: δὲ
  choice: Namun
  rationale: Menyatakan pertentangan dengan uraian sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: ἄνθρωποι
  choice: orang-orang
  rationale: Bentuk jamak ini bersifat umum dan tidak terbatas pada laki-laki.
- source_word: γόητες
  choice: para penipu
  rationale: Menyampaikan gagasan tentang orang-orang curang yang memperdaya tanpa mempersempit maknanya menjadi praktik sihir.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: akan menjadi semakin buruk
  rationale: Mengungkapkan gerak maju yang ironis menuju keadaan yang lebih buruk dalam bahasa Indonesia yang alami.
- source_word: πλανῶντες
  choice: menyesatkan
  rationale: Mempertahankan kegiatan aktif yang terus berlangsung, yakni membawa orang lain ke dalam kesesatan.
- source_word: πλανώμενοι
  choice: disesatkan
  rationale: Mempertahankan bentuk pasif dan ketegangan bahwa mereka yang menyesatkan juga mengalami penyesatan.
theological_decisions:
- issue: Cakupan ἄνθρωποι
  choice: orang-orang
  alternative: laki-laki
  rationale: Kata ini mengacu secara umum kepada manusia, bukan khusus kepada laki-laki.
- issue: Nuansa γόητες
  choice: para penipu
  alternative: para tukang sihir
  rationale: Konteks menonjolkan penipuan, sedangkan terjemahan yang secara tegas menyebut sihir akan memasukkan rincian yang tidak dipastikan oleh konteks.
- issue: Hubungan aktif-pasif πλανῶντες καὶ πλανώμενοι
  choice: menyesatkan dan disesatkan
  alternative: menipu dan tertipu
  rationale: Pilihan ini mempertahankan kesejajaran aktif-pasif serta kemungkinan makna membawa ke jalan yang salah, tanpa menentukan siapa atau apa yang menyesatkan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan bentuk aktif-pasif dipertahankan untuk mencerminkan struktur dan ketegangan teks Yunani.
