id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: id
  text: Sebab orang akan mencintai diri sendiri, mencintai uang, suka membual, sombong, suka memfitnah[a], tidak taat kepada orang tua, tidak tahu berterima kasih, tidak saleh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suka menghujat” atau “suka berkata kasar.” Istilah Yunani ini dapat merujuk pada perkataan yang menghina atau mencemarkan manusia maupun Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: akan
  rationale: Bentuk futur dari εἰμί menyatakan keadaan yang akan terjadi; dalam konstruksi Indonesia, kopula tidak perlu dinyatakan dan makna futur dibawa oleh “akan”.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan argumentatif secara alami.
- source_word: οἱ ἄνθρωποι
  choice: orang
  rationale: Ungkapan ini merujuk secara umum kepada manusia, bukan khusus laki-laki; “orang” wajar dan inklusif dalam bahasa Indonesia.
- source_word: φίλαυτοι
  choice: mencintai diri sendiri
  rationale: Menyampaikan kasih yang berpusat pada diri secara jelas dan mempertahankan kesejajaran dengan kata berikutnya.
- source_word: φιλάργυροι
  choice: mencintai uang
  rationale: Mencerminkan arti harfiah kasih kepada uang tanpa memperluasnya menjadi segala bentuk keserakahan.
- source_word: ἀλαζόνες
  choice: suka membual
  rationale: Menunjukkan kebiasaan membanggakan diri atau membuat klaim besar dengan nada tercela; lebih alami daripada nomina pelaku dalam daftar ini.
- source_word: ὑπερήφανοι
  choice: sombong
  rationale: Mengungkapkan keangkuhan yang bernilai moral negatif secara ringkas dan lazim.
- source_word: βλάσφημοι
  choice: suka memfitnah
  rationale: Mewakili perkataan yang mencemarkan atau menghina dalam konteks relasional, sementara cakupan terhadap penghinaan kepada Allah atau perkataan kasar dipertahankan dalam catatan kaki.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: tidak taat kepada orang tua
  rationale: Padanan Indonesia yang langsung dan idiomatis bagi sikap menolak menaati orang tua.
- source_word: ἀχάριστοι
  choice: tidak tahu berterima kasih
  rationale: Ungkapan Indonesia yang alami untuk ketiadaan rasa syukur atau terima kasih.
- source_word: ἀνόσιοι
  choice: tidak suci
  rationale: Mempertahankan bobot religius-moral dari ketiadaan kesalehan atau penghormatan terhadap yang kudus tanpa menyamakannya begitu saja dengan istilah lain untuk kefasikan.
theological_decisions:
- issue: Cakupan umum οἱ ἄνθρωποι
  choice: orang
  alternative: manusia; orang-orang
  rationale: Referennya bersifat generik dan tidak terbatas pada laki-laki; bentuk “orang” juga alami sesudah “Sebab” dalam kalimat predikatif ini.
- issue: Makna βλάσφημοι dalam daftar keburukan
  choice: suka memfitnah
  alternative: menghujat; berkata kasar
  rationale: Istilah Yunani dapat menunjuk pada perkataan yang merusak nama orang maupun yang menghina Allah. Teks utama memilih nuansa antarpribadi yang mungkin menonjol dalam daftar ini, tetapi catatan kaki menjaga ambiguitas sumber.
- issue: Makna religius ἀνόσιοι
  choice: tidak suci
  alternative: tidak saleh; fasik
  rationale: “Tidak suci” menjaga hubungan dengan ranah kekudusan dan penghormatan terhadap yang sakral, tanpa mempersempit istilah hanya pada praktik ibadah atau memperluasnya menjadi kefasikan secara umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama daftar yang ringkas dan bermartabat. Pengulangan “mencintai” mempertahankan kesejajaran dua kata majemuk Yunani pertama. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
