base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: id
  text: penganiayaan dan penderitaan yang menimpaku di Antiokhia, di Ikonium, dan di Listra—betapa hebatnya penganiayaan yang kutanggung! Dan dari semuanya itu Tuhan melepaskan aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tuhan” kemungkinan besar merujuk kepada Tuhan Yesus, meskipun teks Yunani hanya menyebut “Tuhan”.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς διωγμοῖς / οἵους διωγμούς
  choice: penganiayaan-penganiayaan / betapa beratnya penganiayaan
  rationale: Kata διωγμός menunjuk pada pengejaran atau penindasan bermusuhan. Bentuk ulang pada penyebutan pertama wajar dalam bahasa Indonesia untuk menunjukkan berbagai kejadian, sedangkan οἵους diterjemahkan secara kualitatif dan eksklamatif sebagai 'betapa beratnya' tanpa mengubahnya menjadi sekadar pertanyaan tentang jenis.
- source_word: τοῖς παθήμασιν
  choice: penderitaan-penderitaan
  rationale: πάθημα mencakup berbagai pengalaman menderita; 'penderitaan' mempertahankan keluasan maknanya.
- source_word: οἷά μοι ἐγένετο
  choice: yang menimpaku
  rationale: Ungkapan ini menyatakan hal-hal yang terjadi atau datang atas Paulus. 'Yang menimpaku' alami dan tetap mempertahankan pengalaman penderitaan tersebut.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: di Antiokhia, di Ikonium, dan di Listra
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim, sementara pengulangan 'di' mengikuti irama daftar Yunani.
- source_word: ὑπήνεγκα
  choice: kutanggung
  rationale: ὑποφέρω berarti menanggung atau bertahan di bawah tekanan. 'Kutanggung' ringkas, idiomatis, dan sesuai dengan penganiayaan yang dialami.
- source_word: ἐκ πάντων
  choice: dari semuanya itu
  rationale: Frasa ini merujuk kembali pada seluruh penganiayaan dan penderitaan yang baru disebutkan, dengan ungkapan Indonesia yang alami.
- source_word: ἐρρύσατο
  choice: menyelamatkan
  rationale: ῥύομαι berarti melepaskan atau menyelamatkan dari bahaya. Dalam konteks ini 'menyelamatkan' menyatakan tindakan pembebasan konkret, bukan dengan sendirinya istilah teknis tentang keselamatan kekal.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Gelar κύριος diterjemahkan sebagai 'Tuhan' tanpa menambahkan nama referennya.
theological_decisions:
- issue: Referen ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Dalam konteks Paulus, gelar ini kemungkinan besar menunjuk kepada Tuhan Yesus, tetapi teks Yunani hanya mengatakan 'Tuhan'; terjemahan mempertahankan ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah dan seruan menyampaikan daya kualitatif οἵους; 'Namun' mengungkapkan peralihan wacana dari penderitaan kepada penyelamatan tanpa memperberat struktur kalimat.
