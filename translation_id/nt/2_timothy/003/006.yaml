  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: id
  text: Sebab, di antara mereka ada orang-orang yang menyusup ke rumah-rumah dan menawan perempuan-perempuan lemah[a] yang sarat dengan dosa dan dituntun oleh berbagai keinginan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perempuan-perempuan kecil”; dalam konteks ini merupakan sebutan bernada merendahkan bagi perempuan-perempuan yang rentan atau lemah, bukan bagi perempuan pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: di antara mereka
  rationale: Ungkapan ini menunjukkan bahwa orang-orang tersebut termasuk dalam kelompok yang baru saja digambarkan; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: menyusup ke rumah-rumah
  rationale: Kata kerja ini menyiratkan masuk secara diam-diam atau licik. 'Rumah-rumah' mempertahankan bentuk konkret jamak dari οἰκίας tanpa menghilangkan konteks rumah tangga.
- source_word: αἰχμαλωτίζοντες
  choice: menawan
  rationale: Pilihan ini mempertahankan citra menangkap atau menjadikan seseorang tawanan, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: γυναικάρια
  choice: perempuan-perempuan lemah
  rationale: Bentuk diminutif ini bernada merendahkan dan dalam konteks menunjuk pada sekelompok perempuan yang rentan, bukan perempuan pada umumnya. Catatan kaki mempertahankan nuansa harfiahnya.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: sarat dengan dosa
  rationale: Partisipel perfektif menggambarkan keadaan akibat dosa yang telah menumpuk; 'sarat' menyampaikan bobot atau beban itu secara alami.
- source_word: ἀγόμενα
  choice: diseret
  rationale: Bentuk pasif menunjukkan bahwa mereka dibawa atau digerakkan oleh keinginan. 'Diseret' mempertahankan daya negatif yang kuat tanpa menentukan tujuan yang tidak disebutkan.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: oleh berbagai keinginan
  rationale: '''Keinginan'' cukup luas untuk ἐπιθυμίαις, sedangkan ''berbagai'' secara langsung mencerminkan ποικίλαις.'
theological_decisions:
- issue: Sebutan peyoratif γυναικάρια
  choice: perempuan-perempuan lemah
  alternative: perempuan-perempuan kecil; perempuan-perempuan yang mudah diperdaya
  rationale: Terjemahan ini menyatakan kerentanan kelompok tertentu dalam konteks tanpa mengubahnya menjadi pernyataan umum mengenai semua perempuan. Nuansa diminutif dan merendahkan dijelaskan dalam catatan kaki.
- issue: Lingkup οἰκίας
  choice: rumah-rumah
  alternative: rumah tangga-rumah tangga
  rationale: Bentuk konkret 'rumah-rumah' paling langsung mewakili nomina Yunani, sementara konteks tetap menunjukkan penyusupan ke lingkungan domestik.
- issue: Daya pasif ἀγόμενα
  choice: diseret
  alternative: dituntun; dibawa
  rationale: '''Diseret'' mempertahankan gambaran bahwa berbagai keinginan menguasai mereka, tetapi tidak menambahkan kesimpulan teologis tentang tingkat tanggung jawab moral mereka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, dengan citra penyusupan, penawanan, beban dosa, dan kendali berbagai keinginan tetap dipertahankan. Tanda baca akhir menggunakan titik karena ayat disajikan mandiri.
