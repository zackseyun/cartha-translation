lexical_decisions:
- source_word: προδόται
  choice: pengkhianat
  rationale: Menunjuk pada orang yang berkhianat atau tidak setia; bentuk nomina jamak dalam daftar sifat buruk ini diterjemahkan secara ringkas dan alami.
- source_word: προπετεῖς
  choice: nekat
  rationale: Menggambarkan orang yang bertindak terburu-buru tanpa mempertimbangkan akibat. 'Nekat' merupakan padanan Indonesia modern yang ringkas; alternatif makna dicatat dalam catatan kaki.
- source_word: τετυφωμένοι
  choice: besar kepala
  rationale: Partisipel perfek pasif dari τυφόομαι menyatakan keadaan telah menjadi sombong atau membusungkan diri. Ungkapan 'besar kepala' mempertahankan nuansa kiasan dengan bahasa Indonesia yang mudah dipahami.
- source_word: φιλήδονοι
  choice: lebih mencintai kesenangan
  rationale: Kata majemuk ini berarti mencintai kesenangan. Bentuk verbal dipakai agar kontras dengan kasih kepada Allah terdengar alami dalam bahasa Indonesia.
- source_word: μᾶλλον ἢ
  choice: lebih ... daripada
  rationale: Konstruksi komparatif ini dapat menyatakan derajat atau preferensi. 'Lebih ... daripada' mempertahankan kemungkinan bahwa yang disoroti ialah prioritas kasih, tanpa mengubahnya menjadi penyangkalan mutlak.
- source_word: φιλόθεοι
  choice: mencintai Allah
  rationale: Berarti mengasihi atau mencintai Allah; pilihan ini membentuk kesejajaran langsung dengan 'mencintai kesenangan'.
theological_decisions:
- issue: Kontras antara φιλήδονοι dan φιλόθεοι
  choice: lebih mencintai kesenangan daripada mencintai Allah
  alternative: mencintai kesenangan dan bukan Allah
  rationale: Bahasa Yunani memakai perbandingan μᾶλλον ἢ. Terjemahan komparatif mempertahankan ketegangan teks tanpa memperkerasnya menjadi penyangkalan mutlak terhadap segala kasih kepada Allah.
- issue: Metafora τετυφωμένοι
  choice: besar kepala
  alternative: sombong
  rationale: Ungkapan kiasan Indonesia menyampaikan keadaan angkuh dengan jelas, sedangkan catatan kaki menyediakan padanan langsung yang tidak metaforis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya daftar yang ringkas dan bermartabat. Kesejajaran antara cinta akan kesenangan dan cinta kepada Allah dipertahankan, sementara idiom 'besar kepala' memberi kealamian tanpa menghilangkan citra metaforis.
