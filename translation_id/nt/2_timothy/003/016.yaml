  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: id
  text: Setiap tulisan Kitab Suci[a] diembuskan oleh Allah dan bermanfaat[b] untuk mengajar, untuk menunjukkan kesalahan, untuk memperbaiki, dan untuk mendidik orang supaya hidup benar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seluruh Kitab Suci.” Ungkapan Yunani πᾶσα γραφή dapat dipahami secara distributif (“setiap tulisan Kitab Suci”) atau secara kolektif (“seluruh Kitab Suci”).
    reason: alternative_reading
  - marker: b
    text: Susunan kalimat Yunani juga dapat dipahami, “Setiap tulisan Kitab Suci yang diembuskan oleh Allah juga bermanfaat untuk mengajar, untuk menunjukkan kesalahan, untuk memperbaiki, dan untuk mendidik orang supaya hidup benar.”
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “dalam kebenaran.” Kata Yunani δικαιοσύνη juga dapat berarti “keadilan” dalam konteks tertentu; di sini maksudnya ialah pembentukan moral menuju kehidupan yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Setiap tulisan Kitab Suci
  rationale: Bentuk ini mempertahankan nuansa distributif πᾶσα γραφή, sedangkan konteks 2 Timotius 3:15–17 menunjukkan bahwa γραφή merujuk pada tulisan suci, bukan sembarang tulisan. Kemungkinan pengertian kolektif dicantumkan dalam catatan kaki.
- source_word: θεόπνευστος
  choice: diembuskan Allah
  rationale: Terjemahan ini mencerminkan secara transparan unsur pembentuk kata θεόπνευστος (‘Allah’ dan ‘napas/embusan’) tanpa memasukkan teori inspirasi tertentu. Bentuk pasif tanpa kata ‘oleh’ tetap alami dalam bahasa Indonesia.
- source_word: ὠφέλιμος
  choice: bermanfaat
  rationale: ‘Bermanfaat’ menyampaikan arti berguna atau mendatangkan faedah secara wajar dalam bahasa Indonesia modern.
- source_word: πρὸς διδασκαλίαν
  choice: untuk mengajar
  rationale: Ungkapan ini mencakup kegiatan dan isi pengajaran serta lebih mudah dipahami daripada istilah teknis seperti ‘doktrin’.
- source_word: ἐλεγμόν
  choice: untuk menunjukkan kesalahan
  rationale: ἐλεγμός menunjuk pada penyingkapan atau pembuktian kesalahan. Pilihan ini mempertahankan cakupan tersebut dan tidak membatasinya pada teguran lisan.
- source_word: ἐπανόρθωσιν
  choice: untuk memperbaiki
  rationale: Kata ini menyatakan tindakan membetulkan atau memulihkan sesuatu kepada keadaan yang semestinya; ‘memperbaiki’ ringkas dan alami.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: untuk mendidik orang supaya hidup benar
  rationale: παιδεία mencakup pendidikan, pembinaan, dan disiplin. Dalam konteks ini, δικαιοσύνη menunjuk pada pembentukan moral menuju kehidupan yang lurus; ungkapan verbal ini jelas bagi pembaca modern.
- source_word: δικαιοσύνῃ
  choice: hidup benar
  rationale: Dalam konteks pembinaan moral, pilihan ini menyampaikan kehidupan yang lurus di hadapan Allah dengan lebih alami daripada kata benda abstrak ‘kebenaran’, yang dalam bahasa Indonesia juga dapat dipahami hanya sebagai kebenaran faktual.
theological_decisions:
- issue: Hubungan sintaksis θεόπνευστος dan ὠφέλιμος dengan πᾶσα γραφή
  choice: 'Kedua kata sifat dipahami sebagai predikat: ‘Setiap tulisan Kitab Suci diembuskan Allah dan bermanfaat.’'
  alternative: ‘Setiap tulisan Kitab Suci yang diembuskan Allah juga bermanfaat ...’
  rationale: Pembacaan predikatif paling wajar menempatkan kedua kata sifat secara sejajar dan sesuai dengan alur menuju ayat 17. Namun, pembacaan atributif dimungkinkan secara tata bahasa dan karena itu dipertahankan dalam catatan kaki.
- issue: Cakupan πᾶσα γραφή
  choice: 'Dipahami secara distributif: ‘Setiap tulisan Kitab Suci.’'
  alternative: 'Dipahami secara kolektif: ‘Seluruh Kitab Suci.’'
  rationale: Ketiadaan kata sandang memungkinkan kedua pengertian. Teks utama mengikuti bentuk distributif Yunani dengan dekat, sementara kemungkinan kolektif dicatat agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur daftar Yunani dipertahankan melalui pengulangan ‘untuk’. Ungkapan ‘diembuskan Allah’ sengaja mempertahankan metafora sumber, sedangkan ‘mendidik orang supaya hidup benar’ membuat fungsi παιδεία dalam konteks pembentukan moral terdengar alami.
