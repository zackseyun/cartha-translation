  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: id
  text: Dan memang, semua orang yang ingin hidup saleh dalam Mesias Yesus[a] akan dianiaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Kristus Yesus.”
    reason: Alternatif penerjemahan Χριστός dengan bentuk tradisional yang lebih menyerupai nama.
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: Dan memang, semua orang
  rationale: Gabungan καί dan δέ menghubungkan pernyataan ini dengan konteks sebelumnya sekaligus memberi penegasan. “Dan memang” mempertahankan kedua nuansa itu tanpa menciptakan pertentangan yang kuat; πάντες menyatakan cakupan menyeluruh.
- source_word: οἱ θέλοντες
  choice: yang ingin
  rationale: Konstruksi artikel dan partisip kini menunjuk kepada kelompok orang yang mempunyai keinginan tersebut. “Yang ingin” alami dalam bahasa Indonesia dan mempertahankan unsur kehendak pada θέλω.
- source_word: ζῆν εὐσεβῶς
  choice: hidup saleh
  rationale: εὐσεβῶς menerangkan cara hidup yang ditandai oleh penghormatan dan pengabdian kepada Allah. “Hidup saleh” ringkas, wajar, dan tidak terasa kuno.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: ἐν menyatakan lingkup atau hubungan hidup dengan Yesus; Χριστός di sini tetap berfungsi sebagai gelar, sehingga diterjemahkan “Mesias”, bukan sekadar diperlakukan sebagai nama.
- source_word: διωχθήσονται
  choice: akan dianiaya
  rationale: Bentuk pasif futur dari διώκω menyatakan bahwa mereka akan menjadi sasaran penganiayaan. Terjemahan ini langsung dan mempertahankan bentuk pasifnya.
theological_decisions:
- issue: Χριστῷ sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός secara leksikal berarti Yang Diurapi dan dalam frasa ini dapat dipahami tetap membawa daya gelarnya. “Mesias Yesus” menyatakan gelar itu secara transparan, sedangkan alternatif yang lazim dicatat dalam catatan kaki.
- issue: Lingkup janji mengenai penganiayaan
  choice: semua orang yang ingin hidup saleh
  alternative: orang-orang saleh tertentu akan dianiaya
  rationale: πάντες secara eksplisit memberi cakupan universal kepada kelompok yang diterangkan oleh οἱ θέλοντες. Terjemahan tidak membatasi pernyataan itu atau mengubahnya menjadi kemungkinan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Dan memang” mempertahankan hubungan serta penegasan dalam teks Yunani; “hidup saleh” dipilih karena mudah dipahami tanpa kehilangan nuansa religius-moral.
