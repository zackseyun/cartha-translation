id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: id
  text: Sebagaimana Yanes dan Yambres menentang Musa[a], demikian juga orang-orang ini menentang kebenaran. Pikiran mereka telah rusak, dan dalam hal iman mereka tidak tahan uji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melawan Musa” ... “melawan kebenaran.”'
    reason: lexical_alternative
  - marker: b
    text: “Iman” di sini kemungkinan menunjuk pada iman Kristen atau berita rasuli, bukan sekadar kepercayaan pribadi.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Sebagaimana
  rationale: Ungkapan ini membuka perbandingan. Partikel δέ menandai perkembangan ringan dalam uraian dan tidak perlu diterjemahkan dengan kata penghubung tersendiri dalam bahasa Indonesia.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Yanes dan Yambres
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: ἀντέστησαν ... ἀνθίστανται
  choice: menentang ... menentang
  rationale: Pengulangan verba yang sama mempertahankan kesejajaran antara tindakan terhadap Musa dan tindakan orang-orang ini terhadap kebenaran; bentuk kini pada verba kedua menyatakan tindakan yang sedang berlangsung.
- source_word: οὕτως καὶ οὗτοι
  choice: demikian juga orang-orang ini
  rationale: Mempertahankan hubungan korelatif dengan 'Sebagaimana' dan menunjuk secara jelas kepada kelompok yang sedang dibicarakan.
- source_word: τῇ ἀληθείᾳ
  choice: kebenaran
  rationale: Mempertahankan keluasan istilah Yunani tanpa mempersempitnya dalam teks utama menjadi Injil atau ajaran tertentu.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: Pikiran mereka telah rusak
  rationale: Menyampaikan keadaan yang dihasilkan oleh bentuk partisip perfektif serta relasi 'dalam hal pikiran' dengan bahasa Indonesia yang alami. Rujukan kepada orang-orang tersebut tetap jelas tanpa mengulang kata 'orang' secara kaku.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: dalam hal iman mereka tidak tahan uji
  rationale: ἀδόκιμοι menggambarkan sesuatu atau seseorang yang gagal ketika diuji dan tidak terbukti layak. Ungkapan ini mempertahankan citra pengujian tanpa memaksakan gagasan bahwa mereka secara formal telah didiskualifikasi.
theological_decisions:
- issue: Rujukan 'kebenaran' dan 'iman'
  choice: 'Kedua istilah dipertahankan dalam bentuk luas: ''kebenaran'' dan ''iman''.'
  alternative: '''Kebenaran'' dapat diperjelas sebagai kebenaran Injil, dan ''iman'' sebagai ajaran iman Kristen atau kepercayaan pribadi.'
  rationale: Konteks mengarah kepada berita atau ajaran rasuli, tetapi istilah Yunani sendiri tetap cukup luas. Terjemahan utama tidak menyelesaikan ambiguitas itu secara diam-diam.
- issue: Makna evaluatif ἀδόκιμοι
  choice: tidak tahan uji
  alternative: ditolak; tidak layak; gagal dalam iman
  rationale: Pilihan ini mempertahankan nuansa gagal memenuhi pengujian sambil menghindari penambahan mekanisme formal 'diskualifikasi' yang tidak dinyatakan secara eksplisit.
- issue: Rujukan ἄνθρωποι
  choice: orang-orang ini / mereka
  alternative: laki-laki ini
  rationale: Konteks menunjuk kepada tokoh-tokoh penyesat tertentu, tetapi ἄνθρωποι sendiri dapat berarti manusia atau orang. Bahasa Indonesia tidak perlu menandai gender pada sebutan ini, dan konteks tetap dipertahankan tanpa menambah informasi yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur perbandingan dipertahankan, lalu klausa deskriptif dipecah menjadi kalimat kedua agar alami dan mudah dipahami. Semua penanda catatan kaki terdapat dalam teks utama.
