  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: id
  text: 'Namun, ketahuilah ini: pada hari-hari terakhir akan datang masa-masa sulit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masa-masa yang berbahaya” atau “masa-masa yang berat.” Kata sifat Yunani ini dapat menunjuk pada masa yang sulit, berbahaya, atau menyedihkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ini
  rationale: Kata tunjuk netral ini menunjuk ke depan kepada isi klausa yang diperkenalkan oleh ὅτι; “ini” alami dan tepat dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan dengan kontras ringan dari konteks sebelumnya. “Namun” mempertahankan nuansa itu tanpa membuat pertentangannya terlalu kuat.
- source_word: γίνωσκε
  choice: ketahuilah
  rationale: Bentuk imperatif aktif kini orang kedua tunggal. “Ketahuilah” menyampaikan perintah kepada Timotius agar menyadari kenyataan yang akan disebutkan.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι memperkenalkan isi yang harus diketahui. Setelah “ketahuilah ini”, tanda titik dua menyatakannya secara alami dalam bahasa Indonesia.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: pada hari-hari terakhir
  rationale: Ungkapan eskatologis sumber dipertahankan tanpa mempersempit cakupan waktunya. Preposisi “pada” alami untuk keterangan masa.
- source_word: ἐνστήσονται
  choice: akan datang
  rationale: Bentuk futur medium ἐνίστημι di sini berarti hadir, tiba, atau mulai berlangsung. “Akan datang” jelas dan wajar ketika subjeknya adalah masa-masa.
- source_word: καιροὶ
  choice: masa-masa
  rationale: καιρός menunjuk pada masa, musim, atau kurun tertentu, bukan sekadar waktu kronologis. “Masa-masa” mempertahankan bentuk jamak dan nuansa periode.
- source_word: χαλεποί
  choice: sukar
  rationale: χαλεπός dapat berarti sulit, berat, berbahaya, atau ganas. “Sukar” ringkas, bermartabat, dan cukup luas, sedangkan kemungkinan nuansa bahayanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna “hari-hari terakhir”
  choice: Mempertahankan ungkapan eskatologis “hari-hari terakhir” tanpa membatasinya hanya pada masa tepat sebelum kedatangan Kristus kembali.
  alternative: Menafsirkannya secara eksplisit sebagai masa terakhir menjelang akhir, atau sebagai keseluruhan zaman akhir yang telah dimulai.
  rationale: Teks Yunani tidak menentukan salah satu sistem eskatologis tersebut dalam ayat ini. Terjemahan mempertahankan ketegangan dan keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Ketahuilah” mempertahankan daya imperatif, sedangkan “masa-masa yang sukar” mudah dipahami tanpa menghilangkan keluasan makna kata Yunani.
