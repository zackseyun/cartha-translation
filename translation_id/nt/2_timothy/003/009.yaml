id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: id
  text: Namun, mereka tidak akan maju lebih jauh[a], sebab kebodohan mereka akan menjadi nyata bagi semua orang, sama seperti kebodohan kedua orang itu juga telah menjadi nyata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan membuat kemajuan lebih lanjut.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, kebodohan Yanes dan Yambres yang disebutkan dalam ayat sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: akan maju
  rationale: Kata προκόπτω berarti bergerak maju atau membuat kemajuan. Dalam konteks para penentang, “maju” mempertahankan metafora perkembangan tanpa menyiratkan bahwa perkembangan itu baik.
- source_word: ἐπὶ πλεῖον
  choice: lebih jauh
  rationale: Ungkapan ini berarti “lebih jauh” atau “pada tingkat yang lebih besar”; bersama negasi, frasa “tidak akan maju lebih jauh” terdengar alami dan tepat.
- source_word: ἄνοια
  choice: kebodohan
  rationale: Ἄνοια menunjuk pada ketiadaan pengertian atau ketidakwarasan pikiran; “kebodohan” jelas dalam bahasa Indonesia modern dan mencakup sisi intelektual sekaligus moralnya.
- source_word: ἔκδηλος
  choice: menjadi nyata
  rationale: Ἔκδηλος berarti tampak jelas atau nyata. Bentuk “akan menjadi nyata” juga mengikuti konstruksi predikatif dengan ἔσται.
- source_word: πᾶσιν
  choice: bagi semua orang
  rationale: Dativus jamak ini secara alami menyatakan pihak yang akan melihat atau mengenali kebodohan tersebut.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: sama seperti kebodohan kedua orang itu juga telah menjadi nyata
  rationale: Ἡ secara eliptis merujuk kembali kepada “kebodohan”, sedangkan ἐκείνων merujuk kepada dua tokoh dalam ayat sebelumnya. Pengulangan “kebodohan” dan “menjadi nyata” membuat elipsis Yunani dapat dipahami secara alami dalam bahasa Indonesia; “juga” mencerminkan καί.
theological_decisions:
- issue: Rujukan ἐκείνων
  choice: “kedua orang itu” merujuk kepada Yanes dan Yambres dalam 2 Timotius 3:8
  alternative: rujukan umum kepada para pengajar sesat terdahulu
  rationale: Konteks terdekat menyebut Yanes dan Yambres sebagai pembanding. Teks utama mempertahankan rujukan anaforis tanpa memasukkan nama mereka ke dalam ayat, sedangkan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” dipilih untuk ἀλλά sebagai kontras yang alami; “kedua orang itu” memperjelas bentuk jamak yang merujuk kepada dua tokoh tanpa menambahkan nama ke dalam teks utama.
