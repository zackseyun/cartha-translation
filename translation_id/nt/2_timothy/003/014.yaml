lexical_decisions:
- source_word: σὺ δὲ
  choice: Namun engkau
  rationale: Kata ganti yang dinyatakan secara eksplisit memberi penekanan pada Timotius, sedangkan δέ mengontraskannya dengan orang-orang yang digambarkan sebelumnya. “Namun engkau” menyampaikan peralihan yang tegas dan wajar dalam bahasa Indonesia.
- source_word: μένε ἐν οἷς
  choice: tetaplah berpegang pada apa yang
  rationale: Imperatif kini μένε menyerukan ketekunan yang berkelanjutan. Ungkapan “tetaplah berpegang pada” menyampaikan gagasan bertahan dalam ajaran yang telah diterima secara alami, tanpa memakai ungkapan harfiah “tetaplah di dalam” yang kurang wajar dalam konteks ini.
- source_word: ἔμαθες
  choice: telah kaupelajari
  rationale: Bentuk aoris menunjuk pada pengajaran yang sudah diterima Timotius. Bentuk “telah kaupelajari” jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐπιστώθης
  choice: telah kauyakini
  rationale: Dalam pasangan dengan “telah kaupelajari”, verba pasif ini menunjuk pada kepastian atau keyakinan yang telah terbentuk. “Telah kauyakini” menyampaikan hasil itu secara ringkas; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: εἰδὼς
  choice: karena engkau tahu
  rationale: Partisip ini dapat menyatakan keadaan yang menyertai atau alasan. Dalam bahasa Indonesia, “karena engkau tahu” menghubungkan klausa secara alami dan sesuai dengan dukungan yang diberikan oleh pengetahuan Timotius tentang para pengajarnya.
- source_word: παρὰ τίνων
  choice: dari siapa saja
  rationale: παρά dengan genitif menyatakan sumber, sedangkan bentuk jamak τίνων menunjuk kepada lebih dari satu orang tanpa menyebut identitas mereka. “Dari siapa saja” menjaga rujukan tetap terbuka sambil memberi isyarat pada bentuk jamak teks SBLGNT.
- source_word: ἔμαθες
  choice: engkau mempelajarinya
  rationale: Akhiran “-nya” menyatakan kembali objek tersirat, yaitu hal-hal yang telah dipelajari, sehingga pengulangan verba tetap jelas dan alami.
theological_decisions:
- issue: Rujukan παρὰ τίνων
  choice: Tidak menetapkan identitas para pengajar; bentuk jamak diterjemahkan “dari siapa saja”.
  alternative: Sejumlah naskah memakai bentuk tunggal, “dari siapa”, yang sering dipahami sebagai rujukan kepada Paulus.
  rationale: Ayat ini sendiri tidak menyebut identitas mereka. Teks SBLGNT berbentuk jamak, sehingga terjemahan utama mengikutinya tanpa mempersempit rujukan kepada Paulus, Lois, Eunike, atau tokoh tertentu lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas namun wajar. Bentuk “kau-” dipakai sebagai pronomina terikat yang alami dan tetap bermartabat dalam hubungan pribadi Paulus dengan Timotius. Penanda catatan ditempatkan langsung pada frasa yang dijelaskannya; karena itu urutannya dalam kalimat adalah [b] lalu [a].
