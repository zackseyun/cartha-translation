translation:
  language: id
  text: Namun engkau, tetaplah berpegang pada apa yang telah kaupelajari dan kauyakini[b], sambil mengetahui dari siapa[a] engkau mempelajarinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “dari siapa” dalam bentuk tunggal, yang sering dipahami sebagai Paulus; bentuk jamak yang diikuti di sini dapat menunjuk secara lebih luas kepada para pengajar Timotius.
