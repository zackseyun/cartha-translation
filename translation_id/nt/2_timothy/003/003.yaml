  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: id
  text: tidak memiliki kasih sayang terhadap keluarga, tidak mau berdamai, suka memfitnah[a], tidak dapat mengendalikan diri, kejam, tidak mencintai apa yang baik[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemfitnah.” Kata Yunani di sini tidak merujuk kepada Iblis.
    reason: lexical_alternative
  - marker: b
    text: Atau “membenci yang baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: tidak memiliki kasih sayang terhadap keluarga
  rationale: Kata ini menunjuk pada tidak adanya kasih sayang alami yang terutama diharapkan dalam hubungan keluarga atau kerabat. Pilihan ini mempertahankan kekhususan maknanya dan tetap jelas dalam bahasa Indonesia modern.
- source_word: ἄσπονδοι
  choice: tidak mau berdamai
  rationale: Kata ini menggambarkan orang yang enggan mencapai atau mempertahankan perdamaian. Ungkapan ini lebih alami daripada istilah abstrak seperti 'tidak dapat didamaikan' dan tidak membatasi makna pada pelanggaran perjanjian yang sudah ada.
- source_word: διάβολοι
  choice: suka memfitnah
  rationale: Dalam daftar sifat buruk ini, bentuk jamak tersebut berfungsi sebagai sebutan bagi orang yang memfitnah atau menuduh dengan jahat, bukan sebagai rujukan kepada Iblis. 'Suka memfitnah' alami dan sesuai dengan fungsi deskriptifnya.
- source_word: ἀκρατεῖς
  choice: tidak dapat mengendalikan diri
  rationale: Kata ini menyatakan ketiadaan penguasaan atas dorongan atau keinginan diri. Pilihan ini jelas dan lazim bagi pembaca modern.
- source_word: ἀνήμεροι
  choice: kejam
  rationale: Kata ini berarti tidak jinak, ganas, atau brutal. 'Kejam' menyampaikan sifat keras dan tidak berperikemanusiaan secara alami dalam daftar ini.
- source_word: ἀφιλάγαθοι
  choice: tidak mencintai apa yang baik
  rationale: Kata majemuk ini secara langsung menyatakan tidak adanya kasih terhadap yang baik. Terjemahan ini mempertahankan unsur privatif tanpa memperkuatnya menjadi kebencian aktif.
theological_decisions:
- issue: Makna διάβολοι dalam daftar sifat buruk
  choice: suka memfitnah, sebagai sifat atau perilaku manusia
  alternative: iblis-iblis; bersifat seperti Iblis
  rationale: Bentuk jamak dalam konteks sintaksis ini berada di antara sifat-sifat buruk manusia dan berarti pemfitnah atau orang yang suka menuduh dengan jahat. Menerjemahkannya sebagai makhluk rohani akan menyesatkan pembaca.
- issue: Kekuatan makna ἀφιλάγαθοι
  choice: tidak mencintai apa yang baik
  alternative: membenci yang baik
  rationale: Bentuk Yunani secara harfiah meniadakan kasih kepada yang baik, tetapi tidak dengan sendirinya menegaskan kebencian aktif. Terjemahan utama mempertahankan perbedaan itu, sedangkan kemungkinan yang lebih kuat dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berupa rangkaian sifat buruk dipertahankan agar cocok dengan konteks daftar. Ungkapan yang konkret dipilih untuk menghindari bentuk yang kaku atau arkais.
