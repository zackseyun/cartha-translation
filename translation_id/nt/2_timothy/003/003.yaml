  source_fidelity: Terjemahan mempertahankan urutan dan fungsi daftar sifat dari teks Yunani. “Tidak memiliki kasih sayang terhadap keluarga” menyampaikan kekurangan στοργή, khususnya afeksi yang lazim dalam keluarga; “tidak mau berdamai” tepat untuk ἄσπονδοι; dan “suka memfitnah” tepat untuk διάβολοι sebagai sifat manusia dalam konteks ini. Istilah-istilah selebihnya juga setia pada ἀκρατεῖς, ἀνήμεροι, dan ἀφιλάγαθοι tanpa memperkuat maknanya secara tidak perlu.
