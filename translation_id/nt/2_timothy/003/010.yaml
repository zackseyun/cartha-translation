id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: id
  text: Namun, engkau telah mengikuti dengan saksama ajaranku, cara hidupku, tujuanku, imanku[a], kesabaranku, kasihku, dan ketekunanku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaanku.” Dalam konteks ini, kata Yunani yang digunakan dapat berarti iman atau kesetiaan.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Namun, engkau
  rationale: δέ menandai pertentangan dengan gambaran orang-orang jahat sebelumnya, sedangkan Σὺ memberi penekanan pada lawan bicara. 'Namun, engkau' mempertahankan keduanya secara wajar dan bermartabat.
- source_word: παρηκολούθησάς
  choice: telah mengikuti dengan saksama
  rationale: παρακολουθέω di sini menyatakan mengikuti atau memperhatikan secara dekat, termasuk mengenal dan meneladani. Pilihan ini mempertahankan unsur perhatian serta keterlibatan yang berkelanjutan.
- source_word: μου
  choice: akhiran posesif -ku pada setiap unsur
  rationale: 'Genitif μου secara wajar dipahami mencakup seluruh deretan nomina: ajaranku, cara hidupku, tujuanku, dan seterusnya. Pengulangan -ku menjernihkan cakupan itu dalam bahasa Indonesia.'
- source_word: διδασκαλίᾳ
  choice: ajaran
  rationale: Kata ini menunjuk pada isi yang diajarkan. 'Ajaran' alami dalam bahasa Indonesia modern dan tidak seformal atau seteknis 'doktrin'.
- source_word: ἀγωγῇ
  choice: cara hidup
  rationale: ἀγωγή menunjuk pada perilaku atau pola hidup. 'Cara hidup' lebih alami dan cukup luas untuk mencakup perilaku nyata.
- source_word: προθέσει
  choice: tujuan
  rationale: πρόθεσις di sini menunjuk pada maksud atau tekad yang menetap. 'Tujuan' jelas, ringkas, dan sesuai dalam daftar ini.
- source_word: πίστει
  choice: iman
  rationale: πίστις dapat berarti iman atau kesetiaan. 'Iman' dipakai dalam teks utama sebagai padanan yang lazim, sementara kemungkinan 'kesetiaan' dipertahankan dalam catatan kaki.
- source_word: μακροθυμίᾳ
  choice: kesabaran
  rationale: μακροθυμία menekankan kesabaran panjang, terutama terhadap orang atau dalam menghadapi provokasi. 'Kesabaran' mudah dipahami dan dibedakan dari ketekunan.
- source_word: ἀγάπῃ
  choice: kasih
  rationale: '''Kasih'' merupakan padanan Alkitabiah yang tetap alami bagi ἀγάπη dan menyatakan kasih yang aktif tanpa mempersempit objeknya.'
- source_word: ὑπομονῇ
  choice: ketekunan
  rationale: ὑπομονή menekankan ketabahan yang terus bertahan di bawah kesukaran. 'Ketekunan' alami dalam daftar sifat ini dan membedakannya dari μακροθυμία, 'kesabaran'.
theological_decisions:
- issue: Makna πίστις dalam daftar sifat Paulus
  choice: iman
  alternative: kesetiaan
  rationale: Dalam konteks ini, πίστις dapat menunjuk pada kepercayaan kepada Allah atau pada sifat dapat dipercaya. Teks utama memakai 'iman', tetapi catatan kaki mempertahankan kemungkinan 'kesetiaan' agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab namun bermartabat. 'Engkau' dipilih untuk sapaan tunggal yang sesuai dengan surat pribadi dan register Kitab Suci. Struktur daftar dipertahankan; posesif -ku diulang agar hubungan semua unsur dengan Paulus jelas. Koma akhir mencerminkan bahwa kalimat berlanjut ke ayat berikutnya.
