  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: id
  text: Beritakanlah firman; bersiap sedialah, baik pada waktu yang menguntungkan maupun tidak menguntungkan[a]; tunjukkanlah kesalahan, tegurlah dengan keras, nasihatilah[b], dengan penuh kesabaran dan pengajaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baik ketika waktunya tepat maupun tidak tepat.” Kata Yunani yang diterjemahkan “bersiap sedialah” juga dapat berarti “hadirlah untuk bertindak,” “tekunlah,” atau “bertindaklah dengan mendesak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “doronglah,” “desaklah,” atau “kuatkanlah hati mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Beritakanlah
  rationale: Bentuk perintah dari κηρύσσω menunjuk pada penyampaian pesan secara terbuka dan berwibawa. “Beritakanlah” alami dalam bahasa Indonesia dan mempertahankan daya proklamasi kata Yunani.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: λόγος di sini menunjuk pada firman atau pesan yang telah diketahui dari konteks. “Firman itu” mempertahankan keluasan ungkapan sumber tanpa mempersempitnya menjadi “Injil” atau “Kitab Suci” secara eksplisit.
- source_word: ἐπίστηθι
  choice: siap sedialah
  rationale: Imperatif ini dapat menyatakan kesiapan, kehadiran untuk bertindak, atau urgensi. “Siap sedialah” menyampaikan kesiapan yang berkelanjutan dan cocok dengan pasangan keterangan waktu sesudahnya.
- source_word: εὐκαίρως ἀκαίρως
  choice: baik pada waktu yang tepat maupun tidak tepat
  rationale: Pasangan adverbia ini mencakup keadaan yang tampak menguntungkan maupun tidak menguntungkan bagi pelaksanaan tugas. Rumusan ini mempertahankan kesejajaran retorisnya dalam bahasa Indonesia yang jelas.
- source_word: ἔλεγξον
  choice: tunjukkanlah kesalahan
  rationale: ἐλέγχω mencakup menyingkapkan atau membuktikan kesalahan dengan tujuan korektif. Pilihan ini membedakannya dari perintah yang lebih keras sesudahnya.
- source_word: ἐπιτίμησον
  choice: tegurlah dengan keras
  rationale: Kata ini menyatakan teguran atau kecaman yang tegas. “Tegurlah dengan keras” mempertahankan intensitasnya dan membedakannya dari ἔλεγξον.
- source_word: παρακάλεσον
  choice: doronglah mereka
  rationale: παρακαλέω dapat berarti mendesak, menasihati, menguatkan, atau menghibur. Dalam rangkaian perintah pelayanan ini, “doronglah” menyampaikan desakan yang juga dapat bersifat menguatkan; objek “mereka” ditambahkan secara wajar dalam bahasa Indonesia tanpa menentukan kelompok yang lebih sempit.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: dengan penuh kesabaran
  rationale: μακροθυμία menunjuk pada kesabaran yang tahan lama, terutama terhadap orang lain. “Dengan penuh kesabaran” menyampaikan cakupan πάσῃ secara alami.
- source_word: καὶ διδαχῇ
  choice: dan pengajaran
  rationale: διδαχή menunjuk pada pengajaran atau pemberian petunjuk yang menyertai tindakan korektif tersebut. Bentuk nomina dipertahankan tanpa mempersempitnya pada doktrin tertentu.
theological_decisions:
- issue: Cakupan “firman itu”
  choice: Tidak diperluas menjadi “Injil” atau “Kitab Suci” dalam teks utama.
  alternative: pesan itu; Injil; Kitab Suci
  rationale: Konteks menghubungkan tugas Timotius dengan pemberitaan apostolik dan Kitab Suci, tetapi λόγος dalam ayat ini tidak secara eksplisit dibatasi pada salah satunya. Rumusan yang lebih luas mempertahankan ketegangan dan cakupan teks.
- issue: Nuansa παρακάλεσον
  choice: Diterjemahkan “doronglah mereka,” dengan alternatif dicatat dalam catatan kaki.
  alternative: nasihatilah mereka; desaklah mereka; kuatkanlah hati mereka
  rationale: Kata Yunani menampung desakan maupun penguatan. Konteks mendukung dorongan yang sungguh-sungguh, tetapi tidak membenarkan penghapusan seluruh nuansa pastoralnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian imperatif dipertahankan dengan bentuk -lah untuk menjaga ketegasan pastoral. Ungkapan “siap sedialah” cukup lazim dan jelas, sedangkan frasa waktu dibuat eksplisit agar pasangan adverbia Yunani mudah dipahami. Penambahan “mereka” setelah “doronglah” bersifat idiomatis dan tidak dimaksudkan untuk mempersempit sasaran perintah.
