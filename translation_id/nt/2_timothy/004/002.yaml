  naturalness: “Siap sedialah” dapat dipahami, tetapi “bersiap sedialah” lebih lancar sebagai bentuk perintah dalam bahasa Indonesia modern. Frasa “baik pada waktu yang menguntungkan maupun tidak menguntungkan” menyampaikan pasangan adverbia secara alami. Rangkaian “tunjukkanlah kesalahan, tegurlah dengan keras, nasihatilah” tetap jelas, berwibawa, dan membedakan tiga imperatif tersebut.
  terminology: “Beritakanlah firman” mempertahankan keluasan τὸν λόγον tanpa menjadikannya secara eksplisit “Injil” atau “Kitab Suci”. “Pengajaran” sesuai untuk διδαχῇ. “Nasihatilah” dalam konteks ini mengungkapkan desakan pastoral παρακαλέω, sementara alternatif yang relevan dipertahankan dalam catatan kaki.
