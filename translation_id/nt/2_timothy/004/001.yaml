review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan pelaku-pelaku utama, cakupan “yang hidup dan yang mati,” serta kemungkinan bahwa frasa tentang penyataan dan kerajaan memperluas adjurasi. Namun, “segera akan” memberi nuansa kedekatan waktu yang lebih kuat daripada yang harus dituntut oleh μέλλω di sini. Futuritas biasa lebih aman dalam teks utama, dengan kemungkinan nuansa kedekatan dicatat di catatan kaki.
  naturalness: “Dengan sungguh-sungguh aku berpesan kepadamu” dapat dipahami, tetapi “Aku dengan sungguh-sungguh memberi amanat kepadamu” lebih jelas menyatakan daya adjurasi/penugasan yang khidmat dari Διαμαρτύρομαι. Penempatan “serta demi” setelah anak kalimat relatif juga agak tersendat; “dan demi ... serta ...” menghubungkan unsur adjurasi itu secara lebih alami.
  terminology: “Mesias Yesus,” “menghakimi,” dan “kerajaan-Nya” sudah tepat. “Penyataan diri-Nya” merupakan padanan yang dapat diterima untuk ἐπιφάνεια dan tidak perlu diganti. Bentuk hormat “-Nya” konsisten dengan register Alkitab Indonesia baku.
  issues:
  - severity: medium
    issue: “Segera akan menghakimi” terlalu menegaskan kedekatan waktu.
    rationale: μέλλω dengan infinitif dapat menunjukkan futuritas dan kadang kedekatan, tetapi dalam konteks ini tidak dengan aman menetapkan bahwa penghakiman itu “segera.” “Akan menghakimi” mempertahankan pernyataan sumber tanpa mempersempit daya temporalnya; nuansa lain dapat disebut dalam catatan.
  - severity: low
    issue: Verba utama dan sambungan frasa adjurasi dapat dibuat lebih idiomatis.
    rationale: “Memberi amanat” lebih kuat dan lebih tepat bagi sebuah charge khidmat daripada “berpesan,” sedangkan penataan ulang “dan demi ... serta ...” membuat hubungan sintaktis yang ditafsirkan tetap jelas dan lancar.
