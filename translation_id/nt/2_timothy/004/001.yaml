reference: 2 Timothy 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: id
  text: 'Aku dengan sungguh-sungguh memberi amanat kepadamu di hadapan Allah dan Mesias Yesus, yang akan menghakimi[a] orang yang hidup dan yang mati, dan demi penyataan diri-Nya serta kerajaan-Nya[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “yang segera akan menghakimi.”
    reason: μέλλω dapat menyatakan futuritas dan, dalam beberapa konteks, nuansa kedekatan waktu.
  - marker: b
    text: 'Atau, secara lebih harfiah: “dan penyataan diri-Nya serta kerajaan-Nya,” dengan hubungan frasa itu dibiarkan lebih tersirat seperti dalam bahasa Yunani.'
    reason: Hubungan sintaktis frasa-frasa akusatif ini dengan rumusan adjurasi dapat dipahami sebagai perluasan yang eksplisit atau dibiarkan tersirat.
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Dengan sungguh-sungguh aku berpesan kepadamu
  rationale: Dalam konteks penugasan ini, verba tersebut menyatakan pesan atau amanat yang sangat serius, bukan sekadar kesaksian. Objek 'kepadamu' tersirat dari konteks dan perlu dinyatakan agar wajar dalam bahasa Indonesia.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini alami dan mempertahankan makna berada dalam hadirat atau pandangan Allah dan Mesias Yesus.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός masih berfungsi sebagai gelar di sini; 'Mesias' mempertahankan kandungan gelar itu, sedangkan 'Kristus Yesus' juga mungkin sebagai bentuk yang lebih menyerupai nama.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: yang segera akan menghakimi
  rationale: μέλλω dengan infinitif dapat menyatakan futuritas yang mendekat. 'Segera akan' mempertahankan ketegangan itu tanpa menetapkan jadwal tertentu; terjemahan yang lebih netral dicatat dalam catatan kaki.
- source_word: ζῶντας καὶ νεκρούς
  choice: orang yang hidup dan yang mati
  rationale: Terjemahan ini wajar dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh penghakiman eskatologis.
- source_word: ἐπιφάνειαν
  choice: penyataan diri-Nya
  rationale: Pilihan ini menyampaikan tampilnya Dia secara nyata tanpa menyempitkan makna menjadi sekadar kedatangan atau memakai 'penampakan' yang dapat berkonotasi kurang tepat dalam bahasa Indonesia modern.
- source_word: βασιλείαν
  choice: kerajaan-Nya
  rationale: Ini padanan baku yang dapat mencakup ranah kerajaan maupun pemerintahan rajawi-Nya.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: serta demi penyataan diri-Nya dan kerajaan-Nya
  rationale: Akusatif rangkap ini paling masuk akal sebagai perluasan rumusan pesan atau sumpah yang khidmat. 'Demi' membuat hubungannya jelas dalam bahasa Indonesia, sementara koordinasi yang lebih harfiah dicatat sebagai kemungkinan.
theological_decisions:
- issue: Fungsi Χριστός dalam frasa Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Konteks penghakiman yang khidmat tetap memungkinkan daya gelarnya terdengar; 'Mesias' mempertahankan makna gelar tanpa menjadikannya sekadar unsur nama.
- issue: Daya μέλλω dalam pernyataan tentang penghakiman
  choice: yang segera akan menghakimi
  alternative: yang akan menghakimi
  rationale: Pilihan utama mempertahankan unsur futuritas yang mendekat, tetapi alternatif yang lebih netral tetap sah karena μέλλω tidak selalu menuntut pengertian waktu yang sangat dekat.
- issue: Hubungan frasa tentang penyataan diri dan kerajaan dengan rumusan pesan
  choice: serta demi penyataan diri-Nya dan kerajaan-Nya
  alternative: serta penyataan diri-Nya dan kerajaan-Nya
  rationale: Bentuk Yunani memungkinkan frasa-frasa akusatif itu dipahami sebagai unsur tambahan dalam adjurasi, tetapi hubungan sintaksisnya tidak sepenuhnya eksplisit; karena itu kemungkinan koordinasi yang lebih harfiah dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan bobot penugasan kerasulan, tetapi menghindari ungkapan yang terlalu arkais. Kata ganti ilahi memakai bentuk hormat '-Nya' sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
