id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: id
  text: Berusahalah sungguh-sungguh untuk datang sebelum musim dingin. Ebulus menyampaikan salam kepadamu, demikian juga Pudes, Linus, Klaudia, dan semua saudara seiman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua saudara”; dalam konteks ini ungkapan Yunaninya dapat merujuk kepada semua saudara dan saudari seiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Berusahalah sungguh-sungguh
  rationale: Bentuk imperatif aoris ini menyatakan kesungguhan dan urgensi. Ungkapan ini alami dalam bahasa Indonesia dan lebih jelas daripada terjemahan harfiah seperti 'rajinlah'.
- source_word: πρὸ χειμῶνος
  choice: sebelum musim dingin
  rationale: Kata depan πρό dengan genitif menunjukkan waktu yang mendahului suatu musim atau peristiwa.
- source_word: ἐλθεῖν
  choice: untuk datang
  rationale: Infinitif ini melengkapi Σπούδασον dan merujuk pada kedatangan Timotius kepada Paulus.
- source_word: Ἀσπάζεταί σε
  choice: menyampaikan salam kepadamu
  rationale: Dalam konteks surat, ἀσπάζομαι secara alami menyatakan pengiriman atau penyampaian salam.
- source_word: Εὔβουλος
  choice: Ebulus
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: Πούδης
  choice: Pudes
  rationale: Nama diri Yunani ditransliterasikan secara langsung dan wajar ke dalam bahasa Indonesia.
- source_word: Λίνος
  choice: Linus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Κλαυδία
  choice: Klaudia
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia, menggunakan K untuk huruf awal Yunani kappa.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: semua saudara seiman
  rationale: ἀδελφοί secara leksikal berarti 'saudara-saudara', tetapi dalam sapaan jemaat dapat menunjuk kepada sesama orang percaya. 'Saudara seiman' mempertahankan citra kekerabatan sekaligus menjelaskan hubungan yang dimaksud tanpa memastikan bahwa kelompok itu hanya laki-laki.
theological_decisions:
- issue: Cakupan gender ἀδελφοί dalam kelompok Kristen
  choice: semua saudara seiman
  alternative: semua saudara laki-laki; semua saudara dan saudari seiman
  rationale: Bentuk Yunaninya maskulin jamak, tetapi dalam pemakaian Kristen awal dapat mencakup komunitas orang percaya secara lebih luas. Teks utama memakai istilah Indonesia yang tetap berkias kekerabatan dan tidak menutup kemungkinan kelompok campuran; alternatif eksplisit dicatat dalam catatan kaki agar ambiguitas rujukannya terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama mempertahankan nada mendesak, sedangkan rumusan salam dibuat alami untuk konteks surat. Nama-nama ditransliterasikan dalam bentuk Indonesia.
