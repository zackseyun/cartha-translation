  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: id
  text: dan mereka akan memalingkan telinga mereka dari kebenaran, tetapi akan berpaling kepada mitos-mitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dongeng-dongeng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: kebenaran
  rationale: Dengan preposisi dan artikel Yunani, frasa ini secara alami diterjemahkan “dari kebenaran”; cakupannya tidak dipersempit menjadi “ajaran yang benar” atau “Injil”.
- source_word: ἀκοὴν
  choice: telinga
  rationale: Secara harfiah berarti “pendengaran,” tetapi dalam konstruksi ini “memalingkan telinga” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran tindakan sengaja untuk tidak mendengarkan.
- source_word: ἀποστρέψουσιν
  choice: akan memalingkan
  rationale: Mempertahankan makna aktif ‘membalikkan/memalingkan’ dan metafora penolakan yang disengaja.
- source_word: μύθους
  choice: mitos-mitos
  rationale: Padanan modern yang langsung untuk bentuk jamak μύθους dan sesuai dengan pertentangannya dengan kebenaran; “dongeng-dongeng” juga mungkin.
- source_word: ἐκτραπήσονται
  choice: berbalik
  rationale: Bentuk pasif/medial dapat dipahami secara intransitif sebagai beralih atau menyimpang; “berbalik kepada” menjaga arah gerak tanpa menetapkan agen yang menyebabkan tindakan itu.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: dari ... lalu ... kepada
  rationale: Menjaga kontras arah dari kebenaran menuju mitos, sementara “lalu” menghasilkan susunan Indonesia yang lancar.
theological_decisions:
- issue: Hakikat “kebenaran” dalam konteks
  choice: kebenaran
  alternative: ajaran yang benar; kebenaran Injil
  rationale: Konteks berkaitan erat dengan pengajaran rasuli, tetapi ἀλήθεια sendiri lebih luas. Terjemahan tidak mempersempit rujukannya secara tafsiran.
- issue: Agen dalam ἐκτραπήσονται
  choice: berbalik
  alternative: akan disesatkan
  rationale: Bentuk Yunani memungkinkan nuansa pasif atau medial, tetapi tidak menyebut agen. Padanan intransitif mempertahankan ketaksaan mengenai apakah mereka beralih sendiri atau dipalingkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “memalingkan telinga” dipilih daripada “memalingkan pendengaran” karena lebih wajar bagi pembaca umum, sedangkan “mitos-mitos” mempertahankan bentuk jamak sumber.
