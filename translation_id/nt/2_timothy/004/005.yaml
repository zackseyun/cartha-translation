id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: id
  text: Namun, engkau, tetaplah berpikiran jernih dalam segala hal, tanggunglah kesukaran,[a] lakukanlah pekerjaan seorang pemberita Injil, dan tunaikanlah pelayananmu sepenuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “deritalah kesukaran.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penuhilah pelayananmu” atau “selesaikanlah pelayananmu sampai tuntas.” Kata Yunani yang dipakai mengandung gagasan melaksanakan sesuatu secara penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Namun, engkau
  rationale: Kata ganti σὺ memberi penekanan pribadi kepada Timotius, sedangkan δέ mengontraskannya dengan orang-orang dalam ayat-ayat sebelumnya. Susunan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: νῆφε
  choice: tetaplah berpikiran jernih
  rationale: Dalam Perjanjian Baru, νήφω dipakai secara kiasan untuk kejernihan pikiran, penguasaan diri, dan keteguhan, bukan terutama untuk bebas dari pengaruh minuman keras. Pilihan ini menyampaikan sikap waspada dan tenang di bawah tekanan.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Frasa ini paling alami menerangkan νῆφε dan mempertahankan cakupan luas teks Yunani tanpa membatasinya hanya pada waktu atau keadaan tertentu.
- source_word: κακοπάθησον
  choice: tanggunglah kesukaran
  rationale: Imperatif ini memanggil Timotius untuk menerima dan bertahan dalam penderitaan atau kesulitan. 'Tanggunglah kesukaran' mengungkapkan pengalaman berat sekaligus ketabahan.
- source_word: ἔργον ποίησον
  choice: lakukanlah pekerjaan
  rationale: Ungkapan ini merupakan kombinasi idiomatis yang secara langsung memerintahkan pelaksanaan tugas.
- source_word: εὐαγγελιστοῦ
  choice: seorang pemberita Injil
  rationale: εὐαγγελιστής menunjuk kepada orang yang memberitakan kabar baik. 'Pemberita Injil' lebih transparan bagi pembaca Indonesia modern daripada istilah serapan 'evangelis' dan tidak menambahkan jabatan denominasi tertentu.
- source_word: τὴν διακονίαν σου
  choice: pelayananmu
  rationale: Dalam konteks amanat pastoral kepada Timotius, διακονία menunjuk pada tugas pelayanan yang dipercayakan kepadanya, bukan sekadar bantuan atau layanan umum.
- source_word: πληροφόρησον
  choice: tunaikanlah ... sepenuhnya
  rationale: Kata kerja ini menyatakan pelaksanaan sampai penuh atau sampai tuntas. Rumusan ini mempertahankan unsur kelengkapan dan cocok dengan objek 'pelayananmu'.
theological_decisions:
- issue: Sifat tugas Timotius dalam διακονία
  choice: pelayananmu
  alternative: pengabdianmu; tugas pelayananmu
  rationale: Konteks membahas tanggung jawab Timotius untuk memberitakan firman dan menjalankan panggilannya. 'Pelayanan' menyampaikan tugas yang dipercayakan itu tanpa menentukan struktur jabatan gerejawi tertentu.
- issue: Makna εὐαγγελιστοῦ sebagai fungsi atau jabatan
  choice: seorang pemberita Injil
  alternative: seorang evangelis; orang yang memberitakan Kabar Baik
  rationale: Teks menyebut jenis pekerjaan yang harus dilakukan Timotius, tetapi tidak menjelaskan apakah istilah itu merupakan jabatan formal. Terjemahan fungsional ini mempertahankan keterbukaan tersebut dan menghindari muatan denominasi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Deretan imperatif dipertahankan untuk menjaga nada amanat yang tegas. 'Tetaplah berpikiran jernih' dipilih sebagai ungkapan alami bagi pemakaian kiasan νῆφε; 'pemberita Injil' dipakai agar fungsi εὐαγγελιστής langsung dipahami tanpa mengesankan jabatan denominasi tertentu.
