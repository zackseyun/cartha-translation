  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: id
  text: Pada pembelaanku yang pertama, tidak seorang pun hadir untuk mendampingiku[a]; sebaliknya, mereka semua meninggalkan aku. Kiranya hal itu tidak diperhitungkan kepada mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak seorang pun datang untuk hadir bersamaku”; maksudnya, tidak seorang pun tampil untuk mendukung Paulus dalam pembelaannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Kiranya hal itu tidak ditanggungkan kepada mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: pembelaanku
  rationale: Dalam konteks pengadilan, kata ini menunjuk pada pembelaan atau jawaban resmi di hadapan pihak berwenang. «Pembelaanku» alami dalam bahasa Indonesia dan mempertahankan nuansa forensiknya.
- source_word: πρώτῃ
  choice: yang pertama
  rationale: Menandai kesempatan atau tahap pertama dalam pembelaan Paulus tanpa menentukan secara berlebihan bentuk prosedur hukumnya.
- source_word: οὐδείς μοι παρεγένετο
  choice: tidak seorang pun hadir untuk mendampingiku
  rationale: παρεγένετο secara harfiah menyatakan kehadiran, dan datif μοι dalam konteks ini menyiratkan kehadiran untuk mendukung Paulus. Ungkapan ini mempertahankan kedua unsur tersebut.
- source_word: πάντες με ἐγκατέλιπον
  choice: mereka semua meninggalkan aku
  rationale: Verba ini berarti meninggalkan seseorang dalam keadaan sulit. «Meninggalkan aku» jelas, wajar, dan tidak menambahkan penilaian emosional yang lebih kuat daripada teks.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Kiranya hal itu tidak diperhitungkan terhadap mereka
  rationale: Bentuk optatif menyatakan harapan atau doa. «Diperhitungkan terhadap» mempertahankan metafora pencatatan atau pertanggungjawaban, sedangkan «hal itu» mengungkap objek yang tersirat, yakni tindakan meninggalkan Paulus.
theological_decisions:
- issue: Nada klausa terakhir Paulus terhadap orang-orang yang meninggalkannya
  choice: Harapan atau doa agar tindakan itu tidak diperhitungkan terhadap mereka
  alternative: «Janganlah hal itu ditanggungkan kepada mereka»
  rationale: Optatif pasif λογισθείη dengan μή paling alami menyampaikan suatu harapan atau doa. Terjemahan ini mempertahankan gema bahasa pengampunan tanpa menetapkan klaim doktrinal yang lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. «Pembelaan» menjaga konteks hukum, sementara «hadir untuk mendampingi» mengomunikasikan kehadiran sekaligus dukungan. Susunan «sebaliknya» memperjelas kontras ἀλλά tanpa mengubah isi.
