id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: id
  text: Tuhan akan melepaskan aku dari setiap perbuatan jahat dan membawa aku dengan selamat masuk ke dalam kerajaan-Nya yang surgawi.[a] Bagi Dialah kemuliaan selama-lamanya.[b] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “akan menyelamatkan aku ke dalam kerajaan-Nya yang surgawi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ke dalam zaman-zaman dari segala zaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: akan melepaskan
  rationale: Kata ῥύομαι menyatakan tindakan membebaskan atau menyelamatkan dari ancaman. “Melepaskan” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Paulus pasti akan luput dari kematian jasmani.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: dari setiap perbuatan jahat
  rationale: “Perbuatan” menyampaikan ἔργον dalam konteks moral, sedangkan “jahat” mencerminkan πονηροῦ. Bentuk “setiap” mempertahankan cakupan παντός.
- source_word: σώσει εἰς
  choice: membawa aku dengan selamat masuk ke dalam
  rationale: Ungkapan ini menyampaikan unsur penyelamatan dalam σώσει sekaligus arah atau tujuan dalam εἰς. Bentuk harfiah “menyelamatkan aku ke dalam” kurang alami dalam bahasa Indonesia.
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: kerajaan-Nya yang surgawi
  rationale: “Kerajaan-Nya” mempertahankan relasi kepunyaan, dan “yang surgawi” menerjemahkan sifat ἐπουράνιον tanpa membatasi maknanya hanya pada lokasi.
- source_word: ᾧ ἡ δόξα
  choice: Bagi Dialah kemuliaan
  rationale: Rumusan ini alami sebagai ungkapan pujian dalam bahasa Indonesia serta mempertahankan pemberian atau pengakuan kemuliaan kepada Tuhan.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ini merupakan padanan idiomatis yang wajar bagi ungkapan Yunani tentang masa yang tidak berkesudahan.
- source_word: ἀμήν
  choice: Amin
  rationale: Bentuk serapan baku ini mempertahankan penegasan liturgis dari teks sumber.
theological_decisions:
- issue: Hubungan antara pelepasan dari kejahatan dan keselamatan akhir
  choice: Terjemahan membedakan tindakan Tuhan yang melepaskan Paulus dari setiap perbuatan jahat dan tindakan-Nya membawa Paulus dengan selamat masuk ke dalam kerajaan surgawi.
  alternative: Memahami ayat ini sebagai janji bahwa Paulus akan terlepas dari hukuman mati secara jasmani.
  rationale: Konteks menjelang kematian Paulus dan frasa “masuk ke dalam kerajaan-Nya yang surgawi” memungkinkan pelepasan yang tidak berarti lolos dari kematian. Terjemahan mempertahankan keyakinan akan pemeliharaan dan keselamatan akhir tanpa menentukan secara berlebihan bentuk pelepasan sementara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Membawa aku dengan selamat masuk ke dalam” dipilih agar alami sekaligus mempertahankan gabungan makna penyelamatan dan arah tujuan. Penulisan “kerajaan-Nya” tidak dikapitalisasi karena merupakan nomina umum yang disertai pronomina ilahi.
