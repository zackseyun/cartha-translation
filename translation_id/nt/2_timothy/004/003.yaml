source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: id
  text: Sebab akan tiba waktunya ketika orang tidak akan tahan terhadap ajaran yang sehat,[a] tetapi, menurut keinginan mereka sendiri, mereka akan mengumpulkan banyak guru bagi diri mereka sendiri, dengan telinga yang gatal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak akan menoleransi ajaran yang sehat.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “gatal pada pendengaran”; ungkapan ini menggambarkan hasrat untuk mendengar apa yang sesuai dengan keinginan sendiri. Bentuk partisip dalam bahasa Yunani dapat dipahami sebagai keadaan yang menyertai, bukan sebagai sebab yang dinyatakan secara tegas.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: waktunya
  rationale: Dalam konteks prediktif ini, καιρός menunjuk pada masa atau saat tertentu yang akan datang; 'waktunya' alami dalam bahasa Indonesia.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: ajaran yang sehat
  rationale: Ungkapan ini mempertahankan metafora 'sehat' bagi ajaran yang benar dan baik tanpa memakai istilah gerejawi yang lebih teknis.
- source_word: οὐκ ἀνέξονται
  choice: tidak mau lagi menerima
  rationale: ἀνέχομαι berarti menanggung, bertahan terhadap, atau menerima dengan sabar. Dalam konteks ini, ungkapan tersebut menyatakan penolakan untuk menoleransi ajaran; unsur 'lagi' menyampaikan perubahan keadaan yang tersirat oleh waktu yang akan tiba.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: menurut keinginan mereka sendiri
  rationale: Terjemahan ini mempertahankan cakupan luas ἐπιθυμίαι sebagai keinginan atau hasrat, bukan mempersempitnya menjadi nafsu seksual.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: mereka akan mengumpulkan banyak guru bagi diri mereka
  rationale: ἐπισωρεύω menggambarkan penumpukan dalam jumlah besar. 'Mengumpulkan banyak' menyampaikan gambaran berlebihan itu secara alami dalam bahasa Indonesia, sedangkan 'bagi diri mereka' mempertahankan daya refleksif ἑαυτοῖς.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: karena telinga mereka gatal ingin mendengar apa yang menyenangkan mereka
  rationale: Terjemahan ini mempertahankan citra telinga yang gatal sekaligus menjelaskan idiomnya bagi pembaca modern. Hubungan kausal merupakan interpretasi kontekstual yang wajar, tetapi dicatat dalam catatan kaki karena participium Yunani tidak secara eksplisit menandai sebab.
theological_decisions:
- issue: Padanan διδασκαλία dalam konteks Surat-Surat Pastoral
  choice: ajaran
  alternative: doktrin
  rationale: '''Ajaran'' menyampaikan arti istilah Yunani secara luas dan mudah dipahami tanpa menambahkan nuansa teknis atau denominasi tertentu.'
- issue: Hubungan participium κνηθόμενοι dengan tindakan mengumpulkan guru
  choice: karena telinga mereka gatal ingin mendengar apa yang menyenangkan mereka
  alternative: dengan telinga yang gatal
  rationale: Konstruksi Yunani dapat menyatakan keadaan yang menyertai atau alasan. Teks utama memakai hubungan kausal yang alami dalam konteks, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah dan ambiguitas sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora kesehatan pada ajaran dan telinga yang gatal dipertahankan; idiom kedua dijelaskan singkat dalam teks dan catatan kaki.
