  terminology: '''Mahkota kebenaran'' dan catatan alternatif ''mahkota keadilan'' tepat serta tidak memaksakan satu penafsiran genitif. ''Tuhan'' dan ''Hakim yang adil'' mempertahankan istilah sumber dan register yang sesuai.'
