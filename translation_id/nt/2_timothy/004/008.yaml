id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: id
  text: Mulai sekarang telah tersedia bagiku mahkota kebenaran[a], yang akan dianugerahkan kepadaku oleh Tuhan, Hakim yang adil, pada hari itu—dan bukan hanya kepadaku, melainkan juga kepada semua orang yang telah mengasihi kemunculan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mahkota keadilan.” Kata Yunani yang dipakai dapat berarti “kebenaran” atau, dalam konteks tertentu, “keadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Sekarang
  rationale: Dalam konteks sesudah Paulus menyatakan bahwa ia telah menyelesaikan perlombaan, kata ini menunjuk pada apa yang kini tersisa atau menantinya; 'Sekarang' menyampaikan nuansa temporal secara alami.
- source_word: ἀπόκειταί
  choice: telah tersedia
  rationale: Kata kerja ini menyatakan sesuatu yang telah disimpan atau disediakan bagi seseorang. Pilihan ini mempertahankan keadaan kini tanpa memberi kesan bahwa mahkota itu sudah diterima.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: mahkota kebenaran
  rationale: Ungkapan genitif dipertahankan agar tidak menentukan apakah mahkota itu diberikan karena kebenaran, terdiri dari kebenaran, atau berkaitan dengan pembenaran/vindikasi.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: '''Kebenaran'' merupakan padanan Indonesia yang lazim bagi δικαιοσύνη dalam konteks Paulus; kemungkinan nuansa ''keadilan'' dicatat dalam catatan kaki.'
- source_word: ἀποδώσει
  choice: akan dianugerahkan
  rationale: Dalam gambaran mahkota pemenang, pilihan ini menyampaikan pemberian penghargaan yang semestinya dan menghindari nuansa penghukuman yang dapat muncul dari 'membalas'.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar ini diterjemahkan secara langsung dan, dalam konteks penampakan serta penghakiman akhir, menunjuk kepada Kristus tanpa memperluas teks menjadi parafrasa.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Ini adalah ungkapan temporal Indonesia yang alami dan tetap mempertahankan nuansa eskatologis.
- source_word: ὁ δίκαιος κριτής
  choice: Hakim yang adil
  rationale: Frasa aposisional ini menggambarkan Tuhan sebagai hakim yang bertindak dengan adil; bentuk ini lebih alami dalam bahasa Indonesia daripada 'Hakim yang benar'.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: kepada semua orang yang telah mengasihi
  rationale: Bentuk perfek menunjukkan kasih yang telah terbentuk dan tetap menjadi sikap mereka; 'telah mengasihi' mempertahankan aspek tersebut.
- source_word: ἐπιφάνειαν
  choice: penampakan
  rationale: Pilihan ini menerjemahkan gagasan tampil menjadi nyata secara langsung tanpa menyempitkannya menjadi sekadar 'kedatangan'.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini secara alami merujuk kembali kepada Tuhan dan mempertahankan bentuk pronominal teks Yunani.
theological_decisions:
- issue: Makna 'mahkota kebenaran'
  choice: Mempertahankan frasa genitif tanpa menetapkan hubungan maknanya secara lebih sempit.
  alternative: Mahkota sebagai ganjaran karena kebenaran; mahkota yang terdiri dari kebenaran; atau mahkota keadilan/vindikasi.
  rationale: Konstruksi Yunani memungkinkan beberapa nuansa, sehingga ambiguitas teologis yang asli sebaiknya tidak diselesaikan oleh terjemahan.
- issue: Rujukan gelar 'Tuhan'
  choice: Mempertahankan gelar 'Tuhan', dengan konteks yang menunjuk kepada Yesus Kristus.
  alternative: Allah secara lebih umum.
  rationale: Rujukan pada 'penampakan-Nya' dalam konteks surat ini sangat mendukung Kristus sebagai rujukan, tetapi teks terjemahan tidak menambahkan nama yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora mahkota, ungkapan eskatologis 'hari itu', aspek perfek pada 'telah mengasihi', serta ambiguitas 'mahkota kebenaran' dipertahankan.
