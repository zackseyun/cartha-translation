  to: Mulai sekarang telah tersedia bagiku mahkota kebenaran[a], yang akan dianugerahkan kepadaku oleh Tuhan, Hakim yang adil, pada hari itu—dan bukan hanya kepadaku, melainkan juga kepada semua orang yang telah mengasihi kemunculan-Nya.
