  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: id
  text: Engkau juga harus waspada terhadap dia, karena dia sangat menentang perkataan kami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “pesan kami” atau “pengajaran kami”. Bahasa Yunani: “perkataan kami”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: terhadap dia
  rationale: Pronomina relatif ini merujuk kembali kepada Aleksander pada ayat sebelumnya. Frasa ini menjadi pelengkap alami bagi 'waspada' dalam bahasa Indonesia.
- source_word: καὶ σὺ
  choice: Engkau juga
  rationale: καί bersama pronomina emphatik σύ menyoroti bahwa Timotius pun harus berhati-hati, sebagaimana Paulus telah mengalami perlawanan orang itu.
- source_word: φυλάσσου
  choice: harus waspada
  rationale: Imperatif kini bentuk medial menyampaikan peringatan langsung agar Timotius terus menjaga dirinya. 'Harus waspada terhadap' alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: λίαν
  choice: sangat
  rationale: Kata ini memperkuat verba berikutnya; 'sangat menentang' menyatakan intensitas yang tinggi secara alami.
- source_word: ἀντέστη
  choice: menentang
  rationale: Aoristus ἀνθίστημι berarti berdiri melawan atau memberikan perlawanan. 'Menentang' jelas dan sesuai dengan objek datifnya.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: perkataan kami
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan tetap wajar, tanpa mempersempit maksudnya menjadi pesan, pengajaran, atau kesaksian hukum tertentu.
theological_decisions:
- issue: Cakupan frasa 'perkataan kami'
  choice: perkataan kami
  alternative: pesan kami; pengajaran kami; kesaksian yang kami sampaikan dalam pembelaan
  rationale: Frasa Yunani tidak memastikan apakah yang dimaksud ialah pemberitaan, pengajaran doktrinal, atau kesaksian dalam konteks hukum. Terjemahan utama mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau', selaras dengan surat pribadi kepada Timotius. Diksi ringkas, wajar, dan bermartabat; susunan tetap dekat dengan teks Yunani tanpa mengorbankan kejelasan.
