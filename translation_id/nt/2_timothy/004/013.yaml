  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: id
  text: Ketika engkau datang, bawalah jubah[b] yang kutinggalkan di Troas bersama Karpus, juga kitab-kitab[a], terutama perkamen-perkamen itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan-gulungan”; istilah Yunani ini dapat menunjuk pada gulungan tertulis atau bahan tertulis sejenis.
    reason: lexical_alternative
  - marker: b
    text: Sebagian penafsir memahami “jubah” sebagai wadah atau pembungkus buku, tetapi arti yang lazim dari kata Yunani itu ialah pakaian luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: jubah
  rationale: Kata ini paling wajar menunjuk pada pakaian luar atau jubah. Tafsiran 'wadah buku' kurang kuat dan dicatat sebagai alternatif.
- source_word: ἀπέλιπον
  choice: yang kutinggalkan
  rationale: Bentuk aoristus orang pertama tunggal ini secara langsung berarti 'yang kutinggalkan'; bentuk Indonesia tersebut alami dan ringkas.
- source_word: παρὰ Κάρπῳ
  choice: pada Karpus
  rationale: παρά dengan datif di sini menyatakan bahwa barang itu berada pada atau dalam penjagaan Karpus. 'Pada Karpus' mempertahankan keluasan makna itu.
- source_word: ἐρχόμενος
  choice: Ketika engkau datang
  rationale: Partisip ini berfungsi secara adverbial-temporal terhadap perintah φέρε.
- source_word: φέρε
  choice: bawalah
  rationale: Imperatif φέρω meminta Timotius membawa barang-barang tersebut kepada Paulus.
- source_word: τὰ βιβλία
  choice: kitab-kitab
  rationale: βιβλία dapat menunjuk pada buku, kitab, atau gulungan tertulis. 'Kitab-kitab' sesuai dengan bahan tulisan kuno tanpa memastikan bentuk fisiknya; alternatif dijelaskan dalam catatan kaki.
- source_word: μάλιστα
  choice: terutama
  rationale: Kata ini memberi penekanan khusus pada perkamen dibandingkan bahan tertulis lainnya.
- source_word: τὰς μεμβράνας
  choice: perkamen-perkamen itu
  rationale: μεμβράνα menunjuk pada bahan tulisan dari kulit yang telah diolah. Bentuk jamak dan artikelnya dipertahankan secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi namun bermartabat. Pronomina 'engkau' dipakai sesuai sapaan tunggal dalam surat. Penanda catatan kaki ditempatkan sesudah unsur yang dijelaskannya; catatan tentang 'jubah' ditandai pada akhir ayat agar semua penanda hadir tanpa mengganggu alur kalimat.
