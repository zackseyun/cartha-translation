id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: id
  text: Hanya Lukas yang bersamaku. Jemputlah Markus dan bawalah dia bersamamu, karena dia berguna bagiku untuk pelayanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk tugas pelayanan.” Kata Yunani yang dipakai dapat menunjuk pelayanan secara umum, meskipun di sini kemungkinan besar mengacu pada pekerjaan pelayanan Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lukas
  rationale: Bentuk baku nama ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: μόνος
  choice: Hanya
  rationale: Menegaskan bahwa Lukas adalah satu-satunya rekan yang saat itu bersama Paulus, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: μετ’ ἐμοῦ
  choice: bersamaku
  rationale: Secara langsung menyatakan penyertaan atau kebersamaan.
- source_word: Μᾶρκον
  choice: Markus
  rationale: Bentuk baku nama ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἀναλαβὼν
  choice: Jemputlah
  rationale: Dalam konteks perjalanan, menyampaikan tindakan menemui lalu membawa Markus serta mempertahankan urutan yang tersirat sebelum perintah utama.
- source_word: ἄγε
  choice: bawalah dia
  rationale: Imperatif ini dalam konteks berarti membawa seseorang; pronomina 'dia' menjadikan objek yang merujuk kepada Markus jelas dan alami.
- source_word: μετὰ σεαυτοῦ
  choice: bersamamu
  rationale: Menyatakan bahwa Markus harus ikut bersama Timotius.
- source_word: γάρ μοι
  choice: karena dia ... bagiku
  rationale: Menyampaikan alasan bagi perintah sebelumnya serta manfaat Markus bagi Paulus.
- source_word: εὔχρηστος
  choice: berguna
  rationale: Padanan langsung dan wajar untuk sesuatu atau seseorang yang bermanfaat bagi suatu tugas.
- source_word: εἰς διακονίαν
  choice: dalam pelayanan
  rationale: Menyampaikan bidang atau tujuan kegunaan Markus tanpa menjadikannya jabatan resmi; catatan kaki mempertahankan kemungkinan arti yang lebih umum.
theological_decisions:
- issue: Cakupan makna διακονία dalam pernyataan mengenai kegunaan Markus
  choice: pelayanan
  alternative: pengabdian atau pekerjaan melayani secara umum
  rationale: Konteks menunjukkan pekerjaan pelayanan Paulus, tetapi kata Yunani ini tidak dengan sendirinya menunjuk jabatan gerejawi tertentu. Karena itu 'pelayanan' dipakai dalam teks dan keluasan maknanya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk imperatif dengan -lah mempertahankan nada surat yang wajar tanpa terdengar kasar.
source_grounding:
  english_pob_role: consult_only
