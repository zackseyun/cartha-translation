  text: Make every effort to come to me quickly[a].
translation:
  language: id
  text: Berusahalah sungguh-sungguh untuk segera datang kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berusahalah sungguh-sungguh untuk datang kepadaku secepatnya” atau “Lakukanlah segala upaya untuk segera datang kepadaku.”
    reason: Alternatif ini mempertahankan cakupan makna σπουδάζω sebagai usaha yang tekun dan ταχέως sebagai 'segera' atau 'secepatnya'.
lexical_decisions:
- source_word: Σπούδασον
  choice: Berusahalah sungguh-sungguh
  rationale: Imperatif aoris aktif dari σπουδάζω menyatakan kesungguhan, ketekunan, dan upaya yang giat. Pilihan ini membedakannya dari ταχέως, sehingga unsur usaha dan unsur waktu tidak dilebur.
- source_word: ἐλθεῖν
  choice: untuk datang
  rationale: Infinitif aoris dari ἔρχομαι yang bergantung pada σπούδασον. Dengan πρός με, 'datang' merupakan padanan deiktis yang wajar dalam bahasa Indonesia.
- source_word: πρός με
  choice: kepadaku
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang; bentuk 'kepadaku' alami dan ringkas dalam konteks verba 'datang'.
- source_word: ταχέως
  choice: segera
  rationale: Adverbia ini dapat menunjuk pada tindakan yang cepat atau waktu yang dekat. Dalam permintaan untuk datang, 'segera' menyampaikan urgensi temporal secara alami tanpa mengulang gagasan kesungguhan dalam σπουδάζω.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada pribadi yang mendesak tetapi tetap bermartabat. Susunan kalimat mempertahankan dua unsur Yunani yang berbeda: upaya sungguh-sungguh (Σπούδασον) dan urgensi waktu (ταχέως).'
