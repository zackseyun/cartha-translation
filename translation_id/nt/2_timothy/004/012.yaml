  text: But I sent Tychicus to Ephesus[a].
translation:
  language: id
  text: Namun, Tikhikus telah kuutus ke Efesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan, Tikhikus telah kuutus ke Efesus” atau “Adapun Tikhikus telah kuutus ke Efesus”; kata penghubung Yunani δέ dapat menandai kelanjutan biasa ataupun kontras ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tikhikus
  rationale: Nama diri dalam bentuk akusatif; ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel penghubung ini dapat menandai kelanjutan atau kontras ringan. Dalam konteks ini, “Namun” mempertahankan nuansa peralihan yang agak kontras tanpa membuat pertentangan terlalu kuat.
- source_word: ἀπέστειλα
  choice: telah kuutus
  rationale: Aoristus aktif indikatif orang pertama tunggal dari ἀποστέλλω. “Telah kuutus” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan tindakan pengutusan pada masa lampau tanpa merinci aspek secara berlebihan.
- source_word: εἰς
  choice: ke
  rationale: Dengan nama kota sebagai tujuan, εἰς secara alami diterjemahkan “ke” dalam bahasa Indonesia.
- source_word: Ἔφεσον
  choice: Efesus
  rationale: Nama tempat dalam bentuk akusatif setelah εἰς; memakai bentuk Indonesia yang sudah lazim, “Efesus”.
theological_decisions: []
