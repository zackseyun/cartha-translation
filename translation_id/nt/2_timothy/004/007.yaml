base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: id
  text: Aku telah berjuang dalam pertarungan yang baik; aku telah menyelesaikan perlombaan; aku telah memelihara iman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku telah menjaga iman.” Frasa Yunani τὴν πίστιν dapat berarti “iman,” termasuk iman Kristen sebagai sesuatu yang dipelihara, atau dapat mengandung arti “kesetiaan”; yakni, “aku tetap setia.”
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: perjuangan yang baik
  rationale: ἀγών dapat berarti perjuangan atau pertandingan. Ungkapan ini mempertahankan gema metafora pertandingan tanpa membatasinya hanya pada pertarungan fisik, sedangkan καλός diterjemahkan secara langsung sebagai 'baik'.
- source_word: ἠγώνισμαι
  choice: aku telah berjuang
  rationale: Bentuk perfek ἀγωνίζομαι menyatakan tindakan yang telah dituntaskan dengan hasil yang tetap relevan. Bentuk 'telah berjuang' wajar dalam bahasa Indonesia dan mempertahankan hubungan etimologis dengan 'perjuangan'.
- source_word: δρόμον
  choice: perlombaan
  rationale: δρόμος menunjuk pada lintasan atau perlombaan lari. 'Perlombaan' menyampaikan metafora atletik secara jelas bagi pembaca modern.
- source_word: τετέλεκα
  choice: aku telah menyelesaikan
  rationale: Bentuk perfek τελέω menyatakan bahwa sesuatu telah dibawa sampai pada akhirnya. 'Telah menyelesaikan' mempertahankan aspek penyelesaian dan selaras dengan struktur tiga klausa.
- source_word: πίστιν
  choice: iman
  rationale: πίστις secara wajar diterjemahkan 'iman'. Artikelnya dapat menunjuk pada iman sebagai sesuatu yang tertentu, termasuk iman Kristen, tetapi bahasa Indonesia tidak memerlukan kata sandang; kemungkinan makna kesetiaan dicatat dalam catatan kaki.
- source_word: τετήρηκα
  choice: aku telah memelihara
  rationale: τηρέω dapat berarti menjaga, menaati, atau memelihara. 'Memelihara' memungkinkan nuansa mempertahankan iman dan tetap setia tanpa secara sempit mengartikannya sebagai penjagaan fisik.
theological_decisions:
- issue: Makna τὴν πίστιν
  choice: iman
  alternative: kesetiaan; tetap setia
  rationale: Dengan artikel, frasa ini mungkin menunjuk pada iman yang dipegang Paulus, bahkan iman Kristen sebagai suatu pokok ajaran. Namun, πίστις juga dapat mengandung nuansa kesetiaan. Teks utama memakai 'iman' dan catatan kaki mempertahankan kemungkinan lainnya tanpa menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' mempertahankan suara pribadi Paulus. Tiga klausa paralel dipisahkan dengan titik koma agar ritme retoris teks Yunani tetap terasa.
