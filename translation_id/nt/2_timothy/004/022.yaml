  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: id
  text: Tuhan menyertai rohmu.[a] Anugerah menyertai kamu semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani beralih dari bentuk tunggal, “rohmu,” ke bentuk jamak, “kamu semua.”
    reason: Menjelaskan peralihan jumlah yang menunjukkan bahwa berkat pertama ditujukan kepada Timotius, sedangkan berkat terakhir mencakup kelompok yang lebih luas.
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Dalam berkat penutup Paulus, κύριος secara wajar menunjuk kepada Tuhan Yesus. Sebutan “Tuhan” mempertahankan gelar itu tanpa menambahkan nama yang tidak tertulis dalam teks Yunani.
- source_word: μετὰ
  choice: menyertai
  rationale: Kedua klausa Yunani tidak memiliki kata kerja yang dinyatakan. “Menyertai” mengungkapkan makna μετά dengan genitif secara alami dalam rumusan berkat bahasa Indonesia tanpa memperluas isinya.
- source_word: πνεύματός σου
  choice: rohmu
  rationale: Kata ganti milik tunggal menunjuk kepada roh Timotius sebagai manusia. Huruf kecil dipakai agar tidak mengidentifikasikannya secara langsung dengan Roh Kudus.
- source_word: χάρις
  choice: Anugerah
  rationale: “Anugerah” merupakan padanan yang alami dan berbobot bagi χάρις dalam rumusan berkat Paulus; “kemurahan” mungkin secara leksikal, tetapi kurang tepat menangkap pemakaian khas ini.
- source_word: ὑμῶν
  choice: kamu semua
  rationale: Ungkapan ini menyatakan bentuk jamak dengan jelas dan mempertahankan peralihan dari sapaan tunggal kepada Timotius ke berkat bagi kelompok yang lebih luas.
theological_decisions:
- issue: Rujukan gelar “Tuhan”
  choice: Dipahami sebagai rujukan kepada Tuhan Yesus dalam berkat penutup Paulus.
  alternative: Rujukan yang lebih umum kepada Allah.
  rationale: Pemakaian Paulus dalam rumusan penutup mendukung rujukan kepada Yesus. Namun, terjemahan tidak menambahkan “Yesus” karena teks Yunani hanya berbunyi “Tuhan”.
- issue: Peralihan jumlah dalam kedua klausa
  choice: Klausa pertama ditujukan kepada Timotius secara pribadi, sedangkan klausa kedua meluaskan berkat kepada beberapa orang.
  alternative: Kedua klausa diperlakukan seolah-olah hanya ditujukan kepada Timotius.
  rationale: Teks Yunani dengan sengaja beralih dari σου yang tunggal ke ὑμῶν yang jamak; “rohmu” dan “kamu semua” mempertahankan perbedaan tersebut.
- issue: Daya ujar kedua klausa tanpa kata kerja Yunani
  choice: Diterjemahkan sebagai rumusan berkat dengan “menyertai”, tanpa menambahkan “kiranya”.
  alternative: “Kiranya Tuhan menyertai rohmu. Kiranya anugerah menyertai kamu semua.”
  rationale: Konteks penutup menunjukkan maksud berkat, tetapi ketiadaan kata kerja dalam bahasa Yunani memberi rumusan yang ringkas. Bentuk Indonesia ini tetap alami dan tidak mempertegas nuansa optatif melebihi sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Kamu semua” dipilih daripada “kalian” agar bentuk jamak jelas sekaligus mempertahankan laras yang sesuai untuk berkat penutup.
