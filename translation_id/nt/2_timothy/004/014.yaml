  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: id
  text: Aleksander, tukang logam itu,[a] telah banyak berbuat jahat kepadaku.[b] Tuhan akan membalasnya sesuai dengan perbuatannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tukang tembaga.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah sangat merugikan aku.”
    reason: lexical_alternative
  - marker: c
    text: Beberapa naskah berbunyi, “Kiranya Tuhan membalasnya sesuai dengan perbuatannya.”
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: tukang logam
  rationale: Istilah ini menunjuk kepada perajin logam, sering kali tembaga atau perunggu. “Tukang logam” jelas dalam bahasa Indonesia modern dan tidak menentukan jenis logam secara berlebihan.
- source_word: πολλά μοι κακὰ
  choice: banyak kejahatan terhadapku
  rationale: Ungkapan ini secara harfiah berarti banyak hal jahat terhadap Paulus. Pilihan ini mempertahankan bobot κακά, sedangkan ungkapan yang lebih idiomatis “sangat merugikan aku” dicatat sebagai alternatif.
- source_word: ἐνεδείξατο
  choice: telah berbuat
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa Aleksander memperlihatkan atau melakukan hal-hal jahat terhadap Paulus. “Berbuat” menghasilkan ungkapan Indonesia yang alami bersama “kejahatan” tanpa menghilangkan tindakan yang ditujukan kepada Paulus.
- source_word: ἀποδώσει
  choice: akan membalas
  rationale: Bentuk future indicative ini menyatakan pembalasan atau ganjaran yang akan diberikan. “Akan membalas” mempertahankan bentuk pernyataan dan nuansa retributifnya.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Sebutan ini merujuk secara definitif kepada Tuhan. Dalam bahasa Indonesia, nama/sebutan “Tuhan” sudah definitif tanpa artikel tersendiri.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: sesuai dengan perbuatannya
  rationale: Terjemahan ini mempertahankan gagasan bahwa pembalasan diberikan berdasarkan apa yang telah dilakukannya, dengan ungkapan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἀποδώσει diterjemahkan sebagai pernyataan masa depan atau sebagai doa/harapan
  choice: Tuhan akan membalasnya
  alternative: Kiranya Tuhan membalasnya
  rationale: Teks SBLGNT memakai future indicative ἀποδώσει, sehingga teks utama menyajikannya sebagai pernyataan tentang pembalasan ilahi. Varian manuskrip yang berbentuk harapan atau doa dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Nama Ἀλέξανδρος ditulis “Aleksander” sesuai bentuk yang lazim dalam tradisi Alkitab Indonesia. Susunan kalimat dibuat alami, sementara nuansa kejahatan, pembalasan, dan varian tekstual tetap dipertahankan.
