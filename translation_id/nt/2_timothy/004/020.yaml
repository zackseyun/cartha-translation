  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: id
  text: Erastus tinggal di Korintus, tetapi Trofimus kutinggalkan di Miletus dalam keadaan sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Erastus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἔμεινεν
  choice: tinggal
  rationale: Dalam laporan perjalanan ini, verba μένω menyatakan bahwa Erastus tetap berada atau tinggal di Korintus; 'tinggal' alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐν Κορίνθῳ
  choice: di Korintus
  rationale: ἐν berfungsi lokatif dengan nama kota; 'di Korintus' merupakan padanan Indonesia yang wajar.
- source_word: Τρόφιμον
  choice: Trofimus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δὲ
  choice: tetapi
  rationale: δέ menandai kontras ringan antara dua keterangan perjalanan; 'tetapi' mempertahankan hubungan tersebut.
- source_word: ἀπέλιπον
  choice: kutinggalkan
  rationale: Bentuk aoristus orang pertama tunggal dari ἀπολείπω berarti 'aku meninggalkan'; bentuk 'kutinggalkan' ringkas, alami, dan mempertahankan subjek orang pertama yang tersirat.
- source_word: ἐν Μιλήτῳ
  choice: di Miletus
  rationale: ἐν berfungsi lokatif dengan nama kota; 'di Miletus' alami dalam bahasa Indonesia.
- source_word: ἀσθενοῦντα
  choice: dalam keadaan sakit
  rationale: Partisipel kini ini menerangkan keadaan Trofimus ketika ditinggalkan. Ungkapan ini mempertahankan hubungan temporal-keadaan tanpa memaksanya menjadi klausa tersendiri.
