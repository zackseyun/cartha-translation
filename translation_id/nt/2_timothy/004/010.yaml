  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: id
  text: Sebab Demas telah meninggalkan aku karena mencintai zaman sekarang ini[a] dan pergi ke Tesalonika; Kreskes ke Galatia, dan Titus ke Dalmatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dunia sekarang ini.” Secara lebih harfiah, frasa Yunani itu menunjuk kepada zaman atau era sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: telah meninggalkan
  rationale: Kata kerja ini menyatakan bahwa Demas meninggalkan Paulus dengan nuansa negatif yang serius. Frasa ini alami dalam bahasa Indonesia dan, bersama konteksnya, menyampaikan tindakan tercela tanpa secara eksplisit menambahkan bahwa Demas murtad.
- source_word: ἀγαπήσας
  choice: karena mencintai
  rationale: Partisip aoris ini kemungkinan besar menyatakan sebab. Terjemahan kausal menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan kaitan erat antara kecintaan Demas kepada zaman sekarang dan tindakannya meninggalkan Paulus.
- source_word: τὸν νῦν αἰῶνα
  choice: zaman sekarang ini
  rationale: αἰών terutama menunjuk kepada zaman atau era, dengan nuansa temporal dan etis, bukan kepada alam semesta fisik. Pilihan ini mempertahankan ungkapan sumber tanpa menyamakannya begitu saja dengan 'dunia'.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Padanan sederhana dan alami untuk verba gerak ini; tidak menambahkan cara atau maksud perjalanan yang tidak dinyatakan.
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan permintaan pada ayat sebelumnya dalam bentuk penghubung yang wajar dan bermartabat.
- source_word: Θεσσαλονίκην
  choice: Tesalonika
  rationale: Bentuk nama tempat yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: Κρήσκης
  choice: Kreskes
  rationale: Transliterasi personal yang mengikuti bentuk Yunani dan pemakaian Indonesia yang lazim.
- source_word: Γαλατίαν
  choice: Galatia
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: Τίτος
  choice: Titus
  rationale: Bentuk nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: Δαλματίαν
  choice: Dalmatia
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah kepergian Demas harus diterjemahkan sebagai kemurtadan atau hanya tindakan meninggalkan Paulus
  choice: Menerjemahkan bahwa Demas 'telah meninggalkan aku' dengan nuansa moral negatif, tanpa secara eksplisit menyatakan bahwa ia meninggalkan iman.
  alternative: Memakai ungkapan lebih keras yang secara langsung menyatakan kemurtadan, atau ungkapan netral yang hanya menyatakan kepergian fisik.
  rationale: Ayat ini menghubungkan tindakan Demas dengan kecintaannya kepada zaman sekarang, sehingga tindakannya jelas dipandang negatif. Namun, teks tidak secara langsung menyatakan kemurtadan akhir; ketegangan tersebut dipertahankan.
- issue: Hubungan sintaksis partisip ἀγαπήσας dengan tindakan meninggalkan
  choice: 'Menyatakannya secara kausal: ''karena mencintai''.'
  alternative: Mempertahankan bentuk yang lebih harfiah, 'setelah mencintai' atau 'dengan mencintai', yang dapat membiarkan hubungan sintaksis lebih terbuka tetapi kurang alami dalam bahasa Indonesia.
  rationale: Dalam konteks ini, partisip tersebut paling wajar dipahami sebagai sebab tindakan Demas. Pilihan ini tidak menambahkan isi doktrinal, melainkan memperjelas hubungan yang tersirat kuat dalam tata bahasa dan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Elipsis pada dua tujuan terakhir dibuat jelas dengan mengulang 'pergi', tanpa mengubah isi. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
