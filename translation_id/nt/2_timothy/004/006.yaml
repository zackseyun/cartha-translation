  naturalness: “Aku sudah dicurahkan sebagai persembahan curahan” adalah bahasa Indonesia baku dan cukup alami dalam register khidmat, walaupun bentuk pasifnya tidak secara eksplisit menandai aspek progresif Yunani. Ini lebih setia dan lebih idiomatis daripada “sudah mulai dicurahkan”.
