  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: id
  text: Sebab, aku sudah dicurahkan sebagai persembahan curahan[a], dan saat kepergianku telah tiba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “aku sudah dicurahkan.” Kata Yunani ini membangkitkan gambaran cairan yang dicurahkan sebagai persembahan curahan dalam kurban.
    reason: lexical_alternative
  - marker: b
    text: Atau “pelepasanku” atau “penguraianku.” Dalam konteks ini, “kepergian” merupakan ungkapan alami bagi kematian.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: sudah mulai dicurahkan sebagai persembahan curahan
  rationale: Verba ini menggambarkan pencurahan cairan sebagai persembahan. Bentuk kini pasif menyajikan tindakan itu sebagai sedang berlangsung; ungkapan 'sudah mulai' mengungkapkan gabungan ἤδη dengan aspek tindakan kini secara wajar dalam bahasa Indonesia.
- source_word: ἤδη
  choice: sudah mulai
  rationale: Menandai bahwa tindakan tersebut kini telah berlangsung, sesuai dengan kesadaran Paulus bahwa kematiannya sudah dekat.
- source_word: καιρός
  choice: saat
  rationale: Dalam konteks ini menunjuk pada momen tertentu dan menentukan, bukan waktu secara umum.
- source_word: ἀναλύσεώς
  choice: kepergian
  rationale: Kata ini dapat menyiratkan pelepasan atau pembongkaran, tetapi dalam konteks ini 'kepergian' merupakan ungkapan alami bagi kematian dan tetap mempertahankan metaforanya.
- source_word: ἐφέστηκεν
  choice: telah tiba
  rationale: Bentuk perfektum menunjukkan bahwa saat itu telah datang dan kini hadir; 'telah tiba' menyampaikan keadaan sekarang sebagai hasil kedatangannya.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan pernyataan sebelumnya secara lugas.
theological_decisions:
- issue: Gambaran metaforis tentang kematian Paulus
  choice: Paulus menggambarkan kematiannya yang sudah dekat melalui citra persembahan curahan dan istilah 'kepergian'.
  alternative: Paulus hanya merujuk secara umum pada penderitaannya, bukan secara khusus pada kematiannya.
  rationale: Gabungan σπένδομαι dan ἀνάλυσις sangat mengarah kepada kematian yang segera terjadi, tetapi terjemahan mempertahankan kedua metafora dan tidak meratakannya menjadi parafrasa 'aku akan segera mati'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Persembahan curahan' mempertahankan citra kurban tanpa memakai istilah teknis yang terlalu asing; 'kepergian' mempertahankan ungkapan halus dan ambiguitas metaforis sumber.
