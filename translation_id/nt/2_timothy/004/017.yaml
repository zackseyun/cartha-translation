  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: id
  text: Tetapi Tuhan berdiri di sisiku dan menguatkan aku, supaya melalui aku pemberitaan itu terlaksana sepenuhnya dan semua bangsa bukan Yahudi[a] dapat mendengarnya, dan aku diselamatkan dari mulut singa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua bangsa.” Kata Yunani ἔθνη dapat berarti “bangsa-bangsa bukan Yahudi” atau “bangsa-bangsa”; di sini kemungkinan besar yang dimaksud ialah bangsa-bangsa non-Yahudi yang mendengar Injil.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dari mulut singa” mungkin merupakan bahasa kiasan untuk penyelamatan dari bahaya yang mematikan, bukan acuan kepada singa secara harfiah.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Tetapi Tuhan
  rationale: δέ menandai pertentangan dengan ayat sebelumnya, sedangkan κύριος diterjemahkan secara wajar sebagai “Tuhan” tanpa menentukan referennya lebih jauh.
- source_word: μοι παρέστη
  choice: berdiri di sisiku
  rationale: Ungkapan ini mempertahankan gambaran kehadiran pribadi yang mendampingi dan menolong, bukan sekadar keberadaan secara fisik.
- source_word: ἐνεδυνάμωσέν με
  choice: menguatkan aku
  rationale: ἐνδυναμόω menyatakan pemberian kekuatan atau kemampuan; “menguatkan aku” alami dan tetap berbobot dalam konteks ini.
- source_word: ἵνα δι’ ἐμοῦ
  choice: supaya melalui aku
  rationale: ἵνα menyatakan tujuan, sedangkan διά dengan genitif menyatakan perantaraan atau sarana.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: pemberitaan itu terlaksana sepenuhnya
  rationale: κῆρυγμα mencakup berita yang diberitakan sekaligus tindakan memberitakannya. πληροφορέω di sini dapat menyatakan pelaksanaan atau penuntasan secara penuh; terjemahan ini mempertahankan keluasan maknanya.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: semua bangsa bukan Yahudi dapat mendengarnya
  rationale: ἔθνη dalam konteks misi Paulus kemungkinan menunjuk kepada bangsa-bangsa non-Yahudi, sementara bentuk tujuan sesudah ἵνα tercermin dalam “dapat mendengarnya.” Kemungkinan arti yang lebih umum, “semua bangsa,” dicatat dalam catatan kaki.
- source_word: ἐρρύσθην
  choice: Aku pun diselamatkan
  rationale: ῥύομαι berarti menyelamatkan atau melepaskan dari bahaya. “Diselamatkan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐκ στόματος λέοντος
  choice: dari mulut singa
  rationale: Terjemahan harfiah mempertahankan citra sumber dan tidak membatasi ungkapan ini pada satu penafsiran historis atau teologis.
theological_decisions:
- issue: Referen “Tuhan” (κύριος)
  choice: Diterjemahkan hanya sebagai “Tuhan.”
  alternative: Yesus secara khusus; atau Allah secara lebih umum.
  rationale: Konteks memungkinkan κύριος dipahami sebagai Tuhan Yesus yang bangkit, tetapi ayat ini tidak menyebut referennya secara eksplisit. Terjemahan mempertahankan ketidaktersuratan tersebut.
- issue: Makna “dari mulut singa”
  choice: Citra asli dipertahankan sebagai ungkapan penyelamatan dari bahaya yang mematikan.
  alternative: Kiasan bagi Nero; kiasan bagi Iblis; atau acuan kepada hukuman mati secara harfiah oleh binatang buas.
  rationale: Teks tidak memastikan satu penafsiran tertentu, sehingga terjemahan tidak mempersempit ketegangan historis dan teologis yang ada.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan tujuan dalam teks Yunani, sementara “berdiri di sisiku” dan “mulut singa” menjaga citra sumber tanpa penjelasan berlebihan di dalam ayat.
