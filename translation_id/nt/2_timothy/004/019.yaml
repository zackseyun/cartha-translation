  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: id
  text: Sampaikan salam kepada Priska dan Akwila[a], serta kepada seisi rumah Onesiforus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, namanya “Priska”; di bagian lain ia juga disebut “Priskila” (misalnya, Kisah Para Rasul 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Sampaikan salam kepada
  rationale: Bentuk imperatif ini merupakan perintah dalam konteks surat untuk menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintah tanpa menambahkan nuansa kehangatan yang tidak dinyatakan secara khusus.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Teks Yunani memakai bentuk nama Πρίσκαν (bentuk akusatif dari Πρίσκα), sehingga 'Priska' merupakan alih aksara langsung; bentuk lain yang dikenal adalah 'Priskila'.
- source_word: Ἀκύλαν
  choice: Akwila
  rationale: Alih aksara nama Ἀκύλας yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: seisi rumah Onesiforus
  rationale: Dalam konteks salam, οἶκος menunjuk kepada orang-orang dalam rumah tangga, bukan terutama bangunannya. 'Seisi rumah' mempertahankan cakupan sosial yang dapat meliputi keluarga dan anggota rumah tangga lainnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan kalimat dibuat alami, sedangkan nama-nama dialihaksarakan secara konsisten. Penanda catatan kaki [a] ditempatkan sesudah pasangan nama karena catatan menjelaskan bentuk nama Priska.
