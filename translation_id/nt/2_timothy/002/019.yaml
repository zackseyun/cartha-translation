id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: id
  text: 'Namun, fondasi Allah yang kokoh tetap berdiri, dengan meterai ini[a]: “Tuhan mengenal orang-orang yang menjadi milik-Nya,” dan, “Hendaklah setiap orang yang menyebut nama Tuhan[b] menjauh dari kejahatan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuat tulisan ini.” Kata yang diterjemahkan “meterai” dapat merujuk pada tanda pengenal atau tulisan yang tertera pada meterai.
    reason: lexical_alternative
  - marker: b
    text: Atau “setiap orang yang berseru kepada Tuhan.” Secara harfiah, bahasa Yunani berbunyi “menyebut nama Tuhan,” suatu ungkapan untuk berseru kepada-Nya atau menyatakan kesetiaan kepada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Namun
  rationale: Menandai peralihan yang tegas dan kontras dengan pembicaraan sebelumnya tentang ajaran sesat, tanpa terasa terlalu kuno.
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: fondasi Allah yang kokoh
  rationale: Mempertahankan metafora fondasi, menonjolkan kestabilannya, dan membiarkan hubungan genitif dengan Allah tetap cukup terbuka.
- source_word: ἕστηκεν
  choice: tetap berdiri
  rationale: 'Mengungkapkan keadaan tetap yang dihasilkan oleh bentuk perfektum: fondasi itu sudah tegak dan terus demikian.'
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: dengan meterai ini
  rationale: Mempertahankan citra meterai sebagai tanda pengenal atau pengesahan; kemungkinan nuansa tulisan pada meterai dicatat dalam catatan kaki.
- source_word: Ἔγνω κύριος
  choice: Tuhan mengenal
  rationale: Dalam kutipan ini, bentuk aoristus menyampaikan pengenalan ilahi yang berlaku tetap; bentuk kini dalam bahasa Indonesia paling alami.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: orang-orang yang menjadi milik-Nya
  rationale: Menyampaikan relasi kepunyaan dan identitas secara jelas serta alami.
- source_word: Ἀποστήτω
  choice: Hendaklah ... menjauh
  rationale: Menyampaikan perintah untuk memisahkan diri secara tegas, dengan bentuk Indonesia yang alami.
- source_word: ἀπὸ ἀδικίας
  choice: dari ketidakbenaran
  rationale: Mempertahankan cakupan moral luas ἀδικία, termasuk perbuatan salah dan keadaan yang bertentangan dengan kebenaran, tanpa membatasinya hanya pada ketidakadilan sosial.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: setiap orang yang menyebut nama Tuhan
  rationale: Mempertahankan pengulangan retoris 'menyebut nama' dalam bahasa sumber; makna idiomatisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Rujukan “Tuhan” dalam kedua pernyataan pada meterai
  choice: Kedua kemunculan κύριος diterjemahkan hanya sebagai “Tuhan”, tanpa menentukan lebih lanjut siapa rujukannya.
  alternative: Menafsirkannya secara khusus sebagai Allah Bapa, sebagai Kristus, atau membedakan rujukan kedua klausa.
  rationale: Bahasa Yunani tidak memberikan penjelasan eksplisit. Kutipan Kitab Suci ini dipakai dalam konteks Kristen dan dapat memiliki kedalaman rujukan teologis yang tidak sepatutnya diselesaikan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Fondasi” dipilih sebagai metafora bangunan yang lazim; “meterai” mempertahankan citra formal sumber. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan tulisan rohani Indonesia untuk rujukan ilahi.
