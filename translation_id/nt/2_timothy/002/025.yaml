  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: id
  text: dengan lemah lembut mendidik orang-orang yang menentang[a], kalau-kalau Allah mengaruniakan kepada mereka pertobatan yang membawa kepada pengenalan akan kebenaran[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang menentangnya”; objek penentangan tidak dinyatakan dalam teks Yunani, tetapi konteks dapat menunjuk kepada hamba Tuhan dan ajarannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “barangkali Allah mengaruniakan kepada mereka pertobatan menuju pengenalan akan kebenaran.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: dengan lemah lembut
  rationale: Frasa ini menyatakan cara menegur. Ungkapan Indonesia ini alami dan mempertahankan arti kelembutan yang terkendali, bukan kelemahan.
- source_word: παιδεύοντα
  choice: menegur
  rationale: Dalam konteks menghadapi para penentang, kata ini menunjuk pada pengajaran yang bersifat memperbaiki. 'Menegur' menyampaikan unsur koreksi dengan wajar, meski nuansa mendidiknya juga hadir.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: orang-orang yang menentang
  rationale: Partisipel ini menyebut mereka yang mengambil sikap berlawanan. Teks Yunani tidak menyatakan objek penentangan secara eksplisit, sehingga terjemahan tidak menambah 'dia' dan mempertahankan ambiguitas aslinya.
- source_word: μήποτε
  choice: kalau-kalau
  rationale: Bersama bentuk subjungtif δώῃ, ungkapan ini menyampaikan kemungkinan atau harapan yang berhati-hati tanpa memastikan hasilnya.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: Allah mengaruniakan kepada mereka
  rationale: '''Mengaruniakan'' sesuai dengan penggunaan idiomatis δίδωμι di sini dan mempertahankan Allah sebagai pelaku pemberian pertobatan.'
- source_word: μετάνοιαν
  choice: pertobatan
  rationale: '''Pertobatan'' merupakan padanan Indonesia yang baku dan memadai bagi μετάνοια, mencakup perubahan pikiran dan arah hidup tanpa membatasinya pada perubahan intelektual semata.'
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: yang membawa kepada pengenalan akan kebenaran
  rationale: εἰς menyatakan tujuan atau hasil, sedangkan ἐπίγνωσις menunjuk pada pengenalan atau pemahaman yang nyata. Rumusan ini menyampaikan gerak menuju pengenalan akan kebenaran.
theological_decisions:
- issue: Peran Allah dan tanggapan manusia dalam pertobatan
  choice: Mempertahankan pernyataan bahwa Allah dapat mengaruniakan pertobatan, sambil tetap menyatakan kemungkinan melalui 'kalau-kalau'.
  alternative: Menjadikan pertobatan sepenuhnya ditentukan secara tak bersyarat, atau mengurangi peran Allah menjadi sekadar memberi kesempatan.
  rationale: Teks secara eksplisit menampilkan Allah sebagai pemberi pertobatan, tetapi tidak menjelaskan secara sistematis hubungannya dengan tanggung jawab manusia. Terjemahan mempertahankan ketegangan tersebut.
- issue: Objek penentangan
  choice: Tidak menambahkan objek pada 'menentang'.
  alternative: Menambahkan 'dia', yakni hamba Tuhan, atau 'ajaran itu' berdasarkan konteks.
  rationale: Objek tidak dinyatakan dalam bahasa Yunani. Konteks memungkinkan penentangan terhadap hamba Tuhan dan ajarannya, tetapi terjemahan utama menjaga ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tetap mengikuti bentuk partisipial ayat dalam konteks kalimat yang berlanjut dari ayat sebelumnya. 'Lemah lembut' dipilih sebagai ungkapan umum yang tidak menyiratkan kelemahan; 'pertobatan' mempertahankan bobot teologis istilah sumber.
