  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: id
  text: Petani yang bekerja keras harus terlebih dahulu mendapat bagian dari hasil panen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Petani yang berjerih payah harus terlebih dahulu mengambil bagian dalam hasil panen.”
    reason: Alternatif yang lebih formal untuk menerjemahkan κοπιῶντα dan μεταλαμβάνειν. Frasa “terlebih dahulu” mempertahankan prioritas yang dinyatakan oleh πρῶτον.
lexical_decisions:
- source_word: κοπιῶντα (κοπιάω)
  choice: yang bekerja keras
  rationale: Partisip ini menggambarkan kerja yang berat atau melelahkan. Frasa ini alami dalam bahasa Indonesia modern dan tetap menonjolkan jerih payah petani.
- source_word: γεωργὸν (γεωργός)
  choice: petani
  rationale: Kata ini menunjuk kepada orang yang menggarap tanah; “petani” merupakan padanan modern yang paling jelas.
- source_word: δεῖ
  choice: harus
  rationale: Kata ini menyatakan keharusan atau kewajiban, yang secara ringkas dan wajar disampaikan dengan “harus”.
- source_word: πρῶτον
  choice: menjadi orang pertama
  rationale: Dalam susunan kalimat ini, kata tersebut paling wajar menunjukkan prioritas dalam mendapat bagian, bukan bahwa petani harus bekerja terlebih dahulu sebelum makan.
- source_word: τῶν καρπῶν (καρπός)
  choice: dari hasil panen
  rationale: Dalam konteks pertanian, bentuk jamak ini menunjuk kepada hasil tanah atau panen secara luas, bukan hanya buah-buahan.
- source_word: μεταλαμβάνειν (μεταλαμβάνω)
  choice: mendapat bagian
  rationale: Kata kerja ini berarti mengambil atau menerima bagian. Pilihan ini menyampaikan hubungan partitif dengan τῶν καρπῶν secara jelas dan alami.
theological_decisions:
- issue: Makna pernyataan yang menyerupai pepatah
  choice: Orang yang berjerih payah harus mendapat prioritas untuk mengambil bagian dalam hasil pekerjaannya.
  alternative: Petani harus bekerja terlebih dahulu sebelum menikmati hasil panen.
  rationale: Sintaksis Yunani paling alami menghubungkan πρῶτον dengan μεταλαμβάνειν, sehingga tekanannya terletak pada prioritas dalam menerima bagian, bukan sekadar urutan antara bekerja dan makan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Hasil panen” dipilih daripada “buah-buahan” agar cakupan hasil pertanian tidak dipersempit; “mendapat bagian” mempertahankan makna partisipasi tanpa terdengar kuno.
