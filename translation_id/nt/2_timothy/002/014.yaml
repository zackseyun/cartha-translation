id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: id
  text: Teruslah ingatkan mereka akan hal-hal ini dan, di hadapan Tuhan,[a] peringatkan mereka dengan sungguh-sungguh agar tidak bertengkar tentang kata-kata, karena itu sama sekali tidak berguna dan mengakibatkan kehancuran bagi orang-orang yang mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “Tuhan” di sini dapat menunjuk kepada Tuhan Yesus atau kepada Allah secara lebih umum; teks Yunani tidak memperjelas referennya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak netral ini menunjuk kembali pada ajaran yang baru disampaikan; “hal-hal ini” mempertahankan rujukan anaforis dan bentuk jamaknya secara alami.
- source_word: ὑπομίμνῃσκε
  choice: Teruslah ingatkan
  rationale: Imperatif kini menyiratkan tindakan yang berkelanjutan atau berulang; “teruslah” mengungkapkan aspek tersebut dalam bahasa Indonesia yang wajar.
- source_word: διαμαρτυρόμενος
  choice: peringatkan mereka dengan sungguh-sungguh
  rationale: Partisip ini menyatakan desakan atau peringatan yang khidmat dan kuat. Objek “mereka” tersirat dari konteks sebagai orang-orang yang harus terus diingatkan.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: di hadapan Tuhan
  rationale: Ungkapan ini menggambarkan tindakan yang dilakukan dalam kehadiran dan di bawah kesaksian ilahi, tanpa mempersempit referen κύριος.
- source_word: μὴ λογομαχεῖν
  choice: agar tidak bertengkar tentang kata-kata
  rationale: Kata kerja ini merujuk pada perselisihan verbal atau pertengkaran mengenai kata-kata; pilihan ini jelas dan tidak berlebihan.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: sama sekali tidak berguna
  rationale: Frasa ini menegaskan tidak adanya manfaat apa pun; “sama sekali” mempertahankan daya penegasannya.
- source_word: ἐπὶ καταστροφῇ
  choice: malah mendatangkan kehancuran
  rationale: Frasa ini menyatakan akibat merusak yang berat. “Malah” menampilkan pertentangan antara ketiadaan manfaat dan akibat buruknya, sedangkan “kehancuran” mempertahankan kekuatan καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: bagi orang-orang yang mendengarnya
  rationale: Partisip substantival ini mencakup semua orang yang mendengar pertengkaran tersebut; bentuk ini lebih alami daripada nomina formal seperti “para pendengar”.
theological_decisions:
- issue: Referen κύριος
  choice: Tuhan
  alternative: Allah; Tuhan Yesus
  rationale: Teks Yunani hanya memakai gelar κύριος tanpa menyebut referennya secara khusus. “Tuhan” mempertahankan ambiguitas yang sungguh ada antara rujukan kepada Allah secara umum dan kepada Tuhan Yesus secara khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral yang tegas dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara hubungan sebab-akibat serta ketegangan teologis dalam sebutan “Tuhan” tetap dipertahankan.
