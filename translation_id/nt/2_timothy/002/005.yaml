id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: id
  text: Dan jika seseorang bertanding sebagai atlet, ia tidak akan dimahkotai kecuali ia bertanding sesuai dengan peraturan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara sah.” Kata Yunani yang dipakai dapat berarti “dengan cara yang sesuai hukum”; dalam konteks ini kemungkinan besar maksudnya ialah menaati peraturan pertandingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: bertanding sebagai atlet / bertanding
  rationale: Kata kerja ἀθλέω menggambarkan pertandingan atletik, bukan sekadar usaha pada umumnya. Ungkapan pertama memperjelas gambaran atletik, sedangkan pengulangan 'bertanding' mempertahankan kaitan leksikal dalam bahasa Indonesia yang alami.
- source_word: τις
  choice: seseorang
  rationale: Pronomina tak tentu ini bersifat umum. 'Seseorang' menyampaikan makna tersebut secara wajar tanpa membatasi jenis kelamin.
- source_word: στεφανοῦται
  choice: dimahkotai
  rationale: Bentuk pasif ini menunjuk pada pemberian mahkota atau karangan kemenangan kepada pemenang. 'Dimahkotai' ringkas dan mempertahankan metafora sumber.
- source_word: νομίμως
  choice: sesuai dengan peraturan
  rationale: Dalam konteks pertandingan atletik, adverbia ini berarti bertanding dengan cara yang sah, yakni menaati ketentuan pertandingan. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: καὶ
  choice: juga (tersirat dalam penambahan contoh)
  rationale: καί menambahkan gambaran atlet kepada contoh-contoh di sekitarnya. Dalam bahasa Indonesia, daya aditifnya sudah terbawa oleh 'Dan jika'; menerjemahkannya lagi dengan 'juga' akan terasa kaku dalam kalimat ini.
- source_word: δὲ
  choice: Dan
  rationale: δέ menandai peralihan ringan ke contoh berikutnya; 'Dan' menjaga kesinambungan rangkaian perumpamaan.
theological_decisions:
- issue: Makna gambaran mahkota
  choice: Mempertahankan metafora atlet yang dimahkotai tanpa menentukan jenis upah rohani tertentu.
  alternative: Menafsirkannya secara eksplisit sebagai upah eskatologis atau persetujuan atas pelayanan.
  rationale: Teks hanya memakai analogi pertandingan untuk menekankan perlunya bertanding dengan sah. Terjemahan tidak semestinya memasukkan penafsiran doktrinal yang lebih khusus daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'dimahkotai' mempertahankan citra dunia pertandingan kuno, sedangkan 'sesuai dengan peraturan' menyampaikan makna kontekstual νομίμως secara langsung.
