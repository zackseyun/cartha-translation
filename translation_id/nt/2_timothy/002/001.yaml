  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: id
  text: Karena itu, engkau, anakku, hendaklah dikuatkan[a] di dalam anugerah yang ada dalam Mesias Yesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jadilah kuat.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Kristus Yesus.” Kata Yunani Χριστός berarti “Yang Diurapi” dan di sini diterjemahkan “Mesias” untuk mempertahankan makna gelarnya.
    reason: alternative_rendering
lexical_decisions:
- source_word: Σὺ
  choice: engkau
  rationale: Kata ganti ini dinyatakan secara eksplisit dalam bahasa Yunani sehingga bernada tegas atau kontras. “Engkau” mempertahankan penekanan itu dalam ragam yang bermartabat.
- source_word: οὖν
  choice: karena itu
  rationale: Kata ini menghubungkan nasihat tersebut dengan konteks sebelumnya sebagai kesimpulan atau kelanjutan yang beralasan.
- source_word: τέκνον μου
  choice: anakku
  rationale: τέκνον secara leksikal berarti “anak” dan di sini menyatakan hubungan rohani yang penuh kasih, tanpa perlu mempersempitnya menjadi istilah yang secara khusus berarti anak laki-laki.
- source_word: ἐνδυναμοῦ
  choice: hendaklah dikuatkan
  rationale: Bentuk imperatif kini medio-pasif paling mungkin menunjukkan bahwa kekuatan itu diterima, bukan dihasilkan sendiri. Bentuk ini juga selaras dengan frasa berikutnya tentang anugerah.
- source_word: ἐν τῇ χάριτι
  choice: di dalam anugerah
  rationale: “Di dalam” mempertahankan kemungkinan bahwa anugerah adalah lingkup sekaligus sarana penguatan, tanpa membatasi maknanya hanya pada salah satu nuansa.
- source_word: χάριτι
  choice: anugerah
  rationale: “Anugerah” merupakan padanan Indonesia yang lazim dan tepat untuk χάρις dalam konteks Paulus, mencakup kemurahan Allah serta kuasa yang Ia berikan.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Frasa atributif ini menjelaskan bahwa anugerah tersebut terdapat atau terikat dalam Mesias Yesus. Susunan ini mengikuti struktur Yunani sambil tetap alami dalam bahasa Indonesia.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Χριστός adalah gelar yang berarti “Yang Diurapi.” “Mesias” mempertahankan makna gelar tersebut, sedangkan “Kristus” dicatat sebagai bentuk tradisional alternatif.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Diatese dan pelaku penguatan dalam ἐνδυναμοῦ
  choice: hendaklah dikuatkan
  alternative: jadilah kuat
  rationale: Bentuk medio-pasif memungkinkan dan dalam konteks ini mendukung nuansa menerima kekuatan. Terjemahan ini tidak menjadikan perintah tersebut sebagai tuntutan untuk mengandalkan kekuatan diri sendiri, tetapi juga tidak menambahkan pelaku yang tidak disebutkan secara eksplisit.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: “Mesias” menyampaikan arti gelar Yunani Χριστός dan mempertahankan daya gelarnya. Bentuk tradisional “Kristus” tetap diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab namun bermartabat. “Engkau” dipilih untuk mempertahankan penekanan kata ganti tunggal dan cocok dengan sapaan “anakku.” Tanda baca ditata agar sapaan vokatif terbaca jelas.
