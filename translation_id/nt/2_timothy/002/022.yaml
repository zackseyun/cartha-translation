id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: id
  text: Namun, larilah dari keinginan-keinginan masa muda[a], dan kejarlah hidup benar[b], iman[c], kasih, serta damai sejahtera bersama-sama dengan mereka yang berseru kepada Tuhan dari hati yang murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "nafsu-nafsu orang muda." Ungkapan Yunani ini dapat mencakup berbagai keinginan yang khas pada masa muda, bukan hanya keinginan seksual.
    reason: lexical_alternative
  - marker: b
    text: Atau "keadilan." Kata Yunani ini dapat mencakup kelurusan moral maupun nuansa relasional atau hukum.
    reason: alternative_reading
  - marker: c
    text: Atau "kesetiaan." Kata Yunani ini dapat berarti iman, kepercayaan, atau kesetiaan, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: keinginan-keinginan masa muda
  rationale: Ungkapan ini menunjuk secara luas pada berbagai keinginan yang khas pada masa muda dan tidak membatasinya pada nafsu seksual.
- source_word: φεῦγε
  choice: larilah dari
  rationale: Imperatif ini menyampaikan tindakan menjauh yang tegas dan terus-menerus, sekaligus mempertahankan kontras yang kuat dengan 'kejarlah'.
- source_word: δίωκε
  choice: kejarlah
  rationale: Dalam nasihat etis, kata ini menyatakan usaha aktif dan berkelanjutan untuk memperoleh atau menjalankan kebajikan.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Dalam pemakaian Paulus, kata ini dapat menunjuk pada hidup yang benar di hadapan Allah dan dalam relasi dengan sesama; 'kebenaran' merupakan padanan Indonesia yang lazim, sementara nuansa 'keadilan' dicatat dalam catatan kaki.
- source_word: πίστιν
  choice: iman
  rationale: Padanan ini mempertahankan arti umum berupa iman atau kepercayaan; dalam daftar kebajikan ini, nuansa kesetiaan juga mungkin dan dicatat dalam catatan kaki.
- source_word: ἀγάπην
  choice: kasih
  rationale: Padanan baku dan alami untuk kasih yang menjadi kebajikan Kristen.
- source_word: εἰρήνην
  choice: damai sejahtera
  rationale: Ungkapan Indonesia ini secara alami mencakup kedamaian dan keadaan relasi yang utuh, sesuai dengan εἰρήνη dalam daftar kebajikan.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: bersama mereka yang berseru kepada Tuhan
  rationale: μετά dengan genitif menyatakan kebersamaan, sedangkan ἐπικαλέω menggambarkan tindakan memohon atau menyebut nama Tuhan dalam ibadah dan ketergantungan.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: dengan hati yang murni
  rationale: Walaupun ἐκ secara harfiah menandai sumber ('dari'), ungkapan Indonesia 'dengan hati yang murni' menyampaikan bahwa seruan itu berasal dari batin yang murni secara lebih alami.
theological_decisions:
- issue: Cakupan νεωτερικὰς ἐπιθυμίας
  choice: Berbagai keinginan yang khas pada masa muda, tidak terbatas pada nafsu seksual
  alternative: Terutama nafsu seksual
  rationale: Bahasa Yunani mempunyai cakupan lebih luas, dan konteks nasihat tentang watak serta perilaku tidak mengharuskan pembatasan pada seksualitas.
- issue: Makna δικαιοσύνη dalam daftar kebajikan
  choice: kebenaran
  alternative: keadilan
  rationale: Istilah Yunani dapat mencakup kelurusan moral serta dimensi relasional atau hukum. Teks utama memakai istilah Indonesia yang lazim dalam konteks Paulus tanpa meniadakan nuansa keadilan.
- issue: Makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan
  rationale: Konteks memungkinkan arti iman atau kepercayaan sekaligus sifat setia; ambiguitas yang nyata dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif 'larilah' dan 'kejarlah' mempertahankan kontras retoris sumber. 'Damai sejahtera' dipilih sebagai ungkapan Alkitabiah yang tetap mudah dipahami, sedangkan susunan penanda catatan kaki ditempatkan langsung setelah istilah terkait.
