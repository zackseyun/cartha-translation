  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: id
  text: Karena itu, aku menanggung segala sesuatu demi orang-orang pilihan[a], supaya mereka juga memperoleh keselamatan yang ada di dalam Mesias Yesus, yang disertai kemuliaan kekal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang dipilih.” Kata Yunaninya adalah ἐκλεκτούς.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “memperoleh keselamatan yang ada di dalam Mesias Yesus dengan kemuliaan kekal.”'
    reason: syntax_clarification
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menunjukkan bahwa ketabahan Paulus didasarkan pada hal yang baru disebutkan dalam konteks sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausalnya.
- source_word: πάντα ὑπομένω
  choice: aku menanggung segala sesuatu
  rationale: ὑπομένω menyatakan ketabahan di bawah kesukaran, sedangkan πάντα bersifat menyeluruh. Susunan ini ringkas, wajar, dan tetap berbobot.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: demi orang-orang pilihan
  rationale: διά dengan akusatif di sini menyatakan kepentingan atau manfaat. 'Demi' menyampaikan bahwa Paulus rela menderita bagi mereka; 'orang-orang pilihan' mempertahankan bahasa pemilihan dalam teks tanpa memasukkan sistem teologis tertentu.
- source_word: ἵνα καὶ αὐτοὶ
  choice: supaya mereka juga
  rationale: ἵνα memperkenalkan tujuan, καί memberi arti 'juga', dan αὐτοί menunjuk secara tegas kepada mereka. Terjemahan ini mempertahankan maksud klausa secara alami.
- source_word: σωτηρίας τύχωσιν
  choice: memperoleh keselamatan
  rationale: τυγχάνω dengan genitif berarti memperoleh atau mencapai. 'Memperoleh keselamatan' jelas dan tetap mempertahankan gagasan tercapainya hasil dalam klausa tujuan.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: yang ada di dalam Mesias Yesus
  rationale: Frasa berartikel ini menerangkan keselamatan. 'Di dalam' mempertahankan bahasa relasional/lokatif Paulus, sedangkan 'Mesias' menyampaikan makna gelar Χριστός.
- source_word: μετὰ δόξης αἰωνίου
  choice: beserta kemuliaan kekal
  rationale: μετά dengan genitif menyatakan penyertaan. 'Beserta' menunjukkan bahwa kemuliaan kekal menyertai keselamatan dan menghindari kesan bahwa kemuliaan merupakan alat untuk memperolehnya.
theological_decisions:
- issue: Makna ἐκλεκτούς
  choice: orang-orang pilihan
  alternative: orang-orang yang dipilih
  rationale: Kata Yunani ini sungguh memakai bahasa pemilihan. Bentuk utama mempertahankan bobot teologisnya tanpa menentukan mekanisme atau dasar pemilihan yang tidak dijelaskan dalam ayat.
- issue: Χριστός sebagai gelar atau bentuk nama yang sudah membeku
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός tetap membawa arti gelar 'Mesias' dalam frasa ini. Terjemahan utama menampilkan makna tersebut, sementara bentuk tradisional Indonesia dicatat sebagai alternatif.
- issue: Hubungan μετὰ δόξης αἰωνίου dengan keselamatan
  choice: beserta kemuliaan kekal
  alternative: dengan kemuliaan kekal
  rationale: Frasa ini paling wajar menyatakan kemuliaan kekal yang menyertai keselamatan. 'Beserta' memperjelas penyertaan, tetapi catatan mempertahankan bentuk yang lebih dekat dan memungkinkan pembaca melihat kerapatan sintaksis teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'aku' mengikuti suara pribadi Paulus. Istilah teologis dipertahankan, tetapi susunan kalimat dibuat alami; tanda koma sebelum 'beserta kemuliaan kekal' membantu membedakan dua keterangan tentang keselamatan tanpa menghapus hubungan sintaksisnya.
