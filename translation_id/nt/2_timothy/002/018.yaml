id: 2TI.2.18
reference: 2 Timothy 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: id
  text: yang telah menyimpang dari kebenaran[a] dengan mengatakan bahwa kebangkitan sudah terjadi[b], dan sedang menggoyahkan iman sebagian orang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah meleset dari sasaran mengenai kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka menyatakan bahwa kebangkitan yang masih dinantikan itu sudah berlalu.
    reason: cross_reference
  - marker: c
    text: Atau “sedang meruntuhkan iman sebagian orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: yang
  rationale: Meneruskan klausa relatif yang mengacu kepada para pengajar sesat pada ayat sebelumnya; bentuk sederhana ini alami dalam bahasa Indonesia.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: telah menyimpang dari kebenaran
  rationale: Ungkapan ini menyatakan kegagalan mencapai sasaran berkenaan dengan kebenaran, yakni penyimpangan dari ajaran yang benar. 'Menyimpang dari kebenaran' alami dan mempertahankan arah metaforis verba tersebut.
- source_word: λέγοντες
  choice: dengan mengatakan
  rationale: Partisipel ini menjelaskan bentuk atau cara penyimpangan mereka. 'Dengan mengatakan' membuat kaitannya jelas tanpa menambahkan rekonstruksi teologis.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Dalam konteks doktrinal ini kata tanpa artikel tersebut merujuk pada kebangkitan eskatologis yang dikenal, sehingga tidak perlu diberi penanda tak tentu.
- source_word: ἤδη γεγονέναι
  choice: sudah terjadi
  rationale: Infinitif perfek menyatakan peristiwa yang mereka klaim telah berlangsung, dengan relevansi pada keadaan kini; 'sudah terjadi' merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: ἀνατρέπουσιν
  choice: sedang menggoyahkan
  rationale: Verba kala kini menunjukkan dampak yang berlangsung. 'Menggoyahkan' menyampaikan tindakan merusak kestabilan iman tanpa memastikan bahwa iman itu telah sepenuhnya dihancurkan.
- source_word: τήν τινων πίστιν
  choice: iman sebagian orang
  rationale: πίστις diterjemahkan dengan istilah baku 'iman'; τινων bersifat tak tentu dan paling alami diterjemahkan 'sebagian orang'.
theological_decisions:
- issue: Makna klaim bahwa kebangkitan sudah terjadi
  choice: Mempertahankan klaim itu sebagaimana dinyatakan teks, yakni bahwa kebangkitan sudah terjadi.
  alternative: Menjelaskannya sebagai kebangkitan rohani saja atau penyangkalan terhadap kebangkitan tubuh pada masa depan.
  rationale: Ayat ini tidak memaparkan secara lengkap sistem ajaran di balik klaim tersebut. Terjemahan tidak boleh memasukkan rekonstruksi teologis yang lebih terperinci daripada teks.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan
  rationale: '''Iman'' adalah padanan baku dan paling tidak membatasi makna dalam konteks ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa relatif dipertahankan secara alami. Istilah 'kebangkitan' dan 'iman' digunakan tanpa mempersempit ketegangan teologis yang ada dalam teks Yunani.
