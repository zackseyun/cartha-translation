id: 2TI.2.7
reference: 2 Timothy 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: id
  text: Pikirkanlah apa yang kukatakan[a], sebab Tuhan[b] akan memberimu pengertian dalam segala hal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perhatikanlah apa yang kukatakan”; kata kerjanya juga dapat mengandung arti “pahamilah.”
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani tidak menjelaskan lebih lanjut siapa yang dimaksud dengan “Tuhan”; rujukannya dapat dipahami secara khusus sebagai Tuhan Yesus atau secara lebih umum sebagai Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Pikirkanlah
  rationale: Imperatif kini νοέω menyerukan perenungan aktif. “Pikirkanlah” alami dalam bahasa Indonesia dan tidak mendahului janji berikutnya bahwa Tuhan akan memberi pengertian.
- source_word: ὃ λέγω
  choice: apa yang kukatakan
  rationale: Pronomina relatif netral ὃ menunjuk pada isi perkataan Paulus, sedangkan bentuk kini λέγω wajar diterjemahkan “kukatakan” dalam konteks langsung ini.
- source_word: γάρ
  choice: sebab
  rationale: γάρ memberikan alasan atau dasar bagi perintah sebelumnya; “sebab” mempertahankan hubungan logis tersebut secara jelas.
- source_word: δώσει ... σοι
  choice: akan memberimu
  rationale: Bentuk mendatang δώσει menyatakan janji, dan datif σοι secara alami diungkapkan dengan akhiran objek “-mu”.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Terjemahan ini mempertahankan gelar κύριος tanpa menentukan apakah rujukannya secara khusus Yesus atau Allah secara lebih umum.
- source_word: σύνεσιν
  choice: pengertian
  rationale: σύνεσις menunjuk pada kemampuan memahami atau menangkap makna; “pengertian” luas, jelas, dan sesuai dengan konteks perenungan.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Ungkapan ini mempertahankan cakupan luas frasa Yunani tanpa membatasinya hanya pada ajaran atau perkara tertentu.
theological_decisions:
- issue: Rujukan gelar ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks Yunani hanya menyebut “Tuhan.” Walaupun pemakaian Paulus kerap merujuk kepada Yesus, terjemahan tidak mempersempit rujukan yang tidak dijelaskan oleh ayat itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kukatakan” dan “memberimu” menjaga kelancaran serta kedekatan nasihat pribadi, sedangkan “dalam segala hal” mempertahankan keluasan ungkapan sumber.
