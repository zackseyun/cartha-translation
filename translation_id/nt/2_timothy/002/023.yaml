  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: id
  text: Namun, hindarilah perdebatan-perdebatan yang bodoh dan tidak terpelajar[a], sebab engkau tahu bahwa semuanya itu menimbulkan pertengkaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertanyaan-pertanyaan” atau “persoalan-persoalan”. Istilah Yunani ini dapat menunjuk pada penyelidikan, tetapi di sini kemungkinan besar mengacu pada perdebatan yang bersifat memperselisihkan; “tidak terpelajar” juga dapat diterjemahkan “tidak terdidik” atau “tidak terlatih”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melahirkan” atau “memperanakkan”; ungkapan ini dipakai secara metaforis untuk menghasilkan atau menimbulkan pertengkaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: bodoh
  rationale: Kata ini menyatakan sesuatu yang tidak masuk akal atau kurang bijaksana. “Bodoh” mempertahankan daya moral-intelektualnya dengan bahasa Indonesia yang langsung dan wajar.
- source_word: ἀπαιδεύτους
  choice: yang tidak didasari pengetahuan
  rationale: Kata sifat ini menunjuk pada kurangnya pendidikan, pengajaran, atau pembinaan. Karena dalam bahasa Indonesia “persoalan yang tidak terdidik” tidak alami, frasa ini mengungkapkan bahwa persoalan tersebut muncul tanpa dasar pengetahuan yang semestinya.
- source_word: ζητήσεις
  choice: persoalan-persoalan
  rationale: Istilah ini dapat berarti pertanyaan atau penyelidikan, tetapi dalam konteks ini menunjuk pada pokok-pokok yang diperdebatkan. “Persoalan-persoalan” mempertahankan keluasan maknanya tanpa menyiratkan bahwa semua penyelidikan harus ditolak.
- source_word: παραιτοῦ
  choice: hindarilah
  rationale: Imperatif medial ini meminta Timotius menolak atau tidak melibatkan diri dalam hal-hal tersebut. “Hindarilah” alami dalam bahasa Indonesia dan tidak mengharuskan adanya penolakan formal.
- source_word: εἰδὼς
  choice: karena engkau tahu
  rationale: Partisip ini menyatakan dasar bagi perintah sebelumnya. Bentuk klausa ini lebih alami daripada terjemahan partisipial yang kaku dan mempertahankan hubungan alasannya.
- source_word: γεννῶσι
  choice: melahirkan
  rationale: Terjemahan ini mempertahankan metafora sumber tentang memperanakkan atau melahirkan suatu akibat, dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: μάχας
  choice: pertengkaran
  rationale: Dalam konteks perdebatan verbal dan relasional, “pertengkaran” lebih tepat daripada istilah yang terutama menyiratkan perkelahian fisik.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan nasihat sebelumnya. “Namun” menyampaikan peralihan itu dalam ragam yang bermartabat.
theological_decisions:
- issue: Ruang lingkup larangan terhadap ζητήσεις
  choice: Larangan diarahkan pada persoalan bodoh yang tidak didasari pengetahuan dan menghasilkan pertengkaran.
  alternative: Menerjemahkannya secara umum sebagai larangan terhadap semua pertanyaan atau penyelidikan.
  rationale: Kualifikasi μωρὰς καὶ ἀπαιδεύτους serta akibat berupa pertengkaran membatasi sasaran perintah. Terjemahan tidak boleh mengubah ayat ini menjadi penolakan terhadap penyelidikan yang tulus.
translation_notes:
  register: Bahasa Indonesia standar modern dengan sapaan tunggal “engkau” untuk mempertahankan bahwa nasihat ini ditujukan langsung kepada Timotius. Susunan kalimat dibuat alami dan bermartabat; metafora γεννῶσι dipertahankan karena jelas dalam bahasa Indonesia.
