id: 2TI.2.12
reference: 2 Timothy 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: id
  text: Jika kita tetap bertahan, kita juga akan memerintah bersama dia; jika kita menyangkal dia[a], dia pun akan menyangkal kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tidak mengakui dia; dia pun tidak akan mengakui kita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: tetap bertahan
  rationale: Kata ὑπομένω menyatakan keteguhan dalam menghadapi penderitaan atau pencobaan. “Tetap bertahan” alami dalam bahasa Indonesia modern dan tidak memasukkan istilah teologis yang lebih khusus.
- source_word: συμβασιλεύσομεν
  choice: akan memerintah bersama dia
  rationale: Kata kerja majemuk ini berarti memerintah sebagai raja bersama seseorang. Ungkapan ini mempertahankan gambaran pemerintahan bersama, sedangkan “dia” melengkapi pihak yang tersirat jelas dari konteks, yaitu Kristus.
- source_word: ἀρνησόμεθα
  choice: menyangkal dia
  rationale: ἀρνέομαι dapat berarti menyangkal, tidak mengakui, atau menolak hubungan dengan seseorang. “Menyangkal dia” ringkas, alami, dan memungkinkan pengulangan kata yang sama pada klausa berikutnya.
- source_word: κἀκεῖνος
  choice: dia pun
  rationale: Bentuk ini merupakan gabungan καὶ dan ἐκεῖνος serta menandai tanggapan yang sepadan. “Dia pun” mempertahankan kesejajaran timbal balik dengan idiom Indonesia yang wajar.
- source_word: ἀρνήσεται ἡμᾶς
  choice: akan menyangkal kita
  rationale: Pengulangan “menyangkal” mempertahankan pengulangan sengaja dari ἀρνέομαι dan daya retoris peringatannya.
theological_decisions:
- issue: Sifat peringatan dalam klausa bersyarat kedua
  choice: 'Diterjemahkan langsung sebagai peringatan nyata: “jika kita menyangkal dia, dia pun akan menyangkal kita.”'
  alternative: Menafsirkannya hanya sebagai kehilangan upah, atau sebagai kemungkinan hipotetis tanpa bobot nyata.
  rationale: Bahasa Yunani menyajikan pernyataan bersyarat yang tegas dan seimbang. Terjemahan mempertahankan kerasnya peringatan serta ketegangan teologisnya tanpa memutuskan perdebatan tentang kemurtadan, ketekunan, penghakiman akhir, atau kehilangan upah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kecil pada pronomina “dia” mengikuti bentuk gramatikal biasa dan tidak menambah pembedaan yang tidak ditandai dalam teks Yunani. Struktur dua klausa bersyarat dan kesejajaran katanya dipertahankan.
