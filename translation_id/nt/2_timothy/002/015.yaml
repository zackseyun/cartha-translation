  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: id
  text: Berusahalah sungguh-sungguh untuk menampilkan dirimu di hadapan Allah sebagai orang yang telah terbukti layak, seorang pekerja yang tidak perlu merasa malu, yang menangani dengan tepat firman kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengajarkan firman kebenaran dengan benar”; secara lebih harfiah, “memotong lurus” firman kebenaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Berusahalah sungguh-sungguh
  rationale: Imperatif aoristus ini menyerukan upaya yang tekun dan serius. Ungkapan ini alami dalam bahasa Indonesia dan lebih kuat daripada sekadar 'berusahalah'.
- source_word: σεαυτὸν ... παραστῆσαι τῷ θεῷ
  choice: untuk mempersembahkan dirimu kepada Allah
  rationale: Mempertahankan gagasan menghadapkan atau menyediakan diri kepada Allah, tanpa mempersempitnya hanya menjadi tindakan berdiri di hadapan-Nya.
- source_word: δόκιμον
  choice: sebagai orang yang telah teruji dan berkenan
  rationale: δόκιμος menunjuk kepada seseorang yang terbukti layak setelah melalui pengujian. Pasangan kata ini menyatakan baik latar pengujian maupun hasil penerimaan.
- source_word: ἐργάτην
  choice: seorang pekerja
  rationale: Padanan modern dan jelas yang mempertahankan metafora pekerjaan tanpa memakai istilah yang usang.
- source_word: ἀνεπαίσχυντον
  choice: yang tidak perlu merasa malu
  rationale: Menunjukkan bahwa pekerja itu tidak mempunyai alasan untuk dipermalukan, bukan sekadar memiliki sikap percaya diri atau tidak malu.
- source_word: ὀρθοτομοῦντα
  choice: yang menangani ... dengan tepat
  rationale: Menyampaikan arti metaforis berupa perlakuan yang benar dan cermat terhadap pesan, sambil tidak membatasinya hanya pada kegiatan mengajar. Citra harfiahnya dicatat dalam catatan kaki.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: firman kebenaran
  rationale: Mempertahankan konstruksi genitif Yunani dan ungkapan Paulus yang dikenal, serta tetap wajar dan dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ὀρθοτομοῦντα dalam konteks pelayanan
  choice: menangani firman kebenaran dengan tepat
  alternative: mengajarkan firman kebenaran dengan benar; secara lebih harfiah, memotong lurus firman kebenaran
  rationale: Kata kerja yang langka ini kemungkinan menunjuk pada perlakuan yang benar dan akurat terhadap berita kebenaran. Terjemahan utama sengaja tetap luas agar tidak menyempitkannya hanya pada pengajaran, sedangkan alternatif interpretatif dan citra harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. 'Berusahalah sungguh-sungguh' menyampaikan desakan pastoral; 'pekerja' bersifat umum dan alami; susunan kalimat mengikuti alur Yunani sejauh tetap lancar dalam bahasa Indonesia.
