id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: id
  text: Jika kita tidak setia[a], Dia tetap setia[b], sebab Dia tidak dapat menyangkal diri-Nya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika kita tidak percaya” atau “Jika kita tidak menunjukkan kesetiaan.” Kata kerja Yunani ini dapat mengandung kedua arti tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “dapat dipercaya.” Kata “setia” dipertahankan untuk menjaga kontras dengan “tidak setia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: kita tidak setia
  rationale: Ungkapan ini mempertahankan kemungkinan makna tidak percaya maupun tidak setia, sekaligus menjaga pertentangan dengan πιστός.
- source_word: πιστὸς
  choice: setia
  rationale: Pilihan ini menjaga hubungan leksikal dan kontras dengan ἀπιστοῦμεν; makna 'dapat dipercaya' tetap mungkin.
- source_word: μένει
  choice: tetap
  rationale: Bentuk ini alami dalam bahasa Indonesia modern dan menyatakan keberlangsungan sifat setia-Nya.
- source_word: ἀρνήσασθαι
  choice: menyangkal
  rationale: Ini padanan langsung yang mempertahankan daya relasional dan moral kata Yunani tersebut.
- source_word: ἑαυτὸν
  choice: diri-Nya sendiri
  rationale: Bentuk refleksif ini dengan jelas merujuk kembali kepada Dia dan menegaskan bahwa kesetiaan-Nya berakar pada jati diri-Nya.
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Ungkapan ini menyatakan ketidakmungkinan, bukan sekadar ketidakmauan.
theological_decisions:
- issue: Arti kesetiaan Allah ketika manusia tidak setia
  choice: Ayat ini menyatakan bahwa Dia tetap setia karena tidak dapat menyangkal diri-Nya sendiri, tanpa menentukan apakah kesetiaan itu terutama menunjuk pada penyelamatan, penggenapan janji, atau pelaksanaan penghakiman.
  alternative: Dia tetap setia untuk menyelamatkan umat-Nya meskipun mereka lemah; atau Dia setia kepada firman-Nya, termasuk peringatan penghakiman atas kemurtadan.
  rationale: Teks Yunani menegaskan keteguhan-Nya, tetapi tidak menyelesaikan implikasi pastoral dan teologis yang diperdebatkan. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Susunan klausa mempertahankan paralelisme dan kontras teks Yunani.
