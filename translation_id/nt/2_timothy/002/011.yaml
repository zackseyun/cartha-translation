id: 2TI.2.11
reference: 2 Timothy 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: id
  text: 'Perkataan ini dapat dipercaya:[a]


    Sebab jika kita telah mati bersama Dia,[b]

    kita juga akan hidup bersama Dia.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perkataan ini pasti” atau “Pernyataan ini dapat diandalkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mati bersama”; kata kerja Yunani menyiratkan kematian bersama Kristus.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “akan hidup bersama Dia” dapat menunjuk pada kehidupan kebangkitan bersama Kristus, partisipasi dalam hidup-Nya, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: dapat dipercaya
  rationale: Sebagai adjektiva predikatif yang menerangkan λόγος, frasa ini menyatakan bahwa perkataan tersebut andal dan layak diterima. 'Dapat dipercaya' alami dalam bahasa Indonesia modern dan tidak menggeser maknanya menjadi kesetiaan pribadi.
- source_word: ὁ λόγος
  choice: perkataan ini
  rationale: Dalam surat-surat Pastoral, πιστὸς ὁ λόγος merupakan rumusan yang memperkenalkan pernyataan ringkas dan mudah diingat. 'Perkataan ini' lebih idiomatis daripada terjemahan harfiah 'firman itu' dan cocok dengan isi yang langsung menyusul.
- source_word: εἰ γὰρ
  choice: sebab jika
  rationale: '''Jika'' mempertahankan bentuk syarat εἰ, sedangkan ''sebab'' mempertahankan fungsi penjelas γάρ yang menghubungkan rumusan pembuka dengan isi pernyataan.'
- source_word: συναπεθάνομεν
  choice: kita telah mati bersama Dia
  rationale: Verba aoris συναποθνῄσκω mengandung unsur συν- yang menyatakan kematian bersama pihak lain. 'Telah mati' menyampaikan tindakan yang dipandang telah terjadi tanpa memaksakan rincian waktunya; 'bersama Dia' mengungkapkan relasi yang tersirat, dengan Kristus sebagai rujukan kontekstual.
- source_word: καὶ
  choice: juga
  rationale: 'Di sini καί memasangkan kedua klausa dan menegaskan korespondensi: mati bersama Dia dan juga hidup bersama Dia.'
- source_word: συζήσομεν
  choice: kita juga akan hidup bersama Dia
  rationale: Bentuk futurum συζάω menyatakan hidup bersama, dengan unsur συν- menunjukkan partisipasi bersama Kristus. Terjemahan ini mempertahankan orientasi masa depan tanpa mempersempit jenis kehidupan yang dimaksud.
theological_decisions:
- issue: Rujukan tersirat dalam kedua verba majemuk berawalan συν-
  choice: Menambahkan 'bersama Dia' pada kedua verba, dengan 'Dia' merujuk kepada Kristus.
  alternative: 'Membiarkannya tersirat: ''jika kita telah mati, kita juga akan hidup.'''
  rationale: Teks Yunani tidak menyebut objek secara terpisah, tetapi unsur συν- pada kedua verba menyatakan partisipasi bersama seseorang. Konteks yang berpusat pada Kristus menunjukkan bahwa Kristuslah rujukannya. Penambahan ini menjelaskan makna gramatikal, bukan memasukkan ajaran baru.
- issue: Nuansa waktu dan teologis dari hidup bersama Kristus
  choice: Memakai ungkapan luas 'akan hidup bersama Dia' tanpa menentukan lebih lanjut.
  alternative: Menafsirkannya secara khusus hanya sebagai kehidupan kebangkitan pada masa depan, atau hanya sebagai partisipasi rohani sekarang.
  rationale: Bentuk futurum mendukung arah masa depan, tetapi ayat ini sendiri tidak menguraikan apakah yang terutama dimaksud ialah hidup dalam kebangkitan bersama Kristus atau cakupan partisipasi yang lebih luas dalam hidup-Nya. Terjemahan mempertahankan keluasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Susunan dua baris mempertahankan kesejajaran rumusan yang kemungkinan bersifat puitis atau seperti pengakuan iman. Huruf kapital pada 'Dia' mengikuti konvensi Indonesia untuk rujukan ilahi dan memperjelas rujukan kontekstual tanpa menyebut nama yang tidak eksplisit dalam ayat.
