  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: id
  text: Apa yang telah kaudengar dariku di hadapan banyak saksi[a], percayakanlah kepada orang-orang yang setia[b], yang juga akan cakap mengajar orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di depan banyak saksi.” Frasa Yunani ini mungkin menekankan bahwa ajaran Paulus disampaikan secara terbuka sementara banyak saksi hadir; kemungkinan lain, meski kurang kuat, ialah “melalui banyak saksi.”
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani berbentuk maskulin dan dapat diterjemahkan “laki-laki yang setia”; namun kata yang dipakai juga dapat merujuk kepada orang secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: apa yang telah kaudengar dariku
  rationale: Ungkapan ini menunjuk pada isi ajaran yang sebelumnya diterima Timotius dari Paulus. Bentuk ringkas ini alami dalam bahasa Indonesia dan tetap menyatakan Paulus sebagai sumbernya.
- source_word: διὰ πολλῶν μαρτύρων
  choice: di hadapan banyak saksi
  rationale: διά dengan genitif dapat menyatakan perantaraan atau keadaan yang menyertai. Dalam konteks ini, frasa tersebut paling mungkin menggambarkan pengajaran Paulus sebagai sesuatu yang disampaikan secara terbuka dengan banyak saksi hadir, sambil mempertahankan alternatif dalam catatan kaki.
- source_word: ταῦτα παράθου
  choice: percayakanlah
  rationale: παράθου adalah imperatif yang menggambarkan penyerahan sesuatu ke dalam tanggung jawab pihak lain. Objeknya sudah dinyatakan dalam klausa pembuka, sehingga tidak perlu diulang secara kaku dalam bahasa Indonesia.
- source_word: πιστοῖς ἀνθρώποις
  choice: kepada orang-orang yang setia
  rationale: πιστός di sini menekankan kesetiaan atau keterandalan dalam meneruskan ajaran. ἄνθρωπος dapat merujuk secara umum kepada manusia; bahasa Indonesia secara alami memakai 'orang-orang', sementara bentuk maskulin Yunani dan kemungkinan terjemahan 'laki-laki' dijelaskan dalam catatan kaki.
- source_word: ἱκανοὶ ἔσονται
  choice: akan cakap
  rationale: Bentuk masa depan dipertahankan dengan 'akan', sedangkan 'cakap' menyatakan kemampuan atau kecukupan untuk menjalankan tugas mengajar.
- source_word: καὶ ἑτέρους διδάξαι
  choice: juga akan cakap mengajar orang lain
  rationale: καί dipertahankan sebagai 'juga', dan ἑτέρους diterjemahkan secara alami sebagai 'orang lain'.
theological_decisions:
- issue: Cakupan gender dalam πιστοῖς ἀνθρώποις
  choice: orang-orang yang setia
  alternative: laki-laki yang setia
  rationale: ἄνθρωπος dapat dipakai secara generik, walaupun frasa Yunani ini berbentuk maskulin jamak. Terjemahan utama tidak mempersempit cakupannya melebihi kepastian teks, sedangkan kemungkinan rujukan khusus kepada laki-laki dicatat agar bentuk sumber tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Bentuk 'kaudengar' menjaga kelancaran dan kedekatan nasihat pribadi, sedangkan 'percayakanlah' mempertahankan nuansa tanggung jawab untuk menjaga dan meneruskan ajaran.
