  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: id
  text: Dalam sebuah rumah besar tidak hanya terdapat bejana-bejana dari emas dan perak, tetapi juga bejana-bejana dari kayu dan tembikar[a]; sebagian untuk kehormatan, sedangkan sebagian lainnya untuk kehinaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah bejana yang dibuat dari tanah liat bakar, yaitu tembikar.
    reason: cultural_note
  - marker: b
    text: Atau, “sebagian untuk penggunaan yang terhormat, sedangkan sebagian lainnya untuk penggunaan yang hina.” Secara lebih harfiah, teks Yunani berbunyi “untuk kehormatan ... untuk kehinaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: sebuah rumah besar
  rationale: Ungkapan ini menyatakan rumah yang besar, kemungkinan juga rumah tangga berkedudukan, tetapi terjemahan utama mempertahankan gambaran ukurannya tanpa menambahkan penafsiran status.
- source_word: σκεύη
  choice: bejana-bejana
  rationale: Kata ini dapat menunjuk beragam benda atau wadah untuk suatu kegunaan. 'Bejana-bejana' mempertahankan gambaran rumah tangga dan keluasan metaforanya dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: dari emas dan perak
  rationale: Kedua adjektiva menunjukkan bahan pembuatannya; konstruksi 'dari emas dan perak' alami dalam bahasa Indonesia.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: dari kayu dan tanah liat
  rationale: ξύλινα berarti terbuat dari kayu, sedangkan ὀστράκινα berarti terbuat dari tanah liat bakar atau tembikar. 'Tanah liat' jelas bagi pembaca modern dan catatan kaki mempertajam maknanya.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: sebagian ... sedangkan sebagian lainnya ...
  rationale: Konstruksi korelatif ini membedakan dua kelompok secara kontras; 'sedangkan' menyampaikan kontras itu secara alami.
- source_word: εἰς τιμήν
  choice: untuk kehormatan
  rationale: Terjemahan ini mempertahankan nomina abstrak τιμή dan tidak langsung membatasi ungkapan itu menjadi fungsi praktis tertentu.
- source_word: εἰς ἀτιμίαν
  choice: untuk kehinaan
  rationale: Pilihan ini menjaga pertentangan leksikal dengan 'kehormatan' dan mempertahankan ketegangan metaforis yang berlanjut ke ayat berikutnya.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai kelanjutan atau peralihan wacana. Dalam bahasa Indonesia, alur tersebut cukup ditanggung oleh susunan kalimat; menambahkan 'namun' akan terlalu memperkuat pertentangan.
theological_decisions:
- issue: Apakah τιμή/ἀτιμία harus dijelaskan secara fungsional sebagai penggunaan terhormat/hina atau dipertahankan sebagai kehormatan/kehinaan
  choice: untuk kehormatan ... untuk kehinaan
  alternative: untuk penggunaan yang terhormat ... untuk penggunaan yang hina
  rationale: Teks Yunani memakai nomina abstrak τιμή dan ἀτιμία. Terjemahan utama mempertahankan bentuk dan ketegangan retoris itu agar hubungan metaforis dengan ayat berikutnya tidak diselesaikan secara prematur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan 'bejana-bejana' memperjelas bahwa semua bahan masih termasuk dalam kategori yang sama. Tanda titik koma membantu pembaca mengikuti satu kalimat Yunani yang memuat peralihan dari bahan bejana kepada kehormatan atau kehinaannya.
