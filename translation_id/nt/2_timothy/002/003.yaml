  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: id
  text: Ikutlah menanggung penderitaan sebagai seorang prajurit yang baik bagi Mesias Yesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tanggunglah kesukaran bersama aku sebagai seorang prajurit yang baik bagi Mesias Yesus.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “Kristus Yesus”; di sini diterjemahkan “Mesias Yesus” karena Χριστός berfungsi sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Ikutlah menanggung penderitaan
  rationale: Bentuk imperatif aoris aktif orang kedua tunggal ini memerintahkan Timotius untuk turut mengambil bagian dalam penderitaan. Awalan συν- menyatakan kebersamaan, tetapi objek seperti “bersama aku” tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ὡς
  choice: sebagai
  rationale: Partikel perbandingan ini memperkenalkan peran atau cara Timotius ikut menanggung penderitaan.
- source_word: καλὸς
  choice: yang baik
  rationale: Dalam hubungan dengan “prajurit”, kata ini menyatakan mutu yang terpuji atau kelayakan. “Yang baik” alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: στρατιώτης
  choice: prajurit
  rationale: Padanan lazim bagi seorang anggota militer dan tetap jelas dalam pemakaian metaforis Paulus.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar dalam konstruksi genitif bersama nama Yesus. “Mesias” menerjemahkan makna gelar tersebut.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk genitif dari nama Ἰησοῦς; ditransliterasikan dengan bentuk baku bahasa Indonesia, “Yesus”.
theological_decisions:
- issue: Penerjemahan Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Ungkapan Yunani memadukan gelar Χριστός dengan nama pribadi Ἰησοῦς. “Mesias Yesus” mempertahankan nilai gelar Χριστός, sedangkan “Kristus Yesus” dicatat sebagai bentuk gerejawi yang lebih lazim.
- issue: Pihak yang turut menderita bersama Timotius
  choice: Tidak menyebutkan “bersama aku” dalam teks utama
  alternative: Tanggunglah kesukaran bersama aku
  rationale: Awalan συν- pada συγκακοπάθησον menunjukkan partisipasi bersama, tetapi ayat ini tidak menyatakan objeknya secara eksplisit. Terjemahan utama mempertahankan ketidaktersuratannya; kemungkinan bahwa Paulus adalah pihak yang dimaksud dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ikutlah menanggung penderitaan” menyampaikan baik daya imperatif maupun unsur kebersamaan tanpa menambahkan pihak yang tidak disebutkan dalam teks Yunani. Susunan “prajurit yang baik dari Mesias Yesus” dipertahankan agar sifat “baik” jelas menerangkan “prajurit”.
