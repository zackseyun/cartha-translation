id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: id
  text: Ingatlah Yesus Sang Mesias[a], yang telah dibangkitkan dari antara orang mati, keturunan Daud[b], sesuai dengan Injilku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Kristus” atau “Mesias.” Di sini “Mesias” dipakai untuk mempertahankan makna gelar tersebut, terutama karena dikaitkan dengan keturunan Daud.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “dari benih Daud.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Ingatlah
  rationale: Bentuk imperatif kini ini menyerukan tindakan yang terus dijalankan. “Ingatlah” merupakan perintah yang alami dalam bahasa Indonesia dan dalam konteks ini mencakup makna terus mengingat atau tetap mengingat.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar yang maknanya “Mesias,” terutama dalam kaitannya dengan kebangkitan dan garis keturunan Daud. “Sang” menandai gelar itu secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐγηγερμένον
  choice: yang telah dibangkitkan
  rationale: Partisip perfek pasif menunjukkan bahwa Yesus telah dibangkitkan dan tetap berada dalam keadaan hidup sesudah kebangkitan. Bentuk pasif “telah dibangkitkan” mempertahankan arah tindakan dalam bahasa Yunani.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: 'Ungkapan ini menyampaikan arti harfiah dan lazim dari frasa kebangkitan tersebut: keluar dari antara mereka yang mati.'
- source_word: ἐκ σπέρματος Δαυίδ
  choice: keturunan Daud
  rationale: Dalam konteks silsilah, σπέρμα berarti benih dalam arti keturunan. “Keturunan Daud” alami dalam bahasa Indonesia dan mempertahankan penekanan pada garis Daud.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: sesuai dengan Injilku
  rationale: κατά menyatakan kesesuaian dengan suatu patokan. Bentuk “Injilku” mempertahankan kata ganti milik Paulus tanpa menambahkan penafsiran bahwa ia memberitakan Injil yang berbeda.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks kebangkitan dan keturunan Daud, Χριστός menonjol sebagai gelar mesianik. Catatan kaki mempertahankan padanan tradisional “Kristus” sebagai kemungkinan terjemahan.
- issue: Daya aspek dan bentuk pasif ἐγηγερμένον
  choice: yang telah dibangkitkan
  alternative: yang telah bangkit
  rationale: Pilihan pasif mempertahankan bentuk sumber, sedangkan “telah” menyampaikan keadaan yang dihasilkan oleh tindakan kebangkitan tanpa menjelaskan secara eksplisit pelakunya.
- issue: Makna “Injilku”
  choice: Injilku
  alternative: Injil yang kuberitakan
  rationale: Kata ganti μου diterjemahkan langsung sebagai “-ku.” Teks tidak perlu diperluas untuk menentukan apakah kepemilikan itu merujuk pada pemberitaan, amanat, atau hubungan lain, sehingga ketegangan aslinya tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan frasa dibuat ringkas agar tetap mencerminkan deretan keterangan dalam teks Yunani. Istilah “Injil” dikapitalisasi sebagai sebutan bagi kabar baik yang diberitakan Paulus.
