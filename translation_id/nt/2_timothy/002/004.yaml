base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: id
  text: Tidak seorang pun yang sedang bertugas sebagai prajurit menjeratkan dirinya dalam urusan kehidupan sehari-hari[a], supaya ia menyenangkan orang yang telah merekrutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kegiatan sipil.” Bahasa Yunani mengontraskan tugas militer dengan urusan atau kegiatan kehidupan biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Tidak seorang pun
  rationale: Menyampaikan daya universal pronomina negatif dengan ungkapan Indonesia yang alami dan tidak membatasi gender.
- source_word: στρατευόμενος
  choice: yang sedang bertugas sebagai prajurit
  rationale: Mempertahankan nuansa kegiatan militer yang sedang berlangsung dalam bentuk partisipel, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐμπλέκεται
  choice: membiarkan dirinya terjerat
  rationale: Mempertahankan gambaran hidup tentang keterjeratan yang menghambat kebebasan bertindak. Bentuk ini juga cocok dengan prinsip umum yang menggambarkan apa yang tidak dilakukan seorang prajurit.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: dalam urusan kehidupan sehari-hari
  rationale: πραγματείαις menunjuk pada kesibukan, usaha, atau urusan, sedangkan βίος di sini menunjuk pada kehidupan biasa atau mata pencaharian. Pilihan ini menyampaikan kontras dengan tugas militer tanpa mempersempitnya hanya menjadi urusan bisnis.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan secara jelas dan alami.
- source_word: τῷ στρατολογήσαντι
  choice: orang yang telah merekrutnya
  rationale: Menerjemahkan partisipel aoris στρατολογέω secara transparan tanpa memasukkan pangkat atau jabatan militer yang tidak dinyatakan dalam teks Yunani.
- source_word: ἀρέσῃ
  choice: ia menyenangkan
  rationale: Menyampaikan tujuan dari bentuk subjungtif sesudah ἵνα dengan bahasa Indonesia yang langsung dan wajar.
theological_decisions:
- issue: Cakupan metafora militer
  choice: Mempertahankan gambaran seorang prajurit yang menghindari keterjeratan dalam urusan kehidupan biasa agar menyenangkan pihak yang merekrutnya.
  alternative: Menafsirkan ayat secara langsung sebagai larangan khusus atas pekerjaan sekuler atau sebagai pernyataan umum tentang prioritas pelayanan.
  rationale: Teks menyampaikan nasihat melalui metafora militer. Terjemahan mempertahankan metafora dan ketegangannya tanpa menetapkan penerapan doktrinal yang lebih sempit daripada yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Istilah “prajurit,” “terjerat,” dan “merekrut” mempertahankan kesatuan metafora militer, sedangkan catatan kaki menyajikan alternatif yang lebih eksplisit tanpa memasukkannya ke dalam teks utama.
