  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγος
  choice: perkataan
  rationale: Dalam konteks ajaran sesat dan omongan yang tidak suci (ay. 16, 18), kata ini menunjuk pada apa yang mereka katakan atau ajarkan. “Perkataan” cukup luas untuk mempertahankan kemungkinan makna ujaran, pembicaraan, atau pesan.
- source_word: αὐτῶν
  choice: mereka
  rationale: 'Genitif posesif yang secara langsung menerangkan λόγος: “perkataan mereka.”'
- source_word: ὡς γάγγραινα
  choice: seperti gangren
  rationale: γάγγραινα menunjuk pada gangren, penyakit jaringan yang menjalar dan merusak. Padanan langsung ini mempertahankan gambaran medis teks tanpa menggantinya dengan “kanker.”
- source_word: νομὴν ἕξει
  choice: akan menjalar
  rationale: Ungkapan ini secara harfiah berarti kira-kira “akan mendapat ruang/jalan,” tetapi bersama gambaran gangren menyatakan penyebaran yang merusak. “Akan menjalar” alami dalam bahasa Indonesia dan mempertahankan daya metaforanya.
- source_word: ὧν ἐστιν
  choice: Di antara mereka terdapat
  rationale: Konstruksi relatif ini menyebut Himeneus dan Filetus sebagai anggota atau contoh dari kelompok yang baru disebut.
- source_word: Ὑμέναιος
  choice: Himeneus
  rationale: Transliterasi nama Yunani yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Φίλητος
  choice: Filetus
  rationale: Transliterasi nama Yunani yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis gambaran penyakit
  choice: Ajaran atau perkataan yang merusak digambarkan menjalar seperti gangren.
  alternative: Menerjemahkan idiom secara lebih harfiah sebagai “akan mendapat jalan/ruang.”
  rationale: “Akan menjalar” menyampaikan gerak penyebaran yang terkandung dalam idiom dan cocok dengan citra gangren, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menjalar” dipilih karena lazim digunakan untuk penyakit maupun pengaruh buruk. Tanda koma penutup dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya.
