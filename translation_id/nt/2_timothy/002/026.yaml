id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: id
  text: dan supaya mereka sadar kembali dan terlepas dari jerat Iblis, mereka yang telah ditangkap hidup-hidup olehnya[b] untuk melakukan kehendaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang telah ditawan olehnya untuk melakukan kehendak Dia itu.” Sebagian orang memahami “Dia itu” sebagai Allah, bukan Iblis.
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “ditangkap hidup-hidup” juga dapat diterjemahkan secara lebih umum sebagai “ditawan”, tetapi kata Yunani tersebut secara khusus menyiratkan penangkapan dalam keadaan hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: dapat sadar kembali
  rationale: Kata ini secara harfiah menggambarkan pulih dari keadaan mabuk, lalu secara kiasan berarti kembali berpikir jernih. 'Sadar kembali' alami dalam bahasa Indonesia dan cocok dengan konteks pertobatan serta lepas dari penyesatan.
- source_word: παγίδος
  choice: jerat
  rationale: '''Jerat'' mempertahankan gambaran perangkap yang menangkap korbannya dan lazim digunakan secara kiasan dalam bahasa Indonesia.'
- source_word: διαβόλου
  choice: Iblis
  rationale: Dalam konteks ini διάβολος berfungsi sebagai sebutan pribadi bagi lawan ilahi; 'Iblis' merupakan padanan Indonesia yang baku dan alami.
- source_word: ἐζωγρημένοι
  choice: setelah ditangkap hidup-hidup
  rationale: ζωγρέω secara khusus berarti menangkap dalam keadaan hidup. Bentuk partisipel perfek pasif menyatakan penangkapan sebelumnya yang menghasilkan keadaan tertawan; 'setelah ditangkap hidup-hidup' mempertahankan unsur leksikal dan hubungan keadaannya.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: Anteseden terdekat adalah Iblis. Bentuk pronominal mempertahankan struktur Yunani tanpa mengulang nomina secara tidak perlu.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: untuk melakukan kehendaknya
  rationale: Ungkapan ini menyampaikan arah atau tujuan penawanan. 'Untuk melakukan kehendaknya' lebih jelas dan alami dalam bahasa Indonesia daripada terjemahan harfiah 'bagi kehendaknya', sambil tetap membiarkan rujukan pronomina dijelaskan dalam catatan.
theological_decisions:
- issue: Rujukan ἐκείνου dalam εἰς τὸ ἐκείνου θέλημα
  choice: 'Kata ganti dipahami merujuk kepada Iblis: ''untuk melakukan kehendaknya''.'
  alternative: Kata ganti dapat dipahami merujuk kepada Allah, sehingga orang-orang itu ditangkap oleh Iblis tetapi kemudian diarahkan kepada kehendak Allah.
  rationale: Iblis adalah anteseden terdekat dan pembacaan ini menghasilkan alur sintaksis yang paling langsung. Namun, karena rujukan ἐκείνου telah lama diperdebatkan dan bentuk Yunani memang memungkinkan pembacaan lain, ketegangan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir sebagai kelanjutan ayat sebelumnya. 'Terlepas dari jerat' mengungkapkan ἐκ secara alami; penanda catatan ditempatkan tepat sesudah unsur yang dijelaskannya.
