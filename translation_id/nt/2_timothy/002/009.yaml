id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: id
  text: Karena Injil itulah aku menderita[a], bahkan sampai dibelenggu seperti seorang penjahat[b]. Namun, firman Allah tidak terbelenggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalamnya”; dapat juga berarti “karena hal itu.” Frasa Yunani ini kemungkinan merujuk kembali kepada Injil yang disebut dalam ayat sebelumnya.
    reason: alternative_reading
  - marker: b
    text: Atau “seperti seorang pelaku kejahatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Karena Injil itulah
  rationale: Frasa relatif ini kemungkinan besar merujuk kembali kepada Injil dalam ayat 8 dan menyatakan sebab atau dasar penderitaan. Penyebutan ulang 'Injil' membuat rujukannya jelas dan alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan nuansa harfiahnya.
- source_word: κακοπαθῶ
  choice: aku menderita
  rationale: Bentuk kini menyatakan penderitaan yang sedang dialami. 'Aku menderita' alami, ringkas, dan cukup mencakup makna mengalami kesukaran atau perlakuan buruk.
- source_word: μέχρι δεσμῶν
  choice: bahkan sampai dibelenggu
  rationale: μέχρι menyatakan batas atau tingkat, sedangkan δεσμά mengacu pada belenggu dan secara metonimis pada pemenjaraan. Ungkapan ini mempertahankan gambaran konkret sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ὡς κακοῦργος
  choice: seperti seorang penjahat
  rationale: κακοῦργος dapat berarti penjahat atau orang yang berbuat jahat. Dalam konteks belenggu dan pemenjaraan, 'penjahat' menyampaikan nuansa hukum dengan jelas.
- source_word: ἀλλὰ
  choice: Namun
  rationale: Kata ini menandai pertentangan kuat antara keadaan Paulus yang terbelenggu dan firman Allah yang tidak dapat diperlakukan demikian.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan baku ini mempertahankan keluasan λόγος, yang dalam konteks terutama menunjuk pada berita yang diberitakan tanpa mempersempitnya secara eksplisit menjadi Kitab Suci atau Injil saja.
- source_word: οὐ δέδεται
  choice: tidak terbelenggu
  rationale: Bentuk perfektif pasif menggambarkan keadaan tidak terikat. 'Tidak terbelenggu' mempertahankan metafora dan menciptakan kaitan verbal yang kuat dengan belenggu Paulus.
theological_decisions:
- issue: Cakupan makna 'firman Allah'
  choice: firman Allah
  alternative: berita Injil; Kitab Suci
  rationale: Konteks langsung terutama mengarah pada pemberitaan Injil, tetapi frasa Yunani lebih luas. Terjemahan tidak membatasi rujukannya melampaui yang dinyatakan teks.
- issue: Rujukan ἐν ᾧ
  choice: Karena Injil itulah
  alternative: di dalamnya; karena hal itu
  rationale: Anteseden yang paling mungkin ialah Injil pada ayat 8. Catatan kaki mempertahankan bentuk dan nuansa alternatif frasa Yunani agar hubungan sebab atau lingkup tidak dipastikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus. Pengulangan akar makna pada 'dibelenggu' dan 'terbelenggu' sengaja dipertahankan untuk menonjolkan kontras retoris teks Yunani.
