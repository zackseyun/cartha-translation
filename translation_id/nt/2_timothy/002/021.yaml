id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: id
  text: Karena itu, jika seseorang membersihkan dirinya dari hal-hal ini, ia akan menjadi bejana untuk keperluan yang mulia[a], yang dikuduskan[b], berguna bagi Sang Tuan, dan disiapkan untuk setiap pekerjaan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk kehormatan”; dapat juga berarti “untuk pemakaian yang terhormat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dijadikan kudus” atau “dikhususkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Karena itu, jika
  rationale: ἐὰν menyatakan syarat, sedangkan οὖν menarik kesimpulan dari konteks sebelumnya. Susunan ini mempertahankan keduanya secara wajar dalam bahasa Indonesia.
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu ini bersifat umum dan tidak khusus menunjuk laki-laki.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: menyucikan dirinya
  rationale: ἐκκαθαίρω berarti membersihkan atau menyingkirkan kenajisan secara tuntas; bentuk refleksif ἑαυτόν dipertahankan dengan 'dirinya'. 'Menyucikan' sesuai dengan gambaran bejana sekaligus konteks moral.
- source_word: ἀπὸ τούτων
  choice: dari hal-hal ini
  rationale: Ungkapan ini menunjuk kembali kepada konteks dekat tanpa menentukan secara sempit apakah yang dimaksud terutama orang, ajaran, atau perilaku tercela.
- source_word: σκεῦος
  choice: bejana
  rationale: Dalam gambaran rumah tangga dari ayat sebelumnya, 'bejana' mempertahankan metafora benda atau perkakas rumah tangga dengan lebih baik daripada 'alat'.
- source_word: εἰς τιμήν
  choice: untuk keperluan yang mulia
  rationale: Frasa ini berlawanan dengan εἰς ἀτιμίαν pada ayat sebelumnya dan mengungkapkan peruntukan yang terhormat. Bentuk yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: ἡγιασμένον
  choice: yang dikuduskan
  rationale: Partisipel perfektif pasif ini menggambarkan keadaan yang dihasilkan oleh tindakan menguduskan atau mengkhususkan.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: berguna bagi Sang Tuan
  rationale: εὔχρηστος berarti berguna atau layak dipakai, sedangkan δεσπότης menyatakan tuan yang berwenang atas rumah tangga. 'Sang Tuan' mempertahankan metafora sekaligus kemungkinan rujukan ilahi.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: disiapkan untuk setiap pekerjaan baik
  rationale: Terjemahan ini mempertahankan cakupan πᾶν dan ungkapan Paulus yang luas tentang segala pekerjaan yang baik.
theological_decisions:
- issue: Acuan ἀπὸ τούτων
  choice: hal-hal ini
  alternative: orang-orang semacam ini; perkara-perkara ini
  rationale: Bentuk netral jamak dapat menunjuk kepada perkara yang baru dibicarakan, tetapi konteks juga memuat gambaran tentang orang. Terjemahan tidak mempersempit acuan yang dibiarkan terbuka oleh teks.
- issue: Makna pengudusan dalam ἡγιασμένον
  choice: dikuduskan
  alternative: dijadikan kudus; dikhususkan
  rationale: ‘Dikuduskan’ mempertahankan baik nuansa kekudusan maupun keadaan terpisah bagi suatu tujuan, tanpa memilih salah satu aspek secara eksklusif.
- issue: Rujukan dan gelar δεσπότης
  choice: Sang Tuan
  alternative: pemilik; tuan
  rationale: Dalam metafora rumah tangga, kata ini menyatakan pemilik atau tuan yang berwenang. Kapitalisasi mengakui rujukan ilahi yang kuat dalam konteks tanpa mengganti metafora dengan gelar teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora bejana rumah tangga dipertahankan. 'Hal-hal ini' sengaja tidak diperjelas agar keluasan acuan Yunani tetap terjaga; 'Sang Tuan' menjaga nuansa kewenangan dalam metafora dan kemungkinan rujukan kepada Allah.
