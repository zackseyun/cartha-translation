id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: id
  text: Namun, hamba Tuhan[a] tidak boleh bertengkar, melainkan harus bersikap lemah lembut terhadap semua orang, cakap mengajar, dan sabar ketika diperlakukan buruk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak Tuhan.” Kata Yunani doulos dapat berarti “hamba” atau “budak,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον (δοῦλος)
  choice: hamba
  rationale: Dalam konteks petunjuk pelayanan, 'hamba' secara alami menyatakan orang yang mengabdi kepada Tuhan, sambil tetap mempertahankan unsur ketundukan dalam δοῦλος.
- source_word: κυρίου (κύριος)
  choice: Tuhan
  rationale: Bentuk genitif ini paling alami menjadi 'hamba Tuhan'; 'Tuhan' merupakan padanan baku dan sesuai konteks bagi κύριος.
- source_word: οὐ δεῖ
  choice: tidak boleh
  rationale: δεῖ menyatakan keharusan atau kewajiban; bersama οὐ, frasa ini menyampaikan larangan yang bersifat normatif.
- source_word: μάχεσθαι (μάχομαι)
  choice: bertengkar
  rationale: Dalam konteks perselisihan dan pengajaran, kata ini terutama menunjuk pada pertikaian yang penuh permusuhan, bukan semata-mata perkelahian fisik.
- source_word: ἤπιον (ἤπιος)
  choice: bersikap lemah lembut
  rationale: Ungkapan ini menyampaikan watak yang halus dan tidak kasar, sebagai lawan dari sikap suka bertengkar.
- source_word: πρὸς πάντας
  choice: terhadap semua orang
  rationale: Padanan ini mempertahankan arah relasional πρός dan cakupan universal πάντας dalam bahasa Indonesia yang wajar.
- source_word: διδακτικόν (διδακτικός)
  choice: cakap mengajar
  rationale: Kata ini berarti memiliki kemampuan atau kecakapan untuk mengajar, bukan 'mau diajar'.
- source_word: ἀνεξίκακον (ἀνεξίκακος)
  choice: sabar ketika diperlakukan buruk
  rationale: 'Padanan ini menjelaskan makna kata yang langka tersebut: menanggung perlakuan jahat atau menyakitkan dengan sabar tanpa membalas.'
theological_decisions:
- issue: Pemaknaan δοῦλος dalam konteks petunjuk pelayanan
  choice: hamba
  alternative: budak
  rationale: Ayat ini menekankan perilaku orang yang melayani Tuhan. 'Hamba' menyampaikan relasi pengabdian dan ketundukan secara alami dalam bahasa Indonesia, sedangkan 'budak' tetap dicatat karena merupakan kemungkinan leksikal yang lebih menonjolkan status kepemilikan.
- issue: Pemaknaan κύριος
  choice: Tuhan
  alternative: tuan
  rationale: Dalam rujukan kepada Kristus atau Tuhan dalam konteks surat ini, 'Tuhan' adalah padanan baku; 'tuan' akan lebih menonjolkan hubungan sosial manusiawi yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Namun' mempertahankan hubungan kontras δέ dengan konteks sebelumnya. Susunan sifat dibuat sejajar dan alami tanpa menghilangkan daya normatif ayat.
