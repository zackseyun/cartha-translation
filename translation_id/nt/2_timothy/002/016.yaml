  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan kontras δέ, larangan περιΐστασο, serta bobot religius βέβηλος dan ἀσέβεια. Namun, “terjerumus” menambahkan gambaran kejatuhan/tersandung yang tidak tersurat dalam προκόπτω, yang secara ironis berarti ‘maju/berkembang’. Frasa eksplisit “orang-orang yang melakukannya” juga mempersempit subjek jamak tersirat lebih daripada teks Yunani.
  naturalness: “Omongan kosong” dan “hindarilah” alami dalam bahasa Indonesia modern. “Akan makin maju dalam kefasikan” mempertahankan ironi verba sumber dan tetap dapat dipahami dalam register bermartabat. “Mereka” mempertahankan subjek tersirat tanpa menambahkan penjelasan yang tidak perlu.
  terminology: “Tidak suci” merupakan padanan ringkas dan setia untuk βεβήλους dalam konteks ini; “kefasikan” memadai untuk ἀσεβείας dan mempertahankan dimensi religius-moral. Alternatif pada catatan kaki tetap berguna.
