  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: id
  text: Namun, hindarilah omongan kosong yang tidak suci[a], sebab mereka akan makin maju dalam kefasikan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ocehan sia-sia yang tidak suci” atau “omongan hampa yang tidak menghormati Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: yang tidak menghormati Allah
  rationale: Mengungkapkan sifat tidak suci dan tidak hormat terhadap Allah dalam bahasa Indonesia modern tanpa membatasinya pada makna sekadar duniawi.
- source_word: κενοφωνίας
  choice: omongan kosong
  rationale: Secara alami menyampaikan gagasan perkataan yang hampa, tidak bernilai, atau tidak berisi.
- source_word: περιΐστασο
  choice: hindarilah
  rationale: Imperatif ini meminta Timotius menjauh dan tidak melibatkan diri dalam perkataan semacam itu.
- source_word: ἐπὶ πλεῖον
  choice: semakin jauh
  rationale: Menyatakan perkembangan yang makin besar atau lanjut, dan berpadu alami dengan gambaran terjerumus.
- source_word: προκόψουσιν
  choice: akan ... terjerumus
  rationale: Menyampaikan gerak maju dalam arah negatif secara idiomatis; unsur perkembangan tetap tampak melalui 'semakin jauh'.
- source_word: ἀσεβείας
  choice: kefasikan
  rationale: Menjaga bobot moral-religius berupa sikap dan perilaku yang tidak menghormati Allah, bukan sekadar keburukan umum.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan kontras dengan nasihat sebelumnya secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah perkataan itu hanya sia-sia atau juga tidak menghormati Allah
  choice: omongan kosong yang tidak menghormati Allah
  alternative: ocehan sia-sia; omongan tidak suci
  rationale: Gabungan βεβήλους dan κενοφωνίας mencakup kehampaan perkataan sekaligus wataknya yang tidak suci atau tidak hormat kepada Allah.
- issue: Siapa subjek tersirat dalam προκόψουσιν
  choice: orang-orang yang melakukannya
  alternative: perkataan-perkataan itu; mereka
  rationale: Bentuk verba orang ketiga jamak dapat menunjuk para pelaku yang terlibat dalam omongan tersebut. Subjek tersirat dibuat jelas demi kewajaran bahasa, tanpa menentukan identitas mereka lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Omongan' dipilih karena alami bagi pembaca umum, sedangkan klausa penjelas mempertahankan bobot religius βέβηλος. Tanda koma akhir dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya.
