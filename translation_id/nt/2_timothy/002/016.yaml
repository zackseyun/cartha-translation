  - severity: low
    issue: “orang-orang yang melakukannya” sebagai subjek
    rationale: Teks hanya memakai verba orang ketiga jamak tanpa menyebut pelaku. Penambahan ini dapat dibaca sebagai pembatasan bahwa hanya orang yang ‘melakukan’ ucapan itu yang dimaksud. “Mereka” lebih dekat pada ambiguitas sumber.
