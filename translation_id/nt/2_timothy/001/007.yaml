base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: id
  text: Sebab Allah tidak memberi kita roh yang bercirikan kepengecutan[a], melainkan roh yang bercirikan kuasa, kasih, dan pengendalian diri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sikap penakut” atau “ketakutan”; kata Yunani ini terutama berarti rasa takut yang bersifat pengecut, bukan rasa takut biasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “pertimbangan yang sehat” atau “disiplin diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi nasihat sebelumnya, sedangkan οὐ menegasikan tindakan memberi.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Allah tidak memberi kita
  rationale: Bentuk aoris dinyatakan secara wajar dengan verba lampau yang tidak perlu diberi penanda aspek khusus dalam bahasa Indonesia; ἡμῖν diterjemahkan ringkas sebagai “kita”.
- source_word: πνεῦμα
  choice: roh
  rationale: Pilihan ini mempertahankan keluasan makna πνεῦμα, yang dapat menunjuk pada roh atau sikap batin, tanpa secara tegas menjadikannya gelar “Roh Kudus”.
- source_word: δειλίας
  choice: kepengecutan
  rationale: δειλία lebih kuat daripada rasa takut biasa dan mengandung arti takut yang membuat orang mundur atau enggan bertindak.
- source_word: ἀλλὰ δυνάμεως καὶ ἀγάπης
  choice: melainkan roh kuasa, kasih
  rationale: ἀλλά menyatakan pertentangan yang kuat. “Kuasa” dan “kasih” merupakan padanan langsung dan alami bagi δύναμις dan ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: pengendalian diri
  rationale: Istilah langka ini mencakup penguasaan diri, disiplin, dan kejernihan pertimbangan. “Pengendalian diri” jelas bagi pembaca modern, sementara nuansa lainnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: “roh” tanpa menentukan secara eksplisit bahwa ini gelar bagi Roh Kudus
  alternative: “Roh” sebagai sebutan langsung bagi Roh Kudus
  rationale: πνεῦμα tidak memakai artikel dan diterangkan oleh rangkaian genetif. Susunan ini mendukung pengertian kualitatif mengenai roh atau watak yang Allah berikan, tetapi terjemahan “roh” tetap mempertahankan kemungkinan kaitannya dengan karya Roh Kudus tanpa menetapkannya secara berlebihan.
- issue: Hubungan genetif dalam “roh kuasa, kasih, dan pengendalian diri”
  choice: mempertahankan susunan ringkas tanpa menambahkan hubungan kausal
  alternative: “roh yang menghasilkan/membangkitkan kuasa, kasih, dan pengendalian diri”
  rationale: Teks Yunani tidak menyatakan secara eksplisit apakah roh itu bercirikan, menghasilkan, atau menyampaikan sifat-sifat tersebut. Susunan ringkas menjaga ambiguitas aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kepengecutan” sengaja dipilih karena lebih tepat daripada “ketakutan” umum. Susunan “roh kuasa, kasih, dan pengendalian diri” agak padat, tetapi mempertahankan kesejajaran dan ketaktertentuan hubungan genetif dalam teks Yunani.
