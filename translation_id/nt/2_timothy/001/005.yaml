  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: id
  text: Aku teringat akan iman tulus yang ada dalam dirimu, yang mula-mula tinggal dalam nenekmu Lois dan ibumu Eunike, dan aku yakin bahwa iman itu juga tinggal dalam dirimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Aku teringat akan
  rationale: Ungkapan Yunani ini secara harfiah berarti ‘setelah menerima ingatan/pengingat’. Dalam konteksnya, terjemahan ini menyampaikan bahwa ingatan tentang iman Timotius muncul kembali dalam benak Paulus, dengan bahasa Indonesia yang alami.
- source_word: ἀνυποκρίτου πίστεως
  choice: iman tulus
  rationale: ἀνυπόκριτος menunjuk pada sesuatu yang tidak dibuat-buat atau tidak munafik. ‘Tulus’ menyampaikan keaslian iman itu secara ringkas dan wajar.
- source_word: ἐνῴκησεν
  choice: hidup dalam diri
  rationale: Kata ini secara harfiah berarti ‘berdiam’ atau ‘tinggal di dalam’. ‘Hidup dalam diri’ mempertahankan gambaran iman sebagai kenyataan yang menetap dan aktif, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: πέπεισμαι
  choice: aku yakin
  rationale: Bentuk perfektum ini menyatakan keyakinan yang telah terbentuk dan tetap dipegang Paulus. ‘Aku yakin’ menyampaikan keadaan keyakinan tersebut dengan tepat.
theological_decisions:
- issue: Hubungan iman Lois, Eunike, dan Timotius
  choice: Menggunakan ‘iman itu juga hidup dalam dirimu’ tanpa menyatakan bahwa iman diwariskan secara otomatis.
  alternative: Menyatakan bahwa Timotius mewarisi iman nenek dan ibunya.
  rationale: Teks menegaskan kesinambungan iman yang sama-sama nyata dalam ketiganya, tetapi tidak menjelaskan mekanisme pewarisan iman. Terjemahan mempertahankan batas itu.
- issue: Elipsis pada καὶ ἐν σοί
  choice: Mengulang ‘iman itu juga hidup dalam dirimu’.
  alternative: Menerjemahkan secara eliptis sebagai ‘juga dalam dirimu’.
  rationale: Bahasa Yunani menghilangkan verba pada klausa terakhir karena dapat dipahami dari ἐνῴκησεν. Pengulangan dalam bahasa Indonesia memperjelas makna tanpa menambahkan gagasan baru.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan satu kalimat mempertahankan alur sintaksis sumber, sedangkan pengulangan ‘iman itu’ mencegah ketidakjelasan rujukan.
