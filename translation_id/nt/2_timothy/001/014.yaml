base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: id
  text: Jagalah titipan yang baik itu[a] melalui Roh Kudus yang berdiam di dalam kita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “amanat yang baik” atau “apa yang dipercayakan kepadamu”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “oleh Roh Kudus yang tinggal di dalam kita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: apa yang baik yang telah dipercayakan kepadamu
  rationale: Ungkapan ini menyatakan sesuatu yang bernilai baik dan dipercayakan untuk dijaga. Bentuk deskriptif ini lebih alami dalam bahasa Indonesia daripada metafora harfiah seperti “titipan yang baik”, sementara catatan kaki mempertahankan alternatif itu.
- source_word: φύλαξον
  choice: Jagalah
  rationale: Imperatif ini menuntut tindakan aktif untuk menjaga dan melindungi sesuatu yang dipercayakan.
- source_word: διὰ πνεύματος ἁγίου
  choice: melalui Roh Kudus
  rationale: διά dengan bentuk genitif menyatakan sarana atau perantaraan; “melalui” mempertahankan keluwesan antara nuansa sarana dan pelaku.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: yang tinggal di dalam kita
  rationale: Partisipel kini menyatakan kehadiran Roh yang berlangsung. “Tinggal di dalam kita” alami dan mempertahankan makna internal tanpa istilah teknis.
theological_decisions:
- issue: Rujukan τὴν καλὴν παραθήκην
  choice: Dibiarkan umum sebagai “apa yang baik yang telah dipercayakan kepadamu”.
  alternative: Pesan Injil yang dipercayakan kepada Timotius; tugas pelayanannya; “titipan yang baik”.
  rationale: Konteks mengarah kepada amanat kerasulan atau Injil, tetapi teks Yunani tidak menyebut rujukannya secara eksplisit. Terjemahan tidak mempersempitnya.
- issue: Lingkup ἡμῖν (“kita”)
  choice: Kata ganti “kita” dipertahankan tanpa penjelasan dalam teks utama.
  alternative: Paulus dan Timotius secara khusus; semua orang percaya secara umum.
  rationale: Bentuk Yunani memungkinkan rujukan langsung kepada Paulus dan Timotius sekaligus implikasi komunitas orang percaya yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan deskriptif dipilih agar mudah dipahami pembaca umum, sedangkan metafora Yunani dan kemungkinan nuansa instrumental dicatat dalam catatan kaki.
