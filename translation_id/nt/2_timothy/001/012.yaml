id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: id
  text: Karena itulah aku juga menderita hal-hal ini. Namun, aku tidak malu, karena aku tahu kepada siapa aku telah menaruh kepercayaan[a], dan aku yakin bahwa ia sanggup menjaga titipanku[b] sampai pada hari itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “siapa yang telah kupercayai” atau “kepada siapa aku telah percaya.”
    reason: lexical_alternative
  - marker: b
    text: Kata “titipan” menunjuk pada sesuatu yang diserahkan kepada pihak lain untuk dijaga. Ungkapan ini dapat berarti apa yang Paulus percayakan kepada Allah, atau apa yang dipercayakan kepada Paulus.
    reason: alternative_reading
  - marker: c
    text: Yaitu hari penghakiman dan pembenaran terakhir oleh Allah.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Karena alasan inilah
  rationale: Ungkapan sebab ini mempertahankan kaitan dengan konteks sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ταῦτα πάσχω
  choice: aku juga menderita semuanya ini
  rationale: Mempertahankan aspek penderitaan dan kata tunjuk jamak tanpa menentukan secara lebih sempit penderitaan yang dimaksud.
- source_word: οὐκ ἐπαισχύνομαι
  choice: aku tidak malu
  rationale: Ini padanan idiomatis yang paling alami untuk sikap Paulus; bentuk Yunani di sini tidak perlu diperluas menjadi 'dipermalukan'.
- source_word: οἶδα
  choice: aku tahu
  rationale: Walaupun bentuknya secara morfologis perfektum, οἶδα berfungsi sebagai verba keadaan dengan makna kini.
- source_word: ᾧ πεπίστευκα
  choice: kepada siapa aku telah menaruh kepercayaan
  rationale: Ungkapan ini mempertahankan objek personal, nuansa percaya/memercayakan diri, dan daya perfektum sebagai kepercayaan yang telah diteguhkan.
- source_word: πέπεισμαι
  choice: aku yakin
  rationale: Menyampaikan keadaan keyakinan yang sudah mantap dalam bahasa Indonesia yang alami.
- source_word: δυνατός ἐστιν
  choice: ia sanggup
  rationale: Menyatakan kemampuan secara langsung tanpa menambahkan identitas subjek yang tidak disebutkan dalam klausa Yunani.
- source_word: τὴν παραθήκην μου
  choice: titipanku
  rationale: Mempertahankan metafora sesuatu yang dititipkan untuk dijaga dan, sejauh mungkin, ambiguitas mengenai arah penitipan; dua kemungkinan dijelaskan dalam catatan kaki.
- source_word: φυλάξαι
  choice: menjaga
  rationale: Cocok dengan gambaran titipan yang dipelihara atau diamankan.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: sampai pada hari itu
  rationale: Menyampaikan arah temporal menuju hari yang dimaksud tanpa menambahkan identifikasi ke dalam teks utama.
theological_decisions:
- issue: Acuan ᾧ ('siapa') dan subjek tersirat dari 'ia sanggup'
  choice: 'Acuannya tetap berupa pribadi yang tidak disebut namanya: ''siapa'' dan ''ia''.'
  alternative: Menyebutkannya secara eksplisit sebagai Allah atau Kristus Yesus.
  rationale: Konteks menunjuk kepada Allah sebagaimana dikenal dalam Kristus, tetapi klausa Yunani tidak menyebut nama acuannya; terjemahan mempertahankan tingkat kekhususan teks.
- issue: Makna παραθήκη μου
  choice: Diterjemahkan 'titipanku' dan ambiguitasnya diterangkan dalam catatan kaki.
  alternative: Menafsirkannya secara khusus sebagai hidup/keselamatan yang Paulus percayakan kepada Allah, atau sebagai Injil/pelayanan yang dipercayakan kepada Paulus.
  rationale: Bentuk Yunani dapat dipahami dalam kedua arah tersebut dan ayat ini sendiri tidak memaksa satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan pronomina orang pertama 'aku' sesuai suara pribadi surat. 'Titipanku' sengaja dipertahankan sebagai metafora ringkas; karena arah penitipannya tidak dapat sepenuhnya tetap ambigu secara alami dalam bahasa Indonesia, catatan kaki menyajikan kedua kemungkinan. Pronomina 'ia' tidak dikapitalisasi agar kapitalisasi tidak menjadi penafsiran tambahan atas acuan yang tidak dinamai dalam klausa Yunani.
