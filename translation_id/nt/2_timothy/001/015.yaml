id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: id
  text: 'Engkau tahu hal ini: semua orang yang ada di Asia[a] telah berpaling dariku[b], di antaranya Figelus dan Hermogenes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” di sini adalah provinsi Romawi di bagian barat Asia Kecil, bukan benua Asia yang dikenal sekarang.
    reason: cultural_note
  - marker: b
    text: Atau “telah meninggalkan aku.” Secara lebih harfiah, bahasa Yunani menyatakan bahwa mereka “berpaling dariku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: Engkau tahu
  rationale: οἶδα menyatakan pengetahuan yang sedang dimiliki. “Engkau tahu” merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: τοῦτο ... ὅτι
  choice: 'hal ini:'
  rationale: τοῦτο menunjuk kepada isi yang diperkenalkan oleh ὅτι. Tanda titik dua menyampaikan hubungan itu secara alami tanpa menambah penafsiran.
- source_word: ἀπεστράφησάν με
  choice: telah berpaling dariku
  rationale: Ungkapan ini mempertahankan gambaran dasar ἀποστρέφω, yaitu berbalik atau menjauh dalam hubungan kesetiaan dan dukungan, tanpa langsung mempersempit maknanya menjadi “meninggalkan”.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: semua orang yang ada di Asia
  rationale: Padanan ini mempertahankan cakupan luas πάντες dan frasa lokasi Yunani tanpa menambahkan pembatas yang tidak dinyatakan dalam teks. Konteks tetap dapat menentukan kelompok yang dimaksud.
- source_word: Ἀσίᾳ
  choice: Asia
  rationale: Nama geografis dipertahankan secara konvensional, sedangkan arti historisnya sebagai provinsi Romawi dijelaskan dalam catatan kaki.
- source_word: ὧν ἐστιν
  choice: di antaranya
  rationale: Frasa ini secara alami menunjukkan bahwa kedua orang yang disebut merupakan bagian dari kelompok sebelumnya.
- source_word: Φύγελος
  choice: Figelus
  rationale: Nama pribadi dialihaksarakan dalam bentuk yang wajar dan telah dikenal dalam bahasa Indonesia.
- source_word: Ἑρμογένης
  choice: Hermogenes
  rationale: Nama pribadi dialihaksarakan dalam bentuk yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan “semua orang yang ada di Asia”
  choice: Mempertahankan kata “semua” tanpa menjelaskan cakupannya di dalam teks utama.
  alternative: Membatasi secara eksplisit kepada semua rekan atau pendukung Paulus di Asia, atau memahaminya secara mutlak sebagai setiap orang Kristen di provinsi itu.
  rationale: πάντες memiliki daya cakup yang luas, tetapi cakupannya dapat dibatasi oleh konteks. Terjemahan tidak boleh memperluasnya menjadi setiap penduduk Asia ataupun mempersempitnya secara eksplisit kepada kelompok tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” dipakai untuk sapaan tunggal dalam surat pribadi. Susunan kalimat mempertahankan penekanan sumber pada apa yang diketahui Timotius dan pada tindakan berpaling dari Paulus.
