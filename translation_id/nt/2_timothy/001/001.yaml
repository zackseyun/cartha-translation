id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: id
  text: Paulus, rasul Mesias Yesus[a] oleh kehendak Allah, sesuai dengan janji kehidupan yang ada dalam Mesias Yesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus” pada kedua kemunculan “Mesias Yesus.”
    reason: Padanan tradisional bagi Χριστός adalah 'Kristus', sedangkan teks utama menerjemahkan makna gelarnya sebagai 'Mesias'.
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama Yunani ini sudah baku dalam bahasa Indonesia.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam pengenalan diri Paulus, istilah ini menunjuk pada jabatan atau pengutusan khusus, sehingga padanan baku 'rasul' dipertahankan.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός masih membawa makna gelar 'Yang Diurapi' atau 'Mesias'; susunan sumber juga dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: διὰ θελήματος θεοῦ
  choice: oleh kehendak Allah
  rationale: διά dengan genitif di sini menyatakan dasar atau perantaraan pengutusan Paulus; 'oleh kehendak Allah' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: κατ’ ἐπαγγελίαν
  choice: sesuai dengan janji
  rationale: κατά dengan akusatif menyatakan kesesuaian atau hubungan dengan janji; ungkapan ini lebih alami daripada terjemahan harfiah yang kaku.
- source_word: ζωῆς
  choice: tentang kehidupan
  rationale: Genitif ini menerangkan isi janji. 'Tentang kehidupan' menyampaikan hubungan tersebut secara alami tanpa menentukan secara berlebihan apakah genitifnya semata-mata isi atau sifat.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Artikel dan frasa berpreposisi berfungsi atributif dan menerangkan kehidupan itu. 'Dalam' mempertahankan daya relasional ἐν tanpa menjabarkan konsep persatuan secara berlebihan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap dapat dipahami sebagai gelar. 'Mesias' menerjemahkan maknanya, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif yang sah.
- issue: Relasi kerasulan dengan janji kehidupan
  choice: sesuai dengan janji tentang kehidupan
  alternative: demi janji kehidupan
  rationale: κατά paling wajar menyatakan kesesuaian atau hubungan, bukan tujuan secara tegas; pilihan ini tidak memaksakan penafsiran bahwa kerasulan Paulus semata-mata bertujuan memberitakan janji itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat yang belum selesai dipertahankan dengan koma karena kalimat berlanjut ke ayat berikutnya.
source_grounding:
  english_pob_role: consult_only
