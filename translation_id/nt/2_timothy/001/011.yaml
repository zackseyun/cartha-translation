  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: id
  text: Untuk Injil inilah aku ditetapkan sebagai pemberita, rasul, dan pengajar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bentara.” Kata Yunani ini menunjuk kepada orang yang secara resmi ditugaskan untuk mengumumkan berita kepada umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Untuk Injil inilah
  rationale: Frasa ini menunjuk kembali pada Injil dalam ayat sebelumnya dan menyatakan tujuan atau kaitan. Penyebutan ulang 'Injil' membuat rujukannya jelas dan alami dalam bahasa Indonesia, sedangkan 'inilah' mempertahankan penunjukan ke belakang.
- source_word: ἐτέθην
  choice: aku ditetapkan
  rationale: Bentuk pasif τίθημι dalam konteks peran berarti diangkat atau ditugaskan. 'Ditetapkan' menyampaikan penugasan resmi tanpa menyiratkan sekadar penempatan fisik.
- source_word: ἐγὼ
  choice: aku
  rationale: Pronomina eksplisit memberi sedikit penekanan kepada Paulus. 'Aku' alami dalam wacana surat pribadi dan tidak melebihkan penekanan seperti 'aku sendiri'.
- source_word: κῆρυξ
  choice: pemberita
  rationale: κῆρυξ adalah bentara atau orang yang ditugaskan mengumumkan berita di depan umum. 'Pemberita' terdengar alami dan bermartabat dalam bahasa Indonesia serta menonjolkan fungsi pewartaan tanpa membatasinya pada jabatan gerejawi yang lebih kemudian.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam penyebutan diri Paulus, ἀπόστολος berfungsi sebagai gelar kerasulan yang dikenal; 'rasul' merupakan padanan Indonesia yang mapan dan tepat.
- source_word: διδάσκαλος
  choice: pengajar
  rationale: Kata ini berarti orang yang mengajar. 'Pengajar' alami dalam deretan peran dan mempertahankan bentuk nomina pelaku.
theological_decisions:
- issue: Apakah κῆρυξ diterjemahkan dengan istilah gerejawi tradisional 'pengkhotbah' atau dengan istilah yang menonjolkan tugas proklamasi resmi
  choice: pemberita
  alternative: pengkhotbah; bentara
  rationale: '''Pemberita'' mempertahankan gagasan orang yang ditugaskan menyampaikan berita kepada umum dan menghindari penyempitan makna menjadi kegiatan berkhotbah dalam tata ibadah. ''Bentara'' lebih harfiah dalam nuansa resmi, tetapi kurang lazim bagi pembaca modern.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang lugas dan bermartabat. 'Aku' dipakai sesuai suara pribadi Paulus. Konjungsi Yunani yang berulang dalam daftar diwujudkan sebagai daftar alami bahasa Indonesia tanpa mengubah kesetaraan ketiga peran.
