source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: id
  text: Peganglah pola perkataan yang sehat yang telah kamu dengar dariku, dalam iman[a] dan kasih yang ada dalam Mesias Yesus[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kesetiaan dan kasih.” Kata Yunani untuk “iman” juga dapat berarti “kesetiaan” atau “kepercayaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “perkataan yang sehat yang telah kamu dengar dariku mengenai iman dan kasih dalam Mesias Yesus.” Susunan bahasa Yunani dapat dipahami sebagai keterangan tentang cara Timotius memegang pola itu atau tentang isi perkataan tersebut.
    reason: alternative_reading
  - marker: c
    text: 'Terjemahan tradisional: “Kristus Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: pola
  rationale: Kata ini menunjuk pada pola, model, atau bentuk teladan yang patut diikuti; “pola” alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: ἔχε
  choice: Peganglah
  rationale: Walaupun secara harfiah berarti “miliki”, bentuk imperatif dalam konteks ini menyuruh Timotius mempertahankan dan berpegang pada pola tersebut.
- source_word: ὑγιαινόντων λόγων
  choice: perkataan sehat
  rationale: ὑγιαίνω memakai metafora kesehatan untuk sesuatu yang benar dan tidak rusak, sedangkan λόγοι tetap diterjemahkan “perkataan” agar tidak langsung ditafsirkan sebagai “ajaran”.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: yang telah kamu dengar dariku
  rationale: παρά dengan genitif menyatakan sumber, yakni dari Paulus; aspek perfektif aoristus diterjemahkan secara wajar dengan “telah ... dengar”.
- source_word: ἐν πίστει
  choice: dalam iman
  rationale: “Iman” merupakan padanan utama πίστις, sedangkan kemungkinan makna “kesetiaan” dicatat dalam catatan kaki.
- source_word: καὶ ἀγάπῃ
  choice: dan kasih
  rationale: ἀγάπη secara langsung dan alami berarti “kasih”.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Frasa berartikel ini secara semantis menerangkan iman dan kasih bersama-sama sebagai sesuatu yang berada atau berakar dalam Mesias Yesus.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός tetap memiliki daya sebagai gelar di sini; “Mesias” menyampaikan arti gelar itu, sedangkan bentuk tradisional dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan ἐν πίστει καὶ ἀγάπῃ dengan bagian sebelumnya
  choice: Frasa itu menerangkan cara atau ranah Timotius memegang pola perkataan sehat.
  alternative: Frasa itu menerangkan isi perkataan sehat, yaitu perkataan mengenai iman dan kasih dalam Mesias Yesus.
  rationale: Alur nasihat lebih mendukung hubungan dengan perintah “peganglah”, tetapi susunan Yunani memungkinkan hubungan dengan “perkataan”; ambiguitas ini dipertahankan melalui catatan kaki.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam rumusan Paulus ini Χριστός masih dapat dipahami sebagai gelar; “Mesias” menerjemahkan maknanya, sementara padanan tradisional tetap diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. “Perkataan sehat” sengaja mempertahankan metafora Yunani, meskipun “ajaran yang sehat” lebih lazim secara gerejawi. Semua penanda catatan kaki ditempatkan dalam teks utama.
