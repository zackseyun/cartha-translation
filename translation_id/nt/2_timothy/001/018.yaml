  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: id
  text: Kiranya Tuhan berkenan agar ia memperoleh belas kasihan dari Tuhan pada hari itu[a][b]—dan engkau lebih tahu betapa banyaknya ia melayani di Efesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memperoleh belas kasihan di hadapan Tuhan”; frasa Yunani ini paling wajar dipahami sebagai “dari Tuhan”, tetapi juga dapat dipahami sebagai penekanan pada kehadiran di hadapan Tuhan.
    reason: lexical_alternative
  - marker: b
    text: “Hari itu” merupakan ungkapan yang lazim dalam Perjanjian Baru untuk hari penghakiman atau pembenaran ilahi yang akan datang.
    reason: cross_reference
  - marker: c
    text: Atau “segala sesuatu yang ia lakukan dalam melayani”. Ungkapan Yunani ini merangkum luasnya pelayanan yang ia lakukan di Efesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Kiranya Tuhan mengaruniakan kepadanya
  rationale: Bentuk optatif aoris menyatakan doa atau harapan. "Kiranya ... mengaruniakan" wajar dalam bahasa Indonesia yang bermartabat dan mengakomodasi pelengkap infinitif berikutnya.
- source_word: εὑρεῖν ἔλεος
  choice: belas kasihan
  rationale: Secara harfiah berarti "menemukan belas kasihan". Dalam konstruksi Indonesia ini, gagasan tersebut dinyatakan secara alami sebagai hal yang dikaruniakan Tuhan, tanpa mengubah makna penerimaan belas kasihan.
- source_word: παρὰ κυρίου
  choice: dari Tuhan
  rationale: Dengan bentuk genitif, παρά paling wajar menunjukkan sumber. Pengulangan "Tuhan" dipertahankan sebagaimana dalam teks Yunani.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Padanan temporal yang alami; ungkapannya dipertahankan tanpa memperluasnya secara interpretatif menjadi hari penghakiman atau hari terakhir.
- source_word: ὅσα
  choice: betapa banyaknya
  rationale: Merangkum keluasan atau banyaknya pelayanan yang dilakukan, bukan semata-mata daftar tindakan tertentu.
- source_word: διηκόνησεν
  choice: pelayanan yang telah ia lakukan
  rationale: Aorist διακονέω menunjuk pada tindakan melayani. Bentuk nominal-verbal ini alami dalam bahasa Indonesia dan tetap mencakup pelayanan praktis tanpa membatasinya pada jabatan gerejawi.
- source_word: βέλτιον σὺ γινώσκεις
  choice: engkau lebih tahu
  rationale: Mempertahankan daya komparatif βέλτιον tanpa menambahkan pembanding eksplisit yang tidak terdapat dalam teks.
- source_word: ἐν Ἐφέσῳ
  choice: di Efesus
  rationale: Padanan lokatif standar dan alami.
theological_decisions:
- issue: Rujukan pengulangan κύριος dalam ὁ κύριος ... παρὰ κυρίου
  choice: Kedua kemunculan diterjemahkan "Tuhan" tanpa menentukan pribadi yang dirujuk masing-masing.
  alternative: Kemunculan pertama merujuk kepada Kristus dan yang kedua kepada Bapa; atau keduanya merujuk kepada Kristus.
  rationale: Teks Yunani tidak membedakan rujukannya secara eksplisit. Pengulangan dan ambiguitas teologisnya dipertahankan.
- issue: Makna eskatologis "hari itu"
  choice: Diterjemahkan secara langsung sebagai "hari itu".
  alternative: '"hari penghakiman" atau "hari terakhir"'
  rationale: Ungkapan ini kemungkinan besar menunjuk pada hari ilahi yang akan datang, tetapi teks tidak memberinya penjelasan eksplisit; terjemahan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Sapaan "engkau" dipakai untuk percakapan pribadi dalam konteks surat dan agar selaras dengan register Alkitab yang bermartabat. Susunan kalimat mempertahankan pengulangan "Tuhan", frasa "hari itu", dan bentuk komparatif "lebih tahu".
