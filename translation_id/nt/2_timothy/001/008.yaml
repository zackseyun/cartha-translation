  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: id
  text: Jadi, janganlah malu akan kesaksian tentang Tuhan kita,[a] ataupun akan aku, tahanan-Nya. Sebaliknya, ikutlah menanggung penderitaan demi Injil[b] sesuai dengan kuasa Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian dari Tuhan kita.” Genitif Yunani dapat dipahami demikian, tetapi dalam konteks ini kemungkinan besar menunjuk pada kesaksian tentang Tuhan.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “ikutlah menanggung penderitaan bersama Injil”; dapat juga diterjemahkan, “ambillah bagian dalam penderitaan demi Injil.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dengan kuasa Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Jadi, janganlah
  rationale: οὖν menyatakan kesimpulan dari nasihat sebelumnya; “Jadi” menyampaikan hubungan logis itu secara alami, sedangkan μή dengan subjungtif aoris menyatakan larangan.
- source_word: ἐπαισχυνθῇς
  choice: malu
  rationale: Kata ini menunjuk pada rasa malu yang dapat membuat seseorang menarik diri atau enggan mengakui sesuatu; “malu” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: bersaksi tentang Tuhan kita
  rationale: 'μαρτύριον adalah kesaksian, dan genitif τοῦ κυρίου ἡμῶν kemungkinan besar objektif: kesaksian yang berkenaan dengan Tuhan. Bentuk verbal “bersaksi” lebih alami dalam larangan bahasa Indonesia tanpa mengubah isinya.'
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: dan jangan pula malu karena aku, orang yang dipenjarakan karena Dia
  rationale: μηδέ mengoordinasikan alasan kedua untuk merasa malu. δέσμιος berarti orang yang dipenjarakan. Ungkapan “karena Dia” menyampaikan hubungan Paulus dengan Tuhan dalam pemenjaraannya tanpa menyiratkan bahwa Tuhanlah yang memenjarakannya.
- source_word: ἀλλὰ συγκακοπάθησον
  choice: Sebaliknya, ikutlah menanggung penderitaan
  rationale: ἀλλά menyatakan kontras tegas. Prefiks συν- dalam verba tersebut mengandung gagasan turut atau bersama-sama mengambil bagian dalam penderitaan; “ikutlah menanggung penderitaan” menyatakannya secara alami.
- source_word: τῷ εὐαγγελίῳ
  choice: demi Injil
  rationale: Datif ini menyatakan hubungan dengan Injil dalam seruan untuk ikut menderita. “Demi Injil” merupakan ungkapan Indonesia yang wajar dan tidak memberi kesan bahwa pesan Injil itu sendiri turut menderita.
- source_word: κατὰ δύναμιν θεοῦ
  choice: sesuai dengan kuasa Allah
  rationale: κατά dengan akusatif secara harfiah menyatakan kesesuaian, ukuran, atau norma. “Sesuai dengan” mempertahankan keluwesan itu dan tidak mempersempitnya hanya menjadi sarana.
theological_decisions:
- issue: Hubungan “kesaksian” dengan “Tuhan kita”
  choice: 'Genitif objektif: bersaksi tentang Tuhan kita'
  alternative: 'Genitif subjektif: kesaksian yang berasal dari Tuhan kita'
  rationale: Dalam konteks ini Paulus mendorong Timotius agar tidak malu akan kesaksian Kristen yang berpusat pada Tuhan, sejajar dengan larangan untuk malu karena Paulus. Namun, bentuk Yunani juga memungkinkan pembacaan subjektif, sehingga alternatif itu dicatat.
- issue: Makna hubungan Paulus sebagai δέσμιος αὐτοῦ dengan Tuhan
  choice: orang yang dipenjarakan karena Dia
  alternative: tahanan-Nya
  rationale: Genitif αὐτοῦ menyatakan hubungan erat pemenjaraan Paulus dengan Tuhan. Terjemahan utama menjelaskan bahwa Paulus dipenjara karena hubungannya dengan Tuhan, sementara “tahanan-Nya” lebih formal tetapi dapat disalahpahami seolah-olah Tuhan menahannya.
- issue: Fungsi κατὰ δύναμιν θεοῦ
  choice: sesuai dengan kuasa Allah
  alternative: dengan kuasa Allah
  rationale: Terjemahan utama mempertahankan kemungkinan bahwa kuasa Allah merupakan ukuran, norma, atau dasar yang memampukan penderitaan. Alternatif menekankan kuasa itu sebagai sarana.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “janganlah” dan “ikutlah” mempertahankan nada nasihat kerasulan. “Injil” dipertahankan sebagai istilah Kristen yang umum. Tanda koma terakhir Yunani diperlakukan sebagai akhir ayat dalam penyajian Indonesia.
