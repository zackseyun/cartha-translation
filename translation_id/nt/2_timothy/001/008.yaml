  naturalness: “Janganlah malu akan kesaksian tentang Tuhan kita ataupun akan aku” alami dan jelas dalam bahasa Indonesia baku modern. “Ikutlah menanggung penderitaan demi Injil” tetap wajar dan menyampaikan ajakan untuk turut mengambil bagian dalam penderitaan yang terkait dengan Injil.
  terminology: “Kesaksian,” “Tuhan kita,” “tahanan-Nya,” “Injil,” dan “kuasa Allah” mempertahankan istilah serta hubungan sintaksis penting dari Yunani. “Tahanan-Nya” mempertahankan ambiguitas relasi genitif αὐτοῦ tanpa menjelaskan secara berlebihan bahwa Tuhan adalah pihak yang memenjarakan Paulus.
