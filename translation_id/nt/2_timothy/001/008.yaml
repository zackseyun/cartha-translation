revisions:
- from: Jadi, janganlah malu bersaksi tentang Tuhan kita,[a] dan jangan pula malu karena aku, orang yang dipenjarakan karena Dia. Sebaliknya, ikutlah menanggung penderitaan demi Injil[b] sesuai dengan kuasa Allah.[c]
  to: Jadi, janganlah malu akan kesaksian tentang Tuhan kita,[a] ataupun akan aku, tahanan-Nya. Sebaliknya, ikutlah menanggung penderitaan demi Injil[b] sesuai dengan kuasa Allah.[c]
  rationale: Revisi memulihkan bentuk nomina “kesaksian” untuk μαρτύριον, membuat kedua objek larangan sejajar (“akan kesaksian ... ataupun akan aku”), dan mempertahankan relasi padat δέσμιος αὐτοῦ sebagai “tahanan-Nya.” Terjemahan “demi Injil” dan “sesuai dengan kuasa Allah” dapat dipertahankan sebagai padanan yang alami tanpa menutup nuansa datif dan κατά.
