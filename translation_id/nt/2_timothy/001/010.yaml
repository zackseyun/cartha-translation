id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: id
  text: tetapi sekarang telah dinyatakan melalui kedatangan Juruselamat kita, Yesus Sang Mesias[a]. Ia telah menghapuskan maut dan membawa kehidupan serta ketidakbinasaan[b] ke dalam terang melalui Injil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau sebagai sebutan yang menyerupai nama (“Kristus”).
    reason: alternative_reading
  - marker: b
    text: Atau “keabadian.” Istilah Yunani ini menekankan keadaan yang tidak dapat rusak atau binasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: telah dinyatakan
  rationale: Bentuk pasif ini merujuk kembali kepada anugerah Allah dalam ayat sebelumnya. Terjemahan ini mempertahankan makna penyingkapan tanpa menambahkan pelaku yang tidak disebutkan di sini.
- source_word: ἐπιφανείας
  choice: kedatangan
  rationale: Dalam konteks kristologis ini, istilah tersebut menunjuk pada tampilnya Yesus secara nyata dalam sejarah. 'Kedatangan' lebih alami dalam bahasa Indonesia daripada 'penampakan', yang dapat menimbulkan kesan penampakan gaib.
- source_word: σωτῆρος
  choice: Juruselamat
  rationale: Sebutan baku dan tepat bagi sosok yang menyelamatkan, serta mempertahankan fungsinya sebagai gelar.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih memiliki daya sebagai gelar mesianik setelah sebutan 'Juruselamat kita'. 'Sang' membuat gelar itu idiomatis dan bermartabat dalam bahasa Indonesia.
- source_word: καταργήσαντος
  choice: telah menghapuskan
  rationale: Mengungkapkan tindakan tegas yang meniadakan kuasa atau keberlakuan maut tanpa memaksa teks menjelaskan bagaimana kemenangan itu berhubungan dengan kenyataan bahwa manusia masih mengalami kematian.
- source_word: θάνατον
  choice: maut
  rationale: '''Maut'' merupakan padanan Indonesia yang ringkas dan bermartabat untuk kematian sebagai kuasa yang dikalahkan.'
- source_word: φωτίσαντος
  choice: membawa ... ke dalam terang
  rationale: Mempertahankan metafora penyingkapan dalam verba Yunani dan menghubungkannya secara alami dengan kedua objeknya.
- source_word: ζωὴν
  choice: kehidupan
  rationale: Padanan langsung yang mempertahankan bobot keselamatan dan eskatologis istilah tersebut tanpa memperluasnya.
- source_word: ἀφθαρσίαν
  choice: ketidakbinasaan
  rationale: Menekankan keadaan yang tidak dapat rusak atau binasa; lebih dekat dengan lingkup makna Yunani daripada sekadar keberadaan tanpa akhir.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: melalui Injil
  rationale: Mempertahankan διά sebagai sarana dan memakai istilah Indonesia yang mapan untuk kabar baik tentang keselamatan.
- source_word: μὲν ... δὲ
  choice: '... dan ... serta ...'
  rationale: Hubungan retoris antara penghapusan maut dan penyingkapan kehidupan dipertahankan dengan koordinasi yang alami dalam bahasa Indonesia, tanpa konstruksi berpasangan yang kaku.
theological_decisions:
- issue: Fungsi Χριστοῦ dalam rangkaian nama dan gelar Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Sesudah gelar 'Juruselamat kita', unsur Χριστός tetap dapat didengar sebagai gelar 'Mesias', bukan semata-mata bagian nama. Alternatif yang sudah menjadi bentuk nama tetap dicatat agar ambiguitas fungsi istilah Yunani tidak disembunyikan.
- issue: Daya καταργήσαντος terhadap maut
  choice: telah menghapuskan maut
  alternative: telah mematahkan kuasa maut
  rationale: Pilihan utama mempertahankan kuatnya pernyataan Yunani. Terjemahan tidak menjelaskan secara paksa waktu atau cakupan penghapusan itu, sehingga ketegangan antara kemenangan yang sudah tercapai dan pengalaman kematian sekarang tetap terbuka.
- issue: Makna ἀφθαρσίαν
  choice: ketidakbinasaan
  alternative: keabadian
  rationale: Istilah Yunani menonjolkan kebebasan dari kerusakan dan kebinasaan. 'Keabadian' dapat menjadi padanan kontekstual, tetapi berpotensi hanya dipahami sebagai keberadaan tanpa akhir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang berbentuk rangkaian partisip dipecah menjadi dua kalimat agar rujukannya jelas dan mudah dibaca. 'Kedatangan' dipilih untuk menghindari nuansa gaib dari 'penampakan', sedangkan citra terang pada φωτίσαντος tetap dipertahankan.
