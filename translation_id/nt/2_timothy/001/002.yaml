id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: id
  text: 'Kepada Timotius, anak yang terkasih: anugerah, belas kasihan, dan damai dari Allah Bapa dan Mesias Yesus[a], Tuhan kita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.” Gelar Yunani Χριστός diterjemahkan “Mesias” untuk mempertahankan maknanya, bukan bentuk transliterasi tradisionalnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: yang terkasih
  rationale: Menyampaikan kasih yang mendalam dan nada penuh keakraban tanpa melemahkannya menjadi sekadar sapaan biasa.
- source_word: τέκνῳ
  choice: anak
  rationale: Mempertahankan kiasan hubungan orang tua–anak secara rohani dan tidak mempersempit maknanya menjadi 'putra'.
- source_word: χάρις
  choice: anugerah
  rationale: Padanan Indonesia yang lazim dan tepat bagi istilah khas dalam salam Paulus.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Mempertahankannya sebagai unsur tersendiri di samping anugerah dan damai.
- source_word: εἰρήνη
  choice: damai
  rationale: Padanan langsung yang mempertahankan cakupan relasional dan teologis istilah Yunani tanpa penambahan makna.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: Tepat mengikuti teks Yunani yang tidak memuat kata 'kita' sebagai penjelas bagi Bapa.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan makna gelar Yunani, bukan sekadar mentransliterasikannya.
- source_word: κυρίου
  choice: Tuhan
  rationale: Mempertahankan makna kewibawaan dan bobot kristologis κύριος.
theological_decisions:
- issue: Penerjemahan Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός masih berfungsi sebagai gelar dalam rumusan salam ini; 'Mesias' mempertahankan arti gelar tersebut, sedangkan bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan Timotius dengan Paulus dalam τέκνῳ
  choice: anak
  alternative: anakku
  rationale: Bentuk Yunani tidak memuat kata ganti milik 'ku'; terjemahan mempertahankan metafora kekeluargaan tanpa menambahkan unsur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan salam dipertahankan secara ringkas; 'damai' dipilih daripada perluasan tradisional 'damai sejahtera' agar lebih dekat dengan εἰρήνη.
