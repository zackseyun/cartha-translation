  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: id
  text: Karena itu, aku mengingatkanmu untuk mengobarkan kembali karunia Allah yang ada dalam dirimu melalui penumpangan tanganku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat menyala kembali.” Kata kerja Yunani menggambarkan tindakan membangkitkan api agar menyala penuh lagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Karena itu
  rationale: Ungkapan sebab-akibat ini diterjemahkan secara alami dan tetap mempertahankan kaitannya dengan konteks sebelumnya.
- source_word: ἀναμιμνῄσκω
  choice: aku mengingatkanmu
  rationale: Bentuk kini ini menyatakan tindakan mengingatkan; susunan dengan enklitik -mu alami dalam bahasa Indonesia modern.
- source_word: σε ἀναζωπυρεῖν
  choice: untuk mengobarkan kembali
  rationale: Kata kerja Yunani membangkitkan gambaran api yang dibuat menyala lagi. Pilihan ini mempertahankan metafora sekaligus menyampaikan unsur pembaruan.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: karunia Allah
  rationale: χάρισμα menunjuk pada pemberian berdasarkan anugerah. 'Karunia Allah' ringkas, lazim, dan tidak mempersempitnya menjadi jenis karunia tertentu.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: yang ada dalam dirimu
  rationale: Klausa relatif ini menyatakan bahwa karunia tersebut berada dalam diri Timotius tanpa menambahkan penafsiran lain.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: melalui penumpangan tanganku
  rationale: Kata depan διά dengan genitif mempertahankan nuansa sarana atau perantaraan, sedangkan 'penumpangan tangan' merupakan ungkapan Indonesia yang dikenal untuk tindakan tersebut.
theological_decisions:
- issue: Hubungan antara karunia Allah dan tindakan Paulus menumpangkan tangan
  choice: melalui penumpangan tanganku
  alternative: dengan perantaraan penumpangan tanganku
  rationale: Terjemahan ini mempertahankan pernyataan teks bahwa karunia itu terkait dengan dan diperantarai melalui penumpangan tangan Paulus, tanpa memasukkan kerangka sakramental yang lebih berkembang daripada yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Metafora api dipertahankan, dan ungkapan 'melalui penumpangan tanganku' sengaja menjaga nuansa perantaraan dalam teks Yunani.
