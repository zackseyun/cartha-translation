id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: id
  text: yang telah menyelamatkan kita dan memanggil kita dengan panggilan yang kudus[a], bukan berdasarkan perbuatan kita, melainkan berdasarkan maksud-Nya sendiri dan anugerah-Nya. Anugerah itu telah diberikan kepada kita dalam Mesias Yesus[b] sebelum zaman bermula[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kepada panggilan yang kudus” atau “melalui panggilan yang kudus”. Bentuk datif Yunani dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam Kristus Yesus”. Di sini “Mesias” dipakai karena Χριστός dipahami sebagai gelar, yaitu Yang Diurapi.
    reason: alternative_reading
  - marker: c
    text: Secara lebih harfiah, “sebelum zaman-zaman kekal” atau “sebelum segala masa”; maksud ungkapannya dapat dinyatakan secara idiomatis sebagai “sebelum waktu bermula”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: telah menyelamatkan
  rationale: Partisip aoristis dari σῴζω menyatakan tindakan penyelamatan Allah; bentuk ini mempertahankan bobot teologis istilah tersebut dan kesejajarannya dengan καλέσαντος.
- source_word: καλέσαντος
  choice: memanggil
  rationale: ‘Memanggil’ mempertahankan makna panggilan ilahi dalam pemakaian Paulus dan sejajar dengan ‘menyelamatkan’.
- source_word: κλήσει ἁγίᾳ
  choice: dengan panggilan yang kudus
  rationale: Ungkapan ini cukup dekat dengan bentuk datif Yunani tanpa secara sempit menetapkannya sebagai tujuan atau sarana; kemungkinan lain dijelaskan dalam catatan kaki.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: bukan berdasarkan perbuatan kita
  rationale: κατά dengan akusatif di sini menyatakan dasar atau tolok ukur. ‘Berdasarkan’ lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah ‘menurut’.
- source_word: ἰδίαν πρόθεσιν
  choice: maksud-Nya sendiri
  rationale: ‘Maksud’ menyampaikan πρόθεσις sebagai tujuan atau ketetapan Allah, sedangkan ‘sendiri’ mempertahankan penekanan ἰδίαν.
- source_word: χάριν
  choice: anugerah-Nya
  rationale: ‘Anugerah’ merupakan padanan teologis yang mapan bagi χάρις. Akhiran -Nya memperjelas bahwa anugerah itu berasal dari Allah, sesuai konteks dan hubungan gramatikalnya.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: Anugerah itu telah diberikan kepada kita
  rationale: Partisip feminin τὴν δοθεῖσαν menerangkan χάριν. Kalimat baru memperjelas acuannya dalam bahasa Indonesia tanpa mengubah hubungan makna.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Χριστός diterjemahkan sebagai gelar ‘Mesias’, sementara Ἰησοῦ dipertahankan sebagai nama. ‘Dalam’ mempertahankan rumusan relasional ἐν yang khas dalam Paulus.
- source_word: πρὸ χρόνων αἰωνίων
  choice: sebelum zaman bermula
  rationale: Padanan idiomatis ini menyampaikan keberadaan anugerah tersebut sebelum rentang zaman atau waktu dimulai. Bentuk ungkapan Yunani yang lebih harfiah dicatat agar nuansanya tidak hilang.
theological_decisions:
- issue: Fungsi datif κλήσει ἁγίᾳ
  choice: dengan panggilan yang kudus
  alternative: kepada panggilan yang kudus; melalui panggilan yang kudus
  rationale: Datif ini dapat dipahami sebagai penyerta, tujuan, atau sarana. Teks utama memakai rumusan yang tidak terlalu membatasi, dan catatan kaki mempertahankan kemungkinan lainnya.
- issue: Χριστός sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός pada dasarnya adalah gelar yang berarti ‘Yang Diurapi’. ‘Mesias’ menerjemahkan fungsi gelarnya, sementara bentuk gerejawi yang lazim dicatat sebagai alternatif.
- issue: Makna temporal πρὸ χρόνων αἰωνίων
  choice: sebelum zaman bermula
  alternative: sebelum zaman-zaman kekal; sebelum segala masa
  rationale: Frasa Yunani menunjuk kepada pemberian anugerah sebelum rentang waktu atau zaman. Terjemahan utama dibuat alami, sedangkan ungkapan sumber yang tidak biasa dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur klausa dipecah menjadi dua kalimat agar acuan ‘anugerah’ jelas bagi pembaca umum. Teks tetap berupa penggalan yang melanjutkan ayat sebelumnya, sehingga diawali huruf kecil dan diakhiri koma.
