lexical_decisions:
- source_word: ἐπιποθῶν
  choice: karena aku rindu
  rationale: Partisipel kini ini menyatakan kerinduan pribadi yang kuat. Bentuk klausa dengan “karena” mengalir alami dalam bahasa Indonesia sambil tetap terkait dengan kalimat yang lebih luas.
- source_word: σε ἰδεῖν
  choice: melihatmu
  rationale: Infinitif ini melengkapi ἐπιποθῶν dan menyatakan hal yang dirindukan, yaitu bertemu dan melihat Timotius. “Melihatmu” langsung dan wajar.
- source_word: μεμνημένος
  choice: teringat akan
  rationale: Partisipel perfek menyatakan keadaan mengingat yang berlanjut. “Teringat akan” mempertahankan nuansa ingatan yang hadir dalam pikiran dan sesuai dengan alur kalimat.
- source_word: σου τῶν δακρύων
  choice: air matamu
  rationale: Konstruksi genitif ini secara alami merujuk pada air mata Timotius. Terjemahan ini lebih langsung dan kurang interpretatif daripada “tangisanmu”.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang dimaksud. “Supaya” alami dalam bahasa Indonesia dan tidak memaksakan pembedaan yang tidak pasti antara tujuan dan hasil.
- source_word: χαρᾶς
  choice: dengan sukacita
  rationale: Genitif yang menyertai πληρωθῶ secara idiomatis dinyatakan dengan “dipenuhi dengan sukacita” dalam bahasa Indonesia.
- source_word: πληρωθῶ
  choice: aku dipenuhi
  rationale: Aorist pasif subjungtif ini mempertahankan gambaran bahwa sukacita memenuhi Paulus; bentuk pasif Indonesia menyampaikan struktur tersebut secara jelas.
