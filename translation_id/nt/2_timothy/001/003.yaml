revisions:
- from: Aku bersyukur kepada Allah, yang kulayani[a], sebagaimana nenek moyangku dahulu[b], dengan hati nurani yang murni. Aku terus-menerus mengingatmu dalam doa-doaku[c], siang dan malam.
  to: Aku bersyukur kepada Allah, yang kulayani sebagaimana nenek moyangku, dengan hati nurani yang murni, sementara aku terus-menerus mengingatmu dalam doa-doaku, siang dan malam.
  rationale: ‘Sementara’ mencerminkan ὡς sebagai penghubung keadaan yang menyertai tanpa memaksakannya menjadi sebab (‘karena’) atau waktu tertentu (‘ketika’). ‘Sebagaimana nenek moyangku’ mempertahankan pembacaan kesinambungan yang dipakai dalam draf dan audit bahasa Inggris, sementara catatan kaki menjaga alternatif harfiah ‘dari/sejak nenek moyang’.
