  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: id
  text: Aku bersyukur kepada Allah, yang kulayani sebagaimana nenek moyangku, dengan hati nurani yang murni, sementara aku terus-menerus mengingatmu dalam doa-doaku, siang dan malam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Aku bersyukur kepada Allah
  rationale: Ungkapan Yunani χάριν ἔχω dengan objek datif menyatakan rasa syukur kepada seseorang. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna langsungnya.
- source_word: ᾧ λατρεύω
  choice: yang kulayani
  rationale: λατρεύω menunjuk pada pelayanan religius atau penyembahan yang diberikan kepada Allah. “Melayani” mempertahankan keluasan maknanya tanpa membatasinya pada ibadah ritual.
- source_word: ἀπὸ προγόνων
  choice: sebagaimana nenek moyangku dahulu
  rationale: Ungkapan ini menyatakan kesinambungan pelayanan Paulus kepada Allah dengan iman dan pengabdian para leluhurnya. Terjemahan ini alami, tetapi alternatif yang lebih harfiah dicatat karena konstruksi Yunani ringkas dan dapat dipahami dengan beberapa nuansa.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: dengan hati nurani yang murni
  rationale: Frasa ini menerangkan cara Paulus melayani Allah. “Hati nurani yang murni” merupakan ungkapan Indonesia yang wajar dan mempertahankan nuansa kemurnian moral.
- source_word: ὡς
  choice: hubungan dinyatakan dengan kelanjutan kalimat
  rationale: ὡς menghubungkan ucapan syukur dengan keadaan bahwa Paulus terus mengingat Timotius dalam doanya. Pemisahan menjadi dua kalimat menjaga kelancaran bahasa Indonesia tanpa menetapkan hubungan itu secara tegas sebagai sebab atau waktu.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: Aku terus-menerus mengingatmu
  rationale: Ungkapan Yunani secara harfiah berarti memiliki ingatan atau penyebutan mengenai Timotius. Bentuk Indonesia ini menyampaikan maksudnya secara alami dalam konteks doa.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: dalam doa-doaku
  rationale: δέησις secara khusus dapat berarti permohonan, tetapi “doa-doaku” lebih alami dalam konteks ini dan tidak meniadakan unsur permohonan.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: siang dan malam
  rationale: Ungkapan idiomatis ini menyatakan keteraturan yang terus berlangsung. Urutan “siang dan malam” paling lazim dalam bahasa Indonesia, walaupun urutan sumber adalah “malam dan siang”.
theological_decisions:
- issue: Hubungan pelayanan Paulus kepada Allah dengan warisan leluhurnya
  choice: Paulus menggambarkan pelayanannya sebagai berkesinambungan dengan pelayanan nenek moyangnya.
  alternative: Frasa itu dapat diterjemahkan lebih harfiah sebagai “sejak nenek moyangku” atau dipahami sebagai pelayanan yang diterima melalui warisan leluhur.
  rationale: ἀπὸ προγόνων paling mungkin menekankan kesinambungan dengan iman leluhur, tetapi terjemahan dan catatan kaki tidak memperluasnya menjadi klaim doktrinal tentang seluruh tradisi leluhur.
- issue: Cakupan makna λατρεύω
  choice: melayani
  alternative: menyembah atau beribadah kepada
  rationale: Kata ini mencakup pelayanan religius yang ditujukan kepada Allah. “Melayani” menjaga cakupan tersebut, sementara kemungkinan “menyembah” dicatat.
- issue: Hubungan ὡς dengan ucapan syukur dan ingatan dalam doa
  choice: Hubungan tersebut dibiarkan bersifat keadaan penyerta tanpa dinyatakan secara eksplisit sebagai sebab.
  alternative: “karena aku terus-menerus mengingatmu” atau “ketika aku terus-menerus mengingatmu”
  rationale: ὡς dapat menghubungkan isi atau keadaan yang menyertai ucapan syukur. Memecahnya menjadi dua kalimat menghindari penetapan hubungan kausal atau temporal yang lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, hangat, dan bermartabat. “Aku” dipakai sesuai bentuk tunggal dan keakraban surat pastoral. Kalimat Yunani yang panjang dibagi menjadi dua agar mudah dipahami, tanpa menghilangkan kaitan antara ucapan syukur dan ingatan Paulus dalam doa.
