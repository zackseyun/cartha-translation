lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan antara tindakan Onesiforus dan sikap orang-orang yang disebut dalam konteks sebelumnya; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: ketika berada di Roma
  rationale: Mengungkapkan keadaan atau keberadaan di Roma tanpa memastikan bahwa partisip tersebut secara khusus berarti kedatangan; kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: σπουδαίως
  choice: dengan sungguh-sungguh
  rationale: Menyatakan keseriusan dan usaha tekun dalam pencarian, dengan ungkapan Indonesia yang alami.
- source_word: ἐζήτησέν με
  choice: ia mencari aku
  rationale: Mempertahankan tindakan aktif mencari seseorang dan objek orang pertama yang eksplisit.
- source_word: καὶ εὗρεν
  choice: dan menemukan aku
  rationale: Menyampaikan hasil pencarian secara langsung; objek 'aku' dipulihkan secara wajar dari klausa sebelumnya.
