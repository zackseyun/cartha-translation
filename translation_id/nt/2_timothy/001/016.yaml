  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: id
  text: Kiranya Tuhan mengaruniakan belas kasihan kepada rumah tangga Onesiforus, karena ia sering kali memberi aku kelegaan dan tidak malu akan rantai yang membelengguku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemenjaraanku”; secara harfiah, “rantaiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Kiranya ... mengaruniakan
  rationale: Bentuk optatif aoristus menyatakan harapan atau doa; konstruksi ini menyampaikannya secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan baku dan sesuai konteks untuk kemurahan ilahi kepada orang yang membutuhkan.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar ilahi tanpa menentukan lebih lanjut siapa referennya.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: kepada keluarga Onesiforus
  rationale: οἶκος di sini menunjuk pada rumah tangga atau keluarga, bukan terutama bangunan fisik; 'keluarga' paling mudah dipahami pembaca umum.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan bagi doa berkat tersebut secara jelas.
- source_word: πολλάκις
  choice: sering
  rationale: Padanan ringkas dan alami untuk tindakan yang berulang kali terjadi.
- source_word: ἀνέψυξεν
  choice: menyegarkan hatiku
  rationale: Kata kerja ini menyatakan pemberian kelegaan atau kesegaran. Penambahan 'hatiku' membuat metafora tersebut alami dalam bahasa Indonesia tanpa mereduksinya hanya menjadi dorongan verbal.
- source_word: τὴν ἅλυσίν μου
  choice: rantai yang membelengguku
  rationale: Mempertahankan gambaran konkret rantai dalam bentuk tunggal sambil menjelaskan hubungannya dengan Paulus secara alami.
- source_word: οὐκ ἐπαισχύνθη
  choice: tidak malu karena
  rationale: Menyampaikan daya moral-sosial dari verba tersebut; 'karena' menghubungkan rasa malu yang ditolak itu dengan keadaan Paulus yang dirantai.
theological_decisions:
- issue: Referen 'Tuhan' dalam doa berkat Paulus
  choice: Menerjemahkan hanya sebagai 'Tuhan' tanpa identifikasi tambahan.
  alternative: Menentukan bahwa yang dimaksud ialah Allah Bapa atau Tuhan Yesus.
  rationale: Teks Yunani hanya berbunyi ὁ κύριος; terjemahan mempertahankan ketidakjelasan referennya dan tidak memasukkan penentuan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk 'Kiranya' mempertahankan nuansa doa; 'keluarga' mengomunikasikan cakupan sosial οἶκος; gambaran rantai dipertahankan dalam teks utama dan makna metonimisnya dicatat dalam catatan kaki.
