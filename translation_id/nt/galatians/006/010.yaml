id: GAL.6.10
reference: Galatians 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: id
  text: Karena itu, selama kita mempunyai kesempatan[a], marilah kita berbuat baik kepada semua orang, terutama kepada mereka yang termasuk dalam keluarga[b] iman[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “selagi kita masih mempunyai waktu.” Kata Yunani καιρός menekankan waktu yang tepat atau kesempatan yang sesuai, bukan sekadar waktu pada umumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, gambaran dalam bahasa Yunani menunjuk kepada orang-orang yang menjadi anggota suatu rumah tangga; karena itu dapat juga diterjemahkan “seisi rumah iman” atau “anggota keluarga iman.”
    reason: lexical_alternative
  - marker: c
    text: “Iman” dapat juga dipahami sebagai “iman itu,” yaitu iman atau pengakuan yang dianut bersama oleh komunitas orang percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Karena itu
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya. “Karena itu” menyampaikan daya simpulnya secara wajar dalam bahasa Indonesia modern.
- source_word: ὡς καιρὸν ἔχομεν
  choice: selama kita mempunyai kesempatan
  rationale: καιρός menunjuk pada waktu atau keadaan yang tepat untuk bertindak, bukan sekadar waktu secara kronologis. Ungkapan ini juga mempertahankan nuansa bahwa kesempatan itu berlangsung selama suatu masa tertentu.
- source_word: ἐργαζώμεθα
  choice: marilah kita berbuat
  rationale: Bentuk subjungtif ini menyatakan ajakan kepada komunitas untuk terus bertindak. “Marilah kita berbuat” alami bersama objek “baik”.
- source_word: τὸ ἀγαθὸν
  choice: baik
  rationale: Adjektiva netral dengan artikel ini dipakai secara substantival, yakni apa yang baik. Dalam konstruksi “berbuat baik,” bahasa Indonesia menyampaikan maknanya dengan jelas tanpa menjadi kaku.
- source_word: πρὸς πάντας
  choice: kepada semua orang
  rationale: πρός menandai arah tindakan kepada orang-orang. Pilihan ini mempertahankan cakupan universal πάντας.
- source_word: μάλιστα δὲ
  choice: terutama
  rationale: μάλιστα memberi prioritas khusus di dalam perintah yang lebih luas, bukan mengecualikan orang lain. “Terutama” mempertahankan penekanan tersebut.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: mereka yang termasuk dalam keluarga iman
  rationale: οἰκεῖοι memakai gambaran anggota rumah tangga atau keluarga. Terjemahan ini mempertahankan metafora kekeluargaan sekaligus menghindari penambahan gagasan keanggotaan institusional yang tidak dinyatakan secara khusus oleh teks.
- source_word: πίστεως
  choice: iman
  rationale: πίστις paling langsung berarti “iman” di sini dan menjadi ciri yang mengidentifikasi keluarga tersebut. Pilihan ini tetap membuka kemungkinan nuansa “iman itu” sebagai pengakuan bersama.
theological_decisions:
- issue: Cakupan dan prioritas perbuatan baik orang percaya
  choice: Ayat ini memerintahkan perbuatan baik kepada semua orang, dengan prioritas khusus kepada sesama dalam keluarga iman.
  alternative: Perintah ini hanya berlaku kepada orang percaya, atau sebaliknya tidak memberi prioritas khusus kepada orang percaya.
  rationale: πρὸς πάντας menetapkan cakupan universal, sedangkan μάλιστα menambahkan penekanan khusus. Terjemahan mempertahankan kedua unsur itu tanpa meniadakan salah satunya.
- issue: Makna τῆς πίστεως dalam ungkapan keluarga iman
  choice: “Iman” dipertahankan sebagai ciri yang mengidentifikasi keluarga tersebut.
  alternative: “Iman itu” dalam arti pengakuan iman bersama, atau “kesetiaan” sebagai suatu sifat.
  rationale: Konteks mendukung komunitas yang dipersatukan oleh iman, tetapi bentuk Yunani masih memungkinkan pembacaan “iman itu.” Catatan kaki mempertahankan kemungkinan tersebut tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “marilah kita” mempertahankan ajakan komunal; “keluarga iman” menjaga metafora sumber, sedangkan catatan kaki menjelaskan ungkapan yang mungkin tidak langsung dipahami semua pembaca.
