source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: id
  text: Semoga damai dan belas kasihan tercurah atas semua orang yang akan hidup menurut patokan ini,[a] dan atas Israel milik Allah.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua orang yang akan berjalan sejalan dengan patokan ini.” Kata kerjanya menggambarkan berjalan dalam barisan atau mengikuti suatu patokan.
    reason: lexical_alternative
  - marker: b
    text: “Israel milik Allah” dapat menunjuk kepada orang Yahudi yang percaya, seluruh jemaat, atau umat Allah secara lebih luas. Terjemahan ini mempertahankan ungkapan Yunani tanpa menentukan rujukannya.
    reason: alternative_reading
  - marker: c
    text: Kata “dan” terakhir dapat berarti menambahkan kelompok lain (“dan atas Israel milik Allah”) atau menjelaskan kembali kelompok yang sama (“bahkan atas Israel milik Allah”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Mengungkapkan cakupan tak tentu dan menyeluruh dari ὅσοι secara alami dalam bahasa Indonesia modern.
- source_word: κανόνι
  choice: patokan
  rationale: κανών menunjuk pada norma atau standar yang mengarahkan perilaku. 'Patokan' alami dan tetap mempertahankan gagasan tolok ukur.
- source_word: στοιχήσουσιν
  choice: akan hidup menurut
  rationale: στοιχέω menggambarkan berjalan teratur atau mengikuti suatu garis. Ungkapan ini menyampaikan makna etisnya dengan jelas; metafora berjalan dijelaskan dalam catatan.
- source_word: εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος
  choice: semoga damai dan belas kasihan tercurah atas ...
  rationale: Bentuk ini menyatakan daya berkat dari klausa tanpa verba secara wajar dan bermartabat, sambil mempertahankan εἰρήνη dan ἔλεος serta nuansa ἐπί.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Israel milik Allah
  rationale: Menyampaikan konstruksi genitif secara transparan dan tidak menentukan siapa tepatnya yang dimaksud oleh frasa yang diperdebatkan ini.
theological_decisions:
- issue: Rujukan 'Israel milik Allah'
  choice: Frasa diterjemahkan secara dekat tanpa menjelaskan kelompok yang dirujuknya.
  alternative: Orang Yahudi yang percaya; seluruh jemaat; atau umat Allah secara lebih luas.
  rationale: Bahasa Yunani tidak dengan sendirinya memastikan satu tafsiran, sehingga ambiguitas teologisnya perlu dipertahankan.
- issue: Fungsi καί terakhir sebelum ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ
  choice: Diterjemahkan 'dan atas', sehingga dapat dibaca sebagai penambahan kelompok atau penjelasan ulang kelompok yang sama.
  alternative: '''bahkan atas Israel milik Allah'', yang secara lebih tegas menjadikannya penjelasan ulang.'
  rationale: Kata penghubung tersebut dapat dipahami secara aditif ataupun epeksegetis; 'dan' tidak memutuskan perdebatan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada berkat. Susunan diubah menjadi 'Semoga ... tercurah' agar klausa berkat tanpa verba dalam bahasa Yunani terdengar alami. Istilah 'patokan' cukup umum dan tidak terlalu teknis; ambiguitas pada 'Israel milik Allah' dan καί terakhir dipertahankan.
