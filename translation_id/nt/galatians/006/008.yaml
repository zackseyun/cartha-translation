id: GAL.6.8
reference: Galatians 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: id
  text: Sebab orang yang menabur untuk dagingnya sendiri[a] akan menuai kerusakan[b] dari daging itu, tetapi orang yang menabur untuk Roh[c] akan menuai hidup kekal dari Roh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabiatnya sendiri yang berdosa.” Kata Yunani sarx dapat berarti daging secara harfiah atau, dalam kontras etis Paulus, orientasi manusia berdosa yang berlawanan dengan Roh.
    reason: lexical_alternative
  - marker: b
    text: Atau “kebinasaan” atau “kehancuran.” Kata Yunani ini dapat menunjuk pada kerusakan, kebinasaan, atau kehancuran.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud adalah Roh Kudus. Sebagian orang menerjemahkannya dengan “roh” memakai huruf kecil, tetapi dalam surat Galatia kontras ini biasanya merujuk kepada Roh Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata penghubung ini memberikan dasar bagi nasihat sebelumnya. “Sebab” mempertahankan fungsi penjelasannya secara alami dalam bahasa Indonesia.
- source_word: ὁ σπείρων
  choice: orang yang menabur
  rationale: Partisipel substantival ini bersifat umum. Ungkapan ini mempertahankan gambaran pertanian dan daya ungkap seperti peribahasa.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: untuk dagingnya sendiri
  rationale: “Untuk” menyampaikan arah atau kepentingan tindakan menabur, sedangkan “daging” mempertahankan istilah khas Paulus. “Sendiri” mencerminkan penekanan refleksif ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: dari daging itu
  rationale: ἐκ menunjukkan sumber hasil yang dituai. Kata “itu” membuat rujukan balik kepada daging yang baru disebut lebih alami dalam bahasa Indonesia.
- source_word: θερίσει
  choice: akan menuai
  rationale: Pilihan ini mempertahankan pasangan gambaran menabur dan menuai serta bentuk waktu mendatang.
- source_word: φθοράν
  choice: kebinasaan
  rationale: Kata Yunani ini dapat menunjuk pada kerusakan, kebinasaan, atau kehancuran. “Kebinasaan” membentuk kontras yang alami dengan “hidup kekal”, sementara keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: ὁ δὲ σπείρων
  choice: tetapi orang yang menabur
  rationale: “Tetapi” menyatakan kontras, dan pengulangan susunannya mempertahankan keseimbangan antitesis kedua klausa.
- source_word: εἰς τὸ πνεῦμα
  choice: untuk Roh
  rationale: Dalam kontras antara daging dan Roh di Galatia, πνεῦμα paling mungkin merujuk kepada Roh Allah. Huruf kapital menandai rujukan tersebut.
- source_word: ἐκ τοῦ πνεύματος
  choice: dari Roh
  rationale: ἐκ menyatakan sumber dan mempertahankan kesejajaran dengan “dari daging itu” dalam klausa pertama.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah padanan bahasa Indonesia yang baku dan tepat untuk ungkapan tersebut, tanpa menghilangkan dimensi zaman yang akan datang.
theological_decisions:
- issue: Makna σάρξ dalam kontras etis Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: Walaupun konteksnya bersifat etis, “daging” mempertahankan kosakata dan ketegangan teologis Paulus tanpa langsung menyamakan istilah itu dengan suatu penjelasan doktrinal tertentu. Alternatif interpretatif diberikan dalam catatan kaki.
- issue: Rujukan πνεῦμα
  choice: Roh
  alternative: roh
  rationale: Konteks surat Galatia, khususnya kontras daging dan Roh, paling alami menunjuk kepada Roh Allah. Namun, karena naskah Yunani tidak memakai pembedaan huruf kapital seperti bahasa Indonesia, kemungkinan penulisan “roh” dicatat.
- issue: Cakupan φθορά
  choice: kebinasaan
  alternative: kerusakan atau kehancuran
  rationale: “Kebinasaan” menyampaikan akibat yang berlawanan dengan hidup kekal, tetapi catatan kaki mempertahankan rentang makna yang juga dapat mencakup kerusakan dan kehancuran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang lugas dan bermartabat. Struktur antitesis serta gambaran menabur-menuai dipertahankan. Istilah “daging” sengaja dipakai sebagai istilah teologis sumber dan dijelaskan agar tidak semata-mata dipahami sebagai tubuh jasmani.
