  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: id
  text: Mulai sekarang, jangan seorang pun menyusahkan aku, karena aku menanggung tanda-tanda Yesus[a] pada tubuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cap”; istilah Yunani ini dapat merujuk pada tanda pada tubuh yang menunjukkan kepemilikan atau kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Mulai sekarang
  rationale: Ungkapan waktu idiomatis yang berarti ‘sejak saat ini’ atau ‘selanjutnya’; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: jangan seorang pun menyusahkan aku
  rationale: Dalam konstruksi ini, κόπους παρέχειν berarti menimbulkan kesusahan atau gangguan. Bentuk larangan orang ketiga diterjemahkan secara alami tanpa menghilangkan ketegasannya.
- source_word: τὰ στίγματα
  choice: tanda-tanda
  rationale: Istilah ini menunjuk pada tanda pada tubuh, termasuk kemungkinan bekas luka atau cap yang menandakan kepemilikan atau kesetiaan. ‘Tanda-tanda’ mempertahankan keluasan maknanya.
- source_word: τοῦ Ἰησοῦ
  choice: milik Yesus
  rationale: Genitif ini secara harfiah dapat diterjemahkan ‘dari Yesus’, tetapi dalam bahasa Indonesia frasa ‘tanda-tanda dari Yesus’ mudah disalahartikan sebagai tanda yang diberikan langsung oleh Yesus. ‘Milik Yesus’ menyampaikan hubungan identifikasi atau kepunyaan yang kuat dalam konteks, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih formal.
- source_word: ἐν τῷ σώματί μου
  choice: pada tubuhku
  rationale: Walaupun ἐν secara dasar berarti ‘di/dalam’, bahasa Indonesia lazim memakai ‘pada tubuh’ untuk tanda fisik yang terdapat di tubuh.
- source_word: βαστάζω
  choice: aku menanggung
  rationale: βαστάζω berarti membawa atau menanggung. ‘Menanggung’ sesuai dengan tanda-tanda penderitaan dan mempertahankan nada khidmat, tanpa membatasi tanda itu hanya pada luka.
theological_decisions:
- issue: Hakikat τὰ στίγματα τοῦ Ἰησοῦ
  choice: Diterjemahkan secara cukup netral sebagai ‘tanda-tanda milik Yesus’, tanpa menetapkan bahwa tanda-tanda itu semata-mata bekas luka atau semata-mata lambang.
  alternative: ‘bekas-bekas luka karena Yesus’, ‘cap milik Yesus’, atau ‘tanda-tanda Yesus’
  rationale: Ungkapan ini kemungkinan merujuk pada tanda fisik akibat penderitaan Paulus yang sekaligus mengidentifikasikannya sebagai milik Yesus. Teks tidak mengharuskan satu penafsiran sempit, sehingga ketegangan antara realitas fisik dan makna kesetiaan tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada tegas dan khidmat. Susunan klausa kedua sedikit ditandai (‘pada tubuhku aku menanggung’) untuk mempertahankan penekanan sumber pada tubuh Paulus. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
