id: GAL.6.7
reference: Galatians 6:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: id
  text: 'Janganlah tertipu: Allah tidak dapat diperolok-olok. Sebab, apa pun yang ditabur seseorang, itulah juga yang akan dituainya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Janganlah tertipu
  rationale: Bentuk imperatif kini pasif orang kedua jamak menyampaikan peringatan langsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa para pembaca tidak boleh membiarkan diri mereka diperdaya.
- source_word: θεὸς
  choice: Allah
  rationale: Padanan baku θεός dalam konteks ini, yang menunjuk kepada Allah yang esa.
- source_word: οὐ μυκτηρίζεται
  choice: tidak dapat diperolok-olok
  rationale: Kata kerja ini berarti mengejek, mencemooh, atau memperlakukan dengan penghinaan. Padanan ini mempertahankan bentuk pasif dan daya ungkap pepatahnya; kata 'dapat' menyatakan bahwa upaya memperolok Allah tidak akan berhasil atau luput dari akibat, bukan bahwa manusia tidak pernah mencoba melakukannya.
- source_word: ὃ γὰρ ἐὰν
  choice: Sebab, apa pun yang
  rationale: Konstruksi relatif tak tentu ini menyatakan prinsip umum. 'Apa pun yang' merupakan bentuk Indonesia yang ringkas dan alami.
- source_word: σπείρῃ
  choice: ditabur
  rationale: Metafora pertanian dipertahankan secara harfiah dan berpasangan langsung dengan tindakan menuai.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Ἄνθρωπος di sini bersifat generik dan menunjuk kepada manusia mana pun. Bahasa Indonesia tidak memiliki keharusan memakai bentuk maskulin, sehingga 'seseorang' menyampaikan cakupan umum tanpa menghilangkan makna sumber.
- source_word: τοῦτο καὶ θερίσει
  choice: itulah juga yang akan dituainya
  rationale: 'Bentuk ''itulah'' mempertahankan penekanan demonstratif τοῦτο: hal yang ditabur itu jugalah yang akan dituai. Akhiran ''-nya'' secara alami merujuk kembali kepada ''seseorang''.'
theological_decisions:
- issue: Cakupan generik ἄνθρωπος
  choice: seseorang
  alternative: seorang manusia
  rationale: Ayat ini mengemukakan prinsip yang berlaku bagi setiap orang. Karena bahasa Indonesia tidak menandai 'seseorang' sebagai laki-laki, pilihan ini mempertahankan cakupan generik teks Yunani tanpa memasukkan pembatasan gender yang tidak dimaksudkan.
- issue: Makna pernyataan bahwa Allah οὐ μυκτηρίζεται
  choice: Allah tidak dapat diperolok-olok
  alternative: Allah tidak diperolok-olok
  rationale: Konteks menegaskan bahwa penghinaan terhadap Allah melalui tindakan manusia tidak akan berhasil meniadakan pertanggungjawaban. Pilihan ini mempertahankan ketegangan antara kenyataan bahwa manusia dapat mencoba mencemooh Allah dan kepastian bahwa Allah tidak bisa diperlakukan demikian tanpa akibat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan nada peringatan serta kesejajaran metafora menabur–menuai, sambil memakai 'seseorang' yang alami untuk subjek manusia generik.
