translation:
  language: id
  text: Hendaklah orang yang diajar dalam firman berbagi segala sesuatu yang baik dengan orang yang mengajarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbagi dalam segala sesuatu yang baik dengan orang yang mengajarnya.” Ungkapan ini kemungkinan mencakup dukungan materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: hendaklah ... berbagi
  rationale: Bentuk imperatif kini menuntut suatu kebiasaan yang berkelanjutan. 'Berbagi' mempertahankan keluasan κοινωνέω dan dapat mencakup dukungan praktis maupun materi.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan ringan. Dalam bahasa Indonesia, peralihan itu tidak perlu dinyatakan dengan kata penghubung agar ayat tetap alami dan tidak memberi kesan pertentangan yang kuat.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: orang yang diajar dalam firman
  rationale: Partisip pasif kini menunjuk kepada penerima pengajaran. 'Diajar dalam firman' menyampaikan bahwa 'firman' adalah isi atau ranah pengajaran tanpa memakai istilah gerejawi teknis.
- source_word: τὸν λόγον
  choice: firman
  rationale: Dalam konteks ini λόγος menunjuk kepada berita atau ajaran Kristen. 'Firman' mempertahankan ungkapan Paulus yang dikenal, tanpa mempersempitnya menjadi sekadar pelajaran tertentu.
- source_word: τῷ κατηχοῦντι
  choice: orang yang mengajarnya
  rationale: Partisip aktif kini menunjuk kepada pemberi pengajaran dan dibuat sejajar secara alami dengan 'orang yang diajar'.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: segala sesuatu yang baik
  rationale: Ungkapan ini luas dan kemungkinan mencakup harta atau dukungan praktis. Susunan Indonesia ini alami sebagai hal-hal yang dibagikan, tetapi tidak membatasinya hanya pada uang.
theological_decisions:
- issue: Sifat berbagi yang diperintahkan
  choice: Perintah ini mencakup berbagi hal-hal yang baik dengan pengajar, kemungkinan termasuk dukungan materi.
  alternative: Perintah ini hanya menunjuk kepada persekutuan atau berkat rohani bersama.
  rationale: Kombinasi κοινωνέω, penerima dalam bentuk datif, dan ἐν πᾶσιν ἀγαθοῖς kuat mengarah pada berbagi secara praktis, tetapi ungkapannya tetap luas. Terjemahan dan catatan kaki mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'hendaklah' menyampaikan imperatif tanpa terdengar kasar; struktur dibuat mudah dipahami oleh pembaca umum.
