base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: id
  text: Janganlah kita menjadi jemu dalam berbuat baik[a], sebab pada waktunya kita akan menuai[b], jika kita tidak menyerah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam melakukan apa yang baik.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktu yang tepat.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “tanpa menjadi lemah” atau “tanpa kehabisan tenaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: dalam berbuat baik
  rationale: Ungkapan ini berarti melakukan apa yang baik atau luhur. “Berbuat baik” alami dalam bahasa Indonesia dan mempertahankan nuansa etisnya.
- source_word: μὴ ἐγκακῶμεν
  choice: janganlah kita menjadi jemu
  rationale: Verba ini menyatakan kehilangan semangat atau menjadi letih hingga tergoda untuk berhenti. “Menjadi jemu” menyampaikan keletihan batin dalam melakukan kebaikan tanpa menyamakannya sepenuhnya dengan ungkapan penutup.
- source_word: καιρῷ ... ἰδίῳ
  choice: pada waktunya
  rationale: Frasa ini menunjuk pada waktu yang sesuai atau telah tiba bagi penuaian. “Pada waktunya” alami dan tetap membiarkan konteks menentukan siapa yang menetapkan waktu itu.
- source_word: θερίσομεν
  choice: kita akan menuai
  rationale: Terjemahan ini mempertahankan metafora pertanian yang dibangun dalam konteks ayat-ayat sekitarnya.
- source_word: μὴ ἐκλυόμενοι
  choice: jika kita tidak menyerah
  rationale: Partisip ini dapat menggambarkan menjadi lemah, kehabisan tenaga, atau mengendur. Bentuk bersyarat sesuai dengan fungsi kontekstualnya, sedangkan “tidak menyerah” menyampaikan tuntutan untuk bertahan dan membedakannya dari ἐγκακῶμεν.
theological_decisions:
- issue: Hubungan antara dua ungkapan ketekunan, ἐγκακῶμεν dan ἐκλυόμενοι
  choice: Dibedakan sebagai “menjadi jemu” dan “menyerah”.
  alternative: “Tawar hati” dan “menjadi lemah”; atau memakai istilah keletihan yang hampir sama untuk keduanya.
  rationale: Paulus memakai dua ungkapan yang berkaitan tetapi tidak identik. Pembedaan ini mempertahankan perkembangan retoris dari keletihan batin menuju tindakan menyerah, tanpa menambahkan kesimpulan doktrinal.
- issue: Daya syarat μὴ ἐκλυόμενοι
  choice: Dinyatakan dengan “jika kita tidak menyerah”.
  alternative: Diterjemahkan lebih formal sebagai “dengan tidak menjadi lemah” atau “tanpa menjadi lesu”.
  rationale: Walaupun secara bentuk merupakan partisip, dalam konteks ini frasa tersebut secara wajar menyatakan keadaan yang menjadi syarat bagi penuaian. Terjemahan bersyarat membuat hubungan itu jelas tanpa menentukan lebih jauh sifat teologis penuaian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, metafora menuai dipertahankan, dan dua istilah ketekunan dibedakan.
