  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: id
  text: Sebab setiap orang akan memikul tanggungannya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanggung bebannya sendiri.” Kata Yunani yang dipakai di sini adalah φορτίον (“tanggungan”), berbeda dari βάρη (“beban-beban”) pada ayat 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: setiap orang
  rationale: Bentuk distributif tunggal ini menekankan masing-masing pribadi; “setiap orang” alami dan jelas dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: sebab
  rationale: Kata penghubung ini menjelaskan kaitan pernyataan tersebut dengan konteks sebelumnya tanpa menambahkan penafsiran.
- source_word: τὸ ἴδιον
  choice: -nya sendiri
  rationale: Ungkapan ini menegaskan sesuatu yang menjadi bagian atau tanggungan masing-masing orang. Bentuk “-nya sendiri” mempertahankan acuan tunggal tanpa menetapkan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: φορτίον
  choice: muatan
  rationale: Kata ini menunjuk pada sesuatu yang dibawa atau dipikul. “Muatan” mempertahankan gambaran konkret sekaligus membedakannya dari βάρη (“beban-beban”) pada ayat 2.
- source_word: βαστάσει
  choice: akan memikul
  rationale: Bentuk future active indicative diterjemahkan dengan “akan”; “memikul” secara alami berpasangan dengan “muatan” dan mempertahankan citra membawa sesuatu.
theological_decisions:
- issue: Hubungan Galatia 6:5 dengan 6:2
  choice: Mempertahankan perbedaan leksikal dengan menerjemahkan φορτίον sebagai “muatan”, tanpa menjelaskan secara dogmatis jenis tanggung jawab yang dimaksud.
  alternative: Menerjemahkan βάρη pada ayat 2 dan φορτίον pada ayat 5 sama-sama sebagai “beban”, atau menafsirkan ayat 5 secara eksplisit sebagai pertanggungjawaban eskatologis.
  rationale: Paulus memakai dua nomina berbeda dalam konteks dekat. Terjemahan ini mempertahankan ketegangan antara saling menanggung beban dan masing-masing memikul muatannya sendiri, tanpa memaksakan harmonisasi atau penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Memikul muatan” mempertahankan metafora fisik dari teks Yunani serta pembedaan kosakata dalam konteks terdekat.
