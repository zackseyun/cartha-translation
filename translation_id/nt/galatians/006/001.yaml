id: GAL.6.1
reference: Galatians 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: id
  text: Saudara-saudara[a], kalaupun seseorang kedapatan dalam suatu pelanggaran[b], kamu yang rohani harus memulihkan orang itu dengan sikap lemah lembut. Tetaplah menjaga dirimu sendiri, supaya kamu juga jangan tergoda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Saudara-saudara" menerjemahkan bentuk jamak maskulin yang dalam konteks ini dapat menyapa seluruh komunitas orang percaya, baik laki-laki maupun perempuan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: "tersusul oleh suatu pelanggaran" atau "terperangkap secara tidak terduga dalam suatu pelanggaran."'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara bentuk maskulin, tetapi dalam konteks dapat ditujukan kepada seluruh komunitas orang percaya. 'Saudara-saudara' merupakan sapaan jemaat yang alami dan bermartabat dalam bahasa Indonesia; cakupan yang mungkin mencakup laki-laki dan perempuan dijelaskan dalam catatan kaki.
- source_word: ἐὰν καὶ
  choice: kalau
  rationale: Konstruksi ini memperkenalkan keadaan bersyarat dengan kemungkinan nuansa konsesif. Dalam susunan bahasa Indonesia, 'kalau' menghasilkan kalimat alami; unsur kemungkinan yang muncul pun tetap terpelihara tanpa menambahkan penekanan yang janggal.
- source_word: προλημφθῇ
  choice: kedapatan
  rationale: Bentuk pasif ini dapat berarti didapati, tersusul, atau tertangkap secara tidak terduga. 'Kedapatan' alami dalam konteks pelanggaran dan tidak membatasi maknanya hanya pada tertangkap basah; alternatif nuansanya dipertahankan dalam catatan kaki.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Kata benda tunggal ini digunakan secara generik untuk seorang manusia. 'Seseorang' mempertahankan ketunggalan dan cakupan generiknya secara wajar dalam bahasa Indonesia tanpa menyisipkan jenis kelamin yang tidak menentukan maksud ayat.
- source_word: ἔν τινι παραπτώματι
  choice: melakukan suatu pelanggaran
  rationale: παράπτωμα menunjuk pada langkah salah atau pelanggaran. Ungkapan verbal ini lebih alami dalam bahasa Indonesia daripada 'di dalam suatu pelanggaran' dan tetap mempertahankan bobot moralnya.
- source_word: οἱ πνευματικοὶ
  choice: kamu yang rohani
  rationale: Adjektiva substantival ini menunjuk kepada mereka yang berciri rohani, mungkin dalam arti hidup oleh Roh atau matang secara rohani. Terjemahan ini sengaja tidak mempersempit acuannya.
- source_word: καταρτίζετε
  choice: harus memulihkan
  rationale: Imperatif ini berarti mengembalikan kepada keadaan yang semestinya, membenahi, atau memperbaiki. 'Harus memulihkan' menyampaikan daya perintahnya secara jelas dan alami.
- source_word: τὸν τοιοῦτον
  choice: orang itu
  rationale: Ungkapan demonstratif ini kembali menunjuk kepada orang yang baru disebutkan. 'Orang itu' jelas, tunggal, dan lebih alami daripada bentuk harfiah 'orang yang demikian'.
- source_word: ἐν πνεύματι πραΰτητος
  choice: dengan sikap lemah lembut
  rationale: Frasa ini dapat menunjuk pada watak batin atau cara bertindak yang bercirikan kelemahlembutan, dengan kemungkinan gema karya Roh. 'Dengan sikap lemah lembut' alami dan tidak secara tegas menentukan apakah πνεῦμα berarti roh manusia atau Roh Kudus.
- source_word: σκοπῶν σεαυτόν
  choice: jagalah dirimu sendiri
  rationale: Partisip tunggal ini beralih dari sapaan jamak kepada tanggung jawab pribadi setiap pemulih. Bentuk imperatif dalam bahasa Indonesia menyampaikan tindakan penyerta berupa kewaspadaan terhadap diri sendiri.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: supaya kamu juga jangan tergoda
  rationale: Konstruksi ini menyatakan tujuan atau akibat yang hendak dihindari. Dalam konteks moral, πειράζω paling mungkin berarti 'menggoda', sementara 'juga' mempertahankan καί dan menegaskan kerentanan bersama.
theological_decisions:
- issue: Cakupan sapaan Ἀδελφοί dan istilah generik ἄνθρωπος
  choice: '''Saudara-saudara'' dan ''seseorang'''
  alternative: '''Saudara-saudari'' dan ''seorang laki-laki'''
  rationale: Bentuk Yunani pada sapaan itu maskulin secara gramatikal, tetapi dapat mencakup kelompok campuran; hal ini dijelaskan dalam catatan kaki. ἄνθρωπος di sini bersifat generik, sehingga 'seseorang' lebih tepat dalam bahasa Indonesia dan tidak mengubah referennya menjadi khusus laki-laki.
- issue: Nuansa προλημφθῇ
  choice: '''kedapatan'' dalam teks utama'
  alternative: '''tersusul'' atau ''tertangkap secara tidak terduga'''
  rationale: Verba itu dapat menggambarkan seseorang yang didapati dalam pelanggaran ataupun yang dikuasai secara mendadak olehnya. 'Kedapatan' memungkinkan konteks dasar terbaca alami, sedangkan nuansa alternatif dipelihara dalam catatan kaki.
- issue: Acuan πνεύματι dalam frasa πνεύματι πραΰτητος
  choice: '''dengan sikap lemah lembut'' tanpa menentukan acuan secara eksplisit'
  alternative: '''dengan kelemahlembutan yang berasal dari Roh'''
  rationale: Bentuk Yunani memungkinkan penekanan pada watak manusia sekaligus gema kelemahlembutan sebagai buah Roh. Terjemahan tidak secara sepihak menetapkan salah satu penafsiran.
- issue: Makna πειρασθῇς
  choice: '''tergoda'''
  alternative: '''diuji'''
  rationale: Konteks peringatan agar pemulih menjaga dirinya dari jatuh ke dalam dosa mendukung arti 'tergoda', walaupun verba tersebut pada konteks lain dapat berarti 'diuji'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada pastoral yang tetap bermartabat. Peralihan dari 'kamu' sebagai kelompok kepada 'dirimu sendiri' mempertahankan perubahan Yunani dari bentuk jamak ke tunggal dan menekankan tanggung jawab pribadi setiap orang yang memulihkan.
