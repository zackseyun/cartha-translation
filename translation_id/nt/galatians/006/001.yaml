    rationale: Ungkapan itu menyiratkan seseorang tertangkap sedang melakukan tindakan tersebut, sedangkan verba pasif ini dapat pula menyiratkan orang itu tersusul atau terperangkap dalam pelanggaran. "Kedapatan dalam suatu pelanggaran" mempertahankan keluasan itu.
  - severity: low
    issue: '"Namun" menambahkan hubungan kontras yang tidak dinyatakan sumber.'
    rationale: σκοπῶν berfungsi sebagai partisip tindakan penyerta bagi orang yang memulihkan. Peringatan langsung tanpa "Namun" lebih dekat pada hubungan sumber.
