base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: id
  text: Kiranya anugerah Tuhan kita Yesus Kristus menyertai roh kalian, saudara-saudara.[a] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” di sini menyapa seluruh komunitas orang percaya dan dapat mencakup laki-laki maupun perempuan; dapat juga diterjemahkan “saudara-saudari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Istilah yang alami dan berbobot dalam bahasa Indonesia untuk χάρις dalam berkat penutup Paulus; mencakup kemurahan yang diberikan Allah.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku κύριος dalam pengakuan iman Kristen dan sebutan bagi Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Dalam bahasa Indonesia, 'Kristus' merupakan bentuk baku yang tetap dikenal sebagai gelar, sedangkan 'Mesias' dapat dicatat sebagai arti gelar itu bila diperlukan.
- source_word: μετὰ τοῦ πνεύματος ὑμῶν
  choice: menyertai roh kalian
  rationale: Bahasa Yunani tidak memuat verba dalam rumus berkat ini; 'menyertai' melengkapinya secara alami. 'Roh kalian' mempertahankan πνεῦμα bentuk tunggal dengan ὑμῶν yang jamak dan sapaan kepada jemaat.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan Indonesia ini alami bagi komunitas dan dapat mencakup laki-laki maupun perempuan sesuai cakupan pragmatis bentuk jamak Yunani.
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi liturgis yang mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan Χριστός dalam berkat penutup Paulus
  choice: Kristus
  alternative: Mesias
  rationale: '''Kristus'' adalah bentuk baku dan bermartabat dalam penggunaan Alkitab bahasa Indonesia serta tetap berfungsi sebagai gelar; ''Mesias'' adalah padanan semantisnya.'
- issue: Cakupan ἀδελφοί ketika menyapa jemaat
  choice: saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam konteks ini menyapa seluruh komunitas orang percaya. 'Saudara-saudara' mempertahankan bentuk konvensional, sedangkan catatan menjelaskan cakupannya.
- issue: Makna πνεύματος ὑμῶν
  choice: roh kalian
  alternative: kalian
  rationale: Terjemahan mempertahankan ungkapan khas Paulus dan ketegangan antara 'roh' tunggal dan penerima jamak, tanpa meratakannya menjadi sekadar kata ganti.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada berkat penutup yang ringkas dan khidmat. Kata ganti jamak 'kalian' dipilih untuk membedakannya dari bentuk tunggal dan menjernihkan bahwa Paulus menyapa jemaat secara kolektif.
