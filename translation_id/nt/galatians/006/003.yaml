  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: id
  text: Sebab, kalau seseorang menganggap dirinya berarti, padahal ia bukan apa-apa, ia menipu[a] dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia memperdaya dirinya sendiri.”
    reason: Alternatif leksikal bagi φρεναπατᾷ yang lebih menonjolkan penyesatan pikiran.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, kalau
  rationale: Gabungan ini mengantar alasan yang menjelaskan nasihat sebelumnya sekaligus mempertahankan sifat bersyarat εἰ.
- source_word: δοκεῖ
  choice: menganggap
  rationale: Dalam konteks ini, kata tersebut menunjuk pada penilaian seseorang tentang dirinya sendiri, bukan kesan yang tampak bagi orang lain.
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu ini bersifat umum; 'seseorang' merupakan bentuk tunggal yang alami dalam bahasa Indonesia.
- source_word: εἶναί τι
  choice: dirinya berarti
  rationale: Ungkapan ini menyatakan anggapan bahwa diri sendiri penting atau memiliki kedudukan; 'berarti' menyampaikan idiomnya secara alami tanpa menambahkan jenis keunggulan tertentu.
- source_word: μηδὲν ὤν
  choice: padahal ia bukan apa-apa
  rationale: Frasa partisipial ini dikontraskan dengan anggapan bahwa dirinya berarti. 'Padahal' menyatakan kontras yang jelas dalam bahasa Indonesia, sedangkan 'bukan apa-apa' mempertahankan ungkapan ringkas Paulus.
- source_word: φρεναπατᾷ
  choice: menipu
  rationale: Kata kerja ini berarti memperdaya atau menyesatkan pikiran; 'menipu' jelas dan wajar, terutama bersama objek refleksif.
- source_word: ἑαυτόν
  choice: dirinya sendiri
  rationale: Bentuk refleksif ini kembali kepada subjek tunggal dan diterjemahkan secara alami tanpa perlu menandai gender dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan tunggal generik
  choice: seseorang / ia / dirinya sendiri
  alternative: orang / dia / dirinya sendiri
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin secara representatif. Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga, sehingga bentuk tunggal generik dapat dipertahankan tanpa memasukkan gender yang tidak perlu.
- issue: Arti εἶναί τι dalam penilaian diri
  choice: dirinya berarti
  alternative: dirinya sesuatu / dirinya penting
  rationale: '''Berarti'' mempertahankan gagasan tentang nilai atau kepentingan diri tanpa menentukan apakah yang dimaksud ialah status, kemampuan, atau keunggulan rohani.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan penjelas dan bersyarat, serta kontras tajam antara merasa berarti dan sebenarnya bukan apa-apa.
