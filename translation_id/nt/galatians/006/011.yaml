  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: id
  text: Lihatlah betapa besarnya huruf-huruf yang kutulis kepada kalian dengan tanganku sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lihatlah betapa panjangnya surat yang kutulis kepada kalian dengan tanganku sendiri.”
    reason: Menjaga alternatif penafsiran bahwa πηλίκοις γράμμασιν dapat merujuk pada panjang surat, bukan ukuran fisik huruf.
lexical_decisions:
- source_word: Ἴδετε
  choice: Lihatlah
  rationale: Imperatif jamak ini berfungsi menarik perhatian pembaca secara langsung; “Lihatlah” ringkas, alami, dan mempertahankan daya serunya.
- source_word: πηλίκοις
  choice: betapa besar
  rationale: Kata ini menyatakan ukuran atau derajat. Bersama γράμμασιν, frasa ini paling wajar menunjuk pada besarnya bentuk huruf, sambil tetap mencerminkan nuansa seruan “betapa besar”.
- source_word: γράμμασιν
  choice: huruf-huruf
  rationale: Dalam konteks alat tulis dan penyebutan tangan Paulus sendiri, bentuk jamak ini paling alami dipahami sebagai aksara atau karakter tulisan, bukan isi surat.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Pronomina datif ini merupakan objek tak langsung dari tindakan menulis; bentuk “kepadamu” tepat dan alami dalam bahasa Indonesia.
- source_word: ἔγραψα
  choice: kutuliskan
  rationale: Aoristus menyatakan tindakan menulis. “Kutuliskan” terdengar alami untuk tulisan yang kini tampak di hadapan pembaca tanpa memaksakan pembedaan aspek yang tidak tersedia secara langsung dalam bahasa Indonesia.
- source_word: τῇ ἐμῇ χειρί
  choice: dengan tanganku sendiri
  rationale: Datif ini bersifat instrumental, sedangkan ἐμῇ bersifat menegaskan. Terjemahan ini mempertahankan penekanan bahwa Paulus menulis secara pribadi.
theological_decisions:
- issue: Makna πηλίκοις γράμμασιν
  choice: ukuran fisik huruf-huruf tulisan
  alternative: panjangnya surat yang ditulis Paulus sendiri
  rationale: Arti lazim γράμματα sebagai huruf atau karakter, ditambah frasa “dengan tanganku sendiri,” lebih mendukung rujukan pada ukuran tulisan tangan. Namun, karena πηλίκος dapat menunjuk pada besarnya sesuatu dan penafsiran tentang panjang surat memiliki dukungan historis, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Bentuk terikat “kutuliskan” dan “tanganku” menjaga kelancaran serta penekanan pribadi Paulus; penanda catatan kaki [a] dicantumkan dalam teks utama.
