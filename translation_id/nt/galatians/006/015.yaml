id: GAL.6.15
reference: Galatians 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: id
  text: Sebab bersunat tidak berarti apa-apa, demikian juga tidak bersunat; yang berarti ialah ciptaan baru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk baru”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Sebab ... tidak ... demikian juga tidak
  rationale: γάρ diterjemahkan sebagai “Sebab” untuk mempertahankan hubungan penjelasan dengan argumen sebelumnya, sedangkan pasangan οὔτε ... οὔτε dinyatakan secara alami dalam bahasa Indonesia dengan “tidak ... demikian juga tidak”.
- source_word: περιτομή
  choice: bersunat
  rationale: Bentuk verbal nominal ini alami dalam bahasa Indonesia dan tetap menunjuk pada tindakan maupun status sunat yang menjadi penanda identitas dalam konteks Paulus.
- source_word: τί ἐστιν
  choice: berarti apa-apa
  rationale: Ungkapan ini menyampaikan bahwa status tersebut tidak mempunyai arti atau nilai yang menentukan, sekaligus terdengar alami dan tetap dekat dengan idiom Yunani.
- source_word: ἀκροβυστία
  choice: tidak bersunat
  rationale: Dalam konteks ini kata tersebut menunjuk pada keadaan atau status orang yang tidak disunat, bukan semata-mata bagian tubuh secara harfiah.
- source_word: ἀλλὰ
  choice: yang berarti ialah
  rationale: Rumusan ini menyatakan pertentangan kuat yang ditandai ἀλλά dan melengkapi secara wajar klausa Yunani yang tidak memiliki kata kerja eksplisit pada bagian terakhir.
- source_word: καινὴ κτίσις
  choice: ciptaan baru
  rationale: “Ciptaan baru” mempertahankan keluasan κτίσις, yang dapat menunjuk pada karya penciptaan atau hasil ciptaan, tanpa membatasinya hanya pada seorang individu.
theological_decisions:
- issue: Pertentangan antara status sunat/tidak bersunat dan ciptaan baru
  choice: Terjemahan menyatakan bahwa kedua status itu tidak memiliki arti yang menentukan; yang menentukan ialah ciptaan baru.
  alternative: Kedua status hanya dipandang sebagai penanda sosial tanpa implikasi teologis yang lebih luas.
  rationale: Teks Yunani meniadakan arti kedua status tersebut lalu mempertentangkannya dengan “ciptaan baru”. Terjemahan mempertahankan ketegangan ini tanpa menjelaskan lebih jauh hakikat atau cakupan ciptaan baru.
- issue: Cakupan καινὴ κτίσις
  choice: ciptaan baru
  alternative: makhluk baru
  rationale: κτίσις dapat berarti “ciptaan” ataupun “makhluk”. Dalam konteks Paulus, “ciptaan baru” lebih mampu mempertahankan kemungkinan cakupan yang lebih luas, sementara alternatif individual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan hubungan penjelasan, kesejajaran negatif, dan pertentangan tajam dalam teks Yunani.
