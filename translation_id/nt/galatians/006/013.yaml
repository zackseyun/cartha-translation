    issue: Frasa “atas keadaan jasmani kalian” untuk ἐν τῇ ὑμετέρᾳ σαρκὶ.
    rationale: Preposisi ἐν secara normal menyatakan “dalam,” dan σάρξ di sini menunjuk daging/tubuh fisik yang menjadi lokasi tanda sunat. “Atas keadaan jasmani” mengubah relasi yang dinyatakan teks dan menambahkan abstraksi yang tidak ada dalam bahasa sumber.
  - severity: high
    issue: Catatan kaki menyebut adanya “varian tekstual” tanpa dasar dalam data sumber.
    rationale: SBLGNT yang diberikan memuat οἱ περιτεμνόμενοι. Alternatif aspek terjemahan seperti “telah disunat” bukan dengan sendirinya varian naskah. Catatan itu berpotensi memberi informasi tekstual yang keliru dan juga menambahkan penanda [a] yang tidak diperlukan.
  revised_text: Sebab, mereka yang disunat itu sendiri pun tidak menaati hukum Taurat, tetapi mereka ingin kalian disunat supaya mereka dapat bermegah dalam daging kalian.
