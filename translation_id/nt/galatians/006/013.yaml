revisions:
- from: Sebab mereka yang disunat itu sendiri pun tidak menaati hukum Taurat[a], tetapi mereka ingin supaya kalian disunat agar mereka dapat bermegah atas keadaan jasmani kalian.
  to: Sebab, mereka yang disunat itu sendiri pun tidak menaati hukum Taurat, tetapi mereka ingin kalian disunat supaya mereka dapat bermegah dalam daging kalian.
  rationale: Revisi mengganti “atas keadaan jasmani kalian” dengan “dalam daging kalian” untuk mempertahankan ἐν dan σάρξ secara langsung sambil membiarkan konteks sunat menentukan acuan fisiknya. Catatan kaki dihapus karena keliru mengklasifikasikan nuansa terjemahan partisipel sebagai varian tekstual. Tidak ada perubahan pada makna pokok atau pada identifikasi kelompok yang dimaksud.
