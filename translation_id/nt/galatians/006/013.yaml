reference: Galatians 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: id
  text: Sebab, mereka yang disunat itu sendiri pun tidak menaati hukum Taurat, tetapi mereka ingin kalian disunat supaya mereka dapat bermegah dalam daging kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sebab ... pun tidak
  rationale: Menjaga fungsi γάρ sebagai penghubung penjelasan dengan ayat sebelumnya dan tekanan οὐδέ, sambil memakai susunan Indonesia yang alami.
- source_word: οἱ περιτεμνόμενοι
  choice: mereka yang disunat
  rationale: Partisipel berartikel ini dipahami secara substantival dan menggambarkan kelompok tersebut berdasarkan sunat, tanpa mempersempitnya menjadi sekadar para penganjur sunat.
- source_word: αὐτοὶ
  choice: itu sendiri
  rationale: 'Menampilkan penekanan pada subjek: mereka sendiri yang disunat ternyata tidak menaati hukum Taurat.'
- source_word: νόμον φυλάσσουσιν
  choice: menaati hukum Taurat
  rationale: φυλάσσω dalam konteks ini berarti menjalankan atau mematuhi tuntutan hukum. 'Hukum Taurat' memperjelas acuan νόμος bagi pembaca Indonesia.
- source_word: ἀλλὰ θέλουσιν
  choice: tetapi mereka ingin
  rationale: Terjemahan langsung dan wajar yang mempertahankan unsur kehendak.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: supaya kalian disunat
  rationale: Mencerminkan bentuk pasif infinitif dan memakai 'kalian' untuk menandai bahwa ὑμᾶς berbentuk jamak.
- source_word: ἵνα
  choice: agar
  rationale: Menyatakan tujuan secara ringkas dan jelas.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: atas keadaan jasmani kalian
  rationale: Dalam konteks sunat, σάρξ menunjuk tubuh fisik beserta tanda sunatnya. Ungkapan ini menghindari salah pengertian bahwa yang dimaksud ialah 'natur berdosa', sekaligus menghasilkan bahasa Indonesia yang alami.
- source_word: καυχήσωνται
  choice: mereka dapat bermegah
  rationale: Mempertahankan istilah khas Paulus tentang menjadikan sesuatu sebagai dasar kebanggaan; konteks memberi nuansa negatif.
theological_decisions:
- issue: Makna σάρξ dalam konteks ini
  choice: tubuh atau keadaan jasmani yang ditandai oleh sunat
  alternative: natur berdosa; daging secara harfiah
  rationale: Konteks langsungnya adalah tindakan sunat pada tubuh orang-orang Galatia. Karena itu, makna jasmani paling kuat, bukan pengertian etis tentang natur berdosa.
- issue: Daya partisipel περιτεμνόμενοι
  choice: label deskriptif 'mereka yang disunat'
  alternative: '''mereka yang menyuruh orang disunat'' atau ''para penganjur sunat'''
  rationale: Bentuk Yunani mengidentifikasi kelompok itu melalui sunat. Konteks memang menunjukkan bahwa mereka mendorong sunat, tetapi terjemahan tidak perlu memasukkan penafsiran tersebut ke dalam partisipel.
- issue: Cakupan νόμος
  choice: hukum Taurat
  alternative: hukum secara umum
  rationale: Dalam perdebatan Galatia mengenai sunat, νόμος mengacu pada Taurat. Penyebutan ini tidak menentukan secara lebih sempit bagian hukum mana yang gagal mereka taati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalian' dipakai untuk membedakan orang kedua jamak. 'Bermegah' dipertahankan sebagai istilah bermartabat yang sesuai dengan retorika Paulus; 'keadaan jasmani' membuat acuan tubuh dalam konteks sunat jelas tanpa mengimpor makna 'natur berdosa'.
