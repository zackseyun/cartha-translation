revisions:
- from: Orang-orang yang ingin menampilkan diri dengan baik dalam hal jasmani[a], merekalah yang memaksa kalian untuk disunat. Mereka melakukan itu hanya supaya tidak dianiaya karena salib Mesias[b][c].
  to: Semua orang yang ingin tampil baik secara lahiriah[a], merekalah yang memaksa kalian untuk disunat. Mereka melakukan itu hanya supaya mereka tidak dianiaya karena salib Mesias[b][c].
  rationale: Revisi mengganti padanan utama ἐν σαρκί dengan ungkapan Indonesia yang lebih tepat bagi kontras lahiriah yang dimaksud Paulus, sambil mempertahankan istilah harfiah dalam catatan kaki. Rujukan subjek pada tujuan penghindaran penganiayaan dibuat eksplisit. Makna, penegasan οὗτοι melalui “merekalah,” paksaan untuk disunat, serta ambiguitas terbatas dari datif τῷ σταυρῷ tetap dipertahankan.
