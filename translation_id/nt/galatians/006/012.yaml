id: GAL.6.12
reference: Galatians 6:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: id
  text: Semua orang yang ingin tampil baik secara lahiriah[a], merekalah yang memaksa kalian untuk disunat. Mereka melakukan itu hanya supaya mereka tidak dianiaya karena salib Mesias[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat kesan baik secara lahiriah.” Secara harfiah, “dalam daging.”
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk tradisional: “salib Kristus.”'
    reason: alternative_reading
  - marker: c
    text: Atau, “supaya mereka tidak dianiaya sehubungan dengan salib Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: Orang-orang yang
  rationale: Mengacu secara menyeluruh pada kelompok yang memiliki keinginan tersebut; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan formal yang kaku.
- source_word: θέλουσιν
  choice: ingin
  rationale: Menyatakan kehendak atau keinginan secara langsung dalam bahasa Indonesia modern.
- source_word: εὐπροσωπῆσαι
  choice: menampilkan diri dengan baik
  rationale: Mengungkapkan usaha untuk terlihat mengesankan atau memperoleh penilaian baik, sambil mempertahankan unsur penampilan diri yang tersirat dalam verba Yunani.
- source_word: ἐν σαρκί
  choice: dalam hal jasmani
  rationale: Mempertahankan kaitan dengan σάρξ dan penanda tubuh, khususnya sunat, tetapi dalam bentuk Indonesia yang lebih wajar daripada frasa harfiah 'dalam daging'. Catatan kaki memberi padanan idiomatisnya.
- source_word: οὗτοι
  choice: merekalah
  rationale: 'Partikel -lah mempertahankan penegasan demonstratif: justru orang-orang itu yang melakukan pemaksaan.'
- source_word: ἀναγκάζουσιν
  choice: memaksa
  rationale: Menyampaikan tekanan atau paksaan yang sedang mereka berikan dengan jelas dan alami.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: kalian untuk disunat
  rationale: Mempertahankan orang kedua jamak dan bentuk pasif tindakan sunat.
- source_word: μόνον ἵνα
  choice: hanya supaya
  rationale: Menandai satu-satunya tujuan atau motif yang Paulus nisbahkan kepada mereka.
- source_word: τῷ σταυρῷ
  choice: karena salib
  rationale: Datif bersama verba pasif διώκωνται paling wajar dipahami secara kausal atau dalam kaitan dengan salib; 'karena' alami dalam bahasa Indonesia, sedangkan kemungkinan yang lebih umum dicatat dalam catatan kaki.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam frasa ini, sehingga maknanya diterjemahkan sebagai 'Mesias', bukan sekadar ditransliterasikan.
- source_word: μὴ διώκωνται
  choice: supaya tidak dianiaya
  rationale: Mempertahankan bentuk pasif dan tujuan penghindaran yang dinyatakan oleh subjunktif sesudah ἵνα.
theological_decisions:
- issue: Makna ἐν σαρκί dalam konteks sunat
  choice: dalam hal jasmani
  alternative: 'secara lahiriah; harfiah: dalam daging'
  rationale: Ungkapan ini menunjuk pada penampilan atau penanda tubuh yang kelihatan, terutama sunat, tetapi tetap membawa gema istilah khas Paulus tentang 'daging'. Terjemahan utama menjaga kaitan jasmaninya tanpa menafsirkannya sebagai 'tabiat berdosa'.
- issue: Penerjemahan Χριστοῦ dalam τῷ σταυρῷ τοῦ Χριστοῦ
  choice: salib Mesias
  alternative: salib Kristus
  rationale: Dalam konstruksi ini, Χριστός tetap bermakna gelar, sehingga 'Mesias' dipilih. Bentuk tradisional 'Kristus' dipertahankan dalam catatan kaki.
- issue: Hubungan datif τῷ σταυρῷ dengan διώκωνται
  choice: dianiaya karena salib
  alternative: dianiaya sehubungan dengan salib
  rationale: Datif dapat menyatakan sebab atau hubungan/acuan. Teks utama memakai hubungan kausal yang paling sesuai dengan konteks, sementara catatan kaki mempertahankan kemungkinan ungkapan yang kurang menentukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dan mudah dipahami, tanpa mengubah hubungan tujuan pada μόνον ἵνα.
