  naturalness: Bahasa Indonesia modern, jelas, dan bernada pantas. “Tanggunglah beban satu sama lain” merupakan ungkapan yang idiomatis dan ringkas. Pemakaian “kalian” secara wajar menandai bentuk jamak penerima perintah.
