  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: id
  text: Tanggunglah beban satu sama lain, dan dengan demikian kalian akan memenuhi hukum Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hukum Kristus.”'
    reason: Padanan tradisional untuk gelar Yunani Χριστός.
lexical_decisions:
- source_word: ἀλλήλων
  choice: satu sama lain
  rationale: Pronomina timbal balik ini menyatakan kewajiban yang saling dilakukan di dalam komunitas; frasa ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: τὰ βάρη
  choice: beban
  rationale: βάρη secara harfiah berarti beban atau sesuatu yang berat, dan di sini digunakan secara metaforis untuk kesulitan yang ditanggung seseorang.
- source_word: βαστάζετε
  choice: Tanggunglah
  rationale: Bentuk imperatif jamak dipertahankan sebagai perintah langsung. “Menanggung beban” merupakan padanan Indonesia yang alami dan tidak menambahkan gagasan bantuan yang tidak dinyatakan secara eksplisit.
- source_word: οὕτως
  choice: dengan demikian
  rationale: Ungkapan ini menghubungkan tindakan menanggung beban dengan hasilnya, sambil tetap ringkas dan wajar dalam ragam bahasa yang bermartabat.
- source_word: ἀναπληρώσετε
  choice: kalian akan memenuhi
  rationale: Bentuk futurum indikatif jamak dipertahankan. “Memenuhi” merupakan kolokasi yang alami dengan “hukum” dan menyampaikan hasil dari menaati perintah tersebut.
- source_word: τὸν νόμον
  choice: hukum
  rationale: νόμος paling langsung berarti “hukum”; pilihan ini mempertahankan gema etis dan teologis istilah Paulus tanpa mempersempitnya menjadi sekadar prinsip.
- source_word: τοῦ Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan menurut maknanya. Partikel “Sang” menandai gelar secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Bentuk ini mempertahankan makna gelar Χριστός dan latar kemesiasannya. “Kristus” tetap dicatat sebagai padanan tradisional yang sangat dikenal.
- issue: Makna “hukum Sang Mesias”
  choice: Mempertahankan ungkapan genitif tanpa penjelasan tambahan
  alternative: hukum yang diajarkan Sang Mesias / hukum yang berasal dari Sang Mesias
  rationale: Genitif Yunani dapat menunjukkan hukum yang terkait dengan, dimiliki oleh, atau dicirikan oleh Mesias. Terjemahan tidak menentukan salah satu hubungan tersebut secara sempit.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada langsung dan bermartabat. “Kalian” dipakai untuk menampilkan bentuk jamak dari verba Yunani dengan jelas; struktur ayat tetap ringkas dan mempertahankan hubungan perintah-hasil dalam teks sumber.
