  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: id
  text: Namun, sekali-kali janganlah aku bermegah, kecuali dalam salib Tuhan kita Yesus Sang Mesias,[a] yang melaluinya dunia telah disalibkan bagiku, dan aku bagi dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melalui Dia,” jika kata ganti relatif itu dipahami merujuk kepada Tuhan Yesus Sang Mesias, bukan kepada “salib.”'
    reason: alternative_reading
  - marker: b
    text: 'Artinya: “dan aku telah disalibkan bagi dunia.” Kata kerja pada bagian kedua ini tidak diulangi dalam teks Yunani, tetapi dipahami dari klausa sebelumnya.'
    reason: ellipsis_clarification
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: aku sekali-kali tidak mau
  rationale: Ungkapan penolakan yang sangat tegas dan bersifat pribadi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: καυχᾶσθαι
  choice: bermegah
  rationale: Istilah Paulus yang dalam konteks ini menunjuk pada kebanggaan atau dasar untuk membanggakan diri; 'bermegah' mempertahankan nuansa teologis sekaligus kontras dengan konteks ayat-ayat sebelumnya.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Menandai satu-satunya dasar bermegah yang diakui Paulus.
- source_word: σταυρῷ
  choice: salib
  rationale: Padanan baku dan tepat secara kontekstual bagi σταυρός dalam pemberitaan sengsara Yesus dan teologi Paulus.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku κύριος dalam sebutan pengakuan iman Perjanjian Baru.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Menerjemahkan makna gelar Χριστός, bukan sekadar mentransliterasikannya; 'Sang' menandai fungsi gelar secara alami dan terhormat dalam bahasa Indonesia.
- source_word: δι’ οὗ
  choice: yang melaluinya
  rationale: Secara gramatikal paling langsung merujuk kepada 'salib' dan menyatakan sarana; ambiguitas kemungkinan rujukan kepada Yesus Sang Mesias dicatat dalam catatan kaki.
- source_word: κόσμος
  choice: dunia
  rationale: Padanan luas dan baku yang mempertahankan kemungkinan cakupan metaforis dunia sebagai tatanan yang berlawanan dengan Allah tanpa mempersempitnya dalam teks utama.
- source_word: ἐσταύρωται
  choice: telah disalibkan
  rationale: 'Mempertahankan metafora serta aspek perfektum: tindakan telah terjadi dengan akibat yang tetap berlaku.'
- source_word: κἀγὼ κόσμῳ
  choice: dan aku bagi dunia
  rationale: Mempertahankan elipsis verba dalam teks Yunani dan paralelisme yang ringkas; verba 'telah disalibkan' dipahami dari klausa sebelumnya.
theological_decisions:
- issue: Makna gelar Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός bermakna 'Yang Diurapi/Mesias' dan di sini berfungsi dalam sebutan gelar-nama. Terjemahan ini mengungkapkan isi gelarnya tanpa memasukkan kekhasan denominasi.
- issue: Anteseden dan daya δι’ οὗ
  choice: 'salib sebagai anteseden: ''yang melaluinya'''
  alternative: 'Tuhan Yesus Sang Mesias sebagai anteseden: ''melalui Dia'''
  rationale: Anteseden terdekat yang cocok secara gramatikal ialah σταυρῷ, sehingga salib merupakan rujukan paling langsung. Namun, karena bentuk maskulin οὗ juga dapat dipahami merujuk kepada Yesus Sang Mesias, kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Elipsis dalam κἀγὼ κόσμῳ
  choice: 'mempertahankan elipsis: ''dan aku bagi dunia'''
  alternative: 'menyatakan verba secara lengkap: ''dan aku telah disalibkan bagi dunia'''
  rationale: Bentuk ringkas mempertahankan paralelisme retoris Yunani dan tetap dapat dipahami dalam bahasa Indonesia; catatan kaki menyediakan bentuk eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Namun' menyampaikan δέ secara alami; 'sekali-kali tidak mau' mempertahankan penolakan pribadi yang kuat. Kapitalisasi 'Sang Mesias' menandai gelar. Teks utama mempertahankan metafora salib, aspek perfektum, ambiguitas δι’ οὗ melalui catatan kaki, dan elipsis klausa penutup.
