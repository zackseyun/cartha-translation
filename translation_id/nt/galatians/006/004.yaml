  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: id
  text: Namun, hendaklah setiap orang menguji pekerjaannya sendiri. Sesudah itu, ia akan mempunyai alasan untuk bermegah hanya sehubungan dengan dirinya sendiri, bukan dengan orang lain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bukan sehubungan dengan yang lain,” yaitu orang lain yang dibandingkan dengan dirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔργον ἑαυτοῦ
  choice: pekerjaannya sendiri
  rationale: Frasa ini menunjuk secara luas pada apa yang dilakukan atau dihasilkan seseorang. Pilihan ini mempertahankan cakupan ἔργον tanpa mempersempitnya menjadi satu perbuatan tertentu.
- source_word: δοκιμαζέτω
  choice: hendaklah ... menguji
  rationale: Bentuk imperatif ini memerintahkan pemeriksaan untuk mengetahui mutu sesuatu; 'menguji' tidak mengandaikan bahwa hasil penilaiannya pasti baik.
- source_word: ἕκαστος
  choice: setiap orang
  rationale: Ungkapan ini mempertahankan daya distributif kata Yunani dan wajar dalam bahasa Indonesia modern.
- source_word: καύχημα
  choice: alasan untuk bermegah
  rationale: καύχημα dapat menunjuk pada hal atau dasar yang menjadi alasan untuk bermegah, bukan hanya tindakan bermegah itu sendiri.
- source_word: εἰς ἑαυτὸν μόνον
  choice: hanya sehubungan dengan dirinya sendiri
  rationale: Pilihan ini mempertahankan fokus refleksif dan daya pembatas μόνον, serta menunjukkan bahwa dasar penilaian itu berasal dari pekerjaannya sendiri, bukan dari perbandingan.
- source_word: τὸν ἕτερον
  choice: orang lain
  rationale: Dalam konteks ini ἕτερον menunjuk pada pribadi lain yang dikontraskan dengan diri sendiri; 'orang lain' jelas dan alami dalam bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: δέ menandai peralihan dengan kontras ringan dari konteks sebelumnya; 'Namun' menyampaikannya secara alami tanpa membuat pertentangan terlalu tajam.
theological_decisions:
- issue: Makna καύχημα dalam konteks Paulus
  choice: alasan untuk bermegah
  alternative: kemegahan; dasar untuk bermegah
  rationale: Terjemahan ini menjaga kemungkinan bahwa kata tersebut menunjuk pada dasar atau perkara yang dibanggakan, tanpa menentukan apakah sikap itu merupakan kepuasan diri yang terpuji atau sekadar alasan sah untuk berkeyakinan.
- issue: Kontras antara penilaian diri dan perbandingan dengan orang lain
  choice: hanya sehubungan dengan dirinya sendiri, bukan dengan orang lain
  alternative: dalam dirinya sendiri saja dan bukan dalam orang lain
  rationale: Rumusan ini mempertahankan kontras teks sambil menghindari kesan bahwa Paulus mengajarkan pemegahan yang bersumber pada nilai diri secara terpisah dari pekerjaan yang baru saja diuji.
- issue: Bentuk maskulin tunggal yang bersifat generik
  choice: setiap orang ... ia ... dirinya sendiri
  alternative: masing-masing ... mereka ... diri mereka sendiri
  rationale: Bahasa Indonesia memungkinkan subjek tunggal generik dipertahankan secara alami dengan 'setiap orang' dan 'ia', tanpa menjadikan ayat ini khusus untuk laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dipecah menjadi dua kalimat agar hubungan hasil pada καὶ τότε tetap jelas. 'Bermegah' dipertahankan sebagai istilah yang cukup alami dalam register Alkitabiah dan tidak disamakan begitu saja dengan kesombongan.
