id: GAL.2.18
reference: Galatians 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: id
  text: Sebab, jika aku membangun kembali apa yang telah kuruntuhkan, aku membuktikan bahwa diriku adalah seorang pelanggar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku menunjukkan bahwa diriku adalah seorang pelanggar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan daya penjelas γάρ dan daya bersyarat εἰ dalam susunan bahasa Indonesia yang wajar.
- source_word: ἃ ... ταῦτα
  choice: apa yang ... itu
  rationale: Dalam bahasa Indonesia, objek korelatif Yunani ini dapat disampaikan secara alami dengan 'apa yang'; rujukannya tetap sengaja tidak diperjelas.
- source_word: κατέλυσα
  choice: telah kuruntuhkan
  rationale: Menjaga metafora bangunan yang berpasangan dengan οἰκοδομῶ tanpa mempersempit maknanya menjadi penghapusan hukum secara eksplisit.
- source_word: πάλιν οἰκοδομῶ
  choice: membangun kembali
  rationale: Padanan idiomatis yang mempertahankan unsur pengulangan πάλιν dan metafora membangun.
- source_word: παραβάτην
  choice: seorang pelanggar
  rationale: Mempertahankan nuansa moral-hukum tanpa menambahkan objek pelanggaran yang tidak dinyatakan dalam teks.
- source_word: ἐμαυτὸν συνιστάνω
  choice: aku membuktikan bahwa diriku adalah
  rationale: Menyampaikan tindakan menunjukkan atau menetapkan diri sendiri sebagai sesuatu, termasuk daya implikasi terhadap diri Paulus.
theological_decisions:
- issue: Objek dari tindakan meruntuhkan dan membangun kembali
  choice: Dibiarkan tidak disebutkan sebagai 'apa yang'
  alternative: Menjelaskannya sebagai hukum Taurat, tuntutan hukum, atau cara hidup lama
  rationale: Teks Yunani memakai rujukan umum ἃ ... ταῦτα; penjelasan teologis yang lebih khusus akan menghilangkan ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Metafora meruntuhkan dan membangun kembali dipertahankan; 'pelanggar' dipilih agar tidak mempersempit παραβάτης menjadi 'pelanggar hukum Taurat' secara eksplisit.
