id: GAL.2.11
reference: Galatians 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: id
  text: Namun, ketika Kefas datang ke Antiokhia,[a] aku menentangnya secara langsung,[b] karena ia memang patut dicela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kefas adalah nama Aram Petrus.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “di depan mukanya”; maksudnya, Paulus menentangnya secara terbuka dan langsung.
    reason: lexical_alternative
  - marker: c
    text: Atau, “karena ia jelas bersalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Namun, ketika
  rationale: Menjaga hubungan waktu sekaligus kontras ringan dari δέ dalam bahasa Indonesia modern.
- source_word: Κηφᾶς
  choice: Kefas
  rationale: Mentransliterasikan bentuk nama yang terdapat dalam teks Yunani, tanpa menggantinya dengan nama Petrus yang lebih dikenal.
- source_word: ἦλθεν
  choice: datang
  rationale: Padanan wajar bagi ἔρχομαι dalam konteks kedatangan ke sebuah kota.
- source_word: εἰς Ἀντιόχειαν
  choice: ke Antiokhia
  rationale: Ungkapan Indonesia yang alami untuk gerak menuju sebuah kota.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: secara langsung
  rationale: Menyampaikan konfrontasi terbuka dan langsung tanpa ungkapan 'di hadapannya' yang dapat disalahpahami sekadar sebagai keterangan lokasi.
- source_word: ἀντέστην
  choice: aku menentangnya
  rationale: Mengungkapkan tindakan Paulus yang melawan atau menghadapi Kefas secara terbuka.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan Paulus menentang Kefas.
- source_word: κατεγνωσμένος ἦν
  choice: ia berada dalam keadaan terhukum
  rationale: Mempertahankan bentuk pasif dan nuansa keadaan hasil dari konstruksi perifrastik, meskipun ungkapannya sengaja agak formal.
theological_decisions:
- issue: Identitas dan bentuk nama Κηφᾶς
  choice: Memakai 'Kefas' dalam teks utama
  alternative: Memakai 'Petrus' agar lebih mudah dikenali
  rationale: Teks Yunani memakai Κηφᾶς; transliterasi mempertahankan bentuk sumber, sedangkan identifikasinya dengan Petrus dijelaskan dalam catatan kaki.
- issue: Makna κατεγνωσμένος ἦν
  choice: ia berada dalam keadaan terhukum
  alternative: ia jelas bersalah
  rationale: Pilihan utama mempertahankan pasif dan tidak menentukan secara berlebihan apakah yang ditekankan ialah putusan pihak lain, keadaan objektif, atau kesalahan yang nyata; alternatif yang lebih idiomatis dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus. Susunan akhir dibuat agak formal untuk mempertahankan ambiguitas dan nuansa pasif teks Yunani.
