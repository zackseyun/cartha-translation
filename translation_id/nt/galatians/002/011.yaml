revisions:
- from: Namun, ketika Kefas datang ke Antiokhia,[a] aku menentangnya secara langsung,[b] karena ia berada dalam keadaan terhukum.
  to: Namun, ketika Kefas datang ke Antiokhia,[a] aku menentangnya secara langsung,[b] karena ia memang patut dicela.[c]
  rationale: Revisi hanya memperbaiki idiom Indonesia pada klausa terakhir dan menata ulang jangkar catatan kaki. “Patut dicela” mempertahankan inti pasif-evaluatif dari κατεγνωσμένος ἦν tanpa mengklaim secara eksplisit siapa yang menghakimi Kefas. Catatan [c] menyediakan pembacaan yang lebih interpretatif namun lazim, sementara [b] kini hanya menjelaskan idiom konfrontasi langsung.
