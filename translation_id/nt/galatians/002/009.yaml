  source_fidelity: Revisi diperlukan karena “jemaat” bukan bagian dari στῦλοι dan secara tidak perlu mempersempit metafora sumber. Kontras ἔθνη dengan περιτομήν lebih jelas dan tepat dalam konteks ini bila diterjemahkan “orang-orang bukan Yahudi” dan “orang-orang yang bersunat.”
  naturalness: Kalimat revisi tetap baku dan alami. “Menyadari” menangkap γνόντες sebagai pengenalan yang menjadi dasar tindakan berikutnya tanpa menekankan urutan waktu secara berlebihan. “Mengulurkan tangan kanan sebagai tanda persekutuan” merupakan pengungkapan idiomatis yang wajar untuk gestur συμφakatan/κοινωνία.
  terminology: “Anugerah,” “Kefas,” dan “persekutuan” dipertahankan. Nama Κηφᾶς tetap ditransliterasikan sebagai “Kefas.” Metafora “tiang-tiang” dipertahankan tanpa tambahan interpretatif “jemaat.”
  issues:
  - severity: medium
    issue: Tambahan “jemaat” dalam “tiang-tiang jemaat”
    rationale: Teks Yunani hanya menyebut “mereka yang dipandang sebagai tiang-tiang”; tidak ada padanan eksplisit untuk “jemaat.” Tambahan ini menafsirkan metafora dan sebaiknya dihapus.
  - severity: low
    issue: “Setelah mengetahui” memberi penekanan temporal yang lebih kuat
    rationale: Partisip γνόντες terutama menyatakan pengenalan sebagai dasar tindakan. “Menyadari” menyampaikan hubungan ini dengan lebih netral dalam bahasa Indonesia.
  - severity: low
    issue: “Bangsa-bangsa lain” dapat terdengar geopolitik
    rationale: Dalam kontras langsung dengan “yang bersunat,” τὰ ἔθνη menunjuk kepada orang-orang bukan Yahudi. Terjemahan tersebut memperjelas rujukan kontekstual tanpa mengubah kontras sumber.
