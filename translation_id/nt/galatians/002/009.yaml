revisions:
- from: dan setelah mengetahui anugerah yang telah diberikan kepadaku, Yakobus, Kefas, dan Yohanes—yang dipandang sebagai tiang-tiang jemaat—mengulurkan tangan kanan kepada Barnabas dan kepadaku sebagai tanda persekutuan,[a] supaya kami pergi kepada bangsa-bangsa lain, sedangkan mereka kepada orang-orang bersunat.[b]
  to: Dan setelah menyadari anugerah yang telah diberikan kepadaku, Yakobus, Kefas, dan Yohanes—yang dipandang sebagai tiang-tiang—mengulurkan tangan kanan sebagai tanda persekutuan kepada Barnabas dan kepadaku,[a] supaya kami pergi kepada orang-orang bukan Yahudi, sedangkan mereka kepada orang-orang yang bersunat.[b]
  rationale: Revisi menghapus tambahan “jemaat,” yang tidak ada dalam teks Yunani, dan memperjelas dua kelompok misi sesuai kontras τὰ ἔθνη dan τὴν περιτομήν. Idiom δεξιὰς ... κοινωνίας tetap diterjemahkan secara alami, sementara bentuk dan kemungkinan leksikal yang lebih dekat dengan sumber dicatat dalam catatan kaki.
