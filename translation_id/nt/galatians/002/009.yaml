  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: id
  text: Dan setelah menyadari anugerah yang telah diberikan kepadaku, Yakobus, Kefas, dan Yohanes—yang dipandang sebagai tiang-tiang—mengulurkan tangan kanan sebagai tanda persekutuan kepada Barnabas dan kepadaku,[a] supaya kami pergi kepada orang-orang bukan Yahudi, sedangkan mereka kepada orang-orang yang bersunat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai tanda kemitraan.” Secara harfiah, “memberikan tangan-tangan kanan persekutuan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada yang bersunat,” yaitu orang-orang Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: setelah mengetahui
  rationale: Partisip aoris menyatakan pengenalan yang menjadi dasar tindakan berikutnya. 'Setelah mengetahui' alami dalam bahasa Indonesia dan tidak memaksakan perbedaan antara mengetahui dan mengakui.
- source_word: χάριν
  choice: anugerah
  rationale: Mempertahankan cakupan luas χάρις sebagai kemurahan ilahi yang bekerja dalam panggilan dan pelayanan Paulus, tanpa mempersempitnya menjadi sekadar tugas kerasulan.
- source_word: δοθεῖσάν μοι
  choice: yang telah diberikan kepadaku
  rationale: Bentuk pasif dan tindakan yang mendahului penguluran tangan dipertahankan secara alami.
- source_word: Κηφᾶς
  choice: Kefas
  rationale: Mentransliterasikan nama yang dipakai teks Yunani, bukan menggantinya dengan Petrus.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: yang dipandang sebagai tiang-tiang jemaat
  rationale: '''Dipandang sebagai'' menyampaikan kedudukan yang diakui tanpa nada meremehkan. ''Jemaat'' ditambahkan secara implisit untuk membuat metafora dapat dipahami dalam bahasa Indonesia.'
- source_word: δεξιὰς ... κοινωνίας
  choice: mengulurkan tangan kanan ... sebagai tanda persekutuan
  rationale: Mengungkapkan idiom tentang gestur persetujuan dan kebersamaan misi secara wajar. Bahasa Indonesia lazim memakai bentuk distributif tunggal 'tangan kanan' walaupun Yunani memakai jamak δεξιάς.
- source_word: ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam konteks ini menunjuk kepada kelompok-kelompok bukan Yahudi; pilihan ini mempertahankan unsur leksikal 'bangsa-bangsa' sekaligus memperjelas kontrasnya.
- source_word: περιτομήν
  choice: orang-orang bersunat
  rationale: Menerjemahkan metonimia 'sunat' sebagai kelompok manusia yang dimaksud, yaitu orang Yahudi, tanpa menghapus citra sumber.
theological_decisions:
- issue: Makna κοινωνία dalam δεξιὰς κοινωνίας
  choice: persekutuan
  alternative: kemitraan
  rationale: Konteksnya mencakup pengakuan, kesepakatan, dan partisipasi bersama dalam misi. 'Persekutuan' mempertahankan keluasan relasional κοινωνία, sedangkan catatan kaki menyebut kemungkinan 'kemitraan'.
- issue: Referen εἰς τὴν περιτομήν
  choice: kepada orang-orang bersunat
  alternative: kepada orang-orang Yahudi
  rationale: Terjemahan utama mempertahankan metonimia teks dan ketegangan retoris dengan 'bangsa-bangsa lain'; catatan kaki menjelaskan referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur Yunani sambil memakai idiom Indonesia yang alami. Tanda pisah membantu menandai keterangan tentang Yakobus, Kefas, dan Yohanes.
