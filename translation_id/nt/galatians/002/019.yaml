  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: id
  text: Sebab melalui hukum Taurat aku telah mati terhadap hukum Taurat, supaya aku hidup bagi Allah. Aku telah disalibkan bersama Mesias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan yang menjelaskan pernyataan sebelumnya dan mempertahankan alur argumentasi secara alami dalam bahasa Indonesia.
- source_word: διὰ νόμου
  choice: melalui hukum Taurat
  rationale: διά dengan genetif menyatakan sarana. Dalam konteks Paulus ini, νόμος merujuk pada hukum Taurat; bentuk tanpa artikel dalam bahasa Yunani tidak mengharuskan terjemahan tanpa penentu dalam bahasa Indonesia.
- source_word: νόμῳ
  choice: terhadap hukum Taurat
  rationale: Datif ini menyatakan hubungan atau ranah yang telah diputus oleh kematian; 'mati terhadap' mempertahankan ungkapan padat teks tanpa menambahkan tafsiran.
- source_word: ἀπέθανον
  choice: aku telah mati
  rationale: Aoristus menunjuk pada peristiwa yang tegas. Bentuk 'telah mati' alami dalam bahasa Indonesia dan menegaskan keadaan yang dihasilkan tanpa menyamakan bentuk Yunani ini dengan perfektum.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan secara ringkas dan alami.
- source_word: θεῷ ζήσω
  choice: aku hidup bagi Allah
  rationale: Datif θεῷ dapat menyatakan orientasi atau relasi. 'Bagi Allah' merupakan ungkapan Indonesia yang wajar sambil mempertahankan arah hidup kepada Allah.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Mempertahankan Χριστός sebagai gelar mesianik, bukan sekadar mengalihaksarakannya menjadi nama.
- source_word: συνεσταύρωμαι
  choice: Aku telah disalibkan bersama
  rationale: Perfektum pasif menyatakan penyaliban yang telah terjadi dengan hasil yang tetap berlaku; 'telah disalibkan bersama' menyampaikan tindakan lampau dan kebersamaan dengan Mesias.
theological_decisions:
- issue: Apakah hubungan paradoksal dengan hukum Taurat perlu dijelaskan di dalam teks
  choice: Mempertahankan rumusan padat 'melalui hukum Taurat ... mati terhadap hukum Taurat'.
  alternative: Melalui hukuman hukum Taurat aku mati terhadap hukum Taurat; atau melalui hukum Taurat aku dibebaskan dari kewajiban menaatinya.
  rationale: Teks Yunani tidak menyebut 'hukuman' maupun menjabarkan jenis keterputusan yang dimaksud. Terjemahan tidak seharusnya menyelesaikan ketegangan teologis ini secara diam-diam.
- issue: Makna datif θεῷ
  choice: '''bagi Allah'' sebagai orientasi hidup kepada Allah.'
  alternative: '''untuk Allah'' atau ''terhadap Allah''.'
  rationale: '''Bagi Allah'' adalah bahasa Indonesia yang alami dan cukup luas untuk memuat dimensi relasional serta tujuan tanpa mereduksinya menjadi sekadar kegunaan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'hukum Taurat' sengaja dipertahankan agar paradoks retoris Yunani tetap terdengar. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau ambiguitas yang perlu ditandai di luar keputusan terjemahan.
