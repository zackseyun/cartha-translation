revisions:
- from: Namun, karena saudara-saudara palsu[a] yang disusupkan itu—mereka menyelinap masuk untuk memata-matai kebebasan yang kita miliki dalam Mesias Yesus[b], supaya mereka dapat memperbudak kita—
  to: Namun, karena saudara-saudara palsu[a] yang diam-diam disusupkan, yang menyelinap masuk untuk memata-matai kebebasan yang kita miliki dalam Mesias Yesus[b], supaya mereka memperbudak kita—
  rationale: Revisi ini menyatakan secara eksplisit unsur rahasia pada παρεισάκτους, mempertahankan klausa relatif οἵτινες sebagai “yang menyelinap masuk,” dan menerjemahkan klausa tujuan ἵνα secara langsung. Tanda pisah terakhir dipertahankan karena kalimat Yunani berlanjut ke ayat 5.
