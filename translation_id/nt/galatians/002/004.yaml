id: GAL.2.4
reference: Galatians 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: id
  text: Namun, karena saudara-saudara palsu[a] yang diam-diam disusupkan, yang menyelinap masuk untuk memata-matai kebebasan yang kita miliki dalam Mesias Yesus[b], supaya mereka memperbudak kita—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “saudara-saudara palsu” mempertahankan istilah kekeluargaan Paulus dan menunjuk kepada orang-orang yang menampilkan diri sebagai sesama orang percaya.
    reason: cultural_note
  - marker: b
    text: Atau “Kristus Yesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: yang disusupkan
  rationale: Bentuk pasif ini menunjukkan bahwa mereka dimasukkan dari luar secara tersembunyi; pilihan ini juga membedakannya dari verba berikutnya, παρεισῆλθον.
- source_word: ψευδαδέλφους
  choice: saudara-saudara palsu
  rationale: Mempertahankan metafora kekeluargaan dan daya polemis Paulus, sambil tetap wajar dalam bahasa Indonesia.
- source_word: παρεισῆλθον
  choice: menyelinap masuk
  rationale: Mengungkapkan tindakan masuk secara diam-diam dan berniat buruk tanpa mengulang secara datar gagasan pada παρεισάκτους.
- source_word: κατασκοπῆσαι
  choice: untuk memata-matai
  rationale: Menjaga nuansa pengamatan rahasia yang bermusuhan, lebih tajam daripada sekadar 'mengamati'.
- source_word: ἐλευθερίαν
  choice: kebebasan
  rationale: Padanan Indonesia modern yang alami dan mempertahankan bobot sosial serta teologis istilah tersebut.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Menerjemahkan Χριστός sebagai gelar yang masih bermakna jelas dalam konteks ini, sedangkan nama Ἰησοῦ ditransliterasikan secara lazim.
- source_word: καταδουλώσουσιν
  choice: memperbudak
  rationale: Menyatakan secara langsung tindakan menjadikan orang berada dalam perbudakan dan mempertahankan kerasnya gambaran sumber.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: supaya mereka dapat memperbudak kita
  rationale: Mengungkapkan maksud atau tujuan secara alami. Kata 'dapat' tidak memastikan keberhasilan rencana mereka, sementara konstruksi tujuan tetap terdengar jelas.
theological_decisions:
- issue: Χριστῷ dipahami sebagai gelar atau bentuk yang menyerupai nama diri
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam frasa ini, gelar Χριστός masih dapat didengar secara bermakna sebagai 'Mesias'. Alternatif 'Kristus Yesus' tetap dicatat karena bentuk itu telah mapan dalam tradisi Indonesia dan dapat dipahami sebagai gelar yang ditransliterasikan.
- issue: Identitas ψευδαδέλφοι
  choice: saudara-saudara palsu
  alternative: orang-orang yang mengaku sebagai sesama orang percaya
  rationale: Terjemahan utama mempertahankan bahasa kekeluargaan Paulus tanpa memutuskan lebih jauh status rohani mereka; catatan menjelaskan fungsi ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat sengaja dibiarkan berlanjut dengan tanda pisah pada akhir ayat karena teks Yunani merupakan bagian dari kalimat yang diteruskan ke ayat 5. 'Yang disusupkan' dan 'menyelinap masuk' mempertahankan dua ungkapan Yunani yang berdekatan tetapi berbeda.
