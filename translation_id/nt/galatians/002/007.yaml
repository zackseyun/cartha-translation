id: GAL.2.7
reference: Galatians 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: id
  text: Sebaliknya, ketika mereka melihat bahwa kepadaku telah dipercayakan Injil bagi orang-orang yang tidak bersunat, sama seperti kepada Petrus telah dipercayakan Injil bagi orang-orang yang bersunat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Injil ketidaksunatan … sunat,” yakni Injil yang dipercayakan bagi masing-masing kelompok itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Sebaliknya
  rationale: Gabungan ini menyatakan pertentangan yang tegas dengan gagasan sebelumnya; 'Sebaliknya' menyampaikan daya kontrasnya secara alami tanpa pengulangan yang kaku.
- source_word: ἰδόντες
  choice: ketika mereka melihat
  rationale: Partisip aoris ini menyatakan keadaan yang menyertai gagasan utama; bentuk klausa ini jelas dan wajar dalam bahasa Indonesia.
- source_word: πεπίστευμαι
  choice: kepadaku telah dipercayakan
  rationale: Bentuk perfek pasif menunjuk pada pemberian amanat yang tetap berlaku. Susunan ini mempertahankan bentuk pasif dan penerima amanat.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: '''Injil'' merupakan padanan baku dan bermartabat bagi εὐαγγέλιον dalam konteks Paulus.'
- source_word: τῆς ἀκροβυστίας
  choice: bagi orang-orang yang tidak bersunat
  rationale: Genitif ini secara kontekstual menunjuk pada kelompok yang menjadi lingkup pelayanan Paulus. Padanan ini mempertahankan penanda sunat dalam teks Yunani tanpa menggantinya secara interpretatif dengan 'bangsa-bangsa bukan Yahudi'.
- source_word: καθὼς
  choice: sama seperti
  rationale: Menandai perbandingan sejajar antara amanat Paulus dan amanat Petrus.
- source_word: Πέτρος
  choice: Petrus
  rationale: Mengikuti bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: τῆς περιτομῆς
  choice: bagi orang-orang yang bersunat
  rationale: Padanan ini sejajar dengan frasa sebelumnya dan mempertahankan penanda perjanjian-etnis yang dipakai Paulus.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: kepada Petrus telah dipercayakan Injil
  rationale: Bahasa Indonesia memerlukan pengulangan gagasan yang tersirat agar perbandingannya lengkap dan mudah dipahami; ini bukan penambahan konsep baru.
theological_decisions:
- issue: Apakah ἀκροβυστία dan περιτομή diterjemahkan sebagai sebutan etnis atau menurut penanda sunat yang dipakai teks Yunani.
  choice: orang-orang yang tidak bersunat / orang-orang yang bersunat
  alternative: bangsa-bangsa bukan Yahudi / orang-orang Yahudi; ketidaksunatan / sunat
  rationale: Pilihan ini mempertahankan cara Paulus membingkai kedua kelompok berdasarkan status sunat, tanpa mempersempit atau memperluasnya menjadi parafrasa etnis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif dipertahankan untuk mencerminkan amanat ilahi yang diterima Paulus dan Petrus; pengulangan pada bagian Petrus membuat elipsis Yunani jelas dalam bahasa Indonesia.
