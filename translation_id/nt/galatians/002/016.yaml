id: GAL.2.16
reference: Galatians 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: id
  text: Namun, kami tahu bahwa seseorang tidak dibenarkan berdasarkan perbuatan-perbuatan hukum Taurat, kecuali melalui iman kepada Yesus Sang Mesias[a]; kami pun telah percaya kepada Mesias Yesus supaya kami dibenarkan berdasarkan iman kepada Mesias[b] dan bukan berdasarkan perbuatan-perbuatan hukum Taurat, sebab berdasarkan perbuatan-perbuatan hukum Taurat tidak seorang manusia pun[c] akan dibenarkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kesetiaan Yesus Sang Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau, “berdasarkan kesetiaan Mesias.”
    reason: alternative_reading
  - marker: c
    text: 'Harfiah: “tidak ada satu daging pun.” Maksudnya, tidak seorang manusia pun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: dibenarkan
  rationale: Mempertahankan istilah Paulus yang bernuansa hukum secara konsisten tanpa mempersempitnya menjadi sekadar perubahan moral.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Ungkapan generik tunggal ini alami dalam bahasa Indonesia dan mencakup manusia secara umum.
- source_word: ἐξ ἔργων νόμου
  choice: berdasarkan perbuatan-perbuatan hukum Taurat
  rationale: Menjaga frasa khas Paulus dan membedakannya dari gagasan umum tentang 'perbuatan baik'; νόμος dalam konteks ini diterjemahkan secara lazim sebagai hukum Taurat.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: melalui iman kepada Yesus sang Mesias
  rationale: Menyajikan pembacaan genitif objektif dalam teks utama, sementara pembacaan genitif subjektif yang sungguh diperdebatkan dicatat dalam catatan kaki.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: kami pun telah percaya kepada Mesias Yesus
  rationale: Menerjemahkan πιστεύω dengan εἰς secara idiomatis serta mempertahankan tindakan lampau yang tetap relevan.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: berdasarkan iman kepada Mesias
  rationale: Konsisten dengan keputusan atas konstruksi πίστις Χριστοῦ sebelumnya, sambil mempertahankan alternatif 'kesetiaan Mesias' dalam catatan kaki.
- source_word: Χριστός
  choice: Mesias
  rationale: Menerjemahkan daya gelar Χριστός, bukan sekadar mentransliterasikannya.
- source_word: πᾶσα σάρξ
  choice: tidak seorang manusia pun
  rationale: Mengungkapkan idiom Semitis secara jelas dan alami; arti harfiahnya tetap dicatat karena gaung Kitab Sucinya penting.
- source_word: εἰδότες δὲ
  choice: Namun, karena kami tahu
  rationale: Menghubungkan ayat dengan konteks sebelumnya dan mengungkapkan nilai kausal partisip εἰδότες secara alami.
- source_word: ἐὰν μὴ
  choice: melainkan melalui
  rationale: Dalam konstruksi negatif ini, ungkapan tersebut menyatakan kontras pengecualian; 'melainkan' lebih alami daripada 'kecuali' dan tidak menyiratkan bahwa iman adalah salah satu jenis perbuatan hukum Taurat.
theological_decisions:
- issue: Makna πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ
  choice: iman kepada Yesus sang Mesias / iman kepada Mesias
  alternative: kesetiaan Yesus sang Mesias / kesetiaan Mesias
  rationale: Genitifnya dapat dipahami secara objektif atau subjektif. Teks utama memakai pembacaan 'iman kepada', tetapi alternatif yang penting secara teologis dipertahankan dalam catatan kaki.
- issue: Arti δικαιόω
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: '''Dibenarkan'' mempertahankan istilah teologis-yudisial Paulus secara ringkas, sedangkan alternatif menjelaskan kemungkinan nuansa forensiknya.'
- issue: Hubungan οὐ ... ἐὰν μὴ
  choice: bukan ... melainkan melalui
  alternative: tidak ... kecuali melalui
  rationale: Pilihan utama menyampaikan kontras sarana pembenaran dengan jelas tanpa menetapkan lebih jauh hubungan konseptual antara iman dan perbuatan hukum Taurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur argumentasi Paulus, dengan pengulangan istilah penting secara konsisten. 'Mesias Yesus' dipertahankan untuk Χριστὸν Ἰησοῦν, sedangkan 'Yesus sang Mesias' dipakai agar konstruksi nama dan gelar terdengar alami.
