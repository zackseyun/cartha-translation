  verdict: revise
  source_fidelity: 'Revisi diperlukan karena “karena kami tahu” menjadikan εἰδότες sebagai alasan kausal bagi pernyataan berikutnya. Partisip ini lebih baik diterjemahkan secara nonkausal sebagai pengantar argumentatif: “kami tahu bahwa.” Selain itu, ἐὰν μὴ secara langsung menyatakan pengecualian, yang lebih setia diterjemahkan “kecuali melalui.” Selebihnya, pengulangan “dibenarkan,” “perbuatan-perbuatan hukum Taurat,” dan pilihan “Mesias” mencerminkan teks Yunani dengan baik.'
  naturalness: Teks revisi memakai susunan kalimat baku dan jelas dalam bahasa Indonesia modern. Titik koma mempertahankan hubungan erat antarklausa tanpa memaksakan pembacaan kausal yang tidak ada dalam bahasa sumber.
  terminology: “Dibenarkan” secara konsisten mempertahankan istilah yudisial δικαιόω. “Hukum Taurat” tepat untuk νόμος dalam frasa khas Paulus ini. “Iman kepada” dipertahankan sebagai pembacaan utama atas genitif yang diperdebatkan, sementara alternatif “kesetiaan” tetap dicatat. “Tidak seorang manusia pun” menyampaikan πᾶσα σάρξ secara alami, dengan ungkapan harfiahnya dipelihara dalam catatan kaki.
  issues:
  - severity: medium
    issue: “Karena kami tahu” memberi hubungan kausal yang tidak dinyatakan secara eksplisit.
    rationale: εἰδότες δέ adalah partisip yang terutama menandai pengetahuan yang mendasari pernyataan, bukan sebab eksplisit bahwa para penutur percaya. “Namun, kami tahu bahwa” mempertahankan alur argumentasi tanpa menambah relasi kausal.
  - severity: low
    issue: “Melainkan melalui” kurang langsung mencerminkan ἐὰν μὴ.
    rationale: Dalam negasi ini, ἐὰν μὴ berarti “kecuali/unless.” “Kecuali melalui” mempertahankan daya pengecualiannya dengan lebih transparan.
