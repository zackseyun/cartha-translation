revisions:
- from: Namun, aku pergi ke sana sebagai tanggapan atas suatu penyataan[a]. Aku memaparkan kepada mereka Injil yang kuberitakan di antara bangsa-bangsa bukan Yahudi. Akan tetapi, aku memaparkannya secara pribadi kepada orang-orang yang terpandang[b], supaya jangan sampai aku sedang berlari atau telah berlari dengan sia-sia[c].
  to: Aku pergi karena suatu penyataan[a], lalu memaparkan kepada mereka Injil yang kuberitakan di antara bangsa-bangsa bukan Yahudi—tetapi secara tertutup kepada orang-orang yang terpandang[b]—supaya jangan sampai aku sedang berlari atau telah berlari dengan sia-sia[c].
  rationale: Revisi menghapus penambahan tujuan "ke sana," mengganti "secara pribadi" dengan "secara tertutup" untuk menyatakan κατ’ ἰδίαν, dan menyatukan kembali struktur ayat agar kontras antara pemaparan kepada mereka dan pemaparan privat kepada yang terpandang tetap terlihat. "Karena suatu penyataan" dipilih sebagai ungkapan Indonesia yang alami dan tetap membuka alternatif kausal, responsif, atau normatif dalam catatan kaki.
