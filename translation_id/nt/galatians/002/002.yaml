  source_fidelity: Revisi diperlukan karena "ke sana" menambahkan tujuan deiktis yang tidak dinyatakan oleh ἀνέβην dalam ayat ini. Unsur arah "naik" sulit dipertahankan secara idiomatis tanpa tujuan yang tersirat dari konteks, sehingga "pergi" lebih aman daripada menambahkan "ke sana." Terjemahan revisi juga mengungkapkan κατ’ ἰδίαν sebagai pertemuan tertutup/tersendiri, bukan "secara pribadi," yang dalam bahasa Indonesia dapat berarti tindakan dalam kapasitas personal.
  naturalness: Teks revisi memakai satu kalimat utama dengan sisipan berpagar garis pisah, sehingga hubungan antara pemaparan Injil secara umum dan pemaparan khusus kepada orang-orang terpandang tetap jelas dan alami. "Secara tertutup" adalah ungkapan modern yang jelas untuk konteks privat.
  terminology: '"Injil," "bangsa-bangsa bukan Yahudi," dan "orang-orang yang terpandang" dapat dipertahankan. Yang terakhir mempertahankan nuansa orang-orang yang dipandang/dianggap penting tanpa secara eksplisit mengesahkan atau meragukan status mereka.'
