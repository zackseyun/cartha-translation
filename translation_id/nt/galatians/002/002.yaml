  - severity: medium
    issue: '"Secara pribadi" kurang tepat untuk κατ’ ἰδίαν'
    rationale: Dalam bahasa Indonesia modern, "secara pribadi" lazim berarti secara personal atau atas nama diri sendiri. Di sini frasa Yunani menunjuk pada cara/pertemuan yang privat; "secara tertutup" atau "secara tersendiri" lebih tepat.
