id: GAL.2.2
reference: Galatians 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: id
  text: Aku pergi karena suatu penyataan[a], lalu memaparkan kepada mereka Injil yang kuberitakan di antara bangsa-bangsa bukan Yahudi—tetapi secara tertutup kepada orang-orang yang terpandang[b]—supaya jangan sampai aku sedang berlari atau telah berlari dengan sia-sia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sebagai tanggapan atas suatu penyataan” atau “sesuai dengan suatu penyataan.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “orang-orang yang dianggap penting”; dapat juga diterjemahkan, “orang-orang yang tampaknya berpengaruh.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini dapat dipahami sebagai, “karena khawatir bahwa aku sedang berlari atau telah berlari dengan sia-sia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: aku pergi ke sana
  rationale: Kata ini secara harfiah berarti 'aku pergi naik'. Dalam bahasa Indonesia, 'pergi ke sana' lebih alami untuk perjalanan menuju tempat yang tersirat oleh konteks, tanpa menambahkan tujuan 'Yerusalem' yang tidak disebutkan dalam ayat ini.
- source_word: κατὰ ἀποκάλυψιν
  choice: sebagai tanggapan atas suatu penyataan
  rationale: Frasa ini menunjukkan bahwa penyataan tersebut menjadi dasar atau pendorong perjalanan Paulus. Pilihan ini mempertahankan hubungan tersebut tanpa memastikan secara berlebihan apakah nuansanya sebab atau kesesuaian.
- source_word: ἀνεθέμην
  choice: aku memaparkan kepada mereka
  rationale: Kata kerja ini berarti mengemukakan sesuatu kepada orang lain untuk dipertimbangkan. 'Memaparkan' tetap netral dan tidak menyiratkan bahwa Paulus tunduk untuk memperoleh pengesahan resmi.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: '''Injil'' merupakan padanan baku dan ringkas bagi εὐαγγέλιον dalam konteks surat-surat Paulus.'
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini, ἔθνη menunjuk kepada kelompok-kelompok non-Yahudi, bukan sekadar negara atau bangsa dalam arti geopolitik.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Frasa ini menunjukkan bahwa pemaparan kepada kelompok tertentu berlangsung dalam suasana tertutup atau tersendiri.
- source_word: τοῖς δοκοῦσιν
  choice: orang-orang yang terpandang
  rationale: Ungkapan ini menunjuk kepada mereka yang dipandang penting atau berpengaruh, sambil mempertahankan kemungkinan nuansa bahwa status itu merupakan penilaian orang lain.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: supaya jangan sampai aku sedang berlari atau telah berlari dengan sia-sia
  rationale: Terjemahan ini mempertahankan metafora berlari serta perbedaan aspek antara pekerjaan yang sedang berlangsung dan pekerjaan yang telah dilakukan.
theological_decisions:
- issue: Apakah pemaparan Injil oleh Paulus berarti ia menyerahkannya untuk dikoreksi atau disahkan para rasul
  choice: Menggunakan 'memaparkan kepada mereka', yang tidak menentukan apakah tindakan itu merupakan permohonan pengesahan resmi.
  alternative: Menggunakan 'menyerahkan kepada mereka untuk diperiksa' atau, sebaliknya, 'sekadar memberi tahu mereka'.
  rationale: ἀνεθέμην menunjukkan bahwa Paulus mengemukakan Injilnya kepada mereka, tetapi kata itu sendiri tidak memastikan adanya ketundukan doktrinal maupun meniadakan unsur pertimbangan bersama.
- issue: Sifat kekhawatiran bahwa pelayanan Paulus mungkin sia-sia
  choice: Mempertahankan ungkapan tujuan/kekhawatiran 'supaya jangan sampai' serta metafora 'berlari'.
  alternative: Menafsirkan bahwa Paulus meragukan kebenaran Injilnya sendiri atau hanya mengkhawatirkan terhambatnya hasil pelayanannya.
  rationale: Teks menyatakan kekhawatiran mengenai kemungkinan berlari dengan sia-sia, tetapi tidak menjelaskan secara eksplisit apakah yang dipertaruhkan adalah isi Injil, penerimaan pelayanan, atau kesatuan misi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'aku' mengikuti suara pribadi Paulus. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami tanpa menghilangkan hubungan logisnya. Pengulangan 'aku memaparkannya' memperjelas bahwa pemaparan secara pribadi ditujukan khusus kepada orang-orang yang terpandang. Semua penanda catatan kaki ditempatkan langsung dalam teks.
