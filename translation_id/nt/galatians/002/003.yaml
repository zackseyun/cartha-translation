  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: id
  text: Namun, bahkan Titus yang menyertai saya, meskipun ia orang Yunani,[a] tidak dipaksa untuk disunat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “orang Yunani” di sini menyiratkan bahwa Titus tidak bersunat. Namun, teks secara khusus menyebutnya “orang Yunani”, bukan sekadar “orang bukan Yahudi”.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai kontras dengan konteks sebelumnya secara alami dan ringkas dalam bahasa Indonesia.
- source_word: οὐδὲ
  choice: bahkan ... tidak
  rationale: Susunan ini mempertahankan penyangkalan yang menegaskan bahwa Titus pun tidak mengalami pemaksaan.
- source_word: Τίτος
  choice: Titus
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: ὁ σὺν ἐμοί
  choice: yang bersama saya
  rationale: Menerjemahkan frasa penjelas secara langsung tanpa menambahkan gagasan bahwa Titus adalah rekan atau pendamping resmi.
- source_word: Ἕλλην ὤν
  choice: meskipun ia orang Yunani
  rationale: 'Konteks mendukung nuansa konsesif: walaupun Titus orang Yunani, ia tidak dipaksa untuk disunat.'
- source_word: Ἕλλην
  choice: orang Yunani
  rationale: Mempertahankan istilah etnis-kultural yang khusus dalam teks Yunani, bukan menggeneralisasikannya menjadi 'bukan Yahudi'.
- source_word: ἠναγκάσθη
  choice: dipaksa
  rationale: Menyampaikan bentuk pasif dan tekanan dari luar dengan bahasa Indonesia modern yang jelas.
- source_word: περιτμηθῆναι
  choice: untuk disunat
  rationale: Padanan langsung dan wajar bagi infinitif pasif tersebut.
theological_decisions:
- issue: Apakah Ἕλλην diterjemahkan sebagai istilah etnis atau sebagai kategori keagamaan yang lebih luas
  choice: orang Yunani
  alternative: orang bukan Yahudi
  rationale: Teks menyebut identitas Titus secara khusus sebagai orang Yunani. Dalam konteks, sebutan itu menyiratkan bahwa ia tidak bersunat, tetapi terjemahan utama sebaiknya tidak mengganti istilah sumber dengan kategori interpretatif yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'saya' dipakai untuk suara surat Paulus agar alami bagi pembaca umum; struktur kalimat tetap dekat dengan urutan dan penekanan teks Yunani.
