translation:
  language: id
  text: Hanya, kami diminta untuk mengingat orang-orang miskin; itulah juga yang dengan sungguh-sungguh kuusahakan untuk kulakukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Hanya saja
  rationale: Menandai satu-satunya permintaan atau ketentuan yang ditambahkan pada kesepakatan, sekaligus tersambung alami dengan konteks sebelumnya.
- source_word: τῶν πτωχῶν
  choice: orang-orang miskin
  rationale: Secara langsung menyatakan kelompok orang yang berkekurangan; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἵνα μνημονεύωμεν
  choice: kami harus mengingat
  rationale: ἵνα menyatakan isi permintaan, sedangkan 'mengingat' mempertahankan gambaran Yunani yang dalam konteks menyiratkan perhatian nyata tanpa memperluasnya secara berlebihan.
- source_word: ὃ
  choice: dan ... itulah
  rationale: Pronomina relatif merujuk pada seluruh permintaan sebelumnya. Susunan ini menghubungkan kedua klausa secara alami dalam bahasa Indonesia.
- source_word: ἐσπούδασα
  choice: sungguh-sungguh ingin
  rationale: Menyampaikan kesungguhan, kesiapan, dan niat aktif yang terkandung dalam σπουδάζω, bukan sekadar keinginan pasif.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: justru itulah yang ... kulakukan
  rationale: Gabungan αὐτό dan τοῦτο memberi penekanan pada 'hal itu sendiri'; 'justru itulah' mempertahankan fokus tersebut secara idiomatis.
theological_decisions:
- issue: Cakupan 'orang-orang miskin'
  choice: Tidak mempersempit rujukan dalam teks utama
  alternative: Menuliskan 'orang-orang miskin di Yerusalem' atau 'orang-orang miskin di antara umat percaya'
  rationale: Ayat ini sendiri hanya mengatakan 'orang-orang miskin'. Walaupun konteks historis dapat menunjuk pada kelompok tertentu, terjemahan tidak boleh memasukkan pembatas yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk 'kulakukan' mempertahankan peralihan dari subjek jamak 'kami' (μνημονεύωμεν) ke subjek tunggal 'aku' (ἐσπούδασα).
