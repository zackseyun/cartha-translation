lexical_decisions:
- source_word: Ἡμεῖς
  choice: Kita
  rationale: Pronomina eksplisit dipertahankan untuk membawa penekanan ringan pada kelompok yang sedang dibicarakan; “kita” sesuai karena Paulus melibatkan dirinya dan lawan bicaranya.
- source_word: φύσει
  choice: sejak lahir
  rationale: Dalam konteks ini kata tersebut menunjuk pada asal-usul etnis alami, bukan watak moral bawaan. “Sejak lahir” menyampaikan maksud itu secara wajar dalam bahasa Indonesia modern.
- source_word: Ἰουδαῖοι
  choice: orang Yahudi
  rationale: Padanan nominal yang alami dan jelas untuk identitas etnis yang dikontraskan dalam ayat ini.
- source_word: ἐξ ἐθνῶν
  choice: dari kalangan bangsa-bangsa lain
  rationale: Mempertahankan unsur preposisional ἐξ dan kontras etnis dengan orang Yahudi. “Bangsa-bangsa lain” menyampaikan makna kontekstual ἔθνη tanpa menjadikannya sekadar kata sifat.
- source_word: ἁμαρτωλοί
  choice: orang berdosa
  rationale: Mempertahankan istilah teologis lazim dan ketajaman ungkapan Yunani tanpa melunakkannya menjadi sekadar “orang yang berbuat dosa”.
theological_decisions:
- issue: Apakah ayat ini harus terdengar seolah-olah Paulus mengesahkan keunggulan moral orang Yahudi atas bangsa lain
  choice: Terjemahan mempertahankan kontras etnis yang dinyatakan secara lugas, tanpa mengembangkannya menjadi klaim bahwa orang Yahudi pada hakikatnya benar.
  alternative: “bukan orang yang dianggap berdosa seperti bangsa-bangsa lain”
  rationale: Teks Yunani menyatakan kontras itu dengan ringkas dan langsung. Konteks berikutnya memberi penjelasan, tetapi penjelasan tersebut tidak boleh disisipkan ke dalam ayat ini.
- issue: Hubungan ἁμαρτωλοί dengan frasa ἐξ ἐθνῶν
  choice: “orang berdosa dari kalangan bangsa-bangsa lain”
  alternative: “orang berdosa bangsa lain”
  rationale: Pilihan utama mempertahankan konstruksi preposisional dan memungkinkan pembacaan bahwa yang dimaksud ialah orang-orang berdosa yang berasal dari kalangan bangsa lain; alternatif yang lebih padat dicatat karena struktur Yunani juga dapat dipahami sebagai ungkapan “orang berdosa non-Yahudi.”
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan mempertahankan ketegangan retoris teks Yunani. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkan, dengan urutan [a][b].
