id: GAL.2.5
reference: Galatians 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: id
  text: Kami sama sekali tidak mengalah kepada mereka dengan menundukkan diri, bahkan sesaat pun,[a] supaya kebenaran Injil tetap ada bagi kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahkan selama satu jam pun,” suatu ungkapan yang berarti “bahkan sesaat pun.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tetap ada bersama kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Kepada mereka
  rationale: Kata ganti relatif datif ini menunjuk kembali kepada orang-orang yang disebut dalam ayat sebelumnya; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan acuannya.
- source_word: οὐδὲ πρὸς ὥραν
  choice: bahkan sesaat pun
  rationale: Ungkapan harfiah 'bahkan selama satu jam pun' berfungsi idiomatis untuk waktu yang sangat singkat; 'bahkan sesaat pun' menyampaikan tekanannya secara alami.
- source_word: εἴξαμεν
  choice: kami tidak menyerah
  rationale: Kata kerja ini berarti mengalah, memberi jalan, atau menyerah. Pilihan ini mempertahankan tindakan penolakan tanpa meleburkannya dengan kata ὑποταγή yang menyusul.
- source_word: τῇ ὑποταγῇ
  choice: untuk tunduk
  rationale: Datif ini menerangkan bentuk atau ranah penyerahan. Ungkapan Indonesia ini menyampaikan bahwa mereka menolak mengalah dengan menundukkan diri, tanpa mempersempitnya menjadi konsesi pribadi atau kelembagaan saja.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan; 'supaya' mempertahankan daya purposifnya dengan bahasa Indonesia yang alami.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: kebenaran Injil
  rationale: Ini merupakan ungkapan penting dalam tulisan Paulus. 'Injil' sudah lazim dan mempertahankan makna εὐαγγέλιον tanpa parafrasa tambahan.
- source_word: διαμείνῃ
  choice: tetap terpelihara
  rationale: Kata kerja ini menyatakan keberlangsungan atau kelanjutan. Dalam konteks penolakan terhadap tekanan, 'tetap terpelihara' menyampaikan bahwa kebenaran Injil dimaksudkan untuk terus utuh dan tersedia.
- source_word: πρὸς ὑμᾶς
  choice: bagi kalian
  rationale: πρός dengan akusatif di sini dapat menyatakan arah, hubungan, atau manfaat bagi jemaat Galatia. 'Bagi kalian' alami dan sesuai konteks, sementara kemungkinan 'bersama kalian' dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan penolakan Paulus terhadap para penentang
  choice: Paulus menyatakan bahwa mereka sama sekali tidak menyerah untuk tunduk, agar kebenaran Injil tetap terpelihara.
  alternative: Penolakan itu dapat dipersempit menjadi penolakan pribadi atau penolakan terhadap konsesi kelembagaan tertentu.
  rationale: Bahasa Yunani berbicara secara luas tentang tidak mengalah dalam ketundukan dan tidak mengharuskan salah satu penyempitan tersebut.
- issue: Hubungan kebenaran Injil dengan jemaat Galatia dalam πρὸς ὑμᾶς
  choice: bagi kalian
  alternative: bersama kalian
  rationale: Konstruksi ini dapat menonjolkan manfaat bagi jemaat atau keberadaan Injil bersama mereka. Teks utama memakai makna manfaat, sedangkan ambiguitas yang sah dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς secara jelas. Penempatan penanda catatan kaki mengikuti unsur yang dijelaskan.
