  rationale: Revisi hanya memperbaiki kelancaran ungkapan ketundukan dan mengembalikan διαμείνῃ kepada makna dasarnya, “tetap ada.” Penanda catatan kaki tetap ditempatkan pada unsur yang dijelaskan, dan catatan alternatif mempertahankan kemungkinan sah bahwa πρὸς ὑμᾶς berarti “bersama kalian.”
