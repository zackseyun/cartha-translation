id: GAL.2.1
reference: Galatians 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: id
  text: Kemudian, setelah empat belas tahun, aku pergi lagi ke Yerusalem bersama Barnabas, dengan membawa Titus juga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Kemudian
  rationale: Menandai kelanjutan dan urutan dalam kisah Paulus secara alami dan ringkas.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: setelah empat belas tahun
  rationale: Dalam konstruksi waktu ini, διά dengan bentuk genitif menunjukkan selang waktu yang telah berlalu sebelum peristiwa berikutnya.
- source_word: πάλιν
  choice: lagi
  rationale: Menunjukkan bahwa perjalanan ke Yerusalem ini merupakan perjalanan yang berulang.
- source_word: ἀνέβην
  choice: aku pergi ... ke
  rationale: Bahasa Indonesia lazim memakai 'pergi ke' untuk tujuan perjalanan; makna gerak menuju Yerusalem tetap jelas tanpa ungkapan 'naik' yang dapat terasa kurang alami bagi pembaca umum.
- source_word: εἰς Ἱεροσόλυμα
  choice: ke Yerusalem
  rationale: Menyampaikan tujuan perjalanan secara langsung dengan bentuk nama tempat yang sudah mapan dalam bahasa Indonesia.
- source_word: μετὰ Βαρναβᾶ
  choice: bersama Barnabas
  rationale: Mengungkapkan penyertaan Barnabas secara jelas dan alami.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: dengan membawa Titus juga
  rationale: 'Partisipel menyatakan tindakan yang menyertai verba utama, sedangkan καί bersifat aditif: Titus dibawa serta di samping Barnabas.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti 'aku' mempertahankan suara orang pertama Paulus; susunan kalimat menjaga urutan unsur Yunani sejauh tetap alami.
