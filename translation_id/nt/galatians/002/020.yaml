id: GAL.2.20
reference: Galatians 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: id
  text: Namun, bukan lagi aku yang hidup, melainkan Mesias hidup di dalam diriku. Kehidupan yang sekarang kujalani dalam daging, kujalani berdasarkan iman kepada Anak Allah,[a] yang telah mengasihi aku dan menyerahkan dirinya bagiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berdasarkan kesetiaan Anak Allah.”
    reason: Konstruksi genitif Yunani dapat menyatakan iman kepada Anak Allah atau kesetiaan Anak Allah.
lexical_decisions:
- source_word: Χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; “Mesias” menerjemahkan gelar itu secara langsung dan sudah lazim dalam bahasa Indonesia.
- source_word: ὃ δὲ νῦν ζῶ
  choice: kehidupan yang sekarang kujalani
  rationale: Konstruksi relatif netral ini eliptis dalam bahasa Yunani. Ungkapan ini menyatakan maknanya secara alami dalam bahasa Indonesia tanpa menambahkan unsur tafsir yang berarti.
- source_word: σάρξ
  choice: daging
  rationale: “Daging” mempertahankan istilah khas Paulus dan di sini menunjuk pada keberadaan jasmani dalam kehidupan sekarang, bukan secara eksplisit pada tabiat berdosa.
- source_word: πίστει
  choice: iman
  rationale: “Iman” merupakan padanan utama yang wajar; kemungkinan makna “kesetiaan” dalam konstruksi genitif ini dipertahankan dalam catatan kaki.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: kepada Anak Allah
  rationale: Dalam frasa “berdasarkan iman kepada Anak Allah,” genitif dipahami secara objektif. Karena konstruksi Yunaninya sungguh ambigu, pembacaan subjektif dicantumkan dalam catatan kaki.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: menyerahkan dirinya bagiku
  rationale: Ungkapan ini mempertahankan gagasan penyerahan diri secara sukarela serta arti perwakilan atau demi kepentingan yang terkandung dalam ὑπέρ.
theological_decisions:
- issue: Makna πίστις dengan genitif dalam τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: berdasarkan iman kepada Anak Allah
  alternative: berdasarkan kesetiaan Anak Allah
  rationale: Genitif tersebut dapat dipahami secara objektif sebagai iman yang diarahkan kepada Anak Allah atau secara subjektif sebagai kesetiaan Anak Allah. Teks utama memakai pembacaan objektif yang paling mudah dipahami, sedangkan pembacaan subjektif dipertahankan dalam catatan kaki agar ketegangan teologisnya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “diriku” dan “kujalani” dipakai agar alami, sedangkan “daging” dipertahankan demi kesinambungan istilah Paulus. Pronomina yang merujuk kepada Mesias ditulis dengan huruf kecil sesuai ejaan umum, tanpa menjadikannya penanda teologis.
