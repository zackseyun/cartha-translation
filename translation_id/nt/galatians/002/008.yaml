  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: id
  text: Sebab Dia yang bekerja melalui Petrus dalam pelayanan kerasulan kepada orang-orang bersunat[a] juga bekerja melalui aku kepada bangsa-bangsa lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk kerasulan kaum bersunat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: bekerja
  rationale: Memakai padanan yang sama pada kedua kemunculan untuk mempertahankan pengulangan dan kesejajaran yang disengaja dalam bahasa Yunani, tanpa memperinci cara kerja ilahi.
- source_word: Πέτρῳ / ἐμοὶ
  choice: melalui Petrus / melalui aku
  rationale: Kedua bentuk datif dipahami secara instrumental dalam konteks, yakni Dia bekerja melalui pelayanan Petrus dan Paulus.
- source_word: εἰς ἀποστολὴν
  choice: untuk kerasulan
  rationale: Mempertahankan makna formal ἀποστολή dan arah karya tersebut kepada tugas atau pelayanan rasuli.
- source_word: τῆς περιτομῆς
  choice: kepada orang-orang bersunat
  rationale: Ungkapan harfiah 'milik penyunatan' berfungsi secara metonimis untuk orang Yahudi; terjemahan ini mempertahankan citra sunat dan memperjelas kelompok yang dimaksud.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam pertentangan Paulus dengan orang-orang bersunat, istilah ini menunjuk kepada bangsa-bangsa non-Yahudi. 'Bangsa-bangsa lain' merupakan ungkapan Indonesia yang alami dan tetap dekat dengan arti dasar 'bangsa-bangsa'.
theological_decisions:
- issue: Apakah subjek ilahi perlu disebut secara eksplisit sebagai 'Allah'
  choice: Dia yang bekerja
  alternative: Allah, yang bekerja
  rationale: Bahasa Yunani memakai partisip berartikel, secara harfiah 'Dia/Pribadi yang bekerja', tanpa menyebut kata 'Allah' pada ayat ini. Bentuk ini mempertahankan rujukan ilahi yang tersirat dari konteks tanpa menambahkan nomina yang tidak ada dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'bekerja melalui Petrus ... bekerja melalui aku' dipertahankan. 'Kerasulan' dipilih sebagai istilah teologis yang ringkas dan sudah lazim, sedangkan 'orang-orang bersunat' dan 'bangsa-bangsa lain' menyampaikan kontras Yahudi/non-Yahudi tanpa menggantinya dengan label yang lebih interpretatif.
