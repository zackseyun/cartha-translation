base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: id
  text: Orang-orang Yahudi lainnya[a] juga turut bersikap munafik bersamanya, sehingga bahkan Barnabas terseret[b] oleh kemunafikan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Yahudi yang lain.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “terhanyut oleh kemunafikan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: ikut bersikap munafik bersama dia
  rationale: Ungkapan ini mempertahankan daya gabungan awalan σύν-, yaitu bahwa mereka turut serta dalam perilaku munafik Petrus, bukan sekadar bersikap tidak tulus secara sendiri-sendiri.
- source_word: αὐτῷ
  choice: bersama dia
  rationale: Bentuk datif ini menyatakan keterlibatan bersama Petrus dalam tindakan tersebut; frasa ini mempertahankan hubungan itu secara jelas dan alami dalam bahasa Indonesia.
- source_word: λοιποὶ
  choice: lainnya
  rationale: Kata ini menunjuk kepada anggota-anggota lain dari kelompok yang sedang dibicarakan dan membedakan mereka dari Petrus.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Dalam konteks Paulus ini, istilah tersebut mengacu kepada orang Yahudi sebagai kelompok etnis-keagamaan, bukan hanya penduduk Yudea.
- source_word: συναπήχθη
  choice: terseret
  rationale: Bentuk pasif ini menggambarkan Barnabas sebagai orang yang ditarik oleh pengaruh dan tekanan perilaku kelompok tersebut. 'Terseret' mempertahankan daya pasif dan nuansa sosial-moralnya.
- source_word: ὑποκρίσει
  choice: kemunafikan
  rationale: Kata benda ini menyebut perilaku berpura-pura atau mendua yang dipersoalkan Paulus. Pengulangan akar 'munafik/kemunafikan' mencerminkan penekanan teks Yunani.
