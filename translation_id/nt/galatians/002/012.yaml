id: GAL.2.12
reference: Galatians 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: id
  text: Sebab sebelum beberapa orang datang dari Yakobus[a], ia biasa makan bersama orang-orang bukan Yahudi. Namun, ketika mereka datang, ia mulai menarik diri dan memisahkan diri karena takut kepada orang-orang dari kalangan bersunat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari lingkungan Yakobus”; bahasa Yunani tidak dengan sendirinya menyatakan bahwa Yakobus secara resmi mengutus mereka.
    reason: alternative_reading
  - marker: b
    text: Atau “golongan bersunat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν τινας
  choice: Sebab sebelum beberapa orang datang
  rationale: Mengungkapkan hubungan waktu secara alami dan mempertahankan ketidakpastian identitas pada τινας melalui “beberapa orang”.
- source_word: ἀπὸ Ἰακώβου
  choice: dari Yakobus
  rationale: Mengikuti arti dasar ἀπό dengan nama orang tanpa menyatakan bahwa Yakobus secara resmi mengutus atau menyetujui mereka.
- source_word: μετὰ τῶν ἐθνῶν
  choice: bersama orang-orang bukan Yahudi
  rationale: Dalam konteks Paulus, τὰ ἔθνη menunjuk kepada orang bukan Yahudi; kata “percaya” tidak ditambahkan karena tidak dinyatakan dalam ayat.
- source_word: συνήσθιεν
  choice: biasa makan
  rationale: Bentuk imperfek menyatakan kebiasaan pada masa lampau, bukan hanya satu kali makan.
- source_word: ὑπέστελλεν
  choice: mulai menarik diri
  rationale: Menyampaikan tindakan mundur atau menjauh yang mulai berlangsung dalam konteks ini.
- source_word: ἀφώριζεν ἑαυτόν
  choice: memisahkan diri
  rationale: Mempertahankan unsur refleksif dan gagasan pemisahan dalam pergaulan tanpa menambahkan motif lain.
- source_word: φοβούμενος
  choice: karena takut kepada
  rationale: Menampilkan nuansa sebab dari partisip tersebut dalam bahasa Indonesia yang alami.
- source_word: τοὺς ἐκ περιτομῆς
  choice: orang-orang dari kalangan bersunat
  rationale: Mengidentifikasi mereka melalui sunat sebagaimana bahasa Yunani, tanpa secara tegas menjadikan mereka sebuah partai atau faksi resmi.
theological_decisions:
- issue: Apakah ἀπὸ Ἰακώβου menyatakan bahwa Yakobus mengutus atau menyetujui orang-orang itu
  choice: dari Yakobus
  alternative: dari lingkungan Yakobus; diutus oleh Yakobus
  rationale: Bahasa Yunani menunjukkan asal atau hubungan, tetapi tidak dengan sendirinya menyatakan pengutusan resmi maupun persetujuan Yakobus.
- issue: Apakah τοὺς ἐκ περιτομῆς harus disebut sebagai sebuah partai tertentu
  choice: orang-orang dari kalangan bersunat
  alternative: kelompok sunat; golongan bersunat
  rationale: Teks mengenali kelompok itu berdasarkan sunat, tetapi tidak secara eksplisit memakai istilah bagi partai atau faksi resmi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Orang-orang bukan Yahudi” dipilih sebagai padanan komunikatif bagi τὰ ἔθνη, sedangkan ungkapan tentang Yakobus dan kalangan bersunat dijaga tetap terbuka agar ambiguitas serta ketegangan teologis teks tidak diselesaikan secara sepihak.
source_grounding:
  english_pob_role: consult_only
