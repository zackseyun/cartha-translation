revisions:
- from: Namun, ketika aku melihat bahwa mereka tidak berjalan lurus sesuai dengan kebenaran Injil[a], aku berkata kepada Kefas di hadapan mereka semua, “Jika engkau, sekalipun seorang Yahudi, hidup seperti orang bukan Yahudi dan bukan seperti orang Yahudi, bagaimana mungkin engkau memaksa orang-orang bukan Yahudi untuk hidup menurut adat Yahudi[b]?”
  to: Namun, ketika aku melihat bahwa mereka tidak berjalan lurus sesuai dengan kebenaran Injil[a], aku berkata kepada Kefas di hadapan semua orang, “Jika engkau, sekalipun seorang Yahudi, hidup seperti orang bukan Yahudi dan bukan seperti orang Yahudi, bagaimana engkau memaksa orang-orang bukan Yahudi untuk hidup seperti orang Yahudi[b]?”
  rationale: Revisi memperbaiki arah makna dalam catatan kaki a, menerjemahkan πῶς tanpa tambahan modal, dan memulihkan paralelisme cara hidup yang dibentuk oleh ἐθνικῶς, Ἰουδαϊκῶς, dan Ἰουδαΐζειν. Makna sosial-keagamaan istilah terakhir tetap dibiarkan luas tanpa memasukkan polemik doktrinal kemudian.
