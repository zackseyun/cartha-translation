id: GAL.2.14
reference: Galatians 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: id
  text: Namun, ketika aku melihat bahwa mereka tidak berjalan lurus sesuai dengan kebenaran Injil[a], aku berkata kepada Kefas di hadapan semua orang, “Jika engkau, sekalipun seorang Yahudi, hidup seperti orang bukan Yahudi dan bukan seperti orang Yahudi, bagaimana engkau memaksa orang-orang bukan Yahudi untuk hidup seperti orang Yahudi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “tidak berjalan lurus sejalan dengan kebenaran Injil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjadi Yahudi” atau “mengikuti cara hidup Yahudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: berjalan lurus
  rationale: Mempertahankan metafora harfiah tentang berjalan lurus, tetapi tetap wajar sebagai gambaran perilaku yang benar dalam bahasa Indonesia.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: sesuai dengan kebenaran Injil
  rationale: Dalam konstruksi ini, πρός menunjukkan kesesuaian atau keselarasan perilaku dengan kebenaran Injil, bukan sekadar arah gerak.
- source_word: Κηφᾷ
  choice: Kefas
  rationale: Mentransliterasikan nama Aram sebagaimana dipakai Paulus, tanpa menggantinya dengan Petrus.
- source_word: ἐθνικῶς
  choice: seperti orang bukan Yahudi
  rationale: Mengungkapkan cara hidup dan mempertahankan kontras etnis-sosial dalam konteks dengan istilah Indonesia yang jelas.
- source_word: Ἰουδαϊκῶς
  choice: seperti orang Yahudi
  rationale: Dibuat sejajar dengan ἐθνικῶς agar antitesis cara hidup tetap tampak.
- source_word: ἀναγκάζεις
  choice: memaksa
  rationale: Menyampaikan tekanan atau paksaan yang kuat dalam verba Yunani dengan kata Indonesia yang lugas.
- source_word: Ἰουδαΐζειν
  choice: hidup menurut adat Yahudi
  rationale: Menyatakan penerapan cara hidup khas Yahudi tanpa memakai istilah teknis yang kurang dikenal atau memasukkan polemik teologis kemudian.
- source_word: πῶς
  choice: bagaimana mungkin
  rationale: Dalam pertanyaan teguran ini, ungkapan tersebut terdengar alami dalam bahasa Indonesia dan menyoroti ketidakkonsistenan, bukan ketidakmampuan secara harfiah.
theological_decisions:
- issue: Cara menerjemahkan Ἰουδαΐζειν tanpa memasukkan polemik doktrinal kemudian
  choice: hidup menurut adat Yahudi
  alternative: menjadi seperti orang Yahudi; menganut cara hidup Yahudi; melakukan adat istiadat Yahudi
  rationale: Konteks langsung menyangkut pola hidup, persekutuan makan, dan batas sosial-keagamaan. Pilihan ini menjaga cakupannya tanpa menyamakannya secara sempit dengan perpindahan agama atau suatu sistem teologis kemudian.
- issue: Nuansa pertanyaan πῶς τὰ ἔθνη ἀναγκάζεις
  choice: bagaimana mungkin engkau memaksa
  alternative: bagaimana engkau memaksa
  rationale: Bahasa Indonesia idiomatis memakai “bagaimana mungkin” untuk teguran atas ketidakkonsistenan. Ini tidak dimaksudkan sebagai pertanyaan tentang kemampuan, melainkan sebagai tantangan terhadap tindakan Kefas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Aku/engkau” dipakai untuk mempertahankan ujaran langsung yang personal; “orang bukan Yahudi” dipilih karena lebih mudah dipahami luas daripada istilah teknis. Metafora “berjalan lurus” dipertahankan karena alami dan dekat dengan bentuk Yunani.
