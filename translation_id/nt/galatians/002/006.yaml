id: GAL.2.6
reference: Galatians 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: id
  text: Namun, dari mereka yang dianggap sebagai orang penting—apa pun kedudukan mereka dahulu, itu tidak menjadi soal bagiku; Allah tidak memandang muka[a]—sebab mereka yang terpandang itu tidak menambahkan apa pun kepadaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah tidak menerima muka manusia,” sebuah ungkapan yang berarti bahwa Allah tidak memihak atau pilih kasih.
    reason: cultural_note
  - marker: b
    text: Atau “tidak membebankan apa pun lagi kepadaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: mereka yang dianggap sebagai orang penting / mereka yang terpandang
  rationale: Ungkapan ini menunjuk pada kedudukan atau reputasi yang diakui orang lain. Pilihan ini mempertahankan nada berjarak Paulus tanpa menyangkal bahwa mereka memang memiliki peranan kepemimpinan.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: apa pun kedudukan mereka dahulu
  rationale: Dalam konteks ini, frasa tersebut menepis relevansi status mereka sebelumnya. 'Dahulu' mewakili ποτε, sedangkan 'kedudukan' membuat maksud ungkapan itu wajar dan jelas dalam bahasa Indonesia.
- source_word: οὐδέν μοι διαφέρει
  choice: itu tidak menjadi soal bagiku
  rationale: Padanan idiomatis ini menyampaikan bahwa status mereka tidak memengaruhi penilaian Paulus.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Allah tidak memandang muka
  rationale: Ungkapan Indonesia ini dekat dengan bentuk idiom Yunani dan lazim berarti bahwa Allah tidak berpihak berdasarkan status atau penampilan seseorang.
- source_word: οὐδὲν προσανέθεντο
  choice: tidak menambahkan apa pun kepadaku
  rationale: Terjemahan ini mempertahankan objek yang tidak dinyatakan secara eksplisit dalam bahasa Yunani dan tidak menentukan apakah yang dimaksud ialah isi pesan, wewenang, atau suatu tuntutan tambahan.
theological_decisions:
- issue: Apakah ucapan Paulus merendahkan para pemimpin Yerusalem atau hanya menegaskan bahwa status mereka tidak menentukan kebenaran Injilnya
  choice: Mempertahankan nada berjarak melalui 'dianggap sebagai orang penting' dan 'terpandang', tanpa menyebut kepemimpinan mereka tidak sah.
  alternative: Menerjemahkan dengan nada lebih tajam sebagai 'mereka yang tampaknya penting' atau lebih lunak sebagai 'para pemimpin yang diakui'.
  rationale: Teks menegaskan kebebasan Paulus dari pengaruh status manusia, tetapi tidak dengan sendirinya menolak keabsahan peranan para tokoh tersebut.
- issue: Apa yang tidak ditambahkan oleh para tokoh itu kepada Paulus
  choice: 'Membiarkan objeknya tidak disebutkan: ''tidak menambahkan apa pun kepadaku''.'
  alternative: Menjelaskannya sebagai tidak menambahkan sesuatu pada Injil Paulus, atau tidak membebankan tuntutan tambahan kepadanya.
  rationale: Bahasa Yunani tidak menyatakan objek tambahan itu secara eksplisit; karena itu terjemahan utama tidak mengunci salah satu penafsiran kontekstual.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur sisipan dengan tanda pisah dipertahankan untuk mencerminkan alur retoris Yunani, sementara pengulangan sebutan bagi para tokoh dibuat alami dalam bahasa Indonesia.
