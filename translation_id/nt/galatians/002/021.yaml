  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: id
  text: Aku tidak meniadakan anugerah Allah. Sebab jika kebenaran[a] diperoleh melalui hukum Taurat, maka Mesias[b] mati sia-sia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan.”
    reason: lexical_alternative
  - marker: b
    text: Yunani Christos, gelar yang berarti “Yang Diurapi”; di sini diterjemahkan “Mesias.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “mati tanpa guna” atau “mati percuma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: meniadakan
  rationale: Menyatakan tindakan membuat sesuatu tidak berlaku atau tidak efektif; sesuai dengan daya argumen Paulus dan lebih kuat daripada sekadar “menolak”.
- source_word: χάριν
  choice: anugerah
  rationale: Padanan baku dan alami untuk kemurahan Allah yang diberikan tanpa jasa penerimanya.
- source_word: διὰ νόμου
  choice: diperoleh melalui hukum Taurat
  rationale: Kata kerja “diperoleh” dibuat eksplisit agar konstruksi eliptis Yunani wajar dalam bahasa Indonesia; “melalui” mempertahankan fungsi διά dengan genetif. Dalam konteks Galatia, νόμος menunjuk pada Taurat.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Padanan lazim dalam pemakaian Paulus yang mempertahankan cakupan makna keadaan benar di hadapan Allah; kemungkinan arti “keadilan” dicatat dalam catatan kaki.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar bagi Yang Diurapi, sehingga “Mesias” mempertahankan fungsi gelarnya.
- source_word: δωρεὰν
  choice: sia-sia
  rationale: Dalam argumen bersyarat ini, kata tersebut menyatakan bahwa kematian Mesias tidak memiliki tujuan atau hasil jika kebenaran dapat diperoleh melalui Taurat.
theological_decisions:
- issue: Hubungan antara δικαιοσύνη, hukum Taurat, dan kematian Mesias
  choice: Ayat ini menyatakan bahwa jika kebenaran dapat diperoleh melalui hukum Taurat, kematian Mesias menjadi sia-sia.
  alternative: Jika δικαιοσύνη dipahami sebagai “keadilan,” tekanannya dapat terdengar sebagai pemulihan atau penataan yang adil dalam kerangka perjanjian.
  rationale: Konteks polemis Galatia mendukung pengertian tentang keadaan benar di hadapan Allah yang tidak diperoleh melalui Taurat, tetapi terjemahan tidak memperluas ayat menjadi rumusan doktrinal yang lebih rinci.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat dipertahankan secara ringkas; elipsis Yunani dibuat eksplisit dengan “diperoleh” demi kejelasan alami.
