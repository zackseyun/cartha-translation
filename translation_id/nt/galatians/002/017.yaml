id: GAL.2.17
reference: Galatians 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: id
  text: Namun, jika ketika kami berusaha untuk dibenarkan di dalam Mesias[a], kami sendiri juga didapati sebagai orang-orang berdosa, apakah itu berarti Mesias adalah pelayan dosa? Sekali-kali tidak!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mesias: secara tradisional diterjemahkan “Kristus” di sini dan pada penyebutan berikutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: dalam usaha untuk
  rationale: Partisipel kini menyatakan keadaan yang berlangsung bersamaan dengan verba utama; ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan unsur pencarian atau upaya.
- source_word: δικαιωθῆναι
  choice: dibenarkan
  rationale: Mempertahankan istilah teologis-forensik Paulus dalam bentuk pasif dan tidak mempersempitnya menjadi penjelasan interpretatif.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Mempertahankan konstruksi ἐν dan fungsi Χριστός sebagai gelar; 'di dalam' juga menjaga keluasan relasi yang dimaksud tanpa menjelaskannya secara berlebihan.
- source_word: εὑρέθημεν
  choice: ternyata
  rationale: Dalam konteks ini bentuk pasif idiomatis Yunani menyatakan bahwa keadaan mereka didapati atau terbukti demikian; 'ternyata' menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: kami sendiri juga adalah orang-orang berdosa
  rationale: '''Kami sendiri'' mempertahankan penekanan αὐτοί, sedangkan ''juga'' mewakili καί dan predikat ''orang-orang berdosa'' dipertahankan secara langsung.'
- source_word: ἆρα
  choice: apakah itu berarti
  rationale: Menandai kesimpulan retoris yang sedang diuji, bukan menyatakan bahwa kesimpulan tersebut benar.
- source_word: ἁμαρτίας διάκονος
  choice: pelayan dosa
  rationale: '''Pelayan'' menyampaikan διάκονος secara alami tanpa memberi kesan jabatan gerejawi formal; hubungan genitif dengan dosa dibiarkan tetap ringkas dan tegang.'
- source_word: μὴ γένοιτο
  choice: Sekali-kali tidak!
  rationale: Ungkapan penolakan kuat dan idiomatis dalam bahasa Indonesia, sepadan dengan daya retoris formula Paulus.
theological_decisions:
- issue: Apakah pertanyaan retoris ini menyiratkan bahwa Mesias menyebabkan atau melayani dosa
  choice: apakah itu berarti Mesias adalah pelayan dosa?
  alternative: apakah dengan demikian Mesias menjadi penyebab dosa?
  rationale: Teks Yunani mengajukan konsekuensi yang ditolak, bukan mengajarkan bahwa Mesias menyebabkan dosa. 'Pelayan dosa' mempertahankan metafora διάκονος dan ketegangan argumen tanpa menggantinya dengan tafsiran kausal.
- issue: Makna ἐν Χριστῷ
  choice: di dalam Mesias
  alternative: melalui Mesias
  rationale: Terjemahan 'di dalam' mempertahankan rumusan Paulus dan ambiguitas relasional atau instrumental yang dapat terkandung di dalamnya, alih-alih menetapkan hanya satu nuansa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan retoris. Kata ganti 'kami' dipilih karena konteks langsung memakai sudut pandang orang pertama jamak, tanpa memutuskan secara eksplisit seluruh cakupan kelompok yang dimaksud. Penanda catatan kaki [a] ditempatkan pada kemunculan pertama istilah.
