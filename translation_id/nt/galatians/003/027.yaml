  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: id
  text: Sebab, semua orang di antara kamu yang telah dibaptis ke dalam Mesias telah mengenakan Mesias[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus” untuk kedua kemunculan “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah mengenakan diri dengan Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: kamu semua yang
  rationale: Mengungkapkan daya korelatif ὅσοι serta sapaan langsung kepada jemaat Galatia secara wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan argumen pada ayat sebelumnya.
- source_word: εἰς
  choice: ke dalam
  rationale: Merupakan padanan langsung yang mempertahankan gagasan masuk ke dalam atau dipersatukan dengan Mesias tanpa menambahkan penjelasan doktrinal.
- source_word: Χριστόν
  choice: Mesias
  rationale: Mempertahankan arti gelar ‘Yang Diurapi’ yang menonjol dalam konteks ini; padanan tradisional ‘Kristus’ dicatat dalam catatan kaki.
- source_word: ἐβαπτίσθητε
  choice: telah dibaptis
  rationale: Mempertahankan bentuk pasif dan memakai istilah baku tanpa menentukan cara atau modus baptisan.
- source_word: ἐνεδύσασθε
  choice: telah mengenakan
  rationale: Menyampaikan metafora berpakaian secara ringkas dan alami, sekaligus mempertahankan aspek perfektif aoristus dalam konteks melalui ‘telah’.
theological_decisions:
- issue: Apakah ungkapan baptisan harus menyiratkan teologi sakramental atau cara baptisan tertentu.
  choice: telah dibaptis ke dalam Mesias
  alternative: telah dicelupkan ke dalam Mesias; telah dibaptis dalam hubungan dengan Mesias
  rationale: Bahasa Yunani menyatakan gerak atau penggabungan ‘ke dalam’ Mesias, tetapi tidak dengan sendirinya menuntaskan perdebatan kemudian tentang khasiat sakramental atau cara fisik baptisan.
- issue: Cara menyampaikan metafora mengenakan Mesias.
  choice: telah mengenakan Mesias
  alternative: telah mengenakan Mesias seperti pakaian; telah berpakaian Mesias
  rationale: Pilihan utama mempertahankan metafora yang padat dan ketegangan teologisnya tanpa menguraikannya sebagai perubahan status, perilaku, atau identitas tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ‘ke dalam’ dan metafora ‘mengenakan’ dipertahankan untuk menjaga bobot serta ambiguitas ungkapan Yunani.
