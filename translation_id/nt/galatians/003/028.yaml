id: GAL.3.28
reference: Galatians 3:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: id
  text: Tidak ada orang Yahudi ataupun orang Yunani, tidak ada budak ataupun orang merdeka, tidak ada laki-laki dan perempuan[a]; sebab kamu semua adalah satu di dalam Mesias Yesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani secara harfiah memakai “laki-laki dan perempuan,” bukan “laki-laki ataupun perempuan”; ungkapan ini mungkin menggemakan Kejadian 1:27.
    reason: Menjelaskan peralihan kata penghubung dan kemungkinan acuan antarteks tanpa memastikan bahwa gema itu disengaja.
  - marker: b
    text: 'Bahasa Yunani: “ἐν Χριστῷ Ἰησοῦ” (“di dalam Kristus Yesus”); Χριστός berarti “Yang Diurapi,” yaitu Mesias.'
    reason: Menjelaskan penerjemahan gelar Χριστός sebagai “Mesias” dan mengutip bentuk Yunani yang benar.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: tidak ada
  rationale: Padanan eksistensial yang alami dalam bahasa Indonesia dan mempertahankan pengulangan tegas Paulus.
- source_word: Ἰουδαῖος οὐδὲ Ἕλλην
  choice: orang Yahudi ataupun orang Yunani
  rationale: Mempertahankan pasangan etnis-keagamaan konkret dalam teks; Ἕλλην diterjemahkan 'orang Yunani', bukan diperluas menjadi 'bangsa bukan Yahudi'.
- source_word: δοῦλος οὐδὲ ἐλεύθερος
  choice: budak ataupun orang merdeka
  rationale: '''Budak'' menyatakan status terikat yang berlawanan langsung dengan status orang merdeka.'
- source_word: ἄρσεν καὶ θῆλυ
  choice: laki-laki dan perempuan
  rationale: Mempertahankan kata penghubung καί, 'dan', yang berbeda dari οὐδέ pada dua pasangan sebelumnya serta kemungkinan menggemakan Kejadian 1:27.
- source_word: πάντες γὰρ ὑμεῖς
  choice: sebab kamu semua
  rationale: Mempertahankan alasan yang diperkenalkan γάρ serta penekanan langsung kepada seluruh penerima surat.
- source_word: εἷς ἐστε
  choice: adalah satu
  rationale: Mempertahankan predikat tunggal yang ringkas tanpa memperluasnya secara interpretatif menjadi 'satu pribadi' atau sekadar 'bersatu'.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Χριστός dipahami sebagai gelar dan diterjemahkan 'Mesias'; 'di dalam' mempertahankan ungkapan relasional ἐν tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Peralihan dari οὐδέ kepada καί dalam pasangan ketiga
  choice: tidak ada laki-laki dan perempuan
  alternative: tidak ada laki-laki ataupun perempuan
  rationale: Bentuk yang dipilih mempertahankan perbedaan formal dalam bahasa Yunani dan kemungkinan gema Kejadian 1:27, walaupun bentuk alternatif lebih idiomatis.
- issue: Makna kesatuan dalam εἷς ἐστε
  choice: kamu semua adalah satu
  alternative: kamu semua bersatu
  rationale: Terjemahan minimal mempertahankan ketegangan pernyataan Paulus tanpa menentukan bahwa segala perbedaan ciptaan dihapuskan atau mereduksinya menjadi keselarasan sosial semata.
- issue: Daya gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam frasa ini Χριστός tetap menyatakan jabatan Yesus sebagai Yang Diurapi; 'Mesias' menyampaikan daya gelar itu secara transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan paralel yang ringkas dan bermartabat. Pengulangan 'tidak ada' dipertahankan untuk menampilkan tekanan retoris teks; 'ataupun' dipakai pada dua pasangan pertama, sedangkan 'dan' dipertahankan pada pasangan ketiga.
