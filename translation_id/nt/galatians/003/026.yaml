  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: id
  text: Sebab melalui iman, kamu semua adalah putra-putra Allah di dalam Mesias Yesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Allah.” Teks Yunani memakai “putra-putra,” yang menonjolkan kedudukan sebagai anak dan ahli waris; dalam konteks ini, sebutan tersebut mencakup semua orang yang beriman, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “Kristus Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: kamu semua
  rationale: Dengan verba orang kedua jamak ἐστε, kata ini mencakup seluruh kelompok yang disapa; “kamu semua” jelas dan alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan dasar bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan argumentatif itu.
- source_word: υἱοὶ θεοῦ
  choice: putra-putra Allah
  rationale: υἱοί secara harfiah berarti “putra-putra” dan dalam konteks Paulus membawa nuansa status sebagai ahli waris. Catatan kaki menjelaskan bahwa seluruh orang percaya tercakup.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: διά dengan genitif menyatakan sarana atau perantaraan, sedangkan πίστις diterjemahkan secara wajar sebagai “iman”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: “Di dalam” mempertahankan ungkapan relasional Paulus tanpa mereduksinya menjadi sekadar objek kepercayaan; Χριστός diterjemahkan sebagai gelar “Mesias”.
theological_decisions:
- issue: Bahasa keputraan yang bergender
  choice: putra-putra Allah
  alternative: anak-anak Allah
  rationale: Pilihan utama mempertahankan bentuk maskulin υἱοί serta nuansa kedudukan dan warisan. Catatan kaki menerangkan cakupannya agar tidak disalahpahami hanya merujuk kepada laki-laki.
- issue: Hubungan frasa ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus menerangkan keberadaan sebagai putra-putra Allah
  alternative: iman kepada Mesias Yesus
  rationale: Susunan teks Yunani memungkinkan pembacaan yang erat dengan iman, tetapi ungkapan “di dalam Mesias Yesus” juga merupakan rumusan relasional khas Paulus. Tanda koma dan urutan Indonesia mempertahankan ungkapan itu tanpa mengganti ἐν dengan “kepada”.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar dan maknanya diterjemahkan sebagai “Mesias”; bentuk tradisional “Kristus” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Putra-putra” sengaja dipertahankan untuk mencerminkan istilah Yunani dan nuansa warisan, dengan penjelasan inklusif dalam catatan kaki. Susunan “melalui iman ... di dalam Mesias Yesus” dibuat alami sambil mempertahankan hubungan argumentatif dan ungkapan khas Paulus.
