    issue: “percaya kepada Allah” berpotensi mengaburkan konstruksi πιστεύω + datif.
    rationale: Konstruksi Yunani ini menekankan bahwa Abraham memercayai Allah/percaya kepada perkataan Allah. Dalam bahasa Indonesia, “percaya kepada Allah” sering dipahami sebagai percaya atau beriman kepada Allah secara umum. Bentuk transitif “memercayai Allah” menyampaikan objek personal secara lebih langsung.
  revised_text: Sama seperti Abraham memercayai Allah, dan hal itu diperhitungkan kepadanya sebagai kebenaran[a],
