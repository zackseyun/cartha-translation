  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: id
  text: Sama seperti Abraham memercayai Allah, dan hal itu diperhitungkan kepadanya sebagai kebenaran[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: Alternatif leksikal bagi δικαιοσύνη.
lexical_decisions:
- source_word: καθὼς
  choice: Sama seperti
  rationale: Mempertahankan daya komparatif yang menghubungkan Abraham dengan argumen Paulus dan terdengar alami dalam bahasa Indonesia.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Menerjemahkan secara langsung bentuk aoris πιστεύω tanpa menambahkan nuansa tafsiran seperti 'beriman' atau 'memercayakan diri'.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Konstruksi 'percaya kepada Allah' alami dalam bahasa Indonesia dan dapat menyatakan bahwa Abraham menerima firman Allah sebagai benar; objeknya adalah Allah, bukan sekadar kepercayaan umum tentang keberadaan-Nya.
- source_word: ἐλογίσθη
  choice: diperhitungkan
  rationale: Mempertahankan nuansa penghitungan atau penetapan dari λογίζομαι, sekaligus sesuai dengan konteks status yang dibicarakan Paulus.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Menyatakan secara langsung pihak yang menerima perhitungan tersebut.
- source_word: εἰς δικαιοσύνην
  choice: sebagai kebenaran
  rationale: Mengungkapkan hasil atau status yang diperhitungkan tanpa memperluas makna teks; alternatif 'keadilan' dicatat karena δικαιοσύνη memiliki rentang makna tersebut.
theological_decisions:
- issue: Makna δικαιοσύνη dalam kutipan Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' paling sesuai dengan konteks sesuatu yang diperhitungkan kepada Abraham sebagai status benar, sedangkan kemungkinan leksikal ''keadilan'' tetap dipertahankan dalam catatan kaki tanpa memaksakan penyelesaian atas rentang maknanya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Koma akhir dipertahankan karena kalimat berlanjut secara sintaksis ke ayat berikutnya.
