base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: id
  text: 'Namun, hukum tidak berasal dari iman, melainkan: “Orang yang melakukan segala hal itu akan hidup olehnya.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan hidup di dalam segala hal itu.”
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Imamat 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: hukum
  rationale: Mempertahankan ungkapan Paulus yang luas, sementara konteks tetap memungkinkan rujukan kepada hukum Musa; bahasa Yunani tidak menandai kapitalisasi.
- source_word: ἐκ
  choice: berasal dari
  rationale: Mencerminkan gagasan sumber atau prinsip dalam ἐκ dan mempertahankan kontras Paulus antara hukum dan iman tanpa mempersempit maknanya menjadi parafrasa.
- source_word: πίστεως
  choice: iman
  rationale: Padanan baku dan alami untuk πίστις dalam konteks ini, yang menunjuk pada iman sebagai prinsip.
- source_word: ἀλλά
  choice: sebaliknya
  rationale: Menandai pertentangan yang tegas dan memperkenalkan kutipan Kitab Suci dengan alami.
- source_word: ὁ ποιήσας
  choice: orang yang melakukannya
  rationale: Menyampaikan daya generik partisip substantival tunggal dan tetap wajar dalam bahasa Indonesia.
- source_word: αὐτά
  choice: -nya dalam “melakukannya”
  rationale: Klitik -nya secara alami merujuk kembali kepada ketetapan atau perintah hukum tanpa membuat objek lebih eksplisit daripada teks Yunani.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Menyampaikan bentuk futurum secara langsung dalam bahasa Indonesia modern.
- source_word: ἐν αὐτοῖς
  choice: olehnya
  rationale: Menyampaikan kemungkinan arti instrumental, yakni hidup dengan melakukan tuntutan hukum, sambil mempertahankan terjemahan yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Kontras Paulus antara hukum dan iman
  choice: “hukum tidak berasal dari iman”
  alternative: “hukum tidak didasarkan pada iman” atau “hukum tidak bekerja menurut prinsip iman”
  rationale: Pilihan ini tetap dekat dengan ἐκ πίστεως dan membiarkan ketegangan teologis Paulus tetap terbuka, tanpa memasukkan penjelasan sistematis ke dalam teks.
- issue: Daya ungkapan ἐν αὐτοῖς dalam kutipan Imamat 18:5
  choice: “akan hidup olehnya”
  alternative: “akan hidup di dalamnya”
  rationale: Bentuk utama menyampaikan pengertian sarana atau dasar yang wajar dalam konteks, sedangkan kemungkinan lokatif yang lebih formal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” dan “sebaliknya” membuat hubungan argumentatif jelas tanpa menghilangkan ketegasan kontras Yunani. Semua penanda catatan kaki ditempatkan setelah kutipan karena catatan [a] menerangkan frasa penutup dan [b] mengidentifikasi keseluruhan kutipan.
