id: GAL.3.11
reference: Galatians 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: id
  text: Jelaslah bahwa tidak seorang pun dibenarkan di hadapan Allah berdasarkan hukum Taurat, sebab “Orang benar akan hidup berdasarkan iman.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang benar akan hidup berdasarkan kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Paulus mengutip Habakuk 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Jelaslah bahwa
  rationale: δὲ menandai peralihan ringan dalam argumen dan tidak perlu diterjemahkan dengan kata temporal; hubungannya tersampaikan secara alami dalam susunan kalimat Indonesia.
- source_word: ἐν νόμῳ
  choice: berdasarkan hukum Taurat
  rationale: Dalam argumen yuridis ini, ἐν menyatakan dasar atau sarana. 'Hukum Taurat' memperjelas bahwa νόμος menunjuk pada hukum dalam kerangka Taurat, bukan hukum secara umum.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan baku dan jelas yang mempertahankan negasi universal.
- source_word: δικαιοῦται
  choice: dibenarkan
  rationale: Mempertahankan nuansa forensik, yaitu dinyatakan benar dalam penghakiman, sekaligus memakai istilah Indonesia yang mapan.
- source_word: παρὰ τῷ θεῷ
  choice: di hadapan Allah
  rationale: Menggambarkan kedudukan seseorang dalam penilaian Allah dan mempertahankan nuansa ruang pengadilan.
- source_word: δῆλον
  choice: Jelaslah
  rationale: Padanan alami dan bernada argumentatif bagi predikat impersonal 'jelas/eviden'.
- source_word: Ὁ δίκαιος
  choice: Orang benar
  rationale: Menerjemahkan adjektiva substantival secara alami tanpa menambahkan penjelasan identitas orang tersebut.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: Mempertahankan arti utama πίστις sebagai iman serta hubungan ἐκ sebagai dasar atau sumber; kemungkinan 'kesetiaan' dicatat dalam catatan kaki.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Menerjemahkan bentuk futurum secara langsung dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan frasa ἐκ πίστεως dalam kutipan Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: Orang benar akan hidup berdasarkan iman
  alternative: Orang yang benar berdasarkan iman akan hidup
  rationale: Teks utama mempertahankan pembacaan yang paling alami tanpa mengikat ἐκ πίστεως secara eksplisit pada 'orang benar'. Alternatif sintaksis tetap mungkin, tetapi tidak dimasukkan karena akan menyelesaikan ambiguitas Yunani.
- issue: Makna πίστις dalam kutipan Habakuk 2:4
  choice: iman
  alternative: kesetiaan
  rationale: '''Iman'' merupakan padanan utama yang sesuai dengan pemakaian Paulus dalam konteks ini, sedangkan kemungkinan leksikal ''kesetiaan'' dipertahankan dalam catatan kaki agar ketegangan penafsiran tidak dihapus.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat lugas untuk pembaca umum, dengan istilah teologis-yuridis 'dibenarkan' dipertahankan. Penanda catatan ditempatkan setelah kutipan yang menjadi pokok kedua catatan.
