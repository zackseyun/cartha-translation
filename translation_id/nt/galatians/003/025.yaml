id: GAL.3.25
reference: Galatians 3:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: id
  text: Namun, sekarang setelah iman itu datang[a], kita tidak lagi berada di bawah pengawasan seorang wali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “setelah iman datang.”
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “wali” merujuk pada seorang pengawas rumah tangga yang bertanggung jawab atas anak yang belum dewasa, bukan terutama seorang guru di kelas.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: sekarang setelah ... datang
  rationale: Partisip aoris dalam konstruksi genitif absolut paling alami dialihkan menjadi anak kalimat waktu. Ungkapan ini menyatakan kedatangan yang telah terjadi dan keadaan baru yang kini berlaku.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang mengandung kontras ringan dengan masa pengawasan yang disebut dalam ayat sebelumnya.
- source_word: πίστεως
  choice: iman itu
  rationale: Kata sandang Yunani dan konteks menunjuk kembali kepada iman yang baru disebut serta kedatangannya dalam rangka sejarah keselamatan. 'Iman itu' mempertahankan sifat definit tanpa menjadikannya nama suatu sistem keagamaan.
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Secara langsung menyatakan berakhirnya keadaan sebelumnya.
- source_word: ὑπὸ παιδαγωγόν
  choice: berada di bawah pengawasan seorang wali
  rationale: Ungkapan ini mempertahankan gambaran ketundukan kepada παιδαγωγός sambil menjelaskan secara alami dalam bahasa Indonesia bahwa yang dimaksud ialah fungsi pengawasan.
- source_word: ἐσμεν
  choice: kita ... berada
  rationale: Kopula kini diterjemahkan secara idiomatis bersama frasa keadaan 'berada di bawah pengawasan'.
theological_decisions:
- issue: Makna kedatangan πίστη dalam konteks
  choice: iman itu datang
  alternative: iman datang; kepercayaan itu datang
  rationale: Terjemahan mempertahankan personifikasi dan peralihan sejarah keselamatan dalam argumen Paulus tanpa menentukan secara lebih sempit apakah πίστη terutama berarti tindakan percaya atau tatanan yang ditandai oleh iman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Wali' dipertahankan sebagai padanan ringkas bagi παιδαγωγός, sedangkan frasa 'di bawah pengawasan' dan catatan kaki mencegah pengertian sebagai guru kelas. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
