id: GAL.3.21
reference: Galatians 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: id
  text: Jadi, apakah hukum Taurat bertentangan dengan janji-janji Allah? Sama sekali tidak! Sebab, seandainya telah diberikan suatu hukum yang sanggup memberi hidup, maka kebenaran memang akan berasal dari hukum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: hukum Taurat / suatu hukum / hukum
  rationale: Kemunculan pertama membawa gema kuat hukum Musa dalam alur Galatia, sehingga diterjemahkan “hukum Taurat.” Dalam klausa hipotesis tanpa artikel, “suatu hukum” mempertahankan sifat kategorisnya; kemunculan terakhir memakai “hukum” secara ringkas sambil tetap merujuk pada kategori yang sama.
- source_word: κατὰ
  choice: bertentangan dengan
  rationale: Dengan bentuk genitif, kata ini menyatakan pertentangan. Ungkapan ini alami dalam bahasa Indonesia dan cocok dengan pertanyaan retoris Paulus.
- source_word: ἐπαγγελιῶν
  choice: janji-janji
  rationale: Bentuk jamak Yunani dipertahankan dan menunjuk pada berbagai janji Allah yang telah dibahas dalam konteks.
- source_word: μὴ γένοιτο
  choice: Sama sekali tidak!
  rationale: Ini menyampaikan penolakan keras khas Paulus secara jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἐδόθη
  choice: telah diberikan
  rationale: Bentuk pasif dipertahankan, sedangkan aspek waktu dibuat alami dalam konstruksi pengandaian lampau “seandainya telah diberikan.”
- source_word: δυνάμενος
  choice: yang sanggup
  rationale: Menyatakan kemampuan hukum yang diandaikan dan secara alami menerangkan “suatu hukum.”
- source_word: ζῳοποιῆσαι
  choice: menghidupkan
  rationale: Mempertahankan daya verbal ‘membuat hidup/memberi hidup’ secara padat dan alami, tanpa menentukan lebih jauh apakah hidup jasmani, rohani, atau eskatologis yang terutama dimaksud.
- source_word: ὄντως
  choice: memang
  rationale: Memberi penegasan pada kesimpulan hipotesis dengan ungkapan Indonesia yang alami.
- source_word: ἐκ νόμου
  choice: berasal dari hukum
  rationale: “Berasal dari” mempertahankan gagasan sumber yang terkandung dalam ἐκ dan menghindari penyempitan menjadi sekadar sarana.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Dalam pemakaian Paulus, δικαιοσύνη dapat mencakup status benar di hadapan Allah sekaligus dimensi keadilan. “Kebenaran” merupakan padanan Alkitabiah Indonesia yang dikenal; alternatif “keadilan” dicatat agar keluasan istilah tidak dihapus.
theological_decisions:
- issue: Cakupan νόμος dalam argumen Paulus
  choice: “hukum Taurat” pada pertanyaan awal, lalu “suatu hukum” dalam pengandaian
  alternative: “hukum” pada semua kemunculan
  rationale: Konteks mengarahkan kemunculan awal kepada hukum Musa, tetapi sintaksis klausa bersyarat berbicara tentang hukum sebagai kategori. Pembedaan ini mempertahankan gema historis dan keluasan argumen tanpa memaksakan salah satunya.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Konteks membahas bagaimana manusia memperoleh keadaan benar di hadapan Allah, tetapi istilah Yunani juga dapat menyandang nuansa keadilan. Teks utama memakai padanan yang paling sesuai dengan argumen, sementara alternatif dipertahankan dalam catatan kaki.
- issue: Kemampuan hukum untuk memberi hidup
  choice: 'pernyataan bersyarat yang tidak nyata: “seandainya ... maka ...”'
  alternative: pernyataan kemungkinan terbuka
  rationale: 'Bentuk Yunani dengan ἄν menyatakan konsekuensi yang bersifat kontrafaktual dalam konteks: tidak ada hukum yang diberikan yang sanggup menghidupkan. Terjemahan mempertahankan logika ini tanpa menambahkan penjelasan doktrinal.'
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan retoris pertanyaan, penolakan tegas, dan pengandaian Paulus dipertahankan. Penanda catatan kaki [a] ditempatkan setelah klausa yang memuat istilah δικαιοσύνη.
