id: GAL.3.5
reference: Galatians 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: id
  text: Jadi, apakah Dia yang terus menyediakan Roh kepada kalian dan mengerjakan mukjizat-mukjizat di antara kalian[a] melakukannya melalui perbuatan hukum Taurat, atau melalui pendengaran dengan iman[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam diri kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui pendengaran iman,” atau “melalui berita yang didengar dengan iman.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: terus menyediakan
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung; 'menyediakan' mempertahankan gagasan pemberian atau penyediaan yang diperlukan tanpa menjadi terlalu bebas.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Paulus, bentuk definit dan pembahasan sebelumnya menunjuk kepada Roh Allah; 'Roh' cukup jelas tanpa menambahkan kata 'Kudus' yang tidak tertulis.
- source_word: ἐνεργῶν δυνάμεις
  choice: mengadakan berbagai mukjizat
  rationale: Ungkapan ini secara alami menunjuk pada pelaksanaan perbuatan-perbuatan berkuasa. 'Mukjizat' menyampaikan makna kontekstual dengan jelas, sedangkan 'berbagai' mencerminkan bentuk jamak δυνάμεις.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Ungkapan ini paling wajar dipahami sebagai karya-karya ajaib yang terjadi di tengah jemaat Galatia; kemungkinan 'di dalam diri kalian' dipertahankan dalam catatan kaki.
- source_word: ἐξ ἔργων νόμου
  choice: karena perbuatan-perbuatan berdasarkan hukum Taurat
  rationale: ἐκ di sini menyatakan dasar atau sarana yang dikontraskan dengan mendengar dalam iman. 'Berdasarkan hukum Taurat' menyampaikan bahwa perbuatan tersebut dituntut atau ditentukan oleh Taurat.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam alur argumentasi Paulus, νόμος merujuk pada Taurat. Ungkapan baku Indonesia 'hukum Taurat' membuat rujukan itu jelas.
- source_word: ἀκοῆς πίστεως
  choice: karena kalian mendengar dengan iman
  rationale: Frasa genitif yang padat ini diterjemahkan secara idiomatis sebagai tindakan mendengar yang disertai iman, sambil mempertahankan alternatif yang masuk akal dalam catatan kaki.
- source_word: πίστεως
  choice: iman
  rationale: '''Iman'' paling sesuai dengan kontras Paulus antara perbuatan berdasarkan Taurat dan respons percaya; ''kesetiaan'' kurang mungkin dalam konstruksi ini.'
theological_decisions:
- issue: Pelaku tersirat dalam dua partisipel, yaitu Dia yang menyediakan Roh dan mengadakan mukjizat.
  choice: Dia
  alternative: Allah
  rationale: Huruf kapital menandai rujukan ilahi yang jelas dari konteks tanpa menyisipkan nomina 'Allah' yang tidak dinyatakan dalam ayat Yunani.
- issue: Hubungan genitif dalam ἀκοῆς πίστεως bersifat padat dan dapat dipahami dengan beberapa cara yang berdekatan.
  choice: kalian mendengar dengan iman
  alternative: mendengar tentang iman; berita yang didengar dengan iman
  rationale: Pilihan utama mempertahankan kontras retoris antara perbuatan berdasarkan Taurat dan pendengaran yang disertai iman. Alternatif yang mungkin tidak dihapus, tetapi dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν secara jelas. Kalimat tanya retoris dan kontras antardua dasar dipertahankan.
