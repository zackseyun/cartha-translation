  to: 'Hanya satu hal yang ingin kuketahui dari kalian: Apakah kalian menerima Roh karena perbuatan-perbuatan berdasarkan hukum Taurat, atau karena mendengar dengan iman?[a][b]'
  rationale: Revisi mempertahankan penekanan pembuka dan pertanyaan retoris sambil menerjemahkan μαθεῖν lebih dekat sebagai “kuk etahui” dan menjaga ἔργων νόμου sebagai frasa Paulus yang tidak diparafrasakan secara berlebihan. Catatan pertama diperbaiki agar mencerminkan ambiguitas konstruksi ἀκοῆς πίστεως tanpa menetapkan isi pendengaran secara sempit. Penanda catatan tetap melekat pada pertanyaan yang memuat frasa ambigu dan urutannya konsisten dengan catatan yang tersedia.
