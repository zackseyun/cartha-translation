  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: id
  text: 'Hanya satu hal yang ingin kuketahui dari kalian: Apakah kalian menerima Roh karena perbuatan-perbuatan berdasarkan hukum Taurat, atau karena mendengar dengan iman?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui pendengaran iman”; ungkapan Yunani ini juga dapat dipahami sebagai “karena mendengar berita itu dengan iman.”
    reason: alternative_reading
  - marker: b
    text: “Kesetiaan” adalah nuansa yang kurang mungkin untuk kata yang diterjemahkan “iman” di sini, tetapi kadang-kadang dipertimbangkan karena susunan ungkapan Yunaninya ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Hanya ini
  rationale: Mempertahankan penekanan di awal kalimat dan terdengar alami dalam bahasa Indonesia.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: yang ingin kutanyakan kepada kalian
  rationale: Secara harfiah berarti 'ingin mengetahui dari kalian'; dalam konteks pertanyaan retoris, 'ingin kutanyakan kepada kalian' menyampaikan maksudnya secara alami dan tetap menandai bahwa ὑμῶν berbentuk jamak.
- source_word: ἐξ ἔργων νόμου
  choice: karena melakukan apa yang dituntut hukum Taurat
  rationale: Mengungkapkan ungkapan padat Yunani secara jelas bagi pembaca modern. 'Hukum Taurat' menunjukkan hukum yang dimaksud dalam konteks Paulus, sedangkan 'melakukan apa yang dituntut' mempertahankan gagasan ἔργα tanpa menyempitkannya menjadi jasa.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Konteks menunjuk kepada Roh Allah; huruf kapital menandai referen ilahi tanpa menambahkan kata 'Kudus' yang tidak terdapat dalam teks Yunani.
- source_word: ἐλάβετε
  choice: kalian menerima
  rationale: Bentuk lampau Yunani merujuk pada penerimaan Roh pada awal pengalaman iman mereka; bahasa Indonesia tidak perlu menandai kala secara morfologis.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: karena mendengar dengan iman
  rationale: Mempertahankan hubungan antara mendengar dan iman serta kontras dengan melakukan tuntutan hukum, sambil membiarkan konstruksi genitif Yunani yang padat dijelaskan dalam catatan.
- source_word: πίστεως
  choice: iman
  rationale: Padanan baku dan paling mungkin bagi πίστις di sini; kemungkinan nuansa 'kesetiaan' dicatat tanpa menjadikannya bacaan utama.
theological_decisions:
- issue: Referen τὸ πνεῦμα
  choice: Roh Allah yang diterima orang percaya
  alternative: pengalaman atau kuasa rohani secara umum
  rationale: Konteks Galatia 3 membahas pemberian Roh oleh Allah kepada jemaat, sehingga referen ilahi paling kuat, tetapi kata 'Kudus' tidak ditambahkan ke teks utama.
- issue: Hubungan ἀκοῆς dan πίστεως
  choice: mendengar dengan iman
  alternative: mendengar berita yang membangkitkan iman; mendengar tentang iman
  rationale: Konstruksi genitifnya ringkas dan dapat dipahami dengan beberapa cara. Teks utama mempertahankan kaitan mendengar dan iman tanpa menentukan isi yang didengar secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bernada retoris. Kata ganti 'kalian' dipakai untuk menandai bentuk jamak; bentuk 'kutanyakan' mempertahankan suara pribadi Paulus. Penanda catatan ditempatkan setelah frasa yang ambigu.
