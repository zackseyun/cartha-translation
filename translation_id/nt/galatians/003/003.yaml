  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: id
  text: Begitu bodohkah kalian? Setelah memulai dengan Roh[a], apakah sekarang kalian sedang disempurnakan[c] dengan daging[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Roh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan usaha manusia”; mungkin juga “dengan natur yang berdosa.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sedang diselesaikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: begitu
  rationale: 'Dalam pertanyaan retoris ini, kata tersebut terutama menyatakan tingkat: “begitu bodoh,” bukan sekadar cara.'
- source_word: ἀνόητοί
  choice: bodoh
  rationale: Menyampaikan kurangnya pengertian atau pertimbangan dengan teguran yang langsung, tanpa memperkerasnya menjadi hinaan yang lebih kasar.
- source_word: ἐναρξάμενοι
  choice: setelah memulai
  rationale: Partisip aoris menunjukkan tindakan yang mendahului kata kerja utama dan menajamkan kontras antara permulaan dahulu dan tindakan sekarang.
- source_word: πνεύματι
  choice: dengan Roh
  rationale: Konteks Galatia 3 menunjuk kepada Roh Kudus. “Dengan” menyampaikan sarana atau lingkup tanpa menutup kemungkinan nuansa “di dalam Roh.”
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan kontras waktu yang tajam dalam teguran Paulus.
- source_word: σαρκὶ
  choice: dengan daging
  rationale: Mempertahankan istilah khas Paulus dan kesejajarannya dengan “dengan Roh,” tanpa mempersempit maknanya hanya menjadi usaha manusia atau natur berdosa.
- source_word: ἐπιτελεῖσθε
  choice: sedang disempurnakan
  rationale: Bentuk kini tengah/pasif menggambarkan proses menuju penyelesaian atau kesempurnaan; bentuk pasif Indonesia menjaga keterbukaan gramatikal dan daya retorisnya.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus
  alternative: roh manusia atau prinsip rohani
  rationale: Konteks langsung membahas penerimaan Roh dan karya-karya ajaib, sehingga Roh Kudus merupakan rujukan yang paling kuat.
- issue: Makna σάρξ dalam pertentangannya dengan Roh
  choice: daging
  alternative: usaha manusia atau natur berdosa
  rationale: Istilah harfiah mempertahankan keluasan dan ketegangan bahasa Paulus; kemungkinan penjelasannya disajikan dalam catatan tanpa dipaksakan ke dalam teks utama.
- issue: Nuansa ἐπιτελεῖσθε
  choice: sedang disempurnakan
  alternative: sedang diselesaikan
  rationale: “Disempurnakan” mempertahankan gagasan bergerak menuju kematangan atau tujuan akhir, sedangkan “diselesaikan” tetap mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai teguran langsung kepada jemaat. Susunan pertanyaan dibuat ringkas dan retoris. Istilah “Roh” dikapitalisasi karena konteks menunjuk kepada Roh Kudus, sedangkan “daging” dipertahankan untuk menjaga ambiguitas teologis istilah Paulus.
