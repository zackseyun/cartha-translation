  source_fidelity: Teks Indonesia secara setia menyampaikan dua pertanyaan retoris Yunani, penekanan οὕτως (‘begitu’), tindakan awal dalam πνεύματι, kontras waktu νῦν (‘sekarang’), serta bentuk proses kini tengah/pasif ἐπιτελεῖσθε (‘sedang disempurnakan’). ‘Daging’ mempertahankan keluasan σάρξ tanpa mengunci maknanya pada satu penafsiran.
  naturalness: Bahasa baku modern, lugas, dan wajar untuk teguran retoris kepada kelompok. ‘Begitu bodohkah kalian?’ dan susunan anak kalimat ‘Setelah memulai dengan Roh’ dapat diterima dan tetap jelas.
  terminology: Kapitalisasi ‘Roh’ sesuai konteks Roh Kudus dalam Galatia 3. ‘Daging’ adalah padanan yang tepat dan penting bagi σάρξ; catatan alternatif menyediakan penjelasan tanpa menggantikan istilah utama. ‘Disempurnakan’ sesuai nuansa penyelesaian/menuju kepenuhan dari ἐπιτελεῖσθε.
