id: GAL.3.14
reference: Galatians 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: id
  text: supaya di dalam Mesias Yesus[b] berkat Abraham sampai kepada orang-orang bukan Yahudi[a], supaya kita menerima janji Roh[c] melalui iman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “di dalam Kristus Yesus.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Roh yang dijanjikan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan pada kedua klausa dan mempertahankan struktur tujuan ganda ayat ini dalam bahasa Indonesia yang alami.
- source_word: εἰς τὰ ἔθνη
  choice: kepada bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks argumen Paulus, ἔθνη terutama menunjuk kepada orang-orang atau bangsa-bangsa non-Yahudi; bentuk ini juga mempertahankan unsur jamak dan kaitannya dengan bangsa-bangsa.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: berkat Abraham
  rationale: Ungkapan genitif ini secara alami menunjuk pada berkat yang berkaitan dengan Abraham, tanpa menambahkan penafsiran yang tidak dinyatakan.
- source_word: γένηται
  choice: sampai
  rationale: Dalam konstruksi ini, 'sampai kepada' menyampaikan gagasan bahwa berkat itu datang atau menjangkau bangsa-bangsa bukan Yahudi dengan idiom Indonesia yang wajar.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Mempertahankan ungkapan kesatuan atau ranah khas Paulus melalui 'di dalam', serta menerjemahkan Χριστός sebagai gelar 'Mesias' dalam konteks janji Abraham.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: janji Roh
  rationale: Mempertahankan bentuk genitif Yunani dan tidak memutuskan secara diam-diam apakah maksudnya janji mengenai Roh atau janji yang berasal dari Roh.
- source_word: λάβωμεν
  choice: kita menerima
  rationale: Dengan 'supaya', bentuk ini secara alami menyatakan tujuan yang terkandung dalam aoristus subjungtif Yunani.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: Menyatakan sarana dengan jelas dan mempertahankan padanan baku πίστις sebagai 'iman'.
theological_decisions:
- issue: Apakah Χριστός diterjemahkan sebagai gelar atau dipertahankan dalam bentuk tradisional
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam argumen tentang berkat dan janji Abraham, gelar Mesias tetap bermakna; terjemahan ini menampilkan makna gelarnya, sementara bentuk tradisional dicatat dalam catatan kaki.
- issue: Makna genitif τοῦ πνεύματος
  choice: janji Roh
  alternative: Roh yang dijanjikan
  rationale: Teks utama mempertahankan ketegangan bentuk genitif Yunani. Penafsiran yang sangat mungkin bahwa Roh adalah yang dijanjikan diberikan sebagai alternatif, bukan dimasukkan tanpa penanda ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'supaya' mempertahankan struktur dua klausa tujuan dalam bahasa Yunani. Istilah 'bangsa-bangsa bukan Yahudi' dipilih agar dapat dipahami pembaca umum sekaligus tetap dekat dengan bentuk jamak sumber.
