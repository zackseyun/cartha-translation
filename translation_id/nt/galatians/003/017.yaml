id: GAL.3.17
reference: Galatians 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: id
  text: 'Maksud saya ialah: hukum Taurat, yang datang 430 tahun kemudian, tidak membatalkan[a] perjanjian yang sebelumnya telah disahkan oleh Allah sehingga meniadakan[b] janji itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyatakan tidak sah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat tidak berlaku” atau “mengesampingkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Maksud saya ialah
  rationale: Ungkapan alami dalam bahasa Indonesia untuk memperkenalkan penjelasan Paulus; δέ tidak perlu diterjemahkan dengan penanda waktu karena teks Yunani tidak memuat kata 'sekarang'.
- source_word: διαθήκην
  choice: perjanjian
  rationale: Dalam konteks Galatia 3, istilah ini menunjuk pada ikatan perjanjian Allah yang berkaitan dengan janji kepada Abraham.
- source_word: προκεκυρωμένην
  choice: yang sebelumnya telah disahkan
  rationale: Menjaga gagasan tindakan hukum yang sudah dilakukan lebih dahulu serta hasilnya yang tetap berlaku, sebagaimana ditandai oleh bentuk perfektum.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: oleh Allah
  rationale: Menerjemahkan pelaku tindakan secara langsung tanpa menambahkan penekanan yang tidak dinyatakan dalam teks.
- source_word: ὁ ... γεγονὼς νόμος
  choice: hukum Taurat, yang datang
  rationale: Dalam konteks sejarah keselamatan ini, νόμος menunjuk pada hukum Taurat yang diberikan sesudah janji; 'datang' menyampaikan kemunculannya pada tahap sejarah yang kemudian.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: 430 tahun kemudian
  rationale: Menyatakan selang waktu kronologis secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: οὐκ ἀκυροῖ
  choice: tidak membatalkan
  rationale: Menyampaikan daya hukum ἀκυρόω, yakni menjadikan suatu ketetapan tidak sah atau tidak berlaku.
- source_word: εἰς τὸ καταργῆσαι
  choice: sehingga meniadakan
  rationale: Mempertahankan kemungkinan nuansa tujuan atau akibat dari konstruksi εἰς τό dengan infinitif, sekaligus menyampaikan gagasan membuat janji tidak efektif.
- source_word: τὴν ἐπαγγελίαν
  choice: janji itu
  rationale: Merujuk kembali secara jelas pada janji Allah kepada Abraham yang sedang dibahas.
theological_decisions:
- issue: Makna διαθήκη dalam argumen Paulus
  choice: perjanjian
  alternative: wasiat atau ketetapan hukum
  rationale: Konteks berpusat pada janji Allah kepada Abraham dan hubungan perjanjian yang telah ditetapkan lebih dahulu; 'perjanjian' menjaga alur argumen tanpa mengubahnya menjadi pembahasan khusus tentang surat wasiat.
- issue: Hubungan εἰς τὸ καταργῆσαι dengan pembatalan perjanjian
  choice: sehingga meniadakan
  alternative: dengan tujuan meniadakan
  rationale: Konstruksi Yunani dapat mengandung nuansa tujuan atau hasil. 'Sehingga' mempertahankan keluwesan itu dan tidak memaksakan satu analisis teologis saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Istilah 'hukum Taurat', 'perjanjian', dan 'janji' dipertahankan sebagai kosakata utama argumen Paulus. Angka 430 digunakan agar selang waktu segera terbaca dengan jelas.
