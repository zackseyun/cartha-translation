id: GAL.3.19
reference: Galatians 3:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: id
  text: Jadi, untuk apa hukum Taurat? Hukum itu ditambahkan karena pelanggaran-pelanggaran[b] sampai datangnya keturunan[a] yang kepadanya janji itu telah diberikan. Hukum itu ditetapkan[c] melalui malaikat-malaikat dengan perantaraan seorang pengantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benih” atau “seorang keturunan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “karena pelanggaran-pelanggaran” dapat berarti untuk menangani, menyingkapkan, atau mengekang pelanggaran; bahasa Yunani tidak menentukannya secara lebih sempit.
    reason: alternative_reading
  - marker: c
    text: Atau “diatur” atau “disusun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Jadi, untuk apa hukum Taurat?
  rationale: Pertanyaan eliptis ini menanyakan fungsi atau tujuan hukum dalam alur argumen Paulus, bukan definisi hakikatnya. Bentuk ini alami dalam bahasa Indonesia.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam konteks ini νόμος menunjuk pada hukum Musa; 'hukum Taurat' jelas dan lazim bagi pembaca Indonesia.
- source_word: τῶν παραβάσεων χάριν
  choice: karena pelanggaran-pelanggaran
  rationale: Ungkapan ini dapat menyatakan alasan atau tujuan. Terjemahan yang luas ini tidak mempersempitnya menjadi mencegah, menyingkapkan, atau memperbanyak pelanggaran.
- source_word: προσετέθη
  choice: ditambahkan
  rationale: Mencerminkan bentuk pasif dan gagasan bahwa hukum ditambahkan dalam rangkaian argumen.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: sampai datangnya
  rationale: Menandai batas waktu yang menantikan kedatangan keturunan, dengan susunan Indonesia yang lancar.
- source_word: τὸ σπέρμα
  choice: keturunan
  rationale: Dalam bahasa Indonesia, 'keturunan' dapat tetap berbentuk kolektif maupun menunjuk kepada seorang keturunan, sehingga mempertahankan ruang bagi permainan argumentatif Paulus tanpa memakai 'benih' yang kurang alami untuk orang.
- source_word: ᾧ ἐπήγγελται
  choice: yang kepadanya janji itu telah diberikan
  rationale: Menyatakan penerima janji serta daya berlanjut dari bentuk perfect, tanpa menentukan subjek tersirat secara berlebihan.
- source_word: διαταγεὶς
  choice: ditetapkan
  rationale: Menyampaikan pengaturan atau penetapan resmi hukum dengan register yang wajar dan bermartabat.
- source_word: δι’ ἀγγέλων
  choice: melalui malaikat-malaikat
  rationale: Mempertahankan perantaraan atau agensi yang dinyatakan oleh διά dengan genitif.
- source_word: ἐν χειρὶ μεσίτου
  choice: dengan perantaraan seorang pengantara
  rationale: Mengungkapkan idiom Yunani tentang agensi perantara secara alami dalam bahasa Indonesia tanpa menghilangkan istilah kunci 'pengantara'.
theological_decisions:
- issue: Makna 'karena pelanggaran-pelanggaran'
  choice: Dibiarkan luas sebagai 'karena pelanggaran-pelanggaran'.
  alternative: Untuk mencegah, menyingkapkan, atau memperbanyak pelanggaran-pelanggaran.
  rationale: Bahasa Yunani tidak menentukan secara sempit hubungan yang dimaksud; terjemahan mempertahankan ketegangan penafsirannya.
- issue: Makna σπέρμα dalam argumen Paulus
  choice: keturunan
  alternative: benih; seorang keturunan
  rationale: '''Keturunan'' alami dalam bahasa Indonesia dan dapat mempertahankan ambiguitas antara makna kolektif dan rujukan kepada seorang keturunan; catatan menjelaskan alternatifnya.'
- issue: Pelaku-pelaku dalam pemberian hukum
  choice: Hukum ditetapkan melalui malaikat-malaikat dengan perantaraan seorang pengantara.
  alternative: Hukum diatur oleh malaikat-malaikat di tangan seorang pengantara.
  rationale: Terjemahan mempertahankan dua lapis mediasi tanpa mengidentifikasi pengantara itu atau menjelaskan mekanismenya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan yang mudah dipahami. 'Hukum Taurat' dipakai untuk memperjelas rujukan νόμος, sedangkan 'pengantara' dipertahankan sebagai istilah teologis yang umum. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
