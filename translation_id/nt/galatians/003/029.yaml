  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: id
  text: Dan jika kamu milik Mesias,[a] maka kamu adalah benih Abraham,[b] ahli waris menurut janji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: lexical_alternative
  - marker: b
    text: Atau “keturunan.” Kata Yunani yang secara harfiah berarti “benih” berbentuk tunggal di sini dan menggemakan ungkapan Paulus sebelumnya dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: milik Mesias
  rationale: Genitif menyatakan kepunyaan atau keterikatan. “Milik Mesias” alami dalam bahasa Indonesia dan mempertahankan Χριστός sebagai gelar.
- source_word: σπέρμα
  choice: benih
  rationale: Bentuk tunggal kolektif dipertahankan untuk menjaga kaitan leksikal dengan pembahasan Paulus sebelumnya tentang “benih” Abraham, meskipun “keturunan” lebih lazim dalam bahasa Indonesia.
- source_word: κληρονόμοι
  choice: ahli-ahli waris
  rationale: Bentuk jamak mencerminkan subjek jamak ὑμεῖς dan merupakan padanan Indonesia yang wajar dalam konteks keluarga serta warisan perjanjian.
- source_word: κατ’ ἐπαγγελίαν
  choice: menurut janji
  rationale: Ungkapan ringkas ini mempertahankan keluwesan makna Yunani tanpa menentukan secara berlebihan apakah janji itu dasar, patokan, atau cara pewarisan.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Dan jika kamu ... maka
  rationale: Mempertahankan penghubung ringan δέ dan alur logis bersyarat dari εἰ ... ἄρα dalam susunan Indonesia yang jelas.
theological_decisions:
- issue: Apakah σπέρμα diterjemahkan dengan istilah kolektif yang lebih alami atau dengan metafora tunggal yang menggemakan argumentasi sebelumnya.
  choice: benih
  alternative: keturunan
  rationale: “Benih” mempertahankan bentuk dan kaitan penting dengan permainan argumentatif Paulus mengenai benih Abraham dalam Galatia 3; catatan kaki menyediakan padanan yang lebih lazim.
- issue: Apakah Χριστός diperlakukan sebagai gelar atau sebagai bentuk nama yang sudah membeku.
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap dapat dipahami sebagai gelar. Alternatif tradisional “Kristus” dicantumkan tanpa meniadakan ambiguitas pemakaiannya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Kamu” dipakai sebagai bentuk jamak kontekstual yang tetap mudah dipahami; “ahli-ahli waris” memperjelas kejamakan. Metafora “benih” sengaja dipertahankan meskipun kurang lazim daripada “keturunan” agar hubungan internal argumen Paulus tetap terlihat.
