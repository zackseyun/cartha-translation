id: GAL.3.1
reference: Galatians 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: id
  text: Hai orang-orang Galatia yang bodoh! Siapakah yang telah menyihir kalian[a], yang di depan mata kalian Yesus Sang Mesias telah digambarkan dengan jelas sebagai yang disalibkan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah menipu kalian?” Kata Yunani ini secara harfiah membangkitkan gambaran tentang menyihir atau mengenakan mantra.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah dipaparkan dengan jelas” atau “telah diumumkan secara terbuka sebagai yang disalibkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: yang tidak berakal
  rationale: Menyampaikan teguran keras karena gagal memahami, tanpa menambahkan kecaman moral yang lebih berat daripada kata Yunani itu sendiri.
- source_word: Γαλάται
  choice: orang-orang Galatia
  rationale: Sebutan alami dalam bahasa Indonesia bagi orang atau komunitas di Galatia.
- source_word: ἐβάσκανεν
  choice: menyihir
  rationale: Mempertahankan metafora tajam tentang pengaruh gaib atau pesona yang mencelakakan; kemungkinan makna yang lebih umum, yaitu menipu, dicatat dalam catatan kaki.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: di depan mata kalian
  rationale: Ungkapan Indonesia yang alami dan mempertahankan gagasan bahwa hal itu diperlihatkan secara terang dan langsung kepada mereka.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar yang bermakna, bukan seolah-olah nama keluarga; bentuk Sang Mesias terdengar alami dan hormat dalam bahasa Indonesia.
- source_word: προεγράφη
  choice: telah digambarkan dengan jelas
  rationale: Menangkap gagasan bahwa Kristus dipaparkan atau dilukiskan secara terang di hadapan mereka, sambil tidak memaksakan arti teknis seperti ditempelkan pada plakat.
- source_word: ἐσταυρωμένος
  choice: sebagai Dia yang disalibkan
  rationale: 'Mencerminkan fungsi predikatif partisipa: Yesus digambarkan dalam keadaan sebagai pribadi yang telah disalibkan.'
theological_decisions:
- issue: Penerjemahan Χριστός dalam ungkapan Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Pilihan ini mempertahankan isi gelar Χριστός dalam bahasa sasaran dan menghindari kesan bahwa Kristus sekadar unsur nama, tanpa mengubah identitas yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar teguran langsung Paulus tetap jelas. Struktur dibagi dengan tanda seru dan anak kalimat “padahal” untuk menghasilkan kalimat yang wajar tanpa menghilangkan hubungan retoris dalam bahasa Yunani.
