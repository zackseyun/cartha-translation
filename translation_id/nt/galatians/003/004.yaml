id: GAL.3.4
reference: Galatians 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: id
  text: Apakah kalian begitu banyak menderita dengan sia-sia?—jika memang itu benar-benar sia-sia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kalian telah mengalami begitu banyak hal dengan sia-sia?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: begitu banyak hal
  rationale: Bentuk netral jamak menunjuk secara luas kepada banyak hal yang telah dialami jemaat Galatia, dan pilihan ini mempertahankan nuansa jamaknya secara alami.
- source_word: ἐπάθετε
  choice: telah menderita
  rationale: Kata πάσχω dapat berarti 'menderita' atau secara lebih umum 'mengalami'. Dalam konteks kesukaran yang berkaitan dengan iman, 'menderita' paling mungkin menyampaikan daya retoris Paulus, sementara kemungkinan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: εἰκῇ
  choice: dengan sia-sia
  rationale: Ungkapan ini menyampaikan gagasan bahwa semua yang dijalani mungkin tidak menghasilkan tujuan atau manfaat; pengulangannya dipertahankan demi efek retoris.
- source_word: εἴ γε
  choice: jika memang
  rationale: Gabungan partikel ini menyatakan syarat dengan penegasan bernada hati-hati, sehingga Paulus tidak sepenuhnya memastikan bahwa semua itu benar-benar sia-sia.
- source_word: καὶ
  choice: benar-benar
  rationale: Dalam frasa penutup, καὶ menegaskan εἰκῇ. 'Benar-benar' menyampaikan penekanan itu dengan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah pengalaman jemaat Galatia sudah pasti sia-sia
  choice: 'Mempertahankan syarat retoris: ''jika memang benar-benar sia-sia'''
  alternative: Menyatakan secara tegas bahwa pengalaman itu sia-sia
  rationale: 'εἴ γε mempertahankan ketegangan: Paulus memperingatkan tentang kemungkinan kesia-siaan, tetapi ungkapannya sekaligus membuka harapan bahwa hal itu belum tentu sia-sia.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' memperjelas bahwa Paulus menyapa jemaat secara kolektif. Tanda pisah mempertahankan koreksi atau kualifikasi retoris pada bagian akhir.
