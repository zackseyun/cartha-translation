base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: id
  text: Karena itu, ketahuilah[a] bahwa mereka yang beriman—merekalah anak-anak Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kalian tahu.” Bentuk kata Yunani yang sama dapat dipahami sebagai perintah atau sebagai pernyataan.'
    reason: Menjaga ambiguitas gramatikal Γινώσκετε, yang dapat berupa imperatif atau indikatif.
lexical_decisions:
- source_word: Γινώσκετε
  choice: ketahuilah
  rationale: Bentuk ini dapat berfungsi sebagai imperatif atau indikatif. Dalam alur argumentasi, imperatif “ketahuilah” paling wajar, sementara kemungkinan indikatif dicatat dalam catatan kaki.
- source_word: οἱ ἐκ πίστεως
  choice: orang-orang yang hidup berdasarkan iman
  rationale: Ungkapan harfiah “mereka yang dari iman” tidak alami dalam bahasa Indonesia. Pilihan ini mempertahankan iman sebagai dasar yang menentukan kelompok tersebut tanpa mempersempitnya menjadi sekadar persetujuan intelektual.
- source_word: οὗτοι
  choice: merekalah
  rationale: 'Partikel penegas “-lah” menyampaikan tekanan demonstratif pada οὗτοι: kelompok inilah yang disebut anak-anak Abraham.'
- source_word: υἱοί ... Ἀβραάμ
  choice: anak-anak Abraham
  rationale: Dalam konteks garis keturunan dan identitas umat, bentuk jamak “anak-anak” alami dalam bahasa Indonesia dan tetap mempertahankan relasi kekeluargaan metaforis.
theological_decisions:
- issue: Dasar identitas sebagai anak-anak Abraham
  choice: orang-orang yang hidup berdasarkan iman—merekalah anak-anak Abraham
  alternative: orang-orang percaya adalah keturunan Abraham
  rationale: Terjemahan utama mempertahankan bahasa relasional “anak-anak” serta penekanan bahwa kelompok yang ditandai oleh iman itulah anak-anak Abraham, tanpa mengubahnya menjadi istilah biologis atau menyisipkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Karena itu” mengalir alami sebagai kesimpulan, sedangkan tanda pisah dan “merekalah” mempertahankan penekanan οὗτοι.
