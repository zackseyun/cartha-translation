id: GAL.3.13
reference: Galatians 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: id
  text: 'Sang Mesias menebus kita dari kutuk hukum Taurat dengan menjadi kutuk demi kita[a], sebab ada tertulis: “Terkutuklah setiap orang yang digantung pada kayu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kita”; mungkin juga “sebagai pengganti kita.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ξύλον dapat berarti “kayu” atau “pohon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Sang Mesias
  rationale: Menerjemahkan gelar Yunani itu dan mempertahankan nuansa mesianiknya; bentuk dengan “Sang” terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἐξηγόρασεν
  choice: menebus
  rationale: Menyampaikan gagasan pembebasan melalui pembayaran harga dan sesuai dengan pemakaian Paulus.
- source_word: κατάρας
  choice: kutuk
  rationale: Mempertahankan bobot hukum dan perjanjian dari nomina Yunani tanpa penjelasan tambahan.
- source_word: τοῦ νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Galatia, νόμος menunjuk kepada Taurat; padanan ini jelas bagi pembaca Indonesia tanpa mengubah relasi genitif.
- source_word: γενόμενος
  choice: dengan menjadi
  rationale: Mengungkapkan partisip sebagai cara penebusan itu terlaksana, sambil tetap alami dalam bahasa Indonesia.
- source_word: ὑπὲρ ἡμῶν
  choice: demi kita
  rationale: Mempertahankan cakupan ὑπέρ sebagai tindakan untuk kepentingan kita tanpa secara khusus menetapkan arti penggantian.
- source_word: κατάρα
  choice: kutuk
  rationale: Mempertahankan ungkapan Paulus yang mengejutkan bahwa Mesias menjadi kutuk, bukan sekadar menjadi terkutuk.
- source_word: ὅτι γέγραπται
  choice: sebab ada tertulis
  rationale: Menyampaikan fungsi penjelas atau kausal dari kutipan Kitab Suci dalam idiom Indonesia yang lazim.
- source_word: Ἐπικατάρατος
  choice: Terkutuklah
  rationale: Bentuk ini alami untuk pernyataan kutuk dalam sebuah kutipan Kitab Suci dan mempertahankan dayanya.
- source_word: κρεμάμενος
  choice: yang digantung
  rationale: Bentuk pasif paling sesuai dengan orang yang dikenai tindakan penggantungan dalam kutipan Ulangan.
- source_word: ξύλου
  choice: kayu
  rationale: Secara leksikal ξύλον berarti kayu atau benda dari kayu; “kayu” juga selaras dengan rumusan tradisional Ulangan dan tidak memaksakan bahwa objeknya adalah pohon hidup.
theological_decisions:
- issue: Cakupan ὑπὲρ ἡμῶν dalam bahasa penebusan
  choice: demi kita
  alternative: untuk kita; sebagai pengganti kita
  rationale: “Demi kita” menyatakan manfaat dan tindakan yang dilakukan bagi kita, tetapi tidak mempersempit preposisi Yunani menjadi satu model teologis tertentu.
- issue: Makna predikat κατάρα
  choice: menjadi kutuk
  alternative: menjadi terkutuk
  rationale: Nomina predikatif Yunani dipertahankan sebagai nomina agar kekuatan dan ketegangan pernyataan Paulus tidak dilunakkan menjadi adjektiva.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Sang Mesias” menerjemahkan gelar Χριστός; “hukum Taurat” memperjelas rujukan kontekstual νόμος. Susunan kalimat mempertahankan hubungan cara melalui “dengan menjadi” serta formulasi kutipan Kitab Suci.
