id: GAL.3.9
reference: Galatians 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: id
  text: Jadi, mereka yang beriman diberkati bersama-sama dengan Abraham yang beriman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Abraham yang setia.”
    reason: Bahasa Yunani πιστός dapat berarti “beriman” atau “setia.”
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menyatakan kesimpulan dari argumen sebelumnya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: οἱ ἐκ πίστεως
  choice: mereka yang beriman
  rationale: Mengungkapkan orang-orang yang dicirikan oleh iman dalam bahasa Indonesia yang wajar; terjemahan harfiah seperti “mereka yang berasal dari iman” akan kabur dan tidak alami.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada iman atau kepercayaan, bukan terutama sifat kesetiaan.
- source_word: εὐλογοῦνται
  choice: diberkati
  rationale: Mempertahankan bentuk pasif dan menegaskan bahwa berkat diterima, bukan dicapai oleh usaha manusia.
- source_word: σὺν
  choice: bersama-sama dengan
  rationale: Menyatakan bahwa mereka turut menerima berkat yang sama dengan Abraham tanpa mengaburkan unsur kebersamaan.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Abraham yang beriman
  rationale: Dalam alur Galatia 3, Abraham terutama ditampilkan sebagai orang yang percaya kepada Allah; namun kemungkinan makna “Abraham yang setia” tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna πιστός ketika menerangkan Abraham dalam konteks yang berpusat pada iman
  choice: Abraham yang beriman
  alternative: Abraham yang setia
  rationale: πιστός dapat berarti orang yang percaya maupun orang yang setia. Konteks langsung menonjolkan iman Abraham, sehingga “yang beriman” dipakai dalam teks utama, sementara nuansa kesetiaan dipertahankan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan sederhana dan bermartabat. Pengulangan “beriman” sengaja dipertahankan untuk memperlihatkan hubungan leksikal dan argumentatif antara orang-orang beriman dan Abraham.
