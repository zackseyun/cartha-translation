  source_fidelity: 'Terjemahan dengan tepat mempertahankan struktur argumen Yunani: warisan tidak dapat berasal dari hukum apabila tidak lagi berasal dari janji, lalu dikontraskan dengan tindakan Allah kepada Abraham. “Berasal dari” memadai untuk ἐκ/ἐξ, “melalui janji” menyampaikan διά, dan “telah menganugerahkannya” secara baik mencerminkan perfektum κεχάρισται serta nuansa pemberian yang murah hati.'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada wajar. Pengulangan “warisan itu” dalam kalimat pertama membantu kejelasan dan tidak terasa janggal. “Namun” dapat dipakai secara alami untuk δέ dalam konteks kontras ini.
