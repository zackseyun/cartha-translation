id: GAL.3.18
reference: Galatians 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: id
  text: Sebab, jika warisan itu berasal dari hukum, warisan itu tidak lagi berasal dari janji. Namun, Allah telah menganugerahkannya kepada Abraham melalui janji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: warisan
  rationale: Istilah ini mempertahankan gambaran tentang sesuatu yang diterima sebagai ahli waris dan sesuai dengan argumen Paulus mengenai hukum dan janji.
- source_word: ἐκ νόμου
  choice: berasal dari hukum
  rationale: Ungkapan ini mempertahankan gagasan sumber atau dasar yang dinyatakan oleh ἐκ serta kontrasnya dengan ἐξ ἐπαγγελίας.
- source_word: ἐξ ἐπαγγελίας
  choice: berasal dari janji
  rationale: Pilihan ini mencerminkan kesejajaran dan kontras langsung dengan ἐκ νόμου tanpa menambahkan kata sandang yang tidak diperlukan dalam bahasa Indonesia.
- source_word: δι’ ἐπαγγελίας
  choice: melalui janji
  rationale: Kata 'melalui' mempertahankan fungsi perantaraan atau sarana dari διά dan membedakannya dari frasa sumber sebelumnya.
- source_word: κεχάρισται
  choice: telah menganugerahkan
  rationale: Bentuk ini mencerminkan aspek perfektum dan mempertahankan nuansa pemberian cuma-cuma atau penuh kemurahan yang terkandung dalam χαρίζομαι.
- source_word: τῷ Ἀβραὰμ
  choice: kepada Abraham
  rationale: Menunjukkan Abraham secara alami sebagai penerima tindakan Allah.
theological_decisions:
- issue: Apakah nuansa kemurahan dalam κεχάρισται dinyatakan secara eksplisit
  choice: telah menganugerahkan
  alternative: telah memberikan; telah mengaruniakan
  rationale: '''Menganugerahkan'' mempertahankan nuansa pemberian yang murah hati tanpa memperluas ayat menjadi pernyataan doktrinal tambahan.'
- issue: Apakah νόμος harus dipersempit menjadi 'hukum Taurat'
  choice: hukum
  alternative: hukum Taurat
  rationale: Konteks surat menunjuk pada hukum Taurat, tetapi bentuk Yunani di ayat ini hanya memakai νόμος. 'Hukum' mempertahankan bentuk dan sedikit keluasan ungkapan sumber tanpa menutupi kaitannya dengan konteks Musa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'warisan itu' dipertahankan demi kejelasan rujukan, sedangkan 'menganugerahkan' menyampaikan nuansa kemurahan secara alami.
