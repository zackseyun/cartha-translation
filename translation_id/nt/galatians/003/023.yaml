id: GAL.3.23
reference: Galatians 3:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: id
  text: Namun, sebelum iman itu datang[a], kita dijaga di bawah hukum Taurat[b], dikurung[c] sampai iman yang akan dinyatakan itu dinyatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebelum iman datang.” Kata sandang dalam bahasa Yunani dapat menunjuk pada masa iman yang dimulai dengan kedatangan Kristus.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “hukum Taurat” di sini secara harfiah berarti “hukum” dan menunjuk pada hukum Musa.
    reason: clarification
  - marker: c
    text: Atau, “dibatasi” atau “ditutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: sebelum ... datang
  rationale: Konstruksi infinitif berartikel dengan πρό menyatakan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang kedatangan iman.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan kontras ringan terhadap uraian sebelumnya.
- source_word: τὴν πίστιν
  choice: iman itu
  rationale: πίστις paling sesuai diterjemahkan 'iman'; kata 'itu' mencerminkan artikel Yunani dan membantu menunjukkan realitas iman dalam tahap sejarah keselamatan tanpa menentukannya secara berlebihan.
- source_word: ὑπὸ νόμον
  choice: di bawah hukum Taurat
  rationale: Ungkapan Paulus ini menunjuk pada berada di bawah wewenang atau tata hukum Musa; 'hukum Taurat' jelas bagi pembaca Indonesia.
- source_word: ἐφρουρούμεθα
  choice: kita dijaga
  rationale: Imperfek pasif menyatakan keadaan atau tindakan yang berlangsung pada masa lampau. 'Dijaga' mempertahankan kemungkinan nuansa perlindungan maupun penahanan.
- source_word: συγκλειόμενοι
  choice: dikurung
  rationale: Partisipel ini menyatakan ditutup atau dibatasi bersama-sama; 'dikurung' mempertahankan daya metaforis dan nuansa pembatasannya.
- source_word: εἰς
  choice: sampai ... tiba
  rationale: Dalam konteks ini εἰς mengarahkan masa penjagaan kepada titik ketika iman dinyatakan. Penambahan 'tiba' membuat batas waktunya jelas dan alami tanpa mengubah isi.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: iman yang akan dinyatakan itu tiba
  rationale: μέλλουσαν dan infinitif pasif ἀποκαλυφθῆναι dipertahankan sebagai 'yang akan dinyatakan'; 'tiba' melengkapi konstruksi temporal dengan 'sampai'.
theological_decisions:
- issue: Apakah πίστις berarti tindakan percaya pribadi atau realitas sejarah keselamatan yang datang bersama Kristus
  choice: iman itu
  alternative: kepercayaan; kesetiaan; tatanan iman
  rationale: Konteks Galatia 3 memberi nuansa sejarah keselamatan kepada iman, tetapi teks tidak diperluas menjadi istilah teologis yang lebih khusus. Terjemahan ini menjaga ketegangan antara iman sebagai respons dan iman sebagai realitas yang dinyatakan.
- issue: Nuansa fungsi hukum Taurat dalam ἐφρουρούμεθα dan συγκλειόμενοι
  choice: dijaga ... dikurung
  alternative: ditahan dalam penjagaan ... dibatasi
  rationale: Kedua kata dipertahankan agar nuansa penjagaan dan pembatasan sama-sama terdengar, tanpa memutuskan apakah gambaran utamanya bersifat melindungi atau menghukum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara pengulangan 'iman' dan dua gambaran pasif dipertahankan untuk mengikuti penekanan teks Yunani.
