id: GAL.3.22
reference: Galatians 3:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: id
  text: Namun, Kitab Suci telah mengurung segala sesuatu di bawah dosa[b], supaya janji itu, berdasarkan iman kepada Yesus Sang Mesias, diberikan kepada mereka yang percaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berdasarkan kesetiaan Yesus Sang Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau, “telah mengurung semuanya di bawah dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: telah mengurung
  rationale: Mengungkapkan tindakan menutup dalam keadaan terbelenggu atau tertawan, sesuai metafora Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Bentuk tunggal berartikel dipersonifikasikan sebagai saksi yang bertindak; 'Kitab Suci' adalah padanan Indonesia yang alami dan terpadu.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Mempertahankan cakupan luas bentuk jamak netral tanpa membatasinya hanya kepada manusia.
- source_word: ὑπὸ ἁμαρτίαν
  choice: di bawah dosa
  rationale: Mempertahankan metafora ketundukan Paulus tanpa menambahkan penafsiran seperti 'kuasa' atau 'kekuasaan' ke dalam teks utama.
- source_word: ἡ ἐπαγγελία
  choice: janji itu
  rationale: Menerjemahkan nomina secara langsung dan memakai 'itu' untuk mencerminkan bentuk tertentu serta kaitannya dengan janji yang sedang dibahas.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: berdasarkan iman kepada Yesus Sang Mesias
  rationale: Mengambil konstruksi genitif dalam arti objektif yang lazim, sambil mempertahankan kemungkinan arti subjektif dalam catatan kaki.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Menyatakan fungsi Χριστός sebagai gelar Yesus dengan bahasa Indonesia yang alami dan penuh hormat.
- source_word: δοθῇ
  choice: diberikan
  rationale: Bentuk pasif sesudah ἵνα dinyatakan dalam klausa tujuan 'supaya ... diberikan' tanpa perlu modal tambahan dalam bahasa Indonesia.
- source_word: τοῖς πιστεύουσιν
  choice: kepada mereka yang percaya
  rationale: Mempertahankan sifat partisip aktif dan menghindari perubahan menjadi sekadar label kelompok.
theological_decisions:
- issue: Konstruksi genitif πίστεως Ἰησοῦ Χριστοῦ
  choice: iman kepada Yesus Sang Mesias (genitif objektif)
  alternative: kesetiaan Yesus Sang Mesias (genitif subjektif)
  rationale: Frasa ini sungguh ambigu dan diperdebatkan. Teks utama memakai pembacaan objektif yang umum, sedangkan pembacaan subjektif dipertahankan secara terbuka dalam catatan kaki.
- issue: Cakupan τὰ πάντα
  choice: segala sesuatu
  alternative: semua orang / semuanya
  rationale: Bentuk jamak netral bersifat luas. Terjemahan tidak mempersempit cakupannya hanya kepada manusia, walaupun penerima janji selanjutnya disebut sebagai orang-orang yang percaya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan klausa mengikuti alur argumentasi Yunani, tetapi tanda baca dan ungkapan dibuat alami bagi pembaca Indonesia. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
