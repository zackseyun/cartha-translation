  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: id
  text: Dengan demikian, hukum Taurat telah menjadi pengawas[a] kita hingga kepada Mesias[b], supaya kita dibenarkan berdasarkan iman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengasuh.” Secara tradisional sering diterjemahkan “guru,” tetapi παιδαγωγός adalah pengawas atau penjaga rumah tangga bagi seorang anak, bukan terutama guru di ruang kelas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada” atau “ke arah Mesias.” Dalam konteks, frasa ini juga dapat dipahami secara temporal, “sampai Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Dengan demikian
  rationale: Dalam konteks ini, ὥστε menyatakan kesimpulan dari uraian sebelumnya. “Dengan demikian” terdengar alami dan mempertahankan hubungan logis tersebut.
- source_word: ὁ νόμος
  choice: hukum Taurat
  rationale: Dalam konteks Galatia, frasa ini menunjuk pada hukum Musa. “Hukum Taurat” merupakan ungkapan Indonesia yang jelas dan lazim untuk rujukan tersebut.
- source_word: παιδαγωγὸς
  choice: pengasuh
  rationale: παιδαγωγός adalah pengawas rumah tangga yang menjaga dan mendisiplinkan anak di bawah umur, bukan terutama guru kelas. “Pengasuh” mendekati fungsi itu dalam bahasa Indonesia modern, sedangkan rincian sosial-historisnya dijelaskan dalam catatan kaki.
- source_word: ἡμῶν
  choice: kita
  rationale: Kata ganti genitif ini menyatakan hubungan dengan παιδαγωγός dan secara alami diterjemahkan “kita” dalam frasa “pengasuh kita”.
- source_word: γέγονεν
  choice: telah menjadi
  rationale: Bentuk perfek Yunani menunjukkan keadaan yang dihasilkan oleh tindakan sebelumnya; “telah menjadi” mempertahankan nuansa itu.
- source_word: εἰς Χριστόν
  choice: sampai Mesias datang
  rationale: Dalam alur Galatia 3, εἰς menunjuk kepada Mesias sebagai sasaran atau batas peran sementara hukum Taurat. Ungkapan ini menyampaikan pengertian temporal secara alami, sementara kemungkinan arah atau tujuan dipertahankan dalam catatan kaki.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός dipakai sebagai gelar bagi Yang Diurapi; “Mesias” mempertahankan daya gelar tersebut dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα memperkenalkan tujuan. “Supaya” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: ἐκ πίστεως menyatakan dasar atau sarana pembenaran. “Berdasarkan iman” mempertahankan relasi itu tanpa menentukan lebih jauh objek iman yang tidak disebutkan dalam ayat ini.
- source_word: δικαιωθῶμεν
  choice: kita dibenarkan
  rationale: Bentuk aoris pasif subjungtif ini dipertahankan dengan konstruksi pasif “kita dibenarkan,” yang menjaga istilah yuridis Paulus tanpa parafrasa berlebihan.
theological_decisions:
- issue: Makna εἰς Χριστόν dalam kaitannya dengan fungsi hukum Taurat
  choice: sampai Mesias datang
  alternative: menuju Mesias; menuntun kepada Mesias
  rationale: Konteks menekankan fungsi hukum Taurat sebelum datangnya iman dalam kaitannya dengan Mesias, sehingga pembacaan temporal cocok. Namun, preposisi εἰς juga dapat menonjolkan arah atau tujuan; kemungkinan itu dicantumkan agar ketegangan makna tidak dihilangkan.
- issue: Cara menyatakan ἐκ πίστεως
  choice: berdasarkan iman
  alternative: oleh iman
  rationale: Keduanya mungkin dalam bahasa Indonesia. “Berdasarkan iman” menonjolkan dasar pembenaran dan tetap membiarkan ayat ini berdiri tanpa memasukkan keterangan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah “hukum Taurat,” “Mesias,” “iman,” dan “dibenarkan” dipertahankan karena mapan serta sesuai dengan kosakata teologis-yuridis Paulus. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
