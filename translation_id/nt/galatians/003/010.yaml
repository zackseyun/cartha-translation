  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: id
  text: Sebab semua orang yang mengandalkan perbuatan hukum Taurat berada di bawah kutuk[a], karena ada tertulis, “Terkutuklah setiap orang yang tidak tetap berpegang pada segala sesuatu yang tertulis dalam kitab hukum Taurat untuk melakukannya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berasal dari perbuatan-perbuatan hukum Taurat”; dapat juga dipahami, “hidup berdasarkan perbuatan hukum Taurat.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “tidak tetap pada segala sesuatu yang tertulis dalam kitab hukum Taurat, untuk melakukannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Sebab semua orang yang
  rationale: Mempertahankan cakupan jamak dan menyatakan fungsi penjelas γάρ secara wajar dalam bahasa Indonesia.
- source_word: ἐξ ἔργων νόμου
  choice: yang mengandalkan perbuatan hukum Taurat
  rationale: Ungkapan harfiah “berasal dari perbuatan hukum” tidak alami dan mudah disalahpahami dalam bahasa Indonesia. Pilihan ini menyampaikan orientasi atau dasar hidup kelompok tersebut, sementara bentuk harfiahnya dicatat dalam catatan kaki agar ketegangan penafsirannya tetap terbuka.
- source_word: νόμου
  choice: hukum Taurat
  rationale: Dalam konteks Paulus dan kutipan dari Ulangan, “hukum Taurat” secara alami menunjukkan hukum dalam kerangka Kitab Suci Israel, bukan hukum secara umum.
- source_word: ὑπὸ κατάραν
  choice: berada di bawah kutuk
  rationale: Mengungkapkan keadaan berada di bawah kuasa atau hukuman kutuk tanpa menambahkan bahwa yang dimaksud ialah satu kutuk tertentu.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Rumus pengutipan Kitab Suci yang baku dan bermartabat, dengan nuansa bahwa tulisan itu tetap berlaku sebagai kesaksian tertulis.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Terkutuklah setiap orang yang
  rationale: Mempertahankan daya deklaratif kutipan dan cakupan universal πᾶς.
- source_word: ἐμμένει
  choice: tetap berpegang pada
  rationale: Menyampaikan ketekunan atau kepatuhan yang berlanjut, bukan sekadar mengetahui atau menyetujui.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: segala sesuatu yang tertulis
  rationale: Mengungkapkan tuntutan yang menyeluruh dengan bahasa Indonesia yang alami.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: dalam kitab hukum Taurat
  rationale: “Kitab” sesuai dengan ragam bahasa Kitab Suci dan tidak memaksakan bentuk fisik berupa gulungan.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: untuk melakukannya
  rationale: Mempertahankan unsur infinitif yang menjelaskan bahwa berpegang pada semua yang tertulis diwujudkan dengan melakukannya.
theological_decisions:
- issue: Makna ἐξ ἔργων νόμου
  choice: Diterjemahkan “yang mengandalkan perbuatan hukum Taurat,” dengan bentuk yang lebih harfiah dicantumkan dalam catatan kaki.
  alternative: “yang berasal dari perbuatan-perbuatan hukum Taurat” atau “yang hidup berdasarkan perbuatan hukum Taurat”
  rationale: Bahasa Indonesia tidak memiliki padanan alami untuk konstruksi Yunani ἐκ yang tetap cukup jelas. Teks utama menyampaikan gagasan ketergantungan tanpa memasukkan uraian doktrinal lebih jauh, sedangkan catatan kaki menjaga akses kepada bentuk dan ambiguitas ungkapan sumber.
- issue: Cakupan kutuk
  choice: “di bawah kutuk”
  alternative: “di bawah kutuk itu”
  rationale: Bahasa Yunani tidak memakai artikel pada κατάραν. Terjemahan ini tidak secara diam-diam menyamakan kutuk tersebut dengan suatu rumusan teologis tertentu.
- issue: Sifat tuntutan hukum Taurat dalam kutipan
  choice: “tidak tetap berpegang pada segala sesuatu ... untuk melakukannya”
  alternative: “tidak terus melakukan segala sesuatu”
  rationale: Pilihan utama mempertahankan baik unsur ketekunan dalam ἐμμένει maupun tindakan nyata dalam τοῦ ποιῆσαι αὐτά, tanpa melebur keduanya menjadi satu gagasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hukum Taurat” dipakai agar νόμος tidak dipahami sebagai hukum pada umumnya. Pengulangan “Sebab” mempertahankan dua kemunculan γάρ dan alur argumentasi Paulus. Struktur kutipan dibuat cukup dekat dengan bahasa sumber, sementara catatan kaki menjelaskan bentuk yang lebih harfiah.
