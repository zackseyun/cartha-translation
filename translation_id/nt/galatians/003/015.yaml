  source_fidelity: 'Makna pokok terjaga: Paulus memakai suatu prinsip hukum manusiawi mengenai perjanjian yang telah disahkan. Namun, frasa “memakai contoh dari kehidupan manusia” menambahkan unsur “contoh” dan “kehidupan” yang tidak dinyatakan secara eksplisit dalam κατὰ ἄνθρωπον λέγω. Selain itu, ἐπιδιατάσσεται lebih khusus menunjuk penambahan ketentuan pada suatu perjanjian daripada sekadar “ditambahi.”'
  naturalness: Teks draft umumnya baku dan jelas. “Berbicara secara manusiawi” merupakan padanan yang lebih ringkas dan dekat dengan idiom Yunani. Susunan aktif “tidak seorang pun membatalkannya atau menambahkan ketentuan padanya” juga lebih langsung serta mempertahankan pelaku tak tentu dari teks sumber.
  terminology: “Saudara-saudara” layak untuk Ἀδελφοί, dengan catatan kaki yang menerangkan kemungkinan audiens campuran. “Perjanjian” tepat bagi διαθήκη dalam alur Galatia 3; alternatif “wasiat” atau “testamen” patut tetap dicatat. “Disahkan” sesuai bagi κεκυρωμένην, dan “menambahkan ketentuan” menyampaikan daya hukum ἐπιδιατάσσεται.
