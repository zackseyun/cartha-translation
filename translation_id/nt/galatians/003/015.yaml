  - severity: low
    issue: Nuansa hukum ἐπιδιατάσσεται kurang tampak
    rationale: “Ditambahi” dapat terdengar umum atau agak informal. Kata kerja Yunani mengacu pada penambahan ketentuan atau ketetapan lebih lanjut pada perjanjian; padanan eksplisit memperjelasnya.
