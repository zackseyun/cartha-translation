id: GAL.3.15
reference: Galatians 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: id
  text: 'Saudara-saudara[a], saya berbicara secara manusiawi: bahkan perjanjian yang telah disahkan oleh manusia pun tidak seorang pun membatalkannya atau menambahkan ketentuan padanya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk maskulin jamak. Paulus menyapa sesama orang percaya, kemungkinan besar termasuk perempuan.
    reason: cultural_note
  - marker: b
    text: Kata Yunani untuk “perjanjian” juga dapat berarti “wasiat” atau “testamen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan vokatif maskulin jamak ini diterjemahkan secara alami dan bermartabat dalam bahasa Indonesia; dalam pemakaian jemaat, bentuk ini dapat menyapa sesama orang percaya, termasuk perempuan, sebagaimana dijelaskan dalam catatan kaki.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: saya berbicara dengan memakai contoh dari kehidupan manusia
  rationale: Ungkapan ini memperkenalkan analogi dari kebiasaan manusia. Terjemahan tersebut menyampaikan fungsi idiomatisnya dengan jelas tanpa mengaburkan bahwa Paulus sedang memakai contoh manusiawi.
- source_word: ὅμως
  choice: bahkan ... pun
  rationale: 'Konstruksi ini secara alami menandai penegasan argumen dalam bahasa Indonesia: prinsip tersebut berlaku bahkan pada perjanjian manusia.'
- source_word: ἀνθρώπου
  choice: oleh manusia
  rationale: Genitif tunggal menunjukkan pihak manusia sebagai pembuat atau pengesah perjanjian. Bahasa Indonesia tidak wajib menandai jumlah atau gender di sini, sehingga 'manusia' tetap dekat dengan sumber tanpa menambahkan makna.
- source_word: κεκυρωμένην
  choice: yang telah disahkan
  rationale: Partisipel perfektif pasif menyatakan bahwa perjanjian itu sudah diteguhkan secara resmi dan tetap berlaku; 'telah disahkan' mempertahankan nuansa hukum tersebut.
- source_word: διαθήκην
  choice: perjanjian
  rationale: Dalam konteks Galatia 3, istilah ini terkait dengan janji Allah kepada Abraham. 'Perjanjian' menjaga kesinambungan kontekstual, sementara kemungkinan arti 'wasiat' dicatat sebagai alternatif.
- source_word: ἀθετεῖ
  choice: dibatalkan
  rationale: Kata ini menyatakan tindakan meniadakan atau membuat tidak berlaku. 'Dibatalkan' jelas, alami, dan sesuai dengan konteks hukum.
- source_word: ἐπιδιατάσσεται
  choice: ditambahi
  rationale: Kata kerja ini berarti menambahkan ketentuan lebih lanjut. 'Ditambahi' ringkas dan mempertahankan gagasan bahwa sesuatu ditambahkan kepada perjanjian yang sudah disahkan.
theological_decisions:
- issue: Apakah διαθήκη diterjemahkan sebagai 'perjanjian' atau 'wasiat/testamen'
  choice: perjanjian
  alternative: wasiat atau testamen
  rationale: Alur Galatia 3 berpusat pada janji dan perjanjian dengan Abraham, sehingga 'perjanjian' paling tepat menjaga hubungan teologis dan kontekstual. Namun, nuansa hukum berupa 'wasiat' merupakan kemungkinan leksikal yang nyata dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang jelas dan bermartabat. Bentuk pasif 'disahkan', 'dibatalkan', dan 'ditambahi' mempertahankan susunan hukum dari teks Yunani, sedangkan perluasan idiom 'memakai contoh dari kehidupan manusia' membuat maksud ungkapan sumber mudah dipahami.
