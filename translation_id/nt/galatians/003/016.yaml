id: GAL.3.16
reference: Galatians 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: id
  text: 'Janji-janji itu disampaikan kepada Abraham dan kepada keturunannya.[a] Tidak dikatakan, “Dan kepada keturunan-keturunanmu,”[b] seolah-olah yang dimaksud banyak orang, melainkan satu orang: “Dan kepada keturunanmu,” yaitu Mesias.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benihnya”; kata Yunani yang dipakai berbentuk tunggal dan dapat berfungsi sebagai nomina kolektif. Bentuk ini menjadi inti argumen Paulus dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan kepada benih-benihmu.” Paulus menyoroti bentuk jamak dalam kata-kata yang dikutip ini.
    reason: lexical_alternative
  - marker: c
    text: Atau “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: disampaikan
  rationale: Bentuk pasif dari λέγω menyatakan bahwa janji-janji itu diucapkan atau disampaikan kepada Abraham; “disampaikan” alami dalam bahasa Indonesia dan mempertahankan gagasan verbalnya.
- source_word: αἱ ἐπαγγελίαι
  choice: janji-janji
  rationale: Bentuk jamak Yunani dipertahankan dan merujuk pada janji-janji Allah.
- source_word: σπέρμα / σπέρματι
  choice: keturunan
  rationale: “Keturunan” adalah nomina kolektif yang alami dalam bahasa Indonesia dan dapat menunjuk satu ataupun banyak orang, sehingga mempertahankan permainan gramatikal yang menjadi dasar argumen Paulus.
- source_word: τοῖς σπέρμασιν
  choice: keturunan-keturunanmu
  rationale: Bentuk ulang yang tidak lazim sengaja dipakai untuk membuat bentuk jamak hipotetis Yunani terlihat; akhiran posesif “-mu” berasal dari bentuk kutipan lengkap yang sedang dibahas.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: seolah-olah yang dimaksud banyak orang / melainkan seolah-olah yang dimaksud satu orang
  rationale: Ungkapan ini menyatakan acuan yang dimaksud dan mempertahankan kesejajaran antara jamak dan tunggal secara jelas dalam bahasa Indonesia.
- source_word: Χριστός
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar dalam identifikasi keturunan yang dijanjikan; “Mesias” membuat makna gelar itu tetap nyata.
theological_decisions:
- issue: Identitas σπέρμα sebagai Χριστός
  choice: yaitu Mesias
  alternative: yang adalah Kristus
  rationale: Konstruksi ὅς ἐστιν Χριστός secara langsung mengidentifikasi keturunan tunggal itu. “Mesias” mempertahankan fungsi titular Χριστός tanpa menambahkan kata sandang yang tidak ada dalam sumber.
- issue: Argumen Paulus dari bentuk tunggal σπέρμα
  choice: mempertahankan kontras “keturunan-keturunan” dengan “keturunan” dan menjelaskan acuannya sebagai banyak orang versus satu orang
  alternative: menerjemahkan keduanya secara idiomatis tanpa menunjukkan perbedaan bentuk
  rationale: Perbedaan tunggal-jamak merupakan inti eksplisit argumen ayat ini dan tidak boleh dihaluskan, walaupun bentuk jamaknya terdengar tidak biasa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kitab Suci” ditambahkan sebagai subjek tersirat dari “tidak mengatakan” agar kalimat alami dan rujukan kutipan jelas; ini tidak dimaksudkan sebagai tambahan teologis. Bentuk “keturunan-keturunanmu” sengaja dipertahankan meskipun tidak lazim karena Paulus sendiri menyoroti bentuk jamak hipotetis.
