  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan bentuk jamak ἐπαγγελίαι, kontras sengaja antara σπέρματι (tunggal kolektif) dan τοῖς σπέρμασιν (jamak), serta identifikasi terakhir dengan Mesias. Namun, penambahan subjek eksplisit “Kitab Suci” untuk λέγει tidak dinyatakan dalam teks Yunani. Bentuk pasif Indonesia “Tidak dikatakan” menyampaikan fungsi kalimat tanpa menetapkan subjek yang tidak dieksplisitkan sumber.
  naturalness: Bahasanya umumnya alami dan bermartabat. “Keturunan-keturunanmu” memang tidak lazim, tetapi tepat dipertahankan karena bentuk jamak yang hipotetis adalah pokok argumen ayat. Kontras “yang dimaksud banyak orang ... satu orang” jelas.
  terminology: “Janji-janji,” “keturunan,” dan “Mesias” tepat untuk konteks ini. Catatan untuk bentuk jamak perlu ditambatkan langsung pada “keturunan-keturunanmu”; catatan alternatif “Kristus” perlu tetap ditambatkan pada “Mesias.”
  issues:
