    issue: “Kitab Suci” ditambahkan sebagai subjek eksplisit bagi λέγει.
    rationale: Teks Yunani hanya memakai bentuk aktif orang ketiga tunggal tanpa menyebut “Kitab Suci.” Walaupun pembacaan itu lazim secara kontekstual, terjemahan dapat menghindari penetapan subjek eksplisit dengan “Tidak dikatakan.”
  - severity: low
    issue: Tidak ada catatan kaki yang menjelaskan bentuk jamak “keturunan-keturunanmu.”
    rationale: Karena bentuk yang tidak lazim ini sengaja dipakai untuk memperlihatkan argumen Paulus, pembaca perlu diberi penjelasan langsung pada kata tersebut, setara dengan jejak audit bahasa Inggris.
