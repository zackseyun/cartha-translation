revisions:
- from: 'Janji-janji itu disampaikan kepada Abraham dan kepada keturunannya.[a] Kitab Suci tidak mengatakan, “Dan kepada keturunan-keturunanmu,” seolah-olah yang dimaksud banyak orang, melainkan seolah-olah yang dimaksud satu orang: “Dan kepada keturunanmu,” yaitu Mesias.[b]'
  to: 'Janji-janji itu disampaikan kepada Abraham dan kepada keturunannya.[a] Tidak dikatakan, “Dan kepada keturunan-keturunanmu,”[b] seolah-olah yang dimaksud banyak orang, melainkan satu orang: “Dan kepada keturunanmu,” yaitu Mesias.[c]'
  rationale: Revisi menghapus subjek “Kitab Suci” yang tidak eksplisit dalam sumber, sambil mempertahankan alur Indonesia yang wajar melalui bentuk pasif. Catatan kaki ditata ulang agar penjelasan plural yang disengaja dan alternatif untuk Χριστός masing-masing melekat pada unsur teks yang relevan.
