id: GAL.3.20
reference: Galatians 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: id
  text: Seorang perantara bukanlah perantara bagi satu pihak saja,[a] tetapi Allah itu esa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang perantara bukan dari satu.” Maksudnya mungkin “tidak bertindak bagi satu orang saja” atau “bukan bagi satu pihak saja.”'
    reason: alternative_reading
  - marker: b
    text: Pernyataan “Allah itu esa” mungkin menggemakan pengakuan iman Israel; bandingkan Ulangan 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: perantara
  rationale: Istilah ini secara alami menyatakan orang yang berada di antara pihak-pihak dan tetap mempertahankan nuansa hukum atau perjanjian.
- source_word: ἑνὸς οὐκ ἔστιν
  choice: bukanlah perantara bagi satu pihak saja
  rationale: Bahasa Yunani harfiahnya sangat ringkas, 'bukan dari satu'. Ungkapan ini memberi penjelasan minimum yang dituntut oleh makna relasional 'perantara', tanpa menentukan identitas para pihak atau menyelesaikan argumen Paulus.
- source_word: ὁ δὲ θεὸς εἷς ἐστιν
  choice: tetapi Allah itu esa
  rationale: Terjemahan langsung yang mempertahankan kontras serta pengakuan tegas akan keesaan Allah; 'esa' merupakan ungkapan Indonesia yang wajar dan bermartabat dalam konteks ini.
- source_word: δὲ
  choice: tetapi
  rationale: δέ pertama tidak perlu diberi padanan tersendiri dalam bahasa Indonesia, sedangkan δέ kedua diterjemahkan 'tetapi' untuk menyatakan kontras antarklausa.
theological_decisions:
- issue: Argumen Paulus yang padat dan sulit dalam klausa pertama
  choice: Menyatakan bahwa seorang perantara bukan bagi satu pihak saja, tanpa mengidentifikasi pihak-pihak tersebut.
  alternative: 'Terjemahan lebih harfiah: ''Seorang perantara bukan dari satu''; atau lebih interpretatif: ''Seorang perantara tidak bertindak untuk satu pihak saja.'''
  rationale: Ayat ini terkenal sulit ditafsirkan. Rumusan yang dipilih membuat relasi yang tersirat dalam kata 'perantara' dapat dipahami, tetapi tidak memasukkan penjelasan khusus tentang hukum Taurat, Musa, Kristus, atau perjanjian.
- issue: Keesaan Allah
  choice: Allah itu esa
  alternative: Allah adalah satu
  rationale: Keduanya mungkin, tetapi 'Allah itu esa' terdengar alami dalam bahasa Indonesia dan mempertahankan kemungkinan gema pengakuan monoteistis Israel tanpa menjabarkan implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa pertama dibuat cukup alami bagi pembaca umum sambil tetap menandai ambiguitas teks Yunani melalui catatan kaki; tidak ada penanda wacana pembuka yang ditambahkan.
