review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan pada ἐν σοί. Terjemahan utama “melalui engkau” memilih penafsiran instrumental, sedangkan bentuk Yunani secara langsung berbunyi “di dalam engkau” dan, dalam konteks kutipan ini, sebaiknya dipertahankan tanpa mempersempit nuansanya. “Yang telah melihat sebelumnya” dapat diperhalus menjadi “yang telah mengetahui sebelumnya” sebagai personifikasi yang lebih idiomatis dalam bahasa Indonesia, sambil tetap menyatakan pengenalan sebelumnya.
  naturalness: Struktur kalimatnya jelas dan registernya baku. “Kitab Suci, yang telah mengetahui sebelumnya ... , terlebih dahulu memberitakan ...” lebih alami daripada “yang telah melihat sebelumnya,” tanpa menghilangkan personifikasi.
  terminology: “Kitab Suci,” “Allah,” “membenarkan,” “iman,” “bangsa-bangsa,” dan “kabar baik” sudah tepat. Pengulangan “bangsa-bangsa ... semua bangsa” dipertahankan untuk mencerminkan pengulangan ἔθνη. Catatan kaki mempertahankan alternatif leksikal “orang-orang bukan Yahudi.”
  issues:
  - severity: medium
    issue: Terjemahan utama “melalui engkau” untuk ἐν σοί
    rationale: “Melalui” secara sah dapat menjadi penafsiran kontekstual, tetapi lebih instrumental daripada preposisi ἐν (“di dalam”). Karena teks sumber dan jejak audit Inggris mempertahankan “in you,” terjemahan utama Indonesia juga sebaiknya mempertahankan bentuk tersebut; penafsiran instrumental tidak perlu dijadikan pembacaan utama.
  - severity: low
    issue: “Yang telah melihat sebelumnya” kurang idiomatis dalam personifikasi Kitab Suci
    rationale: Bahasa Indonesia modern lebih lazim memakai “telah mengetahui sebelumnya” untuk gagasan προϊδοῦσα dalam subjek personifikatif. Pilihan ini tetap menyampaikan tindakan mengetahui/menyadari sebelumnya.
  revised_text: 'Kitab Suci, yang telah mengetahui sebelumnya bahwa Allah membenarkan bangsa-bangsa berdasarkan iman, terlebih dahulu memberitakan kabar baik kepada Abraham: “Di dalam engkau semua bangsa akan diberkati.”[a]'
  revised_footnotes:
