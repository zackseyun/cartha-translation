revisions:
- from: 'Kitab Suci, yang telah melihat sebelumnya bahwa Allah membenarkan bangsa-bangsa berdasarkan iman, terlebih dahulu memberitakan kabar baik kepada Abraham: “Melalui engkau semua bangsa akan diberkati.”[a]'
  to: 'Kitab Suci, yang telah mengetahui sebelumnya bahwa Allah membenarkan bangsa-bangsa berdasarkan iman, terlebih dahulu memberitakan kabar baik kepada Abraham: “Di dalam engkau semua bangsa akan diberkati.”[a]'
  rationale: Revisi mempertahankan nuansa preposisi ἐν dalam kutipan Abraham sebagai “di dalam engkau,” alih-alih menjadikannya instrumental dalam teks utama. Ungkapan bagi προϊδοῦσα juga diperhalus agar lebih alami dalam bahasa Indonesia modern. Tidak ada perubahan pada arti pembenaran, iman, pemberitaan kabar baik sebelumnya, atau hubungan leksikal antara kedua kemunculan ἔθνη.
