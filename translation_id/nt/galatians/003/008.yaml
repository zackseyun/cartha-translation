id: GAL.3.8
reference: Galatians 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: id
  text: 'Kitab Suci, yang telah mengetahui sebelumnya bahwa Allah membenarkan bangsa-bangsa berdasarkan iman, terlebih dahulu memberitakan kabar baik kepada Abraham: “Di dalam engkau semua bangsa akan diberkati.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bangsa-bangsa” juga dapat berarti “orang-orang bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: yang telah melihat sebelumnya
  rationale: Mempertahankan arti persepsi yang mendahului tindakan pemberitaan dan personifikasi Kitab Suci, dengan ungkapan Indonesia yang jelas.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam pemakaian Paulus, frasa ini menunjuk kepada Kitab Suci yang dipersonifikasikan, bukan sekadar suatu tulisan.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: Mengungkapkan dasar pembenaran secara alami dan tetap mempertahankan istilah teologis πίστις sebagai “iman”.
- source_word: δικαιοῖ
  choice: membenarkan
  rationale: Padanan ringkas dan lazim bagi δικαιόω yang mempertahankan daya forensiknya tanpa menambahkan tafsiran.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: bangsa-bangsa ... semua bangsa
  rationale: Mempertahankan pengulangan leksikal Yunani dan kaitan langsung antara pernyataan Paulus dengan janji kepada Abraham; kemungkinan arti “orang-orang bukan Yahudi” dicatat dalam catatan kaki.
- source_word: προευηγγελίσατο
  choice: terlebih dahulu memberitakan kabar baik
  rationale: Menjaga unsur εὐαγγελ- (“kabar baik”) sekaligus arti temporal awalan προ- dengan bahasa Indonesia yang mudah dipahami.
- source_word: τῷ Ἀβραὰμ
  choice: kepada Abraham
  rationale: Padanan langsung bagi objek tak langsung datif.
- source_word: Ἐνευλογηθήσονται
  choice: akan diberkati
  rationale: Merepresentasikan bentuk pasif futur secara langsung dan mempertahankan bentuk janji.
- source_word: ἐν σοὶ
  choice: melalui engkau
  rationale: Dalam kutipan janji Abraham ini, “melalui engkau” merupakan bahasa Indonesia alami yang menyampaikan fungsi perantaraan atau representatif ἐν tanpa menguraikan mekanismenya secara teologis.
theological_decisions:
- issue: Apakah ἔθνη diterjemahkan sebagai “bangsa-bangsa” atau “orang-orang bukan Yahudi”
  choice: “bangsa-bangsa” pada kedua kemunculan
  alternative: “orang-orang bukan Yahudi” pada kemunculan pertama dan “semua bangsa” dalam kutipan
  rationale: Pilihan ini mempertahankan pengulangan Yunani dan memperlihatkan hubungan antara pembenaran berdasarkan iman dan janji Abraham, sambil mencatat alternatif leksikal yang sah.
- issue: Nuansa ἐν σοὶ dalam janji kepada Abraham
  choice: “melalui engkau”
  alternative: “di dalam engkau”
  rationale: “Melalui engkau” lebih wajar dalam bahasa Indonesia dan sesuai dengan nuansa instrumental yang mungkin dalam kutipan ini, tetapi bentuk yang lebih harfiah tetap dicatat karena Yunani dapat mempertahankan nuansa representatif atau kesatuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur personifikasi Kitab Suci serta hubungan leksikal antara kedua kemunculan ἔθνη dipertahankan. Istilah “membenarkan” digunakan secara konsisten dan tidak diperluas menjadi parafrasa doktrinal.
