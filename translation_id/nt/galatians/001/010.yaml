id: GAL.1.10
reference: Galatians 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: id
  text: Sebab, apakah sekarang aku sedang berusaha meyakinkan manusia atau Allah?[a] Ataukah aku berusaha menyenangkan manusia? Sekiranya aku masih menyenangkan manusia, aku tidak akan menjadi budak Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah sekarang aku sedang mencari perkenanan manusia atau Allah?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “hamba Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: sekarang
  rationale: Menandai keadaan dan sikap Paulus saat ini, dengan kemungkinan kontras terhadap kehidupannya dahulu.
- source_word: πείθω
  choice: berusaha meyakinkan
  rationale: Mempertahankan arti dasar verba ‘meyakinkan/membujuk’ sekaligus membuat bentuk kini dan pertanyaan retorisnya alami dalam bahasa Indonesia; kemungkinan nuansa mencari perkenanan dicatat dalam catatan kaki.
- source_word: ἀνθρώπους
  choice: manusia
  rationale: Mengacu kepada manusia pada umumnya, bukan hanya laki-laki, serta mempertahankan kontras langsung dengan Allah.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku dan langsung bagi objek dalam kontras retoris ini.
- source_word: ζητῶ
  choice: aku berusaha
  rationale: Mengungkapkan tindakan yang sedang diupayakan dan menghasilkan pertanyaan yang wajar dalam bahasa Indonesia.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: menyenangkan
  rationale: Padanan langsung yang mempertahankan gagasan mencari kesenangan atau penerimaan manusia.
- source_word: εἰ ἔτι
  choice: Sekiranya ... masih
  rationale: Menyampaikan kondisi yang berlawanan dengan kenyataan serta menyiratkan pola hidup terdahulu.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός dengan maknanya, ‘Mesias’, dalam konstruksi kepemilikan.
- source_word: δοῦλος
  choice: budak
  rationale: Mempertahankan kuatnya gagasan kepemilikan dan kesetiaan penuh yang terkandung dalam δοῦλος, bukan sekadar pelayanan sukarela.
theological_decisions:
- issue: Arti πείθω dalam kontras manusia dengan Allah
  choice: berusaha meyakinkan
  alternative: mencari perkenanan
  rationale: Arti dasar ‘meyakinkan’ dipertahankan dalam teks utama meskipun ungkapan ‘meyakinkan Allah’ terasa tajam; nuansa mencari perkenanan, yang didukung oleh paralelnya dengan ‘menyenangkan manusia’, tidak dihapus tetapi disajikan sebagai alternatif.
- issue: Penerjemahan Χριστοῦ δοῦλος
  choice: budak Mesias
  alternative: hamba Mesias
  rationale: Konteks menekankan bahwa kesetiaan kepada manusia tidak sejalan dengan kepemilikan dan pengabdian penuh kepada Mesias. ‘Budak’ mempertahankan daya δοῦλος, sedangkan bentuk tradisional ‘hamba’ dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami tanpa menghilangkan kejanggalan retoris yang disengaja dalam frasa ‘meyakinkan ... Allah’. Istilah ‘budak’ dipilih untuk mempertahankan kekuatan metafora kepemilikan, dengan ‘hamba’ sebagai alternatif tradisional.
