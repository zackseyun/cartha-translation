source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: id
  text: Sebab aku tidak menerimanya dari manusia, dan aku juga tidak diajari tentangnya, melainkan melalui penyataan Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini dapat berarti “penyataan dari Yesus Sang Mesias” atau “penyataan tentang Yesus Sang Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: dari manusia
  rationale: Bentuk tunggalnya bersifat generik dan menyangkal bahwa Injil yang Paulus terima berasal dari sumber atau perantaraan manusia.
- source_word: παρέλαβον
  choice: menerimanya
  rationale: Kata ini lazim dipakai untuk menerima tradisi atau ajaran yang diteruskan; enklitik -nya merujuk pada Injil dari konteks sebelumnya.
- source_word: ἐδιδάχθην
  choice: aku juga tidak diajari tentangnya
  rationale: Bentuk pasif dipertahankan secara alami dalam bahasa Indonesia; 'tentangnya' memperjelas bahwa yang dimaksud adalah Injil tanpa menambah sumber pengajar yang tidak disebutkan.
- source_word: δι’ ἀποκαλύψεως
  choice: melalui penyataan
  rationale: διά menyatakan sarana, sedangkan 'penyataan' menyampaikan tindakan penyingkapan ilahi dalam ragam bahasa yang dignified dan mudah dipahami.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Genitif Yunani sengaja dibiarkan cukup terbuka dalam teks utama melalui konstruksi 'penyataan Yesus Sang Mesias'; 'Sang Mesias' mempertahankan Χριστός sebagai gelar.
theological_decisions:
- issue: Makna genitif dalam ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: penyataan Yesus Sang Mesias
  alternative: penyataan dari Yesus Sang Mesias; penyataan tentang Yesus Sang Mesias
  rationale: Konstruksi utama mempertahankan ambiguitas asli antara penyataan yang diberikan oleh Yesus Sang Mesias dan penyataan mengenai dirinya. Catatan kaki menyebutkan kedua kemungkinan itu tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan 'menerimanya' pada klausa terakhir dipakai agar kontras sintaksis tetap jelas dan kalimat tidak terdengar menggantung.
