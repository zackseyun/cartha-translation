id: GAL.1.8
reference: Galatians 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: id
  text: Namun, sekalipun kami atau malaikat dari surga memberitakan kepada kalian kabar baik yang bertentangan dengan apa yang telah kami beritakan kepada kalian,[a] terkutuklah dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berbeda dari apa yang telah kami beritakan kepada kalian” atau “yang melampaui apa yang telah kami beritakan kepada kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “biarlah dia menjadi anathema” atau “biarlah dia berada di bawah kutuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Namun, sekalipun
  rationale: Menangkap daya pertentangan ἀλλά, penegasan καί, dan kondisi ἐάν dalam bahasa Indonesia yang alami.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: kami atau malaikat dari surga
  rationale: Mempertahankan penyertaan diri Paulus secara tegas dan kontras dengan utusan surgawi tanpa menambah unsur yang tidak ada dalam teks.
- source_word: εὐαγγελίζηται
  choice: memberitakan ... kabar baik
  rationale: Menerjemahkan bentuk verba Yunani secara transparan dan menjaga makna pewartaan kabar baik.
- source_word: παρ’ ὃ
  choice: yang bertentangan dengan apa yang
  rationale: Dalam konteks polemis ini, παρά menunjukkan penyimpangan dari berita yang sebelumnya diberitakan; catatan kaki mempertahankan kemungkinan nuansa 'berbeda dari' atau 'melampaui'.
- source_word: εὐηγγελισάμεθα
  choice: telah kami beritakan
  rationale: Menjaga hubungan leksikal dengan εὐαγγελίζηται sambil menghasilkan kalimat Indonesia yang wajar.
- source_word: ἀνάθεμα ἔστω
  choice: terkutuklah dia
  rationale: Menyampaikan rumusan kutuk yang sungguh-sungguh dan bersifat penghakiman dalam bahasa Indonesia yang jelas serta khidmat.
theological_decisions:
- issue: Makna rumusan kutuk Paulus
  choice: terkutuklah dia
  alternative: biarlah dia menjadi anathema; biarlah dia berada di bawah kutuk
  rationale: Ungkapan ini mempertahankan bobot kutuk dan penghakiman dalam teks tanpa memasukkan pengertian teknis gerejawi dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan khidmat. Pronomina “kalian” dipakai agar bentuk jamak ὑμῖν tetap jelas; “kami” mempertahankan bentuk jamak ἡμεῖς. Susunan kalimat dibuat alami tanpa mengurangi penekanan retoris teks Yunani.
