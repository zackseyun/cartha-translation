id: GAL.1.17
reference: Galatians 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: id
  text: Aku juga tidak pergi ke Yerusalem untuk menemui mereka yang sudah menjadi rasul sebelum aku, tetapi aku pergi ke Arabia, lalu kembali lagi ke Damaskus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Aku juga tidak
  rationale: Menghubungkan penyangkalan ini dengan konteks sebelumnya secara alami dalam bahasa Indonesia; subjek 'Aku' dinyatakan agar klausa berdiri jelas.
- source_word: ἀνῆλθον εἰς Ἱεροσόλυμα
  choice: pergi ke Yerusalem
  rationale: Dalam konteks perjalanan, ἀνέρχομαι secara konvensional dapat berarti pergi naik ke Yerusalem. Bahasa Indonesia lazim memakai 'pergi ke'; unsur arah naik tidak perlu dipaksakan karena dapat terdengar seperti keterangan medan yang ditonjolkan.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: untuk menemui mereka yang sudah menjadi rasul sebelum aku
  rationale: πρός dalam konteks perjalanan kepada orang secara alami menyiratkan tujuan menemui mereka. 'Sudah menjadi rasul sebelum aku' mempertahankan urutan waktu dan menghindari kesan bahwa mereka lebih tinggi kedudukannya.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai pertentangan langsung antara tidak pergi ke Yerusalem dan justru pergi ke Arabia.
- source_word: ἀπῆλθον εἰς Ἀραβίαν
  choice: aku pergi ke Arabia
  rationale: Menyampaikan gerak keberangkatan secara wajar; 'pergi' sudah cukup alami dalam bahasa Indonesia tanpa harus menambahkan 'meninggalkan' yang objek asalnya tidak disebutkan.
- source_word: καὶ πάλιν ὑπέστρεψα
  choice: lalu kembali lagi
  rationale: '''Lalu'' menyajikan urutan perjalanan secara alami, sedangkan ''kembali lagi'' mencerminkan πάλιν dan ὑποστρέφω.'
- source_word: Ἱεροσόλυμα / Ἀραβίαν / Δαμασκόν
  choice: Yerusalem / Arabia / Damaskus
  rationale: Bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Arti 'sebelum aku' tentang para rasul
  choice: 'Urutan waktu: mereka telah menjadi rasul lebih dahulu daripada Paulus'
  alternative: Kedudukan atau wewenang mereka lebih tinggi daripada Paulus
  rationale: πρὸ ἐμοῦ paling alami menyatakan prioritas waktu. Terjemahan tidak menambahkan hierarki kewenangan yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kontras dan urutan perjalanan dalam teks Yunani tanpa menambahkan rincian mengenai wilayah Arabia atau tujuan perjalanan Paulus.
