id: GAL.1.7
reference: Galatians 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: id
  text: yang sebenarnya bukan injil lain. Hanya saja, ada beberapa orang yang meresahkan kalian dan ingin memutarbalikkan Injil Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ οὐκ ἔστιν ἄλλο
  choice: yang sebenarnya bukan injil lain
  rationale: Kata benda yang diterangkan oleh ἄλλο tidak disebutkan, tetapi konteks ayat 6 dengan jelas menunjuk kepada injil. Kata “sebenarnya” membuat penyangkalan Paulus terdengar wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: εἰ μή
  choice: Hanya saja
  rationale: Ungkapan ini memperkenalkan penjelasan atau pengecualian, bukan syarat. “Hanya saja” menyampaikan peralihan tersebut secara alami.
- source_word: ταράσσοντες
  choice: meresahkan
  rationale: Pilihan ini mencakup gagasan mengganggu dan mengguncangkan ketenangan jemaat, serta sesuai dengan nada pastoral Paulus.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina Yunani ini berbentuk jamak. “Kalian” menyatakannya dengan jelas dalam bahasa Indonesia modern.
- source_word: θέλοντες
  choice: ingin
  rationale: Menyatakan kehendak atau niat para pengacau tanpa melebih-lebihkan kadar tekad mereka.
- source_word: μεταστρέψαι
  choice: memutarbalikkan
  rationale: Kata ini menyatakan tindakan mengubah sesuatu menjadi bentuk yang menyimpang atau bertentangan. “Memutarbalikkan” kuat, alami, dan mudah dipahami.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: “Injil” merupakan istilah Indonesia yang mapan untuk kabar baik dalam konteks Paulus dan mempertahankan bobot khusus istilah tersebut.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός masih berfungsi sebagai gelar. Bentuk “Injil Mesias” juga tidak secara paksa menentukan apakah genitif itu terutama berarti Injil milik Mesias, yang berasal dari-Nya, atau yang mengenai-Nya.
theological_decisions:
- issue: Χριστοῦ sebagai gelar atau bentuk yang menyerupai nama diri
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini, gelar mesianik tetap aktif. “Mesias” mempertahankan latar pengharapan mesianik Yahudi, sedangkan “Kristus” dicantumkan sebagai padanan tradisional dalam catatan kaki.
- issue: Hubungan genitif dalam τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: Injil Mesias
  alternative: Injil tentang Mesias / Injil yang berasal dari Mesias
  rationale: Susunan ringkas ini mempertahankan kemungkinan bahwa Injil itu milik, berasal dari, atau berkenaan dengan Mesias, tanpa membatasi teks pada satu hubungan saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperlihatkan bentuk jamak ὑμᾶς; kapitalisasi “Injil Mesias” menandai pemakaian khusus dalam konteks ini.
