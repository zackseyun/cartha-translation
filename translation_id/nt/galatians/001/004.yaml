id: GAL.1.4
reference: Galatians 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: id
  text: yang telah memberikan diri-Nya untuk dosa-dosa kita, supaya Ia membebaskan kita dari zaman jahat sekarang ini[a], sesuai dengan kehendak Allah dan Bapa kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dunia jahat yang sekarang ini.”
    reason: 'Alternatif leksikal: αἰών terutama berarti “zaman”, tetapi dalam konteks ini dapat diterjemahkan lebih luas sebagai “dunia” atau tatanan dunia.'
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: telah menyerahkan diri-Nya
  rationale: Ungkapan ini menyatakan tindakan sukarela Kristus yang memberikan diri-Nya. Dalam konteks pengorbanan, 'menyerahkan diri-Nya' alami dalam bahasa Indonesia dan menangkap daya ungkap frasa Yunani tanpa menambahkan pelaku lain.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: bagi dosa-dosa kita
  rationale: '''Bagi'' mempertahankan cakupan relasional dan penebusan dari ὑπέρ tanpa mempersempitnya menjadi teori pendamaian tertentu; bentuk jamak ''dosa-dosa'' mengikuti ἁμαρτιῶν.'
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: untuk melepaskan kita
  rationale: ἐξαιρέω menunjuk pada tindakan mengeluarkan atau membebaskan dari keadaan yang menguasai atau berbahaya. 'Melepaskan' jelas dan wajar, sedangkan 'menyelamatkan' dapat mengaburkan citra keluar dari kuasa suatu zaman.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: zaman jahat yang sekarang ini
  rationale: αἰών terutama bersifat temporal-kosmis, sehingga 'zaman' lebih tepat daripada 'dunia'. Susunan Indonesia ini secara alami menghubungkan 'jahat' dengan 'zaman' dan mempertahankan arti ἐνεστῶτος sebagai yang sedang berlangsung sekarang.
- source_word: κατὰ τὸ θέλημα
  choice: sesuai dengan kehendak
  rationale: Frasa ini menyatakan keselarasan tindakan tersebut dengan maksud atau kehendak Allah; padanan ini tepat dan idiomatis.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Allah dan Bapa kita
  rationale: Konstruksi Yunani menunjuk kepada satu pribadi. 'Allah dan Bapa kita' mempertahankan kedua sebutan serta urutan sumber tanpa menyiratkan dua rujukan yang berbeda.
theological_decisions:
- issue: Apakah ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν harus diterjemahkan dengan rumusan yang menentukan mekanisme pendamaian
  choice: bagi dosa-dosa kita
  alternative: karena dosa-dosa kita; untuk menanggung dosa-dosa kita
  rationale: Teks menyatakan bahwa penyerahan diri Kristus berkaitan secara redemptif dengan dosa-dosa kita, tetapi tidak merumuskan teori pendamaian secara lengkap. 'Bagi' mempertahankan bobot teologis sekaligus tidak menambahkan mekanisme yang tidak dinyatakan.
- issue: Apakah αἰών diterjemahkan sebagai zaman atau dunia
  choice: zaman jahat yang sekarang ini
  alternative: dunia jahat yang sekarang ini
  rationale: αἰών di sini terutama menunjuk pada tatanan zaman kini dalam kerangka temporal-kosmis Paulus, bukan semata-mata dunia sebagai ruang fisik. 'Zaman' lebih dekat dengan sumber, sementara alternatif tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'diri-Nya' mempertahankan rujukan kepada Kristus dan konvensi penghormatan Indonesia. Kalimat dibiarkan sebagai klausa lanjutan sesuai struktur Galatia 1:3–5.
