id: GAL.1.11
reference: Galatians 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: id
  text: Sebab, saudara-saudara, saya ingin kalian tahu bahwa Injil yang saya beritakan bukan berasal dari manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: bukan menurut manusia; frasa ini juga dapat berarti bukan menurut ukuran manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: saya ingin kalian tahu
  rationale: Ungkapan ini secara harfiah berarti ‘saya memberitahukan kepada kalian’, tetapi di sini berfungsi sebagai pengantar penegasan penting. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan daya ungkapnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini menghubungkan ayat tersebut dengan uraian sebelumnya sebagai alasan atau penjelasan.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini wajar bagi suatu komunitas dan dapat mencakup laki-laki maupun perempuan tanpa menghapus bentuk maskulin jamak dalam bahasa Yunani melalui perincian yang tidak terdapat dalam teks.
- source_word: εὐαγγέλιον
  choice: Injil
  rationale: ‘Injil’ adalah istilah baku dan ringkas untuk kabar baik dalam pemakaian Paulus.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: yang saya beritakan
  rationale: Bentuk pasif partisipial Yunani menyatakan Injil yang telah diberitakan oleh Paulus; susunan aktif relatif ini lebih alami dalam bahasa Indonesia dan mempertahankan maknanya.
- source_word: κατὰ ἄνθρωπον
  choice: bukan berasal dari manusia
  rationale: Dalam konteks langsung, ayat berikutnya menyangkal bahwa Paulus menerima atau mempelajari Injil dari manusia. Terjemahan ini menyampaikan nuansa asal-usul yang paling kuat, sementara kemungkinan arti berdasarkan ukuran atau cara manusia dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah κατὰ ἄνθρωπον menunjuk pada asal-usul manusia atau ukuran/cara manusia
  choice: bukan berasal dari manusia
  alternative: bukan menurut manusia; bukan menurut ukuran manusia
  rationale: Galatia 1:12 segera menjelaskan bahwa Paulus tidak menerima Injil itu dari manusia dan tidak diajari oleh manusia, sehingga makna asal-usul paling sesuai dengan alur argumen. Karena frasa Yunani tetap dapat menyiratkan ukuran atau sifat manusiawi, alternatif itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘saya/kalian’ dipakai agar sapaan Paulus kepada komunitas terasa jelas dan alami; ‘Saudara-saudara’ merupakan sapaan komunal yang lazim. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
