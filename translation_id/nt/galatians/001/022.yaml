base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: id
  text: Namun, saya tidak dikenal secara pribadi[a] oleh jemaat-jemaat di Yudea yang ada di dalam Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak dikenal secara langsung” atau “tidak dikenal melalui perjumpaan pribadi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan atau kontras ringan dengan pernyataan sebelumnya; “Namun” menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: ἤμην ... ἀγνοούμενος τῷ προσώπῳ
  choice: secara pribadi saya tidak dikenal
  rationale: Gabungan partisip ἀγνοούμενος dengan datif idiomatis τῷ προσώπῳ menunjukkan bahwa Paulus belum dikenal atau dikenali secara langsung, bukan bahwa keberadaannya sama sekali tidak diketahui.
- source_word: ἐκκλησίαις
  choice: jemaat-jemaat
  rationale: Dalam konteks Paulus, kata ini menunjuk pada komunitas-komunitas orang percaya; bentuk ulang menyatakan jamak secara jelas dan alami.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Ini adalah bentuk baku bahasa Indonesia untuk nama wilayah geografis tersebut.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: ἐν mempertahankan ungkapan relasional khas Paulus, sedangkan Χριστός masih memiliki daya sebagai gelar, yaitu Yang Diurapi atau Mesias.
theological_decisions:
- issue: Makna relasional frasa ἐν Χριστῷ
  choice: di dalam Mesias
  alternative: yang menjadi milik Mesias
  rationale: Terjemahan “di dalam Mesias” mempertahankan rumusan Paulus dan tidak mempersempit hubungan yang dapat mencakup persatuan, identitas, serta keberadaan jemaat dalam relasi dengan Mesias.
- issue: Penerjemahan Χριστῷ sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap dapat didengar sebagai gelar bagi Yang Diurapi; “Mesias” mempertahankan daya gelar itu, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “secara pribadi saya tidak dikenal” dipilih agar idiom Yunani τῷ προσώπῳ dipahami secara alami tanpa menghilangkan nuansa bahwa jemaat-jemaat itu belum mengenali Paulus melalui perjumpaan langsung.
