  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: id
  text: Yang mereka dengar hanyalah, “Orang yang dahulu menganiaya kita sekarang memberitakan iman yang dahulu berusaha ia hancurkan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Injil”; secara harfiah, “iman”. Dalam konteks ini, kata tersebut kemungkinan menunjuk pada berita atau ajaran Kristen yang dahulu berusaha dihancurkan Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: hanya
  rationale: 'Menandai pembatasan: jemaat-jemaat di Yudea tidak mengenal Paulus secara langsung dan hanya mendengar laporan ini.'
- source_word: ἀκούοντες ἦσαν
  choice: terus mendengar
  rationale: Bentuk perifrastik imperfek menyiratkan bahwa laporan itu diterima secara berkelanjutan atau berulang; ungkapan ini alami dalam bahasa Indonesia.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: orang yang dahulu menganiaya kita
  rationale: Partisipel substantival diterjemahkan sebagai frasa deskriptif yang mengenali Paulus melalui kegiatannya dahulu.
- source_word: νῦν εὐαγγελίζεται
  choice: sekarang memberitakan
  rationale: Kata ini mengacu pada pemberitaan kabar baik; 'memberitakan' menjaga nuansa pewartaan tanpa perlu menambahkan objek yang tidak eksplisit.
- source_word: τὴν πίστιν
  choice: iman
  rationale: Dalam konteks ini, bentuk berartikel paling wajar menunjuk pada iman sebagai berita atau ajaran yang dipercayai, bukan terutama tindakan batin untuk percaya.
- source_word: ἣν ποτε ἐπόρθει
  choice: yang pernah berusaha dihancurkannya
  rationale: πορθέω menyatakan tindakan merusak atau membinasakan. 'Berusaha dihancurkannya' mengungkapkan maksud destruktif Paulus dahulu tanpa menyiratkan bahwa iman itu benar-benar berhasil dimusnahkan.
theological_decisions:
- issue: Makna τὴν πίστιν
  choice: '''iman'' sebagai berita atau ajaran Kristen yang kini diberitakan Paulus'
  alternative: '''iman'' sebagai tindakan percaya; atau ''Injil'' sebagai padanan kontekstual'
  rationale: Kontras antara penganiayaan dahulu dan pemberitaan sekarang mendukung arti objektif, yaitu iman sebagai isi berita yang dipercayai. Terjemahan 'iman' juga mempertahankan istilah Yunani dan membiarkan hubungan antara iman, Injil, dan komunitas orang percaya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kutipan langsung dipertahankan. Frasa 'terus mendengar' menyampaikan aspek imperfek secara alami, sedangkan 'iman' dipertahankan dalam teks utama dengan alternatif kontekstual dijelaskan dalam catatan kaki.
