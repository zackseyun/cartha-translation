id: GAL.1.9
reference: Galatians 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: id
  text: 'Seperti yang telah kami katakan sebelumnya, sekarang pun aku berkata lagi: jika ada orang yang memberitakan kepada kalian suatu injil yang bertentangan dengan apa yang telah kalian terima[a], terkutuklah dia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbeda dari apa yang telah kalian terima”; frasa Yunani ini menunjukkan penyimpangan dari pesan yang telah diterima.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “biarlah dia berada di bawah kutuk”; Yunani: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Seperti yang telah kami katakan sebelumnya
  rationale: Ungkapan ini menunjuk pada pernyataan yang sudah disampaikan, dengan dampak yang tetap berlaku. Bentuk jamak 'kami' dipertahankan sesuai teks Yunani.
- source_word: ἄρτι πάλιν λέγω
  choice: sekarang pun aku berkata lagi
  rationale: Pilihan ini mempertahankan penekanan waktu kini dari ἄρτι dan pengulangan dari πάλιν, sekaligus mencerminkan peralihan Yunani dari 'kami' ke 'aku'.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Jika ada orang yang memberitakan kepada kalian suatu injil
  rationale: Kata kerja ini berarti memberitakan kabar baik; dalam konteks polemis Galatia, 'memberitakan ... suatu injil' mempertahankan hubungan leksikal dengan injil dan kontras dengan pesan yang telah diterima.
- source_word: παρ’ ὃ
  choice: yang bertentangan dengan apa yang
  rationale: Dalam konteks ini, παρά menandai penyimpangan dari pesan yang diterima. 'Bertentangan dengan' menyampaikan daya adversatifnya, sementara alternatif 'berbeda dari' dicatat karena frasa itu juga dapat menekankan deviasi.
- source_word: παρελάβετε
  choice: telah kalian terima
  rationale: '''Terima'' tepat untuk παραλαμβάνω dalam arti menerima pesan atau tradisi; aspek lampau yang tetap relevan diungkapkan secara alami dengan ''telah''.'
- source_word: ἀνάθεμα ἔστω
  choice: terkutuklah dia
  rationale: Ungkapan ini mempertahankan bentuk seruan penghakiman yang keras dan ringkas tanpa memakai transliterasi 'anatema' yang kurang jelas bagi pembaca umum.
theological_decisions:
- issue: Daya penghukuman dalam ἀνάθεμα ἔστω
  choice: terkutuklah dia
  alternative: biarlah dia berada di bawah kutuk
  rationale: Teks utama mempertahankan kerasnya peringatan Paulus tanpa menambahkan pelaku kutuk atau rincian doktrinal yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- issue: Hubungan injil lain dengan pesan yang telah diterima dalam παρ’ ὃ
  choice: bertentangan dengan apa yang telah kalian terima
  alternative: berbeda dari apa yang telah kalian terima
  rationale: Konteks mendukung pertentangan atau penyimpangan dari injil apostolik, tetapi catatan kaki menjaga keluasan makna frasa Yunani tanpa mereduksi ketegangannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai agar bentuk jamak ὑμᾶς dan παρελάβετε terbaca jelas; 'aku' dan 'kami' dipertahankan untuk mencerminkan pergantian persona dalam teks Yunani. Susunan kalimat dibuat alami tanpa mengurangi nada peringatan yang tegas.
