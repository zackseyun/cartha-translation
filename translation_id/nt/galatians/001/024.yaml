  text: And they glorified God because of me[a].
translation:
  language: id
  text: Dan mereka memuliakan Allah karena aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “di dalam aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini melanjutkan kisah Paulus secara wajar; koordinasi sederhana mempertahankan hubungan dengan ayat sebelumnya.
- source_word: ἐδόξαζον
  choice: mereka memuliakan
  rationale: δοξάζω berarti memberi kemuliaan atau hormat. Bentuk imperfek dapat menunjukkan tindakan yang berlangsung atau berulang, tetapi dalam bahasa Indonesia nuansa itu cukup tersirat dari konteks tanpa tambahan seperti “terus”.
- source_word: ἐν ἐμοὶ
  choice: karena saya
  rationale: 'Secara harfiah frasa ini berarti “di dalam saya”, tetapi dalam konteks ini ἐν dapat dipahami secara kausal atau asosiatif: jemaat-jemaat itu memuliakan Allah karena apa yang telah terjadi pada Paulus. Alternatif yang lebih harfiah dipertahankan dalam catatan kaki.'
- source_word: τὸν θεόν
  choice: Allah
  rationale: Objek langsung dari ἐδόξαζον; “Allah” merupakan padanan baku dan tepat dalam konteks ini.
theological_decisions:
- issue: Makna ἐν ἐμοὶ
  choice: 'kausal/asosiatif: “karena saya”'
  alternative: 'lokatif atau berdimensi relasional: “di dalam saya”'
  rationale: Konteks langsung menggambarkan tanggapan jemaat-jemaat di Yudea terhadap kabar tentang perubahan hidup dan pelayanan Paulus. “Karena saya” menyampaikan bahwa mereka memuliakan Allah sebagai tanggapan atas hal itu, sedangkan kemungkinan makna harfiahnya tetap dipertahankan dalam catatan kaki agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pemakaian “saya” mengikuti suara autobiografis Paulus dan membuat hubungan kausal mudah dipahami oleh pembaca umum.
