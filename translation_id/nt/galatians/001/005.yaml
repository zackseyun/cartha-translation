  text: ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/005.yaml
  text: to whom be the glory forever and ever. Amen.
translation:
  language: id
  text: Bagi-Nyalah kemuliaan selama-lamanya. Amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Bagi Dialah
  rationale: Pronomina relatif datif ini merujuk kepada 'Allah dan Bapa kita' pada ayat sebelumnya. 'Bagi Dialah' menyampaikan arah doksologi secara alami dalam bahasa Indonesia; akhiran '-lah' menegaskan Dia sebagai penerima kemuliaan tanpa menambahkan isi doktrinal.
- source_word: δόξα
  choice: kemuliaan
  rationale: '''Kemuliaan'' merupakan padanan baku dan sesuai untuk δόξα dalam konteks doksologi, dengan tetap mempertahankan bobot teologis dan kelaziman ungkapan Alkitabiah.'
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan idiomatis Yunani ini menyatakan durasi tanpa akhir. 'Selama-lamanya' alami, jelas, dan khidmat dalam bahasa Indonesia modern.
- source_word: ἀμήν
  choice: Amin
  rationale: Istilah ini secara konvensional ditransliterasikan sebagai 'Amin' dalam penggunaan Alkitab dan ibadah berbahasa Indonesia, sebagai penegasan khidmat yang menutup doksologi.
theological_decisions:
- issue: Kopula yang tersirat dalam doksologi tanpa verba finit
  choice: Bagi Dialah kemuliaan
  alternative: Milik Dialah kemuliaan / Bagi Dia kiranya kemuliaan
  rationale: Teks Yunani tidak mengungkapkan verba finit. Rumusan 'Bagi Dialah kemuliaan' mempertahankan keringkasan dan daya doksologisnya, sekaligus tidak memutuskan secara berlebihan apakah ungkapan itu terutama pernyataan kepemilikan atau seruan pengharapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Kapitalisasi 'Dia' dipakai sebagai bentuk penghormatan yang lazim bagi rujukan kepada Allah. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang harus dijelaskan di luar teks.
