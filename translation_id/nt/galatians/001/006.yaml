  terminology: “Anugerah,” “Mesias,” dan “injil” tepat serta sesuai register. “Mesias” mempertahankan nilai gelar Χριστός. Catatan kaki a dengan tepat mencatat kemungkinan nuansa sarana bagi ἐν.
