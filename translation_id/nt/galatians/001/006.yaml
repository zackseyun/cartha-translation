  to: Aku heran bahwa kalian begitu cepat berpaling dari dia yang telah memanggil kalian dalam anugerah Mesias[a] kepada suatu injil yang berbeda[b].
  rationale: Revisi memakai satu konstruksi Indonesia, “berpaling dari ... kepada ...,” yang secara langsung mencerminkan μετατίθεσθε ἀπό ... εἰς ... tanpa menambahkan tahapan temporal. Istilah kunci dan kedua alternatif terjemahan tetap dipertahankan.
