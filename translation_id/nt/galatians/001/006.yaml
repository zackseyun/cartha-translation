id: GAL.1.6
reference: Galatians 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: id
  text: Aku heran bahwa kalian begitu cepat berpaling dari dia yang telah memanggil kalian dalam anugerah Mesias[a] kepada suatu injil yang berbeda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh anugerah Mesias.” Kata depan Yunani dapat menunjukkan lingkup atau sarana.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “kepada injil yang lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Aku heran
  rationale: Ungkapan Indonesia yang alami dan tetap menyampaikan keterkejutan serta ketidaksetujuan Paulus.
- source_word: οὕτως ταχέως
  choice: begitu cepat
  rationale: Mempertahankan penekanan pada cepatnya perubahan sikap jemaat.
- source_word: μετατίθεσθε
  choice: berbalik meninggalkan ... lalu berpaling
  rationale: Mengungkapkan gerak menjauh dari pribadi yang memanggil sekaligus menuju berita lain; bentuk kini Yunani menunjukkan proses yang sedang berlangsung.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: Dia yang telah memanggil kalian
  rationale: Mempertahankan pelaku yang tersirat tanpa menambahkan 'Allah' atau 'Kristus'; huruf kapital menandai rujukan ilahi yang wajar dalam konteks.
- source_word: ἐν χάριτι Χριστοῦ
  choice: dalam anugerah Mesias
  rationale: Menerjemahkan ἐν secara transparan sebagai lingkup, sambil membiarkan kemungkinan makna sarana dijelaskan dalam catatan kaki.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menyampaikan arti gelar Χριστός, bukan sekadar mentransliterasikannya.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: kepada suatu injil yang berbeda
  rationale: Mewakili arah εἰς dan nuansa ἕτερον sebagai sesuatu yang berbeda jenis atau sifatnya, selaras dengan kontras pada ayat berikutnya.
theological_decisions:
- issue: Identitas pihak yang memanggil
  choice: Dia yang telah memanggil kalian
  alternative: Allah yang telah memanggil kalian; Kristus yang telah memanggil kalian
  rationale: Teks Yunani tidak menyebut pelakunya secara eksplisit, sehingga terjemahan tidak menetapkan identitas yang dibiarkan tersirat.
- issue: Nuansa ἐν dalam frasa ἐν χάριτι Χριστοῦ
  choice: dalam anugerah Mesias
  alternative: oleh anugerah Mesias
  rationale: Terjemahan utama mempertahankan kemungkinan makna lingkup; catatan kaki mengakui bahwa preposisi ini juga dapat menyatakan sarana.
- issue: Status 'injil yang berbeda'
  choice: Tidak menambahkan 'yang sebenarnya bukan injil' dalam ayat ini
  alternative: Memperjelasnya berdasarkan ayat 7
  rationale: Ketegangan retoris ἕτερον εὐαγγέλιον dipertahankan pada ayat ini dan tidak diselesaikan lebih awal dengan materi dari ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Kata ganti jamak 'kalian' memperjelas bahwa sapaan ditujukan kepada jemaat-jemaat. 'Anugerah' dipilih sebagai istilah gerejawi yang tetap luas dipahami; 'Mesias' mempertahankan fungsi Χριστός sebagai gelar. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
