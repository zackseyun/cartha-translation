  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: id
  text: Apa yang kutulis kepada kalian ini—sungguh, di hadapan Allah, aku tidak berdusta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ δὲ γράφω ὑμῖν
  choice: Tentang apa yang kutulis kepada kalian ini
  rationale: Mengungkapkan objek tulisan dan peralihan ringan δέ secara alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam teks Yunani. Bentuk 'kutulis' sesuai dengan konteks surat yang sedang ditulis.
- source_word: ἰδοὺ
  choice: sungguh
  rationale: Partikel ini memberi penekanan khidmat. 'Sungguh' lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'lihatlah' dalam pernyataan semacam ini.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Mempertahankan gambaran kehadiran dan pertanggungjawaban di hadapan Allah serta daya khidmat ungkapan Yunani tanpa menjadikannya sumpah formal secara eksplisit.
- source_word: ὅτι
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Memperkenalkan isi penegasan Paulus; hubungan itu sudah jelas secara alami melalui tanda baca dan klausa berikutnya.
- source_word: οὐ ψεύδομαι
  choice: aku tidak berdusta
  rationale: Penyangkalan langsung dalam ragam bahasa yang wajar dan bermartabat; bentuk kini Yunani menyatakan bahwa pernyataan Paulus bukan dusta.
theological_decisions:
- issue: Daya seruan Paulus kepada Allah
  choice: Diterjemahkan sebagai penegasan khidmat tentang kebenaran perkataannya di hadapan Allah.
  alternative: Memahaminya hanya sebagai penekanan umum, atau memperluasnya menjadi rumusan sumpah formal.
  rationale: ἐνώπιον τοῦ θεοῦ menunjukkan kesadaran akan kehadiran dan penghakiman Allah serta menguatkan pengakuan Paulus, tetapi teks tidak secara eksplisit memakai kata kerja bersumpah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pronomina 'aku/kalian' mengikuti suara pribadi Paulus dan penerima jamak. Susunan awal memakai 'Tentang ... ini' agar cakupan relatif netral jamak ἃ dan kaitannya dengan tulisan Paulus terdengar alami.
