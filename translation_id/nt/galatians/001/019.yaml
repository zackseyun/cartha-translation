id: GAL.1.19
reference: Galatians 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: id
  text: Namun, aku tidak melihat seorang pun dari rasul-rasul lain kecuali Yakobus[a], saudara Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tidak melihat rasul lain mana pun—hanya Yakobus, saudara Tuhan.” Sebagian orang memahami susunan ini tidak menggolongkan Yakobus sebagai rasul.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: seorang pun ... lain
  rationale: Dalam konstruksi partitif dengan τῶν ἀποστόλων, kata ini menunjuk kepada seorang lain dari kalangan para rasul. Bentuk Indonesia ini wajar dalam kalimat negatif.
- source_word: δέ
  choice: Namun
  rationale: Menandai kontras ringan dengan pernyataan sebelumnya tanpa memberi pertentangan yang terlalu tajam.
- source_word: ἀποστόλων
  choice: rasul-rasul
  rationale: Istilah baku dan jelas untuk lingkaran kerasulan yang dimaksud dalam konteks Paulus.
- source_word: οὐκ εἶδον
  choice: aku tidak melihat seorang pun
  rationale: Mempertahankan negasi dan bentuk lampau dalam bahasa Yunani; bahasa Indonesia tidak menandai kala pada verba, sedangkan konteks naratif menunjukkan waktu lampau.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Di sini berfungsi sebagai ungkapan pengecualian, bukan syarat.
- source_word: Ἰάκωβον
  choice: Yakobus
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἀδελφὸν
  choice: saudara
  rationale: Padanan langsung yang mempertahankan hubungan kekeluargaan tanpa mempersempit jenis kelamin melalui istilah 'saudara laki-laki', yang kurang alami sebagai sebutan dalam kalimat ini.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: κύριος dipertahankan sebagai gelar 'Tuhan'; frasa 'saudara Tuhan' alami dan dekat dengan struktur sumber.
theological_decisions:
- issue: Apakah Yakobus termasuk dalam kelompok 'rasul-rasul' pada konstruksi ini
  choice: 'Teks utama mengikuti sintaksis yang paling alami: Yakobus merupakan pengecualian terhadap pernyataan bahwa Paulus tidak melihat rasul lain, sehingga ia tampak termasuk dalam sebutan itu.'
  alternative: Kalimat dapat dipahami bahwa Paulus tidak melihat rasul lain selain Petrus, tetapi juga melihat Yakobus tanpa bermaksud menggolongkan Yakobus sebagai rasul.
  rationale: εἰ μὴ paling wajar memperkenalkan pengecualian terhadap 'seorang pun dari rasul-rasul lain'. Catatan kaki mempertahankan kemungkinan pemahaman alternatif tanpa menyelesaikan ketegangan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina 'aku' dipakai agar selaras dengan suara pribadi Paulus; istilah gerejawi yang mapan dipertahankan tanpa menambahkan tafsiran denominasi.
