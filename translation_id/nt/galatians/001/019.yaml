  source_fidelity: 'Teks Indonesia secara akurat menerjemahkan struktur Yunani: Paulus tidak melihat seorang pun dari rasul-rasul lain, dengan Yakobus sebagai pengecualian melalui “kecuali.” “Namun” mencerminkan δέ dengan wajar, dan “saudara Tuhan” mempertahankan ἀδελφὸν τοῦ κυρίου tanpa penambahan tafsiran.'
