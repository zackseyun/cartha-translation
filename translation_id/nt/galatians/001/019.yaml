  terminology: “Rasul,” “Yakobus,” dan “Tuhan” memakai istilah serta nama yang lazim dan tepat. Kata “saudara” menerjemahkan ἀδελφός secara langsung tanpa memaksakan penjelasan hubungan yang tidak dinyatakan oleh teks.
