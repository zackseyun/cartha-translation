  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: id
  text: Sebab kalian telah mendengar tentang cara hidup saya dahulu dalam agama Yahudi, bahwa saya menganiaya jemaat Allah secara luar biasa dan menghancurkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merusaknya dengan hebat” atau “membinasakannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: cara hidup saya dahulu
  rationale: ἀναστροφή menunjuk pada perilaku atau pola hidup secara luas, sedangkan ποτε menandai masa lampau Paulus. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan serta kontras waktunya.
- source_word: Ἰουδαϊσμῷ
  choice: dalam agama Yahudi
  rationale: Istilah ini menunjuk pada kehidupan dan praktik Paulus dalam Yudaisme. “Agama Yahudi” lebih mudah dipahami pembaca umum Indonesia daripada transliterasi “Yudaisme” tanpa mempersempitnya menjadi sekadar etnisitas.
- source_word: καθ’ ὑπερβολὴν
  choice: dengan sangat kejam
  rationale: Frasa ini menguatkan intensitas penganiayaan Paulus secara luar biasa. Dalam kaitannya dengan kata kerja “menganiaya”, ungkapan ini menyampaikan kadar tindakan secara alami dan kuat.
- source_word: ἐδίωκον
  choice: saya menganiaya
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang pada masa lampau. Dalam bahasa Indonesia, aspek tersebut dapat dipahami dari konteks “dahulu” dan hubungan dengan tindakan berikutnya.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: jemaat Allah
  rationale: “Jemaat” secara alami menunjuk pada komunitas orang percaya yang menjadi sasaran Paulus dan tidak mengesankan sebuah gedung.
- source_word: ἐπόρθουν
  choice: berusaha membinasakannya
  rationale: Kata kerja ini menyatakan tindakan menghancurkan atau membinasakan. Bentuk imperfek dan konteks historis mendukung nuansa usaha yang sedang dijalankan, tanpa menyatakan bahwa pemusnahan itu berhasil.
theological_decisions:
- issue: ἐκκλησία sebagai jemaat atau gereja
  choice: jemaat Allah
  alternative: gereja Allah
  rationale: Yang dimaksud ialah komunitas milik Allah yang dianiaya Paulus. “Jemaat” menyampaikan referen komunal dengan jelas dan menghindari kemungkinan dipahami sebagai bangunan atau lembaga.
- issue: Apakah ἐπόρθουν menyatakan penghancuran yang berhasil atau upaya menghancurkan
  choice: berusaha membinasakannya
  alternative: membinasakannya
  rationale: Pilihan ini mempertahankan daya rusak kata kerja sambil tidak menyiratkan bahwa Paulus benar-benar berhasil memusnahkan jemaat. Karena verba Yunani sendiri dapat diterjemahkan lebih langsung, alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kalian” dipakai karena bentuk Yunani ἠκούσατε adalah orang kedua jamak. Tanda titik dua memperjelas bahwa klausa berikutnya menerangkan cara hidup Paulus dahulu.
