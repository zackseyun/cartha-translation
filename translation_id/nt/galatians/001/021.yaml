  text: ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: id
  text: Sesudah itu, aku pergi ke daerah-daerah Siria dan Kilikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menuju daerah-daerah Siria dan Kilikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Sesudah itu
  rationale: Menandai urutan waktu dalam kisah Paulus secara alami dan jelas.
- source_word: ἦλθον
  choice: aku pergi
  rationale: Walaupun bentuk dasarnya dapat berarti “datang”, sudut pandang naratif dan tujuan perjalanan lebih alami diungkapkan dengan “pergi” dalam bahasa Indonesia.
- source_word: εἰς
  choice: ke
  rationale: Menyatakan arah menuju suatu wilayah; “ke” merupakan padanan Indonesia yang alami tanpa memaksakan nuansa memasuki batas wilayah.
- source_word: κλίματα
  choice: daerah-daerah
  rationale: Bentuk jamak ini menunjuk pada kawasan atau bagian geografis; “daerah-daerah” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: Συρίας
  choice: Siria
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: Κιλικίας
  choice: Kilikia
  rationale: Transliterasi yang lazim digunakan dalam tradisi teks Alkitab bahasa Indonesia.
