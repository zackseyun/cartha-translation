source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: id
  text: Kemudian, setelah tiga tahun, saya naik ke Yerusalem untuk mengunjungi Kefas[a][b], dan saya tinggal bersamanya selama lima belas hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk berkenalan dengan Kefas”; kata kerja Yunani ini juga dapat mengandung arti mengenal seseorang melalui pertemuan langsung.
    reason: lexical_alternative
  - marker: b
    text: Kefas adalah nama Petrus dalam bahasa Aram.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔπειτα
  choice: Kemudian
  rationale: Menandai peristiwa berikutnya dalam urutan kisah Paulus secara alami.
- source_word: μετὰ ἔτη τρία
  choice: setelah tiga tahun
  rationale: Menerjemahkan ungkapan waktu Yunani secara langsung tanpa menentukan dari titik mana tiga tahun itu dihitung.
- source_word: ἀνῆλθον
  choice: saya pergi
  rationale: Dalam bahasa Yunani verba ini secara harfiah berarti pergi naik, tetapi dalam bahasa Indonesia 'pergi ke Yerusalem' lebih alami; nuansa naik tidak diperlukan untuk menyampaikan gerak perjalanan.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: ἱστορῆσαι
  choice: untuk berkenalan dengan
  rationale: Verba langka ini dapat menunjuk pada kunjungan pribadi untuk menemui dan mengenal seseorang; 'berkenalan dengan' mempertahankan nuansa perjumpaan untuk mengenal, sementara alternatif 'mengunjungi' dicatat.
- source_word: Κηφᾶν
  choice: Kefas
  rationale: Mempertahankan nama Aram yang secara khusus dipakai Paulus, dalam ejaan Indonesia, tanpa menggantinya dengan Petrus.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: saya tinggal bersamanya
  rationale: Mengungkapkan bahwa Paulus tetap berada bersama Kefas selama jangka waktu yang disebutkan.
- source_word: ἡμέρας δεκαπέντε
  choice: selama lima belas hari
  rationale: Kata 'selama' membuat fungsi akusatif durasi jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas Κηφᾶς
  choice: Nama 'Kefas' dipertahankan dalam teks dan hubungannya dengan Petrus dijelaskan dalam catatan kaki.
  alternative: Mengganti nama itu langsung dengan 'Petrus'.
  rationale: Teks Yunani memakai Κηφᾶς; mempertahankannya menghindari harmonisasi diam-diam sekaligus membantu pembaca melalui catatan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan wajar. Kata ganti orang pertama ''saya'' dipakai untuk suara autobiografis Paulus. Urutan penanda catatan [a][b] mengikuti kemunculan penjelasan: pertama nuansa verba, lalu identitas nama.'
