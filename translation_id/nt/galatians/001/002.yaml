lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini melanjutkan penyebutan para pengirim dari ayat sebelumnya; huruf kecil mempertahankan kesinambungan kalimat.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: semua saudara seiman yang bersama saya
  rationale: ἀδελφοί berbentuk maskulin jamak, tetapi dalam konteks Paulus lazim menunjuk sesama orang percaya dan dapat mencakup laki-laki maupun perempuan. 'Saudara seiman' alami dalam bahasa Indonesia dan makna inklusif yang mungkin dijelaskan dalam catatan kaki.
- source_word: ἐκκλησίαις
  choice: jemaat-jemaat
  rationale: Bentuk jamak menunjuk komunitas-komunitas orang percaya; 'jemaat' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: τῆς Γαλατίας
  choice: di Galatia
  rationale: Walaupun bentuk Yunaninya genitif, dalam bahasa Indonesia hubungan lokasi ini paling alami dinyatakan dengan 'di Galatia'.
theological_decisions:
- issue: Cakupan ἀδελφοί
  choice: saudara seiman
  alternative: saudara-saudara laki-laki
  rationale: Kata Yunani secara gramatikal berbentuk maskulin, tetapi dapat dipakai secara kolektif bagi sesama orang percaya dari kedua jenis kelamin. Terjemahan utama tidak membatasi acuannya hanya pada laki-laki, sementara bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'jemaat-jemaat' mempertahankan jamak Yunani, sedangkan 'yang bersama saya' menyatakan hubungan οἱ σὺν ἐμοὶ secara eksplisit dan alami.
