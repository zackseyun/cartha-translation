  footnotes:
  - marker: a
    text: Atau “semua saudara laki-laki yang bersama saya.” Kata Yunaninya berbentuk maskulin jamak, tetapi dalam konteks ini dapat mencakup sesama orang percaya, baik laki-laki maupun perempuan.
