id: GAL.1.14
reference: Galatians 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: id
  text: Aku semakin maju dalam agama Yahudi, melampaui banyak orang sebaya di antara bangsaku,[a] dan aku jauh lebih bersemangat terhadap tradisi-tradisi nenek moyangku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara kaumku” atau “di antara umat sebangsaku.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “tradisi-tradisi para leluhurku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: Aku maju
  rationale: Bentuk imperfek menyatakan kemajuan yang berlangsung pada masa lampau; dalam konteks narasi lampau bahasa Indonesia, aspek itu cukup dibawa oleh konteks tanpa menambahkan kata bantu yang kaku.
- source_word: Ἰουδαϊσμῷ
  choice: dalam agama Yahudi
  rationale: Mengacu pada Yudaisme sebagai sistem keagamaan dan cara hidup; ungkapan ini lebih mudah dipahami pembaca umum Indonesia daripada istilah serapan “Yudaisme”, tanpa mempersempitnya menjadi ajaran saja.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: melampaui banyak orang sebaya
  rationale: ὑπέρ menyatakan perbandingan, sedangkan συνηλικιώτας menunjuk kepada orang-orang yang seusia.
- source_word: ἐν τῷ γένει μου
  choice: di antara bangsaku
  rationale: γένος di sini menunjuk pada kelompok etnis atau bangsa Paulus. “Bangsaku” mempertahankan rujukan kolektif tanpa memakai istilah “ras” yang mudah disalahpahami.
- source_word: περισσοτέρως
  choice: jauh lebih
  rationale: Mempertahankan daya penguat komparatif dari kata Yunani tersebut dalam bentuk Indonesia yang alami.
- source_word: ζηλωτὴς ὑπάρχων
  choice: sebab aku ... giat membela
  rationale: Ungkapan ini menyampaikan semangat dan keterikatan kuat terhadap sesuatu. “Giat membela” terdengar alami dalam konteks tradisi dan menghindari konotasi politis modern dari “seorang fanatik” atau “zelot”.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: tradisi-tradisi warisan nenek moyangku
  rationale: πατρικός menunjuk pada apa yang berasal dari para leluhur. Pilihan ini mempertahankan unsur tradisi turun-temurun dan pronomina orang pertama tanpa membatasi rujukannya hanya pada ayah kandung.
theological_decisions:
- issue: Cakupan Ἰουδαϊσμός
  choice: agama Yahudi
  alternative: Yudaisme; cara hidup orang Yahudi
  rationale: Teks dapat mencakup sistem agama sekaligus pola hidup Yahudi. Teks utama memakai ungkapan umum yang jelas, sementara catatan mempertahankan cakupan yang lebih luas sebagai kemungkinan.
- issue: Arti ζηλωτής terhadap tradisi leluhur
  choice: giat membela
  alternative: sangat bersemangat untuk; sangat tekun menaati
  rationale: Pilihan ini tidak mengubah semangat Paulus menjadi sekadar ketaatan ritual dan tidak pula memberinya makna teknis sebagai anggota suatu gerakan politik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada autobiografis yang lugas dan bermartabat. Istilah teknis “Yudaisme” dihindari dalam teks utama demi keterpahaman umum. Penanda catatan [a] dan [b] ditempatkan tepat setelah frasa yang diterangkan.
