  naturalness: Teks revisi tetap memakai bahasa Indonesia baku modern dan alurnya lebih langsung. “Jauh lebih bersemangat terhadap” adalah ungkapan yang wajar tanpa menambahkan tindakan tertentu terhadap tradisi itu.
  terminology: “Agama Yahudi” dapat dipertahankan sebagai padanan komunikatif untuk Ἰουδαϊσμός. “Tradisi-tradisi nenek moyangku” menyampaikan πατρικαί παραδόσεις tanpa membatasi rujukannya kepada ayah biologis dan tanpa redundansi “tradisi-tradisi warisan”.
