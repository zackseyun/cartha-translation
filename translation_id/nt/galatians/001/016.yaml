  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: id
  text: untuk menyatakan Anak-Nya di dalam diriku[a], supaya aku memberitakan Dia di antara bangsa-bangsa bukan Yahudi; aku tidak segera berunding dengan manusia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepadaku” atau “melalui diriku.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “daging dan darah,” sebuah ungkapan yang berarti manusia.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: menyatakan
  rationale: Kata ini mempertahankan gagasan penyingkapan ilahi dan merupakan padanan Indonesia yang jelas serta wajar dalam konteks ini.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Anak-Nya
  rationale: Padanan alami bagi gelar relasional tersebut; huruf kapital menandai gelar yang merujuk kepada Kristus tanpa menambahkan penafsiran.
- source_word: ἐν ἐμοὶ
  choice: di dalam diriku
  rationale: Mempertahankan arti dasar preposisi ἐν dan ambiguitas antara penyingkapan batiniah, penyingkapan kepada Paulus, dan penyingkapan melalui dirinya.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: supaya aku memberitakan Dia
  rationale: Mempertahankan Sang Anak sebagai objek langsung pemberitaan, alih-alih memperluasnya secara interpretatif menjadi berita tentang Dia.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Paulus, frasa ini menunjuk kepada berbagai bangsa di luar umat Yahudi. Bentuk ini lebih mudah dipahami pembaca Indonesia masa kini daripada istilah serapan yang kurang umum.
- source_word: εὐθέως
  choice: langsung
  rationale: Padanan Indonesia modern dan alami yang menyampaikan arti 'segera' dalam kaitannya dengan tindakan berikutnya.
- source_word: οὐ προσανεθέμην
  choice: Aku tidak ... meminta pertimbangan
  rationale: Bentuk medial ini bermakna berkonsultasi atau meminta pertimbangan dari pihak lain; ungkapan ini alami dengan objek manusia.
- source_word: σαρκὶ καὶ αἵματι
  choice: dari manusia
  rationale: Ungkapan harfiah 'daging dan darah' merupakan idiom bagi manusia. Maknanya disampaikan dalam teks utama, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna ἐν ἐμοὶ dalam penyingkapan Sang Anak
  choice: Mempertahankan ungkapan formal dan ambigu 'di dalam diriku' dalam teks utama
  alternative: '''kepadaku'' atau ''melalui diriku'''
  rationale: Bahasa Yunani dapat menunjuk pada penyingkapan batiniah, penyingkapan kepada Paulus, atau penyingkapan melalui Paulus. Catatan kaki menjaga berbagai kemungkinan itu tanpa memilih satu penafsiran teologis.
- issue: Rujukan ἐν τοῖς ἔθνεσιν
  choice: '''di antara bangsa-bangsa bukan Yahudi'''
  alternative: '''di antara bangsa-bangsa'''
  rationale: Konteks surat Paulus mendukung pengertian kelompok-kelompok non-Yahudi, tetapi terjemahan tetap memakai bentuk deskriptif dan tidak memasukkan gagasan tambahan mengenai status mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Di dalam diriku' sengaja dipertahankan untuk menjaga ambiguitas sumber; idiom 'daging dan darah' diterjemahkan menurut maknanya agar mudah dipahami, dengan bentuk harfiah dicatat. Tanda titik dipakai untuk menghindari rangkaian klausa yang terasa berat dalam bahasa Indonesia, sementara koma akhir menunjukkan bahwa ayat berlanjut.
