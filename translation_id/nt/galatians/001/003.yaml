id: GAL.1.3
reference: Galatians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: id
  text: Kasih karunia dan damai sejahtera bagi kalian dari Allah, Bapa kita, dan dari Tuhan kita Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.”'
    reason: Mencatat padanan tradisional untuk Χριστός sebagai alternatif terjemahan.
lexical_decisions:
- source_word: χάρις
  choice: kasih karunia
  rationale: Istilah baku dan wajar dalam bahasa Indonesia yang mempertahankan bentuk salam sekaligus bobot teologis istilah Paulus.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Menunjukkan bahwa sapaan ditujukan kepada penerima jamak; “kalian” jelas dan alami dalam bahasa Indonesia modern.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang lazim untuk cakupan εἰρήνη, termasuk kedamaian dan kesejahteraan yang berakar pada latar salam Yahudi.
- source_word: ἀπὸ
  choice: dari
  rationale: Menandai sumber berkat secara langsung dan alami.
- source_word: θεοῦ πατρὸς
  choice: Allah, Bapa kita
  rationale: Koma memperjelas bahwa “Bapa kita” menerangkan Allah, sementara “kita” secara wajar dikaitkan dengan πατρός.
- source_word: κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Mempertahankan gelar kristologis κύριος dan hubungan yang dinyatakan oleh ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar; “Sang Mesias” menerjemahkan maknanya secara idiomatis dan membedakannya dari nama diri biasa.
theological_decisions:
- issue: Apakah Χριστοῦ diterjemahkan sebagai gelar atau dipertahankan dalam bentuk tradisional “Kristus”
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Dalam salam ini Χριστός tetap membawa daya sebagai gelar bagi pribadi yang diurapi. Bentuk tradisional dicatat sebagai alternatif tanpa menghapus makna gelarnya.
translation_notes:
  register: Bahasa Indonesia baku, hangat, dan bermartabat. Pengulangan “dari” sebelum “Tuhan kita” dipakai demi kejelasan dan kelancaran, meskipun bahasa Yunani hanya menyatakan preposisi itu sekali. “Kalian” mempertahankan bentuk jamak ὑμῖν.
