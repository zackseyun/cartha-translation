id: GAL.1.1
reference: Galatians 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: id
  text: Paulus, seorang rasul—bukan dari manusia maupun melalui seorang manusia, melainkan melalui Yesus Sang Mesias[a] dan Allah Bapa, yang membangkitkan Dia dari antara orang mati—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: rasul
  rationale: Istilah “rasul” merupakan sebutan baku bagi seorang utusan yang menerima amanat khusus dan mempertahankan bobot jabatan dalam pengenalan diri Paulus.
- source_word: ἀπ’ ἀνθρώπων
  choice: dari manusia
  rationale: ἀπό dengan genitif menyatakan sumber atau asal. Bentuk kolektif “manusia” terdengar alami dalam bahasa Indonesia dan tetap dikontraskan dengan frasa tunggal sesudahnya.
- source_word: δι’ ἀνθρώπου
  choice: melalui seorang manusia
  rationale: διά dengan genitif menyatakan perantaraan atau pelaku. Kata “seorang” mempertahankan bentuk tunggal yang penting bagi susunan retoris ayat ini.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: Pengulangan “melalui” mempertahankan kesejajaran dengan perantaraan manusia yang disangkal. “Sang Mesias” menyampaikan Χριστός sebagai gelar dengan bahasa Indonesia yang wajar dan penuh hormat.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: “Allah Bapa” adalah bentuk gelar yang baku, ringkas, dan alami dalam bahasa Indonesia serta mempertahankan koordinasinya dengan Yesus Sang Mesias.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: yang membangkitkan Dia dari antara orang mati
  rationale: Klausa ini menerangkan Allah Bapa. “Dari antara orang mati” menyampaikan ἐκ νεκρῶν secara idiomatis sambil mempertahankan pernyataan tentang kebangkitan Yesus.
theological_decisions:
- issue: Pemaknaan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam salam ini Χριστός tetap dapat didengar sebagai gelar, bukan semata-mata bagian nama. “Sang Mesias” mempertahankan daya gelarnya; alternatif tradisional dicatat agar ambiguitas pemakaian nama-gelar tidak dihapus.
- issue: Sumber dan perantaraan kerasulan Paulus
  choice: Mempertahankan perbedaan “dari manusia” dan “melalui seorang manusia”
  alternative: Menyatukannya menjadi penyangkalan umum bahwa pengangkatannya bukan secara manusiawi
  rationale: Teks Yunani membedakan asal dengan ἀπό dan perantaraan dengan διά. Terjemahan tidak menyederhanakan ketegangan retoris itu atau menambahkan kata “diangkat” yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Tanda pisah mempertahankan sisipan penegasan Paulus; ayat dibiarkan berakhir dengan tanda pisah karena kalimat berlanjut ke ayat berikutnya. Huruf kapital pada “Dia” digunakan untuk memperjelas bahwa pronomina itu merujuk kepada Yesus.
