base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: id
  text: Tetapi ketika Dia yang telah mengkhususkan aku sejak dalam kandungan ibuku[a] dan memanggil aku melalui anugerah-Nya berkenan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejak lahir”; bandingkan bahasa panggilan kenabian dalam Yeremia 1:5 dan Yesaya 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: Mempertahankan nilai temporal ὅτε dan peralihan yang agak kontras dari δέ, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: εὐδόκησεν
  choice: berkenan
  rationale: Menyampaikan kesukaan atau kehendak baik ilahi tanpa mereduksinya menjadi sekadar keputusan.
- source_word: ὁ ἀφορίσας με
  choice: Dia yang telah memisahkan aku
  rationale: Mempertahankan bentuk partisip substantival serta gagasan bahwa Allah mengkhususkan Paulus, tanpa memasukkan istilah doktrinal yang lebih sempit seperti 'memilih' atau 'menetapkan'.
- source_word: ἐκ κοιλίας μητρός μου
  choice: sejak dalam kandungan ibuku
  rationale: Mempertahankan gambaran konkret kandungan ibu dan idiom panggilan kenabian; 'sejak' menyatakan titik awal secara alami.
- source_word: καλέσας
  choice: memanggil
  rationale: Padanan baku yang mempertahankan keluasan makna panggilan ilahi, baik panggilan kepada tugas maupun dimensi keselamatannya.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: melalui anugerah-Nya
  rationale: Mencerminkan διά dengan genitif dengan menampilkan anugerah sebagai sarana panggilan dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἀφορίσας harus diterjemahkan dengan istilah yang menyiratkan doktrin predestinasi atau pemilihan tertentu
  choice: memisahkan aku
  alternative: memilih aku; menetapkan aku; mengkhususkan aku
  rationale: Kata Yunani menyatakan tindakan memisahkan atau mengkhususkan, kemungkinan dengan latar bahasa panggilan kenabian, tetapi tidak menuntut perumusan doktrinal yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai anak kalimat yang berlanjut ke ayat berikutnya; koma akhir menandai bahwa kalimat belum selesai.
