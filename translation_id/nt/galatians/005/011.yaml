id: GAL.5.11
reference: Galatians 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: id
  text: Namun, Saudara-saudara[a], jika saya masih memberitakan sunat, mengapa saya masih dianiaya? Kalau demikian, batu sandungan dari salib[b] telah ditiadakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk maskulin dan dapat digunakan untuk menyapa kelompok yang mencakup laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hal yang menimbulkan penolakan karena salib.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak yang wajar dan bermartabat dalam bahasa Indonesia; dalam konteks jemaat dapat mencakup laki-laki dan perempuan tanpa menghapus bentuk sapaan sumber.
- source_word: περιτομήν
  choice: sunat
  rationale: Padanan Indonesia yang langsung dan lazim untuk περιτομή; konteks Galatia memberi makna praktik itu sebagai tuntutan identitas Taurat.
- source_word: ἔτι
  choice: masih
  rationale: Mempertahankan daya temporal pada kedua kemunculannya dan memperjelas logika pertanyaan Paulus.
- source_word: κηρύσσω
  choice: memberitakan
  rationale: Menyampaikan tindakan pengumuman secara terbuka dalam bentuk kini tanpa membatasi maknanya pada khotbah formal.
- source_word: διώκομαι
  choice: dianiaya
  rationale: Padanan alami bagi bentuk pasif yang menunjuk pada penganiayaan karena pemberitaan Paulus.
- source_word: ἄρα
  choice: Kalau demikian
  rationale: Menyatakan kesimpulan logis dari pengandaian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: κατήργηται
  choice: telah ditiadakan
  rationale: 'Menjaga aspek perfektif dan keadaan hasil dari bentuk perfek pasif: daya batu sandungan itu, menurut pengandaian tersebut, sudah dibuat tidak berlaku.'
- source_word: σκάνδαλον
  choice: batu sandungan
  rationale: Mempertahankan metafora sumber tentang sesuatu yang menyebabkan orang tersandung atau menolak; 'hal yang menyinggung' tetap merupakan kemungkinan kontekstual.
- source_word: σταυροῦ
  choice: salib
  rationale: Padanan baku dan langsung dalam pemakaian teologis Paulus.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Indonesia ini lazim sebagai sapaan kolektif dan dapat mencakup seluruh jemaat; catatan menjelaskan cakupan campuran agar pembaca tidak memahaminya sebagai laki-laki saja.
- issue: Makna σκάνδαλον τοῦ σταυροῦ
  choice: batu sandungan salib
  alternative: hal yang menyinggung dari salib
  rationale: Metafora 'batu sandungan' paling dekat dengan σκάνδαλον dan mempertahankan ketegangan bahwa salib menimbulkan penolakan; catatan memberi padanan kontekstual lain.
- issue: Daya καταργέω dalam pengandaian Paulus
  choice: telah ditiadakan
  alternative: telah dibuat tidak berdaya
  rationale: Terjemahan utama menjaga bentuk perfek pasif dan kesimpulan retoris tanpa menyatakan bahwa salib itu sendiri ditiadakan; yang ditiadakan ialah batu sandungannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada surat apostolik. Kata ganti 'saya' dipilih agar alami dan tetap bermartabat; 'namun' menandai δέ, sedangkan susunan retoris dan dua kali 'masih' dipertahankan.
