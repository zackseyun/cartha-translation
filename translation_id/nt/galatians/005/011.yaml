  naturalness: Bahasa utama sudah baku dan bernada surat apostolik. “Batu sandungan dari salib” lebih idiomatis daripada rangkaian nomina “batu sandungan salib.” Penempatan penanda catatan sesudah frasa yang dijelaskan juga lebih tepat.
