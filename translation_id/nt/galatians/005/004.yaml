id: GAL.5.4
reference: Galatians 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: id
  text: Kalian yang berusaha dibenarkan berdasarkan hukum Taurat telah terputus dari Kristus[a]; kalian telah jatuh dari anugerah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dipisahkan dari Kristus” atau “tidak lagi mempunyai hubungan dengan Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε ἀπὸ Χριστοῦ
  choice: telah terputus dari Kristus
  rationale: Dengan ἀπό, bentuk pasif καταργέω menyatakan pemisahan dari Kristus. “Terputus” mempertahankan ketajaman gambaran relasional tanpa menentukan seluruh implikasi doktrinalnya.
- source_word: οἵτινες
  choice: Kalian yang
  rationale: Ungkapan ini secara langsung menunjuk kelompok di antara para pembaca yang menjadi sasaran peringatan Paulus.
- source_word: ἐν νόμῳ
  choice: berdasarkan hukum Taurat
  rationale: ἐν di sini menyatakan dasar atau ranah pembenaran. Dalam konteks Galatia, νόμος merujuk pada hukum Taurat; “berdasarkan” mengungkapkan landasan yang diandalkan.
- source_word: δικαιοῦσθε
  choice: berusaha dibenarkan
  rationale: Secara bentuk, verba ini adalah present pasif, tetapi dalam argumen Paulus menunjuk pada orang yang mengupayakan pembenaran atas dasar hukum Taurat. Pilihan ini mempertahankan makna pasif “dibenarkan” sekaligus membuat maksud kontekstualnya alami dalam bahasa Indonesia.
- source_word: τῆς χάριτος ἐξεπέσατε
  choice: kalian telah jatuh dari anugerah
  rationale: ἐκπίπτω dengan genitif menggambarkan jatuh atau tersingkir dari sesuatu. Ungkapan ini mempertahankan metafora dan kerasnya peringatan Paulus.
theological_decisions:
- issue: Apakah ayat ini harus diterjemahkan dengan cara yang menuntaskan perdebatan tentang kehilangan keselamatan
  choice: 'Mempertahankan bahasa peringatan yang keras: “telah terputus dari Kristus” dan “telah jatuh dari anugerah.”'
  alternative: Melemahkannya menjadi “telah menjauh dari Kristus” atau menafsirkannya sebagai “telah meninggalkan prinsip anugerah.”
  rationale: Teks Yunani menyatakan pemisahan dari Kristus dan kejatuhan dari anugerah, tetapi tidak menjabarkan sebuah kesimpulan teologi sistematika. Terjemahan harus menjaga ketegangan itu.
- issue: 'Nuansa δικαιοῦσθε: tindakan yang sedang terjadi atau upaya mencari pembenaran'
  choice: “berusaha dibenarkan” dalam teks utama
  alternative: “dibenarkan” atau “sedang dibenarkan”
  rationale: Bentuk present pasif tetap tercermin dalam kata “dibenarkan,” sedangkan “berusaha” menyampaikan daya argumentatif konteks tanpa menyatakan bahwa hukum Taurat sungguh menghasilkan pembenaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. “Kalian” mempertahankan sapaan orang kedua jamak. “Kristus” dipakai karena merupakan bentuk yang paling alami dan mapan dalam bahasa Indonesia, sementara “anugerah” menjaga register yang bermartabat dan mudah dipahami.
