  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Yunani: οἵτινες sebagai sapaan terbatas (“Kalian yang”), δικαιοῦσθε secara kontekstual sebagai upaya untuk dibenarkan, ἐν νόμῳ sebagai dasar pembenaran melalui hukum Taurat, serta dua aoristus yang menyatakan akibat tegas: terputus dari Kristus dan jatuh dari anugerah. Terjemahan tidak memaksakan penyelesaian atas perdebatan teologis yang melampaui teks.'
