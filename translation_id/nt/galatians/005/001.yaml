  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: id
  text: Untuk kemerdekaan, Mesias telah memerdekakan kita. Karena itu, berdirilah teguh dan jangan lagi terikat oleh kuk perbudakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “terikat oleh” juga dapat berarti menjadi takluk kepada atau terjerat oleh sesuatu. Frasa pembuka dapat pula diterjemahkan, “Dalam kemerdekaan, Mesias telah memerdekakan kita”; hubungan datif itu padat dan dapat dipahami dengan beberapa cara yang maknanya berdekatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Demi kemerdekaan
  rationale: Frasa datif yang diletakkan di depan ini paling mungkin menyatakan tujuan atau hasil. “Demi kemerdekaan” mempertahankan penekanan retoris sekaligus tidak menutup kemungkinan nuansa “dalam kemerdekaan,” yang dicatat dalam catatan kaki.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός diterjemahkan sebagai gelar, bukan sekadar diperlakukan sebagai nama, sehingga makna mesianik dan latar Yahudinya tetap tampak.
- source_word: ἠλευθέρωσεν
  choice: telah memerdekakan
  rationale: Kata kerja ini berarti membebaskan atau memerdekakan. “Memerdekakan” secara alami menggemakan kata benda “kemerdekaan” dan mempertahankan permainan kata Yunani.
- source_word: στήκετε
  choice: berdirilah teguh
  rationale: Imperatif kini ini menyerukan keteguhan yang terus dipertahankan. Ungkapan tersebut alami dalam bahasa Indonesia dan menjaga daya nasihatnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Penghubung ini menandai kesimpulan yang ditarik dari pernyataan sebelumnya.
- source_word: ζυγῷ δουλείας
  choice: kuk perbudakan
  rationale: “Kuk” mempertahankan metafora penundukan, sedangkan “perbudakan” menyampaikan kuatnya keadaan tidak bebas yang dimaksud oleh δουλεία.
- source_word: ἐνέχεσθε
  choice: terikat pada
  rationale: Dalam konteks pasif atau medial ini, kata tersebut dapat berarti dikenai, ditundukkan kepada, atau terjerat oleh sesuatu. “Terikat pada” alami dalam bahasa Indonesia dan tetap selaras dengan gambaran kuk.
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini menunjukkan kembalinya seseorang kepada keadaan sebelumnya.
theological_decisions:
- issue: Apakah Χριστός diterjemahkan sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός menunjuk pada jabatan mesianik Dia yang memerdekakan. Menerjemahkan gelarnya mempertahankan makna istilah Yunani tanpa memasukkan penafsiran denominasi tertentu.
- issue: Seberapa kuat δουλεία harus diterjemahkan
  choice: perbudakan
  alternative: belenggu
  rationale: Konteks mempertentangkan kemerdekaan dengan keadaan diperbudak. “Perbudakan” lebih langsung mempertahankan bobot sosial dan teologis istilah itu, sementara “belenggu” akan mengganti metafora asli dengan metafora lain.
- issue: Hubungan datif pembuka dengan tindakan memerdekakan
  choice: tujuan atau hasil, diterjemahkan “Demi kemerdekaan”
  alternative: keadaan atau ranah, “Dalam kemerdekaan”
  rationale: Susunan Yunani sangat padat dan memungkinkan lebih dari satu hubungan yang berdekatan. Teks utama mengikuti pembacaan tujuan/hasil, sedangkan kemungkinan keadaan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan “kemerdekaan—memerdekakan” dipertahankan untuk mencerminkan hubungan kata dalam bahasa Yunani. “Kuk perbudakan” sengaja mempertahankan metafora sumber.
