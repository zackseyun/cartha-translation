id: GAL.5.16
reference: Galatians 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: id
  text: 'Namun, aku berkata: Hiduplah menurut Roh, maka kamu sama sekali tidak akan menuruti keinginan daging[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabiat berdosa.” Kata Yunani yang digunakan secara harfiah berarti “daging”; dalam tulisan Paulus, kata ini dapat menunjuk pada natur manusia yang telah jatuh dan menentang Roh.
    reason: Menjelaskan makna kiasan yang mungkin dari σάρξ tanpa menggantikan istilah Paulus dalam teks utama.
lexical_decisions:
- source_word: Λέγω δέ
  choice: Namun, aku berkata
  rationale: δέ menandai peralihan yang agak kontras dengan konteks sebelumnya. “Namun” mempertahankan nuansa itu tanpa membuat pertentangannya terlalu tajam.
- source_word: πνεύματι
  choice: menurut Roh
  rationale: Datif ini dapat menunjukkan sarana atau lingkup. “Menurut Roh” alami dalam bahasa Indonesia dan menyatakan bahwa kehidupan orang percaya diarahkan oleh Roh; konteks Galatia 5 menunjuk kepada Roh Kudus.
- source_word: περιπατεῖτε
  choice: Hiduplah
  rationale: Secara harfiah berarti “berjalanlah,” tetapi digunakan sebagai metafora bagi cara hidup. “Hiduplah” menyampaikan makna idiomatisnya dengan jelas bagi pembaca modern.
- source_word: ἐπιθυμίαν
  choice: keinginan
  rationale: Kata ini pada dasarnya berarti keinginan dan memperoleh nuansa negatif dari frasa “daging.” Pilihan ini tidak mempersempit maknanya menjadi nafsu seksual.
- source_word: σαρκὸς
  choice: daging
  rationale: “Daging” mempertahankan istilah dan ketegangan teologis Paulus, sementara makna antropologis-moralnya dijelaskan dalam catatan kaki.
- source_word: οὐ μὴ τελέσητε
  choice: sama sekali tidak akan menuruti
  rationale: οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang kuat. Dalam hubungan dengan “keinginan,” “menuruti” secara alami menyampaikan tindakan melaksanakan atau mewujudkan keinginan tersebut.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus
  alternative: roh manusia atau prinsip rohani secara umum
  rationale: Konteks langsung Galatia 5 mempertentangkan Roh dengan daging dan menunjuk pada karya Roh Kudus. Huruf kapital menyatakan penilaian kontekstual ini.
- issue: Penerjemahan σάρξ
  choice: daging
  alternative: tabiat berdosa
  rationale: Walaupun kata ini di sini memiliki makna moral dan antropologis, mempertahankan “daging” menghindari pembatasan kategori Paulus pada satu tafsiran. Penjelasan alternatif diberikan dalam catatan kaki.
- issue: Hubungan dua klausa
  choice: perintah yang diikuti kepastian hasil
  alternative: 'dua perintah: “hiduplah ... dan jangan menuruti”'
  rationale: 'Bentuk οὐ μὴ τελέσητε paling wajar dipahami sebagai penyangkalan kuat tentang hasil: hidup menurut Roh memastikan bahwa keinginan daging tidak dilaksanakan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hiduplah” dipilih daripada terjemahan harfiah “berjalanlah” agar metafora cara hidup langsung dipahami. Penyangkalan kuat dipertahankan melalui “sama sekali tidak akan.”
