base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: id
  text: penyembahan berhala, ilmu sihir[a], permusuhan, perselisihan, kecemburuan, ledakan amarah, ambisi egois, perpecahan, golongan-golongan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “praktik-praktik gaib.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sekte-sekte”; dalam pemakaian gerejawi yang lebih kemudian, “bidah-bidah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: penyembahan berhala
  rationale: Ungkapan ini tepat menyatakan pemujaan atau pengabdian kepada berhala dan lebih mudah dipahami pembaca umum daripada bentuk abstrak yang kurang lazim.
- source_word: φαρμακεία
  choice: ilmu sihir
  rationale: Dalam daftar keburukan ini, kata tersebut menunjuk pada praktik gaib yang berkaitan dengan ramuan atau mantra, bukan pada pengobatan pada umumnya.
- source_word: ἔχθραι
  choice: permusuhan
  rationale: Bentuk jamak Yunani mencakup sikap maupun berbagai wujud antagonisme; nomina kolektif Indonesia ini menyampaikannya secara alami.
- source_word: ἔρις
  choice: perselisihan
  rationale: Kata ini menyatakan pertentangan dan pertikaian antarmanusia; pilihan ini ringkas serta sesuai dengan bentuk daftar.
- source_word: ζῆλος
  choice: kecemburuan
  rationale: Dalam konteks negatif ini, kata tersebut berarti kecemburuan yang menimbulkan persaingan, bukan semangat yang positif.
- source_word: θυμοί
  choice: ledakan amarah
  rationale: Bentuk jamak menunjuk pada luapan amarah yang berulang, bukan semata-mata keadaan marah yang menetap.
- source_word: ἐριθεῖαι
  choice: ambisi egois
  rationale: Ungkapan ini menangkap usaha memajukan kepentingan diri sendiri yang sering disertai persaingan atau keberpihakan.
- source_word: διχοστασίαι
  choice: perpecahan
  rationale: Kata ini menggambarkan keadaan ketika orang-orang berdiri terpisah sebagai pihak-pihak yang berlawanan.
- source_word: αἱρέσεις
  choice: golongan-golongan
  rationale: Dalam konteks hubungan antaranggota komunitas, kata ini terutama menunjuk pada kelompok atau kubu yang terbentuk secara memecah belah, tanpa harus bermakna teknis sebagai penyimpangan doktrin.
theological_decisions:
- issue: Makna αἱρέσεις
  choice: golongan-golongan
  alternative: sekte-sekte; bidah-bidah
  rationale: Konteks langsungnya adalah daftar dosa sosial dan relasional. Karena itu, makna kelompok atau kubu yang memecah belah dipertahankan, sedangkan arti teknis 'bidah' dari pemakaian gerejawi kemudian tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas yang cocok untuk daftar keburukan. Istilah abstrak yang lazim dipakai agar tetap bermartabat dan mudah dipahami. Tanda koma terakhir dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut ke ayat berikutnya.
