  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: id
  text: Janganlah kita menjadi sombong[a], saling menantang dan saling iri hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencari kemuliaan kosong.” Kata Yunani ini menunjuk pada kebanggaan atau rasa penting diri yang tidak berdasar.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Janganlah kita menjadi
  rationale: μή dengan bentuk subjungtif orang pertama jamak menyatakan ajakan negatif. Frasa ini mempertahankan daya nasihat bersama dan nuansa ‘menjadi’ dari γίνομαι.
- source_word: κενόδοξοι
  choice: sombong
  rationale: Istilah ini menunjuk pada rasa penting diri atau kebanggaan yang tidak berdasar. ‘Sombong’ alami dan mudah dipahami dalam bahasa Indonesia modern, sedangkan unsur harfiahnya dijelaskan dalam catatan kaki.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: saling
  rationale: ‘Saling’ merupakan padanan Indonesia yang ringkas dan wajar untuk tindakan timbal balik, serta mempertahankan kesejajaran kedua frasa.
- source_word: προκαλούμενοι
  choice: menantang
  rationale: Kata ini menggambarkan tindakan memancing atau menantang orang lain dalam suasana persaingan. ‘Menantang’ mempertahankan cakupan maknanya tanpa membatasinya hanya pada tindakan membuat marah.
- source_word: φθονοῦντες
  choice: iri hati
  rationale: φθονέω berarti merasa iri terhadap orang lain. ‘Iri hati’ adalah ungkapan baku, jelas, dan sesuai dengan bentuk tindakan yang menyertai kesombongan.
theological_decisions:
- issue: Hubungan kedua partisip dengan nasihat utama
  choice: 'Kedua partisip diterjemahkan sebagai tindakan penyerta yang menggambarkan akibat atau wujud kesombongan: ‘saling menantang dan saling iri hati.’'
  alternative: Keduanya dapat dipahami sebagai perluasan yang hampir bersifat imperatif atau sebagai cara seseorang menjadi sombong.
  rationale: Susunan Yunani paling wajar menempatkan κενόδοξοι sebagai predikat utama, sementara kedua partisip menggambarkan perilaku yang menyertainya. Terjemahan tidak mempersempit hubungan logis itu lebih jauh daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Pengulangan timbal balik dipertahankan melalui ‘saling’ pada kedua tindakan.
