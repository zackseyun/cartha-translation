base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: id
  text: 'iri hati, kemabukan, pesta pora, dan hal-hal serupa. Tentang semuanya itu, aku memperingatkan kalian, seperti yang telah kuperingatkan sebelumnya: orang-orang yang melakukan hal-hal seperti itu tidak akan mewarisi Kerajaan Allah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνοι
  choice: iri hati
  rationale: Bentuk jamak ini menyatakan sikap dengki terhadap kebaikan yang dimiliki orang lain. Dalam daftar sifat buruk bahasa Indonesia, bentuk kategori kolektif “iri hati” lebih alami daripada bentuk jamak.
- source_word: μέθαι
  choice: kemabukan
  rationale: Menunjuk pada keadaan atau kejadian mabuk; “kemabukan” ringkas, jelas, dan sepadan dalam daftar sifat buruk.
- source_word: κῶμοι
  choice: pesta pora
  rationale: Menunjuk pada perayaan liar dan berlebihan, yang sering berkaitan dengan minuman keras. “Pesta pora” menyampaikan unsur keramaian dan pelampiasan berlebihan tanpa mempersempitnya menjadi perilaku seksual.
- source_word: τὰ ὅμοια τούτοις
  choice: hal-hal serupa
  rationale: Mempertahankan sifat terbuka daftar ini dan terdengar alami dalam bahasa Indonesia.
- source_word: ἃ προλέγω ὑμῖν
  choice: Tentang semuanya itu, aku memperingatkan kalian
  rationale: Dalam konteks nasihat moral, προλέγω membawa daya peringatan, bukan sekadar pemberitahuan sebelumnya. “Semuanya itu” merujuk secara alami kepada hal-hal dalam daftar.
- source_word: καθὼς προεῖπον
  choice: seperti yang telah kuperingatkan sebelumnya
  rationale: Menunjuk pada peringatan terdahulu dan mempertahankan pengulangan retoris dari verba yang sama.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: orang-orang yang terus melakukan hal-hal seperti itu
  rationale: Present participle πράσσοντες paling wajar menunjukkan perilaku yang berlangsung atau menjadi pola. “Terus melakukan” menyatakannya tanpa mengubah peringatan menjadi klaim tentang satu tindakan terpisah.
- source_word: βασιλείαν θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan bermartabat dalam bahasa Indonesia untuk istilah teologis Perjanjian Baru ini.
- source_word: οὐ κληρονομήσουσιν
  choice: tidak akan mewarisi
  rationale: Mempertahankan metafora warisan dan daya eskatologis bentuk futurum.
theological_decisions:
- issue: Apakah peringatan Paulus menunjuk pada tindakan tunggal atau pola perilaku
  choice: orang-orang yang terus melakukan hal-hal seperti itu
  alternative: orang-orang yang melakukan hal-hal seperti itu
  rationale: Bentuk present participle dalam konteks daftar sifat buruk paling alami menyatakan praktik yang berlangsung atau menjadi ciri kehidupan. Terjemahan ini menjaga keseriusan peringatan tanpa menyatakan bahwa setiap kegagalan tunggal pasti merupakan pokok yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμῖν berbentuk jamak; “aku” mengikuti suara pribadi Paulus. Tanda titik memisahkan penutup daftar dari peringatan panjang agar kalimat mudah dipahami tanpa mengubah hubungan maknanya.
