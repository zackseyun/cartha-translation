id: GAL.5.25
reference: Galatians 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: id
  text: Jika kita hidup oleh Roh[a], marilah kita juga berjalan seiring dengan Roh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jika kita hidup dalam Roh, marilah kita juga tetap mengikuti langkah Roh.”'
    reason: Menjaga kemungkinan nuansa lokatif/asosiatif pada πνεύματι dan arti lebih harfiah στοιχέω sebagai mengikuti atau menjaga langkah.
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Mempertahankan bentuk bersyarat dalam bahasa Yunani dan alur nasihat Paulus; 'karena' mungkin secara kontekstual, tetapi lebih menafsirkan.
- source_word: ζῶμεν
  choice: kita hidup
  rationale: Padanan alami untuk bentuk kini ζάω; dalam konteks ini menunjuk pada hidup yang berasal dari Roh, bukan sekadar keberadaan biologis.
- source_word: πνεύματι
  choice: oleh Roh
  rationale: Dativus dipahami terutama sebagai sumber atau sarana kehidupan. Konteks pertentangan antara daging dan Roh menunjuk pada Roh Kudus.
- source_word: καὶ
  choice: juga
  rationale: 'Menampilkan daya asensif kata tersebut: kehidupan oleh Roh harus disertai perilaku yang selaras dengan Roh.'
- source_word: στοιχῶμεν
  choice: marilah kita berjalan seiring
  rationale: Subjungtif hortatoris diterjemahkan sebagai ajakan. 'Berjalan seiring' menyampaikan gambaran στοιχέω tentang mengikuti barisan atau menjaga langkah, sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus, ditulis 'Roh'
  alternative: roh manusia
  rationale: Konteks Galatia 5 yang mempertentangkan daging dengan Roh sangat kuat menunjuk pada Roh Kudus.
- issue: Hubungan hidup dan perilaku
  choice: Kehidupan oleh Roh menjadi dasar ajakan untuk berjalan selaras dengan Roh
  alternative: 'Pernyataan kausal eksplisit: ''Karena kita hidup oleh Roh'''
  rationale: '''Jika'' mempertahankan bentuk kondisional εἰ dan ketegangan retoris teks tanpa mengubahnya menjadi sebab yang dinyatakan secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Roh' dipertahankan sesuai penekanan teks Yunani; 'berjalan seiring' dipilih agar metafora etis dan nuansa keteraturan langkah tetap terasa.
