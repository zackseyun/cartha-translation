  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: id
  text: Seandainya orang-orang yang mengacaukan kalian itu bahkan memotong diri mereka sendiri![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong diri mereka sendiri.” Dalam konteks ini, Paulus kemungkinan besar memakai permainan kata tentang sunat dan bermaksud agar mereka melangkah lebih jauh, yaitu mengebiri diri. Ungkapan ini juga dapat dipahami sebagai “memotong diri” atau memisahkan diri.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang yang meresahkan kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Seandainya
  rationale: Partikel ini menyatakan harapan yang kuat. “Seandainya” alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: καὶ
  choice: bahkan
  rationale: 'Dalam konteks ini καί memperkuat dan meningkatkan gagasan: bukan sekadar bersunat, melainkan melangkah lebih jauh.'
- source_word: ἀποκόψονται
  choice: mengebiri diri mereka sendiri
  rationale: Secara leksikal berarti memotong; dalam konteks perdebatan tentang sunat, bentuk ini paling mungkin merupakan permainan kata tajam yang mengacu pada pengebirian. Bentuk medial mendukung makna refleksif.
- source_word: οἱ ἀναστατοῦντες
  choice: orang-orang yang mengacaukan
  rationale: Partisipel ini menunjuk kepada para penghasut yang menimbulkan keresahan dan kekacauan di antara jemaat Galatia.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina orang kedua jamak ini ditujukan kepada jemaat Galatia secara kolektif; “kalian” menyatakan bentuk jamaknya dengan jelas.
theological_decisions:
- issue: Makna harapan retoris Paulus dalam hubungannya dengan sunat
  choice: Paulus dengan ironi atau hiperbola yang tajam berharap agar para penganjur sunat melangkah lebih jauh dan mengebiri diri.
  alternative: Paulus hanya berharap agar mereka memisahkan diri dari jemaat atau disingkirkan secara umum.
  rationale: Konteks langsung Galatia 5 membahas sunat, sehingga permainan kata tentang tindakan memotong paling kuat secara kontekstual. Teks utama menyampaikan kemungkinan makna tersebut, sedangkan catatan kaki mempertahankan alternatif harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, tegas, dan mudah dipahami. “Kalian” dipakai untuk mempertahankan bentuk jamak ὑμᾶς. Ungkapan “mengebiri diri mereka sendiri” mempertahankan ketajaman retoris dan permainan kata dalam konteks sunat tanpa mengaburkannya.
