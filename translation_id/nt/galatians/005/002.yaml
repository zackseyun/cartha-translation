  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: id
  text: Perhatikanlah! Aku, Paulus, berkata kepadamu bahwa jika kalian membiarkan diri kalian disunat[a], Mesias[b] tidak akan memberi manfaat apa pun kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika kalian disunat” atau “jika kalian menerima sunat.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus”; diterjemahkan di sini sebagai “Mesias” karena Χριστός berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: Perhatikanlah!
  rationale: Berfungsi sebagai seruan untuk menarik perhatian. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan ketegasan peringatan Paulus.
- source_word: ἐγὼ Παῦλος
  choice: Aku, Paulus,
  rationale: Pronomina eksplisit ἐγώ bersifat emfatis. Mempertahankan pronomina bersama nama Paulus melestarikan penegasan diri dalam teks Yunani.
- source_word: λέγω ὑμῖν
  choice: berkata kepadamu
  rationale: Padanan langsung dan wajar bagi λέγω dengan pronomina datif, sekaligus mempertahankan nada pernyataan langsung.
- source_word: ἐὰν περιτέμνησθε
  choice: jika kamu membiarkan dirimu disunat
  rationale: Bentuk pasif kini subjungtif menunjukkan bahwa para pembaca menjalani sunat. Ungkapan ini membuat unsur kesediaan menjalani tindakan itu jelas tanpa menambahkan alasan teologis ke dalam teks utama.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός di sini tetap berfungsi sebagai gelar bagi Yesus. 'Mesias' menerjemahkan makna gelar tersebut, bukan sekadar mentransliterasikannya sebagai 'Kristus'.
- source_word: οὐδὲν ὠφελήσει
  choice: tidak akan memberi manfaat apa pun kepadamu
  rationale: Mengungkapkan penyangkalan manfaat secara menyeluruh dengan bahasa Indonesia yang alami dan tetap dekat dengan arti ὠφελέω.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks peringatan tentang sunat dan manfaat penyelamatan, Χριστός tetap memiliki daya sebagai gelar. 'Mesias' mempertahankan makna gelar itu.
- issue: Cakupan peringatan Paulus mengenai sunat
  choice: Teks menyatakan bahwa jika pembaca membiarkan diri mereka disunat, Mesias tidak akan memberi mereka manfaat apa pun.
  alternative: Menjelaskan dalam teks utama bahwa hanya sunat sebagai syarat pembenaran yang dimaksud, atau menyatakan larangan mutlak atas segala bentuk sunat.
  rationale: Konteks surat menerangkan sengketa teologisnya, tetapi ayat ini sendiri menyampaikan peringatan tanpa pembatas eksplisit. Terjemahan tidak memperluas ataupun mempersempit pernyataan Paulus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan khidmat. Seruan pembuka dibuat sebagai kalimat tersendiri untuk membawa tekanan Ἴδε, sedangkan susunan “Aku, Paulus” mempertahankan penekanan retoris teks sumber.
