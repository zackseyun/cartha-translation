id: GAL.5.14
reference: Galatians 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: id
  text: 'Sebab seluruh hukum Taurat digenapi dalam satu pernyataan ini: “Kasihilah sesamamu seperti dirimu sendiri.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam satu perkataan.” Secara harfiah, bahasa Yunani berbunyi “dalam satu kata/perkataan,” dengan maksud satu ucapan atau perintah.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah digenapi”; secara tafsiran dapat diterjemahkan “dirangkum.” Kata kerja Yunani lebih harfiah berarti “digenapi” dan dapat menyiratkan bahwa maksud hukum Taurat mencapai kepenuhannya dalam perintah ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau dasar bagi nasihat sebelumnya; “Sebab” merupakan penghubung penjelas yang alami dalam bahasa Indonesia.
- source_word: πᾶς νόμος
  choice: seluruh hukum Taurat
  rationale: Bentuk tunggal dengan artikel menunjuk kepada hukum sebagai satu keseluruhan. Dalam konteks Paulus, “hukum Taurat” lebih jelas daripada sekadar “hukum” dan tidak membatasi rujukannya hanya pada bagian etis.
- source_word: ἐν ἑνὶ λόγῳ
  choice: dalam satu pernyataan ini
  rationale: λόγος di sini adalah satu ucapan atau rumusan perintah, bukan satu kata secara leksikal. “Pernyataan” menyampaikan maksud itu dengan jelas, sedangkan “ini” secara alami mengantar kutipan yang menyusul.
- source_word: πεπλήρωται
  choice: digenapi
  rationale: Bentuk perfect pasif menyatakan keadaan yang dihasilkan oleh penggenapan. “Digenapi” mempertahankan bentuk pasif dan makna πληρόω tanpa menyempitkannya menjadi sekadar “diringkas”.
- source_word: ἐν τῷ
  choice: ':'
  rationale: Konstruksi ini memperkenalkan isi pernyataan tempat penggenapan itu dinyatakan; dalam bahasa Indonesia, tanda titik dua secara alami mengantar kutipan tersebut.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Future indikatif dalam kutipan Imamat 19:18 berfungsi sebagai perintah. Bentuk imperatif “Kasihilah” alami, tegas, dan mempertahankan corak kutipan Kitab Suci.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: Dalam konteks etis ini πλησίον berarti orang lain yang menjadi sesama. “Sesamamu” adalah padanan Indonesia yang mapan dan idiomatis.
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Ungkapan ini mempertahankan perbandingan langsung dalam perintah tersebut secara jelas dan alami.
theological_decisions:
- issue: Makna pernyataan Paulus mengenai hubungan seluruh hukum Taurat dengan perintah kasih
  choice: Paulus menyatakan bahwa seluruh hukum Taurat digenapi dalam perintah untuk mengasihi sesama.
  alternative: Paulus hanya mengatakan bahwa hukum Taurat diringkas dalam perintah ini, atau bahwa yang dimaksud hanya bagian etis dari hukum Taurat.
  rationale: πληρόω lebih kuat daripada gagasan sekadar meringkas dan secara alami berarti “menggenapi.” Terjemahan tidak membatasi “hukum Taurat” pada bagian tertentu karena teks Yunani tidak menyatakan pembatasan itu, serta tidak menarik kesimpulan doktrinal tambahan mengenai status hukum Taurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hukum Taurat” dipakai untuk kejelasan rujukan νόμος dalam konteks Paulus. Kutipan dibuat alami bagi pembaca umum tanpa menghilangkan ketegangan antara makna penggenapan dan rangkuman; alternatifnya dicatat dalam catatan kaki.
