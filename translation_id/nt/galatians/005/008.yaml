id: GAL.5.8
reference: Galatians 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: id
  text: Bujukan ini tidak berasal dari dia yang memanggil kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pengaruh ini tidak berasal dari dia yang memanggil kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισμονὴ
  choice: bujukan
  rationale: Nomina langka ini menunjuk pada persuasi atau pengaruh yang membuat seseorang terbujuk. “Bujukan” alami dalam bahasa Indonesia dan, dalam konteks ini, mengacu pada ajaran para pengacau yang sedang memengaruhi jemaat Galatia tanpa menguraikannya secara berlebihan.
- source_word: ἐκ
  choice: berasal dari
  rationale: ἐκ menandai sumber atau asal. “Berasal dari” menyampaikan hubungan itu secara jelas dan idiomatis.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: Dia yang memanggil kalian
  rationale: Partisipel kini καλοῦντος dipakai secara substantival. Ungkapan ini mempertahankan tindakan memanggil dan tidak menambahkan kata “Allah,” meskipun konteks paling wajar menunjuk kepada-Nya. “Kalian” menyatakan bahwa ὑμᾶς berbentuk jamak.
- source_word: οὐκ
  choice: tidak
  rationale: Negasi langsung dipertahankan untuk menyampaikan penyangkalan Paulus.
theological_decisions:
- issue: Identitas “Dia yang memanggil kalian”
  choice: Tidak menambahkan nama “Allah” dalam teks utama; huruf kapital pada “Dia” menunjukkan bahwa konteks paling wajar merujuk kepada Allah.
  alternative: “Allah yang memanggil kalian” atau bentuk tanpa kapital, “dia yang memanggil kalian.”
  rationale: Bahasa Yunani memakai ungkapan partisipial, bukan nomina θεός. Terjemahan mempertahankan bentuk ungkapan Paulus tanpa menjadikan rujukannya kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. “Bujukan” mempertahankan sifat abstrak πεισμονή dengan ungkapan yang mudah dipahami; “kalian” menandai orang kedua jamak secara jelas.
