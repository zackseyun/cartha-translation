  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: id
  text: Perbuatan-perbuatan daging[a] itu nyata, yaitu percabulan, kenajisan, dan perilaku tidak senonoh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabiat berdosa.” Kata Yunaninya berarti “daging”; di sini Paulus memakainya sebagai metafora bagi kecenderungan dan orientasi manusia yang telah jatuh ke dalam dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: nyata
  rationale: Menunjukkan bahwa perbuatan-perbuatan tersebut jelas terlihat atau mudah dikenali; “nyata” alami dan ringkas dalam bahasa Indonesia modern.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dari uraian sebelumnya. Dalam bahasa Indonesia, peralihan tersebut sudah cukup jelas dari konteks sehingga penambahan “sekarang” atau “tetapi” dapat memberi tekanan yang tidak ada dalam sumber.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Bentuk jamak ini mengacu pada tindakan atau perilaku yang dihasilkan oleh daging. “Perbuatan-perbuatan” jelas bagi pembaca umum dan tetap mempertahankan kontras dengan “buah Roh” dalam ayat berikutnya.
- source_word: τῆς σαρκός
  choice: daging
  rationale: Mempertahankan metafora khas Paulus dan ketegangan teologis dalam pertentangan antara daging dan Roh, tanpa langsung menyempitkannya menjadi satu penafsiran.
- source_word: ἅτινά ἐστιν
  choice: yaitu
  rationale: Memperkenalkan daftar penjelas secara alami. Kata ganti relatif Yunani ini bernuansa kualitatif dan daftar yang menyusul tidak harus dipahami sebagai definisi yang sepenuhnya tuntas.
- source_word: πορνεία
  choice: percabulan
  rationale: Mengacu secara luas pada perilaku seksual yang tidak bermoral. “Percabulan” merupakan istilah Indonesia yang mapan, ringkas, dan sesuai dengan konteks daftar keburukan.
- source_word: ἀκαθαρσία
  choice: kenajisan
  rationale: Menyatakan ketidakmurnian moral, khususnya dalam konteks etis dan seksual. “Kenajisan” mempertahankan citra ketidakmurnian yang terkandung dalam istilah Yunani.
- source_word: ἀσέλγεια
  choice: perilaku tidak senonoh
  rationale: Istilah ini menunjuk pada perilaku memuaskan diri tanpa rasa malu atau kendali, sering kali secara seksual. Pilihan ini lebih jelas bagi pembaca modern daripada “percabulan” kedua atau istilah teknis seperti “kebejatan”.
theological_decisions:
- issue: Makna σάρξ dalam konteks etika Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: “Daging” mempertahankan metafora Paulus serta pertentangannya dengan Roh. “Tabiat berdosa” dapat menjelaskan salah satu aspek maknanya, tetapi terlalu cepat menetapkan satu tafsiran dan dapat memberi kesan bahwa Paulus sedang menamai suatu komponen tertentu dalam diri manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur daftar dipertahankan karena ayat berlanjut ke butir-butir berikutnya; tanda koma akhir menunjukkan kelanjutan tersebut. Penanda catatan kaki ditempatkan langsung sesudah istilah “daging” yang dijelaskannya.
