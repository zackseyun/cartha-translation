  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: id
  text: Sedikit ragi membuat seluruh adonan mengembang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sedikit ragi membuat seluruh adonan beragi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὰ
  choice: sedikit
  rationale: Kata sifat ini menyatakan jumlah kecil dan, dalam ungkapan peribahasa, paling alami diterjemahkan sebagai “sedikit”.
- source_word: ζύμη
  choice: ragi
  rationale: ζύμη menunjuk pada bahan fermentasi yang digunakan dalam adonan. “Ragi” merupakan padanan Indonesia modern yang alami dan tetap mempertahankan gambaran konkret serta daya metaforisnya.
- source_word: ὅλον
  choice: seluruh
  rationale: “Seluruh” menyampaikan cakupan total yang ditekankan oleh ὅλον dan cocok secara alami dengan “adonan”.
- source_word: φύραμα
  choice: adonan
  rationale: φύραμα menunjuk pada massa atau adonan yang telah dicampur. “Adonan” jelas bagi pembaca modern dan mempertahankan gambaran pembuatan roti tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: ζυμοῖ
  choice: membuat ... mengembang
  rationale: Kata kerja ini berarti menyebabkan adonan beragi. Dalam bahasa Indonesia, “membuat ... mengembang” menyampaikan efek ragi secara alami dan jelas, sedangkan bentuk seperti “meragikan” kurang lazim.
theological_decisions:
- issue: Daya metaforis peribahasa
  choice: Mempertahankan gambaran konkret tentang ragi dan adonan tanpa menjelaskan penerapannya dalam teks utama.
  alternative: Sedikit ajaran sesat memengaruhi seluruh jemaat.
  rationale: Ayat ini menyatakan sebuah peribahasa; konteks memberi petunjuk tentang penerapannya. Menjaga bentuk peribahasa mempertahankan kekuatan retoris dan tidak memasukkan tafsiran tertentu ke dalam terjemahan.
- issue: Nuansa kata kerja ζυμοῖ
  choice: membuat seluruh adonan mengembang
  alternative: meragikan seluruh adonan
  rationale: Pilihan utama alami dalam bahasa Indonesia dan menggambarkan hasil kerja ragi. Catatan kaki mempertahankan padanan yang lebih formal dan dekat dengan bentuk kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada peribahasa. Susunan kalimat mempertahankan kontras antara jumlah ragi yang kecil dan dampaknya atas seluruh adonan.
