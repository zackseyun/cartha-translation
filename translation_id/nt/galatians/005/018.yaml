id: GAL.5.18
reference: Galatians 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: id
  text: Namun, jika kamu dipimpin oleh Roh[a], kamu tidak berada di bawah hukum Taurat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “jika kamu sedang dipimpin oleh Roh.”
    reason: Bentuk verba kini pasif ἄγεσθε dapat menonjolkan tindakan yang berlangsung, meskipun bahasa Indonesia tidak wajib menyatakannya secara eksplisit.
  - marker: b
    text: “Di bawah hukum Taurat” berarti berada di bawah otoritas atau yurisdiksinya; bandingkan Galatia 5:23.
    reason: Menjelaskan idiom Paulus dan memberikan rujukan silang kontekstual.
lexical_decisions:
- source_word: εἰ
  choice: jika
  rationale: Memperkenalkan klausa bersyarat secara langsung dan wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan pembahasan sebelumnya tentang keinginan daging dan pimpinan Roh.
- source_word: πνεύματι
  choice: oleh Roh
  rationale: Bentuk datif menyatakan pelaku bersama verba pasif; dalam konteks Galatia 5, πνεῦμα merujuk kepada Roh Kudus. Huruf kapital memperjelas referennya tanpa menambahkan kata yang tidak diperlukan.
- source_word: ἄγεσθε
  choice: kamu dipimpin
  rationale: Mempertahankan bentuk pasif kini dari ἄγω dengan ungkapan Indonesia yang alami; bentuk ini dapat mencakup tindakan yang sedang berlangsung.
- source_word: οὐκ ἐστὲ
  choice: kamu tidak berada
  rationale: Mengungkapkan konstruksi kopulatif negatif secara alami sebagai keadaan atau kedudukan.
- source_word: ὑπὸ νόμον
  choice: di bawah hukum Taurat
  rationale: Ungkapan Paulus menunjuk pada ketundukan kepada νόμος sebagai ranah otoritas; dalam konteks Galatia, referennya adalah hukum Taurat. Penambahan 'Taurat' membuat referen kontekstual itu jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Referen πνεύματι
  choice: Roh Kudus, diterjemahkan 'Roh'
  alternative: roh manusia
  rationale: Dalam Galatia 5:16–25, pertentangan yang berulang ialah antara daging dan Roh sebagai pelaku ilahi yang memimpin orang percaya. Terjemahan 'Roh' mempertahankan pengertian kontekstual tanpa memperluas ayat.
- issue: Makna ὑπὸ νόμον
  choice: berada di bawah otoritas atau yurisdiksi hukum Taurat
  alternative: berada di bawah hukum dalam arti umum
  rationale: Dalam argumentasi Galatia, frasa ini secara kontekstual menunjuk pada hukum Taurat sebagai tatanan yang berkuasa. Teks utama mempertahankan metafora 'di bawah', sedangkan catatan kaki menjelaskan lingkup maknanya tanpa membangun sistem doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kamu' mewakili bentuk jamak Yunani dan sesuai dengan sapaan kepada jemaat. Susunan kalimat dibuat ringkas serta mempertahankan kontras, bentuk pasif, dan metafora yurisdiksi dalam teks sumber.
