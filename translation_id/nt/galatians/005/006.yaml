id: GAL.5.6
reference: Galatians 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: id
  text: Sebab dalam Mesias Yesus[a], baik bersunat maupun tidak bersunat tidak berarti apa-apa; yang berarti ialah iman[b] yang bekerja melalui kasih[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Kristus Yesus.” Kata Yunani Χριστός diterjemahkan “Mesias” dalam teks utama untuk mempertahankan maknanya sebagai gelar.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani πίστις juga dapat diterjemahkan “kepercayaan” atau “kesetiaan.”
    reason: lexical_alternative
  - marker: c
    text: Frasa ini juga dapat diterjemahkan “iman yang aktif melalui kasih,” “iman yang menyatakan diri melalui kasih,” atau “iman yang dibuat berdaya melalui kasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Kata ἐν dipertahankan sebagai “dalam” untuk menjaga bahasa Paulus tentang keberadaan atau persatuan dalam Mesias. Χριστός diterjemahkan sebagai gelar “Mesias,” sedangkan Ἰησοῦ sebagai nama “Yesus.”
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memberikan dasar penjelasan bagi pernyataan sebelumnya; “sebab” merupakan penghubung yang ringkas dan wajar dalam bahasa Indonesia.
- source_word: περιτομή ... ἀκροβυστία
  choice: bersunat ... tidak bersunat
  rationale: Bentuk verbal-keadaan ini lebih alami bagi pembaca Indonesia daripada nomina abstrak “sunat ... ketidaksunatan,” sekaligus mempertahankan kontras kedua status tersebut.
- source_word: τι ἰσχύει
  choice: tidak berarti apa-apa; yang berarti ialah
  rationale: Dalam konteks ini ἰσχύει menyatakan arti penting, daya berlaku, atau nilai praktis, bukan sekadar kekuatan fisik. Susunan kontras dalam bahasa Indonesia dibuat eksplisit tanpa menambahkan objek teologis yang tidak disebutkan teks.
- source_word: πίστις
  choice: iman
  rationale: “Iman” adalah padanan utama yang mapan bagi πίστις. Kemungkinan nuansa “kepercayaan” atau “kesetiaan” tetap dicatat dalam catatan kaki.
- source_word: δι’ ἀγάπης
  choice: melalui kasih
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; “melalui kasih” mempertahankan hubungan itu tanpa mempersempitnya menjadi sebab.
- source_word: ἐνεργουμένη
  choice: yang bekerja
  rationale: Partisipel kini bentuk medium/pasif ini menggambarkan iman sebagai aktif atau berdaya. “Yang bekerja” mempertahankan daya verbal dan sebagian ambiguitas bentuknya tanpa memaksakan tafsiran medium atau pasif secara eksklusif.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar. “Mesias” menyampaikan makna gelar itu, sementara bentuk tradisional “Kristus” dipertahankan sebagai alternatif dalam catatan kaki.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan atau kesetiaan
  rationale: Konteks menggambarkan πίστις yang bekerja melalui kasih, tetapi tidak menghapus rentang makna kata tersebut. Teks utama memakai padanan umum “iman,” dan alternatif leksikal dicatat tanpa menyelesaikan ketegangan secara sepihak.
- issue: Diatesis ἐνεργουμένη
  choice: yang bekerja
  alternative: yang aktif; yang menyatakan diri; yang dibuat berdaya
  rationale: Bentuk medium/pasif Yunani memungkinkan beberapa nuansa. Terjemahan utama sengaja tidak menentukan secara tegas apakah iman bertindak, menyatakan diri, atau dibuat efektif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “bersunat maupun tidak bersunat” dipilih karena lebih alami daripada pasangan nomina abstrak. Klausa “yang berarti ialah” memperjelas kontras ἀλλὰ secara idiomatis tanpa menyatakan secara khusus bahwa yang dimaksud adalah keselamatan, pembenaran, atau status perjanjian.
