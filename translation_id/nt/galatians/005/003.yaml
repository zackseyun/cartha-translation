  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: id
  text: Sekali lagi saya menegaskan kepada setiap orang yang menerima sunat[a] bahwa ia wajib melaksanakan seluruh hukum Taurat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “yang disunat” atau “yang membiarkan dirinya disunat.” Dalam konteks ini, ungkapan Yunani tersebut menunjuk kepada orang yang menjalani sunat.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ia adalah orang yang berutang untuk melaksanakan seluruh hukum Taurat”; maksudnya, ia berada di bawah kewajiban.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: saya menegaskan
  rationale: Bentuk ini menyatakan penegasan pribadi yang sungguh-sungguh. 'Menegaskan' alami dalam bahasa Indonesia dan mempertahankan bobot pernyataan tanpa mempersempitnya menjadi sekadar peringatan.
- source_word: δὲ πάλιν
  choice: Sekali lagi
  rationale: δέ menghubungkan pernyataan ini secara ringan dengan ayat sebelumnya, sedangkan πάλιν menandai pengulangan atau penekanan kembali. Dalam bahasa Indonesia, 'Sekali lagi' sudah menghasilkan hubungan yang alami tanpa perlu menerjemahkan δέ secara tersendiri.
- source_word: παντὶ ἀνθρώπῳ
  choice: kepada setiap orang
  rationale: ἄνθρωπος di sini bersifat umum dan distributif. 'Setiap orang' menyampaikan cakupan itu secara tepat dan wajar; konteks sunat dengan sendirinya menunjukkan sasaran praktisnya.
- source_word: περιτεμνομένῳ
  choice: yang menerima sunat
  rationale: Partisipel kini ini dalam konteks menunjuk kepada orang yang menjalani atau menyerahkan diri untuk disunat. 'Menerima sunat' mempertahankan fokus pada tindakan tersebut tanpa menambahkan motif yang tidak dinyatakan.
- source_word: ὀφειλέτης ἐστὶν
  choice: ia wajib
  rationale: Ungkapan harfiahnya menyebut orang itu sebagai 'orang yang berutang', tetapi dalam konteks ini maknanya adalah berada di bawah kewajiban. 'Wajib' jelas dan alami dalam bahasa Indonesia.
- source_word: ὅλον τὸν νόμον
  choice: seluruh hukum Taurat
  rationale: ὅλον menekankan keseluruhan. Dalam konteks Paulus, νόμος merujuk pada Taurat; penyebutan 'hukum Taurat' jelas bagi pembaca Indonesia dan tidak mengurangi penekanan totalitas.
- source_word: ποιῆσαι
  choice: melaksanakan
  rationale: Secara leksikal berarti 'melakukan', tetapi bersama νόμος menunjuk pada menaati atau menjalankan tuntutan hukum. 'Melaksanakan' mempertahankan tuntutan tindakan secara menyeluruh dan terdengar alami.
theological_decisions:
- issue: Cakupan pernyataan Paulus tentang sunat dan kewajiban terhadap Taurat
  choice: Ayat ini ditujukan kepada setiap orang yang menerima sunat dalam sengketa yang sedang dibahas dan menyatakan bahwa tindakan itu menempatkannya di bawah kewajiban untuk melaksanakan seluruh Taurat.
  alternative: Ayat ini dapat dibaca sebagai pernyataan umum tentang setiap laki-laki yang telah disunat, termasuk yang disunat ketika bayi.
  rationale: Konteks langsung Galatia 5:2–3 dan bentuk περιτεμνομένῳ mendukung orang yang sedang menjalani sunat sebagai langkah keagamaan dalam perdebatan tersebut. Namun, motif itu tidak ditambahkan ke dalam teks utama agar terjemahan tidak menutup cakupan gramatikalnya.
- issue: Metafora utang dalam ὀφειλέτης
  choice: Makna kewajiban dinyatakan langsung dengan 'wajib'.
  alternative: Metafora formal dapat dipertahankan sebagai 'orang yang berutang untuk melaksanakan'.
  rationale: Di sini metafora utang menyatakan kewajiban, bukan utang keuangan. Terjemahan langsung maknanya mencegah salah paham tanpa mengubah tuntutan teologis Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Susunan kalimat dibuat lugas bagi pembaca umum. 'Hukum Taurat' dipakai sebagai padanan kontekstual νόμος, dan semua penanda catatan kaki ditempatkan dalam teks utama.
