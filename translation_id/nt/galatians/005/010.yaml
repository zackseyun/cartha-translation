  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: id
  text: 'Dalam Tuhan, aku yakin tentang kalian: kalian tidak akan berpikir lain[a]. Namun, orang yang mengacaukan kalian akan menanggung penghakiman, siapa pun dia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan menganut pandangan lain.” Kata Yunani yang digunakan dapat mengacu pada cara berpikir, sikap batin, atau pandangan yang dianut.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak peduli siapa dia.” Ungkapan Yunani ini menegaskan bahwa identitas orang itu tidak mengubah hal tersebut.
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: aku yakin
  rationale: Bentuk perfektum dipakai secara idiomatis untuk menyatakan keyakinan yang telah terbentuk dan tetap berlangsung; “aku yakin” alami dalam bahasa Indonesia dan mempertahankan daya kini bentuk tersebut.
- source_word: εἰς ὑμᾶς
  choice: mengenai kalian
  rationale: Dengan πέποιθα, frasa ini mengarahkan keyakinan Paulus kepada jemaat Galatia. “Mengenai kalian” menyampaikan bahwa keyakinannya berkaitan dengan tanggapan mereka tanpa menafsirkan secara berlebihan.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Ungkapan Paulus ini menunjukkan ranah atau dasar keyakinannya. Terjemahan harfiah yang wajar ini mempertahankan bobot teologis dan relasionalnya.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: kalian tidak akan berpikiran lain
  rationale: φρονέω dapat menunjuk pada kegiatan berpikir, sikap batin, atau pandangan yang dianut. “Berpikiran lain” cukup luas untuk mempertahankan rentang makna itu dan alami dalam konteks.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: orang yang mengacaukan kalian
  rationale: Partisipel kini menunjuk kepada orang yang sedang menimbulkan keguncangan atau kekacauan di tengah jemaat. “Mengacaukan” mempertahankan kekuatan verba tanpa menentukan bentuk gangguannya.
- source_word: βαστάσει τὸ κρίμα
  choice: akan menanggung penghakiman
  rationale: βαστάζω mempertahankan metafora memikul atau menanggung, sedangkan κρίμα dapat berarti penghakiman, putusan, atau akibat hukumnya. “Penghakiman” tidak mempersempitnya menjadi penghukuman kekal atau sekadar sanksi manusia.
- source_word: ὅστις ἐὰν ᾖ
  choice: siapa pun dia
  rationale: Konstruksi relatif tak tentu dengan ἐάν menyatakan bahwa identitas atau kedudukan pengacau itu tidak mengubah pernyataan Paulus. “Siapa pun dia” ringkas dan idiomatis.
theological_decisions:
- issue: Sifat keyakinan Paulus mengenai jemaat Galatia
  choice: Paulus menyatakan keyakinan mengenai sikap mereka pada masa mendatang, dan keyakinan itu berakar di dalam Tuhan.
  alternative: Pernyataan ini merupakan jaminan tanpa syarat bahwa semua orang Galatia pasti bertahan, atau sekadar optimisme pribadi Paulus.
  rationale: Teks menggabungkan keyakinan pribadi Paulus, landasannya “di dalam Tuhan”, dan harapan mengenai pikiran mereka kelak. Terjemahan mempertahankan ketegangan ini tanpa mengubahnya menjadi determinisme ataupun optimisme manusia semata.
- issue: Cakupan makna τὸ κρίμα
  choice: Peringatan umum tentang penghakiman yang akan ditanggung si pengacau, tanpa menentukan secara khusus bentuk atau akibat akhirnya.
  alternative: Penghukuman kekal secara khusus, atau hanya konsekuensi sosial maupun disiplin jemaat.
  rationale: κρίμα dapat mencakup penghakiman, putusan, atau akibat hukuman, tetapi ayat ini tidak merinci bentuknya. “Penghakiman” mempertahankan keseriusan sekaligus keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan pronomina jamak “kalian” untuk membedakan ὑμᾶς dari bentuk tunggal. Susunan kalimat dibuat lugas dan bermartabat; istilah “penghakiman” dipertahankan demi ambiguitas asli antara tindakan menghakimi, putusan, dan akibatnya.
