base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: id
  text: Adapun orang-orang yang menjadi milik Mesias[a] telah menyalibkan daging[b] beserta nafsu dan keinginannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang menjadi milik Kristus.”
    reason: alternative_reading
  - marker: b
    text: “Daging” di sini merujuk pada natur manusia yang telah jatuh dan berlawanan dengan Roh; beberapa terjemahan menerjemahkannya “natur berdosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: Adapun orang-orang yang menjadi milik Mesias
  rationale: Konstruksi berartikel dengan genitif menyatakan orang-orang yang menjadi milik Mesias. “Adapun” membawa fungsi peralihan atau kontras ringan dari δέ tanpa memberi kesan waktu.
- source_word: σάρκα
  choice: daging
  rationale: Istilah ini mempertahankan kosakata dan ketegangan teologis Paulus. Dalam konteks ini maknanya metaforis, bukan sekadar tubuh jasmani; penjelasan diberikan dalam catatan kaki.
- source_word: ἐσταύρωσαν
  choice: telah menyalibkan
  rationale: Bentuk aoris menunjuk pada tindakan tegas yang sudah dilakukan. Kata “menyalibkan” dipertahankan karena verba Yunani secara eksplisit membangkitkan gambaran salib.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: beserta nafsu dan berbagai keinginannya
  rationale: “Beserta” menyatakan penyertaan; “nafsu” dan “berbagai keinginan” menyampaikan dorongan batin yang dalam konteks ini terkait dengan daging, tanpa mempersempitnya hanya pada hasrat seksual.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός dapat berfungsi sebagai gelar maupun sebutan yang menyerupai nama. “Mesias” mempertahankan arti gelarnya, sedangkan “Kristus” dicantumkan sebagai alternatif.
- issue: Makna σάρξ dalam pertentangan etis Paulus
  choice: daging
  alternative: natur berdosa
  rationale: “Daging” mempertahankan istilah Paulus dan tidak menyelesaikan secara diam-diam ketegangan maknanya. Tafsiran “natur berdosa” dijelaskan dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Adapun” menandai peralihan ringan; susunan kalimat dibuat alami tanpa menghilangkan metafora penyaliban dan daging.
