  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: id
  text: Namun, jika kalian saling menggigit dan melahap, berhati-hatilah supaya kalian jangan dibinasakan oleh satu sama lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: εἰ memperkenalkan syarat, sedangkan δέ memberi peralihan yang agak kontras dari nasihat sebelumnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan logisnya.
- source_word: ἀλλήλους
  choice: saling
  rationale: Pronomina resiprokal ini menunjukkan tindakan timbal balik di dalam jemaat. Dalam rangkaian verba aktif, 'saling' merupakan bentuk Indonesia yang paling alami.
- source_word: δάκνετε
  choice: menggigit
  rationale: Makna harfiahnya adalah 'menggigit'. Pilihan ini mempertahankan gambaran kebinatangan yang sengaja dipakai Paulus tanpa memaksakan nuansa aspek kala kini.
- source_word: κατεσθίετε
  choice: menelan
  rationale: Verba ini menggambarkan memakan habis atau melahap. 'Menelan' dalam pasangan 'menggigit dan menelan' mempertahankan perkembangan gambaran menuju penghancuran, dengan bahasa yang jelas dan wajar.
- source_word: βλέπετε
  choice: berhati-hatilah
  rationale: Sebagai imperatif, kata ini menyerukan kewaspadaan terhadap bahaya. 'Berhati-hatilah' alami, bermartabat, dan menyampaikan peringatan mendesak.
- source_word: μὴ
  choice: supaya ... jangan
  rationale: Dengan bentuk subjunktif berikutnya, μή memperkenalkan hasil negatif yang harus diwaspadai. 'Supaya ... jangan' mengungkapkan peringatan itu secara alami tanpa mengubahnya menjadi kepastian.
- source_word: ὑπ’ ἀλλήλων
  choice: oleh satu sama lain
  rationale: ὑπό dengan genitif menandai pelaku pada konstruksi pasif. Bentuk ini mempertahankan timbal balik dan ironi bahwa anggota jemaat dapat saling membinasakan.
- source_word: ἀναλωθῆτε
  choice: dihabisi
  rationale: Bentuk pasif ini berarti dikonsumsi sampai habis atau dibinasakan. 'Dihabisi' mempertahankan puncak metafora pemangsaan sekaligus menyampaikan akibat berupa kehancuran total.
theological_decisions:
- issue: Kekerasan metaforis di dalam komunitas orang percaya
  choice: Mempertahankan gambaran konkret 'menggigit', 'menelan', dan 'dihabisi'.
  alternative: Mengungkapkannya secara tafsiran sebagai 'saling menyakiti dan membinasakan'.
  rationale: Retorika Paulus sengaja tajam dan menggambarkan konflik internal sebagai pemangsaan yang berujung pada kehancuran bersama. Pelunakan menjadi bahasa konflik umum akan mengurangi daya peringatannya.
- issue: Kemungkinan hasil dalam klausa peringatan
  choice: Menerjemahkan μή dengan 'supaya ... jangan', yang menyatakan bahaya yang harus diwaspadai, bukan hasil yang pasti.
  alternative: Menerjemahkan seolah-olah kehancuran itu pasti terjadi.
  rationale: Konstruksi μή dengan subjunktif sesudah imperatif βλέπετε menyampaikan peringatan terhadap kemungkinan hasil. Terjemahan perlu menjaga ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak 'kalian' dipakai agar tindakan timbal balik dalam jemaat terbaca jelas. Metafora pemangsaan dipertahankan secara konkret; tidak diperlukan catatan kaki karena alternatif leksikalnya tidak menimbulkan ambiguitas penting yang harus dicatat.
