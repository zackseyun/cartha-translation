  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: id
  text: Kamu dahulu berlari dengan baik. Siapa yang menghalangi kamu untuk menaati kebenaran?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk tidak diyakinkan oleh kebenaran?” Kata kerja Yunani yang dipakai dapat berarti “menaati” atau “diyakinkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Dahulu kamu berlari
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung pada masa lampau. Kata 'berlari' mempertahankan metafora atletik Paulus tanpa menambahkan 'dalam perlombaan,' yang tidak dinyatakan secara eksplisit.
- source_word: καλῶς
  choice: dengan baik
  rationale: Adverbia ini menerangkan 'berlari'; 'dengan baik' merupakan padanan Indonesia yang alami dan jelas.
- source_word: τίς
  choice: Siapa
  rationale: Kata ganti tanya ini menanyakan pribadi atau pihak yang menyebabkan hambatan.
- source_word: ἐνέκοψεν
  choice: menghalangi
  rationale: Kata kerja ini berarti merintangi atau menghambat kemajuan dan dapat tetap menggemakan gambaran seorang pelari yang terhalang.
- source_word: τῇ ἀληθείᾳ
  choice: kebenaran
  rationale: Frasa datif ini berkaitan dengan πείθεσθαι dan menunjuk pada kebenaran yang harus ditanggapi, dalam konteks ini kebenaran Injil.
- source_word: μὴ πείθεσθαι
  choice: sehingga tidak menaati
  rationale: πείθεσθαι dapat berarti 'menaati' maupun 'diyakinkan.' Dalam konteks penyimpangan jemaat Galatia dari kebenaran Injil, 'menaati' menyampaikan tanggapan nyata terhadap kebenaran; alternatif leksikalnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna πείθεσθαι dengan τῇ ἀληθείᾳ
  choice: menaati kebenaran
  alternative: diyakinkan oleh kebenaran
  rationale: Konteks menyoroti tanggapan jemaat Galatia terhadap Injil dan penyimpangan mereka darinya. 'Menaati' mempertahankan dimensi tanggapan praktis tanpa memasukkan kerangka denominasi tertentu, sedangkan kemungkinan arti 'diyakinkan' dicatat agar ambiguitas leksikalnya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Dahulu' membuat aspek tindakan lampau yang sedang berlangsung terbaca alami; bentuk tunggal 'kamu' dalam bahasa Indonesia tetap dapat merujuk kepada seluruh jemaat sesuai konteks.
