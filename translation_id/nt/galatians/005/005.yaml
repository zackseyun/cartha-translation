  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: id
  text: Sebab melalui Roh, berdasarkan iman, kita dengan penuh kerinduan menantikan pengharapan akan kebenaran.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dalam Roh.” Bentuk datif Yunani πνεύματι dapat menyatakan sarana (“melalui Roh”) atau lingkup (“di dalam Roh”).'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dari iman.” Ungkapan Yunani ἐκ πίστεως dapat menyatakan sumber atau dasar; πίστις juga dapat, dalam konteks tertentu, berarti “kesetiaan” atau “kepercayaan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “keadilan.” Kata Yunani δικαιοσύνη dapat berarti kebenaran atau keadilan; dalam konteks Paulus di sini, “kebenaran” merupakan padanan utama.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: kita
  rationale: Pronomina orang pertama jamak ini agak ditekankan oleh posisinya. 'Kita' wajar dalam bahasa Indonesia dan mencakup Paulus beserta para pembacanya.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberi alasan atau dukungan bagi pernyataan sebelumnya dan mempertahankan alur argumentasi Paulus.
- source_word: πνεύματι
  choice: melalui Roh
  rationale: Bentuk datif dapat menyatakan sarana atau lingkup. Dalam konteks Galatia 5, rujukannya kemungkinan besar Roh Kudus; 'melalui Roh' menyampaikan peran-Nya tanpa menutup kemungkinan nuansa 'di dalam Roh'.
- source_word: ἐκ πίστεως
  choice: berdasarkan iman
  rationale: ἐκ menyatakan sumber atau dasar. 'Berdasarkan iman' terdengar alami sekaligus mempertahankan daya preposisi Yunani lebih baik daripada sekadar 'dengan iman'.
- source_word: ἐλπίδα
  choice: pengharapan
  rationale: Nomina ini menjadi objek ἀπεκδεχόμεθα. 'Pengharapan' merupakan padanan Indonesia yang wajar dalam konteks penantian eskatologis.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam pemakaian Paulus, δικαιοσύνη biasanya menunjuk status atau keadaan benar di hadapan Allah. 'Kebenaran' adalah padanan Alkitabiah Indonesia yang paling dikenal, sementara nuansa 'keadilan' dicatat dalam catatan kaki.
- source_word: ἀπεκδεχόμεθα
  choice: dengan penuh kerinduan menantikan
  rationale: Kata kerja ini menyatakan penantian yang sungguh-sungguh dan penuh harap. Ungkapan tersebut lebih alami daripada 'menantikan dengan sangat' dan lebih kuat daripada sekadar 'menunggu'.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus
  alternative: roh manusia
  rationale: Konteks Galatia 5, khususnya pertentangan Roh dengan daging dan hukum, sangat mendukung rujukan kepada Roh Kudus. Huruf kapital mencerminkan pembacaan yang paling mungkin.
- issue: Fungsi datif πνεύματι
  choice: 'sarana: ''melalui Roh'''
  alternative: 'lingkup: ''di dalam Roh'''
  rationale: Tata bahasa memungkinkan kedua nuansa. Teks utama memakai sarana yang paling wajar dalam bahasa Indonesia, sedangkan pembacaan sebagai lingkup dipertahankan dalam catatan kaki.
- issue: Makna ἐλπίδα δικαιοσύνης
  choice: '''pengharapan akan kebenaran'', dengan hubungan genitif tetap terbuka'
  alternative: '''kebenaran yang kita harapkan'' atau ''pengharapan yang dihasilkan oleh kebenaran'''
  rationale: Frasa Indonesia mempertahankan ketegangan Yunani mengenai hubungan antara pengharapan dan kebenaran tanpa menjadikannya parafrasa teologis yang terlalu khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara hubungan argumentatif, penantian yang kuat, serta ambiguitas tata bahasa dan teologis utama tetap dipertahankan melalui catatan kaki.
