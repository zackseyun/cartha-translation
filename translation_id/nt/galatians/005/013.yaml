  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: id
  text: Sebab kamu telah dipanggil kepada kemerdekaan, Saudara-saudara[a]. Hanya saja, janganlah kemerdekaan itu kamu jadikan kesempatan bagi daging[b][c]. Sebaliknya, melalui kasih, layanilah satu sama lain[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” menerjemahkan istilah Yunani berbentuk maskulin jamak yang dalam surat ini menyapa seluruh komunitas orang percaya, termasuk perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai titik tolak bagi daging”; maksudnya, sebagai kesempatan bagi keinginan berdosa yang berpusat pada diri sendiri.
    reason: lexical_alternative
  - marker: c
    text: “Daging” di sini bukan sekadar tubuh jasmani, melainkan kecenderungan manusia yang telah jatuh dalam dosa. Sebagian terjemahan menerjemahkannya sebagai “tabiat berdosa”.
    reason: alternative_reading
  - marker: d
    text: Kata yang diterjemahkan “layanilah” berkaitan dengan kata untuk “budak” atau “hamba” dan mengandung gagasan menyerahkan diri untuk melayani orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kamu
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit untuk memberi penekanan. Dalam bahasa Indonesia, “kamu” dapat merujuk kepada seluruh jemaat dan tetap alami dalam sapaan surat ini.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini memberikan dasar penjelasan bagi argumen sebelumnya; “sebab” mempertahankan hubungan logis tersebut.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: untuk merdeka
  rationale: Frasa ἐπί dengan datif di sini menyatakan tujuan atau keadaan yang menjadi arah panggilan. “Untuk merdeka” alami dalam bahasa Indonesia dan tidak mempersempit nuansanya.
- source_word: ἐκλήθητε
  choice: telah dipanggil
  rationale: Bentuk pasif aoristus καλέω dipertahankan dengan ungkapan baku “telah dipanggil” tanpa menetapkan sistem teologis tertentu mengenai sifat panggilan itu.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak maskulin ini diterjemahkan dengan sapaan Indonesia yang wajar. Dalam konteks surat, sapaan tersebut mencakup seluruh komunitas orang percaya; hal itu dijelaskan dalam catatan kaki.
- source_word: μόνον
  choice: Hanya saja
  rationale: Ungkapan ini memperkenalkan pembatasan penting terhadap pernyataan tentang kemerdekaan dan terdengar alami sebagai peralihan dalam bahasa Indonesia.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: janganlah ... kamu jadikan kesempatan
  rationale: ἀφορμή dapat berarti titik tolak, kesempatan, atau pangkalan. “Dijadikan kesempatan” menyampaikan larangan memakai kemerdekaan sebagai peluang bagi dorongan berdosa.
- source_word: σάρξ
  choice: daging
  rationale: Istilah Paulus yang sarat makna dipertahankan secara formal sebagai “daging”, bukan langsung ditafsirkan menjadi “tabiat berdosa”. Makna etisnya diterangkan dalam catatan kaki.
- source_word: διὰ τῆς ἀγάπης
  choice: melalui kasih
  rationale: “Melalui” mempertahankan nuansa perantaraan atau sarana dari διά dengan genitif, sedangkan ἀγάπη diterjemahkan secara konsisten sebagai “kasih”.
- source_word: δουλεύετε
  choice: layanilah
  rationale: Dalam nasihat timbal balik ini, “layanilah” merupakan bentuk Indonesia yang jelas dan alami. Hubungannya dengan perhambaan tetap penting secara retoris dan dijelaskan dalam catatan kaki.
- source_word: ἀλλήλοις
  choice: satu sama lain
  rationale: Ungkapan ini merupakan padanan timbal balik yang alami dan tepat untuk ἀλλήλοις.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί dalam jemaat yang terdiri dari laki-laki dan perempuan
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam konteks surat menyapa seluruh jemaat. Teks utama mempertahankan bentuk sapaan yang dekat dengan sumber, sementara cakupan inklusifnya dijelaskan dalam catatan kaki.
- issue: Makna σάρξ dalam konteks etis Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: Konteksnya menunjuk pada kecenderungan manusia yang jatuh dalam dosa, bukan sekadar tubuh jasmani. Namun, mempertahankan “daging” menjaga istilah dan ketegangan teologis Paulus tanpa mengubah terjemahan menjadi tafsiran.
- issue: Citra perhambaan dalam δουλεύετε
  choice: layanilah satu sama lain
  alternative: jadilah hamba satu sama lain
  rationale: Kata kerja ini berhubungan dengan kata untuk budak atau hamba dan membentuk kontras tajam dengan kemerdekaan. “Layanilah” lebih alami sebagai perintah dalam bahasa Indonesia, sedangkan nuansa perhambaannya dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa yang dipakai modern, jelas, dan bermartabat. Sapaan “Saudara-saudara” sesuai dengan register surat kepada jemaat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat Indonesia agar mudah dipahami, sambil mempertahankan alur sebab–pembatasan–kontras. Istilah teologis “daging” dipertahankan dan dijelaskan, bukan diparafrasakan dalam teks utama.
