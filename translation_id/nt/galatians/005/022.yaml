  source_fidelity: 'Teks Indonesia secara akurat mengikuti Yunani: δέ diberi nuansa kontras melalui “Namun,” καρπός tetap tunggal sebagai “buah,” dan seluruh daftar kebajikan diterjemahkan tanpa penambahan atau pengurangan. Koma akhir tepat dipertahankan karena daftar berlanjut ke ayat 23.'
