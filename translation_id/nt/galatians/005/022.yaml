id: GAL.5.22
reference: Galatians 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: id
  text: Namun, buah Roh adalah kasih, sukacita, damai, kesabaran, kemurahan, kebaikan, iman[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan.” Kata Yunani pistis dapat berarti iman, kepercayaan, atau kesetiaan. Dalam daftar sifat ini, “kesetiaan” juga mungkin dimaksudkan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan daftar perbuatan daging dalam ayat 19–21 secara wajar dalam bahasa Indonesia.
- source_word: καρπὸς
  choice: buah
  rationale: Mempertahankan metafora Paulus dan bentuk tunggalnya, yang menyajikan semua sifat ini sebagai satu hasil karya Roh.
- source_word: τοῦ πνεύματός
  choice: Roh
  rationale: Konteks Galatia 5 menunjuk kepada Roh Kudus; huruf kapital memperjelas rujukan tersebut tanpa menambahkan kata yang tidak ada dalam teks Yunani.
- source_word: ἀγάπη
  choice: kasih
  rationale: Padanan baku dan alami untuk kasih yang menjadi kebajikan Kristen.
- source_word: χαρά
  choice: sukacita
  rationale: Padanan ringkas dan bermartabat yang lazim dipahami dalam konteks daftar kebajikan.
- source_word: εἰρήνη
  choice: damai
  rationale: Mempertahankan keluasan makna yang dapat mencakup kedamaian batin maupun hubungan yang rukun, tanpa mempersempitnya.
- source_word: μακροθυμία
  choice: kesabaran
  rationale: Ungkapan Indonesia modern yang jelas untuk ketabahan dan kesediaan menanggung keadaan atau orang lain dalam waktu lama.
- source_word: χρηστότης
  choice: kemurahan
  rationale: Padanan yang lazim dalam bahasa Alkitab Indonesia untuk kebaikan yang nyata dalam sikap terhadap orang lain; dipertahankan berbeda dari ἀγαθωσύνη.
- source_word: ἀγαθωσύνη
  choice: kebaikan
  rationale: Menyatakan mutu moral yang baik secara luas dan membedakannya dari kemurahan terhadap sesama.
- source_word: πίστις
  choice: iman
  rationale: Πίστις dapat berarti iman, kepercayaan, atau kesetiaan. 'Iman' mempertahankan padanan dasar istilah itu, sementara makna 'kesetiaan' yang sangat mungkin dalam daftar kebajikan dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: Roh Kudus, dinyatakan sebagai 'Roh'
  alternative: roh manusia
  rationale: Pertentangan langsung dengan daging dalam Galatia 5 dan argumen Paulus yang lebih luas mendukung rujukan kepada Roh Kudus yang berkarya dalam orang percaya.
- issue: Makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan
  rationale: Kedua makna didukung secara leksikal. Teks utama memakai padanan dasar 'iman', tetapi tidak meniadakan kemungkinan bahwa dalam daftar sifat ini Paulus menekankan sifat dapat dipercaya atau setia.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk tunggal 'buah' dipertahankan. Tanda koma penutup dipertahankan karena kalimat dan daftar berlanjut ke ayat 23.
