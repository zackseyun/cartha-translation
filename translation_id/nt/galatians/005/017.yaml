id: GAL.5.17
reference: Galatians 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: id
  text: Sebab daging[a] menginginkan apa yang berlawanan dengan Roh[b], dan Roh menginginkan apa yang berlawanan dengan daging. Keduanya saling bertentangan, sehingga kamu tidak melakukan apa yang kamu kehendaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabiat berdosa”; kata Yunani sarx (“daging”) di sini dipakai Paulus dalam arti etis yang lebih luas daripada tubuh jasmani semata.
    reason: lexical_alternative
  - marker: b
    text: Atau “roh” jika yang dimaksud adalah roh manusia, bukan Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: daging
  rationale: Mempertahankan metafora khas Paulus dan tidak mempersempit maknanya menjadi tubuh jasmani semata atau langsung menafsirkannya sebagai tabiat berdosa.
- source_word: ἐπιθυμεῖ
  choice: keinginan ... berlawanan dengan
  rationale: Kata kerja ini menyatakan hasrat atau dorongan; konstruksi κατά dengan genitif memberi arah pertentangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks Galatia 5 paling mungkin menunjuk kepada Roh Kudus, sebagaimana tampak dari seruan untuk hidup dan dipimpin oleh Roh dalam ayat-ayat sekitarnya.
- source_word: ἀλλήλοις ἀντίκειται
  choice: saling bertentangan
  rationale: Menyampaikan oposisi timbal balik secara ringkas dan wajar.
- source_word: ἵνα μὴ
  choice: sehingga ... tidak
  rationale: Mempertahankan kemungkinan nuansa akibat atau tujuan dari pertentangan tersebut tanpa memaksakan penjelasan yang lebih khusus.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: kamu tidak melakukan apa yang kamu kehendaki
  rationale: Menyampaikan konstruksi relatif tak tentu dan verba ποιέω secara jelas, tanpa menambahkan nuansa kebiasaan yang tidak dinyatakan.
theological_decisions:
- issue: Makna σάρξ dalam konteks etis Paulus
  choice: daging
  alternative: tabiat berdosa
  rationale: “Daging” mempertahankan kosakata dan metafora Paulus serta ketegangan antropologis ayat ini. “Tabiat berdosa” merupakan penafsiran yang mungkin, tetapi lebih sempit daripada cakupan istilah Yunani.
- issue: Rujukan πνεῦμα
  choice: Roh, yakni Roh Kudus
  alternative: roh manusia
  rationale: Konteks langsung Galatia 5 berulang kali berbicara tentang hidup, dipimpin, dan berjalan oleh Roh, sehingga rujukan kepada Roh Kudus paling kuat; catatan kaki tetap mengakui kemungkinan pembacaan lain.
- issue: Daya ἵνα μὴ dan akibat konflik
  choice: sehingga kamu tidak melakukan apa yang kamu kehendaki
  alternative: supaya kamu tidak melakukan apa yang kamu kehendaki
  rationale: “Sehingga” mengungkapkan akibat praktis konflik itu dan menghindari kesan bahwa tujuan Roh dan daging secara bersama-sama ialah menghalangi manusia. Namun, konstruksi Yunani dapat membawa nuansa tujuan/hasil.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Struktur paralel dipertahankan. Istilah “daging” sengaja dipakai sebagai metafora Paulus; kapitalisasi “Roh” menandai rujukan yang paling mungkin kepada Roh Kudus.
