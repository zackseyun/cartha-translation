id: GAL.5.23
reference: Galatians 5:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: id
  text: kelemahlembutan, penguasaan diri; tidak ada hukum yang menentang hal-hal seperti itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ada hukum yang menentang orang-orang seperti itu.” Namun, frasa ini kemungkinan besar merujuk pada sifat-sifat yang disebutkan, bukan pada orang-orang yang memperlihatkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: kelemahlembutan
  rationale: Dalam daftar kebajikan ini, kata tersebut menunjuk pada sikap lembut, rendah hati, dan tidak kasar. “Kelemahlembutan” merupakan istilah Indonesia yang lazim dan bermartabat untuk sifat ini.
- source_word: ἐγκράτεια
  choice: penguasaan diri
  rationale: Kata ini menyatakan kemampuan mengendalikan keinginan dan dorongan diri. “Penguasaan diri” jelas dan alami dalam bahasa Indonesia modern.
- source_word: κατὰ τῶν τοιούτων
  choice: yang menentang hal-hal seperti itu
  rationale: Bentuk τοιούτων dapat merujuk pada hal-hal atau orang-orang. Dalam konteks ini, rujukan paling mungkin ialah sifat-sifat yang baru saja disebutkan, tetapi ambiguitasnya dicatat dalam catatan kaki.
- source_word: νόμος
  choice: hukum
  rationale: Karena νόμος tidak memakai kata sandang, “hukum” mempertahankan cakupan umum pernyataan Yunani tanpa membatasinya secara eksplisit pada Hukum Musa.
theological_decisions:
- issue: Cakupan νόμος dalam pernyataan Paulus
  choice: “hukum” dalam arti luas
  alternative: “Hukum Taurat” sebagai rujukan khusus kepada Hukum Musa
  rationale: 'Konteks Galatia melibatkan Hukum Musa, tetapi bentuk tanpa kata sandang mendukung pernyataan yang bersifat umum: tidak ada hukum yang menentang kebajikan-kebajikan tersebut. Terjemahan ini tidak meniadakan latar Hukum Musa.'
- issue: Rujukan τῶν τοιούτων
  choice: sifat-sifat yang telah disebutkan
  alternative: orang-orang yang memperlihatkan sifat-sifat tersebut
  rationale: Dalam daftar buah Roh, frasa ini paling wajar menunjuk kembali kepada sifat-sifat itu, meskipun bentuk Yunani juga memungkinkan rujukan kepada orang-orang.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan mempertahankan bentuk lanjutan daftar dari ayat sebelumnya serta pernyataan penutup yang bersifat aforistis.
