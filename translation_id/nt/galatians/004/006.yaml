source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: id
  text: Dan karena kalian adalah putra-putra[a], Allah mengutus Roh Anak-Nya ke dalam hati kita[b], yang berseru, “Abba[c], Bapa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra.” Dalam rangkaian pemikiran ini, istilah tersebut menekankan status sebagai ahli waris; status itu mencakup semua orang percaya, bukan hanya laki-laki.
    reason: cultural_note
  - marker: b
    text: Sejumlah naskah membaca “hati kalian” sebagai ganti “hati kita.”
    reason: textual_variant
  - marker: c
    text: Abba adalah sapaan bahasa Aram yang berarti “Bapa”; bentuk aslinya dipertahankan dalam teks Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Dan karena
  rationale: ὅτι menyatakan alasan atau dasar, sedangkan δέ memberi hubungan ringan dengan uraian sebelumnya; “Dan karena” mempertahankan keduanya secara alami.
- source_word: ἐστε
  choice: kalian adalah
  rationale: Bentuk kini indikatif εἰμί menyatakan status para pembaca pada saat ini; “kalian” memperjelas bahwa kata ganti Yunani berbentuk jamak.
- source_word: υἱοί
  choice: anak-anak laki-laki
  rationale: υἱοί secara leksikal berarti “anak-anak laki-laki/putra-putra” dan dalam konteks Galatia 3–4 berkaitan dengan status hukum sebagai ahli waris. Pilihan ini mempertahankan metafora keputraan Paulus, sementara catatan menjelaskan cakupannya bagi semua orang percaya.
- source_word: ἐξαπέστειλεν
  choice: telah mengutus
  rationale: Aoristus menunjuk pada tindakan Allah yang terlaksana; “mengutus” merupakan padanan wajar bagi tindakan pengiriman dengan tugas atau tujuan tertentu.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Roh Anak-Nya
  rationale: Ungkapan ini mempertahankan hubungan genitif dan bobot teologis frasa Yunani tanpa menentukannya lebih jauh.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: ke dalam hati kita
  rationale: Padanan langsung dan alami yang mempertahankan istilah antropologis “hati”; teks SBLGNT yang diberikan membaca ἡμῶν, “kita/kami”.
- source_word: κρᾶζον
  choice: yang berseru
  rationale: Partisipel netral tunggal ini selaras dengan πνεῦμα, sehingga Roh secara gramatikal adalah pihak yang berseru. Klausa relatif lebih alami dalam bahasa Indonesia daripada partisipel harfiah.
- source_word: Αββα
  choice: Abba
  rationale: Bentuk sapaan bahasa Aram yang dipertahankan dalam teks Yunani juga ditransliterasikan agar penekanan aslinya tetap terasa.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Walaupun berbentuk dengan artikel dalam bahasa Yunani, frasa ini berfungsi sebagai sapaan yang menjelaskan “Abba”; “Bapa” alami dalam bahasa Indonesia dan mempertahankan corak relasionalnya.
theological_decisions:
- issue: Penerjemahan υἱοί dalam konteks pengangkatan dan warisan
  choice: anak-anak laki-laki
  alternative: anak-anak
  rationale: Argumen Paulus berpusat pada status anak laki-laki yang menerima warisan menurut kerangka hukum dan sosial zamannya. Terjemahan utama mempertahankan metafora itu, sedangkan catatan menegaskan bahwa cakupannya tidak dibatasi pada laki-laki.
- issue: Varian tekstual pada kata ganti yang menerangkan “hati”
  choice: hati kita
  alternative: hati kalian
  rationale: SBLGNT yang disediakan membaca ἡμῶν (“kita/kami”), sehingga bacaan itu diikuti dalam teks utama. Varian ὑμῶν (“kalian”) dicatat demi transparansi.
- issue: Pihak yang berseru
  choice: Roh Anak-Nya yang berseru
  alternative: orang percaya berseru melalui Roh
  rationale: κρᾶζον secara gramatikal bersesuaian dengan τὸ πνεῦμα, sehingga Roh adalah subjek eksplisit seruan itu. Implikasi bahwa orang percaya menyapa Bapa melalui Roh tidak disangkal, tetapi tidak menggantikan struktur klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas, sementara “kita” mengikuti ἡμῶν dan mencakup penulis bersama para pembaca. Kapitalisasi “Roh,” “Anak,” dan “Bapa” mengikuti pemakaian religius Indonesia yang lazim. Tanda seru mencerminkan daya seruan κρᾶζον.
