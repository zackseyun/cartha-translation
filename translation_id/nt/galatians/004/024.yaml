id: GAL.4.24
reference: Galatians 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: id
  text: 'Hal-hal ini ditafsirkan secara alegoris[a], sebab kedua perempuan ini adalah dua perjanjian: yang satu berasal dari Gunung Sinai dan melahirkan anak-anak ke dalam perbudakan[b]; dialah Hagar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibicarakan secara alegoris” atau “merupakan suatu alegori.” Ungkapan Yunani menunjukkan bahwa Paulus menggunakan kisah sebelumnya secara alegoris.
    reason: lexical_alternative
  - marker: b
    text: Atau, “untuk perbudakan” atau “ke dalam keadaan perhambaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Hal-hal ini
  rationale: Merujuk kembali kepada kisah tentang Hagar dan Sara yang baru dibicarakan, sambil mempertahankan bentuk jamak netral.
- source_word: ἀλληγορούμενα
  choice: ditafsirkan secara alegoris
  rationale: Mencerminkan bentuk pasif perifrastis dan menunjukkan cara Paulus menggunakan atau menafsirkan kisah tersebut, tanpa menyangkal sifat historis tokoh-tokohnya.
- source_word: αὗται
  choice: kedua perempuan ini
  rationale: Demonstrativa feminin jamak menunjuk kepada dua perempuan yang dibicarakan sebelumnya; 'kedua' wajar karena teks langsung menyebut dua perjanjian.
- source_word: διαθῆκαι
  choice: perjanjian
  rationale: Istilah baku dan tepat untuk διαθήκη dalam konteks Sinai dan sejarah keselamatan.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: Yang satu berasal dari Gunung Sinai
  rationale: Menyampaikan sumber perjanjian pertama dan tetap membuka kontras μέν yang berlanjut pada ayat berikutnya.
- source_word: γεννῶσα
  choice: melahirkan anak-anak
  rationale: Mempertahankan gambaran keibuan yang menghubungkan perjanjian itu dengan Hagar.
- source_word: εἰς δουλείαν
  choice: untuk menjadi hamba
  rationale: Menyampaikan arah atau hasil kelahiran menuju keadaan perhambaan dalam bahasa Indonesia yang alami.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: dialah Hagar
  rationale: Mempertahankan identifikasi feminin dan alegoris secara ringkas dan alami.
theological_decisions:
- issue: Sifat penggunaan kisah Hagar dan Sara oleh Paulus
  choice: ditafsirkan secara alegoris
  alternative: merupakan suatu alegori
  rationale: Pilihan ini menampilkan modus penafsiran atau penggunaan retoris Paulus tanpa menyatakan bahwa kisah itu tidak historis.
- issue: Makna δουλεία
  choice: keadaan perhambaan, diungkapkan sebagai 'menjadi hamba'
  alternative: perbudakan atau keterikatan
  rationale: Konteks menekankan status tunduk yang tidak merdeka; ungkapan ini mempertahankan kekuatan istilah sekaligus terdengar alami dalam hubungan dengan 'melahirkan anak-anak'.
- issue: Hubungan kedua perempuan dengan dua perjanjian
  choice: melambangkan dua perjanjian
  alternative: adalah dua perjanjian
  rationale: Bahasa lambang menjelaskan identifikasi alegoris tanpa mencampuradukkan perempuan historis dengan perjanjian secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah 'alegoris' dipertahankan karena tepat secara teknis dan dijelaskan dalam catatan kaki; struktur kalimat dipecah agar hubungan antargagasan jelas.
