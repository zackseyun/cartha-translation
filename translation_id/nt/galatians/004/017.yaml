revisions:
- from: Mereka menunjukkan perhatian yang besar kepada kalian[a], tetapi bukan dengan niat yang baik. Sebaliknya, mereka ingin menyingkirkan kalian[b], supaya kalian menunjukkan perhatian yang besar kepada mereka.
  to: Mereka menaruh minat besar kepada kalian[a], tetapi bukan dengan cara yang baik. Sebaliknya, mereka ingin mengucilkan kalian[b], supaya kalian menaruh minat besar kepada mereka.
  rationale: Revisi memperkuat padanan bagi ζηλόω, memperluas kembali penilaian οὐ καλῶς agar tidak dibatasi pada niat, dan memakai “mengucilkan” sebagai padanan yang lebih tepat bagi ἐκκλεῖσαι. Bentuk jamak “kalian,” kontras ἀλλά, tujuan ἵνα, dan ambiguitas mengenai apa yang menjadi lingkungan eksklusi tetap dipertahankan. Catatan kaki tetap ditambatkan pada unsur yang relevan dan tidak menjadikan pembacaan kontekstual sebagai isi teks utama.
  reviewer_model: gpt-5.6-terra
