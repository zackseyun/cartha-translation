  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: id
  text: Mereka menaruh minat besar kepada kalian[a], tetapi bukan dengan cara yang baik. Sebaliknya, mereka ingin mengucilkan kalian[b], supaya kalian menaruh minat besar kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sangat menginginkan kalian” atau “berusaha merebut hati kalian.” Kata Yunani yang dipakai dapat menyatakan minat atau hasrat yang kuat.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengecualikan kalian.” Kemungkinan besar maksudnya ialah memisahkan kalian dari Paulus dan rekan-rekannya agar kalian beralih mencari perhatian mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν ... ζηλοῦτε (ζηλόω)
  choice: menunjukkan perhatian yang besar ... menunjukkan perhatian yang besar
  rationale: Kata kerja ini dapat menyatakan minat atau hasrat yang kuat, bahkan usaha merebut perhatian. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kesejajaran retoris kedua pemakaiannya tanpa memberi kesan romantis atau menganggap semangat itu pada dirinya selalu baik.
- source_word: οὐ καλῶς
  choice: bukan dengan niat yang baik
  rationale: Dalam konteks ini, frasa tersebut menilai perhatian para penghasut sebagai tidak baik dalam maksud atau caranya. Pilihan ini sesuai dengan klausa berikut yang menyingkapkan tujuan manipulatif mereka.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai kontras kuat dan memperkenalkan penjelasan mengenai maksud mereka yang sebenarnya.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: menyingkirkan kalian
  rationale: Kata ἐκκλείω berarti menutup di luar atau mengecualikan. 'Menyingkirkan kalian' mempertahankan nuansa relasional tanpa menetapkan secara eksplisit dari siapa atau dari apa mereka hendak dipisahkan.
- source_word: θέλουσιν
  choice: mereka ingin
  rationale: Padanan modern dan langsung bagi kata kerja yang menyatakan kehendak.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan tindakan mereka secara alami dalam bahasa Indonesia.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina orang kedua jamak dinyatakan secara eksplisit agar jumlahnya jelas dalam bahasa Indonesia.
- source_word: αὐτούς
  choice: mereka
  rationale: Mengacu kepada pihak yang sedang Paulus kritik, tanpa menambahkan identifikasi yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Sasaran tindakan ἐκκλεῖσαι yang tidak disebutkan
  choice: 'Membiarkan objek pemisahan tidak dinyatakan: ''menyingkirkan kalian.'''
  alternative: Menjelaskan bahwa mereka hendak memisahkan jemaat Galatia dari Paulus dan rekan-rekannya, atau mengecualikan mereka dari berkat Allah maupun jemaat.
  rationale: Konteks mendukung usaha mengalihkan kesetiaan jemaat dari Paulus kepada para penghasut, tetapi teks ayat ini tidak menyebutkan secara eksplisit dari siapa atau dari apa mereka hendak disingkirkan. Terjemahan utama mempertahankan ketaktertentuan itu, sedangkan catatan kaki menerangkan kemungkinan kontekstualnya.
- issue: Nuansa ζηλόω dalam kedua klausa
  choice: Memakai ungkapan netral 'menunjukkan perhatian yang besar' pada kedua tempat.
  alternative: Memakai 'bersemangat terhadap,' 'sangat menginginkan,' atau 'merebut hati.'
  rationale: Pemakaian yang sama mempertahankan permainan kata dan simetri ayat. Ungkapan netral memungkinkan klausa 'bukan dengan niat yang baik' menilai motif mereka, tanpa memasukkan nuansa romantis atau doktrinal yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang lugas dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς dengan jelas. Pengulangan 'menunjukkan perhatian yang besar' sengaja dipertahankan untuk mencerminkan pengulangan ζηλόω.
