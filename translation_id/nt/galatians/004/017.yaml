review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan draf menangkap struktur kontras dan tujuan dalam ayat ini serta mempertahankan pengulangan ζηλόω. Namun, “menunjukkan perhatian yang besar” agak melemahkan unsur minat/hasrat yang sungguh-sungguh dalam ζηλόω, sedangkan “bukan dengan niat yang baik” membatasi οὐ καλῶς pada motif, padahal frasa Yunani itu lebih luas: tindakan mereka tidak baik/tidak patut. “Menyingkirkan” juga kurang tepat daripada ἐκκλεῖσαι, yang terutama berarti mengecualikan atau mengucilkan.'
  naturalness: “Menaruh minat besar kepada” adalah ungkapan baku dan alami dalam bahasa Indonesia modern. Pengulangannya mempertahankan simetri retoris kata kerja Yunani tanpa memberi nuansa romantis yang berlebihan. “Mengucilkan kalian” menyampaikan tindakan eksklusi secara jelas, sementara objek atau lingkungan dari mana mereka hendak dikeluarkan tetap tidak disebutkan, seperti dalam teks sumber.
  terminology: Tidak ada istilah teologis teknis dalam ayat ini. “Mengucilkan” lebih setia daripada “menyingkirkan” bagi ἐκκλεῖσαι. Catatan kaki menjelaskan pembacaan kontekstual—pemisahan dari Paulus dan rekan-rekannya—sebagai kemungkinan, bukan kepastian yang dimasukkan ke dalam teks utama.
