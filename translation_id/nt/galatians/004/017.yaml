    issue: “Menunjukkan perhatian yang besar” melemahkan ζηλόω.
    rationale: ζηλόω menyatakan minat, hasrat, atau usaha memperoleh yang kuat. “Menaruh minat besar” lebih dekat kepada daya semantis ini dan tetap dapat dipakai secara paralel dalam kedua klausa.
  - severity: low
    issue: “Bukan dengan niat yang baik” terlalu menyempitkan οὐ καλῶς.
    rationale: οὐ καλῶς menilai tindakan mereka secara umum sebagai tidak baik atau tidak patut, bukan semata-mata niat batin mereka. “Bukan dengan cara yang baik” menjaga keluasan itu.
  - severity: medium
    issue: “Menyingkirkan kalian” tidak secara cukup jelas menyatakan eksklusi dalam ἐκκλεῖσαι.
    rationale: Kata itu dapat berarti menyingkirkan dalam arti menghapuskan atau menjauhkan. “Mengucilkan kalian” lebih langsung menyatakan ‘menutup di luar/mengecualikan’ sambil tidak menentukan dari kelompok atau relasi mana.
