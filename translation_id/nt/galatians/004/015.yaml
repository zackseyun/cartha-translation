  to: Jadi, di manakah kebahagiaanmu itu?[a] Sebab aku bersaksi kepadamu bahwa, sekiranya mungkin, kalian tentu telah mencungkil mata kalian[b] dan memberikannya kepadaku.
  rationale: 'Revisi terbatas pada ketepatan sintaksis dan kekuatan pernyataan: μαρτυρῶ γὰρ ὑμῖν diterjemahkan “aku bersaksi kepadamu,” bukan “aku dapat bersaksi tentang kamu.” Pengandaian kontekstual yang berlawanan dengan kenyataan, serta citra harfiah dan keras tentang mata, dipertahankan. Catatan kaki tetap membuka semua kemungkinan penafsiran yang relevan tanpa menetapkannya.'
