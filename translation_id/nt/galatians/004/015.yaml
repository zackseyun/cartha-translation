  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: id
  text: Jadi, di manakah kebahagiaanmu itu?[a] Sebab aku bersaksi kepadamu bahwa, sekiranya mungkin, kalian tentu telah mencungkil mata kalian[b] dan memberikannya kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai dapat berarti keadaan berbahagia atau diberkati, maupun pengakuan bahwa seseorang berbahagia atau diberkati.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setelah mencungkil mata kalian.” Ungkapan ini kemungkinan merupakan hiperbola tentang pengabdian mereka dahulu, meskipun sebagian orang melihatnya sebagai petunjuk tentang kondisi jasmani Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Jadi, di manakah
  rationale: Mempertahankan bentuk pertanyaan retoris dan daya inferensial οὖν dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: μακαρισμὸς ὑμῶν
  choice: kebahagiaanmu
  rationale: μακαρισμός dapat menunjuk pada keadaan atau pengakuan sebagai orang yang diberkati. 'Kebahagiaanmu' cukup alami dan tetap membuka nuansa tersebut, dengan alternatif dijelaskan dalam catatan kaki.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Sebab aku dapat bersaksi tentang kamu
  rationale: Ungkapan ini menyampaikan kesaksian Paulus mengenai sikap orang Galatia dahulu. 'Dapat bersaksi' terdengar alami dalam bahasa Indonesia dan mempertahankan nada penegasan.
- source_word: εἰ δυνατὸν
  choice: sekiranya mungkin
  rationale: Menerjemahkan ungkapan bersyarat yang ringkas tanpa menjelaskan secara berlebihan sifatnya yang secara konteks tidak terlaksana.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: kamu tentu sudah mencungkil matamu
  rationale: Mempertahankan gambaran konkret dan keras dari ἐξορύσσω. Kata 'tentu sudah' menyampaikan akibat hipotesis lampau secara alami.
- source_word: ἐδώκατέ μοι
  choice: dan memberikannya kepadaku
  rationale: Pronomina '-nya' merujuk dengan jelas kepada mata dan menghasilkan susunan Indonesia yang alami.
theological_decisions:
- issue: Apakah gambaran mencungkil mata harus dipahami sebagai hiperbola pengabdian atau petunjuk tentang kondisi jasmani Paulus
  choice: Mempertahankan gambaran harfiah 'mencungkil matamu' dalam teks utama
  alternative: Menggeneralisasikannya menjadi 'kamu pasti akan memberikan apa saja kepadaku' atau menafsirkannya sebagai bukti penyakit mata Paulus
  rationale: Teks Yunani secara eksplisit menyebut mata dan memakai kata kerja yang kuat. Terjemahan tidak menetapkan apakah ungkapan itu semata-mata hiperbola atau juga menyinggung kondisi jasmani Paulus.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Pertanyaan retoris serta gambaran mata yang tajam dipertahankan; bentuk bersyarat dibuat alami tanpa menutup kemungkinan penafsiran.
