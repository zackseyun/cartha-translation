  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: id
  text: 'Sebab ada tertulis bahwa Abraham mempunyai dua anak laki-laki: yang seorang dari hamba perempuan dan yang seorang lagi dari perempuan merdeka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku dalam bahasa Indonesia untuk formula pasif perfektif yang memperkenalkan kesaksian Kitab Suci dan mempertahankan nuansa bahwa tulisan itu tetap berlaku.
- source_word: γὰρ
  choice: sebab
  rationale: Menjaga fungsi penghubung yang memberikan dasar bagi argumen sebelumnya.
- source_word: ὅτι
  choice: bahwa
  rationale: Secara alami memperkenalkan isi dari apa yang tertulis.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: δύο υἱοὺς
  choice: dua anak laki-laki
  rationale: υἱούς secara khusus menunjuk kepada anak laki-laki; pilihan ini akurat dan mudah dipahami.
- source_word: ἔσχεν
  choice: mempunyai
  rationale: Menyampaikan arti kepemilikan atau hubungan keluarga secara alami tanpa menambahkan penafsiran seperti 'memperanakkan'.
- source_word: ἕνα ... καὶ ἕνα
  choice: yang seorang ... dan yang seorang lagi
  rationale: Mempertahankan susunan paralel dan kontras berimbang dalam bahasa Indonesia yang wajar.
- source_word: ἐκ
  choice: dari
  rationale: Dalam konteks asal-usul atau keibuan, 'dari' mempertahankan citra sumber pada teks Yunani dan terdengar alami.
- source_word: παιδίσκης
  choice: perempuan hamba
  rationale: Menunjukkan seorang perempuan berstatus hamba dan membuat kontras perhambaan-kemerdekaan dalam argumen Paulus tetap jelas, tanpa memakai istilah yang berkonotasi usia muda.
- source_word: ἐλευθέρας
  choice: perempuan merdeka
  rationale: Adjektiva substantival ini menunjuk kepada perempuan yang bebas secara status; 'merdeka' menghasilkan kontras langsung dengan 'hamba'.
theological_decisions:
- issue: Kontras status sosial yang mendasari alegori Paulus
  choice: perempuan hamba / perempuan merdeka
  alternative: hamba perempuan / perempuan bebas
  rationale: Pasangan ini mempertahankan pertentangan antara perhambaan dan kemerdekaan yang menjadi pusat argumen konteks sekitar, tanpa menambahkan identitas atau rincian yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dipertahankan tanpa kekakuan; 'anak laki-laki' dipilih demi ketepatan gender, sedangkan 'perempuan hamba' dan 'perempuan merdeka' menonjolkan kontras status yang eksplisit dalam teks.
