id: GAL.4.7
reference: Galatians 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: id
  text: Jadi, kamu bukan lagi budak, melainkan anak laki-laki[a]. Jika kamu anak laki-laki, kamu juga ahli waris melalui Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "anak". Yunani memakai kata "anak laki-laki", yang mempertahankan alur pemikiran tentang pengangkatan sebagai anak dan hak waris dalam bagian ini, meskipun Paulus menerapkan status tersebut kepada semua orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi "ahli waris Allah melalui Kristus" (atau "melalui Mesias"), bukan "ahli waris melalui Allah".
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan logis dari uraian sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: οὐκέτι εἶ
  choice: kamu bukan lagi
  rationale: Mempertahankan sapaan orang kedua tunggal dan perubahan status yang dinyatakan oleh οὐκέτι.
- source_word: δοῦλος
  choice: budak
  rationale: Menunjukkan status perhambaan secara lebih tepat daripada 'pelayan' dan mempertahankan kontras dengan status anak serta ahli waris.
- source_word: ἀλλὰ υἱός
  choice: melainkan anak laki-laki
  rationale: Mempertahankan istilah υἱός dalam alur pengangkatan dan pewarisan; dalam konteks ini status tersebut berlaku bagi semua orang percaya.
- source_word: εἰ δὲ υἱός
  choice: Jika kamu anak laki-laki
  rationale: Mengungkapkan tahap lanjutan argumen secara alami; subjek 'kamu' diulangi agar jelas dalam bahasa Indonesia.
- source_word: καὶ κληρονόμος
  choice: kamu juga ahli waris
  rationale: '''Ahli waris'' adalah padanan baku bagi penerima warisan, sedangkan ''juga'' mempertahankan daya tambah καί.'
- source_word: διὰ θεοῦ
  choice: melalui Allah
  rationale: Menerjemahkan bacaan SBLGNT secara langsung dan mempertahankan nilai perantaraan dari διά dengan genitif.
theological_decisions:
- issue: Bahasa filial bergender dalam υἱός
  choice: anak laki-laki
  alternative: anak
  rationale: Bentuk maskulin tunggal mendukung logika status anak lelaki sebagai ahli waris dalam dunia Paulus. Catatan menjelaskan bahwa status ini tidak dibatasi pada orang percaya laki-laki.
- issue: Bacaan tekstual pada akhir ayat
  choice: ahli waris melalui Allah
  alternative: ahli waris Allah melalui Kristus/Mesias
  rationale: Teks utama mengikuti SBLGNT, διὰ θεοῦ, sementara bacaan naskah lain yang penting dicatat tanpa dimasukkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'kamu' mempertahankan bentuk εἶ. 'Budak' dipilih untuk menegaskan perubahan status, sedangkan struktur kalimat dibuat alami tanpa menghilangkan urutan argumen Yunani.
