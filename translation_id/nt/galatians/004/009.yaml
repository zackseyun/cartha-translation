  to: Namun sekarang, setelah mengenal Allah—atau lebih tepat, setelah dikenal oleh Allah—bagaimana mungkin kalian berbalik lagi kepada unsur-unsur dasar yang lemah dan miskin[a], yang kepadanya kalian ingin menjadi budak lagi dari awal?
  rationale: Revisi terbatas pada klausa terakhir untuk membetulkan arah relasi yang ditandai datif οἷς dan mempertahankan daya δουλεύειν sebagai "menjadi budak". "Lagi dari awal" tetap menerjemahkan penegasan πάλιν ἄνωθεν tanpa menghilangkan pengulangan yang sudah hadir dalam "berbalik lagi".
