id: GAL.4.9
reference: Galatians 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: id
  text: Namun sekarang, setelah mengenal Allah—atau lebih tepat, setelah dikenal oleh Allah—bagaimana mungkin kalian berbalik lagi kepada unsur-unsur dasar yang lemah dan miskin[a], yang kepadanya kalian ingin menjadi budak lagi dari awal?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-roh unsur”, “asas-asas dasar”, atau “hal-hal mendasar” untuk στοιχεῖα.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες θεόν
  choice: setelah mengenal Allah
  rationale: Partisip aoris dipahami secara ingresif dan diungkapkan secara alami dalam bahasa Indonesia, sambil mempertahankan hubungan waktunya dengan verba utama.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: atau lebih tepat, setelah dikenal oleh Allah
  rationale: Ungkapan ini mengoreksi dan memperdalam pernyataan sebelumnya; bentuk pasif dipertahankan agar prakarsa Allah tetap tampak tanpa menambahkan sistem teologis tertentu.
- source_word: πῶς
  choice: bagaimana mungkin
  rationale: Menyampaikan nada heran dan teguran dalam pertanyaan retoris Paulus.
- source_word: ἐπιστρέφετε πάλιν
  choice: kalian berbalik lagi
  rationale: Mempertahankan gagasan pembalikan arah dan pengulangan, dengan bentuk yang alami dalam bahasa Indonesia modern.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: unsur-unsur dasar yang lemah dan miskin
  rationale: στοιχεῖα memiliki rentang makna yang diperdebatkan; 'unsur-unsur dasar' cukup terbuka, sedangkan 'lemah dan miskin' mempertahankan kedua sifat evaluatifnya.
- source_word: πάλιν ἄνωθεν
  choice: lagi dari awal
  rationale: Gabungan kedua adverbia menekankan pengulangan yang dimulai kembali, bukan sekadar tindakan sekali lagi.
- source_word: δουλεύειν θέλετε
  choice: ingin kalian perhamba
  rationale: Mempertahankan unsur kehendak dalam θέλετε dan citra perbudakan yang kuat dalam δουλεύειν.
theological_decisions:
- issue: Makna στοιχεῖα dalam Galatia 4:9
  choice: unsur-unsur dasar
  alternative: roh-roh unsur; asas-asas dasar; hal-hal mendasar
  rationale: Istilah ini dapat menunjuk pada unsur atau asas mendasar maupun kuasa kosmis. Teks utama tidak memaksakan salah satu penafsiran, dan catatan kaki menyajikan alternatif penting.
- issue: Daya ungkapan 'dikenal oleh Allah'
  choice: dipertahankan sebagai koreksi yang menonjolkan tindakan Allah
  alternative: sekadar penekanan relasional tanpa implikasi prakarsa ilahi
  rationale: μᾶλλον δέ menandai koreksi nyata terhadap 'mengenal Allah'; bentuk pasif dipertahankan tanpa memasukkan kesimpulan doktrinal yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk memperjelas bentuk orang kedua jamak. Nada teguran retoris dan citra perbudakan dipertahankan. Tanda pisah menandai koreksi Paulus secara jelas.
