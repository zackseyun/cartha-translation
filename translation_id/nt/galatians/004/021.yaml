  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: id
  text: Katakan kepada saya, kamu yang ingin berada di bawah hukum, tidakkah kamu mendengarkan hukum itu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidakkah kamu mendengar hukum itu?” Kata kerja Yunani yang dipakai dapat berarti “mendengar” atau “mendengarkan”. Di sini “hukum” kemungkinan merujuk pada hukum Musa, khususnya kisah dalam Kitab Suci yang selanjutnya dikutip oleh Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Katakanlah kepadaku
  rationale: Bentuk imperatif kini jamak ini membuka tantangan langsung kepada para pembaca. Ungkapan ini alami dan tetap mempertahankan daya perintahnya.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: kamu yang ingin berada di bawah hukum
  rationale: Partisipel berartikel menunjuk kepada kelompok yang dicirikan oleh keinginan tersebut. Frasa 'di bawah hukum' mempertahankan ungkapan hukum-perjanjian Paulus.
- source_word: νόμον / τὸν νόμον
  choice: hukum / hukum itu
  rationale: Pemakaian kata yang sama mempertahankan permainan makna Paulus antara berada di bawah hukum dan menyimak hukum sebagai Kitab Suci. Kata 'itu' pada kemunculan kedua mencerminkan artikelnya tanpa harus memakai huruf kapital yang akan mempersempit rujukan.
- source_word: οὐκ ἀκούετε
  choice: tidakkah kamu mendengarkan
  rationale: ἀκούω dapat berarti 'mendengar' atau 'mendengarkan'. Dalam konteks argumen Kitab Suci yang segera menyusul, 'mendengarkan' menyampaikan perhatian terhadap isi hukum, sambil mencatat alternatif leksikal dalam catatan kaki.
theological_decisions:
- issue: Rujukan νόμος ('hukum')
  choice: Diterjemahkan 'hukum' tanpa kapitalisasi, dengan 'hukum itu' pada kemunculan kedua.
  alternative: '''Taurat'' atau ''Hukum Taurat'' pada satu atau kedua kemunculan.'
  rationale: Konteks mengarah pada hukum Musa dan khususnya kisah Kitab Suci yang akan dikutip, tetapi kata Yunani yang sama juga menopang ketegangan retoris antara ingin berada di bawah hukum dan sungguh-sungguh menyimak hukum. 'Hukum' mempertahankan keluasan dan permainan kata tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan berwibawa. Bentuk tunggal kolektif 'kamu' dipakai secara alami untuk menyapa kelompok pembaca; pengulangan 'hukum' sengaja dipertahankan.
