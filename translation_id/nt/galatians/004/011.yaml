  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: id
  text: Aku khawatir tentang kalian, jangan-jangan aku telah bersusah payah untuk kalian dengan sia-sia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: Aku khawatir tentang kalian
  rationale: Ungkapan ini menyatakan kekhawatiran Paulus yang sedang berlangsung mengenai keadaan jemaat Galatia, bukan rasa takut terhadap mereka.
- source_word: μή πως
  choice: jangan-jangan
  rationale: Ungkapan Indonesia yang alami untuk memperkenalkan kemungkinan yang dikhawatirkan, sekaligus mempertahankan nuansa ketidakpastian.
- source_word: εἰκῇ
  choice: sia-sia
  rationale: Menyatakan bahwa jerih payah itu mungkin tidak menghasilkan tujuan yang diharapkan.
- source_word: κεκοπίακα
  choice: jerih payahku
  rationale: Nominalisasi alami dalam bahasa Indonesia yang tetap menyampaikan kerja keras yang telah dilakukan dan masih relevan sekarang.
- source_word: εἰς ὑμᾶς
  choice: bagi kalian
  rationale: Menunjukkan bahwa jerih payah Paulus diarahkan kepada dan demi jemaat Galatia; pilihan lain yang mungkin adalah 'di antara kalian'.
theological_decisions:
- issue: Sifat kekhawatiran Paulus
  choice: Kekhawatiran pastoral bahwa jerih payah kerasulan Paulus bagi jemaat Galatia mungkin tidak mencapai hasilnya
  alternative: Kecemasan pribadi secara umum tanpa penekanan pada kemungkinan gagalnya pembentukan mereka dalam Injil
  rationale: Rangkaian φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα menyatakan kekhawatiran khusus bahwa pekerjaannya dapat terbukti sia-sia, tanpa memastikan bahwa hal itu benar-benar telah gagal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti 'Aku/kalian' mengikuti nada surat yang langsung dan hangat; 'jerih payah' menjaga bobot κοπιάω tanpa terdengar kaku.
