review_pass:
  verdict: revise
  source_fidelity: Makna dasar tersampaikan, tetapi frasa utama menghilangkan predikasi orang pertama pada κεκοπίακα. «Jerih payahku ... sia-sia» menyatakan kepunyaan, bukan secara jelas «aku telah bersusah payah ... dengan sia-sia». Selain itu, εἰς ὑμᾶς lebih baik diterjemahkan sebagai sasaran pelayanan («untuk kalian») daripada sekadar posesif dalam konstruksi draf.
  naturalness: «Aku khawatir tentang kalian, jangan-jangan ...» alami dalam bahasa Indonesia baku. Bentuk verbal eksplisit juga sama alami dan lebih langsung.
  terminology: «Khawatir», «jangan-jangan», «bersusah payah», dan «sia-sia» sesuai register modern serta mempertahankan kekhawatiran pastoral dan kemungkinan hasil yang gagal. «Untuk kalian» secara idiomatis menyatakan arah/tujuan jerih payah Paulus.
  issues:
  - severity: medium
    issue: κεκοπίακα dinominalkan menjadi «jerih payahku» tanpa verba eksplisit.
    rationale: Perfect indikatif orang pertama berarti «aku telah bersusah payah/berjerih payah». Nominalisasi draf melemahkan pernyataan tindakan Paulus dan membuat relasi dengan «sia-sia» kurang langsung.
  - severity: low
    issue: Catatan kaki mengusulkan «dengan sia-sia di antara kalian».
    rationale: Pilihan ini tidak perlu untuk ayat yang singkat dan dapat memberi kesan lokasi pelayanan, sedangkan εἰς ὑμᾶς terutama menunjukkan sasaran jerih payah. Tidak ada ambiguitas tekstual yang perlu dipertahankan melalui catatan kaki.
  revised_text: Aku khawatir tentang kalian, jangan-jangan aku telah bersusah payah untuk kalian dengan sia-sia.
