  text: tetapi ia berada di bawah pengawasan para wali dan pengelola[a] sampai waktu yang telah ditetapkan oleh ayahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengurus rumah tangga”; istilah Yunani ini menunjuk kepada orang yang mengelola rumah tangga atau harta milik.
