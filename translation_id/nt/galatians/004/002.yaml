lexical_decisions:
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Menandai pertentangan yang kuat dengan keadaan ahli waris dalam ayat sebelumnya dan terdengar alami setelah pernyataan negatif dalam konteks.
- source_word: ὑπὸ
  choice: di bawah pengawasan
  rationale: Dengan objek akusatif, kata ini menyatakan ketundukan pada wewenang atau pengawasan; ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐπιτρόπους
  choice: para wali
  rationale: Menunjuk kepada orang-orang yang dipercayai untuk mengawasi atau mengasuh seorang anak yang belum dewasa.
- source_word: ἐστὶ
  choice: ia berada
  rationale: Subjeknya dipahami dari ayat sebelumnya, yaitu ahli waris; pronomina perlu dinyatakan agar kalimat Indonesia alami.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan dua kelompok orang yang menjalankan fungsi berbeda.
- source_word: οἰκονόμους
  choice: pengelola
  rationale: Menunjuk kepada mereka yang mengurus rumah tangga, harta, atau perkebunan; 'pengelola' merupakan padanan modern yang luas dan jelas.
- source_word: ἄχρι
  choice: sampai
  rationale: Menandai batas waktu berlangsungnya keadaan tersebut.
- source_word: τῆς προθεσμίας
  choice: waktu yang telah ditetapkan
  rationale: Menyampaikan gagasan tentang waktu yang sudah ditentukan sebelumnya tanpa menambahkan konsep lain.
- source_word: τοῦ πατρός
  choice: oleh ayahnya
  rationale: Dalam analogi keluarga ini, genitif paling wajar dipahami sebagai ayah si ahli waris yang menetapkan waktunya.
theological_decisions:
- issue: Pemahaman genitif τοῦ πατρός
  choice: oleh ayahnya
  alternative: waktu ketetapan sang ayah / oleh sang ayah
  rationale: Konteks analogi ahli waris yang belum dewasa mendukung pengertian bahwa ayah adalah pihak yang menetapkan waktunya. Penambahan '-nya' menjelaskan relasi keluarga yang sudah tersirat, tanpa membawa klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. 'Para wali' membedakan pengawasan atas anak dari 'pengelola' yang terutama mengurus rumah tangga atau harta. Penanda catatan kaki [a] dan [b] ditempatkan tepat pada unsur yang dijelaskan.
