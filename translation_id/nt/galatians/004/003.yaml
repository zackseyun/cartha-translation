  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: id
  text: Demikian juga, ketika kita masih anak-anak, kita diperbudak di bawah unsur-unsur dasar dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-roh unsur dunia”; istilah Yunani ini dapat menunjuk pada unsur atau asas dasar, ataupun pada kuasa-kuasa rohani kosmis.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Menandai analogi dengan gambaran sebelumnya tentang ahli waris yang masih berada di bawah pengawasan, dengan ungkapan yang ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἡμεῖς
  choice: kita
  rationale: Pronomina orang pertama jamak inklusif paling sesuai dalam sapaan Paulus kepada para pembaca dan tetap mempertahankan penegasan bentuk Yunani.
- source_word: ὅτε ἦμεν νήπιοι
  choice: ketika kita masih anak-anak
  rationale: νήπιοι dalam konteks analogi ahli waris menunjuk pada keadaan belum dewasa, bukan khusus bayi; 'masih anak-anak' alami dan mempertahankan gambaran tersebut.
- source_word: ὑπὸ
  choice: di bawah
  rationale: Mempertahankan metafora ketundukan atau penguasaan yang berulang dalam konteks.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: unsur-unsur dasar dunia ini
  rationale: στοιχεῖα dapat menunjuk pada unsur atau asas dasar, tetapi mungkin pula pada kuasa-kuasa rohani kosmis. Pilihan utama ini tidak mempersonifikasikannya, sementara ambiguitasnya dijaga dalam catatan kaki.
- source_word: ἤμεθα δεδουλωμένοι
  choice: kita diperbudak
  rationale: Mengungkapkan keadaan perbudakan yang berkelanjutan secara jelas dan kuat, sesuai bentuk pasif perifrastis Yunani.
theological_decisions:
- issue: Makna τὰ στοιχεῖα τοῦ κόσμου
  choice: unsur-unsur dasar dunia ini
  alternative: roh-roh penguasa dunia ini / asas-asas dasar dunia ini
  rationale: Istilah στοιχεῖα diperdebatkan dan dapat dipahami secara nonpersonal sebagai unsur atau asas dasar, atau secara personal sebagai kuasa rohani kosmis. Teks utama memilih ungkapan cukup luas, sedangkan catatan kaki mempertahankan alternatif teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Tanda titik dua membantu menjaga penekanan pada 'kita' tanpa menghasilkan susunan yang kaku. Istilah 'diperbudak' mempertahankan kekuatan metafora asli.
