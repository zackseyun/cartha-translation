  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: id
  text: Namun, memang baik jika kalian dicari dengan sungguh-sungguh[a] demi tujuan yang baik[b] selalu, dan bukan hanya ketika aku hadir bersama kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersemangat” atau “menunjukkan semangat.” Infinitif Yunani ζηλοῦσθαι dapat dipahami dengan beberapa cara, tetapi arti pasif sesuai dengan kontras langsung dengan orang-orang yang berusaha menarik jemaat Galatia dalam ayat sebelumnya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dalam hal yang baik.” Ungkapan ini mungkin berarti dengan motif yang baik atau untuk tujuan yang baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: memang baik
  rationale: Adjektiva predikatif ini digunakan secara impersonal bersama infinitif; “memang baik” memberi penekanan yang wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan motif buruk pihak-pihak yang giat mendekati jemaat dalam ayat sebelumnya.
- source_word: ζηλοῦσθαι
  choice: kalian diusahakan dengan sungguh-sungguh
  rationale: Infinitif pasif kini dari ζηλόω. Bentuk pasif paling sesuai dengan pemakaian kata yang sama pada ayat 17, ketika orang lain giat mendekati jemaat Galatia. Objek tersirat “kalian” dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: ἐν καλῷ
  choice: untuk tujuan yang baik
  rationale: Ungkapan harfiahnya “dalam hal yang baik”; dalam konteks ini menunjuk pada tujuan atau motif yang baik, berlawanan dengan motif buruk pada ayat sebelumnya.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan alami yang mempertahankan kontras temporal dengan “bukan hanya ketika”.
- source_word: καὶ μὴ μόνον
  choice: dan bukan hanya
  rationale: Mempertahankan koordinasi dan pembatasan dalam teks Yunani.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: ketika aku hadir di tengah-tengah kalian
  rationale: Infinitif berartikel dengan ἐν menyatakan waktu. Frasa ini alami dalam bahasa Indonesia dan mempertahankan kontras antara kehadiran dan ketidakhadiran Paulus.
theological_decisions:
- issue: Diatesis dan subjek ζηλοῦσθαι
  choice: 'Pasif: jemaat Galatia menjadi sasaran upaya sungguh-sungguh pihak lain'
  alternative: 'Medium/refleksif atau aktif dalam arti: “bersemangat” atau “menunjukkan semangat”'
  rationale: 'Konteks langsung ayat 17–18 memakai ζηλόω untuk upaya pihak lain terhadap jemaat Galatia. Pembacaan pasif menjadikan ayat 18 pasangan positifnya: menjadi sasaran upaya sungguh-sungguh itu baik bila tujuannya baik. Karena bentuk Yunani dapat dipahami dengan cara lain, alternatif dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak; “diusahakan dengan sungguh-sungguh” mempertahankan diatesis pasif dan unsur kegigihan tanpa memakai ungkapan romantis seperti “dirayu” atau “didekati” yang terlalu mempersempit makna.
