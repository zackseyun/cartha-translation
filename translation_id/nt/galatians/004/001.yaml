id: GAL.4.1
reference: Galatians 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: id
  text: 'Yang saya maksud ialah: selama ahli waris masih anak-anak[a], ia sama sekali tidak berbeda dari seorang budak[b], sekalipun ia adalah tuan atas segala sesuatu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “masih di bawah umur.” Kata Yunani ini dapat berarti anak yang belum dewasa; dalam konteks ini yang ditekankan ialah bahwa ahli waris itu belum mencapai usia untuk menjalankan haknya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seorang hamba.” Kata Yunani ini lazim menunjuk pada budak, yaitu orang yang terikat di bawah kuasa orang lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Yang saya maksud ialah
  rationale: Ungkapan ini memperkenalkan penjelasan lanjutan. Bentuk Indonesia ini menyampaikan fungsi wacananya secara alami tanpa menambahkan penanda waktu yang tidak ada dalam teks Yunani.
- source_word: ἐφ’ ὅσον χρόνον
  choice: selama
  rationale: Ungkapan idiomatis ini menunjukkan jangka waktu yang berlangsung sampai suatu batas.
- source_word: ὁ κληρονόμος
  choice: ahli waris
  rationale: Istilah baku dan alami dalam bahasa Indonesia untuk orang yang berhak menerima warisan.
- source_word: νήπιός
  choice: masih anak-anak
  rationale: Dalam perumpamaan hukum waris ini, kata tersebut menunjuk pada anak yang belum mencapai usia dewasa, bukan semata-mata bayi.
- source_word: οὐδὲν διαφέρει
  choice: sama sekali tidak berbeda
  rationale: Menyatakan tidak adanya perbedaan praktis dengan tegas dan alami.
- source_word: δούλου
  choice: seorang budak
  rationale: Status keterikatan dan ketiadaan kebebasan praktis penting bagi perbandingan Paulus; 'budak' mempertahankan kekuatan istilah Yunani.
- source_word: κύριος πάντων ὤν
  choice: sekalipun ia adalah tuan atas segala sesuatu
  rationale: Partisipel dipahami secara konsesif, sedangkan κύριος di sini menyatakan kedudukan sebagai pemilik atau penguasa, bukan gelar ilahi.
theological_decisions:
- issue: Arti δοῦλος dalam perbandingan Paulus
  choice: budak
  alternative: hamba atau pelayan
  rationale: Perbandingan bergantung pada keadaan orang yang berada di bawah kuasa dan belum memiliki kebebasan praktis. 'Budak' mempertahankan ketajaman retoris itu tanpa memperlunaknya.
- issue: Hubungan konsesif κύριος πάντων ὤν
  choice: sekalipun ia adalah tuan atas segala sesuatu
  alternative: meskipun ia menguasai semuanya
  rationale: Terjemahan ini mempertahankan ketegangan antara kedudukan sah sang ahli waris dan keadaannya yang untuk sementara tidak berbeda secara praktis dari seorang budak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat mempertahankan bentuk analogi Paulus, sementara tanda titik dua memperjelas bahwa kalimat berikutnya menjelaskan ungkapan pembuka.
