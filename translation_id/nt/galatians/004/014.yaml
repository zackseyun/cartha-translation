source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: id
  text: Meskipun keadaan jasmaniku merupakan ujian bagi kalian,[a] kalian tidak meremehkanku atau menolakku dengan jijik[b]; sebaliknya, kalian menyambut aku seperti malaikat Allah, seperti Mesias Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ujian kalian dalam tubuhku.” Frasa Yunani ini sulit secara tekstual dan sintaktis.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “meludah,” suatu ungkapan rasa muak atau penolakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου
  choice: keadaan tubuhku menjadi suatu ujian bagi kalian
  rationale: Ungkapan Yunani ini sulit secara tekstual dan sintaktis. Terjemahan utama memahami keadaan jasmani Paulus sebagai sesuatu yang menguji jemaat Galatia, sambil mempertahankan kemungkinan susunan yang lebih harfiah dalam catatan kaki.
- source_word: ἐξουθενήσατε
  choice: memandang rendah
  rationale: Kata kerja ini menyatakan sikap meremehkan atau menganggap tidak bernilai; 'memandang rendah' alami dan tepat dalam bahasa Indonesia modern.
- source_word: ἐξεπτύσατε
  choice: menolakku dengan jijik
  rationale: Secara harfiah kata ini berkaitan dengan meludah sebagai tanda rasa muak atau penolakan. Terjemahan ini menyampaikan daya ungkap idiomatisnya, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: ἐδέξασθέ με
  choice: menyambut aku
  rationale: Konteksnya menunjukkan penerimaan pribadi yang hangat, sehingga 'menyambut' lebih tepat daripada 'menerima' yang lebih netral.
- source_word: ἄγγελον θεοῦ
  choice: malaikat Allah
  rationale: Walaupun ἄγγελος juga dapat berarti utusan, perbandingan yang ditinggikan dan disejajarkan dengan Mesias Yesus mendukung arti 'malaikat'.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar di sini; 'Mesias' menyampaikan makna gelar itu secara transparan, bukan sekadar mentransliterasikannya.
theological_decisions:
- issue: Makna perbandingan 'seperti malaikat Allah, seperti Mesias Yesus'
  choice: Dua frasa 'seperti' menerangkan cara jemaat Galatia menyambut Paulus dengan penghormatan yang luar biasa.
  alternative: Perbandingan kedua dapat dipahami sebagai peningkatan retoris atas perbandingan pertama.
  rationale: Terjemahan mempertahankan kedua perbandingan secara langsung tanpa menyamakan hakikat Paulus dengan Mesias Yesus.
- issue: Makna σάρξ dalam konteks ini
  choice: Keadaan jasmani atau tubuh Paulus
  alternative: Daging sebagai kecenderungan moral yang berdosa
  rationale: Konteks membahas kelemahan atau keadaan fisik Paulus, bukan kategori moral 'natur berdosa'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk 'kalian' dipakai untuk menandai orang kedua jamak; 'keadaan tubuh' menghindari kemungkinan salah paham moral dari terjemahan harfiah 'daging'.
