  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: id
  text: Namun, anak dari perempuan budak itu dilahirkan menurut daging[a], sedangkan anak dari perempuan merdeka itu dilahirkan melalui janji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dengan cara manusiawi yang biasa” atau “melalui kemampuan manusia.” Secara harfiah: “menurut daging.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “berdasarkan janji.” Maksudnya, kelahiran itu terjadi sebagai penggenapan janji Allah, bukan semata-mata melalui proses kelahiran manusiawi yang biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: perempuan budak
  rationale: Pilihan ini mempertahankan statusnya sebagai orang yang tidak merdeka, yang penting bagi pertentangan dan argumentasi Paulus, tanpa memperhalusnya menjadi sekadar pelayan.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Terjemahan ini mempertahankan istilah khas Paulus dan ketegangan dengan frasa 'melalui janji'; dalam konteks ini maksudnya ialah kelahiran melalui cara manusiawi yang biasa, bukan bahwa tubuh atau kelahiran jasmani itu berdosa.
- source_word: γεγέννηται
  choice: dilahirkan
  rationale: Bentuk pasif ini alami dalam bahasa Indonesia dan sesuai dengan konteks yang membandingkan asal kelahiran kedua anak tersebut.
- source_word: ἐλευθέρα
  choice: perempuan merdeka
  rationale: Adjektiva ini dipakai secara substantival dan secara langsung berlawanan dengan status perempuan budak.
- source_word: δι’ ἐπαγγελίας
  choice: melalui janji
  rationale: Pilihan ini mempertahankan gagasan bahwa kelahiran tersebut terjadi melalui janji Allah sebagai sarana atau dasar penentu, tanpa menambahkan kata sandang yang tidak ada dalam bahasa Yunani.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: anak ... sedangkan anak
  rationale: Kata 'anak' melengkapi referen yang tersirat dalam bahasa Yunani dan membuat perbandingan jelas serta alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pertentangan κατὰ σάρκα dengan δι’ ἐπαγγελίας
  choice: Mempertahankan 'menurut daging' dan 'melalui janji' dalam teks utama.
  alternative: Memparafrasakan sebagai 'dengan cara manusiawi yang biasa' dan 'sebagai hasil janji Allah'.
  rationale: Konteks membedakan kelahiran melalui proses manusiawi biasa dari kelahiran yang terwujud karena janji Allah. Terjemahan ini tidak menyiratkan bahwa kelahiran jasmani itu sendiri berdosa, sekaligus mempertahankan kosakata dan ketegangan teologis Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perempuan budak' dipilih untuk menonjolkan status sosial yang menjadi inti pertentangan, sementara struktur 'namun ... sedangkan ...' menyampaikan pasangan μὲν ... δὲ secara alami.
