  text: You are carefully observing days and months and seasons and years.
translation:
  language: id
  text: Kalian dengan teliti memelihara hari-hari, bulan-bulan, masa-masa, dan tahun-tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kalian memelihara hari-hari, bulan-bulan, waktu-waktu yang ditetapkan, dan tahun-tahun.” Daftar ini merujuk pada berbagai ketetapan berdasarkan kalender; “waktu-waktu yang ditetapkan” juga dapat menerjemahkan “masa-masa” (καιρούς).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: hari-hari
  rationale: Bentuk jamak diterjemahkan secara langsung tanpa menambahkan kata seperti “khusus” atau “suci”; kontekslah yang menunjukkan bahwa hari-hari itu dipelihara secara keagamaan.
- source_word: παρατηρεῖσθε
  choice: dengan teliti memelihara
  rationale: Bentuk kini orang kedua jamak menunjukkan tindakan yang sedang atau terus dilakukan. Dalam konteks penanggalan keagamaan, “memelihara” menyampaikan makna menjalankan suatu ketetapan, sedangkan “dengan teliti” mempertahankan nuansa perhatian yang sungguh-sungguh dalam verba Yunani.
- source_word: μῆνας
  choice: bulan-bulan
  rationale: Padanan langsung yang mempertahankan urutan satuan waktu dalam teks.
- source_word: καιρούς
  choice: masa-masa
  rationale: καιρός dapat menunjuk pada masa atau waktu tertentu yang ditetapkan. “Masa-masa” mempertahankan keluasan maknanya tanpa mempersempitnya menjadi hari raya atau festival.
- source_word: ἐνιαυτούς
  choice: tahun-tahun
  rationale: Padanan langsung yang melengkapi rangkaian waktu dalam bentuk jamak.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung diterjemahkan untuk mempertahankan irama kumulatif daftar Paulus; dalam bahasa Indonesia, koma digunakan pada unsur-unsur awal dan “dan” pada unsur terakhir agar tetap alami.
theological_decisions:
- issue: Apakah jenis penanggalan yang dipelihara harus disebut secara eksplisit sebagai penanggalan Yahudi atau keagamaan
  choice: Istilah waktu dipertahankan tanpa tambahan “khusus”, “suci”, “Yahudi”, atau “keagamaan”.
  alternative: Kalian dengan teliti memelihara hari-hari khusus, bulan-bulan, waktu-waktu yang ditetapkan, dan tahun-tahun.
  rationale: Teks Yunani hanya menyebut satuan-satuan waktu. Konteks menunjukkan praktik penanggalan keagamaan, tetapi menerangkan jenisnya secara eksplisit dalam teks utama akan melampaui susunan kata Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”. Kata “memelihara” dipakai dalam arti menjalankan atau menaati suatu ketetapan, bukan sekadar memperhatikan tanggal. Susunan daftar dipertahankan dekat dengan teks Yunani dan tetap wajar dibaca.
