id: GAL.4.29
reference: Galatians 4:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: id
  text: Namun, sebagaimana pada waktu itu orang yang dilahirkan menurut daging menganiaya orang yang dilahirkan menurut Roh[a][b], demikian juga sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang dilahirkan dengan cara manusia biasa”; secara harfiah, “orang yang dilahirkan menurut daging.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang yang menurut Roh”; kata “dilahirkan” tidak diulangi dalam teks Yunani, tetapi tersirat dari klausa pertama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya secara wajar dan ringkas dalam bahasa Indonesia.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: sebagaimana pada waktu itu ... demikian juga sekarang
  rationale: Mempertahankan susunan perbandingan korelatif dan kontras waktu dalam bahasa Indonesia yang alami.
- source_word: ὁ ... γεννηθεὶς
  choice: orang yang dilahirkan
  rationale: Menerjemahkan partisip pasif substantival sebagai ungkapan nominal yang jelas; bentuk pasif mempertahankan perhatian pada keadaan kelahiran.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan istilah Paulus dan kesejajarannya dengan 'menurut Roh', tanpa menafsirkan frasa ini sebagai 'tabiat berdosa'; alternatif yang menjelaskan kelahiran secara manusiawi diberikan dalam catatan.
- source_word: ἐδίωκε
  choice: menganiaya
  rationale: Dalam konteks ini, kata tersebut menunjukkan perlakuan bermusuhan atau penindasan. Bentuk imperfek dipahami sebagai tindakan pada masa itu tanpa harus memakai konstruksi progresif yang kaku.
- source_word: τὸν κατὰ πνεῦμα
  choice: orang yang dilahirkan menurut Roh
  rationale: Kata 'dilahirkan' diulang secara tersirat dari klausa pertama agar kesejajaran jelas dalam bahasa Indonesia, sedangkan 'menurut' mempertahankan keluasan makna κατά.
- source_word: πνεῦμα
  choice: Roh
  rationale: Dalam konteks Galatia, kontras dengan daging serta kaitannya dengan janji menunjuk paling mungkin kepada Roh Kudus; huruf kapital menyatakan penilaian kontekstual ini.
- source_word: νῦν
  choice: sekarang
  rationale: Menyatakan hubungan pola masa lampau dengan keadaan pada zaman Paulus secara langsung dan alami.
theological_decisions:
- issue: Makna κατὰ σάρκα dalam kontras Ismael dan Ishak
  choice: Menurut daging, yakni kelahiran melalui kemampuan atau cara manusia biasa
  alternative: Menurut tabiat berdosa atau secara duniawi
  rationale: Konteks langsung membedakan kelahiran alami Ismael dari kelahiran Ishak yang terkait dengan janji dan Roh. Teks utama mempertahankan metafora Paulus tanpa memasukkan gagasan tabiat berdosa yang tidak dituntut konteks.
- issue: Acuan πνεῦμα
  choice: Roh Kudus
  alternative: Roh manusia atau prinsip/ranah rohani
  rationale: Konteks surat Galatia, janji, dan identitas umat Allah paling kuat mendukung Roh ilahi, tetapi susunan 'menurut Roh' tetap dipertahankan agar nuansa hubungan tersebut tidak dipersempit menjadi alat penyebab saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' serta pola 'sebagaimana ... demikian juga' menjaga hubungan argumentatif. Istilah teologis 'daging' dan 'Roh' dipertahankan, dengan catatan untuk menjelaskan ambiguitas leksikal dan elipsis sumber.
