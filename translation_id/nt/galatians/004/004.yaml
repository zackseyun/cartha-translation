  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: id
  text: Namun, ketika waktunya telah genap[a], Allah mengutus Anak-Nya[b], yang lahir dari seorang perempuan[c] dan lahir di bawah hukum Taurat[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ketika kepenuhan waktu telah tiba”; maksudnya dapat pula dinyatakan sebagai “ketika waktu yang ditentukan telah lengkap.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang dipakai dapat juga diterjemahkan “mengirim”; bentuknya menekankan pengutusan ke luar untuk suatu tujuan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dari seorang perempuan.” Kata kerja Yunaninya secara harfiah berkaitan dengan “menjadi” atau “datang menjadi,” tetapi dalam konteks ini menunjuk pada kelahiran Sang Anak sebagai manusia sejati.
    reason: lexical_alternative
  - marker: d
    text: 'Secara harfiah: “di bawah hukum.” Dalam konteks surat Galatia, yang terutama dimaksud ialah berada di bawah lingkup hukum Musa.'
    reason: contextual_clarification
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: ὅτε menyatakan waktu, sedangkan δέ memberi peralihan ringan yang dalam konteks ini dapat disampaikan secara alami dengan “Namun” tanpa membuat pertentangannya terlalu tajam.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: waktunya telah genap
  rationale: Ungkapan ini menyatakan bahwa masa yang ditentukan telah mencapai kepenuhannya. Susunan “waktunya telah genap” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “kepenuhan waktu telah datang”.
- source_word: ἐξαπέστειλεν
  choice: mengutus
  rationale: Kata kerja majemuk ini menyatakan tindakan mengirim seseorang untuk suatu tugas. “Mengutus” mempertahankan unsur misi dengan lebih alami daripada “mengirim keluar”.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Anak-Nya
  rationale: Bentuk ini secara alami menyampaikan objek beserta kepunyaan. Huruf kapital menandai bahwa yang dimaksud dalam konteks ialah Sang Anak.
- source_word: γενόμενον ἐκ γυναικός
  choice: lahir dari seorang perempuan
  rationale: Dalam konstruksi ini γενόμενον menunjuk pada kelahiran manusia, sementara ἐκ menyatakan asal. Terjemahan ini jelas dan tetap dekat dengan ungkapan Yunani.
- source_word: γενόμενον ὑπὸ νόμον
  choice: lahir di bawah hukum Taurat
  rationale: Pengulangan “lahir” mencerminkan kesejajaran kedua partisipel. Dalam konteks Galatia, νόμος terutama menunjuk pada hukum Taurat, dan “di bawah” mempertahankan gambaran tentang berada dalam lingkup atau yurisdiksinya.
theological_decisions:
- issue: Kemanusiaan sejati Sang Anak dalam γενόμενον ἐκ γυναικός
  choice: lahir dari seorang perempuan
  alternative: menjadi dari seorang perempuan; berasal dari seorang perempuan
  rationale: “Lahir” mengungkapkan kelahiran manusia yang nyata tanpa meniadakan praeksistensi Sang Anak yang tersirat dalam pernyataan bahwa Allah mengutus-Nya.
- issue: Acuan νόμος dalam ὑπὸ νόμον
  choice: hukum Taurat
  alternative: hukum dalam arti umum
  rationale: Pemakaian Paulus dalam Galatia sangat kuat mengarah pada hukum Musa dan kedudukannya dalam perjanjian. Catatan kaki tetap memberitahukan bahwa bentuk Yunani hanya berbunyi “hukum,” sehingga keluasan bentuk asal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara kesejajaran “lahir ... dan lahir ...” dipertahankan. “Hukum Taurat” dipakai agar acuan kontekstualnya jelas, dengan bentuk Yunani yang lebih ringkas dicatat dalam catatan kaki.
