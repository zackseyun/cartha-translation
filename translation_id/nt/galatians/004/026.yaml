id: GAL.4.26
reference: Galatians 4:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: id
  text: Namun, Yerusalem yang di atas itu merdeka, dan ia adalah ibu kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang adalah ibu kita.”'
    reason: Alternatif ini mengikuti bentuk klausa relatif Yunani secara lebih formal.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan Yerusalem yang sekarang dalam konteks sebelumnya; “Namun” menyampaikan daya adversatif secara wajar dalam bahasa Indonesia.
- source_word: ἄνω
  choice: yang di atas
  rationale: Mempertahankan gambaran spasial teks Yunani dan kontras dengan Yerusalem yang sekarang tanpa langsung menafsirkannya sebagai sekadar “surgawi”.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Mengikuti bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: ἐλευθέρα
  choice: merdeka
  rationale: Menyatakan status Yerusalem yang di atas serta mempertahankan kontras antara perbudakan dan kemerdekaan dalam perikop ini tanpa menambahkan kata “perempuan” yang tidak tersurat.
- source_word: ἥτις
  choice: dan ia
  rationale: Mengungkapkan kelanjutan klausa relatif sekaligus personifikasi Yerusalem secara alami dalam bahasa Indonesia; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: μήτηρ
  choice: ibu
  rationale: Padanan langsung yang mempertahankan metafora keibuan dalam alegori Paulus.
- source_word: ἡμῶν
  choice: kita
  rationale: Bentuk inklusif paling wajar untuk kepunyaan orang pertama jamak dalam konteks Paulus berbicara kepada para pembacanya.
theological_decisions:
- issue: Rujukan dan personifikasi “Yerusalem yang di atas”
  choice: 'Diterjemahkan sebagai sosok yang dipersonifikasikan: “dan ia adalah ibu kita.”'
  alternative: “yang adalah ibu kita”
  rationale: Argumentasi alegoris Paulus menggambarkan Yerusalem sebagai figur keibuan yang bersesuaian dengan perempuan merdeka. Kata “ia” memperjelas personifikasi tanpa menambahkan identifikasi teologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “yang di atas” dipertahankan agar metafora sumber tidak dipersempit menjadi tafsiran “surgawi”; “merdeka” menjaga kaitan dengan kontras hamba dan perempuan merdeka dalam konteks.
