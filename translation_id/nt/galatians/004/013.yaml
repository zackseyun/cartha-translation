  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: id
  text: Namun, kalian tahu bahwa karena kelemahan jasmani, untuk pertama kalinya aku memberitakan kabar baik kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena penyakit jasmani.” Secara harfiah, frasa Yunani ini berarti “karena kelemahan/penyakit daging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: kalian tahu
  rationale: Bentuk perfek οἶδα memiliki makna kini dan menunjuk pada pengetahuan yang sudah dimiliki jemaat Galatia; bentuk jamak 'kalian' memperjelas penerimanya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari uraian sebelumnya tanpa membuat pertentangannya terlalu tajam.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang diketahui jemaat Galatia.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: karena kelemahan jasmani
  rationale: διά dengan akusatif menyatakan sebab. ἀσθένεια dapat berarti kelemahan atau penyakit, sedangkan τῆς σαρκὸς di sini menunjuk pada keadaan tubuh. 'Kelemahan jasmani' mempertahankan keluasan makna tanpa memutuskan secara berlebihan bahwa yang dimaksud pasti penyakit tertentu.
- source_word: εὐηγγελισάμην
  choice: aku memberitakan kabar baik
  rationale: Menyampaikan tindakan pewartaan εὐαγγελίζω dengan bahasa Indonesia modern dan jelas, tanpa menghilangkan daya verbalnya.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Menerjemahkan datif sebagai penerima pemberitaan dan mempertahankan sapaan orang kedua jamak.
- source_word: τὸ πρότερον
  choice: untuk pertama kalinya
  rationale: Dalam konteks ini paling wajar menunjuk pada kesempatan awal Paulus memberitakan kabar baik kepada jemaat Galatia, sambil menghindari kesan bahwa ia hanya lebih dahulu melakukan satu tindakan dalam rangkaian yang sama.
theological_decisions:
- issue: Makna σάρξ dalam ἀσθένειαν τῆς σαρκὸς
  choice: 'keadaan tubuh secara harfiah: ''kelemahan jasmani'''
  alternative: penyakit jasmani; kelemahan metaforis; tabiat berdosa
  rationale: Konteks menunjuk pada keadaan fisik Paulus yang berkaitan dengan kunjungan atau pemberitaannya, bukan pada kerusakan moral. Karena ἀσθένεια sendiri dapat berarti kelemahan ataupun penyakit, teks utama mempertahankan ambiguitas itu dan catatan memberi alternatif yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku—kalian' dipakai untuk mempertahankan keakraban surat serta membedakan bentuk jamak penerima. 'Jasmani' dipilih dalam teks utama agar alami dalam bahasa Indonesia, sementara bentuk harfiah 'daging' dicatat dalam catatan kaki.
