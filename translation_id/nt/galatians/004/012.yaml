id: GAL.4.12
reference: Galatians 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: id
  text: 'Jadilah seperti aku[a], sebab aku pun seperti kalian[b]. Saudara-saudara[c], aku memohon kepada kalian: kalian tidak berbuat salah apa pun terhadap aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jadilah sama seperti aku.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani berbentuk eliptis tanpa verba dalam klausa ini. Dalam konteksnya, klausa ini juga dapat dipahami, “sebab aku pun telah menjadi seperti kalian.”
    reason: alternative_reading
  - marker: c
    text: Sapaan “Saudara-saudara” di sini ditujukan kepada komunitas orang percaya dan kemungkinan mencakup laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε
  choice: Jadilah
  rationale: Imperatif kini dari γίνομαι menyerukan agar para pembaca mengambil atau menjalani suatu keadaan; “jadilah” lebih tepat daripada bentuk statif semata.
- source_word: ὡς ἐγώ
  choice: seperti aku
  rationale: ὡς menyatakan perbandingan. Bahasa Indonesia tidak perlu menambahkan kopula “adalah”.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι paling wajar dipahami sebagai pemberi alasan bagi seruan sebelumnya.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: aku pun seperti kalian
  rationale: Klausa Yunani ini eliptis tanpa verba tersurat. Terjemahan utama mempertahankan elipsis secara alami dalam bahasa Indonesia dan tidak memutuskan apakah verba yang tersirat bernuansa “adalah” atau “menjadi”.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara alami dan bermartabat diterjemahkan “Saudara-saudara”; dalam konteks jemaat, cakupannya kemungkinan meliputi laki-laki dan perempuan.
- source_word: δέομαι ὑμῶν
  choice: aku memohon kepada kalian
  rationale: δέομαι menyatakan permintaan yang sungguh-sungguh. “Memohon” mempertahankan daya emosionalnya tanpa terdengar usang.
- source_word: οὐδέν με ἠδικήσατε
  choice: kalian tidak berbuat salah apa pun terhadap aku
  rationale: οὐδέν memperkuat penyangkalan, sedangkan ἀδικέω berarti berbuat salah atau merugikan. Susunan ini mempertahankan objek με dan keluasan maknanya.
theological_decisions:
- issue: Elipsis dalam κἀγὼ ὡς ὑμεῖς
  choice: 'Mempertahankan bentuk tanpa verba tersurat: “aku pun seperti kalian.”'
  alternative: “aku pun telah menjadi seperti kalian” atau “aku pun adalah seperti kalian”
  rationale: Teks Yunani tidak mengulang verba. Bentuk utama menjaga ambiguitas antara keadaan sekarang dan tindakan Paulus menyesuaikan diri dengan mereka; alternatif kontekstual dicatat dalam catatan kaki.
- issue: Cakupan ἀδελφοί
  choice: “Saudara-saudara” dalam teks utama, dengan cakupan komunitas dijelaskan dalam catatan kaki.
  alternative: “Saudara-saudari”
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi sapaan kepada jemaat kemungkinan mencakup seluruh komunitas orang percaya. Catatan kaki menjaga bentuk sumber sekaligus menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “kalian” untuk orang kedua jamak dan “aku” untuk mempertahankan nada pribadi serta mendesak dari Paulus. Tanda baca membagi seruan, sapaan, permohonan, dan pernyataan berikutnya secara alami. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkan.
