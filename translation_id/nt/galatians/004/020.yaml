id: GAL.4.20
reference: Galatians 4:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: id
  text: Namun, aku ingin berada bersama kalian sekarang juga dan mengubah nada bicaraku[a], karena aku bingung mengenai kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengubah suaraku”; dalam konteks ini kemungkinan berarti mengubah nada atau cara berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: aku ingin
  rationale: Bentuk imperfek θέλω di sini menyatakan keinginan Paulus yang saat ini belum terwujud. Bahasa Indonesia alami tidak perlu menambahkan unsur kontrafaktual secara eksplisit, sebab ketidakterwujudannya sudah tampak dari konteks.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras ringan dari seruan dan teguran sebelumnya.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: berada bersama kalian
  rationale: Menyampaikan kehadiran pribadi Paulus di tengah para penerima surat secara alami dan dekat dengan makna sumber.
- source_word: ἄρτι
  choice: sekarang juga
  rationale: Menjaga penekanan pada keinginan untuk hadir pada saat itu juga.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: mengubah nada bicaraku
  rationale: Secara harfiah berarti mengubah suara, tetapi dalam konteks surat menunjuk pada cara atau nada Paulus berbicara kepada mereka. Pilihan ini mempertahankan metafora suara dalam ungkapan Indonesia yang alami.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan bagi keinginan Paulus untuk hadir dan berbicara dengan cara berbeda.
- source_word: ἀποροῦμαι
  choice: aku bingung
  rationale: Mengungkapkan keadaan tidak tahu harus bersikap atau bertindak bagaimana tanpa memperkerasnya menjadi keputusasaan.
- source_word: ἐν ὑμῖν
  choice: mengenai kalian
  rationale: Dengan ἀποροῦμαι, frasa ini menunjukkan pihak yang menjadi pokok kebingungan Paulus. 'Mengenai kalian' lebih alami daripada terjemahan harfiah 'di dalam kalian'.
theological_decisions:
- issue: Makna φωνή dalam konteks
  choice: Nada atau cara Paulus berbicara kepada jemaat
  alternative: Suara fisik Paulus
  rationale: Konteksnya adalah teguran dan kepedulian pastoral; bila hadir langsung, Paulus dapat menyesuaikan cara berbicaranya. Catatan kaki tetap mengakui arti harfiah kata Yunani itu.
- issue: Kekuatan ἀποροῦμαι
  choice: Paulus bingung mengenai keadaan jemaat
  alternative: Paulus meragukan mereka atau berputus asa terhadap mereka
  rationale: Kata sumber menyatakan kebingungan atau keadaan serba tidak tahu, sehingga terjemahan tidak boleh menyisipkan kesimpulan teologis bahwa Paulus meragukan iman atau menyerah atas mereka.
translation_notes:
  register: Bahasa Indonesia modern yang hangat dan bermartabat. Pronomina “aku/kalian” mengikuti hubungan pribadi Paulus dengan jemaat dan bentuk orang kedua jamak dalam sumber. “Nada bicaraku” dipilih sebagai ungkapan idiomatis, dengan arti harfiah dipertahankan dalam catatan kaki.
