source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: id
  text: 'Sebab ada tertulis: “Bersukacitalah, hai perempuan mandul yang tidak melahirkan! Bersoraklah dan berserulah, hai engkau yang tidak mengalami sakit bersalin! Sebab anak-anak dari perempuan yang ditinggalkan lebih banyak daripada anak-anak dari perempuan yang bersuami.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Yesaya 54:1.
    reason: cross_reference
  - marker: b
    text: Ungkapan “perempuan yang ditinggalkan” juga dapat diterjemahkan “perempuan yang sunyi” atau “perempuan yang terlantar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku untuk memperkenalkan kutipan Kitab Suci; bentuk ini juga mempertahankan nuansa bahwa apa yang telah ditulis tetap berlaku.
- source_word: Εὐφράνθητι
  choice: Bersukacitalah
  rationale: Imperatif yang menyatakan sukacita dan sesuai dengan nada luhur kutipan kenabian.
- source_word: στεῖρα
  choice: perempuan mandul
  rationale: Adjektiva ini dipakai secara substantival untuk menyapa seorang perempuan; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἡ οὐ τίκτουσα
  choice: yang tidak melahirkan
  rationale: Menyampaikan keadaan tidak melahirkan secara langsung tanpa menambahkan anak ke dalam frasa sumber.
- source_word: ῥῆξον καὶ βόησον
  choice: Bersoraklah dan berserulah
  rationale: Dalam gabungan ini, ῥῆξον menunjuk pada pecahnya luapan suara, sedangkan βόησον pada seruan keras; pasangan ini alami dalam bahasa Indonesia dan mempertahankan kesejajaran puitis.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: hai engkau yang tidak mengalami sakit bersalin
  rationale: ὠδίνω secara khusus berkaitan dengan rasa sakit atau penderitaan persalinan; terjemahan ini mempertahankan gambaran keibuan dengan jelas.
- source_word: πολλὰ τὰ τέκνα
  choice: anak-anak ... lebih banyak
  rationale: Susunan komparatif dibuat alami dalam bahasa Indonesia tanpa mengubah pernyataan mengenai banyaknya keturunan.
- source_word: τῆς ἐρήμου
  choice: perempuan yang ditinggalkan
  rationale: Dalam konteks figuratif kutipan Yesaya, ἔρημος dapat menunjuk pada perempuan yang sunyi, terlantar, atau ditinggalkan. Pilihan ini menonjolkan kontras relasional dengan perempuan yang bersuami tanpa menyamakannya dengan mandul.
- source_word: μᾶλλον ἢ
  choice: lebih banyak daripada
  rationale: Menyatakan perbandingan jumlah anak secara eksplisit dan idiomatis.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: perempuan yang bersuami
  rationale: Mengungkapkan secara ringkas bahwa perempuan itu mempunyai suami, sesuai dengan arti ἀνήρ dalam konteks ini.
theological_decisions:
- issue: Kutipan Perjanjian Lama dalam konteks alegoris Galatia 4
  choice: Menerjemahkan gambaran Yesaya 54:1 sebagaimana dikutip, tanpa memasukkan identifikasi alegoris Paulus ke dalam bunyi ayat.
  alternative: Membuat rujukan kepada Sara atau Yerusalem yang di atas menjadi eksplisit.
  rationale: Ayat ini merupakan kutipan Kitab Suci. Penafsiran alegorisnya diberikan oleh konteks surat dan tidak sepatutnya disisipkan ke dalam kata-kata kutipan.
- issue: Makna τῆς ἐρήμου
  choice: perempuan yang ditinggalkan
  alternative: perempuan yang sunyi; perempuan yang terlantar
  rationale: Pilihan ini mempertahankan kemungkinan keterasingan atau ketiadaan suami yang tersirat dalam metafora, sekaligus menjaga kontras dengan perempuan yang bersuami. Alternatif dicatat agar keluasan makna tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “hai” dan imperatif berakhiran -lah mempertahankan irama kutipan kenabian tanpa menjadi sulit dipahami. Penanda catatan kaki [a] ditempatkan setelah seluruh kutipan karena catatan itu merujuk pada sumber kutipan sekaligus alternatif leksikal di dalamnya.
