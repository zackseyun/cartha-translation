  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: id
  text: Hagar adalah Gunung Sinai di Arabia[a], dan ia bersesuaian dengan Yerusalem yang sekarang, sebab ia berada dalam perbudakan bersama anak-anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hagar ini adalah Gunung Sinai di Arabia.” Dalam bahasa Yunani terdapat kata sandang sebelum nama “Hagar”, sehingga susunan klausa ini sulit dan dapat dipahami dengan sedikit berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Hagar
  rationale: δέ dipahami sebagai penghubung ringan dalam alur argumen dan tidak perlu dinyatakan tersendiri. Artikel τὸ sebelum nama Hagar menimbulkan konstruksi yang sulit; teks utama dibuat wajar dalam bahasa Indonesia, sementara alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: Σινᾶ ὄρος
  choice: Gunung Sinai
  rationale: Urutan yang baku dan alami dalam bahasa Indonesia, dengan tetap mempertahankan identifikasi langsung dalam alegori Paulus.
- source_word: ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: adalah ... di tanah Arab
  rationale: Menyatakan lokasi geografis secara ringkas tanpa mempersempitnya secara anakronistis pada batas provinsi tertentu.
- source_word: συστοιχεῖ
  choice: sejajar dengan
  rationale: Kata kerja ini menggambarkan dua hal yang berada dalam baris, golongan, atau sisi yang sama. 'Sejajar dengan' mempertahankan gambaran korespondensi alegoris tanpa menjelaskannya secara berlebihan.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: Yerusalem yang sekarang
  rationale: νῦν menyatakan Yerusalem pada masa kini Paulus dan membedakannya dari 'Yerusalem yang di atas' pada ayat berikutnya.
- source_word: δουλεύει
  choice: hidup dalam perbudakan
  rationale: Mengungkapkan keadaan sebagai budak secara alami dan jelas, sekaligus mempertahankan kontras perbudakan dan kemerdekaan dalam perikop ini.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: bersama anak-anaknya
  rationale: μετά dengan genitif menunjukkan kebersamaan, sedangkan τέκνα tetap dipertahankan sebagai 'anak-anak' dalam hubungan keluarga dan alegoris.
theological_decisions:
- issue: Identifikasi alegoris Hagar dengan Sinai dan Yerusalem
  choice: 'Mempertahankan pernyataan langsung: ''Hagar adalah Gunung Sinai ... dan ia sejajar dengan Yerusalem yang sekarang.'''
  alternative: 'Menafsirkan secara lebih eksplisit: ''Hagar melambangkan Gunung Sinai.'''
  rationale: Bahasa Yunani memakai konstruksi ekuatif langsung, kemudian kata kerja yang menyatakan kesejajaran. Terjemahan tidak melunakkan identifikasi Paulus dan tidak menambahkan penjelasan yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tanah Arab' dipilih sebagai ungkapan geografis yang alami; 'Yerusalem yang sekarang' menjaga kontras temporal dengan ayat berikutnya; dan 'hidup dalam perbudakan' mempertahankan bobot metafora budak tanpa terdengar kaku.
