  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: id
  text: Jadi, apakah aku telah menjadi musuh kalian karena menyampaikan kebenaran kepada kalian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena berkata benar kepada kalian?” Partisipel Yunani ἀληθεύων dapat berarti “berkata dengan benar” atau “menyampaikan kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Konjungsi ini menarik kesimpulan retoris dari uraian sebelumnya; “Jadi” alami dan tepat dalam bahasa Indonesia.
- source_word: ἐχθρὸς ὑμῶν
  choice: musuh kalian
  rationale: ἐχθρός dipakai secara substantival dengan genitif ὑμῶν, sehingga frasa ini secara alami berarti “musuh kalian.”
- source_word: γέγονα
  choice: telah menjadi
  rationale: Bentuk perfek γίνομαι menyatakan perubahan yang telah terjadi dengan keadaan yang masih berlaku; “telah menjadi” mempertahankan nuansa itu.
- source_word: ἀληθεύων ὑμῖν
  choice: karena menyampaikan kebenaran kepada kalian
  rationale: Partisipel ini dapat menyatakan sebab atau sarana dan merujuk pada komunikasi yang benar kepada jemaat Galatia. “Menyampaikan kebenaran” terdengar alami tanpa membatasi maknanya hanya pada satu tindakan berkata.
theological_decisions:
- issue: Makna ἀληθεύων dalam pertanyaan retoris Paulus
  choice: Paulus bertanya apakah penyampaian kebenaran kepada jemaat Galatia telah membuatnya menjadi musuh mereka.
  alternative: Paulus bertanya apakah sikapnya yang berlaku benar terhadap mereka telah membuatnya menjadi musuh mereka.
  rationale: Konteks menekankan teguran dan perkataan Paulus kepada mereka, tetapi verba Yunani juga dapat menunjuk pada berkata atau bertindak benar. Terjemahan utama mengikuti konteks komunikatif, sedangkan catatan kaki menjaga alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “aku” dan “kalian” mempertahankan sapaan pribadi Paulus serta bentuk jamak ὑμῶν/ὑμῖν. Tanda tanya mempertahankan bentuk pertanyaan retoris teks Yunani.
