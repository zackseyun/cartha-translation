  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: id
  text: Tetapi kamu, Saudara-saudara[a], adalah anak-anak janji seperti Ishak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” menerjemahkan bentuk jamak maskulin dalam bahasa Yunani yang di sini merupakan sapaan kepada jemaat dan kemungkinan besar mencakup laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kamu
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit dan menonjolkan para pembaca; 'kamu' wajar dalam bahasa Indonesia dan dipahami sebagai jamak dari konteks sapaan.
- source_word: δέ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras terhadap uraian sebelumnya; 'Namun' mempertahankan fungsi wacana itu tanpa memberinya arti temporal.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Bentuk vokatif jamak maskulin yang dipakai Paulus sebagai sapaan kepada jemaat; 'Saudara-saudara' merupakan sapaan Indonesia yang alami dan bermartabat, sementara cakupan representatifnya dijelaskan dalam catatan kaki.
- source_word: κατὰ Ἰσαὰκ
  choice: seperti Ishak
  rationale: 'κατά di sini menunjukkan kesesuaian atau pola: para pembaca dibandingkan dengan Ishak. ''Seperti Ishak'' menyampaikan idiom tersebut dengan alami.'
- source_word: ἐπαγγελίας
  choice: perjanjian
  rationale: Genitif ini menerangkan 'anak-anak'. 'Anak-anak perjanjian' mempertahankan ungkapan Paulus dan kaitannya dengan janji Allah, tanpa mengubahnya menjadi parafrasa.
- source_word: τέκνα
  choice: anak-anak
  rationale: Nomina jamak netral yang menekankan status sebagai anak, bukan jenis kelamin; padanan ini akurat dan alami.
- source_word: ἐστέ
  choice: adalah
  rationale: Kopula orang kedua jamak kini yang menghubungkan para pembaca dengan predikat 'anak-anak perjanjian'.
theological_decisions:
- issue: Penyamaan para pembaca dengan Ishak dalam argumen alegoris Paulus
  choice: '''kamu adalah anak-anak perjanjian seperti Ishak'' mempertahankan baik status para pembaca maupun perbandingan dengan Ishak.'
  alternative: '''kamu, seperti Ishak, adalah anak-anak yang dijanjikan'''
  rationale: Susunan Yunani menjadikan Ishak sebagai pola perbandingan dan 'anak-anak perjanjian' sebagai predikat. Terjemahan ini tidak mempersempit janji menjadi sekadar janji tentang kelahiran mereka dan tidak menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Saudara-saudara' mempertahankan bentuk sumber sekaligus tetap lazim bagi pembaca umum; catatan kaki menjelaskan cakupan jemaatnya. Penempatan 'seperti Ishak' di akhir menghindari kesan bahwa hanya Ishak—bukan para pembaca—yang disebut anak perjanjian.
