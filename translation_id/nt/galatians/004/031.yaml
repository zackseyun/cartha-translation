  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: id
  text: Jadi, Saudara-saudara[a], kita bukanlah anak-anak dari perempuan budak[b], melainkan dari perempuan merdeka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” secara harfiah berarti saudara laki-laki, tetapi dapat dipakai untuk menyapa kelompok yang mencakup laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “hamba perempuan”; istilah Yunani menunjuk kepada seorang perempuan yang berstatus budak atau hamba, dan di sini mengacu kepada Hagar dalam kontras dengan Sara (Gal. 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian alegoris sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya inferensialnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara harfiah berbentuk maskulin, tetapi dalam konteks jemaat dapat mewakili laki-laki dan perempuan; 'Saudara-saudara' merupakan sapaan Indonesia yang wajar dan bermartabat.
- source_word: οὐκ ἐσμὲν
  choice: kita bukanlah
  rationale: Menerjemahkan negasi dengan verba kini secara langsung tanpa menambahkan gagasan waktu seperti 'tidak lagi'; partikel '-lah' menegaskan kontras secara alami.
- source_word: παιδίσκης
  choice: dari perempuan budak
  rationale: Status perbudakan Hagar penting bagi kontras argumentasi Paulus; 'perempuan budak' lebih tepat daripada ungkapan yang dapat melunakkan status tersebut.
- source_word: τέκνα
  choice: anak-anak
  rationale: Istilah ini mencakup anak dari kedua jenis kelamin dan paling alami diterjemahkan 'anak-anak'.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Sesudah penyangkalan 'bukan', 'melainkan' menyatakan kontras korektif secara lebih idiomatis daripada 'tetapi'.
- source_word: τῆς ἐλευθέρας
  choice: dari perempuan merdeka
  rationale: Artikel dan adjektiva feminin dipakai secara substantival serta merujuk kepada Sara; 'perempuan merdeka' membuat rujukan feminin dan kontras statusnya jelas.
theological_decisions:
- issue: Seberapa eksplisit kontras alegoris antara Hagar dan Sara harus diterjemahkan
  choice: perempuan budak ... perempuan merdeka
  alternative: hamba perempuan ... perempuan merdeka
  rationale: Kontras antara perbudakan dan kemerdekaan merupakan unsur utama dalam argumentasi Galatia 4:21–31. Pilihan ini mempertahankan ketajaman kontras tanpa menambahkan klaim teologis di luar teks.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara dalam teks utama dengan catatan mengenai cakupan campuran
  alternative: saudara-saudara laki-laki dan perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dapat menyapa seluruh jemaat secara representatif. Terjemahan utama mempertahankan bentuk sapaan familial yang alami, sementara catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Struktur 'bukanlah ... melainkan ...' mempertahankan kontras retoris ayat. Istilah 'perempuan budak' dipilih untuk menyatakan status sosial secara jelas, sedangkan 'perempuan merdeka' mempertahankan kesejajaran ungkapan.
