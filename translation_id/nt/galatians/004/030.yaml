id: GAL.4.30
reference: Galatians 4:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: id
  text: Namun, apa kata Kitab Suci? “Usirlah perempuan budak itu[a] dan anak laki-lakinya, sebab anak laki-laki dari perempuan budak itu sama sekali tidak akan menerima warisan[c] bersama dengan anak laki-laki dari perempuan merdeka itu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba perempuan.” Kata Yunani ini menunjuk kepada seorang perempuan berstatus budak atau hamba; “perempuan budak” dipakai karena kontras antara perbudakan dan kemerdekaan merupakan pokok penting dalam bagian ini.
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini menggemakan Kejadian 21:10.
    reason: cross_reference
  - marker: c
    text: 'Bahasa Yunani memakai penyangkalan yang sangat tegas: “sama sekali tidak akan menerima warisan”; dapat juga diterjemahkan “pasti tidak akan mewarisi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai peralihan yang berlawanan dengan argumen sebelumnya secara alami dalam bahasa Indonesia.
- source_word: τί λέγει ἡ γραφή
  choice: apa kata Kitab Suci?
  rationale: Mempertahankan rumusan kutipan yang mempersonifikasikan Kitab Suci; bentuk idiomatis Indonesia memakai 'kata'.
- source_word: Ἔκβαλε
  choice: Usirlah
  rationale: Menyampaikan imperatif tegas ἐκβάλλω dan lebih kuat daripada 'suruhlah pergi'.
- source_word: παιδίσκην
  choice: perempuan budak
  rationale: Menunjukkan status perbudakan yang penting bagi kontras budak–merdeka dalam konteks, tanpa memakai istilah arkais.
- source_word: υἱὸν αὐτῆς
  choice: anaknya
  rationale: Padanan alami dan ringkas bagi konstruksi posesif Yunani; υἱός di sini memang anak laki-laki, tetapi bahasa Indonesia lazim memakai 'anak' ketika jenis kelamin sudah jelas dari konteks atau tidak perlu ditonjolkan.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: sebab ... sama sekali tidak akan menerima warisan
  rationale: Menyampaikan penyangkalan emfatis οὐ μή dengan bentuk masa depan dan mengungkapkan makna κληρονομέω secara wajar.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: bersama dengan anak perempuan merdeka itu
  rationale: Mempertahankan gagasan keikutsertaan dalam warisan dan melengkapi nomina yang tersirat pada adjektiva substantival τῆς ἐλευθέρας.
theological_decisions:
- issue: Terjemahan παιδίσκη dalam alegori Hagar–Sara
  choice: perempuan budak
  alternative: hamba perempuan; perempuan yang diperbudak
  rationale: Kontras teologis dalam konteks bertumpu pada perbudakan dan kemerdekaan. Pilihan ini menyatakan status tersebut secara jelas tanpa menambahkan tafsir denominasi.
- issue: Kekuatan penolakan οὐ γὰρ μὴ κληρονομήσει
  choice: sama sekali tidak akan menerima warisan
  alternative: pasti tidak akan mewarisi; tidak mungkin akan menerima warisan
  rationale: Menjaga sifat kategoris penyangkalan Yunani tanpa memperluas implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. 'Kitab Suci' mempertahankan formula otoritatif; 'usirlah' menjaga ketajaman perintah. Penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
