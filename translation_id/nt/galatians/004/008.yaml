  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: id
  text: Namun, dahulu, ketika kamu tidak mengenal Allah, kamu diperbudak oleh mereka yang pada hakikatnya bukan allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun pada waktu itu, tanpa mengenal Allah, kamu menjadi hamba bagi mereka yang secara kodrati bukan allah.”'
    reason: Alternatif ini mempertahankan susunan yang lebih harfiah bagi τότε μὲν, partisipel οὐκ εἰδότες, verba ἐδουλεύσατε, dan φύσει.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: τότε μὲν
  choice: dahulu
  rationale: Menunjuk pada masa lampau orang-orang Galatia dan mengantisipasi kontras pada ayat berikutnya; 'dahulu' lebih alami daripada terjemahan harfiah 'pada waktu itu'.
- source_word: οὐκ εἰδότες θεὸν
  choice: ketika kamu belum mengenal Allah
  rationale: Konstruksi partisipial dipahami secara temporal. 'Mengenal' mempertahankan nuansa pengetahuan relasional, sedangkan 'belum' menyatakan keadaan pada masa lampau secara wajar tanpa mengubah maksud.
- source_word: ἐδουλεύσατε
  choice: kamu diperhamba
  rationale: Mempertahankan gagasan perbudakan yang penting dalam argumen Galatia tentang perhambaan dan kemerdekaan, lebih kuat daripada sekadar 'melayani'.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: oleh mereka yang ... bukanlah allah
  rationale: Tidak menentukan apakah acuannya berhala, kuasa rohani, atau sesuatu yang lain. 'Mereka' menjaga keterbukaan acuan, sementara huruf kecil pada 'allah' membedakannya dari Allah yang sejati.
- source_word: φύσει μὴ
  choice: pada hakikatnya bukanlah
  rationale: Mengungkapkan penyangkalan ontologis bahwa yang diperhamba itu bukan allah dalam kenyataannya, dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Hakikat objek-objek yang dahulu diperhamba
  choice: mereka yang pada hakikatnya bukanlah allah
  alternative: mereka yang sebenarnya bukan allah; yang secara kodrati bukan allah
  rationale: Terjemahan mempertahankan penyangkalan Paulus mengenai status ilahi mereka tanpa menetapkan bahwa mereka khususnya berhala atau kuasa setan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Kamu' mengikuti sapaan jamak konteks surat tetapi tidak menandai jumlah dalam bahasa Indonesia. 'Allah' memakai huruf kapital untuk Allah yang sejati, sedangkan 'allah' memakai huruf kecil bagi objek-objek yang status ilahinya disangkal.
