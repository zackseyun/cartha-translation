  source_fidelity: 'Makna pokok sudah tepat: Paulus mengontraskan keadaan lampau ketika para pembaca tidak mengenal Allah dengan perhambaan kepada pihak-pihak yang pada hakikatnya bukan allah. Namun, «diperhamba» kurang lazim dalam bahasa Indonesia baku modern; «diperbudak» menyampaikan daya perhambaan dari ἐδουλεύσατε secara lebih jelas dan alami. Mengganti «belum mengenal» dengan «tidak mengenal» juga lebih langsung mencerminkan οὐκ εἰδότες tanpa menambahkan nuansa aspek yang tidak perlu.'
