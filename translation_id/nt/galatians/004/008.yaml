  terminology: «Allah» tepat untuk θεόν, dan «allah» huruf kecil tepat untuk θεοῖς yang dinafikan. «Pada hakikatnya bukan allah» merupakan padanan wajar bagi φύσει μὴ οὖσι θεοῖς dan mempertahankan penyangkalan tentang hakikat, tanpa penafsiran tambahan.
