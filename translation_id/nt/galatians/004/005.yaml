id: GAL.4.5
reference: Galatians 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: id
  text: supaya Ia menebus mereka yang berada di bawah hukum Taurat, supaya kita menerima pengangkatan sebagai anak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, istilah Yunani ini menunjuk pada pengangkatan ke dalam kedudukan sebagai anak laki-laki, yang dalam dunia kuno menonjolkan status penuh sebagai anggota keluarga dan hak waris. Yang dimaksud mencakup semua orang percaya, baik perempuan maupun laki-laki.
    reason: Menjelaskan nuansa historis dan hak waris dalam υἱοθεσία serta cakupannya yang inklusif.
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: supaya … supaya
  rationale: Pengulangan konjungsi tujuan dipertahankan karena membentuk dua klausa tujuan yang sejajar dan terdengar wajar dalam bahasa Indonesia.
- source_word: τοὺς ὑπὸ νόμον
  choice: mereka yang berada di bawah hukum Taurat
  rationale: Frasa ini menunjuk kepada orang-orang yang berada di bawah kewenangan hukum. Dalam konteks Galatia 4, νόμος paling alami dipahami sebagai hukum Musa, sehingga 'hukum Taurat' memberi kejelasan kontekstual tanpa menjadikannya sekadar hukum secara abstrak.
- source_word: ἐξαγοράσῃ
  choice: menebus
  rationale: '''Menebus'' mempertahankan nuansa pembebasan dengan pembayaran yang terkandung dalam kata Yunani dan merupakan istilah Indonesia yang jelas serta mapan.'
- source_word: τὴν υἱοθεσίαν
  choice: pengangkatan sebagai anak
  rationale: Ungkapan ini menyampaikan tindakan pemberian kedudukan penuh dalam keluarga. Kata Yunani berlatar kedudukan anak laki-laki dengan hak waris, tetapi cakupannya dalam konteks ini meliputi semua orang percaya; catatan kaki mempertahankan nuansa tersebut tanpa membuat teks utama terasa janggal atau seolah-olah hanya mencakup laki-laki.
- source_word: ἀπολάβωμεν
  choice: kita menerima
  rationale: '''Menerima'' merupakan padanan alami bagi verba ini dalam konteks memperoleh kedudukan yang dianugerahkan; nuansa ''menerima kembali'' tidak menonjol di sini.'
theological_decisions:
- issue: Nuansa gender dan hak waris dalam υἱοθεσία
  choice: pengangkatan sebagai anak
  alternative: pengangkatan sebagai anak laki-laki; status sebagai anak
  rationale: Teks utama memakai bahasa Indonesia yang inklusif dan alami, sedangkan catatan menjelaskan bahwa istilah Yunani menyoroti kedudukan anak laki-laki dengan hak waris penuh dalam latar dunia kuno. Dengan demikian, unsur historis-teologisnya tidak hilang dan perempuan tidak terkesan dikecualikan.
- issue: Acuan frasa 'di bawah hukum'
  choice: hukum Taurat, yakni hukum Musa
  alternative: hukum dalam arti umum
  rationale: Konteks langsung Galatia 4:4–5 dan pemakaian νόμος dalam surat ini mendukung acuan utama kepada hukum Musa, meskipun implikasi karya penebusan dan pengangkatan kemudian mencakup identitas bersama orang percaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'supaya' mempertahankan struktur retoris Yunani. 'Hukum Taurat' dipilih untuk memperjelas acuan kontekstual νόμος, dan kapitalisasi 'Ia' mengikuti kebiasaan hormat bagi rujukan kepada Kristus.
source_grounding:
  english_pob_role: consult_only
