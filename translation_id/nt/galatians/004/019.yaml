id: GAL.4.19
reference: Galatians 4:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: id
  text: Anak-anakku, untuk kalian aku sekali lagi merasakan sakit bersalin[c] sampai Mesias[a] terbentuk di dalam kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” “Mesias” menerjemahkan gelar Χριστός; “Kristus” merupakan padanan tradisional yang sudah akrab.
    reason: alternative_reading
  - marker: b
    text: Atau, “di antara kalian,” yang menonjolkan kemungkinan bahwa pembentukan itu dimaksudkan secara komunal.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “aku sekali lagi mengalami sakit bersalin” atau “aku sekali lagi sedang bersalin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Anak-anakku
  rationale: Sapaan jamak ini menyatakan kasih sayang Paulus secara alami tanpa menambahkan gagasan ‘kecil’ yang tidak dinyatakan secara eksplisit.
- source_word: οὓς
  choice: untuk kalian
  rationale: Bentuk akusatif relatif ini menjadi sasaran metafora persalinan; ‘untuk kalian’ mempertahankan hubungannya dengan sakit bersalin dan terdengar alami dalam bahasa Indonesia.
- source_word: πάλιν
  choice: sekali lagi
  rationale: Menandai pengulangan tindakan atau pengalaman Paulus.
- source_word: ὠδίνω
  choice: merasakan sakit bersalin
  rationale: Mempertahankan gambaran maternal yang kuat tentang sakit dan perjuangan melahirkan, sekaligus memakai ungkapan Indonesia yang mudah dipahami.
- source_word: μέχρις οὗ
  choice: sampai
  rationale: Menyatakan batas atau tujuan waktu dari metafora Paulus secara ringkas dan alami.
- source_word: μορφωθῇ
  choice: terbentuk
  rationale: Mempertahankan bentuk pasif dan gambaran tentang Mesias yang mengambil bentuk dalam diri atau kehidupan para pembaca.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός dengan padanan maknanya; ‘Kristus’ dicatat sebagai alternatif yang sudah akrab.
- source_word: ἐν ὑμῖν
  choice: di dalam kalian
  rationale: Mempertahankan arti paling langsung dari ἐν dan bentuk jamak ὑμῖν, sambil membiarkan kemungkinan dimensi batiniah sekaligus komunal tetap terbuka.
theological_decisions:
- issue: Makna Mesias terbentuk di dalam kalian
  choice: Metafora pembentukan dipertahankan tanpa dijabarkan menjadi mekanisme doktrinal tertentu.
  alternative: Mesias terbentuk di antara kalian sebagai suatu komunitas, atau ungkapan ini terutama menunjuk pada pertobatan dan kelahiran baru.
  rationale: Bahasa Yunani memungkinkan nuansa pribadi dan komunal. Terjemahan utama mengikuti arti langsung ‘di dalam kalian’, sedangkan catatan kaki menjaga kemungkinan arti korporat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Bentuk ‘kalian’ dipakai karena sapaan Yunani berbentuk jamak dan untuk menghindari ketaksaan ‘kamu’. Metafora persalinan dipertahankan secara gamblang.
