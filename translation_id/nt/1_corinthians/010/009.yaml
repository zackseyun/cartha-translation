  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: id
  text: Dan janganlah kita menguji Mesias,[a] seperti beberapa dari mereka menguji Dia dan dibinasakan oleh ular-ular.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah membaca “Tuhan”, bukan “Mesias” (atau “Kristus”).
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Janganlah kita juga
  rationale: Melanjutkan rangkaian larangan dalam konteks dan mempertahankan daya ajakan orang pertama jamak.
- source_word: ἐκπειράζωμεν
  choice: menguji
  rationale: Mengungkapkan tindakan menempatkan seseorang pada pengujian yang tidak patut; lebih tepat daripada 'mencobai' ketika objeknya ialah Mesias.
- source_word: τὸν Χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Mesias' menerjemahkan maknanya secara alami dalam bahasa Indonesia.
- source_word: καθώς
  choice: seperti
  rationale: Memperkenalkan perbandingan dengan tindakan sebagian orang Israel di padang gurun.
- source_word: τινες αὐτῶν
  choice: beberapa dari mereka
  rationale: Padanan yang jelas dan langsung bagi sebagian dari kelompok yang dibicarakan.
- source_word: ἐπείρασαν
  choice: telah menguji Dia
  rationale: Menyatakan tindakan historis, dengan objek yang tersirat dari klausa sebelumnya dijadikan eksplisit demi kejelasan bahasa Indonesia.
- source_word: ὑπὸ τῶν ὄφεων
  choice: oleh ular-ular
  rationale: ὄφις berarti ular; bentuk ulang menyampaikan jamak secara wajar.
- source_word: ἀπώλλυντο
  choice: sedang dibinasakan
  rationale: Mempertahankan nuansa imperfek sebagai proses yang sedang berlangsung serta bentuk pasif dari teks Yunani.
theological_decisions:
- issue: Rujukan dan varian tekstual τὸν Χριστόν
  choice: Mesias
  alternative: Tuhan; Kristus
  rationale: Teks SBLGNT membaca Χριστόν, sehingga gelar itu diterjemahkan 'Mesias' tanpa mengurangi ketegangan teologis hubungan Mesias dengan peristiwa padang gurun. Varian penting 'Tuhan' dicatat, sedangkan 'Kristus' merupakan transliterasi konvensional dari gelar yang sama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk ajakan larangan, hubungan perbandingan, serta aspek berlangsung pada verba terakhir tanpa terdengar terlalu teknis.
