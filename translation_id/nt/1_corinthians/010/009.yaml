  to: Dan janganlah kita menguji Mesias,[a] seperti beberapa dari mereka menguji Dia dan dibinasakan oleh ular-ular.
  rationale: Revisi memperbaiki keluwesan pembukaan, menghindari pemaksaan aspek dengan “sedang” dalam bahasa Indonesia, dan menghapus catatan leksikal yang memasukkan sifat “berbisa” tanpa dukungan dari ὄφις. Varian tekstual penting “Tuhan” tetap diberi penanda [a].
