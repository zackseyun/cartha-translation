    rationale: Kata Yunani ὄφις berarti “ular”; unsur “berbisa” tidak dikandung oleh kata tersebut. Walaupun latar kisah Bilangan melibatkan ular berbisa, catatan ini tidak boleh memasukkan rincian itu sebagai alternatif leksikal dari ayat ini.
  - severity: low
    issue: Pembukaan “Janganlah kita juga” kurang idiomatis.
    rationale: μηδέ melanjutkan larangan sebelumnya dan lebih wajar diterjemahkan “Dan janganlah kita” dalam bahasa Indonesia modern.
  - severity: low
    issue: Keterangan aspek “sedang” terdengar kaku dalam narasi lampau Indonesia.
    rationale: Imperfek Yunani menunjukkan peristiwa yang berlangsung, tetapi bahasa Indonesia tidak wajib menandainya dengan “sedang” di sini. “Dibinasakan” mempertahankan diatesis pasif dan menghasilkan kalimat yang lebih wajar.
  revised_text: Dan janganlah kita menguji Mesias,[a] seperti beberapa dari mereka menguji Dia dan dibinasakan oleh ular-ular.
