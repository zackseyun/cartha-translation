source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: id
  text: Jangan pula bersungut-sungut, seperti beberapa orang di antara mereka telah bersungut-sungut dan dibinasakan oleh sang pembinasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh malaikat pembinasa.” Teks Yunani berbunyi “oleh sang pembinasa,” yang mungkin merujuk kepada pelaku pembinasaan dalam penghukuman atas Israel di padang gurun.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Janganlah juga
  rationale: Dalam rangkaian larangan ini, μηδέ menghubungkan perintah tersebut dengan peringatan sebelumnya. “Janganlah juga” mempertahankan daya penghubung itu secara alami dalam bahasa Indonesia.
- source_word: γογγύζετε
  choice: bersungut-sungut
  rationale: Kata ini menyatakan keluhan tidak puas dan menggemakan sungut-sungut Israel di padang gurun; padanan ini lebih khas daripada sekadar “mengeluh”.
- source_word: καθάπερ
  choice: seperti
  rationale: Menandai perbandingan dengan teladan negatif Israel secara jelas dan alami.
- source_word: τινὲς αὐτῶν
  choice: beberapa orang dari antara mereka
  rationale: 'Mempertahankan nuansa partitif: yang dimaksud ialah sebagian dari kelompok Israel yang dibicarakan dalam konteks sebelumnya.'
- source_word: ἐγόγγυσαν
  choice: bersungut-sungut
  rationale: Padanan yang sama dipakai untuk menjaga hubungan verbal langsung dengan larangan sebelumnya.
- source_word: ἀπώλοντο
  choice: dibinasakan
  rationale: Bentuk ini cocok dengan frasa pelaku berikutnya dan menyatakan bahwa kebinasaan menimpa mereka melalui suatu pelaku.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: oleh sang pembinasa
  rationale: Bahasa Yunani memakai nomina substantival “pembinasa” tanpa secara eksplisit menyebut malaikat. “Sang” menandai sosok tertentu tanpa menentukan identitasnya lebih jauh.
theological_decisions:
- issue: Identitas ὁ ὀλοθρευτής
  choice: sang pembinasa
  alternative: malaikat pembinasa
  rationale: Teks hanya menyebut pelaku itu dengan gelar “pembinasa.” Terjemahan utama tidak menambahkan identitas yang tidak dinyatakan secara eksplisit, sedangkan kemungkinan bahwa yang dimaksud ialah malaikat pembinasa dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. “Bersungut-sungut” dipertahankan karena masih dapat dipahami dan kuat dalam konteks kisah Israel; “sang pembinasa” mempertahankan ambiguitas sumber.
