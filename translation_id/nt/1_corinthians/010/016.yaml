id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: id
  text: Cawan berkat yang kita berkati, bukankah itu merupakan keikutsertaan dalam darah Mesias? Roti yang kita pecahkan, bukankah itu merupakan keikutsertaan dalam tubuh Mesias?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “turut mengambil bagian dalam” atau “persekutuan dalam.” Secara tradisional: “persekutuan dengan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Yunani Christou; di sini diterjemahkan “Mesias” karena Christos berfungsi sebagai gelar. Secara tradisional: “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: cawan
  rationale: “Cawan” adalah padanan Indonesia yang wajar dan bermartabat dalam konteks perjamuan, tanpa memasukkan istilah gerejawi yang lebih teknis.
- source_word: τῆς εὐλογίας
  choice: berkat
  rationale: Padanan langsung ini mempertahankan nomina εὐλογία serta kemungkinan latar pengucapan berkat dalam perjamuan Yahudi.
- source_word: ὃ εὐλογοῦμεν
  choice: yang kita berkati
  rationale: Terjemahan langsung mempertahankan pengulangan akar kata dengan “berkat” dan tidak mempersempit maknanya menjadi ucapan syukur saja.
- source_word: οὐχὶ
  choice: bukankah
  rationale: Bentuk ini secara alami menyampaikan pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: κοινωνία
  choice: persekutuan dalam
  rationale: Ungkapan ini mempertahankan gagasan keterlibatan atau pengambilan bagian yang nyata, tanpa menentukan bagaimana tepatnya hubungan sakramental itu berlangsung.
- source_word: τοῦ αἵματος
  choice: darah
  rationale: Padanan langsung mempertahankan bobot perjanjian dan pengorbanan dari ungkapan Yunani.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi dalam konteks ini; “Mesias” mempertahankan makna gelar tersebut.
- source_word: τὸν ἄρτον
  choice: roti
  rationale: “Roti” adalah padanan umum dan tidak menentukan bahwa yang dimaksud harus satu ketul roti tertentu.
- source_word: ὃν κλῶμεν
  choice: yang kita pecahkan
  rationale: Padanan ini mempertahankan tindakan konkret dalam perjamuan tanpa tambahan penafsiran.
- source_word: τοῦ σώματος
  choice: tubuh
  rationale: Terjemahan langsung mempertahankan bobot kristologis dan sakramental frasa tersebut tanpa mempersempitnya secara doktrinal.
theological_decisions:
- issue: Makna κοινωνία dalam konteks perjamuan
  choice: persekutuan dalam
  alternative: keikutsertaan dalam; turut mengambil bagian dalam
  rationale: Pilihan ini menyatakan hubungan partisipatif dengan darah dan tubuh Mesias, tetapi tidak memutuskan perdebatan tentang cara kehadiran atau hakikat sakramen.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini gelar “Yang Diurapi” tetap bermakna; karena itu “Mesias” dipakai, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Pengulangan “berkat—berkati” sengaja dipertahankan dari εὐλογία—εὐλογοῦμεν. Susunan dua pertanyaan retoris yang sejajar juga dipertahankan.
