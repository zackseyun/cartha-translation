  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: id
  text: sebagaimana aku juga menyenangkan semua orang dalam segala hal[a], tidak mencari keuntunganku sendiri, melainkan keuntungan banyak orang[b], supaya mereka diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “semua orang dalam segala hal.” Ungkapan Yunani ini menyatakan luasnya penyesuaian diri demi kebaikan orang lain.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “manfaatku sendiri, melainkan manfaat banyak orang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: sebagaimana aku juga
  rationale: Mempertahankan daya pembanding καθὼς dan unsur 'juga' dalam κἀγώ, yang menghubungkan teladan Paulus dengan nasihat sebelumnya.
- source_word: πάντα πᾶσιν
  choice: semua orang dalam segala hal
  rationale: Mencerminkan gabungan πᾶσιν dan πάντα secara dekat serta menyatakan luasnya penyesuaian Paulus tanpa menyamakan ungkapan ini dengan rumusan berbeda dalam 9:22.
- source_word: ἀρέσκω
  choice: berusaha menyenangkan
  rationale: Dalam bahasa Indonesia, tambahan 'berusaha' membuat bentuk kini dan maksud tindakan ini terdengar alami, sementara 'menyenangkan' mempertahankan arti dasar verba. Konteks berikutnya menunjukkan bahwa yang dimaksud bukan mencari pujian.
- source_word: μὴ ζητῶν
  choice: dengan tidak mencari
  rationale: Partisipel ini menerangkan cara atau motif tindakan Paulus; 'dengan tidak mencari' mengungkapkan hubungan tersebut secara alami.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: keuntungan diriku sendiri
  rationale: σύμφορον menunjuk pada sesuatu yang menguntungkan atau bermanfaat. Pilihan ini mempertahankan kontras langsung dengan keuntungan banyak orang.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: melainkan keuntungan banyak orang
  rationale: Nomina yang dilesapkan dalam bahasa Yunani dinyatakan kembali agar jelas dalam bahasa Indonesia, sedangkan οἱ πολλοί tetap diterjemahkan sebagai 'banyak orang'.
- source_word: ἵνα σωθῶσιν
  choice: supaya mereka diselamatkan
  rationale: Mempertahankan klausa tujuan dan bentuk pasif σωθῶσιν tanpa menambahkan pelaku yang tidak disebutkan dalam ayat.
theological_decisions:
- issue: Cakupan dan arti σωθῶσιν
  choice: supaya mereka diselamatkan
  alternative: supaya mereka ditolong atau dipelihara
  rationale: Dalam konteks Paulus dan tujuan penginjilan di bagian ini, verba tersebut mempunyai arti keselamatan. Bentuk pasif dipertahankan tanpa menjelaskan secara berlebihan siapa pelakunya.
- issue: Arti Paulus 'menyenangkan' semua orang
  choice: berusaha menyenangkan semua orang demi keuntungan mereka
  alternative: mencari persetujuan manusia atau berkompromi demi disukai
  rationale: 'Klausa ''dengan tidak mencari keuntungan diriku sendiri, melainkan keuntungan banyak orang'' menentukan maksud ἀρέσκω: Paulus menyesuaikan diri demi kebaikan dan keselamatan orang lain, bukan demi memperoleh pujian.'
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'aku' mengikuti suara pribadi Paulus. Susunan kalimat mempertahankan perbandingan, kontras motif, dan klausa tujuan dari teks Yunani.
