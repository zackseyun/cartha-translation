base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: id
  text: Karena ada satu roti[a], kita yang banyak ini adalah satu tubuh, sebab kita semua mengambil bagian dari satu roti itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu roti utuh” dalam kedua kemunculan “satu roti.” Kata Yunani ἄρτος dapat menunjuk pada roti sebagai makanan atau pada satu roti utuh; pilihan kedua dapat memperjelas gambaran banyak orang berbagi dari satu sumber.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Karena
  rationale: Mengungkapkan hubungan sebab atau dasar penjelasan dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: εἷς ἄρτος
  choice: rotinya satu
  rationale: Mempertahankan arti dasar ἄρτος sebagai roti sekaligus menonjolkan jumlahnya yang satu; susunan ini alami dalam bahasa Indonesia dan menjaga gema konteks Perjamuan Tuhan.
- source_word: ἓν σῶμα
  choice: satu tubuh
  rationale: Padanan langsung yang mempertahankan kepadatan makna komunal dan sakramental tanpa menafsirkannya secara berlebihan.
- source_word: οἱ πολλοί
  choice: kita yang banyak ini
  rationale: Menyatakan kemajemukan para anggota dan mempertahankan kontras dengan 'satu tubuh'; kata 'ini' membuat ungkapan tersebut lebih wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai klausa kedua sebagai penjelasan bagi kesatuan tubuh.
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan penekanan bahwa seluruh kelompok bersama-sama turut mengambil bagian.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: dari roti yang satu itu
  rationale: 'Mempertahankan ἐκ sebagai penanda sumber: semua orang mengambil bagian dari roti yang sama dan tunggal.'
- source_word: μετέχομεν
  choice: mengambil bagian
  rationale: Ungkapan Indonesia yang alami untuk partisipasi nyata bersama dan sesuai dengan konteks makan tanpa memakai diksi yang terlalu teknis.
theological_decisions:
- issue: Hubungan antara roti yang satu dan tubuh yang satu
  choice: Mempertahankan kaitan sebab-akibat antara partisipasi bersama dalam satu roti dan kesatuan orang percaya.
  alternative: Menjelaskan roti hanya sebagai lambang kesatuan, atau menyatakan secara eksplisit bahwa roti menghasilkan kesatuan secara sakramental.
  rationale: Teks Yunani menghubungkan roti yang satu, tindakan mengambil bagian, dan tubuh yang satu, tetapi tidak merumuskan ontologi Perjamuan Tuhan menurut perdebatan denominasi kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'satu' dipertahankan untuk menjaga penekanan retoris teks Yunani; 'roti' dipilih dalam teks utama karena paling alami, sedangkan 'satu ketul roti' dicatat sebagai alternatif leksikal.
