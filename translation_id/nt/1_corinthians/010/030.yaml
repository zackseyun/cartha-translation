  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: id
  text: Jika aku mengambil bagian dengan rasa syukur[a], mengapa aku dicela karena hal yang kusyukuri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika aku mengambil bagian oleh anugerah, mengapa aku dicela karena hal yang kusyukuri?” Kata Yunani χάριτι dapat berarti “oleh anugerah”, tetapi dalam konteks ini banyak orang memahaminya sebagai “dengan rasa syukur” karena sesudahnya terdapat ungkapan “aku mengucap syukur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: dengan rasa syukur
  rationale: Dalam konteks makan dan klausa berikutnya tentang mengucap syukur, bentuk datif ini paling wajar menyatakan sikap atau cara mengambil bagian. Namun, kemungkinan arti 'oleh anugerah' tetap dicatat.
- source_word: μετέχω
  choice: mengambil bagian
  rationale: Ungkapan ini mempertahankan gagasan berpartisipasi atau turut menikmati sesuatu dan sesuai dengan konteks menyantap makanan.
- source_word: βλασφημοῦμαι
  choice: aku dicela
  rationale: Karena manusia menjadi sasaran perkataan buruk di sini, 'dicela' menyampaikan kecaman terhadap Paulus tanpa menyiratkan penghujatan yang sasarannya harus Allah.
- source_word: ὑπὲρ οὗ
  choice: karena sesuatu yang untuknya
  rationale: Terjemahan ini mempertahankan hubungan sebab atau dasar celaan sekaligus mengaitkan pronomina relatif dengan hal yang disyukuri.
- source_word: εὐχαριστῶ
  choice: aku mengucap syukur
  rationale: Menerjemahkan verba secara langsung tanpa menambahkan objek 'kepada Allah', yang tersirat dalam konteks tetapi tidak dinyatakan dalam teks Yunani.
- source_word: ἐγὼ ... ἐγὼ
  choice: aku ... aku
  rationale: Pengulangan pronomina dipertahankan agar penekanan atau kontras dalam bahasa Yunani tetap terasa.
- source_word: τί
  choice: mengapa
  rationale: Dalam pertanyaan retoris ini, τί berfungsi idiomatis untuk menanyakan alasan.
theological_decisions:
- issue: Makna χάριτι dalam kaitannya dengan makan dan pengucapan syukur
  choice: dengan rasa syukur
  alternative: oleh anugerah
  rationale: Konteks langsung, khususnya εὐχαριστῶ ('aku mengucap syukur'), mendukung makna rasa syukur. Alternatif 'oleh anugerah' tetap mungkin secara leksikal dan dicantumkan dalam catatan agar ambiguitas sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'mengambil bagian' dipilih untuk mempertahankan cakupan μετέχω, sedangkan 'dicela' merupakan padanan alami bagi perkataan buruk yang diarahkan kepada manusia.
