base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: id
  text: Namun, Allah tidak berkenan kepada sebagian besar dari mereka, sebab mereka berguguran[a] di padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “direbahkan” atau “terhampar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan kuat dengan segala hak istimewa Israel yang disebutkan pada ayat-ayat sebelumnya, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: tidak berkenan kepada sebagian besar dari mereka
  rationale: Mengungkapkan idiom Yunani secara alami sambil mempertahankan cakupan kuantitatif bahwa yang dimaksud ialah mayoritas mereka.
- source_word: ηὐδόκησεν
  choice: berkenan
  rationale: Padanan Indonesia yang lazim untuk tindakan merasa senang atau berkenan terhadap seseorang, tanpa mempersempit maknanya menjadi persetujuan formal saja.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku dan langsung bagi subjek nominatif θεός dalam bahasa Indonesia.
- source_word: κατεστρώθησαν
  choice: ditewaskan
  rationale: Dalam konteks penghakiman atas Israel, verba pasif ini menunjuk kepada mereka yang dibaringkan mati di padang gurun; 'ditewaskan' menyampaikan akibat kematian dan daya peringatannya tanpa menentukan pelaku secara eksplisit.
- source_word: γὰρ
  choice: sebab
  rationale: Memperkenalkan alasan yang menjelaskan bahwa ketidakberkenanan Allah tampak dalam nasib mereka di padang gurun.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Ungkapan Indonesia yang baku dan bernuansa alkitabiah untuk lokasi pengembaraan Israel.
theological_decisions:
- issue: Sifat hukuman yang dinyatakan oleh κατεστρώθησαν
  choice: 'Menerjemahkannya sebagai kematian dalam penghakiman: ''ditewaskan''.'
  alternative: Terjemahan yang lebih mempertahankan gambaran jasad terbujur, seperti 'direbahkan' atau 'dibaringkan mati'.
  rationale: Konteks Paulus adalah peringatan berdasarkan kegagalan Israel dan akibatnya. 'Ditewaskan' mempertahankan daya penghakiman dan hasil fatal verba tersebut, sedangkan catatan kaki menjaga gambaran leksikal alternatif tanpa menambahkan rincian tentang cara kematian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti hubungan pertentangan dan alasan dalam teks Yunani; penanda catatan kaki ditempatkan tepat sesudah kata yang dijelaskan.
