  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: id
  text: Janganlah seorang pun mencari kepentingannya sendiri[a], melainkan kepentingan orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Janganlah seorang pun mencari apa yang menjadi miliknya sendiri, melainkan apa yang menjadi milik orang lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: Janganlah seorang pun
  rationale: Bersama bentuk imperatif ζητείτω, kata ganti tak tentu negatif ini menyatakan larangan umum. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: ζητείτω
  choice: mencari
  rationale: Kata ζητέω memiliki arti luas, seperti mencari atau mengusahakan. 'Mencari' mempertahankan kesederhanaan verba sumber tanpa mempersempitnya.
- source_word: τὸ ἑαυτοῦ
  choice: kepentingannya sendiri
  rationale: Frasa netral ini bersifat eliptis, secara harfiah berarti 'apa yang menjadi miliknya sendiri'. Dalam konteks tindakan demi manfaat sesama, 'kepentingannya sendiri' mengungkapkan maksudnya secara alami tanpa membatasinya pada keuntungan materi.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Dalam konstruksi negatif 'jangan ... melainkan ...', pilihan ini menyampaikan pertentangan korektif secara alami.
- source_word: τὸ τοῦ ἑτέρου
  choice: kepentingan orang lain
  rationale: Frasa ini juga eliptis dan mengontraskan diri sendiri dengan orang lain. Pengulangan 'kepentingan' melengkapi unsur tersirat dan menghasilkan bahasa Indonesia yang jelas.
theological_decisions:
- issue: Pelengkapan objek yang tersirat dalam τὸ ἑαυτοῦ dan τὸ τοῦ ἑτέρου
  choice: kepentingannya sendiri ... kepentingan orang lain
  alternative: apa yang menjadi miliknya sendiri ... apa yang menjadi milik orang lain
  rationale: Bahasa Yunani membiarkan objek kedua frasa ini tersirat. Konteks 1 Korintus 10:23–33 menunjuk pada manfaat atau kepentingan sesama, sehingga 'kepentingan' menyampaikan daya etis ayat tanpa mengubahnya menjadi klaim doktrinal yang lebih sempit. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat apostolik yang tegas dan bermartabat. Konstruksi 'Janganlah seorang pun ... melainkan ...' jelas bagi pembaca umum serta mempertahankan bentuk larangan dan kontras dalam teks Yunani.
