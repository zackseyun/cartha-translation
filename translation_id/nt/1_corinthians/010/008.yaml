source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: id
  text: Jangan pula kita melakukan percabulan, sebagaimana beberapa dari mereka melakukan percabulan, dan dua puluh tiga ribu[b] orang tumbang[a] dalam satu hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh”. Dalam konteks ini, kata tersebut dapat menunjuk pada kematian akibat penghukuman.
    reason: lexical_alternative
  - marker: b
    text: Bilangan 25:9 mencatat dua puluh empat ribu orang. Di sini Paulus mengatakan bahwa dua puluh tiga ribu orang tumbang “dalam satu hari”. Hal ini mungkin membedakan jumlah yang tewas pada hari itu dari jumlah keseluruhan yang lebih besar, tetapi terjemahan ini mempertahankan perkataan Paulus tanpa menyelaraskan kedua angka tersebut.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Jangan pula
  rationale: Bersama bentuk subjungtif nasihat πορνεύωμεν, μηδέ melanjutkan rangkaian larangan. “Jangan pula” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan peringatan sebelumnya.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: kita melakukan percabulan / yang dilakukan
  rationale: πορνεύω menunjuk pada perilaku seksual yang tidak bermoral. “Melakukan percabulan” mempertahankan bobot moral istilah itu tanpa membatasinya pada satu jenis tindakan tertentu; bentuk eliptis “yang dilakukan” menghindari pengulangan yang kaku tetapi tetap jelas merujuk pada percabulan.
- source_word: καθώς
  choice: seperti
  rationale: καθώς memperkenalkan perbandingan dengan perbuatan sebagian orang Israel; “seperti” merupakan padanan Indonesia yang langsung dan alami.
- source_word: τινες αὐτῶν
  choice: beberapa orang dari antara mereka
  rationale: Ungkapan ini menunjuk kepada sebagian dari kelompok Israel pada masa pengembaraan. Pilihan ini mempertahankan unsur partitifnya dengan jelas.
- source_word: καὶ
  choice: dan
  rationale: Koordinasi sederhana dipertahankan agar terjemahan tidak mengubahnya menjadi hubungan akibat yang lebih tegas daripada yang dinyatakan teks Yunani.
- source_word: ἔπεσαν
  choice: tumbang
  rationale: πίπτω secara harfiah berarti “jatuh”, tetapi dalam konteks penghukuman ini menunjuk pada kematian. “Tumbang” mempertahankan gambaran jatuh sekaligus dapat dipahami sebagai tewas; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: μιᾷ ἡμέρᾳ
  choice: dalam satu hari
  rationale: Frasa datif ini menyatakan waktu terjadinya peristiwa dan menekankan bahwa penghukuman itu terkonsentrasi dalam satu hari.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: dua puluh tiga ribu
  rationale: Angka kardinal dalam teks Yunani diterjemahkan secara langsung dan ditulis dengan huruf dalam teks berjalan.
theological_decisions:
- issue: Hubungan jumlah ini dengan Bilangan 25:9
  choice: Mempertahankan “dua puluh tiga ribu” sesuai teks 1 Korintus tanpa penyelarasan.
  alternative: Mengubahnya menjadi “dua puluh empat ribu” agar sama dengan Bilangan 25:9, atau menyatakan sebagai kepastian bahwa angka yang satu adalah jumlah satu hari dan yang lain jumlah keseluruhan.
  rationale: Teks Yunani 1 Korintus dengan jelas menyebut dua puluh tiga ribu. Terjemahan harus mempertahankan perkataan Paulus dan tidak menyelesaikan ketegangan angka secara diam-diam; kemungkinan penjelasan ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. “Jangan pula” menghubungkan ayat ini dengan rangkaian peringatan sebelumnya. “Percabulan” dipakai sebagai istilah umum bagi perilaku seksual yang tidak bermoral, sedangkan “tumbang” mempertahankan citra sumber Yunani tanpa mengaburkan bahwa konteksnya adalah kematian.
