    rationale: '''Seperti yang dilakukan oleh beberapa orang dari antara mereka'' dapat dipahami, tetapi ''sebagaimana beberapa dari mereka melakukan percabulan'' lebih alami serta mencerminkan pengulangan πορνεύω/ἐπόρνευσαν.'
