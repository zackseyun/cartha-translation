  naturalness: Susunan 'seperti yang dilakukan oleh beberapa orang dari antara mereka' dapat dibuat lebih langsung dan alami dalam bahasa Indonesia baku sambil mempertahankan pengulangan verba Yunani. Penempatan keterangan waktu setelah predikat juga lebih lancar.
  terminology: '''Percabulan'' masih merupakan istilah Alkitabiah yang dapat diterima untuk πορνεία, walaupun bernuansa formal. Catatan leksikal tentang ''tumbang'' perlu menghindari alternatif ''dibinasakan'', yang menambahkan cara/agensi secara lebih tegas daripada verba Yunani.'
