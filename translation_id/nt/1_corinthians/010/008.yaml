revisions:
- from: Jangan pula kita melakukan percabulan, seperti yang dilakukan oleh beberapa orang dari antara mereka, dan dalam satu hari dua puluh tiga ribu[b] orang tumbang[a].
  to: Jangan pula kita melakukan percabulan, sebagaimana beberapa dari mereka melakukan percabulan, dan dua puluh tiga ribu[b] orang tumbang[a] dalam satu hari.
  rationale: Revisi mempertahankan seluruh unsur sumber dan ketegangan angka dengan Bilangan 25:9, sambil membuat pengulangan verba serta urutan kalimat lebih wajar dalam bahasa Indonesia. Catatan a diperbaiki agar menjelaskan rentang idiomatis 'jatuh' tanpa menambahkan pengertian 'dibinasakan' sebagai padanan yang seolah-olah eksplisit dalam teks Yunani. Jangkar b tetap melekat pada angka dan jangkar a pada 'tumbang'.
