  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: id
  text: Tetapi jika seseorang berkata kepada kalian, “Ini telah dipersembahkan sebagai kurban,”[a] jangan memakannya, demi orang yang memberitahukan hal itu dan demi hati nurani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ini adalah daging kurban.” Kata sifat Yunani tersebut menunjuk pada sesuatu yang dipersembahkan sebagai kurban.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, hati nurani orang lain, bukan hati nurani kalian sendiri; lihat ayat berikutnya.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Tetapi jika seseorang berkata kepada kalian
  rationale: ἐὰν dengan bentuk subjungtif memperkenalkan keadaan bersyarat; τις bersifat tak tentu dan wajar diterjemahkan “seseorang.” δέ menandai pertentangan dengan keadaan yang dibahas sebelumnya. “Kalian” mempertahankan bentuk jamak ὑμῖν.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Ini telah dipersembahkan sebagai kurban
  rationale: ἱερόθυτος menunjuk pada sesuatu yang telah dipersembahkan dalam suatu kurban. Ungkapan verbal ini alami dalam bahasa Indonesia dan tidak memasukkan kata “berhala,” yang tidak terdapat dalam leksem tersebut, meskipun konteks yang lebih luas berkaitan dengan persembahan kepada berhala.
- source_word: μὴ ἐσθίετε
  choice: jangan memakannya
  rationale: Larangan μή dengan imperatif kini diterjemahkan secara langsung. Akhiran “-nya” memasok objek yang sudah jelas dari konteks, yaitu makanan yang baru disebut.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: demi orang yang memberitahukannya
  rationale: διά dengan akusatif menyatakan alasan atau pertimbangan terhadap orang tersebut. μηνύσαντα berarti orang yang memberitahukan atau mengungkapkan hal itu.
- source_word: καὶ τὴν συνείδησιν
  choice: dan demi hati nurani
  rationale: συνείδησις berarti “hati nurani.” Frasa Yunani ini ringkas; “demi” diteruskan dari klausa sebelumnya agar hubungan koordinatifnya jelas tanpa menentukan di dalam teks utama hati nurani siapa yang dimaksud.
theological_decisions:
- issue: Hati nurani siapa yang dimaksud oleh τὴν συνείδησιν
  choice: Teks utama mempertahankan ungkapan ringkas “demi hati nurani”; catatan menjelaskan bahwa konteks ayat berikutnya menunjuk pada hati nurani orang lain.
  alternative: Menuliskan langsung “demi hati nurani orang itu” dalam teks utama, atau memahaminya sebagai hati nurani orang yang makan.
  rationale: Secara gramatikal, ayat ini tidak menyebut pemilik hati nurani. Ayat berikutnya menjelaskan bahwa yang dimaksud bukan hati nurani si pemakan, melainkan hati nurani orang lain. Mempertahankan bentuk ringkas menjaga alur dan ketegangan asli sebelum penjelasan Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai untuk mempertahankan bentuk orang kedua jamak dalam bahasa Yunani. Istilah “kurban” dipilih untuk konteks persembahan ritual, sedangkan “hati nurani” merupakan padanan Indonesia yang lazim bagi συνείδησις.
