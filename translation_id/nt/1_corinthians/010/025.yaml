reference: 1 Corinthians 10:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: id
  text: Makanlah apa pun yang dijual di pasar daging tanpa mencari tahu apa-apa[a] demi hati nurani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa menanyakan apa-apa” atau “tanpa memeriksa apa pun”; maksudnya adalah tidak menyelidiki asal-usul daging itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: apa pun yang dijual
  rationale: Frasa netral berartikel ini berfungsi sebagai nomina dan mencakup segala sesuatu yang dijual; “apa pun yang dijual” alami dalam bahasa Indonesia serta mempertahankan daya cakupnya.
- source_word: ἐν μακέλλῳ
  choice: di pasar daging
  rationale: μάκελλον menunjuk secara khusus pada pasar tempat daging dijual, bukan sekadar pasar umum.
- source_word: ἐσθίετε
  choice: Makanlah
  rationale: Bentuk ini adalah imperatif aktif kini orang kedua jamak. “Makanlah” menyampaikan perintah secara langsung dan wajar.
- source_word: μηδὲν ἀνακρίνοντες
  choice: tanpa mencari tahu apa-apa
  rationale: ἀνακρίνω dapat berarti memeriksa, menyelidiki, atau menanyai. Dalam konteks ini, maksudnya tidak menyelidiki asal-usul daging; pilihan ini jelas sekaligus tetap cukup luas.
- source_word: διὰ τὴν συνείδησιν
  choice: demi hati nurani
  rationale: διά dengan akusatif di sini menyatakan alasan atau pertimbangan. “Demi hati nurani” alami dan tidak menentukan lebih dahulu hati nurani siapa yang dimaksud.
theological_decisions:
- issue: Rujukan “hati nurani”
  choice: hati nurani, tanpa kata ganti kepunyaan
  alternative: hati nuranimu; hati nurani orang lain
  rationale: Teks Yunani hanya memakai bentuk berartikel “hati nurani” dan dalam ayat ini belum menyebut pemiliknya secara eksplisit. Terjemahan mempertahankan ketaksaan itu agar konteks berikutnya yang menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ketaksaan mengenai pemilik hati nurani tetap dipertahankan.
