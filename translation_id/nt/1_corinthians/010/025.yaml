  source_fidelity: Terjemahan mempertahankan cakupan πᾶν τὸ ... πωλούμενον melalui “apa pun yang dijual,” makna khusus μακέλλῳ melalui “pasar daging,” dan daya imperatif jamak ἐσθίετε melalui “Makanlah.” “Tanpa mencari tahu apa-apa” menyampaikan dengan baik larangan untuk menyelidiki atau mengajukan pertanyaan, tanpa membatasi objek penyelidikan secara berlebihan. “Demi hati nurani” mencerminkan διὰ τὴν συνείδησιν dan mempertahankan rujukan hati nurani yang belum diperjelas dalam ayat ini.
