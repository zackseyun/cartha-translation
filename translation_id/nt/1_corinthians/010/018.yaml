  terminology: “Israel menurut daging” secara dekat mempertahankan κατὰ σάρκα tanpa mengartikan σάρξ sebagai natur berdosa; catatan kaki menjelaskan acuan keturunan alami. “Kurban” dan “mezbah” sesuai register Alkitab Indonesia modern.
