  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: id
  text: Perhatikanlah Israel menurut daging:[a] bukankah mereka yang memakan kurban-kurban itu mendapat bagian dari mezbah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Israel menurut daging”; dapat juga diterjemahkan “Israel berdasarkan keturunan alami.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mengambil bagian dalam mezbah” atau “bersekutu dengan mezbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Perhatikanlah
  rationale: Bentuk imperatif jamak ini mengajak pembaca memberi perhatian dan mempertimbangkan contoh yang diajukan Paulus, bukan sekadar melihat secara fisik.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Israel menurut keturunan jasmani
  rationale: Ungkapan ini menunjuk kepada Israel berdasarkan garis keturunan alami. Terjemahan mempertahankan unsur 'jasmani' tanpa memberi kesan bahwa yang dimaksud ialah sifat berdosa.
- source_word: οὐχ ... εἰσίν;
  choice: bukankah ...?
  rationale: Menampilkan pertanyaan retoris yang mengharapkan jawaban ya.
- source_word: οἱ ἐσθίοντες
  choice: mereka yang memakan
  rationale: Mempertahankan tindakan konkret makan dalam bentuk partisipel substantival.
- source_word: τὰς θυσίας
  choice: kurban-kurban itu
  rationale: Padanan langsung dan wajar bagi persembahan yang dikurbankan; bentuk jamak sumber dipertahankan.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: mengambil bagian dalam persekutuan mezbah
  rationale: κοινωνοί menyatakan keterlibatan atau kebersamaan yang nyata. Frasa ini lebih alami dalam bahasa Indonesia daripada 'peserta dalam mezbah' dan mempertahankan hubungan dengan mezbah tanpa menganggap mezbah sebagai benda yang secara harfiah dibagikan.
theological_decisions:
- issue: Makna 'Israel menurut daging'
  choice: Israel berdasarkan keturunan jasmani
  alternative: Israel secara lahiriah
  rationale: Dalam konteks analogi praktik kurban, frasa itu paling alami menunjuk kepada Israel menurut garis keturunan fisik. Pilihan ini tidak menarik kesimpulan lebih luas mengenai hubungan Israel dan gereja.
- issue: Sifat partisipasi dengan mezbah
  choice: mengambil bagian dalam persekutuan mezbah
  alternative: menjadi orang-orang yang mendapat bagian dari mezbah
  rationale: Terjemahan mempertahankan gagasan κοινωνία berupa keterlibatan nyata dalam ranah kurban yang diwakili mezbah, tanpa merumuskan secara berlebihan mekanisme teologis partisipasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perhatikanlah' mempertahankan nada ajakan argumentatif; 'kurban' mengikuti ejaan baku; susunan pertanyaan dibuat alami bagi pembaca umum.
