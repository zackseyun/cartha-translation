id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: id
  text: Yang saya maksud ialah hati nurani orang lain[a], bukan hati nuranimu sendiri. Sebab, mengapa kebebasanku dinilai oleh hati nurani orang lain?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “bukan hati nuraninya sendiri, melainkan hati nurani orang lain.” Konteks mendukung pengertian “bukan hati nuranimu sendiri, melainkan hati nurani orang lain.”
    reason: lexical_alternative
  - marker: b
    text: Pertanyaan retoris ini dapat dipahami sebagai tantangan Paulus sendiri atau sebagai keberatan yang ia suarakan tanpa tanda kutip eksplisit dalam teks Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: hati nurani
  rationale: Dalam konteks Paulus, kata ini menunjuk pada kesadaran moral yang menilai tindakan; “hati nurani” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: δὲ λέγω
  choice: Yang saya maksud ialah
  rationale: Frasa ini memperjelas maksud pernyataan sebelumnya. Terjemahan ini menyampaikan fungsi klarifikatif δέ λέγω tanpa menambahkan penanda waktu seperti “sekarang”.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: hati nurani orang lain, bukan hati nuranimu sendiri
  rationale: Susunan diatur secara alami dalam bahasa Indonesia agar pertentangan antara hati nurani pembaca dan hati nurani orang lain jelas, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἱνατί γὰρ
  choice: Sebab, mengapa
  rationale: “Mengapa” mempertahankan bentuk pertanyaan retoris, sedangkan “sebab” mengungkapkan hubungan penjelas yang dibawa oleh γάρ.
- source_word: ἐλευθερία
  choice: kebebasan
  rationale: Padanan modern dan langsung untuk kebebasan bertindak yang sedang dibahas Paulus.
- source_word: κρίνεται
  choice: dinilai
  rationale: “Dinilai” mempertahankan cakupan luas κρίνω tanpa mempersempit maknanya menjadi penghukuman.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: oleh hati nurani orang lain
  rationale: Ungkapan ini secara alami menyatakan pelaku penilaian dalam bahasa Indonesia dan menghindari frasa kaku “oleh hati nurani lain”.
theological_decisions:
- issue: Rujukan bentuk milik dalam pertentangan pertama
  choice: Maksudnya adalah hati nurani orang lain, bukan hati nurani pembaca sendiri.
  alternative: 'Secara lebih harfiah: “bukan hati nuraninya sendiri, melainkan hati nurani orang lain.”'
  rationale: ἑαυτοῦ berbentuk orang ketiga tunggal, tetapi konteks sapaan kepada jemaat mendukung pengungkapan alami “hati nuranimu sendiri.” Catatan kaki mempertahankan bentuk dan kemungkinan nuansa harfiahnya.
- issue: Identitas penutur pertanyaan retoris
  choice: Pertanyaan dibiarkan sebagai tantangan retoris tanpa penanda pergantian penutur.
  alternative: Pertanyaan itu dapat dipahami sebagai keberatan yang disuarakan Paulus atas nama seorang lawan bicara.
  rationale: Teks Yunani tidak memiliki tanda kutip atau penanda eksplisit pergantian penutur, sehingga terjemahan utama tidak memutuskan apakah ini suara Paulus sendiri atau keberatan seorang lawan bicara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Yang saya maksud ialah” memberi klarifikasi secara alami; “hati nurani” memakai istilah umum yang tepat. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
