id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: id
  text: Kamu tidak dapat minum dari cawan Tuhan dan dari cawan roh-roh jahat; kamu tidak dapat mengambil bagian pada meja Tuhan dan pada meja roh-roh jahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: kamu tidak dapat
  rationale: Menyampaikan ketidakmungkinan atau ketidakselarasan yang tegas dalam bentuk Indonesia modern, serta mempertahankan pengulangan retoris Yunani.
- source_word: ποτήριον
  choice: cawan
  rationale: Padanan yang wajar dan bermartabat dalam konteks perjamuan serta mempertahankan gambaran wadah minum tanpa menjelaskannya secara berlebihan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku bagi κύριος dalam konteks ini; konstruksi kepunyaan Indonesia menghasilkan 'cawan Tuhan' dan 'perjamuan Tuhan'.
- source_word: πίνειν
  choice: minum dari
  rationale: Dalam bahasa Indonesia, 'minum dari cawan' lebih alami daripada 'minum cawan', sambil tetap mempertahankan tindakan yang dinyatakan sumber.
- source_word: δαιμονίων
  choice: roh-roh jahat
  rationale: Padanan Indonesia yang transparan bagi makhluk rohani jahat; bentuk jamak mempertahankan δαιμονίων tanpa mengurangi daya personalnya.
- source_word: τραπέζης
  choice: perjamuan
  rationale: Dalam konteks partisipasi kultis dan komunal, 'perjamuan' menyampaikan fungsi meja sebagai persekutuan makan secara lebih alami daripada ungkapan harfiah 'meja', tanpa menambahkan gagasan altar.
- source_word: μετέχειν
  choice: turut mengambil bagian dalam
  rationale: Menyatakan partisipasi nyata dan cocok secara idiomatis dengan 'perjamuan'; unsur 'turut' mempertahankan nuansa berbagi bersama.
- source_word: καὶ
  choice: sekaligus
  rationale: Dalam kedua konstruksi negatif paralel, 'sekaligus' mengungkapkan secara alami ketidakselarasan antara dua bentuk partisipasi yang dihubungkan καί.
theological_decisions:
- issue: Sifat penyangkalan Paulus mengenai perjamuan Tuhan dan penyembahan kepada roh-roh jahat
  choice: Diterjemahkan sebagai ketidakselarasan kategoris antara kedua bentuk partisipasi.
  alternative: Memahaminya hanya sebagai anjuran retoris agar kedua praktik sebaiknya tidak digabungkan.
  rationale: Pengulangan οὐ δύνασθε dalam dua klausa paralel menyatakan ketidakmungkinan yang tegas. Terjemahan mempertahankan daya ini tanpa menerangkan mekanisme sakramental atau doktrin tertentu.
- issue: Makna τραπέζης dalam konteks kultis
  choice: Diterjemahkan 'perjamuan' untuk menonjolkan partisipasi makan bersama.
  alternative: Diterjemahkan secara lebih formal sebagai 'meja'.
  rationale: Metonimia meja untuk perjamuan dapat dialihkan secara alami ke bahasa Indonesia, tetapi rujukan kepada altar atau rincian ritual tidak ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, langsung, dan bermartabat. Pengulangan struktur dipertahankan untuk menjaga tekanan retoris. Pronomina 'kamu' dipakai karena verba Yunani berbentuk orang kedua jamak dan sapaan ditujukan kepada jemaat secara kolektif.
