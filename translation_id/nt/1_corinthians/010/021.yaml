revisions:
- from: Kamu tidak dapat minum dari cawan Tuhan sekaligus dari cawan roh-roh jahat; kamu tidak dapat turut mengambil bagian dalam perjamuan Tuhan sekaligus dalam perjamuan roh-roh jahat.
  to: Kamu tidak dapat minum dari cawan Tuhan dan dari cawan roh-roh jahat; kamu tidak dapat mengambil bagian pada meja Tuhan dan pada meja roh-roh jahat.
  rationale: Revisi menghapus "sekaligus" agar penyangkalan Paulus tidak dipersempit menjadi persoalan tindakan serentak. "Meja" dipulihkan sebagai padanan langsung τραπέζης, sehingga ambiguitas metonimis dan kultis sumber tetap terjaga. Struktur paralel dan pengulangan retoris kedua klausa dipertahankan.
