review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada umumnya mempertahankan paralelisme, penyangkalan kategoris οὐ δύνασθε, serta gambaran cawan dan partisipasi kultis. Namun, "sekaligus" secara khusus mengarah pada tindakan yang berlangsung bersamaan, sedangkan καί dalam kalimat ini menghubungkan dua objek partisipasi yang dinyatakan tidak dapat dipadukan, tanpa membatasi masalahnya pada keserentakan waktu. Selain itu, τραπέζης secara harfiah adalah "meja"; pengalihan menjadi "perjamuan" dapat dipahami sebagai metonimia, tetapi mengurangi ambiguitas yang dipertahankan sumber.
  naturalness: '"Kamu tidak dapat" dan "minum dari cawan" adalah bahasa Indonesia baku dan jelas. "Mengambil bagian pada meja" cukup alami dalam register formal-keagamaan dan lebih dekat pada citra sumber daripada "turut mengambil bagian dalam perjamuan". Penghilangan "sekaligus" menghasilkan kalimat yang lebih tepat dan tetap lancar.'
  terminology: '"Tuhan" untuk κυρίου dan "roh-roh jahat" untuk δαιμονίων dapat diterima dalam bahasa Indonesia modern. "Roh-roh jahat" mempertahankan jamak dan personalitas istilah Yunani tanpa memaksakan penafsiran tambahan. "Meja" mempertahankan istilah τραπέζης dan metonimia kultisnya tanpa menentukan apakah yang terutama dimaksud ialah perjamuan, altar, atau persekutuan makan.'
  issues:
  - severity: medium
    issue: '"Sekaligus" menambahkan pembatasan temporal.'
    rationale: καί hanya menghubungkan "cawan Tuhan" dengan "cawan roh-roh jahat," dan "meja Tuhan" dengan "meja roh-roh jahat." Dalam konteks ini Paulus menegaskan ketidakcocokan kategoris dalam partisipasi, bukan semata-mata larangan melakukan keduanya pada saat yang sama.
  - severity: low
    issue: '"Perjamuan" menggantikan "meja".'
    rationale: τραπέζης secara leksikal berarti "meja." Walaupun "perjamuan" merupakan metonimia yang mungkin dalam konteks ini, "meja" lebih setia dan mempertahankan keluasan citra sumber.
  - severity: low
    issue: '"Turut" tidak diperlukan.'
    rationale: μετέχειν sudah berarti mengambil bagian/berpartisipasi. "Turut" tidak mengubah arti secara besar, tetapi "mengambil bagian" lebih langsung dan ringkas.
  revised_text: Kamu tidak dapat minum dari cawan Tuhan dan dari cawan roh-roh jahat; kamu tidak dapat mengambil bagian pada meja Tuhan dan pada meja roh-roh jahat.
  revised_footnotes: []
