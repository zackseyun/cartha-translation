  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: id
  text: Semua ini terjadi pada mereka sebagai teladan[a], tetapi dituliskan untuk menjadi peringatan bagi kita[b], yang kepadanya akhir dari zaman-zaman telah tiba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai pola” atau “secara tipologis”; Paulus menyajikan peristiwa-peristiwa ini sebagai pola yang mengandung pelajaran bagi orang percaya kemudian.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk menasihati kita” atau “untuk mengingatkan kita”; kata Yunani mencakup nasihat yang mengoreksi sekaligus peringatan.
    reason: lexical_alternative
  - marker: c
    text: Atau “akhir zaman telah tiba.” Secara harfiah, “yang kepadanya akhir dari zaman-zaman telah tiba.” Bentuk Yunani memakai kata “akhir” dan “zaman” dalam bentuk jamak.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: sebagai teladan
  rationale: Kata keterangan ini menyatakan bahwa peristiwa-peristiwa tersebut berfungsi sebagai pola yang bermakna dan mendidik bagi orang percaya kemudian. “Sebagai teladan” alami dalam bahasa Indonesia dan sesuai dengan konteks ayat 6, sedangkan “secara tipologis” terlalu teknis.
- source_word: συνέβαινεν
  choice: terjadi
  rationale: Bentuk imperfek menggambarkan kejadian pada masa lampau; “terjadi” menyampaikan maknanya secara lugas, sementara subjek jamak sudah menunjukkan rangkaian peristiwa.
- source_word: ἐκείνοις
  choice: pada mereka
  rationale: Pronomina datif ini menunjuk kepada generasi Israel di padang gurun yang baru dibahas. “Pada mereka” alami bersama verba “terjadi”.
- source_word: ἐγράφη
  choice: dituliskan
  rationale: Bentuk pasif tunggal merujuk pada dicatatnya rangkaian peristiwa tersebut dalam Kitab Suci. Bentuk Indonesia tidak perlu menyatakan jumlah gramatikal dan “dituliskan” menegaskan bahwa kisah itu menjadi catatan tertulis.
- source_word: πρὸς νουθεσίαν
  choice: untuk menasihati kita
  rationale: νουθεσία mencakup pengajaran korektif sekaligus peringatan. “Menasihati” lebih alami dan lebih mampu memuat kedua unsur itu daripada “mengajar” atau “memperingatkan” saja.
- source_word: εἰς οὓς
  choice: yang telah mengalami datangnya
  rationale: Ungkapan ini menunjuk kepada orang-orang yang kepadanya realitas zaman akhir telah tiba. Susunan Indonesia ini menghindari bentuk kaku “yang atasnya ... telah datang” sambil mempertahankan bahwa mereka menjadi pihak yang mengalami kedatangan tersebut.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: akhir berbagai zaman
  rationale: Ungkapan ini mempertahankan bentuk jamak dan ketegangan sejarah keselamatan dalam bahasa Indonesia yang wajar. “Berbagai zaman” menandai bahwa αἰώνων berbentuk jamak tanpa menghasilkan frasa yang terlalu kaku.
- source_word: κατήντηκεν
  choice: telah mengalami datangnya
  rationale: Bentuk perfektum menyatakan kedatangan yang sudah berlangsung dengan dampak yang tetap berlaku. Gabungan “telah mengalami datangnya” mengungkapkan relevansi kini bagi orang yang dimaksud.
theological_decisions:
- issue: Ungkapan sejarah keselamatan τὰ τέλη τῶν αἰώνων
  choice: datangnya akhir berbagai zaman
  alternative: datangnya akhir zaman / penggenapan segala zaman
  rationale: Terjemahan mempertahankan kejamakan teks Yunani dan tidak menyederhanakan ketegangan eskatologis Paulus menjadi satu akhir tunggal ataupun menafsirkannya secara khusus sebagai “penggenapan”.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan akhir kalimat dibuat alami bagi pembaca umum, sedangkan catatan kaki mempertahankan bentuk harfiah serta kejamakan ungkapan Yunani.
