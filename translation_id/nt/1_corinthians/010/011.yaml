  naturalness: Kalimat draf pada umumnya jelas, tetapi “yang telah mengalami datangnya” terasa berat dan tidak alami dalam bahasa Indonesia baku. Konstruksi “yang kepadanya ... telah tiba” lebih formal, tetapi tepat, terbaca, dan sesuai register surat rasuli.
  terminology: “Teladan” merupakan padanan baik untuk τυπικῶς. Untuk πρὸς νουθεσίαν, “untuk menjadi peringatan bagi kita” menyampaikan fungsi nomina serta unsur teguran/peringatan dengan lebih setia daripada verba “untuk menasihati kita.” Ungkapan “akhir dari zaman-zaman” mempertahankan kejamakan tanpa menafsirkan ungkapan eskatologis Paulus.
