reference: 1 Corinthians 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: id
  text: Tidak ada pencobaan yang menimpa kalian selain yang biasa dialami manusia.[a] Namun, Allah setia. Ia tidak akan membiarkan kalian dicobai melampaui kemampuan kalian. Sebaliknya, bersama dengan pencobaan itu Ia juga akan menyediakan jalan keluar,[b] sehingga kalian sanggup menanggungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “selain yang bersifat manusiawi.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “pencobaan” dan “dicobai” juga dapat berarti “ujian” dan “diuji”. “Jalan keluar” juga dapat diterjemahkan “pelepasan” atau “hasil akhir”; dalam konteks ini, yang Allah sediakan memungkinkan kalian bertahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: pencobaan / dicobai
  rationale: Dalam konteks peringatan terhadap keinginan berdosa dan penyembahan berhala, makna moral ‘pencobaan’ paling menonjol. Namun, istilah Yunani juga dapat berarti ujian; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: εἴληφεν
  choice: menimpa
  rationale: Bentuk perfektum dari λαμβάνω menggambarkan pencobaan yang telah mendatangi atau menguasai mereka. ‘Menimpa’ alami dalam bahasa Indonesia dan sesuai dengan pengalaman yang datang atas seseorang.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: selain yang biasa dialami manusia
  rationale: ἀνθρώπινος berarti manusiawi atau berciri pengalaman manusia. Ungkapan ini menyampaikan bahwa pencobaan tersebut bukan sesuatu yang melampaui pengalaman manusia pada umumnya.
- source_word: πιστός
  choice: setia
  rationale: ‘Setia’ menyatakan bahwa Allah dapat diandalkan dan akan bertindak sesuai dengan kesetiaan-Nya.
- source_word: οὐκ ἐάσει
  choice: tidak akan membiarkan
  rationale: Terjemahan ini secara alami menyampaikan arti mengizinkan atau membolehkan.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: melampaui kemampuanmu
  rationale: Frasa ini menyatakan batas yang tidak akan Allah izinkan terlampaui dan tetap dekat dengan δύνασθε, ‘kamu mampu’.
- source_word: ποιήσει
  choice: akan menyediakan
  rationale: Walaupun ποιέω secara harfiah luas (‘membuat/melakukan’), dalam hubungannya dengan ἔκβασις, ‘menyediakan’ menyampaikan tindakan Allah dalam menghadirkan sarana atau hasil yang memungkinkan ketekunan.
- source_word: σὺν τῷ πειρασμῷ
  choice: bersama dengan pencobaan itu
  rationale: 'σύν menunjukkan penyertaan: penyediaan Allah hadir bersama pencobaan, bukan selalu berupa penghapusan pencobaan itu.'
- source_word: ἔκβασιν
  choice: jalan keluar
  rationale: ἔκβασις dapat berarti jalan keluar, pelepasan, atau hasil akhir. ‘Jalan keluar’ idiomatis, sementara kaitannya dengan ketahanan mencegah pengertian bahwa pencobaan selalu segera disingkirkan.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: sehingga kamu sanggup menanggungnya
  rationale: Infinitif berartikel dapat menyatakan tujuan atau hasil. ‘Menanggungnya’ menangkap arti ὑποφέρω, yaitu bertahan di bawah suatu beban.
theological_decisions:
- issue: Makna πειρασμός/πειρασθῆναι dalam kaitannya dengan kesetiaan Allah
  choice: Teks utama memakai ‘pencobaan/dicobai’, sedangkan ‘ujian/diuji’ dicatat sebagai kemungkinan.
  alternative: ujian / diuji
  rationale: Konteks dekat menekankan bahaya dosa dan penyembahan berhala, tetapi rentang makna Yunani mencakup ujian. Terjemahan tidak menyatakan bahwa Allah membujuk orang untuk berbuat jahat; ayat ini menegaskan bahwa Ia membatasi pengalaman itu dan menyediakan jalan untuk bertahan.
- issue: Sifat ‘jalan keluar’ yang Allah sediakan
  choice: Dipahami sebagai penyediaan yang memungkinkan orang percaya menanggung pencobaan.
  alternative: pelepasan langsung dari pencobaan atau hasil akhirnya
  rationale: Klausa tujuan/hasil τοῦ δύνασθαι ὑπενεγκεῖν mengarahkan pembacaan pada ketekunan. Karena itu, ‘jalan keluar’ tidak boleh dipersempit menjadi penghapusan seketika, meskipun ἔκβασις dapat mengandung gagasan keluar atau hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk tunggal ‘kemampuanmu’ mengikuti sapaan jamak Yunani secara kolektif dalam idiom Indonesia; keseluruhan sapaan ‘kamu’ dapat merujuk kepada jemaat. Kalimat Yunani yang panjang dibagi agar jelas tanpa mengubah hubungan logisnya.
