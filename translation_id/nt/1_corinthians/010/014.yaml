id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: id
  text: Karena itu, saudara-saudara yang kukasihi, larilah dari penyembahan berhala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemujaan berhala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Karena itu
  rationale: Konjungsi inferensial ini menarik kesimpulan dari uraian sebelumnya; “Karena itu” alami dalam bahasa Indonesia dan mempertahankan hubungan logis tersebut.
- source_word: ἀγαπητοί μου
  choice: saudara-saudara yang kukasihi
  rationale: Sapaan vokatif ini menyatakan kasih dan kedekatan Paulus. “Saudara-saudara yang kukasihi” terdengar wajar, hangat, dan bermartabat dalam bahasa Indonesia, dengan “saudara-saudara” dipahami mencakup seluruh jemaat.
- source_word: φεύγετε
  choice: larilah
  rationale: Imperatif kini aktif orang kedua jamak ini merupakan perintah mendesak untuk menjauh dari bahaya. “Larilah” mempertahankan kekuatan metaforis kata Yunani tanpa melemahkannya menjadi sekadar “hindarilah”.
- source_word: ἀπὸ
  choice: dari
  rationale: Preposisi ini menyatakan pemisahan dari sesuatu yang harus dijauhi dan berpadanan langsung serta alami dengan “dari” sesudah “larilah”.
- source_word: τῆς εἰδωλολατρίας
  choice: penyembahan berhala
  rationale: Kata ini menunjuk pada pemujaan atau pelayanan kepada berhala. “Penyembahan berhala” lebih transparan bagi pembaca Indonesia modern daripada istilah serapan “idolatri” dan tetap mencakup praktik kultis dalam konteks.
theological_decisions:
- issue: Cakupan larangan
  choice: Perintah langsung untuk menjauh dari penyembahan berhala beserta keterlibatan dalam praktiknya
  alternative: Peringatan yang lebih sempit, hanya terhadap pengabdian batin kepada berhala
  rationale: Dalam konteks terdekat, Paulus membahas keterlibatan dalam perjamuan dan praktik kultis non-Yahudi. Terjemahan umum “penyembahan berhala” tidak membatasi larangan hanya pada sikap batin, tetapi juga tidak menambahkan rincian yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan mendesak. Sapaan “saudara-saudara yang kukasihi” menyampaikan bentuk jamak dan kasih pastoral; perintah “larilah” mempertahankan daya retoris teks sumber.
