translation:
  language: id
  text: Dan mereka semua makan makanan rohani yang sama[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makanan adikodrati”; ungkapan ini kemungkinan mengacu pada manna di padang gurun dan dalam konteks ini dapat mengandung makna tipologis.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini melanjutkan rangkaian pernyataan dari ayat sebelumnya; “dan” merupakan padanan alami dalam bahasa Indonesia.
- source_word: πάντες
  choice: mereka semua
  rationale: Bentuk jamak ini mengacu kepada seluruh umat Israel dalam contoh Paulus. Penambahan “mereka” membuat subjek tersirat dalam bahasa Yunani menjadi jelas dan alami dalam bahasa Indonesia, sedangkan “semua” mempertahankan penekanannya.
- source_word: τὸ αὐτὸ
  choice: yang sama
  rationale: Gabungan artikel dan αὐτός menyatakan kesamaan atau identitas; susunan “makanan ... yang sama” merupakan ungkapan Indonesia yang alami.
- source_word: πνευματικὸν
  choice: rohani
  rationale: Dalam pemakaian Paulus, πνευματικός lazim berarti “rohani.” Pilihan ini mempertahankan keluasan makna dan tidak mempersempitnya menjadi “dari Roh” atau sekadar “ajaib.”
- source_word: βρῶμα
  choice: makanan
  rationale: βρῶμα menunjuk pada makanan secara umum; “makanan” adalah padanan langsung dan wajar.
- source_word: ἔφαγον
  choice: makan
  rationale: Aoristus indikatif ini menceritakan tindakan lampau. Dalam konteks naratif yang telah dibentuk oleh ayat-ayat sekitar, “makan” terdengar alami tanpa harus menambahkan penanda waktu yang tidak ada dalam teks sumber.
theological_decisions:
- issue: Makna “makanan rohani” dalam tipologi perjalanan Israel di padang gurun
  choice: Mempertahankan “makanan rohani” dalam teks utama tanpa secara eksplisit menyebut manna atau Perjamuan Tuhan.
  alternative: “makanan ajaib,” “makanan yang diberikan oleh Roh,” atau penyebutan langsung “manna”
  rationale: Konteks kemungkinan besar mengacu pada manna sebagai pemeliharaan Allah di padang gurun dan dapat mengandung daya tipologis. Terjemahan “makanan rohani” mempertahankan ungkapan Paulus serta ketegangan teologisnya tanpa menetapkan satu penafsiran secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mengikuti bahasa sumber dengan keluwesan secukupnya agar alami bagi pembaca umum.
