  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: id
  text: Karena itu, siapa yang mengira dirinya berdiri hendaklah ia berhati-hati agar tidak jatuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jadi, orang yang mengira dirinya berdiri hendaklah waspada agar tidak jatuh.”
    reason: Alternatif ini memakai padanan inferensial lain untuk ὥστε dan susunan yang lebih eksplisit bagi partisipel substantival ὁ δοκῶν.
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Konjungsi ini menarik kesimpulan dari contoh-contoh peringatan sebelumnya. “Jadi” menyampaikan daya inferensialnya secara ringkas dan alami.
- source_word: ὁ δοκῶν
  choice: siapa yang menyangka
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang memiliki anggapan tersebut. “Menyangka” mempertahankan unsur penilaian diri yang belum tentu sesuai kenyataan.
- source_word: ἑστάναι
  choice: bahwa ia sedang berdiri teguh
  rationale: Infinitif perfek ἵστημι menyatakan keadaan berdiri yang dianggap telah mantap. “Berdiri teguh” merupakan ungkapan Indonesia yang alami dalam konteks keteguhan rohani, tanpa menentukan secara sempit hakikat keteguhan itu.
- source_word: βλεπέτω
  choice: harus berhati-hati
  rationale: Imperatif kini menyerukan kewaspadaan yang berkelanjutan. Bentuk “harus berhati-hati” jelas, modern, dan mempertahankan daya peringatannya.
- source_word: μὴ πέσῃ
  choice: supaya jangan jatuh
  rationale: μή dengan subjungtif aoris setelah imperatif menyatakan tujuan negatif atau hasil yang harus diwaspadai. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit arti “jatuh”.
theological_decisions:
- issue: Makna “jatuh” dalam peringatan Paulus
  choice: Mempertahankan kata umum “jatuh” tanpa menjelaskan apakah yang dimaksud ialah kemurtadan, kegagalan moral, atau terkena hukuman karena penyembahan berhala.
  alternative: jatuh ke dalam dosa; jatuh di bawah hukuman; murtad
  rationale: Konteks langsung memperingatkan bahaya rasa percaya diri dengan mengingat kegagalan Israel, tetapi πέσῃ sendiri tidak cukup spesifik untuk membatasi maknanya. Terjemahan umum mempertahankan ketegangan teologis teks.
- issue: Ungkapan maskulin tunggal yang representatif
  choice: Menggunakan “ia” untuk mencerminkan bentuk tunggal yang secara representatif berlaku bagi siapa pun.
  alternative: mereka; orang itu tanpa pronomina
  rationale: Bahasa Yunani memakai bentuk maskulin tunggal secara representatif. “Ia” mempertahankan bentuk tunggal tanpa menyatakan bahwa peringatan ini hanya berlaku bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. “Berdiri teguh” dipakai sebagai ungkapan alami bagi keadaan mantap, sementara “jatuh” sengaja dibiarkan umum sesuai ketidakspesifikan teks sumber.
