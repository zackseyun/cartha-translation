  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: id
  text: Aku berbicara kepada kalian sebagai orang-orang yang berakal budi[a]. Nilailah sendiri apa yang kukatakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang bijaksana” atau “orang-orang yang berpikiran sehat.”
    reason: lexical_alternative
  - marker: b
    text: 'Penekanan: “Kalian sendiri, nilailah apa yang kukatakan.”'
    reason: emphasis
lexical_decisions:
- source_word: ὡς
  choice: sebagai
  rationale: Dalam konstruksi ὡς φρονίμοις λέγω, kata ini menunjukkan bahwa Paulus menyapa para pembacanya sebagai orang yang memiliki kemampuan menimbang, bukan sekadar membandingkan mereka dengan kelompok lain.
- source_word: φρονίμοις
  choice: orang-orang yang berakal budi
  rationale: φρόνιμος menunjuk pada kebijaksanaan praktis, kehati-hatian, dan kemampuan menilai dengan sehat. 'Berakal budi' terdengar wajar dan bermartabat dalam bahasa Indonesia serta tidak melebihkan maknanya menjadi hikmat yang sempurna.
- source_word: λέγω
  choice: Aku berbicara
  rationale: '''Berbicara'' cocok dengan cara Paulus menyapa para pembaca, sekaligus membedakannya secara alami dari φημί pada akhir ayat.'
- source_word: κρίνατε
  choice: Nilailah
  rationale: Imperatif aoris ini meminta penilaian evaluatif. 'Nilailah' mempertahankan daya perintah tanpa konotasi hukum atau penghukuman yang dapat muncul dari 'hakimilah'.
- source_word: ὑμεῖς
  choice: sendiri
  rationale: Pronomina eksplisit ὑμεῖς bersifat emfatis. Dalam bahasa Indonesia, penekanan itu paling alami disampaikan dengan 'sendiri' sesudah verba.
- source_word: ὅ
  choice: apa yang
  rationale: Pronomina relatif netral ini menjadi objek φημί dan secara alami diterjemahkan 'apa yang'.
- source_word: φημι
  choice: kukatakan
  rationale: φημί berarti mengatakan atau menyatakan. Bentuk 'kukatakan' ringkas, alami, dan mempertahankan rujukan kepada isi perkataan Paulus.
theological_decisions:
- issue: Karakterisasi retoris terhadap para pembaca
  choice: Paulus menyapa jemaat sebagai orang yang mampu menimbang secara sehat, tanpa menyatakan persetujuan moral atas seluruh perilaku mereka.
  alternative: Sapaan itu dapat dipahami sebagai pujian langsung bahwa mereka bijaksana, atau sebagai ironi.
  rationale: Ungkapan sumber memungkinkan nuansa retoris tersebut. Terjemahan 'orang-orang yang berakal budi' mempertahankan sapaan positif yang moderat tanpa memaksakan apakah Paulus sepenuhnya memuji atau sedang menyindir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Pronomina 'Aku/kalian' dipakai untuk mempertahankan kedekatan sapaan apostolik tanpa menjadi kasar. Susunan dibagi menjadi dua kalimat sesuai dua klausa Yunani. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
