  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: id
  text: Jadi, baik kamu makan, minum, maupun melakukan apa pun, lakukanlah semuanya untuk kemuliaan Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: baik ... atau ... atau
  rationale: Rangkaian korelatif ini menyajikan beberapa kemungkinan. Bentuk “baik ... atau ... atau” alami dalam bahasa Indonesia dan mempertahankan susunan retoris sumber.
- source_word: οὖν
  choice: Jadi
  rationale: Kata ini menandai kesimpulan dari pembahasan sebelumnya. “Jadi” jelas, wajar, dan sesuai dengan nasihat Paulus.
- source_word: ἐσθίετε
  choice: kamu makan
  rationale: Bentuk kini di sini menyatakan tindakan secara umum, bukan tindakan yang khusus sedang berlangsung.
- source_word: πίνετε
  choice: minum
  rationale: Seperti ἐσθίετε, bentuk ini menyatakan tindakan secara umum; subjek “kamu” secara alami berlaku juga bagi verba ini.
- source_word: τι
  choice: apa pun
  rationale: Dalam konstruksi ini, kata tak tentu tersebut memperluas cakupan melampaui makan dan minum. “Apa pun” menyampaikan daya cakup yang menyeluruh secara alami.
- source_word: ποιεῖτε
  choice: kamu lakukan / lakukanlah
  rationale: ποιέω memiliki arti luas dan menunjuk pada tindakan apa pun. Perbedaan bentuk Indonesia mencerminkan fungsi pertama sebagai bagian klausa dan fungsi kedua sebagai perintah, tanpa mengubah inti maknanya.
- source_word: πάντα
  choice: semuanya
  rationale: Bentuk jamak netral ini bercakupan menyeluruh. “Semuanya” alami dalam bahasa Indonesia dan mengaitkan perintah dengan segala tindakan yang baru disebutkan.
- source_word: εἰς δόξαν
  choice: untuk kemuliaan
  rationale: εἰς bersama δόξαν menyatakan tujuan atau sasaran. “Untuk kemuliaan” menyampaikan arah yang dimaksud dengan jelas.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif Yunani ini secara alami menjadi frasa “kemuliaan Allah,” yang mempertahankan relasi bahwa kemuliaan tersebut adalah kemuliaan Allah.
theological_decisions:
- issue: Cakupan nasihat Paulus
  choice: 'Prinsip etis yang menyeluruh: segala tindakan sehari-hari harus diarahkan kepada kemuliaan Allah.'
  alternative: Petunjuk yang lebih sempit dan hanya terbatas pada persoalan makanan dan minuman.
  rationale: Urutannya bergerak dari contoh khusus—makan dan minum—kepada ungkapan menyeluruh “apa pun yang kamu lakukan” dan “semuanya.” Ini menunjukkan prinsip umum yang melampaui, namun tetap berakar pada, persoalan langsung dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Kamu” dipakai sebagai padanan orang kedua jamak yang mudah dipahami; konteks surat menunjukkan sapaan kepada komunitas. Imperatif “lakukanlah” mempertahankan kekuatan nasihat/perintah dari ποιεῖτε.
