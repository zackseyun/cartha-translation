id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: id
  text: Janganlah menjadi batu sandungan, baik bagi orang Yahudi, orang Yunani,[a] maupun jemaat Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang Yunani” di sini kemungkinan digunakan secara luas untuk orang bukan Yahudi dalam lingkungan Paulus; teks Yunani secara khusus menyebut “orang Yunani.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: janganlah menjadi batu sandungan
  rationale: Dalam konteks nasihat mengenai dampak perilaku terhadap orang lain, kata ini menyatakan sikap yang tidak menyebabkan orang tersandung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora etis yang mendasarinya.
- source_word: γίνεσθε
  choice: janganlah menjadi
  rationale: Imperatif kini γίνεσθε menyampaikan tuntutan yang berkelanjutan; bentuk larangan ini mengungkapkannya secara wajar bersama ἀπρόσκοποι.
- source_word: Ἰουδαίοις
  choice: orang Yahudi
  rationale: Menunjuk kelompok etnis-keagamaan Yahudi, bukan semata-mata penduduk Yudea.
- source_word: Ἕλλησιν
  choice: orang Yunani
  rationale: Mempertahankan arti leksikal eksplisit teks Yunani, sambil menjelaskan dalam catatan bahwa dalam konteks ini cakupannya kemungkinan lebih luas.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: jemaat Allah
  rationale: Dalam pemakaian Paulus, ἐκκλησία menunjuk komunitas umat percaya; 'jemaat Allah' merupakan padanan Indonesia yang mapan dan tepat.
theological_decisions:
- issue: Pengelompokan pihak-pihak dalam nasihat etis Paulus
  choice: 'Mempertahankan tiga kelompok yang disebutkan: orang Yahudi, orang Yunani, dan jemaat Allah.'
  alternative: Menafsirkan 'orang Yunani' langsung sebagai semua orang bukan Yahudi, atau menjadikan ayat ini terutama sebagai pernyataan strategi misi.
  rationale: Ayat itu sendiri menyebut tiga kelompok secara eksplisit. Terjemahan tidak memperluas atau mempersempit kategori tersebut dan tidak menentukan apakah nasihat ini terutama bersifat misioner atau etis universal.
- issue: Nuansa ἀπρόσκοποι
  choice: Menerjemahkannya secara relasional sebagai tidak menjadi batu sandungan bagi pihak lain.
  alternative: Tidak bercela; tidak menyinggung siapa pun.
  rationale: Konteks langsung menyoroti dampak tindakan seseorang terhadap orang lain. Pilihan ini mempertahankan nuansa menyebabkan orang tersandung tanpa mengubahnya menjadi klaim umum tentang keadaan tanpa cela.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'baik ... maupun ...' menghubungkan ketiga kelompok secara alami; tanda catatan [a] ditempatkan langsung setelah istilah yang dijelaskan.
