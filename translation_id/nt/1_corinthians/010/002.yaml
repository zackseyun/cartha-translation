  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: id
  text: Dan mereka semua dibaptis ke dalam Musa[a] di dalam awan dan di dalam laut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diidentifikasikan dengan Musa” atau “masuk ke dalam kesetiaan kepada Musa.” Secara harfiah, teks Yunani berbunyi “ke dalam Musa,” yang mempertahankan kesejajaran tipologis Paulus dengan baptisan.
    reason: alternative_reading
  - marker: b
    text: Paulus mengatakan “di dalam laut,” bukan “melalui laut,” sehingga kesejajarannya dengan “di dalam awan” tetap dipertahankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: mereka semua
  rationale: Merujuk secara kolektif kepada seluruh umat Israel yang sedang dibicarakan dan mempertahankan penekanan berulang Paulus pada kata 'semua' dalam konteks ini.
- source_word: εἰς τὸν Μωϋσῆν
  choice: ke dalam Musa
  rationale: Ungkapan yang sengaja tidak biasa ini mempertahankan konstruksi Yunani serta kesejajaran tipologis dengan bahasa baptisan, tanpa membatasinya pada satu penafsiran seperti 'menjadi pengikut Musa'.
- source_word: ἐβαπτίσαντο
  choice: dibaptis
  rationale: Bentuk tengah aoris ini paling wajar diterjemahkan dalam bahasa Indonesia dengan bentuk pasif. Pilihan ini mempertahankan makna leksikal βαπτίζω dan pemakaian tipologisnya oleh Paulus.
- source_word: ἐν τῇ νεφέλῃ
  choice: di dalam awan
  rationale: Mempertahankan preposisi ἐν dan gambaran keluaran, sekaligus membiarkan nuansa lingkup, sarana, atau keterkaitan tetap terbuka.
- source_word: ἐν τῇ θαλάσσῃ
  choice: di dalam laut
  rationale: Paulus memakai ἐν, bukan διά. Terjemahan ini mempertahankan redaksinya dan kesejajarannya dengan 'di dalam awan'.
theological_decisions:
- issue: Makna Israel 'dibaptis ke dalam Musa'
  choice: Mempertahankan bahasa tipologis dan representatif 'ke dalam Musa' tanpa menjelaskannya lebih jauh di dalam teks utama.
  alternative: diidentifikasikan dengan Musa; dibaptis untuk menjadi pengikut Musa
  rationale: Paulus menghubungkan pengalaman keluaran Israel dengan baptisan orang Kristen. Terjemahan sebaiknya mempertahankan ketegangan teologis dan keluasan ungkapan tersebut, bukan menetapkan satu penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'ke dalam Musa' memang tidak lazim, tetapi sengaja dipertahankan karena penting bagi bentuk dan ketegangan teologis teks; catatan kaki menyediakan padanan yang lebih idiomatis. Urutan penanda catatan kaki diselaraskan menjadi [a][b].
