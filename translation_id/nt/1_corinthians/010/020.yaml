source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: id
  text: Bukan demikian, melainkan apa yang mereka persembahkan sebagai kurban, mereka persembahkan kepada roh-roh jahat dan bukan kepada Allah. Aku tidak ingin kamu menjadi orang-orang yang bersekutu dengan roh-roh jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengambil bagian bersama roh-roh jahat” atau “menjadi peserta bersama roh-roh jahat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Sebaliknya
  rationale: Dalam konteks, frasa ini mengoreksi kemungkinan salah paham dari ayat sebelumnya. 'Sebaliknya' menyampaikan daya korektif-adversatifnya secara alami dalam bahasa Indonesia.
- source_word: ἃ θύουσιν
  choice: apa yang mereka persembahkan sebagai kurban
  rationale: Pronomina relatif netral ἃ menunjuk secara umum kepada persembahan kurban; rumusan ini alami dan tetap mempertahankan konteks ritual.
- source_word: θύουσιν
  choice: mereka persembahkan sebagai kurban
  rationale: Dalam konteks kultis, θύω berarti mempersembahkan sesuatu sebagai kurban. Pilihan ini lebih jelas daripada sekadar 'mempersembahkan' dan lebih alami daripada memakai 'mengurbankan' dua kali.
- source_word: δαιμονίοις
  choice: kepada roh-roh jahat
  rationale: Dalam pemakaian Perjanjian Baru, δαιμόνιον menunjuk kepada makhluk rohani jahat. 'Roh-roh jahat' merupakan padanan Indonesia yang jelas dan lazim tanpa menyiratkan dewa-dewa netral.
- source_word: καὶ οὐ θεῷ
  choice: dan bukan kepada Allah
  rationale: θεῷ tanpa artikel bersifat definit dalam pertentangan monoteistis ini; 'Allah' mempertahankan kontras dengan roh-roh jahat.
- source_word: οὐ θέλω δὲ
  choice: Aku tidak mau
  rationale: δέ mengalihkan perhatian kepada penerapan peringatan Paulus. Dalam bahasa Indonesia, kalimat baru tanpa konjungsi eksplisit menghasilkan alur yang alami tanpa menghilangkan hubungan logisnya.
- source_word: κοινωνοὺς
  choice: orang-orang yang mengambil bagian bersama
  rationale: κοινωνός menyatakan keterlibatan atau persekutuan partisipatif. Ungkapan ini mudah dipahami serta mempertahankan bobot keterlibatan nyata tanpa mempersempitnya menjadi hubungan sosial biasa.
- source_word: τῶν δαιμονίων
  choice: bersama roh-roh jahat
  rationale: Genitif sesudah κοινωνούς paling alami dinyatakan sebagai kebersamaan partisipatif dalam bahasa Indonesia, bukan kepemilikan.
- source_word: γίνεσθαι
  choice: menjadi
  rationale: γίνομαι menekankan masuk ke dalam suatu keadaan; 'menjadi' mempertahankan nuansa tersebut.
theological_decisions:
- issue: Hakikat persembahan kurban dalam ibadah berhala
  choice: Paulus menyatakan bahwa kurban itu dipersembahkan kepada roh-roh jahat, bukan kepada Allah.
  alternative: Pernyataan ini hanya menggambarkan makna sosial perjamuan berhala atau memakai 'roh-roh jahat' secara metaforis.
  rationale: Kontras eksplisit 'kepada roh-roh jahat dan bukan kepada Allah' dipertahankan tanpa dilunakkan atau ditambahi spekulasi tentang hakikat roh-roh tersebut.
- issue: Daya ungkap κοινωνοὺς τῶν δαιμονίων
  choice: Keterlibatan partisipatif bersama roh-roh jahat.
  alternative: Sekadar pergaulan sosial dengan penyembah berhala, atau penyerahan diri sepenuhnya dalam penyembahan kepada roh-roh jahat.
  rationale: Konteks ayat 16–18 memakai gagasan partisipasi yang nyata. Terjemahan mempertahankan keseriusan itu tanpa melebihkannya menjadi pernyataan tentang kesetiaan total.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban' dipakai untuk konteks persembahan ritual; 'roh-roh jahat' dipilih sebagai padanan komunikatif bagi δαιμόνια. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
