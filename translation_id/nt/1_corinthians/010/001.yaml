source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: id
  text: 'Sebab aku tidak mau kamu tidak mengetahui hal ini, Saudara-saudara[a]: nenek moyang kita semuanya berada di bawah awan dan semuanya melintasi laut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “saudara-saudara”; sapaan ini dapat ditujukan kepada seluruh jemaat, baik laki-laki maupun perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: aku tidak mau kamu tidak mengetahui hal ini
  rationale: Mempertahankan bentuk negatif idiom Paulus, tetapi menambahkan 'hal ini' agar konstruksinya wajar dan jelas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan uraian sebelumnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku dan alami kepada komunitas; dalam konteks jemaat bentuk ini mencakup laki-laki dan perempuan.
- source_word: οἱ πατέρες ἡμῶν
  choice: nenek moyang kita
  rationale: Ungkapan Indonesia yang alami untuk para leluhur Israel, sekaligus mempertahankan identifikasi Paulus dan pembacanya dengan sejarah mereka.
- source_word: πάντες
  choice: semuanya
  rationale: Diulang dua kali untuk mempertahankan penekanan retoris teks Yunani.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: berada di bawah awan
  rationale: Mempertahankan gambaran awan dalam peristiwa keluaran tanpa menambahkan penafsiran.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: berjalan melintasi laut
  rationale: Menyatakan gerakan melalui atau menyeberangi laut secara alami; 'berjalan' sesuai dengan perjalanan umat tanpa merinci cara secara berlebihan.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat campuran
  choice: Saudara-saudara
  alternative: saudara-saudara laki-laki; saudara-saudari
  rationale: Dalam bahasa Indonesia, 'Saudara-saudara' lazim berfungsi sebagai sapaan kolektif tanpa harus membatasi jenis kelamin; catatan kaki menjelaskan cakupannya.
- issue: Identifikasi jemaat dengan Israel dalam οἱ πατέρες ἡμῶν
  choice: nenek moyang kita
  alternative: bapak-bapak kita; leluhur kita
  rationale: Pilihan ini mempertahankan hubungan korporat yang dinyatakan Paulus sambil memakai ungkapan Indonesia yang wajar dan tidak menyiratkan hanya ayah biologis langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur negatif Paulus serta pengulangan 'semuanya' dipertahankan; tanda titik dua memperjelas bahwa klausa berikutnya adalah isi yang tidak boleh mereka abaikan.
