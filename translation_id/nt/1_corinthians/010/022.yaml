  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: id
  text: Atau apakah kita membangkitkan kecemburuan Tuhan? Tentu kita tidak lebih kuat daripada Dia, bukan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: membangkitkan kecemburuan
  rationale: Menyampaikan makna kausatif verba Yunani, yaitu membuat pihak lain cemburu, dengan ungkapan Indonesia yang alami dan tetap mempertahankan tema kecemburuan ilahi.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Padanan baku dan kontekstual bagi κύριος; rujukannya dibiarkan sebagaimana teks Yunani tanpa mempersempitnya secara interpretatif.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: lebih kuat daripada Dia
  rationale: Mempertahankan bentuk komparatif dan kontras retoris dari teks sumber.
theological_decisions:
- issue: Kecemburuan Tuhan
  choice: membangkitkan kecemburuan Tuhan
  alternative: membuat Tuhan marah
  rationale: Pilihan utama mempertahankan istilah kecemburuan yang menggemakan konteks perjanjian dan penyembahan berhala, tanpa mereduksinya menjadi kemarahan umum.
- issue: Daya retoris pertanyaan kedua
  choice: Tentu kita tidak lebih kuat daripada Dia, bukan?
  alternative: Apakah kita lebih kuat daripada Dia?
  rationale: Partikel μή mengharapkan jawaban negatif; terjemahan ini menyatakan ekspektasi tersebut sambil mempertahankan bentuk pertanyaan retoris.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi “Dia” dipakai untuk memperjelas bahwa pronomina merujuk kepada Tuhan, tanpa menambahkan sebutan yang tidak terdapat dalam teks.
