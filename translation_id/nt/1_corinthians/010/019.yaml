base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: id
  text: Jadi, apa yang kukatakan? Bahwa makanan yang dipersembahkan kepada berhala itu berarti sesuatu[a][b], atau bahwa berhala itu berarti sesuatu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bahwa makanan persembahan kepada berhala itu berarti sesuatu.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks argumennya, Paulus tidak sedang menyatakan bahwa berhala benar-benar ada sebagai ilah atau bahwa makanan persembahan itu pada dirinya memiliki makna rohani intrinsik.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Jadi, apa yang hendak kukatakan?
  rationale: Mempertahankan bentuk pertanyaan retoris orang pertama dan alur argumentasi οὖν secara alami dalam bahasa Indonesia.
- source_word: ὅτι
  choice: Bahwa
  rationale: Memperkenalkan isi kemungkinan pernyataan Paulus tanpa menambahkan penafsiran.
- source_word: εἰδωλόθυτόν
  choice: makanan yang dipersembahkan kepada berhala
  rationale: Dalam konteks 1 Korintus 8–10, istilah ini menunjuk pada makanan, khususnya daging, yang terkait dengan persembahan kepada berhala; pilihan ini jelas dan tidak mempersempitnya hanya pada daging.
- source_word: τί ἐστιν
  choice: mempunyai arti tertentu
  rationale: Ungkapan ini menyampaikan idiom Yunani tentang keberadaan, bobot, atau makna nyata dalam konteks, sambil mempertahankan ketidakpastian mengenai segi tepat yang dimaksud.
- source_word: ἢ
  choice: atau
  rationale: Mempertahankan hubungan disjungtif sederhana antara kedua klausa sejajar.
- source_word: εἴδωλον
  choice: berhala
  rationale: Padanan Indonesia yang baku dan tepat dalam konteks penyembahan berhala.
theological_decisions:
- issue: Apakah pertanyaan Paulus menegaskan keberadaan atau signifikansi nyata dari berhala dan makanan persembahan
  choice: Kedua klausa diterjemahkan sebagai pertanyaan retoris dengan frasa 'mempunyai arti tertentu'.
  alternative: Bahwa makanan persembahan kepada berhala itu sungguh-sungguh ada, atau bahwa berhala itu sungguh-sungguh ada?
  rationale: Teks Yunani memakai τί ἐστιν secara ringkas dan dapat menyentuh keberadaan maupun signifikansi. Terjemahan utama tidak secara diam-diam menyelesaikan ketegangan itu sebagai pernyataan metafisis semata.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'kukatakan' mempertahankan orang pertama secara ringkas; pengulangan 'mempunyai arti tertentu' mencerminkan kesejajaran kedua klausa Yunani. Semua penanda catatan kaki dicantumkan dalam teks utama.
