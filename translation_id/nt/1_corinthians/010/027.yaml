  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: id
  text: Jika seorang yang tidak percaya mengundang kalian dan kalian mau pergi, makanlah apa pun yang dihidangkan kepada kalian tanpa mengajukan pertanyaan apa pun[a], demi hati nurani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanpa memeriksa apa pun” atau “tanpa menyelidiki apa pun.” Dalam konteks jamuan, ini berarti tidak mencari tahu asal makanan yang disajikan.
    reason: lexical_alternative
  - marker: b
    text: Ayat berikutnya menjelaskan “hati nurani” lebih lanjut dengan membedakan hati nurani orang lain dari hati nurani sendiri.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: orang yang tidak percaya
  rationale: Bentuk ini menunjuk kepada orang di luar komunitas orang percaya. Ungkapan ini jelas dan wajar dalam bahasa Indonesia tanpa menambahkan nada permusuhan.
- source_word: καλεῖ
  choice: mengundang
  rationale: Dalam konteks jamuan makan, καλέω berarti mengundang, bukan sekadar memanggil.
- source_word: θέλετε πορεύεσθαι
  choice: kalian mau pergi
  rationale: Menyampaikan kemauan untuk menerima undangan sekaligus mempertahankan sifat bersyarat kalimat.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: apa pun yang dihidangkan kepada kalian
  rationale: Mengacu pada seluruh makanan yang disajikan kepada para tamu; pilihan ini alami dan tepat dalam konteks jamuan.
- source_word: ἐσθίετε
  choice: makanlah
  rationale: Imperatif kini di sini menyampaikan petunjuk umum, yang secara wajar diterjemahkan dengan bentuk perintah sederhana.
- source_word: μηδὲν ἀνακρίνοντες
  choice: tanpa menanyakan asal-usulnya
  rationale: ἀνακρίνω dapat berarti memeriksa, menyelidiki, atau menanyai. Dalam konteks ini, maksud praktisnya ialah tidak menyelidiki latar belakang makanan tersebut.
- source_word: διὰ τὴν συνείδησιν
  choice: demi hati nurani
  rationale: διά dengan akusatif menyatakan alasan atau pertimbangan. Ungkapan ini mempertahankan rumusan singkat Paulus dan kaitannya dengan ayat berikutnya.
theological_decisions:
- issue: Rujukan συνείδησις dalam konteks
  choice: Frasa utama dibiarkan merujuk secara umum kepada hati nurani sebagai pertimbangan moral.
  alternative: Menentukannya secara khusus sebagai hati nurani orang percaya atau hati nurani orang lain.
  rationale: Ayat ini sendiri tidak menentukan secara eksplisit hati nurani siapa yang dimaksud; ayat berikutnya memberikan penjelasan lebih lanjut. Terjemahan tidak menyelesaikan ketegangan itu secara prematur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk ὑμᾶς/ὑμῖν. Gaya dibuat lugas, bermartabat, dan mudah dipahami. Penanda catatan kaki [a] dan [b] ditempatkan pada bagian teks yang dijelaskan.
