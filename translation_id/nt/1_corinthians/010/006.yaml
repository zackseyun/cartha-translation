source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: id
  text: Hal-hal itu menjadi contoh bagi kita[a], supaya kita tidak menjadi orang-orang yang menginginkan hal-hal jahat, seperti mereka juga menginginkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tipe bagi kita” atau “pola bagi kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: semua itu
  rationale: Demonstrativa netral jamak ini merujuk pada berbagai peristiwa di padang gurun yang baru saja diceritakan. 'Semua itu' alami dalam bahasa Indonesia dan tidak menambah tafsiran seperti 'peristiwa-peristiwa itu'.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa kontras ringan dari kisah sebelumnya menuju penerapannya; 'Namun' mempertahankan fungsi wacana tersebut tanpa menjadikannya kontras mutlak.
- source_word: τύποι
  choice: contoh
  rationale: Dalam konteks nasihat ini, kata tersebut menunjuk pada pola atau preseden yang memberi pelajaran dan peringatan. 'Contoh' jelas bagi pembaca modern, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἡμῶν
  choice: bagi kita
  rationale: Genitif ini menyatakan relevansi atau penerapan contoh-contoh tersebut kepada komunitas Paulus; 'bagi kita' idiomatis dan tepat.
- source_word: ἐγενήθησαν
  choice: menjadi
  rationale: Bentuk γίνομαι menyatakan bahwa hal-hal tersebut menjadi atau berfungsi sebagai contoh, bukan sekadar bahwa hal-hal itu adalah contoh.
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: supaya kita tidak menjadi
  rationale: Konstruksi ini dapat menyatakan tujuan atau hasil. 'Supaya' mempertahankan dorongan peringatannya, sedangkan 'menjadi' mencerminkan εἶναι bersama nomina pelaku berikutnya.
- source_word: ἐπιθυμητὰς κακῶν
  choice: orang-orang yang menginginkan hal-hal jahat
  rationale: ἐπιθυμητάς adalah nomina pelaku, sehingga frasa ini mempertahankan bentuk 'orang-orang yang menginginkan'. κακῶν menunjuk pada objek-objek jahat yang diinginkan; 'hal-hal jahat' mempertahankan cakupan moral yang luas.
- source_word: καθὼς κἀκεῖνοι
  choice: sama seperti mereka juga
  rationale: '''Sama seperti'' menyatakan perbandingan, dan ''juga'' mempertahankan unsur καί dalam κἀκεῖνοι.'
- source_word: ἐπεθύμησαν
  choice: menginginkannya
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan 'menginginkan' sebelumnya. Sufiks '-nya' merujuk kembali kepada hal-hal jahat dan membuat kalimat Indonesia lengkap serta alami.
theological_decisions:
- issue: Makna τύποι dalam kaitannya dengan pengalaman Israel di padang gurun
  choice: contoh
  alternative: tipe; pola
  rationale: Konteks langsung menekankan fungsi etis sebagai peringatan bagi jemaat. 'Contoh' menyampaikan fungsi itu tanpa membatasi kata tersebut pada suatu sistem tipologi teologis; kemungkinan makna 'tipe' dan 'pola' tetap dicatat.
- issue: Kekuatan bahasa keinginan dalam ἐπιθυμητάς dan ἐπεθύμησαν
  choice: menginginkan
  alternative: menghasrati; mendambakan
  rationale: Kata Yunani di sini mencakup keinginan berdosa secara luas dan tidak khusus menunjuk nafsu seksual. 'Menginginkan' mempertahankan keluasan makna, sementara 'hal-hal jahat' menjaga bobot moralnya.
- issue: Daya konstruksi εἰς τὸ μή
  choice: supaya
  alternative: sehingga
  rationale: Konstruksi Yunani dapat membawa nuansa tujuan atau hasil. 'Supaya' paling alami dalam konteks nasihat, tetapi tidak dimaksudkan untuk meniadakan kemungkinan nuansa hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur nomina pelaku Yunani dipertahankan melalui frasa 'orang-orang yang menginginkan', dan pengulangan akar kata keinginan dijaga. 'Namun' menerjemahkan fungsi peralihan δέ, bukan kata waktu.
