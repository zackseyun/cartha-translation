  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: id
  text: Sebab bumi adalah milik Tuhan[a], beserta segala isinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Mazmur 24:1.
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: milik Tuhan
  rationale: Genitif τοῦ κυρίου menyatakan kepemilikan. Ungkapan “bumi adalah milik Tuhan” alami dalam bahasa Indonesia dan mempertahankan sebutan teologis κύριος sebagai “Tuhan”.
- source_word: γάρ
  choice: Sebab
  rationale: γάρ memberikan dasar dari Kitab Suci bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan penjelas itu.
- source_word: γῆ
  choice: bumi
  rationale: Dalam kutipan Mazmur 24:1 dan pasangannya dengan πλήρωμα, γῆ menunjuk pada bumi secara luas, bukan sekadar tanah atau wilayah.
- source_word: πλήρωμα
  choice: segala isinya
  rationale: Dalam konteks ini, πλήρωμα berarti segala sesuatu yang memenuhi atau berada di bumi. “Segala isinya” lebih alami daripada terjemahan harfiah “kepenuhannya” dan tetap ringkas.
- source_word: αὐτῆς
  choice: -nya (dalam “isinya”)
  rationale: Pronomina feminin ini merujuk kembali kepada γῆ; sufiks “-nya” menyatakan hubungan tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Kitab Suci yang memiliki bobot teologis
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Paulus memakai κύριος. “Tuhan” mempertahankan bentuk Perjanjian Baru tanpa secara langsung mengimpor konvensi tipografis “TUHAN” yang biasanya mewakili nama ilahi dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan “bumi adalah milik Tuhan” mengungkapkan genitif kepemilikan secara jelas; “beserta segala isinya” mempertahankan kesejajaran kutipan dengan ungkapan yang mudah dipahami.
