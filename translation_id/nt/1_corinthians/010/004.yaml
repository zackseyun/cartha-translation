  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: id
  text: dan semuanya minum minuman rohani yang sama, sebab mereka minum dari batu karang rohani yang mengikuti mereka[a], dan batu karang itu adalah Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Yunani dapat juga diungkapkan, “yang terus mengikuti mereka,” untuk menonjolkan tindakan yang sedang berlangsung.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus.” Di sini istilah itu diterjemahkan “Sang Mesias” karena berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες τὸ αὐτὸ
  choice: semuanya ... yang sama
  rationale: Mempertahankan penekanan Paulus bahwa seluruh umat itu mengalami pemberian yang sama.
- source_word: πνευματικὸν ... πόμα
  choice: minuman rohani
  rationale: Mempertahankan istilah teologis Paulus dan kesejajarannya dengan ‘makanan rohani’ pada ayat sebelumnya, tanpa mempersempit artinya menjadi sekadar ‘simbolis’ atau ‘ajaib’.
- source_word: ἔπιον
  choice: minum
  rationale: Bentuk aoris merangkum pengalaman bersama generasi di padang gurun; bentuk lampau tidak perlu ditandai secara morfologis dalam bahasa Indonesia karena konteks sudah menunjukkannya.
- source_word: ἔπινον
  choice: mereka minum
  rationale: Imperfek Yunani dapat menyiratkan tindakan yang berlangsung atau berulang. Bahasa Indonesia yang wajar membiarkan nuansa aspek ini ditentukan oleh konteks; catatan kaki menyebut alternatif yang lebih eksplisit.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: dari batu karang rohani yang mengikuti mereka
  rationale: ‘Batu karang’ secara alami menunjuk pada massa batu, bukan batu kecil; ‘rohani’ mempertahankan πνευματικῆς, dan ‘mengikuti’ mempertahankan gambaran partisipel kini tanpa menafsirkannya sebagai sekadar lambang.
- source_word: ἡ πέτρα δὲ ἦν
  choice: dan batu karang itu adalah
  rationale: δέ bersifat penghubung dengan kontras ringan; ‘dan’ mempertahankan alur penjelasan tanpa memperbesar pertentangan.
- source_word: ὁ Χριστός
  choice: Sang Mesias
  rationale: Dalam predikasi ini Χριστός berfungsi sebagai gelar. ‘Sang Mesias’ menyampaikan fungsi titularnya dengan jelas dan tetap wajar serta khidmat dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan identitas ‘batu karang itu adalah Sang Mesias’
  choice: Mempertahankan pernyataan identitas langsung sebagai pengenalan tipologis yang nyata dalam argumen Paulus.
  alternative: ‘Batu karang itu melambangkan Sang Mesias.’
  rationale: Klausa Yunani memakai bentuk ekuatif langsung, bukan kata yang berarti ‘melambangkan’. Terjemahan tidak menjadikan benda material dan pribadi sebagai persamaan filosofis, tetapi juga tidak melemahkan pernyataan kristologis Paulus.
- issue: Arti ‘rohani’ bagi minuman dan batu karang
  choice: Mempertahankan kata ‘rohani’.
  alternative: ‘ajaib’, ‘adikodrati’, atau ‘simbolis’.
  rationale: πνευματικός memiliki bobot teologis dan dapat mencakup pemberian ilahi serta makna tipologis. Padanan yang lebih interpretatif akan mempersempit kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan kalimat mempertahankan pengulangan serta ketegangan teologis teks Yunani tanpa memasukkan penjelasan denominatif. Huruf kecil pada awal dipertahankan karena ayat ini melanjutkan kalimat dari ayat sebelumnya.
