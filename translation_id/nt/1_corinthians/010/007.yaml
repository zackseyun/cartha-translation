revisions:
- from: Jangan pula menjadi penyembah berhala seperti beberapa orang di antara mereka. Sebagaimana ada tertulis, “Umat itu duduk untuk makan dan minum, lalu bangkit untuk bermain.”[a]
  to: Jangan pula menjadi penyembah berhala, seperti beberapa orang di antara mereka; seperti yang tertulis, “Umat itu duduk untuk makan dan minum, lalu bangkit untuk bermain.”[a]
  rationale: Revisi ini mempertahankan seluruh makna dan ambiguitas sumber. Pengantar kutipan dibuat lebih alami dalam bahasa Indonesia modern. Teks utama tetap memakai “bermain” sebagai padanan leksikal yang tidak terlalu menafsirkan, sedangkan catatan kaki kini menyajikan alternatif kontekstual yang lebih memadai bagi kemungkinan nuansa revelri.
