  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: id
  text: Jangan pula menjadi penyembah berhala, seperti beberapa orang di antara mereka; seperti yang tertulis, “Umat itu duduk untuk makan dan minum, lalu bangkit untuk bermain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpesta pora.” Kata-kata ini dikutip dari Keluaran 32:6; di sana “bermain” berkaitan dengan perayaan penyembahan berhala Israel di seputar anak lembu emas.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Jangan pula
  rationale: Partikel ini melanjutkan rangkaian larangan dalam konteks. “Jangan pula” terdengar alami dalam bahasa Indonesia sekaligus mempertahankan hubungan dengan nasihat sebelumnya.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: menjadi penyembah berhala
  rationale: “Menjadi” mempertahankan daya imperatif γίνεσθε sebagai peringatan agar tidak memasuki pola hidup tersebut, sedangkan “penyembah berhala” menyampaikan arti nomina secara jelas dan wajar.
- source_word: καθώς τινες αὐτῶν
  choice: seperti beberapa orang di antara mereka
  rationale: Ungkapan ini mempertahankan perbandingan dengan sebagian umat Israel tanpa menambahkan rincian yang tidak dinyatakan dalam teks.
- source_word: ὥσπερ γέγραπται
  choice: Sebagaimana ada tertulis
  rationale: Ini mempertahankan rumusan pengutipan Kitab Suci dan nuansa bahwa tulisan tersebut tetap berlaku sebagai kesaksian tertulis.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: Umat itu duduk
  rationale: “Umat” sesuai dengan penggunaan kolektif ὁ λαός dalam kutipan mengenai Israel dan tetap alami dalam konteks Kitab Suci.
- source_word: φαγεῖν καὶ πεῖν
  choice: untuk makan dan minum
  rationale: Kedua infinitif diterjemahkan langsung dengan pasangan ungkapan Indonesia yang alami.
- source_word: ἀνέστησαν
  choice: lalu bangkit
  rationale: “Bangkit” mempertahankan gerak naratif harfiah, sementara “lalu” menyatakan urutan tindakan yang terkandung dalam kutipan.
- source_word: παίζειν
  choice: untuk bermain
  rationale: Arti leksikal dasarnya dipertahankan dalam teks utama agar kutipan tidak ditafsirkan secara berlebihan; nuansa pesta pora dalam konteks penyembahan anak lembu emas dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Seberapa eksplisit nuansa penyembahan berhala dalam παίζειν pada kutipan Keluaran 32:6
  choice: Memakai “bermain” dalam teks utama dan menjelaskan kemungkinan arti “bersukaria” dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai “bersukaria” atau “berpesta pora”.
  rationale: Konteksnya memang pesta penyembahan berhala di sekitar anak lembu emas, tetapi verba Yunani tetap memiliki arti dasar “bermain”. Pilihan ini mempertahankan ketegangan antara bentuk leksikal kutipan dan daya kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jangan pula” menjaga kesinambungan dengan rangkaian larangan, sedangkan “umat” mempertahankan nuansa kolektif dan alkitabiah tanpa menjadi kuno.
