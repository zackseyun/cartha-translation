    rationale: Ungkapan “seperti yang tertulis” lebih alami dalam bahasa Indonesia baku modern dan tetap menerjemahkan formula ὥσπερ γέγραπται tanpa kehilangan fungsi pengutipannya.
  - severity: medium
    issue: Alternatif catatan kaki “bersukaria” tidak cukup menangkap nuansa kontekstual παίζειν.
    rationale: Dalam kutipan Keluaran 32:6, παίζειν secara leksikal dapat diterjemahkan “bermain,” tetapi konteksnya dapat menyiratkan pesta pora/revelri yang terkait dengan penyembahan berhala. “Berpesta pora” menyampaikan alternatif ini dengan lebih akurat tanpa menjadikannya satu-satunya arti teks utama.
  revised_text: Jangan pula menjadi penyembah berhala, seperti beberapa orang di antara mereka; seperti yang tertulis, “Umat itu duduk untuk makan dan minum, lalu bangkit untuk bermain.”[a]
