  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: id
  text: “Segala sesuatu diperbolehkan,” tetapi tidak semuanya bermanfaat.[a] “Segala sesuatu diperbolehkan,” tetapi tidak semuanya membangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Segala sesuatu itu sah.” Tanda kutip mencerminkan kemungkinan bahwa Paulus sedang mengutip semboyan jemaat Korintus lalu memberinya batasan; teks Yunani tidak memakai tanda kutip modern.
    reason: lexical_alternative_and_interpretive_punctuation
lexical_decisions:
- source_word: Πάντα
  choice: Segala sesuatu
  rationale: Adjektiva netral jamak yang dipakai secara substantival ini menyatakan cakupan luas dan kategoris; pengulangannya mempertahankan bentuk ringkas seperti semboyan.
- source_word: ἔξεστιν
  choice: diperbolehkan
  rationale: Kata ini menyatakan sesuatu yang diizinkan atau sah. 'Diperbolehkan' jelas dan wajar dalam bahasa Indonesia modern tanpa memberi kesan hukum yang terlalu sempit.
- source_word: ἀλλ’
  choice: tetapi
  rationale: Konjungsi adversatif sederhana ini mempertahankan kontras ringkas dalam kedua klausa.
- source_word: συμφέρει
  choice: bermanfaat
  rationale: Kata ini menunjuk pada apa yang berguna, menguntungkan, atau membawa kebaikan; 'bermanfaat' menyampaikan maksud etis Paulus secara alami.
- source_word: οἰκοδομεῖ
  choice: membangun
  rationale: Terjemahan ini mempertahankan metafora yang lazim dipakai Paulus tentang menguatkan dan menumbuhkan orang lain atau jemaat.
theological_decisions:
- issue: Apakah Πάντα ἔξεστιν ditandai sebagai semboyan jemaat Korintus yang dikutip
  choice: 'Menggunakan tanda kutip: “Segala sesuatu diperbolehkan”'
  alternative: Tanpa tanda kutip, sebagai pernyataan Paulus sendiri yang tidak ditandai sebagai kutipan
  rationale: Pengulangan frasa tersebut kemungkinan mencerminkan semboyan jemaat Korintus yang kemudian diberi batasan oleh Paulus. Karena naskah Yunani kuno tidak memakai tanda kutip modern, tanda ini merupakan keputusan interpretatif, bukan varian teks; kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan retoris. Metafora 'membangun' dipertahankan agar hubungan dengan gagasan penguatan jemaat tidak hilang.
