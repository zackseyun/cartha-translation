id: 1CO.8.3
reference: 1 Corinthians 8:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: id
  text: Namun, jika seseorang mengasihi Allah, ia dikenal oleh-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diakui oleh-Nya” atau “telah dikenal oleh-Nya.” Bentuk perfek pasif dalam bahasa Yunani dapat menyiratkan keadaan yang tetap sebagai orang yang dikenal oleh Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Namun, jika
  rationale: εἰ menyatakan syarat, sedangkan δέ memberi kontras ringan dengan pembahasan sebelumnya. “Namun, jika” mempertahankan keduanya secara alami dalam bahasa Indonesia.
- source_word: τις
  choice: seseorang
  rationale: Pronomina tak tentu ini bersifat umum dan inklusif; “seseorang” merupakan padanan baku dan alami.
- source_word: ἀγαπᾷ
  choice: mengasihi
  rationale: Bentuk kini aktif dari ἀγαπάω diterjemahkan langsung dengan “mengasihi,” yang bernada wajar sekaligus bermartabat dalam konteks kasih kepada Allah.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Dalam konteks ini θεός menunjuk kepada Allah; artikel Yunani tidak perlu direproduksi secara tersendiri dalam bahasa Indonesia.
- source_word: οὗτος
  choice: ia
  rationale: Demonstrativa ini menunjuk kembali secara tegas kepada orang yang baru disebut. Dalam bahasa Indonesia, “ia” paling alami; pengulangan “orang itulah” akan memberi penekanan yang lebih keras daripada yang diperlukan.
- source_word: ἔγνωσται
  choice: dikenal
  rationale: Perfek pasif γινώσκω menyatakan keadaan kini sebagai hasil tindakan yang telah terjadi. “Dikenal” mempertahankan bentuk pasif serta tidak mempersempit maknanya menjadi sekadar disetujui atau diakui.
- source_word: ὑπ’ αὐτοῦ
  choice: oleh-Nya
  rationale: Pronomina ini paling wajar merujuk kembali kepada Allah. “Oleh-Nya” mempertahankan rujukan pronominal dengan jelas dan ringkas.
theological_decisions:
- issue: Makna Allah mengenal orang yang mengasihi-Nya
  choice: dikenal oleh-Nya
  alternative: diakui oleh-Nya; diperkenan oleh-Nya; telah dikenal oleh-Nya dalam arti keselamatan
  rationale: Ketika Allah menjadi pelaku, γινώσκω dapat mengandung pengenalan relasional atau pengakuan, bukan hanya pengetahuan faktual. Teks Yunani tidak mewajibkan satu pengertian doktrinal yang lebih sempit, sehingga keluasan dan ketegangannya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi pronomina “-Nya” memperjelas bahwa rujukannya adalah Allah. Penanda catatan kaki ditempatkan langsung setelah klausa yang diterangkannya.
