  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: id
  text: Dengan demikian[c], dengan berbuat dosa terhadap saudara-saudara[a] seperti itu dan melukai hati nurani mereka yang lemah, kamu berdosa terhadap Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” di sini berarti sesama orang percaya dan dalam konteks ini dapat mencakup laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus”. Kata Yunani Χριστός berarti Yang Diurapi.
    reason: alternative_reading
  - marker: c
    text: Atau, “Demikianlah, dengan berbuat dosa terhadap saudara-saudara dan melukai hati nurani mereka yang lemah, kamu berdosa terhadap Mesias.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Dengan demikian
  rationale: Ungkapan ini menghubungkan ayat dengan tindakan yang baru saja dijelaskan dan menunjuk kembali kepada cara berbuat tersebut, tanpa menambahkan pertentangan yang kuat.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: ketika kamu berdosa terhadap saudara-saudara
  rationale: Partisipel kini menyatakan keadaan atau tindakan yang menyertai verba utama. Kata depan εἰς sesudah ἁμαρτάνω menunjukkan arah tindakan yang merugikan, sehingga diterjemahkan 'terhadap'.
- source_word: τύπτοντες
  choice: melukai
  rationale: Secara harfiah kata ini berarti memukul atau menghantam, tetapi di sini digunakan secara kiasan terhadap hati nurani. 'Melukai' mempertahankan daya gambarnya dan terdengar alami dalam bahasa Indonesia.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: hati nurani mereka yang lemah
  rationale: Bentuk tunggal 'hati nurani' dipertahankan sebagaimana teks Yunani, dengan makna distributif bagi kelompok yang disebut; ἀσθενοῦσαν menerangkan hati nurani itu sebagai lemah.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: kamu berdosa terhadap Mesias
  rationale: εἰς kembali menyatakan arah pelanggaran. Bentuk kini diterjemahkan secara langsung, dan Χριστός dipertahankan sebagai gelar 'Mesias'.
theological_decisions:
- issue: Cakupan ἀδελφοὺς dalam jemaat
  choice: saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam sapaan dan pembicaraan mengenai jemaat dapat mencakup orang percaya laki-laki maupun perempuan. Teks utama mempertahankan bentuk sumber, sedangkan cakupannya dijelaskan dalam catatan.
- issue: Penerjemahan Χριστόν
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός merupakan gelar bagi Yang Diurapi. 'Mesias' menyatakan arti gelar itu, sementara bentuk tradisional 'Kristus' dicantumkan sebagai alternatif.
- issue: Hubungan οὕτως dengan tindakan berdosa
  choice: Dengan demikian
  alternative: dengan berbuat dosa terhadap saudara-saudara seperti itu
  rationale: Ungkapan Yunani menunjuk kembali kepada cara bertindak yang dibahas sebelumnya. Teks utama membiarkannya berlaku pada seluruh keadaan, sementara catatan mempertahankan kemungkinan mengaitkannya lebih khusus dengan tindakan berdosa terhadap saudara-saudara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat kerasulan yang lugas dan bermartabat. Susunan partisipel Yunani dialihkan menjadi anak kalimat 'ketika' agar alami, sedangkan pengulangan 'berdosa terhadap' dipertahankan untuk menjaga tekanan retoris ayat.
