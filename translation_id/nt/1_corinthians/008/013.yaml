id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: id
  text: Karena itu, jika makanan membuat saudaraku tersandung, aku tidak akan pernah lagi makan daging, supaya aku tidak membuat saudaraku tersandung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Karena itu
  rationale: Menunjukkan kesimpulan tegas dari pembahasan sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: βρῶμα
  choice: makanan
  rationale: Istilah umum untuk sesuatu yang dimakan; berbeda dari κρέα yang secara khusus diterjemahkan 'daging'.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: membuat ... tersandung
  rationale: Mempertahankan metafora Paulus tentang menyebabkan sesama jatuh secara rohani atau terdorong berbuat melawan hati nuraninya.
- source_word: οὐ μὴ φάγω
  choice: aku tidak akan pernah lagi makan
  rationale: Konstruksi οὐ μή dengan aoristus subjunktif menyatakan penyangkalan yang sangat tegas.
- source_word: κρέα
  choice: daging
  rationale: Merujuk pada daging sebagai makanan, sesuai kontras dengan βρῶμα yang lebih umum.
- source_word: εἰς τὸν αἰῶνα
  choice: pernah lagi
  rationale: Dalam konteks sumpah pribadi mengenai tindakan pada masa mendatang, idiom ini menyatakan 'selamanya/tidak pernah lagi'; bentuk Indonesia ini alami sekaligus mempertahankan ketegasannya.
- source_word: ἀδελφόν
  choice: saudaraku
  rationale: Mempertahankan bahasa kekerabatan jemaat dalam bentuk tunggal maskulin sebagaimana teks Yunani.
theological_decisions:
- issue: Cakupan komitmen Paulus untuk tidak makan daging
  choice: aku tidak akan pernah lagi makan daging
  alternative: aku tidak akan makan daging untuk selama-lamanya
  rationale: Komitmen mutlak dipertahankan tanpa menyiratkan bahwa makan daging pada dirinya dilarang; klausa bersyarat mengaitkannya dengan dampak terhadap saudara seiman.
- issue: Makna σκανδαλίζω
  choice: membuat ... tersandung
  alternative: menyebabkan ... berbuat dosa
  rationale: Metafora sumber dipertahankan karena dapat mencakup kejatuhan rohani atau pelanggaran hati nurani tanpa mempersempit maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'membuat saudaraku tersandung' dipertahankan untuk mencerminkan penekanan retoris teks Yunani.
