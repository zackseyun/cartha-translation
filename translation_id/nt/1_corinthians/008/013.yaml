  source_fidelity: 'Teks Indonesia dengan setia mencerminkan semua unsur utama Yunani: διόπερ sebagai kesimpulan (“Karena itu”), βρῶμα sebagai “makanan”, penegasan οὐ μή, κρέα sebagai “daging”, εἰς τὸν αἰῶνα melalui komitmen “tidak akan pernah lagi”, dan tujuan negatif ἵνα μή. Pengulangan σκανδαλίζω serta ἀδελφόν μου dipertahankan. “Tidak akan pernah lagi makan daging” merupakan idiom Indonesia yang wajar untuk komitmen tanpa batas ke depan dan tidak mengubah cakupan kalimat bersyaratnya.'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada pantas. Susunan “jika makanan membuat saudaraku tersandung” dan pengulangan pada klausa tujuan terdengar alami serta mempertahankan penekanan retoris teks sumber.
  terminology: Pembedaan “makanan” (βρῶμα) dan “daging” (κρέα) tepat. “Membuat ... tersandung” mempertahankan metafora σκανδαλίζω tanpa secara interpretatif mempersempitnya menjadi ‘membuat berdosa’. “Saudaraku” sesuai dengan bahasa kekerabatan jemaat dalam konteks Paulus.
