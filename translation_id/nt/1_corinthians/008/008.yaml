id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: id
  text: Namun, makanan tidak akan membuat kita berkenan kepada Allah.[a] Jika kita makan, kita tidak memperoleh kelebihan; dan jika kita tidak makan, kita tidak mengalami kekurangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak akan membawa kita ke hadapan Allah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Jika kita makan, keadaan kita tidak menjadi lebih baik; dan jika kita tidak makan, keadaan kita tidak menjadi lebih buruk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: makanan
  rationale: Istilah ini menunjuk pada makanan secara umum, bukan khusus daging atau suatu jamuan tertentu.
- source_word: παραστήσει
  choice: membuat ... berkenan kepada
  rationale: Dalam konteks ini, bentuk tersebut berkaitan dengan kedudukan atau penerimaan di hadapan Allah. Ungkapan ini alami dalam bahasa Indonesia, tanpa menggambarkan gerakan fisik mendekat.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Dativus ini secara idiomatis melengkapi ungkapan 'berkenan kepada Allah'.
- source_word: περισσεύομεν
  choice: kita ... memperoleh kelebihan
  rationale: Mempertahankan gagasan mempunyai surplus atau keuntungan tanpa mengubahnya secara langsung menjadi penilaian moral.
- source_word: ὑστερούμεθα
  choice: kita ... mengalami kekurangan
  rationale: Menyampaikan arti kekurangan atau keadaan defisit serta menjaga pertentangannya dengan 'memperoleh kelebihan'.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan pembahasan sebelumnya.
- source_word: γὰρ
  choice: tidak diterjemahkan secara eksplisit
  rationale: Hubungan penjelas antara kedua kalimat sudah jelas secara alami dalam bahasa Indonesia; menerjemahkannya dengan 'sebab' juga mungkin.
theological_decisions:
- issue: Apakah makanan memengaruhi penerimaan atau kedudukan seseorang di hadapan Allah
  choice: Makanan itu sendiri tidak membuat seseorang berkenan kepada Allah; makan atau tidak makan tidak menghasilkan kelebihan ataupun kekurangan.
  alternative: Makanan tidak membawa kita ke hadapan Allah atau mendekatkan kita kepada-Nya.
  rationale: παραστήσει dapat mengandung nuansa menghadapkan, mempersembahkan, atau membuat diterima. Terjemahan utama menyatakan implikasi relasional dalam konteks ini, sedangkan catatan kaki mempertahankan kemungkinan ungkapan yang lebih formal dan spasial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur paralel kedua klausa dipertahankan, dengan diksi yang bermartabat dan tanpa istilah denominasi.
