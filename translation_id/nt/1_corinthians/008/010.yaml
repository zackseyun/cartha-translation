- from: Sebab, jika seseorang melihat engkau, yang mempunyai pengetahuan, sedang berbaring untuk makan di dalam kuil berhala, bukankah hati nuraninya—karena orang itu lemah—akan dibangun[a] sehingga ia makan makanan yang dipersembahkan kepada berhala?
  to: Sebab, jika seseorang melihat engkau, yang mempunyai pengetahuan, sedang bersantap di dalam kuil berhala, bukankah hati nurani orang yang lemah itu akan dibangun[a] untuk makan makanan yang dipersembahkan kepada berhala?
  rationale: Revisi mempertahankan alur retoris, istilah utama, serta ambiguitas/ironi οἰκοδομηθήσεται. Perubahan terbatas pada kejelasan hubungan “orang yang lemah” dengan hati nuraninya, padanan Indonesia yang alami bagi konteks bersantap, dan ketepatan alternatif dalam catatan kaki.
