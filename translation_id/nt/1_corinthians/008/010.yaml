  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: id
  text: Sebab, jika seseorang melihat engkau, yang mempunyai pengetahuan, sedang bersantap di dalam kuil berhala, bukankah hati nurani orang yang lemah itu akan dibangun[a] untuk makan makanan yang dipersembahkan kepada berhala?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “diberanikan” atau “terdorong.” Secara harfiah, kata Yunani ini berarti “dibangun”; Paulus tampaknya memakai secara ironis bahasa yang biasanya dipakainya tentang pembangunan rohani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Menghubungkan pertanyaan ini dengan peringatan sebelumnya sebagai alasan atau penjelasan.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: engkau, yang mempunyai pengetahuan
  rationale: Mempertahankan sapaan tunggal yang tajam dan tema penting tentang 'pengetahuan', tetapi tetap wajar dalam bahasa Indonesia.
- source_word: ἐν εἰδωλείῳ
  choice: di dalam kuil berhala
  rationale: Menunjukkan tempat ibadah yang berkaitan dengan berhala, bukan sekadar lokasi makan biasa.
- source_word: κατακείμενον
  choice: sedang berbaring untuk makan
  rationale: Mempertahankan gambaran konkret tentang posisi bersantap pada zaman itu sekaligus menjelaskan bahwa yang dimaksud adalah makan.
- source_word: ἀσθενοῦς ὄντος
  choice: karena orang itu lemah
  rationale: Bentuk maskulin ini paling alami merujuk kepada orang yang melihat, bukan menyatakan bahwa hati nuraninya sendiri secara gramatikal adalah lemah.
- source_word: οἰκοδομηθήσεται
  choice: akan dibangun
  rationale: 'Mempertahankan metafora harfiah dan kemungkinan ironi Paulus: sesuatu yang biasanya positif justru mengarah pada tindakan yang merusak.'
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: sehingga ia makan makanan yang dipersembahkan kepada berhala
  rationale: Menyatakan hasil atau kecenderungan tindakan itu dengan jelas dan alami.
theological_decisions:
- issue: Makna οἰκοδομηθήσεται dalam konteks peniruan yang membahayakan
  choice: akan dibangun
  alternative: akan dikuatkan hatinya; akan didorong
  rationale: Terjemahan harfiah mempertahankan hubungan dengan bahasa Paulus tentang pembangunan rohani sekaligus ironi bahwa 'pembangunan' ini menghasilkan tindakan yang melukai hati nurani. Makna idiomatis diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipakai untuk mempertahankan sapaan orang kedua tunggal; tanda pisah membantu memperjelas bahwa 'orang itu' adalah orang yang hati nuraninya sedang dibicarakan.
