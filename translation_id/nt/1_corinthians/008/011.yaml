base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: id
  text: Sebab oleh pengetahuanmu, orang yang lemah itu binasa[a]—saudara[b] yang baginya Mesias[c] mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihancurkan” atau “mengalami kebinasaan.” Kata Yunani ini dapat menyatakan kehancuran atau kebinasaan yang berat; ayat ini tidak memastikan apakah yang dimaksud ialah kerusakan rohani dalam kehidupan sekarang, kebinasaan pada akhirnya, atau keduanya.
    reason: alternative_reading
  - marker: b
    text: “Saudara” di sini berarti sesama orang percaya; dalam penerapannya, kata ini dapat mencakup saudara laki-laki maupun perempuan dalam iman.
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “Kristus”; diterjemahkan “Mesias” karena Χριστός berfungsi sebagai gelar di sini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: binasa
  rationale: Kata ini menyatakan kehancuran atau kebinasaan yang berat. Bentuk kini Yunani tidak perlu diberi penanda aspek secara eksplisit dalam bahasa Indonesia; “binasa” mempertahankan daya ungkapnya tanpa menentukan apakah yang dimaksud ialah kerusakan rohani dalam kehidupan sekarang, kebinasaan akhir, atau keduanya.
- source_word: γάρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan atau penjelasan bagi peringatan sebelumnya.
- source_word: ὁ ἀσθενῶν
  choice: orang yang lemah itu
  rationale: Partisip substantival ini secara harfiah menunjuk kepada “orang yang lemah”; penyebutan “saudara” muncul tersendiri kemudian dalam ayat.
- source_word: ἐν τῇ σῇ γνώσει
  choice: oleh pengetahuanmu
  rationale: ἐν di sini dapat menyatakan sarana atau lingkup penyebab. “Oleh pengetahuanmu” menyampaikan bahwa penggunaan pengetahuan oleh pihak yang kuat mengakibatkan kehancuran orang yang lemah.
- source_word: γνῶσις
  choice: pengetahuan
  rationale: Mempertahankan istilah kunci yang berulang dalam konteks 1 Korintus 8 dan ironi bahwa “pengetahuan” yang dibanggakan justru membahayakan sesama percaya.
- source_word: ὁ ἀδελφός
  choice: saudara
  rationale: Mencerminkan bentuk maskulin tunggal sumber sambil memakai kata Indonesia yang wajar bagi sesama seiman. Cakupan penerapannya dijelaskan dalam catatan kaki.
- source_word: δι’ ὃν
  choice: yang untuknya
  rationale: Menyatakan bahwa saudara tersebut adalah orang yang demi kepentingannya Mesias mati; susunan ini juga menjaga hubungan relatif dengan “saudara”.
- source_word: Χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini; “Mesias” menyampaikan fungsi titularnya dan makna penebusan yang ditekankan oleh kematian-Nya.
- source_word: ἀπέθανεν
  choice: telah mati
  rationale: Menyampaikan tindakan lampau yang sudah terjadi. “Telah” wajar dalam bahasa Indonesia untuk menegaskan kenyataan kematian Mesias yang mendahului keadaan yang dibicarakan.
theological_decisions:
- issue: Apakah ἀπόλλυται harus dipahami secara khusus sebagai kebinasaan kekal seorang percaya sejati
  choice: Menggunakan “binasa” sambil mempertahankan keluasan makna melalui catatan kaki
  alternative: “dihancurkan” atau “mengalami kehancuran”
  rationale: Kata Yunani dapat menunjuk pada kehancuran yang berat, tetapi ayat ini sendiri tidak secara tegas membatasi maknanya pada kerusakan rohani sementara ataupun kebinasaan eskatologis. Terjemahan tidak menyelesaikan perdebatan tentang kemurtadan dan ketekunan secara diam-diam.
- issue: Apakah ἀδελφός perlu dibuat netral gender dalam teks utama
  choice: Mempertahankan “saudara” dalam teks utama
  alternative: “sesama orang percaya” atau “saudara seiman, laki-laki maupun perempuan”
  rationale: Bentuk sumber adalah maskulin tunggal dan patut tercermin dalam teks utama, sedangkan catatan menjelaskan arti relasional dan kemungkinan penerapannya kepada saudara laki-laki maupun perempuan dalam iman.
- issue: Apakah Χριστός diterjemahkan sebagai nama baku atau gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konstruksi ini Χριστός berfungsi sebagai gelar. “Mesias” mempertahankan nilai gelar tersebut tanpa memasukkan kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan klausa mempertahankan tekanan retoris pada akibat pengetahuan yang tidak disertai kasih, lalu mengidentifikasi orang yang lemah itu sebagai saudara yang baginya Mesias telah mati. Tanda pisah mempertahankan aposisi yang tajam dalam sumber.
