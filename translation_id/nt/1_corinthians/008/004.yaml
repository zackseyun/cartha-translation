- from: Jadi, mengenai makan makanan yang dipersembahkan kepada berhala, kita tahu bahwa berhala bukanlah apa-apa di dunia ini[a] dan bahwa tidak ada Allah selain Yang Esa[b].
  to: Jadi, mengenai hal memakan makanan yang dipersembahkan kepada berhala, kita tahu bahwa berhala bukanlah apa-apa di dunia[a] dan bahwa tidak ada Allah selain yang satu[b].
  rationale: Revisi ini mempertahankan makna dan susunan argumentasi sumber sambil membuat frasa tindakan makan lebih lancar, menghindari tambahan demonstratif, dan menerjemahkan εἷς secara lebih langsung. Catatan kaki tetap ditempatkan pada unsur yang diulas dan mempertahankan alternatif yang sah tanpa memaksakan penafsiran teologis tambahan.
