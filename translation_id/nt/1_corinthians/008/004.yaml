  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: id
  text: Jadi, mengenai hal memakan makanan yang dipersembahkan kepada berhala, kita tahu bahwa berhala bukanlah apa-apa di dunia[a] dan bahwa tidak ada Allah selain yang satu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berhala tidak sungguh-sungguh ada di dunia.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak ada satu pun allah selain satu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: makan
  rationale: Nomina ini menunjuk pada tindakan makan. Dalam konstruksi περὶ τῆς βρώσεως, bentuk “mengenai makan” mempertahankan makna verbalnya dan tetap wajar dalam bahasa Indonesia.
- source_word: εἰδωλοθύτων
  choice: makanan yang dipersembahkan kepada berhala
  rationale: Istilah ini mencakup makanan yang terkait dengan persembahan kepada berhala dan tidak dibatasi hanya pada daging.
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk perfek Yunani ini memiliki makna kini dan menyampaikan seruan Paulus kepada pengetahuan bersama dengan jemaat Korintus.
- source_word: οὐδὲν εἴδωλον
  choice: berhala bukanlah apa-apa
  rationale: Ungkapan ringkas ini mempertahankan daya pernyataan Yunani tentang ketidaknyataan atau kenihilan berhala tanpa memperluas tafsir di dalam teks utama.
- source_word: ἐν κόσμῳ
  choice: di dunia ini
  rationale: κόσμος di sini menunjuk pada ranah dunia atau kenyataan ciptaan; “di dunia ini” merupakan padanan Indonesia yang alami.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: tidak ada Allah selain Yang Esa
  rationale: Terjemahan ini menyampaikan klaim monoteistis dengan jelas, sambil mempertahankan rumusan ringkas teks Yunani. Kapitalisasi menandai rujukan kepada Allah yang sejati; kemungkinan membaca θεός secara umum dicatat dalam catatan kaki.
- source_word: οὖν
  choice: Jadi
  rationale: οὖν menandai simpulan atau peralihan inferensial dari pembahasan sebelumnya. “Jadi” jelas, alami, dan tidak terlalu kaku dalam bahasa Indonesia modern.
theological_decisions:
- issue: Pernyataan Paulus tentang berhala dan keesaan Allah
  choice: Menerjemahkannya sebagai penegasan kuat bahwa berhala tidak memiliki kenyataan ilahi dan bahwa hanya Yang Esa adalah Allah.
  alternative: Memakai “berhala tidak sungguh-sungguh ada” untuk memperjelas nuansa ontologis, atau menulis “allah” dengan huruf kecil untuk menonjolkan kontras dengan dewa-dewa kafir.
  rationale: Teks menegaskan kenihilan berhala dan keunikan Allah tanpa menjabarkan rumusan teologis yang lebih kemudian. Teks utama mempertahankan ketegangan dan keringkasan itu, sedangkan alternatif yang sah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Kita” mempertahankan seruan kepada pengetahuan bersama Paulus dan para pembacanya. Pengulangan “makan makanan” dipertahankan karena membedakan tindakan makan dari objek yang dimakan, sesuai βρώσεως dan εἰδωλοθύτων.
