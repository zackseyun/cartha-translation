id: 1CO.8.5
reference: 1 Corinthians 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: id
  text: Sebab, sekalipun ada yang disebut dewa-dewa[a], baik di surga maupun di bumi—sebagaimana memang ada banyak dewa dan banyak tuan[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang dinamakan dewa-dewa.” Bentuk Yunani terutama menyatakan bahwa mereka diberi sebutan itu; dalam konteks ini, ungkapan tersebut juga dapat menyampaikan jarak terhadap status ilahi yang diklaim bagi mereka.'
    reason: lexical_alternative
  - marker: b
    text: “Tuan” menerjemahkan bentuk jamak dari kata Yunani yang juga sering diterjemahkan “Tuhan”. Di sini kata itu menunjuk kepada berbagai pihak atau kuasa yang diakui orang dengan gelar tersebut, bukan kepada satu-satunya Tuhan dalam ayat 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut dengan pernyataan sebelumnya sebagai penjelasan; dalam bahasa Indonesia, “Sebab” menyampaikan fungsi γάρ secara alami, sedangkan nuansa penegasan καί turut terungkap melalui “memang” dalam klausa berikutnya.
- source_word: εἴπερ
  choice: sekalipun memang
  rationale: Dalam konteks ini, εἴπερ mengajukan pengakuan bersyarat atau konsesif demi argumentasi. “Sekalipun memang” mempertahankan baik unsur konsesi maupun penegasannya.
- source_word: λεγόμενοι θεοὶ
  choice: yang disebut dewa-dewa
  rationale: Ungkapan ini menyatakan sebutan yang diberikan kepada mereka, bukan pengakuan Paulus bahwa mereka sungguh-sungguh ilahi. Terjemahan ini juga mempertahankan kemungkinan leksikal “yang dinamakan” tanpa memaksakan nada sindiran.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: baik di surga maupun di bumi
  rationale: Pasangan “baik ... maupun ...” menyampaikan dua ranah alternatif secara wajar dan mempertahankan cakupan kosmologis ungkapan Yunani.
- source_word: ὥσπερ
  choice: dan memang
  rationale: 'Di sini ὥσπερ menegaskan kenyataan yang diakui dalam kurung: banyak pihak atau kuasa dipandang sebagai dewa dan tuan. “Dan memang” terdengar alami serta menjaga daya konfirmatifnya.'
- source_word: θεοὶ πολλοὶ
  choice: banyak dewa
  rationale: Terjemahan langsung dan alami yang mempertahankan bentuk jamak konseptual melalui kata “banyak”.
- source_word: κύριοι πολλοί
  choice: banyak tuan
  rationale: “Tuan” mempertahankan arti dasar κύριος dan hubungan leksikalnya dengan sebutan “Tuhan” pada ayat 6, sementara huruf kecil membedakannya dari satu-satunya Tuhan yang diakui di sana.
theological_decisions:
- issue: Jarak retoris Paulus terhadap dewa-dewa bangsa lain
  choice: Menerjemahkan λεγόμενοι θεοὶ sebagai “yang disebut dewa-dewa”
  alternative: “yang disebut sebagai dewa-dewa” atau “yang konon dewa-dewa”
  rationale: “Yang disebut dewa-dewa” menyatakan bahwa status tersebut merupakan penamaan atau pengakuan orang, bukan penegasan Paulus. Pilihan ini mempertahankan ketegangan dengan pernyataan tentang satu Allah dalam konteks tanpa membuat nada merendahkan lebih tegas daripada bentuk Yunaninya.
- issue: κύριοι sebagai banyak pihak atau kuasa yang dibedakan dari satu Tuhan dalam ayat 6
  choice: Menggunakan “tuan” dengan huruf kecil
  alternative: “penguasa”
  rationale: “Tuan” menjaga hubungan leksikal dengan κύριος yang biasanya diterjemahkan “Tuhan”, sedangkan huruf kecil menandakan bahwa yang dimaksud bukan satu-satunya Tuhan dalam ayat berikutnya. “Penguasa” mungkin menjelaskan fungsi mereka, tetapi mempersempit makna istilah sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan sifat ayat yang belum selesai dan berlanjut ke ayat 6. “Sekalipun memang” dan “dan memang” menjaga gerak konsesif serta konfirmatif teks Yunani tanpa terdengar terlalu harfiah.
