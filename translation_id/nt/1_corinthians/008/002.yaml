  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: id
  text: Jika seseorang menganggap bahwa ia mengetahui sesuatu[a], ia belum mengetahui sebagaimana seharusnya ia mengetahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika seseorang menganggap bahwa ia telah memperoleh pengetahuan tentang sesuatu, ia belum mengetahui dengan cara yang seharusnya.”
    reason: Alternatif ini menampilkan lebih jelas nuansa bentuk perfektif ἐγνωκέναι dan kemungkinan bahwa καθὼς menekankan cara mengetahui.
lexical_decisions:
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: Mengungkapkan syarat dengan acuan tunggal yang bersifat umum secara wajar dalam bahasa Indonesia.
- source_word: δοκεῖ
  choice: menganggap
  rationale: Dalam konteks ini menunjuk pada penilaian subjektif atau anggapan tentang diri sendiri, bukan sekadar kesan lahiriah.
- source_word: ἐγνωκέναι τι
  choice: mengetahui sesuatu
  rationale: Bentuk perfektif menyiratkan keadaan telah memperoleh pengetahuan; bentuk sederhana ini paling alami dalam klausa Indonesia, sedangkan nuansa alternatif dicatat dalam catatan kaki.
- source_word: οὔπω ἔγνω
  choice: belum mengetahui
  rationale: Mempertahankan nuansa temporal οὔπω dan menyampaikan bahwa pengetahuannya masih tidak memadai.
- source_word: καθὼς δεῖ γνῶναι
  choice: sebagaimana seharusnya ia mengetahui
  rationale: Mempertahankan ukuran atau cara mengetahui yang semestinya, sekaligus membiarkan ketegangan mengenai apakah yang disoroti adalah cara atau taraf pengetahuan.
theological_decisions:
- issue: Acuan tunggal yang bersifat umum
  choice: seseorang ... ia
  alternative: siapa pun ... dia / mereka
  rationale: τις bersifat tunggal dan umum, mencakup siapa saja tanpa membatasi pada laki-laki; 'ia' mempertahankan ketunggalan dalam ragam bahasa Indonesia yang bermartabat.
- issue: Sifat kritik Paulus
  choice: kritik terhadap kepercayaan diri yang berlebihan dan ketidakmemadaian pengetahuan
  alternative: penolakan mutlak terhadap seluruh pengetahuan manusia
  rationale: Ungkapan 'belum mengetahui sebagaimana seharusnya' tidak menyangkal semua pengetahuan, tetapi menegaskan bahwa pengetahuan yang dibanggakan itu belum sesuai dengan ukuran yang semestinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'mengetahui' dipertahankan untuk mencerminkan permainan akar kata γινώσκω dalam teks Yunani; 'ia' digunakan sebagai pronomina tunggal yang netral gender.
