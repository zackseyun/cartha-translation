base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: id
  text: Namun, berhati-hatilah agar hak kalian ini jangan sampai menjadi batu sandungan bagi mereka yang lemah[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebebasan kalian ini.” Kata Yunani yang dipakai dapat berarti “wewenang,” “hak,” atau “kebebasan”; di sini kata itu merujuk pada kebebasan yang diklaim sebagian orang percaya untuk memakan makanan yang berkaitan dengan berhala.
    reason: lexical_alternative
  - marker: b
    text: “Mereka yang lemah” di sini berarti orang-orang yang hati nuraninya lemah dalam perkara ini.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: berhati-hatilah
  rationale: Bentuk imperatif ini menyerukan kewaspadaan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari pembahasan sebelumnya menuju peringatan etis.
- source_word: μή πως
  choice: supaya ... jangan sampai
  rationale: Mengungkapkan tindakan berjaga-jaga terhadap suatu kemungkinan negatif secara idiomatis dalam bahasa Indonesia.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: hakmu ini
  rationale: Dalam konteks ini ἐξουσία menunjuk pada hak atau kebebasan yang diklaim sebagian jemaat sehubungan dengan makanan yang dipersembahkan kepada berhala. Bentuk tunggal kolektif 'hakmu' mengikuti sapaan jamak Yunani dalam ragam Indonesia yang wajar kepada komunitas.
- source_word: πρόσκομμα
  choice: batu sandungan
  rationale: Mempertahankan metafora sesuatu yang menyebabkan orang lain jatuh secara moral atau rohani dan merupakan ungkapan yang dikenal luas dalam bahasa Indonesia.
- source_word: γένηται
  choice: menjadi
  rationale: Padanan langsung dan alami untuk gagasan 'menjadi' dalam klausa pencegahan.
- source_word: τοῖς ἀσθενέσιν
  choice: bagi mereka yang lemah
  rationale: Lebih alami daripada bentuk substantival 'orang-orang lemah' dan tetap membiarkan konteks menjelaskan jenis kelemahan yang dimaksud.
theological_decisions:
- issue: Makna ἐξουσία dalam konteks
  choice: Hak yang diklaim jemaat berkenaan dengan makanan yang terkait dengan berhala.
  alternative: Wewenang atau kuasa dalam arti yang lebih umum.
  rationale: Konteks langsung pasal 8 membahas kebebasan orang percaya yang merasa berpengetahuan untuk makan makanan yang dipersembahkan kepada berhala. 'Hak' menyampaikan persoalan etis praktis itu tanpa memasukkan gagasan kewenangan kelembagaan.
- issue: Makna τοῖς ἀσθενέσιν
  choice: Sesama orang percaya yang lemah hati nuraninya dalam perkara ini.
  alternative: Orang yang lemah secara umum atau secara fisik.
  rationale: Pemakaian berulang dalam pasal ini menghubungkan kelemahan tersebut dengan hati nurani. Teks utama tetap memakai ungkapan ringkas agar konteks, bukan parafrasa, yang menentukan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang jelas namun tidak kasar. Metafora 'batu sandungan' dipertahankan karena alami dan dikenal luas. Pronomina 'mu' dipakai secara kolektif untuk sapaan Yunani jamak kepada jemaat.
