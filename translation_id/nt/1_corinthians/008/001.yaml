  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: id
  text: 'Mengenai makanan yang dipersembahkan kepada berhala: kita tahu bahwa kita semua memiliki pengetahuan.[a] Pengetahuan membuat orang menjadi sombong, tetapi kasih membangun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mungkin Paulus sedang mengutip atau menggemakan semboyan jemaat Korintus dalam ungkapan “kita semua memiliki pengetahuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Memperkenalkan pokok baru dalam surat secara alami tanpa menambahkan kata temporal yang tidak tersurat.
- source_word: τῶν εἰδωλοθύτων
  choice: makanan yang dipersembahkan kepada berhala
  rationale: Dalam konteks ini istilah tersebut terutama menunjuk pada makanan yang telah dipersembahkan dalam penyembahan berhala; pilihan ini jelas dan tidak mempersempit makna hanya pada daging.
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Menyampaikan verba Yunani yang berbentuk perfektum tetapi bermakna kini secara langsung dan wajar.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: bahwa “kita semua memiliki pengetahuan”
  rationale: Mempertahankan cakupan πάντες serta kaitan leksikal dengan γνῶσις; tanda petik menunjukkan kemungkinan bahwa Paulus sedang mengutip atau menggemakan pernyataan jemaat Korintus tanpa menetapkannya sebagai kepastian.
- source_word: ἡ γνῶσις
  choice: Pengetahuan
  rationale: Mempertahankan pengulangan kata yang sama dengan γνῶσιν dalam klausa sebelumnya.
- source_word: φυσιοῖ
  choice: membuat orang menjadi sombong
  rationale: Mengungkapkan dampak metafora 'menggembungkan' dalam bahasa Indonesia modern yang alami; nuansa kesombongan tetap jelas.
- source_word: ἡ δὲ ἀγάπη
  choice: tetapi kasih
  rationale: Menyatakan pertentangan secara alami dan memakai padanan umum bagi ἀγάπη.
- source_word: οἰκοδομεῖ
  choice: membangun
  rationale: Mempertahankan metafora pembangunan Paulus dalam ungkapan Indonesia yang ringkas dan mudah dipahami.
theological_decisions:
- issue: Apakah klausa 'kita semua memiliki pengetahuan' merupakan pernyataan langsung Paulus atau slogan jemaat Korintus yang sedang ia tanggapi
  choice: Klausa dipertahankan tanpa pembatasan dan diberi tanda petik, disertai catatan tentang ketidakpastian retorisnya
  alternative: 'Tanpa tanda petik: ''kita tahu bahwa kita semua memiliki pengetahuan'''
  rationale: Teks Yunani tidak memiliki penanda kutipan eksplisit, tetapi konteks memungkinkan gema slogan Korintus. Tanda petik dan catatan menjaga ketegangan ini tanpa menyatakan asal slogan sebagai hal yang pasti.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Istilah konkret dan pola pertentangan sumber dipertahankan; frasa idiomatis dipilih agar mudah dipahami pembaca umum.
