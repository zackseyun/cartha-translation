reference: 1 Corinthians 8:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: id
  text: Namun, bagi kita hanya ada satu Allah, yaitu Bapa. Dari Dialah segala sesuatu berasal, dan kita ada bagi Dia.[a] Dan hanya ada satu Tuhan, yaitu Yesus Sang Mesias,[b] yang melalui-Nya segala sesuatu ada, dan melalui-Nya pula kita ada.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dan kita menuju kepada-Nya.” Ungkapan Yunani ini dapat menyatakan arah, sasaran, atau tujuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yesus Kristus.” Kata Yunani Christos dapat berfungsi sebagai gelar (“Mesias”) atau sebagai sebutan yang menyerupai nama (“Kristus”).
    reason: alternative_reading
  - marker: c
    text: Ungkapan “dari Dialah segala sesuatu berasal” dan “melalui-Nya segala sesuatu ada” membedakan Bapa sebagai sumber dari Yesus Sang Mesias sebagai perantara.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: Namun bagi kita
  rationale: 'ἀλλά menandai pertentangan dengan pembicaraan sebelumnya tentang apa yang disebut allah dan tuhan, sedangkan ἡμῖν adalah datif acuan: pengakuan yang berlaku ''bagi kita''.'
- source_word: εἷς θεὸς ὁ πατήρ
  choice: hanya ada satu Allah, yaitu Bapa
  rationale: Mengungkapkan daya pengakuan monoteistis secara alami dalam bahasa Indonesia serta mempertahankan identifikasi definitif Allah sebagai Bapa.
- source_word: ἐξ οὗ τὰ πάντα
  choice: Dari Dialah segala sesuatu berasal
  rationale: ἐξ dengan bentuk genitif menunjukkan sumber atau asal. Susunan ini mempertahankan Bapa sebagai sumber tanpa menyatakan lebih dari teks.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: dan kita ada bagi Dia
  rationale: εἰς dapat menyatakan arah, tujuan, atau sasaran. 'Ada bagi Dia' mempertahankan orientasi manusia kepada Allah sebagai tujuan, sementara kata 'ada' melengkapi elipsis Yunani secara wajar.
- source_word: εἷς κύριος
  choice: hanya ada satu Tuhan
  rationale: Mempertahankan kesejajaran dengan 'satu Allah' dan bobot kristologis κύριος dalam rumusan pengakuan ini.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  rationale: Χριστός di sini paling wishe dipahami sebagai gelar dalam rumusan 'satu Tuhan'; 'Sang Mesias' terdengar alami dan jelas sebagai gelar dalam bahasa Indonesia.
- source_word: δι’ οὗ τὰ πάντα
  choice: yang melalui-Nya segala sesuatu ada
  rationale: διά dengan bentuk genitif menyatakan perantaraan atau agen. 'Melalui-Nya' mempertahankan perbedaan dari ἐξ, sedangkan 'ada' menyatakan kopula yang tersirat.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: dan melalui-Nya pula kita ada
  rationale: Mempertahankan kesejajaran dan perantaraan Kristus. Penambahan 'ada' membuat elipsis dapat dipahami dalam bahasa Indonesia tanpa mempersempitnya khusus pada penciptaan, keselamatan, atau kehidupan.
theological_decisions:
- issue: Hubungan antara 'satu Allah' dan 'satu Tuhan' dalam pengakuan monoteistis
  choice: 'Mempertahankan dua pernyataan yang sejajar: satu Allah, yaitu Bapa, dan satu Tuhan, yaitu Yesus Sang Mesias.'
  alternative: Melemahkan sebutan 'Tuhan' atau menambahkan rumusan teologis kemudian yang tidak dinyatakan langsung dalam ayat.
  rationale: Teks memberi bobot tinggi kepada Yesus dalam pengakuan monoteistis sekaligus membedakan Bapa dan Yesus melalui relasi 'dari' dan 'melalui'. Terjemahan tidak mereduksi ataupun menjelaskan ketegangan ini secara berlebihan.
- issue: Perbedaan fungsi preposisi bagi Bapa dan Yesus
  choice: Menerjemahkan ἐξ sebagai 'dari', εἰς sebagai 'bagi', dan διά sebagai 'melalui'.
  alternative: Menyeragamkan preposisi atau menerjemahkan εἰς hanya sebagai arah harfiah 'kepada'.
  rationale: 'Perbedaan tersebut penting bagi struktur ayat: Bapa digambarkan sebagai sumber dan tujuan, sedangkan Yesus sebagai perantara. Pilihan ini mempertahankan perbedaan tanpa memasukkan sistem teologis tambahan.'
- issue: Cakupan elipsis pada 'kita ... melalui Dia'
  choice: Menggunakan 'kita ada' tanpa menentukan apakah yang dimaksud terutama penciptaan, kehidupan, atau keselamatan.
  alternative: Menerjemahkan 'kita diselamatkan melalui Dia' atau 'kita diciptakan melalui Dia'.
  rationale: Teks Yunani tidak menyebut verba dan memungkinkan cakupan yang luas. 'Ada' membuat kalimat Indonesia utuh sambil mempertahankan keterbukaan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pemenggalan menjadi tiga kalimat memperjelas struktur pengakuan tanpa mengubah hubungan antarklausanya. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Istilah 'Sang Mesias' menandai Χριστός sebagai gelar; alternatif tradisional dicatat dalam catatan kaki.
