source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: id
  text: Namun, tidak semua orang memiliki pengetahuan ini. Ada orang yang, karena mereka sampai sekarang masih terbiasa dengan berhala[a], memakan makanan itu sebagai makanan yang dipersembahkan kepada berhala, dan hati nurani mereka, yang lemah[b], tercemar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “karena kebiasaan atau keakraban dengan berhala sampai sekarang.” Susunan frasa Yunaninya sulit; maksudnya tampaknya bahwa hubungan mereka dengan penyembahan berhala masih memengaruhi cara mereka memandang makanan itu.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah memuat “hati nurani berhala” atau bacaan terkait dalam bagian ini; teks utama mengikuti bacaan SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: pengetahuan
  rationale: Mempertahankan kaitan dengan pembahasan tentang apa yang diketahui dalam konteks langsung, khususnya pengakuan bahwa berhala tidak memiliki keberadaan ilahi yang nyata.
- source_word: συνήθεια
  choice: terbiasa
  rationale: Dalam konteks ini menunjuk pada kebiasaan atau keakraban yang tertanam melalui hubungan dengan penyembahan berhala; bentuk ini alami dalam bahasa Indonesia tanpa menghapus unsur kebiasaan dalam kata Yunani.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: sampai sekarang ... dengan berhala
  rationale: Mengungkapkan unsur waktu ἕως ἄρτι dan menghubungkan τοῦ εἰδώλου dengan συνήθεια, sambil mengakui bahwa susunan Yunaninya sulit.
- source_word: εἰδωλόθυτον
  choice: makanan yang dipersembahkan kepada berhala
  rationale: Menyatakan hubungan makanan itu dengan persembahan kultis tanpa menyiratkan bahwa berhala tersebut benar-benar ilah.
- source_word: συνείδησις
  choice: hati nurani
  rationale: Padanan baku dan alami untuk kesadaran moral dalam pemakaian etis Paulus.
- source_word: ἀσθενής
  choice: lemah
  rationale: Mempertahankan istilah utama Paulus dalam pasal ini bagi hati nurani yang belum teguh dalam persoalan tersebut.
- source_word: μολύνεται
  choice: menjadi tercemar
  rationale: Menyampaikan bentuk pasif dan gambaran pencemaran moral dengan bobot etis yang sesuai.
theological_decisions:
- issue: Cara menyatakan kedudukan makanan persembahan tanpa menganggap berhala sebagai ilah yang nyata
  choice: memakannya sebagai makanan yang dipersembahkan kepada berhala
  alternative: memakannya sebagai persembahan kepada berhala
  rationale: Rumusan ini menggambarkan cara sebagian orang memandang makna kultis makanan tersebut, bukan pengakuan Paulus bahwa berhala adalah ilah yang nyata. Ketegangan antara pengetahuan dan hati nurani tetap dipertahankan.
- issue: Hubungan antara hati nurani yang lemah dan pencemaran
  choice: Karena hati nurani mereka lemah, hati nurani itu menjadi tercemar
  alternative: dan hati nurani mereka, karena lemah, menjadi tercemar
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan sebab-keadaan dalam frasa Yunani ἀσθενὴς οὖσα tanpa menjelaskan lebih jauh bagaimana pencemaran itu terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat kedua dipecah agar hubungan antara kelemahan hati nurani dan pencemarannya jelas serta alami. Pengulangan “hati nurani” dipertahankan demi kejelasan rujukan.
