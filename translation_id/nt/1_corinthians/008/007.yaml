revisions:
- from: Namun, tidak semua orang memiliki pengetahuan ini. Sebagian orang, karena sampai sekarang masih terbiasa dengan berhala[a][b], memakan makanan itu sebagai makanan yang dipersembahkan kepada berhala. Karena hati nurani mereka lemah, hati nurani itu menjadi tercemar.
  to: Namun, tidak semua orang memiliki pengetahuan ini. Ada orang yang, karena mereka sampai sekarang masih terbiasa dengan berhala[a], memakan makanan itu sebagai makanan yang dipersembahkan kepada berhala, dan hati nurani mereka, yang lemah[b], tercemar.
  rationale: Revisi memindahkan catatan varian ke frasa yang relevan dan menyelaraskan isinya dengan audit tekstual. Kalimat utama mempertahankan ambiguitas frasa δύσκολη συνήθεια ... τοῦ εἰδώλου melalui ungkapan yang alami, sambil tetap mencantumkan alternatif yang lebih harfiah. Struktur “dan hati nurani mereka, yang lemah, tercemar” mengikuti koordinasi dan partisip keadaan dalam teks Yunani.
