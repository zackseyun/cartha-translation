    rationale: “manusia yang berasal dari debu” dan “Manusia yang berasal dari surga” menjelaskan kedua adjektiva dengan cara yang agak berat. “manusia dari debu / manusia surgawi” lebih dekat pada kesejajaran χοϊκός / ἐπουράνιος dan lebih lancar dalam bahasa Indonesia.
