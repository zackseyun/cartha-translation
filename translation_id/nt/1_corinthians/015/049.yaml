  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: id
  text: Dan sama seperti kita telah mengenakan rupa manusia dari debu, kita juga akan mengenakan rupa manusia surgawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Marilah kita juga mengenakan rupa manusia surgawi.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: sama seperti
  rationale: Menandai perbandingan yang jelas antara keadaan manusia dalam Adam dan keadaan kelak dalam Manusia surgawi.
- source_word: ἐφορέσαμεν
  choice: kita telah mengenakan
  rationale: φορέω dapat berarti memakai atau mengenakan; bentuk perfektif bahasa Indonesia menghubungkan pengalaman lampau dengan keadaan kini dan mempertahankan metafora rupa yang dikenakan.
- source_word: εἰκόνα
  choice: rupa
  rationale: Dalam konteks ini 'rupa' terdengar alami untuk keserupaan yang dikenakan, sambil tetap mempertahankan hubungan dengan konsep gambar tanpa menjelaskannya secara berlebihan.
- source_word: τοῦ χοϊκοῦ
  choice: manusia yang berasal dari debu
  rationale: χοϊκός menunjuk pada yang terbuat dari atau bercirikan debu dan menggemakan penciptaan Adam; 'manusia' disuplai dari konteks ayat sebelumnya.
- source_word: φορέσομεν
  choice: kita juga akan mengenakan
  rationale: Mengikuti bentuk future indicative dalam teks utama SBLGNT dan menyatakan transformasi yang akan datang; varian hortatoris dicatat dalam catatan kaki.
- source_word: τοῦ ἐπουρανίου
  choice: Manusia yang berasal dari surga
  rationale: ἐπουράνιος berarti surgawi; ungkapan ini mempertahankan kesejajaran dengan manusia dari debu dan merujuk kepada Kristus dalam konteks langsung.
- source_word: καὶ
  choice: juga
  rationale: Pada klausa kedua, καί bersifat aditif dan paling alami diterjemahkan 'juga'.
theological_decisions:
- issue: Future indicative atau hortatory subjunctive pada verba kedua
  choice: kita juga akan mengenakan
  alternative: marilah kita juga mengenakan
  rationale: Teks cetak SBLGNT memakai φορέσομεν, future indicative, yang sesuai dengan pembahasan tentang transformasi kebangkitan. Varian φορέσωμεν yang bersifat ajakan tetap dipertahankan dalam catatan kaki.
- issue: Identitas substantiva χοϊκός dan ἐπουράνιος
  choice: manusia yang berasal dari debu / Manusia yang berasal dari surga
  alternative: yang dari debu / yang surgawi
  rationale: Konteks langsung menyebut manusia pertama dan manusia kedua. Penambahan 'manusia' membuat pasangan Adam–Kristus jelas tanpa memasukkan tafsiran di luar konteks; kapitalisasi pada sebutan kedua menandai rujukannya kepada Kristus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Mengenakan rupa' mempertahankan metafora Yunani secara cukup formal, sedangkan 'berasal dari debu/surga' menyampaikan adjektiva substantival secara alami. Penanda catatan kaki ditempatkan pada akhir kalimat yang memuat bacaan varian.
