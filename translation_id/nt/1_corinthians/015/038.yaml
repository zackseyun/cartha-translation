revisions:
- from: Namun, Allah memberinya tubuh sebagaimana yang dikehendaki-Nya, dan kepada setiap benih[a] tubuhnya sendiri.
  to: Tetapi Allah memberinya tubuh sebagaimana yang Ia kehendaki, dan kepada setiap benih Ia memberikan tubuhnya sendiri.
  rationale: Revisi mempertahankan seluruh unsur semantis teks Yunani—tindakan Allah, kehendak-Nya, penerima tunggal pada klausa pertama, serta pembagian distributif kepada tiap benih—seraya menambahkan verba pada klausa kedua demi kejelasan sintaksis bahasa Indonesia. Catatan kaki tetap menjelaskan bentuk partitif Yunani tanpa memaksakan makna “jenis benih.”
