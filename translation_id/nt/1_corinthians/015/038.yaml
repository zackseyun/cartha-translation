  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: id
  text: Tetapi Allah memberinya tubuh sebagaimana yang Ia kehendaki, dan kepada setiap benih Ia memberikan tubuhnya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν
  choice: memberinya
  rationale: Bentuk kini diterjemahkan dengan verba aktif masa kini; konstruksi ini juga secara alami mencakup penerima datif αὐτῷ.
- source_word: αὐτῷ
  choice: -nya
  rationale: Pronomina datif tunggal merujuk kembali kepada benih dalam ayat sebelumnya. Bentuk enklitik Indonesia menghasilkan ungkapan yang alami tanpa mengubah acuannya.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan baku yang mempertahankan kaitan leksikal dengan pembahasan tentang tubuh dan kebangkitan di seluruh pasal ini.
- source_word: καθὼς ἠθέλησεν
  choice: sebagaimana yang dikehendaki-Nya
  rationale: Menjaga penekanan pada kehendak Allah serta nuansa aoristus, tanpa menambahkan gagasan tentang jenis atau proses tertentu.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: kepada setiap benih
  rationale: Menyampaikan daya distributif ἑκάστῳ secara wajar dalam bahasa Indonesia. Bentuk partitif harfiah dicatat dalam catatan kaki.
- source_word: ἴδιον σῶμα
  choice: tubuhnya sendiri
  rationale: Menyatakan tubuh yang secara khusus menjadi milik tiap-tiap benih dan mempertahankan daya pengindividualan ἴδιον.
theological_decisions:
- issue: Tindakan dan kehendak Allah dalam perumpamaan benih dan tubuh
  choice: Allah ditampilkan sebagai pihak yang memberikan tubuh kepada benih sesuai dengan kehendak-Nya.
  alternative: Terjemahan yang lebih menafsirkan dapat menyebut ‘jenis tubuh’ atau ‘bentuk tubuh’ yang diberikan kepada setiap jenis benih.
  rationale: Teks menekankan tindakan dan kehendak Allah serta kekhususan tubuh tiap benih, tetapi tidak secara eksplisit menyebut jenis atau spesies. Terjemahan ini mempertahankan penekanan tersebut tanpa memasukkan kerangka doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa kedua mempertahankan elipsis verba yang terdapat dalam bahasa Yunani; ‘memberikan’ dipahami juga berlaku pada frasa ‘kepada setiap benih tubuhnya sendiri’. Kapitalisasi pronomina -Nya mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah.
