id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: id
  text: Namun, syukur kepada Allah, yang memberi kita kemenangan melalui Tuhan kita, Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk tradisional: “Yesus Kristus.” Gelar Yunani Χριστός berarti “Mesias.”'
    reason: Mencatat bentuk tradisional sekaligus menjelaskan arti gelar Yunani yang diterjemahkan dalam teks utama.
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari pembicaraan tentang maut menuju ucapan syukur; 'Namun' alami dan bermartabat dalam bahasa Indonesia.
- source_word: τῷ θεῷ χάρις
  choice: syukur kepada Allah
  rationale: Dalam ungkapan idiomatis ini, χάρις menyatakan ucapan syukur, bukan 'anugerah'. Susunan ini alami dalam bahasa Indonesia dan mempertahankan daya doksologisnya.
- source_word: τῷ διδόντι
  choice: yang memberi
  rationale: Partisipel kini substantival menggambarkan Allah sebagai pemberi; bentuk 'yang memberi' mempertahankan makna umum atau berkelanjutan tanpa membuat aspek waktunya terlalu spesifik.
- source_word: ἡμῖν
  choice: kita
  rationale: Kata ganti orang pertama jamak merujuk kepada Paulus bersama para pembaca atau orang percaya; 'kita' bersifat inklusif dan sesuai konteks.
- source_word: τὸ νῖκος
  choice: kemenangan
  rationale: Merujuk pada kemenangan tertentu atas maut yang baru dibahas. Dalam bahasa Indonesia, nomina ini tidak memerlukan penanda ketakrifan tersendiri.
- source_word: διὰ
  choice: melalui
  rationale: Dengan genetif, διά menyatakan sarana atau perantaraan; 'melalui' mempertahankan hubungan itu secara alami.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Mempertahankan gelar kristologis κύριος dan kepunyaan ἡμῶν dalam susunan Indonesia yang wajar.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός merupakan gelar yang berarti 'Mesias'. 'Sang' membuat fungsi gelarnya jelas dan idiomatis dalam bahasa Indonesia, sementara nama Yesus tetap ditransliterasikan.
theological_decisions:
- issue: Makna kemenangan dalam τὸ νῖκος
  choice: Dibiarkan sebagai 'kemenangan' tanpa menjelaskan lebih lanjut dalam teks utama
  alternative: Menambahkan 'atas maut'
  rationale: Konteks menyatakan kemenangan atas maut, tetapi frasa itu tidak muncul secara eksplisit dalam ayat ini; terjemahan tidak boleh menyisipkan penjelasan kontekstual ke dalam teks.
- issue: Penerjemahan Χριστοῦ dalam rangkaian Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός secara leksikal adalah gelar 'Yang Diurapi/Mesias'. Pilihan utama menerjemahkan gelar tersebut, sedangkan bentuk tradisional dicatat dalam catatan kaki.
- issue: Perantaraan dalam διὰ τοῦ κυρίου ἡμῶν
  choice: melalui Tuhan kita
  alternative: oleh Tuhan kita
  rationale: '''Melalui'' mempertahankan keluasan makna sarana atau perantaraan tanpa menentukan secara berlebihan mekanisme teologis kemenangan itu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. 'Namun, syukur kepada Allah' dipilih sebagai ungkapan ucapan syukur yang ringkas; 'kita' mempertahankan rujukan jamak yang inklusif. Tanda koma mengapit aposisi 'Yesus Sang Mesias' agar hubungan gelar dengan 'Tuhan kita' jelas.
