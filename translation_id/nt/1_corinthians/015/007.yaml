  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: id
  text: Sesudah itu Ia menampakkan diri kepada Yakobus[a], kemudian kepada semua rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia dilihat oleh Yakobus ... oleh semua rasul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Sesudah itu
  rationale: Keterangan waktu yang menandai peristiwa berikutnya dalam urutan penampakan kebangkitan; bentuk ini alami dan mempertahankan urutannya.
- source_word: ὤφθη
  choice: Ia menampakkan diri
  rationale: Bentuk pasif aoristus dari ὁράω dipakai secara idiomatis untuk penampakan; ungkapan Indonesia ini alami, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: Ἰακώβῳ
  choice: kepada Yakobus
  rationale: Bentuk datif menunjukkan penerima penampakan; Yakobus adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: εἶτα
  choice: kemudian
  rationale: Keterangan urutan kedua; mempertahankan perkembangan daftar sambil menghasilkan susunan bahasa Indonesia yang alami.
- source_word: ἀποστόλοις
  choice: rasul
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada para saksi yang diutus dan diakui, bukan sekadar utusan pada umumnya; 'rasul' mempertahankan makna teknisnya.
- source_word: πᾶσιν
  choice: semua
  rationale: Menegaskan keseluruhan kelompok rasul tanpa menentukan siapa saja anggotanya.
theological_decisions:
- issue: Identitas dan cakupan 'semua rasul' dalam hubungannya dengan Yakobus
  choice: Menerjemahkannya secara langsung sebagai 'semua rasul' tanpa mempersempit rujukannya.
  alternative: Memahaminya khusus sebagai kedua belas murid, atau sebagai kelompok saksi yang diutus yang lebih luas dan berbeda dari kedua belas murid.
  rationale: Teks Yunani tidak menetapkan secara tepat siapa saja yang termasuk dalam kelompok ini. Terjemahan mempertahankan ketidakjelasan tersebut dan pembedaan antara penampakan kepada Yakobus dan penampakan berikutnya kepada semua rasul.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, alami, dan bermartabat. Huruf kapital pada 'Ia' mengikuti kebiasaan penghormatan yang luas dalam penerbitan Alkitab Indonesia tanpa menambahkan penafsiran pada isi ayat.
