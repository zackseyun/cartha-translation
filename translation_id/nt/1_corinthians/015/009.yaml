  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: id
  text: Sebab aku adalah yang paling rendah di antara para rasul, yang tidak layak disebut rasul, karena aku menganiaya jemaat Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐλάχιστος
  choice: yang paling rendah
  rationale: Menyatakan kedudukan Paulus menurut penilaiannya sendiri di antara para rasul, bukan ukuran fisik.
- source_word: ἀπόστολος / ἀποστόλων
  choice: rasul / para rasul
  rationale: Istilah ini merujuk pada kelompok dan peran kerasulan yang diakui, bukan sekadar utusan biasa.
- source_word: ἱκανός
  choice: layak
  rationale: Dalam konteks perendahan diri karena pernah menganiaya jemaat, 'layak' menyampaikan ketidakpantasan Paulus, meski kata Yunani ini juga dapat berarti cakap atau memenuhi syarat.
- source_word: καλεῖσθαι
  choice: disebut
  rationale: Padanan pasif yang ringkas dan wajar untuk tindakan menyandang sebutan rasul.
- source_word: διότι
  choice: karena
  rationale: Memperkenalkan alasan langsung bagi pengakuan Paulus bahwa ia tidak layak.
- source_word: ἐδίωξα
  choice: aku pernah menganiaya
  rationale: Konteks menunjukkan tindakan bermusuhan Paulus terhadap orang percaya pada masa lampau; 'pernah' memperjelas waktu lampau tanpa mengubah isi pokok.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: jemaat Allah
  rationale: Dalam pemakaian Paulus, frasa ini menunjuk pada umat atau komunitas orang percaya milik Allah; 'jemaat Allah' alami dan mempertahankan hubungan genitif.
- source_word: ὃς
  choice: dan
  rationale: Hubungan relatif Yunani dialihkan menjadi koordinasi yang alami dalam bahasa Indonesia, dengan subjek yang sama tetap jelas.
theological_decisions:
- issue: Sifat pernyataan Paulus mengenai kerasulannya
  choice: Paulus tetap memasukkan dirinya di antara para rasul, tetapi mengaku paling rendah dan tidak layak menyandang sebutan itu.
  alternative: Menerjemahkannya seolah-olah Paulus menyangkal bahwa dirinya benar-benar seorang rasul.
  rationale: Ungkapan 'di antara para rasul' menyiratkan keanggotaannya, sedangkan 'tidak layak disebut rasul' mempertahankan perendahan dirinya karena dahulu menganiaya jemaat.
- issue: Nuansa ἱκανός
  choice: '''Layak'' dalam teks utama'
  alternative: '''Cakap'' atau ''memenuhi syarat'''
  rationale: Alasan yang diberikan Paulus—penganiayaan terhadap jemaat Allah—mendukung nuansa ketidaklayakan, tetapi kemungkinan makna kecakapan atau kualifikasi tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan alasan, pengakuan kerasulan, dan ketegangan antara status Paulus sebagai rasul dan rasa tidak layaknya.
