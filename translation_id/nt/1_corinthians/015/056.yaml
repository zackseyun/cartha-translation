  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: id
  text: Sengat maut adalah dosa, dan kuasa dosa adalah hukum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemungkinan besar “hukum” terutama mengacu pada hukum Musa dalam argumentasi Paulus, tetapi ungkapan ini juga dapat mencakup peranan hukum dalam menyingkapkan dan memperhebat dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: sengat
  rationale: Dalam konteks maut yang dipersonifikasikan dan gema ayat sebelumnya, “sengat” secara alami menggambarkan alat yang dengannya maut mencelakakan; arti harfiah lain seperti alat penghalau tidak sesuai dengan metafora ini.
- source_word: θανάτου
  choice: maut
  rationale: “Maut” mempertahankan bentuk tunggal dan gaya personifikasi dalam konteks, serta cocok dengan ungkapan “sengat maut”.
- source_word: ἁμαρτία
  choice: dosa
  rationale: Bentuk tunggal dipertahankan karena Paulus berbicara tentang dosa sebagai kuasa atau prinsip, bukan hanya perbuatan-perbuatan dosa.
- source_word: δύναμις
  choice: kuasa
  rationale: “Kuasa” menyatakan daya atau kekuatan efektif dosa dan merupakan padanan Indonesia yang wajar serta teologis tanpa memperjelas mekanismenya secara berlebihan.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam argumentasi Paulus, νόμος sangat mungkin menunjuk terutama pada hukum Musa. Padanan ini jelas bagi pembaca Indonesia, sementara catatan kaki mempertahankan kemungkinan cakupan yang lebih umum.
- source_word: δὲ
  choice: dan
  rationale: Kedua pemakaian δέ meneruskan dan menjelaskan pernyataan, bukan menyatakan pertentangan kuat. Dalam bahasa Indonesia, klausa pertama tidak memerlukan penanda tambahan, sedangkan yang kedua wajar dihubungkan dengan “dan”.
theological_decisions:
- issue: Cakupan νόμος dalam pernyataan bahwa hukum adalah kuasa dosa
  choice: “hukum Taurat” dalam teks utama, dengan catatan tentang kemungkinan arti yang lebih luas
  alternative: “hukum” secara umum
  rationale: Konteks pemikiran Paulus terutama mengarah kepada hukum Musa, dan “hukum Taurat” merupakan ungkapan Indonesia yang alami. Namun, karena kata Yunani juga dapat menyoroti peranan hukum dalam menyingkapkan dan memperhebat dosa, catatan kaki menjaga ketegangan tersebut tanpa memaksakan satu penafsiran sempit.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Maut” dipilih daripada “kematian” agar personifikasi dan ungkapan metaforisnya tetap kuat. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
