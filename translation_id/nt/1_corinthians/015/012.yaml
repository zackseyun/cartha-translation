  to: Jika diberitakan bahwa Mesias[a] telah dibangkitkan dari antara orang mati, bagaimana mungkin sebagian orang di antara kamu mengatakan bahwa tidak ada kebangkitan orang mati?
  rationale: Revisi ini secara eksplisit menyatakan klausa isi pemberitaan (ὅτι), sehingga hubungan sintaksis dan makna retoris ayat jelas dalam bahasa Indonesia. Istilah teologis dan ambiguitas pelaku pasif tetap dipertahankan; tidak ada penambahan pelaku ilahi. Penanda catatan kaki dipindahkan ke kata yang dibahas dan isi catatan diperbaiki.
