  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: id
  text: Jika diberitakan bahwa Mesias[a] telah dibangkitkan dari antara orang mati, bagaimana mungkin sebagian orang di antara kamu mengatakan bahwa tidak ada kebangkitan orang mati?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus”. Kata Yunani Χριστός dapat diterjemahkan “Mesias” atau “Kristus”; teks utama mempertahankan maknanya sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Dalam argumen ini Χριστός berfungsi sebagai gelar; 'Mesias' menerjemahkan maknanya secara wajar dalam bahasa Indonesia.
- source_word: κηρύσσεται
  choice: diberitakan
  rationale: Bentuk pasif kini menunjuk pada pemberitaan yang sedang berlangsung; 'diberitakan' alami dan mempertahankan nuansa pengumuman di muka umum.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mempertahankan ἐκ dan bentuk jamak νεκρῶν serta lazim dipahami dalam konteks kebangkitan.
- source_word: ἐγήγερται
  choice: telah dibangkitkan
  rationale: Bentuk perfek pasif menyatakan tindakan yang telah terjadi dengan hasil yang tetap, sekaligus mempertahankan bentuk pasif.
- source_word: πῶς
  choice: bagaimana mungkin
  rationale: Pertanyaan ini bersifat retoris dan menyoroti ketidakselarasan antara pemberitaan tentang Mesias dan penyangkalan kebangkitan.
- source_word: ἐν ὑμῖν τινες
  choice: beberapa orang di antara kalian
  rationale: Menunjuk pada sebagian orang yang berada di dalam komunitas penerima surat.
- source_word: ἀνάστασις νεκρῶν
  choice: kebangkitan orang mati
  rationale: Mencerminkan konstruksi genitif dan menunjuk pada kebangkitan umum orang-orang mati.
- source_word: οὐκ ἔστιν
  choice: tidak ada
  rationale: Merupakan padanan Indonesia yang alami bagi pemakaian eksistensial εἰμί.
theological_decisions:
- issue: Penerjemahan Χριστός dalam wacana Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut tetap memiliki daya sebagai gelar, sehingga maknanya diterjemahkan. Alternatif 'Kristus' dicatat karena bentuk itu juga telah mapan sebagai gelar/nama dalam bahasa Indonesia.
- issue: Pelaku tersirat dalam ἐγήγερται
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: Bentuk pasif Yunani dipertahankan tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit, meskipun konteks Paulus mengisyaratkan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν secara jelas; susunan pertanyaan dijaga alami tanpa menambahkan penanda wacana yang tidak terdapat dalam sumber.
