  terminology: “Ditundukkan” mempertahankan suara pasif sumber secara konsisten; “Anak,” “Allah,” dan pronomina kapital dipakai secara konsisten dan jelas. Catatan kaki a dan b tertambat pada unsur yang relevan dan menjelaskan alternatif tanpa memaksakan penafsiran teologis.
