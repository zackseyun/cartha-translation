  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: id
  text: Namun, ketika segala sesuatu[a] ditundukkan kepada-Nya, Anak itu sendiri pun akan ditundukkan kepada Dia yang telah menundukkan segala sesuatu kepada-Nya, supaya Allah menjadi semua di dalam semua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semuanya”. Bahasa Yunani berulang kali memakai ungkapan “segala sesuatu” (τὰ πάντα), yang mempertahankan cakupan kosmis argumen Paulus.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani ini sangat padat dan secara lebih harfiah dapat diterjemahkan “segala sesuatu di dalam semua” atau “semua di dalam segala sesuatu”. Bentuk “semua di dalam semua” mempertahankan keluasan dan daya retorisnya tanpa membatasi “semua” hanya kepada semua orang.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, ketika
  rationale: ὅταν memperkenalkan klausa waktu, sedangkan δέ menandai perkembangan ringan dari uraian sebelumnya; “Namun, ketika” wajar dalam bahasa Indonesia dan tidak membuat pertentangannya terlalu kuat.
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: ditundukkan / akan ditundukkan / yang telah menundukkan
  rationale: Rangkaian bentuk dari ὑποτάσσω diterjemahkan secara konsisten dengan “menundukkan”; bentuk pasif pada dua kemunculan pertama dipertahankan, termasuk ketika subjeknya adalah Anak.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan diulang dalam ayat. “Segala sesuatu” alami dalam bahasa Indonesia serta mempertahankan keluasan kosmis argumen Paulus.
- source_word: αὐτὸς ὁ υἱὸς
  choice: Anak itu sendiri pun
  rationale: “Itu sendiri” menyampaikan penekanan αὐτός, sedangkan “pun” secara idiomatis menunjukkan bahwa Anak termasuk dalam tahap penundukan yang selanjutnya, tanpa mengubah Anak menjadi salah satu dari “segala sesuatu” yang sebelumnya ditundukkan.
- source_word: τῷ ὑποτάξαντι
  choice: kepada Dia yang telah menundukkan
  rationale: Partisipel aoris berartikel berfungsi substantival. Bentuk ini mempertahankan rujukan kepada pelaku yang menundukkan segala sesuatu, yaitu Allah dalam konteks.
- source_word: ἵνα ᾖ
  choice: supaya ... menjadi
  rationale: “Supaya” mempertahankan nuansa tujuan atau hasil dari ἵνα dengan subjungtif tanpa memaksakan salah satunya.
- source_word: πάντα ἐν πᾶσιν
  choice: semua di dalam semua
  rationale: Ungkapan Yunani ini sangat padat. Terjemahan formal yang juga bersifat retoris ini menjaga pengulangan πᾶς dan tidak mempersempit πᾶσιν hanya kepada manusia.
theological_decisions:
- issue: Penundukan Anak kepada Allah
  choice: Menyatakan secara langsung bahwa Anak sendiri akan ditundukkan kepada Dia yang telah menundukkan segala sesuatu kepada-Nya.
  alternative: Mengubahnya menjadi “Anak akan menyerahkan diri” atau menambahkan penjelasan bahwa penundukan ini hanya berkaitan dengan peran, bukan hakikat.
  rationale: Bentuk pasif dan ketegangan teologis dalam teks dipertahankan. Terjemahan tidak menyisipkan penjelasan dogmatis yang tidak dinyatakan oleh ayat, juga tidak menyimpulkan bahwa Anak lebih rendah dalam hakikat.
- issue: Cakupan πάντα ἐν πᾶσιν
  choice: “semua di dalam semua”
  alternative: “segala-galanya bagi semua orang” atau “segala sesuatu di dalam segala sesuatu”
  rationale: Pilihan utama mempertahankan kepadatan dan keluasan ungkapan Paulus. Alternatif yang menyebut “semua orang” mempersempit rujukan gramatikal yang dapat dipahami secara lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pasif dipertahankan karena penting bagi bentuk dan ketegangan teologis teks. Huruf kapital pada “Anak”, “Dia”, dan pronomina “-Nya” membantu menunjukkan rujukan ilahi dalam kalimat yang memiliki beberapa anteseden.
