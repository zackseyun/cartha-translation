  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: id
  text: 'Saudara-saudara[a], aku mengatakan ini: daging dan darah tidak dapat mewarisi Kerajaan Allah[b], dan yang dapat binasa tidak mewarisi yang tidak dapat binasa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani yang secara harfiah berarti “saudara-saudara” dapat mencakup seluruh jemaat, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: “Daging dan darah” adalah ungkapan untuk kehidupan manusia fana dalam keadaannya sekarang, bukan penyangkalan terhadap kebangkitan tubuh.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: yang hendak kukatakan ialah ini
  rationale: Mengungkapkan peralihan dan penjelasan langsung Paulus secara wajar dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam teks Yunani.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku, alami, dan bermartabat dalam bahasa Indonesia; bentuk ini dapat mencakup seluruh jemaat tanpa perlu menambahkan pembedaan gender dalam teks utama.
- source_word: σὰρξ καὶ αἷμα
  choice: daging dan darah
  rationale: Mempertahankan ungkapan sumber yang merujuk pada kehidupan manusia fana dalam keadaannya sekarang.
- source_word: βασιλείαν θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan teologis yang baku dan transparan untuk konstruksi Yunani ini.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: mewarisi
  rationale: Mempertahankan kesejajaran pengulangan kata kerja serta nuansa warisan eskatologis.
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Padanan langsung dan alami yang menyatakan ketidakmampuan.
- source_word: ἡ φθορά
  choice: yang dapat binasa
  rationale: Dalam konteks kebangkitan, frasa ini menyatakan keadaan yang tunduk pada kebinasaan atau kelapukan dan membentuk kontras yang jelas dengan ἀφθαρσία.
- source_word: τὴν ἀφθαρσίαν
  choice: yang tidak dapat binasa
  rationale: Mempertahankan pertentangan leksikal dengan φθορά tanpa menggantinya dengan konsep terkait tetapi tidak identik, seperti kekekalan atau ketidakmatian.
theological_decisions:
- issue: Makna “daging dan darah” dalam kaitannya dengan kebangkitan
  choice: Dipertahankan sebagai ungkapan bagi kehidupan manusia fana dalam keadaannya sekarang.
  alternative: Dipahami sebagai penolakan terhadap keberadaan jasmani atau material itu sendiri.
  rationale: Konteks langsung membahas perubahan dari keadaan yang dapat binasa menjadi yang tidak dapat binasa, bukan peniadaan tubuh.
- issue: Cakupan sapaan ἀδελφοί
  choice: Diterjemahkan “Saudara-saudara” dan dijelaskan bahwa sapaan ini dapat mencakup seluruh jemaat.
  alternative: Diterjemahkan secara eksplisit “saudara-saudari.”
  rationale: “Saudara-saudara” merupakan sapaan kelompok yang baku dalam bahasa Indonesia dan cukup dekat dengan bentuk sumber, sementara cakupan inklusifnya dijernihkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Susunan pembuka dibuat idiomatis, sedangkan pengulangan “mewarisi” dan kontras “dapat binasa/tidak dapat binasa” dipertahankan untuk mencerminkan paralelisme Yunani.
