id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: id
  text: Karena itu, saudara-saudaraku[a] yang terkasih, jadilah teguh, tidak tergoyahkan, dan selalu berlimpah dalam pekerjaan Tuhan, sebab kalian tahu bahwa jerih payah kalian di dalam Tuhan tidak sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani adelphoi secara gramatikal berbentuk maskulin jamak, tetapi menurut konteks dapat merujuk secara kolektif kepada sesama orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Karena itu
  rationale: Kata penghubung ini menarik kesimpulan dari uraian sebelumnya tentang kebangkitan; “Karena itu” mempertahankan daya inferensialnya secara alami.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: saudara-saudaraku yang terkasih
  rationale: “Saudara-saudaraku” mempertahankan sapaan kekeluargaan dan bentuk jamak, sedangkan “yang terkasih” menerjemahkan ἀγαπητοί secara langsung dan wajar.
- source_word: ἑδραῖοι γίνεσθε
  choice: jadilah teguh
  rationale: “Jadilah” mempertahankan daya imperatif γίνεσθε, sementara “teguh” menyampaikan keadaan yang kokoh dan mantap.
- source_word: ἀμετακίνητοι
  choice: tidak tergoyahkan
  rationale: Ungkapan ini menyampaikan keadaan yang tidak dapat dipindahkan dari pendirian, dengan bahasa Indonesia yang alami dan kuat.
- source_word: περισσεύοντες ... πάντοτε
  choice: selalu berlimpah
  rationale: Pilihan ini mempertahankan gagasan kelimpahan sekaligus sifat tindakan yang terus berlangsung.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: dalam pekerjaan Tuhan
  rationale: Terjemahan ini tetap luas dan tidak membatasi ἔργον hanya pada pelayanan resmi atau satu jenis kegiatan tertentu.
- source_word: εἰδότες
  choice: sebab kalian tahu
  rationale: Partisip ini paling alami dipahami secara kausal dalam nasihat tersebut; bentuk eksplisit ini menghasilkan bahasa Indonesia yang lancar tanpa mengubah isi proposisinya.
- source_word: ὁ κόπος ὑμῶν
  choice: jerih payah kalian
  rationale: “Jerih payah” menangkap usaha berat dan melelahkan yang terkandung dalam κόπος lebih baik daripada sekadar “pekerjaan”.
- source_word: οὐκ ἔστιν κενὸς
  choice: tidak sia-sia
  rationale: Ini adalah padanan idiomatis bagi sesuatu yang tidak kosong, tanpa hasil, atau tanpa makna dalam konteks ini.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Ungkapan ini mempertahankan keluasan hubungan khas Paulus antara orang percaya, jerih payah mereka, dan Tuhan tanpa mempersempitnya menjadi satu tafsiran saja.
theological_decisions:
- issue: Cakupan gender ἀδελφοί
  choice: “saudara-saudaraku” dalam teks utama, dengan cakupan konteks dijelaskan dalam catatan kaki
  alternative: “saudara-saudaraku, laki-laki dan perempuan”
  rationale: Bentuk Yunani tersebut secara gramatikal maskulin jamak, tetapi dalam surat kepada jemaat dapat menyapa seluruh komunitas orang percaya. Bahasa Indonesia “saudara-saudara” juga dapat bersifat kolektif, sehingga bentuk sumber dan cakupan konteks sama-sama dapat dipertahankan.
- issue: Hubungan akhir ἐν κυρίῳ
  choice: 'Dihubungkan dengan “jerih payah kalian”: “jerih payah kalian di dalam Tuhan”'
  alternative: “jerih payah kalian tidak sia-sia karena Tuhan”
  rationale: Susunan ini paling dekat dengan teks Yunani dan mempertahankan keluasan makna teologis ungkapan Paulus tanpa menjadikannya semata-mata hubungan sebab-akibat.
- issue: Padanan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks kristologis surat ini, “Tuhan” adalah padanan Indonesia yang lazim dan tepat bagi κύριος.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai agar rujukan jamak dalam nasihat dan pernyataan penutup tetap jelas; “jerih payah” menjaga bobot usaha melelahkan yang dimaksud teks.
