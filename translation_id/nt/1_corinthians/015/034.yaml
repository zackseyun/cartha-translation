source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: id
  text: Sadarlah sebagaimana mestinya[a] dan jangan terus berbuat dosa[b], sebab beberapa orang tidak mengenal Allah. Aku mengatakan ini supaya kamu malu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata ini menggambarkan sadar kembali dari keadaan mabuk; di sini tampaknya dipakai sebagai kiasan untuk kembali berpikir jernih dan benar.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “jangan berbuat dosa” atau “berhentilah berbuat dosa”; bentuk perintah kini dapat menyiratkan tindakan yang sedang berlangsung atau menjadi kebiasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Sadarlah
  rationale: Imperatif aoris ini menyerukan perubahan tegas menuju pikiran yang jernih. Secara harfiah kata ini menggambarkan pulih dari keadaan mabuk, tetapi di sini dipakai secara metaforis; 'Sadarlah' alami dalam bahasa Indonesia dan tetap membawa daya seruannya.
- source_word: δικαίως
  choice: dengan benar
  rationale: Adverbia ini menerangkan perintah sebelumnya dan menyatakan cara yang benar atau semestinya, tanpa memberinya bobot teknis teologis yang tidak dituntut konteks.
- source_word: μὴ ἁμαρτάνετε
  choice: jangan terus berbuat dosa
  rationale: Imperatif kini dengan μή dapat menyiratkan tindakan yang berlangsung atau menjadi kebiasaan. Terjemahan ini mempertahankan nuansa aspektual tersebut tanpa menyatakan bahwa semua pembaca sedang melakukan satu dosa tertentu.
- source_word: ἀγνωσίαν ... θεοῦ
  choice: tidak mengenal Allah
  rationale: Ungkapan Yunani secara harfiah menyatakan 'memiliki ketidaktahuan akan Allah'. Bentuk verbal ini lebih alami dalam bahasa Indonesia dan mempertahankan gagasan kurangnya pengenalan atau pengetahuan mengenai Allah.
- source_word: τινες
  choice: beberapa orang
  rationale: Merujuk secara tak tentu kepada sebagian orang di tengah atau di sekitar jemaat.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: supaya kamu malu
  rationale: Ungkapan ini menyatakan arah atau hasil perkataan Paulus sehubungan dengan rasa malu para pembaca. Bentuk ini alami dan mempertahankan nada tegurannya.
- source_word: λαλῶ
  choice: Aku mengatakan ini
  rationale: Bentuk kini ini berfungsi menunjuk kepada teguran yang baru saja disampaikan; 'mengatakan ini' paling alami dalam konteks wacana Indonesia.
theological_decisions:
- issue: Daya moral δικαίως dalam seruan
  choice: dengan benar
  alternative: dengan semestinya; dengan hidup benar
  rationale: '''Dengan benar'' mempertahankan dimensi etis sekaligus fungsi adverbialnya tanpa menjadikannya istilah teknis tentang pembenaran atau kebenaran.'
- issue: Sifat ketidaktahuan akan Allah
  choice: tidak mengenal Allah
  alternative: tidak memiliki pengetahuan tentang Allah; tidak tahu tentang Allah
  rationale: Pilihan ini alami dan kuat, tetapi tidak menentukan apakah yang dimaksud hanya kekurangan informasi atau ketiadaan pengenalan relasional; ambiguitas konteks tetap terbuka.
- issue: Maksud πρὸς ἐντροπὴν ὑμῖν
  choice: supaya kamu malu
  alternative: ini kukatakan sebagai sesuatu yang memalukan bagimu
  rationale: Konstruksi πρὸς dengan nomina dapat menyatakan tujuan atau hasil. Terjemahan utama mempertahankan teguran langsung, sementara catatan mengakui kemungkinan nuansa hasil atau penilaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada tegas sesuai konteks teguran. 'Sadarlah' mempertahankan citra sumber secara wajar tanpa ungkapan yang kaku, sedangkan 'supaya kamu malu' menyampaikan daya retoris Paulus secara langsung.
