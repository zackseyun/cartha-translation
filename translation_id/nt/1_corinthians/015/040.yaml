  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: id
  text: Ada tubuh-tubuh surgawi dan tubuh-tubuh di bumi, tetapi kemuliaan tubuh-tubuh surgawi berbeda dengan kemuliaan tubuh-tubuh di bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ada benda-benda langit dan benda-benda di bumi”; istilah ini dapat menonjolkan kemungkinan gambaran astronomis, tetapi teks Yunani memakai kata umum untuk “tubuh.”
    reason: Alternatif leksikal; menyajikan kemungkinan nuansa selestial-terestrial secara paralel tanpa menjadikannya satu-satunya rujukan.
lexical_decisions:
- source_word: σώματα
  choice: tubuh-tubuh
  rationale: Kata ini secara langsung berarti 'tubuh-tubuh' dan mempertahankan luasnya rujukan dalam analogi Paulus tanpa mempersempitnya menjadi benda langit, makhluk, atau tubuh kebangkitan saja.
- source_word: ἐπουράνια
  choice: surgawi
  rationale: '''Surgawi'' merupakan padanan Indonesia yang alami untuk sesuatu yang berada di atau berkaitan dengan surga/langit, serta tidak membatasi maknanya hanya pada ranah astronomis.'
- source_word: ἐπίγεια
  choice: duniawi
  rationale: '''Duniawi'' membentuk pasangan yang wajar dengan ''surgawi'' dan menyatakan sesuatu yang berada di atau berkaitan dengan bumi; alternatif ''bumi'' dicatat untuk menampilkan nuansa lokatif dengan lebih langsung.'
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras sederhana antarklausa dengan bahasa Indonesia modern dan bermartabat.
- source_word: ἑτέρα ... ἑτέρα
  choice: berbeda dari
  rationale: Menyampaikan bahwa kemuliaan kedua kelompok itu berlainan tanpa menambahkan kategori tertentu yang tidak dinyatakan secara eksplisit oleh bahasa Yunani.
- source_word: δόξα
  choice: kemuliaan
  rationale: Mempertahankan kosakata teologis Paulus sekaligus tetap dapat mencakup pengertian semarak, keindahan, atau kecemerlangan dalam konteks ini.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: tubuh-tubuh surgawi ... tubuh-tubuh duniawi
  rationale: Nomina yang tersirat dalam bentuk genitif jamak dinyatakan kembali agar rujukannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan 'tubuh-tubuh surgawi' dan 'tubuh-tubuh duniawi'
  choice: Diterjemahkan secara umum sebagai 'tubuh-tubuh surgawi' dan 'tubuh-tubuh duniawi' tanpa mempersempit rujukannya.
  alternative: Benda-benda langit dan tubuh-tubuh di bumi; atau makhluk-makhluk surgawi dan makhluk-makhluk duniawi.
  rationale: Bahasa Yunani memakai σώματα ('tubuh-tubuh'). Terjemahan umum mempertahankan kemungkinan rujukan dalam analogi Paulus dan tidak memasukkan angelologi ataupun membatasinya pada objek astronomis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan 'tubuh-tubuh' dipertahankan demi kejelasan, sementara susunan kalimat dibuat alami. Penanda catatan kaki [a] ditempatkan pada klausa yang diterangkannya.
