id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: id
  text: 'Namun, ketika yang dapat binasa ini mengenakan ketidakbinasaan, dan yang dapat mati ini mengenakan ketidakmatian, maka perkataan yang tertulis itu akan menjadi kenyataan[a]: “Kematian telah ditelan dalam kemenangan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “maka genaplah perkataan yang tertulis itu.” Kata kerja Yunaninya secara lebih harfiah berarti “akan terjadi” atau “akan menjadi kenyataan.”
    reason: alternative_reading
  - marker: b
    text: Kutipan dari Yesaya 25:8, dengan susunan kata yang mencerminkan tradisi Yunani yang dikutip Paulus.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: yang dapat binasa
  rationale: Ungkapan substantival ini mempertahankan gagasan bahwa kondisi sekarang tunduk pada kebinasaan, tanpa menambahkan kata 'tubuh' yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ἐνδύσηται
  choice: mengenakan
  rationale: Mempertahankan metafora berpakaian dalam bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἀφθαρσίαν
  choice: ketidakbinasaan
  rationale: Menjaga pertentangan leksikal langsung dengan φθαρτόν dan menyatakan keadaan yang tidak tunduk pada kebinasaan.
- source_word: θνητὸν
  choice: yang dapat mati
  rationale: Terjemahan lugas bagi sesuatu yang tunduk pada kematian dan membentuk pasangan yang jelas dengan keadaan tidak dapat mati.
- source_word: ἀθανασίαν
  choice: keadaan tidak dapat mati
  rationale: Lebih mudah dipahami pembaca umum daripada 'imortalitas' dan tidak mencampurkannya dengan ketidakbinasaan pada klausa sebelumnya.
- source_word: γενήσεται
  choice: akan menjadi kenyataan
  rationale: Mengungkapkan arti 'akan terjadi/terwujud' secara alami dalam bahasa Indonesia ketika subjeknya adalah perkataan tertulis, tanpa memakai formula 'akan digenapi' dalam teks utama.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: perkataan yang tertulis itu
  rationale: λόγος di sini menunjuk kepada pernyataan tertulis yang segera dikutip; 'perkataan' lebih alami daripada 'firman' dalam konstruksi ini dan tidak mengubahnya menjadi istilah teknis.
- source_word: Κατεπόθη
  choice: telah ditelan
  rationale: Bentuk pasif mempertahankan gambaran kematian yang ditelan tanpa menyebut pelaku yang tidak dinyatakan, sedangkan bentuk perfektif cocok dengan pernyataan yang pada saat itu telah menjadi kenyataan.
- source_word: εἰς νῖκος
  choice: dalam kemenangan
  rationale: Mempertahankan gambaran kemenangan dalam tradisi Yunani yang dikutip Paulus serta kedekatan formal dengan preposisi εἰς.
theological_decisions:
- issue: Hubungan γενήσεται dengan kutipan Kitab Suci
  choice: perkataan yang tertulis itu akan menjadi kenyataan
  alternative: perkataan yang tertulis itu akan digenapi
  rationale: Pilihan utama menyampaikan bahwa perkataan itu sungguh terjadi tanpa memasukkan istilah penggenapan yang lebih kuat daripada verba γίνομαι.
- issue: Aspek Κατεπόθη dalam pernyataan eskatologis
  choice: Kematian telah ditelan dalam kemenangan
  alternative: Kematian ditelan dalam kemenangan
  rationale: Bentuk 'telah ditelan' menyajikan tindakan itu sebagai sudah terwujud pada saat mendatang yang sedang dibicarakan Paulus, sambil tetap mempertahankan bentuk pasif.
- issue: Subjek tersirat dalam φθαρτὸν dan θνητὸν
  choice: Tidak menambahkan kata 'tubuh' dalam teks utama
  alternative: tubuh yang dapat binasa ini ... tubuh yang dapat mati ini
  rationale: Konteks memang membicarakan tubuh, tetapi teks Yunani memakai adjektiva substantival. Terjemahan utama mempertahankan bentuk dan sedikit keterbukaan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'mengenakan' sengaja dipertahankan untuk menjaga metafora dan kesejajaran Paulus. Istilah teknis serapan seperti 'imortalitas' dihindari demi keterbacaan umum.
