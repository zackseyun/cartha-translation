reference: 1 Corinthians 15:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: id
  text: Jika, secara manusiawi, aku telah bertarung melawan binatang buas di Efesus[a], apa gunanya bagiku? Jika orang mati tidak dibangkitkan, “Marilah kita makan dan minum, sebab besok kita mati.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “secara manusiawi” dapat menerangkan cara Paulus berbicara atau sudut pandang manusiawi terhadap pengalamannya. “Bertarung melawan binatang buas” dapat dipahami secara harfiah atau sebagai kiasan untuk menghadapi perlawanan manusia yang ganas.
    reason: lexical_alternative
  - marker: b
    text: Kutipan atau acuan kepada Yesaya 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: menurut ukuran manusia
  rationale: Ungkapan idiomatis ini menyatakan sudut pandang atau pertimbangan yang semata-mata manusiawi, tanpa memastikan secara berlebihan apakah frasa tersebut terutama menerangkan cara Paulus berbicara atau dasar tindakannya.
- source_word: ἐθηριομάχησα
  choice: aku telah bertarung melawan binatang-binatang buas
  rationale: Mempertahankan gambaran leksikal Yunani yang hidup, tanpa memutuskan apakah yang dimaksud ialah pertarungan harfiah atau kiasan bagi perlawanan manusia yang ganas.
- source_word: ἐν Ἐφέσῳ
  choice: di Efesus
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: τί μοι τὸ ὄφελος
  choice: apa gunanya bagiku?
  rationale: Ungkapan Indonesia yang alami dan langsung untuk pertanyaan retoris mengenai manfaat bagi Paulus.
- source_word: νεκροὶ
  choice: orang mati
  rationale: Padanan substantival yang alami dalam bahasa Indonesia dan sesuai dengan konteks kebangkitan.
- source_word: ἐγείρονται
  choice: tidak dibangkitkan
  rationale: Mempertahankan bentuk pasif Yunani serta tidak mengaburkan gagasan bahwa kebangkitan terjadi oleh tindakan di luar diri orang mati.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: Marilah kita makan dan minum
  rationale: Menyampaikan daya ajakan dari bentuk subjungtif hortatoris Yunani.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: sebab besok kita mati
  rationale: Padanan masa depan yang alami dalam bahasa Indonesia dan tetap mencerminkan bunyi kutipan Yesaya 22:13.
theological_decisions:
- issue: Apakah ἐθηριομάχησα menunjuk pada binatang buas secara harfiah atau merupakan kiasan bagi lawan-lawan manusia yang ganas
  choice: Mempertahankan ungkapan leksikal “bertarung melawan binatang-binatang buas” dalam teks utama.
  alternative: Menerjemahkannya secara tafsiran sebagai pergumulan melawan manusia-manusia yang ganas di Efesus.
  rationale: Bahasa Yunani mempertahankan citra binatang buas, sedangkan argumen ayat tidak mengharuskan penerjemah menentukan apakah peristiwa itu harfiah atau kiasan.
- issue: Cakupan κατὰ ἄνθρωπον
  choice: “menurut ukuran manusia,” yang dapat menyatakan cara pandang atau pertimbangan manusiawi.
  alternative: “secara manusiawi aku bertarung,” seolah-olah frasa itu dengan pasti hanya menerangkan pertarungan.
  rationale: Susunan Yunani memiliki keluwesan; terjemahan dan catatan mempertahankan kemungkinan bahwa frasa itu menerangkan cara Paulus berbicara atau sudut pandang manusiawi terhadap tindakannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Apa gunanya bagiku?” dipilih daripada padanan yang lebih harfiah tetapi kaku. Citra binatang buas dan bentuk pasif “dibangkitkan” dipertahankan untuk menjaga ambiguitas historis dan ketegangan teologis teks.
