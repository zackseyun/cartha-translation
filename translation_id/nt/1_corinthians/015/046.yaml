  verdict: approve
  source_fidelity: 'Teks Indonesia dengan tepat mempertahankan pola korektif ἀλλ’ οὐ ... ἀλλὰ: yang rohani tidak lebih dahulu, melainkan yang alamiah; kemudian yang rohani. Kata “sesudah itu” menyampaikan ἔπειτα dengan setia. Terjemahan tidak menambahkan “tubuh” ke dalam teks utama, sehingga fungsi substantival kedua adjektiva netral dan keluasan rujukan dalam konteks tetap terjaga.'
  naturalness: “Namun, yang rohani bukanlah yang lebih dahulu, melainkan yang alamiah; sesudah itu barulah yang rohani” adalah bahasa Indonesia baku modern, jelas, dan cukup bernada formal untuk surat Paulus. Pengulangan “yang rohani” secara tepat mencerminkan pengulangan πνευματικόν.
  terminology: “Yang rohani” merupakan padanan yang wajar bagi πνευματικόν. “Yang alamiah” cocok untuk ψυχικόν dalam kontras Paulus dan menghindari penyempitan makna yang dapat timbul dari “jasmani” atau nuansa moral yang tidak diperlukan pada “tidak rohani.” Catatan kaki menjelaskan cakupan leksikal tanpa memaksakan penafsiran tertentu.
