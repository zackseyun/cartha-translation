id: 1CO.15.46
reference: 1 Corinthians 15:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: id
  text: Namun, yang rohani bukanlah yang lebih dahulu[a], melainkan yang alamiah[b]; sesudah itu barulah yang rohani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tubuh rohani bukanlah yang lebih dahulu ... tubuh alamiahlah yang lebih dahulu.” Paulus tidak menyebut kata “tubuh” dalam ayat ini, meskipun kata itu dinyatakan secara eksplisit dalam konteks sekitarnya.
    reason: alternative_reading
  - marker: b
    text: “Alamiah” menerjemahkan kata Yunani psychikon, yaitu yang termasuk dalam kehidupan makhluk bernyawa biasa; secara lebih harfiah dapat diterjemahkan “yang berjiwa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: yang lebih dahulu
  rationale: Dipakai secara adverbial untuk menunjukkan urutan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras temporal dengan ἔπειτα.
- source_word: πνευματικόν
  choice: yang rohani
  rationale: Adjektiva netral tunggal berartikel ini berfungsi substantival. Terjemahan ini mempertahankan keringkasan Yunani dan tidak menyisipkan kata 'tubuh', meskipun konteks sekitarnya membicarakan tubuh.
- source_word: ψυχικόν
  choice: yang alamiah
  rationale: Dalam konteks Paulus, istilah ini menunjuk pada apa yang termasuk dalam kehidupan makhluk bernyawa biasa, berlawanan dengan kehidupan yang ditandai oleh Roh. 'Yang alamiah' lebih tepat daripada 'yang jasmani', yang dapat mempersempit maknanya menjadi materi atau tubuh saja.
- source_word: ἔπειτα
  choice: sesudah itu barulah
  rationale: Menandai tahap berikut dalam urutan. Partikel 'barulah' membuat perkembangan temporal dan kontrasnya jelas secara wajar dalam bahasa Indonesia.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Namun ... bukanlah ... melainkan
  rationale: Pola ini menyampaikan koreksi dan pertentangan secara langsung serta idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kontras antara ψυχικόν dan πνευματικόν
  choice: Kontras urutan antara keberadaan alamiah dan keberadaan rohani dalam argumen Paulus tentang kebangkitan.
  alternative: Kontras yang secara khusus berbunyi 'tubuh alamiah' dan 'tubuh rohani', atau kontras antara orang yang tidak rohani dan orang yang rohani.
  rationale: Ayat 44 secara eksplisit menyebut 'tubuh', tetapi ayat 46 hanya memakai adjektiva substantival. Karena itu, terjemahan utama tidak menambahkan 'tubuh', sehingga keluasan dan ketegangan ungkapan Yunani tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kontras Yunani dipertahankan, sedangkan 'barulah' dipakai untuk menghasilkan urutan yang alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
