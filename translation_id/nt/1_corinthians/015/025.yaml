base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: id
  text: Sebab Ia harus memerintah sampai Ia meletakkan semua musuh-Nya di bawah kaki-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai Ia telah meletakkan semua musuh-Nya di bawah kaki-Nya.” Bentuk Yunani tidak dengan sendirinya mengharuskan pembedaan aspek ini dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Gambaran musuh berada “di bawah kaki-Nya” menyatakan penaklukan sepenuhnya; bandingkan Mazmur 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan atau keniscayaan ilahi dengan ringkas dan kuat.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: αὐτὸν
  choice: Dia
  rationale: 'Walaupun bentuk Yunaninya akusatif sebagai subjek infinitif, konstruksi Indonesia yang alami memakai klausa berverba finit: ''Dia harus''.'
- source_word: βασιλεύειν
  choice: memerintah sebagai Raja
  rationale: Mempertahankan nuansa pemerintahan kerajaan yang terkandung dalam verba Yunani, sekaligus jelas bagi pembaca Indonesia modern.
- source_word: ἄχρι οὗ
  choice: sampai
  rationale: Menandai batas waktu yang sedang dibicarakan, tanpa dengan sendirinya menyatakan bahwa pemerintahan itu berhenti sesudahnya.
- source_word: θῇ
  choice: menempatkan
  rationale: Menerjemahkan τίθημι secara langsung dalam gambaran menempatkan musuh di bawah kaki; bentuk Yunani tidak mengharuskan pembedaan aspek yang lebih terperinci dalam bahasa Indonesia.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: semua musuh-Nya
  rationale: Menyampaikan cakupan menyeluruh serta hubungan musuh-musuh itu dengan Kristus secara alami.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: di bawah kaki-Nya
  rationale: Mempertahankan secara langsung kiasan alkitabiah tentang penaklukan sepenuhnya.
theological_decisions:
- issue: Daya temporal ἄχρι οὗ ('sampai')
  choice: Memakai 'sampai' tanpa menyiratkan bahwa pemerintahan Kristus berakhir setelah semua musuh ditaklukkan.
  alternative: Terjemahan yang menyiratkan bahwa pemerintahan-Nya berhenti ketika semua musuh sudah ditaklukkan.
  rationale: Ungkapan Yunani menyoroti batas waktu hingga tercapainya penaklukan, tetapi klausa ini sendiri tidak menegaskan apa yang terjadi dengan pemerintahan itu sesudahnya.
- issue: Identitas subjek θῇ
  choice: Mempertahankan 'Dia' sebagai subjek yang menempatkan semua musuh di bawah kaki-Nya.
  alternative: Mengungkapkan Allah sebagai pelaku yang menempatkan musuh-musuh di bawah kaki Kristus.
  rationale: Bentuk θῇ dapat secara gramatikal merujuk kepada subjek terdekat, yaitu Kristus, sementara konteks yang lebih luas juga berbicara tentang tindakan Allah. Terjemahan utama mengikuti kesinambungan subjek tanpa memperluas klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Frasa 'memerintah sebagai Raja' dipilih agar nuansa βασιλεύειν tetap jelas bagi pembaca umum.
