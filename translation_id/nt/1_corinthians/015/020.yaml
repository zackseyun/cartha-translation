  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: id
  text: Namun sekarang, Mesias[a] telah dibangkitkan dari antara orang mati, buah sulung[b] dari mereka yang telah tertidur.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” “Mesias” dan “Kristus” sama-sama berarti “Yang Diurapi.”
    reason: alternative_reading
  - marker: b
    text: “Buah sulung” adalah bagian pertama dari hasil panen yang dipersembahkan kepada Allah; ungkapan ini menggambarkan bagian awal dan mengisyaratkan panen yang akan menyusul.
    reason: cultural_note
  - marker: c
    text: “Telah tertidur” adalah kiasan untuk orang-orang yang telah meninggal, khususnya dalam konteks kebangkitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Namun sekarang
  rationale: Menandai peralihan tegas dari pengandaian sebelumnya kepada kenyataan yang kini ditegaskan.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Yunani yang berarti Yang Diurapi; alternatif tradisional “Kristus” dicatat agar pembaca mengenali istilah yang lazim.
- source_word: ἐγήγερται
  choice: telah dibangkitkan
  rationale: Bentuk perfektum pasif menyatakan tindakan yang telah terjadi dengan hasil yang tetap berlaku, tanpa menyebutkan pelakunya secara eksplisit.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mengungkapkan bentuk jamak Yunani dan gagasan bahwa Mesias dibangkitkan dari tengah orang-orang yang mati.
- source_word: ἀπαρχὴ
  choice: buah sulung
  rationale: Mempertahankan gambaran bagian pertama dari panen yang mendahului dan mewakili panen selanjutnya.
- source_word: τῶν κεκοιμημένων
  choice: dari antara mereka yang telah tertidur
  rationale: Mempertahankan metafora kematian dalam konteks kebangkitan serta nuansa tindakan yang telah terjadi.
theological_decisions:
- issue: Bentuk dan pelaku kebangkitan
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: Bentuk pasif Yunani dipertahankan sehingga tindakan ilahi tetap tersirat tanpa pelakunya ditambahkan ke dalam teks.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pernyataan teologis ini, Χριστός dipahami sebagai gelar dan diterjemahkan menurut maknanya, sedangkan bentuk tradisional dicantumkan dalam catatan.
- issue: Metafora kematian sebagai tidur
  choice: telah tertidur
  alternative: telah meninggal
  rationale: Metafora sumber dipertahankan karena berperan penting dalam konteks pengharapan akan kebangkitan, tanpa menyamakan kematian dan tidur secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisi dipertahankan untuk mengikuti kepadatan argumen Yunani, sementara catatan kaki menjelaskan gelar Mesias, gambaran buah sulung, dan metafora tidur.
