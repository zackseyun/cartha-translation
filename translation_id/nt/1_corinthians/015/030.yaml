  text: Why are we also in danger every hour?[a]
translation:
  language: id
  text: Mengapa kami juga menghadapi bahaya setiap saat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, τί dapat diterjemahkan “apa.” Dalam pertanyaan retoris ini, maksudnya ialah “Mengapa kami juga menghadapi bahaya setiap saat?”
    reason: Alternatif leksikal dan bentuk pertanyaan Yunani.
lexical_decisions:
- source_word: τί
  choice: Mengapa
  rationale: Dalam pertanyaan retoris ini, τί menanyakan alasan atau tujuan tindakan. 'Mengapa' menyampaikan daya argumentatif Paulus secara alami dalam konteks kebangkitan.
- source_word: καὶ
  choice: juga
  rationale: καὶ menambahkan Paulus dan rekan-rekannya kepada contoh-contoh sebelumnya dalam rangkaian argumen.
- source_word: ἡμεῖς
  choice: kami
  rationale: Kata ganti eksplisit ini merujuk kepada Paulus beserta rekan-rekannya, bukan mencakup para pembaca; karena itu dipakai bentuk eksklusif 'kami'.
- source_word: κινδυνεύομεν
  choice: menghadapi bahaya
  rationale: κινδυνεύω berarti berada dalam bahaya atau menghadapi risiko. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi khusus mempertaruhkan nyawa.
- source_word: πᾶσαν ὥραν
  choice: setiap saat
  rationale: Ungkapan akusatif ini menyatakan keterpaparan yang terus-menerus. 'Setiap saat' lebih alami dalam bahasa Indonesia modern daripada 'setiap jam' tanpa mengubah maksud idiomatisnya.
theological_decisions:
- issue: Daya retoris dalam argumen Paulus mengenai kebangkitan
  choice: Ayat diterjemahkan sebagai pertanyaan retoris yang menyoroti tidak masuk akalnya bahaya yang dihadapi para rasul jika orang mati tidak dibangkitkan.
  alternative: Menerjemahkan τί secara lebih harfiah sebagai 'apa' dan membiarkan hubungan alasannya tersirat.
  rationale: Sintaksis Yunani dan konteks langsung 1 Korintus 15 mendukung pertanyaan tentang alasan, bukan permintaan informasi biasa. Terjemahan ini mempertahankan ketegangan argumen tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. 'Kami' menjaga pembedaan inklusif-eksklusif yang tersedia dalam bahasa Indonesia; 'menghadapi bahaya' bernada lugas dan bermartabat.
