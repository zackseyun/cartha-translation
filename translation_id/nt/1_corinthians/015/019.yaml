id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: id
  text: Jika hanya dalam kehidupan ini kita telah menaruh harapan di dalam Mesias[a], kita lebih patut dikasihani daripada semua orang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός adalah gelar yang dapat diterjemahkan “Mesias” atau “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “kitalah yang paling patut dikasihani di antara semua orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: jika
  rationale: Memperkenalkan syarat yang menjadi dasar argumen Paulus.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: dalam kehidupan ini
  rationale: Menerjemahkan frasa preposisional secara langsung sebagai kehidupan sekarang, tanpa menambahkan uraian tentang kehidupan sesudahnya.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Mempertahankan preposisi ἐν yang penting dalam ungkapan khas Paulus dan menerjemahkan Χριστός sebagai gelar, yaitu Mesias.
- source_word: ἠλπικότες ἐσμὲν
  choice: kita telah menaruh harapan
  rationale: Bentuk perfektum perifrastis menyatakan harapan yang telah diletakkan dan tetap berlaku sampai sekarang; ungkapan ini alami dalam bahasa Indonesia.
- source_word: μόνον
  choice: hanya
  rationale: Ditempatkan bersama frasa 'dalam kehidupan ini' agar batas harapan pada kehidupan sekarang tersampaikan dengan jelas.
- source_word: ἐλεεινότεροι
  choice: lebih patut dikasihani
  rationale: Mempertahankan bentuk komparatif Yunani dan makna bahwa seseorang layak menerima belas kasihan, bukan sekadar merasa sengsara.
- source_word: πάντων ἀνθρώπων
  choice: daripada semua orang
  rationale: ἄνθρωποι menunjuk manusia secara umum, bukan hanya laki-laki, dan genitifnya melengkapi perbandingan.
theological_decisions:
- issue: Terjemahan Χριστῷ dalam rumusan Paulus ἐν Χριστῷ
  choice: di dalam Mesias
  alternative: di dalam Kristus
  rationale: Χριστός berfungsi sebagai gelar, sehingga 'Mesias' menyampaikan maknanya; alternatif tradisional 'Kristus' dicatat tanpa mengubah rumusan utama.
- issue: Cakupan μόνον dalam pernyataan tentang pengharapan
  choice: hanya dalam kehidupan ini
  alternative: dalam kehidupan ini kita hanya berharap di dalam Mesias
  rationale: Konteks pembahasan kebangkitan mendukung pembatasan pengharapan pada kehidupan sekarang. Susunan utama menyatakan hal itu secara jelas, sedangkan susunan alternatif dapat menyiratkan bahwa berharap adalah satu-satunya tindakan yang dilakukan.
- issue: Kekuatan bentuk komparatif ἐλεεινότεροι
  choice: lebih patut dikasihani daripada semua orang
  alternative: yang paling patut dikasihani di antara semua orang
  rationale: Teks utama mempertahankan bentuk komparatif Yunani; alternatif menyampaikan daya superlatif idiomatis yang mungkin dipahami dari perbandingan dengan semua orang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ungkapan 'di dalam Mesias' sengaja mempertahankan rumusan khas Paulus, sedangkan 'menaruh harapan' menghindari kekakuan 'telah berharap'. Bentuk komparatif sumber dipertahankan meskipun bentuk superlatif lebih idiomatis dan karena itu dicatat dalam catatan kaki.
