id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: id
  text: Sebab sama seperti dalam Adam semua orang mati, demikian juga dalam Mesias semua orang akan dihidupkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau diserap sebagai “Kristus”; di sini diterjemahkan menurut maknanya.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab, sama seperti
  rationale: Mempertahankan fungsi γάρ yang menghubungkan ayat ini dengan alasan sebelumnya serta daya perbandingan ὥσπερ dalam bahasa Indonesia yang wajar.
- source_word: ἐν τῷ Ἀδὰμ
  choice: dalam Adam
  rationale: Terjemahan ringkas dan dekat dengan bentuk Yunani yang mempertahankan bahasa representatif atau korporat Paulus tanpa mempersempit ἐν menjadi hubungan alat atau menjelaskannya secara berlebihan.
- source_word: πάντες
  choice: semua orang
  rationale: Menyatakan cakupan luas πάντες secara alami dalam bahasa Indonesia dan mempertahankan bentuk yang sama pada kedua bagian kalimat.
- source_word: ἀποθνῄσκουσιν
  choice: mati
  rationale: Bentuk kini Yunani menyatakan kenyataan umum; bentuk sederhana 'mati' paling alami untuk fungsi gnomic ini.
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Mempertahankan hubungan korelatif dengan ὥσπερ dan unsur tambahan καί secara idiomatis.
- source_word: ἐν τῷ Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar dan sejajar dengan 'dalam Adam'; 'Mesias' menerjemahkan makna gelar tersebut, sedangkan 'Kristus' merupakan bentuk serapan tradisional.
- source_word: ζῳοποιηθήσονται
  choice: akan dihidupkan
  rationale: Mempertahankan orientasi masa depan dan bentuk pasif verba Yunani tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
theological_decisions:
- issue: Cakupan 'semua orang' dalam kedua klausa
  choice: Mempertahankan 'semua orang' tanpa pembatas pada kedua bagian ayat.
  alternative: Menafsirkan 'semua orang' yang kedua hanya sebagai semua orang percaya, atau menetapkan bahwa kedua pemakaiannya pasti mencakup seluruh umat manusia dalam arti yang persis sama.
  rationale: Teks Yunani sengaja membentuk kesejajaran πάντες ... πάντες, tetapi ayat ini sendiri tidak menjelaskan lebih lanjut mekanisme atau batas cakupannya. Terjemahan karena itu mempertahankan ketegangan teologis tersebut.
- issue: Makna hubungan ἐν pada 'dalam Adam' dan 'dalam Mesias'
  choice: Mempertahankan ungkapan 'dalam' pada kedua klausa.
  alternative: Menjelaskannya sebagai 'melalui', 'karena', atau 'dalam persatuan dengan'.
  rationale: Ungkapan Yunani bersifat padat dan dapat membawa nuansa korporat atau representatif. Mempertahankan kesejajaran formal menghindari penetapan satu penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'sama seperti ... demikian juga ...' menjaga kesejajaran retoris ayat. Penanda catatan kaki ditempatkan setelah seluruh pernyataan karena catatan menerangkan pilihan gelar 'Mesias' dalam klausa kedua.
