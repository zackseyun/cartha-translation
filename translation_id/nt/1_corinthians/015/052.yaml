source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: id
  text: dalam sesaat[a], dalam sekejap mata, pada sangkakala terakhir. Sebab sangkakala akan berbunyi, dan orang-orang mati akan dibangkitkan dalam keadaan tidak dapat binasa, dan kita akan diubah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam sesuatu yang tidak terbagi,” yaitu dalam selang waktu yang amat singkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: dalam sesaat
  rationale: ἄτομος secara harfiah menunjuk pada sesuatu yang tidak terbagi; dalam ungkapan waktu ini maksudnya ialah selang waktu yang amat singkat. “Dalam sesaat” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: dalam sekejap mata
  rationale: Ungkapan ini menggambarkan gerakan mata yang sangat cepat dan berfungsi sebagai idiom untuk kesegeraan. “Dalam sekejap mata” merupakan padanan Indonesia yang alami dan jelas.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: saat sangkakala terakhir berbunyi
  rationale: ἐν dengan bentuk datif di sini menyatakan waktu kejadian. Rumusan ini mempertahankan “sangkakala terakhir” tanpa memasukkan skema eskatologis tertentu.
- source_word: σαλπίσει
  choice: sangkakala akan berbunyi
  rationale: Kata kerja ini berarti membunyikan sangkakala atau menghasilkan bunyi sangkakala. Bahasa Indonesia secara alami mengungkapkannya dengan “sangkakala akan berbunyi”, dengan subjek yang dipahami dari frasa sebelumnya.
- source_word: οἱ νεκροὶ
  choice: orang-orang mati
  rationale: Bentuk adjektiva substantival ini merujuk secara kolektif kepada manusia yang telah mati. “Orang-orang mati” jelas dan alami dalam bahasa Indonesia.
- source_word: ἐγερθήσονται
  choice: akan dibangkitkan
  rationale: Bentuk pasif mendatang dari ἐγείρω dalam konteks kebangkitan paling tepat diterjemahkan “akan dibangkitkan”, sehingga bentuk pasif dan makna kebangkitannya tetap terpelihara.
- source_word: ἄφθαρτοι
  choice: dalam keadaan tidak dapat binasa
  rationale: ἄφθαρτος menyatakan keadaan yang bebas dari kebinasaan, kerusakan, atau pelapukan. Frasa ini mempertahankan fungsi predikatifnya sesudah “dibangkitkan” dan mudah dipahami pembaca modern.
- source_word: ἡμεῖς
  choice: kita
  rationale: Pronomina ini dinyatakan secara eksplisit dalam bahasa Yunani dan dipertahankan untuk menandai penekanan serta kontras dengan orang-orang mati.
- source_word: ἀλλαγησόμεθα
  choice: akan diubah
  rationale: Bentuk pasif mendatang dari ἀλλάσσω secara langsung berarti “akan diubah”. Pilihan ini mempertahankan bentuk pasif dan tidak menentukan lebih jauh sifat perubahan itu daripada yang dinyatakan teks.
theological_decisions:
- issue: Ungkapan sangkakala terakhir dan hubungannya dengan skema akhir zaman
  choice: saat sangkakala terakhir berbunyi
  alternative: pada sangkakala terakhir
  rationale: Teks dengan jelas menyebut sangkakala terakhir, tetapi tidak merinci suatu urutan akhir zaman. Terjemahan ini mempertahankan citra dan penanda waktunya tanpa menambahkan sistem penafsiran tertentu.
- issue: Cakupan kata ganti “kita” dalam hubungan dengan kebangkitan dan perubahan
  choice: kita akan diubah
  alternative: kita yang masih hidup akan diubah
  rationale: Kata ganti orang pertama jamak dalam teks dipertahankan tanpa penjelasan tambahan. Konteks membedakannya dari orang-orang mati, tetapi ayat ini sendiri tidak perlu diperluas menjadi parafrasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang lugas dan khidmat. Pengulangan “sangkakala ... berbunyi” dipertahankan karena mencerminkan pengulangan dalam teks Yunani dan menghubungkan penanda waktu dengan alasan yang menyusul.
