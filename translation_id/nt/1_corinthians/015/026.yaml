  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: id
  text: Musuh terakhir yang ditiadakan adalah kematian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Musuh terakhir yang dibinasakan adalah kematian.”
    reason: Alternatif leksikal untuk καταργεῖται.
lexical_decisions:
- source_word: ἔσχατος
  choice: terakhir
  rationale: Kata ini menunjukkan yang paling akhir dalam suatu urutan dan mempertahankan urutan eskatologis dalam argumen Paulus.
- source_word: ἐχθρὸς
  choice: musuh
  rationale: Kata ini menunjuk pada lawan atau kuasa yang bermusuhan; “musuh” jelas dan sesuai dengan personifikasi kematian.
- source_word: καταργεῖται
  choice: ditiadakan
  rationale: Bentuk kini pasif ini menyatakan bahwa kematian dibuat tidak berlaku atau diakhiri kuasanya. “Ditiadakan” mempertahankan cakupan makna καταργέω tanpa secara tegas menyatakan pemusnahan ontologis.
- source_word: ὁ θάνατος
  choice: kematian
  rationale: Nomina ini definit dan dipersonifikasikan sebagai musuh terakhir; dalam bahasa Indonesia, “kematian” secara alami menyampaikan konsep sekaligus kuasa yang bermusuhan itu.
theological_decisions:
- issue: Makna καταργεῖται sehubungan dengan kekalahan kematian
  choice: ditiadakan
  alternative: dibinasakan
  rationale: “Ditiadakan” menyampaikan berakhirnya daya berlaku atau kuasa kematian tanpa mempersempit makna verba Yunani menjadi klaim metafisik tertentu. “Dibinasakan” tetap merupakan kemungkinan yang sah dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, wajar, dan bermartabat. Susunan predikatif Yunani dipertahankan secara alami, sementara personifikasi kematian sebagai musuh tetap jelas.
