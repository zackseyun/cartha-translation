base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: id
  text: Melalui Injil itu kamu juga sedang diselamatkan[a], jika kamu berpegang teguh pada pesan[b] yang telah kuberitakan kepadamu sebagai kabar baik—kecuali jika kamu telah percaya dengan sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu juga diselamatkan.” Bentuk kini dalam bahasa Yunani dapat dipahami sebagai tindakan yang sedang berlangsung atau sebagai pernyataan umum.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “jika kamu berpegang teguh—dalam/dengan pesan apa yang telah kuberitakan kepadamu sebagai kabar baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Melalui Injil itu
  rationale: διά dengan bentuk genitif menyatakan sarana. Rujukannya adalah Injil pada ayat sebelumnya; penyebutan eksplisit menghasilkan bahasa Indonesia yang alami.
- source_word: σῴζεσθε
  choice: kamu juga sedang diselamatkan
  rationale: Bentuk kini pasif dapat menunjukkan proses yang berlangsung. 'Sedang diselamatkan' mempertahankan nuansa aspek ini tanpa memasukkan suatu sistem doktrin tertentu.
- source_word: τίνι λόγῳ
  choice: pada pesan
  rationale: λόγος di sini menunjuk pada isi atau bentuk pemberitaan Injil. Dalam kaitannya dengan κατέχετε, 'berpegang teguh pada pesan' alami dalam bahasa Indonesia; catatan kaki mempertahankan bentuk yang lebih harfiah dan kemungkinan konstruksinya.
- source_word: εὐηγγελισάμην
  choice: telah kuberitakan ... sebagai kabar baik
  rationale: Kata kerja ini berarti menyampaikan kabar baik. Pilihan ini mempertahankan unsur 'kabar baik' secara transparan dan tetap wajar.
- source_word: κατέχετε
  choice: berpegang teguh pada
  rationale: Kata ini menyatakan tindakan terus memegang, mempertahankan, atau berpegang pada sesuatu.
- source_word: ἐκτὸς εἰ μὴ
  choice: kecuali jika
  rationale: Ungkapan ini memperkenalkan pengecualian; 'kecuali jika' mempertahankan bentuknya dengan jelas.
- source_word: εἰκῇ
  choice: dengan sia-sia
  rationale: Dalam konteks ini kata tersebut menyatakan sesuatu yang kosong, tanpa hasil, atau tanpa tujuan.
- source_word: ἐπιστεύσατε
  choice: kamu telah percaya
  rationale: Bentuk aoris menunjuk pada tindakan percaya mereka ketika menerima Injil; bentuk perfektif bahasa Indonesia ini menyampaikannya secara alami.
theological_decisions:
- issue: Aspek keselamatan dalam σῴζεσθε
  choice: sedang diselamatkan
  alternative: diselamatkan
  rationale: Pilihan progresif mewakili kemungkinan kuat dari bentuk kini Yunani dan mempertahankan ketegangan antara dimensi keselamatan yang telah terlaksana dan yang sedang berlangsung tanpa menyelesaikan perdebatan teologis.
- issue: Syarat εἰ κατέχετε
  choice: jika kamu berpegang teguh
  alternative: bila kamu tetap berpegang teguh
  rationale: Bentuk bersyarat dipertahankan apa adanya, tanpa menafsirkannya sebagai sekadar bukti iman sejati ataupun menganggap syarat itu pasti terpenuhi.
- issue: Peringatan ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε
  choice: kecuali jika kamu telah percaya dengan sia-sia
  alternative: kecuali kalau kepercayaanmu sia-sia
  rationale: Terjemahan mempertahankan peringatan Paulus dan ambiguitas mengenai tepatnya bagaimana tindakan percaya itu dapat disebut sia-sia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kamu', sesuai konteks jemaat. Susunan kalimat dibuat mengalir namun tetap mempertahankan hubungan sarana, syarat, dan pengecualian dalam teks Yunani. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
