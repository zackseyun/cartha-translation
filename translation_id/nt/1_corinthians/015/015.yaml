language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: id
  text: Selain itu, kami juga didapati sebagai saksi-saksi palsu terhadap Allah[a], karena kami telah bersaksi melawan Allah bahwa Ia telah membangkitkan Sang Mesias[b], yang tidak dibangkitkan-Nya jika memang orang-orang mati tidak dibangkitkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saksi-saksi palsu Allah.” Genitif Yunani ini dapat dipahami sebagai “tentang Allah”; dalam konteksnya, “terhadap Allah” menyatakan bahwa kesaksian palsu itu berlawanan dengan Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus”; istilah ini berarti “Yang Diurapi” dan di sini digunakan sebagai gelar, yaitu “Mesias.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: kami ternyata menjadi
  rationale: Mengungkapkan keadaan yang terbukti atau tersingkap sebagai hasil kesimpulan Paulus, dengan bahasa Indonesia yang lebih alami daripada terjemahan harfiah ‘kami didapati’.
- source_word: δὲ καὶ
  choice: Bahkan
  rationale: Menyampaikan kelanjutan logis sekaligus penekanan tambahan dalam argumen Paulus.
- source_word: ψευδομάρτυρες
  choice: saksi-saksi palsu
  rationale: Padanan baku yang mempertahankan nuansa kesaksian, termasuk daya asosiasi forensiknya.
- source_word: τοῦ θεοῦ
  choice: tentang Allah
  rationale: 'Genitif ini paling wajar dipahami secara objektif atau sebagai acuan: kesaksian palsu yang menyangkut Allah. Catatan kaki mempertahankan kemungkinan nuansa yang lebih kuat.'
- source_word: ἐμαρτυρήσαμεν
  choice: kami telah bersaksi
  rationale: Menunjuk pada kesaksian yang sudah diberikan para rasul dan mempertahankan kosakata kesaksian.
- source_word: κατὰ τοῦ θεοῦ
  choice: melawan Allah
  rationale: κατά dengan genitif secara lazim dapat berarti ‘melawan’. Pilihan ini mempertahankan ketegangan bahwa, jika kesaksian kebangkitan itu tidak benar, para rasul bukan sekadar keliru tentang Allah, melainkan memberi kesaksian yang bertentangan dengan-Nya.
- source_word: ἤγειρεν
  choice: telah membangkitkan
  rationale: Menyatakan tindakan Allah pada masa lampau dengan akibat yang relevan bagi argumen saat ini.
- source_word: τὸν Χριστόν
  choice: Sang Mesias
  rationale: Χριστός dengan artikel berfungsi sebagai gelar dalam argumen ini; ‘Sang Mesias’ menerjemahkan gelarnya dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ὃν οὐκ ἤγειρεν
  choice: yang sebenarnya tidak dibangkitkan-Nya
  rationale: Mempertahankan klausa relatif dan pengulangan verba untuk daya retoris; ‘sebenarnya’ menghubungkannya dengan syarat argumentatif berikutnya tanpa menjadikannya pernyataan mandiri Paulus.
- source_word: εἴπερ ἄρα
  choice: jika memang
  rationale: Menyampaikan syarat yang diajukan demi argumen, dengan penegasan bahwa premis itu sedang diuji.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: orang mati tidak dibangkitkan
  rationale: Menyatakan dalil umum yang sedang diperdebatkan dan mempertahankan bentuk pasif, yakni kebangkitan sebagai tindakan yang dilakukan terhadap orang mati.
theological_decisions:
- issue: Makna κατὰ τοῦ θεοῦ
  choice: melawan Allah
  alternative: tentang Allah
  rationale: 'Arti adversatif merupakan nilai lazim κατά dengan genitif dan mempertahankan kerasnya kesimpulan Paulus: mengatribusikan kepada Allah tindakan yang tidak dilakukan-Nya berarti memberi kesaksian yang bertentangan dengan Allah. Kemungkinan makna ‘tentang Allah’ tetap diakui dalam catatan kaki.'
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini istilah tersebut berfungsi jelas sebagai gelar, sehingga diterjemahkan sebagai ‘Mesias’ dan bukan semata-mata ditransliterasikan.
- issue: Sifat kondisional dari ὃν οὐκ ἤγειρεν
  choice: yang sebenarnya tidak dibangkitkan-Nya, jika memang orang mati tidak dibangkitkan
  alternative: yang tidak dibangkitkan-Nya, sekiranya benar bahwa orang mati tidak dibangkitkan
  rationale: Susunan ini menjaga klaim negatif itu tetap berada di bawah syarat argumentatif, bukan menjadi penyangkalan langsung terhadap kebangkitan Mesias.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Ternyata menjadi’ dipilih untuk kealamian, sementara kosakata ‘saksi’, ‘bersaksi’, dan bentuk pasif ‘dibangkitkan’ mempertahankan pola serta tekanan argumentatif teks Yunani. Huruf kapital pada ‘Ia’ dan enklitik ‘-Nya’ mengikuti kebiasaan ejaan religius Indonesia tanpa menambahkan penafsiran denominasi.
