id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: id
  text: Demikian juga ada tertulis, “Manusia pertama, Adam, menjadi makhluk yang hidup”[a]; Adam yang terakhir menjadi roh yang memberi hidup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwa yang hidup,” sesuai dengan terjemahan tradisional Kejadian 2:7.
    reason: lexical_alternative
  - marker: b
    text: Atau “roh pemberi hidup.” Ungkapan ini menggambarkan Adam yang terakhir sebagai kontras dengan Adam pertama; bentuk Yunaninya bersifat kualitatif dan tidak harus berarti bahwa Kristus secara eksplisit disamakan dengan Roh Kudus sebagai pribadi yang berbeda.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Demikian juga ada tertulis
  rationale: Ungkapan ini menghubungkan kutipan Kitab Suci dengan argumen sebelumnya. Bentuk “ada tertulis” merupakan rumusan kutipan Kitab Suci yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: Ἐγένετο
  choice: menjadi
  rationale: Kata ini menyatakan keadaan yang terwujud dalam kutipan atau alusi kepada Kejadian 2:7; “menjadi” alami dan tepat dalam bahasa Indonesia.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: Manusia pertama
  rationale: ἄνθρωπος di sini menunjuk kepada Adam sebagai manusia pertama dan wakil umat manusia. “Manusia” mempertahankan makna insani tanpa mengaburkan bahwa Adam disebut secara khusus.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Nama pribadi ditulis menurut bentuk baku bahasa Indonesia.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: menjadi makhluk yang hidup
  rationale: Dalam gema Kejadian 2:7, ψυχή menunjuk kepada pribadi atau makhluk yang hidup, bukan secara khusus kepada unsur tak berwujud yang terpisah. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan antropologi tertentu.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: Adam yang terakhir
  rationale: Pilihan ini mempertahankan kontras tipologis dan bernuansa eskatologis antara Adam pertama dan Kristus.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: menjadi roh yang memberi hidup
  rationale: πνεῦμα tidak memakai artikel dan berfungsi secara kualitatif, sedangkan ζῳοποιοῦν berarti memberi hidup atau menghidupkan. Susunan ini jelas dan tidak secara eksplisit menyamakan Kristus dengan Roh Kudus sebagai pribadi yang berbeda.
theological_decisions:
- issue: Makna antropologis ψυχή dalam kutipan Kejadian
  choice: makhluk yang hidup
  alternative: jiwa yang hidup
  rationale: Konteks penciptaan menunjuk kepada Adam sebagai pribadi atau makhluk hidup, bukan terutama kepada jiwa tak berwujud yang dapat dipisahkan. Alternatif tradisional dicatat agar gema terjemahan lama tetap terlihat.
- issue: Makna ungkapan “Adam yang terakhir menjadi roh yang memberi hidup”
  choice: Mempertahankan kontras tipologis secara langsung tanpa perluasan doktrinal
  alternative: Adam yang terakhir menjadi Roh pemberi hidup
  rationale: Karena πνεῦμα tidak berartikel dan frasanya bersifat kualitatif, huruf kecil dan bentuk “roh yang memberi hidup” menjaga ketegangan teks tanpa menjadikannya identifikasi eksplisit Kristus dengan Roh Kudus sebagai pribadi yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan dipertahankan, dengan diksi yang dapat dipahami pembaca umum serta tanpa memasukkan penjelasan denominasi ke dalam teks utama.
