  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: id
  text: Dan, yang terakhir dari semuanya, seperti kepada seorang yang lahir secara tidak wajar, Ia juga menampakkan diri kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada janin yang gugur” atau “kepada janin yang digugurkan.” Paulus memakai metafora merendahkan diri yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: Dan yang paling akhir dari semuanya
  rationale: Frasa ini menandai urutan terakhir dalam rangkaian penampakan. Bentuk adverbial ἔσχατον bersama πάντων diterjemahkan secara alami tanpa menghilangkan cakupan 'semuanya', sedangkan δέ melanjutkan urutan.
- source_word: ὡσπερεὶ
  choice: seolah-olah kepada
  rationale: Partikel ini memperkenalkan perbandingan dengan nuansa pendekatan atau ketidakpersisan; 'seolah-olah' mempertahankan daya bandingnya.
- source_word: τῷ ἐκτρώματι
  choice: anak yang lahir sebelum waktunya
  rationale: ἔκτρωμα secara harfiah dapat menunjuk pada janin gugur atau anak yang diaborsi dan di sini berfungsi sebagai metafora merendahkan diri yang tajam. Pilihan teks utama ini mempertahankan gagasan kelahiran yang tidak pada waktunya serta lebih wajar bagi pembaca Indonesia; arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὤφθη
  choice: Ia menampakkan diri
  rationale: Dalam konteks daftar penampakan sesudah kebangkitan, bentuk pasif aoris ὁράω secara idiomatis menyatakan bahwa Ia menampakkan diri, bukan sekadar bahwa Ia dilihat.
- source_word: κἀμοί
  choice: juga kepadaku
  rationale: Crasis καί dan ἐμοί memiliki daya aditif, yang menempatkan Paulus juga di dalam rangkaian para saksi.
theological_decisions:
- issue: Metafora Paulus ἐκτρώματι
  choice: Memakai 'anak yang lahir sebelum waktunya' dalam teks utama dan memberi arti yang lebih harfiah dalam catatan kaki.
  alternative: keguguran; janin yang gugur; anak yang diaborsi; orang yang lahir secara tidak wajar
  rationale: Makna tepat metafora itu sulit dipastikan. Terjemahan tidak menambahkan penjelasan doktrinal tentang kerasulan Paulus, tetapi mempertahankan gambaran kelahiran yang abnormal dan nada merendahkan diri, sambil membuka akses kepada ketajaman istilah Yunani melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Ia' mengikuti kebiasaan rujukan hormat kepada Kristus. Susunan kalimat mempertahankan urutan penampakan dan ketegangan metafora tanpa menjadi terlalu klinis dalam teks utama.
