  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: id
  text: Setiap hari aku mati[a]—demi kebanggaan yang kumiliki atas kalian[b] dalam Mesias Yesus[c], Tuhan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “tiap-tiap hari aku mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “demi kebanggaan kalian”; dapat juga dipahami, “sebagaimana pastinya kebanggaan yang kumiliki atas kalian.” Ungkapan Yunani ini menyerupai sumpah, dan hubungan sintaksis frasa tentang kebanggaan itu diperdebatkan.
    reason: alternative_reading
  - marker: c
    text: 'Terjemahan tradisional: “Kristus Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: setiap hari
  rationale: Ungkapan ini berarti ‘tiap-tiap hari’ atau ‘setiap hari’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat berulangnya.
- source_word: ἀποθνῄσκω
  choice: aku mati
  rationale: Bentuk kini aktif orang pertama tunggal dipertahankan secara lugas dan hidup. ‘Aku menghadapi maut setiap hari’ mungkin menjelaskan maksudnya, tetapi lebih interpretatif.
- source_word: νὴ
  choice: demi
  rationale: Partikel ini dipakai dalam penegasan yang menyerupai sumpah. ‘Demi’ mempertahankan bentuk tersebut tanpa menambahkan kata kerja ‘bersumpah’ yang tidak tertulis.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: kebanggaan akan kalian
  rationale: καύχησις dapat berarti ‘kebanggaan’, ‘hal yang dibanggakan’, atau ‘pembanggaan’. Dengan klausa ‘yang kumiliki’, konteks mendukung kebanggaan Paulus berkenaan dengan jemaat Korintus, sedangkan ambiguitas gramatikalnya dicatat dalam catatan kaki.
- source_word: ἣν ἔχω
  choice: yang kumiliki
  rationale: Menerjemahkan klausa relatif secara langsung sekaligus menunjukkan bahwa kebanggaan itu dimiliki Paulus.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Preposisi ‘dalam’ dipertahankan karena penting dalam bahasa teologis Paulus. Χριστός diterjemahkan sebagai gelar ‘Mesias’, bukan sekadar unsur nama.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Tuhan kita
  rationale: Padanan alami dan langsung bagi frasa Yunani tersebut.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός tetap memiliki daya sebagai gelar. Bentuk tradisional dicatat agar pembaca mengetahui padanan yang lazim.
- issue: Makna καύχησις dengan ὑμετέραν
  choice: kebanggaan Paulus akan jemaat Korintus
  alternative: kebanggaan milik jemaat Korintus; atau secara lebih harfiah, ‘kebanggaan kalian’
  rationale: Klausa relatif ‘yang kumiliki’ lebih kuat menunjuk pada kebanggaan yang dimiliki Paulus mengenai mereka. Namun, bentuk Yunani dapat dipahami dengan cara lain, sehingga ketegangannya dipertahankan dalam catatan kaki.
- issue: Daya penegasan νὴ
  choice: demi
  alternative: sungguh; sebagaimana pastinya kebanggaan yang kumiliki akan kalian
  rationale: Bentuk utama mempertahankan corak sumpah secara ringkas, sementara catatan kaki menjelaskan kekuatan dan ketidakpastian susunan frasanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan retorika orang pertama yang hidup. Kata ganti ‘aku’ dan ‘kalian’ dipilih untuk mencerminkan bentuk tunggal Paulus dan jamak jemaat tanpa membuat gaya menjadi kaku. Tanda pisah mempertahankan hentakan penegasan dalam kalimat Yunani.
