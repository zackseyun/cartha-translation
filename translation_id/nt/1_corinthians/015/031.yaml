  naturalness: 'Bahasa draf pada umumnya baku dan hidup. Akan tetapi, “kebanggaan akan kalian yang kumiliki” menimbulkan ambiguitas struktur dalam bahasa Indonesia: pembaca dapat sesaat memahami “kalian yang kumiliki”. Menempatkan “yang kumiliki” segera setelah “kebanggaan” dan memakai “atas kalian” menghasilkan kalimat yang lebih jelas serta tetap modern dan wajar.'
