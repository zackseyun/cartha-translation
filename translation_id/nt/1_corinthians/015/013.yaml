  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: id
  text: Namun, jika tidak ada kebangkitan orang mati, maka Mesias pun tidak dibangkitkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus pun tidak dibangkitkan.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau “Kristus”; di sini “Mesias” dipakai untuk mempertahankan makna gelar tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: εἰ memperkenalkan syarat, sedangkan δέ menandai peralihan atau kontras ringan dalam argumen Paulus; 'Namun, jika' alami dalam bahasa Indonesia.
- source_word: ἀνάστασις νεκρῶν
  choice: kebangkitan orang mati
  rationale: Ungkapan ini menunjuk pada kebangkitan orang-orang yang telah mati sebagai golongan, bukan sekadar asal 'dari antara orang mati'.
- source_word: οὐκ ἔστιν
  choice: tidak ada
  rationale: Menyampaikan penyangkalan eksistensial secara jelas dan wajar.
- source_word: οὐδὲ
  choice: maka ... pun ... tidak
  rationale: 'Dalam konteks ini οὐδέ menyatakan konsekuensi logis: jika kebangkitan orang mati tidak ada, bahkan Mesias tidak dibangkitkan. Bentuk Indonesia ''maka ... pun belum'' menyampaikan daya inferensial itu.'
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi; 'Mesias' mempertahankan makna gelarnya secara alami dalam bahasa Indonesia.
- source_word: ἐγήγερται
  choice: belum dibangkitkan
  rationale: 'Bentuk perfek pasif dipertahankan: peristiwa yang telah terjadi memiliki keadaan/akibat yang tetap berlaku, sedangkan pelakunya tidak disebutkan. Dalam lingkup penyangkalan οὐδέ, ''belum dibangkitkan'' merupakan ungkapan Indonesia yang alami tanpa mengubahnya menjadi aktif.'
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Konteks argumen kebangkitan mendukung fungsi Χριστός sebagai gelar. 'Mesias' menerjemahkan makna gelar itu, sedangkan 'Kristus' dapat terdengar lebih menyerupai nama.
- issue: Bentuk pasif ἐγήγερται
  choice: belum dibangkitkan
  alternative: belum bangkit
  rationale: Bentuk pasif Yunani dipertahankan agar tindakan terhadap Mesias tetap menjadi fokus dan pelaku yang tersirat tidak ditambahkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur syarat dan konsekuensi dalam argumen Paulus. Partikel 'pun' mengungkapkan daya 'bahkan/tidak juga' dari οὐδέ tanpa membuat kalimat terasa kaku.
