  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: id
  text: dan bahwa Dia dikuburkan, dan bahwa Dia telah dibangkitkan[a] pada hari yang ketiga sesuai dengan Kitab Suci,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dibangkitkan.” Bentuk perfek Yunani dapat menekankan bahwa kebangkitan yang telah terjadi itu tetap memiliki dampak atau keadaan yang berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: Dia dikuburkan
  rationale: Bentuk aorist pasif dari θάπτω menyatakan bahwa Dia dikuburkan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan bentuk pasif tanpa menambahkan rincian tentang makam.
- source_word: ἐγήγερται
  choice: Dia telah dibangkitkan
  rationale: Bentuk perfek pasif dari ἐγείρω menunjuk kepada tindakan yang sudah terjadi dengan keadaan atau makna yang tetap berlangsung. Kata 'telah' menandai tindakan yang sudah terlaksana, sedangkan bentuk pasif dipertahankan.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: pada hari yang ketiga
  rationale: Ungkapan datif temporal ini secara idiomatis berarti 'pada hari yang ketiga'. Terjemahan ini tidak menambahkan kata 'setelah', yang tidak dinyatakan dalam teks Yunani.
- source_word: κατὰ τὰς γραφάς
  choice: sesuai dengan Kitab Suci
  rationale: Frasa ini menyatakan kesesuaian dengan kesaksian Kitab Suci. Rumusan tersebut jelas dan wajar dalam bahasa Indonesia serta mempertahankan hubungan dengan formula yang sama dalam konteks terdekat.
- source_word: γραφάς
  choice: Kitab Suci
  rationale: Dalam pemakaian Paulus, bentuk jamak γραφαί mengacu pada kumpulan tulisan suci yang diakui. Bahasa Indonesia lazim memakai 'Kitab Suci' sebagai sebutan kolektif.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini membuka klausa isi dalam rangkaian pengakuan. Pengulangannya mempertahankan irama dan susunan formula Yunani.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana ini dipertahankan agar struktur rangkaian sumber tetap terlihat.
theological_decisions:
- issue: Aspek dan bentuk pasif kata kerja kebangkitan
  choice: Dia telah dibangkitkan
  alternative: Dia dibangkitkan; Dia sudah bangkit
  rationale: Terjemahan utama mempertahankan bentuk pasif dan berusaha menyampaikan bahwa kebangkitan merupakan tindakan yang telah terjadi dengan dampak yang tetap berlaku. Catatan kaki menjaga kemungkinan terjemahan yang lebih sederhana tanpa menjadikan implikasi teologis tertentu sebagai tambahan eksplisit.
- issue: Acuan 'Kitab Suci'
  choice: Kitab Suci
  alternative: tulisan-tulisan suci; Kitab-Kitab Suci
  rationale: Frasa Paulus menunjuk pada kumpulan tulisan yang diakui sebagai suci tanpa menguraikan batas korpusnya. Bentuk kolektif 'Kitab Suci' alami bagi pembaca Indonesia dan tidak menambahkan identifikasi yang tidak terdapat dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'dan bahwa' dipertahankan karena merupakan bagian dari susunan pengakuan dalam teks Yunani. Huruf kapital pada 'Dia' mengikuti kebiasaan penulisan rujukan kepada Kristus dalam bahasa Indonesia, sedangkan 'Kitab Suci' dipakai sebagai nama kolektif yang lazim.
