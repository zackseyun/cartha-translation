  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: id
  text: Ditaburkan dalam kehinaan, dibangkitkan dalam kemuliaan. Ditaburkan dalam kelemahan, dibangkitkan dalam kuasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: ditaburkan
  rationale: Bentuk pasif dipertahankan, dan kata ini menjaga metafora benih/tubuh dalam konteks langsung. Bahasa Indonesia dapat membiarkan subjeknya tersirat sebagaimana teks Yunani.
- source_word: ἀτιμίᾳ
  choice: kehinaan
  rationale: Pilihan ini mempertahankan pertentangan langsung dengan kemuliaan tanpa mempersempit maknanya menjadi rasa malu secara emosional.
- source_word: ἐγείρεται
  choice: dibangkitkan
  rationale: Dalam konteks kebangkitan orang mati, bentuk ini paling alami dan tetap mempertahankan suara pasif serta pelaku ilahi yang tersirat.
- source_word: δόξῃ
  choice: kemuliaan
  rationale: Istilah ini merupakan padanan yang wajar dan berbobot bagi δόξα serta membentuk kontras yang kuat dengan kehinaan.
- source_word: ἀσθενείᾳ
  choice: kelemahan
  rationale: Padanan langsung ini mencakup kerapuhan tubuh dalam konteks tanpa membatasi makna hanya pada kelemahan fisik.
- source_word: δυνάμει
  choice: kuasa
  rationale: Kuasa mempertahankan keluasan makna δύναμις dan kontras Paulus antara kelemahan sekarang dan daya kehidupan kebangkitan, tanpa menjadikannya semata-mata kekuatan jasmani.
theological_decisions:
- issue: Bentuk pasif dan pelaku kebangkitan
  choice: Memakai bentuk pasif “dibangkitkan” tanpa menyebut Allah secara eksplisit.
  alternative: Allah membangkitkannya.
  rationale: Teks Yunani memakai bentuk pasif. Terjemahan ini mempertahankan susunan tersebut dan tidak mengungkapkan secara eksplisit pelaku ilahi yang dibiarkan tersirat oleh Paulus.
- issue: Acuan subjek yang tersirat
  choice: Membiarkan subjek tersirat dalam rangkaian verba pasif.
  alternative: Tubuh ditaburkan ... tubuh dibangkitkan.
  rationale: Konteks sebelumnya sudah menunjukkan bahwa yang dibicarakan adalah tubuh. Bahasa Indonesia secara alami dapat menghilangkan pengulangan subjek sambil mempertahankan kesejajaran dan keringkasan teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kesejajaran dua pasang klausa dipertahankan untuk mencerminkan antitesis retoris teks sumber.
