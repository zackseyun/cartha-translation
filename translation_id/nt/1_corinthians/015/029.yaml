  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: id
  text: Jika tidak demikian, apa yang akan dilakukan oleh orang-orang yang dibaptis untuk orang-orang mati?[a] Jika orang-orang mati sama sekali tidak dibangkitkan, mengapa mereka dibaptis untuk orang-orang mati?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan “bagi orang-orang mati” atau “karena orang-orang mati”; kemungkinan yang lebih kecil ialah “di atas orang-orang mati.” Kata depan Yunani yang dipakai dapat dipahami dengan lebih dari satu cara, dan praktik tepat yang Paulus maksudkan tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Kalau tidak demikian
  rationale: Dalam alur argumen ini, ἐπεί mengantar konsekuensi retoris dari pembahasan sebelumnya. Ungkapan ini menyampaikan arti “jika bukan demikian” secara wajar dalam bahasa Indonesia.
- source_word: τί ποιήσουσιν
  choice: apa yang akan dilakukan
  rationale: Terjemahan ini mempertahankan arti luas ποιέω, “melakukan,” tanpa mempersempit pertanyaan menjadi “apa yang akan mereka capai” atau menafsirkan nasib mereka.
- source_word: οἱ βαπτιζόμενοι
  choice: mereka yang dibaptis
  rationale: Bentuk partisipel pasif kini menunjuk pada orang-orang yang menjalani praktik tersebut. Bahasa Indonesia tidak perlu menandai aspek progresif secara eksplisit, dan terjemahan ini tidak menilai sah atau tidaknya praktik itu.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: demi orang mati
  rationale: Dengan bentuk genitif, ὑπέρ lazim menyatakan kepentingan, manfaat, atau tindakan bagi pihak lain. “Demi” cukup terbuka untuk tidak memastikan bahwa baptisan itu bersifat perwakilan; kemungkinan arti lain dicatat dalam catatan kaki.
- source_word: εἰ ὅλως
  choice: Jika ... sama sekali
  rationale: “Sama sekali” mempertahankan daya penegas ὅλως dalam syarat yang diajukan Paulus.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: orang mati ... tidak dibangkitkan
  rationale: Bentuk pasif ἐγείρονται dipertahankan, selaras dengan bahasa Paulus tentang kebangkitan dan tanpa menghapus isyarat mengenai pelaku ilahi.
- source_word: τί καὶ
  choice: mengapa
  rationale: Dalam pengulangan retoris ini, τί καί secara idiomatis menyatakan alasan atau tujuan tindakan tersebut. “Mengapa” menyampaikan daya argumennya secara alami; hubungan dengan konsekuensi sebelumnya sudah jelas dari susunan kalimat.
- source_word: βαπτίζονται
  choice: mereka dibaptis
  rationale: Bentuk pasif dipertahankan. Dalam bahasa Indonesia, bentuk kini Yunani tidak perlu diterjemahkan dengan frasa progresif yang kaku.
- source_word: ὑπὲρ αὐτῶν
  choice: demi orang mati
  rationale: Kata ganti αὐτῶν mengacu kembali kepada orang mati. Mengulangi acuannya membuat kalimat Indonesia jelas sekaligus menjaga kesejajaran dengan frasa pertama.
theological_decisions:
- issue: Makna baptisan ὑπὲρ orang mati
  choice: Mempertahankan ungkapan yang sedikit mungkin menafsirkan, yaitu “dibaptis demi orang mati,” tanpa mengesahkan praktik atau ajaran tertentu.
  alternative: “dibaptis bagi/untuk orang mati,” “dibaptis karena orang mati,” atau “dibaptis di atas orang mati”
  rationale: Praktik yang dimaksud Paulus tidak dapat dipastikan, dan ὑπέρ memungkinkan lebih dari satu nuansa. Teks utama mempertahankan ketegangan itu, sedangkan catatan kaki menyajikan kemungkinan leksikal tanpa memasukkan penjelasan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Orang mati” dipakai sebagai bentuk generik yang alami. Struktur pertanyaan retoris dan bentuk pasif tentang kebangkitan dipertahankan, sedangkan kejanggalan yang memang terdapat dalam rujukan kepada baptisan demi orang mati tidak dihaluskan dengan tafsiran khusus.
