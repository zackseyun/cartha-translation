  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: id
  text: Jadi, entah aku atau mereka, demikianlah kami memberitakan, dan demikianlah kamu percaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: entah ... atau
  rationale: Bentuk korelatif ini secara alami menyatakan dua kemungkinan dalam bahasa Indonesia dan mempertahankan kontras antara Paulus dan para rasul lainnya.
- source_word: οὖν
  choice: jadi
  rationale: Menandai simpulan dari uraian sebelumnya tentang para saksi kebangkitan; 'jadi' alami dan tetap menyampaikan daya inferensialnya.
- source_word: ἐγὼ
  choice: aku
  rationale: Pronomina orang pertama tunggal yang dikontraskan dengan 'mereka'; 'aku' sesuai dengan register surat dan pemakaian Indonesia modern.
- source_word: ἐκεῖνοι
  choice: mereka
  rationale: Mengacu kepada para rasul atau saksi lain yang disebut dalam konteks, tanpa menambahkan identifikasi yang tidak dinyatakan langsung dalam ayat.
- source_word: οὕτως
  choice: demikianlah
  rationale: Mempertahankan pengulangan dan kesejajaran Yunani serta dapat menunjuk pada isi pemberitaan yang baru diringkas tanpa mempersempitnya secara berlebihan.
- source_word: κηρύσσομεν
  choice: kami memberitakan
  rationale: Menyampaikan tindakan pengumuman publik; 'kami' mencakup Paulus bersama para rasul lain, sedangkan 'memberitakan' wajar dalam bahasa Indonesia dan tidak menambahkan objek tersurat.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan hubungan koordinatif langsung antara pemberitaan para rasul dan kepercayaan jemaat Korintus.
- source_word: οὕτως
  choice: demikianlah
  rationale: 'Pilihan yang sama pada kemunculan kedua menjaga paralelisme yang disengaja: sebagaimana berita itu disampaikan, demikian pula jemaat menerimanya dengan percaya.'
- source_word: ἐπιστεύσατε
  choice: kamu percaya
  rationale: Menyatakan tindakan percaya yang terjadi pada masa lampau dalam konteks narasi, tanpa menambahkan objek atau nuansa teologis yang tidak tersurat.
theological_decisions:
- issue: Cakupan kesatuan pemberitaan para rasul
  choice: Ayat ini menyatakan bahwa baik Paulus maupun para rasul lain memberitakan berita yang sama, dan itulah yang dipercayai jemaat Korintus.
  alternative: 'Menekankan terutama cara pemberitaan dan cara mereka percaya: ''demikianlah kami memberitakan dan demikianlah kamu percaya.'''
  rationale: Pengulangan οὕτως sengaja dipertahankan agar dapat mencakup rujukan pada isi yang diringkas sebelumnya maupun nuansa cara, tanpa menjadikannya dasar bagi klaim eklesiologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan 'Jadi, entah aku atau mereka' terdengar alami sekaligus mengikuti struktur argumentatif Yunani. Pengulangan 'demikianlah' dipertahankan untuk mencerminkan paralelisme sumber.
