  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: id
  text: “Di manakah, hai maut, kemenanganmu?”[a] “Di manakah, hai maut, sengatmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi, “Di manakah, hai maut, sengatmu?” pada klausa pertama, suatu bacaan yang tercermin dalam KJV dan sejumlah terjemahan tradisional lainnya.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: Di manakah
  rationale: Kata tanya ini membuka pertanyaan retoris bernada ejekan. “Di manakah” alami dalam bahasa Indonesia dan mempertahankan daya langsung teks tanpa menambahkan penegasan.
- source_word: σου
  choice: -mu
  rationale: Pronomina orang kedua dalam bentuk genitif menyatakan kepunyaan; sufiks “-mu” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: θάνατε
  choice: hai maut
  rationale: Bentuk vokatif menyapa maut sebagai sosok. “Hai maut” mempertahankan personifikasi dan daya puitis seruan tersebut.
- source_word: νῖκος
  choice: kemenangan
  rationale: Kata ini berarti kemenangan atau kejayaan. “Kemenangan” jelas, lazim, dan selaras dengan konteks kebangkitan serta ayat 54.
- source_word: κέντρον
  choice: sengat
  rationale: Kata ini dapat berarti sengat atau tongkat penghalau yang runcing. Dalam konteks maut yang dipersonifikasikan dan penjelasan pada ayat 56, “sengat” merupakan padanan yang paling wajar.
theological_decisions:
- issue: Bacaan teks kritis pada klausa pertama
  choice: Menerjemahkan νῖκος sebagai “kemenangan” dalam teks utama.
  alternative: Sebagian naskah memakai “sengat” pada klausa pertama, sehingga berbunyi, “Di manakah, hai maut, sengatmu?”
  rationale: SBLGNT sebagai teks sumber membaca νῖκος, dan bacaan “kemenangan” juga berkaitan langsung dengan pernyataan bahwa maut telah ditelan dalam kemenangan pada ayat 54. Varian tradisional tetap dicatat karena penting dalam sejarah penyalinan dan penerjemahan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Sapaan “hai maut” mempertahankan bentuk vokatif serta personifikasi tanpa terdengar terlalu arkais. Penanda catatan kaki ditempatkan sesudah keseluruhan kutipan.
