id: 1CO.15.53
reference: 1 Corinthians 15:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: id
  text: Sebab, tubuh yang dapat binasa ini harus mengenakan keadaan yang tidak dapat binasa[a], dan tubuh yang dapat mati ini harus mengenakan keadaan yang tidak dapat mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “yang dapat binasa ini harus mengenakan keadaan yang tidak dapat binasa, dan yang dapat mati ini harus mengenakan keadaan yang tidak dapat mati.” Dalam bahasa Yunani, kata “tubuh” tidak disebutkan secara eksplisit dalam ayat ini, tetapi konteksnya menunjukkan dengan jelas bahwa tubuhlah yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan atau keniscayaan transformasi dengan kuat dan wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan ayat sebelumnya.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: tubuh yang dapat binasa ini
  rationale: Kata sifat substantival ini berarti sesuatu yang tunduk pada kebinasaan atau kerusakan. Kata 'tubuh' ditambahkan berdasarkan konteks kebangkitan tubuh agar rujukannya jelas.
- source_word: ἐνδύσασθαι
  choice: mengenakan
  rationale: Mempertahankan metafora berpakaian dalam ungkapan Indonesia yang alami dan bermartabat.
- source_word: ἀφθαρσίαν
  choice: keadaan yang tidak dapat binasa
  rationale: Mengungkapkan keadaan yang tidak tunduk pada kebinasaan serta mempertahankan kontras langsung dengan 'dapat binasa'.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan dua klausa paralel secara langsung.
- source_word: τὸ θνητὸν τοῦτο
  choice: tubuh yang dapat mati ini
  rationale: Menyatakan sesuatu yang tunduk pada kematian; 'tubuh' ditambahkan dari konteks untuk memperjelas rujukan dan menjaga kesejajaran.
- source_word: ἀθανασίαν
  choice: keadaan yang tidak dapat mati
  rationale: Menyampaikan arti tidak lagi tunduk pada kematian dan menjaga kontras leksikal dengan 'dapat mati'.
theological_decisions:
- issue: Penambahan kata 'tubuh' meskipun σώμα tidak terdapat dalam ayat ini
  choice: Menerjemahkan kata sifat substantival sebagai 'tubuh yang dapat binasa ini' dan 'tubuh yang dapat mati ini'.
  alternative: Yang dapat binasa ini harus mengenakan keadaan yang tidak dapat binasa, dan yang dapat mati ini harus mengenakan keadaan yang tidak dapat mati.
  rationale: Konteks langsung 1 Korintus 15:42–54 membahas kebangkitan dan perubahan tubuh. Penambahan ini memperjelas rujukan tersirat tanpa memasukkan klaim teologis baru; catatan kaki mempertahankan bentuk Yunani yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan mempertahankan metafora 'mengenakan' serta paralelisme klausa Yunani, sambil memakai frasa penjelas yang mudah dipahami untuk nomina abstrak ἀφθαρσία dan ἀθανασία.
