  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: id
  text: 'Janganlah kamu disesatkan: pergaulan yang buruk merusak akhlak yang baik.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Percakapan yang buruk merusak akhlak yang baik.” Kata Yunani ini dapat merujuk pada pergaulan atau percakapan; makna yang lebih luas, “pergaulan,” paling sesuai dengan konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Janganlah disesatkan
  rationale: Bentuk larangan ini dipertahankan tanpa menentukan apakah penyesatan berasal dari diri sendiri atau orang lain. Ungkapan ini juga menjaga bentuk pasif/middle Yunani dan nada peringatannya.
- source_word: φθείρουσιν
  choice: merusak
  rationale: Kata kerja ini menunjuk pada kemerosotan atau kerusakan. Dalam konteks etis, “merusak” terdengar alami dan tidak sekuat “membinasakan”.
- source_word: ἤθη
  choice: akhlak
  rationale: Kata ini mengacu pada kebiasaan atau watak etis. “Akhlak” menyampaikan dimensi moral dengan ringkas dan lazim dalam bahasa Indonesia modern.
- source_word: χρηστὰ
  choice: yang baik
  rationale: Kata sifat ini menerangkan ἤθη secara etis; “baik” merupakan padanan yang langsung dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: ὁμιλίαι
  choice: pergaulan
  rationale: Kata Yunani ini dapat menunjuk pada hubungan/pergaulan ataupun percakapan. Dalam konteks pepatah ini, “pergaulan” paling alami untuk makna hubungan dengan orang lain, sementara kemungkinan “percakapan” dipertahankan dalam catatan kaki.
- source_word: κακαί
  choice: yang buruk
  rationale: Kata sifat ini menyatakan sifat yang merugikan secara moral. “Buruk” alami dalam pasangan “pergaulan yang buruk” dan tidak melebihkan maknanya menjadi “jahat”.
