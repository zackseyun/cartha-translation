id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: id
  text: Kemudian tibalah akhir[a], ketika Kristus menyerahkan Kerajaan kepada Allah, yaitu Bapa[b], ketika Ia meniadakan setiap pemerintahan, setiap kewenangan, dan setiap kuasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesudahan” atau “penyempurnaan.” Kata Yunani τέλος dapat berarti akhir, tujuan, atau penyempurnaan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kepada Allah dan Bapa.”'
    reason: lexical_alternative
  - marker: c
    text: Atau “membuat tidak berlaku” atau “membuat tidak berdaya.” Kata Yunani yang diterjemahkan “meniadakan” tidak harus berarti pemusnahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Sesudah itu
  rationale: Menandai tahap berikutnya dalam urutan peristiwa kebangkitan yang dipaparkan Paulus.
- source_word: τὸ τέλος
  choice: tibalah kesudahannya
  rationale: τέλος dapat menunjuk pada akhir, tujuan, atau penyempurnaan. Dalam urutan eskatologis ini, 'kesudahannya' mempertahankan makna temporal sekaligus membiarkan nuansa pencapaian tujuan tetap terbuka.
- source_word: ὅταν παραδιδῷ
  choice: ketika Kristus menyerahkan
  rationale: Bentuk ὅταν dengan subjungtif menunjuk pada peristiwa mendatang. Subjek tersirat diperjelas sebagai Kristus dari konteks dekat, sedangkan 'menyerahkan' menyatakan pengalihan kerajaan atau pemerintahan.
- source_word: τὴν βασιλείαν
  choice: Kerajaan
  rationale: βασιλεία dapat berarti kerajaan atau pemerintahan sebagai kegiatan memerintah. 'Kerajaan' alami dalam bahasa Indonesia dan tetap memungkinkan nuansa pemerintahan.
- source_word: τῷ θεῷ καὶ πατρί
  choice: kepada Allah, yaitu Bapa
  rationale: 'Ungkapan ini dipahami secara aposisional: Allah, yakni Bapa. Bentuk ini alami dan juga mempertahankan keberadaan καί dalam konstruksi Yunani.'
- source_word: ὅταν καταργήσῃ
  choice: setelah Ia meniadakan
  rationale: Aoristus subjungtif dapat dipahami sebagai tindakan yang telah dituntaskan pada saat kerajaan diserahkan. 'Meniadakan' menyatakan bahwa kekuatan-kekuatan itu dibuat tidak berlaku atau tidak berdaya tanpa harus berarti pemusnahan metafisik.
- source_word: πᾶσαν ἀρχὴν
  choice: setiap pemerintahan
  rationale: Dalam rangkaian dengan ἐξουσία dan δύναμις, ἀρχή menunjuk pada pemerintahan atau kuasa yang memerintah; pilihan ini mempertahankan kemungkinan makna abstrak atau institusional.
- source_word: πᾶσαν ἐξουσίαν
  choice: setiap kewenangan
  rationale: ἐξουσία menunjuk pada hak atau ranah menjalankan kuasa; 'kewenangan' membedakannya dengan δύναμις.
- source_word: δύναμιν
  choice: kuasa
  rationale: δύναμις menyatakan daya atau kekuatan dan paling wajar diterjemahkan 'kuasa' dalam rangkaian ini.
theological_decisions:
- issue: Hubungan 'Allah' dan 'Bapa' dalam τῷ θεῷ καὶ πατρί
  choice: 'Aposisional: ''kepada Allah, yaitu Bapa'''
  alternative: '''kepada Allah dan Bapa'''
  rationale: Konstruksi Yunani dapat diterjemahkan lebih harfiah dengan 'dan', tetapi dalam konteks ini Bapa mengidentifikasi Allah yang menerima Kerajaan. 'Yaitu' membuat hubungan tersebut jelas tanpa menambahkan klaim di luar teks.
- issue: Hubungan temporal kedua klausa ὅταν
  choice: '''setelah Ia meniadakan'''
  alternative: '''ketika Ia meniadakan'''
  rationale: Aoristus καταργήσῃ memungkinkan tindakan peniadaan dipandang telah selesai ketika penyerahan Kerajaan berlangsung. Catatan kaki mempertahankan kemungkinan kedua klausa itu dipahami sejajar secara temporal.
- issue: Daya kata καταργήσῃ
  choice: Peniadaan atau pembatalan daya berlaku, bukan harus pemusnahan
  alternative: '''membinasakan'' atau ''membuat tidak berdaya'''
  rationale: καταργέω menyatakan pengakhiran keberlakuan atau keefektifan. 'Meniadakan' cukup tegas, tetapi tidak menentukan nasib metafisik kuasa-kuasa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kristus' ditambahkan sebagai subjek tersirat berdasarkan konteks ayat 23, untuk menghindari ambiguitas pronominal dalam bahasa Indonesia. Kapitalisasi 'Kerajaan' dipakai karena menunjuk secara khusus pada Kerajaan yang diperintah Kristus; pronomina ilahi 'Ia' mengikuti kebiasaan penerbitan Alkitab Indonesia.
