  to: Sebab, “Ia telah menundukkan segala sesuatu di bawah kaki-Nya.” Namun, ketika dikatakan bahwa segala sesuatu telah ditundukkan, jelaslah bahwa Dia yang telah menundukkan segala sesuatu kepada-Nya tidak termasuk di dalamnya[a].
