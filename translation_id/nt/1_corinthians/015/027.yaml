id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: id
  text: Sebab, “Ia telah menundukkan segala sesuatu di bawah kaki-Nya.” Namun, ketika dikatakan bahwa segala sesuatu telah ditundukkan, jelaslah bahwa Dia yang telah menundukkan segala sesuatu kepada-Nya tidak termasuk di dalamnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kecuali Dia yang telah menundukkan segala sesuatu kepada-Nya.”'
    reason: Alternatif leksikal untuk ἐκτός, yang menyatakan pengecualian.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini mencakup segala sesuatu secara luas, bukan khusus semua orang, serta mempertahankan gema Mazmur 8.
- source_word: ὑπέταξεν
  choice: telah menaklukkan
  rationale: Kata kerja ini menyatakan tindakan menempatkan sesuatu dalam ketundukan. Bentuk 'telah menaklukkan' menyampaikan tindakan yang menentukan dan dampaknya yang tetap berlaku.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: di bawah kaki-Nya
  rationale: Ungkapan ini dipertahankan secara harfiah karena merupakan kiasan alkitabiah tentang kekuasaan dan penaklukan, dengan gema pada Mazmur 8.
- source_word: ὅταν δὲ εἴπῃ
  choice: Namun, ketika dikatakan
  rationale: Bentuk pasif impersonal wajar dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah subjek tersiratnya Allah atau Kitab Suci.
- source_word: ὑποτέτακται
  choice: telah ditaklukkan
  rationale: Perfek pasif Yunani menunjuk pada tindakan yang sudah selesai dengan keadaan yang terus berlangsung; bentuk ini mempertahankan suara pasif dan hasil tindakan tersebut.
- source_word: δῆλον
  choice: jelaslah
  rationale: Pilihan ini menyampaikan kesimpulan yang menurut Paulus nyata bagi pembaca, dengan gaya yang lugas dan bermartabat.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: Dia yang menaklukkan segala sesuatu kepada-Nya tidak termasuk di dalamnya
  rationale: 'ἐκτός menyatakan pengecualian. Susunan ini membuat logikanya jelas dalam bahasa Indonesia: Dia yang menaklukkan segala sesuatu kepada Kristus tidak termasuk dalam ''segala sesuatu'' yang ditaklukkan.'
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Datif ini menunjukkan pribadi yang menerima penaklukan segala sesuatu, yaitu Sang Anak/Mesias dalam konteks.
theological_decisions:
- issue: Hubungan antara Sang Anak dan Dia yang menaklukkan segala sesuatu
  choice: Ayat ini secara eksplisit mengecualikan Dia yang menaklukkan segala sesuatu kepada Sang Anak dari cakupan 'segala sesuatu'.
  alternative: 'Menerjemahkan dengan bentuk lebih ringkas: ''kecuali Dia yang menaklukkan segala sesuatu kepada-Nya.'''
  rationale: Terjemahan mempertahankan pembedaan yang dibuat teks antara Sang Anak dan Dia yang menaklukkan segala sesuatu kepada-Nya, tanpa menambahkan penjelasan doktrinal atau mengurangi martabat Sang Anak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menaklukkan' dipilih untuk menjaga daya ungkap ὑποτάσσω dan citra 'di bawah kaki', sedangkan pasif impersonal 'ketika dikatakan' mempertahankan ambiguitas subjek dalam bahasa Yunani. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia dan membantu membedakan rujukan dalam kalimat tanpa menambahkan nama yang tidak terdapat dalam teks.
