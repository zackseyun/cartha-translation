  source_fidelity: Revisi diperlukan pada verba utama. ὑποτάσσω berarti ‘menundukkan/menempatkan dalam ketundukan’; ‘menaklukkan’ dapat dipakai, tetapi ‘menundukkan’ lebih tepat dan konsisten untuk kedua kemunculan verba serta relasi datif αὐτῷ (‘kepada-Nya’). Struktur kutipan, pengecualian ἐκτός, dan ambiguitas subjek pada ὅταν δὲ εἴπῃ dipertahankan.
  naturalness: Teks revisi menggunakan bahasa Indonesia baku dan modern. ‘Telah menundukkan’ lebih idiomatis dalam konstruksi ‘di bawah kaki-Nya’ dan ‘kepada-Nya’ daripada ‘menaklukkan ... kepada-Nya’.
  terminology: ‘Segala sesuatu’, ‘di bawah kaki-Nya’, dan ‘ditundukkan’ mempertahankan cakupan universal, citra Mazmur 8, serta suara pasif perfek dalam teks Yunani. Pronomina kapital dipertahankan sesuai konvensi naskah.
  issues:
  - severity: medium
    issue: ‘Menaklukkan segala sesuatu kepada-Nya’ kurang tepat dan kurang alami.
    rationale: Dalam klausa ὑποτάξαντος αὐτῷ τὰ πάντα, tindakan yang dimaksud ialah menempatkan segala sesuatu dalam ketundukan kepada-Nya, bukan terutama menaklukkan sesuatu ‘kepada’ seseorang. ‘Menundukkan’ menyampaikan relasi ini secara tepat dan konsisten dengan pasif ὑποτέτακται.
  - severity: low
    issue: Alternatif leksikal untuk frasa pengecualian belum dicantumkan sebagai catatan kaki.
    rationale: Jejak audit bahasa Inggris menyediakan alternatif ‘except for’. Catatan kaki Indonesia pada ‘tidak termasuk di dalamnya’ mempertahankan alternatif yang sah tanpa mengubah makna teks utama.
