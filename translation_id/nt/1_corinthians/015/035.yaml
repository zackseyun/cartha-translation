  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: id
  text: Tetapi, seseorang akan berkata[a], “Bagaimana orang mati dibangkitkan, dan dengan tubuh seperti apa mereka datang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana orang mati bangkit?” Kata kerja Yunaninya berbentuk pasif, secara harfiah “dibangkitkan,” dan dapat mengisyaratkan tindakan ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Namun
  rationale: Menandai peralihan kontras menuju pertanyaan atau keberatan yang dibayangkan; alami dalam bahasa Indonesia modern.
- source_word: ἐρεῖ τις
  choice: seseorang akan berkata
  rationale: Mempertahankan bentuk futurum dan fungsi retoris seorang penanya hipotetis tanpa mengubah ‘berkata’ menjadi ‘bertanya’.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Bagaimana orang-orang mati dibangkitkan
  rationale: Mempertahankan bentuk pasif ἐγείρονται, yang dapat mengisyaratkan pelaku ilahi tanpa menyatakannya secara eksplisit.
- source_word: ποίῳ ... σώματι
  choice: dengan tubuh seperti apa
  rationale: Menyampaikan daya kualitatif ποίῳ (‘jenis/seperti apa’) dan fungsi datif secara alami.
- source_word: δὲ
  choice: dan
  rationale: Menghubungkan pertanyaan kedua dengan pertanyaan pertama tanpa memberi nuansa pertentangan yang kuat.
- source_word: ἔρχονται
  choice: mereka datang
  rationale: Mempertahankan arti langsung ἔρχομαι dan tidak menafsirkannya ulang sebagai ‘muncul’ atau mengulang ‘dibangkitkan’.
theological_decisions:
- issue: Ungkapan kebangkitan dan pelakunya
  choice: orang-orang mati dibangkitkan
  alternative: orang-orang mati bangkit
  rationale: Bentuk pasif Yunani dipertahankan agar kemungkinan tersiratnya tindakan Allah tetap ada, tetapi pelakunya tidak dibuat lebih eksplisit daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. ‘Orang-orang mati’ lebih mudah dipahami pembaca umum daripada bentuk nominal ‘orang mati’, sedangkan susunan pertanyaan tetap dekat dengan bentuk Yunani.
