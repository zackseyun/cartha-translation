  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: id
  text: Kemuliaan matahari itu satu macam[a], kemuliaan bulan lain, dan kemuliaan bintang-bintang lain lagi. Sebab, bintang yang satu berbeda dari bintang yang lain dalam kemuliaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semarak” atau “cahaya” di seluruh ayat ini. Kata Yunani yang diterjemahkan “kemuliaan” dapat menunjuk pada pancaran yang tampak di sini, tetapi “kemuliaan” mempertahankan pengulangan kata Paulus dalam pembahasan di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: satu macam ... lain ... lain lagi
  rationale: Pengulangan ἄλλη membedakan jenis atau wujud kemuliaan. Susunan ini alami dalam bahasa Indonesia sambil mempertahankan rangkaian kontras.
- source_word: δόξα
  choice: kemuliaan
  rationale: Dalam perumpamaan kosmologis ini kata tersebut mencakup cahaya atau semarak yang tampak, tetapi 'kemuliaan' mempertahankan istilah kunci yang berulang dalam pembahasan Paulus tentang kebangkitan.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: matahari / bulan / bintang-bintang
  rationale: Bentuk-bentuk genitif ini bergantung pada δόξα dan secara alami diterjemahkan sebagai kemuliaan yang dimiliki atau ditampilkan benda-benda langit tersebut.
- source_word: ἀστὴρ ... ἀστέρος
  choice: bintang yang satu ... bintang yang lain
  rationale: Perbandingan bentuk tunggal dengan tunggal dipertahankan agar terlihat bahwa perbedaan juga terdapat di dalam kategori bintang.
- source_word: γὰρ
  choice: bahkan
  rationale: Partikel ini memberi penjelasan pendukung atas pernyataan sebelumnya. 'Bahkan' mengalir alami karena klausa berikut menegaskan adanya keragaman bukan hanya antarkategori, melainkan juga di antara bintang-bintang.
- source_word: διαφέρει
  choice: berbeda
  rationale: Kata kerja ini menyatakan perbedaan. Terjemahan ini tidak memaksakan gagasan bahwa satu bintang selalu lebih unggul daripada yang lain.
- source_word: ἐν δόξῃ
  choice: kemuliaan ... berbeda
  rationale: 'Bidang perbedaannya dinyatakan dengan mengulang ''kemuliaan'' dalam konstruksi Indonesia yang alami: kemuliaan yang satu berbeda dari kemuliaan yang lain.'
theological_decisions:
- issue: Terjemahan δόξα dalam analogi benda-benda langit di tengah pembahasan tentang kebangkitan
  choice: kemuliaan
  alternative: semarak; cahaya; kecemerlangan
  rationale: Acuan langsungnya mencakup pancaran benda-benda langit, tetapi 'kemuliaan' mempertahankan kesinambungan leksikal dan retoris dengan pembahasan tubuh kebangkitan tanpa membatasi maknanya pada terang fisik saja.
- issue: Apakah διαφέρει menyatakan perbedaan atau keunggulan
  choice: berbeda
  alternative: mengungguli
  rationale: Konstruksi ini dengan jelas menyatakan adanya perbedaan, sedangkan gagasan keunggulan relatif tidak perlu dipaksakan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'kemuliaan' sengaja dipertahankan untuk mencerminkan retorika sumber, sedangkan 'satu macam ... lain ... lain lagi' menghasilkan kontras yang wajar dan mudah dipahami.
