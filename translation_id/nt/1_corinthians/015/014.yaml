id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: id
  text: Dan jika Mesias tidak dibangkitkan, maka sia-sialah pemberitaan kami dan iman kamu juga sia-sia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Mempertahankan makna gelar Χριστός dalam argumen Paulus, dengan bentuk yang alami dan dikenal dalam bahasa Indonesia.
- source_word: ἐγήγερται
  choice: dibangkitkan
  rationale: Bentuk pasif perfektum dalam konteks kebangkitan; 'dibangkitkan' mempertahankan diatesis pasif dan hasil yang tetap berlaku.
- source_word: κενὸν / κενὴ
  choice: sia-sia
  rationale: Dalam konteks argumentatif ini, kata tersebut menyatakan bahwa pemberitaan dan iman tidak memiliki dasar, hasil, atau nilai jika Mesias tidak dibangkitkan. Pengulangan padanan yang sama mempertahankan kesejajaran retoris.
- source_word: ἄρα
  choice: maka (diwujudkan melalui susunan predikatif '-lah')
  rationale: Menandai kesimpulan logis dari klausa bersyarat; susunan 'sia-sialah' menyampaikan akibat secara alami tanpa harus menambahkan kata 'maka'.
- source_word: κήρυγμα
  choice: pemberitaan
  rationale: Mencakup baik tindakan maupun isi pewartaan publik dan lebih alami dalam ragam gerejawi Indonesia daripada 'proklamasi'.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini menunjuk pada respons percaya jemaat Korintus; 'iman' merupakan padanan Indonesia yang baku dan tepat.
theological_decisions:
- issue: Rumusan kebangkitan dan pelaku tindakan
  choice: tidak dibangkitkan
  alternative: tidak bangkit
  rationale: Bentuk pasif Yunani dipertahankan agar nuansa pelaku ilahi yang tersirat tidak dihapus atau ditentukan lebih jauh daripada teks.
- issue: Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Mempertahankan arti gelar yang diurapi tanpa mengubahnya menjadi bentuk yang terutama terdengar seperti nama diri.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Inversi predikatif 'sia-sialah' mempertahankan tekanan dan kesejajaran dua pemakaian κενός secara alami.
source_grounding:
  english_pob_role: consult_only
