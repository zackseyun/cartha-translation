  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: id
  text: Sebab, melalui seorang manusia datanglah kematian, dan melalui seorang manusia juga datanglah kebangkitan orang mati.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh seorang manusia” dalam kedua klausa; kata depan Yunani dapat menyatakan pelaku maupun perantaraan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteksnya, Paulus mengidentifikasi kedua manusia itu sebagai Adam dan Mesias (lihat 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Sebab, karena
  rationale: Gabungan ini memberi alasan bagi pernyataan sebelumnya. “Sebab, karena” mempertahankan fungsi penjelas γάρ dan fungsi kausal ἐπειδή, meskipun dalam bahasa Indonesia konstruksinya dibuat dengan tanda koma agar tetap terbaca alami.
- source_word: δι’ ἀνθρώπου
  choice: melalui seorang manusia
  rationale: διά dengan genitif dapat menyatakan perantaraan maupun pelaku. “Melalui” mempertahankan keluasan itu, sedangkan “seorang manusia” menjaga bentuk tunggal tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: θάνατος
  choice: kematian datang
  rationale: Teks Yunani tidak memakai verba; “datang” dipasok agar kalimat Indonesia lengkap dan untuk menyatakan masuk atau hadirnya kematian tanpa mempersempit makna.
- source_word: καὶ
  choice: juga
  rationale: Di sini καί menandai kesejajaran anggota kedua dengan anggota pertama; “juga” membuat hubungan paralel tersebut jelas.
- source_word: ἀνάστασις νεκρῶν
  choice: kebangkitan orang-orang mati
  rationale: Ungkapan ini menyatakan kebangkitan mereka yang mati. Pilihan ini konkret, mudah dipahami, dan tidak mengaburkannya menjadi gagasan umum tentang kehidupan sesudah mati.
- source_word: δι’ ἀνθρώπου
  choice: melalui seorang manusia
  rationale: Pengulangan yang sama dipertahankan untuk menjaga kesejajaran sengaja antara manusia yang menjadi perantara datangnya kematian dan manusia yang menjadi perantara kebangkitan.
theological_decisions:
- issue: Kontras representatif antara Adam dan Kristus
  choice: Mempertahankan “seorang manusia” dalam kedua klausa tanpa menyebut identitas mereka dalam teks utama.
  alternative: “melalui satu orang”; atau “melalui Adam ... melalui Kristus”
  rationale: Konteks mengidentifikasi kedua tokoh itu, tetapi ayat ini sendiri menyatakannya secara ringkas dan paralel. Terjemahan tidak menambahkan nama atau angka yang tidak eksplisit.
- issue: Hakikat kebangkitan
  choice: Menerjemahkan ἀνάστασις νεκρῶν sebagai “kebangkitan orang-orang mati”.
  alternative: “kebangkitan rohani” atau “kehidupan sesudah mati”
  rationale: Konteks 1 Korintus 15 membahas kebangkitan nyata orang mati; ungkapan konkret dipertahankan tanpa melakukan spiritualisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel kedua klausa dipertahankan. Istilah “manusia” dipilih daripada “laki-laki” karena ἄνθρωπος menekankan manusia sebagai pribadi, sementara konteks tetap menunjuk kepada Adam dan Mesias.
