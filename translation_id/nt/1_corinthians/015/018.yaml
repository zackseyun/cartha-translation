id: 1CO.15.18
reference: 1 Corinthians 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: id
  text: Jadi, orang-orang yang telah tertidur[b] dalam Mesias[a] pun telah binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam Kristus.”'
    reason: alternative_reading
  - marker: b
    text: “Tertidur” adalah ungkapan halus dalam bahasa Yunani untuk kematian, khususnya kematian orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Jadi
  rationale: Partikel ini menyatakan kesimpulan dari argumen sebelumnya; “Jadi” alami dalam bahasa Indonesia dan mempertahankan alur inferensial Paulus.
- source_word: καὶ
  choice: pun
  rationale: '“Pun” menyampaikan daya aditif: mereka yang telah meninggal dalam Mesias juga termasuk dalam konsekuensi yang sedang ditarik.'
- source_word: οἱ κοιμηθέντες
  choice: orang-orang yang telah tertidur
  rationale: Ungkapan ini mempertahankan metafora Yunani tentang tidur sebagai ungkapan halus untuk kematian, tanpa menggantinya langsung dengan “telah meninggal.”
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός berfungsi sebagai gelar, dan “dalam Mesias” sekaligus mempertahankan bahasa Paulus mengenai keterikatan atau persatuan dengan Mesias.
- source_word: ἀπώλοντο
  choice: telah binasa
  rationale: Bentuk aoris menyatakan kebinasaan sebagai konsekuensi seandainya tidak ada kebangkitan; “telah binasa” menyampaikan tindakan beserta keadaan yang dihasilkannya secara wajar.
theological_decisions:
- issue: Penerjemahan Χριστῷ dalam ungkapan Paulus tentang persatuan dengan Kristus/Mesias
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: “Mesias” menerjemahkan makna gelar Χριστός, sedangkan alternatif tradisional “Kristus” dicantumkan dalam catatan kaki agar rumusan Paulus yang sudah dikenal tetap terlihat.
- issue: Makna ἀπώλοντο dalam argumen tentang kebangkitan
  choice: telah binasa
  alternative: telah hilang
  rationale: “Telah binasa” mempertahankan bobot akibat fatal yang dinyatakan teks tanpa merinci secara berlebihan hakikat kebinasaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “pun” dipilih agar hubungan aditif terdengar alami, sementara metafora “tertidur” dipertahankan dan dijelaskan melalui catatan kaki.
