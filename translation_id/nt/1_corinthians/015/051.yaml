  text: 'Ketahuilah, aku memberitahukan kepada kalian suatu rahasia: tidak semua dari kita akan tidur[a], tetapi kita semua akan diubah[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengungkapkan maknanya secara lebih langsung, “mati”. Bahasa Yunani memakai kata “tidur”, metafora yang umum dalam Perjanjian Baru untuk kematian dalam terang kebangkitan.
