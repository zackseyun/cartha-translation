lexical_decisions:
- source_word: ἰδοὺ
  choice: Ketahuilah
  rationale: Berfungsi sebagai penanda untuk menarik perhatian kepada pernyataan penting. Pilihan ini alami dan bermartabat dalam bahasa Indonesia serta lebih tepat daripada terjemahan harfiah yang menyuruh pembaca melihat.
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada kebenaran ilahi yang sebelumnya tersembunyi lalu dinyatakan, bukan sekadar sesuatu yang sulit dimengerti. “Rahasia” menyampaikan makna itu secara wajar dalam bahasa Indonesia modern.
- source_word: ὑμῖν λέγω
  choice: aku memberitahukan kepadamu
  rationale: Mempertahankan sapaan langsung dan menegaskan bahwa Paulus sedang menyampaikan suatu penyataan. Bentuk tunggal “kepadamu” sesuai dengan kata ganti Yunani jamak yang menyapa jemaat sebagai satu kelompok dan lazim dalam gaya surat.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: tidak semua dari kita akan tidur
  rationale: 'Susunan ini mempertahankan cakupan negasi Yunani: bukan bahwa semua tidak akan mati, melainkan bahwa sebagian tidak akan mengalaminya. “Tidur” mempertahankan metafora Perjanjian Baru tentang kematian dalam terang kebangkitan.'
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: tetapi kita semua akan diubah
  rationale: 'Bentuk pasif mempertahankan Allah sebagai pelaku yang tersirat, sedangkan “tetapi” mengungkapkan kontras: tidak semua akan mati, tetapi semua akan mengalami perubahan eskatologis.'
theological_decisions:
- issue: Makna “tidur” dalam konteks kebangkitan
  choice: Mempertahankan “tidur” sebagai metafora bagi kematian jasmani sebelum kebangkitan.
  alternative: Menerjemahkannya secara interpretatif sebagai “mati”.
  rationale: Metafora Paulus menghubungkan kematian dengan pengharapan kebangkitan. Mempertahankannya tidak dengan sendirinya menetapkan ajaran tertentu mengenai keadaan jiwa setelah kematian.
- issue: Varian tekstual mengenai siapa yang tidur dan siapa yang diubah
  choice: 'Teks utama mengikuti SBLGNT: “tidak semua dari kita akan tidur, tetapi kita semua akan diubah”.'
  alternative: 'Varian penting memberi pengertian: “kita semua akan tidur, tetapi tidak semua dari kita akan diubah”.'
  rationale: Bacaan SBLGNT diterjemahkan langsung sebagai teks utama, sedangkan varian yang berbeda secara teologis dan interpretatif dicatat tanpa diadopsi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. Kata ganti “aku”, “kepadamu”, dan “kita” mempertahankan kedekatan sapaan Paulus; “kita” bersifat inklusif, mencakup Paulus dan para pembacanya. Metafora “tidur” serta bentuk pasif “diubah” dipertahankan untuk menjaga citra dan ketegangan teologis teks sumber.
