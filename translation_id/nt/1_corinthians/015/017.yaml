id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: id
  text: Tetapi jika Mesias[a] tidak dibangkitkan, sia-sialah[b] iman kalian; kalian masih berada dalam dosa-dosa kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Padanan tradisional bagi gelar Yunani Χριστός.
  - marker: b
    text: Atau, “tidak berguna.”
    reason: Alternatif leksikal untuk ματαία yang menekankan ketidakefektifan iman dalam keadaan yang diandaikan.
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan gelar Yunani secara semantis sebagai 'Mesias', sesuai fungsi teologisnya dalam konteks ini; padanan tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: ἐγήγερται
  choice: tidak dibangkitkan
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku yang tidak dinyatakan dalam teks Yunani. Bahasa Indonesia tidak menandai aspek perfektif dengan bentuk verba khusus, dan terjemahan ini tetap menyampaikan peristiwa beserta akibatnya bagi keadaan sekarang.
- source_word: ματαία
  choice: sia-sialah
  rationale: Ungkapan ini secara alami menyampaikan bahwa iman tersebut tidak mencapai hasil atau tujuannya; partikel -lah memberi penekanan yang sesuai tanpa menjadi kaku.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini kata tersebut menunjuk pada kepercayaan orang-orang Korintus, bukan terutama kesetiaan mereka.
- source_word: ἔτι
  choice: masih
  rationale: Menunjukkan keadaan yang terus berlangsung jika Mesias tidak dibangkitkan.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: berada dalam dosa-dosa kalian
  rationale: Mempertahankan gambaran 'dalam' dosa serta bentuk jamak dosa dan pronomina orang kedua jamak dari teks Yunani.
- source_word: δὲ
  choice: Tetapi
  rationale: Menandai pertentangan dengan argumen sebelumnya.
theological_decisions:
- issue: Ungkapan kebangkitan dan pelakunya
  choice: tidak dibangkitkan
  alternative: tidak bangkit
  rationale: Terjemahan pasif mengikuti bentuk ἐγήγερται dan membiarkan pelaku kebangkitan tetap tersirat, sebagaimana dalam bahasa Yunani.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' menyatakan makna gelar itu, sedangkan bentuk tradisional 'Kristus' tetap diberikan sebagai alternatif.
- issue: Keadaan manusia jika kebangkitan tidak terjadi
  choice: masih berada dalam dosa-dosa kalian
  alternative: masih berada di bawah kuasa dosa-dosa kalian
  rationale: Terjemahan utama mempertahankan ungkapan Yunani yang ringkas dan tidak mempersempitnya hanya pada kuasa, kesalahan, atau hukuman dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk memperlihatkan bahwa pronomina Yunani berbentuk jamak. Susunan 'sia-sialah iman kalian' mempertahankan penekanan pada ματαία dengan gaya yang tetap wajar dan bermartabat.
