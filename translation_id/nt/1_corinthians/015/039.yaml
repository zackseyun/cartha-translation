  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: id
  text: Tidak semua daging itu sama, melainkan satu jenis daging ialah daging manusia, jenis lain daging hewan[a], jenis lain daging burung, dan jenis lain daging ikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ternak”.'
    reason: κτηνῶν dapat menunjuk kepada hewan secara umum dalam pengelompokan ini, tetapi juga sering digunakan secara lebih khusus untuk hewan piaraan atau ternak.
lexical_decisions:
- source_word: σὰρξ
  choice: daging
  rationale: Dalam konteks ini σάρξ menunjuk secara harfiah pada unsur jasmani makhluk hidup, bukan pada kecenderungan berdosa. “Daging” mempertahankan istilah konkret dan pengulangannya dalam bahasa Yunani.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Tidak semua daging itu sama
  rationale: Ungkapan ini menyampaikan pembedaan antarkategori dengan jelas dan wajar dalam bahasa Indonesia, tanpa mengubahnya menjadi pernyataan bahwa setiap daging sama sekali berlainan.
- source_word: ἄλλη
  choice: satu jenis ... jenis lain ... jenis lain lagi
  rationale: ἄλλη menandai perbedaan kategori. Pola “satu jenis ... jenis lain” mempertahankan susunan retorisnya dengan bahasa Indonesia yang alami.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Kata ini merujuk kepada umat manusia secara umum, bukan hanya laki-laki.
- source_word: κτηνῶν
  choice: hewan
  rationale: Dalam daftar golongan makhluk hidup ini, “hewan” merupakan padanan umum yang jelas; kemungkinan arti yang lebih khusus, “ternak”, dicatat dalam catatan kaki.
- source_word: πτηνῶν
  choice: burung
  rationale: Dalam konteks pengelompokan makhluk hidup, “burung” adalah padanan Indonesia yang paling alami bagi makhluk yang terbang.
- source_word: ἰχθύων
  choice: ikan
  rationale: “Ikan” merupakan sebutan generik yang lazim untuk kategori ini dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σάρξ dalam pembahasan Paulus tentang kebangkitan
  choice: daging dalam arti harfiah
  alternative: tubuh; tabiat berdosa
  rationale: Konteksnya membandingkan wujud jasmani berbagai makhluk ciptaan. Karena itu, makna harfiah dipertahankan dan istilah ini tidak ditafsirkan sebagai tabiat berdosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Tanda titik dua memperlihatkan bahwa daftar berikut menjelaskan pernyataan pembuka, sedangkan pengulangan “jenis lain” mempertahankan irama perbandingan dalam teks Yunani.
