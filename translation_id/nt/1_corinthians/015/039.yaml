  source_fidelity: 'Draf secara umum setia pada teks Yunani: σάρξ diterjemahkan secara harfiah sebagai “daging,” dan kategori manusia, hewan, burung, serta ikan dipertahankan. Namun, konjungsi pertentangan ἀλλά lebih baik dinyatakan secara eksplisit sebagai “melainkan,” bukan hanya diisyaratkan dengan titik dua.'
