    rationale: Bahasa Indonesia lebih alami bila kategori dinyatakan dengan “satu jenis daging ialah daging manusia,” lalu diteruskan secara paralel.
  revised_text: Tidak semua daging itu sama, melainkan satu jenis daging ialah daging manusia, jenis lain daging hewan[a], jenis lain daging burung, dan jenis lain daging ikan.
