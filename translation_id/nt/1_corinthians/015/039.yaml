  terminology: “Daging” tepat dalam konteks jasmani ini dan tidak boleh diganti dengan istilah teologis seperti “tabiat berdosa.” “Hewan” merupakan padanan umum yang tepat untuk κτηνῶν dalam daftar ini; catatan “ternak” secara memadai mencatat kemungkinan yang lebih sempit.
  issues:
