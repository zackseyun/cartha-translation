id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: id
  text: 'Sebab, sebagai hal yang terutama, aku telah menyampaikan kepadamu apa yang juga telah kuterima: bahwa Mesias[a] telah mati untuk dosa-dosa kita sesuai dengan Kitab Suci[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός dapat diterjemahkan “Mesias” apabila fungsinya sebagai gelar menonjol.
    reason: alternative_reading
  - marker: b
    text: Atau “menurut Kitab Suci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: aku telah menyampaikan
  rationale: Kata παραδίδωμι di sini menunjuk pada penerusan ajaran atau tradisi yang telah diterima. “Menyampaikan” alami dalam bahasa Indonesia dan tetap membawa gagasan transmisi yang berwibawa.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan fungsi penghubung tersebut.
- source_word: ἐν πρώτοις
  choice: sebagai hal yang terutama
  rationale: Dalam konteks ini frasa tersebut paling mungkin menyatakan keutamaan atau kepentingan pokok, bukan sekadar urutan waktu.
- source_word: ὃ καὶ παρέλαβον
  choice: apa yang juga telah kuterima
  rationale: Terjemahan ini mempertahankan kesejajaran antara menerima dan menyampaikan isi pemberitaan.
- source_word: ὅτι
  choice: yaitu bahwa
  rationale: ὅτι memperkenalkan isi yang diterima dan disampaikan; “yaitu bahwa” membuat hubungan itu jelas dan alami.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam ringkasan pengakuan iman ini. “Mesias” mempertahankan nuansa gelarnya.
- source_word: ἀπέθανεν
  choice: telah mati
  rationale: Bentuk aoristus menunjuk pada peristiwa kematian yang sudah terjadi; “telah mati” sesuai dengan konteks ringkasan peristiwa keselamatan.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: karena dosa-dosa kita
  rationale: Dalam ungkapan ini ὑπέρ menyatakan hubungan kematian Mesias dengan dosa-dosa kita. “Karena” alami dalam bahasa Indonesia dan tidak menetapkan teori penebusan yang lebih sempit daripada teks Yunani.
- source_word: κατὰ τὰς γραφάς
  choice: sesuai dengan Kitab Suci
  rationale: κατά menyatakan kesesuaian dengan kesaksian tulisan-tulisan suci. “Kitab Suci” adalah sebutan kolektif yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Terjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut memiliki daya sebagai gelar dalam rumusan pengakuan iman. “Mesias” menampilkan latar Yahudi-mesianiknya, sedangkan bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Makna ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: karena dosa-dosa kita
  alternative: demi dosa-dosa kita; untuk dosa-dosa kita
  rationale: Pilihan ini menyatakan bahwa kematian Mesias berhubungan secara menyelamatkan dengan dosa-dosa kita tanpa merinci mekanisme penebusan yang tidak dijelaskan dalam frasa ini.
- issue: Daya κατὰ τὰς γραφάς
  choice: sesuai dengan Kitab Suci
  alternative: menurut Kitab Suci
  rationale: Pilihan utama menonjolkan kesesuaian peristiwa itu dengan kesaksian Kitab Suci; alternatifnya tetap mungkin dan lebih harfiah secara tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “aku” dan enklitik “-ku” mencerminkan ujaran pribadi Paulus tanpa menjadi kaku. “Kepadamu” dapat merujuk secara kolektif kepada jemaat. Susunan kalimat mempertahankan hubungan antara apa yang Paulus terima dan yang ia sampaikan.
