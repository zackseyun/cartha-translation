  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: id
  text: Seperti manusia yang berasal dari debu, demikian juga mereka yang berasal dari debu; dan seperti manusia surgawi, demikian juga mereka yang surgawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Sebagaimana manusia yang berasal dari debu, demikian pula mereka yang berasal dari debu; dan sebagaimana manusia surgawi, demikian pula mereka yang surgawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Seperti ... demikian juga ...
  rationale: Konstruksi korelatif ini menyatakan kesesuaian antara sosok perwakilan dan orang-orang yang termasuk dalam golongannya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kesejajaran kedua klausa.
- source_word: χοϊκός
  choice: berasal dari debu
  rationale: Kata sifat ini menunjukkan bahwa seseorang berasal dari atau bercirikan debu/tanah, dengan gema pada asal-usul Adam. Ungkapan ini lebih alami daripada 'berdebu' dan tidak sekadar menyatakan penampilan.
- source_word: ὁ χοϊκός
  choice: manusia yang berasal dari debu
  rationale: Dalam konteks, bentuk tunggal ini menunjuk kepada Adam sebagai manusia perwakilan. 'Manusia' menjadikan acuannya jelas tanpa menyebut nama yang tidak terdapat dalam ayat ini.
- source_word: οἱ χοϊκοί
  choice: mereka yang berasal dari debu
  rationale: Bentuk jamak menunjuk kepada manusia yang memiliki keadaan yang bersesuaian dengan manusia dari debu; pengulangan 'berasal dari debu' menjaga kaitan leksikal.
- source_word: ἐπουράνιος
  choice: surgawi
  rationale: Kata sifat ini berarti surgawi atau termasuk dalam lingkup surga. 'Surgawi' mempertahankan sifat adjektivalnya dan tidak memasukkan redaksi 'dari surga' dari ayat sebelumnya.
- source_word: ὁ ἐπουράνιος
  choice: manusia surgawi
  rationale: Dalam konteks, bentuk tunggal ini menunjuk kepada Kristus sebagai sosok perwakilan yang dikontraskan dengan Adam. Penambahan 'manusia' membuat paralel personal kedua klausa jelas.
- source_word: οἱ ἐπουράνιοι
  choice: mereka yang surgawi
  rationale: Bentuk jamak menunjuk kepada manusia yang bersesuaian dengan manusia surgawi. Ungkapan ini mempertahankan sifat adjektival kata Yunani tanpa menafsirkannya sebagai para malaikat.
theological_decisions:
- issue: Apakah kontras Adam dan Kristus perlu dibuat eksplisit dengan menambahkan 'manusia' pada kedua bentuk tunggal
  choice: manusia yang berasal dari debu ... manusia surgawi
  alternative: dia yang berasal dari debu ... dia yang surgawi
  rationale: Konteks langsung membandingkan Adam dan Kristus sebagai sosok perwakilan. 'Manusia' memperjelas acuan personal dan mempertahankan paralelisme tanpa menyebut nama mereka secara eksplisit.
- issue: Apakah οἱ ἐπουράνιοι menunjuk kepada makhluk surgawi atau manusia yang bersesuaian dengan manusia surgawi
  choice: mereka yang surgawi
  alternative: orang-orang surgawi
  rationale: Pembahasan sekitarnya menyangkut kebangkitan manusia dan kesesuaian mereka dengan manusia surgawi, bukan para malaikat. Bentuk yang dipilih mempertahankan fokus tersebut tanpa menguraikan sifat atau waktunya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran retoris teks Yunani dipertahankan, sedangkan 'berasal dari debu' dipilih untuk menghindari kesan bahwa χοϊκός hanya berarti tertutup debu.
