id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: id
  text: Yang ditaburkan adalah tubuh alamiah; yang dibangkitkan adalah tubuh rohaniah. Jika ada tubuh alamiah[a], ada juga tubuh rohaniah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tubuh jiwani” ... “tubuh rohaniah.” Pertentangan Paulus bukan antara tubuh jasmani dan keberadaan tanpa tubuh, melainkan antara tubuh yang dihidupkan oleh kehidupan manusia biasa dan tubuh yang dihidupkan oleh Roh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: yang ditaburkan
  rationale: Mempertahankan bentuk pasif dan gambaran penaburan yang dipakai Paulus dalam konteks kematian serta kebangkitan.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan langsung dan wajar yang menunjuk pada keberadaan manusia yang bertubuh dalam kematian dan kebangkitan.
- source_word: ψυχικόν
  choice: alamiah
  rationale: Menyatakan tubuh yang ditandai oleh kehidupan manusia biasa tanpa menyiratkan bahwa tubuh itu semata-mata bersifat jasmani; padanan seperti 'jiwani' kurang jelas bagi pembaca umum.
- source_word: ἐγείρεται
  choice: yang dibangkitkan
  rationale: Padanan pasif yang lazim dan tepat dalam konteks kebangkitan.
- source_word: πνευματικόν
  choice: rohaniah
  rationale: Mempertahankan pertentangan leksikal Paulus dengan ψυχικόν. Dalam konteks ini istilah tersebut tidak berarti tidak bertubuh, tetapi tubuh yang ditandai atau dihidupkan oleh Roh.
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk bersyarat dalam bahasa Yunani tanpa mengubahnya menjadi pernyataan sebab.
- source_word: καὶ
  choice: juga
  rationale: 'Menyampaikan daya aditif: adanya tubuh alamiah disandingkan dengan adanya tubuh rohaniah.'
theological_decisions:
- issue: Arti pertentangan antara tubuh alamiah dan tubuh rohaniah
  choice: Teks utama mempertahankan pertentangan antara tubuh yang ditandai oleh kehidupan manusia biasa dan tubuh yang ditandai atau dihidupkan oleh Roh.
  alternative: Memahaminya sebagai pertentangan antara tubuh jasmani dan keberadaan yang tidak berwujud.
  rationale: Kata πνευματικόν tetap menerangkan σῶμα, sehingga 'tubuh rohaniah' tidak dengan sendirinya berarti tubuh nonmateri. Catatan kaki menjaga nuansa leksikal dan mencegah kesalahpahaman tanpa menyelesaikan lebih jauh ketegangan istilah Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan agar pertentangan retoris kedua jenis tubuh tetap jelas; 'alamiah' dipilih karena lebih mudah dipahami daripada 'jiwani', sedangkan penjelasan penting ditempatkan dalam catatan kaki.
