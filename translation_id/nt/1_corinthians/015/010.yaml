id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: id
  text: Namun, oleh anugerah Allah aku adalah sebagaimana aku ada, dan anugerah-Nya kepadaku tidak menjadi sia-sia.[a] Sebaliknya, aku telah bekerja lebih keras daripada mereka semua—tetapi bukan aku, melainkan anugerah Allah yang menyertai aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak menjadi kosong”; dapat juga berarti “tidak terbukti tanpa hasil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Namun, oleh anugerah Allah
  rationale: Dativa χάριτι dipahami secara instrumental, sedangkan δέ menyatakan kontras ringan dengan ayat sebelumnya. 'Anugerah' mempertahankan istilah teologis utama Paulus.
- source_word: εἰμι ὅ εἰμι
  choice: aku adalah sebagaimana aku ada sekarang
  rationale: Ungkapan ini menunjuk pada keadaan atau kedudukan Paulus saat ini sebagai hasil anugerah. 'Sebagaimana aku ada sekarang' terdengar alami dalam bahasa Indonesia sekaligus mempertahankan pengulangan gagasan dari bahasa Yunani.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: anugerah-Nya kepadaku
  rationale: Frasa εἰς ἐμέ menunjukkan anugerah yang diarahkan atau diberikan kepada Paulus; 'kepadaku' menyampaikan relasi itu dengan wajar.
- source_word: οὐ κενὴ ἐγενήθη
  choice: tidak menjadi sia-sia
  rationale: κενός dapat berarti kosong, tanpa hasil, atau sia-sia. Pilihan ini mempertahankan bentuk dinamis ἐγενήθη dan menyatakan bahwa anugerah tersebut tidak gagal menghasilkan buah.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Sebaliknya, aku telah bekerja lebih keras daripada mereka semua
  rationale: κοπιάω menyiratkan kerja yang berat dan melelahkan; 'bekerja lebih keras' mengungkapkan intensitas itu secara alami. 'Mereka semua' mempertahankan cakupan πάντων tanpa menentukan apakah maksudnya secara kolektif atau satu per satu.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: tetapi bukan aku, melainkan anugerah Allah
  rationale: Susunan kontras dipertahankan agar pernyataan tentang kerja nyata Paulus tetap berdampingan dengan pengakuannya akan daya kerja anugerah Allah.
- source_word: ἡ σὺν ἐμοί
  choice: yang menyertai aku
  rationale: σύν dengan dativa berarti 'bersama dengan'. 'Menyertai aku' merupakan ungkapan Indonesia yang alami dan tidak menambahkan gagasan bahwa Paulus dan Allah sekadar dua pelaku yang setara.
theological_decisions:
- issue: Hubungan antara kerja keras Paulus dan anugerah ilahi
  choice: Terjemahan menegaskan kerja keras Paulus sekaligus menyandarkan keefektifannya pada anugerah Allah yang menyertainya.
  alternative: Menjelaskan kalimat sebagai kerja sama setara antara Paulus dan Allah, atau sebaliknya meniadakan peran nyata Paulus.
  rationale: 'Teks Yunani secara tegang mempertahankan keduanya: Paulus benar-benar ''bekerja lebih keras'', namun berkata ''bukan aku, melainkan anugerah Allah''. Terjemahan tidak menyelesaikan ketegangan ini menurut sistem teologis tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti tuturan pribadi Paulus dan lazim dalam teks Alkitab Indonesia. Struktur kontras dibuat jelas tanpa menghaluskan ketegangan antara usaha manusia dan anugerah Allah.
