  to: Namun, oleh anugerah Allah aku adalah sebagaimana aku ada, dan anugerah-Nya kepadaku tidak menjadi sia-sia.[a] Sebaliknya, aku telah bekerja lebih keras daripada mereka semua—tetapi bukan aku, melainkan anugerah Allah yang menyertai aku.
