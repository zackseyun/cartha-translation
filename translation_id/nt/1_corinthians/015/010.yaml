    issue: Kata “sekarang” ditambahkan pada “aku adalah sebagaimana aku ada sekarang.”
    rationale: Teks Yunani hanya menyatakan “aku adalah apa/sebagaimana aku ada” (εἰμι ὅ εἰμι), tanpa penanda waktu “sekarang.” Tambahan itu aman secara konteks luas, tetapi tidak diperlukan dan sedikit mempersempit cakupan ungkapan.
