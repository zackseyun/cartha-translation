id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: id
  text: Saudara-saudara[a], aku menyatakan kepada kalian kabar baik yang telah kuberitakan kepada kalian, yang juga telah kalian terima dan yang di dalamnya kalian tetap berdiri teguh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saudara-saudari.” Bahasa Yunani memakai bentuk maskulin “saudara-saudara,” yang sering digunakan untuk menyapa seluruh komunitas orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: aku menyatakan kepada kalian
  rationale: Verba kini aktif ini berarti membuat sesuatu diketahui atau memberitahukan. “Menyatakan kepada kalian” mempertahankan arti langsungnya dan tidak mengubahnya menjadi sekadar “mengingatkan”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan. Dalam bahasa Indonesia, peralihan tersebut sudah alami tanpa kata penghubung tambahan; “sekarang” akan memberi kesan waktu yang tidak dinyatakan sumber.
- source_word: ἀδελφοί
  choice: Saudara-saudara[a]
  rationale: Sapaan maskulin jamak dipertahankan dengan bentuk sapaan Indonesia yang lazim, sementara cakupannya yang mungkin meliputi seluruh jemaat dijelaskan dalam catatan kaki.
- source_word: τὸ εὐαγγέλιον
  choice: kabar baik
  rationale: Ungkapan ini menyampaikan arti leksikal εὐαγγέλιον secara jelas dan mudah dipahami tanpa bergantung pada istilah gerejawi “Injil”.
- source_word: εὐηγγελισάμην
  choice: telah kuberitakan
  rationale: Bentuk aoristus ini menunjuk pada tindakan memberitakan kabar baik yang telah dilakukan Paulus. “Memberitakan” alami dalam bahasa Indonesia dan mempertahankan hubungan makna dengan “kabar baik”.
- source_word: παρελάβετε
  choice: telah kalian terima
  rationale: Kata ini merujuk pada penerimaan berita atau tradisi; “menerima” mempertahankan keluasan maknanya tanpa menambahkan nuansa subjektif “menerima dengan percaya”.
- source_word: ἐν ᾧ
  choice: yang di dalamnya
  rationale: Frasa ini merujuk kembali kepada kabar baik sebagai ranah atau dasar tempat jemaat berdiri, tanpa mengantisipasi hubungan sarana dalam ayat berikutnya.
- source_word: ἑστήκατε
  choice: kalian tetap berdiri teguh
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil tindakan sebelumnya. “Tetap berdiri teguh” menyampaikan keadaan yang berlanjut dan merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam sapaan kepada jemaat campuran
  choice: Saudara-saudara dalam teks utama, dengan catatan inklusif
  alternative: Saudara-saudari; sesama saudara seiman
  rationale: Bentuk maskulin sumber dipertahankan dalam sapaan utama, sedangkan kemungkinan bahwa Paulus menyapa seluruh jemaat, termasuk perempuan, dijelaskan tanpa menghapus bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku/kalian” dipakai agar pembedaan tunggal-jamak sumber tetap jelas dan tutur surat tetap langsung. Susunan klausa relatif dipertahankan sejauh tetap alami dalam bahasa Indonesia.
