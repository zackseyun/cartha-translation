id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: id
  text: Dan yang kautaburkan bukanlah tubuh yang kelak akan ada, melainkan hanya sebutir biji[a]—mungkin biji gandum atau salah satu jenis biji lainnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: sebutir biji yang telanjang, atau sebutir biji yang polos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεις
  choice: kautaburkan
  rationale: Kata ini mempertahankan gambaran pertanian tentang menabur benih dan kesinambungannya dengan pembahasan Paulus.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan baku ini penting dalam konteks pembahasan Paulus tentang kebangkitan tubuh dan tidak mempersempit maknanya menjadi sekadar bentuk tanaman.
- source_word: τὸ γενησόμενον
  choice: yang kelak akan ada
  rationale: Ungkapan ini menyatakan keberadaan pada masa depan tanpa menafsirkan prosesnya secara khusus sebagai pertumbuhan tanaman.
- source_word: γυμνὸν κόκκον
  choice: hanya sebutir biji
  rationale: Secara harfiah berarti biji yang telanjang atau polos. Dalam bahasa Indonesia, 'hanya sebutir biji' menyampaikan bahwa yang ditabur belum memiliki tubuh yang kelak ada, dengan ungkapan yang alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: εἰ τύχοι
  choice: mungkin
  rationale: Idiom ini memperkenalkan contoh yang tidak dibatasi secara mutlak; 'mungkin' ringkas dan alami.
- source_word: σίτου
  choice: biji gandum
  rationale: Dalam konteks ini σῖτος paling wajar menunjuk secara khusus kepada gandum.
- source_word: τινος τῶν λοιπῶν
  choice: salah satu jenis biji lainnya
  rationale: Padanan ini menyatakan satu anggota dari berbagai jenis benih lain dan memperjelas acuan implisit frasa Yunani.
theological_decisions:
- issue: Hubungan antara benih dan tubuh kebangkitan
  choice: Mempertahankan istilah 'tubuh' dan orientasi masa depan tanpa menjelaskan metafora lebih jauh.
  alternative: Menerjemahkannya secara dinamis sebagai 'tanaman yang kelak tumbuh'.
  rationale: Ayat ini memakai analogi pertanian untuk menggambarkan kesinambungan sekaligus perubahan, tetapi tidak menjabarkan seluruh doktrin kebangkitan. Terjemahan mempertahankan ketegangan metaforis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. Bentuk 'kautaburkan' mempertahankan sapaan orang kedua tunggal yang tersirat dalam verba Yunani; tanda pisah memperkenalkan contoh gandum secara jelas.
