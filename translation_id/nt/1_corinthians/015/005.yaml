  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: id
  text: dan bahwa Ia menampakkan diri kepada Kefas[a][b], kemudian kepada kedua belas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia dilihat oleh Kefas.” Kata kerja Yunani berbentuk pasif, tetapi dalam konteks penampakan sesudah kebangkitan lazim diterjemahkan “menampakkan diri.”'
    reason: lexical_alternative
  - marker: b
    text: Kefas adalah nama Aram yang sepadan dengan Petrus.
    reason: cross_reference
  - marker: c
    text: “Kedua belas” merupakan sebutan tetap bagi kelompok rasul Yesus, meskipun jumlah anggotanya tidak selalu tepat dua belas pada setiap saat.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Bentuk aoris pasif dari ὁράω dalam konteks penampakan sesudah kebangkitan lazim menyatakan bahwa seseorang 'menampakkan diri'. Ungkapan ini alami dalam bahasa Indonesia dan tetap membuka alternatif formal 'dilihat' melalui catatan kaki.
- source_word: Κηφᾷ
  choice: Kefas
  rationale: Nama Yunani Κηφᾶς dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, tanpa menggantinya dengan nama padanannya, Petrus.
- source_word: εἶτα
  choice: kemudian
  rationale: Menandai urutan dalam tradisi yang sedang dikutip Paulus; 'kemudian' ringkas dan alami.
- source_word: τοῖς δώδεκα
  choice: kedua belas rasul
  rationale: Ungkapan ini merupakan sebutan tetap bagi lingkaran rasul Yesus. Penambahan 'rasul' membuat rujukannya jelas dan alami bagi pembaca Indonesia tanpa mengubah kelompok yang dimaksud.
- source_word: καὶ ὅτι
  choice: dan bahwa
  rationale: Mempertahankan kesinambungan rangkaian klausa isi dari ayat-ayat sebelumnya.
theological_decisions:
- issue: Bahasa penampakan sesudah kebangkitan
  choice: Ia menampakkan diri
  alternative: Ia dilihat
  rationale: '''Menampakkan diri'' menyampaikan penggunaan idiomatis verba pasif Yunani dalam konteks kebangkitan tanpa menjelaskan lebih jauh cara penampakan itu terjadi; alternatif formal dicatat.'
- issue: Sebutan 'kedua belas' setelah Yudas tidak lagi bersama kelompok itu
  choice: kedua belas rasul
  alternative: kesebelas rasul
  rationale: Teks Yunani mempertahankan sebutan kelompok τοῖς δώδεκα. Terjemahan tidak menyelaraskannya dengan rekonstruksi jumlah anggota kelompok pada saat itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Huruf kapital pada 'Ia' mengikuti kebiasaan penghormatan yang luas dalam penerbitan Alkitab Indonesia. Penanda catatan ditempatkan langsung setelah unsur yang dijelaskan.
