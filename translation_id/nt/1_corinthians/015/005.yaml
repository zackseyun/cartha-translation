  terminology: “Kefas” tepat mempertahankan bentuk nama Yunani/Aram yang dipakai teks, dan “menampakkan diri” adalah padanan Indonesia yang alami untuk ὤφθη dalam konteks ini. Sebutan “kedua belas” perlu dipertahankan tanpa tambahan “rasul”; catatan kaki dapat menjelaskan bahwa ini adalah sebutan tetap.
