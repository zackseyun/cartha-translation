id: 1CO.15.6
reference: 1 Corinthians 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: id
  text: Kemudian Ia menampakkan diri kepada lebih dari lima ratus saudara sekaligus[a]. Sebagian besar dari mereka masih hidup sampai sekarang, tetapi beberapa telah tertidur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari.” Teks Yunani memakai kata “saudara,” yang dalam pemakaian Kristen mula-mula kadang-kadang dapat mengacu kepada komunitas orang percaya yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Artinya, mereka telah meninggal. Paulus memakai ungkapan “tertidur,” suatu ungkapan Kristen mula-mula yang lazim untuk kematian dalam terang harapan akan kebangkitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Kemudian
  rationale: Menandai urutan berikutnya dalam daftar penampakan Kristus secara ringkas dan wajar.
- source_word: ὤφθη
  choice: Ia menampakkan diri
  rationale: Dalam konteks penampakan sesudah kebangkitan, bentuk ini secara idiomatis menyatakan bahwa Kristus menampakkan diri; subjeknya tersirat dari konteks sebelumnya.
- source_word: ἐπάνω πεντακοσίοις
  choice: kepada lebih dari lima ratus
  rationale: ἐπάνω bersama bilangan berarti 'lebih dari' atau 'di atas jumlah' tersebut.
- source_word: ἀδελφοῖς
  choice: saudara
  rationale: Mempertahankan bentuk maskulin Yunani tanpa memakai istilah Indonesia yang usang; dalam pemakaian jemaat mula-mula, kata ini dapat mencakup komunitas orang percaya secara lebih luas, yang dijelaskan dalam catatan kaki.
- source_word: ἐφάπαξ
  choice: sekaligus
  rationale: Menyatakan bahwa penampakan itu terjadi kepada kelompok besar tersebut pada kesempatan yang sama.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: Sebagian besar dari mereka
  rationale: Mengungkapkan makna partitif dan arti substantival οἱ πλείονες secara alami dalam bahasa Indonesia.
- source_word: μένουσιν ἕως ἄρτι
  choice: masih hidup sampai sekarang
  rationale: Secara harfiah μένουσιν berarti 'tetap/masih ada', tetapi kontras dengan mereka yang telah tertidur menunjukkan bahwa yang dimaksud ialah masih hidup pada waktu Paulus menulis.
- source_word: τινὲς δὲ
  choice: tetapi beberapa
  rationale: δέ memberi kontras ringan antara mayoritas yang masih hidup dan sebagian yang telah meninggal.
- source_word: ἐκοιμήθησαν
  choice: telah tertidur
  rationale: Mempertahankan metafora tidur bagi kematian, yang penting dalam konteks pembahasan kebangkitan.
theological_decisions:
- issue: Cakupan ἀδελφοῖς dalam kelompok yang mungkin mencakup laki-laki dan perempuan
  choice: saudara
  alternative: saudara-saudari
  rationale: Teks utama mempertahankan bentuk maskulin sumber, sedangkan kemungkinan cakupan komunitas orang percaya yang lebih luas dicatat agar ambiguitas referennya tidak dihapus.
- issue: Metafora ἐκοιμήθησαν dalam konteks kebangkitan
  choice: telah tertidur
  alternative: telah meninggal
  rationale: Metafora Paulus dipertahankan karena beresonansi dengan harapan kebangkitan; maknanya dijelaskan dalam catatan kaki tanpa meratakan bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Ia' dipakai untuk rujukan kepada Kristus sesuai konteks. Susunan dua kalimat menghindari kalimat yang terlalu panjang, sedangkan 'sekaligus' secara alami menyampaikan simultanitas.
