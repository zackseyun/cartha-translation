  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani dengan tepat: urutan temporal (ἔπειτα), penampakan Kristus (ὤφθη), jumlah yang melebihi lima ratus, kelompok saudara, keserempakan penampakan (ἐφάπαξ), mayoritas yang masih hidup pada saat Paulus menulis, dan sebagian yang telah ''tertidur.'''
