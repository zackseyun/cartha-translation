id: 1CO.15.36
reference: 1 Corinthians 15:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: id
  text: Hai orang bodoh![a] Apa yang kautabur tidak dihidupkan[b] jika tidak mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hai orang yang tidak berakal!”
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Hai orang bodoh!
  rationale: Sapaan langsung ini mempertahankan daya vokatif dan teguran tajam Paulus. Partikel “hai” membuat fungsi sapaan jelas dalam bahasa Indonesia, sedangkan “orang bodoh” lebih wajar daripada bentuk substantif “bodoh” saja.
- source_word: σὺ
  choice: tersirat dalam bentuk kau- pada “kautabur”
  rationale: Pronomina Yunani ini bersifat tegas. Bahasa Indonesia dapat mempertahankan orang kedua secara alami melalui bentuk “kautabur”; penambahan “engkau” secara terpisah akan terasa kaku dalam kalimat ini.
- source_word: ὃ σπείρεις
  choice: apa yang kautabur
  rationale: Pilihan ini alami dan tetap mempertahankan metafora pertanian serta makna verba menabur.
- source_word: ζῳοποιεῖται
  choice: tidak dihidupkan
  rationale: Bentuk pasif Yunani dipertahankan dan kaitannya dengan tindakan memberi hidup tetap terbuka tanpa menentukan pelakunya secara eksplisit.
- source_word: ἐὰν μὴ
  choice: jika tidak
  rationale: Ungkapan ini mengikuti struktur syarat Yunani secara jelas dan alami. “Kecuali jika” juga mungkin, tetapi sedikit lebih berat.
- source_word: ἀποθάνῃ
  choice: mati
  rationale: Bentuk sederhana ini tepat untuk syarat umum dalam perumpamaan benih dan tidak menambahkan gagasan “lebih dahulu” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Hubungan metaforis antara kematian benih dan kehidupan kebangkitan
  choice: Mempertahankan metafora pertanian tanpa menguraikannya menjadi rumusan doktrinal tambahan.
  alternative: Menerjemahkan secara lebih eksplisit sebagai pernyataan langsung tentang kebangkitan tubuh.
  rationale: Ayat ini menggunakan gambaran benih untuk menjawab keberatan mengenai kebangkitan. Terjemahan mempertahankan gambaran dan ketegangan teologis teks tanpa menambahkan penjelasan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Teguran dibuat tajam sesuai teks, tetapi tidak dibuat lebih kasar. Klitika “kau-” dipakai untuk sapaan langsung yang ringkas dan alami; bentuk pasif “dihidupkan” mempertahankan struktur serta kemungkinan nuansa ilahi dalam verba Yunani.
