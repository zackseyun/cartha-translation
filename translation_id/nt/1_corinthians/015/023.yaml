  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: id
  text: 'Namun, masing-masing menurut urutannya sendiri: Sang Mesias[a] sebagai buah sulung, kemudian mereka yang menjadi milik Sang Mesias pada saat kedatangan-Nya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός berarti “Yang Diurapi.”
    reason: alternative_reading
  - marker: b
    text: Atau “kehadiran” atau “ketibaan.” Dalam konteks ini, παρουσία menunjuk pada kedatangan-Nya kelak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Bentuk distributif ini merujuk pada setiap pihak dalam urutan kebangkitan yang sedang dijelaskan; “masing-masing” alami dan ringkas dalam bahasa Indonesia.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: menurut urutannya sendiri
  rationale: τάγμα dapat berarti susunan, barisan, atau urutan yang ditetapkan. Konteks menekankan urutan kebangkitan, sehingga “urutan” menghindari nuansa militer yang tidak perlu.
- source_word: ἀπαρχὴ
  choice: buah sulung
  rationale: Istilah ini mempertahankan gambaran bagian pertama hasil panen yang dipersembahkan dan sekaligus mengisyaratkan hasil berikutnya.
- source_word: Χριστός
  choice: Sang Mesias
  rationale: Χριστός di sini menonjol sebagai gelar, “Yang Diurapi.” “Sang Mesias” menyampaikan fungsi gelar itu secara alami dan khidmat dalam bahasa Indonesia.
- source_word: οἱ τοῦ Χριστοῦ
  choice: mereka yang menjadi milik Sang Mesias
  rationale: Genitif ini menyatakan kepunyaan atau keterikatan. Frasa tersebut jelas dalam bahasa Indonesia dan mempertahankan daya relasionalnya.
- source_word: παρουσίᾳ
  choice: kedatangan
  rationale: Dalam konteks eskatologis Paulus, παρουσία menunjuk pada kedatangan Sang Mesias kelak. “Kedatangan” jelas tanpa menambahkan rincian doktrinal di luar teks.
theological_decisions:
- issue: Pemadanan Χριστός sebagai gelar mesianik
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam susunan ini, Χριστός tampil sebagai tokoh pertama dalam urutan kebangkitan dan fungsi gelarnya terasa kuat. Catatan kaki tetap menyediakan padanan tradisional “Kristus” dan menjelaskan makna gelarnya.
- issue: Hubungan ἀπαρχὴ Χριστός
  choice: Sang Mesias sebagai buah sulung
  alternative: Sang Mesias, buah sulung
  rationale: “Sebagai” membuat hubungan predikatif-apposisionalnya mudah dipahami dalam bahasa Indonesia tanpa mengubah Sang Mesias menjadi sekadar pembanding.
- issue: Makna eskatologis παρουσία
  choice: kedatangan
  alternative: kehadiran atau ketibaan
  rationale: “Kedatangan” paling alami untuk peristiwa mendatang dalam konteks ini, sementara catatan kaki mempertahankan rentang leksikal kata Yunaninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Sang” dipakai untuk menandai Mesias sebagai gelar, sedangkan “-Nya” ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
