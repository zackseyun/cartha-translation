  source_fidelity: Terjemahan mempertahankan daya komparatif Οὕτως καὶ, genitif dalam “kebangkitan orang mati,” serta paralel pasif σπείρεται/ἐγείρεται melalui “ditaburkan/dibangkitkan.” Kontras φθορά dan ἀφθαρσία tersampaikan secara tepat sebagai keadaan dapat binasa dan tidak dapat binasa, tanpa menambahkan penafsiran tentang tubuh atau agen yang membangkitkan.
  naturalness: Bahasa Indonesia baku, jelas, dan ritmis. Frasa “dalam keadaan dapat binasa ... dalam keadaan tidak dapat binasa” agak eksplikatif, tetapi tetap alami dalam register kitab suci modern dan dengan baik menyatakan kualitas abstrak yang dimaksud teks Yunani.
  terminology: “Kebangkitan orang mati” dan “dibangkitkan” adalah istilah yang lazim dan tepat. “Dapat binasa/tidak dapat binasa” secara semantis akurat untuk φθορά/ἀφθαρσία. Catatan kaki menyediakan alternatif nominal “kefanaan ... ketidakfanaan” tanpa mengubah makna utama.
