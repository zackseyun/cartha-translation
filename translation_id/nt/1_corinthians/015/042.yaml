id: 1CO.15.42
reference: 1 Corinthians 15:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: id
  text: 'Demikian pula kebangkitan orang mati: ditaburkan dalam keadaan dapat binasa[a], dibangkitkan dalam keadaan tidak dapat binasa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kefanaan ... dalam ketidakfanaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Demikian pula
  rationale: Menghubungkan pernyataan ini dengan perumpamaan benih sebelumnya serta mempertahankan daya komparatif dan penyimpulannya secara ringkas dan alami.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: kebangkitan orang mati
  rationale: Mencerminkan konstruksi genitif Yunani dan memakai ungkapan Indonesia yang lazim tanpa menggeser maknanya menjadi sekadar kebangkitan dari antara orang mati.
- source_word: σπείρεται
  choice: ditaburkan
  rationale: Mempertahankan bentuk pasif dan gambaran pertanian tentang benih. Subjek tidak ditambahkan supaya kesinambungan metaforis dan keimplisitan teks Yunani tetap terjaga.
- source_word: ἐν φθορᾷ
  choice: dalam keadaan dapat binasa
  rationale: Mengungkapkan sifat tubuh sekarang yang dapat rusak, membusuk, dan binasa dengan bahasa Indonesia modern; bukan membatasinya hanya pada proses pembusukan.
- source_word: ἐγείρεται
  choice: dibangkitkan
  rationale: Mempertahankan bentuk pasif yang penting dalam konteks kebangkitan dan membentuk kesejajaran langsung dengan 'ditaburkan'.
- source_word: ἐν ἀφθαρσίᾳ
  choice: dalam keadaan tidak dapat binasa
  rationale: Mempertahankan pertentangan langsung dengan φθορά sambil memakai ungkapan Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Sifat kebangkitan dalam pertentangan Paulus
  choice: Mempertahankan metafora penaburan dan pembangkitan dengan kedua kata kerja berbentuk pasif, tanpa menyisipkan subjek secara eksplisit.
  alternative: Menjelaskan secara dinamis sebagai 'tubuh dikuburkan ... tubuh dibangkitkan' atau menafsirkannya terutama sebagai perubahan moral.
  rationale: Konteks membahas kebangkitan tubuh melalui perumpamaan benih. Terjemahan ini menjaga kesinambungan sekaligus perubahan antara keadaan yang dapat binasa dan yang tidak dapat binasa, tanpa mengubah metafora atau mempersempit rujukan implisitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dibuat ringkas untuk mencerminkan ritme Yunani. Tanda [a] ditempatkan sesudah ungkapan pertama, sementara catatannya mencakup kedua istilah yang berlawanan.
