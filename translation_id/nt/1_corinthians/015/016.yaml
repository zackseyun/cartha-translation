  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: id
  text: Sebab, jika orang mati tidak dibangkitkan, bahkan Mesias[a] pun tidak dibangkitkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau, secara tradisional, “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, jika
  rationale: Mempertahankan fungsi γάρ sebagai penghubung penjelas dalam alur argumen Paulus dan εἰ sebagai penanda syarat, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: νεκροὶ
  choice: orang mati
  rationale: Adjektiva jamak ini dipakai secara substantival dan menunjuk kepada orang-orang yang telah mati secara umum.
- source_word: οὐκ ἐγείρονται
  choice: tidak dibangkitkan
  rationale: Bentuk kini pasif menyatakan penyangkalan umum terhadap kebangkitan orang mati; bentuk pasif dipertahankan tanpa menentukan pelaku yang tidak disebutkan dalam ayat.
- source_word: οὐδὲ
  choice: pun tidak
  rationale: 'Ungkapan ini menyampaikan akibat yang ditekankan: jika orang mati tidak dibangkitkan, Mesias juga—bahkan Mesias sendiri—tidak dibangkitkan.'
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός adalah gelar yang berarti Yang Diurapi; 'Mesias' mempertahankan fungsi gelarnya dalam argumen teologis ini. Padanan tradisional 'Kristus' dicantumkan dalam catatan kaki.
- source_word: ἐγήγερται
  choice: tidak dibangkitkan
  rationale: Bentuk perfekt pasif menunjuk pada tindakan yang telah terjadi beserta hasilnya yang tetap. Dalam konstruksi negatif bahasa Indonesia, terjemahan ini alami dan tetap mempertahankan bentuk pasif, meskipun nuansa perfekt tidak dapat dinyatakan sepenuhnya tanpa tambahan yang berpotensi mengubah makna.
theological_decisions:
- issue: Penerjemahan gelar Χριστός dalam argumen tentang kebangkitan
  choice: Mesias
  alternative: Kristus
  rationale: Konteks tetap mendukung makna gelar 'Yang Diurapi'. 'Mesias' membuat makna tersebut transparan, sedangkan 'Kristus' adalah bentuk tradisional yang sah dan karena itu disediakan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan paralel mempertahankan logika kondisional Paulus. Partikel 'pun' memberi penekanan alami pada konsekuensi tanpa menambahkan kata 'maka' yang tidak dinyatakan secara eksplisit dalam teks Yunani.
