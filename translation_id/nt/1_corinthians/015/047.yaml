id: 1CO.15.47
reference: 1 Corinthians 15:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: id
  text: Manusia pertama berasal dari bumi, terbuat dari debu[a]; manusia kedua berasal dari surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersifat debu” atau “dari debu”. Kata Yunani χοϊκός menggemakan penciptaan Adam dari debu tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: pertama
  rationale: Kata bilangan bertingkat ini menandai anggota pertama dalam kontras Adam dan Kristus; “pertama” merupakan padanan Indonesia yang alami.
- source_word: ἄνθρωπος
  choice: manusia
  rationale: Dalam kedua klausa, kata ini menunjuk secara representatif kepada Adam dan kemudian kepada Kristus. Pengulangan “manusia” mempertahankan paralelisme yang disengaja.
- source_word: ἐκ γῆς
  choice: berasal dari bumi
  rationale: ἐκ dengan γῆ menyatakan sumber atau asal. “Berasal dari bumi” alami dalam bahasa Indonesia dan mempertahankan gema kisah penciptaan.
- source_word: χοϊκός
  choice: terbuat dari debu
  rationale: Kata sifat ini berarti berbahan debu atau bersifat debu dan menggemakan pembentukan Adam dari debu. Ungkapan ini lebih jelas daripada padanan harfiah yang dapat terdengar tidak alami.
- source_word: δεύτερος
  choice: kedua
  rationale: Kata bilangan bertingkat ini mempertahankan kontras formal dengan “pertama”.
- source_word: ἐξ οὐρανοῦ
  choice: berasal dari surga
  rationale: Frasa ini menyatakan asal surgawi. “Surga” mempertahankan makna transenden yang dimaksud dalam konteks, bukan sekadar langit fisik.
theological_decisions:
- issue: Daya kristologis ungkapan “manusia kedua”
  choice: Mempertahankan “manusia kedua” tanpa menambahkan nama Kristus.
  alternative: “Manusia kedua, yaitu Kristus, berasal dari surga.”
  rationale: Konteks mengidentifikasi manusia kedua sebagai Kristus, tetapi ayat Yunani ini tidak menyebut nama-Nya. Terjemahan mempertahankan tipologi Adam–Kristus tanpa menambahkan penjelasan ke dalam teks.
- issue: Waktu pada klausa kedua
  choice: “berasal dari surga” sebagai pernyataan kini yang tidak ditandai secara eksplisit dalam bahasa Indonesia.
  alternative: “berasal dari surga” dapat dipahami secara simetris sebagai pernyataan asal tanpa penekanan waktu.
  rationale: Bahasa Yunani tidak mencantumkan kopula pada kedua klausa. Bahasa Indonesia tidak mengharuskan kata “adalah”, sehingga konstruksi ini mempertahankan elipsis dan tidak memaksakan perbedaan kala yang tidak dinyatakan secara morfologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme “manusia pertama … manusia kedua” dipertahankan, sementara “terbuat dari debu” menjelaskan χοϊκός secara alami tanpa menghilangkan gema Kejadian.
