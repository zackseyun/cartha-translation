  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: id
  text: Berjaga-jagalah, berdirilah teguh dalam iman, bersikaplah berani[a], dan jadilah kuat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bertindaklah sebagai laki-laki”; ungkapan Yunani ini secara idiomatis berarti bersikap berani atau gagah.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hendaklah kalian dikuatkan.” Bentuk kata Yunani ini pasif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Berjaga-jagalah
  rationale: Imperatif kini jamak dari γρηγορέω menyerukan kewaspadaan yang terus-menerus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran berjaga.
- source_word: στήκετε
  choice: berdirilah teguh
  rationale: στήκω dalam konteks ini menyatakan keteguhan dan ketabahan, bukan sekadar posisi tubuh.
- source_word: ἐν τῇ πίστει
  choice: dalam iman
  rationale: Frasa ini menyatakan ranah tempat pembaca harus tetap teguh. Bahasa Indonesia tidak memakai artikel seperti bahasa Yunani, sehingga 'dalam iman' secara alami dapat merujuk pada iman yang dianut bersama tanpa mempersempit maknanya secara berlebihan.
- source_word: ἀνδρίζεσθε
  choice: bersikaplah berani
  rationale: Kata kerja ini secara harfiah memakai gambaran bertindak sebagai laki-laki, tetapi sebagai idiom menyerukan keberanian. Terjemahan utama menyampaikan daya imperatifnya secara wajar, sedangkan gambaran gender dalam sumber dipertahankan dalam catatan kaki.
- source_word: κραταιοῦσθε
  choice: jadilah kuat
  rationale: Bentuk imperatif kini pasif ini menyerukan kekuatan. 'Jadilah kuat' singkat dan alami dalam rangkaian perintah, sementara kemungkinan nuansa pasif dinyatakan dalam catatan kaki.
theological_decisions:
- issue: Makna πίστις dalam ἐν τῇ πίστει
  choice: dalam iman
  alternative: dalam kepercayaan itu / dalam ajaran iman
  rationale: Adanya artikel Yunani dapat menunjuk pada iman Kristen yang dianut bersama, tetapi bahasa Indonesia tidak memerlukan kata penentu. 'Dalam iman' mempertahankan kemungkinan antara sikap percaya dan iman sebagai keyakinan bersama tanpa memasukkan rumusan doktrinal yang lebih sempit.
- issue: Gambaran gender dalam ἀνδρίζεσθε
  choice: bersikaplah berani
  alternative: bertindaklah sebagai laki-laki
  rationale: Dalam pemakaian idiomatis, seruan ini ditujukan kepada seluruh jemaat dan menekankan keberanian. Ungkapan harfiah Indonesia mudah disalahpahami sebagai pembatasan kepada laki-laki; karena itu gambaran sumber dijelaskan dalam catatan kaki, bukan dihilangkan.
- issue: Bentuk pasif κραταιοῦσθε
  choice: jadilah kuat
  alternative: hendaklah kalian dikuatkan
  rationale: Bentuk Yunani dapat menonjolkan penerimaan kekuatan, tetapi ungkapan imperatif idiomatis juga dapat dipahami sebagai 'jadilah kuat'. Catatan kaki mempertahankan ketegangan antara kedua nuansa itu tanpa menentukan pelaku yang menguatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan berwibawa. Rangkaian imperatif dipertahankan dengan bentuk -lah. Kata 'dan' sebelum perintah terakhir memberi aliran yang alami tanpa mengubah hubungan antarklausa.
