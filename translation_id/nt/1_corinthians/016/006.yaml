  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: id
  text: Mungkin saya akan tinggal bersama kalian, atau bahkan melewatkan musim dingin bersama kalian, supaya kalian dapat membantu saya melanjutkan perjalanan[a] ke mana pun saya pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengantar saya melanjutkan perjalanan.” Kata Yunani yang dipakai dapat mencakup tindakan menemani atau memberikan bekal dan bantuan kepada orang yang hendak melanjutkan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: bersama kalian
  rationale: Dengan kata kerja yang berarti tinggal, πρός dengan akusatif menyatakan keberadaan bersama orang-orang yang disapa; bentuk ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ berfungsi sebagai penghubung ringan dalam kelanjutan rencana perjalanan Paulus; alur bahasa Indonesia sudah jelas tanpa konjungsi eksplisit.
- source_word: τυχὸν
  choice: mungkin
  rationale: Bentuk ini menyatakan kemungkinan atau ketidakpastian dan secara ringkas terwakili oleh 'mungkin'.
- source_word: παραμενῶ
  choice: saya akan tinggal beberapa waktu
  rationale: παραμένω berarti tetap tinggal; tambahan 'beberapa waktu' menyampaikan nuansa tinggal lebih lama dalam konteks rencana kunjungan tanpa menentukan durasi.
- source_word: ἢ καὶ
  choice: atau bahkan
  rationale: 'Gabungan ini meningkatkan kemungkinan kedua: bukan sekadar tinggal, melainkan melewatkan seluruh musim dingin.'
- source_word: παραχειμάσω
  choice: melewatkan musim dingin di sana
  rationale: Kata kerja ini secara khusus berarti menjalani atau menghabiskan musim dingin di suatu tempat; 'di sana' merujuk secara alami kepada tempat para penerima surat.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan tujuan dan diterjemahkan secara alami dengan 'supaya'.
- source_word: προπέμψητε
  choice: kalian dapat membantu saya melanjutkan perjalanan
  rationale: Dalam konteks perjalanan, προπέμπω dapat mencakup mengantar, membekali, atau memberi bantuan bagi tahap perjalanan berikutnya; pilihan ini menjaga keluasan maknanya.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: ke mana pun saya pergi
  rationale: Konstruksi relatif dengan ἐάν dan subjungtif menyatakan tujuan yang belum ditentukan; 'ke mana pun' mempertahankan ketidakpastian itu.
