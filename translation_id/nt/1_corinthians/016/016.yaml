lexical_decisions:
- source_word: ἵνα
  choice: hendaklah
  rationale: Dalam ketergantungannya pada seruan ayat sebelumnya, ἵνα memperkenalkan isi permintaan Paulus. Bentuk ajakan “hendaklah” alami dalam bahasa Indonesia dan mempertahankan daya dorong seruan itu.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: Menandai bahwa jemaat Korintus pun harus memberikan tanggapan demikian.
- source_word: ὑποτάσσησθε
  choice: tunduk
  rationale: Menyatakan tindakan menempatkan diri di bawah kepemimpinan atau tatanan yang diakui; “tunduk” mempertahankan kekuatan istilah tanpa menambahkan gagasan ketaatan mutlak.
- source_word: τοῖς τοιούτοις
  choice: kepada orang-orang seperti mereka
  rationale: Merujuk pada orang-orang sejenis keluarga Stefanus yang mengabdikan diri untuk pelayanan, tanpa membatasi rujukannya pada laki-laki.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: kepada setiap orang yang turut bekerja
  rationale: Mempertahankan bentuk verbal dan nuansa bekerja bersama orang lain, tanpa menentukan rekan atau objek kerja yang tidak disebutkan secara eksplisit.
- source_word: καὶ κοπιῶντι
  choice: dan berjerih lelah
  rationale: Mengungkapkan kerja keras yang melelahkan, lebih kuat daripada sekadar “bekerja” dan tetap wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat ketundukan yang diperintahkan
  choice: Seruan untuk dengan sukarela tunduk kepada para pekerja Kristen seperti mereka yang baru disebutkan.
  alternative: Perintah umum untuk menaati suatu hierarki secara mutlak.
  rationale: Konteks langsung membahas keluarga Stefanus dan semua orang yang ikut bekerja serta berjerih lelah. Terjemahan ini mempertahankan kekuatan perintah tanpa memasukkan klaim kelembagaan atau ketundukan mutlak yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berjerih lelah” dipakai untuk membedakan κοπιῶντι dari συνεργοῦντι serta menyampaikan unsur kerja yang berat.
