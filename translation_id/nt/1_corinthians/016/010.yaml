revisions:
- from: Jika Timotius datang, pastikanlah agar ia dapat berada di tengah-tengah kamu tanpa rasa takut,[a] sebab ia mengerjakan pekerjaan Tuhan, seperti aku juga.
  to: Jika Timotius datang, pastikanlah supaya ia berada bersama kamu tanpa rasa takut,[a] sebab ia mengerjakan pekerjaan Tuhan,[b] sama seperti aku.
  rationale: Revisi mengganti ungkapan lokatif yang terlalu spesifik dengan “bersama kamu,” yang lebih dekat dengan πρὸς ὑμᾶς, serta memakai tujuan yang alami untuk ἵνα ... γένηται. Catatan [a] kini memuat alternatif lokatif tersebut. Catatan [b] ditambahkan untuk mencerminkan alternatif leksikal dalam jejak audit Inggris. “Sama seperti aku” mempertahankan elipsis ὡς κἀγώ secara wajar dalam bahasa Indonesia.
