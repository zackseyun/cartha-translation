  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: id
  text: Jika Timotius datang, pastikanlah supaya ia berada bersama kamu tanpa rasa takut,[a] sebab ia mengerjakan pekerjaan Tuhan,[b] sama seperti aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berada di antara kamu tanpa rasa takut.” Ungkapan Yunani dapat menekankan keberadaan Timotius di antara mereka dalam keadaan bebas dari rasa takut.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab ia melakukan pekerjaan Tuhan, sama seperti aku juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: Jika
  rationale: ἐάν menyatakan syarat yang mungkin terjadi pada masa mendatang. Partikel δέ menandai peralihan ringan; dalam bahasa Indonesia konteks sudah cukup menyampaikan peralihan itu tanpa harus menambahkan “tetapi”.
- source_word: ἔλθῃ Τιμόθεος
  choice: Timotius datang
  rationale: Bentuk aoris subjungtif sesudah ἐάν menyatakan kemungkinan kedatangan Timotius; “datang” merupakan ungkapan Indonesia yang alami.
- source_word: βλέπετε ἵνα
  choice: pastikanlah agar
  rationale: Imperatif ini meminta jemaat mengambil tindakan dan perhatian nyata supaya keadaan yang disebut berikutnya terwujud.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: ia dapat berada di tengah-tengah kamu tanpa rasa takut
  rationale: Terjemahan ini mempertahankan unsur keberadaan Timotius dalam hubungannya dengan jemaat dan keadaan bebas dari rasa takut, tanpa mempersempit maknanya menjadi sekadar perasaan aman.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: ia mengerjakan pekerjaan Tuhan
  rationale: Ungkapan ini mempertahankan pengulangan serumpun antara ἔργον dan ἐργάζεται serta menyatakan kegiatan pelayanan yang sedang berlangsung.
- source_word: ὡς κἀγώ
  choice: seperti aku juga
  rationale: κἀγώ berarti “aku juga.” Ungkapan eliptis dalam bahasa Yunani dipertahankan secara alami dalam bahasa Indonesia tanpa mengulang seluruh klausa sebelumnya.
theological_decisions:
- issue: Rujukan κυρίου
  choice: Tuhan
  alternative: menyebut secara eksplisit “Tuhan Yesus”
  rationale: Dalam pemakaian Paulus, rujukannya sangat mungkin Tuhan Yesus, tetapi teks Yunani hanya berbunyi “Tuhan.” Terjemahan tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “kamu” mengikuti sapaan jamak kepada jemaat; susunan kalimat menjaga nada pastoral sekaligus tuntutan aktif Paulus kepada mereka.
