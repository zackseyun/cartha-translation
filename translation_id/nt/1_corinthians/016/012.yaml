  verdict: revise
  source_fidelity: Ungkapan "sudah berkali-kali mendesaknya" membatasi πολλά pada pengulangan tindakan. Dalam konstruksi ini, πολλά terutama menyatakan intensitas desakan; "sangat mendesaknya" mempertahankan daya tekan itu tanpa menyatakan frekuensi yang tidak perlu. Selebihnya, subjek kehendak dipahami tepat sebagai Apolos, dan "apabila mendapat kesempatan" menyampaikan εὐκαιρήσῃ dengan baik.
  naturalness: Teks ini umumnya baku dan lancar. "Sangat mendesaknya" lebih ringkas dan idiomatis daripada "sudah berkali-kali mendesaknya," sambil tetap sesuai dengan gaya surat Paulus.
  terminology: '"Apolos," "saudara kita," "saudara-saudara itu," dan "berkehendak" sesuai register Kristen-baku. Catatan a dengan tepat memberi tahu pembaca bahwa possessiva "kita" tidak tersurat dalam Yunani. Catatan b mempertahankan alternatif yang dekat dengan bentuk nominal θέλημα.'
  issues:
