reference: 1 Corinthians 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: id
  text: Mengenai Apolos, saudara kita[a], aku sangat mendesaknya agar datang kepadamu bersama saudara-saudara itu. Namun, ia sama sekali tidak berkehendak untuk datang sekarang[b]. Ia akan datang apabila mendapat kesempatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saudara itu.” Bahasa Yunani tidak memakai kata ganti kepunyaan “kita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ia sama sekali tidak bersedia datang sekarang.” Secara lebih harfiah: “sama sekali bukan kehendaknya untuk datang sekarang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Menandai peralihan kepada pokok baru secara alami tanpa menambahkan kata temporal yang tidak terdapat di sini.
- source_word: τοῦ ἀδελφοῦ
  choice: saudara kita
  rationale: Secara harfiah berbunyi 'saudara itu' tanpa pronomina posesif, tetapi dalam konteks sapaan antarsesama orang percaya, 'saudara kita' lebih alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: πολλὰ παρεκάλεσα
  choice: aku sudah berkali-kali mendesaknya
  rationale: πολλά memperkuat tindakan mendesak dan dapat menunjukkan desakan yang sungguh-sungguh atau berulang; pilihan ini menyampaikan intensitas secara wajar.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: bersama saudara-saudara itu
  rationale: Artikel Yunani menunjuk kepada sekelompok saudara tertentu, kemungkinan rekan laki-laki yang akan bepergian.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: Namun, ia sama sekali tidak berkehendak
  rationale: Mempertahankan penegasan πάντως dan gagasan kehendak dalam θέλημα, sambil mengungkapkannya secara alami dalam bahasa Indonesia.
- source_word: ὅταν εὐκαιρήσῃ
  choice: apabila mendapat kesempatan
  rationale: Mengungkapkan adanya waktu atau kesempatan yang sesuai tanpa memberi kesan bahwa hal itu sekadar soal kenyamanan pribadi.
theological_decisions:
- issue: Subjek dan makna οὐκ ἦν θέλημα
  choice: Klausa ini menunjuk pada kehendak Apolos sendiri.
  alternative: Saat itu bukan kehendak Allah agar Apolos datang.
  rationale: Apolos adalah rujukan terdekat dan paling alami. Konteks tidak menyatakan adanya larangan atau keputusan ilahi, sehingga gagasan tersebut tidak dimasukkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada surat yang lugas dan bermartabat. Kata ganti 'aku' dipakai untuk suara pribadi Paulus, sedangkan 'kepadamu' mewakili bentuk jamak Yunani secara alami dalam bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
