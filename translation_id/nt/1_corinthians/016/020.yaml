  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: id
  text: Semua saudara seiman menyampaikan salam kepada kalian.[a] Hendaklah kalian saling memberi salam dengan cium kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua saudara”; kata Yunani yang dipakai dapat merujuk secara kolektif kepada saudara-saudari seiman.
    reason: lexical_alternative
  - marker: b
    text: Cium kudus merupakan kebiasaan memberi salam di antara orang percaya, sebagai tanda persekutuan yang kudus dan penuh kasih.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: menyampaikan salam
  rationale: Dalam konteks penutup surat, verba ini berarti menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan subjek yang tidak hadir bersama para penerima.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: semua saudara seiman
  rationale: ἀδελφοί berbentuk maskulin jamak, tetapi dalam konteks jemaat dapat merujuk secara kolektif kepada sesama orang percaya. 'Saudara seiman' mempertahankan citra kekerabatan rohani tanpa menyiratkan hanya saudara kandung.
- source_word: ἀσπάσασθε
  choice: hendaklah ... memberi salam
  rationale: Bentuk imperatif diterjemahkan sebagai perintah yang jelas dan wajar. 'Memberi salam' juga cocok dengan tindakan langsung di antara anggota jemaat.
- source_word: ἀλλήλους
  choice: saling
  rationale: '''Saling'' merupakan padanan timbal balik yang ringkas dan alami untuk ἀλλήλους.'
- source_word: ἐν φιλήματι ἁγίῳ
  choice: dengan cium kudus
  rationale: Frasa ini menyatakan cara memberi salam dan mempertahankan tindakan fisik serta sifatnya yang kudus. 'Cium kudus' adalah ungkapan Alkitabiah yang tetap jelas dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam konteks jemaat
  choice: saudara seiman
  alternative: saudara-saudara laki-laki; saudara-saudari seiman
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dapat mencakup seluruh persekutuan orang percaya. Teks utama memakai ungkapan yang tidak menutup kemungkinan cakupan campuran, sementara ambiguitas leksikal dijelaskan dalam catatan.
- issue: Makna kekudusan pada φιλήματι ἁγίῳ
  choice: cium kudus
  alternative: ciuman suci
  rationale: Terjemahan ini mempertahankan hubungan langsung antara tindakan salam dan sifat kudusnya tanpa mengubahnya menjadi perintah denominatif atau ritual tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kalian' dipakai untuk menampilkan bentuk jamak ὑμᾶς secara jelas. Struktur kedua kalimat dibuat alami tanpa menghilangkan pengulangan verba salam dalam bahasa Yunani.
