id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: id
  text: Jemaat-jemaat di Asia menyampaikan salam kepada kalian.[a] Akwila dan Priska, bersama dengan jemaat di rumah mereka, menyampaikan salam hangat kepada kalian dalam Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” di sini adalah provinsi Romawi di bagian barat Asia Kecil, bukan benua Asia modern.
    reason: cultural_note
  - marker: b
    text: Teks Yunani memakai nama “Priska”; di bagian lain ia juga disebut “Priskila” (misalnya Kis. 18:2, 18, 26; Rm. 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: menyampaikan salam
  rationale: Dalam konteks salam penutup surat, ἀσπάζομαι secara alami berarti menyampaikan salam kepada penerima; pilihan ini juga menghindari kesan perjumpaan langsung yang dapat timbul dari 'menyalami'.
- source_word: αἱ ἐκκλησίαι
  choice: jemaat-jemaat
  rationale: Dalam pemakaian Paulus, ἐκκλησία menunjuk pada persekutuan atau jemaat Kristen setempat. Bentuk ulang menyatakan jamak secara jelas dan wajar dalam bahasa Indonesia.
- source_word: τῆς Ἀσίας
  choice: di Asia
  rationale: Genitif ini menyatakan lokasi jemaat-jemaat tersebut. 'Di Asia' lebih alami daripada 'dari Asia', sementara nama 'Asia' dipertahankan dan cakupan provinsi Romawinya dijelaskan dalam catatan kaki.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Ungkapan Paulus ini dipertahankan secara dekat agar nuansa persekutuan dan ranah relasi Kristen tidak dipersempit atau dijelaskan secara berlebihan.
- source_word: πολλὰ
  choice: dengan hangat
  rationale: Sebagai akusatif adverbial yang menguatkan ἀσπάζεται, πολλὰ menyatakan kuat atau hangatnya salam, bukan banyaknya salam secara harfiah.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Akwila dan Priska
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; Πρίσκα diterjemahkan sesuai bentuk pendek yang benar-benar terdapat dalam ayat ini.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: bersama dengan jemaat di rumah mereka
  rationale: Terjemahan ini dekat dengan struktur Yunani dan secara alami menunjuk pada jemaat yang berkumpul di rumah mereka tanpa menambahkan kata kerja yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna ἐκκλησία dalam lingkungan rumah
  choice: '''jemaat di rumah mereka'' menunjuk pada jemaat Kristen setempat yang berkumpul di rumah Akwila dan Priska'
  alternative: '''jemaat rumah tangga mereka'' sebagai sebutan yang lebih institusional atau hanya keluarga mereka'
  rationale: Dalam pemakaian Paulus, frasa ini paling wajar menunjuk pada persekutuan orang percaya yang berkumpul di sebuah rumah, bukan semata-mata anggota keluarga.
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam ungkapan khas Paulus ἐν κυρίῳ, 'Tuhan' mempertahankan daya pengakuan iman dan relasionalnya tanpa mempersempit rujukan melampaui teks.
- issue: Keterkaitan ἐν κυρίῳ dengan salam
  choice: mempertahankan urutan 'menyampaikan salam hangat ... dalam Tuhan'
  alternative: menafsirkan menjadi 'sebagai sesama orang percaya kepada Tuhan'
  rationale: Bentuk yang dipilih menjaga ambiguitas wajar mengenai apakah frasa tersebut terutama menerangkan tindakan memberi salam atau hubungan persekutuan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk menyatakan ὑμᾶς dengan jelas. 'Jemaat' dipilih daripada 'gereja' karena konteksnya menunjuk pada kelompok orang percaya, khususnya persekutuan yang berada di sebuah rumah.
