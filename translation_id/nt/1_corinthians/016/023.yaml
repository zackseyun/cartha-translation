  text: The grace of the Lord Jesus be with you.
translation:
  language: id
  text: Kiranya anugerah Tuhan Yesus menyertai kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam berkat penutup Paulus, χάρις menunjuk pada kemurahan dan berkat yang diberikan secara cuma-cuma. “Anugerah” merupakan padanan baku, berbobot teologis, dan tetap alami dalam bahasa Indonesia.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” mempertahankan fungsi gelar κύριος dan daya kristologisnya dalam ungkapan “Tuhan Yesus”; “tuan” kurang tepat dalam konteks berkat ini.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Nama pribadi ini dialihaksarakan menurut bentuk yang telah baku dalam bahasa Indonesia.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kalian
  rationale: Frasa ini secara harfiah berarti “bersama kalian”. Dalam formula berkat yang tanpa verba, “menyertai kalian” menyampaikan maksud idiomatisnya secara wajar dan jelas.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Genitif Yunani dipertahankan melalui susunan nomina bahasa Indonesia “anugerah Tuhan Yesus”, yang dapat menyatakan bahwa anugerah itu milik atau berasal dari Tuhan Yesus tanpa mempersempit relasinya.
theological_decisions:
- issue: Formula berkat eliptis tanpa verba eksplisit
  choice: Menggunakan “Kiranya ... menyertai kalian.”
  alternative: “Anugerah Tuhan Yesus bersama kalian.”
  rationale: Bahasa Yunani tidak mencantumkan verba, tetapi formula ini berfungsi sebagai doa atau berkat. “Kiranya” dan “menyertai” menyatakan daya optatif yang tersirat secara alami dalam bahasa Indonesia tanpa menambahkan isi teologis.
- issue: Cakupan pronomina jamak ὑμῶν
  choice: “kalian”
  alternative: “kamu” atau “saudara-saudara”
  rationale: ὑμῶν berbentuk jamak dan ditujukan kepada komunitas. “Kalian” menandai kejamakan secara jelas dan langsung; “saudara-saudara” menambahkan sapaan kekerabatan yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Bentuk “Kiranya ... menyertai” dipilih sebagai ungkapan berkat yang alami, sedangkan “kalian” menjaga kejamakan pronomina sumber secara eksplisit.
