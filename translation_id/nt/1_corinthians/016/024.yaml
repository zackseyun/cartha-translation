  source_fidelity: 'Teks Indonesia secara setia mencerminkan Yunani: ἡ ἀγάπη μου = “Kasihku”; μετὰ πάντων ὑμῶν = “menyertai kamu semua”; dan ἐν Χριστῷ Ἰησοῦ = “dalam Mesias Yesus.” Ungkapan Yunani tanpa verba diperlakukan sebagai harapan/berkat penutup tanpa menambahkan klaim waktu atau aspek yang tidak ada dalam sumber.'
