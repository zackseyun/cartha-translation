  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: id
  text: Kasihku menyertai kamu semua dalam Mesias Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.” Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau dialihaksarakan dalam bentuk tradisional “Kristus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: kasihku
  rationale: Menyatakan kasih pribadi Paulus kepada para penerima; bentuk posesif Indonesia ini alami dan ringkas.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: Bahasa Yunani tidak memiliki verba tersurat. Dalam salam penutup bernada harapan, 'menyertai' secara alami mengungkapkan makna kehadiran yang tersirat oleh μετά dan mencakup seluruh jemaat.
- source_word: ἐν
  choice: dalam
  rationale: Mempertahankan ungkapan khas Paulus tentang lingkup atau kesatuan dengan Mesias tanpa mempersempit maknanya.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός tetap membawa arti gelar, sehingga diterjemahkan sebagai 'Mesias', sedangkan Ἰησοῦ ditransliterasikan sebagai nama 'Yesus'.
theological_decisions:
- issue: Cara menerjemahkan Χριστός dalam rumusan penutup ἐν Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Terjemahan 'Mesias' membuat arti gelar Χριστός transparan, sementara bentuk tradisional 'Kristus Yesus' tetap dicatat sebagai alternatif.
- issue: Verba yang disiratkan dalam kalimat penutup tanpa verba
  choice: menyertai
  alternative: ada bersama
  rationale: Teks Yunani tidak menyatakan verba. 'Menyertai' menghasilkan ungkapan harapan penutup yang wajar dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan faktual eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, hangat, dan bermartabat. Susunan mempertahankan nada berkat penutup serta cakupan 'kamu semua'.
