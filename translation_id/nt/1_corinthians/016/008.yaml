  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: id
  text: Namun, saya akan tinggal di Efesus sampai Pentakosta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai Hari Raya Tujuh Minggu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: saya akan tinggal
  rationale: Bentuk futur aktif ἐπιμένω dalam konteks rencana perjalanan menyatakan bahwa Paulus akan tetap berada di suatu tempat selama jangka waktu tertentu. “Akan tinggal” alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa kontras ringan terhadap rencana perjalanan sebelumnya. “Namun” mempertahankan hubungan tersebut tanpa memberi kesan pertentangan yang terlalu tajam.
- source_word: ἐν Ἐφέσῳ
  choice: di Efesus
  rationale: ἐν dengan datif di sini bersifat lokatif; nama kota ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: sampai hari Pentakosta
  rationale: ἕως dengan genitif menunjukkan batas waktu. “Hari Pentakosta” adalah sebutan yang mapan dan mudah dipahami dalam konteks Perjanjian Baru.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Kata ganti “saya” sesuai dengan tuturan pribadi Paulus; “Namun” menyampaikan kontras ringan, sedangkan sebutan kalender Yahudi yang lebih eksplisit dipertahankan dalam catatan kaki.
