  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: id
  text: Aku bersukacita atas kedatangan Stefanus, Fortunatus, dan Akhaikus, sebab mereka telah melengkapi apa yang kurang dari pihak kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka telah menggantikan ketidakhadiran kalian.” Kemungkinan besar Paulus memaksudkan bahwa jemaat Korintus tidak dapat hadir secara langsung bersamanya, bukan bahwa mereka memiliki kekurangan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: aku bersukacita
  rationale: Mempertahankan ungkapan pribadi dalam bentuk kini serta nada surat Paulus; lebih luhur daripada 'aku senang' tanpa menjadi tidak alami.
- source_word: δὲ
  choice: Namun
  rationale: δέ merupakan penghubung ringan yang dalam konteks dapat memberi nuansa peralihan atau kontras lembut; 'Namun' alami setelah pembahasan sebelumnya.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: atas kedatangan
  rationale: παρουσία di sini menunjuk pada kedatangan atau kehadiran pribadi ketiga orang tersebut, bukan makna eskatologis teknis.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Stefanus, Fortunatus, dan Akhaikus
  rationale: Nama-nama ditransliterasikan menurut bentuk yang wajar dalam tradisi dan ejaan bahasa Indonesia.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan Paulus bersukacita dan cocok dengan ragam surat yang bermartabat.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: apa yang kurang dari pihak kalian
  rationale: Mempertahankan keluasan makna harfiah ὑστέρημα sebagai sesuatu yang kurang tanpa mempersempitnya secara pasti menjadi ketidakhadiran.
- source_word: οὗτοι
  choice: mereka
  rationale: Rujukannya jelas kepada tiga orang yang baru disebut; bahasa Indonesia tidak memerlukan pengulangan 'orang-orang ini' untuk menjaga penekanan.
- source_word: ἀνεπλήρωσαν
  choice: telah melengkapi
  rationale: Menyampaikan tindakan memenuhi atau melengkapi kekurangan, sambil tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kekurangan jemaat Korintus
  choice: Dibiarkan sebagai 'apa yang kurang dari pihak kalian'
  alternative: Menafsirkannya secara khusus sebagai ketidakhadiran mereka
  rationale: Bahasa Yunani tidak secara eksplisit menyebut ketidakhadiran. Konteks mendukung kemungkinan itu, tetapi terjemahan utama sebaiknya mempertahankan ambiguitas dan tidak menyiratkan kekurangan moral.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Kata ganti 'aku/kalian' mengikuti kedekatan nada surat pribadi Paulus; struktur kalimat tetap cukup dekat dengan bahasa Yunani sambil mempertahankan ambiguitas penting pada ὑστέρημα.
