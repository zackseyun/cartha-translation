  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: id
  text: 'Aku mendesak kalian, Saudara-saudara[a]: kalian mengenal seisi rumah Stefanas. Mereka adalah buah sulung Akhaya[b] dan telah mengabdikan diri untuk melayani orang-orang kudus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; kata Yunani secara harfiah berbentuk “saudara-saudara” dan lazim dipakai sebagai sapaan yang dapat mencakup seluruh jemaat.
    reason: lexical_alternative
  - marker: b
    text: “Buah sulung” kemungkinan menunjuk kepada orang-orang percaya yang paling awal di Akhaya, sekaligus mempertahankan gambaran tentang bagian pertama yang dikhususkan bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: aku memohon kepada kalian
  rationale: Menyampaikan permohonan yang sungguh-sungguh dan mendesak tanpa terdengar kaku; pronomina jamak eksplisit menjaga sasaran ujaran.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dalam wacana. Di sini 'Namun' menghubungkan permohonan ini dengan konteks sebelumnya tanpa memberi nuansa pertentangan yang terlalu kuat.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia yang wajar dan bermartabat; bentuk ini dapat dipakai kepada jemaat secara kolektif, sementara cakupan yang mungkin mencakup laki-laki dan perempuan dijelaskan dalam catatan kaki.
- source_word: οἴδατε τὴν οἰκίαν Στεφανᾶ
  choice: kalian mengenal seisi rumah Stefanas
  rationale: οἰκία menunjuk pada rumah tangga, bukan bangunannya saja. 'Seisi rumah' alami dalam bahasa Indonesia dan mencakup unit sosial yang lebih luas daripada keluarga sedarah.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: buah sulung Akhaya
  rationale: Mempertahankan metafora ἀπαρχή beserta kemungkinan nuansa sebagai bagian pertama yang dikhususkan bagi Allah, tanpa menyempitkannya menjadi sekadar petobat pertama.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: untuk melayani orang-orang kudus
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia daripada 'untuk pelayanan', tetap menyampaikan pengabdian kepada pelayanan bagi umat Allah, dan tidak mengimpor jabatan gerejawi tertentu.
- source_word: ἔταξαν ἑαυτούς
  choice: telah mengabdikan diri
  rationale: Menunjukkan tindakan sengaja menempatkan diri pada suatu tugas dan komitmen yang berkelanjutan, bukan pengangkatan resmi.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Teks utama mempertahankan bentuk sapaan maskulin sumber sejauh wajar dalam bahasa Indonesia, sementara kemungkinan bahwa sapaan itu mencakup seluruh jemaat dinyatakan dalam catatan kaki.
- issue: Makna ἀπαρχὴ τῆς Ἀχαΐας
  choice: buah sulung Akhaya
  alternative: orang-orang pertama yang percaya di Akhaya
  rationale: Metafora sumber dipertahankan agar nuansa temporal dan kemungkinan nuansa pengkhususan bagi Allah tidak diselesaikan secara sepihak.
- issue: Kesepadanan kolektif οἰκία dengan predikat berikutnya
  choice: Mereka adalah ... dan telah mengabdikan diri
  alternative: Rumah tangga itu adalah ... dan telah mengabdikan dirinya
  rationale: Referen tunggal secara gramatikal dipahami sebagai kelompok orang. Bentuk jamak alami dalam bahasa Indonesia dan sesuai dengan ἑαυτούς yang jamak, tanpa mengubah rumah tangga itu menjadi hanya satu individu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, sungguh-sungguh, dan bermartabat. 'Aku/kalian' mengikuti relasi surat yang langsung dan membedakan tunggal-jamak. Nama tempat ditransliterasikan sebagai 'Akhaya', dan istilah Paulus 'orang-orang kudus' dipertahankan.
