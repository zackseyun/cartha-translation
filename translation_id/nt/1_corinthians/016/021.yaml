- source_word: Ὁ ἀσπασμός
  choice: Salam ini
  rationale: Frasa ini secara alami menyatakan salam yang sedang disampaikan; bahasa Indonesia memerlukan penunjuk “ini” untuk menangkap fungsi definit artikel Yunani dalam konteks.
- source_word: τῇ ἐμῇ χειρί
  choice: kutulis dengan tanganku sendiri
  rationale: Secara harfiah berarti “dengan tanganku sendiri.” Kata “kutulis” dibuat eksplisit dari konteks surat agar ungkapannya alami dan maksudnya jelas dalam bahasa Indonesia.
- source_word: Παύλου
  choice: Paulus
  rationale: Bentuk genitif ini mengidentifikasi tangan atau salam itu sebagai milik Paulus; tanda pisah mempertahankan gaya tanda tangan singkat pada akhir surat.
