id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: id
  text: Karena itu, jangan seorang pun meremehkan dia. Namun, bantulah dia melanjutkan perjalanannya dengan damai agar dia dapat datang kepadaku, sebab aku sedang menantikan dia bersama saudara-saudara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” dapat berarti sesama orang percaya atau rekan pelayanan, termasuk laki-laki dan perempuan. Frasa Yunani juga dapat dipahami bahwa Paulus menanti bersama saudara-saudara itu, atau bahwa ia menantikan Timotius beserta mereka.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: μή τις οὖν
  choice: Karena itu, jangan seorang pun
  rationale: μή dengan subjungtif aoris menyatakan larangan, sedangkan οὖν menunjukkan kesimpulan dari nasihat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kaitan logisnya.
- source_word: ἐξουθενήσῃ
  choice: meremehkan
  rationale: Kata kerja ini berarti menganggap seseorang tidak berarti atau memandangnya rendah. “Meremehkan” jelas, kuat, dan wajar dalam konteks kemungkinan Timotius dipandang rendah.
- source_word: προπέμψατε
  choice: bantulah dia melanjutkan perjalanannya
  rationale: Kata ini dalam konteks perjalanan dapat mencakup mengantar atau menyediakan bantuan agar seseorang dapat meneruskan perjalanan, bukan sekadar menyuruhnya pergi.
- source_word: ἐν εἰρήνῃ
  choice: dengan damai
  rationale: Mempertahankan gagasan keberangkatan yang damai, tanpa pertentangan atau hambatan, serta dengan dukungan jemaat.
- source_word: ἵνα ἔλθῃ πρός με
  choice: agar dia dapat datang kepadaku
  rationale: ἵνα dengan subjungtif menyatakan tujuan; “agar” menyampaikan hubungan tujuan itu secara alami.
- source_word: ἐκδέχομαι
  choice: aku sedang menantikan
  rationale: Bentuk kini menyampaikan penantian atau pengharapan yang sedang berlangsung.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: bersama saudara-saudara
  rationale: ἀδελφῶν berbentuk jamak maskulin, tetapi dalam pemakaian Kristen dapat merujuk kepada sesama orang percaya atau rekan pelayanan, termasuk kelompok campuran. Bahasa Indonesia “saudara-saudara” mempertahankan keluasan rujukan tanpa memaksakan jenis kelamin yang tidak dinyatakan pasti oleh konteks.
theological_decisions:
- issue: Cakupan ἀδελφῶν dan hubungan frasa μετὰ τῶν ἀδελφῶν
  choice: bersama saudara-saudara
  alternative: bersama saudara-saudara seiman, baik laki-laki maupun perempuan; atau menantikan dia beserta saudara-saudara
  rationale: Teks Yunani tidak memastikan apakah kelompok itu hanya laki-laki, dan susunan frasanya juga dapat dipahami sebagai saudara-saudara yang ikut menanti bersama Paulus atau orang-orang yang dinantikan bersama Timotius. Terjemahan utama mempertahankan ketaksaan tersebut dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bantulah dia melanjutkan perjalanannya” dipilih untuk menyampaikan unsur bantuan perjalanan dalam προπέμψατε; “dengan damai” mempertahankan ungkapan sumber tanpa terdengar kaku.
