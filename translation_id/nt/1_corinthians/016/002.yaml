  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: id
  text: Pada hari pertama setiap minggu[a], hendaklah setiap orang di antara kamu menyisihkan sesuatu dan menyimpannya sendiri[b], sesuai dengan keberhasilannya[c], agar ketika aku datang nanti pengumpulan dana tidak perlu dilakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada hari pertama minggu itu.” Ungkapan Yunani ini di sini bersifat distributif dan menunjukkan kebiasaan yang dilakukan setiap minggu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada sisinya sendiri” atau “bersama dirinya sendiri.” Ini dapat berarti bahwa setiap orang harus menyisihkan uang itu secara pribadi, mungkin di rumah.
    reason: lexical_alternative
  - marker: c
    text: Atau “sesuai dengan kemakmuran yang diperolehnya” atau “sesuai dengan apa yang berhasil diperolehnya.” Maksudnya, setiap orang menyisihkan menurut keadaan keberhasilannya atau kemakmurannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Pada hari pertama setiap minggu
  rationale: Konstruksi κατά dengan bentuk akusatif bersifat distributif dan dalam konteks ini menunjukkan praktik yang dilakukan secara teratur setiap minggu.
- source_word: ἕκαστος ὑμῶν
  choice: kamu masing-masing
  rationale: Ungkapan distributif ini menerapkan perintah kepada setiap orang dalam jemaat.
- source_word: παρ’ ἑαυτῷ
  choice: pada dirinya sendiri
  rationale: Terjemahan ini mempertahankan unsur bahwa masing-masing orang menyisihkan dana secara pribadi tanpa memastikan apakah tempatnya di rumah atau dalam suatu penyimpanan bersama.
- source_word: τιθέτω θησαυρίζων
  choice: hendaklah ... menyisihkan ... dan menyimpannya
  rationale: Imperatif kini menyatakan tindakan yang berulang, sedangkan partisip θησαυρίζων menunjukkan bahwa yang disisihkan itu dikumpulkan atau disimpan dari waktu ke waktu.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: sesuai dengan berkat yang diperolehnya
  rationale: Klausa tak tentu ini mengaitkan jumlah yang disisihkan dengan tingkat keberhasilan atau kemakmuran yang diterima seseorang, tanpa membatasinya secara sempit pada penghasilan.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: supaya jangan ada pengumpulan sumbangan ketika aku datang
  rationale: Klausa tujuan menjelaskan bahwa penyisihan mingguan dimaksudkan untuk mencegah pengumpulan dana secara mendadak pada saat Paulus tiba.
