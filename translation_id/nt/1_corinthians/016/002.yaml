revisions:
- from: Pada hari pertama setiap minggu[a], hendaklah kamu masing-masing menyisihkan sesuatu pada dirinya sendiri[b] dan menyimpannya, sesuai dengan berkat yang diperolehnya[c], supaya jangan ada pengumpulan sumbangan ketika aku datang.
  to: Pada hari pertama setiap minggu[a], hendaklah setiap orang di antara kamu menyisihkan sesuatu dan menyimpannya sendiri[b], sesuai dengan keberhasilannya[c], agar ketika aku datang nanti pengumpulan dana tidak perlu dilakukan.
  rationale: Revisi mengganti ungkapan yang tidak alami dan berpotensi ambigu dalam bahasa Indonesia, serta menghapus tambahan interpretatif “berkat materi.” Terjemahan tetap mempertahankan ambiguitas παρ’ ἑαυτῷ mengenai lokasi atau sifat pribadi penyimpanan, dan menyampaikan ukuran pemberian yang bergantung pada keberhasilan/kemakmuran seseorang tanpa membatasinya pada penghasilan tertentu.
