base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: id
  text: Sebab mereka telah menyegarkan rohku dan roh kalian. Karena itu, berilah penghargaan kepada orang-orang seperti mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akuilah” atau “hargailah orang-orang seperti mereka.” Bentuk Yunaninya maskulin dan di sini secara khusus menunjuk kepada laki-laki yang baru disebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: telah menyegarkan
  rationale: Kata ini dipakai secara metaforis untuk kelegaan dan pembaruan batin, bukan istirahat jasmani. 'Menyegarkan' alami dalam bahasa Indonesia dan mempertahankan gambaran sumber.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan bagi pernyataan atau pujian sebelumnya; 'sebab' mempertahankan hubungan penjelasannya.
- source_word: πνεῦμα
  choice: roh
  rationale: Dalam konteks ini kata tersebut menunjuk pada keadaan batin manusia, bukan Roh Kudus. 'Roh' mempertahankan ungkapan khas Paulus tanpa menafsirkan secara berlebihan.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: rohku dan roh kalian
  rationale: Nomina 'roh' yang dilesapkan pada bagian kedua diperjelas dalam bahasa Indonesia. 'Kalian' menandai bahwa kata ganti Yunani itu jamak.
- source_word: ἐπιγινώσκετε
  choice: berilah penghargaan
  rationale: Dalam konteks seruan ini, kata tersebut menuntut pengakuan yang semestinya, bukan sekadar mengenali identitas. Pilihan ini menyampaikan penghargaan tanpa menaikkannya menjadi penghormatan formal.
- source_word: οὖν
  choice: Karena itu
  rationale: Ungkapan ini secara alami menandai kesimpulan atau seruan yang ditarik dari alasan sebelumnya.
- source_word: τοὺς τοιούτους
  choice: orang-orang seperti mereka
  rationale: Frasa ini menunjuk kepada Stefanus, Fortunatus, dan Akhaikus yang baru disebut. Bahasa Indonesia tidak menandai gender gramatikal pada 'orang-orang'; rujukan khusus kepada para laki-laki tersebut tetap jelas dari konteks dan dijelaskan dalam catatan.
theological_decisions:
- issue: Rujukan gender pada τοὺς τοιούτους
  choice: orang-orang seperti mereka
  alternative: laki-laki seperti mereka
  rationale: Bentuk Yunani maskulin dan konteks menunjuk khusus kepada tiga laki-laki yang baru disebut. Namun, 'orang-orang seperti mereka' lebih wajar dan bermartabat dalam bahasa Indonesia, tanpa mengubah rujukan kontekstual; catatan mempertahankan informasi gender sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Rohku dan roh kalian' mempertahankan kekompakan serta ketegangan ungkapan Paulus, sedangkan 'kalian' memperjelas bentuk jamak.
