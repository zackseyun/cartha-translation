id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: id
  text: Sebab aku tidak ingin bertemu dengan kalian sekarang hanya sambil lalu[a]. Aku berharap dapat tinggal bersama kalian selama beberapa waktu, jika Tuhan mengizinkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika sedang lewat” atau “sekadar singgah dalam perjalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: aku tidak ingin
  rationale: Dalam konteks ini θέλω menyatakan keinginan atau niat Paulus. “Tidak ingin” alami dalam bahasa Indonesia dan mempertahankan sifat personal ungkapan itu.
- source_word: ἄρτι
  choice: sekarang
  rationale: Ἄρτι menunjuk pada waktu atau keadaan saat ini; “sekarang” merupakan padanan yang ringkas dan wajar.
- source_word: ἐν παρόδῳ
  choice: hanya sambil lalu
  rationale: Ungkapan ini menggambarkan pertemuan singkat ketika sedang dalam perjalanan, bukan kunjungan yang cukup lama. Kata “hanya” memperjelas pertentangannya dengan harapan Paulus untuk tinggal selama beberapa waktu.
- source_word: ἰδεῖν
  choice: bertemu dengan
  rationale: Secara harfiah berarti “melihat”, tetapi dalam konteks perjalanan dan kebersamaan, maksudnya ialah bertemu atau berkunjung. “Bertemu dengan” menyampaikan makna kontekstual secara alami tanpa memperluasnya menjadi kunjungan resmi.
- source_word: ἐλπίζω
  choice: aku berharap
  rationale: Kata ini menyatakan harapan atau pengharapan tanpa menjadikannya kepastian.
- source_word: χρόνον τινά
  choice: selama beberapa waktu
  rationale: Frasa ini menunjuk pada jangka waktu yang tidak ditentukan tetapi cukup berarti; “selama beberapa waktu” mempertahankan ketidakpastian itu.
- source_word: ἐπιμεῖναι
  choice: tinggal
  rationale: Ἐπιμένω berarti tetap berada atau tinggal. “Tinggal” paling alami untuk keberadaan Paulus bersama jemaat selama suatu jangka waktu.
- source_word: πρὸς ὑμᾶς
  choice: bersama kalian
  rationale: Dengan kata kerja yang berarti tinggal, πρὸς dengan orang menyatakan berada dalam kebersamaan mereka.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: jika Tuhan mengizinkan
  rationale: Padanan ini mempertahankan syarat yang menyatakan ketergantungan rencana Paulus pada izin Tuhan.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku untuk κύριος dalam konteks ilahi dan tidak menentukan referennya lebih jauh daripada teks Yunani.
theological_decisions:
- issue: Referen ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks Yunani hanya menyebut ὁ κύριος tanpa menjelaskan apakah yang dimaksud secara khusus ialah Tuhan Yesus atau Allah. Terjemahan mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pronomina “aku” dan “kalian” mempertahankan sifat personal surat serta bentuk jamak ὑμᾶς. Dua kalimat dipakai agar rangkaian alasan dan harapan terdengar alami, sementara “Sebab” tetap menghubungkan ayat ini dengan konteks sebelumnya.
