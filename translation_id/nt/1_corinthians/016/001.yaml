id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: id
  text: Mengenai pengumpulan dana bagi orang-orang kudus[a], lakukanlah juga seperti yang telah kuperintahkan kepada jemaat-jemaat di Galatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “umat Allah.”
    reason: Alternatif ini menyampaikan fungsi ἅγιοι sebagai sebutan bagi umat percaya dan menghindari kemungkinan salah paham modern terhadap istilah “orang-orang kudus”.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Memperkenalkan topik baru secara alami dalam bahasa Indonesia; δέ berfungsi sebagai penanda peralihan dan tidak perlu diterjemahkan dengan kata temporal seperti “sekarang”.
- source_word: λογείας
  choice: pengumpulan dana
  rationale: Menunjukkan kegiatan menghimpun uang secara jelas dan alami tanpa mengkhususkannya sebagai persembahan ritual.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: bagi orang-orang kudus
  rationale: Menunjukkan penerima manfaat pengumpulan dana dan mempertahankan istilah khas Paulus bagi umat percaya.
- source_word: διέταξα
  choice: telah kuperintahkan
  rationale: Mempertahankan daya perintah dari διατάσσω serta kewibawaan arahan Paulus; bentuk “telah” sesuai dengan tindakan sebelumnya yang menjadi pola.
- source_word: ἐκκλησίαις
  choice: jemaat-jemaat
  rationale: Dalam konteks Paulus, kata ini menunjuk pada komunitas-komunitas umat Kristen setempat; “jemaat” lebih alami daripada “gereja” bila merujuk pada kelompok orang.
- source_word: Γαλατίας
  choice: Galatia
  rationale: Bentuk nama wilayah yang baku dalam bahasa Indonesia.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: lakukanlah juga seperti
  rationale: Bentuk imperatif “lakukanlah” mempertahankan daya pengarahan teks, sedangkan “juga seperti” menyatakan bahwa tindakan jemaat Korintus harus mengikuti pola yang sama.
theological_decisions:
- issue: Pemaknaan ἅγιοι dalam konteks bantuan keuangan
  choice: orang-orang kudus
  alternative: umat Allah
  rationale: “Orang-orang kudus” mempertahankan istilah khas Paulus untuk umat percaya dan kesinambungan teologisnya, tanpa menyiratkan bahwa yang dimaksud hanya tokoh yang kemudian dikanonisasi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat diatur ulang agar perintah utama terdengar alami, sambil mempertahankan hubungan perbandingan dengan petunjuk yang diberikan kepada jemaat-jemaat di Galatia.
