id: 1CO.16.22
reference: 1 Corinthians 16:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: id
  text: Jika ada orang yang tidak mengasihi Tuhan, biarlah dia terkutuk.[a] Marana tha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau dengan istilah tradisional: “anatema”; yaitu, berada di bawah kutuk.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Aram. Mungkin berarti “Tuhan kami, datanglah!” atau “Tuhan kami telah datang.”
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: mengasihi
  rationale: Dalam konteks ini φιλέω menyatakan kasih atau afeksi pribadi kepada Tuhan. “Mengasihi” merupakan padanan Indonesia yang alami dan bermartabat tanpa mempersempit maknanya menjadi sekadar persahabatan atau perasaan hangat.
- source_word: κύριον
  choice: Tuhan
  rationale: κύριος di sini merujuk kepada Yesus sebagai gelar kristologis. “Tuhan” mempertahankan bobot gelar tersebut dan sesuai dengan pemakaian Perjanjian Baru dalam bahasa Indonesia.
- source_word: ἤτω
  choice: biarlah dia
  rationale: Bentuk imperatif kini dari εἰμί bersifat yusif. “Biarlah dia” mempertahankan daya perintah atau pernyataan penghakiman dalam klausa ini.
- source_word: ἀνάθεμα
  choice: terkutuk
  rationale: ἀνάθεμα menunjuk kepada orang yang berada di bawah kutuk atau diserahkan kepada kebinasaan. “Terkutuk” menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern, sedangkan istilah tradisional “anatema” dicatat dalam catatan kaki.
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: Ungkapan bahasa Aram ini dipertahankan dalam huruf Yunani, dan pembagian serta maknanya diperdebatkan. Transliterasi menjaga bentuk liturgis atau seruannya, sementara kemungkinan makna utama dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna ungkapan bahasa Aram Μαράνα θά
  choice: Mempertahankan transliterasi “Marana tha” dalam teks utama.
  alternative: “Tuhan kami, datanglah!” atau “Tuhan kami telah datang.”
  rationale: Ungkapan ini stabil secara tekstual, tetapi maknanya bergantung pada cara kata-kata Aram tersebut dibagi dan dipahami. Transliterasi tidak memutuskan secara sepihak ambiguitas yang sungguh ada.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada singkat, khidmat, dan tegas. “Jika ada orang yang” dipilih sebagai ungkapan alami untuk εἴ τις, sedangkan “biarlah dia terkutuk” mempertahankan daya yusif tanpa terdengar kuno. Penanda catatan kaki ditempatkan pada unsur yang benar: [a] sesudah “terkutuk” dan [b] sesudah “Marana tha”.'
