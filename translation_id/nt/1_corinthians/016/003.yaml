  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: id
  text: Ketika saya tiba, orang-orang yang kalian setujui akan saya utus dengan membawa surat-surat untuk mengantarkan pemberian kalian[a] ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pemberian murah hati kalian.” Kata Yunani yang dipakai juga dapat berarti “anugerah,” tetapi di sini menunjuk pada sumbangan yang dikirim ke Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Ketika saya tiba
  rationale: ὅταν dengan aoristus subjungtif menyatakan keadaan mendatang yang diharapkan terjadi. “Ketika saya tiba” alami dalam bahasa Indonesia; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan dengan kata yang menyiratkan pertentangan kuat.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: orang-orang yang kalian setujui
  rationale: δοκιμάζω dapat mencakup pemeriksaan yang menghasilkan persetujuan. Dalam konteks pemilihan utusan, “setujui” menyampaikan hasil penilaian itu secara ringkas dan wajar.
- source_word: δι’ ἐπιστολῶν
  choice: dengan membawa surat-surat
  rationale: διά dengan genitif menyatakan sarana atau penyertaan. Ungkapan ini menunjukkan bahwa para utusan akan dikirim dengan surat-surat, tanpa menambahkan secara eksplisit bahwa surat itu adalah surat rekomendasi.
- source_word: τούτους πέμψω
  choice: orang-orang ... akan saya utus
  rationale: τούτους menunjuk kembali secara tegas kepada orang-orang yang disetujui. Susunan “akan saya utus” mempertahankan fokus pada tindakan Paulus dan terdengar alami.
- source_word: ἀπενεγκεῖν
  choice: untuk mengantarkan
  rationale: Infinitif ini menyatakan tujuan pengutusan, yaitu membawa pemberian itu sampai ke Yerusalem. “Mengantarkan” cocok untuk pemindahan sesuatu kepada tujuan atau penerimanya.
- source_word: τὴν χάριν ὑμῶν
  choice: pemberian kalian
  rationale: Dalam konteks pengumpulan bantuan bagi orang-orang kudus, χάρις menunjuk pada sumbangan nyata. “Pemberian” jelas dan alami, sedangkan nuansa kemurahan hati dipertahankan dalam catatan kaki.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: εἰς dengan nama kota secara wajar diterjemahkan sebagai arah atau tujuan, “ke Yerusalem”.
theological_decisions:
- issue: Makna χάρις dalam konteks pengumpulan bantuan
  choice: Pemberian atau sumbangan nyata bagi umat percaya di Yerusalem
  alternative: Anugerah atau tindakan kemurahan hati
  rationale: Konteks langsung pasal ini membahas pengumpulan bantuan, sehingga kata tersebut merujuk pada pemberian konkret. Namun, χάρις tetap membawa nuansa kemurahan hati, yang dicatat tanpa mengubahnya menjadi istilah teologis abstrak dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar penerima surat sebagai komunitas terbaca jelas. Susunan kalimat dibuat alami, tetap mempertahankan hubungan surat-surat dengan pengutusan para wakil dan tujuan mereka membawa pemberian ke Yerusalem.
