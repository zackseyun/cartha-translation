  text: Let all that you do be done in love[a].
translation:
  language: id
  text: Hendaklah segala sesuatu yang kamu lakukan berlangsung dalam kasih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “Hendaklah segala sesuatu dari kamu ada dalam kasih.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral dari πᾶς dipakai secara menyeluruh; 'segala sesuatu' mempertahankan cakupan universalnya dengan bahasa Indonesia yang wajar.
- source_word: ὑμῶν
  choice: yang kamu lakukan
  rationale: Genitif ini secara harfiah berarti 'dari kamu/kalian' dan berkaitan dengan πάντα. Dalam konteks nasihat, frasa tersebut secara idiomatis menunjuk pada segala sesuatu yang dilakukan para pembaca.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Terjemahan ini mempertahankan gambaran Yunani tentang kasih sebagai cara atau lingkup berlangsungnya segala sesuatu, tanpa mempersempitnya menjadi sekadar perasaan.
- source_word: γινέσθω
  choice: hendaklah ... berlangsung
  rationale: 'Imperatif kini orang ketiga dari γίνομαι menyatakan nasihat berkelanjutan: hendaklah semuanya terjadi atau berlangsung demikian. ''Berlangsung'' alami dalam bahasa Indonesia dan tidak memaksakan nuansa pasif yang tidak mutlak dalam bentuk Yunani.'
