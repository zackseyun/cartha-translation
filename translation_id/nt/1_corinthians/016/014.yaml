translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk tunggal kolektif 'kamu' mengikuti gaya sapaan yang ditujukan kepada jemaat; ungkapan idiomatis dalam teks utama dijelaskan dengan bentuk yang lebih harfiah dalam catatan kaki.
