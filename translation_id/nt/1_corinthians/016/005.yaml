  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani: futur Ἐλεύσομαι sebagai “akan datang,” arah πρὸς ὑμᾶς, urutan perjalanan dalam ὅταν ... διέλθω, pengulangan Makedonia, serta hubungan penjelas γάρ. “Setelah saya melintasi” secara wajar menyatakan bahwa perjalanan melalui Makedonia mendahului kedatangan Paulus; catatan kaki menyediakan padanan yang lebih dekat dengan bentuk “ketika.” “Saya sedang melintasi” dapat mengungkapkan present yang memandang rute itu sebagai perjalanan/rencana yang sedang berlangsung, sepadan dengan διέρχομαι dalam konteks ini.'
