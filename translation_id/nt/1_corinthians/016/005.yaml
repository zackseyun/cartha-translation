  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: id
  text: Namun, saya akan datang kepada kalian setelah saya melintasi Makedonia,[a] sebab saya sedang melintasi Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika saya telah melintasi Makedonia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: saya akan datang
  rationale: Bentuk futur ἔρχομαι menyatakan niat Paulus untuk datang kepada jemaat Korintus; 'datang' sesuai dengan arah πρὸς ὑμᾶς.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan kontras ringan dari rencana perjalanan sebelumnya; 'Namun' wajar dalam bahasa Indonesia tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: πρός dengan akusatif sesudah verba gerak menunjukkan arah menuju orang-orang yang disapa. 'Kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ὅταν ... διέλθω
  choice: setelah saya melintasi
  rationale: Dalam konteks rencana perjalanan ini, ὅταν dengan aoris subjungtif menunjuk tindakan mendatang yang mendahului kedatangan Paulus. 'Setelah' menyampaikan urutan itu secara alami, meskipun 'ketika saya telah melintasi' lebih harfiah.
- source_word: Μακεδονίαν
  choice: Makedonia
  rationale: Bentuk baku bahasa Indonesia untuk nama wilayah/provinsi kuno Macedonia.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memperkenalkan penjelasan bagi waktu kunjungan yang baru disebutkan.
- source_word: διέρχομαι
  choice: saya sedang melintasi
  rationale: Bentuk kini ini dipertahankan untuk membedakannya dari aoris διέλθω dan dapat menggambarkan rute yang sedang dijalani atau dipandang sebagai rencana yang telah ditetapkan.
theological_decisions: []
