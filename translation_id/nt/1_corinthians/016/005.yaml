  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina jamak 'kalian' dipakai agar jumlah gramatikal sapaan Yunani terlihat jelas. Pengulangan 'Makedonia' dipertahankan sebagaimana teks sumber.
