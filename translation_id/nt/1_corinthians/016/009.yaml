  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: id
  text: Sebab sebuah pintu yang besar dan efektif telah terbuka bagi saya[a], dan banyak penentang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kesempatan besar dan efektif telah terbuka bagi saya.” Paulus memakai “pintu” sebagai kiasan untuk terbukanya jalan bagi pelayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: pintu
  rationale: Mempertahankan metafora sumber, yang menggambarkan terbukanya jalan bagi pelayanan, tanpa meratakannya menjadi tafsiran “kesempatan”.
- source_word: γάρ
  choice: sebab
  rationale: Menghubungkan ayat ini dengan rencana perjalanan Paulus dalam konteks sebelumnya sebagai alasannya.
- source_word: μοι
  choice: bagi saya
  rationale: Menyampaikan datif acuan atau keuntungan pribadi secara alami dalam bahasa Indonesia.
- source_word: ἀνέῳγεν
  choice: telah terbuka
  rationale: 'Mencerminkan bentuk perfek Yunani: pintu itu telah dibuka dan kini berada dalam keadaan terbuka, tanpa menentukan pelakunya secara eksplisit.'
- source_word: μεγάλη
  choice: besar
  rationale: Mempertahankan gambaran pintu sekaligus menunjukkan besarnya arti atau cakupan peluang tersebut.
- source_word: ἐνεργής
  choice: efektif
  rationale: Mengungkapkan bahwa pintu pelayanan itu berdaya guna atau menghasilkan buah, sambil mempertahankan ketegangan metaforis sumber.
- source_word: ἀντικείμενοι
  choice: orang menentang saya
  rationale: Partisip ini dipakai secara substantival untuk orang-orang yang melawan; bentuk verbal terdengar alami dan menegaskan perlawanan aktif.
- source_word: πολλοί
  choice: banyak
  rationale: Padanan langsung dan alami bagi jumlah yang besar.
theological_decisions:
- issue: Metafora “pintu” bagi terbukanya pelayanan
  choice: Mempertahankan kata “pintu”.
  alternative: “Sebuah kesempatan besar dan efektif telah terbuka bagi saya.”
  rationale: Teks Yunani memakai metafora yang khas bagi Paulus. Mempertahankannya menjaga citra sumber dan tidak mempersempit maknanya menjadi satu penafsiran.
- issue: Hubungan antara terbukanya pintu dan banyaknya penentang
  choice: Menerjemahkan καί kedua sebagai “tetapi”.
  alternative: “dan banyak orang menentang saya.”
  rationale: καί secara leksikal berarti “dan”, tetapi dalam konteks ini kedua keadaan tersebut berkontras. “Tetapi” menyampaikan hubungan wacana itu secara alami tanpa menghapus fakta bahwa peluang dan perlawanan hadir bersamaan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Efektif” dipertahankan karena lazim dipahami, meskipun penerapannya pada “pintu” sengaja terasa metaforis seperti dalam teks Yunani.
