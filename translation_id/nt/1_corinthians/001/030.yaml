id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: id
  text: Namun, dari Dialah kamu berada di dalam Mesias Yesus, yang bagi kita telah menjadi hikmat dari Allah, juga kebenaran[a], pengudusan, dan penebusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: Alternatif leksikal bagi δικαιοσύνη dipertahankan karena kata itu dapat menunjuk pada kebenaran maupun keadilan sesuai konteks.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: dari Dialah
  rationale: 'Mempertahankan gagasan sumber atau asal: keberadaan orang percaya di dalam Mesias berasal dari Allah. Partikel -lah memberi penekanan yang terdapat dalam susunan Yunani.'
- source_word: ἐν
  choice: di dalam
  rationale: Mempertahankan ungkapan khas Paulus tentang berada di dalam Mesias tanpa menjelaskannya secara berlebihan sebagai persatuan.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός menurut maknanya, bukan memperlakukannya sebagai sekadar nama diri.
- source_word: ἐγενήθη
  choice: telah menjadi
  rationale: Menyampaikan secara langsung makna γίνομαι dan menghasilkan ungkapan Indonesia yang wajar dalam konteks ini.
- source_word: σοφία
  choice: hikmat
  rationale: Padanan yang jelas dan selaras dengan kontras antara hikmat dunia dan hikmat Allah dalam konteks pasal ini.
- source_word: ἀπὸ θεοῦ
  choice: dari Allah
  rationale: Mempertahankan makna sumber tanpa mengubahnya menjadi parafrasa seperti 'diberikan oleh Allah'.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Padanan teologis yang lazim untuk δικαιοσύνη dalam konteks keselamatan Paulus; kemungkinan makna 'keadilan' dipertahankan dalam catatan kaki.
- source_word: ἁγιασμός
  choice: pengudusan
  rationale: Mengungkapkan tindakan atau keadaan dijadikan kudus dan mempertahankan nuansa teologis istilah Paulus.
- source_word: ἀπολύτρωσις
  choice: penebusan
  rationale: Padanan baku yang mempertahankan gagasan pembebasan dalam latar makna istilah tersebut.
theological_decisions:
- issue: Hubungan 'hikmat dari Allah' dengan tiga nomina berikutnya
  choice: Daftar dibiarkan berlanjut dengan 'juga' tanpa memakai 'yaitu', sehingga hubungan eratnya terlihat tetapi tidak ditetapkan secara tegas sebagai penjelasan apposisional.
  alternative: Menerjemahkan 'yaitu kebenaran, pengudusan, dan penebusan' atau memperlakukan keempat nomina sebagai daftar koordinatif sepenuhnya.
  rationale: Sintaksis Yunani memungkinkan tiga nomina terakhir dipahami sebagai penguraian hikmat dari Allah maupun sebagai unsur-unsur yang berkoordinasi dengannya. Rumusan ini mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'dari Dialah' sengaja mempertahankan penekanan dan gagasan sumber dari teks Yunani; istilah teologis digunakan hanya ketika sudah umum dan tepat.
