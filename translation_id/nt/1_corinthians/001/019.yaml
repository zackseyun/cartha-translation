base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: id
  text: 'Sebab ada tertulis: “Aku akan membinasakan hikmat orang-orang berhikmat dan meniadakan kepandaian orang-orang pandai.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menolak” atau “membatalkan” kepandaian orang-orang yang cerdas.
    reason: Mempertahankan rentang makna ἀθετήσω (“menolak,” “membatalkan”) dan kemungkinan padanan για συνετῶν sebagai “orang-orang yang cerdas.”
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku untuk formula kutipan Kitab Suci dalam bentuk perfek pasif, dengan hasil yang tetap berlaku.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi pernyataan sebelumnya dan mempertahankan hubungan wacana secara ringkas.
- source_word: Ἀπολῶ
  choice: Aku akan membinasakan
  rationale: Menyampaikan tindakan tegas ἀπόλλυμι dalam bentuk mendatang tanpa menambahkan unsur tafsir.
- source_word: σοφίαν τῶν σοφῶν
  choice: hikmat orang-orang berhikmat
  rationale: Mempertahankan pengulangan serumpun dan paralelisme retoris dalam bahasa Indonesia yang wajar.
- source_word: σύνεσιν τῶν συνετῶν
  choice: pengertian orang-orang berpengertian
  rationale: Mempertahankan hubungan leksikal antara nomina dan pelakunya serta kesejajaran dengan frasa sebelumnya.
- source_word: ἀθετήσω
  choice: meniadakan
  rationale: Mengungkapkan makna membatalkan atau membuat tidak berlaku secara tegas dan alami dalam konteks ini.
theological_decisions:
- issue: Daya retoris kutipan Yesaya tentang tindakan Allah terhadap hikmat manusia
  choice: 'Memakai dua verba mendatang yang langsung: “akan membinasakan” dan “meniadakan”'
  alternative: “akan menggagalkan” atau “akan mengesampingkan”
  rationale: Pilihan ini mempertahankan ketegasan dan kesejajaran teks Yunani tanpa memperluasnya menjadi pernyataan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “hikmat—berhikmat” serta “pengertian—berpengertian” sengaja dipertahankan untuk mencerminkan permainan kata dan paralelisme sumber Yunani.
