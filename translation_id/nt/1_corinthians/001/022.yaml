base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: id
  text: Sebab orang Yahudi meminta tanda-tanda[a], dan orang Yunani mencari hikmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tanda-tanda” juga dapat dipahami sebagai “tanda-tanda ajaib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi uraian Paulus dan mempertahankan hubungan kausal dengan konteks sebelumnya.
- source_word: Ἰουδαῖοι
  choice: orang Yahudi
  rationale: Dalam konteks ini istilah tersebut menunjuk pada kelompok Yahudi sebagai kategori budaya-keagamaan yang dikontraskan dengan orang Yunani.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Padanan ini mempertahankan istilah Yunani dan membiarkan konteks menyampaikan nuansa tindakan ajaib tanpa mempersempitnya dalam teks utama.
- source_word: αἰτοῦσιν
  choice: meminta
  rationale: Ini padanan langsung dan wajar bagi verba bentuk kini tersebut, tanpa menambahkan tekanan yang terkandung dalam kata 'menuntut'.
- source_word: Ἕλληνες
  choice: orang Yunani
  rationale: Pilihan ini mempertahankan bingkai budaya Yunani yang ditekankan oleh penyebutan hikmat, alih-alih memperluasnya menjadi semua orang bukan Yahudi.
- source_word: σοφίαν
  choice: hikmat
  rationale: Padanan ini mempertahankan keluasan makna kata Yunani dan cocok dengan kosakata teologis serta retorika Paulus dalam konteks ini.
- source_word: ζητοῦσιν
  choice: mencari
  rationale: Padanan alami ini menyampaikan tindakan yang sedang atau terus dilakukan sebagaimana bentuk kini dalam bahasa Yunani.
