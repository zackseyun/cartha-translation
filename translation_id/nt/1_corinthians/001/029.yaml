  terminology: '''Bermegah'' dan ''di hadapan Allah'' sangat tepat. ''Manusia'' merupakan pengungkapan idiomatis yang sah untuk πᾶσα σὰρξ dalam konteks ini, dengan catatan kaki yang mempertahankan ungkapan harfiahnya. Catatan kaki perlu diperbaiki karena ''jangan ada daging'' tidak mencerminkan bentuk Yunani secara tepat; harfiahnya ialah ''semua daging'' dalam konstruksi yang dinegasikan.'
