  yaml_path: translation/nt/1_corinthians/001/029.yaml
  text: so that no flesh may boast before God[a].
translation:
  language: id
  text: supaya tidak seorang manusia pun bermegah di hadapan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “supaya semua daging tidak bermegah di hadapan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan atau hasil dari tindakan Allah dalam konteks sebelumnya; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya telis klausa ini.
- source_word: μὴ
  choice: tidak ... pun
  rationale: 'Bersama verba subjungtif dan πᾶσα σὰρξ, negasi ini menyatakan pengecualian universal: tidak seorang pun.'
- source_word: καυχήσηται
  choice: dapat bermegah
  rationale: Bentuk subjungtif dalam klausa tujuan menyatakan bahwa tidak ada manusia yang mendapat ruang atau dasar untuk membanggakan diri; “bermegah” mempertahankan istilah penting dalam argumen Paulus.
- source_word: πᾶσα σὰρξ
  choice: seorang manusia pun
  rationale: Secara harfiah berarti “semua daging,” tetapi dalam konstruksi negatif ini merujuk kepada tidak satu manusia pun. Padanan idiomatis dipakai dalam teks utama agar maknanya jelas, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan Indonesia yang baku dan ringkas untuk keberadaan dalam hadirat atau penilaian Allah.
theological_decisions:
- issue: Makna σάρξ dalam konteks Paulus
  choice: “manusia” dalam teks utama, dengan “daging” sebagai bentuk harfiah dalam catatan kaki
  alternative: “daging” dalam teks utama
  rationale: Dalam ayat ini σάρξ bukan menunjuk pada suatu prinsip batin yang berdosa, melainkan pada manusia sebagai makhluk di hadapan Allah. “Manusia” menyampaikan rujukan tersebut secara alami tanpa memasukkan gagasan “natur berdosa,” sedangkan catatan kaki menjaga citra dan bentuk harfiah Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan “tidak seorang manusia pun” dipilih untuk menyampaikan cakupan universal πᾶσα σὰρξ di bawah negasi, sedangkan “bermegah” mempertahankan warna retoris dan teologis Paulus.
