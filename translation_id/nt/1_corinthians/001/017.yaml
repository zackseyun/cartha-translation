id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: id
  text: Sebab Mesias mengutus aku bukan untuk membaptis, melainkan untuk memberitakan kabar baik—bukan dengan hikmat dalam berkata-kata[a]—supaya salib Mesias tidak menjadi sia-sia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kefasihan yang berhikmat”; secara lebih harfiah, “dengan hikmat perkataan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “tidak dikosongkan”; maksudnya dapat mencakup “tidak dijadikan tidak berdaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan gelar Yunani Χριστός menurut maknanya dan mempertahankan keseragaman pada kedua kemunculannya dalam ayat ini.
- source_word: βαπτίζειν
  choice: membaptis
  rationale: Istilah baku dalam bahasa Indonesia ini tepat bagi konteks dan tidak mempersempit makna menjadi penjelasan tentang cara baptisan.
- source_word: εὐαγγελίζεσθαι
  choice: memberitakan kabar baik
  rationale: Mengungkapkan tindakan mengumumkan kabar baik secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: σοφίᾳ λόγου
  choice: dengan hikmat kata-kata
  rationale: Mempertahankan hubungan kedua nomina Yunani tanpa membatasi frasa itu hanya pada kefasihan retoris.
- source_word: κενωθῇ
  choice: dikosongkan dari kuasanya
  rationale: Kata kerja pasif dan metafora 'dikosongkan' dipertahankan, sedangkan 'dari kuasanya' menyatakan implikasi kontekstual yang diperlukan agar ungkapan tersebut dipahami secara alami dalam bahasa Indonesia.
- source_word: σταυρὸς
  choice: salib
  rationale: Padanan baku, langsung, dan sesuai dengan pemakaian Paulus.
theological_decisions:
- issue: Apakah Χριστός diterjemahkan sebagai gelar atau ditransliterasikan sebagai sebutan tradisional.
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός secara leksikal berarti 'Yang Diurapi/Mesias'; menerjemahkannya sebagai gelar membuat maknanya terbaca tanpa memasukkan kekhasan denominasi.
- issue: Apakah κενωθῇ dibiarkan sebagai metafora harfiah atau dijelaskan sebagai kehilangan daya.
  choice: dikosongkan dari kuasanya
  alternative: dijadikan sia-sia; dikosongkan
  rationale: Konteks membicarakan kemungkinan cara pemberitaan meniadakan daya salib dalam pewartaan. Rumusan utama mempertahankan metafora sambil memperjelas implikasinya; alternatif yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kontras οὐ ... ἀλλά disampaikan dengan 'bukan ... melainkan'; tanda pisah menandai penjelasan tentang cara pemberitaan. Semua penanda catatan kaki muncul dalam teks utama.
