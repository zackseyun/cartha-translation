source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: id
  text: Namun, Allah memilih apa yang dianggap bodoh oleh dunia[a] untuk mempermalukan orang-orang bijak[b], dan Allah memilih apa yang dianggap lemah oleh dunia[c] untuk mempermalukan apa yang kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “hal-hal yang bodoh dari dunia”; bahasa Yunani memakai kata sifat netral jamak sebagai kata benda.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat orang-orang bijak mendapat malu.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “hal-hal yang lemah dari dunia”; bahasa Yunani kembali memakai kata sifat netral jamak sebagai kata benda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan tegas dengan ayat sebelumnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: apa yang dianggap bodoh oleh dunia
  rationale: Adjektiva netral jamak dipakai secara substantival. Ungkapan ini tidak membatasi acuannya hanya pada orang atau benda, sedangkan 'dianggap ... oleh dunia' menyampaikan sudut pandang tatanan dunia yang tersirat dalam konteks.
- source_word: ἐξελέξατο ὁ θεός
  choice: Allah memilih
  rationale: Menyampaikan tindakan Allah yang sengaja dan mempertahankan penekanan subjek ilahi.
- source_word: ἵνα καταισχύνῃ
  choice: untuk mempermalukan
  rationale: Infinitif tujuan merupakan padanan Indonesia yang alami bagi klausa ἵνα dengan verba subjungtif dan tetap mempertahankan daya tujuan.
- source_word: τοὺς σοφούς
  choice: orang-orang bijak
  rationale: Adjektiva maskulin jamak substantival secara alami menunjuk kepada orang-orang yang bijak atau dianggap bijak.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: apa yang dianggap lemah oleh dunia
  rationale: Seperti μωρά, bentuk netral jamak substantival ini dibiarkan luas cakupannya dan tidak dipersempit hanya kepada manusia.
- source_word: τὰ ἰσχυρά
  choice: apa yang kuat
  rationale: Mempertahankan bentuk netral substantival dan kesejajaran retoris dengan 'apa yang ... lemah' tanpa mengubahnya secara khusus menjadi orang-orang berkuasa.
theological_decisions:
- issue: Cakupan bentuk netral jamak τὰ μωρά, τὰ ἀσθενῆ, dan τὰ ἰσχυρά
  choice: Diterjemahkan dengan konstruksi luas 'apa yang ...'
  alternative: Menafsirkannya secara khusus sebagai 'orang-orang yang bodoh/lemah/kuat' atau secara harfiah sebagai 'hal-hal yang bodoh/lemah/kuat'
  rationale: Bentuk Yunani dapat mencakup orang, hal, atau kategori yang dipandang demikian. Terjemahan luas mempertahankan ambiguitas tersebut dan menghindari penyempitan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pengulangan 'Allah memilih' dipertahankan karena merupakan unsur retoris teks Yunani. Konstruksi 'apa yang dianggap ... oleh dunia' dipilih agar alami bagi pembaca modern sekaligus menjaga sudut pandang penilaian dunia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
