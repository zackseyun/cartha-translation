  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: id
  text: sebagaimana kesaksian tentang Mesias[a] telah diteguhkan di antara kalian[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau, “di dalam diri kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai kesesuaian dengan pernyataan sebelumnya dan mempertahankan hubungan sintaktis ayat ini sebagai anak kalimat.
- source_word: μαρτύριον
  choice: kesaksian
  rationale: Mempertahankan nuansa kesaksian atau pemberian bukti, tanpa mempersempitnya menjadi sekadar 'berita'.
- source_word: τοῦ Χριστοῦ
  choice: tentang Mesias
  rationale: 'Genitif dipahami terutama secara objektif: kesaksian itu mengenai Mesias. ''Mesias'' mempertahankan fungsi Χριστός sebagai gelar.'
- source_word: ἐβεβαιώθη
  choice: telah diteguhkan
  rationale: Bentuk pasif ini menyatakan bahwa kesaksian tersebut dijadikan teguh atau terbukti kokoh; 'telah diteguhkan' alami dalam konteks dan tidak menentukan secara berlebihan cara peneguhannya.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Dengan pronomina jamak, frasa ini secara wajar menunjuk pada peneguhan di tengah jemaat Korintus sebagai komunitas.
theological_decisions:
- issue: Fungsi genitif dalam τοῦ Χριστοῦ
  choice: kesaksian tentang Mesias
  alternative: kesaksian Mesias
  rationale: Konteks mendukung genitif objektif, yakni kesaksian yang isinya mengenai Mesias, tetapi genitif Yunani juga dapat dipahami sebagai kesaksian yang berasal dari atau dimiliki Mesias; alternatif dipertahankan dalam catatan kaki.
- issue: Cakupan ἐν ὑμῖν
  choice: di antara kalian
  alternative: di dalam diri kalian
  rationale: Bentuk jamak paling wajar merujuk pada jemaat secara komunal, tetapi ungkapan Yunani dapat pula menekankan peneguhan dalam diri para penerima.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak secara jelas. Urutan penanda catatan kaki dibuat [a][b] agar sesuai dengan urutan unsur yang dijelaskan dalam teks.
