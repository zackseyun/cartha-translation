id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: id
  text: Sebab, dalam hikmat Allah, dunia tidak mengenal Allah melalui hikmat, Allah berkenan menyelamatkan orang-orang yang percaya melalui kebodohan pemberitaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kebodohan dalam berkhotbah.” Istilah Yunani yang diterjemahkan “pemberitaan” terutama dapat menunjuk pada berita yang diberitakan, tetapi juga dapat mencakup tindakan memberitakannya. Kebodohan itu merupakan penilaian menurut ukuran dunia.
    reason: Menjelaskan pembacaan alternatif bagi κήρυγμα dan bahwa μωρία tidak menyatakan penilaian Allah sendiri.
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Sebab, karena
  rationale: Mempertahankan fungsi penjelas γάρ sekaligus hubungan sebab yang diperkenalkan oleh ἐπειδή, walaupun susunannya sengaja agak formal.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: dalam hikmat Allah
  rationale: Menjaga kemungkinan bahwa ἐν menunjuk pada lingkup atau tatanan hikmat Allah tanpa mempersempitnya menjadi sarana.
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: dunia tidak mengenal
  rationale: ‘Mengenal’ mempertahankan keluasan makna kognitif dan relasional γινώσκω; ‘dunia’ merupakan padanan lazim κόσμος dalam konteks Paulus.
- source_word: διὰ τῆς σοφίας
  choice: melalui hikmat
  rationale: Menerjemahkan διά dengan genitif sebagai sarana dan tidak menambahkan pemilik hikmat yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: Allah berkenan
  rationale: Mengungkapkan kehendak baik dan perkenanan ilahi dengan bahasa Indonesia yang wajar serta bermartabat.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: melalui kebodohan pemberitaan
  rationale: Mempertahankan konstruksi yang dapat menunjuk terutama pada isi yang diberitakan, tetapi juga dapat menggemakan tindakan memberitakan, tanpa menyatakan bahwa Allah sendiri menilainya bodoh.
- source_word: σῶσαι
  choice: menyelamatkan
  rationale: Padanan baku bagi σῴζω yang mempertahankan bobot soteriologisnya.
- source_word: τοὺς πιστεύοντας
  choice: orang-orang yang percaya
  rationale: Menyampaikan partisipel substantival kini secara alami tanpa menambahkan rincian doktrinal yang tidak dinyatakan teks.
theological_decisions:
- issue: Makna διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Ungkapan utama dibiarkan mencakup kebodohan yang dilekatkan pada pemberitaan, terutama pada berita yang diberitakan.
  alternative: ‘Melalui pemberitaan yang dianggap bodoh’ atau ‘melalui kebodohan berkhotbah.’
  rationale: κήρυγμα lazimnya menunjuk pada isi proklamasi, tetapi dapat pula membangkitkan gagasan tentang tindakan memberitakan. Terjemahan utama dan catatan kaki mempertahankan ketegangan tersebut serta menjelaskan bahwa penilaian ‘bodoh’ berasal dari sudut pandang dunia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘Sebab, karena’ dipertahankan untuk mencerminkan dua penghubung Yunani, sedangkan frasa ‘kebodohan pemberitaan’ sengaja agak formal agar ambiguitas sumber tidak dihapus.
