  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: id
  text: Sebab berita[a] tentang salib adalah kebodohan bagi mereka yang sedang binasa, tetapi bagi kita yang sedang diselamatkan[b], berita itu adalah kuasa Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkataan tentang salib.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Yunani: “kita yang sedang diselamatkan”; bentuk ini menyajikan keselamatan sebagai kenyataan yang sedang berlangsung.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: berita
  rationale: Dalam konteks ini λόγος menunjuk pada isi yang diberitakan tentang salib. “Berita” terdengar alami dalam bahasa Indonesia dan lebih tepat daripada “firman,” yang dapat menimbulkan pengertian teknis lain.
- source_word: σταυροῦ
  choice: salib
  rationale: Pilihan harfiah ini mempertahankan ungkapan Paulus yang padat dan daya teologisnya tanpa menguraikannya menjadi “penyaliban.”
- source_word: ἀπολλυμένοις
  choice: mereka yang sedang binasa
  rationale: Partisipel kini mempertahankan keadaan atau proses yang sedang berlangsung. “Binasa” lebih sesuai dengan bobot maknanya daripada sekadar “tersesat.”
- source_word: μωρία
  choice: kebodohan
  rationale: Padanan modern yang jelas untuk penilaian bahwa berita salib dianggap tidak masuk akal atau bodoh, sekaligus mempertahankan kontras dengan kuasa Allah.
- source_word: σῳζομένοις
  choice: kita yang sedang diselamatkan
  rationale: Bentuk partisipel kini menyajikan keselamatan sebagai kenyataan yang sedang berlangsung; “kita” mempertahankan ἡμῖν yang eksplisit.
- source_word: δύναμις θεοῦ
  choice: kuasa Allah
  rationale: Padanan langsung dan alami yang mempertahankan bobot predikat teologis dalam teks Yunani.
theological_decisions:
- issue: Aspek keselamatan dalam σῳζομένοις
  choice: kita yang sedang diselamatkan
  alternative: kita yang diselamatkan
  rationale: Bentuk partisipel kini secara wajar menggambarkan keselamatan sebagai proses atau pengalaman kini yang berlangsung. Terjemahan tidak mereduksinya hanya menjadi peristiwa lampau.
- issue: Cakupan “berita tentang salib”
  choice: mempertahankan ungkapan padat “berita tentang salib”
  alternative: berita tentang penyaliban Kristus
  rationale: Teks Yunani hanya menyebut “salib.” Menambahkan “Kristus” dan menguraikan metoniminya akan memperjelas rujukan, tetapi mengurangi kepadatan serta ambiguitas retoris asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “berita itu” membuat subjek klausa kedua jelas dan alami tanpa mengubah hubungan sintaksis. Penanda aspek “sedang” dipertahankan pada kedua partisipel untuk mencerminkan kontras proses yang berlangsung.
