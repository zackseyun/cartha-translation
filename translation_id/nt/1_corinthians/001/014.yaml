- source_word: οὐδένα ὑμῶν
  choice: tidak ... seorang pun dari antara kalian
  rationale: Menyampaikan objek negatif Yunani secara jelas dan alami serta mempertahankan acuan langsung kepada para pembaca.
- source_word: ἐβάπτισα
  choice: membaptis
  rationale: '''Membaptis'' adalah padanan baku dalam konteks Perjanjian Baru dan tidak menentukan cara baptisan tertentu.'
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Secara tepat menyatakan pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: Κρίσπον
  choice: Krispus
  rationale: Transliterasi nama pribadi yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: Γάϊον
  choice: Gayus
  rationale: Transliterasi nama pribadi yang lazim dalam Alkitab berbahasa Indonesia.
