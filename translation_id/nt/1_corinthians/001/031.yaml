id: 1CO.1.31
reference: 1 Corinthians 1:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: id
  text: supaya, seperti yang tertulis, “Siapa yang bermegah, hendaklah ia bermegah di dalam Tuhan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang mengalir dari ayat sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya purposifnya.
- source_word: καθὼς
  choice: seperti
  rationale: Menandai kesesuaian dengan kutipan Kitab Suci secara jelas dan alami.
- source_word: γέγραπται
  choice: yang tertulis
  rationale: Rumus kutipan pasif perfek Yunani disampaikan dengan idiom Indonesia yang lazim; dalam frasa 'seperti yang tertulis' tetap tersirat wibawa tulisan yang berlaku.
- source_word: Ὁ καυχώμενος
  choice: Siapa yang bermegah
  rationale: Partisipel substantival diterjemahkan secara generik. 'Bermegah' mempertahankan gagasan membanggakan atau menaruh kebanggaan tanpa membatasinya pada kesombongan yang selalu negatif.
- source_word: ἐν
  choice: di dalam
  rationale: Mempertahankan bentuk ungkapan Yunani dan menunjukkan Tuhan sebagai lingkup sekaligus dasar kemegahan.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Padanan baku dan bermartabat bagi κύριος dalam konteks kutipan ini.
- source_word: καυχάσθω
  choice: hendaklah ia bermegah
  rationale: Bentuk ini menyampaikan imperatif orang ketiga secara alami dalam bahasa Indonesia dan mempertahankan nada anjuran/perintah tanpa membuatnya lebih mutlak daripada teks Yunani.
theological_decisions:
- issue: Daya imperatif dalam kutipan
  choice: hendaklah ia bermegah
  alternative: harus bermegah
  rationale: '''Hendaklah'' secara langsung mencerminkan imperatif orang ketiga dan menjaga nuansa perintah normatif, sedangkan ''harus'' dapat terdengar sebagai penegasan keharusan yang lebih eksplisit.'
- issue: Makna καυχάομαι dalam pengalihan arah kebanggaan
  choice: bermegah
  alternative: membanggakan diri
  rationale: '''Bermegah'' dapat mencakup kebanggaan atau sukacita yang diarahkan kepada Tuhan, sedangkan ''membanggakan diri'' cenderung menyiratkan kesombongan diri dan dapat mengaburkan pengalihan objek yang dimaksud ayat.'
- issue: Identitas κύριος dalam kutipan
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος tanpa secara grafis membedakan gelar bagi Allah dari nama ilahi; 'Tuhan' mempertahankan bentuk teks Yunani dan tidak menyelesaikan secara diam-diam hubungan kutipan Paulus dengan Yeremia.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kutipan dibuat alami bagi pembaca umum sambil mempertahankan hubungan tujuan dengan konteks sebelumnya serta bentuk imperatif kutipan.
