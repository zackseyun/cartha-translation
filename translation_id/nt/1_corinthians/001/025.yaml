  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: id
  text: Sebab kebodohan Allah lebih bijaksana daripada manusia, dan kelemahan Allah lebih kuat daripada manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menyatakan alasan bagi pernyataan sebelumnya; bentuk ini alami dan tetap mempertahankan hubungan argumentatif.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: kebodohan Allah
  rationale: Mempertahankan ungkapan paradoksal Paulus tanpa melunakkannya atau menambahkan penafsiran eksplisit.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: lebih bijaksana daripada manusia
  rationale: Menyampaikan bentuk komparatif dan memakai 'manusia' secara inklusif bagi umat manusia.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: kelemahan Allah
  rationale: Mempertahankan kesejajaran retoris dengan 'kebodohan Allah' serta ketegangan teologis dalam teks.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: lebih kuat daripada manusia
  rationale: Menerjemahkan komparatif secara langsung dan menjaga paralelisme kedua klausa.
theological_decisions:
- issue: Bahasa paradoksal tentang kebodohan dan kelemahan Allah
  choice: Dipertahankan secara harfiah sebagai 'kebodohan Allah' dan 'kelemahan Allah'.
  alternative: Menjelaskannya sebagai 'apa yang dianggap bodoh/lemah dalam karya Allah'.
  rationale: Teks Yunani sengaja memakai rumusan tajam dan paradoksal. Menambahkan 'dianggap' akan mempersempit atau menjelaskan ketegangan yang dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme antarklausa dipertahankan; 'manusia' dipakai dalam arti kolektif dan inklusif.
