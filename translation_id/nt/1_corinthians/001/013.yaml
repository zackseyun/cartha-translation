source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: id
  text: Apakah Mesias telah terbagi?[a] Apakah Paulus disalibkan untuk kalian? Atau apakah kalian dibaptis ke dalam nama Paulus?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah Kristus telah terbagi?”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “apakah kalian dibaptis dalam nama Paulus?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: sudah terbagi
  rationale: Bentuk perfekt pasif menyatakan pembagian sebagai tindakan yang telah menghasilkan suatu keadaan. “Sudah terbagi” mempertahankan aspek itu dan tetap wajar dalam pertanyaan retoris bahasa Indonesia.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Artikel dan konteks pertanyaan ini menonjolkan fungsi Χριστός sebagai gelar. “Mesias” menyampaikan arti gelar tersebut; bentuk tradisional “Kristus” dicatat sebagai alternatif.
- source_word: μὴ
  choice: tersirat melalui bentuk pertanyaan retoris
  rationale: μή menandai pertanyaan yang mengharapkan jawaban negatif. Dalam bahasa Indonesia, harapan itu dapat disampaikan secara alami tanpa menambahkan kata penafsir seperti “tentu tidak”.
- source_word: ἐσταυρώθη
  choice: disalibkan
  rationale: Padanan pasif yang langsung, lazim, dan mempertahankan daya retoris teks Yunani.
- source_word: ὑπὲρ ὑμῶν
  choice: untuk kalian
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan makna ‘demi/untuk kepentingan’ tanpa mempersempit nuansa teologisnya.
- source_word: εἰς τὸ ὄνομα
  choice: ke dalam nama
  rationale: “Ke dalam” mempertahankan arah dan hubungan yang dinyatakan oleh εἰς, termasuk kemungkinan nuansa masuk ke dalam persekutuan atau kesetiaan, tanpa menguraikannya dalam teks utama.
- source_word: ἐβαπτίσθητε
  choice: kalian dibaptis
  rationale: Padanan pasif yang lugas dan sesuai dengan pertanyaan retoris dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan Χριστός dalam pertanyaan retoris Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konstruksi ὁ Χριστός, gelar itu cukup menonjol untuk diterjemahkan menurut maknanya sebagai “Mesias”. Karena “Kristus” merupakan padanan tradisional yang juga mungkin dan lebih dikenal dalam sebagian pemakaian Indonesia, alternatif itu dipertahankan dalam catatan kaki.
- issue: Hubungan baptisan yang dinyatakan oleh εἰς τὸ ὄνομα
  choice: ke dalam nama
  alternative: dalam nama
  rationale: Terjemahan “ke dalam nama” mempertahankan unsur arah atau masuk ke dalam hubungan yang terdapat pada εἰς, tanpa menetapkan secara sempit apakah yang terutama dimaksud ialah kepemilikan, kesetiaan, atau persekutuan. Ungkapan idiomatis “dalam nama” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, yang memperjelas bahwa ὑμῶν dan ἐβαπτίσθητε merujuk kepada seluruh komunitas. Susunan tiga pertanyaan dipertahankan untuk menjaga tekanan retoris Paulus. Diksi dibuat lugas dan bermartabat, sementara alternatif tradisional dan idiomatis ditempatkan dalam catatan kaki.
