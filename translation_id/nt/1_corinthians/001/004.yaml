  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: id
  text: Aku selalu bersyukur kepada Allahku sehubungan dengan kalian karena anugerah Allah yang diberikan kepada kalian dalam Mesias Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστῶ τῷ θεῷ μου
  choice: Aku bersyukur kepada Allahku
  rationale: Ungkapan ini alami dalam bahasa Indonesia, mempertahankan kala kini sebagai tindakan yang terus dilakukan, serta mempertahankan pronomina μου yang menyatakan hubungan pribadi Paulus dengan Allah.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan langsung dan alami yang mempertahankan cakupan waktu yang luas.
- source_word: περὶ ὑμῶν
  choice: karena kalian
  rationale: Dalam rumusan ucapan syukur ini, περί dengan genitif menyatakan orang-orang yang menjadi alasan atau pokok ucapan syukur. 'Karena kalian' mengalir alami bersama 'bersyukur' dan sesuai dengan konteks.
- source_word: ἐπὶ τῇ χάριτι τοῦ θεοῦ
  choice: atas anugerah Allah
  rationale: ἐπί dengan datif menyatakan dasar atau alasan ucapan syukur. 'Atas' mempertahankan hubungan itu secara ringkas dan alami, sedangkan 'anugerah' menyampaikan pemberian baik Allah yang tidak diperoleh karena jasa.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: yang telah diberikan kepada kalian
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku secara eksplisit, sebagaimana teks Yunani, dan 'telah' menyatakan pemberian yang sudah terjadi dengan dampak yang tetap relevan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: ἐν diterjemahkan 'dalam' untuk mempertahankan rumusan persatuan atau ranah relasional Paulus. Χριστός diterjemahkan menurut makna gelarnya, 'Mesias', bukan sekadar ditransliterasikan.
theological_decisions:
- issue: Makna ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: melalui Mesias Yesus
  rationale: '''Dalam'' mempertahankan ungkapan khas Paulus dan tidak membatasi ἐν hanya pada makna sarana; dengan demikian, nuansa persatuan, lingkup, atau hubungan dengan Mesias tetap terbuka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Aku' dan 'kalian' dipakai agar pembedaan tunggal-jamak dalam teks sumber tetap jelas. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan 'Allah' yang terdapat dalam bahasa Yunani.
