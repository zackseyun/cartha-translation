id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: id
  text: Di manakah orang bijak? Di manakah ahli Taurat? Di manakah ahli debat zaman ini?[a] Bukankah Allah telah membuat hikmat dunia menjadi kebodohan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Zaman ini” menerjemahkan istilah Yunani yang berbeda dari “dunia” pada bagian akhir ayat.
    reason: cross_reference
  - marker: b
    text: Atau, “Bukankah Allah telah menunjukkan bahwa hikmat dunia adalah kebodohan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Di manakah
  rationale: Mengungkapkan tantangan retoris yang diikuti nomina, bukan sekadar pertanyaan lokasi biasa.
- source_word: σοφός
  choice: orang bijak
  rationale: Bentuk maskulin tunggal Yunani dipakai secara representatif; bahasa Indonesia secara alami dapat mempertahankan makna umum tanpa penandaan gender.
- source_word: γραμματεύς
  choice: ahli Taurat
  rationale: Dalam konteks retoris Paulus, istilah ini mempertahankan sosok historis seorang ahli kitab atau hukum Yahudi dan lebih jelas bagi pembaca Indonesia daripada ‘juru tulis’.
- source_word: συζητητής
  choice: ahli debat
  rationale: Padanan modern dan jelas bagi orang yang mahir berdebat atau berbantah.
- source_word: τοῦ αἰῶνος τούτου
  choice: zaman ini
  rationale: Mempertahankan αἰών sebagai ‘zaman’ dan membedakannya dari κόσμος, ‘dunia’, pada bagian akhir ayat.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban ya.
- source_word: ἐμώρανεν
  choice: telah membuat ... menjadi kebodohan
  rationale: Mempertahankan daya kausatif verba Yunani; catatan kaki menyebut kemungkinan nuansa deklaratif atau demonstratif.
- source_word: σοφίαν
  choice: hikmat
  rationale: Padanan baku dan bermartabat untuk σοφία dalam konteks teologis dan retoris ini.
- source_word: κόσμου
  choice: dunia
  rationale: Padanan alami untuk κόσμος dan sengaja dibedakan dari αἰών, ‘zaman’.
theological_decisions:
- issue: Pembedaan αἰών dan κόσμος dalam ayat yang sama
  choice: αἰών diterjemahkan ‘zaman’, sedangkan κόσμος diterjemahkan ‘dunia’
  alternative: Menerjemahkan keduanya dengan ‘dunia’ demi kelancaran
  rationale: Dua istilah Yunani yang berbeda sebaiknya tetap dibedakan agar kontras antara zaman kini dan hikmat dunia tidak diratakan.
- issue: Nuansa ἐμώρανεν
  choice: 'Mempertahankan arti kausatif: ‘membuat ... menjadi kebodohan’'
  alternative: ‘menunjukkan bahwa ... adalah kebodohan’
  rationale: Bentuk utama menjaga daya verbal Yunani tanpa menutup kemungkinan nuansa bahwa Allah menyingkapkan kebodohan hikmat dunia; alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan retoris. Pengulangan ‘Di manakah’ dipertahankan untuk menjaga irama tiga pertanyaan Yunani. ‘Ahli Taurat’ dipilih daripada ‘juru tulis’, dan ‘ahli debat’ dipilih sebagai ungkapan yang mudah dipahami pembaca masa kini.
