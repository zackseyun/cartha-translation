  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: id
  text: Paulus, yang dipanggil menjadi rasul Mesias Yesus[a] atas kehendak Allah, dan Sostenes, saudara kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus Yesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: κλητὸς ἀπόστολος
  choice: yang dipanggil menjadi rasul
  rationale: Menyampaikan bahwa status kerasulan Paulus berasal dari panggilan, dengan susunan yang alami dalam bahasa Indonesia; kata “menjadi” melengkapi ungkapan secara idiomatis tanpa mengubah maksud.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar yang menunjuk pada kedudukan mesianik Yesus; urutan unsur mengikuti teks Yunani.
- source_word: διὰ θελήματος θεοῦ
  choice: atas kehendak Allah
  rationale: Ungkapan Indonesia yang alami untuk menyatakan dasar atau perantaraan kehendak Allah dalam panggilan Paulus.
- source_word: Σωσθένης
  choice: Sostenes
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ ἀδελφὸς
  choice: saudara kita
  rationale: Walaupun teks Yunani secara harfiah memakai artikel tanpa kata ganti milik, ungkapan ini secara idiomatis memperkenalkan Sostenes sebagai saudara seiman yang dikenal bersama oleh pengirim dan penerima.
theological_decisions:
- issue: Penerjemahan Χριστός dalam salam Paulus
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar mesianik, sehingga “Mesias” mempertahankan makna gelarnya; alternatif tradisional dicatat karena “Kristus” juga telah menjadi sebutan baku dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur surat dipertahankan sebagai klausa pembuka yang berlanjut ke ayat berikutnya; tanda koma akhir mencerminkan kesinambungan tersebut.
