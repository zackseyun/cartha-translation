  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: id
  text: Dan Allah memilih apa yang berasal dari kalangan rendah di dunia dan apa yang dihina[a], apa yang tidak ada, untuk meniadakan apa yang ada[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang dianggap tidak berarti.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat apa yang ada menjadi tidak berarti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: apa yang dipandang rendah oleh dunia
  rationale: Kata ini menunjuk pada yang tidak terpandang karena asal-usul atau kedudukan sosialnya. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan rendahnya status tanpa memberi kesan nilai moral yang buruk.
- source_word: ἐξουθενημένα
  choice: apa yang dihina
  rationale: Partisipel perfek ini menggambarkan pihak-pihak yang telah diperlakukan sebagai tidak berharga atau dipandang dengan hina. Pilihan ini ringkas dan mempertahankan daya penolakannya.
- source_word: τὰ μὴ ὄντα
  choice: apa yang tidak ada
  rationale: Terjemahan yang dekat dengan bentuk Yunani ini mempertahankan ungkapan Paulus yang tajam serta ketegangan antara ketiadaan secara harfiah dan ketidakberartian secara sosial.
- source_word: τὰ ὄντα
  choice: apa yang ada
  rationale: Pilihan ini mempertahankan kesejajaran dan pertentangan langsung dengan 'apa yang tidak ada'.
- source_word: καταργήσῃ
  choice: meniadakan
  rationale: Dalam konteks ini verba tersebut berarti membuat tidak berlaku, tidak berdaya, atau tidak berarti. 'Meniadakan' mempertahankan permainan retoris dengan 'ada' tanpa harus menyatakan pemusnahan harfiah.
- source_word: ἐξελέξατο
  choice: memilih
  rationale: '''Memilih'' merupakan padanan Indonesia yang baku dan alami bagi tindakan Allah yang disengaja.'
theological_decisions:
- issue: Apakah τὰ μὴ ὄντα / τὰ ὄντα harus ditafsirkan dalam teks utama sebagai kategori sosial atau sebagai pernyataan ontologis mutlak.
  choice: 'Mempertahankan kontras harfiah: ''apa yang tidak ada'' / ''apa yang ada''.'
  alternative: Menafsirkannya secara dinamis sebagai 'mereka yang dianggap bukan siapa-siapa' / 'mereka yang dianggap penting'.
  rationale: Konteksnya menyangkut kedudukan menurut ukuran dunia, tetapi bahasa Paulus sengaja lebih luas dan menggugah. Bentuk harfiah mempertahankan ketegangan teologis dan kekuatan sosialnya tanpa mempersempit arti dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'apa yang' dipertahankan untuk mencerminkan struktur retoris Yunani. Frasa 'dipandang rendah oleh dunia' dipilih bagi ἀγενῆ τοῦ κόσμου agar makna status sosialnya jelas dan tidak disalahpahami sebagai sifat moral.
