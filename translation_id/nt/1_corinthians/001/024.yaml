id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: id
  text: Namun bagi mereka yang dipanggil, baik orang Yahudi maupun orang Yunani, Mesias[a] adalah kuasa Allah dan hikmat Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Kristus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: mereka yang dipanggil
  rationale: Adjektiva ini berfungsi sebagai nomina kolektif dan menunjuk kepada orang-orang yang dikenali melalui panggilan Allah; ungkapan ini alami dalam bahasa Indonesia serta mempertahankan nuansa verbalnya.
- source_word: Ἰουδαίοις
  choice: orang Yahudi
  rationale: Dalam pasangan Paulus dengan 'orang Yunani', istilah ini terutama menyatakan identitas etnoreligius.
- source_word: Ἕλλησιν
  choice: orang Yunani
  rationale: Terjemahan ini mempertahankan istilah eksplisit Yunani dan tidak memperluasnya secara interpretatif menjadi 'bangsa-bangsa bukan Yahudi'.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini; 'Mesias' menyampaikan makna gelar itu dalam bahasa Indonesia, sementara alternatif tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: θεοῦ δύναμιν
  choice: kuasa Allah
  rationale: Konstruksi ini mempertahankan hubungan genitif dan pengulangan retoris teks sumber secara alami.
- source_word: θεοῦ σοφίαν
  choice: hikmat Allah
  rationale: Pilihan ini sejalan dengan pasangan 'kuasa Allah' serta mempertahankan pengulangan θεοῦ.
- source_word: implicit copula / verbless predicate relation
  choice: Mesias adalah kuasa Allah dan hikmat Allah
  rationale: Kopula 'adalah' dipasok agar hubungan predikatif yang tersirat dalam klausa Yunani terbaca jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar kristologis
  choice: Mesias
  alternative: Kristus
  rationale: Konteks mengaktifkan kandungan gelar Χριστός. 'Mesias' menerjemahkan maknanya, sedangkan 'Kristus' merupakan bentuk gelar tradisional yang diserap; alternatif itu dipertahankan dalam catatan kaki tanpa mengubah klaim teologis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'baik ... maupun ...' mempertahankan cakupan kedua kelompok, sedangkan pengulangan 'Allah' dipertahankan untuk mencerminkan kesejajaran dan penekanan teks Yunani.
