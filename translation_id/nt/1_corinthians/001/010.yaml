id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: id
  text: Saudara-saudara[a], aku menasihati kamu demi nama Tuhan kita, Yesus Sang Mesias[b], supaya kamu semua mengatakan hal yang sama dan jangan ada perpecahan[c] di antara kamu. Sebaliknya, hendaklah kamu bersatu dengan erat[d] dalam pikiran yang sama dan pendirian yang sama[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Yunani yang digunakan adalah maskulin jamak; dalam konteksnya sapaan ini dapat mencakup seluruh komunitas orang percaya, termasuk perempuan.
    reason: cultural_note
  - marker: b
    text: Mesias, secara tradisional disebut “Kristus.”
    reason: lexical_alternative
  - marker: c
    text: Atau “perpecahan-perpecahan” atau “kelompok-kelompok yang terbelah.”
    reason: lexical_alternative
  - marker: d
    text: Atau “dipulihkan menjadi satu” atau “ditata kembali hingga utuh.”
    reason: lexical_alternative
  - marker: e
    text: Atau “penilaian,” “keyakinan,” atau “keputusan yang sama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: aku menasihati
  rationale: Mengungkapkan seruan pastoral yang sungguh-sungguh, bukan sekadar perintah, dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini alami dalam bahasa Indonesia dan dapat mencakup seluruh komunitas, sementara bentuk maskulin Yunani serta cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: διὰ τοῦ ὀνόματος
  choice: demi nama
  rationale: Menyampaikan dasar dan wibawa seruan Paulus; frasa ini idiomatis dalam bahasa Indonesia dan tidak membatasi διά hanya pada arti alat.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Menerjemahkan daya titular Χριστός secara jelas; 'Sang' membuat gelar sesudah nama Yesus terdengar alami dalam bahasa Indonesia.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: supaya kamu semua mengatakan hal yang sama
  rationale: Mempertahankan gambaran konkret tentang tutur bersama, tanpa langsung menyederhanakannya menjadi sekadar 'sepakat'.
- source_word: σχίσματα
  choice: perpecahan
  rationale: Istilah Indonesia yang jelas untuk keretakan atau pembelahan di dalam jemaat.
- source_word: κατηρτισμένοι
  choice: dipersatukan dengan sempurna
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa komunitas dibawa ke keadaan yang utuh dan selaras; nuansa 'dipulihkan' atau 'diperbaiki' dicatat sebagai alternatif.
- source_word: νοῒ
  choice: pikiran
  rationale: Padanan langsung dan wajar bagi νοῦς, tetap dibedakan dari γνώμη.
- source_word: γνώμῃ
  choice: pendirian
  rationale: Menunjukkan penilaian, keyakinan, atau sikap yang dipegang bersama dan tetap berbeda dari 'pikiran'.
theological_decisions:
- issue: Gelar Kristologis Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός di sini tetap berfungsi sebagai gelar. Terjemahan utama menyatakan makna gelar itu, sedangkan bentuk tradisional dicatat tanpa mengubah referennya.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara, dengan catatan bahwa seluruh komunitas orang percaya dapat tercakup
  alternative: saudara-saudari
  rationale: Bentuk sumber secara gramatikal maskulin jamak, tetapi dalam konteks Paulus menyapa jemaat secara keseluruhan. Catatan mempertahankan kedua unsur itu tanpa menghapus ketegangan bentuk dan cakupan.
- issue: Sifat kesatuan yang diminta Paulus
  choice: dipersatukan dengan sempurna
  alternative: dipulihkan menjadi satu
  rationale: κατηρτισμένοι dapat menggambarkan penataan, perbaikan, atau pemulihan menuju keutuhan. Teks utama menekankan hasil berupa kesatuan utuh, sementara alternatif mempertahankan kemungkinan nuansa pemulihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' mempertahankan suara pribadi Paulus; 'kamu' sesuai untuk jemaat yang disapa sebagai kelompok. Kalimat panjang sumber dibagi menjadi dua kalimat agar mudah dipahami, sementara hubungan pertentangan dijaga dengan 'Sebaliknya'. Istilah 'pikiran' dan 'pendirian' dipertahankan terpisah agar dua kata Yunani tidak dilebur.
