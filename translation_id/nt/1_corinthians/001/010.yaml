    rationale: Terjemahan ini tidak salah, tetapi “bersatu dengan erat” lebih wajar dalam bahasa Indonesia dan sesuai dengan konteks pemulihan dari perpecahan. Catatan alternatif tetap mempertahankan nuansa pemulihan/penataan dari καταρτίζω.
