id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: id
  text: Ia juga akan meneguhkan[a] kamu hingga akhir, sehingga kamu tidak bercela[b] pada hari Tuhan kita Yesus, Sang Mesias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengukuhkan” atau “menguatkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak dapat dituduh” atau “bebas dari tuduhan.”
    reason: lexical_alternative
  - marker: c
    text: Yunani “Kristus”; diterjemahkan “Mesias” di sini untuk mempertahankan makna gelar tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: akan meneguhkan
  rationale: Kata kerja ini menyatakan tindakan membuat seseorang teguh atau kokoh. “Meneguhkan” alami dalam bahasa Indonesia dan mempertahankan nuansa penguatan, bukan sekadar pembuktian.
- source_word: ἕως τέλους
  choice: hingga akhir
  rationale: Frasa ini menyatakan keberlangsungan sampai titik akhir, yang dalam konteks ini bernuansa eskatologis. “Hingga akhir” ringkas, alami, dan tetap mempertahankan daya temporalnya.
- source_word: ἀνεγκλήτους
  choice: tidak bercela
  rationale: Kata sifat ini menunjuk pada keadaan tidak dapat didakwa atau dikenai tuduhan. “Tidak bercela” merupakan padanan Indonesia yang ringkas dan lazim, sementara nuansa forensiknya dicatat dalam catatan kaki.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: pada hari
  rationale: “Pada hari” merupakan ungkapan waktu yang alami dalam bahasa Indonesia dan tetap mempertahankan idiom alkitabiah tentang hari penghakiman atau penyataan Tuhan.
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku dan sesuai dengan bobot gelar κύριος dalam konteks Perjanjian Baru.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός merupakan gelar yang berarti Yang Diurapi atau Mesias. “Sang Mesias” mempertahankan makna gelarnya dan terdengar wajar sesudah nama Yesus.
theological_decisions:
- issue: Rujukan ὃς (“yang/dia”)
  choice: Kata ganti ini dipahami merujuk kepada Tuhan Yesus, Sang Mesias, yang disebut pada akhir ayat 7.
  alternative: Kata ganti ini dapat dipahami merujuk secara lebih luas kepada Allah yang disebut sebelumnya dalam konteks.
  rationale: Anteseden maskulin tunggal yang paling dekat ialah “Tuhan kita Yesus, Sang Mesias” pada ayat 7. Karena ayat Indonesia harus dapat dibaca sebagai kalimat yang berlanjut, ὃς diterjemahkan dengan “Ia” tanpa menambahkan penjelasan teologis.
- issue: Hubungan ἀνεγκλήτους dengan βεβαιώσει
  choice: Dinyatakan secara alami dengan klausa hasil, “sehingga kamu tidak bercela.”
  alternative: “Akan meneguhkan kamu ... sebagai orang-orang yang tidak bercela.”
  rationale: Dalam bahasa Yunani, ἀνεγκλήτους berfungsi sebagai pelengkap predikatif bagi “kamu.” Klausa “sehingga” menyampaikan hasil peneguhan itu dengan bahasa Indonesia yang alami tanpa mengubah isi pokoknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” dipilih sebagai kata ganti yang ringkas dan bermartabat; “hingga akhir” serta “pada hari Tuhan” mempertahankan corak eskatologis tanpa terdengar kaku. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
source_grounding:
  english_pob_role: consult_only
