  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: id
  text: Kasih karunia dan damai sejahtera bagi kalian dari Allah, Bapa kita, dan Tuhan Yesus, Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuhan Yesus Kristus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: kasih karunia
  rationale: Ungkapan baku dan wajar dalam bahasa Indonesia untuk istilah salam Paulus ini; mempertahankan makna kemurahan yang dianugerahkan serta bobot teologisnya.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Kata ganti orang kedua jamak ditampilkan secara jelas dengan bentuk Indonesia modern; dalam konteks berkat atau salam, 'bagi kalian' lebih alami daripada terjemahan harfiah 'kepada kalian'.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan ini mencakup kedamaian sekaligus kesejahteraan dan keutuhan yang dapat terkandung dalam εἰρήνη, serta lazim dalam register Alkitab bahasa Indonesia.
- source_word: ἀπὸ
  choice: dari
  rationale: Menandai sumber kasih karunia dan damai sejahtera secara langsung.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: Koma menunjukkan bahwa 'Bapa kita' menerangkan Allah, sesuai konstruksi Yunani, tanpa mengubahnya menjadi struktur 'Allah dan Bapa kita'.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan Indonesia yang wajar dan mapan untuk gelar κύριος serta mempertahankan bobot gelarnya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός diperlakukan sebagai gelar yang berarti Mesias, bukan sekadar diserap sebagai nama diri; 'Sang' membuat gelar itu idiomatis dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sumber yang sama antara kasih karunia dan damai sejahtera dengan Allah Bapa dan Tuhan Yesus
  choice: Menggunakan 'dari' bagi Allah dan mengulanginya sebelum Tuhan Yesus demi kejelasan koordinasi dalam bahasa Indonesia.
  alternative: Memakai hanya satu 'dari' yang menaungi kedua pribadi.
  rationale: Dalam bahasa Yunani, satu preposisi ἀπό menaungi kedua unsur yang dikoordinasikan. Pengulangan 'dari' dalam bahasa Indonesia memperjelas bahwa keduanya sama-sama menjadi sumber tanpa mengubah hubungan sintaksis atau menambahkan penjelasan doktrinal.
- issue: Nilai gelar Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Pilihan utama menerjemahkan arti gelar Yunani tersebut dan mempertahankan fungsi mesianiknya; bentuk tradisional 'Kristus' dicatat sebagai alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' menyatakan jamak secara alami; 'kasih karunia' dan 'damai sejahtera' mempertahankan register salam rasuli yang dikenal tanpa menjadi arkais.
