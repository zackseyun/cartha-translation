  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: id
  text: Sebab, saudara-saudaraku,[a] aku telah menerima laporan dari orang-orang Kloe tentang kalian bahwa ada pertengkaran di antara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai berbentuk maskulin jamak, “saudara-saudara,” tetapi dalam sapaan kepada jemaat dapat mencakup seluruh komunitas orang percaya, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: telah diberitahukan kepadaku
  rationale: Bentuk pasif menyatakan bahwa informasi itu disampaikan kepada Paulus; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa pasif.
- source_word: γάρ
  choice: Sebab
  rationale: Menjaga hubungan penjelas dengan nasihat pada ayat sebelumnya.
- source_word: περὶ ὑμῶν
  choice: mengenai keadaan kalian (tersirat dalam klausa laporan)
  rationale: Dalam bahasa Indonesia, maknanya dapat disampaikan secara alami melalui isi laporan 'bahwa ada pertengkaran di antara kalian' tanpa pengulangan yang kaku.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Sapaan jamak ini wajar dan bermartabat dalam bahasa Indonesia; bentuk 'saudara' dapat mencakup komunitas orang percaya tanpa memaksakan penentuan jenis kelamin yang tidak dinyatakan secara leksikal dalam bahasa sasaran.
- source_word: ὑπὸ τῶν Χλόης
  choice: oleh orang-orang Kloe
  rationale: Ungkapan Yunani menunjuk kepada orang-orang yang terkait dengan Kloe. Pilihan ini tidak mempersempitnya secara tidak pasti menjadi keluarga atau seisi rumah.
- source_word: ἔριδες
  choice: pertengkaran
  rationale: Kata ini menunjuk pada perselisihan atau konflik antarorang dan lebih tepat daripada istilah yang lebih luas seperti 'perpecahan'.
- source_word: ἐν ὑμῖν εἰσιν
  choice: ada ... di antara kalian
  rationale: Padanan idiomatis dan jelas bagi konstruksi keberadaan dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί dalam jemaat yang mencakup laki-laki dan perempuan
  choice: saudara-saudaraku
  alternative: saudara-saudara lelaki saya; saudara-saudaraku, laki-laki dan perempuan
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi dalam konteks komunitas dapat dipakai secara inklusif. Bahasa Indonesia 'saudara-saudaraku' secara alami mempertahankan sapaan kekeluargaan sekaligus memungkinkan cakupan seluruh jemaat; catatan kaki menjelaskan hal ini tanpa menyelesaikan ambiguitas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. 'Kalian' dipakai untuk membedakan bentuk jamak ὑμῶν/ὑμῖν secara jelas; 'orang-orang Kloe' mempertahankan ketidakpastian mengenai hubungan mereka dengan Kloe.
