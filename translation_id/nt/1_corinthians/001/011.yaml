  rationale: Revisi menyatakan secara eksplisit bahwa laporan itu mengenai para penerima surat, sambil mempertahankan sumbernya sebagai orang-orang yang terkait dengan Kloe dan tanpa menganggap mereka keluarga atau rumah tangga Kloe. Bentuk aktif idiomatis 'aku telah menerima laporan' menyampaikan makna pasif ἐδηλώθη μοι secara alami dalam bahasa Indonesia. Catatan kaki direvisi agar menjelaskan bentuk gramatikal dan kemungkinan cakupan sapaan tanpa klaim leksikal yang terlalu sempit.
