    rationale: Pernyataan itu terlalu sempit secara leksikal. Yang perlu dijelaskan ialah bahwa bentuk Yunani yang dipakai adalah maskulin jamak, sementara pemakaiannya dalam sapaan jemaat dapat mencakup seluruh komunitas.
