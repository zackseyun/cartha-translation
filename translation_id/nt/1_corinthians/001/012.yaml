  - severity: low
    issue: Tidak ada jangkar maupun catatan kaki untuk alternatif tradisional “Kristus”.
    rationale: Karena pilihan utama menerjemahkan Χριστοῦ sebagai “Mesias”, catatan alternatif “Kristus” secara transparan mencerminkan alternatif yang dicatat dalam jejak audit bahasa Inggris.
