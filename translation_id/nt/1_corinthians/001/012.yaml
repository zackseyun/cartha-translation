  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: id
  text: 'Maksud saya begini: kamu masing-masing berkata: “Aku termasuk golongan Paulus,” atau “Aku termasuk golongan Apolos,” atau “Aku termasuk golongan Kefas,” atau “Aku termasuk golongan Mesias.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: Maksud saya begini
  rationale: Ungkapan ini menyampaikan fungsi penjelas klausa Yunani secara alami dalam bahasa Indonesia modern.
- source_word: ἕκαστος ὑμῶν
  choice: kamu masing-masing
  rationale: Mempertahankan daya distributif ἕκαστος dan sapaan jamak ὑμῶν tanpa mengesankan bahwa setiap orang secara harfiah mengucapkan semua slogan.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini Yunani menggambarkan pola ujaran yang berlangsung; bentuk Indonesia ini tetap alami dalam konteks.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Aku golongan Paulus ... Aku golongan Apolos ... Aku golongan Kefas ... Aku golongan Mesias
  rationale: Genitif sesudah εἰμί menyatakan afiliasi. ‘Aku golongan’ secara ringkas dan alami menyampaikan identitas kelompok dalam konteks perpecahan, tanpa mempersempitnya menjadi hubungan murid formal.
- source_word: Κηφᾶ
  choice: Kefas
  rationale: Mentransliterasikan nama Aram-Yunani yang dipakai Paulus di sini, alih-alih menggantinya dengan Petrus.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; ‘Mesias’ menerjemahkan gelar tersebut daripada sekadar mentransliterasikannya.
theological_decisions:
- issue: Χριστοῦ sebagai slogan kelompok
  choice: Mesias
  alternative: Kristus
  rationale: 'Pilihan ini mempertahankan makna Χριστός sebagai gelar. Ayat tetap membiarkan ketegangan retorisnya: slogan ‘Aku golongan Mesias’ dapat terdengar benar pada dirinya sendiri, tetapi muncul dalam daftar klaim kelompok yang sedang ditegur Paulus.'
- issue: Makna genitif dalam slogan afiliasi
  choice: Aku golongan ...
  alternative: Aku milik ...
  rationale: Konteks 1 Korintus 1:11–13 menonjolkan kelompok-kelompok yang berselisih. ‘Aku golongan’ menyampaikan afiliasi faksional tanpa menyatakan kepemilikan ontologis yang sama terhadap Paulus, Apolos, Kefas, dan Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. ‘Aku’ dipakai dalam kutipan slogan pribadi; ‘kamu masing-masing’ mempertahankan sapaan jamak secara wajar. Nama Apolos dan Kefas mengikuti bentuk transliterasi yang lazim dalam Alkitab bahasa Indonesia.
