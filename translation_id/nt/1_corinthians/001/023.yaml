base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: id
  text: Namun, kami memberitakan Mesias yang disalibkan[a], bagi orang Yahudi batu sandungan, sedangkan bagi bangsa-bangsa lain suatu kebodohan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus yang disalibkan.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “bangsa-bangsa”; di sini maksudnya kemungkinan besar bangsa-bangsa bukan Yahudi, sebagai lawan dari orang Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: memberitakan
  rationale: Menyampaikan tindakan pewartaan umum dengan bahasa Indonesia yang alami dan tetap mempertahankan daya proklamasi kata Yunani.
- source_word: Χριστὸν
  choice: Mesias
  rationale: Dalam konteks ini Χριστός berfungsi jelas sebagai gelar yang menjadi isi pemberitaan, bukan sekadar bentuk nama.
- source_word: ἐσταυρωμένον
  choice: yang disalibkan
  rationale: Menerjemahkan partisip perfek pasif secara alami sambil mempertahankan tindakan penyaliban dan keadaan Mesias sebagai Dia yang telah disalibkan.
- source_word: Ἰουδαίοις
  choice: bagi orang Yahudi
  rationale: Kontras retorisnya bersifat etnis-keagamaan dengan bangsa-bangsa lain, bukan terutama geografis.
- source_word: σκάνδαλον
  choice: batu sandungan
  rationale: Mempertahankan metafora sesuatu yang menyebabkan orang tersandung; 'penghinaan' atau 'hal yang menyinggung' akan meratakan gambaran tersebut.
- source_word: ἔθνεσιν
  choice: bagi bangsa-bangsa lain
  rationale: Arti dasarnya adalah 'bangsa-bangsa'; dalam kontras dengan orang Yahudi, ungkapan ini menunjuk kepada bangsa bukan Yahudi tanpa memakai istilah yang kurang lazim bagi sebagian pembaca.
- source_word: μωρίαν
  choice: suatu kebodohan
  rationale: Menjaga kaitan leksikal dengan tema 'kebodohan' yang berulang dalam pasal ini dan menyatakan penilaian para pendengar, bukan penilaian Paulus.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Konteks menekankan isi pemberitaan kerasulan dan klaim mesianik yang dipandang sebagai batu sandungan atau kebodohan, sehingga bentuk gelar lebih tepat.
- issue: Relasi ἐσταυρωμένον dengan Χριστόν
  choice: Mesias yang disalibkan
  alternative: Mesias, yaitu Dia yang telah disalibkan
  rationale: Bentuk ringkas ini mempertahankan kesatuan frasa Yunani dan ketegangan teologis pada Mesias yang disalibkan tanpa menambahkan penjelasan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Tanda titik dua dipakai untuk memperjelas peralihan menuju tanggapan dua kelompok tanpa mengubah hubungan sintaksis pokok.
