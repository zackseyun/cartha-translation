  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: id
  text: sebab di dalam Dia kamu telah diperkaya dalam segala hal, dalam segala perkataan dan segala pengetahuan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteksnya, klausa ini menyatakan alasan bagi ucapan syukur Paulus pada ayat sebelumnya. “Sebab” menyampaikan fungsi kausal itu dengan jelas dan wajar.
- source_word: ἐν παντὶ
  choice: dalam segala hal
  rationale: Ungkapan ini bersifat luas dan menyatakan cakupan menyeluruh. “Dalam segala hal” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Yunani.
- source_word: ἐπλουτίσθητε
  choice: kamu telah diperkaya
  rationale: Bentuk aoris pasif menunjukkan bahwa jemaat menerima kekayaan itu dari pihak lain. “Telah diperkaya” mempertahankan daya pasif serta metafora kekayaan tanpa membatasinya pada harta benda.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Preposisi ἐν paling wajar menyatakan lingkup atau persatuan dengan Kristus. “Di dalam Dia” mempertahankan bahasa khas Paulus tanpa mengubahnya menjadi hubungan alat atau perantara.
- source_word: ἐν παντὶ λόγῳ
  choice: dalam segala perkataan
  rationale: λόγος dapat berarti kata, berita, atau kemampuan berbicara. Dalam pasangan dengan γνώσις, “segala perkataan” mempertahankan keluasan dan kesejajaran teks sambil tetap mudah dipahami.
- source_word: πάσῃ γνώσει
  choice: segala pengetahuan
  rationale: γνῶσις di sini menunjuk pada pengetahuan secara luas. “Segala pengetahuan” mempertahankan susunan paralel dengan “segala perkataan” dan tidak mempersempit maksud teks.
theological_decisions:
- issue: Makna ἐν αὐτῷ sebagai hubungan dengan Kristus
  choice: di dalam Dia
  alternative: oleh Dia / melalui Dia
  rationale: Terjemahan ini mempertahankan kemungkinan makna lingkup dan persatuan dengan Kristus yang lazim dalam tulisan Paulus, tanpa secara sepihak menafsirkannya sebagai pelaku atau sarana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan retoris “segala” dalam teks Yunani. Pronomina “Dia” memakai huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
