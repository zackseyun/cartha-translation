id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: id
  text: Kepada jemaat Allah di Korintus, yaitu mereka yang telah dikuduskan dalam Mesias Yesus dan dipanggil sebagai orang-orang kudus,[a] bersama semua orang yang di setiap tempat berseru kepada nama Tuhan kita Yesus sang Mesias[b]—di tempat mereka dan juga di tempat kita:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang kudus yang dipanggil.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Yesus Kristus.” “Mesias” dan “Kristus” menerjemahkan gelar Yunani yang sama.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Yunani ini padat dan dapat dipahami sebagai setiap tempat milik mereka dan kita. Ada juga kemungkinan bahwa frasa terakhir berarti “Tuhan mereka dan Tuhan kita.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: “Jemaat” merupakan padanan Indonesia yang alami untuk komunitas umat Allah dan tidak membatasi maknanya pada gedung atau lembaga.
- source_word: ἡγιασμένοις
  choice: telah dikuduskan
  rationale: Bentuk partisip perfek pasif menunjukkan tindakan yang telah dilakukan dengan hasil yang tetap berlaku; bentuk pasif juga dipertahankan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: “Dalam” mempertahankan rumusan relasional Paulus, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias”, bukan diperlakukan sebagai nama keluarga.
- source_word: κλητοῖς ἁγίοις
  choice: dipanggil menjadi orang-orang kudus
  rationale: Ungkapan ini menyampaikan panggilan ilahi dan status kudus secara alami dalam bahasa Indonesia, tanpa menyiratkan kelompok khusus yang baru diakui kudus sesudah kematian.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: berseru kepada nama
  rationale: Ungkapan “berseru kepada nama” mempertahankan nuansa doa, ibadah, dan pengakuan ketergantungan yang terkandung dalam idiom Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” adalah padanan baku dan sesuai dengan konteks pengakuan iman serta ibadah kepada Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus sang Mesias
  rationale: Artikel “sang” membuat fungsi Χριστός sebagai gelar terdengar alami dalam bahasa Indonesia.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: di setiap tempat—di tempat mereka dan juga di tempat kita
  rationale: Terjemahan ini mempertahankan kaitan yang paling langsung dengan “tempat” sekaligus memakai tanda pisah untuk mencerminkan susunan Yunani yang padat; kemungkinan kaitan lain dijelaskan dalam catatan.
theological_decisions:
- issue: Makna Χριστός
  choice: Mesias pada kedua kemunculan
  alternative: Kristus
  rationale: Χριστός masih berfungsi sebagai gelar dalam sapaan dan pengakuan ini. “Mesias” menyatakan makna gelar tersebut secara langsung tanpa menambahkan kekhasan denominasi.
- issue: Makna κλητοῖς ἁγίοις
  choice: dipanggil menjadi orang-orang kudus
  alternative: orang-orang kudus yang dipanggil
  rationale: Pilihan utama lebih alami bagi pembaca Indonesia dan menyatakan bahwa kekudusan mereka berakar pada panggilan Allah; catatan mempertahankan kemungkinan pembacaan yang lebih dekat dengan bentuk dua adjektiva Yunani.
- issue: Acuan αὐτῶν καὶ ἡμῶν
  choice: tempat mereka dan juga tempat kita
  alternative: Tuhan mereka dan Tuhan kita
  rationale: Kedekatan sintaksis mendukung kaitannya dengan “setiap tempat”, tetapi susunan Yunani yang padat memungkinkan kaitan dengan “Tuhan”; alternatif itu dicatat agar ambiguitas teologis dan sintaksis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat mempertahankan bentuk sapaan surat yang berakhir dengan titik dua. “Jemaat”, “dikuduskan”, dan “berseru kepada nama” dipilih karena dikenal luas tetapi tetap dapat dipahami pembaca umum; catatan kaki menjaga alternatif leksikal dan ambiguitas sintaksis yang sungguh ada.
