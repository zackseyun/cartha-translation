  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: id
  text: Aku juga membaptis rumah tangga Stefanas[a]. Selain itu, aku tidak tahu apakah aku membaptis orang lain lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seisi rumah Stefanas.” Istilah Yunani yang dipakai dapat menunjuk pada seluruh kesatuan rumah tangga, bukan hanya sebuah bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: membaptis
  rationale: Kata kerja ini menyatakan tindakan memberikan baptisan. “Membaptis” merupakan padanan baku dan tidak menentukan cara pelaksanaannya.
- source_word: δὲ καὶ
  choice: juga
  rationale: Gabungan ini menambahkan satu hal lagi pada ingatan Paulus sebelumnya; “juga” menyampaikan hubungan tambahan itu secara alami tanpa memberi kesan pertentangan yang kuat.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: rumah tangga Stefanas
  rationale: Dalam konteks ini, οἶκος paling mungkin menunjuk pada kesatuan rumah tangga Stefanas, bukan hanya bangunannya. “Rumah tangga” juga lebih luas daripada “keluarga” karena dapat mencakup orang lain yang menjadi bagian dari rumah tersebut.
- source_word: λοιπὸν
  choice: selain itu
  rationale: Kata ini beralih kepada kemungkinan adanya orang lain di luar rumah tangga yang baru disebutkan. “Selain itu” ringkas dan wajar dalam bahasa Indonesia.
- source_word: οὐκ οἶδα
  choice: aku tidak tahu
  rationale: Terjemahan ini mempertahankan arti langsung ungkapan Yunani. Konteksnya menyangkut ingatan Paulus, tetapi teks tidak memakai kata yang secara khusus berarti “ingat”.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: apakah aku membaptis orang lain
  rationale: εἴ memperkenalkan pertanyaan tak langsung yang mengungkapkan ketidakpastian mengenai adanya orang lain yang pernah Paulus baptis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “aku” mengikuti tutur pribadi Paulus dalam konteks ini. Susunan kalimat mempertahankan nada koreksi spontan dalam ingatannya tanpa mengganti “tidak tahu” dengan penafsiran kontekstual “tidak ingat”.
