  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: id
  text: sehingga kamu tidak kekurangan karunia apa pun[a] sementara kamu dengan penuh kerinduan menantikan penyataan Tuhan kita Yesus Kristus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karunia rohani apa pun” atau “karunia yang berasal dari anugerah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “penampakan Tuhan kita Yesus Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai hasil dari anugerah Allah yang dibicarakan dalam konteks sebelumnya; “sehingga” alami dan mempertahankan hubungan hasil.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: kamu tidak kekurangan
  rationale: Mengungkapkan keadaan tanpa kekurangan secara jelas dalam bahasa Indonesia modern.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: karunia apa pun
  rationale: χαρίσμα menunjuk pada pemberian yang berasal dari anugerah. “Karunia” mempertahankan nuansa itu tanpa menambahkan kata “rohani” yang tidak dinyatakan secara eksplisit.
- source_word: ἀπεκδεχομένους
  choice: sementara kamu dengan penuh kerinduan menantikan
  rationale: Partisip ini menyatakan penantian yang berlangsung dan penuh harap; frasa tersebut mempertahankan intensitas bentuk Yunani.
- source_word: ἀποκάλυψιν
  choice: penyataan
  rationale: Padanan langsung yang sesuai dengan bahasa eskatologis Paulus dan tetap dapat berarti tindakan Kristus dinyatakan, bukan sekadar penampakan visual.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku dan tepat bagi κύριος dalam sebutan Perjanjian Baru ini.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Dalam gabungan ini Χριστός berfungsi sebagai sebutan yang sudah menyerupai nama; bentuk baku Indonesia “Yesus Kristus” paling alami dan langsung.
theological_decisions:
- issue: Makna χαρίσματι
  choice: karunia
  alternative: karunia rohani
  rationale: Teks menyebut karunia yang diberikan oleh anugerah, tetapi tidak memuat kata “rohani”; terjemahan utama tidak mempersempit cakupannya secara interpretatif.
- issue: Makna ἀποκάλυψιν dalam konteks eskatologis
  choice: penyataan
  alternative: penampakan
  rationale: “Penyataan” mempertahankan padanan leksikal dan ketegangan antara penyingkapan pribadi Kristus dan peristiwa kedatangan-Nya; “penampakan” merupakan kemungkinan kontekstual.
- issue: Penerjemahan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  alternative: Yesus Sang Mesias
  rationale: Konstruksi ini merupakan sebutan nama yang lazim, bukan pemfokusan tersendiri pada gelar Mesias. Alternatif dapat menjelaskan asal dan makna gelarnya, tetapi lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina jamak Yunani ὑμᾶς diterjemahkan “kamu” sesuai pemakaian Indonesia yang dapat bersifat tunggal atau jamak; konteks surat menunjukkan seluruh jemaat. Tanda catatan kaki ditempatkan setelah kalimat dan seluruh penanda dalam teks memiliki catatan yang sesuai.
