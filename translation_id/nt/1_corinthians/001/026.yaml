review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada struktur dan makna Yunani. “Menurut ukuran manusia” tepat untuk κατὰ σάρκα dalam konteks ini. Namun, δυνατοί mencakup orang yang kuat atau berpengaruh secara sosial, tidak terutama orang yang menjalankan kuasa pemerintahan; “yang berkuasa” terlalu mempersempit maknanya.
  naturalness: Susunan paralel dan register sudah baik. Koma setelah “Sebab” tidak diperlukan, dan huruf kapital pada “Saudara-saudara” di tengah kalimat tidak sesuai kaidah kapitalisasi bahasa Indonesia.
  terminology: “Panggilan,” “bijaksana,” dan “kalangan bangsawan” menyampaikan istilah penting dengan baik. “Saudara-saudara” adalah sapaan yang wajar; catatan kaki secara tepat menjelaskan cakupan jemaat.
  issues:
  - severity: low
    issue: Tanda baca dan kapitalisasi pada pembukaan
    rationale: Dalam bahasa Indonesia baku, “Sebab perhatikanlah ...” tidak memerlukan koma setelah “Sebab”, dan sapaan “saudara-saudara” di tengah kalimat ditulis dengan huruf kecil.
  - severity: medium
    issue: “Yang berkuasa” untuk δυνατοί
    rationale: Istilah Yunani ini dalam rangkaian status sosial menunjuk secara lebih luas pada orang yang kuat, berdaya, atau berpengaruh. “Yang berkuasa” cenderung membatasi pada pemegang otoritas. “Yang berpengaruh” lebih alami dan mencakup daya sosial yang dimaksud.
