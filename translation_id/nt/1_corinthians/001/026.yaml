source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: id
  text: 'Sebab perhatikanlah panggilanmu, saudara-saudara[a]: di antara kamu tidak banyak yang bijaksana menurut ukuran manusia, tidak banyak yang berpengaruh, dan tidak banyak yang berasal dari kalangan bangsawan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” di sini merupakan sapaan kepada seluruh jemaat dan mencakup perempuan maupun laki-laki yang percaya.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: perhatikanlah
  rationale: Bentuk ini dapat dipahami sebagai imperatif atau indikatif. Dalam konteksnya, Paulus mengajak jemaat merenungkan keadaan mereka; bentuk imperatif “perhatikanlah” mempertahankan daya retoris itu secara alami.
- source_word: κλῆσιν
  choice: panggilan
  rationale: Kata ini menunjuk pada panggilan Allah yang menentukan keadaan umat percaya, bukan pekerjaan atau kedudukan sosial mereka.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak maskulin Yunani dipertahankan dengan sapaan Indonesia yang lazim dan bermartabat; cakupannya atas seluruh jemaat dijelaskan dalam catatan kaki.
- source_word: οὐ πολλοὶ σοφοὶ
  choice: di antara kamu tidak banyak yang bijaksana
  rationale: Ungkapan eliptis Yunani dibuat wajar dalam bahasa Indonesia dengan memperjelas bahwa yang dimaksud ialah anggota jemaat Korintus.
- source_word: κατὰ σάρκα
  choice: menurut ukuran manusia
  rationale: Dalam konteks ini frasa tersebut menunjuk pada penilaian berdasarkan tolok ukur manusia, bukan daging secara harfiah atau tabiat berdosa.
- source_word: δυνατοί
  choice: yang berkuasa
  rationale: Pilihan ini mencakup kuasa atau pengaruh sosial tanpa membatasi jenis kekuasaan secara berlebihan.
- source_word: εὐγενεῖς
  choice: yang berasal dari kalangan bangsawan
  rationale: Istilah ini menunjuk pada kelahiran atau garis keturunan dengan status sosial tinggi; ungkapan ini jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna κατὰ σάρκα
  choice: menurut ukuran manusia
  alternative: menurut daging
  rationale: Terjemahan idiomatis menyampaikan sudut penilaian manusia yang dimaksud dalam konteks tanpa menambahkan gagasan tentang natur berdosa.
- issue: Cakupan ἀδελφοί
  choice: Saudara-saudara dengan catatan inklusif
  alternative: saudara-saudari
  rationale: Bentuk sapaan sumber tetap terlihat dalam teks utama, sementara cakupannya terhadap laki-laki dan perempuan dalam jemaat dijelaskan agar tidak disalahpahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel “tidak banyak” dipertahankan untuk menjaga tekanan retoris ayat, sedangkan “di antara kamu” memperjelas elipsis Yunani secara alami.
