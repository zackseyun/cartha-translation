  text: so that no one may say that you were baptized into my name[a].
translation:
  language: id
  text: agar tidak seorang pun berkata bahwa kalian dibaptis ke dalam namaku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam namaku.”
