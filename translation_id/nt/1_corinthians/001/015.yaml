lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil dan menghubungkan ayat ini secara alami dengan konteks sebelumnya.
- source_word: μή τις
  choice: jangan ada seorang pun
  rationale: Mengungkapkan subjek tak tentu yang dinegasikan dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: εἴπῃ
  choice: yang berkata
  rationale: Dalam konstruksi sesudah ἵνα μή τις, bentuk subjungtif ini paling alami disampaikan sebagai klausa relatif tanpa kehilangan sifat prospektifnya.
- source_word: εἰς
  choice: ke dalam
  rationale: Mempertahankan arah dan nuansa relasional dari preposisi Yunani, khususnya dalam ungkapan baptisan, tanpa menyamakannya secara diam-diam dengan 'dalam'.
- source_word: τὸ ἐμὸν ὄνομα
  choice: namaku
  rationale: Padanan posesif yang tepat, ringkas, dan alami bagi pembaca Indonesia modern.
- source_word: ἐβαπτίσθητε
  choice: kalian dibaptis
  rationale: Mempertahankan bentuk pasif dan memakai istilah baku yang netral mengenai cara pelaksanaan baptisan.
theological_decisions:
- issue: Pemaknaan εἰς τὸ ἐμὸν ὄνομα dalam konteks baptisan
  choice: ke dalam namaku
  alternative: dalam namaku
  rationale: ‘Ke dalam’ lebih dekat dengan εἰς dan mempertahankan nuansa identifikasi atau hubungan yang terkandung dalam ungkapan Yunani. ‘Dalam namaku’ juga mungkin secara idiomatis dan dicatat sebagai alternatif tanpa meniadakan ketegangan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘kalian’ dipakai untuk menandai orang kedua jamak secara jelas; susunan kalimat dibuat alami sambil mempertahankan hubungan tujuan dan ungkapan baptisan dalam teks Yunani.
