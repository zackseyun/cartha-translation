  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: id
  text: Allah setia; oleh Dia kalian telah dipanggil ke dalam persekutuan[a] dengan Anak-Nya, Yesus Sang Mesias, Tuhan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini juga dapat diterjemahkan “ambil bagian” atau “berbagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: setia
  rationale: Predikat ini menyatakan bahwa Allah dapat diandalkan dan tetap teguh pada janji-Nya; “setia” adalah padanan Indonesia yang alami dan berbobot teologis.
- source_word: δι’ οὗ
  choice: Oleh Dialah
  rationale: διά dengan genetif di sini menunjukkan Allah sebagai pelaku perantaraan panggilan tersebut. “Oleh Dialah” wajar dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: ἐκλήθητε
  choice: kalian telah dipanggil
  rationale: Bentuk pasif aoris καλέω menunjuk pada tindakan panggilan Allah yang telah terjadi. “Dipanggil” mempertahankan istilah Paulus tanpa mempersempitnya menjadi sekadar undangan.
- source_word: κοινωνίαν
  choice: bersekutu
  rationale: κοινωνία mencakup persekutuan, kebersamaan, dan partisipasi. Bentuk verbal “bersekutu dengan” paling alami dalam kalimat Indonesia dan tetap memuat dimensi relasional serta partisipatif.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: dengan Anak-Nya
  rationale: Walaupun bentuk Yunani adalah genetif, hubungan yang bergantung pada κοινωνία secara idiomatis dinyatakan dalam bahasa Indonesia sebagai bersekutu “dengan” seseorang.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Ἰησοῦ ditransliterasikan sebagai nama “Yesus,” sedangkan Χριστός diterjemahkan sebagai gelar “Mesias.” “Sang” menandai gelar itu secara alami dan penuh hormat.
- source_word: κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: “Tuhan” merupakan padanan baku bagi κύριος dalam gelar kristologis ini, dan “kita” mempertahankan kata ganti orang pertama jamak.
theological_decisions:
- issue: Apakah Χριστοῦ dipertahankan sebagai bentuk nama “Kristus” atau diterjemahkan sebagai gelar “Mesias.”
  choice: Mesias
  alternative: Kristus
  rationale: Dalam rangkaian ini Χριστός tetap membawa makna gelar bagi Yesus. Menerjemahkannya sebagai “Mesias” membuat arti gelar tersebut terbuka bagi pembaca tanpa menambahkan tafsiran denominasi.
- issue: Cakupan makna κοινωνία dengan Anak Allah.
  choice: bersekutu dengan
  alternative: mengambil bagian dalam / berbagi dalam
  rationale: “Bersekutu dengan” menyampaikan hubungan bersama Anak, tetapi teks Yunani juga dapat menonjolkan partisipasi atau ambil bagian; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk orang kedua jamak ἐκλήθητε secara jelas. Susunan dipecah setelah “Allah setia” agar alami, sedangkan “Dialah” mempertahankan penekanan bahwa Allah adalah pelaku panggilan.
