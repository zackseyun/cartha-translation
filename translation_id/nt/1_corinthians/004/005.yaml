id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: id
  text: Karena itu, janganlah menghakimi apa pun sebelum waktunya[a], sampai Tuhan datang. Ia juga akan membawa kepada terang hal-hal yang tersembunyi dalam kegelapan dan menyingkapkan maksud hati setiap orang[b][c]. Pada waktu itu, setiap orang akan menerima pujian dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebelum saat yang tepat” atau “terlalu dini.” Ungkapan Yunani menunjuk pada tindakan yang dilakukan sebelum waktunya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “niat hati” atau “dorongan hati setiap orang.”'
    reason: lexical_alternative
  - marker: c
    text: Yakni, ketika Tuhan datang dan menyingkapkan apa yang tersembunyi.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: janganlah menghakimi apa pun sebelum waktunya
  rationale: Mempertahankan luasnya τι dan nuansa temporal πρὸ καιροῦ tanpa menambahkan gagasan 'ditetapkan' yang tidak dinyatakan secara eksplisit.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: sampai Tuhan datang
  rationale: Menyampaikan batas waktu larangan secara langsung; gelar κύριος dipertahankan sebagai 'Tuhan'.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: akan membawa kepada terang hal-hal yang tersembunyi dalam kegelapan
  rationale: Mengungkapkan metafora penyingkapan secara alami sambil mempertahankan unsur terang, tersembunyi, dan kegelapan.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: menyingkapkan maksud hati setiap orang
  rationale: βουλαί dapat berarti maksud, niat, atau pertimbangan; bentuk Indonesia ini alami dan menyatakan bahwa hati-hati jamak menunjuk pada batin masing-masing orang.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: setiap orang akan menerima pujian dari Allah
  rationale: Menyampaikan secara alami bahwa pujian bagi masing-masing orang berasal dari Allah, tanpa mengubah pujian menjadi keselamatan atau pembenaran.
theological_decisions:
- issue: Cakupan dan waktu penghakiman
  choice: Larangan diterjemahkan secara luas tetapi dibatasi oleh frasa 'sebelum waktunya' dan 'sampai Tuhan datang'.
  alternative: Memahaminya sebagai larangan mutlak terhadap segala bentuk penilaian, atau hanya sebagai larangan menilai para rasul.
  rationale: Konstruksi Yunani melarang penghakiman yang mendahului penyingkapan pada kedatangan Tuhan, tetapi ayat ini sendiri tidak menjelaskan seluruh cakupan penilaian yang dibenarkan dalam konteks lain.
- issue: Identitas ὁ κύριος
  choice: Diterjemahkan sebagai 'Tuhan', yang dalam konteks Paulus paling wajar menunjuk kepada Yesus pada kedatangan-Nya.
  alternative: Memperluasnya menjadi 'Tuhan Yesus' atau memahaminya sebagai sebutan umum bagi Allah.
  rationale: Teks hanya memakai gelar 'Tuhan'; terjemahan mempertahankan bentuk itu tanpa menambahkan nama, sehingga daya kristologis dan kadar eksplisit sumber tetap terjaga.
- issue: Makna pujian bagi setiap orang
  choice: Diterjemahkan sebagai pujian yang diterima masing-masing orang dari Allah.
  alternative: Menafsirkan pujian sebagai putusan keselamatan, pembenaran, atau perkenanan yang pasti bagi semua orang.
  rationale: ἔπαινος berarti pujian; terjemahan tidak memperluasnya menjadi keputusan teologis yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Menghakimi' dipilih karena konteksnya adalah pemberian putusan atas orang lain; 'maksud hati setiap orang' menghindari bentuk harfiah yang kaku 'maksud hati-hati' sambil mempertahankan makna distributif. Semua penanda catatan kaki muncul dalam teks utama.
