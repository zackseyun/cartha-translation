  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: id
  text: Sebab sekalipun kamu mempunyai sepuluh ribu[a] pengasuh[b] dalam Mesias[c], namun kamu tidak mempunyai banyak bapak. Sebab dalam Mesias Yesus, melalui Injil, akulah yang telah menjadi bapakmu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tak terhitung banyaknya”; secara harfiah “sepuluh ribu”, yang dapat dipakai sebagai ungkapan untuk jumlah yang amat besar.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah orang yang mengawasi, membimbing, dan mendisiplinkan seorang anak, bukan terutama guru di ruang kelas.
    reason: cultural_note
  - marker: c
    text: Atau “Kristus”. Kata Yunani Χριστός berarti “Yang Diurapi” dan di sini diterjemahkan sebagai gelar “Mesias”.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “akulah yang memperanakkan kamu”; ini adalah metafora bagi peranan Paulus ketika mereka menerima iman melalui Injil.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: sepuluh ribu
  rationale: Makna harfiahnya dipertahankan karena ungkapan ini tetap wajar sebagai hiperbola dalam bahasa Indonesia; catatan kaki menjelaskan daya idiomatisnya sebagai jumlah yang amat besar.
- source_word: παιδαγωγοὺς
  choice: pengasuh
  rationale: Dalam lingkungan Yunani-Romawi, παιδαγωγός adalah orang yang mengawasi, membimbing, dan mendisiplinkan seorang anak, bukan terutama guru kelas. 'Pengasuh' paling dekat dengan fungsi sosial tersebut dalam bahasa Indonesia umum.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias / dalam Mesias Yesus
  rationale: Χριστός diperlakukan sebagai gelar dan diterjemahkan 'Mesias'. Kata depan 'dalam' dipertahankan agar ungkapan khas Paulus tidak dipersempit menjadi sekadar hubungan atau perantaraan.
- source_word: πατέρας
  choice: bapak
  rationale: Metafora kebapakan dipertahankan tanpa tambahan interpretatif seperti 'rohani'. 'Bapak' terasa alami dan bermartabat dalam kontras dengan para pengasuh.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: melalui Injil
  rationale: 'διά dengan bentuk genitif menyatakan sarana: Injil adalah sarana yang melaluinya Paulus menjadi bapak mereka dalam arti metaforis.'
- source_word: ἐγέννησα
  choice: akulah yang menjadi bapakmu
  rationale: Secara harfiah verba ini berarti 'memperanakkan/melahirkan'. Dalam konteks Paulus sebagai pihak laki-laki dan kontras dengan 'bapak', terjemahan ini menyampaikan metafora secara alami tanpa mengubahnya menjadi keterangan eksplisit tentang pertobatan.
theological_decisions:
- issue: Metafora Paulus sebagai bapak jemaat Korintus
  choice: akulah yang menjadi bapakmu
  alternative: aku telah memperanakkan kamu; aku menjadi bapak rohanimu
  rationale: Pilihan ini mempertahankan klaim kebapakan Paulus yang terkait dengan pemberitaan Injil, tetapi tidak menambahkan istilah 'rohani' atau menyimpulkan implikasi sakramental, klerikal, maupun denominasi tertentu.
- issue: Makna ungkapan 'dalam Mesias'
  choice: mempertahankan bentuk 'dalam Mesias'
  alternative: melalui Mesias; sebagai pengikut Mesias
  rationale: Ungkapan Yunani dapat memuat gagasan ranah, hubungan, atau persatuan. Mempertahankan 'dalam' menjaga keluasan dan ketegangan maknanya tanpa memilih satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur sebab–kontras–sebab dipertahankan. 'Sepuluh ribu' menjaga gambaran retoris sumber, sedangkan 'pengasuh' menghindari anakronisme 'guru'. Bentuk 'akulah' menyampaikan penekanan eksplisit pada ἐγώ.
