source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: id
  text: 'Saudara-saudara,[a] hal-hal ini telah saya terapkan kepada diri saya sendiri dan Apolos demi kalian, supaya melalui kami kalian belajar hal ini: “Jangan melampaui apa yang tertulis,”[b] supaya tidak seorang pun di antara kalian menjadi sombong dengan memihak yang satu dan menentang yang lain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, sapaan “saudara-saudara” dapat ditujukan kepada kelompok yang terdiri dari laki-laki dan perempuan.
    reason: cultural_note
  - marker: b
    text: 'Bahasa Yunani di sini eliptis; secara lebih harfiah, “yang: ‘tidak melampaui apa yang tertulis.’” Ungkapan ini mungkin merupakan semboyan atau rumusan ringkas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak menunjuk kembali pada pembahasan sebelumnya dan mempertahankan cakupan anaforisnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia yang wajar dan bermartabat; dalam konteks jemaat, bentuk Yunani ini dapat mencakup laki-laki dan perempuan, sebagaimana dijelaskan dalam catatan kaki.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: telah saya terapkan kepada diri saya sendiri dan Apolos
  rationale: Menyampaikan pemindahan atau penerapan retoris pembahasan sebelumnya kepada Paulus dan Apolos tanpa memperluas maknanya secara berlebihan.
- source_word: δι’ ὑμᾶς
  choice: demi kalian
  rationale: διά dengan akusatif di sini paling wajar menyatakan kepentingan atau manfaat bagi para pembaca.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: supaya melalui teladan kami kalian belajar
  rationale: Ungkapan Yunani bersifat padat; terjemahan ini menjelaskan bahwa Paulus dan Apolos menjadi contoh tempat pelajaran itu terlihat, sambil mempertahankan fungsi klausa tujuan.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'prinsip ini: “Jangan melampaui apa yang tertulis,”'
  rationale: Artikel τό memperkenalkan isi pelajaran. Bahasa Yunani eliptis; bentuk larangan dalam bahasa Indonesia menyampaikan daya nasihatnya, sementara catatan kaki mempertahankan ketidaklangsungan bentuk aslinya.
- source_word: γέγραπται
  choice: yang tertulis
  rationale: Perfek pasif ini lazim berfungsi sebagai rumusan yang menunjuk pada tulisan berwibawa; bentuk Indonesia ini alami dan tidak menentukan secara berlebihan tulisan mana yang dimaksud.
- source_word: φυσιοῦσθε
  choice: menjadi sombong
  rationale: Metafora harfiah 'menggembung' kurang alami dalam bahasa Indonesia; 'menjadi sombong' menyampaikan makna kontekstual secara jelas.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: memihak yang satu dan menentang yang lain
  rationale: Menampilkan pertentangan partisan dalam jemaat secara alami serta mempertahankan dua arah relasinya.
theological_decisions:
- issue: Makna klausa eliptis τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Diterjemahkan sebagai nasihat: “Jangan melampaui apa yang tertulis.”'
  alternative: '“Tidak melampaui apa yang tertulis” atau memperlakukannya sebagai semboyan: “Tidak lebih dari apa yang tertulis.”'
  rationale: Klausa Yunani tidak memuat verba eksplisit dan mungkin berupa semboyan atau rumusan ringkas. Dalam konteks, klausa itu paling masuk akal sebagai pelajaran yang harus ditaati; catatan kaki mengakui bentuk eliptis dan kemungkinan semboyan agar ambiguitas sumber tidak dihapus.
- issue: Rujukan 'apa yang tertulis'
  choice: Tidak diperinci sebagai seluruh Kitab Suci atau kutipan tertentu.
  alternative: Menjelaskannya secara eksplisit sebagai batas-batas Kitab Suci atau sebagai kutipan-kutipan sebelumnya.
  rationale: Teks tidak menentukan rujukannya secara tegas; terjemahan mempertahankan ketegangan ini dan tidak memasukkan kesimpulan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Kata ganti jamak “kalian” dipakai untuk membedakan penerima jamak dari Paulus sebagai penutur. Susunan dibuat alami tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
