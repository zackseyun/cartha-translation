id: 1CO.4.20
reference: 1 Corinthians 4:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: id
  text: Sebab Kerajaan Allah tidak terletak dalam perkataan[a], melainkan dalam kuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam pembicaraan” atau “dalam kata-kata belaka”; yang dipertentangkan ialah retorika kosong dengan kuasa yang efektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ menghubungkan ayat ini sebagai alasan bagi pernyataan sebelumnya; “sebab” merupakan penghubung yang alami dan ringkas, sedangkan οὐ menegasikan klausa.
- source_word: ἐν λόγῳ
  choice: dalam perkataan
  rationale: λόγος dapat berarti perkataan, pembicaraan, atau ucapan. “Dalam perkataan” mempertahankan bentuk antitesis Yunani dengan “dalam kuasa,” sementara catatan kaki menjelaskan bahwa yang dimaksud dalam konteks ialah perkataan atau retorika belaka.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia ini mempertahankan cakupan βασιλεία yang dapat menunjuk pada pemerintahan maupun ranah kerajaan Allah tanpa mempersempit maknanya.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: melainkan dalam kuasa
  rationale: δύναμις secara langsung berarti kuasa dan membentuk pertentangan tajam dengan λόγος. “Melainkan” cocok setelah klausa negatif dan menegaskan realitas kuasa yang efektif.
theological_decisions:
- issue: Sifat pertentangan antara “perkataan” dan “kuasa”
  choice: Ayat ini mempertentangkan perkataan atau retorika belaka dengan kuasa yang efektif sebagai ciri Kerajaan Allah, tanpa menentukan secara khusus bentuk kuasa tersebut.
  alternative: Kuasa dapat ditafsirkan khusus sebagai mukjizat, perubahan hidup dan disiplin jemaat, kewibawaan rasuli, atau karya Roh.
  rationale: Teks Yunani hanya menyatakan pertentangan yang luas antara λόγος dan δύναμις. Terjemahan tidak seharusnya mempersempit rujukan “kuasa” melampaui apa yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi “Kerajaan Allah” mengikuti kelaziman istilah teologis Indonesia. Susunan “tidak terletak dalam ... melainkan dalam ...” membuat konstruksi ἐν ... ἀλλ’ ἐν ... alami sekaligus mempertahankan antitesis sumber.
