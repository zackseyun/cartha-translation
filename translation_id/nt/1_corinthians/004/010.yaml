  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: id
  text: Kami bodoh demi Mesias[a], tetapi kamu bijaksana dalam Mesias[b]. Kami lemah, tetapi kamu kuat. Kamu dihormati[c], tetapi kami tidak dihormati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Mesias.” Frasa Yunani διὰ Χριστόν dapat menyatakan alasan atau kepentingan/tujuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam Kristus.” Teks Yunani memakai ungkapan khas Paulus ἐν Χριστῷ.
    reason: lexical_alternative
  - marker: c
    text: “Dihormati” dan “tidak dihormati” di sini terutama menunjuk pada status publik—kehormatan atau aib di mata orang lain—bukan sekadar perasaan batin.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: bodoh
  rationale: Mempertahankan daya retoris yang tajam dan ironi dalam pertentangan dengan anggapan jemaat Korintus tentang diri mereka.
- source_word: διὰ Χριστόν
  choice: karena Mesias
  rationale: διά dengan akusatif dapat menyatakan sebab atau alasan; ungkapan ini alami dalam bahasa Indonesia dan tidak menutup kemungkinan nuansa 'demi Mesias'.
- source_word: φρόνιμοι
  choice: bijaksana
  rationale: Padanan langsung yang menjaga antitesis retoris dengan 'bodoh'.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Mempertahankan ungkapan khas Paulus dengan preposisi 'dalam' dan memperlakukan Χριστός sebagai gelar.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: lemah / kuat
  rationale: Pasangan antonim yang lugas dan mempertahankan kesejajaran kalimat Yunani.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: dihormati / tidak dihormati
  rationale: Menyampaikan pertentangan status sosial dan penilaian publik tanpa mengartikan ἄτιμοι secara lebih keras sebagai 'dihina'.
- source_word: ἡμεῖς / ὑμεῖς
  choice: kami / kamu
  rationale: Kata ganti eksplisit dipertahankan karena bersifat emfatis; 'kami' membedakan kelompok Paulus dari para pembaca yang disapa sebagai 'kamu'.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam kedua frasa, istilah tersebut dipertahankan sebagai gelar mesianik, bukan diperlakukan semata-mata sebagai nama diri.
- issue: Makna διὰ Χριστόν
  choice: karena Mesias
  alternative: demi Mesias
  rationale: Bentuk Yunani dapat mengungkapkan alasan atau kepentingan/tujuan; teks utama memakai bentuk sebab yang alami, sedangkan alternatif dicatat agar ambiguitas tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan struktur antitesis yang ringkas dan bernada tajam. Pengulangan kata ganti menjaga tekanan retoris teks Yunani.
