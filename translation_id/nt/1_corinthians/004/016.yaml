  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: id
  text: 'Karena itu, aku mendesak kalian: jadilah peniru-peniruku.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jadilah orang-orang yang meniru aku.”
    reason: lexical_alternative
  - marker: b
    text: Di bagian lain Paulus berkata, “Jadilah peniru-peniruku, sebagaimana aku juga peniru Kristus” (1Kor. 11:1).
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: aku mendesak kalian
  rationale: Dalam konteks nasihat Paulus, kata ini menyampaikan desakan yang sungguh-sungguh. “Mendesak” mempertahankan daya serunya dengan bahasa Indonesia modern dan wajar.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata ini menyatakan kesimpulan atau konsekuensi dari uraian sebelumnya; “karena itu” memperjelas hubungan logis tersebut.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini berbentuk jamak. “Kalian” secara alami mempertahankan bahwa Paulus menyapa seluruh jemaat.
- source_word: μιμηταί
  choice: peniru
  rationale: Kata ini menunjuk kepada orang yang meniru atau meneladani pola seseorang. “Peniru” merupakan padanan langsung dan mempertahankan kekuatan ungkapan Yunani.
- source_word: μου
  choice: aku
  rationale: Genitif ini menyatakan orang yang ditiru. Dalam konstruksi Indonesia “peniru aku,” bentuk “aku” mempertahankan hubungan tersebut secara ringkas; catatan kaki menyediakan susunan alternatif yang lebih idiomatis.
- source_word: γίνεσθε
  choice: jadilah
  rationale: Imperatif kini dari γίνομαι menyerukan agar para pembaca mengambil atau memasuki keadaan tersebut. “Jadilah” lebih tepat daripada sekadar “tirulah” karena mempertahankan gagasan menjadi peniru.
theological_decisions:
- issue: Nasihat Paulus agar jemaat meniru dirinya dapat terdengar terlalu kuat bila dilepaskan dari konteksnya yang berpusat pada Kristus, tetapi ayat ini sendiri secara eksplisit menempatkan Paulus sebagai teladan langsung.
  choice: Menerjemahkan secara langsung “jadilah peniru aku” tanpa memperlunaknya.
  alternative: “teladanilah aku” atau “ikutilah teladanku”
  rationale: Bahasa Yunani dengan jelas menyebut Paulus sebagai pribadi yang harus ditiru. Terjemahan utama mempertahankan ketegangan teologis ayat, sedangkan rujukan silang menjelaskan konteks Paulus yang lebih luas tanpa memasukkannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Aku/kalian” dipakai untuk mempertahankan sapaan pribadi Paulus sekaligus menandai bentuk jamak ὑμᾶς. Ungkapan utama sengaja cukup harfiah agar seruan untuk meniru Paulus tidak dilemahkan.
