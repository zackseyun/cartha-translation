    rationale: Ungkapan ini tidak mempertahankan citra φυσιόω ('mengembang/terkembung') dan lebih bernuansa percakapan daripada register surat yang baku. Padanan 'telah menjadi sombong' lebih alami dan akurat secara makna, dengan metafora sumber dipelihara dalam catatan kaki.
