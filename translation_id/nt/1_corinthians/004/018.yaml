  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: id
  text: Beberapa orang telah menjadi sombong[a], seolah-olah aku tidak akan datang kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah terkembung.” Paulus berulang kali memakai gambaran ini untuk kesombongan yang membesarkan diri dalam 1 Korintus; lihat 4:6, 4:19, 5:2, 8:1, dan 13:4.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὡς
  choice: seolah-olah
  rationale: Menandai anggapan yang mendasari sikap mereka tanpa menyatakannya sebagai kenyataan.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: aku tidak akan datang kepada kalian
  rationale: Konstruksi partisipial genitif dengan μή bergantung pada ὡς dan mengungkapkan situasi yang mereka sangka. Bentuk dengan 'akan' wajar dalam bahasa Indonesia dan sesuai dengan konteks rencana kedatangan Paulus.
- source_word: δέ
  choice: tidak diterjemahkan secara eksplisit
  rationale: Partikel ini hanya menghubungkan secara ringan dengan ayat sebelumnya; alur kalimat bahasa Indonesia sudah menyampaikan fungsi tersebut.
- source_word: ἐφυσιώθησάν
  choice: menjadi besar kepala
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran kesombongan yang menggelembung dalam metafora Paulus, meskipun tidak menyalin citra fisiknya secara harfiah.
- source_word: τινες
  choice: Beberapa orang
  rationale: Menunjuk pada sebagian orang dalam jemaat secara tak tentu dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cara menyampaikan teguran Paulus terhadap kesombongan jemaat Korintus
  choice: Memakai ungkapan metaforis 'besar kepala'.
  alternative: Beberapa orang menjadi sombong, seolah-olah aku tidak akan datang kepada kalian.
  rationale: Pilihan ini mempertahankan bahasa kiasan Paulus dan kesinambungan retoris pemakaian φυσιόω dalam surat ini tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. 'Besar kepala' merupakan ungkapan umum namun tetap pantas untuk teguran bernada tajam.
