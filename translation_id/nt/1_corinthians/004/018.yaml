    rationale: '''Menjadi'' dapat dipahami sebagai proses umum. ''Telah menjadi'' secara idiomatis menyatakan bahwa sebagian orang itu sudah sampai pada keadaan sombong, tanpa memaksakan nilai perfektif Yunani.'
