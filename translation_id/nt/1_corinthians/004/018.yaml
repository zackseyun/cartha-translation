  source_fidelity: 'Frasa ''seolah-olah aku tidak akan datang kepada kalian'' dengan baik menyampaikan ὡς + konstruksi partisipial genitif bernegasi: ini adalah anggapan mereka, bukan pernyataan Paulus. ''Beberapa orang'' tepat untuk τινες. Namun, ''menjadi besar kepala'' kurang tepat untuk ἐφυσιώθησαν karena idiom itu terutama mengalihkan citra ''kepala'' dan tidak mempertahankan metafora Paulus tentang ''mengembang/terkembung,'' yang berulang dalam surat ini. Selain itu, aoris lebih wajar diterjemahkan sebagai keadaan yang telah terjadi (''telah menjadi'').'
  naturalness: '''Besar kepala'' dan ''kalian'' sama-sama lazim dalam bahasa Indonesia modern, tetapi ''besar kepala'' terasa lebih percakapan dan tidak sepadan secara metaforis dengan istilah yang dipakai Paulus berulang kali. ''Telah menjadi sombong'' adalah baku, alami, dan jelas; catatan kaki dapat menjaga citra harfiah ''terkembung'' serta alternatif metaforisnya.'
  terminology: Untuk φυσιόω, 'sombong' pada teks utama merupakan padanan idiomatis yang aman; catatan kaki perlu mencatat metafora dasar 'terkembung/mengembang karena kesombongan' dan konsistensinya dalam 1 Korintus. 'Datang kepada kalian' tepat dan mempertahankan orang kedua jamak tanpa penghalusan yang tidak perlu.
