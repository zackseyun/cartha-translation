id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: id
  text: 'Demikianlah hendaknya setiap orang memandang kami: sebagai pelayan Mesias[a] dan penatalayan rahasia-rahasia Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Christos merupakan gelar yang berarti “Yang Diurapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: sebagai
  rationale: Daya penunjuk cara dari Οὕτως disampaikan secara alami melalui susunan 'memandang kami sebagai'; terjemahan kaku 'demikianlah' tidak diperlukan dalam bahasa Indonesia.
- source_word: ἡμᾶς
  choice: kami
  rationale: Objek langsung λογιζέσθω, yang merujuk kepada Paulus dan rekan-rekan pelayanannya, bukan pembaca.
- source_word: λογιζέσθω
  choice: hendaklah ... memandang
  rationale: Bentuk imperatif kini menyatakan penilaian yang dituntut; 'hendaklah ... memandang' mempertahankan daya normatifnya dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἄνθρωπος
  choice: setiap orang
  rationale: Dalam konteks ini nomina tunggal tersebut bersifat generik. 'Setiap orang' menyatakan cakupan umum secara alami tanpa mengubah rujukannya menjadi khusus laki-laki.
- source_word: ὡς
  choice: sebagai
  rationale: Menandai kedudukan atau kapasitas yang menjadi dasar penilaian terhadap Paulus dan rekan-rekannya.
- source_word: ὑπηρέτας
  choice: pelayan
  rationale: Menunjukkan orang yang melayani dalam kedudukan bawahan, tanpa konotasi status perbudakan yang melekat pada δοῦλος.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini dipahami sebagai gelar bagi pribadi yang dilayani; 'Mesias' mempertahankan kandungan gelarnya. Alternatif tradisional 'Kristus' dicatat dalam catatan kaki.
- source_word: οἰκονόμους
  choice: pengelola
  rationale: Menggambarkan orang yang dipercayai untuk mengurus milik atau rumah tangga pihak lain. 'Pengelola' lebih mudah dipahami pembaca Indonesia modern daripada 'penatalayan'.
- source_word: μυστηρίων
  choice: rahasia-rahasia
  rationale: Bentuk jamak dipertahankan. Dalam pemakaian Paulus, istilah ini menunjuk pada kebenaran atau maksud ilahi yang sebelumnya tersembunyi dan dinyatakan Allah; 'rahasia-rahasia' tidak menambahkan penjelasan itu ke dalam teks.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif ini paling alami menyatakan bahwa rahasia-rahasia tersebut berasal dari dan berada dalam wewenang Allah.
theological_decisions:
- issue: Terjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Konteks pelayanan kepada Sang Terurapi memungkinkan daya gelar tetap terasa. Catatan kaki menjaga padanan gerejawi tradisional tanpa memaksakan bahwa gelar itu sudah sepenuhnya menjadi nama diri.
- issue: Cakupan ἄνθρωπος yang maskulin secara gramatikal
  choice: setiap orang
  alternative: seseorang; seorang manusia
  rationale: ἄνθρωπος di sini generik dan tidak membatasi perintah pada laki-laki. Bahasa Indonesia tidak perlu meniru gender gramatikal Yunani, sehingga 'setiap orang' menyampaikan cakupan yang dimaksud dengan tepat.
- issue: Makna μυστηρίων θεοῦ
  choice: rahasia-rahasia Allah
  alternative: misteri-misteri Allah; rahasia-rahasia yang dinyatakan Allah
  rationale: Terjemahan ini mempertahankan metafora dan ketegangan istilah tanpa menyisipkan gagasan 'telah dinyatakan' yang, walaupun sering tersirat dalam pemakaian Paulus, tidak dinyatakan secara eksplisit di ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan imperatif dibuat alami dengan 'Hendaklah setiap orang'. Istilah 'pengelola' dipilih agar metafora tanggung jawab yang dipercayakan tetap jelas bagi pembaca umum.
