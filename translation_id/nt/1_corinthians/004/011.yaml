  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: id
  text: Sampai pada saat ini kami lapar dan haus, dan kekurangan pakaian, dan dipukuli, dan tidak mempunyai tempat tinggal tetap[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Dapat juga diterjemahkan, “mengembara” atau “tidak mempunyai kediaman yang menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Sampai saat ini pun
  rationale: Ungkapan ini menyatakan keadaan yang berlangsung hingga waktu sekarang; kata “pun” mempertahankan penekanan ἄρτι secara wajar dalam bahasa Indonesia.
- source_word: πεινῶμεν
  choice: kami lapar
  rationale: Bentuk kini menggambarkan keadaan yang sedang dan terus dialami; ungkapan ini lugas dan alami.
- source_word: διψῶμεν
  choice: haus
  rationale: Dikoordinasikan dengan “lapar” sebagai keadaan kekurangan yang berkelanjutan; subjek “kami” dipahami dari frasa sebelumnya.
- source_word: γυμνιτεύομεν
  choice: kekurangan pakaian
  rationale: Kata kerja ini dapat menunjuk pada tidak adanya pakaian yang memadai, bukan hanya ketelanjangan mutlak. Pilihan ini menjaga keluasan maknanya tanpa melebih-lebihkan.
- source_word: κολαφιζόμεθα
  choice: dipukuli
  rationale: Bentuk pasif kini menyampaikan perlakuan fisik yang berulang. “Dipukuli” alami dalam bahasa Indonesia dan tidak membatasi tindakan itu pada satu jenis pukulan.
- source_word: ἀστατοῦμεν
  choice: hidup tanpa tempat tinggal tetap
  rationale: Pilihan ini menyatakan ketidakmenetapan dan ketiadaan tempat kediaman yang tetap, tanpa mempersempit makna hanya pada kategori sosial modern “tunawisma”.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: dan ... dan ... dan ...
  rationale: Pengulangan “dan” mempertahankan irama kumulatif serta deretan penderitaan dalam teks Yunani.
theological_decisions:
- issue: Sifat penggambaran diri Paulus
  choice: Daftar nyata tentang kekurangan dan perlakuan buruk yang terus dialami para rasul
  alternative: Gambaran yang terutama retoris atau hiperbolis
  rationale: Teks memakai bentuk-bentuk indikatif kini untuk menyebut penderitaan konkret. Terjemahan mempertahankan bahasa yang lugas tanpa memperkeras atau memperlunaknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan “dan” sengaja dipertahankan untuk mencerminkan tekanan retoris teks Yunani, sementara frasa-frasa penderitaan dibuat mudah dipahami pembaca umum.
