  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: id
  text: Ketika difitnah[a], kami memohon; kami telah menjadi seperti sampah dunia, ampas segala sesuatu[b], sampai sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika nama kami dicemarkan, kami mengimbau.” Kata Yunani yang diterjemahkan “memohon” juga dapat berarti “mengimbau,” “mendesak,” atau “menguatkan”; di sini tampaknya menunjuk pada tanggapan yang tidak membalas penghinaan dengan penghinaan.
    reason: lexical_alternative
  - marker: b
    text: Kedua istilah yang diterjemahkan “sampah” dan “ampas” langka dan sangat keras. Keduanya dapat menggambarkan sesuatu yang disapu, dikerik, atau diseka dalam proses pembersihan lalu dibuang; kemungkinan latar ritualnya tidak pasti. Ungkapan “segala sesuatu” juga dapat dipahami sebagai “semua orang.”
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Ketika difitnah
  rationale: Partisipel pasif ini menggambarkan para rasul sebagai sasaran perkataan yang mencemarkan nama mereka. Bentuk temporal dengan “ketika” alami dalam bahasa Indonesia dan mempertahankan fungsi adverbialnya.
- source_word: παρακαλοῦμεν
  choice: kami memohon
  rationale: Dalam rangkaian kontras ini, kata kerja tersebut paling mungkin menunjuk pada tanggapan yang bersifat memohon atau mendamaikan, bukan membalas cercaan. Terjemahan ini tidak menambahkan keterangan cara yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini memperkenalkan perbandingan, bukan menyatakan identitas secara kaku.
- source_word: περικαθάρματα τοῦ κόσμου
  choice: sampah dunia
  rationale: Istilah langka ini menunjuk pada sesuatu yang dibuang dalam proses pembersihan dan secara kiasan menyatakan kehinaan sosial yang ekstrem. “Sampah” kuat, jelas, dan lazim bagi pembaca modern.
- source_word: ἐγενήθημεν
  choice: kami telah menjadi
  rationale: Bentuk aoris menyatakan keadaan yang dihasilkan oleh pengalaman para rasul dan masih berlangsung sampai saat penulisan, sehingga bentuk “telah menjadi” sesuai dengan frasa penutup ayat.
- source_word: πάντων περίψημα
  choice: kotoran dari segala sesuatu
  rationale: Istilah langka ini secara harfiah berkaitan dengan sesuatu yang dikerik atau diseka hingga terbuang. “Kotoran” mempertahankan daya hina ungkapan itu, sedangkan “segala sesuatu” tidak mempersempit πάντων menjadi orang saja.
- source_word: ἕως ἄρτι
  choice: sampai sekarang
  rationale: Ungkapan temporal ini menunjukkan bahwa keadaan tersebut terus berlangsung hingga saat Paulus menulis.
theological_decisions:
- issue: Makna dua istilah penghinaan περικαθάρματα dan περίψημα
  choice: Menerjemahkannya sebagai gambaran kehinaan sosial yang tajam, yakni “sampah” dan “kotoran”, tanpa memasukkan gagasan korban penebus ke dalam teks utama.
  alternative: Menafsirkannya sebagai istilah teknis yang mengacu pada korban pemurnian atau semacam kambing hitam.
  rationale: Latar pemurnian atau penggunaan ritual mungkin membayangi kedua kata langka ini, tetapi konteks langsung menekankan penghinaan dan penolakan yang dialami para rasul. Kemungkinan latar khusus itu lebih tepat dicatat dalam catatan kaki daripada dijadikan pernyataan teologis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Istilah “sampah” dan “kotoran” sengaja dipertahankan karena kekerasan retorika teks sumber; susunan kedua frasa dibuat cukup formal untuk menjaga keluasan dan keasingan metafora Yunani.
