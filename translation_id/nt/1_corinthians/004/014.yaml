id: 1CO.4.14
reference: 1 Corinthians 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: id
  text: Aku menulis hal-hal ini bukan untuk mempermalukan kalian, melainkan untuk menasihati kalian sebagai anak-anakku yang terkasih.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντρέπων
  choice: untuk mempermalukan
  rationale: 'Dengan οὐκ dan verba utama γράφω, bentuk partisip ini secara alami menyatakan maksud yang ditolak: Paulus tidak menulis dengan tujuan membuat mereka merasa malu. Pilihan ini mempertahankan daya sosial rasa malu tanpa melemahkannya menjadi sekadar rasa canggung.'
- source_word: γράφω ταῦτα
  choice: Aku menulis hal-hal ini
  rationale: Bentuk kini epistoler γράφω wajar diterjemahkan dengan bentuk kini Indonesia, sedangkan bentuk jamak ταῦτα dipertahankan melalui 'hal-hal ini'.
- source_word: ἀλλ’
  choice: melainkan
  rationale: Konjungsi ini menandai pertentangan tegas antara maksud yang ditolak dan tindakan pastoral Paulus; 'melainkan' alami setelah konstruksi 'bukan ...'.
- source_word: ὡς
  choice: sebagai
  rationale: Menunjukkan hubungan yang menjadi dasar nasihat Paulus tanpa mengubahnya menjadi perbandingan hipotetis.
- source_word: τέκνα μου
  choice: anak-anakku
  rationale: τέκνα mencakup semua gender dan menyatakan relasi sebagai anak, sementara μου dipertahankan dalam bentuk posesif yang akrab.
- source_word: ἀγαπητὰ
  choice: yang terkasih
  rationale: Pilihan ini mempertahankan kehangatan afektif dan ragam bahasa Kitab Suci yang bermartabat.
- source_word: νουθετῶν
  choice: untuk menasihati kalian
  rationale: Kata ini mencakup pemberian arahan korektif atau peringatan. 'Menasihati' terdengar alami dan pastoral dalam bahasa Indonesia, sambil tetap menyiratkan koreksi; konstruksi tujuan menghasilkan kalimat Indonesia yang jelas.
theological_decisions:
- issue: Nada koreksi pastoral Paulus
  choice: menasihati kalian sebagai anak-anakku yang terkasih
  alternative: memperingatkan kalian sebagai anak-anakku yang terkasih
  rationale: νουθετῶν memiliki unsur koreksi dan peringatan, tetapi konteks τέκνα μου ἀγαπητά membingkainya dalam kasih kebapakan. 'Menasihati' mempertahankan dimensi pastoral tanpa menjadikannya kecaman keras.
- issue: Hubungan logis kedua partisip dengan verba 'menulis'
  choice: bukan untuk mempermalukan ... melainkan untuk menasihati
  alternative: bukan sambil mempermalukan ... melainkan sambil menasihati
  rationale: Bahasa Yunani memungkinkan nuansa cara atau maksud. Dalam konteks ini, konstruksi tujuan paling alami dan menyampaikan pertentangan antara tujuan yang ditolak dan tujuan korektif Paulus tanpa menetapkan doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab, hangat, dan bermartabat. Pronomina 'Aku/kalian' dipilih untuk mempertahankan suara pribadi Paulus serta sapaan jamak yang jelas; tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini.
