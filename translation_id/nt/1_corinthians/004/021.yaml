base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: id
  text: Apa yang kalian kehendaki? Haruskah aku datang kepada kalian dengan tongkat, atau dengan kasih dan roh yang lemah lembut[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kasih dan kelemahlembutan.” Frasa “roh yang lemah lembut” terutama dapat menunjuk pada sikap lemah lembut Paulus; sebagian orang memahaminya sebagai rujukan tersirat pada karya Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Apa yang kalian kehendaki?
  rationale: Pertanyaan langsung ini mempertahankan daya tantangan retoris Paulus. 'Kehendaki' alami dalam bahasa Indonesia baku dan sedikit lebih bermartabat daripada 'mau'.
- source_word: ἐν ῥάβδῳ
  choice: dengan tongkat
  rationale: ῥάβδος secara konkret berarti tongkat. Pilihan ini mempertahankan metafora tajam tentang wewenang dan tindakan disipliner tanpa menggantinya dengan tafsiran abstrak.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Haruskah aku datang kepada kalian
  rationale: Bentuk subjungtif deliberatif diterjemahkan sebagai pertanyaan 'Haruskah aku', yang alami dan mempertahankan pilihan retoris mengenai cara Paulus datang.
- source_word: ἐν ἀγάπῃ
  choice: dengan kasih
  rationale: Kata depan ἐν di sini menyatakan cara atau suasana kedatangan dan disejajarkan dengan 'dengan tongkat'; 'kasih' merupakan padanan yang mapan bagi ἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: dan roh kelemahlembutan
  rationale: Terjemahan ini mempertahankan unsur πνεῦμα dan konstruksi genitif πραΰτης, sekaligus membiarkan terbuka apakah 'roh' terutama menunjuk pada sikap batin Paulus atau terkait dengan karya Roh Kudus.
theological_decisions:
- issue: Rujukan πνεύματι dalam frasa πνεύματί τε πραΰτητος
  choice: roh kelemahlembutan, tanpa kapitalisasi
  alternative: Roh kelemahlembutan, sebagai rujukan kepada Roh Kudus
  rationale: Konteks langsung membandingkan dua cara Paulus datang, sehingga 'roh' paling wajar menunjuk pada sikap atau pembawaan yang lemah lembut. Namun, karena bentuk Yunani tidak dengan sendirinya meniadakan kaitan dengan karya Roh Kudus, ambiguitas itu dicatat dan tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa ὑμᾶς bersifat jamak. Metafora 'tongkat' dipertahankan, dan frasa penutup dibuat cukup harfiah untuk menjaga ambiguitas sumber.
