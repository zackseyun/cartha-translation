  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: id
  text: Namun, aku akan segera datang kepada kalian, jika Tuhan menghendaki, dan aku akan mencari tahu bukan perkataan orang-orang yang sombong[a], melainkan kuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini secara harfiah menggambarkan orang-orang yang telah “menggelembung”; Paulus memakainya berulang kali dalam surat ini untuk kesombongan atau keangkuhan.
    reason: metaphor_and_cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Namun, aku akan segera datang kepada kalian
  rationale: Bentuk futur diterjemahkan sebagai rencana kedatangan; δέ menyatakan kontras ringan dengan konteks sebelumnya, dan ταχέως menunjuk pada waktu yang dekat.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: jika Tuhan menghendakinya
  rationale: Mempertahankan syarat bahwa kedatangan Paulus bergantung pada kehendak Tuhan tanpa memperinci identitas κύριος melampaui teks.
- source_word: γνώσομαι
  choice: Aku akan mengetahui
  rationale: Mempertahankan arti dasar verba, dengan konteks yang menunjukkan bahwa Paulus akan memastikan keadaan itu melalui kunjungannya.
- source_word: τὸν λόγον
  choice: perkataan
  rationale: λόγος di sini menunjuk pada apa yang dikatakan dan dikontraskan secara ringkas dengan kuasa; 'perkataan' cukup formal dan tidak mempersempitnya menjadi retorika atau ajaran tertentu.
- source_word: τῶν πεφυσιωμένων
  choice: orang-orang yang membusungkan diri
  rationale: Ungkapan ini mempertahankan metafora Paulus tentang orang yang menggelembung karena kesombongan serta keadaan yang berlanjut dalam bentuk partisip perfek.
- source_word: τὴν δύναμιν
  choice: kuasa mereka
  rationale: Pronomina tersirat dipasok agar kontras eliptis menjadi alami dalam bahasa Indonesia; catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah, 'kuasa'.
theological_decisions:
- issue: Rujukan sebutan ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks hanya menyebut 'Tuhan'. Terjemahan tidak menentukan secara eksplisit apakah yang dimaksud adalah Yesus atau Allah Bapa.
- issue: Kontras λόγος dan δύναμις
  choice: perkataan dan kuasa
  alternative: retorika dan kuasa kerasulan; isi ajaran dan kuasa mukjizat
  rationale: Kontras luas antara ucapan dan realitas kuasa dipertahankan tanpa membatasi jenis kuasa yang dimaksud.
- issue: Pemilik kuasa dalam frasa eliptis τὴν δύναμιν
  choice: kuasa mereka
  alternative: kuasa
  rationale: Secara sintaksis, genitif 'orang-orang yang membusungkan diri' dapat dipahami bersama kedua objek yang dikontraskan. Penambahan 'mereka' memperjelas bahasa sasaran tanpa menetapkan bentuk khusus kuasa itu; bentuk ringkas dicatat sebagai alternatif.
translation_notes:
  register: Menggunakan bahasa Indonesia baku yang alami dan bermartabat. Pronomina 'aku/kalian' mengikuti sapaan pribadi Paulus kepada jemaat dan membedakan bentuk jamak secara jelas. Struktur kalimat dibagi dua agar kontras utama mudah dipahami tanpa menghilangkan hubungan logisnya.
