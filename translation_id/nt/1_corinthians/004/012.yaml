id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: id
  text: dan kami berjerih lelah, bekerja dengan tangan kami sendiri. Ketika dicaci, kami memberkati; ketika dianiaya, kami bertahan;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: kami berjerih lelah
  rationale: Mengungkapkan kerja keras yang menguras tenaga, bukan sekadar bekerja, dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: ἐργαζόμενοι
  choice: bekerja
  rationale: Partisipel ini menerangkan cara mereka berjerih lelah, yaitu melalui pekerjaan tangan, tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: ταῖς ἰδίαις χερσίν
  choice: dengan tangan kami sendiri
  rationale: Mempertahankan penekanan ἰδίαις pada pekerjaan manual yang dilakukan sendiri.
- source_word: λοιδορούμενοι
  choice: ketika dicaci
  rationale: Bentuk pasif ini menggambarkan perlakuan verbal yang menghina; 'dicaci' ringkas, jelas, dan sesuai dengan pola antitesis ayat.
- source_word: εὐλογοῦμεν
  choice: kami memberkati
  rationale: Mempertahankan istilah biblis utama dan kontras antara menerima cacian dan membalas dengan berkat.
- source_word: διωκόμενοι
  choice: ketika dianiaya
  rationale: Dalam konteks permusuhan terhadap para rasul, kata ini secara wajar berarti mengalami penganiayaan.
- source_word: ἀνεχόμεθα
  choice: kami bertahan
  rationale: Menyampaikan ketabahan dalam menghadapi penganiayaan tanpa menambahkan objek eksplisit yang tidak terdapat dalam bahasa Yunani.
theological_decisions:
- issue: Tanggapan etis terhadap perlakuan buruk
  choice: 'Ayat ini menggambarkan perilaku para rasul: mereka memberkati saat dicaci dan bertahan saat dianiaya.'
  alternative: Merumuskannya sebagai perintah umum bagi semua orang percaya.
  rationale: Teks berbentuk uraian tentang praktik para rasul, bukan perintah eksplisit; terjemahan mempertahankan daya etisnya tanpa memperluas bentuk pernyataannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan antitesis yang ringkas. 'Berjerih lelah' mempertahankan nuansa usaha yang melelahkan, sedangkan 'bertahan' menjaga ἀνεχόμεθα tetap tanpa objek tambahan.
