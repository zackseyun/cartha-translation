  source_fidelity: 'Terjemahan secara tepat mencerminkan urutan dan hubungan dalam teks Yunani: κοπιῶμεν sebagai “berjerih lelah,” partisipel ἐργαζόμενοι sebagai penjelas “bekerja,” penekanan ταῖς ἰδίαις χερσίν dalam “dengan tangan kami sendiri,” serta pasangan antitesis “dicaci/memberkati” dan “dianiaya/bertahan.” “Kami bertahan” mempertahankan ἀνεχόμεθα tanpa menambahkan objek yang tidak eksplisit.'
