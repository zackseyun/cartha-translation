reference: 1 Corinthians 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: id
  text: Sebab menurut saya, Allah telah menampilkan kami, para rasul, sebagai yang terakhir, seperti orang-orang yang telah dijatuhi hukuman mati,[a] karena kami telah menjadi tontonan[b] bagi dunia, baik bagi malaikat maupun bagi manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti orang-orang yang ditentukan untuk mati.” Kata Yunani ini menunjuk kepada orang-orang yang ditetapkan untuk mati, kemungkinan dengan gambaran arena atau pertunjukan umum.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “teater”; maksudnya ialah pertunjukan atau tontonan di muka umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Sebab menurut saya
  rationale: Menyatakan penilaian pribadi Paulus secara alami dan mempertahankan fungsi penjelas γάρ.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: kami, para rasul
  rationale: 'Mempertahankan hubungan aposisional: Paulus mengidentifikasi kelompok yang dimaksud sebagai para rasul.'
- source_word: ἐσχάτους
  choice: sebagai orang-orang yang paling akhir
  rationale: Menjaga tekanan pada kedudukan terakhir atau terendah; kata ini juga selaras dengan gambaran arak-arakan menuju kematian.
- source_word: ἀπέδειξεν
  choice: telah menampilkan
  rationale: Mengungkapkan tindakan memperlihatkan atau mempertontonkan di muka umum, sesuai dengan gambaran θέατρον berikutnya.
- source_word: ὡς ἐπιθανατίους
  choice: seperti orang-orang yang telah dijatuhi hukuman mati
  rationale: Menyampaikan arti orang yang ditetapkan untuk mati, kemungkinan dalam gambaran arena atau pertunjukan umum.
- source_word: θέατρον ἐγενήθημεν
  choice: kami telah menjadi tontonan
  rationale: 'Menerjemahkan metafora secara wajar dalam bahasa Indonesia: para rasul menjadi pertunjukan yang disaksikan publik, bukan gedung teater.'
- source_word: τῷ κόσμῳ
  choice: bagi dunia
  rationale: Dativus menunjukkan pihak yang menyaksikan atau yang di hadapannya para rasul menjadi tontonan.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: baik bagi malaikat maupun bagi manusia
  rationale: 'Mempertahankan dua golongan penonton dalam cakupan dunia: makhluk malaikat dan manusia.'
theological_decisions:
- issue: Makna ἀγγέλοις
  choice: malaikat, yaitu makhluk surgawi yang menyaksikan keadaan para rasul
  alternative: utusan-utusan
  rationale: Dalam rangkaian dengan κόσμος dan ἀνθρώποις, makna yang paling alami ialah makhluk malaikat sebagai bagian dari khalayak kosmis; teks tidak diperluas melampaui itu.
- issue: Nuansa ἐσχάτους dalam gambaran publik
  choice: orang-orang yang paling akhir
  alternative: orang-orang yang paling hina; orang-orang pada bagian akhir arak-arakan
  rationale: Terjemahan mempertahankan arti dasar dan kemungkinan gambaran orang terhukum yang ditampilkan terakhir tanpa menetapkan secara pasti latar arak-arakan atau arena.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Bentuk “kami” dipakai karena Paulus berbicara tentang dirinya bersama para rasul. “Manusia” dipilih untuk ἀνθρώποις agar jelas mencakup manusia pada umumnya, berlawanan dengan malaikat.
