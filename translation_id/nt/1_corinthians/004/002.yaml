  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: id
  text: Selanjutnya, dalam hal ini, yang dituntut dari para pengelola ialah agar seseorang didapati setia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang dicari di antara para pengelola ialah supaya seseorang didapati setia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Dalam hal ini
  rationale: Gabungan ini dipahami sebagai penanda wacana yang menerapkan uraian sebelumnya kepada perkara para pengelola. Ungkapan Indonesia ini alami dan tidak menumpuk dua kata penghubung yang kaku.
- source_word: ζητεῖται
  choice: yang dituntut
  rationale: Bentuk pasif ini secara harfiah berkaitan dengan sesuatu yang dicari, tetapi dalam konstruksi ini menyatakan hal yang diharapkan atau disyaratkan.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: dari para pengelola
  rationale: Konstruksi tersebut menunjuk kepada kelompok yang dikenai tuntutan. 'Para pengelola' mempertahankan gagasan orang yang dipercayai mengurus sesuatu milik pihak lain.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: ialah bahwa setiap orang harus didapati setia
  rationale: ἵνα menyatakan isi tuntutan; τις bersifat tunggal dan tak tentu, sedangkan εὑρεθῇ mempertahankan gambaran seseorang yang terbukti demikian ketika dinilai.
theological_decisions:
- issue: Ketunggalan representatif dan ketepatan gender
  choice: setiap orang harus didapati setia
  alternative: seorang laki-laki harus didapati setia; mereka harus didapati setia
  rationale: Bentuk Yunani tunggal dan generik, bukan pembatasan kepada laki-laki. 'Setiap orang' menyampaikan penerapan individual tanpa memasukkan pembatasan gender atau mengaburkannya menjadi jamak kolektif.
- issue: Makna πιστός
  choice: setia
  alternative: dapat dipercaya; dapat diandalkan
  rationale: '''Setia'' mencakup keandalan dalam menjalankan kepercayaan yang diberikan dan mempertahankan bobot moral istilah tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pengelola' dipilih karena lebih mudah dipahami daripada 'penatalayan', sambil tetap menyatakan tanggung jawab mengurus sesuatu yang dipercayakan. Struktur kalimat mempertahankan penekanan pada tuntutan dan kesetiaan individual.
