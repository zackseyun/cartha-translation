id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: id
  text: Karena itu, aku telah mengutus Timotius kepada kalian. Ia adalah anakku yang terkasih dan setia dalam Tuhan.[a] Ia akan mengingatkan kalian tentang jalan hidupku dalam Mesias Yesus,[b] sesuai dengan apa yang kuajarkan di mana-mana dalam setiap jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “putraku yang terkasih dan setia dalam Tuhan.” Kata Yunani τέκνον berarti “anak”; dalam konteks ini juga dapat diterjemahkan “putra.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam Kristus Yesus.” Kata Yunani Χριστός berarti “Mesias” atau “Yang Diurapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Penghubung sebab-akibat yang alami dalam bahasa Indonesia dan tetap merujuk pada uraian sebelumnya.
- source_word: ἔπεμψα
  choice: aku telah mengutus
  rationale: Aoristus menunjuk tindakan pengutusan yang dilakukan Paulus; bentuk perfektif Indonesia terdengar wajar dalam konteks surat dan tidak memastikan apakah Timotius sudah tiba.
- source_word: Τιμόθεον
  choice: Timotius
  rationale: Bentuk nama yang baku dalam tradisi Alkitab berbahasa Indonesia.
- source_word: τέκνον
  choice: anakku
  rationale: Mempertahankan metafora kekeluargaan τέκνον tanpa menghilangkan hubungan pribadi; kata ini sendiri berarti anak dan tidak secara leksikal menetapkan 'putra'.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: yang terkasih dan setia
  rationale: Menyampaikan kasih Paulus dan kesetiaan atau keterandalan Timotius dalam pelayanan.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus tentang relasi dan lingkup hidup Timotius di dalam Tuhan.
- source_word: ἀναμνήσει
  choice: akan mengingatkan
  rationale: Padanan langsung dan alami bagi bentuk futurum aktif.
- source_word: τὰς ὁδούς μου
  choice: jalan hidupku
  rationale: Menjaga metafora 'jalan' sambil memperjelas bahwa yang dimaksud bukan rute perjalanan, melainkan pola hidup dan pelayanan Paulus.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Menerjemahkan Χριστός sebagai gelar 'Mesias' dan mempertahankan frasa yang menerangkan jalan hidup Paulus.
- source_word: καθὼς
  choice: sesuai dengan apa yang
  rationale: Mengungkapkan kesesuaian antara pengingat Timotius dan pengajaran Paulus secara alami dalam bahasa Indonesia.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: di mana-mana dalam setiap jemaat
  rationale: Mempertahankan kedua penanda cakupan universal tanpa meleburkannya.
theological_decisions:
- issue: Makna τέκνον dalam hubungan Paulus dan Timotius
  choice: anakku
  alternative: putraku
  rationale: τέκνον adalah istilah umum untuk anak, meskipun Timotius laki-laki. Pilihan utama mempertahankan keluasan leksikal dan metafora hubungan rohani.
- issue: Terjemahan Χριστός dalam ἐν Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam frasa ini Χριστός tetap dapat didengar sebagai gelar. 'Mesias' menyampaikan makna gelar tersebut, sedangkan alternatif tradisional dicatat agar pembaca mengetahui padanannya.
- issue: Cakupan τὰς ὁδούς μου
  choice: jalan hidupku
  alternative: cara-caraku
  rationale: Konteks menunjuk pola hidup, pelayanan, dan pengajaran Paulus, bukan rute perjalanan. Pilihan ini menjaga metafora tanpa membatasi maknanya hanya pada perilaku atau ajaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina aku–kalian dipakai untuk menjaga kejelasan penutur dan penerima jamak. 'Jemaat' dipilih untuk ἐκκλησία sebagai komunitas orang percaya. Penempatan catatan [a] sesudah satuan lengkap menghindari pemutusan klausa utama.
