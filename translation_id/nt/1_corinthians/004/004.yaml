source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: id
  text: Sebab aku tidak menyadari apa pun yang dapat dituduhkan kepada diriku[a]. Tetapi, bukan atas dasar itu aku dibenarkan[b]. Yang memeriksa[c] aku ialah Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak sadar akan kesalahan apa pun pada diriku” atau “aku tidak mengetahui sesuatu pun yang dapat dituduhkan kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku dinyatakan tidak bersalah” atau “aku terbukti benar.” Kata Yunani yang dipakai merupakan istilah forensik yang juga digunakan Paulus dalam pembicaraan tentang pembenaran.
    reason: lexical_alternative
  - marker: c
    text: Atau, “menilai” atau “menyelidiki.” Kata kerjanya dapat menunjuk pada pemeriksaan, penyelidikan, atau penilaian dalam suasana yudisial.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Sebab, aku tidak menyadari sesuatu pun yang menentang diriku
  rationale: Ungkapan σύνοιδα dengan datif ἐμαυτῷ menyatakan kesadaran batin atau hati nurani mengenai sesuatu yang dapat dituduhkan kepada diri sendiri. Terjemahan ini mempertahankan nuansa moral-forensik tanpa menyatakan bahwa Paulus sama sekali tidak berdosa.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: Namun, bukan karena hal itu aku dibenarkan
  rationale: Bentuk perfektum pasif δεδικαίωμαι memiliki bobot forensik. 'Dibenarkan' mempertahankan istilah penting Paulus, sedangkan 'karena hal itu' secara wajar menyatakan bahwa hati nurani yang tidak menuduh bukanlah dasar putusan tersebut.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: Tuhanlah yang memeriksa aku
  rationale: ἀνακρίνω dapat berarti memeriksa, menyelidiki, atau menilai, terutama dalam suasana yudisial. 'Memeriksa' menjaga fokus pada pengujian tanpa menyamakannya secara berlebihan dengan vonis akhir.
- source_word: κύριος
  choice: Tuhan
  rationale: 'κύριος merujuk kepada sosok yang pasti dalam konteks. Bentuk fokus ''-lah'' secara alami membawa daya predikatif dari susunan Yunani: pihak yang memeriksa Paulus adalah Tuhan.'
theological_decisions:
- issue: Nuansa forensik δεδικαίωμαι dalam kaitannya dengan penilaian diri Paulus
  choice: aku dibenarkan
  alternative: aku dinyatakan tidak bersalah; aku terbukti benar
  rationale: Konteks langsung membahas pemeriksaan dan penilaian atas pelayanan Paulus. 'Dibenarkan' menjaga bobot hukum dan kosakata Paulus tanpa memperluas ayat ini menjadi pernyataan sistematis yang melampaui konteks.
- issue: Identitas κύριος
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Teks Yunani hanya menyebut κύριος. Walaupun dalam konteks Paulus rujukannya mungkin Kristus, nama 'Yesus' tidak ditambahkan agar terjemahan tidak membuat identifikasi yang lebih eksplisit daripada sumber.
- issue: Makna hati nurani yang tidak menuduh
  choice: tidak menyadari sesuatu pun yang menentang diriku
  alternative: tidak mengetahui kesalahan apa pun pada diriku
  rationale: Rumusan ini tidak menyimpulkan bahwa Paulus mengaku tanpa dosa; maksudnya ialah ia tidak sadar akan tuduhan atau kesalahan tertentu pada dirinya, tetapi itu sendiri tidak menentukan putusan Tuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'aku' dipakai untuk mempertahankan suara pribadi Paulus. Susunan menjadi tiga kalimat agar alur alasan, koreksi, dan penegasan pelaku pemeriksaan terdengar alami. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang diterangkan.
