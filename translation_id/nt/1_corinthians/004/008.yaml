  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: id
  text: Kalian sudah kenyang! Kalian sudah menjadi kaya! Tanpa kami, kalian sudah memerintah sebagai raja! Seandainya kalian sungguh-sungguh sudah memerintah sebagai raja,[a] supaya kami pun dapat memerintah sebagai raja bersama kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ah, sekiranya kalian memang sudah memerintah sebagai raja.”'
    reason: lexical_alternative
  - marker: b
    text: 'Paulus berbicara secara ironis: jemaat Korintus bertindak seolah-olah mereka sudah sepenuhnya puas, kaya, dan memerintah sebagai raja.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Mengulang penekanan waktu pada dua klausa pertama secara alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: κεκορεσμένοι ἐστέ
  choice: sudah kenyang
  rationale: Bentuk perifrastik perfect menyatakan keadaan kini sebagai hasil yang telah tercapai; 'sudah kenyang' alami dan mempertahankan gambaran kepuasan berlebih.
- source_word: ἐπλουτήσατε
  choice: sudah menjadi kaya
  rationale: Mempertahankan unsur verbal perubahan keadaan, bukan sekadar menyebut keadaan 'kaya'.
- source_word: χωρὶς ἡμῶν
  choice: tanpa kami
  rationale: Padanan ringkas dan langsung bagi χωρὶς ἡμῶν, yang menonjolkan klaim kemandirian jemaat dari para rasul.
- source_word: ἐβασιλεύσατε
  choice: sudah menjadi raja / telah menjadi raja
  rationale: Mempertahankan metafora kerajaan secara langsung tanpa menambahkan nuansa inkoatif 'mulai' yang tidak dinyatakan secara eksplisit oleh verba.
- source_word: ὄφελόν γε
  choice: Seandainya ... benar-benar
  rationale: Menyampaikan keinginan yang tidak sesuai kenyataan; 'benar-benar' membawa penegasan γε dan membedakan keadaan nyata yang diharapkan dari klaim ironis sebelumnya.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang diharapkan secara jelas dan alami.
- source_word: συμβασιλεύσωμεν
  choice: kami pun dapat memerintah sebagai raja bersama kalian
  rationale: Mempertahankan unsur pemerintahan kerajaan dan makna kebersamaan dari awalan συν-.
theological_decisions:
- issue: Nada tiga pernyataan pertama
  choice: Disajikan sebagai seruan ironis melalui susunan paralel dan tanda seru.
  alternative: Menerjemahkannya sebagai pujian atau pernyataan faktual biasa.
  rationale: Konteks 1 Korintus 4:7–13 memperhadapkan anggapan tinggi jemaat tentang diri mereka dengan penderitaan para rasul; bentuk seruan membuat ironi terdengar tanpa memasukkan tafsiran panjang ke dalam teks.
- issue: Makna bahasa kerajaan
  choice: Mempertahankan 'menjadi raja' dan 'memerintah sebagai raja'.
  alternative: Melunakkannya menjadi 'berkuasa', 'berhasil', atau 'berkedudukan tinggi'.
  rationale: βασιλεύω dan συμβασιλεύω memakai citra kerajaan yang penting bagi kontras retoris dan kemungkinan gaung eskatologis teks.
- issue: Hubungan ironi dan keinginan Paulus
  choice: Klausa pertama tetap ironis, sedangkan 'Seandainya ... benar-benar' mempertahankan kemungkinan adanya kerinduan sungguh-sungguh di balik teguran.
  alternative: Menganggap seluruh ayat hanya sebagai sarkasme atau seluruhnya sebagai pernyataan literal.
  rationale: ὄφελόν γε menyatakan keinginan yang kuat, sementara konteks memberi warna ironi; terjemahan tidak meniadakan salah satu sisi ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan orang kedua jamak dalam bahasa Yunani tetap jelas. Diksi dibuat lugas dan bermartabat; pengulangan serta tanda seru mempertahankan tekanan retoris Paulus.
