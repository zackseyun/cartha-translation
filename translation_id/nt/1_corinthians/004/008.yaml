    issue: “Menjadi raja” untuk ἐβασιλεύσατε
    rationale: Ungkapan itu terutama berarti memperoleh status raja, sementara verba Yunani menyatakan memerintah atau berkuasa sebagai raja. Pergeseran ini juga mengaburkan hubungan leksikal dengan συμβασιλεύσωμεν (“memerintah sebagai raja bersama”).
  - severity: low
    issue: Catatan a tidak mencerminkan secara langsung terjemahan alternatif bagi klausa harapan yang direvisi
    rationale: Catatan dapat dipertahankan sebagai alternatif idiomatis, tetapi sebaiknya memakai “memerintah sebagai raja” agar selaras dengan verba sumber dan teks utama.
