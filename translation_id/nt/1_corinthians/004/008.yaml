  verdict: revise
  source_fidelity: Klausa pertama dan kedua setia pada penekanan ἤδη dan aspek hasilnya. Namun, ἐβασιλεύσατε berarti “memerintah/meraja,” bukan terutama “menjadi raja”; terjemahan yang ada menggeser tindakan atau keadaan memerintah menjadi perubahan status. Koreksi yang sama diperlukan dalam klausa harapan.
  naturalness: Bahasa Indonesia baku dan retorisnya baik. “Sudah memerintah sebagai raja” lebih alami dan lebih tepat daripada “sudah menjadi raja” dalam paralel ini. “Seandainya ... sungguh-sungguh sudah memerintah” menyampaikan harapan yang bertentangan dengan situasi retoris tanpa memaksakan rincian waktu.
  terminology: “Memerintah sebagai raja” mempertahankan citra kerajaan dari βασιλεύω, sedangkan “memerintah sebagai raja bersama” dengan tepat mengungkapkan συμβασιλεύω. “Kalian” sesuai untuk orang kedua jamak dalam ragam Indonesia modern.
