reference: 1 Corinthians 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: id
  text: Sebab, siapa yang membuatmu berbeda? Apa yang kamu miliki yang tidak kamu terima? Dan jika kamu memang menerimanya, mengapa kamu bermegah seolah-olah kamu tidak menerimanya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Sebab, siapa yang membuatmu berbeda?
  rationale: διακρίνω dengan objek σε menanyakan siapa yang menjadikan seseorang berbeda atau menonjol dibandingkan orang lain. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya retoris pertanyaan; γάρ diterjemahkan 'Sebab' karena memberikan dasar bagi teguran sebelumnya.
- source_word: τί δὲ ἔχεις
  choice: Apa yang kamu miliki
  rationale: δὲ berfungsi sebagai penghubung ringan dalam rangkaian pertanyaan. Dalam bahasa Indonesia, hubungan itu cukup dinyatakan melalui urutan kalimat tanpa harus menambahkan 'dan' atau 'tetapi'.
- source_word: ὃ οὐκ ἔλαβες
  choice: yang tidak kamu terima
  rationale: Klausa relatif ini menegaskan bahwa apa pun yang dimiliki telah diterima, bukan berasal dari diri sendiri. Bentuk lampau Yunani tidak perlu diberi penanda waktu khusus dalam bahasa Indonesia.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Dan jika kamu memang menerimanya
  rationale: Kata 'memang' menyampaikan penegasan καί dalam konstruksi bersyarat, sedangkan '-nya' secara alami merujuk kembali kepada apa yang dimiliki.
- source_word: τί καυχᾶσαι
  choice: mengapa kamu bermegah
  rationale: '''Bermegah'' mempertahankan istilah khas Paulus bagi sikap membanggakan diri atau dasar kebanggaan, dengan ragam bahasa yang bermartabat dan lazim dalam teks Alkitab Indonesia.'
- source_word: ὡς μὴ λαβών
  choice: seolah-olah kamu tidak menerimanya
  rationale: 'Ungkapan ''seolah-olah'' menyampaikan cara yang bertentangan dengan kenyataan: orang itu bermegah seperti bukan penerima. Pronomina ''-nya'' dipasok dari konteks agar wajar dalam bahasa Indonesia.'
theological_decisions:
- issue: Cakupan teguran Paulus tentang perbedaan, milik, dan apa yang diterima
  choice: Terjemahan memakai kata-kata umum dan tidak membatasi yang diterima hanya pada karunia rohani atau peran pelayanan.
  alternative: Menafsirkan perkataan ini secara khusus sebagai rujukan kepada karunia rohani dan jabatan pelayanan, atau memperluasnya secara eksplisit kepada setiap kemampuan, kedudukan, dan berkat.
  rationale: Konteks dekat membahas pelayanan rasuli, kesombongan, dan perpecahan, tetapi rumusan Paulus bersifat umum. Terjemahan mempertahankan keluasan dan ketegangan tersebut tanpa menetapkan cakupan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', sesuai bentuk tunggal σε dan verba orang kedua tunggal dalam bahasa Yunani. Ragamnya jelas dan bermartabat; 'bermegah' dipertahankan sebagai istilah teologis yang dikenal, sementara susunan pertanyaannya dibuat alami dalam bahasa Indonesia.
