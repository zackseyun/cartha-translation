id: 1CO.4.3
reference: 1 Corinthians 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: id
  text: Namun, bagiku, sangat kecil artinya jika aku diperiksa oleh kalian atau oleh pengadilan manusia mana pun.[a] Bahkan, aku tidak memeriksa diriku sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “oleh hari manusia,” sebuah ungkapan untuk pengadilan atau penilaian manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: bagiku
  rationale: Datif acuan yang menyatakan sudut pandang Paulus; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: bukan perkara penting
  rationale: Mengungkapkan bahwa hal itu sangat kecil atau hampir tidak berarti bagi Paulus tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἵνα
  choice: jika
  rationale: Dalam konstruksi idiomatis ini, klausa tersebut menyatakan keadaan yang dianggap tidak penting; 'jika' paling alami dalam bahasa Indonesia.
- source_word: ἀνακριθῶ
  choice: aku diperiksa
  rationale: ἀνακρίνω menunjuk pada pemeriksaan atau penilaian saksama, bukan semata-mata putusan akhir; bentuk ini juga memungkinkan konsistensi dengan pemakaian kedua.
- source_word: ὑφ’ ὑμῶν
  choice: oleh kalian
  rationale: Menyatakan pelaku secara langsung; 'kalian' memperjelas bahwa pronomina Yunani berbentuk jamak.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: atau oleh pengadilan manusia mana pun
  rationale: Ungkapan harfiah 'hari manusia' bersifat idiomatis dan dalam konteks menunjuk pada forum atau penilaian manusia, berlawanan dengan hari Tuhan.
- source_word: ἀλλ’ οὐδὲ
  choice: Bahkan, ... tidak
  rationale: 'Menyampaikan peningkatan retoris: bukan hanya penilaian orang lain yang kecil artinya, Paulus bahkan tidak melakukan pemeriksaan itu terhadap dirinya sendiri.'
- source_word: ἐμαυτὸν
  choice: diriku sendiri
  rationale: Padanan refleksif yang wajar sebagai objek ἀνακρίνω.
- source_word: ἀνακρίνω
  choice: memeriksa
  rationale: Mempertahankan kohesi leksikal dengan ἀνακριθῶ dan tidak mengaburkan perbedaan dari kosakata tentang penghakiman dalam konteks dekat.
theological_decisions:
- issue: Makna ἀνθρωπίνης ἡμέρας
  choice: pengadilan manusia
  alternative: hari manusia; penilaian manusia
  rationale: Frasa itu secara harfiah berarti 'hari manusia', tetapi berfungsi sebagai ungkapan tentang forum penilaian manusia, yang dikontraskan secara kontekstual dengan hari Tuhan. Terjemahan idiomatis menyampaikan maksudnya tanpa menjadikannya pernyataan tentang waktu kalender.
- issue: Cakupan pernyataan Paulus tentang pemeriksaan diri
  choice: memeriksa diriku sendiri
  alternative: menghakimi diriku sendiri
  rationale: Pemakaian kata yang sama pada kedua klausa dipertahankan agar ayat ini tidak menyiratkan bahwa Paulus menolak segala bentuk introspeksi; konteksnya adalah penilaian atas pelayanannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῶν secara jelas. Susunan kalimat dibuat alami sambil mempertahankan pengulangan leksikal 'diperiksa/memeriksa'.
