    text: 'Atau tanpa tanda petik: Segala sesuatu boleh bagiku. Banyak orang memahami klausa ini sebagai semboyan jemaat Korintus yang dikutip Paulus lalu diberinya batasan.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: berguna atau menguntungkan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: aku tidak akan berada di bawah kuasa apa pun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Segala sesuatu boleh bagiku
  rationale: Ungkapan ini mempertahankan cakupan luas dan bentuk ringkas seperti semboyan dalam bahasa Yunani. “Boleh bagiku” secara alami menyatakan bahwa sesuatu diizinkan bagi pembicara, tanpa mempersempitnya menjadi persoalan hukum formal semata.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: tetapi tidak segala sesuatu bermanfaat
  rationale: συμφέρει menyatakan apa yang berguna, menguntungkan, atau membawa manfaat. “Bermanfaat” mempertahankan penilaian etis yang luas dan menghindari kesan komersial yang dapat timbul dari “menguntungkan”.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: tetapi aku tidak akan dikuasai
  rationale: Bentuk pasif futur ἐξουσιασθήσομαι menunjuk pada keadaan berada di bawah kuasa atau kendali. “Dikuasai” jelas dan wajar dalam bahasa Indonesia modern, sedangkan subjek eksplisit ἐγώ tercermin dalam “aku” yang dikontraskan dengan apa pun yang dapat menguasainya.
- source_word: ὑπό τινος
  choice: oleh apa pun
  rationale: Kata ganti tak tentu τινος dapat merujuk luas; dalam konteks tindakan, selera, dan hal-hal yang dianggap boleh, bentuk nonpersonal “apa pun” paling sesuai sambil tetap mempertahankan keluasan prinsipnya.
theological_decisions:
- issue: Apakah Πάντα μοι ἔξεστιν ditandai sebagai semboyan jemaat Korintus
  choice: Klausa yang diulang ditempatkan dalam tanda petik sebagai perkataan atau semboyan yang dikutip Paulus lalu dibatasi.
  alternative: Menerjemahkannya tanpa tanda petik sebagai pernyataan Paulus sendiri yang langsung diberi pembatasan.
  rationale: Naskah Yunani tidak memakai tanda petik, sehingga penandaan ini bersifat interpretatif. Banyak penafsir memahami klausa tersebut sebagai semboyan orang Korintus, tetapi kemungkinan bahwa ini adalah pernyataan Paulus sendiri tetap nyata dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Pengulangan struktur Yunani dipertahankan untuk menjaga daya retoris ayat. “Aku” dipakai karena konteksnya adalah ujaran langsung Paulus atau semboyan dalam bentuk orang pertama, sedangkan tanda petik dan catatan kaki mempertahankan ambiguitas retoris sumber.
