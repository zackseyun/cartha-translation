base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: id
  text: “Segala sesuatu boleh bagiku,”[a] tetapi tidak semua hal bermanfaat.[b] “Segala sesuatu boleh bagiku,” tetapi aku sendiri tidak akan dikuasai oleh apa pun.[c]
  philosophy: optimal-equivalence
  footnotes:
