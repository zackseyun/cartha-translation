translation:
  language: id
  text: Namun, orang yang mengikatkan diri kepada Tuhan adalah satu roh dengan Dia[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipersatukan dengan Tuhan.” Bentuk kata kerja Yunani dapat dipahami secara refleksif (“mengikatkan diri”) atau bernuansa pasif (“dipersatukan”).
    reason: lexical_alternative
  - marker: b
    text: Atau, “adalah satu roh.” Frasa “dengan Dia” tersirat dalam bahasa Yunani dan ditambahkan demi kejelasan.
    reason: lexical_alternative
  - marker: c
    text: Sebagian penafsir dapat menuliskan “Roh” dengan huruf kapital, tetapi frasa ini paling alami berarti bahwa orang percaya dipersatukan dengan Tuhan dalam satu roh.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: mengikatkan diri kepada
  rationale: Kata ini menyatakan keterikatan atau penyatuan yang erat. Bentuk refleksif ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan gambaran penyatuan pada ayat sebelumnya.
- source_word: τῷ κυρίῳ (κύριος)
  choice: kepada Tuhan
  rationale: Dalam konteks Paulus, sebutan ini merujuk kepada Yesus yang bangkit dan mengandung bobot teologis yang lebih kuat daripada sekadar 'tuan'.
- source_word: ἓν
  choice: satu
  rationale: Kata ini secara langsung menyatakan kesatuan yang nyata, bukan sekadar keselarasan sikap atau tujuan.
- source_word: πνεῦμα
  choice: roh
  rationale: Huruf kecil dipilih karena frasa ini paling wajar menggambarkan orang percaya dan Tuhan menjadi satu roh dalam persatuan, bukan menyamakan orang percaya dengan Roh Kudus.
- source_word: ὁ δὲ ... ἐστιν
  choice: Namun, orang yang ... menjadi
  rationale: Artikel dan partisip Yunani berfungsi substantival, yaitu 'orang yang'. 'Menjadi' menyampaikan keadaan kesatuan yang timbul dari keterikatan itu secara alami dalam bahasa Indonesia, tanpa mengurangi kekuatan pernyataannya.
theological_decisions:
- issue: Sifat kesatuan dalam frasa 'satu roh'
  choice: Menyatakan persatuan rohani yang nyata dengan Tuhan tanpa menghapus perbedaan antara orang percaya dan Tuhan.
  alternative: Identifikasi mistis yang lebih kuat, atau sekadar kesamaan sikap dan tujuan.
  rationale: Konteks membandingkan penyatuan jasmani dengan pelacur pada ayat 16 dan penyatuan dengan Tuhan pada ayat 17. Terjemahan mempertahankan kuatnya bahasa persatuan tanpa menyiratkan peleburan hakikat.
- issue: Penambahan 'dengan Dia'
  choice: Mencantumkan 'dengan Dia' demi kejelasan.
  alternative: Menerjemahkan secara lebih harfiah hanya sebagai 'menjadi satu roh'.
  rationale: Pelengkap relasional tersirat dalam bahasa Yunani. Dalam bahasa Indonesia, 'dengan Dia' memperjelas bahwa kesatuan tersebut berlangsung antara orang itu dan Tuhan.
- issue: Kapitalisasi πνεῦμα
  choice: Menggunakan 'roh' dengan huruf kecil.
  alternative: Menggunakan 'Roh' sebagai rujukan kepada Roh Kudus.
  rationale: Naskah Yunani tidak membedakan kapitalisasi. Dalam konteks ini, bacaan yang paling alami adalah kesatuan rohani orang percaya dengan Tuhan, meskipun penafsiran yang merujuk kepada Roh Kudus tetap mungkin dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Mengikatkan diri' mudah dipahami dan tetap membawa nuansa keterikatan erat; 'Dia' dikapitalisasi menurut kebiasaan umum penulisan rujukan ilahi dalam bahasa Indonesia.
