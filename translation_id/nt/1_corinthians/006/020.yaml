base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: id
  text: Sebab kamu telah dibeli dengan harga; maka muliakanlah Allah dalam tubuhmu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sebab kamu telah dibeli dengan membayar suatu harga.” Bahasa Yunani mempertahankan gambaran tentang biaya yang dibayarkan dalam suatu pembelian. Kata “maka” menerjemahkan partikel yang dapat juga bernuansa “jadi,” “memang,” atau tidak dinyatakan secara tersendiri; partikel itu menambah dorongan pada perintah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: telah dibeli
  rationale: Bentuk aoristus pasif dari ἀγοράζω mempertahankan gambaran perdagangan, yaitu tindakan membeli, tanpa menggantinya dengan istilah teologis yang lebih sempit.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan bagi nasihat sebelumnya; “Sebab” menyatakan hubungan penjelas itu secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: τιμῆς
  choice: dengan suatu harga
  rationale: Genitif harga sesudah ἀγοράζω menunjukkan harga yang dikenakan atau dibayar. Ungkapan ini mempertahankan gambaran adanya biaya pembelian tanpa menambahkan bahwa harganya mahal atau menyebut siapa yang membayarnya.
- source_word: δοξάσατε
  choice: muliakanlah
  rationale: Imperatif aoristus ini menyampaikan perintah tegas. “Muliakanlah” merupakan padanan alami dan berbobot bagi δοξάζω dalam konteks tindakan yang memuliakan Allah.
- source_word: δὴ
  choice: Maka
  rationale: δή memberi dorongan atau daya simpulan pada perintah. “Maka” menghubungkan alasan yang baru diberikan dengan tuntutan yang mengikutinya, sambil mempertahankan ketegasan nasihat.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: dalam tubuhmu
  rationale: “Dalam” mempertahankan keluasan makna ἐν, sedangkan bentuk tunggal “tubuhmu” menyampaikan secara idiomatis bentuk tunggal σῶμα yang diikuti kata ganti jamak, dengan perhatian pada perilaku jasmani setiap anggota jemaat.
theological_decisions:
- issue: Gambaran komersial tentang penebusan
  choice: Mempertahankan metafora pembelian dalam “telah dibeli dengan suatu harga”
  alternative: telah ditebus dengan pengorbanan
  rationale: Teks Yunani secara langsung memakai bahasa jual-beli. Mempertahankan metafora itu menjaga keterlacakan pada sumber dan tidak mempersempitnya menjadi rumusan doktrinal yang tidak dinyatakan secara eksplisit di ayat ini.
- issue: Etika yang menyangkut tubuh
  choice: Menerjemahkan σῶμα secara konkret sebagai “tubuh”
  alternative: diri atau hidup
  rationale: Konteks langsung membahas perilaku seksual yang dilakukan dengan tubuh. Padanan konkret mempertahankan alur argumen Paulus dan menghindari perluasan parafrastis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan langsung. Bentuk “kamu” dipakai untuk menyapa jemaat secara kolektif, sedangkan “tubuhmu” mempertahankan secara idiomatis bentuk tunggal Yunani yang mengacu pada tubuh masing-masing anggota. Metafora pembelian dan ambiguitas cakupan preposisi ἐν dipertahankan.
