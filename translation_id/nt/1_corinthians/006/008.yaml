  naturalness: Bahasa draf umumnya baku dan jelas. Revisi mempertahankan ketegasan retoris sambil membuat hubungan “dan itu terhadap ...” lebih dekat dengan struktur sumber. Penghilangan “sendiri” yang kedua menghindari penegasan ganda yang tidak diperlukan.
  terminology: “Saudara-saudaramu” mempertahankan metafora kekeluargaan dari ἀδελφούς. Catatan kaki dengan tepat menjelaskan bahwa bentuk maskulin jamak ini dalam konteks jemaat dapat mencakup sesama orang percaya secara lebih luas. “Merugikan orang lain” lebih dekat dengan cakupan ἀποστερέω daripada “menipu.”
  issues:
