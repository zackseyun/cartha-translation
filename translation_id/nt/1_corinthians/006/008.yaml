    issue: “Bahkan terhadap” untuk καὶ τοῦτο
    rationale: Kata “bahkan” dapat menyampaikan penajaman, tetapi tidak menerjemahkan demonstratif τοῦτο secara eksplisit. “Dan itu terhadap” mempertahankan bentuk retoris sumber tanpa menambahkan nuansa yang lebih kuat daripada yang diperlukan.
  - severity: low
    issue: “Menipu” untuk ἀποστερεῖτε
    rationale: Verba Yunani ini berfokus pada merampas, menahan, atau merugikan seseorang dalam hal yang menjadi haknya; tindakan itu tidak harus mencakup tipu daya. “Merugikan orang lain” lebih luas dan lebih aman.
  - severity: low
    issue: Pengulangan “sendiri” pada “saudara-saudaramu sendiri”
    rationale: Penegasan eksplisit dalam sumber terletak pada ὑμεῖς (“kamu sendiri”). Penambahan “sendiri” pada objek tidak diperlukan dan dapat menggeser atau menggandakan fokus penegasan.
