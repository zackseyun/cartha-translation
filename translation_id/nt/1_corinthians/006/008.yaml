  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: id
  text: Tetapi, kamu sendiri berbuat tidak adil dan merugikan orang lain—dan itu terhadap saudara-saudaramu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudaramu” secara harfiah berbentuk maskulin jamak dan dalam konteks ini dapat mencakup saudara-saudari seiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai kontras kuat dengan pernyataan sebelumnya dan terdengar alami dalam konteks teguran.
- source_word: ὑμεῖς
  choice: kamu sendiri
  rationale: Kata ganti yang dinyatakan secara eksplisit dalam bahasa Yunani bersifat menegaskan; bentuk ini mempertahankan penekanan pada perbuatan jemaat Korintus sendiri.
- source_word: ἀδικεῖτε
  choice: berbuat tidak adil
  rationale: Mempertahankan cakupan moral dan yuridis verba tersebut tanpa menentukan objek yang tidak dinyatakan secara eksplisit.
- source_word: ἀποστερεῖτε
  choice: menipu
  rationale: Dalam konteks perselisihan hukum dan harta, kata ini menyatakan tindakan merampas atau menahan apa yang menjadi hak orang lain; 'menipu' ringkas dan wajar dalam bahasa Indonesia.
- source_word: καὶ τοῦτο
  choice: bahkan terhadap
  rationale: 'Mengungkapkan penajaman retoris: kesalahan itu dilakukan bukan sekadar terhadap orang lain, melainkan terhadap sesama anggota komunitas iman.'
- source_word: ἀδελφούς
  choice: saudara-saudaramu sendiri
  rationale: Bentuk jamak maskulin menunjuk kepada saudara seiman dan dalam konteks dapat mencakup laki-laki maupun perempuan; akhiran posesif dan 'sendiri' membuat hubungan serta daya tegurnya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ἀδελφούς dalam komunitas jemaat yang terdiri atas laki-laki dan perempuan
  choice: saudara-saudaramu sendiri
  alternative: saudara-saudari seimanmu sendiri; sesama orang percaya
  rationale: Terjemahan utama mempertahankan metafora kekeluargaan dan bentuk leksikal sumber, sedangkan catatan menjelaskan bahwa pemakaiannya dapat mencakup seluruh saudara seiman tanpa membatasi hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan tegas. 'Sebaliknya' membawa kontras, sementara 'kamu sendiri' dan pengulangan 'sendiri' pada bagian akhir mempertahankan daya retoris ayat. Penanda catatan kaki [a] dicantumkan dalam teks utama.
