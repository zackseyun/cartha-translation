id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: id
  text: Tidak tahukah kalian bahwa tubuh kalian adalah bagian-bagian tubuh Mesias[a]? Lalu, akankah aku mengambil bagian-bagian tubuh Mesias dan menjadikannya bagian-bagian tubuh seorang pelacur? Jangan sampai terjadi![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau digunakan dalam bentuk tradisional “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau, “Sama sekali tidak!” Ungkapan Yunani μὴ γένοιτο menyatakan penolakan yang sangat tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Tidak tahukah kalian
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengingatkan pembaca pada sesuatu yang semestinya sudah mereka ketahui; “kalian” menyatakan orang kedua jamak secara alami.
- source_word: τὰ σώματα ὑμῶν
  choice: tubuh kalian
  rationale: Mengacu pada keberadaan jasmani orang-orang percaya. Bahasa Indonesia lazim memakai “tubuh kalian” untuk kepunyaan jamak; bentuk “tubuh-tubuh kalian” terasa kaku.
- source_word: μέλη
  choice: bagian-bagian tubuh
  rationale: Menyatakan anggota atau bagian tubuh dan mempertahankan gambaran bahwa tubuh orang percaya menjadi bagian dari satu tubuh yang lebih besar. Pilihan ini lebih mudah dipahami pembaca umum daripada “anggota-anggota” tanpa penjelas.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός secara harfiah adalah gelar bagi Yang Diurapi. “Mesias” mempertahankan nilai gelar itu; alternatif tradisional “Kristus” dicatat dalam catatan kaki.
- source_word: ἄρας
  choice: mengambil
  rationale: Partisip ini menyertai pertanyaan retoris tentang tindakan yang dibayangkan. “Mengambil” menyampaikan tindakan memindahkan atau mempergunakan bagian-bagian tubuh Mesias bagi persatuan lain tanpa menambahkan penafsiran.
- source_word: ποιήσω
  choice: menjadikannya
  rationale: Menerjemahkan tindakan membuat bagian-bagian tubuh Mesias menjadi bagian-bagian tubuh seorang pelacur, sekaligus memakai pronomina agar kalimat Indonesia tidak terlalu berulang.
- source_word: πόρνης
  choice: seorang pelacur
  rationale: πόρνη secara khusus menunjuk kepada perempuan yang melakukan pelacuran dalam konteks ini; “pelacur” merupakan padanan modern dan langsung.
- source_word: μὴ γένοιτο
  choice: Jangan sampai terjadi!
  rationale: Ungkapan ini merupakan penolakan keras terhadap kemungkinan yang baru disebutkan. Padanan ini mempertahankan bentuk volitif sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran kesatuan tubuh orang percaya dengan Mesias
  choice: tubuh kalian adalah bagian-bagian tubuh Mesias
  alternative: tubuh kalian adalah anggota-anggota Mesias
  rationale: Terjemahan utama membuat metafora tubuh eksplisit tanpa menjelaskan lebih jauh bagaimana kesatuan itu bekerja, sehingga ketegangan dan daya kejut argumen Paulus tetap terpelihara.
- issue: Fungsi Χριστός sebagai gelar atau sebutan yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: “Mesias” mempertahankan arti gelar ‘Yang Diurapi’, sedangkan “Kristus” merupakan bentuk tradisional yang dapat berfungsi seperti nama. Karena keduanya mungkin dipahami dalam konteks Paulus, alternatif dicatat tanpa mengubah teks utama.
- issue: Kekuatan penolakan μὴ γένοιτο
  choice: Jangan sampai terjadi!
  alternative: Sama sekali tidak!
  rationale: Pilihan utama mempertahankan nuansa harapan atau seruan agar hal itu tidak pernah terjadi, sekaligus menyatakan penolakan yang sangat tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan jamak “kalian.” Metafora tubuh dibuat jelas melalui “bagian-bagian tubuh,” sedangkan pengulangan dalam pertanyaan kedua sedikit diringankan dengan “menjadikannya.”
