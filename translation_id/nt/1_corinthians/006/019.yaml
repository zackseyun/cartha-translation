source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: id
  text: Atau, tidak tahukah kalian bahwa tubuh kalian adalah bait Roh Kudus yang ada di dalam kalian[a], yang kalian miliki dari Allah? Kalian bukan milik kalian sendiri[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “bait milik Roh Kudus yang ada di dalam kalian.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, kata “tubuh” berbentuk tunggal, sedangkan “kalian” berbentuk jamak. Ungkapan ini dapat dipahami secara distributif (“tubuh setiap orang di antara kalian”) atau secara representatif.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan peralihan retoris yang tajam dan kaitannya dengan argumen sebelumnya.
- source_word: οὐκ οἴδατε
  choice: tidak tahukah kalian
  rationale: Mencerminkan rumusan retoris Paulus secara dekat sekaligus wajar dalam bahasa Indonesia.
- source_word: τὸ σῶμα ὑμῶν
  choice: tubuh kalian
  rationale: Mempertahankan nomina tunggal 'tubuh' dengan kata ganti orang kedua jamak, sehingga nuansa distributif atau representatif tidak diputuskan dalam teks utama.
- source_word: ναὸς
  choice: bait
  rationale: Dalam konteks Alkitab, 'bait' secara ringkas menyampaikan tempat suci atau rumah ibadah ilahi dan membedakannya dari kawasan bait secara umum.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: Roh Kudus yang ada di dalam kalian
  rationale: Membuat hubungan frasa Yunani jelas dan alami tanpa menentukan apakah ἐν ὑμῖν terutama bersifat individual atau komunal.
- source_word: οὗ
  choice: yang
  rationale: Kata relatif bahasa Indonesia tidak menandai gender atau keinsanan; rujukannya kepada Roh Kudus tetap jelas dari susunan kalimat.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: yang kalian miliki dari Allah
  rationale: Mempertahankan aspek kini dari ἔχετε ('memiliki'), tanpa mengubahnya secara eksplisit menjadi 'menerima'.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Kalian bukan milik kalian sendiri
  rationale: 'Mengungkapkan daya idiomatis konstruksi genitif Yunani dengan jelas: mereka tidak menjadi kepunyaan diri sendiri.'
theological_decisions:
- issue: Rujukan οὗ kepada Roh Kudus
  choice: Menerjemahkannya dengan klausa relatif 'yang kalian miliki dari Allah,' dengan Roh Kudus sebagai rujukannya.
  alternative: Menyusun ulang menjadi 'Roh Kudus, yang ada di dalam kalian dan yang kalian miliki dari Allah.'
  rationale: Tata bahasa mengaitkan kata relatif itu dengan Roh Kudus. Bahasa Indonesia memakai 'yang' baik untuk pribadi maupun benda, sehingga kepribadian Roh tidak perlu ditambahkan melalui istilah yang tidak tersedia dalam sistem pronomina Indonesia.
- issue: Bentuk tunggal 'tubuh' dengan penerima jamak
  choice: Mempertahankan 'tubuh kalian'.
  alternative: tubuh masing-masing; tubuh-tubuh kalian
  rationale: 'Bentuk ini menjaga ketegangan dalam sumber: ungkapan tersebut dapat dipahami secara distributif bagi setiap orang atau secara representatif/komunal.'
- issue: Makna ἐν ὑμῖν
  choice: di dalam kalian
  alternative: di dalam diri kalian; di tengah-tengah kalian
  rationale: Kata ganti jamak Yunani dapat memungkinkan nuansa individual maupun komunal. 'Di dalam kalian' mempertahankan ambiguitas itu sejauh mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar jumlah gramatikal sumber tetap terlihat. Gaya dibuat lugas dan bermartabat. Koma penutup dipertahankan karena ayat ini berlanjut secara sintaktis ke ayat berikutnya.
