  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: id
  text: Tidakkah kamu tahu bahwa kita akan menghakimi para malaikat? Apalagi[a] perkara-perkara kehidupan ini!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terlebih lagi perkara-perkara kehidupan ini” atau “apalagi urusan-urusan kehidupan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Tidakkah kamu tahu
  rationale: Mempertahankan bentuk pertanyaan retoris yang berulang dalam surat Paulus dan tetap wajar dalam bahasa Indonesia modern.
- source_word: ὅτι
  choice: bahwa
  rationale: Mengantar klausa isi sesudah kata 'tahu' secara langsung.
- source_word: ἀγγέλους
  choice: para malaikat
  rationale: Dalam konteks penghakiman eskatologis ini, istilah tersebut menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: κρινοῦμεν
  choice: kita akan menghakimi
  rationale: Bentuk futurum menunjuk kepada tindakan yang akan datang; 'menghakimi' mempertahankan arti yudisial tanpa menentukan cara atau cakupannya.
- source_word: μήτιγε
  choice: terlebih lagi
  rationale: Partikel ini menegaskan penalaran dari perkara yang lebih besar kepada yang lebih kecil; ungkapan ini menyampaikan daya retoris tersebut dengan alami.
- source_word: βιωτικά
  choice: perkara-perkara dalam kehidupan ini
  rationale: Adjektiva yang dipakai secara substantival ini menunjuk kepada urusan kehidupan duniawi sehari-hari; 'perkara-perkara' juga cocok dengan konteks perselisihan hukum tanpa terlalu mempersempit maknanya.
theological_decisions:
- issue: Hakikat tindakan orang percaya 'menghakimi para malaikat'
  choice: Mempertahankan ungkapan harfiah 'kita akan menghakimi para malaikat' tanpa penjelasan tambahan.
  alternative: kita akan memerintah atas para malaikat; kita akan menghakimi malaikat-malaikat yang jatuh
  rationale: Teks tidak menentukan mekanisme, cakupan, atau apakah hanya malaikat yang jatuh yang dimaksud. Terjemahan ini mempertahankan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kata ganti jamak 'kamu' sesuai sapaan kepada jemaat; tanda baca membagi pertanyaan utama dan seruan lanjutan agar daya retoris μήτιγε jelas.
