revisions:
- from: Namun, saudara menggugat saudara, dan bahkan di hadapan orang-orang yang tidak percaya?[a][b]
  to: Namun, saudara berperkara melawan saudara[b], dan ini di hadapan orang-orang yang tidak percaya[a]?
  rationale: Revisi memisahkan dengan jelas makna forensik κρίνεται (“berperkara”) dari hubungan pertentangan yang tersirat dalam μετὰ (“melawan”), sehingga tidak menambahkan peran penggugat yang tidak dipastikan oleh bentuk Yunani. Frasa καὶ τοῦτο diterjemahkan lebih dekat sebagai “dan ini.” Penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
