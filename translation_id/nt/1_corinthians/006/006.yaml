  - severity: low
    issue: “Dan bahkan” sedikit memperkuat καὶ τοῦτο.
    rationale: Frasa Yunani memang bernada mencela, tetapi secara leksikal berbunyi “dan ini.” Nada retoris sudah cukup tersampaikan oleh susunan pertanyaan tanpa “bahkan.”
