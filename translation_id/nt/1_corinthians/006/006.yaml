  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: id
  text: Namun, saudara berperkara melawan saudara[b], dan ini di hadapan orang-orang yang tidak percaya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di hadapan orang-orang yang tidak percaya itu.” Ungkapan Yunani hanya menyebut “di hadapan orang-orang yang tidak percaya”; dalam konteks perkara hukum, ini kemungkinan merujuk pada pengadilan umum yang dijalankan oleh orang-orang di luar jemaat.
    reason: lexical_alternative
  - marker: b
    text: Pengulangan kata “saudara” menunjuk pada sesama anggota komunitas Kristen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan keadaan ideal pada ayat sebelumnya, sambil tetap wajar dalam bahasa Indonesia modern.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: saudara ... saudara
  rationale: Mempertahankan pengulangan dan bahasa kekeluargaan Paulus bagi sesama anggota komunitas Kristen; bentuk tunggal maskulin Yunani dibiarkan tampak dalam teks.
- source_word: μετὰ
  choice: menggugat
  rationale: Nuansa perlawanan yang dibawa frasa ini dalam konteks hukum tersampaikan secara alami melalui verba 'menggugat'; menerjemahkannya secara terpisah sebagai 'dengan' akan terasa kabur.
- source_word: κρίνεται
  choice: menggugat
  rationale: Dalam konteks perkara hukum, bentuk ini menunjuk pada berperkara atau membawa sengketa ke pengadilan. 'Menggugat' ringkas dan idiomatis, meskipun bentuk Yunani secara harfiah dapat berarti 'diadili'.
- source_word: καὶ τοῦτο
  choice: dan bahkan
  rationale: 'Mengungkapkan daya retoris frasa tersebut: yang mengejutkan bukan hanya sengketa antarsaudara, tetapi juga tempat perkara itu diajukan.'
- source_word: ἐπὶ ἀπίστων
  choice: di hadapan orang-orang yang tidak percaya
  rationale: Mempertahankan cakupan umum ungkapan Yunani tanpa menambahkan bahwa mereka secara khusus adalah hakim, meskipun konteks pengadilan mengarah ke sana.
theological_decisions:
- issue: Makna representatif ἀδελφός dalam komunitas jemaat
  choice: saudara
  alternative: sesama orang percaya; saudara seiman
  rationale: Pilihan ini menjaga citra keluarga dan bentuk maskulin tunggal teks Yunani. Dalam konteksnya, istilah itu menunjuk pada sesama anggota komunitas Kristen secara representatif, bukan hanya saudara kandung.
- issue: Cakupan ἀπίστων
  choice: orang-orang yang tidak percaya
  alternative: hakim-hakim yang tidak percaya; orang-orang di luar jemaat
  rationale: Teks Yunani hanya menyebut orang-orang yang tidak percaya. Terjemahan tidak mempersempitnya menjadi hakim, sekalipun konteks hukum memungkinkan pemahaman tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menggugat' dipilih untuk konteks forensik, sedangkan pertanyaan retoris dan pengulangan 'saudara' dipertahankan.
