  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: id
  text: Allah telah membangkitkan Tuhan dan juga akan membangkitkan kita dengan kuasa-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam konteks ini δέ merupakan penghubung ringan yang melanjutkan argumen. Bahasa Indonesia mengalir lebih alami tanpa kata penghubung eksplisit, dan penghilangan ini tidak menghilangkan pertentangan yang kuat karena memang tidak ada.
- source_word: θεὸς
  choice: Allah
  rationale: Padanan baku dan alami bagi θεός dalam terjemahan Alkitab bahasa Indonesia; kata ini menjadi subjek dari kedua tindakan membangkitkan.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: κύριος di sini adalah gelar kristologis yang merujuk kepada Yesus. 'Tuhan' mempertahankan gelar tersebut secara ringkas dan lazim.
- source_word: ἤγειρεν
  choice: telah membangkitkan
  rationale: Bentuk aoristus menunjuk pada tindakan Allah yang sudah terjadi, yakni membangkitkan Tuhan dari kematian. 'Telah' memperjelas kontras waktunya dengan tindakan yang akan datang.
- source_word: καὶ ἡμᾶς ἐξεγερεῖ
  choice: dan juga akan membangkitkan kita
  rationale: Terjemahan ini mempertahankan kala mendatang, objek jamak inklusif, dan kesejajaran yang ditandai καί antara kebangkitan Tuhan dan kebangkitan kita. Perbedaan bentuk antara ἐγείρω dan ἐξεγείρω tidak perlu dipaksakan menjadi perbedaan makna dalam bahasa Indonesia.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: dengan kuasa-Nya
  rationale: διά dengan genetif menyatakan sarana. 'Dengan kuasa-Nya' merupakan ungkapan Indonesia yang alami dan menegaskan bahwa kuasa Allah adalah sarana kebangkitan itu.
theological_decisions:
- issue: Rujukan kebangkitan dalam klausa mendatang
  choice: Diterjemahkan secara langsung sebagai tindakan Allah yang kelak membangkitkan 'kita'.
  alternative: Pembenaran ilahi secara umum atau kebangkitan rohani yang bersifat kiasan.
  rationale: Konteks dekat membahas tubuh (1 Korintus 6:13–20), dan kesejajaran dengan tindakan Allah membangkitkan Tuhan sangat mendukung kebangkitan nyata pada masa mendatang. Namun, terjemahan tidak menambahkan kata 'tubuh' atau 'dari antara orang mati', sehingga tetap tidak melampaui bentuk eksplisit teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur kalimat mempertahankan kesejajaran dua tindakan Allah serta perbedaan waktu antara kebangkitan Tuhan yang telah terjadi dan kebangkitan kita yang akan datang.
