id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: id
  text: pencuri, orang serakah[b], pemabuk, pencaci, ataupun pemeras[a] tidak akan mewarisi Kerajaan Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perampok” untuk “pemeras” (ἅρπαγες).
    reason: lexical_alternative
  - marker: b
    text: Atau “orang tamak” untuk “orang serakah” (πλεονέκται).
    reason: lexical_alternative
  - marker: c
    text: Artinya, mereka tidak akan menerima bagian dalam Kerajaan Allah.
    reason: meaning_clarification
lexical_decisions:
- source_word: κλέπται
  choice: pencuri
  rationale: Padanan Indonesia yang alami dan tepat bagi orang yang mencuri; bentuk nomina mempertahankan gaya daftar sifat buruk.
- source_word: πλεονέκται
  choice: orang serakah
  rationale: Menggambarkan orang yang dicirikan oleh hasrat rakus untuk memperoleh lebih banyak; jelas dalam bahasa Indonesia modern.
- source_word: μέθυσοι
  choice: pemabuk
  rationale: Menunjuk pada orang yang dicirikan oleh kebiasaan mabuk, bukan sekadar seseorang yang pernah mabuk.
- source_word: λοίδοροι
  choice: pencaci
  rationale: Mencakup orang yang menghina atau menyerang orang lain dengan kata-kata; lebih luas daripada 'pemfitnah'.
- source_word: ἅρπαγες
  choice: pemeras
  rationale: Menyampaikan gagasan mengambil keuntungan dari orang lain secara ganas atau eksploitatif; alternatif 'perampok' dipertahankan dalam catatan karena istilah Yunani juga dapat menunjuk pada perampasan.
- source_word: βασιλείαν θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan tepat yang mempertahankan resonansi teologis pemerintahan atau kerajaan Allah.
- source_word: κληρονομήσουσιν
  choice: akan mewarisi
  rationale: Mempertahankan metafora warisan serta nuansa eskatologisnya tanpa menjelaskannya secara berlebihan dalam teks utama.
theological_decisions:
- issue: Daya daftar sifat buruk dan bahasa warisan
  choice: Istilah-istilah nomina diterjemahkan sebagai golongan orang yang dicirikan oleh perilaku tersebut, tanpa menambahkan kata seperti 'terus-menerus' atau 'tidak bertobat'.
  alternative: Menafsirkan daftar itu secara eksplisit sebagai tindakan sesekali atau menambahkan penjelasan tentang pola hidup yang tidak disesali.
  rationale: Bentuk jamak substantival dalam konteks daftar sifat buruk secara alami menunjuk pada orang-orang yang dicirikan oleh perilaku itu, tetapi teks tidak menyatakan pembatas interpretatif tersebut secara eksplisit; ketegangan teologis dipertahankan.
- issue: Makna mewarisi Kerajaan Allah
  choice: Mempertahankan ungkapan metaforis 'mewarisi Kerajaan Allah' dalam teks utama.
  alternative: Menguraikannya langsung sebagai 'menerima bagian dalam Kerajaan Allah'.
  rationale: Kata Yunani κληρονομήσουσιν membawa citra menerima warisan; catatan menjelaskan maknanya tanpa menghilangkan metafora Paulus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan mempertahankan bentuk daftar Yunani. Ayat sumber dimulai sebagai kelanjutan daftar dari ayat sebelumnya, sehingga tidak ditambahkan subjek atau pengantar baru; 'ataupun' sebelum unsur terakhir menandai penutup daftar dengan alami.
