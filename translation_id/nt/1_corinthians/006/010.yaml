review_pass:
  verdict: approve
  source_fidelity: Teks Indonesia dengan tepat mempertahankan lima golongan dalam daftar Yunani dan predikat masa depan negatif, “tidak akan mewarisi Kerajaan Allah.” “Pencuri,” “orang serakah,” “pemabuk,” dan “pencaci” secara memadai menerjemahkan κλέπται, πλεονέκται, μέθυσοι, dan λοίδοροι. “Pemeras” merupakan padanan yang dapat dipertanggungjawabkan bagi ἅρπαγες dalam konteks eksploitasi untuk keuntungan, sementara catatan menyediakan alternatif “perampok.” Metafora κληρονομήσουσιν dipertahankan.
  naturalness: Susunan daftar tanpa subjek eksplisit wajar karena ayat ini merupakan lanjutan sintaksis dari daftar sebelumnya. Diksi “orang serakah,” “pemabuk,” “pencaci,” dan “Kerajaan Allah” jelas, modern, serta tetap bernada bermartabat. Penggunaan “ataupun” sebelum unsur terakhir juga alami dalam daftar yang seluruhnya dinafikan.
  terminology: 'Istilah kunci konsisten dan tepat: “Kerajaan Allah” mempertahankan βασιλείαν θεοῦ, sedangkan “akan mewarisi” mempertahankan citra warisan dari κληρονομήσουσιν. Catatan a dan b menyediakan alternatif leksikal yang relevan; catatan c menjelaskan akibat ungkapan warisan tanpa menggantikannya dalam teks utama. Semua jangkar catatan pada teks Indonesia terpasang pada unsur yang sesuai.'
