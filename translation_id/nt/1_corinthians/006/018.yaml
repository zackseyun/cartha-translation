id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: id
  text: Jauhilah percabulan. Setiap dosa yang mungkin dilakukan seseorang berada di luar tubuh[a], tetapi orang yang melakukan percabulan berdosa terhadap tubuhnya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di luar tubuh” diterjemahkan secara harfiah; maksud tepat pernyataan ini diperdebatkan.
    reason: Menjaga ketegangan eksegetis dalam teks tanpa menetapkan apakah klausa ini mutlak, retoris, atau kutipan slogan.
lexical_decisions:
- source_word: φεύγετε
  choice: Jauhilah
  rationale: Imperatif kini orang kedua jamak menyampaikan perintah tegas untuk terus menghindar; “jauhilah” alami dalam bahasa Indonesia dan mempertahankan daya perintah tanpa parafrasa berlebihan.
- source_word: πορνείαν
  choice: percabulan
  rationale: πορνεία mencakup perilaku seksual yang tidak sah secara luas. “Percabulan” adalah istilah Indonesia yang ringkas, bermartabat, dan cukup luas dalam konteks Alkitab.
- source_word: πᾶν ἁμάρτημα
  choice: Setiap dosa
  rationale: Mempertahankan bentuk generik dan menyeluruh dari frasa Yunani tanpa melunakkan pernyataannya.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: yang mungkin dilakukan seseorang
  rationale: ἄνθρωπος memiliki arti generik, bukan menunjuk khusus kepada laki-laki; “seseorang” menyampaikan cakupan representatif itu secara alami, sedangkan “mungkin” mencerminkan konstruksi ἐὰν dengan subjungtif.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: berada di luar tubuh
  rationale: Menerjemahkan gambaran spasial/metaforis secara langsung dan mempertahankan kontras Paulus dengan klausa berikutnya.
- source_word: ὁ δὲ πορνεύων
  choice: tetapi orang yang melakukan percabulan
  rationale: Mempertahankan daya verbal partisipel kini dan menghubungkannya secara jelas dengan πορνεία pada perintah pembuka.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: berdosa terhadap tubuhnya sendiri
  rationale: “Terhadap” menyampaikan arah atau sasaran dosa yang dinyatakan oleh εἰς dalam idiom ini, sedangkan “tubuhnya sendiri” mempertahankan penekanan refleksif ἴδιον.
theological_decisions:
- issue: Arti generik ἄνθρωπος
  choice: seseorang
  alternative: seorang manusia; seorang laki-laki
  rationale: Dalam pernyataan umum ini, ἄνθρωπος bersifat representatif dan mencakup manusia tanpa membatasi jenis kelamin. Bahasa Indonesia tidak mengharuskan maskulin gramatikal, sehingga “seseorang” paling alami dan tepat.
- issue: Pernyataan bahwa setiap dosa berada di luar tubuh
  choice: Menerjemahkan klausa secara langsung dan mempertahankan ketegangannya
  alternative: Menandainya sebagai slogan jemaat Korintus atau menambahkan penjelasan doktrinal
  rationale: Teks Yunani menyajikan klausa itu secara langsung. Terjemahan tidak memutuskan perdebatan eksegetis atau menyisipkan harmonisasi yang tidak dinyatakan oleh teks.
- issue: Hubungan εἰς dengan tubuh sendiri
  choice: berdosa terhadap tubuhnya sendiri
  alternative: berdosa di dalam tubuhnya sendiri; berdosa berkenaan dengan tubuhnya sendiri
  rationale: “Terhadap” merupakan padanan idiomatis yang paling jelas sambil mempertahankan gagasan bahwa dosa itu secara khusus mengenai tubuh pelakunya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Jauhilah” memberi daya perintah yang alami; “percabulan” mempertahankan istilah luas bagi perilaku seksual yang tidak sah. Penanda catatan kaki [a] muncul dalam teks utama.
