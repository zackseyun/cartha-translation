id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: id
  text: Atau tidak tahukah kalian bahwa orang-orang kudus akan menghakimi dunia? Dan jika dunia dihakimi oleh kalian,[a] apakah kalian tidak layak mengadili perkara-perkara yang paling kecil?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara kalian.” Secara lebih harfiah, frasa Yunaninya dapat dibaca “jika dunia dihakimi di antara kalian,” tetapi dalam konteks ini maksudnya tampaknya ialah bahwa orang-orang kudus ikut menghakimi dunia.
    reason: lexical_alternative
  - marker: b
    text: Atau “menangani pengadilan-pengadilan yang paling kecil.” Kata Yunani yang dipakai dapat menunjuk pada tempat atau lembaga pengadilan maupun perkara yang diputuskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan kelanjutan alternatif-retoris yang tajam dari argumen ayat sebelumnya.
- source_word: οὐκ οἴδατε
  choice: tidak tahukah kalian
  rationale: Menerjemahkan rumusan retoris Paulus secara dekat sekaligus wajar dalam bahasa Indonesia.
- source_word: οἱ ἅγιοι
  choice: orang-orang kudus
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk kepada umat yang dikhususkan bagi Allah, bukan hanya kelompok elite tertentu.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Padanan alami yang tetap mencakup lingkup manusiawi atau kosmis tanpa mempersempit rujukannya.
- source_word: κρινοῦσιν
  choice: akan menghakimi
  rationale: Menjaga bentuk masa depan dan makna inti tindakan penghakiman tanpa menentukan bagaimana tindakan itu dilaksanakan.
- source_word: ἐν ὑμῖν
  choice: oleh kalian
  rationale: Dalam konteks yudisial, frasa ini dapat menyatakan keterlibatan orang percaya sebagai pelaku penghakiman; alternatif harfiahnya dicatat karena ἐν juga dapat berarti 'di antara'.
- source_word: κρίνεται
  choice: dihakimi
  rationale: Mempertahankan bentuk pasif; dalam klausa bersyarat bentuk kini Yunani memiliki arah umum atau mendatang.
- source_word: ἀνάξιοί ἐστε
  choice: apakah kalian tidak layak
  rationale: Menjaga daya evaluatif dan sengatan retoris ἀνάξιος, alih-alih hanya menyatakan ketidakmampuan teknis.
- source_word: κριτηρίων ἐλαχίστων
  choice: mengadili perkara-perkara yang paling kecil
  rationale: Dalam konteks perselisihan yang dibawa ke pengadilan, κριτήριον dapat menunjuk pada perkara atau hal yang harus diputuskan. Ungkapan ini lebih alami dalam bahasa Indonesia daripada 'pengadilan-pengadilan terkecil' dan menjaga superlatif ἐλαχίστων.
theological_decisions:
- issue: Identitas 'orang-orang kudus'
  choice: umat Allah atau orang percaya secara umum
  alternative: kelompok sempit orang percaya yang memiliki tingkat kekudusan khusus
  rationale: Pemakaian Paulus biasanya bersifat korporat bagi umat yang dikhususkan bagi Allah; terjemahan tidak memasukkan gagasan kanonisasi atau kelompok elite.
- issue: Orang-orang kudus menghakimi dunia
  choice: keterlibatan nyata dalam penghakiman mendatang tanpa menentukan cara atau kadar kewenangannya
  alternative: sekadar penilaian moral metaforis, atau kewenangan yudisial mandiri sepenuhnya
  rationale: Teks menegaskan partisipasi dalam penghakiman, tetapi tidak menjelaskan mekanismenya; ketegangan itu dipertahankan.
- issue: Makna κριτηρίων
  choice: perkara-perkara yang harus diadili
  alternative: ruang atau lembaga pengadilan
  rationale: Keduanya dimungkinkan secara leksikal. Konteks perselisihan internal dan pertanyaan tentang kelayakan lebih alami merujuk pada perkara-perkara kecil, sementara alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk menampilkan bentuk jamak ὑμῖν secara jelas. Diksi dibuat lugas dan bermartabat; struktur pertanyaan retoris Paulus dipertahankan.
