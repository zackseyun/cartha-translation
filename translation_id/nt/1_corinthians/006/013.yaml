reference: 1 Corinthians 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: id
  text: Makanan adalah untuk perut, dan perut untuk makanan—tetapi Allah akan meniadakan baik perut maupun makanan.[a] Namun, tubuh bukan untuk percabulan, melainkan untuk Tuhan, dan Tuhan untuk tubuh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “meniadakan” juga dapat berarti “menghapuskan”, “membuat tidak berlaku”, atau “membinasakan”. Sebagian penafsir memahami perkataan tentang makanan dan perut sebagai semboyan jemaat Korintus yang dikutip Paulus sebelum ia mengoreksinya.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: Secara harfiah, “tubuh bukan bagi percabulan, melainkan bagi Tuhan, dan Tuhan bagi tubuh.”
    reason: formal_equivalence_note
lexical_decisions:
- source_word: τὰ βρώματα
  choice: makanan
  rationale: Walaupun bentuk Yunaninya jamak, bahasa Indonesia lazim memakai nomina kolektif “makanan” untuk pernyataan umum seperti ini.
- source_word: τῇ κοιλίᾳ / ἡ κοιλία
  choice: perut
  rationale: Dalam konteks makanan dan fungsi pencernaan, “perut” merupakan padanan modern yang paling alami dan jelas.
- source_word: καταργήσει
  choice: akan meniadakan
  rationale: Kata kerja ini menyatakan bahwa Allah akan mengakhiri atau membuat tidak berlaku lagi; “meniadakan” mempertahankan cakupan itu tanpa harus menyiratkan pemusnahan fisik.
- source_word: καὶ ταύτην καὶ ταῦτα
  choice: baik perut maupun makanan
  rationale: Rujukan kedua pronomina dijelaskan dengan mengulangi nomina agar hubungan masing-masing dengan “perut” dan “makanan” jelas dan alami dalam bahasa Indonesia.
- source_word: τὸ σῶμα
  choice: tubuh
  rationale: Padanan baku yang mempertahankan acuan pada tubuh jasmani beserta bobot teologisnya dalam argumen Paulus.
- source_word: πορνείᾳ
  choice: percabulan
  rationale: “Percabulan” adalah istilah Indonesia yang ringkas dan cukup luas untuk perilaku seksual yang tidak bermoral dalam konteks ini.
- source_word: τῷ κυρίῳ / ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku bagi κύριος ketika merujuk kepada Yesus dan mempertahankan bobot kristologis serta hubungan timbal balik dalam kalimat.
- source_word: δὲ
  choice: tetapi / namun
  rationale: 'Kedua padanan menandai pertentangan: “tetapi” menghubungkan tindakan Allah dengan pernyataan sebelumnya, sedangkan “namun” menonjolkan peralihan korektif kepada tujuan tubuh.'
theological_decisions:
- issue: Apakah klausa pembuka merupakan semboyan jemaat Korintus atau pernyataan Paulus sendiri
  choice: Disajikan tanpa tanda petik sebagai pernyataan langsung.
  alternative: Menaruhnya dalam tanda petik sebagai semboyan jemaat Korintus atau menambahkan “Kamu berkata”.
  rationale: Teks Yunani tidak memiliki penanda kutipan. Tanda pisah mempertahankan kontras dengan koreksi berikutnya tanpa memastikan identitas penuturnya.
- issue: Makna καταργήσει bagi perut dan makanan
  choice: “akan meniadakan” untuk menyatakan berakhirnya keberadaan atau fungsi keduanya.
  alternative: “akan membinasakan” atau “akan menghapuskan”.
  rationale: Pilihan ini mempertahankan gagasan bahwa tatanan makanan-perut bersifat sementara tanpa memaksakan gagasan pemusnahan fisik.
- issue: Daya ungkap frasa “Tuhan untuk tubuh”
  choice: Mempertahankan rumusan timbal balik yang singkat.
  alternative: Memperluasnya menjadi “Tuhan memelihara tubuh” atau “Tuhan adalah untuk kebaikan tubuh”.
  rationale: Bahasa Yunani ringkas dan sejajar dengan klausa sebelumnya; penjelasan tambahan akan menentukan sifat hubungan itu melampaui yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan sejauh alami; ambiguitas mengenai semboyan Korintus serta keringkasan ungkapan “Tuhan untuk tubuh” tidak diselesaikan secara dogmatis.
