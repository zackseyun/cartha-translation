  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: id
  text: Aku mengatakan hal ini supaya kamu merasa malu. Apakah memang demikian? Di antara kamu tidak ada seorang pun yang bijak[a] yang akan mampu memutuskan perkara di antara saudara-saudara seiman[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, ungkapan ini berbentuk maskulin tunggal, tetapi Paulus sedang berbicara kepada seluruh jemaat.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “di antara saudaranya.” Ungkapan Yunani ini eliptis: pihak lain dalam sengketa tersirat. “Saudara” di sini menunjuk kepada sesama orang percaya dan, dalam konteks jemaat, dapat mencakup laki-laki maupun perempuan.'
    reason: source_ambiguity
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: Aku mengatakan hal ini supaya kamu merasa malu
  rationale: Ungkapan πρὸς ἐντροπὴν menyatakan tujuan atau hasil yang diarahkan pada rasa malu para pembaca. Bentuk ini mempertahankan daya teguran Paulus tanpa menyiratkan sekadar penghinaan.
- source_word: οὕτως
  choice: Apakah memang demikian
  rationale: Dalam konteks ini οὕτως mengantar pertanyaan retoris yang bernada tidak percaya dan menegur; 'memang' menyampaikan tekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: di antara kamu tidak ada seorang pun yang bijak
  rationale: Terjemahan ini mempertahankan penyangkalan tegas dan latar komunitas. 'Orang ... yang bijak' bersifat alami dan tidak menentukan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: δυνήσεται διακρῖναι
  choice: akan mampu memberi keputusan
  rationale: Bentuk mendatang δυνήσεται dipertahankan dengan 'akan mampu', sedangkan διακρῖναι dalam konteks sengketa berarti menilai dan menetapkan keputusan, bukan sekadar membedakan.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: dalam perkara di antara saudara-saudaranya
  rationale: Bahasa Yunani berbentuk elipsis sesudah 'di antara' dan hanya menyebut 'saudaranya' dalam bentuk tunggal, sementara pihak lain tersirat oleh konteks sengketa. Rumusan Indonesia ini membuat hubungan antarpihak dapat dipahami tanpa mengganti bahasa kekeluargaan jemaat.
theological_decisions:
- issue: Bahasa maskulin representatif bagi jemaat campuran
  choice: seorang pun yang bijak
  alternative: seorang laki-laki bijak
  rationale: οὐδεὶς σοφός berbentuk maskulin tunggal, tetapi dalam sapaan kepada seluruh jemaat bentuk itu dapat bersifat representatif. Bahasa Indonesia tidak perlu menambahkan 'laki-laki'; catatan kaki mempertahankan informasi bentuk sumber.
- issue: Makna ἀδελφός dalam sengketa jemaat
  choice: saudara-saudaranya
  alternative: sesama orang percaya
  rationale: Bahasa kekeluargaan Paulus dipertahankan, sementara catatan kaki menjelaskan bahwa dalam konteks ini istilah tersebut menunjuk pada sesama orang percaya dan dapat mencakup laki-laki maupun perempuan.
- issue: Elipsis dalam frasa 'di antara saudaranya'
  choice: dalam perkara di antara saudara-saudaranya
  alternative: antara saudaranya dan pihak lain
  rationale: Teks Yunani menyebut satu 'saudara' setelah ungkapan 'di antara', sehingga pihak kedua tersirat. Terjemahan utama menyampaikan hubungan timbal balik secara alami, dan catatan menjelaskan bentuk harfiahnya agar ambiguitas tekstual tidak disembunyikan.
translation_notes:
  register: Menggunakan bahasa Indonesia baku modern dengan nada teguran yang tegas namun tetap wajar. Kata ganti 'kamu' dipakai sebagai sapaan jamak kepada jemaat; 'memberi keputusan' mempertahankan nuansa yudisial tanpa terdengar seperti jabatan hakim negara.
