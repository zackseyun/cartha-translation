review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “seperti yang difirmankan-Nya” menentukan subjek φησίν sebagai Allah dan menambahkan nuansa pewahyuan yang tidak dinyatakan oleh teks Yunani. Selain itu, ἐστίν adalah bentuk kini “adalah,” sehingga “adalah satu tubuh” lebih setia daripada “menjadi satu tubuh” pada klausa pertama. Kutipan Kejadian tetap tepat diterjemahkan “akan menjadi satu daging.”
  naturalness: Teks yang direvisi tetap baku dan alami dalam bahasa Indonesia modern. “Seperti yang dikatakan” merupakan pengantar kutipan yang idiomatis tanpa memaksakan identitas pembicara yang tidak disebutkan dalam bahasa Yunani.
  terminology: “Pelacur,” “satu tubuh,” dan “satu daging” sudah tepat. Pembedaan “satu tubuh” (σῶμα) dan “satu daging” (σάρξ) harus dipertahankan. Bentuk “kalian” cocok untuk sapaan jamak retoris Paulus.
  issues:
  - severity: medium
    issue: Subjek φησίν terlalu dispesifikkan sebagai Allah dalam “seperti yang difirmankan-Nya.”
    rationale: φησίν secara harfiah berarti “ia berkata” dan tidak menyebut Allah, Kitab Suci, atau subjek lain. Kapitalisasi serta “difirmankan” menghilangkan ambiguitas sumber dan menambahkan penafsiran.
  - severity: low
    issue: “Menjadi satu tubuh” pada klausa pertama menggeser bentuk kini ἐστίν.
    rationale: Dalam konteks ini ungkapan hasil persatuan memang tersirat, tetapi teks Yunani menyatakan “adalah satu tubuh.” Pemakaian “adalah” mempertahankan bentuk dan hubungan argumentatifnya dengan lebih dekat.
  revised_text: Atau tidak tahukah kalian bahwa orang yang menyatukan dirinya dengan seorang pelacur adalah satu tubuh dengannya? Sebab, seperti yang dikatakan[a], “Keduanya akan menjadi satu daging.”
  revised_footnotes:
  - marker: a
    text: Secara harfiah, “ia berkata”; kutipan ini berasal dari Kejadian 2:24.
    reason: cross_reference_and_source_ambiguity
  revision_rationale: Revisi menghilangkan penetapan teologis yang tidak eksplisit pada φησίν sambil mempertahankan rujukan kutipan melalui catatan kaki. Klausa utama diselaraskan dengan ἐστίν (“adalah”), sedangkan “akan menjadi satu daging” tetap mencerminkan kutipan Yunani dari Kejadian.
