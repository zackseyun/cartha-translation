revisions:
- from: Atau tidak tahukah kalian bahwa orang yang menyatukan dirinya dengan seorang pelacur menjadi satu tubuh dengannya? Sebab, seperti yang difirmankan-Nya[a], “Keduanya akan menjadi satu daging.”
  to: Atau tidak tahukah kalian bahwa orang yang menyatukan dirinya dengan seorang pelacur adalah satu tubuh dengannya? Sebab, seperti yang dikatakan[a], “Keduanya akan menjadi satu daging.”
  rationale: Revisi menghilangkan penetapan teologis yang tidak eksplisit pada φησίν sambil mempertahankan rujukan kutipan melalui catatan kaki. Klausa utama diselaraskan dengan ἐστίν (“adalah”), sedangkan “akan menjadi satu daging” tetap mencerminkan kutipan Yunani dari Kejadian.
