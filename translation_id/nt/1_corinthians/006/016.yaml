base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: id
  text: Atau tidak tahukah kalian bahwa orang yang menyatukan dirinya dengan seorang pelacur adalah satu tubuh dengannya? Sebab, seperti yang dikatakan[a], “Keduanya akan menjadi satu daging.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia berkata”; kutipan ini berasal dari Kejadian 2:24.
    reason: cross_reference_and_source_ambiguity
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan kelanjutan alternatif-retoris dalam alur argumen Paulus.
- source_word: οὐκ οἴδατε
  choice: tidak tahukah kalian
  rationale: Mencerminkan rumusan retoris khas Paulus dan memakai bentuk jamak yang jelas dalam bahasa Indonesia.
- source_word: ὁ κολλώμενος
  choice: orang yang menyatukan dirinya
  rationale: Dalam konteks hubungan seksual, κολλάομαι menyatakan tindakan melekat atau menyatukan diri; pilihan ini alami sekaligus mempertahankan keterlibatan pribadi subjek.
- source_word: τῇ πόρνῃ
  choice: dengan seorang pelacur
  rationale: πόρνη secara khusus berarti pelacur; artikelnya berfungsi generik sehingga bentuk tak tentu wajar dalam bahasa Indonesia.
- source_word: ἓν σῶμά ἐστιν
  choice: menjadi satu tubuh dengannya
  rationale: Walaupun bentuk Yunaninya secara harfiah berarti 'adalah satu tubuh', bahasa Indonesia lebih alami memakai 'menjadi' untuk menyatakan persatuan yang dihasilkan; 'dengannya' menjelaskan relasi yang tersirat.
- source_word: Ἔσονται γάρ
  choice: Sebab ... akan menjadi
  rationale: γάρ memberi dasar bagi pernyataan sebelumnya, sedangkan konstruksi ἔσονται ... εἰς dalam kutipan menyatakan hasil atau keadaan yang terjadi.
- source_word: φησίν
  choice: seperti yang difirmankan-Nya
  rationale: Mempertahankan subjek tunggal yang tidak disebutkan secara eksplisit sambil menyatakan bahwa kutipan Kitab Suci dipahami sebagai firman Allah; catatan kaki menjaga bentuk Yunani dan sumber kutipan tetap terlihat.
- source_word: οἱ δύο
  choice: Keduanya
  rationale: Padanan Indonesia yang ringkas dan alami bagi 'yang dua itu' dalam kutipan.
- source_word: εἰς σάρκα μίαν
  choice: menjadi satu daging
  rationale: Mempertahankan ungkapan khas Kejadian tentang persatuan jasmani-relasional tanpa menafsirkannya sebagai 'natur berdosa'.
theological_decisions:
- issue: Implikasi kutipan Kejadian bagi hubungan seksual di luar pernikahan
  choice: Menyajikan kutipan sebagai dasar langsung bagi pernyataan Paulus bahwa hubungan seksual dengan pelacur menghasilkan persatuan jasmani 'satu daging'.
  alternative: Membatasi kutipan hanya pada pernikahan atau menambahkan kesimpulan doktrinal dan moral yang tidak dinyatakan langsung dalam ayat.
  rationale: Paulus sendiri menerapkan Kejadian 2:24 secara analogis pada hubungan dengan pelacur. Terjemahan perlu mempertahankan daya teologis dan ketegangan itu tanpa memperluas isi ayat.
- issue: Subjek φησίν yang tidak dinyatakan
  choice: Menerjemahkan 'seperti yang difirmankan-Nya' dan menjelaskan bentuk harfiahnya dalam catatan kaki.
  alternative: Menerjemahkan 'seperti yang dikatakan Kitab Suci' atau secara harfiah 'katanya'.
  rationale: Bentuk Yunani hanya berarti 'ia berkata' tanpa menyebut subjek. Pilihan utama alami dalam register Alkitab Indonesia, sedangkan catatan kaki mencegah ambiguitas sumber dihapus sepenuhnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai agar jumlah gramatikal jelas dan tetap mudah dipahami. Istilah 'satu tubuh' dan 'satu daging' dipertahankan sebagai dua ungkapan yang saling menjelaskan dalam argumen Paulus.
