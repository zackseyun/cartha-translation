reference: 1 Corinthians 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: id
  text: Dan sebagian dari kamu dahulu seperti itu. Tetapi kamu telah dibasuh, tetapi kamu telah dikuduskan, tetapi kamu telah dibenarkan dalam nama Tuhan Yesus dan dalam Roh Allah kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Dan dahulu sebagian dari kamu memang seperti itu
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap menunjuk kembali pada golongan-golongan dalam daftar sebelumnya; 'dahulu' menyampaikan keadaan lampau dari bentuk imperfek ἦτε, dan 'memang' mempertahankan penekanannya.
- source_word: ἀλλὰ (tiga kali)
  choice: Namun ... [kamu telah] ... , [kamu telah] ... , [kamu telah] ...
  rationale: Kontras kuat dipertahankan dengan 'Namun'. Pengulangan ἀλλά selanjutnya tidak diterjemahkan sebagai tiga kali 'tetapi' karena terdengar kaku dalam bahasa Indonesia; kesejajaran tiga klausa tetap mempertahankan daya retorisnya.
- source_word: ἀπελούσασθε
  choice: kamu telah dibasuh
  rationale: Walaupun bentuk Yunani dapat dipahami secara medial/refleksif, konteksnya menempatkan kata ini bersama dua bentuk pasif tentang tindakan penyelamatan. Terjemahan pasif dipilih, sedangkan kemungkinan refleksif dicatat dalam catatan kaki.
- source_word: ἡγιάσθητε
  choice: kamu telah dikuduskan
  rationale: '''Dikuduskan'' mempertahankan istilah Paulus dan bentuk pasifnya, sekaligus tetap lazim dan dapat dipahami dalam bahasa Indonesia gerejawi modern.'
- source_word: ἐδικαιώθητε
  choice: kamu telah dibenarkan
  rationale: '''Dibenarkan'' merupakan padanan ringkas dan mapan bagi δικαιόω serta mempertahankan bentuk pasif tanpa mempersempit seluruh nuansa kata menjadi satu penjelasan.'
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: dalam nama Tuhan Yesus
  rationale: Terjemahan formal-alami ini mempertahankan kemungkinan nuansa lingkup, kewenangan, dasar, atau sarana dari ἐν tanpa memilih salah satunya secara berlebihan.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: dalam Roh Allah kita
  rationale: '''Dalam'' mempertahankan kesejajaran kedua frasa ἐν dan ambiguitas lingkup/sarana. Huruf kapital pada ''Roh'' mencerminkan rujukan yang paling wajar kepada Roh Kudus.'
theological_decisions:
- issue: Suara dan pelaku dalam ἀπελούσασθε
  choice: kamu telah dibasuh
  alternative: kamu telah membasuh dirimu
  rationale: Bentuk medial memungkinkan arti refleksif, tetapi rangkaian dengan 'dikuduskan' dan 'dibenarkan' mendukung pengertian pasif atau medial dengan hasil pasif. Catatan kaki mempertahankan alternatif yang sungguh mungkin.
- issue: Fungsi ἐν dalam dua frasa penutup
  choice: dalam nama Tuhan Yesus dan dalam Roh Allah kita
  alternative: oleh nama Tuhan Yesus dan oleh Roh Allah kita
  rationale: Terjemahan 'dalam' menjaga kesejajaran Yunani dan tidak menutup kemungkinan bahwa ἐν menyatakan lingkup maupun sarana. Pembacaan instrumental tetap mungkin.
- issue: Rujukan πνεύματι τοῦ θεοῦ ἡμῶν
  choice: Roh Allah kita
  alternative: roh Allah kita
  rationale: Dalam konteks Paulus, frasa ini paling wajar menunjuk kepada Roh Kudus; kapitalisasi menandai rujukan itu tanpa menambahkan kata 'Kudus' yang tidak ada di dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dahulu ... memang seperti itu' menghindari ungkapan harfiah yang janggal. Bentuk 'telah' menandai perubahan yang sudah terjadi dan hasilnya relevan, sedangkan pengulangan paralel menjaga tekanan retoris ayat.
