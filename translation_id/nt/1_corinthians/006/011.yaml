review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada makna ayat, termasuk pembacaan pasif/medial untuk ἀπελούσασθε dan ambiguitas ἐν melalui “dalam.” Namun, tiga ἀλλά yang berulang merupakan penegasan retoris yang sebaiknya tampak dalam teks Indonesia, bukan hanya pada klausa pertama.
  naturalness: Bahasa draf baku dan jelas. Pengulangan “tetapi” tiga kali tetap dapat diterima dalam ragam Alkitab yang bermartabat dan lebih mencerminkan susunan penegasan sumber.
  terminology: “Dibasuh,” “dikuduskan,” “dibenarkan,” “Tuhan Yesus,” dan “Roh Allah kita” adalah padanan yang tepat dan lazim. Kapitalisasi “Roh” wajar dalam konteks ini tanpa menambahkan “Kudus.”
  issues:
  - severity: medium
    issue: Pengulangan tiga kali ἀλλά tidak dipertahankan.
    rationale: 'Teks Yunani menempatkan ἀλλά sebelum masing-masing dari tiga tindakan: “tetapi ... tetapi ... tetapi.” Draf hanya menerjemahkan kontras pertama dengan “Namun,” sehingga sebagian tekanan dan ritme argumentatif Paulus hilang.'
  - severity: low
    issue: Kata “memang” dalam klausa pembuka dapat memberi penegasan tambahan yang tidak perlu.
    rationale: Penunjuk ταῦτα memang memberi tekanan pada golongan yang baru disebutkan, tetapi “dahulu sebagian dari kamu seperti itu” sudah menyampaikan maksud tersebut secara alami tanpa nuansa afirmatif tambahan dari “memang.”
  revised_text: Dan sebagian dari kamu dahulu seperti itu. Tetapi kamu telah dibasuh, tetapi kamu telah dikuduskan, tetapi kamu telah dibenarkan dalam nama Tuhan Yesus dan dalam Roh Allah kita.
