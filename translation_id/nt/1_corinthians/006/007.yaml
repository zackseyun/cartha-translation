  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: id
  text: Jadi, kenyataan bahwa kalian mempunyai perkara hukum di antara kalian sendiri sudah merupakan kekalahan total bagi kalian.[a][b] Mengapa kalian tidak lebih baik menderita ketidakadilan? Mengapa kalian tidak lebih baik menanggung kerugian?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerugian total” atau “kegagalan total” sebagai ganti “kekalahan total.” Kata Yunani ἥττημα dapat menunjuk pada kekalahan, kerugian, atau kegagalan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kasus-kasus hukum” sebagai ganti “perkara hukum.”
    reason: lexical_alternative
  - marker: c
    text: Atau “ditipu” atau “dirampas” sebagai ganti “menanggung kerugian.” Kata Yunani ἀποστερεῖσθε dapat berarti dibuat kehilangan sesuatu, ditipu, atau dirampas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν
  choice: Jadi, ... sudah
  rationale: Mengungkapkan kesimpulan yang ditarik dari teguran sebelumnya serta keadaan yang telah nyata, tanpa membuat rangkaian partikel Yunani terasa kaku dalam bahasa Indonesia.
- source_word: ὅλως ἥττημα
  choice: kekalahan total
  rationale: ἥττημα menunjuk pada kekalahan, kerugian, atau kegagalan, sedangkan ὅλως memperkuat penilaian itu. Ungkapan ini mempertahankan daya retoris Paulus.
- source_word: ὑμῖν ἐστιν
  choice: merupakan ... bagi kalian
  rationale: Mempertahankan datif acuan secara wajar tanpa menambahkan gagasan 'memalukan' yang tidak dinyatakan langsung.
- source_word: κρίματα
  choice: perkara hukum
  rationale: Dalam konteks perselisihan yang dibawa ke pengadilan, frasa ini lebih tepat daripada 'penghakiman' dan cukup luas untuk mencakup kasus atau gugatan hukum.
- source_word: μεθ’ ἑαυτῶν
  choice: di antara kalian sendiri
  rationale: Menegaskan bahwa sengketa berlangsung di dalam komunitas mereka sendiri.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Mengapa kalian tidak lebih baik
  rationale: Menyampaikan pertanyaan retoris dan daya komparatif μᾶλλον secara alami dalam bahasa Indonesia.
- source_word: ἀδικεῖσθε
  choice: diperlakukan tidak adil
  rationale: Mempertahankan bentuk pasif dan dimensi ketidakadilan secara jelas.
- source_word: ἀποστερεῖσθε
  choice: dirugikan
  rationale: Kata Yunani dapat berarti dirampas, ditipu, atau dibuat kehilangan sesuatu. 'Dirugikan' alami dalam konteks sengketa hukum sekaligus tidak membatasi kerugian pada penipuan finansial.
theological_decisions:
- issue: Sifat penilaian Paulus atas perkara hukum di antara sesama orang percaya
  choice: kekalahan total
  alternative: kerugian besar; kegagalan total
  rationale: Terjemahan ini mempertahankan penilaian moral Paulus bahwa keberadaan perkara itu sendiri sudah merupakan kekalahan, tanpa menetapkan kategori doktrinal tambahan.
- issue: Ajakan untuk menerima kerugian
  choice: Pertanyaan retoris dipertahankan tanpa menambahkan batasan atau penerapan
  alternative: Menjelaskannya sebagai larangan mutlak menuntut keadilan dalam semua keadaan
  rationale: Ayat ini mengontraskan gugatan di antara anggota komunitas dengan kesediaan menanggung ketidakadilan; terjemahan tidak memperluasnya menjadi aturan eksplisit bagi setiap keadaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar rujukan kepada komunitas jelas. Susunan kalimat dibuat alami dan bermartabat, sementara penekanan 'sudah' dan 'total' mempertahankan kekuatan retoris teks Yunani.
