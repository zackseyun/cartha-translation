source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: id
  text: Jadi, jika kamu mempunyai perkara-perkara kehidupan sehari-hari untuk diadili[a], apakah kamu mengangkat sebagai hakim orang-orang yang tidak terpandang dalam jemaat[b]?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkara-perkara kehidupan duniawi”; ungkapan Yunani menunjuk pada urusan biasa dalam kehidupan di dunia, khususnya urusan sipil atau urusan temporal.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang yang diremehkan dalam jemaat.” Ungkapan Yunani dapat menunjuk, mungkin secara ironis, baik kepada orang yang dianggap tidak berarti di dalam jemaat maupun kepada orang yang tidak memiliki kedudukan dari sudut pandang jemaat.
    reason: alternative_reading
  - marker: c
    text: 'Sebagian orang memahami klausa ini sebagai perintah bernada sindiran: “angkatlah orang-orang yang tidak terpandang dalam jemaat sebagai hakim!”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: kehidupan sehari-hari
  rationale: Kata ini menunjuk pada urusan biasa dalam kehidupan duniawi, khususnya perkara sipil atau sementara. Pilihan ini alami dalam bahasa Indonesia dan menghindari kesan moral negatif yang dapat timbul dari kata “duniawi”.
- source_word: κριτήρια
  choice: perkara ... yang harus diadili
  rationale: Dalam konteks ini kata tersebut dapat menunjuk pada perkara atau proses pengadilan. Ungkapan ini mempertahankan fokus pada sengketa yang memerlukan putusan tanpa memaksakan arti kelembagaan “pengadilan”.
- source_word: ἐὰν ἔχητε
  choice: jika kamu mempunyai
  rationale: Menerjemahkan bentuk bersyarat Yunani secara langsung dan wajar. Kata ganti “kamu” merujuk secara kolektif kepada jemaat.
- source_word: τοὺς ἐξουθενημένους
  choice: orang-orang yang tidak terpandang
  rationale: Partisip ini menggambarkan orang yang dianggap tidak berarti, diremehkan, atau tidak memiliki kedudukan. “Tidak terpandang” mempertahankan nuansa penilaian sosial tanpa memastikan apakah mereka anggota yang dianggap remeh atau orang luar yang tidak berkedudukan di mata jemaat.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: dalam jemaat
  rationale: “Jemaat” secara alami menunjuk pada komunitas orang percaya. Frasa ini tetap membuka kemungkinan bahwa orang-orang tersebut berada di dalam jemaat atau sekadar dinilai tidak berkedudukan dari sudut pandang jemaat.
- source_word: τούτους καθίζετε
  choice: apakah kamu mengangkat sebagai hakim
  rationale: καθίζω secara harfiah berarti “mendudukkan”, tetapi dalam konteks peradilan berarti menempatkan atau mengangkat seseorang untuk menghakimi. Bentuk pertanyaan mengikuti tanda baca SBLGNT dan menyampaikan teguran retoris dengan jelas.
theological_decisions:
- issue: Apakah klausa terakhir merupakan pertanyaan retoris atau perintah bernada sindiran
  choice: 'Diterjemahkan sebagai pertanyaan retoris: “apakah kamu mengangkat sebagai hakim ...?”'
  alternative: 'Diterjemahkan sebagai perintah bernada sindiran: “angkatlah ... sebagai hakim!”'
  rationale: Susunan Yunani dapat dipahami dengan kedua cara. Tanda baca SBLGNT mendukung pertanyaan, dan konteks 1 Korintus 6:1–6 cocok dengan teguran retoris. Catatan kaki mempertahankan pembacaan imperatif sebagai kemungkinan nyata.
- issue: Identitas orang-orang yang disebut τοὺς ἐξουθενημένους
  choice: Dibiarkan terbuka melalui ungkapan “orang-orang yang tidak terpandang dalam jemaat”
  alternative: Menentukan mereka sebagai orang luar yang tidak memiliki kedudukan di mata jemaat, atau sebagai anggota jemaat yang diremehkan
  rationale: Teks Yunani tidak memastikan apakah yang dimaksud adalah anggota yang dianggap tidak berarti atau orang luar yang tidak berkedudukan menurut penilaian jemaat. Terjemahan tidak menyelesaikan ketegangan ini secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Kamu” dipakai sebagai sapaan jamak kepada jemaat sesuai konteks surat. Struktur kalimat mempertahankan teguran retoris Paulus, sedangkan catatan kaki mencatat ambiguitas sintaksis dan identitas pihak yang dimaksud.
