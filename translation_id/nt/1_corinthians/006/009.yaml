language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: id
  text: 'Atau tidak tahukah kamu bahwa orang-orang yang tidak benar tidak akan mewarisi Kerajaan Allah? Jangan tertipu: baik orang yang melakukan percabulan, penyembah berhala, pezina, laki-laki yang bersifat lembut[a], maupun laki-laki yang berhubungan seks dengan laki-laki[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani μαλακοί secara harfiah berarti “yang lembut.” Kata ini dapat menunjuk kepada laki-laki yang dianggap kewanita-wanitaan atau lemah secara moral; dalam konteks ini, mungkin juga berarti pelacur laki-laki atau pihak pasif dalam hubungan seks antarlaki-laki.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ἀρσενοκοῖται langka dan makna persisnya diperdebatkan. Terjemahan lain antara lain “laki-laki yang melakukan hubungan seks terlarang dengan laki-laki,” “pelaku homoseksual,” atau “sodomis.” Banyak ahli menghubungkannya dengan ungkapan dalam kitab Imamat versi Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Atau
  rationale: Mempertahankan peralihan retoris yang menghubungkan ayat ini dengan argumen sebelumnya.
- source_word: οὐκ οἴδατε
  choice: tidak tahukah kamu
  rationale: Mencerminkan rumusan pertanyaan retoris Paulus dengan wajar dalam bahasa Indonesia.
- source_word: ἄδικοι
  choice: orang-orang yang tidak benar
  rationale: Mempertahankan kategori moral yang luas tanpa mempersempitnya hanya pada tindakan tertentu.
- source_word: θεοῦ βασιλείαν
  choice: Kerajaan Allah
  rationale: Padanan baku dan jelas bagi ungkapan Yunani tersebut.
- source_word: οὐ κληρονομήσουσιν
  choice: tidak akan mewarisi
  rationale: Menjaga gambaran warisan yang memiliki nuansa perjanjian dan eskatologis.
- source_word: μὴ πλανᾶσθε
  choice: Jangan tertipu
  rationale: Ungkapan imperatif pasif yang alami dan tetap terbuka mengenai siapa atau apa yang menipu.
- source_word: πόρνοι
  choice: orang yang melakukan percabulan
  rationale: Menyampaikan kategori luas perilaku seksual yang dianggap tidak bermoral tanpa memakai istilah arkais.
- source_word: εἰδωλολάτραι
  choice: penyembah berhala
  rationale: Padanan langsung, ringkas, dan mudah dipahami.
- source_word: μοιχοὶ
  choice: pezina
  rationale: Padanan tepat yang mempertahankan rujukan khusus pada pelanggaran kesetiaan perkawinan.
- source_word: μαλακοὶ
  choice: laki-laki yang kewanita-wanitaan
  rationale: Mencerminkan arti harfiah yang berkaitan dengan kelembutan atau sifat yang dianggap feminin, sementara kemungkinan arti seksual dalam konteks ini dijelaskan dalam catatan kaki.
- source_word: ἀρσενοκοῖται
  choice: laki-laki yang berhubungan seks dengan laki-laki
  rationale: Terjemahan deskriptif yang mengacu pada tindakan, bukan identitas modern, seraya mengakui bahwa istilah Yunani ini langka dan diperdebatkan.
theological_decisions:
- issue: Makna μαλακοὶ dalam daftar keburukan
  choice: laki-laki yang kewanita-wanitaan
  alternative: laki-laki yang mengambil peran pasif dalam hubungan seks antarlaki-laki; pelacur laki-laki; laki-laki yang lembek atau lemah secara moral
  rationale: Kata itu secara harfiah berarti 'lembut' dan dapat dipakai bagi sifat kewanita-wanitaan atau kelemahan moral; dalam konteks ini banyak penafsir melihat makna seksual. Teks utama tidak sepenuhnya menetapkan salah satu pengertian yang diperdebatkan, dan catatan kaki mempertahankan alternatifnya.
- issue: Makna ἀρσενοκοῖται dan hubungannya dengan μαλακοὶ
  choice: laki-laki yang berhubungan seks dengan laki-laki
  alternative: pelaku hubungan seks terlarang dengan laki-laki; pelaku homoseksual; sodomis
  rationale: Unsur pembentuk kata dan kemungkinan latar Septuaginta Imamat menunjuk pada hubungan seksual laki-laki dengan laki-laki, tetapi cakupan persis istilah yang langka ini tetap diperdebatkan. Terjemahan deskriptif menghindari pemaksaan kategori identitas modern dan catatan kaki menyatakan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta gambaran tentang mewarisi dipertahankan. Istilah seksual diterjemahkan secara deskriptif tanpa memasukkan kategori identitas modern; ketidakpastian dua istilah Yunani yang diperdebatkan dijelaskan dalam catatan kaki.
