id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: id
  text: Beranikah salah seorang di antara kalian, yang mempunyai perkara terhadap orang lain, mengajukan perkaranya untuk diadili di hadapan orang-orang yang tidak benar[a], dan bukan di hadapan orang-orang kudus[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang tidak adil.” Sebagian terjemahan menafsirkannya sebagai “orang-orang yang tidak percaya,” tetapi teks Yunani menyebut “orang-orang yang tidak benar/tidak adil.”'
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang kudus” di sini berarti umat Allah yang kudus, yaitu orang-orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: Beranikah
  rationale: Mempertahankan bentuk pertanyaan retoris dan nada teguran yang menyiratkan keberanian lancang dalam konteks ini.
- source_word: τις ὑμῶν
  choice: salah seorang di antara kalian
  rationale: Mencerminkan kata ganti tak tentu tunggal dengan genitif partitif serta sapaan langsung kepada jemaat.
- source_word: πρᾶγμα ἔχων
  choice: jika mempunyai perkara
  rationale: Dalam konteks hukum, πρᾶγμα menunjuk pada perkara atau sengketa; konstruksi partisipial dialihkan secara wajar menjadi anak kalimat bersyarat tanpa mempersempitnya secara berlebihan menjadi gugatan tertentu.
- source_word: πρὸς τὸν ἕτερον
  choice: terhadap yang lain
  rationale: Menyampaikan hubungan pertentangan dalam sengketa dan mempertahankan rujukan generik kepada pihak lain.
- source_word: κρίνεσθαι
  choice: meminta perkara itu diadili
  rationale: Mengungkapkan makna pasif-yudisial secara alami dalam bahasa Indonesia sekaligus menjelaskan bahwa orang tersebut membawa perkaranya untuk diputus.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: di hadapan orang-orang yang tidak benar
  rationale: Mempertahankan penilaian moral ἄδικοι dan nuansa yudisial ἐπί, tanpa menggantinya secara interpretatif dengan 'orang-orang yang tidak percaya'.
- source_word: καὶ οὐχὶ
  choice: dan bukan
  rationale: Mempertahankan pertentangan langsung dalam pertanyaan retoris.
- source_word: ἐπὶ τῶν ἁγίων
  choice: di hadapan orang-orang kudus
  rationale: Mempertahankan sebutan khas Paulus bagi umat yang dikuduskan Allah serta kesejajaran dengan frasa yudisial sebelumnya.
theological_decisions:
- issue: Kontras antara ἀδίκων dan ἁγίων
  choice: orang-orang yang tidak benar ... orang-orang kudus
  alternative: orang-orang yang tidak percaya ... orang-orang percaya
  rationale: Teks Yunani memakai istilah yang bermuatan moral-teologis, bukan istilah eksplisit untuk ketidakpercayaan dan kepercayaan. Terjemahan mempertahankan ketegangan serta pilihan kata Paulus.
- issue: Rujukan tunggal representatif pada τις ... ἔχων
  choice: salah seorang ... jika mempunyai
  alternative: siapa pun ... jika mempunyai
  rationale: Bahasa Indonesia tidak memerlukan pronomina bergender dalam klausa berikutnya, sehingga bentuk tunggal sumber dapat dipertahankan secara alami tanpa menambahkan penandaan gender yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. 'Kalian' dipakai untuk menandai sapaan jamak secara jelas; istilah 'orang-orang kudus' dipertahankan sebagai sebutan teologis Paulus dan dijelaskan dalam catatan kaki.
