  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: id
  text: Kasih tidak pernah gagal[a]. Namun, nubuat-nubuat akan ditiadakan; bahasa lidah[b] akan berhenti; pengetahuan akan ditiadakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kasih tidak pernah jatuh” atau “Kasih tidak pernah berakhir.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bahasa-bahasa.” Istilah Yunani ini secara harfiah dapat berarti “lidah-lidah.”
    reason: alternative_reading
  - marker: c
    text: Kata kerja yang diterjemahkan “akan ditiadakan” di sini sama dengan yang dipakai dalam klausa tentang nubuat-nubuat.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang wajar dan luas bagi kasih yang dibicarakan Paulus, tanpa mempersempitnya menjadi belas kasihan atau amal.
- source_word: οὐδέποτε
  choice: tidak pernah
  rationale: Menyampaikan penyangkalan mutlak dalam bahasa Indonesia modern dan alami.
- source_word: πίπτει
  choice: gagal
  rationale: Dalam konteks ini πίπτει bersifat idiomatis. “Gagal” menegaskan bahwa kasih tidak kehilangan daya atau keteguhannya, tanpa menyamakannya begitu saja dengan verba penghentian dalam klausa-klausa berikutnya.
- source_word: εἴτε δὲ
  choice: Namun, jika ada
  rationale: Membuat ungkapan Yunani yang eliptis menjadi jelas dalam bahasa Indonesia sambil mempertahankan peralihan kontras dan rangkaian kemungkinan.
- source_word: προφητεῖαι
  choice: nubuat-nubuat
  rationale: Mempertahankan bentuk jamak dan dapat merujuk pada pesan-pesan atau tindakan profetis tanpa menambahkan penafsiran khusus.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: akan ditiadakan
  rationale: Dipakai secara konsisten pada kedua kemunculan verba yang sama. Pilihan ini menyatakan berakhirnya keberlakuan atau fungsi tanpa harus berarti pemusnahan.
- source_word: γλῶσσαι
  choice: bahasa-bahasa lidah
  rationale: Mempertahankan istilah kontekstual bagi fenomena yang dibahas dalam 1 Korintus 12–14, sekaligus menyisakan kemungkinan leksikal “bahasa-bahasa” tanpa menentukan hakikat fenomena itu.
- source_word: παύσονται
  choice: akan berhenti
  rationale: Padanan alami yang mempertahankan perbedaan verba dari καταργέω pada klausa sebelum dan sesudahnya.
- source_word: γνῶσις
  choice: pengetahuan
  rationale: Padanan lazim yang sesuai dengan pembahasan mengenai pengetahuan yang sebagian dalam ayat-ayat berikutnya.
theological_decisions:
- issue: Makna πίπτει dalam pernyataan tentang kasih
  choice: Kasih tidak pernah gagal
  alternative: Kasih tidak pernah jatuh; kasih tidak pernah berakhir
  rationale: Konteks mengontraskan keteguhan kasih dengan nubuat, bahasa-bahasa lidah, dan pengetahuan yang akan berhenti atau ditiadakan. “Gagal” mempertahankan gambaran tentang daya tahan kasih tanpa meleburkan πίπτει ke dalam verba penghentian berikutnya.
- issue: Makna γλῶσσαι dalam konteks 1 Korintus 12–14
  choice: bahasa-bahasa lidah
  alternative: bahasa-bahasa; lidah-lidah
  rationale: Ungkapan ini menandai fenomena karismatis dalam konteks surat tanpa memutuskan apakah fenomena tersebut selalu berupa bahasa manusia yang dikenal atau bentuk ujaran lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur tiga klausa paralel dipertahankan; “ditiadakan” digunakan secara konsisten untuk kedua bentuk καταργέω, sedangkan παύσονται dibedakan sebagai “akan berhenti.”
