  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: id
  text: Kasih menanggung segala sesuatu[a], memercayai segala sesuatu[b], mengharapkan segala sesuatu, dan bertahan dalam segala sesuatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menutupi segala sesuatu”; στέγει juga dapat mengandung arti menutupi atau melindungi.
    reason: lexical_alternative
  - marker: b
    text: Atau “percaya akan segala sesuatu”; maksudnya bukan bahwa kasih mudah tertipu, melainkan bahwa kasih cenderung memberi kepercayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini digunakan secara menyeluruh dengan setiap kata kerja. Pengulangan “segala sesuatu” mempertahankan keluasan dan irama retoris teks Yunani.
- source_word: στέγει
  choice: menanggung
  rationale: στέγω dapat berarti menutupi, melindungi, atau menanggung. Dalam rangkaian sifat kasih yang teguh, “menanggung” paling alami, sedangkan nuansa “menutupi” dipertahankan dalam catatan kaki.
- source_word: πιστεύει
  choice: memercayai
  rationale: πιστεύω dapat berarti percaya atau memercayai. “Memercayai” di sini menyatakan kecenderungan kasih untuk memberi kepercayaan, tanpa menyiratkan sikap mudah tertipu.
- source_word: ἐλπίζει
  choice: mengharapkan
  rationale: Kata ini menggambarkan tindakan yang menjadi ciri tetap kasih. “Mengharapkan” menyampaikan makna harapan yang terus diarahkan kepada kemungkinan yang baik dan mempertahankan kesejajaran kalimat.
- source_word: ὑπομένει
  choice: bertahan
  rationale: ὑπομένω menyatakan tetap teguh di bawah tekanan, menanggung, atau bertekun. “Bertahan dalam” alami dalam bahasa Indonesia dan membedakannya dari στέγει.
theological_decisions:
- issue: Makna rangkaian πάντα yang diulang dalam gambaran tentang kasih
  choice: Bahasa ini bersifat retoris dan menggambarkan keteguhan kasih yang menyeluruh, bukan menyatakan bahwa kasih menyetujui atau menerima secara naif apa pun.
  alternative: Memahaminya sebagai kemutlakan tanpa batas yang membuat kasih memercayai atau menyetujui setiap hal.
  rationale: Konteks langsungnya merupakan gambaran puitis tentang watak kasih. Pengulangan “segala sesuatu” mempertahankan ketegangan dan keluasan ungkapan Paulus tanpa menambahkan gagasan bahwa kasih tidak memiliki pertimbangan moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Subjek “Kasih” dinyatakan agar ayat dapat dibaca secara mandiri. Pengulangan “segala sesuatu” dipertahankan untuk mencerminkan anafora πάντα dalam teks Yunani; kata sambung “dan” sebelum unsur terakhir membuat deretnya alami dalam bahasa Indonesia.
