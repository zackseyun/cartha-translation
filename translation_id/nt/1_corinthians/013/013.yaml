  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: id
  text: 'Namun sekarang, ketiga hal ini tetap ada[b]: iman[a], pengharapan, dan kasih. Tetapi yang terbesar di antaranya ialah kasih.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iman” juga dapat dipahami sebagai “kepercayaan” atau “sikap percaya”.
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “tetap ada” juga dapat berarti “bertahan” atau “terus ada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: νυνί menunjuk pada keadaan 'sekarang', sedangkan δέ memberi nuansa peralihan atau kontras ringan. 'Namun sekarang' alami dalam bahasa Indonesia dan mempertahankan kaitan dengan pembahasan sebelumnya.
- source_word: μένει
  choice: tetap ada
  rationale: Bentuk tunggal μένει dengan subjek majemuk yang menyusul menyatakan bahwa iman, pengharapan, dan kasih terus ada atau bertahan, berbeda dari karunia-karunia yang akan berakhir.
- source_word: πίστις
  choice: iman
  rationale: Dalam rangkaian Paulus 'iman, pengharapan, dan kasih', 'iman' adalah padanan baku dan paling sesuai; makna 'kepercayaan' tetap mungkin secara leksikal.
- source_word: ἐλπίς
  choice: pengharapan
  rationale: '''Pengharapan'' merupakan padanan teologis yang mapan sekaligus mudah dipahami untuk ἐλπίς, dengan nuansa penantian penuh harap.'
- source_word: ἀγάπη
  choice: kasih
  rationale: '''Kasih'' adalah padanan Indonesia yang mapan dalam konteks ini dan menghindari penyempitan makna menjadi sekadar perasaan romantis.'
- source_word: τὰ τρία ταῦτα
  choice: ketiga hal ini
  rationale: Ungkapan ini menunjuk kembali secara jelas kepada tiga hal yang disebutkan, dan bentuk tersebut alami dalam bahasa Indonesia.
- source_word: μείζων δὲ τούτων
  choice: Namun, yang terbesar di antaranya
  rationale: Walaupun μείζων berbentuk komparatif, konstruksi perbandingan dalam kelompok tiga hal secara alami menyatakan bahwa kasih adalah yang paling besar di antara ketiganya.
theological_decisions:
- issue: Makna πίστις dalam rangkaian kebajikan Paulus
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks rangkaian 'iman, pengharapan, dan kasih' paling kuat mendukung 'iman'. 'Kesetiaan' tidak dipaksakan karena kurang mungkin di sini, sementara kemungkinan nuansa 'percaya' dicatat.
- issue: Daya komparatif μείζων
  choice: yang terbesar di antaranya ialah kasih
  alternative: kasih lebih besar daripada semuanya itu
  rationale: Bahasa Indonesia lazim memakai bentuk superlatif untuk peringkat dalam kelompok tiga. Pilihan ini menyampaikan supremasi kasih tanpa menambahkan alasan teologis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat jelas bagi pembaca umum sambil mempertahankan peralihan δέ, rangkaian tiga unsur, dan penegasan akhir pada kasih.
