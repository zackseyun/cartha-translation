  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: id
  text: Namun, ketika yang sempurna[a] datang, yang sebagian akan ditiadakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “yang lengkap” atau “yang dewasa.” Frasa “yang sempurna” (Yunani: to teleion) diperdebatkan; frasa ini dipahami dengan beragam cara sebagai kelengkapan, kedewasaan, atau penggenapan akhir zaman, sebagai lawan dari keadaan sekarang yang hanya sebagian.'
    reason: alternative_reading
  - marker: b
    text: Atau “akan dibuat tidak berlaku,” “akan berlalu,” atau “akan berakhir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Kata ini memperkenalkan peristiwa mendatang yang diantisipasi. Dalam konteks ini, “ketika” lebih alami daripada “setiap kali,” yang dapat memberi kesan berulang.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan keadaan pengetahuan dan nubuat yang hanya sebagian pada ayat sebelumnya.
- source_word: ἔλθῃ
  choice: datang
  rationale: Bentuk aoris subjungtif sesudah ὅταν menunjuk kepada peristiwa mendatang; “datang” merupakan ungkapan Indonesia yang wajar dalam anak kalimat dengan “ketika.”
- source_word: τὸ τέλειον
  choice: yang sempurna
  rationale: Bentuk netral yang dipakai sebagai substantif ini dapat berarti apa yang sempurna, lengkap, atau dewasa. “Yang sempurna” mempertahankan keluasan makna dan tidak menetapkan rujukannya secara doktrinal.
- source_word: τὸ ἐκ μέρους
  choice: yang sebagian
  rationale: Frasa berartikel ini berfungsi sebagai substantif dan menunjuk kepada sesuatu yang ada atau berlangsung hanya sebagian; pilihan ini juga mempertahankan kontras langsung dengan “yang sempurna.”
- source_word: καταργηθήσεται
  choice: akan ditiadakan
  rationale: Bentuk pasif futur ini menyatakan bahwa yang sebagian akan dibuat tidak berlaku atau diakhiri. “Akan ditiadakan” menyampaikan berakhirnya fungsi atau keberadaannya dalam keadaan tersebut tanpa harus berarti pemusnahan.
theological_decisions:
- issue: Rujukan τὸ τέλειον
  choice: Diterjemahkan secara umum sebagai “yang sempurna” tanpa menentukan rujukannya.
  alternative: “yang lengkap,” “yang dewasa,” atau keadaan kesempurnaan pada penggenapan akhir zaman; sebagian penafsir juga menghubungkannya dengan lengkapnya kanon Kitab Suci.
  rationale: Teks Yunani tidak secara eksplisit menyebut rujukan frasa ini. Bentuk netralnya mendukung pengertian abstrak atau kolektif, tetapi tidak menyelesaikan perdebatan. Karena itu, terjemahan utama mempertahankan ambiguitas dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan khidmat. “Namun” menyatakan kontras secara alami; pasangan “yang sempurna” dan “yang sebagian” mempertahankan kesejajaran retoris teks Yunani.
