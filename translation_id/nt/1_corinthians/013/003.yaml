id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: id
  text: Dan jika aku membagikan seluruh milikku, dan jika aku menyerahkan tubuhku supaya aku dibakar[a], tetapi tidak mempunyai kasih, aku tidak memperoleh manfaat apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “supaya aku dapat bermegah” dan bukan “supaya aku dibakar.”
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: membagikan
  rationale: Kata ini dapat berarti membagikan dalam porsi-porsi kecil, dengan latar makna memberi makan dengan suapan. Dalam konteks seluruh harta, “membagikan” menyampaikan tindakan memberikan milik kepada orang lain secara alami tanpa mempersempitnya pada istilah teknis tertentu.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: seluruh milikku
  rationale: Ungkapan ini menunjuk pada segala harta atau kepunyaan seseorang. “Seluruh milikku” ringkas, alami, dan mempertahankan cakupan totalnya.
- source_word: παραδῶ
  choice: menyerahkan
  rationale: “Menyerahkan” mempertahankan arti dasar tindakan memberikan atau menyerahkan ke dalam kuasa pihak lain tanpa menambahkan gagasan penafsiran seperti “mengorbankan”.
- source_word: τὸ σῶμά μου
  choice: tubuhku
  rationale: Padanan langsung dan konkret yang tidak memerlukan perluasan metaforis.
- source_word: ἵνα καυθήσομαι
  choice: supaya aku dibakar
  rationale: “Supaya” mempertahankan hubungan tujuan atau hasil yang dimaksud, sedangkan bentuk pasif καυθήσομαι diterjemahkan secara langsung sebagai “aku dibakar” sesuai teks SBLGNT.
- source_word: ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang lazim, bermartabat, dan sesuai untuk ἀγάπη dalam konteks ini.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: aku tidak memperoleh manfaat apa pun
  rationale: Bentuk pasif verba ini menyatakan bahwa pembicara tidak menerima manfaat atau keuntungan sedikit pun. Rumusan ini mempertahankan penekanan pribadi sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: dan sekalipun ... dan sekalipun
  rationale: Pengulangan struktur bersyarat dipertahankan untuk mencerminkan peningkatan retoris Paulus. “Sekalipun” secara alami menyampaikan sifat hipotetis yang ekstrem dalam konteks pasal ini.
theological_decisions:
- issue: Varian tekstual dalam klausa tujuan
  choice: Menerjemahkan bacaan SBLGNT καυθήσομαι sebagai “supaya aku dibakar” dalam teks utama.
  alternative: καυχήσωμαι — “supaya aku dapat bermegah”
  rationale: Teks sumber yang ditetapkan adalah SBLGNT, sehingga bacaannya diterjemahkan dalam teks utama. Karena varian tersebut mengubah gambaran secara berarti—dibakar atau bermegah—bacaan alternatif dicantumkan dalam catatan kaki dan tidak diselesaikan secara diam-diam.
- issue: Sifat kasih sebagai syarat yang menentukan nilai tindakan ekstrem
  choice: Mempertahankan kontras langsung antara penyerahan seluruh milik dan tubuh dengan tidak mempunyai kasih.
  alternative: Menjelaskan kasih sebagai motif, kebajikan tertentu, atau jenis kasih yang didefinisikan secara denominatif.
  rationale: Teks hanya menyatakan ketiadaan kasih dan akibatnya, yakni tidak memperoleh manfaat apa pun. Terjemahan tidak menambahkan definisi teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur berulang dipertahankan demi daya retoris, sementara pilihan “seluruh milikku,” “menyerahkan tubuhku,” dan “memperoleh manfaat apa pun” menghindari ungkapan arkais maupun penafsiran denominatif.
