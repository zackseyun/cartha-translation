base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: id
  text: tidak bertindak secara tidak patut[a], tidak mencari kepentingannya sendiri, tidak menjadi gusar[b], tidak memperhitungkan kesalahan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak bertindak secara memalukan” atau “tidak berlaku kasar.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “tidak tersulut” atau “tidak diprovokasi.” Kata “mudah” tidak dinyatakan secara tersurat dalam bahasa Yunani.
    reason: source_transparency
  - marker: c
    text: Atau “tidak menyimpan catatan tentang kesalahan.” Secara harfiah, “tidak memperhitungkan kejahatan/kesalahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: berlaku tidak pantas
  rationale: Kata kerja ini menunjuk pada perilaku yang tidak patut, memalukan, atau melanggar kepantasan. Ungkapan ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada kekasaran.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: mencari kepentingan sendiri
  rationale: Secara harfiah berarti 'mencari hal-hal miliknya sendiri'. Dalam bahasa Indonesia, 'mencari kepentingan sendiri' menyampaikan sikap mementingkan diri dengan wajar tanpa menambahkan gagasan 'memaksakan kehendak'.
- source_word: παροξύνεται
  choice: mudah tersulut amarah
  rationale: Bentuk ini menyatakan bahwa seseorang dibangkitkan menuju kejengkelan atau kemarahan yang tajam. 'Tersulut amarah' alami dalam bahasa Indonesia; kata 'mudah' bersifat penjelas idiomatis dan dicatat karena tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: λογίζεται τὸ κακόν
  choice: memperhitungkan kesalahan
  rationale: λογίζεται memakai gambaran membuat perhitungan atau mencatat dalam akun, sedangkan τὸ κακόν dapat menunjuk pada kejahatan atau kesalahan. Terjemahan ini mempertahankan metafora perhitungan dan memungkinkan konteks relasionalnya tetap terbaca.
theological_decisions:
- issue: Apakah παροξύνεται harus diterjemahkan dengan unsur 'mudah'
  choice: tidak mudah tersulut amarah
  alternative: tidak tersulut amarah; tidak menjadi marah
  rationale: Bahasa Yunani tidak memiliki kata keterangan yang secara eksplisit berarti 'mudah'. Namun, dalam bahasa Indonesia, 'tidak mudah tersulut amarah' merupakan ungkapan alami bagi tidak membiarkan diri dibangkitkan kepada kemarahan. Catatan kaki menjaga transparansi terhadap bentuk sumber.
- issue: Apakah λογίζεται τὸ κακόν berarti mencatat kesalahan orang atau memikirkan kejahatan
  choice: tidak memperhitungkan kesalahan
  alternative: tidak menyimpan catatan tentang kesalahan; tidak memperhitungkan kejahatan
  rationale: 'Frasa Yunani mempertahankan ketaksaan tertentu: kata kerja mengandung metafora perhitungan, dan objek tunggal dapat berarti ''kejahatan'' atau ''kesalahan''. Teks utama memakai bentuk relasional yang sesuai konteks tanpa mengembangkan secara mutlak menjadi ''kesalahan orang lain''.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Subjek 'kasih' tersirat dari konteks ayat-ayat sebelumnya, sebagaimana dalam teks Yunani. Klausa disusun sejajar agar mempertahankan irama rangkaian sifat kasih.
