  naturalness: “Tidak berlaku tidak pantas” tidak idiomatis dalam bahasa Indonesia modern karena susunan negasinya terasa janggal. “Tidak bertindak secara tidak patut” adalah bentuk yang lebih baku, jelas, dan tetap cukup luas. “Tidak menjadi gusar” natural dalam register bermartabat dan tidak mengimpor gagasan “mudah.”
  terminology: “Kepentingannya sendiri” menyatakan unsur refleksif dari τὰ ἑαυτῆς dengan jelas. “Tidak patut,” “gusar,” dan “memperhitungkan kesalahan” sesuai dengan register Alkitab Indonesia modern tanpa mempersempit makna sumber secara berlebihan.
