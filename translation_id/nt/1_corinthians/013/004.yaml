id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: id
  text: Kasih itu sabar, kasih itu baik hati. Kasih tidak iri hati[a], tidak membanggakan diri, dan tidak angkuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cemburu.” Kata Yunani ini dapat berarti bersemangat, cemburu, atau iri hati; konteks negatif di sini mendukung “iri hati.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak menggembungkan diri.” Paulus memakai gambaran sesuatu yang mengembang untuk menyatakan kesombongan.
    reason: metaphor_and_lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang luas, wajar, dan bermartabat bagi ἀγάπη dalam konteks etis ini; kata ini tidak mempersempit maknanya menjadi sekadar pemberian amal.
- source_word: μακροθυμεῖ
  choice: sabar
  rationale: Kata kerja ini menyatakan kesabaran yang bertahan lama, khususnya dalam menghadapi orang lain. “Sabar” menyampaikan makna tersebut secara alami dan ringkas.
- source_word: χρηστεύεται
  choice: baik hati
  rationale: Kata kerja langka ini menunjuk pada tindakan penuh kebaikan. “Baik hati” mempertahankan bentuk predikat yang sejajar dengan “sabar” dan mudah dipahami.
- source_word: ζηλοῖ
  choice: iri hati
  rationale: Walaupun kata ini dapat menyatakan semangat atau kecemburuan, rangkaian penyangkalan sifat buruk di sini mendukung arti negatif, yaitu iri hati.
- source_word: περπερεύεται
  choice: membanggakan diri
  rationale: Kata ini menggambarkan sikap suka memamerkan atau meninggikan diri. “Membanggakan diri” jelas, alami, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: φυσιοῦται
  choice: angkuh
  rationale: Secara metaforis kata ini menggambarkan orang yang ‘menggembung’ karena kesombongan. “Angkuh” menyampaikan maksudnya secara alami dalam bahasa Indonesia, sementara metafora sumber dijelaskan dalam catatan kaki.
- source_word: ἡ ἀγάπη … ἡ ἀγάπη … ⸂ἡ ἀγάπη⸃
  choice: Kasih … kasih … Kasih
  rationale: Pengulangan “kasih” mempertahankan penekanan retoris teks Yunani dan tetap terdengar wajar dalam susunan kalimat bahasa Indonesia.
- source_word: οὐ
  choice: tidak
  rationale: “Tidak” merupakan penyangkalan baku dan alami untuk rangkaian kata kerja serta predikat dalam ayat ini.
theological_decisions:
- issue: Makna ἀγάπη dalam uraian etis-teologis ini
  choice: kasih
  alternative: cinta; amal kasih
  rationale: “Kasih” mempertahankan cakupan relasional dan etis yang luas tanpa membatasinya pada cinta romantis atau kegiatan memberi bantuan.
- issue: Makna ζηλοῖ dalam konteks negatif
  choice: iri hati
  alternative: cemburu; bersemangat
  rationale: Bentuk leksikalnya dapat memiliki nuansa positif atau negatif, tetapi konteks serangkaian sifat yang ditolak menunjuk pada rasa iri atau cemburu; “iri hati” paling tepat di sini.
- issue: Metafora kesombongan dalam φυσιοῦται
  choice: angkuh
  alternative: membusungkan diri; menggembungkan diri
  rationale: Terjemahan utama mengutamakan kejelasan dan kealamian tanpa menambahkan rincian tubuh yang tidak dinyatakan secara eksplisit; catatan kaki mempertahankan citra metaforis teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “kasih” mempertahankan tekanan retoris teks sumber. Penanda catatan kaki ditempatkan langsung setelah kata yang diterangkannya.
