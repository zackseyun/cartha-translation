  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: id
  text: Jika aku berbicara dalam bahasa manusia dan bahasa malaikat[a], tetapi tidak mempunyai kasih, aku telah menjadi perunggu yang bergema[b] atau simbal yang berdentang nyaring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lidah-lidah.” Kata Yunani ini dapat berarti lidah atau bahasa; dalam konteks ini, ungkapan tersebut berkaitan dengan pembahasan tentang bahasa lidah di jemaat Korintus.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “perunggu yang berbunyi.” Kata Yunani menunjuk perunggu atau benda dari perunggu, bukan secara pasti sebuah alat musik tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Sekalipun
  rationale: Kondisi hipotetis ini membuka rangkaian pengandaian retoris yang bersifat meninggi; “sekalipun” alami dalam bahasa Indonesia dan tidak menyatakan bahwa keadaan itu benar-benar terjadi.
- source_word: ταῖς γλώσσαις
  choice: dalam bahasa-bahasa
  rationale: γλῶσσα dapat berarti lidah atau bahasa. Dalam bahasa Indonesia, “berbicara dalam bahasa-bahasa” paling alami, sambil tetap mempertahankan kaitannya dengan pembahasan karunia bahasa dalam konteks Korintus.
- source_word: τῶν ἀνθρώπων
  choice: manusia
  rationale: ἄνθρωποι di sini menunjuk umat manusia secara umum dan dikontraskan dengan malaikat; “manusia” menyampaikan cakupan itu dengan tepat tanpa pembatasan gender.
- source_word: λαλῶ
  choice: aku berbicara
  rationale: Bentuk kini dalam klausa pengandaian paling wajar diterjemahkan dengan bentuk kini sederhana.
- source_word: καὶ τῶν ἀγγέλων
  choice: dan malaikat
  rationale: Kontras dengan manusia dan peningkatan retoris mendukung arti makhluk surgawi, bukan utusan manusia.
- source_word: ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang lazim, bermartabat, dan sesuai konteks bagi ἀγάπη.
- source_word: δὲ μὴ ἔχω
  choice: tetapi tidak memiliki
  rationale: Menyampaikan kontras δέ dan gagasan tidak mempunyai kasih secara jelas dan alami.
- source_word: γέγονα
  choice: aku telah menjadi
  rationale: Mempertahankan nuansa perfektum Yunani, yaitu keadaan yang dihasilkan, alih-alih meratakannya menjadi sekadar “aku adalah”.
- source_word: χαλκὸς ἠχῶν
  choice: logam yang bergema
  rationale: χαλκός dapat menunjuk tembaga, perunggu, atau benda berbahan logam tersebut. Pilihan ini menjaga ketidakspesifikan citra Yunani dan tidak mengimpor alat musik tertentu.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: atau simbal yang berdentang nyaring
  rationale: κύμβαλον adalah simbal, sedangkan ἀλαλάζον menggambarkan bunyi keras dan gaduh; frasa ini menyampaikan citra bunyinya secara alami.
theological_decisions:
- issue: Arti “bahasa-bahasa manusia dan malaikat”
  choice: Mempertahankan ungkapan sebagai kontras retoris antara bahasa manusia dan malaikat.
  alternative: Menafsirkannya secara tegas sebagai bahasa surgawi yang nyata, atau semata-mata hiperbola.
  rationale: Ayat ini sendiri tidak menetapkan apakah bahasa malaikat dimaksudkan secara harfiah atau sebagai pengandaian retoris tertinggi; terjemahan tidak seharusnya menyelesaikan ketegangan itu.
- issue: Nilai perbuatan rohani tanpa kasih
  choice: Mempertahankan metafora bahwa pembicara “telah menjadi” bunyi logam atau simbal.
  alternative: Memparafrasakannya sebagai “aku tidak berarti apa-apa” atau “perkataanku hanyalah kebisingan.”
  rationale: 'Metafora Paulus lebih tajam dan bersifat personal: bukan hanya ucapannya, melainkan dirinya dalam keadaan itu, menjadi seperti bunyi kosong.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur pengandaian dan peningkatan retoris dipertahankan; istilah teknis yang tidak perlu dihindari. Semua penanda catatan kaki muncul dalam teks utama.
