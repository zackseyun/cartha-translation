  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: id
  text: Sebab sekarang kita melihat melalui cermin, secara samar-samar[a], tetapi kelak muka dengan muka. Sekarang aku mengenal sebagian saja, tetapi kelak aku akan mengenal sepenuhnya, sebagaimana aku juga telah dikenal sepenuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam teka-teki” atau “secara penuh teka-teki”; ungkapan Yunani ini menekankan bahwa penglihatan sekarang bersifat tidak langsung dan sukar dipahami, bukan hanya kabur secara visual.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: kita melihat
  rationale: Mempertahankan metafora penglihatan dan bentuk orang pertama jamak secara alami.
- source_word: ἄρτι
  choice: sekarang
  rationale: Menandai keadaan masa kini yang dikontraskan dengan τότε, “kelak”.
- source_word: δι’ ἐσόπτρου
  choice: melalui cermin
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; pilihan ini mempertahankan gambaran penglihatan yang tidak langsung.
- source_word: ἐν αἰνίγματι
  choice: secara samar-samar[a]
  rationale: Ungkapan yang wajar dalam bahasa Indonesia untuk persepsi yang tidak jelas; catatan kaki mempertahankan arti harfiahnya, “dalam teka-teki,” agar unsur kebingungan dan ketidaklangsungan tidak hilang.
- source_word: τότε δὲ
  choice: tetapi kelak
  rationale: Menyatakan kontras temporal yang tegas dengan keadaan sekarang.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: muka dengan muka
  rationale: Ungkapan mapan yang mempertahankan gambaran perjumpaan langsung tanpa perantara.
- source_word: γινώσκω ἐκ μέρους
  choice: aku mengenal sebagian saja
  rationale: Mempertahankan verba pengenalan dan menegaskan sifat parsialnya tanpa menambahkan objek yang tidak disebutkan.
- source_word: ἐπιγνώσομαι
  choice: aku akan mengenal sepenuhnya
  rationale: Menyampaikan kontras dengan pengenalan parsial tanpa menyiratkan kemahatahuan.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: sebagaimana aku juga telah dikenal sepenuhnya
  rationale: Mempertahankan kesejajaran leksikal dengan ἐπιγνώσομαι dan bentuk pasif yang tidak menyebut siapa yang mengenal.
theological_decisions:
- issue: Cakupan pengenalan pada masa mendatang
  choice: aku akan mengenal sepenuhnya
  alternative: aku akan mengetahui segala sesuatu
  rationale: Teks mengontraskan pengenalan parsial dengan pengenalan yang penuh, tetapi tidak menyatakan bahwa manusia akan memiliki pengetahuan mutlak atau kemahatahuan.
- issue: Pelaku dalam bentuk pasif ἐπεγνώσθην
  choice: pelaku tetap tidak disebutkan
  alternative: sebagaimana Allah telah mengenal aku sepenuhnya
  rationale: Walaupun Allah sangat mungkin dimaksudkan dalam konteks teologis, teks Yunani membiarkan pelakunya tersirat; terjemahan tidak menambahkan penjelasan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Muka dengan muka” dipertahankan sebagai ungkapan Alkitabiah yang tetap lazim, sedangkan “secara samar-samar” diberi catatan agar arti lebih harfiah dari αἴνιγμα tidak hilang.
