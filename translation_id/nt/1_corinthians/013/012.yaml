  verdict: approve
  source_fidelity: Terjemahan dengan setia mempertahankan kontras temporal ἄρτι/τότε, perbedaan subjek antara “kita melihat” dan “aku mengenal,” metafora penglihatan tak langsung melalui cermin, serta paralel antara pengenalan sebagian dan pengenalan sepenuhnya. “Melalui cermin” merupakan padanan yang baik untuk δι’ ἐσόπτρου. “Secara samar-samar” bersifat interpretatif untuk ἐν αἰνίγματι, tetapi catatan kaki secara memadai memelihara arti harfiah ‘dalam teka-teki’ dan unsur persepsi yang tidak langsung serta membingungkan. Bentuk pasif pada ‘telah dikenal sepenuhnya’ dengan pelaku yang tidak disebut tetap sesuai dengan Yunani.
