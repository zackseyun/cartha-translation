  terminology: Pilihan “mengenal” secara konsisten menerjemahkan γινώσκω/ἐπιγινώσκω dan tidak menambahkan objek atau pelaku yang tidak ada dalam teks. “Sepenuhnya” menyampaikan penguatan ἐπιγινώσκω tanpa memaksakan makna kemahatahuan. Penanda catatan kaki ditempatkan tepat pada unsur interpretatif “secara samar-samar.”
