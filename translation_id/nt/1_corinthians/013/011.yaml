  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: id
  text: Ketika aku masih anak kecil, aku berbicara seperti anak kecil, aku berpikir seperti anak kecil, aku bernalar seperti anak kecil. Ketika aku sudah menjadi laki-laki dewasa, aku meninggalkan hal-hal yang berkaitan dengan seorang anak kecil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal-hal dari seorang anak kecil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: kanak-kanak
  rationale: Menunjuk kepada anak kecil dan dapat menyiratkan ketidakdewasaan. “Kanak-kanak” mempertahankan gambaran tahap usia tanpa mempersempitnya menjadi bayi.
- source_word: ἐλάλουν
  choice: aku berbicara
  rationale: Padanan alami dan cukup formal untuk tindakan berbicara, serta menjaga irama tiga klausa.
- source_word: ἐφρόνουν
  choice: berpikir
  rationale: Dalam rangkaian ini, kata tersebut menunjuk pada cara berpikir atau pola pikir; “berpikir” ringkas dan alami.
- source_word: ἐλογιζόμην
  choice: menimbang-nimbang
  rationale: Menyatakan proses mempertimbangkan atau bernalar. Pilihan ini membedakannya dari ἐφρόνουν tanpa memberi kesan penalaran formal yang terlalu teknis.
- source_word: γέγονα
  choice: aku telah menjadi
  rationale: Bentuk perfektum menyatakan peralihan yang menghasilkan keadaan baru; “telah menjadi” mempertahankan nuansa itu dan tetap wajar setelah “ketika”.
- source_word: ἀνήρ
  choice: dewasa
  rationale: Dalam kontras tahap kehidupan dengan νήπιος dan dengan Paulus sebagai penutur laki-laki, kata ini menunjuk pada seorang laki-laki yang telah dewasa. Bahasa Indonesia dapat menyatakan inti kontras tersebut secara alami dengan “dewasa” tanpa menambahkan kata benda yang tidak diperlukan.
- source_word: κατήργηκα
  choice: aku meninggalkan
  rationale: Dalam metafora pertumbuhan, maknanya ialah meniadakan atau tidak lagi memakai hal-hal masa kanak-kanak; “meninggalkan” menyampaikan hasil tersebut secara alami.
- source_word: τὰ τοῦ νηπίου
  choice: segala sesuatu yang khas kanak-kanak
  rationale: Frasa Yunani secara harfiah berarti “hal-hal milik/yang berkaitan dengan kanak-kanak.” Padanan ini mempertahankan keluasan ungkapan tanpa membatasinya hanya pada benda atau perilaku.
theological_decisions:
- issue: Kontras bergender dalam ἀνήρ
  choice: dewasa
  alternative: laki-laki dewasa
  rationale: ἀνήρ secara leksikal dapat berarti “laki-laki,” tetapi di sini fungsi utamanya ialah mengontraskan masa kanak-kanak dengan kedewasaan dalam contoh diri Paulus. “Dewasa” mempertahankan kontras yang dimaksud dan tidak mengubahnya menjadi pernyataan tentang keunggulan laki-laki; alternatif yang lebih eksplisit tersedia dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “seperti kanak-kanak” dipertahankan demi irama retoris teks Yunani; “menimbang-nimbang” membedakan λογίζομαι dari φρονέω.
