translation:
  language: id
  text: Kasih tidak bersukacita karena kejahatan[a], tetapi bersukacita karena kebenaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan salah” atau “ketidakadilan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “turut bersukacita bersama kebenaran”. Kata kerja majemuk Yunani yang digunakan di sini dapat menyatakan ikut berbagi sukacita atau bersukacita atas kebenaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ χαίρει
  choice: tidak bersukacita
  rationale: Χαίρω menyatakan kegembiraan atau kesukaan. “Bersukacita” mempertahankan gaya luhur dan kesejajaran verbal dengan συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: atas ketidakbenaran
  rationale: Dengan χαίρω, ἐπί + datif menunjukkan dasar atau hal yang menimbulkan sukacita. “Atas” alami dalam bahasa Indonesia, sedangkan “ketidakbenaran” mempertahankan cakupan moral yang luas serta kontras langsung dengan ἀλήθεια.
- source_word: συγχαίρει
  choice: turut bersukacita bersama
  rationale: Unsur συν- menyiratkan sukacita yang dibagikan atau dialami bersama. “Turut bersukacita bersama” mempertahankan unsur tersebut tanpa menutup kemungkinan bahwa kebenaran dipersonifikasikan.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai pertentangan antara hal yang tidak dilakukan kasih dan hal yang dilakukannya.
- source_word: τῇ ἀληθείᾳ
  choice: kebenaran
  rationale: “Kebenaran” mempertahankan kontras konseptual dengan ἀδικία tanpa mempersempit maksudnya hanya pada ucapan benar, perilaku benar, atau berita Injil.
theological_decisions:
- issue: Cakupan moral ἀδικία dalam kontras Paulus
  choice: ketidakbenaran
  alternative: kejahatan; perbuatan salah; ketidakadilan
  rationale: “Ketidakbenaran” mempertahankan dimensi moral-teologis yang luas dan hubungan leksikalnya dengan “kebenaran”, tanpa membatasi istilah itu pada ketidakadilan sosial atau pelanggaran tertentu.
- issue: Hubungan συγχαίρει dengan τῇ ἀληθείᾳ
  choice: turut bersukacita bersama kebenaran
  alternative: bersukacita atas kebenaran; bersukacita dalam kebenaran
  rationale: Terjemahan utama mempertahankan kemungkinan makna komitatif dari verba majemuk συν-, sementara catatan kaki mengakui bahwa konstruksi itu juga dapat menyatakan kebenaran sebagai alasan atau lingkup sukacita.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Subjek “Kasih” dinyatakan dari konteks langsung pasal ini agar ayat dapat dibaca dengan jelas. Kesejajaran “bersukacita ... turut bersukacita” dan kontras “ketidakbenaran ... kebenaran” sengaja dipertahankan.
