  text: For we know in part[a], and we prophesy in part.
translation:
  language: id
  text: Sebab kita mengetahui sebagian[a], dan kita bernubuat sebagian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara tidak lengkap”; idiom Yunani ini secara harfiah berarti “dari suatu bagian” dan diulang dalam kedua klausa untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: hanya sebagian
  rationale: Ungkapan ini berarti ‘sebagian’ atau ‘secara tidak lengkap’. Penambahan ‘hanya’ secara alami menegaskan keterbatasan yang tersirat dan mempertahankan pengulangan pada kedua klausa serta kontras dengan yang lengkap dalam konteks berikutnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini memberi penjelasan bagi pernyataan sebelumnya; ‘sebab’ mempertahankan hubungan argumentatif itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: γινώσκομεν
  choice: pengetahuan kita
  rationale: Bentuk verbal ‘kita mengetahui’ dialihkan secara alami menjadi konstruksi nominal ‘pengetahuan kita’ agar frasa ‘hanya sebagian’ tidak terdengar janggal, tanpa mengubah makna epistemiknya.
- source_word: καὶ
  choice: dan
  rationale: Kata sambung sederhana ini mempertahankan kesejajaran kedua klausa.
- source_word: προφητεύομεν
  choice: kita bernubuat
  rationale: ‘Bernubuat’ merupakan padanan langsung yang sesuai dengan konteks karunia rohani dan tidak mempersempit maknanya menjadi ramalan masa depan atau khotbah biasa.
theological_decisions:
- issue: Makna kegiatan profetik dalam jemaat
  choice: kita bernubuat
  alternative: kita meramalkan peristiwa mendatang; kita berkhotbah
  rationale: Konteks langsung membahas karunia rohani, sedangkan istilah Yunani dapat menunjuk secara luas pada perkataan profetik yang diilhami. Padanan netral ini mempertahankan keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Struktur paralel sumber dipertahankan dengan mengulang ‘hanya sebagian’ dalam kedua klausa.
