review_pass:
  verdict: revise
  source_fidelity: Struktur dua pengandaian ἐὰν, pasangan «segala rahasia» dan «segala pengetahuan», gambaran memindahkan gunung, serta penegasan «aku bukan apa-apa» pada dasarnya tersampaikan dengan baik. Namun, πᾶσαν τὴν πίστιν lebih langsung menyatakan totalitas iman daripada mutu iman yang ‘sempurna’; dan ὄρη berbentuk jamak.
  naturalness: Bahasa draft sudah baku, modern, dan sesuai register surat Paulus. «Seluruh iman» dan «gunung-gunung» tetap wajar dalam register ini, meskipun ungkapannya sengaja hiperbolis.
  terminology: «Karunia bernubuat», «rahasia», «pengetahuan», dan «kasih» cocok dengan konteks dan istilah yang lazim. Catatan untuk πίστις perlu dipertahankan dan ditambatkan pada «iman», karena audit bahasa Inggris secara eksplisit mencatat rentang maknanya.
  issues:
  - severity: medium
    issue: «iman yang sempurna» untuk πᾶσαν τὴν πίστιν
    rationale: «Sempurna» dapat menggeser penekanan dari cakupan/kelengkapan («seluruh») kepada kualitas tanpa cacat. «Seluruh iman» lebih dekat dengan πᾶσαν sambil mempertahankan hiperbola Paulus.
  - severity: low
    issue: ὄρη diterjemahkan dengan nomina tunggal «gunung»
    rationale: Nomina Yunani berbentuk jamak. «Gunung-gunung» mempertahankan jumlah sumber tanpa mengurangi kelancaran idiom.
  - severity: medium
    issue: Catatan leksikal tentang πίστις dari jejak audit Inggris belum hadir sebagai catatan berpenanda dalam teks Indonesia
    rationale: Penanda [a] pada «iman» dan catatan yang menjelaskan alternatif leksikal diperlukan agar ambiguitas yang diakui audit tetap tersedia bagi pembaca.
  revised_text: Sekalipun aku memiliki karunia bernubuat dan mengetahui segala rahasia serta memiliki segala pengetahuan, dan sekalipun aku memiliki seluruh iman[a] sehingga dapat memindahkan gunung-gunung, tetapi tidak memiliki kasih, aku bukan apa-apa.
