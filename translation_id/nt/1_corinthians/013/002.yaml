  rationale: Revisi membatasi perubahan pada kesetiaan terhadap cakupan πᾶσαν, bentuk jamak ὄρη, dan pelestarian catatan leksikal πίστις dari audit. Susunan retoris, register, dan istilah utama draft dipertahankan.
