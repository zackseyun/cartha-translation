source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: id
  text: Sekalipun aku memiliki karunia bernubuat dan mengetahui segala rahasia serta memiliki segala pengetahuan, dan sekalipun aku memiliki seluruh iman[a] sehingga dapat memindahkan gunung-gunung, tetapi tidak memiliki kasih, aku bukan apa-apa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «seluruh kepercayaan»; kemungkinan yang lebih kecil, «seluruh kesetiaan». Kata Yunani ini dapat memiliki rentang makna tersebut, tetapi dalam konteks ini kemungkinan menunjuk pada iman luar biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: karunia bernubuat
  rationale: Dalam konteks pembahasan tentang karunia-karunia rohani, ungkapan ini menyampaikan nomina Yunani secara alami dalam bahasa Indonesia tanpa menjadikannya jabatan tertentu.
- source_word: εἰδῶ
  choice: mengetahui
  rationale: Padanan ini mempertahankan arti kognitif οἶδα dan menghasilkan susunan alami dengan objek 'segala rahasia'.
- source_word: μυστήρια
  choice: segala rahasia
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk pada perkara ilahi yang tersembunyi atau disingkapkan; 'rahasia' mempertahankan nuansa tersebut dan mudah dipahami.
- source_word: πᾶσαν τὴν γνῶσιν
  choice: segala pengetahuan
  rationale: Padanan langsung ini mempertahankan pembedaan antara tindakan mengetahui rahasia dan kepemilikan pengetahuan.
- source_word: πᾶσαν τὴν πίστιν
  choice: iman yang sempurna
  rationale: Dalam konteks hiperbolis ini, πᾶσαν menyatakan iman dalam kepenuhannya, khususnya iman luar biasa yang sanggup memindahkan gunung; 'sempurna' lebih alami daripada 'segala iman' dalam bahasa Indonesia.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: sehingga dapat memindahkan gunung
  rationale: Ungkapan ini mempertahankan gambaran Yunani dan menyampaikan hasil atau kemampuan yang ditimbulkan oleh iman tersebut.
- source_word: ἀγάπην
  choice: kasih
  rationale: '''Kasih'' merupakan padanan Indonesia yang mapan dan bermartabat bagi ἀγάπη dalam konteks ini.'
- source_word: οὐθέν εἰμι
  choice: aku bukan apa-apa
  rationale: Padanan lugas dan kuat ini mempertahankan penyangkalan diri yang tajam dalam teks Yunani.
theological_decisions:
- issue: Makna πίστις dalam konteks kemampuan luar biasa untuk memindahkan gunung
  choice: iman yang sempurna
  alternative: kepercayaan sepenuhnya; seluruh kesetiaan
  rationale: Konteksnya menunjuk pada iman luar biasa yang berkaitan dengan kuasa memindahkan gunung, bukan secara khusus pada iman yang menyelamatkan. Makna 'kesetiaan' dimungkinkan dalam rentang semantik πίστις secara umum, tetapi kurang sesuai dengan konstruksi dan konteks ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'sekalipun aku memiliki' mempertahankan struktur retoris ayat sambil tetap alami bagi pembaca umum.
