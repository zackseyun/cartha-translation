id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: id
  text: Sebab tidak seorang pun dapat meletakkan dasar lain selain dasar yang telah diletakkan, yaitu Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.”'
    reason: Mencatat bentuk tradisional yang mentransliterasikan Χριστός, sementara teks utama menerjemahkannya sebagai gelar.
lexical_decisions:
- source_word: θεμέλιον
  choice: dasar
  rationale: Kata ini menunjuk pada fondasi bangunan dalam gambaran pembangunan yang dipakai Paulus; “dasar” alami dan jelas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan tersebut.
- source_word: ἄλλον
  choice: lain
  rationale: Kata ini menyatakan dasar tambahan atau berbeda; “dasar lain” merupakan padanan Indonesia yang wajar.
- source_word: οὐδεὶς δύναται
  choice: tidak seorang pun dapat
  rationale: Ungkapan ini mempertahankan cakupan universal οὐδείς dan makna kemampuan atau kemungkinan dari δύναται.
- source_word: θεῖναι
  choice: meletakkan
  rationale: Dalam gambaran konstruksi, τίθημι lazim berarti meletakkan atau memasang dasar; “meletakkan dasar” adalah kolokasi yang alami.
- source_word: παρὰ τὸν κείμενον
  choice: selain dasar yang telah diletakkan
  rationale: παρά bersifat mengecualikan, sedangkan bentuk partisip κείμενον menggambarkan dasar yang sudah berada pada tempatnya sebagai hasil tindakan sebelumnya.
- source_word: ὅς ἐστιν
  choice: yaitu
  rationale: Dalam bahasa Indonesia, “yaitu” secara alami menyatakan identifikasi dasar tersebut tanpa mengubah acuannya.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  rationale: Ἰησοῦς dipertahankan sebagai nama, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias”; “Sang” membuat konstruksi gelar itu idiomatis dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός dalam Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός memiliki makna gelar, yakni Yang Diurapi atau Mesias. Teks utama menerjemahkan gelar itu, sementara bentuk tradisional “Kristus” dicatat sebagai alternatif yang akrab.
- issue: Identifikasi dasar
  choice: dasar ... yaitu Yesus Sang Mesias
  alternative: dasar ... yang adalah Yesus Sang Mesias
  rationale: “Yaitu” mempertahankan pernyataan tegas bahwa dasar tersebut adalah Yesus Sang Mesias, sekaligus menghasilkan kalimat Indonesia yang alami tanpa menjelaskan lebih jauh sifat metaforanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora pembangunan dipertahankan, demikian pula hubungan penjelas dengan ayat sebelumnya melalui “Sebab”.
