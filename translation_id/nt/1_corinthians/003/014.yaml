id: 1CO.3.14
reference: 1 Corinthians 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: id
  text: Jika pekerjaan yang dibangun seseorang di atas dasar itu tetap bertahan[a], ia akan menerima upah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetap ada.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ganjaran” atau “balasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Jika
  rationale: Memperkenalkan syarat sederhana dan langsung, sesuai fungsi konjungsi Yunani.
- source_word: τινος
  choice: seseorang
  rationale: Pronomina tak tentu genitif menunjukkan bahwa pekerjaan itu milik atau dilakukan oleh seseorang; bentuk ini alami dan tidak menambahkan penandaan gender yang tidak ada dalam bahasa Yunani.
- source_word: τὸ ἔργον
  choice: pekerjaan
  rationale: Mempertahankan keluasan makna ἔργον sekaligus cocok dengan metafora pembangunan dalam konteks.
- source_word: μενεῖ
  choice: tetap bertahan
  rationale: Mengungkapkan gagasan tetap ada atau bertahan setelah pengujian tanpa sekuat kata 'selamat', yang lebih interpretatif.
- source_word: ὃ ἐποικοδόμησεν
  choice: yang dibangun ... di atas dasar itu
  rationale: Kata kerja majemuk ἐποικοδομέω berarti membangun di atas sesuatu. 'Dasar itu' menyatakan objek yang tersirat dalam ayat ini tetapi disebut jelas dalam konteks terdekat, khususnya ayat 11.
- source_word: μισθὸν
  choice: upah
  rationale: Secara dekat mencerminkan gagasan balasan atau pembayaran dalam μισθός dan tetap wajar dalam konteks penilaian ilahi; alternatif 'ganjaran' dicatat agar nuansa penghargaan juga terlihat.
- source_word: λήμψεται
  choice: ia akan menerima
  rationale: Menyampaikan bentuk futur secara alami dan bermartabat. 'Ia' tidak memaksakan gender karena bentuk Yunani di sini juga tidak menyatakan gender pelaku.
theological_decisions:
- issue: Sifat upah yang diterima
  choice: Tidak merinci bentuk atau dasar keselamatan dari upah tersebut.
  alternative: Menjelaskannya sebagai keselamatan, pahala pelayanan tertentu, atau tingkat kemuliaan tertentu.
  rationale: Ayat ini hanya menyatakan bahwa orang itu akan menerima μισθός; rincian tersebut tidak dinyatakan dan tidak boleh dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mempertahankan metafora pembangunan dan hubungan syarat-hasil. Rujukan eksplisit kepada 'dasar itu' membuat unsur 'membangun di atas' yang terkandung dalam kata Yunani dapat dipahami secara alami dalam bahasa Indonesia.
