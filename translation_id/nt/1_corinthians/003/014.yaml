  source_fidelity: Terjemahan mempertahankan struktur bersyarat εἴ ... λήμψεται, subjek tak tentu τινος, metafora pekerjaan yang dibangun di atas dasar, makna futur μενεῖ, serta μισθός sebagai "upah". Penambahan "dasar itu" secara wajar menjelaskan arah "membangun di atas" yang terkandung dalam ἐποικοδόμησεν dan telah dinyatakan dalam konteks dekat, tanpa menambahkan ajaran atau rincian baru.
