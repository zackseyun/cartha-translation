  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: id
  text: Sebab kamu masih bersifat kedagingan. Sebab di antara kamu ada iri hati dan perselisihan, bukankah kamu bersifat kedagingan dan hidup secara manusiawi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hidup dengan cara manusia belaka.” Secara harfiah, “berjalan menurut manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: masih
  rationale: Menandai keadaan yang terus berlangsung dan mempertahankan nada teguran Paulus.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan fungsi penjelas partikel pertama; pengulangan kedua tidak dinyatakan secara mekanis karena hubungan penjelas tetap jelas dan kalimat Indonesia lebih alami.
- source_word: σαρκικοί
  choice: bersifat kedagingan
  rationale: Mempertahankan hubungan dengan σάρξ (daging) dan nuansa moralnya tanpa mengembangkannya menjadi rumusan seperti “dikuasai tabiat berdosa.”
- source_word: ὅπου
  choice: jika ... ada
  rationale: Dalam konteks pembuktian ini, konstruksi tersebut menyampaikan bahwa adanya iri hati dan perselisihan menunjukkan keadaan mereka; lebih alami dalam bahasa Indonesia daripada “di mana ... ada”.
- source_word: ζῆλος
  choice: iri hati
  rationale: Dalam konteks negatif bersama ἔρις, kata ini menunjuk pada kecemburuan atau iri hati, bukan semangat yang positif.
- source_word: ἔρις
  choice: perselisihan
  rationale: Mencakup pertikaian dan pertentangan tanpa membatasinya hanya pada pertengkaran lisan.
- source_word: οὐχὶ
  choice: bukankah
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya.
- source_word: κατὰ ἄνθρωπον
  choice: dengan cara manusia belaka
  rationale: Mengungkapkan kontras dengan kehidupan yang dibentuk oleh Roh, sambil mempertahankan gagasan tentang cara hidup yang semata-mata manusiawi.
- source_word: περιπατεῖτε
  choice: hidup
  rationale: Menyampaikan metafora etis “berjalan” secara alami dalam bahasa Indonesia; terjemahan harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa yang berkaitan dengan σάρξ dalam σαρκικοί
  choice: bersifat kedagingan
  alternative: bersifat duniawi; dikuasai tabiat berdosa
  rationale: Pilihan ini mempertahankan citra “daging” dan teguran moral Paulus tanpa menyamakan istilah itu secara otomatis dengan suatu rumusan doktrinal yang lebih sempit.
- issue: Ungkapan κατὰ ἄνθρωπον περιπατεῖτε
  choice: hidup dengan cara manusia belaka
  alternative: berjalan menurut manusia
  rationale: Teks utama memakai bahasa Indonesia yang alami untuk metafora perilaku, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah dan ketegangan ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang lugas dan bermartabat. Istilah “kedagingan” dipakai untuk menjaga hubungan leksikal dengan “daging,” sedangkan ungkapan penutup dibuat idiomatis dan bentuk harfiahnya disediakan dalam catatan kaki.
