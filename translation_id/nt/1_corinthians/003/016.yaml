  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: id
  text: Tidak tahukah kalian bahwa kalian adalah Bait Allah[a][b] dan bahwa Roh Allah tinggal di dalam kalian[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat kudus Allah.”
    reason: lexical_alternative
  - marker: b
    text: Kata “kalian” berbentuk jamak; Paulus sedang menyapa jemaat sebagai suatu komunitas.
    reason: cultural_note
  - marker: c
    text: Atau “di tengah-tengah kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Tidak tahukah kalian
  rationale: Mempertahankan bentuk pertanyaan retoris Paulus dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: ναὸς θεοῦ
  choice: Bait Allah
  rationale: ναός menunjuk pada bait atau tempat kudus, bukan seluruh kompleks bait. 'Bait Allah' merupakan ungkapan Indonesia yang jelas dan mempertahankan gambaran ruang kudus milik Allah.
- source_word: ἐστε
  choice: kalian adalah
  rationale: Bentuk verba ini adalah orang kedua jamak. 'Kalian' menyatakan kemajemukan para penerima secara lebih jelas daripada 'kamu'.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Roh Allah
  rationale: Menerjemahkan konstruksi genitif secara alami tanpa mengubah hubungan antara Roh dan Allah.
- source_word: οἰκεῖ
  choice: tinggal
  rationale: Mengungkapkan keberadaan yang menetap dan selaras dengan gambaran Bait Allah.
- source_word: ἐν ὑμῖν
  choice: di dalam kalian
  rationale: Mempertahankan arti dasar ἐν sekaligus membiarkan rujukan jamak dan dimensi komunal tetap tampak; frasa ini juga dapat dipahami sebagai 'di tengah-tengah kalian'.
theological_decisions:
- issue: Apakah ayat ini terutama berbicara tentang orang percaya secara individual atau jemaat secara kolektif
  choice: Teks utama memakai 'kalian' tanpa menambahkan 'bersama-sama', sehingga bentuk jamak dan arah komunal konteks tetap terlihat tanpa mempersempit makna.
  alternative: Terjemahan yang diperjelas menjadi 'kalian bersama-sama adalah Bait Allah' atau yang diindividualkan menjadi 'setiap orang dari kalian adalah Bait Allah'.
  rationale: Bahasa Yunani memakai orang kedua jamak, tetapi tidak memuat kata yang secara eksplisit berarti 'bersama-sama' atau 'masing-masing'. Karena itu, ketegangan yang ada dipertahankan.
- issue: Lingkup makna ἐν ὑμῖν
  choice: di dalam kalian
  alternative: di tengah-tengah kalian
  rationale: ἐν dengan pronomina jamak dapat menyampaikan keberadaan di dalam komunitas atau di tengah komunitas. Teks utama mempertahankan bentuk yang paling dekat dengan susunan sumber, sedangkan alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada retoris yang wajar. 'Kalian' dipilih untuk memperlihatkan bentuk jamak Yunani; kapitalisasi 'Bait Allah' mengikuti pemakaian religius Indonesia dan membantu menyatakan gambaran khusus tentang tempat kediaman Allah.
