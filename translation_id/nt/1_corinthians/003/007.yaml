  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: id
  text: Jadi, yang menanam bukanlah apa-apa, demikian juga yang menyiram, melainkan Allah yang menumbuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah yang memberi pertumbuhan”; secara tradisional, “Allah yang memberi pertambahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ὁ φυτεύων
  choice: yang menanam
  rationale: Mempertahankan bentuk partisip substantival secara alami serta kesejajarannya dengan 'yang menyiram'.
- source_word: ἐστίν τι
  choice: bukanlah apa-apa
  rationale: Mencerminkan idiom Yunani secara dekat dan tetap dapat dipahami sebagai penyangkalan atas arti penting pelayan manusia dalam menghasilkan pertumbuhan.
- source_word: ὁ ποτίζων
  choice: yang menyiram
  rationale: Terjemahan alami yang mempertahankan kesejajaran retoris dengan 'yang menanam'.
- source_word: ἀλλ’
  choice: melainkan
  rationale: Sesudah dua penyangkalan, 'melainkan' menyatakan kontras korektif dengan lebih alami dalam bahasa Indonesia.
- source_word: ὁ αὐξάνων
  choice: yang menumbuhkan
  rationale: Mengungkapkan Allah sebagai pelaku yang menghasilkan pertumbuhan tanpa menambahkan objek yang tidak dinyatakan dalam bahasa Yunani.
- source_word: θεός
  choice: Allah
  rationale: Padanan baku dan bermartabat dalam bahasa Indonesia; posisi dalam klausa tetap menonjolkan kontras dengan para pekerja manusia.
theological_decisions:
- issue: Peran pekerja manusia dibandingkan dengan karya Allah
  choice: Mempertahankan ungkapan kuat 'bukanlah apa-apa' dan mengontraskannya dengan Allah yang menumbuhkan
  alternative: Tidak berarti apa-apa / tidak penting
  rationale: Teks Yunani memakai penyangkalan yang tajam; terjemahan tidak melunakkannya atau mengubahnya menjadi pernyataan bahwa pelayanan manusia sama sekali tidak memiliki fungsi dalam segala arti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dipertahankan, sedangkan 'demikian juga' dipakai agar rangkaian penyangkalan terdengar alami. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
