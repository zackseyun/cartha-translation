base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: id
  text: Aku memberi kalian minum susu[a], bukan makanan[b], sebab saat itu kalian belum sanggup. Tetapi bahkan sekarang pun kalian masih belum sanggup,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku memberi kalian susu untuk diminum, bukan makanan.”'
    reason: Menyediakan susunan Indonesia alternatif untuk verba Yunani yang secara harfiah berarti ‘memberi minum’.
  - marker: b
    text: Kata Yunani yang diterjemahkan “makanan” berarti makanan secara umum. Dalam kontras dengan susu, kata ini dapat menyiratkan makanan yang lebih padat atau lebih mengenyangkan.
    reason: Menjelaskan nuansa kontekstual βρῶμα tanpa mempersempit maknanya dalam teks utama.
lexical_decisions:
- source_word: γάλα
  choice: susu
  rationale: Padanan langsung yang mempertahankan metafora Paulus dan pertentangannya dengan makanan.
- source_word: ἐπότισα
  choice: memberi kamu ... untuk diminum
  rationale: Menerjemahkan makna harfiah verba ‘memberi minum’ secara wajar dalam bahasa Indonesia.
- source_word: βρῶμα
  choice: makanan
  rationale: Kata Yunani ini berarti makanan secara umum. Konteks mempertentangkannya dengan susu, tetapi teks utama tidak perlu mempersempitnya menjadi ‘makanan padat’.
- source_word: οὔπω
  choice: pada waktu itu ... belum
  rationale: Mengungkapkan negasi temporal masa lampau dengan alami dan membedakannya dari keadaan sekarang.
- source_word: ἐδύνασθε
  choice: kamu ... sanggup menerimanya
  rationale: δύναμαι menyatakan kemampuan; objek tersirat dipulihkan secara alami sebagai makanan yang baru disebut tanpa menjelaskan metafora lebih jauh.
- source_word: οὐδὲ ἔτι νῦν
  choice: Bahkan sekarang pun ... masih belum
  rationale: Mempertahankan penekanan pada keadaan yang terus berlangsung hingga saat ini.
- source_word: δύνασθε
  choice: kamu ... sanggup
  rationale: Menyatakan kemampuan pada masa kini dan mempertahankan kesejajaran dengan bentuk sebelumnya.
theological_decisions:
- issue: Makna metafora makanan rohani
  choice: Mempertahankan gambaran susu dan makanan tanpa menjabarkannya sebagai ajaran dasar dan ajaran lanjutan.
  alternative: Memparafrasakan metafora sebagai ‘Aku hanya mengajarkan hal-hal dasar kepadamu.’
  rationale: Teks Yunani menyampaikan metafora dan tidak secara eksplisit mendefinisikan isi susu atau makanan; terjemahan tidak boleh menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kamu’, gaya lugas dan bermartabat. Struktur masa lampau dan masa kini dibuat jelas, sedangkan metafora asli dipertahankan.
