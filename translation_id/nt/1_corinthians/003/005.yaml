  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: id
  text: Jadi, apakah Apolos itu? Dan apakah Paulus itu?[a] Pelayan-pelayan[b] yang melalui mereka kamu menjadi percaya, sesuai dengan yang Tuhan berikan kepada masing-masing.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah Apolos? Dan siapakah Paulus?” Bahasa Yunani memakai kata tanya yang secara harfiah berarti “apa”, sehingga sorotannya tertuju pada peran mereka, bukan identitas mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hamba-hamba” atau “orang-orang yang melayani”. Kata Yunani ini tidak harus menunjuk pada jabatan gerejawi diaken.
    reason: lexical_alternative
  - marker: c
    text: Bagian ini berbentuk elipsis dalam bahasa Yunani; objek dari “berikan” tidak disebutkan. Ada yang menerjemahkannya, “sebagaimana Tuhan menugaskan masing-masing.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: apakah ... itu
  rationale: Bentuk tanya netral ini menyoroti peran atau kedudukan Apolos dan Paulus, bukan identitas pribadi mereka. Susunan ini juga mempertahankan daya retoris bahasa Yunani dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: οὖν
  choice: Jadi
  rationale: Menyampaikan fungsi simpulan sekaligus peralihan tanpa membuat hubungan logisnya terlalu kaku.
- source_word: δέ
  choice: Dan
  rationale: Menandai kelanjutan dengan perbandingan ringan antara Apolos dan Paulus; 'dan' paling alami dalam pasangan pertanyaan ini.
- source_word: διάκονοι
  choice: pelayan
  rationale: Dalam konteks ini kata tersebut menunjuk orang yang menjalankan pelayanan sebagai hamba atau perantara, bukan secara khusus jabatan gerejawi diaken.
- source_word: δι’ ὧν
  choice: yang melalui mereka
  rationale: 'Mempertahankan arti sarana atau perantaraan dari διά dengan genetif: mereka menjadi perantara, bukan sumber iman.'
- source_word: ἐπιστεύσατε
  choice: kamu menjadi percaya
  rationale: Mengungkapkan tindakan mulai percaya secara alami tanpa menambahkan objek atau uraian teologis yang tidak dinyatakan.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: sesuai dengan apa yang Tuhan berikan kepada masing-masing
  rationale: Bahasa Indonesia memerlukan susunan yang lebih lengkap, tetapi 'apa yang' tetap membiarkan objek pemberian tidak ditentukan—entah tugas, peran, kemampuan, atau hal lain—sebagaimana elipsis dalam bahasa Yunani.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks bagi κύριος; terjemahan utama tidak memperjelas referennya melampaui yang dinyatakan teks.
theological_decisions:
- issue: Rujukan κύριος
  choice: Mempertahankan sebutan 'Tuhan' tanpa menyebut secara eksplisit siapa yang dimaksud.
  alternative: Menuliskan 'Tuhan Yesus' atau 'Allah'.
  rationale: Konteks Paulus dapat mendukung rujukan kepada Tuhan Yesus, tetapi ayat ini sendiri hanya memakai κύριος. Terjemahan tidak seharusnya menutup kemungkinan rujukan yang dibiarkan tersirat.
- issue: Elipsis dalam frasa 'seperti/sesuai dengan yang Tuhan berikan'
  choice: Memakai 'apa yang Tuhan berikan' tanpa menentukan objek pemberian.
  alternative: Menambahkan 'tugas', 'peran', 'karunia', atau menerjemahkan 'sebagaimana Tuhan menugaskan masing-masing'.
  rationale: Objek ἔδωκεν tidak dinyatakan. Menentukan tugas, peran, atau karunia akan menyelesaikan ambiguitas yang dipertahankan oleh teks sumber.
- issue: Kedudukan Apolos dan Paulus
  choice: Menyebut keduanya sebagai pelayan yang menjadi perantara bagi orang Korintus untuk percaya.
  alternative: Menyebut mereka pemimpin, rohaniwan, atau sumber iman.
  rationale: Paulus merendahkan penilaian berlebihan terhadap para pekerja manusia dan menempatkan mereka sebagai pelayan; bahasa sarana 'melalui' juga membedakan mereka dari sumber ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'apakah ... itu' sengaja dipakai untuk mempertahankan pertanyaan tentang peran, sedangkan 'pelayan' menghindari kesan jabatan resmi. Elipsis Yunani dijaga sejauh mungkin melalui ungkapan netral 'apa yang Tuhan berikan'.
