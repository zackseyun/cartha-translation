    rationale: “Membuatnya bertumbuh” dapat dipahami dengan baik dari metafora, tetapi bahasa Yunani tidak menyebut objek pronominal. “Memberi pertumbuhan” mempertahankan elipsis metaforis dengan lebih bersih.
