  naturalness: “Allah yang memberi pertumbuhan” adalah ungkapan modern, jelas, dan lazim dalam bahasa Indonesia Alkitab. Ini mempertahankan metafora tanpa objek pronominal yang agak kabur.
  terminology: “Aku,” “Apolos,” dan “Allah” sesuai dengan register Alkitab Indonesia yang baku. “Memberi pertumbuhan” menyampaikan daya ilahi yang dinyatakan oleh αὐξάνω tanpa memperkenalkan penafsiran doktrinal tambahan.
  issues:
