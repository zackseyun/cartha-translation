  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: id
  text: Aku menanam, Apolos menyiram, tetapi Allah yang memberi pertumbuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tetapi Allah membuatnya bertumbuh.”'
    reason: Alternatif leksikal untuk kata kerja Yunani yang menyatakan bahwa Allah menyebabkan pertumbuhan.
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina Yunani yang dinyatakan secara eksplisit memberi penekanan pada peran Paulus. “Aku” wajar dalam tuturan langsung dan sesuai dengan kontras terhadap Apolos dan Allah.
- source_word: ἐφύτευσα
  choice: menanam
  rationale: Mempertahankan metafora pertanian secara langsung dan alami dalam bahasa Indonesia.
- source_word: Ἀπολλῶς
  choice: Apolos
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἐπότισεν
  choice: menyiram
  rationale: Padanan yang ringkas dan alami dalam gambaran merawat tanaman.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai kontras kuat antara pekerjaan para pelayan dan tindakan Allah yang menentukan.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Sebutan baku dalam bahasa Indonesia untuk subjek ilahi; susunan klausa menonjolkan Allah sebagai pelaku yang menghasilkan pertumbuhan.
- source_word: ηὔξανεν
  choice: terus membuatnya bertumbuh
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung pada masa lampau. “Membuatnya bertumbuh” menyatakan daya kausatif αὐξάνω secara alami; “terus” membantu menyampaikan aspek berkelanjutan, sedangkan “-nya” merujuk secara wajar pada sesuatu yang ditanam dan disiram.
theological_decisions:
- issue: Tindakan Allah dalam hubungannya dengan pelayanan manusia
  choice: Paulus menanam dan Apolos menyiram, tetapi Allah terus menghasilkan pertumbuhan.
  alternative: Allah memberi pertumbuhan.
  rationale: Terjemahan mempertahankan pekerjaan manusia sebagai nyata sekaligus menegaskan, tanpa tambahan doktrinal, bahwa Allah adalah pelaku yang membuat pertumbuhan terjadi.
translation_notes:
  register: Bahasa modern, ringkas, dan bermartabat. Metafora pertanian dipertahankan. “Aku” dipilih karena konteksnya adalah tuturan langsung Paulus; bentuk ini lebih alami daripada “saya” dalam register Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
