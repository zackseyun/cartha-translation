    rationale: ηὔξανεν berbentuk imperfek, tetapi bentuk ini tidak dengan sendirinya menuntut penegasan eksplisit bahwa tindakan itu “terus” berlangsung. Penambahan tersebut dapat mempersempit nuansa aspek sumber.
