id: 1CO.3.21
reference: 1 Corinthians 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: id
  text: Karena itu, janganlah seorang pun bermegah karena manusia[a], sebab segala sesuatu adalah milik kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, yang terutama dimaksud dapat berupa para pemimpin manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan mempertahankan daya inferensialnya dalam bahasa Indonesia yang wajar.
- source_word: μηδεὶς
  choice: janganlah seorang pun
  rationale: Menyampaikan larangan yang berlaku umum dengan bentuk baku dan jelas.
- source_word: καυχάσθω
  choice: bermegah
  rationale: Mempertahankan gagasan membanggakan diri atau menaruh kebanggaan tanpa mempersempit maknanya menjadi sekadar memuji.
- source_word: ἐν ἀνθρώποις
  choice: karena manusia
  rationale: Dalam konstruksi dengan καυχάομαι, ἐν dapat menunjukkan dasar kebanggaan. 'Karena manusia' lebih alami daripada terjemahan harfiah 'di dalam manusia', sedangkan 'manusia' tetap generik dan tidak dibatasi pada laki-laki.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Mencerminkan bentuk netral jamak yang bersifat menyeluruh dan mempertahankan keluasan retorika Paulus.
- source_word: γὰρ
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan sebelumnya secara ringkas dan alami.
- source_word: ὑμῶν ἐστιν
  choice: adalah milik kalian
  rationale: Menyatakan kepemilikan secara langsung; 'kalian' memperjelas bahwa kata ganti Yunani yang digunakan berbentuk jamak.
theological_decisions:
- issue: Cakupan ἀνθρώποις dalam konteks perselisihan jemaat
  choice: manusia
  alternative: pemimpin manusia
  rationale: Konteks menunjuk terutama kepada tokoh atau pemimpin yang dijadikan dasar kebanggaan, tetapi teks Yunani memakai istilah umum 'manusia'. Terjemahan utama mempertahankan keluasan itu, sementara catatan kaki menjelaskan kemungkinan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah' mempertahankan nada nasihat kerasulan, sedangkan 'kalian' menyatakan dengan jelas bahwa sapaan kepada jemaat berbentuk jamak.
