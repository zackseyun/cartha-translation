base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: id
  text: Sebab hikmat dunia ini adalah kebodohan di hadapan Allah.[a] Sebab ada tertulis,[b] “Ia menangkap orang-orang berhikmat dalam kelicikan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama Allah”; maksudnya, dalam pandangan atau penilaian Allah.
    reason: lexical_alternative
  - marker: b
    text: Kutipan dari Ayub 5:13.
    reason: scripture_reference
lexical_decisions:
- source_word: σοφία
  choice: hikmat
  rationale: Padanan baku yang sesuai dengan konteks Paulus tentang apa yang dianggap sebagai hikmat oleh dunia.
- source_word: κόσμου τούτου
  choice: dunia ini
  rationale: κόσμος di sini menunjuk pada tatanan dunia sekarang; 'dunia ini' alami dan mempertahankan kontras dengan penilaian Allah.
- source_word: μωρία
  choice: kebodohan
  rationale: Padanan langsung yang selaras dengan pemakaian berulang istilah ini dalam konteks 1 Korintus.
- source_word: παρὰ τῷ θεῷ
  choice: di hadapan Allah
  rationale: Frasa ini menyatakan sudut pandang atau penilaian Allah; 'di hadapan Allah' alami dalam bahasa Indonesia dan tidak mengaburkan nuansa evaluatifnya.
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku untuk formula perfektum pasif yang memperkenalkan kutipan Kitab Suci.
- source_word: δρασσόμενος
  choice: menangkap
  rationale: Mengungkapkan tindakan mencengkeram atau menjebak dan cocok dengan daya ungkap kutipan tersebut.
- source_word: σοφοὺς
  choice: orang-orang berhikmat
  rationale: Menunjuk kepada orang-orang yang dipandang berhikmat tanpa membatasi jenis kelamin.
- source_word: πανουργίᾳ
  choice: kelicikan
  rationale: Menangkap nuansa negatif berupa kecerdikan yang tidak jujur atau penuh tipu daya.
theological_decisions:
- issue: Bentuk subjek ilahi dalam kutipan Ayub 5:13
  choice: Ia menangkap orang-orang berhikmat dalam kelicikan mereka
  alternative: Dia yang menangkap orang-orang berhikmat dalam kelicikan mereka
  rationale: Partisipel berartikel dalam bahasa Yunani menunjuk kepada Allah. 'Ia menangkap' membuat subjek tersurat secara alami tanpa menambahkan penjelasan teologis dan mempertahankan pernyataan bahwa Allah menggagalkan kecerdikan manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat dipertahankan, sedangkan ungkapan Yunani yang kurang alami dialihkan secara optimal agar jelas bagi pembaca umum.
