source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: id
  text: Orang yang menanam dan orang yang menyiram adalah satu[a], sedangkan masing-masing akan menerima upahnya sendiri sesuai dengan jerih lelahnya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersatu” atau “mempunyai satu tujuan.”
    reason: Alternatif leksikal yang menjelaskan bahwa “satu” menunjuk pada kesatuan, bukan bahwa keduanya adalah pribadi yang sama.
lexical_decisions:
- source_word: φυτεύων
  choice: orang yang menanam
  rationale: Partisipel berartikel ini berfungsi sebagai nomina. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora pertanian.
- source_word: ποτίζων
  choice: orang yang menyiram
  rationale: Sejajar dengan φυτεύων, bentuk ini menunjuk kepada pelaku dan mempertahankan gambaran pekerjaan pertanian.
- source_word: ἕν
  choice: adalah satu
  rationale: Bentuk netral tunggal menekankan kesatuan, bukan bahwa kedua pelayan adalah pribadi yang sama. Terjemahan harfiah yang ringkas ini juga mempertahankan keluasan makna teks Yunani.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Menegaskan pertanggungjawaban dan penerimaan balasan secara individual.
- source_word: ἴδιον μισθὸν
  choice: upahnya sendiri
  rationale: μισθός dapat berarti upah atau ganjaran. 'Upah' mempertahankan metafora pekerja dan pengertian balasan tanpa menetapkan bentuk balasan itu.
- source_word: λήμψεται
  choice: akan menerima
  rationale: Menyampaikan kala mendatang dengan wajar dan sesuai register yang bermartabat.
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Menyatakan bahwa upah diberikan menurut atau sepadan dengan jerih lelah tiap orang.
- source_word: ἴδιον κόπον
  choice: jerih lelahnya sendiri
  rationale: κόπος menonjolkan pekerjaan yang menguras tenaga, bukan sekadar kegiatan umum; pengulangan 'sendiri' mempertahankan tekanan ἴδιον yang muncul dua kali.
theological_decisions:
- issue: Makna ἕν εἰσιν ('adalah satu')
  choice: Mempertahankan ungkapan 'adalah satu' dalam teks utama, dengan catatan bahwa maksudnya dapat berupa kesatuan atau satu tujuan.
  alternative: Menerjemahkan langsung sebagai 'bersatu' atau 'mempunyai satu tujuan'.
  rationale: Bentuk netral ἕν menunjukkan kesatuan, bukan identitas pribadi. Konteks menentang pengelompokan berdasarkan pelayan, tetapi teks tetap membedakan pekerjaan dan upah masing-masing; karena itu ambiguitas padat bahasa Yunani sebaiknya dipertahankan.
- issue: Sifat μισθός
  choice: Menggunakan 'upah' tanpa merinci bentuk atau waktu pemberiannya.
  alternative: Menggunakan 'ganjaran' atau menafsirkannya sebagai pahala tertentu.
  rationale: Ayat menyatakan adanya balasan menurut jerih lelah, tetapi tidak menjelaskan bentuknya. 'Upah' menjaga hubungan dengan gambaran para pekerja dan tidak mengimpor rincian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta pengulangan 'sendiri' dipertahankan untuk mencerminkan penekanan teks Yunani. Kata 'tetapi' menerjemahkan δέ kedua dengan menandai peralihan dari kesatuan pelayanan kepada pertanggungjawaban individual.
