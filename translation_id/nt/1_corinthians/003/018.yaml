  source_fidelity: Terjemahan secara tepat mencerminkan larangan universal dengan objek refleksif (Μηδεὶς ἑαυτὸν ἐξαπατάτω), penilaian diri dalam δοκεῖ, keanggotaan komunitas dalam ἐν ὑμῖν, serta kontras temporal-teologis ἐν τῷ αἰῶνι τούτῳ. Imperatif μωρὸς γενέσθω dan klausa tujuan ἵνα γένηται σοφός dipertahankan dengan paradoks yang jelas.
