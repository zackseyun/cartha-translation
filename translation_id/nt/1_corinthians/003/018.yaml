  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: id
  text: Jangan seorang pun menipu dirinya sendiri. Jika di antara kalian ada yang menganggap dirinya bijaksana pada zaman ini[a], hendaklah ia menjadi bodoh[b] supaya ia menjadi bijaksana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bijaksana menurut ukuran zaman ini.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menjadi orang bodoh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Jangan seorang pun menipu dirinya sendiri
  rationale: Mempertahankan larangan universal dan objek refleksif yang dinyatakan secara eksplisit dalam bahasa Yunani, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: menganggap dirinya bijaksana
  rationale: Dalam konteks ini δοκεῖ menunjuk pada penilaian seseorang tentang dirinya sendiri; ungkapan ini lebih jelas daripada 'tampak bijaksana'.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Menyatakan bahwa orang tersebut berada dalam komunitas para penerima surat. 'Kalian' alami dalam bahasa Indonesia modern dan jelas berbentuk jamak.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: pada zaman ini
  rationale: Mempertahankan nuansa temporal-teologis αἰών dan kontras Paulus antara hikmat zaman sekarang dan hikmat Allah.
- source_word: μωρὸς γενέσθω
  choice: hendaklah ia menjadi bodoh
  rationale: Mempertahankan bentuk desakan serta paradoks teks; 'bodoh' merepresentasikan adjektiva predikatif tanpa mengubahnya menjadi label identitas yang lebih keras.
- source_word: ἵνα γένηται σοφός
  choice: supaya ia menjadi bijaksana
  rationale: Mempertahankan klausa tujuan dan pengulangan verba 'menjadi' yang membentuk paradoks ayat.
theological_decisions:
- issue: Makna αἰών dalam kontras Paulus
  choice: zaman ini
  alternative: dunia ini
  rationale: '''Zaman ini'' mempertahankan dimensi temporal-eskatologis dan tidak menyamakan αἰών begitu saja dengan dunia ciptaan.'
- issue: Kaitan frasa ἐν τῷ αἰῶνι τούτῳ
  choice: pada zaman ini
  alternative: menurut ukuran zaman ini
  rationale: Terjemahan utama mempertahankan bentuk sumber dan ambiguitas apakah frasa itu terutama menunjukkan ranah atau standar penilaian; alternatif dijelaskan dalam catatan.
- issue: Rujukan maskulin tunggal yang bersifat representatif
  choice: dirinya sendiri / ia
  alternative: diri mereka sendiri / mereka
  rationale: Bahasa Indonesia tidak menandai gender pada 'ia' dan '-nya', tetapi tetap mempertahankan acuan tunggal dari teks Yunani tanpa mempersempitnya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku-modern, lugas, dan bermartabat. 'Hendaklah' dipakai untuk menyampaikan daya imperatif tanpa terdengar kasar; paradoks 'menjadi bodoh supaya ... menjadi bijaksana' dipertahankan.
