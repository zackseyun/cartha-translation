source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: id
  text: Dan aku, saudara-saudara[a], tidak dapat berbicara kepadamu seperti kepada orang-orang rohani, tetapi seperti kepada orang-orang yang bersifat kedagingan, seperti kepada bayi-bayi dalam Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai secara harfiah berarti “saudara-saudara laki-laki”, tetapi dalam sapaan kepada jemaat dapat mencakup saudara laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam Kristus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Dan aku
  rationale: Mempertahankan daya penghubung καί serta kata ganti orang pertama yang tegas tanpa memberi penekanan berlebihan.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan jamak ini secara gramatikal berbentuk maskulin, sedangkan kata Indonesia 'saudara-saudara' wajar sebagai sapaan kepada jemaat dan dapat mencakup laki-laki maupun perempuan; cakupannya dijelaskan dalam catatan kaki.
- source_word: οὐκ ἠδυνήθην
  choice: tidak dapat
  rationale: Menyatakan ketidakmampuan Paulus pada waktu yang dibicarakan secara jelas dan alami dalam bahasa Indonesia.
- source_word: λαλῆσαι ὑμῖν
  choice: berbicara kepadamu
  rationale: Padanan langsung dan wajar bagi infinitif λαλῆσαι dengan objek datif ὑμῖν.
- source_word: πνευματικοῖς
  choice: orang-orang rohani
  rationale: Adjektiva ini digunakan secara substantival; penambahan 'orang-orang' memperjelas acuannya tanpa menentukan lebih jauh sifat kerohanian tersebut.
- source_word: σαρκίνοις
  choice: orang-orang yang bersifat daging
  rationale: Mempertahankan kaitan leksikal dengan σάρξ, 'daging', dan kontras dengan 'rohani' tanpa mengubahnya menjadi tafsiran yang lebih bermuatan moral seperti 'duniawi' atau 'berdosa'.
- source_word: νηπίοις
  choice: bayi-bayi
  rationale: Mempertahankan metafora tentang ketidakdewasaan dengan padanan yang konkret dan mudah dipahami.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar 'Mesias' sambil mempertahankan konstruksi khas Paulus 'dalam' Mesias.
theological_decisions:
- issue: Makna σαρκίνοις dalam kontras dengan πνευματικοῖς
  choice: orang-orang yang bersifat daging
  alternative: orang-orang duniawi
  rationale: Pilihan utama mempertahankan metafora 'daging' dan tidak secara diam-diam menyamakan istilah tersebut dengan keduniawian atau suatu rumusan teologis tertentu.
- issue: Penerjemahan Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Χριστός berasal dari gelar bagi Yang Diurapi; 'Mesias' mempertahankan daya gelar itu, sedangkan bentuk tradisional 'Kristus' dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur perbandingan Yunani dipertahankan dengan pengulangan 'seperti kepada'. Istilah 'bersifat daging' sengaja dipilih meskipun sedikit kurang idiomatis daripada 'duniawi', supaya metafora dan ketegangan leksikal teks sumber tidak hilang.
