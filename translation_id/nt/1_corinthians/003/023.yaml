  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: id
  text: dan kalian adalah milik Mesias[a], dan Mesias adalah milik Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “Kristus.” “Mesias” dan “Kristus” menerjemahkan gelar yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kamu
  rationale: Pronomina orang kedua jamak yang menunjuk kepada seluruh jemaat; bahasa Indonesia baku memakai “kamu” tanpa membedakan jumlah, dan konteks menjelaskan bahwa sapaannya bersifat jamak.
- source_word: δὲ
  choice: dan
  rationale: Di sini δέ melanjutkan sekaligus membedakan mata rantai hubungan kepunyaan. “Dan” mempertahankan alur yang wajar tanpa membuat pertentangannya terlalu kuat.
- source_word: Χριστοῦ
  choice: milik Mesias
  rationale: Bentuk genitif menyatakan kepunyaan atau hubungan. Ungkapan “milik Mesias” menyampaikan relasi itu dengan jelas dan tetap ringkas.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Gelar ini diulang untuk mempertahankan kesejajaran retoris kedua klausa. “Mesias” mempertahankan makna gelarnya, bukan sekadar memakai bentuk tradisional “Kristus” sebagai nama.
- source_word: θεοῦ
  choice: milik Allah
  rationale: Genitif θεοῦ menyatakan hubungan kepunyaan. “Milik Allah” mempertahankan kesejajaran dengan klausa sebelumnya tanpa menjelaskan lebih jauh sifat hubungan tersebut.
theological_decisions:
- issue: Cara menerjemahkan dua konstruksi genitif Χριστοῦ dan θεοῦ tanpa melunakkan susunan relasional Paulus.
  choice: 'Kedua klausa memakai ungkapan kepunyaan yang eksplisit: “kamu adalah milik Mesias” dan “Mesias adalah milik Allah.”'
  alternative: “kamu kepunyaan Mesias, dan Mesias kepunyaan Allah” atau bentuk eliptis “kamu milik Mesias, dan Mesias milik Allah.”
  rationale: Teks Yunani singkat dan bersifat relasional, bukan penjelasan doktrinal. Bentuk yang dipilih jelas dalam bahasa Indonesia modern, menjaga paralelisme, dan tidak mencoba menerangkan atau menyelesaikan ketegangan teologis dalam pernyataan bahwa Mesias adalah milik Allah.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan mudah dipahami. Kata “adalah” dipakai pada kedua relasi secara tersirat melalui pola paralel; pada klausa kedua, pengulangan “adalah” dipertahankan dalam teks agar hubungan kepunyaan tetap tegas dan seimbang.
