id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: id
  text: Sesuai dengan anugerah Allah yang diberikan kepadaku, sebagai ahli bangunan yang bijaksana[a], aku telah meletakkan fondasi, dan orang lain membangun di atasnya. Namun, hendaklah masing-masing memperhatikan bagaimana ia membangun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala tukang yang bijaksana”; kata Yunani ini menunjuk kepada ahli atau pemimpin pembangunan yang mengawasi pekerjaan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunani berarti “membangun di atas”; yang dimaksud ialah membangun di atas fondasi tersebut.
    reason: implicit_object
lexical_decisions:
- source_word: Κατὰ
  choice: Sesuai dengan
  rationale: Menunjukkan kesesuaian atau keselarasan dengan anugerah yang diberikan, bukan sekadar sarana.
- source_word: χάριν
  choice: anugerah
  rationale: Mempertahankan bobot teologis χάρις sebagai pemberian dan pemberdayaan ilahi dalam pemakaian Paulus.
- source_word: τὴν δοθεῖσάν μοι
  choice: yang diberikan kepadaku
  rationale: Menyatakan dengan langsung bahwa anugerah itu dianugerahkan kepada Paulus.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: sebagai ahli bangunan yang bijaksana
  rationale: ὡς di sini menyatakan peran atau kapasitas; ἀρχιτέκτων merujuk kepada pembangun utama yang cakap dan mengawasi pekerjaan, sedangkan σοφός dipertahankan sebagai 'bijaksana'.
- source_word: θεμέλιον ἔθηκα
  choice: aku telah meletakkan fondasi
  rationale: Ungkapan Indonesia yang alami bagi tindakan meletakkan dasar bangunan; bentuk perfektif menampilkan pekerjaan Paulus yang sudah dilakukan.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: dan orang lain membangun di atasnya
  rationale: Objek tersirat dari verba majemuk diperjelas sebagai fondasi yang baru disebutkan.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Namun, hendaklah masing-masing memperhatikan
  rationale: Imperatif menuntut kewaspadaan dan pemeriksaan yang sungguh-sungguh; 'masing-masing' mempertahankan daya distributif tanpa membatasi pada laki-laki.
- source_word: πῶς ἐποικοδομεῖ
  choice: bagaimana ia membangun
  rationale: Pengulangan verba dipertahankan, sedangkan 'di atasnya' tidak diulang karena acuannya sudah jelas dan penghilangan itu lebih alami dalam bahasa Indonesia.
theological_decisions:
- issue: Lingkup bentuk maskulin tunggal ἕκαστος
  choice: masing-masing ... ia
  alternative: setiap orang ... mereka; setiap laki-laki ... ia
  rationale: Bentuk Yunani tunggal maskulin berdaya representatif dan tidak terbatas pada laki-laki. 'Masing-masing ... ia' mempertahankan lingkup umum sekaligus konstruksi tunggal.
- issue: Sifat anugerah dalam pelayanan Paulus
  choice: anugerah Allah yang diberikan kepadaku
  alternative: kemampuan dari Allah yang diberikan kepadaku
  rationale: Teks menyebut χάρις tanpa menjabarkannya menjadi kemampuan saja; terjemahan mempertahankan keluasan makna pemberian dan pemberdayaan ilahi.
- issue: Peran Paulus sebagai ἀρχιτέκτων
  choice: ahli bangunan yang bijaksana
  alternative: arsitek yang bijaksana; kepala tukang yang bijaksana
  rationale: Istilah itu dalam konteks kuno mencakup pemimpin atau ahli pembangunan, bukan hanya perancang dalam pengertian profesi modern. Pilihan utama mempertahankan gambaran pembangunan sambil menghindari pembatasan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Fondasi' dipilih karena lazim dalam gambaran bangunan. Susunan kalimat mempertahankan metafora Paulus dan pengulangan verba, tanpa membuat klausa terakhir terasa kaku.
