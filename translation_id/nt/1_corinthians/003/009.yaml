  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: id
  text: Sebab, kami adalah sesama pekerja bagi Allah[a]; kamu adalah ladang Allah, bangunan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami adalah pekerja bersama Allah.”
    reason: Frasa θεοῦ συνεργοί dapat dipahami sebagai para pekerja yang melayani Allah atau sebagai para pekerja yang bekerja bersama Allah.
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan argumen sebelumnya.
- source_word: συνεργοί
  choice: rekan-rekan sekerja
  rationale: Ungkapan Indonesia yang wajar dan tetap menyatakan bahwa para pelayan bekerja bersama-sama.
- source_word: θεοῦ (dengan συνεργοί)
  choice: milik Allah
  rationale: Menafsirkan genitif sebagai kepunyaan atau pelayanan di bawah Allah, sesuai konteks yang menekankan bahwa para pelayan adalah milik Allah; kemungkinan arti 'bekerja bersama Allah' tetap dicatat.
- source_word: γεώργιον
  choice: ladang
  rationale: Padanan yang ringkas, alami, dan mempertahankan metafora pertanian.
- source_word: οἰκοδομή
  choice: bangunan
  rationale: Padanan langsung dan alami yang mempersiapkan metafora pembangunan dalam ayat-ayat berikutnya.
- source_word: ἐστε
  choice: kamu adalah
  rationale: Menyatakan secara langsung bentuk orang kedua jamak dalam bahasa Yunani; 'kamu' dipahami sebagai jemaat secara kolektif.
theological_decisions:
- issue: Apakah θεοῦ συνεργοί berarti para pekerja milik Allah atau orang-orang yang bekerja bersama Allah
  choice: rekan-rekan sekerja milik Allah
  alternative: rekan-rekan sekerja bersama Allah
  rationale: Genitif Yunani memungkinkan kedua pemahaman. Konteks langsung menekankan bahwa para pelayan adalah milik Allah dan melayani di bawah-Nya, tetapi alternatif yang sungguh mungkin tidak disingkirkan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Allah' dipertahankan untuk mencerminkan penekanan retoris teks Yunani. Penanda catatan kaki ditempatkan pada akhir ayat karena alternatif tersebut mengubah struktur klausa pertama, bukan kata 'ladang'.
