  terminology: “Allah,” “ladang,” dan “bangunan” tepat dan konsisten. Catatan kaki perlu ditambatkan langsung pada frasa συνεργοί, bukan pada akhir ayat, karena alternatif hanya menyangkut klausa pertama.
