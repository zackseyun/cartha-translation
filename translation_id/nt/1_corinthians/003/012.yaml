base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: id
  text: Jika ada orang yang membangun di atas dasar itu dengan emas, perak, batu-batu berharga, kayu, rumput kering, jerami,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Jika ada orang yang
  rationale: Menyampaikan syarat dengan acuan umum. Partikel δέ menandai kelanjutan ringan dalam argumen dan tidak perlu diterjemahkan tersendiri karena hubungan wacananya sudah alami dalam bahasa Indonesia.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: membangun di atas dasar itu
  rationale: Mempertahankan metafora bangunan dan hubungan bahwa pembangunan dilakukan di atas dasar yang telah disebut dalam konteks.
- source_word: χρυσόν
  choice: emas
  rationale: Padanan langsung untuk bahan bangunan dalam daftar.
- source_word: ἄργυρον
  choice: perak
  rationale: Padanan langsung yang berpasangan secara alami dengan emas.
- source_word: λίθους τιμίους
  choice: batu-batu berharga
  rationale: Mempertahankan bentuk jamak dan makna batu bernilai tinggi tanpa mempersempitnya khusus menjadi permata.
- source_word: ξύλα
  choice: kayu
  rationale: Kata benda bahan dalam bahasa Indonesia paling alami digunakan tanpa penanda jamak.
- source_word: χόρτον
  choice: rumput kering
  rationale: Dalam kontras bahan yang mudah terbakar, frasa ini lebih jelas daripada 'rumput' dan lebih mudah dipahami daripada istilah teknis.
- source_word: καλάμην
  choice: jerami
  rationale: Padanan alami dalam daftar bahan bangunan yang mudah terbakar; tidak mempersempit makna menjadi buluh.
