  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: id
  text: Pekerjaan setiap orang akan menjadi jelas, sebab Hari itu[a] akan menyingkapkannya; karena Hari itu akan dinyatakan dengan api[b], dan api itu sendiri akan menguji mutu pekerjaan setiap orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Hari itu" kemungkinan besar menunjuk pada hari penilaian atau penghakiman Allah pada masa depan.'
    reason: cross_reference
  - marker: b
    text: Atau, "dalam api." Frasa Yunani ἐν πυρί dapat dipahami sebagai "dengan api" atau secara lokatif sebagai "dalam api."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: setiap orang
  rationale: Bentuk genitif distributif ini menekankan penilaian atas masing-masing individu; frasa ini alami dan tidak menambahkan penandaan gender dalam bahasa Indonesia.
- source_word: τὸ ἔργον
  choice: pekerjaan
  rationale: Dalam konteks ini kata tersebut menunjuk secara luas pada hasil pekerjaan tiap pembangun; 'pekerjaan' mempertahankan keluasan maknanya.
- source_word: φανερὸν γενήσεται
  choice: akan menjadi nyata
  rationale: Ungkapan ini mempertahankan hasil pada masa depan yang dinyatakan oleh gabungan adjektiva dan verba Yunani, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἡ ἡμέρα
  choice: Hari itu
  rationale: Artikel dan konteks menunjuk pada hari tertentu pada masa depan ketika Allah mengadakan penilaian; huruf kapital membantu menandai rujukan eskatologis tanpa menambahkan istilah yang tidak ada dalam teks.
- source_word: δηλώσει
  choice: akan menyingkapkannya
  rationale: '''Menyingkapkan'' menyampaikan tindakan membuat pekerjaan terlihat jelas dan tetap cocok dengan konteks pengungkapan atau penilaian.'
- source_word: ἐν πυρὶ
  choice: dalam api
  rationale: Terjemahan ini mempertahankan bentuk preposisional Yunani dan membiarkan terbuka nuansa lokatif ('dalam api') maupun instrumental ('oleh api'), yang dicatat dalam catatan kaki.
- source_word: ἀποκαλύπτεται
  choice: dinyatakan
  rationale: Bentuk pasif kini dipertahankan; dalam konteks, subjek tersiratnya paling wajar adalah 'Hari itu'. Pilihan ini juga menghindari pengulangan kata 'menyingkapkan' dari klausa sebelumnya.
- source_word: ὁποῖόν ἐστιν
  choice: seperti apa
  rationale: Ungkapan ini secara alami menyampaikan pengujian terhadap sifat atau mutu pekerjaan tanpa mempersempitnya hanya menjadi nilai kualitas.
- source_word: δοκιμάσει
  choice: akan menguji
  rationale: Verba ini menyatakan pengujian untuk mengetahui sifat, mutu, atau ketahanan sesuatu; 'menguji' tepat dan mudah dipahami.
- source_word: αὐτὸ
  choice: itu sendiri
  rationale: Bentuk intensif Yunani menekankan bahwa api itulah yang melakukan pengujian; penekanan tersebut dipertahankan.
theological_decisions:
- issue: Apakah ἡ ἡμέρα menunjuk pada suatu hari secara umum atau Hari eskatologis ketika Allah menilai.
  choice: Hari itu
  alternative: hari itu
  rationale: Konteks membahas penilaian Allah pada masa depan atas pekerjaan tiap orang. Kapitalisasi menandai rujukan khusus itu tanpa memasukkan rincian teologis tambahan.
- issue: Apakah ἐν πυρί harus dipahami secara lokatif atau instrumental.
  choice: dalam api
  alternative: oleh api
  rationale: Teks Yunani memungkinkan kedua nuansa tersebut. Teks utama mempertahankan bentuk yang lebih formal, sedangkan alternatif dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, sementara pengulangan 'Hari itu' dipakai untuk memperjelas subjek tersirat ἀποκαλύπτεται. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
