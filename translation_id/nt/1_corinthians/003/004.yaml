  register: Bahasa Indonesia baku modern dengan nada lugas dan berwibawa. Kata ganti jamak 'kalian' memperjelas bahwa ἐστε ditujukan kepada jemaat, sedangkan 'Aku' mempertahankan bentuk ujaran langsung.
