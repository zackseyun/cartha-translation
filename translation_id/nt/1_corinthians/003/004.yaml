- source_word: Ἐγὼ Ἀπολλῶ
  choice: Aku pengikut Apolos
  rationale: Melengkapi elipsis verba dan mempertahankan kesejajaran dengan klausa sebelumnya.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: bukankah kalian hanya manusia biasa?
  rationale: Pertanyaan retoris ini menegur perilaku yang mengikuti ukuran manusia semata; 'hanya manusia biasa' menyampaikan daya pragmatis ἄνθρωποι dalam konteks, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna identitas dengan Paulus atau Apolos
  choice: pengikut Paulus / pengikut Apolos
  alternative: milik Paulus / milik Apolos
  rationale: Konteks membahas keberpihakan kepada pemimpin tertentu. 'Pengikut' menyatakan afiliasi kelompok tanpa menetapkan hubungan kepemilikan teologis.
- issue: Daya teguran οὐκ ἄνθρωποί ἐστε
  choice: bukankah kalian hanya manusia biasa?
  alternative: bukankah kalian manusia? / bukankah kalian bertindak seperti manusia?
  rationale: Pilihan utama menjaga bentuk pertanyaan sekaligus menyampaikan kontras kontekstual antara perilaku duniawi dan kehidupan oleh Roh, tanpa mengubahnya menjadi pernyataan eksplisit mengenai tindakan.
