  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: id
  text: Dan lagi, “Tuhan mengetahui bahwa pemikiran orang-orang bijak itu sia-sia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutipan dari Mazmur 94:11 (93:11 LXX). Kata “pemikiran” juga dapat diterjemahkan “penalaran,” dan “sia-sia” juga dapat berarti “hampa” atau “tidak berguna.”
    reason: cross_reference_and_lexical_alternatives
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Dan selanjutnya
  rationale: Ungkapan ini memperkenalkan kutipan pendukung kedua; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi penambahan argumen.
- source_word: Κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk κύριος dalam pernyataan yang mengutip Kitab Suci.
- source_word: γινώσκει
  choice: mengetahui
  rationale: Padanan langsung yang mempertahankan daya pernyataan tanpa penambahan tafsir.
- source_word: τοὺς διαλογισμοὺς
  choice: pemikiran
  rationale: Mencakup pikiran atau penalaran batin; lebih alami daripada 'penalaran-penalaran' dalam kalimat ini.
- source_word: τῶν σοφῶν
  choice: orang-orang bijak
  rationale: Menerjemahkan adjektiva substantival secara alami dan tidak membatasi rujukannya pada laki-laki.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi yang diketahui Tuhan, bukan alasan sebab-akibat.
- source_word: εἰσὶν μάταιοι
  choice: semuanya itu sia-sia
  rationale: Kata 'semuanya itu' memperjelas bahwa predikat jamak merujuk kepada pemikiran-pemikiran tersebut; 'sia-sia' menyampaikan kehampaan dan ketidakberhasilan tanpa mempersempit makna.
theological_decisions:
- issue: Acuan kata ganti tersirat dalam εἰσὶν μάταιοι
  choice: semuanya itu sia-sia
  alternative: pemikiran itu sia-sia
  rationale: Bentuk ini menjaga acuan kepada keseluruhan pemikiran orang-orang bijak dan menghindari kesan bahwa orang bijaknya sendiri yang disebut sia-sia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kutipan dibuat alami sambil mempertahankan hubungan isi yang ditandai ὅτι.
