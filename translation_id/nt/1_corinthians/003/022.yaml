  terminology: “Kefas” dengan tepat mempertahankan bentuk nama yang digunakan dalam teks Yunani, bukan menggantinya dengan “Petrus.” Istilah lain—“dunia,” “kehidupan,” “kematian,” dan “semuanya milik kalian”—konsisten, alami, dan tidak menambahkan penafsiran teologis.
