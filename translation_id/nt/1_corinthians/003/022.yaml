id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: id
  text: baik Paulus, Apolos, Kefas, dunia, kehidupan, kematian, hal-hal yang ada sekarang, maupun hal-hal yang akan datang—semuanya milik kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: baik … maupun
  rationale: Rangkaian korelatif ini mempertahankan susunan retoris daftar dalam bahasa Indonesia yang alami. Unsur-unsur di tengah dipisahkan dengan koma, sedangkan unsur terakhir didahului 'maupun'.
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dan umum dalam bahasa Indonesia.
- source_word: Ἀπολλῶς
  choice: Apolos
  rationale: Transliterasi nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: Κηφᾶς
  choice: Kefas
  rationale: Mempertahankan bentuk nama Semitik yang dipakai teks Yunani, alih-alih menggantinya dengan nama padanannya, Petrus.
- source_word: κόσμος
  choice: dunia
  rationale: Padanan Indonesia yang alami dan cukup luas untuk dunia atau tatanan ciptaan dalam argumen Paulus.
- source_word: ζωή
  choice: kehidupan
  rationale: Padanan nomina yang alami dalam deretan realitas yang disebut Paulus; bentuk ini berpasangan dengan baik dengan 'kematian'.
- source_word: θάνατος
  choice: kematian
  rationale: Padanan langsung yang mempertahankan bentuk nomina abstrak dan kesejajarannya dengan 'kehidupan'.
- source_word: ἐνεστῶτα
  choice: hal-hal yang ada sekarang
  rationale: Partisip substantival ini menunjuk pada segala realitas masa kini. Ungkapan ini jelas dan alami bagi pembaca modern.
- source_word: μέλλοντα
  choice: hal-hal yang akan datang
  rationale: Partisip substantival ini menunjuk pada realitas masa depan dan membentuk pasangan yang jelas dengan 'hal-hal yang ada sekarang'.
- source_word: πάντα
  choice: semuanya
  rationale: Merangkum seluruh daftar, termasuk orang dan berbagai realitas, tanpa membatasinya hanya pada benda.
- source_word: ὑμῶν
  choice: milik kalian
  rationale: Genitif menyatakan kepunyaan. 'Kalian' memperjelas bahwa orang kedua yang dimaksud berbentuk jamak dan sesuai dengan sapaan kepada jemaat Korintus.
theological_decisions:
- issue: Cakupan pernyataan bahwa semuanya adalah milik jemaat
  choice: 'Dibiarkan sebagai pernyataan kepunyaan yang luas: ''semuanya milik kalian'''
  alternative: Menjelaskannya sebagai 'semuanya tersedia demi kebaikan kalian' atau 'semuanya tunduk kepada kalian'
  rationale: Teks hanya menyatakan πάντα ὑμῶν secara ringkas. Terjemahan tidak menambahkan penjelasan tentang cara atau batas kepunyaan itu, sehingga ketegangan retoris dan teologisnya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia standar modern, ringkas, dan bermartabat. Bentuk 'kalian' dipakai untuk menandai orang kedua jamak secara transparan; tidak diperlukan catatan kaki.
