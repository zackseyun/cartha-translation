id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: id
  text: Jika ada orang yang membinasakan bait Allah[a], Allah akan membinasakan orang itu. Sebab bait Allah itu kudus, dan kamulah bait itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “membinasakan” pada kedua kemunculannya dapat juga berarti “merusak” atau “mencemarkan”.
    reason: lexical_alternative
  - marker: b
    text: Kata “kamu” dalam bahasa Yunani berbentuk jamak; Paulus menyebut jemaat secara kolektif sebagai bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: bait
  rationale: Dalam konteks ini, ναός menunjuk pada tempat kediaman Allah yang kudus. “Bait” merupakan padanan Alkitabiah yang alami dalam bahasa Indonesia dan sesuai dengan gambaran jemaat sebagai bait Allah.
- source_word: φθείρει / φθερεῖ
  choice: membinasakan / akan membinasakan
  rationale: Padanan yang sama dipakai pada kedua kemunculan untuk mempertahankan pengulangan dan hubungan pembalasan dalam bahasa Yunani. Kata ini dapat juga berarti merusak atau mencemarkan, tetapi “membinasakan” mempertahankan kerasnya peringatan.
- source_word: τοῦτον
  choice: orang itu
  rationale: Ungkapan ini merujuk kembali kepada τις (“ada orang”) secara tunggal dan diterjemahkan secara wajar serta netral gender dalam bahasa Indonesia.
- source_word: ἅγιος
  choice: kudus
  rationale: “Kudus” mempertahankan gagasan kesucian dan pengkhususan bagi Allah tanpa mempersempit maknanya.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: dan kamulah bait itu
  rationale: Rumusan ini menyatakan dengan jelas bahwa para pembaca secara kolektif adalah bait Allah, sambil mempertahankan penekanan pada ὑμεῖς melalui bentuk “kamulah”.
- source_word: ὑμεῖς
  choice: kamu
  rationale: Dalam bahasa Indonesia, “kamu” dapat bersifat tunggal atau jamak; catatan kaki menjelaskan bahwa bentuk Yunani di sini jamak dan menunjuk kepada jemaat secara kolektif.
theological_decisions:
- issue: Apakah bait Allah terutama menunjuk kepada orang percaya secara individual atau kepada jemaat secara kolektif
  choice: Teks utama mempertahankan identifikasi para pembaca secara kolektif sebagai satu bait Allah.
  alternative: Ayat ini dapat dibaca sebagai gambaran setiap orang percaya secara individual sebagai bait Allah.
  rationale: ναός berbentuk tunggal, sedangkan ὑμεῖς berbentuk jamak. Dalam konteks 1 Korintus 3, perpaduan ini paling alami menunjuk kepada jemaat sebagai satu kesatuan, tanpa meniadakan penggunaan gambaran bait bagi individu di bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada peringatan yang khidmat. “Bait Allah” dipilih sebagai ungkapan yang dikenal luas. Pengulangan “membinasakan” dipertahankan agar struktur dan daya retoris teks sumber tetap terasa.
