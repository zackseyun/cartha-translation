id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: id
  text: Jika pekerjaan seseorang terbakar habis, ia akan menderita kerugian, tetapi ia sendiri akan diselamatkan—namun seperti melalui api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “namun hanya seperti melalui api,” atau “tetapi seperti orang yang lolos melalui api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Jika ... seseorang
  rationale: Menyampaikan syarat sederhana dan acuan tak tentu tanpa menambahkan penekanan yang tidak terdapat dalam teks.
- source_word: τὸ ἔργον
  choice: pekerjaan
  rationale: Mempertahankan keluasan ἔργον serta kaitannya dengan hasil kerja pelayanan dan gambaran pembangunan dalam konteks.
- source_word: κατακαήσεται
  choice: terbakar habis
  rationale: Kata kerja ini menunjuk pada pembakaran sampai musnah; 'terbakar habis' alami dan mempertahankan daya ungkapnya.
- source_word: ζημιωθήσεται
  choice: akan menderita kerugian
  rationale: Mengungkapkan kehilangan tanpa menentukan bahwa yang hilang pasti upah atau bahwa orang tersebut dijatuhi hukuman tertentu.
- source_word: αὐτὸς δὲ
  choice: tetapi ia sendiri
  rationale: Mempertahankan penekanan pada orang itu sendiri dan kontras antara musnahnya pekerjaan dengan keselamatan orangnya.
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Sesuai dengan makna σῴζω dan bobot soteriologis ungkapan Paulus di sini.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: namun seperti melalui api
  rationale: Mempertahankan gambaran yang ringkas dan ambiguitas metaforis bahasa Yunani tanpa menjadikannya doktrin tertentu atau sekadar pelarian sempit.
theological_decisions:
- issue: Apakah frasa penutup harus diterjemahkan untuk mendukung penafsiran doktrinal tertentu, seperti pemurnian sesudah kematian atau lolos nyaris celaka.
  choice: namun seperti melalui api
  alternative: namun hanya seperti melalui api; tetapi seperti orang yang lolos melalui api; tetapi melalui api pemurnian
  rationale: Bahasa Yunani tidak menguraikan hakikat api atau cara keselamatan itu. Rumusan ini menjaga ketegangan teologis dan citra metaforis tanpa memaksakan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat mempertahankan kontras antara pekerjaan yang musnah dan orang yang diselamatkan; tanda pisah menandai penjelasan akhir yang tajam tanpa memperjelas metafora secara berlebihan.
