translation:
  language: id
  text: Aku bersyukur kepada Allah karena aku berbicara dalam bahasa lidah lebih daripada kamu semua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku berbicara dalam bahasa-bahasa lebih daripada kamu semua.” Kata Yunani yang dipakai dapat berarti “bahasa-bahasa”, tetapi dalam konteks ini menunjuk pada fenomena yang dibahas sepanjang 1 Korintus 12–14 dan secara tradisional disebut “bahasa lidah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Aku bersyukur
  rationale: Bentuk kini aktif indikatif orang pertama tunggal. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta menyampaikan tindakan mengucap syukur.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif sebagai pelengkap εὐχαριστῶ dinyatakan secara alami dengan preposisi 'kepada' dalam bahasa Indonesia.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: lebih daripada kamu semua
  rationale: Genitif bersama adverbia komparatif menyatakan perbandingan dengan seluruh jemaat; susunan ini mempertahankan cakupan bentuk jamak tanpa menambahkan penafsiran bahwa setiap orang dibandingkan satu per satu.
- source_word: γλώσσαις
  choice: dalam bahasa lidah
  rationale: Dalam konteks 1 Korintus 12–14, istilah ini menunjuk pada fenomena rohani yang sedang dibahas. 'Bahasa lidah' merupakan istilah Indonesia yang dikenal dan tidak menetapkan apakah fenomena itu selalu berupa bahasa manusia biasa.
- source_word: λαλῶ
  choice: aku berkata-kata
  rationale: Bentuk kini aktif indikatif orang pertama tunggal. 'Berkata-kata' berpadu alami dengan 'dalam bahasa lidah' dan mempertahankan gagasan tindakan berbicara.
theological_decisions:
- issue: Makna γλώσσαις dalam pembahasan karunia rohani
  choice: dalam bahasa lidah
  alternative: dalam berbagai bahasa
  rationale: Pilihan utama mempertahankan istilah khas dalam konteks 1 Korintus 12–14 tanpa memutuskan perdebatan tentang apakah yang dimaksud ialah bahasa manusia, ujaran ekstatik, atau kategori yang lebih luas. Alternatif leksikal dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'aku' mengikuti ujaran pribadi Paulus; istilah 'bahasa lidah' dipertahankan karena dikenal luas sekaligus menjaga ambiguitas istilah Yunani.
