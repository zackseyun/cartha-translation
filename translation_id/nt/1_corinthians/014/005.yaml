  - severity: low
    issue: Pengulangan "aku ingin" tidak diperlukan
    rationale: Klausa kedua dapat langsung memakai "agar kamu bernubuat," sehingga konstruksi Indonesia lebih rapat sambil tetap menyatakan isi keinginan Paulus melalui ἵνα dengan subjungtif.
