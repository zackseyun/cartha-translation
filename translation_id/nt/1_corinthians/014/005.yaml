review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok draft setia kepada teks Yunani: keinginan Paulus mencakup seluruh penerima, nubuat diberi nilai komparatif lebih besar, dan pengecualian penafsiran serta tujuan pembangunan jemaat dipertahankan. Namun, ungkapan "berbicara dalam bahasa lidah" kurang idiomatis dalam bahasa Indonesia baku; istilah yang lebih lazim dalam register Alkitabiah Indonesia ialah "berbahasa lidah."'
  naturalness: Revisi memakai "Aku ingin agar kamu semua berbahasa lidah" dan "agar kamu bernubuat," yang lebih lancar serta mempertahankan relasi antara θέλω dan klausa ἵνα. "Jemaat dibangun" tetap alami dan memadai untuk metafora οἰκοδομή.
  terminology: '"Berbahasa lidah" mempertahankan istilah tradisional tanpa menafsirkan γλώσσαις secara sempit sebagai bahasa manusia tertentu atau "bahasa roh." "Jemaat," "bernubuat," dan "menafsirkannya" sesuai dengan penggunaan modern standar dan konteks pasal ini. Catatan kaki tentang subjek penafsiran tetap diperlukan karena verba tunggal Yunani dapat dipahami merujuk pada pembicara atau, secara kontekstual, penafsiran oleh pihak lain.'
