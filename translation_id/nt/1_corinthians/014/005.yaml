revisions:
- from: Aku ingin kamu semua berbicara dalam bahasa lidah, tetapi terlebih lagi aku ingin kamu bernubuat. Orang yang bernubuat lebih besar daripada orang yang berbicara dalam bahasa lidah, kecuali jika ia menafsirkannya[a], supaya jemaat dibangun[b].
  to: Aku ingin agar kamu semua berbahasa lidah, tetapi terlebih lagi agar kamu bernubuat. Orang yang bernubuat lebih besar daripada orang yang berbahasa lidah, kecuali jika ia menafsirkannya[a], supaya jemaat dibangun[b].
  rationale: Revisi terbatas pada kelancaran idiom dan konsistensi istilah. Teks tetap mempertahankan komparatif "lebih besar," tidak menjadikannya klaim tentang pangkat atau kekudusan, dan mempertahankan ambiguitas terbatas mengenai siapa yang melakukan penafsiran melalui catatan kaki.
