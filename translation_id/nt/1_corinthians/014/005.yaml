id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: id
  text: Aku ingin agar kamu semua berbahasa lidah, tetapi terlebih lagi agar kamu bernubuat. Orang yang bernubuat lebih besar daripada orang yang berbahasa lidah, kecuali jika ia menafsirkannya[a], supaya jemaat dibangun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kecuali jika seseorang menafsirkannya.” Kata kerja tunggal dalam bahasa Yunani dapat merujuk kepada orang yang berbahasa lidah itu sendiri atau, dalam konteks yang lebih luas, kepada adanya seseorang yang memberikan penafsiran.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “supaya jemaat menerima pembangunan.” Maksudnya, supaya jemaat diteguhkan dan dibangun.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Aku ingin
  rationale: Menyampaikan keinginan Paulus secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: πάντας ὑμᾶς
  choice: kamu semua
  rationale: Menjaga bentuk jamak dan cakupan menyeluruh dari sapaan kepada jemaat.
- source_word: λαλεῖν γλώσσαις
  choice: berbicara dalam bahasa lidah
  rationale: Istilah yang lazim dalam konteks 1 Korintus 12–14 dan tetap mempertahankan hubungan leksikal dengan γλῶσσα.
- source_word: μᾶλλον δὲ
  choice: tetapi terlebih lagi
  rationale: Menunjukkan perbandingan keinginan, bukan penolakan terhadap bahasa lidah.
- source_word: ἵνα προφητεύητε
  choice: aku ingin kamu bernubuat
  rationale: Mengungkapkan isi keinginan setelah θέλω secara alami; pengulangan 'aku ingin' memperjelas konstruksi dalam bahasa Indonesia.
- source_word: μείζων
  choice: lebih besar
  rationale: Mempertahankan bentuk komparatif sumber tanpa mengubahnya langsung menjadi penilaian status; konteks pembangunan jemaat memberi arah maknanya.
- source_word: ὁ προφητεύων
  choice: orang yang bernubuat
  rationale: Padanan alami bagi partisip substantival generik.
- source_word: ὁ λαλῶν γλώσσαις
  choice: orang yang berbicara dalam bahasa lidah
  rationale: Menjaga kesejajaran struktur dengan 'orang yang bernubuat'.
- source_word: ἐκτὸς εἰ μὴ
  choice: kecuali jika
  rationale: Padanan idiomatis bagi klausa pengecualian.
- source_word: διερμηνεύῃ
  choice: ia menafsirkannya
  rationale: Subjek tunggal paling langsung merujuk kembali kepada orang yang berbicara dalam bahasa lidah; objek tersirat dibuat eksplisit secara wajar.
- source_word: ἡ ἐκκλησία
  choice: jemaat
  rationale: Dalam konteks ini menunjuk kepada komunitas Kristen yang sedang berkumpul, sehingga 'jemaat' lebih tepat daripada bangunan atau lembaga gereja.
- source_word: οἰκοδομὴν λάβῃ
  choice: dibangun
  rationale: Mengungkapkan metafora pembangunan rohani secara alami dalam bahasa Indonesia dan menghindari istilah abstrak yang kurang umum seperti 'menerima peneguhan'.
theological_decisions:
- issue: Keunggulan relatif nubuat atas bahasa lidah
  choice: Mempertahankan 'lebih besar' dalam teks, dengan tujuan pembangunan jemaat sebagai konteks penilaiannya.
  alternative: Menjadikannya 'lebih penting', atau memahaminya sebagai lebih tinggi dalam pangkat maupun kekudusan.
  rationale: Klausa tujuan menunjukkan manfaat bagi jemaat, tetapi terjemahan tidak boleh menghapus ketegangan komparatif μείζων atau memasukkan hierarki kerohanian yang tidak dinyatakan.
- issue: Subjek διερμηνεύῃ
  choice: 'Merujuk secara langsung kepada orang yang berbicara dalam bahasa lidah: ''ia menafsirkannya''.'
  alternative: Seseorang lain menafsirkan, atau tersedia penafsiran.
  rationale: Bentuk verba tunggal tanpa subjek baru paling alami meneruskan subjek tunggal sebelumnya. Namun, konteks pasal memungkinkan orang lain menjadi penafsir, sehingga kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'Aku' mengikuti tuturan langsung Paulus dan 'kamu semua' mempertahankan sapaan jamak. Istilah 'bahasa lidah' dipakai secara konsisten dengan wacana karunia rohani; 'jemaat dibangun' mempertahankan metafora οἰκοδομή dalam bentuk yang mudah dipahami.
