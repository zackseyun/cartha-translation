  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: id
  text: Jadi, saudara-saudaraku[a], berusahalah sungguh-sungguh untuk bernubuat, dan jangan melarang orang berbicara dalam bahasa-bahasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudaraku”; bentuk Yunani yang maskulin ini dapat dipakai untuk menyapa seluruh jemaat, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Konjungsi ini menarik kesimpulan dari pembahasan sebelumnya; “Jadi” alami dalam bahasa Indonesia dan mempertahankan daya simpulannya.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Bentuk sapaan jamak disertai posesif μου. “Saudara-saudaraku” mempertahankan keakraban sapaan dan, seperti pemakaian Yunani dalam konteks jemaat, dapat mencakup seluruh anggota jemaat.
- source_word: ζηλοῦτε
  choice: berusahalah sungguh-sungguh
  rationale: Imperatif kini aktif menyatakan dorongan untuk terus mengejar dengan kesungguhan. Ungkapan ini jelas dan wajar tanpa mengurangi kekuatan perintah.
- source_word: τὸ προφητεύειν
  choice: untuk bernubuat
  rationale: Infinitif berartikel menjadi sasaran dorongan ζηλοῦτε; bentuk “untuk bernubuat” merupakan padanan Indonesia yang alami.
- source_word: μὴ κωλύετε
  choice: jangan melarang
  rationale: Imperatif kini dengan μή menyampaikan larangan langsung; “jangan melarang” tepat untuk kewenangan atau pembatasan dalam pertemuan jemaat.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: orang berbicara dalam bahasa-bahasa lidah
  rationale: Infinitif berartikel menyebut praktik yang sedang dibahas. Penambahan tersirat “orang” membuat konstruksi larangan alami dalam bahasa Indonesia, sedangkan “bahasa-bahasa lidah” mempertahankan istilah khas dan bentuk jamak γλώσσαις.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί dalam jemaat yang mencakup laki-laki dan perempuan
  choice: saudara-saudaraku
  alternative: saudara-saudara laki-lakiku; saudara-saudaraku laki-laki dan perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam konteks surat kepada seluruh jemaat dapat berfungsi secara inklusif. Padanan “saudara-saudaraku” alami, tidak meniadakan bentuk sumber, dan catatan kaki menjelaskan cakupannya.
- issue: Makna γλώσσαις dalam pembahasan karunia jemaat
  choice: bahasa-bahasa lidah
  alternative: bahasa-bahasa; lidah-lidah
  rationale: Istilah sumber dapat berarti lidah atau bahasa dan di sini menunjuk pada praktik karismatik yang dibahas sepanjang pasal. Padanan ini mempertahankan istilah teologis yang dikenal tanpa menetapkan apakah bahasa tersebut merupakan bahasa manusia biasa atau ujaran jenis lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat mempertahankan keseimbangan antara dorongan positif untuk bernubuat dan larangan membatasi bahasa-bahasa lidah.
