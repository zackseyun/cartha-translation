  naturalness: “Jadi, saudara-saudaraku” dan “berusahalah sungguh-sungguh untuk bernubuat” jelas serta sesuai register modern yang bermartabat. Mengganti “bahasa-bahasa lidah” dengan “bahasa-bahasa” menghasilkan ungkapan yang lebih alami sambil mempertahankan bentuk jamak dan ambiguitas leksikal sumber.
  terminology: “Bernubuat” tepat untuk προφητεύειν. Untuk γλώσσαις, “bahasa-bahasa” tidak menambahkan “roh” yang tidak terdapat dalam ayat ini dan tidak memutuskan apakah yang dimaksud bahasa manusia atau ujaran lain; konteks pasal tetap tersedia bagi pembaca.
