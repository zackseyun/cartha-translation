  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: id
  text: Namun, jika sesuatu dinyatakan kepada orang lain yang sedang duduk[a], pembicara pertama harus berhenti berbicara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jika suatu penyataan diberikan kepada orang lain yang sedang duduk.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, pembicara pertama harus berhenti agar orang lain itu dapat berbicara.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Namun, jika
  rationale: ἐὰν memperkenalkan syarat, sedangkan δὲ menandai peralihan atau pertentangan ringan dalam rangkaian petunjuk.
- source_word: ἄλλῳ
  choice: kepada orang lain
  rationale: Bentuk datif ἄλλος menunjuk pada peserta lain, berbeda dari orang yang sedang berbicara.
- source_word: ἀποκαλυφθῇ
  choice: sesuatu dinyatakan
  rationale: Bentuk pasif mempertahankan tindakan penyingkapan tanpa menyebutkan pelakunya; subjek tak tersurat diterjemahkan secara wajar sebagai 'sesuatu'.
- source_word: καθημένῳ
  choice: yang sedang duduk
  rationale: Partisipel ini menerangkan 'orang lain' dan mempertahankan gambaran konkret peserta yang duduk dalam pertemuan.
- source_word: ὁ πρῶτος
  choice: orang yang pertama
  rationale: Terjemahan ini mempertahankan ungkapan harfiah; dalam konteks, yang dimaksud ialah pembicara pertama.
- source_word: σιγάτω
  choice: harus berhenti berbicara
  rationale: Imperatif orang ketiga menuntut pembicara pertama menghentikan ucapannya dan memberi kesempatan kepada yang lain; ungkapan ini lebih alami daripada 'harus diam' dalam konteks pergantian pembicara.
theological_decisions:
- issue: Sifat penyingkapan dalam nubuat jemaat
  choice: Menerjemahkan bentuk pasif sebagai 'sesuatu dinyatakan' tanpa menyebut Allah sebagai pelaku secara eksplisit.
  alternative: '''suatu penyataan diberikan'' atau ''orang lain menerima penyataan dari Allah'''
  rationale: Konteks mengisyaratkan penyingkapan ilahi, tetapi ayat ini tidak menyebutkan pelakunya. Terjemahan mempertahankan bentuk pasif dan tidak menambahkan pernyataan teologis yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang lugas dan bermartabat. 'Berhenti berbicara' dipilih agar makna kontekstual σιγάτω jelas, sedangkan alternatif nominal 'suatu penyataan' dipertahankan dalam catatan kaki.
