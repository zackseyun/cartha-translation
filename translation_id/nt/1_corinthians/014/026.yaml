id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: id
  text: Jadi, apakah kesimpulannya, Saudara-saudara[a]? Ketika kalian berkumpul, masing-masing membawa mazmur, pengajaran, penyataan, suatu bahasa[b], atau penafsiran. Hendaklah semuanya dilakukan untuk membangun jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Saudara-saudara" di sini merupakan sapaan kepada seluruh jemaat, termasuk perempuan maupun laki-laki.'
    reason: lexical_alternative
  - marker: b
    text: Atau "lidah". Kata Yunani yang dipakai dapat berarti lidah atau bahasa; dalam pembahasan ini Paulus tidak menjelaskan secara lebih spesifik sifat ujaran tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Jadi, bagaimana
  rationale: Mengungkapkan pertanyaan retoris yang mengantar kesimpulan praktis Paulus secara alami dalam bahasa Indonesia tanpa menghilangkan fungsinya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku dan bermartabat dalam bahasa Indonesia; dalam konteks ini ditujukan secara representatif kepada seluruh jemaat, baik laki-laki maupun perempuan.
- source_word: ὅταν συνέρχησθε
  choice: Ketika kalian berkumpul
  rationale: Menyampaikan peristiwa berkumpulnya jemaat dengan bahasa modern dan jelas; bentuk Yunani menunjuk pada keadaan yang berulang atau lazim.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Mempertahankan daya distributifnya dan menunjukkan bahwa anggota-anggota jemaat memberikan sumbangsih yang berbeda.
- source_word: ψαλμὸν
  choice: mazmur
  rationale: Mempertahankan istilah khusus Yunani dan tidak memperluasnya menjadi sekadar nyanyian.
- source_word: διδαχὴν
  choice: pengajaran
  rationale: Wajar dalam konteks pertemuan jemaat dan tidak membawa kesan sistem teologi formal seperti istilah 'doktrin'.
- source_word: ἀποκάλυψιν
  choice: penyataan
  rationale: Menggambarkan sesuatu yang disingkapkan atau dinyatakan dalam pertemuan tanpa menambahkan sumber atau bentuk yang tidak disebutkan teks.
- source_word: γλῶσσαν
  choice: bahasa lidah
  rationale: Mempertahankan istilah khas pembahasan 1 Korintus 12–14 dan tidak memastikan apakah yang dimaksud ialah bahasa manusia tertentu atau bentuk ujaran lainnya.
- source_word: ἑρμηνείαν
  choice: penafsiran
  rationale: Sesuai dengan konteks penafsiran bahasa lidah agar dapat dipahami oleh jemaat, tanpa mempersempit artinya menjadi terjemahan bahasa biasa.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Hendaklah semuanya dilakukan untuk membangun jemaat
  rationale: Menyampaikan daya imperatif γινέσθω, cakupan πάντα, dan metafora οἰκοδομή secara jelas; 'jemaat' menyatakan objek komunal yang tersirat oleh konteks.
theological_decisions:
- issue: Sapaan maskulin representatif kepada jemaat
  choice: Saudara-saudara dalam teks utama, dengan catatan bahwa sapaan itu mencakup perempuan dan laki-laki
  alternative: Saudara-saudari
  rationale: Bentuk sapaan sumber dipertahankan secara wajar, sedangkan cakupan seluruh jemaat dijelaskan agar pembaca tidak salah memahami sapaan itu sebagai khusus laki-laki.
- issue: Makna γλῶσσα dalam pasal ini
  choice: bahasa lidah
  alternative: suatu bahasa; bahasa lain
  rationale: Pilihan ini mempertahankan istilah khas Paulus sertalk_languages 12–14 serta ketegangan maknanya, tanpa memutuskan bahwa ujaran tersebut pasti merupakan bahasa manusia yang dikenal atau ujaran ekstatis.
- issue: Objek metafora pembangunan
  choice: membangun jemaat
  alternative: untuk pembangunan; untuk saling membangun
  rationale: Konteks menunjukkan pembangunan bersama dalam jemaat. Pilihan ini membuat ungkapan alami dalam bahasa Indonesia tanpa menambahkan gagasan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada jemaat yang bermartabat dan mudah dipahami. Pengulangan 'mempunyai' sengaja dipertahankan untuk mencerminkan susunan retoris Yunani. Kata ganti 'kalian' dipakai agar bentuk jamak orang kedua tampak jelas.
