  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: id
  text: Saudara-saudara[a], janganlah menjadi anak-anak dalam cara berpikir, tetapi dalam hal kejahatan jadilah bayi[b], sedangkan dalam cara berpikir jadilah dewasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudara laki-laki dan perempuan”; kata Yunani yang secara harfiah berarti “saudara-saudara laki-laki” dipakai sebagai sapaan kepada jemaat.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam niat jahat”; kata Yunani untuk “kejahatan” juga dapat berarti “keburukan” atau “niat jahat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan vokatif jamak ini secara bentuk maskulin, tetapi dalam konteks jemaat dapat mencakup seluruh anggota. Padanan ini mempertahankan bentuk sumber dan tetap wajar sebagai sapaan jemaat dalam bahasa Indonesia.
- source_word: παιδία
  choice: anak-anak
  rationale: Kata ini menunjuk kepada anak-anak secara umum dan mempertahankan kontras dengan bayi serta orang dewasa tanpa mempersempit kelompok usia.
- source_word: γίνεσθε
  choice: menjadi / jadilah
  rationale: Bentuk imperatif γίνομαι menyatakan proses atau keadaan menjadi. Variasi sesuai tata bahasa Indonesia mempertahankan daya perintah pada kedua kemunculannya.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: dalam cara berpikir
  rationale: φρήν di sini mengacu pada kemampuan memahami atau pola pikir. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan datif dalam arti 'berkenaan dengan'.
- source_word: τῇ κακίᾳ
  choice: dalam hal kejahatan
  rationale: κακία dapat berarti kejahatan, keburukan, atau niat jahat. 'Kejahatan' mempertahankan cakupan etis yang luas, sedangkan 'dalam hal' menjelaskan hubungan yang dinyatakan oleh datif.
- source_word: νηπιάζετε
  choice: jadilah seperti bayi
  rationale: Verba ini berarti menjadi atau berlaku sebagai bayi. Penambahan 'seperti' menghasilkan ungkapan Indonesia yang alami tanpa mengubah daya metaforisnya.
- source_word: τέλειοι
  choice: dewasa
  rationale: Dalam konteks ini τέλειος menunjuk kepada kematangan atau kedewasaan, bukan kesempurnaan tanpa dosa.
- source_word: ἀλλὰ ... δὲ
  choice: Namun ... sedangkan
  rationale: 'Pasangan penghubung ini menandai dua kontras: kejahatan dibandingkan dengan cara berpikir, serta bayi dibandingkan dengan dewasa. Padanan tersebut menjaga gerak retoris ayat.'
theological_decisions:
- issue: Sapaan jemaat yang berbentuk maskulin
  choice: Memakai 'Saudara-saudara' dalam teks utama dan menjelaskan cakupan kontekstualnya dalam catatan kaki.
  alternative: Saudara-saudara laki-laki dan perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi sapaan ini kemungkinan ditujukan kepada seluruh jemaat. Terjemahan utama mempertahankan bentuk sumber tanpa meniadakan daya inklusif konteksnya.
- issue: Arti τέλειοι dalam nasihat Paulus
  choice: dewasa
  alternative: sempurna
  rationale: Kontras langsung dengan anak-anak dan bayi menunjukkan kematangan dalam berpikir, bukan pernyataan tentang kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nasihat pastoral. Paralel antara cara berpikir, kejahatan, bayi, dan kedewasaan dipertahankan, dengan tanda baca yang membuat susunan retorisnya mudah dipahami.
