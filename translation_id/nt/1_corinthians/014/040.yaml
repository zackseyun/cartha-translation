  text: But let everything be done decently and in order[a].
translation:
  language: id
  text: Namun, hendaklah segala sesuatu dilakukan dengan layak[a] dan teratur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “secara patut”; kata Yunani ini menunjuk pada apa yang patut atau sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral ini mencakup seluruh kegiatan yang sedang dibahas; 'segala sesuatu' alami dan mempertahankan cakupannya yang luas.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan sekaligus kontras ringan menuju arahan penutup. 'Namun' sesuai dengan fungsi wacananya tanpa memberi pertentangan yang terlalu kuat.
- source_word: εὐσχημόνως
  choice: dengan pantas
  rationale: Kata ini menunjuk pada cara yang patut, layak, atau sesuai. 'Dengan pantas' jelas dalam bahasa Indonesia modern dan tidak membatasi maknanya hanya pada kesopanan.
- source_word: κατὰ τάξιν
  choice: teratur
  rationale: Frasa ini menyatakan kesesuaian dengan susunan atau urutan yang semestinya. 'Teratur' menyampaikan makna itu secara ringkas dan alami.
- source_word: γινέσθω
  choice: hendaklah ... berlangsung
  rationale: Imperatif orang ketiga ini memberi arahan umum agar segala kegiatan terjadi atau terlaksana dengan cara tertentu. 'Hendaklah ... berlangsung' mempertahankan daya perintah dan cocok dengan konteks pertemuan jemaat.
theological_decisions:
- issue: Cakupan perintah Paulus dalam konteks ibadah jemaat
  choice: Arahan umum agar segala kegiatan dalam pertemuan jemaat berlangsung secara pantas dan teratur, tanpa menetapkan model tata ibadah denominasi tertentu.
  alternative: Peraturan sempit yang mewajibkan satu susunan ibadah formal tertentu, atau prinsip universal yang secara langsung mencakup seluruh praktik gereja di luar konteks ini.
  rationale: Ayat ini merangkum pembahasan terdekat tentang penggunaan karunia dan perkataan dalam pertemuan jemaat. Terjemahan mempertahankan keluasan ungkapan Yunani tanpa memasukkan struktur gerejawi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan bentuk arahan umum serta keseimbangan antara 'dengan pantas' dan 'teratur'.
