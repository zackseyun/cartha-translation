  to: Namun, jika mereka ingin mengetahui sesuatu, hendaklah mereka bertanya kepada suami mereka sendiri di rumah, sebab memalukan bagi seorang perempuan[a] untuk berbicara dalam pertemuan jemaat[b].
  rationale: Revisi terbatas pada dua ungkapan. “Mengetahui” lebih sesuai dengan konteks pertanyaan bagi μαθεῖν, dan “pertemuan jemaat” menjelaskan bahwa ἐκκλησία adalah perhimpunan yang sedang berkumpul. Tidak ada pembatasan penafsiran yang ditambahkan pada cakupan “berbicara,” dan ambiguitas perempuan/istri tetap dipertahankan melalui catatan kaki.
