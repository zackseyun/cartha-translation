id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: id
  text: Namun, jika mereka ingin mengetahui sesuatu, hendaklah mereka bertanya kepada suami mereka sendiri di rumah, sebab memalukan bagi seorang perempuan[a] untuk berbicara dalam pertemuan jemaat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang istri”. Kata Yunani yang dipakai dapat berarti “perempuan” atau “istri”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam jemaat” atau “dalam perhimpunan”; kata Yunani ini merujuk kepada umat yang sedang berhimpun.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: mempelajari
  rationale: Infinitif ini menyatakan belajar atau memperoleh pengetahuan. 'Mempelajari sesuatu' alami dalam konteks keinginan untuk mengetahui sesuatu.
- source_word: ἐν οἴκῳ
  choice: di rumah
  rationale: Ungkapan idiomatis ini mempertahankan kontras antara lingkungan rumah tangga dan pertemuan jemaat.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: suami mereka sendiri
  rationale: Dalam konstruksi dengan ἰδίους dan konteks rumah tangga, ἄνδρας paling wajar dipahami dalam arti 'suami'.
- source_word: ἐπερωτάτωσαν
  choice: hendaklah mereka bertanya
  rationale: Bentuk imperatif kini dipertahankan dengan ungkapan Indonesia yang jelas dan bermartabat tanpa menambah jenis pertanyaannya.
- source_word: αἰσχρὸν
  choice: memalukan
  rationale: Pilihan ini mempertahankan daya moral-sosial kata Yunani dan terdengar alami dalam bahasa Indonesia modern.
- source_word: γυναικὶ
  choice: bagi seorang perempuan
  rationale: γυνή dapat berarti 'perempuan' atau 'istri'. Bentuk umum 'seorang perempuan' dipakai dalam teks utama, sementara kemungkinan 'istri' dicatat dalam catatan kaki.
- source_word: λαλεῖν
  choice: untuk berbicara
  rationale: '''Berbicara'' cukup luas untuk merepresentasikan λαλεῖν tanpa membatasi ucapan itu sebagai bertanya, mengganggu, atau menilai nubuat.'
- source_word: ἐν ἐκκλησίᾳ
  choice: dalam jemaat
  rationale: Di sini ἐκκλησία menunjuk pada perhimpunan umat. 'Dalam jemaat' alami dalam bahasa Indonesia dan tidak mengalihkannya menjadi sebuah gedung.
theological_decisions:
- issue: Cakupan larangan mengenai perempuan berbicara
  choice: Klausa diterjemahkan sebagaimana tertulis tanpa membatasi 'berbicara' pada jenis ucapan tertentu.
  alternative: Menafsirkannya khusus sebagai pertanyaan yang mengganggu, penilaian atas nubuat, atau kutipan pendapat jemaat Korintus.
  rationale: Teks Yunani pada ayat ini tidak menyebutkan secara eksplisit jenis ucapan yang dimaksud. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan kesimpulan eksegetis ke dalam teks.
- issue: Arti relasional γυνή dan ἀνήρ
  choice: ἄνδρας diterjemahkan 'suami', sedangkan γυναικὶ diterjemahkan 'perempuan' dengan alternatif 'istri' dalam catatan kaki.
  alternative: Menggunakan pasangan 'istri—suami' sepenuhnya atau 'perempuan—laki-laki' sepenuhnya.
  rationale: Frasa 'mereka sendiri' dan latar rumah tangga sangat mendukung arti 'suami' bagi ἄνδρας, tetapi γυναικὶ tunggal dalam klausa berikut tetap dapat dipahami secara umum sebagai 'perempuan' atau secara kontekstual sebagai 'istri'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Namun' menyampaikan δέ secara alami; 'hendaklah' mempertahankan daya imperatif. Istilah 'jemaat' dipakai bagi umat yang berhimpun, bukan gedung.
