revisions:
- from: Sebab orang yang berbicara dalam bahasa lidah tidak berbicara kepada manusia, melainkan kepada Allah, karena tidak seorang pun memahami perkataannya[a]. Sebaliknya, dalam Roh[b] ia mengucapkan berbagai rahasia.
  to: Sebab, orang yang berbicara dalam bahasa lidah tidak berbicara kepada manusia, melainkan kepada Allah, karena tidak seorang pun memahaminya[a]; tetapi dalam Roh[b] ia mengucapkan rahasia-rahasia.
  rationale: Revisi menghapus penambahan makna “berbagai,” menghindari posesif yang tidak ada dalam sumber, dan melunakkan penghubung agar lebih sesuai dengan δέ. Catatan kaki dipertahankan karena dengan tepat menjaga alternatif leksikal ἀκούει dan ambiguitas rujukan πνεύματι.
