    issue: “Berbagai rahasia” menambahkan unsur distributif.
    rationale: μυστήρια berbentuk jamak (“rahasia-rahasia/misteri-misteri”), tetapi tidak mengandung kata yang setara dengan “berbagai.” Penambahan itu tidak diperlukan dan sedikit memperluas pernyataan.
  - severity: low
    issue: “Memahami perkataannya” menambahkan posesif dan nomina yang tidak eksplisit.
    rationale: Objek ἀκούει tersirat dari konteks. “Memahaminya” menyampaikan maksud kontekstual tanpa menambahkan “perkataannya.”
  - severity: low
    issue: “Sebaliknya” terlalu tegas untuk δέ.
    rationale: δὲ terutama menandai kelanjutan yang berkontras; “tetapi” menyampaikan kontras tersebut dengan lebih netral.
