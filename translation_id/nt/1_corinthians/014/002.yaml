review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: subjek generik, kontras manusia/Allah, pengertian implisit dari ἀκούει, serta pengucapan μυστήρια dalam πνεύματι. Namun, “berbagai” tidak ada padanan eksplisitnya dalam μυστήρια dan sebaiknya dihapus. “Memahami perkataannya” juga menambahkan objek posesif yang tidak dinyatakan, walaupun maksudnya dapat dipahami dari konteks.'
  naturalness: Kalimatnya pada dasarnya baku dan jelas. “Berbicara dalam bahasa lidah” dapat dipahami sebagai istilah teknis dalam konteks pasal ini. “Tidak seorang pun memahaminya” lebih ringkas dan alami daripada “tidak seorang pun memahami perkataannya.” Partikel “tetapi” lebih proporsional untuk δέ daripada “Sebaliknya,” yang dapat terdengar terlalu kuat.
  terminology: “Allah,” “Roh,” dan “rahasia-rahasia” mempertahankan register Alkitab dan bobot istilah sumber. Kapitalisasi “Roh” memang memilih pembacaan Roh Kudus dalam teks utama, tetapi catatan kaki secara memadai mencatat pembacaan alternatif “roh” pembicara. Istilah “bahasa lidah” dipertahankan untuk membedakannya dari πνεύματι dan untuk tidak lebih jauh menafsirkan γλώσσῃ sebagai bahasa asing tertentu.
  issues:
