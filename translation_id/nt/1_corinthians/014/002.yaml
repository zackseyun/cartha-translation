source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: id
  text: Sebab, orang yang berbicara dalam bahasa lidah tidak berbicara kepada manusia, melainkan kepada Allah, karena tidak seorang pun memahaminya[a]; tetapi dalam Roh[b] ia mengucapkan rahasia-rahasia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak seorang pun mendengarnya.” Kata Yunani yang dipakai dapat berarti “mendengar” atau, sesuai konteks, “memahami.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam roh.” Ungkapan Yunani ini dapat merujuk kepada Roh Kudus atau kepada roh orang yang berbicara.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: orang yang berbicara
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang sedang berbicara, tanpa menentukan gender.
- source_word: γλώσσῃ
  choice: dalam bahasa lidah
  rationale: Bentuk datif tunggal merujuk pada tuturan lidah dalam konteks pasal ini. Istilah ini mempertahankan fenomena yang dimaksud tanpa menafsirkannya secara sempit sebagai bahasa asing tertentu.
- source_word: ἀνθρώποις
  choice: kepada manusia
  rationale: Bentuk jamak ini bersifat umum dan mencakup manusia tanpa pembedaan gender.
- source_word: θεῷ
  choice: kepada Allah
  rationale: Datif menjadi objek tak langsung dari kata kerja 'berbicara' dan dapat diterjemahkan secara langsung.
- source_word: ἀκούει
  choice: memahami perkataannya
  rationale: Secara leksikal kata ini dapat berarti 'mendengar', tetapi dalam konteks pembicaraan yang tidak dimengerti, makna tersiratnya ialah memahami apa yang diucapkan. Alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: δὲ
  choice: Sebaliknya
  rationale: Partikel ini menandai kontras dengan pernyataan sebelumnya; 'sebaliknya' menyampaikan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: πνεύματι
  choice: dalam Roh
  rationale: Datif Yunani dapat dipahami sebagai lingkup atau sarana. Terjemahan ini memungkinkan rujukan kepada Roh Kudus, sementara kemungkinan bahwa yang dimaksud ialah roh pembicara dipertahankan dalam catatan kaki.
- source_word: μυστήρια
  choice: berbagai rahasia
  rationale: Bentuk jamak menunjuk pada perkara-perkara tersembunyi atau rahasia. 'Berbagai rahasia' alami dalam bahasa Indonesia dan tidak menjelaskannya secara berlebihan.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: dalam Roh
  alternative: dalam roh, yaitu dalam roh orang yang berbicara; atau oleh Roh
  rationale: Bentuk Yunani tidak memastikan apakah yang dimaksud ialah Roh Kudus, roh pembicara, atau Roh sebagai sarana. Teks utama memakai pembacaan yang wajar dalam konteks Paulus, sedangkan kemungkinan lain dinyatakan dalam catatan kaki agar ketegangan teologis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. Istilah 'bahasa lidah' mempertahankan istilah khas konteks tanpa menyamakannya secara pasti dengan bahasa manusia tertentu. Semua alternatif yang penting secara leksikal dan teologis disajikan dalam catatan kaki.
