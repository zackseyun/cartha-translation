revisions:
- from: Namun, jika semua orang bernubuat dan masuklah seorang yang tidak percaya atau yang tidak memahami[a], ia ditegur oleh semua orang dan dinilai oleh semua orang.
  to: Namun, jika semua orang bernubuat, lalu masuk seorang yang tidak percaya atau orang yang belum mengerti, ia ditegur oleh semua orang dan diperiksa oleh semua orang.
  rationale: Revisi memperbaiki kelancaran sintaksis Indonesia dan memperjelas pasangan verba Yunani tanpa mengubah cakupan «semua orang» atau memutuskan secara berlebihan identitas ἰδιώτης. Catatan kaki mempertahankan alternatif yang sah, “orang luar.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:08:00Z'
review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan struktur kondisional, pengulangan ὑπὸ πάντων, serta pembedaan antara ἄπιστος dan ἰδιώτης. Namun, «masuklah seorang» tidak tepat dalam konstruksi modern setelah «jika», dan «ditegur ... dinilai» kurang menangkap daya berurutan ἐλέγχεται dan ἀνακρίνεται. Revisi memakai padanan yang lebih jelas tanpa menjadikan ἀνακρίνεται sebagai vonis akhir.
  naturalness: «Namun, jika semua orang bernubuat dan masuklah seorang ...» terdengar tidak lazim; partikel -lah pada verba ini tidak sesuai dengan kalimat bersyarat tersebut. «lalu masuk seorang ...» adalah susunan baku dan alami. «Orang yang belum mengerti» lebih idiomatis dan lebih jelas daripada nominalisasi «yang tidak memahami».
  terminology: «Bernubuat» tepat dan konsisten dengan istilah Paulus dalam pasal ini. «Orang yang tidak percaya» tetap mempertahankan ἄπιστος. Untuk ἰδιώτης, «orang yang belum mengerti» menyatakan kurangnya pemahaman atau keterlibatan yang relevan tanpa memastikan status orang itu sebagai pihak luar. «Ditegur» dapat dipertahankan untuk ἐλέγχεται; «diperiksa» lebih dekat dengan ἀνακρίνεται daripada «dinilai».
  issues:
  - severity: medium
    issue: Susunan «dan masuklah seorang» tidak alami dalam kalimat bersyarat.
    rationale: εἰσέλθῃ δέ τις berarti bahwa seseorang masuk dalam skenario bersyarat. Bahasa Indonesia modern lebih tepat memakai «lalu masuk seorang» (atau «dan seorang ... masuk»), bukan imperatif/penegas -lah pada verba ini.
  - severity: medium
    issue: «Dinilai» terlalu umum untuk ἀνακρίνεται.
    rationale: ἀνακρίνεται mengandung gagasan diperiksa atau diselidiki secara saksama. «Diperiksa» menjaga pembedaan dari ἐλέγχεται dan tidak menambahkan pengertian vonis final.
  - severity: low
    issue: «yang tidak memahami» kurang jelas sebagai padanan ἰδιώτης.
    rationale: Frasa itu tidak menyebut apa yang tidak dipahami dan terasa eliptis. «Orang yang belum mengerti» tetap cukup terbuka mengenai hal yang belum dipahami, sesuai konteks, dan lebih alami.
  revised_text: Namun, jika semua orang bernubuat, lalu masuk seorang yang tidak percaya atau orang yang belum mengerti, ia ditegur oleh semua orang dan diperiksa oleh semua orang.
  revised_footnotes:
  - marker: a
    text: Atau “orang luar.” Istilah Yunani ini dapat menunjuk kepada orang yang belum mengerti, belum mengenal praktik yang berlangsung, atau bukan bagian dari kelompok yang sedang berbicara.
    reason: alternative_reading
  revision_rationale: Revisi memperbaiki kelancaran sintaksis Indonesia dan memperjelas pasangan verba Yunani tanpa mengubah cakupan «semua orang» atau memutuskan secara berlebihan identitas ἰδιώτης. Catatan kaki mempertahankan alternatif yang sah, “orang luar.”
