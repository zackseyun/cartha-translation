id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: id
  text: Namun, jika semua orang bernubuat, lalu masuk seorang yang tidak percaya atau orang yang belum mengerti, ia ditegur oleh semua orang dan diperiksa oleh semua orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: semua orang
  rationale: Mempertahankan cakupan menyeluruh yang menunjuk kepada para pembicara dalam pertemuan jemaat.
- source_word: προφητεύωσιν
  choice: bernubuat
  rationale: Mempertahankan istilah khas Paulus dalam pasal ini serta kaitannya dengan pembahasan mengenai nubuat dan bahasa lidah.
- source_word: ἄπιστος
  choice: seorang yang tidak percaya
  rationale: Dalam konteks ini menunjuk kepada orang yang belum percaya, bukan sekadar orang yang tidak setia.
- source_word: ἰδιώτης
  choice: yang tidak memahami
  rationale: Menggambarkan orang yang tidak memiliki pemahaman atau pengenalan yang diperlukan terhadap perkataan dan praktik dalam pertemuan itu, tanpa memastikan bahwa ia sama sekali berada di luar komunitas.
- source_word: ἐλέγχεται
  choice: ditegur
  rationale: Menyampaikan bahwa perkataan yang didengar menyingkapkan kesalahan dan membawa orang itu kepada kesadaran, tanpa menambahkan gagasan penghukuman final.
- source_word: ἀνακρίνεται
  choice: dinilai
  rationale: Mencerminkan pemeriksaan atau penilaian yang menyelidik; pilihan ini lebih wajar dalam bahasa Indonesia daripada ungkapan pemeriksaan formal.
- source_word: ὑπὸ πάντων
  choice: oleh semua orang
  rationale: Pengulangan frasa ini dipertahankan untuk mengikuti tekanan retoris teks Yunani.
- source_word: δέ
  choice: Namun / dan
  rationale: δέ pertama menandai kontras dengan keadaan sebelumnya, sedangkan δέ kedua diungkapkan dengan penghubung yang alami dalam kalimat bersyarat.
- source_word: τις
  choice: seorang
  rationale: Menyatakan seseorang yang tidak ditentukan identitasnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἰδιώτης dalam konteks pertemuan jemaat
  choice: yang tidak memahami
  alternative: orang luar
  rationale: Konteks terdekat menekankan dapat atau tidaknya perkataan jemaat dipahami. Terjemahan ini menjaga fokus tersebut tanpa memutuskan bahwa orang itu pasti bukan bagian dari komunitas. Kemungkinan arti “orang luar” dicatat dalam catatan kaki.
- issue: Daya makna ἐλέγχεται dan ἀνακρίνεται
  choice: ditegur ... dinilai
  alternative: dinyatakan bersalah ... diperiksa
  rationale: Pasangan ini mempertahankan perkembangan dari penyingkapan kesalahan menuju penilaian yang menyelidik, tetapi tidak mengubah ayat ini menjadi pernyataan tentang vonis pengadilan atau penghukuman terakhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan pasif serta pengulangan “oleh semua orang” dipertahankan untuk mencerminkan bentuk dan penekanan teks Yunani.
