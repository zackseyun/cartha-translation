  source_fidelity: Teks Indonesia dengan tepat menerjemahkan εἰ δέ τις ἀγνοεῖ, ἀγνοεῖται sebagai suatu syarat adversatif dan mempertahankan bentuk aktif–pasif serta permainan retoris verba yang sama. “Tidak mengakui ... tidak diakui” sesuai dengan konteks ayat 37 tanpa menentukan siapa agen pasifnya.
  naturalness: “Namun, jika seseorang tidak mengakui hal ini, ia tidak diakui” adalah bahasa Indonesia baku modern, ringkas, dan bernada sesuai untuk surat apostolik. Pengulangan “diakui” terasa disengaja dan efektif, bukan canggung.
  terminology: “Mengakui” secara kontekstual tepat untuk ἀγνοεῖ, yakni tidak menerima atau mengakui otoritas petunjuk sebelumnya. “Tidak diakui” secara hati-hati mempertahankan ambiguitas pasif ἀγνοεῖται. Catatan varian dan alternatif leksikal relevan; jangkar [b][a] ditempatkan secara konsisten pada klausa yang terpengaruh.
