id: 1CO.14.38
reference: 1 Corinthians 14:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγνοεῖ, ⸀ἀγνοεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: id
  text: Namun, jika seseorang tidak mengakui hal ini[b][a], ia tidak diakui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “jika seseorang tidak tahu, biarlah ia tetap tidak tahu.” Teks yang dipakai di sini berbunyi, “jika seseorang tidak mengakui hal ini, ia tidak diakui.”
    reason: textual_variant
  - marker: b
    text: Atau “tidak mengenali ... tidak dikenali.” Dalam bahasa Yunani, kata kerja yang sama dipakai dalam bentuk aktif dan pasif untuk menghasilkan efek retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: jika
  rationale: Partikel syarat yang secara wajar diterjemahkan sebagai “jika” tanpa menambahkan penilaian tentang benar tidaknya kondisi tersebut.
- source_word: δέ
  choice: namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya; “namun” memberi peralihan adversatif yang alami dan bermartabat.
- source_word: τις
  choice: seseorang
  rationale: Pronomina tak tentu tunggal yang merujuk secara umum kepada siapa pun.
- source_word: ἀγνοεῖ
  choice: tidak mengakui
  rationale: Dalam konteks ayat 37, verba ini menunjuk pada kegagalan atau penolakan untuk mengakui perkataan Paulus sebagai perintah Tuhan. Pilihan ini juga memungkinkan kesejajaran dengan bentuk pasif berikutnya.
- source_word: ἀγνοεῖται
  choice: tidak diakui
  rationale: Bentuk pasif indikatif dipertahankan dan permainan retoris antara verba aktif dan pasif tercermin secara langsung, tanpa menentukan secara eksplisit siapa yang tidak mengakuinya.
theological_decisions:
- issue: Makna bentuk pasif ἀγνοεῖται
  choice: orang yang tidak mengakui petunjuk apostolik itu sendiri tidak diakui
  alternative: “ia tidak dikenal”; menurut varian naskah, “biarlah ia tetap tidak tahu”
  rationale: Teks SBLGNT memakai bentuk pasif indikatif, bukan imperatif. Terjemahan “tidak diakui” mempertahankan hubungan timbal balik atau bernuansa penghakiman dalam ungkapan itu tanpa mempersempit pelakunya kepada jemaat atau Allah saja.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan “tidak mengakui ... tidak diakui” mempertahankan kesejajaran verbal Yunani. Penanda catatan ditempatkan sesudah klausa yang dipengaruhinya, sesuai urutan yang diberikan.
