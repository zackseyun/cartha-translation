  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: id
  text: Demikian juga benda-benda mati yang menghasilkan bunyi—entah seruling atau kecapi[a]—jika nada-nadanya tidak dibedakan, bagaimana melodi yang dimainkan dengan seruling atau kecapi itu akan dikenali?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani κιθάρα menunjuk pada alat musik petik kuno, sejenis lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Demikian juga
  rationale: Dalam konteks ini kata tersebut memperkenalkan perbandingan lanjutan antara ujaran manusia dan alat musik; 'Demikian juga' mengalir alami dalam bahasa Indonesia.
- source_word: τὰ ἄψυχα
  choice: benda-benda mati
  rationale: Ungkapan ini menunjuk kepada benda yang tidak bernyawa, khususnya alat musik dalam ayat ini.
- source_word: φωνὴν διδόντα
  choice: yang menghasilkan bunyi
  rationale: Menyampaikan arti harfiah 'memberikan bunyi' dengan ungkapan Indonesia yang alami.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: entah seruling atau kecapi
  rationale: αὐλός adalah alat musik tiup, sedangkan κιθάρα adalah alat musik petik kuno; 'seruling' dan 'kecapi' mudah dipahami, sementara ketepatan historis κιθάρα dijelaskan dalam catatan kaki.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: jika nada-nadanya tidak dibedakan
  rationale: διαστολή menyatakan pembedaan, dan φθόγγοι menunjuk pada bunyi atau nada; bentuk pasif ini alami dan jelas dalam bahasa Indonesia.
- source_word: πῶς γνωσθήσεται
  choice: bagaimana orang dapat mengenali
  rationale: Pasif Yunani bermakna 'bagaimana akan dikenali'; konstruksi aktif tak tentu dengan 'orang' lebih alami dalam bahasa Indonesia tanpa menentukan pelaku tertentu.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: lagu yang dimainkan dengan seruling atau kecapi itu
  rationale: Partisip berartikel menunjuk pada apa yang dimainkan. 'Lagu' membuat acuan tersirat itu jelas dalam konteks musik tanpa mengubah pokok perbandingannya.
