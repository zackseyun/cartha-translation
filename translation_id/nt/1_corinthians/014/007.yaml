  source_fidelity: 'Makna pokok terwakili dengan baik: benda tak bernyawa, contoh seruling dan kecapi, perlunya perbedaan nada, dan pengenalan musik yang dimainkan. Namun, "orang dapat mengenali" menggeser bentuk futurum pasif γνωσθήσεται menjadi kemampuan umum, sedangkan "lagu" terlalu menyempitkan partisip netral τὸ αὐλούμενον / τὸ κιθαριζόμενον, yang menunjuk pada apa atau musik yang dimainkan.'
  naturalness: Bahasa draf umumnya baku dan mengalir. "Bagaimana ... akan dikenali?" tetap alami dalam bahasa Indonesia dan lebih dekat dengan bentuk sumber. "Melodi" sesuai konteks tanpa mengandaikan lagu berlirik.
  terminology: '"Seruling" merupakan padanan yang dapat diterima untuk αὐλός dalam terjemahan umum. "Kecapi" dapat dipakai untuk κιθάρα, dengan catatan kaki yang menyatakan bahwa instrumen kuno ini sejenis lira. "Nada" tepat untuk φθόγγοι dalam konteks ini.'
