  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: id
  text: Namun, di dalam jemaat aku lebih suka mengucapkan lima kata dengan pengertianku agar aku juga mengajar orang lain, daripada sepuluh ribu kata dalam bahasa lidah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam suatu bahasa.” Kata Yunani yang dipakai dapat berarti “lidah” atau “bahasa”; di sini kata itu menunjuk kepada jenis perkataan yang dibahas dalam 1 Korintus 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: dalam jemaat
  rationale: Dalam konteks ini, ἐκκλησία menunjuk kepada komunitas orang percaya yang sedang berkumpul. “Jemaat” alami dalam bahasa Indonesia dan mempertahankan pengertian komunalnya.
- source_word: θέλω ... ἢ
  choice: aku lebih suka ... daripada
  rationale: θέλω secara harfiah menyatakan keinginan, tetapi bersama perbandingan dengan ἢ, frasa ini mengungkapkan pilihan atau preferensi.
- source_word: πέντε λόγους
  choice: lima kata
  rationale: Terjemahan konkret ini mempertahankan kontras retoris antara lima dan sepuluh ribu kata.
- source_word: τῷ νοΐ μου
  choice: dengan pikiranku
  rationale: Pilihan ini mempertahankan rujukan kepada νοῦς dan menyampaikan bahwa perkataan itu melibatkan pikiran serta dapat dipahami.
- source_word: λαλῆσαι
  choice: mengucapkan
  rationale: Dalam konstruksi dengan sejumlah “kata”, “mengucapkan” terdengar alami dan menyampaikan tindakan berbicara di depan jemaat.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: supaya aku juga dapat mengajar orang lain
  rationale: κατηχέω berarti memberi pengajaran, khususnya secara lisan. “Mengajar” jelas bagi pembaca umum tanpa memasukkan nuansa teknis yang berkembang kemudian pada istilah “katekisasi”.
- source_word: μυρίους λόγους
  choice: sepuluh ribu kata
  rationale: μύριοι dapat bersifat hiperbolis, tetapi nilai dasarnya ialah sepuluh ribu. Angka itu dipertahankan agar kontras tajam dengan lima kata tetap terasa.
- source_word: ἐν γλώσσῃ
  choice: dalam bahasa lidah
  rationale: “Bahasa lidah” merupakan istilah Indonesia yang dapat mempertahankan pemakaian khusus γλῶσσα dalam 1 Korintus 12–14 tanpa menentukan secara dogmatis hakikat fenomenanya.
theological_decisions:
- issue: Makna γλῶσσα dalam 1 Korintus 12–14
  choice: dalam bahasa lidah
  alternative: dalam suatu bahasa
  rationale: Terjemahan utama mempertahankan istilah khas dalam rangkaian pasal ini dan tidak memutuskan apakah fenomena tersebut harus dipahami semata-mata sebagai bahasa manusia biasa atau dengan penjelasan lain. Kemungkinan leksikal “bahasa” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” mengikuti tuturan pribadi Paulus dan lazim dalam teks Alkitab Indonesia. Susunan kalimat mempertahankan kontras kuat antara lima kata yang dapat mengajar orang lain dan sepuluh ribu kata dalam bahasa lidah.
