  yaml_path: translation/nt/1_corinthians/014/032.yaml
  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: id
  text: Dan roh para nabi tunduk kepada para nabi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh-roh yang berkaitan dengan para nabi tunduk kepada para nabi.” Ungkapan ini dapat merujuk pada dorongan kenabian atau kegiatan rohani yang berkaitan dengan para nabi, dengan menekankan pengendalian diri ketika bernubuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini menambahkan alasan pendukung dalam alur argumen Paulus; “Dan” merupakan padanan Indonesia yang alami.
- source_word: πνεύματα
  choice: roh
  rationale: Bentuk jamak ini paling langsung berarti “roh-roh”; dalam bahasa Indonesia, “roh para nabi” dapat berfungsi sebagai frasa kolektif tanpa menambahkan tafsiran seperti “ucapan” atau “karunia” ke dalam teks utama.
- source_word: προφητῶν
  choice: para nabi
  rationale: Genitif ini diterjemahkan secara alami sebagai hubungan kepunyaan atau keterkaitan dalam frasa “roh para nabi”.
- source_word: προφήταις
  choice: kepada para nabi
  rationale: Datif dengan ὑποτάσσεται menyatakan pihak yang kepadanya roh-roh itu tunduk; “kepada para nabi” mempertahankan bentuk umum teks tanpa menentukan apakah yang dimaksud nabi itu sendiri atau para nabi lain.
- source_word: ὑποτάσσεται
  choice: tunduk
  rationale: Kata ini menyatakan berada di bawah pengaturan atau kendali. “Tunduk” ringkas, wajar, dan mempertahankan pernyataan umum dengan subjek netral jamak yang memakai verba tunggal dalam bahasa Yunani.
theological_decisions:
- issue: Makna “roh para nabi” dan hubungannya dengan pengendalian nubuat
  choice: Mempertahankan ungkapan “roh para nabi” dalam teks utama sambil menjelaskan kemungkinan rujukannya dalam catatan kaki.
  alternative: Menafsirkan langsung sebagai dorongan kenabian yang dapat dikendalikan oleh nabi, atau sebagai roh manusia para nabi yang tunduk kepada nabi-nabi lain.
  rationale: Konteks menekankan ketertiban dan tanggung jawab dalam bernubuat, tetapi susunan Yunani tetap membuka beberapa nuansa. Terjemahan utama tidak seharusnya menutup ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Penggunaan “para nabi” mengungkapkan bentuk jamak secara alami, sedangkan bentuk “roh” dipertahankan agar tidak memasukkan tafsiran ke dalam teks utama.
