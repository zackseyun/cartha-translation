id: 1CO.14.10
reference: 1 Corinthians 14:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοσαῦτα εἰ τύχοι γένη φωνῶν ⸀εἰσιν ἐν κόσμῳ, καὶ ⸀οὐδὲν ἄφωνον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: id
  text: Mungkin ada begitu banyak jenis bahasa di dunia ini[a], dan tidak satu pun yang tanpa makna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mungkin ada begitu banyak jenis bunyi di dunia ini, dan tidak satu pun yang tanpa bunyi.”
    reason: Alternatif ini mempertahankan arti leksikal yang lebih harfiah dari φωνῶν dan ἄφωνον.
lexical_decisions:
- source_word: τοσαῦτα
  choice: begitu banyak
  rationale: Menunjukkan jumlah yang besar dan secara alami menerangkan 'jenis bahasa' tanpa menentukan jumlahnya.
- source_word: εἰ τύχοι
  choice: mungkin
  rationale: Ungkapan idiomatis ini memberi nuansa tentatif; 'mungkin' ringkas dan wajar dalam bahasa Indonesia.
- source_word: γένη
  choice: jenis
  rationale: Menyatakan berbagai macam atau golongan; 'jenis' merupakan padanan Indonesia yang paling alami.
- source_word: φωνῶν
  choice: bahasa
  rationale: φωνή dapat berarti bunyi, suara, atau bahasa. Dalam konteks pembicaraan dan pemahaman pada ayat 9–11, 'bahasa' menyampaikan maksud kontekstual, sementara keluasan leksikalnya dipertahankan dalam catatan kaki.
- source_word: ἐν κόσμῳ
  choice: di dunia ini
  rationale: Padanan alami untuk dunia secara umum; 'ini' membuat ungkapan tersebut idiomatis tanpa mengubah acuannya.
- source_word: οὐδὲν ἄφωνον
  choice: tidak satu pun yang tanpa makna
  rationale: Secara harfiah ἄφωνον berarti 'tanpa suara', tetapi dengan φωνῶν dipahami sebagai bahasa, klausa ini menegaskan bahwa tidak ada bahasa yang tidak mengandung makna. Bentuk harfiahnya dicatat sebagai alternatif.
theological_decisions:
- issue: Apakah φωναί dan ἄφωνον menunjuk kepada bahasa bermakna atau bunyi/suara secara harfiah
  choice: Teks utama memakai 'bahasa' dan 'tanpa makna'.
  alternative: Catatan kaki mempertahankan 'bunyi' dan 'tanpa bunyi'.
  rationale: Konteks langsung menekankan ujaran yang dapat dipahami, tetapi polisemi φωνή dan arti harfiah ἄφωνος menimbulkan ambiguitas asli yang patut dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada bermartabat. Pengulangan 'tanpa' mempertahankan bentuk argumentasi Yunani, sedangkan catatan kaki menjaga ambiguitas antara bahasa bermakna dan bunyi/suara.
