id: 1CO.14.29
reference: 1 Corinthians 14:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: id
  text: Hendaklah dua atau tiga nabi berbicara, dan hendaklah yang lain menilai apa yang disampaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguji,” “mempertimbangkan,” atau “membedakan.” Kata kerja Yunani ini dapat berarti menilai perkataan nubuat dengan saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: nabi
  rationale: Kata benda ini menunjuk kepada para nabi atau penyampai nubuat. “Nabi” merupakan padanan langsung dan sesuai dengan konteks pengaturan perkataan dalam pertemuan jemaat.
- source_word: δὲ
  choice: dan
  rationale: Partikel ini menandai peralihan ringan dalam rangkaian petunjuk. “Dan” menjaga kelancaran tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: δύο ἢ τρεῖς
  choice: dua atau tiga
  rationale: Ungkapan bilangan ini diterjemahkan secara langsung.
- source_word: λαλείτωσαν
  choice: hendaklah ... berbicara
  rationale: Bentuk imperatif orang ketiga jamak dipertahankan dengan konstruksi “hendaklah,” yang wajar dan berwibawa dalam bahasa Indonesia.
- source_word: οἱ ἄλλοι
  choice: yang lain
  rationale: Ungkapan Yunani tidak menentukan apakah yang dimaksud ialah nabi-nabi lain, para pemimpin, atau anggota jemaat lainnya. “Yang lain” mempertahankan keterbukaan rujukan itu.
- source_word: διακρινέτωσαν
  choice: hendaklah ... menilai apa yang disampaikan
  rationale: Dalam konteks ini kata kerja tersebut menyatakan tindakan menguji atau mempertimbangkan perkataan nubuat, bukan terutama menjatuhkan hukuman. Objek tersirat dijelaskan secara alami sebagai “apa yang disampaikan,” tanpa menentukan hasil penilaiannya.
theological_decisions:
- issue: Identitas “yang lain” dalam pertemuan jemaat
  choice: Diterjemahkan secara umum sebagai “yang lain.”
  alternative: “nabi-nabi yang lain” atau “anggota jemaat lainnya”
  rationale: Teks Yunani tidak mengidentifikasi kelompok ini lebih lanjut. Terjemahan tidak menyelesaikan pertanyaan tentang siapa yang berwenang menilai ketika teks sumber sendiri membiarkannya terbuka.
- issue: Sasaran tindakan διακρίνω
  choice: “menilai apa yang disampaikan”
  alternative: “menghakimi,” “menguji,” atau “mempertimbangkan”
  rationale: Konteks menunjukkan evaluasi terhadap perkataan nubuat. Pilihan ini menyampaikan fungsi tersebut tanpa menyiratkan penghukuman atau menetapkan kriteria teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan berwibawa. Pengulangan “hendaklah” mempertahankan daya imperatif kedua kata kerja Yunani. Rujukan “yang lain” sengaja dibiarkan ambigu sesuai teks sumber.
