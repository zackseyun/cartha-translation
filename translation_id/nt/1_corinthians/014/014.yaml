  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: id
  text: Sebab, jika aku berdoa dalam bahasa lidah[a], rohku berdoa, tetapi pikiranku tidak berbuah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam suatu bahasa.” Kata Yunani ini dapat merujuk pada bahasa manusia atau pada “bahasa lidah” dalam arti ujaran yang dimampukan Roh, seperti yang dibicarakan sepanjang pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sebab, jika
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi argumen sebelumnya, sedangkan ἐάν memperkenalkan syarat; susunan ini mempertahankan kedua fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: προσεύχωμαι
  choice: aku berdoa
  rationale: Bentuk subjungtif kini sesudah ἐάν paling alami diterjemahkan dengan bentuk kini dalam klausa bersyarat bahasa Indonesia.
- source_word: γλώσσῃ
  choice: dengan bahasa lidah
  rationale: Bentuk datif tunggal menunjuk sarana atau cara berdoa. 'Bahasa lidah' mempertahankan istilah khas dalam pasal ini sekaligus tidak menutup kemungkinan arti leksikal 'bahasa'.
- source_word: τὸ πνεῦμά μου
  choice: rohku
  rationale: Kata ganti milik dan kontras dengan 'pikiranku' mendukung pengertian roh si pembicara; terjemahan ini tidak menambahkan penafsiran bahwa yang dimaksud secara langsung ialah Roh Kudus.
- source_word: προσεύχεται
  choice: berdoa
  rationale: Bentuk kini sederhana menyampaikan tindakan itu dengan jelas dan alami.
- source_word: ὁ δὲ νοῦς μου
  choice: tetapi pikiranku
  rationale: νοῦς dapat berarti pikiran atau pengertian. 'Pikiranku' merupakan padanan langsung dan mempertahankan kontras dengan 'rohku' tanpa terlalu mempersempit makna.
- source_word: ἄκαρπός ἐστιν
  choice: tidak menghasilkan buah
  rationale: Ungkapan ini mempertahankan metafora ἄκαρπος dalam bahasa Indonesia yang alami, alih-alih menggantinya dengan istilah abstrak seperti 'tidak produktif'.
theological_decisions:
- issue: Acuan τὸ πνεῦμά μου ('rohku')
  choice: roh si pembicara sendiri
  alternative: Roh Kudus yang bekerja di dalam si pembicara
  rationale: Kata milik 'ku' serta kontras dengan 'pikiranku' lebih mendukung dimensi batin si pembicara. Namun, 'rohku' mempertahankan redaksi Yunani tanpa meniadakan peran Roh Kudus yang mungkin tersirat dalam konteks karunia rohani.
- issue: Sifat γλώσσῃ
  choice: bahasa lidah, dengan ambiguitas antara bahasa manusia dan ujaran yang dimampukan Roh
  alternative: bahasa manusia tertentu saja
  rationale: Pemakaian γλῶσσα dalam pasal ini tidak seharusnya dipersempit secara diam-diam; istilah dan catatan kaki mempertahankan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'aku' mengikuti ujaran orang pertama Paulus. Metafora buah dipertahankan, sedangkan istilah 'bahasa lidah' dipakai demi kesinambungan dengan pokok pembahasan pasal 14.
