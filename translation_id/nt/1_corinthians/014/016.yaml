  to: Sebab, jika engkau mengucapkan berkat dalam roh[b], bagaimana seorang yang hadir sebagai orang awam[a] akan mengucapkan “Amin” atas ucapan syukurmu[c]? Sebab, ia tidak tahu apa yang engkau katakan.
