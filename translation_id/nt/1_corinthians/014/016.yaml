  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: id
  text: Sebab, jika engkau mengucapkan berkat dalam roh[b], bagaimana seorang yang hadir sebagai orang awam[a] akan mengucapkan “Amin” atas ucapan syukurmu[c]? Sebab, ia tidak tahu apa yang engkau katakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang luar”, “orang biasa”, atau “orang yang tidak terpelajar”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan roh”; bahasa Yunani tidak mengharuskan penafsiran yang lebih khusus di sini.
    reason: alternative_reading
  - marker: c
    text: “Ucapan syukur” di sini berarti tindakan mengucap syukur, bukan suatu keharusan untuk memahami kata ini sebagai istilah teknis “Ekaristi” yang berkembang kemudian.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Jika tidak demikian, apabila
  rationale: Gabungan ini memperkenalkan keadaan bersyarat sebagai konsekuensi dari uraian sebelumnya. Ungkapan ini mempertahankan daya korektifnya dan tetap wajar dalam bahasa Indonesia.
- source_word: εὐλογῇς
  choice: engkau mengucapkan berkat
  rationale: Kata kerja ini menunjuk pada tindakan memberkati atau menyampaikan berkat secara lisan dalam ibadah. Frasa ini lebih jelas dalam bahasa Indonesia daripada sekadar 'memberkati'.
- source_word: πνεύματι
  choice: dalam roh
  rationale: Bentuk datif Yunani dapat menyatakan sarana maupun lingkup. Terjemahan ini tidak memastikan apakah yang dimaksud ialah roh manusia atau perkataan yang dimampukan oleh Roh.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: orang yang berada di tempat orang yang tidak berpengetahuan
  rationale: Terjemahan ini mempertahankan gambaran tentang seseorang yang menempati suatu tempat atau posisi, sekaligus menyampaikan bahwa ia tidak memiliki pengetahuan yang diperlukan untuk memahami ucapan tersebut.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: bagaimana ... akan mengucapkan “Amin”
  rationale: Ungkapan ini merujuk pada tanggapan jemaat yang menyatakan persetujuan. Istilah liturgis 'Amin' dipertahankan.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: atas ucapan syukurmu
  rationale: Dalam konteks ini εὐχαριστία adalah tindakan atau ucapan bersyukur. Pilihan ini sesuai dengan pemakaian ἐπί dan tidak memasukkan arti sakramental teknis yang muncul kemudian.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: Sebab, ia tidak tahu apa yang engkau katakan
  rationale: Klausa ini menyatakan alasan orang tersebut tidak dapat mengucapkan Amin. 'Tidak tahu' menerjemahkan οὐκ οἶδεν secara langsung sambil mempertahankan implikasi ketidakmengertian dari konteks.
theological_decisions:
- issue: Makna πνεύματι dalam konteks ibadah karismatik
  choice: dalam roh
  alternative: dengan roh; oleh Roh
  rationale: Ayat ini tidak menentukan secara tegas apakah yang dimaksud ialah roh orang yang berbicara atau perkataan yang dimampukan oleh Roh. Terjemahan generik mempertahankan ambiguitas itu.
- issue: Makna εὐχαριστίᾳ
  choice: ucapan syukur
  alternative: Ekaristi
  rationale: Konteks langsung membahas ucapan syukur yang perlu dipahami agar orang lain dapat menjawab Amin. Istilah teknis 'Ekaristi' akan memasukkan kekhususan sakramental yang tidak dituntut oleh teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Bentuk sapaan tunggal 'engkau' dipakai untuk mencerminkan verba orang kedua tunggal. Susunan kalimat dibuat alami tanpa menghilangkan gambaran posisi dalam frasa Yunani.
