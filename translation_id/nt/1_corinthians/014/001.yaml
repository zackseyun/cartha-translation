id: 1CO.14.1
reference: 1 Corinthians 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: id
  text: Kejarlah kasih, dan inginkanlah dengan sungguh-sungguh hal-hal rohani,[a] terutama supaya kamu bernubuat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karunia-karunia rohani” atau “perkara-perkara rohani.” Ungkapan Yunani lebih luas daripada “karunia-karunia,” tetapi dalam konteks ini pembahasannya berfokus pada berbagai penyataan yang diberikan Roh di tengah jemaat.
    reason: lexical_alternative
  - marker: b
    text: Atau “tetapi lebih-lebih lagi supaya kamu bernubuat.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Διώκετε
  choice: Kejarlah
  rationale: Bentuk imperatif ini menyatakan usaha yang aktif dan terus-menerus; “kejarlah” mempertahankan daya ungkap tersebut.
- source_word: τὴν ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang baku dan mempertahankan kaitan langsung dengan pembahasan pasal 13.
- source_word: ζηλοῦτε
  choice: inginkanlah dengan sungguh-sungguh
  rationale: Padanan ini menyampaikan semangat dan kuatnya keinginan dalam ζηλόω secara jelas dalam bahasa Indonesia modern.
- source_word: τὰ πνευματικά
  choice: hal-hal rohani
  rationale: Bentuk adjektiva netral jamak ini lebih luas daripada “karunia-karunia rohani.” Konteks memang menyoroti berbagai penyataan yang diberikan Roh di tengah jemaat, tetapi terjemahan utama tidak mempersempit ungkapan Yunani.
- source_word: μᾶλλον δὲ
  choice: terutama
  rationale: Dalam alur nasihat ini, ungkapan tersebut menandai prioritas atau penekanan yang lebih besar. “Terutama” alami dalam bahasa Indonesia tanpa menghilangkan daya komparatifnya.
- source_word: ἵνα προφητεύητε
  choice: supaya kamu bernubuat
  rationale: “Supaya” mempertahankan konstruksi ἵνα dengan subjungtif, yang dapat menyatakan isi atau tujuan dari keinginan itu.
theological_decisions:
- issue: Cakupan τὰ πνευματικά
  choice: hal-hal rohani
  alternative: karunia-karunia rohani; perkara-perkara rohani
  rationale: Ungkapan Yunani secara formal lebih luas daripada “karunia-karunia,” meskipun konteks 1 Korintus 12–14 berfokus pada penyataan atau karunia dari Roh dalam jemaat. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan konteksnya.
- issue: Daya μᾶλλον δὲ dalam pengutamaan nubuat
  choice: terutama supaya kamu bernubuat
  alternative: tetapi lebih-lebih lagi supaya kamu bernubuat; tetapi sebaliknya, supaya kamu bernubuat
  rationale: Pilihan ini mempertahankan pengutamaan nubuat tanpa menyiratkan bahwa hal-hal rohani lainnya ditolak. Catatan kaki mencatat kemungkinan nuansa kontras yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif jamak Yunani diterjemahkan dengan bentuk Indonesia yang tidak menandai jumlah secara eksplisit. Istilah “bernubuat” dipertahankan sebagai kategori alkitabiah yang lazim.
