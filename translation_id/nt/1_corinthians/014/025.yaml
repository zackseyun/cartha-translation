id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: id
  text: rahasia-rahasia hatinya menjadi nyata, dan dengan demikian ia akan tersungkur dan menyembah Allah sambil menyatakan, “Sungguh, Allah ada di tengah-tengah kamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sungguh, Allah ada di dalam kamu.”'
    reason: Makna alternatif ἐν ὑμῖν; frasa itu dapat menyatakan kehadiran Allah di dalam komunitas, bukan hanya di tengah perhimpunan mereka.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: rahasia-rahasia
  rationale: Adjektiva netral jamak yang dipakai sebagai nomina menunjuk pada hal-hal yang tersembunyi dalam diri orang itu. Bentuk ini mempertahankan makna jamak sumber dan terdengar wajar dalam konteks penyingkapan batin.
- source_word: τῆς καρδίας αὐτοῦ
  choice: hatinya
  rationale: “Hati” mempertahankan istilah antropologis Alkitab untuk pusat pikiran dan dorongan batin; akhiran -nya secara alami menerjemahkan αὐτοῦ.
- source_word: φανερὰ γίνεται
  choice: menjadi nyata
  rationale: Ungkapan ini menyatakan bahwa yang tersembunyi mulai tampak atau menjadi jelas. “Menjadi nyata” mempertahankan nuansa proses pada γίνεται tanpa menambahkan pelaku penyingkapan.
- source_word: καὶ οὕτως
  choice: dan dengan demikian
  rationale: Frasa ini menghubungkan tersingkapnya hati dengan tanggapan yang menyusul, serta mempertahankan daya inferensial atau resultatifnya.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ia akan tersungkur
  rationale: “Tersungkur” secara alami menggambarkan jatuh dengan wajah menghadap ke bawah sebagai sikap merendahkan diri. Unsur futur dipadukan dengan verba utama agar kalimat Indonesia tetap lancar.
- source_word: προσκυνήσει τῷ θεῷ
  choice: menyembah Allah
  rationale: Dalam konteks ini προσκυνήσει menunjuk pada ibadah kepada Allah; postur tubuhnya sudah tersirat dengan jelas dalam “tersungkur”.
- source_word: ἀπαγγέλλων
  choice: sambil menyatakan
  rationale: Partisip ini menunjukkan ucapan yang menyertai tindakan menyembah. “Menyatakan” sesuai dengan pengakuan tegas tersebut tanpa melebihkannya menjadi pewartaan publik.
- source_word: Ὄντως
  choice: Sungguh
  rationale: Kata ini menegaskan kebenaran atau kenyataan kesimpulan orang tersebut. “Sungguh” alami dan bermartabat dalam pengakuan langsung.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengah kamu
  rationale: Dalam konteks jemaat yang sedang berkumpul, frasa ini paling wajar menyatakan kehadiran Allah di tengah komunitas. Kemungkinan arti “di dalam kamu” tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ἐν ὑμῖν dalam pengakuan penutup
  choice: di tengah-tengah kamu
  alternative: di dalam kamu
  rationale: Konteks langsungnya adalah pertemuan jemaat dan pengakuan orang luar bahwa kehadiran Allah nyata dalam komunitas itu. Namun, karena ἐν dapat pula menyatakan keberadaan di dalam dan ὑμῖν berbentuk jamak, kemungkinan “di dalam kamu” dipertahankan dalam catatan kaki tanpa meniadakan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. “Kamu” dipertahankan sebagai sapaan jamak yang dapat dipahami dari konteks jemaat; tanda kutip menandai isi pengakuan langsung. Penanda catatan kaki [a] ditempatkan dalam teks utama.
