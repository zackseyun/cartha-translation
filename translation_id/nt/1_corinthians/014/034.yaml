reference: 1 Corinthians 14:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: id
  text: Para perempuan hendaklah berdiam diri dalam jemaat-jemaat[a], sebab mereka tidak diizinkan untuk berbicara[b]; sebaliknya, hendaklah mereka tunduk, sebagaimana hukum itu juga mengatakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para istri hendaklah berdiam diri dalam jemaat-jemaat”; kata Yunani gynē dapat berarti “perempuan” atau “istri”, bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Ayat ini sendiri tidak menjelaskan jenis pembicaraan yang dimaksud; berdasarkan konteks sekitarnya, sebagian orang memahaminya secara lebih terbatas.
    reason: lexical_alternative
  - marker: c
    text: Atau “Hukum”. Istilah ini dapat menunjuk secara khusus kepada Taurat Musa atau secara lebih luas kepada Kitab Suci.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: perempuan-perempuan
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Karena ayat ini tidak secara eksplisit menyebut suami, makna yang lebih luas dipakai dalam teks utama, sedangkan kemungkinan “istri-istri” dicatat dalam catatan kaki.
- source_word: ἐκκλησίαις
  choice: jemaat-jemaat
  rationale: Dalam pemakaian Paulus, ἐκκλησία lazim menunjuk kepada persekutuan umat Kristen, termasuk ketika mereka berhimpun. “Jemaat-jemaat” alami dalam bahasa Indonesia dan mempertahankan bentuk jamak.
- source_word: σιγάτωσαν
  choice: hendaklah ... berdiam diri
  rationale: Imperatif kini ini memerintahkan sikap diam dalam keadaan yang dibicarakan. “Berdiam diri” mempertahankan kaitan dengan pemakaian verba yang sama dalam konteks pasal ini tanpa menambahkan alasan tertentu.
- source_word: ἐπιτρέπεται
  choice: tidak diizinkan
  rationale: Bentuk pasif ini menyatakan bahwa izin tidak diberikan. Ungkapan tersebut jelas dan tidak menentukan siapa yang memberikan atau menolak izin.
- source_word: λαλεῖν
  choice: berbicara
  rationale: λαλέω merupakan verba luas yang berarti berbicara. Terjemahan netral ini tidak mempersempit jenis pembicaraan yang dimaksud.
- source_word: ὑποτασσέσθωσαν
  choice: hendaklah mereka tunduk
  rationale: Imperatif kini bentuk tengah/pasif ini menyatakan sikap menundukkan diri atau berada dalam ketundukan. “Hendaklah mereka tunduk” ringkas, wajar, dan mempertahankan daya imperatifnya.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam bahasa Indonesia Alkitabiah, “hukum Taurat” merupakan padanan alami untuk νόμος ketika disebut sebagai sumber yang berbicara. Namun, karena rujukannya dapat dipahami sebagai Taurat secara khusus atau Kitab Suci secara lebih luas, ambiguitas itu dijelaskan dalam catatan kaki.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: sebagaimana juga dikatakan oleh hukum Taurat
  rationale: Terjemahan ini mempertahankan daya perbandingan καθὼς dan unsur tambahan καί, dengan susunan pasif yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan γυναῖκες
  choice: perempuan-perempuan dalam jemaat
  alternative: istri-istri dalam jemaat
  rationale: Kata Yunani dapat memiliki kedua arti tersebut. Karena ayat ini sendiri tidak menyebut suami, teks utama memakai arti yang lebih luas dan catatan kaki mempertahankan kemungkinan yang lebih sempit.
- issue: Cakupan larangan berbicara
  choice: diterjemahkan secara langsung tanpa mempersempit jenis pembicaraan
  alternative: hanya pembicaraan yang mengacau, atau hanya penilaian atas nubuat
  rationale: Ayat ini hanya memakai verba umum “berbicara”. Penafsiran yang lebih sempit mungkin ditarik dari konteks, tetapi tidak dimasukkan ke dalam teks utama.
- issue: Rujukan ὁ νόμος
  choice: hukum Taurat, dengan ketidakpastian rujukan dijelaskan
  alternative: Taurat Musa secara khusus, atau Kitab Suci secara lebih luas
  rationale: Ungkapan Paulus tidak menyebut kutipan tertentu. Terjemahan memakai istilah Indonesia yang wajar, sementara catatan kaki menjaga keterbukaan mengenai cakupan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “hendaklah” mempertahankan daya imperatif tanpa terdengar kasar; “jemaat-jemaat” mempertahankan bentuk jamak sumber. Semua ketegangan penafsiran utama dipertahankan melalui teks netral dan catatan kaki.
