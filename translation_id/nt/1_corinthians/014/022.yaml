id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: id
  text: Jadi, bahasa lidah[a] merupakan tanda[b], bukan bagi orang-orang yang percaya, melainkan bagi orang-orang yang tidak percaya; sedangkan nubuat bukan bagi orang-orang yang tidak percaya, melainkan bagi orang-orang yang percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahasa-bahasa.” Istilah Yunani ini dapat berarti bahasa-bahasa, tetapi dalam 1 Korintus 12–14, “bahasa lidah” mempertahankan istilah yang digunakan Paulus tanpa menentukan penafsiran yang masih diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Dalam kaitannya dengan kutipan Yesaya 28:11–12 pada ayat sebelumnya, “tanda” ini dapat dipahami oleh sebagian penafsir sebagai tanda penghukuman.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari argumen sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya inferensialnya.
- source_word: γλῶσσαι
  choice: bahasa-bahasa lidah
  rationale: Mempertahankan istilah yang dikenal dalam pembahasan 1 Korintus 12–14 tanpa menentukannya secara sempit sebagai bahasa asing ataupun ucapan ekstatis. Bentuk jamak mengikuti teks Yunani.
- source_word: εἰς σημεῖόν εἰσιν
  choice: merupakan tanda
  rationale: Menyampaikan fungsi atau hasil yang dinyatakan konstruksi εἰς dengan ringkas dan alami, tanpa menetapkan apakah tanda itu bersifat positif atau berupa penghukuman.
- source_word: τοῖς πιστεύουσιν
  choice: bagi orang-orang yang percaya
  rationale: Mempertahankan gagasan verbal dari partisip substantival πιστεύουσιν dan membentuk kontras yang jelas dengan mereka yang tidak percaya.
- source_word: τοῖς ἀπίστοις
  choice: bagi orang-orang yang tidak percaya
  rationale: Menyatakan kontras komunal dan religius dengan πιστεύουσιν dalam bahasa Indonesia yang jelas serta tidak terlalu teknis.
- source_word: προφητεία
  choice: nubuat
  rationale: Padanan baku dan langsung bagi kegiatan atau karunia bernubuat dalam konteks pasal ini.
- source_word: δὲ
  choice: sedangkan
  rationale: Menampilkan perbandingan yang berlawanan antara bahasa-bahasa lidah dan nubuat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna γλῶσσαι dalam konteks karismatik
  choice: bahasa-bahasa lidah
  alternative: bahasa-bahasa; ucapan ekstatis
  rationale: Terjemahan tidak memastikan apakah fenomena yang dimaksud adalah bahasa manusia yang belum dipelajari atau ucapan ekstatis, sehingga ketegangan penafsiran tetap terpelihara.
- issue: Daya σημεῖον dalam hubungannya dengan orang yang tidak percaya
  choice: tanda
  alternative: tanda yang meneguhkan; tanda penghukuman
  rationale: Teks Yunani hanya menyebutnya sebagai tanda. Kutipan Yesaya sebelumnya memungkinkan pemahaman sebagai tanda penghukuman, tetapi ayat ini sendiri tidak menguraikannya, sehingga teks utama tetap netral.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat, dengan struktur kontras “bukan ... melainkan ...” yang mengikuti kesejajaran teks Yunani. Istilah “bahasa-bahasa lidah” dipilih untuk menghindari “bahasa roh,” yang dapat memberi penafsiran teologis tambahan yang tidak dinyatakan oleh γλῶσσαι.
