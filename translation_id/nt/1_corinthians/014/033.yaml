id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: id
  text: Sebab Allah bukanlah Allah kekacauan,[a] melainkan Allah damai sejahtera, sebagaimana dalam semua jemaat orang-orang kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah bukanlah Allah kebingungan, melainkan Allah damai sejahtera.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebagaimana yang berlaku di semua jemaat umat Allah yang kudus.” Sebagian menghubungkan frasa ini dengan ayat berikutnya, bukan dengan ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: kekacauan
  rationale: Kata ini menunjuk pada keadaan tidak tertib atau kacau. Dalam konteks ibadah jemaat, “kekacauan” paling alami dan tidak membatasinya hanya pada kebingungan pikiran.
- source_word: εἰρήνης
  choice: kedamaian
  rationale: Padanan baku yang di sini berlawanan dengan kekacauan dan mencakup keadaan jemaat yang rukun serta tertib.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Merujuk secara definitif dan pribadi kepada Allah; bentuk artikelnya tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ὡς
  choice: seperti dalam
  rationale: Mempertahankan ungkapan perbandingan yang ringkas dan hubungan frasa ini dengan ayat 33 sesuai tanda baca teks sumber.
- source_word: ἐκκλησίαις
  choice: jemaat
  rationale: “Jemaat” merupakan padanan Indonesia yang lazim bagi komunitas Kristen setempat dan sesuai dengan konteks pertemuan ibadah.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Mempertahankan sebutan Paulus bagi umat percaya serta nuansa teologis ἅγιοι tanpa menjadikannya gelar bagi kelompok khusus.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa pernyataan ini memberikan alasan bagi petunjuk sebelumnya mengenai ketertiban dalam pertemuan jemaat.
theological_decisions:
- issue: Makna konstruksi genitif ἀκαταστασίας ... ἀλλὰ εἰρήνης
  choice: “Allah bukanlah Allah yang menghendaki kekacauan, melainkan kedamaian”
  alternative: “Allah bukanlah Allah kekacauan, melainkan Allah kedamaian”
  rationale: Tambahan “yang menghendaki” membuat relasi genitif terdengar alami dalam bahasa Indonesia dan mengungkapkan bahwa sifat serta kehendak Allah tidak menghasilkan kekacauan. Namun, ini sedikit lebih eksplisit daripada bahasa Yunani; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- issue: Keterkaitan frasa ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Dihubungkan dengan ayat 33 sebagai perbandingan atau rujukan kepada keadaan/praktik semua jemaat
  alternative: Dihubungkan dengan ayat berikutnya sebagai awal kalimat baru mengenai tata laku dalam jemaat
  rationale: Tanda baca SBLGNT yang diberikan menghubungkan frasa ini dengan ayat 33 dan menghasilkan pengertian yang koheren. Karena tanda baca tidak terdapat dalam naskah paling awal dan keterkaitan sintaksisnya diperdebatkan, alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jemaat” dipilih daripada “gereja-gereja” agar jelas menunjuk komunitas setempat; “orang-orang kudus” mempertahankan istilah khas Paulus. Penanda catatan kaki ditempatkan tepat setelah bagian yang diterangkannya.
