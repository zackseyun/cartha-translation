  to: Sebab Allah bukanlah Allah kekacauan,[a] melainkan Allah damai sejahtera, sebagaimana dalam semua jemaat orang-orang kudus.[b]
  rationale: Revisi menghapus penambahan interpretatif “yang menghendaki” agar relasi genitif dalam teks Yunani tetap berupa karakterisasi Allah. Istilah “damai sejahtera” digunakan sebagai padanan Alkitab Indonesia yang mapan untuk εἰρήνη. Kedua penanda catatan kaki dipertahankan dan ditempatkan pada unsur yang dijelaskan; catatan kedua tetap menjaga ambiguitas sintaktis yang diperselisihkan.
