  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: id
  text: 'Demikian juga kamu: karena kamu bersemangat mengejar karunia-karunia rohani[a], berusahalah untuk semakin berlimpah demi pembangunan jemaat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “roh-roh”; dapat juga diterjemahkan “hal-hal rohani”. Dalam konteks ini tampaknya yang dimaksud ialah karunia atau manifestasi rohani.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga dengan kamu
  rationale: Meneruskan perbandingan dari ayat sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya inferensialnya.
- source_word: ἐπεὶ
  choice: Karena
  rationale: Memperkenalkan dasar bagi nasihat yang menyusul.
- source_word: ζηλωταί ἐστε
  choice: kamu bersemangat mengejar
  rationale: Kata benda ζηλωταί menggambarkan orang yang sangat berminat atau giat terhadap sesuatu; bentuk verbal ini lebih alami dalam bahasa Indonesia modern.
- source_word: πνευμάτων
  choice: karunia-karunia rohani
  rationale: Secara harfiah bentuk ini berarti 'roh-roh' atau hal-hal yang bersifat rohani, tetapi konteks 1 Korintus 12–14 menunjuk pada karunia atau manifestasi rohani. Ambiguitas bentuk Yunani dipertahankan dalam catatan kaki.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: dalam hal-hal yang membangun jemaat
  rationale: Mengungkapkan arah atau tujuan kelimpahan, yaitu pembangunan dan penguatan komunitas, dalam bahasa Indonesia yang wajar.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: berusahalah agar kamu berlimpah
  rationale: Menjaga unsur pengejaran yang disengaja dalam ζητεῖτε dan gagasan kelimpahan dalam περισσεύητε tanpa menambahkan objek yang tidak dinyatakan secara eksplisit.
- source_word: τῆς ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks Paulus, ἐκκλησία menunjuk pada komunitas orang percaya; 'jemaat' tepat bagi komunitas setempat dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πνευμάτων
  choice: karunia-karunia rohani
  alternative: roh-roh; hal-hal rohani
  rationale: Konteks membahas karunia atau manifestasi rohani yang harus dipakai demi pembangunan jemaat. Karena bentuk Yunani sendiri lebih ringkas dan ambigu, kemungkinan harfiahnya dicatat tanpa memasukkan gagasan tentang banyak roh ke dalam teks utama.
- issue: Hubungan περισσεύητε dengan pembangunan jemaat
  choice: berlimpah dalam hal-hal yang membangun jemaat
  alternative: berlimpah untuk pembangunan jemaat
  rationale: πρός menyatakan arah atau tujuan. Rumusan ini memperjelas bahwa kelimpahan yang dicari harus menghasilkan penguatan jemaat, tetapi tidak secara khusus menambahkan 'di dalam karunia-karunia itu' sebagai objek yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Jemaat' dipilih daripada 'gereja' untuk menonjolkan komunitas yang dibangun. Metafora οἰκοδομή disampaikan melalui kata 'membangun', sedangkan susunan kalimat dibuat alami tanpa menghilangkan arah tujuan dalam teks Yunani.
