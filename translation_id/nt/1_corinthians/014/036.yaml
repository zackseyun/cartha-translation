id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: id
  text: Atau apakah firman Allah berasal dari kamu[a]? Atau apakah firman itu hanya sampai kepada kamu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar dari kamu”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “datang hanya kepada kamu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau apakah
  rationale: Mempertahankan partikel disjungtif ἤ dan daya teguran retoris melalui bentuk pertanyaan, tanpa menambah seruan yang tidak tersurat.
- source_word: ἀφ’ ὑμῶν
  choice: dari kamu
  rationale: ἀπό dengan bentuk genitif menyatakan sumber atau asal; dalam susunan bahasa Indonesia, maknanya tersampaikan secara alami oleh 'berasal dari kamu'.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan Indonesia yang baku dan bermartabat ini mempertahankan keluasan frasa Yunani tanpa mempersempitnya menjadi Injil atau nubuat tertentu.
- source_word: ἐξῆλθεν
  choice: berasal
  rationale: Secara harfiah berarti 'keluar', tetapi bersama ἀφ’ ὑμῶν pertanyaan ini menyoroti sumber atau asal. 'Berasal' menyampaikan maksud itu secara alami; gambaran harfiahnya dicatat sebagai alternatif.
- source_word: εἰς ὑμᾶς μόνους
  choice: hanya ... kepada kamu
  rationale: 'Menjaga penekanan eksklusif μόνους: jemaat Korintus bukan satu-satunya pihak yang menerima firman Allah.'
- source_word: κατήντησεν
  choice: sampai
  rationale: καταντάω berarti tiba atau mencapai. 'Sampai kepada kamu' merupakan padanan alami yang tetap mempertahankan gagasan kedatangan.
theological_decisions:
- issue: Rujukan 'firman Allah'
  choice: Dipertahankan sebagai 'firman Allah' tanpa diperinci.
  alternative: Pesan Injil secara khusus; atau ucapan nubuat dalam pertemuan jemaat.
  rationale: Dalam konteksnya, Paulus menegur sikap seolah-olah jemaat Korintus adalah sumber atau satu-satunya penerima pesan Allah yang berwibawa. Frasa Yunani tetap dibiarkan luas agar ketegangan tafsir tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan dua pertanyaan mempertahankan kesejajaran serta ketajaman teguran retoris Paulus. Kata ganti jamak bahasa Yunani diterjemahkan dengan 'kamu', yang dalam konteks mengacu kepada jemaat Korintus secara kolektif.
