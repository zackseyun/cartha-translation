id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: id
  text: Karena itu, jika seluruh jemaat berkumpul di satu tempat dan semuanya berbicara dalam bahasa lidah[a], lalu masuklah orang-orang yang belum mendapat pengajaran[b] atau orang-orang yang tidak percaya, tidakkah mereka akan berkata bahwa kalian tidak waras?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbicara dalam berbagai bahasa.” Kata Yunani yang dipakai dapat berarti “bahasa-bahasa”, tetapi “bahasa lidah” mempertahankan sebutan yang dikenal dalam konteks ini tanpa memastikan hakikat fenomena yang diperdebatkan itu.
    reason: alternative_reading
  - marker: b
    text: Atau “orang-orang luar.” Istilah Yunaninya kemungkinan menunjuk kepada orang yang belum mengetahui atau belum diperkenalkan kepada praktik jemaat, dan di sini dibedakan dari “orang-orang yang tidak percaya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari pembahasan sebelumnya secara jelas dan alami.
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη
  choice: seluruh jemaat berkumpul
  rationale: ἐκκλησία dalam konteks Paulus menunjuk kepada komunitas orang percaya yang sedang berhimpun; 'seluruh jemaat' mempertahankan penekanan ὅλη.
- source_word: ἐπὶ τὸ αὐτό
  choice: di satu tempat
  rationale: Ungkapan ini menyatakan bahwa mereka berhimpun bersama di lokasi yang sama; pilihan ini mempertahankan unsur tempat tanpa mengulang kata 'berkumpul'.
- source_word: λαλῶσιν γλώσσαις
  choice: berbicara dalam bahasa lidah
  rationale: '''Bahasa lidah'' mempertahankan sebutan yang dikenal untuk fenomena karismatik dalam 1 Korintus 12–14 tanpa menambahkan kata ''roh'', yang tidak terdapat dalam frasa Yunani, atau memastikan bahwa yang dimaksud hanyalah bahasa manusia biasa.'
- source_word: ἰδιῶται
  choice: orang-orang yang belum mendapat pengajaran
  rationale: Istilah ini menunjuk kepada orang yang belum mengetahui, memahami, atau diperkenalkan kepada praktik dalam pertemuan tersebut. Pilihan ini juga mempertahankan pembedaan dari ἄπιστοι.
- source_word: ἄπιστοι
  choice: orang-orang yang tidak percaya
  rationale: Padanan Indonesia yang langsung dan wajar bagi mereka yang tidak percaya, serta tetap membedakannya dari kelompok sebelumnya.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: tidakkah mereka akan berkata bahwa
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya serta unsur waktu mendatang.
- source_word: μαίνεσθε
  choice: kalian tidak waras
  rationale: Menyampaikan tuduhan bahwa seluruh kelompok kehilangan kewarasan dengan bahasa Indonesia modern dan tidak terlalu kasar.
theological_decisions:
- issue: Hakikat γλώσσαι dalam 1 Korintus 14
  choice: bahasa lidah
  alternative: berbagai bahasa
  rationale: Kata Yunani ini dapat berarti bahasa-bahasa, tetapi dalam pasal ini juga menjadi sebutan bagi fenomena ujaran karismatik. 'Bahasa lidah' menjaga keterbukaan penafsiran dan tidak memutuskan apakah fenomena itu berupa bahasa manusia, ujaran ekstatis, atau mencakup keduanya.
- issue: Hubungan antara ἰδιῶται dan ἄπιστοι
  choice: Mempertahankan keduanya sebagai dua sebutan yang dapat dibedakan
  alternative: Menggabungkan keduanya sebagai orang luar yang tidak percaya
  rationale: Pemakaian ἤ ('atau') dan dua istilah berbeda mendukung agar pembedaan tekstualnya tidak diratakan, meskipun cakupan kedua kelompok mungkin bertumpang tindih.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai karena μαίνεσθε berbentuk orang kedua jamak dan tuduhan diarahkan kepada jemaat yang berhimpun. Susunan kalimat mempertahankan alur syarat dan pertanyaan retoris teks Yunani.
