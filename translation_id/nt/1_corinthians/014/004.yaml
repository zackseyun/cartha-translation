base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: id
  text: Orang yang berbicara dalam bahasa lidah[a] membangun dirinya sendiri[b], tetapi orang yang bernubuat membangun jemaat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam suatu bahasa.” Dalam pasal ini, istilah tersebut tampaknya merujuk pada karunia berbicara dalam bahasa lidah; hakikat ujaran itu secara tepat masih diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dirinya”; bentuk tunggal ini digunakan secara representatif.
    reason: lexical_alternative
  - marker: c
    text: Atau “perkumpulan” atau “sidang jemaat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Orang yang berbicara
  rationale: Artikel dengan partisipel kini berfungsi substantival dan menunjuk secara representatif kepada siapa pun yang melakukan tindakan itu; bentuk ini juga mempertahankan kesejajaran dengan 'orang yang bernubuat'.
- source_word: γλώσσῃ
  choice: dalam bahasa lidah
  rationale: Bentuk datif tunggal tanpa artikel dipertahankan secara wajar. 'Bahasa lidah' merupakan istilah yang dikenal dalam konteks karunia rohani, sementara catatan kaki menjaga kemungkinan arti 'suatu bahasa' dan tidak menetapkan secara sempit hakikat ujarannya.
- source_word: ἑαυτὸν
  choice: dirinya sendiri
  rationale: Kata ganti refleksif tunggal diterjemahkan secara alami dalam bahasa Indonesia tanpa menambahkan penandaan gender yang tidak diperlukan oleh tata bahasa Indonesia.
- source_word: οἰκοδομεῖ
  choice: membangun
  rationale: Kata ini digunakan secara metaforis untuk menguatkan atau memberi pertumbuhan rohani. 'Membangun' mempertahankan gambaran sumber dan dapat berlaku baik pada diri sendiri maupun jemaat.
- source_word: ὁ δὲ προφητεύων
  choice: tetapi orang yang bernubuat
  rationale: Partisipel substantival diterjemahkan sejajar dengan klausa pertama, sedangkan δέ dinyatakan dengan 'tetapi' untuk menunjukkan kontras ringan.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Dalam konteks ibadah bersama di 1 Korintus 14, kata ini menunjuk komunitas orang percaya yang berkumpul. 'Jemaat' alami dalam bahasa Indonesia dan tidak mengesankan gedung atau lembaga.
theological_decisions:
- issue: Makna γλώσσῃ dalam konteks 1 Korintus 12–14
  choice: bahasa lidah
  alternative: suatu bahasa; bahasa asing; ujaran ekstatis
  rationale: Konteks membahas karunia γλῶσσα dalam ibadah jemaat, tetapi hakikat tepat ujaran itu diperdebatkan. Istilah yang dipilih mengenali konteks karunia tersebut tanpa menentukan apakah ujaran itu bahasa manusia asing atau bentuk ujaran lain.
- issue: Bentuk maskulin tunggal yang bersifat representatif
  choice: orang yang ... dirinya sendiri
  alternative: laki-laki yang ... dirinya sendiri; siapa yang ... dirinya sendiri
  rationale: Bahasa Indonesia tidak menandai gender pada 'orang' atau 'dirinya'. Terjemahan ini mempertahankan ketunggalan dan sifat representatif bentuk Yunani tanpa secara keliru membatasi prinsip tersebut hanya kepada laki-laki.
- issue: Sifat 'membangun diri sendiri'
  choice: menerjemahkan secara netral tanpa menambahkan penilaian moral
  alternative: menguatkan dirinya sendiri; hanya membangun dirinya sendiri
  rationale: Ayat ini menyatakan kontras antara manfaat bagi diri dan manfaat bagi jemaat, tetapi tidak secara eksplisit menambahkan 'hanya' atau menyebut tindakan pertama salah. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan layak dibacakan dalam ibadah. Struktur paralel Yunani dipertahankan, dengan istilah 'bahasa lidah' yang dikenal luas serta 'jemaat' untuk komunitas yang berkumpul. Penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkan.
