  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: id
  text: Dalam Hukum Taurat tertulis, “Melalui orang-orang yang berbahasa lain dan melalui bibir orang-orang asing Aku akan berbicara kepada umat ini[a], tetapi bahkan dengan cara demikian pun mereka tidak akan mendengarkan Aku[b],” demikianlah firman Tuhan.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan bahasa-bahasa lain dan dengan bibir orang-orang lain.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka tidak akan mengindahkan Aku.”
    reason: lexical_alternative
  - marker: c
    text: Kutipan ini menggemakan Yesaya 28:11–12.
    reason: cross_reference
  - marker: d
    text: Karena kutipan ini merupakan ucapan Allah Israel, sebagian terjemahan memakai “TUHAN” untuk mencerminkan latar belakang teks Ibraninya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Dalam Hukum Taurat
  rationale: νόμος di sini menunjuk pada kumpulan Kitab Suci Yahudi secara luas meskipun kutipannya berasal dari Yesaya. Ungkapan ini mempertahankan istilah Paulus dan merupakan bentuk yang lazim dipahami dalam bahasa Indonesia.
- source_word: γέγραπται
  choice: tertulis
  rationale: Padanan baku dan ringkas bagi formula perfektum pasif yang memperkenalkan kutipan Kitab Suci.
- source_word: ἐν ἑτερογλώσσοις
  choice: Melalui orang-orang yang berbahasa lain
  rationale: Adjektiva ini menyatakan bahasa yang berbeda; penambahan 'orang-orang' membuat sarana berbicara tersampaikan secara alami sekaligus mempertahankan kaitannya dengan pembahasan bahasa-bahasa dalam konteks pasal ini.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: melalui bibir orang-orang asing
  rationale: Mempertahankan gambaran konkret 'bibir' dan menjelaskan bahwa yang dimaksud ialah orang dari bangsa atau bahasa lain.
- source_word: λαλήσω
  choice: Aku akan berbicara
  rationale: Padanan masa depan yang langsung, alami, dan sesuai untuk ucapan ilahi.
- source_word: τῷ λαῷ τούτῳ
  choice: kepada umat ini
  rationale: λαός berarti 'rakyat/umat' dan dalam kutipan Kitab Suci menunjuk kepada umat perjanjian; 'umat' menyampaikan nuansa itu tanpa mengubahnya menjadi istilah yang lebih sempit.
- source_word: οὐδ’ οὕτως
  choice: tetapi bahkan dengan cara demikian pun
  rationale: 'Mengungkapkan penekanan οὐδέ dan οὕτως: sekalipun Allah berbicara dengan cara tersebut, tanggapan yang diharapkan tetap tidak muncul.'
- source_word: εἰσακούσονταί μου
  choice: mereka tidak akan mendengarkan Aku
  rationale: εἰσακούω dapat berarti mendengar dengan perhatian atau mengindahkan. 'Mendengarkan' alami dalam bahasa Indonesia dan tetap memberi ruang bagi nuansa ketaatan.
- source_word: λέγει κύριος
  choice: demikianlah firman Tuhan
  rationale: Formula kutipan ini diterjemahkan dengan ungkapan Indonesia yang wajar dan khidmat, sementara κύριος tetap diterjemahkan 'Tuhan' sesuai bentuk teks Yunani.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan ucapan Allah Israel
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, bukan nama ilahi Ibrani. Karena itu teks utama memakai 'Tuhan', sedangkan latar belakang Ibrani yang dapat mendukung 'TUHAN' dicatat dalam catatan kaki.
- issue: Cakupan νόμος ketika kutipan berasal dari Yesaya
  choice: Hukum Taurat
  alternative: Kitab Suci
  rationale: Paulus memakai νόμος dalam arti luas bagi Kitab Suci Yahudi. Pilihan utama mempertahankan istilah khasnya dan ketegangan bahwa kutipan berasal dari Yesaya, tanpa diam-diam menggantinya dengan istilah yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur kutipan dipertahankan, sedangkan formula penutup diterjemahkan secara idiomatis sebagai 'demikianlah firman Tuhan'. Kapitalisasi 'Aku' mengikuti rujukan langsung kepada Allah dan membantu kejelasan pembicara.
