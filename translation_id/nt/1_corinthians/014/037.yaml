  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: id
  text: Jika seseorang menganggap dirinya seorang nabi atau orang yang rohani, hendaklah ia mengakui bahwa apa yang kutuliskan kepadamu adalah perintah Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “adalah milik Tuhan” atau “berasal dari Tuhan.” Secara harfiah, bahasa Yunani berbunyi “adalah dari Tuhan/milik Tuhan”; kata “perintah” ditambahkan untuk memperjelas maksudnya.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: menganggap dirinya
  rationale: Dalam konteks ini, kata tersebut menyatakan penilaian atau pengakuan seseorang tentang dirinya sendiri; pilihan ini juga mempertahankan nada korektif Paulus.
- source_word: προφήτης
  choice: seorang nabi
  rationale: Padanan baku dan jelas dalam konteks karunia rohani serta perkataan nubuat.
- source_word: πνευματικός
  choice: orang yang rohani
  rationale: Adjektiva Yunani dipakai secara substantival dan dapat menunjuk kepada orang yang menganggap dirinya memiliki karunia atau dipimpin oleh Roh. Terjemahan ini mempertahankan keluasan maknanya.
- source_word: ἐπιγινωσκέτω
  choice: hendaklah ia mengakui
  rationale: Bentuk imperatif ini menuntut pengakuan terhadap kewibawaan petunjuk Paulus, bukan sekadar pengetahuan dalam pikiran.
- source_word: ἃ γράφω ὑμῖν
  choice: apa yang kutuliskan kepadamu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan kala kini epistoler tanpa kekakuan.
- source_word: κυρίου ἐστίν
  choice: adalah perintah Tuhan
  rationale: Bahasa Yunani secara harfiah berbunyi 'adalah milik/dari Tuhan' dan bersifat eliptis. Dalam konteksnya, 'perintah' menjelaskan kewibawaan ilahi yang dimaksud, sementara catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Daya eliptis frasa κυρίου ἐστίν
  choice: adalah perintah Tuhan
  alternative: adalah milik Tuhan; berasal dari Tuhan
  rationale: Konteks menegaskan bahwa petunjuk tertulis Paulus harus diakui sebagai sesuatu yang berwibawa dari Tuhan. Kata 'perintah' membuat maksud itu jelas, tetapi karena nomina tersebut tidak tertulis dalam bahasa Yunani, bentuk yang lebih harfiah dicatat sebagai alternatif.
- issue: Rujukan individual dalam τις ... προφήτης ... πνευματικός
  choice: seseorang ... ia
  alternative: barang siapa ... dia
  rationale: Bahasa Indonesia tidak menandai gender pada 'seseorang' dan 'ia'; bentuk tunggal individual tetap dipertahankan tanpa menambahkan penandaan gender yang tidak diperlukan oleh tata bahasa sasaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kutuliskan' menjaga kelancaran ungkapan surat, sedangkan 'hendaklah ia mengakui' mempertahankan daya imperatif dan nada korektif ayat.
