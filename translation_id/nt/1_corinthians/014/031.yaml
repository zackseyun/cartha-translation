  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: id
  text: Sebab kamu semua dapat bernubuat seorang demi seorang, supaya semua belajar dan semua didorong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinasihati” atau “dihibur”; kata kerja Yunani ini dapat mengandung nuansa dorongan, nasihat, atau penghiburan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: dapat
  rationale: Bentuk kini indikatif orang kedua jamak menyatakan kemampuan atau kemungkinan; “dapat” alami dan tepat dalam konteks petunjuk praktis.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi petunjuk sebelumnya; “sebab” mempertahankan hubungan logis itu.
- source_word: καθ’ ἕνα
  choice: seorang demi seorang
  rationale: Ungkapan ini menunjukkan giliran secara berurutan, yaitu satu orang pada satu waktu. Pilihan ini mempertahankan unsur personal dari ἕνα dan cocok dengan konteks pertemuan jemaat.
- source_word: πάντες
  choice: semua
  rationale: Kata ini muncul tiga kali sebagai penekanan. “Semua” mempertahankan pengulangan dan tidak mempersempit kelompok yang dimaksud melampaui teks Yunani.
- source_word: προφητεύειν
  choice: bernubuat
  rationale: Padanan baku yang mempertahankan kategori kegiatan yang disebut Paulus tanpa menguraikannya secara lebih sempit.
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang dimaksud; “supaya” merupakan padanan Indonesia yang alami.
- source_word: μανθάνωσιν
  choice: belajar
  rationale: Subjungtif kini dalam klausa ἵνα menyatakan tujuan agar semua memperoleh pembelajaran; dalam bahasa Indonesia modalitasnya sudah ditandai secara alami oleh “supaya”.
- source_word: παρακαλῶνται
  choice: dikuatkan
  rationale: Kata kerja pasif παρακαλέω dapat mencakup dorongan, nasihat, penghiburan, dan penguatan. “Dikuatkan” cukup luas untuk menyampaikan dampak yang membangun dalam konteks ini tanpa membatasinya hanya pada teguran atau penghiburan.
theological_decisions:
- issue: Cakupan πάντες (“semua”) dalam petunjuk bagi pertemuan jemaat
  choice: Mempertahankan “semua” pada ketiga kemunculannya tanpa menambahkan “kamu” atau “para nabi”.
  alternative: “kamu semua” pada seluruh kemunculan, atau “semua nabi” pada kemunculan pertama
  rationale: Kemunculan pertama kemungkinan menunjuk kepada mereka yang dapat bernubuat, sedangkan dua kemunculan berikutnya menunjuk kepada para peserta atau pendengar. Teks terjemahan mempertahankan keluasan dan pengulangan retoris bahasa Yunani sehingga kontekslah yang menentukan rujukannya.
- issue: Nuansa teologis dan pastoral παρακαλῶνται
  choice: dikuatkan
  alternative: didorong, dinasihati, atau dihibur
  rationale: Bahasa Yunani memungkinkan beberapa nuansa tersebut. “Dikuatkan” mempertahankan dampak membangun yang luas dari nubuat dalam jemaat, sementara catatan kaki menjaga alternatif yang sungguh ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan “seorang demi seorang” dipilih sebagai ungkapan alami untuk tindakan bergiliran. Pengulangan “semua” dipertahankan untuk mencerminkan penekanan teks Yunani.
