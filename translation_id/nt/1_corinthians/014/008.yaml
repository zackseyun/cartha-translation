  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: id
  text: Sebab, jika trompet mengeluarkan bunyi yang tidak jelas[a], siapa yang akan bersiap untuk bertempur[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi yang tidak dapat dibedakan dengan jelas.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: Gabungan partikel ini memperkenalkan alasan atau penjelasan. “Sebab” menyampaikan fungsi tersebut secara wajar tanpa membebani kalimat.
- source_word: ἐὰν
  choice: jika
  rationale: Kata ini memperkenalkan syarat dalam ilustrasi retoris Paulus; “jika” adalah padanan Indonesia yang langsung dan alami.
- source_word: ἄδηλον
  choice: tidak jelas
  rationale: Kata ini berarti tidak terang atau tidak dapat dibedakan dengan pasti. “Tidak jelas” alami dalam bahasa Indonesia modern dan sesuai dengan konteks isyarat yang gagal dipahami.
- source_word: φωνὴν
  choice: bunyi
  rationale: Dalam hubungannya dengan trompet, φωνή menunjuk pada bunyi yang dihasilkan, bukan suara manusia.
- source_word: σάλπιγξ
  choice: trompet
  rationale: Dalam konteks ini, kata tersebut menunjuk pada alat tiup yang dipakai memberi isyarat militer. “Trompet” mudah dipahami pembaca modern dan tidak searkais “nafiri”.
- source_word: δῷ
  choice: mengeluarkan
  rationale: Secara harfiah berarti “memberikan”, tetapi kolokasi Indonesia yang alami untuk alat musik adalah “mengeluarkan bunyi”; citra sumber tetap dipertahankan tanpa ungkapan yang kaku.
- source_word: τίς
  choice: siapa
  rationale: Kata tanya ini membentuk pertanyaan retoris dan diterjemahkan langsung dengan “siapa”.
- source_word: παρασκευάσεται
  choice: akan bersiap
  rationale: Bentuk medialnya menyiratkan bahwa orang itu mempersiapkan dirinya. “Akan bersiap” menyampaikan nuansa refleksif tersebut secara ringkas dan alami.
- source_word: εἰς πόλεμον
  choice: untuk bertempur
  rationale: Ungkapan ini secara harfiah mengarah kepada perang, tetapi dalam konteks bunyi isyarat militer, “untuk bertempur” menyatakan kesiapan memasuki pertempuran secara idiomatis.
