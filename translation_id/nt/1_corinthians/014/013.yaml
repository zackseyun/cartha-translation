  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: id
  text: Karena itu, orang yang berbicara dalam bahasa lidah[a] hendaklah berdoa agar ia dapat menafsirkannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam suatu bahasa.” Secara harfiah, bahasa Yunani memakai kata “lidah,” istilah yang lazim dalam pasal ini untuk ujaran yang memerlukan penafsiran.'
    reason: lexical_alternative
  - marker: b
    text: “Menafsirkannya” dapat juga diterjemahkan “menerjemahkannya,” yakni menyampaikan maknanya supaya dapat dimengerti.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Konjungsi ini menarik kesimpulan dari pembahasan sebelumnya; “Karena itu” mempertahankan hubungan logis tersebut secara wajar dalam bahasa Indonesia.
- source_word: ὁ λαλῶν
  choice: orang yang berbicara
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang sedang atau biasa berbicara demikian.
- source_word: γλώσσῃ
  choice: dalam bahasa lidah
  rationale: Bentuk tunggal dipertahankan. Istilah “bahasa lidah” menjaga kaitan sastra dengan pembahasan karunia ini dalam 1 Korintus 12–14 tanpa memastikan apakah yang dimaksud ialah bahasa manusia tertentu, ujaran ekstatis, atau kategori yang lebih luas.
- source_word: προσευχέσθω
  choice: hendaklah berdoa
  rationale: Imperatif orang ketiga kini menyampaikan dorongan atau perintah yang berkelanjutan; “hendaklah” terasa wajar, tegas, dan bermartabat.
- source_word: ἵνα
  choice: agar
  rationale: Kata ini memperkenalkan tujuan atau isi doa; “agar” mempertahankan nuansa tujuan dengan ringkas.
- source_word: διερμηνεύῃ
  choice: ia dapat menafsirkannya
  rationale: Kata kerja ini berarti menyampaikan ujaran itu secara dapat dimengerti oleh orang lain. “Menafsirkan” sesuai dengan perhatian pasal ini pada pemahaman jemaat, sedangkan akhiran “-nya” merujuk secara alami kepada bahasa lidah yang diucapkan.
theological_decisions:
- issue: Makna γλώσσῃ dalam konteks 1 Korintus 12–14
  choice: bahasa lidah
  alternative: bahasa
  rationale: Pilihan utama mempertahankan istilah khas dalam pembahasan Paulus dan tidak lebih dahulu memutuskan hakikat fenomena tersebut. Alternatif leksikal dicatat dalam catatan kaki.
- issue: Pelaku yang menafsirkan
  choice: ia dapat menafsirkannya
  alternative: dapat ditafsirkan
  rationale: Bentuk verba Yunani aktif tunggal paling alami merujuk kembali kepada orang yang berbicara. Bentuk pasif akan mengaburkan hubungan sintaksis itu. Kata ganti Indonesia tidak menandai gender, sehingga cakupan generiknya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan bentuk kesimpulan, pelaku tunggal yang generik, serta hubungan tujuan dalam teks Yunani. Istilah “bahasa lidah” dipakai untuk menjaga ambiguitas dan kesinambungan istilah dalam pasal ini.
