  terminology: Istilah “bahasa lidah” dan “menafsirkan” menjaga kesinambungan terminologis dengan pembahasan karunia bahasa lidah dan penafsiran dalam 1 Korintus 12–14. Terjemahan ini tidak memasukkan penafsiran doktrinal tertentu mengenai apakah γλῶσσα adalah bahasa manusia atau ujaran ekstatis.
