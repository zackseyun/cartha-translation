  source_fidelity: 'Teks secara akurat mencerminkan struktur dan makna Yunani: Διὸ diterjemahkan sebagai kesimpulan (“Karena itu”), ὁ λαλῶν γλώσσῃ sebagai pelaku generik tunggal yang berbicara dalam bahasa lidah, προσευχέσθω mempertahankan daya imperatif (“hendaklah berdoa”), dan ἵνα διερμηνεύῃ menyatakan tujuan doa. Kata ganti “ia” dengan tepat tidak membatasi pelaku berdasarkan gender, sementara tetap mempertahankan rujukan tunggal generik.'
