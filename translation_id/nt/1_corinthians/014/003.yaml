  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: id
  text: Namun, orang yang bernubuat berbicara kepada orang-orang untuk membangun, menguatkan, dan menghibur.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pembangunan”; juga dapat diterjemahkan “membangun” atau “meneguhkan”.
    reason: lexical_alternative
  - marker: b
    text: “Menguatkan” menerjemahkan παράκλησις, yang juga dapat berarti “mendorong”, “menasihati”, atau, dalam konteks tertentu, “menghibur”.
    reason: lexical_alternative
  - marker: c
    text: “Menghibur” menerjemahkan παραμυθία, yang juga dapat diterjemahkan “memberikan penghiburan” atau “menghibur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Namun, orang yang bernubuat
  rationale: Partisipel kini berartikel berfungsi sebagai nomina, yaitu orang yang melakukan tindakan tersebut. “Bernubuat” mempertahankan keluasan istilah Yunani tanpa mempersempitnya menjadi berkhotbah atau meramalkan. δέ diterjemahkan “Namun” untuk menyatakan kontras ringan dengan ayat sebelumnya.
- source_word: ἀνθρώποις
  choice: kepada orang-orang
  rationale: Bentuk datif jamak menunjukkan penerima perkataan dan bersifat umum, bukan khusus laki-laki.
- source_word: λαλεῖ
  choice: berbicara
  rationale: Padanan langsung dan alami untuk bentuk kini λαλεῖ; relasi dengan penerimanya dinyatakan melalui “kepada”.
- source_word: οἰκοδομὴν
  choice: untuk membangun
  rationale: 'Dalam pemakaian Paulus, kata ini sering bermakna kiasan: membangun atau meneguhkan kehidupan rohani. “Membangun” lebih mudah dipahami pembaca modern daripada “membina” atau “peneguhan,” sementara “untuk” menyatakan fungsi atau hasil perkataan itu.'
- source_word: παράκλησιν
  choice: menguatkan
  rationale: παράκλησις dapat berarti dorongan, nasihat, penguatan, atau penghiburan. “Menguatkan” alami dalam rangkaian verbal ini dan membedakannya dari nuansa menenangkan pada παραμυθία.
- source_word: παραμυθίαν
  choice: menghibur
  rationale: Kata ini menunjuk pada perkataan yang menenangkan, menghibur, atau memberi pelipur. “Menghibur” merupakan padanan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Makna “bernubuat” dalam pertemuan jemaat
  choice: Mempertahankan “bernubuat” tanpa mempersempit artinya.
  alternative: “berkhotbah”, “menyampaikan penyataan”, atau “meramalkan”
  rationale: Ayat ini menjelaskan dampak nubuat bagi orang lain, tetapi tidak memberikan definisi yang membenarkan penerjemah untuk membatasinya pada salah satu pengertian teologis tertentu.
- issue: Hubungan tiga nomina setelah λαλεῖ
  choice: Menyatakannya sebagai tujuan atau fungsi dengan “untuk membangun, menguatkan, dan menghibur.”
  alternative: “menyampaikan pembangunan, penguatan, dan penghiburan”
  rationale: Bahasa Yunani memakai tiga nomina akusatif tanpa preposisi. Terjemahan verbal dengan “untuk” menyampaikan fungsi yang tersirat secara alami, tanpa menetapkan secara berlebihan apakah nuansanya semata-mata tujuan, isi, atau hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang sederhana, bermartabat, dan mudah dipahami. Tiga nomina abstrak Yunani dialihkan menjadi verba sejajar agar alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan informasi leksikal dan perbedaan nuansa masing-masing istilah.
