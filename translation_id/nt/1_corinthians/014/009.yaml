    rationale: Metafora berbicara ke udara memang menyiratkan kesia-siaan, tetapi penambahan “hanya” memberi penegasan tambahan. Sebaiknya implikasi retoris itu dibiarkan muncul dari metafora sumber.
  - severity: low
    issue: “Berbicara kepada udara” kurang mempertahankan arah metafora εἰς ἀέρα.
    rationale: εἰς secara harfiah berarti “ke/dalam.” “Berbicara ke udara” lebih dekat kepada citra ujaran yang tidak sampai kepada pendengar, sekaligus tetap alami dalam bahasa Indonesia.
