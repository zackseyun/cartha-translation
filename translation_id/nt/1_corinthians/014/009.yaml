  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: id
  text: 'Demikian juga dengan kamu: jika dengan lidah kamu tidak mengucapkan perkataan yang dapat dimengerti[a], bagaimana apa yang dikatakan akan dipahami? Sebab kamu akan berbicara ke udara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan yang jelas” atau “pesan yang dapat dikenali.” Istilah Yunani ini menekankan ujaran yang jelas dan dapat dipahami oleh pendengar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga dengan kamu
  rationale: Mempertahankan kaitan perbandingan dengan gambaran sebelumnya dan menerapkannya langsung kepada jemaat Korintus dalam bahasa Indonesia yang wajar.
- source_word: διὰ τῆς γλώσσης
  choice: dengan lidahmu
  rationale: Mempertahankan gambaran konkret 'lidah' dan menyatakan sarana ujaran; bentuk posesif tersirat wajar karena subjeknya orang kedua jamak.
- source_word: εὔσημον λόγον
  choice: perkataan yang dapat dimengerti
  rationale: Menyampaikan arti ujaran yang jelas, dikenali, dan dipahami pendengar tanpa mempersempit λόγον menjadi satu kata saja.
- source_word: δῶτε
  choice: mengucapkan
  rationale: Dalam konteks komunikasi lisan, padanan idiomatis ini menyampaikan tindakan menghasilkan ujaran, meski lebih dinamis daripada arti harfiah 'memberikan'.
- source_word: πῶς γνωσθήσεται
  choice: bagaimana orang akan memahami
  rationale: Bentuk pasif Yunani diungkapkan secara alami dengan subjek umum 'orang'; konteks menuntut arti memahami ujaran, bukan sekadar mengetahui fakta.
- source_word: τὸ λαλούμενον
  choice: apa yang dikatakan
  rationale: Mempertahankan bentuk pasif dan cakupan substantival partisipel secara alami.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Sebab kamu hanya akan berbicara kepada udara
  rationale: Mempertahankan metafora ujaran yang tidak mencapai atau dipahami pendengar. 'Hanya' memperjelas kesia-siaan yang tersirat tanpa mengganti citra udara.
theological_decisions: []
