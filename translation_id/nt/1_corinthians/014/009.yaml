  source_fidelity: Secara umum setia kepada teks Yunani. Namun, «hanya» menambahkan penegasan yang tidak dinyatakan secara eksplisit dalam ἔσεσθε ... λαλοῦντες, dan «kepada udara» lebih mengarah kepada penerima ujaran daripada citra arah εἰς ἀέρα (“ke/dalam udara”).
  naturalness: Bahasa draf sudah baku dan mudah dipahami. Susunan revisi mempertahankan kelancaran bahasa Indonesia sambil membiarkan bentuk pasif pertanyaan retoris lebih dekat dengan Yunani.
  terminology: “Lidah,” “perkataan yang dapat dimengerti,” dan “apa yang dikatakan” merupakan padanan yang sesuai dalam konteks ini. Catatan kaki dapat tetap menyajikan alternatif leksikal tanpa mengunci makna secara berlebihan.
