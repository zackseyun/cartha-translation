  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: id
  text: Jika seseorang berkata-kata dengan bahasa lidah[a], hendaklah hanya dua atau paling banyak tiga orang yang berbicara, seorang demi seorang, dan hendaklah seorang menafsirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan suatu bahasa.” Istilah Yunani yang diterjemahkan “lidah” dapat berarti lidah atau bahasa. Di sini, “bahasa lidah” mempertahankan istilah yang sudah digunakan Paulus dalam pasal ini tanpa menentukan hakikat karunia tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: dalam bahasa lidah
  rationale: Dalam konteks 1 Korintus 12–14, ungkapan ini menunjuk pada fenomena karunia yang lazim disebut 'bahasa lidah' dalam bahasa Indonesia. Pilihan ini tidak menentukan apakah yang dimaksud adalah bahasa manusia atau bentuk ujaran lain.
- source_word: τις
  choice: ada yang
  rationale: Pronomina tak tentu ini bersifat umum; 'ada yang' terdengar alami dalam kalimat bersyarat bahasa Indonesia.
- source_word: λαλεῖ
  choice: berbicara
  rationale: Bentuk kini dalam kondisi umum secara alami diterjemahkan dengan verba sederhana 'berbicara'.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: hendaklah dua orang, atau paling banyak tiga orang, berbicara
  rationale: Ungkapan ini membatasi jumlah pembicara. Penambahan kembali verba 'berbicara' membuat perintahnya jelas dan wajar dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: ἀνὰ μέρος
  choice: seorang demi seorang
  rationale: Ungkapan distributif ini menyatakan bahwa mereka harus berbicara secara bergiliran, bukan serentak.
- source_word: εἷς
  choice: satu orang
  rationale: Numeralia ini dipakai secara substantival dan menunjuk kepada satu orang yang melakukan penafsiran.
- source_word: διερμηνευέτω
  choice: hendaklah ... menafsirkannya
  rationale: Verba imperatif ini meminta agar ujaran tersebut dibuat dapat dipahami oleh jemaat. 'Menafsirkan' mempertahankan istilah yang mapan dan tidak mempersempit maknanya hanya menjadi penerjemahan biasa.
theological_decisions:
- issue: Makna γλώσσῃ dalam konteks karunia Roh
  choice: Menggunakan 'bahasa lidah' tanpa menetapkan hakikat ujaran tersebut.
  alternative: Menggunakan 'bahasa', atau menafsirkannya secara khusus sebagai bahasa manusia asing maupun ujaran ekstatis.
  rationale: Konteksnya jelas membahas karunia bahasa lidah, tetapi ayat ini sendiri tidak menyelesaikan perdebatan mengenai hakikatnya. Terjemahan utama dan catatan kaki mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruktif dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara pembatasan jumlah, giliran berbicara, dan keharusan penafsiran tetap dipertahankan.
