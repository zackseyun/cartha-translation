id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: id
  text: Jadi, jika aku tidak mengetahui arti bunyi itu[a], bagi orang yang berbicara aku akan menjadi orang asing[b], dan bagiku orang yang berbicara itu akan menjadi orang asing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daya bunyi itu”; maksudnya ialah makna atau pengertian yang disampaikan oleh bunyi tersebut.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “barbar”; di sini berarti orang yang bahasanya asing atau tidak dapat dimengerti, bukan orang yang tidak beradab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Jadi, jika
  rationale: Menyampaikan hubungan kesimpulan οὖν dan syarat ἐὰν secara alami dalam bahasa Indonesia.
- source_word: μὴ εἰδῶ
  choice: aku tidak mengetahui
  rationale: Mempertahankan arti dasar οἶδα, sementara konteks menjelaskan bahwa yang tidak diketahui ialah arti bunyi tersebut.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: arti bunyi itu
  rationale: Dalam konteks ini δύναμις menunjuk pada makna atau nilai komunikatif, sedangkan φωνή dapat berarti bunyi atau suara. 'Bunyi' sesuai dengan pembahasan tentang bunyi yang harus dapat dimengerti.
- source_word: τῷ λαλοῦντι
  choice: bagi orang yang berbicara
  rationale: Mencerminkan datif relasional dan partisipel kini dengan ungkapan Indonesia yang jelas.
- source_word: βάρβαρος
  choice: orang asing
  rationale: Di sini kata tersebut menandai keterasingan bahasa atau ketidakmampuan untuk saling memahami, bukan sifat biadab.
- source_word: ἐν ἐμοὶ
  choice: bagiku
  rationale: Menyampaikan relasi timbal balik dari sudut pandang penutur secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'aku' dipakai untuk mempertahankan suara pribadi Paulus. Susunan timbal balik dipertahankan agar penekanan ayat tetap terasa.
