source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: id
  text: Namun, jika tidak ada penafsir, hendaklah orang itu berdiam diri dalam pertemuan jemaat[a] dan berbicara kepada dirinya sendiri dan kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam jemaat”; dapat juga diterjemahkan “dalam perkumpulan” atau “dalam perhimpunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διερμηνευτής
  choice: penafsir
  rationale: Dalam konteks karunia bahasa, kata ini menunjuk kepada orang yang menyampaikan makna ujaran itu agar dapat dipahami orang lain. “Penafsir” wajar dalam bahasa Indonesia dan tidak membatasi kegiatannya pada penerjemahan bahasa biasa.
- source_word: σιγάτω
  choice: hendaklah orang itu berdiam diri
  rationale: Imperatif orang ketiga tunggal ini menyatakan perintah. Bentuk ini mempertahankan daya perintah sekaligus terdengar alami dan bermartabat.
- source_word: ἐν ἐκκλησίᾳ
  choice: dalam pertemuan jemaat
  rationale: Konteks 1 Korintus 14 adalah jemaat Kristen yang sedang berkumpul. Pilihan ini menonjolkan suasana pertemuan, bukan gedung atau lembaga.
- source_word: ἑαυτῷ
  choice: kepada dirinya sendiri
  rationale: Menerjemahkan kata ganti refleksif secara langsung tanpa menambahkan gagasan seperti “secara pribadi” atau “dalam hati,” yang tidak dinyatakan secara eksplisit.
- source_word: λαλείτω
  choice: berbicara
  rationale: Padanan netral bagi imperatif yang melanjutkan petunjuk mengenai ujaran, dengan ragam yang sesuai untuk teks Kitab Suci.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif ini merupakan sasaran ujaran dan secara langsung menunjukkan bahwa perkataan itu ditujukan kepada Allah.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Namun, jika tidak ada
  rationale: Menyampaikan klausa bersyarat secara idiomatis dalam bahasa Indonesia sambil mempertahankan kontras δέ dengan ayat sebelumnya.
theological_decisions:
- issue: Cakupan perintah untuk berdiam diri dalam ibadah jemaat
  choice: Perintah tersebut membatasi ujaran publik dalam pertemuan jemaat ketika tidak ada penafsir, tetapi teks masih memerintahkan orang itu untuk berbicara kepada dirinya sendiri dan kepada Allah.
  alternative: Orang itu harus menghentikan segala bentuk ujaran sama sekali; atau ia boleh tetap berbicara dengan suara yang ditujukan kepada seluruh jemaat.
  rationale: Kontras antara berdiam diri dalam pertemuan jemaat dan berbicara kepada diri sendiri serta kepada Allah menunjukkan pembatasan terhadap ujaran publik, bukan larangan mutlak atas segala ujaran. Terjemahan tidak menentukan apakah ujaran terakhir itu terdengar atau hanya batiniah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pertemuan jemaat” dipilih untuk memperjelas bahwa ἐκκλησία di sini merujuk pada jemaat yang berkumpul. Frasa “kepada dirinya sendiri” dipertahankan tanpa tambahan “dalam hati” agar ambiguitas mengenai cara berbicara tidak diselesaikan oleh terjemahan.
