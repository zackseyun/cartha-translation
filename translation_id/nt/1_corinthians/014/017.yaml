  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: id
  text: Sebab engkau memang mengucap syukur dengan baik, tetapi orang lain itu tidak dibangun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak diteguhkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: engkau
  rationale: Kata ganti orang kedua tunggal dipertahankan secara eksplisit; bentuk ini sesuai dengan sapaan langsung Paulus kepada seorang individu dalam konteks jemaat.
- source_word: μὲν γὰρ
  choice: sebab ... memang
  rationale: “Sebab” menyampaikan fungsi penjelas γάρ, sedangkan “memang” mempertahankan pengakuan yang mempersiapkan pertentangan μέν ... ἀλλά.
- source_word: καλῶς
  choice: dengan baik
  rationale: Ungkapan ini secara alami menyampaikan penilaian positif ‘dengan baik/semestinya’ tanpa menambahkan gagasan lain.
- source_word: εὐχαριστεῖς
  choice: mengucap syukur
  rationale: Dalam konteks doa dan perkataan di pertemuan jemaat, verba ini berarti menyampaikan syukur, secara tersirat kepada Allah.
- source_word: ἀλλ’
  choice: tetapi
  rationale: Konjungsi adversatif ini memperkenalkan kontras utama antara tindakan orang yang mengucap syukur dan dampaknya bagi orang lain.
- source_word: ὁ ἕτερος
  choice: orang lain
  rationale: Merujuk pada peserta atau pendengar lain dalam pertemuan; terjemahan ini wajar dalam bahasa Indonesia dan tidak mempersempit identitas orang tersebut.
- source_word: οὐκ οἰκοδομεῖται
  choice: tidak dibangun
  rationale: Bentuk pasif dan metafora pembangunan Paulus dipertahankan; dalam konteks ini metafora tersebut menunjuk pada penguatan atau pertumbuhan rohani.
theological_decisions:
- issue: Metafora Paulus οἰκοδομέω dalam konteks jemaat
  choice: tidak dibangun
  alternative: tidak diteguhkan
  rationale: Pilihan utama mempertahankan gambaran pembangunan yang dipakai Paulus serta kepasifannya, tanpa membatasi maknanya pada satu jenis manfaat rohani. Alternatif menjelaskan makna kontekstualnya dengan bahasa yang lebih langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk mempertahankan bentuk tunggal σὺ. Susunan “sebab ... memang ... tetapi” menjaga hubungan penjelasan sekaligus kontras dalam teks Yunani.
