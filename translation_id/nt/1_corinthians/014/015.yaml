id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: id
  text: Jadi, apakah kesimpulannya? Aku akan berdoa dengan roh[a], tetapi aku juga akan berdoa dengan akal budi[b]; aku akan menyanyikan pujian[c] dengan roh, tetapi aku juga akan menyanyikan pujian dengan akal budi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam roh” atau “oleh roh”. Bahasa Yunani tidak menyatakan secara tegas apakah “roh” di sini secara khusus menunjuk pada Roh Kudus, roh orang yang berbicara, atau ungkapan rohani.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan pengertian”.
    reason: lexical_alternative
  - marker: c
    text: Atau “bernyanyi” atau “bermazmur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Jadi, apakah kesimpulannya?
  rationale: Ungkapan ini secara retoris menanyakan kesimpulan praktis dari pembahasan sebelumnya. Terjemahan ini alami dalam bahasa Indonesia dan lebih jelas daripada bentuk harfiah 'Jadi, apakah itu?'.
- source_word: προσεύξομαι
  choice: aku akan berdoa
  rationale: Bentuk futurum προσεύχομαι secara langsung menyatakan tekad atau tindakan yang akan dilakukan; di sini tidak diperlukan bentuk refleksif khusus dalam bahasa Indonesia.
- source_word: τῷ πνεύματι
  choice: dengan roh
  rationale: Pilihan ini mempertahankan kesejajaran datif dengan 'dengan akal budi' dan tidak menentukan apakah roh yang dimaksud adalah Roh Kudus, roh manusia, atau ungkapan rohani.
- source_word: τῷ νοΐ
  choice: dengan akal budi
  rationale: νοῦς menunjuk pada kemampuan berpikir dan memahami. 'Akal budi' merupakan ungkapan Indonesia yang wajar dan bermartabat serta menjaga kontras dengan 'roh'.
- source_word: ψαλῶ
  choice: aku akan menyanyikan pujian
  rationale: Dalam konteks ibadah, ψάλλω menunjuk pada bernyanyi sebagai pujian. Pilihan ini menyampaikan nuansa ibadah lebih jelas daripada sekadar 'bernyanyi'.
- source_word: δὲ καὶ
  choice: tetapi aku juga akan
  rationale: 'Gabungan ini menyatakan penambahan dengan kontras ringan: bukan hanya dengan roh, melainkan juga dengan akal budi.'
theological_decisions:
- issue: Makna πνεῦμα dalam kontras antara roh dan akal budi
  choice: Diterjemahkan secara umum sebagai 'roh' tanpa kapitalisasi atau penjelasan identitas dalam teks utama.
  alternative: '''Roh'', ''rohku'', atau ungkapan yang secara khusus menunjuk pada karya Roh Kudus'
  rationale: Teks Yunani tidak menjelaskan secara tegas apakah πνεῦμα di sini berarti Roh Kudus, roh manusia, atau ucapan rohani yang digerakkan Roh. Terjemahan mempertahankan ambiguitas dan ketegangan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti orang pertama 'aku' dipakai untuk mencerminkan tuturan pribadi Paulus, sementara susunan paralel teks Yunani dipertahankan. Semua penanda catatan kaki ditempatkan pada unsur pertama yang relevan agar teks tidak terbebani pengulangan.
