  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: id
  text: Sekarang, Saudara-saudara[a], jika aku datang kepada kalian sambil berbicara dalam bahasa roh[b], apa manfaat yang akan kuberikan kepada kalian, kecuali aku berbicara kepada kalian dengan penyataan, dengan pengetahuan, dengan nubuat, atau dengan pengajaran?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; kata Yunani yang secara harfiah berarti “saudara-saudara” dapat digunakan untuk menyapa jemaat yang terdiri atas laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bahasa-bahasa”; istilah Yunani ini dapat berarti “bahasa-bahasa,” tetapi dalam konteks ini menunjuk pada fenomena yang dibahas sepanjang 1 Korintus 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Sekarang
  rationale: Menandai peralihan ke pokok yang sedang Paulus terapkan tanpa menonjolkan pertentangan secara berlebihan.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku dan bermartabat dalam bahasa Indonesia; bentuk Yunani maskulin jamak dapat mencakup seluruh jemaat, sebagaimana dijelaskan dalam catatan kaki.
- source_word: γλώσσαις λαλῶν
  choice: berbicara dalam bahasa lidah
  rationale: Memakai istilah yang lazim untuk fenomena karismatis yang dibahas dalam 1 Korintus 12–14, sambil mempertahankan kemungkinan leksikal 'bahasa' dalam catatan kaki.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: apa manfaatnya bagi kalian
  rationale: Ungkapan Indonesia yang alami untuk makna membantu atau memberi manfaat, serta mempertahankan fokus pada faedah bagi jemaat.
- source_word: ἐὰν μὴ
  choice: kecuali
  rationale: Padanan idiomatis bagi syarat negatif Yunani.
- source_word: λαλήσω
  choice: aku berbicara
  rationale: Menjaga kesinambungan leksikal dengan λαλῶν dan sesuai dengan konteks komunikasi lisan.
- source_word: ἐν ἀποκαλύψει
  choice: melalui penyataan
  rationale: Menafsirkan ἐν secara instrumental atau modal, yaitu sarana atau bentuk perkataan yang bermanfaat.
- source_word: ἐν γνώσει
  choice: pengetahuan
  rationale: Dalam rangkaian setelah 'melalui', mempertahankan kesejajaran kategori dan makna instrumental.
- source_word: ἐν προφητείᾳ
  choice: nubuat
  rationale: Mempertahankan kategori ujaran yang dapat dipahami dan membangun jemaat tanpa menjelaskan hakikat nubuat lebih jauh.
- source_word: ἐν διδαχῇ
  choice: pengajaran
  rationale: Padanan alami bagi διδαχή dan menjaga irama daftar.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam sapaan jemaat
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Teks utama mempertahankan bentuk sapaan yang berkorespondensi dengan maskulin jamak Yunani, sedangkan kemungkinan cakupannya atas jemaat campuran dinyatakan dalam catatan kaki.
- issue: Makna γλώσσαις dalam pasal ini
  choice: bahasa lidah
  alternative: bahasa-bahasa
  rationale: Istilah ini menunjuk pada fenomena ujaran rohani yang dibahas sepanjang 1 Korintus 12–14. Pilihan tersebut tidak memutuskan perdebatan teologis mengenai sifat fenomena itu.
- issue: Fungsi ἐν dalam empat frasa sejajar
  choice: melalui
  alternative: dalam
  rationale: 'Konteks mendukung fungsi instrumental atau modal: Paulus menyebut bentuk atau sarana perkataan yang memberi manfaat. Alternatif yang lebih harfiah tetap mungkin secara gramatikal.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa kata ganti orang kedua dalam bahasa Yunani berbentuk jamak. Daftar empat unsur diringkas secara alami di bawah preposisi 'melalui' tanpa menghilangkan kesejajarannya.
