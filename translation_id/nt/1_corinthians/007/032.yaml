id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: id
  text: Namun, aku ingin supaya kamu bebas dari kekhawatiran. Laki-laki yang tidak menikah memikirkan perkara-perkara Tuhan—bagaimana ia dapat menyenangkan Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang tidak menikah.” Bahasa Yunani memakai bentuk maskulin tunggal (“laki-laki yang tidak menikah”), meskipun dalam konteks sekitarnya Paulus membahas keadaan laki-laki dan perempuan, baik yang tidak menikah maupun yang menikah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Namun, aku ingin
  rationale: θέλω menyatakan keinginan, sedangkan δέ berfungsi sebagai penghubung transisional atau sedikit kontras; “Namun” sesuai dengan alur dari pembahasan sebelumnya.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: supaya kamu bebas dari kekhawatiran
  rationale: ἀμέριμνος berarti tidak dibebani kecemasan atau kekhawatiran; ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan sikap acuh tak acuh.
- source_word: ὁ ἄγαμος
  choice: Laki-laki yang tidak menikah
  rationale: Bentuk Yunani adalah maskulin tunggal substantival. Terjemahan mempertahankan gender dan jumlah gramatikal dalam konteks yang kemudian membahas laki-laki dan perempuan secara tersendiri.
- source_word: μεριμνᾷ
  choice: memikirkan
  rationale: μεριμνάω dapat berarti menaruh perhatian, memikirkan, atau mengkhawatirkan. Di sini objeknya positif, yaitu perkara Tuhan, sehingga “memikirkan” menyampaikan perhatian yang sungguh-sungguh tanpa konotasi kecemasan yang tidak perlu.
- source_word: τὰ τοῦ κυρίου
  choice: perkara-perkara Tuhan
  rationale: Ungkapan ini mencakup segala hal yang berkaitan dengan atau menjadi kepentingan Tuhan; “perkara-perkara Tuhan” mempertahankan keluasan maknanya.
- source_word: κυρίου / κυρίῳ
  choice: Tuhan
  rationale: κύριος di sini merupakan gelar Kristiani bagi Tuhan; pilihan ini mempertahankan daya leksikal dan teologisnya.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: bagaimana ia dapat menyenangkan Tuhan
  rationale: πῶς menunjuk pada cara atau tujuan, dan bentuk subjungtif ἀρέσῃ menyatakan tindakan yang diupayakan atau dipertimbangkan; “dapat menyenangkan” wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan maskulin tunggal dalam perbandingan Paulus mengenai keadaan menikah dan tidak menikah
  choice: 'Mempertahankan bentuk maskulin tunggal dalam teks utama: “Laki-laki yang tidak menikah”'
  alternative: “Orang yang tidak menikah” atau “Seseorang yang tidak menikah”
  rationale: Teks Yunani memakai bentuk maskulin tunggal, dan ayat-ayat di sekitarnya membahas kasus laki-laki dan perempuan secara tersendiri. Catatan kaki menjelaskan bahwa pembahasan yang lebih luas mencakup kedua keadaan tersebut tanpa menetralkan bentuk sumber dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Aku” dipakai untuk suara pribadi Paulus, “kamu” untuk ὑμᾶς, dan tanda pisah membantu memperjelas hubungan penjelas dalam klausa terakhir.
