  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: id
  text: 'Adapun kepada orang-orang yang sudah menikah, aku memberi perintah ini—bukan aku, melainkan Tuhan: seorang istri tidak boleh berpisah[a] dari suaminya—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menceraikan suaminya.” Kata kerja Yunani yang digunakan dapat dipahami sebagai perpisahan dalam perkawinan, yang dalam konteks ini mungkin mencakup perceraian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Adapun kepada orang-orang yang sudah menikah
  rationale: Partisip perfek γεγαμηκόσιν menunjuk kepada orang-orang yang berada dalam keadaan menikah. “Adapun” menyampaikan fungsi transisi lemah dari δέ tanpa menjadikannya pertentangan yang kuat.
- source_word: παραγγέλλω
  choice: aku memberi perintah ini
  rationale: Ungkapan ini mempertahankan daya instruksi yang berwenang sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: bukan aku, melainkan Tuhan
  rationale: Terjemahan ini mempertahankan kontras tegas dalam teks tanpa menambahkan penjelasan teologis ke dalam ayat.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: seorang istri ... dari suaminya
  rationale: Dalam konteks perkawinan, γυνή dan ἀνήρ masing-masing berarti “istri” dan “suami”; bentuk posesif “suaminya” mengungkapkan hubungan itu secara wajar.
- source_word: μὴ χωρισθῆναι
  choice: tidak boleh berpisah
  rationale: Sesudah verba perintah, infinitif ini menyatakan isi perintah. “Berpisah” mempertahankan cakupan χωρίζω dan tidak membatasinya sejak awal pada kategori perceraian secara hukum.
theological_decisions:
- issue: Makna “bukan aku, melainkan Tuhan”
  choice: Mempertahankan kontras secara harfiah sebagai pembedaan antara perintah Tuhan dan perkataan Paulus dalam alur pembahasan ini.
  alternative: Menafsirkannya sebagai penyangkalan Paulus atas kewenangan perkataannya sendiri.
  rationale: Teks membedakan sumber perintah dalam pembahasan ayat 10–12, tetapi terjemahan tidak perlu menyelesaikan implikasi kewenangannya secara eksplisit.
- issue: Cakupan χωρισθῆναι dalam perkawinan
  choice: berpisah
  alternative: menceraikan
  rationale: “Berpisah” menjaga keluasan makna istilah Yunani dan kesinambungannya dengan ayat berikutnya, sedangkan “menceraikan” dapat terdengar lebih sempit dan khusus secara hukum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Adapun” dipakai sebagai penanda peralihan yang ringan; tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
