  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: id
  text: Sebab budak yang dipanggil dalam Tuhan adalah orang yang telah Tuhan merdekakan[a]; demikian pula, orang merdeka yang dipanggil adalah budak Mesias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang telah dibebaskan milik Tuhan.” Istilah Yunaninya secara khusus menunjuk kepada seseorang yang telah dimerdekakan dari perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: budak
  rationale: Istilah ini menyatakan status perbudakan, bukan sekadar pelayanan. Pilihan ini mempertahankan tajamnya paradoks antara budak dan orang merdeka.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Bentuk formal ini mempertahankan kemungkinan makna lingkup atau persatuan dalam pemakaian Paulus tanpa mempersempitnya menjadi 'oleh Tuhan'.
- source_word: κληθεὶς
  choice: dipanggil
  rationale: Bentuk pasif dipertahankan dan selaras dengan bahasa Paulus mengenai panggilan ilahi.
- source_word: ἀπελεύθερος
  choice: orang merdeka
  rationale: Dalam konteks ini istilah tersebut secara khusus menunjuk orang yang telah dibebaskan dari perbudakan. Bahasa utama dibuat alami dalam bahasa Indonesia, sedangkan nuansa sosial-hukumnya dijelaskan dalam catatan.
- source_word: κυρίου
  choice: milik Tuhan
  rationale: Genitif tersebut dinyatakan sebagai kepemilikan agar hubungan paradoksal dengan Tuhan tetap jelas dan alami.
- source_word: ὁμοίως
  choice: demikian pula
  rationale: Ungkapan ini menjaga kesejajaran retoris kedua bagian ayat.
- source_word: ἐλεύθερος
  choice: orang merdeka
  rationale: Pilihan ini menyatakan status sosial yang berlawanan dengan budak dan berlaku secara representatif tanpa menambahkan jenis kelamin yang tidak perlu dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: milik Mesias
  rationale: Χριστός diterjemahkan sebagai gelar 'Mesias'; bentuk genitifnya menyatakan bahwa orang tersebut menjadi milik Mesias.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar teologis ini lebih luas daripada relasi tuan-budak biasa dan dalam konteks Paulus menunjuk kepada Yesus yang ditinggikan.
theological_decisions:
- issue: Paradoks antara status sosial dan status dalam Tuhan
  choice: Mempertahankan kontras bahwa seorang budak menjadi orang merdeka milik Tuhan, sedangkan seorang merdeka menjadi budak milik Mesias.
  alternative: Melunakkan δοῦλος menjadi 'pelayan' atau menerjemahkan ἀπελεύθερος secara umum sebagai 'orang bebas'.
  rationale: 'Kontras yang tajam merupakan inti pernyataan Paulus: kedudukan sosial duniawi direlatifkan oleh hubungan seseorang dengan Tuhan dan Mesias.'
- issue: Arti ἀπελεύθερος
  choice: Teks utama memakai 'orang merdeka' dengan catatan bahwa yang dimaksud ialah orang yang telah dibebaskan dari perbudakan.
  alternative: Menerjemahkan langsung sebagai 'bekas budak yang dimerdekakan'.
  rationale: Pilihan utama lebih wajar dan ringkas dalam bahasa Indonesia, sementara catatan mempertahankan nuansa sosial-hukum istilah Yunani.
- issue: Gelar Χριστοῦ
  choice: milik Mesias
  alternative: milik Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi Raja yang diurapi; 'Mesias' membuat fungsi gelar itu jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Budak' dipilih karena status keterikatan merupakan inti paradoks Paulus; susunan kalimat sedikit diperjelas dengan 'ketika masih berstatus' agar klausa partisipial Yunani tidak disalahpahami, tanpa mengubah maknanya.
