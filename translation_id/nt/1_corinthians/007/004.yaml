id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: id
  text: Istri tidak berkuasa atas tubuhnya sendiri,[a] melainkan suaminya. Demikian juga, suami tidak berkuasa atas tubuhnya sendiri, melainkan istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menjalankan wewenang atas.” Kata kerja Yunani dapat berarti memiliki atau menjalankan wewenang; dalam ayat ini, wewenang tersebut dinyatakan secara timbal balik dalam pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: istri
  rationale: Dalam konteks pernikahan dan kewajiban timbal balik di 1 Korintus 7, kata ini menunjuk kepada perempuan yang sudah menikah.
- source_word: ἀνήρ
  choice: suami
  rationale: Karena dipasangkan dengan γυνή dalam konteks pernikahan, kata ini secara khusus berarti suami.
- source_word: ἰδίου σώματος
  choice: tubuhnya sendiri
  rationale: Ungkapan ini mempertahankan penekanan ἴδιος pada tubuh milik diri sendiri dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐξουσιάζει
  choice: berkuasa atas
  rationale: Pilihan ini menyampaikan pemilikan atau pelaksanaan wewenang yang dinyatakan verba Yunani, tanpa memperlemahnya menjadi sekadar kepemilikan ataupun memperkerasnya menjadi penguasaan paksa.
- source_word: ἀλλά
  choice: melainkan
  rationale: 'Kata ini menyatakan kontras yang tegas: bukan diri sendiri, melainkan pasangan.'
- source_word: ὁμοίως δὲ καὶ
  choice: Demikian juga
  rationale: Ungkapan ini menjaga kesejajaran dan sifat timbal balik pada bagian kedua ayat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat wewenang dalam pernikahan pada ayat ini
  choice: Pernyataan diterjemahkan sebagai wewenang timbal balik antara istri dan suami.
  alternative: Menerjemahkannya secara lebih lemah sebagai tubuh yang tidak menjadi milik diri sendiri, atau lebih kuat sebagai kendali pasangan atas tubuh pasangannya.
  rationale: 'Susunan Yunani dengan sengaja seimbang: pernyataan tentang istri diikuti pernyataan yang sama tentang suami. Terjemahan mempertahankan ketegangan dan timbal balik itu tanpa memasukkan hierarki sepihak atau makna pemaksaan yang tidak dinyatakan teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur dua kalimat mempertahankan kesejajaran retoris teks Yunani. Istilah “berkuasa atas” dipilih karena ringkas dan bermartabat; catatan kaki mempertahankan kemungkinan nuansa pelaksanaan wewenang.
