  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan susunan dan makna Yunani: γυνή/ἀνήρ diterjemahkan secara kontekstual sebagai “istri/suami”; ἰδίου σώματος sebagai “tubuhnya sendiri”; dan ἐξουσιάζει sebagai “berkuasa atas.” Kontras ἀλλά serta kesejajaran timbal balik ὁμοίως δὲ καί tetap jelas. Elipsis pada “melainkan suaminya/istrinya” wajar dalam bahasa Indonesia dan menyiratkan predikat yang sama seperti dalam teks sumber.'
