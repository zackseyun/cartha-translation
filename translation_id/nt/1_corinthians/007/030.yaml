id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: id
  text: dan orang-orang yang menangis, seolah-olah tidak menangis[a]; dan orang-orang yang bersukacita, seolah-olah tidak bersukacita; dan orang-orang yang membeli, seolah-olah tidak memiliki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “sebagai tidak menangis ... sebagai tidak bersukacita ... sebagai tidak memiliki.” Ungkapan Yunani “sebagai tidak” yang diulang-ulang menyatakan cara atau sikap dalam menjalani hal-hal tersebut, bukan menyangkal bahwa semuanya sungguh dialami.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: orang-orang yang menangis
  rationale: Partisipel kini dengan artikel berfungsi substantival. 'Menangis' merupakan padanan langsung dan tidak mempersempit maknanya menjadi dukacita karena kematian.
- source_word: ὡς μὴ κλαίοντες
  choice: seolah-olah tidak menangis
  rationale: Ungkapan ὡς μή dengan partisipel menyatakan cara atau sikap dalam menjalani pengalaman, bukan menyangkal bahwa tangisan itu sungguh terjadi. 'Seolah-olah' alami dalam bahasa Indonesia dan tetap mempertahankan ketegangan ungkapan Yunani.
- source_word: χαίροντες
  choice: orang-orang yang bersukacita
  rationale: '''Bersukacita'' sesuai dengan penggunaan χαίρω dan mempertahankan kesejajaran retoris dengan ''menangis'' dalam ragam bahasa yang bermartabat.'
- source_word: ὡς μὴ χαίροντες
  choice: seolah-olah tidak bersukacita
  rationale: Terjemahan ini mempertahankan konstruksi dan simetri yang sama dengan klausa sebelumnya tanpa menjadikannya larangan untuk bersukacita.
- source_word: ἀγοράζοντες
  choice: orang-orang yang membeli
  rationale: '''Membeli'' adalah padanan modern dan langsung untuk kegiatan memperoleh sesuatu melalui transaksi.'
- source_word: κατέχοντες
  choice: memiliki
  rationale: Dalam pertentangannya dengan 'membeli', κατέχω menunjuk pada memegang sesuatu sebagai milik. 'Memiliki' lebih alami daripada 'menguasai' atau 'menahan' dalam konteks ini.
- source_word: καὶ
  choice: dan; tanda titik koma pada dua sambungan internal
  rationale: καί pertama diterjemahkan 'dan' karena ayat ini melanjutkan rangkaian dari ayat sebelumnya. Dalam deretan internal, titik koma menjaga irama kumulatif secara alami dalam bahasa Indonesia; καί terakhir kembali dinyatakan sebagai 'dan'.
theological_decisions:
- issue: Daya ungkapan berulang ὡς μή
  choice: Ayat ini menyuruh pembaca menjalani pengalaman emosional dan ekonomi tanpa memperlakukannya sebagai realitas yang mutlak.
  alternative: Memahaminya sebagai penyangkalan pengalaman tersebut atau sebagai larangan asketis terhadap tangisan, sukacita, dan pembelian.
  rationale: Konteks dekat menekankan keadaan sekarang dan bahwa rupa dunia ini sedang berlalu (1Kor. 7:26, 31). Konstruksi ὡς μή menyatakan cara atau sikap, tetapi terjemahan tetap membiarkan desakan eskatologis Paulus terasa tanpa menjadikannya larangan mutlak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'seolah-olah tidak' dipertahankan demi paralelisme Paulus. Ayat sengaja diawali huruf kecil dan diakhiri koma karena merupakan bagian dari satu kalimat yang berlanjut dari ayat 29 ke ayat 31.
