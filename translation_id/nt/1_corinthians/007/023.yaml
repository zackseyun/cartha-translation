  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: id
  text: Kalian telah dibeli dengan harga. Jangan menjadi budak manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak orang.” Kata Yunani yang diterjemahkan “manusia” merujuk kepada manusia secara umum, berlawanan dengan Tuhan, bukan hanya kepada laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: dengan suatu harga
  rationale: Genitif ini menyatakan harga atau biaya pembelian. Ungkapan ini mempertahankan metafora bahwa suatu harga telah dibayar tanpa menentukan besarnya.
- source_word: ἠγοράσθητε
  choice: kalian telah dibeli
  rationale: Bentuk aoris pasif orang kedua jamak. 'Kalian' menyatakan bentuk jamak secara jelas, sedangkan 'telah dibeli' mempertahankan metafora pembelian.
- source_word: μὴ γίνεσθε
  choice: jangan menjadi
  rationale: γίνομαι berarti 'menjadi', dan larangan ini memperingatkan pembaca agar tidak masuk atau terus masuk ke dalam keadaan tersebut.
- source_word: δοῦλοι
  choice: budak
  rationale: Dalam konteks pembelian dan kepemilikan, status terikat merupakan bagian penting dari metafora; 'budak' menyatakannya lebih tepat daripada 'pelayan'.
- source_word: ἀνθρώπων
  choice: manusia
  rationale: Bentuk jamak ini merujuk kepada manusia secara umum, berlawanan dengan Tuhan, bukan hanya kepada laki-laki. Dalam bahasa Indonesia, nomina kolektif 'manusia' alami dan tepat.
theological_decisions:
- issue: Makna δοῦλοι ἀνθρώπων dalam metafora kepemilikan dan kesetiaan
  choice: budak manusia
  alternative: pelayan manusia
  rationale: '''Budak manusia'' mempertahankan ketegangan antara pembelian orang percaya dan larangan menempatkan diri di bawah penguasaan manusia. Terjemahan ini tidak mempersempit larangan kepada pelayanan biasa atau kepada laki-laki saja.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalian' dipakai untuk memperlihatkan bahwa sapaan Yunani berbentuk jamak. Dua kalimat pendek mempertahankan tekanan retoris teks sumber.
