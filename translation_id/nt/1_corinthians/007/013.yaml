source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: id
  text: Dan jika seorang perempuan mempunyai suami yang tidak percaya, dan suaminya itu bersedia hidup bersamanya, janganlah ia meninggalkan suaminya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah ia menceraikan suaminya.” Kata kerja Yunani dapat berarti “meninggalkan” atau “melepaskan”; di sini maksudnya ialah mengakhiri hubungan perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: seorang perempuan
  rationale: γυνή dapat berarti 'perempuan' atau 'istri'. Dalam konteks ini hubungan perkawinan dibuat jelas oleh 'mempunyai suami', sedangkan 'seorang perempuan mempunyai suami' lebih alami daripada 'seorang istri mempunyai suami'.
- source_word: εἴ τις
  choice: jika seorang perempuan
  rationale: Ungkapan bersyarat tak tentu ini menyatakan kasus umum; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat umumnya.
- source_word: ἄνδρα ἄπιστον
  choice: suami yang tidak percaya
  rationale: Dalam konteks perkawinan, ἀνήρ berarti 'suami', sedangkan ἄπιστος menunjuk kepada orang yang tidak memiliki iman Kristen, bukan suami yang tidak setia dalam perkawinan.
- source_word: οὗτος
  choice: suaminya itu
  rationale: Kata penunjuk ini merujuk kembali secara tegas kepada suami yang baru disebut; 'suaminya itu' jelas dan wajar dalam bahasa Indonesia.
- source_word: συνευδοκεῖ
  choice: bersedia
  rationale: Kata ini menyatakan persetujuan atau kerelaan. 'Bersedia' secara alami menyampaikan kemauan untuk terus hidup bersama.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: hidup bersamanya
  rationale: Frasa ini menunjuk pada kehidupan rumah tangga bersama; 'hidup bersamanya' alami dan tidak sekadar menyatakan tinggal di lokasi yang sama.
- source_word: μὴ ἀφιέτω
  choice: janganlah ia meninggalkan
  rationale: Dalam konteks perkawinan, ἀφίημι dapat menunjuk pada meninggalkan atau melepaskan pasangan, yakni mengakhiri hubungan perkawinan. Terjemahan ini mempertahankan keluasan verba Yunani tanpa membatasinya hanya pada prosedur hukum perceraian.
- source_word: τὸν ἄνδρα
  choice: suaminya
  rationale: Artikel Yunani menunjuk kepada pasangan yang sudah dikenal dalam konteks; bentuk posesif diperlukan agar rujukannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἀφιέτω dalam perintah mengenai perkawinan dengan pasangan yang tidak percaya
  choice: janganlah ia meninggalkan suaminya
  alternative: janganlah ia menceraikan suaminya
  rationale: Konteksnya jelas menyangkut kelangsungan perkawinan, tetapi verba Yunani secara harfiah lebih luas daripada istilah hukum 'menceraikan'. 'Meninggalkan' mempertahankan ambiguitas leksikal sambil catatan kaki menjelaskan bahwa tindakan itu berarti mengakhiri hubungan perkawinan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'janganlah ia' mempertahankan corak nasihat apostolik tanpa terdengar legalistis; istilah 'yang tidak percaya' menghindari kemungkinan salah paham dari 'tidak setia'.
