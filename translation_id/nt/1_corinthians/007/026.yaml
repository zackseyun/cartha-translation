  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: id
  text: 'Karena itu saya berpendapat bahwa, karena kesesakan yang ada sekarang, hal ini baik: baik bagi seseorang untuk berada dalam keadaan demikian.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena kebutuhan mendesak yang ada sekarang” atau “karena krisis yang akan datang.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “bagi seorang laki-laki”; kata ini dapat digunakan secara umum untuk seseorang.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “berada demikian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: menurut saya
  rationale: Mengungkapkan pertimbangan pribadi Paulus secara alami dalam bahasa Indonesia, bukan perintah mutlak.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: hal ini baik
  rationale: Mengalihkan konstruksi infinitif Yunani menjadi klausa Indonesia yang wajar sambil mempertahankan penilaian καλόν sebagai 'baik'.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: mengingat kesesakan yang sedang berlangsung
  rationale: ἀνάγκη dapat menunjuk pada kebutuhan mendesak atau tekanan/kesesakan; konteks mendukung keadaan yang menekan. ἐνεστῶσαν menunjuk pada keadaan yang kini berlangsung, meski dapat pula dipahami sebagai krisis yang segera datang.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi penilaian Paulus dalam bahasa Indonesia; hubungan itu tidak ditafsirkan sebagai sebab kedua.
- source_word: καλὸν
  choice: baik
  rationale: Mempertahankan pengulangan leksikal καλόν dari bagian pertama ayat.
- source_word: ἀνθρώπῳ
  choice: bagi seorang laki-laki
  rationale: Mempertahankan bentuk maskulin sumber dalam konteks langsung, sambil mencatat bahwa ἄνθρωπος juga dapat berfungsi secara generik.
- source_word: τὸ οὕτως εἶναι
  choice: untuk tetap dalam keadaannya sekarang
  rationale: Menyampaikan idiom harfiah 'berada demikian' sebagai rujukan pada keadaan hidup yang sedang dijalani; unsur 'tetap' sesuai dengan alur nasihat, namun tidak dibiarkan tanpa catatan karena tidak dinyatakan secara eksplisit oleh verba εἶναι.
theological_decisions:
- issue: Sifat pernyataan Paulus
  choice: Diterjemahkan sebagai pertimbangan situasional Paulus yang didasarkan pada kesesakan yang sedang berlangsung.
  alternative: Pernyataan ini dapat dibaca sebagai preferensi yang berlaku umum terhadap keadaan tidak menikah.
  rationale: Ungkapan νομίζω dan alasan διὰ τὴν ἐνεστῶσαν ἀνάγκην menampilkan nasihat pastoral yang terkait keadaan, tanpa menjadikannya larangan universal terhadap perkawinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menurut saya' mempertahankan nada pertimbangan pribadi; 'kesesakan yang sedang berlangsung' menjaga tekanan situasional; dan catatan kaki mempertahankan ambiguitas leksikal serta keharfiahan ungkapan penutup.
