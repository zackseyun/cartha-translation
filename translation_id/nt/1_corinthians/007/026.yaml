revisions:
- from: 'Karena itu, menurut saya, hal ini baik mengingat kesesakan yang sedang berlangsung: baik bagi seorang laki-laki untuk tetap dalam keadaannya sekarang.[a][b][c]'
  to: 'Karena itu saya berpendapat bahwa, karena kesesakan yang ada sekarang, hal ini baik: baik bagi seseorang untuk berada dalam keadaan demikian.[a][b][c]'
  rationale: Revisi mengganti ungkapan yang kurang idiomatis dan yang menambahkan aspek duratif dengan padanan yang lebih dekat pada ἐνεστῶσαν. Terjemahan penutup dibuat lebih harfiah agar tidak membatasi “demikian” pada satu keadaan tertentu, sementara catatan kaki mempertahankan alternatif leksikal dan bentuk sumber. Nada pertimbangan pribadi Paulus serta pengulangan “baik” tetap dipertahankan.
