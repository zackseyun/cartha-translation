  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: id
  text: 'Mengenai hal-hal yang kalian tulis: baik bagi seorang laki-laki untuk tidak menyentuh perempuan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menyentuh perempuan” dapat menjadi ungkapan halus untuk melakukan hubungan seksual. Kata Yunani yang diterjemahkan “perempuan” juga dapat berarti “istri”.
    reason: Menjelaskan kemungkinan makna idiomatis dan ambiguitas γυνή tanpa menggantikan ungkapan sumber dengan satu tafsiran tertentu.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Mengenai hal-hal yang kalian tulis
  rationale: Περὶ δέ memperkenalkan pokok baru mengenai surat jemaat; bahasa Indonesia tidak memerlukan padanan tersendiri seperti “sekarang” untuk δέ. Bentuk ἐγράψατε adalah orang kedua jamak, sehingga diterjemahkan “kalian tulis”.
- source_word: καλὸν ἀνθρώπῳ
  choice: baik bagi seorang laki-laki
  rationale: Ungkapan ini menyatakan bahwa sesuatu baik bagi seseorang. Dalam konteks pasangan laki-laki dan perempuan, ἀνθρώπῳ secara wajar merujuk kepada laki-laki, meskipun kata itu sendiri dapat berarti manusia atau orang.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: untuk tidak menyentuh perempuan
  rationale: Terjemahan ini mempertahankan ungkapan sumber yang secara harfiah berarti tidak menyentuh seorang perempuan dan dapat berfungsi sebagai ungkapan halus tentang hubungan seksual. γυνή juga dapat berarti istri menurut konteks.
theological_decisions:
- issue: Apakah ungkapan itu harus langsung ditafsirkan sebagai larangan hubungan seksual atau pernyataan tentang selibat
  choice: Mempertahankan ungkapan “tidak menyentuh perempuan” dalam teks utama
  alternative: “tidak berhubungan seksual dengan perempuan” atau “tidak menikah”
  rationale: Bahasa Yunani memakai ungkapan yang dapat mengandung makna seksual, tetapi tidak secara eksplisit mengatakan “tidak menikah”. Terjemahan utama mempertahankan ketegangan dan ambiguitas tersebut, sedangkan catatan kaki menjelaskan kemungkinan idiomatisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” menunjukkan bahwa Paulus berbicara kepada jemaat secara jamak; struktur kalimat mengikuti peralihan topik dalam bahasa Yunani tanpa menambahkan kata “sekarang”.
