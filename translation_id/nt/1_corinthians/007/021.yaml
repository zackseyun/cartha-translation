  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: id
  text: Apakah kamu seorang budak ketika dipanggil? Janganlah hal itu merisaukanmu. Namun, jika kamu memang dapat menjadi orang merdeka, lebih baik manfaatkan kesempatan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lebih baik manfaatkanlah keadaanmu sekarang,” yakni tetaplah dalam keadaanmu sekarang. Dalam bahasa Yunani, objek dari “manfaatkanlah” tidak disebutkan, sehingga ungkapan ini dipahami dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: budak
  rationale: Dalam konteks ini kata tersebut menunjukkan status keterikatan sebagai budak, bukan sekadar pelayan; hal itu ditegaskan oleh kemungkinan untuk menjadi orang merdeka.
- source_word: ἐκλήθης
  choice: ketika dipanggil
  rationale: Mempertahankan ungkapan panggilan ilahi khas Paulus tanpa menambahkan pelaku atau penjelasan yang tidak dinyatakan dalam teks Yunani.
- source_word: μή σοι μελέτω
  choice: Janganlah hal itu merisaukanmu
  rationale: Ungkapan ini menyampaikan larangan untuk merasa cemas atau terusik oleh keadaan tersebut, dengan nada pastoral yang wajar dalam bahasa Indonesia.
- source_word: ἐλεύθερος γενέσθαι
  choice: menjadi orang merdeka
  rationale: Menunjukkan perubahan nyata dalam status sosial dari perbudakan menuju kemerdekaan.
- source_word: μᾶλλον χρῆσαι
  choice: manfaatkanlah kesempatan itu
  rationale: Objek verba tidak dinyatakan dalam bahasa Yunani. Teks utama memahami objek tersiratnya sebagai kesempatan untuk memperoleh kemerdekaan, sedangkan tafsiran bahwa Paulus menyuruh orang itu memanfaatkan keadaannya sekarang dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Ambiguitas objek tersirat dalam μᾶλλον χρῆσαι
  choice: Paulus menganjurkan budak itu memanfaatkan kesempatan untuk menjadi merdeka jika tersedia.
  alternative: Paulus menyuruhnya memanfaatkan keadaannya sekarang, yakni tetap sebagai budak.
  rationale: Klausa terdekat mengenai kemampuan untuk menjadi merdeka secara alami menyediakan objek tersirat bagi 'manfaatkanlah'. Namun, karena teks Yunani tidak menyebut objek dan tafsiran alternatif memiliki dukungan historis yang kuat, ambiguitasnya dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern, alami, dan bermartabat. Sapaan tunggal dipakai karena verba Yunani berbentuk orang kedua tunggal. Istilah 'budak' mempertahankan kerasnya status sosial yang dimaksud, sedangkan 'orang merdeka' menegaskan kontrasnya.
