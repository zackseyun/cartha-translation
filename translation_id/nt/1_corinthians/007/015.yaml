  to: Namun, jika orang yang tidak percaya itu berpisah, biarlah ia berpisah. Dalam keadaan seperti itu, saudara atau saudari seiman tidak diperbudak.[a] Tetapi Allah telah memanggil kita[b] dalam damai.
