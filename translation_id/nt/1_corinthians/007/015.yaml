  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: id
  text: Namun, jika orang yang tidak percaya itu berpisah, biarlah ia berpisah. Dalam keadaan seperti itu, saudara atau saudari seiman tidak diperbudak.[a] Tetapi Allah telah memanggil kita[b] dalam damai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak terikat”. Namun, kata kerja Yunani yang dipakai berasal dari δουλόω, “memperbudak”, bukan kata yang lebih lazim berarti “mengikat”.
    reason: lexical_alternative
  - marker: b
    text: Sebagian naskah membaca “kalian” alih-alih “kita”.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: pihak yang tidak percaya itu
  rationale: Ungkapan substantival ini dalam konteks menunjuk kepada pasangan yang tidak percaya. Kata “pihak” menjaga rujukannya tetap umum bagi laki-laki maupun perempuan tanpa menambahkan kata “pasangan” ke dalam teks utama.
- source_word: χωρίζεται / χωριζέσθω
  choice: berpisah / biarlah ia berpisah
  rationale: Mempertahankan pengulangan verba Yunani dan tidak mempersempit maknanya menjadi perceraian resmi atau sekadar pergi secara fisik. Bentuk imperatifnya menyatakan pembiaran atau penerimaan, bukan perintah untuk bercerai.
- source_word: οὐ δεδούλωται
  choice: tidak diperbudak
  rationale: Menerjemahkan δουλόω secara leksikal sebagai “memperbudak”, bukan dengan istilah yang lebih lazim untuk “mengikat”; cakupan kebebasan yang dimaksud tidak dijabarkan lebih jauh oleh ayat ini.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: saudara atau saudari seiman
  rationale: Mempertahankan kedua bentuk bergender dan menjelaskan nilai kekerabatan rohaninya secara alami dalam bahasa Indonesia.
- source_word: ἐν τοῖς τοιούτοις
  choice: dalam keadaan seperti itu
  rationale: Ungkapan idiomatis ini menunjuk pada situasi seperti perpisahan yang baru saja disebutkan.
- source_word: ἐν δὲ εἰρήνῃ
  choice: tetapi ... untuk hidup dalam damai
  rationale: Secara idiomatis menyampaikan damai sebagai ranah dan arah kehidupan panggilan Allah; penambahan “hidup” tersirat dalam konstruksi Indonesia dan tidak menjadikannya sekadar perasaan batin.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Allah telah memanggil kita
  rationale: “Telah memanggil” mencerminkan aspek perfektum, sedangkan “kita” mengikuti bacaan SBLGNT ἡμᾶς.
theological_decisions:
- issue: Cakupan οὐ δεδούλωται terhadap putusnya perkawinan dan kemungkinan menikah kembali
  choice: Diterjemahkan “tidak diperbudak” tanpa menetapkan doktrin lengkap mengenai hak untuk menikah kembali.
  alternative: “Tidak terikat” dapat dipahami sebagai pernyataan teknis yang mengizinkan pernikahan kembali; atau “tidak diperbudak” dapat dibatasi pada kebebasan untuk tidak memaksa pasangan yang pergi agar kembali.
  rationale: Ayat ini menyatakan bahwa orang percaya tidak diperbudak dalam keadaan tersebut, tetapi tidak secara eksplisit menjelaskan seluruh cakupan kebebasan itu. Pilihan ini menjaga ketegangan teologis dan mengikuti verba δουλόω.
- issue: Rujukan ὁ ἄπιστος
  choice: “Pihak yang tidak percaya itu,” yang dalam konteks dipahami sebagai pasangan yang tidak percaya.
  alternative: “Orang yang tidak percaya itu” atau “pasangan yang tidak percaya itu.”
  rationale: Konteks perkawinan memastikan rujukannya, tetapi teks Yunani sendiri tidak memakai kata “pasangan”. Terjemahan utama tetap jelas tanpa membuat unsur tersirat menjadi eksplisit.
- issue: Makna panggilan Allah ἐν ... εἰρήνῃ
  choice: “Memanggil kita untuk hidup dalam damai.”
  alternative: “Memanggil kita dalam damai.”
  rationale: Pilihan utama lebih alami dalam bahasa Indonesia dan menyampaikan damai sebagai corak kehidupan panggilan Allah tanpa memastikan secara berlebihan bagaimana frasa itu mengatur keputusan perkawinan dalam kasus tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Pihak” dipakai agar rujukan kepada pasangan laki-laki atau perempuan tetap netral. Semua penanda catatan kaki ditempatkan langsung pada unsur teks yang dijelaskan.
