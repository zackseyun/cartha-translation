source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: id
  text: Tetapi kepada yang selebihnya aku berkata—aku, bukan Tuhan—jika seorang saudara mempunyai istri yang tidak percaya, dan istrinya itu bersedia hidup bersamanya, janganlah ia menceraikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah ia meninggalkannya” atau “janganlah ia menyuruhnya pergi.” Kata Yunani ini dapat diterjemahkan lebih harfiah sebagai “meninggalkan” atau “menyuruh pergi,” tetapi dalam konteks ini menunjuk pada tindakan mengakhiri perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Tetapi kepada yang lain
  rationale: Menunjuk kepada kelompok selebihnya yang belum dibahas; δέ berfungsi sebagai peralihan ringan yang tetap tercermin dengan “Tetapi”.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: aku berkata—aku, bukan Tuhan—
  rationale: Pengulangan “aku” mempertahankan penekanan pada ἐγώ, sedangkan tanda pisah mempertahankan sifat sisipan frasa tersebut tanpa menafsirkan bahwa perkataan Paulus tidak berwenang.
- source_word: ἀδελφὸς
  choice: seorang saudara
  rationale: Bentuk maskulin tunggal di sini secara khusus menunjuk kepada laki-laki percaya yang mempunyai istri; “saudara” mempertahankan bahasa kekeluargaan jemaat.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: mempunyai istri yang tidak percaya
  rationale: Ungkapan Yunani menyatakan hubungan perkawinan, dan ἄπιστον di sini berarti tidak percaya kepada Kristus, bukan tidak setia dalam perkawinan.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: dan istrinya itu bersedia
  rationale: “Bersedia” menyampaikan persetujuan sukarela untuk tetap menjalani kehidupan bersama dan terdengar alami dalam bahasa Indonesia modern.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: hidup bersamanya
  rationale: Merujuk kepada kehidupan serumah sebagai pasangan, bukan sekadar berada di tempat yang sama.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: janganlah ia menceraikan istrinya
  rationale: Dalam konteks perkawinan, ἀφίημι berarti meninggalkan atau melepaskan pasangan sehingga mengakhiri perkawinan; “menceraikan” menjelaskan maksud relasional-hukumnya, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Pernyataan Paulus “aku, bukan Tuhan”
  choice: Mempertahankan pembedaan antara petunjuk Paulus dan perkataan langsung Tuhan Yesus mengenai perkara tersebut.
  alternative: Mengartikannya sebagai pendapat pribadi Paulus yang tidak memiliki kewibawaan.
  rationale: Konteks membedakan ajaran Tuhan yang telah disebut sebelumnya dari penerapan apostolik pada keadaan yang tidak dicatat sebagai pokok perkataan langsung Yesus. Terjemahan mempertahankan ketegangan itu tanpa menambahkan penjelasan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku” mempertahankan penekanan pribadi Paulus dan serasi dengan ujaran langsung; “Tuhan” dipertahankan sebagai sebutan bagi Yesus. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan emphatik dalam bahasa Yunani.
