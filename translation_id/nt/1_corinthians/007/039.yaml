  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: id
  text: Seorang istri terikat selama suaminya hidup. Namun, jika suaminya meninggal[a], ia bebas menikah dengan siapa pun yang dikehendakinya, asalkan ia menikah dalam Tuhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tertidur,” suatu ungkapan halus yang lazim untuk meninggal.'
    reason: lexical_alternative
  - marker: b
    text: “Dalam Tuhan” lazim dipahami berarti menikah dengan seseorang yang menjadi milik Tuhan, yaitu sesama orang percaya. Ungkapan ini juga dapat menekankan bahwa pernikahan itu harus selaras dengan kesetiaan kepada Tuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Seorang istri
  rationale: Dalam konteks ikatan perkawinan dan penyebutan 'suaminya', γυνή berarti 'istri', bukan sekadar 'perempuan'.
- source_word: δέδεται
  choice: terikat
  rationale: Bentuk perfekt pasif menyatakan keadaan terikat yang terus berlaku; 'terikat' mempertahankan daya hukum-relasional tanpa menambahkan 'oleh hukum' yang tidak eksplisit.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: selama ... hidup
  rationale: Ungkapan ini menyatakan jangka waktu dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: suaminya
  rationale: Dalam konteks perkawinan, ἀνήρ jelas merujuk kepada suami.
- source_word: κοιμηθῇ
  choice: meninggal
  rationale: Secara idiomatis kata ini berarti meninggal, walaupun secara harfiah memakai metafora 'tertidur'; metafora sumber dicatat dalam catatan kaki.
- source_word: ἐλευθέρα ἐστίν
  choice: ia bebas
  rationale: Frasa ini menyatakan bahwa perempuan tersebut telah bebas dari ikatan perkawinan sebelumnya.
- source_word: ᾧ θέλει
  choice: dengan siapa pun yang dikehendakinya
  rationale: Terjemahan ini menyampaikan kebebasan memilih calon pasangan dan mempertahankan nada yang bermartabat.
- source_word: γαμηθῆναι
  choice: menikah
  rationale: Bahasa Indonesia secara alami menggunakan 'menikah'; bentuk ini cukup mewakili infinitif pasif Yunani dalam konteks tersebut.
- source_word: μόνον
  choice: asalkan
  rationale: Di sini μόνον membatasi kebebasan yang baru dinyatakan; 'asalkan' mengungkapkan syarat pembatas secara alami.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan formal ini mempertahankan ungkapan Paulus dan tidak mempersempit maknanya secara tafsiran dalam teks utama.
theological_decisions:
- issue: Makna 'dalam Tuhan' dalam petunjuk tentang menikah kembali
  choice: Mempertahankan ungkapan 'asalkan dalam Tuhan' dalam teks utama.
  alternative: hanya dengan sesama orang percaya; atau hanya dengan cara yang sesuai dengan kesetiaan kepada Tuhan
  rationale: Frasa ἐν κυρίῳ padat secara teologis dan dapat menunjuk pada lingkup kesetiaan kepada Tuhan, yang lazim dipahami mencakup pasangan yang juga percaya. Terjemahan literal mempertahankan ketegangan tafsir tanpa menetapkan salah satu perluasan sebagai teks.
- issue: Metafora tidur untuk kematian
  choice: Menggunakan 'meninggal' dalam teks utama dan menjelaskan metafora 'tertidur' dalam catatan kaki.
  alternative: tertidur
  rationale: Dalam bahasa Yunani κοιμηθῇ merupakan eufemisme lazim untuk kematian. 'Meninggal' menyampaikan makna idiomatis secara wajar dalam bahasa Indonesia, sementara catatan kaki melestarikan gambaran sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur hukum-relasional ayat dipertahankan, sedangkan idiom kematian dibuat alami dan ungkapan teologis 'dalam Tuhan' dibiarkan tidak diperluas dalam teks utama.
