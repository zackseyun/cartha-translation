  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: id
  text: 'Tetapi aku ingin agar semua orang seperti aku sendiri. Namun, masing-masing memiliki karunianya sendiri dari Allah: yang seorang demikian, yang lain begitu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: semua orang
  rationale: Dalam bentuk jamak, ἄνθρωποι lazim merujuk manusia secara umum. Konteks membahas keadaan hidup setiap orang, bukan menegaskan jenis kelamin laki-laki.
- source_word: εἶναι ὡς καὶ ἐμαυτόν
  choice: hidup seperti aku
  rationale: Terjemahan ini menyampaikan keadaan hidup Paulus dalam konteks pernikahan dan hidup tidak menikah secara lebih alami daripada bentuk harfiah 'berada seperti aku', tanpa menentukan lebih jauh keadaan tersebut.
- source_word: χάρισμα
  choice: karunia
  rationale: Istilah ini menunjuk pemberian anugerah dari Allah; 'karunia' mempertahankan hubungan leksikal dan teologisnya dengan pemakaian Paulus.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: yang seorang demikian, yang lain begitu
  rationale: Ungkapan berpasangan ini mempertahankan kontras yang sengaja tidak dirinci oleh teks.
theological_decisions:
- issue: Apakah Paulus menyatakan bahwa hidup tidak menikah dan pernikahan sama-sama merupakan karunia
  choice: Mempertahankan rumusan umum bahwa masing-masing memiliki karunia sendiri dari Allah
  alternative: Menjelaskan secara eksplisit bahwa selibat dan pernikahan adalah dua karunia yang dimaksud
  rationale: Konteks mendukung kaitan itu, tetapi ayat ini sendiri memakai ungkapan tidak spesifik 'yang seorang demikian, yang lain begitu'; terjemahan tidak boleh mempersempitnya secara tafsiriah.
- issue: Cakupan πάντας ἀνθρώπους
  choice: semua orang
  alternative: semua laki-laki
  rationale: ἄνθρωπος dapat berarti manusia/orang secara umum, dan konteks dekat mencakup laki-laki serta perempuan. Terjemahan inklusif menjaga cakupan alami istilah Yunani tanpa memasukkan pembatasan gender.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti 'aku' sesuai suara pribadi Paulus. Struktur kontras 'Namun ... Akan tetapi ...' mempertahankan δέ dan ἀλλά tanpa terdengar kaku.
