id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: id
  text: Namun, orang yang tetap teguh dalam hatinya, tanpa ada keharusan, dan berkuasa atas kehendaknya sendiri, serta telah menetapkan hal ini dalam hatinya—untuk mempertahankan perawannya[a]—akan berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “perawannya” dapat menunjuk pada anak perempuannya yang masih perawan atau pada tunangannya yang masih perawan; maksud ungkapan Yunani ini diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: tetap teguh
  rationale: Gabungan bentuk perfektum ἕστηκεν dan ἑδραῖος menyatakan ketetapan batin yang sudah mantap; “tetap teguh” alami dalam bahasa Indonesia dan mempertahankan nuansa kestabilan.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dalam hatinya
  rationale: καρδία menunjuk pada batin sebagai pusat tekad dan keputusan; ungkapan ini mempertahankan idiom sumber serta pengulangannya dalam ayat.
- source_word: μὴ ἔχων ἀνάγκην
  choice: tanpa ada keharusan
  rationale: ἀνάγκη dapat berarti keharusan, kebutuhan yang mendesak, atau paksaan. Pilihan ini dekat dengan bentuk Yunani tanpa menentukan apakah tekanan itu bersifat eksternal atau situasional.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: berkuasa atas kehendaknya sendiri
  rationale: ἐξουσία menyatakan wewenang atau kuasa, sedangkan θέλημα berarti kehendak, keinginan, atau niat. Terjemahan ini menyampaikan kebebasan menentukan kehendak sendiri dalam kontras dengan keharusan.
- source_word: κέκρικεν
  choice: telah menetapkan
  rationale: Bentuk perfektum menunjukkan keputusan yang telah diambil dan tetap berlaku; “telah menetapkan” mengungkapkan tekad yang mantap.
- source_word: τηρεῖν
  choice: mempertahankan
  rationale: τηρέω berarti menjaga, memelihara, atau mempertahankan suatu keadaan. “Mempertahankan” sesuai dengan konteks tanpa menambahkan kata “tidak menikah” yang tidak dinyatakan secara eksplisit.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: perawannya
  rationale: Ungkapan harfiah dipertahankan agar tidak memutuskan apakah yang dimaksud adalah anak perempuan yang masih perawan atau perempuan perawan yang bertunangan dengannya; ambiguitas dijelaskan dalam catatan kaki.
- source_word: καλῶς ποιήσει
  choice: akan berbuat baik
  rationale: Ungkapan idiomatis ini berarti bertindak dengan baik atau patut; “akan berbuat baik” dekat dengan sumber dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan τὴν ἑαυτοῦ παρθένον
  choice: Mempertahankan ungkapan ambigu “perawannya” dalam teks utama.
  alternative: “anak perempuannya yang masih perawan” atau “tunangannya yang masih perawan”
  rationale: Teks Yunani tidak memastikan apakah Paulus berbicara tentang ayah atau wali yang mengambil keputusan mengenai anak perempuannya, atau tentang seorang laki-laki yang mengambil keputusan mengenai tunangannya. Terjemahan utama tidak boleh menutup perdebatan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur argumentasi Yunani, sementara tanda pisah membantu pembaca mengenali isi keputusan. Hanya satu catatan kaki dipakai karena alternatif “di bawah paksaan” merupakan nuansa leksikal dari “tanpa ada keharusan” dan tidak perlu diberi penanda terpisah; penanda [a] dalam teks sesuai dengan catatan yang disertakan.
