  terminology: “Panggilan” tepat dipertahankan sebagai padanan κλῆσις karena menjaga gema dengan “dipanggil” dan tidak mereduksi istilah itu menjadi status sosial semata. Catatan kaki dengan tepat memberi alternatif kontekstual tanpa menggantikannya dalam teks utama. Tidak diperlukan catatan tentang gender, sebab “ia” dalam bahasa Indonesia tidak menandai gender.
