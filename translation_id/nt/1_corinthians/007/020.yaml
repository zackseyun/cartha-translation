  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur utama Yunani: ἕκαστος sebagai “setiap orang”, κλῆσις sebagai “panggilan”, bentuk pasif ἐκλήθη sebagai “dipanggil”, dan imperatif συνεχ-menerus μενέτω melalui “hendaklah ... tetap berada”. Susunan “dalam panggilan yang di dalamnya ia dipanggil” mempertahankan, sejauh wajar dalam bahasa Indonesia, hubungan preposisional dan permainan kata κλήσει/ἐκλήθη tanpa menentukan agen pemanggilan.'
