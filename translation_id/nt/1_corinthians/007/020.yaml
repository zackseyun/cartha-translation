  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: id
  text: Hendaklah setiap orang tetap berada dalam panggilan yang di dalamnya ia dipanggil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadaan”, “situasi”, atau “kedudukan hidup”. Secara harfiah, teks Yunani memakai “panggilan”, yang menggemakan kata “dipanggil” dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: setiap orang
  rationale: Mempertahankan daya distributif bentuk tunggal sambil memakai ungkapan Indonesia yang alami dan mencakup setiap orang percaya.
- source_word: κλήσει
  choice: panggilan
  rationale: Mempertahankan arti leksikal dan permainan kata dengan ἐκλήθη, tanpa mereduksi ketegangan antara panggilan ilahi dan keadaan hidup ketika seseorang dipanggil.
- source_word: ᾗ ἐκλήθη
  choice: yang di dalamnya ia dipanggil
  rationale: Mempertahankan konstruksi relatif serta pengulangan gagasan 'di dalam'; bentuk pasif tidak menyebutkan pelaku secara eksplisit, sebagaimana teks Yunani.
- source_word: ἐν ταύτῃ
  choice: tetap berada dalam [panggilan itu]
  rationale: Acuan demonstratif kepada panggilan yang baru disebutkan diungkapkan secara alami melalui susunan kalimat Indonesia tanpa mengulang 'dalam hal ini' secara kaku.
- source_word: μενέτω
  choice: hendaklah ... tetap berada
  rationale: Menyampaikan imperatif kini sebagai perintah untuk terus bertahan dalam keadaan tersebut, dengan ragam bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Makna κλῆσις dalam konteks
  choice: Memakai 'panggilan' dalam teks utama.
  alternative: keadaan; situasi; kedudukan hidup
  rationale: Konteks membahas keadaan sosial dan kehidupan, tetapi pasangan κλήσει dan ἐκλήθη sengaja menghubungkan 'panggilan' dengan keadaan ketika seseorang dipanggil. Terjemahan ini mempertahankan permainan kata dan ketegangan teologis-kontekstual itu.
- issue: Bentuk maskulin tunggal yang representatif
  choice: Memakai 'ia', yang netral secara alami dalam bahasa Indonesia.
  alternative: dia; orang itu
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga. 'Ia' mempertahankan bentuk tunggal dan penerapan individual tanpa memasukkan gender yang tidak dapat diekspresikan secara gramatikal dalam bahasa sasaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'yang di dalamnya' sedikit formal, tetapi dipilih untuk mempertahankan hubungan struktural dan permainan kata teks Yunani. Tidak diperlukan catatan gender tersendiri karena pronomina Indonesia 'ia' tidak bergender.
