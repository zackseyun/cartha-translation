  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: id
  text: Hanya saja, sebagaimana Tuhan telah memberikan bagian kepada setiap orang[a] dan sebagaimana Allah telah memanggilnya, hendaklah setiap orang menjalani hidupnya[b]. Dan demikianlah aku memberi petunjuk di semua jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah membagikan,” “telah menetapkan bagian,” atau “telah mengaruniakan bagian.” Kata Yunani ini menunjuk pada bagian yang Tuhan bagikan atau tetapkan bagi setiap orang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hendaklah ia berjalan.” Dalam Alkitab, “berjalan” sering menjadi kiasan untuk cara seseorang hidup atau bertingkah laku.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Hanya saja
  rationale: Dalam konteks ini, ungkapan tersebut berfungsi sebagai peralihan pembatas atau adversatif, bukan syarat harfiah. “Hanya saja” alami dalam bahasa Indonesia dan memperkenalkan prinsip umum Paulus.
- source_word: ἑκάστῳ / ἕκαστον
  choice: setiap orang ... setiap orang
  rationale: Pengulangan dipertahankan untuk mencerminkan tekanan distributif teks Yunani, meskipun pronomina “-nya” digunakan dalam klausa panggilan agar kalimat tetap alami.
- source_word: ἐμέρισεν
  choice: telah memberikan bagian
  rationale: Pilihan ini menyampaikan tindakan membagikan atau menentukan bagian bagi seseorang tanpa mempersempitnya secara eksplisit menjadi status sosial tertentu.
- source_word: κέκληκεν
  choice: telah memanggil
  rationale: Bentuk perfektum diterjemahkan dengan “telah” untuk menunjukkan tindakan panggilan yang sudah terjadi dan tetap relevan.
- source_word: περιπατείτω
  choice: hendaklah ... menjalani hidupnya
  rationale: Metafora harfiah “berjalan” kurang wajar dalam bahasa Indonesia modern untuk cara hidup. “Menjalani hidup” menyampaikan makna metaforisnya, sementara catatan kaki mencatat gambaran sumber.
- source_word: διατάσσομαι
  choice: kutetapkan
  rationale: Kata ini menyampaikan pengarahan yang berwenang. “Kutetapkan” mempertahankan otoritas Paulus tanpa memberi kesan nada keras yang belum tentu dimaksudkan.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: di semua jemaat
  rationale: Dalam konteks Paulus, ἐκκλησίαις menunjuk pada komunitas-komunitas orang percaya setempat; “jemaat” merupakan padanan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Pembedaan antara “Tuhan” dan “Allah”
  choice: 'Mempertahankan kedua sebutan secara terpisah: Tuhan memberikan bagian dan Allah memanggil.'
  alternative: Menyatukan keduanya sebagai variasi gaya yang menunjuk kepada satu pelaku ilahi tanpa mempertahankan perbedaan sebutan.
  rationale: Teks Yunani sengaja memakai ὁ κύριος dan ὁ θεός dalam klausa sejajar. Terjemahan tidak mengharmoniskan atau menjelaskan lebih jauh hubungan kedua sebutan itu.
- issue: Hubungan panggilan Allah dengan keadaan hidup seseorang
  choice: 'Menerjemahkan secara terbuka: “sebagaimana Allah telah memanggilnya.”'
  alternative: Menafsirkan secara eksplisit sebagai “dalam keadaan ketika Allah memanggilnya” atau sebagai “sesuai dengan panggilan Allah.”
  rationale: Susunan Yunani dapat dipahami dalam kaitan dengan keadaan hidup maupun tindakan panggilan Allah. Rumusan ini mempertahankan keluasan tersebut tanpa memilih salah satu penjelasan.
- issue: Metafora etis περιπατείτω
  choice: Menggunakan ungkapan Indonesia “menjalani hidupnya” dan menjelaskan metafora “berjalan” dalam catatan kaki.
  alternative: Menerjemahkan secara harfiah “hendaklah ia berjalan.”
  rationale: Arti metaforisnya ialah cara hidup. Padanan dinamis ini lebih mudah dipahami pembaca modern, sedangkan catatan kaki menjaga hubungan dengan citra sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel antara tindakan Tuhan dan panggilan Allah dipertahankan, sementara susunan kalimat disesuaikan agar mudah dipahami. “Jemaat” dipilih daripada “gereja” untuk menekankan komunitas setempat.
