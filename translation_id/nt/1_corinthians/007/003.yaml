id: 1CO.7.3
reference: 1 Corinthians 7:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: id
  text: Hendaklah suami memenuhi kewajibannya terhadap istrinya[a], dan demikian juga istri terhadap suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “apa yang wajib diberikannya” atau “utangnya.” Dalam konteks ini, yang dimaksud ialah kewajiban dalam hubungan intim suami-istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: istrinya
  rationale: Dalam konteks petunjuk mengenai perkawinan, γυνή berarti istri, bukan perempuan secara umum; bentuk posesif memperjelas hubungan pasangan yang tersirat.
- source_word: ἀνήρ
  choice: suami
  rationale: Dalam kesejajaran dengan γυνή dan konteks perkawinan, ἀνήρ berarti suami, bukan laki-laki secara umum.
- source_word: ὀφειλήν
  choice: kewajibannya
  rationale: ὀφειλή secara harfiah menunjuk pada sesuatu yang terutang atau wajib diberikan. Dalam konteks ayat 2, 4–5, ini adalah kewajiban suami-istri, tetapi terjemahan utama mempertahankan keluasan istilah sumber tanpa mempersempitnya secara berlebihan.
- source_word: ἀποδιδότω
  choice: hendaklah ... memenuhi
  rationale: Imperatif kini ini menyatakan kewajiban yang berkelanjutan. 'Hendaklah ... memenuhi' alami dalam bahasa Indonesia dan sesuai dengan gagasan memberikan apa yang wajib diberikan.
- source_word: ὁμοίως
  choice: demikian juga
  rationale: Ungkapan ini menyampaikan kesetaraan timbal balik antara suami dan istri secara alami.
- source_word: δὲ καὶ
  choice: dan ... juga
  rationale: Gabungan partikel ini menghubungkan klausa kedua secara aditif dan menegaskan bahwa kewajiban tersebut berlaku timbal balik.
theological_decisions:
- issue: Seberapa eksplisit kewajiban yang dinyatakan oleh ὀφειλή harus diterjemahkan
  choice: Gunakan 'kewajibannya' dalam teks utama dan jelaskan konteks suami-istri dalam catatan kaki.
  alternative: '''kewajiban perkawinannya'' atau ''hak yang menjadi bagian istrinya'''
  rationale: Konteks menunjukkan hubungan intim suami-istri, tetapi nomina Yunani itu sendiri berarti kewajiban atau sesuatu yang terutang. Pilihan ini menjaga makna kontekstual sekaligus tidak memasukkan rincian yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kedua klausa dibuat seimbang untuk mempertahankan penekanan teks pada kewajiban yang sepenuhnya timbal balik.
