review_pass:
  verdict: approve
  source_fidelity: Teks secara akurat menyampaikan imperatif berkelanjutan ἀποδιδότω dan timbal balik yang ditekankan oleh ὁμοίως δὲ καί. “Memenuhi kewajibannya terhadap istrinya” merupakan padanan idiomatis yang menangkap ὀφειλή sebagai sesuatu yang wajib diberikan/dipenuhi dalam relasi perkawinan. Catatan kaki dengan tepat mempertahankan arti literal “utang” dan menjelaskan konteks tanpa menjadikannya lebih sempit daripada yang dinyatakan nomina Yunani itu sendiri.
  naturalness: Susunannya modern, jelas, dan wajar dalam bahasa Indonesia baku. Pengulangan eliptis pada klausa kedua (“demikian juga istri terhadap suaminya”) terdengar alami dan mempertahankan kesejajaran retoris sumber.
  terminology: “Suami,” “istri,” dan “kewajiban” tepat untuk konteks perkawinan. Istilah “hubungan intim suami-istri” dalam catatan kaki menjelaskan konteks dekat ayat ini secara bermartabat dan tanpa menambahkan rincian doktrinal.
