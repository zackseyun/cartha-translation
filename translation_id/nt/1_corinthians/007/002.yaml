  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: id
  text: Namun, karena perbuatan-perbuatan cabul[a], hendaklah setiap laki-laki mempunyai istrinya sendiri, dan hendaklah setiap perempuan mempunyai suaminya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “percabulan”. Dalam bahasa Yunani, kata ini berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Namun, karena
  rationale: διά dengan akusatif menyatakan sebab, sedangkan δέ menandai peralihan atau pertentangan ringan. Gabungan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: τὰς πορνείας
  choice: berbagai percabulan
  rationale: πορνεία menunjuk pada perilaku seksual yang tidak bermoral, dan bentuk Yunaninya jamak. 'Berbagai percabulan' mempertahankan unsur jamak secara alami; catatan kaki menyediakan padanan kolektif yang lebih lazim.
- source_word: ἕκαστος
  choice: setiap laki-laki
  rationale: Bentuk maskulin ini berpasangan secara paralel dengan ἑκάστη dan merujuk kepada pihak laki-laki, bukan sekadar 'setiap orang' secara umum.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: istrinya sendiri
  rationale: Dalam pasangan perkawinan dengan ἄνδρα, γυνή berarti 'istri'. Bentuk refleksif ἑαυτοῦ menekankan bahwa yang dimaksud ialah istrinya sendiri.
- source_word: ἐχέτω
  choice: hendaklah ... mempunyai
  rationale: Imperatif kini orang ketiga dipertahankan sebagai arahan langsung. 'Hendaklah ... mempunyai' tidak mengubahnya menjadi kata kerja eksplisit 'menikah' atau menjadi keharusan mutlak yang lebih kuat.
- source_word: καὶ ἑκάστη
  choice: dan hendaklah setiap perempuan
  rationale: Bentuk feminin distributif sejajar dengan klausa pertama. 'Perempuan' mencerminkan bentuk Yunani, sementara objek berikutnya menjelaskan hubungan perkawinan.
- source_word: τὸν ἴδιον ἄνδρα
  choice: suaminya sendiri
  rationale: Dalam konteks perkawinan dan paralel dengan γυναῖκα, ἀνήρ berarti 'suami'. ἴδιον menegaskan kepunyaan masing-masing.
theological_decisions:
- issue: Apakah ayat ini harus ditafsirkan sebagai anjuran untuk menikah demi menghindari dosa seksual atau sebagai perintah tentang hubungan perkawinan
  choice: Mempertahankan ungkapan 'hendaklah ... mempunyai' sebagai petunjuk mengenai setiap laki-laki dan perempuan yang mempunyai pasangannya sendiri karena berbagai percabulan.
  alternative: Menerjemahkannya secara lebih interpretatif sebagai 'hendaklah menikah' atau 'hendaklah memenuhi kewajiban perkawinan'.
  rationale: Teks Yunani memakai ἐχέτω, 'mempunyai', bukan kata kerja khusus untuk menikah atau berhubungan seksual. Terjemahan ini mempertahankan keluasan dan ketegangan makna teks tanpa memasukkan kesimpulan doktrinal dari konteks yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Percabulan' dipilih sebagai istilah ringkas yang cukup luas untuk perilaku seksual tidak bermoral; bentuk 'berbagai percabulan' membuat jamak Yunani terbaca alami. Struktur paralel kedua klausa dipertahankan.
