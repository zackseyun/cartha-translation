source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: id
  text: Sebab suami yang tidak percaya telah dikuduskan melalui istrinya, dan istri yang tidak percaya telah dikuduskan melalui saudara seiman itu[a]. Jika tidak demikian, anak-anakmu najis, tetapi sekarang mereka kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara laki-laki itu”; kemungkinan besar yang dimaksud ialah suami yang percaya, sesuai dengan kebiasaan Paulus menyebut sesama orang percaya sebagai saudara.
    reason: lexical_alternative
  - marker: b
    text: “Telah dikuduskan” di sini menyatakan status yang dikhususkan atau disucikan dalam hubungan dengan pasangan yang percaya dan keluarga; ungkapan ini tidak dengan sendirinya berarti bahwa pasangan yang tidak percaya telah menerima keselamatan pribadi.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: telah dikuduskan
  rationale: Bentuk perfekt pasif menyatakan tindakan yang menghasilkan keadaan yang tetap. Pilihan ini juga mempertahankan hubungan leksikal dengan ἅγιά (“kudus”), tanpa dengan sendirinya menentukan bahwa pasangan yang tidak percaya telah menerima keselamatan pribadi.
- source_word: ἄπιστος
  choice: yang tidak percaya
  rationale: Dalam konteks ini kata tersebut menunjuk kepada pasangan yang tidak beriman, bukan kepada orang yang tidak dapat dipercaya atau tidak setia.
- source_word: ἐν
  choice: melalui
  rationale: 'Di sini ἐν paling wajar dipahami secara relasional atau instrumental: status pasangan yang tidak percaya terkait dengan persatuannya dengan pasangan yang percaya. “Melalui” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “di dalam”.'
- source_word: ἀνήρ / γυνή
  choice: suami / istri
  rationale: Konteks langsungnya adalah perkawinan, sehingga makna khusus “suami” dan “istri” lebih tepat daripada “laki-laki” dan “perempuan”.
- source_word: ἀδελφῷ
  choice: saudara seiman itu
  rationale: Secara harfiah berarti “saudara laki-laki itu”; Paulus lazim memakai kata ini bagi sesama orang percaya. “Saudara seiman itu” mempertahankan ungkapan sumber dan menunjukkan bahwa yang dimaksud kemungkinan besar ialah suami yang percaya, tanpa menggantinya langsung dengan “suami”.
- source_word: ἐπεὶ ἄρα
  choice: jika tidak demikian
  rationale: Gabungan ini memperkenalkan akibat yang akan berlaku apabila pernyataan sebelumnya tidak benar.
- source_word: ἀκάθαρτα
  choice: najis
  rationale: “Najis” mempertahankan nuansa kenajisan keagamaan atau status yang tidak tahir lebih baik daripada istilah umum seperti “tidak murni”.
- source_word: νῦν δὲ
  choice: tetapi sekarang
  rationale: Ungkapan ini mengontraskan keadaan yang sebenarnya dengan akibat hipotetis sebelumnya dan tetap mempertahankan unsur νῦν, “sekarang”.
- source_word: ἅγιά
  choice: kudus
  rationale: “Kudus” menjaga kesinambungan leksikal dengan ἡγίασται dan mempertahankan bobot teologis teks tanpa mempersempit artinya menjadi sekadar “dipisahkan”.
theological_decisions:
- issue: Makna pasangan yang tidak percaya “telah dikuduskan”
  choice: Mempertahankan bahasa kekudusan sambil menjelaskannya sebagai status khusus dalam hubungan dengan pasangan percaya dan keluarga, bukan otomatis keselamatan pribadi.
  alternative: Menafsirkan bahwa pasangan yang tidak percaya otomatis diselamatkan melalui perkawinan; atau membatasi ungkapan itu hanya pada keabsahan hubungan seksual dalam perkawinan.
  rationale: Argumen Paulus menghubungkan status pasangan dengan status anak-anak. Teks menyatakan kekudusan relasional, tetapi tidak mengatakan secara eksplisit bahwa pasangan yang tidak percaya telah mengalami keselamatan pribadi.
- issue: Rujukan ἀδελφῷ
  choice: Menerjemahkan “saudara seiman itu” dalam teks utama dan menjelaskan bahwa yang dimaksud kemungkinan besar ialah suami yang percaya.
  alternative: Mengganti langsung dengan “suami yang percaya” demi kesejajaran dengan klausa pertama.
  rationale: Teks Yunani memakai ἀδελφός, bukan ἀνήρ, pada klausa kedua. Mempertahankan sebutan ini menghormati bentuk sumber dan kebiasaan Paulus menyebut orang percaya sebagai saudara.
- issue: Status anak-anak sebagai “kudus”
  choice: Mempertahankan kata “kudus” tanpa menyamakannya secara eksplisit dengan keselamatan pribadi.
  alternative: Menafsirkan “kudus” sebagai jaminan bahwa anak-anak telah diselamatkan, atau hanya sebagai pernyataan mengenai legitimasi kelahiran mereka.
  rationale: Teks mengontraskan “najis” dan “kudus”, tetapi tidak menguraikan seluruh implikasi soteriologisnya; ketegangan itu perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah teologis “dikuduskan”, “najis”, dan “kudus” dipertahankan karena penting bagi hubungan antarkata dan argumen ayat; catatan kaki mencegah istilah tersebut dibaca lebih sempit daripada yang dinyatakan teks.
