reference: 1 Corinthians 7:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: id
  text: Aku mengatakan hal ini demi kebaikan kalian sendiri, bukan untuk menjerat kalian, melainkan demi apa yang pantas dan pengabdian kepada Tuhan tanpa gangguan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: kebaikan
  rationale: Dalam konteks ini menunjuk pada apa yang bermanfaat bagi para pembaca; frasa “demi kebaikan kalian sendiri” menyampaikan maknanya secara alami.
- source_word: βρόχον
  choice: menjerat
  rationale: Kata ini secara harfiah menunjuk pada jerat atau tali penjerat. Bentuk verbal “menjerat” mempertahankan metafora tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: εὔσχημον
  choice: hidup dengan pantas
  rationale: Nominal Yunani ini menunjuk pada apa yang patut atau terhormat. Penambahan “hidup” membuat fungsi frasa tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: εὐπάρεδρον ... ἀπερισπάστως
  choice: mengabdi ... tanpa teralihkan
  rationale: Gabungan ini menggambarkan perhatian atau pengabdian yang tetap tertuju kepada Tuhan tanpa gangguan; terjemahan ini menjaga gagasan fokus yang tidak terbagi.
theological_decisions:
- issue: Sifat nasihat Paulus mengenai hidup tidak menikah
  choice: bukan untuk menjerat kalian
  alternative: bukan untuk membatasi kalian
  rationale: Metafora sumber dipertahankan agar jelas bahwa Paulus menyangkal niat untuk memaksakan ikatan atau kendali, tanpa mengubah nasihatnya menjadi larangan mutlak.
- issue: Hubungan antara kepantasan dan pengabdian kepada Tuhan
  choice: agar kalian hidup dengan pantas dan mengabdi kepada Tuhan tanpa teralihkan
  alternative: demi apa yang pantas dan demi pengabdian yang tidak terganggu kepada Tuhan
  rationale: Bentuk verbal lebih alami dalam bahasa Indonesia, sambil mempertahankan kedua tujuan yang dihubungkan oleh καί.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk menandai penerima jamak dengan jelas; “Aku” sesuai dengan suara pribadi Paulus. Diksi tetap bermartabat tanpa menjadi terlalu formal.
