  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: id
  text: Jadi, orang yang menikahkan perawannya sendiri berbuat baik, dan orang yang tidak menikahkannya akan berbuat lebih baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang menikahi tunangannya yang masih perawan berbuat baik, dan orang yang tidak menikahinya akan berbuat lebih baik.” Penafsiran umum lainnya memahami perempuan itu sebagai anak perawannya. Kata kerja Yunani di sini lebih alami berarti “menikahkan”; karena itu, teks utama mempertahankan arti tersebut tanpa menentukan secara lebih khusus hubungan perempuan itu dengan orang tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan dari uraian sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: γαμίζων
  choice: menikahkan
  rationale: Mempertahankan arti kausatif γαμίζω, yaitu memberikan seseorang untuk menikah, dan tidak menyamakannya dengan γαμέω, 'menikah'.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: perawannya sendiri
  rationale: Mempertahankan kata 'perawan' serta hubungan posesif/refleksif tanpa menetapkan secara pasti apakah perempuan itu anak, tanggungan, atau tunangan.
- source_word: καλῶς ποιεῖ
  choice: berbuat baik
  rationale: Menyampaikan penilaian positif dalam ungkapan Indonesia yang wajar tanpa menjadikannya perintah mutlak.
- source_word: μὴ γαμίζων
  choice: tidak menikahkannya
  rationale: Konsisten mempertahankan arti kausatif; akhiran -nya merujuk kembali kepada perempuan dalam klausa pertama.
- source_word: κρεῖσσον ποιήσει
  choice: akan berbuat lebih baik
  rationale: Mempertahankan bentuk komparatif κρεῖσσον dan aspek futur ποιήσει, tanpa mengubahnya menjadi superlatif.
theological_decisions:
- issue: Rujukan frasa 'perawannya sendiri' dan arti γαμίζω dalam 1 Korintus 7:38
  choice: Teks utama memakai arti kausatif 'menikahkan' dan tidak menentukan hubungan sosial perempuan itu secara lebih khusus.
  alternative: Ayat ini juga dapat dipahami tentang seseorang yang menikahi tunangannya yang masih perawan; penafsiran umum lainnya menganggap perempuan itu anak perawannya.
  rationale: γामίζω lebih alami berarti 'menikahkan', tetapi identitas tepat τὴν παρθένον ἑαυτοῦ diperdebatkan. Terjemahan mempertahankan ketegangan tersebut dan menjelaskan alternatif utama dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Ungkapan 'perawannya sendiri' sengaja agak harfiah untuk mempertahankan ambiguitas asli; catatan kaki membantu pembaca memahami kemungkinan rujukannya.
