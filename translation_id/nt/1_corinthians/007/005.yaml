  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: id
  text: Janganlah kamu saling merugikan, kecuali mungkin atas persetujuan bersama dan hanya untuk sementara waktu, supaya kamu dapat membaktikan diri kepada doa. Kemudian hendaklah kamu kembali bersama[b], supaya Satan tidak mencobai kamu karena kurangnya pengendalian diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Secara harfiah: “kembali berada bersama”; dalam konteks ini, ungkapan tersebut menunjuk pada pemulihan kebersamaan sebagai suami istri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: menahan apa yang menjadi hak pasanganmu
  rationale: Dalam konteks perkawinan, kata ini menunjuk pada tindakan tidak memberikan kepada pasangan apa yang menjadi haknya. Ungkapan ini mempertahankan daya etis verba Yunani tanpa memberi kesan penipuan komersial.
- source_word: ἀλλήλους
  choice: saling
  rationale: Bentuk timbal balik ini menunjukkan bahwa nasihat tersebut berlaku sama bagi kedua pasangan.
- source_word: εἰ μήτι ἂν
  choice: kecuali mungkin
  rationale: Gabungan ini memperkenalkan pengecualian yang terbatas dan bernuansa tentatif, bukan izin umum.
- source_word: ἐκ συμφώνου
  choice: atas persetujuan bersama
  rationale: Frasa ini menegaskan bahwa keputusan tersebut harus disepakati oleh kedua pasangan.
- source_word: πρὸς καιρόν
  choice: untuk sementara waktu
  rationale: Menunjukkan jangka waktu yang terbatas; pilihan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: σχολάσητε
  choice: mengkhususkan diri
  rationale: Dalam konstruksi ini, verba tersebut berarti membebaskan atau menyediakan diri secara khusus bagi suatu kegiatan.
- source_word: τῇ προσευχῇ
  choice: untuk berdoa
  rationale: Bentuk tunggal Yunani menunjuk pada kegiatan doa secara umum; bentuk verbal lebih alami dalam bahasa Indonesia.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: kembali hidup bersama
  rationale: Ungkapan ini menunjuk pada bersatunya kembali pasangan dalam kehidupan perkawinan, termasuk implikasi hubungan seksual, tetapi tetap mempertahankan kesantunan dan ketidaklangsungan ungkapan Yunani.
- source_word: πειράζῃ
  choice: mencobai
  rationale: Dengan Iblis sebagai pelaku dan kurangnya pengendalian diri sebagai keadaan yang dimanfaatkan, maknanya adalah menggoda atau membujuk kepada dosa, bukan sekadar menguji.
- source_word: Σατανᾶς
  choice: Iblis
  rationale: Dalam bahasa Indonesia Alkitabiah modern, 'Iblis' adalah sebutan baku dan mudah dipahami bagi tokoh pribadi yang dimaksud oleh Σατανᾶς.
- source_word: ἀκρασίαν
  choice: kurang mampu mengendalikan diri
  rationale: Kata benda ini menyatakan kelemahan atau ketidakmampuan dalam pengendalian diri. Rumusan ini alami serta mempertahankan nuansa keadaan yang dapat dimanfaatkan oleh pencobaan.
theological_decisions:
- issue: Apakah πάλιν ἐπὶ τὸ αὐτὸ ἦτε harus dibuat eksplisit sebagai melanjutkan hubungan seksual
  choice: kembali hidup bersama
  alternative: kembali melakukan hubungan suami istri
  rationale: Konteks menyiratkan bersatunya kembali pasangan, kemungkinan besar termasuk hubungan seksual, tetapi bahasa Yunani menyatakannya secara tidak langsung. Terjemahan mempertahankan kesantunan serta cakupan ungkapan sumber.
- issue: Apakah ὁ Σατανᾶς dipahami sebagai pribadi atau digeneralisasi sebagai kuasa lawan
  choice: Iblis
  alternative: si penentang
  rationale: Dalam konteks Paulus, bentuk ini menunjuk pada pribadi yang dikenal sebagai Iblis, bukan sekadar kekuatan atau perlawanan abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Diksi mempertahankan sifat timbal balik perintah, batas waktu pengecualian, tujuan doa, serta ungkapan tidak langsung mengenai bersatunya kembali pasangan.
