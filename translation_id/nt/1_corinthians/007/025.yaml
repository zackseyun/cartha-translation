id: 1CO.7.25
reference: 1 Corinthians 7:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: id
  text: Mengenai para perawan[a], aku tidak mempunyai perintah dari Tuhan. Namun, aku memberikan pertimbanganku[b] sebagai orang yang, karena belas kasihan Tuhan, dapat dipercaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan-perempuan yang belum menikah”; menurut sebagian penafsiran konteks, “anak-anak perempuan yang masih perawan”. Teks Yunani secara harfiah berbunyi “para perawan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “pendapatku” atau “nasihatku”. Di sini Paulus membedakan pertimbangannya yang matang dari suatu “perintah dari Tuhan” yang langsung.
    reason: alternative_reading
  - marker: c
    text: Atau “setia”. Kata Yunani yang dipakai dapat berarti “setia” atau “dapat dipercaya”; dalam konteks ini, maksudnya kemungkinan besar ialah bahwa karena belas kasihan Tuhan, Paulus merupakan pembimbing yang dapat dipercaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Memperkenalkan topik baru secara wajar dalam bahasa Indonesia tanpa menambahkan unsur waktu yang tidak dinyatakan secara eksplisit.
- source_word: τῶν παρθένων
  choice: para perawan
  rationale: Mempertahankan arti dasar istilah Yunani dan tidak mempersempit rujukannya yang diperdebatkan dalam konteks.
- source_word: ἐπιταγὴν κυρίου οὐκ ἔχω
  choice: aku tidak mendapat perintah dari Tuhan
  rationale: Mengungkapkan bahwa Paulus tidak memiliki perintah yang berasal dari Tuhan mengenai pokok ini; 'mendapat' terdengar alami dan tidak menyiratkan bahwa ia sekadar tidak memiliki kewenangan.
- source_word: γνώμην δὲ δίδωμι
  choice: Namun, aku memberikan pertimbanganku
  rationale: Menjaga kontras dengan perintah langsung sekaligus menyampaikan penilaian yang dipikirkan dengan matang, bukan pendapat sambil lalu.
- source_word: ὡς ἠλεημένος ὑπὸ κυρίου
  choice: sebagai orang yang, karena belas kasihan Tuhan
  rationale: Menyampaikan keadaan Paulus sebagai orang yang telah menerima belas kasihan Tuhan dengan ungkapan Indonesia yang alami.
- source_word: πιστὸς εἶναι
  choice: dapat dipercaya
  rationale: Dalam konteks ini, πιστός terutama menunjuk pada kelayakan Paulus untuk dipercaya ketika memberikan pertimbangan, sambil tetap mengakui kemungkinan arti 'setia' dalam catatan.
theological_decisions:
- issue: Sifat kewenangan pertimbangan Paulus dibandingkan dengan perintah langsung dari Tuhan
  choice: Terjemahan membedakan ketiadaan perintah langsung dari Tuhan dari pertimbangan Paulus yang layak dipercaya karena belas kasihan Tuhan.
  alternative: Menganggap perkataan ini hanya pendapat pribadi tanpa bobot, atau menyamakannya sepenuhnya dengan perintah langsung Tuhan.
  rationale: Kontras antara ἐπιταγή dan γνώμη harus dipertahankan tanpa merendahkan pertimbangan rasuli Paulus ataupun menyebutnya sebagai perintah langsung.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pronomina 'aku' dipakai sesuai gaya tutur pribadi surat Paulus. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
