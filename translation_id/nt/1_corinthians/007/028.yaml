    issue: Terjemahan dan catatan kaki untuk φείδομαι kurang tepat.
    rationale: “Aku hendak menghindarkan kamu dari hal itu” memakai ‘hendak’, yang tidak ditandai oleh bentuk kini φείδομαι, serta menambahkan ‘hal itu’. Catatan “aku menyayangkan kamu” tidak merupakan padanan leksikal yang memadai. Konteks memang mendukung tujuan pastoral untuk menghindarkan pembaca dari kesusahan yang disebutkan.
