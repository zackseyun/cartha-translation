  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: id
  text: Namun, sekalipun engkau menikah, engkau tidak berdosa; dan jika perawan itu menikah, ia tidak berdosa. Tetapi orang-orang seperti itu akan mengalami kesusahan dalam kehidupan jasmani[a], dan aku ingin menghindarkan kamu dari kesusahan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kesusahan dalam daging”; frasa ini kemungkinan besar menunjuk pada kesulitan dalam kehidupan jasmani atau duniawi yang berkaitan dengan pernikahan, bukan pada “tabiat berdosa.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “aku menyisihkan kamu” atau “aku menghindarkan kamu.” Paulus menyatakan tujuan pastoralnya dalam memperingatkan mereka tentang kesusahan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: engkau menikah
  rationale: Konstruksi ἐάν dengan aoristus subjungtif menyatakan syarat yang mungkin terjadi; 'jika/sekalipun engkau menikah' menyampaikan maknanya secara alami.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: tidak berdosa
  rationale: Aoristus menyangkal bahwa tindakan menikah merupakan dosa. Bentuk Indonesia ini alami dan tidak menggeser penilaian moral tersebut.
- source_word: ἡ παρθένος
  choice: perawan itu
  rationale: Mempertahankan arti langsung παρθένος dan artikelnya, tanpa mempersempitnya menjadi tunangan atau memperluasnya menjadi sekadar perempuan yang belum menikah.
- source_word: θλῖψιν
  choice: kesusahan
  rationale: Mencakup tekanan, penderitaan, atau kesulitan tanpa memberi kesan teknis-eskatologis yang dapat muncul dari 'kesengsaraan besar'.
- source_word: τῇ σαρκὶ
  choice: dalam kehidupan jasmani
  rationale: Menyampaikan ranah kehidupan yang berwujud dan fana, bukan 'tabiat berdosa'; catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: οἱ τοιοῦτοι
  choice: orang-orang seperti itu
  rationale: Menjaga rujukan umum kepada orang dari jenis yang baru disebutkan, yakni mereka yang menikah.
- source_word: φείδομαι
  choice: aku hendak menghindarkan kamu dari hal itu
  rationale: φείδομαι dengan genitif dapat menyatakan tindakan atau maksud untuk menyayangkan dan membebaskan seseorang dari kesusahan; 'hendak' mempertahankan nuansa pastoral tanpa menyiratkan keberhasilan usaha yang belum tentu.
theological_decisions:
- issue: Makna σάρξ dalam τῇ σαρκί
  choice: kehidupan jasmani, yakni keadaan hidup manusia yang berwujud dan duniawi
  alternative: daging; tabiat berdosa
  rationale: Konteks membahas kesusahan yang dialami orang menikah, bukan pernyataan tentang natur berdosa. Terjemahan ini mencegah pembacaan antropologis yang tidak dituntut teks, sementara alternatif literal dicatat.
- issue: Daya ungkap φείδομαι
  choice: maksud pastoral Paulus untuk menghindarkan pembaca dari kesusahan tersebut
  alternative: aku menyayangkan kamu; aku sedang menghindarkan kamu
  rationale: Klausa dapat dipahami sebagai pernyataan tindakan atau maksud Paulus. 'Hendak menghindarkan' alami dalam bahasa Indonesia dan tidak mengubah peringatan menjadi klaim bahwa kesusahan pasti telah dicegah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dan 'aku' mempertahankan sapaan tunggal serta suara pribadi Paulus. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.
