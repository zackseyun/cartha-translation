id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: id
  text: Dan perhatiannya terbagi. Perempuan yang tidak menikah, yaitu seorang perawan,[a] memikirkan perkara-perkara Tuhan, supaya ia kudus baik dalam tubuh maupun dalam roh. Namun, perempuan yang sudah menikah memikirkan perkara-perkara dunia, yaitu bagaimana ia dapat menyenangkan suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perempuan yang tidak menikah dan seorang perawan memikirkan perkara-perkara Tuhan.” Teks Yunani dapat dipahami sebagai menyebutkan dua golongan, bukan menyamakan perempuan yang tidak menikah dengan perawan.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: perhatiannya terbagi
  rationale: Bentuk perfektum pasif menyatakan keadaan yang dihasilkan dan meneruskan gagasan ayat sebelumnya. Penambahan 'perhatiannya' membuat metafora pembagian dapat dipahami secara alami dalam bahasa Indonesia tanpa menafsirkannya sebagai kecemasan.
- source_word: γυνὴ ἡ ἄγαμος
  choice: perempuan yang tidak menikah
  rationale: γυνή dapat berarti perempuan atau istri, tetapi dalam pertentangan ini menunjuk kepada perempuan dalam keadaan tidak menikah.
- source_word: παρθένος
  choice: seorang perawan
  rationale: Mempertahankan arti khusus παρθένος dan tidak meratakannya menjadi sekadar 'gadis'.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: perempuan yang tidak menikah, yaitu seorang perawan
  rationale: Susunan Yunani yang padat dapat dipahami secara aposisional, dan verba tunggal μεριμνᾷ mendukung subjek terpadu. Bacaan koordinatif tetap dicatat dalam catatan kaki.
- source_word: μεριμνᾷ
  choice: memikirkan
  rationale: Dalam konteks ini kata tersebut menyatakan perhatian atau kepedulian yang terarah, bukan dengan sendirinya kecemasan yang berdosa. 'Memikirkan' alami dan sesuai dengan objek yang mengikutinya.
- source_word: τὰ τοῦ κυρίου
  choice: perkara-perkara Tuhan
  rationale: Mempertahankan bentuk umum ungkapan Yunani serta kesejajarannya dengan 'perkara-perkara dunia'.
- source_word: ἵνα ᾖ ἁγία
  choice: supaya ia kudus
  rationale: Mempertahankan maksud/hasil yang dinyatakan ἵνα dan istilah teologis eksplisit ἁγία.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: baik dalam tubuh maupun dalam roh
  rationale: Mengungkapkan kedua lingkup kekudusan secara alami tanpa memaksakan teori antropologis tertentu.
- source_word: ἡ δὲ γαμήσασα
  choice: perempuan yang sudah menikah
  rationale: Partisip aoris substantival menunjuk kepada perempuan dalam keadaan menikah; ungkapan ini idiomatis dalam bahasa Indonesia.
- source_word: τὰ τοῦ κόσμου
  choice: perkara-perkara dunia
  rationale: Menjaga kesejajaran dengan 'perkara-perkara Tuhan' dan tidak menambahkan nada negatif yang melampaui konteks.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: bagaimana ia dapat menyenangkan suaminya
  rationale: Dalam konteks perkawinan, ἀνήρ berarti suami. 'Dapat' menyampaikan nuansa maksud atau pertimbangan dari bentuk subjungtif secara wajar.
theological_decisions:
- issue: Apakah 'perempuan yang tidak menikah' dan 'perawan' merupakan dua golongan atau satu subjek dengan penjelasan aposisional
  choice: 'Diterjemahkan secara aposisional: ''perempuan yang tidak menikah, yaitu seorang perawan'''
  alternative: 'Diterjemahkan secara koordinatif: ''perempuan yang tidak menikah dan seorang perawan'''
  rationale: Teks Yunani bersifat padat dan memungkinkan kedua pembacaan. Verba tunggal mendukung pembacaan aposisional, tetapi pembacaan koordinatif tetap sungguh mungkin sehingga dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah 'kudus', 'tubuh', dan 'roh' dipertahankan karena merupakan unsur eksplisit teks; 'perkara-perkara' menjaga kesejajaran retoris tanpa memberi kesan bahwa urusan duniawi dalam perkawinan pasti berdosa.
