  verdict: approve
  source_fidelity: 'Teks Indonesia secara setia menyampaikan unsur-unsur utama Yunani: penerapan distributif (ἕκαστος), sapaan jemaat (ἀδελφοί), bentuk pasif tanpa menyebut pelaku (ἐκλήθη), perintah untuk tetap (μενέτω), keadaan/situasi panggilan yang ditunjuk oleh rangkaian ἐν ᾧ ... ἐν τούτῳ, dan frasa ambigu παρὰ θεῷ. Penggabungan pengulangan Yunani tentang ''dalam keadaan ... itu'' menjadi ''dalam keadaan ketika ia dipanggil'' adalah peringkasan idiomatis yang tidak mengubah acuan.'
  naturalness: Kalimatnya baku, jelas, dan wajar dalam bahasa Indonesia modern. “Hendaklah masing-masing tetap” menyampaikan daya imperatif dengan register yang sesuai. “Saudara-saudara” juga merupakan sapaan gerejawi yang lazim.
  terminology: “Allah” konsisten dan tepat untuk θεῷ. “Saudara-saudara” mempertahankan bentuk sapaan sumber tanpa menghapus cakupan jemaat; catatan b menjelaskan cakupan representatifnya. “Bersama Allah” adalah pilihan yang sah untuk παρὰ θεῷ, dan catatan a dengan tepat menjaga alternatif “di hadapan Allah” serta “dalam hadirat Allah.”
