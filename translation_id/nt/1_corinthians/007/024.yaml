id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: id
  text: Saudara-saudara[b], hendaklah masing-masing tetap bersama Allah[a] dalam keadaan ketika ia dipanggil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan Allah” atau “dalam hadirat Allah.”
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini menyapa seluruh jemaat, termasuk perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Bentuk tunggal distributif ini diterjemahkan secara alami dalam bahasa Indonesia sambil mempertahankan penerapan kepada setiap orang.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: dalam keadaan ketika ... dalam keadaan itu
  rationale: Rangkaian preposisional-relatif dan demonstratif menunjuk pada keadaan hidup atau kedudukan seseorang; susunan Indonesia diringkas menjadi 'dalam keadaan ketika ia dipanggil' agar alami tanpa mengubah acuannya.
- source_word: ἐκλήθη
  choice: ia dipanggil
  rationale: Bentuk pasif dipertahankan dan pelakunya tidak ditambahkan, sebagaimana dalam teks Yunani, meskipun konteks Paulus mengisyaratkan panggilan Allah.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara alami dapat menyapa seluruh jemaat dalam bahasa Indonesia; catatan menjelaskan bahwa perempuan juga tercakup.
- source_word: μενέτω
  choice: hendaklah ... tetap
  rationale: Imperatif orang ketiga diterjemahkan dengan 'hendaklah', sedangkan 'tetap' menyampaikan gagasan terus berada dalam keadaan yang sedang dibicarakan.
- source_word: παρὰ θεῷ
  choice: bersama Allah
  rationale: παρά dengan datif dapat menyatakan kedekatan atau relasi. 'Bersama Allah' mempertahankan terjemahan paling langsung, sementara kemungkinan 'di hadapan Allah' dicatat.
theological_decisions:
- issue: Apakah pelaku panggilan perlu disebutkan secara eksplisit
  choice: Mempertahankan bentuk pasif 'ia dipanggil' tanpa menambahkan 'oleh Allah'
  alternative: '''ia dipanggil oleh Allah'''
  rationale: Konteks Paulus sangat mungkin menunjuk kepada panggilan Allah, tetapi pelaku tidak dinyatakan dalam klausa Yunani; terjemahan tidak menambahkan unsur tersebut.
- issue: Cakupan sapaan ἀδελφοί
  choice: '''Saudara-saudara'' dengan catatan bahwa seluruh jemaat, termasuk perempuan, disapa'
  alternative: '''Saudara-saudari'''
  rationale: Bentuk sumber adalah jamak maskulin yang dalam konteks berfungsi sebagai sapaan representatif. Bahasa Indonesia 'Saudara-saudara' lazim dipakai secara inklusif, dan catatan menghindari kesalahpahaman.
- issue: Makna relasional atau forensik παρὰ θεῷ
  choice: '''bersama Allah'''
  alternative: '''di hadapan Allah'' atau ''dalam hadirat Allah'''
  rationale: Frasa Yunani yang padat memungkinkan nuansa kedekatan, relasi, atau keberadaan di hadapan Allah. Teks utama mempertahankan 'bersama', sedangkan ambiguitas yang bermakna dijaga dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk pasif, daya imperatif, dan ketaksaan frasa παρὰ θεῷ.
