  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: id
  text: Namun, jika ia berpisah[a], hendaklah ia tetap tidak menikah atau berdamai kembali dengan suaminya—dan seorang suami tidak boleh menceraikan istrinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, sekalipun ia berpisah.” Bahasa Yunani dapat mengandung nuansa konsesif di sini.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak boleh melepaskan istrinya.” Kata Yunaninya secara lebih harfiah dapat berarti “melepaskan” atau “mengirim pergi”, tetapi dalam konteks perkawinan lazim menunjuk perceraian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Namun, jika ... memang
  rationale: Ungkapan ini memperkenalkan syarat dengan nuansa konsesif yang mungkin dibawa oleh καί. Kata 'memang' menyampaikan nuansa itu secara wajar tanpa memperberat kalimat.
- source_word: χωρισθῇ
  choice: ia ... berpisah
  rationale: χωρίζω dapat berarti berpisah atau meninggalkan. 'Berpisah' mempertahankan cakupan umum verba ini dan tidak menyamakannya begitu saja dengan perceraian resmi.
- source_word: μενέτω ἄγαμος
  choice: hendaklah ia tetap tidak menikah
  rationale: Bentuk imperatif μενέτω dipertahankan dengan 'hendaklah', sedangkan ἄγαμος menunjuk keadaan tidak menikah. Ungkapan ini lebih alami daripada 'tetap tidak kawin' dalam bahasa Indonesia modern.
- source_word: τῷ ἀνδρὶ καταλλαγήτω
  choice: berdamai kembali dengan suaminya
  rationale: καταλλάσσω berbentuk imperatif pasif dan berarti diperdamaikan atau rukun kembali. 'Berdamai kembali' menyampaikan pemulihan hubungan tanpa menjelaskan lebih jauh bentuknya.
- source_word: ἄνδρα
  choice: seorang suami
  rationale: Dalam konteks perkawinan, ἀνήρ berarti suami. Bentuk generik anartikelnya wajar diterjemahkan 'seorang suami'.
- source_word: γυναῖκα
  choice: istrinya
  rationale: Dalam konteks ini γυνή berarti istri; akhiran '-nya' memperjelas hubungan perkawinan secara alami.
- source_word: μὴ ἀφιέναι
  choice: tidak boleh menceraikan
  rationale: Konstruksi ini meneruskan larangan yang dikutip Paulus. Dalam konteks perkawinan, ἀφίημι lazim menunjuk tindakan melepaskan atau menyuruh pergi pasangan, yaitu menceraikannya.
theological_decisions:
- issue: Apakah χωρισθῇ dan ἀφιέναι diterjemahkan dengan istilah yang sama
  choice: χωρισθῇ diterjemahkan 'berpisah', sedangkan ἀφιέναι diterjemahkan 'menceraikan'
  alternative: Menerjemahkan keduanya sebagai 'bercerai' atau keduanya sebagai 'meninggalkan/berpisah'
  rationale: Paulus memakai dua verba yang berbeda. Mempertahankan perbedaannya menghindari penyamaan perpisahan dengan perceraian resmi, sekaligus menyampaikan daya perkawinan dari ἀφιέναι dalam konteks ini.
- issue: Cara mengungkapkan subjek perempuan yang tersirat
  choice: Memakai 'ia' dalam klausa pertama
  alternative: Memakai 'istri itu' atau 'perempuan itu'
  rationale: Subjek perempuan ditentukan oleh konteks ayat sebelumnya. 'Ia' alami dalam bahasa Indonesia dan tidak menambahkan nomina yang tidak muncul dalam klausa Yunani.
- issue: Daya instruksi pada klausa terakhir
  choice: Menggunakan 'tidak boleh'
  alternative: Menggunakan 'janganlah' atau 'tidak seharusnya'
  rationale: '''Tidak boleh'' menyampaikan larangan secara jelas tanpa mengubahnya menjadi sekadar nasihat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Perbedaan antara 'berpisah' dan 'menceraikan' dipertahankan. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskan.
