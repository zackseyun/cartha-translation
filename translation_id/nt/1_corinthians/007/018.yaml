  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: id
  text: Apakah seseorang dipanggil ketika sudah bersunat? Janganlah ia berusaha menutupi tanda sunatnya.[a] Apakah seseorang dipanggil ketika belum bersunat? Janganlah ia disunat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Janganlah ia menjadi tidak bersunat,” yaitu janganlah ia mencoba menutupi atau membalikkan tanda-tanda sunat.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: ketika sudah bersunat
  rationale: Partisip perfek menyatakan keadaan yang telah dihasilkan oleh tindakan sunat. Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan keadaan orang itu saat dipanggil.
- source_word: ἐκλήθη / κέκληταί τις
  choice: seseorang dipanggil
  rationale: Dalam konteks ini, kata tersebut menunjuk pada panggilan Allah ke dalam kehidupan Kristen. Bentuk 'dipanggil' mempertahankan istilah Paulus tanpa mempersempitnya menjadi 'bertobat'; perbedaan aspek antara aoris dan perfek tidak perlu dipaksakan dalam bahasa Indonesia.
- source_word: ἐπισπάσθω
  choice: Janganlah ia berusaha menghilangkan tanda sunatnya
  rationale: Kata kerja ini secara harfiah mengacu pada upaya menjadikan diri tampak tidak bersunat, yaitu menutupi atau membalikkan tanda fisik sunat. Terjemahan ini menyampaikan maksudnya dengan jelas tanpa istilah medis yang asing.
- source_word: ἐν ἀκροβυστίᾳ
  choice: ketika belum bersunat
  rationale: Frasa ini menyatakan keadaan seseorang pada waktu dipanggil. 'Belum bersunat' merupakan ungkapan Indonesia yang wajar dan jelas.
- source_word: περιτεμνέσθω
  choice: Janganlah ia disunat
  rationale: Imperatif kini dengan μή menyatakan larangan. Bentuk pasif Indonesia mempertahankan struktur dan daya arahannya.
theological_decisions:
- issue: Makna 'dipanggil' dalam kedua pertanyaan
  choice: Dipanggil oleh Allah ke dalam kehidupan Kristen dalam keadaan sosial-keagamaan tertentu
  alternative: Dipanggil dalam arti umum atau sekadar diundang
  rationale: Dalam konteks 1 Korintus 7, bahasa panggilan menunjuk pada panggilan ilahi yang diterima orang percaya. Terjemahan tetap memakai 'dipanggil' agar tidak menambahkan penafsiran seperti 'bertobat' ke dalam teks.
- issue: Cakupan larangan mengenai sunat
  choice: Nasihat agar orang tidak mengubah keadaan bersunat atau tidak bersunat yang dimilikinya ketika dipanggil
  alternative: Pernyataan bahwa sunat pada dirinya selalu dilarang dalam setiap keadaan
  rationale: Struktur paralel ayat mengaitkan kedua larangan dengan keadaan seseorang ketika dipanggil. Terjemahan tidak memperluas larangan melampaui yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Ketika sudah bersunat' dan 'ketika belum bersunat' mempertahankan kesejajaran kedua klausa. Bentuk 'janganlah' dipilih untuk menyampaikan larangan dengan nada kitab suci yang tetap alami.
