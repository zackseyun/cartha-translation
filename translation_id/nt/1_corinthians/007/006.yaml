id: 1CO.7.6
reference: 1 Corinthians 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: id
  text: Namun, hal ini saya katakan sebagai kelonggaran[a], bukan sebagai perintah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai izin” atau “dengan memberi kelonggaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hal ini
  rationale: Demonstrativa ini menunjuk pada pernyataan yang relevan dalam konteks dekat tanpa memastikan apakah acuannya hanya ke belakang atau juga ke depan.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan dengan kontras ringan; “Namun” secara wajar mengantar pembedaan antara kelonggaran dan perintah.
- source_word: λέγω
  choice: saya katakan
  rationale: Bentuk kini Yunani ini secara alami dapat diterjemahkan dengan bentuk ujaran langsung yang lazim dalam bahasa Indonesia.
- source_word: κατὰ συγγνώμην
  choice: sebagai kelonggaran
  rationale: Frasa ini menunjukkan izin atau kelonggaran, bukan kewajiban; pilihan ini juga membentuk kontras yang jelas dengan “sebagai perintah”.
- source_word: συγγνώμην
  choice: kelonggaran
  rationale: Dalam konteks ini nomina tersebut berarti izin atau konsesi, bukan pengampunan. “Kelonggaran” mudah dipahami dan tidak menyiratkan bahwa nasihat itu merupakan perintah yang mengikat.
- source_word: οὐ
  choice: bukan
  rationale: 'Negasi ini secara alami dipadankan dengan “bukan” karena mempertentangkan dua kapasitas: sebagai kelonggaran, bukan sebagai perintah.'
- source_word: κατ’ ἐπιταγήν
  choice: sebagai perintah
  rationale: Frasa ini menyatakan instruksi yang berwenang; terjemahan tersebut lugas dan mempertahankan kesejajaran dengan “sebagai kelonggaran”.
- source_word: ἐπιταγήν
  choice: perintah
  rationale: “Perintah” merupakan padanan Indonesia yang langsung dan umum untuk instruksi yang mengikat atau berwenang.
theological_decisions:
- issue: Apakah perkataan Paulus harus dipahami sebagai izin pribadi atau sebagai perintah ilahi dengan tingkat kewajiban yang lebih rendah
  choice: Paulus secara eksplisit menyampaikan hal ini sebagai kelonggaran, bukan sebagai perintah yang mengikat.
  alternative: Nasihat ini tetap dapat dipandang memiliki bobot kerasulan meskipun bukan perintah.
  rationale: Teks itu sendiri mengontraskan kelonggaran dengan perintah. Terjemahan mempertahankan pembedaan tersebut tanpa menarik kesimpulan lebih jauh tentang batas kewibawaan kerasulan Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Namun” menyampaikan kontras ringan, sedangkan “kelonggaran” dipilih agar makna izin yang tidak mengikat jelas bagi pembaca umum. Penanda catatan kaki [a] dicantumkan langsung setelah kata terkait.
