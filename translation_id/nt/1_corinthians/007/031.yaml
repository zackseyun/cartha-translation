  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: id
  text: dan mereka yang menggunakan dunia, seolah-olah tidak memanfaatkannya sepenuhnya[a], sebab bentuk[b] dunia ini sedang berlalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seolah-olah tidak menggunakannya sepenuhnya”; kata kerja ini juga dapat berarti “seolah-olah tidak menyalahgunakannya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “rupa lahiriah” atau “tatanan” dunia ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: menggunakan
  rationale: Partisipel ini berarti ‘menggunakan’ atau ‘memanfaatkan’. ‘Menggunakan’ mempertahankan ungkapan yang langsung dan memungkinkan permainan kata dengan καταχρώμενοι tetap terlihat.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Dalam konteks ini κόσμος menunjuk pada dunia dalam tatanan sosial dan materialnya sekarang. ‘Dunia’ merupakan padanan langsung tanpa mempersempitnya menjadi ciptaan fisik saja.
- source_word: ὡς μὴ καταχρώμενοι (καταχράομαι)
  choice: seolah-olah tidak memanfaatkannya sepenuhnya
  rationale: Kata kerja ini mengintensifkan χράομαι dan dapat berarti memakai atau memanfaatkan sepenuhnya, meski dalam konteks lain dapat berarti menyalahgunakan. Pilihan ini mempertahankan kontras antara menggunakan dunia dan tidak menggunakannya sampai penuh tanpa menjadikannya semata-mata larangan terhadap penyalahgunaan.
- source_word: παράγει
  choice: sedang berlalu
  rationale: Bentuk kini menggambarkan proses yang tengah berlangsung. ‘Sedang berlalu’ menyampaikan sifat sementara dunia sekarang.
- source_word: τὸ σχῆμα
  choice: bentuk
  rationale: σχῆμα menunjuk pada bentuk, rupa, atau konfigurasi yang tampak. ‘Bentuk’ cukup luas untuk menjaga kemungkinan makna tersebut dan tidak menyatakan bahwa hakikat ciptaanlah yang sedang lenyap.
- source_word: τοῦ κόσμου τούτου
  choice: dunia ini
  rationale: Kata tunjuk τούτου dipertahankan sebagai ‘ini’, sehingga penekanannya tetap pada dunia dalam keadaannya sekarang.
theological_decisions:
- issue: Makna καταχρώμενοι dalam hubungannya dengan χρώμενοι
  choice: Orang percaya menggunakan dunia tanpa memanfaatkannya sepenuhnya atau menaruh seluruh kepentingannya di dalamnya.
  alternative: Paulus terutama melarang penyalahgunaan dunia; atau Paulus hanya berkata ‘seolah-olah tidak menggunakannya’.
  rationale: Pasangan χρώμενοι dan καταχρώμενοι membentuk permainan kata antara ‘menggunakan’ dan ‘menggunakan sepenuhnya’. Terjemahan utama mempertahankan intensifikasi itu, sedangkan catatan kaki menjaga kemungkinan arti ‘menyalahgunakan’.
- issue: Makna σχῆμα
  choice: Bentuk atau konfigurasi dunia sekarang yang bersifat sementara.
  alternative: Hanya penampilan lahiriah dunia; atau hakikat dunia itu sendiri.
  rationale: σχῆμα lebih menunjuk pada bentuk atau keadaan yang tampak daripada hakikat. Karena itu, terjemahan tidak menyiratkan bahwa ciptaan pada hakikatnya buruk atau bahwa hanya ilusi visual yang berlalu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Pengulangan ‘menggunakan/memanfaatkan’ mempertahankan permainan kata Yunani sejauh mungkin tanpa menghasilkan kalimat yang kaku. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
