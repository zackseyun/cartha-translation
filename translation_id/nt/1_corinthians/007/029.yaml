id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: id
  text: 'Saudara-saudara[a], yang saya maksud ialah ini: waktu telah dipersingkat[b], sehingga mulai sekarang orang-orang yang beristri pun hendaknya hidup seolah-olah tidak beristri,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” berbentuk maskulin jamak, tetapi dapat digunakan untuk menyapa kelompok sesama orang percaya yang mencakup laki-laki dan perempuan.
    reason: cultural_note
  - marker: b
    text: Atau, “waktu yang ditetapkan itu sudah menjadi singkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: yang saya maksud ialah ini
  rationale: Ungkapan wacana ini secara alami memperkenalkan penjelasan Paulus; terjemahan tersebut lebih jelas daripada bentuk harfiah “ini saya katakan” tanpa mengubah fungsinya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia yang wajar dan bermartabat bagi sesama anggota komunitas iman; bentuk Yunani maskulin jamak dipertahankan tanpa menutup kemungkinan bahwa kelompok yang disapa mencakup laki-laki dan perempuan.
- source_word: ὁ καιρός
  choice: waktu
  rationale: Kata καιρός menunjuk pada masa atau waktu yang menentukan; “waktu” ringkas dan tidak memaksakan penafsiran lebih jauh, sedangkan nuansa waktu yang ditetapkan dicatat dalam catatan kaki.
- source_word: συνεσταλμένος ἐστίν
  choice: telah dipersingkat
  rationale: Konstruksi perfektum perifrastik menyatakan keadaan kini sebagai hasil dari pemendekan; bentuk “telah dipersingkat” mempertahankan aspek hasil dan bentuk pasifnya.
- source_word: τὸ λοιπὸν
  choice: mulai sekarang
  rationale: Dalam konteks ini frasa tersebut mengarahkan pembaca kepada cara hidup selama waktu yang tersisa; “mulai sekarang” menyampaikan daya temporalnya secara alami.
- source_word: ἵνα
  choice: sehingga
  rationale: Menghubungkan pemendekan waktu dengan tuntutan hidup berikutnya tanpa secara tegas membatasi hubungan itu hanya sebagai tujuan atau hanya sebagai akibat.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: orang-orang yang beristri
  rationale: Dalam konteks ini γυναῖκας berarti istri, dan ungkapan ini mengikuti bentuk Yunani lebih dekat daripada istilah umum “orang yang menikah”.
- source_word: ὡς μὴ ἔχοντες
  choice: seolah-olah tidak beristri
  rationale: Terjemahan alami dari perbandingan Yunani yang tetap mempertahankan ketajaman retorisnya dan memperjelas acuan yang tersirat.
theological_decisions:
- issue: Daya pastoral dan teologis nasihat Paulus tentang perkawinan
  choice: Menerjemahkan pernyataan itu secara langsung sebagai “hidup seolah-olah tidak beristri” tanpa melunakkan ketegangannya.
  alternative: Menafsirkannya dalam terjemahan sebagai hidup dengan keterlepasan batin dari perkawinan atau memparafrasakannya agar selaras secara eksplisit dengan pandangan positif Paulus tentang perkawinan.
  rationale: Ayat ini dengan sengaja merelatifkan keadaan sosial biasa karena desakan waktu. Terjemahan perlu mempertahankan ketegangan tersebut; penjelasan tentang kewajiban perkawinan dan keseimbangan kanonis termasuk ranah penafsiran, bukan sesuatu yang harus disisipkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Saudara-saudara” mempertahankan bentuk sapaan komunitas, sedangkan “orang-orang yang beristri” menjaga kekhususan ungkapan sumber. Struktur kalimat mempertahankan hubungan ἵνα melalui “sehingga” dan tidak menghapus ketegangan eskatologis ayat.
