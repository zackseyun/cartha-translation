id: 1CO.7.33
reference: 1 Corinthians 7:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: id
  text: Namun, laki-laki yang sudah menikah memikirkan hal-hal duniawi[a], yaitu bagaimana ia dapat menyenangkan istrinya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal yang berkaitan dengan dunia” atau “urusan-urusan kehidupan di dunia.” Ungkapan ini tidak dengan sendirinya berarti hal-hal yang jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Namun, laki-laki yang sudah menikah
  rationale: Partisip aoris berartikel ini berfungsi sebagai nomina dan menunjuk kepada laki-laki yang telah menikah, berlawanan dengan laki-laki yang tidak menikah dalam konteks sekitar. Bentuk ini mempertahankan acuan maskulin tunggal dan terdengar alami dalam bahasa Indonesia.
- source_word: μεριμνᾷ
  choice: memikirkan
  rationale: Kata kerja ini dapat berarti merasa khawatir, menaruh perhatian, atau memedulikan. Di sini maksudnya ialah perhatian terhadap tanggung jawab kehidupan pernikahan, bukan selalu kecemasan yang berdosa. 'Memikirkan' menyampaikan perhatian aktif tanpa menambahkan penilaian negatif.
- source_word: τὰ τοῦ κόσμου
  choice: hal-hal duniawi
  rationale: Ungkapan ini menunjuk pada berbagai urusan yang berkaitan dengan kehidupan biasa di dunia. 'Hal-hal duniawi' ringkas dan alami, sedangkan catatan kaki menjaga alternatif yang lebih harfiah dan menegaskan bahwa ungkapan itu tidak harus bernada buruk.
- source_word: πῶς ἀρέσῃ
  choice: yaitu bagaimana ia dapat menyenangkan
  rationale: 'Kata tanya πῶς dengan subjungtif aoris menjelaskan isi perhatiannya: bagaimana atau dengan cara apa ia dapat menyenangkan istrinya. ''Dapat'' mempertahankan nuansa kemungkinan atau tujuan tanpa terasa kaku.'
- source_word: τῇ γυναικί
  choice: istrinya
  rationale: Dalam konteks pernikahan, γυνή berarti 'istri'. Akhiran posesif '-nya' menyatakan hubungan yang tersirat dalam bahasa Yunani dan diperlukan agar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah κόσμος di sini harus dipahami secara moral negatif
  choice: Diterjemahkan secara netral sebagai 'hal-hal duniawi', dengan catatan penjelas
  alternative: Menerjemahkannya sebagai perkara dunia yang buruk atau tercela
  rationale: Dalam konteks ini Paulus membandingkan perhatian praktis dalam kehidupan pernikahan dengan pengabdian yang tidak terbagi kepada Tuhan. Ia tidak sedang menyatakan bahwa pernikahan atau tanggung jawab biasa pada dirinya jahat. Catatan kaki mencegah kata 'duniawi' dibaca secara otomatis sebagai kecaman moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Namun' menandai kontras δέ; 'memikirkan' dipilih agar tidak melebihkan μεριμνᾷ menjadi kecemasan. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
