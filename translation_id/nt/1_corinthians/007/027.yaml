  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: id
  text: Apakah engkau terikat pada seorang istri? Jangan mencari pelepasan[a]. Apakah engkau telah terlepas dari seorang istri? Jangan mencari istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih interpretatif: “Apakah engkau sudah menikah? Jangan mencari perceraian. Apakah engkau sudah bercerai? Jangan mencari istri.” Secara lebih harfiah, bahasa Yunani berbicara tentang keadaan “terikat” dan “terlepas”.'
    reason: Memberikan pemaknaan perkawinan yang lebih eksplisit sambil menjelaskan bahwa teks utama mempertahankan gambaran dan ambiguitas bahasa sumber.
lexical_decisions:
- source_word: δέδεσαι
  choice: engkau terikat
  rationale: Bentuk perfektum δέω menyatakan keadaan telah dan masih terikat; pilihan ini mempertahankan gambaran ikatan serta kesejajarannya dengan λύσιν dan λέλυσαι.
- source_word: γυναικί
  choice: pada seorang istri
  rationale: Dalam konteks perkawinan, γυνή berarti 'istri'; preposisi 'pada' menghasilkan ungkapan Indonesia yang wajar dengan 'terikat'.
- source_word: μὴ ζήτει
  choice: jangan mencari
  rationale: Mempertahankan arti dasar ζητέω dan daya larangan imperatif kini tanpa memperluasnya menjadi tindakan yang lebih khusus.
- source_word: λύσιν
  choice: pelepasan
  rationale: Nomina ini berarti pelonggaran atau pelepasan. 'Pelepasan' menjaga hubungan leksikal dengan 'terlepas' dan tidak membatasi maknanya secara dini pada perceraian.
- source_word: λέλυσαι
  choice: engkau telah terlepas
  rationale: Bentuk perfektum λύω menunjuk pada keadaan sebagai hasil pelepasan. 'Telah terlepas' mempertahankan gambaran Yunani dan kontrasnya dengan 'terikat'.
- source_word: ἀπὸ γυναικός
  choice: dari seorang istri
  rationale: ἀπό secara alami berarti 'dari', dan γυνή dalam konteks ini menunjuk pada istri.
- source_word: γυναῖκα
  choice: istri
  rationale: Konteksnya adalah mencari pasangan dalam perkawinan, sehingga 'istri' lebih tepat daripada 'perempuan'.
theological_decisions:
- issue: Apakah bahasa ikatan dan pelepasan harus dijelaskan langsung sebagai menikah dan bercerai.
  choice: Mempertahankan gambaran 'terikat', 'pelepasan', dan 'terlepas' dalam teks utama.
  alternative: Apakah engkau sudah menikah? Jangan mencari perceraian. Apakah engkau sudah bercerai? Jangan mencari istri.
  rationale: Teks Yunani memakai kosakata mengikat dan melepaskan, bukan istilah eksplisit untuk menikah dan bercerai. Mempertahankan gambaran itu menjaga keluasan dan ketegangan asli, termasuk ketidakpastian apakah keadaan terlepas secara khusus menunjuk pada perceraian, kematian pasangan, atau keadaan tanpa ikatan perkawinan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina 'engkau' dipakai untuk mencerminkan bentuk orang kedua tunggal. Istilah 'pelepasan' agak formal tetapi diperlukan untuk mempertahankan permainan leksikal ikatan–pelepasan tanpa menyempitkannya menjadi perceraian.
