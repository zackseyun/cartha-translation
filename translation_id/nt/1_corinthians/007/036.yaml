id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: id
  text: Namun, jika seseorang menganggap bahwa ia berlaku tidak patut terhadap perawannya[a], jika perempuan itu sudah melewati masa mudanya dan memang harus demikian, biarlah ia melakukan apa yang dikehendakinya. Ia tidak berbuat dosa. Biarlah mereka menikah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunangan perempuannya yang masih perawan”; secara tradisional juga dipahami sebagai “anak perempuannya yang masih perawan”. Bahasa Yunani bersifat ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: berlaku tidak patut
  rationale: Ungkapan ini secara alami menyampaikan perilaku yang tidak pantas atau tidak semestinya tanpa mempersempitnya menjadi ketidaksenonohan seksual.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: terhadap perawannya
  rationale: παρθένος berarti perempuan yang masih perawan, sedangkan hubungan yang ditandai αὐτοῦ tidak dijelaskan. Bentuk ini mempertahankan ambiguitas Yunani, dengan tafsiran utama dijelaskan dalam catatan kaki.
- source_word: ὑπέρακμος
  choice: sudah melewati masa mudanya
  rationale: Kata ini menunjuk pada keadaan telah melampaui puncak atau masa muda; terjemahan ini wajar dalam bahasa Indonesia dan tidak menentukan batas usia tertentu.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: dan memang harus demikian
  rationale: Mempertahankan gagasan keharusan dalam ὀφείλει serta sifat umum frasa Yunani tanpa menentukan apa yang menyebabkan keharusan tersebut.
- source_word: ὃ θέλει ποιείτω
  choice: biarlah ia melakukan apa yang dikehendakinya
  rationale: Menyampaikan imperatif permisif dengan jelas dan bermartabat.
- source_word: οὐχ ἁμαρτάνει
  choice: Ia tidak berbuat dosa
  rationale: Menyatakan secara langsung bahwa tindakan yang dimaksud tidak berdosa.
- source_word: γαμείτωσαν
  choice: Biarlah mereka menikah
  rationale: Imperatif orang ketiga jamak merujuk kepada kedua pihak dan dipertahankan sebagai izin atau arahan yang tegas.
theological_decisions:
- issue: Identitas 'perawannya' (παρθένον αὐτοῦ)
  choice: Teks utama mempertahankan ungkapan 'perawannya' agar hubungan kedua orang itu tidak ditentukan secara sepihak.
  alternative: Tunangan perempuan yang masih perawan; atau anak perempuan yang masih perawan dan berada di bawah tanggung jawab ayah/walinya.
  rationale: Bahasa Yunani memang ambigu dan telah lama dipahami menurut kedua kemungkinan tersebut. Catatan kaki menyajikan alternatif-alternatif utama tanpa menyelesaikan ketegangan penafsiran yang tidak diselesaikan oleh teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, sementara ambiguitas hubungan dalam frasa Yunani dipertahankan melalui 'perawannya' dan diterangkan dalam catatan kaki.
