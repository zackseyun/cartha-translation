  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: id
  text: Namun, ia lebih bahagia jika tetap seperti keadaannya sekarang[a], menurut pertimbanganku—dan aku rasa aku juga memiliki Roh Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "lebih diberkati". Kata Yunani μακαριωτέρα dapat menunjuk pada keadaan yang lebih diberkati maupun lebih bahagia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: lebih bahagia
  rationale: Bentuk komparatif ini menyatakan keadaan yang lebih bahagia atau lebih diberkati. Dalam konteks nasihat pastoral praktis, "lebih bahagia" alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi rumusan berkat formal.
- source_word: ἐὰν οὕτως μείνῃ
  choice: jika tetap seperti keadaannya sekarang
  rationale: μένω berarti tetap atau tinggal, sedangkan οὕτως merujuk kembali pada keadaan perempuan itu yang tidak menikah lagi. Ungkapan ini mempertahankan rujukan kontekstual tanpa menambahkan penjelasan yang tidak tersurat.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: menurut pertimbanganku
  rationale: γνώμη menunjuk pada penilaian atau pendapat yang dipertimbangkan. "Pertimbangan" terdengar matang dan pastoral, bukan sekadar pendapat sambil lalu.
- source_word: δοκῶ
  choice: aku rasa
  rationale: δοκέω di sini menyampaikan pernyataan yang bernada rendah hati, tetapi bukan keraguan yang lemah. "Aku rasa" mempertahankan nuansa retoris tersebut secara alami.
- source_word: κἀγὼ
  choice: aku juga
  rationale: Bentuk gabungan καὶ ἐγώ memberi penekanan aditif, yakni "aku juga" atau "aku pun", kemungkinan dalam perbandingan tersirat dengan pihak lain yang mengaku memiliki kewibawaan rohani.
- source_word: πνεῦμα θεοῦ
  choice: Roh Allah
  rationale: Dalam pemakaian Paulus, frasa ini secara wajar merujuk kepada Roh Allah, bukan sekadar sikap rohani umum. Kapitalisasi memperjelas referen personal yang paling mungkin tanpa menambahkan kata "Kudus" yang tidak hadir dalam frasa Yunani.
- source_word: ἔχειν
  choice: memiliki
  rationale: Infinitif ini melengkapi δοκῶ dan secara langsung berarti mempunyai atau memiliki. "Memiliki" alami serta cukup bermartabat dalam konteks ini.
theological_decisions:
- issue: Apakah πνεῦμα θεοῦ merujuk kepada Roh Kudus atau sekadar watak rohani
  choice: Diterjemahkan "Roh Allah", dengan referen personal kepada Roh Allah.
  alternative: roh dari Allah; wawasan rohani ilahi
  rationale: Pemakaian Paulus dan konteks pembelaan atas keabsahan rohani nasihatnya mendukung rujukan kepada Roh Allah. Terjemahan ini tidak menaikkan nasihat tersebut menjadi kutipan perintah langsung dari Tuhan.
- issue: Daya pernyataan δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: 'Dipertahankan sebagai klaim sungguh-sungguh yang disampaikan dengan kerendahan retoris: "aku rasa aku juga memiliki Roh Allah".'
  alternative: Keraguan nyata apakah Paulus memiliki Roh; sanggahan ironis terhadap lawan
  rationale: δοκῶ melembutkan cara pernyataan, tetapi konteks tidak menunjukkan bahwa Paulus sungguh meragukan keberadaan Roh padanya. Rumusan ini menjaga ketegangan antara kerendahan nada dan keyakinan akan tuntunan Roh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Pronomina "ia" dipakai untuk menjaga kelancaran dan rujukan feminin yang sudah jelas dari konteks; bentuk verba Indonesia tidak memerlukan penandaan gender. Tanda pisah mempertahankan peralihan retoris menuju klaim Paulus tentang Roh Allah.
