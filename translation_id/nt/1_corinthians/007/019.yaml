id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: id
  text: Bersunat tidak berarti apa-apa[a], dan tidak bersunat pun tidak berarti apa-apa; yang penting ialah menaati perintah-perintah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ada nilainya”, untuk kedua ungkapan “tidak berarti apa-apa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: bersunat
  rationale: Bentuk verbal nominal ini alami dalam bahasa Indonesia dan menyatakan status bersunat yang dipertentangkan Paulus dengan status tidak bersunat.
- source_word: οὐδέν ἐστιν
  choice: tidak berarti apa-apa
  rationale: Ungkapan ini mempertahankan penilaian tegas Paulus sekaligus terdengar alami dalam bahasa Indonesia; pengulangannya dipertahankan untuk menjaga kesejajaran retoris teks Yunani.
- source_word: ἀκροβυστία
  choice: tidak bersunat
  rationale: Pilihan ini merupakan lawan langsung dan alami dari 'bersunat' serta mempertahankan fokus pada penanda status perjanjian.
- source_word: ἀλλά
  choice: yang penting ialah
  rationale: Dalam konstruksi eliptis ini, ungkapan tersebut menyampaikan kontras adversatif secara wajar dalam bahasa Indonesia tanpa mengubah pokok penekanannya.
- source_word: τήρησις
  choice: menaati
  rationale: Dengan objek 'perintah-perintah Allah', 'menaati' secara alami menyatakan tindakan memelihara atau menjalankan perintah, tanpa mengaburkannya menjadi ketaatan yang abstrak.
- source_word: ἐντολῶν θεοῦ
  choice: perintah-perintah Allah
  rationale: Bentuk jamak konkret dan hubungan genitif dipertahankan dengan ungkapan baku serta bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penilaian Paulus terhadap bersunat dan tidak bersunat
  choice: Ayat ini menyatakan bahwa status bersunat maupun tidak bersunat tidak menentukan hal yang penting dalam argumen ini; yang ditekankan ialah menaati perintah-perintah Allah.
  alternative: Ayat ini meniadakan segala kemungkinan makna moral sunat dalam setiap konteks.
  rationale: Teks Yunani menyebut kedua status itu 'bukan apa-apa' lalu mengontraskannya dengan pemeliharaan perintah Allah. Terjemahan mempertahankan ketegangan tersebut tanpa menarik kesimpulan teologis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan struktur dipertahankan demi daya retoris, sedangkan klausa eliptis sesudah ἀλλά dibuat alami dengan 'yang penting ialah'.
