id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: id
  text: Sebab, bagaimana engkau tahu, hai istri, apakah engkau akan menyelamatkan suamimu? Atau, bagaimana engkau tahu, hai suami, apakah engkau akan menyelamatkan istrimu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Sebab, bagaimana engkau tahu
  rationale: Ungkapan τί + οἶδας dalam pertanyaan retoris paling wajar diterjemahkan “bagaimana engkau tahu,” sedangkan “sebab” mempertahankan daya penjelas γάρ yang menghubungkannya dengan konteks sebelumnya.
- source_word: γύναι
  choice: hai istri
  rationale: Walaupun γυνή dapat berarti “perempuan” atau “istri,” konteks pernikahan menuntut arti “istri”; partikel “hai” menandai sapaan langsung.
- source_word: ἄνερ
  choice: hai suami
  rationale: Bentuk vokatif ἄνερ dalam konteks pernikahan merujuk kepada suami; “hai” menyampaikan fungsi sapaan langsung.
- source_word: σώσεις
  choice: engkau akan menyelamatkan
  rationale: Bentuk future indicative dipertahankan dengan “akan menyelamatkan.” Karena berada dalam pertanyaan tak langsung dengan εἰ, ungkapan ini menyatakan perkara yang belum diketahui, bukan kepastian hasil.
- source_word: τὸν ἄνδρα
  choice: suamimu
  rationale: Dalam konteks sapaan kepada istri, bentuk berartikel ini menunjuk kepada pasangan yang dimaksud; bentuk posesif merupakan bahasa Indonesia yang alami.
- source_word: τὴν γυναῖκα
  choice: istrimu
  rationale: Dalam konteks sapaan kepada suami, bentuk posesif secara alami menyatakan hubungan pernikahan yang dimaksud.
- source_word: ἢ
  choice: Atau
  rationale: “Atau” mempertahankan hubungan disjungtif antara dua pertanyaan retoris yang sejajar.
theological_decisions:
- issue: Makna “menyelamatkan” dalam konteks pernikahan
  choice: Mempertahankan kata “menyelamatkan” tanpa mempersempit maknanya.
  alternative: Membawa kepada iman; mempertahankan pernikahan; menyelamatkan dalam arti rohani yang lebih luas.
  rationale: σῴζω lazim memiliki bobot keselamatan dalam tulisan Paulus. Konteksnya menyangkut kemungkinan pengaruh pasangan beriman terhadap pasangan yang tidak beriman, tetapi ayat ini tidak menjelaskan cara atau perantaraan keselamatan itu. Terjemahan mempertahankan ketegangan tersebut tanpa mengubahnya menjadi tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipilih karena sapaan tunggal langsung kepada masing-masing pasangan dan menjaga kesejajaran retoris; “hai” memperjelas vokatif Yunani tanpa terasa terlalu arkais.
