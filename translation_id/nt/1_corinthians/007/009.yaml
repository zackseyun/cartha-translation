  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: id
  text: Namun, jika mereka tidak dapat mengendalikan diri, hendaklah mereka menikah, sebab lebih baik menikah daripada terbakar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “terbakar.” Dalam konteks ini, ungkapan tersebut kemungkinan besar berarti terbakar oleh hasrat seksual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: dapat mengendalikan diri
  rationale: Dalam konteks ini verba tersebut menunjuk pada kemampuan menjalankan pengendalian diri, khususnya terhadap dorongan seksual. Bentuk dengan negasi paling alami diterjemahkan 'tidak dapat mengendalikan diri'.
- source_word: γαμησάτωσαν
  choice: hendaklah mereka menikah
  rationale: Bentuk imperatif orang ketiga jamak dipertahankan dengan 'hendaklah', yang menyampaikan daya perintah atau nasihat secara wajar dan bermartabat.
- source_word: κρεῖττον
  choice: lebih baik
  rationale: Padanan komparatif langsung dan alami dalam bahasa Indonesia.
- source_word: γαμῆσαι
  choice: menikah
  rationale: Infinitif ini diterjemahkan secara ringkas dan sejajar dengan klausa sebelumnya.
- source_word: πυροῦσθαι
  choice: terbakar oleh hasrat
  rationale: Metafora 'terbakar' dipertahankan, sedangkan 'oleh hasrat' menyatakan makna seksual yang sangat kuat ditunjukkan oleh konteks tanpa menghilangkan citra sumber.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan ringan dengan pernyataan sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna πυροῦσθαι dalam konteks
  choice: terbakar oleh hasrat
  alternative: terbakar
  rationale: Pembahasan langsung mengenai pengendalian diri dan pernikahan sangat mendukung pengertian hasrat seksual. Namun, karena kata Yunani itu sendiri hanya menyatakan 'terbakar', bentuk yang lebih implisit tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hendaklah' mempertahankan daya imperatif tanpa terdengar kasar; metafora sumber tetap dipertahankan.
