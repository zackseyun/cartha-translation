  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: id
  text: 'Aku berkata kepada orang-orang yang tidak menikah[a] dan kepada para janda: baik bagi mereka jika mereka tetap seperti aku[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laki-laki yang tidak menikah”; bentuk Yunaninya maskulin jamak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti aku juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Namun, ... aku berkata
  rationale: δέ menandai hubungan ringan dengan pembahasan sebelumnya dan dapat dinyatakan secara alami dengan “Namun”; susunan “aku berkata” mempertahankan verba orang pertama.
- source_word: τοῖς ἀγάμοις
  choice: kepada orang-orang yang tidak menikah
  rationale: ἄγαμος berarti tidak menikah. Bentuk Yunaninya maskulin jamak, tetapi dalam konteks dapat dipakai secara representatif; terjemahan utama mempertahankan cakupan yang mungkin lebih luas, dengan alternatif dicatat.
- source_word: ταῖς χήραις
  choice: kepada para janda
  rationale: χήρα secara khusus berarti perempuan yang suaminya telah meninggal; “para janda” merupakan padanan Indonesia yang tepat dan alami.
- source_word: καλὸν αὐτοῖς
  choice: baik bagi mereka
  rationale: καλόν menyatakan bahwa sesuatu itu baik atau patut, bukan bentuk perbandingan “lebih baik”; datif αὐτοῖς secara alami diterjemahkan “bagi mereka”.
- source_word: ἐὰν μείνωσιν
  choice: jika mereka tetap
  rationale: μένω berarti tetap atau tinggal; di sini maksudnya meneruskan keadaan tidak menikah, tetapi objek keadaan itu dibiarkan tersirat sebagaimana dalam bahasa Yunani.
- source_word: ὡς κἀγώ
  choice: seperti aku
  rationale: κἀγώ merupakan gabungan καὶ ἐγώ, secara harfiah “aku juga”; “seperti aku” alami dalam bahasa Indonesia, sedangkan unsur “juga” dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan τοῖς ἀγάμοις dalam hubungannya dengan para janda
  choice: orang-orang yang tidak menikah
  alternative: laki-laki yang tidak menikah
  rationale: Bentuk maskulin jamak dapat merujuk khusus kepada laki-laki atau berfungsi secara representatif. Terjemahan utama tidak mempersempit cakupan yang mungkin dimaksud, sementara ambiguitas bentuknya dijelaskan dalam catatan kaki.
- issue: Daya ungkap καλὸν dalam nasihat Paulus
  choice: baik
  alternative: lebih baik
  rationale: καλόν bukan bentuk komparatif. “Baik” mempertahankan penilaian Paulus tanpa menambahkan perbandingan yang tidak dinyatakan oleh teks.
- issue: Keadaan Paulus dalam ὡς κἀγώ
  choice: seperti aku
  alternative: seperti aku juga
  rationale: Teks menyamakan keadaan mereka dengan keadaan Paulus saat itu tanpa menjelaskan lebih jauh status perkawinannya; terjemahan tidak menentukan apakah ia belum pernah menikah atau pernah menikah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kepada” memperjelas dua kelompok yang disebutkan. Frasa “tetap seperti aku” mempertahankan keringkasan dan ketakterangan teks Yunani mengenai riwayat status perkawinan Paulus.
