  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: id
  text: Namun, semua itu kulakukan demi Kabar Baik,[a] supaya aku menjadi orang yang ikut mengambil bagian di dalamnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi Injil.”
    reason: lexical_alternative
  - marker: b
    text: Atau “supaya aku ikut mengambil bagian di dalamnya” atau “supaya aku menjadi mitra di dalamnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: semua itu
  rationale: Bentuk netral jamak ini merangkum seluruh tindakan yang disebutkan dalam konteks sebelumnya; 'semua itu' terdengar alami dalam bahasa Indonesia dan mempertahankan cakupannya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa kontras ringan terhadap uraian sebelumnya.
- source_word: ποιῶ
  choice: kulakukan
  rationale: Bentuk kini menunjukkan tindakan yang menjadi kebiasaan Paulus; bentuk aktif sederhana ini alami dan ringkas.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: demi Kabar Baik
  rationale: διά dengan akusatif di sini menyatakan alasan, tujuan, atau kepentingan yang dilayani. 'Demi' menangkap orientasi pengorbanan Paulus, sedangkan 'Kabar Baik' menyampaikan makna εὐαγγέλιον secara mudah dipahami.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan klausa tujuan dan diterjemahkan dengan ungkapan tujuan yang wajar dalam bahasa Indonesia modern.
- source_word: συγκοινωνὸς
  choice: turut mengambil bagian
  rationale: Ungkapan ini mempertahankan gagasan berbagi atau berpartisipasi bersama yang terkandung dalam unsur συν-, tanpa mempersempit bentuk partisipasinya.
- source_word: αὐτοῦ
  choice: di dalamnya
  rationale: Pronomina ini paling wajar merujuk kembali kepada εὐαγγέλιον. Frasa 'mengambil bagian di dalamnya' idiomatis dalam bahasa Indonesia.
- source_word: γένωμαι
  choice: aku turut mengambil bagian
  rationale: Subjungtif aoris γίνομαι secara harfiah dapat menonjolkan 'menjadi'. Dalam bahasa Indonesia, konstruksi tujuan ini lebih alami tanpa kata 'menjadi', sementara terjemahan alternatif dalam catatan mempertahankan nuansa tersebut.
theological_decisions:
- issue: Makna partisipasi Paulus dalam hubungannya dengan Kabar Baik
  choice: Menggunakan ungkapan luas 'turut mengambil bagian di dalamnya'.
  alternative: Menjadi sesama peserta di dalamnya; ikut menikmati berkatnya; turut serta dalam penyebarannya.
  rationale: συγκοινωνός dapat mencakup partisipasi dalam Kabar Baik, berkat-berkatnya, maupun misinya. Terjemahan utama tidak membatasinya hanya pada pelayanan, manfaat keselamatan, atau suatu konsep persatuan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kabar Baik' dipakai untuk aksesibilitas, dengan istilah tradisional 'Injil' dicantumkan sebagai alternatif. Penempatan penanda catatan mengikuti unsur yang dijelaskan.
