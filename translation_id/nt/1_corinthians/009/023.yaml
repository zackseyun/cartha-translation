  rationale: Revisi hanya memperbaiki klausa tujuan agar unsur “menjadi” (γένωμαι) dan makna συμμετοχική dari συγκοινωνός tetap tampak. “Orang yang ikut mengambil bagian” adalah ungkapan Indonesia modern yang cukup luas untuk mencakup berbagi dalam Kabar Baik, manfaatnya, atau pelaksanaannya, tanpa memilih salah satu secara dogmatis. Penanda catatan tetap ditempatkan pada unsur yang dijelaskan.
