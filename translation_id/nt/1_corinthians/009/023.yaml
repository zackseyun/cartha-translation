  naturalness: “Namun, semua itu kulakukan demi Kabar Baik” wajar dalam bahasa Indonesia modern. “Supaya aku menjadi orang yang ikut mengambil bagian di dalamnya” sedikit lebih eksplisit, tetapi tetap alami dan diperlukan untuk mewakili γένωμαι serta συγκοινωνός.
  terminology: “Kabar Baik” merupakan padanan yang jelas dan modern untuk εὐαγγέλιον; alternatif “Injil” dipertahankan. Istilah “orang yang ikut mengambil bagian” menghindari istilah teknis atau penafsiran teologis yang terlalu sempit.
