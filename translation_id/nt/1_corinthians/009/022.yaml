language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: id
  text: Untuk orang-orang yang lemah aku menjadi lemah[a], supaya aku dapat memenangkan orang-orang yang lemah. Aku telah menjadi segala-galanya bagi semua orang, supaya dengan segala cara[b] aku dapat menyelamatkan beberapa orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang lemah dalam hati nurani”; dalam 1 Korintus ungkapan ini dapat secara khusus merujuk kepada orang-orang yang hati nuraninya rentan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam segala hal” atau “dengan cara apa pun”; ungkapan Yunani ini menyatakan penggunaan setiap cara yang mungkin untuk mencapai tujuan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: aku menjadi
  rationale: Bentuk aoristus medium γίνομαι menggambarkan tindakan Paulus menyesuaikan diri dalam pelayanannya; 'menjadi' alami dan mempertahankan gagasan memasuki suatu keadaan atau sikap.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: orang-orang yang lemah / lemah
  rationale: Pengulangan akar kata dipertahankan demi daya retoris. Dalam 1 Korintus ungkapan ini dapat mencakup orang yang hati nuraninya rentan, tetapi teks ayat ini sendiri tetap cukup luas.
- source_word: κερδήσω
  choice: aku dapat memenangkan
  rationale: Dalam konteks penginjilan, κερδαίνω berarti memenangkan orang, bukan sekadar memperoleh keuntungan. Bentuk 'dapat memenangkan' menyatakan tujuan yang diharapkan tanpa menjamin hasil.
- source_word: τοῖς πᾶσιν
  choice: bagi semua orang
  rationale: Frasa datif Yunani bersifat eliptis; penambahan 'orang' diperlukan agar alami dalam bahasa Indonesia dan sesuai dengan konteks kelompok-kelompok manusia.
- source_word: γέγονα
  choice: aku telah menjadi
  rationale: Bentuk perfektum menyatakan pola tindakan terdahulu dengan keadaan atau relevansi yang berlanjut; 'telah menjadi' mempertahankan aspek itu.
- source_word: πάντα
  choice: segala-galanya
  rationale: Ungkapan 'menjadi segala-galanya bagi semua orang' alami dalam bahasa Indonesia serta mempertahankan keluasan dan kekompakan retoris bahasa Yunani.
- source_word: πάντως
  choice: dengan segala cara
  rationale: Dalam konteks ini πάντως menyatakan pemakaian berbagai cara untuk mencapai tujuan. Pilihan ini lebih langsung daripada 'bagaimanapun juga' dan tidak dengan sendirinya menyiratkan kompromi yang tidak etis.
- source_word: τινὰς
  choice: beberapa orang
  rationale: Pronomina tak tentu ini menyatakan hasil yang terbatas dan tidak mengklaim bahwa semua orang akan diselamatkan melalui pelayanan Paulus.
- source_word: σώσω
  choice: aku dapat menyelamatkan
  rationale: σῴζω membawa makna keselamatan yang nyata dalam konteks penginjilan. Terjemahan ini mempertahankan peran instrumental Paulus tanpa menambahkan penjelasan doktrinal ke dalam teks.
theological_decisions:
- issue: Makna 'orang-orang yang lemah'
  choice: Dipertahankan secara luas sebagai 'orang-orang yang lemah'.
  alternative: orang-orang yang lemah hati nuraninya; orang-orang yang tidak berdaya
  rationale: Dalam 1 Korintus, khususnya pasal 8–10, istilah ini dapat menunjuk pada orang yang hati nuraninya rentan. Namun, redaksi ayat ini bersifat umum dan sejajar secara retoris dengan kelompok-kelompok lain, sehingga teks utama tidak dipersempit.
- issue: Daya ungkap 'menyelamatkan'
  choice: Menggunakan 'aku dapat menyelamatkan' sebagai tujuan penginjilan Paulus.
  alternative: membawa kepada keselamatan; turut menyelamatkan
  rationale: Kata σώσω benar-benar memakai bahasa keselamatan. Terjemahan yang lebih lemah akan mengurangi bobot teks, sedangkan penambahan 'turut' akan memasukkan penjelasan tentang keagenan yang tidak dinyatakan secara eksplisit di sini.
- issue: Cakupan πάντως
  choice: Menempatkan 'dengan segala cara' bersama tujuan menyelamatkan beberapa orang.
  alternative: bagaimanapun juga; setidak-tidaknya
  rationale: Pilihan ini mempertahankan kemungkinan makna pemakaian segala cara yang tersedia tanpa mengubahnya menjadi klaim bahwa tujuan membenarkan cara apa pun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina 'aku' mengikuti suara pribadi Paulus. Pengulangan 'lemah' dipertahankan, sedangkan susunan kalimat dibuat alami tanpa menghilangkan paralelisme Yunani.
