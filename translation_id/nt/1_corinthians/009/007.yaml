id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: id
  text: Siapakah yang pernah bertugas sebagai prajurit dengan biaya sendiri? Siapakah yang menanam kebun anggur tetapi tidak memakan buahnya? Atau siapakah yang menggembalakan kawanan tetapi tidak minum susu dari kawanan itu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak memakan dari susu kawanan itu.” Dalam bahasa Indonesia, susu biasanya diminum.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: menjadi prajurit
  rationale: Mengungkapkan kegiatan menjalani dinas militer tanpa mempersempit maknanya hanya pada pertempuran.
- source_word: ἰδίοις ὀψωνίοις
  choice: dengan biaya sendiri
  rationale: ὀψώνιον dapat menunjuk pada upah atau ransum prajurit; dalam pertanyaan retoris ini maksudnya ialah prajurit tidak menanggung sendiri biaya dinasnya.
- source_word: ποτέ
  choice: pernah
  rationale: Mempertahankan daya retoris 'pernah/kapankah' secara alami dalam bahasa Indonesia.
- source_word: φυτεύει ἀμπελῶνα
  choice: menanami kebun anggur
  rationale: Padanan alami bagi tindakan menanam sebuah kebun anggur.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: buahnya
  rationale: Menjaga gambaran konkret hasil kebun anggur dan hubungan kepemilikannya.
- source_word: ποιμαίνει ποίμνην
  choice: menggembalakan kawanan
  rationale: Mempertahankan citra pekerjaan gembala; 'kawanan' tidak menambahkan jenis ternak yang tidak dinyatakan dalam teks.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: dari susu kawanan itu
  rationale: Mempertahankan gagasan sumber atau bagian dari hasil yang diberikan kawanan.
- source_word: ἐσθίει
  choice: memakan / minum
  rationale: Pada klausa kedua diterjemahkan secara harfiah sebagai 'memakan'; dengan susu, bahasa Indonesia secara wajar memakai 'minum', sementara catatan kaki mencatat bentuk harfiahnya.
theological_decisions:
- issue: Bentuk maskulin tunggal generik dalam tiga klausa τίς
  choice: Pertanyaan generik tanpa pronomina gender yang eksplisit
  alternative: Memakai 'ia' atau '-nya' dengan rujukan personal yang lebih eksplisit
  rationale: Bahasa Indonesia memungkinkan pertanyaan generik tunggal melalui 'siapakah' tanpa harus menambahkan penanda gender; hal ini mempertahankan cakupan representatif teks tanpa mengubah contoh-contoh pekerjaannya.
- issue: Dasar analogi tentang hak pekerja memperoleh hasil
  choice: Mempertahankan tiga pertanyaan retoris tanpa menjelaskan kesimpulan teologis di dalam ayat
  alternative: Menambahkan bahwa pekerja berhak mendapat nafkah
  rationale: Ayat menyampaikan argumennya melalui analogi prajurit, penanam, dan gembala; penjelasan eksplisit akan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan tiga pertanyaan retoris dipertahankan. 'Kawanan' dipilih agar tidak menambahkan 'domba' atau jenis ternak lain yang tidak disebutkan dalam bahasa Yunani.
