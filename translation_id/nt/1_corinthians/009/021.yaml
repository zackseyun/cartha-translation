reference: 1 Corinthians 9:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: id
  text: Bagi mereka yang berada di luar hukum Taurat[a], aku menjadi seperti orang yang berada di luar hukum Taurat—sekalipun aku tidak berada di luar hukum Allah, melainkan berada di bawah hukum Mesias[b]—supaya aku dapat memenangkan mereka yang berada di luar hukum Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa hukum”; ungkapan ini menunjuk pada mereka yang tidak berada di bawah hukum Musa, bukan berarti mereka pasti durhaka secara moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “berada dalam hukum Mesias” atau “terikat pada hukum Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: berada di luar hukum Taurat
  rationale: Dalam konteks 1 Korintus 9:20–21, ungkapan ini menunjuk pada mereka yang tidak berada di bawah hukum Musa, bukan terutama pada orang yang durhaka secara moral. Penyebutan 'hukum Taurat' memperjelas acuan kontekstualnya dalam bahasa Indonesia.
- source_word: ὡς
  choice: seperti
  rationale: 'Menandai sikap penyesuaian Paulus: ia menjadi seperti orang yang berada di luar hukum Taurat, tanpa secara mutlak menjadi orang yang tanpa hukum.'
- source_word: μὴ ὢν
  choice: sekalipun aku tidak berada
  rationale: Klausa partisipial ini bersifat konsesif dan membatasi pernyataan sebelumnya; 'sekalipun' mengungkapkan hubungan tersebut secara alami.
- source_word: θεοῦ
  choice: Allah
  rationale: Genitif relasional/posesif diterjemahkan secara idiomatis sebagai 'hukum Allah'.
- source_word: ἔννομος
  choice: berada di bawah hukum
  rationale: Menyatakan keberadaan dalam lingkup atau ketundukan kepada hukum. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan kontras dengan 'di luar hukum'.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam ungkapan relasional ini, sehingga diterjemahkan 'Mesias'.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan secara ringkas dan alami.
- source_word: κερδάνω
  choice: aku dapat memenangkan
  rationale: Dalam konteks penginjilan Paulus, kata ini berarti memenangkan orang, bukan memperoleh keuntungan materi. 'Dapat' mempertahankan nuansa kemungkinan dari bentuk subjungtif.
theological_decisions:
- issue: Makna ἄνομος dalam konteks ini
  choice: Orang yang berada di luar hukum Taurat, khususnya mereka yang tidak berada di bawah hukum Musa
  alternative: Orang durhaka atau pelanggar hukum dalam arti moral umum
  rationale: Konteks langsung membandingkan mereka yang berada di bawah hukum Taurat dengan mereka yang berada di luarnya. Penjelasan Paulus bahwa ia tidak berada di luar hukum Allah juga mencegah pengertian bahwa ia menjadi amoral.
- issue: Daya makna ἔννομος Χριστοῦ
  choice: berada di bawah hukum Mesias
  alternative: berada di dalam hukum Mesias; terikat pada hukum Mesias
  rationale: Ungkapan ini menegaskan bahwa Paulus tetap tunduk kepada kehendak Allah dalam hubungannya dengan Mesias. Terjemahan utama mempertahankan kontras legal-relasional dengan 'di luar hukum' tanpa merinci secara berlebihan hakikat 'hukum Mesias'.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap nyata sebagai gelar, sehingga 'Mesias' dipilih; 'Kristus' tetap merupakan alternatif tradisional yang dikenal luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'berada di luar hukum Taurat' dipertahankan untuk mencerminkan repetisi retoris teks Yunani. Tanda pisah menandai klarifikasi parentetis Paulus.
