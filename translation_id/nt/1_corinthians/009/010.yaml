id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: id
  text: Atau, apakah Ia mengatakan hal itu semata-mata demi kita?[a] Memang, hal itu ditulis demi kita, sebab orang yang membajak harus membajak dengan harapan, dan orang yang mengirik harus mengirik dengan harapan akan mendapat bagian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “semata-mata” dapat juga berarti “tentu” atau “sungguh-sungguh”; kata itu memperkuat pertanyaan retoris ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: semata-mata
  rationale: Dalam pertanyaan retoris ini, kata tersebut memperkuat cakupan pernyataan. “Semata-mata” mempertahankan kemungkinan makna “sepenuhnya,” sementara alternatif seperti “tentu” dicatat karena kata Yunani ini juga dapat berfungsi sebagai penegas kepastian.
- source_word: δι’ ἡμᾶς
  choice: demi kita
  rationale: διά dengan bentuk akusatif di sini menyatakan kepentingan atau manfaat. “Demi kita” menyampaikan daya benefaktif argumentasi Paulus dengan wajar.
- source_word: ἐγράφη
  choice: hal itu ditulis
  rationale: Bentuk aoris pasif diterjemahkan secara langsung dan alami. “Hal itu” merujuk pada ketetapan Kitab Suci yang baru saja dikutip.
- source_word: ὀφείλει
  choice: harus
  rationale: Kata ini menyatakan kewajiban atau kepatutan. “Harus” ringkas dan alami dalam konteks prinsip bahwa pekerja patut bekerja dengan pengharapan menerima bagian.
- source_word: ἐπ’ ἐλπίδι
  choice: dengan harapan
  rationale: Frasa ini menyatakan sikap atau pengharapan yang menyertai pekerjaan. “Dengan harapan” alami dalam bahasa Indonesia dan memungkinkan pengulangan paralel kedua klausa tetap terlihat.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: orang yang membajak harus membajak
  rationale: Ungkapan generik ini mempertahankan hubungan antara pelaku dan pekerjaannya tanpa menambahkan penandaan gender yang tidak diperlukan.
- source_word: ὁ ἀλοῶν
  choice: orang yang mengirik
  rationale: Terjemahan ini mempertahankan struktur paralel dengan “orang yang membajak” dan memakai istilah pertanian Indonesia yang tepat.
- source_word: τοῦ μετέχειν
  choice: akan mendapat bagian
  rationale: μετέχω berarti turut mengambil atau mendapat bagian. Terjemahan ini tetap membiarkan objeknya tidak disebutkan, sebagaimana dalam bahasa Yunani, tetapi terdengar lengkap dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Objek tersirat dari τοῦ μετέχειν
  choice: 'Objek tidak dieksplisitkan: “akan mendapat bagian”'
  alternative: “akan mendapat bagian dari hasil panen”
  rationale: Teks Yunani tidak menyebutkan objeknya. Konteks pertanian membuat hasil kerja atau panen mudah dipahami, tetapi membiarkannya tersirat mempertahankan ketidaktersuratan sumber dan menghindari penambahan yang tidak perlu.
- issue: Daya pertanyaan retoris dengan πάντως
  choice: “apakah ... semata-mata demi kita?”
  alternative: “bukankah Ia tentu mengatakannya demi kita?”
  rationale: Pilihan utama mempertahankan kemungkinan bahwa πάντως menunjuk pada cakupan (“sepenuhnya/semata-mata”), sedangkan kemungkinan daya penegasan kepastian dicatat dalam catatan kaki agar ambiguitas leksikal tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel antara membajak dan mengirik dipertahankan. “Ia” merujuk kepada Allah sesuai konteks, sedangkan “mendapat bagian” sengaja tidak diberi objek eksplisit karena teks Yunani juga tidak menyebutkannya.
