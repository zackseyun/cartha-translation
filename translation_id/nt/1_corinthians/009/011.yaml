  naturalness: “Hal-hal rohani” wajar dalam ragam Alkitab Indonesia modern. Akan tetapi, “hal-hal jasmani” mudah terdengar sebagai perkara tubuh atau kedagingan dan kurang jelas menunjuk pada nafkah/dukungan material dalam konteks ini. “Hal-hal material” lebih jelas dan tetap cukup luas.
