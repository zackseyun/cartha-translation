base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: id
  text: Jika kami telah menaburkan hal-hal rohani di antara kalian, apakah berlebihan jika kami akan menuai hal-hal material dari kalian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal jasmani.” Kata Yunani ini menunjuk pada hal-hal yang berkaitan dengan kehidupan jasmani atau material, sebagai lawan dari “hal-hal rohani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: hal-hal rohani
  rationale: Adjektiva netral jamak ini dipakai sebagai nomina dan menunjuk secara luas pada manfaat atau pelayanan rohani, tanpa mempersempitnya menjadi berkat tertentu.
- source_word: ἐσπείραμεν
  choice: telah menaburkan
  rationale: Bentuk aoris menunjuk pada pelayanan yang sudah dilakukan Paulus dan rekan-rekannya; bentuk ini juga mempertahankan metafora pertanian.
- source_word: μέγα
  choice: terlalu besar
  rationale: Dalam pertanyaan retoris ini, kata tersebut menanyakan apakah tuntutan itu besar atau berlebihan; ungkapan ini mempertahankan citra ukuran dalam bahasa Yunani sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: τὰ σαρκικὰ
  choice: hal-hal jasmani
  rationale: Istilah ini berlawanan dengan 'hal-hal rohani' dan di sini menunjuk pada dukungan bagi kehidupan jasmani atau material, bukan perilaku berdosa.
- source_word: θερίσομεν
  choice: kami menuai
  rationale: Pilihan ini melanjutkan metafora menabur dan menuai. Dalam konstruksi pertanyaan bersyarat bahasa Indonesia, bentuk tanpa penanda waktu eksplisit tetap dapat menyampaikan hasil yang diharapkan.
- source_word: ὑμῶν
  choice: dari kalian
  rationale: Genitif ini secara alami menyatakan sumber dari apa yang dituai, yaitu dukungan yang berasal dari jemaat Korintus.
- source_word: ἡμεῖς
  choice: kami
  rationale: Pronomina eksplisit memberi penekanan pada para pelayan yang telah menabur dan yang berhak menuai; 'kami' membedakan kelompok Paulus dari para pembaca.
theological_decisions:
- issue: Makna σαρκικὰ dalam kontras dengan πνευματικὰ
  choice: Menunjuk pada hal-hal jasmani atau material yang diberikan sebagai dukungan pelayanan, bukan pada perilaku yang berdosa.
  alternative: hal-hal material; hal-hal duniawi; hal-hal kedagingan
  rationale: Konteksnya ialah pembelaan Paulus atas hak para rasul untuk menerima pemeliharaan. Kontras yang dimaksud adalah antara pelayanan rohani dan dukungan bagi kehidupan jasmani, bukan antara kekudusan dan dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν/ὑμῶν secara jelas. Struktur pertanyaan retoris serta metafora menabur dan menuai dipertahankan.
