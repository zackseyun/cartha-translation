  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: id
  text: Bagi orang-orang Yahudi, aku menjadi seperti seorang Yahudi, supaya aku dapat memenangkan orang-orang Yahudi[a]. Bagi mereka yang berada di bawah hukum[b], aku menjadi seperti orang yang berada di bawah hukum—meskipun aku sendiri tidak berada di bawah hukum—supaya aku dapat memenangkan mereka yang berada di bawah hukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperoleh”; kata kerja ini dapat berarti memperoleh atau memenangkan orang.
    reason: lexical_alternative
  - marker: b
    text: “Hukum” di sini kemungkinan besar merujuk pada hukum Musa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: aku menjadi
  rationale: Bentuk aoris dari γίνομαι menggambarkan Paulus mengambil sikap atau cara hidup tertentu terhadap kelompok yang dilayaninya; 'menjadi' mempertahankan ungkapan sumber tanpa menyiratkan perubahan identitas etnis.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Bagi orang-orang Yahudi ... seperti orang Yahudi
  rationale: Dativus menyatakan kelompok yang terhadapnya Paulus menyesuaikan diri, sedangkan ὡς mempertahankan unsur perbandingan. 'Bagi' lebih alami daripada 'kepada' dalam susunan ini.
- source_word: ἵνα ... κερδήσω
  choice: supaya aku dapat memenangkan
  rationale: κερδαίνω secara harfiah dapat berarti memperoleh keuntungan atau mendapat, tetapi dalam konteks misi kepada orang idiomatis berarti memenangkan atau membawa orang tersebut kepada keyakinan.
- source_word: τοῖς ὑπὸ νόμον
  choice: bagi mereka yang berada di bawah hukum Taurat
  rationale: Frasa preposisional berartikel ini berfungsi substantival. 'Berada di bawah' mempertahankan metafora kekuasaan atau kewajiban hukum; 'hukum Taurat' merupakan ungkapan Indonesia yang alami untuk hukum Musa dalam konteks ini.
- source_word: ὡς ὑπὸ νόμον
  choice: seperti orang yang berada di bawah hukum Taurat
  rationale: Pelengkapan 'orang yang berada' diperlukan agar ungkapan padat Yunani terdengar alami dalam bahasa Indonesia sambil mempertahankan daya banding ὡς.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: meskipun aku sendiri tidak berada di bawah hukum Taurat
  rationale: Partisipel kini dengan μή memberi keterangan kontras yang berlangsung bersamaan. 'Meskipun' menyampaikan hubungan konsesif, dan bentuk kini mempertahankan pernyataan tentang kedudukan Paulus.
- source_word: αὐτὸς
  choice: aku sendiri
  rationale: αὐτός bersifat emfatis; 'sendiri' mempertahankan penekanan pada kedudukan pribadi Paulus.
- source_word: νόμος
  choice: hukum Taurat
  rationale: Dalam konteks orang Yahudi dan orang yang berada di bawah νόμος, rujukan yang paling wajar ialah hukum Musa. 'Hukum Taurat' jelas dan lazim dalam bahasa Indonesia, tanpa memasukkan penjelasan teologis tambahan.
theological_decisions:
- issue: Arti pernyataan Paulus bahwa ia tidak berada di bawah hukum Taurat
  choice: 'Diterjemahkan secara langsung sebagai kedudukan Paulus sendiri: ''meskipun aku sendiri tidak berada di bawah hukum Taurat.'''
  alternative: Menambahkan pembatas seperti 'hukum Musa' atau menyelaraskannya dengan ayat 21 sebagai 'tidak hidup tanpa hukum Allah, tetapi di bawah hukum Kristus.'
  rationale: Teks ayat ini hanya menyatakan bahwa Paulus tidak berada di bawah νόμος. Terjemahan tidak menambahkan penjelasan dari ayat berikutnya, sehingga kontras retoris dan ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus dan lazim dalam terjemahan Alkitab Indonesia. Pengulangan 'berada di bawah hukum Taurat' dipertahankan karena merupakan unsur retoris penting dalam teks Yunani.
