revisions:
- from: Bagi orang-orang Yahudi, aku menjadi seperti orang Yahudi, supaya aku dapat memenangkan orang-orang Yahudi[a]. Bagi mereka yang berada di bawah hukum Taurat[b], aku menjadi seperti orang yang berada di bawah hukum Taurat—meskipun aku sendiri tidak berada di bawah hukum Taurat—supaya aku dapat memenangkan mereka yang berada di bawah hukum Taurat.
  to: Bagi orang-orang Yahudi, aku menjadi seperti seorang Yahudi, supaya aku dapat memenangkan orang-orang Yahudi[a]. Bagi mereka yang berada di bawah hukum[b], aku menjadi seperti orang yang berada di bawah hukum—meskipun aku sendiri tidak berada di bawah hukum—supaya aku dapat memenangkan mereka yang berada di bawah hukum.
  rationale: 'Revisi terbatas pada istilah νόμος: «hukum Taurat» diganti menjadi «hukum» di seluruh teks utama agar terjemahan tidak mempersempit ungkapan Yunani atau menyelesaikan ketegangan yang teksnya sendiri tidak jelaskan. Kemungkinan rujukan kepada hukum Musa tetap diberikan secara tepat dalam catatan kaki. Penambahan «seorang» pada «seperti seorang Yahudi» membuat bentuk komparatif tunggal lebih eksplisit dan tetap alami.'
