  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: id
  text: Setiap orang yang berlomba menguasai dirinya dalam segala hal. Mereka berbuat demikian untuk memperoleh mahkota[a] yang dapat binasa, tetapi kita untuk memperoleh mahkota yang tidak dapat binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karangan kemenangan”; kata Yunani ini menunjuk pada karangan yang dianugerahkan kepada pemenang pertandingan atletik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς δὲ ὁ ἀγωνιζόμενος
  choice: Setiap orang yang berlomba
  rationale: Bentuk tunggal generik πᾶς ... ὁ ἀγωνιζόμενος mencakup siapa pun yang ikut bertanding. Dalam konteks perlombaan atletik, 'berlomba' menyampaikan makna kompetitif secara alami; δέ berfungsi sebagai penghubung wacana dan tidak perlu diterjemahkan tersendiri.
- source_word: πάντα ἐγκρατεύεται
  choice: menguasai dirinya dalam segala hal
  rationale: ἐγκρατεύεται menunjuk pada pengendalian atau pengekangan diri yang dilakukan secara konsisten, sedangkan πάντα menyatakan cakupan luas, bukan hanya makanan atau latihan tertentu.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Mereka berbuat demikian
  rationale: Frasa ini menunjuk kembali kepada para peserta perlombaan dan membentuk kontras dengan ἡμεῖς δέ. Kata kerja yang tersirat dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: ἵνα ... λάβωσιν
  choice: untuk memperoleh
  rationale: ἵνα menyatakan tujuan, dan λάβωσιν berarti menerima atau memperoleh hadiah. 'Untuk memperoleh' ringkas dan idiomatis dalam konteks usaha seorang atlet.
- source_word: φθαρτὸν στέφανον
  choice: mahkota yang dapat binasa
  rationale: στέφανος adalah karangan kemenangan yang dianugerahkan kepada pemenang pertandingan; 'mahkota' mempertahankan citra kehormatan dan hadiah, sedangkan φθαρτός menandakan bahwa benda itu fana atau dapat rusak.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: tetapi kita untuk memperoleh mahkota yang tidak dapat binasa
  rationale: Bahasa Yunani menghilangkan kata kerja dan nomina yang dipahami dari klausa sebelumnya. Keduanya diulang dalam bahasa Indonesia demi kejelasan, sambil mempertahankan kontras langsung φθαρτός–ἄφθαρτος.
theological_decisions:
- issue: Hakikat hadiah dalam metafora perlombaan
  choice: Mempertahankan gambaran 'mahkota' tanpa menentukan secara eksplisit apa yang dilambangkannya secara doktrinal.
  alternative: Menafsirkannya secara khusus sebagai hidup kekal atau sebagai pahala surgawi.
  rationale: Ayat ini hanya mengontraskan hadiah yang dapat binasa dengan hadiah yang tidak dapat binasa. Menentukan rujukan doktrinal yang lebih sempit akan melampaui pernyataan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. 'Menguasai dirinya' dipilih sebagai ungkapan alami bagi disiplin atau pengendalian diri; pengulangan 'untuk memperoleh mahkota' pada klausa kedua memperjelas elipsis Yunani tanpa mengubah maknanya.
