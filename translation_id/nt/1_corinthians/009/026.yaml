  text: 'Jadi, demikianlah aku berlari: bukan tanpa tujuan[a]; demikianlah aku bertinju: bukan memukul udara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan dengan tidak pasti.” Kata keterangan Yunani ini dapat menekankan ketidakjelasan atau ketiadaan sasaran yang pasti; dalam gambaran perlombaan, “tanpa tujuan” menonjolkan makna berlari tanpa sasaran yang jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Jadi
  rationale: Menandai kesimpulan atau peralihan inferensial dari gambaran pertandingan sebelumnya menuju penerapan pribadi Paulus; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Dipertahankan dua kali untuk mencerminkan pengulangan yang menekankan cara Paulus berlari dan bertinju.
- source_word: τρέχω
  choice: aku berlari
  rationale: Mempertahankan metafora perlombaan dan bentuk kini sebagai gambaran hidup tentang tindakan Paulus.
- source_word: ἀδήλως
  choice: tanpa tujuan
  rationale: Dalam gambaran perlombaan, ungkapan ini menyampaikan tindakan yang tidak memiliki arah atau sasaran yang jelas, sambil tetap mengakui kemungkinan nuansa ketidakpastian dalam catatan kaki.
- source_word: πυκτεύω
  choice: aku bertinju
  rationale: Kata Yunani secara khusus menunjuk pada olahraga tinju; padanan ini tepat dan lazim dalam bahasa Indonesia modern.
- source_word: ἀέρα δέρων
  choice: memukul udara
  rationale: Mempertahankan gambaran harfiah tentang pukulan yang tidak mengenai sasaran dan karena itu tidak efektif.
