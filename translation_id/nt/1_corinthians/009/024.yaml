base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: id
  text: Tidakkah kalian tahu bahwa semua orang yang berlari di stadion memang berlari, tetapi hanya satu orang yang menerima hadiah? Berlarilah sedemikian rupa[a] agar kalian memperolehnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berlarilah demikian supaya kalian menang,” atau “berlarilah sedemikian rupa agar kalian dapat meraihnya.” Kata Yunani yang diterjemahkan “memperolehnya” dapat berarti memperoleh, meraih, atau mencapai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Tidak tahukah kalian
  rationale: Mempertahankan bentuk pertanyaan retoris Paulus dan arti dasar οἶδα, dengan sapaan jamak yang jelas dalam bahasa Indonesia.
- source_word: οἱ ἐν σταδίῳ τρέχοντες
  choice: semua orang yang berlari di gelanggang
  rationale: ‘Gelanggang’ menyampaikan tempat perlombaan yang dimaksud στάδιον secara alami dan mempertahankan gambaran atletik yang konkret.
- source_word: πάντες μὲν τρέχουσιν, εἷς δὲ
  choice: semua ... memang berlari, tetapi hanya satu orang
  rationale: Mewakili kontras μέν...δέ; ‘hanya’ memperjelas pembatasan yang terkandung dalam εἷς pada konteks perlombaan.
- source_word: λαμβάνει τὸ βραβεῖον
  choice: menerima hadiah
  rationale: ‘Menerima’ mempertahankan arti langsung λαμβάνει, sedangkan ‘hadiah’ merupakan padanan alami bagi βραβεῖον dalam perlombaan.
- source_word: οὕτως τρέχετε
  choice: Berlarilah sedemikian rupa
  rationale: Menyampaikan perintah yang kuat dan mengaitkan cara berlari pembaca dengan gambaran perlombaan sebelumnya.
- source_word: ἵνα καταλάβητε
  choice: supaya kalian memperolehnya
  rationale: ‘Memperoleh’ cocok dengan objek hadiah dan mempertahankan tujuan tanpa mempersempit καταλαμβάνω hanya menjadi ‘menang’ atau memperkerasnya menjadi ‘merebut’.
theological_decisions:
- issue: Metafora perlombaan bagi ketekunan orang percaya
  choice: Mempertahankan gambaran perlombaan dan desakan untuk mengejar hadiah tanpa menentukan hakikat hadiah atau mekanisme keselamatan.
  alternative: Menerjemahkan secara lebih interpretatif sebagai ‘berlarilah untuk menang’.
  rationale: Ayat ini menekankan usaha yang terarah melalui analogi atletik, tetapi tidak dengan sendirinya menjelaskan apakah hadiah itu keselamatan, upah khusus, atau hal lain. Terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. ‘Kalian’ menyatakan orang kedua jamak yang terdapat dalam bentuk Yunani. ‘Gelanggang’ dipilih untuk tempat perlombaan, sedangkan susunan ‘sedemikian rupa ... supaya’ mempertahankan hubungan cara dan tujuan dalam οὕτως ... ἵνα.
