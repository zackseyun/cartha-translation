  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: id
  text: Inilah pembelaanku terhadap mereka yang memeriksa aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah pembelaanku di hadapan mereka yang menilai aku.”
    reason: Alternatif ini mencerminkan kemungkinan nuansa forensik pada datif dan pada ἀνακρίνω, tanpa menetapkannya sebagai putusan pengadilan akhir.
lexical_decisions:
- source_word: ἀπολογία
  choice: pembelaan
  rationale: Dalam konteks ini Paulus memberikan jawaban terhadap penilaian kritis atas kerasulan, hak, dan tindakannya. “Pembelaan” mempertahankan nuansa jawaban atas keberatan atau tuduhan tanpa menyiratkan permintaan maaf.
- source_word: ἀνακρίνουσίν
  choice: memeriksa
  rationale: Kata ini menunjuk pada tindakan menyelidiki atau menilai secara kritis. “Memeriksa” menjaga nuansa tersebut tanpa sekuat “menghakimi,” yang dapat menyiratkan putusan akhir.
- source_word: Ἡ ἐμὴ
  choice: -ku (dalam “pembelaanku”)
  rationale: Bentuk posesif Yunani diterjemahkan secara alami dengan akhiran posesif Indonesia, tanpa menambahkan penekanan yang tidak diperlukan.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: terhadap mereka yang memeriksa aku
  rationale: Datif menyatakan pihak yang menjadi sasaran pembelaan Paulus. “Terhadap” terdengar alami dalam hubungan dengan “pembelaan” dan sesuai dengan situasi pemeriksaan kritis.
- source_word: ἐστιν αὕτη
  choice: Inilah
  rationale: Ungkapan identifikasi ini secara alami diterjemahkan “Inilah,” yang mempertahankan daya tunjuk αὕτη dan kelancaran bahasa Indonesia.
theological_decisions: []
