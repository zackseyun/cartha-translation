  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk “aku” dipakai untuk suara pribadi Paulus; “pembelaan” dan “memeriksa” menjaga nuansa evaluasi kritis tanpa bahasa hukum yang terlalu teknis.
