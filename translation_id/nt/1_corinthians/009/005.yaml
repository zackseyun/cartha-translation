source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: id
  text: Bukankah kami berhak membawa serta seorang istri yang seiman[a], seperti juga rasul-rasul lainnya, saudara-saudara Tuhan, dan Kefas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang saudari, seorang istri”; yaitu, seorang istri yang juga saudari seiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: berhak
  rationale: Dalam konteks ini kata tersebut menunjuk pada hak atau kewenangan yang sah sebagai rasul, bukan otoritas abstrak; bentuk verbal “berhak” alami dalam pertanyaan retoris bahasa Indonesia.
- source_word: ἀδελφὴν γυναῖκα
  choice: seorang saudari sebagai istri
  rationale: 'Terjemahan ini mempertahankan kedua unsur Yunani: seorang saudari dalam iman dan seorang istri. Ungkapannya sengaja cukup formal agar bentuk sumber tetap tampak, sementara catatan kaki menjelaskan maksudnya.'
- source_word: περιάγειν
  choice: membawa serta
  rationale: Dalam konteks perjalanan pelayanan, infinitif ini berarti membawa seseorang ikut bepergian; “membawa serta” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ὡς καὶ
  choice: seperti juga
  rationale: Mempertahankan baik hubungan perbandingan maupun nuansa tambahan dari καί.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: rasul-rasul lainnya
  rationale: λοιποί membedakan kelompok rasul lain dari pihak yang sedang berbicara; “lainnya” menyampaikan relasi itu secara alami.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: saudara-saudara Tuhan
  rationale: Menerjemahkan konstruksi Yunani secara langsung tanpa menentukan secara doktrinal jenis hubungan keluarga yang dimaksud.
- source_word: Κηφᾶς
  choice: Kefas
  rationale: Mempertahankan bentuk nama yang dipakai dalam teks Yunani, alih-alih menggantinya dengan Petrus.
theological_decisions:
- issue: Makna “saudara-saudara Tuhan”
  choice: Mempertahankan ungkapan “saudara-saudara Tuhan” tanpa penjelasan kekerabatan tambahan.
  alternative: Saudara kandung Yesus, saudara tiri, atau kerabat dekat.
  rationale: Frasa Yunani mengidentifikasi mereka sebagai saudara-saudara Tuhan, tetapi ayat ini sendiri tidak menyelesaikan perdebatan tentang hubungan biologis atau kekerabatan mereka.
- issue: Makna ἀδελφὴν γυναῖκα
  choice: “seorang saudari sebagai istri” dalam teks utama, dengan penjelasan bahwa yang dimaksud ialah istri yang seiman.
  alternative: “seorang istri yang percaya” atau “seorang istri Kristen”.
  rationale: Pilihan ini mengikuti bentuk sumber secara lebih dekat dan mempertahankan unsur ἀδελφή, tanpa menimbulkan kesan bahwa perempuan itu sekadar rekan perjalanan; catatan kaki memberi kejelasan idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dipertahankan. “Saudari sebagai istri” agak formal tetapi sengaja dipilih untuk mencerminkan susunan Yunani, dengan catatan kaki yang menjernihkan maknanya.
