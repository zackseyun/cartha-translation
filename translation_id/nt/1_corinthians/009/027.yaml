id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: id
  text: Namun, aku mendisiplinkan tubuhku dengan keras[a] dan menjadikannya budakku[b], supaya jangan sampai, setelah memberitakan kepada orang lain, aku sendiri didiskualifikasi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghajar tubuhku.” Kata Yunani ini secara harfiah dapat berarti memukul di bawah mata, tetapi di sini dipakai sebagai gambaran disiplin diri yang keras.
    reason: lexical_alternative
  - marker: b
    text: Atau “memperbudaknya” atau “membawanya ke dalam perbudakan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak memenuhi syarat,” “ditolak,” atau “tidak lulus ujian.” “Didiskualifikasi” sesuai dengan gambaran atletik dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan pernyataan sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: ὑπωπιάζω
  choice: mendisiplinkan ... dengan keras
  rationale: Kata ini secara harfiah dapat menggambarkan pukulan di bawah mata, tetapi di sini dipakai sebagai gambaran disiplin diri yang berat. Pilihan ini menyampaikan daya metaforanya tanpa menjadikannya perintah untuk melukai diri.
- source_word: σῶμα
  choice: tubuhku
  rationale: Mempertahankan acuan konkret kepada tubuh, bukan memperluasnya menjadi diri secara umum.
- source_word: δουλαγωγῶ
  choice: menjadikannya budakku
  rationale: Mempertahankan metafora kuat tentang membawa tubuh ke dalam perbudakan atau menundukkannya sebagai budak, alih-alih memperlunaknya menjadi sekadar mengendalikan.
- source_word: μή πως
  choice: supaya jangan sampai
  rationale: Ungkapan Indonesia yang alami untuk klausa tujuan negatif atau kekhawatiran akan suatu hasil.
- source_word: ἄλλοις
  choice: kepada orang lain
  rationale: Menyampaikan datif penerima pemberitaan secara jelas dan alami.
- source_word: κηρύξας
  choice: setelah memberitakan
  rationale: Bentuk partisip aoris menunjukkan tindakan yang mendahului kemungkinan hasil dalam klausa utama; 'setelah' menyatakan hubungan waktunya dengan jelas.
- source_word: ἀδόκιμος
  choice: tidak layak
  rationale: Mencakup arti tidak lulus pengujian, tidak disetujui, atau tersingkir, sambil mempertahankan keseriusan peringatan tanpa membatasi maknanya pada satu kesimpulan teologis.
- source_word: γένωμαι
  choice: menjadi
  rationale: Mempertahankan nuansa prospektif dari bentuk subjungtif dalam klausa kekhawatiran.
theological_decisions:
- issue: Arti kekhawatiran Paulus bahwa ia akan menjadi ἀδόκιμος
  choice: Diterjemahkan 'menjadi tidak layak,' dengan catatan bahwa dalam gambaran atletik kata itu dapat berarti didiskualifikasi.
  alternative: Ditolak Allah dalam arti keselamatan terakhir, atau hanya kehilangan kelayakan pelayanan maupun hadiah.
  rationale: Konteks langsung memakai gambaran perlombaan dan disiplin atlet, tetapi kata Yunani itu sendiri tidak menyelesaikan apakah akibat yang dimaksud menyangkut keselamatan, pelayanan, atau hadiah. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora tubuh dan perbudakan dipertahankan karena penting bagi kekuatan retoris ayat, sedangkan ungkapan pukulan harfiah dijelaskan dalam catatan kaki.
