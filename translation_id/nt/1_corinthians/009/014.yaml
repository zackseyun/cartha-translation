id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: id
  text: Demikian juga, Tuhan telah memerintahkan agar mereka yang memberitakan Injil[a] hidup dari Injil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengabarkan Injil.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, memperoleh nafkah dari pelayanan Injil.
    reason: clarification
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menandai analogi dengan contoh-contoh sebelumnya dan secara alami membawa unsur tambahan dari καὶ.
- source_word: καὶ
  choice: juga
  rationale: Menyampaikan penekanan aditif bahwa, selain dasar-dasar yang baru disebutkan, Tuhan pun memberikan perintah ini.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi κύριος; tidak memperluas teks menjadi 'Tuhan Yesus' meskipun dalam konteks Paulus kemungkinan besar Yesuslah yang dimaksud.
- source_word: διέταξεν
  choice: telah memerintahkan
  rationale: Mengungkapkan instruksi yang berwibawa; bentuk perfektif Yunani dipadankan secara alami dengan 'telah memerintahkan'.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: mereka yang memberitakan
  rationale: Menerjemahkan partisip substantival dengan ungkapan Indonesia yang alami serta mempertahankan nuansa pewartaan terbuka.
- source_word: τὸ εὐαγγέλιον
  choice: Injil
  rationale: Istilah baku, tetap mudah dipahami, dan sesuai dengan pemakaian Paulus.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: dari Injil
  rationale: Mempertahankan ungkapan sumber yang menunjuk pada asal nafkah atau dukungan, sementara konteks menjelaskan sifat materialnya.
- source_word: ζῆν
  choice: hidup
  rationale: Mempertahankan keluasan verba Yunani; dalam konteks, artinya ialah memperoleh penghidupan atau nafkah.
theological_decisions:
- issue: Rujukan 'Tuhan'
  choice: Mempertahankan 'Tuhan', dengan kemungkinan besar merujuk kepada Yesus
  alternative: Memperjelas menjadi 'Tuhan Yesus' atau memahaminya sebagai rujukan ilahi yang lebih umum
  rationale: Konteks Paulus paling alami menunjuk kepada ajaran Yesus, tetapi teks Yunani hanya mengatakan 'Tuhan'; terjemahan tidak menambahkan nama yang tidak tersurat.
- issue: Makna 'hidup dari Injil'
  choice: Dukungan material atau nafkah bagi orang yang memberitakan Injil
  alternative: Kehidupan rohani yang berasal dari Injil
  rationale: Pembahasan di sekitarnya menyangkut hak pekerja pelayanan untuk menerima dukungan. Ungkapan sumber tetap dipertahankan agar tidak diparafrasakan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Kapitalisasi 'Injil' mengikuti kebiasaan umum untuk kabar baik Kristen. Struktur kalimat mempertahankan hubungan analogis dengan ayat-ayat sebelumnya dan menghindari penambahan denominatif.
