translation:
  language: id
  text: 'Sebab dalam hukum Musa tertulis: “Jangan memberangus lembu yang sedang mengirik[a].” Apakah Allah memedulikan lembu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang sedang menginjak-injak bulir gandum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Sebab dalam hukum Musa
  rationale: Menerjemahkan ἐν secara langsung sebagai “dalam” dan mempertahankan hubungan genitif “hukum Musa” dalam ungkapan yang wajar dan lazim dalam bahasa Indonesia.
- source_word: γέγραπται
  choice: tertulis
  rationale: Ungkapan baku untuk formula perfektum pasif yang memperkenalkan kutipan Kitab Suci; bentuk ini mempertahankan gagasan bahwa teks itu telah ditulis dan tetap berlaku sebagai rujukan.
- source_word: Οὐ κημώσεις
  choice: Jangan memberangus mulut
  rationale: Bentuk futurum dalam kutipan hukum berfungsi sebagai larangan. “Jangan” merupakan bentuk larangan yang alami dalam bahasa Indonesia, sedangkan “memberangus mulut” secara jelas menyatakan tindakan memasang penutup agar hewan tidak makan.
- source_word: βοῦν
  choice: lembu
  rationale: “Lembu” adalah istilah Indonesia yang tepat dan bermartabat untuk hewan jenis sapi yang dipakai bekerja dalam konteks pertanian; ketakrifan tidak perlu ditandai karena konteks menyatakan kaidah umum.
- source_word: ἀλοῶντα
  choice: yang sedang mengirik
  rationale: Partisipel kini menunjukkan tindakan yang sedang berlangsung. “Mengirik” adalah padanan ringkas bagi kegiatan memisahkan bulir gandum dari tangkainya, tanpa menambahkan rincian cara yang tidak dinyatakan secara eksplisit dalam teks Paulus.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Apakah Allah memedulikan lembu?
  rationale: Pertanyaan dengan μή dipertahankan sebagai pertanyaan retoris. “Memedulikan” menyampaikan μέλει secara alami tanpa menambahkan “hanya” atau menyangkal secara mutlak pemeliharaan Allah atas hewan.
theological_decisions:
- issue: Pertanyaan retoris Paulus mengenai kepedulian Allah terhadap lembu
  choice: Apakah Allah memedulikan lembu?
  alternative: Apakah hanya lembu yang Allah pedulikan?
  rationale: Teks Yunani tidak memuat kata yang berarti “hanya”. Pertanyaan diterjemahkan apa adanya agar daya argumentatif dan ketegangan teologisnya tetap terpelihara tanpa menentukan bahwa Paulus sedang menyangkal kepedulian Allah terhadap hewan secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengirik” mempertahankan istilah pertanian yang ringkas; catatan kaki memberi ungkapan yang lebih deskriptif bagi pembaca yang kurang mengenal istilah tersebut. Penanda catatan ditempatkan sesudah frasa yang memang dijelaskannya.
