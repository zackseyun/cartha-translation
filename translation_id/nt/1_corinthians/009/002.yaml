id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: id
  text: Sekalipun bagi orang lain aku bukan rasul, setidaknya bagi kamu aku adalah rasul. Sebab, kamulah meterai kerasulanku dalam Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukti” atau “pengesahan” kerasulanku. Kata Yunani yang dipakai berarti “meterai”, yaitu tanda yang menegaskan keaslian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam pembelaan Paulus mengenai dirinya, kata ini menunjuk pada perutusan dan kedudukan rasuli, bukan sekadar utusan biasa.
- source_word: ἀλλά γε
  choice: setidaknya ... aku adalah rasul
  rationale: 'Ungkapan ini menyatakan pertentangan yang ditegaskan: apa pun penilaian pihak lain, hubungannya dengan jemaat Korintus memastikan klaim tersebut.'
- source_word: σφραγίς
  choice: meterai
  rationale: Pilihan ini mempertahankan metafora Yunani tentang tanda yang mengesahkan keaslian, sementara daya buktinya dijelaskan dalam catatan kaki.
- source_word: ἀποστολή
  choice: kerasulanku
  rationale: Kata ini merujuk pada tugas, perutusan, dan kedudukan Paulus sebagai rasul; 'kerasulan' merupakan padanan teknis yang wajar dalam bahasa Indonesia.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus dan tidak mempersempitnya menjadi sekadar pelaku tindakan atau sarana.
- source_word: ἄλλοις
  choice: bagi orang lain
  rationale: Dativus ini menyatakan lingkup relasional pengakuan Paulus sebagai rasul; 'bagi orang lain' alami dalam konstruksi bahasa Indonesia ini.
theological_decisions:
- issue: Cakupan pernyataan Paulus tentang kerasulannya
  choice: 'Kalimat dipertahankan sebagai pengandaian retoris: sekalipun kerasulannya tidak diakui dalam kaitannya dengan orang lain, bagi jemaat Korintus kerasulannya terbukti nyata.'
  alternative: Paulus secara harfiah membatasi kerasulannya hanya kepada jemaat Korintus.
  rationale: Konteksnya merupakan pembelaan kerasulan, dan keberadaan jemaat Korintus dikemukakan sebagai pengesahan, bukan sebagai batas mutlak tugas kerasulannya.
- issue: Makna ἐν κυρίῳ
  choice: Mempertahankan 'dalam Tuhan' sebagai lingkup hubungan dan keberadaan jemaat yang mengesahkan kerasulan Paulus.
  alternative: Menerjemahkannya 'oleh Tuhan' sebagai penunjuk pelaku.
  rationale: Bentuk Yunani secara alami mempertahankan rumusan relasional khas Paulus dan tidak secara eksplisit menyatakan pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'meterai' dipertahankan karena penting bagi gambaran sumber, sedangkan makna pengesahannya diterangkan dalam catatan kaki.
