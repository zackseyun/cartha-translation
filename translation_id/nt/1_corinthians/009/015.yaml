source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: id
  text: Namun, aku tidak menggunakan satu pun dari hal-hal itu[a]. Aku pun tidak menulis hal-hal ini supaya aku diperlakukan demikian, sebab lebih baik aku mati daripada—tidak seorang pun akan meniadakan kebanggaanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan rujukan konteksnya secara lebih jelas, “satu pun dari hak-hak itu.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani terputus setelah kata “daripada—”, lalu dilanjutkan dengan, “tidak seorang pun akan meniadakan kebanggaanku.” Kalimat ini sering diperhalus menjadi, “daripada membiarkan siapa pun meniadakan kebanggaanku.”
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: aku tidak menggunakan
  rationale: Bentuk perfek menyatakan bahwa sampai sekarang Paulus tidak memanfaatkan hal-hal yang baru dibahas; bahasa Indonesia tidak perlu menandai aspek itu secara kaku karena konteks sudah menjelaskannya.
- source_word: οὐδενὶ τούτων
  choice: satu pun dari semua itu
  rationale: Ungkapan ini tetap dekat dengan bentuk harfiah dan merujuk pada hak-hak memperoleh sokongan dalam konteks sebelumnya tanpa memasukkan penafsiran tersebut langsung ke teks.
- source_word: ἔγραψα ... ταῦτα
  choice: Aku pun tidak menulis hal-hal ini
  rationale: Aoristus diterjemahkan secara wajar dengan bentuk lampau yang dalam bahasa Indonesia cukup dinyatakan oleh konteks; 'hal-hal ini' menunjuk pada uraian sebelumnya.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: supaya aku diperlakukan demikian
  rationale: Pilihan ini menyampaikan tujuan yang disangkal Paulus dan makna kontekstual bahwa ia tidak menulis agar ketentuan sokongan itu diterapkan kepadanya.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: sebab lebih baik aku mati
  rationale: Terjemahan ini mempertahankan bentuk penilaian komparatif Yunani dan tetap alami serta tegas dalam bahasa Indonesia.
- source_word: τὸ καύχημά μου
  choice: kebanggaanku
  rationale: καύχημα dapat menunjuk pada kebanggaan atau dasar untuk berbangga; bentuk ringkas ini mempertahankan keluasan maknanya.
- source_word: κενώσει
  choice: akan meniadakan
  rationale: Dalam konteks metaforis, κενόω berarti membuat kosong, sia-sia, atau tanpa isi; 'meniadakan' alami dalam bahasa Indonesia dan menyatakan hilangnya dasar kebanggaan tanpa memberi kesan pengosongan secara fisik.
theological_decisions:
- issue: Sintaks terputus sesudah ἤ
  choice: Mempertahankan tanda pisah setelah 'daripada—', lalu melanjutkan dengan klausa baru yang dekat dengan bentuk Yunani.
  alternative: Melancarkan kalimat menjadi 'sebab aku lebih baik mati daripada membiarkan siapa pun meniadakan kebanggaanku.'
  rationale: Teks Yunani terputus setelah ἤ ('daripada') dan kemudian memulai kembali pernyataannya. Mempertahankan keterputusan itu menjaga intensitas retoris dan tidak memasok kata-kata yang tidak tertulis.
- issue: Makna καύχημα
  choice: kebanggaanku
  alternative: dasarku untuk berbangga
  rationale: Kata tersebut dapat berarti kebanggaan maupun dasar kebanggaan. Teks utama mempertahankan ungkapan yang ringkas dan ambigu, sedangkan nuansa kontekstual tidak dijadikan penafsiran wajib.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus dan lazim dalam terjemahan Alkitab Indonesia. Struktur terputus dipertahankan untuk mencerminkan anacoluthon sumber, sedangkan catatan kaki menjelaskan pembacaan yang lebih lancar.
