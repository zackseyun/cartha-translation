  naturalness: Registernya baku dan sesuai untuk suara pribadi Paulus. “Tidak menggunakan satu pun dari hal-hal itu” lebih alami daripada “tidak menggunakan satu pun dari semua itu.” Catatan b perlu diperbaiki karena susunan kutipan lanjutannya tidak wajar dan memakai objek ganda yang tidak diperlukan.
  terminology: “Kebanggaanku” dapat dipertahankan sebagai padanan ringkas καύχημα, sambil membiarkan kemungkinan makna ‘dasar untuk berbangga’ tetap terbuka. “Meniadakan” merupakan padanan metaforis yang baik untuk κενώσει dalam konteks ini.
