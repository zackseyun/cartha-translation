id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: id
  text: Tidak tahukah kamu bahwa mereka yang melaksanakan tugas-tugas suci mendapat makanan dari Bait Allah,[a] dan mereka yang melayani di mezbah mendapat bagian dari persembahan di mezbah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mereka yang mengerjakan hal-hal suci memakan apa yang berasal dari Bait Allah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “berbagi dengan mezbah,” yaitu menerima bagian dari korban yang dipersembahkan di sana.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Tidak tahukah kamu
  rationale: Mempertahankan bentuk pertanyaan retoris Paulus dalam bahasa Indonesia yang wajar; bentuk jamak dipahami secara kolektif melalui 'kamu' sesuai pemakaian baku modern.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: mereka yang melaksanakan tugas-tugas suci
  rationale: τὰ ἱερά secara harfiah menunjuk pada hal-hal kudus/suci, sedangkan ἐργάζομαι di sini menyatakan pelaksanaan pelayanan terkait hal-hal itu. Pilihan ini mempertahankan nuansa kultis tanpa membatasinya secara berlebihan menjadi sekadar bekerja di lokasi Bait Allah.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: mendapat makanan dari Bait Allah
  rationale: Mengungkapkan bahwa para pelayan memperoleh makanan atau pemeliharaan dari persediaan Bait Allah, sambil tetap mempertahankan unsur 'makan' dalam bentuk Indonesia yang alami.
- source_word: ἱεροῦ
  choice: Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah atau kawasan sucinya. 'Bait Allah' merupakan istilah Indonesia yang jelas dan lazim untuk konteks ini.
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: mereka yang melayani di mezbah
  rationale: παρεδρεύω berarti berada atau bertugas di sisi sesuatu; dalam konteks kultis, 'melayani di mezbah' menyampaikan fungsi pelayanan itu secara alami.
- source_word: θυσιαστηρίῳ
  choice: mezbah
  rationale: Padanan baku dan tepat bagi mezbah korban.
- source_word: συμμερίζονται
  choice: mendapat bagian dari persembahan di mezbah
  rationale: Kata kerja ini menyatakan menerima atau berbagi suatu bagian. Objek yang tersirat dijelaskan sebagai persembahan di mezbah agar hubungan ekonomis-kultis dapat dipahami tanpa mengubah maksud kalimat.
theological_decisions:
- issue: Gambaran ibadah dan sumber pemeliharaan bagi pelayan
  choice: Ayat diterjemahkan sebagai pernyataan bahwa orang yang menjalankan pelayanan suci memperoleh makanan atau bagian dari persembahan yang terkait dengan pelayanan itu.
  alternative: Klausa terakhir dapat diterjemahkan lebih harfiah sebagai 'berbagi dengan mezbah'.
  rationale: Terjemahan mempertahankan analogi Paulus mengenai pemeliharaan material yang berasal dari pelayanan suci, tanpa memasukkan struktur gerejawi kemudian. Ungkapan harfiah 'berbagi dengan mezbah' dipertahankan dalam catatan sebagai alternatif karena mezbah secara metonimis mewakili korban yang dipersembahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tugas-tugas suci' menjaga warna kultis teks Yunani, sedangkan 'mendapat makanan' dan 'mendapat bagian' memperjelas idiom sumber tanpa menambahkan struktur teologis di luar ayat.
