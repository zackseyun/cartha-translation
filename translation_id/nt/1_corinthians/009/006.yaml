  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: id
  text: Atau, hanya aku dan Barnabas sajakah yang tidak berhak untuk tidak bekerja?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wewenang untuk tidak bekerja” atau “kebebasan untuk tidak berjerih payah.” Dalam konteks ini, maksudnya ialah hak untuk tidak bekerja demi membiayai diri sendiri, melainkan menerima dukungan dalam pelayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Memperkenalkan alternatif retoris berikutnya dalam rangkaian argumen Paulus dan mempertahankan hubungan dengan ayat-ayat sebelumnya.
- source_word: μόνος
  choice: hanya
  rationale: Menekankan bahwa Paulus dan Barnabas dipertanyakan sebagai satu-satunya pengecualian.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: aku dan Barnabas
  rationale: Mengikuti urutan Yunani secara wajar dalam bahasa Indonesia; bentuk “aku” sesuai dengan tuturan pribadi Paulus dalam konteks ini.
- source_word: οὐκ ἔχομεν ἐξουσίαν
  choice: tidak mempunyai hak
  rationale: ἐξουσία di sini menunjuk pada hak atau kewenangan yang sah, khususnya hak seorang rasul untuk menerima dukungan, bukan terutama kuasa memerintah.
- source_word: μὴ ἐργάζεσθαι
  choice: untuk tidak bekerja
  rationale: Mempertahankan bentuk dan keluasan ungkapan Yunani. Dalam konteksnya, yang dimaksud ialah tidak melakukan pekerjaan untuk menopang diri karena pelayanan dapat ditunjang oleh jemaat; penjelasan ini ditempatkan dalam catatan agar tidak dimasukkan secara berlebihan ke dalam teks.
theological_decisions:
- issue: Arti hak untuk tidak bekerja dalam konteks pelayanan rasuli
  choice: Ungkapan dipertahankan sebagai hak untuk tidak bekerja, dengan catatan bahwa konteks menunjuk pada tidak melakukan pekerjaan guna menopang diri dan menerima dukungan dalam pelayanan.
  alternative: Menjadikannya secara eksplisit “hak untuk tidak mencari nafkah sendiri” dalam teks utama.
  rationale: Konteks 1 Korintus 9 mendukung pemahaman tentang dukungan materi bagi para rasul, tetapi teks Yunani sendiri hanya mengatakan “tidak bekerja”. Terjemahan utama mempertahankan ketegangan dan keluasan ungkapan itu, sedangkan catatan menjelaskan implikasi kontekstualnya tanpa mempersempit teks secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan pertanyaan retoris serta pengulangan negatif dipertahankan karena mencerminkan bentuk dan tekanan teks Yunani; catatan kaki membantu mencegah salah pengertian bahwa Paulus sedang membenarkan kemalasan.
