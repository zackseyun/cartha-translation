  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: id
  text: Sebab jika aku memberitakan Injil[a], aku tidak mempunyai alasan untuk bermegah, sebab keharusan dibebankan kepadaku. Sebab celakalah aku jika aku tidak memberitakan Injil!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyampaikan kabar baik”; demikian juga pada kemunculan berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: memberitakan Injil
  rationale: Kata kerja ini berarti menyampaikan kabar baik. Dalam konteks Paulus, pesan yang tersirat ialah Injil; pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya proklamatifnya pada kedua kemunculan.
- source_word: καύχημα
  choice: alasan untuk bermegah
  rationale: Nomina ini menunjuk pada sesuatu yang menjadi dasar atau alasan untuk bermegah, bukan sekadar tindakan membanggakan diri.
- source_word: ἀνάγκη
  choice: keharusan
  rationale: Kata ini menyatakan kebutuhan atau kewajiban yang mendesak tanpa menentukan secara eksplisit apakah tekanannya bersifat internal atau eksternal.
- source_word: ἐπίκειται
  choice: telah dibebankan kepadaku
  rationale: Kata kerja ini menggambarkan sesuatu yang diletakkan atau menekan atas seseorang; pilihan ini menyampaikan kewajiban yang dikenakan kepada Paulus.
- source_word: οὐαί
  choice: celakalah
  rationale: Seruan ini menandakan malapetaka atau kesusahan berat dan mempertahankan nada khidmat serta profetis.
- source_word: ἐὰν μὴ
  choice: jika ... tidak
  rationale: Bentuk syarat ini diterjemahkan secara langsung dan jelas dalam susunan kalimat bahasa Indonesia.
- source_word: γάρ
  choice: sebab / karena
  rationale: Kedua kemunculannya mempertahankan fungsi penjelas; variasi alami bahasa Indonesia menghindari pengulangan yang kaku tanpa mengubah hubungan logis.
theological_decisions:
- issue: Sifat kewajiban Paulus untuk memberitakan Injil
  choice: Dinyatakan sebagai keharusan yang dibebankan kepadanya tanpa menyebutkan sumbernya secara eksplisit.
  alternative: Menafsirkan secara lebih khusus sebagai paksaan batin atau amanat langsung dari Allah.
  rationale: Bahasa Yunani menyatakan bahwa suatu keharusan berada atas Paulus, tetapi ayat ini sendiri tidak merinci apakah sumbernya amanat ilahi, dorongan batin, atau keadaan eksternal; ketegangan ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan retoris. Ungkapan “Celakalah aku” mempertahankan kekuatan seruan Yunani, sedangkan “memberitakan Injil” merupakan ungkapan gerejawi yang luas dipahami dan tetap dekat dengan makna sumber.
