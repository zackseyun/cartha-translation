  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: id
  text: Sebab, sekalipun aku bebas dari semua orang, aku memperhamba diriku kepada semua orang, supaya aku dapat memenangkan lebih banyak orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "supaya aku memenangkan lebih banyak orang." Kata "lebih banyak" menerjemahkan bentuk komparatif Yunani dan tidak dengan sendirinya berarti "sebanyak mungkin."
    reason: Menjelaskan cakupan komparatif τοὺς πλείονας tanpa melemahkan bahasa perhambaan yang telah dipertahankan dalam teks utama.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: bebas
  rationale: Menyatakan keadaan tidak diperhamba atau tidak berada di bawah kewajiban; sekaligus mempertahankan pertentangan retoris dengan ἐδούλωσα.
- source_word: ἐκ πάντων
  choice: dari semua orang
  rationale: Dalam konteks ini πάντων merujuk kepada orang-orang. Ungkapan ini berarti Paulus bebas dalam hubungannya dengan siapa pun, tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: πᾶσιν
  choice: bagi semua orang
  rationale: Datif ini menyatakan pihak yang kepadanya Paulus secara sukarela menundukkan diri. 'Bagi' terdengar alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan 'dari semua orang'.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: aku menjadikan diriku hamba
  rationale: Mempertahankan tindakan sukarela dan metafora perhambaan. 'Hamba' lebih wajar dan bermartabat dalam bahasa Indonesia modern daripada 'budak' untuk tindakan pelayanan sukarela, sementara catatan kaki menjelaskan kekuatan istilah Yunani.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dengan jelas dan alami dalam bahasa Indonesia modern.
- source_word: τοὺς πλείονας
  choice: lebih banyak orang
  rationale: Komparatif ini menunjuk pada jumlah orang yang lebih besar. Terjemahan ini alami dan tidak memperkuatnya menjadi 'sebanyak mungkin'.
- source_word: κερδήσω
  choice: aku dapat memenangkan
  rationale: Mempertahankan metafora memperoleh atau memenangkan orang dalam konteks pelayanan Paulus; 'dapat' secara wajar menyampaikan nuansa bentuk subjungtif dalam klausa tujuan.
theological_decisions:
- issue: Penerjemahan bahasa perhambaan pada ἐδούλωσα
  choice: hamba dalam teks utama, dengan penjelasan bahwa bahasa Yunaninya berarti memperhamba
  alternative: budak; memperbudak diriku
  rationale: Pertentangan antara 'bebas' dan tindakan menjadikan diri hamba harus dipertahankan. Namun, 'budak bagi semua orang' berpotensi terdengar kaku atau semata-mata menunjuk status sosial dalam bahasa Indonesia sekarang. 'Hamba' mempertahankan citra penundukan diri, sedangkan catatan kaki menjaga kekuatan leksikal bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus. Struktur sebab–meskipun–supaya mempertahankan alur argumentasi Yunani, dan pengulangan 'semua orang' menjaga kesejajaran retoris.
