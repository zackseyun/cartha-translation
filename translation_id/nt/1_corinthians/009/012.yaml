  to: Jika orang lain turut menikmati hak ini terhadap kamu[a], bukankah kami lebih berhak lagi? Namun, kami tidak menggunakan hak ini. Sebaliknya, kami menanggung segala sesuatu agar kami tidak menimbulkan hambatan apa pun bagi Injil Mesias.
  rationale: Revisi memperjelas bahwa hak tersebut merupakan tuntutan yang sah dalam hubungan dengan jemaat Korintus, bukan hak kepemilikan atas mereka. Revisi juga mempertahankan bentuk “menimbulkan hambatan ... bagi” yang lebih dekat dengan ἐγκοπὴν δῶμεν τῷ εὐαγγελίῳ, serta menggunakan “Injil Mesias” untuk tidak membatasi keluwesan genitif τοῦ Χριστοῦ.
