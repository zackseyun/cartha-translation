id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: id
  text: Jika orang lain turut menikmati hak ini terhadap kamu[a], bukankah kami lebih berhak lagi? Namun, kami tidak menggunakan hak ini. Sebaliknya, kami menanggung segala sesuatu agar kami tidak menimbulkan hambatan apa pun bagi Injil Mesias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tuntutan ini terhadap kamu” atau “wewenang dalam hubungan dengan kamu.” Frasa Yunani ini tampaknya menunjuk pada hak para rasul untuk menerima dukungan materi dari jemaat Korintus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: hak
  rationale: Dalam konteks ini, kata tersebut menunjuk pada hak sah para rasul untuk menerima dukungan materi; “hak” lebih alami daripada “wewenang” dalam bahasa Indonesia.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: hak atas kamu ini
  rationale: Genitif ὑμῶν dipahami secara relasional, yakni hak atau tuntutan terhadap jemaat Korintus untuk memperoleh dukungan, bukan hak yang dimiliki oleh mereka.
- source_word: μετέχουσιν
  choice: turut menikmati
  rationale: Mengungkapkan partisipasi dalam manfaat suatu hak secara alami dalam konteks dukungan materi.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: bukankah kami lebih berhak lagi?
  rationale: Mempertahankan bentuk pertanyaan retoris dan daya komparatif μᾶλλον dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ἐχρησάμεθα
  choice: tidak menggunakan
  rationale: χράομαι di sini berarti memakai atau memanfaatkan hak yang tersedia.
- source_word: πάντα στέγομεν
  choice: kami menanggung segala sesuatu
  rationale: στέγω dalam konteks ini berarti bertahan atau menanggung kesukaran, bukan menutupi sesuatu.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: kami tidak menghambat
  rationale: Ungkapan Yunani secara harfiah berarti tidak memberikan hambatan apa pun; bentuk verbal ini lebih alami dalam bahasa Indonesia dan tetap menyampaikan tujuan tindakan Paulus.
- source_word: εὐαγγελίῳ
  choice: Injil
  rationale: “Injil” merupakan padanan baku dan jelas bagi εὐαγγέλιον dalam konteks Paulus.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam frasa ini, sehingga “Mesias” mempertahankan makna gelarnya.
theological_decisions:
- issue: Hubungan genitif dalam εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Injil tentang Mesias
  alternative: Injil milik Mesias
  rationale: Genitif dapat menyatakan isi atau hubungan kepunyaan/sumber. Konteks pemberitaan mendukung “tentang Mesias,” tetapi frasa Yunani tetap memiliki keluwesan relasional.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini istilah tersebut paling wajar dipahami sebagai gelar, bukan semata-mata unsur nama diri.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Turut menikmati” dipilih agar gagasan mengambil bagian dalam manfaat hak terdengar alami; “menanggung segala sesuatu” mempertahankan keluasan πάντα dan tekanan pada kerelaan Paulus.
