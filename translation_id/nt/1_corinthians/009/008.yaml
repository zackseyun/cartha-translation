id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: id
  text: Apakah aku mengatakan hal-hal ini hanya menurut pandangan manusia[a], atau bukankah Hukum Taurat juga mengatakan hal-hal ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menurut manusia” atau “dari sudut pandang manusia.”'
    reason: Alternatif leksikal untuk idiom κατὰ ἄνθρωπον.
lexical_decisions:
- source_word: Μὴ
  choice: Apakah ... hanya
  rationale: Partikel ini membentuk pertanyaan retoris yang mengharapkan jawaban negatif; bersama konteks dan frasa berikutnya, bentuk Indonesia ini menyampaikan bahwa perkataan Paulus bukan semata-mata berdasarkan sudut pandang manusia.
- source_word: κατὰ ἄνθρωπον
  choice: menurut pandangan manusia
  rationale: Ungkapan ini menunjuk pada dasar atau sudut pandang manusiawi. Kata 'pandangan' membuat idiomnya wajar dalam bahasa Indonesia, sedangkan 'hanya' menyatakan kontras kontekstual dengan kesaksian Taurat tanpa mengubahnya menjadi klaim tentang otoritas.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mempertahankan bentuk jamak dan kaitannya dengan argumentasi Paulus sebelumnya.
- source_word: λαλῶ
  choice: aku mengatakan
  rationale: Bentuk kini mengacu pada argumentasi yang sedang Paulus sampaikan; 'mengatakan' alami dalam pertanyaan langsung ini.
- source_word: ἢ
  choice: atau
  rationale: Mempertahankan penghubung disjungtif yang memperkenalkan alternatif retoris.
- source_word: καὶ
  choice: juga
  rationale: Menampilkan Taurat sebagai kesaksian tambahan dalam argumentasi.
- source_word: ὁ νόμος
  choice: Hukum Taurat
  rationale: Konteks langsung mengutip Ulangan 25:4, sehingga istilah ini secara khusus merujuk pada Taurat Musa, bukan hukum dalam arti umum.
- source_word: οὐ λέγει
  choice: bukankah ... mengatakan
  rationale: Mempertahankan bentuk pertanyaan negatif Yunani yang mengharapkan jawaban afirmatif, alih-alih meratakannya menjadi pernyataan positif.
theological_decisions:
- issue: Rujukan ὁ νόμος dalam argumentasi Paulus
  choice: Hukum Taurat, yakni korpus hukum Musa dalam Kitab Suci
  alternative: hukum sebagai prinsip umum
  rationale: Ayat berikutnya mengutip Ulangan 25:4. Karena itu, terjemahan perlu menandai rujukan khusus kepada Taurat tanpa menambahkan klaim doktrinal lain.
- issue: Hubungan penalaran manusia dan kesaksian Taurat
  choice: Mempertahankan pertanyaan retoris yang menempatkan Taurat sebagai kesaksian tambahan
  alternative: Mengubahnya menjadi pernyataan bahwa Paulus sama sekali tidak memakai penalaran manusia
  rationale: Kata καί berarti 'juga'; teks tidak perlu dipaksa menyangkal semua penalaran manusia, tetapi menegaskan bahwa Taurat pun mengatakan hal yang sama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Pronomina 'aku' mengikuti suara pribadi Paulus. 'Hukum Taurat' dipilih agar rujukan kitabiah jelas bagi pembaca umum. Penanda catatan kaki [a] dicantumkan tepat setelah frasa terkait.
