  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: id
  text: Sebab, jika aku melakukan ini dengan rela, aku mendapat upah; tetapi jika aku melakukannya bukan dengan rela, aku telah dipercayakan tugas untuk mengelola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "aku telah dipercayakan suatu amanat."'
    reason: Alternatif ini menerjemahkan οἰκονομία sebagai amanat atau kepercayaan yang dipercayakan, tanpa menonjolkan gambaran pengelolaan secara eksplisit.
lexical_decisions:
- source_word: ἑκὼν
  choice: dengan sukarela
  rationale: Ungkapan ini menyatakan tindakan yang dilakukan atas kemauan sendiri dan mempertahankan pertentangan langsung dengan ἄκων.
- source_word: τοῦτο πράσσω
  choice: aku melakukan ini
  rationale: Pilihan ini alami dalam bahasa Indonesia dan tetap cukup luas untuk menunjuk pada pelaksanaan pelayanan yang sedang dibahas tanpa mempersempit maknanya.
- source_word: μισθὸν
  choice: upah
  rationale: μισθός dapat berarti upah atau ganjaran. 'Upah' mempertahankan gambaran balasan yang konkret serta tidak menentukan lebih jauh hakikat balasan tersebut.
- source_word: ἄκων
  choice: tidak dengan sukarela
  rationale: Bentuk ini mempertahankan kesejajaran dan pertentangan formal dengan 'dengan sukarela' tanpa menambahkan nuansa emosional seperti keengganan atau keterpaksaan.
- source_word: οἰκονομίαν
  choice: suatu tanggung jawab pengelolaan
  rationale: Ungkapan ini mempertahankan gagasan tentang pengelolaan sesuatu yang dipercayakan, sekaligus menyampaikan unsur tanggung jawab secara jelas bagi pembaca modern.
- source_word: πεπίστευμαι
  choice: kepadaku telah dipercayakan
  rationale: 'Susunan ini mencerminkan bentuk pasif perfektum: tanggung jawab itu telah dipercayakan kepada Paulus dan keadaan tersebut masih berlaku.'
theological_decisions:
- issue: Sifat pelayanan Paulus dalam anak kalimat kedua
  choice: Paulus menyatakan bahwa sekalipun ia tidak melakukannya dengan sukarela, suatu tanggung jawab pengelolaan tetap telah dipercayakan kepadanya.
  alternative: Paulus hanya memperoleh kewajiban, bukan upah, jika ia bertindak tanpa sukarela; atau Paulus membedakan pelayanan sukarela dari jabatan wajib tanpa menyangkal panggilan ilahi.
  rationale: Terjemahan mempertahankan kontras antara μισθὸν ἔχω dan οἰκονομίαν πεπίστευμαι tanpa mengubahnya menjadi teori khusus tentang jabatan pelayanan atau menghapus ketegangan antara kerelaan dan kewajiban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kontras retoris Yunani, sedangkan 'tanggung jawab pengelolaan' dipilih agar metafora amanat yang dikelola tetap terlihat tanpa memakai istilah gerejawi khusus.
