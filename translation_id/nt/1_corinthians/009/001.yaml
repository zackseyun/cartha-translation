  to: Bukankah aku bebas? Bukankah aku seorang rasul? Bukankah aku telah melihat Yesus, Tuhan kita?[a] Bukankah kalian adalah pekerjaanku dalam Tuhan?
  rationale: Revisi terbatas pada pemilihan diksi yang lebih langsung dan alami sambil mempertahankan bentuk pertanyaan retoris, aspek perfektum “telah melihat,” gelar “Tuhan,” serta ambiguitas “dalam Tuhan.” Tidak ada penambahan seperti “yang telah bangkit,” karena tidak tersurat dalam teks Yunani.
