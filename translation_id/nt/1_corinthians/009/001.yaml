  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: id
  text: Bukankah aku bebas? Bukankah aku seorang rasul? Bukankah aku telah melihat Yesus, Tuhan kita?[a] Bukankah kalian adalah pekerjaanku dalam Tuhan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan susunan yang lebih lazim, “Tuhan kita Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: orang bebas
  rationale: Menyatakan kebebasan dan hak Paulus dalam konteks ini; bentuk ini alami untuk predikat yang menunjuk pada status seseorang.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Istilah ini menunjuk pada jabatan kerasulan Paulus, bukan sekadar seorang utusan biasa.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Yesus, Tuhan kita
  rationale: Mengikuti urutan Yunani dan mempertahankan κύριος sebagai gelar kristologis 'Tuhan'; koma memperjelas hubungan aposisional dalam bahasa Indonesia.
- source_word: ἑόρακα
  choice: telah melihat
  rationale: Mencerminkan aspek perfektum, yakni peristiwa melihat yang tetap penting bagi klaim kerasulan Paulus.
- source_word: ἔργον
  choice: hasil pekerjaanku
  rationale: Dalam konteks ini jemaat Korintus adalah hasil pelayanan kerasulan Paulus; ungkapan ini lebih jelas dan alami daripada sekadar 'pekerjaanku'.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus dan ambiguitas relasional atau sferisnya.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Bukankah ...?
  rationale: Keempat bentuk negatif memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya.
theological_decisions:
- issue: Makna klaim Paulus bahwa ia telah melihat Yesus
  choice: Teks utama hanya menyatakan bahwa Paulus telah melihat Yesus sebagai dasar tersirat bagi kerasulannya.
  alternative: Menjelaskannya secara eksplisit sebagai melihat Yesus yang telah bangkit.
  rationale: Konteks mendukung rujukan kepada penampakan Yesus yang bangkit, tetapi kata 'bangkit' tidak terdapat dalam teks Yunani dan karena itu tidak ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; rangkaian pertanyaan retoris dipertahankan. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
