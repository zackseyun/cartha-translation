  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: id
  text: Bukankah kami mempunyai hak untuk makan dan minum?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wewenang untuk makan dan minum.” Di sini “hak” menunjuk pada tuntutan atau kebebasan yang sah, kemungkinan dalam arti menerima dukungan materi dalam argumen Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Bukankah
  rationale: Gabungan partikel ini membentuk pertanyaan retoris yang mengharapkan jawaban positif. “Bukankah” menyampaikan bentuk tanya dan dorongan afirmatifnya secara wajar dalam bahasa Indonesia.
- source_word: ἔχομεν
  choice: kami mempunyai
  rationale: Bentuk kini orang pertama jamak diterjemahkan langsung. “Mempunyai” alami ketika diikuti “hak” dan lebih sesuai dengan ragam umum daripada “memiliki” dalam kalimat retoris ini.
- source_word: ἐξουσίαν
  choice: hak
  rationale: Dalam konteks ini kata tersebut menunjuk pada kewenangan, kebebasan yang sah, atau tuntutan yang legitim, bukan kuasa mentah maupun wewenang memerintah. “Hak” paling alami tanpa mempersempit maknanya secara berlebihan.
- source_word: φαγεῖν
  choice: untuk makan
  rationale: Infinitif menyatakan tindakan yang tercakup dalam hak tersebut dan secara alami diterjemahkan dengan “untuk makan”.
- source_word: καὶ πεῖν
  choice: dan minum
  rationale: Dalam koordinasi bahasa Indonesia, kata “untuk” tidak perlu diulang; bentuk ini tetap jelas dan lebih alami.
theological_decisions:
- issue: Cakupan hak rasuli dalam konteks
  choice: Teks utama mempertahankan pernyataan tentang hak untuk makan dan minum, yang dalam alur 1 Korintus 9 kemungkinan menunjuk pada hak para rasul atau pekerja untuk menerima dukungan materi.
  alternative: Pernyataan umum mengenai kebebasan setiap orang untuk makan dan minum.
  rationale: Konteks langsung membahas hak Paulus sebagai rasul, khususnya dukungan dari jemaat. Namun, menambahkan “menerima dukungan” ke dalam teks utama akan membuat hal yang tersirat menjadi terlalu eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas, wajar, dan bermartabat. Pertanyaan retoris dipertahankan, dan ambiguitas kontekstual antara hak secara umum dan hak menerima dukungan tidak diselesaikan secara berlebihan dalam teks utama.
