source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: id
  text: Jadi, apakah upahku? Upahku ialah bahwa, ketika memberitakan kabar baik, aku menyampaikan kabar baik itu tanpa memungut bayaran, supaya aku tidak menggunakan sepenuhnya hakku dalam pemberitaan kabar baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam pelayanan kabar baik” atau “sehubungan dengan kabar baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: upah
  rationale: Kata ini mempertahankan metafora imbalan dalam pertanyaan retoris Paulus; konteks menunjukkan bahwa yang dimaksud bukan semata-mata gaji, melainkan imbalan yang secara ironis ia temukan dalam pelayanan tanpa bayaran.
- source_word: εὐαγγελιζόμενος
  choice: ketika memberitakan kabar baik
  rationale: Bentuk partisip ini menyatakan kegiatan yang berlangsung bersamaan dengan tindakan menyampaikan kabar baik, dan terjemahan ini mempertahankan daya verbalnya.
- source_word: ἀδάπανον
  choice: tanpa memungut bayaran
  rationale: Dalam konteks hak Paulus untuk menerima dukungan materi, ungkapan ini secara alami menyatakan bahwa ia tidak mengenakan biaya atau meminta bayaran kepada penerima pemberitaannya.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: aku menyampaikan kabar baik itu
  rationale: Secara harfiah berarti 'menempatkan/menjadikan kabar baik', tetapi dalam konteks menunjuk pada penyajian atau penyampaian kabar baik; 'menyampaikan' wajar dalam bahasa Indonesia.
- source_word: εὐαγγέλιον
  choice: kabar baik
  rationale: Pilihan ini menyampaikan arti leksikalnya dengan bahasa Indonesia modern dan mudah dipahami tanpa menghilangkan rujukan pada berita tentang Kristus.
- source_word: καταχρήσασθαι
  choice: menggunakan sepenuhnya
  rationale: Kata kerja ini dapat berarti memakai secara penuh. Pilihan ini tidak memberi kesan bahwa hak tersebut disalahgunakan, sebab dalam konteks hak Paulus itu sah.
- source_word: ἐξουσίᾳ
  choice: hak
  rationale: Pasal ini membahas kewenangan atau hak sah rasul untuk menerima dukungan materi; 'hak' paling jelas menyatakan nuansa kontekstual tersebut.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: dalam pemberitaan kabar baik
  rationale: Frasa Yunani ringkas dan dapat berarti dalam kaitan dengan kabar baik atau dalam pelayanan kabar baik. Eksplisitasi 'pemberitaan' menghasilkan bahasa Indonesia yang alami, sementara alternatif yang lebih umum dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Sifat ἐξουσία Paulus dalam konteks
  choice: Hak sah untuk menerima dukungan dalam pelayanan pemberitaan kabar baik, yang tidak ia gunakan sepenuhnya
  alternative: Kewenangan kerasulan secara lebih umum, atau penggunaan wewenang yang bernada eksploitatif
  rationale: Konteks 1 Korintus 9 berulang kali membahas hak seorang rasul untuk memperoleh dukungan materi. Karena itu, terjemahan tidak menyiratkan bahwa hak tersebut tidak sah atau disalahgunakan.
- issue: Cakupan ἐν τῷ εὐαγγελίῳ
  choice: dalam pemberitaan kabar baik
  alternative: dalam kabar baik; dalam pelayanan kabar baik
  rationale: Frasa sumber dapat menunjuk pada ranah atau kegiatan yang berkaitan dengan kabar baik. 'Dalam pemberitaan kabar baik' sesuai konteks, sedangkan ambiguitas yang lebih luas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan 'kabar baik' dipertahankan karena mencerminkan pengulangan εὐαγγέλιον dalam teks Yunani. Istilah 'upah' menjaga permainan gagasan antara imbalan dan pelayanan tanpa bayaran.
