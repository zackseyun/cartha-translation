  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: id
  text: Sebab, pada waktu makan, setiap orang lebih dahulu menyantap makanannya sendiri[a], dan yang seorang kelaparan, sedangkan yang lain mabuk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengambil makanannya sendiri lebih dahulu.” Kata kerja Yunani dapat menekankan mengambil atau makan terlebih dahulu, atau bertindak tanpa menunggu orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang seorang masih lapar, sedangkan yang lain sudah mabuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: setiap orang
  rationale: Mempertahankan daya distributif bentuk tunggal Yunani dengan ungkapan Indonesia yang alami dan mencakup tiap individu.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini menjelaskan teguran pada konteks sebelumnya.
- source_word: τὸ ἴδιον δεῖπνον
  choice: makanannya sendiri
  rationale: Menonjolkan kepemilikan pribadi yang bertentangan dengan sifat perjamuan bersama; 'makanan' lebih alami daripada 'makan malam' dalam konstruksi ini tanpa meniadakan konteks perjamuan.
- source_word: προλαμβάνει
  choice: langsung menyantap
  rationale: Menyampaikan tindakan mendahului atau terus makan tanpa menunggu orang lain, sambil mempertahankan ambiguitas itu melalui catatan kaki.
- source_word: ἐν τῷ φαγεῖν
  choice: pada waktu makan
  rationale: Menerjemahkan konstruksi infinitif artikular secara temporal dengan bahasa Indonesia yang ringkas dan alami.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: yang satu ... yang lain
  rationale: Menyampaikan kontras korelatif antara peserta secara idiomatis.
- source_word: πεινᾷ
  choice: kelaparan
  rationale: Menggambarkan keadaan tidak mendapat makanan dalam kontras tajam dengan peserta lain yang mabuk.
- source_word: μεθύει
  choice: mabuk
  rationale: Menyatakan kemabukan nyata secara lugas tanpa memperlunaknya menjadi sekadar makan atau minum berlebihan.
theological_decisions:
- issue: Rujukan distributif tunggal bergender
  choice: setiap orang ... makanannya sendiri
  alternative: masing-masing ... hidangannya sendiri
  rationale: Bahasa Indonesia tidak mengharuskan pronomina bergender; bentuk tunggal distributif tetap terpelihara tanpa memasukkan atau menghapus jenis kelamin secara tidak wajar.
- issue: Sifat penyalahgunaan dalam Perjamuan Tuhan
  choice: yang lain mabuk
  alternative: yang lain menjadi mabuk
  rationale: Teks menggambarkan kemabukan yang nyata. Bentuk 'mabuk' mempertahankan kemungkinan makna keadaan maupun hasil tindakan tanpa melunakkan teguran Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Pada waktu makan' menjaga nilai temporal ἐν τῷ φαγεῖν; 'langsung menyantap' terdengar alami sekaligus membiarkan nuansa mendahului dijelaskan dalam catatan kaki. Struktur 'sehingga' memperjelas hasil yang tersirat oleh urutan klausa tanpa mengubah isi teguran.
