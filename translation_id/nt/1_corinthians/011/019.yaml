  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: id
  text: Sebab, golongan-golongan juga harus ada[a] di antara kalian, supaya mereka yang telah teruji[b] juga menjadi nyata di antara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perpecahan-perpecahan”, “kelompok-kelompok”, atau “sekte-sekte”; dalam pemakaian yang lebih kemudian, kata ini juga dapat berarti “ajaran-ajaran sesat”. Di sini kemungkinan besar yang dimaksud ialah golongan-golongan di dalam jemaat.
    reason: lexical_alternative
  - marker: b
    text: “Mereka yang telah teruji” juga dapat diterjemahkan “mereka yang terbukti tulus” atau “mereka yang mendapat pengakuan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: harus ada
  rationale: Mempertahankan pernyataan kuat tentang keharusan tanpa menentukan apakah keharusan itu bersifat ilahi, logis, atau situasional.
- source_word: γὰρ
  choice: Sebab, memang
  rationale: “Sebab” mempertahankan hubungan penjelasan dengan ayat sebelumnya; “memang” secara alami menampung daya penegasan dalam rangkaian δεῖ γὰρ καὶ.
- source_word: καὶ αἱρέσεις
  choice: golongan-golongan
  rationale: Dalam konteks ini αἱρέσεις menunjuk pada kelompok-kelompok yang memecah jemaat, bukan terutama ajaran sesat dalam pengertian teknis yang berkembang kemudian. Bentuk ulang menandai kemajemukan.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Ungkapan Indonesia yang wajar untuk sesuatu yang terdapat dalam lingkungan komunitas; “kalian” jelas bersifat jamak.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan kemungkinan nuansa tujuan maupun hasil tanpa memaksakan pembedaan yang tidak dipastikan oleh bentuk Yunani.
- source_word: καὶ οἱ δόκιμοι
  choice: mereka yang telah teruji juga
  rationale: δόκιμοι menggambarkan orang yang terbukti setelah melalui pengujian. “Telah teruji” mempertahankan unsur pengujian, sedangkan “juga” mewakili καί kedua.
- source_word: φανεροὶ γένωνται
  choice: menjadi nyata
  rationale: Menunjukkan proses menjadi tampak atau dapat dikenali secara terbuka, sesuai gabungan φανεροί dan γένωνται.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Mengulang latar komunal dan bingkai retoris teks sumber.
theological_decisions:
- issue: Makna αἱρέσεις
  choice: golongan-golongan
  alternative: perpecahan; kelompok-kelompok; sekte-sekte; ajaran-ajaran sesat
  rationale: Konteks langsung membahas pengelompokan dan perpecahan di dalam jemaat Korintus. Pilihan ini menghindari memasukkan pengertian teknis “bidat” yang berkembang kemudian, sambil mempertahankan gagasan adanya pihak-pihak yang berbeda.
- issue: Daya δεῖ (“harus”)
  choice: harus ada, tanpa menjelaskan sumber keharusan itu
  alternative: tidak terelakkan; dikehendaki Allah
  rationale: Teks menyatakan suatu keharusan tetapi tidak menjelaskan apakah itu keharusan providensial, keniscayaan praktis, atau keduanya. Ketegangan tersebut dipertahankan.
- issue: Hubungan ἵνα
  choice: supaya
  alternative: sehingga
  rationale: ἵνα dapat menyatakan tujuan atau hasil. “Supaya” mempertahankan bentuk relasinya tanpa menambahkan penjelasan tentang siapa yang menetapkan tujuan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
