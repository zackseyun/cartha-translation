id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: id
  text: Namun, saya ingin kalian mengetahui bahwa kepala setiap laki-laki adalah Mesias[a], kepala perempuan adalah laki-laki[b], dan kepala Mesias adalah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “kepala” juga dapat dipahami sebagai “sumber” atau “yang berwenang atas”; metafora Yunaninya dipertahankan dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Kata “perempuan” dan “laki-laki” di sini juga dapat dibaca sebagai “istri” dan “suami”.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Namun, saya ingin kalian mengetahui
  rationale: Ungkapan ini menyatakan maksud Paulus secara langsung. “Namun” menandai peralihan ringan, sedangkan “kalian” memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: παντὸς ἀνδρὸς
  choice: setiap laki-laki
  rationale: ἀνήρ dapat berarti laki-laki atau suami. Dalam klausa pertama, ungkapan umum “setiap laki-laki” paling sesuai dengan bentuk paralelnya dan tidak mempersempit makna menjadi hubungan perkawinan.
- source_word: κεφαλή
  choice: kepala
  rationale: Metafora Yunani dipertahankan karena maknanya dalam konteks ini diperdebatkan; menerjemahkannya langsung sebagai “sumber” atau “yang berwenang atas” akan menutup ambiguitas asli.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan “Mesias” secara konsisten dalam kedua kemunculannya.
- source_word: γυναικός
  choice: perempuan
  rationale: γυνή dapat berarti perempuan atau istri. Bentuk umum dipakai dalam teks utama, sementara kemungkinan makna perkawinan dicatat dalam catatan kaki.
- source_word: ὁ ἀνήρ
  choice: laki-laki
  rationale: ἀνήρ dapat berarti laki-laki atau suami. Padanan umum mempertahankan kesejajaran dan ambiguitas leksikal; bacaan “suami” dicatat sebagai alternatif.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku θεός dalam bahasa Indonesia untuk rujukan kepada Allah.
theological_decisions:
- issue: Makna κεφαλή dalam ketiga klausa sejajar
  choice: Mempertahankan metafora “kepala” tanpa menjelaskan maknanya di dalam teks utama.
  alternative: “sumber” atau “yang berwenang atas”
  rationale: Teks Yunani memakai metafora yang memiliki beberapa kemungkinan nuansa. Terjemahan tidak seharusnya menyelesaikan perdebatan teologis yang tidak diselesaikan secara eksplisit oleh bentuk katanya.
- issue: Apakah ἀνήρ dan γυνή berarti laki-laki/perempuan atau suami/istri
  choice: Memakai “laki-laki” dan “perempuan” dalam teks utama.
  alternative: “suami” dan “istri”
  rationale: Susunan paralel mendukung pembacaan umum, tetapi konteks dan rentang makna kedua kata memungkinkan pembacaan perkawinan; alternatif itu dipertahankan dalam catatan kaki.
- issue: Relasi dalam klausa “kepala Mesias adalah Allah”
  choice: Menerjemahkan klausa sebagaimana tertulis tanpa penjelasan doktrinal tambahan.
  alternative: Parafrasa yang membatasi relasi itu hanya pada tata fungsi atau yang menjadikannya pernyataan tentang hakikat.
  rationale: Terjemahan literal mempertahankan ketegangan teks tanpa memasukkan penjelasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menampilkan bentuk jamak ὑμᾶς secara alami; “laki-laki” dipilih alih-alih “pria” agar pasangan leksikal dengan “perempuan” tetap jelas. Struktur tiga klausa sejajar dipertahankan.
