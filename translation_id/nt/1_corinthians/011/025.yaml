  verdict: approve
  source_fidelity: Teks secara akurat mencerminkan Yunani SBLGNT. “Demikian juga” mempertahankan ὡσαύτως καί; “sesudah makan” tepat untuk μετὰ τὸ δειπνῆσαι; dan “ia mengambil cawan itu” adalah pelengkapan elipsis yang sah berdasarkan paralel ayat sebelumnya. “Perjanjian baru dalam darah-Ku” mempertahankan susunan dan ketakterjelasan teologis ἡ καινὴ διαθήκη ... ἐν τῷ ἐμῷ αἵματι tanpa menambahkan penafsiran. “Teruslah lakukan ini setiap kali kamu meminumnya” menyampaikan imperatif kini ποιεῖτε dan pengulangan dalam ὁσάκις ἐὰν πίνητε.
  naturalness: Bahasa Indonesia baku, lancar, dan bernada layak untuk teks Alkitab. “Cawan” sesuai register, dan “untuk mengenang Aku” merupakan ungkapan yang jelas serta alami untuk εἰς τὴν ἐμὴν ἀνάμνησιν. Pemakaian “meminumnya” secara idiomatis menjelaskan objek yang tersirat dari konteks cawan.
  terminology: '“Cawan,” “perjanjian baru,” “darah-Ku,” dan “mengenang Aku” konsisten dengan istilah Alkitab Indonesia modern dan setia pada istilah sumber. Kapitalisasi pronomina ilahi konsisten dengan kebiasaan penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki: tidak ada ambiguitas tekstual atau alternatif terjemahan yang perlu ditandai demi pembaca.'
