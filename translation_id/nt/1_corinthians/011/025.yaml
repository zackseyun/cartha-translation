id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: id
  text: Demikian juga, sesudah makan, ia mengambil cawan itu dan berkata, “Cawan ini adalah perjanjian baru dalam darah-Ku. Teruslah lakukan ini setiap kali kamu meminumnya, untuk mengenang Aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως καὶ τὸ ποτήριον
  choice: Demikian juga ... ia mengambil cawan itu
  rationale: ὡσαύτως καὶ menandai kesejajaran dengan tindakan atas roti pada ayat sebelumnya. Kata kerja 'mengambil' tidak tertulis dalam klausa Yunani ini, tetapi tersirat dari konstruksi eliptis dan kesejajaran tersebut; penambahannya menghasilkan bahasa Indonesia yang lengkap dan alami.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: sesudah makan
  rationale: Konstruksi μετά dengan infinitif berartikel menyatakan waktu. 'Sesudah makan' alami dalam bahasa Indonesia dan tidak mempersempitnya secara tidak perlu menjadi jenis jamuan tertentu.
- source_word: ποτήριον
  choice: cawan
  rationale: '''Cawan'' merupakan padanan Indonesia yang lazim, bermartabat, dan sesuai dengan konteks jamuan tanpa memasukkan istilah liturgis yang lebih khusus.'
- source_word: ἡ καινὴ διαθήκη
  choice: perjanjian baru
  rationale: διαθήκη di sini terutama menunjuk pada perjanjian, dengan latar belakang perjanjian yang diteguhkan oleh darah dan gema Yeremia 31.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: dalam darah-Ku
  rationale: Padanan ini mempertahankan preposisi ἐν secara dekat dan tidak menentukan apakah hubungan itu harus dijelaskan sebagai 'oleh' atau 'melalui' darah.
- source_word: τοῦτο ποιεῖτε
  choice: Teruslah lakukan ini
  rationale: Imperatif kini dapat menyatakan tindakan yang diteruskan atau diulangi; klausa berikutnya menegaskan kesempatan-kesempatan berulang itu.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: setiap kali kamu meminumnya
  rationale: Ungkapan ini menyatakan kejadian berulang yang bersyarat, yaitu setiap kali mereka minum. Akhiran '-nya' menyatakan objek yang tersirat, yakni isi cawan/cawan tersebut, secara idiomatis.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: untuk mengenang Aku
  rationale: ἀνάμνησις menunjuk pada tindakan mengingat atau memperingati. 'Untuk mengenang Aku' jelas dan alami, sambil mempertahankan arah tindakan itu kepada Yesus.
theological_decisions:
- issue: Makna διαθήκη dalam perkataan penetapan tentang cawan
  choice: perjanjian
  alternative: wasiat
  rationale: Latar belakang Alkitab tentang darah perjanjian dan perjanjian baru mendukung 'perjanjian'. 'Wasiat' dalam bahasa Indonesia modern lebih mudah dipahami sebagai pesan atau pembagian harta menjelang kematian.
- issue: Hubungan cawan, perjanjian baru, dan darah Kristus
  choice: Cawan ini adalah perjanjian baru dalam darah-Ku
  alternative: Cawan ini melambangkan perjanjian baru yang disahkan oleh darah-Ku
  rationale: Teks Yunani menyatakan identifikasi secara langsung dan tidak menjelaskan hubungan tersebut dengan kata 'melambangkan' ataupun 'disahkan'. Terjemahan mempertahankan ketegangan teologis itu tanpa menetapkan tafsir sakramental tertentu.
- issue: Daya imperatif ποιεῖτε
  choice: Teruslah lakukan ini
  alternative: Lakukanlah ini
  rationale: Bentuk imperatif kini bersama 'setiap kali' mendukung praktik yang berulang. 'Teruslah' membuat aspek itu jelas tanpa menentukan frekuensi di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Tidak ada catatan kaki karena alternatif leksikal utama dapat dijelaskan dalam keputusan penerjemahan tanpa membebani ayat.
