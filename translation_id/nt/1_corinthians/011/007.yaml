  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: id
  text: Sebab seorang laki-laki tidak sepatutnya menutupi kepalanya[a], karena ia adalah gambar dan kemuliaan Allah; tetapi perempuan adalah kemuliaan laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata-kata Yunani yang diterjemahkan “laki-laki” dan “perempuan” juga dapat berarti “suami” dan “istri”, bergantung pada konteks. Ungkapan “menutupi kepalanya” juga dapat diterjemahkan “mengenakan tudung pada kepalanya”; bahasa Yunani tidak menentukan bentuk penutupnya.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Nomina tanpa artikel ini dipahami secara generik dalam konteks pembahasan tentang laki-laki dan perempuan dalam ibadah. Makna 'suami' tetap mungkin secara leksikal dan dicatat dalam catatan kaki.
- source_word: ὀφείλει
  choice: sepatutnya
  rationale: Menyatakan kewajiban normatif secara wajar tanpa memperkerasnya menjadi perintah mutlak.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: menutupi kepalanya
  rationale: Mempertahankan ungkapan umum bahasa Yunani tanpa menentukan bahwa penutup itu harus berupa tudung atau kerudung tertentu.
- source_word: εἰκὼν
  choice: gambar
  rationale: Padanan baku yang mempertahankan kemungkinan gema bahasa penciptaan dalam Kejadian.
- source_word: δόξα
  choice: kemuliaan
  rationale: Dipakai secara konsisten pada kedua kemunculan untuk mempertahankan bobot teologis dan relasional istilah Yunani.
- source_word: ὑπάρχων
  choice: karena ia adalah
  rationale: Partisip ini menyatakan dasar bagi klausa sebelumnya; bentuk kausal tersebut alami dalam bahasa Indonesia.
- source_word: ἡ γυνὴ
  choice: perempuan
  rationale: Menyatakan kategori perempuan secara generik dalam kontras dengan laki-laki; makna 'istri' tetap mungkin dan dicatat.
- source_word: ἀνδρός
  choice: laki-laki
  rationale: Mempertahankan pengertian generik yang sejajar dengan ἀνήρ pada awal ayat tanpa mempersempitnya menjadi 'suaminya'.
theological_decisions:
- issue: Apakah ἀνήρ/γυνή diterjemahkan sebagai suami/istri atau laki-laki/perempuan
  choice: laki-laki/perempuan
  alternative: suami/istri
  rationale: Konteks langsung mengontraskan laki-laki dan perempuan dalam kaitan dengan penutup kepala dan teologi penciptaan. Pilihan utama mempertahankan cakupan representatif, sementara kemungkinan pengertian perkawinan dicatat dalam catatan kaki.
- issue: Cara mempertahankan pernyataan Paulus yang tidak simetris
  choice: perempuan adalah kemuliaan laki-laki
  alternative: perempuan mencerminkan kemuliaan laki-laki; perempuan adalah kehormatan laki-laki
  rationale: Bahasa Yunani memakai kopula langsung ἐστιν dan kata δόξα. Terjemahan ini mempertahankan ketegangan teologis teks tanpa melunakkan atau menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Istilah konkret dan teologis utama dipertahankan tanpa penjelasan tambahan dalam teks utama.
