id: 1CO.11.20
reference: 1 Corinthians 11:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: id
  text: Jadi, ketika kamu berkumpul di satu tempat, bukan Perjamuan Tuhan yang kamu makan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu tidak sedang makan Perjamuan Tuhan,” dengan penekanan bahwa perilaku mereka membuat jamuan itu tidak lagi layak disebut demikian.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: ketika kamu berkumpul
  rationale: Partisip genitif bersama ὑμῶν membentuk keterangan waktu. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pertemuan bersama.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan dari teguran sebelumnya tentang perpecahan. “Jadi” menyatakan hubungan logis itu secara jelas dan wajar.
- source_word: ἐπὶ τὸ αὐτό
  choice: di satu tempat
  rationale: Ungkapan ini menunjuk pada berkumpulnya mereka di lokasi atau pertemuan yang sama. Terjemahan ini mempertahankan nuansa tempat tanpa mengulang kata “berkumpul”.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: bukan ... yang kamu makan
  rationale: 'Konstruksi Yunani ini ringkas dan dapat dipahami secara evaluatif: perilaku mereka membuat makanan itu tidak layak disebut Perjamuan Tuhan. Susunan fokus ini alami dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan tentang kemustahilan mutlak.'
- source_word: κυριακὸν
  choice: Tuhan
  rationale: Adjektiva ini berarti milik atau berkaitan dengan Tuhan. Dalam gabungan dengan δεῖπνον, bentuk “Perjamuan Tuhan” menyampaikan hubungan tersebut secara idiomatis.
- source_word: δεῖπνον
  choice: Perjamuan
  rationale: Dalam konteks ini kata tersebut menunjuk pada jamuan bersama yang berkaitan dengan peringatan akan Yesus. “Perjamuan” merupakan istilah Indonesia yang jelas dan sesuai dengan konteks gerejawi.
- source_word: κυριακὸν δεῖπνον
  choice: Perjamuan Tuhan
  rationale: Ungkapan ini mapan dalam bahasa Indonesia dan secara tepat menyatakan jamuan yang menjadi milik atau berkaitan khusus dengan Tuhan.
theological_decisions:
- issue: Apakah Paulus menyatakan bahwa makan Perjamuan Tuhan mustahil dilakukan atau bahwa praktik mereka tidak layak disebut Perjamuan Tuhan
  choice: Perilaku mereka membuat apa yang mereka makan tidak layak disebut Perjamuan Tuhan.
  alternative: Kamu tidak sedang makan Perjamuan Tuhan.
  rationale: Ayat 21–22 menegur cara mereka menjalankan jamuan bersama, bukan menyatakan kemustahilan metafisis. Teks utama mempertahankan daya evaluatif itu, sedangkan catatan kaki menyajikan kemungkinan terjemahan langsung lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” dipakai sebagai sapaan jamak sesuai konteks surat kepada jemaat; “Perjamuan Tuhan” dipertahankan sebagai istilah yang dikenal luas.
