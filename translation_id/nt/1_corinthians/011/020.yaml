  source_fidelity: 'Teks Indonesia menerjemahkan semua unsur utama secara tepat: οὖν sebagai “Jadi,” konstruksi temporal συνερχομένων ... ὑμῶν sebagai “ketika kamu berkumpul,” ἐπὶ τὸ αὐτό sebagai “di satu tempat,” dan κυριακὸν δεῖπνον sebagai “Perjamuan Tuhan.” Susunan “bukan Perjamuan Tuhan yang kamu makan” menyampaikan dengan baik daya evaluatif οὐκ ἔστιν ... φαγεῖν dalam konteksnya: makanan mereka tidak dapat disebut Perjamuan Tuhan secara layak.'
