  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: id
  text: Namun, dalam memberikan petunjuk ini[a], aku tidak memuji kalian, sebab kalian berkumpul bukan ke arah yang lebih baik, melainkan ke arah yang lebih buruk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam memberikan perintah ini.” Kata Yunani yang digunakan dapat berarti memberikan petunjuk, arahan, atau perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Namun ... petunjuk ini
  rationale: δὲ menandai peralihan yang bernada kontras dengan pujian pada bagian sebelumnya; Τοῦτο menunjuk pada arahan yang menyusul.
- source_word: παραγγέλλων
  choice: ketika menyampaikan petunjuk
  rationale: Partisipel παραγγέλλω dapat berarti memberi petunjuk, arahan, atau perintah. Pilihan ini menyampaikan kewibawaan Paulus tanpa membuat nadanya lebih keras daripada yang dituntut konteks.
- source_word: οὐκ ἐπαινῶ
  choice: aku tidak memuji kalian
  rationale: Terjemahan langsung yang juga mempertahankan gema kontras dengan pujian Paulus dalam ayat 2.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Paulus tidak memuji mereka.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: hasilnya bukan menjadi lebih baik, melainkan lebih buruk
  rationale: εἰς dengan adjektiva komparatif berartikel menyatakan arah atau hasil. Penambahan implisit 'hasilnya' membuat ungkapan alami dalam bahasa Indonesia sambil mempertahankan kontras komparatif.
- source_word: συνέρχεσθε
  choice: ketika kalian berkumpul
  rationale: Bentuk ini dipakai secara intransitif untuk tindakan berkumpul, dalam konteks pertemuan jemaat.
theological_decisions:
- issue: Kekuatan nada παραγγέλλων
  choice: petunjuk
  alternative: perintah
  rationale: Kata Yunani dapat memuat daya perintah, tetapi konteksnya adalah arahan korektif rasuli. 'Petunjuk' mempertahankan kewibawaan tanpa mempersempit rentang maknanya secara berlebihan.
- issue: Makna εἰς τὸ κρεῖσσον ... εἰς τὸ ἧσσον
  choice: hasil pertemuan menjadi lebih baik atau lebih buruk
  alternative: mereka berkumpul dengan tujuan yang lebih baik atau lebih buruk
  rationale: Konstruksi tersebut dapat menyiratkan arah, tujuan, atau hasil. Dalam konteks teguran atas dampak pertemuan jemaat, bahasa hasil paling alami, tetapi tidak menambahkan jenis kerugian tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang lugas dan bermartabat. Pronomina 'aku/kalian' dipakai agar relasi penutur dan jemaat jelas; struktur kalimat dibuat alami tanpa menghilangkan kontras tajam antara 'lebih baik' dan 'lebih buruk'.
