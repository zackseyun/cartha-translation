base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: id
  text: 'Nilailah sendiri: pantaskah seorang perempuan berdoa kepada Allah dengan kepala yang tidak tertutup?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang istri”, jika γυνή dipahami sebagai istri berdasarkan konteks yang lebih luas dari bagian ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: sendiri
  rationale: Dalam gabungan dengan imperatif κρίνατε, frasa ini menegaskan bahwa jemaat diminta memakai penilaian mereka sendiri. “Nilailah sendiri” menyampaikan ungkapan Yunani itu secara alami dan langsung dalam bahasa Indonesia.
- source_word: κρίνατε
  choice: Nilailah
  rationale: Imperatif aoris ini menyerukan suatu penilaian atau pertimbangan. “Nilailah” mempertahankan daya perintah tanpa memberi kesan putusan hukum yang dapat muncul dari “hakimilah”.
- source_word: πρέπον ἐστὶν
  choice: pantaskah
  rationale: Ungkapan ini menanyakan apakah tindakan tersebut patut atau sesuai. Bentuk “pantaskah” ringkas, alami, dan mempertahankan sifat retoris pertanyaan.
- source_word: γυναῖκα
  choice: seorang perempuan
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Karena ayat ini tidak menyebut suami secara eksplisit dan pertanyaannya berbentuk umum, “seorang perempuan” dipakai dalam teks utama; kemungkinan arti “seorang istri” dipertahankan dalam catatan kaki.
- source_word: ἀκατακάλυπτον
  choice: dengan kepala yang tidak tertutup
  rationale: Kata sifat ini secara harfiah berarti “tidak tertutup”. Konteks dekat membahas penutup kepala, sehingga unsur kepala dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif sesudah προσεύχομαι menunjukkan pihak yang menjadi tujuan doa. “Kepada Allah” merupakan padanan Indonesia yang langsung dan lazim.
- source_word: προσεύχεσθαι
  choice: berdoa
  rationale: Infinitif ini berarti “berdoa” dan bergantung pada pertanyaan tentang kepantasan tindakan tersebut.
theological_decisions:
- issue: Makna γυνή dalam pembahasan mengenai penutup kepala
  choice: seorang perempuan
  alternative: seorang istri
  rationale: Ayat ini sendiri tidak secara eksplisit mengaitkan perempuan tersebut dengan seorang suami. Karena itu, teks utama mempertahankan pengertian umum, sedangkan kemungkinan pengertian marital dalam konteks yang lebih luas dicatat tanpa dipaksakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan retoris Yunani dipertahankan dengan perintah langsung yang diikuti pertanyaan. Istilah “kepala yang tidak tertutup” dipilih untuk kejelasan kontekstual tanpa menentukan jenis penutup tertentu.
