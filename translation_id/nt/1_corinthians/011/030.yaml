id: 1CO.11.30
reference: 1 Corinthians 11:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: id
  text: Karena itulah banyak di antara kalian yang lemah dan sakit, dan tidak sedikit yang telah tertidur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, “telah meninggal.” Paulus menggunakan “tertidur” sebagai metafora bagi kematian.
    reason: Menjelaskan makna metaforis κοιμῶνται tanpa mengganti citra teks sumber dalam teks utama.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itulah
  rationale: Ungkapan ini mempertahankan hubungan sebab yang menunjuk kembali pada penyalahgunaan Perjamuan Tuhan dalam ayat-ayat sebelumnya.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini menyatakan keadaan yang terdapat dalam komunitas Korintus, bukan keadaan di dalam diri masing-masing orang.
- source_word: πολλοὶ
  choice: banyak
  rationale: Padanan kuantitatif yang langsung, ringkas, dan alami dalam bahasa Indonesia.
- source_word: ἀσθενεῖς
  choice: lemah
  rationale: Pilihan ini mempertahankan arti kelemahan jasmani secara umum sekaligus membedakannya dari istilah berikutnya yang lebih jelas berarti sakit.
- source_word: ἄρρωστοι
  choice: sakit
  rationale: Padanan modern dan mudah dipahami untuk keadaan sakit, serta tetap membedakannya dari ἀσθενεῖς, 'lemah'.
- source_word: κοιμῶνται
  choice: telah tertidur
  rationale: Ungkapan ini mempertahankan metafora sumber tentang tidur sebagai sebutan bagi kematian. Kata 'telah' menyampaikan keadaan yang sudah terjadi dan masih relevan bagi jemaat.
- source_word: ἱκανοί
  choice: tidak sedikit
  rationale: Ungkapan Indonesia yang alami untuk jumlah yang cukup besar dan menghindari pengulangan kata 'banyak' tanpa mengurangi bobot kuantitatifnya.
theological_decisions:
- issue: Apakah κοιμῶνται harus diterjemahkan secara harfiah sebagai tidur atau dijelaskan sebagai kematian
  choice: Metafora kematian dipertahankan dalam teks utama sebagai 'telah tertidur'
  alternative: telah meninggal
  rationale: Konteks penghakiman ilahi serta urutan lemah, sakit, lalu tertidur kuat mengarah pada kematian. Namun, mempertahankan metafora Paulus menghindari penghilangan citra dan nuansa teologis teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kata ganti 'kalian' dipakai karena ὑμῖν berbentuk jamak dan merujuk kepada jemaat. Susunan kalimat mempertahankan perkembangan lemah → sakit → meninggal serta nada serius pernyataan Paulus.
