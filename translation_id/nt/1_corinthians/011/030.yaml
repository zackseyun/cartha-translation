  source_fidelity: Teks Indonesia secara akurat mempertahankan hubungan sebab-akibat διὰ τοῦτο, lokasi komunal ἐν ὑμῖν, serta perkembangan ἀσθενεῖς → ἄρρωστοι → κοιμῶνται. “Telah tertidur” dengan tepat mempertahankan metafora kematian dalam κοιμῶνται, sedangkan catatan kaki menjelaskan maknanya tanpa menggantikannya dalam teks utama. “Tidak sedikit” menyampaikan ἱκανοί sebagai jumlah yang berarti dan menghindari pengulangan “banyak.”
