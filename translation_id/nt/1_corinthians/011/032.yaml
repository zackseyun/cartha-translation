base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: id
  text: Namun, ketika kita dihakimi oleh Tuhan[a], kita dididik supaya kita tidak dihukum bersama dengan dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika kita dihakimi oleh Tuhan, kita sedang dididik.” Bentuk-bentuk kini dalam bahasa Yunani dapat menekankan tindakan yang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: ketika kita dihakimi
  rationale: Partisipel kini pasif dipahami secara temporal dalam konteks. “Dihakimi” mempertahankan nuansa yudisial tanpa menyamakannya dengan penghukuman akhir pada κατακριθῶμεν.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan peringatan pada ayat sebelumnya dan terdengar wajar serta bermartabat dalam bahasa Indonesia modern.
- source_word: ὑπὸ κυρίου
  choice: oleh Tuhan
  rationale: ὑπό dengan genitif menyatakan pelaku. “Tuhan” mempertahankan gelar κύριος tanpa menambahkan “Yesus,” yang tidak dinyatakan secara eksplisit dalam frasa ini.
- source_word: παιδευόμεθα
  choice: kita didisiplinkan
  rationale: Dalam konteks penghakiman ilahi yang bersifat korektif, pilihan ini mencakup pembinaan melalui koreksi dan tidak memberi kesan hukuman yang semata-mata retributif.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Mengungkapkan tujuan atau hasil yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: σὺν τῷ κόσμῳ
  choice: bersama dengan dunia
  rationale: Mempertahankan gagasan penyertaan dalam nasib yang sama; “dunia” mewakili dunia secara kolektif dalam konteks penghakiman.
- source_word: κατακριθῶμεν
  choice: kita tidak dihukum
  rationale: “Dihukum” menyampaikan putusan yang merugikan atau penghukuman, sekaligus membedakannya dari κρινόμενοι, “dihakimi.” Susunan ini alami dalam bahasa Indonesia dan tetap membuka cakupan tepat penghukuman menurut konteks.
theological_decisions:
- issue: Hubungan antara penghakiman Tuhan sekarang dan penghukuman bersama dunia
  choice: Ayat membedakan tindakan Tuhan yang mendisiplinkan melalui penghakiman dari penghukuman yang dialami bersama dunia.
  alternative: Ayat dapat dibaca lebih umum sebagai hukuman sementara tanpa penegasan khusus mengenai pembedaan antara orang percaya dan dunia pada penghakiman akhir.
  rationale: Kontras leksikal antara κρίνω dan κατακρίνω, disertai παιδεύω dan klausa tujuan ἵνα μὴ, mendukung sifat korektif dari tindakan pertama dan pencegahan penghukuman pada tindakan kedua. Terjemahan tidak menentukan sistem doktrinal mengenai ketekunan atau kemanjuran sakramental.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. “Didisiplinkan” dipilih untuk menonjolkan koreksi yang mendidik; “dihukum” dibedakan dari “dihakimi” agar kontras kata Yunani tetap tampak. Penanda catatan kaki [a] dicantumkan dalam teks utama.
