id: 1CO.11.2
reference: 1 Corinthians 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: id
  text: Aku memuji kalian karena dalam segala hal kalian mengingat aku dan berpegang teguh pada tradisi-tradisi sebagaimana telah kusampaikan kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran-ajaran” atau “petunjuk-petunjuk”; dalam bahasa Yunani, “tradisi-tradisi,” yaitu hal-hal yang diteruskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Aku memuji
  rationale: Padanan langsung yang mempertahankan nada positif Paulus.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan; dalam bahasa Indonesia hubungan wacananya sudah alami tanpa kata penghubung tambahan.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Menunjukkan objek orang kedua jamak secara jelas dalam bahasa Indonesia modern.
- source_word: ὅτι
  choice: karena
  rationale: Mengungkapkan alasan bagi pujian Paulus.
- source_word: πάντα μου μέμνησθε
  choice: dalam segala hal kalian mengingat aku
  rationale: Mempertahankan cakupan luas πάντα dan arti berkelanjutan dari tindakan mengingat, tanpa mengubahnya menjadi keterangan waktu.
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: sebagaimana telah kusampaikan kepada kalian
  rationale: Menyatakan kesesuaian antara apa yang Paulus teruskan dan apa yang jemaat pertahankan; 'telah kusampaikan' alami sekaligus menjaga gagasan penyerahan ajaran.
- source_word: τὰς παραδόσεις
  choice: tradisi-tradisi
  rationale: Menjaga makna leksikal tentang hal-hal yang diteruskan serta bentuk jamaknya, tanpa membatasinya hanya pada ajaran atau petunjuk.
- source_word: κατέχετε
  choice: berpegang teguh pada
  rationale: Menyampaikan makna mempertahankan dan menaati secara aktif dalam ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Makna παραδόσεις dalam konteks jemaat
  choice: tradisi-tradisi
  alternative: ajaran-ajaran; petunjuk-petunjuk
  rationale: Pilihan ini mempertahankan kategori apostolik berupa hal-hal yang diteruskan Paulus, tanpa memasukkan klaim denominasi kemudian mengenai tradisi.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pronomina 'aku/kalian' dipakai untuk membedakan bentuk tunggal dan jamak secara alami; bentuk ulang 'tradisi-tradisi' mempertahankan jamak Yunani.
