  source_fidelity: Terjemahan dengan setia mencerminkan Ἐπαινῶ ... ὑμᾶς, alasan yang diperkenalkan ὅτι, cakupan πάντα, serta hubungan perbandingan καθὼς. “Dalam segala hal kalian mengingat aku” mempertahankan cakupan luas πάντα dan tidak menggesernya menjadi “selalu.” “Berpegang teguh pada” sesuai dengan κατέχετε, sedangkan “sebagaimana telah kusampaikan” secara wajar menyatakan παρέδωκα ὑμῖν.
  naturalness: Bahasa Indonesia baku modern dan lancar. Pengulangan “tradisi-tradisi” merupakan cara yang sah untuk menandai bentuk jamak dan tetap dapat dipahami secara alami dalam register ini. Pronomina “aku/kalian” konsisten dan dengan jelas membedakan pembicara tunggal dari penerima jamak.
  terminology: “Tradisi-tradisi” mempertahankan istilah παραδόσεις dan gagasan sesuatu yang diteruskan, tanpa mereduksinya menjadi sekadar ajaran atau memasukkan klaim teologis kemudian. Catatan kaki menyediakan alternatif leksikal yang tepat dan menjelaskan arti dasar istilah tersebut secara netral.
