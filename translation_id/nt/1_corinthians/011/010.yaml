  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: id
  text: Karena itu, perempuan patut mempunyai kewenangan di atas kepalanya[a] karena para malaikat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “patut mengenakan tanda kewenangan di atas kepalanya.” Teks Yunani hanya menyebut “kewenangan” dan tidak secara eksplisit memuat kata “tanda” atau “penutup kepala”.
    reason: alternative_reading
  - marker: b
    text: Atau “para utusan”, meskipun “para malaikat” lebih mungkin dimaksudkan di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Penghubung ini secara alami menyampaikan kesimpulan yang ditarik dari uraian sebelumnya.
- source_word: ὀφείλει
  choice: harus
  rationale: Menyatakan kewajiban atau kepatutan yang kuat dalam bahasa Indonesia tanpa menambahkan gagasan hukum yang tidak dinyatakan teks.
- source_word: ἡ γυνὴ
  choice: perempuan
  rationale: Mempertahankan pengertian tunggal generik dalam pembahasan yang lebih luas tentang laki-laki dan perempuan; konteks tidak mengharuskan arti 'istri'.
- source_word: ἐξουσίαν
  choice: kewenangan
  rationale: Menerjemahkan nomina Yunani secara langsung tanpa menyisipkan 'tanda' atau 'penutup kepala', yang tidak tertulis eksplisit.
- source_word: ἔχειν
  choice: mempunyai
  rationale: Padanan langsung bagi verba 'mempunyai'; 'mengenakan' akan memasukkan penafsiran tentang penutup kepala.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: atas kepalanya
  rationale: Mempertahankan ungkapan spasial yang luas dan tidak menentukan secara eksplisit apa hubungan kewenangan itu dengan kepala.
- source_word: διὰ τοὺς ἀγγέλους
  choice: karena para malaikat
  rationale: διά dengan akusatif menyatakan alasan, sedangkan arti normal ἄγγελοι dalam konteks ini adalah makhluk surgawi, meski arti 'utusan' tetap mungkin secara leksikal.
theological_decisions:
- issue: Makna ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Mempertahankan bentuk 'mempunyai kewenangan atas kepalanya'.
  alternative: harus mengenakan tanda kewenangan di kepalanya; harus memakai penutup kepala sebagai tanda kewenangan
  rationale: Teks Yunani tidak memuat kata 'tanda' atau 'penutup'. Karena ungkapan ini diperdebatkan, teks utama mempertahankan ketegangan dan catatan kaki memberikan penafsiran yang umum.
- issue: Rujukan ἀγγέλους
  choice: para malaikat
  alternative: para utusan
  rationale: ἄγγελος dapat berarti 'malaikat' atau 'utusan', tetapi bentuk jamak tanpa penjelas dalam konteks Paulus lebih mungkin menunjuk kepada makhluk surgawi. Terjemahan tidak menetapkan teori tertentu mengenai alasan mereka disebut.
- issue: Cakupan γυνή
  choice: perempuan
  alternative: istri
  rationale: Pembahasan langsung mencakup relasi laki-laki dan perempuan secara representatif, sehingga terjemahan tidak mempersempitnya menjadi hubungan suami-istri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami, tetapi ungkapan sulit dalam teks sumber tidak diperjelas secara berlebihan. Semua penanda catatan kaki dicantumkan dalam teks utama.
