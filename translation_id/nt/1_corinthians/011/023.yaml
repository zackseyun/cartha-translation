  naturalness: Susunan “aku telah menerima dari Tuhan apa yang juga telah kusampaikan kepadamu” lebih jelas dan alami, serta menghindari ambiguitas cakupan “juga” dalam draf. Tanda titik dua memperkenalkan isi tradisi dengan lancar tanpa frasa “yaitu bahwa” yang agak berat.
  terminology: “Tuhan” untuk κύριος, “menerima” untuk παρέλαβον, “menyampaikan” untuk παρέδωκα, dan “diserahkan” untuk παραδίδωμι dipertahankan. Catatan kaki tetap menyediakan pembacaan tradisional “dikhianati.”
