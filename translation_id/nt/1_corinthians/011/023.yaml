  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: id
  text: 'Sebab aku telah menerima dari Tuhan apa yang juga telah kusampaikan kepadamu: Tuhan Yesus, pada malam ketika Ia sedang diserahkan[a], mengambil roti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “ketika Ia dikhianati.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: telah kuterima
  rationale: Menyatakan bahwa Paulus menerima ajaran atau tradisi ini, sekaligus mempertahankan pasangan konseptual dengan παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: dari Tuhan
  rationale: Mempertahankan sumber yang dinyatakan teks Yunani tanpa memperluasnya menjadi 'Tuhan Yesus'; klausa berikutnya memberi identifikasi tersebut.
- source_word: παρέδωκα
  choice: telah kusampaikan
  rationale: '''Menyampaikan'' alami dalam bahasa Indonesia untuk meneruskan ajaran atau tradisi, dan tidak menyamakan bentuknya dengan παρεδίδετο yang muncul kemudian.'
- source_word: ὅτι
  choice: yaitu bahwa
  rationale: Secara alami memperkenalkan isi yang diterima dan disampaikan Paulus.
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan daya penghormatan dan kristologis κύριος dalam pemakaian Perjanjian Baru.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: pada malam ketika
  rationale: Ungkapan temporal yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: παρεδίδετο
  choice: Ia diserahkan
  rationale: Bentuk pasif ini mempertahankan cakupan makna 'diserahkan' tanpa membatasi pelakunya atau menafsirkan tindakan itu semata-mata sebagai pengkhianatan. Aspek imperfek Yunani tidak perlu dipaksakan menjadi 'sedang diserahkan' karena terdengar kurang alami dalam konteks ini.
- source_word: ἔλαβεν ἄρτον
  choice: mengambil roti
  rationale: Padanan langsung dan alami; bentuk tanpa artikel tidak mengharuskan penambahan 'sepotong' atau 'sebuah roti'.
theological_decisions:
- issue: Makna παρεδίδετο dalam kisah penetapan Perjamuan Tuhan
  choice: Ia diserahkan
  alternative: Ia dikhianati
  rationale: παραδίδωμι dapat berarti menyerahkan, diserahkan, atau—dalam konteks tertentu—mengkhianati. Teks utama memakai padanan yang lebih luas agar ketegangan antara tindakan manusia dan kerangka penderitaan Yesus tidak diselesaikan secara sempit; terjemahan tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat 'kuterima' dan 'kusampaikan' menjaga kelancaran serta hubungan retoris kedua verba. Pronomina untuk Yesus ditulis 'Ia' sesuai kebiasaan penerbitan Alkitab Indonesia.
