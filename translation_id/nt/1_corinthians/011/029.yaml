  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. Susunan “makan dan minum tanpa membedakan tubuh itu, mendatangkan penghakiman atas dirinya sendiri” jelas dan idiomatis.
  terminology: “Penghakiman” tepat untuk κρίμα dan tidak memaksakan makna penghukuman akhir. “Tubuh itu” mempertahankan bentuk singkat serta ambiguitas tekstual dan kontekstual dari τὸ σῶμα. Catatan alternatif diperbaiki agar tidak menyebut “tubuh Tuhan” sebagai salah satu rujukan tafsir utama, sebab itu mencampurkan varian tekstual dengan penafsiran.
  issues:
