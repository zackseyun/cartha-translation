    rationale: Ungkapan tersebut menonjolkan pemahaman, sedangkan διακρίνων secara leksikal menyatakan pembedaan, penilaian, atau pengenalan yang tepat. “Tanpa membedakan tubuh itu” lebih dekat dengan bentuk dan keluasan makna Yunani.
  - severity: low
    issue: Catatan b menyatakan “makna tubuh Tuhan dalam Perjamuan Tuhan.”
    rationale: Frasa ini dapat mengaburkan perbedaan antara varian “tubuh Tuhan” yang telah dicatat pada catatan a dan ambiguitas rujukan “tubuh” dalam teks utama. Catatan sebaiknya menjelaskan makna Perjamuan Tuhan tanpa memasukkan “tubuh Tuhan” ke dalam parafrasa tafsir.
