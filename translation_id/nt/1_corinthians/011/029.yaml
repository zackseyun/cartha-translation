revisions:
- from: Sebab orang yang makan dan minum mendatangkan penghakiman atas dirinya sendiri jika ia tidak memahami tubuh itu dengan semestinya.[a][b]
  to: Sebab orang yang makan dan minum tanpa membedakan tubuh itu, mendatangkan penghakiman atas dirinya sendiri.[a][b]
  rationale: 'Revisi mengganti parafrasa “tidak memahami ... dengan semestinya” dengan “tanpa membedakan tubuh itu” untuk mencerminkan διακρίνων secara lebih langsung dan tetap membiarkan objek “tubuh itu” terbuka. Susunan kalimat diubah secara idiomatis tanpa mengubah hubungan makna: orang yang makan dan minum dalam keadaan tidak membedakan tubuh itu mendatangkan penghakiman atas dirinya sendiri. Catatan b juga dirumuskan ulang agar ambiguitas Paulus dipertahankan dan varian tekstual tidak tercampur dengan penafsiran.'
