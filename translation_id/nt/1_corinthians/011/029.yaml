  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: id
  text: Sebab orang yang makan dan minum tanpa membedakan tubuh itu, mendatangkan penghakiman atas dirinya sendiri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “tubuh Tuhan” alih-alih “tubuh itu”.
    reason: textual_variant
  - marker: b
    text: Atau, “tanpa membedakan tubuh itu”. Hal ini mungkin merujuk pada pengenalan akan makna Perjamuan Tuhan, jemaat yang berhimpun sebagai tubuh Kristus, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: penghakiman
  rationale: Kata ini menunjuk pada putusan atau tindakan menghakimi. 'Penghakiman' cukup luas dan, sesuai konteks ayat 30–32, tidak menyiratkan secara khusus penghukuman kekal.
- source_word: ἑαυτῷ
  choice: atas dirinya sendiri
  rationale: Dativus refleksif menunjukkan bahwa orang yang makan dan minum itu mendatangkan akibat penghakiman atas dirinya sendiri.
- source_word: διακρίνων
  choice: memahami ... dengan semestinya
  rationale: Dalam konteks ini kata tersebut menyatakan penilaian atau pengenalan yang tepat. Ungkapan ini alami dalam bahasa Indonesia sekaligus tidak menentukan secara sempit apakah tekanannya pada mengenali, membedakan, atau menilai dengan benar.
- source_word: τὸ σῶμα
  choice: tubuh itu
  rationale: Teks SBLGNT hanya memuat 'tubuh', tanpa 'Tuhan'. Bentuk ini mempertahankan kemungkinan rujukan kepada tubuh Kristus dalam perjamuan, jemaat sebagai tubuh Kristus, atau keduanya.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: orang yang makan dan minum
  rationale: Partisip substantival tunggal ini bersifat umum dan secara alami diterjemahkan sebagai 'orang yang' dalam bahasa Indonesia.
- source_word: μὴ διακρίνων
  choice: jika ia tidak memahami ... dengan semestinya
  rationale: 'Klausa bersyarat mengungkapkan hubungan logis partisip dengan jelas dan alami: penghakiman didatangkan ketika tubuh tidak dipahami atau dinilai dengan semestinya.'
theological_decisions:
- issue: Makna 'tubuh itu' dalam konteks Perjamuan Tuhan
  choice: Mempertahankan ungkapan ambigu 'tubuh itu' tanpa menentukan rujukannya.
  alternative: tubuh Tuhan; tubuh orang-orang percaya
  rationale: Teks Yunani hanya mengatakan 'tubuh'. Konteks mencakup baik makna perjamuan yang berkaitan dengan Yesus maupun perlakuan jemaat terhadap sesama, sehingga ambiguitas teologisnya perlu dipertahankan.
- issue: Daya makna κρίμα
  choice: penghakiman
  alternative: penghukuman
  rationale: Ayat 32 membedakan didikan atau penghakiman yang dialami jemaat dari penghukuman bersama dunia. Karena itu, 'penghakiman' tidak berlebihan dengan menyiratkan kebinasaan akhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Pengulangan unsur makan dan minum dipertahankan, tetapi konstruksi Yunani 'makan dan minum penghakiman' diungkapkan secara idiomatis sebagai 'mendatangkan penghakiman'. Semua penanda catatan kaki dicantumkan dalam teks utama.
