  source_fidelity: Terjemahan dengan setia mencerminkan pertanyaan retoris, kontras antara rumah pribadi dan jemaat Allah, serta teguran Paulus. “Mereka yang tidak punya apa-apa” mempertahankan objek yang tidak dinyatakan dalam τοὺς μὴ ἔχοντας dan tidak secara prematur menyempitkannya menjadi “orang miskin” atau “mereka yang tidak punya makanan.” Pengulangan “memuji” dengan tepat mencerminkan ἐπαινέσω/ἐπαινῶ.
  naturalness: Bahasa Indonesia baku, modern, dan lugas. “Memandang rendah,” “mempermalukan,” dan “Dalam hal ini” terdengar alami serta sesuai dengan register teguran apostolik. Pemakaian “kamu” dapat berfungsi secara jamak dalam konteks ini dan tidak mengaburkan sasaran kolektifnya.
  terminology: “Jemaat Allah” merupakan padanan yang tepat dan mapan untuk ἐκκλησίας τοῦ θεοῦ dalam konteks komunitas umat, tanpa mengarah pada bangunan atau lembaga semata. Pilihan istilah tidak memaksakan penafsiran teologis tertentu.
