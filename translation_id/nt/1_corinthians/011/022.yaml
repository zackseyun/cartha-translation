id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: id
  text: Bukankah kamu mempunyai rumah untuk makan dan minum? Atau apakah kamu memandang rendah jemaat Allah dan mempermalukan mereka yang tidak punya apa-apa[a]? Apa yang harus kukatakan kepadamu? Haruskah aku memuji kamu? Dalam hal ini, aku tidak memuji kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang miskin” atau “mereka yang tidak mempunyai makanan”; secara harfiah dalam bahasa Yunani, “mereka yang tidak mempunyai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: rumah
  rationale: Menunjuk pada tempat tinggal pribadi, sebagai kontras dengan jemaat yang sedang berkumpul; bentuk Indonesia tidak perlu menandai jamak secara eksplisit.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: untuk makan dan minum
  rationale: Menjaga fungsi tujuan dari konstruksi preposisi dengan infinitif substantival dan tetap alami dalam bahasa Indonesia.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: jemaat Allah
  rationale: Dalam konteks Paulus, ungkapan ini menunjuk pada umat milik Allah, khususnya komunitas yang berkumpul, tanpa menyempitkannya menjadi gedung atau lembaga.
- source_word: καταφρονεῖτε
  choice: memandang rendah
  rationale: Menyampaikan tindakan menganggap remeh atau tidak bernilai dalam ungkapan Indonesia modern, dengan ketajaman teguran tetap terpelihara.
- source_word: καταισχύνετε
  choice: mempermalukan
  rationale: Secara langsung menyatakan tindakan yang menyebabkan orang lain menanggung malu.
- source_word: τοὺς μὴ ἔχοντας
  choice: mereka yang tidak punya apa-apa
  rationale: Mempertahankan ungkapan Yunani yang tidak menyebut objek secara eksplisit dan tidak langsung menyempitkannya menjadi label sosial tertentu.
- source_word: τί εἴπω ὑμῖν;
  choice: Apa yang harus kukatakan kepadamu?
  rationale: Mengungkapkan pertanyaan deliberatif dan teguran retoris secara alami dalam bahasa Indonesia.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Haruskah aku memuji kamu?
  rationale: Mempertahankan bentuk pertanyaan deliberatif serta ironi dengan jawaban negatif yang tersirat.
- source_word: ἐν τούτῳ
  choice: Dalam hal ini
  rationale: Menunjuk pada perkara yang baru dibahas tanpa memperluas rujukannya.
- source_word: οὐκ ἐπαινῶ
  choice: aku tidak memuji kamu
  rationale: Mengulang padanan yang sama untuk ἐπαινέω agar pola retoris teks sumber tetap tampak.
theological_decisions:
- issue: Rujukan τοὺς μὴ ἔχοντας dalam konteks perjamuan jemaat
  choice: mereka yang tidak punya apa-apa
  alternative: orang miskin; mereka yang tidak mempunyai makanan
  rationale: Konteks kuat mengarah kepada anggota jemaat yang kekurangan makanan atau sumber daya, tetapi teks Yunani hanya mengatakan 'mereka yang tidak mempunyai'. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti orang pertama tunggal memakai bentuk terikat “ku-” agar wajar dan bermartabat; “kamu” dipahami sebagai jamak berdasarkan konteks Yunani. “Jemaat Allah” dipilih untuk menegaskan komunitas umat, bukan bangunan.
