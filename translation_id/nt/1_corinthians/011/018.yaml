  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: id
  text: Sebab pertama-tama, ketika kalian berkumpul sebagai jemaat[a], aku mendengar bahwa ada perpecahan di antara kalian, dan sampai taraf tertentu aku memercayainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam pertemuan jemaat.” Kata Yunani di sini menunjuk pada jemaat yang sedang berkumpul, bukan secara khusus pada sebuah gedung.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: Sebab pertama-tama
  rationale: “Sebab” mempertahankan fungsi γάρ yang menghubungkan penjelasan ini dengan konteks sebelumnya, sedangkan “pertama-tama” menyampaikan fungsi wacana πρῶτον μὲν tanpa mengharuskan adanya pasangan formal “kemudian”.
- source_word: συνερχομένων ὑμῶν
  choice: ketika kalian berkumpul
  rationale: Genitif absolut dipahami secara temporal. “Kalian” memperjelas bahwa ὑμῶν berbentuk jamak, dan “berkumpul” wajar dalam konteks pertemuan jemaat.
- source_word: ἐν ἐκκλησίᾳ
  choice: sebagai jemaat
  rationale: Dalam konteks ini ἐκκλησία menunjuk pada umat yang berkumpul, bukan gedung. “Sebagai jemaat” menyampaikan sifat pertemuan tersebut secara alami dalam bahasa Indonesia.
- source_word: ἀκούω
  choice: aku mendengar
  rationale: Bentuk kini Yunani dipertahankan secara langsung dan menyatakan bahwa Paulus memperoleh informasi melalui laporan.
- source_word: σχίσματα
  choice: perpecahan
  rationale: Kata ini menyatakan keretakan atau pembelahan dalam komunitas; “perpecahan” merupakan padanan Indonesia yang jelas tanpa mengharuskan adanya kelompok formal.
- source_word: ὑπάρχειν
  choice: ada
  rationale: Dalam konstruksi ini kata tersebut menyatakan keberadaan perpecahan. “Ada” lebih alami daripada padanan harfiah seperti “eksis”.
- source_word: καὶ μέρος τι
  choice: dan sampai taraf tertentu
  rationale: Frasa ini membatasi kadar kepercayaan Paulus terhadap laporan itu. Ungkapan tersebut alami dan mempertahankan nuansa penerimaan yang tidak penuh.
- source_word: πιστεύω
  choice: aku memercayainya
  rationale: Akhiran “-nya” secara wajar menyatakan objek tersirat, yaitu laporan mengenai perpecahan, tanpa menambahkan gagasan baru.
theological_decisions:
- issue: Makna ἐκκλησία dalam konteks
  choice: jemaat yang sedang berkumpul
  alternative: gedung gereja atau lembaga gerejawi
  rationale: Konteks membicarakan tindakan umat Korintus berkumpul, khususnya untuk perjamuan bersama. Terjemahan ini tidak mengimpor pengertian gedung yang tidak dinyatakan oleh teks.
- issue: Batas penerimaan Paulus terhadap laporan
  choice: Paulus memercayai laporan itu sampai taraf tertentu
  alternative: Paulus memercayai hanya sebagian tertentu dari isi laporan
  rationale: μέρος τι dapat menyatakan pembatasan kadar atau bagian. Teks utama memakai ungkapan yang alami dan tetap menunjukkan penerimaan terbatas tanpa menjelaskan secara berlebihan bagian mana atau seberapa besar yang dipercayai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak sapaan Paulus, sedangkan “sebagai jemaat” menghindari kesan bahwa yang dimaksud ialah gedung.
