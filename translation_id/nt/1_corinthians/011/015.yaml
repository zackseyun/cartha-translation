base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: id
  text: Sedangkan jika seorang perempuan[a] berambut panjang, itu adalah kemuliaan baginya? Sebab rambutnya telah diberikan kepadanya sebagai pengganti penutup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri”. Kata Yunani yang digunakan dapat berarti “perempuan” atau “istri”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai penutup”. Preposisi Yunani yang digunakan dapat menyatakan korespondensi atau penggantian; frasa ini sendiri tidak memastikan apakah Paulus bermaksud bahwa rambut berfungsi sebagai penutup itu atau diberikan dalam hubungan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: seorang perempuan
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Pernyataan ini bersifat umum, sehingga “perempuan” paling sesuai, sementara kemungkinan “istri” dicatat dalam catatan kaki.
- source_word: κομᾷ
  choice: berambut panjang
  rationale: κομάω berarti memiliki atau mengenakan rambut panjang. “Berambut panjang” ringkas, alami, dan mempertahankan nuansa keadaan.
- source_word: δόξα
  choice: kemuliaan
  rationale: δόξα di sini menunjuk pada sesuatu yang mendatangkan kehormatan atau menjadi kebanggaan. “Kemuliaan” mempertahankan daya retoris dan hubungan leksikal istilah tersebut.
- source_word: κόμη
  choice: rambutnya
  rationale: κόμη berarti rambut kepala, sering dengan nuansa rambut yang dibiarkan panjang. Karena gagasan panjang sudah dinyatakan oleh κομᾷ, “rambutnya” menghindari pengulangan yang tidak perlu.
- source_word: ἀντί
  choice: sebagai pengganti
  rationale: ἀντί lazimnya menyatakan penggantian atau korespondensi. “Sebagai pengganti” mempertahankan daya substitutifnya, sedangkan kemungkinan nuansa korespondensi dijelaskan dalam catatan kaki.
- source_word: περιβολαίου
  choice: penutup
  rationale: περιβόλαιον adalah istilah umum bagi sesuatu yang dikenakan mengelilingi atau sebagai penutup. “Penutup” tidak mempersempit maknanya menjadi kerudung atau selubung tertentu.
- source_word: δέδοται
  choice: telah diberikan kepadanya
  rationale: Bentuk perfek pasif menyatakan tindakan pemberian yang menghasilkan keadaan yang masih berlaku. “Telah diberikan kepadanya” mempertahankan bentuk pasif dan nuansa hasil tersebut.
theological_decisions:
- issue: Apakah περιβόλαιον secara khusus berarti kerudung sehingga rambut perempuan itu sendiri diidentifikasi sebagai penutup kepala yang diwajibkan dalam perikop ini.
  choice: Menerjemahkannya secara umum sebagai “penutup” tanpa menyelesaikan perdebatan penafsiran dalam teks utama.
  alternative: “kerudung” atau “selubung”
  rationale: Kata Yunani tersebut lebih luas daripada “kerudung”. Pilihan “penutup” mempertahankan data leksikal dan tidak memaksakan kesimpulan tentang apakah yang dimaksud ialah kain penutup, penutup kepala secara umum, atau hubungan antara rambut alami dan penutup tambahan.
- issue: Hubungan yang dinyatakan oleh ἀντί antara rambut dan penutup.
  choice: Menggunakan “sebagai pengganti” dalam teks utama sambil mencatat bahwa preposisi itu juga dapat menyatakan korespondensi.
  alternative: “sebagai penutup”
  rationale: Makna substitusi merupakan daya biasa ἀντί, tetapi frasa ini sendiri tidak sepenuhnya menuntaskan apakah rambut berfungsi sebagai penutup itu atau diberikan dalam hubungan yang sepadan dengannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang wajar dan bermartabat. Kata penghubung “sedangkan” mempertahankan δέ dan menunjukkan bahwa ayat ini melanjutkan pertanyaan retoris yang dimulai pada ayat sebelumnya; tanda tanya mengikuti tanda baca sumber Yunani. Istilah umum “penutup” dipilih untuk menjaga keluasan makna dan ketegangan penafsiran.
