  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: id
  text: Karena itu, siapa pun yang makan roti atau minum dari cawan Tuhan dengan cara yang tidak layak[a] akan bersalah terhadap tubuh dan darah Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dengan cara yang tidak layak” menerjemahkan sebuah kata keterangan yang menjelaskan cara orang makan atau minum, bukan kelayakan pribadi orang itu pada dirinya.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “akan bersalah atas tubuh dan darah Tuhan.” Konstruksi Yunani menyatakan kesalahan atau pertanggungjawaban berkenaan dengan tubuh dan darah Tuhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya tentang Perjamuan Tuhan.
- source_word: ὃς ἂν
  choice: siapa pun yang
  rationale: Gabungan pronomina relatif dan ἄν menyatakan cakupan umum atau tak tentu.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: makan roti
  rationale: Bentuk kini subjungtif dalam pernyataan umum wajar diterjemahkan dengan bentuk verba biasa; roti yang dimaksud sudah jelas dari konteks.
- source_word: ἢ
  choice: atau
  rationale: Mempertahankan konjungsi disjungtif Yunani dan menunjukkan bahwa peringatan berlaku pada salah satu tindakan tersebut.
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: minum dari cawan Tuhan
  rationale: Secara harfiah objeknya ialah 'cawan', suatu metonimia untuk isinya; dalam bahasa Indonesia, 'minum dari cawan' lebih alami tanpa menghilangkan gambaran sumber.
- source_word: ἀναξίως
  choice: dengan cara yang tidak layak
  rationale: Adverbia ini menerangkan cara makan atau minum, bukan menyatakan bahwa orang itu pada dirinya tidak layak.
- source_word: ἔνοχος ἔσται
  choice: akan bersalah
  rationale: Menyampaikan kesalahan sekaligus pertanggungjawaban yang terkandung dalam ungkapan Yunani.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: terhadap tubuh dan darah Tuhan
  rationale: Genitif sesudah ἔνοχος menyatakan pihak atau perkara yang berkenaan dengannya seseorang bersalah; 'terhadap' alami dalam bahasa Indonesia dan tidak merinci mekanisme kesalahan lebih jauh dari teks.
theological_decisions:
- issue: Makna ἀναξίως dalam kaitannya dengan Perjamuan Tuhan
  choice: Ayat ini mengecam cara makan atau minum yang tidak layak.
  alternative: Ayat ini menyatakan bahwa orang yang mengambil bagian itu sendiri tidak layak.
  rationale: ἀναξίως adalah adverbia yang menerangkan ἐσθίῃ dan πίνῃ. Terjemahan tidak boleh mengubah keterangan cara menjadi penilaian tentang kelayakan hakiki orang tersebut.
- issue: Daya ἢ di antara makan dan minum
  choice: Peringatan berlaku bila salah satu tindakan dilakukan dengan cara yang tidak layak.
  alternative: Kedua tindakan diperlakukan sebagai pasangan tetap sehingga diterjemahkan 'dan'.
  rationale: Sumber Yunani memakai konjungsi disjungtif ἢ ('atau'), yang perlu dipertahankan meskipun beberapa tradisi penerjemahan memakai 'dan'.
- issue: Hubungan ἔνοχος dengan tubuh dan darah Tuhan
  choice: Diterjemahkan 'bersalah terhadap tubuh dan darah Tuhan'.
  alternative: Diterjemahkan lebih harfiah 'bersalah atas tubuh dan darah Tuhan' atau lebih interpretatif 'bertanggung jawab karena menodai tubuh dan darah Tuhan'.
  rationale: Ungkapan 'terhadap' menjaga kesungguhan pertanggungjawaban sambil tidak menentukan secara berlebihan sifat tepat kesalahan yang dinyatakan oleh konstruksi genitif.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. 'Perjamuan Tuhan' tidak ditambahkan ke dalam ayat karena tidak hadir secara eksplisit di sini. Frasa 'minum dari cawan' dipilih sebagai ungkapan Indonesia yang alami untuk metonimia Yunani 'minum cawan'.
