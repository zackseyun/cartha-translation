  terminology: “Tuhan,” “tubuh,” “darah,” dan “cawan” konsisten dengan konteks dan terminologi Kristen Indonesia yang umum. Catatan a secara tepat menjelaskan fungsi adverbial ἀναξίως. Catatan b menyajikan alternatif yang lebih harfiah serta menjelaskan nuansa konstruksi Yunani tanpa mengunci satu penafsiran mekanisme kesalahan.
