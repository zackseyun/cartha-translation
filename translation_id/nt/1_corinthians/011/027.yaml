  verdict: approve
  source_fidelity: Terjemahan dengan tepat mempertahankan hubungan inferensial Ὥστε (“Karena itu”), cakupan umum ὃς ἂν (“siapa pun yang”), serta disjungsi ἢ (“atau”). Frasa “dengan cara yang tidak layak” dengan benar menerjemahkan ἀναξίως sebagai keterangan cara, bukan penilaian atas kelayakan pribadi. “Akan bersalah terhadap tubuh dan darah Tuhan” mempertahankan cakupan genitif sesudah ἔνοχος tanpa memaksakan penjelasan teologis yang lebih khusus. “Minum dari cawan Tuhan” adalah pengungkapan Indonesia yang alami bagi metonimia Yunani, meskipun sedikit lebih eksplisit daripada bentuk harfiahnya.
