id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: id
  text: Sebab laki-laki tidak diciptakan untuk perempuan, melainkan perempuan untuk laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena perempuan ... karena laki-laki.” Kata depan Yunani yang dipakai di sini dapat menyatakan sebab atau tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: Dalam konteks ini, gabungan tersebut terutama memperkenalkan alasan yang mendukung pernyataan sebelumnya. Bahasa Indonesia tidak memerlukan padanan terpisah bagi καί agar hubungan penjelasnya tetap jelas dan alami.
- source_word: ἐκτίσθη
  choice: diciptakan
  rationale: Bentuk pasif κτίζω secara langsung berarti 'diciptakan' dan menunjuk pada kisah penciptaan.
- source_word: ἀνὴρ / γυνὴ
  choice: laki-laki / perempuan
  rationale: Konteks penciptaan mendukung pengertian jenis kelamin secara umum, bukan secara khusus 'suami/istri'. Pilihan ini juga lebih alami daripada 'pria/wanita' dalam pernyataan yang menggemakan Kejadian.
- source_word: διά + akusatif
  choice: untuk
  rationale: '''Untuk'' mempertahankan kemungkinan nuansa tujuan atau kepentingan dalam argumen penciptaan, tanpa menutup kemungkinan nuansa sebab yang juga dapat dibawa oleh preposisi Yunani.'
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Setelah penyangkalan 'tidak', 'melainkan' menyatakan kontras korektif dengan tepat dan alami.
theological_decisions:
- issue: Apakah ἀνήρ/γυνή berarti laki-laki/perempuan atau suami/istri
  choice: laki-laki/perempuan
  alternative: suami/istri
  rationale: Kata kerja 'diciptakan' menempatkan pernyataan ini dalam kisah penciptaan, sehingga cakupannya lebih luas daripada hubungan perkawinan saja.
- issue: Apakah διά menyatakan tujuan atau sebab
  choice: untuk
  alternative: karena / oleh karena
  rationale: '''Untuk'' paling wajar mencerminkan orientasi tujuan atau kepentingan dalam argumen ini, tetapi catatan kaki mempertahankan ambiguitas leksikal yang nyata.'
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Struktur paralel ayat dipertahankan, dengan istilah umum 'laki-laki' dan 'perempuan' yang mudah dipahami.
