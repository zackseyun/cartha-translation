  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: id
  text: Namun, dalam Tuhan, perempuan tidak terpisah dari laki-laki, dan laki-laki pun tidak terpisah dari perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “istri tidak terpisah dari suami, dan suami pun tidak terpisah dari istri.” Istilah-istilah Yunani dapat berarti perempuan/laki-laki atau istri/suami. Makna yang lebih luas dipilih dalam teks karena pernyataan ini tampaknya bersifat umum, bukan terbatas pada perkawinan.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai peralihan yang membatasi dan menyeimbangkan uraian sebelumnya; “Namun” wajar dalam bahasa Indonesia modern dan mempertahankan daya konsesifnya.
- source_word: γυνή
  choice: perempuan
  rationale: Kata Yunani ini dapat berarti “perempuan” atau “istri”. Konteksnya berupa pernyataan umum mengenai hubungan timbal balik dalam Tuhan, sehingga makna yang lebih luas dipilih tanpa meniadakan kemungkinan makna perkawinan.
- source_word: ἀνήρ
  choice: laki-laki
  rationale: Kata Yunani ini dapat berarti “laki-laki” atau “suami”. Padanan “laki-laki” mempertahankan cakupan umum yang paling sesuai dengan pernyataan ini.
- source_word: χωρίς
  choice: terpisah dari
  rationale: Mengungkapkan keterpisahan atau keadaan lepas dari pihak lain. Padanan ini alami dan tidak mempersempit maknanya menjadi ketergantungan dalam arti tertentu.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang menunjuk pada lingkup atau hubungan yang ditentukan oleh Tuhan tanpa menjabarkan maknanya secara berlebihan.
- source_word: οὔτε ... οὔτε
  choice: tidak ... dan ... pun tidak
  rationale: Menyampaikan dua penyangkalan yang sejajar dengan susunan yang alami dalam bahasa Indonesia serta mempertahankan keseimbangan kedua klausa.
theological_decisions:
- issue: Apakah γυνή / ἀνήρ diterjemahkan sebagai “perempuan/laki-laki” atau “istri/suami”
  choice: perempuan/laki-laki
  alternative: istri/suami
  rationale: Konteks langsung membahas perempuan dan laki-laki dalam penciptaan dan ibadah, sedangkan ayat ini memberi penyeimbang umum mengenai hubungan timbal balik mereka “dalam Tuhan”. Pilihan yang lebih luas dipakai dalam teks utama, sementara ambiguitas leksikal yang asli dipertahankan melalui catatan kaki.
- issue: Makna hubungan yang dinyatakan oleh χωρίς
  choice: tidak terpisah dari
  alternative: tidak mandiri dari / tidak dapat ada tanpa
  rationale: “Tidak terpisah dari” mempertahankan keluwesan ungkapan Yunani dan tidak secara diam-diam menetapkan apakah yang terutama dimaksud adalah ketergantungan, keberadaan, atau hubungan timbal balik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur paralel dipertahankan, sedangkan pengulangan “pun tidak” membuat keseimbangan kedua pihak jelas dan alami.
