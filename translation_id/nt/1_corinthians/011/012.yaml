id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: id
  text: Sebab sama seperti perempuan berasal dari laki-laki,[a] demikian juga laki-laki lahir melalui perempuan. Namun, segala sesuatu berasal dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri berasal dari suami” dan selanjutnya “suami lahir melalui istri”, jika konteks ini dipahami secara lebih sempit sebagai hubungan perkawinan, bukan hubungan laki-laki dan perempuan secara umum.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab sama seperti
  rationale: Mempertahankan fungsi γάρ sebagai penghubung penjelasan dengan argumen sebelumnya dan ὥσπερ sebagai pembuka perbandingan.
- source_word: ἡ γυνή
  choice: perempuan
  rationale: γυνή dapat berarti ‘perempuan’ atau ‘istri’. Acuan pada penciptaan dan kelahiran menunjukkan hubungan laki-laki–perempuan secara umum, bukan semata-mata hubungan perkawinan.
- source_word: ἐκ τοῦ ἀνδρός
  choice: berasal dari laki-laki
  rationale: ἐκ menyatakan sumber atau asal dan menggemakan penciptaan perempuan dari laki-laki.
- source_word: ὁ ἀνήρ
  choice: laki-laki
  rationale: ἀνήρ dapat berarti ‘laki-laki’ atau ‘suami’; makna umum dipilih karena paralelnya dengan γυνή dan cakupan argumen tentang penciptaan serta kelahiran.
- source_word: διὰ τῆς γυναικός
  choice: lahir melalui perempuan
  rationale: διά dengan genitif menyatakan perantaraan. Penambahan ‘lahir’ membuat maksud biologis tersampaikan secara alami dalam bahasa Indonesia tanpa menyamakan διά dengan ἐκ.
- source_word: τὰ δὲ πάντα
  choice: Namun, segala sesuatu
  rationale: δέ menandai peralihan dengan kontras ringan menuju pernyataan puncak tentang Allah sebagai sumber utama.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ kembali menyatakan sumber atau asal; frasa ini menegaskan bahwa Allah adalah sumber utama segala sesuatu.
theological_decisions:
- issue: Makna γυνή dan ἀνήρ
  choice: ‘perempuan’ dan ‘laki-laki’ dalam arti umum
  alternative: ‘istri’ dan ‘suami’
  rationale: Ayat ini merujuk baik pada asal perempuan dalam penciptaan maupun pada kelahiran laki-laki melalui perempuan, sehingga cakupannya lebih luas daripada perkawinan saja. Kemungkinan arti yang lebih sempit dicatat dalam catatan kaki.
- issue: Perbedaan asal-usul laki-laki dan perempuan
  choice: Membedakan ‘berasal dari’ (ἐκ) dan ‘melalui’ (διά)
  alternative: Menerjemahkan keduanya dengan ‘berasal dari’
  rationale: 'Perbedaan preposisi tampaknya disengaja: perempuan berasal dari laki-laki dalam kisah penciptaan, sedangkan laki-laki hadir melalui perempuan dalam kelahiran. Pembedaan ini mempertahankan ketegangan dan keseimbangan teologis teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Lahir melalui’ dipakai agar perantaraan perempuan dalam kelahiran jelas dan alami, sambil tetap menjaga perbedaan antara ἐκ dan διά. Penanda catatan kaki [a] ditempatkan sesudah klausa yang mengandung istilah ambigu.
