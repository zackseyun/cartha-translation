id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: id
  text: Jadilah orang yang meneladani aku, sebagaimana aku juga meneladani Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus.”'
    reason: Padanan tradisional untuk gelar Yunani Χριστός.
lexical_decisions:
- source_word: μιμηταί
  choice: orang yang meneladani
  rationale: Bentuk ini mempertahankan gagasan meniru atau mencontoh teladan seseorang, tetapi menghindari kata “peniru” yang dalam bahasa Indonesia modern sering bernuansa negatif.
- source_word: μου
  choice: aku
  rationale: Genitif ini menyatakan pribadi yang diteladani. Dalam konstruksi verbal bahasa Indonesia, bentuk “meneladani aku” menyampaikan hubungan itu secara alami.
- source_word: γίνεσθε
  choice: Jadilah
  rationale: Imperatif kini dari γίνομαι memiliki daya ‘menjadi’ atau ‘mulailah menjadi’, bukan sekadar menyatakan keadaan. “Jadilah” mempertahankan daya tersebut.
- source_word: καθὼς
  choice: sebagaimana
  rationale: Kata ini menandai perbandingan antara tindakan jemaat dan tindakan Paulus. “Sebagaimana” alami, jelas, dan sesuai dengan ragam yang bermartabat.
- source_word: κἀγὼ
  choice: aku juga
  rationale: Crasis καί + ἐγώ memberi penekanan tambahan ‘aku juga’; unsur “juga” dipertahankan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini dapat dipahami sebagai gelar yang menunjuk kepada Yesus sebagai Yang Diurapi. “Mesias” menyampaikan fungsi gelar itu; bentuk tradisional “Kristus” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Konteks ini memungkinkan Χριστός dibaca sebagai gelar. “Mesias” mempertahankan makna gelar, sementara “Kristus” tetap diberikan sebagai padanan tradisional tanpa memaksakan perbedaan teologis.
- issue: Elipsis pada κἀγὼ Χριστοῦ
  choice: aku juga meneladani Mesias
  alternative: aku juga [adalah peneladan] Mesias
  rationale: Teks Yunani menghilangkan unsur yang dapat dipulihkan dari klausa sebelumnya. Bahasa Indonesia memerlukan pengungkapan unsur tersirat itu agar kalimat tidak terasa janggal atau disalahpahami sebagai pernyataan kepemilikan. Pengulangan verba “meneladani” menyatakan makna elipsis tanpa mengubah hubungan perbandingannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan “orang yang meneladani” dipilih daripada “peniru” karena lebih alami dan tidak bernuansa negatif. Pronomina “aku” mengikuti suara pribadi Paulus dan lazim dalam terjemahan Alkitab Indonesia.
