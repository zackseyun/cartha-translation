  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: id
  text: Jadi, saudara-saudaraku[a], ketika kamu berkumpul untuk makan, tunggulah satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudaraku.” Kata Yunani yang berbentuk maskulin ini sering dipakai untuk menyapa seluruh jemaat, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Jadi
  rationale: Konjungsi ini menarik kesimpulan dari teguran sebelumnya mengenai penyalahgunaan perjamuan jemaat. “Jadi” alami dalam bahasa Indonesia dan mempertahankan daya inferensialnya.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Bentuk vokatif jamak dengan pronomina posesif berarti secara harfiah “saudara-saudaraku.” Ungkapan ini wajar sebagai sapaan kepada jemaat; cakupan inklusifnya dijelaskan dalam catatan kaki.
- source_word: συνερχόμενοι
  choice: ketika kamu berkumpul
  rationale: Partisipel ini menerangkan keadaan atau waktu berlakunya perintah. Bentuk “ketika kamu berkumpul” alami dan selaras dengan bahasa pertemuan jemaat yang berulang dalam pasal ini.
- source_word: εἰς τὸ φαγεῖν
  choice: untuk makan
  rationale: Preposisi dengan infinitif berartikel menyatakan tujuan. Terjemahan ringkas ini mempertahankan makna tanpa mempersempitnya menjadi jenis perjamuan tertentu.
- source_word: ἀλλήλους
  choice: satu sama lain
  rationale: Pronomina resiprokal ini menjadi objek perintah dan secara alami diterjemahkan “satu sama lain.”
- source_word: ἐκδέχεσθε
  choice: tunggulah
  rationale: Dalam konteks sebagian orang makan lebih dahulu daripada yang lain (ayat 21), makna yang paling mungkin ialah menunggu orang lain sebelum mulai makan. Nuansa alternatif “menyambut” atau “menerima” tidak dimasukkan ke teks utama karena konteks langsung lebih mendukung “menunggu.”
theological_decisions:
- issue: Sapaan maskulin representatif dalam ἀδελφοί
  choice: Memakai “saudara-saudaraku” dalam teks utama dan menjelaskan cakupan jemaat dalam catatan kaki.
  alternative: saudara-saudaraku, laki-laki dan perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dalam surat-surat Paulus kerap menyapa seluruh jemaat, termasuk perempuan. Terjemahan utama mempertahankan bentuk sapaan yang dekat dengan sumber tanpa menambahkan kata yang tidak dinyatakan secara eksplisit.
- issue: Makna ἐκδέχεσθε dalam konteks Perjamuan Tuhan
  choice: tunggulah
  alternative: sambutlah / terimalah
  rationale: Teguran bahwa seorang makan lebih dahulu sementara yang lain kelaparan membuat perintah untuk saling menunggu menjadi pembacaan kontekstual yang paling kuat, meskipun verba tersebut dapat memiliki nuansa menerima atau menyambut dalam konteks lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “saudara-saudaraku” mempertahankan kehangatan serta hubungan kekeluargaan dalam jemaat; imperatif “tunggulah” jelas namun tidak kasar.
