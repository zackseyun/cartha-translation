id: 1CO.11.8
reference: 1 Corinthians 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: id
  text: Sebab laki-laki tidak berasal dari perempuan,[a] melainkan perempuan dari laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab suami tidak berasal dari istri, melainkan istri dari suami.” Istilah-istilah Yunani dapat berarti “laki-laki/perempuan” ataupun “suami/istri”; di sini makna penciptaan yang lebih luas dipilih.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar atau penjelasan bagi pernyataan sebelumnya; “sebab” ringkas dan wajar dalam alur argumentasi bahasa Indonesia.
- source_word: ἀνήρ / ἀνδρός
  choice: laki-laki
  rationale: Dalam argumen yang mengacu pada penciptaan dan berpasangan dengan γυνή, istilah ini paling tepat menunjuk pada laki-laki, meskipun secara leksikal juga dapat berarti “suami”.
- source_word: ἐκ / ἐξ
  choice: berasal dari
  rationale: Preposisi ini menandai sumber atau asal. “Berasal dari” menyampaikan hubungan asal-usul secara alami dan jelas dalam bahasa Indonesia.
- source_word: γυνή / γυναικός
  choice: perempuan
  rationale: Dalam konteks penciptaan, istilah ini menunjuk pada perempuan secara umum, bukan secara sempit pada istri, meskipun kedua arti dimungkinkan secara leksikal.
- source_word: ἀλλά
  choice: melainkan
  rationale: Kata ini menyatakan kontras yang tegas setelah klausa negatif; pola “tidak ..., melainkan ...” paling alami dalam bahasa Indonesia.
- source_word: ἐστιν
  choice: tidak diterjemahkan sebagai kata tersendiri
  rationale: Kopula Yunani tercakup secara alami dalam konstruksi bahasa Indonesia “tidak berasal”; menambahkan “adalah” akan terasa kaku.
theological_decisions:
- issue: Apakah ἀνήρ/γυνή diterjemahkan sebagai “laki-laki/perempuan” atau “suami/istri”
  choice: laki-laki/perempuan
  alternative: suami/istri
  rationale: Pernyataan ini mendasarkan argumen pada kisah penciptaan dan menekankan asal-usul. Pilihan “laki-laki/perempuan” mempertahankan cakupan penciptaan yang lebih luas tanpa menutup kemungkinan leksikal yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. “Melainkan” dipilih untuk mempertahankan kontras kuat dalam konstruksi negatif. Penanda catatan kaki ditempatkan langsung sesudah “perempuan” pada klausa pertama.
