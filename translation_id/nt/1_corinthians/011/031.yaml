  text: εἰ ⸀δὲ ἑαυτοὺς διεκρίνομεν, οὐκ ἂν ἐκρινόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: id
  text: Namun, jika kita menilai diri kita sendiri[a], kita tidak akan dihakimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memeriksa diri kita sendiri” atau “membedakan diri kita sendiri.” Kata Yunani yang dipakai dapat berarti menilai, memeriksa, atau membedakan. “Menilai” dipakai di sini untuk mempertahankan kaitannya dengan “dihakimi” dalam klausa berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: εἰ menyatakan syarat, sedangkan δέ menandai peralihan atau kontras ringan. Susunan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: ἑαυτοὺς
  choice: diri kita sendiri
  rationale: Pronomina refleksif akusatif ini menjadi objek verba dan secara alami diterjemahkan dengan 'diri kita sendiri'.
- source_word: διεκρίνομεν
  choice: menilai
  rationale: Dalam konteks Perjamuan Tuhan, διακρίνω menunjuk pada penilaian yang sungguh-sungguh dan membeda-bedakan terhadap diri sendiri. 'Menilai' mempertahankan hubungan makna dengan 'dihakimi' tanpa terdengar janggal.
- source_word: οὐκ ἂν
  choice: tidak akan
  rationale: Bersama bentuk verba imperfek, ungkapan ini menyatakan akibat hipotesis yang berlawanan dengan keadaan yang terjadi; 'tidak akan' merupakan padanan Indonesia yang alami.
- source_word: ἐκρινόμεθα
  choice: dihakimi
  rationale: Bentuk pasif κρίνω menunjuk pada penerimaan penghakiman. 'Dihakimi' mempertahankan kaitan leksikal dengan tindakan menilai pada klausa pertama dan tidak memperkuatnya menjadi penghukuman kekal.
theological_decisions:
- issue: Apakah klausa kedua menunjuk pada penghukuman akhir atau penghakiman/disiplin ilahi dalam kehidupan sekarang
  choice: Diterjemahkan secara netral sebagai 'dihakimi', dengan konteks yang memungkinkan penghakiman atau disiplin ilahi
  alternative: Dihukum atau dihukum kekal
  rationale: Ayat 32 membedakan penghakiman dan disiplin Tuhan terhadap umat-Nya dari penghukuman bersama dunia. Karena itu, terjemahan tidak boleh lebih dahulu menyamakan ἐκρινόμεθα dengan penghukuman akhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Namun, jika' menyampaikan kontras ringan; 'menilai diri kita sendiri' mudah dipahami sekaligus mempertahankan permainan makna antara διακρίνω dan κρίνω.
