  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: id
  text: Bukankah alam sendiri pun mengajarkan kepada kamu bahwa jika seorang laki-laki berambut panjang[a], hal itu merupakan kehinaan baginya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membiarkan rambutnya tumbuh panjang” atau “memiliki rambut panjang.” Kata kerja Yunani ini merujuk pada keadaan berambut panjang atau membiarkan rambut tumbuh panjang.
    reason: lexical_alternative
  - marker: b
    text: “Alam sendiri” dapat merujuk pada tatanan ciptaan, persepsi umum manusia, atau apa yang dianggap sewajarnya oleh suatu budaya; teks Yunani tidak menentukan makna yang lebih sempit di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Bukankah bahkan
  rationale: Menyampaikan bentuk pertanyaan retoris negatif sekaligus daya penegas οὐδὲ secara alami dalam bahasa Indonesia.
- source_word: ἡ φύσις αὐτὴ
  choice: alam sendiri
  rationale: Mempertahankan penegasan αὐτή dan keluasan makna φύσις tanpa membatasinya hanya pada biologi atau kebiasaan sosial.
- source_word: διδάσκει ὑμᾶς
  choice: mengajar kamu
  rationale: Padanan langsung dan wajar yang mempertahankan nuansa didaktis verba kini.
- source_word: ὅτι
  choice: bahwa
  rationale: Menandai secara eksplisit isi yang diajarkan oleh alam.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Konteksnya membedakan laki-laki dan perempuan, bukan secara khusus suami dan istri.
- source_word: μέν
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai bagian pertama kontras yang dilanjutkan pada ayat berikutnya; penerjemahan eksplisit akan terasa kaku dalam bahasa Indonesia.
- source_word: ἐὰν κομᾷ
  choice: jika seorang laki-laki berambut panjang
  rationale: κομάω berarti memakai, memiliki, atau membiarkan rambut tumbuh panjang; pilihan ini ringkas dan alami sambil tetap diberi alternatif dalam catatan kaki.
- source_word: ἀτιμία
  choice: kehinaan
  rationale: Menunjukkan keadaan tidak terhormat atau memalukan dalam kerangka kehormatan–kehinaan tanpa mempersempitnya menjadi rasa malu subjektif.
- source_word: αὐτῷ ἐστιν
  choice: hal itu merupakan kehinaan baginya
  rationale: Mengungkapkan konstruksi predikatif dan datif secara jelas serta alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna φύσις dalam argumen Paulus
  choice: Diterjemahkan secara luas sebagai “alam sendiri.”
  alternative: Tatanan ciptaan biologis; persepsi umum manusia; kebiasaan sosial yang dianggap sewajarnya; intuisi moral bawaan.
  rationale: Istilah Yunani itu tidak menentukan secara lebih sempit makna yang dimaksud dalam ayat ini. Terjemahan mempertahankan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kamu” dipakai sebagai bentuk jamak kontekstual untuk ὑμᾶς dan selaras dengan gaya terjemahan umum; ambiguitas “alam” dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
