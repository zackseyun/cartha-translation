  terminology: “Laki-laki,” “berdoa,” “bernubuat,” dan “kepalanya” konsisten dengan istilah umum bahasa Indonesia dan dengan konteks ayat. Catatan a dengan benar membedakan terjemahan tradisional “dengan kepala tertutup” dari ketidakspesifikan ungkapan Yunani; catatan b dengan tepat menjaga kemungkinan gema makna relasional tanpa menjadikannya penafsiran teks utama.
