  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: id
  text: Setiap laki-laki yang berdoa atau bernubuat dengan sesuatu di atas kepalanya mempermalukan kepalanya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “dengan kepala tertutup.” Secara harfiah, bahasa Yunani berbunyi “mempunyai sesuatu pada atau menjuntai dari kepala” dan tidak menyebut jenis penutupnya.
    reason: lexical_alternative
  - marker: b
    text: “Kepalanya” dapat menunjuk secara harfiah pada kepala orang itu sendiri, sekaligus menggemakan penggunaan kata “kepala” dalam arti relasional pada konteks sekitarnya.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Setiap laki-laki
  rationale: ἀνήρ dapat berarti laki-laki atau suami. Di sini bentuk umum yang berpasangan dengan perempuan pada ayat berikutnya paling wajar diterjemahkan sebagai laki-laki, tanpa memasukkan penafsiran khusus tentang suami.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: yang berdoa atau bernubuat
  rationale: Kedua partisipel kini menggambarkan orang yang sedang melakukan tindakan tersebut. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan kedua kegiatan secara sejajar.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: dengan sesuatu di atas kepalanya
  rationale: Ungkapan Yunani secara harfiah menyatakan bahwa ia mempunyai sesuatu pada atau menjuntai dari kepala, tetapi tidak menyebut benda penutup tertentu. Terjemahan ini mempertahankan ketidakjelasan itu tanpa menjadi tidak wajar.
- source_word: καταισχύνει
  choice: mempermalukan
  rationale: Kata kerja ini menyatakan tindakan mendatangkan malu atau aib. 'Mempermalukan' jelas dan alami ketika objeknya adalah 'kepalanya', serta mempertahankan dinamika kehormatan dan rasa malu dalam nas.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kepalanya
  rationale: Ungkapan ini dapat menunjuk pada kepala fisiknya dan sekaligus menggemakan penggunaan relasional atau kiasan kata 'kepala' dalam konteks sekitar. Bentuk sederhana ini tidak memutuskan ambiguitas tersebut.
theological_decisions:
- issue: Apakah κεφαλή pada klausa terakhir harus dinyatakan secara eksplisit sebagai kepala fisik atau sebagai kepala dalam arti relasional
  choice: Mempertahankan ambiguitas dengan 'kepalanya'
  alternative: kepala fisiknya; dia yang menjadi kepalanya
  rationale: Susunan kata Paulus memungkinkan tumpang tindih retoris antara kepala secara harfiah dan penggunaan 'kepala' secara relasional dalam ayat sebelumnya. Teks utama tidak seharusnya menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. 'Laki-laki' dipilih untuk ketepatan gender; 'bernubuat' mempertahankan istilah teologis yang umum; catatan kaki menjaga ambiguitas leksikal dan kontekstual.
