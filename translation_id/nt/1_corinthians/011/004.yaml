  source_fidelity: Teks Indonesia dengan tepat menerjemahkan πᾶς ἀνήρ secara generik sebagai “Setiap laki-laki,” mempertahankan dua partisipel kegiatan (“yang berdoa atau bernubuat”), dan tidak memperinci benda yang tersirat dalam κατὰ κεφαλῆς ἔχων. “Mempermalukan kepalanya” secara memadai menyampaikan καταισχύνει τὴν κεφαλὴν αὐτοῦ serta membiarkan permainan makna literal/relasional pada “kepalanya” tetap terbuka.
