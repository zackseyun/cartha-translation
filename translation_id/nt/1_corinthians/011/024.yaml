revisions:
- from: Sesudah mengucap syukur, Ia memecah-mecahkannya dan berkata, “Inilah tubuh-Ku—untuk kamu[a].[b] Teruslah lakukan ini untuk mengenang Aku.”
  to: Sesudah mengucap syukur, Ia memecahkan roti itu dan berkata, “Inilah tubuh-Ku bagi kamu[a][b]. Lakukanlah ini terus untuk mengenang Aku.”
  rationale: Revisi menghilangkan nuansa iteratif yang tidak diperlukan pada penerjemahan ἔκλασεν dan memperbaiki kelancaran imperatif bahasa Indonesia. Penambahan "roti itu" hanya menyatakan objek yang tersirat secara langsung dalam konteks dan yang lazim perlu dinyatakan dalam bahasa Indonesia. Frasa "tubuh-Ku bagi kamu" mempertahankan elipsis sumber tanpa menyisipkan tindakan teologis seperti "diberikan". Kedua penanda catatan kaki tetap ditambatkan pada frasa yang relevan; catatan varian diselaraskan dengan diksi teks revisi.
