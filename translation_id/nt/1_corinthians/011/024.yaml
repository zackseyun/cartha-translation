  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: id
  text: Sesudah mengucap syukur, Ia memecahkan roti itu dan berkata, “Inilah tubuh-Ku bagi kamu[a][b]. Lakukanlah ini terus untuk mengenang Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi kamu” atau “untuk kepentingan kamu.”
    reason: lexical_alternative
  - marker: b
    text: 'Beberapa naskah menambahkan “dipecahkan” sesudah “bagi kamu”: “Inilah tubuh-Ku, yang dipecahkan bagi kamu.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: sesudah mengucap syukur
  rationale: 'Partisip aoristus ini mendahului verba utama dan secara alami menyatakan urutan tindakan: sesudah mengucap syukur, Ia memecah-mecahkan roti.'
- source_word: ἔκλασεν
  choice: Ia memecah-mecahkannya
  rationale: Verba ini berarti memecahkan. Sufiks -nya merujuk pada roti dalam konteks sebelumnya, sedangkan bentuk berulang memecah-mecahkan cocok dengan tindakan membagi roti tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Inilah tubuh-Ku
  rationale: Konstruksi kopulatif diterjemahkan secara langsung dan tidak diubah menjadi 'ini melambangkan tubuh-Ku', sehingga ambiguitas teologis teks tetap terpelihara.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: untuk kamu
  rationale: Ὑπέρ dengan genitif menyatakan manfaat atau tindakan demi pihak lain. Tanda pisah mempertahankan sifat eliptis frasa Yunani sekaligus menghasilkan bahasa Indonesia yang wajar tanpa menyisipkan verba seperti 'diberikan' atau 'diserahkan' yang tidak tertulis.
- source_word: τοῦτο ποιεῖτε
  choice: Teruslah lakukan ini
  rationale: Imperatif kala kini dalam konteks penetapan ini mendukung tindakan yang diteruskan atau diulangi. 'Teruslah lakukan' menyatakan daya tersebut secara alami.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: untuk mengenang Aku
  rationale: Ἀνάμνησις menunjuk pada tindakan mengingat atau memperingati. Ungkapan ini jelas dan alami dalam bahasa Indonesia serta tidak mempersempitnya menjadi sekadar kegiatan mental.
theological_decisions:
- issue: Makna 'Inilah tubuh-Ku' dalam konteks Perjamuan Tuhan
  choice: Klausa diterjemahkan langsung sebagai 'Inilah tubuh-Ku'.
  alternative: Mengartikannya secara eksplisit sebagai 'Ini melambangkan tubuh-Ku' atau menjelaskan suatu cara khusus kehadiran Kristus.
  rationale: Teks Yunani memakai konstruksi kopulatif langsung dan tidak menjelaskan cara hubungan antara roti dan tubuh Kristus. Terjemahan mempertahankan ketegangan itu tanpa memutuskan perdebatan teologis kemudian.
- issue: Daya frasa ὑπὲρ ὑμῶν
  choice: untuk kamu
  alternative: demi kamu; atas nama kamu
  rationale: Terjemahan ini mempertahankan makna benefaktif atau representatif tanpa memasukkan rumusan teknis tertentu tentang pendamaian.
- issue: Elipsis dalam 'tubuh-Ku—untuk kamu'
  choice: Mempertahankan frasa tanpa menambahkan verba tersirat.
  alternative: yang diberikan bagi kamu; yang diserahkan bagi kamu
  rationale: Teks sumber tidak memuat verba 'diberikan' atau 'diserahkan'. Tanda pisah menghasilkan ungkapan Indonesia yang dapat dipahami sambil mempertahankan kekhasan bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Ia' serta enklitik '-Ku' mengikuti register Alkitab Indonesia yang hormat dan mudah dikenali. Tanda pisah dipakai untuk menyampaikan elipsis Yunani secara alami. Semua penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya, bukan mengikuti penempatan penanda yang tampaknya tertukar dalam lapisan konsultasi Inggris.
