  terminology: '"Mengucap syukur," "tubuh-Ku," "bagi kamu," dan "mengenang Aku" sesuai register Alkitab Indonesia modern yang khidmat. "Bagi kamu" menyampaikan ὑπέρ tanpa menambahkan verba seperti "diberikan" atau "diserahkan."'
