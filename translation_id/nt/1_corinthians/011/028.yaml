  naturalness: '“Lalu dengan demikian” terasa berlebihan karena kedua penghubung menyampaikan fungsi yang hampir sama. Susunan dengan “dan kemudian” lebih alami sambil menjaga urutan: pengujian diri, lalu makan dan minum.'
