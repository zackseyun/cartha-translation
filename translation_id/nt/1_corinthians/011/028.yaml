  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: id
  text: Namun, hendaklah setiap orang menguji dirinya sendiri, dan kemudian hendaklah ia makan dari roti itu dan minum dari cawan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: hendaklah ... menguji
  rationale: Bentuk imperatif kini orang ketiga menyatakan perintah untuk memeriksa atau menguji diri guna mengetahui kelayakan/keadaan diri; “menguji” mempertahankan daya kata sumber tanpa menambahkan kriteria yang tidak disebutkan.
- source_word: ἄνθρωπος
  choice: setiap orang
  rationale: Dalam konteks nasihat umum kepada anggota jemaat, ἄνθρωπος bersifat generik, bukan penegasan jenis kelamin; “setiap orang” alami dalam bahasa Indonesia dan mencakup masing-masing peserta.
- source_word: ἑαυτόν
  choice: dirinya sendiri
  rationale: Mempertahankan sifat refleksif dan penekanan bahwa pemeriksaan diarahkan kepada diri masing-masing.
- source_word: οὕτως
  choice: lalu dengan demikian
  rationale: Menunjukkan bahwa makan dan minum dilakukan sesudah dan dalam keadaan yang dihasilkan oleh pengujian diri, tanpa menafsirkan lebih jauh hasil pengujian itu.
- source_word: ἐκ τοῦ ἄρτου ... ἐκ τοῦ ποτηρίου
  choice: dari roti itu ... dari cawan itu
  rationale: Mempertahankan konstruksi ἐκ yang secara harfiah berarti mengambil bagian “dari” roti dan cawan, serta artikel tertentu yang merujuk pada unsur perjamuan yang sudah disebut.
theological_decisions:
- issue: Apakah pengujian diri menentukan bahwa seseorang harus menjauh dari perjamuan?
  choice: Terjemahan tetap mengarahkan orang yang telah menguji diri untuk makan dan minum.
  alternative: Menerjemahkan seolah-olah orang harus memastikan dirinya layak dahulu atau menahan diri jika merasa tidak layak.
  rationale: Teks berkata “dan dengan demikian hendaklah ia makan ... dan minum,” bukan menetapkan syarat kelayakan tambahan atau secara eksplisit memerintahkan pantang.
- issue: Cakupan ἄνθρωπος
  choice: “setiap orang” sebagai sebutan generik bagi masing-masing peserta.
  alternative: “seorang laki-laki,” yang dapat dipahami membatasi perintah berdasarkan jenis kelamin.
  rationale: Pemakaian generik sesuai konteks dan tetap mempertahankan penerapan individual dari bentuk tunggal.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan khidmat. Susunan kalimat mempertahankan alur perintah Yunani: menguji diri, kemudian makan dan minum. Tidak ada catatan kaki karena tidak terdapat varian atau ambiguitas yang memerlukan penjelasan dalam teks publikasi.'
