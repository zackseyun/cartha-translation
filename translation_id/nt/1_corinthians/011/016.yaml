  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: id
  text: Namun, jika seseorang tampaknya suka berbantah-bantah[a], kami tidak mempunyai kebiasaan semacam itu[b], dan jemaat-jemaat Allah juga tidak mempunyainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suka bertengkar” atau “gemar berselisih.”
    reason: lexical_alternative
  - marker: b
    text: “Kebiasaan semacam itu” dapat menunjuk pada kebiasaan berbantah-bantah atau pada praktik yang dipersoalkan dalam ayat-ayat sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: tampaknya
  rationale: Dalam konstruksi dengan infinitif, pilihan ini mempertahankan nuansa ‘tampak’ tanpa memutuskan apakah yang dimaksud ialah penilaian diri atau kesan yang terlihat.
- source_word: φιλόνεικος
  choice: suka berbantah-bantah
  rationale: Ungkapan ini menyampaikan kecenderungan untuk berselisih atau berdebat secara melawan, dengan bahasa Indonesia modern yang mudah dipahami.
- source_word: τοιαύτην
  choice: semacam itu
  rationale: Mempertahankan rujukan ke belakang tanpa menentukan secara berlebihan praktik mana yang dimaksud.
- source_word: συνήθειαν
  choice: kebiasaan
  rationale: Mencakup kebiasaan atau praktik yang lazim dan tetap cukup luas untuk mempertahankan ketidakjelasan rujukannya.
- source_word: οὐκ ἔχομεν
  choice: kami tidak mempunyai
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa menambahkan gagasan ‘melarang’ atau ‘tidak mengikuti’.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: jemaat-jemaat Allah
  rationale: ‘Jemaat’ merupakan padanan Indonesia yang alami bagi ἐκκλησία dalam konteks perkumpulan orang percaya, sedangkan bentuk jamak dan hubungan dengan Allah dipertahankan.
theological_decisions:
- issue: Rujukan frasa ‘kebiasaan semacam itu’
  choice: Terjemahan dibiarkan luas dan tidak menentukan kebiasaan mana yang dimaksud.
  alternative: Frasa itu dapat menunjuk pada sikap suka berbantah-bantah atau pada praktik yang dipersoalkan dalam ayat-ayat sebelumnya.
  rationale: τοιαύτην συνήθειαν ringkas secara sintaksis dan rujukannya diperdebatkan; menentukan salah satu rujukan di dalam teks akan menghapus ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Namun’ menandai peralihan argumentasi; ‘demikian juga’ menyampaikan οὐδέ secara alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
