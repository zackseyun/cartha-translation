id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: id
  text: Jika seseorang lapar, hendaklah ia makan di rumah, supaya kamu tidak berkumpul untuk menerima penghakiman.[a] Mengenai hal-hal lainnya, aku akan memberikan petunjuk ketika aku datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukuman.” Kata Yunani κρίμα dapat berarti “penghakiman” atau “hukuman.” Dalam konteks ini, “penghakiman” paling sesuai karena Paulus membicarakan disiplin Tuhan pada masa kini, bukan penghukuman akhir (ay. 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: lapar
  rationale: Bentuk kini ini menyatakan keadaan seseorang yang sedang lapar; 'lapar' merupakan padanan Indonesia yang langsung dan alami.
- source_word: ἐν οἴκῳ
  choice: di rumah
  rationale: Frasa ini menunjuk pada lingkungan rumah tangga sebagai tempat makan, berlawanan dengan pertemuan jemaat.
- source_word: ἐσθιέτω
  choice: hendaklah ia makan
  rationale: Bentuk imperatif orang ketiga tunggal dipertahankan dengan ungkapan perintah yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: εἰς κρίμα
  choice: untuk mendatangkan penghakiman atas dirimu
  rationale: Ungkapan ini menyampaikan bahwa cara mereka berkumpul berakibat pada penghakiman. 'Penghakiman' mempertahankan cakupan κρίμα tanpa mempersempitnya secara tegas menjadi penghukuman akhir; 'atas dirimu' menjelaskan sasaran akibat yang sudah tersirat dalam konstruksi Yunani.
- source_word: συνέρχησθε
  choice: kamu tidak berkumpul
  rationale: Kata kerja ini dipakai berulang kali dalam konteks pertemuan jemaat; 'berkumpul' mempertahankan kaitan verbal tersebut.
- source_word: Τὰ δὲ λοιπὰ
  choice: Mengenai hal-hal lainnya
  rationale: Terjemahan ini menjadi peralihan alami kepada perkara-perkara tersisa yang akan Paulus tangani kemudian.
- source_word: ὡς ἂν ἔλθω
  choice: ketika aku datang
  rationale: Konstruksi ini menunjuk pada waktu kunjungan Paulus yang akan datang tanpa menentukan waktunya.
- source_word: διατάξομαι
  choice: aku akan memberikan petunjuk
  rationale: Dalam konteks ini kata tersebut berarti menetapkan atau mengarahkan apa yang harus dilakukan; padanan ini jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna κρίμα dalam peringatan mengenai perjamuan jemaat
  choice: penghakiman, dipahami dalam konteks sebagai tindakan penghakiman dan disiplin ilahi
  alternative: hukuman atau penghukuman
  rationale: Ayat 29–32 berbicara tentang penghakiman dan disiplin Tuhan serta membedakannya dari penghukuman bersama dunia. 'Penghakiman' mempertahankan keluasan istilah dan ketegangan teks tanpa menegaskan bahwa yang dimaksud adalah penghukuman akhir.
- issue: τις yang tak tentu dengan imperatif tunggal
  choice: seseorang ... hendaklah ia makan
  alternative: siapa pun ... hendaklah orang itu makan
  rationale: Bahasa Indonesia dapat mempertahankan acuan tunggal secara alami dengan 'seseorang' dan 'ia', tanpa memasukkan jenis kelamin yang tidak dinyatakan oleh τις.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca umum. Penanda catatan kaki ditempatkan sesudah 'penghakiman atas dirimu', yaitu pada istilah yang dijelaskannya.
