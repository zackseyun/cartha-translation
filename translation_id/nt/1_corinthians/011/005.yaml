id: 1CO.11.5
reference: 1 Corinthians 11:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: id
  text: Namun, setiap perempuan yang berdoa atau bernubuat dengan kepala tidak tertutup[b] mempermalukan kepalanya[a], sebab keadaannya sama saja dengan perempuan yang kepalanya telah dicukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap istri yang berdoa atau bernubuat ... mempermalukan suaminya/kepalanya.” Kata Yunani yang diterjemahkan “perempuan” juga dapat berarti “istri”, dan “kepala” dapat dipahami secara harfiah atau kiasan berdasarkan konteks sekitar.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “tidak tertutup” tidak dengan sendirinya menjelaskan jenis penutup yang dimaksud. Ada perbedaan pendapat apakah Paulus secara khusus merujuk pada kerudung atau secara lebih umum pada kepala yang tidak tertutup.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: perempuan
  rationale: Kata ini dapat berarti 'perempuan' atau 'istri'. Dalam konstruksi langsung ayat ini, pengertian umum 'perempuan' paling alami dan tidak membatasi teks hanya pada perempuan yang menikah; alternatif 'istri' dicatat dalam catatan kaki.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: yang berdoa atau bernubuat
  rationale: Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan kedua kegiatan yang dinyatakan oleh partisipel kini.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: dengan kepala tidak tertutup
  rationale: Terjemahan ini menyatakan keadaan kepala tanpa menentukan apakah penutup yang dimaksud ialah kerudung, kain tertentu, rambut, atau bentuk penutup lain.
- source_word: καταισχύνει
  choice: mempermalukan
  rationale: Kata ini menyampaikan gagasan mendatangkan malu atau aib dalam konteks kehormatan sosial. 'Mempermalukan' merupakan ungkapan Indonesia yang langsung dan mudah dipahami.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: kepalanya
  rationale: Terjemahan harfiah ini tetap memungkinkan 'kepala' dipahami secara fisik ataupun secara metaforis berdasarkan konteks sekitar.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: sebab keadaannya sama saja
  rationale: Ungkapan ini menyampaikan penegasan kesetaraan secara alami dalam bahasa Indonesia tanpa kehilangan daya bandingnya.
- source_word: τῇ ἐξυρημένῃ
  choice: dengan perempuan yang kepalanya telah dicukur
  rationale: Partisipel perfektif menunjuk pada keadaan sebagai hasil pencukuran. 'Telah dicukur' mempertahankan nuansa keadaan yang dihasilkan itu, sedangkan penyebutan 'perempuan' membuat perbandingan eliptis Yunani jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'kepala' yang kedua dalam 'mempermalukan kepalanya'
  choice: Mempertahankan kata 'kepalanya' tanpa menetapkan apakah artinya fisik atau metaforis.
  alternative: Kepala fisiknya; atau kepala metaforisnya, yakni suami/laki-laki dalam kerangka argumen pasal ini.
  rationale: Susunan Yunani memungkinkan arti harfiah, sedangkan konteks sekitar membuka kemungkinan metaforis. Teks utama mempertahankan ketegangan penafsiran tersebut.
- issue: Jenis penutup dalam ungkapan 'tidak tertutup'
  choice: Menggunakan ungkapan umum 'kepala tidak tertutup'.
  alternative: Tanpa kerudung; tanpa penutup kain; atau rambut dalam keadaan tertentu.
  rationale: Kata sifat Yunani menyatakan bahwa kepala tidak tertutup, tetapi tidak dengan sendirinya menentukan benda atau bentuk penutupnya.
- issue: Cakupan γυνή
  choice: Menerjemahkan sebagai 'perempuan' dalam teks utama.
  alternative: Istri.
  rationale: Ayat ini secara langsung berbicara tentang setiap γυνή yang berdoa atau bernubuat. Karena status perkawinan tidak dinyatakan secara eksplisit, 'perempuan' menghindari pembatasan yang terlalu dini, sambil mempertahankan 'istri' sebagai kemungkinan kontekstual dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. 'Namun' menandai kontras δέ, 'bernubuat' mempertahankan istilah teologis yang lazim, dan catatan kaki menjaga ambiguitas leksikal serta kontekstual tanpa memasukkan kesimpulan denominasi tertentu.
