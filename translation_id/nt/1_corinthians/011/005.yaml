  source_fidelity: 'Teks Indonesia secara akurat mencerminkan unsur-unsur utama Yunani: cakupan umum πᾶσα γυνή, kegiatan berdoa atau bernubuat, keadaan kepala yang tidak tertutup tanpa menentukan jenis penutup, tindakan mempermalukan, serta perbandingan dengan seorang perempuan yang telah dicukur. Bentuk “kepalanya telah dicukur” dengan wajar menjelaskan partisipel feminin perfektif ἐξυρημένῃ dan mempertahankan keadaan hasil pencukuran.'
