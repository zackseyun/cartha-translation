id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: id
  text: Sebab, jika seorang perempuan tidak menutupi kepalanya[a], biarlah rambutnya juga dipotong pendek. Namun, jika bagi seorang perempuan rambutnya dipotong pendek atau kepalanya dicukur merupakan suatu kehinaan, hendaklah ia menutupi kepalanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri” di seluruh ayat ini; kata Yunani gynē dapat berarti “perempuan” atau “istri”, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: tidak menutupi kepalanya / hendaklah ia menutupi kepalanya
  rationale: Verba ini berarti menutupi atau menyelubungi. Objek 'kepala' tersirat dari konteks dan dinyatakan agar maknanya jelas dalam bahasa Indonesia, tanpa menentukan jenis penutup tertentu.
- source_word: γυνή
  choice: perempuan
  rationale: Kata Yunani ini dapat berarti 'perempuan' atau 'istri'. Ayat ini tidak secara eksplisit menyebut pasangan suami-istri, sehingga 'perempuan' mempertahankan cakupan yang lebih umum; kemungkinan 'istri' dicatat dalam catatan kaki.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: biarlah rambutnya juga dipotong pendek / rambutnya dipotong pendek
  rationale: Verba ini menunjuk pada rambut yang digunting atau dipangkas pendek, bukan sekadar dirapikan. Ungkapan ini juga mempertahankan perbedaannya dari tindakan mencukur pada verba berikutnya.
- source_word: ξυρᾶσθαι
  choice: kepalanya dicukur
  rationale: Verba ini berarti dicukur. Penyebutan kepala membuat ungkapan Indonesia alami dan memperjelas kontras dengan rambut yang dipotong pendek.
- source_word: αἰσχρόν
  choice: suatu kehinaan
  rationale: Pilihan ini menyampaikan dimensi malu dan hilangnya kehormatan sosial yang terkandung dalam istilah Yunani, tanpa mereduksinya menjadi sekadar rasa malu pribadi.
- source_word: γὰρ ... δὲ
  choice: Sebab ... Namun
  rationale: Kedua penghubung ini mempertahankan alur alasan dan kontras dalam argumen Paulus.
- source_word: καί
  choice: juga
  rationale: '''Juga'' mempertahankan perkembangan retoris: jika tidak mau ditutupi, konsekuensi lanjutannya ialah rambutnya pun dipotong pendek.'
theological_decisions:
- issue: Apakah γυνή diterjemahkan 'perempuan' atau 'istri'
  choice: perempuan
  alternative: istri
  rationale: Tidak ada penyebutan suami secara eksplisit dalam ayat ini. 'Perempuan' tidak mempersempit cakupan pernyataan, sedangkan kemungkinan makna 'istri' tetap dipertahankan dalam catatan kaki.
- issue: Apakah κατακαλύπτω menentukan bentuk penutup kepala tertentu
  choice: menutupi kepala
  alternative: mengenakan kerudung / berselubung
  rationale: Teks menyatakan tindakan menutupi, tetapi tidak menetapkan nama atau bentuk pakaian tertentu. Terjemahan ini menjaga ketidakspesifikan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Dipotong pendek' dipakai untuk membedakan κείρω dari ξυράω ('dicukur'). Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
