  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: id
  text: Sebab setiap kali[a] kamu makan roti ini dan minum dari cawan[b], kamu memberitakan kematian Tuhan sampai Ia datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Setiap kali kamu makan roti ini dan minum dari cawan.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani memakai “cawan,” bukan “cawan ini,” meskipun konteks langsung menunjukkan cawan yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: setiap kali
  rationale: 'Gabungan ini menyatakan kejadian berulang yang tidak ditentukan: tiap kali tindakan itu dilakukan. “Setiap kali” alami dalam bahasa Indonesia dan mempertahankan daya iteratifnya.'
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini menghubungkan ayat tersebut sebagai penjelasan yang mendukung petunjuk sebelumnya.
- source_word: ἐσθίητε
  choice: kamu makan
  rationale: Subjungtif kini dalam klausa waktu tak tentu paling alami dinyatakan dengan bentuk biasa dalam bahasa Indonesia.
- source_word: ἄρτον τοῦτον
  choice: roti ini
  rationale: ἄρτος di sini secara wajar berarti “roti,” dan penunjuk τοῦτον diterjemahkan langsung sebagai “ini.”
- source_word: τὸ ποτήριον
  choice: cawan itu
  rationale: Teks Yunani memakai artikel, bukan kata penunjuk “ini.” Dalam bahasa Indonesia, “cawan itu” secara alami menunjuk kepada cawan yang telah disebut dalam konteks tanpa mengubahnya menjadi “cawan ini.”
- source_word: πίνητε
  choice: minum dari
  rationale: Bahasa Yunani memakai “cawan” sebagai objek secara metonimis. Bahasa Indonesia modern lebih alami memakai “minum dari cawan” sambil mempertahankan acuan yang sama.
- source_word: καταγγέλλετε
  choice: kamu memberitakan
  rationale: Kata ini menunjuk pada tindakan mengumumkan atau menyatakan secara terbuka. “Memberitakan” menjaga nuansa deklaratif yang khidmat.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: kematian Tuhan
  rationale: Susunan ini alami dan ringkas dalam bahasa Indonesia serta tetap mempertahankan penekanan khidmat pada kematian Tuhan.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: sampai Dia datang
  rationale: Klausa ini menyatakan batas waktu pemberitaan tersebut. Subjek tersiratnya secara kontekstual adalah Tuhan yang baru disebut.
theological_decisions:
- issue: Acuan subjek tersirat dalam ἄχρι οὗ ἔλθῃ
  choice: Kata “Dia” mengacu kepada Tuhan Yesus.
  alternative: Membiarkan subjek tanpa acuan eksplisit, yang tidak mungkin dilakukan secara alami dalam konstruksi bahasa Indonesia ini.
  rationale: Anteseden terdekat dan paling alami ialah “Tuhan” dalam klausa sebelumnya. Huruf kapital pada “Dia” mengikuti register Alkitab Indonesia dan memperjelas acuan tanpa menambahkan gelar yang tidak terdapat dalam teks.
- issue: Bahasa tentang Perjamuan Tuhan
  choice: Menyatakan secara langsung tindakan makan roti, minum dari cawan, dan memberitakan kematian Tuhan.
  alternative: Parafrasa yang secara khusus menegaskan pandangan sakramental atau memorialis.
  rationale: Ayat ini menyatakan bahwa tindakan tersebut memberitakan kematian Tuhan, tetapi tidak menjabarkan teologi lengkap tentang Perjamuan. Terjemahan tidak menyelesaikan ketegangan itu secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang kedua jamak dalam bahasa Yunani diterjemahkan “kamu,” yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak menurut konteks; di sini konteksnya adalah jemaat. Diksi “memberitakan” mempertahankan nada publik dan liturgis tanpa menjadi terlalu teknis.
