revisions:
- from: Sebab setiap kali[a] kamu makan roti ini dan minum dari cawan itu[b], kamu memberitakan kematian Tuhan sampai Dia datang.
  to: Sebab setiap kali[a] kamu makan roti ini dan minum dari cawan[b], kamu memberitakan kematian Tuhan sampai Ia datang.
  rationale: Revisi menghilangkan penunjuk “itu” yang tidak tersurat dalam τὸ ποτήριον, tetapi tetap mempertahankan rujukan definit kepada cawan dalam konteks Perjamuan. Catatan b disesuaikan agar tidak menyebut bentuk Indonesia yang tidak harfiah sebagai “secara harfiah.” Catatan a diperjelas untuk mempertahankan cakupan dan daya iteratif konstruksi Yunani.
