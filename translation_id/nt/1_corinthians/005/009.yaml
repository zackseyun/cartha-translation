  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: id
  text: Aku menulis[a] kepada kalian dalam surat itu[b] agar tidak bergaul dengan orang-orang yang tidak bermoral secara seksual.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah menulis kepada kalian.” Aoristus Yunani ini dapat diterjemahkan sebagai tindakan lampau sederhana; bentuk itu sendiri tidak memastikan apakah Paulus merujuk pada surat terdahulu atau pada surat ini.
    reason: alternative_reading
  - marker: b
    text: Atau, “dalam suratku.” Frasa Yunani ini dapat merujuk pada surat Paulus yang terdahulu atau pada surat ini sendiri pada bagian sebelumnya.
    reason: alternative_reading
  - marker: c
    text: Atau, “orang-orang cabul.” Kata Yunani πόρνοις menunjuk orang-orang yang dicirikan oleh ketidakbermoralan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Aku telah menulis
  rationale: Aoristus dapat menyatakan tindakan menulis yang sudah dilakukan dan masih menjadi acuan. Bentuk ini alami dalam bahasa Indonesia serta tidak menentukan apakah yang dimaksud ialah surat terdahulu atau bagian surat yang sedang dibaca.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina datif jamak menunjuk para penerima surat. 'Kalian' jelas membedakan bentuk jamak dalam bahasa Indonesia modern.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: dalam surat itu
  rationale: Artikel tertentu menunjuk surat yang diketahui para penerima. 'Surat itu' mempertahankan ketentuan rujukannya tanpa memutuskan apakah itu surat terdahulu atau surat ini.
- source_word: μὴ συναναμίγνυσθαι
  choice: agar jangan bergaul dengan
  rationale: Infinitif dengan μή menyampaikan isi larangan. 'Bergaul dengan' secara alami mengungkapkan gagasan bercampur atau menjalin pergaulan dengan orang lain.
- source_word: πόρνοις
  choice: orang-orang yang melakukan percabulan
  rationale: Kata benda jamak ini menunjuk orang yang dicirikan oleh perilaku seksual yang tidak bermoral. Pilihan ini jelas, personal, dan lebih wajar daripada istilah serapan atau bentuk yang arkais.
theological_decisions:
- issue: Rujukan 'surat itu'
  choice: Terjemahan menunjuk sebuah surat tertentu yang diketahui jemaat Korintus, tetapi tidak menentukan surat mana.
  alternative: Surat Paulus yang lebih awal dan kini tidak tersedia; atau bagian terdahulu dari 1 Korintus sendiri.
  rationale: Frasa Yunani ἐν τῇ ἐπιστολῇ bersifat tertentu, tetapi tidak menyelesaikan persoalan historis tersebut. Ambiguitasnya dipertahankan.
- issue: Cakupan larangan bergaul
  choice: Ayat diterjemahkan sebagai larangan tanpa menambahkan batas cakupan di dalam ayat ini.
  alternative: Membatasi langsung larangan kepada orang tidak bermoral di dalam jemaat berdasarkan ayat-ayat berikutnya.
  rationale: Ayat 9 sendiri belum menyatakan pembatasan itu; penjelasan dan koreksi cakupannya berkembang dalam konteks berikutnya. Terjemahan tidak boleh memasukkan penjelasan ayat lain secara prematur.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Aku' dipakai untuk suara pribadi Paulus, sedangkan 'kalian' mempertahankan bentuk jamak penerima. Istilah 'percabulan' dipilih sebagai istilah etis yang cukup luas dan lazim dalam register Alkitab Indonesia; catatan kaki mempertahankan alternatif leksikal dan ambiguitas rujukan surat.
