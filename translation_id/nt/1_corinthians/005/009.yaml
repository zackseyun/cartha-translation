  naturalness: '"Aku menulis kepada kalian dalam surat itu agar tidak bergaul dengan orang-orang yang tidak bermoral secara seksual" adalah bahasa Indonesia modern yang jelas dan tetap bernada layak. Pilihan ini lebih idiomatis dan lebih luas secara semantis daripada "orang-orang yang melakukan percabulan."'
  terminology: '"Tidak bermoral secara seksual" menyampaikan cakupan πόρνοις secara transparan. Alternatif "orang-orang cabul" dicatat, tetapi tidak dijadikan teks utama karena dalam pemakaian modern dapat terasa lebih sempit atau bernuansa tuduhan kasar. "Bergaul dengan" menangkap συναναμίγνυσθαι tanpa menambahkan batasan konteks yang baru dijelaskan pada ayat-ayat berikutnya.'
