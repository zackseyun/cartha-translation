  terminology: “Ragi,” “adonan,” dan “mengembang” sesuai dengan gambaran pembuatan roti dan dapat dipahami pembaca modern. Catatan kaki sebaiknya dinyatakan sebagai alternatif terjemahan, bukan sebagai klaim bahwa terjemahan utama kurang harfiah.
