base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: id
  text: Sikap bermegah kalian itu tidak baik. Tidakkah kalian tahu bahwa sedikit ragi membuat seluruh adonan[a] mengembang?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh gumpalan adonan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: baik
  rationale: Kata ini menilai kebanggaan jemaat secara moral dan praktis; “baik” langsung, alami, dan tidak mempersempit maknanya.
- source_word: καύχημα
  choice: kebanggaan
  rationale: Bentuk nomina ini dapat menunjuk pada tindakan bermegah ataupun hal yang dibanggakan. “Kebanggaan” mempertahankan keluasan itu lebih baik daripada parafrasa yang secara khusus berarti membanggakan diri.
- source_word: οὐκ οἴδατε
  choice: Tidakkah kalian tahu
  rationale: Ungkapan ini mempertahankan bentuk pertanyaan retoris Paulus. “Kalian” menyatakan bahwa pronomina Yunani tersebut berbentuk jamak dan ditujukan kepada jemaat.
- source_word: μικρὰ ζύμη
  choice: sedikit ragi
  rationale: Ungkapan ringkas ini alami dalam bahasa Indonesia dan mempertahankan gambaran pembuatan roti serta daya ungkapan pepatahnya.
- source_word: ὅλον τὸ φύραμα
  choice: seluruh adonan
  rationale: φύραμα menunjuk pada adonan yang telah dicampur, sedangkan ὅλον menekankan keseluruhannya. “Seluruh adonan” jelas bagi pembaca modern.
- source_word: ζυμοῖ
  choice: membuat ... mengembang
  rationale: Terjemahan ini mengungkapkan secara alami pengaruh ragi pada seluruh adonan. Bentuk “meragikan” atau “mengkhamirkan” lebih dekat secara morfologis, tetapi kurang lazim bagi pembaca Indonesia masa kini.
theological_decisions:
- issue: Gambaran metaforis tentang ragi
  choice: Mempertahankan gambaran ragi dan adonan tanpa menjelaskan rujukan moralnya di dalam ayat.
  alternative: Memperluasnya secara interpretatif menjadi “sedikit dosa merusak seluruh jemaat.”
  rationale: Paulus menyampaikan pernyataan bernuansa pepatah; konteks menerangkan penerapannya, sedangkan ayat ini sendiri mempertahankan metaforanya.
- issue: Makna καύχημα
  choice: Menggunakan “kebanggaan” yang dapat mencakup tindakan bermegah maupun hal yang dibanggakan.
  alternative: Menggunakan “sikap membanggakan diri” atau “alasan untuk berbangga.”
  rationale: Kedua alternatif menentukan salah satu sisi makna nomina Yunani, sedangkan teks memungkinkan ketegangan leksikal tersebut tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai bentuk Yunani. Susunan kalimat dibuat alami dan tegas, dengan nada teguran Paulus tetap terpelihara. Penanda catatan kaki ditempatkan sesudah “adonan,” yaitu pada frasa yang memiliki alternatif leksikal.
