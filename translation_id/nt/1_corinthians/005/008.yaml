id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: id
  text: Karena itu, marilah kita merayakan hari raya[a], bukan dengan ragi lama, juga bukan dengan ragi keburukan dan kejahatan, melainkan dengan roti tidak beragi[b], yaitu ketulusan dan kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merayakan perayaan itu” atau “menjalankan hari raya itu.” Bahasa Yunani meneruskan gambaran perayaan Paskah dari ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal yang tidak beragi berupa ketulusan dan kebenaran.” Kata “roti” dilengkapi agar gambaran Paskah jelas dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ἑορτάζωμεν
  choice: marilah kita merayakan hari raya
  rationale: Bentuk subjungtif ini menyatakan ajakan. Pilihan ini mempertahankan gambaran perayaan Paskah dari ayat sebelumnya, bukan sekadar gagasan bersukacita secara umum.
- source_word: ζύμῃ παλαιᾷ
  choice: dengan ragi lama
  rationale: Ragi mempertahankan gambaran harfiah sekaligus metaforis dalam konteks Paskah; 'dengan' lebih alami dalam bahasa Indonesia daripada padanan harfiah 'di dalam'.
- source_word: κακίας καὶ πονηρίας
  choice: keburukan dan kejahatan
  rationale: Mempertahankan dua nomina moral yang berdekatan tanpa menyamakannya sepenuhnya; κακία menunjuk pada keburukan watak atau niat, sedangkan πονηρία lebih tegas menunjuk pada kejahatan.
- source_word: ἀζύμοις
  choice: roti tidak beragi
  rationale: Secara harfiah bentuk ini berarti 'hal-hal yang tidak beragi'; kata 'roti' dilengkapi karena konteks perayaan Paskah membuat acuannya jelas dan menjaga gambaran tersebut tetap mudah dipahami.
- source_word: εἰλικρινείας καὶ ἀληθείας
  choice: ketulusan dan kebenaran
  rationale: Mengungkapkan kemurnian atau kejujuran yang tidak tercampur dan kebenaran, sebagai lawan dari pengaruh ragi yang merusak.
theological_decisions:
- issue: Gambaran perayaan Paskah dalam nasihat Paulus
  choice: Mempertahankan bahasa perayaan dan roti tidak beragi
  alternative: Menerjemahkan secara umum sebagai 'marilah kita merayakannya' atau secara abstrak sebagai 'dengan ketulusan dan kebenaran yang tidak beragi'
  rationale: Konteks langsung menyebut Kristus sebagai anak domba Paskah. Karena itu, gambaran hari raya dan roti tidak beragi merupakan bagian penting dari alur argumen Paulus dan tidak seharusnya diratakan menjadi nasihat moral umum.
- issue: Hubungan ketulusan dan kebenaran dengan roti tidak beragi
  choice: Memakai 'yaitu' untuk menunjukkan isi metaforis roti tidak beragi
  alternative: Memakai konstruksi lebih harfiah 'roti tidak beragi dari ketulusan dan kebenaran'
  rationale: Genitif Yunani memungkinkan gambaran padat yang terasa janggal bila disalin mentah-mentah ke bahasa Indonesia. 'Yaitu' memperjelas bahwa ketulusan dan kebenaran adalah padanan moral dari roti tidak beragi tanpa menghapus metaforanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ajakan 'marilah kita' mempertahankan nada komunal Paulus. Istilah 'hari raya', 'ragi', dan 'roti tidak beragi' menjaga rangkaian metafora Paskah, sedangkan struktur kalimat dibuat alami bagi pembaca umum.
source_grounding:
  english_pob_role: consult_only
