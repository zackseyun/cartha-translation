source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: id
  text: menyerahkan orang seperti itu kepada Iblis untuk kehancuran daging[a], supaya roh diselamatkan pada hari Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keruntuhan daging.” Ungkapan ini dapat menunjuk pada hukuman jasmani yang berat, atau secara lebih kiasan pada kehancuran orientasi hidup orang itu yang dikuasai daging dan dosa.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi “Tuhan kita Yesus” atau “Tuhan Yesus”, bukan hanya “Tuhan”.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: menyerahkan
  rationale: Infinitif aoris ini menyatakan tindakan yang harus dilakukan jemaat. “Menyerahkan” alami dalam bahasa Indonesia dan mempertahankan gagasan menyerahkan seseorang ke dalam kuasa pihak lain.
- source_word: τὸν τοιοῦτον
  choice: orang seperti itu
  rationale: Ungkapan ini menunjuk kepada pelanggar tertentu sekaligus mempertahankan nada kategoris bahasa Yunani, tanpa menambahkan nama atau keterangan lain.
- source_word: Σατανᾷ
  choice: Satan
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: εἰς ὄλεθρον
  choice: untuk kehancuran
  rationale: ὄλεθρος dapat berarti kehancuran, kebinasaan, atau keruntuhan. “Kehancuran” mempertahankan kerasnya tindakan itu tanpa menentukan secara sempit apakah akibatnya berupa kematian, penderitaan jasmani, atau keruntuhan dalam arti lain.
- source_word: τῆς σαρκός
  choice: daging
  rationale: “Daging” mempertahankan ambiguitas σάρξ antara tubuh jasmani dan orientasi hidup yang dikuasai dosa. Terjemahan tidak mempersempitnya menjadi “tubuh” atau “tabiat berdosa”.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang dimaksudkan; “supaya” menyampaikan daya telis tersebut secara alami.
- source_word: τὸ πνεῦμα
  choice: roh itu
  rationale: Bahasa Yunani memakai artikel tetapi tidak memakai pronomina posesif. “Roh itu” mempertahankan rujukan tertentu tanpa menambahkan “-nya”, meskipun konteks sangat mungkin menunjuk kepada roh pelanggar tersebut.
- source_word: σωθῇ
  choice: diselamatkan
  rationale: Bentuk pasif subjungtif ini menyatakan hasil yang dituju. “Diselamatkan” mempertahankan bahasa keselamatan dan bentuk pasifnya.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: pada hari
  rationale: “Pada hari” merupakan ungkapan waktu yang alami dalam bahasa Indonesia, khususnya dalam konteks eskatologis.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Teks SBLGNT hanya memuat κυρίου. Terjemahan mengikuti teks itu tanpa menambahkan “Yesus” atau “kita”.
theological_decisions:
- issue: Makna “kehancuran daging”
  choice: Mempertahankan frasa ambigu “kehancuran daging” dalam teks utama.
  alternative: Hukuman atau kematian jasmani; atau kehancuran orientasi hidup orang itu yang dikuasai dosa.
  rationale: Bahasa Yunani tidak memaksa satu penafsiran saja. Frasa utama mempertahankan ketegangan antara akibat jasmani yang berat dan penghancuran kecenderungan berdosa.
- issue: Rujukan “roh itu”
  choice: Tidak menambahkan pronomina posesif “-nya”.
  alternative: “rohnya”
  rationale: Konteks sangat mungkin merujuk kepada roh pelanggar itu, tetapi teks Yunani tidak memiliki pronomina posesif. Bentuk terpilih mempertahankan batas informasi dalam teks sumber.
- issue: Ungkapan eskatologis “hari Tuhan”
  choice: Menerjemahkan τοῦ κυρίου tepat sebagai “Tuhan”.
  alternative: “hari Tuhan Yesus” atau “hari Tuhan kita Yesus”
  rationale: Bacaan dasar yang diberikan hanya memuat “Tuhan”; perluasan yang terdapat dalam sebagian naskah dicatat dalam catatan kaki dan tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada ringkas dan bermartabat. Struktur infinitif dipertahankan karena ayat ini melanjutkan kalimat dari konteks sebelumnya. Istilah “daging” dan “roh” sengaja dipertahankan untuk menjaga ambiguitas dan ketegangan teologis teks sumber.
