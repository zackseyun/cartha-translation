  to: Sebab aku, walaupun tidak hadir secara jasmani, namun hadir dalam roh[a], sudah menjatuhkan putusan[b], seolah-olah aku hadir, terhadap orang yang telah melakukan perbuatan ini dengan cara sedemikian.
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia dan penegasan yang lebih alami atas gabungan οὕτως τοῦτο. Makna penilaian Paulus yang sudah ditetapkan, kontras jasmani–roh, dan ambiguitas yang wajar mengenai “dalam roh” tetap dipertahankan.
