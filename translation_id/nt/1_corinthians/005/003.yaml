id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: id
  text: Sebab aku, walaupun tidak hadir secara jasmani, namun hadir dalam roh[a], sudah menjatuhkan putusan[b], seolah-olah aku hadir, terhadap orang yang telah melakukan perbuatan ini dengan cara sedemikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “hadir dalam roh” kemungkinan besar merujuk kepada roh Paulus sendiri, bukan kepada Roh Kudus.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sudah menghakimi” atau “sudah mengambil keputusan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelas dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἀπὼν τῷ σώματι
  choice: tidak hadir secara jasmani
  rationale: Menyampaikan ketidakhadiran fisik Paulus tanpa memberi kesan bahwa rohnya terpisah dari tubuh karena kematian.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: tetapi hadir dalam roh
  rationale: Mempertahankan kontras ringkas antara tubuh dan roh serta tidak menghilangkan kemungkinan nuansa rohani dalam ungkapan Yunani.
- source_word: ἤδη κέκρικα
  choice: sudah menjatuhkan putusan
  rationale: Bentuk perfektum menunjukkan keputusan yang telah diambil dan tetap berlaku; ungkapan ini sesuai dengan konteks penanganan disipliner.
- source_word: ὡς παρὼν
  choice: seolah-olah aku hadir
  rationale: Mempertahankan daya perbandingan ὡς dan menjelaskan bahwa putusan Paulus berlaku seperti putusan orang yang hadir.
- source_word: τὸν ... κατεργασάμενον
  choice: terhadap orang yang telah melakukan
  rationale: Partisip substantival menunjuk kepada pelaku tanpa perlu menambahkan kata 'laki-laki'; bentuk perfektif Indonesia menyatakan tindakan yang sudah dilakukan.
- source_word: οὕτως τοῦτο
  choice: hal ini dengan cara demikian
  rationale: Menerjemahkan baik τοῦτο, yang menunjuk kepada perbuatan itu, maupun οὕτως, yang menyoroti cara atau sifat pelaksanaannya, tanpa meleburkan keduanya.
theological_decisions:
- issue: Makna 'hadir dalam roh'
  choice: 'Ungkapan dipertahankan, dengan catatan bahwa kemungkinan terbesar ialah roh Paulus sendiri: ia tidak hadir secara fisik, tetapi hadir secara nonjasmani dalam perhatian, solidaritas, dan penilaiannya.'
  alternative: Paulus merujuk kepada kehadiran atau penerangan Roh Kudus, atau mengklaim suatu bentuk kehadiran mistis yang lebih kuat.
  rationale: Kontras langsung antara σώματι dan πνεύματι paling alami menunjuk kepada tubuh dan roh Paulus sendiri. Terjemahan tidak memasukkan teori tertentu mengenai cara kehadiran rohani tersebut.
- issue: Daya hukum κέκρικα
  choice: menjatuhkan putusan
  alternative: menghakimi; telah mengambil keputusan
  rationale: Konteksnya menyangkut penilaian dan tindakan disipliner jemaat. Pilihan ini menyatakan keputusan yang telah ditetapkan tanpa menentukan secara berlebihan bentuk hukuman akhirnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kontras tubuh–roh dipertahankan, sedangkan tanda pisah membantu pembaca mengikuti keterangan “seolah-olah aku hadir” tanpa mengaburkan objek putusan.
