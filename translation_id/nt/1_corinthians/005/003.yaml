  naturalness: “Meskipun ... tetapi ...” dapat dipahami, tetapi dalam ragam baku modern “walaupun ... namun ...” lebih rapi. Susunan kalimat juga lebih lancar apabila keterangan “seolah-olah aku hadir” diletakkan di antara koma, tanpa tanda pisah yang memberi penekanan berlebih.
  terminology: “Secara jasmani,” “dalam roh,” dan “menjatuhkan putusan” sesuai dengan register surat Paulus dan tidak memaksakan tafsiran doktrinal. Catatan untuk “dalam roh” dengan tepat menyebut pembacaan yang paling mungkin sambil tidak menutup kemungkinan lain. Alternatif “menghakimi” untuk κέκρικα tetap berguna.
