id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: id
  text: Dalam nama Tuhan kita Yesus, ketika kamu berkumpul dan rohku hadir bersama kamu, dengan kuasa Tuhan kita Yesus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Dalam nama
  rationale: Mempertahankan idiom Yunani yang wajar dalam bahasa Indonesia dan menyiratkan tindakan di bawah wewenang Yesus tanpa mempersempit nuansanya menjadi sekadar 'dengan wewenang'.
- source_word: κυρίου
  choice: Tuhan
  rationale: Gelar baku yang mempertahankan bobot kristologis κύριος dalam Perjanjian Baru.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: συναχθέντων ὑμῶν
  choice: ketika kamu berkumpul
  rationale: Partisip aoris pasif dalam konstruksi genitif absolut diterjemahkan sebagai klausa temporal yang alami. Bentuk ini tidak memaksakan penekanan pada pelaku yang mengumpulkan mereka.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: rohku hadir bersama kamu
  rationale: Ungkapan Yunani bersifat eliptis; penambahan 'hadir bersama kamu' menyatakan partisipasi Paulus yang bukan secara jasmani dengan jelas tanpa menjelaskan mekanismenya.
- source_word: σὺν
  choice: dengan
  rationale: Menyampaikan makna penyertaan secara ringkas dan alami.
- source_word: δυνάμει
  choice: kuasa
  rationale: Menunjuk pada daya efektif yang bekerja dalam tindakan jemaat dan tidak dipersempit menjadi wewenang formal semata.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Tuhan kita Yesus
  rationale: Konstruksi posesif setelah 'kuasa' dipertahankan melalui susunan Indonesia 'kuasa Tuhan kita Yesus', sehingga nuansa kepunyaan atau sumber tetap terbuka.
theological_decisions:
- issue: Hakikat kehadiran Paulus dalam perhimpunan
  choice: Paulus menyatakan bahwa rohnya hadir bersama jemaat dalam arti yang nyata tetapi tidak bersifat jasmani.
  alternative: Ungkapan itu hanya merujuk pada sikap atau maksud Paulus; atau sebaliknya, menyatakan suatu kehadiran mistis yang mekanismenya dapat dijelaskan secara khusus.
  rationale: Teks menegaskan partisipasi Paulus yang tidak secara jasmani, tetapi tidak menerangkan mekanismenya. Terjemahan mempertahankan ketegangan tersebut tanpa memasukkan penafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan klausa dipertahankan dekat dengan teks Yunani karena ayat ini berlanjut secara sintaksis ke ayat berikutnya; koma akhir menandakan bahwa kalimat belum selesai.
