id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: id
  text: Yang saya maksud sama sekali bukan orang-orang cabul di dunia ini, atau orang-orang serakah dan perampas[a], atau para penyembah berhala[b], sebab kalau begitu kamu harus keluar dari dunia ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemeras” atau “perampok”; kata Yunani ἅρπαξ dapat menunjuk kepada orang yang merebut milik orang lain dengan kekerasan, tekanan, atau eksploitasi.
    reason: lexical_alternative
  - marker: b
    text: Paulus sedang menjelaskan bahwa ia tidak bermaksud agar orang percaya menghindari semua orang tidak bermoral di luar jemaat; bandingkan penerapannya dalam 1 Korintus 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Yang saya maksud sama sekali bukan
  rationale: Dalam konteks ini Paulus sedang memperjelas perintah sebelumnya, bukan melarang segala hubungan dengan semua orang berdosa di luar jemaat. Ungkapan ini mempertahankan penyangkalan yang tegas sekaligus menghasilkan bahasa Indonesia yang alami.
- source_word: πόρνοις
  choice: orang-orang cabul
  rationale: Istilah ini menunjuk kepada orang yang melakukan percabulan atau tindakan seksual yang tidak bermoral. Pilihan ini ringkas, jelas, dan mempertahankan kekhususan seksualnya.
- source_word: τοῦ κόσμου τούτου
  choice: di dunia ini
  rationale: κόσμος di sini merujuk pada lingkungan masyarakat manusia di luar jemaat. Frasa ini alami dalam bahasa Indonesia dan sesuai dengan pengulangan κόσμος pada akhir ayat.
- source_word: πλεονέκταις
  choice: orang-orang serakah
  rationale: Kata ini menggambarkan orang yang selalu menginginkan lebih, sering kali dengan merugikan orang lain. 'Serakah' merupakan padanan modern yang mudah dipahami.
- source_word: ἅρπαξιν
  choice: perampas
  rationale: ἅρπαξ dapat menunjuk kepada orang yang merebut milik orang lain dengan kekerasan, tekanan, atau eksploitasi. 'Perampas' mempertahankan gambaran mengambil dari orang lain tanpa membatasinya pada penipuan saja.
- source_word: εἰδωλολάτραις
  choice: para penyembah berhala
  rationale: Padanan ini lebih langsung dan mudah dipahami daripada bentuk nomina teknis 'penyembah-penyembah berhala', serta menyatakan tindakan penyembahan yang dimaksud.
- source_word: ἐπεὶ
  choice: sebab kalau begitu
  rationale: Kata ini memperkenalkan akibat yang akan timbul bila larangan sebelumnya dipahami secara mutlak. Ungkapan Indonesia ini menyampaikan hubungan logis tersebut dengan jelas.
- source_word: ὠφείλετε
  choice: kamu harus
  rationale: Dalam argumen yang bersifat pengandaian ini, bentuk tersebut menyatakan keharusan praktis. 'Harus' menyampaikan daya kewajibannya secara alami.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: keluar dari dunia ini
  rationale: 'Padanan ini mempertahankan gambaran yang sengaja tegas: untuk menghindari semua orang seperti itu, mereka harus meninggalkan dunia itu sendiri.'
theological_decisions:
- issue: Cakupan pemisahan yang diperintahkan dalam konteks sekitarnya
  choice: Paulus menyangkal bahwa perintah sebelumnya menuntut pemisahan total dari orang-orang tidak bermoral di luar jemaat.
  alternative: Paulus memerintahkan penarikan diri sepenuhnya dari semua orang yang tidak bermoral.
  rationale: Ayat ini menyatakan bahwa pemahaman mutlak semacam itu akan mengharuskan orang percaya keluar dari dunia. Terjemahan mempertahankan fungsi klarifikasi ini tanpa menghilangkan tuntutan yang secara khusus diterapkan kepada lingkungan jemaat dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan lugas. Sapaan jamak tetap memakai 'kamu' sesuai pemakaian Indonesia modern; konteks menunjukkan bahwa seluruh jemaat disapa. Susunan daftar dan pengulangan 'dunia ini' dipertahankan agar alur argumen Paulus tetap jelas.
