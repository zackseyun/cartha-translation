  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: id
  text: Buanglah ragi yang lama, supaya kamu menjadi adonan baru, sebagaimana kamu tidak beragi. Sebab Mesias,[b] anak domba Paskah kita,[a] telah dikurbankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Paskah kita telah dikurbankan, Mesias.” Teks Yunani menyebut “Paskah kita,” yang dalam konteks ini dapat dipahami sebagai ungkapan singkat untuk anak domba atau kurban Paskah.
    reason: lexical_alternative
  - marker: b
    text: Yunani Christos; di sini diterjemahkan “Mesias” karena maknanya sebagai gelar menonjol dalam konteks Paskah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Buanglah
  rationale: Imperatif aoristus orang kedua jamak ini memerintahkan penyingkiran secara tuntas. “Buanglah” alami dalam bahasa Indonesia dan sesuai dengan gambaran membersihkan adonan dari ragi lama.
- source_word: τὴν παλαιὰν ζύμην
  choice: ragi yang lama itu
  rationale: “Ragi” mempertahankan gambaran Paskah dan pengaruh yang meresap; “yang lama itu” menunjukkan sesuatu dari keadaan terdahulu yang harus disingkirkan.
- source_word: ἵνα ἦτε
  choice: supaya kamu menjadi
  rationale: Frasa ini menyatakan tujuan atau hasil yang dimaksud. “Menjadi” terdengar alami dengan “adonan yang baru” dan tidak menghapus ketegangan dengan identitas mereka yang sudah disebut tidak beragi.
- source_word: νέον φύραμα
  choice: adonan yang baru
  rationale: φύραμα menunjuk pada segumpal atau satu adonan. Pilihan ini jelas bagi pembaca Indonesia dan mempertahankan metafora pembuatan roti.
- source_word: καθώς ἐστε ἄζυμοι
  choice: sebagaimana kamu memang tidak beragi
  rationale: καθώς dipertahankan sebagai perbandingan, sedangkan “memang” menegaskan keadaan mereka sekarang tanpa mengubahnya menjadi alasan kausal yang eksplisit.
- source_word: τὸ πάσχα ἡμῶν
  choice: anak domba Paskah kita
  rationale: Secara harfiah frasa ini berbunyi “Paskah kita,” tetapi bersama verba “dikurbankan” πάσχα menunjuk pada kurban Paskah, khususnya anak dombanya. Penjelasan implisit ini dibuat eksplisit demi kejelasan, dengan alternatif harfiah dicatat.
- source_word: ἐτύθη
  choice: telah dikurbankan
  rationale: Bentuk pasif aoristus θύω menyatakan penyembelihan sebagai kurban. “Telah dikurbankan” mempertahankan makna ritual serta peristiwa yang sudah terjadi.
- source_word: Χριστός
  choice: Mesias
  rationale: Dalam konteks tipologi Paskah, Χριστός menonjol sebagai gelar, sehingga “Mesias” menyampaikan fungsi gelarnya lebih jelas daripada bentuk nama “Kristus”.
theological_decisions:
- issue: Makna πάσχα ketika diterapkan kepada Mesias
  choice: anak domba Paskah kita
  alternative: Paskah kita; kurban Paskah kita
  rationale: Teks Yunani menyebut “Paskah kita,” sementara “telah dikurbankan” mengaktifkan arti kurban atau anak domba Paskah. “Anak domba Paskah” membuat rujukan itu jelas tanpa mengubah identifikasi tipologis Paulus; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Kerangka Paskah menonjolkan Χριστός sebagai gelar. “Mesias” mempertahankan arti gelar itu, sementara bentuk Yunani dan alternatif tradisional dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Metafora ragi, adonan, dan keadaan tidak beragi dipertahankan. Kata “memang” membantu menjaga ketegangan antara perintah untuk menjadi adonan baru dan pernyataan bahwa para pembaca sudah tidak beragi.
