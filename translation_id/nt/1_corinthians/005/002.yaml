id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: id
  text: Kalian malah membusungkan diri! Bukankah seharusnya kalian berdukacita agar orang yang melakukan perbuatan itu disingkirkan[a] dari tengah-tengah kalian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diambil dari tengah-tengah kalian.” Dalam konteks, ungkapan ini kemungkinan menunjuk pada penyingkiran dari jemaat melalui disiplin.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: membusungkan diri
  rationale: Ungkapan ini mempertahankan metafora tentang keadaan yang menggelembung oleh kesombongan serta menyampaikan keadaan yang telah menetap, sesuai bentuk perfektum.
- source_word: οὐχὶ μᾶλλον
  choice: Bukankah seharusnya ...
  rationale: Bentuk pertanyaan retoris ini menyampaikan teguran dan mengontraskan sikap mereka dengan tanggapan yang semestinya.
- source_word: ἐπενθήσατε
  choice: berdukacita
  rationale: Pilihan ini mempertahankan kuatnya bahasa perkabungan, bukan sekadar rasa sedih biasa, dan cocok untuk tanggapan komunal yang dituntut dalam konteks.
- source_word: ἵνα ἀρθῇ
  choice: agar ... disingkirkan
  rationale: Kata 'agar' mempertahankan nuansa tujuan atau hasil yang dimaksudkan, sedangkan bentuk pasif 'disingkirkan' mencerminkan bentuk pasif Yunani tanpa menentukan pelakunya.
- source_word: ἐκ μέσου ὑμῶν
  choice: dari tengah-tengah kalian
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran pengeluaran seseorang dari lingkungan komunitas.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: orang yang melakukan perbuatan itu
  rationale: Terjemahan ini mengidentifikasi pelaku tanpa menambahkan rincian yang tidak dinyatakan dalam frasa tersebut dan mempertahankan bobot moral dari ἔργον.
theological_decisions:
- issue: Sifat tindakan yang diminta terhadap pelaku
  choice: disingkirkan dari tengah-tengah kalian
  alternative: dikeluarkan dari jemaat; diambil oleh Allah
  rationale: Bentuk pasif ἀρθῇ sendiri tidak menyebut pelaku atau mekanisme tindakan. Konteks ayat 3–5 dan 13 mendukung disiplin komunitas, tetapi terjemahan tetap cukup luas dan tidak secara eksplisit menetapkan ekskomunikasi ataupun kematian sebagai tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak eksplisit 'kalian'. Kalimat pertama dibuat sebagai seruan untuk menangkap tajamnya teguran Paulus, sedangkan pertanyaan kedua mempertahankan daya retoris teks Yunani. Metafora 'membusungkan diri' dipertahankan karena alami dan mudah dipahami.
