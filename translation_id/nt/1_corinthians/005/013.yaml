base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: id
  text: Namun, Allah menghakimi orang-orang di luar[a][b]. Singkirkanlah orang yang jahat itu dari tengah-tengah kamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang luar.”'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunani berbentuk kini, “menghakimi”; sebagian terjemahan menerjemahkannya “akan menghakimi” berdasarkan konteks.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “Usirlah orang jahat itu dari tengah-tengah kamu.” Susunan katanya menggemakan rumusan dalam Ulangan tentang menyingkirkan kejahatan dari tengah umat perjanjian.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: orang-orang di luar
  rationale: Adverbia berartikel ini berfungsi sebagai nomina dan menunjuk kepada orang-orang di luar komunitas jemaat. Pilihan ini mempertahankan sudut pandang relasional teks tanpa menambahkan keterangan yang tidak tersurat.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan ringan dengan pembicaraan sebelumnya tentang orang-orang di dalam jemaat; 'Namun' menyampaikan peralihan kontras itu secara wajar.
- source_word: κρίνει
  choice: menghakimi
  rationale: Bentuknya adalah indikatif kini. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga 'menghakimi' mempertahankan pernyataan kini atau umum tanpa memaksakan arti masa depan.
- source_word: ἐξάρατε
  choice: Singkirkanlah
  rationale: Imperatif aoris ini menuntut tindakan tegas. 'Singkirkanlah' menyatakan pengeluaran dari komunitas tanpa memasukkan tata cara gerejawi yang tidak disebutkan teks.
- source_word: τὸν πονηρὸν
  choice: orang yang jahat itu
  rationale: Adjektiva substantival maskulin tunggal berartikel ini menunjuk secara konkret kepada pelaku dalam konteks. Dalam bahasa Indonesia, 'orang yang jahat itu' alami, tetap spesifik, dan tidak perlu memaksakan penandaan gender yang tidak lazim.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: dari tengah-tengah kamu
  rationale: Ungkapan ini menyatakan penyingkiran dari dalam komunitas. Pilihan ini jelas dan idiomatis dalam bahasa Indonesia serta mempertahankan dimensi komunalnya.
theological_decisions:
- issue: Hakikat perintah mengenai disiplin jemaat
  choice: Ayat ini memerintahkan jemaat menyingkirkan pelaku kejahatan dari tengah komunitas, sedangkan penghakiman atas orang-orang di luar diserahkan kepada Allah.
  alternative: Perintah itu dapat dibaca secara lebih umum sebagai menyingkirkan kejahatan dari komunitas tanpa secara tegas menunjuk pada pengeluaran seseorang.
  rationale: Konteks 1 Korintus 5 membahas seorang pelaku tertentu di dalam jemaat dan membedakan tanggung jawab jemaat terhadap orang di dalam dari penghakiman Allah atas orang di luar. Terjemahan menyampaikan tindakan komunal tersebut tanpa memasukkan istilah kelembagaan gereja yang tidak terdapat dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. 'Orang-orang di luar' mudah dipahami sekaligus mempertahankan perspektif batas komunitas. Akhiran '-lah' pada imperatif memberi ketegasan yang wajar, bukan kesantunan. Semua penanda catatan kaki ditempatkan tepat pada klausa yang dijelaskannya.
