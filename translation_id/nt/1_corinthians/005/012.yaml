  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: id
  text: Sebab, apa urusanku menghakimi orang-orang di luar?[a] Bukankah orang-orang di dalam[b] yang kamu hakimi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab, apa perlunya bagiku menghakimi orang-orang di luar?”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, orang-orang di dalam komunitas jemaat.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Sebab, apa urusanku
  rationale: Ungkapan ini menanyakan apa sangkut paut atau kepentingan hal tersebut bagi Paulus. Pilihan ini alami dalam bahasa Indonesia, mempertahankan daya retoris pertanyaan, dan menerjemahkan γάρ sebagai “sebab” sesuai kaitannya dengan argumen sebelumnya.
- source_word: τοὺς ἔξω
  choice: orang-orang di luar
  rationale: Bentuk substantival ini menunjuk kepada orang yang berada di luar komunitas Kristen, bukan sekadar berada di luar suatu tempat secara fisik. Ungkapan ini juga mempertahankan pasangan kontrasnya dengan “orang-orang di dalam”.
- source_word: κρίνειν / κρίνετε
  choice: menghakimi / kamu hakimi
  rationale: Dalam konteks pasal ini, κρίνω berkaitan dengan penilaian yang berujung pada tindakan disiplin komunitas. “Menghakimi” mempertahankan keluasan istilah Yunani tanpa mempersempitnya menjadi sekadar menilai atau memeriksa.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: οὐχί memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif. “Bukankah” menyampaikan bentuk dan tekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: τοὺς ἔσω
  choice: orang-orang di dalam
  rationale: Ungkapan ini merupakan lawan langsung dari “orang-orang di luar” dan menunjuk kepada anggota komunitas jemaat. Makna komunitas diterangkan dalam catatan kaki agar teks utama tetap mempertahankan metafora ruang dari bahasa Yunani.
- source_word: ὑμεῖς κρίνετε
  choice: yang kamu hakimi
  rationale: Terjemahan ini mempertahankan bentuk pertanyaan retoris dan bentuk kini indikatif Yunani. Dalam konteksnya, kalimat itu dapat menyiratkan tanggung jawab atau kewajiban tanpa mengubahnya secara eksplisit menjadi bentuk “harus”.
theological_decisions:
- issue: Ruang lingkup penghakiman yang dibicarakan Paulus
  choice: Kontras antara orang di luar dan orang di dalam komunitas jemaat dipertahankan sebagai konteks disiplin internal.
  alternative: Memahaminya sebagai pernyataan umum tentang segala bentuk penilaian moral terhadap siapa pun.
  rationale: Konteks 1 Korintus 5:9–13 membahas tanggung jawab jemaat terhadap anggotanya. Terjemahan tidak memperluas ayat ini menjadi doktrin menyeluruh tentang semua bentuk penilaian moral.
- issue: Daya indikatif atau kewajiban dalam ὑμεῖς κρίνετε
  choice: Mempertahankan bentuk “yang kamu hakimi” dalam pertanyaan retoris.
  alternative: “yang harus kamu hakimi” atau “yang seharusnya kamu hakimi”.
  rationale: Bentuk Yunani secara gramatikal adalah indikatif, meskipun konteks dapat memberinya daya kewajiban. Pilihan utama mempertahankan ketegangan itu dan tidak menjadikan implikasi kontekstual sebagai perintah eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang lugas dan bermartabat. Bentuk “apa urusanku” dipilih sebagai ungkapan idiomatis yang mudah dipahami, sedangkan pasangan “di luar/di dalam” dipertahankan agar struktur kontras bahasa Yunani tetap terlihat.
