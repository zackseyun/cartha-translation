id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: id
  text: Tetapi sekarang aku menulis kepada kalian supaya jangan bergaul dengan orang yang disebut saudara, jika ia hidup dalam percabulan, tamak, penyembah berhala, suka mencaci, suka mabuk, atau suka merampas. Bahkan makan bersama dengan orang seperti itu pun janganlah kalian lakukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Namun, sekarang saya menulis
  rationale: Aoristus epistoler dapat diungkapkan secara alami sebagai kala kini dalam bahasa Indonesia karena menunjuk pada apa yang Paulus tuliskan saat surat dibacakan; δέ menandai kontras dengan penjelasan sebelumnya.
- source_word: μὴ συναναμίγνυσθαι
  choice: agar tidak bergaul
  rationale: Menunjukkan larangan berhubungan atau berbaur secara akrab, bukan larangan atas setiap kontak biasa.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: yang disebut saudara
  rationale: 'Mempertahankan bentuk pasif dan kemungkinan jarak evaluatif dalam teks: orang itu dikenal atau mengaku sebagai anggota komunitas Kristen.'
- source_word: πόρνος
  choice: hidup dalam percabulan
  rationale: Istilah ini menunjuk pada orang yang melakukan percabulan; frasa Indonesia menghindari label yang kaku dan menyampaikan perilaku yang menjadi cirinya.
- source_word: πλεονέκτης
  choice: tamak
  rationale: Mengungkapkan kerakusan atau hasrat memperoleh lebih banyak dengan mengorbankan orang lain.
- source_word: λοίδορος
  choice: suka mencaci
  rationale: Menunjuk pada orang yang menghina atau menyerang orang lain dengan kata-kata; lebih spesifik daripada 'kasar' atau 'abusif'.
- source_word: μέθυσος
  choice: suka mabuk
  rationale: Menggambarkan orang yang dikenal oleh kebiasaan mabuk, bukan seseorang yang hanya pernah mabuk sekali.
- source_word: ἅρπαξ
  choice: suka merampas
  rationale: Menunjuk pada orang yang mengambil keuntungan atau milik orang lain secara rakus atau paksa; mempertahankan nuansa predatoris yang lebih kuat daripada sekadar penipu.
- source_word: μηδὲ συνεσθίειν
  choice: janganlah kalian makan bersama sekalipun
  rationale: Menerjemahkan larangan tambahan secara tegas dan mempertahankan tindakan konkret makan bersama.
theological_decisions:
- issue: Status orang yang disebut saudara
  choice: yang disebut saudara
  alternative: yang mengaku sebagai saudara; yang disebut sebagai orang percaya
  rationale: Teks Yunani tidak menetapkan apakah sebutan itu benar atau palsu, sehingga terjemahan mempertahankan ambiguitas tersebut tanpa memutuskan status keselamatannya.
- issue: Cakupan larangan bergaul dan makan bersama
  choice: Tidak diperluas dengan penjelasan tentang semua kontak sosial atau perjamuan tertentu
  alternative: tidak berhubungan sama sekali; tidak ikut Perjamuan Tuhan bersama
  rationale: Ayat menyebut pergaulan dan makan bersama, tetapi tidak secara eksplisit menentukan bahwa setiap kontak dilarang atau bahwa yang dimaksud hanya Perjamuan Tuhan.
- issue: Sifat daftar pelanggaran
  choice: Menggambarkan orang yang hidup dengan ciri perilaku tersebut
  alternative: setiap orang yang pernah melakukan salah satu tindakan ini
  rationale: Nomina pelaku dalam bahasa Yunani menggambarkan orang berdasarkan pola atau ciri yang dikenal, bukan secara eksplisit satu kejadian terisolasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak 'kalian' dipakai untuk ὑμῖν dan perintah kepada jemaat. Struktur daftar dipertahankan, sementara ungkapan idiomatis dipilih agar dapat dipahami pembaca umum.
