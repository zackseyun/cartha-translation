  source_fidelity: Revisi diperlukan karena frasa "yang disebut saudara, tetapi hidup ..." menjadikan "tetapi" sebagai kontras yang tidak ada dalam Yunani dan tidak menyatakan dengan jelas syarat ἐάν τις ... ᾖ. Revisi memulihkan hubungan bersyarat itu. "Sekarang aku menulis" mempertahankan pemakaian aoristus epistoler ἔγραψα secara idiomatis; isi larangan dan daftar enam kategori tetap setia pada teks.
  naturalness: 'Teks revisi memakai susunan Indonesia modern yang jelas: larangan bergaul berlaku apabila orang yang disebut saudara itu dicirikan oleh salah satu perilaku yang disebutkan. "Bahkan ... sekali pun" menyampaikan μηδέ secara alami dan tegas.'
  terminology: '"Saudara" tetap tidak mempersempit ἀδελφὸς ὀνομαζόμενος menjadi klaim keselamatan tertentu. "Hidup dalam percabulan", "tam[a]k", "penyembah berhala", "suka mencaci", "suka mabuk", dan "suka merampas" mempertahankan daftar kategori perilaku tanpa menambah penafsiran gerejawi atau membatasi larangan pada suatu jenis jamuan.'
