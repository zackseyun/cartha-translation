source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: id
  text: 'Memang terdengar kabar bahwa di antara kalian ada percabulan, bahkan percabulan sedemikian rupa yang tidak terdapat sekalipun di antara bangsa-bangsa lain[a]: seseorang mempunyai istri ayahnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara bangsa-bangsa”; dapat juga dipahami sebagai “di antara orang-orang bukan Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mempunyai istri ayahnya”; maksudnya, menjalin hubungan seksual dengan istri ayahnya, yang mungkin adalah ibu tirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Sungguh
  rationale: Dalam konteks ini kata tersebut memberi penegasan bernada heran atau terguncang, bukan menyatakan jumlah atau keseluruhan.
- source_word: ἀκούεται
  choice: terdengar
  rationale: Bentuk pasif ini menyatakan bahwa perkara tersebut telah terdengar atau diberitakan; pilihan ini mempertahankan citra bahasa sumber dan tetap alami dalam bahasa Indonesia.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini menunjuk pada keberadaan perkara itu di tengah komunitas jemaat Korintus. 'Kalian' secara jelas mempertahankan bentuk jamak.
- source_word: πορνεία
  choice: percabulan
  rationale: Istilah ini mencakup perilaku seksual yang terlarang. 'Percabulan' merupakan padanan ringkas, lazim, dan cukup luas dalam ragam Indonesia yang bermartabat.
- source_word: τοιαύτη πορνεία
  choice: percabulan sedemikian rupa
  rationale: Ungkapan ini mempertahankan penekanan kualitatif pada jenis pelanggaran yang mengejutkan tersebut.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: tidak terdapat sekalipun di antara bangsa-bangsa lain
  rationale: Dalam kerangka Paulus, τὰ ἔθνη menunjuk pada bangsa-bangsa selain Yahudi. Kata 'terdapat' melengkapi elipsis Yunani secara wajar tanpa mengubah maknanya.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: istri ayahnya
  rationale: Pilihan ini mengikuti ungkapan sumber secara langsung dan tidak mempersempitnya menjadi 'ibu tiri', sekalipun perempuan itu mungkin adalah ibu tirinya.
- source_word: ἔχειν
  choice: mempunyai
  rationale: Kata ini mempertahankan ungkapan halus dan singkat dalam bahasa Yunani mengenai hubungan dengan perempuan tersebut; catatan kaki menjelaskan implikasi relasionalnya tanpa menambahkannya ke teks utama.
theological_decisions:
- issue: Makna ἔθνεσιν dalam kontras Yahudi dan non-Yahudi
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi; orang-orang kafir
  rationale: '''Bangsa-bangsa lain'' mempertahankan makna dasar dan sudut pandang Yahudi Paulus tanpa memasukkan nada merendahkan yang dapat melekat pada ''orang-orang kafir''.'
- issue: Identitas perempuan yang disebut sebagai istri ayah
  choice: istri ayahnya
  alternative: ibu tirinya
  rationale: Bahasa Yunani tidak memakai istilah kekerabatan khusus untuk 'ibu tiri'. Terjemahan utama mempertahankan ketidakspesifikan tersebut.
- issue: Arti idiomatis ἔχειν dalam hubungan seksual
  choice: mempunyai
  alternative: hidup bersama dengan; berhubungan seksual dengan
  rationale: '''Mempunyai'' menjaga kehematan dan eufemisme teks sumber. Kemungkinan arti hubungan seksual dijelaskan dalam catatan tanpa memaksakan rincian seperti hidup serumah atau status perkawinan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Struktur pengulangan 'percabulan' dipertahankan untuk membawa penekanan retoris Paulus. 'Kalian' dipakai agar bentuk jamak orang kedua jelas bagi pembaca masa kini.
