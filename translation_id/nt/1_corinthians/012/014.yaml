  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: id
  text: Sebab tubuh bukanlah satu anggota, melainkan banyak anggota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Sebab
  rationale: Gabungan partikel ini bersifat menjelaskan dan menghubungkan ayat ini dengan uraian sebelumnya. “Sebab” menyampaikan hubungan tersebut secara alami tanpa menerjemahkan setiap partikel secara kaku.
- source_word: τὸ σῶμα
  choice: tubuh
  rationale: Padanan langsung bagi subjek kalimat. Metafora tubuh dipertahankan dan tidak diperluas menjadi “tubuh Kristus,” karena perluasan itu tidak terdapat secara eksplisit dalam ayat ini.
- source_word: οὐκ ἔστιν
  choice: bukanlah
  rationale: Menerjemahkan kopula yang dinegasikan secara ringkas dan wajar dalam bahasa Indonesia. Bentuk ini mempertahankan pernyataan identitas atau susunan tanpa menambahkan gagasan “terdiri dari” secara eksplisit.
- source_word: ἓν μέλος
  choice: satu anggota
  rationale: “Anggota” mempertahankan gambaran bagian-bagian tubuh dan selaras dengan pemakaian μέλος dalam konteks sekitarnya. “Satu” mengikuti bentuk sumber secara langsung.
- source_word: ἀλλὰ πολλά
  choice: melainkan banyak anggota
  rationale: πολλά dipakai secara substantival dengan μέλη yang dipahami dari frasa sebelumnya. Pengulangan “anggota” diperlukan agar kalimat bahasa Indonesia terdengar jelas dan alami, meskipun nomina tersebut dielipsiskan dalam bahasa Yunani.
theological_decisions:
- issue: Rujukan metaforis “tubuh”
  choice: Mempertahankan “tubuh” tanpa memperluasnya menjadi “tubuh Kristus.”
  alternative: tubuh Kristus
  rationale: Konteks yang lebih luas memang berbicara tentang jemaat sebagai tubuh Kristus, tetapi ayat ini sendiri hanya menyebut “tubuh.” Terjemahan mempertahankan metafora sebagaimana dinyatakan tanpa memasukkan penafsiran kontekstual ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Bukanlah ... melainkan ...” dipilih untuk menyampaikan kontras οὐκ ... ἀλλά dengan jelas. Tidak diperlukan catatan kaki.
