    issue: Ungkapan “berbicara dalam bahasa lidah” tidak idiomatis dalam bahasa Indonesia modern.
    rationale: Istilah ini merupakan gabungan yang tidak lazim. Ia mengaburkan padanan γλώσσαις dan terdengar kurang alami dalam register Alkitab Indonesia modern.
  - severity: low
    issue: Catatan kaki a menyebut “berbagai penyembuhan.”
    rationale: Jamak Yunani perlu dipertahankan, tetapi kata “berbagai” dapat menyiratkan ragam yang tidak dinyatakan secara leksikal. Catatan dapat cukup menyatakan bahwa kedua nomina berbentuk jamak.
  - severity: low
    issue: Catatan kaki b menawarkan “berbagai bahasa.”
    rationale: Teks Yunani memakai bentuk jamak “bahasa/lidah”, bukan kata yang secara eksplisit berarti “berbagai.” Catatan sebaiknya menjelaskan arti harfiah dan pemakaian kontekstual tanpa menambahkan nuansa tersebut.
