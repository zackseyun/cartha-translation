review_pass:
  verdict: revise
  source_fidelity: Struktur tiga pertanyaan retoris dengan μή dan jawaban negatif yang diharapkan telah terwakili dengan baik. Bentuk jamak χαρίσματα dan ἰαμάτων juga dipertahankan. Namun, “bahasa lidah” bukan bentuk yang wajar dalam bahasa Indonesia modern dan kurang jelas sebagai padanan γλώσσαις dalam konteks karunia.
  naturalness: “Tidak semua orang …, bukan?” dapat dipahami dan mempertahankan daya retoris. Akan tetapi, “berbicara dalam bahasa lidah” tidak idiomatis. “Berbicara dalam bahasa-bahasa” adalah bentuk Indonesia yang alami, mempertahankan bentuk jamak sumber, dan catatan kaki dapat menjelaskan rujukan kontekstualnya pada karunia yang lazim disebut “bahasa roh” atau “bahasa lidah” tanpa memasukkan istilah itu ke dalam teks utama.
  terminology: “Karunia-karunia penyembuhan” dengan tepat mempertahankan plural ganda dan menghindari pembatasan makna. Untuk γλώσσαις, teks utama sebaiknya memakai “bahasa-bahasa”; catatan kaki perlu menyebut bahwa secara harfiah kata Yunani berarti “lidah-lidah” dan bahwa dalam konteks ini istilah tersebut menunjuk fenomena karismatik. Ini lebih tepat daripada menyatakan “berbagai bahasa” sebagai alternatif, karena unsur “berbagai” tidak eksplisit dalam teks.
  issues:
