base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: id
  text: Tidak semua orang memiliki karunia-karunia penyembuhan[a], bukan? Tidak semua orang berbicara dalam bahasa-bahasa[b], bukan? Tidak semua orang menafsirkannya, bukan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kedua kata dalam bahasa Yunani berbentuk jamak: secara harfiah, “karunia-karunia penyembuhan.” Dapat juga diterjemahkan “karunia-karunia kesembuhan.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bahasa-bahasa” atau “lidah-lidah.” Dalam konteks ini, istilah tersebut menunjuk pada karunia yang lazim disebut “bahasa roh” atau “bahasa lidah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Tidak semua orang ... bukan?
  rationale: Partikel μή dalam ketiga pertanyaan mengharapkan jawaban negatif. Bentuk ini menyampaikan tekanan retoris Paulus bahwa tidak semua anggota memiliki karunia yang sama.
- source_word: χαρίσματα ἰαμάτων
  choice: karunia-karunia penyembuhan
  rationale: Kedua nomina berbentuk jamak. Ungkapan ini mempertahankan pluralitas Yunani tanpa menentukan apakah yang dimaksud adalah jenis karunia atau berbagai tindakan penyembuhan.
- source_word: γλώσσαις λαλοῦσιν
  choice: berbicara dalam bahasa lidah
  rationale: Dalam konteks 1 Korintus 12–14, γλῶσσαις menunjuk pada karunia yang lazim disebut bahasa lidah; bentuk kini menyatakan kebiasaan atau ciri umum.
- source_word: διερμηνεύουσιν
  choice: menafsirkannya
  rationale: Dalam konteks langsung, verba ini berarti membuat ujaran bahasa lidah dapat dimengerti. Akhiran -nya menyatakan objek yang tersirat, yakni ujaran tersebut, tanpa menambahkan pelaku atau isi.
theological_decisions:
- issue: Sifat pertanyaan retoris dengan μή
  choice: Pertanyaan dirumuskan dengan penanda yang mengharapkan jawaban negatif
  alternative: Pertanyaan biasa tanpa menunjukkan jawaban yang diharapkan
  rationale: Sintaksis Yunani menekankan bahwa tidak setiap orang memiliki setiap karunia, sejalan dengan gambaran satu tubuh yang anggotanya memiliki fungsi beragam.
- issue: Bilangan dalam χαρίσματα ἰαμάτων
  choice: Mempertahankan bentuk jamak sebagai “karunia-karunia penyembuhan”
  alternative: “karunia penyembuhan”
  rationale: Bentuk jamak ganda dalam teks sumber layak dipertahankan karena mungkin bermakna teologis, tetapi terjemahan tidak menjelaskan lebih jauh apakah itu beragam kemampuan atau beragam peristiwa penyembuhan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “bukan?” mempertahankan daya retoris ketiga pertanyaan, sedangkan istilah “bahasa lidah” mempertahankan sebutan yang dikenal dalam konteks gerejawi Indonesia dengan alternatif leksikal dicatat dalam catatan kaki.
