  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: id
  text: Jika kaki berkata, “Karena aku bukan tangan, aku bukan bagian dari tubuh,” itu tidak berarti bahwa kaki itu bukan bagian dari tubuh, bukan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Jika ... berkata
  rationale: ἐὰν dengan subjungtif aoris menyatakan kondisi umum yang bersifat hipotetis; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya pengandaian.
- source_word: ὁ πούς
  choice: kaki
  rationale: Gambaran anggota tubuh dipertahankan secara harfiah karena menjadi inti metafora Paulus.
- source_word: Ὅτι
  choice: Karena
  rationale: Dalam ujaran kaki, ὅτι memiliki nuansa kausal dan memperkenalkan alasan bagi kesimpulannya.
- source_word: χείρ
  choice: tangan
  rationale: Terjemahan harfiah mempertahankan kontras konkret antara kaki dan tangan.
- source_word: ἐκ τοῦ σώματος
  choice: bagian dari tubuh
  rationale: Dalam konteks keanggotaan tubuh, ungkapan Yunani ini secara idiomatis berarti menjadi bagian dari tubuh; terjemahan ini lebih alami daripada 'dari tubuh' dan pengulangannya tetap dipertahankan.
- source_word: οὐ παρὰ τοῦτο
  choice: hal itu tidak membuatnya
  rationale: Ungkapan ini menyangkal bahwa alasan yang baru disebut menghasilkan kesimpulan tersebut; bentuk Indonesia ini menyampaikan hubungan logisnya dengan jelas.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: bukan bagian dari tubuh, bukan?
  rationale: Pertanyaan retoris dan penyangkalan dalam bahasa Yunani dipertahankan dengan tag 'bukan?', tanpa menghasilkan susunan negasi yang tidak wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Tingkat penghalusan retorika metafora tubuh Paulus
  choice: Mempertahankan pengulangan 'bagian dari tubuh' dan bentuk pertanyaan retoris, sambil mengungkapkan negasi ganda secara idiomatis.
  alternative: 'Terjemahan lebih formal: ''bukan karena hal itu ia bukan dari tubuh, bukan?'''
  rationale: Tidak ada persoalan doktrinal khusus. Pilihan ini mempertahankan logika bahwa penilaian diri kaki tidak mengubah keanggotaannya, tanpa memaksakan struktur Yunani yang janggal dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi sederhana serta konkret mempertahankan metafora tubuh dan mudah dipahami pembaca umum.
