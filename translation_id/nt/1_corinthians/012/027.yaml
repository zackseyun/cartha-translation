id: 1CO.12.27
reference: 1 Corinthians 12:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: id
  text: Kamu semua adalah tubuh Mesias[a], dan masing-masing dari kamu adalah anggotanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”. Kata Yunani Χριστός dapat diterjemahkan “Mesias” atau “Kristus”; di sini kata itu dipahami sebagai gelar.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “dan anggota-anggota menurut bagian”; maksudnya, setiap orang merupakan anggota di dalam keseluruhan tubuh itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kamu semua
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit dan bersifat menegaskan. “Kamu semua” menyampaikan baik jumlah jamak maupun penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: δέ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: δέ menandai peralihan menuju penerapan langsung kepada jemaat Korintus. Dalam ayat ini, peralihan tersebut sudah terasa secara alami melalui “Kamu semua”; menerjemahkannya dengan “tetapi” akan memberi kesan pertentangan yang terlalu kuat, sedangkan “sekarang” dapat disalahpahami sebagai penanda waktu.
- source_word: σῶμα Χριστοῦ
  choice: tubuh Mesias
  rationale: Ungkapan ini mengidentifikasi jemaat secara kolektif sebagai tubuh milik atau tubuh yang berkaitan dengan Mesias. Bentuk “tubuh Mesias” mempertahankan metafora tubuh dan konstruksi genitif secara ringkas.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar mesianik. “Mesias” menyampaikan makna gelar tersebut secara langsung; “Kristus” dicatat sebagai padanan tradisional dalam catatan kaki.
- source_word: μέλη
  choice: anggotanya
  rationale: Dalam metafora satu tubuh dengan banyak bagian, μέλη menunjuk pada anggota-anggota tubuh sekaligus para anggota dalam kesatuan jemaat. Akhiran “-nya” memperjelas hubungan yang tersirat dengan tubuh Mesias tanpa mengubah rujukannya.
- source_word: ἐκ μέρους
  choice: masing-masing dari kamu
  rationale: 'Dalam konteks ini, frasa tersebut bersifat distributif: jemaat secara bersama-sama adalah satu tubuh, sedangkan setiap orang merupakan anggota di dalamnya. Terjemahan ini menghindari kesan keliru bahwa mereka hanya merupakan tubuh itu secara tidak lengkap.'
theological_decisions:
- issue: Pemaknaan Χριστοῦ dalam pernyataan Paulus tentang jemaat
  choice: Mesias
  alternative: Kristus
  rationale: Kata tersebut mempertahankan fungsi gelarnya di sini. Pilihan ini tidak mengubah pernyataan eklesiologis bahwa para penerima surat secara kolektif adalah tubuh Mesias.
- issue: Hubungan antara kesatuan tubuh dan ἐκ μέρους
  choice: jemaat secara kolektif adalah tubuh, dan tiap orang adalah anggotanya
  alternative: “anggota-anggota menurut bagian” atau “anggota-anggota secara khusus”
  rationale: Konteks langsung membandingkan satu tubuh dengan banyak anggota. Ungkapan “masing-masing dari kamu” mempertahankan ketegangan antara kesatuan bersama dan peran individual tanpa menyiratkan bahwa mereka hanya sebagian merupakan tubuh Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kamu semua” menandai penerima jamak serta penekanan pada Ὑμεῖς. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora tubuh dan pembedaan antara identitas kolektif dengan keanggotaan tiap orang.
