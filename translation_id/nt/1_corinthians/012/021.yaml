id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: id
  text: Namun, mata tidak dapat berkata kepada tangan, “Aku tidak membutuhkanmu,” atau kepala kepada kedua kaki, “Aku tidak membutuhkan kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Menyatakan ketidakmampuan secara alami dan tetap mempertahankan makna, bukan sekadar ketidakpatutan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya tentang saling ketergantungan bagian-bagian tubuh.
- source_word: ὁ ὀφθαλμός
  choice: mata
  rationale: Mempertahankan gambaran harfiah anggota tubuh yang menjadi dasar metafora Paulus.
- source_word: εἰπεῖν
  choice: berkata
  rationale: Padanan Indonesia yang sederhana dan alami bagi infinitif sesudah δύναται.
- source_word: τῇ χειρί
  choice: kepada tangan
  rationale: Menerjemahkan datif sebagai objek tak langsung serta mempertahankan gambaran tubuh.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Aku tidak membutuhkanmu
  rationale: Ungkapan Indonesia yang alami dan tepat untuk menyatakan bahwa pihak yang disapa tidak diperlukan, tanpa memperkuatnya menjadi penolakan yang lebih keras.
- source_word: ἢ πάλιν
  choice: atau
  rationale: Dalam bahasa Indonesia, 'atau' secara alami memperkenalkan contoh analogis kedua; menerjemahkan πάλιν secara eksplisit sebagai 'lagi' akan terasa kaku di sini.
- source_word: ἡ κεφαλή
  choice: kepala
  rationale: Mempertahankan gambaran harfiah anggota tubuh.
- source_word: τοῖς ποσίν
  choice: kepada kedua kaki
  rationale: Bentuk jamak dipertahankan secara alami; 'kedua' sesuai dengan gambaran sepasang kaki dalam satu tubuh.
- source_word: ὑμῶν
  choice: kalian
  rationale: 'Bahasa Indonesia dapat menyatakan perbedaan jumlah secara jelas: ''-mu'' untuk tangan tunggal dan ''kalian'' untuk kaki-kaki jamak.'
theological_decisions:
- issue: Bahasa metaforis tubuh mengenai saling ketergantungan dalam jemaat
  choice: Mempertahankan gambaran anggota tubuh tanpa menambahkan penafsiran dalam teks utama
  alternative: Menjelaskan secara eksplisit bahwa anggota tubuh melambangkan anggota jemaat
  rationale: Pokok teologis Paulus disampaikan melalui metafora itu sendiri; penjelasan eksplisit dalam ayat akan melampaui penerjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pembedaan pronomina tunggal dan jamak dapat dinyatakan langsung dalam bahasa Indonesia, sehingga catatan kaki bahasa Inggris tidak diperlukan.
