  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: id
  text: dan bagian-bagian tubuh yang kita anggap kurang terhormat, justru kita beri penghormatan yang lebih besar; dan bagian-bagian kita yang tidak pantas diperlihatkan memiliki kepantasan yang lebih besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memiliki penampilan yang lebih pantas” atau “memiliki keelokan yang lebih besar.” Istilah Yunani ini menunjuk pada kepantasan atau kelayakan dalam penampilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: yang kita anggap
  rationale: Menunjukkan penilaian manusia, bukan kenyataan objektif, dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἀτιμότερα
  choice: kurang terhormat
  rationale: Mempertahankan bentuk perbandingan dan kontras langsung dengan τιμή, tanpa memperkerasnya menjadi 'lebih hina'.
- source_word: τοῦ σώματος
  choice: bagian-bagian tubuh
  rationale: Genitif partitif dinyatakan secara alami dalam bahasa Indonesia, sambil mempertahankan gambaran konkret tentang tubuh.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: justru kita beri penghormatan yang lebih besar
  rationale: Menyampaikan tindakan memberikan atau mengenakan kehormatan kepada bagian-bagian tersebut; 'justru' menampilkan kontras retoris yang tersirat.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: bagian-bagian tubuh kita yang tidak pantas diperlihatkan
  rationale: Menangkap arti sesuatu yang tidak layak ditampilkan menurut kepantasan sosial, tanpa memberi kesan bahwa bagian tubuh itu secara moral berdosa.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: diperlakukan dengan kesopanan yang lebih besar
  rationale: Ungkapan pasif alami dalam bahasa Indonesia menyampaikan bahwa bagian tersebut memperoleh penanganan atau penutupan yang lebih pantas. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
theological_decisions:
- issue: Gambaran tubuh dan kehormatan sosial
  choice: Mempertahankan bahasa konkret tentang bagian-bagian tubuh dan cara manusia memperlakukannya.
  alternative: Memparafrasakan langsung sebagai anggota jemaat yang dianggap lebih lemah atau kurang terhormat.
  rationale: Perumpamaan tubuh menjadi dasar penerapan Paulus kepada jemaat; penerapan teologis tidak boleh menggantikan gambaran konkret dalam ayat.
- issue: Makna kepantasan pada ἀσχήμονα dan εὐσχημοσύνη
  choice: Menyatakannya sebagai kelayakan untuk diperlihatkan dan perlakuan yang sopan.
  alternative: Menerjemahkannya sebagai ketidaksenonohan moral dan kehormatan moral.
  rationale: Konteks menunjuk pada kepantasan tampilan, penutupan, dan perlakuan sosial, bukan penilaian bahwa bagian tubuh tertentu secara moral jahat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan dua klausa sejajar serta kontras kehormatan dan kepantasan. Kata 'justru' dipakai untuk mengungkapkan tekanan kontras yang alami dalam bahasa sasaran.
