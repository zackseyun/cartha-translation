source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: id
  text: kepada yang lain, iman[a] oleh Roh yang sama; kepada yang lain, karunia-karunia penyembuhan[b] oleh Roh yang satu itu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan” atau “kepercayaan” untuk kata Yunani πίστις.
    reason: lexical_alternative
  - marker: b
    text: 'Dalam bahasa Yunani, kedua nomina dalam frasa ini berbentuk jamak: “karunia-karunia penyembuhan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: kepada yang lain
  rationale: Bentuk datif tunggal ini melanjutkan pola pembagian karunia dari ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan perbedaan tajam dengan ἄλλῳ.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks daftar karunia, kata ini menunjuk pada iman yang dianugerahkan Roh. 'Iman' merupakan padanan utama yang ringkas, sementara kemungkinan arti 'kesetiaan' atau 'kepercayaan' dipertahankan dalam catatan kaki.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: oleh Roh yang sama
  rationale: ἐν dengan datif dipahami secara instrumental dalam rumusan pembagian karunia. 'Oleh' menyatakan perantaraan atau karya Roh secara alami, sedangkan 'yang sama' mempertahankan αὐτῷ.
- source_word: ἄλλῳ
  choice: kepada yang lain
  rationale: Bentuk datif ini meneruskan pola distributif. Padanan yang sama dengan ἑτέρῳ menghindari pembedaan yang tidak wajar atau berlebihan dalam bahasa Indonesia.
- source_word: χαρίσματα
  choice: karunia-karunia
  rationale: Bentuk jamak dipertahankan dan konteksnya memperjelas bahwa yang dimaksud ialah pemberian berdasarkan anugerah.
- source_word: ἰαμάτων
  choice: penyembuhan
  rationale: Nomina ini berbentuk jamak dalam bahasa Yunani. Karena bahasa Indonesia lazim tidak menandai jamak pada kedua unsur frasa secara bersamaan, bentuk sumber dijelaskan dalam catatan kaki agar nuansanya tetap tersedia.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: oleh Roh yang satu
  rationale: ἐν diterjemahkan secara instrumental, sedangkan ἑνί dipertahankan sebagai 'yang satu' untuk menonjolkan kesatuan Roh dan menjaga variasi dari frasa sebelumnya.
theological_decisions:
- issue: Arti πίστις dalam konteks karunia Roh
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Teks menempatkan πίστις sebagai salah satu karunia, tetapi tidak mendefinisikan bentuk atau pengalaman khususnya. Terjemahan utama memakai 'iman' tanpa memasukkan kerangka teologis denominasi tertentu; alternatif leksikal dicatat.
- issue: Rujukan πνεύματι
  choice: Roh, dengan huruf kapital
  alternative: roh
  rationale: Konteks 1 Korintus 12 menunjukkan bahwa yang dimaksud ialah Roh Kudus sebagai pemberi atau perantara karunia. Kapitalisasi menandai rujukan tersebut tanpa menambahkan sebutan yang tidak tertulis dalam ayat.
- issue: Nuansa ἐν dalam kedua frasa
  choice: oleh
  alternative: di dalam
  rationale: 'Dalam rumusan pembagian karunia ini, pengertian instrumental paling alami: karunia diberikan atau berlangsung oleh karya Roh. Namun, pilihan ini tidak dimaksudkan untuk meniadakan nuansa kesatuan atau lingkup relasional yang dapat terkandung dalam ἐν.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur fragmen dipertahankan karena ayat ini melanjutkan kalimat dan daftar dari ayat sebelumnya. Variasi 'Roh yang sama' dan 'Roh yang satu' mengikuti variasi asli αὐτῷ dan ἑνί.
