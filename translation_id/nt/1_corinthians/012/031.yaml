  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: id
  text: Namun, dambakanlah dengan sungguh-sungguh karunia-karunia yang lebih besar.[a] Dan aku akan menunjukkan kepadamu suatu jalan yang bahkan jauh lebih unggul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, kamu sungguh-sungguh mendambakan karunia-karunia yang lebih besar.” Bentuk Yunani ζηλοῦτε dapat dipahami sebagai imperatif ataupun indikatif dalam konteks ini.
    reason: alternative_reading
  - marker: b
    text: Secara tradisional, “suatu jalan yang lebih utama lagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: dambakanlah dengan sungguh-sungguh
  rationale: Kata kerja ini menyatakan hasrat atau semangat yang kuat. Bentuk imperatif dipakai dalam teks utama karena sesuai dengan alur nasihat Paulus, sedangkan kemungkinan bentuk indikatif dipertahankan dalam catatan kaki.
- source_word: χαρίσματα
  choice: karunia-karunia
  rationale: Dalam konteks pasal 12, kata ini menunjuk pada pemberian karena anugerah. Bentuk sederhana “karunia-karunia” mempertahankan bentuk jamak tanpa menambahkan kata “rohani” yang tidak terdapat dalam klausa ini.
- source_word: μείζονα
  choice: yang lebih besar
  rationale: Terjemahan ini mempertahankan daya komparatif kata Yunani dan tidak menentukan secara berlebihan apakah kebesaran itu menyangkut kedudukan, manfaat, atau kepentingan.
- source_word: καὶ ἔτι
  choice: Dan ... bahkan
  rationale: Ungkapan ini menghubungkan pembahasan sebelumnya dengan peningkatan yang kuat menuju jalan yang akan dipaparkan selanjutnya.
- source_word: καθ’ ὑπερβολὴν
  choice: jauh lebih unggul
  rationale: Frasa ini menyatakan tingkat yang melampaui atau luar biasa. Pilihan ini alami dalam bahasa Indonesia dan tetap menyampaikan keunggulan yang sangat besar.
- source_word: ὁδὸν
  choice: suatu jalan
  rationale: Kata “jalan” mempertahankan metafora Yunani bagi cara hidup atau arah tindakan yang mengantar kepada pembahasan tentang kasih.
- source_word: δείκνυμι
  choice: aku akan menunjukkan
  rationale: Walaupun bentuk Yunani adalah kala kini, bahasa Indonesia secara wajar dapat memakai bentuk futuratif karena Paulus segera menunjukkan jalan itu dalam bagian berikutnya.
theological_decisions:
- issue: Daya ujar ζηλοῦτε
  choice: 'imperatif: “dambakanlah dengan sungguh-sungguh”'
  alternative: 'indikatif: “kamu sungguh-sungguh mendambakan”'
  rationale: Bentuk Yunani dapat dipahami sebagai imperatif atau indikatif dalam konteks ini. Teks utama memakai imperatif karena cocok dengan alur nasihat, tetapi kemungkinan indikatif dicatat agar ketegangan penafsirannya tidak dihilangkan.
- issue: Tingkat keunggulan jalan kasih
  choice: “suatu jalan yang bahkan jauh lebih unggul”
  alternative: “jalan yang lebih utama lagi”
  rationale: Pilihan utama menonjolkan daya intensif καθ’ ὑπερβολὴν, sedangkan ungkapan tradisional yang lebih ringkas tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dambakanlah dengan sungguh-sungguh” menyampaikan intensitas tanpa terdengar teknis, sedangkan “jalan” mempertahankan metafora yang mengantar ke pasal 13.
