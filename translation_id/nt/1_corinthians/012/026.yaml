  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: id
  text: Jika satu anggota menderita, semua anggota turut menderita bersamanya; jika seorang anggota dihormati[a], semua anggota turut bersukacita bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dimuliakan.” Dalam konteks ini, maksudnya kemungkinan besar ialah bahwa seorang anggota menerima kehormatan dan seluruh tubuh turut bersukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: jika ... jika
  rationale: Dalam susunan korelatif ini, pengulangan “jika” terdengar alami dalam bahasa Indonesia dan mempertahankan gambaran dua keadaan yang mungkin terjadi.
- source_word: πάσχει
  choice: menderita
  rationale: Pilihan ini mempertahankan cakupan umum verba Yunani, tanpa membatasi penderitaan pada rasa sakit jasmani.
- source_word: ἓν μέλος
  choice: satu anggota
  rationale: “Anggota” mempertahankan permainan metaforis antara anggota tubuh dan anggota jemaat, sedangkan “satu” menerjemahkan ἓν secara eksplisit.
- source_word: συμπάσχει
  choice: turut menderita bersamanya
  rationale: Verba majemuk ini menyatakan penderitaan bersama; “turut ... bersamanya” mengungkapkan solidaritas semua anggota dengan anggota yang menderita.
- source_word: πάντα τὰ μέλη
  choice: semua anggota
  rationale: Ungkapan yang sama dipertahankan dalam kedua klausa untuk menjaga pengulangan retoris teks Yunani.
- source_word: δοξάζεται
  choice: dihormati
  rationale: Dalam konteks saling memperhatikan di dalam tubuh, makna menerima kehormatan paling alami, sambil mencatat kemungkinan terjemahan yang lebih harfiah.
- source_word: μέλος
  choice: satu anggota
  rationale: Walaupun teks cetak tidak memuat ἕν pada klausa kedua, bahasa Indonesia alami memakai “satu anggota” sebagai anggota tubuh yang tidak tertentu dan mempertahankan kesejajaran dengan klausa pertama tanpa mengharuskan arti numerik yang kuat.
- source_word: συγχαίρει
  choice: turut bersukacita bersamanya
  rationale: Pilihan ini mempertahankan unsur sukacita bersama yang terkandung dalam verba majemuk Yunani.
theological_decisions:
- issue: Makna δοξάζεται dalam metafora tubuh jemaat
  choice: dihormati
  alternative: dimuliakan
  rationale: Konteks langsung membahas kepedulian dan kebersamaan antaranggota. “Dihormati” menyampaikan makna sosial-relasional yang paling mungkin tanpa meniadakan kemungkinan leksikal “dimuliakan,” yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan “semua anggota” serta pasangan “turut menderita” dan “turut bersukacita” mempertahankan kesejajaran dan penekanan retoris teks sumber.
