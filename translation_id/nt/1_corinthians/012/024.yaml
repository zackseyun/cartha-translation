  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: id
  text: sedangkan bagian-bagian tubuh kita yang pantas dilihat tidak memerlukan apa pun. Namun, Allah telah memadukan tubuh itu[a] dengan memberikan kehormatan yang lebih besar kepada bagian yang kurang dihormati,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah menyusun tubuh itu.” Kata kerja Yunani dapat menekankan penggabungan atau pencampuran berbagai bagian menjadi satu kesatuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: bagian-bagian tubuh kita yang pantas dilihat
  rationale: Dalam metafora tubuh, kata sifat netral jamak ini menunjuk pada bagian tubuh yang secara lahiriah dianggap pantas atau sopan untuk diperlihatkan; 'pantas dilihat' terdengar alami dan mempertahankan kontras dengan ayat sebelumnya.
- source_word: χρείαν ἔχει
  choice: tidak memerlukannya
  rationale: Menerjemahkan idiom 'mempunyai kebutuhan' secara alami. Akhiran '-nya' merujuk pada perlakuan atau perhatian khusus yang tersirat dari konteks sebelumnya.
- source_word: συνεκέρασεν
  choice: telah memadukan
  rationale: Kata kerja ini menyatakan tindakan mencampur atau menggabungkan unsur-unsur menjadi satu kesatuan. 'Memadukan' sesuai dengan metafora tubuh dan tidak membuat tindakan Allah terdengar mekanis.
- source_word: σῶμα
  choice: tubuh itu
  rationale: Mempertahankan metafora utama Paulus. Kata penunjuk 'itu' mengacu pada tubuh yang sedang dibahas dalam konteks.
- source_word: τῷ ὑστεροῦντι
  choice: kepada bagian yang kurang dihormati
  rationale: Partisip ini berarti bagian yang kekurangan sesuatu; dalam konteks, yang kurang adalah penghormatan, bukan nilai hakiki bagian tersebut.
- source_word: περισσοτέραν τιμήν
  choice: penghormatan yang lebih besar
  rationale: Mempertahankan daya komparatif frasa Yunani dengan ungkapan Indonesia yang jelas dan alami.
- source_word: δοὺς
  choice: dengan memberikan
  rationale: 'Menyatakan hubungan instrumental dengan kata kerja utama: Allah memadukan tubuh dengan cara memberikan penghormatan yang lebih besar.'
theological_decisions:
- issue: Makna tindakan Allah dalam menyusun metafora tubuh
  choice: Allah dengan sengaja memadukan tubuh dengan memberikan penghormatan lebih besar kepada bagian yang sebelumnya kurang dihormati.
  alternative: Tindakan Allah hanya berarti mencampurkan bagian-bagian tubuh secara fisik, atau hanya merujuk pada anatomi manusia tanpa kaitan dengan jemaat.
  rationale: Konteks dekat merupakan analogi panjang tentang jemaat sebagai tubuh Kristus. Terjemahan mempertahankan metafora dan tujuan tindakan Allah tanpa membatasi rujukannya secara berlebihan hanya pada anatomi atau menjabarkan alegori lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Pantas dilihat' mempertahankan gagasan kesopanan lahiriah; 'memadukan' mempertahankan citra kesatuan tanpa menghilangkan alternatif makna 'menyusun'.
