id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: id
  text: Sebab, sama seperti tubuh itu satu dan memiliki banyak anggota, dan semua anggota tubuh itu, walaupun banyak, merupakan satu tubuh, demikian juga Mesias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός adalah gelar yang berarti “Mesias” atau “Yang Diurapi.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, ungkapan Paulus berbunyi “demikian juga Mesias.” Ungkapan ringkas ini dijabarkan dalam ayat-ayat berikutnya melalui gambaran banyak anggota yang membentuk satu tubuh.
    reason: preserve_theological_tension
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Sebab, sama seperti
  rationale: “Sebab” mempertahankan hubungan penjelasan yang dinyatakan oleh γάρ, sedangkan “sama seperti” menyampaikan daya perbandingan καθάπερ secara alami dalam bahasa Indonesia.
- source_word: τὸ σῶμα
  choice: tubuh
  rationale: Padanan langsung dan wajar bagi σῶμα serta mempertahankan metafora utama Paulus.
- source_word: ἕν
  choice: satu
  rationale: Mempertahankan gagasan kesatuan numerik dan kebersamaan yang menjadi inti perbandingan.
- source_word: μέλη
  choice: anggota
  rationale: “Anggota” dapat menunjuk pada bagian-bagian tubuh dan sekaligus memungkinkan penerapan komunal dalam konteks berikutnya tanpa menambahkan penafsiran ke dalam ayat.
- source_word: πολλὰ ὄντα
  choice: walaupun banyak
  rationale: Menyatakan nuansa konsesif frasa partisipial Yunani dengan bahasa Indonesia yang alami.
- source_word: ἕν ἐστιν σῶμα
  choice: merupakan satu tubuh
  rationale: Menghasilkan susunan Indonesia yang jelas dengan subjek jamak “semua anggota” sambil mempertahankan predikat kesatuan tubuh.
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Padanan ringkas dan lazim untuk kesimpulan perbandingan.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Χριστός di sini dipertahankan sebagai gelar, bukan diperlakukan semata-mata sebagai nama diri. Bahasa Indonesia tidak memerlukan kata sandang untuk menyampaikan gelar tersebut.
theological_decisions:
- issue: Penerjemahan ὁ Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pernyataan teologis ini Χριστός berfungsi sebagai gelar. “Mesias” mempertahankan arti gelarnya, sedangkan alternatif tradisional dicatat dalam catatan kaki.
- issue: Ungkapan ringkas “demikian juga Mesias”
  choice: Mempertahankan ungkapan itu tanpa menambahkan “tubuh Mesias” atau “jemaat”
  alternative: demikian juga tubuh Mesias / demikian juga jemaat
  rationale: Teks Yunani secara mencolok hanya mengatakan οὕτως καὶ ὁ Χριστός. Perluasan akan menyelesaikan ketegangan yang sengaja dibiarkan dan memasukkan penafsiran yang baru dijabarkan dalam ayat-ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur perbandingan Yunani dipertahankan tanpa menjadi kaku; pengulangan “tubuh” dan “anggota” sengaja dijaga karena merupakan unsur utama metafora Paulus.
