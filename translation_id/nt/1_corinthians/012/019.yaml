  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: id
  text: Jika semuanya hanya satu anggota, di manakah tubuh itu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Memperkenalkan kondisi hipotetis dalam argumen Paulus; “jika” adalah padanan Indonesia yang langsung dan alami.
- source_word: δὲ
  choice: —
  rationale: Berfungsi sebagai penghubung ringan dalam alur retoris. Kontrasnya sudah jelas, sehingga tidak perlu dinyatakan secara eksplisit dalam bahasa Indonesia.
- source_word: ἦν
  choice: —
  rationale: Kopula lampau bahasa Yunani tidak perlu diterjemahkan secara tersendiri karena bahasa Indonesia tidak menandai kala atau memakai kopula wajib dalam konstruksi ini; sifat hipotetisnya disampaikan oleh “jika”.
- source_word: τὰ πάντα
  choice: semuanya
  rationale: Dalam konteks kiasan tubuh, frasa ini menunjuk kepada seluruh bagian secara kolektif, bukan kepada segala sesuatu secara abstrak.
- source_word: ἓν μέλος
  choice: hanya satu anggota
  rationale: “Anggota” mempertahankan kiasan bagian tubuh sekaligus selaras dengan pemakaian Paulus. “Hanya” membuat maksud eksklusif “semuanya menjadi satu anggota saja” jelas dan alami dalam bahasa Indonesia.
- source_word: ποῦ
  choice: di manakah
  rationale: Mempertahankan bentuk pertanyaan retoris tentang keberadaan tubuh dalam keadaan hipotetis tersebut.
- source_word: τὸ σῶμα
  choice: tubuh itu
  rationale: Menunjuk kepada tubuh dalam kiasan yang sedang dibicarakan tanpa menambahkan penjelasan teologis yang tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Cakupan kiasan tubuh
  choice: Mempertahankan ungkapan “tubuh itu” tanpa menambahkan “Kristus” atau “jemaat”.
  alternative: “Tubuh Kristus” atau “jemaat”
  rationale: Walaupun konteks yang lebih luas berbicara tentang jemaat sebagai tubuh Kristus, teks ayat ini hanya mengatakan “tubuh”; terjemahan mempertahankan keluasan kiasan dan tidak memasukkan penafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan pertanyaan retoris dipertahankan, sementara struktur kopulatif Yunani disesuaikan secara alami dengan tata bahasa Indonesia.
