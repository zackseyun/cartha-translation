id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: id
  text: Sebab kepada yang seorang diberikan melalui Roh suatu pesan hikmat[a], dan kepada yang lain suatu pesan pengetahuan[b] menurut Roh yang sama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suatu perkataan hikmat” atau “suatu ucapan hikmat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “suatu perkataan pengetahuan” atau “suatu ucapan pengetahuan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sesuai dengan Roh yang sama” atau “oleh Roh yang sama.” Bahasa Yunani memakai preposisi yang berbeda dari preposisi dalam frasa “melalui Roh”; ungkapan ini dapat menekankan kesesuaian dengan satu Roh yang menjadi sumber bersama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: kepada yang seorang
  rationale: Mengungkapkan pembagian kepada satu orang dalam konstruksi distributif yang berpasangan dengan ἄλλῳ δέ, sekaligus mempertahankan kontras 'yang seorang ... yang lain'.
- source_word: διὰ τοῦ πνεύματος
  choice: melalui Roh
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; 'melalui Roh' mempertahankan nuansa itu dan membedakannya dari κατά pada klausa berikutnya.
- source_word: πνεύματος / πνεῦμα
  choice: Roh
  rationale: Konteks 1 Korintus 12 menunjuk kepada Roh Kudus sebagai pemberi karunia; huruf kapital menandai rujukan kontekstual tersebut tanpa menambahkan sebutan yang tidak tertulis.
- source_word: δίδοται
  choice: diberikan
  rationale: Bentuk kini pasif dipertahankan secara alami dalam bahasa Indonesia dan menunjukkan bahwa karunia tersebut dianugerahkan, bukan dihasilkan sendiri.
- source_word: λόγος σοφίας
  choice: suatu pesan hikmat
  rationale: λόγος di sini menunjuk pada perkataan atau komunikasi yang bermakna, bukan semata-mata satu kata. 'Pesan' alami dalam bahasa Indonesia modern, sedangkan hubungan genitif dengan σοφίας dipertahankan secara ringkas.
- source_word: ἄλλῳ δὲ
  choice: dan kepada yang lain
  rationale: Mempertahankan kesejajaran distributif serta kontras dengan penerima pertama.
- source_word: λόγος γνώσεως
  choice: suatu pesan pengetahuan
  rationale: Diterjemahkan sejajar dengan λόγος σοφίας; γνώσεως dipertahankan sebagai 'pengetahuan' tanpa menentukan lebih jauh jenis pengetahuan yang dimaksud.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: menurut Roh yang sama
  rationale: κατά dengan akusatif dapat menyatakan kesesuaian atau tolok ukur. 'Menurut' menjaga perbedaan preposisi dari διά sebelumnya dan mempertahankan kemungkinan nuansa 'sesuai dengan'.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: Roh Kudus, ditandai dengan 'Roh' berhuruf kapital
  alternative: roh manusia
  rationale: Konteks langsung membahas berbagai pemberian yang dikaitkan dengan satu Roh ilahi. Terjemahan tidak menambahkan kata 'Kudus' karena kata itu tidak muncul dalam ayat ini.
- issue: Makna λόγος dalam ungkapan λόγος σοφίας dan λόγος γνώσεως
  choice: pesan
  alternative: perkataan; ucapan; firman
  rationale: '''Pesan'' menyampaikan gagasan komunikasi yang dapat dipahami tanpa membatasi λόγος pada satu kata atau memasukkan konotasi teknis tertentu. Alternatif yang lebih harfiah dicatat dalam catatan kaki.'
- issue: Hubungan yang dinyatakan oleh κατά
  choice: menurut Roh yang sama
  alternative: oleh Roh yang sama; sesuai dengan Roh yang sama
  rationale: Pilihan ini mempertahankan perbedaan antara κατά dan διά serta tidak menghapus ketegangan antara nuansa kesesuaian dan sumber/agensi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'kepada yang seorang ... kepada yang lain' dipilih untuk menjaga pola distributif teks Yunani. Istilah 'pesan' mudah dipahami pembaca umum, sementara alternatif yang lebih harfiah dicantumkan dalam catatan kaki. Semua penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
