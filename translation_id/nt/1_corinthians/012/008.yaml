  naturalness: Bahasa Indonesia baku, modern, dan mengalir. Susunan “kepada yang seorang ... kepada yang lain” memang agak formal, tetapi wajar dalam register Alkitab dan dengan baik mencerminkan pola kontras distributif sumber.
