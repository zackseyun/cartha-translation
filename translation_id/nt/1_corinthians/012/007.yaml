  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: id
  text: Namun, kepada setiap orang diberikan penyataan Roh untuk kepentingan bersama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk apa yang bermanfaat” atau “untuk manfaat semua orang.”
    reason: Alternatif leksikal yang mempertahankan kemungkinan bahwa πρὸς τὸ συμφέρον menyatakan manfaat secara umum atau secara eksplisit manfaat bagi semua.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: kepada setiap orang
  rationale: Bentuk datif tunggal ini bersifat distributif dan menunjuk kepada masing-masing orang dalam tubuh; pilihan ini menyatakannya dengan jelas dan alami.
- source_word: δὲ
  choice: Namun
  rationale: Kata ini menandai peralihan dengan kontras ringan dari uraian sebelumnya tentang berbagai karunia dan Roh yang sama, tanpa membuat pertentangannya terlalu tajam.
- source_word: δίδοται
  choice: diberikan
  rationale: Bentuk kini pasif dipertahankan secara langsung dan tetap menyampaikan sifatnya sebagai pemberian tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: φανέρωσις
  choice: penyataan
  rationale: Kata ini menunjuk pada tindakan atau hasil membuat sesuatu menjadi nyata atau terlihat. 'Penyataan' cukup alami dalam bahasa Indonesia dan sesuai dengan konteks kegiatan Roh yang menjadi nyata melalui karunia-karunia.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Konteks 1 Korintus 12 menunjukkan bahwa yang dimaksud ialah Roh Kudus. 'Roh' mempertahankan bentuk ringkas teks Yunani tanpa menambahkan kata 'Kudus' pada ayat ini.
- source_word: πρὸς τὸ συμφέρον
  choice: untuk kepentingan bersama
  rationale: Ungkapan ini berarti menuju apa yang bermanfaat atau menguntungkan. Dalam konteks tubuh dan karunia-karunia, pilihan ini menyampaikan arah komunal yang kuat, sambil mencatat arti yang lebih umum dalam catatan kaki.
theological_decisions:
- issue: Rujukan 'Roh'
  choice: Roh dipahami sebagai Roh Kudus, tetapi diterjemahkan hanya 'Roh'.
  alternative: roh dalam arti yang lebih umum; atau diperjelas menjadi 'Roh Kudus'.
  rationale: Konteks langsung berulang kali menyebut satu Roh yang sama sebagai sumber karunia-karunia. Bentuk 'Roh' mengikuti teks Yunani dengan dekat dan membiarkan konteks mengenali rujukannya.
- issue: Cakupan συμφέρον
  choice: 'Manfaat komunal: ''untuk kepentingan bersama''.'
  alternative: untuk apa yang bermanfaat; untuk manfaat semua orang.
  rationale: Secara leksikal ungkapan itu dapat berarti manfaat secara umum, tetapi pembahasan tentang satu tubuh dan karunia bagi sesama mendukung orientasi komunal. Catatan kaki mempertahankan keluasan makna aslinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Penyataan Roh' dipilih agar makna sesuatu yang dibuat nyata tetap terjaga; 'kepentingan bersama' menyampaikan orientasi komunal konteks tanpa istilah denominasi.
