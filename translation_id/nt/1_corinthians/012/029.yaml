base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: id
  text: Tidak semua orang adalah rasul, bukan? Tidak semua orang adalah nabi, bukan? Tidak semua orang adalah pengajar, bukan? Tidak semua orang melakukan mukjizat, bukan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Yunaninya berarti “kuasa-kuasa” atau “mukjizat-mukjizat.” Dalam daftar ini, kata tersebut dipakai sebagai sebutan ringkas bagi karya-karya ajaib dan, menurut konteksnya, pelaksanaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Apakah ...?
  rationale: Dalam rangkaian pertanyaan retoris ini, μή mengisyaratkan jawaban negatif. Bentuk pertanyaan dengan “Apakah” terdengar alami dalam bahasa Indonesia, sementara konteks dan pengulangan memperjelas bahwa jawabannya adalah tidak.
- source_word: πάντες
  choice: semuanya
  rationale: Pilihan ini mempertahankan pengulangan dan penekanan Yunani bahwa tidak semua anggota memiliki peran atau karya yang sama.
- source_word: ἀπόστολοι
  choice: rasul
  rationale: Dalam konteks Paulus, istilah ini menunjuk pada peran pelayanan yang dikenal, bukan sekadar utusan pada umumnya.
- source_word: προφῆται
  choice: nabi
  rationale: Padanan baku dan jelas bagi orang-orang yang bernubuat dalam daftar pelayanan dan karunia ini.
- source_word: διδάσκαλοι
  choice: pengajar
  rationale: “Pengajar” merupakan padanan alami bagi orang yang menjalankan fungsi mengajar dan selaras dengan bentuk yang menunjuk pada pelaku.
- source_word: δυνάμεις
  choice: melakukan mukjizat
  rationale: Secara harfiah nomina jamak ini berarti “kuasa-kuasa” atau “mukjizat-mukjizat”, tetapi di sini dipakai secara metonimis dalam daftar peran dan karya. Bentuk verbal menyampaikan bahwa yang dimaksud ialah orang-orang yang melakukan karya ajaib.
theological_decisions:
- issue: Pemaknaan δυνάμεις sebagai unsur terakhir dalam daftar peran dan karunia
  choice: Apakah semuanya melakukan mukjizat?
  alternative: Apakah semuanya memiliki kuasa ajaib? / Apakah semuanya pelaku mukjizat?
  rationale: Terjemahan verbal menyampaikan maksud kontekstual tanpa menyatakan secara janggal bahwa orang-orang itu sendiri adalah “kuasa-kuasa”. Pilihan ini tidak menentukan teori tertentu tentang cara atau pelaku utama mukjizat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Empat pertanyaan singkat mempertahankan irama retoris teks Yunani. Penanda catatan kaki ditempatkan pada unsur terakhir, yaitu padanan δυνάμεις yang dijelaskan oleh catatan.
