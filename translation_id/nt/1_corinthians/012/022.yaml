  text: Sebaliknya, bagian-bagian tubuh yang tampaknya lebih lemah justru jauh lebih diperlukan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani πολλῷ μᾶλλον berarti “jauh lebih” atau “terlebih lagi”; ungkapan ini menegaskan kontras dengan pernyataan sebelumnya.
    reason: lexical_alternative
  - marker: b
