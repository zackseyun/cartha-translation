    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan tegas dengan pernyataan sebelumnya dan menyampaikan daya korektif ungkapan Yunani.
- source_word: πολλῷ μᾶλλον
  choice: jauh lebih lagi
  rationale: Menerjemahkan penegas komparatif secara eksplisit, meskipun ungkapan ini agak eliptis dalam konteks; maksudnya ialah bahwa kebalikannya justru berlaku dengan jauh lebih kuat.
- source_word: τὰ δοκοῦντα
  choice: yang tampaknya
  rationale: Menjaga perbedaan antara kesan atau penilaian dan keadaan yang sebenarnya.
- source_word: μέλη τοῦ σώματος
  choice: bagian-bagian tubuh
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan gambaran konkret tentang tubuh; 'anggota-anggota tubuh' juga mungkin.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: lebih lemah
  rationale: Menyampaikan bentuk komparatif dan melengkapi konstruksi 'tampaknya' secara wajar dalam bahasa Indonesia.
- source_word: ἀναγκαῖά ἐστιν
  choice: justru sangat diperlukan
  rationale: '''Diperlukan'' menyatakan keniscayaan fungsional, sedangkan ''justru'' membawa daya pertentangan dan ''sangat'' membantu menyampaikan tekanan konteks tanpa mengubahnya menjadi klaim lain.'
theological_decisions:
- issue: Daya metafora tubuh dalam konteks jemaat
  choice: Mempertahankan bagian-bagian tubuh sebagai gambaran konkret
  alternative: Menafsirkan μέλη langsung sebagai anggota-anggota jemaat
  rationale: Ayat ini tetap berbicara melalui metafora tubuh. Penerapannya kepada jemaat jelas dari konteks, tetapi tidak perlu dimasukkan secara eksplisit ke dalam teks ayat.
- issue: Status bagian yang tampak lebih lemah
  choice: Mempertahankan 'tampaknya' sebagai penilaian atau kesan
  alternative: Menyatakan bahwa bagian-bagian itu memang lebih lemah
  rationale: δοκοῦντα tidak memastikan bahwa kelemahan tersebut nyata; teks mempertahankan ketegangan antara kesan manusia dan nilai atau kebutuhan yang sebenarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan mempertahankan penegas Yunani secara eksplisit, sementara 'justru' membuat hubungan pertentangannya jelas dan alami.
