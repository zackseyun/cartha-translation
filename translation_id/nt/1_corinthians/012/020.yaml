  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: id
  text: Namun, pada kenyataannya, ada banyak bagian, tetapi satu tubuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “banyak anggota, tetapi satu tubuh.”
    reason: Alternatif leksikal untuk μέλη.
lexical_decisions:
- source_word: νῦν
  choice: sebagaimana adanya sekarang
  rationale: Dalam alur argumen ini, νῦν menunjuk pada kenyataan yang berlaku sebagai kontras terhadap kemungkinan andaikata pada ayat sebelumnya; frasa ini mempertahankan nuansa keadaan aktual sekaligus unsur temporalnya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai peralihan yang bersifat kontras dari pernyataan hipotetis sebelumnya.
- source_word: πολλὰ ... μέλη
  choice: banyak bagian
  rationale: Dalam metafora tubuh, μέλη berarti bagian-bagian penyusun tubuh. 'Bagian' terdengar alami dalam bahasa Indonesia modern dan tidak langsung mengubah metafora anatomis menjadi istilah kelembagaan.
- source_word: μὲν ... δὲ
  choice: memang ... tetapi
  rationale: Pasangan korelatif ini menyeimbangkan kemajemukan bagian dengan kesatuan tubuh; 'memang ... tetapi' menyatakan kontras tersebut secara wajar.
- source_word: ἓν
  choice: satu
  rationale: Kata bilangan ini menegaskan kesatuan yang dikontraskan dengan banyaknya bagian.
- source_word: σῶμα
  choice: tubuh
  rationale: Terjemahan ini mempertahankan metafora tubuh dan daya teologis kesatuan di tengah keragaman.
theological_decisions:
- issue: Penerjemahan μέλη dalam metafora tubuh
  choice: bagian
  alternative: anggota
  rationale: '''Bagian'' mempertahankan gambaran anatomis dengan jelas bagi pembaca modern. Karena ''anggota'' juga dapat menyatakan bagian tubuh sekaligus membawa gema komunitas, alternatif itu dicatat dalam catatan kaki tanpa memaksakan salah satu lapisan makna.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat ringkas sambil mempertahankan kontras retoris antara banyak bagian dan satu tubuh.
