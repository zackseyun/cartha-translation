  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: id
  text: Kamu tahu bahwa ketika kamu masih orang-orang bukan Yahudi,[a] kamu dibawa pergi kepada berhala-berhala bisu itu, dengan cara apa pun kamu digiring.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang dari bangsa-bangsa lain.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kamu dibawa pergi kepada berhala-berhala bisu itu sebagaimana pun kamu digiring.” Bahasa Yunani memakai dua bentuk pasif dan menekankan bahwa dahulu mereka berada di bawah pengaruh yang mengarahkan mereka.
    reason: translation_explanation
lexical_decisions:
- source_word: οἴδατε
  choice: Kamu tahu
  rationale: Bentuk ini menyampaikan seruan Paulus kepada pengetahuan bersama secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ἔθνη
  choice: bangsa-bangsa lain
  rationale: Pilihan ini mempertahankan arti etnis-keagamaan istilah Yunani tanpa memakai sebutan bernada merendahkan seperti 'kafir'.
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: menuju berhala-berhala yang bisu itu
  rationale: Kata 'menuju' mempertahankan arah gerak dalam πρός, sedangkan 'yang bisu' menonjolkan ketidakmampuan berhala untuk berbicara dalam kontras dengan perkataan yang berasal dari Roh.
- source_word: ὡς ἂν
  choice: dengan cara apa pun
  rationale: 'Ungkapan ini mempertahankan nuansa tak tentu atau modal: mereka digiring dengan cara apa pun pengaruh lama membawa mereka.'
- source_word: ἤγεσθε
  choice: kamu digiring
  rationale: Imperfek pasif menunjukkan gerakan yang berlangsung pada masa lalu dan menekankan bahwa mereka berada di bawah pengaruh yang mengarahkan mereka.
- source_word: ἀπαγόμενοι
  choice: kamu diseret
  rationale: Partisipel pasif ini memperkuat gambaran dibawa pergi. 'Diseret' membedakannya dari ἤγεσθε dan menyampaikan kuatnya ketidakberdayaan tanpa mengubah metafora gerak.
theological_decisions:
- issue: Makna ἔθνη bagi keadaan jemaat Korintus dahulu
  choice: bangsa-bangsa lain
  alternative: orang-orang kafir
  rationale: Pilihan ini menjaga identitas etnis-keagamaan yang dimaksud Paulus dan tidak memasukkan penilaian moral tambahan ke dalam istilah tersebut.
- issue: Kontras antara berhala bisu dan perkataan yang diilhami Roh dalam konteks
  choice: berhala-berhala yang bisu
  alternative: berhala-berhala yang tidak dapat berbicara
  rationale: Bentuk ringkas ini mempertahankan daya retoris teks Yunani tanpa menjelaskan kontras itu secara berlebihan.
- issue: Penekanan pasif ganda dalam ἤγεσθε ἀπαγόμενοι
  choice: kamu diseret ... kamu digiring
  alternative: kamu dibawa kepada ... sesuai dorongan yang membawa kamu
  rationale: Terjemahan mempertahankan ketegangan dan pengulangan gerak pasif dalam bahasa sumber, sambil memakai dua verba Indonesia agar kalimat tetap terbaca alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kamu' dipakai sesuai konteks jemaat. Susunan kalimat sengaja mempertahankan pengulangan pasif dan nuansa retoris teks sumber.
