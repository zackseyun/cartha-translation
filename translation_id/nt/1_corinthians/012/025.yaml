  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: id
  text: supaya tidak ada perpecahan dalam tubuh itu[a], melainkan supaya anggota-anggota tubuh mempunyai kepedulian yang sama satu terhadap yang lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perbelahan.” Kata Yunani ini dapat menunjuk pada belahan, sobekan, atau perpecahan; di sini maksudnya ialah perpecahan di dalam tubuh.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “saling memperhatikan.” Frasa Yunani ini juga menekankan bahwa kepedulian mereka adalah sama atau setara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: supaya tidak ada
  rationale: Mengungkapkan tujuan atau hasil yang dimaksud dengan bahasa Indonesia yang wajar.
- source_word: σχίσμα
  choice: perpecahan
  rationale: Menyampaikan gagasan tentang belahan atau perpecahan di dalam satu tubuh tanpa memakai istilah teknis gerejawi yang lebih sempit.
- source_word: ἐν τῷ σώματι
  choice: dalam tubuh itu
  rationale: Mempertahankan metafora tubuh dalam konteks langsung; artikel Yunani dibuat eksplisit secara alami dengan 'itu'.
- source_word: τὸ αὐτὸ ... μεριμνῶσι
  choice: sama-sama memperhatikan
  rationale: Frasa τὸ αὐτό menyatakan kesamaan atau kesetaraan perhatian. 'Sama-sama memperhatikan' alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan nuansa perhatian yang setara.
- source_word: ὑπὲρ ἀλλήλων
  choice: satu sama lain
  rationale: Mengungkapkan arah perhatian yang timbal balik, bukan makna penggantian.
- source_word: τὰ μέλη
  choice: semua anggota
  rationale: '''Anggota'' mempertahankan metafora bagian-bagian tubuh sekaligus kaitannya dengan para anggota jemaat; ''semua'' membuat subjek jamak definitif tersebut wajar dalam bahasa Indonesia.'
theological_decisions:
- issue: Makna σχίσμα dalam metafora tubuh dan jemaat
  choice: perpecahan
  alternative: perbelahan; skisma
  rationale: '''Perpecahan'' jelas bagi pembaca modern dan tidak memasukkan pengertian teknis gerejawi yang berkembang kemudian.'
- issue: Hubungan τὸ αὐτό dengan perhatian timbal balik
  choice: sama-sama memperhatikan satu sama lain
  alternative: memberikan perhatian yang sama satu kepada yang lain
  rationale: Pilihan utama mempertahankan gagasan perhatian bersama secara alami, sedangkan catatan kaki menjaga kemungkinan bahwa tekanannya ialah perhatian yang setara.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan kesejajaran antara tidak adanya perpecahan dan adanya perhatian timbal balik. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
