reference: 1 Corinthians 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: id
  text: Karena itu, aku memberitahukan kepada kalian bahwa tidak seorang pun yang berbicara oleh Roh Allah berkata, “Terkutuklah Yesus,”[a] dan tidak seorang pun dapat berkata, “Yesus adalah Tuhan,”[b] kecuali oleh Roh Kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus terkutuk.” Ungkapan Yunani tidak memakai kata kerja dan dapat dipahami sebagai seruan kutukan atau pernyataan bahwa Yesus terkutuk.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “Tuhan Yesus”; dalam konteks ini ungkapan tersebut berfungsi sebagai pengakuan: “Yesus adalah Tuhan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari pembahasan sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: γνωρίζω ὑμῖν
  choice: aku memberitahukan kepadamu
  rationale: Menyampaikan arti kausatif ‘membuat diketahui’ tanpa menambahkan nuansa kehendak yang tidak dinyatakan dalam bahasa Yunani. Bentuk ‘kepadamu’ dapat merujuk kepada jemaat secara kolektif.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan jelas bagi negasi universal.
- source_word: ἐν πνεύματι θεοῦ
  choice: oleh Roh Allah
  rationale: ἐν di sini wajar dipahami sebagai sarana atau kuasa yang menggerakkan perkataan; ‘oleh’ mengungkapkan agensi itu dengan jelas.
- source_word: λαλῶν λέγει
  choice: yang berbicara ... berkata
  rationale: Mempertahankan pembedaan antara tindakan berbicara dan isi ucapan, meskipun ada pengulangan yang juga terdapat dalam teks sumber.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Terkutuklah Yesus
  rationale: Ungkapan tanpa verba ini memiliki daya seruan; bentuk Indonesia ini menyampaikan kutukan dengan wajar tanpa menganggap ada imperatif Yunani yang eksplisit.
- source_word: δύναται εἰπεῖν
  choice: dapat berkata
  rationale: Padanan Indonesia yang alami bagi kemampuan atau kemungkinan yang dinyatakan oleh δύναται.
- source_word: Κύριος Ἰησοῦς
  choice: Yesus adalah Tuhan
  rationale: Dalam posisi sebagai isi perkataan, susunan nominatif ini berfungsi sebagai pengakuan. Kopula ‘adalah’ diperlukan agar maknanya jelas dalam bahasa Indonesia.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Menandai satu-satunya pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: oleh Roh Kudus
  rationale: Sejajar dengan ἐν πνεύματι θεοῦ dan menyatakan agensi Roh tanpa menutup kemungkinan nuansa berada dalam lingkup karya Roh.
theological_decisions:
- issue: Makna κύριος dalam pengakuan Κύριος Ἰησοῦς
  choice: Tuhan
  alternative: Tuan
  rationale: ‘Tuhan’ mempertahankan bobot pengakuan kristologis dalam konteks Paulus sekaligus tetap merupakan padanan lazim bagi gelar ilahi, tanpa menjabarkan implikasi teologis lebih jauh daripada teks.
- issue: Cakupan kemampuan berkata ‘Yesus adalah Tuhan’ oleh Roh Kudus
  choice: Pernyataan dipertahankan tanpa membatasi ‘berkata’ pada bunyi verbal belaka atau memperluasnya menjadi rumusan lengkap tentang pertobatan.
  alternative: Menjelaskannya sebagai pengakuan tulus saja atau sebagai doktrin menyeluruh tentang kelahiran baru.
  rationale: Teks menghubungkan pengakuan akan ketuhanan Yesus dengan karya Roh Kudus. Terjemahan mempertahankan klaim dan ketegangannya tanpa memasukkan sistem doktrinal tambahan.
- issue: Daya ungkapan Ἀνάθεμα Ἰησοῦς
  choice: Terkutuklah Yesus
  alternative: Yesus terkutuk
  rationale: Bentuk dengan -lah lebih alami sebagai seruan kutukan dalam bahasa Indonesia, sedangkan teks Yunani sendiri tidak memuat verba yang menentukan apakah ungkapan itu harus dibaca sebagai pernyataan atau kutukan langsung; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘aku’ mengikuti suara pribadi Paulus, sedangkan ‘kepadamu’ dibaca secara kolektif bagi jemaat. Pengulangan ‘berbicara ... berkata’ dipertahankan demi kedekatan dengan struktur sumber. Semua penanda catatan kaki muncul dalam teks utama.
