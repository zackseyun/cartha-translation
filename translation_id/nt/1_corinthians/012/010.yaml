source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: id
  text: kepada yang lain, berbagai karya mukjizat[a]; kepada yang lain, nubuat; kepada yang lain, kemampuan membedakan roh-roh; kepada yang lain, berbagai ragam bahasa lidah; kepada yang lain, penafsiran bahasa lidah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai karya penuh kuasa” atau “berbagai perbuatan dahsyat.”
    reason: lexical_alternative
  - marker: b
    text: “Berbagai ragam bahasa” dan “penafsiran bahasa” juga mungkin. Kata Yunani yang digunakan dapat berarti “lidah” ataupun “bahasa”; “bahasa lidah” dipertahankan di sini untuk menjaga ambiguitas dalam pembahasan Paulus tentang karunia-karunia rohani, tanpa menetapkan hakikat fenomena tersebut secara lebih khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: berbagai karya mukjizat
  rationale: ἐνεργήματα menunjuk pada karya, kegiatan, atau hasil yang dikerjakan, sedangkan δυνάμεων dalam daftar karunia ini paling mungkin menunjuk pada perbuatan penuh kuasa atau mukjizat. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan bentuk jamaknya.
- source_word: προφητεία
  choice: nubuat
  rationale: Padanan baku dan ringkas bagi karunia yang disebutkan, tanpa membatasi apakah yang dimaksud terutama ramalan, pemberitaan, atau tuturan yang diilhami.
- source_word: διακρίσεις πνευμάτων
  choice: berbagai pembedaan roh
  rationale: Bentuk jamak διακρίσεις dipertahankan dengan 'berbagai pembedaan'. 'Roh' dibiarkan luas karena teks Yunani tidak menentukan apakah yang dimaksud roh ilahi, manusiawi, jahat, atau sumber rohani di balik suatu tuturan.
- source_word: γένη γλωσσῶν
  choice: berbagai jenis bahasa lidah
  rationale: γένη berarti jenis atau ragam. 'Bahasa lidah' mempertahankan istilah khas dalam pembahasan Paulus sekaligus menghindari tambahan 'roh', yang tidak terdapat dalam teks Yunani.
- source_word: ἑρμηνεία γλωσσῶν
  choice: penafsiran bahasa lidah
  rationale: ἑρμηνεία menunjuk pada penyampaian makna secara dapat dimengerti; 'penafsiran' cukup luas untuk mencakup penerjemahan atau penjelasan tanpa memutuskan sifat fenomenanya.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: kepada yang lain
  rationale: Rangkaian datif ini menyatakan pembagian karunia kepada orang-orang yang berbeda. Peralihan dari ἄλλῳ ke ἑτέρῳ tidak perlu dipaksakan menjadi perbedaan makna dalam bahasa Indonesia.
theological_decisions:
- issue: Makna δυνάμεων dalam daftar karunia Roh
  choice: karya mukjizat
  alternative: karya penuh kuasa; perbuatan-perbuatan dahsyat
  rationale: Dalam konteks ini δυνάμεις lazim menunjuk pada perbuatan ajaib yang menyatakan kuasa. Catatan kaki mempertahankan padanan yang lebih harfiah.
- issue: Makna γλωσσῶν
  choice: bahasa lidah
  alternative: bahasa-bahasa
  rationale: Istilah Yunani dapat menunjuk pada lidah maupun bahasa. Pilihan ini mempertahankan ketegangan dalam pembahasan karunia Roh dan tidak menetapkan apakah fenomenanya selalu berupa bahasa manusia yang dikenal.
- issue: Rujukan πνευμάτων dalam διακρίσεις πνευμάτων
  choice: roh
  alternative: tuturan rohani; roh di balik tuturan; roh manusia; roh jahat
  rationale: Teks tidak memperinci jenis atau sumber roh yang dimaksud, sehingga terjemahan tidak mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'kepada yang lain' dipertahankan untuk mencerminkan pola distributif teks Yunani. Istilah 'bahasa roh' sengaja tidak digunakan karena kata 'roh' tidak terdapat dalam frasa Yunani tersebut dan akan menambahkan tafsiran.
