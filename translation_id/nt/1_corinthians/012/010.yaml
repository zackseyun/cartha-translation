    rationale: διακρίσεις adalah nomina jamak yang dalam konteks ini menunjuk pada tindakan atau kemampuan membedakan. "Kemampuan membedakan roh-roh" merupakan bahasa Indonesia yang lebih alami dan tidak mempersempit rujukan πνευμάτων.
