  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: id
  text: Namun, kenyataannya, Allah telah menempatkan setiap anggota di dalam tubuh sesuai dengan kehendak-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun, kenyataannya
  rationale: Ungkapan ini menandai pertentangan dengan keadaan hipotetis dalam ayat-ayat sebelumnya lalu kembali kepada keadaan yang sebenarnya; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan temporal harfiah seperti 'tetapi sekarang'.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan wajar bagi θεός dalam konteks Perjanjian Baru.
- source_word: ἔθετο
  choice: telah menempatkan
  rationale: Bentuk medium aoristus τίθημι menyatakan tindakan Allah menaruh atau menetapkan setiap anggota pada tempatnya. 'Menempatkan' mempertahankan makna dasar tanpa terlalu menjelaskan gagasan pengaturan.
- source_word: τὰ μέλη
  choice: anggota-anggota tubuh itu
  rationale: Dalam metafora tubuh, μέλη merujuk pada bagian-bagian tubuh. Penambahan 'tubuh' membuat maksudnya jelas dan alami dalam bahasa Indonesia, sedangkan 'anggota-anggota' saja dapat disalahpahami sebagai orang-orang dalam suatu kelompok.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: masing-masing
  rationale: Padanan ringkas dan alami yang tetap mempertahankan penekanan distributif bahwa setiap anggota secara individual ditempatkan oleh Allah.
- source_word: ἐν τῷ σώματι
  choice: di dalam tubuh
  rationale: Terjemahan langsung dan alami yang mempertahankan gambaran tubuh dalam konteks.
- source_word: καθὼς ἠθέλησεν
  choice: sesuai dengan kehendak-Nya
  rationale: Mengungkapkan kesesuaian penempatan itu dengan kemauan atau maksud Allah. 'Kehendak-Nya' dignified dan lazim, tanpa memperluas pernyataan melampaui ayat.
theological_decisions:
- issue: Kesengajaan ilahi dalam penempatan setiap anggota tubuh
  choice: Allah menempatkan setiap anggota dalam tubuh sesuai dengan kehendak-Nya.
  alternative: Allah sekadar meletakkan anggota-anggota tubuh tanpa penekanan pada maksud atau tatanan.
  rationale: ἔθετο bersama καθὼς ἠθέλησεν menyatakan bahwa keberagaman dan penempatan anggota bukan kebetulan, melainkan sesuai dengan kehendak Allah. Terjemahan ini mempertahankan penekanan tersebut tanpa memasukkan ajaran yang lebih luas daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, dengan metafora tubuh serta penekanan pada setiap anggota tetap dipertahankan.
