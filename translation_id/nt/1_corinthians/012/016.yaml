  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: id
  text: Dan jika telinga berkata[a], “Karena aku bukan mata, aku bukan bagian dari tubuh,” tidaklah karena itu telinga itu bukan bagian dari tubuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “aku bukan dari tubuh” ... “tidaklah karena itu telinga itu bukan dari tubuh.” Bahasa Yunani mengulang ungkapan “dari tubuh” untuk memberikan efek retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung biasa yang mengaitkan contoh ini dengan perumpamaan anggota tubuh sebelumnya.
- source_word: ἐὰν εἴπῃ
  choice: jika ... berkata
  rationale: ἐὰν dengan bentuk subjungtif aoris menyatakan keadaan hipotetis; ungkapan ini alami dalam bahasa Indonesia.
- source_word: τὸ οὖς
  choice: telinga
  rationale: Istilah anggota tubuh harfiah yang dipersonifikasikan dalam perumpamaan.
- source_word: Ὅτι
  choice: Karena
  rationale: Dalam perkataan telinga, ὅτι memiliki nuansa sebab dan memperkenalkan alasan keluhannya.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Padanan anatomis langsung dan alami dalam konstruksi predikatif bahasa Indonesia.
- source_word: ἐκ τοῦ σώματος
  choice: bagian dari tubuh
  rationale: Dalam konteks keanggotaan tubuh, frasa ini secara idiomatis berarti termasuk atau menjadi bagian dari tubuh; unsur 'dari' tetap dipertahankan.
- source_word: οὐ παρὰ τοῦτο
  choice: bukan karena itu
  rationale: Ungkapan ini menyangkal bahwa alasan yang baru disebut menghasilkan kesimpulan tersebut.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ia tidak menjadi bagian dari tubuh
  rationale: Mempertahankan susunan negatif dalam sanggahan Paulus sekaligus menggunakan bahasa Indonesia yang dapat dipahami dengan wajar.
theological_decisions:
- issue: Penghalusan retorika metafora tubuh Paulus
  choice: Mempertahankan sanggahan negatif dan mengulang frasa 'bagian dari tubuh'.
  alternative: “hal itu tidak membuatnya kurang menjadi bagian dari tubuh”
  rationale: Pilihan ini menjaga bentuk dan ketegangan retoris teks Yunani tanpa menambahkan penjelasan eklesiologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bagian dari tubuh' dipilih karena 'dari tubuh' saja terdengar tidak alami dan dapat disalahpahami sebagai penunjuk asal, sementara struktur negatif sumber tetap dipertahankan.
