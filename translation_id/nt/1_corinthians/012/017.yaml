base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: id
  text: Jika seluruh tubuh adalah mata[a], di manakah pendengaran? Jika seluruh tubuh adalah pendengaran, di manakah indra penciuman?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di manakah telinga? ... di manakah hidung?” Secara lebih harfiah, bahasa Yunani menyebut kemampuan mendengar dan mencium.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: seluruh tubuh
  rationale: Padanan langsung dan alami yang mempertahankan gambaran hipotetis Paulus tentang tubuh sebagai satu kesatuan.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Nomina predikatif ini paling alami diterjemahkan tanpa kata sandang dalam bahasa Indonesia dan tetap mempertahankan metafora anggota tubuh tunggal.
- source_word: ποῦ
  choice: di manakah ...?
  rationale: Mempertahankan pertanyaan lokatif Yunani; bentuk kondisi hipotetis telah dinyatakan oleh 'seandainya'.
- source_word: ἀκοή
  choice: pendengaran
  rationale: Kata Yunani menunjuk pada kemampuan atau fungsi mendengar, bukan secara langsung pada organ telinga.
- source_word: ὅλον
  choice: seluruhnya
  rationale: Mempertahankan elipsis Yunani pada klausa kedua tanpa mengulang 'tubuh', dengan ungkapan Indonesia yang wajar.
- source_word: ὄσφρησις
  choice: indra penciuman
  rationale: Menunjuk pada kemampuan mencium; ungkapan ini jelas dalam bahasa Indonesia modern dan sejajar dengan 'pendengaran'.
theological_decisions:
- issue: Metafora anggota tubuh dinyatakan melalui kemampuan indrawi atau organ fisik
  choice: 'Menerjemahkan ἀκοή dan ὄσφρησις sebagai fungsi indrawi: ''pendengaran'' dan ''indra penciuman''.'
  alternative: 'Menerjemahkannya sebagai organ: ''telinga'' dan ''hidung''.'
  rationale: Teks Yunani memakai nomina yang menyatakan kemampuan mendengar dan mencium, bukan istilah anatomis bagi telinga dan hidung. Pilihan ini menjaga ketepatan metafora tanpa membuatnya lebih konkret daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Seandainya' mengungkapkan kondisi hipotetis secara alami; susunan pertanyaan tetap ringkas dan retoris.
