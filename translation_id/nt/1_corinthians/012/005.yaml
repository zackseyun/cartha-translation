  text: Ada berbagai macam pelayanan, dan Tuhan yang sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ada ... tetapi
  rationale: Dalam rangkaian paralel ayat 4–6, καί menghubungkan pernyataan ini dengan ayat sebelumnya. Bahasa Indonesia alami dapat tidak menerjemahkannya sebagai “dan” di awal kalimat; “tetapi” sebelum klausa kedua memperjelas kontras tersirat antara keragaman pelayanan dan kesatuan Tuhan tanpa mengubah isi.
- source_word: διαιρέσεις
  choice: berbagai macam
  rationale: Dalam konteks ini kata tersebut menunjuk pada keragaman atau perbedaan jenis, bukan perpecahan. “Berbagai macam” menyampaikan keragaman dengan wajar dan tidak menyiratkan konflik.
- source_word: διακονιῶν
  choice: pelayanan
  rationale: Kata ini dapat berarti pelayanan, tindakan melayani, atau bentuk-bentuk pengabdian. “Pelayanan” sesuai dengan fungsi-fungsi yang berbeda dalam jemaat dan lazim dipahami dalam bahasa Indonesia.
- source_word: εἰσιν
  choice: ada
  rationale: “Ada” merupakan padanan eksistensial yang alami bagi εἰσιν dalam susunan klausa ini.
- source_word: ὁ αὐτὸς
  choice: tetap sama
  rationale: Frasa ini menekankan bahwa di tengah beragam pelayanan, Tuhan yang terkait dengannya tidak berbeda. “Tetap sama” mengungkapkan kesinambungan dan kesatuan itu secara alami.
- source_word: κύριος
  choice: Tuhan
  rationale: “Tuhan” mempertahankan gelar teologis κύριος. Dalam pola Roh–Tuhan–Allah pada ayat 4–6, sebutan ini kemungkinan besar merujuk kepada Yesus, tetapi terjemahan tidak memperluas referennya.
theological_decisions:
- issue: Referen “Tuhan” dalam rumusan 1 Korintus 12:4–6
  choice: Mempertahankan gelar “Tuhan” tanpa menambahkan nama Yesus dalam teks.
  alternative: Menuliskan “Tuhan Yesus” atau memahami sebutan itu secara umum sebagai Tuhan/Allah.
  rationale: Pola langsungnya menyebut Roh, Tuhan, dan Allah secara berurutan, sehingga “Tuhan” kemungkinan besar berreferen kristologis. Namun, karena teks hanya mengatakan κύριος, ambiguitas yang masih ada dipertahankan dan tidak diselesaikan melalui penambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk “Tuhannya” mengungkapkan artikel serta penekanan ὁ αὐτός secara idiomatis dalam konstruksi kontras. Istilah “pelayanan” dipertahankan karena bermartabat dan lazim dalam konteks jemaat; catatan kaki membuka nuansa tindakan melayani.
