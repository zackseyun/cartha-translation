  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: id
  text: Mengenai karunia-karunia rohani[a], Saudara-saudara[b], aku tidak ingin kalian tidak mengetahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal rohani”. Ungkapan Yunani lebih luas daripada “karunia-karunia rohani” dan secara gramatikal juga dapat dipahami sebagai “orang-orang rohani”, meskipun konteks pasal ini berfokus pada karunia yang diberikan oleh Roh.
    reason: alternative_reading
  - marker: b
    text: “Saudara-saudara” merupakan sapaan Paulus kepada jemaat dan kemungkinan besar mencakup perempuan juga.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mengenai
  rationale: Περί memperkenalkan pokok pembicaraan, sedangkan δέ memberi peralihan ringan. “Mengenai” menyampaikan fungsi wacana itu secara alami tanpa menambahkan kata waktu seperti “sekarang” yang tidak dinyatakan secara eksplisit.
- source_word: τῶν πνευματικῶν
  choice: karunia-karunia rohani
  rationale: Adjektiva yang dibendakan ini secara harfiah lebih luas dan dapat berarti “hal-hal rohani”; secara gramatikal bahkan mungkin menunjuk kepada “orang-orang rohani”. Namun, pembahasan langsung dalam pasal 12 berpusat pada pemberian dan penyataan Roh, sehingga “karunia-karunia rohani” paling jelas dalam konteks. Keluasan istilah Yunani dipertahankan dalam catatan kaki.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan maskulin jamak ini diterjemahkan secara langsung dengan bentuk sapaan Indonesia yang wajar. Dalam surat-surat Paulus, sapaan tersebut lazimnya ditujukan kepada seluruh jemaat; cakupan itu dijelaskan dalam catatan kaki.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: aku tidak mau kalian tidak mengetahuinya
  rationale: Terjemahan ini mempertahankan bentuk negatif dan maksud Paulus untuk mencegah para pembaca tetap tidak tahu, sekaligus memakai bahasa Indonesia modern yang mudah dipahami.
theological_decisions:
- issue: Cakupan τῶν πνευματικῶν
  choice: karunia-karunia rohani
  alternative: hal-hal rohani; orang-orang rohani
  rationale: Ungkapan Yunani bersifat eliptis dan tidak secara eksplisit memuat kata “karunia”. Konteks 1 Korintus 12:4–11 mendukung rujukan kepada karunia-karunia yang berasal dari Roh, tetapi kemungkinan makna yang lebih luas tidak dihapus dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Aku” mempertahankan suara pribadi Paulus, sedangkan “kalian” menyatakan bahwa ὑμᾶς berbentuk jamak. Semua penanda catatan kaki dicantumkan dalam teks utama.
