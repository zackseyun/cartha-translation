  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: id
  text: Ada beragam karunia[a], tetapi Roh itu sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai pembagian karunia” atau “perbedaan-perbedaan karunia.” Kata Yunani menekankan keragaman dalam karunia, bukan perpecahan di dalam jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: beragam
  rationale: Dalam konteks ini kata tersebut menunjukkan keragaman atau perbedaan jenis, bukan perpecahan di dalam jemaat. Ungkapan “beragam karunia” menyampaikan keragaman yang sah secara alami dalam bahasa Indonesia.
- source_word: δὲ ... δὲ
  choice: tetapi
  rationale: δέ pertama berfungsi ringan untuk mengembangkan pembahasan dan tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia; δέ kedua menyatakan kontras antara keragaman karunia dan kesamaan Roh, sehingga diterjemahkan “tetapi”.
- source_word: χαρισμάτων
  choice: karunia
  rationale: Dalam konteks ini χάρισμα menunjuk pada pemberian berdasarkan anugerah, khususnya kemampuan rohani. “Karunia” merupakan padanan Indonesia yang jelas, lazim, dan mempertahankan nuansa pemberian.
- source_word: τὸ ... αὐτὸ
  choice: itu sama
  rationale: Susunan ini menegaskan identitas Roh di tengah keragaman karunia. “Roh itu sama” mempertahankan arti “the same” tanpa mengubahnya menjadi sekadar “satu”.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks 1 Korintus 12:3–11 menunjukkan bahwa yang dimaksud ialah Roh Kudus. Huruf kapital menandai referen ilahi tanpa memperpanjang teks.
theological_decisions:
- issue: Referen πνεῦμα
  choice: Roh Kudus, dinyatakan sebagai “Roh”
  alternative: roh manusia atau kuasa/prinsip rohani
  rationale: Konteks langsung berulang kali menggambarkan Roh sebagai pihak ilahi yang memberikan dan membagikan karunia. Teks utama tetap memakai bentuk ringkas “Roh” sebagaimana sumber.
- issue: Hubungan antara karunia dan Roh
  choice: Mempertahankan kontras antara keragaman karunia dan kesamaan Roh
  alternative: Menambahkan bahwa semua karunia “berasal dari” Roh yang sama
  rationale: Gagasan sumber memang sesuai konteks, tetapi hubungan “berasal dari” tidak dinyatakan secara eksplisit dalam ayat ini. Terjemahan tidak menambahkannya agar ketegangan dan keringkasan sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan mudah dipahami. “Beragam karunia” dipilih daripada bentuk yang dapat menyiratkan konflik, sedangkan “Roh itu sama” mempertahankan penekanan Yunani pada identitas Roh.
