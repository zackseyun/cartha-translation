source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: id
  text: Sebab dalam satu Roh kita semua telah dibaptis menjadi satu tubuh—baik orang Yahudi maupun orang Yunani, baik budak maupun orang merdeka—dan kita semua telah diberi satu Roh untuk diminum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani pada awal ayat dapat juga diterjemahkan, “oleh satu Roh” atau “dengan satu Roh.” Bagian akhir dapat juga diterjemahkan, “kita semua telah diberi minum satu Roh”; “Roh” juga dapat dibaca “roh,” meskipun konteks kuat menunjuk kepada Roh Kudus.
    reason: Menjaga ambiguitas preposisi ἐν, kemungkinan susunan Indonesia untuk ἓν πνεῦμα ἐποτίσθημεν, dan keputusan interpretatif mengenai acuan πνεῦμα.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab
  rationale: Dalam konteks argumentasi Paulus, gabungan ini memperkenalkan dasar penjelasan. 'Sebab' menyampaikan fungsi tersebut secara alami; penegasannya juga tercermin dalam kata 'semua' yang diulang.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dalam satu Roh
  rationale: Menjaga bentuk Yunani dan tidak memutuskan secara berlebihan apakah ἐν menyatakan lingkup, sarana, atau perantaraan. Alternatif instrumental dicantumkan dalam catatan kaki.
- source_word: ἐβαπτίσθημεν
  choice: kita semua telah dibaptis
  rationale: Istilah 'dibaptis' merupakan padanan baku dalam konteks jemaat Paulus dan mempertahankan bentuk pasif aoristus tanpa menambahkan penekanan pada cara baptisan.
- source_word: εἰς ἓν σῶμα
  choice: menjadi satu tubuh
  rationale: Dalam bahasa Indonesia, 'dibaptis menjadi satu tubuh' secara wajar mengungkapkan hasil atau penggabungan yang ditandai oleh εἰς, tanpa ungkapan kaku 'ke dalam satu tubuh'.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: orang Yahudi ... orang Yunani
  rationale: Mempertahankan pasangan etnis yang dinyatakan secara langsung dalam teks, bukan memperluas Ἕλληνες menjadi semua orang bukan Yahudi.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: budak ... orang merdeka
  rationale: Kontras ini menyangkut status perbudakan dan kebebasan; 'budak' lebih tepat daripada 'pelayan', sedangkan 'orang merdeka' menyatakan lawannya secara alami.
- source_word: ἐποτίσθημεν
  choice: telah diberi minum
  rationale: Menyampaikan bentuk pasif ποτίζω secara alami dan mempertahankan metafora partisipasi bersama.
- source_word: ἓν πνεῦμα
  choice: satu Roh
  rationale: Konteks pasal ini sangat menunjuk kepada Roh Kudus. Huruf kapital merupakan keputusan interpretatif; kemungkinan lain dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Apakah ἐν ἑνὶ πνεύματι menyatakan lingkup atau sarana/perantaraan
  choice: dalam satu Roh
  alternative: oleh satu Roh; dengan satu Roh
  rationale: Preposisi ἐν dengan datif memungkinkan beberapa nuansa. 'Dalam satu Roh' paling dekat dengan bentuk sumber dan menjaga ketegangan teologis tanpa menetapkan tafsiran denominasi tertentu.
- issue: Acuan ἓν πνεῦμα pada klausa kedua
  choice: satu Roh, yakni Roh Kudus
  alternative: satu roh atau kenyataan rohani yang dimiliki bersama
  rationale: Paralel dengan klausa pertama dan konteks tentang karya Roh yang mempersatukan sangat mendukung acuan kepada Roh Kudus, tetapi kemungkinan pembacaan yang kurang spesifik tetap diakui dalam catatan.
- issue: Makna baptisan εἰς ἓν σῶμα
  choice: penggabungan menjadi satu tubuh
  alternative: gerak harfiah 'ke dalam satu tubuh'
  rationale: εἰς menyatakan arah atau hasil. Padanan Indonesia yang dipilih mengungkapkan penggabungan tanpa menentukan teori sakramental tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan paralel 'baik ... maupun ...' menjaga ritme retoris. Istilah 'budak' dipakai karena status terikat jelas berlawanan dengan 'orang merdeka'. Satu catatan kaki terpadu ditempatkan pada akhir ayat agar teks utama tetap lancar.
