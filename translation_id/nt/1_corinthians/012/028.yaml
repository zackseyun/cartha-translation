id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: id
  text: 'Dan Allah telah menetapkan di dalam jemaat: pertama, rasul-rasul; kedua, nabi-nabi; ketiga, pengajar-pengajar; kemudian mukjizat-mukjizat[a], lalu karunia-karunia penyembuhan, berbagai pertolongan, berbagai bentuk kepemimpinan[b], dan berbagai jenis bahasa lidah[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perbuatan-perbuatan penuh kuasa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berbagai bentuk pengarahan” atau “berbagai bentuk pengelolaan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “berbagai jenis bahasa.” Kata Yunani yang dipakai dapat berarti “lidah” atau “bahasa”; teks utama mempertahankan keterbukaan makna ungkapan Paulus dalam konteks ini.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: telah menetapkan
  rationale: Dalam konteks ini, τίθημι menyatakan tindakan Allah menempatkan atau menetapkan orang dan karya tertentu di dalam jemaat. Bentuk ini juga mempertahankan relevansi hasil tindakan tersebut.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: di dalam jemaat
  rationale: ἐκκλησία di sini menunjuk kepada umat Allah sebagai persekutuan. 'Jemaat' alami dalam bahasa Indonesia dan tidak terutama menyiratkan bangunan.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: pertama ... kedua ... ketiga
  rationale: Urutan Yunani dipertahankan secara langsung tanpa menjelaskan apakah urutan itu menyatakan jenjang, kronologi, atau keutamaan fungsi.
- source_word: ἀποστόλους
  choice: rasul-rasul
  rationale: Dalam daftar peran jemaat ini, istilah tersebut menunjuk kepada para rasul, bukan sekadar utusan pada umumnya.
- source_word: προφήτας
  choice: nabi-nabi
  rationale: Padanan baku dan jelas bagi orang-orang yang menjalankan fungsi kenabian.
- source_word: διδασκάλους
  choice: pengajar-pengajar
  rationale: Padanan langsung bagi mereka yang menjalankan fungsi mengajar di dalam jemaat.
- source_word: δυνάμεις
  choice: mukjizat-mukjizat
  rationale: Secara harfiah berarti 'kuasa-kuasa', tetapi dalam konteks daftar karunia menunjuk kepada karya-karya adikodrati. 'Mukjizat-mukjizat' menyampaikan maknanya dengan jelas; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: χαρίσματα ἰαμάτων
  choice: karunia-karunia penyembuhan
  rationale: Ungkapan ini mempertahankan bentuk jamak χαρίσματα dan secara wajar menyampaikan cakupan jamak ἰαμάτων tanpa menghasilkan susunan Indonesia yang terlalu kaku.
- source_word: ἀντιλήμψεις
  choice: berbagai pertolongan
  rationale: Kata ini menunjuk kepada tindakan atau kemampuan untuk menolong dan mendukung. Penambahan 'berbagai' membuat bentuk jamaknya terdengar alami.
- source_word: κυβερνήσεις
  choice: berbagai bentuk kepemimpinan
  rationale: Istilah ini memakai gambaran mengemudikan atau mengarahkan. Padanan ini mencakup fungsi memimpin tanpa menganggapnya sebagai jabatan hierarkis tertentu.
- source_word: γένη γλωσσῶν
  choice: berbagai jenis bahasa lidah
  rationale: γένη berarti jenis-jenis, sedangkan γλῶσσαι dapat berarti lidah atau bahasa. 'Bahasa lidah' mempertahankan istilah khas Paulus dan tidak menyisipkan kata 'roh' yang tidak terdapat dalam teks Yunani; alternatif 'bahasa-bahasa' dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah urutan ini menunjukkan jenjang tetap, urutan kronologis, atau keutamaan fungsional
  choice: 'Urutan diterjemahkan apa adanya: ''pertama ... kedua ... ketiga ... kemudian ... lalu''.'
  alternative: Menjelaskannya sebagai hierarki kewenangan, urutan kemunculan, atau urutan tingkat kepentingan.
  rationale: Ayat ini jelas memberikan urutan, tetapi tidak menjelaskan dasar urutan tersebut. Terjemahan tidak menambahkan tafsiran yang menyelesaikan ketegangan itu.
- issue: Makna γλῶσσαι dalam konteks ini
  choice: Menggunakan 'bahasa lidah' dalam teks utama.
  alternative: Bahasa-bahasa.
  rationale: Istilah Yunani dapat menunjuk kepada lidah atau bahasa, dan perdebatan mengenai hakikat fenomenanya tidak diselesaikan oleh ayat ini. Teks utama mempertahankan istilah yang terbuka, sementara alternatifnya diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Tanda titik dua serta titik koma memperjelas susunan daftar. Bentuk ulang dipakai secara selektif untuk mencerminkan unsur-unsur jamak Yunani, sedangkan 'berbagai' dipakai ketika pengulangan akan terasa kaku. Tidak digunakan istilah 'bahasa roh' karena kata 'roh' tidak ada dalam frasa Yunani ayat ini.
