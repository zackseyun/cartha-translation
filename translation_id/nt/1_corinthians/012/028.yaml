  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan isi Yunani: Allah sebagai subjek yang menetapkan dalam jemaat; urutan pertama, kedua, ketiga, lalu unsur-unsur berikutnya; serta bentuk jamak pada karunia-karunia dan fungsi-fungsi yang disebutkan. Pembedaan antara dua ἔπειτα melalui “kemudian” dan “lalu” tidak menambahkan makna urutan yang tidak ada dalam sumber.'
  naturalness: Bahasa Indonesia baku, jelas, dan cocok untuk register kitab suci modern. Tanda titik dua dan titik koma membantu pembaca mengikuti daftar panjang ini. “Bahasa lidah” merupakan istilah teknis yang dikenal dalam penggunaan Indonesia Kristen dan, bersama catatan kaki, menghindari pemutusan prematur antara kemungkinan “lidah” dan “bahasa.”
  terminology: “Jemaat,” “rasul-rasul,” “nabi-nabi,” “pengajar-pengajar,” “mukjizat-mukjizat,” dan “karunia-karunia penyembuhan” tepat bagi konteksnya. “Berbagai pertolongan” dan “berbagai bentuk kepemimpinan” secara wajar menyampaikan nomina plural ἀντιλήμψεις dan κυβερνήσεις tanpa menetapkan suatu struktur jabatan tertentu. Catatan kaki mempertahankan alternatif leksikal yang relevan.
