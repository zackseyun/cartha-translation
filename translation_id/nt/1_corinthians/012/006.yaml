  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: id
  text: Ada berbagai macam karya[a], tetapi Allah yang sama mengerjakan segala sesuatu di dalam semua orang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai kegiatan” atau “berbagai hasil.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “di dalam semua.” Kata “orang” tidak dinyatakan secara eksplisit dalam bahasa Yunani; konteksnya menunjuk kepada para anggota jemaat, yang di dalamnya Allah mengerjakan berbagai perwujudan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: berbagai
  rationale: Dalam rangkaian ayat 4–6, kata ini menunjuk pada keragaman bentuk atau jenis tanpa menyiratkan perpecahan.
- source_word: ἐνεργημάτων
  choice: cara kerja
  rationale: Kata ini menunjuk pada kegiatan atau hasil tindakan yang nyata. 'Cara kerja' alami dalam bahasa Indonesia dan mempertahankan kaitan dengan ἐνεργῶν, 'mengerjakan'.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: tetapi Allah yang sama
  rationale: 'δέ memberi kontras ringan: cara kerjanya beragam, tetapi pelakunya tetap Allah yang sama. Klausa nominal Yunani dapat diterjemahkan secara alami tanpa menambahkan ''adalah''.'
- source_word: ὁ ἐνεργῶν
  choice: mengerjakan
  rationale: Bentuk partisip kini menyatakan Allah sebagai pelaku yang aktif; verba ini juga mempertahankan hubungan leksikal dengan ἐνεργημάτων.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan ini mempertahankan cakupan luas bahasa Yunani tanpa mempersempitnya menjadi hanya karunia-karunia tertentu.
- source_word: ἐν πᾶσιν
  choice: di dalam semua orang
  rationale: Dalam konteks anggota-anggota jemaat, bentuk jamak ini paling wajar dipahami sebagai orang-orang. Catatan kaki mempertahankan bentuk Yunani yang tidak menyebut nomina secara eksplisit.
theological_decisions:
- issue: Cakupan tindakan Allah dalam τὰ πάντα ἐν πᾶσιν
  choice: Allah 'mengerjakan segala sesuatu di dalam semua orang'
  alternative: '''mengerjakan semuanya di dalam semua'' atau ''mengerjakan semua hal ini di antara semua orang'''
  rationale: Terjemahan mempertahankan keluasan τὰ πάντα, sementara konteksnya tetap kegiatan Allah dalam para anggota jemaat. Nomina 'orang' dijelaskan sebagai implisit, bukan dipakai untuk menetapkan klaim universal yang melampaui konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat ringkas agar paralel dengan ayat 4–5, dengan pengulangan 'kerja/mengerjakan' untuk mencerminkan hubungan kata dalam bahasa Yunani.
