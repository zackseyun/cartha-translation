id: 1CO.12.11
reference: 1 Corinthians 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: id
  text: Namun, Roh yang satu dan sama mengerjakan[a] semua ini sambil membagikannya kepada setiap orang secara tersendiri[b], sesuai dengan kehendak-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghasilkan” atau “mewujudkan” semua ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “membagikannya kepada masing-masing orang.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagaimana yang dikehendaki-Nya.” Kata kerja Yunani yang dipakai dapat menyatakan berkehendak, memilih, atau menginginkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Namun, ... semuanya ini
  rationale: δέ menandai peralihan ringan dari daftar karunia kepada satu sumber yang mengerjakan semuanya; πάντα ταῦτα menegaskan keseluruhan hal yang baru disebutkan.
- source_word: ἐνεργεῖ
  choice: mengerjakan
  rationale: Pilihan ini mempertahankan makna tindakan aktif atau penghasilan akibat tanpa menjelaskan mekanismenya secara berlebihan.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: Roh yang satu dan sama
  rationale: Ungkapan ini mempertahankan penekanan Yunani bahwa beragam karunia berasal dari Roh yang identik dan tunggal.
- source_word: διαιροῦν
  choice: dengan membagikannya
  rationale: Partisip ini menjelaskan cara Roh mengerjakan semua hal tersebut. 'Membagikan' sesuai dengan konteks pemberian karunia dan tidak menyiratkan perpecahan negatif; akhiran '-nya' merujuk pada semua hal yang disebutkan.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: kepada setiap orang secara khusus
  rationale: Frasa ini mempertahankan daya distributif bentuk tunggal ἑκάστῳ dan menunjukkan bahwa pembagian diberikan secara tersendiri kepada masing-masing penerima.
- source_word: καθὼς βούλεται
  choice: sesuai dengan kehendak-Nya
  rationale: Ungkapan Indonesia yang alami ini menyampaikan bahwa pembagian tersebut ditentukan oleh kehendak dan maksud Roh sendiri.
theological_decisions:
- issue: Rujukan dan kepribadian πνεῦμα dalam βούλεται
  choice: '''Roh'' ditulis dengan huruf kapital, dan akhiran hormat ''-Nya'' merujuk kepada Roh Kudus sebagai pelaku pribadi yang berkehendak.'
  alternative: Gunakan 'sesuai dengan yang dikehendakinya' dengan huruf kecil, atau hindari penandaan pronominal eksplisit.
  rationale: Walaupun πνεῦμα berjenis gramatikal netral dalam bahasa Yunani, βούλεται mengatribusikan kehendak kepada Roh. Konteks Paulus menunjuk kepada Roh Kudus sebagai pelaku ilahi, sedangkan bahasa Indonesia tidak perlu meniru gender gramatikal Yunani.
- issue: Kedaulatan atau pilihan Roh dalam pembagian karunia
  choice: Terjemahkan καθὼς βούλεται secara langsung sebagai 'sesuai dengan kehendak-Nya'.
  alternative: '''sebagaimana dipilih-Nya'' atau ''sesuai dengan yang diinginkan-Nya''.'
  rationale: Terjemahan ini mempertahankan pernyataan bahwa pembagian mengikuti kehendak Roh tanpa menambahkan sistem teologis tentang hakikat atau batas kedaulatan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan penekanan pada satu Roh, keberagaman pembagian kepada tiap orang, dan kehendak pribadi Roh. Semua penanda catatan kaki muncul dalam teks utama.
