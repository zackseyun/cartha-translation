  source_fidelity: 'Makna pokok tersampaikan dengan setia: satu Roh yang sama mengerjakan seluruh manifestasi yang disebutkan dan membagikannya kepada tiap orang menurut kehendak-Nya. Namun, "secara khusus" dapat dipahami sebagai pemberian yang istimewa, bukan pembagian secara individual (ἰδίᾳ). Penempatan penanda catatan a juga perlu dipindahkan agar benar-benar melekat pada ἐνεργεῖ ("mengerjakan").'
  naturalness: Kalimatnya sudah baku dan jelas. "Secara tersendiri" lebih idiomatis dan lebih tepat daripada "secara khusus" untuk menyatakan pembagian kepada setiap orang secara individual. Menempatkan "sambil" dengan partisip διαιροῦν menyatakan tindakan yang menyertai "mengerjakan" secara alami dalam bahasa Indonesia.
  terminology: '"Roh" dengan huruf kapital dan akhiran "-Nya" sesuai dengan konteks Paulus dan mempertahankan pelaku yang berkehendak. "Roh yang satu dan sama" secara baik menerjemahkan τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα tanpa menambahkan penafsiran doktrinal.'
