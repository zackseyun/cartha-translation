  naturalness: «Siapakah di antara manusia» dan terutama «telah mengetahui» agak kaku dalam bahasa Indonesia modern. «Siapa di antara manusia» serta «mengetahui apa yang ada dalam diri ...» lebih idiomatis, sambil mempertahankan pertanyaan retoris dan paralelisme ayat.
  terminology: «Roh Allah» tepat dalam konteks ini dan kapitalisasinya patut dipertahankan. «Apa yang ada dalam diri seseorang/Allah» merupakan padanan Indonesia yang alami untuk τὰ τοῦ ἀνθρώπου / τὰ τοῦ θεοῦ dalam konteks pengetahuan batin; istilah ini tidak membatasi makna hanya pada pikiran.
