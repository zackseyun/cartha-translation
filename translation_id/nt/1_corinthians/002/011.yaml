source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: id
  text: Sebab, siapa di antara manusia yang mengetahui apa yang ada dalam diri seseorang selain roh orang itu yang ada di dalam dirinya? Demikian pula, tidak seorang pun mengetahui apa yang ada dalam diri Allah selain Roh Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: manusia / seseorang
  rationale: Kata ini merujuk kepada manusia secara umum, bukan khusus laki-laki. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan peralihan dari kelompok umum kepada individu.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: hal-hal dalam diri seseorang
  rationale: Ungkapan Yunani ini luas, menunjuk pada perkara batin yang berkenaan dengan seseorang, dan tidak boleh dipersempit hanya menjadi pikiran. 'Dalam diri' memperjelas konteks pengetahuan batin tanpa menghilangkan kesejajaran dengan klausa tentang Allah.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: roh orang itu yang ada di dalam dirinya
  rationale: Terjemahan ini mempertahankan unsur kepunyaan dan frasa atributif yang menyatakan keberadaan roh tersebut di dalam orang itu, tanpa menggantinya dengan istilah tafsiran seperti 'roh batiniah'.
- source_word: οὕτως καὶ
  choice: Demikian pula
  rationale: Ungkapan ini menandai analogi erat antara pengetahuan mengenai batin manusia dan pengetahuan mengenai Allah.
- source_word: ἔγνωκεν
  choice: telah mengetahui
  rationale: Bentuk perfektum dipertahankan agar aspek tindakan lampau dengan keadaan hasilnya tetap terdengar, sekalipun bahasa Indonesia juga dapat mengungkapkan maksud kontekstualnya dengan 'mengetahui'.
- source_word: τὰ τοῦ θεοῦ
  choice: hal-hal dalam diri Allah
  rationale: Ungkapan ini sengaja luas dan sejajar dengan 'hal-hal dalam diri seseorang'; terjemahan ini tidak mempersempitnya menjadi pikiran Allah saja.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Roh Allah
  rationale: Dalam konteks 1 Korintus 2, ungkapan ini menunjuk kepada Roh Allah yang menyelidiki dan menyatakan apa yang berasal dari Allah. Huruf kapital mengikuti kaidah Indonesia untuk sebutan ilahi.
theological_decisions:
- issue: Apakah πνεῦμα τοῦ θεοῦ diterjemahkan sebagai sebutan pribadi ilahi atau sebagai 'roh' non-titular.
  choice: Roh Allah
  alternative: roh Allah
  rationale: Konteks langsung menggambarkan Roh yang mengetahui, menyelidiki, dan menyatakan hal-hal Allah. Penulisan dengan huruf kapital menandai referen tersebut tanpa menambahkan rincian doktrinal di luar teks.
- issue: Apakah τὰ τοῦ ἀνθρώπου dan τὰ τοῦ θεοῦ dibatasi menjadi 'pikiran'.
  choice: hal-hal dalam diri seseorang / hal-hal dalam diri Allah
  alternative: pikiran seseorang / pikiran Allah
  rationale: Bentuk Yunani memiliki cakupan lebih luas daripada pikiran saja. Terjemahan utama mempertahankan keluasan dan kesejajaran retoris itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan pertanyaan retoris serta kesejajaran antara manusia dan Allah. Istilah 'hal-hal dalam diri' dipilih untuk menghindari frasa harfiah yang kaku 'hal-hal dari' sekaligus menjaga keluasan makna.
