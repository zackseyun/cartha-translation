source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: id
  text: Namun, manusia alamiah[a] tidak menerima hal-hal dari Roh Allah, sebab semuanya itu adalah kebodohan baginya; ia juga tidak mampu mengenalinya, karena semuanya itu dinilai secara rohani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia duniawi” atau “manusia yang tidak rohani.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dikenali secara rohani” atau “diperiksa secara rohani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: duniawi
  rationale: Dalam konteks ini ψυχικός berlawanan dengan πνευματικός dan menunjuk pada manusia yang terbatas pada kehidupan alamiah, tanpa penilaian rohani. “Duniawi” merupakan padanan Indonesia yang alami, sementara alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: ἄνθρωπος
  choice: manusia
  rationale: Kata ini bersifat representatif dan tidak khusus menunjuk laki-laki; “manusia” mempertahankan bentuk tunggal generik secara alami dalam bahasa Indonesia.
- source_word: δέχεται
  choice: menerima
  rationale: “Menerima” mencakup penerimaan terhadap hal-hal dari Roh Allah, bukan sekadar mendengarnya.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: hal-hal yang berasal dari Roh Allah
  rationale: Genitif Yunani dapat menyatakan apa yang berasal dari atau berkaitan dengan Roh Allah. Ungkapan ini alami dalam bahasa Indonesia tanpa mempersempit cakupannya.
- source_word: μωρία
  choice: kebodohan
  rationale: “Kebodohan” mempertahankan istilah yang berulang dalam argumentasi Paulus mengenai hikmat Allah dan penilaian manusia.
- source_word: γνῶναι
  choice: mengenalnya
  rationale: γινώσκω secara langsung berarti mengetahui atau mengenal; “mengenalnya” mempertahankan ketegangan teks tanpa mengubahnya menjadi sekadar pemahaman intelektual.
- source_word: πνευματικῶς
  choice: secara rohani
  rationale: Padanan adverbial langsung yang mempertahankan kemungkinan makna cara atau ranah penilaian.
- source_word: ἀνακρίνεται
  choice: dinilai
  rationale: ἀνακρίνω dapat berarti memeriksa, menilai, atau mencermati. “Dinilai” cocok dengan konteks dan bentuk pasif, sedangkan alternatif penting dicatat dalam catatan kaki.
theological_decisions:
- issue: Kontras antara ψυχικὸς dan πνευματικῶς
  choice: manusia duniawi
  alternative: manusia yang tidak rohani; manusia alamiah
  rationale: “Manusia duniawi” mempertahankan kontras dengan penilaian rohani tanpa menambahkan penjelasan doktrinal bahwa orang itu secara pasti tidak memiliki Roh.
- issue: Arti ἀνακρίνεται dalam klausa penutup
  choice: dinilai secara rohani
  alternative: dikenali secara rohani; diperiksa secara rohani
  rationale: Pilihan ini mempertahankan nuansa evaluatif kata kerja dan ambiguitas mengenai cara atau ranah penilaian, tanpa secara eksplisit mengganti πνευματικῶς dengan “oleh Roh.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah menjadi dua kalimat agar mudah dibaca, sambil mempertahankan hubungan sebab-akibat dan semua unsur sumber Yunani.
