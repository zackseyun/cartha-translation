lexical_decisions:
- source_word: κἀγώ
  choice: Dan ... aku
  rationale: Mempertahankan daya penghubung καί dengan ayat sebelumnya serta menyatakan subjek Paulus secara eksplisit tanpa menambahkan penekanan yang tidak perlu.
- source_word: ἐν ἀσθενείᾳ
  choice: dalam kelemahan
  rationale: Menjaga keluasan makna ἀσθένεια, yang dapat menunjuk pada kelemahan atau kerapuhan, tanpa mempersempit jenis kelemahannya.
- source_word: ἐν φόβῳ
  choice: dalam ketakutan
  rationale: Menerjemahkan keadaan yang dinyatakan secara langsung dan tidak melunakkannya menjadi sekadar rasa hormat atau kehati-hatian.
- source_word: ἐν τρόμῳ πολλῷ
  choice: dengan sangat gemetar
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan τρόμος dan penegasan πολλῷ dengan kuat.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: ketika berada di tengah-tengah kalian, aku berada
  rationale: Mengungkapkan keadaan Paulus saat hadir bersama jemaat Korintus. Susunan ini mempertahankan pilihan utama bernuansa keberadaan, sementara kemungkinan makna kedatangan dicatat dalam catatan kaki.
