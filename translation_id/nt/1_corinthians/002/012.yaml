  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: id
  text: Namun, kita tidak menerima roh dunia, melainkan Roh yang berasal dari Allah, supaya kita mengetahui apa yang telah dianugerahkan Allah kepada kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: roh / Roh
  rationale: Kemunculan pertama menunjuk pada pengaruh atau watak yang mencirikan dunia, sedangkan kemunculan kedua dalam konteks ini paling wajar menunjuk pada Roh Allah; perbedaan huruf kapital mempertahankan kontras tersebut.
- source_word: κόσμου
  choice: dunia
  rationale: “Dunia” merupakan padanan baku dan alami bagi κόσμος di sini, yakni tatanan manusia yang berlawanan dengan Allah.
- source_word: ἐλάβομεν
  choice: menerima
  rationale: Bentuk aoristus menyatakan tindakan penerimaan; dalam bahasa Indonesia, “menerima” secara alami dapat mencakup tindakan lampau yang tetap relevan dalam argumen Paulus tanpa tambahan aspek yang tidak tersurat.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: yang berasal dari Allah
  rationale: Ungkapan ini mempertahankan relasi sumber yang dinyatakan oleh ἐκ dan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἵνα εἰδῶμεν
  choice: supaya kita mengetahui
  rationale: “Supaya” mempertahankan klausa tujuan, sedangkan “mengetahui” merupakan padanan langsung bagi makna kognitif οἶδα.
- source_word: χαρισθέντα
  choice: telah dianugerahkan
  rationale: “Dianugerahkan” menyampaikan tindakan memberi dengan kemurahan sebagai karunia, sehingga nuansa χαρίζομαι tidak diratakan menjadi sekadar “diberikan”.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: apa yang telah dianugerahkan Allah kepada kita
  rationale: “Apa yang” mempertahankan cakupan luas bentuk jamak netral dan tidak membatasinya hanya pada karunia-karunia rohani tertentu; Allah dinyatakan sebagai pelaku sesuai konstruksi ὑπὸ τοῦ θεοῦ.
theological_decisions:
- issue: Apakah πνεῦμα τὸ ἐκ τοῦ θεοῦ secara khusus menunjuk kepada Roh Kudus
  choice: “Roh yang berasal dari Allah” dengan huruf kapital
  alternative: “roh yang berasal dari Allah”
  rationale: Dalam konteks langsung, kontras dengan “roh dunia” paling wajar menunjuk kepada Roh Allah yang diterima orang percaya. Huruf kapital menandai pembacaan ini tanpa menambahkan kata “Kudus,” yang tidak muncul dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” mengungkapkan kontras δέ secara wajar; “melainkan” mempertahankan pola οὐ ... ἀλλά. Istilah “dianugerahkan” dipilih agar nuansa pemberian berdasarkan kemurahan tetap terdengar tanpa menjadi teknis atau denominatif.
