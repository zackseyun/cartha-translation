revisions:
- from: Aku juga, ketika datang kepadamu, Saudara-saudara[a], tidak datang dengan keunggulan tutur kata atau hikmat untuk memberitakan kepadamu kesaksian Allah.[b]
  to: Dan aku, ketika aku datang kepadamu, saudara-saudara, tidak datang dengan kata-kata atau hikmat yang mengagumkan, sambil memberitakan kepadamu kesaksian Allah.[b]
  rationale: Revisi membuat subjek anak kalimat eksplisit, mengganti konstruksi tujuan dengan “sambil memberitakan” untuk mencerminkan fungsi partisip, dan memakai ungkapan Indonesia yang lebih alami untuk ὑπεροχὴν λόγου ἢ σοφίας. Catatan [a] dihapus karena revisi tidak lagi memakai penanda pada “saudara-saudara”; catatan [b] tetap berjangkar pada “kesaksian Allah” dan mempertahankan varian tekstual penting. Makna teks tidak diubah.
