id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: id
  text: Dan aku, ketika aku datang kepadamu, saudara-saudara, tidak datang dengan kata-kata atau hikmat yang mengagumkan, sambil memberitakan kepadamu kesaksian Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sejumlah naskah berbunyi “rahasia Allah.”
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Aku juga
  rationale: Mempertahankan daya penghubung καί dan penegasan pada subjek orang pertama tanpa melebih-lebihkan penekanannya.
- source_word: ἐλθὼν … ἦλθον
  choice: ketika datang … tidak datang
  rationale: Partisip aoris diungkapkan secara alami sebagai anak kalimat waktu, sedangkan kata kerja utama tetap menjadi pernyataan pokok.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini alami dan bermartabat dalam bahasa Indonesia serta dapat digunakan bagi sesama anggota jemaat; cakupan terhadap perempuan dijelaskan dalam catatan kaki.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: dengan keunggulan tutur kata atau hikmat
  rationale: Ungkapan ini mempertahankan gagasan keunggulan atau kesan mengesankan dalam retorika dan hikmat tanpa mempersempitnya menjadi gaya pidato tertentu.
- source_word: καταγγέλλων
  choice: untuk memberitakan
  rationale: Bentuk ini mengungkapkan hubungan partisip dengan kedatangan Paulus secara alami dalam bahasa Indonesia, sambil mempertahankan makna pengumuman terbuka.
- source_word: μαρτύριον
  choice: kesaksian
  rationale: Mengikuti bacaan teks utama SBLGNT dan mempertahankan bobot formal nomina tersebut.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi 'kesaksian Allah' mempertahankan kemungkinan bahwa kesaksian itu berasal dari Allah atau mengenai Allah, tanpa menetapkan salah satu tafsiran.
theological_decisions:
- issue: Varian teks pada μαρτύριον
  choice: kesaksian Allah
  alternative: rahasia Allah
  rationale: Teks utama SBLGNT berbunyi μαρτύριον ('kesaksian'), sedangkan sejumlah naskah membaca μυστήριον ('rahasia'). Varian yang bermakna ini dicatat tanpa mengganti teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, jelas, dan bermartabat. 'Tutur kata' dipilih agar unsur λόγος dalam konteks kemampuan retoris tetap terdengar, sementara konstruksi 'kesaksian Allah' sengaja mempertahankan ambiguitas genitif Yunani.
