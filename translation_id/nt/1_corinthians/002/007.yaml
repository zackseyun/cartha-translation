  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: id
  text: Namun kami menyampaikan hikmat Allah dalam suatu misteri[a], yaitu hikmat yang tersembunyi, yang telah Allah tentukan sebelumnya[b], sebelum segala zaman[c], untuk kemuliaan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara tersembunyi.” Kata Yunani yang diterjemahkan “misteri” sering dipakai Paulus untuk rencana Allah yang dahulu tersembunyi dan kemudian dinyatakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah Allah tetapkan sebelumnya” atau “telah Allah takdirkan sebelumnya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sebelum zaman-zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: kami menyampaikan
  rationale: Kata ini pada dasarnya berarti berbicara atau mengatakan. Dalam konteks hikmat yang disampaikan kepada orang lain, “menyampaikan” terdengar alami tanpa memperkuatnya menjadi pemberitaan resmi.
- source_word: θεοῦ σοφίαν
  choice: hikmat Allah
  rationale: Bentuk posesif yang alami dalam bahasa Indonesia ini mempertahankan pengertian bahwa hikmat tersebut berasal dari dan menjadi milik Allah.
- source_word: ἐν μυστηρίῳ
  choice: dalam suatu misteri
  rationale: “Misteri” mempertahankan istilah khas Paulus bagi rencana ilahi yang dahulu tersembunyi dan kemudian dinyatakan; terjemahan “rahasia” saja dapat mengaburkan nuansa tersebut.
- source_word: τὴν ἀποκεκρυμμένην
  choice: yaitu hikmat yang tersembunyi
  rationale: Partisip feminin ini merujuk kembali kepada “hikmat.” Pengulangan “hikmat” memperjelas rujukannya, sedangkan “yaitu” mengungkapkan hubungan aposisi dalam bahasa Indonesia yang wajar.
- source_word: προώρισεν
  choice: telah Allah tentukan sebelumnya
  rationale: Ungkapan ini mempertahankan arti penentuan ilahi yang dilakukan lebih dahulu, tetapi menghindari kesan bahwa satu sistem teologis tertentu telah dimasukkan ke dalam terjemahan.
- source_word: πρὸ τῶν αἰώνων
  choice: sebelum segala zaman
  rationale: Terjemahan ini mempertahankan gambaran temporal-kosmis dari bentuk jamak αἰώνων dan lebih alami daripada “sebelum zaman-zaman.”
- source_word: εἰς δόξαν ἡμῶν
  choice: untuk kemuliaan kita
  rationale: Ini merupakan padanan langsung yang mempertahankan bobot teologis δόξα tanpa menafsirkannya secara lebih sempit sebagai penghormatan atau proses pemuliaan.
theological_decisions:
- issue: Makna προώρισεν dalam konteks Paulus yang memiliki bobot doktrinal
  choice: telah Allah tentukan sebelumnya
  alternative: telah Allah takdirkan sebelumnya; telah Allah tetapkan sebelumnya
  rationale: Kata kerjanya menyatakan tindakan Allah menentukan sesuatu lebih dahulu. Pilihan ini mempertahankan kekuatan makna tersebut tanpa menyelesaikan ketegangan teologis menurut kerangka denominasi tertentu.
- issue: Makna μυστήριον dalam pemakaian Paulus
  choice: misteri
  alternative: rahasia
  rationale: “Misteri” di sini bukan teka-teki yang tidak dapat dipahami, melainkan rencana Allah yang tersembunyi. Istilah sumber dipertahankan, sementara catatan kaki menjelaskan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur aposisi Yunani dipertahankan dengan “yaitu,” sedangkan susunan klausa dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
