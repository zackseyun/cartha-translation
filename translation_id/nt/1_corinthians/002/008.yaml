  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: id
  text: yang tidak seorang pun dari para penguasa zaman ini pernah pahami.[a] Sebab, seandainya mereka memahaminya, mereka tidak akan menyalibkan Tuhan yang mulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Para penguasa zaman ini” dapat merujuk pada para penguasa manusia, kuasa-kuasa rohani, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: yang
  rationale: Kata ganti relatif feminin tunggal ini merujuk pada hikmat dalam ayat sebelumnya; “yang” menghubungkannya secara alami dalam bahasa Indonesia.
- source_word: ἀρχόντων
  choice: para penguasa
  rationale: Pilihan ini menyatakan pihak-pihak yang menjalankan kuasa dan tetap membuka kemungkinan bahwa yang dimaksud adalah penguasa manusia, kuasa rohani, atau keduanya.
- source_word: αἰῶνος τούτου
  choice: zaman ini
  rationale: “Zaman” mempertahankan nuansa temporal αἰών dan lebih tepat daripada “dunia” dalam ungkapan Paulus ini.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: dikenal / mengenalnya
  rationale: Akar γινώσκω diterjemahkan secara langsung dengan “mengenal”; bentuk pasif pada klausa pertama diperlukan agar hubungan relatif dengan “hikmat” tetap alami, sedangkan “mengenalnya” mengungkapkan objek yang sama dalam kondisi kontrafaktual.
- source_word: κύριον
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku yang mempertahankan bobot gelar κύριος.
- source_word: δόξης
  choice: yang mulia
  rationale: Dalam konstruksi κύριον τῆς δόξης, ungkapan idiomatis Indonesia “Tuhan yang mulia” menyampaikan kualitas kemuliaan secara alami tanpa mengurangi bobot teologisnya.
- source_word: ἐσταύρωσαν
  choice: menyalibkan
  rationale: Padanan langsung dan mapan ini mempertahankan kekhususan historis cara penghukuman tersebut.
theological_decisions:
- issue: Identitas “para penguasa zaman ini”
  choice: Diterjemahkan secara netral sebagai “para penguasa zaman ini.”
  alternative: Penguasa politik atau agama manusia; kuasa rohani atau demonis; atau rujukan berlapis kepada keduanya.
  rationale: Ungkapan Yunani tersebut memungkinkan lebih dari satu cakupan rujukan. Teks utama tidak menentukan salah satunya, sedangkan catatan kaki mempertahankan ambiguitas yang nyata.
- issue: Makna κύριον τῆς δόξης
  choice: Tuhan yang mulia
  alternative: Tuhan kemuliaan
  rationale: Genitif Yunani dapat dipertahankan secara harfiah sebagai “Tuhan kemuliaan,” tetapi ungkapan itu kurang wajar dan dapat kabur dalam bahasa Indonesia modern. “Tuhan yang mulia” menyampaikan daya predikatif ungkapan tersebut dengan jelas tanpa memasukkan identitas atau doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kaitan dengan “hikmat” pada ayat sebelumnya, kondisi kontrafaktual, serta ambiguitas identitas para penguasa.
