  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: id
  text: Kami juga menyampaikan hal-hal ini, bukan dengan kata-kata yang diajarkan oleh hikmat manusia, melainkan dengan kata-kata yang diajarkan oleh Roh, sambil menjelaskan hal-hal rohani kepada orang-orang rohani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan mengungkapkan hal-hal rohani dengan kata-kata rohani.” Bentuk Yunani πνευματικοῖς dapat dipahami sebagai maskulin, “kepada orang-orang rohani,” atau sebagai rujukan kepada “kata-kata rohani” yang tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Hal-hal itu
  rationale: Menunjuk kembali secara alami kepada hal-hal yang baru saja dibicarakan Paulus tanpa menghilangkan fungsi relatif-demonstratif frasa Yunani.
- source_word: λαλοῦμεν
  choice: kami sampaikan
  rationale: Dalam konteks pengajaran, 'sampaikan' mengungkapkan tindakan berbicara dan penyampaian isi secara lebih alami daripada terjemahan harfiah yang kaku.
- source_word: ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: dengan kata-kata yang diajarkan oleh hikmat manusia
  rationale: '''Dengan'' menyatakan sarana, sedangkan susunan ini mempertahankan hikmat manusia sebagai sumber pengajaran kata-kata tersebut.'
- source_word: ἐν διδακτοῖς πνεύματος
  choice: dengan kata-kata yang diajarkan oleh Roh
  rationale: Kata 'kata-kata' dilengkapi dari λόγοις pada klausa sebelumnya, sebagaimana dituntut oleh elipsis Yunani; 'Roh' merujuk kepada Roh Allah dalam konteks pasal ini.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: dengan menjelaskan hal-hal rohani kepada orang-orang rohani
  rationale: Memahami συγκρίνοντες sebagai 'menjelaskan' dan πνευματικοῖς sebagai bentuk maskulin datif yang menunjuk kepada penerima. Karena bentuk itu juga dapat dipahami sebagai netral dan menyiratkan sarana berupa kata-kata rohani, kemungkinan tersebut dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rujukan πνεύματος
  choice: Roh, yakni Roh Allah
  alternative: roh dalam arti umum
  rationale: Konteks langsung 1 Korintus 2 berulang kali membedakan Roh Allah dari hikmat manusia, sehingga rujukan personal ilahi paling sesuai tanpa perlu menambahkan kata 'Kudus' yang tidak tertulis dalam ayat ini.
- issue: Jenis gramatikal dan fungsi πνευματικοῖς
  choice: 'maskulin: kepada orang-orang rohani'
  alternative: 'netral dengan nomina tersirat: dengan kata-kata rohani'
  rationale: Bentuk Yunani memungkinkan kedua pembacaan. Teks utama memakai pembacaan personal yang masuk akal, sementara catatan kaki mempertahankan ambiguitas asli dan kaitan alternatifnya dengan pembicaraan tentang kata-kata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan yang mudah dipahami. Pengulangan 'kata-kata' dipertahankan demi kejelasan elipsis dan kontras dalam teks Yunani. Kapitalisasi 'Roh' menandai rujukan kepada Roh Allah berdasarkan konteks.
