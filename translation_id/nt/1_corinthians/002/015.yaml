id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: id
  text: Namun, orang yang rohani[a] menilai segala sesuatu[b], tetapi ia sendiri tidak dinilai oleh siapa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang rohani”; bentuk tunggal maskulin ini dipakai sebagai kata benda dan secara umum menunjuk kepada orang yang bercirikan atau dipimpin oleh Roh.
    reason: cultural_note
  - marker: b
    text: Atau “memeriksa”, “membedakan”, atau “menghakimi”; kata Yunani yang sama juga dipakai dalam frasa “tidak dinilai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: orang yang rohani
  rationale: Adjektiva tunggal maskulin ini dipakai secara substantival dan secara umum menunjuk kepada orang yang bercirikan atau dipimpin oleh Roh; ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada laki-laki.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: menilai / dinilai
  rationale: Dalam konteks ini, verba tersebut menunjuk pada penelaahan dan penilaian yang saksama, bukan terutama penghukuman akhir. Pengulangan padanan yang sama mempertahankan hubungan leksikal dan kontras aktif-pasif dalam bahasa Yunani.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Padanan ini mempertahankan cakupan menyeluruh dan bentuk pernyataan yang tidak dibatasi dalam teks sumber.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Kata ganti ini bersifat menegaskan; 'ia sendiri' mempertahankan penekanan tanpa menjadikan rujukan generik tersebut khusus laki-laki.
- source_word: ὑπ’ οὐδενὸς
  choice: oleh siapa pun
  rationale: Dalam konstruksi negatif, ungkapan ini secara alami menyatakan 'oleh tidak seorang pun'; bersama 'tidak', bentuk 'oleh siapa pun' menghasilkan penyangkalan mutlak dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan pernyataan Paulus mengenai orang yang rohani
  choice: Mempertahankan ungkapan mutlak 'segala sesuatu' dan 'tidak dinilai oleh siapa pun'.
  alternative: Membatasi secara eksplisit dalam teks utama hanya pada perkara-perkara rohani.
  rationale: Ayat Yunani menyatakan klaim ini tanpa pembatas eksplisit, sedangkan konteks terdekat menyediakan kerangka penafsirannya. Menambahkan batasan dalam teks utama akan menyelesaikan ketegangan teologis yang dibiarkan tetap terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku yang modern, wajar, dan bermartabat. Susunan kontras dipertahankan, rujukan generik tidak dibuat khusus laki-laki, dan cakupan mutlak teks tidak dipersempit.
