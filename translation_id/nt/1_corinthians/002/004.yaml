  naturalness: Teksnya pada dasarnya baku dan mengalir. “Pembuktian oleh Roh dan kuasa” merupakan susunan yang alami dalam bahasa Indonesia modern dan menyampaikan fungsi genitif secara jelas tanpa mengubah kontras retoris ayat.
