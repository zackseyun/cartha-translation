  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: id
  text: Perkataanku dan pemberitaanku tidak disampaikan dengan hikmat yang meyakinkan,[b] melainkan dengan pembuktian oleh Roh[a] dan kuasa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh.”
    reason: alternative_reading
  - marker: b
    text: Atau “dengan kata-kata hikmat yang meyakinkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: perkataan
  rationale: Dalam konteks ini menunjuk pada tutur atau cara Paulus berbicara; pilihan ini dibedakan dari κήρυγμα tanpa mempersempitnya menjadi satu kata saja.
- source_word: κήρυγμα
  choice: pemberitaan
  rationale: Mempertahankan gagasan pewartaan terbuka yang menjadi ciri κήρυγμα dan terdengar alami dalam bahasa Indonesia modern.
- source_word: πειθοῖ σοφίας
  choice: dengan hikmat yang memikat
  rationale: Ungkapan Yunani tidak secara eksplisit memuat kata 'kata-kata'. 'Hikmat yang memikat' menyampaikan daya bujuk retoris yang dikontraskan dengan penyataan ilahi.
- source_word: ἀποδείξει
  choice: penyataan
  rationale: Mengungkapkan tindakan memperlihatkan atau membuktikan secara nyata, sebagai lawan dari bujukan retoris semata.
- source_word: πνεύματος
  choice: Roh
  rationale: Konteks pasal ini mendukung rujukan kepada Roh Allah, sementara kemungkinan 'roh' tetap dicatat dalam catatan kaki.
- source_word: δυνάμεως
  choice: kuasa
  rationale: Padanan Indonesia yang jelas dan lazim bagi δύναμις serta cocok dalam rangkaian 'Roh dan kuasa'.
theological_decisions:
- issue: Apakah πνεύματος merujuk kepada Roh Kudus atau kepada roh dalam arti lain
  choice: Roh
  alternative: roh
  rationale: Alur 1 Korintus 2 menekankan karya dan penyataan yang berasal dari Roh Allah. Namun, karena bentuk Yunani sendiri tidak memakai kapitalisasi dan dapat dibaca secara lain, alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kontras οὐκ ... ἀλλ’ ('tidak ... melainkan'). Kata 'disampaikan' ditambahkan secara wajar agar frasa instrumen terdengar alami dalam bahasa Indonesia tanpa mengubah isi pokok.
