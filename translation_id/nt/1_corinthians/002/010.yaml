  rationale: Revisi mengganti bentuk jamak yang kaku “kedalaman-kedalaman Allah” dengan “kedalaman Allah,” padanan Indonesia yang alami bagi τὰ βάθη τοῦ θεοῦ. Catatan b disesuaikan agar tetap menyediakan alternatif leksikal. Susunan klausa juga dinormalisasi demi kelancaran Bahasa Indonesia, sambil mempertahankan semua unsur makna sumber, termasuk objek tersirat yang dijelaskan dalam catatan a.
