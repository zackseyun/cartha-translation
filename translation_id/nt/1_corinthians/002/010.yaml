id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: id
  text: Sebab, Allah telah menyatakan hal-hal itu kepada kita melalui Roh,[a] karena Roh menyelidiki segala sesuatu, bahkan kedalaman Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, objek dari “telah menyatakan” tidak disebutkan; “hal-hal itu” dipahami dari konteks sebelumnya.
    reason: alternative_reading
  - marker: b
    text: Atau “hal-hal yang dalam dari Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Datif ini menunjukkan penerima penyataan; bentuk dengan -lah mempertahankan penekanan pada 'kita' yang muncul di awal klausa Yunani.
- source_word: ἀπεκάλυψεν
  choice: telah menyatakan
  rationale: Aoristus menunjuk pada tindakan penyataan yang sudah terjadi; 'telah menyatakan' terdengar alami dan menegaskan relevansi hasilnya bagi para penerima.
- source_word: '[objek tersirat dari ἀπεκάλυψεν]'
  choice: hal-hal itu
  rationale: Bahasa Yunani tidak menyebutkan objek langsung, tetapi konteks sebelumnya memasok acuannya; penambahan ini membuat hubungan tersebut jelas tanpa menafsirkannya secara berlebihan.
- source_word: διὰ τοῦ πνεύματος
  choice: melalui Roh
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; 'melalui Roh' mempertahankan nuansa tersebut.
- source_word: πνεῦμα
  choice: Roh
  rationale: Konteks penyataan ilahi dan pengetahuan tentang kedalaman Allah menunjukkan Roh Allah; kapitalisasi menandai rujukan ini.
- source_word: ἐραυνᾷ
  choice: menyelidiki
  rationale: Kata ini menggambarkan pemeriksaan atau penelusuran yang mendalam; 'menyelidiki' alami dalam bahasa Indonesia dan mempertahankan daya aktif verba.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Padanan luas dan idiomatis untuk cakupan menyeluruh kata Yunani.
- source_word: καὶ
  choice: bahkan
  rationale: Di sini καί bersifat intensif dan mengantar puncak pernyataan, yaitu kedalaman Allah.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: kedalaman-kedalaman Allah
  rationale: Bentuk ini mempertahankan metafora dan bentuk jamak Yunani, sekalipun 'kedalaman Allah' lebih lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah πνεῦμα merujuk kepada Roh Kudus atau roh manusia
  choice: Roh Allah dalam kedua kemunculan
  alternative: roh manusia dalam pengertian umum
  rationale: Roh menjadi perantara penyataan Allah dan mengetahui sampai pada kedalaman Allah, sehingga konteks kuat menunjuk kepada Roh Allah.
- issue: Apakah verba 'menyelidiki' menyiratkan Roh belum mengetahui sesuatu
  choice: Mempertahankan ungkapan figuratif sumber tanpa menjelaskan implikasinya di dalam teks
  alternative: Mengganti dengan 'mengetahui sepenuhnya' untuk menghindari kesan pencarian informasi
  rationale: ἐραυνᾷ secara langsung berarti menyelidiki atau menelusuri; metafora sumber sebaiknya dipertahankan tanpa meredakan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'kepada kitalah' mempertahankan penekanan Yunani tanpa menjadi kaku. Bentuk jamak 'kedalaman-kedalaman' dipakai dalam teks demi kedekatan formal, dengan bentuk Indonesia yang lebih lazim dicatat sebagai alternatif.
