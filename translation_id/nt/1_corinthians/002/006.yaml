id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: id
  text: Namun, kami menyampaikan hikmat di antara orang-orang yang dewasa[a], tetapi bukan hikmat zaman ini, bukan pula hikmat para penguasa zaman ini[b], yang sedang ditiadakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang sempurna”; dalam konteks ini kemungkinan besar orang-orang yang matang secara rohani.
    reason: lexical_alternative
  - marker: b
    text: “Para penguasa zaman ini” dapat menunjuk kepada penguasa manusia, kuasa-kuasa rohani, atau keduanya.
    reason: alternative_reading
  - marker: c
    text: Atau “sedang berlalu”, “sedang dilenyapkan”, atau “sedang dibuat tidak berdaya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: hikmat
  rationale: Padanan baku untuk σοφία; pengulangan kata ini dipertahankan untuk mencerminkan penekanan dalam teks Yunani.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan konteks sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: λαλοῦμεν
  choice: kami menyampaikan
  rationale: λαλέω pada dasarnya berarti berbicara; 'menyampaikan' terdengar alami untuk sesuatu yang berupa hikmat tanpa mempersempitnya menjadi tindakan memberitakan secara formal.
- source_word: ἐν τοῖς τελείοις
  choice: di antara orang-orang yang dewasa
  rationale: Dalam konteks ini τέλειος paling wajar menunjuk kepada kedewasaan atau kematangan; 'di antara' mengungkapkan fungsi idiomatis ἐν.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: bukan hikmat zaman ini
  rationale: αἰών diterjemahkan 'zaman' agar nuansa temporalnya tetap terpelihara dan tidak disamakan begitu saja dengan κόσμος, 'dunia'.
- source_word: ἀρχόντων
  choice: para penguasa
  rationale: Padanan langsung yang cukup luas sehingga tidak menentukan apakah yang dimaksud ialah penguasa manusia, kuasa rohani, atau keduanya.
- source_word: τῶν καταργουμένων
  choice: yang sedang dilenyapkan
  rationale: Bentuk partisipel kini pasif menunjukkan proses yang sedang berlangsung; 'dilenyapkan' menangkap gagasan bahwa keberadaan atau kuasa mereka sedang dibuat tidak berlaku, dengan alternatif makna dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan frasa 'para penguasa zaman ini'
  choice: Diterjemahkan secara luas sebagai 'para penguasa' tanpa menentukan identitas mereka.
  alternative: Penguasa politik atau agama manusia; kuasa-kuasa rohani; atau keduanya.
  rationale: Bahasa Yunaninya tidak memastikan salah satu tafsiran, sehingga ambiguitas teologisnya dipertahankan.
- issue: Makna τέλειοι
  choice: orang-orang yang dewasa
  alternative: orang-orang yang sempurna
  rationale: Konteks lebih mungkin berbicara tentang kematangan, tetapi arti harfiah alternatif tetap dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan 'hikmat' serta 'zaman ini' dipertahankan demi penekanan retoris, sedangkan ambiguitas tentang identitas para penguasa tidak diselesaikan dalam teks utama.
