revisions:
- from: Namun, seperti yang tertulis, “Apa yang tidak pernah dilihat mata, dan tidak pernah didengar telinga, dan yang tidak pernah timbul dalam hati manusia—semua itulah yang telah Allah siapkan bagi mereka yang mengasihi-Nya.”
  to: Namun, seperti yang tertulis, “Apa yang belum pernah dilihat mata, yang belum pernah didengar telinga, dan yang belum pernah timbul dalam hati manusia—itulah yang telah Allah siapkan bagi mereka yang mengasihi-Nya.”
  rationale: Revisi terbatas pada aspek negatif dan keluwesan rangkuman. ‘Belum pernah’ menghindari penguatan temporal yang tidak perlu, sementara ‘itulah’ tetap merujuk pada keseluruhan hal yang sebelumnya disebut. Tidak ada catatan kaki yang diperlukan atau jangkar catatan kaki dalam teks Indonesia ini.
