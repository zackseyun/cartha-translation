review_pass:
  verdict: revise
  source_fidelity: Draf pada dasarnya setia pada struktur korelatif Ἃ ... ὅσα, metafora ‘hati manusia’, tindakan Allah yang telah selesai, dan partisipel ‘mereka yang mengasihi-Nya’. Namun, ‘tidak pernah’ lebih mutlak daripada bentuk negatif sumber dan kurang baik menyampaikan nuansa ‘belum/tidak sampai sekarang’ dalam idiom Indonesia.
  naturalness: Bahasa draf baku dan bermartabat, tetapi pengulangan ‘tidak pernah’ terdengar agak kaku dalam kutipan puitis ini. ‘Belum pernah’ lebih idiomatis dan lebih dekat dengan daya ungkap ‘has not’ tanpa menyatakan kemustahilan mutlak. Penyederhanaan ‘semua itulah’ menjadi ‘itulah’ membuat rangkuman setelah tanda pisah lebih luwes tanpa kehilangan cakupan jamak netral Yunani.
  terminology: ‘Hati manusia’, ‘Allah’, dan ‘mengasihi-Nya’ tepat untuk register Alkitab Indonesia modern. ‘Timbul dalam hati manusia’ mempertahankan citra metaforis tanpa mempersempit καρδία menjadi semata-mata ‘pikiran’.
  issues:
  - severity: low
    issue: ‘Tidak pernah’ digunakan untuk tiga verba negatif.
    rationale: Ungkapan ini dapat dibaca sebagai penegasan absolut, sedangkan sumber menyatakan bahwa hal-hal tersebut belum dilihat, didengar, atau timbul dalam hati manusia. ‘Belum pernah’ menyampaikan aspek ini dengan lebih tepat dan alami.
  - severity: low
    issue: ‘Semua itulah yang’ agak berat sebagai pengulangan resumtif.
    rationale: ὅσα merangkum unsur-unsur sebelumnya; ‘itulah yang’ sudah memadai dalam bahasa Indonesia dan mempertahankan fungsi rangkumannya.
  revised_text: Namun, seperti yang tertulis, “Apa yang belum pernah dilihat mata, yang belum pernah didengar telinga, dan yang belum pernah timbul dalam hati manusia—itulah yang telah Allah siapkan bagi mereka yang mengasihi-Nya.”
