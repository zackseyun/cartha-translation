source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: id
  text: Namun, seperti yang tertulis, “Apa yang belum pernah dilihat mata, yang belum pernah didengar telinga, dan yang belum pernah timbul dalam hati manusia—itulah yang telah Allah siapkan bagi mereka yang mengasihi-Nya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan gagasan sebelumnya secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: Mempertahankan rumusan pengantar kutipan Kitab Suci dan menyampaikan keadaan tetap dari bentuk perfektum γέγραπται.
- source_word: Ἃ ... ὅσα
  choice: Apa yang ... semua itulah yang
  rationale: Mencerminkan bentuk netral jamak yang diperkenalkan lalu dirangkum kembali; ungkapan resumtif ini menjaga struktur puitis sekaligus memperjelas hubungan sintaksis dalam bahasa Indonesia.
- source_word: ὀφθαλμὸς ... οὖς
  choice: mata ... telinga
  rationale: Padanan langsung yang mempertahankan kesejajaran dan pemakaian tunggal generik dalam bahasa sumber.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: yang tidak pernah timbul dalam hati manusia
  rationale: Kata 'timbul' mempertahankan arah metaforis ἀνέβη ('naik/muncul') secara alami; 'hati manusia' menyampaikan ἀνθρώπου sebagai manusia secara generik tanpa membatasi jenis kelamin.
- source_word: ἡτοίμασεν
  choice: telah Allah siapkan
  rationale: Bentuk 'telah ... siapkan' menyampaikan tindakan yang sudah dilakukan dan tetap relevan, dengan susunan yang alami.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: bagi mereka yang mengasihi-Nya
  rationale: Menyampaikan partisipel kini sebagai ciri yang berkelanjutan; 'mengasihi' sesuai dengan ragam Alkitab yang modern dan bermartabat.
theological_decisions:
- issue: Makna 'hati' dalam ἐπὶ καρδίαν ἀνθρώπου
  choice: hati manusia
  alternative: pikiran manusia; terlintas dalam pikiran siapa pun
  rationale: Mempertahankan istilah antropologis καρδία dan ambiguitas cakupannya, tanpa menyempitkannya hanya pada proses intelektual.
- issue: Acuan waktu dari hal-hal yang Allah siapkan
  choice: Tidak ditentukan lebih lanjut dalam terjemahan
  alternative: Secara eksplisit dibatasi pada surga atau kehidupan mendatang
  rationale: Ayat ini sendiri tidak membatasi hal-hal yang disiapkan Allah hanya pada satu kerangka waktu; terjemahan tidak menambahkan penafsiran eskatologis yang tidak dinyatakan.
- issue: Cakupan ἀνθρώπου
  choice: manusia secara generik
  alternative: seorang laki-laki
  rationale: Dalam konteks ini bentuk tunggal tersebut mewakili umat manusia, sehingga 'manusia' akurat tanpa mengimpor pembatasan berdasarkan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel kutipan dipertahankan, sedangkan tanda pisah menandai rangkuman ὅσα. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
