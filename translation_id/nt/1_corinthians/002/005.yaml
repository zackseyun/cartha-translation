id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: id
  text: supaya iman kalian tidak bersandar pada hikmat manusia, melainkan pada kuasa Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan klausa tujuan Paulus secara alami dan tetap mempertahankan daya teliknya.
- source_word: ἡ πίστις ὑμῶν
  choice: iman kalian
  rationale: πίστις di sini menunjuk pada tanggapan percaya jemaat Korintus; bentuk jamak ὑμῶν disampaikan dengan 'kalian' agar jelas ditujukan kepada seluruh jemaat.
- source_word: μὴ ᾖ ἐν
  choice: tidak bersandar pada
  rationale: Secara idiomatis menyatakan dasar atau tumpuan iman dalam bahasa Indonesia, tanpa mengubah pertentangan antara hikmat manusia dan kuasa Allah.
- source_word: σοφίᾳ ἀνθρώπων
  choice: hikmat manusia
  rationale: ἀνθρώπων bermakna manusia secara umum; 'manusia' tepat, inklusif secara alami dalam bahasa Indonesia, dan tidak memerlukan penjelasan gender.
- source_word: δυνάμει θεοῦ
  choice: kuasa Allah
  rationale: Mempertahankan penekanan pada kuasa yang berasal dari Allah sebagai dasar iman, sejajar dengan 'hikmat manusia'.
theological_decisions:
- issue: Makna relasi yang dinyatakan oleh ἐν dalam kedua frasa
  choice: bersandar pada
  alternative: berada dalam
  rationale: Dalam konteks ini Paulus mempertentangkan dasar atau tumpuan iman, bukan sekadar lokasi abstrak. 'Bersandar pada' menyampaikan maksud itu secara wajar sambil mempertahankan ketegangan antara kemampuan manusia dan kuasa Allah.
- issue: Cakupan ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: Bentuk Yunani ini bersifat generik dan mencakup manusia secara umum. Bahasa Indonesia 'manusia' menyampaikan cakupan tersebut tanpa memasukkan pembedaan gender yang tidak dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Kata 'kalian' dipakai untuk menyatakan pronomina orang kedua jamak secara jelas; 'melainkan' mempertahankan kontras kuat ἀλλά.
