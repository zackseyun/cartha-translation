id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: id
  text: Sebab, siapakah yang telah mengetahui pikiran Tuhan[b], sehingga ia dapat mengajar-Nya? Tetapi kita memiliki pikiran Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pikiran Kristus.”
    reason: lexical_alternative
  - marker: b
    text: Paulus menggemakan Yesaya 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: Sebab, siapakah
  rationale: Mempertahankan pertanyaan retoris τίς dan hubungan penjelas yang ditandai γάρ dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ἔγνω
  choice: telah mengetahui
  rationale: Bentuk ini mencerminkan aoristus dalam kutipan serta menegaskan bahwa tidak seorang pun pernah mencapai pengetahuan yang membuatnya mampu mengarahkan Tuhan.
- source_word: νοῦν κυρίου
  choice: pikiran Tuhan
  rationale: “Pikiran” mempertahankan cakupan kognitif dan sikap batin dari νοῦς, sedangkan “Tuhan” menjaga gema kitab suci dari κυρίου.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: sehingga ia dapat mengajar-Nya
  rationale: Menyampaikan fungsi klausa relatif secara alami; συμβιβάζω di sini berarti mengajar atau memberi petunjuk, dan “-Nya” jelas merujuk kepada Tuhan.
- source_word: ἡμεῖς δὲ
  choice: Tetapi kita
  rationale: “Tetapi” mempertahankan kontras yang kuat, sementara “kita” mencakup Paulus dan komunitas yang disapanya.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: kita memiliki pikiran Mesias
  rationale: “Memiliki” menyampaikan pernyataan langsung ἔχομεν; “Mesias” mempertahankan fungsi gelar Χριστός dalam frasa ini.
theological_decisions:
- issue: Arti Χριστοῦ dalam frasa νοῦν Χριστοῦ
  choice: pikiran Mesias
  alternative: pikiran Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi. “Mesias” mempertahankan latar Ibrani gelar tersebut tanpa mengubah isi teologis pernyataan Paulus; bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Rujukan αὐτόν dalam klausa pertanyaan
  choice: -Nya, merujuk kepada Tuhan
  alternative: dia, tanpa kapitalisasi atau penegasan rujukan
  rationale: Secara sintaksis, αὐτόν kembali kepada κυρίου. Bentuk “mengajar-Nya” membuat rujukan itu jelas dalam bahasa Indonesia tanpa menambahkan pelaku atau penafsiran baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris dipertahankan, kontras antarklausa dibuat jelas, dan ambiguitas teologis tidak diperluas melampaui teks Yunani.
