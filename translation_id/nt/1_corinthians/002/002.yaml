  source_fidelity: 'Makna pokok diterjemahkan dengan setia: κρίνω sebagai keputusan yang mantap, konstruksi pembatasan “tidak mengetahui apa pun ... selain,” konteks “di antara kalian,” gelar mesianik, serta penekanan pada Yesus yang disalibkan semuanya terpelihara. Menghilangkan “telah” lebih netral terhadap aoris Yunani dan lebih wajar dalam bahasa Indonesia tanpa mengubah makna.'
