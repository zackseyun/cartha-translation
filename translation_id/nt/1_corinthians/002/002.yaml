  terminology: “Sang Mesias” tepat untuk Χριστόν sebagai gelar. Catatan kaki dipertahankan untuk padanan tradisional “Yesus Kristus” dan diperjelas dengan bentuk Yunani yang mendasarinya. Kapitalisasi “Dia” dapat dipertahankan dalam register Alkitab Indonesia untuk rujukan kepada Yesus.
