  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: id
  text: Sebab aku memutuskan untuk tidak mengetahui apa pun di antara kalian selain Yesus, Sang Mesias—dan Dia yang disalibkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Yesus Kristus.” Yunani: “Yesus Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: telah memutuskan
  rationale: Dalam konteks ini, kata tersebut menyatakan suatu tekad atau keputusan yang mantap, bukan tindakan menghakimi. Bentuk ini juga menangkap aspek aoris sebagai keputusan yang telah diambil.
- source_word: τι εἰδέναι
  choice: untuk tidak mengetahui apa pun
  rationale: 'Bersama οὐ dan εἰ μὴ, ungkapan ini membentuk pembatasan yang tegas: Paulus tidak bermaksud menjadikan apa pun sebagai pusat pengetahuannya selain yang disebutkan berikutnya.'
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Ungkapan ini menunjuk pada kehadiran dan pelayanan Paulus di tengah jemaat Korintus. “Di antara kalian” alami dalam bahasa Indonesia dan mempertahankan latar relasionalnya.
- source_word: εἰ μὴ
  choice: selain
  rationale: Ini merupakan konstruksi pengecualian yang membatasi objek pengetahuan Paulus.
- source_word: Χριστόν
  choice: Sang Mesias
  rationale: Di sini Χριστός dipahami sebagai gelar Yesus. “Sang Mesias” menyampaikan fungsi gelar itu secara alami dan bermartabat dalam bahasa Indonesia; bentuk tradisional “Kristus” dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: —dan Dia yang disalibkan
  rationale: Kata penunjuk τοῦτον memberi penekanan kembali kepada Yesus sendiri, sedangkan participel perfektif pasif menggambarkan Dia sebagai sosok yang telah disalibkan. Susunan ini mempertahankan ungkapan Paulus yang padat dan penuh tekanan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Konteks menampilkan Χριστός sebagai gelar yang menunjuk pada identitas mesianik Yesus, bukan sekadar unsur nama. Alternatif tradisional “Kristus” tetap diberikan agar pembaca mengetahui padanan yang umum.
- issue: Lingkup tekad Paulus untuk “tidak mengetahui apa pun”
  choice: Mempertahankan pernyataan absolut-retoris tanpa menjelaskannya lebih lanjut dalam teks
  alternative: Memparafrasakan sebagai keputusan untuk hanya memberitakan tentang Yesus
  rationale: Teks Yunani memakai bahasa “mengetahui,” bukan secara eksplisit “memberitakan.” Terjemahan mempertahankan ketegangan retoris dan tidak mempersempit maksud Paulus menjadi satu kegiatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua jamak diterjemahkan “kalian” agar jumlah jamaknya jelas dan tetap mudah dipahami. Tanda pisah mempertahankan penekanan pada frasa terakhir.
