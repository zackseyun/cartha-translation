  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: id
  text: Pada saat yang sama, siapkan juga tempat menginap bagiku,[a] sebab aku berharap bahwa melalui doa-doa kalian, aku akan dianugerahkan kepada kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumpangan” atau “keramahtamahan”; kata Yunani ini dapat menunjuk baik pada penyambutan seorang tamu maupun pada tempat yang disediakan baginya.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku akan diberikan kepada kalian.” Bentuk pasif kata Yunani ini mengandung nuansa pemberian dengan kemurahan dan kemungkinan menyiratkan Allah sebagai pelakunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Pada saat yang sama, ... juga
  rationale: Ungkapan ini menambahkan permintaan praktis yang menyertai permohonan sebelumnya; susunan Indonesia ini mempertahankan nuansa ἅμα dan καὶ secara alami, sedangkan δέ tercermin dalam alur peralihan.
- source_word: ἑτοίμαζέ
  choice: siapkan
  rationale: Imperatif kini aktif ini menyampaikan permintaan langsung untuk melakukan persiapan; 'siapkan' ringkas dan wajar dalam bahasa Indonesia.
- source_word: μοι
  choice: bagiku
  rationale: 'Dativus menyatakan penerima manfaat: tempat menginap itu harus disiapkan untuk Paulus.'
- source_word: ξενίαν
  choice: tempat menginap
  rationale: ξενία dapat menunjuk pada keramahtamahan atau akomodasi. Bersama ἑτοίμαζέ dan μοι, arti konkret berupa tempat tinggal sementara paling alami, tanpa mempersempitnya menjadi kamar tertentu.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: sebab aku berharap bahwa
  rationale: γάρ memberikan alasan bagi permintaan tersebut, sedangkan ἐλπίζω ὅτι memperkenalkan isi harapan Paulus.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: melalui doa-doa kalian
  rationale: διά dengan genitivus menyatakan sarana. Bentuk jamak 'doa-doa' mempertahankan προσευχῶν, dan 'kalian' mempertahankan bentuk jamak ὑμῶν.
- source_word: χαρισθήσομαι
  choice: aku akan dianugerahkan
  rationale: Bentuk pasif mendatang dari χαρίζομαι memuat gagasan diberikan atau dikaruniakan dengan kemurahan. 'Dianugerahkan' mempertahankan bentuk pasif dan nuansa pemberian yang penuh kemurahan tanpa secara eksplisit menambahkan pelaku ilahi.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Dativus jamak menunjuk kepada para penerima yang Paulus harapkan dapat menemuinya kembali.
theological_decisions:
- issue: Makna χαρισθήσομαι dan pelaku tindakan pasif
  choice: aku akan dianugerahkan kepada kalian
  alternative: aku akan diberikan kepada kalian; aku akan dikembalikan kepada kalian
  rationale: Ungkapan ini mempertahankan Paulus sendiri sebagai sesuatu yang dianugerahkan dan membiarkan pelaku pasif—kemungkinan besar Allah—tetap tersirat. 'Dikembalikan' lebih idiomatis tetapi menambahkan gagasan yang tidak dinyatakan langsung oleh verba Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak orang kedua dalam teks Yunani; 'tempat menginap' dipilih agar alami dan tidak mempersempit ξενία menjadi 'kamar tamu'.
