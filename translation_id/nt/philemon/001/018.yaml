  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: id
  text: Namun, kalau dia telah berbuat salah kepadamu dalam hal apa pun atau berutang sesuatu kepadamu, bebankanlah itu kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “masukkanlah itu ke dalam perhitunganku.” Kata kerjanya mengandung gambaran pembukuan: hal itu diperhitungkan atau dibebankan kepada seseorang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Namun, kalau
  rationale: εἰ memperkenalkan syarat, sedangkan δέ menandai peralihan dengan kontras ringan. “Namun, kalau” alami dalam bahasa Indonesia dan menghubungkan ayat ini dengan permohonan pada ayat sebelumnya.
- source_word: τι ἠδίκησέν σε
  choice: dia telah berbuat salah kepadamu
  rationale: ἀδικέω mencakup tindakan tidak adil, merugikan, atau bersalah terhadap seseorang. Ungkapan ini mempertahankan keluasan maknanya tanpa membatasi kesalahan itu pada penipuan atau kerugian materi saja; τι dibiarkan bersifat tak tentu dalam cakupan klausa.
- source_word: ἢ ὀφείλει
  choice: atau berutang sesuatu kepadamu
  rationale: ὀφείλω menyatakan utang atau kewajiban. “Berutang sesuatu kepadamu” mempertahankan nuansa finansial/legal dan menyatakan objek tak tentu secara wajar.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: bebankanlah itu kepadaku
  rationale: ἐλλογέω merupakan istilah pembukuan untuk memperhitungkan atau membebankan sesuatu pada rekening seseorang. “Bebankanlah itu kepadaku” jelas, modern, dan mempertahankan metafora transaksi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada pribadi namun bermartabat. Bentuk “kepadamu” dan “kepadaku” menjaga hubungan langsung antarpribadi, sedangkan “bebankanlah” mempertahankan latar pembukuan tanpa memakai istilah teologis teknis.
