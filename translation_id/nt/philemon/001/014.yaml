source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: id
  text: Namun, tanpa persetujuanmu[a], aku tidak mau melakukan apa pun, supaya perbuatan baikmu[b] tidak dilakukan seolah-olah karena terpaksa, melainkan dengan sukarela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa persetujuan atau pendapatmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kebaikanmu” atau “kemurahan hatimu”; ungkapan Yunani dapat menunjuk pada tindakan baik Filemon dalam perkara ini atau, secara lebih abstrak, pada kebaikannya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “melainkan menurut apa yang sukarela,” yaitu, “atas kemauanmu sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: tanpa persetujuanmu
  rationale: γνώμη dapat berarti pendapat, pertimbangan, maksud, atau persetujuan. Dalam konteks tindakan Paulus mengenai Onesimus, 'persetujuanmu' paling alami menyampaikan unsur izin dan kehendak Filemon, sambil mencatat alternatif dalam catatan kaki.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: aku tidak mau melakukan apa pun
  rationale: θέλω menyatakan kehendak atau kemauan. Susunan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi keputusan formal yang sudah ditetapkan.
- source_word: ἵνα μὴ
  choice: supaya ... bukan
  rationale: Menyampaikan maksud atau tujuan Paulus secara jelas dan alami.
- source_word: ὡς κατὰ ἀνάγκην
  choice: seolah-olah karena terpaksa
  rationale: '''Seolah-olah'' mempertahankan nuansa ὡς, sedangkan ''karena terpaksa'' mengungkapkan tekanan atau paksaan yang dimaksud oleh ἀνάγκη.'
- source_word: τὸ ἀγαθόν σου
  choice: perbuatan baikmu
  rationale: Adjektiva netral berartikel ini kemungkinan menunjuk pada tindakan baik konkret yang diharapkan dari Filemon, tetapi bahasa Yunani juga memungkinkan pengertian yang lebih abstrak; ambiguitas itu dicatat.
- source_word: ᾖ
  choice: bukan ... melainkan
  rationale: Kopula subjungtif dalam klausa tujuan disampaikan secara idiomatis melalui konstruksi 'supaya ... bukan ... melainkan'.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: melainkan atas kerelaanmu sendiri
  rationale: ἑκούσιον menunjuk pada sesuatu yang dilakukan dengan sukarela. Ungkapan ini alami, jelas, dan mempertahankan kontras dengan keterpaksaan.
theological_decisions:
- issue: Sifat tanggapan Filemon
  choice: Menekankan bahwa tanggapan Filemon harus lahir dari kerelaan, bukan paksaan, tanpa menentukan lebih jauh tindakan yang dimaksud.
  alternative: Menerjemahkan τὸ ἀγαθόν σου secara abstrak sebagai 'kebaikanmu' atau lebih khusus sebagai 'kemurahan hatimu'.
  rationale: Ayat ini menyoroti sifat moral tanggapan Filemon sebagai tindakan sukarela. Tindakan tepatnya tetap tersirat dalam bahasa Yunani, sehingga terjemahan tidak mempersempitnya secara doktrinal atau etis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Pronomina 'aku' dan '-mu' mempertahankan kedekatan surat pribadi. Struktur kontras dibuat lancar tanpa menghilangkan nuansa 'seolah-olah' pada ὡς atau ambiguitas τὸ ἀγαθόν σου.
