  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: id
  text: Dari Paulus, seorang tahanan Mesias Yesus[a], dan dari Timotius, saudara kita, kepada Filemon, yang kami kasihi dan yang bekerja bersama kami,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang tahanan karena Mesias Yesus” atau “seorang tahanan demi Mesias Yesus.” Bentuk genitif Yunani dapat menyatakan hubungan dengan Mesias Yesus atau bahwa pemenjaraan itu terjadi karena Dia.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: δέσμιος Χριστοῦ Ἰησοῦ
  choice: seorang tahanan milik Mesias Yesus
  rationale: “Tahanan” menyampaikan keadaan terbelenggu atau dipenjarakan; “milik” mempertahankan hubungan genitif dengan Mesias Yesus tanpa membatasinya hanya pada makna sebab.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini tetap bermakna gelar, sehingga diterjemahkan “Mesias”, bukan sekadar dialihaksarakan sebagai “Kristus”.
- source_word: καὶ Τιμόθεος ὁ ἀδελφὸς
  choice: dan dari Timotius, saudara kita
  rationale: Timotius tampil bersama Paulus dalam bingkai pengirim; “saudara kita” mengungkapkan hubungan kekeluargaan komunitas yang tersirat secara wajar.
- source_word: Φιλήμονι
  choice: kepada Filemon
  rationale: Bentuk datif berfungsi sebagai alamat surat dan secara alami diterjemahkan dengan “kepada”.
- source_word: τῷ ἀγαπητῷ
  choice: yang kami kasihi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kasih pribadi-komunal yang dinyatakan oleh ἀγαπητός serta bentuk jamak ἡμῶν.
- source_word: συνεργῷ ἡμῶν
  choice: yang bekerja bersama kami
  rationale: Terjemahan verbal yang alami dan jelas mempertahankan gagasan bekerja bersama, serta secara eksplisit mempertahankan ἡμῶν, “kami”.
theological_decisions:
- issue: Hubungan genitif dalam δέσμιος Χριστοῦ Ἰησοῦ
  choice: tahanan milik Mesias Yesus
  alternative: tahanan karena/demi Mesias Yesus
  rationale: Genitif dapat menyatakan hubungan atau kepunyaan, tetapi dalam konteks pemenjaraan Paulus juga dapat dipahami sebagai sebab. Teks utama mempertahankan bentuk relasional yang ringkas, sedangkan kemungkinan kausal dicatat dalam catatan kaki.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam salam pembuka ini, Χριστός masih berfungsi sebagai gelar yang bermakna, sehingga “Mesias” menerjemahkan kandungan semantisnya dan menghindari perlakuan seolah-olah sebagai nama keluarga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur surat diperjelas dengan pengulangan “dari” bagi kedua pengirim. “Milik” dipakai untuk menjaga ketegangan genitif Yunani, sementara alternatif kausal dipertahankan dalam catatan kaki.
