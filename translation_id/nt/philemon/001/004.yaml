  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: id
  text: Aku selalu mengucap syukur kepada Allahku sambil menyebut engkau dalam doa-doaku,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sambil mengingat engkau dalam doa-doaku.” Secara lebih harfiah, bahasa Yunani berbunyi “membuat penyebutan tentang engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Aku mengucap syukur
  rationale: Bentuk kini aktif orang pertama tunggal. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan makna tindakan bersyukur.
- source_word: τῷ θεῷ μου
  choice: kepada Allahku
  rationale: Bentuk datif menandai pihak yang menerima ucapan syukur; 'kepada Allahku' mempertahankan hubungan gramatikal dan ungkapan pribadi Paulus.
- source_word: πάντοτε
  choice: selalu
  rationale: Menyatakan ketetapan atau kebiasaan yang terus berlangsung dan diterjemahkan secara langsung.
- source_word: μνείαν σου ποιούμενος
  choice: ketika menyebut engkau
  rationale: Idiom ini secara harfiah berarti 'membuat penyebutan tentang engkau'. Dalam konteks doa, 'ketika menyebut engkau' terdengar alami sekaligus mempertahankan unsur penyebutan, bukan sekadar ingatan batin.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dalam doa-doaku
  rationale: ἐπί dengan genitif dalam idiom ini menunjuk pada kesempatan atau konteks berdoa; 'dalam doa-doaku' adalah padanan Indonesia yang jelas dan alami.
