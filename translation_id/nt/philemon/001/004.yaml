translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan khidmat. Kata ganti 'aku–engkau' dipakai untuk mempertahankan keakraban surat pribadi dan gaya Alkitabiah yang tetap mudah dipahami.
