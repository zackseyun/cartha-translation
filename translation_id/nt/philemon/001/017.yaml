id: PHM.1.17
reference: Philemon 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: id
  text: Jadi, jika engkau menganggap aku sebagai rekan, terimalah dia seperti engkau menerima aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sambutlah dia seperti engkau menyambut aku.” Kata Yunani yang dipakai dapat berarti menerima seseorang dengan baik atau menerimanya ke dalam persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Jadi, jika
  rationale: Ungkapan ini mempertahankan hubungan kesimpulan οὖν dengan permohonan sebelumnya dan syarat yang dinyatakan oleh εἰ, dalam susunan bahasa Indonesia yang wajar.
- source_word: με ἔχεις κοινωνόν
  choice: engkau menganggap aku sebagai rekan
  rationale: κοινωνός menunjuk kepada orang yang turut berbagi atau berpartisipasi bersama. Dalam konstruksi dengan ἔχεις, 'menganggap aku sebagai rekan' menyampaikan hubungan timbal balik secara alami tanpa menjadikannya istilah teknis teologis.
- source_word: προσλαβοῦ
  choice: terimalah
  rationale: Imperatif ini dapat berarti menerima, menyambut, atau mengakui dengan baik. 'Terimalah' mempertahankan keluasan makna yang mencakup sambutan pribadi dan penerimaan dalam persekutuan.
- source_word: αὐτὸν
  choice: dia
  rationale: Pronomina objek ini merujuk kepada Onesimus dalam konteks.
- source_word: ὡς ἐμέ
  choice: seperti engkau menerima aku
  rationale: Perbandingan eliptis dalam bahasa Yunani diperjelas secara wajar dalam bahasa Indonesia dengan mengulangi verba 'menerima', tanpa mengubah tuntutan agar Onesimus diperlakukan sebagaimana Paulus sendiri.
theological_decisions:
- issue: Daya relasional κοινωνός dalam permohonan Paulus
  choice: rekan
  alternative: sesama peserta; orang yang bersekutu; mitra
  rationale: '''Rekan'' menyatakan partisipasi dan kedudukan bersama antara Paulus dan Filemon tanpa memasukkan pengertian sakramental, bisnis, atau istilah khas denominasi.'
- issue: Cakupan penerimaan yang diminta Paulus
  choice: terimalah
  alternative: sambutlah; terimalah dengan baik
  rationale: '''Terimalah'' membiarkan terbuka apakah penekanannya terutama pada sambutan pribadi, keramahtamahan, atau penerimaan kembali ke dalam hubungan dan persekutuan.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan tunggal dan nada pribadi surat; kalimat perbandingan diperjelas secara idiomatis.
