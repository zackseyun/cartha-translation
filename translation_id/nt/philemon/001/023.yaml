  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: id
  text: Epafras, sesama tahananku dalam Mesias Yesus[a], menyampaikan salam kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan istilah yang lebih tradisional, “dalam Kristus Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: menyampaikan salam
  rationale: Bentuk ἀσπάζομαι di sini secara idiomatis menyatakan bahwa Epafras mengirim atau menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan subjek tunggal.
- source_word: σε
  choice: kepadamu
  rationale: Pronomina ini adalah objek orang kedua tunggal yang merujuk langsung kepada Filemon. Bentuk -mu mempertahankan makna tunggal tersebut.
- source_word: Ἐπαφρᾶς
  choice: Epafras
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ὁ συναιχμάλωτός μου
  choice: sesama tahananku
  rationale: Nomina majemuk ini menunjuk kepada orang yang ditahan bersama Paulus. 'Sesama tahananku' ringkas, alami, dan mempertahankan unsur kepunyaan dalam μου.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Kata depan ἐν dipertahankan sebagai 'dalam' agar bahasa khas Paulus tentang hubungan dengan Mesias tidak diratakan menjadi 'karena' atau 'demi'. Χριστός diterjemahkan sebagai gelar 'Mesias', sedangkan Ἰησοῦ menjadi 'Yesus'.
theological_decisions:
- issue: Penerjemahan Χριστῷ dalam rumusan Paulus ἐν Χριστῷ Ἰησοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός masih memiliki bobot sebagai gelar, sehingga 'Mesias' dipilih. Bentuk tradisional 'Kristus Yesus' tetap dicatat sebagai alternatif tanpa meniadakan ketegangan leksikalnya.
- issue: Hubungan sintaksis frasa ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: karena/demi Mesias Yesus
  rationale: Terjemahan dengan 'dalam' mempertahankan konstruksi Yunani dan kemungkinan makna persekutuan atau kesatuan dengan Mesias, tanpa mempersempitnya hanya menjadi sebab pemenjaraan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan aposisi Yunani, sedangkan 'kepadamu' menandai bahwa penerima salam berbentuk tunggal.
