  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: id
  text: Aku mengutusnya[a] kembali kepadamu—dia, yaitu hatiku sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan mempertahankan bentuk lampau: “Aku telah mengutusnya kembali kepadamu.” Bentuk aoristus Yunani dapat diterjemahkan dengan beberapa cara; bentuk kini memandang tindakan itu dari saat surat diterima Filemon.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “organ-organ dalamku”; secara idiomatis, ungkapan untuk kasih sayang yang sangat dalam atau belas kasih yang lembut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: dia
  rationale: Pronomina relatif akusatif maskulin tunggal ini merujuk kepada Onesimus. Dalam bahasa Indonesia, hubungan relatif tersebut paling alami dilebur ke dalam susunan kalimat utama.
- source_word: ἀνέπεμψά
  choice: Aku mengirim ... kembali
  rationale: Aoristus indikatif dari ἀναπέμπω berarti mengirim kembali. Bentuk kini dipilih dari sudut pandang surat yang menyertai tindakan pengutusan, sementara catatan kaki mempertahankan kemungkinan bentuk lampau.
- source_word: σοι
  choice: kepadamu
  rationale: Datif orang kedua tunggal menyatakan penerima; 'kepadamu' alami dan jelas dalam bahasa Indonesia.
- source_word: αὐτόν
  choice: dia sendiri
  rationale: Pengulangan pronomina memberi penekanan pada Onesimus. 'Dia sendiri' mempertahankan tekanan itu tanpa menghasilkan pengulangan yang janggal.
- source_word: τοῦτ’ ἔστιν
  choice: yaitu
  rationale: Rumus penjelas ini memperkenalkan keterangan aposisional tentang Onesimus; 'yaitu' ringkas dan wajar.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: buah hatiku
  rationale: Secara harfiah σπλάγχνα menunjuk organ-organ dalam, tetapi secara idiomatis menyatakan pusat kasih sayang yang mendalam. 'Buah hatiku' menyampaikan bahwa Onesimus sangat dikasihi Paulus dan tetap mempertahankan metafora hati.
theological_decisions:
- issue: Metafora antropologis dalam σπλάγχνα
  choice: buah hatiku
  alternative: isi perutku; hatiku sendiri; kasih sayangku yang terdalam
  rationale: Ini keputusan leksikal-idiomatis, bukan penetapan doktrin. Terjemahan anatomis akan kabur bagi pembaca modern, sedangkan 'buah hatiku' mengungkapkan kasih mendalam Paulus kepada Onesimus tanpa menambahkan gagasan teologis yang tidak terdapat dalam teks.
- issue: Sudut pandang waktu pada aoristus ἀνέπεμψά
  choice: Aku mengirim
  alternative: Aku telah mengirim; Aku mengirimkan
  rationale: Bentuk kini mencerminkan tindakan pengutusan sebagaimana dialami Filemon ketika surat tiba, tetapi aoristus Yunani tidak memaksa padanan waktu Indonesia tunggal; alternatif bentuk lampau dicatat agar ambiguitas aspek tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Pronomina 'Aku' dan '-mu' mencerminkan kedekatan surat pribadi. Tanda pisah mempertahankan penekanan aposisional teks Yunani.
