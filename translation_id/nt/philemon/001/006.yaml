  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: id
  text: supaya persekutuanmu dalam iman[a][b] menjadi efektif melalui pengenalan akan setiap hal baik yang ada dalam diri kita[c] bagi Mesias[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbagi imanmu,” “keikutsertaan yang lahir dari imanmu,” atau “kemitraan imanmu.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “iman” juga dapat berarti “kepercayaan” atau “kesetiaan” dalam konteks tertentu.
    reason: alternative_reading
  - marker: c
    text: Beberapa naskah berbunyi “di dalam kalian” sebagai ganti “dalam diri kita.”
    reason: textual_variant
  - marker: d
    text: Atau, “bagi Kristus.” Kata Yunani Χριστός merupakan gelar yang berarti “Mesias,” yaitu “Yang Diurapi.”
    reason: lexical_alternative
  - marker: e
    text: Frasa “bagi Mesias” juga dapat dipahami sebagai “yang tertuju kepada Mesias”; hubungan tepat frasa penutup ini dengan bagian-bagian kalimat sebelumnya tidak sepenuhnya pasti.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang didoakan Paulus dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: persekutuanmu dalam iman
  rationale: κοινωνία dapat berarti persekutuan, partisipasi, berbagi, atau kemitraan. Ungkapan ini mempertahankan unsur komunal tanpa membatasinya hanya pada penyampaian iman kepada orang lain; kemungkinan lain dicatat dalam catatan kaki.
- source_word: πίστεώς
  choice: iman
  rationale: Dalam konteks ini kemungkinan besar menunjuk pada iman atau kepercayaan Filemon, meskipun nuansa kesetiaan tetap mungkin.
- source_word: ἐνεργὴς γένηται
  choice: menjadi efektif
  rationale: Menyatakan bahwa persekutuan itu menjadi aktif atau menghasilkan dampak; 'menjadi efektif' alami dan tetap dekat dengan konstruksi Yunani.
- source_word: ἐν ἐπιγνώσει
  choice: melalui pengenalan akan
  rationale: ἐπίγνωσις menunjuk pada pengetahuan atau pengenalan yang nyata dan mendalam. 'Melalui' memahami ἐν secara instrumental, tanpa memaksakan arti teknis 'pengetahuan penuh'.
- source_word: παντὸς ἀγαθοῦ
  choice: setiap hal baik
  rationale: Bentuk netral tunggal dengan πᾶς paling wajar dipahami sebagai setiap hal yang baik; teks tidak secara khusus mengatakan 'karunia'.
- source_word: τοῦ ἐν ἡμῖν
  choice: yang ada dalam diri kita
  rationale: Mengikuti teks SBLGNT ἡμῖν, 'kita', dan mengaitkan frasa ini dengan 'setiap hal baik'.
- source_word: εἰς Χριστόν
  choice: bagi Mesias
  rationale: εἰς menyatakan arah, orientasi, atau tujuan yang sulit dipastikan secara lebih sempit. 'Bagi' cukup alami dan tidak terlalu menentukan relasinya; Χριστός diterjemahkan sebagai gelar 'Mesias'.
theological_decisions:
- issue: Makna κοινωνία τῆς πίστεώς σου
  choice: '''persekutuanmu dalam iman'', dengan penekanan komunal yang tetap terbuka'
  alternative: '''berbagi imanmu'', ''keikutsertaan yang lahir dari imanmu'', atau ''kemitraan imanmu'''
  rationale: Frasa Yunani ini terkenal sulit. Terjemahan utama tidak membatasinya pada evangelisasi ataupun pada persekutuan batin semata; ragam maknanya dipertahankan dalam catatan kaki.
- issue: Acuan ἐν ἡμῖν
  choice: '''dalam diri kita'', mengikuti teks cetak dan mencakup Paulus, Filemon, serta komunitas orang percaya'
  alternative: '''dalam dirimu'', menurut varian naskah'
  rationale: SBLGNT mencetak ἡμῖν. Varian ὑμῖν memiliki dukungan naskah dan karena itu dicatat, bukan dimasukkan ke teks utama.
- issue: Hubungan εἰς Χριστόν dengan kalimat
  choice: diterjemahkan 'bagi Mesias' setelah frasa tentang hal baik, tanpa penjelasan tambahan dalam teks utama
  alternative: dipahami sebagai 'yang tertuju kepada Mesias' atau sebagai orientasi seluruh proses menjadi efektif dan mengenal yang baik
  rationale: Susunan Yunani memungkinkan ketidakpastian mengenai cakupan frasa penutup. Terjemahan tidak diam-diam menetapkan satu hubungan teologis yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat apostolik yang bermartabat. Pilihan 'persekutuanmu dalam iman' dibuat agar cukup alami bagi pembaca umum sambil mempertahankan keluasan κοινωνία. Tanda baca dibuat minimal karena ayat ini merupakan kelanjutan sintaksis dari doa pada ayat sebelumnya.
