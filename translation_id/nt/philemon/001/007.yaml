  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: id
  text: Sebab aku mengalami sukacita dan penguatan yang besar karena kasihmu, karena hati[a] orang-orang kudus telah disegarkan olehmu, saudara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “organ-organ dalam”; suatu ungkapan Yunani untuk pusat kasih sayang dan perasaan terdalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: sukacita
  rationale: Padanan baku dan alami untuk χαρά, yang menyatakan kegembiraan mendalam.
- source_word: πολλὴν ἔσχον
  choice: aku memperoleh ... besar
  rationale: Mengungkapkan pengalaman Paulus secara alami dalam bahasa Indonesia sambil mempertahankan besarnya sukacita yang dinyatakan oleh πολλήν.
- source_word: παράκλησιν
  choice: penguatan
  rationale: Dalam konteks ini παράκλησις menunjuk pada dorongan atau kekuatan batin yang Paulus peroleh dari kasih Filemon; 'penguatan' mempertahankan nuansa aktif tanpa membatasinya pada penghiburan dalam kesedihan.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: karena kasihmu
  rationale: 'ἐπί dengan datif di sini paling wajar dipahami secara kausal: kasih Filemon menjadi alasan sukacita dan penguatan Paulus.'
- source_word: σπλάγχνα
  choice: hati
  rationale: Secara idiomatis menunjuk pada pusat perasaan dan kehidupan batin. 'Hati' merupakan padanan Indonesia yang alami; catatan kaki mempertahankan gambaran harfiahnya.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Mempertahankan istilah Paulus bagi umat yang dikhususkan bagi Allah tanpa menyiratkan pengertian kanonisasi yang muncul kemudian.
- source_word: ἀναπέπαυται
  choice: telah disegarkan
  rationale: Bentuk perfek menyatakan tindakan yang hasilnya masih dirasakan. 'Telah disegarkan' juga mempertahankan daya ungkapan relasional kata tersebut.
- source_word: διὰ σοῦ
  choice: melalui engkau
  rationale: Mencerminkan fungsi perantaraan atau keagenan διά dengan genitif.
- source_word: ἀδελφέ
  choice: Saudara
  rationale: Mempertahankan sapaan kekeluargaan langsung kepada Filemon tanpa menambahkan kata sifat yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Makna ἅγιοι
  choice: orang-orang kudus
  alternative: umat Allah
  rationale: Pilihan ini mempertahankan bahasa khas Paulus tentang orang percaya sebagai mereka yang dikhususkan bagi Allah, tanpa memasukkan gagasan bahwa hanya golongan tertentu yang disebut kudus.
- issue: Ungkapan antropologis σπλάγχνα
  choice: hati
  alternative: batin yang terdalam
  rationale: Ungkapan Yunani menunjuk pada pusat kasih sayang dan perasaan terdalam, bukan sekadar organ tubuh. 'Hati' menyampaikan fungsi idiomatisnya secara jelas, sementara catatan kaki menjaga gambaran sumber.
- issue: Nuansa παράκλησις
  choice: penguatan
  alternative: penghiburan
  rationale: Konteks tidak mengharuskan kesedihan sebagai latar. 'Penguatan' menjaga cakupan dorongan dan peneguhan yang timbul dari kasih Filemon.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan pastoral. Susunan sebab-akibat Yunani dipertahankan, termasuk pengulangan 'sebab', sedangkan idiom anatomi dialihkan menjadi 'hati' agar jelas bagi pembaca umum. Sapaan 'Saudara' mempertahankan bentuk langsung dan bermartabat.
