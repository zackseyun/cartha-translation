id: PHM.1.20
reference: Philemon 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: id
  text: Ya, Saudaraku, kiranya aku memperoleh manfaat[a] darimu di dalam Tuhan. Segarkanlah hatiku[b] di dalam Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kiranya aku mendapat keuntungan darimu” atau “kiranya aku mendapat sukacita darimu.” Paulus mungkin sedang bermain kata dengan nama Onesimus dan gagasan tentang manfaat atau kegunaan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagian-bagian dalam tubuhku,” sebuah ungkapan untuk kasih sayang yang mendalam atau batin seseorang.
    reason: lexical_alternative
  - marker: c
    text: Atau “Kristus.” Kata Yunani Χριστός merupakan gelar yang berarti “Yang Diurapi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Ya
  rationale: Menyampaikan penegasan yang hangat dan langsung dalam permohonan Paulus.
- source_word: ἀδελφέ
  choice: Saudaraku
  rationale: Sapaan tunggal kepada Filemon sebagai saudara seiman; bentuk ini alami dalam bahasa Indonesia dan mempertahankan keakraban sapaan.
- source_word: ἐγώ σου ὀναίμην
  choice: kiranya aku memperoleh manfaat darimu
  rationale: Bentuk optatif menyatakan permohonan yang sopan. Pilihan “memperoleh manfaat” mempertahankan arti ὀνίνημι dan memungkinkan permainan kata dengan nama Onesimus tetap terlihat melalui catatan kaki.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus tentang lingkup relasi dan tindakan orang percaya tanpa mempersempitnya menjadi sekadar alat atau alasan.
- source_word: ἀνάπαυσόν
  choice: Segarkanlah
  rationale: Imperatif ini meminta Filemon memberi kelegaan dan penguatan batin; pilihan tersebut juga selaras dengan pemakaian kata yang sama dalam Filemon 1:7.
- source_word: μου τὰ σπλάγχνα
  choice: hatiku
  rationale: Secara harfiah menunjuk bagian-bagian dalam tubuh, tetapi secara idiomatis berarti pusat kasih sayang atau batin terdalam. “Hatiku” merupakan padanan Indonesia yang alami.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Χριστός pada dasarnya adalah gelar, yaitu Yang Diurapi. “Mesias” mempertahankan fungsi gelarnya, sedangkan “Kristus” dicantumkan sebagai padanan tradisional dalam catatan.
theological_decisions:
- issue: Makna lingkup frasa ἐν κυρίῳ
  choice: di dalam Tuhan
  alternative: oleh Tuhan
  rationale: Frasa ini paling wajar dipertahankan secara terbuka sebagai lingkup relasi dan kehidupan dalam Tuhan; menerjemahkannya “oleh Tuhan” akan membatasi ambiguitas fungsi preposisinya.
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Kata Yunani tersebut merupakan gelar yang berarti Yang Diurapi. “Mesias” mempertahankan isi gelar itu, sementara “Kristus” adalah bentuk serapan tradisional yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, hangat, dan bermartabat. “Saudaraku” menjaga nada pribadi dalam sapaan Paulus; “kiranya” menyampaikan permohonan sopan, bukan perintah. Dua kalimat dipakai agar permohonan kedua terdengar jelas dan alami.
