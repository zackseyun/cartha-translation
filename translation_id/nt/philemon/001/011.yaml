id: PHM.1.11
reference: Philemon 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: id
  text: yang dahulu tidak berguna bagimu[a], tetapi sekarang berguna baik bagimu maupun bagiku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus kemungkinan memainkan nama Onesimus, yang berkaitan dengan gagasan tentang kegunaan atau manfaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: yang
  rationale: Artikel akusatif ini berfungsi secara substantival dan merujuk kembali kepada Onesimus pada ayat sebelumnya; dalam bahasa Indonesia, «yang» secara alami melanjutkan kalimat sebagai klausa relatif.
- source_word: ποτέ
  choice: dahulu
  rationale: Menyatakan keadaan pada masa lampau secara ringkas dan membentuk kontras waktu yang jelas dengan νυνί, «sekarang».
- source_word: σοι
  choice: bagimu
  rationale: Dativus personal ini paling alami diterjemahkan «bagimu» dalam kaitannya dengan kegunaan atau manfaat seseorang.
- source_word: ἄχρηστον
  choice: tidak berguna
  rationale: Menyampaikan arti dasar «tidak berguna/tidak bermanfaat» dalam bahasa Indonesia modern dan mempertahankan kontras leksikal dengan εὔχρηστον.
- source_word: νυνὶ δὲ
  choice: tetapi sekarang
  rationale: Mempertahankan kontras temporal dan daya adversatif δέ terhadap keadaan yang dahulu.
- source_word: σοὶ καὶ ἐμοὶ
  choice: baik bagimu maupun bagiku
  rationale: Konstruksi korelatif ini menyatakan dengan jelas bahwa kegunaan tersebut berlaku bagi kedua pihak sekaligus dan mencerminkan pasangan dativus dalam teks Yunani.
- source_word: εὔχρηστον
  choice: berguna
  rationale: Padanan modern yang langsung untuk «berguna/bermanfaat»; mempertahankan permainan kontras dengan ἄχρηστον dan kemungkinan kaitannya dengan nama Onesimus.
theological_decisions:
- issue: Kemungkinan permainan kata pada nama Onesimus dan perubahan dirinya
  choice: Mempertahankan kontras sederhana «tidak berguna ... berguna» dalam teks utama
  alternative: Menerjemahkan secara lebih interpretatif untuk menonjolkan permainan kata, misalnya «dahulu tidak memberi manfaat ... sekarang benar-benar bermanfaat»
  rationale: Teks Yunani sendiri menyatakan kontras itu tanpa penjelasan tambahan. Terjemahan langsung mempertahankan efek sastranya dan tidak menentukan secara berlebihan sifat perubahan Onesimus.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. «Tidak berguna ... berguna» dipilih untuk menjaga kesejajaran serta permainan kata sumber; tanda koma dipertahankan karena ayat ini merupakan bagian dari kalimat yang berlanjut.
