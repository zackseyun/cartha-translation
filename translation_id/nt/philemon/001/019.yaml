  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: id
  text: 'Aku, Paulus, menulis ini dengan tanganku sendiri: aku akan melunasinya. Tidak perlu kukatakan kepadamu bahwa engkau berutang kepadaku—bahkan dirimu sendiri.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih formal: “Aku, Paulus, telah menulis ini dengan tanganku sendiri; aku akan melunasinya—supaya aku tidak mengatakan kepadamu bahwa engkau juga berutang kepadaku, bahkan dirimu sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: menulis
  rationale: Walaupun bentuk Yunaninya adalah aoristus, dalam konteks surat bahasa Indonesia wajar memakai bentuk kini ketika Paulus menarik perhatian pada jaminan yang sedang dibaca. Catatan kaki mempertahankan alternatif formal 'telah menulis'.
- source_word: τῇ ἐμῇ χειρί
  choice: dengan tanganku sendiri
  rationale: Ungkapan alami yang menegaskan bahwa Paulus sendiri menuliskan jaminan tersebut.
- source_word: ἀποτίσω
  choice: Aku akan membayarnya kembali
  rationale: Menyatakan janji untuk melunasi kerugian atau utang yang disebut pada ayat sebelumnya; objek tersirat dibuat eksplisit secara minimal dengan '-nya'.
- source_word: ἵνα μὴ λέγω σοι
  choice: Belum lagi kukatakan kepadamu
  rationale: 'Menangkap fungsi retoris ungkapan itu: Paulus dengan halus justru menyebut kewajiban Filemon sambil mengatakan bahwa ia tidak perlu menyebutnya.'
- source_word: καὶ σεαυτόν
  choice: bahkan ... dirimu sendiri
  rationale: '''Bahkan'' mempertahankan penekanan καί, sedangkan ''dirimu sendiri'' menjaga kekuatan kata ganti refleksif tanpa menentukan hakikat utang tersebut.'
- source_word: προσοφείλεις
  choice: berutang ... kepadaku
  rationale: Padanan Indonesia yang jelas untuk kewajiban tambahan; nuansa 'di samping itu' didukung oleh 'bahkan' dan konteks utang sebelumnya.
theological_decisions:
- issue: Hakikat utang pribadi Filemon kepada Paulus
  choice: Mempertahankan ungkapan bahwa Filemon berutang dirinya sendiri kepada Paulus tanpa menjelaskan dasar utang itu.
  alternative: Menafsirkannya secara khusus sebagai utang karena pertobatan, keselamatan, atau penyelamatan nyawa.
  rationale: Teks Yunani menegaskan utang pribadi itu tetapi tidak menyatakan secara eksplisit apa penyebabnya; terjemahan tidak boleh menetapkan penafsiran teologis atau historis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan berwibawa. Bentuk 'Aku' sesuai dengan surat pribadi dan mempertahankan penegasan ἐγώ; susunan retoris Paulus dijaga tanpa memperjelas secara berlebihan sifat utang Filemon.
