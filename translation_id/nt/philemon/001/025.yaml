base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: id
  text: Kiranya anugerah Tuhan Yesus Kristus menyertai roh kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “kalian” berbentuk jamak; berkat penutup ini ditujukan bukan hanya kepada Filemon, tetapi kepada para penerima surat secara bersama-sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam berkat penutup Paulus, kata ini menunjuk pada kemurahan dan pemberian baik Tuhan yang tidak diperoleh karena jasa; “anugerah” merupakan padanan Indonesia yang lazim dan bermartabat.
- source_word: κυρίου
  choice: Tuhan
  rationale: Gelar ini mempertahankan bobot kristologis κύριος dan merupakan padanan baku dalam bahasa Indonesia.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Dalam bahasa Indonesia modern, “Yesus Kristus” adalah bentuk yang paling alami dan dikenal luas; “Kristus” tetap membawa latar gelar Mesias, meskipun dalam formula ini juga berfungsi seperti bagian dari sebutan tetap.
- source_word: μετὰ
  choice: menyertai
  rationale: Bahasa Yunani secara harfiah memakai “dengan” dalam klausa tanpa verba. Bentuk harapan “kiranya ... menyertai” mengungkapkan fungsi berkat itu secara alami dalam bahasa Indonesia.
- source_word: πνεύματος
  choice: roh
  rationale: Huruf kecil dipakai karena bentuk “roh kalian” paling langsung menunjuk pada batin atau roh para penerima, tanpa menegaskan bahwa yang dimaksud ialah Roh Kudus.
- source_word: ὑμῶν
  choice: kalian
  rationale: Pronomina Yunani ini berbentuk jamak. “Kalian” membuat cakupan jamaknya terlihat jelas dan menunjukkan bahwa berkat penutup ditujukan kepada seluruh penerima surat, bukan hanya Filemon.
theological_decisions:
- issue: Fungsi Χριστοῦ dalam berkat penutup
  choice: Kristus
  alternative: Mesias
  rationale: Χριστός secara asal adalah gelar “Mesias”, tetapi dalam formula “Tuhan Yesus Kristus” unsur itu juga telah menjadi sebutan yang mapan. “Kristus” mempertahankan ungkapan Indonesia yang alami tanpa meniadakan latar gelarnya.
- issue: Rujukan πνεύματος dalam frasa “roh kalian”
  choice: roh para penerima
  alternative: Roh Kudus
  rationale: Kata ganti milik jamak “kalian” paling wajar menunjuk kepada roh atau batin para penerima. Terjemahan memakai huruf kecil dan tidak menambahkan penjelasan doktrinal yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Bentuk “kiranya ... menyertai” mempertahankan fungsi berkat dari klausa Yunani yang tidak memiliki verba eksplisit; “kalian” dipilih untuk memperlihatkan bentuk jamak ὑμῶν.
