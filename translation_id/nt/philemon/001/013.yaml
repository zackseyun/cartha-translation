  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: id
  text: Aku sebenarnya ingin menahannya bersamaku, supaya ia dapat melayaniku mewakili engkau ketika aku berada dalam belenggu Injil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “belenggu Injil” berarti belenggu yang berkaitan dengan Injil, kemungkinan besar belenggu yang ditanggung karena memberitakan Injil. Ungkapan ini juga dapat diterjemahkan, “belenggu karena Injil” atau “belenggu demi Injil.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: -nya
  rationale: Pronomina relatif akusatif maskulin tunggal ini merujuk kepada Onesimus. Dalam bahasa Indonesia, rujukan tersebut paling alami dinyatakan sebagai enklitik objek pada “menahannya”.
- source_word: ἐβουλόμην
  choice: Aku ingin
  rationale: Bentuk imperfek βούλομαι menyatakan keinginan Paulus pada waktu lampau dalam alur surat. Bahasa Indonesia tidak menandai aspek imperfek secara morfologis, dan “ingin” menyampaikan maksudnya dengan alami tanpa menambahkan nuansa yang tidak pasti.
- source_word: πρὸς ἐμαυτὸν
  choice: tetap bersamaku
  rationale: Bersama κατέχειν, frasa ini menunjukkan bahwa Paulus hendak mempertahankan Onesimus dalam kebersamaan dengannya. Kata “tetap” memperjelas gagasan mempertahankan keadaan yang sedang berlangsung.
- source_word: κατέχειν
  choice: menahannya
  rationale: Dalam konteks ini kata tersebut berarti mempertahankan atau tetap menempatkan seseorang di sisi sendiri. “Menahannya tetap bersamaku” alami dalam bahasa Indonesia dan tidak memberi kesan kepemilikan.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan tujuan keinginan Paulus. “Supaya” menyampaikan hubungan tujuan secara jelas dan wajar.
- source_word: ὑπὲρ σοῦ
  choice: mewakili engkau
  rationale: ὑπέρ dengan genitif menunjukkan pelayanan yang dilakukan atas nama atau untuk kepentingan Filemon. “Mewakili engkau” menyampaikan unsur representatif tanpa menyatakan penggantian mutlak.
- source_word: μοι διακονῇ
  choice: ia dapat melayaniku
  rationale: διακονέω menunjuk pada pemberian pelayanan atau bantuan. “Melayani” cukup luas untuk mencakup bantuan praktis dan tidak membatasi tindakan itu pada jabatan gerejawi; “dapat” sesuai dengan tujuan yang dinyatakan oleh bentuk subjungtif dalam klausa ἵνα.
- source_word: ἐν τοῖς δεσμοῖς
  choice: selama aku berada dalam belenggu
  rationale: δεσμοί secara konkret berarti ikatan atau belenggu dan dalam konteks ini menunjuk pada pemenjaraan Paulus. Rumusan ini mempertahankan citra belenggu sekaligus terdengar alami.
- source_word: τοῦ εὐαγγελίου
  choice: Injil
  rationale: Genitif ini menghubungkan belenggu Paulus dengan Injil tanpa dengan sendirinya menetapkan secara eksplisit apakah hubungannya terutama bersifat sebab, tujuan, atau keterkaitan. Frasa padat “belenggu Injil” mempertahankan ketegangan itu; catatan kaki menjelaskan makna yang paling mungkin.
theological_decisions:
- issue: Hubungan genitif τοῦ εὐαγγελίου dengan δεσμοῖς
  choice: belenggu Injil
  alternative: belenggu karena Injil; belenggu demi Injil
  rationale: Teks Yunani memakai genitif yang padat. Kemungkinan besar Paulus berbicara tentang belenggu yang ditanggung karena pemberitaan Injil, tetapi terjemahan utama tidak memaksakan hanya hubungan sebab atau tujuan. Catatan kaki memberi penjelasan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Engkau” dipakai agar sesuai dengan sapaan pribadi tunggal kepada Filemon. Susunan kalimat mempertahankan alur keinginan, tujuan, pelayanan perwakilan, dan keadaan Paulus dalam satu kalimat sebagaimana teks Yunani.
