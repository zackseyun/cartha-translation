  naturalness: Kalimatnya jelas dan berregister modern-baku. Penggantian “tetap bersamaku” menjadi “bersamaku” menghindari penambahan penekanan temporal yang tidak perlu, sementara makna mempertahankan tetap dipikul oleh “menahannya.” “Ketika aku berada dalam” lebih langsung daripada “selama aku berada dalam” untuk ἐν τοῖς δεσμοῖς dalam konteks keadaan pemenjaraan.
  terminology: “Melayani,” “mewakili engkau,” dan “belenggu Injil” dapat dipertahankan. “Belenggu Injil” dengan catatan kaki secara tepat mempertahankan genitif Yunani yang padat tanpa menetapkan satu hubungan kausal atau tujuan sebagai satu-satunya makna.
