base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: id
  text: Karena yakin akan ketaatanmu, aku menulis kepadamu, sebab aku tahu bahwa engkau bahkan akan berbuat lebih dari yang kukatakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melampaui apa yang kukatakan.” Paulus mungkin menyiratkan bahwa Filemon akan melakukan lebih dari permintaan khusus yang telah disampaikannya, tetapi teks tidak menyebutkan secara tepat tindakan tambahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: karena yakin
  rationale: Partisip perfek ini menyatakan keadaan keyakinan yang telah mantap dan sekaligus memberikan dasar bagi tindakan Paulus menulis. Ungkapan “karena yakin” alami dalam bahasa Indonesia dan mempertahankan hubungan adverbial tersebut.
- source_word: τῇ ὑπακοῇ σου
  choice: akan ketaatanmu
  rationale: ὑπακοή secara langsung menyatakan ketaatan atau kesediaan tunduk kepada arahan. “Ketaatan” mempertahankan bobot relasional dan moralnya tanpa melemahkannya menjadi sekadar kesediaan atau persetujuan.
- source_word: ἔγραψά σοι
  choice: aku menulis kepadamu
  rationale: Bentuk aoris dapat dipahami sebagai aoris epistoler, yakni tindakan menulis yang sedang dilakukan tetapi dipandang dari sudut penerima surat. Bahasa Indonesia tidak wajib menandai kala, sehingga “aku menulis kepadamu” alami dan tidak menentukan secara berlebihan antara nuansa lampau dan kini.
- source_word: εἰδὼς
  choice: sebab aku tahu
  rationale: Partisip perfek ini menyatakan pengetahuan yang mantap dan menyertai tindakan menulis. Klausa “sebab aku tahu” mengungkapkan hubungan logisnya secara wajar dalam bahasa Indonesia.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: bahkan ... lebih dari yang kukatakan
  rationale: ὑπέρ dengan akusatif berarti “melampaui” atau “lebih dari,” sedangkan καί memberi penekanan “bahkan.” Pilihan ini mempertahankan harapan Paulus bahwa Filemon akan melampaui permintaan yang dinyatakan tanpa menentukan tindakan tambahan itu.
- source_word: ποιήσεις
  choice: engkau ... akan berbuat
  rationale: Bentuk futur ποιέω bersifat luas dan terbuka. “Akan berbuat” mempertahankan ketidakspesifikan tindakan yang diharapkan Paulus serta sesuai dengan sapaan tunggal kepada Filemon.
theological_decisions:
- issue: Daya makna ὑπακοή dalam hubungan dengan permohonan Paulus
  choice: Diterjemahkan “ketaatan,” bukan istilah yang lebih lunak seperti “kesediaan menanggapi.”
  alternative: kepatuhan; kesediaan menanggapi
  rationale: Teks memakai ὑπακοή, yang benar-benar membawa makna ketaatan. Pilihan ini mempertahankan dinamika kewibawaan Paulus tanpa menambahkan unsur paksaan yang tidak dinyatakan teks.
- issue: Implikasi frasa “lebih dari yang kukatakan”
  choice: Dibiarkan terbuka tanpa merinci tindakan tambahan yang Paulus harapkan.
  alternative: Menafsirkannya secara eksplisit sebagai permintaan untuk membebaskan Onesimus, atau hanya sebagai penerimaan yang murah hati.
  rationale: Ungkapan Paulus bersifat sugestif tetapi tidak spesifik. Terjemahan mempertahankan ambiguitas dan ketegangan retoris tersebut, alih-alih menetapkan salah satu penafsiran yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku–engkau” dipakai untuk menjaga kehangatan surat pribadi sekaligus nada seriusnya. Susunan kalimat dibuat alami tanpa menghilangkan keyakinan retoris Paulus atau keterbukaan makna pada bagian akhir.
