  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: id
  text: Karena kasih, aku lebih memilih memohon—aku, Paulus, seorang yang sudah tua,[a] dan sekarang juga seorang tahanan Mesias Yesus[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang duta”; tetapi kata Yunani ini lebih alami berarti “seorang yang sudah tua.”
    reason: alternative_reading
  - marker: b
    text: 'Yunani: “Kristus Yesus”; “Mesias Yesus” digunakan di sini karena Χριστός berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: demi kasih
  rationale: διά dengan akusatif menyatakan alasan atau dasar tindakan. Dalam konteks kontras dengan hak Paulus untuk memerintah pada ayat 8, 'demi kasih' terdengar alami dan mempertahankan gagasan bahwa kasih menjadi dasar permohonannya.
- source_word: μᾶλλον παρακαλῶ
  choice: aku lebih memilih memohon
  rationale: μᾶλλον menandai pilihan yang berlawanan dengan tindakan memerintah pada ayat sebelumnya, sedangkan παρακαλῶ di sini menyatakan permohonan pribadi. Gabungan ini menyampaikan kontras secara wajar dalam bahasa Indonesia.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: aku ini Paulus
  rationale: Ungkapan Yunani bersifat eliptis dan memperkenalkan gambaran diri Paulus. Terjemahan ini menghindari susunan Indonesia yang kaku sambil mempertahankan penekanan pribadi sebelum dua keterangannya.
- source_word: πρεσβύτης
  choice: seorang yang sudah tua
  rationale: Makna paling alami ialah orang yang telah lanjut usia, bukan jabatan penatua. Pilihan ini jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: νυνὶ δὲ καὶ
  choice: dan sekarang juga
  rationale: Pilihan ini mempertahankan penekanan waktu dari νυνί serta unsur tambahan dari καί.
- source_word: δέσμιος Χριστοῦ Ἰησοῦ
  choice: seorang tahanan karena Kristus Yesus
  rationale: δέσμιος berarti orang yang dipenjarakan. Genitif Χριστοῦ Ἰησοῦ dapat menyatakan hubungan dengan Kristus; dalam konteks pemenjaraan Paulus, 'karena' menyampaikan bahwa keterikatannya kepada Kristus menjadi sebab ia ditahan, tanpa membuat Yesus terdengar sebagai pihak yang menahannya.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kristus Yesus
  rationale: '''Kristus'' merupakan bentuk yang mapan dan mudah dipahami dalam bahasa Indonesia serta tetap membawa gelar Mesianik dalam konteks Kristen.'
theological_decisions:
- issue: Makna πρεσβύτης
  choice: seorang yang sudah tua
  alternative: seorang utusan; seorang penatua
  rationale: Bentuk yang terdapat dalam teks adalah πρεσβύτης, yang secara langsung menunjuk kepada usia lanjut. 'Utusan' biasanya mewakili kata Yunani lain, sedangkan 'penatua' dapat mengimpor pengertian jabatan gerejawi yang tidak dituntut konteks.
- issue: Hubungan genitif dalam δέσμιος Χριστοῦ Ἰησοῦ
  choice: tahanan karena Kristus Yesus
  alternative: tahanan milik Kristus Yesus; tahanan Kristus Yesus
  rationale: Ungkapan Yunani memungkinkan hubungan kepunyaan atau keterikatan, tetapi konteks surat mendukung pengertian bahwa Paulus dipenjara karena pelayanannya kepada Kristus. Kata 'karena' alami dalam bahasa Indonesia dan menghindari kesan bahwa Kristus adalah pihak yang memenjarakannya.
- issue: Penerjemahan Χριστός
  choice: Kristus
  alternative: Mesias
  rationale: Keduanya menyampaikan gelar yang sama. 'Kristus Yesus' adalah ungkapan baku dalam bahasa Indonesia modern dan tidak harus dipahami sebagai nama belaka; penerjemahan ini tidak menghilangkan identitas Yesus sebagai Mesias.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada pribadi, hormat, dan persuasif. Tanda pisah mempertahankan kalimat yang berlanjut ke ayat berikutnya. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
