    rationale: Dalam konteks ini Χριστός tetap bertitel; "Mesias Yesus" membuat daya gelarnya terdengar dalam bahasa sasaran.
  - severity: low
    issue: Catatan kaki alternatif πρεσβύτης menggunakan "utusan."
    rationale: Alternatif historis yang dimaksud lebih tepat "duta" (ambassador), bukan istilah umum "utusan."
