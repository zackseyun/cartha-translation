revisions:
- from: Namun, demi kasih, aku lebih memilih memohon—aku ini Paulus, seorang yang sudah tua,[a] dan sekarang juga seorang tahanan karena Kristus Yesus—
  to: Karena kasih, aku lebih memilih memohon—aku, Paulus, seorang yang sudah tua,[a] dan sekarang juga seorang tahanan Mesias Yesus[b]—
  rationale: Revisi menghindari penetapan hubungan kausal yang tidak dinyatakan oleh genitif Yunani, menerjemahkan gelar Χριστός secara konsisten sebagai "Mesias," dan membetulkan istilah dalam catatan alternatif. Susunan aposisional mempertahankan karakter eliptis dan penegasan diri dalam teks Yunani sambil tetap alami dalam bahasa Indonesia.
