  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: id
  text: Anugerah dan damai sejahtera bagi kalian dari Allah, Bapa kita, dan dari Tuhan Yesus, Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuhan Yesus Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar, “Mesias,” atau dalam konteks tertentu lebih menyerupai nama, “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Anugerah
  rationale: Dalam salam Paulus, χάρις sekaligus merupakan bentuk salam dan istilah teologis yang berbobot; “anugerah” mempertahankan kedua nuansa itu.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Bentuk datif jamak ini mengacu kepada Filemon beserta para penerima lain yang disebut dalam ayat 1–2; “kalian” menyatakan kemajemukan itu secara jelas dan wajar.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia ini alami dalam register Alkitab dan mempertahankan cakupan εἰρήνη yang lebih luas daripada sekadar ketiadaan konflik.
- source_word: ἀπὸ
  choice: dari
  rationale: Preposisi ini menandai sumber anugerah dan damai sejahtera.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: 'Rangkaian genitif ini paling alami dipahami secara aposisional: Allah adalah Bapa kita. Koma memperjelas hubungan itu dalam bahasa Indonesia.'
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” mempertahankan daya honorifik dan kristologis κύριος dalam pemakaian Paulus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός pada rumusan ini tetap dapat didengar sebagai gelar. “Sang Mesias” mengungkapkan makna gelarnya secara idiomatis, sedangkan “Kristus” dicatat sebagai alternatif karena istilah Yunani itu juga dapat berfungsi menyerupai nama.
theological_decisions:
- issue: Hubungan Allah Bapa dan Tuhan Yesus sebagai sumber berkat
  choice: dari Allah, Bapa kita, dan dari Tuhan Yesus
  alternative: dari Allah Bapa kita dan Tuhan Yesus
  rationale: ἀπό secara eksplisit muncul sekali dan secara gramatikal menaungi kedua unsur yang dihubungkan oleh καί. Pengulangan “dari” dalam bahasa Indonesia memperjelas koordinasi tanpa mengubah bahwa keduanya disebut sebagai sumber anugerah dan damai sejahtera.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: “Sang Mesias” mempertahankan isi gelar Χριστός, tetapi catatan kaki menjaga kenyataan bahwa dalam rumusan Paulus kata itu juga dapat terasa lebih menyerupai bagian dari nama tetap.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipilih untuk menandai bentuk jamak ὑμῖν dengan jelas; “damai sejahtera” mempertahankan keluasan makna salam Paulus. Tanda koma pada “Allah, Bapa kita” dan “Yesus, Sang Mesias” menandai aposisi secara alami.
