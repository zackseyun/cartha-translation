  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: id
  text: bukan lagi sebagai budak[a], melainkan lebih daripada seorang budak, yaitu saudara yang terkasih—terutama bagiku, dan apalagi bagimu, baik secara manusiawi[b] maupun di dalam Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai hamba.” Kata Yunani ini dapat mencakup beragam keadaan penghambaan, tetapi di sini kemungkinan menunjuk pada kedudukan sosial Onesimus sebagai orang yang terikat.
    reason: alternative_reading
  - marker: b
    text: “Secara manusiawi” di sini kemungkinan berarti dalam hubungan duniawi atau sosial, atau secara pribadi; bukan dalam arti “tabiat berdosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: bukan lagi
  rationale: Mengungkapkan penyangkalan temporal dan perubahan dari keadaan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὡς δοῦλον
  choice: sebagai budak
  rationale: Dalam konteks Onesimus, istilah ini menunjuk pada kedudukan sosial yang terikat; 'budak' mempertahankan kenyataan sosial tersebut dan kekuatan kontras ayat.
- source_word: ὑπὲρ δοῦλον
  choice: lebih daripada budak
  rationale: ὑπέρ menyatakan keadaan atau nilai yang melampaui status budak, bukan penggantian.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: saudara yang terkasih
  rationale: Mempertahankan metafora kekeluargaan Kristen dan menyampaikan ἀγαπητός dengan bahasa yang wajar serta bermartabat.
- source_word: μάλιστα ἐμοί
  choice: terutama bagiku
  rationale: Menandai kadar khusus dalam hubungan Onesimus dengan Paulus.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: tetapi terlebih lagi bagimu
  rationale: Menyampaikan peningkatan retoris dari hubungan dengan Paulus kepada hubungan dengan Filemon secara alami.
- source_word: ἐν σαρκὶ
  choice: secara jasmani
  rationale: Mempertahankan citra σάρξ sekaligus memberi bentuk Indonesia yang alami; catatan menjelaskan bahwa maksudnya adalah ranah kehidupan duniawi, sosial, atau pribadi, bukan tabiat berdosa.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus tentang hubungan atau persekutuan dalam lingkup Tuhan tanpa mempersempit maknanya.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks Onesimus
  choice: budak
  alternative: hamba; orang yang terikat sebagai hamba
  rationale: Konteks surat menonjolkan kedudukan sosial Onesimus. 'Budak' menyatakan kenyataan itu secara jelas dan mempertahankan kontras 'lebih daripada budak'.
- issue: Makna ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: baik secara jasmani maupun di dalam Tuhan
  alternative: baik dalam hubungan duniawi maupun di dalam Tuhan; baik secara pribadi maupun di dalam Tuhan
  rationale: Terjemahan mempertahankan dua ranah hubungan yang disebut Paulus tanpa menyamakan 'daging' dengan tabiat berdosa atau membatasi frasa itu pada satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Struktur perbandingan dan ketegangan antara hubungan sosial-jasmani dengan hubungan di dalam Tuhan dipertahankan. Semua penanda catatan kaki dicantumkan dalam teks utama.
