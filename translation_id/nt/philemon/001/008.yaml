lexical_decisions:
- source_word: Διό
  choice: Karena itu
  rationale: Konjungsi ini menarik kesimpulan dari uraian sebelumnya; “Karena itu” mempertahankan hubungan logis tersebut secara wajar dalam bahasa Indonesia.
- source_word: πολλὴν ... παρρησίαν
  choice: keberanian besar
  rationale: παρρησία dapat menunjuk pada keberanian, keyakinan, atau keterusterangan. “Keberanian besar” mempertahankan nomina dan penguatan oleh πολλήν tanpa mempersempit maknanya secara berlebihan.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan “Mesias”; preposisi ἐν dipertahankan sebagai “dalam” agar ungkapan relasional khas Paulus tidak dipersempit.
- source_word: ἔχων
  choice: meskipun ... aku memiliki
  rationale: Partisipel ini bersifat konsesif dalam konteks, berlawanan dengan permohonan atas dasar kasih pada ayat berikutnya.
- source_word: ἐπιτάσσειν σοι
  choice: memerintahkan engkau
  rationale: ἐπιτάσσω menyatakan tindakan memberi perintah dengan kewenangan, sedangkan σοι menandai orang yang diperintah.
- source_word: τὸ ἀνῆκον
  choice: melakukan apa yang patut
  rationale: Partisipel berartikel ini berarti hal yang patut, pantas, atau sesuai. Kata “melakukan” ditambahkan untuk menghasilkan susunan bahasa Indonesia yang alami tanpa menambah isi substantif.
theological_decisions:
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Kata Yunani Χριστός pada dasarnya adalah gelar. “Mesias” mempertahankan arti gelarnya, sedangkan “Kristus” merupakan bentuk transliterasi yang lazim dalam tradisi Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur konsesif dipertahankan karena kalimat berlanjut ke ayat 9; bentuk “engkau” dipakai sebagai sapaan tunggal yang sesuai dengan konteks surat pribadi.
