  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: id
  text: Aku memohon kepadamu mengenai anakku[a], Onesimus, yang telah kuperanakkan ketika aku dibelenggu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah anak dalam arti hubungan rohani, bukan anak kandung.
    reason: metaphor_clarification
  - marker: b
    text: “Ketika aku dibelenggu” juga dapat dipahami sebagai “ketika aku dipenjarakan”; bahasa Yunani mempertahankan gambaran konkret tentang ikatan atau belenggu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ σε
  choice: Aku memohon kepadamu
  rationale: Menyampaikan permintaan pribadi yang sungguh-sungguh tanpa menjadikannya perintah; bentuk orang pertama tunggal sesuai dengan nada surat.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: mengenai anakku
  rationale: περί dengan genitif berarti 'mengenai/tentang', sedangkan τέκνον mempertahankan sebutan penuh kasih dan metafora hubungan rohani tanpa mempersempitnya menjadi 'putra'.
- source_word: ὃν ἐγέννησα
  choice: yang kuperanakkan
  rationale: Mempertahankan metafora kelahiran atau memperanakkan dari γεννάω. Bentuk ini lebih setia pada citra Yunani daripada penjelasan langsung seperti 'yang kubimbing kepada iman'.
- source_word: ἐν τοῖς δεσμοῖς
  choice: dalam belengguku
  rationale: Mempertahankan citra konkret δεσμοί, yaitu ikatan atau belenggu, yang secara metonimis juga menunjuk pada keadaan dipenjarakan. Unsur milik disampaikan secara alami dari konteks orang pertama.
- source_word: Ὀνήσιμον
  choice: Onesimus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat hubungan Paulus dengan Onesimus
  choice: Metafora bahwa Paulus 'memperanakkan' Onesimus dipertahankan tanpa menyebut pertobatan secara eksplisit.
  alternative: yang menjadi anak rohaniku ketika aku dipenjarakan
  rationale: Teks mengisyaratkan terbentuknya hubungan rohani, kemungkinan melalui pelayanan Paulus, tetapi menyatakannya dengan metafora γεννάω. Terjemahan tidak memperjelasnya melampaui yang dikatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan personal. 'Aku' dipakai sesuai nada surat pribadi Paulus. 'Kuperanakkan' sengaja mempertahankan metafora yang tajam dalam teks sumber, sedangkan catatan kaki membantu pembaca memahami makna rohaninya.
