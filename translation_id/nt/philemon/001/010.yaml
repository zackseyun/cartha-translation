  naturalness: “Yang kuperanakkan” mempertahankan metafora sumber, tetapi bentuk tanpa “telah” terasa lebih kaku dalam kalimat Indonesia modern. “Ketika aku dibelenggu” lebih idiomatis daripada “dalam belengguku” sambil tetap mempertahankan citra konkret δεσμοί.
  terminology: “Anakku” tepat untuk τέκνον dan tidak mempersempitnya menjadi “putraku.” “Kuperanakkan” secara sengaja mempertahankan metafora orang tua rohani tanpa menambahkan pernyataan tentang pertobatan. Nama “Onesimus” sudah tepat.
