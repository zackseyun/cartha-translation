  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: id
  text: 'dan kepada Apfia, saudari, kepada Arkhipus, rekan seperjuangan kami, dan kepada jemaat di rumahmu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Apfia
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia yang wajar.
- source_word: τῇ ἀδελφῇ
  choice: saudari seiman
  rationale: Secara harfiah berarti “saudari”; dalam sapaan kepada komunitas Kristen, ungkapan ini menunjuk pada hubungan sebagai sesama orang percaya. “Seiman” membuat fungsi sapaan itu jelas dalam bahasa Indonesia tanpa menambahkan kata ganti milik yang tidak terdapat dalam teks SBLGNT.
- source_word: Ἀρχίππῳ
  choice: Arkhipus
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: rekan seperjuangan kami
  rationale: Mempertahankan gambaran kebersamaan dalam perjuangan yang terkandung dalam kata majemuk Yunani, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τῇ ... ἐκκλησίᾳ
  choice: kepada jemaat
  rationale: “Jemaat” merupakan padanan Indonesia yang mapan dan sesuai konteks bagi komunitas Kristen yang berkumpul.
- source_word: κατ’ οἶκόν σου
  choice: di rumahmu
  rationale: Mengikuti ungkapan Yunani secara dekat dan membiarkan konteks menyatakan bahwa jemaat itu berada atau berkumpul di rumah Filemon.
- source_word: καὶ
  choice: dan; kepada
  rationale: Struktur koordinatif sapaan dipertahankan, sementara pengulangan “kepada” digunakan agar daftar penerima jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἀδελφῇ perlu diterjemahkan dengan kata ganti milik “kami/kita”
  choice: saudari seiman
  alternative: saudari kami
  rationale: Teks SBLGNT yang diberikan tidak memuat ἡμῶν setelah ἀδελφῇ. Karena itu, teks utama tidak menambahkan kata ganti milik, sedangkan varian naskah dicatat dalam catatan kaki.
- issue: Cara menyampaikan metafora militer dalam συστρατιώτῃ
  choice: rekan seperjuangan kami
  alternative: sesama prajurit kami
  rationale: Pilihan utama mempertahankan gagasan perjuangan bersama tanpa memberi kesan bahwa Arkhipus secara harfiah adalah seorang tentara; alternatif lebih harfiah tetapi kurang alami dan dapat mempersempit metafora.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “kepada” memperjelas daftar penerima surat; “jemaat di rumahmu” sengaja tidak diperluas menjadi “jemaat yang berkumpul di rumahmu” agar tetap dekat dengan bentuk sumber dan tidak menutup nuansa lokasi maupun tempat pertemuan.
