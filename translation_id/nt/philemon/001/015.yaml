  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: id
  text: Sebab, mungkin karena itulah ia terpisah darimu untuk sementara waktu, supaya engkau mendapatkannya kembali untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia pergi darimu untuk sementara waktu.” Bentuk pasif Yunani yang diterjemahkan “ia terpisah” mungkin secara halus menghindari penetapan kesalahan langsung dan juga membuka kemungkinan adanya maksud ilahi yang tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: mungkin
  rationale: Mempertahankan kesimpulan Paulus yang tentatif dan bersahaja, tanpa menyatakannya sebagai kepastian.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai hubungan penjelasan dengan ayat sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: διὰ τοῦτο
  choice: justru karena itulah
  rationale: Mengungkapkan alasan yang dipertimbangkan Paulus dan menegaskan kemungkinan bahwa perpisahan sementara itu mengarah pada hasil yang lebih besar.
- source_word: ἐχωρίσθη
  choice: ia terpisah
  rationale: Bentuk ini mempertahankan nuansa pasif Yunani tanpa menetapkan apakah Onesimus, Filemon, keadaan, atau Allah merupakan pelaku langsung.
- source_word: πρὸς ὥραν
  choice: untuk sementara waktu
  rationale: Ungkapan idiomatis ini berarti suatu masa yang terbatas, bukan secara harfiah satu jam, dan membentuk kontras dengan 'untuk selama-lamanya'.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan maksud atau hasil yang dituju secara jelas dan alami.
- source_word: αἰώνιον
  choice: untuk selama-lamanya
  rationale: Adjektiva ini berfungsi secara adverbial dan mengontraskan perpisahan sementara dengan kepemilikan atau hubungan yang berlangsung terus; pilihan ini tidak mempersempit kemungkinan nuansa rohaninya.
- source_word: αὐτὸν
  choice: -nya
  rationale: Objek ini mengacu kepada Onesimus dan digabungkan secara alami ke dalam kata 'mendapatkannya'.
- source_word: ἀπέχῃς
  choice: engkau mendapatkannya kembali
  rationale: Menyatakan bahwa Filemon memperoleh Onesimus kembali, sambil mempertahankan konteks relasional dan tidak membatasi maknanya pada penerimaan sesaat.
theological_decisions:
- issue: Pelaku yang tersirat dalam bentuk pasif ἐχωρίσθη
  choice: Mempertahankan konstruksi pasif 'ia terpisah' tanpa menyebut pelaku.
  alternative: “ia pergi darimu” atau “Allah memisahkannya darimu”
  rationale: Ungkapan Paulus dapat secara halus menghindari penetapan kesalahan langsung dan sekaligus membuka kemungkinan penyelenggaraan ilahi, tetapi tidak menyatakannya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' dipakai sesuai konteks surat pribadi. Susunan kalimat mempertahankan kelembutan retoris Paulus serta kontras antara perpisahan sementara dan pemulihan yang berlangsung selamanya.
