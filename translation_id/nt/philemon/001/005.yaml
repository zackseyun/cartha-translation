  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: id
  text: karena aku mendengar tentang kasihmu dan iman yang kamu miliki kepada Tuhan Yesus dan bagi semua orang kudus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan mengungkapkan maksudnya secara lebih eksplisit: “imanmu kepada Tuhan Yesus dan kasihmu kepada semua orang kudus.”'
    reason: alternative_reading
  - marker: b
    text: Atau “kesetiaan yang kamu miliki.” Kata Yunani yang dipakai dapat berarti iman, kepercayaan, atau kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: karena aku mendengar
  rationale: Partisipel ini bergantung pada ungkapan syukur dalam ayat sebelumnya dan secara kontekstual bernuansa sebab; bentuk kini dipertahankan dengan “mendengar”.
- source_word: ἀγάπην
  choice: kasih
  rationale: Padanan baku dan alami bagi ἀγάπη dalam konteks hubungan Kristen.
- source_word: πίστιν
  choice: iman
  rationale: “Iman” merupakan padanan utama πίστις; kemungkinan makna “kesetiaan” dicatat tanpa dimasukkan secara sepihak ke teks utama.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: kepada Tuhan Yesus
  rationale: “Kepada” menyatakan arah atau orientasi terhadap pribadi dan mempertahankan perbedaan dari εἰς pada frasa berikutnya.
- source_word: κύριον
  choice: Tuhan
  rationale: Padanan baku bagi gelar kristologis κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: bagi semua orang kudus
  rationale: “Bagi” alami untuk relasi kasih terhadap sesama umat percaya, sekaligus membedakannya dari πρός.
- source_word: ἁγίους
  choice: orang kudus
  rationale: Padanan Perjanjian Baru yang mapan bagi sebutan komunal ἅγιοι dan lebih wajar dalam bahasa Indonesia daripada bentuk tunggal “kudus” sebagai nomina.
theological_decisions:
- issue: Hubungan “kasih” dan “iman” dengan kedua frasa preposisional
  choice: 'Urutan permukaan bahasa Yunani dipertahankan: “kasih dan imanmu ... kepada Tuhan Yesus dan bagi semua orang kudus.”'
  alternative: Maknanya dapat diperjelas secara distributif sebagai “imanmu kepada Tuhan Yesus dan kasihmu kepada semua orang kudus.”
  rationale: Pembacaan distributif sesuai dengan pemakaian Paulus dan konteks, tetapi susunan Yunani tidak secara eksplisit membagi kedua nomina kepada objek masing-masing. Teks utama mempertahankan ambiguitas itu dan catatan kaki menyajikan pembacaan yang lebih eksplisit.
- issue: Nuansa makna πίστις
  choice: iman
  alternative: kesetiaan
  rationale: πίστις dapat menunjuk pada iman, kepercayaan, atau kesetiaan. Padanan utama dipertahankan, sementara alternatif leksikal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Yunani yang agak tegang dipertahankan agar hubungan antara kasih, iman, Tuhan Yesus, dan orang-orang kudus tidak ditentukan secara berlebihan; catatan kaki memberi pembacaan distributif yang lebih alami.
