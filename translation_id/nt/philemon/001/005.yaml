  source_fidelity: 'Teks utama mempertahankan hubungan sintaktis yang tidak sepenuhnya diperinci antara kasih, iman, Tuhan Yesus, dan semua orang kudus. Namun, “kasih dan imanmu yang kamu miliki” tidak mencerminkan pembagian gramatikal Yunani dengan baik: σου (“-mu”) menyertai kasih dan iman, sedangkan klausa relatif tunggal ἣν ἔχεις (“yang kamu miliki”) secara langsung merujuk kepada πίστιν (“iman”).'
  naturalness: Frasa “kasih dan imanmu yang kamu miliki” terdengar tidak seimbang dalam bahasa Indonesia, karena “-mu” hanya tampak melekat pada iman, sementara “yang kamu miliki” menjadi berlebihan. “Kasihmu dan iman yang kamu miliki” lebih jelas dan tetap mempertahankan susunan yang relatif dekat dengan bahasa sumber.
  terminology: “Kasih,” “iman,” “Tuhan Yesus,” dan “orang kudus” adalah padanan yang tepat dan baku dalam register Alkitab bahasa Indonesia. “Kepada” dan “bagi” dengan sengaja mempertahankan pembedaan umum antara πρός dan εἰς tanpa memaksakan pembacaan distributif ke dalam teks utama.
