  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: id
  text: Namun, saudara-saudara, dalam nama Tuhan kita Yesus Sang Mesias, kami memerintahkan kalian untuk menjauhkan diri[a] dari setiap saudara yang hidup tidak tertib dan tidak sesuai dengan tradisi yang mereka terima dari kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menarik diri dari”; maksud ungkapan Yunaninya ialah menjaga jarak dari pergaulan dekat.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah berbunyi “yang kalian terima dari kami” atau “yang ia terima dari kami,” sehingga menyelaraskan susunan kalimat setelah “setiap saudara.” Teks yang digunakan di sini berbunyi “yang mereka terima dari kami.”
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν δὲ ὑμῖν
  choice: Namun, ... kami memerintahkan kalian
  rationale: παραγγέλλω menyatakan perintah berwenang, sedangkan δέ dipertahankan sebagai penghubung kontras ringan dengan konteks sebelumnya. Bentuk jamak 'kalian' membedakan ὑμῖν dari sapaan tunggal.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan gerejawi ini alami dalam bahasa Indonesia dan dapat mencakup seluruh jemaat tanpa harus menambahkan unsur yang tidak dinyatakan secara eksplisit.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: dalam nama Tuhan kita Yesus Sang Mesias
  rationale: Mempertahankan idiom ἐν ὀνόματι dan daya khidmatnya. Χριστός dipahami sebagai gelar dan diterjemahkan 'Sang Mesias' secara idiomatis.
- source_word: στέλλεσθαι ὑμᾶς ἀπό
  choice: untuk menjauhkan diri dari
  rationale: Bentuk medial menyiratkan menarik diri dari pergaulan dekat; pilihan ini tegas tetapi tidak mengimpor gagasan teknis tentang pengucilan resmi.
- source_word: παντὸς ἀδελφοῦ
  choice: setiap saudara
  rationale: Mempertahankan bentuk tunggal dan bahasa kekeluargaan komunitas iman.
- source_word: ἀτάκτως περιπατοῦντος
  choice: yang hidup tidak tertib
  rationale: περιπατέω adalah metafora bagi cara hidup; 'hidup' lebih alami daripada 'berjalan' dalam bahasa Indonesia. 'Tidak tertib' mempertahankan keluasan ἀτάκτως dan tidak mempersempitnya hanya menjadi kemalasan.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: tidak menurut tradisi
  rationale: παράδοσις berarti sesuatu yang diteruskan atau diwariskan. 'Tradisi' adalah padanan langsung, dengan sumber tradisi itu dijelaskan dalam klausa berikutnya.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: yang mereka terima dari kami
  rationale: Mengikuti bacaan SBLGNT παρελάβοσαν, orang ketiga jamak, sekalipun peralihannya dari 'setiap saudara' terasa tidak biasa.
theological_decisions:
- issue: Penerjemahan gelar Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam rangkaian gelar kristologis ini, Χριστός tetap transparan sebagai gelar. 'Sang Mesias' menyampaikan fungsi tersebut tanpa memperlakukannya sekadar sebagai nama diri.
- issue: Cakupan tindakan στέλλεσθαι ὑμᾶς ἀπό
  choice: menjauhkan diri dari
  alternative: menarik diri dari
  rationale: Pilihan ini mempertahankan tuntutan untuk membatasi pergaulan tanpa menafsirkan ayat ini secara khusus sebagai prosedur pengucilan formal.
- issue: Ketidakselarasan jumlah dalam ἣν παρελάβοσαν
  choice: yang mereka terima dari kami
  alternative: yang ia terima dari kami; yang kalian terima dari kami
  rationale: Teks tercetak memakai verba orang ketiga jamak. Ketegangan sintaksis setelah nomina tunggal dipertahankan dan varian yang menghaluskannya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai penerima jamak secara jelas, sedangkan 'Saudara-saudara' mempertahankan sapaan komunal. Metafora 'berjalan' dialihkan secara alami menjadi 'hidup'. Semua penanda catatan kaki muncul dalam teks utama.
