  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: id
  text: Tetapi kamu, Saudara-saudara[a], janganlah jemu berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; kata Yunani secara harfiah berarti “saudara-saudara” dan dapat digunakan untuk menyapa seluruh komunitas orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Tetapi kamu
  rationale: δέ menandai kontras dengan pembicaraan sebelumnya tentang orang-orang yang hidup tidak tertib, sedangkan ὑμεῖς yang ditempatkan di depan memberi penekanan pada para penerima surat. “Tetapi kamu” menyampaikan kontras dan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Bentuk sapaan jamak ini secara harfiah berarti saudara laki-laki, tetapi dalam pemakaian Paulus dapat menyapa seluruh jemaat, termasuk perempuan. “Saudara-saudara” merupakan sapaan jemaat yang wajar dan bermartabat, sementara cakupan inklusifnya dijelaskan dalam catatan kaki.
- source_word: μὴ ἐγκακήσητε
  choice: janganlah menjadi lelah
  rationale: Subjungtif aoris dengan μή berfungsi sebagai larangan. ἐγκακέω menyatakan menjadi lelah, tawar hati, atau kehilangan semangat dalam meneruskan suatu tindakan. Pilihan ini mempertahankan gambaran keletihan tanpa membatasi maknanya hanya pada kelelahan fisik.
- source_word: καλοποιοῦντες
  choice: dalam berbuat baik
  rationale: Partisipel kini menunjukkan kegiatan berkelanjutan yang menjadi ranah larangan tersebut. “Dalam berbuat baik” alami dalam bahasa Indonesia dan mempertahankan arti terus melakukan apa yang baik.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bentuk Yunani yang dipakai adalah maskulin jamak, tetapi dalam konteks sapaan kepada jemaat kemungkinan mencakup seluruh komunitas orang percaya. Teks utama mempertahankan bentuk sapaan tradisional yang dekat dengan bentuk sumber, dan catatan kaki menjaga cakupan inklusifnya tanpa menghapus ciri gramatikal Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, wajar, dan bermartabat. Larangan dibuat langsung tetapi tidak kaku; sapaan jemaat mempertahankan kedekatan pastoral Paulus.
