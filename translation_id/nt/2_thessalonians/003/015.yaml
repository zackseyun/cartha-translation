  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: id
  text: Dan janganlah menganggapnya sebagai musuh, melainkan tegurlah dia sebagai saudara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara laki-laki”; di sini istilah ini menunjuk pada sesama orang percaya dan dapat dipakai secara representatif bagi anggota komunitas Kristen, baik laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: menganggap
  rationale: Kata ini menyatakan penilaian atau cara memandang seseorang; “menganggap” alami dalam bahasa Indonesia dan mempertahankan makna evaluatifnya.
- source_word: ἐχθρόν
  choice: musuh
  rationale: Kata ini menunjuk pada kategori musuh, yang dalam konteks ini dikontraskan dengan saudara seiman.
- source_word: νουθετεῖτε
  choice: tegurlah
  rationale: Bentuk imperatif ini mengandung tindakan menasihati atau memperingatkan dengan maksud mengoreksi. “Tegurlah” menyampaikan daya korektif sekaligus tetap sesuai dengan sikap persaudaraan.
- source_word: ἀδελφόν
  choice: saudara seiman
  rationale: Secara harfiah berarti “saudara laki-laki”, tetapi di sini menunjuk pada sesama anggota komunitas orang percaya. “Saudara seiman” menyatakan makna kontekstual tanpa membatasi rujukannya berdasarkan jenis kelamin.
- source_word: ὡς
  choice: sebagai
  rationale: Dalam kedua frasa, kata ini menandai kategori atau kedudukan yang menjadi dasar seseorang dipandang dan ditegur.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Jangan ... tetapi ...
  rationale: Susunan ini menyampaikan larangan dan kontras secara langsung serta alami. Konjungsi καί tidak perlu diterjemahkan tersendiri karena ayat Indonesia tetap mengalir sebagai kelanjutan konteks.
theological_decisions:
- issue: Sikap disipliner terhadap anggota komunitas yang tidak taat
  choice: Orang itu tidak boleh dipandang sebagai musuh, tetapi harus dikoreksi dengan tetap mengakuinya sebagai saudara seiman.
  alternative: Ayat ini dapat dipahami sebagai nasihat umum tentang konflik antarpribadi.
  rationale: Konteks 2 Tesalonika 3:14–15 membahas orang dalam komunitas yang tidak menaati ajaran surat. Sebutan ἀδελφόν mempertahankan relasi komunitas meskipun tindakan korektif tetap diperlukan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Tegurlah” dipilih untuk mempertahankan unsur koreksi dalam νουθετεῖτε, sedangkan “saudara seiman” membuat rujukan komunitas eksplisit dan alami.
