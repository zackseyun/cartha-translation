  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: id
  text: Kiranya Tuhan, sumber damai sejahtera, itu sendiri memberi kalian damai sejahtera senantiasa[a] dengan segala cara[b]. Kiranya Tuhan menyertai kalian semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap saat”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam segala hal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: itu sendiri
  rationale: Pemakaian intensif αὐτός menegaskan bahwa Tuhan secara pribadi adalah pemberi damai sejahtera; ungkapan ini alami sesudah frasa “Tuhan sumber damai sejahtera”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan ringan menuju berkat penutup. Dalam bahasa Indonesia, peralihan ini sudah jelas dari konteks dan tidak memerlukan kata penghubung khusus.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: Tuhan sumber damai sejahtera
  rationale: Genitif dipahami sebagai ungkapan relasional yang menggambarkan Tuhan sebagai asal atau pemberi damai sejahtera. Pilihan ini lebih alami daripada bentuk harfiah “Tuhan dari damai sejahtera” tanpa menambahkan identifikasi yang tidak dinyatakan.
- source_word: δῴη
  choice: Kiranya ... memberi
  rationale: Optatif aoris dalam berkat atau doa menyatakan harapan; “Kiranya” mempertahankan daya benediktifnya.
- source_word: τὴν εἰρήνην
  choice: damai sejahtera
  rationale: Dalam konteks berkat, εἰρήνη menunjuk pada keadaan damai dan kesejahteraan yang utuh; padanan baku dan alami dalam bahasa Indonesia adalah “damai sejahtera”.
- source_word: διὰ παντὸς
  choice: senantiasa
  rationale: Frasa ini menyatakan kesinambungan sepanjang waktu. “Senantiasa” ringkas, jelas, dan bermartabat.
- source_word: ἐν παντὶ τρόπῳ
  choice: dalam segala cara
  rationale: τρόπος menyatakan cara atau keadaan berlangsungnya sesuatu. Terjemahan ini mempertahankan keluasan ungkapan sumber tanpa mempersempitnya menjadi sarana tertentu.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kalian semua
  rationale: “Kalian semua” mempertahankan cakupan πάντων dan membedakan sapaan jamak ὑμῶν secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan gelar “Tuhan” dalam berkat
  choice: Mempertahankan “Tuhan” tanpa menambahkan nama atau identifikasi lain.
  alternative: Menerjemahkan secara eksplisit sebagai “Tuhan Yesus” atau sebagai “Allah”.
  rationale: Teks Yunani hanya menyatakan ὁ κύριος. Konteks Paulus mungkin menunjuk kepada Tuhan Yesus, tetapi terjemahan tidak seharusnya menghilangkan keluasan yang masih terdapat dalam teks.
- issue: Daya klausa terakhir
  choice: Kiranya Tuhan menyertai kalian semua.
  alternative: Tuhan menyertai kalian semua.
  rationale: Walaupun bahasa Yunani tidak memuat verba eksplisit, konteks penutup menunjukkan berkat atau harapan, bukan sekadar pernyataan indikatif. Pengulangan “Kiranya” membuat daya itu jelas dan alami dalam bahasa Indonesia.
- issue: Makna genitif τῆς εἰρήνης
  choice: Tuhan sumber damai sejahtera
  alternative: Tuhan damai sejahtera; Tuhan yang memberi damai sejahtera.
  rationale: “Sumber” mengungkapkan hubungan genitif secara alami dalam bahasa Indonesia dan cocok dengan tindakan memberi damai dalam klausa berikut, tetapi tidak menyamakan Tuhan secara langsung dengan damai sejahtera.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai sapaan orang kedua jamak secara transparan. Penanda catatan ditempatkan langsung sesudah ungkapan yang diterangkan dan diurutkan [a], lalu [b].
