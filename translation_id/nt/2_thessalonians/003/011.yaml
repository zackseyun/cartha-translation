base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: id
  text: Sebab kami mendengar bahwa beberapa orang di antara kalian hidup tidak tertib[a]. Mereka sama sekali tidak bekerja, tetapi malah mencampuri urusan orang lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup bermalas-malasan” atau “hidup tanpa disiplin.” Kata Yunani ini dapat menggambarkan perilaku yang tidak tertib atau kemalasan yang bertentangan dengan tata hidup komunitas.
    reason: lexical_alternative
  - marker: b
    text: 'Kata Yunani ini dapat berarti menyibukkan diri dengan hal-hal yang bukan urusannya. Terdapat permainan kata: mereka “tidak bekerja,” tetapi justru “sibuk ke sana kemari” dengan mencampuri urusan orang lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: kami mendengar
  rationale: Bentuk kini menunjukkan laporan atau kabar yang sedang diterima; ungkapan ini alami dalam bahasa Indonesia dan tidak melebihkan aspek verba.
- source_word: γάρ
  choice: sebab
  rationale: Kata ini memberikan alasan atau penjelasan bagi nasihat sebelumnya; “sebab” mempertahankan hubungan logis tersebut.
- source_word: τινας
  choice: beberapa orang
  rationale: Menunjuk kepada sejumlah orang yang tidak disebutkan secara khusus di dalam jemaat.
- source_word: περιπατοῦντας
  choice: hidup
  rationale: Dalam konteks ini, verba yang secara harfiah berarti “berjalan” merupakan idiom bagi cara hidup atau perilaku. “Hidup” menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Menunjukkan bahwa orang-orang tersebut berada dalam lingkungan komunitas penerima surat.
- source_word: ἀτάκτως
  choice: tidak tertib
  rationale: Mencakup perilaku yang tidak teratur, tidak disiplin, atau menyimpang dari tata hidup komunitas, tanpa mempersempit maknanya hanya menjadi kemalasan.
- source_word: μηδὲν ἐργαζομένους
  choice: sama sekali tidak bekerja
  rationale: Mempertahankan penekanan μηδέν bahwa mereka tidak melakukan pekerjaan apa pun.
- source_word: ἀλλὰ
  choice: tetapi malah
  rationale: Menyatakan pertentangan yang tegas antara tidak bekerja dan sibuk dalam kegiatan yang tidak semestinya.
- source_word: περιεργαζομένους
  choice: mencampuri urusan orang lain
  rationale: Mengungkapkan makna turut campur atau menyibukkan diri secara tidak semestinya. Pilihan ini alami dalam bahasa Indonesia, sementara catatan kaki menjelaskan permainan kata dengan ἐργαζομένους.
