  naturalness: Bahasa baku dan mudah dipahami. Rangkaian gelar tanpa koma, 'Tuhan Yesus Sang Mesias', lebih padu sebagai satu sebutan daripada apposisi yang dipisahkan koma. Susunan 'sambil bekerja dengan tenang' juga dengan jelas mempertahankan hubungan partisipial.
  terminology: '''Sang Mesias'' tepat untuk Χριστός yang masih berfungsi sebagai gelar. ''Mendesak'' lebih dekat dengan daya παρακαλοῦμεν daripada ''menasihati'', sambil tetap membedakannya dari perintah yang berwibawa.'
