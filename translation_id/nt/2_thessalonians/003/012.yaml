  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: id
  text: Kepada orang-orang seperti itu, kami memerintahkan dan mendesak dalam Tuhan Yesus Sang Mesias supaya, sambil bekerja dengan tenang, mereka makan roti mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "makan roti mereka sendiri." Dalam konteks ini, ungkapan tersebut berarti memenuhi kebutuhan hidup melalui pekerjaan sendiri.
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Kepada orang-orang seperti itu
  rationale: Frasa datif ini menunjuk kembali kepada orang-orang yang hidup tidak tertib dan tidak bekerja dalam konteks sebelumnya. δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: kami memerintahkan dan menasihati
  rationale: Kedua verba dipertahankan untuk menyampaikan sekaligus kewibawaan perintah dan kesungguhan imbauan pastoral. 'Menasihati' lebih alami daripada 'mendesak' dalam konstruksi ini tanpa menghilangkan daya serunya.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: dalam Tuhan Yesus, Sang Mesias
  rationale: ἐν dipertahankan sebagai 'dalam', yang dapat menyatakan lingkup, persekutuan, dan kewibawaan. Χριστός diterjemahkan sebagai gelar 'Sang Mesias', bukan seolah-olah nama keluarga.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: mereka bekerja dengan tenang
  rationale: Ungkapan ini menggambarkan cara hidup dan bekerja yang tenang serta tertib, berlawanan dengan kemalasan yang mengganggu orang lain. Bentuk partisipial Yunani diungkapkan secara alami sebagai bagian dari isi perintah.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: makan dari hasil jerih payah mereka sendiri
  rationale: Secara harfiah berarti 'makan roti mereka sendiri', tetapi dalam konteks ungkapan itu menunjuk pada memperoleh makanan atau nafkah melalui pekerjaan sendiri. Terjemahan ini membuat implikasi idiomatisnya jelas tanpa menyiratkan bahwa mereka membuat roti sendiri.
theological_decisions:
- issue: Makna dan fungsi Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap berfungsi sebagai gelar bagi Yesus. 'Sang Mesias' mempertahankan arti gelar itu secara transparan.
- issue: Dasar perintah rasuli dalam frasa ἐν κυρίῳ
  choice: dalam Tuhan Yesus
  alternative: atas nama Tuhan Yesus / oleh Tuhan Yesus
  rationale: '''Dalam'' mempertahankan keluasan ungkapan Yunani, yang dapat mencakup kewibawaan Tuhan sekaligus kesatuan atau lingkup kehidupan di dalam Dia, tanpa mempersempitnya menjadi alat semata.'
- issue: Gabungan kewibawaan dan seruan pastoral
  choice: memerintahkan dan menasihati
  alternative: menginstruksikan
  rationale: Dua verba sumber sengaja dipertahankan agar perintah yang berwibawa dan nasihat yang sungguh-sungguh tidak dilebur menjadi satu gagasan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, sementara unsur perintah, nasihat, dan ketenangan hidup tetap dipertahankan. Gelar 'Sang Mesias' dipakai secara eksplisit; ungkapan harfiah tentang 'roti' dijelaskan melalui catatan kaki karena terjemahan utama memakai padanan idiomatis.
