revisions:
- from: Kepada orang-orang seperti itu, kami memerintahkan dan menasihati dalam Tuhan Yesus, Sang Mesias,[a] supaya mereka bekerja dengan tenang[b] dan makan dari hasil jerih payah mereka sendiri.[c]
  to: Kepada orang-orang seperti itu, kami memerintahkan dan mendesak dalam Tuhan Yesus Sang Mesias supaya, sambil bekerja dengan tenang, mereka makan roti mereka sendiri.[a]
  rationale: Revisi mempertahankan ungkapan konkret 'roti mereka sendiri' dalam teks utama dan memindahkan penjelasan idiomatisnya ke catatan kaki. Verba kedua diperkuat menjadi 'mendesak' untuk mencerminkan παρακαλοῦμεν, dan gelar Yesus dirangkaikan tanpa koma. Catatan alternatif tentang 'Kristus' tidak diperlukan karena tidak ada ambiguitas tekstual yang memengaruhi pembaca; pilihan 'Sang Mesias' sudah transparan dalam teks.
