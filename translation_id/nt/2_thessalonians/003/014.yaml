  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: id
  text: Jika ada orang yang tidak menaati perkataan kami yang disampaikan melalui surat ini[a], tandailah orang itu[b] dan jangan bergaul dengannya[c], supaya ia merasa malu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dengan surat ini” atau “dalam surat ini.” Ungkapan Yunani dapat menunjukkan sarana yang dipakai untuk menyampaikan petunjuk tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “perhatikanlah secara khusus” atau “catatlah.”
    reason: lexical_alternative
  - marker: c
    text: Atau “jangan tetap bergaul dengannya.”
    reason: lexical_alternative
  - marker: d
    text: Tujuannya bersifat korektif; bandingkan ayat 15, yang memerintahkan agar ia tetap ditegur “sebagai saudara.”
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: menaati
  rationale: Kata ini menyatakan kepatuhan terhadap perkataan atau petunjuk yang berwenang; 'menaati' tepat dan alami dalam konteks nasihat ini.
- source_word: τῷ λόγῳ ἡμῶν
  choice: perkataan kami
  rationale: λόγος di sini menunjuk pada pesan atau petunjuk para rasul. 'Perkataan kami' mempertahankan bentuk ungkapan Yunani tanpa mempersempitnya menjadi satu ucapan.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: yang disampaikan melalui surat ini
  rationale: διά dengan genitif menyatakan sarana; frasa ini menunjukkan bahwa perkataan tersebut disampaikan melalui surat yang sedang dibaca. Kata 'ini' dipasok secara wajar oleh konteks.
- source_word: σημειοῦσθε
  choice: tandailah
  rationale: Imperatif ini memerintahkan jemaat untuk mengenali atau memberi tanda pada orang tersebut. 'Tandailah' mempertahankan ketegasan dan citra leksikal teks sumber.
- source_word: τοῦτον
  choice: orang itu
  rationale: Kata tunjuk ini merujuk secara khusus kepada orang yang tidak taat dan diterjemahkan secara jelas dalam bahasa Indonesia.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: jangan bergaul dengannya
  rationale: Kata kerja ini berarti bercampur atau berhubungan bersama. 'Jangan bergaul dengannya' alami dalam bahasa Indonesia dan mempertahankan nuansa pembatasan hubungan sosial dalam komunitas.
- source_word: ἐντραπῇ
  choice: ia merasa malu
  rationale: Bentuk pasif-subjungtif ini menyatakan tujuan agar orang tersebut mengalami rasa malu. Pilihan ini tidak mengesankan bahwa penghinaan adalah tujuan akhir.
- source_word: τις
  choice: ada orang
  rationale: Pronomina tak tentu ini bersifat umum; dalam konstruksi syarat bahasa Indonesia, 'jika ada orang' terdengar alami.
- source_word: αὐτῷ
  choice: dengannya
  rationale: Pronomina ini merujuk kembali kepada orang yang tidak taat; bentuk '-nya' wajar dan tidak menambahkan penentuan gender yang tidak perlu dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat tindakan disiplin dalam μὴ συναναμίγνυσθαι αὐτῷ
  choice: Pembatasan pergaulan dalam komunitas yang dimaksudkan sebagai koreksi terhadap orang percaya yang tidak taat.
  alternative: Ekskomunikasi formal sepenuhnya, atau sekadar menghindari pergaulan santai tanpa dimensi kehidupan jemaat.
  rationale: Ayat berikutnya tetap menyebut orang itu sebagai saudara yang harus ditegur, bukan musuh. Terjemahan tidak memasukkan kategori hukum gerejawi yang lebih kemudian.
- issue: Daya ἐντραπῇ
  choice: Rasa malu sebagai hasil korektif yang diharapkan.
  alternative: Penghinaan terbuka sebagai tujuan pada dirinya sendiri.
  rationale: Klausa tujuan dan ayat 15 menempatkan rasa malu dalam kerangka disiplin yang bersifat memperbaiki, meskipun teks tidak secara eksplisit menyebut pertobatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur syarat-perintah-tujuan dalam teks Yunani. 'Tandailah' mempertahankan ketegasan σημειοῦσθε, sedangkan catatan kaki memberi alternatif yang lebih idiomatis. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
