base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: id
  text: Kami juga tidak makan roti dari siapa pun tanpa membayar[a], melainkan bekerja siang dan malam dengan jerih payah dan kesukaran, supaya kami tidak menjadi beban bagi siapa pun di antara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kami juga tidak makan roti siapa pun dengan cuma-cuma.” Kata Yunani yang diterjemahkan “roti” dapat menunjuk secara lebih luas pada makanan atau dukungan materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: tanpa membayar
  rationale: Adverbia ini berarti dengan cuma-cuma atau tanpa biaya. Dalam konteks dukungan materi, 'tanpa membayar' menyampaikan nuansa ekonominya secara jelas dan wajar.
- source_word: ἄρτον
  choice: roti
  rationale: Makna harfiahnya ialah 'roti', meskipun dapat mewakili makanan atau nafkah secara lebih luas. Bentuk konkret dipertahankan dan kemungkinan makna luas dijelaskan dalam catatan kaki.
- source_word: παρά τινος
  choice: dari siapa pun
  rationale: παρά dengan genitif menunjukkan sumber, sedangkan τις bersifat tak tentu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan penyangkalan.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: dengan jerih payah dan kesukaran
  rationale: Kedua nomina yang berdekatan maknanya menekankan kerja berat sekaligus keadaan sulit; pasangan ini mempertahankan daya kumulatif ungkapan Yunani.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: siang dan malam
  rationale: Idiom waktu ini menggambarkan kerja sepanjang putaran hari. 'Siang dan malam' merupakan ungkapan Indonesia yang alami, walaupun urutan unsur Yunani secara harfiah ialah 'malam dan siang'.
- source_word: ἐργαζόμενοι
  choice: bekerja
  rationale: Partisipel ini menjelaskan tindakan Paulus dan rekan-rekannya untuk menopang diri; 'bekerja' lugas dan sesuai dengan konteks.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: supaya kami tidak menjadi beban
  rationale: Konstruksi ini menyatakan tujuan. Dalam konteks tersebut, ἐπιβαρέω menunjuk pada pembebanan materi atau keuangan; bentuk idiomatis Indonesia ini mempertahankan maksudnya.
- source_word: τινα ὑμῶν
  choice: siapa pun di antara kalian
  rationale: Bentuk tak tentu tunggal dengan pronomina genitif menghasilkan makna distributif, yaitu tidak membebani seorang pun dari jemaat.
- source_word: οὐδὲ ... ἀλλ’
  choice: juga tidak ... melainkan
  rationale: Pasangan ini mempertahankan pertentangan kuat antara tidak menerima makanan secara cuma-cuma dan sebaliknya bekerja keras.
