  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: id
  text: Sebab kamu sendiri tahu bagaimana kamu harus meneladani kami, karena kami tidak bertindak secara tidak tertib[a] di antara kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih khusus dalam konteks ini, “kami tidak bermalas-malasan di antara kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: kamu sendiri
  rationale: Kata ganti intensif ini menegaskan bahwa jemaat Tesalonika sendiri sudah mengetahui teladan para rasul.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi nasihat sebelumnya.
- source_word: οἴδατε
  choice: tahu
  rationale: 'Walaupun bentuk Yunani ini secara morfologis perfek, maknanya lazimnya bersifat kini: ''tahu''.'
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: bagaimana kamu harus meneladani kami
  rationale: Ungkapan ini mempertahankan unsur cara, keharusan, dan objek personal 'kami', sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Di sini kata tersebut memperkenalkan dasar bagi pengetahuan mereka tentang cara meneladani para rasul.
- source_word: οὐκ ἠτακτήσαμεν
  choice: kami tidak hidup tidak tertib
  rationale: Pilihan ini mempertahankan arti luas ἀτακτέω, yaitu berperilaku tidak tertib atau menyimpang dari tatanan, tanpa membatasinya hanya pada kemalasan.
- source_word: ἐν ὑμῖν
  choice: di antara kamu
  rationale: Frasa ini menunjuk pada perilaku para rasul ketika berada di tengah jemaat.
theological_decisions:
- issue: Cakupan makna ἀτακτέω dalam konteks langsung
  choice: Pernyataan luas tentang hidup atau berperilaku tidak tertib
  alternative: Secara khusus, 'kami tidak bermalas-malasan di antara kamu'
  rationale: Konteks pasal ini memang menyoroti orang yang tidak mau bekerja, tetapi arti leksikal ἀτακτέω lebih luas daripada kemalasan. Teks utama mempertahankan keluasan itu, sedangkan kemungkinan kontekstual yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Meneladani' dipilih sebagai padanan alami bagi tindakan meniru kehidupan seseorang; 'hidup tidak tertib' menjaga keluasan istilah Yunani meskipun pengulangan 'tidak' sedikit bertanda secara stilistis.
