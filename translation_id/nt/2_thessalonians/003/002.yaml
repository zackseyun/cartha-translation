id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: id
  text: dan supaya kami diluputkan dari orang-orang yang menyimpang dan jahat[a], sebab tidak semua orang memiliki iman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang tidak patut dan jahat” atau “orang-orang yang tidak masuk akal dan jahat.” Kata Yunani yang diterjemahkan “menyimpang” dapat berarti tidak patut, ganjil, atau tidak masuk akal.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab tidak semua orang setia.” Secara harfiah, teks Yunani berbunyi kira-kira, “sebab bukan milik semua orang iman itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: kami diluputkan
  rationale: Bentuk pasif subjungtif sesudah ἵνα menyatakan tujuan. “Diluputkan” secara alami menyampaikan pembebasan atau penyelamatan dari orang-orang yang memusuhi tanpa menentukan caranya.
- source_word: ἀτόπων
  choice: yang menyimpang
  rationale: Ἄτοπος secara harfiah berkaitan dengan sesuatu yang tidak pada tempatnya, lalu dapat berarti tidak patut, menyimpang, atau tidak masuk akal. Dalam pasangan dengan πονηρῶν dan konteks para penentang, “yang menyimpang” mempertahankan nuansa perilaku yang tidak patut tanpa menyamakannya dengan “jahat”.
- source_word: πονηρῶν
  choice: jahat
  rationale: Istilah moral yang lazim untuk kejahatan atau keburukan; “jahat” jelas dan wajar dalam bahasa Indonesia.
- source_word: ἀνθρώπων
  choice: orang-orang
  rationale: Bentuk jamak ini menunjuk kepada manusia yang memusuhi para rasul. Bahasa Indonesia tidak perlu menandai gender, dan konteks ayat tidak mengharuskan pembatasan kepada laki-laki.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks penentangan terhadap pemberitaan, “iman” paling mungkin menunjuk kepada kepercayaan. Kemungkinan makna “kesetiaan” tetap dicatat.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: sebab tidak semua orang memiliki iman
  rationale: Ungkapan Yunani bersifat eliptis, secara harfiah kira-kira “sebab bukan milik semua orang iman itu.” Kata “memiliki” melengkapinya secara wajar dalam bahasa Indonesia tanpa menjadikannya pernyataan yang lebih kuat.
theological_decisions:
- issue: Makna πίστις dalam klausa οὐ γὰρ πάντων ἡ πίστις
  choice: iman
  alternative: kesetiaan; karena tidak semua orang setia
  rationale: Konteks langsung mengenai para penentang pelayanan rasuli lebih mendukung ketiadaan iman, tetapi πίστις juga dapat berarti kesetiaan. Catatan kaki mempertahankan kemungkinan itu tanpa menyelesaikan ketegangan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Diluputkan” mempertahankan nada doa rasuli; “orang-orang yang menyimpang dan jahat” dapat dipahami pembaca umum serta menjaga pembedaan antara kedua kata sifat Yunani.
