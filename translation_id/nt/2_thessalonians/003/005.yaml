  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: id
  text: Kiranya Tuhan mengarahkan hati kalian kepada kasih Allah[a] dan kepada ketabahan Mesias[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih kepada Allah.” Frasa Yunani ini juga dapat berarti “kasih yang Allah miliki.”
    reason: alternative_reading
  - marker: b
    text: Atau “ketabahan yang dimiliki Mesias,” atau “ketabahan demi Mesias.”
    reason: alternative_reading
  - marker: c
    text: 'Yunani: “Kristus”; di sini diterjemahkan “Mesias” karena istilah itu berfungsi sebagai gelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku bagi gelar ilahi κύριος; mempertahankan bobot teologis tanpa menentukan rujukannya lebih jauh daripada teks.
- source_word: κατευθύναι
  choice: mengarahkan
  rationale: Bentuk optatif menyatakan doa atau harapan, sehingga diterjemahkan dengan “Kiranya ... mengarahkan”; kata ini mempertahankan gambaran tentang memberi arah yang benar.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan metafora antropologis Alkitab bagi pusat pikiran, kehendak, dan perasaan.
- source_word: ἀγάπην
  choice: kasih
  rationale: Padanan alami dan baku untuk ἀγάπη dalam ragam Alkitab Indonesia.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Frasa “kasih Allah” cukup ringkas dan tetap membuka kemungkinan kasih yang berasal dari Allah maupun kasih yang tertuju kepada Allah; alternatif dijelaskan dalam catatan kaki.
- source_word: ὑπομονὴν
  choice: ketabahan
  rationale: Menyatakan daya tahan yang teguh di bawah tekanan dengan lebih tepat daripada “ketekunan”, yang dalam bahasa Indonesia sering menekankan kerajinan.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dan karena itu diterjemahkan “Mesias”; konstruksi “ketabahan Mesias” mempertahankan ambiguitas genitif.
theological_decisions:
- issue: Genitif ambigu dalam τὴν ἀγάπην τοῦ θεοῦ
  choice: kasih Allah
  alternative: kasih kepada Allah; kasih yang berasal dari Allah
  rationale: Teks Yunani dapat menunjuk pada kasih Allah kepada umat, kasih umat kepada Allah, atau ranah kasih ilahi. Teks utama tidak memaksakan satu tafsiran.
- issue: Genitif ambigu dalam τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: ketabahan Mesias
  alternative: ketabahan yang dimiliki Mesias; ketabahan demi Mesias
  rationale: Genitif dapat dipahami secara subjektif, objektif, atau kualitatif; bentuk ringkas dalam teks utama menjaga ketegangan tersebut.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Istilah Yunani ini bermakna gelar “Yang Diurapi”; “Mesias” menerjemahkan fungsi gelarnya, sedangkan bentuk tradisional disebutkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” menyatakan orang kedua jamak secara jelas dan mudah dipahami. Pengulangan “kepada” mengikuti kesejajaran dua frasa εἰς dalam sumber sekaligus tetap alami dalam bahasa Indonesia.
