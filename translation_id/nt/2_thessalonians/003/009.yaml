  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: id
  text: Bukan karena kami tidak mempunyai hak[a], melainkan supaya kami menjadikan diri kami teladan[b] bagi kalian, agar kalian meniru kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wewenang” atau “kuasa.” Dalam konteks ini, yang terutama dimaksud ialah hak atau tuntutan yang sah.
    reason: lexical_alternative
  - marker: b
    text: Atau “contoh” atau “pola.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: hak
  rationale: Dalam konteks ini, kata tersebut menunjuk pada hak yang sah untuk menerima dukungan materi, bukan terutama kuasa atau wewenang secara umum.
- source_word: ἑαυτοὺς
  choice: diri kami
  rationale: Bentuk refleksif ini merujuk kepada Paulus dan rekan-rekannya serta mempertahankan penekanan bahwa merekalah yang dijadikan teladan.
- source_word: τύπον
  choice: teladan
  rationale: Di sini kata tersebut berarti pola perilaku yang patut ditiru. “Teladan” alami dalam bahasa Indonesia dan jelas menyampaikan daya keteladanan itu.
- source_word: δῶμεν
  choice: menjadikan
  rationale: Dalam ungkapan ἑαυτοὺς τύπον δῶμεν, terjemahan harfiah “memberikan diri kami sebagai teladan” kurang alami. “Menjadikan diri kami teladan” menyampaikan maksud idiom Yunani dengan jelas.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: agar kalian meniru
  rationale: Konstruksi ini menyatakan tujuan atau hasil yang dimaksud; “agar” menyampaikannya secara wajar dan jelas.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: kalian meniru kami
  rationale: Terjemahan langsung ini mempertahankan objek eksplisit “kami” dan seruan konkret untuk mengikuti perilaku Paulus serta rekan-rekannya.
- source_word: οὐχ ὅτι οὐκ
  choice: Bukan karena kami tidak
  rationale: Ungkapan ini menyangkal alasan yang mungkin disangka pembaca dan mempertahankan kontras retoris teks Yunani.
- source_word: ἀλλ’ ἵνα
  choice: melainkan supaya
  rationale: Pilihan ini menyatakan tujuan positif yang dipertentangkan dengan penyangkalan sebelumnya.
theological_decisions:
- issue: Sifat hak yang dimaksud oleh ἐξουσίαν
  choice: Paulus dan rekan-rekannya memiliki hak yang sah untuk menerima dukungan, tetapi tidak menggunakan hak itu dalam keadaan ini.
  alternative: Kata itu dapat dipahami secara lebih luas sebagai wewenang atau kuasa kerasulan.
  rationale: Konteks langsung membahas bekerja dan tidak menjadi beban bagi orang lain. Karena itu, “hak” paling tepat menyampaikan tuntutan sah atas dukungan tanpa memperluas ayat ini menjadi pernyataan umum tentang seluruh wewenang kerasulan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμῖν secara jelas. Susunan dua klausa tujuan dipertahankan, tetapi “agar” pada klausa terakhir menghindari pengulangan “supaya” yang terasa kaku.
