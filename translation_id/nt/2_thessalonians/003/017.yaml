base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: id
  text: Salam ini kutulis dengan tanganku sendiri—aku, Paulus. Inilah tanda dalam setiap suratku[a]; beginilah aku menulis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Salam yang kutulis dengan tanganku sendiri—aku, Paulus—menjadi tanda dalam setiap surat; demikianlah aku menulis.” Klausa terakhir secara lebih harfiah dapat diterjemahkan, “demikianlah aku menulis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: Salam ini
  rationale: ἀσπασμός dalam konteks surat berarti salam. Penambahan demonstratif 'ini' wajar dalam bahasa Indonesia dan menunjuk pada salam penutup yang sedang ditulis Paulus.
- source_word: τῇ ἐμῇ χειρὶ
  choice: kutulis dengan tanganku sendiri
  rationale: Datif ini menyatakan bahwa Paulus secara pribadi menuliskan salam tersebut. Bentuk verbal eksplisit menghasilkan bahasa Indonesia yang alami sambil mempertahankan penekanan pada tulisan tangan Paulus sendiri.
- source_word: Παύλου
  choice: aku, Paulus
  rationale: Genitif ini mengidentifikasi tangan yang menulis sebagai tangan Paulus. Ungkapan 'aku, Paulus' mempertahankan daya pengenalan diri dalam bentuk Indonesia yang jelas dan alami.
- source_word: ὅ ἐστιν σημεῖον
  choice: Inilah tanda
  rationale: σημεῖον menunjuk pada tanda pengenal atau autentikasi. 'Tanda' merupakan padanan langsung dan mudah dipahami; 'inilah' merujuk kembali pada salam tulisan tangan itu.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: dalam setiap suratku
  rationale: Frasa ini menyatakan kebiasaan dalam korespondensi Paulus. 'Surat' lebih alami daripada 'epistel'; sufiks '-ku' memperjelas hubungan dengan surat-surat Paulus yang sudah tersirat oleh konteks.
- source_word: οὕτως γράφω
  choice: beginilah aku menulis
  rationale: οὕτως dapat menyatakan cara ('beginilah') atau berfungsi secara resumtif ('demikianlah'). Terjemahan utama mempertahankan acuan yang mungkin pada bentuk tulisan Paulus tanpa menjabarkan lebih jauh.
theological_decisions:
- issue: Daya interpretatif rumus tulisan tangan Paulus
  choice: Salam yang ditulis sendiri oleh Paulus disajikan sebagai tanda pengenal dalam surat-suratnya.
  alternative: Klausa terakhir dapat dipahami lebih sempit sebagai 'demikianlah aku menulis' atau 'demikian aku menuliskannya', hanya menunjuk pada salam yang sekarang.
  rationale: Konteks langsung dan frasa 'tanda dalam setiap surat' mendukung fungsi autentikasi, tetapi teks tidak menjelaskan secara rinci apakah tanda itu isi salam, bentuk tulisan tangan, atau keseluruhan rumus. Terjemahan dan catatan kaki mempertahankan kelonggaran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk 'kutulis' dan 'suratku' menghindari susunan nominal yang kaku serta menyampaikan bahwa Paulus sendiri menulis bagian ini. Tanda pisah tidak dipakai mengapit seluruh identifikasi agar hubungan antarklausa tetap mudah dibaca.
