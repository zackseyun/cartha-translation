  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: id
  text: Kiranya anugerah Tuhan kita Yesus Kristus menyertai kamu semua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam berkat penutup Paulus, χάρις menunjuk pada kemurahan dan pemberian Allah yang tidak layak diterima. “Anugerah” merupakan padanan baku, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam gelar kristologis ini, κύριος menyatakan kewibawaan dan kedudukan Yesus; “Tuhan” adalah padanan Indonesia yang mapan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Ἰησοῦς dialihaksarakan sebagai “Yesus”, sedangkan Χριστός dalam rumusan salam ini sudah berfungsi erat sebagai sebutan yang mapan. “Yesus Kristus” mempertahankan kealamian bahasa Indonesia sekaligus hubungan dengan gelar Mesias tanpa memaksakan pemisahan yang tidak dinyatakan oleh teks.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: μετά dengan genitif berarti “dengan”, sementara πάντων ὑμῶν mencakup seluruh jemaat. Dalam bentuk berkat bahasa Indonesia, “menyertai kamu semua” menyampaikan makna itu secara alami.
theological_decisions:
- issue: Fungsi Χριστοῦ dalam berkat penutup
  choice: Kristus
  alternative: Mesias
  rationale: Χριστός berasal dari gelar yang berarti “Yang Diurapi/Mesias”, tetapi dalam formula Paulus “Yesus Kristus” juga dapat berfungsi sebagai sebutan majemuk yang mapan. “Kristus” mempertahankan ambiguitas antara gelar aktif dan unsur nama tanpa menutup kaitannya dengan Mesias.
- issue: Bentuk gramatikal berkat tanpa verba eksplisit
  choice: Kiranya ... menyertai
  alternative: Anugerah ... menyertai
  rationale: Teks Yunani tidak memuat verba, tetapi bentuk ini dipahami sebagai berkat. “Kiranya” secara alami menandai nuansa harapan atau doa tanpa mengubahnya menjadi pernyataan faktual.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Sapaan “kamu” dipilih karena ditujukan kepada komunitas jamak; “semua” mempertahankan penekanan πάντων.
