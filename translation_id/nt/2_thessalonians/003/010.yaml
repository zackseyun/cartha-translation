source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: id
  text: 'Sebab, ketika kami bersama kalian pun, kami terus memberi perintah ini kepada kalian: “Jika seseorang tidak mau bekerja,[a] janganlah ia makan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak berkehendak untuk bekerja”; yang dimaksud adalah ketidakmauan, bukan ketidakmampuan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “ia juga tidak boleh makan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab, bahkan
  rationale: γάρ menghubungkan ayat ini sebagai alasan bagi konteks sebelumnya, sedangkan καί memberi penekanan; gabungan ini mempertahankan kedua unsur tersebut dalam bahasa Indonesia yang wajar.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: ketika kami berada bersama kalian
  rationale: πρός dengan orang di sini menyatakan keberadaan dalam kebersamaan atau kehadiran mereka.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: kami berulang kali memberi perintah ini kepada kalian
  rationale: Imperfek παρηγγέλλομεν dapat menyatakan tindakan yang berulang atau berlangsung pada masa lampau; 'berulang kali memberi perintah' mengungkapkan nuansa itu dengan jelas.
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: Ungkapan bersyarat tak tentu ini berlaku secara umum; 'seseorang' alami dan tidak membatasi jenis kelamin.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: tidak mau bekerja
  rationale: θέλει menunjuk pada kemauan, bukan kemampuan. Pilihan ini ringkas, alami, dan tidak menyiratkan bahwa orang tersebut tidak sanggup bekerja.
- source_word: μηδὲ ἐσθιέτω
  choice: janganlah ia makan
  rationale: Imperatif orang ketiga dengan μηδέ menyatakan konsekuensi berupa larangan. 'Janganlah ia makan' mempertahankan bentuk tunggal dan daya perintahnya.
theological_decisions:
- issue: Apakah pernyataan ini mengenai ketidakmampuan atau ketidakmauan untuk bekerja
  choice: tidak mau bekerja
  alternative: tidak dapat bekerja
  rationale: θέλει menyatakan kehendak atau kemauan. Karena itu, ayat ini membahas ketidakmauan, bukan orang yang tidak sanggup bekerja.
- issue: Daya imperatif dalam konsekuensi bersyarat
  choice: janganlah ia makan
  alternative: ia juga tidak boleh makan
  rationale: ἐσθιέτω adalah imperatif orang ketiga. Bentuk 'janganlah' mempertahankan bahwa ini merupakan perintah, bukan sekadar pernyataan mengenai kelayakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk membedakan bentuk jamak ὑμᾶς dari bentuk tunggal. Tanda petik menandai isi perintah yang diperkenalkan oleh ὅτι.
