  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: καὶ γάρ tetap bersifat menjelaskan dan menegaskan, bentuk imperfek παρηγγέλλομεν dipertahankan sebagai tindakan yang terus/berulang pada masa lampau, θέλει menunjukkan ketidakmauan, dan μηδὲ ἐσθιέτω mempertahankan daya imperatif negatif orang ketiga. Revisi hanya memperbaiki idiom bahasa Indonesia tanpa mengubah makna atau meniadakan nuansa imperfek.'
  naturalness: Frasa pembuka “Sebab, bahkan ketika” terasa sebagai kalk bahasa sumber dan kurang luwes dalam bahasa Indonesia baku. “Ketika kami bersama kalian pun” menyampaikan penekanan καί secara lebih alami. “Terus memberi perintah” juga lebih idiomatis daripada “berulang kali memberi perintah” sambil tetap membuka kemungkinan aspek imperfek yang berlangsung atau kebiasaan.
  terminology: “Tidak mau bekerja” tepat untuk οὐ θέλει ἐργάζεσθαι dan dengan benar tidak menyamakan ketidakmauan dengan ketidakmampuan. “Janganlah ia makan” merupakan padanan yang baik bagi imperatif negatif orang ketiga. “Kalian” secara konsisten mencerminkan bentuk jamak ὑμᾶς dalam register modern baku.
  issues:
  - severity: low
    issue: Pembuka “Sebab, bahkan ketika” kurang alami dalam bahasa Indonesia modern.
    rationale: Urutan tersebut terlalu mengikuti susunan Inggris/Yunani. Partikel “pun” setelah keterangan kebersamaan lebih alami untuk menyatakan unsur penegasan καί.
  - severity: low
    issue: “Berulang kali” mempersempit kemungkinan nilai imperfek παρηγγέλλομεν.
    rationale: Imperfek dapat bersifat iteratif maupun duratif/kebiasaan. “Terus memberi perintah” mempertahankan nuansa berkelanjutan tanpa menetapkan frekuensi secara terlalu spesifik.
  - severity: low
    issue: Alternatif pada catatan b kurang luwes sebagai bahasa Indonesia kontemporer.
    rationale: “Biarlah ia tidak makan” dapat terdengar permisif. “Ia juga tidak boleh makan” merupakan alternatif yang lebih wajar dan tetap menyatakan konsekuensi imperatif negatif.
