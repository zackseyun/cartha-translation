id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: id
  text: Akhirnya, Saudara-saudara[a], berdoalah untuk kami supaya firman Tuhan menyebar dengan cepat dan dimuliakan, sebagaimana yang terjadi di antara kalian[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saudara-saudari”; kata Yunani secara harfiah berbentuk “saudara-saudara” dan dapat dipakai untuk menyapa seluruh jemaat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berlari dan dimuliakan, sebagaimana juga di antara kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Akhirnya
  rationale: Ungkapan ini berfungsi sebagai penanda wacana yang memperkenalkan bagian penutup surat; 'Akhirnya' alami dalam bahasa Indonesia modern.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Imperatif kini jamak menyerukan doa yang berkelanjutan; bentuk imperatif Indonesia ini menyampaikan seruan tersebut secara wajar.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini secara gramatikal berbentuk maskulin jamak, tetapi dalam konteks jemaat dapat mewakili seluruh anggota jemaat; 'Saudara-saudara' mempertahankan bentuk sapaan tanpa perlu menambahkan kata dalam teks utama.
- source_word: περὶ ἡμῶν
  choice: untuk kami
  rationale: Bersama kata kerja 'berdoa', περί dengan genitif secara idiomatis berarti berdoa untuk seseorang.
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan isi sekaligus hasil yang dimohonkan dalam doa.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: firman Tuhan
  rationale: Ungkapan baku dan transparan yang mempertahankan idiom Alkitab; dalam konteks ini menunjuk pada berita yang diberitakan dan berasal dari atau mengenai Tuhan.
- source_word: τρέχῃ
  choice: menyebar dengan cepat
  rationale: Secara harfiah berarti 'berlari', tetapi secara metaforis menggambarkan kemajuan firman yang cepat. Pilihan ini menyampaikan makna metafora secara jelas dalam bahasa Indonesia.
- source_word: δοξάζηται
  choice: dimuliakan
  rationale: Mempertahankan hubungan leksikal dengan δόξα dan ketegangan ungkapan ketika 'firman' menjadi subjek pasif; maknanya mencakup penerimaan dengan penghormatan.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: sebagaimana yang terjadi di antara kalian
  rationale: Mengungkapkan secara alami perbandingan dengan pengalaman jemaat Tesalonika yang telah terjadi; unsur καί tercakup dalam perbandingan kontekstual.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Teks utama mempertahankan sapaan jamak sumber secara dekat, sedangkan kemungkinan bahwa sapaan itu mencakup seluruh jemaat dijelaskan dalam catatan kaki.
- issue: Metafora τρέχῃ mengenai kemajuan firman
  choice: menyebar dengan cepat
  alternative: berlari
  rationale: Kesepadanan optimal mengutamakan makna kemajuan yang cepat daripada mempertahankan citra yang dapat terdengar ganjil atau kabur dalam bahasa Indonesia.
- issue: Makna δοξάζηται ketika subjeknya firman Tuhan
  choice: dimuliakan
  alternative: dihormati
  rationale: '''Dimuliakan'' lebih dekat pada verba Yunani dan mempertahankan bobot teologis serta metaforisnya, tanpa menutup kemungkinan bahwa yang dimaksud ialah firman diterima dan dihargai sebagaimana mestinya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena sumber menggunakan orang kedua jamak dan konteksnya adalah jemaat; tanda koma akhir dipertahankan karena ayat berlanjut ke ayat berikutnya.
