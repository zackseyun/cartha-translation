  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: id
  text: Kami yakin dalam Tuhan bahwa kalian melakukan dan akan melakukan apa yang kami perintahkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν δὲ
  choice: Namun, ... kami yakin
  rationale: Bentuk perfek menyatakan keyakinan yang telah terbentuk dan tetap ada; δέ menandai peralihan ringan yang secara alami disampaikan dengan “Namun” dalam konteks ini.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: 'Mempertahankan ungkapan relasional dan dasar keyakinan Paulus: keyakinan itu berada dalam Tuhan, bukan semata-mata bertumpu pada kemampuan para pembaca.'
- source_word: ἐφ’ ὑμᾶς
  choice: tentang kalian
  rationale: Dalam konstruksi dengan πεποίθαμεν, frasa ini menunjuk kepada orang-orang yang menjadi sasaran keyakinan; “tentang kalian” alami dan tidak menggeser dasar keyakinan dari Tuhan kepada mereka.
- source_word: ἃ παραγγέλλομεν
  choice: apa yang kami perintahkan
  rationale: παραγγέλλω menyatakan instruksi berwenang atau perintah; “perintahkan” mempertahankan kekuatan istilah tersebut.
- source_word: καὶ ποιεῖτε καὶ ποιήσετε
  choice: kalian sedang melakukan dan akan terus melakukan
  rationale: Aspek kini dan masa depan dipertahankan. “Akan terus melakukan” secara alami menunjukkan kesinambungan tindakan yang sudah berlangsung.
theological_decisions:
- issue: Dasar keyakinan Paulus
  choice: “dalam Tuhan kami yakin tentang kalian”
  alternative: “kami percaya kepada kalian dalam Tuhan”
  rationale: 'Pilihan ini mempertahankan ketegangan teks: keyakinan itu menyangkut jemaat, tetapi berakar “dalam Tuhan,” tanpa mengubahnya menjadi kepercayaan yang berdiri sendiri terhadap manusia.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “kalian” dipakai untuk menandai bentuk jamak ὑμᾶς dengan jelas; susunan kalimat dijaga alami tanpa menghilangkan penekanan teologis “dalam Tuhan.”
