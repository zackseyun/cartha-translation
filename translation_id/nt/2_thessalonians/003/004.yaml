  naturalness: Susunan “Namun, dalam Tuhan kami yakin tentang kalian bahwa ...” dapat dipahami, tetapi kurang luwes. “Kami yakin dalam Tuhan bahwa ...” adalah bahasa Indonesia modern yang lebih alami dan tetap memelihara cakupan keyakinan tersebut terhadap para pembaca.
