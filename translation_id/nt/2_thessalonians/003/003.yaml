id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: id
  text: Namun, Tuhan itu setia. Ia akan meneguhkan kalian dan menjaga kalian dari si jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari kejahatan.” Ungkapan Yunani τοῦ πονηροῦ dapat dipahami sebagai maskulin (“si jahat”) atau netral (“kejahatan”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: setia
  rationale: Sebagai adjektiva predikatif, kata ini menyatakan bahwa Tuhan dapat diandalkan dan tetap setia, berlawanan dengan ketidakpercayaan manusia dalam konteks sebelumnya.
- source_word: δέ
  choice: Namun
  rationale: Konjungsi ini menandai pertentangan dengan pernyataan sebelumnya bahwa tidak semua orang memiliki iman; “Namun” menyampaikan daya adversatif itu secara alami.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος tanpa menentukan referennya secara lebih khusus daripada teks Yunani.
- source_word: στηρίξει
  choice: akan meneguhkan
  rationale: στηρίζω berarti membuat teguh atau kokoh. “Meneguhkan” mempertahankan nuansa pemantapan batin dan iman, sekaligus terdengar wajar dalam konteks pastoral.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini berbentuk jamak. “Kalian” menjelaskan bahwa seluruh jemaat disapa, bukan seorang individu.
- source_word: φυλάξει
  choice: akan menjaga
  rationale: φυλάσσω menyatakan tindakan menjaga atau melindungi dengan kewaspadaan; “menjaga” alami dalam bahasa Indonesia dan mempertahankan makna aktif tersebut.
- source_word: ἀπὸ
  choice: dari
  rationale: Menyatakan penjagaan dari atau dijauhkan dari bahaya yang disebut sesudahnya.
- source_word: τοῦ πονηροῦ
  choice: si jahat
  rationale: Bentuk Yunani ini dapat dipahami sebagai maskulin (“si jahat”) atau netral (“kejahatan”). Teks utama memakai pembacaan personal yang lazim dalam Perjanjian Baru, sedangkan ambiguitasnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Referen τοῦ πονηροῦ
  choice: si jahat
  alternative: kejahatan
  rationale: Bentuk genitif tunggal berartikel ini secara gramatikal ambigu antara maskulin dan netral. Pembacaan personal dipakai dalam teks utama tanpa menghilangkan pembacaan abstrak yang sah, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menampilkan bentuk jamak ὑμᾶς secara transparan. Kalimat relatif Yunani diungkapkan sebagai kalimat baru dengan “Ia” agar alami dan tidak mengaburkan bahwa Tuhan adalah pelaku kedua tindakan tersebut.
