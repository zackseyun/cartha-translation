  source_fidelity: 'Teks dengan tepat menyampaikan kontras δέ, kesetiaan Tuhan (πιστός), serta dua janji masa depan: meneguhkan (στηρίξει) dan menjaga (φυλάξει) jemaat. Pemecahan klausa relatif menjadi kalimat baru tidak mengubah Tuhan sebagai pelaku kedua tindakan. Bentuk jamak ὑμᾶς terwakili dengan jelas oleh “kalian.”'
