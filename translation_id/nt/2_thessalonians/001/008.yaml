  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: id
  text: dalam nyala api[a], sambil menjatuhkan pembalasan atas mereka yang tidak mengenal Allah dan atas mereka yang tidak menaati Injil Tuhan kita Yesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam api yang bernyala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: dalam nyala api
  rationale: Ungkapan ini menerjemahkan frasa datif secara alami dan tetap mempertahankan gambaran api yang menyala; secara sintaksis, frasa tersebut berkaitan dengan penyataan Tuhan pada ayat sebelumnya.
- source_word: διδόντος ἐκδίκησιν
  choice: ketika Ia menjatuhkan pembalasan
  rationale: Gabungan idiomatis ini secara harfiah berarti 'memberikan pembalasan', tetapi 'menjatuhkan pembalasan' lebih wajar dalam bahasa Indonesia dan mempertahankan nuansa tindakan penghakiman. Partisipelnya diterjemahkan dengan klausa temporal agar hubungannya dengan penyataan Tuhan tetap jelas.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: kepada mereka yang tidak mengenal Allah
  rationale: Bentuk partisip οἶδα memiliki makna kini, yaitu keadaan tidak mengenal Allah; 'mengenal' mempertahankan cakupan relasional dan kognitif tanpa mempersempitnya.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: kepada mereka yang tidak menaati
  rationale: Pilihan ini menyampaikan arti ketaatan atau kepatuhan tanpa menambahkan unsur penolakan sengaja yang tidak dinyatakan secara eksplisit.
- source_word: τῷ εὐαγγελίῳ
  choice: Injil
  rationale: '''Injil'' merupakan istilah baku, mudah dipahami, dan sesuai dengan pemakaian Paulus bagi kabar baik tentang Kristus.'
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Tuhan kita Yesus
  rationale: Susunan ini alami dalam bahasa Indonesia serta mempertahankan gelar κύριος, pronomina kepunyaan, dan nama Yesus.
theological_decisions:
- issue: Sifat ἐκδίκησις dalam penghakiman ilahi
  choice: pembalasan
  alternative: hukuman; ganjaran setimpal
  rationale: '''Pembalasan'' merupakan padanan langsung yang mempertahankan kerasnya bahasa sumber. Dalam konteks ini, kata tersebut menunjuk pada tindakan penghakiman ilahi, bukan luapan dendam manusia.'
- issue: Hubungan dua kelompok yang menerima pembalasan
  choice: mempertahankan dua frasa yang dihubungkan dengan 'dan'
  alternative: menyatukannya sebagai satu kelompok dengan dua ciri
  rationale: Teks Yunani tidak memastikan apakah yang dimaksud adalah dua kelompok berbeda atau satu kelompok yang digambarkan dengan dua cara. Terjemahan mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Ia' dipakai untuk memperjelas bahwa pelakunya adalah Tuhan Yesus yang disebut dalam konteks ayat sebelumnya. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
