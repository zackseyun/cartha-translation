id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: id
  text: Ini adalah bukti penghakiman Allah yang adil[a], supaya kamu dianggap layak bagi Kerajaan Allah[b]. Demi Kerajaan itu kamu juga sedang menderita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda” atau “bukti” penghakiman Allah yang adil.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk kamu dianggap layak” atau “dengan hasil bahwa kamu dianggap layak.” Konstruksi Yunaninya dapat menyatakan tujuan atau hasil.
    reason: alternative_reading
  - marker: c
    text: Atau “untuk kepentingan Kerajaan itu” atau “untuk Kerajaan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: bukti
  rationale: Kata ini menunjuk pada sesuatu yang memperlihatkan atau menandakan suatu kenyataan. “Bukti” wajar dalam bahasa Indonesia dan mempertahankan daya inferensialnya; subjek tersirat “Ini adalah” ditambahkan karena frasa Yunani ini bergantung pada ayat sebelumnya.
- source_word: δικαίας κρίσεως
  choice: penghakiman ... yang adil
  rationale: Ungkapan ini mempertahankan penilaian moral bahwa penghakiman Allah itu benar dan tidak berat sebelah, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: supaya kamu dianggap layak
  rationale: Konstruksi ini dapat menyatakan tujuan atau hasil. Bentuk pasif καταξιόω berarti dinilai atau dianggap layak, bukan dijadikan layak secara hakiki.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku, jelas, dan alami bagi frasa genitif tersebut serta mempertahankan istilah alkitabiahnya.
- source_word: ὑπὲρ ἧς
  choice: yang demi itu
  rationale: ὑπέρ dengan genitif dapat berarti “demi” atau “untuk kepentingan.” Pilihan ini menghubungkan penderitaan mereka dengan Kerajaan Allah tanpa menentukan hubungan itu secara lebih sempit daripada teks.
- source_word: καὶ πάσχετε
  choice: kamu juga sedang menderita
  rationale: Bentuk kini menggambarkan penderitaan yang sedang berlangsung, dan καί dipertahankan sebagai “juga.”
theological_decisions:
- issue: Hubungan penderitaan dengan kelayakan bagi Kerajaan Allah
  choice: Teks menyatakan bahwa keadaan yang digambarkan menjadi bukti penghakiman Allah yang adil, dengan tujuan atau hasil bahwa mereka dianggap layak bagi Kerajaan-Nya; terjemahan tidak menyatakan bahwa penderitaan menghasilkan jasa yang membeli jalan masuk ke dalam Kerajaan.
  alternative: Penderitaan mereka memperoleh atau menghasilkan kelayakan bagi Kerajaan Allah sebagai jasa.
  rationale: Bentuk pasif καταξιωθῆναι berarti “dianggap/dinilai layak,” sedangkan konstruksi εἰς τό dapat menyatakan tujuan atau hasil. Terjemahan mempertahankan hubungan yang kuat antara penderitaan, penghakiman, dan kelayakan tanpa menambahkan gagasan jasa yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Ini adalah” melengkapi fragmen tanpa verba dalam bahasa Yunani berdasarkan kaitannya dengan ayat sebelumnya. Huruf kapital pada “Kerajaan Allah” dipakai sebagai istilah teologis yang mapan.
