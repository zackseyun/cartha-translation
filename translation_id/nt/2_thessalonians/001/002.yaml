  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: id
  text: Anugerah dan damai sejahtera bagi kamu dari Allah Bapa dan Tuhan Yesus, Sang Mesias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Kristus” atau “Mesias”; di sini “Mesias” mempertahankan arti gelar tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam salam Paulus, χάρις merupakan berkat yang sekaligus lazim dan sarat makna teologis. “Anugerah” mempertahankan kedua sisi itu dalam bahasa Indonesia modern.
- source_word: ὑμῖν
  choice: bagi kamu
  rationale: Bentuk datif jamak ini menyatakan pihak penerima berkat. “Bagi kamu” alami dalam rumusan berkat dan tidak memaksakan pembedaan jumlah yang tidak selalu ditandai oleh kata “kamu” dalam bahasa Indonesia.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan ini menyampaikan bukan hanya ketiadaan konflik, melainkan juga keutuhan dan kesejahteraan yang mungkin bergema dari konsep salam Yahudi.
- source_word: ἀπὸ
  choice: dari
  rationale: Kata depan ini menandai sumber atau asal anugerah dan damai sejahtera.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: Teks Yunani cetakan tidak memuat ἡμῶν (“kita”), dan bahasa Indonesia dapat menyatakan gelar relasional ini secara alami sebagai “Allah Bapa” tanpa menambahkan kata milik.
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” mempertahankan daya gelar κύριος dan sesuai dengan pemakaian Perjanjian Baru yang mapan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός berasal dari gelar yang berarti Yang Diurapi atau Mesias. Bentuk “Sang Mesias” membuat fungsi gelarnya jelas dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah kata “kita” perlu ditambahkan sesudah “Bapa”
  choice: Allah Bapa
  alternative: Allah Bapa kita
  rationale: Berbeda dari lapisan konsultasi bahasa Inggris, bahasa Indonesia tidak memerlukan penentu posesif agar frasa ini wajar. Karena SBLGNT pada ayat ini tidak memuat ἡμῶν, terjemahan tidak menambahkan “kita”.
- issue: Penerjemahan gelar Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: “Sang Mesias” mempertahankan arti gelar Χριστός secara transparan. Bentuk tradisional “Kristus” tetap dicatat sebagai padanan alternatif tanpa mengubah identitas tokoh atau membuat klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Rumusan dibuat ringkas sesuai bentuk salam rasuli. “Allah Bapa” dipilih untuk mengikuti teks Yunani tanpa menambahkan “kita,” sedangkan “Sang Mesias” menegaskan bahwa Χριστός adalah gelar.
