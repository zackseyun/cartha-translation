id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: id
  text: supaya nama Tuhan kita Yesus dimuliakan di dalam kamu[a], dan kamu di dalam Dia, sesuai dengan anugerah Allah kita dan Tuhan Yesus Sang Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara kamu.” Kata depan Yunani yang dipakai dapat mengandung kedua nuansa itu dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Frasa terakhir dapat dipahami sebagai ungkapan yang menghubungkan erat “Allah kita” dengan “Tuhan Yesus Sang Mesias,” atau sebagai sebutan bagi “Allah kita” dan “Tuhan Yesus Sang Mesias” secara berbeda. Terjemahan mempertahankan susunan ringkas bahasa Yunani tanpa memaksakan salah satu pemahaman.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil yang diharapkan dari doa pada ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐνδοξασθῇ
  choice: dimuliakan
  rationale: Mempertahankan bentuk pasif dan bobot teologis akar kata δοξ-.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Mempertahankan ungkapan sumber, termasuk kemungkinan makna metonimis berupa pribadi, identitas, dan reputasinya.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Tuhan kita Yesus
  rationale: Susunan ini alami dalam bahasa Indonesia serta mempertahankan gelar κύριος dan unsur kepunyaan.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Secara formal mencerminkan ἐν dengan bentuk jamak; kemungkinan arti korporat 'di antara kamu' dicatat dalam catatan kaki.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: dan kamu di dalam Dia
  rationale: Mempertahankan kesejajaran timbal balik. αὐτῷ paling wajar merujuk kepada Tuhan Yesus, bukan kepada 'nama'.
- source_word: κατὰ τὴν χάριν
  choice: sesuai dengan anugerah
  rationale: κατά menyatakan tolok ukur atau kesesuaian; 'sesuai dengan' tidak mempersempitnya menjadi sarana semata.
- source_word: χάριν
  choice: anugerah
  rationale: Istilah Indonesia yang lazim dan bermartabat untuk χάρις dalam konteks Paulus.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: Allah kita dan Tuhan Yesus Sang Mesias
  rationale: Mempertahankan bentuk Yunani yang ringkas dan kaitan erat antara kedua sebutan tanpa menambahkan kata yang secara tegas memaksakan satu analisis referen.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi Yesus; 'Sang Mesias' menyampaikan makna gelar itu secara idiomatis.
- issue: Referen αὐτῷ
  choice: Dia, yaitu Tuhan Yesus
  alternative: itu, yaitu nama tersebut
  rationale: Bentuk maskulin dan pola pemuliaan timbal balik lebih kuat mendukung rujukan kepada Tuhan Yesus, selaras dengan bahasa Paulus tentang berada 'di dalam Dia'.
- issue: Daya sintaksis frasa genitif terakhir
  choice: Allah kita dan Tuhan Yesus Sang Mesias
  alternative: Allah kita dan Tuhan Yesus Sang Mesias sebagai dua referen yang dibedakan secara eksplisit
  rationale: Satu artikel sebelum θεοῦ dan rangkaian dengan καί menghasilkan hubungan sintaksis yang sangat erat. Terjemahan tidak menambahkan unsur penjelas yang akan menutup perdebatan apakah frasa itu menunjuk satu referen atau membedakan dua referen.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipertahankan untuk bentuk jamak ὑμεῖν/ὑμεῖς; kapitalisasi 'Dia' membantu menunjukkan rujukan kepada Tuhan Yesus. Ungkapan 'di dalam kamu' sengaja agak formal untuk menjaga kesejajaran dengan 'di dalam Dia'.
