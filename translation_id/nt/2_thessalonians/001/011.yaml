id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: id
  text: Untuk itulah kami juga selalu berdoa bagi kamu, supaya Allah kita menganggap kamu layak bagi panggilan itu[a] dan memenuhi setiap tekad untuk berbuat baik[b] serta perbuatan iman[c] dengan kuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menjadikan kamu layak bagi panggilan itu.” Kata kerja Yunani dapat berarti “menganggap layak” atau “menjadikan layak.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “setiap maksud yang baik” atau “setiap tekad untuk kebaikan.”'
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “perbuatan iman” dapat berarti perbuatan yang dihasilkan oleh iman; “iman” juga dapat dipahami sebagai “kesetiaan” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Untuk tujuan itu
  rationale: Mengacu kembali pada uraian sebelumnya dan mempertahankan arah atau tujuan yang terkandung dalam εἰς, dengan ungkapan Indonesia yang wajar.
- source_word: καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: juga kami selalu berdoa bagi kamu
  rationale: καί menyatakan tambahan, sedangkan bentuk kini dan πάντοτε menunjukkan kebiasaan yang terus berlangsung; περὶ ὑμῶν wajar diterjemahkan 'bagi kamu'.
- source_word: ἀξιώσῃ
  choice: menganggap kamu layak
  rationale: Mempertahankan makna evaluatif 'menilai/menganggap layak'; kemungkinan makna kausatif 'menjadikan layak' dicatat dalam catatan kaki.
- source_word: τῆς κλήσεως
  choice: bagi panggilan itu
  rationale: Bahasa Yunani tidak menyebut pemilik panggilan secara eksplisit. 'Itu' menandai panggilan yang sudah dikenal dalam konteks tanpa menambahkan 'Allah' atau 'kamu'.
- source_word: πληρώσῃ
  choice: memenuhi
  rationale: Menyampaikan tindakan Allah yang mewujudkan atau membawa hingga tuntas kedua objek berikutnya.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: setiap tekad untuk berbuat baik
  rationale: εὐδοκία dapat menunjuk pada maksud atau tekad, sementara ἀγαθωσύνης menyatakan kebaikan; frasa ini alami dalam bahasa Indonesia dan tidak mereduksinya menjadi perasaan senang semata.
- source_word: ἔργον πίστεως
  choice: setiap perbuatan yang lahir dari iman
  rationale: Menjadikan hubungan frasa dapat dipahami oleh pembaca Indonesia, sambil mencatat bahwa bentuk Yunani yang padat juga dapat berarti 'perbuatan iman' atau perbuatan yang bercirikan kesetiaan.
- source_word: ἐν δυνάμει
  choice: dengan kuasa-Nya
  rationale: Menunjukkan cara Allah memenuhi kedua hal yang dimohonkan. 'Nya' merupakan rujukan kontekstual kepada Allah, bukan unsur posesif eksplisit dalam frasa Yunani.
theological_decisions:
- issue: Makna ἀξιώσῃ dalam kaitannya dengan panggilan
  choice: menganggap kamu layak bagi panggilan itu
  alternative: menjadikan kamu layak bagi panggilan itu
  rationale: Kata kerja Yunani dapat bersifat evaluatif atau kausatif. Teks utama memakai makna evaluatif, sedangkan alternatif dicatat agar tindakan Allah dalam menjadikan layak tidak disingkirkan.
- issue: Hubungan genitif dalam ἔργον πίστεως
  choice: perbuatan yang lahir dari iman
  alternative: perbuatan iman; perbuatan yang menunjukkan kesetiaan
  rationale: Pilihan utama mengungkap kemungkinan bahwa iman menghasilkan perbuatan, tetapi catatan mempertahankan kepadatan dan ambiguitas frasa Yunani, termasuk kemungkinan nuansa 'kesetiaan'.
- issue: Cakupan ἐν δυνάμει
  choice: dengan kuasa-Nya memenuhi setiap tekad dan setiap perbuatan
  alternative: dengan kuasa memenuhi terutama unsur terakhir, yaitu perbuatan iman
  rationale: Posisi akhir frasa Yunani memungkinkan keterkaitan yang dekat dengan unsur terakhir, tetapi secara sintaksis juga wajar menerangkannya sebagai cara Allah memenuhi kedua objek.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan satu alur doa seperti sumber Yunani. 'Kamu' dipakai sebagai bentuk jamak kontekstual yang mudah dipahami; pilihan leksikal menghindari penambahan kepemilikan pada 'panggilan' dan mempertahankan alternatif teologis utama melalui catatan kaki.
