  to: Untuk itulah kami juga selalu berdoa bagi kamu, supaya Allah kita menganggap kamu layak bagi panggilan itu[a] dan memenuhi setiap tekad untuk berbuat baik[b] serta perbuatan iman[c] dengan kuasa.
