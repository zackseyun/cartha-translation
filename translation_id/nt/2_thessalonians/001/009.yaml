id: 2TH.1.9
reference: 2 Thessalonians 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: id
  text: Mereka akan menanggung hukuman berupa kebinasaan kekal[a], jauh dari hadirat Tuhan dan dari kemuliaan kekuatan-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kebinasaan yang datang dari hadirat Tuhan dan dari kemuliaan kekuatan-Nya.” Kata depan Yunani yang dipakai dapat dipahami sebagai pemisahan (“jauh dari”) atau sebagai sumber/asal (“dari”).
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Merujuk kembali kepada orang-orang yang tidak mengenal Allah dan tidak menaati Injil pada ayat sebelumnya. Bentuk ini wajar dalam bahasa Indonesia dan tidak melebih-lebihkan nuansa kualitatif pronomina Yunani.
- source_word: δίκην τίσουσιν
  choice: akan menanggung hukuman
  rationale: Ungkapan ini berarti menerima atau menjalani hukuman berdasarkan keputusan pengadilan. 'Menanggung hukuman' mempertahankan nuansa yudisial sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ὄλεθρον αἰώνιον
  choice: kebinasaan kekal
  rationale: '''Kebinasaan'' menyampaikan beratnya ὄλεθρος tanpa menentukan secara tersirat bagaimana persisnya hukuman terakhir berlangsung; ''kekal'' paling sesuai untuk αἰώνιος dalam konteks eskatologis ini.'
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: jauh dari hadirat Tuhan
  rationale: Dalam bacaan utama, ἀπό dipahami sebagai pemisahan atau pengucilan. πρόσωπον secara harfiah berarti 'wajah', tetapi dalam ungkapan ini 'hadirat' merupakan padanan Indonesia yang idiomatis.
- source_word: ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: dari kemuliaan kekuatan-Nya
  rationale: '''Kemuliaan'' mempertahankan δόξα, sedangkan ''kekuatan'' menyampaikan ἰσχύς dengan jelas. Genitif dipertahankan sebagai kemuliaan yang menjadi milik atau menyatakan kekuatan Tuhan.'
theological_decisions:
- issue: Makna ἀπό dalam kaitannya dengan penghakiman terakhir
  choice: 'Pemisahan atau pengucilan: ''jauh dari hadirat Tuhan'''
  alternative: 'Sumber atau asal: kebinasaan yang datang dari hadirat Tuhan dan dari kemuliaan kekuatan-Nya'
  rationale: ἀπό dapat menandai pemisahan maupun sumber. Bacaan pemisahan kuat dalam konteks hukuman pengadilan dan menghasilkan bahasa Indonesia yang alami, tetapi kemungkinan makna sumber tetap dicatat karena signifikan dan dapat dipertanggungjawabkan secara gramatikal.
- issue: Implikasi ungkapan 'kebinasaan kekal'
  choice: Menerjemahkan ungkapan itu tanpa menentukan hakikat persis hukuman terakhir
  alternative: Menafsirkannya secara khusus sebagai pelenyapan atau sebagai siksaan sadar yang kekal
  rationale: Frasa Yunani menyatakan hukuman yang kekal, tetapi ayat ini sendiri tidak menyelesaikan seluruh perdebatan tentang bentuk persis hukuman terakhir. Terjemahan tidak memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Hadirat' dipilih sebagai ungkapan religius yang masih umum dan alami; kapitalisasi '-Nya' mengikuti kebiasaan penulisan rujukan kepada Tuhan dalam bahasa Indonesia.
