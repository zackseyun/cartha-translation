base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: id
  text: dan kepada kamu yang sedang mengalami penindasan, kelegaan bersama kami pada saat penyataan Tuhan Yesus dari surga bersama para malaikat kuasa-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara idiomatis, “bersama para malaikat-Nya yang penuh kuasa.” Frasa Yunani ini juga dapat menunjuk pada para malaikat yang berkaitan dengan atau menjalankan kuasa-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θλιβομένοις
  choice: yang sedang ditindas
  rationale: Partisipel kini pasif menunjukkan orang-orang yang tengah mengalami tekanan atau penindasan. Ungkapan ini mempertahankan unsur pasif serta sifat penderitaan yang sedang berlangsung.
- source_word: ἄνεσιν
  choice: kelegaan
  rationale: Kata ini menunjuk pada terbebasnya seseorang dari tekanan. “Kelegaan” menyatakan kontras dengan penindasan tanpa membatasinya pada ketenangan batin saja.
- source_word: μεθ’ ἡμῶν
  choice: bersama kami
  rationale: Menerjemahkan hubungan penyertaan secara langsung dan mempertahankan bahwa Paulus serta rekan-rekannya ikut menerima kelegaan yang sama.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: pada waktu ... dinyatakan
  rationale: Preposisi ἐν bersama nomina peristiwa di sini memiliki fungsi temporal. Bentuk verbal pasif menghasilkan bahasa Indonesia yang lebih alami, sambil tetap menyampaikan makna penyingkapan atau penyataan.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Mempertahankan κύριος sebagai gelar “Tuhan” sesuai pemakaian Perjanjian Baru.
- source_word: ἀπ’ οὐρανοῦ
  choice: dari surga
  rationale: ἀπό menyatakan asal atau sumber; “dari surga” merupakan padanan Indonesia yang langsung dan alami.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: bersama para malaikat-Nya yang penuh kuasa
  rationale: Padanan ini mengungkapkan pembacaan kualitatif yang paling alami dalam bahasa Indonesia, yakni para malaikat yang perkasa, tanpa menghilangkan rujukan kepada kuasa-Nya. Susunan Yunani yang lebih harfiah dan kemungkinan nuansanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan sintaksis dalam frasa ἀγγέλων δυνάμεως αὐτοῦ
  choice: bersama para malaikat-Nya yang penuh kuasa
  alternative: bersama para malaikat kuasa-Nya
  rationale: Konstruksi genitif Yunani bersifat padat dan dapat menggambarkan para malaikat sebagai penuh kuasa atau sebagai malaikat yang berkaitan dengan kuasa Tuhan. Teks utama memakai ungkapan Indonesia yang wajar, sedangkan catatan kaki mempertahankan bentuk dan ambiguitas sumber.
- issue: Daya temporal ἐν τῇ ἀποκαλύψει
  choice: pada waktu Tuhan Yesus dinyatakan
  alternative: dalam penyataan Tuhan Yesus
  rationale: Konteks menghubungkan kelegaan yang dijanjikan dengan peristiwa penyingkapan Yesus. Bentuk temporal-verbal menyampaikan hubungan itu secara jelas tanpa menentukan lebih jauh bagaimana penyataan tersebut berlangsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Karena ayat ini melanjutkan struktur kalimat dari ayat sebelumnya, bentuk fragmennya dipertahankan. “Sedang ditindas” menonjolkan tindakan yang dialami dan masih berlangsung; “kelegaan” mempertahankan kontras dengan tekanan.
