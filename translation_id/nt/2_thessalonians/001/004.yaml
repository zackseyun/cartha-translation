id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: id
  text: Akibatnya, kami sendiri bermegah tentang kalian di antara jemaat-jemaat Allah karena ketekunan dan iman[a] kalian di tengah segala penganiayaan dan penderitaan yang sedang kalian tanggung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan”; kata Yunani πίστις dapat berarti iman atau kesetiaan yang teguh, khususnya dalam konteks penderitaan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Akibatnya
  rationale: Menandai hasil dari pernyataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: αὐτοὺς ἡμᾶς
  choice: kami sendiri
  rationale: Mempertahankan penekanan pada Paulus dan rekan-rekannya.
- source_word: ἐν ὑμῖν
  choice: tentang kalian
  rationale: Dalam konstruksi dengan verba bermegah, frasa ini menunjuk pada pihak yang menjadi dasar atau pokok kebanggaan.
- source_word: ἐγκαυχᾶσθαι
  choice: bermegah
  rationale: Mempertahankan kekuatan retoris verba Yunani tanpa melunakkannya menjadi sekadar merasa bangga.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: di antara jemaat-jemaat Allah
  rationale: Mengungkapkan lingkungan komunitas tempat mereka bermegah dan mempertahankan bentuk jamak.
- source_word: ὑπὲρ
  choice: karena
  rationale: Menyatakan dasar atau alasan mereka bermegah.
- source_word: ὑπομονῆς
  choice: ketekunan
  rationale: Menggambarkan daya tahan yang tabah di bawah tekanan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: πίστεως
  choice: iman
  rationale: Padanan utama yang mempertahankan makna kepercayaan; kemungkinan nuansa kesetiaan dicatat dalam catatan kaki.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: di tengah segala penganiayaan dan penderitaan
  rationale: Menunjukkan keadaan tempat ketekunan dan iman itu nyata, sambil membedakan penindasan bermusuhan dari tekanan atau kesusahan yang lebih luas.
- source_word: διωγμοῖς
  choice: penganiayaan
  rationale: Padanan baku dan jelas untuk perlakuan bermusuhan karena kesetiaan seseorang.
- source_word: θλίψεσιν
  choice: penderitaan
  rationale: Menyampaikan tekanan dan kesusahan berat dengan bahasa yang mudah dipahami.
- source_word: αἷς ἀνέχεσθε
  choice: yang sedang kalian tanggung
  rationale: Mempertahankan aspek berlangsung dari bentuk kini dan makna bertahan menanggung kesulitan.
theological_decisions:
- issue: Makna πίστις dalam konteks penderitaan
  choice: iman
  alternative: kesetiaan
  rationale: πίστις dapat menunjuk pada iman maupun kesetiaan yang teguh. Teks utama memakai padanan umum 'iman', sementara nuansa 'kesetiaan' dipertahankan dalam catatan kaki agar ketegangan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa penerima surat bersifat jamak; 'jemaat-jemaat' mempertahankan bentuk plural sumber.
