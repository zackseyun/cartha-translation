  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan isi Yunani: ὥστε sebagai hasil (''Akibatnya''), penekanan αὐτοὺς ἡμᾶς (''kami sendiri''), objek kebanggaan, lingkungan ''di antara jemaat-jemaat Allah'', serta dasar kebanggaan berupa ketekunan dan πίστις dalam penganiayaan dan penderitaan yang terus berlangsung. ''Yang sedang kalian tanggung'' secara baik menyampaikan bentuk kini ἀνέχεσθε.'
