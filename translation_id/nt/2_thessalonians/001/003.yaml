id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: id
  text: Kami wajib selalu mengucap syukur kepada Allah karena kalian, Saudara-saudara[a], sebagaimana sepatutnya, sebab iman kalian bertumbuh dengan luar biasa[b], dan kasih setiap orang di antara kalian kepada satu sama lain semakin besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara”; kata Yunani ini dapat dipakai sebagai sapaan yang mencakup seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesetiaan kalian bertumbuh dengan luar biasa”; kata Yunani yang diterjemahkan “iman” juga dapat berarti “kepercayaan” atau “kesetiaan”.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν
  choice: mengucap syukur
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk tindakan menyatakan terima kasih kepada Allah.
- source_word: ὀφείλομεν
  choice: kami wajib
  rationale: Menyampaikan kewajiban moral yang terkandung dalam verba tanpa mengubahnya menjadi sekadar perasaan atau kebiasaan.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan temporal langsung dan alami.
- source_word: περὶ ὑμῶν
  choice: karena kamu
  rationale: Dalam konteks ini jemaat beserta pertumbuhan mereka merupakan alasan pengucapan syukur; 'karena kamu' alami dalam bahasa Indonesia dan selaras dengan klausa sebab berikutnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak yang wajar dan bermartabat; dalam pemakaian jemaat dapat mencakup seluruh komunitas orang percaya, sebagaimana dijelaskan dalam catatan kaki.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: sebagaimana sepatutnya
  rationale: Mempertahankan gagasan kepantasan atau kelayakan tindakan tersebut dengan ungkapan Indonesia yang alami.
- source_word: ὅτι
  choice: sebab
  rationale: Menandai hubungan kausal secara jelas.
- source_word: ὑπεραυξάνει
  choice: bertumbuh dengan luar biasa
  rationale: Menangkap unsur intensif verba majemuk, bukan hanya pertumbuhan biasa.
- source_word: ἡ πίστις ὑμῶν
  choice: imanmu
  rationale: Iman merupakan padanan utama πίστις dalam konteks pertumbuhan rohani jemaat; bentuk '-mu' merujuk kepada jemaat secara kolektif.
- source_word: πλεονάζει
  choice: semakin besar
  rationale: Mengungkapkan peningkatan yang berkelanjutan secara alami dan sesuai bagi nomina 'kasih'.
- source_word: ἡ ἀγάπη
  choice: kasih
  rationale: Padanan Alkitabiah Indonesia yang tetap hidup dan jelas untuk kasih yang terarah kepada sesama.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: kasih setiap orang di antara kamu kepada satu sama lain
  rationale: Mempertahankan penekanan distributif—setiap anggota—serta arah timbal balik kasih, tanpa meniru pleonasme Yunani secara kaku.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: Konteks paling wajar menunjuk pada iman jemaat yang bertumbuh, tetapi rentang makna Yunani memungkinkan nuansa kesetiaan atau kepercayaan; kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani secara gramatikal adalah maskulin jamak, tetapi dalam sapaan kepada jemaat dapat mencakup laki-laki dan perempuan. Terjemahan utama mempertahankan bentuk sapaan konvensional Indonesia dan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern, hangat, dan bermartabat. Bentuk 'kami' dipakai bagi para pengirim surat dan 'kamu/-mu' bagi jemaat sebagai kelompok. Susunan kalimat mempertahankan alur pengucapan syukur, kepantasan, lalu dua alasan yang sejajar.
