source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: id
  text: Paulus, Silwanus, dan Timotius, kepada jemaat orang-orang Tesalonika di dalam Allah, Bapa kita, dan Tuhan Yesus Sang Mesias:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhan Yesus Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau, dalam bentuk yang lebih tradisional, “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: Σιλουανὸς
  choice: Silwanus
  rationale: Mentransliterasikan bentuk Yunani Σιλουανός secara langsung dan tidak menyelaraskannya dengan bentuk singkat Silas dalam Kisah Para Rasul.
- source_word: Τιμόθεος
  choice: Timotius
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: Dalam surat-surat Paulus, kata ini menunjuk kepada persekutuan umat percaya; 'jemaat' merupakan padanan Indonesia yang alami dan mempertahankan pengertian komunalnya.
- source_word: Θεσσαλονικέων
  choice: orang-orang Tesalonika
  rationale: Genitif jamak ini merujuk kepada penduduk atau komunitas Tesalonika, bukan semata-mata kepada lokasi kotanya.
- source_word: ἐν
  choice: yang berada di dalam
  rationale: Mempertahankan ungkapan relasional ἐν dan membiarkan nuansa lingkup, persatuan, atau keberakaran tetap terbuka tanpa menafsirkannya sebagai sekadar kepunyaan.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Allah, Bapa kita
  rationale: Mempertahankan kata ganti milik ἡμῶν dan menjelaskan hubungan aposisional antara Allah dan Bapa secara alami dalam bahasa Indonesia.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Padanan baku untuk gelar κύριος ketika dikenakan kepada Yesus.
- source_word: Χριστῷ
  choice: Sang Mesias
  rationale: Menerjemahkan gelar Χριστός, bukan memperlakukannya semata-mata sebagai nama diri; 'Sang' menandai fungsi gelarnya secara alami dan bermartabat.
theological_decisions:
- issue: Penerjemahan Χριστῷ dalam rangkaian Ἰησοῦ Χριστῷ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός masih memiliki daya sebagai gelar bagi Yesus. 'Sang Mesias' menyatakan fungsi gelar itu, sedangkan bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Hubungan yang dinyatakan oleh ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: yang berada di dalam Allah, Bapa kita, dan Tuhan Yesus, Sang Mesias
  alternative: yang menjadi milik Allah, Bapa kita, dan Tuhan Yesus, Sang Mesias
  rationale: Ungkapan 'di dalam' mempertahankan kepadatan teologis ἐν—yang dapat menyiratkan lingkup, persatuan, atau dasar keberadaan—tanpa mempersempitnya menjadi hubungan kepemilikan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam surat yang resmi dan bermartabat. Tanda koma dipakai pada 'Allah, Bapa kita' dan 'Yesus, Sang Mesias' untuk memperjelas gelar atau aposisi tanpa mengubah hubungan sintaksis sumber.
