translation:
  language: id
  text: karena memang adil bagi Allah untuk menimpakan kesengsaraan kepada orang-orang yang menindas kalian[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika memang adil bagi Allah untuk menimpakan kesengsaraan kepada orang-orang yang menindas kalian.”
    reason: Mempertahankan kemungkinan nuansa kondisional εἴπερ.
lexical_decisions:
- source_word: εἴπερ
  choice: karena memang
  rationale: Dalam konteks ini, εἴπερ menyatakan dasar yang dianggap benar, bukan syarat yang diragukan. 'Karena memang' mempertahankan daya penegasan dan hubungan logisnya dengan kalimat sekitar.
- source_word: δίκαιον παρὰ θεῷ
  choice: adil bagi Allah
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut adil menurut penilaian dan sifat Allah. 'Adil bagi Allah' wajar dalam bahasa Indonesia dan tidak mengesankan bahwa ada standar di luar Allah yang menghakimi-Nya.
- source_word: ἀνταποδοῦναι
  choice: membalas
  rationale: Kata ini menunjuk pada pemberian kembali yang setimpal. 'Membalas' jelas dan alami dalam konteks penghakiman ilahi tanpa nada percakapan dari 'membayar kembali'.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: orang-orang yang menindas kalian
  rationale: θλίβω menggambarkan pemberian tekanan yang mendatangkan penderitaan. 'Menindas' menyampaikan beratnya tindakan itu dan memungkinkan hubungan verbal dengan θλῖψιν dipertahankan.
- source_word: θλῖψιν
  choice: penindasan
  rationale: 'Pilihan ini mempertahankan permainan akar kata dengan θλίβουσιν: mereka yang menindas akan dibalas dengan penindasan. Catatan kaki menyediakan alternatif ''kesusahan'', yang lebih idiomatis tetapi mengaburkan hubungan tersebut.'
- source_word: ὑμᾶς
  choice: kalian
  rationale: Bentuk Yunani ini jamak. 'Kalian' menyatakannya secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat dan waktu pembalasan ilahi
  choice: Ayat ini menyatakan bahwa Allah secara adil membalas para penindas dengan penindasan, tanpa menentukan sepenuhnya waktu atau cara pelaksanaannya dalam klausa ini.
  alternative: Pembalasan tersebut secara eksklusif terjadi pada akhir zaman, atau mencakup hukuman dalam sejarah sekarang dan penghakiman terakhir.
  rationale: Teks Yunani menegaskan keadilan pembalasan Allah, tetapi klausa ini sendiri tidak merinci seluruh waktu dan caranya. Terjemahan dibiarkan umum agar tidak memasukkan skema doktrinal yang lebih sempit.
- issue: Nuansa εἴπερ
  choice: 'Dipahami sebagai dasar yang ditegaskan: ''karena memang''.'
  alternative: 'Dipertahankan sebagai syarat yang lebih harfiah: ''jika memang''.'
  rationale: Dalam alur retoris ini Paulus memperlakukan keadilan Allah sebagai kenyataan yang diasumsikan. Namun, bentuk kondisional Yunani tetap dicatat agar ambiguitas gramatikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk orang kedua jamak. Pengulangan 'menindas—penindasan' sengaja mempertahankan hubungan leksikal Yunani θλίβουσιν—θλῖψιν, sementara catatan kaki memberikan bentuk yang lebih idiomatis.
