reference: 2 Thessalonians 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: id
  text: pada hari itu, ketika Ia datang untuk dimuliakan di antara orang-orang kudus-Nya[a] dan dikagumi di antara semua orang yang telah percaya, sebab kesaksian kami kepada kamu telah dipercaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam orang-orang kudus-Nya.” Kata depan Yunani dapat berarti bahwa Ia dimuliakan di antara umat-Nya yang kudus atau bahwa kemuliaan-Nya dinyatakan di dalam diri mereka.
    reason: lexical_alternative
  - marker: b
    text: 'Susunan lain: “ketika Ia datang untuk dimuliakan di antara orang-orang kudus-Nya dan dikagumi di antara semua orang yang telah percaya—sebab kesaksian kami kepada kamu telah dipercaya—pada hari itu.”'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: ketika Ia datang
  rationale: ὅταν dengan aoristus subjungtif menunjuk pada peristiwa tertentu pada masa depan; bentuk ini alami dalam bahasa Indonesia dan tidak memerlukan penanda kala eksplisit.
- source_word: ἐνδοξασθῆναι
  choice: untuk dimuliakan
  rationale: Infinitif pasif ini menyatakan tujuan atau hasil kedatangan-Nya dan mempertahankan gagasan kemuliaan ilahi.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: di antara orang-orang kudus-Nya
  rationale: ἐν dapat berarti 'di antara' atau 'di dalam'. Pilihan utama menampilkan lingkungan umat kudus secara wajar, sedangkan kemungkinan 'di dalam' dipertahankan dalam catatan kaki.
- source_word: θαυμασθῆναι
  choice: dikagumi
  rationale: Bentuk pasif ini sejajar dengan ἐνδοξασθῆναι dan menyampaikan rasa takjub serta kekaguman terhadap Kristus.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: oleh semua orang yang telah percaya
  rationale: Dalam konstruksi pasif θαυμασθῆναι, ἐν dapat menyatakan kalangan atau pihak yang mengagumi. 'Oleh' menghasilkan bahasa Indonesia yang alami, sementara partisip aoristus tetap diterjemahkan secara verbal.
- source_word: ὅτι
  choice: sebab
  rationale: 'Kata ini paling wajar dipahami secara kausal: jemaat termasuk di antara mereka yang percaya karena kesaksian para rasul telah mereka percayai.'
- source_word: ἐπιστεύθη
  choice: telah dipercaya
  rationale: Pasif πιστεύω dengan 'kesaksian' sebagai subjek berarti bahwa kesaksian itu dipercaya; bentuk ini juga menjaga kaitan leksikal dengan 'telah percaya'.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: kesaksian kami
  rationale: Ungkapan ini menunjuk pada kesaksian atau pemberitaan para rasul dan diterjemahkan secara langsung.
- source_word: ἐφ’ ὑμᾶς
  choice: kepada kamu
  rationale: Dalam konteks penyampaian kesaksian, frasa ini paling mungkin menunjukkan arah kepada para penerima, yaitu jemaat Tesalonika.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: pada hari itu
  rationale: Ungkapan waktu eskatologis ini ditempatkan di awal agar hubungannya dengan kedatangan Kristus jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti dan acuan 'orang-orang kudus-Nya' dalam konteks eskatologis
  choice: '''Di antara orang-orang kudus-Nya'', dengan acuan utama kepada umat Kristus'
  alternative: '''Di dalam orang-orang kudus-Nya'', yang menekankan bahwa kemuliaan-Nya tampak dalam diri mereka; atau ''makhluk-makhluk kudus-Nya'' dengan acuan surgawi yang lebih luas'
  rationale: Kesejajaran dengan 'semua orang yang telah percaya' mendukung acuan kepada umat beriman. Namun, nilai lokatif atau instrumental ἐν tidak dipastikan secara mutlak, sehingga alternatif 'di dalam' dicatat.
- issue: Hubungan antara πιστεύσασιν dan ἐπιστεύθη
  choice: Memakai bahasa 'percaya/dipercaya' pada kedua bentuk
  alternative: Menerjemahkan dengan 'beriman' dan 'diterima dengan iman'
  rationale: Pengulangan akar leksikal dipertahankan tanpa memasukkan penafsiran doktrinal tambahan; konteksnya adalah kepercayaan kepada kesaksian apostolik.
- issue: Kedudukan frasa 'pada hari itu'
  choice: Diletakkan di awal untuk membingkai seluruh peristiwa
  alternative: Diletakkan di akhir sesuai urutan kata Yunani
  rationale: Kedua susunan secara sintaksis mungkin. Penempatan awal lebih jelas dalam bahasa Indonesia, sementara susunan akhir dipertahankan sebagai alternatif tekstual-stilistis dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Ia' dipakai untuk acuan kepada Kristus, 'orang-orang kudus' mempertahankan istilah Paulus yang lazim, dan struktur kalimat dibuat lancar tanpa menghilangkan ambiguitas ἐν atau kemungkinan penempatan frasa waktu.
