id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: id
  text: Kiranya Tuhan kita Yesus Sang Mesias sendiri dan Allah, Bapa kita, yang telah mengasihi kita dan telah memberi kita penghiburan[a] kekal serta pengharapan yang baik melalui anugerah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dorongan” atau “penguatan.”
    reason: παράκλησις memiliki rentang makna penghiburan, dorongan, dan penguatan; konteks tidak meniadakan alternatif tersebut.
lexical_decisions:
- source_word: Αὐτὸς
  choice: sendiri
  rationale: Pemakaian intensif αὐτός menekankan tindakan pribadi subjek dalam doa permohonan; posisi “sendiri” setelah gelar Yesus merupakan susunan yang paling wajar dalam bahasa Indonesia sekaligus mempertahankan bentuk tunggal teks Yunani.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ menandai peralihan ringan menuju doa. Dalam bahasa Indonesia, peralihan ini sudah cukup terasa dari bentuk “Kiranya”; menambahkan “sekarang” akan memberi kesan waktu yang tidak terdapat dalam sumber.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi κύριος sebagai gelar kristologis.
- source_word: Ἰησοῦς Χριστὸς
  choice: Yesus Sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar. “Sang Mesias” menyampaikan maknanya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Allah Bapa kita
  rationale: Menyampaikan hubungan aposisional antara Allah dan Bapa secara ringkas tanpa mengubahnya menjadi dua sebutan terpisah.
- source_word: ὁ ἀγαπήσας
  choice: yang telah mengasihi
  rationale: Partisip aoris diungkapkan sebagai klausa relatif yang alami. “Telah” menunjukkan tindakan yang sudah nyata tanpa menentukan waktunya secara berlebihan.
- source_word: δοὺς
  choice: memberi
  rationale: Partisip aoris yang sejajar dengan ἀγαπήσας diterjemahkan dengan verba sederhana dan langsung.
- source_word: παράκλησιν
  choice: penghiburan
  rationale: παράκλησις dapat berarti penghiburan, dorongan, atau penguatan. “Penghiburan” alami dalam konteks penderitaan jemaat, sedangkan kemungkinan makna lainnya dipertahankan dalam catatan kaki.
- source_word: αἰωνίαν
  choice: kekal
  rationale: Padanan Indonesia yang baku dan ringkas untuk αἰώνιος, dengan penekanan pada sifat yang terus berlangsung.
- source_word: ἐλπίδα ἀγαθὴν
  choice: pengharapan yang baik
  rationale: Mempertahankan baik nomina maupun sifat dalam ungkapan Indonesia yang jelas dan tidak memperluas maknanya.
- source_word: ἐν χάριτι
  choice: oleh anugerah
  rationale: 'ἐν dipahami secara instrumental atau kausal: pemberian itu berlangsung berdasarkan atau melalui anugerah. “Oleh anugerah” ringkas dan mempertahankan keterkaitannya dengan tindakan memberi.'
theological_decisions:
- issue: Kesesuaian partisip tunggal ὁ ἀγαπήσας dan δοὺς dengan subjek majemuk “Tuhan kita Yesus Sang Mesias” dan “Allah Bapa kita”
  choice: Mempertahankan satu klausa relatif, “yang telah mengasihi kita dan ... memberi kita,” sesudah kedua subjek.
  alternative: Membatasi klausa tersebut secara tegas hanya kepada Allah Bapa, atau mengembangkannya agar secara eksplisit merujuk kepada kedua pribadi.
  rationale: Teks Yunani mengoordinasikan kedua subjek lalu memakai bentuk partisip tunggal. Bahasa Indonesia tidak menandai jumlah pada “yang”, sehingga susunan sumber dapat dipertahankan tanpa memaksakan salah satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk “Kiranya” menandai doa permohonan yang berlanjut ke ayat berikutnya. Koma penutup dipertahankan karena ayat ini merupakan bagian awal kalimat yang diteruskan dalam ayat 17.
