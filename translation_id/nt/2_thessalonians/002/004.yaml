id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: id
  text: dialah yang menentang dan meninggikan dirinya di atas segala yang disebut allah atau yang disembah, sehingga ia duduk di Bait Allah[a] dan menunjukkan dirinya sebagai Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di ruang kudus Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menunjukkan bahwa dirinya adalah seorang allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: dialah yang menentang
  rationale: Partisipel dengan artikel berfungsi sebagai sebutan substantival; terjemahan ini mempertahankan tindakan menentang tanpa menjadikannya gelar teknis.
- source_word: ὑπεραιρόμενος
  choice: meninggikan dirinya
  rationale: Bentuk ini menyatakan peninggian diri; ungkapan Indonesia ini alami dan mempertahankan daya refleksifnya.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: di atas segala yang disebut allah
  rationale: ἐπί dengan akusatif dalam hubungan dengan peninggian diri menyatakan keunggulan atas, sedangkan λεγόμενον tidak mengakui bahwa semua yang dinamai demikian sungguh ilahi.
- source_word: ἢ σέβασμα
  choice: atau yang disembah
  rationale: σέβασμα mencakup apa pun yang menjadi sasaran penghormatan religius, bukan hanya suatu dewa; bentuk ini jelas dan luas dalam bahasa Indonesia.
- source_word: ὥστε αὐτὸν ... καθίσαι
  choice: sehingga ia duduk
  rationale: Konstruksi ὥστε dengan infinitif menyatakan hasil; 'sehingga' mempertahankan hubungan tersebut secara alami.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: di Bait Allah
  rationale: Walaupun εἰς secara harfiah mengarah ke 'ke dalam', bersama καθίσαι konstruksi ini secara idiomatis menyatakan tempat ia mengambil posisi. 'Bait Allah' merupakan ungkapan Indonesia yang alami bagi ναὸς τοῦ θεοῦ.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: menunjukkan dirinya
  rationale: Partisipel ini menyatakan tindakan memperlihatkan atau menampilkan diri, tanpa harus mengandaikan suatu proklamasi verbal resmi.
- source_word: ὅτι ἔστιν θεός
  choice: sebagai Allah
  rationale: Klausa ini menyatakan identitas yang ditampilkan oleh tokoh tersebut. 'Allah' menangkap puncak klaim penghujatan dalam konteks tanpa menegaskan bahwa klaim itu benar.
theological_decisions:
- issue: Apakah θεός pada akhir ayat diterjemahkan sebagai 'Allah' atau 'seorang allah'
  choice: Allah
  alternative: seorang allah
  rationale: Tokoh itu duduk di Bait Allah dan menampilkan diri dengan klaim ilahi tertinggi. Namun, karena θεός tidak memakai artikel, kemungkinan 'seorang allah' tetap dicatat agar ambiguitas gramatikal tidak dihapus.
- issue: Apakah ναός diterjemahkan sebagai 'Bait' atau lebih khusus sebagai 'ruang kudus'
  choice: Bait Allah
  alternative: ruang kudus Allah
  rationale: ναός dapat menunjuk secara khusus pada tempat suci bagian dalam, tetapi 'Bait Allah' lebih alami dan tidak terlalu mempersempit perdebatan apakah gambaran ini harfiah atau metaforis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Bait Allah' mempertahankan register Alkitabiah yang lazim tanpa menentukan apakah tempat itu harus dipahami secara harfiah. Semua alternatif yang nyata dan relevan ditandai dalam teks utama.
