  source_fidelity: 'Terjemahan setia pada konstruksi Yunani: tokoh itu menentang dan meninggikan diri di atas setiap yang disebut allah atau objek pemujaan, lalu duduk di Bait Allah sambil menampilkan dirinya sebagai Allah. Hubungan hasil dalam ὥστε tersampaikan dengan baik melalui “sehingga.”'
