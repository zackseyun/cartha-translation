translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Pronomina “aku/kamu” mengikuti nada surat pribadi dan sapaan kepada komunitas; “kamu” dapat mencakup jamak secara kontekstual. Susunan kalimat mempertahankan pertanyaan retoris serta nuansa tindakan berkelanjutan pada verba imperfek.
