  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: id
  text: Tidakkah kamu ingat bahwa ketika aku masih bersama kamu, aku terus mengatakan hal-hal ini kepadamu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: ingat
  rationale: Kata kerja ini menanyakan apakah para pembaca masih mengingat pengajaran sebelumnya; “ingat” adalah padanan Indonesia modern yang paling alami dalam pertanyaan retoris ini.
- source_word: ἔτι
  choice: masih
  rationale: 'Bersama partisip ὢν, kata ini menunjukkan keadaan yang masih berlangsung pada masa lampau: Paulus masih berada bersama mereka.'
- source_word: ὢν πρὸς ὑμᾶς
  choice: ketika aku masih bersama kamu
  rationale: Ungkapan ini menyatakan kehadiran pribadi Paulus di tengah para pembaca; bentuk temporal eksplisit menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak penunjuk merujuk pada berbagai perkara yang sedang dibicarakan dan tetap dipertahankan dalam terjemahan.
- source_word: ἔλεγον
  choice: aku terus mengatakan
  rationale: Bentuk imperfek menunjukkan tindakan lampau yang berlangsung atau berulang. “Terus mengatakan” menyampaikan aspek tersebut secara alami tanpa menyiratkan secara pasti berapa kali hal itu dilakukan.
- source_word: οὐ ... ὅτι
  choice: Tidakkah kamu ingat bahwa ...?
  rationale: Susunan ini merupakan pertanyaan retoris yang memperkenalkan isi yang seharusnya diingat; “bahwa” sesuai sebagai penanda isi dalam bahasa Indonesia.
