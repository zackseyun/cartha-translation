id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: id
  text: Namun, kami wajib selalu mengucap syukur kepada Allah karena kamu, saudara-saudara[a] yang dikasihi Tuhan, sebab Allah telah memilih kamu sebagai buah sulung[b] untuk keselamatan melalui pengudusan oleh Roh[c] dan iman kepada kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudara” berbentuk jamak maskulin, tetapi sapaan ini dapat mencakup seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: cultural_note
  - marker: b
    text: Sejumlah naskah berbunyi, “sejak semula untuk keselamatan.” Teks utama mengikuti bacaan “sebagai buah sulung” (ἀπαρχήν); bacaan lain ialah ἀπ’ ἀρχῆς (“sejak semula”).
    reason: textual_variant
  - marker: c
    text: 'Atau: “melalui pengudusan roh.” Bentuk Yunani dapat merujuk kepada Roh Kudus atau kepada roh manusia; konteks lebih mendukung Roh Kudus.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Namun, kami
  rationale: δέ mengontraskan kelompok ini dengan orang-orang yang binasa pada konteks sebelumnya, sedangkan ἡμεῖς yang eksplisit memberi penekanan pada “kami”.
- source_word: ὀφείλομεν
  choice: wajib
  rationale: Menyatakan kewajiban moral atau kepatutan yang kuat dalam rumusan ucapan syukur Paulus, tanpa mengubahnya menjadi paksaan dari luar.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: selalu mengucap syukur kepada Allah karena kamu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai penerima syukur serta jemaat sebagai alasan ucapan syukur.
- source_word: ἀδελφοὶ
  choice: Saudara-saudara
  rationale: Sapaan jamak yang wajar dan bermartabat dalam bahasa Indonesia; bentuk Yunani maskulin dapat merujuk kepada seluruh komunitas orang percaya, sebagaimana dijelaskan dalam catatan kaki.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: yang dikasihi Tuhan
  rationale: Mempertahankan bentuk pasif dan kehangatan relasional ungkapan Yunani tanpa menambah intensitas yang tidak dinyatakan.
- source_word: εἵλατο
  choice: telah memilih
  rationale: Menyampaikan arti langsung verba αἱρέομαι dalam bentuk tengah, tanpa memasukkan sistem doktrinal tertentu mengenai pemilihan.
- source_word: ἀπαρχὴν
  choice: sebagai buah sulung
  rationale: Mengikuti bacaan SBLGNT ἀπαρχήν dan mempertahankan metafora persembahan pertama; varian tekstual utama dicatat.
- source_word: εἰς σωτηρίαν
  choice: untuk keselamatan
  rationale: Mempertahankan nomina σωτηρία serta arah atau tujuan yang dinyatakan oleh εἰς.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: melalui pengudusan oleh Roh
  rationale: “Melalui” menyampaikan fungsi sarana dari ἐν, dan “oleh Roh” mengambil genitif sebagai pelaku pengudusan; kemungkinan rujukan kepada roh manusia tetap dicatat.
- source_word: καὶ πίστει ἀληθείας
  choice: dan iman kepada kebenaran
  rationale: 'Genitif ἀληθείας paling wajar dipahami secara objektif: kebenaran merupakan sasaran iman.'
theological_decisions:
- issue: Rujukan πνεύματος dalam ἐν ἁγιασμῷ πνεύματος
  choice: Roh Kudus, ditandai dengan huruf kapital “Roh”
  alternative: roh manusia
  rationale: Dalam konteks keselamatan Paulus, pengudusan paling wajar dipahami sebagai karya Roh Kudus. Karena bentuk Yunani sendiri dapat dibaca sebagai “roh”, kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Makna teologis εἵλατο ὑμᾶς ὁ θεὸς
  choice: Allah telah memilih kamu
  alternative: Allah telah menetapkan kamu; Allah telah mengambil kamu bagi diri-Nya
  rationale: Terjemahan menyatakan tindakan memilih yang terdapat dalam teks, tetapi tidak menjelaskan mekanisme, dasar, atau urutan pemilihan menurut sistem teologi tertentu.
- issue: Hubungan ἐν dengan ἁγιασμῷ dan πίστει
  choice: 'sarana menuju keselamatan: “melalui pengudusan ... dan iman ...”'
  alternative: 'ranah atau keadaan: “dalam pengudusan ... dan iman ...”'
  rationale: Pemakaian instrumental sesuai dengan konteks dan menghasilkan bahasa Indonesia yang alami, sementara tidak mengurutkan kedua unsur atau mempertentangkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat tanpa menjadi arkais. “Kamu” dipertahankan sebagai sapaan jamak sesuai konteks surat; “Saudara-saudara” dipakai sebagai sapaan komunitas. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
