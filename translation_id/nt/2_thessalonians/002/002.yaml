    issue: Cakupan frasa “yang menyatakan bahwa” tidak jelas
    rationale: Dalam “suatu surat yang seolah-olah berasal dari kami, yang menyatakan bahwa ...”, frasa relatif terakhir secara sintaksis melekat terutama pada “surat”. Dalam Yunani, isi “bahwa hari Tuhan telah tiba” merupakan klaim yang dapat datang melalui roh, pesan, atau surat yang diklaim berasal dari para pengirim.
  revised_text: supaya kamu tidak segera terguncang dalam pikiranmu atau menjadi gelisah karena suatu pernyataan yang dikatakan berasal dari kami—entah melalui suatu roh[a], suatu pesan, atau suatu surat—bahwa hari Tuhan telah tiba.[b]
