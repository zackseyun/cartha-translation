id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: id
  text: supaya kamu tidak segera terguncang dalam pikiranmu atau menjadi gelisah karena suatu pernyataan yang dikatakan berasal dari kami—entah melalui suatu roh[a], suatu pesan, atau suatu surat—bahwa hari Tuhan telah tiba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu ucapan rohani” atau “suatu penyataan nubuat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sudah hadir.” Bentuk perfek Yunani dapat menyatakan klaim bahwa hari Tuhan sudah tiba dan kini sedang berlangsung.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: lekas
  rationale: Menunjukkan bahwa mereka tidak boleh dengan cepat atau mudah dibuat goyah; 'lekas' alami dalam konstruksi nasihat ini.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: kamu ... terguncang dalam pikiranmu
  rationale: Mempertahankan metafora 'diguncang' sekaligus menyampaikan bahwa keadaan pikiran atau pemahaman mereka sedang diusik.
- source_word: θροεῖσθαι
  choice: menjadi gelisah
  rationale: Menyampaikan gangguan dan kecemasan yang kuat tanpa mempersempit maknanya hanya kepada ketakutan.
- source_word: πνεύματος
  choice: suatu roh
  rationale: Padanan yang dekat dengan nomina Yunani tanpa artikel; kemungkinan makna berupa ucapan atau penyataan rohani dijelaskan dalam catatan kaki.
- source_word: λόγου
  choice: suatu pesan
  rationale: Dalam rangkaian dengan roh dan surat, kata ini kemungkinan menunjuk pada pesan lisan; 'pesan' lebih jelas daripada 'perkataan'.
- source_word: ἐπιστολῆς
  choice: surat
  rationale: Padanan Indonesia modern yang langsung dan wajar untuk korespondensi tertulis.
- source_word: ὡς δι’ ἡμῶν
  choice: yang seolah-olah berasal dari kami
  rationale: Mengungkapkan klaim bahwa sumber-sumber tersebut dikaitkan dengan Paulus dan rekan-rekannya, tanpa menyatakan bahwa klaim itu benar.
- source_word: ὡς ὅτι
  choice: yang menyatakan bahwa
  rationale: Menyampaikan isi atau maksud pesan yang diduga, dan menghindari pengulangan 'seolah-olah' yang janggal.
- source_word: ἐνέστηκεν
  choice: telah tiba
  rationale: Bentuk perfek menyatakan kedatangan dengan keadaan kini sebagai hasilnya; 'telah tiba' jelas, sementara nuansa 'sudah hadir' dipertahankan dalam catatan kaki.
- source_word: ἡμέρα τοῦ κυρίου
  choice: hari Tuhan
  rationale: Istilah eskatologis yang mapan dan tidak mengacu pada hari ibadah mingguan.
theological_decisions:
- issue: Makna ἐνέστηκεν dalam pernyataan eskatologis
  choice: telah tiba
  alternative: sudah hadir
  rationale: Bentuk perfek dapat menggambarkan hari itu sebagai sudah datang dan kini berlangsung. Teks utama memakai ungkapan Indonesia yang alami, sedangkan kemungkinan penekanan pada kehadirannya sekarang dicatat.
- issue: Makna πνεύματος dalam rangkaian tiga sumber yang diduga
  choice: suatu roh
  alternative: suatu ucapan rohani atau penyataan nubuat
  rationale: Kata Yunani tanpa artikel tidak harus menunjuk secara khusus kepada Roh Kudus dan dalam konteks ini dapat berarti penyataan yang diklaim berasal dari ranah rohani. Ambiguitas itu tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur tiga sumber dipertahankan secara sejajar, dan ambiguitas πνεύματος serta nuansa aspek ἐνέστηκεν disajikan melalui catatan kaki.
