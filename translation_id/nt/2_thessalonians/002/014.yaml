source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: id
  text: Untuk itulah Ia memanggil kamu melalui Injil yang kami beritakan, supaya kamu memperoleh kemuliaan Tuhan kita Yesus, Sang Mesias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “supaya kamu memperoleh kemuliaan” juga dapat diterjemahkan “supaya kamu memiliki kemuliaan” atau “supaya kamu turut mengambil bagian dalam kemuliaan” Tuhan kita Yesus, Sang Mesias.
    reason: lexical_alternative
  - marker: b
    text: Atau, menurut bentuk yang lebih tradisional, “Yesus Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Untuk itulah
  rationale: Ungkapan ini menunjuk kembali pada keselamatan dan pengudusan dalam ayat sebelumnya sekaligus menyatakan tujuan. Bentuk ini alami dalam bahasa Indonesia tanpa mempersempit acuannya.
- source_word: ἐκάλεσεν
  choice: Ia memanggil
  rationale: Kata καλέω dipertahankan sebagai 'memanggil', yang memuat bobot panggilan ilahi dalam konteks Paulus tanpa menambahkan teori teologis tertentu tentang cara kerja panggilan itu.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: melalui Injil yang kami beritakan
  rationale: διά dengan genitif menyatakan sarana. Penguraian 'yang kami beritakan' menyampaikan maksud idiom 'Injil kami' secara wajar dan menghindari kesan bahwa para rasul memiliki injil yang berbeda.
- source_word: εἰς περιποίησιν δόξης
  choice: supaya kamu memperoleh kemuliaan
  rationale: περιποίησις dapat berarti pemerolehan atau pemilikan. 'Memperoleh' menyampaikan arah tujuan dengan alami, sedangkan kemungkinan nuansa memiliki atau turut mengambil bagian dipertahankan dalam catatan kaki.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: κύριος diterjemahkan dengan gelar baku 'Tuhan', yang mempertahankan arti dan bobot teologisnya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός tetap diperlakukan sebagai gelar yang bermakna 'Mesias', bukan sekadar unsur nama. Tanda koma dan 'Sang' membuat fungsi gelarnya jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat panggilan Allah dalam keselamatan
  choice: Ia memanggil
  alternative: Ia memanggil secara efektif; Ia mengundang
  rationale: Teks menyatakan panggilan Allah melalui Injil, tetapi tidak menjelaskan mekanismenya. Terjemahan mempertahankan daya soteriologis kata tersebut tanpa memasukkan doktrin denominasi tertentu atau melemahkannya menjadi sekadar undangan.
- issue: Hubungan orang percaya dengan kemuliaan Tuhan Yesus
  choice: memperoleh kemuliaan Tuhan kita Yesus
  alternative: memiliki kemuliaan; turut mengambil bagian dalam kemuliaan
  rationale: 'Genitif dan περιποίησις memungkinkan lebih dari satu nuansa: memperoleh kemuliaan, memilikinya, atau ikut mengambil bagian di dalamnya. Teks utama memakai bentuk yang paling langsung, sedangkan keluwesan maknanya dijaga dalam catatan kaki.'
- issue: Penerjemahan gelar Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam rangkaian gelar ini, Χριστός masih membawa arti gelar. 'Mesias' menampilkan makna tersebut, sementara bentuk tradisional 'Kristus' dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' mempertahankan sapaan orang kedua jamak sejauh yang dimungkinkan oleh bentuk Indonesia. 'Injil yang kami beritakan' dipilih daripada 'Injil kami' agar idiom apostolik jelas bagi pembaca umum. Kapitalisasi 'Injil', 'Tuhan', dan 'Mesias' mengikuti kebiasaan umum penulisan istilah keagamaan Indonesia.
