  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: id
  text: Kemudian si durhaka itu akan dinyatakan, yang akan dibunuh oleh Tuhan Yesus dengan napas mulut-Nya dan ditiadakan oleh kemunculan-Nya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan roh mulut-Nya.” Kata Yunani yang dipakai dapat berarti “napas” atau “roh”; “napas” paling sesuai dengan ungkapan ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “oleh penampakan kehadiran-Nya.” Dalam konteks ini, kata Yunani yang diterjemahkan “kemunculan-Nya” mencakup kemunculan pada kedatangan Kristus; kata παρουσια yang mendasarinya juga dapat berarti “kehadiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: akan dinyatakan
  rationale: Bentuk pasif futur dipertahankan dan secara wajar menyatakan bahwa sosok itu akan dibuat nyata atau tersingkap.
- source_word: ὁ ἄνομος
  choice: si durhaka
  rationale: Adjektiva bersubstansi dengan artikel ini menunjuk kepada sosok tertentu. 'Si durhaka' alami dalam bahasa Indonesia dan tidak menambahkan kata 'manusia' yang tidak terdapat dalam ayat ini.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Tuhan Yesus
  rationale: Mempertahankan gelar κύριος dan nama pribadi dalam bentuk baku Perjanjian Baru bahasa Indonesia.
- source_word: ἀνελεῖ
  choice: akan membunuhnya
  rationale: Dalam konteks ini ἀναιρέω berarti membunuh atau menewaskan; 'membunuhnya' jelas, modern, dan mempertahankan daya verba tersebut.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: dengan napas dari mulut-Nya
  rationale: πνεῦμα dapat berarti 'napas' atau 'roh'. Dalam ungkapan ini 'napas' paling alami dan selaras dengan gambaran penghakiman dalam Yesaya 11:4, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: καταργήσει
  choice: meniadakannya
  rationale: καταργέω menyatakan tindakan membuat tidak berdaya, mengakhiri, atau meniadakan. Pilihan ini menyampaikan pembatalan yang tuntas tanpa secara tidak perlu mempersempitnya menjadi pemusnahan ontologis.
- source_word: τῇ ἐπιφανείᾳ
  choice: melalui penampakan
  rationale: ἐπιφάνεια menunjuk pada kemunculan atau manifestasi yang tampak. 'Penampakan' mempertahankan unsur terlihat tanpa menambahkan gagasan kemegahan.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: kedatangan-Nya
  rationale: Dalam konteks eskatologis, παρουσία lazim menunjuk pada kedatangan Kristus, meskipun secara leksikal juga dapat berarti kehadiran; alternatif itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Identitas dan penggambaran lawan eskatologis
  choice: si durhaka
  alternative: orang durhaka; manusia durhaka
  rationale: Ayat ini memakai ὁ ἄνομος, bukan ungkapan lengkap dari konteks sekitarnya. Terjemahan ini tidak memasukkan 'manusia' ke dalam ayat, tetapi tetap menunjukkan sosok tertentu.
- issue: Sarana kemenangan Tuhan Yesus
  choice: dengan napas dari mulut-Nya
  alternative: dengan roh dari mulut-Nya
  rationale: '''Napas'' paling sesuai dengan idiom dan kemungkinan gema nubuat, tetapi ambiguitas leksikal πνεῦμα dijaga dalam catatan kaki.'
- issue: Makna παρουσία
  choice: kedatangan-Nya
  alternative: kehadiran-Nya
  rationale: '''Kedatangan'' merupakan arti kontekstual yang paling lazim dalam bagian eskatologis ini, sedangkan ''kehadiran'' tetap mungkin dalam cakupan leksikalnya dan dicatat sebagai alternatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi menjadi dua agar hubungan antarklausa tetap jelas dan alami. Pronomina yang merujuk kepada Tuhan Yesus ditulis dengan huruf kapital menurut kebiasaan umum bahasa Indonesia religius.
