translation:
  language: id
  text: Kedatangannya terjadi menurut cara kerja Iblis, dengan segala kuasa, tanda-tanda, dan keajaiban yang bercirikan dusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengan segala kuasa dan tanda-tanda dan keajaiban dusta.” Ungkapan ini juga dapat dipahami sebagai “tanda-tanda dan keajaiban-keajaiban dusta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: orang itu
  rationale: Pronomina relatif genitif ini menunjuk kembali kepada “orang durhaka” pada ayat sebelumnya. Dalam bahasa Indonesia, pengulangan rujukan sebagai “orang itu” menghasilkan hubungan yang alami tanpa memaksakan bentuk posesif yang kaku.
- source_word: παρουσία
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, istilah tersebut menunjuk pada hadirnya seseorang melalui kedatangan atau penampakannya, bukan sekadar keberadaan statis.
- source_word: κατ’ ἐνέργειαν
  choice: berlangsung sesuai dengan pekerjaan
  rationale: κατά menyatakan kesesuaian dengan cara atau pola kerja, sedangkan ἐνέργεια menunjukkan kegiatan atau daya yang bekerja. Ungkapan ini mempertahankan hubungan tersebut dalam bahasa Indonesia yang wajar.
- source_word: τοῦ Σατανᾶ
  choice: Iblis
  rationale: “Iblis” merupakan sebutan baku dan mudah dipahami dalam bahasa Indonesia bagi Satanas; bentuk genitif menyatakan bahwa pekerjaan itu berasal dari atau merupakan pekerjaan Iblis.
- source_word: ἐν πάσῃ δυνάμει
  choice: disertai segala kuasa
  rationale: ἐν di sini paling alami dipahami sebagai keadaan atau sarana yang menyertai kedatangan itu. “Segala kuasa” mempertahankan cakupan πάσῃ tanpa mempersempit δύναμις menjadi “mukjizat”.
- source_word: σημείοις
  choice: tanda
  rationale: Padanan baku bagi tindakan atau fenomena yang dimaksudkan sebagai penanda atau pengesahan.
- source_word: τέρασιν
  choice: keajaiban
  rationale: Menyampaikan fenomena luar biasa yang menimbulkan kekaguman dan berpasangan secara alami dengan “tanda”.
- source_word: ψεύδους
  choice: yang penuh kepalsuan
  rationale: Genitif ini mencirikan rangkaian kuasa, tanda, dan keajaiban sebagai berkaitan dengan dusta atau kepalsuan. Pilihan ini tidak memastikan apakah fenomenanya semata-mata tipuan atau sungguh bersifat adikodrati.
theological_decisions:
- issue: Hakikat fenomena yang berasal dari pekerjaan Iblis
  choice: Kuasa, tanda, dan keajaiban itu digambarkan sebagai penuh kepalsuan tanpa menentukan apakah semuanya palsu sebagai fenomena atau merupakan kejadian nyata yang melayani penipuan.
  alternative: Menerjemahkannya sebagai “keajaiban palsu” atau “mukjizat dusta”, yang dapat menyiratkan bahwa fenomenanya hanya tipuan belaka.
  rationale: ψεύδους menyatakan kaitan dengan kepalsuan, tetapi ayat ini tidak memberikan penjelasan metafisis tentang apakah kuasa dan fenomena tersebut nyata atau semu. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara rangkaian “kuasa, tanda, dan keajaiban” serta ambiguitas ψεύδους tetap dipertahankan.
