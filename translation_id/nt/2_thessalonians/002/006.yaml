id: 2TH.2.6
reference: 2 Thessalonians 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: id
  text: Dan sekarang kamu tahu apa yang menahannya[a], supaya ia dinyatakan pada waktunya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang menghambatnya.” Ungkapan Yunani berbentuk netral dan tidak menyebutkan di sini siapa atau apa yang menahan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pada waktu yang ditetapkan baginya.” Ungkapan Yunani dapat mengandung arti waktu yang tepat atau yang telah ditetapkan.
    reason: alternative_reading
lexical_decisions:
- source_word: κατέχον
  choice: apa yang menahannya
  rationale: Partisipel netral dengan artikel diterjemahkan secara impersonal, tanpa menentukan apakah penahannya suatu pribadi, kuasa, atau hal lain. Kata 'menahan' menyampaikan gagasan menghambat atau mengekang secara alami dalam bahasa Indonesia.
- source_word: οἴδατε
  choice: kamu tahu
  rationale: Bentuk perfektum ini memiliki arti kini; 'kamu tahu' merupakan padanan langsung dan wajar yang mengacu pada pengajaran sebelumnya.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: supaya ia dinyatakan
  rationale: Konstruksi εἰς τό dengan infinitif dapat menyatakan tujuan atau hasil. 'Supaya ia dinyatakan' mempertahankan nuansa tersebut serta bentuk pasif sumber.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: pada waktunya sendiri
  rationale: καιρός menunjuk pada waktu yang tepat atau tertentu, sedangkan ἑαυτοῦ menegaskan bahwa waktu itu adalah waktunya sendiri. Terjemahan ini tidak menambahkan secara eksplisit siapa yang menetapkannya.
- source_word: νῦν
  choice: sekarang
  rationale: Padanan temporal yang langsung dan alami.
- source_word: αὐτόν
  choice: ia / -nya
  rationale: Pronomina maskulin ini mengacu pada tokoh yang sebelumnya disebut dan tetap diterjemahkan sebagai rujukan personal tanpa mengidentifikasinya lebih lanjut.
theological_decisions:
- issue: Identitas pihak atau kuasa yang menahan
  choice: Terjemahkan secara netral sebagai 'apa yang menahannya'.
  alternative: Pemerintahan Romawi; Roh Kudus; kuasa malaikat; ketetapan atau pemeliharaan Allah.
  rationale: Ayat ini tidak mengidentifikasi penahan tersebut, dan bentuk netral τὸ κατέχον tidak boleh dipersempit menjadi suatu pribadi atau kuasa tertentu.
- issue: Makna καιρός dalam konteks eskatologis
  choice: Terjemahkan sebagai 'waktunya sendiri'.
  alternative: Waktu yang ditetapkan baginya; waktu yang tepat baginya.
  rationale: καιρός dapat berarti waktu yang tepat atau ditetapkan, tetapi teks utama mempertahankan ungkapan yang lebih terbuka dan menempatkan nuansa itu dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'kamu' dipakai sebagai bentuk jamak kontekstual bagi jemaat; ambiguitas mengenai penahan dan sifat waktu dipertahankan.
