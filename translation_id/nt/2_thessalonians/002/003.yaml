id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: id
  text: Janganlah seorang pun menyesatkan kamu dengan cara apa pun. Sebab, hari itu tidak akan tiba sebelum pemberontakan[a] itu datang lebih dahulu dan manusia durhaka[b] itu dinyatakan, yaitu anak kebinasaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemurtadan” atau “pembelotan.” Kata Yunani ini dapat menunjuk pada suatu pemberontakan yang menentukan, dan sering dipahami sebagai tindakan meninggalkan iman.
    reason: alternative_reading
  - marker: b
    text: Sejumlah manuskrip berbunyi “manusia dosa,” bukan “manusia durhaka.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: menyesatkan
  rationale: Kata kerja ini berarti menipu atau menyesatkan. “Menyesatkan” alami dalam konteks peringatan terhadap ajaran keliru dan tidak melebih-lebihkan daya awalan kata Yunani tersebut.
- source_word: κατὰ μηδένα τρόπον
  choice: dengan cara apa pun
  rationale: Ungkapan ini menegaskan larangan dengan mencakup setiap cara atau sarana penyesatan.
- source_word: ὅτι
  choice: Sebab
  rationale: Di sini ὅτι memperkenalkan alasan bagi larangan sebelumnya; “Sebab” menyatakan hubungan logis itu dengan jelas.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: tidak akan tiba sebelum ... datang
  rationale: Susunan ini menyatakan syarat berupa peristiwa yang harus terjadi terlebih dahulu. Subjek tersiratnya, “hari itu,” dipasok dari ayat sebelumnya agar kalimat Indonesia lengkap dan jelas.
- source_word: ἀποστασία
  choice: pemberontakan
  rationale: Istilah ini dapat berarti pemberontakan, pembelotan, atau kemurtadan. “Pemberontakan” mempertahankan cakupan luasnya tanpa langsung membatasi peristiwa tersebut pada kemurtadan religius; kemungkinan itu dicatat dalam catatan kaki.
- source_word: πρῶτον
  choice: lebih dahulu
  rationale: Adverbia ini menandai urutan waktu. “Lebih dahulu” mengungkapkan bahwa pemberontakan mendahului hari yang dimaksud.
- source_word: ἀποκαλυφθῇ
  choice: dinyatakan
  rationale: Bentuk pasif ini menunjukkan bahwa tokoh tersebut dibuat nyata atau disingkapkan. “Dinyatakan” wajar dalam bahasa Indonesia dan mempertahankan nuansa penyingkapan.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: manusia durhaka
  rationale: ἀνομία menunjuk pada keadaan tanpa hukum atau kedurhakaan. “Manusia durhaka” merupakan ungkapan Indonesia yang alami untuk seorang tokoh laki-laki tertentu yang bercirikan kedurhakaan, sedangkan varian tekstual “manusia dosa” dicatat dalam catatan kaki.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: anak kebinasaan
  rationale: Ungkapan bercorak Semitis ini dapat menunjuk pada orang yang dicirikan oleh atau diperuntukkan bagi kebinasaan. “Anak kebinasaan” mempertahankan bentuk dan ketegangan makna teks sumber tanpa mengubahnya menjadi penjelasan tafsir.
theological_decisions:
- issue: Subjek tersirat dari klausa “tidak akan tiba”
  choice: Memasukkan “hari itu” secara eksplisit berdasarkan konteks ayat 2
  alternative: 'Membiarkan klausa eliptis: “sebab, sebelum pemberontakan itu datang...”'
  rationale: Bahasa Yunani mengandalkan konteks langsung, yaitu hari Tuhan dalam ayat sebelumnya. Bahasa Indonesia memerlukan subjek yang lebih eksplisit agar hubungan kalimat jelas; penambahan ini merupakan klarifikasi gramatikal, bukan penetapan tafsir baru.
- issue: Makna ἀποστασία
  choice: pemberontakan
  alternative: kemurtadan; pembelotan
  rationale: Kata tersebut dapat menunjuk pada pemberontakan secara luas ataupun pembelotan religius. Pilihan yang lebih luas dipakai dalam teks utama supaya perdebatan eskatologis tidak diselesaikan secara sepihak, sedangkan alternatif religius dicatat.
- issue: Varian tekstual pada τῆς ἀνομίας
  choice: 'Mengikuti SBLGNT: “durhaka” (ἀνομίας)'
  alternative: “dosa” (ἁμαρτίας) menurut sejumlah manuskrip
  rationale: Teks sumber yang ditetapkan membaca ἀνομίας, sehingga teks utama menerjemahkannya. Varian yang dikenal luas dipertahankan dalam catatan kaki demi transparansi tekstual.
- issue: Makna ungkapan ὁ υἱὸς τῆς ἀπωλείας
  choice: anak kebinasaan
  alternative: orang yang ditentukan untuk binasa
  rationale: Bentuk harfiah mempertahankan kemungkinan bahwa tokoh itu dicirikan oleh kebinasaan sekaligus menuju kebinasaan, tanpa menjadikan salah satu nuansa sebagai satu-satunya tafsir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kalimat dibagi setelah larangan agar alurnya jelas. Istilah “anak kebinasaan” sengaja mempertahankan ungkapan Semitis dan ambiguitas teologis teks sumber.
