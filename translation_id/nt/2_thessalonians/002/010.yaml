base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: id
  text: dan dengan segala tipu daya kefasikan[a] bagi mereka yang sedang binasa[b], karena mereka tidak menerima kasih akan kebenaran[c], supaya mereka diselamatkan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala tipu daya ketidakbenaran.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di antara mereka yang sedang binasa” atau “kepada mereka yang sedang binasa.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak menyambut kasih akan kebenaran.”
    reason: lexical_alternative
  - marker: d
    text: Atau “sehingga mereka diselamatkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ ἀδικίας
  choice: tipu daya kefasikan
  rationale: ἀπάτη menyatakan tipu daya atau penyesatan, sedangkan genitif ἀδικίας mencirikan tipu daya itu secara moral. Ungkapan ini mempertahankan bentuk nominal dan bobot moral-teologis sumber.
- source_word: τοῖς ἀπολλυμένοις
  choice: di antara mereka yang sedang binasa
  rationale: Datifnya dapat menunjuk lingkup atau sasaran bekerjanya tipu daya. “Di antara” alami dalam bahasa Indonesia dan tidak memaksakan arah tertentu; bentuk partisipel kini dipertahankan sebagai keadaan yang sedang berlangsung.
- source_word: ἀνθ’ ὧν
  choice: karena
  rationale: Dalam konteks ini frasa tersebut memperkenalkan alasan secara idiomatis. Terjemahan lebih harfiah seperti “sebagai balasan atas hal itu” mungkin, tetapi berpotensi mengaburkan alurnya.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: kasih akan kebenaran
  rationale: “Kasih” mempertahankan ἀγάπη, sementara “akan kebenaran” secara alami menyampaikan pembacaan objektif—mengasihi kebenaran—tanpa mereduksinya menjadi sekadar persetujuan intelektual.
- source_word: οὐκ ἐδέξαντο
  choice: tidak menerima
  rationale: δέχομαι dapat berarti menerima, menyambut, atau menerima dengan baik. “Tidak menerima” dekat dengan bentuk sumber dan tetap menyiratkan penolakan yang dapat dipertanggungjawabkan.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: supaya mereka diselamatkan
  rationale: Konstruksi εἰς dengan infinitif berartikel dapat menyatakan tujuan atau hasil. “Supaya mereka diselamatkan” jelas, alami, dan mempertahankan bentuk pasif.
theological_decisions:
- issue: Apakah οἱ ἀπολλύμενοι harus dipahami sebagai golongan yang sudah ditetapkan binasa atau sebagai orang-orang dalam keadaan yang sedang berlangsung.
  choice: mereka yang sedang binasa
  alternative: orang-orang yang terhukum binasa; mereka yang sedang dibinasakan
  rationale: Partisipel kini medio-pasif paling aman diterjemahkan sebagai keadaan yang sedang berlangsung. Ini menghindari memasukkan sistem soteriologis tertentu.
- issue: Hubungan genitif dalam “kasih akan kebenaran.”
  choice: kasih akan kebenaran
  alternative: kasih dari kebenaran
  rationale: Konteks sangat mendukung kasih yang diarahkan kepada kebenaran, tetapi susunan nominal dipertahankan agar tidak memperluas tafsiran melampaui teks.
- issue: Nuansa tujuan atau hasil dalam εἰς τὸ σωθῆναι αὐτούς.
  choice: supaya mereka diselamatkan
  alternative: sehingga mereka diselamatkan
  rationale: Konstruksi dapat mengandung nuansa tujuan atau hasil. Teks utama memakai bentuk tujuan yang wajar, sedangkan alternatif dicatat agar ambiguitas gramatikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Sedang binasa” mempertahankan aspek berlangsung; “kasih akan kebenaran” lebih alami daripada bentuk genitif yang kaku. Penanda catatan ditempatkan pada unsur terkait di dalam teks utama.
