  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: id
  text: supaya semua orang yang tidak percaya kepada kebenaran, tetapi menyukai kejahatan, dihakimi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihukum.” Dalam konteks ini, kata kerja Yunani tersebut dapat menyiratkan putusan yang menghukum, meskipun arti yang lebih harfiahnya adalah “dihakimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menghubungkan ayat ini dengan konteks sebelumnya dan mempertahankan kemungkinan nuansa tujuan maupun hasil tanpa menentukannya secara berlebihan.
- source_word: κριθῶσιν
  choice: dihakimi
  rationale: Bentuk pasif ini pada dasarnya berarti menerima penghakiman. Konteksnya menyiratkan putusan yang merugikan, tetapi kata utama mempertahankan cakupan leksikal verba Yunani.
- source_word: πάντες
  choice: semua orang
  rationale: Ungkapan ini secara alami menyatakan keseluruhan kelompok manusia yang dijelaskan oleh kedua partisip berikutnya.
- source_word: οἱ μὴ πιστεύσαντες
  choice: yang tidak percaya
  rationale: Partisip aoris dengan artikel berfungsi substantival. Dalam bahasa Indonesia, klausa relatif sesudah 'semua orang' terasa alami dan tepat.
- source_word: τῇ ἀληθείᾳ
  choice: kepada kebenaran
  rationale: Preposisi 'kepada' secara wajar menyampaikan konstruksi datif sesudah πιστεύω, sedangkan bentuk definit 'kebenaran' dipahami dari konteks sebagai kebenaran yang telah diberitakan.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai pertentangan kuat antara tidak memercayai kebenaran dan menyukai ketidakbenaran.
- source_word: εὐδοκήσαντες
  choice: menyukai
  rationale: Menyampaikan sikap kehendak dan rasa senang terhadap objeknya secara alami dalam bahasa Indonesia, tanpa membatasinya pada persetujuan intelektual semata.
- source_word: τῇ ἀδικίᾳ
  choice: ketidakbenaran
  rationale: Mempertahankan kontras leksikal dan retoris langsung dengan ἀλήθεια, 'kebenaran', sekaligus mencakup makna moral berupa kejahatan atau perbuatan salah.
theological_decisions:
- issue: Apakah κριθῶσιν diterjemahkan sebagai 'dihakimi' atau secara lebih interpretatif sebagai 'dihukum'
  choice: dihakimi
  alternative: dihukum
  rationale: Konteksnya jelas negatif, tetapi κρίνω sendiri memiliki arti lebih luas, yaitu menghakimi atau memberi putusan. Terjemahan utama mempertahankan ketegangan itu dan tidak menyatakan hasil penghukuman secara lebih eksplisit daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dipertahankan dekat dengan teks Yunani, dengan kontras kebenaran–ketidakbenaran dijaga secara eksplisit. Tanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
