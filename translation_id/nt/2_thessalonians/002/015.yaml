  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: id
  text: Jadi, Saudara-saudara[a], berdirilah teguh dan berpeganglah erat pada tradisi-tradisi yang telah diajarkan kepada kalian, baik secara lisan maupun melalui surat kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; bahasa Yunani berbunyi “saudara-saudara”, tetapi kemungkinan besar sapaan ini ditujukan kepada seluruh jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya. “Jadi” menyampaikan daya simpul dan peralihan itu secara alami dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara bentuk berarti saudara laki-laki, tetapi dalam pemakaian Paulus lazim menyapa seluruh jemaat. “Saudara-saudara” merupakan sapaan jemaat yang wajar dan bermartabat; catatan kaki menjelaskan cakupannya.
- source_word: στήκετε
  choice: berdirilah teguh
  rationale: Imperatif kini menuntut keteguhan yang berlanjut. Ungkapan ini mempertahankan citra berdiri sekaligus menyampaikan ketabahan.
- source_word: κρατεῖτε
  choice: berpeganglah erat pada
  rationale: Kata kerja ini menyatakan tindakan mempertahankan atau memegang dengan kuat. “Berpeganglah erat pada” menjaga kekuatan perintah tersebut dalam bahasa Indonesia yang alami.
- source_word: τὰς παραδόσεις
  choice: tradisi-tradisi
  rationale: παράδοσις menunjuk pada hal-hal yang disampaikan atau diwariskan. Bentuk jamak dipertahankan, dan “tradisi-tradisi” menjaga unsur penerusan yang dapat melemah jika diterjemahkan hanya sebagai “ajaran”.
- source_word: ἃς ἐδιδάχθητε
  choice: yang telah diajarkan kepada kalian
  rationale: Bentuk pasif menunjukkan bahwa jemaat adalah penerima pengajaran. “Telah diajarkan kepada kalian” alami dalam konteks ini dan menyatakan tindakan pengajaran yang sudah mereka terima.
- source_word: εἴτε διὰ λόγου
  choice: baik secara lisan
  rationale: λόγος di sini berlawanan dengan surat sehingga menunjuk pada penyampaian melalui perkataan. “Secara lisan” membuat kontras medianya jelas tanpa menambah isi.
- source_word: εἴτε δι’ ἐπιστολῆς ἡμῶν
  choice: maupun melalui surat kami
  rationale: Frasa ini menunjuk pada penyampaian tertulis oleh Paulus dan rekan-rekannya. “Melalui surat kami” mempertahankan sarana dan unsur kepemilikan ἡμῶν.
theological_decisions:
- issue: παράδοσις dalam konteks perdebatan mengenai tradisi apostolik
  choice: tradisi-tradisi
  alternative: ajaran-ajaran; petunjuk-petunjuk
  rationale: Teks menyebut hal-hal yang diteruskan kepada jemaat melalui penyampaian lisan maupun surat. “Tradisi-tradisi” paling langsung mempertahankan makna leksikal itu tanpa menentukan cakupan atau status tradisi gerejawi pada masa kemudian.
- issue: Cakupan sapaan ἀδελφοί kepada jemaat yang kemungkinan terdiri dari laki-laki dan perempuan
  choice: Saudara-saudara dengan catatan kaki inklusif
  alternative: saudara-saudari
  rationale: Terjemahan utama mempertahankan bentuk sapaan maskulin jamak dari bahasa Yunani sejauh dapat dilakukan secara wajar, sementara catatan menjelaskan bahwa sapaan itu kemungkinan mencakup seluruh jemaat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “kalian” dipakai agar orang kedua jamak eksplisit dan alami. Paralel “baik ... maupun ...” mempertahankan keseimbangan antara penyampaian lisan dan tertulis.
