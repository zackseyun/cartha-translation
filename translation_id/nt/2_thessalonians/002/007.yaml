  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: id
  text: Sebab misteri kedurhakaan sudah bekerja. Hanya saja, dia yang sekarang menahan[a] akan tetap menahan sampai ia tersingkir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dia yang sekarang menahan.” Teks Yunani tidak menyebutkan secara eksplisit siapa sosok yang menahan ataupun apa yang ditahannya.
    reason: alternative_reading
  - marker: b
    text: Atau “sampai ia tidak lagi berada di tengah” atau “sampai ia disingkirkan.” Teks Yunani tidak menjelaskan secara eksplisit bagaimana hal itu terjadi atau siapa pelakunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: misteri
  rationale: Mempertahankan pengertian khas Paulus tentang kenyataan yang tersembunyi tetapi kini sedang bekerja, bukan sekadar teka-teki.
- source_word: ἐνεργεῖται
  choice: sudah bekerja
  rationale: Mengungkapkan kegiatan yang telah berlangsung sekarang dengan bahasa Indonesia yang alami.
- source_word: ἀνομίας
  choice: kedurhakaan
  rationale: Menyampaikan penolakan terhadap hukum dan tatanan Allah serta cocok dengan konteks pemberontakan dalam perikop ini.
- source_word: μόνον
  choice: hanya saja
  rationale: Secara alami memperkenalkan pembatasan terhadap pernyataan sebelumnya.
- source_word: ὁ κατέχων ἄρτι
  choice: dia yang sekarang menahannya
  rationale: Mempertahankan bentuk partisipial dan tidak menentukan identitas sosok yang menahan; objek tersirat dinyatakan dengan pronomina agar kalimat Indonesia wajar.
- source_word: ἕως ἐκ μέσου γένηται
  choice: sampai dia tidak lagi berada di tengah
  rationale: Mencerminkan ungkapan Yunani secara cukup dekat tanpa menyatakan bahwa suatu pihak tertentu menyingkirkannya.
theological_decisions:
- issue: Identitas ὁ κατέχων
  choice: Diterjemahkan secara umum sebagai “dia yang sekarang menahannya” tanpa menyebut identitasnya.
  alternative: Pemerintah Romawi, pemerintahan manusia, Roh Kudus, makhluk malaikat, Paulus, atau pemberitaan rasuli.
  rationale: Ayat ini menyebut sosok maskulin yang menahan tetapi tidak mengidentifikasinya; ambiguitas itu harus dipertahankan.
- issue: Pelaku dalam ἕως ἐκ μέσου γένηται
  choice: “sampai dia tidak lagi berada di tengah”
  alternative: “sampai dia disingkirkan” atau “sampai dia diambil dari tengah”
  rationale: Bahasa Yunani tidak secara eksplisit menyebut pelaku yang memindahkan atau menyingkirkan sosok tersebut.
- issue: Objek κατέχων yang tersirat
  choice: Memakai “menahannya”, dengan rujukan yang tetap ditentukan oleh konteks.
  alternative: “dia yang sekarang menahan” tanpa objek atau “sang penahan”
  rationale: Bahasa Indonesia lebih alami dengan objek, tetapi catatan menegaskan bahwa teks Yunani tidak menyatakan objek maupun identitas sosok itu secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Misteri” mempertahankan istilah teologis Paulus; “kedurhakaan” lebih alami daripada “ketidakberhukum” dan tetap menyampaikan perlawanan terhadap hukum Allah. Penanda catatan kaki ditempatkan langsung pada bagian yang dijelaskan.
