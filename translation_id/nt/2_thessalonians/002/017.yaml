translation:
  language: id
  text: Kiranya Ia menguatkan hati kalian dan meneguhkan kalian dalam setiap perbuatan dan perkataan yang baik.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani παρακαλέσαι juga dapat berarti “menghibur,” “mendorong,” atau “menasihati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengokohkan kalian” atau “membuat kalian teguh” dalam setiap perbuatan dan perkataan yang baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: menguatkan
  rationale: Dalam konteks doa dan kaitannya dengan penguatan kekal pada ayat 16, kata ini mencakup dorongan dan penghiburan; “menguatkan hati” alami dalam bahasa Indonesia tanpa membatasinya pada emosi saja.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan metafora antropologis Alkitab tentang pusat batin manusia, bukan mempersempitnya menjadi pikiran atau perasaan saja.
- source_word: στηρίξαι
  choice: meneguhkan
  rationale: Menyampaikan gagasan membuat teguh atau kokoh, sekaligus membedakannya dari παρακαλέσαι yang diterjemahkan “menguatkan”.
- source_word: ἐν παντὶ
  choice: dalam setiap
  rationale: Menunjukkan ranah tempat peneguhan itu berlaku dan mempertahankan nilai distributif παντί.
- source_word: ἔργῳ
  choice: perbuatan
  rationale: Dalam pasangan dengan λόγῳ, “perbuatan” secara alami menunjuk tindakan dan membentuk pasangan idiomatis “perbuatan dan perkataan”.
- source_word: λόγῳ
  choice: perkataan
  rationale: Dalam paralel dengan perbuatan, kata ini paling wajar menunjuk ucapan atau tutur kata.
- source_word: ἀγαθῷ
  choice: yang baik
  rationale: Secara makna menerangkan baik perbuatan maupun perkataan; susunan Indonesia membuat cakupan bersama itu tetap alami.
- source_word: ὑμῶν
  choice: -mu
  rationale: Genitif jamak bergantung pada “hati”; bahasa Indonesia tidak membedakan jumlah pada pronomina posesif ini, sementara konteks menunjukkan jemaat sebagai penerima.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan kedua verba doa serta pasangan nomina secara langsung.
theological_decisions:
- issue: Apakah καρδία perlu ditafsirkan sebagai kategori psikologis modern
  choice: hati
  alternative: batin atau pikiran
  rationale: “Hati” mempertahankan metafora dan keluasan antropologi teks tanpa mempersempit maknanya.
- issue: Pembedaan παρακαλέσαι dan στηρίξαι
  choice: menguatkan ... dan meneguhkan
  alternative: menghibur ... dan menguatkan
  rationale: 'Pilihan ini mempertahankan dua tindakan yang saling berkaitan tetapi tidak identik: memberi dorongan/penghiburan batin dan membuat teguh dalam kehidupan yang baik.'
- issue: Subjek tersirat dari kedua verba
  choice: Dia
  alternative: Tuhan kita Yesus Kristus dan Allah, Bapa kita
  rationale: Ayat ini melanjutkan subjek majemuk dari ayat 16, tetapi bentuk verba Yunani tunggal menciptakan ketegangan gramatikal yang tidak perlu diselesaikan secara doktrinal; “Dia” mengikuti bentuk tunggal sambil bergantung pada konteks sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kiranya” menandai bentuk doa/harapan yang berlanjut dari ayat 16. Penambahan “kamu” setelah “meneguhkan” diperlukan agar konstruksi Indonesia jelas; acuannya adalah para penerima surat secara jamak.
