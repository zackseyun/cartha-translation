  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: id
  text: Oleh sebab itu, Allah mengirimkan kepada mereka daya kerja yang menyesatkan[a], sehingga mereka memercayai dusta itu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “daya kerja kesesatan”; dapat juga diterjemahkan “pengaruh yang menyesatkan” atau “kegiatan penyesatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Oleh sebab itu
  rationale: Ungkapan ini menyatakan alasan yang merujuk kembali pada penolakan terhadap kebenaran dalam ayat sebelumnya. “Oleh sebab itu” mempertahankan hubungan kausal sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: πέμπει
  choice: mengirimkan
  rationale: Bentuk kini indikatif diterjemahkan secara langsung dan mempertahankan Allah sebagai pelaku tindakan, tanpa memperlemahnya menjadi sekadar mengizinkan.
- source_word: ἐνέργειαν πλάνης
  choice: daya kerja yang menyesatkan
  rationale: “Daya kerja” mencerminkan ἐνέργεια sebagai kekuatan atau kegiatan yang bekerja secara efektif, sedangkan “yang menyesatkan” menyampaikan πλάνη secara alami. Pilihan ini lebih mudah dipahami daripada bentuk harfiah “daya kerja kesesatan” sambil tetap mempertahankan kedua unsur ungkapan Yunani.
- source_word: εἰς τὸ πιστεῦσαι
  choice: sehingga mereka memercayai
  rationale: Konstruksi ini dapat menyatakan tujuan atau akibat. “Sehingga” menyampaikan hubungan yang dihasilkan tanpa mempertajam perbedaan antara tujuan dan akibat melebihi yang dinyatakan teks Yunani.
- source_word: τῷ ψεύδει
  choice: dusta itu
  rationale: Artikel dan bentuk tunggal menunjuk pada dusta tertentu dalam konteks, bukan sekadar kepalsuan secara umum. “Dusta itu” mempertahankan kekhususan tersebut.
theological_decisions:
- issue: Tindakan Allah dalam penghukuman yang mengeraskan
  choice: Allah mengirimkan kepada mereka daya kerja yang menyesatkan
  alternative: Allah membiarkan daya kerja yang menyesatkan datang kepada mereka
  rationale: Teks Yunani secara eksplisit menjadikan Allah subjek kata “mengirimkan”. Terjemahan tidak mengubah tindakan langsung itu menjadi izin pasif, sehingga ketegangan antara penghakiman ilahi dan penolakan manusia terhadap kebenaran tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Daya kerja yang menyesatkan” dipilih sebagai keseimbangan antara kejelasan alami dan keterlihatan struktur leksikal Yunani. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
