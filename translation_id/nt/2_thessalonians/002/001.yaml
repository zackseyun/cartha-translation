  source_fidelity: Teks dengan setia menerjemahkan Ἐρωτῶμεν sebagai permohonan pastoral, mempertahankan vokatif ἀδελφοί, dan merepresentasikan ὑπὲρ sebagai pengantar topik. Kedua unsur yang dikoordinasikan—kedatangan Tuhan Yesus Sang Mesias dan berkumpulnya kita kepada-Nya—tetap dibiarkan sejajar, tanpa memasukkan hubungan waktu atau skema eskatologis tertentu. “Kepada-Nya” memadai untuk ἐπ’ αὐτόν.
