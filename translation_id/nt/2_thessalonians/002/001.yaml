id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: id
  text: Kami memohon kepada kalian, saudara-saudara[b], mengenai kedatangan Tuhan kita Yesus Sang Mesias[a] dan berkumpulnya kita kepada-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini untuk mempertahankan maknanya.
    reason: alternative_reading
  - marker: b
    text: “Saudara-saudara” adalah bentuk sapaan Paulus; dalam konteks ini kemungkinan besar ia menyapa seluruh komunitas orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: kami memohon
  rationale: Dalam konteks ini verba tersebut menyampaikan permohonan pastoral, bukan sekadar pertanyaan atau perintah. “Memohon” mempertahankan daya imbauannya tanpa menjadikannya perintah keras.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai peralihan wacana yang sudah dapat dipahami dari susunan kalimat Indonesia. Menambah “sekarang” akan mudah disalahpahami sebagai keterangan waktu.
- source_word: ὑμᾶς
  choice: kepada kalian
  rationale: Pronomina ini berbentuk jamak. “Kalian” menyatakannya dengan jelas dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan maskulin jamak ini diterjemahkan secara dekat dengan bentuk sumber. Dalam pemakaian Paulus, cakupannya kemungkinan meliputi seluruh jemaat, sebagaimana dijelaskan dalam catatan kaki.
- source_word: ὑπὲρ
  choice: mengenai
  rationale: Di sini preposisi tersebut memperkenalkan pokok permohonan atau pembahasan, bukan menyatakan manfaat “demi” seseorang.
- source_word: παρουσίας
  choice: kedatangan
  rationale: Dalam konteks eskatologis tentang Yesus, kata ini menunjuk pada kedatangan-Nya, meskipun secara lebih umum juga dapat berarti kehadiran.
- source_word: κυρίου
  choice: Tuhan
  rationale: Pilihan ini mempertahankan gelar kewibawaan dan bobot teologis κύριος dalam pemakaian Perjanjian Baru.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός di sini tetap transparan sebagai gelar. “Sang Mesias” alami dalam bahasa Indonesia dan mempertahankan makna gelarnya, sedangkan bentuk tradisional dicatat sebagai alternatif.
- source_word: ἐπισυναγωγῆς
  choice: berkumpulnya
  rationale: Nomina ini menunjuk pada tindakan atau peristiwa berkumpul menjadi satu. Pilihan ini tidak menambahkan pelaku yang mengumpulkan dan tidak memberi kesan lembaga resmi.
- source_word: ἐπ’ αὐτόν
  choice: kepada-Nya
  rationale: Frasa ini menyatakan arah atau orientasi perhimpunan itu kepada Kristus. Bentuk hormat “-Nya” sesuai dengan rujukannya.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam gelar kristologis
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa lengkap ini Χριστός masih berfungsi jelas sebagai gelar. Terjemahan utama mempertahankan artinya, sementara bentuk tradisional “Kristus” disediakan dalam catatan kaki.
- issue: Cakupan sapaan ἀδελφοί
  choice: saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk sumber yang maskulin dipertahankan dalam teks utama, tetapi kemungkinan cakupannya atas seluruh komunitas orang percaya dijelaskan tanpa membatasi jemaat hanya kepada laki-laki.
- issue: Hubungan antara kedatangan Kristus dan berkumpulnya orang percaya
  choice: dua hal yang dikoordinasikan dengan “dan” tanpa penjelasan tambahan
  alternative: berkumpulnya kita pada saat kedatangan-Nya
  rationale: Bahasa Yunani menghubungkan keduanya dengan καί, tetapi tidak menetapkan secara eksplisit hubungan waktu atau logisnya. Terjemahan tidak memasukkan skema eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan kalimat mempertahankan sifat ayat ini sebagai awal permohonan yang berlanjut ke ayat berikutnya; karena itu teks berakhir dengan koma. Penanda catatan ditempatkan langsung pada unsur yang dijelaskannya.
