  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: id
  text: Dengan mengaku memiliki pengetahuan itu[a], beberapa orang telah meleset dalam hal iman[b]. Anugerah menyertai kalian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang diakui oleh beberapa orang.” Kata ganti Yunani merujuk pada “pengetahuan” dalam ayat sebelumnya; kata kerjanya juga dapat diterjemahkan “menyatakan diri menganutnya.”'
    reason: lexical_alternative
  - marker: b
    text: “Iman” di sini kemungkinan menunjuk pada iman Kristen sebagai keseluruhan kepercayaan, tetapi dapat juga dipahami lebih luas sebagai iman pribadi.
    reason: alternative_reading
  - marker: c
    text: Kata “kalian” dalam teks Yunani berbentuk jamak. Frasa “menyertai kalian” memiliki variasi dalam naskah kuno; sebagian naskah memakai bentuk tunggal, “menyertaimu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: pengetahuan itu
  rationale: Kata ganti relatif feminin tunggal ini merujuk kembali pada “pengetahuan” dalam ayat sebelumnya. Penyebutan ulang acuannya membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: ἐπαγγελλόμενοι
  choice: mengaku memiliki
  rationale: Dalam bentuk medial dan konteks ini, kata tersebut berarti mengaku atau menyatakan diri memiliki sesuatu, bukan berjanji.
- source_word: ἠστόχησαν
  choice: telah meleset
  rationale: Pilihan ini mempertahankan gambaran dasar tentang tidak mengenai sasaran, sekaligus tetap dapat dipahami dalam ungkapan “meleset dalam hal iman”.
- source_word: περὶ τὴν πίστιν
  choice: dalam hal iman
  rationale: περί dengan akusatif menunjukkan hal atau bidang yang dibicarakan. Ungkapan ini tidak memaksa pembaca memahami iman sebagai sasaran langsung dari kata kerja.
- source_word: Ἡ χάρις
  choice: Anugerah
  rationale: Ini adalah rumusan penutup surat. “Anugerah” secara alami menyampaikan χάρις dalam konteks berkat ilahi.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kalian
  rationale: Kata kerja “menyertai” melengkapi rumusan berkat secara alami, sedangkan “kalian” mempertahankan bentuk jamak ὑμῶν.
theological_decisions:
- issue: Makna “iman” dalam peringatan
  choice: Mempertahankan kata “iman” tanpa memperluasnya menjadi “ajaran Kristen”
  alternative: Memahami “iman” secara khusus sebagai keseluruhan ajaran atau kepercayaan Kristen
  rationale: Dalam surat-surat Pastoral, ungkapan ini kemungkinan menunjuk pada iman Kristen sebagai keseluruhan kepercayaan, terutama dalam konteks ajaran keliru. Namun, bentuk Yunani tetap memungkinkan nuansa iman pribadi; terjemahan utama mempertahankan keluasan itu.
- issue: Penerima berkat penutup
  choice: Menggunakan bentuk jamak “kalian”
  alternative: Menggunakan bentuk tunggal yang hanya menunjuk kepada Timotius
  rationale: ὑμῶν berbentuk jamak, sehingga berkat penutup tampaknya mencakup komunitas yang lebih luas dan bukan hanya Timotius.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada penutup surat yang ringkas dan bermartabat. Susunan kalimat mempertahankan hubungan dengan ayat sebelumnya, metafora ἀστοχέω, ambiguitas πίστις, dan bentuk jamak pada berkat penutup.
