base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: id
  text: gesekan terus-menerus di antara orang-orang yang pikirannya telah rusak, yang telah kehilangan kebenaran, dan yang mengira bahwa kesalehan adalah sarana untuk memperoleh keuntungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesalehan adalah keuntungan” atau “sumber keuntungan.” Maksudnya, mereka memperlakukan kesalehan sebagai sesuatu yang dapat dimanfaatkan untuk memperoleh keuntungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: gesekan terus-menerus
  rationale: Kata benda ini menggambarkan tindakan saling bergesekan yang berkelanjutan dan, secara kiasan, pertikaian terus-menerus. Pilihan ini mempertahankan gambaran metaforis Yunani sambil tetap wajar dalam bahasa Indonesia.
- source_word: διεφθαρμένων ... τὸν νοῦν
  choice: yang pikirannya telah rusak
  rationale: Partisipel perfek menunjukkan keadaan yang telah dihasilkan oleh kerusakan. 'Pikiran' menyampaikan dimensi kognitif dan moral νοῦς tanpa memperkuatnya menjadi istilah doktrinal tertentu.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: yang telah kehilangan kebenaran
  rationale: Bentuk pasif perfek menyatakan keadaan akibat tidak lagi memiliki kebenaran. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan siapa pelaku yang menyebabkan kehilangan tersebut.
- source_word: νομιζόντων
  choice: karena mengira
  rationale: Partisipel ini menjelaskan anggapan keliru yang berkaitan dengan perilaku mereka. 'Mengira' secara alami menyiratkan bahwa anggapan itu salah; 'karena' membuat hubungan penjelasnya jelas dalam bahasa Indonesia.
- source_word: πορισμὸν
  choice: sarana untuk memperoleh keuntungan
  rationale: Kata ini dapat berarti keuntungan atau sarana mendapat keuntungan. Pilihan ini menyampaikan bahwa kesalehan diperlakukan secara instrumental untuk mendatangkan manfaat, terutama keuntungan material dalam konteks ini.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: Dalam surat-surat Pastoral, istilah ini menunjuk pada hidup penuh hormat dan pengabdian kepada Allah. 'Kesalehan' mempertahankan nilai positif istilah itu; masalahnya terletak pada penyalahgunaannya sebagai sarana keuntungan.
theological_decisions:
- issue: Apakah εὐσέβεια menunjuk pada pengabdian sejati atau sekadar praktik agama lahiriah
  choice: kesalehan
  alternative: agama; ibadah lahiriah
  rationale: Istilah Yunaninya sendiri bernilai positif dan tidak seharusnya direduksi menjadi formalitas agama. Sikap orang-orang itulah yang salah karena menjadikannya sarana keuntungan.
- issue: Seberapa kuat keadaan moral διεφθαρμένων perlu dinyatakan
  choice: pikirannya telah rusak
  alternative: bejat pikirannya
  rationale: '''Telah rusak'' mempertahankan kecaman moral dan aspek keadaan yang dihasilkan oleh bentuk perfek, tanpa menambahkan muatan yang lebih keras daripada istilah sumber.'
- issue: Apakah ἀπεστερημένων harus menyatakan pelaku perampasan
  choice: telah kehilangan kebenaran
  alternative: telah dirampas dari kebenaran; telah kehilangan pegangan pada kebenaran
  rationale: Teks memakai bentuk pasif tetapi tidak menyebut pelakunya. Terjemahan dipilih agar tidak menambahkan pelaku atau penjelasan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Gesekan terus-menerus' mempertahankan metafora khas διαπαρατριβαί; konteks membuat makna pertikaiannya dapat dipahami. Penanda catatan kaki ditempatkan langsung setelah klausa yang dijelaskannya.
