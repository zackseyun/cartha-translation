  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: id
  text: Sebab kita tidak membawa apa pun ke dalam dunia ini[a], dan kita pun tidak dapat membawa apa pun ke luar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Sebab kita tidak membawa apa pun ke dalam dunia ini, karena kita pun tidak dapat membawa apa pun ke luar.” Konjungsi Yunani dapat dipahami secara kausal (“karena”) atau sebagai pengantar bagi pernyataan kedua yang sejajar.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: tidak ... apa pun
  rationale: Mengungkapkan penyangkalan mutlak sebagai objek dari verba ‘membawa’ dengan susunan yang alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan logis ayat.
- source_word: εἰσηνέγκαμεν
  choice: membawa ... ke dalam
  rationale: Menerjemahkan verba εἰσφέρω secara langsung sekaligus mempertahankan gambaran masuk ke dunia saat lahir.
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia ini
  rationale: κόσμος di sini menunjuk pada dunia tempat manusia hidup; penambahan ‘ini’ bersifat idiomatis dan memperjelas pasangan dengan ‘ke luar’ tanpa mengubah acuannya.
- source_word: ὅτι
  choice: dan
  rationale: Dalam pernyataan bernada pepatah ini, konjungsi dipahami sebagai pengantar bagi klausa kedua yang sejajar. Kemungkinan makna kausal tetap dicatat dalam catatan kaki.
- source_word: οὐδὲ
  choice: pun tidak ... apa pun
  rationale: ‘Pun’ menonjolkan kesejajaran negatif dengan klausa pertama dan menyampaikan daya ‘juga tidak/tidak pula’ secara alami.
- source_word: ἐξενεγκεῖν
  choice: membawa ... ke luar
  rationale: Mempertahankan citra kebalikan dari ‘membawa ke dalam’, yakni meninggalkan dunia tanpa membawa sesuatu.
- source_word: τι
  choice: apa pun
  rationale: Pronomina tak tentu di bawah penyangkalan paling alami diterjemahkan ‘apa pun’.
- source_word: δυνάμεθα
  choice: kita ... tidak dapat
  rationale: Menyampaikan makna kemampuan dari δύναμαι secara jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan klausa kedua yang diperkenalkan oleh ὅτι
  choice: 'Kelanjutan sejajar: ‘dan kita pun tidak dapat membawa apa pun ke luar’'
  alternative: 'Hubungan kausal: ‘karena kita pun tidak dapat membawa apa pun ke luar’'
  rationale: Bentuk Yunani dengan ὅτι memungkinkan pembacaan kausal, tetapi konteksnya juga mendukung dua pernyataan seimbang yang bersifat pepatah. Teks utama memakai hubungan koordinatif yang alami, sedangkan ambiguitas aslinya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan ‘membawa apa pun’ serta pasangan ‘ke dalam/ke luar’ mempertahankan keseimbangan retoris teks Yunani.
