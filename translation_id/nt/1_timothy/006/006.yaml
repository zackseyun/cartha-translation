  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: id
  text: Namun, hidup saleh yang disertai rasa cukup adalah keuntungan besar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laba besar” atau “sarana besar untuk memperoleh keuntungan.” Kata Yunani yang dipakai berkaitan dengan keuntungan atau laba dan menggemakan ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kecukupan” atau “kemandirian.” Dalam konteks ini, maksudnya kemungkinan besar ialah merasa cukup, bukan mengandalkan diri sendiri terlepas dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan anggapan pada ayat sebelumnya bahwa kesalehan merupakan sarana untuk memperoleh keuntungan.
- source_word: πορισμὸς
  choice: keuntungan
  rationale: Mempertahankan arti keuntungan atau laba sekaligus menggemakan pemakaian kata yang serumpun dalam ayat sebelumnya.
- source_word: μέγας
  choice: besar
  rationale: Padanan langsung dan alami yang mempertahankan penilaian kuat dalam frasa 'keuntungan besar'.
- source_word: ἡ εὐσέβεια
  choice: hidup saleh
  rationale: Mengungkapkan kehidupan yang menghormati dan tertuju kepada Allah dengan bahasa Indonesia modern, bukan sekadar kesalehan lahiriah.
- source_word: μετὰ
  choice: yang disertai
  rationale: Menyatakan hubungan penyertaan secara jelas dan alami dalam struktur kalimat Indonesia.
- source_word: αὐταρκείας
  choice: rasa cukup
  rationale: Dalam konteks ayat 7–8, istilah ini menunjuk pada kepuasan terhadap kecukupan yang ada, bukan kemandirian mutlak dari Allah.
theological_decisions:
- issue: Makna αὐτάρκεια dalam konteks Kristen
  choice: rasa cukup
  alternative: kemandirian; kecukupan
  rationale: Konteks langsung menjelaskannya sebagai sikap merasa cukup dengan kebutuhan pokok, bukan cita-cita filosofis tentang kemandirian otonom.
- issue: Hubungan antara kesalehan dan keuntungan
  choice: hidup saleh yang disertai rasa cukup itu sendiri adalah keuntungan besar
  alternative: kesalehan menjadi sarana memperoleh keuntungan besar bila disertai rasa cukup
  rationale: Konstruksi Yunani memungkinkan nuansa 'keuntungan' maupun 'sarana memperoleh keuntungan'. Teks utama mempertahankan pembacaan predikatif yang paling alami dalam konteks, sedangkan ambiguitas leksikal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Ungkapan 'hidup saleh' dipilih agar εὐσέβεια terdengar alami bagi pembaca umum dan menekankan pola hidup, sedangkan 'rasa cukup' menghindari kesan otonomi yang dapat muncul dari 'kemandirian'.
