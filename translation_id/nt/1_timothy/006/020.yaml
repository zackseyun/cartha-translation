id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: id
  text: Hai Timotius, jagalah apa yang telah dipercayakan kepadamu. Berpalinglah dari percakapan kosong yang tidak kudus dan pertentangan[a] dari apa yang secara keliru disebut “pengetahuan”[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bantahan” atau “oposisi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari apa yang disebut-sebut sebagai pengetahuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Hai Timotius
  rationale: Partikel vokatif Ὦ memberi tekanan pada sapaan langsung. 'Hai Timotius' mempertahankan nuansa khidmat dan tegas dalam bahasa Indonesia modern tanpa terdengar terlalu kuno.
- source_word: τὴν παραθήκην
  choice: apa yang telah dipercayakan kepadamu
  rationale: παραθήκη menunjuk pada sesuatu yang diserahkan kepada seseorang untuk dijaga. Ungkapan ini menyampaikan maknanya secara alami tanpa mempersempit isinya menjadi Injil, ajaran, atau tugas pelayanan tertentu.
- source_word: φύλαξον
  choice: jagalah
  rationale: Bentuk imperatif ini menuntut pemeliharaan yang waspada atas sesuatu yang dipercayakan; 'jagalah' tepat dan alami.
- source_word: ἐκτρεπόμενος
  choice: Berpalinglah dari
  rationale: Partisip ini menyatakan tindakan menghindar dengan berbalik atau menyimpang dari sesuatu. Kalimat perintah tersendiri menghasilkan bahasa Indonesia yang alami sambil mempertahankan citra verbalnya.
- source_word: βεβήλους κενοφωνίας
  choice: omongan kosong yang tidak kudus
  rationale: κενοφωνία adalah perkataan hampa, sedangkan βέβηλος menandai sesuatu yang tidak kudus atau profan. 'Omongan kosong' mudah dipahami, dan 'tidak kudus' mempertahankan pertentangan religius dengan yang kudus.
- source_word: ἀντιθέσεις
  choice: berbagai bantahan
  rationale: Kata ini dapat berarti pertentangan, sanggahan, atau pernyataan yang berlawanan. 'Berbagai bantahan' cocok dengan konteks polemis, sementara alternatif 'pertentangan' dicatat karena ambiguitas leksikalnya.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: dari apa yang secara keliru disebut pengetahuan
  rationale: ψευδώνυμος berarti menyandang nama yang palsu atau disebut secara keliru. Terjemahan ini menegaskan bahwa sebutan 'pengetahuan' ditolak sebagai tidak sah, tanpa menentukan sistem ajaran tertentu.
theological_decisions:
- issue: Isi παραθήκη yang dipercayakan kepada Timotius
  choice: Diterjemahkan secara umum sebagai 'apa yang telah dipercayakan kepadamu'.
  alternative: Injil; ajaran para rasul; amanat pelayanan Timotius
  rationale: Konteks mungkin menunjuk pada berita atau ajaran rasuli, tetapi ayat ini sendiri tidak menyebutkan isinya. Terjemahan tidak mempersempit rujukan yang dibiarkan umum oleh teks.
- issue: Hubungan ἀντιθέσεις dengan γνώσεως
  choice: Dipertahankan sebagai bantahan yang berasal dari atau menjadi ciri apa yang secara keliru disebut pengetahuan.
  alternative: Memahami ἀντιθέσεις sebagai judul teknis atau nama suatu sistem ajaran tertentu
  rationale: Bentuk genitif mendukung hubungan tersebut, tetapi teks tidak cukup jelas untuk menetapkan rujukan historis atau aliran tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang khidmat dan tegas. 'Hai' mempertahankan tekanan sapaan; 'omongan kosong' dipilih karena jelas bagi pembaca umum, sedangkan 'tidak kudus' menjaga bobot religius βέβηλος. Semua penanda catatan kaki muncul dalam teks utama.
