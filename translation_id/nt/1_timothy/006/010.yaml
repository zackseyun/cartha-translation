id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: id
  text: Sebab cinta akan uang merupakan salah satu akar dari segala macam kejahatan[a]. Karena mengejar cinta akan uang, beberapa orang telah menyimpang dari iman[b] dan menikam diri sendiri hingga mengalami banyak penderitaan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan tradisional, “Sebab cinta akan uang adalah akar segala kejahatan.” Namun, bahasa Yunani lebih wajar dipahami sebagai “salah satu akar dari segala macam kejahatan,” sehingga tidak menyiratkan bahwa setiap kejahatan mempunyai satu penyebab saja.
    reason: alternative_reading
  - marker: b
    text: Atau “telah tersesat dari iman.” Di sini “iman” kemungkinan menunjuk pada iman Kristen sebagai ajaran atau pengakuan yang dianut.
    reason: lexical_alternative
  - marker: c
    text: Atau “menikam diri sendiri dengan banyak dukacita” atau “dengan banyak kesengsaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: salah satu akar
  rationale: Kata ῥίζα tidak memakai artikel dan berfungsi sebagai predikat sebelum verba. Ungkapan ini paling wajar dipahami sebagai satu akar atau sumber, bukan satu-satunya akar dari setiap kejahatan.
- source_word: πάντων τῶν κακῶν
  choice: dari segala macam kejahatan
  rationale: Bentuk jamak κακῶν mencakup berbagai hal atau perbuatan jahat. 'Segala macam kejahatan' menyampaikan cakupan luas tanpa menjadikan cinta akan uang penyebab mutlak setiap kejahatan.
- source_word: φιλαργυρία
  choice: cinta akan uang
  rationale: Kata majemuk ini secara khusus menunjuk pada kecintaan terhadap uang atau perak. Pilihan ini lebih transparan dan lebih sempit daripada 'keserakahan' yang dapat mencakup objek lain.
- source_word: ὀρεγόμενοι
  choice: karena mendambakannya
  rationale: Partisip ini menyatakan hasrat kuat yang diarahkan kepada cinta akan uang atau uang sebagai objeknya. 'Mendambakan' mempertahankan intensitas keinginan serta kaitan sebab atau keadaan dengan tindakan menyimpang.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: telah menyimpang dari iman
  rationale: Verba ini menggambarkan tersesat atau bergerak menjauh dari suatu posisi. Bentuk Indonesia ini alami dan mempertahankan gambaran penyimpangan dari iman.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks Surat-Surat Pastoral, frasa berartikel τῆς πίστεως sangat mungkin menunjuk pada iman Kristen sebagai pengakuan atau ajaran yang dianut. Bahasa Indonesia tidak memerlukan artikel tertentu untuk menyampaikan makna tersebut.
- source_word: περιέπειραν
  choice: menikam diri mereka sendiri
  rationale: Verba ini secara harfiah berarti menusuk atau menembus. Pilihan ini mempertahankan metafora yang keras dan bentuk refleksif ἑαυτούς.
- source_word: ὀδύναις πολλαῖς
  choice: dengan banyak penderitaan
  rationale: ὀδύνη dapat menunjuk pada rasa sakit, dukacita, atau derita berat. 'Penderitaan' cukup luas untuk mempertahankan kemungkinan penderitaan batin maupun bentuk kesusahan lain.
theological_decisions:
- issue: Cakupan pernyataan tentang cinta akan uang dan kejahatan
  choice: Cinta akan uang adalah salah satu akar dari segala macam kejahatan.
  alternative: Cinta akan uang adalah akar segala kejahatan.
  rationale: Ketiadaan artikel pada ῥίζα dan bentuk jamak πάντων τῶν κακῶν mendukung pembacaan yang tidak menyatakan bahwa cinta akan uang merupakan satu-satunya penyebab setiap kejahatan.
- issue: Makna τῆς πίστεως
  choice: Iman Kristen sebagai iman atau pengakuan yang dianut
  alternative: Kepercayaan pribadi atau tindakan percaya secara subjektif
  rationale: Artikel Yunani dan pemakaian istilah ini dalam Surat-Surat Pastoral mendukung makna objektif, tetapi teks utama memakai 'iman' agar ungkapan Indonesia tetap alami dan tidak menutup sepenuhnya nuansa personalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Metafora akar, penyimpangan, dan tikaman dipertahankan. Susunan kalimat dibagi menjadi dua demi keterbacaan, tanpa mengubah hubungan sebab dan akibat dalam teks Yunani.
