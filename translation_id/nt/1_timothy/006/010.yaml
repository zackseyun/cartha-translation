- from: Sebab cinta akan uang merupakan salah satu akar dari segala macam kejahatan[a]. Karena mendambakannya, beberapa orang telah menyimpang dari iman[b] dan menikam diri mereka sendiri dengan banyak penderitaan[c].
  to: Sebab cinta akan uang merupakan salah satu akar dari segala macam kejahatan[a]. Karena mengejar cinta akan uang, beberapa orang telah menyimpang dari iman[b] dan menikam diri sendiri hingga mengalami banyak penderitaan[c].
  rationale: Revisi menjernihkan bahwa objek hasrat dalam klausa relatif adalah “cinta akan uang,” sesuai anteseden ἧς, dan memperhalus ungkapan metafora penikaman agar alami dalam bahasa Indonesia sambil tetap mempertahankan gagasan bahwa mereka sendiri mengalami banyak penderitaan. Catatan kaki c disesuaikan agar alternatifnya membentuk kalimat Indonesia yang lengkap dan tetap mencerminkan kemungkinan “dukacita” atau “kesengsaraan” untuk ὀδύναις.
