    issue: Rujukan relatif dalam “Karena mendambakannya” kurang jelas.
    rationale: ἧς adalah bentuk feminin tunggal yang merujuk kepada φιλαργυρία, “cinta akan uang,” bukan langsung kepada χρήματα/uang. Pemakaian “mengejar cinta akan uang” membuat rujukan itu tetap tampak dalam bahasa Indonesia.
