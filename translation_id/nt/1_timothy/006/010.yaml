  source_fidelity: Terjemahan dengan tepat menyatakan bahwa φιλαργυρία adalah salah satu akar dari beragam kejahatan, bukan satu-satunya akar segala kejahatan. Makna τῆς πίστεως sebagai iman Kristen juga tersampaikan. Namun, “Karena mendambakannya” dapat secara alami dipahami merujuk kepada uang, padahal ἧς secara gramatikal merujuk kepada φιλαργυρία (cinta akan uang).
  naturalness: Bahasa umumnya baku dan jelas. “Menikam diri mereka sendiri dengan banyak penderitaan” mempertahankan metafora, tetapi agak janggal dalam bahasa Indonesia karena penderitaan bukan alat tikam yang lazim. “Menikam diri sendiri ... hingga mengalami banyak penderitaan” mempertahankan kekerasan gambarnya sambil menghasilkan konstruksi yang lebih alami.
  terminology: “Cinta akan uang,” “segala macam kejahatan,” dan “iman” cocok untuk bahasa Indonesia baku serta konteks istilah Yunani. Catatan tentang “iman” sebagai iman Kristen/ajaran yang dianut membantu menjelaskan kemungkinan makna objektif tanpa memaksakannya ke dalam teks utama.
