  text: yang akan Dia nyatakan pada waktu-waktu yang ditetapkan-Nya[a]—Yang Mahabahagia dan satu-satunya Penguasa, Raja atas mereka yang memerintah dan Tuhan atas mereka yang berkuasa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “pada waktu-waktu-Nya sendiri”; ungkapan ini menunjuk pada waktu-waktu yang ditetapkan oleh-Nya.'
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “Raja segala raja dan Tuhan segala tuan.” Bahasa Yunani memakai bentuk partisip, secara harfiah “Raja atas mereka yang memerintah dan Tuhan atas mereka yang berkuasa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: yang
  rationale: Kata ganti relatif feminin tunggal ini merujuk kembali kepada ἐπιφάνειαν (‘penampakan’) dalam ayat 14. Bahasa Indonesia cukup memakai ‘yang’ tanpa menambahkan anteseden pribadi.
- source_word: καιροῖς ἰδίοις
  choice: pada waktu-waktu yang telah ditetapkan-Nya
  rationale: Bentuk jamak καιροῖς dipertahankan sebagai ‘waktu-waktu’. Dalam konteks ini ἰδίοις menunjuk pada waktu yang menjadi ketetapan-Nya; terjemahan ini lebih alami daripada ungkapan harfiah ‘waktu-waktu-Nya sendiri’, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: δείξει
  choice: akan Dia nyatakan
  rationale: Bentuk futur aktif δείκνυμι berarti memperlihatkan atau membuat tampak. ‘Menyatakan’ alami dalam konteks penampakan Kristus dan tetap menyampaikan tindakan menjadikannya nyata atau terlihat.
- source_word: ὁ μακάριος
  choice: Dia yang penuh bahagia
  rationale: μακάριος dipakai secara substantival sebagai gelar ilahi. ‘Penuh bahagia’ menyampaikan keadaan yang diberkati dan sempurna tanpa memakai ‘bahagia’ secara ringan atau sehari-hari.
- source_word: μόνος δυνάστης
  choice: satu-satunya Penguasa
  rationale: δυνάστης menunjuk kepada pribadi yang memegang kuasa pemerintahan. ‘Penguasa’ jelas dan bermartabat, sedangkan μόνος dipertahankan sebagai ‘satu-satunya’.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: Raja atas mereka yang memerintah
  rationale: βασιλευόντων adalah partisip verbal, secara harfiah ‘mereka yang memerintah sebagai raja’. Rumusan ini mempertahankan daya verbalnya dan memakai ‘atas’ untuk menyatakan keunggulan sang Raja.
- source_word: κύριος τῶν κυριευόντων
  choice: Tuhan atas mereka yang berkuasa
  rationale: κύριος diterjemahkan sebagai gelar ‘Tuhan’, sedangkan κυριευόντων adalah partisip yang berarti menjalankan kekuasaan atau dominasi. ‘Mereka yang berkuasa’ alami dalam bahasa Indonesia dan tidak mengubah partisip itu menjadi nomina ‘tuan-tuan’.
theological_decisions:
- issue: Identitas subjek yang akan menyatakan penampakan itu
  choice: Subjek tidak disebut dengan nama tambahan, tetapi diperkenalkan melalui gelar-gelar yang terdapat dalam teks Yunani.
  alternative: Menjelaskan secara eksplisit bahwa Allah Bapa akan menyatakan penampakan Yesus Kristus.
  rationale: Susunan Yunani menempatkan gelar ‘yang penuh bahagia dan satu-satunya Penguasa’ sebagai subjek δείξει. Terjemahan membiarkan konteks dan gelar-gelar itu mengidentifikasi-Nya, tanpa memasukkan penjelasan teologis yang tidak dinyatakan langsung dalam ayat ini.
- issue: Bentuk partisip dalam kedua gelar terakhir
  choice: Mempertahankan ‘mereka yang memerintah’ dan ‘mereka yang berkuasa’.
  alternative: Memakai rumusan tradisional ‘Raja segala raja dan Tuhan segala tuan’.
  rationale: Pilihan utama mencerminkan bentuk verbal βασιλευόντων dan κυριευόντων serta mempertahankan paralelisme Yunani; rumusan tradisional tetap diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa dibuat modern, wajar, dan bermartabat. Fragmen diawali huruf kecil dan diakhiri koma karena ayat ini melanjutkan kalimat dari ayat 14 ke ayat 16. Huruf kapital dipakai pada gelar-gelar ilahi dan pronomina enklitik yang merujuk kepada Allah.
