review_pass:
  verdict: revise
  source_fidelity: Makna pokok terjaga, tetapi “Dengan demikian, mereka menimbun ... suatu dasar” kurang tepat menangkap fungsi partisipel ἀποθησαυρίζοντας sebagai hasil/cara dari perintah sebelumnya dan sangat tidak alami dalam bahasa Indonesia. “Mengumpulkan harta ... sebagai dasar” mempertahankan citra menimbun harta dan dasar tanpa mengubah makna. Untuk ἐπιλάβωνται, “memegang erat” lebih dekat dengan citra ‘mengambil/berpegang’ daripada “berpegang pada,” yang dalam bahasa Indonesia mudah dipahami sebagai berpegang pada prinsip atau pendirian.
  naturalness: 'Teks revisi memakai susunan yang lazim dan jelas dalam bahasa Indonesia baku: “Dengan melakukan itu” merujuk pada tindakan yang diperintahkan dalam ayat sebelumnya, sedangkan “untuk masa depan” lebih idiomatis daripada “untuk masa mendatang.”'
  terminology: “Dasar yang baik,” “masa depan,” dan “kehidupan yang sesungguhnya” mempertahankan metafora serta penegasan kualitatif θεμέλιον καλόν dan τῆς ὄντως ζωῆς. “Kehidupan” lebih sesuai daripada “hidup” sebagai nomina setelah “memegang erat.”
  issues:
  - severity: medium
    issue: Hubungan partisipel dan kolokasi “menimbun ... suatu dasar”
    rationale: ἀποθησαυρίζοντας melanjutkan perintah ayat 18 dan secara harfiah memang dipadukan dengan θεμέλιον, tetapi “menimbun suatu dasar” terasa ganjil dalam bahasa Indonesia. “Dengan melakukan itu, mereka mengumpulkan harta bagi diri mereka sendiri sebagai dasar ...” menyampaikan fungsi dan metafora Yunani secara alami.
  - severity: medium
    issue: “Berpegang pada hidup” kurang jelas untuk ἐπιλάβωνται
    rationale: Dalam pemakaian modern, “berpegang pada” terutama berarti memegang suatu prinsip, keyakinan, atau aturan. “Memegang erat kehidupan” mempertahankan daya gambar kata kerja Yunani tanpa menggesernya menjadi sekadar ‘memperoleh’.
  - severity: low
    issue: Catatan kaki pada “masa mendatang” tidak diperlukan
    rationale: Catatan yang hanya memberi “untuk apa yang akan datang” tidak menyediakan alternatif yang lebih harfiah atau bermakna bagi pembaca, dan tidak mencerminkan catatan audit bahasa Inggris yang terkait dengan frasa ζωή. Karena tidak diperlukan untuk menerjemahkan ambiguitas sumber, catatan dihapus.
  revised_text: Dengan melakukan itu, mereka mengumpulkan harta bagi diri mereka sendiri sebagai dasar yang baik untuk masa depan, supaya mereka dapat memegang erat kehidupan yang sesungguhnya.
