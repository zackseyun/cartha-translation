  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: id
  text: Dengan melakukan itu, mereka mengumpulkan harta bagi diri mereka sendiri sebagai dasar yang baik untuk masa depan, supaya mereka dapat memegang erat kehidupan yang sesungguhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: menimbun
  rationale: Partisipel ini melanjutkan nasihat pada ayat sebelumnya dan memakai gambaran mengumpulkan harta. “Menimbun” mempertahankan gambaran tersebut dengan bahasa Indonesia modern.
- source_word: ἑαυτοῖς
  choice: bagi diri mereka sendiri
  rationale: Pronomina refleksif datif menyatakan bahwa hasil tindakan itu menjadi keuntungan bagi para pelakunya.
- source_word: θεμέλιον καλὸν
  choice: suatu dasar yang baik
  rationale: Terjemahan ini mempertahankan metafora bangunan θεμέλιον dan arti καλόν sebagai baik, kokoh, atau bernilai. Perpaduan metafora menimbun dan dasar juga dipertahankan sebagaimana dalam bahasa Yunani.
- source_word: εἰς τὸ μέλλον
  choice: untuk masa mendatang
  rationale: Frasa ini menunjuk kepada apa yang akan datang tanpa secara eksplisit menyebut zaman atau dunia yang akan datang.
- source_word: ἐπιλάβωνται
  choice: dapat berpegang pada
  rationale: Pilihan ini mempertahankan gambaran mengambil atau memegang erat, tanpa mereduksinya menjadi sekadar memperoleh.
- source_word: τῆς ὄντως ζωῆς
  choice: hidup yang sesungguhnya
  rationale: ὄντως menegaskan hidup yang benar-benar nyata atau sejati. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nomina ζωή.
theological_decisions:
- issue: Apakah εἰς τὸ μέλλον harus diterjemahkan secara khusus sebagai rujukan eskatologis
  choice: untuk masa mendatang
  alternative: untuk zaman yang akan datang
  rationale: Konteksnya memiliki gaung eskatologis, tetapi frasa Yunani tidak secara eksplisit menyebut “zaman”. Terjemahan utama mempertahankan keluasan maknanya.
- issue: Cara menyatakan τῆς ὄντως ζωῆς
  choice: hidup yang sesungguhnya
  alternative: hidup yang benar-benar hidup
  rationale: Pilihan utama menyatakan kontras antara kekayaan sekarang dan hidup sejati tanpa menjelaskan lebih jauh hakikat hidup itu atau menghilangkan ketegangan teologisnya.
- issue: Hubungan partisipel dengan nasihat pada ayat sebelumnya
  choice: Dengan demikian, mereka menimbun
  alternative: sambil menimbun
  rationale: “Dengan demikian” membuat kesinambungan sintaksis dengan ayat sebelumnya dapat dipahami ketika ayat ini dibaca tersendiri, tanpa mengubah hubungan tindakan yang dinyatakan partisipel.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan metafora yang agak tegang dalam teks Yunani: menimbun suatu dasar.'
