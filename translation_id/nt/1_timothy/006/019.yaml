revisions:
- from: Dengan demikian, mereka menimbun bagi diri mereka sendiri suatu dasar yang baik untuk masa mendatang[a], supaya mereka dapat berpegang pada hidup yang sesungguhnya.
  to: Dengan melakukan itu, mereka mengumpulkan harta bagi diri mereka sendiri sebagai dasar yang baik untuk masa depan, supaya mereka dapat memegang erat kehidupan yang sesungguhnya.
  rationale: Revisi memperjelas hubungan dengan nasihat sebelumnya, menata metafora Yunani yang disengaja—mengumpulkan harta sebagai dasar—ke dalam kolokasi Indonesia yang alami, dan mempertahankan gambaran aktif pada ἐπιλάβωνται. Tidak ada penafsiran eskatologis tambahan atau penetapan doktrinal.
