id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: id
  text: Namun, orang-orang yang ingin menjadi kaya[a] jatuh ke dalam godaan, jerat[b], dan banyak keinginan yang bodoh serta mencelakakan, yang menenggelamkan manusia ke dalam kehancuran dan kebinasaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaya.” Kata Yunani dapat menunjuk pada keadaan kaya maupun menjadi kaya.
    reason: lexical_alternative
  - marker: b
    text: Atau “perangkap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Namun, orang-orang yang ingin
  rationale: βούλομαι menyatakan keinginan atau niat yang cukup menetap. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras yang ditandai δέ.
- source_word: πλουτεῖν
  choice: menjadi kaya
  rationale: Infinitif ini dapat menunjuk pada berada dalam keadaan kaya ataupun menjadi kaya. Dalam konteks orang yang menginginkannya, 'menjadi kaya' paling alami dan menonjolkan aspirasi tanpa mengecam kepemilikan harta itu sendiri.
- source_word: ἐμπίπτουσιν
  choice: jatuh ke dalam
  rationale: Mempertahankan metafora masuk ke dalam keadaan berbahaya dan merupakan ungkapan Indonesia yang wajar.
- source_word: πειρασμόν
  choice: godaan
  rationale: Dalam konteks peringatan moral ini, kata tersebut lebih menunjuk pada dorongan menuju dosa daripada ujian yang netral.
- source_word: παγίδα
  choice: jerat
  rationale: '''Jerat'' mempertahankan gambaran tentang perangkap dan nuansa bahaya moral.'
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: banyak keinginan yang bodoh serta mencelakakan
  rationale: '''Keinginan'' cukup luas untuk ἐπιθυμία; ''bodoh'' menyampaikan ἀνόητος, sedangkan ''mencelakakan'' menyatakan daya merusak βλαβερός, bukan sekadar sifat abstrak.'
- source_word: αἵτινες
  choice: yang
  rationale: Kata ganti relatif ini kembali kepada berbagai keinginan dan memperkenalkan akibat khas yang ditimbulkannya.
- source_word: βυθίζουσι
  choice: menenggelamkan
  rationale: Mempertahankan gambaran kuat tentang menyebabkan seseorang tenggelam atau terbenam.
- source_word: τοὺς ἀνθρώπους
  choice: manusia
  rationale: ἄνθρωποι dipakai secara generik bagi umat manusia, bukan khusus laki-laki.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: keruntuhan dan kebinasaan
  rationale: 'Dua istilah dibedakan agar intensifikasi pasangan Yunani tetap terdengar: ὄλεθρος sebagai keruntuhan atau kehancuran yang dahsyat dan ἀπώλεια sebagai kebinasaan.'
theological_decisions:
- issue: Apakah ὄλεθρον καὶ ἀπώλειαν harus diterjemahkan secara khusus sebagai penghukuman kekal
  choice: keruntuhan dan kebinasaan
  alternative: kehancuran dan hukuman kekal
  rationale: Bahasa Yunani menegaskan akibat yang sangat berat, tetapi ayat ini sendiri tidak menentukan secara eksplisit bahwa kedua istilah tersebut khusus berarti penghukuman kekal. Terjemahan mempertahankan bobot peringatan tanpa mempersempit cakupannya secara doktrinal.
- issue: Apakah ayat ini mengecam orang kaya atau hasrat untuk menjadi kaya
  choice: orang-orang yang ingin menjadi kaya
  alternative: orang-orang kaya
  rationale: Bentuk partisipial bersama infinitif berfokus pada keinginan atau niat untuk menjadi kaya, bukan pada keadaan memiliki kekayaan semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. 'Godaan' dipilih daripada 'pencobaan' untuk menghindari kesan ujian netral; 'jerat' dan 'menenggelamkan' mempertahankan gambaran hidup dari teks Yunani.
