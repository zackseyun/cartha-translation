  to: Semua budak yang berada di bawah kuk hendaklah menganggap tuan mereka sendiri layak menerima segala penghormatan, supaya nama Allah dan ajaran tidak dihujat.[a]
  rationale: Revisi membetulkan potensi nuansa proses dalam «menjadi budak», memperlancar gaya Indonesia baku, dan menyesuaikan alternatif catatan kaki dengan cakupan makna βλασφημέω. Makna sosial-historis dan metafora ketundukan dalam teks sumber tetap dipertahankan.
