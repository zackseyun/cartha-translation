  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: id
  text: Semua budak yang berada di bawah kuk hendaklah menganggap tuan mereka sendiri layak menerima segala penghormatan, supaya nama Allah dan ajaran tidak dihujat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dicela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: budak
  rationale: Frasa ὑπὸ ζυγὸν menegaskan keadaan perbudakan, sehingga “budak” lebih tepat daripada “pelayan” dalam konteks ini.
- source_word: ὑπὸ ζυγὸν
  choice: di bawah kuk
  rationale: Mempertahankan metafora Yunani tentang ketundukan dan keterikatan secara jelas dan alami dalam bahasa Indonesia.
- source_word: τοὺς ἰδίους δεσπότας
  choice: tuan mereka sendiri
  rationale: “Tuan” menyatakan pihak yang berkuasa atas budak dalam rumah tangga, sedangkan “mereka sendiri” mempertahankan ἰδίους.
- source_word: πάσης τιμῆς ἀξίους
  choice: layak menerima segala penghormatan
  rationale: Menyampaikan cakupan πάσης dan konstruksi kelayakan secara wajar dalam bahasa Indonesia.
- source_word: ἡγείσθωσαν
  choice: harus menganggap
  rationale: Mencerminkan daya imperatif kini yang menyerukan sikap penilaian yang berkelanjutan.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: nama Allah
  rationale: Padanan baku yang mempertahankan gagasan tentang nama, reputasi, dan identitas Allah.
- source_word: ἡ διδασκαλία
  choice: ajaran itu
  rationale: “Ajaran” merupakan padanan modern dan mudah dipahami; kata penunjuk mencerminkan artikel Yunani dan menunjuk pada ajaran yang dikenal dalam konteks.
- source_word: βλασφημῆται
  choice: dihujat
  rationale: Kata ini mempertahankan bobot βλασφημέω dan dapat mencakup pencelaan terhadap nama Allah maupun ajaran.
- source_word: Ὅσοι εἰσὶν
  choice: Semua orang yang menjadi
  rationale: Mengungkapkan daya inklusif ὅσοι dengan susunan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan δοῦλοι dalam konteks sosial yang peka
  choice: budak
  alternative: hamba; pelayan
  rationale: Teks menggambarkan status perbudakan secara eksplisit melalui ungkapan “di bawah kuk.” Pilihan ini mencerminkan realitas sosial yang disebut teks tanpa menyatakan persetujuan moral terhadap perbudakan.
- issue: Penerjemahan διδασκαλία
  choice: ajaran itu
  alternative: doktrin itu
  rationale: “Ajaran” akurat dan lebih mudah dipahami, tanpa menambahkan nuansa teknis-teologis yang tidak diwajibkan oleh kata Yunani.
- issue: Penerjemahan βλασφημῆται dengan dua subjek yang berbeda
  choice: dihujat
  alternative: dicela; difitnah
  rationale: “Dihujat” menjaga kekuatan istilah sumber dan cocok terutama dengan “nama Allah,” meski “dicela” dapat terdengar lebih umum ketika diterapkan juga pada ajaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “di bawah kuk” dipertahankan karena penting bagi makna, sementara susunan kalimat dibuat alami bagi pembaca umum.
