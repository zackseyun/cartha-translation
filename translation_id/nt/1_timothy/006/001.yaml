  source_fidelity: 'Draf pada umumnya setia pada teks Yunani: δοῦλοι diterjemahkan «budak», metafora ὑπὸ ζυγόν dipertahankan, ἰδίους δεσπότας disampaikan sebagai «tuan mereka sendiri», dan tujuan agar nama Allah serta ajaran tidak βλασφημῆται terjaga. Namun, «yang menjadi budak di bawah kuk» dapat menyiratkan proses menjadi budak, bukan keadaan orang-orang yang sudah berstatus budak dan berada di bawah kuk.'
  naturalness: Kalimat perlu sedikit dirapikan agar baku dan alami dalam bahasa Indonesia modern. «Semua budak yang berada di bawah kuk» langsung menyatakan status dan kondisi yang dimaksud. «Hendaklah» menyampaikan imperatif kini secara jelas tanpa nuansa legalistik berlebihan.
  terminology: «Budak», «kuk», «tuan», «penghormatan», «nama Allah», dan «ajaran» tepat untuk konteks ini. «Ajaran» lebih alami daripada «ajaran itu» dalam ayat yang berdiri sendiri; artikel Yunani tidak selalu memerlukan penanda definiteness dalam bahasa Indonesia. «Dihujat» dapat mencakup nama Allah dan ajaran, tetapi alternatif «difitnah» terlalu sempit karena βλασφημέω terutama menunjuk pada ujaran yang mencela atau menghina, bukan niscaya tuduhan palsu.
