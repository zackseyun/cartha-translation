  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: id
  text: Namun engkau, hai manusia Allah, larilah menjauh dari hal-hal ini; sebaliknya, kejarlah kebenaran[a], kesalehan, iman[b], kasih, ketekunan, dan kelemahlembutan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kesetiaan” atau “kepercayaan.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Yunani yang langka ini juga dapat dipahami sebagai “kelembutan yang sabar” atau “sikap menahan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Namun engkau
  rationale: Mempertahankan penekanan pada kata ganti orang kedua dan pertentangan kuat dengan uraian sebelumnya, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: hai manusia Allah
  rationale: Mempertahankan sapaan langsung, bentuk tunggal, dan ungkapan khas Alkitab tanpa menggantinya dengan istilah yang menambahkan gagasan 'hamba'.
- source_word: ταῦτα φεῦγε
  choice: larilah menjauh dari semuanya itu
  rationale: Menunjukkan rujukan kepada keburukan dan kesesatan yang baru disebut serta mempertahankan daya desak verba φεῦγε, lebih kuat daripada sekadar 'hindarilah'.
- source_word: δίωκε δὲ
  choice: sebaliknya, kejarlah
  rationale: Membuat pertentangan antara menjauhi keburukan dan secara aktif mengejar kebajikan terasa jelas; 'kejarlah' mempertahankan kekuatan imperatif δίωκε.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: Padanan mapan untuk δικαιοσύνη dalam konteks kebajikan moral dan relasional; kemungkinan arti 'keadilan' tetap dicantumkan dalam catatan kaki.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: Secara alami menyatakan kehidupan yang hormat dan terarah kepada Allah dalam konteks Surat-Surat Pastoral.
- source_word: πίστιν
  choice: iman
  rationale: Padanan utama yang mapan, sementara konteks daftar kebajikan juga memungkinkan arti 'kesetiaan' atau 'kepercayaan'; ambiguitas itu dipertahankan dalam catatan kaki.
- source_word: ἀγάπην
  choice: kasih
  rationale: Padanan Alkitabiah yang jelas dan alami bagi kasih sebagai kebajikan.
- source_word: ὑπομονήν
  choice: ketekunan
  rationale: Menyampaikan keteguhan yang terus bertahan di bawah tekanan, bukan hanya kesabaran pasif.
- source_word: πραϋπαθίαν
  choice: kelemahlembutan
  rationale: Padanan Indonesia yang paling ringkas dan mudah dipahami untuk istilah langka yang memadukan kelembutan dengan pengendalian diri yang sabar; nuansa lainnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Sapaan bergender dalam ὦ ἄνθρωπε θεοῦ
  choice: hai manusia Allah
  alternative: hai orang milik Allah
  rationale: Sapaan ditujukan secara langsung kepada Timotius dalam bentuk tunggal. 'Manusia Allah' mempertahankan idiom sumber tanpa memasukkan makna tambahan seperti 'hamba'.
- issue: Rentang makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam daftar kebajikan ini, 'kebenaran' mencakup keadaan dan perilaku yang benar, tetapi aspek keadilan tetap mungkin dan karena itu tidak dihapus.
- issue: Rentang makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan atau kepercayaan
  rationale: πίστις dapat menunjuk kepada iman atau kepercayaan, dan dalam daftar sifat dapat pula berarti kesetiaan. Teks utama memakai padanan yang mapan, sedangkan alternatif dipertahankan dalam catatan kaki.
- issue: Nuansa istilah langka πραϋπαθία
  choice: kelemahlembutan
  alternative: kelembutan yang sabar atau sikap menahan diri
  rationale: Karena istilah ini sangat jarang dan mengandung unsur kelembutan serta kesabaran, terjemahan utama dibuat ringkas tanpa menganggap satu nuansa sebagai satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk sapaan 'hai manusia Allah' sengaja mempertahankan warna ungkapan Alkitab, sedangkan pasangan 'larilah menjauh' dan 'kejarlah' menjaga daya desak serta pertentangan retoris teks Yunani.
