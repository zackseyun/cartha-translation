  text: hendaklah mereka berbuat baik, kaya dalam perbuatan-perbuatan baik, murah hati, dan siap berbagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: berbuat baik
  rationale: Ungkapan ini mempertahankan daya verbal infinitif Yunani dan terdengar alami dalam bahasa Indonesia modern.
- source_word: πλουτεῖν
  choice: kaya
  rationale: Pilihan ini mempertahankan metafora kekayaan dan kontras yang disengaja dengan kekayaan materi dalam konteks sekitarnya.
- source_word: ἐν ἔργοις καλοῖς
  choice: dalam perbuatan-perbuatan baik
  rationale: Frasa ini menyatakan bidang tempat mereka harus menjadi kaya; 'perbuatan-perbuatan baik' jelas dan wajar bagi pembaca modern.
- source_word: εὐμεταδότους
  choice: murah hati
  rationale: Adjektiva ini menunjukkan kesediaan untuk memberikan atau membagikan milik; 'murah hati' merupakan padanan Indonesia yang alami.
- source_word: κοινωνικούς
  choice: siap berbagi
  rationale: Pilihan ini menangkap sikap batin yang cenderung berbagi dengan orang lain tanpa memasukkan konotasi modern yang tidak dimaksudkan.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: murah hati, dan siap berbagi
  rationale: 'Kedua gagasan yang berdekatan tetap dibedakan: yang pertama menekankan kemurahan dalam memberi, sedangkan yang kedua menekankan kesiapan untuk berbagi.'
