  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: id
  text: Ia telah menjadi sombong[a] dan tidak memahami apa pun, melainkan sakit karena terobsesi pada perdebatan dan pertengkaran tentang kata-kata[b]. Dari semuanya itu timbul iri hati, perselisihan, fitnah[c], dan prasangka-prasangka jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Yunani ini menggambarkan orang yang “menggembung” karena kesombongan; dapat juga diterjemahkan “telah menjadi angkuh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pertengkaran mengenai kata-kata” atau “adu kata.”
    reason: lexical_alternative
  - marker: c
    text: Di sini “fitnah” menunjuk pada ucapan yang mencemarkan atau menghina orang lain. Dalam konteks lain, kata Yunani yang sama dapat berarti “penghujatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: menjadi sombong
  rationale: Bentuk perfektum menyatakan keadaan angkuh yang telah timbul dan masih berlangsung. Bahasa Indonesia alami tidak mempertahankan metafora harfiah 'menggembung' dengan jelas, sehingga 'menjadi sombong' menyampaikan hasil keadaannya; catatan kaki mempertahankan citra Yunani.
- source_word: μηδὲν ἐπιστάμενος
  choice: tidak memahami apa pun
  rationale: Frasa partisipial ini menyoroti ketiadaan pemahaman, bukan semata-mata ketiadaan informasi.
- source_word: νοσῶν
  choice: tergila-gila
  rationale: νοσέω secara harfiah berarti sakit dan di sini menggambarkan kegemaran yang tidak sehat. 'Tergila-gila' menyampaikan obsesi tidak sehat secara alami, meski metafora penyakit tidak dipertahankan secara harfiah.
- source_word: περὶ ζητήσεις
  choice: pada perdebatan
  rationale: ζητήσεις menunjuk pada persoalan atau perdebatan kontroversial; dalam konstruksi ini, hal-hal tersebut menjadi objek kegemaran yang tidak sehat.
- source_word: λογομαχίας
  choice: pertengkaran tentang kata-kata
  rationale: Terjemahan ini mempertahankan gagasan perselisihan yang berpusat pada kata-kata dan menjelaskan unsur-unsur kata majemuk λόγος dan μάχη secara alami dalam bahasa Indonesia.
- source_word: ἐξ ὧν γίνεται
  choice: Dari situlah timbul
  rationale: Frasa ini menyatakan bahwa keburukan berikutnya merupakan akibat dari perdebatan dan pertengkaran tersebut.
- source_word: φθόνος
  choice: iri hati
  rationale: φθόνος terutama menunjuk pada rasa iri yang mendongkol terhadap kebaikan atau kelebihan orang lain.
- source_word: ἔρις
  choice: perselisihan
  rationale: ἔρις berarti pertikaian atau keadaan tidak rukun; 'perselisihan' jelas dan sesuai dalam daftar keburukan.
- source_word: βλασφημίαι
  choice: fitnah
  rationale: Dalam konteks daftar keburukan antarmanusia, istilah ini paling mungkin menunjuk pada ucapan yang mencemarkan atau menghina orang lain, bukan secara khusus penghujatan terhadap Allah.
- source_word: ὑπόνοιαι πονηραί
  choice: prasangka-prasangka jahat
  rationale: ὑπόνοια berarti kecurigaan atau dugaan buruk; bentuk jamak dipertahankan dan πονηραί diterjemahkan langsung sebagai 'jahat'.
theological_decisions:
- issue: Sasaran βλασφημίαι
  choice: fitnah terhadap orang lain
  alternative: penghujatan terhadap Allah
  rationale: Rangkaian akibat sosial—iri hati, perselisihan, dan prasangka jahat—mendukung makna ucapan mencemarkan terhadap sesama, tetapi catatan kaki mempertahankan kemungkinan leksikal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dipecah untuk kelancaran, sementara hubungan sebab-akibat dan urutan daftar keburukan dipertahankan. Penanda catatan kaki ditempatkan tepat sesudah istilah terkait.
