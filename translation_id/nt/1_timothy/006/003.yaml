id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: id
  text: Jika seseorang mengajarkan ajaran lain dan tidak sejalan dengan perkataan yang sehat, yakni perkataan Tuhan kita, Yesus Sang Mesias[a], dan dengan ajaran yang selaras dengan kesalehan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: "Yesus Kristus." "Mesias" menerjemahkan gelar Yunani Christos.'
    reason: Menjelaskan terjemahan gelar Χριστός sebagai "Mesias" sambil mencatat bentuk yang lazim diterjemahkan "Kristus".
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: mengajarkan ajaran yang berbeda
  rationale: Ungkapan ini mempertahankan gagasan tentang pengajaran yang berbeda dari ajaran yang diterima tanpa menambahkan penilaian eksplisit 'sesat', yang tidak dinyatakan langsung oleh verba Yunani.
- source_word: προσέρχεται
  choice: berpegang pada
  rationale: Dalam konstruksi ini, verba tersebut berarti mendekatkan diri, menerima, atau berpaut pada suatu ajaran. 'Berpegang pada' alami dalam bahasa Indonesia dan lebih kuat daripada sekadar persetujuan intelektual.
- source_word: ὑγιαίνουσι λόγοις
  choice: perkataan-perkataan yang sehat
  rationale: Terjemahan ini mempertahankan metafora kesehatan dalam ὑγιαίνω dan arti λόγοις sebagai perkataan, bukan mengubahnya menjadi 'ajaran'.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: yaitu perkataan Tuhan kita Yesus Sang Mesias
  rationale: Kata 'yaitu' menjelaskan bahwa frasa genitif tersebut mengidentifikasi perkataan yang sehat sebagai perkataan yang berasal dari atau menjadi milik Tuhan Yesus. Pengulangan 'perkataan' menghindari rujukan yang kabur dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός memiliki arti gelar 'Mesias'. Bentuk 'Sang Mesias' menyampaikan fungsi gelar itu secara alami dan hormat dalam bahasa Indonesia.
- source_word: κατ’ εὐσέβειαν
  choice: yang selaras dengan kesalehan
  rationale: Frasa κατά menyatakan kesesuaian atau keselarasan. Terjemahan ini tidak mempersempitnya menjadi hubungan sebab-akibat.
- source_word: διδασκαλίᾳ
  choice: ajaran
  rationale: Di sini kata tersebut menunjuk pada isi pengajaran; 'ajaran' merupakan padanan Indonesia yang alami dan tepat.
- source_word: εὐσέβειαν
  choice: kesalehan
  rationale: Istilah ini menunjuk pada kehidupan yang menghormati dan berbakti kepada Allah. 'Kesalehan' adalah padanan baku dan mudah dipahami dalam konteks Surat-Surat Pastoral.
theological_decisions:
- issue: Makna Χριστοῦ dalam sebutan lengkap Ἰησοῦ Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Bentuk Yunani masih dapat didengar sebagai gelar yang bermakna 'Yang Diurapi'. 'Sang Mesias' mempertahankan arti gelarnya tanpa memasukkan kekhasan denominasi.
- issue: Hubungan ajaran dengan εὐσέβεια
  choice: selaras dengan kesalehan
  alternative: menghasilkan kesalehan
  rationale: κατά secara langsung menyatakan kesesuaian; menerjemahkannya sebagai hasil atau tujuan akan menentukan hubungan kausal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora 'sehat' dipertahankan, sedangkan struktur Yunani diperjelas dengan 'yaitu perkataan' agar rujukannya alami. Koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
