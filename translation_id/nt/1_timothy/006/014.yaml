id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: id
  text: agar engkau menaati perintah itu tanpa noda dan tanpa cela sampai pada penampakan Tuhan kita, Yesus Sang Mesias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus.” Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau dipakai dalam bentuk tradisional yang lebih menyerupai nama, “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan “tanpa noda dan tanpa cela” secara gramatikal menerangkan “perintah itu”, tetapi susunan Yunani yang padat juga dapat dipahami berkenaan dengan cara Timotius menaatinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: menaati
  rationale: Dalam ketergantungannya pada amanat di ayat sebelumnya, kata ini menyatakan pelaksanaan yang setia. “Menaati” lebih alami dalam bahasa Indonesia untuk sebuah perintah daripada “menjaga”, tanpa membatasi maknanya pada sekadar pengamatan atau perlindungan.
- source_word: τὴν ἐντολήν
  choice: perintah itu
  rationale: Nomina tunggal definit ini menunjuk pada perintah atau amanat yang sedang diberikan. “Perintah itu” mempertahankan bobot moralnya sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ἄσπιλον
  choice: tanpa noda
  rationale: Makna dasarnya ialah tidak bernoda atau tidak bercacat. Ungkapan ini mempertahankan citra sumber dan, bersama susunan kalimat, tidak memaksakan apakah sifat tersebut terutama menerangkan perintah atau cara Timotius menaatinya.
- source_word: ἀνεπίλημπτον
  choice: tanpa cela
  rationale: Kata ini menunjukkan keadaan yang tidak memberi dasar sah untuk dicela. “Tanpa cela” ringkas, bermartabat, dan lazim dipahami.
- source_word: μέχρι
  choice: sampai pada
  rationale: Penanda batas waktu yang berlangsung hingga peristiwa mendatang.
- source_word: τῆς ἐπιφανείας
  choice: penampakan
  rationale: Menunjuk pada tampilnya Yesus secara nyata. “Penampakan” menerjemahkan nomina itu secara langsung tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Mempertahankan κύριος sebagai gelar kristologis dan relasi komunal yang dinyatakan oleh ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berasal dari gelar bagi Yang Diurapi. Dalam frasa eskatologis yang khidmat ini, “Sang Mesias” membuat daya gelarnya terdengar jelas dan merupakan bentuk Indonesia yang idiomatis.
theological_decisions:
- issue: Hubungan ἄσπιλον dan ἀνεπίλημπτον dengan “perintah” atau dengan tindakan Timotius
  choice: Memakai susunan “menaati perintah itu tanpa noda dan tanpa cela” yang tetap cukup terbuka
  alternative: “menjaga perintah itu tetap tanpa noda dan tanpa cela” atau “menaatinya dengan hidup tanpa noda dan tanpa cela”
  rationale: Secara gramatikal kedua adjektiva berkasus akusatif dan selaras dengan ἐντολήν, tetapi ungkapan padat ini dapat dipahami berkaitan dengan perintah sebagaimana ditaati atau dengan pelaksanaan Timotius. Teks utama tidak memperluasnya menjadi pernyataan eksplisit tentang hidup Timotius maupun semata-mata sifat perintah.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Konteks penampakan pada masa mendatang memungkinkan gelar itu tetap terdengar. “Sang Mesias” menyampaikan artinya tanpa menyangkal bahwa “Kristus” adalah bentuk tradisional yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tidak arkais. “Engkau” dipertahankan karena sapaan tunggal langsung dalam konteks pastoral; “Sang Mesias” menandai gelar secara alami. Tanda catatan ditempatkan setelah kalimat agar alur bacaan utama tetap lancar.
