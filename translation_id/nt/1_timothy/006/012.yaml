  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: id
  text: Berjuanglah dalam perjuangan iman yang baik[a]. Peganglah erat hidup kekal yang untuknya engkau telah dipanggil, dan engkau telah menyatakan pengakuan yang baik di hadapan banyak saksi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berjuanglah dalam perjuangan yang baik demi iman.” Frasa Yunani dapat menunjuk pada perjuangan demi iman Kristen atau pada perjuangan yang dijalani dengan iman.
    reason: alternative_reading
  - marker: b
    text: Bahasa Yunani tidak menyatakan secara eksplisit isi pengakuan itu. Pengakuan tersebut dapat dipahami berkaitan dengan hidup kekal atau panggilan yang baru disebutkan, tetapi hubungan itu tidak dinyatakan secara tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου … ἀγῶνα
  choice: Berjuanglah dalam perjuangan
  rationale: Konstruksi dengan kata serumpun dipertahankan untuk menyampaikan seruan imperatif dan gambaran pergumulan yang aktif serta terus-menerus.
- source_word: καλόν
  choice: yang baik
  rationale: Menyampaikan penilaian positif ‘baik, luhur, patut’ tanpa mempersempitnya menjadi satu nuansa saja.
- source_word: τῆς πίστεως
  choice: demi iman
  rationale: Dalam konteks Surat-Surat Pastoral, frasa ini kemungkinan menunjuk pada iman Kristen sebagai sesuatu yang diperjuangkan. Catatan kaki mempertahankan kemungkinan bahwa perjuangan itu bercirikan iman.
- source_word: ἐπιλαβοῦ
  choice: Peganglah erat
  rationale: Mempertahankan metafora tindakan tegas untuk meraih dan terus berpegang pada sesuatu, tanpa menyiratkan bahwa hidup kekal diperoleh semata-mata melalui usaha manusia.
- source_word: τῆς αἰωνίου ζωῆς
  choice: hidup kekal
  rationale: Ungkapan alami dalam bahasa Indonesia yang menunjuk pada kehidupan eskatologis yang dijanjikan.
- source_word: εἰς ἣν ἐκλήθης
  choice: yang untuknya engkau telah dipanggil
  rationale: εἰς menyatakan tujuan atau sasaran panggilan, sedangkan bentuk pasif dipertahankan tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: engkau telah mengikrarkan pengakuan yang baik
  rationale: ‘Mengikrarkan pengakuan’ menyampaikan tindakan pengakuan terbuka dengan wajar dan tetap mempertahankan unsur evaluatif καλός.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: di hadapan banyak saksi
  rationale: Padanan langsung dan alami; μάρτυρες di sini berarti orang-orang yang menyaksikan, bukan ‘martir’ dalam arti kemudian.
theological_decisions:
- issue: Makna genitif τῆς πίστεως
  choice: perjuangan demi iman
  alternative: perjuangan yang dijalani dengan iman atau bercirikan iman
  rationale: Pemakaian πίστις dalam Surat-Surat Pastoral dan konteks pengakuan mendukung arti objektif, tetapi bentuk genitif Yunani tetap memungkinkan arti perjuangan yang bercirikan iman; alternatif itu dicatat.
- issue: Hubungan pengakuan dengan hidup kekal dan panggilan
  choice: Klausa pengakuan diterjemahkan secara koordinatif dengan ‘dan’
  alternative: Pengakuan itu secara eksplisit dinyatakan mengenai hidup kekal atau panggilan tersebut
  rationale: Teks Yunani menghubungkan kedua klausa secara berurutan, tetapi tidak secara eksplisit menyatakan isi pengakuan. Terjemahan utama tidak menambahkan hubungan semantis yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘engkau’ dipakai sesuai sapaan tunggal langsung kepada Timotius. Pengulangan ‘berjuanglah dalam perjuangan’ sengaja mempertahankan permainan kata ἀγωνίζου/ἀγῶνα, sementara tanda baca membagi rangkaian perintah agar mudah dibaca.
