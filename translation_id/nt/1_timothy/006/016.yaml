source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: id
  text: Dialah satu-satunya yang memiliki kebakaan, yang berdiam dalam terang yang tak terhampiri, yang tidak seorang pun di antara manusia pernah melihat-Nya ataupun sanggup melihat-Nya.[a] Bagi-Nyalah hormat dan kekuasaan yang kekal.[b] Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada manusia yang pernah melihat-Nya ataupun sanggup melihat-Nya.”
    reason: Alternatif susunan untuk frasa “tidak seorang pun di antara manusia”; tetap menyatakan bahwa manusia tidak pernah melihat Dia dan tidak mampu melihat Dia.
  - marker: b
    text: Sebagian orang memahami penggambaran dan pujian ini sebagai lebih langsung merujuk kepada Tuhan Yesus Mesias dalam konteks yang lebih luas, meskipun bahasa tentang ketidaklihatan paling alami menunjuk kepada Allah.
    reason: Mempertahankan pembacaan alternatif mengenai acuan klausa-klausa relatif dan doksologi tanpa memaksakan penyelesaian atas rujukannya.
lexical_decisions:
- source_word: μόνος
  choice: satu-satunya
  rationale: 'Menyatakan keeksklusifan secara alami dalam bahasa Indonesia: hanya Dia yang secara hakiki memiliki sifat yang disebutkan berikutnya.'
- source_word: ἔχων ἀθανασίαν
  choice: memiliki kebakaan
  rationale: Mempertahankan konstruksi partisipial dan makna ἀθανασία sebagai keadaan tidak tunduk kepada kematian; “kebakaan” merupakan istilah Indonesia yang ringkas dan bermartabat.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: berdiam dalam terang yang tak terhampiri
  rationale: Memahami ἀπρόσιτον sebagai penjelas φῶς dan mempertahankan gambaran tempat kediaman ilahi yang tidak dapat dihampiri.
- source_word: οὐδεὶς ἀνθρώπων
  choice: tidak seorang pun di antara manusia
  rationale: Mencerminkan konstruksi genitif partitif secara eksplisit sekaligus memakai “manusia” yang wajar dan mencakup seluruh umat manusia dalam bahasa Indonesia.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: dan tidak dapat dilihat
  rationale: Mempertahankan unsur ketidakmampuan dalam δύναται. Subjek tersiratnya tetap “seorang pun di antara manusia,” sesuai susunan Yunani.
- source_word: τιμή
  choice: hormat
  rationale: Padanan baku dan alami dalam ungkapan pujian; kopula yang tidak dinyatakan dalam bahasa Yunani diwujudkan melalui bentuk “Bagi-Nyalah.”
- source_word: κράτος αἰώνιον
  choice: kekuasaan yang kekal
  rationale: Dalam konteks doksologi, κράτος menunjuk pada kuasa yang berdaulat dan nyata; “kekuasaan” terdengar alami bersama “hormat.”
- source_word: ἀμήν
  choice: Amin
  rationale: Memakai transliterasi baku yang telah lazim dalam bahasa Indonesia untuk penutup doksologi.
theological_decisions:
- issue: Acuan klausa-klausa relatif dan doksologi
  choice: Ayat ini meneruskan penggambaran tentang Allah, yaitu Penguasa yang terpuji dan satu-satunya dalam konteks sebelumnya, dan doksologi ditujukan kepada-Nya.
  alternative: Sebagian pembaca menghubungkan penggambaran ini secara lebih langsung dengan Tuhan Yesus Mesias karena hubungan sintaksis dalam kalimat yang lebih luas.
  rationale: Bahasa tentang Dia yang tidak pernah dilihat dan tidak dapat dilihat oleh manusia paling alami menunjuk kepada Allah. Namun, catatan kaki mempertahankan kemungkinan pembacaan lain tanpa memaksakan penyelesaian atas ketegangan rujukannya.
- issue: Cakupan ἀνθρώπων
  choice: “manusia” dipakai dengan makna seluruh umat manusia.
  alternative: Bentuk yang lebih harfiah secara partitif dapat diperluas menjadi “tidak ada seorang pun dari umat manusia.”
  rationale: Dalam bahasa Indonesia, “manusia” tidak bertanda gender dan secara tepat menyampaikan cakupan representatif kata Yunani tersebut tanpa mengurangi ketepatan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tak terhampiri” dipilih untuk mempertahankan daya puitis dan ketepatan gambaran, sedangkan struktur kalimat tetap cukup sederhana bagi pembaca umum. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
