- from: 'Di hadapan Allah, yang menghidupkan segala sesuatu[a], dan Mesias Yesus[b], yang menyampaikan pengakuan yang baik sebagai kesaksian di hadapan Pontius Pilatus[c], aku memberi perintah ini kepadamu:'
  to: 'Aku memberi perintah kepadamu di hadapan Allah, yang memberi hidup kepada segala sesuatu[a], dan Mesias Yesus[b], yang telah memberi kesaksian berupa pengakuan yang baik di hadapan Pontius Pilatus[c]:'
  rationale: Revisi memulihkan urutan adjuratif yang lebih dekat dengan teks Yunani dan memakai padanan Indonesia yang lebih langsung. "Memberi hidup kepada segala sesuatu" tidak mengunci ζῳογονοῦντος pada kebangkitan atau penghidupan kembali. "Memberi kesaksian berupa pengakuan yang baik" menyatakan bahwa pengakuan itu merupakan kesaksian Yesus sendiri, sambil tetap menjaga istilah "pengakuan yang baik". Semua jangkar catatan kaki tetap melekat pada unsur yang relevan.
