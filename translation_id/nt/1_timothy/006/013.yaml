  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: id
  text: 'Aku memberi perintah kepadamu di hadapan Allah, yang memberi hidup kepada segala sesuatu[a], dan Mesias Yesus[b], yang telah memberi kesaksian berupa pengakuan yang baik di hadapan Pontius Pilatus[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang memelihara segala sesuatu tetap hidup” atau “yang membuat segala sesuatu hidup.” Kata Yunani yang dipakai dapat menekankan pemberian hidup ataupun pemeliharaan hidup.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus Yesus.” Kata Yunani Χριστός berarti “Mesias” atau “Yang Diurapi.”
    reason: alternative_reading
  - marker: c
    text: Frasa Yunani ini juga dapat berarti “pada zaman Pontius Pilatus” atau “di bawah pemerintahan Pontius Pilatus.”
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: aku memberi perintah ini kepadamu
  rationale: Ungkapan ini menyampaikan perintah yang tegas dan khidmat. Susunan klausa dipindahkan ke bagian akhir agar rangkaian “di hadapan Allah ... dan Mesias Yesus” terdengar alami dalam bahasa Indonesia, sementara bentuk orang pertama tunggal dan orang kedua tunggal tetap dipertahankan.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan nuansa bahwa perintah tersebut diberikan dalam kehadiran Allah sebagai saksi.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: yang menghidupkan segala sesuatu
  rationale: Kata kerja ini dapat menunjuk pada tindakan memberi hidup, membuat hidup, atau memelihara tetap hidup. “Menghidupkan” cukup luas untuk membawa cakupan makna itu tanpa membatasinya secara berlebihan.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός memiliki arti gelar “Mesias” atau “Yang Diurapi.” Dalam konteks pengakuan yang khidmat ini, daya gelarnya masih jelas, sehingga diterjemahkan menurut maknanya dan bukan sekadar ditransliterasikan.
- source_word: μαρτυρήσαντος ... τὴν καλὴν ὁμολογίαν
  choice: yang menyampaikan pengakuan yang baik sebagai kesaksian
  rationale: Rumusan ini mempertahankan unsur kesaksian dari μαρτυρέω dan unsur pengakuan dari ὁμολογία, tetapi menghindari konstruksi Indonesia yang kaku seperti “menyaksikan pengakuan.”
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: di hadapan Pontius Pilatus
  rationale: Dengan kata kerja kesaksian, frasa ini paling wajar dipahami sebagai kesaksian yang disampaikan di hadapan Pilatus. Kemungkinan arti temporal atau pemerintahan dicatat dalam catatan kaki.
- source_word: καλήν
  choice: baik
  rationale: Padanan langsung ini mempertahankan kaitan verbal dengan “pengakuan yang baik” dalam konteks dekat dan tidak mempersempitnya menjadi hanya “benar” atau “mulia.”
theological_decisions:
- issue: Makna ζῳογονοῦντος
  choice: yang menghidupkan segala sesuatu
  alternative: yang memelihara segala sesuatu tetap hidup; yang membuat segala sesuatu hidup
  rationale: Partisip Yunani dapat menekankan pemberian hidup ataupun pemeliharaan hidup. Teks utama memakai padanan yang luas, dan kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: “Mesias” memperlihatkan arti gelar Χριστός dalam konteks pengakuan yang khidmat. Bentuk tradisional “Kristus” tetap dicatat sebagai alternatif.
- issue: Hubungan μαρτυρήσαντος dengan τὴν καλὴν ὁμολογίαν
  choice: menyampaikan pengakuan yang baik sebagai kesaksian
  alternative: memberi kesaksian tentang pengakuan yang baik
  rationale: Bahasa Yunani menghubungkan verba “bersaksi” langsung dengan “pengakuan yang baik.” Rumusan utama mempertahankan kedua gagasan tanpa menyiratkan bahwa Yesus sekadar bersaksi mengenai suatu pengakuan yang terpisah.
- issue: Arti ἐπὶ Ποντίου Πιλάτου
  choice: di hadapan Pontius Pilatus
  alternative: pada zaman Pontius Pilatus; di bawah pemerintahan Pontius Pilatus
  rationale: Konteks kesaksian mendukung arti kehadiran atau pengadilan, tetapi konstruksi ἐπί dengan genitif juga dapat memiliki arti temporal atau pemerintahan; ketaksaan itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat menempatkan “aku memberi perintah ini kepadamu” sesudah dua frasa saksi ilahi agar pembuka “Di hadapan ...” mengalir alami dan bobot adjuratifnya tetap terasa. Tanda titik dua dipakai karena ayat berikutnya melanjutkan isi perintah.
