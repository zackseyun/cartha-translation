id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: id
  text: Dan mereka yang mempunyai tuan-tuan yang beriman jangan memandang rendah tuan-tuan itu karena tuan-tuan itu adalah saudara. Sebaliknya, hendaklah mereka melayani lebih lagi, karena mereka yang menerima manfaat itu adalah orang-orang percaya dan terkasih[b]. Ajarkan dan nasihatkanlah hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Frasa “mereka yang menerima manfaat itu” sulit ditafsirkan. Kemungkinan besar frasa ini menunjuk kepada para tuan yang beriman sebagai pihak yang menerima manfaat dari pelayanan para budak.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: yang percaya
  rationale: Dalam konteks ini, kata sifat tersebut menunjukkan bahwa para tuan adalah orang yang percaya kepada Kristus, bukan sekadar dapat dipercaya.
- source_word: δεσπότας
  choice: tuan-tuan
  rationale: Istilah ini menunjuk kepada pihak yang memiliki wewenang penuh dalam konteks perbudakan rumah tangga; 'tuan-tuan' merupakan padanan Indonesia yang alami dan sesuai konteks.
- source_word: καταφρονείτωσαν
  choice: jangan memandang rendah
  rationale: Ungkapan ini menyampaikan sikap meremehkan atau memperlakukan dengan penghinaan dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: saudara
  rationale: Kata Yunani berbentuk maskulin jamak dan di sini menyatakan hubungan sebagai sesama anggota keluarga iman; bentuk sumber dipertahankan tanpa mempersempit makna gerejawinya.
- source_word: μᾶλλον δουλευέτωσαν
  choice: hendaklah mereka melayani dengan lebih sungguh-sungguh
  rationale: δουλεύω menggambarkan pelayanan dalam kondisi perbudakan, sedangkan μᾶλλον menandai peningkatan atau penegasan. Ungkapan ini alami dalam bahasa Indonesia tanpa mengaburkan konteks sosial.
- source_word: πιστοί
  choice: orang-orang percaya
  rationale: Seperti pemakaian sebelumnya, kata ini menunjuk kepada orang yang percaya kepada Kristus.
- source_word: ἀγαπητοὶ
  choice: terkasih
  rationale: '''Terkasih'' mempertahankan bobot kasih dan relasi khas komunitas Kristen.'
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: mereka yang menerima manfaat pelayanan itu
  rationale: Konstruksi Yunani ini padat dan sulit. Terjemahan tersebut menyampaikan pembacaan paling wajar bahwa para tuan menerima manfaat, sementara kata 'pelayanan' menjelaskan manfaat yang dimaksud oleh konteks.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Ajarkan dan tekankanlah hal-hal ini
  rationale: Kedua verba adalah imperatif kini. 'Ajarkan' menyampaikan δίδασκε, sedangkan 'tekankanlah' menyampaikan desakan παρακάλει secara wajar dalam konteks pengajaran.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam konteks jemaat
  choice: saudara
  alternative: saudara seiman; saudara-saudari
  rationale: '''Saudara'' mempertahankan bentuk kekeluargaan dan dapat berfungsi secara generik dalam bahasa Indonesia, sementara catatan menjelaskan cakupan yang mungkin inklusif.'
- issue: Istilah status sosial dalam konteks perbudakan
  choice: tuan-tuan ... melayani
  alternative: pemilik ... bekerja sebagai budak
  rationale: Ayat ini berbicara dalam tatanan perbudakan, tetapi nomina δοῦλος tidak muncul. Pilihan ini menerjemahkan δεσπότης dan δουλεύω secara alami tanpa menghapus realitas sosial konteksnya.
- issue: Rujukan οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: para tuan yang percaya adalah penerima manfaat pelayanan
  alternative: para budak yang percaya adalah pelaku kebaikan; kedua pihak turut menikmati manfaat
  rationale: Konteks dan hubungan sintaksis paling wajar menunjuk kepada para tuan sebagai penerima manfaat. Karena konstruksi Yunani diperdebatkan, catatan kaki menyatakan kesulitannya dan tidak menampilkan tafsiran itu sebagai tidak terbantahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif 'hendaklah' dan '-lah' mempertahankan nada nasihat yang tegas. Konteks perbudakan dijaga melalui relasi 'tuan-tuan' dan verba 'melayani', dengan penjelasan seperlunya dalam catatan.
