revisions:
- from: Dan mereka yang mempunyai tuan-tuan yang percaya jangan memandang rendah tuan-tuan itu karena mereka adalah saudara[a]. Sebaliknya, hendaklah mereka melayani dengan lebih sungguh-sungguh, karena mereka yang menerima manfaat pelayanan itu adalah orang-orang percaya dan terkasih[b]. Ajarkan dan tekankanlah hal-hal ini.
  to: Dan mereka yang mempunyai tuan-tuan yang beriman jangan memandang rendah tuan-tuan itu karena tuan-tuan itu adalah saudara. Sebaliknya, hendaklah mereka melayani lebih lagi, karena mereka yang menerima manfaat itu adalah orang-orang percaya dan terkasih[b]. Ajarkan dan nasihatkanlah hal-hal ini.
  rationale: Revisi mengembalikan daya komparatif μᾶλλον, menerjemahkan παρακαλέω sebagai nasihat, dan menghindari penambahan “pelayanan” pada klausa yang sengaja dibiarkan ringkas dan terbuka oleh bahasa Yunani. Catatan b tetap memberi pembacaan kontekstual yang paling mungkin tanpa menjadikannya bagian dari teks utama. Penanda a dan catatannya dihapus bersama-sama karena alternatifnya tidak sesuai dengan rujukan maskulin langsung dalam ayat ini.
