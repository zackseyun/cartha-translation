  - severity: medium
    issue: “manfaat pelayanan itu” dalam teks utama
    rationale: Kata “pelayanan” tidak dinyatakan dalam klausa Yunani dan mempersempit konstruksi οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι yang sulit serta diperdebatkan. Penjelasan kontekstual itu lebih tepat ditempatkan dalam catatan kaki.
  - severity: low
    issue: “tekankanlah” untuk παρακάλει
    rationale: Dalam pasangan dengan δίδασκε, παρακάλει berarti menasihati atau mendesak. “Tekankanlah” hanya menyatakan penegasan materi.
  - severity: low
    issue: Catatan a menawarkan “saudara-saudari”
    rationale: ἀδελφοί di sini berpredikat bagi δεσπότας, yakni para tuan dalam bentuk maskulin. Alternatif tersebut tidak diperlukan dan dapat mengaburkan rujukan gramatikal langsung.
