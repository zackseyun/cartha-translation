id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: id
  text: Perintahkanlah orang-orang yang kaya pada zaman sekarang[a] agar tidak tinggi hati dan tidak menaruh harapan pada kekayaan yang tidak pasti[b], melainkan pada Allah, yang dengan limpah menyediakan segala sesuatu bagi kita untuk dinikmati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dunia sekarang ini.” Kata Yunani yang dipakai dapat berarti “zaman” atau, dalam arti yang diperluas, tatanan dunia sekarang; “zaman” lebih mempertahankan kontras temporal Paulus.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “pada ketidakpastian kekayaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: orang-orang yang kaya
  rationale: Bentuk datif jamak berartikel dipakai secara substantival. Ungkapan ini alami dalam bahasa Indonesia dan tidak menjadikan kekayaan sebagai identitas mutlak mereka.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: pada zaman sekarang
  rationale: αἰών menunjuk pada masa atau tatanan zaman kini. 'Zaman sekarang' mempertahankan nuansa temporal dan eskatologis Paulus.
- source_word: παράγγελλε
  choice: Perintahkanlah
  rationale: Imperatif ini menyampaikan arahan yang berwibawa; 'perintahkanlah' mempertahankan kekuatan kata Yunani.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: agar tidak tinggi hati
  rationale: Ungkapan Indonesia ini secara wajar menyampaikan gagasan kesombongan atau memandang diri tinggi.
- source_word: μηδὲ ἠλπικέναι
  choice: dan tidak menaruh harapan
  rationale: Bentuk perfek menekankan harapan yang telah diletakkan atau ditetapkan pada suatu objek. 'Menaruh harapan' menyampaikan sikap kepercayaan yang menetap.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: pada kekayaan yang tidak pasti
  rationale: ἀδηλότης menggambarkan ketidakpastian atau ketidakandalan kekayaan. Bentuk adjektival ini jelas dan alami tanpa mengubah maksud.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: melainkan pada Allah
  rationale: Pengulangan ἐπί mempertahankan kontras langsung antara kekayaan dan Allah sebagai tempat menaruh harapan.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: yang ... menyediakan ... bagi kita
  rationale: Partisip ini menerangkan Allah sebagai Dia yang menyediakan atau mengaruniakan segala sesuatu kepada umat manusia yang dimaksud oleh 'kita'.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Terjemahan ini mempertahankan cakupan luas πάντα tanpa membatasinya hanya pada kebutuhan pokok.
- source_word: πλουσίως
  choice: dengan limpah
  rationale: '''Dengan limpah'' menyampaikan kelimpahan pemberian Allah secara alami; gema dengan tema kekayaan tetap terasa melalui konteks.'
- source_word: εἰς ἀπόλαυσιν
  choice: untuk dinikmati
  rationale: Frasa ini menyatakan tujuan atau hasil pemberian Allah. Bentuk pasif ini ringkas, idiomatis, dan terkait jelas dengan 'segala sesuatu'.
theological_decisions:
- issue: Makna αἰών dalam konteks etis-eskatologis
  choice: zaman
  alternative: dunia
  rationale: '''Zaman'' mempertahankan kontras temporal dan eskatologis yang lazim dalam pemakaian Paulus, dan tidak menyempitkannya menjadi dunia material.'
- issue: Cakupan penyediaan Allah dalam πάντα
  choice: segala sesuatu
  alternative: segala sesuatu yang diperlukan
  rationale: Teks menyatakan penyediaan Allah secara luas dan tidak membatasinya pada kebutuhan semata. Terjemahan ini mempertahankan keluasan pernyataan tanpa memasukkan klaim kemakmuran yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada berwibawa dan pastoral. 'Tinggi hati' dipilih sebagai ungkapan yang bermartabat dan mudah dipahami; 'dengan limpah' menghindari bentuk yang kaku sambil mempertahankan gagasan kemurahan pemberian Allah. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan.
