lexical_decisions:
- source_word: ἁγιάζεται
  choice: dikuduskan
  rationale: Bentuk kini pasif ini menyatakan bahwa makanan yang disebut dalam konteks sebelumnya dikuduskan atau dikhususkan. “Dikuduskan” mempertahankan bentuk pasif dan bahasa kekudusan dalam teks tanpa menjelaskan secara berlebihan hakikat tindakan itu.
- source_word: γὰρ
  choice: sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” wajar dan tepat dalam bahasa Indonesia baku.
- source_word: διὰ
  choice: melalui
  rationale: Dengan bentuk genitif, διά menyatakan sarana atau perantaraan. “Melalui” mempertahankan hubungan instrumental tersebut.
- source_word: λόγου θεοῦ
  choice: firman Allah
  rationale: Ungkapan ini merupakan padanan Alkitabiah yang alami bagi konstruksi genitif tersebut dan tidak membatasi rujukannya secara tidak semestinya pada satu bentuk firman tertentu.
- source_word: ἐντεύξεως
  choice: doa
  rationale: Dalam konteks makanan yang diterima dengan ucapan syukur, “doa” menyampaikan makna umum dengan alami. Nuansa yang lebih khusus, yaitu permohonan atau syafaat, dipertahankan dalam catatan kaki.
- source_word: implicit referent of ἁγιάζεται
  choice: makanan itu
  rationale: Subjek gramatikal tersirat dalam bahasa Yunani dan merujuk pada makanan dalam ayat-ayat sebelumnya. Penyebutan “makanan itu” membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia tanpa menambah gagasan baru.
theological_decisions:
- issue: Cakupan bahasa pengudusan dalam konteks
  choice: Mempertahankan kata “dikuduskan” sambil membiarkan konteks menunjukkan bahwa yang dimaksud ialah makanan.
  alternative: Menerjemahkan secara lebih interpretatif sebagai “dikhususkan sehingga layak dimakan.”
  rationale: Konteks 1 Timotius 4:3–4 membahas makanan yang diterima dengan ucapan syukur. Namun, teks tetap memakai bahasa pengudusan; karena itu terjemahan tidak mengubahnya menjadi penjelasan doktrinal atau praktis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. “Dikuduskan” dipilih karena masih mudah dipahami sekaligus mempertahankan istilah teologis sumber; “makanan itu” mengungkapkan rujukan tersirat yang diperlukan agar kalimat berdiri alami dalam bahasa Indonesia.
