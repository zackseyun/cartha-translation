  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: id
  text: Jangan abaikan karunia yang ada dalam dirimu, yang diberikan kepadamu melalui nubuat[a], dengan penumpangan tangan oleh majelis para penatua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui ucapan kenabian”; frasa ini dapat menunjukkan bahwa nubuat menyertai atau menjadi sarana pemberian karunia itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “badan para penatua” atau “presbiterium”; yang dimaksud ialah kelompok para penatua secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Jangan abaikan
  rationale: Larangan dengan μή dan imperatif kini menyampaikan kewajiban yang terus berlaku untuk tidak membiarkan karunia itu terbengkalai. Ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: karunia yang ada di dalam dirimu
  rationale: Mempertahankan makna χάρισμα sebagai pemberian karena anugerah tanpa menambahkan kata 'rohani', serta mempertahankan lokasi eksplisit ἐν σοὶ, 'di dalam dirimu'.
- source_word: ἐδόθη σοι
  choice: diberikan kepadamu
  rationale: Mencerminkan bentuk pasif tanpa menentukan pemberi, sebab pelaku tidak disebutkan secara eksplisit dalam bahasa Yunani.
- source_word: διὰ προφητείας
  choice: melalui nubuat
  rationale: διά dengan genitif dapat menunjukkan sarana atau perantaraan. Pilihan ini mempertahankan kemungkinan bahwa nubuat menyertai ataupun menjadi sarana dalam pemberian karunia.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: bersamaan dengan penumpangan tangan
  rationale: μετά menyatakan keadaan penyerta. 'Penumpangan tangan' merupakan ungkapan Indonesia yang wajar bagi tindakan tersebut; 'bersamaan dengan' menghindari penyamaan fungsi frasa ini secara otomatis dengan διά προφητείας.
- source_word: τοῦ πρεσβυτερίου
  choice: oleh sidang para penatua
  rationale: πρεσβυτέριον menunjuk pada badan kolektif para penatua. 'Sidang para penatua' jelas bagi pembaca modern dan tidak mengimpor istilah tata gereja denominasi tertentu; 'oleh' mengungkapkan genitif subjektif yang paling wajar dalam konstruksi penumpangan tangan.
theological_decisions:
- issue: Apakah χάρισμα perlu dibuat lebih khusus sebagai 'karunia rohani' atau karunia pelayanan
  choice: karunia
  alternative: karunia rohani; karunia pelayanan
  rationale: Konteks mungkin menunjuk pada perlengkapan untuk pelayanan, tetapi teks hanya memakai χάρισμα. 'Karunia' mempertahankan keluasan istilah sumber.
- issue: Hubungan nubuat dengan pemberian karunia
  choice: melalui nubuat
  alternative: melalui ucapan kenabian; disertai nubuat
  rationale: Frasa διὰ προφητείας dapat menyatakan sarana atau perantaraan, tetapi rincian hubungan nubuat dengan pemberian karunia tidak dijelaskan. Terjemahan utama dan catatan kaki mempertahankan ketegangan ini.
- issue: Hubungan penumpangan tangan dengan pemberian karunia
  choice: bersamaan dengan penumpangan tangan
  alternative: dengan penumpangan tangan
  rationale: μετά berbeda dari διά dan paling langsung menyatakan penyertaan. Pilihan ini tidak memutuskan secara berlebihan apakah tindakan itu menyebabkan, menyalurkan, mengesahkan, atau sekadar menyertai pemberian karunia.
- issue: Identitas πρεσβυτέριον dan implikasi tata gereja
  choice: sidang para penatua
  alternative: majelis para penatua; badan para penatua; presbiterium
  rationale: Teks menyebut kelompok kolektif para penatua, tetapi tidak menetapkan seluruh struktur tata gereja kemudian. Istilah yang dipilih menyampaikan kolektivitas tanpa muatan denominasi yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'dirimu' mempertahankan sapaan tunggal kepada Timotius. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
