id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: id
  text: Sebab, untuk itulah kita bekerja keras dan dicela[a], karena kita telah menaruh harapan pada Allah yang hidup[b], yang adalah Juruselamat semua orang[c], terutama orang-orang percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kita berjerih lelah dan dihina.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kita telah menaruh harapan kita pada Allah yang hidup.”
    reason: lexical_alternative
  - marker: c
    text: Frasa “Juruselamat semua orang, terutama orang-orang percaya” diterjemahkan sebagaimana tertulis. Para penafsir berbeda pendapat apakah “Juruselamat” di sini terutama menekankan pemeliharaan Allah atas semua orang, penyediaan keselamatan bagi semua orang, atau keselamatan yang diterapkan secara khusus kepada orang-orang percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: untuk tujuan inilah
  rationale: Frasa ini menunjuk pada tujuan yang telah disebutkan sebelumnya. Ungkapan ini mempertahankan daya tujuan dari teks Yunani dengan bahasa Indonesia yang jelas.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya; “sebab” menyatakan hubungan tersebut secara ringkas dan wajar.
- source_word: κοπιῶμεν
  choice: kita bekerja keras
  rationale: Kata kerja ini menyiratkan pekerjaan yang berat dan melelahkan. “Bekerja keras” menyampaikan makna itu dengan bahasa modern yang mudah dipahami.
- source_word: ὀνειδιζόμεθα
  choice: dicela
  rationale: Bentuk pasif ini menunjuk pada tindakan menerima celaan, penghinaan, atau cercaan. “Dicela” mempertahankan unsur aib verbal tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: kita telah menaruh harapan kepada
  rationale: Bentuk perfektum menggambarkan tindakan menaruh harapan yang menghasilkan keadaan yang terus berlangsung. Ungkapan ini menyampaikan baik tindakan maupun hasilnya yang menetap.
- source_word: θεῷ ζῶντι
  choice: Allah yang hidup
  rationale: Ini merupakan ungkapan alkitabiah yang mapan dan tetap alami dalam bahasa Indonesia.
- source_word: σωτὴρ
  choice: Juruselamat
  rationale: σωτήρ dapat menunjuk pada penyelamat, pembebas, atau pemelihara, tetapi dalam Surat-Surat Pastoral istilah ini memiliki bobot teologis yang nyata. “Juruselamat” mempertahankan istilah tersebut tanpa menentukan cara penyelamatan yang dimaksud dalam ayat ini.
- source_word: πάντων ἀνθρώπων
  choice: semua orang
  rationale: ἄνθρωποι dipakai secara umum untuk umat manusia. “Semua orang” bersifat inklusif, alami, dan tidak mempersempit cakupan sumber menjadi hanya berbagai golongan manusia.
- source_word: μάλιστα
  choice: terutama
  rationale: Makna paling wajar ialah “terutama” atau “secara khusus”. Pilihan ini mempertahankan ketegangan antara cakupan “semua orang” dan hubungan khusus dengan orang percaya.
- source_word: πιστῶν
  choice: orang-orang percaya
  rationale: Dalam konteks ini kata tersebut menunjuk pada mereka yang bercirikan iman. “Orang-orang percaya” jelas dan lazim dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna “Juruselamat semua orang, terutama orang-orang percaya”
  choice: Pernyataan universal dan kekhususan bagi orang percaya dipertahankan sebagaimana tertulis, tanpa mempersempit “semua orang” atau mengartikan “terutama” sebagai “yaitu”.
  alternative: “Juruselamat” dapat dipahami sebagai pemelihara semua orang dan Juruselamat secara penebusan bagi orang percaya; sebagai pernyataan keselamatan universal; atau “semua orang” dapat ditafsirkan sebagai semua jenis orang.
  rationale: Teks Yunani menyatakan sekaligus cakupan universal, πάντων ἀνθρώπων, dan kekhususan, μάλιστα πιστῶν. Terjemahan perlu mempertahankan ketegangan teologis ini dan tidak menetapkan salah satu penafsiran dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bekerja keras” dipilih agar mudah dipahami, sedangkan “Juruselamat” mempertahankan bobot istilah teologis yang mapan. Susunan kalimat mengikuti alur alasan dalam teks Yunani tanpa terasa kaku.
