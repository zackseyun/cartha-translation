  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: id
  text: Sampai aku datang, berilah perhatian pada pembacaan di depan umum[a], nasihat, dan pengajaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembacaan Kitab Suci.” Bahasa Yunani hanya mengatakan “pembacaan,” tetapi dalam konteks kemungkinan besar yang dimaksud ialah pembacaan Kitab Suci di depan umum dalam pertemuan jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  choice: Sampai
  rationale: Kata penghubung temporal ini menyatakan jangka waktu tanggung jawab Timotius hingga Paulus datang; “sampai” merupakan padanan Indonesia yang langsung dan alami.
- source_word: ἔρχομαι
  choice: aku datang
  rationale: Bentuk kini ini memiliki acuan waktu mendatang dalam konteks tersebut. “Aku datang” mempertahankan ungkapan Yunani secara alami setelah “sampai”.
- source_word: πρόσεχε
  choice: bertekunlah dalam
  rationale: Imperatif ini menuntut perhatian dan pengabdian yang terus-menerus, bukan sekadar perhatian sesaat. “Bertekunlah dalam” menyampaikan daya pastoral dan duratifnya dengan bahasa Indonesia yang wajar.
- source_word: τῇ ἀναγνώσει
  choice: pembacaan di depan umum
  rationale: ἀνάγνωσις berarti pembacaan dan, dalam konteks pelayanan jemaat, kemungkinan menunjuk pada pembacaan dalam pertemuan umum. Pilihan ini menyatakan konteks publik tanpa menambahkan objek “Kitab Suci” yang tidak disebutkan secara eksplisit dalam bahasa Yunani.
- source_word: τῇ παρακλήσει
  choice: nasihat
  rationale: παράκλησις dapat berarti dorongan, nasihat, atau ajakan. Dalam rangkaian tugas pelayanan bersama pembacaan dan pengajaran, “nasihat” secara alami mencakup unsur penguatan sekaligus pengarahan.
- source_word: τῇ διδασκαλίᾳ
  choice: pengajaran
  rationale: διδασκαλία di sini menunjuk pada kegiatan atau isi mengajar. “Pengajaran” jelas dalam bahasa Indonesia modern dan tidak mempersempit maknanya menjadi rumusan doktrin yang sistematis.
theological_decisions:
- issue: Apakah ἀνάγνωσις harus secara eksplisit disebut sebagai pembacaan Kitab Suci dalam teks utama
  choice: pembacaan di depan umum
  alternative: pembacaan Kitab Suci; pembacaan
  rationale: Konteks tata kehidupan dan pelayanan jemaat sangat mendukung pengertian pembacaan Kitab Suci di hadapan jemaat, tetapi teks Yunani hanya menyebut “pembacaan” tanpa objek. Teks utama mempertahankan batas bukti leksikal sambil menyatakan konteks publik yang sangat mungkin; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral yang ringkas dan bermartabat. Kata “aku” mengikuti suara pribadi Paulus; pola berulang “dalam” mempertahankan kesejajaran ketiga tugas pelayanan.
