  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dicap di hati nurani mereka sendiri” atau “hati nurani mereka sendiri telah dikauterisasi.” Gambaran Yunani dapat menyiratkan hati nurani yang diberi tanda atau dibuat tidak peka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: melalui
  rationale: Dalam hubungan dengan klausa sebelumnya, ἐν menyatakan sarana atau perantaraan. “Melalui” alami dalam bahasa Indonesia dan mempertahankan hubungan instrumental itu.
- source_word: ὑποκρίσει
  choice: kemunafikan
  rationale: ὑπόκρισις menunjuk pada kepura-puraan atau sikap munafik. “Kemunafikan” merupakan padanan langsung dan sesuai dengan konteks moral-keagamaan.
- source_word: ψευδολόγων
  choice: para pendusta
  rationale: Genitif jamak ini paling wajar menerangkan “kemunafikan”. “Para pendusta” ringkas, bermartabat, dan menggambarkan orang-orang yang bercirikan perkataan dusta.
- source_word: κεκαυστηριασμένων
  choice: telah dibakar dengan besi panas
  rationale: Partisipel perfek pasif dari καυστηριάζω mempertahankan citra pembakaran dengan alat panas serta keadaan yang dihasilkannya. Ungkapan ini juga tidak membatasi citra hanya pada hilangnya kepekaan.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: hati nuraninya sendiri
  rationale: Bentuk Yunani memakai kata benda tunggal dengan penekanan posesif ἰδίαν. Bahasa Indonesia dapat memakai bentuk tunggal distributif “hati nuraninya sendiri” untuk para pendusta tersebut.
theological_decisions:
- issue: Daya metaforis κεκαυστηριασμένων
  choice: Mempertahankan citra sebagai “dibakar dengan besi panas” tanpa menjelaskan akibat rohaninya di dalam teks utama.
  alternative: “dibuat mati rasa”, “dicap”, atau “dikauterisasi” pada hati nurani mereka.
  rationale: Citra Yunani dapat mengarah pada hati nurani yang ditandai atau menjadi tidak peka. Terjemahan tidak seharusnya menetapkan bahwa keadaan ini pasti tidak dapat dipulihkan atau memilih satu penafsiran teologis secara eksklusif.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada lugas dan bermartabat. “Para pendusta” dipilih daripada bentuk yang lebih percakapan, sedangkan “dibakar dengan besi panas” menjaga citra konkret Yunani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
