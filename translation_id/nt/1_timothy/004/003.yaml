  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: id
  text: Mereka melarang orang menikah dan mewajibkan orang menjauhkan diri dari makanan[a] yang diciptakan Allah untuk diterima dengan ucapan syukur oleh orang-orang yang percaya dan telah mengenal kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “melarang untuk menikah dan menjauhkan diri dari makanan.” Susunan Yunani sangat ringkas; konteks menunjukkan bahwa para pengajar itu mewajibkan orang menjauhkan diri dari makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: melarang
  rationale: Partisipel ini melanjutkan gambaran tentang para pengajar sesat dari konteks sebelumnya; “melarang” menyampaikan tindakan pelarangan secara langsung dan wajar.
- source_word: γαμεῖν
  choice: orang menikah
  rationale: Infinitif ini secara harfiah berarti “menikah.” Penambahan “orang” menghasilkan bahasa Indonesia yang alami tanpa mengubah pelaku umum yang tersirat.
- source_word: ἀπέχεσθαι
  choice: mewajibkan orang menjauhkan diri
  rationale: Infinitif ini berarti “menjauhkan diri” atau “berpantang.” Karena bentuk Yunani ringkas dan tidak mengulang kata kerja pengendalinya, “mewajibkan” menyatakan daya perintah yang dituntut konteks tanpa menyiratkan bahwa mereka justru melarang pantang makanan.
- source_word: βρωμάτων
  choice: makanan
  rationale: Nomina jamak ini menunjuk pada bahan atau jenis makanan. Bentuk kolektif “makanan” paling alami dalam bahasa Indonesia.
- source_word: ἔκτισεν
  choice: diciptakan
  rationale: “Diciptakan” mempertahankan nuansa penciptaan ilahi dalam κτίζω, bukan sekadar tindakan membuat.
- source_word: εἰς μετάλημψιν
  choice: untuk diterima
  rationale: Frasa ini menyatakan tujuan, yakni agar makanan itu diambil atau dinikmati. “Diterima” alami dalam konteks pemberian Allah dan tetap dekat dengan ungkapan sumber.
- source_word: μετὰ εὐχαριστίας
  choice: dengan ucapan syukur
  rationale: Ungkapan ini mempertahankan tindakan bersyukur kepada Allah, bukan hanya sikap batin berupa rasa terima kasih.
- source_word: τοῖς πιστοῖς
  choice: oleh orang-orang yang percaya
  rationale: Dalam konteks ini πιστοῖς paling wajar menunjuk kepada orang percaya; pilihan ini juga menghindari kemungkinan salah paham bahwa yang dimaksud hanya orang yang bersifat setia.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: telah mengenal kebenaran
  rationale: Partisipel perfek menyatakan keadaan kini sebagai hasil dari datang kepada pengenalan akan kebenaran. “Telah mengenal” menyampaikan aspek hasil tersebut secara ringkas dan alami.
theological_decisions:
- issue: Apakah τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν menunjuk kepada satu kelompok atau dua kelompok?
  choice: 'Satu kelompok yang digambarkan dengan dua ciri: orang-orang yang percaya dan telah mengenal kebenaran.'
  alternative: 'Dua kelompok terpisah: orang-orang percaya dan orang-orang yang telah mengenal kebenaran.'
  rationale: Satu artikel yang menaungi dua sebutan terkoordinasi paling wajar menunjukkan kelompok yang sama dari dua sisi. Terjemahan tidak menciptakan dua golongan penerima tanpa dasar gramatikal yang memadai.
- issue: Hubungan ἀπέχεσθαι dengan κωλυόντων dalam susunan Yunani yang ringkas
  choice: Menyatakan secara eksplisit bahwa para pengajar itu mewajibkan orang menjauhkan diri dari makanan.
  alternative: Menerjemahkan secara sangat harfiah sebagai “melarang untuk menikah dan menjauhkan diri dari makanan,” yang dapat dipahami seolah-olah mereka melarang orang berpantang makanan.
  rationale: Konteks kecaman terhadap ajaran asketis dan tujuan makanan ciptaan Allah menunjukkan bahwa pantang makanan itulah yang mereka tuntut. Catatan kaki tetap memperlihatkan bentuk harfiah dan ketegangan sintaksis teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mewajibkan orang menjauhkan diri” dipilih agar maksud konstruksi Yunani dapat dipahami pembaca umum, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki. Pengulangan “orang” menjaga kejelasan dan kelancaran tanpa memasukkan istilah denominasi.
