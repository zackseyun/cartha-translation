  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: id
  text: Tekunilah hal-hal ini; libatkanlah dirimu sepenuhnya di dalamnya[a], supaya kemajuanmu nyata bagi semua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “beradalah di dalam hal-hal ini.” Ungkapan Yunani ini menyatakan keterlibatan yang mendalam atau pengabdian penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: semuanya itu
  rationale: Demonstratif jamak ini menunjuk kembali kepada berbagai petunjuk Paulus sebelumnya. 'Semuanya itu' alami dalam bahasa Indonesia dan mempertahankan cakupan rujukannya.
- source_word: μελέτα
  choice: Tekunilah
  rationale: Bentuk imperatif ini menyatakan perhatian dan latihan yang terus-menerus. 'Tekunilah' mencakup pemikiran serta penerapan aktif tanpa membatasinya pada perenungan batin saja.
- source_word: ἐν τούτοις ἴσθι
  choice: hiduplah di dalamnya
  rationale: Secara harfiah berarti 'beradalah di dalam hal-hal ini' dan menggambarkan keterlibatan sepenuhnya. 'Hiduplah di dalamnya' mempertahankan metafora sumber dalam ungkapan Indonesia yang cukup wajar.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini menyatakan tujuan atau hasil yang dimaksudkan; 'supaya' adalah padanan Indonesia yang alami.
- source_word: σου
  choice: -mu
  rationale: Genitif orang kedua menerangkan 'kemajuan' dan secara alami dinyatakan dengan enklitik posesif Indonesia.
- source_word: ἡ προκοπή
  choice: kemajuan
  rationale: Nomina ini berarti perkembangan atau kemajuan. Pilihan umum ini tidak mempersempitnya hanya pada pertumbuhan rohani ataupun kecakapan pelayanan.
- source_word: φανερὰ ᾖ
  choice: nyata
  rationale: Adjektiva bersama bentuk subjungtif 'ada' menyatakan bahwa kemajuan itu dapat dikenali secara terbuka. 'Nyata' ringkas dan idiomatis.
- source_word: πᾶσιν
  choice: bagi semua orang
  rationale: Datif jamak ini merujuk kepada semua orang yang berada dalam cakupan konteks; bentuk ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan kemajuan Timotius yang terlihat
  choice: Kemajuan dalam keseluruhan tugas dan kehidupan yang baru saja diperintahkan Paulus
  alternative: Khusus pertumbuhan rohani atau khusus kecakapan pelayanan
  rationale: Konteks mencakup pengajaran, tingkah laku, dan pengabdian. Istilah umum 'kemajuan' mempertahankan keluasan itu tanpa menetapkan penafsiran teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat pastoral yang lugas dan bermartabat. Metafora Yunani dipertahankan dalam bentuk yang dapat dipahami, dengan penjelasan harfiah di catatan kaki.
