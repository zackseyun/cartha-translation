  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: id
  text: Perintahkanlah dan ajarkanlah hal-hal ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berilah petunjuk dan ajarkanlah hal-hal ini.”
    reason: Alternatif leksikal untuk Παράγγελλε; dapat merujuk pada pemberian petunjuk atau arahan, tetapi “perintahkanlah” lebih jelas mempertahankan daya direktifnya.
lexical_decisions:
- source_word: Παράγγελλε
  choice: Perintahkanlah
  rationale: Imperatif aktif kini orang kedua tunggal ini menyampaikan arahan yang berwibawa dan berkelanjutan. “Perintahkanlah” mempertahankan daya perintah παραγγέλλω tanpa menambahkan klaim tentang jabatan gerejawi.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Demonstrativa netral jamak ini menunjuk kembali kepada berbagai ajaran atau petunjuk sebelumnya; “hal-hal ini” mempertahankan bentuk jamaknya secara alami dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan kedua imperatif.
- source_word: δίδασκε
  choice: ajarkanlah semuanya
  rationale: Imperatif aktif kini menyatakan kegiatan mengajar yang berkelanjutan. “Semuanya” menjadi objek yang dipahami dari ταῦτα dan menghindari pengulangan kaku “hal-hal ini,” tanpa mengubah acuannya.
theological_decisions:
- issue: Wibawa pastoral yang tersirat dalam imperatif παραγγέλλω
  choice: Memakai “Perintahkanlah” untuk mempertahankan daya direktif yang berwibawa.
  alternative: “Berikanlah petunjuk tentang hal-hal ini dan ajarkanlah semuanya.”
  rationale: Kata kerja pertama lebih kuat daripada sekadar memberi nasihat atau informasi. Terjemahan ini mempertahankan ketegasan teks tanpa mengembangkan klaim eklesiologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Akhiran -lah memberi bentuk imperatif yang wajar. “Hal-hal ini” mempertahankan bentuk jamak Yunani, sedangkan “semuanya” secara alami meneruskan objek yang sama pada kata kerja kedua.
