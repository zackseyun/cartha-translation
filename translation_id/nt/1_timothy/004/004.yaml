lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Konjungsi ini menjelaskan dasar bagi pernyataan sebelumnya; “Sebab” mempertahankan daya penjelasnya dan wajar dalam bahasa Indonesia.
- source_word: πᾶν κτίσμα θεοῦ
  choice: segala sesuatu yang diciptakan Allah
  rationale: Ungkapan ini menyampaikan cakupan distributif πᾶν dan arti κτίσμα sebagai sesuatu yang diciptakan, tanpa membatasinya hanya pada makhluk hidup atau makanan.
- source_word: καλόν
  choice: baik
  rationale: Padanan langsung dan alami yang juga mempertahankan gema bahasa penciptaan.
- source_word: οὐδὲν ἀπόβλητον
  choice: tidak ada yang patut ditolak
  rationale: Menyampaikan sifat ἀπόβλητον, yaitu layak atau pantas ditolak, dalam susunan Indonesia yang alami.
- source_word: μετὰ εὐχαριστίας
  choice: dengan ucapan syukur
  rationale: Padanan yang lazim dan jelas bagi tindakan bersyukur dalam konteks menerima ciptaan Allah.
- source_word: λαμβανόμενον
  choice: jika diterima
  rationale: Partisipel pasif kini dinyatakan sebagai keadaan bersyarat yang alami dalam bahasa Indonesia, sambil tetap mencatat alternatif temporal dalam catatan kaki.
theological_decisions:
- issue: Cakupan κτίσμα dalam konteks larangan terhadap makanan
  choice: segala sesuatu yang diciptakan Allah
  alternative: setiap makhluk Allah; setiap ciptaan Allah; semua makanan yang diciptakan Allah
  rationale: Konteks langsung membahas makanan, tetapi ungkapan Yunani lebih luas. Terjemahan tidak mempersempit prinsip penciptaan menjadi makanan saja dan juga tidak membatasi κτίσμα pada makhluk hidup.
- issue: Nuansa λαμβανόμενον bersama μετὰ εὐχαριστίας
  choice: jika diterima dengan ucapan syukur
  alternative: ketika diterima dengan ucapan syukur; yang diterima dengan ucapan syukur
  rationale: Bentuk “jika” menyatakan keadaan yang terkait dengan tidak ditolaknya ciptaan itu tanpa menambahkan kesimpulan doktrinal di luar teks; kemungkinan pembacaan temporal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Segala sesuatu yang diciptakan Allah” dipilih agar jelas bagi pembaca umum sekaligus mempertahankan keluasan ungkapan Yunani. Tanda koma akhir dipertahankan karena ayat berlanjut secara sintaksis ke ayat berikutnya.
