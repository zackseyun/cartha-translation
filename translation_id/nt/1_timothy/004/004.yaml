base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: id
  text: Sebab segala sesuatu yang diciptakan Allah itu baik[a], dan tidak ada yang patut ditolak jika diterima dengan ucapan syukur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap makhluk Allah itu baik” atau “setiap ciptaan Allah itu baik.” Kata Yunani κτίσμα dapat berarti makhluk atau, secara lebih luas, sesuatu yang diciptakan.
