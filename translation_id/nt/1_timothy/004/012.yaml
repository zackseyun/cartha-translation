  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: id
  text: Jangan biarkan seorang pun memandang rendah dirimu karena engkau masih muda. Sebaliknya, jadilah teladan bagi orang-orang percaya dalam perkataan, tingkah laku, kasih, iman[a], dan kemurnian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan.” Kata Yunani yang digunakan di sini dapat berarti iman atau kesetiaan.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς … καταφρονείτω
  choice: Jangan seorang pun meremehkan
  rationale: Bentuk larangan orang ketiga diterjemahkan dengan ungkapan Indonesia yang wajar. “Meremehkan” menyampaikan sikap memandang rendah tanpa memperkerasnya menjadi kebencian.
- source_word: σου τῆς νεότητος
  choice: engkau karena usiamu yang muda
  rationale: Secara harfiah frasa ini menunjuk pada “kemudaanmu”; susunan ini mengungkapkan maksud idiomatisnya dengan jelas, yaitu meremehkan Timotius karena ia masih muda.
- source_word: τύπος γίνου
  choice: jadilah teladan
  rationale: τύπος di sini adalah pola hidup yang patut ditiru, sedangkan imperatif γίνου secara alami diterjemahkan “jadilah”.
- source_word: τῶν πιστῶν
  choice: bagi orang-orang percaya
  rationale: Dalam konteks ini πιστοί paling wajar menunjuk kepada komunitas orang yang percaya, dan genitifnya menyatakan kelompok yang bagi mereka Timotius harus menjadi teladan.
- source_word: ἐν λόγῳ
  choice: dalam perkataan
  rationale: λόγος dalam daftar kebajikan ini menunjuk pada apa dan bagaimana seseorang berbicara.
- source_word: ἐν ἀναστροφῇ
  choice: dalam tingkah laku
  rationale: ἀναστροφή berarti perilaku atau cara hidup; “tingkah laku” jelas dan alami bagi pembaca Indonesia modern.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: “Kasih” merupakan padanan yang mapan dan sesuai untuk ἀγάπη dalam konteks kebajikan Kristen.
- source_word: ἐν πίστει
  choice: dalam iman
  rationale: πίστις dapat berarti iman atau kesetiaan. “Iman” mempertahankan arti utama yang luas, sedangkan kemungkinan “kesetiaan” dicatat dalam catatan kaki.
- source_word: ἐν ἁγνείᾳ
  choice: dalam kemurnian
  rationale: ἁγνεία menunjuk pada kemurnian moral, yang dapat mencakup kemurnian seksual tanpa harus dibatasi hanya pada aspek itu.
theological_decisions:
- issue: Makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan
  rationale: Konteks memungkinkan arti kepercayaan kepada Allah maupun sifat setia. Teks utama memakai “iman” tanpa menutup alternatif “kesetiaan”, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” dipakai untuk sapaan tunggal kepada Timotius. Struktur daftar dipertahankan, sementara pengulangan ἐν disampaikan secara alami melalui “dalam” pada awal rangkaian dan unsur-unsur sejajar berikutnya.
