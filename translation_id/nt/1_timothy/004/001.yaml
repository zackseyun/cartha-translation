  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: id
  text: Namun, Roh dengan tegas mengatakan bahwa pada masa-masa kemudian[b], sebagian orang akan meninggalkan iman[c] dengan mengikuti roh-roh yang menyesatkan[a] dan ajaran-ajaran roh-roh jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh-roh penipu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pada masa-masa terakhir.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “akan menyimpang dari iman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Roh
  rationale: Dengan kata sandang dan dalam konteks nubuat surat ini, ungkapan tersebut paling wajar merujuk kepada Roh Kudus. Huruf kapital menandai rujukannya dalam bahasa Indonesia tanpa menambahkan sebutan yang tidak tersurat.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan nuansa kontras ringan terhadap pernyataan sebelumnya. “Namun” mempertahankan hubungan wacana itu tanpa menjadikannya kontras yang terlalu kuat.
- source_word: ῥητῶς
  choice: dengan tegas
  rationale: Ungkapan ini menyampaikan bahwa perkataan Roh dinyatakan secara eksplisit dan tidak samar; “dengan tegas” alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐν ὑστέροις καιροῖς
  choice: pada masa-masa kemudian
  rationale: Frasa ini menunjuk pada masa-masa sesudah waktu penulis dan tidak harus dibatasi pada saat paling akhir secara eskatologis.
- source_word: ἀποστήσονταί
  choice: akan meninggalkan
  rationale: Kata kerja ini menyatakan tindakan menjauh atau membelot. “Meninggalkan” mempertahankan gagasan pokok tanpa memasukkan rumusan teologis yang lebih khusus.
- source_word: τῆς πίστεως
  choice: iman
  rationale: Dalam konteks ini, bentuk dengan kata sandang paling mungkin menunjuk pada iman Kristen sebagai isi kepercayaan. Bahasa Indonesia lazim memakai “iman” tanpa harus menambahkan kata sandang.
- source_word: προσέχοντες
  choice: dengan mengikuti
  rationale: Partisip ini menerangkan tindakan yang menyertai keluarnya mereka dari iman—mereka memberi perhatian dan mengarahkan diri kepada pengaruh tersebut. “Dengan mengikuti” alami, sekaligus tidak memaksakan hubungan sebab-akibat secara mutlak.
- source_word: πνεύμασι πλάνοις
  choice: roh-roh yang menyesatkan
  rationale: πλάνος dapat menggambarkan pihak yang menyesatkan atau bersifat menipu. Pilihan ini jelas bagi pembaca modern dan mempertahankan daya aktif ungkapan Yunani.
- source_word: διδασκαλίαις δαιμονίων
  choice: ajaran-ajaran setan-setan
  rationale: Bentuk jamak δαιμονίων menunjuk pada roh-roh jahat sebagai sumber atau pihak yang terkait dengan ajaran itu. “Ajaran-ajaran setan-setan” transparan dan mempertahankan bentuk jamaknya.
theological_decisions:
- issue: Rujukan “Roh”
  choice: Roh Kudus
  alternative: roh nubuat atau roh manusia
  rationale: Konteks surat dan pernyataan profetis paling alami menunjuk kepada Roh Kudus, tetapi terjemahan tidak menentukan cara khusus Roh menyampaikan perkataan ini.
- issue: Makna “iman”
  choice: iman Kristen sebagai isi atau pokok kepercayaan
  alternative: kepercayaan pribadi atau kesetiaan
  rationale: Konteks penyimpangan menuju ajaran yang menyesatkan mendukung makna objektif “iman”, tanpa menetapkan doktrin denominasi tertentu mengenai kemurtadan.
- issue: Hubungan partisip προσέχοντες dengan tindakan meninggalkan iman
  choice: tindakan yang menyertai atau menjelaskan caranya
  alternative: 'penyebab langsung: “karena mengikuti”'
  rationale: “Dengan mengikuti” mempertahankan keluwesan sintaksis partisip Yunani dan tidak mempersempitnya menjadi hubungan sebab-akibat semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada serius dan bermartabat. Bentuk jamak diulang ketika penting bagi makna sumber. Susunan kalimat dibuat alami, sedangkan penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
