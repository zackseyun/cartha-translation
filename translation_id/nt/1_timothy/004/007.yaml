id: 1TI.4.7
reference: 1 Timothy 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: id
  text: Namun, tolaklah mitos-mitos yang tidak kudus dan berciri khas perempuan tua[a]. Latihlah dirimu dalam kesalehan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mitos-mitos yang berciri khas perempuan tua.” Ungkapan Yunani ini bernada merendahkan. Dapat juga diterjemahkan, “dongeng nenek-nenek.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: yang tidak menghormati Allah
  rationale: Mengungkapkan hal yang tidak suci atau tidak pantas dalam kaitannya dengan Allah secara alami dalam bahasa Indonesia, tanpa memakai istilah 'profan' yang kurang umum.
- source_word: γραώδεις
  choice: yang seperti dongeng nenek-nenek
  rationale: Mempertahankan gambaran khusus dan nada merendahkan dari ungkapan Yunani, tetapi dalam susunan yang dapat dipahami pembaca Indonesia modern.
- source_word: μύθους
  choice: mitos-mitos
  rationale: Secara langsung menyampaikan kisah rekaan atau spekulatif dan mempertahankan padanan leksikal yang dekat.
- source_word: παραιτοῦ
  choice: tolaklah
  rationale: Imperatif ini meminta Timotius menolak atau tidak menerima hal-hal tersebut; 'tolaklah' ringkas dan tegas.
- source_word: γύμναζε
  choice: latihlah
  rationale: Mempertahankan metafora latihan, khususnya latihan jasmani atau atletik, yang berlanjut dalam ayat berikutnya.
- source_word: σεαυτόν
  choice: dirimu
  rationale: Menerjemahkan kata ganti refleksif yang menunjuk langsung kepada Timotius.
- source_word: πρὸς εὐσέβειαν
  choice: untuk hidup berbakti kepada Allah
  rationale: πρός menyatakan tujuan, sedangkan εὐσέβεια menunjuk pada sikap hormat dan kehidupan yang berorientasi kepada Allah; bentuk verbal ini lebih alami dan jelas daripada nomina abstrak 'kesalehan'.
- source_word: δὲ ... δὲ
  choice: Namun ... [tanpa penghubung eksplisit pada kalimat kedua]
  rationale: δέ pertama menandai kontras dengan konteks sebelumnya. δέ kedua memperhadapkan perintah positif dengan larangan pertama; pemisahan menjadi dua kalimat sudah menyampaikan peralihan itu secara alami.
theological_decisions:
- issue: Makna εὐσέβεια
  choice: hidup berbakti kepada Allah
  alternative: kesalehan; ibadah
  rationale: Pilihan ini mencakup sikap hormat kepada Allah beserta kehidupan yang sesuai dengannya. 'Ibadah' dapat dipahami terlalu sempit sebagai kegiatan ritual, sedangkan 'kesalehan' berpotensi terdengar sebagai kualitas moral yang kurang eksplisit berorientasi kepada Allah.
- issue: Ungkapan peyoratif γραώδεις μύθους
  choice: mitos-mitos ... yang seperti dongeng nenek-nenek
  alternative: dongeng nenek-nenek; mitos-mitos konyol
  rationale: Terjemahan utama mempertahankan citra perempuan lanjut usia dan daya retoris ungkapan Yunani, tanpa menggantinya dengan penafsiran umum seperti 'konyol'. Catatan kaki menjelaskan bahwa ungkapan ini bernada merendahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. 'Nenek-nenek' mempertahankan gambaran sumber, sementara catatan kaki menjelaskan bentuk harfiah dan nada peyoratifnya. Dua imperatif diterjemahkan secara tegas; metafora latihan dipertahankan.
