id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: id
  text: Sebab latihan jasmani bermanfaat secara terbatas[a], tetapi kesalehan bermanfaat dalam segala hal, karena mengandung janji untuk kehidupan sekarang dan kehidupan yang akan datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermanfaat untuk waktu yang singkat” atau “bermanfaat sampai tingkat tertentu”; frasa Yunani dapat menunjuk pada keterbatasan waktu atau tingkat manfaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: latihan jasmani
  rationale: Ungkapan ini menyampaikan latihan atau olahraga yang berkaitan dengan tubuh secara alami dalam bahasa Indonesia, tanpa membatasinya pada cabang atletik tertentu.
- source_word: πρὸς ὀλίγον
  choice: secara terbatas
  rationale: Frasa Yunani dapat menunjuk pada keterbatasan jangka waktu atau tingkat manfaat. Pilihan ini menjaga ambiguitas tersebut dan tidak menyatakan bahwa latihan jasmani tidak berguna.
- source_word: ὠφέλιμος
  choice: bermanfaat
  rationale: Padanan modern dan jelas yang dapat dipakai secara konsisten pada kedua klausa.
- source_word: εὐσέβεια
  choice: kesalehan
  rationale: Dalam Surat-Surat Pastoral, istilah ini menunjuk pada kehidupan yang menghormati dan berorientasi kepada Allah; 'kesalehan' merupakan padanan Indonesia yang mapan dan wajar.
- source_word: πρὸς πάντα
  choice: dalam segala hal
  rationale: Pilihan ini mempertahankan cakupan luas ungkapan Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: karena mengandung janji
  rationale: Bentuk partisipial menjelaskan alasan kesalehan bermanfaat dalam segala hal; 'karena' memperjelas hubungan tersebut tanpa menambah isi.
- source_word: ζωῆς τῆς νῦν
  choice: kehidupan sekarang
  rationale: Padanan alami yang mempertahankan kontras dengan kehidupan yang akan datang.
- source_word: τῆς μελλούσης
  choice: kehidupan yang akan datang
  rationale: Kata 'kehidupan' tersirat dalam bahasa Yunani; pengulangannya diperlukan agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan manfaat latihan jasmani
  choice: Latihan jasmani memiliki manfaat yang terbatas, berlawanan dengan manfaat kesalehan yang mencakup segala hal.
  alternative: Latihan jasmani hanya bermanfaat untuk waktu yang singkat atau hanya sampai tingkat yang kecil.
  rationale: Teks membandingkan nilai relatif dan tidak menyatakan bahwa latihan jasmani sama sekali tidak berguna. Terjemahan ini mempertahankan prioritas kesalehan sekaligus membiarkan jenis keterbatasan πρὸς ὀλίγον tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kontras tegas antara latihan jasmani dan kesalehan, sementara catatan kaki menjaga ambiguitas asli πρὸς ὀλίγον.
