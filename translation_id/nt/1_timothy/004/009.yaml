  yaml_path: translation/nt/1_timothy/004/009.yaml
  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: id
  text: Perkataan ini dapat dipercaya dan layak diterima sepenuhnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perkataan itu dapat dipercaya” atau “Pernyataan ini dapat dipercaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: dapat dipercaya
  rationale: Dalam rumusan πιστὸς ὁ λόγος, kata sifat ini menyatakan bahwa perkataan tersebut andal dan patut dipercayai; “dapat dipercaya” alami dalam bahasa Indonesia modern.
- source_word: ὁ λόγος
  choice: perkataan ini
  rationale: Dalam rumusan surat ini, λόγος menunjuk pada suatu perkataan atau pernyataan tertentu. “Perkataan ini” mempertahankan sifat formula tersebut dan cocok dengan konteks dekat.
- source_word: πάσης
  choice: sepenuhnya
  rationale: Dalam frasa πάσης ἀποδοχῆς, kata ini menyatakan penerimaan yang utuh atau penuh; bentuk adverbial “sepenuhnya” menghasilkan ungkapan Indonesia yang wajar.
- source_word: ἀποδοχῆς
  choice: diterima
  rationale: ἀποδοχή berarti penerimaan atau penyambutan. Bentuk verbal pasif dalam ungkapan “layak diterima” menyampaikan makna itu secara alami tanpa menggesernya menjadi sekadar persetujuan.
- source_word: ἄξιος
  choice: layak
  rationale: ἄξιος dengan genitif berarti layak atau patut memperoleh sesuatu; “layak diterima” merupakan padanan langsung dan idiomatis.
