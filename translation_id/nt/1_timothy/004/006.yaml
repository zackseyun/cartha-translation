id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: id
  text: Dengan menyampaikan hal-hal ini kepada saudara-saudara[a], engkau akan menjadi pelayan yang baik dari Mesias Yesus[b], seraya dipelihara oleh perkataan iman[c] dan ajaran yang baik yang telah kauikuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” di sini dapat merujuk kepada sesama orang percaya secara umum, termasuk perempuan, sesuai konteks.
    reason: cultural_note
  - marker: b
    text: Atau “Kristus Yesus.” Gelar Yunani Χριστός berarti “Mesias.”
    reason: lexical_alternative
  - marker: c
    text: Atau “perkataan tentang iman.” “Iman” di sini mungkin menunjuk pada isi kepercayaan Kristen yang diakui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak netral ini menunjuk kembali kepada berbagai peringatan dan petunjuk sebelumnya; bentuk jamak dipertahankan.
- source_word: ὑποτιθέμενος
  choice: dengan mengemukakan
  rationale: Kata ini secara harfiah menggambarkan tindakan menaruh sesuatu di hadapan orang lain dan dalam konteks berarti menyampaikan atau mengingatkan; 'mengemukakan' mempertahankan arahnya tanpa menjadi terlalu harfiah.
- source_word: τοῖς ἀδελφοῖς
  choice: kepada saudara-saudara
  rationale: Bentuk Yunani adalah maskulin jamak dan dapat dipakai bagi sesama orang percaya secara kolektif. Bentuk gramatikal dipertahankan, sedangkan kemungkinan cakupan inklusif dijelaskan dalam catatan.
- source_word: καλὸς
  choice: yang baik
  rationale: Dalam konteks ini kata tersebut menilai mutu pelayanan. 'Baik' jelas, wajar, dan tidak meninggikan maknanya secara berlebihan.
- source_word: διάκονος
  choice: pelayan
  rationale: Kata ini dapat berarti pelayan atau orang yang melayani. Di sini konteks tidak mengharuskan jabatan resmi 'diaken', sehingga 'pelayan' dipilih.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός merupakan gelar yang berarti 'Mesias'. Terjemahan gelarnya dipertahankan, sementara bentuk tradisional 'Kristus Yesus' dicatat sebagai alternatif.
- source_word: ἐντρεφόμενος
  choice: seraya mendapat makanan
  rationale: Partisip ini menggambarkan proses terus-menerus dipelihara atau diberi makan. Ungkapan ini mempertahankan metafora pertumbuhan rohani dengan bahasa Indonesia yang mudah dipahami.
- source_word: τοῖς λόγοις
  choice: dari perkataan-perkataan
  rationale: Bentuk jamak λόγοις dipertahankan sebagai 'perkataan-perkataan', bukan dilebur menjadi 'ajaran', dan preposisi 'dari' menyatakan sumber makanan.
- source_word: τῆς πίστεως
  choice: iman
  rationale: Genitif ini dapat menunjuk pada iman atau pada isi kepercayaan yang diakui. Susunan 'perkataan-perkataan iman' mempertahankan kepadatan dan sebagian ambiguitas ungkapan Yunani.
- source_word: τῆς καλῆς διδασκαλίας
  choice: ajaran baik
  rationale: διδασκαλία berarti ajaran atau pengajaran, sedangkan καλῆς menilainya sebagai baik. Terjemahan ini tidak mengganti sifat tersebut dengan penafsiran 'sehat'.
- source_word: ᾗ παρηκολούθηκας
  choice: yang telah kauikuti
  rationale: Pronomina relatif feminin tunggal paling langsung merujuk kepada 'ajaran'. Kata kerja dapat berarti mengikuti dengan saksama atau berpegang pada; 'telah kauikuti' mempertahankan keluasan itu.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Gelar Χριστός berarti 'Mesias'. Bentuk bermakna dipakai dalam teks utama tanpa menyangkal bahwa 'Kristus Yesus' merupakan bentuk tradisional yang sangat dikenal.
- issue: Cakupan τοῖς ἀδελφοῖς
  choice: saudara-saudara
  alternative: saudara-saudari seiman
  rationale: Bentuk maskulin jamak Yunani dipertahankan dalam teks. Karena sapaan ini dalam komunitas Kristen dapat mencakup orang percaya laki-laki dan perempuan, cakupan tersebut dijelaskan dalam catatan.
- issue: Makna τῆς πίστεως
  choice: iman
  alternative: tentang iman
  rationale: Dalam konteks kedekatannya dengan 'ajaran', frasa ini mungkin menunjuk pada isi iman Kristen yang diakui, tetapi susunan genitif tidak perlu dipersempit secara mutlak. Catatan menyajikan pembacaan objektif yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'engkau/kau-' sesuai dengan sapaan tunggal kepada Timotius. Metafora pemberian makanan dipertahankan, dan istilah jabatan resmi 'diaken' dihindari karena konteks lebih mendukung fungsi pelayanan umum.
