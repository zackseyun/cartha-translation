  - severity: low
    issue: Catatan kaki a kurang alami dan kurang paralel dengan bentuk Yunani.
    rationale: “Tetaplah di dalam semuanya itu” merupakan calque yang kaku; alternatif sebaiknya menyatakan kelanjutan atau ketekunan dalam kedua hal yang disebutkan.
