  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: id
  text: Perhatikanlah dengan saksama dirimu sendiri dan pengajaran. Bertekunlah dalam kedua hal itu.[a] Sebab, dengan melakukan hal itu, engkau akan menyelamatkan baik dirimu sendiri maupun orang-orang yang mendengarkanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetaplah melakukannya” atau “Teruslah tekun dalam kedua hal itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memelihara.” Kata Yunani yang diterjemahkan “menyelamatkan” dapat menunjuk pada penyelamatan, pemeliharaan, atau keselamatan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Perhatikanlah dengan saksama
  rationale: Bentuk perintah ini menuntut perhatian yang terus-menerus dan cermat, bukan sekadar melihat sesaat. Ungkapan ini wajar dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: σεαυτῷ
  choice: dirimu sendiri
  rationale: Kata ganti refleksif datif menunjukkan bahwa diri Timotius sendiri menjadi sasaran perhatiannya.
- source_word: τῇ διδασκαλίᾳ
  choice: pengajaranmu
  rationale: διδασκαλία dapat menunjuk pada kegiatan maupun isi pengajaran. Dalam konteks nasihat langsung kepada Timotius, bentuk posesif tersirat menghasilkan bahasa Indonesia yang alami tanpa membatasi maknanya menjadi istilah teknis 'doktrin'.
- source_word: ἐπίμενε αὐτοῖς
  choice: Bertekunlah dalam semuanya itu
  rationale: ἐπίμενε menyatakan kelanjutan yang teguh, sedangkan αὐτοῖς secara alami merujuk kembali pada perhatian terhadap diri dan pengajaran sebagai satu rangkaian tanggung jawab.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Sebab, dengan melakukan hal itu
  rationale: 'Partisipel ini paling alami dipahami menyatakan sarana: hasil berikut terjadi dengan terus melakukan nasihat tersebut.'
- source_word: σώσεις
  choice: engkau akan menyelamatkan
  rationale: Pilihan ini mempertahankan makna utama dan bobot teologis σῴζω tanpa mempersempitnya menjadi keselamatan kekal saja atau sekadar pemeliharaan praktis.
- source_word: τοὺς ἀκούοντάς σου
  choice: orang-orang yang mendengarkanmu
  rationale: Partisipel kini menggambarkan mereka yang terus mendengar atau menyimak pengajaran Timotius; bentuk ini alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'menyelamatkan' dalam nasihat pelayanan
  choice: Mempertahankan 'menyelamatkan' dalam teks utama
  alternative: '''memelihara'' atau ''menjaga tetap selamat'''
  rationale: Ayat ini menghubungkan ketekunan Timotius dalam hidup dan pengajaran dengan keselamatan dirinya serta para pendengarnya. Terjemahan tidak menentukan apakah cakupannya khusus keselamatan eskatologis atau pemeliharaan rohani, dan juga tidak menambahkan penjelasan tentang mekanisme keselamatan yang tidak dinyatakan dalam kalimat Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau', sesuai nasihat pribadi Paulus kepada Timotius. Susunan kalimat dibuat lugas dan bermartabat; istilah teknis 'doktrin' dihindari, sementara ambiguitas teologis pada σώσεις dipertahankan melalui teks utama dan catatan kaki.
