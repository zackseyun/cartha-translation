  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: id
  text: sesuai dengan Injil tentang kemuliaan Allah yang berbahagia[a], yang telah dipercayakan kepada saya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Injil yang mulia dari Allah yang berbahagia.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Dengan akusatif, kata ini menyatakan tolok ukur bagi uraian sebelumnya; “sesuai dengan” alami dan tepat dalam bahasa Indonesia.
- source_word: εὐαγγέλιον
  choice: Injil
  rationale: Istilah baku dalam konteks Paulus yang tetap jelas dan mempertahankan bobot teologisnya.
- source_word: τῆς δόξης
  choice: tentang kemuliaan
  rationale: Mempertahankan bentuk nomina dan keterkaitan genitif tanpa langsung mengubahnya menjadi kata sifat “mulia”; preposisi “tentang” membuat hubungan itu dapat dipahami secara alami.
- source_word: μακαρίου
  choice: yang bahagia
  rationale: μακάριος ketika dikenakan kepada Allah menyatakan keadaan bahagia atau sejahtera yang sempurna; “yang bahagia” lebih langsung daripada “yang diberkati”, yang dalam bahasa Indonesia dapat menyiratkan bahwa pihak lain memberkati Allah.
- source_word: θεοῦ
  choice: Allah
  rationale: Padanan baku θεός dalam konteks ini.
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: yang telah dipercayakan kepada saya
  rationale: Bentuk pasif πιστεύω di sini berarti sesuatu dipercayakan kepada seseorang, bukan “percaya”; susunan ini alami dan mempertahankan Injil sebagai anteseden kata relatif.
theological_decisions:
- issue: Hubungan genitif dalam τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: Injil tentang kemuliaan Allah yang bahagia
  alternative: Injil mulia dari Allah yang bahagia
  rationale: Terjemahan utama mempertahankan “kemuliaan” sebagai nomina dan tidak menetapkan genitif itu sebagai kata sifat semata. Alternatif idiomatis dicatat tanpa menutup ambiguitas struktur Yunani.
- issue: Makna μακαρίου ketika dikenakan kepada Allah
  choice: Allah yang bahagia
  alternative: Allah yang terpuji; Allah yang diberkati
  rationale: “Bahagia” menyampaikan makna dasar μακάριος sebagai keadaan penuh kebahagiaan dan tidak menyiratkan bahwa Allah menerima berkat dari pihak lain. Alternatif “terpuji” lebih idiomatis tetapi bergeser ke gagasan pujian.
- issue: Makna ἐπιστεύθην
  choice: telah dipercayakan kepada saya
  alternative: saya percayai
  rationale: Dalam konstruksi pasif dengan Injil sebagai hal yang dipercayakan, verba ini menyatakan pemberian amanat. Konteks pelayanan Paulus mendukung makna ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Saya” dipilih untuk ἐγώ agar alami dalam wacana pribadi Paulus; penekanan pronomina Yunani tidak ditambah secara tipografis. Kapitalisasi “Injil” mengikuti pemakaian umum untuk kabar keselamatan Kristen.
