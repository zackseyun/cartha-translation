id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: id
  text: Aku bersyukur kepada Mesias Yesus, Tuhan kita[a], yang telah menguatkan aku, karena Ia menganggap aku setia dan menetapkan aku untuk pelayanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus, Tuhan kita.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau ditulis dalam bentuk tradisional “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “untuk melayani” atau “dalam pelayanan.” Kata Yunani διακονία mempunyai arti luas, yaitu pelayanan atau pengabdian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Aku bersyukur
  rationale: Ungkapan ini berarti menyatakan rasa syukur. “Aku bersyukur” merupakan bentuk Indonesia yang alami dan tetap mempertahankan pelaku serta tindakan dalam teks.
- source_word: ἐνδυναμώσαντί με
  choice: yang telah menguatkan aku
  rationale: Partisip aoris ini menyebut Mesias Yesus sebagai pihak yang memberi kekuatan atau kemampuan kepada Paulus. “Menguatkan” cukup luas dan tidak membatasi maknanya pada pemberian kuasa dalam arti teknis tertentu.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan menurut maknanya, yaitu “Mesias,” sedangkan Ἰησοῦ dipertahankan sebagai nama “Yesus.”
- source_word: κυρίῳ ἡμῶν
  choice: Tuhan kita
  rationale: κύριος merupakan gelar kristologis yang menyatakan kewenangan; “Tuhan” adalah padanan baku dan bermartabat dalam bahasa Indonesia.
- source_word: πιστόν
  choice: setia
  rationale: Dalam konteks tugas yang dipercayakan, πιστός dapat berarti setia atau dapat dipercaya. “Setia” mempertahankan ungkapan Paulus tanpa mempersempitnya hanya pada kecakapan.
- source_word: ἡγήσατο
  choice: menganggap
  rationale: Kata kerja ini berarti memandang, menilai, atau menganggap. “Menganggap” alami dalam bahasa Indonesia dan tidak memberi nuansa penghakiman resmi yang tidak dituntut konteks.
- source_word: θέμενος
  choice: menetapkan
  rationale: Secara harfiah berarti menempatkan, tetapi dalam konteks pemberian tugas, “menetapkan” menyampaikan tindakan penugasan dengan jelas tanpa menyiratkan jabatan gerejawi tertentu.
- source_word: εἰς διακονίαν
  choice: untuk pelayanan
  rationale: διακονία mencakup pelayanan atau pengabdian. “Untuk pelayanan” menjaga bentuk nomina dan cakupan maknanya tanpa membatasi pada jabatan rohaniwan.
theological_decisions:
- issue: Penerjemahan gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: “Mesias” menerjemahkan isi gelar Χριστός, sedangkan “Kristus” merupakan bentuk transliterasi tradisional. Pilihan utama mempertahankan makna gelar yang masih aktif dalam konteks ini; alternatif dicatat karena telah mapan dalam tradisi Indonesia.
- issue: Sifat penugasan Paulus
  choice: menetapkan aku untuk pelayanan
  alternative: menempatkan aku dalam pelayanan
  rationale: Ungkapan ini menyampaikan bahwa Mesias Yesus memberi Paulus suatu tugas pelayanan, tetapi tidak memasukkan struktur jabatan gerejawi yang lebih kemudian. Alternatif yang lebih harfiah tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab dan penugasan dalam teks Yunani, sambil memakai ungkapan yang dapat dipahami pembaca umum. Huruf kapital pada “Ia” mengikuti kebiasaan penerbitan Alkitab Indonesia sebagai penanda rujukan yang jelas kepada Mesias Yesus, bukan sebagai tambahan makna pada teks sumber.
