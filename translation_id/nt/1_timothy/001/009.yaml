  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: id
  text: 'dengan menyadari hal ini: hukum tidak ditetapkan bagi orang benar, melainkan bagi orang-orang yang tidak menaati hukum dan para pemberontak, orang-orang fasik dan berdosa, orang-orang yang tidak kudus dan yang tidak menghormati hal-hal suci, orang-orang yang membunuh ayah mereka dan orang-orang yang membunuh ibu mereka[a], para pembunuh,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “orang-orang yang memukul ayah mereka dan orang-orang yang memukul ibu mereka”; kedua istilah Yunani ini dapat menunjuk pada penyerangan keras terhadap orang tua, meskipun dalam konteks ini arti “membunuh” tampaknya lebih mungkin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: dengan menyadari hal ini
  rationale: Partisipel ini menyatakan pemahaman yang menjadi dasar bagi petunjuk sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya kognitifnya.
- source_word: δικαίῳ
  choice: bagi orang benar
  rationale: Bentuk datif tunggal maskulin dipakai secara representatif. 'Orang benar' mempertahankan bentuk tunggal dan wajar dalam bahasa Indonesia tanpa membatasi acuannya hanya kepada laki-laki.
- source_word: νόμος οὐ κεῖται
  choice: hukum tidak ditetapkan
  rationale: κεῖται secara harfiah berarti 'diletakkan' dan dalam konteks hukum menunjuk pada penetapan; 'tidak ditetapkan' lebih dekat daripada parafrasa interpretatif seperti 'tidak berlaku'.
- source_word: ἀνόμοις
  choice: orang-orang yang tidak menaati hukum
  rationale: Menyampaikan arti moral-legal 'tanpa hukum/melanggar hukum' secara jelas; 'orang durhaka' terlalu luas dan kurang menampilkan kaitan leksikal dengan νόμος.
- source_word: ἀνυποτάκτοις
  choice: para pemberontak
  rationale: Menangkap gagasan menolak tunduk dengan ungkapan Indonesia yang ringkas dan mudah dipahami.
- source_word: ἀσεβέσι
  choice: orang-orang fasik
  rationale: '''Fasik'' merupakan padanan Alkitabiah Indonesia yang masih dikenal untuk sikap tidak hormat dan tidak berbakti kepada Allah.'
- source_word: ἁμαρτωλοῖς
  choice: berdosa
  rationale: Mempertahankan susunan berpasangan secara ringkas dan membedakannya dari istilah sebelumnya.
- source_word: ἀνοσίοις
  choice: orang-orang yang tidak kudus
  rationale: Menyatakan pelanggaran terhadap kekudusan dengan padanan langsung dan mudah dimengerti.
- source_word: βεβήλοις
  choice: yang mencemarkan hal-hal suci
  rationale: Mengungkapkan tindakan memperlakukan yang suci sebagai sesuatu yang biasa atau cemar, sekaligus membedakannya dari ἀσεβέσι dan ἀνοσίοις.
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: orang-orang yang membunuh ayah atau ibu mereka
  rationale: Kedua istilah langka ini dapat berarti memukul atau membunuh orang tua. Dalam daftar kejahatan ini, arti 'membunuh' tampaknya paling mungkin, sedangkan kemungkinan 'memukul' dipertahankan dalam catatan kaki.
- source_word: ἀνδροφόνοις
  choice: para pembunuh
  rationale: Padanan Indonesia yang alami untuk orang yang melakukan pembunuhan dan sesuai dengan konteks daftar kejahatan.
theological_decisions:
- issue: Cakupan gender δικαίῳ
  choice: bagi orang benar
  alternative: bagi seorang laki-laki yang benar
  rationale: Walaupun bentuk Yunani tunggal maskulin, pemakaiannya bersifat representatif. Bahasa Indonesia tidak perlu menambahkan unsur laki-laki yang tidak ditegaskan secara eksklusif oleh konteks.
- issue: Arti πατρολῴαις / μητρολῴαις
  choice: orang-orang yang membunuh ayah atau ibu mereka
  alternative: orang-orang yang memukul ayah atau ibu mereka
  rationale: Istilah-istilah ini memungkinkan arti penyerangan keras maupun pembunuhan. Konteks daftar kejahatan berat mendukung 'membunuh', tetapi ketidakpastian leksikal dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Irama daftar berpasangan dipertahankan sejauh wajar, dengan pengulangan 'orang-orang' untuk kejelasan. Ayat berakhir dengan koma karena kalimat dan daftar berlanjut ke ayat berikutnya.
