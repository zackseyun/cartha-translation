base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: id
  text: orang-orang yang melakukan percabulan, laki-laki yang berhubungan seks dengan laki-laki,[a] para pedagang budak, para pendusta, orang-orang yang bersumpah palsu, dan apa pun yang lain yang bertentangan dengan ajaran yang sehat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “laki-laki yang melakukan hubungan homoseksual.” Istilah Yunani ἀρσενοκοῖται jarang dipakai dan cakupan tepatnya diperdebatkan; istilah ini berkaitan dengan aktivitas seksual sesama laki-laki.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: orang-orang yang melakukan percabulan
  rationale: Istilah ini menunjuk secara luas kepada orang yang melakukan hubungan seksual yang tidak bermoral. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada hubungan seks pranikah.
- source_word: ἀρσενοκοίταις
  choice: laki-laki yang berhubungan seks dengan laki-laki
  rationale: Istilah langka ini tersusun dari unsur yang berarti 'laki-laki' dan 'tempat tidur' dalam arti seksual, serta kemungkinan menggemakan bahasa Imamat dalam Septuaginta. Terjemahan ini mempertahankan rujukan kepada tindakan seksual sesama laki-laki tanpa memasukkan kategori identitas modern.
- source_word: ἀνδραποδισταῖς
  choice: para pedagang budak
  rationale: Kata ini menunjuk kepada orang yang menculik, memperbudak, atau memperdagangkan manusia sebagai budak. 'Para pedagang budak' menyampaikan kejahatan sosial tersebut secara ringkas dan jelas.
- source_word: ψεύσταις
  choice: para pendusta
  rationale: Padanan yang langsung, wajar, dan sesuai dengan bentuk nomina jamak bagi orang-orang yang berdusta.
- source_word: ἐπιόρκοις
  choice: orang-orang yang bersumpah palsu
  rationale: Istilah ini menyatakan orang yang mengucapkan sumpah palsu atau melanggar kebenaran sumpah. Ungkapan ini lebih mudah dipahami pembaca umum daripada istilah hukum yang lebih teknis.
- source_word: καὶ εἴ τι ἕτερον
  choice: dan apa pun lainnya
  rationale: Ungkapan ini membuka cakupan daftar kepada segala perilaku lain yang sejenis; terjemahan ini mempertahankan sifatnya yang terbuka.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: dengan ajaran yang sehat
  rationale: Kata ὑγιαίνω secara harfiah berkaitan dengan keadaan sehat dan di sini dipakai secara metaforis. 'Ajaran yang sehat' alami dalam bahasa Indonesia sekaligus mempertahankan metafora sumber.
- source_word: ἀντίκειται
  choice: bertentangan dengan
  rationale: Bentuk ini menyatakan keadaan berlawanan atau menentang sesuatu. 'Bertentangan dengan' merupakan ungkapan Indonesia yang lugas dalam konteks ini.
theological_decisions:
- issue: Terjemahan ἀρσενοκοίταις dalam konteks yang diperdebatkan secara leksikal dan teologis
  choice: laki-laki yang berhubungan seks dengan laki-laki
  alternative: laki-laki yang melakukan hubungan homoseksual
  rationale: Pilihan utama mempertahankan unsur laki-laki dan tindakan seksual dalam istilah Yunani, tetapi tidak mengubahnya menjadi kategori orientasi atau identitas modern. Karena istilah tersebut langka dan batas tepat cakupannya diperdebatkan, catatan kaki mencantumkan alternatif yang lazim tanpa menghilangkan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur daftar dipertahankan sebagai bagian lanjutan dari kalimat ayat sebelumnya; karena itu teks berakhir dengan koma. Istilah perilaku dipilih tanpa memasukkan kategori identitas modern yang tidak dinyatakan oleh bahasa sumber.
