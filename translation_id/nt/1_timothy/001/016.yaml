  to: Tetapi justru karena itulah aku menerima belas kasihan, supaya Mesias[b] Yesus memperlihatkan seluruh kesabaran-Nya dalam diriku, sebagai yang paling utama[a], sebagai teladan bagi mereka yang kelak akan percaya kepada-Nya untuk memperoleh hidup kekal.
  rationale: Revisi mengurangi penumpukan penegasan pada pembuka, memperbaiki kelancaran elipsis “yang paling utama,” dan mengganti “pola” dengan “teladan,” yang lebih baku dan alami dalam konteks seseorang menjadi contoh bagi orang lain. Susunan “dalam diriku, sebagai yang paling utama” tetap mencerminkan ἐν ἐμοὶ πρώτῳ tanpa menambahkan “orang berdosa,” yang hanya tersurat pada ayat sebelumnya. Catatan kaki dipertahankan dan diselaraskan dengan teks revisi.
