  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: id
  text: Tetapi justru karena itulah aku menerima belas kasihan, supaya Mesias[b] Yesus memperlihatkan seluruh kesabaran-Nya dalam diriku, sebagai yang paling utama[a], sebagai teladan bagi mereka yang kelak akan percaya kepada-Nya untuk memperoleh hidup kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebagai orang pertama.” Kata Yunani dapat menunjuk kepada orang yang terutama atau yang pertama; konteks ayat sebelumnya mendukung arti “yang paling utama.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Kristus Yesus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau ditransliterasikan “Kristus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: aku menerima belas kasihan
  rationale: Bentuk pasif dipertahankan secara alami dalam bahasa Indonesia tanpa menyebut pelaku yang tidak dinyatakan dalam klausa ini.
- source_word: πρώτῳ
  choice: sebagai orang yang paling utama
  rationale: Menjaga makna ‘terutama/terdepan’ dan kaitannya dengan pengakuan Paulus pada ayat sebelumnya, tanpa memasukkan kata ‘paling berdosa’ yang tidak diulang dalam ayat ini.
- source_word: ἐνδείξηται
  choice: memperlihatkan
  rationale: Menyatakan penampakan atau demonstrasi yang nyata dan sesuai dengan klausa tujuan ἵνα.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mesias Yesus
  rationale: Χριστός masih dapat didengar sebagai gelar dalam konteks ini; ‘Mesias’ menyampaikan makna gelar tersebut, sedangkan bentuk tradisional ‘Kristus’ dicatat sebagai alternatif.
- source_word: ἅπασαν μακροθυμίαν
  choice: seluruh kesabaran-Nya
  rationale: ‘Seluruh’ mempertahankan penegasan totalitas dari ἅπασαν, sedangkan ‘kesabaran’ secara alami mencakup ketahanan dan pengendalian diri terhadap orang lain.
- source_word: ὑποτύπωσιν
  choice: pola
  rationale: Kata ini menunjuk pada contoh atau model yang menjadi gambaran bagi orang lain; ‘pola’ mempertahankan daya teladannya.
- source_word: τῶν μελλόντων πιστεύειν
  choice: mereka yang kelak akan percaya
  rationale: Menjaga arah waktu ke masa depan relatif terhadap pengalaman Paulus dengan ungkapan Indonesia yang wajar.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: percaya kepada-Nya
  rationale: Padanan Indonesia yang alami bagi πιστεύω dengan ἐπί dan datif, dengan objek kepercayaan tetap jelas.
- source_word: εἰς ζωὴν αἰώνιον
  choice: untuk memperoleh hidup kekal
  rationale: Mengungkapkan arah atau hasil yang ditandai εἰς secara alami; ‘memperoleh’ dibuat eksplisit demi kelancaran bahasa Indonesia tanpa menentukan mekanisme teologisnya.
theological_decisions:
- issue: Arti πρώτῳ dalam hubungan dengan ayat sebelumnya
  choice: orang yang paling utama
  alternative: orang pertama
  rationale: Bacaan utama mempertahankan kemungkinan bahwa Paulus menyebut dirinya yang terutama di antara orang berdosa, tetapi catatan kaki menjaga kemungkinan nuansa ‘pertama’ atau contoh awal.
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: ‘Mesias’ menerjemahkan makna gelarnya, sementara ‘Kristus’ adalah bentuk gerejawi yang mapan; alternatif dicatat agar tradisi istilah dan ambiguitas fungsi gelar tidak dihapus.
- issue: Pelaku belas kasihan dan kesabaran
  choice: Pelaku pada bentuk pasif tidak disebutkan; Mesias Yesus secara eksplisit menjadi subjek yang memperlihatkan kesabaran
  alternative: Menyebut Allah sebagai pelaku belas kasihan secara eksplisit
  rationale: Teks Yunani tidak menyebut pelaku ἠλεήθην, tetapi secara eksplisit menyebut Mesias Yesus dalam klausa tujuan. Terjemahan tidak menambahkan pelaku pada bentuk pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. ‘Namun, justru karena itulah’ menyampaikan kontras ἀλλά sekaligus penekanan διὰ τοῦτο. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia, tanpa mengubah isi gramatikal sumber.
