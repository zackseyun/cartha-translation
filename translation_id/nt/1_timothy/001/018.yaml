  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: id
  text: Amanat ini kupercayakan kepadamu, anakku Timotius, sesuai dengan nubuat-nubuat yang dahulu disampaikan tentang engkau[a], supaya dengan nubuat-nubuat itu engkau berjuang dalam peperangan yang baik[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengenai engkau”; mungkin juga “atas engkau,” dalam arti nubuat-nubuat yang diucapkan atas Timotius.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “melalui nubuat-nubuat itu” atau “di dalam nubuat-nubuat itu.” Bahasa Yunani dapat menyatakan sarana ataupun ranah.'
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “melakukan dinas perang yang baik” atau “menjalankan kampanye yang baik.” Ungkapan Yunani memakai gambaran militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: tugas
  rationale: Dalam konteks ini menunjuk pada arahan berwenang yang dipercayakan kepada Timotius. 'Tugas' terdengar alami dalam bahasa Indonesia dan, bersama 'kupercayakan', mempertahankan nuansa amanat tanpa membuatnya sekadar pengajaran.
- source_word: παρατίθεμαί
  choice: kupercayakan
  rationale: Bentuk tengah παρατίθημι menyatakan penyerahan sesuatu ke dalam tanggung jawab seseorang; 'kupercayakan' menangkap unsur kepercayaan dan tanggung jawab pribadi.
- source_word: τέκνον Τιμόθεε
  choice: Timotius, anakku
  rationale: τέκνον adalah sapaan kekeluargaan yang secara harfiah berarti 'anak'. Susunan ini alami sebagai sapaan penuh kasih dalam bahasa Indonesia tanpa mempersempitnya menjadi anak biologis.
- source_word: κατὰ
  choice: sesuai dengan
  rationale: κατά dengan akusatif menyatakan kesesuaian atau hubungan normatif antara tugas tersebut dan nubuat-nubuat terdahulu.
- source_word: προαγούσας
  choice: yang dahulu disampaikan
  rationale: Partisip ini membawa gagasan mendahului atau terjadi sebelumnya. Dalam hubungannya dengan nubuat, 'dahulu disampaikan' mengungkapkan waktunya secara idiomatis.
- source_word: ἐπὶ σὲ
  choice: tentang engkau
  rationale: Frasa ini paling wajar dipahami sebagai menunjuk kepada Timotius sebagai pokok atau sasaran nubuat, sambil mencatat kemungkinan 'atas engkau' dalam catatan kaki.
- source_word: προφητείας
  choice: nubuat-nubuat
  rationale: Padanan langsung dan lazim bagi bentuk jamak προφητείας, yaitu pesan-pesan profetis.
- source_word: ἐν αὐταῖς
  choice: dengan berpedoman pada semuanya itu
  rationale: ἐν dapat menyatakan sarana atau ranah. Ungkapan ini alami dan mempertahankan peranan nubuat-nubuat sebagai sarana atau pedoman, sementara kemungkinan lain dicatat.
- source_word: στρατεύῃ
  choice: menjalankan
  rationale: Bersama nomina serumpun στρατείαν, verba ini menggambarkan keterlibatan dalam dinas atau kampanye militer. 'Menjalankan' membentuk frasa Indonesia yang alami dengan 'perjuangan'.
- source_word: τὴν καλὴν στρατείαν
  choice: perjuangan yang baik
  rationale: Frasa ini mempertahankan citra perjuangan atau kampanye yang harus dijalankan. Catatan kaki menjelaskan bentuk yang lebih harfiah agar metafora militernya tidak hilang.
theological_decisions:
- issue: Hubungan nubuat dengan penugasan Timotius
  choice: Nubuat-nubuat terdahulu tentang Timotius menjadi dasar, pedoman, atau sarana baginya dalam menjalankan tugas yang dipercayakan Paulus.
  alternative: Nubuat-nubuat itu secara formal menahbiskan Timotius, atau hanya memberinya dorongan pribadi.
  rationale: Ayat ini menghubungkan amanat Paulus dengan nubuat-nubuat terdahulu, tetapi tidak menjelaskan suatu teori penahbisan atau mekanisme sakramental tertentu; terjemahan tidak menambahkannya.
- issue: Daya ἐν αὐταῖς
  choice: Teks utama menyatakan fungsi nubuat sebagai pedoman atau sarana tanpa menutup kemungkinan nuansa ranah.
  alternative: Di dalam nubuat-nubuat itu; melalui nubuat-nubuat itu.
  rationale: Preposisi ἐν secara wajar dapat menyatakan ranah maupun sarana di sini. Ambiguitas asli dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan berwibawa. 'Engkau' dipakai karena konteks sapaan pribadi kitab suci; susunan kalimat dibuat alami tanpa menghapus metafora militer atau ambiguitas preposisional.
