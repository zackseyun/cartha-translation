  to: dengan tetap berpegang pada iman dan hati nurani yang baik. Beberapa orang telah menolak hati nurani itu dan kandas dalam hal iman.[a][b]
  rationale: Revisi menyatakan secara aktif bahwa beberapa orang menolak hati nurani yang baik, sesuai dengan ἀπωσάμενοι, dan mengganti perluasan kausal serta possessiva yang tidak ada dalam sumber. ‘Kandas dalam hal iman’ mempertahankan metafora ἐναυάγησαν dan fungsi περὶ tanpa menjadikannya simile. Catatan a tetap menjaga kemungkinan, meskipun lebih lemah secara gramatikal, bahwa ἥν mencakup kedua unsur sebelumnya.
