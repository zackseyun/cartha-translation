  verdict: revise
  source_fidelity: Draf dengan tepat mengidentifikasi ἥν sebagai rujukan yang paling mungkin kepada ‘hati nurani’. Namun, ‘sehingga’ menyatakan hubungan akibat yang lebih eksplisit daripada konstruksi partisipial Yunani, ‘iman mereka’ menambahkan kepemilikan yang tidak dinyatakan, dan ‘bagaikan kapal yang karam’ mengubah metafora langsung menjadi perbandingan.
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Revisi mempertahankan pemecahan menjadi dua kalimat, tetapi memakai verba aktif untuk tindakan ‘beberapa orang’ dan metafora ‘kandas’ yang langsung serta wajar dalam bahasa Indonesia.
  terminology: ‘Iman’ dan ‘hati nurani yang baik’ tepat untuk πίστις dan ἀγαθὴ συνείδησις. ‘Dalam hal iman’ mempertahankan cakupan περὶ τὴν πίστιν tanpa menambahkan ‘mereka’ atau membatasi maknanya hanya pada iman pribadi.
  issues:
  - severity: medium
    issue: Hubungan kausal ‘sehingga’ ditambahkan.
    rationale: ἀπωσάμενοι adalah partisipel yang menandai tindakan penolakan terkait dengan kandasnya mereka, tetapi tidak secara eksplisit memakai penghubung kausal ‘sehingga’.
  - severity: medium
    issue: ‘Iman mereka’ menambahkan possessiva yang tidak ada dalam teks Yunani.
    rationale: Frasa περὶ τὴν πίστιν memakai artikel dan dapat menunjuk pada iman sebagai ranah atau isi iman; ‘mereka’ mempersempitnya ke iman personal.
  - severity: low
    issue: ‘Bagaikan kapal yang karam’ menjadikan metafora langsung sebagai simile.
    rationale: ἐναυάγησαν menyatakan bahwa subjek secara metaforis ‘kandas/mengalami karam’, bukan bahwa iman mereka sekadar menyerupai kapal karam.
  - severity: low
    issue: Catatan a menyebut bentuk pasif ‘yang telah ditolak’, sedangkan ἀπωσάμενοι adalah partisipel aktif bermakna ‘setelah menolak/menyingkirkan’.
    rationale: Walaupun hati nurani merupakan objek semantis tindakan, catatan perlu mencerminkan pelaku jamak yang dinyatakan dalam bahasa Yunani.
  revised_text: dengan tetap berpegang pada iman dan hati nurani yang baik. Beberapa orang telah menolak hati nurani itu dan kandas dalam hal iman.[a][b]
