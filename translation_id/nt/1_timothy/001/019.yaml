  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: id
  text: dengan tetap berpegang pada iman dan hati nurani yang baik. Beberapa orang telah menolak hati nurani itu dan kandas dalam hal iman.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang beberapa orang telah tolak.” Kata “yang” paling alami merujuk pada “hati nurani,” meskipun ada yang memahaminya sebagai merujuk lebih luas pada “iman dan hati nurani yang baik.”
    reason: alternative_reading
  - marker: b
    text: “Iman” juga dapat dipahami sebagai “kepercayaan,” atau—meskipun kurang mungkin di sini—“kesetiaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: dengan tetap berpegang pada
  rationale: Partisipel kini ini meneruskan nasihat pada ayat sebelumnya dan menyatakan tindakan yang terus berlangsung; ungkapan ini alami dalam bahasa Indonesia.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada iman Kristen, sementara nuansa 'kepercayaan' tetap mungkin secara leksikal.
- source_word: ἀγαθὴν συνείδησιν
  choice: hati nurani yang baik
  rationale: Terjemahan langsung yang mempertahankan nilai moral ἀγαθή tanpa mempersempitnya menjadi sekadar hati nurani yang tidak merasa bersalah.
- source_word: ἥν
  choice: Hati nurani itu
  rationale: Pronomina relatif feminin tunggal paling alami merujuk kepada συνείδησιν, nomina feminin tunggal terdekat. Pengulangan nomina diperlukan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: τινες
  choice: beberapa orang
  rationale: Menyampaikan rujukan jamak tak tentu secara jelas dan wajar.
- source_word: ἀπωσάμενοι
  choice: telah ditolak
  rationale: Bentuk ini menyampaikan tindakan sengaja menyingkirkan atau menampik hati nurani; konstruksi pasif mempertahankan hati nurani sebagai sasaran tindakan.
- source_word: περὶ τὴν πίστιν
  choice: iman mereka
  rationale: Frasa Yunani menunjukkan bidang atau hal yang mengalami kehancuran. Susunan Indonesia ini menyampaikan bahwa karamnya terjadi sehubungan dengan iman, dengan 'mereka' tersirat dari subjek jamak.
- source_word: ἐναυάγησαν
  choice: bagaikan kapal yang karam
  rationale: Mempertahankan metafora nautis secara jelas dan idiomatis; 'bagaikan' menandai pemakaian kiasan yang sudah tersirat dalam konteks.
theological_decisions:
- issue: Rujukan ἥν
  choice: Merujuk khusus kepada 'hati nurani yang baik'.
  alternative: Merangkum 'iman dan hati nurani yang baik' secara bersama-sama.
  rationale: Bentuk feminin tunggal ἥν paling alami bersesuaian dengan συνείδησιν, anteceden feminin tunggal terdekat, tetapi catatan mempertahankan kemungkinan cakupan yang lebih luas.
- issue: Makna περὶ τὴν πίστιν
  choice: Karam dalam hal iman mereka.
  alternative: Karam sehubungan dengan 'iman' sebagai ajaran atau kumpulan kepercayaan Kristen.
  rationale: Frasa ini dapat menunjuk pada ranah iman pribadi maupun iman Kristen secara lebih objektif; teks utama memakai ungkapan alami tanpa menutup kemungkinan kedua.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Metafora kapal karam dipertahankan, sedangkan struktur Yunani yang padat dipecah menjadi dua kalimat agar rujukan pronomina jelas bagi pembaca umum.
