  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: id
  text: Di antara mereka ada Himeneus dan Aleksander, yang telah kuserahkan kepada Setan[a] supaya mereka dididik[b] untuk tidak menghujat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini mungkin menunjuk pada tindakan disiplin yang keras dengan tujuan korektif, bukan penghukuman akhir; teks tidak menjelaskan mekanismenya.
    reason: explanatory_note
  - marker: b
    text: “Dididik” juga dapat diterjemahkan “didisiplinkan,” “diajar,” atau “dikoreksi”; kata Yunani ini mencakup gagasan pendidikan melalui koreksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Di antara mereka ada
  rationale: Mengungkapkan makna partitif dari pronomina relatif genitif dan mengaitkannya secara alami dengan kelompok yang disebut dalam ayat sebelumnya.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Himeneus dan Aleksander
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: οὓς παρέδωκα
  choice: Keduanya telah kuserahkan
  rationale: Kata 'keduanya' memperjelas acuan pronomina jamak tanpa menambah makna, sedangkan 'telah kuserahkan' menyampaikan tindakan lampau yang tetap relevan dalam konteks.
- source_word: τῷ Σατανᾷ
  choice: kepada Setan
  rationale: Mempertahankan sebutan personal yang baku dalam bahasa Indonesia dan tidak menafsirkan mekanisme tindakan tersebut.
- source_word: ἵνα παιδευθῶσι
  choice: supaya mereka dididik
  rationale: Bentuk pasif dan tujuan dipertahankan. 'Dididik' mencakup pengajaran melalui koreksi atau disiplin tanpa membatasi maknanya pada hukuman fisik.
- source_word: μὴ βλασφημεῖν
  choice: untuk tidak menghujat
  rationale: '''Menghujat'' mempertahankan bobot religius βλασφημέω, sementara konstruksi ini secara alami menyatakan perilaku yang harus mereka hentikan.'
theological_decisions:
- issue: Makna 'diserahkan kepada Setan'
  choice: Ungkapan dipertahankan secara harfiah, dengan catatan bahwa tujuannya bersifat korektif.
  alternative: Menafsirkannya secara eksplisit sebagai pengucilan dari jemaat, penderitaan fisik ajaib, atau penghukuman kekal.
  rationale: Klausa tujuan menunjukkan maksud pendidikan atau koreksi, tetapi teks tidak menjelaskan mekanismenya; karena itu, terjemahan tidak menetapkan satu tafsiran tertentu.
- issue: Nuansa παιδευθῶσι
  choice: dididik
  alternative: didisiplinkan; diajar; dikoreksi
  rationale: Kata Yunani dapat mencakup pengajaran, pelatihan, dan disiplin korektif. 'Dididik' menjaga keluasan makna tersebut, sedangkan catatan kaki menyebutkan nuansa korektifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar hubungan antarayat dan acuan pronomina tetap jelas bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
