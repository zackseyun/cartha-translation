  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: id
  text: karena mereka ingin menjadi pengajar hukum,[a] padahal mereka tidak memahami baik apa yang mereka katakan maupun mengenai hal-hal apa mereka membuat penegasan yang kuat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pengajar hukum”; dalam konteks ini, kemungkinan besar yang dimaksud ialah orang-orang yang mengaku berwenang mengajarkan hukum Yahudi, yaitu Taurat.
    reason: cultural_note
  - marker: b
    text: 'Atau: “tanpa memahami apa yang mereka katakan ataupun mengenai hal-hal apa mereka membuat penegasan yang kuat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: karena mereka ingin
  rationale: Partisipel kini menerangkan subjek yang tersirat dari ayat sebelumnya. 'Ingin' mempertahankan unsur kehendak; 'karena' menghubungkannya secara alami dengan konteks kalimat sebelumnya.
- source_word: εἶναι
  choice: menjadi
  rationale: Infinitif pelengkap bagi θέλοντες, yang secara alami diterjemahkan 'ingin menjadi'.
- source_word: νομοδιδάσκαλοι
  choice: pengajar hukum Taurat
  rationale: Nomina majemuk ini berarti orang yang mengajarkan hukum. Dalam konteks Yahudi, 'hukum Taurat' menyampaikan rujukan yang sangat mungkin dengan jelas dan alami, sementara catatan kaki menerangkan lingkupnya.
- source_word: μὴ νοοῦντες
  choice: padahal mereka tidak memahami
  rationale: 'Partisipel ini bersifat kontras atau konsesif: mereka ingin mengajar, tetapi tidak memahami. ''Padahal'' mengungkapkan pertentangan tersebut secara idiomatis.'
- source_word: μήτε ... μήτε
  choice: baik ... maupun ... tidak
  rationale: Korelasi negatif Yunani dinyatakan secara alami dalam susunan Indonesia 'tidak memahami baik X maupun Y'.
- source_word: ἃ λέγουσιν
  choice: apa yang mereka katakan
  rationale: Mempertahankan isi ujaran sebagai objek pemahaman tanpa menambahkan penafsiran.
- source_word: περὶ τίνων
  choice: hal-hal yang
  rationale: Dalam hubungan dengan verba berikutnya, frasa ini menunjuk kepada perkara-perkara yang menjadi pokok penegasan mereka.
- source_word: διαβεβαιοῦνται
  choice: mereka tegaskan dengan penuh keyakinan
  rationale: Verba ini menyatakan penegasan kuat atau bersikeras dengan yakin. Pilihan ini mempertahankan kekuatan ujarannya tanpa menyiratkan bahwa isinya benar.
theological_decisions:
- issue: Rujukan νομοδιδάσκαλοι kepada hukum
  choice: pengajar hukum Taurat
  alternative: pengajar hukum
  rationale: Walaupun unsur νόμος secara harfiah berarti 'hukum', konteks surat dan istilah bagi pengajar hukum sangat mungkin menunjuk kepada Taurat Yahudi. Rumusan Indonesia 'hukum Taurat' menghindari kesan hukum sipil umum; catatan kaki tetap mengakui sifat kontekstual identifikasi tersebut.
- issue: Hubungan partisipel μὴ νοοῦντες dengan keinginan menjadi pengajar
  choice: padahal mereka tidak memahami
  alternative: tanpa memahami
  rationale: Konteks memperlihatkan pertentangan antara ambisi mengajar dan ketiadaan pemahaman. 'Padahal' menyatakan hubungan konsesif tanpa menambah penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ayat diawali dengan 'karena' untuk mempertahankan hubungan sintaksis partisipel dengan ayat sebelumnya. Istilah 'pengajar hukum Taurat' mudah dipahami pembaca umum; struktur paralel negatif dipertahankan tanpa kekakuan berlebihan.
