  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: id
  text: Seperti yang telah kuminta kepadamu untuk tetap tinggal di Efesus ketika aku pergi ke Makedonia, supaya engkau memerintahkan orang-orang tertentu untuk tidak mengajarkan ajaran yang berbeda,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: Seperti yang
  rationale: Mempertahankan fungsi pengait yang mengingatkan Timotius pada permintaan Paulus sebelumnya; ungkapan ini alami dalam bahasa Indonesia.
- source_word: παρεκάλεσά σε
  choice: telah kuminta kepadamu
  rationale: Dalam konteks ini παρακαλέω menyatakan permintaan yang sungguh-sungguh. 'Kuminta' terdengar alami dan tidak mengubahnya menjadi perintah langsung.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: tetaplah di Efesus
  rationale: Infinitif ini melengkapi permintaan Paulus dan berarti terus tinggal atau menetap di tempat tersebut; bentuk imperatif Indonesia menghasilkan kalimat yang wajar.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: ketika aku hendak pergi ke Makedonia
  rationale: Partisip paling alami dipahami secara temporal dengan Paulus sebagai subjek. 'Hendak pergi' mempertahankan latar perjalanan tanpa menyatakan secara berlebihan tahap tepat perjalanan itu.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dari permintaan agar Timotius tetap tinggal di Efesus.
- source_word: παραγγείλῃς
  choice: engkau memerintahkan
  rationale: παραγγέλλω menyatakan arahan berwenang, dan 'memerintahkan' menyampaikan kekuatan itu dengan jelas dalam bahasa Indonesia modern.
- source_word: τισὶν
  choice: orang-orang tertentu
  rationale: Menunjuk kepada sejumlah orang tertentu yang tidak disebutkan namanya.
- source_word: ἑτεροδιδασκαλεῖν
  choice: mengajarkan ajaran yang berbeda
  rationale: Mempertahankan gagasan leksikal tentang ajaran yang lain atau berbeda tanpa secara eksplisit menambahkan penilaian 'palsu'.
theological_decisions:
- issue: Kekuatan παραγγείλῃς dalam konteks penertiban jemaat
  choice: memerintahkan
  alternative: menasihati; memberi petunjuk kepada
  rationale: Kata Yunani ini membawa kewenangan yang lebih kuat daripada nasihat biasa. Pilihan ini membedakannya dari παρακαλέω sebelumnya dan mempertahankan pendelegasian wewenang kepada Timotius.
- issue: Penilaian yang terkandung dalam ἑτεροδιδασκαλεῖν
  choice: mengajarkan ajaran yang berbeda
  alternative: mengajarkan ajaran lain; mengajarkan ajaran palsu
  rationale: Bentuk majemuk itu menekankan perbedaan dari ajaran yang menjadi norma. 'Ajaran palsu' akan membuat penilaian tersirat menjadi lebih eksplisit daripada bentuk leksikalnya sendiri.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'engkau' serta bentuk terikat 'kuminta' menjaga nada surat pribadi sekaligus formal. Susunan kalimat mempertahankan kaitan dengan konteks sebelumnya; karena ayat Yunani belum menyelesaikan konstruksi Καθὼς secara mandiri, koma akhir dipertahankan.
