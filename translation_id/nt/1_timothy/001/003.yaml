revisions:
- from: Seperti yang telah kuminta kepadamu ketika aku hendak pergi ke Makedonia, tetaplah di Efesus supaya engkau memerintahkan orang-orang tertentu untuk tidak mengajarkan ajaran yang berbeda,
  to: Seperti yang telah kuminta kepadamu untuk tetap tinggal di Efesus ketika aku pergi ke Makedonia, supaya engkau memerintahkan orang-orang tertentu untuk tidak mengajarkan ajaran yang berbeda,
  rationale: Revisi mempertahankan daya “kuminta” untuk παρεκάλεσά, tujuan “supaya,” kewenangan παραγγείλῃς sebagai “memerintahkan,” dan ambiguitas evaluatif ἑτεροδιδασκαλεῖν. “Untuk tetap tinggal” memelihara fungsi infinitif προσμεῖναι dan menempatkan keterangan perjalanan Paulus secara lebih jelas. Koma akhir dipertahankan karena konstruksi Καθὼς berlanjut ke ayat berikutnya.
