id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: id
  text: Namun, anugerah Tuhan kita melimpah dengan luar biasa, bersama dengan iman dan kasih yang ada dalam Mesias Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus Yesus.”
    reason: Padanan tradisional bagi gelar Yunani Χριστός.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: melimpah dengan luar biasa
  rationale: Kata kerja majemuk ini memperkuat gagasan ‘melimpah’ atau ‘bertambah banyak’. Ungkapan ini menyampaikan kelimpahan yang amat besar dalam bahasa Indonesia modern tanpa terdengar kaku.
- source_word: δὲ
  choice: Namun
  rationale: Dalam konteks ini δέ menandai kontras dengan keadaan Paulus sebelumnya dalam ketidakpercayaan dan dosa.
- source_word: χάρις
  choice: anugerah
  rationale: ‘Anugerah’ merupakan padanan Indonesia yang lazim dan tepat untuk kemurahan Allah yang diberikan tanpa didasarkan pada jasa manusia.
- source_word: κυρίου
  choice: Tuhan
  rationale: ‘Tuhan’ adalah padanan baku bagi κύριος dan mempertahankan bobot gelar tersebut.
- source_word: μετὰ
  choice: bersama dengan
  rationale: μετά dengan genitif menyatakan penyertaan. Pilihan ini mempertahankan hubungan gramatikal iman dan kasih dengan anugerah yang melimpah tanpa menetapkan secara eksplisit hubungan sebab-akibat.
- source_word: πίστεως
  choice: iman
  rationale: Dalam ayat ini πίστις paling langsung berarti ‘iman’; bentuknya bukan konstruksi genitif yang menimbulkan perdebatan antara iman dan kesetiaan.
- source_word: ἀγάπης
  choice: kasih
  rationale: ‘Kasih’ adalah padanan alami dan mapan bagi ἀγάπη dalam bahasa Indonesia Alkitabiah modern.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Artikel feminin tunggal secara bentuk paling dekat dengan ἀγάπης, tetapi frasa ini secara makna dapat mencakup pasangan ‘iman dan kasih’. Terjemahan Indonesia mempertahankan keluwesan cakupan tersebut tanpa menambahkan penjelasan kausal.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός secara leksikal berarti ‘Yang Diurapi’ atau ‘Mesias’. ‘Mesias Yesus’ mempertahankan daya gelarnya; bentuk tradisional ‘Kristus Yesus’ dicatat sebagai alternatif.
theological_decisions:
- issue: Hubungan ‘bersama dengan iman dan kasih’ dengan anugerah
  choice: Iman dan kasih menyertai anugerah Tuhan yang melimpah.
  alternative: Iman dan kasih secara khusus dinyatakan sebagai hasil yang dihasilkan oleh anugerah dalam diri Paulus.
  rationale: Secara sintaksis, frasa μετά πίστεως καὶ ἀγάπης melekat pada kata kerja tentang melimpahnya anugerah. Terjemahan mempertahankan hubungan penyertaan itu tanpa menutup kemungkinan bahwa secara teologis anugerah menghasilkan iman dan kasih.
- issue: Cakupan frasa ‘yang ada dalam Mesias Yesus’
  choice: Dibiarkan dapat menerangkan ‘iman dan kasih’ sebagai satu pasangan.
  alternative: Dipahami hanya menerangkan ‘kasih’ karena kesesuaian bentuk artikel τῆς dengan ἀγάπης.
  rationale: Walaupun artikel feminin tunggal secara formal mengikuti ‘kasih’, pasangan nomina yang dihubungkan dengan καί dapat dipandang bersama. Bahasa Indonesia memungkinkan ambiguitas asli ini tetap terbuka.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: ‘Mesias’ menyatakan arti gelar Yunani Χριστός secara transparan, sedangkan bentuk gerejawi yang lebih tradisional disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Melimpah dengan luar biasa’ mempertahankan intensitas kata kerja Yunani; ‘bersama dengan’ sengaja mempertahankan hubungan sintaktis tanpa menambahkan gagasan sebab-akibat yang tidak dinyatakan secara eksplisit.
