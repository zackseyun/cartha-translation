  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: id
  text: Kita tahu bahwa hukum itu baik jika orang menggunakannya sebagaimana mestinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan hukum” atau “secara semestinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Kita tahu
  rationale: Bentuk οἶδα bernilai kini dan menyatakan pengetahuan yang sudah mantap; “kita tahu” alami dan tepat dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ menandai peralihan ringan. Dalam bahasa Indonesia, hubungan wacananya cukup tersirat; menambahkan “tetapi” akan memperkuat pertentangan, sedangkan “sekarang” dapat disalahpahami sebagai penanda waktu.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang diketahui.
- source_word: καλὸς
  choice: baik
  rationale: Menyatakan penilaian positif yang luas terhadap hukum tanpa mempersempitnya menjadi “mulia” atau “unggul”.
- source_word: ὁ νόμος
  choice: hukum itu
  rationale: Artikel Yunani menunjuk kepada hukum yang sedang dibicarakan. “Hukum itu” mempertahankan kekhususan acuan tanpa menambahkan bahwa yang dimaksud pasti Hukum Musa.
- source_word: ἐάν τις
  choice: jika orang
  rationale: Konstruksi bersyarat generik. Dalam bahasa Indonesia, “jika orang” menyampaikan pelaku umum tanpa kekakuan “jika seseorang” dalam aforisme ini.
- source_word: αὐτῷ
  choice: -nya
  rationale: Pronomina ini mengacu kembali kepada hukum dan dinyatakan secara alami sebagai enklitik objek pada “menggunakannya”.
- source_word: νομίμως
  choice: sebagaimana mestinya
  rationale: Menyampaikan penggunaan yang sesuai dengan aturan atau norma secara alami. Makna alternatif “sesuai dengan hukum” dicatat karena mempertahankan permainan kata dengan νόμος.
- source_word: χρῆται
  choice: menggunakannya
  rationale: χράομαι berarti memakai atau menggunakan; bentuk ini ringkas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ὁ νόμος
  choice: hukum itu
  alternative: Hukum Musa; hukum secara umum
  rationale: Konteks mungkin terutama menunjuk kepada Hukum Musa, tetapi teks hanya menyebut “hukum itu”; terjemahan tidak mempersempit cakupan yang dibiarkan terbuka oleh teks.
- issue: Makna νομίμως dan kaitannya dengan νόμος
  choice: sebagaimana mestinya
  alternative: sesuai dengan hukum; dengan semestinya
  rationale: Pilihan utama paling alami dalam bahasa Indonesia dan menyatakan pemakaian yang tepat, sementara catatan kaki mempertahankan kemungkinan nuansa “menurut hukum” serta permainan kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada pernyataan ajaran. Tanda catatan kaki ditempatkan setelah klausa yang diterangkannya agar jelas bahwa alternatif berkenaan dengan cara menggunakan hukum.
