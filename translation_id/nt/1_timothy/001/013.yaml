  - marker: c
    text: Atau “tanpa mengetahui” atau “karena tidak tahu.”
    reason: lexical_alternative
  - marker: d
    text: Atau “dalam ketiadaan iman” atau “dalam ketidaksetiaan.” Di sini maknanya kemungkinan besar adalah tidak adanya iman atau kepercayaan, bukan ketidaksetiaan terhadap perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: aku yang dahulu seorang
  rationale: Frasa ini menunjuk kembali kepada Paulus dalam ayat sebelumnya dan menggambarkan keadaannya pada masa lampau. Bentuk ini mempertahankan hubungan partisipialnya tanpa menghasilkan bahasa Indonesia yang kaku.
- source_word: βλάσφημον
  choice: penghujat
  rationale: Kata ini dipakai sebagai nomina yang menggambarkan Paulus; “penghujat” merupakan padanan langsung dan lazim.
- source_word: διώκτην
  choice: penganiaya
  rationale: Padanan baku untuk orang yang mengejar dan menindas orang lain karena iman mereka.
- source_word: ὑβριστήν
  choice: pelaku kekerasan
  rationale: Istilah Yunani ini menunjuk pada orang yang bertindak menghina, sewenang-wenang, dan dengan kekerasan. “Pelaku kekerasan” menyampaikan tindakan agresifnya tanpa mempersempit makna menjadi kesombongan saja.
- source_word: ἠλεήθην
  choice: aku mendapat belas kasihan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bahwa belas kasihan diterima Paulus; catatan kaki mempertahankan kemungkinan untuk mengungkapkan bentuk pasif Yunani secara lebih harfiah.
- source_word: ὅτι
  choice: karena
  rationale: Kata penghubung ini paling wajar menyatakan alasan atau dasar penjelasan bagi belas kasihan yang diterima Paulus.
- source_word: ἀγνοῶν
  choice: dalam ketidaktahuan
  rationale: Padanan ini mempertahankan keadaan atau cara Paulus bertindak tanpa menambahkan objek pengetahuan yang tidak dinyatakan dalam teks.
- source_word: ἐποίησα
  choice: aku bertindak
  rationale: Karena tidak ada objek eksplisit, “aku bertindak” lebih alami daripada “aku melakukannya” dan tetap mencerminkan keluasan makna ποιέω.
- source_word: ἐν ἀπιστίᾳ
  choice: dalam ketidakpercayaan
  rationale: Dalam konteks ini istilah tersebut terutama menunjuk pada ketiadaan iman atau kepercayaan, bukan secara khusus pada ketidaksetiaan terhadap perjanjian.
theological_decisions:
- issue: Hubungan kausal yang diperkenalkan oleh ὅτι
  choice: Paulus mengatakan bahwa ia mendapat belas kasihan karena ia bertindak dalam ketidaktahuan dan ketidakpercayaan.
  alternative: ὅτι hanya memperkenalkan keadaan yang menjelaskan tindakannya, bukan alasan bagi belas kasihan.
  rationale: “Karena” mempertahankan hubungan kausal atau eksplanatoris yang wajar dalam bahasa Yunani. Terjemahan tidak menyatakan bahwa ketidaktahuan membuat Paulus layak menerima belas kasihan; ketegangan teologis dalam kalimat sumber dibiarkan tetap ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Deretan tiga sebutan dipertahankan, tetapi pengulangan konjungsi Yunani tidak ditiru secara mekanis. Tanda koma akhir mempertahankan kesinambungan sintaksis dengan ayat berikutnya.
