  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: id
  text: 'Perkataan ini dapat dipercaya dan layak diterima sepenuhnya: Mesias Yesus[a] datang ke dunia untuk menyelamatkan orang-orang berdosa, di antara mereka akulah yang paling utama.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus Yesus.”
    reason: alternative_reading
  - marker: b
    text: 'Atau, “akulah yang paling berdosa” atau “akulah yang terkemuka.” Secara harfiah: “akulah yang pertama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Perkataan ini dapat dipercaya
  rationale: Rumus dalam Surat-Surat Pastoral ini memperkenalkan suatu pernyataan ringkas yang dapat diandalkan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi idiomatisnya.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: layak diterima sepenuhnya
  rationale: ἀποδοχή berarti penerimaan, sedangkan πάσης menegaskan kelengkapannya; terjemahan ini tepat sekaligus wajar.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι memperkenalkan isi perkataan yang dapat dipercaya. Dalam bahasa Indonesia, tanda titik dua mengungkapkan hubungan isi itu secara lebih alami daripada menambahkan 'bahwa' setelah konstruksi ini.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mesias Yesus
  rationale: Χριστός mempertahankan makna gelarnya, yaitu Mesias, sedangkan Ἰησοῦς dialihaksarakan sebagai nama Yesus.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: datang ke dunia
  rationale: Ungkapan ini secara langsung mempertahankan gerak yang dinyatakan verba dan resonansi teologisnya tanpa penjelasan tambahan.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: untuk menyelamatkan orang-orang berdosa
  rationale: Infinitif σῶσαι menyatakan tujuan, dan ἁμαρτωλούς merupakan adjektiva substantival yang merujuk kepada orang-orang berdosa.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: dan di antara mereka akulah yang paling utama
  rationale: πρῶτος dapat berarti pertama atau terkemuka dalam urutan/peringkat. 'Paling utama' mempertahankan gambaran tersebut tanpa langsung menafsirkannya sebagai 'paling jahat'; 'akulah' menyampaikan penekanan ἐγώ.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam pernyataan pengakuan ini, makna Χριστός sebagai gelar tetap nyata. Alternatif tradisional dicatat karena dalam pemakaian surat ini unsur tersebut juga dapat dipahami secara lebih menyerupai nama.
- issue: Makna πρῶτος di antara orang berdosa
  choice: yang paling utama
  alternative: yang paling berdosa / yang terburuk
  rationale: Teks Yunani memakai istilah peringkat 'pertama', bukan kata yang secara leksikal berarti 'terburuk'. Terjemahan utama mempertahankan ketegangan tersebut, sementara catatan memberi penafsiran kontekstual yang lazim.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan formula pengantar, tujuan kedatangan Yesus, penekanan pada 'aku', atau ambiguitas πρῶτος.
