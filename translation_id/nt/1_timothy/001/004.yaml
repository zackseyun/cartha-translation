  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: id
  text: dan supaya mereka tidak menaruh perhatian pada mitos-mitos dan silsilah-silsilah yang tiada habisnya, yang menimbulkan spekulasi[a], bukannya penatalayanan dari Allah dalam iman[c][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menimbulkan perdebatan” atau “melahirkan berbagai penyelidikan.” Istilah Yunani ini dapat menunjuk pada penyelidikan atau perselisihan, di sini dalam arti negatif sebagai spekulasi yang tidak produktif.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengelolaan Allah” atau “rencana Allah.” Kata Yunani οἰκονομία dapat berarti penatalayanan, pengelolaan, atau rencana yang teratur.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “dalam iman.” Di sini “iman” juga dapat mengandung nuansa “kepercayaan” atau “kesetiaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: menaruh perhatian pada
  rationale: Ungkapan ini mempertahankan arti memberi perhatian atau mengindahkan sesuatu dan secara alami melanjutkan perintah dari ayat sebelumnya.
- source_word: μύθοις
  choice: mitos-mitos
  rationale: Padanan langsung dan modern yang tidak memberi kesan khusus tentang dongeng anak-anak.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: silsilah-silsilah yang tiada habisnya
  rationale: Menyampaikan gagasan tentang rangkaian silsilah yang tak berujung sekaligus mempertahankan nada negatif konteksnya.
- source_word: ἐκζητήσεις
  choice: spekulasi
  rationale: Dalam konteks ini menunjuk pada penyelidikan atau perdebatan yang tidak menghasilkan manfaat; 'spekulasi' menangkap sifatnya yang sia-sia tanpa membatasinya hanya pada pertikaian.
- source_word: παρέχουσι
  choice: menimbulkan
  rationale: Mengungkapkan bahwa hal-hal tersebut menyebabkan atau menghasilkan spekulasi.
- source_word: μᾶλλον ἢ
  choice: bukannya
  rationale: Menyatakan kontras hasil secara alami dalam bahasa Indonesia.
- source_word: οἰκονομίαν θεοῦ
  choice: penatalayanan dari Allah
  rationale: Mempertahankan inti makna οἰκονομία sebagai penatalayanan atau pengelolaan, sedangkan 'dari Allah' menjaga kemungkinan genitif sumber tanpa menutup kemungkinan hubungan kepunyaan.
- source_word: τὴν ἐν πίστει
  choice: yang berlangsung dalam iman
  rationale: Frasa ini menerangkan penatalayanan dan mempertahankan nuansa ranah atau cara dari ἐν tanpa mengubah πίστις menjadi konsep yang lebih sempit.
- source_word: πίστει
  choice: iman
  rationale: Padanan baku bagi πίστις dalam konteks ini; kemungkinan nuansa kepercayaan atau kesetiaan dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna οἰκονομίαν θεοῦ
  choice: penatalayanan dari Allah
  alternative: pengelolaan Allah; rencana Allah
  rationale: Ungkapan Yunani dapat menunjuk pada penatalayanan, tata kelola, atau rencana yang teratur. Terjemahan utama mempertahankan gambaran konkretnya dan tidak menyempitkannya menjadi suatu sistem teologis tertentu.
- issue: Makna πίστει dalam τὴν ἐν πίστει
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Ayat ini tidak menuntut penyempitan makna menjadi 'kesetiaan' atau 'kepercayaan'; 'iman' mempertahankan istilah yang luas, sementara nuansa lain dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak ulang dipakai untuk mencerminkan kedua nomina jamak Yunani. Tanda pisah akhir dipertahankan karena kalimat berlanjut dari dan menuju konteks ayat-ayat sekitarnya.
