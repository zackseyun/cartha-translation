source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: id
  text: Tujuan[a] perintah[b] itu adalah kasih yang timbul dari hati yang murni, hati nurani yang baik, dan iman yang tulus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sasaran” atau “hasil yang dimaksudkan” dari perintah itu.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “perintah” juga dapat berarti “instruksi” atau “amanat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “iman yang tidak munafik.” Dalam konteks tertentu, kata Yunani yang diterjemahkan “iman” juga dapat berarti “kesetiaan” atau “kepercayaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: tujuan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada sasaran atau hasil yang dimaksudkan oleh perintah, bukan berakhirnya perintah itu.
- source_word: παραγγελίας
  choice: perintah
  rationale: Kata ini dapat berarti perintah, pesan yang dipercayakan, atau pengarahan. Dalam konteks 1 Timotius 1:3–4, 'perintah' mempertahankan daya otoritatifnya dan tetap wajar dalam bahasa Indonesia.
- source_word: ἀγάπη
  choice: kasih
  rationale: Padanan baku dan alami bagi kasih yang menjadi sasaran pengajaran Kristen.
- source_word: ἐκ
  choice: yang timbul dari
  rationale: ἐκ menandai sumber atau asal; ungkapan ini memperjelas secara alami bahwa kasih berasal dari tiga hal yang disebut sesudahnya.
- source_word: καθαρᾶς καρδίας
  choice: hati yang murni
  rationale: Mempertahankan gambaran batiniah dan makna moral frasa Yunani dalam bahasa Indonesia yang alami.
- source_word: συνειδήσεως ἀγαθῆς
  choice: hati nurani yang baik
  rationale: Lebih dekat dengan ἀγαθῆς daripada padanan yang lebih interpretatif seperti 'hati nurani yang bersih'.
- source_word: πίστεως
  choice: iman
  rationale: Padanan utama πίστις di sini; konteks mendukung iman yang sejati, sementara kemungkinan 'kesetiaan' atau 'kepercayaan' dicatat dalam catatan kaki.
- source_word: ἀνυποκρίτου
  choice: yang tulus
  rationale: Menyampaikan arti 'tanpa kemunafikan' secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ merupakan penghubung ringan. Dalam bahasa Indonesia ayat ini tetap mengalir alami tanpa menambahkan penanda seperti 'sekarang' atau 'tetapi' yang dapat memberi tekanan berlebihan.
theological_decisions:
- issue: Makna πίστις dalam πίστεως ἀνυποκρίτου
  choice: iman
  alternative: kesetiaan atau kepercayaan
  rationale: Dalam konteks ini, 'iman' paling mungkin menunjuk pada iman yang sejati sebagai salah satu sumber kasih. Namun, rentang makna πίστις memungkinkan nuansa 'kesetiaan' atau 'kepercayaan', sehingga kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. Frasa 'yang timbul dari' dipakai agar hubungan sumber yang dinyatakan oleh ἐκ terdengar alami. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
