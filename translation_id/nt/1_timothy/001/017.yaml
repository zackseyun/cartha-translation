source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: id
  text: Bagi Raja segala zaman[a], yang tidak binasa dan tidak kelihatan, satu-satunya Allah, hormat dan kemuliaan untuk selama-lamanya. Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi, “Allah satu-satunya yang bijaksana.”
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Raja segala zaman
  rationale: Mempertahankan konstruksi genitif dan bahasa αἰών secara wajar dalam bahasa Indonesia, sekaligus menyatakan pemerintahan Allah atas seluruh zaman tanpa mereduksinya menjadi sekadar sifat 'kekal'.
- source_word: ἀφθάρτῳ
  choice: yang tidak dapat binasa
  rationale: Mengungkapkan bahwa Allah tidak tunduk kepada kebinasaan, kerusakan, atau kematian; bentuk relatif ini alami dalam rangkaian gelar bahasa Indonesia.
- source_word: ἀοράτῳ
  choice: tidak kelihatan
  rationale: Padanan langsung dan lazim untuk sifat Allah yang tidak dapat dilihat.
- source_word: μόνῳ θεῷ
  choice: satu-satunya Allah
  rationale: Mencerminkan secara langsung pengakuan monoteistis dalam teks SBLGNT tanpa menambahkan kata 'bijaksana' dari varian tekstual.
- source_word: τιμὴ καὶ δόξα
  choice: segala hormat dan kemuliaan
  rationale: Padanan idiomatis dan bermartabat bagi pasangan doxologis ini; 'segala' memperjelas bahwa keduanya merupakan penghormatan yang dipersembahkan kepada Allah tanpa mengubah makna pokok.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: sampai selama-lamanya
  rationale: Menyampaikan idiom durasi tanpa akhir dalam bahasa Indonesia yang alami dan lazim.
- source_word: ἀμήν
  choice: Amin
  rationale: Memakai bentuk serapan konvensional dalam Alkitab dan ibadah berbahasa Indonesia.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini mengantar tanggapan doxologis; dalam bahasa Indonesia hubungan wacananya sudah jelas tanpa menambahkan kata temporal seperti 'sekarang'.
theological_decisions:
- issue: Daya monoteistis frasa μόνῳ θεῷ
  choice: satu-satunya Allah
  alternative: Allah saja
  rationale: Terjemahan mempertahankan pengakuan eksplisit teks bahwa Allah adalah satu-satunya Allah, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Varian tekstual σοφῷ setelah μόνῳ
  choice: Kata 'bijaksana' tidak dimasukkan ke teks utama
  alternative: satu-satunya Allah yang bijaksana
  rationale: SBLGNT yang menjadi teks sumber tidak memuat σοφῷ; bacaan yang lebih panjang dicatat dalam catatan kaki karena dikenal dalam sebagian tradisi manuskrip.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doxologis yang luhur tetapi tetap mudah dipahami. Susunan datif Yunani dinyatakan dengan 'Bagi', dan rangkaian sifat dibuat alami melalui klausa relatif.
