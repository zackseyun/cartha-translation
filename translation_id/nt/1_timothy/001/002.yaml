  terminology: “Anugerah,” “belas kasihan,” “damai sejahtera,” “Allah Bapa,” “Mesias,” dan “Tuhan” sesuai dengan istilah sumber dan register Alkitab bahasa Indonesia. Catatan “tulus” kurang tepat sebagai alternatif γνησίῳ, karena terutama berarti ketulusan/sincerity, bukan keaslian atau keautentikan relasi.
