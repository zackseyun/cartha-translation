  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: id
  text: 'Kepada Timotius, anakku yang sejati dalam iman: anugerah, belas kasihan, dan damai sejahtera dari Allah Bapa dan Mesias Yesus, Tuhan kita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anakku yang benar-benar dalam iman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ
  choice: yang sejati
  rationale: Menyatakan keaslian hubungan rohani Paulus dengan Timotius tanpa menyiratkan hubungan biologis.
- source_word: τέκνῳ
  choice: anakku
  rationale: Mempertahankan metafora hubungan orang tua-anak secara rohani; bentuk posesif tersirat secara wajar dari konteks sapaan Paulus.
- source_word: ἐν πίστει
  choice: dalam iman
  rationale: Mempertahankan kemungkinan bahwa iman adalah lingkup hubungan rohani mereka, tanpa mempersempitnya menjadi tindakan percaya subjektif semata.
- source_word: χάρις
  choice: anugerah
  rationale: Padanan teologis yang mapan dan alami dalam bahasa Indonesia untuk pemberian kemurahan ilahi.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan langsung yang mempertahankan unsur khas dalam salam surat-surat Pastoral.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang lazim dan mencakup makna kedamaian serta kesejahteraan yang terkandung dalam salam ini.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap mencerminkan hubungan kedua nomina dalam teks Yunani.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός alih-alih sekadar mentransliterasikannya, sehingga makna gelarnya tetap terlihat.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku yang mempertahankan bobot kristologis sebutan κύριος.
theological_decisions:
- issue: Makna ἐν πίστει
  choice: dalam iman
  alternative: dalam kepercayaan
  rationale: Pilihan ini mempertahankan kemungkinan bahwa yang dimaksud ialah iman bersama sebagai lingkup hubungan rohani Paulus dan Timotius, tanpa menjadikannya istilah teknis yang terlalu tegas.
- issue: Penerjemahan Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός masih memiliki daya sebagai gelar dalam rumusan ini; menerjemahkannya sebagai “Mesias” membuat maknanya transparan bagi pembaca.
- issue: Metafora τέκνῳ
  choice: anakku
  alternative: anakku secara rohani
  rationale: Teks sumber tidak menambahkan kata “rohani”; konteks “dalam iman” sudah menunjukkan sifat hubungan tersebut, sehingga metafora dibiarkan tetap utuh.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Struktur salam dipertahankan, sedangkan tanda titik dua dan pemenggalan baris membantu membedakan penerima surat dari berkat salam. Istilah “Mesias” dipakai sebagai terjemahan gelar Χριστός.
