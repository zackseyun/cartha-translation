base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: id
  text: Paulus, rasul Mesias Yesus[a] berdasarkan perintah Allah, Juru Selamat kita, dan Mesias Yesus, pengharapan kita[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus”, demikian juga pada kemunculan berikutnya. Gelar Yunani Χριστός dapat diterjemahkan sebagai “Mesias” atau, dalam sejumlah konteks, dipakai dalam bentuk yang lebih menyerupai nama, “Kristus”.
    reason: alternative_reading
  - marker: b
    text: Atau “berdasarkan perintah dari Allah, Juru Selamat kita, dan dari Mesias Yesus, pengharapan kita”.
    reason: previous_rendering
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Istilah baku Perjanjian Baru yang mempertahankan makna jabatan dan pengutusan, lebih tepat daripada istilah umum seperti “utusan”.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός masih membawa daya sebagai gelar dalam pembukaan surat ini; “Mesias” menerjemahkan gelar tersebut, sedangkan “Yesus” mempertahankan nama.
- source_word: κατ’ ἐπιταγήν
  choice: berdasarkan perintah
  rationale: Mengungkapkan dasar dan kewenangan ilahi bagi kerasulan Paulus secara alami dalam bahasa Indonesia.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Allah, Juru Selamat kita
  rationale: 'Mempertahankan hubungan aposisional: Allah dikenali sebagai Juru Selamat kita.'
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: Mesias Yesus, pengharapan kita
  rationale: Mempertahankan aposisi ringkas yang menyamakan Mesias Yesus dengan pengharapan kita tanpa mengembangkannya menjadi parafrasa.
- source_word: ἐλπίδος
  choice: pengharapan
  rationale: Padanan Alkitabiah yang wajar dan tetap mencakup penantian penuh keyakinan, bukan sekadar keinginan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini gelar tersebut tetap bermakna aktif. “Mesias” menerjemahkan gelarnya, sementara alternatif tradisional “Kristus” dicatat agar pembaca mengetahui kemungkinan bentuk yang lebih menyerupai nama.
- issue: Hubungan “pengharapan kita” dengan Mesias Yesus
  choice: 'Aposisional: “Mesias Yesus, pengharapan kita”'
  alternative: 'Klausa relatif: “Mesias Yesus, yang menjadi pengharapan kita”'
  rationale: Susunan genitif Yunani paling alami dipahami sebagai aposisi. Bentuk ringkas mempertahankan identifikasi teologis itu tanpa penjelasan tambahan.
- issue: Cakupan “perintah” atas dua frasa genitif
  choice: Satu perintah yang dikaitkan dengan Allah dan Mesias Yesus
  alternative: Mengulang kata “perintah” sebelum Mesias Yesus
  rationale: κατ’ ἐπιταγήν diikuti dua unsur genitif yang dikoordinasikan oleh καί. Teks utama mempertahankan satu kata “perintah”; catatan kaki memberi bentuk eksplisit yang mungkin lebih mudah dipahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda koma mempertahankan aposisi pada “Juru Selamat kita” dan “pengharapan kita”; susunan kalimat tetap mengikuti bentuk salam pembuka Yunani yang belum selesai pada ayat ini.
