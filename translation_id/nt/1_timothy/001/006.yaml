translation:
  language: id
  text: Beberapa orang, setelah gagal mencapai hal-hal ini[a], telah berpaling kepada pembicaraan yang sia-sia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah menyimpang dari hal-hal ini.” Kata ini dapat berarti gagal mengenai sasaran atau menyimpang darinya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pembicaraan hampa” atau “perkataan yang tidak berarti.”
