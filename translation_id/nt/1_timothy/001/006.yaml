lexical_decisions:
- source_word: ὧν
  choice: dari semuanya itu
  rationale: Kata ganti relatif genitif jamak ini merujuk kembali kepada hal-hal dalam ayat 5. Ungkapan ini membuat hubungan tersebut jelas dalam bahasa Indonesia tanpa mempersempit acuannya secara berlebihan.
- source_word: τινες
  choice: Sebagian orang
  rationale: Kata ganti tak tentu ini menunjuk kepada sejumlah orang yang tidak disebutkan secara khusus; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: ἀστοχήσαντες
  choice: telah melenceng
  rationale: Verba ini menggambarkan kegagalan mengenai sasaran atau penyimpangan darinya. 'Melenceng' mempertahankan citra sasaran sekaligus cocok dengan pelengkap 'dari semuanya itu'.
- source_word: ἐξετράπησαν
  choice: beralih
  rationale: Bentuk ini menyatakan berpaling atau menyimpang dari arah yang semestinya. 'Beralih' menyampaikan gerak menuju kegiatan lain dan menghindari pengulangan kata 'melenceng'.
- source_word: εἰς
  choice: kepada
  rationale: Preposisi ini menunjukkan arah atau hasil gerakan menuju suatu kegiatan; 'kepada' sesuai dengan konstruksi 'beralih kepada'.
- source_word: ματαιολογίαν
  choice: omong kosong
  rationale: Nomina ini berarti perkataan yang hampa, sia-sia, atau tidak berguna. 'Omong kosong' jelas dan lazim bagi pembaca modern, tanpa menambahkan isi khusus kepada ajaran yang dimaksud.
theological_decisions:
- issue: Acuan kata ganti relatif ὧν
  choice: Merujuk secara umum kepada hal-hal yang baru disebutkan dalam ayat 5, diterjemahkan 'dari semuanya itu'.
  alternative: Merujuk secara lebih sempit hanya kepada hati yang murni, hati nurani yang baik, dan iman yang tulus; atau diterjemahkan secara lebih harfiah 'dari hal-hal yang'.
  rationale: Susunan Yunani bergantung pada konteks sebelumnya. Terjemahan ini mempertahankan rujukan ke belakang dan ketidakpastian mengenai seberapa luas cakupannya, tanpa menetapkan satu unsur saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. 'Melenceng' mempertahankan metafora sasaran, sedangkan 'omong kosong' merupakan ungkapan umum yang langsung dipahami namun tetap layak dalam konteks teguran apostolik.
