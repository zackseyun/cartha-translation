  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur utama Yunani dengan baik: para πρεσβύτεροι sebagai pemimpin jemaat diterjemahkan "para penatua"; καλῶς προεστῶτες sebagai "yang memimpin dengan baik"; imperatif pasif ἀξιούσθωσαν sebagai "hendaklah ... dianggap layak menerima"; dan μάλιστα sebagai "terutama." "Penghormatan dua kali lipat" mempertahankan keluasan διπλῆς τιμῆς tanpa membatasinya pada penghargaan sosial atau dukungan materi. "Pemberitaan dan pengajaran" adalah penyempitan interpretatif yang wajar dalam konteks untuk ἐν λόγῳ καὶ διδασκαλίᾳ, dan catatan kaki secara tepat mencantumkan bentuk yang lebih harfiah.'
