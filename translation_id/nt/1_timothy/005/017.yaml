  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: id
  text: Hendaklah para penatua yang memimpin dengan baik dianggap layak menerima penghormatan dua kali lipat[a], terutama mereka yang bekerja keras dalam pemberitaan dan pengajaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghormatan berlipat ganda.” Ungkapan ini dapat mencakup penghargaan maupun dukungan materi, khususnya jika dipahami dalam terang ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dalam perkataan dan pengajaran.” Ungkapan ini kemungkinan menunjuk pada pelayanan lisan seperti pemberitaan dan pengajaran. Kata “terutama” juga dipahami sebagian orang sebagai “yaitu”, yang mengidentifikasi para penatua yang dimaksud sebagai mereka yang bekerja keras dalam pelayanan tersebut.
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: para penatua
  rationale: Dalam Surat-Surat Pastoral, istilah ini menunjuk kepada pemimpin jemaat yang diakui, bukan sekadar laki-laki lanjut usia. 'Penatua' merupakan padanan Indonesia yang lazim tanpa menetapkan struktur gerejawi tertentu.
- source_word: καλῶς προεστῶτες
  choice: yang memimpin dengan baik
  rationale: προΐστημι di sini menyatakan pelaksanaan kepemimpinan atau pengawasan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur kewenangan tanpa kesan keras dari 'memerintah'.
- source_word: διπλῆς τιμῆς
  choice: penghormatan dua kali lipat
  rationale: Terjemahan yang cukup harfiah ini mempertahankan ambiguitas τιμή, yang dapat mencakup penghargaan dan dukungan materi dalam konteks ayat berikutnya.
- source_word: ἀξιούσθωσαν
  choice: hendaklah ... dianggap layak menerima
  rationale: Bentuk imperatif pasif menuntut jemaat mengakui kelayakan mereka; susunan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: μάλιστα
  choice: terutama
  rationale: Padanan ini secara alami memberi penekanan khusus kepada suatu kelompok tanpa memaksakan makna apposisional 'yaitu'.
- source_word: κοπιῶντες
  choice: mereka yang bekerja keras
  rationale: κοπιάω menyatakan usaha yang berat dan tekun. 'Bekerja keras' lebih alami bagi pembaca Indonesia modern daripada 'berjerih lelah', sambil mempertahankan gagasan pengerahan tenaga.
- source_word: ἐν λόγῳ
  choice: dalam pemberitaan
  rationale: Dalam konteks pelayanan jemaat, λόγος kemungkinan menunjuk pada pelayanan verbal atau pewartaan. 'Pemberitaan' menyampaikan fungsi itu secara alami, meskipun lebih khusus daripada bentuk harfiah 'perkataan'.
- source_word: διδασκαλίᾳ
  choice: pengajaran
  rationale: '''Pengajaran'' merupakan padanan yang jelas dan umum, serta tidak membawa kesan teknis yang mungkin timbul dari ''doktrin''.'
theological_decisions:
- issue: Makna 'penghormatan dua kali lipat' bagi para penatua
  choice: Mempertahankan ungkapan luas 'penghormatan dua kali lipat' dalam teks utama.
  alternative: penghargaan berlipat ganda; penghormatan beserta dukungan materi; upah dua kali lipat
  rationale: Ayat berikutnya mengarah kepada dukungan materi, tetapi τιμή juga dapat berarti penghargaan atau penghormatan. Terjemahan ini tidak membatasi makna hanya pada rasa hormat atau hanya pada imbalan keuangan.
- issue: Daya makna μάλιστα
  choice: terutama
  alternative: yaitu
  rationale: '''Terutama'' mempertahankan kemungkinan bahwa para penatua yang bekerja keras dalam pemberitaan dan pengajaran merupakan kelompok yang diberi penekanan khusus, tanpa menutup tafsiran apposisional.'
- issue: Ruang lingkup ἐν λόγῳ καὶ διδασκαλίᾳ
  choice: dalam pemberitaan dan pengajaran
  alternative: dalam perkataan dan pengajaran; dalam firman dan pengajaran
  rationale: Ungkapan ini kemungkinan menunjuk pada pelayanan lisan berupa pewartaan dan pengajaran. 'Pemberitaan' menghindari kekaburan 'perkataan' dan tidak secara otomatis menyamakan λόγος dengan sebutan teknis 'Firman'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah gerejawi yang sudah luas dikenal, 'penatua', dipertahankan. Susunan kalimat mengikuti dorongan imperatif teks Yunani, sedangkan 'bekerja keras' dipilih agar alami tanpa kehilangan makna usaha yang sungguh-sungguh.
