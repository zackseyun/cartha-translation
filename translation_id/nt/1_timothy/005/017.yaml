  terminology: '"Penatua," "penghormatan," "pemberitaan," dan "pengajaran" konsisten dengan register gerejawi Indonesia tanpa memaksakan struktur atau doktrin gerejawi tertentu. Catatan kaki mempertahankan alternatif "yaitu" bagi μάλιστα dan kemungkinan cakupan dukungan materi pada τιμή.'
