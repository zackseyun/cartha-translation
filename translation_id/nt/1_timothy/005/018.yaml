base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: id
  text: Sebab Kitab Suci berkata, “Janganlah engkau memberangus lembu yang sedang mengirik[a],” dan, “Seorang pekerja layak mendapat upahnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang sedang menginjak-injak biji-bijian.” Partisip Yunani menunjuk pada lembu yang sedang melakukan pekerjaan mengirik.
    reason: lexical_alternative
  - marker: b
    text: Atau “bayarannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Sebab Kitab Suci berkata
  rationale: γάρ menyatakan hubungan penjelasan dengan ayat sebelumnya, sehingga diterjemahkan “Sebab”. ἡ γραφή merujuk pada tulisan suci yang berwibawa dan secara wajar diterjemahkan “Kitab Suci”; bentuk kini λέγει disampaikan dengan “berkata” sebagai kesaksian yang tetap berlaku.
- source_word: Βοῦν
  choice: lembu
  rationale: βοῦς menunjuk secara umum pada lembu yang digunakan untuk pekerjaan pertanian. “Lembu” merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: ἀλοῶντα
  choice: yang sedang mengirik
  rationale: Partisip ini menggambarkan lembu yang tengah melakukan pekerjaan mengirik. Bentuk “yang sedang mengirik” mempertahankan keserentakan tindakan tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: οὐ φιμώσεις
  choice: Janganlah engkau memberangus
  rationale: Bentuk futurum ini berfungsi sebagai larangan dalam kutipan hukum. “Janganlah engkau” mempertahankan orang kedua tunggal dan ragam perintah yang khidmat; “memberangus” menyatakan tindakan memasang penutup pada moncong agar hewan tidak dapat makan.
- source_word: καί
  choice: dan
  rationale: καί menghubungkan kedua kutipan secara langsung; “dan” mempertahankan koordinasi itu tanpa menambahkan penafsiran.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Seorang pekerja layak
  rationale: ἐργάτης berarti orang yang bekerja. “Seorang pekerja” alami dalam bahasa Indonesia modern dan tetap mempertahankan bentuk tunggal serta prinsip umum dalam pernyataan tersebut.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: mendapat upahnya
  rationale: μισθός di sini adalah imbalan yang menjadi hak karena pekerjaan, sehingga “upah” lebih tepat daripada “hadiah”. Konstruksi idiomatis Indonesia “layak mendapat upahnya” menyampaikan hubungan genitif dengan jelas; akhiran “-nya” mempertahankan acuan tunggal, meskipun bahasa Indonesia tidak menandai gender.
theological_decisions:
- issue: Cakupan ἡ γραφή terhadap kedua kutipan
  choice: Kedua kutipan disajikan sebagai rangkaian di bawah pengantar “Kitab Suci berkata” tanpa membatasi cakupannya.
  alternative: Menganggap hanya kutipan pertama sebagai Kitab Suci, sedangkan kutipan kedua sebagai peribahasa atau ucapan Tuhan yang berdiri sendiri.
  rationale: Susunan ayat menempatkan kedua pernyataan setelah satu formula pengantar dan menghubungkannya dengan καί. Terjemahan mempertahankan susunan ini tanpa menetapkan teori kanon yang melampaui teks.
- issue: Gender dan jumlah pada αὐτοῦ
  choice: upahnya
  alternative: upah mereka
  rationale: αὐτοῦ berbentuk tunggal maskulin. Bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga; “-nya” mempertahankan jumlah tunggal secara alami tanpa mengubahnya menjadi bentuk jamak netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Janganlah engkau” dipakai untuk mempertahankan corak larangan dalam kutipan hukum dan orang kedua tunggal. Istilah pertanian “mengirik” dipertahankan karena tepat dan ringkas, dengan penjelasan praktiknya dalam catatan kaki.
