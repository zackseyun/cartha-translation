  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: id
  text: Namun, jika seseorang tidak memenuhi kebutuhan orang-orang dekatnya[a], terutama anggota rumah tangganya, ia telah menyangkal[b] iman dan lebih buruk daripada orang yang tidak percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orangnya sendiri”; ungkapan ini lebih luas daripada mereka yang tinggal serumah, sedangkan “anggota rumah tangganya” menunjuk kepada kelompok yang secara khusus wajib diperhatikan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah mengingkari iman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu tunggal ini bersifat umum. “Seseorang” berlaku bagi siapa pun tanpa membatasi pernyataan hanya kepada laki-laki.
- source_word: τῶν ἰδίων
  choice: keluarganya sendiri
  rationale: Ungkapan ini menunjuk secara luas kepada orang-orang dekat atau kerabat yang menjadi lingkup tanggung jawab seseorang. “Keluarganya sendiri” alami dalam bahasa Indonesia dan tetap lebih luas daripada frasa berikutnya, “anggota rumah tangganya”.
- source_word: μάλιστα
  choice: terutama
  rationale: Menekankan satu kelompok sebagai bagian yang mendapat perhatian khusus dalam kelompok yang lebih luas.
- source_word: οἰκείων
  choice: anggota rumah tangganya
  rationale: Menunjuk secara khusus kepada mereka yang termasuk dalam rumah tangga seseorang, sehingga mempertahankan penyempitan dari “keluarganya sendiri”.
- source_word: προνοεῖ
  choice: memenuhi kebutuhan
  rationale: Dalam konteks ini kata kerja tersebut menyatakan perhatian praktis yang terwujud dalam penyediaan kebutuhan. Pilihan ini lebih konkret daripada sekadar “memperhatikan”, tetapi tidak membatasinya hanya pada pemberian nafkah uang.
- source_word: τὴν πίστιν
  choice: iman
  rationale: Dengan artikel tertentu dan dalam konteks Surat-Surat Pastoral, frasa ini menunjuk kepada iman Kristen yang diakui orang tersebut, bukan sekadar kepercayaan secara umum.
- source_word: ἤρνηται
  choice: telah menyangkal
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dengan akibat yang tetap berlaku. “Telah menyangkal” mempertahankan kekuatan tuduhan bahwa perilakunya bertentangan dengan pengakuan imannya.
- source_word: ἀπίστου
  choice: orang yang tidak percaya
  rationale: Dalam pertentangan ini kata tersebut menunjuk kepada orang yang tidak beriman, bukan hanya orang yang tidak dapat dipercaya.
- source_word: χείρων
  choice: lebih buruk
  rationale: Padanan langsung dan alami bagi bentuk komparatif yang menyatakan penilaian moral.
theological_decisions:
- issue: Cakupan konstruksi tunggal maskulin yang bersifat umum
  choice: Menggunakan “seseorang” dan akhiran posesif “-nya” yang netral gender dalam bahasa Indonesia.
  alternative: Menggunakan “seorang laki-laki” atau bentuk eksplisit maskulin lainnya.
  rationale: Bahasa Yunani menyampaikan acuan umum, bukan pembatasan kepada laki-laki. Tata bahasa Indonesia memungkinkan cakupan umum itu dipertahankan secara alami tanpa menghapus makna sumber.
- issue: Makna πίστις dalam τὴν πίστιν ἤρνηται
  choice: “iman” sebagai iman Kristen yang diakui
  alternative: “kepercayaan” sebagai sikap percaya pribadi atau “kesetiaan” sebagai fidelitas.
  rationale: Konteks Surat-Surat Pastoral dan penggunaan artikel tertentu mendukung pengertian iman yang diakui. Kegagalan memenuhi kewajiban keluarga dipandang sebagai penyangkalan praktis terhadap iman tersebut.
- issue: Hubungan τῶν ἰδίων dengan οἰκείων
  choice: Membedakan kelompok luas “keluarganya sendiri” dari kelompok yang ditekankan secara khusus, “anggota rumah tangganya”.
  alternative: Menyamakan kedua frasa sebagai dua sebutan bagi keluarga inti.
  rationale: Kata μάλιστα menunjukkan bahwa frasa kedua mendapat penekanan di dalam lingkup frasa pertama. Terjemahan mempertahankan hubungan luas-ke-khusus ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Memenuhi kebutuhan” dipilih untuk menyampaikan perhatian praktis dan material tanpa menyempitkan makna menjadi kewajiban finansial semata. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
