translation:
  language: id
  text: Sebab beberapa orang sudah menyimpang dan mengikuti Iblis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “telah menyimpang setelah Iblis” atau “telah menyimpang di belakang Iblis.”'
    reason: Menunjukkan pilihan harfiah untuk ὀπίσω (“setelah/di belakang”) tanpa menggantikan terjemahan idiomatis dalam teks utama.
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Mempertahankan daya temporal adverbia itu secara alami dalam bahasa Indonesia dan menunjukkan bahwa penyimpangan tersebut telah terjadi.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan bagi petunjuk sebelumnya.
- source_word: τινες
  choice: beberapa orang
  rationale: Mengacu pada sejumlah orang yang tidak disebutkan secara khusus; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐξετράπησαν
  choice: menyimpang
  rationale: Mempertahankan gambaran meninggalkan jalan atau arah yang benar tanpa menambahkan gagasan kausatif bahwa mereka disesatkan oleh pihak lain.
- source_word: ὀπίσω
  choice: dan mengikuti
  rationale: Dalam konstruksi dengan pribadi sebagai objek, kata ini secara idiomatis menyatakan gerak mengikuti seseorang. Kata 'dan' membuat hubungan kedua gagasan itu alami dalam bahasa Indonesia.
- source_word: Σατανᾶ
  choice: Iblis
  rationale: Dalam bahasa Indonesia, 'Iblis' adalah sebutan baku dan mudah dipahami bagi Satan dalam konteks Perjanjian Baru.
theological_decisions:
- issue: Apakah ὀπίσω τοῦ Σατανᾶ diterjemahkan secara harfiah sebagai 'di belakang Iblis' atau secara idiomatis sebagai tindakan mengikuti Iblis.
  choice: mengikuti Iblis
  alternative: menyimpang ke belakang Iblis; menyimpang mengikuti Iblis
  rationale: Ungkapan Yunani menggambarkan pengalihan arah sehingga orang tersebut berada dalam jejak atau pengikutan Iblis. Terjemahan ini menyampaikan keseriusan teologisnya dengan jelas tanpa memperluasnya menjadi istilah doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Sebab' mempertahankan kaitan penjelasan dengan konteks sebelumnya; 'mengikuti Iblis' dipilih sebagai ungkapan idiomatis yang mudah dipahami.
