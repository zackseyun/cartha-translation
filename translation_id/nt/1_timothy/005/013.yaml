id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: id
  text: Pada saat yang sama, mereka juga belajar menjadi malas, berkeliling dari rumah ke rumah. Mereka bukan hanya malas, tetapi juga suka bergunjing[a] dan mencampuri urusan orang lain[b], dengan mengatakan hal-hal yang tidak patut mereka katakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suka mengobrol kosong”; istilah Yunani ini dapat menunjuk lebih luas pada omongan bodoh atau kosong, meskipun dalam konteks ini kemungkinan mencakup pergunjingan.
    reason: lexical_alternative
  - marker: b
    text: Atau “suka ikut campur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Pada saat yang sama, mereka juga
  rationale: Mengungkapkan nuansa keserentakan sekaligus tambahan dan mempertahankan hubungan dengan pembahasan sebelumnya.
- source_word: ἀργαὶ
  choice: bermalas-malasan
  rationale: Menunjukkan kebiasaan tidak melakukan pekerjaan yang semestinya; pengulangan terjemahan mempertahankan pengulangan dalam bahasa Yunani.
- source_word: μανθάνουσιν
  choice: belajar
  rationale: Dalam konteks ini menunjuk pada terbentuknya kebiasaan, bukan pembelajaran formal; konstruksi 'belajar bermalas-malasan' wajar dalam bahasa Indonesia.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: dengan berkeliling dari rumah ke rumah
  rationale: Menyampaikan gerak dari satu rumah tangga ke rumah tangga lain secara alami dan jelas.
- source_word: φλύαροι
  choice: suka bergunjing
  rationale: Kata ini dapat menunjuk pada omongan kosong, bodoh, atau tidak bijaksana; dalam konteks ini 'suka bergunjing' menyampaikan dampak sosialnya tanpa menutup kemungkinan makna yang lebih luas, yang dicatat dalam catatan kaki.
- source_word: περίεργοι
  choice: mencampuri urusan orang lain
  rationale: Mengungkapkan campur tangan yang tidak semestinya dalam perkara yang bukan urusannya dengan bahasa Indonesia modern yang mudah dipahami.
- source_word: λαλοῦσαι
  choice: mengatakan
  rationale: Kata kerja umum untuk berbicara ini cocok dengan klausa objek yang mengikutinya dan tidak menambahkan makna yang tidak ada.
- source_word: τὰ μὴ δέοντα
  choice: hal-hal yang tidak patut mereka katakan
  rationale: Mempertahankan gagasan tentang apa yang tidak pantas atau semestinya, sekaligus memperjelas bahwa hal itu berkaitan dengan perkataan.
theological_decisions:
- issue: Rujukan gender dari kata sifat dan partisip feminin jamak
  choice: mereka
  alternative: perempuan-perempuan itu
  rationale: Bentuk Yunani merujuk secara khusus kepada para janda muda dalam konteks sebelumnya. Pronomina 'mereka' mempertahankan kesinambungan rujukan tanpa mengulang nomina yang sudah jelas dan tanpa menetralkan referennya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pilihan verbal 'bermalas-malasan', 'suka bergunjing', dan 'mencampuri urusan orang lain' lebih alami bagi pembaca umum daripada deretan nomina pelaku, sambil mempertahankan teguran dan struktur pengulangan teks sumber.
