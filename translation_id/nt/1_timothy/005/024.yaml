  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: id
  text: Dosa beberapa orang tampak jelas[a], mendahului mereka ke penghakiman[b], tetapi dosa orang lain menyusul kemudian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dosa beberapa orang nyata, mendahului mereka ke penghakiman.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “penghakiman” dapat merujuk pada penilaian yang berlangsung sekarang, tetapi ungkapan ini juga dapat mencakup penghakiman ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Dosa beberapa orang
  rationale: Genitif Τινῶν ἀνθρώπων menerangkan dosa; 'orang' menyampaikan ἄνθρωπος secara umum dan wajar dalam bahasa Indonesia.
- source_word: πρόδηλοί
  choice: sudah nyata
  rationale: '''Nyata'' menyampaikan bahwa dosa-dosa itu tampak jelas; ''sudah'' membantu menunjukkan pertentangan dengan dosa yang baru tersingkap kemudian.'
- source_word: προάγουσαι εἰς κρίσιν
  choice: mendahului mereka menuju penghakiman
  rationale: Bentuk partisip ini bersesuaian dengan 'dosa' dan mempertahankan gambaran bahwa dosa-dosa berjalan lebih dahulu daripada orang yang bersangkutan. 'Menuju' mempertahankan daya arah εἰς.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: tetapi dosa orang lain menyusul kemudian
  rationale: Dativa τισίν dipahami sebagai rujukan kepada kelompok lain. Subjek 'dosa' diulang demi kejelasan alami dalam bahasa Indonesia, sedangkan 'menyusul kemudian' mempertahankan kontras temporal dan citra verba Yunani.
theological_decisions:
- issue: Cakupan κρίσις
  choice: penghakiman
  alternative: penilaian dalam jemaat atau penghakiman ilahi terakhir
  rationale: Konteks langsung dapat menunjuk pada penilaian orang dalam jemaat, tetapi istilah Yunani tetap dapat membawa pengertian penghakiman yang lebih luas. Terjemahan tidak membatasi acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Personifikasi dosa yang mendahului atau menyusul seseorang dipertahankan, demikian pula ketaksaan mengenai jenis penghakiman.
