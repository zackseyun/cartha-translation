id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: id
  text: 'Di hadapan Allah, Kristus Yesus, dan malaikat-malaikat terpilih[a], aku dengan sungguh-sungguh berpesan kepadamu: taatilah hal-hal ini tanpa menghakimi terlebih dahulu[b], dan jangan lakukan apa pun dengan sikap memihak[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para malaikat pilihan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tanpa prasangka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “dengan sikap pilih kasih.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: aku dengan sungguh-sungguh berpesan
  rationale: Dalam nasihat surat ini, verba tersebut menyampaikan amanat yang serius dan khidmat, bukan sekadar kesaksian.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kehadiran para saksi dalam amanat yang khidmat.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kristus Yesus
  rationale: Dalam bahasa Indonesia, bentuk baku dan alami untuk gelar Χριστός dalam rangkaian ini ialah 'Kristus Yesus'; unsur gelarnya tetap dikenali tanpa menghasilkan susunan yang janggal.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: para malaikat pilihan
  rationale: ἐκλεκτός berarti dipilih atau terpilih. 'Pilihan' ringkas, mudah dipahami, dan tetap mempertahankan gagasan pemilihan.
- source_word: ταῦτα
  choice: semua ini
  rationale: Demonstrativa ini merujuk pada berbagai petunjuk dalam konteks sebelumnya tanpa mempersempit acuannya secara berlebihan.
- source_word: φυλάξῃς
  choice: taatilah
  rationale: Dalam konteks petunjuk, φυλάσσω berarti memegang dan menjalankan dengan setia; bentuk imperatif Indonesia menyampaikan daya nasihat klausa ἵνα secara alami.
- source_word: χωρὶς προκρίματος
  choice: tanpa menghakimi terlebih dahulu
  rationale: πρόκριμα menunjuk pada keputusan atau penilaian yang dibuat sebelumnya. Pilihan ini mempertahankan unsur temporal yang dapat hilang dalam kata 'prasangka'.
- source_word: μηδὲν ποιῶν
  choice: jangan lakukan apa pun
  rationale: Partisipel ini menyertai amanat utama; koordinasi imperatif lebih alami dalam bahasa Indonesia dan mempertahankan larangannya.
- source_word: κατὰ πρόσκλισιν
  choice: karena memihak
  rationale: πρόσκλισις menyatakan kecenderungan kepada satu pihak atau favoritisme; frasa ini jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Kristus Yesus
  alternative: Mesias Yesus
  rationale: '''Kristus'' adalah bentuk gelar yang mapan dan alami dalam bahasa Indonesia pada rangkaian ''Kristus Yesus''. ''Mesias Yesus'' lebih transparan secara semantis, tetapi terdengar tidak wajar dan dapat mengaburkan bahwa teks memakai Χριστός, bukan Μεσσίας.'
- issue: Identitas para malaikat pilihan
  choice: para malaikat pilihan
  alternative: para malaikat terpilih
  rationale: Teks menyebut mereka sebagai ἐκλεκτῶν tanpa menjelaskan dasar atau tujuan pemilihan itu; terjemahan mempertahankan ketegangan tersebut dan tidak menambahkan penafsiran tentang golongan malaikat tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan tiga saksi dalam formula amanat serta pembedaan antara penilaian pendahuluan dan keberpihakan.
