  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: id
  text: perempuan-perempuan yang lebih tua sebagai ibu, perempuan-perempuan yang lebih muda sebagai saudara perempuan, dengan penuh kemurnian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam segala kemurnian.” Dalam konteks ini, kata “kemurnian” juga mengandung pengertian kuat tentang kesucian atau kepatutan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: perempuan-perempuan yang lebih tua
  rationale: Bentuk feminin jamak ini dipakai sebagai nomina dan, karena dikontraskan dengan νεωτέρας, menunjuk pada usia, bukan jabatan penatua.
- source_word: ὡς
  choice: sebagai
  rationale: 'Kata ini memperkenalkan perbandingan dan mempertahankan gambaran hubungan kekeluargaan: sebagai ibu dan sebagai saudara perempuan.'
- source_word: μητέρας
  choice: ibu
  rationale: Terjemahan ini mempertahankan metafora kekeluargaan tanpa menambahkan kata milik seperti 'ibumu', yang tidak dinyatakan dalam bahasa Yunani.
- source_word: νεωτέρας
  choice: perempuan-perempuan yang lebih muda
  rationale: Bentuk feminin jamak yang dipakai sebagai nomina ini menunjuk pada perempuan berdasarkan usia dan membentuk kontras langsung dengan perempuan yang lebih tua.
- source_word: ἀδελφὰς
  choice: saudara perempuan
  rationale: Ungkapan ini meneruskan metafora keluarga dan menyampaikan sikap seperti terhadap saudara sendiri tanpa menambahkan kata milik yang tidak ada dalam teks.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: dengan penuh kemurnian
  rationale: Ungkapan ini menyatakan cara memperlakukan perempuan yang lebih muda. 'Kemurnian' mempertahankan cakupan moral yang luas, termasuk implikasi kuat mengenai kesucian dan kepatutan seksual, sedangkan 'penuh' mencerminkan πάσῃ secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ἁγνεία dalam petunjuk mengenai perempuan yang lebih muda
  choice: kemurnian
  alternative: kesucian sepenuhnya; kemurnian seksual sepenuhnya
  rationale: Ἁγνεία dapat menunjuk pada kemurnian moral secara luas, dengan implikasi kuat mengenai kesucian atau kepatutan seksual dalam konteks ini. Terjemahan yang lebih luas menjaga rentang makna dan tidak membatasi istilah Yunani hanya pada satu aspek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'perempuan-perempuan' mempertahankan dua kelompok yang dinyatakan secara eksplisit dalam teks Yunani; susunan paralel menjaga irama nasihat kekeluargaan. Karena ayat ini meneruskan verba dari ayat sebelumnya, fragmennya sengaja tidak diberi verba tambahan.
