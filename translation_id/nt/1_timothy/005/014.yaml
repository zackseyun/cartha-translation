id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: id
  text: Karena itu, saya ingin agar para janda yang lebih muda menikah[a], melahirkan anak, mengurus rumah tangga mereka, dan tidak memberi lawan[b] kesempatan apa pun untuk mencela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menikah”; karena yang dimaksud adalah para janda, menikah kembali tersirat oleh konteks.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini dapat juga diterjemahkan “orang yang menentang” atau “Sang Penentang”; sebutan ini mungkin merujuk kepada Iblis.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: saya ingin
  rationale: Menyatakan kehendak atau keinginan Paulus secara pribadi dengan ungkapan Indonesia yang alami dan langsung.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pembahasan sebelumnya dan mempertahankan hubungan logis antarkalimat.
- source_word: νεωτέρας
  choice: para janda yang lebih muda
  rationale: Secara harfiah berarti 'perempuan-perempuan yang lebih muda', tetapi konteks langsung membahas para janda; nomina yang tersirat perlu dinyatakan dalam bahasa Indonesia.
- source_word: γαμεῖν
  choice: menikah
  rationale: Kata Yunani ini hanya menyatakan 'menikah'. Karena yang dibicarakan ialah para janda, pernikahan kembali tersirat oleh konteks, tetapi tidak dijadikan eksplisit dalam teks utama.
- source_word: τεκνογονεῖν
  choice: melahirkan anak
  rationale: Mempertahankan arti khusus verba ini, yaitu melahirkan atau menghasilkan keturunan, tanpa memperluasnya menjadi sekadar membesarkan anak.
- source_word: οἰκοδεσποτεῖν
  choice: mengurus rumah tangga mereka
  rationale: Mengungkapkan tanggung jawab aktif dalam mengelola rumah tangga secara wajar, tanpa menambahkan nuansa kekuasaan yang keras.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: tidak memberi ... kesempatan sedikit pun
  rationale: 'Menyampaikan penyangkalan yang tegas: tidak menyediakan celah atau kesempatan apa pun.'
- source_word: τῷ ἀντικειμένῳ
  choice: orang yang menentang
  rationale: Mempertahankan bentuk tunggal dan sifat rujukan yang tidak ditentukan, tanpa langsung mengidentifikasinya sebagai Iblis.
- source_word: λοιδορίας χάριν
  choice: untuk memfitnah
  rationale: Mengungkapkan tujuan atau peluang bagi perkataan yang mencela dan merusak nama baik dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Rujukan τῷ ἀντικειμένῳ
  choice: orang yang menentang, yakni seorang atau pihak yang bersikap bermusuhan
  alternative: Sang Penentang, yang mungkin merujuk kepada Iblis
  rationale: Partisip Yunani tersebut tidak secara eksplisit menyebut Iblis, dan konteks dapat menunjuk kepada pengkritik yang bermusuhan. Teks utama mempertahankan rujukan umum, sedangkan catatan kaki mencatat kemungkinan rujukan yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur daftar infinitif dipertahankan melalui verba-verba sejajar. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
