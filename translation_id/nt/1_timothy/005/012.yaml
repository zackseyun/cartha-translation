  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: id
  text: Mereka berada di bawah penghakiman karena telah mengesampingkan iman mereka yang semula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janji awal mereka” atau “komitmen terdahulu mereka”. Kata Yunani yang dipakai dapat berarti “iman”, tetapi dalam konteks ini sebagian orang memahaminya sebagai janji sebelumnya, mungkin berkaitan dengan pendaftaran sebagai janda.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: mendatangkan ... atas diri mereka
  rationale: Partisip ini secara harfiah berarti 'memiliki', tetapi bersama κρίμα secara idiomatis menyatakan bahwa mereka membuat diri berada di bawah penghakiman. Ungkapan ini juga menghubungkan ayat dengan konteks sebelumnya.
- source_word: κρίμα
  choice: penghakiman
  rationale: Kata ini dapat berarti penghakiman, putusan, atau penghukuman. 'Penghakiman' mempertahankan keseriusannya tanpa secara khusus menetapkannya sebagai penghukuman kekal.
- source_word: ὅτι
  choice: karena
  rationale: Kata penghubung ini memperkenalkan alasan mereka berada di bawah penghakiman.
- source_word: τὴν πρώτην πίστιν
  choice: iman mereka yang semula
  rationale: πρώτην di sini paling wajar dipahami secara temporal sebagai 'yang semula', sedangkan πίστιν diterjemahkan dengan makna dasarnya, 'iman'. Kemungkinan makna 'janji/komitmen terdahulu' dipertahankan dalam catatan kaki.
- source_word: ἠθέτησαν
  choice: telah mengesampingkan
  rationale: Kata kerja ini berarti menolak, mengesampingkan, atau membatalkan. 'Mengesampingkan' menyampaikan tindakan tidak lagi mengindahkan iman atau komitmen terdahulu tanpa mempersempit maknanya secara berlebihan.
theological_decisions:
- issue: Makna τὴν πρώτην πίστιν dalam konteks
  choice: iman mereka yang semula
  alternative: janji mereka yang pertama; komitmen mereka yang terdahulu
  rationale: πίστις secara normal berarti 'iman', tetapi dalam konteks pendaftaran para janda sebagian penafsir memahaminya sebagai janji atau komitmen terdahulu. Teks utama mempertahankan makna leksikal yang lazim, sedangkan catatan kaki menjaga ambiguitas kontekstual yang nyata.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. 'Dengan demikian' menjadikan hubungan partisipial dengan konteks sebelumnya alami dalam bahasa Indonesia; catatan kaki mempertahankan perdebatan mengenai arti πίστις.
