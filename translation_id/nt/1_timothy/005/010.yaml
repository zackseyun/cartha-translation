  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: id
  text: 'yang mendapat kesaksian baik karena perbuatan-perbuatan baik: jika ia telah membesarkan anak-anak, jika ia telah menerima orang asing di rumahnya[a], jika ia telah membasuh kaki orang-orang kudus[b], jika ia telah menolong orang-orang yang mengalami kesusahan, dan jika ia telah menekuni setiap perbuatan baik[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah menerima orang asing.” Kata Yunani ini menunjuk pada menyambut tamu atau orang asing, khususnya dengan memberi mereka tumpangan.
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang kudus” di sini berarti umat Allah, yaitu sesama orang percaya.
    reason: lexical_alternative
  - marker: c
    text: Atau “telah mengikuti dengan tekun setiap perbuatan baik.” Ungkapan Yunani menekankan pengejaran dan komitmen yang aktif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: yang dikenal karena perbuatan-perbuatan baik
  rationale: Mengungkapkan kesaksian atau reputasi yang diberikan orang lain berdasarkan perbuatan yang dapat diamati, sambil mempertahankan hubungan frasa ἐν ἔργοις καλοῖς dengan reputasi tersebut.
- source_word: εἰ
  choice: jika
  rationale: Pengulangan 'jika' mempertahankan bentuk daftar persyaratan dalam teks Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: ἐτεκνοτρόφησεν
  choice: telah membesarkan anak-anak
  rationale: Kata kerja ini menunjuk pada pengasuhan dan pembesaran anak tanpa menetapkan bahwa mereka harus anak kandung.
- source_word: ἐξενοδόχησεν
  choice: telah menerima orang asing di rumahnya
  rationale: Pilihan ini menyampaikan makna khusus kata Yunani, yakni menyambut dan menjamu tamu atau orang asing, bukan sekadar sikap ramah secara umum.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Mempertahankan istilah penting Paulus bagi umat yang dikuduskan bagi Allah; catatan kaki menjelaskan rujukannya dalam konteks ini.
- source_word: πόδας ἔνιψεν
  choice: telah membasuh kaki
  rationale: Tindakan pelayanan yang konkret dan rendah hati ini dipertahankan secara harfiah karena mempunyai bobot budaya dalam konteks kuno.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: telah menolong orang-orang yang mengalami kesusahan
  rationale: Mencakup orang yang sedang mengalami tekanan, penderitaan, atau kesukaran tanpa mempersempit maknanya hanya pada penganiayaan.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: telah giat melakukan setiap perbuatan baik
  rationale: Mengungkapkan tindakan aktif mengejar dan menekuni segala perbuatan baik dalam bahasa Indonesia yang alami; catatan kaki mempertahankan gambaran harfiah 'mengikuti'.
theological_decisions:
- issue: Rujukan ἁγίων
  choice: orang-orang kudus, yakni umat Allah atau sesama orang percaya
  alternative: orang-orang percaya
  rationale: Terjemahan utama mempertahankan istilah teologis Paulus tanpa membatasinya pada kelompok khusus dalam gereja; maknanya dijelaskan dalam catatan kaki.
- issue: Daya tindakan ἐπηκολούθησεν
  choice: giat melakukan
  alternative: mengikuti dengan tekun
  rationale: Kata kerja tersebut menyiratkan pengejaran atau komitmen aktif. Terjemahan ini tidak menjadikan perbuatan baik sebagai dasar keselamatan, tetapi menyajikannya sesuai konteks sebagai bukti watak dan pelayanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang 'jika ia telah' mempertahankan pola retoris sumber, sedangkan pilihan kata tetap mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
