  source_fidelity: Frasa μαρτυρουμένη menuntut nuansa kesaksian atau reputasi yang diberikan oleh orang lain; “yang dikenal” menyampaikan reputasi tetapi kurang jelas mempertahankan suara pasif tersebut. Terjemahan “mendapat kesaksian baik karena” lebih dekat pada sumber dan tetap idiomatis. Untuk ἐπηκολούθησεν, “giat melakukan” secara aman menyampaikan tindakan aktif, tetapi agak menggeser citra mengejar/menekuni; “menekuni” lebih mencerminkan komitmen berkelanjutan yang dimaksud tanpa menjadikannya sekadar pelaksanaan satu tindakan.
  naturalness: Teks pada umumnya baku dan jelas. “Mendapat kesaksian baik karena perbuatan-perbuatan baik” wajar dalam ragam Indonesia modern dan secara jelas menyatakan reputasi yang diakui. “Menerima orang asing di rumahnya” dapat dipertahankan sebagai terjemahan dekat untuk tindakan memberi tumpangan.
  terminology: “Orang-orang kudus” mempertahankan ἅγιοι dengan baik, dan catatan kaki menjelaskan pemakaiannya sebagai umat Allah/sesama orang percaya tanpa muatan denominasi. “Perbuatan baik” konsisten untuk ἔργον καλόν/ἀγαθόν.
