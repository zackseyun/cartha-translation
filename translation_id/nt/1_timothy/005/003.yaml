  text: Hormatilah para janda yang benar-benar janda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bantulah para janda yang benar-benar janda.” Dalam konteks ini, “hormatilah” kemungkinan mencakup pemeliharaan kebutuhan hidup mereka.
