lexical_decisions:
- source_word: Χήρας
  choice: para janda
  rationale: χήρα secara langsung menunjuk kepada perempuan yang suaminya telah meninggal; bentuk jamak diterjemahkan secara alami dengan 'para janda'.
- source_word: τίμα
  choice: Hormatilah
  rationale: τιμάω berarti menghormati, menghargai, atau menunjukkan penghargaan. Dalam konteks ini penghormatan kemungkinan mencakup bantuan materi, tetapi maknanya tidak dibatasi pada dukungan keuangan.
- source_word: τὰς ὄντως χήρας
  choice: yang benar-benar hidup sebagai janda
  rationale: ὄντως memberi pembedaan nyata yang dijelaskan oleh konteks berikutnya, terutama keadaan janda yang sungguh-sungguh sendirian. Ungkapan ini mempertahankan pengulangan gagasan 'janda' tanpa menghasilkan frasa Indonesia yang kaku atau menyiratkan bahwa status kematian suaminya diragukan.
- source_word: ὄντως
  choice: benar-benar
  rationale: Adverbia ini berarti 'sungguh-sungguh' atau 'benar-benar' dan menandai suatu kualifikasi, bukan sekadar penegasan retoris.
theological_decisions:
- issue: Cakupan τιμάω dalam konteks
  choice: '''Hormatilah'' dipertahankan sebagai istilah luas yang dalam konteks kemungkinan mencakup pemeliharaan materi.'
  alternative: '''Bantulah'' atau ''Tanggunglah kebutuhan'' para janda.'
  rationale: Pembahasan 1 Timotius 5 mencakup pemeliharaan materi bagi para janda, tetapi verba Yunani itu sendiri lebih luas. Terjemahan utama tidak mempersempitnya menjadi bantuan keuangan saja.
- issue: Makna 'janda yang benar-benar janda'
  choice: Diterjemahkan 'yang benar-benar hidup sebagai janda' untuk menunjukkan keadaan nyata yang akan diperinci dalam konteks berikutnya.
  alternative: '''yang benar-benar janda'' atau ''janda sejati''.'
  rationale: Ungkapan Yunani tidak mempertanyakan sahnya kematian suami, melainkan membedakan mereka yang sungguh berada dalam keadaan tanpa penopang sebagaimana dijelaskan ayat-ayat selanjutnya. Pilihan ini menghindari kesan moralistik dari 'janda sejati'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif 'Hormatilah' mempertahankan bentuk perintah. Frasa 'hidup sebagai janda' dipakai agar kualifikasi ὄντως terdengar wajar dan tidak seolah-olah meragukan status kematian suami.
