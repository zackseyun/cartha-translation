id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: id
  text: Namun, jangan menerima janda yang lebih muda[a], sebab ketika mereka menjadi dikuasai hasrat sensual sehingga mengabaikan Sang Mesias[b], mereka ingin menikah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, jangan menerima mereka untuk dimasukkan ke dalam daftar janda yang dibicarakan dalam konteks ini.
    reason: contextual_clarification
  - marker: b
    text: Secara lebih harfiah, “menjadi sensual terhadap/melawan Sang Mesias.” Hubungan gramatikalnya sukar dipastikan; ungkapan ini dapat berarti bahwa hasrat mereka berkonflik dengan pengabdian atau komitmen mereka sebelumnya kepada-Nya. Sebutan tradisionalnya ialah “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: janda-janda yang lebih muda
  rationale: Mempertahankan nuansa komparatif νεωτέρας dan kontrasnya dengan para janda yang lebih tua dalam konteks, tanpa menetapkan batas usia yang tidak disebutkan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bersifat kontras dari petunjuk sebelumnya tentang janda yang dapat dimasukkan ke dalam daftar.
- source_word: παραιτοῦ
  choice: jangan menerima
  rationale: Dalam konteks daftar janda pada ayat sebelumnya, ungkapan ini secara alami menyampaikan larangan menerima mereka ke dalam daftar, tanpa memberi kesan bahwa Timotius harus menolak atau mengucilkan mereka secara umum.
- source_word: ὅταν γὰρ
  choice: sebab ketika
  rationale: Mempertahankan fungsi kausal γὰρ sekaligus keadaan umum atau temporal yang dinyatakan ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: terdorong oleh hasrat sensual
  rationale: Kata kerja yang langka ini menunjuk pada dorongan sensual atau hasrat kuat. Pilihan ini dapat dipahami pembaca modern dan tidak menyamakan keinginan untuk menikah itu sendiri dengan dosa.
- source_word: τοῦ Χριστοῦ
  choice: yang bertentangan dengan Sang Mesias
  rationale: Genitif sesudah καταστρηνιάω sulit dipastikan relasinya. Ungkapan ini mempertahankan gagasan pertentangan dengan Sang Mesias sambil tetap terdengar alami dalam bahasa Indonesia.
- source_word: γαμεῖν θέλουσιν
  choice: mereka ingin menikah
  rationale: Menyampaikan secara wajar keinginan atau kehendak yang dinyatakan oleh θέλουσιν dengan infinitif γαμεῖν.
theological_decisions:
- issue: Makna Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar dalam konstruksi ini. 'Sang Mesias' mempertahankan nilai gelarnya, sedangkan 'Kristus' tetap merupakan padanan tradisional yang sah.
- issue: Makna καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: terdorong oleh hasrat sensual yang bertentangan dengan Sang Mesias
  alternative: hasrat mereka membuat mereka berpaling dari Sang Mesias; mereka menjadi dikuasai hawa nafsu terhadap Sang Mesias
  rationale: Konstruksi Yunani menyatakan dorongan sensual yang berada dalam pertentangan dengan hubungan atau komitmen kepada Sang Mesias, tetapi tidak menjelaskan tepatnya sifat komitmen itu. Terjemahan tidak menyatakan bahwa pernikahan kembali itu sendiri yang dikutuk.
- issue: Ruang lingkup παραιτοῦ
  choice: jangan menerima dalam kerangka daftar janda
  alternative: tolaklah; jangan hiraukan
  rationale: Konteks langsung membahas pendaftaran janda. Pilihan ini menghindari kesimpulan bahwa janda yang lebih muda harus ditolak dari persekutuan atau pertolongan apa pun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Hasrat sensual' dipilih karena lebih transparan daripada ungkapan arkais seperti 'menjadi jalang' atau 'dikuasai berahi', sementara catatan kaki mempertahankan ketidakpastian konstruksi Yunani dan konteks administratif dari larangan tersebut.
