  terminology: “Janda,” “anak atau cucu,” “berbakti,” “membalas budi,” dan “berkenan di hadapan Allah” sesuai register Indonesia modern yang bermartabat. Catatan kaki mempertahankan alternatif leksikal dan nuansa kesalehan.
