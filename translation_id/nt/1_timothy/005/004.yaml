id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: id
  text: Namun, jika seorang janda mempunyai anak atau cucu[a], hendaklah mereka pertama-tama belajar berbakti kepada keluarga mereka sendiri[b] dan membalas budi kepada para pendahulu mereka[c], sebab hal ini berkenan di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak atau keturunan.” Kata Yunani ἔκγονα dapat mencakup keturunan secara lebih luas, meskipun dalam konteks ini kemungkinan besar menunjuk kepada cucu.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjalankan kesalehan terhadap keluarga mereka sendiri.” Bahasa Yunani menghubungkan pemeliharaan keluarga dengan kesalehan.
    reason: lexical_alternative
  - marker: c
    text: Atau “orang tua mereka” atau “leluhur mereka.” Kata Yunani secara harfiah menunjuk kepada orang-orang dari generasi terdahulu dan dalam konteks ini dapat mencakup orang tua atau kakek-nenek.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: seorang janda
  rationale: Makna baku dalam konteks ini adalah perempuan yang suaminya telah meninggal.
- source_word: τέκνα ἢ ἔκγονα
  choice: anak atau cucu
  rationale: τέκνα berarti anak, sedangkan ἔκγονα dapat berarti keturunan, tetapi dalam konteks kewajiban antargenerasi ini paling wajar dipahami sebagai cucu; keluasan istilah kedua dicatat dalam catatan kaki.
- source_word: μανθανέτωσαν πρῶτον
  choice: hendaklah mereka pertama-tama belajar
  rationale: Bentuk imperatif orang ketiga jamak dipertahankan dengan 'hendaklah', dan πρῶτον menyatakan prioritas.
- source_word: τὸν ἴδιον οἶκον
  choice: dalam keluarga mereka sendiri
  rationale: οἶκος di sini menunjuk kepada keluarga atau rumah tangga sebagai satuan sosial, bukan sekadar bangunan.
- source_word: εὐσεβεῖν
  choice: mewujudkan kesalehan
  rationale: Pilihan ini mempertahankan nuansa religius berupa kesalehan sekaligus menunjukkan bahwa kesalehan itu dinyatakan secara nyata melalui pemeliharaan keluarga.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: membalas budi
  rationale: Ungkapan ini menyatakan pemberian kembali sebagai balasan atas pemeliharaan yang dahulu diterima; 'membalas budi' alami dan tepat dalam konteks keluarga.
- source_word: τοῖς προγόνοις
  choice: kepada orang tua mereka
  rationale: πρόγονοι secara harfiah menunjuk kepada generasi terdahulu atau leluhur. Dalam konteks merawat seorang janda, 'orang tua' menyampaikan rujukan langsung yang paling mungkin, sementara cakupan lebih luas dipertahankan dalam catatan kaki.
- source_word: ἀπόδεκτον ἐνώπιον τοῦ θεοῦ
  choice: berkenan di hadapan Allah
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut diterima dengan baik menurut penilaian Allah; bentuk Indonesia ini alami dan bermartabat.
theological_decisions:
- issue: Rujukan subjek jamak μανθανέτωσαν
  choice: Perintah ditujukan kepada anak atau cucu janda itu.
  alternative: Perintah ditujukan kepada para janda, dengan pergeseran jumlah atau subjek tersirat.
  rationale: Rujukan jamak terdekat dan paling alami ialah τέκνα ἢ ἔκγονα. Pemahaman ini juga sesuai dengan tindakan membalas pemeliharaan generasi sebelumnya.
- issue: Hubungan εὐσεβεῖν dengan pemeliharaan keluarga
  choice: Pemeliharaan keluarga dinyatakan sebagai wujud kesalehan.
  alternative: Istilah itu hanya menyatakan pemenuhan kewajiban keluarga tanpa nuansa religius yang kuat.
  rationale: εὐσεβεῖν memiliki nuansa kesalehan yang nyata, dan alasan bahwa tindakan itu berkenan di hadapan Allah meneguhkan dimensi teologis tersebut tanpa memisahkannya dari kewajiban praktis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mewujudkan kesalehan dalam keluarga' mempertahankan dimensi religius sekaligus terdengar alami, sedangkan 'membalas budi' mengomunikasikan kewajiban timbal balik antargenerasi tanpa kesan transaksi komersial.
