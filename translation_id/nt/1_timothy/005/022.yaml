id: 1TI.5.22
reference: 1 Timothy 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: id
  text: Janganlah terburu-buru menumpangkan tangan atas siapa pun[a], dan janganlah turut mengambil bagian dalam dosa orang lain. Jagalah dirimu tetap murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, ungkapan ini dapat berarti lebih khusus, “Jangan terlalu cepat mengangkat atau menahbiskan siapa pun.” Secara harfiah, bahasa Yunani berbunyi “menumpangkan tangan,” suatu ungkapan yang sering berkaitan dengan penugasan atau pengakuan seseorang untuk pelayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: menumpangkan tangan atas
  rationale: Mempertahankan ungkapan Yunani secara alami dalam bahasa Indonesia tanpa mempersempitnya menjadi tindakan pengangkatan atau penahbisan tertentu.
- source_word: ταχέως
  choice: terburu-buru
  rationale: Dalam larangan ini, kata tersebut menyatakan tindakan yang dilakukan terlalu cepat atau tanpa pertimbangan memadai, bukan sekadar dengan lekas.
- source_word: μηδενὶ
  choice: atas siapa pun
  rationale: 'Bersama larangan, bentuk ini secara alami menyatakan cakupan universal: jangan melakukan tindakan itu atas siapa pun secara terburu-buru.'
- source_word: μηδὲ κοινώνει
  choice: dan janganlah turut mengambil bagian dalam
  rationale: Menunjukkan partisipasi atau keterlibatan yang dapat membuat seseorang ikut bertanggung jawab, tanpa membatasinya pada makna persekutuan sosial.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: dosa orang lain
  rationale: Menyampaikan secara langsung dosa yang dilakukan atau menjadi milik pihak lain.
- source_word: σεαυτὸν
  choice: dirimu
  rationale: Padanan refleksif langsung yang sesuai dengan objek perintah.
- source_word: ἁγνὸν
  choice: murni
  rationale: Menyatakan kemurnian moral secara luas; pilihan yang lebih sempit seperti 'suci secara seksual' tidak dipaksakan.
- source_word: τήρει
  choice: jagalah ... tetap
  rationale: Mengungkapkan perintah untuk terus memelihara keadaan diri, sesuai nuansa imperatif kini.
theological_decisions:
- issue: Makna ungkapan 'menumpangkan tangan' dalam konteks
  choice: Mempertahankan ungkapan 'menumpangkan tangan' tanpa secara eksplisit menerjemahkannya sebagai mengangkat atau menahbiskan.
  alternative: Jangan mengangkat/menahbiskan siapa pun terlalu cepat.
  rationale: Konteks para penatua dan pertanggungjawaban mendukung kaitan dengan pengakuan atau penetapan seseorang untuk pelayanan, tetapi teks Yunani memakai ungkapan yang lebih luas. Terjemahan utama mempertahankan ungkapan itu dan catatan kaki menjelaskan kemungkinan kontekstualnya tanpa memasukkan tata gereja tertentu.
- issue: Hubungan antara kedua larangan
  choice: 'Membiarkan hubungan logisnya tersirat: tindakan yang tergesa-gesa dapat berkaitan dengan keterlibatan dalam dosa orang lain.'
  alternative: Menjadikan larangan kedua sebagai nasihat umum yang terpisah, atau secara tegas menyatakan bahwa penumpangan tangan membuat Timotius ikut bersalah.
  rationale: Penjajaran kedua klausa menunjukkan kemungkinan hubungan erat, tetapi bahasa Yunani tidak menjelaskan hubungan itu secara eksplisit. Karena itu, terjemahan tidak memaksakan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah' dan 'jagalah' menjaga nada nasihat pastoral, sedangkan 'turut mengambil bagian' menjelaskan keterlibatan tanpa menjadi terlalu teknis.
