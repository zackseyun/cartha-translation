  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: id
  text: Jangan lagi hanya minum air[a], tetapi minumlah sedikit anggur karena lambungmu dan penyakitmu yang sering kambuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Jangan lagi menjadi peminum air.” Maksudnya, Timotius tidak boleh terus hanya minum air.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: jangan lagi
  rationale: Kata keterangan ini menandai penghentian kebiasaan sebelumnya; bentuk ini alami bersama imperatif dalam bahasa Indonesia.
- source_word: ὑδροπότει
  choice: minum air saja
  rationale: Secara harfiah verba ini berarti 'minum air'. Namun, pertentangannya dengan perintah memakai sedikit anggur menunjukkan bahwa yang dimaksud ialah kebiasaan minum air secara eksklusif, bukan larangan meminum air sama sekali.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Konjungsi adversatif ini memperkenalkan petunjuk yang berlawanan dengan kebiasaan sebelumnya.
- source_word: οἴνῳ ὀλίγῳ
  choice: sedikit anggur
  rationale: ὀλίγῳ membatasi jumlah anggur dan dengan demikian mempertahankan unsur moderasi dalam teks.
- source_word: χρῶ
  choice: minumlah
  rationale: χράομαι berarti 'menggunakan' atau 'memanfaatkan'; dalam konteks minuman, 'minumlah' menyampaikan tindakan yang dimaksud secara alami tanpa mengubah anggur menjadi sekadar jenis obat.
- source_word: διὰ
  choice: karena
  rationale: Dengan kasus akusatif, διά menyatakan alasan atau sebab bagi nasihat tersebut.
- source_word: στόμαχον
  choice: lambung
  rationale: Istilah anatomis 'lambung' merupakan padanan langsung dan lazim bagi στόμαχος dalam konteks ini.
- source_word: πυκνάς
  choice: sering kambuh
  rationale: Kata ini menyatakan frekuensi; 'sering kambuh' merupakan ungkapan Indonesia yang alami untuk penyakit yang berulang.
- source_word: ἀσθενείας
  choice: penyakit
  rationale: Walaupun dapat berarti 'kelemahan', konteks fisik dan penyebutan lambung mendukung arti penyakit atau gangguan kesehatan.
theological_decisions:
- issue: Apakah kebiasaan Timotius sebelumnya perlu dinyatakan sebagai minum air secara eksklusif
  choice: minum air saja
  alternative: jangan lagi minum air
  rationale: Pertentangan dengan 'minumlah sedikit anggur' menunjukkan bahwa air tidak dilarang sama sekali. Kata 'saja' mengungkapkan implikasi idiom Yunani dan mencegah salah pengertian.
- issue: Apakah οἶνος diterjemahkan secara harfiah atau digeneralisasi sebagai minuman obat
  choice: anggur
  alternative: minuman obat
  rationale: Teks Yunani secara eksplisit menyebut anggur. Terjemahan tidak boleh memperhalus atau memperluas istilah itu demi pertimbangan doktrinal atau budaya; kata 'sedikit' sudah mempertahankan pembatasan yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat pribadi yang lugas dan bermartabat. Susunan kalimat mempertahankan pertentangan antara kebiasaan lama dan petunjuk baru, sementara 'air saja' menjernihkan implikasi kontekstual tanpa memberi kesan bahwa air sama sekali dilarang.
