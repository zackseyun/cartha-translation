id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: id
  text: Jika seorang perempuan yang percaya mempunyai janda-janda[a], hendaklah ia mencukupi kebutuhan mereka, dan janganlah jemaat dibebani, supaya jemaat dapat mencukupi kebutuhan para janda yang sungguh-sungguh janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Jika seorang laki-laki atau perempuan yang percaya mempunyai janda-janda,” atau, “Jika seorang percaya mempunyai janda-janda,” sehingga cakupan perintah ini tidak terbatas pada subjek perempuan.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: seorang perempuan yang percaya
  rationale: Bentuk πιστή adalah feminin tunggal dan dalam teks SBLGNT menunjuk secara khusus kepada seorang perempuan. 'Yang percaya' menyatakan identitasnya sebagai orang Kristen dengan wajar dalam bahasa Indonesia.
- source_word: χήρας
  choice: janda-janda
  rationale: Bentuk jamak ini merujuk kepada para janda yang berada dalam tanggungan atau lingkup keluarga perempuan tersebut.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: mencukupi kebutuhan
  rationale: Kata kerja ἐπαρκέω dalam konteks ini menunjuk pada pemberian bantuan praktis yang memadai. Ungkapan yang sama dipakai pada kedua kemunculannya untuk menjaga kesinambungan leksikal.
- source_word: βαρείσθω
  choice: dibebani
  rationale: Bentuk pasif ini menggambarkan jemaat yang menanggung kewajiban bantuan; 'dibebani' alami dan mempertahankan daya metaforis teks Yunani.
- source_word: ἡ ἐκκλησία
  choice: jemaat
  rationale: Dalam konteks ini ἐκκλησία menunjuk kepada komunitas orang percaya setempat yang mengatur bantuan bagi para janda.
- source_word: ταῖς ὄντως χήραις
  choice: mereka yang benar-benar janda
  rationale: Terjemahan ini mempertahankan penekanan ὄντως dan kategori kontekstual para janda yang sungguh tidak memiliki penopang keluarga, tanpa memasukkan penjelasan itu langsung ke dalam teks.
theological_decisions:
- issue: Jenis kelamin subjek dalam klausa pembuka
  choice: 'Subjek perempuan secara khusus: ''seorang perempuan yang percaya'''
  alternative: Subjek generik 'orang percaya' atau bentuk luas 'laki-laki atau perempuan yang percaya' berdasarkan varian naskah
  rationale: Teks SBLGNT yang diberikan berbunyi τις πιστή, dengan πιστή berbentuk feminin tunggal. Karena itu, teks utama tidak menetralkan jenis kelamin; varian yang memperluas subjek dicatat dalam catatan kaki.
- issue: Makna 'benar-benar janda'
  choice: Mempertahankan ungkapan kategoris teks tanpa menjabarkannya dalam ayat
  alternative: Menjelaskannya sebagai 'janda yang benar-benar tidak mempunyai keluarga untuk menolongnya'
  rationale: Konteks pasal menerangkan kategori tersebut, tetapi ayat ini sendiri memakai ungkapan ringkas ταῖς ὄντως χήραις. Terjemahan mempertahankan ketegangan dan kepadatan ungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jemaat' dipilih daripada 'gereja' karena fokusnya adalah komunitas setempat sebagai pelaksana bantuan. Pengulangan 'jemaat' pada klausa tujuan menghindari ketidakjelasan rujukan pronomina 'ia'.
