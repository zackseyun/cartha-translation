  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: id
  text: Demikian juga, perbuatan-perbuatan baik tampak nyata, sedangkan perbuatan-perbuatan yang tidak demikian[a] tidak dapat tetap tersembunyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perbuatan-perbuatan yang berbeda” atau “perbuatan-perbuatan yang tidak seperti itu”; sebagian orang memahaminya secara khusus sebagai perbuatan jahat berdasarkan analogi dengan ayat sebelumnya.
    reason: Menjelaskan keluasan makna τὰ ἄλλως ἔχοντα dan kemungkinan penafsiran moral tanpa memasukkannya secara pasti ke dalam teks utama.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Demikian juga
  rationale: Ungkapan Indonesia yang alami ini menyampaikan hubungan paralel dan penegasan kedua unsur Yunani tanpa menghasilkan bentuk yang kaku.
- source_word: ἔργα τὰ καλά
  choice: perbuatan-perbuatan baik
  rationale: Menyampaikan arti konkret ἔργα dan sifat moral καλά dalam bahasa Indonesia modern yang jelas.
- source_word: πρόδηλα
  choice: tampak nyata
  rationale: Mengungkapkan bahwa perbuatan itu sudah nyata atau jelas terlihat, sekaligus mempertahankan kontras dengan hal yang tersembunyi.
- source_word: τὰ ἄλλως ἔχοντα
  choice: perbuatan-perbuatan yang tidak demikian
  rationale: Mempertahankan ungkapan Yunani yang terbuka tanpa secara tegas menambahkan bahwa perbuatan tersebut jahat; nomina 'perbuatan-perbuatan' diulang demi kejelasan dalam bahasa Indonesia.
- source_word: κρυβῆναι οὐ δύνανται
  choice: tidak dapat tetap tersembunyi
  rationale: Menyatakan ketidakmungkinan perbuatan-perbuatan itu terus tersembunyi dan menangkap daya kontekstual kontras dengan πρόδηλα.
theological_decisions:
- issue: Apakah τὰ ἄλλως ἔχοντα secara khusus menunjuk pada perbuatan jahat atau secara lebih umum pada perbuatan yang tidak demikian/tidak langsung nyata
  choice: perbuatan-perbuatan yang tidak demikian
  alternative: perbuatan-perbuatan jahat
  rationale: Teks Yunani tidak secara eksplisit memakai kata 'jahat'. Pilihan ini mempertahankan keluasan dan ketegangan ungkapan aslinya, sementara catatan kaki menyebutkan pemahaman moral yang mungkin berdasarkan konteks ayat sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'perbuatan-perbuatan' memperjelas acuan bentuk nominal Yunani; 'sedangkan' membuat kontras alami tanpa memperkuatnya menjadi pertentangan moral yang tidak dinyatakan secara eksplisit.
