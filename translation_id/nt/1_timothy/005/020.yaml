base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: id
  text: Tegurlah mereka yang berbuat dosa di hadapan semua orang[b][a], supaya yang lain juga takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang terus berbuat dosa”; bentuk partisipel kini dapat menyiratkan perbuatan dosa yang berkelanjutan.
    reason: lexical_alternative
  - marker: b
    text: Konteks terdekat mungkin secara khusus menunjuk kepada para penatua yang berbuat dosa, meskipun ayat ini sendiri hanya mengatakan “mereka yang berbuat dosa”.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: mereka yang sedang berbuat dosa
  rationale: Partisipel kini substantival menunjuk kepada orang-orang yang berbuat dosa dan dapat menyiratkan tindakan yang berlangsung. Terjemahan ini mempertahankan aspek tersebut tanpa mempertegasnya menjadi 'terus hidup dalam dosa'.
- source_word: ἐνώπιον πάντων
  choice: di hadapan semua orang
  rationale: Ungkapan ini secara dekat berarti 'di hadapan semua' dan mempertahankan latar teguran terbuka tanpa memadatkannya menjadi kata 'secara terbuka'.
- source_word: ἔλεγχε
  choice: tegurlah
  rationale: Dalam konteks penertiban jemaat, bentuk perintah ini menyatakan tindakan menegur atau menunjukkan kesalahan dengan tujuan koreksi. 'Tegurlah' alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: οἱ λοιποὶ
  choice: yang lain
  rationale: Ungkapan ini menunjuk kepada orang-orang lain selain mereka yang ditegur. 'Yang lain' lebih alami dalam kalimat ini daripada terjemahan harfiah 'sisanya'.
- source_word: φόβον ἔχωσιν
  choice: merasa takut
  rationale: Secara harfiah berarti 'memiliki rasa takut'. 'Merasa takut' merupakan ungkapan Indonesia yang alami dan tetap membiarkan terbuka apakah rasa takut itu berupa kegentaran yang menyehatkan atau kekhawatiran akan akibat dosa.
theological_decisions:
- issue: Cakupan orang yang berbuat dosa dalam konteks
  choice: Teks utama menyebut secara umum 'mereka yang sedang berbuat dosa' tanpa menambahkan 'penatua'.
  alternative: Karena ayat sebelumnya membahas tuduhan terhadap penatua, yang dimaksud mungkin secara khusus adalah para penatua yang berbuat dosa.
  rationale: Ayat Yunani ini sendiri tidak mengulangi kata 'penatua'. Terjemahan mempertahankan bentuk umum teks, sedangkan kemungkinan rujukan khusus berdasarkan konteks dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan penanda catatan [b][a] mengikuti letaknya pada frasa terkait; semua penanda muncul dalam teks utama.
