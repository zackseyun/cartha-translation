base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: id
  text: Jangan menerima tuduhan terhadap seorang penatua[a], kecuali berdasarkan kesaksian dua atau tiga orang saksi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang laki-laki yang lebih tua,” jika πρεσβυτέρου dipahami berdasarkan usia, bukan sebagai sebutan bagi pemimpin jemaat.'
    reason: alternative_reading
  - marker: b
    text: Rumusan ini mencerminkan prinsip hukum Perjanjian Lama bahwa suatu perkara diteguhkan berdasarkan keterangan “dua atau tiga orang saksi” (bdk. Ul. 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: terhadap seorang penatua
  rationale: Dalam konteks langsung yang membahas para penatua dan penanganan pelanggaran, πρεσβύτερος paling mungkin menunjuk kepada pemimpin jemaat, meskipun arti berdasarkan usia tetap mungkin dan dicatat dalam catatan kaki.
- source_word: κατηγορίαν
  choice: tuduhan
  rationale: Kata ini menunjuk pada dakwaan atau tuduhan yang bersifat formal; 'tuduhan' jelas dan alami dalam bahasa Indonesia modern.
- source_word: μὴ παραδέχου
  choice: Jangan menerima
  rationale: Bentuk imperatif ini melarang penerimaan atau penanganan suatu tuduhan sebagai perkara; 'menerima' mempertahankan nuansa prosedural tanpa menyiratkan bahwa tuduhan itu sudah terbukti benar.
- source_word: ἐκτὸς εἰ μὴ
  choice: kecuali
  rationale: Ungkapan ini memperkenalkan syarat pengecualian dan diterjemahkan secara ringkas serta alami dengan 'kecuali'.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: berdasarkan kesaksian dua atau tiga orang saksi
  rationale: ἐπί di sini menyatakan dasar pembuktian. Penambahan 'kesaksian' membuat hubungan evidensial itu jelas dalam bahasa Indonesia dan mempertahankan gema hukum Perjanjian Lama.
theological_decisions:
- issue: Makna πρεσβυτέρου dalam konteks jemaat
  choice: penatua sebagai pemimpin jemaat
  alternative: orang yang lebih tua atau laki-laki tua
  rationale: Konteks dekat 1 Timotius 5 dan pemakaian dalam Surat-Surat Pastoral mendukung pengertian jabatan atau fungsi kepemimpinan jemaat. Karena kata Yunani juga dapat bermakna orang yang lebih tua, kemungkinan itu tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. 'Penatua' dipertahankan sebagai istilah yang luas dikenal untuk pemimpin jemaat. Susunan kalimat dibuat alami, sementara nuansa prosedural dan latar hukum ayat tetap terjaga.
