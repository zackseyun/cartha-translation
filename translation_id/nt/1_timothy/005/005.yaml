  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: id
  text: Namun, perempuan yang benar-benar seorang janda[a] dan hidup sebatang kara[b] telah menaruh harapannya kepada Allah[c] serta terus bertekun dalam permohonan dan doa, malam dan siang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini menunjuk pada janda yang sungguh termasuk dalam kategori yang sedang dibahas dalam konteks ini, bukan hanya pada status perkawinannya.
    reason: contextual_clarification
  - marker: b
    text: Secara harfiah, “telah ditinggalkan seorang diri”; bentuk Yunaninya menekankan keadaannya yang berlanjut. Dalam konteksnya, hal ini dapat menyiratkan bahwa ia tidak mempunyai penopang keluarga.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “telah berharap kepada Allah.” Bentuk perfektum Yunani dapat menekankan harapan yang sudah ditetapkan dan terus bertahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dengan keadaan keluarga yang mampu merawat janda pada ayat sebelumnya; 'Namun' alami dalam bahasa Indonesia tanpa memberi kesan waktu.
- source_word: ὄντως χήρα
  choice: benar-benar seorang janda
  rationale: Mempertahankan penekanan bahwa yang dimaksud ialah janda dalam arti yang sungguh sesuai dengan kriteria konteks, bukan sekadar penyebutan status sosial.
- source_word: μεμονωμένη
  choice: hidup sebatang kara
  rationale: Partisipel perfektum menggambarkan keadaan berkelanjutan sebagai orang yang ditinggalkan sendirian, dalam konteks ini tanpa keluarga yang menopang. Ungkapan Indonesia ini menyampaikan kerentanan sosial tersebut secara wajar.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: telah menaruh harapannya kepada Allah
  rationale: Bentuk perfektum menyatakan tindakan menaruh harapan yang menghasilkan sikap tetap sampai sekarang; 'kepada Allah' sesuai dengan arah kebergantungan yang dinyatakan oleh ἐπί dengan akusatif.
- source_word: προσμένει
  choice: terus bertekun
  rationale: Menyampaikan tindakan yang berlangsung dan ketekunan tetap dalam kegiatan yang disebutkan sesudahnya.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: dalam permohonan dan doa
  rationale: 'Mempertahankan kedua istilah Yunani: δεήσεις menunjuk pada permohonan khusus, sedangkan προσευχαί merupakan istilah yang lebih umum untuk doa.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: malam dan siang
  rationale: Mempertahankan urutan Yunani dan idiom yang menyatakan kebiasaan yang terus-menerus, bukan keharusan berdoa tanpa jeda.
theological_decisions:
- issue: Jati diri 'janda yang benar-benar janda'
  choice: 'Ayat ini menggambarkan janda yang sungguh termasuk dalam kategori yang sedang dibahas: tidak memiliki penopang keluarga, berharap kepada Allah, dan tekun berdoa.'
  alternative: Ayat ini hanya menggambarkan semua janda secara umum tanpa nuansa kriteria dalam konteks pelayanan jemaat.
  rationale: ὄντως dan konteks langsung 1 Timotius 5 membedakan kelompok tertentu, tetapi terjemahan tidak memasukkan tata gereja atau kriteria denominasi yang tidak dinyatakan dalam ayat ini.
- issue: Aspek perfektum dalam ἤλπικεν
  choice: Harapan kepada Allah dipahami sebagai sikap yang telah ditetapkan dan tetap berlangsung.
  alternative: Ungkapan itu hanya menunjuk pada tindakan berharap pada masa lampau.
  rationale: Perfektum Yunani secara wajar menonjolkan keadaan kini yang merupakan hasil tindakan sebelumnya; terjemahan dan catatan mempertahankan nuansa ini tanpa menjadikannya pernyataan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Hidup sebatang kara' dipilih sebagai ungkapan alami untuk ketiadaan penopang keluarga, sementara catatan kaki menjaga bentuk harfiah. Koma sebelum 'malam dan siang' memperjelas bahwa frasa itu menerangkan ketekunan dalam kedua kegiatan, yakni permohonan dan doa.
