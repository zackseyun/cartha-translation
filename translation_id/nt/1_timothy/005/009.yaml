  text: Seorang janda hanya boleh dimasukkan dalam daftar apabila ia telah berusia sekurang-kurangnya enam puluh tahun dan pernah menjadi istri dari satu suami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang perempuan yang setia kepada satu laki-laki.” Ungkapan ini mungkin menunjuk pada kesetiaan atau reputasinya dalam perkawinan, meskipun ada yang memahaminya sebagai “hanya pernah menikah satu kali.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: seorang janda
  rationale: Padanan baku dan alami untuk perempuan yang suaminya telah meninggal; konteksnya adalah janda yang dimasukkan ke dalam daftar resmi.
- source_word: καταλεγέσθω
  choice: hanya boleh dimasukkan ke dalam daftar
  rationale: Menjaga makna administratif verba tersebut, yakni dicatat dalam suatu daftar resmi, sekaligus menyampaikan daya pembatas dari konstruksi ayat.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: jika usianya tidak kurang dari enam puluh tahun
  rationale: Menyatakan batas usia minimum secara jelas dan tetap dekat dengan bentuk negatif teks Yunani; γεγονυῖα dipahami secara idiomatis sebagai telah mencapai usia tersebut.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: ia telah menjadi istri dari satu suami
  rationale: Terjemahan yang cukup formal ini mempertahankan ungkapan Yunani dan ambiguitasnya, tanpa menetapkan apakah maksudnya hanya pernah menikah sekali atau terkenal setia dalam perkawinan.
theological_decisions:
- issue: Makna ἑνὸς ἀνδρὸς γυνή
  choice: Mempertahankan ungkapan “istri dari satu suami” dalam teks utama.
  alternative: “hanya pernah menikah satu kali” atau “setia kepada suaminya”
  rationale: Ungkapan itu dapat dipahami sebagai syarat riwayat satu perkawinan atau sebagai gambaran kesetiaan dan reputasi perkawinan. Teks Yunani tidak menyelesaikan perbedaan ini secara tegas, sehingga ambiguitas dipertahankan dan alternatif utama dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dimasukkan ke dalam daftar” dipilih karena jelas bagi pembaca umum dan mempertahankan nuansa administratif. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas teologis pada frasa penutup.
