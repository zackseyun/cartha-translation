  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: id
  text: Tetapi, perempuan yang hidup untuk kesenangan telah mati, walaupun ia masih hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perempuan yang hidup memanjakan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: yang hidup berfoya-foya
  rationale: Partisipel kini ini menggambarkan pola hidup yang memanjakan diri dan berorientasi pada kenikmatan. 'Hidup berfoya-foya' alami dalam bahasa Indonesia dan tidak sekadar berarti menikmati sesuatu.
- source_word: ζῶσα
  choice: meskipun ia masih hidup
  rationale: Ungkapan ini menyampaikan daya konsesif partisipel serta memperjelas paradoks dengan keadaan mati yang dinyatakan sesudahnya.
- source_word: τέθνηκεν
  choice: sudah mati
  rationale: Bentuk perfek menekankan keadaan kini sebagai hasil kematian; 'sudah mati' mempertahankan aspek resultatif tanpa menentukan secara eksplisit jenis kematian itu.
- source_word: ἡ ... σπαταλῶσα
  choice: perempuan yang hidup berfoya-foya
  rationale: Artikel feminin tunggal dengan partisipel berfungsi substantival. 'Perempuan yang...' mempertahankan gender dan rujukan wacana tanpa menambahkan sebutan 'janda' yang tidak muncul dalam ayat ini.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras dengan gambaran janda sejati pada ayat sebelumnya; 'Namun' menyatakan pertentangan itu secara wajar dan bermartabat.
theological_decisions:
- issue: Makna 'mati' ketika masih hidup
  choice: Metafora kematian dipertahankan tanpa menjelaskan jenisnya di dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai mati secara rohani, mati secara moral, atau dianggap mati secara sosial.
  rationale: Pertentangan antara 'sudah mati' dan 'masih hidup' sengaja membentuk paradoks yang menunjukkan kematian nonfisik. Terjemahan tidak mengunci metafora itu pada satu rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Berfoya-foya' dipilih untuk pola hidup penuh pemanjaan diri, bukan sekadar kesenangan biasa; catatan kaki mempertahankan alternatif leksikal yang lebih harfiah.
