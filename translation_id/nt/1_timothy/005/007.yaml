id: 1TI.5.7
reference: 1 Timothy 5:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: id
  text: Perintahkan juga hal-hal ini[a], supaya mereka tidak bercela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berilah petunjuk tentang hal-hal ini” atau “arahkanlah mereka dalam hal-hal ini”; kata kerjanya mengandung kewibawaan.
    reason: lexical_alternative
  - marker: b
    text: Subjek “mereka” tidak dinyatakan secara eksplisit dalam bahasa Yunani. Dalam konteks, kemungkinan besar yang dimaksud ialah orang-orang yang dibicarakan dalam petunjuk sebelumnya, khususnya para janda dan keluarga mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: juga
  rationale: Dalam konteks ini καί menghubungkan perintah ini dengan petunjuk sebelumnya; “juga” alami dalam bahasa Indonesia tanpa menambahkan penekanan yang tidak tersurat.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Bentuk penunjuk netral jamak ini merujuk pada berbagai petunjuk sebelumnya dan tetap mempertahankan keluasan ungkapan Yunani.
- source_word: παράγγελλε
  choice: perintahkan
  rationale: Imperatif kini ini menyampaikan pengarahan yang berwibawa dan berkelanjutan; “perintahkan” mempertahankan daya perintah verba tersebut.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan maksud atau hasil; “supaya” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀνεπίλημπτοι
  choice: tidak bercela
  rationale: Ungkapan ini berarti tidak memberi dasar yang sah bagi celaan atau tuduhan; “tidak bercela” ringkas, bermartabat, dan lazim dalam konteks etis.
- source_word: ὦσιν
  choice: mereka
  rationale: Bahasa Indonesia memerlukan subjek yang dinyatakan dalam klausa ini. “Mereka” mempertahankan bentuk jamak tanpa menentukan kelompok rujukannya secara lebih sempit daripada teks Yunani.
theological_decisions:
- issue: Rujukan subjek jamak tersirat dalam ἵνα ἀνεπίλημπτοι ὦσιν
  choice: Menggunakan “mereka” tanpa menyebut kelompok tertentu dalam teks utama.
  alternative: Menentukan bahwa yang dimaksud adalah para janda dan keluarga mereka, Timotius, atau jemaat secara lebih luas.
  rationale: Teks Yunani tidak menyatakan subjek jamaknya. Konteks terdekat kemungkinan menunjuk kepada orang-orang yang dibicarakan dalam petunjuk sebelumnya, khususnya para janda dan keluarga mereka, tetapi terjemahan tidak seharusnya meniadakan ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan berwibawa. Susunan kalimat dibuat alami, sementara daya perintah dan ketidakjelasan rujukan subjek dalam teks Yunani tetap dipertahankan.
