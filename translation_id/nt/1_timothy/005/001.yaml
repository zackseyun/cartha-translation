  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: id
  text: Jangan menegur keras seorang laki-laki yang lebih tua[a], melainkan nasihatilah dia seperti seorang ayah, dan laki-laki yang lebih muda seperti saudara,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang penatua”; kata Yunani ini dapat berarti laki-laki yang lebih tua atau penatua, tetapi kontras berdasarkan usia dalam konteks ini lebih mendukung arti laki-laki yang lebih tua.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: seorang laki-laki yang lebih tua
  rationale: Kata sifat substantival maskulin tunggal ini berhadapan dengan νεωτέρους (‘laki-laki yang lebih muda’) dan dengan kelompok perempuan pada ayat berikutnya, sehingga makna berdasarkan usia paling sesuai. Bentuk maskulinnya dipertahankan.
- source_word: μὴ ἐπιπλήξῃς
  choice: Jangan menegur keras
  rationale: ἐπιπλήσσω menyatakan teguran atau hardikan yang keras. ‘Menegur keras’ membedakannya dari nasihat penuh hormat yang diperintahkan sesudahnya tanpa memberi kesan bahwa semua koreksi dilarang.
- source_word: ἀλλὰ παρακάλει
  choice: melainkan nasihatilah dia
  rationale: Dalam kontras dengan teguran keras dan dalam bingkai hubungan kekeluargaan, παρακαλέω bermakna menasihati atau mengimbau dengan hormat. ‘Dia’ melengkapi objek yang tersirat agar alami dalam bahasa Indonesia.
- source_word: ὡς πατέρα
  choice: seperti seorang ayah
  rationale: ὡς memperkenalkan perbandingan; ungkapan ini menyampaikan sikap hormat yang patut diberikan kepada ayah.
- source_word: νεωτέρους
  choice: laki-laki yang lebih muda
  rationale: Bentuk substantival maskulin jamak ini merujuk kepada laki-laki yang lebih muda, sesuai dengan ἀδελφούς dan pembedaan menurut jenis kelamin dalam ayat berikutnya.
- source_word: ὡς ἀδελφούς
  choice: seperti saudara
  rationale: Dalam konteks kelompok laki-laki, ἀδελφούς berarti saudara laki-laki. Bahasa Indonesia lazim memakai ‘saudara’ tanpa harus menambahkan ‘laki-laki’, yang sudah jelas dari objek sebelumnya.
theological_decisions:
- issue: Apakah Πρεσβυτέρῳ menunjuk kepada jabatan penatua atau kepada laki-laki yang lebih tua
  choice: 'Makna berdasarkan usia: ‘seorang laki-laki yang lebih tua’'
  alternative: ‘seorang penatua’
  rationale: Susunan laki-laki lebih tua/ayah, laki-laki lebih muda/saudara, lalu perempuan lebih tua/ibu dan perempuan lebih muda/saudari pada ayat berikutnya sangat mendukung kategori usia dan jenis kelamin. Namun, kemungkinan makna jabatan tetap dicatat karena kata Yunaninya dapat dipakai untuk penatua jemaat.
- issue: Apakah ἀδελφούς harus diterjemahkan secara inklusif
  choice: ‘saudara’, merujuk kepada saudara laki-laki
  alternative: ‘saudara-saudari’
  rationale: Bentuk maskulin ini berada dalam rangkaian yang membedakan laki-laki dan perempuan; karena itu terjemahan inklusif akan mengaburkan struktur teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Menegur keras’ mempertahankan daya kata ἐπιπλήσσω, sedangkan ‘nasihatilah’ menyampaikan pendekatan yang hormat dan kekeluargaan. Tanda koma akhir dipertahankan karena kalimat berlanjut ke ayat 2.
