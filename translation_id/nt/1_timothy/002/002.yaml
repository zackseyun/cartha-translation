  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: id
  text: untuk raja-raja dan semua orang yang berkedudukan tinggi[a], supaya kita dapat menjalani hidup yang tenteram dan tenang dalam segala kesalehan dan martabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua orang yang berwenang.” Secara harfiah, frasa Yunani ini berarti “semua orang yang berada dalam kedudukan tinggi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: untuk
  rationale: Dalam konteks ajakan untuk berdoa dan menaikkan permohonan pada ayat sebelumnya, kata ini secara alami menunjuk kepada orang-orang yang menjadi sasaran doa.
- source_word: βασιλέων
  choice: raja-raja
  rationale: Nomina ini secara khusus berarti raja-raja; pilihan ini mempertahankan bentuk leksikal dan latar historisnya tanpa memperluasnya menjadi semua penguasa.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: semua orang yang berkedudukan tinggi
  rationale: Frasa ini secara harfiah mengacu kepada mereka yang berada dalam kedudukan menonjol atau tinggi dan lebih luas daripada pejabat yang memiliki wewenang formal saja.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud dengan jelas dan alami dalam bahasa Indonesia.
- source_word: ἤρεμον
  choice: tenteram
  rationale: Mengungkapkan keadaan yang bebas dari gangguan dan tetap membedakannya dari ἡσύχιον.
- source_word: ἡσύχιον
  choice: tenang
  rationale: Menekankan ketenangan atau keadaan tidak gaduh; pasangan 'tenteram dan tenang' mempertahankan dua sifat Yunani tanpa meleburkannya.
- source_word: βίον διάγωμεν
  choice: kita dapat menjalani hidup
  rationale: Menyampaikan tindakan menempuh atau menjalani kehidupan secara idiomatis, bukan sekadar berada dalam keadaan hidup.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: dalam segala kesalehan
  rationale: εὐσέβεια menunjuk pada pengabdian yang penuh hormat kepada Allah dan terwujud dalam kehidupan; 'kesalehan' adalah padanan Indonesia yang ringkas dan lazim.
- source_word: σεμνότητι
  choice: kehormatan
  rationale: Nomina ini menyatakan kesungguhan dan perilaku yang patut dihormati; 'kehormatan' mempertahankan bobot moral-sosialnya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan dan tujuan doa bagi para penguasa sipil
  choice: Ayat diterjemahkan sebagai doa untuk raja-raja dan semua orang yang berkedudukan tinggi, dengan tujuan agar umat dapat hidup tenteram, saleh, dan terhormat.
  alternative: Menerjemahkan frasa itu secara lebih sempit sebagai semua orang yang memiliki wewenang, atau menonjolkan ketundukan kepada pemerintah.
  rationale: Teks Yunani menyebut orang-orang yang didoakan dan kondisi sosial yang diharapkan, tetapi tidak menyatakan dukungan tanpa syarat kepada mereka atau merumuskan doktrin lengkap tentang legitimasi setiap penguasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti kesinambungan dengan ayat sebelumnya; diksi 'berkedudukan tinggi' mempertahankan keluasan frasa Yunani, sedangkan catatan kaki mencatat alternatif yang menekankan wewenang formal.
