  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: id
  text: Hal ini baik dan berkenan di hadapan Allah, Juru Selamat kita,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Hal ini
  rationale: Kata tunjuk netral tunggal ini merujuk kembali pada petunjuk sebelumnya mengenai doa. “Hal ini” alami dalam bahasa Indonesia dan mempertahankan daya rujuknya tanpa menjelaskan secara berlebihan.
- source_word: καλὸν
  choice: baik
  rationale: Dalam konteks etis ini, kata tersebut menyatakan kebaikan atau kepatutan moral, bukan keindahan secara estetis.
- source_word: ἀπόδεκτον
  choice: berkenan
  rationale: Kata ini menyatakan sesuatu yang diterima dengan baik atau disambut baik. “Berkenan” merupakan ungkapan Indonesia yang alami ketika Allah menjadi pihak yang menilai, sambil mempertahankan nuansa penerimaan positif.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini menyatakan penilaian dalam pandangan atau kehadiran Allah. “Di hadapan” ringkas, wajar, dan mempertahankan gambaran relasional teks Yunani.
- source_word: σωτῆρος
  choice: Juru Selamat
  rationale: Gelar ini menyatakan pihak yang menyelamatkan. “Juru Selamat” adalah padanan baku dan jelas dalam pemakaian Perjanjian Baru bahasa Indonesia.
- source_word: ἡμῶν
  choice: kita
  rationale: Pronomina genitif ini menerangkan “Juru Selamat” dan mencakup penulis beserta para pembaca.
- source_word: θεοῦ
  choice: Allah
  rationale: Nomina genitif ini beraposisi dengan “Juru Selamat,” sehingga Allah diidentifikasi sebagai Juru Selamat kita.
theological_decisions:
- issue: Hubungan aposisional dalam τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Allah, Juru Selamat kita
  alternative: Allah Juru Selamat kita; Allah Penyelamat kita
  rationale: 'Susunan genitif Yunani paling alami dipahami secara aposisional: Allah diidentifikasi sebagai Juru Selamat kita. Tanda koma memperjelas aposisi dalam bahasa Indonesia tanpa menambahkan klaim doktrinal di luar teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hal ini” menjaga rujukan ke konteks sebelumnya; “berkenan di hadapan” terdengar alami dalam konteks ilahi. Kapitalisasi “Juru Selamat” mempertahankan fungsinya sebagai gelar. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
