  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: id
  text: Sebab Allah itu satu, dan pengantara antara Allah dan manusia pun satu, yaitu manusia Mesias Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς
  choice: satu
  rationale: 'Kedua kemunculannya diterjemahkan sama untuk mempertahankan kesejajaran yang tegas: Allah satu dan pengantara pun satu.'
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberi dasar atau penjelasan bagi pernyataan sebelumnya.
- source_word: θεός
  choice: Allah
  rationale: Padanan baku dalam bahasa Indonesia untuk θεός dalam konteks ini.
- source_word: εἷς καὶ μεσίτης
  choice: pengantara ... pun satu
  rationale: Partikel 'pun' mengungkapkan daya καὶ secara alami sekaligus mempertahankan kesejajaran dengan 'Allah itu satu'.
- source_word: μεσίτης
  choice: pengantara
  rationale: Istilah Indonesia yang wajar bagi pihak yang berada di antara dua pihak; cukup luas untuk tidak mempersempit fungsi yang dimaksud teks.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: antara Allah dan manusia
  rationale: Genitif Yunani diungkapkan secara idiomatis dengan 'antara'; 'manusia' bersifat generik dan mencakup umat manusia.
- source_word: ἄνθρωπος
  choice: manusia
  rationale: Menegaskan kemanusiaan sang pengantara dan mempertahankan kaitan leksikal dengan ἀνθρώπων, yang juga diterjemahkan 'manusia'.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar, bukan memperlakukannya sebagai nama keluarga.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Kaitan antara ἀνθρώπων dan ἄνθρωπος
  choice: manusia ... manusia
  alternative: umat manusia ... seorang manusia
  rationale: Pengulangan 'manusia' mempertahankan kaitan leksikal antara umat manusia secara umum dan kemanusiaan Yesus, tanpa membuat pembedaan gender yang tidak terdapat dalam pemakaian generik kata tersebut.
- issue: Status Χριστός sebagai gelar
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam konteks ini Χριστός memiliki daya gelar; 'Mesias' menyampaikan maknanya secara langsung, sedangkan urutan Yunani tetap dipertahankan.
- issue: Daya kristologis ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: yaitu manusia, Mesias Yesus
  alternative: yaitu manusia Mesias Yesus
  rationale: Terjemahan menegaskan kemanusiaan Yesus sebagaimana teks melakukannya, tanpa menambahkan kesimpulan tentang keilahian-Nya yang tidak dinyatakan atau disangkal oleh ayat ini. Koma membantu memperjelas aposisi.
- issue: Keberadaan atau ketakberadaan kata sandang pada ἄνθρωπος
  choice: manusia
  alternative: seorang manusia
  rationale: Nomina tanpa kata sandang ini dapat berdaya kualitatif atau apositif. Bahasa Indonesia tidak memerlukan kata sandang, sehingga 'manusia' menjaga keluasan tersebut dan tidak memaksakan arti tak tentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami dengan pola 'Allah itu satu ... pun satu'. Tidak diperlukan catatan kaki karena alternatif utama dapat dijelaskan dalam keputusan penerjemahan tanpa membebani teks ayat.
