  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: id
  text: Demikian juga, hendaklah para perempuan menghiasi diri dengan pakaian yang pantas, dengan kesopanan dan penguasaan diri, bukan dengan rambut berkepang, emas, mutiara, atau pakaian mahal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penyebutan “rambut berkepang, emas, mutiara, atau pakaian mahal” kemungkinan besar menyoroti cara berhias yang mencolok dan memamerkan kemewahan, bukan menetapkan larangan atas setiap kepangan atau perhiasan dalam segala keadaan.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Demikian juga
  rationale: Ungkapan ini secara alami menyatakan hubungan tambahan dengan nasihat sebelumnya; unsur καί tercakup dalam idiom Indonesia “demikian juga” tanpa perlu diterjemahkan secara kaku.
- source_word: γυναῖκας
  choice: para perempuan
  rationale: Dalam konteks nasihat umum ini tidak ada penanda perkawinan yang mengharuskan arti “istri-istri”; “para perempuan” mempertahankan cakupan umum.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: dengan pakaian yang pantas
  rationale: καταστολή menunjuk pada pakaian atau busana, sedangkan κόσμιος menyatakan kepantasan dan ketertiban. Pilihan ini alami dalam bahasa Indonesia modern dan tidak mempersempitnya menjadi sekadar penutupan tubuh.
- source_word: μετὰ αἰδοῦς
  choice: disertai sikap tahu malu
  rationale: αἰδώς menunjuk pada rasa segan atau kepekaan moral yang menahan seseorang dari hal yang tidak patut. “Sikap tahu malu” mempertahankan nuansa batin dan perilaku, bukan hanya gaya pakaian.
- source_word: σωφροσύνης
  choice: penguasaan diri
  rationale: Istilah ini mencakup pikiran sehat, kebijaksanaan, dan pengekangan diri; “penguasaan diri” jelas dan wajar dalam konteks ini.
- source_word: κοσμεῖν ἑαυτάς
  choice: hendaklah ... menghiasi diri
  rationale: “Menghiasi diri” mempertahankan hubungan verbal dengan bentuk-bentuk perhiasan yang dikontraskan sesudahnya, sementara “hendaklah” menyampaikan daya nasihat dari konstruksi Yunani.
- source_word: μὴ ἐν πλέγμασιν
  choice: bukan dengan rambut berkepang
  rationale: πλέγματα menunjuk pada kepangan atau tatanan rambut yang dikepang. “Rambut berkepang” jelas tanpa menambahkan kata “rumit” yang tidak dinyatakan secara eksplisit.
- source_word: χρυσίῳ
  choice: emas
  rationale: Terjemahan luas ini mengikuti bentuk Yunani dan tidak menentukan jenis perhiasan emas secara berlebihan.
- source_word: μαργαρίταις
  choice: mutiara
  rationale: Ini adalah padanan langsung dan lazim bagi μαργαρίταις.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: pakaian mahal
  rationale: ἱματισμός berarti pakaian, dan πολυτελής berarti mahal atau bernilai tinggi; padanan ini sederhana serta kontemporer.
theological_decisions:
- issue: Apakah ayat ini berbicara kepada perempuan pada umumnya atau khusus kepada para istri
  choice: perempuan pada umumnya
  alternative: para istri
  rationale: Bentuk jamak γυναῖκας berada dalam konteks nasihat umum dan tidak disertai penanda yang membatasinya pada perempuan menikah.
- issue: Apakah daftar kepangan, emas, mutiara, dan pakaian mahal merupakan larangan mutlak atau kontras terhadap pamer kemewahan
  choice: Teks utama mempertahankan bentuk larangan sebagaimana tertulis, sedangkan catatan menjelaskan kemungkinan sasaran kontekstualnya, yaitu perhiasan yang mencolok dan berlebihan.
  alternative: Larangan mutlak atas setiap kepangan, emas, mutiara, atau pakaian mahal dalam segala keadaan.
  rationale: Sintaksis mengontraskan penghiasan yang pantas, tahu malu, dan terkendali dengan sarana penghiasan mewah yang disebutkan. Karena bentuk lahiriah larangannya tetap nyata, terjemahan tidak menyisipkan pembatas interpretatif ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pakaian yang pantas” dipilih karena lebih alami daripada “busana tertib”; “sikap tahu malu” mempertahankan dimensi moral αἰδώς tanpa memakai ungkapan yang arkais. Penanda catatan kaki [a] ditempatkan sesudah seluruh daftar agar jelas bahwa catatan menjelaskan keseluruhan kontras.
