  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: id
  text: Seorang perempuan harus belajar dengan tenang[b][a], dengan penuh ketundukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang istri”, tergantung pada konteks; kata Yunani yang digunakan dapat berarti “perempuan” atau “istri”.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam keheningan”; istilah Yunani ini juga dapat berarti ketenangan atau sikap tidak gaduh, dan tidak mesti berarti sama sekali tidak berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: γυνή dapat berarti ‘perempuan’ atau ‘istri’ menurut konteks. Di sini bentuk tunggal tanpa artikel paling wajar dipahami secara umum dan tidak secara tegas menunjukkan status perkawinan; kemungkinan ‘istri’ dipertahankan dalam catatan kaki.
- source_word: ἐν ἡσυχίᾳ
  choice: dengan tenang
  rationale: ἡσυχία dapat menunjuk pada ketenangan, sikap tidak gaduh, atau keheningan, dan tidak mesti berarti sama sekali tidak berbicara. ‘Dengan tenang’ terdengar alami dalam bahasa Indonesia serta tidak membuat perintah ini lebih mutlak daripada bahasa Yunaninya.
- source_word: μανθανέτω
  choice: harus belajar
  rationale: Bentuk imperatif kini aktif orang ketiga tunggal memberi instruksi positif agar perempuan belajar. ‘Harus belajar’ menyampaikan daya perintah itu dengan jelas dalam bahasa Indonesia modern.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: dengan penuh ketundukan
  rationale: ὑποταγή berarti ketundukan atau sikap tunduk, sedangkan πάσῃ menyatakan kelengkapan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan objek ketundukan yang tidak disebutkan dalam teks Yunani.
theological_decisions:
- issue: Apakah ἡσυχία berarti diam mutlak atau sikap tenang
  choice: dengan tenang
  alternative: dalam keheningan; dengan diam
  rationale: Rentang maknanya mencakup ketenangan dan keadaan tidak gaduh, bukan hanya kebisuan mutlak. Pilihan ini mempertahankan ketegangan leksikal tanpa memperkeras perintah tersebut.
- issue: Apakah γυνή berarti ‘perempuan’ atau ‘istri’
  choice: seorang perempuan
  alternative: seorang istri
  rationale: Konteks langsung tidak secara eksplisit menetapkan hubungan perkawinan. ‘Perempuan’ tidak mempersempit rujukannya, sedangkan kemungkinan ‘istri’ dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. ‘Dengan tenang’ dipilih daripada bentuk nominal yang kaku, dan ‘penuh ketundukan’ mempertahankan cakupan πάσῃ tanpa menyebutkan kepada siapa ketundukan itu ditujukan.
