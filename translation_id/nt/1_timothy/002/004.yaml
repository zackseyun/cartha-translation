id: 1TI.2.4
reference: 1 Timothy 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: id
  text: yang menghendaki agar semua orang diselamatkan dan sampai pada pengetahuan akan kebenaran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menginginkan agar semua orang diselamatkan.” Kata kerja Yunani ini juga dapat diterjemahkan “menginginkan” atau “berkehendak.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sampai pada pengetahuan penuh akan kebenaran.” Kata benda Yunani ini dapat mengandung nuansa pengetahuan yang lebih penuh atau lengkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: yang
  rationale: Kata ganti relatif ini merujuk kepada Allah dalam ayat sebelumnya. 'Yang' mempertahankan hubungan sintaksis itu secara alami dalam bahasa Indonesia.
- source_word: πάντας ἀνθρώπους
  choice: semua orang
  rationale: Frasa ini menunjuk kepada manusia secara umum, bukan hanya laki-laki. 'Semua orang' menyampaikan cakupan universalnya tanpa mempersempitnya menjadi golongan-golongan manusia.
- source_word: θέλει
  choice: menghendaki
  rationale: θέλω dapat berarti menghendaki, menginginkan, atau berkehendak. 'Menghendaki' wajar dan bermartabat, tetapi tidak dengan sendirinya menetapkan suatu pengertian teknis mengenai kehendak ilahi.
- source_word: σωθῆναι
  choice: diselamatkan
  rationale: Infinitif pasif σῴζω di sini memiliki makna keselamatan; 'diselamatkan' merupakan padanan baku dan jelas.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: pada pengetahuan akan kebenaran
  rationale: ἐπίγνωσις dapat berarti pengetahuan, pengenalan, atau pengetahuan yang penuh. Ungkapan ini alami dalam bahasa Indonesia dan tidak melebihkan nuansa 'penuh' yang mungkin, tetapi tidak wajib.
- source_word: ἐλθεῖν
  choice: sampai
  rationale: Dengan εἰς, ἔρχομαι menggambarkan gerak menuju suatu keadaan. 'Sampai pada' lebih idiomatis dalam bahasa Indonesia daripada terjemahan harfiah 'datang kepada'.
theological_decisions:
- issue: Cakupan πάντας ἀνθρώπους dan kehendak Allah mengenai keselamatan
  choice: Menerjemahkan secara langsung sebagai 'semua orang' dan θέλει sebagai 'menghendaki'.
  alternative: ‘segala macam orang’; ‘berkehendak menetapkan agar semua orang diselamatkan’; atau ‘menginginkan agar semua orang diselamatkan’
  rationale: Bahasa Yunani secara alami menyatakan cakupan universal. Terjemahan tidak mempersempitnya menjadi kelompok-kelompok manusia dan juga tidak menjadikan verba tersebut istilah teknis tentang ketetapan ilahi, sehingga ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Karena ayat ini melanjutkan kalimat dari ayat sebelumnya, teks dimulai dengan kata relatif 'yang'. Kedua penanda catatan kaki dicantumkan setelah klausa yang berkaitan secara keseluruhan.
