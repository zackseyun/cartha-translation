source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: id
  text: Karena itu, pertama-tama aku mendesak agar permohonan, doa, syafaat, dan ucapan syukur dipanjatkan bagi semua orang[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kepentingan semua orang.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami “semua orang” sebagai “segala macam orang”; teks Yunani sendiri hanya mengatakan “semua orang.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: aku mendesak
  rationale: Kata ini menyampaikan dorongan atau imbauan yang sungguh-sungguh; 'mendesak' mempertahankan kekuatannya dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau peralihan yang bertolak dari pembahasan sebelumnya.
- source_word: πρῶτον πάντων
  choice: pertama-tama
  rationale: Ungkapan ini menekankan prioritas, tanpa harus menyiratkan urutan bernomor yang panjang.
- source_word: ποιεῖσθαι
  choice: dipanjatkan
  rationale: Dalam konteks empat bentuk doa, 'dipanjatkan' terdengar alami dan dapat mencakup semuanya, meskipun secara lebih harfiah berarti 'dilakukan' atau 'dibuat'.
- source_word: δεήσεις
  choice: permohonan
  rationale: Menunjuk pada permintaan yang lahir dari kebutuhan dan dibedakan dari istilah umum untuk doa.
- source_word: προσευχάς
  choice: doa
  rationale: Padanan langsung bagi istilah umum yang berarti doa.
- source_word: ἐντεύξεις
  choice: syafaat
  rationale: Dalam konteks ini menunjuk pada permohonan kepada Allah bagi kepentingan orang lain; 'syafaat' merupakan istilah Indonesia yang ringkas dan lazim.
- source_word: εὐχαριστίας
  choice: ucapan syukur
  rationale: Padanan alami dalam bahasa Indonesia yang tetap membedakannya dari unsur-unsur doa lainnya.
- source_word: ὑπὲρ
  choice: bagi
  rationale: Dengan bentuk genitif, kata depan ini menyatakan kepentingan atau perwakilan; 'bagi' alami di sini, sementara nuansa 'atas nama' dicatat dalam catatan kaki.
- source_word: πάντων ἀνθρώπων
  choice: semua orang
  rationale: ἄνθρωπος bersifat generik dan mencakup manusia tanpa membatasi pada laki-laki; frasa Yunani sendiri tidak menyempitkannya menjadi golongan tertentu.
theological_decisions:
- issue: Cakupan πάντων ἀνθρώπων
  choice: semua orang
  alternative: segala macam orang
  rationale: Bunyi Yunani secara langsung adalah 'semua orang'. Penafsiran bahwa yang dimaksud ialah segala macam atau golongan orang tidak dimasukkan ke dalam teks, agar ketegangan penafsirannya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' mengikuti suara pribadi penulis surat. Deretan empat istilah dipertahankan untuk mencerminkan struktur Yunani. Koma akhir dari data sumber tidak dipertahankan sebagai tanda bahwa ayat ini selesai; teks diterbitkan sebagai satu kalimat ayat.
