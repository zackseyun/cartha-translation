base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: id
  text: Untuk itulah[a] aku ditetapkan sebagai pemberita dan rasul—aku berkata yang benar, aku tidak berdusta—sebagai pengajar orang-orang bukan Yahudi[b] dalam iman dan kebenaran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Untuk hal inilah aku ditetapkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pengajar bangsa-bangsa.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dalam kesetiaan dan kebenaran.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Untuk itulah
  rationale: Ungkapan ini secara alami menunjuk kembali kepada pemberitaan dan tujuan penyelamatan yang disebut sebelumnya, sekaligus mempertahankan nuansa tujuan dari frasa Yunani.
- source_word: ἐτέθην
  choice: aku ditetapkan
  rationale: Bentuk pasif τίθημι di sini menyatakan penetapan atau penugasan untuk suatu pelayanan, bukan penempatan secara jasmani.
- source_word: κῆρυξ
  choice: pemberita
  rationale: Pilihan ini menyampaikan tugas mengumumkan berita secara terbuka atas nama pihak lain tanpa terlalu terikat pada istilah jabatan gerejawi.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam penyebutan diri Paulus, kata ini merupakan gelar pelayanan yang sudah dikenal dan paling tepat diterjemahkan sebagai 'rasul'.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: aku mengatakan yang benar, aku tidak berdusta
  rationale: Terjemahan ini mempertahankan penegasan ganda yang kuat dan terdengar alami dalam bahasa Indonesia modern.
- source_word: διδάσκαλος ἐθνῶν
  choice: pengajar orang-orang bukan Yahudi
  rationale: Dalam konteks pelayanan Paulus, ἔθνη merujuk terutama kepada kalangan non-Yahudi; bentuk ini lebih jelas bagi pembaca umum daripada serapan 'bangsa-bangsa lain'.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: dalam iman dan kebenaran
  rationale: Terjemahan ini mempertahankan bentuk dan keluwesan frasa sumber, yang dapat menunjuk pada lingkup, sifat, atau cara pelayanan Paulus; kemungkinan makna 'kesetiaan' dicatat.
theological_decisions:
- issue: Rujukan ἐθνῶν dalam penugasan Paulus
  choice: orang-orang bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Pemakaian Paulus dan konteksnya mendukung rujukan kepada kaum non-Yahudi, tetapi arti harfiah yang lebih luas tetap diberikan dalam catatan kaki.
- issue: Makna πίστις dalam ἐν πίστει καὶ ἀληθείᾳ
  choice: iman
  alternative: kesetiaan
  rationale: '''Iman'' merupakan padanan utama yang wajar dan mempertahankan keterbukaan mengenai hubungan frasa ini dengan pelayanan Paulus. Karena πίστις juga dapat berarti ''kesetiaan'', kemungkinan itu tidak disingkirkan dan dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus, sedangkan tanda pisah mempertahankan sisipan penegas dalam teks Yunani. Susunan kalimat menjaga ketiga peran—pemberita, rasul, dan pengajar—sebagai bagian dari satu penetapan.
