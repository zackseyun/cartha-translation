  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: id
  text: Namun, ia akan diselamatkan melalui melahirkan anak[a][c], jika mereka tetap dalam iman[b], kasih, dan kekudusan dengan penguasaan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kelahiran itu.” Sebagian orang memahami frasa ini sebagai rujukan kepada suatu kelahiran tertentu, mungkin kelahiran Mesias, tetapi frasa Yunaninya juga dapat dipahami secara umum sebagai melahirkan anak.
    reason: alternative_reading
  - marker: b
    text: Kata “iman” di sini juga dapat dipahami sebagai “kesetiaan.”
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani beralih dari bentuk tunggal (“ia akan diselamatkan”) ke bentuk jamak (“jika mereka tetap”).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: akan diselamatkan
  rationale: Bentuk pasif futur dari σῴζω biasanya berarti 'menyelamatkan' dalam pemakaian Paulus. Terjemahan ini mempertahankan cakupan teologisnya tanpa mempersempitnya menjadi keselamatan jasmani saat persalinan.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras atau perkembangan ringan dari pernyataan sebelumnya; 'Namun' menyampaikannya secara wajar tanpa memperkeras pertentangan.
- source_word: διὰ τῆς τεκνογονίας
  choice: melalui proses melahirkan anak
  rationale: τεκνογονία menunjuk pada tindakan atau proses melahirkan anak. Frasa ini alami dalam bahasa Indonesia dan tetap tidak menentukan apakah yang dimaksud ialah proses melahirkan secara umum atau suatu kelahiran tertentu.
- source_word: ἐὰν
  choice: jika
  rationale: ἐάν memperkenalkan klausa bersyarat dan secara langsung diterjemahkan 'jika'.
- source_word: μείνωσιν
  choice: mereka tetap hidup
  rationale: μένω di sini menyatakan bertahan atau terus berada dalam suatu keadaan. 'Tetap hidup dalam' alami bersama rangkaian kebajikan yang mengikutinya.
- source_word: ἐν πίστει
  choice: dalam iman
  rationale: πίστις secara wajar diterjemahkan 'iman', sementara kemungkinan nuansa 'kesetiaan' dicatat dalam catatan kaki.
- source_word: ἀγάπῃ
  choice: kasih
  rationale: Terjemahan baku dan alami bagi ἀγάπη dalam konteks kebajikan Kristen.
- source_word: ἁγιασμῷ
  choice: kekudusan
  rationale: ἁγιασμός dapat berarti pengudusan atau kekudusan. 'Kekudusan' lebih alami dalam daftar kebajikan dan tidak terlalu teknis.
- source_word: μετὰ σωφροσύνης
  choice: disertai penguasaan diri
  rationale: σωφροσύνη mencakup penguasaan diri, pikiran yang sehat, dan sikap bijaksana. 'Penguasaan diri' jelas bagi pembaca modern dan sesuai dengan penekanan etis ayat ini.
theological_decisions:
- issue: Peralihan dari bentuk tunggal 'ia akan diselamatkan' ke bentuk jamak 'jika mereka tetap'
  choice: Mempertahankan peralihan gramatikal dengan 'ia' dalam klausa pertama dan 'mereka' dalam klausa berikutnya.
  alternative: Menyeragamkan keduanya sebagai 'perempuan-perempuan ... jika mereka tetap', atau memahami 'ia' sebagai Hawa dan 'mereka' sebagai perempuan pada umumnya.
  rationale: Teks Yunani sendiri beralih dari tunggal ke jamak. Mempertahankannya menjaga ciri penting sumber dan tidak menyelesaikan secara diam-diam apakah bentuk tunggal merujuk kepada perempuan dalam konteks sebelumnya, Hawa, atau sosok yang mewakili perempuan secara umum.
- issue: Makna 'diselamatkan melalui proses melahirkan anak'
  choice: Mempertahankan ungkapan tanpa menentukan apakah keselamatan itu rohani, eskatologis, keselamatan jasmani dalam persalinan, atau terkait panggilan keibuan.
  alternative: Akan dilindungi saat melahirkan; diselamatkan dengan menjalani peran sebagai ibu; diselamatkan melalui kelahiran Mesias.
  rationale: Ungkapan Yunani ini sungguh ambigu dan diperdebatkan. Teks tidak secara eksplisit mengatakan perlindungan fisik saat bersalin ataupun mengidentifikasi suatu kelahiran mesianis tertentu, sehingga terjemahan utama tidak boleh memasukkan salah satu tafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan tunggal-jamak sumber dipertahankan, sedangkan ungkapan yang sulit tidak diperjelas secara spekulatif. Semua penanda catatan kaki dicantumkan dalam teks utama.
