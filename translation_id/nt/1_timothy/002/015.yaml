  terminology: “Diselamatkan,” “iman,” “kasih,” “kekudusan,” dan “penguasaan diri” tepat untuk istilah Yunani dan register Alkitab bahasa Indonesia modern. Catatan alternatif “kelahiran itu,” nuansa “kesetiaan,” dan peralihan tunggal-jamak tetap diperlukan dan semua penandanya terpasang.
