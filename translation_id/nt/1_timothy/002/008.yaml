  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: id
  text: Karena itu, aku ingin agar para laki-laki di setiap tempat berdoa dengan mengangkat tangan yang suci, tanpa kemarahan atau pertengkaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanpa kemarahan atau keraguan.” Kata Yunani yang digunakan dapat menunjuk pada penalaran batin atau keraguan, tetapi dalam konteks ini kemungkinan besar berarti perselisihan yang bersifat bermusuhan dalam pertemuan jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: aku ingin
  rationale: Mengungkapkan kehendak atau keinginan Paulus dengan bahasa Indonesia modern dan tetap mempertahankan daya arahannya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan simpulan atau kelanjutan logis dengan pembahasan sebelumnya.
- source_word: προσεύχεσθαι
  choice: berdoa
  rationale: Padanan baku dan alami untuk tindakan berdoa; infinitif ini bergantung pada Βούλομαι.
- source_word: τοὺς ἄνδρας
  choice: para laki-laki
  rationale: ἀνήρ di sini secara khusus merujuk kepada laki-laki, bukan manusia secara umum; konteks berikutnya memberi arahan yang dibedakan kepada laki-laki dan perempuan.
- source_word: ἐν παντὶ τόπῳ
  choice: di setiap tempat
  rationale: Mempertahankan bentuk distributif frasa Yunani dan kemungkinan acuannya pada setiap tempat pertemuan.
- source_word: ἐπαίροντας
  choice: dengan mengangkat
  rationale: Partisip ini menerangkan tindakan yang menyertai doa; konstruksi 'dengan mengangkat' alami dalam bahasa Indonesia.
- source_word: ὁσίους χεῖρας
  choice: tangan yang suci
  rationale: ὅσιος menunjuk pada kesucian atau kesalehan yang berkenan kepada Allah; padanan ini mempertahankan metafora tangan tanpa menggantinya dengan gagasan lain seperti 'bersih'.
- source_word: χωρὶς ὀργῆς
  choice: tanpa kemarahan
  rationale: χωρίς menyatakan ketiadaan, sedangkan ὀργή di sini paling alami dipahami sebagai kemarahan dalam hubungan antarmanusia.
- source_word: διαλογισμοῦ
  choice: pertengkaran
  rationale: Dalam pasangan dengan 'kemarahan' dan konteks doa bersama, kata ini kemungkinan besar menunjuk pada perselisihan atau perdebatan yang bersifat bermusuhan; kemungkinan arti 'keraguan' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rujukan khusus gender dalam τοὺς ἄνδρας
  choice: para laki-laki
  alternative: orang-orang; semua orang; para suami
  rationale: Nomina ἄνδρας secara spesifik maskulin, dan konteks dekat memberi arahan berbeda kepada laki-laki dan perempuan. Terjemahan generik akan menghilangkan kekhususan teks, sedangkan arti 'suami' tidak dituntut oleh konteks.
- issue: Makna διαλογισμοῦ dalam konteks doa
  choice: pertengkaran
  alternative: perbantahan; perdebatan; keraguan
  rationale: Kaitannya dengan 'kemarahan' mendukung makna perselisihan yang mengganggu doa bersama. Namun, makna penalaran batin atau keraguan tetap mungkin secara leksikal, sehingga dicatat tanpa menghapus ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'aku' dipakai untuk suara pribadi Paulus secara alami. 'Para laki-laki' dipilih demi ketepatan gender, sedangkan 'tangan yang suci' mempertahankan citra dan ungkapan sumber.
