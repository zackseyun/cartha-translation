lexical_decisions:
- source_word: ἀλλ’
  choice: melainkan
  rationale: Menandai pertentangan dengan perhiasan lahiriah pada ayat sebelumnya dan secara alami melanjutkan pola ‘bukan ... melainkan ...’ dalam bahasa Indonesia.
- source_word: ὃ πρέπει
  choice: apa yang pantas
  rationale: Mempertahankan ungkapan relatif netral yang berarti sesuatu yang patut atau sesuai secara moral.
- source_word: γυναιξὶν
  choice: bagi perempuan
  rationale: Bentuk jamak ini merujuk secara umum kepada perempuan dalam jemaat, bukan khusus kepada istri.
- source_word: ἐπαγγελλομέναις
  choice: yang menyatakan diri
  rationale: Mengungkapkan tindakan menyatakan atau mengaku memiliki suatu komitmen, tanpa memberi kesan bahwa mereka mengucapkan nazar.
- source_word: θεοσέβειαν
  choice: berbakti kepada Allah
  rationale: Menyampaikan makna penghormatan dan pengabdian yang diarahkan kepada Allah dengan bahasa Indonesia modern yang jelas.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: melalui perbuatan-perbuatan baik
  rationale: Mempertahankan nilai instrumental atau cara dari διά dengan genitif, sambil menunjukkan bahwa perbuatan baik merupakan wujud yang sesuai dari bakti tersebut.
theological_decisions:
- issue: Hubungan ‘perbuatan-perbuatan baik’ dengan pernyataan bakti kepada Allah
  choice: Perbuatan baik disajikan sebagai wujud lahiriah yang pantas bagi perempuan yang menyatakan bakti kepada Allah.
  alternative: Perbuatan baik dipahami sebagai dasar yang menghasilkan penerimaan atau keselamatan di hadapan Allah.
  rationale: Sintaksis dan konteks mempertentangkan perhiasan lahiriah dengan perilaku yang sesuai dengan pengakuan bakti. Terjemahan tidak menambahkan pernyataan tentang jasa atau dasar keselamatan yang tidak dinyatakan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. ‘Menyatakan diri berbakti kepada Allah’ dipilih agar lebih netral daripada ‘mengaku’, yang dalam pemakaian modern dapat menyiratkan keraguan terhadap ketulusan seseorang. Struktur ayat tetap mempertahankan hubungan dengan kontras mengenai perhiasan pada ayat sebelumnya.
