base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: id
  text: Dan Adam tidak diperdaya, tetapi perempuan itu, yang telah diperdaya[a], telah jatuh ke dalam pelanggaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah diperdaya sepenuhnya”; verba Yunani di sini dapat bernuansa lebih kuat daripada verba sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah menjadi dalam pelanggaran”; bentuk perfektum Yunani dapat menekankan keadaan yang dihasilkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Nama diri ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: ἠπατήθη
  choice: tidak diperdaya
  rationale: Bentuk pasif aoris ἀπατάω diterjemahkan langsung; 'diperdaya' sesuai dengan ragam yang bermartabat dan mempertahankan gagasan penyesatan.
- source_word: γυνή
  choice: perempuan itu
  rationale: Dalam acuan kepada kisah Kejadian dan kontras dengan Adam, arti 'perempuan' lebih langsung daripada 'istri'; kata penunjuk membuat rujukan tertentu dari artikelnya jelas dalam bahasa Indonesia.
- source_word: ἐξαπατηθεῖσα
  choice: setelah diperdaya sepenuhnya
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. 'Sepenuhnya' menyampaikan kemungkinan daya penguat verba majemuk ἐξαπατάω tanpa menambahkan kesimpulan teologis.
- source_word: ἐν παραβάσει
  choice: dalam pelanggaran
  rationale: Mempertahankan nomina abstrak dan konstruksi preposisional Yunani, tanpa mengubah perempuan itu menjadi sebutan personal 'pelanggar'.
- source_word: γέγονεν
  choice: sampai berada
  rationale: Ungkapan ini menyampaikan peralihan menuju keadaan hasil yang dapat terkandung dalam bentuk perfektum γίνομαι, sekaligus lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'telah menjadi berada'.
- source_word: δὲ
  choice: tetapi
  rationale: Konjungsi ini menandai kontras antara Adam dan perempuan itu.
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan hubungan ayat ini dengan argumen sebelumnya tanpa menambahkan nuansa kesimpulan yang tidak dinyatakan.
theological_decisions:
- issue: Cara menyampaikan hubungan perempuan itu dengan pelanggaran tanpa memperluasnya menjadi kesimpulan umum tentang perempuan.
  choice: perempuan itu, setelah diperdaya sepenuhnya, sampai berada dalam pelanggaran
  alternative: perempuan itu, setelah diperdaya, menjadi seorang pelanggar
  rationale: Terjemahan pilihan mempertahankan pernyataan historis yang terkait dengan kisah Kejadian serta nomina abstrak 'pelanggaran'. Terjemahan ini tidak mengubahnya menjadi label personal atau menambahkan klaim tentang hakikat maupun kesalahan semua perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan teks Yunani, sedangkan 'sampai berada' dipilih agar gagasan peristiwa beserta keadaan hasilnya dapat dipahami secara alami.
