  naturalness: «Sampai berada dalam pelanggaran» terdengar janggal dalam bahasa Indonesia baku modern. «Telah jatuh ke dalam pelanggaran» adalah ungkapan alami, tetap menyatakan peralihan ke dalam pelanggaran, dan cocok dengan konteks alusi Kejadian.
