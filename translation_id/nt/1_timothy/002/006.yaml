  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: id
  text: yang telah memberikan diri-Nya sebagai tebusan bagi semua orang[a], kesaksian pada waktu-waktu yang tepat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi semua orang.” Ungkapan Yunani ini mempertahankan cakupan yang luas tanpa menentukan apakah yang dimaksud ialah setiap orang atau segala golongan manusia.
    reason: alternative_reading
  - marker: b
    text: Frasa Yunaninya padat. Ini dapat dipahami bahwa pemberian diri Kristus adalah kesaksian yang dinyatakan pada waktu-waktu yang tepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ἑαυτὸν
  choice: menyerahkan diri-Nya
  rationale: Ungkapan ini secara alami menyampaikan tindakan memberikan diri sendiri secara sukarela. Bentuk klausa relatif mempertahankan fungsi partisip aoris δοὺς yang menerangkan Yesus Kristus dalam ayat sebelumnya.
- source_word: ἀντίλυτρον
  choice: sebagai tebusan
  rationale: Kata ini menunjuk pada harga pembebasan dan mengandung nuansa pertukaran atau penggantian. “Tebusan” menyampaikan makna pokoknya tanpa memperluas teks menjadi rumusan teologis.
- source_word: ὑπὲρ πάντων
  choice: bagi semua orang
  rationale: ὑπέρ dapat berarti “bagi” atau “demi,” sedangkan πάντων menyatakan cakupan yang luas. “Semua orang” wajar dalam bahasa Indonesia dan tidak memutuskan perdebatan teologis mengenai cakupannya.
- source_word: τὸ μαρτύριον
  choice: kesaksian
  rationale: Nomina ini dapat berarti “kesaksian” atau “bukti.” Bentuk nominal dipertahankan karena hubungan sintaksisnya dengan klausa sebelumnya padat dan dapat dipahami secara aposisional.
- source_word: καιροῖς ἰδίοις
  choice: pada waktu-waktu yang telah ditentukan
  rationale: Bentuk jamak καιροῖς dipertahankan dengan “waktu-waktu,” sedangkan ἰδίοις dalam ungkapan ini menunjuk pada waktu yang tepat atau ditetapkan. Terjemahan ini alami dan tidak menentukan secara eksplisit siapa yang menetapkannya.
theological_decisions:
- issue: Cakupan πάντων dalam kaitannya dengan tebusan Kristus
  choice: bagi semua orang
  alternative: bagi segala macam orang; demi semua orang
  rationale: Teks memakai ungkapan universal, tetapi ayat ini sendiri tidak menyelesaikan perdebatan kemudian tentang apakah yang dimaksud ialah setiap individu atau segala golongan manusia. Terjemahan mempertahankan keluasan dan ketegangan itu.
- issue: Daya substitusioner ἀντίλυτρον
  choice: tebusan
  alternative: tebusan pengganti; tebusan sebagai ganti semua orang
  rationale: Unsur ἀντί- mengandung nuansa pertukaran atau penggantian, tetapi memasukkan “pengganti” ke dalam teks utama akan terdengar teknis dan berisiko menjadikannya penjelasan teologis. “Tebusan” mempertahankan inti citra pembebasan.
- issue: Hubungan τὸ μαρτύριον dengan penyerahan diri Kristus
  choice: Mempertahankan frasa nominal “kesaksian pada waktu-waktu yang telah ditentukan” sebagai aposisi yang padat
  alternative: penyerahan diri-Nya itu menjadi kesaksian yang dinyatakan pada waktu-waktu yang telah ditentukan
  rationale: Bahasa Yunani tidak memiliki kata kerja eksplisit dalam frasa ini. Bentuk yang padat mempertahankan kemungkinan bahwa penyerahan diri Kristus itu sendiri adalah kesaksian atau bahwa kesaksian tentangnya dinyatakan pada waktu yang ditetapkan, tanpa diam-diam memilih salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Menyerahkan diri-Nya” dipilih sebagai ungkapan alami untuk tindakan sukarela. Susunan nominal pada bagian akhir sengaja dipertahankan agak padat untuk menjaga ambiguitas sintaksis teks Yunani; catatan kaki membantu pembaca tanpa memasukkan kata kerja tersirat ke dalam teks utama.
