  text: Sebab Adam lebih dahulu dibentuk[a], kemudian Hawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dijadikan.” Kata kerja Yunani ini dapat berarti membentuk atau menjadikan, dan menggemakan bahasa pembentukan dalam kisah penciptaan di Kitab Kejadian.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari pernyataan sebelumnya dan mempertahankan daya penjelas teks Yunani.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Menggunakan bentuk baku nama diri ini dalam bahasa Indonesia.
- source_word: πρῶτος
  choice: lebih dahulu
  rationale: Dalam kaitannya dengan «kemudian Hawa», frasa ini menyatakan urutan waktu secara alami dan jelas dalam bahasa Indonesia.
- source_word: ἐπλάσθη
  choice: dibentuk
  rationale: Bentuk pasif ini mempertahankan gambaran membentuk atau menjadikan suatu rupa serta menggemakan bahasa pembentukan dalam kisah penciptaan di Kitab Kejadian; maknanya lebih khusus daripada «diciptakan».
- source_word: εἶτα
  choice: kemudian
  rationale: Menandai urutan waktu berikutnya secara sederhana dan wajar.
- source_word: Εὕα
  choice: Hawa
  rationale: Menggunakan bentuk baku tradisional nama diri ini dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan dengan urutan penciptaan dalam Kitab Kejadian di tengah perdebatan tentang pelayanan dan peran
  choice: 'Menerjemahkan ayat ini sebagai pernyataan sederhana tentang urutan waktu: Adam dibentuk lebih dahulu, kemudian Hawa.'
  alternative: Memasukkan ke dalam terjemahan kesimpulan mengenai wewenang atau perbedaan peran.
  rationale: Teks Yunani ayat ini sendiri hanya menyatakan urutan pembentukan dan tidak secara eksplisit merumuskan kesimpulan teologisnya. Terjemahan tidak menambahkan implikasi doktrinal yang melampaui kata-kata ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Partikel penegas «-lah» membantu menunjukkan kontras urutan antara Adam dan Hawa tanpa menambahkan gagasan tentang kedudukan atau wewenang.
