language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: id
  text: Namun, aku tidak mengizinkan seorang perempuan mengajar atau menjalankan wewenang atas seorang laki-laki[a][b]. Sebaliknya, ia harus berada dalam ketenangan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang istri ... suaminya”. Kata-kata Yunani yang dipakai dapat berarti “perempuan/laki-laki” secara umum atau “istri/suami” dalam hubungan perkawinan.
    reason: alternative_reading
  - marker: b
    text: Atau “memegang wewenang atas”; mungkin “menguasai secara sewenang-wenang”. Verba Yunani ini jarang dipakai dan nuansanya diperdebatkan.
    reason: lexical_alternative
  - marker: c
    text: Atau “berdiam diri” atau “dalam keheningan”. Kata Yunani ini dapat menunjuk pada ketenangan, sikap tidak gaduh, atau keheningan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: mengajar
  rationale: Infinitif ini menjadi pelengkap langsung bagi ἐπιτρέπω dan secara wajar diterjemahkan dengan verba sederhana “mengajar” tanpa menambahkan penandaan aspek yang tidak diperlukan dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang bersifat kontras dari petunjuk sebelumnya. “Namun” mempertahankan kontras ringan itu dalam ragam Indonesia modern yang bermartabat.
- source_word: γυναικί
  choice: seorang perempuan
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Konteks 2:9–15 lebih luas daripada relasi perkawinan, sehingga makna umum dipakai dalam teks utama, sementara kemungkinan makna perkawinan dicatat dalam catatan kaki.
- source_word: οὐκ ἐπιτρέπω
  choice: aku tidak mengizinkan
  rationale: Bentuk kini indikatif paling alami dipahami sebagai pernyataan kini yang umum. “Tidak mengizinkan” menyampaikan arti verba dengan jelas dan wajar.
- source_word: οὐδὲ
  choice: atau
  rationale: οὐδέ menghubungkan infinitif terlarang yang kedua dengan yang pertama di bawah satu negasi. Dalam susunan bahasa Indonesia “tidak mengizinkan ... atau ...”, kata “atau” merupakan penghubung yang paling alami.
- source_word: αὐθεντεῖν
  choice: menjalankan wewenang atas
  rationale: Verba langka ini berkaitan dengan penggunaan atau pemegangan otoritas, tetapi nuansanya diperdebatkan. “Menjalankan wewenang atas” mempertahankan arti otoritas yang relatif netral tanpa dengan sendirinya menyiratkan tindakan sewenang-wenang.
- source_word: ἀνδρός
  choice: seorang laki-laki
  rationale: ἀνήρ dapat berarti “laki-laki” atau “suami”. Konteks yang lebih luas mendukung makna umum sebagai teks utama, sedangkan kemungkinan makna “suami” dipertahankan dalam catatan kaki.
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: ἀλλά memperkenalkan sikap positif yang dikontraskan dengan larangan sebelumnya. “Sebaliknya” menandai hubungan ini secara jelas.
- source_word: εἶναι
  choice: ia harus bersikap
  rationale: Infinitif ini bergantung pada struktur sebelumnya. Ungkapan “ia harus bersikap” membuat tuntutan positif tersebut alami dalam bahasa Indonesia tanpa mengubah subjeknya.
- source_word: ἐν ἡσυχίᾳ
  choice: bersikap tenang
  rationale: ἡσυχία dapat menunjuk pada ketenangan, sikap tidak gaduh, atau keheningan. “Bersikap tenang” menjaga cakupan yang lebih luas dan tidak langsung menuntut kebisuan mutlak.
theological_decisions:
- issue: Makna αὐθεντεῖν dalam teks gerejawi yang diperdebatkan
  choice: menjalankan wewenang atas
  alternative: memegang wewenang atas; menguasai secara sewenang-wenang
  rationale: Verba αὐθεντέω jarang ditemukan dan nuansanya diperdebatkan. Terjemahan utama memakai ungkapan otoritas yang netral, tidak memasukkan nuansa penyalahgunaan yang tidak diwajibkan oleh sintaksis, sementara pilihan penting lainnya dicatat agar ketegangan penafsirannya tetap terlihat.
- issue: Apakah γυνή dan ἀνήρ berarti perempuan/laki-laki atau istri/suami
  choice: seorang perempuan ... seorang laki-laki
  alternative: seorang istri ... suaminya
  rationale: Kedua nomina dapat mempunyai makna umum maupun makna perkawinan. Konteks membicarakan perempuan secara lebih luas dan tidak memiliki penanda perkawinan yang eksplisit dalam klausa ini. Karena itu makna umum dipilih dalam teks utama, tetapi alternatif perkawinan tetap disediakan.
- issue: Cakupan ἡσυχία
  choice: bersikap tenang
  alternative: berdiam diri; dalam keheningan
  rationale: Kata ini dapat menunjuk pada ketenangan atau keheningan menurut konteks. “Bersikap tenang” menghindari keputusan bahwa yang dimaksud pasti kebisuan mutlak, dan alternatif yang lebih kuat dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina “aku” mempertahankan bentuk orang pertama tunggal Paulus secara alami; “bersikap tenang” dipilih daripada bentuk yang dapat menyiratkan kebisuan mutlak. Semua ketidakpastian leksikal utama dipertahankan melalui catatan kaki.
