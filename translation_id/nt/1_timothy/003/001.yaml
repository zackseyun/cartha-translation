  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: id
  text: 'Perkataan ini dapat dipercaya: Jika seseorang bercita-cita untuk menjalankan pengawasan[a], ia menginginkan suatu pekerjaan yang baik[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jabatan penilik”; secara tradisional, “jabatan uskup.”
    reason: alternative_reading
  - marker: b
    text: Atau, “suatu tugas yang mulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Perkataan ini dapat dipercaya
  rationale: Ungkapan ini merupakan formula yang menyatakan bahwa perkataan yang diperkenalkan layak dipercaya. “Perkataan” lebih alami daripada “firman” dalam konteks ini dan tidak memberi kesan bahwa λόγος merupakan gelar.
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: τις adalah kata ganti tak tentu yang bersifat umum; “seseorang” menerjemahkan bentuk Yunani tanpa memasukkan pembatasan gender yang tidak dinyatakan oleh frasa ini sendiri.
- source_word: ἐπισκοπῆς
  choice: menjadi penilik
  rationale: Nomina ini menunjuk pada fungsi atau tanggung jawab pengawasan yang dijalankan seorang ἐπίσκοπος. Dalam bahasa Indonesia, “menjadi penilik” mengungkapkan peran itu secara wajar tanpa memakai istilah struktur gerejawi yang berkembang kemudian.
- source_word: ὀρέγεται
  choice: ingin
  rationale: Kata ini menggambarkan mengarahkan diri atau bercita-cita kepada sesuatu. “Ingin” jelas dan alami dalam konstruksi Indonesia, sedangkan nuansa peran yang dituju disampaikan oleh “menjadi penilik”.
- source_word: καλοῦ ἔργου
  choice: suatu pekerjaan yang baik
  rationale: Terjemahan ini mempertahankan unsur ἔργον sebagai pekerjaan, bukan sekadar kedudukan, dan menerjemahkan καλός secara langsung sebagai “baik”.
- source_word: ἐπιθυμεῖ
  choice: ia menginginkan
  rationale: Kata ini berarti menginginkan atau merindukan. “Menginginkan” mempertahankan kesejajaran dengan keinginan pada klausa pertama tanpa memperkuat intensitasnya secara berlebihan.
theological_decisions:
- issue: Apakah ἐπισκοπῆς harus diterjemahkan dengan istilah jabatan gerejawi yang muncul kemudian
  choice: menjadi penilik
  alternative: jabatan penilik; keuskupan
  rationale: Pilihan ini mempertahankan hubungan dengan ἐπίσκοπος dalam ayat berikut dan menyampaikan fungsi pengawasan tanpa memasukkan struktur episkopal dari masa yang lebih kemudian.
- issue: Apakah εἴ τις harus diterjemahkan secara khusus laki-laki
  choice: Jika seseorang
  alternative: Jika seorang laki-laki
  rationale: Kata ganti tak tentu τις pada frasa ini bersifat umum. Terjemahan tidak boleh memasukkan pembatasan gender dari frasa tersebut sendiri; kualifikasi dalam konteks selanjutnya tetap harus diterjemahkan menurut bentuk dan maknanya masing-masing.
- issue: Apakah καλὸν ἔργον menunjuk pada status terhormat atau pekerjaan yang dilakukan
  choice: suatu pekerjaan yang baik
  alternative: suatu tugas yang mulia
  rationale: Kata ἔργον menekankan pekerjaan atau karya. Terjemahan utama mempertahankan hal itu, sementara kemungkinan nuansa καλός sebagai “mulia” dicatat tanpa mengubahnya menjadi penekanan pada pangkat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Penilik” dipilih karena dapat dipahami sebagai orang yang mengawasi dan tidak sekuat “uskup” dalam membawa struktur gerejawi dari masa kemudian. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
