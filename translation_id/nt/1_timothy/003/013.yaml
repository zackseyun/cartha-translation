  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: id
  text: Sebab mereka yang telah melayani dengan baik memperoleh bagi diri mereka sendiri kedudukan yang baik dan keberanian besar[a] dalam iman[b] kepada Mesias Yesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keyakinan besar”; kata Yunani ini dapat berarti keberanian, keyakinan, atau keterusterangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam kesetiaan kepada Mesias Yesus.” Kata Yunani πίστις dapat berarti iman, kepercayaan, atau kesetiaan.
    reason: alternative_reading
  - marker: c
    text: Yunani “Kristus”; di sini diterjemahkan “Mesias” karena istilah itu berfungsi sebagai gelar.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: telah melayani
  rationale: Partisip aoris ini merujuk kepada orang-orang yang dibahas dalam konteks pelayan jemaat, tetapi verba itu sendiri berarti melayani. Pilihan ini mempertahankan makna tindakan tanpa memasukkan nama jabatan ke dalam verba.
- source_word: καλῶς
  choice: dengan baik
  rationale: Adverbia ini menerangkan tindakan melayani; terjemahan ini lugas dan alami dalam bahasa Indonesia.
- source_word: βαθμὸν ... καλὸν
  choice: kedudukan yang baik
  rationale: βαθμός secara harfiah dapat berarti langkah, tingkat, atau kedudukan. Dalam konteks ini ungkapan tersebut menunjuk pada kedudukan terhormat yang diperoleh melalui pelayanan yang baik tanpa harus menyatakan pangkat gerejawi.
- source_word: περιποιοῦνται
  choice: memperoleh bagi diri mereka sendiri
  rationale: Bentuk medialnya memiliki daya refleksif; frasa ini mempertahankan unsur bahwa hasil tersebut mereka peroleh bagi diri sendiri.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Kata ini dapat menyatakan keberanian, keyakinan, atau keterusterangan. 'Keberanian' mempertahankan kekuatan istilah tersebut, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: πίστει
  choice: iman
  rationale: Dalam konteks ini 'iman' merupakan padanan utama yang wajar, sambil tetap mengakui bahwa πίστις juga dapat berarti kesetiaan.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: yang ada dalam Mesias Yesus
  rationale: Artikel dan frasa preposisional ini menerangkan 'iman'. Susunan tersebut dipertahankan agar hubungan gramatikalnya tidak diratakan.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga 'Mesias' menyampaikan makna gelar itu secara langsung.
theological_decisions:
- issue: Makna πίστις dalam ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: iman
  alternative: kesetiaan
  rationale: '''Iman'' paling alami sebagai bacaan utama dalam konteks ini, tetapi kemungkinan makna ''kesetiaan'' benar-benar ada secara leksikal dan karena itu dipertahankan dalam catatan kaki, bukan diselesaikan secara dogmatis.'
- issue: Rujukan βαθμὸν καλὸν
  choice: kedudukan yang baik
  alternative: tingkat yang baik
  rationale: Ungkapan Yunani dapat memunculkan citra tingkat atau langkah, tetapi konteks tidak memastikan kenaikan pangkat atau jenjang jabatan. 'Kedudukan' menyampaikan status terhormat tanpa menambahkan struktur gerejawi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur sebab-akibat, daya refleksif verba medial, dan hubungan frasa 'yang ada dalam Mesias Yesus' dengan 'iman' dipertahankan. Ambiguitas leksikal utama dijelaskan dalam catatan kaki.
