  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: id
  text: Demikian juga, para diaken haruslah terhormat, tidak bercabang lidah[a], tidak suka minum banyak anggur[b], dan tidak tamak akan keuntungan yang memalukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mengatakan satu hal kepada seseorang dan hal lain kepada orang lain.”
