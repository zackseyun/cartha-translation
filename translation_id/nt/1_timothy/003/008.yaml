  - marker: b
    text: Atau “tidak melekat pada banyak anggur.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak mengejar keuntungan yang kotor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: para diaken
  rationale: Dalam daftar syarat yang sejajar dengan para penilik jemaat pada ayat-ayat sebelumnya, kata ini menunjuk pada peran pelayanan yang diakui dalam jemaat. “Para diaken” mempertahankan kekhususan konteks tersebut tanpa menjabarkan struktur gerejawi yang lebih kemudian.
- source_word: ὡσαύτως
  choice: demikian juga
  rationale: Menandai kesinambungan dengan syarat-syarat bagi para penilik jemaat sekaligus memperkenalkan kelompok berikutnya secara alami dalam bahasa Indonesia.
- source_word: σεμνούς
  choice: terhormat
  rationale: Mengungkapkan pembawaan yang patut dihormati dan bermartabat tanpa memberi kesan muram atau kaku.
- source_word: μὴ διλόγους
  choice: tidak bercabang lidah
  rationale: Mempertahankan gambaran kuat dari ungkapan Yunani tentang perkataan yang mendua, yakni mengatakan hal yang berbeda kepada orang yang berbeda.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: tidak menggemari banyak anggur
  rationale: Menggambarkan keterikatan atau perhatian yang terus-menerus kepada banyak anggur tanpa memasukkan kategori klinis modern; unsur πολλῷ tetap dinyatakan dengan “banyak”.
- source_word: μὴ αἰσχροκερδεῖς
  choice: tidak tamak akan keuntungan yang hina
  rationale: Menyampaikan hasrat akan keuntungan yang diperoleh atau dikejar dengan cara tercela, sambil mempertahankan bobot moral kata majemuk Yunani tersebut.
theological_decisions:
- issue: Istilah jabatan jemaat untuk διάκονος
  choice: Diterjemahkan “para diaken” sebagai sebutan peran pelayanan jemaat
  alternative: para pelayan; para abdi
  rationale: Konteksnya adalah daftar syarat bagi peran-peran yang diakui dalam jemaat, mula-mula penilik jemaat lalu diaken. Pilihan ini menjaga konteks kelembagaan tanpa memasukkan rincian struktur denominasi yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Idiom “bercabang lidah” dipertahankan karena hidup dalam bahasa Indonesia dan mencerminkan kelugasan ungkapan sumber; catatan kaki menjelaskan maknanya. Susunan daftar dibuat sejajar dan alami.
