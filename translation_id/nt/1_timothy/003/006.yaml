  terminology: “Congkak,” “penghakiman,” dan “Iblis” sesuai dengan register serta mempertahankan nuansa sumber. Catatan kaki perlu memperbaiki idiom “ke bawah penghakiman” menjadi “di bawah penghakiman.”
