  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: id
  text: Ia tidak boleh baru menjadi orang percaya, supaya ia tidak menjadi congkak lalu jatuh ke dalam penghakiman Iblis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatuh ke dalam hukuman yang sama seperti Iblis”; kemungkinan lain, “jatuh di bawah penghakiman yang berkaitan dengan Iblis.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: seorang yang baru beriman
  rationale: Secara harfiah berarti “baru ditanam” dan secara kiasan menunjuk kepada orang yang baru masuk ke dalam iman. Pilihan ini menyampaikan makna gerejawi dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τυφωθεὶς
  choice: menjadi congkak
  rationale: Kata ini menggambarkan keadaan membusungkan diri karena kesombongan. “Menjadi congkak” menyampaikan peringatan moral itu secara alami dan bermartabat.
- source_word: κρίμα
  choice: penghakiman
  rationale: Kata ini dapat berarti “penghakiman” atau “hukuman”. “Penghakiman” mempertahankan cakupan maknanya dan tidak menentukan hasil penghakiman secara berlebihan.
- source_word: τοῦ διαβόλου
  choice: Iblis
  rationale: Bentuk genitif Yunani bersifat ambigu. Frasa “penghakiman Iblis” mempertahankan kemungkinan bahwa yang dimaksud adalah penghakiman yang dialami Iblis atau penghakiman yang berkaitan dengan Iblis.
- source_word: ἐμπέσῃ
  choice: jatuh ke dalam
  rationale: Pilihan ini mempertahankan metafora masuk ke dalam keadaan atau akibat yang berbahaya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Ungkapan ini menyampaikan maksud atau akibat yang hendak dihindari dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna frasa εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: jatuh ke dalam penghakiman Iblis
  alternative: jatuh ke dalam hukuman yang sama seperti Iblis; atau jatuh ke bawah penghakiman yang berkaitan dengan Iblis
  rationale: Genitif τοῦ διαβόλου dapat menunjuk kepada penghakiman yang dijatuhkan atas Iblis atau, secara lebih umum, kepada penghakiman yang berkaitan dengan Iblis. Teks utama mempertahankan ketegangan ini tanpa menetapkan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan alur larangan, alasan, dan akibat dari teks Yunani. Penanda catatan kaki ditempatkan pada frasa yang memang memiliki ambiguitas.
