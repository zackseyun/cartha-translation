id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: id
  text: Karena itu, seorang penilik jemaat harus tidak bercela, suami dari satu istri[a], berpikiran jernih, dapat mengendalikan diri, berperilaku pantas, suka menerima tamu, dan cakap mengajar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang laki-laki dari satu perempuan”; ungkapan ini mungkin menekankan kesetiaan dalam perkawinan, bukan hanya status perkawinan.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan dalam daftar persyaratan, bukan sekadar anjuran.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan hubungan kesimpulan dengan pembahasan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐπίσκοπον
  choice: penilik jemaat
  rationale: Menerjemahkan fungsi jabatan secara transparan tanpa memasukkan istilah gerejawi yang berkembang kemudian; penambahan 'jemaat' memperjelas konteks.
- source_word: ἀνεπίλημπτον
  choice: tidak bercela
  rationale: Menunjukkan bahwa tidak ada dasar sah untuk menuduhnya, tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: suami dari satu istri
  rationale: Dekat dengan bentuk Yunani, mempertahankan penyebutan laki-laki secara eksplisit, dan tidak menutup berbagai kemungkinan penafsiran ungkapan tersebut.
- source_word: νηφάλιον
  choice: dapat mengendalikan diri
  rationale: Mengungkapkan sikap waspada dan terkendali, bukan hanya pantang minuman keras.
- source_word: σώφρονα
  choice: bijaksana
  rationale: Menyampaikan pertimbangan sehat dan perilaku yang teratur, sekaligus membedakannya dari sifat pengendalian diri pada νηφάλιον.
- source_word: κόσμιον
  choice: berperilaku pantas
  rationale: Mengungkapkan tata perilaku yang baik dan terhormat dalam bahasa Indonesia modern.
- source_word: φιλόξενον
  choice: suka menerima tamu
  rationale: Secara alami menyampaikan keramahtamahan, termasuk kesediaan menyambut orang lain.
- source_word: διδακτικόν
  choice: cakap mengajar
  rationale: Menunjukkan kemampuan atau kecakapan mengajar, bukan sekadar kesediaan.
theological_decisions:
- issue: Penafsiran μιᾶς γυναικὸς ἄνδρα dalam persyaratan penilik jemaat
  choice: suami dari satu istri
  alternative: laki-laki yang setia kepada satu perempuan; setia kepada istrinya
  rationale: Ungkapan ini dapat dipahami sebagai penekanan pada kesetiaan perkawinan, larangan poligami, atau pembatasan tertentu mengenai perkawinan kembali. Terjemahan utama mempertahankan bentuk yang relatif harfiah, sedangkan catatan kaki menjaga ambiguitas penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Daftar sifat dibuat ringkas dan alami; istilah jabatan diterjemahkan menurut fungsinya. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkan.
