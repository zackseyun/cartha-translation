id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: id
  text: Demikian juga, para perempuan haruslah terhormat[a], bukan pemfitnah, mampu menguasai diri, dan setia dalam segala hal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikian juga, para istri haruslah terhormat ….” Kata Yunani yang dipakai dapat berarti “perempuan” atau “istri” dalam konteks ini; teks tidak secara eksplisit mengatakan “istri mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: para perempuan
  rationale: Bentuk jamak ini dapat berarti 'perempuan' atau 'istri'. Karena teks Yunani tidak memakai kata sandang maupun penanda kepunyaan seperti 'mereka', pilihan utama 'para perempuan' tidak menambahkan hubungan yang tidak dinyatakan; kemungkinan 'para istri' dipertahankan dalam catatan kaki.
- source_word: ὡσαύτως
  choice: demikian juga
  rationale: Ungkapan ini mempertahankan kaitan struktural dengan daftar persyaratan sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: σεμνάς
  choice: terhormat
  rationale: Kata ini menunjuk pada watak yang patut dihormati, bermartabat, dan memiliki kesungguhan moral; 'terhormat' ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: μὴ διαβόλους
  choice: bukan pemfitnah
  rationale: Dalam konteks ini διάβολος berfungsi sebagai sebutan sifat bagi orang yang memfitnah atau menuduh dengan jahat, bukan sebagai gelar 'Iblis'.
- source_word: νηφαλίους
  choice: mampu menguasai diri
  rationale: Kata ini mencakup kewaspadaan, ketenangan, dan pengendalian diri. Ungkapan ini menyampaikan sifat etisnya secara jelas tanpa membatasinya pada tidak mabuk secara harfiah.
- source_word: πιστὰς
  choice: setia
  rationale: Kata πιστός dapat menyatakan kesetiaan sekaligus sifat dapat dipercaya. 'Setia' mempertahankan hubungan leksikal dengan rumpun kata iman/kesetiaan dan sesuai dengan daftar kebajikan ini.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Terjemahan ini mempertahankan cakupan luas frasa Yunani tanpa mempersempit bidang kesetiaan yang dimaksud.
theological_decisions:
- issue: Rujukan γυναῖκας dalam daftar persyaratan pelayanan
  choice: para perempuan
  alternative: para istri
  rationale: Ayat ini dapat merujuk kepada perempuan dalam suatu peran pelayanan atau kepada istri para diaken. Karena γυνή dapat berarti 'perempuan' maupun 'istri', sedangkan teks tidak mengatakan 'istri mereka', teks utama dibiarkan luas dan pembacaan alternatif dicatat agar ketegangan penafsiran tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan daftar dibuat alami dengan konjungsi sebelum unsur terakhir; ambiguitas utama pada γυναῖκας dipertahankan melalui catatan kaki.
