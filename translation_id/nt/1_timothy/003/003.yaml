lexical_decisions:
- source_word: πάροινον
  choice: bukan pemabuk
  rationale: Istilah ini menunjuk kepada orang yang gemar atau kecanduan anggur dan biasa dikuasai kemabukan. 'Bukan pemabuk' ringkas, alami, dan menyatakan kecenderungan hidup, bukan sekadar satu tindakan.
- source_word: πλήκτην
  choice: bukan orang yang suka melakukan kekerasan
  rationale: Secara harfiah istilah ini dapat berarti orang yang memukul. Ungkapan ini mempertahankan unsur agresi fisik sekaligus menyampaikan sifat keras yang dimaksud dalam daftar persyaratan ini.
- source_word: ἐπιεικῆ
  choice: lemah lembut
  rationale: Kata ini mencakup sikap lembut, tenggang rasa, dan tidak bersikeras menuntut hak. 'Lemah lembut' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks watak seorang penilik.
- source_word: ἄμαχον
  choice: suka damai
  rationale: Istilah ini berarti tidak suka berkelahi atau bertengkar. 'Suka damai' menyatakannya sebagai sifat positif dan selaras dengan bentuk ringkas daftar ini.
- source_word: ἀφιλάργυρον
  choice: tidak cinta uang
  rationale: Kata majemuk ini secara langsung menyangkal kecintaan kepada uang. Padanan ini mempertahankan fokus pada keterikatan batin, bukan hanya tindakan serakah.
