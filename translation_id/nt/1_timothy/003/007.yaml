  to: Selain itu, ia harus mendapat kesaksian yang baik dari orang-orang luar[a], agar ia tidak menanggung celaan[b] dan jatuh ke dalam jerat Iblis[c].
  rationale: Revisi memperbaiki kelaziman sintaksis Indonesia pada dua titik tanpa mengubah rujukan atau daya semantis teks Yunani. “Mendapat kesaksian yang baik dari orang-orang luar” menyatakan penilaian baik yang berasal dari pihak luar; “menanggung celaan dan jatuh ke dalam jerat Iblis” mengungkapkan dua akibat yang hendak dihindari secara alami. Semua jangkar catatan kaki dipertahankan dan disesuaikan dengan teks revisi.
