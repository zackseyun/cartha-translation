  naturalness: “Orang-orang di luar” terdengar tidak lengkap dalam bahasa Indonesia modern tanpa pelengkap tersurat, sedangkan “orang-orang luar” idiomatis. “Mendapat kesaksian yang baik” dan “menanggung celaan” juga lebih alami dalam register baku yang tetap sesuai untuk terjemahan Alkitab.
  terminology: “Kesaksian,” “celaan,” “jerat,” dan “Iblis” mempertahankan istilah serta citra penting dari teks sumber. Catatan alternatif untuk διάβολος dipertahankan tanpa menjadikan pembacaan alternatif itu sebagai teks utama.
