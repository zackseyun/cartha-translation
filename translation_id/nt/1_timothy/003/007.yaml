id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: id
  text: Selain itu, ia harus mendapat kesaksian yang baik dari orang-orang luar[a], agar ia tidak menanggung celaan[b] dan jatuh ke dalam jerat Iblis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari mereka yang berada di luar.” Ungkapan ini menunjuk kepada orang-orang di luar komunitas Kristen.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengalami kehinaan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “jerat si pemfitnah,” jika διάβολος dipahami dalam arti yang lebih umum; di sini kata itu dipahami sebagai “Iblis.”
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: harus
  rationale: Menyatakan keharusan dalam persyaratan bagi seorang penilik dan mempertahankan daya wajib dari bentuk Yunani.
- source_word: δὲ καὶ
  choice: Selain itu
  rationale: Menghubungkan ayat ini dengan daftar sebelumnya sekaligus menambahkan satu persyaratan lagi dalam bahasa Indonesia yang alami.
- source_word: μαρτυρίαν καλὴν
  choice: kesaksian yang baik
  rationale: Cukup dekat dengan makna dasar Yunani, yaitu kesaksian atau laporan yang baik, tanpa langsung mempersempitnya menjadi sekadar reputasi.
- source_word: ἔχειν
  choice: memiliki
  rationale: Menyampaikan makna kepemilikan secara jelas dan wajar dalam ragam Indonesia baku.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: dari orang-orang di luar
  rationale: Mempertahankan ungkapan Yunani dan tidak menambahkan kata 'gereja' yang hanya tersirat dari konteks.
- source_word: ἵνα μὴ
  choice: supaya ia jangan
  rationale: Mengungkapkan tujuan atau hasil yang hendak dihindari tanpa memaksakan salah satu nuansa sintaksis.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: jatuh ke dalam celaan
  rationale: Mempertahankan metafora 'jatuh ke dalam' serta dimensi penghinaan atau kecaman publik dari ὀνειδισμός.
- source_word: παγίδα
  choice: jerat
  rationale: Menjaga metafora perangkap dan gema diksi Alkitabiah dengan tetap mudah dipahami.
- source_word: τοῦ διαβόλου
  choice: Iblis
  rationale: Dalam konteks Perjanjian Baru, bentuk ini paling wajar dipahami sebagai sebutan bagi pribadi jahat, yakni Iblis; hubungan genitif dinyatakan secara alami sebagai 'jerat Iblis'.
theological_decisions:
- issue: Makna τοῦ διαβόλου
  choice: 'Iblis sebagai pribadi jahat: ''jerat Iblis'''
  alternative: '''jerat si pemfitnah'' atau jerat yang berkaitan dengan fitnah'
  rationale: διάβολος dapat secara leksikal berarti 'pemfitnah', tetapi pemakaian dengan artikel dan kebiasaan Perjanjian Baru, termasuk Surat-Surat Pastoral, lebih mendukung rujukan kepada Iblis. Alternatif leksikal tetap dicatat agar ketegangan penafsiran tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. 'Selain itu' memberi hubungan yang alami dengan persyaratan sebelumnya; 'kesaksian yang baik', 'orang-orang di luar', dan 'jatuh ke dalam celaan' mempertahankan kedekatan dengan bentuk Yunani, sedangkan catatan kaki menjelaskan alternatif yang lebih idiomatis.
