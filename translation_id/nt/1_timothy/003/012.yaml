  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: id
  text: Para diaken haruslah suami dari satu istri[a], yang memimpin anak-anak dan rumah tangga mereka sendiri dengan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “laki-laki yang setia kepada satu perempuan.” Ungkapan ini mungkin menekankan kesetiaan dalam perkawinan; sebagian orang memahaminya secara lebih khusus sebagai larangan berpoligami atau menikah kembali.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: para diaken
  rationale: Dalam konteks persyaratan jabatan jemaat, istilah ini menunjuk pada peran yang diakui, bukan sekadar pelayan secara umum.
- source_word: ἔστωσαν
  choice: haruslah
  rationale: Bentuk imperatif ini menyatakan tuntutan normatif; 'haruslah' alami dan tetap bermartabat dalam daftar persyaratan.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: suami dari satu istri
  rationale: Terjemahan dekat ini mempertahankan bahasa laki-laki dalam teks Yunani serta ambiguitas ungkapan itu, tanpa membatasinya hanya pada kesetiaan, monogami, atau riwayat satu kali menikah.
- source_word: τέκνων
  choice: anak-anak
  rationale: Kepemilikan dipahami dari konteks dan konstruksi paralel dengan rumah tangga mereka sendiri.
- source_word: καλῶς
  choice: dengan baik
  rationale: Padanan langsung dan alami bagi adverbia yang menerangkan tindakan mengurus.
- source_word: προϊστάμενοι
  choice: yang mengurus
  rationale: Dalam konteks keluarga, 'mengurus' menyampaikan tanggung jawab memimpin dan mengelola tanpa konotasi otoriter yang berlebihan.
- source_word: τῶν ἰδίων οἴκων
  choice: rumah tangga mereka sendiri
  rationale: Istilah οἶκος menunjuk pada satuan rumah tangga, bukan hanya bangunan rumah atau keluarga dalam arti sempit.
theological_decisions:
- issue: Makna μιᾶς γυναικὸς ἄνδρες sebagai persyaratan jabatan jemaat
  choice: suami dari satu istri
  alternative: laki-laki yang setia kepada satu perempuan; suami yang setia kepada istrinya; laki-laki yang hanya pernah menikah satu kali
  rationale: Ungkapan Yunani ini ringkas dan dapat dipahami sebagai penekanan pada kesetiaan perkawinan, monogami, atau pembatasan tertentu terkait pernikahan kembali. Teks utama mempertahankan bentuk yang dekat dengan sumber, sedangkan catatan menyatakan rentang penafsirannya tanpa menetapkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada normatif dan bermartabat. Istilah 'diaken' dipakai sebagai nama jabatan gerejawi yang lazim. Susunan kalimat dibuat alami sambil mempertahankan ambiguitas utama teks sumber.
