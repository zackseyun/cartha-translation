  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: id
  text: Ia harus mengelola rumah tangganya sendiri dengan baik[a] dan mempunyai anak-anak yang hidup dalam ketundukan dengan segala kesopanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memimpin rumah tangganya sendiri dengan baik” atau “mengepalai rumah tangganya sendiri dengan baik.”
    reason: lexical_alternative
  - marker: b
    text: Frasa “dengan segala kesopanan” dapat menerangkan cara anak-anak hidup dalam ketundukan atau, secara lebih luas, cara ia mengelola rumah tangganya. Kata Yunaninya juga dapat diterjemahkan “dengan penuh martabat” atau “dengan segala kepatutan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: rumah tangganya sendiri
  rationale: οἶκος di sini menunjuk pada rumah tangga atau keluarga sebagai lingkungan yang berada di bawah tanggung jawabnya; bentuk ini juga mempertahankan penekanan ἰδίου, 'sendiri'.
- source_word: καλῶς
  choice: dengan baik
  rationale: Ungkapan ini secara alami menyatakan mutu pelaksanaan kepemimpinan rumah tangga tanpa mempersempitnya hanya pada kecakapan atau kepatutan.
- source_word: προϊστάμενον
  choice: memimpin
  rationale: προΐστημι menyatakan tindakan berdiri di depan, memimpin, atau mengelola dengan tanggung jawab nyata. 'Memimpin' terdengar alami dalam bahasa Indonesia dan tidak sekeras 'memerintah'.
- source_word: τέκνα ἔχοντα ἐν ὑποταγῇ
  choice: menjaga agar anak-anaknya tunduk
  rationale: Secara harfiah konstruksi ini berarti 'mempunyai anak-anak dalam ketundukan'. Bentuk idiomatis Indonesia ini mempertahankan tanggung jawab orang tua serta gagasan ὑποταγή tentang ketundukan, bukan sekadar pengendalian lahiriah.
- source_word: μετὰ πάσης σεμνότητος
  choice: dengan penuh kewibawaan
  rationale: σεμνότης mencakup martabat, kesungguhan, kehormatan, dan sikap yang patut dihormati. 'Kewibawaan' paling alami dalam konteks kepemimpinan rumah tangga, sementara catatan kaki mempertahankan ketidakpastian mengenai kaitan sintaksis frasa tersebut.
theological_decisions:
- issue: Cakupan bahasa kepemimpinan rumah tangga
  choice: Ayat ini menyatakan bahwa calon penilik harus menjalankan kepemimpinan yang bertanggung jawab dalam rumah tangganya.
  alternative: Membacanya sebagai pernyataan umum yang lebih keras tentang kekuasaan patriarkal, atau melemahkannya menjadi pengasuhan tanpa wewenang.
  rationale: προϊστάμενον dan ὑποταγή menunjukkan adanya kepemimpinan serta tatanan nyata, tetapi konteksnya adalah persyaratan bagi seorang penilik, bukan uraian lengkap tentang seluruh struktur keluarga.
- issue: Kaitan frasa μετὰ πάσης σεμνότητος
  choice: Terjemahan utama menempatkannya setelah keseluruhan ungkapan mengenai ketundukan anak-anak tanpa menyatakan secara mutlak siapa yang menunjukkan kewibawaan tersebut.
  alternative: Frasa itu secara khusus menerangkan sikap anak-anak dalam ketundukan, atau secara lebih luas menerangkan cara sang ayah memimpin rumah tangga.
  rationale: Susunan Yunani memungkinkan lebih dari satu kaitan sintaksis. Catatan kaki menjaga ambiguitas asli agar terjemahan tidak memutuskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia harus' melengkapi bentuk partisipial Yunani sesuai fungsi ayat ini dalam daftar persyaratan. 'Rumah tangga' dipilih daripada 'rumah' agar cakupan relasionalnya jelas; 'tunduk' mempertahankan bahasa otoritas teks tanpa menambah kekerasan. Semua penanda catatan kaki hadir dalam teks utama.
