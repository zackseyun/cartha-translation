lexical_decisions:
- source_word: Ταῦτά
  choice: semuanya ini
  rationale: Kata tunjuk netral jamak ini merujuk pada rangkaian petunjuk yang sedang dituliskan; “semuanya ini” mempertahankan gagasan jamak secara alami dalam bahasa Indonesia.
- source_word: σοι
  choice: kepadamu
  rationale: Bentuk datif bersama γράφω secara wajar menyatakan penerima surat atau tulisan.
- source_word: γράφω
  choice: Aku menuliskan
  rationale: Bentuk kini epistoler menunjuk pada tindakan menulis yang sedang dilakukan; “menuliskan” terdengar alami dengan objek “semuanya ini.”
- source_word: ἐλπίζων
  choice: dengan harapan
  rationale: Partisip ini menyatakan keadaan atau sikap yang menyertai tindakan menulis tanpa menjadikan kedatangan itu suatu kepastian.
- source_word: ἐλθεῖν
  choice: datang
  rationale: Infinitif ἔρχομαι dengan πρὸς σέ menyatakan gerak menuju penerima surat.
- source_word: πρὸς σὲ
  choice: menemuimu
  rationale: Dalam konteks perjalanan menuju seseorang, “datang menemuimu” mengungkapkan arah personal secara alami tanpa menambahkan gagasan teologis.
- source_word: ἐν τάχει
  choice: segera
  rationale: Ungkapan ini dapat menyatakan waktu yang dekat atau kecepatan; “segera” paling alami di sini sambil mempertahankan nuansa waktu dekat.
