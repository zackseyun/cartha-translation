id: 1TI.3.9
reference: 1 Timothy 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: id
  text: Mereka harus berpegang pada rahasia iman dengan hati nurani yang murni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memegang rahasia iman dalam hati nurani yang bersih.”
    reason: Alternatif yang lebih harfiah bagi ἔχοντας dan ἐν καθαρᾷ συνειδήσει, sekaligus mencatat padanan sah 'bersih' untuk καθαρᾷ.
lexical_decisions:
- source_word: ἔχοντας
  choice: berpegang pada
  rationale: Partisipel kini ini meneruskan subjek dari ayat sebelumnya, yaitu para diaken. 'Berpegang pada' menyatakan penghayatan dan keteguhan yang terus-menerus, bukan sekadar memiliki secara pasif.
- source_word: τὸ μυστήριον
  choice: rahasia
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk pada kebenaran ilahi yang dahulu tersembunyi tetapi kini dinyatakan. 'Rahasia' lebih mudah dipahami dalam bahasa Indonesia modern daripada transliterasi 'misteri', tanpa menambahkan kata 'yang telah dinyatakan' yang tidak tersurat di sini.
- source_word: τῆς πίστεως
  choice: iman
  rationale: Konteks persyaratan bagi diaken paling mungkin menunjuk pada isi iman Kristen, tetapi bentuk ringkas 'rahasia iman' tetap mempertahankan kemungkinan nuansa iman sebagai tindakan percaya.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: dengan hati nurani yang murni
  rationale: Preposisi ἐν secara idiomatis dapat diterjemahkan 'dengan', sedangkan 'hati nurani yang murni' mempertahankan makna moral καθαρός secara alami dan bermartabat.
theological_decisions:
- issue: Makna τῆς πίστεως
  choice: iman, dengan kemungkinan utama menunjuk pada isi kepercayaan Kristen
  alternative: tindakan percaya atau kesetiaan
  rationale: Artikel dan konteks tata gereja mendukung pengertian objektif, tetapi terjemahan 'iman' tidak menutup sepenuhnya ambiguitas leksikal yang masih mungkin.
- issue: Makna μυστήριον dalam pemakaian Paulus
  choice: rahasia ilahi yang telah dinyatakan
  alternative: sesuatu yang tetap tidak dapat diketahui atau bersifat esoteris
  rationale: Pemakaian Paulus lazimnya berbicara tentang maksud atau kebenaran Allah yang dahulu tersembunyi dan kemudian disingkapkan; teks utama tidak memperluas istilah itu dengan penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti subjek ditambahkan secara wajar dari konteks ayat sebelumnya. Susunan tetap ringkas dan mempertahankan ketegangan makna pada 'rahasia iman'.
