  source_fidelity: Terjemahan dengan tepat meneruskan subjek tersirat dari ayat sebelumnya dan menyampaikan ἔχοντας sebagai keteguhan berkelanjutan melalui “harus berpegang pada.” Frasa “rahasia iman” mempertahankan τὸ μυστήριον τῆς πίστεως tanpa menguraikan secara berlebihan makna Paulus, dan “dengan hati nurani yang murni” merupakan padanan idiomatis serta setia untuk ἐν καθαρᾷ συνειδήσει.
  naturalness: Bahasa Indonesia baku, ringkas, dan wajar. “Mereka harus berpegang pada … dengan hati nurani yang murni” cocok dengan register pengajaran gerejawi dan tidak terasa kaku.
  terminology: “Rahasia iman” adalah padanan yang mapan dan cukup terbuka bagi μυστήριον τῆς πίστεως; “iman” tidak memaksakan salah satu sisi antara isi iman dan tindakan percaya. “Hati nurani yang murni” menyampaikan καθαρά dengan baik. Penanda catatan kaki ditempatkan dengan benar pada akhir kalimat.
