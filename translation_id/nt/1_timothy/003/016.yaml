id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: id
  text: 'Dan tanpa diragukan, agunglah rahasia kesalehan:


    Dia[a] dinyatakan dalam daging,


    dinyatakan benar dalam roh[b],


    dilihat oleh para malaikat,


    diberitakan di antara bangsa-bangsa[c],


    dipercayai di dunia,


    diangkat dalam kemuliaan[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Allah dinyatakan dalam daging,” bukan “Dia dinyatakan dalam daging.” Teks Yunani kritis membaca “yang” (kata relatif maskulin), yang diteruskan secara idiomatis sebagai “Dia” di sini.
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “dinyatakan benar oleh Roh” atau “dinyatakan benar dalam Roh.” Frasa Yunani ini ringkas dan dapat menunjuk pada karya Roh Kudus atau pada ranah kehidupan rohani.
    reason: alternative_reading
  - marker: c
    text: Atau “diberitakan di antara bangsa-bangsa bukan Yahudi.”
    reason: lexical_alternative
  - marker: d
    text: Atau “diangkat ke dalam kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: sungguh tidak dapat disangkal
  rationale: Mengungkapkan sesuatu yang diakui secara terbuka dan tidak diperselisihkan, dengan bahasa Indonesia modern dan wajar.
- source_word: μέγα ἐστὶν
  choice: agunglah
  rationale: Mempertahankan penekanan predikat yang ditempatkan di depan dalam bahasa Yunani, sekaligus memberi irama pengakuan iman yang alami.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: rahasia kesalehan itu
  rationale: Dalam pemakaian Paulus, μυστήριον menunjuk pada kebenaran ilahi yang dahulu tersembunyi lalu dinyatakan; εὐσέβεια menunjuk pada kesalehan atau kehidupan yang berbakti kepada Allah.
- source_word: Ὃς
  choice: Dia
  rationale: Teks kritis berbunyi dengan kata ganti relatif maskulin, bukan θεός. Dalam bahasa Indonesia, 'Dia' secara alami meneruskan pengakuan tentang pribadi yang dimaksud tanpa memasukkan varian 'Allah' ke dalam teks utama.
- source_word: ἐφανερώθη
  choice: dinyatakan
  rationale: Bentuk pasif ini menyampaikan bahwa pribadi tersebut dibuat nyata atau tampil secara terbuka.
- source_word: ἐν σαρκί
  choice: dalam daging
  rationale: Mempertahankan ungkapan ringkas Yunani yang menunjuk pada keberadaan manusia secara jasmani, tanpa mempersempitnya menjadi sekadar 'tubuh'.
- source_word: ἐδικαιώθη
  choice: dinyatakan benar
  rationale: Dalam konteks ini kata tersebut berarti dinyatakan atau terbukti berada di pihak yang benar, bukan dibuat menjadi benar.
- source_word: ἐν πνεύματι
  choice: dalam roh
  rationale: Terjemahan ini mempertahankan keringkasan dan ambiguitas Yunani mengenai apakah yang dimaksud ialah Roh Kudus atau ranah/cara keberadaan rohani.
- source_word: ὤφθη ἀγγέλοις
  choice: dilihat oleh para malaikat
  rationale: Mempertahankan bentuk pasif dan memahami ἀγγέλοις sebagai malaikat surgawi, yang paling sesuai dengan konteks kristologis.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: diberitakan di antara bangsa-bangsa
  rationale: κηρύσσω menyatakan pemberitaan terbuka, sedangkan ἔθνη dapat mencakup bangsa-bangsa dan, secara khusus, bangsa-bangsa bukan Yahudi.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: dipercaya di dunia
  rationale: Konstruksi pasif ini menyatakan bahwa pribadi yang diberitakan menjadi sasaran iman di dunia; bentuk Indonesia tetap ringkas dan sejajar dengan baris-baris lainnya.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: diangkat dalam kemuliaan
  rationale: Mempertahankan preposisi ἐν secara dekat dan tidak menentukan secara berlebihan apakah kemuliaan adalah keadaan, suasana, atau tujuan pengangkatan.
theological_decisions:
- issue: Varian teks pada awal pengakuan (Ὃς / θεός / ὅ)
  choice: Menerjemahkan bacaan teks kritis Ὃς sebagai 'Dia'.
  alternative: '''Allah dinyatakan dalam daging'' atau ''yang dinyatakan dalam daging''.'
  rationale: SBLGNT membaca Ὃς, yaitu kata ganti relatif maskulin. 'Dia' wajar dalam bahasa Indonesia dan mempertahankan rujukan pribadi kepada Kristus, sementara varian historis yang penting dicatat tanpa dimasukkan ke teks utama.
- issue: Rujukan frasa ἐν πνεύματι
  choice: Menerjemahkan secara netral sebagai 'dalam roh'.
  alternative: '''oleh Roh'' atau ''dalam Roh''.'
  rationale: Bahasa Yunani tanpa artikel dapat menunjuk pada karya Roh Kudus atau pada ranah/cara keberadaan rohani. Teks utama mempertahankan ketegangan tersebut.
- issue: Nuansa ἐδικαιώθη
  choice: Menerjemahkan 'dinyatakan benar'.
  alternative: '''dibenarkan'' atau ''terbukti benar''.'
  rationale: Pilihan ini menghindari kesan bahwa Kristus dibuat benar setelah sebelumnya tidak benar, dan menyampaikan pembenaran atau peneguhan terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan pola baris sejajar untuk mempertahankan bentuk pengakuan iman atau nyanyian. Istilah 'daging', 'roh', 'rahasia', dan 'kemuliaan' dipertahankan karena penting secara konseptual, tetapi susunan kalimat dibuat alami bagi pembaca umum.
