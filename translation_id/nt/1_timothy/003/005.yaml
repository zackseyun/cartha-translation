base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: id
  text: Tetapi jika seseorang tidak tahu bagaimana mengelola rumah tangganya sendiri[b], bagaimana ia akan mengurus[c] jemaat Allah[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gereja Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memimpin” atau “mengepalai” rumah tangganya sendiri.
    reason: lexical_alternative
  - marker: c
    text: Atau, “merawat” atau “memelihara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Tetapi jika
  rationale: Mempertahankan syarat yang dinyatakan oleh εἰ sekaligus pertentangan ringan yang ditandai oleh δέ, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu ini menunjuk secara umum kepada calon penilik dalam konteks terdekat tanpa menambahkan kata 'laki-laki' ke dalam klausa ini.
- source_word: τοῦ ἰδίου οἴκου
  choice: rumah tangganya sendiri
  rationale: Dalam konteks kepemimpinan dan ketertiban keluarga, οἶκος menunjuk kepada seisi rumah atau rumah tangga, bukan terutama bangunannya.
- source_word: προστῆναι
  choice: mengelola
  rationale: Bentuk dari προΐστημι di sini menyatakan kepemimpinan yang bertanggung jawab atas rumah tangga. 'Mengelola' menyampaikan segi praktis tersebut tanpa memberi kesan kekuasaan keras yang tidak dituntut teks.
- source_word: οὐκ οἶδεν
  choice: tidak tahu bagaimana
  rationale: οἶδα yang diikuti infinitif secara idiomatis berarti mengetahui cara melakukan sesuatu.
- source_word: πῶς
  choice: bagaimana ... akan
  rationale: Mempertahankan bentuk pertanyaan retoris dan orientasi ke depan tanpa mengubahnya menjadi pernyataan eksplisit tentang ketidakmampuan.
- source_word: ἐκκλησίας θεοῦ
  choice: jemaat Allah
  rationale: Dalam konteks surat-surat Pastoral, ἐκκλησία menunjuk kepada persekutuan umat Allah. Bentuk genitif θεοῦ diterjemahkan secara ringkas sebagai 'jemaat Allah'.
- source_word: ἐπιμελήσεται
  choice: akan mengurus
  rationale: ἐπιμελέομαι menyatakan perhatian yang sungguh-sungguh dan tindakan merawat kebutuhan pihak lain. 'Mengurus' wajar dalam bahasa Indonesia serta tetap berbeda dari 'mengelola' pada klausa pertama.
theological_decisions:
- issue: Hubungan antara kepemimpinan rumah tangga dan pengawasan jemaat
  choice: Menggunakan 'mengelola' untuk rumah tangga dan 'mengurus' untuk jemaat.
  alternative: Menggunakan 'memimpin' pada kedua klausa atau 'memerintah' untuk rumah tangga.
  rationale: Teks Yunani memakai dua verba berbeda, προΐστημι dan ἐπιμελέομαι. Pembedaan ini mempertahankan analogi antara kedua lingkup tanpa menyamakan perhatian terhadap jemaat dengan penguasaan atau administrasi semata.
- issue: Pengungkapan gender subjek tak tentu
  choice: Menggunakan 'seseorang', 'ia', dan akhiran '-nya' yang alami dalam bahasa Indonesia.
  alternative: Menambahkan 'seorang laki-laki' atau memakai ungkapan yang secara eksplisit menyebut gender.
  rationale: τις sendiri merupakan kata ganti tak tentu, sedangkan bentuk ἰδίου mengikuti gender gramatikal οἶκος. Bahasa Indonesia tidak menandai gender pada 'ia' dan '-nya'; karena itu, terjemahan ini tidak menambahkan informasi gender yang tidak dinyatakan secara eksplisit dalam klausa, sementara konteks tentang syarat penilik tetap utuh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Rumah tangga' dan 'jemaat' mudah dipahami pembaca umum, sedangkan pilihan verba mempertahankan perbedaan makna kedua tindakan dalam teks Yunani.
