    text: Atau, menurut padanan tradisional, “gereja Allah yang hidup.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tiang dan dasar kebenaran”; “benteng” juga diusulkan untuk kata “penopang.”
    reason: lexical_alternative
  revision_rationale: Revisi mengganti “terlambat” dengan “tertunda” agar sesuai dengan kemungkinan tertundanya kedatangan Paulus. Frasa “aku menulis ini” menyatakan verba yang tersirat secara wajar dalam bahasa Indonesia, tanpa menambahkan demonstratif “hal ini” sebagai objek yang berdiri di depan dan berpotensi mengganggu alur ayat. Istilah utama dipertahankan, sedangkan catatan alternatif untuk ἑδραίωμα diperjelas.
