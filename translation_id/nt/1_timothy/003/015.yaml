revisions:
- from: Namun, jika aku terlambat, hal ini kutuliskan supaya engkau tahu bagaimana orang harus berperilaku dalam keluarga Allah, yaitu jemaat[a] Allah yang hidup, tiang dan penopang[b] kebenaran.
  to: Namun, jika aku tertunda, aku menulis ini supaya engkau tahu bagaimana orang harus berperilaku dalam keluarga Allah, yaitu jemaat[a] Allah yang hidup, tiang dan penopang[b] kebenaran.
  rationale: Revisi mengganti “terlambat” dengan “tertunda” agar sesuai dengan kemungkinan tertundanya kedatangan Paulus. Frasa “aku menulis ini” menyatakan verba yang tersirat secara wajar dalam bahasa Indonesia, tanpa menambahkan demonstratif “hal ini” sebagai objek yang berdiri di depan dan berpotensi mengganggu alur ayat. Istilah utama dipertahankan, sedangkan catatan alternatif untuk ἑδραίωμα diperjelas.
