id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: id
  text: Namun, jika aku tertunda, aku menulis ini supaya engkau tahu bagaimana orang harus berperilaku dalam keluarga Allah, yaitu jemaat[a] Allah yang hidup, tiang dan penopang[b] kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut padanan tradisional, “gereja Allah yang hidup.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tiang dan dasar kebenaran”; “benteng” juga diusulkan untuk kata “penopang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: aku terlambat
  rationale: Dalam konteks ini verba tersebut berarti Paulus terlambat datang, bukan bahwa ia lamban secara moral. Bentuk aktif bahasa Indonesia sudah dapat menyatakan keadaan ini secara alami.
- source_word: ἵνα εἰδῇς
  choice: supaya engkau tahu
  rationale: Ungkapan ini menyampaikan klausa tujuan dengan jelas dan alami serta mempertahankan sapaan tunggal kepada Timotius.
- source_word: δεῖ
  choice: harus
  rationale: Kata ini menyatakan keharusan normatif. Dalam konstruksi impersonal 'orang harus', pilihan ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἐν οἴκῳ θεοῦ
  choice: dalam keluarga Allah
  rationale: οἶκος dapat menunjuk kepada rumah tangga atau keluarga. Karena frasa berikutnya menjelaskannya sebagai ἐκκλησία, yang dimaksud terutama ialah umat Allah, bukan bangunan.
- source_word: ἀναστρέφεσθαι
  choice: berperilaku
  rationale: Verba ini berkenaan dengan cara hidup atau tingkah laku. 'Berperilaku' jelas dalam konteks petunjuk mengenai kehidupan bersama umat.
- source_word: ἥτις ἐστίν
  choice: yaitu
  rationale: Kata penghubung ini secara alami memperkenalkan penjelasan bahwa keluarga Allah adalah jemaat Allah yang hidup.
- source_word: ἐκκλησία
  choice: jemaat
  rationale: '''Jemaat'' menunjuk kepada persekutuan orang-orang yang dipanggil dan berkumpul, serta menghindari kesan bahwa yang terutama dimaksud ialah gedung atau lembaga. Padanan tradisional dicantumkan dalam catatan kaki.'
- source_word: θεοῦ ζῶντος
  choice: Allah yang hidup
  rationale: Padanan ini alami dan mempertahankan penegasan teologis bahwa Allah itu hidup.
- source_word: στῦλος
  choice: tiang
  rationale: Kata ini mempertahankan metafora arsitektural Yunani dengan padanan Indonesia yang jelas.
- source_word: ἑδραίωμα
  choice: penopang
  rationale: Nomina langka ini menunjuk kepada sesuatu yang meneguhkan atau menopang. 'Penopang' mempertahankan gambaran tersebut tanpa menentukan secara berlebihan apakah yang dimaksud khususnya fondasi atau benteng pertahanan.
- source_word: τῆς ἀληθείας
  choice: kebenaran
  rationale: Dalam bahasa Indonesia, nomina ini sudah dapat bersifat tentu tanpa kata sandang, sehingga secara alami berarti kebenaran yang dimaksud dalam konteks.
theological_decisions:
- issue: Pemadanan ἐκκλησία dalam konteks eklesiologis
  choice: jemaat
  alternative: gereja
  rationale: '''Jemaat'' menonjolkan umat atau persekutuan yang berkumpul dan sesuai dengan penjelasan ''keluarga Allah''. ''Gereja'' tetap diberikan sebagai padanan tradisional dalam catatan kaki.'
- issue: Makna 'tiang dan ἑδραίωμα kebenaran'
  choice: tiang dan penopang kebenaran
  alternative: tiang dan dasar kebenaran; tiang dan benteng kebenaran
  rationale: Sintaksis Yunani menyatakan bahwa jemaat Allah yang hidup adalah tiang dan ἑδραίωμα kebenaran. 'Penopang' menjaga tingginya peran jemaat dalam meneguhkan kebenaran tanpa menyelesaikan secara dogmatis metafora dari nomina Yunani yang langka itu.
- issue: Subjek impersonal pada δεῖ ... ἀναστρέφεσθαι
  choice: bagaimana orang harus berperilaku
  alternative: bagaimana engkau harus berperilaku
  rationale: Bahasa Yunani tidak menyebut subjek khusus bagi infinitif tersebut. Bentuk impersonal 'orang' mempertahankan cakupan umum dan tidak membatasinya hanya kepada Timotius.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'aku–engkau' mempertahankan komunikasi pribadi Paulus kepada Timotius. Frasa 'hal ini kutuliskan' dibuat eksplisit dari konteks langsung ayat sebelumnya agar klausa tujuan terbaca utuh dalam bahasa Indonesia, sebagaimana dituntut oleh hubungan sintaksisnya.
