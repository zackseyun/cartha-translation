    issue: Frasa “jika mereka tidak dapat dituduh melakukan kesalahan” kurang tepat untuk ἀνέγκλητοι ὄντες.
    rationale: Frasa ini dapat menyatakan ketiadaan tuduhan aktual, bukan keadaan bahwa mereka tidak tercela atau tidak dapat dikenai tuduhan yang sah. Kata “jika” juga membuat hubungan partisipial menjadi syarat yang lebih tegas daripada bentuk sumber.
