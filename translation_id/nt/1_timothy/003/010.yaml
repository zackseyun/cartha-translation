review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan urutan pengujian lalu pelayanan dan dengan tepat memahami konteks diaken. Namun, “jika mereka tidak dapat dituduh melakukan kesalahan” mengubah partisip ἀνέγκλητοι ὄντες menjadi syarat yang terlalu eksplisit serta berpotensi berarti sekadar tidak ada orang yang menuduh mereka. Istilah Yunani itu menunjuk pada sifat tidak bercela/tidak terbuka pada tuduhan yang sah.
  naturalness: “Mereka ini juga hendaklah terlebih dahulu diuji” dan “kemudian hendaklah mereka melayani” adalah bahasa Indonesia baku, langsung, dan mempertahankan daya imperatif. “Setelah terbukti tidak bercela” menyatakan kelayakan yang menyertai pelayanan secara alami dalam alur kalimat Indonesia.
  terminology: “Diaken” sesuai dengan konteks dekat dan dengan keputusan audit bahasa Inggris; catatan kaki dengan tepat mengakui bahwa verba Yunani secara harfiah hanya berarti “melayani.” “Tidak bercela” adalah istilah Indonesia yang lazim untuk ἀνέγκλητος dan tidak mengharuskan kesempurnaan tanpa dosa.
  issues:
