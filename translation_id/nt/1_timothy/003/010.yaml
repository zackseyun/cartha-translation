revisions:
- from: Mereka juga harus diuji terlebih dahulu; sesudah itu, jika mereka tidak dapat dituduh melakukan kesalahan, biarlah mereka melayani sebagai diaken.[a]
  to: Mereka ini juga hendaklah terlebih dahulu diuji; kemudian hendaklah mereka melayani sebagai diaken, setelah terbukti tidak bercela.[a]
  rationale: Revisi mempertahankan penjelasan kontekstual “sebagai diaken,” yang didukung oleh konteks langsung dan dijaga transparansinya melalui catatan kaki. “Setelah terbukti tidak bercela” menggantikan rumusan yang berfokus pada ada-tidaknya tuduhan dengan ungkapan yang lebih setia pada ἀνέγκλητοι dan lebih alami dalam bahasa Indonesia. Ini tidak menyiratkan bahwa mereka tanpa dosa, melainkan bahwa mereka memenuhi tuntutan kelayakan yang tidak bercela.
