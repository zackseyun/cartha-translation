  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: id
  text: Mereka ini juga hendaklah terlebih dahulu diuji; kemudian hendaklah mereka melayani sebagai diaken, setelah terbukti tidak bercela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hendaklah mereka melayani.” Dalam konteks ini, pelayanan sebagai diakenlah yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: mereka juga
  rationale: Menunjuk kembali kepada orang-orang yang sedang dibahas dan mempertahankan hubungan tambahan yang dinyatakan oleh καὶ ... δὲ.
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: harus diuji terlebih dahulu
  rationale: Bentuk imperatif pasif menuntut adanya pengujian atau pemeriksaan untuk menentukan kelayakan sebelum mereka melayani.
- source_word: εἶτα
  choice: sesudah itu
  rationale: 'Menandai urutan: pelayanan baru dilakukan setelah pengujian.'
- source_word: διακονείτωσαν
  choice: biarlah mereka melayani sebagai diaken
  rationale: Verba ini secara leksikal berarti melayani, sedangkan konteks langsungnya membahas para diaken; frasa ini mempertahankan gagasan verbal sekaligus memperjelas fungsi yang dimaksud.
- source_word: ἀνέγκλητοι ὄντες
  choice: jika mereka tidak dapat dituduh melakukan kesalahan
  rationale: Partisip tersebut menyatakan keadaan atau syarat yang menyertai pelayanan. Ungkapan ini menunjukkan tidak adanya tuduhan yang sah, bukan kesempurnaan tanpa dosa.
theological_decisions:
- issue: Apakah διακονείτωσαν diterjemahkan secara umum atau dengan daya khusus jabatan
  choice: melayani sebagai diaken
  alternative: melayani
  rationale: Konteks langsung adalah persyaratan bagi diaken. Namun, karena nomina 'diaken' tidak muncul dalam klausa ini, alternatif yang lebih harfiah dicatat dalam catatan kaki agar nuansa sumber tetap terbuka.
- issue: Apakah ἀνέγκλητοι berarti tanpa dosa atau bebas dari tuduhan yang sah
  choice: tidak dapat dituduh melakukan kesalahan
  alternative: tidak bercela
  rationale: Dalam daftar persyaratan, istilah ini menunjuk pada tidak adanya dasar tuduhan yang sah, bukan kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami; hubungan antara pengujian, kelayakan, dan pelayanan dipertahankan. Penjelasan kontekstual 'sebagai diaken' diberi catatan karena tidak dinyatakan dengan nomina tersendiri dalam teks Yunani.
