  to: Keesokan harinya, Agripa dan Bernike datang dengan kemegahan yang besar[a]. Mereka memasuki ruang sidang bersama para perwira tinggi dan para pria terkemuka di kota itu[b]. Lalu, atas perintah Festus, Paulus dibawa masuk.
