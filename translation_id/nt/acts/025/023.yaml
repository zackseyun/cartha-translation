source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: id
  text: Keesokan harinya, Agripa dan Bernike datang dengan kemegahan yang besar[a]. Mereka memasuki ruang sidang bersama para perwira tinggi dan para pria terkemuka di kota itu[b]. Lalu, atas perintah Festus, Paulus dibawa masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan arak-arakan yang sangat megah” atau “dengan penampilan yang sangat mencolok.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “para tokoh utama kota itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia. οὖν berfungsi sebagai penghubung alur dan tidak perlu selalu dinyatakan tersendiri.
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: Agripa dan Bernike datang
  rationale: Konstruksi genitif absolut dialihkan menjadi klausa utama yang alami; nama mengikuti bentuk transliterasi Indonesia.
- source_word: μετὰ πολλῆς φαντασίας
  choice: dengan kemegahan besar
  rationale: Dalam konteks ini φαντασία menunjuk pada penampilan lahiriah yang megah dan mencolok dalam suatu acara resmi.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: Mereka memasuki ruang sidang
  rationale: ἀκροατήριον adalah tempat untuk mendengarkan suatu perkara; 'ruang sidang' jelas dan sesuai dengan konteks pemeriksaan resmi.
- source_word: σύν τε χιλιάρχοις
  choice: bersama para perwira tinggi
  rationale: χιλίαρχοι menunjuk para pejabat militer berpangkat tinggi. Terjemahan fungsional ini lebih mudah dipahami daripada istilah teknis Romawi yang kurang lazim.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: orang-orang terkemuka di kota itu
  rationale: κατ’ ἐξοχήν menyatakan kedudukan yang menonjol atau terpandang. 'Orang-orang' alami dalam bahasa Indonesia meskipun ἀνδράσιν secara leksikal berarti laki-laki.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: atas perintah Festus
  rationale: Konstruksi genitif absolut diterjemahkan sebagai frasa yang ringkas dan tetap menyatakan wewenang resmi Festus.
- source_word: ἤχθη ὁ Παῦλος
  choice: Paulus dibawa masuk
  rationale: Bentuk pasif ἄγω menunjukkan bahwa Paulus diantar atau digiring ke dalam ruang tersebut.
