id: ACT.25.8
reference: Acts 25:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: id
  text: Dalam pembelaannya, Paulus berkata, “Aku sama sekali tidak berbuat dosa[a] terhadap hukum orang Yahudi, Bait Allah, ataupun Kaisar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sama sekali tidak melakukan pelanggaran terhadap hukum orang Yahudi, Bait Allah, ataupun Kaisar.”
    reason: Alternatif ini menampilkan nuansa forensik ἥμαρτον dalam konteks persidangan.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: Dalam pembelaannya, Paulus berkata
  rationale: Bentuk genitif absolut menyajikan pembelaan Paulus di hadapan pengadilan. Ungkapan ini alami dalam bahasa Indonesia, mempertahankan nuansa forensik, dan memasok kata 'berkata' yang tersirat sebelum isi ucapannya.
- source_word: ὅτι
  choice: dinyatakan melalui tanda baca kutipan langsung
  rationale: ὅτι memperkenalkan isi pembelaan Paulus. Kutipan langsung lebih alami daripada menerjemahkannya secara eksplisit dengan 'bahwa'.
- source_word: νόμον τῶν Ἰουδαίων
  choice: hukum orang Yahudi
  rationale: Terjemahan ini mempertahankan konstruksi genitif dan tidak mempersempit rujukannya menjadi semata-mata hukum sipil atau adat.
- source_word: ἱερὸν
  choice: Bait Allah
  rationale: Dalam konteks ini ἱερόν menunjuk pada kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. 'Bait Allah' merupakan sebutan baku dan jelas dalam bahasa Indonesia.
- source_word: Καίσαρά
  choice: Kaisar
  rationale: Gelar/nama penguasa Romawi dipertahankan, sesuai dengan latar hukum dan politik ayat ini.
- source_word: τι
  choice: sama sekali tidak
  rationale: Dengan verba yang dinegasikan, kata tak tentu ini menegaskan bahwa penyangkalan Paulus bersifat menyeluruh.
- source_word: ἥμαρτον
  choice: berbuat dosa
  rationale: Walaupun konteksnya forensik dan dapat berarti melakukan pelanggaran, pilihan ini mempertahankan hubungan leksikal dengan gagasan dosa serta dimensi moral verba ἁμαρτάνω.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: tidak ... terhadap ..., ..., ataupun ...
  rationale: Susunan ini menyampaikan tiga penyangkalan secara alami dalam bahasa Indonesia tanpa menghilangkan cakupan tiap unsur.
theological_decisions:
- issue: Nuansa hukum dan moral dalam ἥμαρτον
  choice: berbuat dosa
  alternative: melakukan pelanggaran / bersalah
  rationale: Konteks persidangan memberi verba ini nuansa pelanggaran hukum, tetapi verba Yunani yang dipakai juga merupakan kata umum untuk berbuat dosa. Teks utama mempertahankan ketegangan itu, sedangkan catatan kaki memberi padanan forensik yang sah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'Aku' mempertahankan ujaran langsung, sedangkan 'dalam pembelaannya' menandai suasana pengadilan tanpa memakai istilah hukum yang terlalu teknis.
