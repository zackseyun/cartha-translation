  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: id
  text: Karena itu, hendaklah orang-orang yang berpengaruh di antara kalian[a] turun bersama saya. Jika ada sesuatu yang tidak patut pada orang itu, hendaklah mereka menuduh dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang berwenang di antara kalian,” “orang-orang terkemuka di antara kalian,” atau “orang-orang yang sanggup di antara kalian.” Kata Yunani ini dapat menunjuk kepada orang yang berkuasa, terkemuka, atau mampu.
    reason: lexical_alternative
  - marker: b
    text: Atau “hendaklah mereka mengajukan tuduhan terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Karena itu, hendaklah ...
  rationale: οὖν menandai kelanjutan yang bersifat simpulan; konstruksi imperatif orang ketiga diterjemahkan secara wajar dengan 'hendaklah'.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: orang-orang yang berwenang di antara kalian
  rationale: Dalam konteks administratif dan hukum, δυνατοί kemungkinan menunjuk kepada orang-orang yang mempunyai kedudukan atau kewenangan untuk mewakili para pemimpin Yahudi, meskipun secara leksikal dapat pula berarti orang-orang yang sanggup atau berpengaruh; ambiguitas ini dicatat dalam catatan kaki.
- source_word: φησίν
  choice: tidak diterjemahkan secara tersendiri
  rationale: φησίν adalah sisipan narator, 'katanya', di tengah ujaran langsung. Mengungkapkannya kembali akan terasa janggal dalam bahasa Indonesia karena identitas pembicara sudah jelas dari konteks.
- source_word: συγκαταβάντες
  choice: pergi bersama saya ke Kaisarea
  rationale: Kata ini berarti turun/pergi bersama. Tujuan perjalanan, Kaisarea, tersirat jelas dari konteks langsung; penyebutannya menghasilkan bahasa Indonesia yang alami, sedangkan arah topografis 'turun' tidak perlu dinyatakan secara harfiah.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: Jika orang itu telah melakukan sesuatu yang salah
  rationale: Ungkapan Yunani secara harfiah berbicara tentang adanya sesuatu yang tidak patut pada orang itu. Terjemahan ini mempertahankan sifat umum ἄτοπον tanpa mempersempitnya menjadi tindak pidana tertentu.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: hendaklah mereka mengajukan tuduhan terhadapnya
  rationale: Dalam konteks persidangan, κατηγορέω berarti menuduh atau mengajukan dakwaan/tuduhan. Pilihan ini menyatakan nuansa hukum tanpa menganggap tuduhan tersebut telah terbukti.
