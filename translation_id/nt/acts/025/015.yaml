revisions:
- from: Tentang dia, ketika saya tiba di Yerusalem, imam-imam kepala dan para tua-tua orang Yahudi menyampaikan perkara itu kepada saya dan meminta agar dia dijatuhi hukuman bersalah.[a]
  to: Tentang dia, ketika saya tiba di Yerusalem, imam-imam kepala dan para tua-tua orang Yahudi menyampaikan perkara itu kepada saya dan meminta putusan penghukuman terhadap dia.[a]
  rationale: Revisi hanya mengganti ungkapan hukum yang tidak idiomatis dengan “putusan penghukuman terhadap dia.” Ini menyampaikan καταδίκη sebagai hasil/putusan yudisial yang menghukum dan mempertahankan arah tindakan “terhadap dia” dari κατ’ αὐτοῦ. Struktur kalimat serta rujukan eksplisit kepada Paulus tetap dipertahankan.
