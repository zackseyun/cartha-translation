translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Sapaan orang pertama diterjemahkan dengan “saya” sesuai tuturan Festus kepada Agripa. Istilah hukum dipertahankan tanpa dibuat terlalu teknis.
