  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: id
  text: Tentang dia, ketika saya tiba di Yerusalem, imam-imam kepala dan para tua-tua orang Yahudi menyampaikan perkara itu kepada saya dan meminta putusan penghukuman terhadap dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meminta agar dia dihukum” atau “meminta putusan bersalah terhadap dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Tentang dia
  rationale: Frasa ini merujuk kembali kepada Paulus dan mengawali pokok yang sedang dijelaskan. Bentuk ini alami dalam bahasa Indonesia dan tetap menyatakan rujukannya secara eksplisit.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: ketika saya tiba di Yerusalem
  rationale: Konstruksi genitif absolut dengan γίνομαι dan εἰς menyatakan waktu kedatangan; terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐνεφάνισαν
  choice: menyampaikan perkara itu kepada saya
  rationale: Dalam konteks hukum-administratif, verba ini berarti memberitahukan atau mengajukan suatu perkara kepada pejabat. Pilihan ini menghindari kesan bahwa mereka sekadar memberi informasi biasa.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Ini adalah padanan baku bagi bentuk jamak yang menunjuk para pemimpin utama kalangan imam, bukan hanya seorang imam besar.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: para tua-tua orang Yahudi
  rationale: Genitif tersebut mengidentifikasi kelompok yang memiliki para tua-tua itu. Terjemahan ini dekat dengan struktur Yunani tanpa mempersempit identitas mereka secara berlebihan.
- source_word: αἰτούμενοι
  choice: meminta
  rationale: Partisip ini menyatakan permohonan yang menyertai tindakan mereka dalam menyampaikan perkara kepada Festus.
- source_word: κατ’ αὐτοῦ
  choice: agar dia
  rationale: Dalam susunan Indonesia bersama verba pasif 'dijatuhi', sasaran tindakan hukum dinyatakan secara alami dengan 'dia'; nuansa tindakan yang merugikan Paulus dipertahankan oleh keseluruhan frasa.
- source_word: καταδίκην
  choice: dijatuhi hukuman bersalah
  rationale: Nomina ini menunjuk putusan penghukuman secara yudisial. Ungkapan Indonesia ini menonjolkan permintaan akan putusan hukum yang menyatakan terdakwa bersalah, bukan sekadar kecaman umum.
