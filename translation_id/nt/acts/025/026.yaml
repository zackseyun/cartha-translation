id: ACT.25.26
reference: Acts 25:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: id
  text: Tentang orang ini, aku tidak mempunyai hal yang pasti untuk ditulis kepada tuanku.[a] Karena itu, aku telah membawanya ke hadapan kalian semua, dan terutama ke hadapanmu, Raja Agripa, agar, sesudah pemeriksaan itu berlangsung,[b] aku dapat mempunyai sesuatu yang dapat kutulis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “kepada kaisar.” Bahasa Yunani berbunyi “kepada tuanku,” dengan memakai gelar κύριος dalam konteks kekaisaran ini.
    reason: alternative_reading
  - marker: b
    text: “Pemeriksaan” juga dapat diterjemahkan “sidang pemeriksaan” atau “penyelidikan”; yang dimaksud ialah penyelidikan hukum atas perkara Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: sesuatu yang pasti
  rationale: Frasa ini menunjuk pada keterangan yang pasti, kukuh, atau dapat diandalkan untuk dimasukkan dalam laporan resmi. Bentuk positif mengikuti susunan Yunani οὐκ ἔχω ἀσφαλές τι, secara harfiah 'aku tidak mempunyai sesuatu yang pasti'.
- source_word: τῷ κυρίῳ
  choice: kepada tuanku
  rationale: κύριος secara leksikal berarti 'tuan'; dalam konteks administratif ini yang dimaksud ialah kaisar. 'Tuanku' mempertahankan bentuk sapaan resmi tanpa mengganti istilah sumber dengan referennya.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: aku telah membawanya ke hadapan kalian semua
  rationale: προάγω di sini berarti membawa atau menghadapkan seseorang, sedangkan ὑμῶν berbentuk jamak. 'Kalian semua' mempertahankan perbedaan dengan σοῦ yang tunggal dalam sapaan berikutnya kepada Agripa.
- source_word: μάλιστα ἐπὶ σοῦ
  choice: terutama ke hadapanmu
  rationale: μάλιστα memberi penekanan khusus kepada Agripa di antara seluruh orang yang hadir.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: setelah pemeriksaan dilakukan
  rationale: Genitif absolut dipahami secara temporal. ἀνάκρισις menunjuk pada pemeriksaan, penyelidikan, atau dengar perkara dalam konteks hukum.
- source_word: σχῶ τί γράψω
  choice: aku mempunyai sesuatu untuk ditulis
  rationale: Ungkapan ini menyatakan tujuan Festus memperoleh bahan atau dasar yang dapat dituliskan dalam laporan; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan unsur 'mempunyai' dari σχῶ.
theological_decisions:
- issue: Makna κύριος dalam konteks kekaisaran, bukan sebagai gelar ilahi
  choice: tuanku
  alternative: kaisar
  rationale: Dalam ayat ini κύριος merujuk kepada penguasa Romawi dalam pemakaian resmi, bukan kepada Allah atau Mesias. Teks utama mempertahankan makna leksikal 'tuan', sedangkan catatan kaki menjelaskan referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku', 'kalian', dan '-mu' mencerminkan tuturan langsung Festus serta membedakan bentuk jamak ὑμῶν dari bentuk tunggal σοῦ. Nama Ἀγρίππα ditulis 'Agripa', bentuk Indonesia yang lazim. Struktur argumentatif διό diterjemahkan 'Karena itu'.
