revisions:
- from: Tentang dia, aku tidak mempunyai sesuatu yang pasti untuk ditulis kepada tuanku.[a] Karena itu, aku telah membawanya ke hadapan kalian semua, dan terutama ke hadapanmu, Raja Agripa, supaya setelah pemeriksaan dilakukan,[b] aku mempunyai sesuatu untuk ditulis.
  to: Tentang orang ini, aku tidak mempunyai hal yang pasti untuk ditulis kepada tuanku.[a] Karena itu, aku telah membawanya ke hadapan kalian semua, dan terutama ke hadapanmu, Raja Agripa, agar, sesudah pemeriksaan itu berlangsung,[b] aku dapat mempunyai sesuatu yang dapat kutulis.
  rationale: Revisi memperjelas tujuan yang ditandai ὅπως dan bentuk subjungtif σχῶ dengan "aku dapat mempunyai", sambil mempertahankan gagasan bahwa Festus memerlukan bahan untuk laporan tertulis. "Hal yang pasti" memperbaiki kelancaran Indonesia bagi ἀσφαλές τι, dan alternatif catatan kaki diperbarui menjadi istilah hukum yang baku. Tidak ada perubahan pada rujukan imperial dari "tuanku", perbedaan audiens jamak dan Agripa tunggal, atau makna yudisial pemeriksaan.
