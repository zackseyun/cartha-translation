  verdict: revise
  source_fidelity: Perlu penyesuaian kecil. ἀδικῶ adalah verba kini, sehingga “berbuat salah” lebih dekat daripada predikatif “bersalah”; rangkaian dengan perfektum πέπραχά τι tetap menyatakan perbuatan yang telah dilakukan. Untuk οὐδέν ἐστιν ὧν ... κατηγοροῦσίν μου, “tidak satu pun ... benar” menyatakan ketiadaan dasar pada tuduhan tanpa memperluas makna. χαρίσασθαι secara khusus memuat penyerahan sebagai kemurahan/konsesi kepada para penuduh.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan jelas untuk konteks peradilan. “Sebagai suatu konsesi kepada mereka” lebih alami dan lebih tepat sasaran daripada “sebagai kemurahan hati,” yang dalam bahasa Indonesia tidak jelas kepada siapa kemurahan itu diberikan.
  terminology: “Patut dihukum mati,” “tuduhan,” “konsesi,” dan “naik banding kepada Kaisar” sesuai register hukum-modern. “Kaisar” dipertahankan sebagai gelar penguasa Romawi dalam ungkapan banding yang bersifat teknis.
