revisions:
- from: Jadi, jika saya bersalah dan telah melakukan sesuatu yang patut dihukum mati, saya tidak menolak untuk mati. Namun, jika tuduhan orang-orang ini terhadap saya sama sekali tidak beralasan, tidak seorang pun dapat menyerahkan saya kepada mereka sebagai kemurahan hati.[a] Saya naik banding kepada Kaisar.
  to: Jadi, jika saya berbuat salah dan telah melakukan sesuatu yang patut dihukum mati, saya tidak menolak untuk mati. Namun, jika tidak satu pun dari tuduhan orang-orang ini terhadap saya benar, tidak seorang pun dapat menyerahkan saya kepada mereka sebagai suatu konsesi kepada mereka.[a] Saya naik banding kepada Kaisar.
