    issue: “Saya bersalah” untuk ἀδικῶ
    rationale: Bentuk kini ἀδικῶ secara harfiah menyatakan “saya berbuat salah/melakukan kejahatan,” bukan semata-mata status hukum “saya bersalah.” Dalam kalimat bersyarat yang juga memuat perfektum πέπραχά, pembedaan ini sebaiknya dipertahankan.
  - severity: medium
    issue: “Sebagai kemurahan hati” tidak jelas penerimanya
    rationale: χαρίσασθαι dengan αὐτοῖς berarti menyerahkan Paulus sebagai kemurahan atau konsesi kepada para penuduh. “Sebagai suatu konsesi kepada mereka” menyatakan relasi tersebut dengan lebih jelas dan idiomatis.
