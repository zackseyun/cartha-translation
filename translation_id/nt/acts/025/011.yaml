  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: id
  text: Jadi, jika saya berbuat salah dan telah melakukan sesuatu yang patut dihukum mati, saya tidak menolak untuk mati. Namun, jika tidak satu pun dari tuduhan orang-orang ini terhadap saya benar, tidak seorang pun dapat menyerahkan saya kepada mereka sebagai suatu konsesi kepada mereka.[a] Saya naik banding kepada Kaisar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyerahkan saya kepada mereka demi menyenangkan mereka.” Kata Yunani yang dipakai mencakup gagasan memberikan atau menyerahkan seseorang sebagai suatu kemurahan atau konsesi kepada pihak lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: saya bersalah
  rationale: Dalam konteks sidang pengadilan, bentuk kini ini menyatakan keadaan bersalah atau melakukan pelanggaran. 'Saya bersalah' alami dalam bahasa Indonesia dan mempertahankan daya moral-legalnya tanpa menentukan pelanggaran tertentu.
- source_word: ἄξιον θανάτου
  choice: patut dihukum mati
  rationale: Ungkapan ini menyatakan bahwa suatu perbuatan layak menerima hukuman mati. Pilihan ini jelas dalam konteks hukum sekaligus mempertahankan unsur penilaian dalam ἄξιον.
- source_word: πέπραχά τι
  choice: telah melakukan sesuatu
  rationale: Bentuk perfektum menunjuk pada perbuatan yang telah dilakukan dan tetap relevan bagi perkara saat itu; 'telah melakukan sesuatu' juga mempertahankan ketidakspesifikan τι.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: saya tidak menolak untuk mati
  rationale: παραιτέομαι berarti menolak atau menghindari. Terjemahan ini mempertahankan pernyataan bersyarat Paulus bahwa ia bersedia menerima kematian jika memang bersalah.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: tuduhan orang-orang ini terhadap saya sama sekali tidak beralasan
  rationale: Konstruksi Yunani menyatakan bahwa isi tuduhan itu tidak memiliki dasar atau substansi. 'Sama sekali tidak beralasan' menyampaikan maknanya secara alami tanpa menambahkan rincian perkara.
- source_word: χαρίσασθαι
  choice: menyerahkan saya kepada mereka sebagai kemurahan hati
  rationale: Kata ini mencakup tindakan memberikan atau menyerahkan seseorang sebagai suatu pemberian atau kelonggaran bagi pihak lain. Terjemahan utama mempertahankan unsur 'karunia/kemurahan' yang melekat pada verba tersebut; alternatif idiomatis dijelaskan dalam catatan kaki.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Saya naik banding kepada Kaisar
  rationale: Ini merupakan ungkapan hukum teknis untuk mengajukan perkara kepada kaisar. 'Naik banding kepada Kaisar' adalah padanan Indonesia yang jelas dan lazim.
- source_word: μὲν οὖν ... δὲ
  choice: Jadi, jika ... Namun, jika
  rationale: Pasangan partikel ini menyusun dua kemungkinan yang berlawanan dalam argumentasi Paulus. Padanan tersebut menjaga alur kesimpulan dan kontras secara wajar.
theological_decisions:
- issue: Nuansa hukum dalam pernyataan Paulus mengenai kematian dan naik banding
  choice: Paulus secara bersyarat menerima kematian apabila ia memang bersalah atas kejahatan yang patut dihukum mati, tetapi menolak penyerahan dirinya kepada para penuduh bila tuduhan mereka tidak beralasan.
  alternative: Paulus hanya berbicara secara retoris tanpa mengakui keabsahan hukuman atau proses hukum apa pun.
  rationale: Teks berbentuk argumentasi hukum bersyarat. Terjemahan mempertahankan kesediaan Paulus menerima akibat jika bersalah serta tuntutannya akan perlindungan hukum jika tuduhan itu tidak berdasar, tanpa menarik kesimpulan doktrinal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum 'bersalah', 'dihukum mati', 'tuduhan', dan 'naik banding' dipakai agar konteks pengadilan jelas. Ungkapan utama untuk χαρίσασθαι sengaja agak formal demi mempertahankan nuansa pemberian sebagai kemurahan, sedangkan bentuk yang lebih idiomatis disediakan dalam catatan kaki.
