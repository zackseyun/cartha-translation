  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: id
  text: Ketika para penuduh itu tampil, mereka tidak mengajukan tuduhan apa pun mengenai hal-hal jahat yang saya duga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka tidak mengajukan tuduhan apa pun mengenai kejahatan yang saya duga.” Kata Yunani ini secara harfiah berarti “hal-hal jahat” dan dapat merujuk secara umum kepada perbuatan salah, bukan hanya tindak pidana yang dirumuskan secara hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: tentang dia
  rationale: περί dengan pronomina relatif genitif memperkenalkan orang yang menjadi pokok perkara, yaitu Paulus. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukannya.
- source_word: σταθέντες
  choice: ketika ... berdiri untuk menyampaikan perkara
  rationale: Partisip aoris ini berfungsi temporal dan dalam konteks persidangan menggambarkan para penuduh yang tampil untuk mengemukakan perkara mereka. Tambahan 'untuk menyampaikan perkara' memperjelas fungsi tindakan tanpa mengubah isinya.
- source_word: οἱ κατήγοροι
  choice: para penuduhnya
  rationale: κατήγοροι menunjuk kepada orang-orang yang mengajukan tuduhan dalam konteks hukum. Bentuk posesif memperjelas bahwa mereka adalah para penuduh Paulus.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: mereka tidak mengajukan satu pun tuduhan
  rationale: Dalam konteks forensik, φέρειν αἰτίαν berarti mengajukan tuduhan. 'Satu pun' menyampaikan penegasan οὐδεμίαν secara wajar.
- source_word: ὧν
  choice: mengenai ... yang
  rationale: Pronomina relatif genitif jamak menghubungkan tuduhan dengan jenis perbuatan yang Festus duga. Susunan Indonesia ini menjaga hubungan tersebut tanpa menjadi kaku.
- source_word: ἐγὼ ὑπενόουν
  choice: yang saya duga telah dilakukannya
  rationale: ὑπονοέω menyatakan dugaan atau kecurigaan Festus sebelumnya. Bentuk imperfek tercermin melalui dugaan yang sudah ada ketika ia mendengar perkara; pelaku tersirat dibuat eksplisit agar kalimat Indonesia jelas.
- source_word: πονηρῶν
  choice: perbuatan jahat
  rationale: Bentuk netral jamak πονηρῶν dapat menunjuk secara umum kepada hal-hal atau perbuatan jahat. 'Perbuatan jahat' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi tindak pidana yang dirumuskan secara formal.
