translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-hukum yang jelas dan bermartabat. Terjemahan mengutamakan kealamian sambil mempertahankan keluasan makna πονηρῶν dan kontras antara dugaan Festus dengan tuduhan yang benar-benar diajukan.
