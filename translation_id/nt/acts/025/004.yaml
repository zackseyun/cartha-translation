  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: id
  text: Namun, Festus menjawab bahwa Paulus sedang ditahan di Kaisarea dan bahwa ia sendiri akan segera berangkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa ini memakai “untuk/menuju Kaisarea.” Makna tepat preposisi Yunani εἰς dalam ungkapan ini diperdebatkan; terjemahan utama memahaminya sebagai tempat Paulus ditahan.
    reason: Mempertahankan ketidakpastian frasa εἰς Καισάρειαν secara netral dan tidak mengklaim adanya varian naskah tertentu.
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: ditahan
  rationale: Dalam konteks tahanan yang berada dalam penjagaan pemerintah, bentuk pasif ini paling alami diterjemahkan 'ditahan'.
- source_word: ἐν τάχει
  choice: segera
  rationale: Ungkapan ini menyatakan bahwa keberangkatan Festus akan berlangsung dalam waktu dekat.
- source_word: ἐκπορεύεσθαι
  choice: berangkat ke sana
  rationale: Kata ini berarti pergi atau berangkat; 'ke sana' memperjelas tujuan yang tersirat, yakni Kaisarea, tanpa mengubah alur kalimat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Namun' menghubungkan jawaban Festus dengan permintaan sebelumnya; pengulangan 'bahwa' mempertahankan struktur laporan tidak langsung dari bahasa Yunani.
