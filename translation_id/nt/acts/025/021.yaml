  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: id
  text: Namun, ketika Paulus mengajukan banding agar ia tetap ditahan sampai Augustus mengambil keputusan[a], aku memerintahkan agar ia tetap ditahan sampai aku mengirimnya kepada Kaisar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Augustus” menerjemahkan gelar Yunani Σεβαστός, padanan dari gelar kekaisaran Latin Augustus. Dapat juga diterjemahkan “Kaisar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: naik banding
  rationale: Dalam konteks hukum Romawi, bentuk ini menunjuk pada pengajuan banding resmi. Ungkapan Indonesia 'naik banding' alami dan tepat secara yuridis.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: tetap ditahan / tetap ditahan
  rationale: Dalam konteks ini τηρέω menyatakan penahanan resmi. 'Tetap ditahan' menyampaikan makna kustodial sekaligus kesinambungan keadaan Paulus.
- source_word: διάγνωσιν
  choice: keputusan
  rationale: Kata ini menunjuk pada penetapan atau keputusan yudisial. 'Keputusan' tidak mempersempitnya menjadi sekadar pemeriksaan ataupun mengesankan vonis bersalah.
- source_word: Σεβαστοῦ
  choice: Kaisar Agustus
  rationale: Σεβαστός merupakan gelar kekaisaran yang sepadan dengan Latin Augustus. 'Kaisar Agustus' mempertahankan ciri gelarnya sambil menjelaskan bahwa yang dimaksud ialah penguasa kekaisaran, bukan nama pribadi tertentu.
- source_word: ἀναπέμψω
  choice: aku mengirimnya
  rationale: Dalam konteks ini Festus berbicara tentang mengirim Paulus kepada otoritas kekaisaran yang lebih tinggi. 'Mengirimnya' jelas dan alami; unsur arah dalam verba tidak perlu dibuat eksplisit.
- source_word: πρὸς Καίσαρα
  choice: kepada Kaisar
  rationale: Καίσαρ berfungsi sebagai gelar penguasa Romawi. 'Kepada Kaisar' mempertahankan penyebutan historis dan membedakan tujuan pengiriman dari frasa sebelumnya yang memakai gelar Σεβαστός.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan sudut pandang orang pertama Festus serta pengulangan gagasan penahanan dalam teks Yunani. Penambahan 'meminta' membuat hubungan sintaksis antara tindakan naik banding dan permohonan untuk tetap ditahan jelas dalam bahasa Indonesia.
