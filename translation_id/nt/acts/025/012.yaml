id: ACT.25.12
reference: Acts 25:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: id
  text: Kemudian Festus, setelah berunding dengan dewan, menjawab, “Engkau telah naik banding kepada Kaisar; kepada Kaisar engkau akan pergi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Penanda urutan waktu yang alami dalam narasi Indonesia.
- source_word: συλλαλήσας
  choice: setelah berunding
  rationale: Partisip aoris menunjukkan tindakan yang mendahului jawaban Festus; 'berunding' menyampaikan nuansa pembicaraan deliberatif.
- source_word: μετὰ τοῦ συμβουλίου
  choice: dengan dewan penasihatnya
  rationale: Dalam konteks pemerintahan Romawi, συμβούλιον menunjuk pada badan penasihat. Akhiran '-nya' memperjelas hubungan kontekstual dengan Festus tanpa mengubah identitas badan tersebut.
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang langsung dan sesuai dengan suasana hukum.
- source_word: Καίσαρα
  choice: Kaisar
  rationale: Mempertahankan gelar Romawi yang berfungsi sebagai sebutan bagi kaisar dalam konteks banding hukum.
- source_word: ἐπικέκλησαι
  choice: telah naik banding kepada
  rationale: Bentuk perfek medium dipakai dalam arti hukum, yaitu memohon agar perkara diperiksa oleh yurisdiksi Kaisar; 'naik banding' adalah ungkapan hukum Indonesia yang jelas.
- source_word: ἐπὶ Καίσαρα
  choice: kepada Kaisar
  rationale: Bersama verba gerak, frasa ini menyatakan tujuan menuju otoritas yang menjadi sasaran banding, sambil mempertahankan pengulangan retoris Yunani.
- source_word: πορεύσῃ
  choice: engkau akan pergi
  rationale: Menerjemahkan bentuk futurum sebagai gerak secara langsung dan tidak menambahkan gagasan pasif 'akan dikirim' yang tidak dinyatakan eksplisit.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat dengan nuansa persidangan. Pronomina ''engkau'' dipakai dalam ujaran langsung tunggal untuk mempertahankan kekhidmatan register Alkitab. Tidak diperlukan catatan kaki: alternatif ''menghadap Kaisar'' menjelaskan implikasi hukum, tetapi teks utama ''kepada Kaisar ... pergi'' lebih dekat pada bentuk dan ambiguitas ungkapan Yunani.'
