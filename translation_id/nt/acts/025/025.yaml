base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: id
  text: Namun, saya mendapati bahwa ia tidak telah melakukan apa pun yang setimpal dengan hukuman mati. Tetapi, karena ia sendiri telah mengajukan banding kepada Kaisar[a], saya memutuskan untuk mengirimnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Augustus”. Gelar Yunani Σεβαστός di sini merujuk kepada kaisar Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: saya mendapati
  rationale: Dalam konteks pemeriksaan perkara, verba ini menyatakan kesimpulan Festus setelah menilai kasus tersebut. 'Mendapati' alami dalam bahasa Indonesia dan tidak melebih-lebihkan tingkat formalitas putusan.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: tidak melakukan apa pun yang layak dihukum mati
  rationale: Ungkapan ini menyatakan bahwa tidak ada perbuatan yang pantas menerima hukuman mati. Rumusan tersebut jelas dan alami, sambil mempertahankan nuansa yudisial teks Yunani.
- source_word: πεπραχέναι
  choice: melakukan
  rationale: Bentuk perfektum ini merujuk pada tindakan yang telah dilakukan. Dalam klausa bahasa Indonesia, aspek lampau sudah jelas dari konteks pemeriksaan perkara.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: karena ia sendiri naik banding
  rationale: Genitif absolut menyatakan keadaan yang menjadi alasan keputusan Festus, sedangkan 'ia sendiri' mempertahankan penekanan pada subjek.
- source_word: ἐπικαλεσαμένου
  choice: naik banding
  rationale: Dalam konteks hukum Romawi, verba ini berarti mengajukan perkara kepada yurisdiksi kaisar. 'Naik banding' merupakan padanan hukum yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τὸν Σεβαστόν
  choice: Kaisar
  rationale: Σεβαστός adalah gelar kekaisaran Yunani yang sepadan dengan Augustus dan di sini menunjuk kepada kaisar Romawi, bukan khusus kepada tokoh historis Augustus.
- source_word: ἔκρινα
  choice: saya memutuskan
  rationale: Verba ini menyatakan keputusan resmi Festus; 'memutuskan' tepat dan alami dalam konteks prosedural.
- source_word: πέμπειν
  choice: untuk mengirimnya
  rationale: Objek tersirat diambil dari konteks dan perlu dinyatakan dengan akhiran '-nya' agar kalimat Indonesia jelas dan alami.
