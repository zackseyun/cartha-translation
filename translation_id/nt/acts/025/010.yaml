  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: id
  text: Namun, Paulus berkata, “Aku berdiri di hadapan pengadilan Kaisar, tempat aku harus diadili. Aku sama sekali tidak berbuat salah terhadap orang-orang Yahudi,[a] sebagaimana engkau sendiri tahu benar.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sama sekali tidak melakukan pelanggaran terhadap orang-orang Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “sebagaimana engkau sendiri mengetahuinya dengan lebih baik.” Bentuk komparatif Yunani ini dapat berfungsi secara idiomatis sebagai penegasan: “sebagaimana engkau sendiri tahu benar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: pengadilan
  rationale: Dalam konteks ini βῆμα menunjuk pada tempat atau lembaga resmi untuk mengadili di bawah kewenangan Romawi. “Pengadilan” alami dan jelas bagi pembaca Indonesia modern, sedangkan “kursi pengadilan” terlalu harfiah.
- source_word: Καίσαρος
  choice: Kaisar
  rationale: Mempertahankan gelar Romawi dan latar hukum historis dari teks Yunani.
- source_word: ἑστώς εἰμι
  choice: aku sedang berdiri
  rationale: Konstruksi perifrastis dengan partisip perfek dan εἰμί menekankan keadaan serta kedudukan hukum Paulus saat itu; bentuk ini mempertahankan gambaran konkret teks.
- source_word: οὗ με δεῖ κρίνεσθαι
  choice: dan di sinilah aku harus diadili
  rationale: οὗ merujuk kembali kepada pengadilan sebagai forum yang semestinya, sedangkan δεῖ menyatakan keharusan atau kepatutan hukum. “Di sinilah” memperjelas rujukan tempat tanpa mengubah tuntutan yurisdiksi Paulus.
- source_word: Ἰουδαίους
  choice: orang-orang Yahudi
  rationale: Dalam konteks ini istilah tersebut menunjuk secara luas kepada pihak Yahudi yang menurut tuduhan telah dirugikan Paulus; “orang-orang Yudea” akan terlalu sempit secara geografis.
- source_word: οὐδὲν ἠδίκησα
  choice: aku sama sekali tidak berbuat salah terhadap
  rationale: ἀδικέω mencakup berbuat salah, merugikan, atau bertindak tidak adil. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya moral sekaligus hukumnya.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: seperti yang engkau sendiri ketahui dengan lebih baik
  rationale: Terjemahan ini mempertahankan tekanan καὶ σύ (“engkau sendiri”), nuansa pengenalan yang penuh pada ἐπιγινώσκεις, dan bentuk komparatif κάλλιον tanpa mengubahnya secara diam-diam menjadi superlatif idiomatis.
theological_decisions:
- issue: Dasar keharusan Paulus diadili di pengadilan Kaisar
  choice: Mempertahankan pernyataan legal “di sinilah aku harus diadili” tanpa menjelaskan apakah keharusan itu bersifat prosedural, providensial, atau keduanya.
  alternative: “di sinilah seharusnya aku diadili” atau penjelasan eksplisit tentang kehendak Allah
  rationale: δεῖ menyatakan keharusan, tetapi ayat ini sendiri tidak menjabarkan sumber atau sifat keharusan itu; terjemahan tidak boleh menyelesaikan ketegangan tersebut secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku–engkau” dipakai sesuai register narasi Alkitab yang langsung namun tetap khidmat. Susunan kalimat mempertahankan penekanan pada kedudukan Paulus di pengadilan Kaisar dan tidak menghaluskan bentuk komparatif κάλλιον tanpa catatan.
