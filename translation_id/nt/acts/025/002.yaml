  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: id
  text: Maka imam-imam kepala dan orang-orang terkemuka di antara orang Yahudi mengajukan perkara terhadap Paulus kepada Festus[a], dan mereka mendesaknya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi tahu Festus tentang Paulus” atau “mengajukan tuduhan terhadap Paulus di hadapan Festus.” Kata Yunani yang dipakai dapat berarti memberitahukan suatu perkara dan, dalam konteks ini, tampaknya bernuansa hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: menyampaikan perkara mereka terhadap
  rationale: Dalam konteks hukum di hadapan gubernur, verba ini berarti mengajukan atau memaparkan suatu perkara kepada pejabat berwenang. Pilihan ini mempertahankan nuansa yuridis tanpa menganggap adanya dakwaan resmi yang tidak dinyatakan secara tegas.
- source_word: τέ
  choice: Maka
  rationale: Partikel penghubung ini meneruskan alur dari ayat sebelumnya; “Maka” wajar dalam narasi Indonesia dan menandai kaitan tersebut tanpa memberi penekanan berlebihan.
- source_word: αὐτῷ
  choice: kepada Festus
  rationale: Pronomina ini merujuk kepada Festus. Nama disebut untuk memperjelas rujukan secara alami dalam bahasa Indonesia.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Sebutan baku bagi kelompok pemimpin keimaman di Yerusalem; bentuk jamak sumber dipertahankan.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: para pemuka orang Yahudi
  rationale: πρῶτοι menunjuk orang-orang yang terkemuka secara sosial atau politik. “Para pemuka” alami dan tetap mencerminkan kedudukan elite mereka.
- source_word: κατὰ τοῦ Παύλου
  choice: terhadap Paulus
  rationale: κατά dengan genitif di sini bersifat adversatif dan menunjukkan bahwa perkara itu diarahkan untuk menentang atau menuduh Paulus.
- source_word: παρεκάλουν
  choice: mendesaknya
  rationale: Bentuk imperfek menggambarkan desakan yang berlangsung atau berulang. “Mendesak” sesuai dengan konteks politik-hukum dan lebih kuat daripada sekadar meminta.
- source_word: αὐτόν
  choice: -nya
  rationale: Akhiran pronominal merujuk kembali kepada Festus sebagai orang yang didesak dan menghasilkan ungkapan Indonesia yang ringkas serta alami.
