  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: id
  text: Sebab, menurut saya, tidak masuk akal mengirim seorang tahanan tanpa juga mencantumkan tuduhan-tuduhan terhadapnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjelaskan tuduhan-tuduhan terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: tidak masuk akal
  rationale: Ungkapan ini secara alami menyatakan sesuatu yang tidak berdasarkan pertimbangan yang wajar dan sesuai dengan penilaian administratif Festus.
- source_word: δοκεῖ μοι
  choice: menurut saya
  rationale: Pilihan ini mempertahankan sifat pribadi dan evaluatif dari konstruksi Yunani sambil terdengar alami dalam bahasa Indonesia modern.
- source_word: πέμποντα
  choice: jika saya mengirim
  rationale: Partisip ini menerangkan keadaan saat Festus mengirim tahanan; bentuk bersyarat-kontekstual ini menghasilkan kalimat Indonesia yang alami tanpa mengubah hubungan tindakannya.
- source_word: δέσμιον
  choice: seorang tahanan
  rationale: Dalam konteks hukum, istilah ini menunjuk kepada orang yang berada dalam tahanan.
- source_word: μὴ καὶ
  choice: tanpa juga
  rationale: Ungkapan ini menyampaikan ketidakpatutan mengirim tahanan tanpa menyertakan tindakan tambahan yang dimaksud, sekaligus mempertahankan daya aditif καί.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: tuduhan-tuduhan terhadapnya
  rationale: Dalam konteks peradilan, αἰτία berarti tuduhan atau dakwaan; bentuk jamak sumber dipertahankan.
- source_word: σημᾶναι
  choice: mencantumkan
  rationale: Dalam konteks surat pengantar administratif, kata ini secara alami berarti menyatakan atau memberitahukan secara tertulis; 'mencantumkan' cocok dengan pengiriman perkara kepada kaisar.
