  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: id
  text: Setelah beberapa hari berlalu, Raja Agripa dan Bernike tiba di Kaisarea untuk memberi salam kepada Festus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Setelah beberapa hari berlalu
  rationale: Konstruksi genitif absolut memberi latar waktu. Partikel δέ bersifat penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: Raja Agripa
  rationale: Susunan gelar diikuti nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap mempertahankan βασιλεύς sebagai gelar kerajaan.
- source_word: Βερνίκη
  choice: Bernike
  rationale: Transliterasi langsung dan lazim dalam tradisi Alkitab bahasa Indonesia, mencerminkan bentuk Yunani Βερνίκη.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: tiba di Kaisarea
  rationale: Dalam konteks perjalanan menuju suatu tempat, ungkapan ini secara alami menyatakan bahwa mereka mencapai Kaisarea.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: untuk memberi salam kepada Festus
  rationale: Partisip aoristus ini dapat menyatakan maksud atau keadaan penyerta. Ungkapan tersebut mempertahankan arti dasar menyapa atau memberi salam tanpa menambahkan nuansa penghormatan resmi yang tidak dinyatakan secara eksplisit.
- source_word: Φῆστον
  choice: Festus
  rationale: Bentuk nama yang baku dan dikenal dalam bahasa Indonesia.
