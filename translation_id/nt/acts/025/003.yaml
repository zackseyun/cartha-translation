  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: id
  text: meminta suatu kemurahan yang merugikan Paulus, yaitu agar Festus menyuruh orang membawa Paulus ke Yerusalem, sambil menyiapkan penyergapan untuk membunuhnya dalam perjalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: meminta suatu kemurahan yang merugikan Paulus
  rationale: Ungkapan ini menyatakan permintaan akan suatu kemurahan atau konsesi yang ditujukan untuk mencelakakan Paulus. Nama Paulus dipakai untuk memperjelas rujukan pronomina dalam cuplikan ayat yang berdiri sendiri.
- source_word: ὅπως
  choice: yaitu agar
  rationale: Memperkenalkan isi sekaligus tujuan permintaan secara wajar dalam bahasa Indonesia.
- source_word: μεταπέμψηται αὐτὸν
  choice: Festus menyuruh orang membawa dia
  rationale: Bentuk medial μεταπέμπομαι dapat berarti menyuruh memanggil atau mendatangkan seseorang. Terjemahan ini menampilkan tindakan kausatif yang sesuai dengan konteks; Festus disebut untuk memperjelas subjek tersirat.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Padanan arah yang alami dan tepat.
- source_word: ἐνέδραν ποιοῦντες
  choice: mereka merencanakan penyergapan
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan permintaan. 'Merencanakan penyergapan' alami dalam bahasa Indonesia dan sesuai dengan sifat plot tersebut.
- source_word: ἀνελεῖν αὐτὸν
  choice: untuk membunuhnya
  rationale: Dalam konteks ini ἀναιρέω dengan jelas berarti membunuh.
- source_word: κατὰ τὴν ὁδόν
  choice: di tengah jalan
  rationale: Ungkapan Indonesia yang alami untuk tindakan yang direncanakan terjadi dalam perjalanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah menjadi dua agar rangkaian partisipel Yunani mudah dipahami tanpa mengubah hubungan waktunya. Nama Paulus dan Festus dipakai untuk menghindari ketidakjelasan beberapa pronomina dalam ayat yang disajikan tersendiri.
