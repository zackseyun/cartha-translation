id: ACT.25.1
reference: Acts 25:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: id
  text: Maka, tiga hari setelah tiba di provinsi itu[a], Festus naik dari Kaisarea ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah memasuki provinsi itu” atau “setelah mulai memerintah provinsi itu.” Partisip Yunani ini dapat menunjuk pada tibanya Festus di provinsinya dan, secara tersirat, awal masa pemerintahannya di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan dan hubungan dengan kisah sebelumnya; “maka” mempertahankan daya penghubungnya secara ringkas dan wajar.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: setelah tiba di provinsi itu
  rationale: Partisip ini secara harfiah menyatakan masuk atau tiba di wilayah tersebut dan dalam konteks dapat menyiratkan mulai menjalankan pemerintahan. Terjemahan utama mempertahankan makna kedatangan tanpa menjadikan implikasi administratif sebagai makna eksplisit.
- source_word: ἐπαρχείᾳ
  choice: provinsi
  rationale: Menunjuk pada provinsi administratif Romawi; “provinsi” merupakan padanan historis yang langsung dan mudah dipahami.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: tiga hari setelah
  rationale: μετά dengan akusatif menyatakan urutan waktu. Susunan ini alami dalam bahasa Indonesia ketika digabungkan dengan partisip yang mendahuluinya.
- source_word: ἀνέβη
  choice: naik
  rationale: Mempertahankan ungkapan geografis lazim untuk perjalanan menuju Yerusalem, yang terletak lebih tinggi, tanpa meratakannya menjadi sekadar “pergi”.
- source_word: ἀπὸ Καισαρείας ... εἰς Ἱεροσόλυμα
  choice: dari Kaisarea ke Yerusalem
  rationale: Menyatakan dengan jelas tempat asal dan tujuan perjalanan sesuai struktur sumber.
- source_word: Φῆστος
  choice: Festus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
theological_decisions: []
