id: ACT.25.7
reference: Acts 25:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: id
  text: Ketika Paulus tiba, orang-orang Yahudi yang datang dari Yerusalem berdiri mengelilinginya dan mengajukan banyak tuduhan berat yang tidak dapat mereka buktikan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Ketika Paulus tiba
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. Nama Paulus diperjelas dari konteks untuk menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: περιέστησαν αὐτὸν
  choice: berdiri mengelilinginya
  rationale: Mempertahankan gambaran fisik bahwa para penuduh berdiri di sekeliling Paulus, tanpa menambahkan kadar permusuhan yang tidak dinyatakan secara eksplisit.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: orang-orang Yahudi yang datang dari Yerusalem
  rationale: Ἰουδαῖοι di sini menunjuk para penuduh Yahudi dari Yerusalem; unsur asal geografis sudah dinyatakan secara tersendiri. Kata kerja 'datang' alami dalam bahasa Indonesia, sedangkan nuansa harfiah 'turun' tidak diperlukan untuk kejelasan.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: banyak tuduhan berat
  rationale: αἰτιώματα menunjuk tuduhan dalam proses hukum, sedangkan βαρέα menyatakan bobot atau keseriusannya.
- source_word: καταφέροντες
  choice: mengajukan
  rationale: Dalam konteks hukum, verba ini berarti membawa atau melontarkan tuduhan terhadap seseorang; 'mengajukan' merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: yang tidak dapat mereka buktikan
  rationale: ἰσχύω dengan infinitif menyatakan kemampuan, dan ἀποδείκνυμι berarti membuktikan atau menunjukkan kebenaran. Susunan ini ringkas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi hukum dibuat jelas bagi pembaca umum tanpa menghilangkan gambaran adegan persidangan.
