base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: id
  text: Lalu Agripa berkata kepada Festus, “Saya sendiri[a] ingin mendengar orang itu.” “Besok,” katanya,[b] “engkau akan mendengarnya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saya juga ingin mendengar orang itu,” dengan memahami καὶ αὐτός terutama dalam arti aditif, bukan penegasan.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Yunani memakai bentuk kini historis: “ia berkata.” Terjemahan “katanya” memakai bentuk pelapor yang lazim dalam bahasa Indonesia.'
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “engkau akan mendengar darinya,” yaitu mendengar dia berbicara secara langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai kelanjutan narasi dengan kontras ringan; 'Lalu' memberi alur Indonesia yang wajar tanpa mempertegas pertentangan.
- source_word: πρὸς τὸν Φῆστον
  choice: berkata kepada Festus
  rationale: Konstruksi πρός dalam konteks ujaran secara idiomatis menyatakan arah perkataan.
- source_word: Ἐβουλόμην
  choice: ingin
  rationale: Imperfek βούλομαι menyatakan keinginan Agripa; dalam konteks dialog, 'ingin' alami dan tidak memaksakan apakah nuansanya duratif atau kesantunan.
- source_word: καὶ αὐτὸς
  choice: Saya sendiri
  rationale: αὐτός memberi penegasan pada subjek, sedangkan καί dapat mendukung nuansa aditif; teks utama menampilkan penegasan dan catatan mempertahankan alternatif aditif.
- source_word: τοῦ ἀνθρώπου
  choice: orang itu
  rationale: Merujuk kepada Paulus sebagai orang tertentu yang sudah menjadi pokok pembicaraan; bentuk ini alami dan tidak menambahkan penilaian.
- source_word: ἀκοῦσαι
  choice: mendengar
  rationale: Mempertahankan kata kerja umum Yunani yang dalam konteks ini berarti mendengar orang itu berbicara.
- source_word: Αὔριον
  choice: Besok
  rationale: Padanan langsung bagi keterangan waktu tersebut.
- source_word: φησίν
  choice: katanya
  rationale: Bentuk kini historis Yunani dipertahankan melalui bentuk pelapor Indonesia yang tidak secara eksplisit menandai waktu lampau; catatan menjelaskan ciri naratifnya.
- source_word: ἀκούσῃ αὐτοῦ
  choice: engkau akan mendengarnya
  rationale: Konstruksi ἀκούω dengan genitif dapat berarti mendengar orang tersebut berbicara; terjemahan ringkas ini mempertahankan rujukan langsung kepada Paulus.
