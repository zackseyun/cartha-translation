id: ACT.25.24
reference: Acts 25:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: id
  text: Lalu Festus berkata, “Raja Agripa dan semua pria yang hadir bersama kami, Anda semua melihat orang ini. Mengenai dia, seluruh kumpulan orang Yahudi telah mengajukan permohonan kepada saya, baik di Yerusalem maupun di sini, sambil berteriak bahwa dia tidak boleh hidup lebih lama lagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησιν
  choice: berkata
  rationale: Kala kini historis Yunani memberi vivuitas pada narasi, tetapi dalam narasi Indonesia bentuk lampau biasanya tidak ditandai pada verba; “berkata” terdengar alami tanpa menghilangkan fungsi naratifnya.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: semua pria yang hadir bersama kami
  rationale: Mempertahankan rujukan kepada hadirin laki-laki dan gagasan kehadiran bersama Festus.
- source_word: θεωρεῖτε τοῦτον
  choice: kalian melihat orang ini
  rationale: Mengungkapkan tindakan Festus mengarahkan perhatian para hadirin kepada Paulus dengan bahasa Indonesia yang wajar.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: seluruh kalangan orang Yahudi
  rationale: “Kalangan” menyampaikan kelompok kolektif yang dimaksud dalam rangkuman retoris Festus tanpa harus menyatakan bahwa setiap orang Yahudi tanpa kecuali terlibat.
- source_word: ἐνέτυχόν μοι
  choice: telah mengajukan permohonan kepada saya
  rationale: Mencerminkan tindakan menghadap seorang pejabat dengan permintaan dalam suasana hukum, tanpa menyamakannya dengan banding teknis Paulus.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: baik di Yerusalem maupun di sini
  rationale: Mempertahankan konstruksi korelatif dan acuan tempat kini, yaitu Kaisarea.
- source_word: βοῶντες
  choice: sambil berteriak
  rationale: Menjaga gambaran desakan keras dan nyaring yang dinyatakan oleh verba Yunani.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: bahwa dia tidak boleh hidup lebih lama lagi
  rationale: Menjaga nuansa keharusan atau kepatutan yang dituntut para penentang tanpa mengubahnya menjadi rumusan eksplisit hukuman mati.
theological_decisions:
- issue: Rujukan kepada orang Yahudi dalam konteks hukum yang bermusuhan
  choice: Mempertahankan “orang Yahudi” serta menerjemahkan ungkapan kolektifnya sebagai “seluruh kalangan orang Yahudi.”
  alternative: “semua orang Yahudi”; “para pemimpin Yahudi”; “seluruh kerumunan orang Yahudi”
  rationale: Teks Yunani secara eksplisit menyebut orang Yahudi dan tidak membatasinya hanya kepada para pemimpin. Namun, ungkapan πλῆθος bersifat kolektif dalam rangkuman Festus, sehingga terjemahan tidak perlu menyiratkan bahwa setiap individu Yahudi tanpa kecuali menentang Paulus.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. “Saya” sesuai dengan tuturan resmi Festus, sedangkan “kalian” secara jelas menyapa Raja Agripa beserta para pria lain yang hadir. Tidak ada catatan kaki karena alternatif leksikal dapat diwakili secara memadai dalam teks utama.
