  to: Lalu Festus berkata, “Raja Agripa dan semua pria yang hadir bersama kami, Anda semua melihat orang ini. Mengenai dia, seluruh kumpulan orang Yahudi telah mengajukan permohonan kepada saya, baik di Yerusalem maupun di sini, sambil berteriak bahwa dia tidak boleh hidup lebih lama lagi.”
