  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: id
  text: Karena saya bingung mengenai penyelidikan perkara-perkara ini[a], saya bertanya apakah dia bersedia[b] pergi ke Yerusalem dan diadili di sana mengenai perkara-perkara itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengenai perselisihan tentang perkara-perkara ini.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ingin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: karena saya kebingungan
  rationale: Partisipel ini menyatakan bahwa Festus tidak tahu bagaimana menangani persoalan tersebut; hubungan sebab dengan verba utama dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: ζήτησιν
  choice: penyelidikan
  rationale: Dalam konteks hukum-administratif ini, kata tersebut menunjuk pada pemeriksaan atau penyelidikan suatu perkara, meskipun makna 'perselisihan' juga mungkin.
- source_word: περὶ τούτων
  choice: mengenai ... perkara-perkara ini
  rationale: Ungkapan ini mempertahankan rujukan demonstratif kepada hal-hal yang sedang diperkarakan dan terdengar wajar dalam konteks hukum.
- source_word: ἔλεγον
  choice: saya bertanya
  rationale: Secara harfiah berarti 'saya berkata', tetapi klausa tak langsung dengan εἰ menunjukkan bahwa perkataan itu berfungsi sebagai pertanyaan.
- source_word: εἰ βούλοιτο
  choice: apakah dia bersedia
  rationale: Bentuk optatif dalam wacana tak langsung menyampaikan isi pertanyaan Festus; 'bersedia' mencakup kehendak atau kesediaan Paulus untuk pergi.
- source_word: πορεύεσθαι
  choice: pergi
  rationale: Padanan Indonesia yang paling alami dan memadai untuk tindakan menuju Yerusalem.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: κἀκεῖ
  choice: dan ... di sana
  rationale: Mempertahankan koordinasi serta penunjukan lokasi dalam susunan Indonesia yang alami.
- source_word: κρίνεσθαι
  choice: diadili
  rationale: Bentuk pasif ini paling wajar dalam konteks proses hukum dan tetap menyampaikan gagasan bahwa perkaranya akan diputuskan.
- source_word: περὶ τούτων
  choice: mengenai perkara-perkara itu
  rationale: Pengulangan mempertahankan rujukan eksplisit Yunani kepada pokok-pokok perkara yang sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum tanpa menjadi kaku. Kata ganti “saya” sesuai dengan tuturan Festus kepada Agripa; pengulangan “perkara-perkara” mempertahankan rujukan Yunani secara jelas.
