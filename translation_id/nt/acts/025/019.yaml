  terminology: “Agama mereka sendiri” adalah pilihan yang tepat untuk δεισιδαιμονία mengingat ambiguitas nada istilah itu; catatan kaki dengan alternatif “takhayul” mempertahankan kemungkinan nuansa merendahkan. “Seseorang bernama Yesus” dengan baik menyampaikan jarak atau ketidakakraban Festus.
