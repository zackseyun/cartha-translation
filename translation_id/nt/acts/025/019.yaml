  source_fidelity: 'Revisi diperlukan untuk mencerminkan καί sebagai penambahan, bukan pertentangan: “tetapi” sebelum klausa tentang Paulus tidak memiliki padanan langsung dalam teks Yunani. Frasa “yang Paulus katakan hidup” juga menyatakan ἔφασκεν dengan lebih eksplisit daripada “yang menurut Paulus hidup,” sambil tetap mempertahankan ini sebagai laporan Festus.'
