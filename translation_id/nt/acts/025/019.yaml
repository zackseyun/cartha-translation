source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: id
  text: Sebaliknya, mereka mempunyai beberapa perselisihan dengannya mengenai agama mereka sendiri[a] dan mengenai seseorang bernama Yesus yang telah mati, yang Paulus katakan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “takhayul mereka sendiri.” Istilah Yunani ini dapat digunakan secara netral untuk agama atau secara lebih merendahkan oleh orang luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: beberapa hal ... berselisih
  rationale: Kata ini menunjuk pada perkara yang diperdebatkan, bukan sekadar pertanyaan netral. Susunan ini alami dalam bahasa Indonesia dan mempertahankan nuansa perselisihan.
- source_word: δέ
  choice: Sebaliknya
  rationale: Dalam konteksnya, Festus mempertentangkan dakwaan pidana yang ia harapkan dengan persoalan yang sebenarnya diajukan.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: tentang agama mereka sendiri
  rationale: δεισιδαιμονία dapat berarti agama secara netral atau takhayul secara merendahkan. 'Agama' tidak memaksakan nada negatif, sedangkan 'mereka sendiri' mempertahankan jarak sudut pandang Festus.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: dan tentang seseorang bernama Yesus
  rationale: τινος menyampaikan cara Festus menyebut Yesus dengan berjarak atau tanpa keakraban. Ungkapan ini lebih alami daripada 'seorang Yesus tertentu' dalam bahasa Indonesia.
- source_word: τεθνηκότος
  choice: yang telah mati
  rationale: Partisipel perfek menyatakan keadaan sebagai akibat kematian dan membentuk kontras dengan pernyataan bahwa Yesus hidup.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: tetapi yang menurut Paulus hidup
  rationale: Ungkapan ini menyajikan isi pernyataan Paulus dari sudut pandang laporan Festus tanpa menjadikannya penegasan langsung narator. 'Menurut Paulus' tidak menyiratkan bahwa klaim itu pasti palsu.
theological_decisions:
- issue: Makna δεισιδαιμονία dalam ucapan Festus
  choice: agama mereka sendiri
  alternative: takhayul mereka sendiri
  rationale: Istilah Yunani dapat netral atau bernada merendahkan. Teks utama menghindari memasukkan penghinaan yang tidak pasti, sementara catatan kaki mempertahankan kemungkinan tersebut.
- issue: Penyajian pernyataan tentang Yesus yang hidup
  choice: yang menurut Paulus hidup
  alternative: yang Paulus nyatakan hidup
  rationale: Ini tetap merupakan laporan Festus mengenai pernyataan Paulus, bukan penegasan langsung narator dalam klausa ini, dan tidak menyangkal kesaksian tentang kebangkitan di bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Seseorang bernama Yesus' mempertahankan jarak Festus dengan cara yang alami; penanda [a] ditempatkan langsung setelah frasa yang dijelaskan.
