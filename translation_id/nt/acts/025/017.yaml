  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: id
  text: Jadi, ketika mereka telah berkumpul di sini, saya tidak menunda. Keesokan harinya saya duduk di kursi pengadilan[a] dan memerintahkan agar orang itu dibawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saya mengambil tempat di tribunal.” Kata Yunani βῆμα menunjuk pada kursi resmi hakim atau panggung pengadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: ketika mereka berkumpul
  rationale: Partisip aoris dalam konstruksi genitif absolut; terjemahan ini menyampaikan berkumpulnya para penuduh atau pihak terkait tanpa menambahkan identitas yang tidak dinyatakan.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kelanjutan sekaligus simpulan dalam penuturan Festus dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐνθάδε
  choice: di sini
  rationale: Padanan langsung dan wajar untuk adverbia tempat dalam konteks ini.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: saya tidak menunda-nunda
  rationale: Ungkapan idiomatis yang berarti tidak menangguhkan proses; bentuk ini alami dan mempertahankan penekanan bahwa tidak ada penundaan.
- source_word: τῇ ἑξῆς
  choice: Keesokan harinya
  rationale: Menyampaikan idiom waktu yang menunjuk pada hari berikutnya secara ringkas dan alami.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: saya duduk di kursi pengadilan
  rationale: βῆμα di sini adalah tempat duduk resmi pejabat yang mengadili; pilihan ini mempertahankan latar yudisial tanpa memakai istilah yang terlalu teknis.
- source_word: ἐκέλευσα
  choice: memerintahkan
  rationale: Menyatakan perintah resmi Festus dalam kapasitasnya sebagai pejabat pengadilan.
- source_word: ἀχθῆναι
  choice: agar ... dibawa menghadap
  rationale: Bentuk pasif dari ἄγω berarti dibawa; 'menghadap' memperjelas secara wajar tujuan pembawaan dalam konteks sidang tanpa menyiratkan tindakan tambahan.
- source_word: τὸν ἄνδρα
  choice: orang itu
  rationale: Merujuk kepada Paulus sebagai laki-laki yang telah disebut dalam konteks; 'orang itu' alami dalam bahasa Indonesia dan tidak menambahkan sebutan 'terdakwa' yang tidak eksplisit.
