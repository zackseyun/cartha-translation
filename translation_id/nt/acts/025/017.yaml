translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang lugas dan bermartabat. Kata ganti “saya” sesuai dengan pidato Festus kepada Agripa. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
