id: ACT.25.9
reference: Acts 25:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: id
  text: Namun Festus, yang ingin mengambil hati orang-orang Yahudi[a], menjawab Paulus, “Apakah kamu mau pergi ke Yerusalem dan diadili di sana mengenai perkara-perkara ini di hadapanku[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi orang-orang Yahudi suatu bantuan.” Dalam konteks ini, “orang-orang Yahudi” mengacu kepada para pendakwa atau pemimpin Yahudi yang mendesak perkara terhadap Paulus, bukan kepada setiap orang Yahudi tanpa kecuali.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau “diadili di bawah wewenangku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: yang ingin
  rationale: Partisipel kini menyatakan motif Festus yang sedang berlangsung; bentuk ini wajar dalam bahasa Indonesia dan tidak melebih-lebihkan niatnya.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan luas dalam teks Yunani; konteks mempersempit acuannya kepada para pendakwa atau pemimpin Yahudi yang mengajukan perkara.
- source_word: χάριν καταθέσθαι
  choice: mengambil hati
  rationale: Ungkapan idiomatis ini menyampaikan usaha memperoleh goodwill dengan memberikan sesuatu yang menyenangkan pihak lain. Catatan kaki mempertahankan alternatif yang lebih harfiah dan kurang bernuansa politis.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: menjawab Paulus
  rationale: Dalam narasi Yunani, rangkaian ‘menjawab ... berkata’ lazim berfungsi sebagai pengantar ujaran; bahasa Indonesia alami cukup memakai ‘menjawab’.
- source_word: Θέλεις
  choice: Apakah kamu mau
  rationale: Pertanyaan langsung mengenai kemauan Paulus, disampaikan dengan bentuk modern dan jelas.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: pergi ke Yerusalem
  rationale: Bahasa Indonesia lazim tidak memakai ‘naik’ untuk perjalanan ke Yerusalem kecuali arah geografis perlu ditonjolkan; makna geraknya tetap terpelihara secara alami.
- source_word: περὶ τούτων
  choice: mengenai perkara-perkara ini
  rationale: ‘Perkara’ sesuai dengan konteks hukum tanpa mempersempit rujukannya secara khusus menjadi ‘dakwaan’.
- source_word: κριθῆναι
  choice: diadili
  rationale: Dalam konteks pengadilan, bentuk pasif κρίνω secara alami berarti menjalani proses peradilan; ‘diadili’ lebih jelas daripada ‘dihakimi’ dalam bahasa Indonesia hukum modern.
- source_word: ἐπ’ ἐμοῦ
  choice: di hadapanku
  rationale: Mempertahankan ambiguitas antara kehadiran Festus dan kewenangannya sebagai pejabat yang memimpin pemeriksaan perkara.
theological_decisions:
- issue: Kemungkinan pembacaan anti-Yahudi atas τοῖς Ἰουδαίοις
  choice: Memakai ‘orang-orang Yahudi’ dalam teks utama dengan penjelasan kontekstual dalam catatan kaki.
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks sumber memakai istilah etnoreligius yang luas, tetapi konteks menunjuk kepada para pendakwa atau pemimpin yang mendesak perkara ini, bukan semua orang Yahudi tanpa kecuali.
- issue: Nuansa peran Festus dalam ἐπ’ ἐμοῦ
  choice: di hadapanku
  alternative: olehku; di bawah wewenangku
  rationale: Pilihan ini tidak memutuskan secara berlebihan apakah Festus dimaksudkan sebagai hakim tunggal atau pejabat yang memimpin sidang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Mengambil hati’ dipakai secara idiomatis tanpa menyatakan motif manipulatif sekuat ‘mencari muka’. Sapaan ‘kamu’ mengikuti ujaran langsung seorang pejabat kepada Paulus dan tetap mudah dipahami pembaca umum.
