revisions:
- from: Kepada mereka aku menjawab bahwa bukanlah kebiasaan orang Romawi untuk menyerahkan seseorang sebagai suatu kemurahan[a] sebelum tertuduh berhadapan langsung dengan para penuduhnya dan mendapat kesempatan untuk membela diri terhadap tuduhan itu.
  to: Kepada mereka aku menjawab bahwa bukan kebiasaan bangsa Romawi untuk menyerahkan seseorang begitu saja[a] sebelum tertuduh berhadapan dengan para penuduhnya dan mendapat kesempatan untuk membela diri terhadap tuduhan itu.
  rationale: Revisi mengganti ungkapan yang tidak idiomatis dengan "menyerahkan seseorang begitu saja", yang dalam konteks hukum menyampaikan bahwa terdakwa tidak boleh diserahkan kepada pihak penuduh tanpa prosedur yang semestinya. Catatan kaki mempertahankan alternatif yang mencerminkan nuansa χαρίζεσθαι. Istilah hukum dan urutan logis sumber tetap dipertahankan.
