  - severity: low
    issue: Subjek kolektif dan konstruksi pembuka dapat dibuat lebih alami.
    rationale: '"Bukan kebiasaan bangsa Romawi" lebih lazim daripada "bukanlah kebiasaan orang Romawi" dalam pernyataan tentang praktik hukum Romawi.'
