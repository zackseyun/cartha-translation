  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: id
  text: Kepada mereka aku menjawab bahwa bukan kebiasaan bangsa Romawi untuk menyerahkan seseorang begitu saja[a] sebelum tertuduh berhadapan dengan para penuduhnya dan mendapat kesempatan untuk membela diri terhadap tuduhan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkan seseorang sebagai suatu bantuan”; kata Yunani ini dapat menyiratkan menyerahkan seseorang untuk mengabulkan permintaan pihak lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: kebiasaan
  rationale: Menunjukkan kebiasaan atau praktik yang sudah berlaku; pilihan ini alami dalam konteks hukum-administratif.
- source_word: Ῥωμαίοις
  choice: orang Romawi
  rationale: Datif jamak merujuk kepada orang Romawi sebagai masyarakat yang memiliki tata hukum, tanpa mempersempitnya hanya kepada pejabat.
- source_word: χαρίζεσθαί
  choice: menyerahkan ... sebagai suatu kemurahan
  rationale: Kata ini bukan sekadar berarti menyerahkan, tetapi menyiratkan bahwa seseorang diserahkan untuk mengabulkan permintaan atau sebagai kemurahan kepada pihak lain.
- source_word: τινα ἄνθρωπον
  choice: seseorang
  rationale: Ungkapan Yunani bermakna siapa pun atau seseorang dalam konteks hukum; bahasa Indonesia tidak perlu menandai gender gramatikal maskulin.
- source_word: ὁ κατηγορούμενος
  choice: tertuduh
  rationale: Partisip substantival ini menunjuk orang yang sedang dikenai tuduhan; 'tertuduh' ringkas dan sesuai dengan konteks hukum.
- source_word: κατὰ πρόσωπον
  choice: berhadapan langsung
  rationale: Menyampaikan idiom perjumpaan muka dengan muka secara alami dan jelas dalam bahasa Indonesia.
- source_word: τόπον ... ἀπολογίας
  choice: kesempatan untuk membela diri
  rationale: τόπος di sini berarti kesempatan atau ruang, sedangkan ἀπολογία adalah pembelaan terhadap dakwaan.
- source_word: ἐγκλήματος
  choice: tuduhan
  rationale: Merujuk pada tuduhan atau dakwaan hukum; 'tuduhan' mudah dipahami dan tetap sesuai dengan register resmi.
