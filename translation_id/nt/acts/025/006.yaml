id: ACT.25.6
reference: Acts 25:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: id
  text: Setelah tinggal di antara mereka tidak lebih dari delapan atau sepuluh hari, ia turun ke Kaisarea. Keesokan harinya, setelah duduk di kursi pengadilan[a], ia memerintahkan agar Paulus dibawa masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setelah duduk di tempat pengadilan.” Kata Yunani βῆμα menunjuk pada tempat duduk atau panggung resmi untuk mengadili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Setelah tinggal di antara mereka
  rationale: Partisip aoristus menyatakan tindakan yang mendahului tindakan utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan sosial-lokatif ἐν αὐτοῖς.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: tidak lebih dari delapan atau sepuluh hari
  rationale: Menerjemahkan bentuk komparatif negatif secara langsung tanpa mengubah pilihan angka yang tidak pasti menjadi jumlah yang pasti.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: ia turun ke Kaisarea
  rationale: Mempertahankan ungkapan arah perjalanan dari Yerusalem menuju Kaisarea sambil mengubah konstruksi partisip menjadi klausa Indonesia yang alami.
- source_word: τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Padanan temporal yang ringkas, jelas, dan lazim untuk hari sesudah kedatangannya.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: setelah duduk di kursi pengadilan
  rationale: βῆμα dalam konteks ini menunjuk tempat duduk resmi pejabat yang mengadili. Terjemahan ini mempertahankan tindakan duduk dan fungsi yudisialnya.
- source_word: ἐκέλευσεν
  choice: ia memerintahkan
  rationale: Menyampaikan perintah resmi dalam suasana pengadilan dengan ragam bahasa yang wajar dan bermartabat.
- source_word: τὸν Παῦλον ἀχθῆναι
  choice: agar Paulus dibawa masuk
  rationale: Mempertahankan bentuk pasif dan gerak tersirat menuju tempat persidangan tanpa menambahkan bahwa Paulus sudah diadili atau dihukum.
theological_decisions: []
