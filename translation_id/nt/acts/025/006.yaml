  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani dengan tepat: tinggal bersama/di antara mereka untuk jangka yang dibatasi tetapi tidak pasti (“delapan atau sepuluh hari”), perjalanan turun ke Kaisarea, tindakan pada hari berikutnya, duduk pada βῆμα, perintah resmi, serta Paulus yang dibawa masuk. Urutan temporal partisip-partisip Yunani dipertahankan secara jelas dan alami.'
