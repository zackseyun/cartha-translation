  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Susunan partisip Yunani diungkapkan melalui klausa temporal agar alami, sedangkan istilah hukum tetap dibuat mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
