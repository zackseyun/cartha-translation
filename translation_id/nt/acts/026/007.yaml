id: ACT.26.7
reference: Acts 26:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: id
  text: yang diharapkan oleh kedua belas suku kita untuk dicapai[a], sementara mereka dengan sungguh-sungguh beribadah kepada Allah[b] siang dan malam. Mengenai harapan inilah aku dituduh oleh orang-orang Yahudi[c], ya Raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa kita yang terdiri atas dua belas suku.” Bahasa Yunani memakai bentuk kolektif tunggal yang menunjuk kepada Israel sebagai umat dua belas suku.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melayani Allah.” Kata Yunani yang dipakai dapat berarti melakukan pelayanan keagamaan atau beribadah kepada Allah.
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks hukum ini, ungkapan tersebut menunjuk kepada orang-orang Yahudi yang menuduh Paulus, bukan kepada semua orang Yahudi tanpa kecuali.
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: yang hendak dicapai
  rationale: Mengungkapkan arah menuju sasaran yang dirujuk oleh kata ganti relatif, yaitu janji pada ayat sebelumnya, secara alami dalam bahasa Indonesia.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: kedua belas suku kita
  rationale: Menyampaikan kolektif tunggal yang menunjuk kepada umat Israel sebagai bangsa dua belas suku; catatan kaki mempertahankan nuansa kolektifnya.
- source_word: ἐν ἐκτενείᾳ
  choice: dengan sungguh-sungguh
  rationale: Menjaga makna ketekunan dan intensitas pengabdian tanpa memakai istilah teknis.
- source_word: νύκτα καὶ ἡμέραν
  choice: siang dan malam
  rationale: Ungkapan Indonesia yang wajar untuk tindakan yang terus-menerus, meskipun urutannya dibalik dari bahasa Yunani demi kealamian.
- source_word: λατρεῦον
  choice: beribadah kepada Allah
  rationale: Dalam konteks pengabdian religius Israel, verba ini menyatakan pelayanan sakral atau penyembahan kepada Allah. Objek yang tersirat dibuat eksplisit agar jelas.
- source_word: ἐλπίζει καταντῆσαι
  choice: hendak dicapai
  rationale: Bersama subjeknya, frasa ini menyatakan bahwa kedua belas suku berharap sampai pada atau memperoleh sasaran janji tersebut; konstruksi Indonesia menghindari pengulangan 'berharap' karena 'pengharapan' segera muncul pada kalimat berikutnya.
- source_word: περὶ ἧς ἐλπίδος
  choice: mengenai pengharapan inilah
  rationale: Mempertahankan hubungan topikal περί dan penekanan pada pengharapan yang sama tanpa menjadikannya secara tegas sebab tuduhan.
- source_word: ἐγκαλοῦμαι
  choice: aku dituduh
  rationale: Menyampaikan makna pasif yuridis yang sesuai dengan konteks pembelaan Paulus.
- source_word: ὑπὸ Ἰουδαίων
  choice: oleh orang-orang Yahudi
  rationale: Padanan Indonesia yang langsung dan wajar; catatan menjelaskan bahwa frasa itu menunjuk kepada para penuduh dalam perkara ini, bukan seluruh orang Yahudi.
- source_word: βασιλεῦ
  choice: ya Raja
  rationale: Mempertahankan bentuk sapaan langsung dan hormat kepada Agripa dalam bahasa Indonesia modern.
theological_decisions:
- issue: Objek tersirat dari λατρεῦον
  choice: beribadah kepada Allah
  alternative: melayani; menyembah
  rationale: Bahasa Yunani tidak menyebut objek secara eksplisit, tetapi dalam konteks pengabdian religius Israel objeknya secara alami adalah Allah. Penambahan ini memperjelas tanpa memasukkan klaim teologis baru.
- issue: Rujukan pengharapan
  choice: Dibiarkan menunjuk kembali kepada janji pada ayat sebelumnya tanpa menjelaskan isinya dalam ayat ini
  alternative: Menyebut kebangkitan secara eksplisit; menjadikannya pengharapan umum
  rationale: Konteks yang lebih luas menghubungkannya dengan janji Allah dan tema kebangkitan, tetapi ayat ini sendiri tidak mengulangi isi janji itu. Terjemahan mempertahankan keterkaitan sekaligus ketakterangan tersebut.
- issue: Cakupan ὑπὸ Ἰουδαίων
  choice: orang-orang Yahudi, dengan klarifikasi kontekstual dalam catatan kaki
  alternative: semua orang Yahudi; sejumlah orang Yahudi
  rationale: Teks menyebut para penuduh sebagai orang Yahudi tetapi tidak membenarkan generalisasi universal; penambahan 'sejumlah' ke teks utama juga akan lebih spesifik daripada bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “ya Raja” mempertahankan daya retoris bentuk vokatif. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan; [b] mengikuti sapaan agar semua penanda tidak bertumpuk, tetapi isinya secara khusus menerangkan “beribadah kepada Allah”.
