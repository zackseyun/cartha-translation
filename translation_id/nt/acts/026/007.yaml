review_pass:
  verdict: revise
  source_fidelity: Frasa utama perlu menyatakan bahwa kedua belas suku itu berharap mencapai sasaran tersebut. Draf “yang hendak dicapai” menyatakan maksud/masa depan pencapaian, bukan unsur ἐλπίζει (“berharap”). Selebihnya, hubungan dengan janji pada ayat sebelumnya, ketekunan ibadah, tuduhan yuridis, dan sapaan kepada raja tersampaikan dengan setia.
  naturalness: Bahasa draf umumnya baku dan alami. “Yang diharapkan oleh kedua belas suku kita untuk dicapai” secara jelas mempertahankan unsur harapan dan tetap wajar dalam ragam Indonesia formal. Penanda catatan [b] perlu ditempatkan pada “beribadah kepada Allah”, bukan setelah “ya Raja”, agar jangkar catatan sesuai unsur yang diterangkan.
  terminology: “Kedua belas suku kita,” “beribadah kepada Allah,” “harapan,” “orang-orang Yahudi,” dan “ya Raja” sesuai konteks serta ragam modern baku. Catatan kolektif untuk δωδεκάφυλον tepat. Klarifikasi pada “orang-orang Yahudi” sebaiknya tidak disebut “secara harfiah” karena teks utama sudah memakai padanan langsung yang sama.
  issues:
  - severity: medium
    issue: Unsur “berharap” (ἐλπίζει) tidak dinyatakan secara memadai dalam “yang hendak dicapai”.
    rationale: “Hendak” terutama menandakan niat atau tindakan yang akan dilakukan, sedangkan sumber menyatakan pengharapan kolektif untuk mencapai sasaran janji itu.
  - severity: medium
    issue: Penanda catatan [b] tidak melekat pada “beribadah kepada Allah”.
    rationale: Catatan [b] membahas λατρεύω/“beribadah kepada Allah”, tetapi diletakkan sesudah “ya Raja”, sehingga jangkar catatan tidak sesuai dengan unsur yang dijelaskan.
  - severity: low
    issue: Catatan [c] menyebut “Secara harfiah” padahal teks utama sudah merupakan padanan langsung yang sama.
    rationale: Pengantar itu redundan dan dapat dihilangkan tanpa mengubah fungsi klarifikasi konteks hukum.
  revised_text: yang diharapkan oleh kedua belas suku kita untuk dicapai[a], sementara mereka dengan sungguh-sungguh beribadah kepada Allah[b] siang dan malam. Mengenai harapan inilah aku dituduh oleh orang-orang Yahudi[c], ya Raja.
