base_translation:
  language: en
  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: id
  text: dengan menyelamatkan engkau dari bangsa ini dan dari bangsa-bangsa lain, kepada mereka Aku mengutus engkau
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: dengan menyelamatkan
  rationale: Partisipel kini medium ἐξαιρέω menyatakan tindakan Yesus yang menyelamatkan atau melepaskan Paulus dari pihak-pihak yang memusuhinya. Bentuk ini juga menghubungkan ayat secara alami dengan kalimat sebelumnya.
- source_word: τοῦ λαοῦ
  choice: bangsa ini
  rationale: Dalam pertentangan dengan τὰ ἔθνη, λαός menunjuk kepada bangsa Yahudi/Israel. Kata 'ini' membantu menyampaikan rujukan kontekstual tanpa memasukkan sebutan 'Yahudi' yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam kerangka Yahudi–non-Yahudi di Kisah Para Rasul, ἔθνη menunjuk kepada bangsa-bangsa bukan Yahudi. 'Bangsa-bangsa lain' menyampaikan makna itu secara alami dan tetap mempertahankan unsur 'bangsa-bangsa'.
- source_word: εἰς οὓς
  choice: kepada merekalah
  rationale: εἰς dengan pronomina relatif mengikuti verba pengutusan dan secara idiomatis berarti 'kepada mereka'. Partikel '-lah' memperjelas bahwa bangsa-bangsa lain merupakan tujuan pengutusan.
- source_word: ἀποστέλλω
  choice: Aku mengutus
  rationale: Dalam konteks amanat ilahi, 'mengutus' lebih tepat daripada sekadar 'mengirim' dan bentuk kini Yunani dapat dinyatakan dengan kala tidak bertanda dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan τοῦ λαοῦ dalam pertentangan dengan τῶν ἐθνῶν
  choice: '''bangsa ini'' dalam teks utama, dengan bangsa Yahudi/Israel sebagai rujukan kontekstual'
  alternative: '''bangsa Yahudi'' atau ''umat ini'''
  rationale: Pertentangan tersebut kuat menunjukkan bangsa Yahudi dan bangsa-bangsa bukan Yahudi, tetapi teks Yunani hanya menyebut 'bangsa/umat'. Pilihan utama mempertahankan kadar keeksplisitan sumber, sedangkan catatan kaki menjelaskan alternatif yang lebih terang.
- issue: Hubungan tindakan penyelamatan dengan pengutusan Paulus
  choice: Yesus menyelamatkan Paulus dari kedua kelompok sekaligus mengutusnya kepada bangsa-bangsa lain
  alternative: ἐξαιρούμενός dipahami terutama sebagai 'memilih/mengambil keluar' dari kedua kelompok
  rationale: Makna lazim ἐξαιρέω dalam konteks ini adalah melepaskan atau menyelamatkan. Terjemahan tidak menghapus ketegangan bahwa Paulus diselamatkan dari bangsa-bangsa lain namun juga diutus kepada mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' serta 'Aku' sesuai dengan ujaran langsung Yesus kepada Paulus. Susunan dua kalimat menghindari anak kalimat relatif yang canggung dan memperjelas sasaran pengutusan, sambil mempertahankan kesinambungan dengan ayat sebelumnya.
