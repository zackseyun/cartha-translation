  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: id
  text: Dan sekarang saya berdiri di sini untuk diadili karena pengharapan akan janji yang diberikan Allah kepada nenek moyang kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapa-bapa kita,” yaitu para leluhur Israel.
    reason: Menjelaskan bentuk maskulin dalam bahasa Yunani dan rujukan historisnya tanpa memakai ungkapan yang kurang alami dalam teks utama.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Dan sekarang
  rationale: Mempertahankan penghubung dengan uraian sebelumnya dan peralihan kepada keadaan Paulus saat ini.
- source_word: ἐπ’ ἐλπίδι
  choice: karena pengharapan
  rationale: ἐπί dengan datif di sini menyatakan dasar atau sebab Paulus diadili; bentuk ini wajar dalam bahasa Indonesia.
- source_word: ἐπαγγελίας
  choice: janji
  rationale: Genitif ini bergantung pada ἐλπίδι; pengharapan tersebut berkaitan erat dengan janji Allah, tanpa perlu memperjelas lebih jauh hubungan yang dapat tetap ambigu.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: janji ... kepada nenek moyang kita
  rationale: εἰς menandai arah atau penerima janji. 'Kepada nenek moyang kita' menyampaikan hubungan itu secara alami.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: yang diberikan Allah
  rationale: Partisipium γενομένης dengan ὑπό + genitif menunjukkan bahwa janji itu berasal atau terwujud dari tindakan Allah; 'diberikan Allah' alami dan tetap menampilkan Allah sebagai pelaku.
- source_word: πατέρας ἡμῶν
  choice: nenek moyang kita
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada para leluhur Israel. 'Nenek moyang' merupakan padanan Indonesia yang lazim dan tidak menyiratkan hanya ayah kandung.
- source_word: ἕστηκα κρινόμενος
  choice: saya diadili
  rationale: Gabungan verba perfektum dengan partisipium menyatakan keadaan Paulus yang kini berdiri sebagai terdakwa; 'saya diadili' menyampaikan konteks hukum secara ringkas dan alami.
theological_decisions:
- issue: Identitas πατέρας ἡμῶν
  choice: nenek moyang kita, yaitu para leluhur Israel
  alternative: bapa-bapa kita
  rationale: Konteks pidato Paulus menunjuk kepada para leluhur umat Israel sebagai penerima janji Allah. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan mempertahankan informasi bahwa bahasa Yunani secara harfiah berbunyi 'bapa-bapa kita'.
- issue: Hubungan pengharapan dan janji
  choice: pengharapan akan janji
  alternative: pengharapan kepada janji / pengharapan yang didasarkan pada janji
  rationale: Pilihan ini dekat dengan konstruksi genitif Yunani dan tidak mempersempitnya secara teologis menjadi hanya objek atau hanya dasar pengharapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'saya' sesuai dengan pidato pembelaan Paulus yang formal. Susunan kalimat dibuat alami sambil mempertahankan kaitan erat antara pengharapan dan janji.
