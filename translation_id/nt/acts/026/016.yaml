  to: 'Namun, bangkitlah dan berdirilah tegak. Sebab Aku menampakkan diri kepadamu untuk tujuan ini: menetapkan engkau menjadi pelayan dan saksi tentang apa yang telah engkau lihat mengenai Aku dan tentang hal-hal yang dalamnya Aku akan menampakkan diri kepadamu.[a]'
