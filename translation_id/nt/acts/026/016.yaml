id: ACT.26.16
reference: Acts 26:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: id
  text: 'Namun, bangkitlah dan berdirilah tegak. Sebab Aku menampakkan diri kepadamu untuk tujuan ini: menetapkan engkau menjadi pelayan dan saksi tentang apa yang telah engkau lihat mengenai Aku dan tentang hal-hal yang dalamnya Aku akan menampakkan diri kepadamu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan bahasa Yunani pada bagian ini sangat padat. Secara lebih harfiah, frasa itu berbunyi: “tentang apa yang engkau lihat Aku dan tentang hal-hal yang dalamnya Aku akan menampakkan diri kepadamu.” Terjemahan utama mengungkapkan bagian pertama secara lebih alami dalam bahasa Indonesia.'
    reason: Menjelaskan konstruksi relatif-genitif yang padat, khususnya hubungan antara “apa yang telah engkau lihat” dan “Aku,” tanpa menguraikannya secara tafsiriah sebagai informasi yang Yesus semata-mata perlihatkan.
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: bangkitlah dan berdirilah tegak
  rationale: Dua bentuk perintah dipertahankan, sedangkan ungkapan harfiah 'berdiri di atas kakimu' disampaikan secara alami dalam bahasa Indonesia sebagai 'berdiri tegak'.
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: Sebab, Aku menampakkan diri kepadamu untuk tujuan ini
  rationale: ὤφθην dipahami sebagai rumusan penampakan, bukan sekadar tindakan melihat atau kesan batin; εἰς τοῦτο menyatakan tujuan.
- source_word: προχειρίσασθαί σε
  choice: menetapkan engkau
  rationale: Kata ini menyatakan pemilihan atau penunjukan resmi untuk suatu tugas; 'menetapkan' membawa bobot penugasan tanpa tambahan istilah kelembagaan.
- source_word: ὑπηρέτην
  choice: pelayan
  rationale: Menunjukkan orang yang melayani sebagai pembantu atau pelaksana di bawah otoritas, tanpa menyamakannya dengan istilah δοῦλος.
- source_word: μάρτυρα
  choice: saksi
  rationale: Padanan baku dan tepat bagi orang yang memberi kesaksian tentang apa yang dilihat atau dinyatakan kepadanya.
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: baik mengenai hal-hal yang di dalamnya engkau telah melihat Aku maupun mengenai hal-hal yang di dalamnya Aku akan menampakkan diri kepadamu
  rationale: Susunan relatif-genitif Yunani yang padat dipertahankan sejauh mungkin, dan kedua verba tetap dibedakan sebagai 'melihat Aku' dan 'Aku akan menampakkan diri' tanpa mengubah yang kedua menjadi 'akan Kuperlihatkan'.
theological_decisions:
- issue: Sifat bahasa pewahyuan dalam ὤφθην dan ὀφθήσομαι
  choice: 'Kedua bentuk diterjemahkan dengan bahasa penampakan diri: ''Aku menampakkan diri'' dan ''Aku akan menampakkan diri''.'
  alternative: '''Aku terlihat olehmu'' / ''Aku akan terlihat olehmu'', atau ''Aku menyatakan diri'' / ''Aku akan menyatakan diri''.'
  rationale: Pilihan ini mempertahankan penampakan pribadi Yesus yang bangkit dalam penugasan Paulus, tanpa menentukan lebih jauh bagaimana penampakan tersebut berlangsung.
- issue: Hubungan frasa relatif ὧν dengan tugas sebagai saksi
  choice: Mempertahankan bentuk yang relatif formal, 'mengenai hal-hal yang di dalamnya'.
  alternative: Menguraikannya sebagai 'tentang apa yang telah kaulihat mengenai Aku dan apa yang akan Kunyatakan kepadamu'.
  rationale: Bahasa Yunani padat dan agak ambigu. Terjemahan utama tidak mengubah penampakan mendatang menjadi tindakan memperlihatkan informasi, sehingga ketegangan gramatikal dan pewahyuan tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan tunggal 'engkau' sesuai dengan tuturan langsung kepada Paulus; huruf kapital pada pronomina orang pertama menandai ucapan Yesus sesuai kebiasaan editorial Indonesia, bukan penambahan makna gramatikal.
