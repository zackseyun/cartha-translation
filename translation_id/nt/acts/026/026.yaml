  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: id
  text: Sebab raja mengetahui hal-hal ini, dan kepadanya saya berbicara dengan terus terang.[a] Saya yakin bahwa tidak satu pun dari hal-hal ini luput dari perhatiannya,[b] sebab hal ini tidak dilakukan secara tersembunyi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berbicara dengan berani” atau “berbicara dengan bebas.” Kata Yunaninya menyatakan perkataan yang terbuka, terus terang, dan penuh keyakinan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tidak ada satu pun dari hal-hal ini yang tersembunyi baginya” atau “yang tidak diketahuinya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di suatu sudut.” Ungkapan ini berarti bahwa hal tersebut tidak dilakukan secara rahasia atau jauh dari perhatian umum.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: mengetahui
  rationale: Kata kerja ini menyatakan pengetahuan atau pengenalan terhadap perkara yang dibicarakan; 'mengetahui' merupakan padanan Indonesia yang alami dan langsung.
- source_word: περὶ τούτων
  choice: hal-hal ini
  rationale: Frasa ini menunjuk kepada perkara-perkara yang sedang dibahas tanpa mempersempit cakupannya.
- source_word: παρρησιαζόμενος
  choice: berbicara dengan terus terang
  rationale: Partisip ini mengandung gagasan berbicara secara terbuka, bebas, dan penuh keyakinan; 'dengan terus terang' terdengar alami serta mempertahankan unsur keterbukaan.
- source_word: πρὸς ὃν ... λαλῶ
  choice: kepadanya saya berbicara
  rationale: Susunan ini mempertahankan raja sebagai orang yang dituju oleh perkataan Paulus sambil memakai tata bahasa Indonesia yang wajar.
- source_word: λανθάνειν ... αὐτὸν
  choice: luput dari perhatiannya
  rationale: Ungkapan Yunani ini berarti tidak diketahui atau tidak disadari oleh seseorang; padanan idiomatis Indonesia ini mempertahankan makna tersebut.
- source_word: οὐ πείθομαι οὐθέν
  choice: Saya yakin bahwa tidak satu pun
  rationale: πείθομαι menyatakan keyakinan yang mantap, sedangkan konstruksi negatifnya secara alami diterjemahkan sebagai 'tidak satu pun' dalam bahasa Indonesia.
- source_word: πεπραγμένον
  choice: terjadi
  rationale: Dalam konteks ini, bentuk perfektum merujuk kepada peristiwa yang telah berlangsung; 'terjadi' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dilakukan', tanpa menentukan pelaku.
- source_word: ἐν γωνίᾳ
  choice: di tempat tersembunyi
  rationale: Secara harfiah berarti 'di suatu sudut', tetapi secara idiomatis menunjuk kepada sesuatu yang dilakukan secara rahasia atau jauh dari perhatian umum.
- source_word: τοῦτο
  choice: hal ini
  rationale: Demonstratif tunggal ini dibiarkan luas, sebagaimana teks Yunani, tanpa menetapkan secara sempit peristiwa mana yang dimaksud.
theological_decisions:
- issue: Cakupan τοῦτο dan sifat publik peristiwa-peristiwa itu
  choice: Menerjemahkan secara netral sebagai 'hal ini' dan mempertahankan pernyataan bahwa perkara tersebut bukan kejadian tersembunyi.
  alternative: Menentukan 'hal ini' secara khusus sebagai kematian dan kebangkitan Yesus, atau secara luas sebagai seluruh gerakan Kristen dan perkara Paulus.
  rationale: Ayat ini tidak mendefinisikan rujukan τοῦτο secara tepat. Terjemahan mempertahankan keluasan dan ketegangan rujukannya tanpa memasukkan penafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan orang pertama memakai 'saya' agar sesuai dengan tuturan langsung Paulus dalam konteks persidangan. Metafora Yunani dijelaskan dalam catatan kaki, sementara teks utama memakai ungkapan Indonesia yang jelas.
