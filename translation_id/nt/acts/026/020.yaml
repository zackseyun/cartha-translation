id: ACT.26.20
reference: Acts 26:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: id
  text: Namun, mula-mula kepada orang-orang di Damsyik, kemudian juga kepada orang-orang di Yerusalem dan di seluruh wilayah Yudea, lalu kepada orang-orang bukan Yahudi[a], aku memberitakan bahwa mereka harus bertobat dan berbalik kepada Allah serta melakukan perbuatan-perbuatan yang sesuai dengan pertobatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada bangsa-bangsa.” Dalam konteks ini, istilah tersebut menunjuk kepada orang-orang bukan Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “melakukan perbuatan-perbuatan yang layak bagi pertobatan”; maksudnya ialah perbuatan yang sepadan atau selaras dengan pertobatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan Paulus sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: kepada orang-orang di Damsyik
  rationale: Bentuk datif jamak menunjuk kepada orang-orang yang berada di Damsyik sebagai penerima pemberitaan.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: mula-mula ... kemudian juga kepada orang-orang di Yerusalem
  rationale: Mengungkapkan urutan dan penambahan secara alami, tanpa memberi kesan bahwa kedua tempat sama-sama menjadi tahap pertama.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: di seluruh wilayah Yudea
  rationale: χώρα menunjuk pada kawasan geografis; 'wilayah' cukup luas dan tidak membatasinya pada daerah pedesaan.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Dalam konteks yang membedakannya dari Yerusalem dan Yudea, istilah ini menunjuk kepada bangsa-bangsa bukan Yahudi. Ungkapan Indonesia ini lebih mudah dipahami daripada istilah teknis 'bangsa-bangsa non-Yahudi'.
- source_word: ἀπήγγελλον
  choice: aku memberitakan
  rationale: Dalam konteks pelayanan Paulus, kata ini menyatakan penyampaian berita secara terbuka dan berulang; bentuk orang pertama dipertahankan.
- source_word: μετανοεῖν
  choice: bertobat
  rationale: '''Bertobat'' merupakan padanan Indonesia yang baku dan dalam konteks ini mencakup perubahan batin dan arah hidup, bukan sekadar mengganti pendapat.'
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: berbalik kepada Allah
  rationale: Mempertahankan gambaran berpaling menuju Allah; 'kembali' dihindari karena dapat menyiratkan bahwa semua pendengar sebelumnya sudah menjadi umat perjanjian.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: perbuatan-perbuatan yang sesuai dengan pertobatan itu
  rationale: Menyampaikan bahwa perbuatan tersebut selaras atau sepadan dengan pertobatan, tanpa menentukan lebih jauh hubungan teologisnya.
- source_word: πράσσοντας
  choice: serta melakukan
  rationale: Partisipel ini menggambarkan tindakan yang menyertai respons bertobat dan berbalik kepada Allah; 'serta melakukan' menghasilkan susunan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Hubungan antara pertobatan, berbalik kepada Allah, dan perbuatan
  choice: Perbuatan disebut sebagai tindakan yang sesuai dengan pertobatan, tanpa dinyatakan sebagai pengganti pertobatan atau dasar penerimaan oleh Allah.
  alternative: Perbuatan dapat dipahami sebagai isi pertobatan itu sendiri atau sebagai dasar yang menghasilkan penerimaan.
  rationale: Sintaks Yunani terlebih dahulu menyatakan tuntutan untuk bertobat dan berbalik kepada Allah, sedangkan partisipel πράσσοντας menerangkan tindakan yang menyertainya. Terjemahan tidak menambahkan penjelasan doktrinal mengenai jasa atau urutan keselamatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan geografis dibuat jelas dengan 'mula-mula', 'kemudian juga', dan 'lalu'. Istilah gerejawi yang sudah umum, 'bertobat', dipertahankan karena paling tepat dan mudah dipahami.
