  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: id
  text: Di semua rumah ibadat, berkali-kali aku menghukum mereka sambil berusaha memaksa mereka menghujat; dalam kemarahan yang sangat berkobar terhadap mereka, aku terus menganiaya mereka bahkan sampai ke kota-kota di luar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “bahkan sampai ke kota-kota di luar”; ungkapan ini mungkin merujuk pada kota-kota di luar Yudea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: di semua rumah ibadat
  rationale: κατά dengan akusatif bersifat distributif dan menunjukkan tindakan yang dilakukan di berbagai rumah ibadat. 'Rumah ibadat' merupakan padanan Indonesia yang jelas dan lazim untuk συναγωγή dalam konteks ini.
- source_word: πολλάκις
  choice: berkali-kali
  rationale: Menjaga penekanan pada tindakan yang berulang, bukan sekadar menyatakan kebiasaan umum.
- source_word: τιμωρῶν αὐτούς
  choice: menghukum mereka
  rationale: Partisip ini menyatakan keadaan atau cara yang menyertai tindakan utama. Susunan dengan 'dan' menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan erat antartindakan.
- source_word: ἠνάγκαζον
  choice: berusaha memaksa
  rationale: Bentuk imperfek menggambarkan tindakan pemaksaan yang berulang atau terus diupayakan; terjemahan ini tidak menyiratkan bahwa upaya tersebut selalu berhasil.
- source_word: βλασφημεῖν
  choice: menghujat
  rationale: Mempertahankan ungkapan umum dalam teks Yunani tanpa menambahkan objek hujatan yang tidak disebutkan.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: karena amarahku terhadap mereka sudah meluap-luap
  rationale: Mengungkapkan permusuhan yang sangat hebat dan nyaris tak terkendali dalam bahasa Indonesia alami, tanpa konotasi gangguan jiwa yang dapat muncul dari padanan harfiah tertentu.
- source_word: ἐδίωκον
  choice: aku terus menganiaya
  rationale: Bentuk imperfek menunjukkan tindakan yang berkelanjutan atau berulang; dalam konteks Kisah Para Rasul, διώκω mengacu pada pengejaran bermusuhan atau penganiayaan terhadap orang percaya.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: bahkan sampai ke kota-kota di luar wilayah itu
  rationale: Mempertahankan arti dasar ἔξω, yaitu 'di luar', tanpa memastikan secara berlebihan bahwa kota-kota itu asing dalam arti modern. 'Wilayah itu' membiarkan cakupan geografisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Objek βλασφημεῖν dalam pemaksaan Paulus
  choice: menghujat, tanpa menyebut objeknya
  alternative: menghujat Yesus; menyangkal iman kepada Yesus dengan hujatan
  rationale: Konteks mengarah pada hujatan terhadap Yesus atau pengakuan iman Kristen, tetapi teks Yunani tidak menyatakan objeknya. Terjemahan utama mempertahankan ketidakjelasan tersebut.
- issue: Keberhasilan tindakan pemaksaan
  choice: berusaha memaksa
  alternative: memaksa
  rationale: Imperfek dapat menggambarkan upaya berulang, dan konteks tidak memastikan bahwa setiap orang benar-benar menyerah serta menghujat. Pilihan ini menghindari pernyataan keberhasilan yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Rumah ibadat' dipilih daripada transliterasi 'sinagoge' agar mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya, yaitu 'kota-kota di luar wilayah itu'.
