  naturalness: Terjemahan umumnya jelas dan menggunakan bahasa Indonesia modern yang baik. “Dalam kemarahan yang sangat berkobar terhadap mereka” menyampaikan permusuhan yang sangat hebat secara alami tanpa menyiratkan gangguan jiwa. “Sambil berusaha memaksa” dengan tepat menghubungkan penghukuman dengan upaya pemaksaan.
  terminology: “Rumah ibadat,” “menghukum,” “menghujat,” dan “menganiaya” merupakan padanan yang sesuai dalam register modern dan bermartabat. Objek dari “menghujat” tetap tidak disebutkan, sesuai dengan teks Yunani.
