    rationale: ἔξω berarti ‘di luar/beyond’ dan frasanya tidak menyebut ‘wilayah itu’. Konteks dapat mengarah pada kota-kota di luar Yudea, tetapi hal itu sebaiknya tetap menjadi penjelasan catatan kaki, bukan ditambahkan ke teks utama.
