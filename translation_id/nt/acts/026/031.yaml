  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: id
  text: Setelah mereka pergi dari situ, mereka saling berbicara dan berkata, “Orang ini tidak melakukan apa pun yang pantas dihukum mati atau dipenjarakan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kematian atau belenggu.” Kata Yunani δεσμῶν berarti “belenggu” atau “rantai,” tetapi dalam konteks ini kemungkinan menunjuk pada pemenjaraan atau penahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: setelah menyingkir
  rationale: Partisip aoris ini menunjukkan bahwa mereka beranjak dari tempat persidangan sebelum mulai bercakap-cakap. ‘Menyingkir’ mempertahankan gagasan menjauh tanpa menyatakan lebih dari yang terdapat dalam teks.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: mereka berbicara satu sama lain
  rationale: Bentuk imperfek menggambarkan percakapan yang sedang berlangsung, sedangkan ungkapan resiprokal menunjukkan bahwa mereka saling berbicara.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini memperkenalkan isi percakapan mereka. Ungkapan tersebut dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: Οὐδὲν ... ἄξιον
  choice: tidak melakukan sesuatu pun yang patut dijatuhi
  rationale: Konstruksi ini menyatakan bahwa tidak ada perbuatan orang tersebut yang layak mendatangkan hukuman yang disebutkan.
- source_word: θανάτου ἢ δεσμῶν
  choice: hukuman mati atau hukuman penjara
  rationale: Dalam konteks hukum, θάνατος menunjuk pada hukuman mati, sementara δεσμοί secara harfiah berarti belenggu atau rantai, tetapi secara metonimis dapat menunjuk pada pemenjaraan. Pilihan ini menyampaikan maksud yuridis dengan jelas.
- source_word: τι πράσσει
  choice: melakukan sesuatu pun
  rationale: πράσσω merujuk secara umum pada apa yang dilakukan orang itu. Terjemahan ini tidak mempersempit maknanya menjadi tindak pidana tertentu.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: orang ini
  rationale: Ungkapan ini menunjuk langsung kepada Paulus dan diterjemahkan dengan bentuk Indonesia yang alami tanpa menambah nada merendahkan.
