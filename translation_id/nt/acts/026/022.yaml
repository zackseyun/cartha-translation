  terminology: “Allah,” “memberi kesaksian,” dan “para nabi dan Musa” tepat dan konsisten. “Orang kecil maupun orang besar” mempertahankan idiom sumber; catatan kaki yang menerangkan cakupan sosialnya diperlukan dan sudah tepat.
