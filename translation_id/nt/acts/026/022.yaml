revisions:
- from: Karena itu, setelah memperoleh pertolongan dari Allah, sampai hari ini aku tetap berdiri memberi kesaksian kepada orang kecil maupun orang besar,[a] tanpa mengatakan apa pun selain yang telah dikatakan para nabi dan Musa akan terjadi.[b]
  to: Karena itu, setelah memperoleh pertolongan dari Allah, sampai hari ini aku tetap berdiri memberi kesaksian kepada orang kecil maupun orang besar,[a] tanpa mengatakan apa pun selain apa yang menurut para nabi dan Musa akan terjadi.[b]
  rationale: Revisi hanya memperjelas hubungan sintaktis pada klausa terakhir dan memperbaiki alternatif catatan kaki. Frasa “menurut para nabi dan Musa” menyatakan bahwa merekalah yang menyampaikan prediksi tersebut, sedangkan “akan terjadi” tetap berfungsi sebagai masa depan relatif terhadap perkataan mereka. Tidak ada perubahan pada cakupan kesaksian Paulus atau pada istilah teologis.
