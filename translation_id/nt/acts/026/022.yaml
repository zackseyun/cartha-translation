  source_fidelity: 'Makna pokok terpelihara: pertolongan berasal dari Allah, Paulus tetap berdiri hingga saat itu sambil memberi kesaksian kepada semua golongan, dan ia tidak menyampaikan sesuatu di luar apa yang telah dinyatakan para nabi dan Musa akan terjadi. Namun, frasa “yang telah dikatakan para nabi dan Musa akan terjadi” kurang jelas dalam bahasa Indonesia karena hubungan antara “dikatakan” dan “akan terjadi” mudah tersendat. Perumusan ulang yang jelas mempertahankan futuritas relatif dalam μελλόντων γίνεσθαι.'
