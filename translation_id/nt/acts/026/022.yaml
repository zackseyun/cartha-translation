  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: id
  text: Karena itu, setelah memperoleh pertolongan dari Allah, sampai hari ini aku tetap berdiri memberi kesaksian kepada orang kecil maupun orang besar,[a] tanpa mengatakan apa pun selain apa yang menurut para nabi dan Musa akan terjadi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang kecil maupun orang besar” berarti orang dari setiap lapisan sosial.
    reason: cultural_note
  - marker: b
    text: 'Atau: “tanpa mengatakan apa pun di luar apa yang dinyatakan para nabi dan Musa akan terjadi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας οὖν τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: Karena itu, setelah memperoleh pertolongan dari Allah
  rationale: Frasa ini menyatakan bahwa Paulus telah menerima pertolongan yang bersumber dari Allah. 'Memperoleh pertolongan' alami dalam bahasa Indonesia dan mempertahankan hubungan partisipial serta sumber pertolongan.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: sampai hari ini aku tetap berdiri
  rationale: Bentuk perfektum ἕστηκα menunjukkan keadaan yang masih berlangsung sebagai hasil tindakan sebelumnya. 'Tetap berdiri' menyampaikan keteguhan dan keberlanjutan itu secara alami.
- source_word: μαρτυρόμενος
  choice: memberi kesaksian
  rationale: Pilihan ini mempertahankan nuansa kesaksian, termasuk kemungkinan latar hukum, serta menggambarkan kegiatan Paulus yang berlangsung.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: kepada orang kecil maupun orang besar
  rationale: Terjemahan ini mempertahankan pasangan retoris teks Yunani; catatan kaki menjelaskan bahwa ungkapan tersebut mencakup semua lapisan sosial.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: tanpa mengatakan apa pun selain
  rationale: ἐκτός dalam konstruksi ini berarti 'selain' atau 'di luar'. Pilihan ini alami dan mempertahankan kuatnya klaim bahwa isi kesaksian Paulus tidak melampaui Kitab Suci.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς
  choice: yang telah dikatakan para nabi dan Musa akan terjadi
  rationale: Urutan sumber dipertahankan sesuai teks Yunani. 'Akan terjadi' mengungkapkan futuritas relatif terhadap perkataan para nabi dan Musa tanpa menambahkan gagasan tentang kedekatan waktunya.
theological_decisions:
- issue: Cakupan klaim Paulus mengenai kesinambungan dengan Kitab Suci Israel
  choice: Paulus mengatakan bahwa kesaksiannya tidak menyatakan apa pun selain yang telah dikatakan para nabi dan Musa akan terjadi.
  alternative: Paulus hanya menyatakan kesesuaian umum dengan Kitab Suci, bukan kesinambungan yang kuat dengan apa yang dinubuatkan.
  rationale: Ungkapan οὐδὲν ἐκτὸς λέγων menyampaikan klaim kesinambungan yang kuat. Terjemahan mempertahankan klaim itu tanpa menentukan lebih jauh tingkat perincian penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat mempertahankan alur argumentasi Paulus, sementara 'tetap berdiri' menyampaikan hasil berkelanjutan dari bentuk perfektum Yunani.
