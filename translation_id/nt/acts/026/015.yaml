  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: id
  text: Lalu aku berkata, “Siapakah Engkau, Tuhan?[a]” Tuhan menjawab, “Akulah Yesus yang engkau aniaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah Tuan?” Kata Yunani κύριε dapat digunakan sebagai sapaan hormat, tetapi di sini “Tuhan” dipilih karena pembicara dalam penampakan surgawi itu segera memperkenalkan diri sebagai Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Lalu aku berkata
  rationale: δέ merupakan penghubung naratif ringan. “Lalu” mengalir alami dalam bahasa Indonesia tanpa memberi kesan pertentangan yang kuat; ἐγώ dinyatakan dengan “aku” sesuai tuturan langsung Paulus.
- source_word: Τίς εἶ, κύριε;
  choice: Siapakah Engkau, Tuhan?
  rationale: τίς εἶ diterjemahkan secara langsung sebagai “Siapakah Engkau?”; κύριε dipertahankan sebagai “Tuhan” karena sapaan ini ditujukan kepada sosok surgawi yang segera memperkenalkan diri sebagai Yesus. Huruf kapital pada “Engkau” mengikuti sapaan kepada Tuhan dalam konteks ini.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Tuhan menjawab
  rationale: κύριος merujuk kepada pembicara yang telah dikenal dan wajar diterjemahkan “Tuhan”. εἶπεν secara harfiah berarti “berkata”, tetapi “menjawab” secara alami menyatakan fungsi ucapan ini sebagai jawaban atas pertanyaan sebelumnya. δέ tidak perlu dinyatakan tersendiri karena peralihan tuturan sudah jelas.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Akulah Yesus
  rationale: Bentuk “Akulah” menyampaikan pengenalan diri yang tegas dari Ἐγώ εἰμι dengan idiom Indonesia yang alami, tanpa menambahkan identitas lain.
- source_word: ὃν σὺ διώκεις
  choice: yang engkau aniaya
  rationale: διώκω dalam konteks ini berarti mempersekusi atau menganiaya. “Aniaya” ringkas dan lazim dalam bahasa Alkitab Indonesia, sedangkan pronomina eksplisit σὺ tercermin dalam “engkau” tanpa penekanan tambahan.
theological_decisions:
- issue: Makna κύριε dalam sapaan Saulus dan κύριος sebagai identifikasi pembicara
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam sapaan, κύριε secara leksikal dapat berarti “Tuan”, tetapi konteks penampakan surgawi dan pengenalan langsung pembicara sebagai Yesus mendukung “Tuhan”. Catatan kaki mempertahankan kemungkinan sapaan hormat tanpa mengurangi bobot teologis konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tuturan langsung memakai “aku/engkau” agar alami sekaligus bermartabat. Pilihan “aniaya” mempertahankan ungkapan yang ringkas dan mudah dipahami; catatan kaki menjaga ambiguitas leksikal pada κύριε.
