source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: id
  text: Setelah kami semua jatuh ke tanah, Aku mendengar suara yang berkata kepadaku dalam bahasa Ibrani[a], “Saulus, Saulus, mengapa engkau menganiaya Aku? Sukar bagimu menendang melawan tongkat penghalau ternak[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dalam bahasa Aram”; ungkapan Yunaninya secara harfiah berbunyi “dalam bahasa/dialek Ibrani”.
    reason: alternative_reading
  - marker: b
    text: 'Ini adalah ungkapan peribahasa: melawan hanya akan mencelakakan diri sendiri, seperti hewan yang menendang tongkat berujung tajam yang dipakai untuk menggiringnya.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Setelah kami semua jatuh ke tanah
  rationale: Konstruksi genitif absolut dialihkan menjadi anak kalimat waktu yang alami. πάντων bersama ἡμῶν dipertahankan sebagai 'kami semua', sedangkan bentuk aoris menunjukkan tindakan yang selesai sebelum Paulus mendengar suara itu.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: aku mendengar suatu suara berkata kepadaku
  rationale: φωνή berarti 'suara' dalam konteks ujaran langsung, dan λέγουσαν πρός με menunjukkan bahwa perkataan itu ditujukan kepada Paulus.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: dalam bahasa Ibrani
  rationale: Terjemahan ini mengikuti ungkapan Yunani secara langsung. Kemungkinan bahwa sebutan tersebut mengacu pada bahasa Aram dicatat tanpa dimasukkan ke dalam teks utama.
- source_word: Σαοὺλ Σαούλ
  choice: Saulus, Saulus
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia dipakai, sementara pengulangannya dipertahankan sebagai sapaan yang tegas dan pribadi.
- source_word: τί με διώκεις;
  choice: mengapa engkau menganiaya Aku?
  rationale: διώκεις dalam konteks ini menyatakan tindakan pengejaran dan penindasan yang bermusuhan; bentuk kini diterjemahkan secara alami sebagai tindakan yang sedang dilakukan.
- source_word: σκληρόν σοι
  choice: Sukar bagimu
  rationale: Ungkapan impersonal ini dipertahankan dengan padanan ringkas yang dapat mencakup kesulitan sekaligus akibat menyakitkan tanpa mempersempit maknanya.
- source_word: πρὸς κέντρα λακτίζειν
  choice: menendang melawan tongkat penghalau ternak
  rationale: 'Citra harfiahnya dipertahankan: κέντρα adalah alat berujung tajam untuk menggiring hewan. ''Tongkat penghalau ternak'' lebih mudah dipahami pembaca modern daripada istilah tradisional yang kurang umum.'
theological_decisions:
- issue: Makna τῇ Ἑβραΐδι διαλέκτῳ
  choice: dalam bahasa Ibrani
  alternative: dalam bahasa Aram
  rationale: Teks utama mengikuti penyebutan eksplisit dalam bahasa Yunani, sementara kemungkinan pemakaian istilah itu untuk bahasa Aram dipertahankan sebagai alternatif dalam catatan kaki.
- issue: Hubungan antara Yesus dan orang-orang yang dianiaya
  choice: mengapa engkau menganiaya Aku?
  alternative: mengapa engkau menganiaya para pengikut-Ku?
  rationale: Objek tunggal με, 'Aku', dipertahankan tanpa parafrasa agar identifikasi yang kuat antara sang pembicara dan mereka yang dianiaya tidak dijelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat dipakai. 'Engkau' sesuai dengan sapaan tunggal yang serius, sedangkan 'tongkat penghalau ternak' dipilih agar gambaran peribahasa dapat dipahami tanpa bergantung pada istilah kuno. Semua penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
