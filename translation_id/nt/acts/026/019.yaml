  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: id
  text: Karena itu, Raja Agripa, aku tidak taat kepada penglihatan surgawi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penglihatan dari surga.”
    reason: Alternatif ini memperjelas kemungkinan bahwa οὐρανίῳ menyatakan asal penglihatan tersebut, bukan hanya sifatnya.
lexical_decisions:
- source_word: Ὅθεν
  choice: Karena itu
  rationale: Menandai kesimpulan atau tanggapan Paulus berdasarkan kisah perjumpaan dan penugasan yang baru saja disampaikannya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan logisnya.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Raja Agripa
  rationale: Mempertahankan sapaan langsung beserta gelar kehormatan dalam bentuk Indonesia yang wajar.
- source_word: οὐκ ἐγενόμην
  choice: aku tidak
  rationale: Dengan kata sifat predikatif ἀπειθής, γίνομαι berfungsi secara idiomatis untuk menyatakan keadaan atau sikap. Terjemahan ini menghindari bentuk harfiah yang kaku seperti 'aku tidak menjadi'.
- source_word: ἀπειθὴς
  choice: tidak taat
  rationale: Dalam konteks penugasan ilahi, kata ini menunjuk pada penolakan untuk mematuhi; 'tidak taat' mempertahankan nuansa kehendak tanpa memperkuatnya menjadi 'memberontak'.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: kepada penglihatan surgawi
  rationale: ὀπτασία menunjuk pada penglihatan atau penampakan adikodrati, sedangkan οὐρανίῳ dapat menyatakan sifat atau asalnya. 'Penglihatan surgawi' ringkas dan tetap membuka kedua nuansa tersebut.
theological_decisions:
- issue: Hakikat pengalaman Paulus di jalan menuju Damsyik
  choice: penglihatan surgawi
  alternative: penglihatan dari surga; penampakan surgawi
  rationale: Kata ὀπτασία paling langsung menunjuk pada penglihatan atau penampakan. 'Penglihatan' mengikuti kategori teks tanpa menjelaskan pengalaman itu melalui rumusan teologis yang lebih jauh; 'surgawi' mempertahankan kemungkinan bahwa οὐρανίῳ menunjukkan asal maupun sifatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'aku' sesuai dengan tuturan langsung Paulus, sedangkan 'Raja Agripa' mempertahankan sapaan hormat tanpa gaya arkais.
