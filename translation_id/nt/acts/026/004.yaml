  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: id
  text: Jadi, semua orang Yahudi mengetahui cara hidup[a] saya sejak masa muda, yakni cara hidup yang sejak awal saya jalani di tengah bangsa saya sendiri dan juga di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehidupan” atau “jalan hidup”. Istilah Yunani ini menunjuk pada cara Paulus menjalani hidup, bukan sekadar keberadaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: cara hidup
  rationale: Kata ini menunjuk pada pola atau jalan hidup Paulus, bukan sekadar keberadaannya secara biologis. “Cara hidup” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐκ νεότητος
  choice: sejak masa muda
  rationale: Ungkapan ini menyatakan titik awal rentang waktu dan mempertahankan rujukan pribadi kepada masa muda Paulus.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak awal
  rationale: Terjemahan ini mempertahankan penegasan temporal dalam teks tanpa menghapus ketegangannya dengan “sejak masa muda”.
- source_word: γενομένην
  choice: berlangsung
  rationale: Partisip ini menerangkan perjalanan hidup Paulus sebagai sesuatu yang terjadi dalam lingkungan tertentu. “Berlangsung” alami dalam bahasa Indonesia dan tidak memaksakan makna yang lebih khusus.
- source_word: ἐν τῷ ἔθνει μου
  choice: di tengah bangsa saya sendiri
  rationale: ἔθνος di sini merujuk pada kelompok bangsa Paulus sendiri. Frasa ini mempertahankan nuansa kolektif-etnis dan tidak mengartikannya sebagai negara politik modern.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: dan juga di Yerusalem
  rationale: Kata τε mengoordinasikan Yerusalem dengan lingkungan yang disebut sebelumnya; “dan juga” menyampaikan fungsi tambahan itu secara wajar.
- source_word: ἴσασι
  choice: mengetahui
  rationale: Bentuk οἶδα ini memiliki makna keadaan kini, sehingga “mengetahui” tepat dalam konteks ini.
- source_word: πάντες Ἰουδαῖοι
  choice: semua orang Yahudi
  rationale: Terjemahan langsung ini mempertahankan sebutan kelompok dalam teks tanpa mempersempit atau memperhalus cakupannya.
- source_word: μὲν οὖν
  choice: Jadi
  rationale: Partikel gabungan ini menandai peralihan sekaligus kelanjutan dalam pembelaan Paulus. “Jadi” menyampaikan fungsi wacananya secara ringkas dan alami.
