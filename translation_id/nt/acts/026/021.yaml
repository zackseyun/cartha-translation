base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: id
  text: Karena hal-hal inilah[a] orang-orang Yahudi menangkap saya di kompleks Bait Allah[b] dan berusaha membunuh saya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Karena hal-hal ini” atau “Oleh sebab inilah.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “kompleks Bait Allah” menunjuk pada seluruh kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Karena hal-hal inilah
  rationale: Ungkapan ἕνεκα dengan bentuk genetif menyatakan sebab atau alasan dan menunjuk kembali kepada kesaksian serta tindakan Paulus yang baru dipaparkan. Bentuk ini mempertahankan penekanan pada 'hal-hal ini' dengan bahasa Indonesia yang wajar.
- source_word: με
  choice: saya
  rationale: Objek langsung orang pertama tunggal dari συλλαβόμενοι. 'Saya' sesuai dengan register tuturan Paulus yang modern dan bermartabat.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Bentuk jamak ini menunjuk kepada orang-orang Yahudi tertentu yang terlibat dalam peristiwa tersebut, bukan seluruh orang Yahudi. Bahasa Indonesia tidak memakai artikel tentu seperti bahasa Yunani, sehingga pembatasannya dipahami dari konteks.
- source_word: συλλαβόμενοι
  choice: menangkap
  rationale: Partisip ini berarti memegang, menangkap, atau menyergap. 'Menangkap' menyampaikan tindakan bermusuhan dengan jelas tanpa harus mengesankan penahanan resmi yang sah.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν mengacu pada seluruh kawasan atau kompleks Bait Allah, bukan secara khusus ruang suci bagian dalam. Pilihan ini membuat pembedaan leksikal tersebut jelas dalam teks Indonesia.
- source_word: ἐπειρῶντο
  choice: berusaha
  rationale: Bentuk imperfek menyatakan upaya yang sedang berlangsung pada waktu lampau. Dalam rangkaian naratif bahasa Indonesia, 'berusaha' secara alami menyampaikan upaya yang belum berhasil.
- source_word: διαχειρίσασθαι
  choice: membunuh
  rationale: Dalam konteks ini verba tersebut berarti membunuh atau menghabisi dengan kekerasan. 'Membunuh' paling jelas dan tidak menambahkan nuansa hukum yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan 'orang-orang Yahudi' dalam konteks polemis yang sensitif
  choice: Memakai 'orang-orang Yahudi' dan membiarkan konteks membatasinya pada para penentang tertentu yang menangkap Paulus.
  alternative: '''bangsa Yahudi'' atau ''para pemimpin Yahudi'''
  rationale: Teks menyebut orang-orang Yahudi yang terlibat tanpa menuduh seluruh bangsa dan tanpa secara khusus menyebut mereka sebagai pemimpin. Terjemahan tidak boleh memperluas ataupun mempersempit rujukan historis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Saya' dipakai untuk tuturan Paulus. Penanda catatan kaki [a] dan [b] ditempatkan sesudah kalimat terkait.
