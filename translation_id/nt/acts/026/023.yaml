language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: id
  text: bahwa Mesias harus menderita[a], dan bahwa, sebagai yang pertama bangkit dari antara orang mati, ia akan memberitakan terang baik kepada umat itu[b] maupun kepada bangsa-bangsa lain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”. Gelar Yunani Χριστός diterjemahkan “Mesias” di sini karena menunjuk kepada sosok yang dinubuatkan.
    reason: alternative_reading
  - marker: b
    text: “Umat itu” kemungkinan menunjuk kepada umat Yahudi, berlawanan dengan “bangsa-bangsa lain”.
    reason: lexical_alternative
  - marker: c
    text: Atau “bangsa-bangsa”. Dalam konteks ini, ungkapan tersebut menunjuk kepada bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: harus menderita
  rationale: Dalam rangkuman nubuat ini, adjektiva tersebut menyatakan bahwa penderitaan merupakan bagian yang ditetapkan bagi Mesias. Ungkapan verbal ini alami dalam bahasa Indonesia tanpa mengubahnya menjadi istilah filosofis.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi sosok yang dinubuatkan, sehingga 'Mesias' menyampaikan makna 'Yang Diurapi' secara wajar dalam konteks ini.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: sebagai yang pertama bangkit dari antara orang mati
  rationale: Terjemahan ini mempertahankan gagasan keutamaan atau urutan pertama serta bentuk ringkas ungkapan Yunani, tanpa menjelaskan lebih jauh bagaimana hal itu berhubungan dengan orang-orang yang sebelumnya dihidupkan kembali.
- source_word: φῶς
  choice: terang
  rationale: Metafora sumber dipertahankan karena dapat mencakup penyataan, keselamatan, dan pengharapan tanpa mempersempit artinya.
- source_word: μέλλει καταγγέλλειν
  choice: ia akan memberitakan
  rationale: μέλλω dengan infinitif dalam rangkuman tidak langsung ini menunjuk pada apa yang akan atau ditetapkan untuk dilakukan; 'akan memberitakan' alami dan tidak menyiratkan bahwa waktunya segera.
- source_word: τῷ τε λαῷ
  choice: kepada umat itu
  rationale: λαός dalam pertentangan dengan ἔθνη kemungkinan menunjuk kepada umat Yahudi atau Israel. 'Umat itu' mempertahankan sebutan yang relatif tidak eksplisit sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Dalam pasangan dengan λαός, ἔθνη menunjuk kepada bangsa-bangsa bukan Yahudi. 'Bangsa-bangsa lain' mengungkapkan kontras tersebut dengan bahasa Indonesia umum.
- source_word: τε ... καὶ
  choice: baik ... maupun
  rationale: Konstruksi korelatif ini secara alami menandai kedua kelompok penerima dalam bahasa Indonesia.
theological_decisions:
- issue: Makna Mesias sebagai yang pertama bangkit dari antara orang mati
  choice: Mempertahankan pernyataan tentang keutamaan Mesias dalam kebangkitan tanpa penjelasan doktrinal tambahan.
  alternative: yang pertama bangkit untuk tidak mati lagi; buah sulung kebangkitan akhir
  rationale: Teks Yunani menyatakan πρῶτος tetapi tidak menerangkan nuansanya. Terjemahan tidak boleh seolah-olah menyangkal pemulihan hidup yang terjadi sebelumnya ataupun memasukkan penjelasan teologis yang tidak dinyatakan.
- issue: Cakupan 'umat itu'
  choice: Menggunakan 'umat itu' dalam teks utama dan menjelaskan rujukan yang mungkin dalam catatan kaki.
  alternative: umat Yahudi; Israel
  rationale: λαός tidak menyebut 'Yahudi' atau 'Israel' secara eksplisit, meskipun kontras dengan bangsa-bangsa lain sangat mendukung rujukan tersebut.
- issue: Daya modal παθητὸς
  choice: harus menderita
  alternative: dapat menderita; akan menderita
  rationale: Dalam konteks pertanyaan mengenai kesaksian para nabi, kata ini menyangkut apakah penderitaan berlaku atau ditetapkan bagi Mesias. 'Harus menderita' menyampaikan daya nubuat itu, sementara alternatif literal 'dapat dikenai penderitaan' akan kaku dan mudah disalahpahami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur ganda εἰ ... εἰ dipertahankan melalui 'bahwa ... dan bahwa ...'. Huruf kecil pada 'ia' mengikuti pemakaian bahasa Indonesia umum dan tidak menambahkan penandaan teologis yang tidak terdapat dalam sumber.
