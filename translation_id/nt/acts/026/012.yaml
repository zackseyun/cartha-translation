  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: id
  text: Dalam keadaan demikian[a] saya sedang dalam perjalanan ke Damsyik dengan wewenang dan penugasan dari para imam kepala,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Dalam hal-hal itu,” yang merujuk kembali pada tindakan dan niat Paulus yang disebut sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Dalam rangka itulah
  rationale: Ungkapan ini secara anaforis merujuk pada tindakan dan niat Paulus yang disebut sebelumnya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kaitan tersebut tanpa mempersempitnya menjadi 'misi' yang tidak dinyatakan secara eksplisit.
- source_word: πορευόμενος
  choice: saya sedang dalam perjalanan
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan peristiwa utama. Ungkapan ini wajar dan sesuai dengan konteks perjalanan menuju Damsyik.
- source_word: εἰς τὴν Δαμασκὸν
  choice: ke Damsyik
  rationale: Preposisi εἰς dengan nama kota secara alami menyatakan arah atau tujuan perjalanan.
- source_word: μετ’ ἐξουσίας
  choice: dengan wewenang
  rationale: ἐξουσία di sini menunjuk pada hak atau kewenangan yang didelegasikan, bukan sekadar kuasa atau kekuatan.
- source_word: ἐπιτροπῆς
  choice: tugas resmi
  rationale: Kata ini menunjuk pada penugasan atau amanat formal. 'Tugas resmi' mudah dipahami dan berpadu alami dengan 'wewenang'.
- source_word: τῆς τῶν ἀρχιερέων
  choice: dari para imam kepala
  rationale: Genitif ini paling alami dipahami sebagai sumber wewenang dan penugasan tersebut.
- source_word: ἀρχιερέων
  choice: para imam kepala
  rationale: Dalam konteks kepemimpinan Yahudi zaman Bait Allah Kedua, bentuk jamak ini menunjuk pada kalangan pemimpin keimaman, bukan pada beberapa orang yang secara bersamaan memegang jabatan tunggal imam besar.
