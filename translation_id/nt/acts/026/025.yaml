id: ACT.26.25
reference: Acts 26:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: id
  text: Namun Paulus berkata, “Saya tidak gila, Yang Mulia Festus,[a] tetapi saya menyampaikan perkataan yang benar dan masuk akal.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yang Mulia” adalah sapaan kehormatan resmi bagi seorang pejabat tinggi.
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “perkataan kebenaran dan pikiran yang sehat”; kata Yunani yang diterjemahkan “masuk akal” juga dapat mengandung arti kewarasan, pengendalian diri, atau sikap berpikir jernih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras langsung dengan tuduhan Festus pada ayat sebelumnya dan terdengar alami dalam narasi Indonesia.
- source_word: μαίνομαι
  choice: saya tidak gila
  rationale: Menyampaikan arti lugas verba yang berarti gila atau kehilangan kewarasan, sekaligus menggemakan tuduhan pada ayat sebelumnya.
- source_word: φησίν
  choice: berkata
  rationale: Bentuk kini historis Yunani wajar diterjemahkan dengan bentuk naratif Indonesia 'berkata'.
- source_word: κράτιστε
  choice: Yang Mulia
  rationale: Sapaan kehormatan resmi bagi pejabat tinggi; padanan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: ἀληθείας
  choice: yang benar
  rationale: 'Genitif kualitas pada ''perkataan'' diungkapkan secara alami sebagai sifat: perkataan yang benar.'
- source_word: σωφροσύνης
  choice: masuk akal
  rationale: Dalam kontras dengan tuduhan kegilaan, kata ini menunjuk pada kewarasan, penguasaan diri, dan pikiran yang sehat; 'masuk akal' secara alami menggambarkan isi ujaran yang waras dan bernalar.
- source_word: ῥήματα
  choice: perkataan
  rationale: Mempertahankan nomina jamak kolektif tentang hal-hal yang Paulus ucapkan dalam bentuk Indonesia yang wajar.
- source_word: ἀποφθέγγομαι
  choice: saya menyampaikan
  rationale: Menangkap nuansa berbicara dengan jelas atau menyatakan, tanpa membuat gaya Indonesia menjadi kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, santun, dan bermartabat. Sapaan 'Yang Mulia' mempertahankan formalitas Paulus kepada gubernur, sedangkan 'saya tidak gila' mempertahankan bantahan lugas terhadap tuduhan Festus. Ambiguitas σωφροσύνης dijaga dalam catatan kaki.
