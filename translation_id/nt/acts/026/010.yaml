id: ACT.26.10
reference: Acts 26:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: id
  text: 'Dan itulah yang kulakukan di Yerusalem: setelah menerima wewenang dari imam-imam kepala, aku mengurung banyak orang kudus[a] di dalam penjara-penjara. Ketika mereka sedang dibunuh, aku juga memberikan suara menentang mereka.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang kudus” di sini berarti umat Allah, yaitu orang-orang yang percaya kepada Yesus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Yunani menyebut tindakan memberikan atau menjatuhkan sebuah “suara” (ψῆφος), yaitu kerikil yang dipakai untuk menyatakan pilihan. Teks tidak menjelaskan bentuk lembaga atau tata cara pemungutan suara itu.
    reason: lexical_and_historical_clarification
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Dan itulah yang kulakukan
  rationale: Frasa ini merujuk kembali pada tindakan penganiayaan yang baru disebutkan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi penghubung καί tanpa menerjemahkannya secara kaku.
- source_word: ἐν Ἱεροσολύμοις
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: πολλούς τε τῶν ἁγίων
  choice: banyak orang kudus
  rationale: Dalam konteks Kisah Para Rasul, ἅγιοι menunjuk kepada anggota umat Allah yang percaya kepada Yesus, bukan hanya kelompok khusus yang kemudian ditetapkan sebagai santo atau santa.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: aku mengurung ... di dalam penjara
  rationale: κατακλείω berarti menutup atau menahan seseorang dalam kurungan. Ungkapan ini mempertahankan gambaran pengurungan; bentuk tunggal kolektif 'penjara' lebih wajar dalam bahasa Indonesia daripada 'penjara-penjara' dan tidak meniadakan bentuk jamak Yunani.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: Setelah menerima wewenang dari imam-imam kepala
  rationale: Partisip aoris menerangkan dasar tindakan Paulus dan secara wajar dinyatakan sebagai tindakan yang mendahului pengurungan. ἐξουσία diterjemahkan 'wewenang', sedangkan ἀρχιερεῖς diterjemahkan dengan istilah baku 'imam-imam kepala'.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: ketika mereka dihukum mati
  rationale: ἀναιρέω dalam konteks ini berarti membunuh atau menjatuhkan hukuman mati. Bentuk pasif dan hubungan waktunya dengan tindakan Paulus dipertahankan tanpa menentukan prosedur eksekusi yang tidak dijelaskan teks.
- source_word: κατήνεγκα ψῆφον
  choice: aku pun memberikan suara untuk menentang mereka
  rationale: ψῆφος secara harfiah adalah kerikil yang dipakai dalam pemungutan suara, lalu berarti 'suara'. Terjemahan ini mempertahankan kesan tindakan memberikan suara, sedangkan 'untuk menentang mereka' menyatakan arah permusuhannya yang tersirat jelas oleh konteks tanpa menentukan lembaga atau sidang tertentu.
theological_decisions:
- issue: Makna ἅγιοι
  choice: orang kudus, yaitu umat Allah yang percaya kepada Yesus
  alternative: orang-orang suci; umat Allah
  rationale: Istilah ini mencakup komunitas orang percaya dan tidak menunjuk hanya kepada golongan rohani elite atau orang yang secara resmi dikanonisasi. 'Orang kudus' mempertahankan hubungan leksikal dengan pemakaian Perjanjian Baru.
- issue: Daya ungkap κατήνεγκα ψῆφον
  choice: Paulus memberikan suara untuk menentang mereka
  alternative: Paulus sekadar menyetujui kematian mereka tanpa pemungutan suara resmi
  rationale: Ungkapan Yunani paling langsung menggambarkan pemberian suara. Namun, terjemahan dan catatan tidak menentukan bentuk lembaga, status keanggotaan Paulus, atau tata cara persidangan yang tidak disebutkan teks.
- issue: Hubungan ἀναιρουμένων αὐτῶν dengan κατήνεγκα ψῆφον
  choice: ketika mereka dihukum mati, Paulus memberikan suara untuk menentang mereka
  alternative: Paulus memberi persetujuan setelah mereka dibunuh
  rationale: Partisip kini pasif paling wajar dipahami sebagai keadaan atau proses yang bersamaan dengan pemberian suara, bukan sebagai tindakan yang telah selesai sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah agar mudah dipahami tanpa menghilangkan urutan logis teks Yunani. Bentuk 'kulakukan' dan 'aku' mempertahankan tuturan orang pertama Paulus; 'wewenang', 'imam-imam kepala', dan 'dihukum mati' dipilih sebagai istilah umum yang jelas dan tidak bercorak denominasi.
