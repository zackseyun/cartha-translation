  naturalness: Bahasa draft baku dan jelas. Revisi kecil membuat hubungan waktu lebih eksplisit dan menghindari kesan bahwa “Bahkan” merupakan penambahan retoris yang diperlukan oleh teks. “Penjara-penjara” secara aman mencerminkan bentuk jamak φυλακαῖς.
  terminology: “Orang kudus,” “wewenang,” dan “imam-imam kepala” sesuai serta bernada netral. “Memberikan suara menentang mereka” menyampaikan κατήνεγκα ψῆφον tanpa mengklaim bentuk lembaga tertentu.
