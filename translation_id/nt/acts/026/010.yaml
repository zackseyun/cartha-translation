  - severity: low
    issue: Bentuk tunggal “penjara”
    rationale: Walaupun bentuk tunggal kolektif dapat diterima dalam bahasa Indonesia, φυλακαῖς berbentuk jamak. “Penjara-penjara” dapat digunakan secara alami dan mencerminkan teks dengan lebih langsung.
