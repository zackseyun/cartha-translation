revisions:
- from: 'Dan itulah yang kulakukan di Yerusalem: Setelah menerima wewenang dari imam-imam kepala, aku mengurung banyak orang kudus[a] di dalam penjara. Bahkan, ketika mereka dihukum mati, aku pun memberikan suara untuk menentang mereka.[b]'
  to: 'Dan itulah yang kulakukan di Yerusalem: setelah menerima wewenang dari imam-imam kepala, aku mengurung banyak orang kudus[a] di dalam penjara-penjara. Ketika mereka sedang dibunuh, aku juga memberikan suara menentang mereka.[b]'
  rationale: Revisi mengganti “dihukum mati” dengan “sedang dibunuh” agar tidak menambahkan unsur vonis formal yang tidak dinyatakan oleh ἀναιρουμένων serta untuk mencerminkan aspek proses dari partisip kini pasif. Bentuk jamak “penjara-penjara” dipulihkan untuk menampilkan φυλακαῖς. Istilah dan catatan lain dipertahankan karena akurat, alami, dan tidak memaksakan rekonstruksi historis atau penafsiran doktrinal.
