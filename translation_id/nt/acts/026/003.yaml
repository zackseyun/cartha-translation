  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: id
  text: terutama karena Paduka memahami semua adat istiadat dan persoalan yang diperdebatkan di kalangan orang Yahudi.[a] Karena itu, saya memohon agar Paduka mendengarkan saya dengan sabar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua adat istiadat dan persoalan Yahudi yang diperdebatkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “saya meminta”; kata Yunani yang digunakan menyatakan permintaan yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: terutama karena
  rationale: Dalam konteks ini kata tersebut menonjolkan alasan Paulus merasa beruntung dapat menyampaikan pembelaannya di hadapan Agripa; bentuk kausal ini alami dalam bahasa Indonesia.
- source_word: γνώστην ὄντα σε
  choice: Paduka memahami
  rationale: Konstruksi partisipial ini menyatakan bahwa Agripa mengenal pokok-pokok tersebut dengan baik. 'Memahami' jelas dan tidak melebihkan maknanya menjadi keahlian teknis.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: semua adat istiadat ... di kalangan orang Yahudi
  rationale: κατὰ Ἰουδαίους menunjukkan lingkup atau kaitannya dengan orang Yahudi. Susunan ini mempertahankan kemungkinan bahwa frasa tersebut menerangkan kedua nomina yang dikoordinasikan.
- source_word: τε καὶ
  choice: dan
  rationale: Pasangan ini menghubungkan dua kategori yang berkaitan; 'dan' merupakan padanan Indonesia yang alami.
- source_word: ζητημάτων
  choice: persoalan yang diperdebatkan
  rationale: Dalam konteks peradilan, kata ini menunjuk pada masalah atau pertanyaan yang menjadi bahan perdebatan, bukan sekadar pertanyaan netral.
- source_word: διὸ
  choice: Karena itu
  rationale: Ungkapan ini menandai kesimpulan dari pengetahuan Agripa menuju permintaan Paulus.
- source_word: δέομαι
  choice: saya memohon
  rationale: Kata kerja ini menyampaikan permintaan yang sungguh-sungguh; 'memohon' mempertahankan kekuatannya tanpa terdengar usang.
- source_word: μακροθύμως
  choice: dengan sabar
  rationale: Keterangan ini meminta kesediaan untuk mendengar dengan kesabaran; ungkapan tersebut jelas dan wajar dalam konteks sidang.
- source_word: ἀκοῦσαί μου
  choice: mendengarkan saya
  rationale: Infinitif dengan objek genitif berarti mendengar atau menyimak seseorang. 'Mendengarkan saya' alami dan tidak menambahkan gagasan yang tidak tersurat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Paduka' dipakai sebagai sapaan hormat kepada Raja Agripa dan menjaga konteks resmi pembelaan Paulus; 'saya' mempertahankan kesantunan formal.
