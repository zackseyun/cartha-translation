  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: id
  text: Jadi, saya sendiri memang pernah menganggap bahwa saya harus melakukan banyak hal yang melawan nama Yesus orang Nazaret.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan banyak hal yang menentang nama Yesus orang Nazaret.”
    reason: alternatif leksikal untuk daya adversatif πρός dan ἐναντία
lexical_decisions:
- source_word: Ἐγὼ
  choice: saya sendiri
  rationale: Pronomina eksplisit ini bersifat emfatis karena subjek sudah tersirat dalam bentuk verba Yunani; “saya sendiri” mempertahankan penekanan pengakuan pribadi Paulus.
- source_word: μὲν οὖν
  choice: Jadi ... memang
  rationale: “Jadi” menandai kelanjutan atau simpulan ringan dari οὖν, sedangkan “memang” menyampaikan penekanan μέν secara wajar dalam bahasa Indonesia.
- source_word: ἔδοξα ἐμαυτῷ
  choice: pernah menganggap
  rationale: Ungkapan ini menunjuk pada penilaian Paulus sendiri pada masa lampau. “Menganggap” alami untuk penilaian batin, dan “pernah” memperjelas bahwa ini adalah pandangannya dahulu tanpa menambah isi teologis.
- source_word: δεῖν
  choice: harus
  rationale: Dalam konstruksi pikiran tidak langsung ini, δεῖν menyatakan keharusan sebagaimana dipersepsikan Paulus. “Harus” merupakan padanan Indonesia yang alami; bingkai “menganggap bahwa” menjadikannya jelas sebagai kewajiban yang ia rasakan, bukan keharusan ilahi yang objektif.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: melakukan banyak hal untuk menentang
  rationale: Pilihan ini mempertahankan banyaknya tindakan (πολλά) dan daya adversatif ἐναντία, sambil menghasilkan susunan yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: πρὸς τὸ ὄνομα
  choice: menentang nama
  rationale: Dengan ἐναντία πρᾶξαι, πρός berdaya adversatif. “Menentang nama” mempertahankan idiom alkitabiah dan tidak mempersempitnya menjadi hanya otoritas, reputasi, atau gerakan.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Yesus orang Nazaret
  rationale: Ναζωραῖος adalah sebutan yang mengaitkan Yesus dengan Nazaret. “Yesus orang Nazaret” merupakan ungkapan Indonesia yang alami dan mempertahankan fungsi identifikasinya.
theological_decisions:
- issue: Makna “nama” dalam hubungannya dengan Yesus
  choice: Mempertahankan idiom “nama Yesus”
  alternative: otoritas Yesus; pribadi Yesus; gerakan Yesus
  rationale: ὄνομα dapat mewakili pribadi, reputasi, pengakuan, dan otoritas Yesus. Mempertahankan “nama” menghindari pembatasan pada satu nuansa teologis.
- issue: Sifat keharusan dalam δεῖν
  choice: “menganggap bahwa saya harus” sebagai kewajiban yang dahulu dirasakan Paulus
  alternative: “ditetapkan bahwa saya harus,” yang dapat memberi kesan keharusan ilahi objektif
  rationale: δεῖν berada di bawah ἔδοξα ἐμαυτῷ, sehingga keharusan tersebut merupakan isi penilaian Paulus pada waktu itu, bukan pernyataan narator bahwa tindakannya benar-benar diwajibkan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Saya” sesuai dengan tuturan resmi Paulus di hadapan raja. Susunan tetap dekat dengan struktur dan penekanan Yunani, tetapi menghindari ungkapan kaku seperti “melakukan banyak hal yang berlawanan terhadap.”
