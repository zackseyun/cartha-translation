id: ACT.26.5
reference: Acts 26:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: id
  text: Mereka sudah mengenal saya sejak semula[a], jika mereka bersedia bersaksi, bahwa saya menjalani hidup sebagai seorang Farisi menurut aliran[b] yang paling ketat dalam agama kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejak awal” atau “sejak dahulu.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “aliran” di sini berarti kelompok atau golongan, bukan “bidat” dalam pengertian teknis yang berkembang kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: sudah mengenal
  rationale: Dalam konteks ini partisip tersebut menunjuk pada pengenalan sebelumnya yang berlanjut sebagai pengetahuan tentang Paulus; 'sudah mengenal' alami dalam bahasa Indonesia dan tidak memaksakan arti harfiah 'mengetahui sebelumnya'.
- source_word: ἄνωθεν
  choice: sejak semula
  rationale: Di sini kata ini menunjuk pada masa sejak awal atau sejak dahulu, bukan 'dari atas'. 'Sejak semula' mempertahankan kaitan dengan titik awal, sementara alternatif temporal dicatat dalam catatan kaki.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: jika mereka bersedia bersaksi
  rationale: θέλωσι menyatakan kemauan, sedangkan μαρτυρεῖν cocok diterjemahkan 'bersaksi' dalam suasana pengadilan.
- source_word: ἀκριβεστάτην
  choice: yang paling ketat
  rationale: Bentuk superlatif ini menggambarkan tingkat ketelitian atau keketatan tertinggi dalam menjalankan ketentuan kelompok keagamaan.
- source_word: αἵρεσιν
  choice: golongan
  rationale: Dalam konteks sejarah Yahudi ini kata tersebut berarti kelompok atau aliran yang dikenal, bukan 'bidat' dalam pengertian teknis gerejawi yang muncul kemudian.
- source_word: τῆς ἡμετέρας θρησκείας
  choice: dalam agama kita
  rationale: Frasa ini menunjuk pada agama bersama yang diakui Paulus dan para pendengarnya; bentuk Indonesia ini alami serta mempertahankan kata ganti inklusif dalam sumber.
- source_word: ἔζησα Φαρισαῖος
  choice: saya telah hidup sebagai orang Farisi
  rationale: Ungkapan ini merangkum cara hidup Paulus pada masa sebelumnya sekaligus identitas kelompoknya; 'sebagai orang Farisi' jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna αἵρεσις dalam konteks historis Yahudi
  choice: golongan
  alternative: sekte; aliran; bidat
  rationale: '''Golongan'' menyatakan kelompok Farisi sebagai salah satu kelompok dalam agama Yahudi tanpa memasukkan gagasan penyimpangan doktrinal yang melekat pada istilah ''bidat'' dalam penggunaan teologis kemudian.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-forensik yang bermartabat. 'Saya' dipakai sesuai konteks pidato resmi Paulus. Susunan kalimat dijaga dekat dengan alur Yunani, tetapi tetap alami dan mudah dipahami.
