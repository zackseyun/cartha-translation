    rationale: Catatan kaki b menjelaskan αἵρεσις yang diterjemahkan “golongan”; penanda sebaiknya langsung mengikuti padanan tersebut, bukan diletakkan di akhir kalimat.
  - severity: low
    issue: Frasa “hidup sebagai orang Farisi menurut golongan” agak kurang alami.
    rationale: Penyesuaian kecil pada verba dan struktur frasa membuat hubungan antara cara hidup Paulus dan “aliran yang paling ketat” lebih jelas dalam bahasa Indonesia modern, sambil mempertahankan cakupan makna κατὰ ... αἵρεσιν.
