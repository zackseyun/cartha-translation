  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: id
  text: Mengapa, jika Allah membangkitkan orang mati, kalian menganggapnya sulit dipercaya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται παρ’ ὑμῖν
  choice: Mengapa kamu menganggap
  rationale: Ungkapan ini secara harfiah berarti ‘mengapa dinilai oleh kamu’; bentuk aktif lebih alami dalam bahasa Indonesia dan tetap mempertahankan bahwa para pendengarlah yang membuat penilaian tersebut.
- source_word: ἄπιστον
  choice: mustahil
  rationale: Dalam konteks ini kata tersebut menunjuk pada sesuatu yang dianggap tidak dapat dipercaya; ‘mustahil’ menyampaikan daya retoris pertanyaan Paulus dengan alami.
- source_word: εἰ
  choice: bahwa
  rationale: Dalam pertanyaan retoris ini εἰ memperkenalkan isi yang dinilai mustahil, bukan terutama syarat hipotetis; ‘bahwa’ menghasilkan bahasa Indonesia yang wajar.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Allah membangkitkan orang mati
  rationale: Menjaga susunan gagasan Yunani dan memakai ungkapan baku serta jelas untuk tindakan Allah membangkitkan mereka yang mati.
theological_decisions:
- issue: Apakah kebangkitan dinyatakan sebagai kemungkinan bersyarat atau sebagai tindakan Allah yang sedang dipersoalkan
  choice: bahwa Allah membangkitkan orang mati
  alternative: jika Allah membangkitkan orang mati
  rationale: εἰ dapat berarti ‘jika’, tetapi di sini pertanyaan retoris berfokus pada alasan tindakan Allah itu dinilai tidak dapat dipercaya. ‘Bahwa’ menyampaikan fungsi kontekstual ini tanpa menyangkal daya Allah atau mengubahnya menjadi klaim mengenai waktu tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ‘kamu’ dipahami sebagai jamak berdasarkan ὑμῖν dan sesuai untuk ujaran langsung kepada para pendengar.
