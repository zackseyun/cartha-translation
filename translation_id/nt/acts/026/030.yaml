  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: id
  text: Lalu raja, gubernur, Bernike[a], dan orang-orang yang duduk bersama mereka berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bernike: dapat juga ditulis “Berenike”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: berdiri
  rationale: Bentuk aoris ἀνίστημι di sini menyatakan tindakan bangkit dari tempat duduk. 'Berdiri' alami dalam bahasa Indonesia dan sesuai dengan suasana persidangan resmi.
- source_word: τε
  choice: Lalu ... demikian juga
  rationale: Partikel τε menghubungkan tindakan ini dengan adegan sebelumnya dan mengoordinasikan para tokoh. 'Lalu' menyampaikan perkembangan narasi, sedangkan τε berikutnya tercermin dalam 'demikian juga'.
- source_word: ὁ βασιλεὺς
  choice: raja
  rationale: βασιλεύς berarti raja. Walaupun yang dimaksud ialah Agripa, teks Yunani memakai gelar, sehingga terjemahan mempertahankannya.
- source_word: ὁ ἡγεμὼν
  choice: gubernur
  rationale: Dalam konteks Kisah Para Rasul, ἡγεμών merujuk kepada gubernur provinsi Romawi; 'gubernur' merupakan padanan Indonesia yang tepat dan lazim.
- source_word: Βερνίκη
  choice: Bernike
  rationale: Nama Yunani Βερνίκη dialihaksarakan secara langsung sebagai 'Bernike'; bentuk tradisional Indonesia 'Bernike' mudah dikenali. Alternatif 'Berenike' dicatat dalam catatan kaki.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: orang-orang yang duduk bersama mereka
  rationale: Frasa ini secara harfiah menunjuk kepada mereka yang duduk bersama kedua tokoh tersebut, tanpa menambahkan dugaan tentang kedudukan sosial mereka.
- source_word: καὶ
  choice: dan
  rationale: καί mengoordinasikan orang-orang dan kelompok yang disebutkan; struktur penambahan itu dipertahankan dengan 'dan' serta koordinasi Indonesia yang alami.
