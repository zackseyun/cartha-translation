  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: id
  text: Lalu Agripa berkata kepada Festus, “Orang ini dapat dibebaskan seandainya ia tidak mengajukan banding kepada Kaisar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Dalam konteks ini, δέ menandai kelanjutan narasi dan peralihan kepada kesimpulan Agripa. “Lalu” mempertahankan fungsi penghubung itu secara alami.
- source_word: ἔφη
  choice: berkata
  rationale: Bentuk imperfek φημί lazim berfungsi sebagai pengantar perkataan sederhana dalam narasi; “berkata” alami dan tidak menonjolkan aspek secara berlebihan.
- source_word: Ἀπολελύσθαι
  choice: dibebaskan
  rationale: Infinitif perfek ἀπολύω menyatakan pelepasan atau pembebasan. Dalam konteks hukum ini, “dibebaskan” tepat tanpa mempersempit makna menjadi putusan bebas resmi.
- source_word: ἐδύνατο
  choice: sebenarnya dapat
  rationale: δύναμαι menyatakan kemungkinan atau kemampuan. Bersama klausa syarat yang tidak terpenuhi, “sebenarnya dapat” mengungkapkan kemungkinan masa lampau yang tidak terwujud.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: orang ini
  rationale: Ungkapan ini menunjuk kepada Paulus secara spesifik. “Orang ini” mempertahankan daya tunjuk οὗτος dan terdengar wajar dalam bahasa Indonesia.
- source_word: εἰ μὴ
  choice: seandainya ... tidak
  rationale: Konstruksi ini memperkenalkan syarat kontrafaktual. “Seandainya ia tidak ...” menyampaikan dengan jelas bahwa syarat tersebut pada kenyataannya tidak terpenuhi.
- source_word: ἐπεκέκλητο
  choice: mengajukan banding
  rationale: Dalam konteks hukum Romawi, ἐπικαλέω dengan objek Kaisar berarti memohon pengadilan kepada kaisar; “mengajukan banding” merupakan padanan hukum yang jelas dan tepat.
- source_word: Καίσαρα
  choice: Kaisar
  rationale: Καῖσαρ adalah gelar resmi dalam rumusan permohonan banding. “Kaisar” mempertahankan corak historis dan yuridisnya, alih-alih menggantinya dengan penjelasan “kaisar Romawi” atau “penguasa”.
