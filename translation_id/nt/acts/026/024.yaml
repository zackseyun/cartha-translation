- from: Ketika Paulus sedang menyampaikan pembelaannya itu, Festus berkata dengan suara keras, “Kamu sudah gila, Paulus! Pengetahuanmu yang luas membuatmu menjadi gila.”
  to: Ketika Paulus menyampaikan pembelaannya, Festus berkata dengan suara keras, “Kamu gila, Paulus! Pengetahuanmu yang luas membuatmu gila.”
  rationale: Revisi kecil ini menghilangkan nuansa aspektual tambahan pada "sudah", memperlancar frasa pembuka, dan menggunakan konstruksi kausatif Indonesia yang lebih langsung. Makna forensik ἀπολογουμένου, interupsi bersuara keras, serta pengulangan retoris antara μαίνῃ dan μανίαν tetap dipertahankan.
