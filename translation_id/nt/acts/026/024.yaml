  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: id
  text: Ketika Paulus menyampaikan pembelaannya, Festus berkata dengan suara keras, “Kamu gila, Paulus! Pengetahuanmu yang luas membuatmu gila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: sedang menyampaikan pembelaannya
  rationale: Genitif absolut menunjukkan tindakan yang berlangsung bersamaan, sedangkan verba ini membawa nuansa pembelaan lisan dalam konteks persidangan.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: dengan suara keras
  rationale: Frasa datif ini menyatakan cara dan secara wajar menggambarkan kerasnya interupsi Festus.
- source_word: φησιν
  choice: berkata
  rationale: Kala kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah urutan peristiwa.
- source_word: Μαίνῃ
  choice: Kamu sudah gila
  rationale: Ungkapan ini menyampaikan tuduhan langsung bahwa Paulus tidak waras; bentuk Indonesia ini tegas, alami, dan sesuai dengan konteks.
- source_word: τὰ πολλά ... γράμματα
  choice: Pengetahuanmu yang luas
  rationale: γράμματα dapat menunjuk pada tulisan, pendidikan, atau pengetahuan. Dalam tuduhan Festus, makna pendidikan atau pengetahuan luas paling sesuai, sambil tetap mengakui keluasan semantis istilah tersebut.
- source_word: εἰς μανίαν
  choice: menjadi gila
  rationale: εἰς menyatakan hasil atau gerak menuju suatu keadaan; konstruksi Indonesia ini mempertahankan nuansa perubahan menuju kegilaan.
- source_word: περιτρέπει
  choice: membuatmu
  rationale: Dalam konteks ini verba tersebut menyatakan penyebab yang membawa seseorang ke suatu keadaan; 'membuatmu menjadi' merupakan ungkapan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'gila' dipertahankan karena mencerminkan hubungan retoris antara μαίνῃ dan μανίαν dalam teks Yunani.
