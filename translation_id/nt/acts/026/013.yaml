  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: id
  text: Pada tengah hari, dalam perjalanan, saya melihat, ya Raja, cahaya dari surga, yang lebih terang daripada matahari[a], bersinar mengelilingi saya dan orang-orang yang bepergian bersama saya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “melampaui kecemerlangan matahari.” Bahasa Yunani menekankan bahwa cahaya itu mengungguli kecemerlangan matahari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Pada tengah hari
  rationale: Ungkapan genitif ini menyatakan waktu, yakni pertengahan hari. Pilihan ini alami dan mempertahankan kekhususan waktunya.
- source_word: κατὰ τὴν ὁδὸν
  choice: di jalan itu
  rationale: Frasa ini menunjukkan lokasi ketika perjalanan berlangsung. Bentuk definit dalam bahasa Yunani dicerminkan dengan 'itu'.
- source_word: εἶδον
  choice: saya melihat
  rationale: Bentuk aoristus ini menyatakan tindakan melihat secara langsung; padanan sederhana ini cukup tepat.
- source_word: βασιλεῦ
  choice: ya Raja
  rationale: Vokatif ini merupakan sapaan langsung kepada Agripa. 'Ya Raja' mempertahankan sapaan formal tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: οὐρανόθεν
  choice: dari surga
  rationale: Adverbia ini menunjukkan asal dari surga; dalam konteks perjumpaan pewahyuan di Kisah Para Rasul, 'surga' mempertahankan bobot naratif dan teologisnya.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: lebih terang daripada matahari
  rationale: ὑπέρ dengan akusatif menyatakan hal yang melampaui. Ungkapan Indonesia ini alami dan menyampaikan bahwa cahaya tersebut melampaui kecemerlangan matahari.
- source_word: φῶς
  choice: cahaya
  rationale: Nomina ini memperkenalkan fenomena yang dilihat Paulus. Bahasa Indonesia tidak memerlukan kata sandang tak tentu.
- source_word: περιλάμψαν
  choice: memancar mengelilingi
  rationale: Partisip ini menerangkan cahaya yang bersinar di sekeliling Paulus dan rekan-rekannya; pilihan ini mempertahankan nuansa sirkumferensial verba majemuk tersebut.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: orang-orang yang bepergian bersama saya
  rationale: Partisip kini dengan σύν menunjuk kepada sesama pelaku perjalanan tanpa menambahkan keterangan yang tidak ada dalam teks.
theological_decisions:
- issue: Makna οὐρανόθεν dalam konteks penglihatan pewahyuan
  choice: dari surga
  alternative: dari langit
  rationale: Konteks perjumpaan pewahyuan dan pemakaian bahasa tentang surga dalam Lukas–Kisah Para Rasul mendukung 'dari surga', tanpa menentukan lebih jauh hakikat peristiwa itu.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kata ganti 'saya' sesuai dengan tuturan formal Paulus di hadapan raja. Susunan satu kalimat dipertahankan, sementara frasa partisip diterjemahkan secara alami.
