id: ACT.26.27
reference: Acts 26:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: id
  text: Raja Agripa, apakah engkau percaya kepada para nabi?[a] Aku tahu bahwa engkau percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerima kesaksian para nabi” atau “memercayai pesan para nabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: apakah engkau percaya
  rationale: Bentuk kini aktif orang kedua tunggal ini menjadi pertanyaan langsung. Dalam konteks ini, 'percaya kepada' menyatakan penerimaan terhadap kesaksian para nabi.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Raja Agripa
  rationale: Bentuk vokatif diterjemahkan sebagai sapaan alami dalam bahasa Indonesia modern; nama ditransliterasikan menurut kelaziman Indonesia.
- source_word: τοῖς προφήταις
  choice: kepada para nabi
  rationale: Dativus bersama πιστεύω menunjuk kepada pihak atau kesaksian yang dipercayai. Terjemahan langsung ini tetap membiarkan para nabi mewakili kesaksian atau pesan mereka.
- source_word: οἶδα
  choice: Aku tahu
  rationale: Walaupun berbentuk perfektum, verba ini memiliki arti kini dan menyampaikan pernyataan Paulus secara lugas.
- source_word: ὅτι πιστεύεις
  choice: bahwa engkau percaya
  rationale: Pengulangan verba dipertahankan. Bahasa Indonesia tidak memerlukan unsur tambahan untuk menandai penegasan; konteks retoris sudah menyampaikannya.
theological_decisions:
- issue: Sifat kepercayaan kepada para nabi
  choice: percaya kepada para nabi
  alternative: menerima kesaksian para nabi; memercayai pesan para nabi
  rationale: Ungkapan Yunani paling wajar menunjuk pada penerimaan terhadap para nabi beserta kesaksian mereka. Terjemahan tidak memperluasnya menjadi ketaatan atau klaim doktrinal yang lebih lengkap.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan langsung tunggal dalam konteks historis, sedangkan 'Raja Agripa' mempertahankan gelar dan nama secara alami.
