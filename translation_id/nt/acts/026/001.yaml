  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: id
  text: 'Lalu Agripa berkata kepada Paulus, “Engkau diizinkan berbicara untuk membela dirimu sendiri.” Kemudian Paulus mengulurkan tangannya dan menyampaikan pembelaannya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai kelanjutan narasi; 'Lalu' memberikan alur yang alami tanpa memberi pertentangan yang tidak tersirat.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: berkata kepada Paulus
  rationale: Ungkapan idiomatis Indonesia yang tepat untuk konstruksi verba berbicara dengan πρὸς.
- source_word: Ἐπιτρέπεταί σοι
  choice: Engkau diizinkan
  rationale: Mempertahankan bentuk pasif serta nada resmi dalam suasana persidangan.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: berbicara untuk membela dirimu sendiri
  rationale: Dalam konteks hukum, ὑπέρ dengan kata ganti refleksif menunjuk pada berbicara demi kepentingan atau pembelaan diri; pilihan ini jelas dan alami.
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan waktu yang dinyatakan secara eksplisit dalam teks Yunani.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: mengulurkan tangannya
  rationale: Menerjemahkan gerakan fisik secara langsung tanpa menafsirkan lebih jauh jenis isyaratnya.
- source_word: ἀπελογεῖτο
  choice: menyampaikan pembelaannya
  rationale: Verba ini dalam konteks hukum berarti memberikan pembelaan. Bentuk imperfek menggambarkan tindakan pembelaan yang berlangsung, tetapi bahasa Indonesia tidak perlu menambahkan nuansa 'mulai' yang tidak eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa resmi yang sesuai dengan sidang. 'Engkau' dipakai dalam ujaran langsung untuk mempertahankan tingkat keformalan, sedangkan frasa hukum dibuat jelas bagi pembaca umum.
