  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: id
  text: “Mengenai semua hal yang dituduhkan orang-orang Yahudi kepada saya, Raja Agripa, saya menganggap diri saya beruntung karena hari ini saya akan menyampaikan pembelaan di hadapan Baginda,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: Mengenai semua hal yang
  rationale: περί dengan genitif memperkenalkan pokok perkara; frasa ini mempertahankan cakupan πάντων dan mengalir alami ke klausa tuduhan.
- source_word: ἐγκαλοῦμαι
  choice: dituduhkan ... kepada saya
  rationale: Kata ini menunjuk pada tuduhan resmi dalam konteks hukum. Bentuk pasif Yunani dialihkan secara idiomatis ke susunan bahasa Indonesia tanpa kehilangan makna forensiknya.
- source_word: ὑπὸ Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: ὑπό menandai pelaku tuduhan. Dalam konteks ini sebutan tersebut mengacu pada orang-orang Yahudi yang menuduh Paulus, bukan pada seluruh orang Yahudi tanpa kecuali.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Raja Agripa
  rationale: Bentuk vokatif dipertahankan sebagai sapaan langsung yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἥγημαι ἐμαυτὸν
  choice: saya menganggap diri saya
  rationale: ἡγέομαι dengan konstruksi ini berarti menilai atau menganggap diri berada dalam suatu keadaan.
- source_word: μακάριον
  choice: beruntung
  rationale: Dalam konteks pembelaan hukum, kata ini terutama menyatakan keadaan yang menguntungkan atau mujur, bukan secara eksplisit berkat teologis.
- source_word: ἐπὶ σοῦ
  choice: di hadapan Baginda
  rationale: Ungkapan ini menyatakan tampil di hadapan Agripa dalam suatu pemeriksaan. 'Baginda' cocok sebagai pronomina sapaan hormat kepada raja dan membedakannya dari pembaca umum.
- source_word: μέλλων
  choice: akan
  rationale: Dalam konteks tindakan yang segera dilakukan pada hari itu, bentuk prospektif Yunani dapat disampaikan secara alami dengan 'akan'.
- source_word: σήμερον
  choice: hari ini
  rationale: Padanan langsung dan alami untuk σήμερον.
- source_word: ἀπολογεῖσθαι
  choice: menyampaikan pembelaan
  rationale: Kata ini bersifat forensik dan menunjuk pada pemberian pembelaan terhadap tuduhan; pilihan ini lebih tepat daripada ungkapan umum 'membela diri'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa persidangan. Sapaan 'Baginda' mempertahankan penghormatan Paulus kepada Agripa. Ayat dibiarkan berakhir dengan koma karena secara sintaksis kalimat berlanjut ke ayat berikutnya.
