id: ACT.26.18
reference: Acts 26:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: id
  text: untuk membuka mata mereka, supaya mereka berbalik dari kegelapan kepada terang dan dari kekuasaan Iblis[a] kepada Allah, supaya mereka menerima pengampunan dosa dan bagian warisan di antara orang-orang yang telah dikuduskan[b] oleh iman kepada-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wewenang Iblis” atau “wilayah kekuasaan Iblis.” Istilah Yunani ini dapat berarti wewenang, kuasa untuk memerintah, atau ranah kekuasaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang telah dijadikan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: untuk membuka mata mereka
  rationale: Mempertahankan gambaran konkret tentang mata yang dibuka, yang dalam konteks ini juga menyatakan kesadaran rohani, tanpa menguraikan metafora itu di dalam teks utama.
- source_word: τοῦ ἐπιστρέψαι
  choice: supaya mereka berbalik
  rationale: Menyatakan tujuan dan mempertahankan bahasa perubahan arah tanpa memasukkan tafsiran yang lebih khusus seperti 'bertobat' atau bentuk pasif 'dipertobatkan'.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: dari kegelapan kepada terang
  rationale: Mempertahankan pertentangan metaforis sumber dengan ungkapan Indonesia yang alami dan jelas.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: dari kekuasaan Iblis
  rationale: ἐξουσία dapat menunjuk pada wewenang, kuasa pemerintahan, atau wilayah kekuasaan. 'Kekuasaan' cukup luas untuk mencakup nuansa otoritas dan dominasi dalam konteks ini.
- source_word: ἐπὶ τὸν θεόν
  choice: kepada Allah
  rationale: Secara alami menyatakan perpindahan arah dan kesetiaan, sejajar dengan gerak dari kegelapan kepada terang.
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: sehingga mereka menerima
  rationale: Meneruskan rangkaian tujuan/hasil dan menjaga gagasan bahwa hal-hal berikut diterima sebagai pemberian.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: pengampunan dosa
  rationale: Padanan Indonesia modern yang jelas dan lazim untuk pelepasan atau pengampunan dosa.
- source_word: κλῆρον
  choice: bagian warisan
  rationale: Menggabungkan gagasan tentang bagian yang diberikan dengan nuansa warisan umat Allah; lebih jelas daripada hanya 'bagian' dan lebih alami dalam susunan ini daripada 'suatu warisan'.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: di antara orang-orang yang telah dikuduskan
  rationale: 'Mempertahankan bentuk pasif perfektif: mereka telah dijadikan kudus dan tetap berada dalam keadaan itu.'
- source_word: πίστει τῇ εἰς ἐμέ
  choice: oleh iman kepada-Ku
  rationale: Menyatakan fungsi instrumental πίστει dan objek pribadi iman, yaitu Yesus, tanpa mengubahnya menjadi konstruksi genitif yang diperdebatkan.
theological_decisions:
- issue: Hubungan πίστει τῇ εἰς ἐμέ dengan ἡγιασμένοις
  choice: orang-orang yang telah dikuduskan oleh iman kepada-Ku
  alternative: menerima ... oleh iman kepada-Ku
  rationale: Letak frasa dan pembacaan yang paling langsung menghubungkan 'oleh iman kepada-Ku' dengan orang-orang yang telah dikuduskan. Terjemahan mempertahankan hubungan ini tanpa meniadakan kemungkinan bahwa iman berperan lebih luas dalam seluruh penerimaan berkat yang disebutkan.
- issue: Makna κλῆρος dalam konteks keselamatan
  choice: bagian warisan
  alternative: bagian; warisan
  rationale: Pilihan ini menjaga sekaligus gagasan tentang jatah atau bagian yang dianugerahkan dan nuansa warisan perjanjian, tanpa menentukan secara sempit isi eskatologisnya.
- issue: Makna πίστις
  choice: iman kepada-Ku
  alternative: kepercayaan kepada-Ku
  rationale: '''Iman'' merupakan istilah Indonesia yang wajar dan mapan, sedangkan konstruksi εἰς ἐμέ secara langsung menunjukkan Yesus sebagai tujuan atau objek iman.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Metafora mata, kegelapan, dan terang dipertahankan. Kapitalisasi “-Ku” mengikuti rujukan langsung kepada Yesus. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan.
