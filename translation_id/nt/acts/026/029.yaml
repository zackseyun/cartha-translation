  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: id
  text: Namun Paulus berkata, “Aku berdoa kepada Allah agar, entah dalam waktu singkat atau dalam waktu yang lama[a], bukan hanya engkau, tetapi juga semua orang yang mendengarkan aku hari ini, menjadi seperti aku—kecuali belenggu ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “entah hampir atau sepenuhnya”; ungkapan Yunani ini sulit ditafsirkan dan dapat mengacu pada kadar, upaya, atau waktu/lamanya.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Aku berdoa kepada Allah
  rationale: Bentuk optatif dengan ἄν menyatakan harapan atau keinginan bernuansa doa; datif τῷ θεῷ menunjukkan kepada siapa doa itu ditujukan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penyebutan Allah secara eksplisit.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: entah dalam waktu singkat atau dalam waktu lama
  rationale: Ungkapan berpasangan ini sulit ditafsirkan dan dapat menunjuk pada waktu, kadar, atau upaya. Pilihan utama mengikuti kemungkinan temporal yang sesuai dengan konteks, sedangkan ambiguitasnya dicatat dalam catatan kaki.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: bukan hanya engkau, tetapi juga semua orang yang mendengarkan aku hari ini
  rationale: Mempertahankan kontras yang ditekankan dan makna partisipel kini, yaitu mereka yang sedang mendengarkan Paulus. Kata ganti “engkau” sesuai dengan sapaan tunggal langsung kepada Agripa dan memberi register yang bermartabat.
- source_word: γενέσθαι
  choice: menjadi
  rationale: Infinitif aoris menyatakan keadaan hasil yang diharapkan. Dalam konstruksi “berdoa ... agar”, bahasa Indonesia cukup memakai “menjadi” tanpa modal tambahan.
- source_word: τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: menjadi seperti aku
  rationale: Menyampaikan perbandingan dengan keadaan Paulus secara jelas dan alami tanpa menambahkan isi teologis yang tidak dinyatakan.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: kecuali rantai ini
  rationale: παρεκτός menyatakan pengecualian, sedangkan δεσμοί dalam konteks pemenjaraan Paulus paling konkret diterjemahkan “rantai”. Bentuk tunggal kolektif “rantai ini” alami dalam bahasa Indonesia dan menunjuk pada belenggu yang sedang dikenakannya.
theological_decisions:
- issue: Penafsiran ἐν ὀλίγῳ καὶ ἐν μεγάλῳ dalam kaitannya dengan perkataan Agripa sebelumnya
  choice: 'Diterjemahkan sebagai kontras durasi: “entah dalam waktu singkat atau dalam waktu lama”.'
  alternative: “entah hampir atau sepenuhnya”; atau “dengan sedikit maupun banyak upaya”
  rationale: Frasa Yunani ini memang diperdebatkan dan dapat berkaitan dengan waktu, tingkat, atau upaya. Teks utama memakai kemungkinan temporal yang masuk akal, sementara alternatif disimpan dalam catatan kaki agar ambiguitas asli tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang wajar dan bermartabat. “Namun” menandai tanggapan Paulus; “engkau” mempertahankan sapaan tunggal yang formal tanpa terasa arkais. Tanda pisah menjaga daya retoris pengecualian terakhir.
