  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: id
  text: Lalu Agripa berkata kepada Paulus[a], “Dalam waktu singkat engkau sedang berusaha meyakinkan aku untuk menjadi seorang Kristen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hampir saja engkau membujuk aku menjadi seorang Kristen”; mungkin juga, “Dalam waktu sesingkat ini, apakah engkau menyangka dapat menjadikan aku seorang Kristen?” Ungkapan Yunani dapat menunjuk pada sedikit waktu atau kadar, dan nada Agripa mungkin tulus atau ironis.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Lalu Agripa
  rationale: δέ merupakan penghubung ringan. “Lalu” menyampaikan kelanjutan percakapan secara alami tanpa menegaskan pertentangan yang tidak pasti; artikel di depan nama diri tidak diterjemahkan.
- source_word: πρὸς τὸν Παῦλον
  choice: berkata kepada Paulus
  rationale: πρός dalam formula ujaran ini menandai orang yang disapa, sedangkan verba berkata tersirat. Verba itu dinyatakan agar kalimat Indonesia alami dan jelas.
- source_word: Ἐν ὀλίγῳ
  choice: Dalam waktu singkat
  rationale: Ungkapan ini dapat menunjuk pada sedikit waktu atau kadar. Pilihan utama mempertahankan kemungkinan temporal yang langsung, sementara makna “hampir” serta kemungkinan nada ironis dicatat dalam catatan kaki.
- source_word: με πείθεις
  choice: engkau sedang meyakinkan aku
  rationale: Bentuk kini πείθεις dapat menggambarkan tindakan yang sedang berlangsung dalam percakapan. “Meyakinkan” mempertahankan gagasan persuasi tanpa menambahkan bahwa upaya itu pasti berhasil.
- source_word: Χριστιανὸν
  choice: seorang Kristen
  rationale: Nomina predikatif ini menyatakan identitas atau status yang dihasilkan. “Seorang Kristen” adalah padanan Indonesia yang baku dan alami.
- source_word: ποιῆσαι
  choice: untuk menjadi
  rationale: Dalam konstruksi ini, ποιῆσαι menyatakan hasil berupa dijadikannya seseorang sebagai sesuatu. Bahasa Indonesia lebih alami memakai “untuk menjadi” daripada terjemahan harfiah “untuk membuat aku menjadi”, tanpa menghilangkan hasil yang dimaksud.
theological_decisions:
- issue: Nada dan daya ucapan Agripa
  choice: Pernyataan yang secara lahiriah menunjukkan bahwa Paulus sedang meyakinkan Agripa dalam waktu singkat.
  alternative: 'Ucapan ironis atau menepis: “Dalam waktu sesingkat ini apakah engkau menyangka dapat menjadikan aku seorang Kristen?”; atau bacaan derajat: “Engkau hampir meyakinkan aku untuk menjadi seorang Kristen.”'
  rationale: Bahasa Yunani tidak memastikan apakah Agripa tulus, mengelak, atau menyindir. Teks utama mengikuti kemungkinan temporal tanpa menambahkan bentuk pertanyaan, sedangkan kemungkinan lain dipertahankan dalam catatan kaki agar ketegangan penafsirannya tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal langsung dalam konteks historis; susunan kalimat dibuat alami sambil mempertahankan ambiguitas utama ungkapan Yunani.
