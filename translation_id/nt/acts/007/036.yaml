  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: id
  text: Dialah yang memimpin mereka keluar dengan mengadakan keajaiban dan tanda di tanah Mesir, di Laut Merah[a], dan di padang gurun selama empat puluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Laut Teberau.” Teks Yunani berbunyi “Laut Merah” (Ἐρυθρὰ Θάλασσα), sebutan baku dalam Perjanjian Baru dan Septuaginta untuk tempat bangsa Israel menyeberang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Dialah
  rationale: Kata tunjuk ini menegaskan kembali Musa sebagai tokoh yang sedang dibicarakan. “Dialah” mempertahankan tekanan retoris itu secara alami dalam bahasa Indonesia tanpa mengulang nama yang tidak terdapat dalam ayat ini.
- source_word: ἐξήγαγεν αὐτούς
  choice: memimpin mereka keluar
  rationale: Ungkapan ini mempertahankan arti membawa atau memimpin ke luar dan sesuai dengan konteks keluarnya Israel dari Mesir.
- source_word: ποιήσας
  choice: dengan mengadakan
  rationale: Partisip aoris ini menghubungkan keajaiban dan tanda dengan tindakan Musa ketika memimpin bangsa itu keluar. Bentuk ini mengalir alami tanpa memaksakan urutan waktu yang tidak dinyatakan secara tegas.
- source_word: τέρατα καὶ σημεῖα
  choice: berbagai keajaiban dan tanda
  rationale: '“Keajaiban dan tanda” mempertahankan pasangan istilah khas Lukas: perbuatan yang menimbulkan rasa takjub sekaligus menunjuk pada karya dan kuasa Allah. “Berbagai” membuat bentuk jamak terasa alami dalam bahasa Indonesia.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: di tanah Mesir
  rationale: “Tanah Mesir” mencerminkan γῇ dan mempertahankan susunan tiga lokasi dalam ayat ini.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: di Laut Merah
  rationale: Frasa Yunani secara harfiah adalah “Laut Merah,” sebutan baku dalam Perjanjian Baru dan Septuaginta. Preposisi “di” mempertahankan pola berulang ἐν dan tetap wajar dalam bahasa Indonesia.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: “Padang gurun” merupakan ungkapan Indonesia yang lazim untuk wilayah pengembaraan Israel dan tidak membatasi gambaran pada gurun pasir.
- source_word: ἔτη τεσσεράκοντα
  choice: selama empat puluh tahun
  rationale: “Selama” menyatakan rentang waktu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan kata tunjuk dan peran Musa dalam peristiwa keluaran
  choice: “Dialah” menunjuk secara tegas kepada Musa sebagai perantara manusia yang memimpin Israel keluar dan mengadakan tanda-tanda.
  alternative: Menerjemahkannya hanya sebagai “Ia,” yang akan mengurangi penekanan retoris, atau menyatakan secara eksplisit bahwa Musa bertindak dengan kuasanya sendiri.
  rationale: Konteks pidato Stefanus dengan tegas menunjuk kembali kepada Musa. Ayat ini menyebut peran Musa menurut cara bertutur Alkitab tentang karya Allah melalui seorang manusia, tanpa menyatakan bahwa kuasa tersebut berasal dari Musa secara mandiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penekanan pada Musa, pasangan “keajaiban dan tanda,” tiga lokasi, serta keterangan waktu. Penanda catatan kaki ditempatkan sesudah “Laut Merah,” yaitu pada frasa yang dijelaskannya.
