  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: id
  text: Pada kedatangan kedua, Yusuf dikenali oleh saudara-saudaranya,[a] dan keluarga Yusuf menjadi diketahui oleh Firaun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yusuf memperkenalkan dirinya kepada saudara-saudaranya.” Kata Yunani yang dipakai berbentuk pasif, tetapi dalam konteksnya pengenalan itu terjadi ketika Yusuf mengungkapkan identitasnya kepada mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kaum kerabat Yusuf” atau “silsilah Yusuf.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: pada kedatangan yang kedua
  rationale: Ungkapan eliptis ini berarti 'pada kesempatan yang kedua'; konteks menunjukkan kedatangan kedua saudara-saudara Yusuf ke Mesir. 'Kedatangan' membuat acuan itu jelas secara alami.
- source_word: ἀνεγνωρίσθη
  choice: dikenali
  rationale: Bentuk pasif Yunani dipertahankan. Dalam latar kisah Kejadian, hal ini terjadi ketika Yusuf menyatakan identitasnya, tetapi terjemahan utama tidak mengubah bentuk pasif menjadi refleksif.
- source_word: ἀδελφοῖς
  choice: saudara-saudaranya
  rationale: Yang dimaksud ialah saudara-saudara laki-laki Yusuf; dalam konteks ini bentuk Indonesia tersebut jelas dan alami.
- source_word: φανερὸν ἐγένετο
  choice: diketahui
  rationale: Ungkapan ini menyatakan bahwa sesuatu menjadi diketahui atau nyata bagi seseorang. 'Diketahui oleh' idiomatis dengan Firaun sebagai pihak yang menerima informasi.
- source_word: γένος
  choice: asal-usul
  rationale: Di sini kata tersebut menunjuk pada kaum kerabat atau latar keluarga Yusuf. 'Asal-usul' sesuai dengan hal yang diketahui Firaun, sambil menghindari arti modern yang menyesatkan seperti 'ras'.
- source_word: τῷ Φαραώ
  choice: oleh Firaun
  rationale: Datif menandai orang yang kepadanya hal itu menjadi diketahui; konstruksi pasif Indonesia 'diketahui oleh Firaun' menyampaikan relasi tersebut secara alami.
