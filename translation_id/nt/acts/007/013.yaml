  source_fidelity: Klausa pertama secara tepat mempertahankan bentuk pasif ἀνεγνωρίσθη melalui “dikenali.” Namun, γένος dalam konteks ini menunjuk pada keluarga atau kaum kerabat Yusuf, bukan “asal-usul” Yusuf. Karena itu, “asal-usul Yusuf” menggeser rujukan dari kelompok kerabat kepada latar belakang atau asalnya.
  naturalness: “Pada kedatangan kedua” lebih ringkas dan alami daripada “Pada kedatangan yang kedua.” “Keluarga Yusuf menjadi diketahui oleh Firaun” merupakan bahasa Indonesia baku dan jelas dalam konteks ini.
  terminology: “Keluarga Yusuf” dengan tepat menerjemahkan γένος tanpa memakai “ras” atau membatasi makna menjadi silsilah/asal-usul. Catatan kaki mempertahankan alternatif “kaum kerabat.”
