- from: Pada kedatangan yang kedua, Yusuf dikenali oleh saudara-saudaranya,[a] dan asal-usul Yusuf diketahui oleh Firaun.[b]
  to: Pada kedatangan kedua, Yusuf dikenali oleh saudara-saudaranya,[a] dan keluarga Yusuf menjadi diketahui oleh Firaun.[b]
  rationale: Mengganti “asal-usul Yusuf” dengan “keluarga Yusuf” agar γένος diterjemahkan sesuai rujukan kontekstualnya kepada kerabat Yusuf. Penyederhanaan “kedatangan yang kedua” menjadi “kedatangan kedua” hanya meningkatkan kelancaran tanpa mengubah makna. Bentuk pasif pada klausa pertama dan penjelasan ambiguitasnya dalam catatan kaki dipertahankan.
