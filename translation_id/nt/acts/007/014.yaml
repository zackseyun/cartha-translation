id: ACT.7.14
reference: Acts 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: id
  text: Lalu Yusuf mengirim pesan untuk memanggil Yakub, ayahnya, beserta seluruh sanak saudaranya[a], yang semuanya berjumlah tujuh puluh lima orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa bagian Perjanjian Lama menyebut jumlah keseluruhannya “tujuh puluh” (misalnya, teks Ibrani Kejadian 46:27 dan Keluaran 1:5), sedangkan ayat ini menyebut “tujuh puluh lima”.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: mengirim pesan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Karena objek pengiriman tidak disebutkan dan tindakannya bertujuan memanggil orang, 'mengirim pesan' menyampaikan implikasinya secara wajar tanpa menambahkan utusan tertentu.
- source_word: δὲ
  choice: Lalu
  rationale: Kata penghubung ini menandai kelanjutan alur cerita; 'Lalu' alami dalam penuturan bahasa Indonesia.
- source_word: μετεκαλέσατο
  choice: untuk memanggil
  rationale: Verba medium ini berarti memanggil atau menyuruh seseorang datang. Frasa ini alami setelah 'mengirim pesan' dan mempertahankan hubungan kedua tindakan tersebut.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Yakub, ayahnya
  rationale: Menerjemahkan konstruksi aposisi secara langsung dan jelas.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: seluruh sanak saudaranya
  rationale: συγγένεια menunjuk kelompok kerabat. 'Sanak saudara' merupakan ungkapan Indonesia modern yang mencakup kerabat secara luas.
- source_word: ἐν ψυχαῖς
  choice: yang semuanya berjumlah ... orang
  rationale: Secara harfiah berarti 'dalam jiwa-jiwa', tetapi di sini merupakan idiom penghitungan manusia. 'Berjumlah ... orang' menyampaikan maknanya tanpa konotasi teologis yang tidak ditonjolkan oleh konteks.
- source_word: ἑβδομήκοντα πέντε
  choice: tujuh puluh lima
  rationale: Padanan langsung bagi bilangan dalam teks Yunani.
theological_decisions:
- issue: Jumlah keluarga Yakub dibandingkan dengan tradisi teks Kejadian dan Keluaran
  choice: tujuh puluh lima orang
  alternative: tujuh puluh orang
  rationale: Teks Yunani Kisah Para Rasul secara eksplisit menyebut tujuh puluh lima. Terjemahan mempertahankan angka tersebut dan mencatat perbedaan dengan beberapa bagian Perjanjian Lama, tanpa menyelaraskan ketegangan tekstual itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Sanak saudara' dipilih agar cakupan kekerabatan tetap luas; susunan kalimat dibuat alami tanpa mengaburkan urutan tindakan dalam teks Yunani.
