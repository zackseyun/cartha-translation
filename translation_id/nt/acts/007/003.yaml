source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: id
  text: Lalu Dia berkata kepadanya, “Keluarlah dari negerimu dan dari kaum kerabatmu,[a] lalu datanglah ke negeri yang akan Kutunjukkan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak saudaramu” atau “keluargamu.” Kata Yunani συγγένεια mengacu pada kelompok kekerabatan atau kaum kerabat seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: Dia berkata kepadanya
  rationale: Mempertahankan pronomina Yunani tanpa menggantinya dengan nama Abraham; konteks sebelumnya menentukan rujukannya. Huruf kapital pada “Dia” menandai Allah sebagai pembicara sesuai konteks.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Keluarlah dari negerimu
  rationale: “Keluarlah” mempertahankan gambaran gerak keluar dalam ἐξέρχομαι dan konstruksi ἐκ, sedangkan “negeri” menyampaikan wilayah asal tanpa konotasi negara-bangsa modern yang terlalu kuat.
- source_word: ἐκ τῆς συγγενείας σου
  choice: dari kaum kerabatmu
  rationale: “Kaum kerabat” menyampaikan συγγένεια sebagai kelompok kekerabatan secara kolektif, lebih luas daripada keluarga inti.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: datanglah ke negeri
  rationale: “Datanglah” mempertahankan nuansa deiktis δεῦρο. Preposisi “ke” merupakan ungkapan Indonesia yang alami untuk gerak menuju suatu wilayah.
- source_word: ἣν ἄν σοι δείξω
  choice: yang akan Kutunjukkan kepadamu
  rationale: Konstruksi relatif dengan ἄν dan aoristus subjungtif berorientasi ke masa depan; “akan Kutunjukkan” alami dalam bahasa Indonesia dan tidak menyiratkan keraguan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk enklitik “-lah” dipakai untuk perintah, dan pronomina yang merujuk kepada Allah ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab bahasa Indonesia.
