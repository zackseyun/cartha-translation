  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: id
  text: Orang itu[a] bertindak licik terhadap bangsa kita dan menindas nenek moyang kita dengan membuat mereka menelantarkan bayi-bayi mereka[b] supaya bayi-bayi itu tidak tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang itu memperlakukan bangsa kita dengan licik.” Kata Yunani yang dipakai menekankan tindakan atau perlakuan yang cerdik dan menipu.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, bayi-bayi itu ditelantarkan atau dipaparkan, suatu praktik yang dimaksudkan agar mereka dibiarkan mati.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Orang itu
  rationale: Menunjuk kembali kepada raja yang baru disebut, sambil mempertahankan daya demonstratif οὗτος dalam bahasa Indonesia yang alami.
- source_word: κατασοφισάμενος
  choice: memperdaya
  rationale: Kata ini menyatakan tindakan licik atau penuh tipu muslihat terhadap suatu pihak; 'memperdaya' menyampaikan nuansa negatif itu secara ringkas dan alami.
- source_word: τὸ γένος ἡμῶν
  choice: bangsa kita
  rationale: Dalam konteks ini γένος menunjuk kepada umat Israel sebagai kelompok etnis-historis; 'bangsa kita' lebih tepat daripada 'ras kita' dalam bahasa Indonesia modern.
- source_word: ἐκάκωσεν
  choice: menindas
  rationale: Verba ini berarti memperlakukan dengan buruk atau mencelakakan. Dalam konteks kebijakan raja terhadap Israel, 'menindas' alami dan sesuai, tanpa mengubah pokok maknanya.
- source_word: τοὺς πατέρας
  choice: nenek moyang kita
  rationale: Yang dimaksud ialah generasi Israel terdahulu. 'Nenek moyang kita' menyampaikan rujukan historis-familial secara jelas dalam bahasa Indonesia.
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: dengan membuat mereka membuang bayi-bayi mereka
  rationale: Artikular infinitif dapat menyatakan cara atau akibat. Terjemahan ini mempertahankan hubungan kausatif tanpa menambahkan gagasan pemaksaan secara eksplisit; ἔκθετα dijelaskan secara idiomatis sebagai membuang atau menelantarkan bayi.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: supaya bayi-bayi itu tidak dibiarkan hidup
  rationale: Frasa ini mempertahankan nuansa tujuan atau akibat serta bentuk pasif ζῳογονεῖσθαι, yaitu tidak dipelihara atau dibiarkan tetap hidup.
theological_decisions:
- issue: Apakah τοῦ ποιεῖν harus diterjemahkan sebagai pemaksaan eksplisit
  choice: dengan membuat mereka
  alternative: dengan memaksa mereka
  rationale: Bahasa Yunani menyatakan hubungan kausatif/cara atau akibat, tetapi tidak memakai verba khusus yang berarti 'memaksa'. Karena itu, terjemahan tidak memperkuat kadar paksaan melampaui bentuk sumber, walaupun konteks kebijakan Firaun jelas bersifat menindas.
- issue: Hubungan εἰς τό sebagai tujuan atau akibat
  choice: supaya
  alternative: sehingga
  rationale: Konstruksi ini dapat memuat tujuan atau hasil. 'Supaya' cocok dengan maksud kebijakan tersebut, tetapi ketegangan tujuan/akibat tetap diakui sebagai kemungkinan gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Orang itu' mempertahankan penunjukan kepada raja sebelumnya; 'nenek moyang' lebih alami daripada 'bapa-bapa' untuk leluhur Israel. Pengulangan 'bayi-bayi itu' menghindari ketidakjelasan rujukan pronomina pada akhir ayat.
