- from: Orang itu[a] memperdaya bangsa kita dan menindas nenek moyang kita dengan membuat mereka membuang bayi-bayi mereka[b] supaya bayi-bayi itu tidak dibiarkan hidup.
  to: Orang itu[a] bertindak licik terhadap bangsa kita dan menindas nenek moyang kita dengan membuat mereka menelantarkan bayi-bayi mereka[b] supaya bayi-bayi itu tidak tetap hidup.
  rationale: Revisi mengganti ungkapan yang terlalu umum, “membuang bayi-bayi mereka,” dengan “menelantarkan bayi-bayi mereka” untuk mencerminkan ἔκθετα secara lebih akurat. Ungkapan bagi κατασοφισάμενος dan catatan budaya juga disesuaikan agar tidak menambahkan unsur pemaksaan secara leksikal, sambil tetap mempertahankan konteks perlakuan menindas.
