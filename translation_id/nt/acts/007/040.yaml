id: ACT.7.40
reference: Acts 7:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: id
  text: dengan berkata kepada Harun, “Buatlah bagi kami ilah-ilah[a] yang akan berjalan di depan kami. Sebab Musa ini, yang telah membawa kami keluar dari tanah Mesir—kami tidak tahu apa yang telah terjadi padanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala-berhala”. Kata Yunani secara harfiah berarti “ilah-ilah”, mengikuti kata-kata dalam kisah Keluaran dan mempertahankan sebutan yang digunakan bangsa itu, alih-alih menggantinya dengan label penafsiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: dengan berkata kepada Harun
  rationale: Partisip aoris ini melanjutkan kalimat sebelumnya dan memperkenalkan isi perkataan mereka; 'dengan berkata' mempertahankan kaitan tersebut secara wajar.
- source_word: Ποίησον ἡμῖν
  choice: Buatlah bagi kami
  rationale: Imperatif ποιέω berarti membuat atau menghasilkan; bentuk ini langsung, alami, dan mempertahankan unsur penerima manfaat ἡμῖν.
- source_word: θεοὺς
  choice: ilah-ilah
  rationale: Bentuk jamak θεός secara leksikal berarti 'ilah-ilah'. Pilihan ini mempertahankan perkataan yang dinisbatkan kepada bangsa itu dan tidak menggantinya dengan label penafsiran 'berhala'.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: yang akan berjalan di depan kami
  rationale: προπορεύομαι berarti berjalan mendahului atau di depan. Terjemahan ini mempertahankan gambaran gerak tanpa menambahkan makna eksplisit 'memimpin'.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: Sebab Musa ini
  rationale: γάρ memberikan alasan bagi permintaan tersebut, sedangkan οὗτος dipertahankan dengan 'ini', yang dalam konteks dapat mengandung nada menjaga jarak atau meremehkan.
- source_word: ἐξήγαγεν ἡμᾶς
  choice: telah membawa kami keluar
  rationale: ἐξάγω berarti membawa atau menuntun keluar. 'Membawa ... keluar' alami dalam bahasa Indonesia dan tidak mengharuskan nuansa kepemimpinan.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan γῆς secara eksplisit dan merupakan ungkapan Indonesia yang lazim.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: kami tidak tahu apa yang telah terjadi padanya
  rationale: Ungkapan ini menyampaikan keadaan kini dari ketidaktahuan mereka mengenai apa yang telah menimpa Musa, dengan bahasa Indonesia modern dan jelas.
theological_decisions:
- issue: Penerjemahan θεοὺς dalam konteks penyembahan berhala
  choice: ilah-ilah
  alternative: berhala-berhala
  rationale: Teks Yunani melaporkan tuntutan bangsa itu dengan bentuk jamak θεός, bukan dengan kata khusus yang berarti 'berhala'. 'Ilah-ilah' menjaga bentuk leksikal, gema kisah Keluaran, dan ironi kemurtadan mereka tanpa menyelesaikan ketegangan itu melalui label penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Tanda pisah mempertahankan jeda penegasan sebelum pengakuan 'kami tidak tahu'. Istilah 'ilah-ilah' dipilih agar berbeda dari 'Allah' dan tetap menunjukkan bentuk jamak sumber.
