  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: id
  text: Mereka kemudian dipindahkan ke Sikhem dan diletakkan di dalam makam yang telah dibeli Abraham dengan sejumlah perak dari anak-anak Hemor di Sikhem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perkataan Stefanus menggabungkan rincian yang dapat dibandingkan dengan Kejadian 23, ketika Abraham membeli tempat pemakaman dari Efron di Makpela, dan Kejadian 33:19, ketika Yakub membeli sebidang tanah dekat Sikhem dari anak-anak Hemor.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: dibawa
  rationale: Bentuk pasif ini menyatakan pemindahan jenazah para leluhur. 'Dibawa' alami dalam konteks pemindahan jenazah tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: Συχὲμ / Συχέμ
  choice: Sikhem
  rationale: Bentuk nama tempat yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: ἐτέθησαν
  choice: dimakamkan
  rationale: Secara harfiah berarti 'diletakkan', tetapi dalam konteks makam, 'dimakamkan' menyampaikan tindakan penguburan secara alami dan tepat.
- source_word: μνήματι
  choice: makam
  rationale: Kata ini menunjuk pada tempat penguburan; 'makam' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: ᾧ
  choice: yang
  rationale: Kata ganti relatif ini menerangkan makam dan secara alami diterjemahkan 'yang'.
- source_word: ὠνήσατο
  choice: telah dibeli
  rationale: Verba ini berarti membeli. 'Telah dibeli' menandai bahwa pembelian terjadi sebelum pemakaman tanpa memaksakan ketepatan waktu yang lebih jauh.
- source_word: τιμῆς ἀργυρίου
  choice: dengan sejumlah perak
  rationale: Ungkapan ini menyatakan harga dalam perak. 'Sejumlah perak' alami dalam bahasa Indonesia serta mempertahankan bahan pembayaran tanpa menentukan jumlah.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: dari anak-anak Hemor
  rationale: παρά dengan genitif menyatakan sumber penjual, sedangkan 'anak-anak Hemor' mempertahankan bentuk jamak teks.
- source_word: ἐν Συχέμ
  choice: di Sikhem
  rationale: Terjemahan langsung ini mempertahankan ketaksaan hubungan frasa terakhir—dengan Hemor, para anaknya, atau lokasi transaksi—tanpa menyelesaikannya secara diam-diam.
theological_decisions:
- issue: Ketegangan historis dengan kisah pembelian tempat pemakaman dalam Kejadian
  choice: 'Mempertahankan perkataan Stefanus sebagaimana terdapat dalam teks Yunani: Abraham membeli makam dari anak-anak Hemor di Sikhem.'
  alternative: Menyelaraskannya dengan pembelian Yakub dalam Kejadian 33:19 atau dengan pembelian Abraham di Makhpela dalam Kejadian 23.
  rationale: Terjemahan harus mewakili teks Yunani sebagaimana adanya dan tidak memasukkan harmonisasi ke dalam ayat. Catatan kaki memberi pembaca rujukan yang relevan tanpa menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ketegangan historis dan ketaksaan frasa penutup tetap dipertahankan.
