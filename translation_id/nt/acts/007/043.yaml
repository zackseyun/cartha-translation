language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: id
  text: Dan kamu mengusung kemah Molokh dan bintang dewa Refan[a], rupa-rupa yang kamu buat untuk kamu sembah.[b] Karena itu, Aku akan memindahkan kamu ke pembuangan melampaui Babel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan, dengan mengikuti teks Ibrani Amos 5:26, memakai “dewamu Refan”. Namun, teks Yunani Kisah Para Rasul di sini berbunyi “dewa Refan”.
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “rupa-rupa” juga dapat berarti “bentuk-bentuk”, “gambaran-gambaran”, atau “patung-patung”.
    reason: lexical_alternative
  - marker: c
    text: Kisah Para Rasul di sini berbunyi “melampaui Babel”. Dalam Amos 5:27, bagian yang dikutip ini lazim diterjemahkan “melampaui Damsyik”.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: mengusung
  rationale: Kata ini dalam konteks benda-benda pemujaan berarti mengangkat lalu membawanya; “mengusung” menyampaikan tindakan membawa benda kultis tanpa menambahkan penafsiran yang tidak dinyatakan.
- source_word: σκηνὴν
  choice: kemah
  rationale: Arti dasarnya adalah kemah. Pilihan ini menghindari kesan bahwa yang dimaksud ialah Kemah Suci yang sah, sedangkan “kuil” atau “tempat pemujaan” lebih interpretatif.
- source_word: Μολὸχ
  choice: Molokh
  rationale: Nama diri ditransliterasikan dari bentuk Yunani dengan ejaan yang wajar dalam bahasa Indonesia dan tetap membedakannya sebagai nama ilah.
- source_word: ἄστρον
  choice: bintang
  rationale: Arti leksikal langsungnya ialah bintang; kemungkinan bahwa ini merupakan lambang atau citra bintang tidak dimasukkan secara diam-diam ke dalam teks utama.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: dewa Refan
  rationale: Konstruksi Yunani menyebut “dewa Refan”, bukan “dewamu Refan”. Kata “dewa” sesuai untuk ilah yang dipuja secara berhala dalam konteks ini.
- source_word: τύπους
  choice: patung-patung
  rationale: Dalam konteks pemujaan berhala, kata ini menunjuk pada bentuk atau representasi yang dibuat. “Patung-patung” alami bagi pembaca Indonesia, sementara keluasan maknanya dipertahankan dalam catatan.
- source_word: προσκυνεῖν αὐτοῖς
  choice: untuk kamu sembah
  rationale: Dalam konteks keagamaan, προσκυνέω secara alami berarti menyembah; objeknya merujuk pada representasi atau ilah berhala yang baru disebut.
- source_word: μετοικιῶ
  choice: Aku akan membuang
  rationale: Kata kerja ini menyatakan pemindahan paksa ke pembuangan. “Membuang” mempertahankan unsur hukuman dan menghasilkan ungkapan Indonesia yang alami bersama keterangan tempat berikutnya.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: ke tempat yang lebih jauh daripada Babel
  rationale: ἐπέκεινα menyatakan tempat di seberang atau lebih jauh daripada suatu titik. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “melampaui Babel” dan tetap mengikuti bacaan Babel dalam Kisah Para Rasul.
theological_decisions:
- issue: Perbedaan kutipan Stefanus dari Amos mengenai tujuan pembuangan
  choice: lebih jauh daripada Babel
  alternative: lebih jauh daripada Damsyik
  rationale: Teks Yunani Kisah Para Rasul secara tegas berbunyi Babel. Terjemahan tidak diselaraskan dengan Amos 5:27, dan perbedaannya dicatat agar ketegangan antarteks tetap terlihat.
- issue: Hubungan frasa tujuan dengan pembuatan patung-patung
  choice: patung-patung yang kamu buat untuk kamu sembah
  alternative: bentuk-bentuk yang kamu buat untuk bersujud kepadanya
  rationale: Infinitif προσκυνεῖν paling wajar dipahami sebagai tujuan pembuatan representasi tersebut. Terjemahan mempertahankan tuduhan pemujaan berhala tanpa menentukan lebih jauh apakah kata ganti itu secara konseptual merujuk pada patung, benda langit, atau dewa yang diwakilinya.
- issue: Bacaan tentang Refan dibandingkan dengan sumber Ibrani Amos 5:26
  choice: dewa Refan
  alternative: dewamu Refan
  rationale: Teks Yunani Kisah Para Rasul berbunyi “dewa Refan”. Bacaan “dewamu” berasal dari latar sumber Ibrani dan dicatat tanpa menggantikan bacaan kitab Kisah Para Rasul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengusung” dipilih untuk benda pemujaan yang dibawa; “dewa” membedakan ilah berhala dari Allah; kapitalisasi “Aku” mengikuti ucapan ilahi dalam kutipan. Susunan kalimat dibuat alami tanpa menghilangkan hubungan antarklausa atau perbedaan tekstual dengan Amos.
