base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: id
  text: 'Namun, Yang Mahatinggi tidak tinggal di dalam buatan tangan manusia[a], sebagaimana nabi berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam tempat-tempat ibadah buatan tangan manusia.” Ungkapan Yunani lebih luas, yaitu “di dalam buatan tangan manusia,” meskipun Bait Allah menjadi pokok dalam konteks langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan yang kuat dengan pernyataan sebelumnya tentang rumah yang dibangun Salomo, sekaligus mengalir wajar dalam bahasa Indonesia.
- source_word: οὐχ
  choice: tidak
  rationale: Menyatakan negasi langsung terhadap verba κατοικεῖ.
- source_word: ὁ ὕψιστος
  choice: Yang Mahatinggi
  rationale: Mempertahankan gelar ilahi tanpa menambahkan kata 'Allah', yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: ἐν χειροποιήτοις
  choice: di dalam apa yang dibuat oleh tangan manusia
  rationale: Mempertahankan cakupan ungkapan Yunani yang lebih luas daripada hanya 'Bait Allah', sambil menjelaskan bahwa tangan manusialah yang dimaksud.
- source_word: κατοικεῖ
  choice: tinggal
  rationale: Padanan alami yang tetap sesuai untuk pembicaraan tentang tempat kediaman atau kehadiran ilahi.
- source_word: καθὼς
  choice: seperti
  rationale: Memperkenalkan kutipan nabi sebagai peneguhan yang bersesuaian dengan pernyataan sebelumnya.
- source_word: ὁ προφήτης
  choice: nabi
  rationale: Tidak menambahkan nama Yesaya karena teks Yunani hanya menyebut 'nabi'.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk Indonesia ini menghasilkan formula pengantar kutipan yang alami; isi perkataan nabi tetap dipandang berlaku dalam kutipan Kitab Suci.
theological_decisions:
- issue: Apakah χειροποιήτοις perlu dibatasi menjadi 'Bait Allah' atau 'tempat ibadah'
  choice: Memakai ungkapan luas 'apa yang dibuat oleh tangan manusia'
  alternative: '''Bait Allah yang dibuat oleh tangan manusia'' atau ''tempat ibadah buatan tangan manusia'''
  rationale: Konteks langsung memang mengenai Bait Allah, tetapi bentuk Yunani lebih luas. Ungkapan luas menjaga daya polemis dan ketegangan teologis teks tanpa mempersempit acuannya.
- issue: Apakah ὁ ὕψιστος perlu diperluas menjadi 'Allah Yang Mahatinggi'
  choice: Yang Mahatinggi
  alternative: Allah Yang Mahatinggi
  rationale: Gelar itu jelas merujuk kepada Allah, tetapi θεός tidak terdapat dalam teks sumber; terjemahan tidak perlu menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Yang Mahatinggi' mempertahankan bentuk gelar ilahi; 'apa yang dibuat oleh tangan manusia' cukup alami sekaligus menjaga keluasan makna sumber.
