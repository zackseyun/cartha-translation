  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: id
  text: Tetapi mereka berteriak dengan suara nyaring, menutup telinga mereka, lalu bersama-sama[a] menyerbu dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan sehati" atau "dengan satu tujuan." Kata Yunani ini menekankan tindakan mereka yang bersatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: mereka berteriak
  rationale: Partisip aoris ini menyatakan teriakan keras yang mengiringi tindakan berikutnya. Bentuk verbal ini alami dalam narasi Indonesia tanpa menambahkan emosi tertentu.
- source_word: δὲ
  choice: Tetapi
  rationale: Partikel ini menandai peralihan yang bernuansa kontras dari penglihatan Stefanus kepada reaksi bermusuhan orang banyak.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan ini mempertahankan gambaran konkret suara yang keras dan terdengar alami dalam bahasa Indonesia modern.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: menutup telinga
  rationale: Idiom Yunani ini berarti membuat telinga tertutup agar tidak mendengar; 'menutup telinga' merupakan padanan Indonesia yang jelas dan alami.
- source_word: ὥρμησαν
  choice: menyerbu
  rationale: Kata kerja ini menunjukkan gerakan mendadak dan kuat menuju seseorang. 'Menyerbu' menyampaikan gerakan bersama yang bermusuhan tanpa perlu menambahkan kata keterangan intensitas.
- source_word: ὁμοθυμαδὸν
  choice: serentak
  rationale: Adverbia ini menekankan tindakan bersama dengan dorongan atau tujuan yang sama. 'Serentak' ringkas, alami, dan lebih kuat daripada sekadar 'bersama-sama' dalam konteks penyerbuan.
- source_word: ἐπ’ αὐτόν
  choice: dia
  rationale: Dengan kata kerja gerak ὥρμησαν, ἐπί dengan akusatif menunjukkan sasaran gerakan. Dalam konstruksi Indonesia 'menyerbu dia', arah bermusuhan itu sudah tersampaikan secara idiomatis.
