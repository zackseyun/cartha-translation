base_translation:
  language: en
  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: id
  text: Bukankah tangan-Ku yang membuat semuanya ini?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih dinamis, “Bukankah Aku yang membuat semuanya ini?”
    reason: lexical_alternative
  - marker: b
    text: Kalimat ini menggemakan Yesaya 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Bukankah
  rationale: οὐχί memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” mempertahankan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: ἡ χείρ μου
  choice: tangan-Ku
  rationale: χείρ secara harfiah berarti “tangan”. Ungkapan konkret antropomorfis ini dipertahankan karena ayat tersebut menggemakan Yesaya 66:2 dan menunjuk pada tindakan Allah sendiri.
- source_word: ἐποίησεν
  choice: yang membuat
  rationale: ποιέω di sini menyatakan tindakan membuat atau menjadikan. Konstruksi “tangan-Ku yang membuat” alami dalam pertanyaan retoris bahasa Indonesia dan tetap dekat dengan susunan Yunani.
- source_word: ταῦτα πάντα
  choice: semuanya ini
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντα dan daya tunjuk ταῦτα; “semuanya ini” merupakan bentuk baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah
  choice: Mempertahankan “tangan-Ku” sebagai gambaran tindakan kreatif Allah sendiri
  alternative: Menerjemahkannya secara dinamis sebagai “Aku yang membuat semuanya ini” atau secara interpretatif sebagai “kuasa-Ku yang membuat semuanya ini”
  rationale: Mempertahankan gambaran “tangan” menghormati bentuk kutipan dari Yesaya 66:2 dan daya retoris teks tanpa mengubahnya menjadi abstraksi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Bukankah” menyampaikan pertanyaan retoris secara wajar, sedangkan “tangan-Ku” mempertahankan citra konkret dari teks sumber.
