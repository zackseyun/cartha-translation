id: ACT.7.37
reference: Acts 7:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: id
  text: Inilah Musa yang berkata kepada keturunan Israel[a], “Allah akan membangkitkan bagi kalian seorang nabi dari antara saudara-saudara kalian[b], seperti aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya umat Israel atau orang-orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini berarti sesama orang Israel; bentuk Yunani yang dipakai adalah jamak maskulin.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Inilah Musa
  rationale: Ungkapan identifikasi ini menekankan bahwa Musa yang sedang dibicarakan adalah orang yang sama; “Inilah Musa” mempertahankan tekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: ὁ εἴπας
  choice: yang berkata
  rationale: Partisip atributif paling wajar dialihkan menjadi klausa relatif.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: kepada keturunan Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada umat Israel. “Keturunan Israel” alami, inklusif secara referensial, dan tetap mempertahankan hubungan kebangsaan-keluarga.
- source_word: Προφήτην
  choice: seorang nabi
  rationale: Nomina tanpa artikel paling lugas diterjemahkan secara tak tentu; huruf kecil menghindari pemaksaan tafsir gelar mesianis ke dalam teks utama.
- source_word: ἀναστήσει
  choice: akan membangkitkan
  rationale: Mempertahankan gambaran tindakan Allah menghadirkan seorang nabi, sekaligus menjaga kaitan verbal yang mungkin terdengar dalam konteks Kisah Para Rasul.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek eksplisit dalam kutipan; “Allah” adalah padanan baku dan bermartabat dalam bahasa Indonesia.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: dari antara saudara-saudara kalian
  rationale: “Dari antara” menyatakan asal dari dalam kelompok, sedangkan “saudara-saudara” mempertahankan metafora kekerabatan yang di sini merujuk kepada sesama orang Israel.
- source_word: ὡς ἐμέ
  choice: seperti aku
  rationale: Padanan langsung dan alami bagi frasa perbandingan yang menyatakan kemiripan dengan Musa.
theological_decisions:
- issue: Makna mesianis kutipan Ulangan 18:15
  choice: seorang nabi
  alternative: Sang Nabi
  rationale: Dalam konteks Kisah Para Rasul kutipan ini diterapkan secara kristologis, tetapi Προφήτην tidak berartikel. Teks utama mempertahankan bentuk lugas tanpa menjadikan penafsiran mesianis sebagai gelar eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” dipakai karena sapaan Yunani berbentuk jamak. Susunan kutipan dibuat alami tanpa menghilangkan penekanan identifikasional pada Musa atau ambiguitas teologis pada “seorang nabi”.
