  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: id
  text: Ketika ia melihat seseorang diperlakukan tidak adil, ia membelanya dan menegakkan keadilan[a] bagi orang yang ditindas itu dengan memukul orang Mesir itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melakukan pembalasan bagi orang yang ditindas itu.” Ungkapan Yunani dapat mengandung arti membalas atau membela hak seseorang.
    reason: lexical_alternative
  - marker: b
    text: Konteks menunjukkan bahwa pukulan itu menewaskan orang Mesir itu, tetapi kata Yunaninya sendiri hanya berarti “memukul” atau “menghantam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: ketika ia melihat
  rationale: Partisip aoristis ini secara alami menyatakan keadaan waktu yang mendahului tindakan utama.
- source_word: τινα ἀδικούμενον
  choice: seseorang diperlakukan tidak adil
  rationale: Mempertahankan ketidakpastian τινα dan dimensi moral ἀδικέω tanpa menambahkan kata 'laki-laki' yang tidak dinyatakan.
- source_word: ἠμύνατο
  choice: ia membelanya
  rationale: Bentuk medium ini menyatakan tindakan datang membela atau menolong seseorang terhadap penyerangnya.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: menuntut keadilan
  rationale: Ungkapan ini dapat menunjuk pada pembalasan, pembelaan hak, atau penegakan keadilan. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi dendam pribadi.
- source_word: τῷ καταπονουμένῳ
  choice: bagi orang yang ditindas itu
  rationale: Partisip pasif menyatakan perlakuan berat atau penindasan yang sedang dialami; datifnya menunjukkan pihak yang dibela.
- source_word: πατάξας
  choice: dengan memukul
  rationale: Menerjemahkan arti dasar verba secara langsung; akibat mematikannya diketahui dari konteks tetapi tidak dinyatakan secara eksplisit oleh verba ini sendiri.
- source_word: τὸν Αἰγύπτιον
  choice: orang Mesir tersebut
  rationale: Sebutan etnis substantival ini paling wajar diterjemahkan demikian; 'tersebut' menandai pelaku tertentu dalam adegan.
theological_decisions:
- issue: Nuansa ἐκδίκησιν dalam tindakan Musa
  choice: menuntut keadilan
  alternative: membalaskan orang yang ditindas itu; melakukan pembalasan bagi orang yang ditindas itu
  rationale: Bahasa sumber memuat rentang makna keadilan, pembelaan hak, dan pembalasan. Teks utama memakai ungkapan yang wajar dan berorientasi pada keadilan, sedangkan catatan kaki mempertahankan kemungkinan nuansa pembalasan tanpa menyiratkan pembenaran doktrinal atas dendam pribadi.
- issue: Apakah πατάξας harus menyatakan kematian
  choice: dengan memukul
  alternative: dengan membunuh; dengan memukul mati
  rationale: πατάσσω berarti memukul atau menghantam. Konteks yang lebih luas menunjukkan akibat fatal, tetapi terjemahan utama tidak memasukkan akibat itu ke dalam arti leksikal verba.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. Penanda catatan ditempatkan setelah klausa yang relevan: [a] menjelaskan nuansa keadilan/pembalasan, sedangkan [b] menjelaskan cakupan arti verba ''memukul''.'
