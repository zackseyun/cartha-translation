revisions:
- from: Ketika ia melihat seseorang diperlakukan tidak adil, ia membelanya dan menuntut keadilan bagi orang yang ditindas itu dengan memukul orang Mesir tersebut.[a][b]
  to: Ketika ia melihat seseorang diperlakukan tidak adil, ia membelanya dan menegakkan keadilan[a] bagi orang yang ditindas itu dengan memukul orang Mesir itu.[b]
  rationale: Revisi mengganti “menuntut keadilan” dengan “menegakkan keadilan” agar tindakan Musa, bukan sekadar tuntutan kepada pihak lain, tersampaikan dengan lebih setia. Nuansa alternatif pembalasan tetap dipelihara dalam catatan kaki, dan arti dasar πατάξας tetap diterjemahkan “memukul.”
