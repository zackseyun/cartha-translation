id: ACT.7.27
reference: Acts 7:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: id
  text: Namun, orang yang berbuat tidak adil terhadap sesamanya itu mendorong Musa menjauh[a] sambil berkata, “Siapa yang mengangkatmu menjadi pemimpin dan hakim atas kami?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menolaknya dengan keras.” Kata kerja Yunani ini dapat menekankan tindakan fisik yang kuat atau penolakan yang meremehkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: berbuat tidak adil terhadap
  rationale: Partisipel kini menyatakan tindakan yang sedang berlangsung; ungkapan ini mempertahankan unsur ketidakadilan yang menjadi inti ἀδικέω.
- source_word: πλησίον
  choice: sesamanya
  rationale: Dalam konteks ini kata tersebut menunjuk kepada orang lain yang dekat, yakni sesama orang Israel; “sesamanya” alami dalam bahasa Indonesia tanpa mempersempit maknanya secara berlebihan.
- source_word: ἀπώσατο
  choice: mendorong Musa menjauh
  rationale: Verba aoris bentuk medium ini menggambarkan penolakan yang konkret dan kuat. Penyebutan “Musa” memperjelas acuan pronomina Yunani tanpa mengubah tokoh yang dimaksud.
- source_word: κατέστησεν
  choice: mengangkat
  rationale: Dalam konstruksi dengan jabatan, “mengangkat” secara alami menyampaikan tindakan menetapkan seseorang pada kedudukan berwenang.
- source_word: ἄρχοντα
  choice: pemimpin
  rationale: “Pemimpin” menyampaikan kedudukan berwenang dengan bahasa Indonesia modern dan wajar, tanpa harus menyiratkan gelar kerajaan.
- source_word: δικαστὴν
  choice: hakim
  rationale: Padanan langsung yang mempertahankan fungsi mengadili dalam pasangan “pemimpin dan hakim”.
- source_word: ἐφ’ ἡμῶν
  choice: atas kami
  rationale: Preposisi ἐπί dengan genitif di sini menyatakan kewenangan atas suatu kelompok; “atas kami” mempertahankan nada penolakan terhadap wewenang Musa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Namun” menandai pertentangan, sedangkan bentuk terikat “mengangkatmu” menjaga kelancaran ucapan langsung. Nama “Musa” dipakai sebagai pengganti pronomina agar rujukannya jelas dalam ayat yang berdiri sendiri.
