id: ACT.7.45
reference: Acts 7:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: id
  text: Nenek moyang kita juga membawanya masuk bersama Yosua[b], setelah menerimanya secara turun-temurun,[a] ketika mereka mengambil alih negeri bangsa-bangsa yang Allah halau dari hadapan nenek moyang kita, sampai zaman Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setelah menerimanya secara berurutan, nenek moyang kita membawanya masuk.”'
    reason: διαδεξάμενοι menekankan penerimaan dalam urutan atau suksesi antargenerasi.
  - marker: b
    text: Dalam bahasa Yunani, nama ini berbentuk sama dengan nama yang diterjemahkan “Yesus”; di sini yang dimaksud ialah Yosua anak Nun.
    reason: Nama Yunani Ἰησοῦς dapat merujuk kepada Yesus maupun Yosua; konteks menunjukkan Yosua anak Nun.
lexical_decisions:
- source_word: ἣν
  choice: Kemah itu
  rationale: Pronomina relatif feminin tunggal ini merujuk kepada kemah kesaksian pada ayat sebelumnya. Pengulangan nomina memperjelas rujukannya dalam bahasa Indonesia.
- source_word: εἰσήγαγον
  choice: dibawa masuk
  rationale: Menyampaikan makna membawa sesuatu masuk; bentuk pasif menghasilkan susunan Indonesia yang lebih alami tanpa mengubah pelakunya, yaitu nenek moyang kita.
- source_word: διαδεξάμενοι
  choice: yang menerimanya secara turun-temurun
  rationale: Partisip ini menyatakan penerimaan secara berurutan dari generasi terdahulu; terjemahan ini mempertahankan unsur penerimaan dan kesinambungan antargenerasi.
- source_word: οἱ πατέρες ἡμῶν
  choice: nenek moyang kita
  rationale: Dalam bahasa Indonesia modern, ungkapan ini secara alami menunjuk para leluhur Israel dan tetap mempertahankan bingkai sejarah umat dalam pidato Stefanus.
- source_word: μετὰ Ἰησοῦ
  choice: bersama Yosua
  rationale: Bentuk Yunani Ἰησοῦ dapat mewakili nama Yesus atau Yosua, tetapi konteks masuknya Israel ke negeri itu menunjuk kepada Yosua anak Nun.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: ketika mereka mengambil alih negeri bangsa-bangsa
  rationale: κατάσχεσις menyatakan tindakan mengambil atau menduduki milik; penambahan 'negeri' membuat objek pengambilalihan jelas tanpa menjadikan bangsa-bangsa sebagai sesuatu yang dimiliki.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: yang dihalau Allah
  rationale: ἐξωθέω berarti mendorong keluar, mengusir, atau menghalau. 'Dihalau' jelas dan sesuai dengan konteks bangsa-bangsa yang disingkirkan dari negeri itu.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: dari hadapan nenek moyang kita
  rationale: Mempertahankan ungkapan bercorak Semitis tentang penyingkiran dari hadapan atau kehadiran seseorang dalam bentuk Indonesia yang dapat dipahami.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: sampai pada zaman Daud
  rationale: Ungkapan waktu ini diterjemahkan secara alami dan menjaga kaitannya dengan ayat berikutnya.
theological_decisions:
- issue: Rujukan Ἰησοῦ
  choice: Yosua
  alternative: Yesus
  rationale: Nama Yunani yang sama dapat merujuk kepada Yesus atau Yosua. Konteks sejarah sesudah Musa, ketika Israel memasuki negeri itu, menentukan bahwa tokohnya ialah Yosua anak Nun; catatan kaki mempertahankan transparansi bentuk nama sumber.
- issue: Daya makna διαδεξάμενοι
  choice: Nenek moyang menerima kemah itu secara turun-temurun lalu membawanya masuk
  alternative: Nenek moyang pada giliran mereka membawanya masuk
  rationale: Partisip tersebut memuat gagasan penerimaan dalam rangkaian suksesi. Terjemahan utama menyatakan unsur itu secara eksplisit tanpa menentukan lebih jauh mekanisme pewarisannya.
- issue: Cakupan ἕως τῶν ἡμερῶν Δαυίδ
  choice: Kemah itu tetap di sana sampai zaman Daud
  alternative: Rangkaian tindakan sebelumnya berlangsung sampai zaman Daud
  rationale: Teks Yunani ringkas dan tidak mengulang verba. Kalimat Indonesia memasok gagasan keberadaan kemah sebagai hubungan kontekstual yang paling wajar dengan ayat berikutnya, sambil menghindari kesan bahwa penaklukan berlangsung terus sampai Daud.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Nenek moyang' dipilih daripada 'bapa-bapa' karena lebih alami bagi pembaca umum. Ayat dipecah menjadi dua kalimat untuk menghindari struktur panjang yang janggal, dan semua penanda catatan kaki ditempatkan langsung dalam teks utama.
