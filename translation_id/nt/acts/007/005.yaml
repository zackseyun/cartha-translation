id: ACT.7.5
reference: Acts 7:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: id
  text: Ia tidak memberikan kepadanya warisan di tanah itu, bahkan tidak sebidang tanah pun, sekalipun hanya seluas telapak kaki. Namun, Ia berjanji untuk memberikan tanah itu kepadanya sebagai milik dan kepada keturunannya sesudah dia, meskipun ia belum mempunyai anak[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia tidak memberikan kepadanya warisan di dalamnya.” Dalam konteks ini, maksudnya ialah tidak ada bagian dari tanah itu yang diberikan kepadanya sebagai warisan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani ini juga dapat diterjemahkan, “ketika ia belum mempunyai anak.”
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: sebagai warisan
  rationale: Mempertahankan nuansa perjanjian dan hukum dari bagian tanah yang diterima sebagai hak waris, bukan sekadar milik umum.
- source_word: οὐδὲ βῆμα ποδός
  choice: bahkan tidak selebar telapak kaki
  rationale: Ungkapan idiomatis ini menunjuk pada bidang tanah sekecil mungkin; terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tubuh dalam teks Yunani.
- source_word: ἐπηγγείλατο
  choice: berjanji
  rationale: Padanan langsung dan alami yang menyampaikan komitmen ilahi tanpa penambahan makna.
- source_word: εἰς κατάσχεσιν
  choice: sebagai milik
  rationale: Menyampaikan bahwa tanah itu dijanjikan untuk menjadi milik tetap Abraham.
- source_word: σπέρματι
  choice: keturunannya
  rationale: Dalam konteks ini bentuk tunggal kolektif Yunani merujuk kepada garis keturunan Abraham; 'keturunan' alami dan tidak mempersempit rujukannya.
- source_word: μετ’ αὐτόν
  choice: sesudah dia
  rationale: Menyatakan urutan generasi secara langsung sambil mempertahankan pronomina sumber.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: meskipun pada waktu itu ia belum mempunyai anak
  rationale: Memunculkan nuansa konsesif yang kuat dalam konteks, sedangkan 'pada waktu itu' menjelaskan keadaan yang menyertai janji tanpa menyiratkan bahwa Abraham tidak pernah akan mempunyai anak.
- source_word: τέκνου
  choice: anak
  rationale: τέκνον tidak terbatas pada anak laki-laki; 'anak' merupakan padanan yang paling tepat dan luas.
theological_decisions:
- issue: Nuansa keadaan Abraham yang belum mempunyai anak ketika janji diberikan
  choice: meskipun pada waktu itu ia belum mempunyai anak
  alternative: ketika ia belum mempunyai anak
  rationale: 'Genitif absolut dapat dipahami secara temporal, tetapi konteks menonjolkan kontras: Allah menjanjikan tanah kepada keturunan Abraham sementara Abraham sendiri belum mempunyai anak. Catatan kaki mempertahankan kemungkinan temporal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Acuan pronomina dipertahankan sedekat mungkin dengan teks, dengan huruf kapital pada 'Ia' untuk memperjelas bahwa pelakunya adalah Allah. Susunan kalimat dipecah agar mudah dibaca tanpa menghilangkan hubungan kontras.
