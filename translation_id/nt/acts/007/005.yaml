revisions:
- from: Ia tidak memberikan kepadanya sedikit pun tanah itu sebagai warisan[a], bahkan tidak selebar telapak kaki. Namun, Ia berjanji akan memberikan tanah itu kepadanya sebagai milik, juga kepada keturunannya sesudah dia, meskipun pada waktu itu ia belum mempunyai anak.[b]
  to: Ia tidak memberikan kepadanya warisan di tanah itu, bahkan tidak sebidang tanah pun, sekalipun hanya seluas telapak kaki. Namun, Ia berjanji untuk memberikan tanah itu kepadanya sebagai milik dan kepada keturunannya sesudah dia, meskipun ia belum mempunyai anak[b].[a]
  rationale: Pembukaan direvisi agar κληρονομίαν tetap menjadi ‘warisan’ yang tidak diberikan, dengan ἐν αὐτῇ diterjemahkan ‘di tanah itu’. Ungkapan ukuran tanah diperjelas sebagai ‘sebidang tanah ... seluas telapak kaki’. Catatan kaki b dipindahkan ke klausa yang dijelaskannya. Catatan kaki a perlu ditempatkan pada “tanah itu” dalam tata letak final, bukan setelah titik; teks polos di atas menampilkan marker [a] di akhir hanya karena format keluaran tidak mendukung jangkar internal secara andal.
