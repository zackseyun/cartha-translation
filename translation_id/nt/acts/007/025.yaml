id: ACT.7.25
reference: Acts 7:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: id
  text: Ia menyangka bahwa saudara-saudara sebangsanya[b] mengerti bahwa Allah sedang memberi mereka pembebasan[a] melalui tangannya, tetapi mereka tidak mengerti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keselamatan.” Istilah Yunani ini dapat berarti penyelamatan, pembebasan, atau keselamatan; dalam konteks langsung ini, yang dimaksud ialah pembebasan Israel oleh Allah melalui Musa.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara sebangsanya” merujuk kepada sesama orang Israel; bahasa Yunani memakai istilah kekerabatan maskulin jamak.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: menyangka
  rationale: Bentuk imperfek memberi latar berupa anggapan Musa; dalam bahasa Indonesia, bentuk lampau tidak perlu ditandai secara gramatikal, dan “menyangka” menyampaikan dugaan yang ternyata keliru secara alami.
- source_word: συνιέναι / συνῆκαν
  choice: mengerti / tidak mengerti
  rationale: Pengulangan kata yang sama mempertahankan kontras dan permainan verbal dalam bahasa Yunani.
- source_word: ἀδελφοὺς
  choice: saudara-saudara sebangsanya
  rationale: Ungkapan ini mempertahankan bahasa kekerabatan maskulin jamak sekaligus memperjelas bahwa yang dimaksud ialah sesama orang Israel, bukan saudara kandung Musa.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: melalui tangannya
  rationale: Mempertahankan gambaran harfiah tentang tangan sebagai sarana atau perantaraan, yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: δίδωσιν
  choice: sedang memberi
  rationale: Bentuk kini dalam wacana tak langsung dipahami dalam bingkai narasi lampau; “sedang” menyampaikan tindakan Allah yang dipandang sedang berlangsung pada saat itu.
- source_word: σωτηρίαν
  choice: pembebasan
  rationale: Dalam konteks penindasan Israel di Mesir, kata ini terutama menunjuk pada tindakan penyelamatan atau pembebasan konkret, sambil tetap membuka gema makna keselamatan yang lebih luas.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Menyatakan penerima pembebasan secara alami dalam konstruksi Indonesia “memberi mereka pembebasan”.
theological_decisions:
- issue: Makna σωτηρία dalam konteks Musa
  choice: pembebasan
  alternative: keselamatan
  rationale: “Pembebasan” paling langsung sesuai dengan konteks historis penyelamatan Israel dari penindasan melalui Musa. Catatan kaki mempertahankan kemungkinan terjemahan “keselamatan” tanpa mempersempit atau meniadakan gema teologis istilah Yunani itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat mempertahankan kontras antara anggapan Musa dan ketidakmengertian bangsa Israel, serta mempertahankan citra sumber “melalui tangannya.”
