  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: id
  text: Lalu Tuhan berkata kepadanya, “Tanggalkan[a] sandal dari kakimu, sebab tempat engkau berdiri itu adalah tanah yang kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Lepaskan sandal dari kakimu.”
    reason: alternatif_leksikal; Λῦσον secara dasar berarti melepaskan atau menguraikan, sedangkan “tanggalkan” menyampaikan maknanya secara idiomatis dalam konteks alas kaki.
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan hormat bagi κύριος dalam konteks firman ilahi, tanpa menggantikannya dengan bentuk khusus yang secara eksplisit mewakili Tetragramaton.
- source_word: Λῦσον
  choice: Tanggalkan
  rationale: Secara harfiah berarti 'lepaskan/uraikan', tetapi dalam konteks alas kaki perintah ini secara idiomatis berarti menanggalkannya.
- source_word: τὸ ὑπόδημα
  choice: alas kaki
  rationale: Nomina kolektif bahasa Indonesia ini wajar untuk bentuk tunggal Yunani dan tidak memaksakan jumlah benda yang dipakai; juga lebih umum daripada 'sandal'.
- source_word: τῶν ποδῶν σου
  choice: dari kakimu
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal generik 'kaki' setelah enklitik kepunyaan, meskipun Yunani memakai bentuk jamak.
- source_word: ὁ γὰρ τόπος
  choice: sebab tempat
  rationale: γάρ bersifat menjelaskan alasan perintah, sedangkan τόπος secara langsung berarti 'tempat'.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: engkau berdiri
  rationale: Bentuk perfek ἕστηκας menyatakan keadaan kini; ungkapan Indonesia ini alami dan mempertahankan hubungan tempat melalui konstruksi 'tempat ... itu'.
- source_word: γῆ ἁγία
  choice: tanah yang kudus
  rationale: Dalam lokasi setempat ini γῆ berarti tanah; konstruksi relatif menghasilkan bahasa Indonesia yang alami dan tetap mempertahankan predikasi kekudusannya.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan penampakan ilahi dari Keluaran
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani berbunyi κύριος dan tidak menuliskan Tetragramaton. 'Tuhan' menjaga penghormatan serta kesinambungan pemakaian Alkitab tanpa memasukkan konvensi tipografis PL yang tidak terdapat dalam teks Yunani ayat ini.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang lugas dan khidmat. 'Engkau' dipakai dalam ujaran ilahi agar sesuai dengan register Alkitab yang bermartabat; 'alas kaki' mempertahankan ambiguitas jumlah secara alami.
