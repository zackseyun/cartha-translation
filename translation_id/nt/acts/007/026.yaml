  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: id
  text: Keesokan harinya, Musa menampakkan diri kepada mereka ketika mereka sedang berkelahi dan berusaha mendamaikan mereka[a]. Katanya, “Saudara-saudara, kalian ini bersaudara. Mengapa kalian saling berbuat salah?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang mendamaikan mereka.” Bentuk kata Yunani dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam konteks ini kemungkinan besar menyatakan upaya Musa untuk mendamaikan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami menyatakan hari berikutnya dalam urutan narasi.
- source_word: ὤφθη αὐτοῖς
  choice: Musa datang kepada mereka
  rationale: Bentuk pasif ὤφθη berfungsi secara intransitif dengan arti ‘menampakkan diri’ atau ‘muncul’. Dalam narasi Indonesia, ‘datang kepada mereka’ menyampaikan kemunculan Musa secara wajar; nama Musa dipakai untuk menghindari pronomina yang kurang jelas.
- source_word: αὐτοῖς μαχομένοις
  choice: ketika mereka sedang berkelahi
  rationale: Partisipel kini menunjukkan tindakan yang sedang berlangsung saat Musa datang.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: berusaha mendamaikan mereka
  rationale: 'Bentuk imperfek dalam konteks ini paling mungkin bersifat konatif: Musa berupaya membawa kedua orang itu kepada keadaan damai, tetapi upayanya ditolak sebagaimana tampak pada ayat berikutnya.'
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: Saudara-saudara, kalian ini bersaudara
  rationale: Ἄνδρες berfungsi sebagai sapaan kepada kedua laki-laki itu, sedangkan ἀδελφοί ἐστε menegaskan ikatan persaudaraan mereka. Pembedaan antara sapaan ‘Saudara-saudara’ dan pernyataan ‘kalian ini bersaudara’ mempertahankan keduanya tanpa kekakuan ‘Hai laki-laki’.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: Mengapa kalian saling berbuat salah?
  rationale: ἀδικέω berarti memperlakukan dengan tidak benar atau berbuat salah terhadap orang lain. ‘Saling berbuat salah’ mempertahankan unsur timbal balik ἀλλήλους dan terdengar alami.
theological_decisions:
- issue: Hubungan persaudaraan dalam ἀδελφοί ἐστε
  choice: kalian ini bersaudara
  alternative: kalian adalah saudara sebangsa
  rationale: Teks menyatakan bahwa mereka adalah ‘saudara-saudara’ tanpa secara eksplisit menentukan apakah tekanannya pada kekerabatan etnis atau ikatan lain. Terjemahan utama mempertahankan keluasan ungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. ‘Kalian’ dipakai karena Musa berbicara langsung kepada dua orang. Sapaan ‘Saudara-saudara’ bermartabat dan alami, sedangkan partikel ‘ini’ memberi tekanan pada kenyataan bahwa mereka bersaudara.
