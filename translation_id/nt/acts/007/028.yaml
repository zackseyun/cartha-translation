  text: Apakah kamu mau membunuhku seperti kamu membunuh orang Mesir itu kemarin?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: membunuh / membunuh
  rationale: Dalam konteks ini, verba ἀναιρέω berarti menghabisi nyawa; pengulangan kata yang sama mempertahankan hubungan langsung antara ancaman terhadap pembicara dan pembunuhan orang Mesir.
- source_word: ὃν τρόπον
  choice: seperti
  rationale: Ungkapan ini menyatakan kesamaan cara atau pola tindakan; 'seperti' alami dalam bahasa Indonesia dan tidak menambah rincian yang tidak ada dalam teks.
- source_word: τὸν Αἰγύπτιον
  choice: orang Mesir itu
  rationale: Artikel tertentu menunjuk kepada orang Mesir yang telah diketahui dari konteks sebelumnya; 'itu' menyampaikan sifat definit tersebut.
- source_word: ἐχθές
  choice: kemarin
  rationale: Padanan waktu langsung dan alami.
