  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: id
  text: Ketika ia hampir berusia empat puluh tahun[a], timbullah dalam hatinya keinginan[b] untuk mengunjungi saudara-saudaranya, yaitu keturunan Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika usianya genap empat puluh tahun.” Ungkapan Yunani menggambarkan masa empat puluh tahun yang sedang mencapai kepenuhannya.
    reason: lexical_alternative
  - marker: b
    text: Secara idiomatis, “muncullah dalam hatinya”; maksudnya, ia berniat atau memutuskan.
    reason: idiom_note
  - marker: c
    text: Secara lebih harfiah, “anak-anak Israel”; maksudnya, sesama orang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ketika
  rationale: Mengawali peralihan waktu dalam kisah. Dalam bahasa Indonesia, “ketika” menyampaikan fungsi temporalnya secara alami; daya penghubung δὲ cukup dipahami dari alur konteks tanpa harus diterjemahkan secara kaku sebagai “dan” atau “tetapi”.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: usianya hampir genap empat puluh tahun
  rationale: Ungkapan Yunani secara harfiah menggambarkan masa empat puluh tahun yang sedang digenapi baginya. “Hampir genap” mempertahankan aspek proses dari bentuk imperfek sambil terdengar wajar dalam bahasa Indonesia; kemungkinan makna “genap empat puluh tahun” dicatat dalam catatan kaki.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: timbullah dalam hatinya keinginan
  rationale: Ungkapan idiomatis ini menyatakan munculnya niat atau tekad batin. Pilihan ini mempertahankan gambaran tentang hati tanpa memakai terjemahan harfiah yang janggal, “naik ke atas hatinya”.
- source_word: ἐπισκέψασθαι
  choice: mengunjungi
  rationale: Dalam konteks ini Musa hendak mendatangi bangsanya dan melihat keadaan mereka. “Mengunjungi” merupakan padanan ringkas dan alami, meskipun kata Yunani juga dapat menyiratkan perhatian terhadap keadaan orang yang dikunjungi.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: saudara-saudaranya
  rationale: Mempertahankan bahasa kekerabatan dalam teks Yunani. Frasa penjelas sesudahnya menunjukkan bahwa yang dimaksud ialah orang-orang sebangsanya, bukan hanya saudara kandung.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: keturunan Israel
  rationale: Frasa ini menjelaskan identitas “saudara-saudaranya.” “Keturunan Israel” mempertahankan hubungan genealogis ungkapan Yunani dengan bahasa Indonesia yang lebih alami daripada “anak-anak laki-laki Israel”; bentuk tradisional “anak-anak Israel” dicatat sebagai alternatif.
theological_decisions:
- issue: Bahasa kekerabatan dan sebutan etnis yang berjenis kelamin gramatikal
  choice: saudara-saudaranya, yaitu keturunan Israel
  alternative: sesama orang Israel; saudara-saudaranya, yaitu anak-anak Israel
  rationale: Teks menyebut sesama anggota bangsa Musa dengan bahasa kekeluargaan dan kemudian mengidentifikasi mereka secara etnis. Terjemahan mempertahankan kedua unsur itu tanpa membatasi rujukannya hanya kepada saudara kandung atau hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Ungkapan hati dipertahankan dalam bentuk idiomatis yang mudah dipahami, sedangkan istilah kekerabatan dan identitas Israel tetap terlihat tanpa menghasilkan konstruksi yang kaku.
