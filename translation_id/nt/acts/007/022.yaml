id: ACT.7.22
reference: Acts 7:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: id
  text: Musa dididik dalam segala hikmat orang Mesir, dan ia berkuasa dalam perkataan dan perbuatannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam ucapan dan tindakannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: dididik
  rationale: Bentuk pasif ini menunjukkan bahwa Musa menerima pendidikan atau pembinaan; “dididik” alami dalam bahasa Indonesia dan sesuai dengan konteks pengetahuan Mesir.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: dalam segala hikmat orang Mesir
  rationale: “Dalam” menyatakan bidang atau isi pendidikan, “segala” mempertahankan keluasan πάσῃ, dan “hikmat orang Mesir” mempertahankan konstruksi sumber/kepunyaan tanpa mempersempitnya menjadi sekadar ilmu.
- source_word: δυνατὸς
  choice: berkuasa
  rationale: “Berkuasa” mempertahankan nuansa kekuatan atau kemampuan yang menonjol dan cocok dengan pasangan perkataan serta perbuatan.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: dalam perkataan dan perbuatannya
  rationale: Ungkapan ini dekat dengan susunan Yunani sekaligus wajar dan berimbang dalam bahasa Indonesia; alternatif yang lebih dinamis dicatat dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -nya pada “perbuatannya”
  rationale: Pronomina αὐτοῦ secara makna mencakup kedua unsur yang dikoordinasikan; dalam bahasa Indonesia, akhiran pada unsur terakhir dapat berlaku bagi seluruh pasangan tanpa pengulangan yang kaku.
theological_decisions:
- issue: Cakupan kemampuan Musa dalam λόγοις
  choice: Diterjemahkan “berkuasa dalam perkataan dan perbuatannya” tanpa diselaraskan dengan Keluaran 4:10.
  alternative: Menafsirkan λόγοις hanya sebagai pengaruh, reputasi, atau kemampuan selain kefasihan berbicara.
  rationale: Pernyataan Stefanus dipertahankan menurut bentuknya sendiri. Ketegangan dengan pengakuan Musa dalam Keluaran 4:10 tidak diselesaikan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hikmat” mempertahankan bobot σοφία dalam konteks Alkitab, sedangkan struktur kalimat tetap ringkas dan mudah dipahami.
source_grounding:
  english_pob_role: consult_only
