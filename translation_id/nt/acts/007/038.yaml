id: ACT.7.38
reference: Acts 7:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: id
  text: Dialah yang berada dalam perhimpunan umat[a] di padang belantara, bersama malaikat yang berbicara kepadanya di Gunung Sinai dan bersama para leluhur kita[b]. Ia menerima firman-firman ilahi yang hidup[c] untuk disampaikan kepada kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jemaat” atau “perhimpunan”; secara tradisional, “jemaat di padang belantara.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “bapak-bapak kita”; yang dimaksud ialah para leluhur bangsa Israel.
    reason: lexical_alternative
  - marker: c
    text: Atau “perkataan-perkataan ilahi yang hidup” atau “firman-firman ilahi yang memberi hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γενόμενος
  choice: yang berada
  rationale: Ungkapan partisipial ini secara idiomatis menunjukkan bahwa Musa hadir dalam keadaan dan lingkungan tersebut. 'Yang berada' alami dalam bahasa Indonesia dan tidak menambahkan gagasan yang tidak dinyatakan.
- source_word: ἐκκλησίᾳ
  choice: umat yang berkumpul
  rationale: Pilihan ini menyampaikan arti dasar sekelompok orang yang berhimpun, yaitu Israel di padang belantara, tanpa memasukkan pengertian kelembagaan gereja yang berkembang kemudian.
- source_word: ἐρήμῳ
  choice: padang belantara
  rationale: Istilah ini sesuai dengan latar pengembaraan Israel dan lebih luas daripada 'gurun', yang dapat menyiratkan wilayah pasir yang tandus.
- source_word: ἀγγέλου
  choice: malaikat
  rationale: Dalam konteks Sinai dan pidato Stefanus, yang dimaksud ialah makhluk surgawi, bukan utusan manusia.
- source_word: λαλοῦντος
  choice: yang berbicara
  rationale: Klausa relatif ini menghasilkan bahasa Indonesia yang alami serta mempertahankan gambaran tindakan berbicara yang sedang berlangsung dalam adegan tersebut.
- source_word: ὄρει Σινᾶ
  choice: Gunung Sinai
  rationale: Ini adalah bentuk baku dan alami bagi nama tempat tersebut dalam bahasa Indonesia.
- source_word: πατέρων ἡμῶν
  choice: para leluhur kita
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk kepada para pendahulu bangsa Israel. 'Para leluhur kita' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: ἐδέξατο
  choice: menerima
  rationale: '''Menerima'' secara langsung menggambarkan Musa sebagai penerima penyataan ilahi.'
- source_word: λόγια
  choice: firman-firman ilahi
  rationale: λόγια menunjuk pada perkataan atau pernyataan yang berasal dari Allah, bukan perkataan biasa. 'Firman-firman ilahi' mempertahankan sifat sakral dan revelatorisnya tanpa memakai kata 'orakel', yang dalam bahasa Indonesia modern mudah disalahpahami.
- source_word: ζῶντα
  choice: yang hidup
  rationale: Terjemahan langsung ini mempertahankan ungkapan teologis yang padat dan tidak mempersempitnya menjadi hanya 'yang memberi hidup'.
- source_word: δοῦναι
  choice: untuk disampaikan
  rationale: Dalam konteks Musa menerima penyataan untuk diberikan kepada umat, 'disampaikan' merupakan padanan Indonesia yang alami bagi tindakan meneruskan firman tersebut, meskipun secara harfiah berarti 'untuk memberikan'.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Pilihan ini mempertahankan identifikasi Stefanus dan para pendengarnya dengan sejarah perjanjian Israel.
theological_decisions:
- issue: Apakah ἐκκλησίᾳ harus diterjemahkan sebagai 'gereja' ketika merujuk kepada Israel di padang belantara
  choice: umat yang berkumpul
  alternative: jemaat; perhimpunan; gereja
  rationale: Ayat ini berbicara tentang Israel yang berkumpul di padang belantara. Terjemahan utama mempertahankan gagasan berkumpul tanpa menetapkan bahwa kelompok tersebut adalah gereja dalam pengertian kelembagaan kemudian.
- issue: Apakah λόγια ζῶντα harus ditafsirkan sebagai firman yang memberi hidup
  choice: firman-firman ilahi yang hidup
  alternative: firman-firman yang memberi hidup; perkataan-perkataan ilahi yang hidup
  rationale: Bahasa Yunani menyebut firman-firman itu 'hidup'. Terjemahan utama mempertahankan ketegangan dan kekayaan ungkapan tersebut tanpa membatasi maknanya pada efek memberi kehidupan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rangkaian relasi Musa dengan malaikat dan para leluhur, sedangkan istilah untuk ἐκκλησία dan λόγια dipilih agar jelas bagi pembaca umum tanpa menghilangkan nuansa historis atau teologis.
