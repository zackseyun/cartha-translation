id: ACT.7.49
reference: Acts 7:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: id
  text: Langit adalah takhta-Ku, dan bumi adalah tumpuan kaki-Ku. Rumah seperti apakah yang akan kalian bangun bagi-Ku, firman Tuhan, atau tempat apakah yang menjadi perhentian-Ku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οὐρανός
  choice: Langit
  rationale: Dalam pasangan kosmis dengan bumi, kata ini menunjuk pada langit sebagai ranah takhta Allah; bahasa Indonesia lazim memakai “langit” tanpa harus menambahkan penjelasan.
- source_word: θρόνος
  choice: takhta
  rationale: Padanan baku yang mempertahankan gambaran pemerintahan dan kebesaran kerajaan.
- source_word: ἡ γῆ
  choice: bumi
  rationale: Cakupannya kosmis karena dikontraskan dengan langit, bukan sekadar tanah atau suatu negeri.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: tumpuan kaki-Ku
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan citra harfiah tumpuan bagi kaki Allah.
- source_word: ποῖον οἶκον
  choice: Rumah macam apa
  rationale: ποῖον menanyakan macam atau kualitas secara retoris, sedangkan οἶκον dipertahankan sebagai “rumah” dan tidak dipersempit menjadi “Bait Allah”.
- source_word: οἰκοδομήσετέ μοι
  choice: akan kalian bangun untuk-Ku
  rationale: Bentuk verba adalah orang kedua jamak futur; “kalian” menyatakan penerima jamak dan “akan ... bangun” mempertahankan bentuk pertanyaan tentang tindakan mendatang.
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Formula ujaran ilahi ini secara wajar dan bermartabat dinyatakan “firman Tuhan” dalam bahasa Indonesia, tanpa mengubah κύριος menjadi nama ilahi Ibrani.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: tempat perhentian-Ku
  rationale: Mempertahankan konstruksi “tempat” dan “perhentian” serta resonansi teologis tentang perhentian Allah tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: κύριος dalam kutipan Yesaya yang menampilkan Allah Israel sebagai pembicara
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Perjanjian Baru memakai κύριος. “Tuhan” menerjemahkan bentuk sumber secara langsung, sedangkan “TUHAN” akan memasukkan konvensi untuk nama ilahi Ibrani yang tidak tertulis dalam teks Yunani ini.
- issue: Makna οἶκος dalam konteks kecaman terhadap rumah buatan manusia
  choice: rumah
  alternative: Bait Allah
  rationale: Walaupun konteksnya berkaitan dengan Bait Allah, teks menyatakan “rumah”. Pilihan ini membiarkan hubungan dengan Bait Allah muncul dari konteks dan mempertahankan keluasan pertanyaan retoris.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kalian” dipakai untuk memperlihatkan bentuk orang kedua jamak dalam bahasa Yunani; kapitalisasi pada akhiran “-Ku” mengikuti konvensi Indonesia ketika merujuk kepada Allah. Paralelisme dan pertanyaan retoris sumber dipertahankan.
