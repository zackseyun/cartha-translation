  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: id
  text: Kelaparan melanda seluruh Mesir dan Kanaan, dan terjadi kesusahan besar; nenek moyang kita tidak dapat memperoleh makanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapak kita,” yaitu para leluhur Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: Lalu terjadilah
  rationale: δέ mengembangkan alur narasi, sedangkan ἦλθεν dipakai secara idiomatis untuk datang atau terjadinya kelaparan. Gabungan ini wajar dalam narasi Indonesia tanpa menambahkan penanda waktu yang tidak ada.
- source_word: λιμὸς
  choice: kelaparan
  rationale: Dalam konteks ini menunjuk pada bencana kekurangan pangan yang meluas, bukan sekadar rasa lapar pribadi.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: di seluruh Mesir dan Kanaan
  rationale: ἐπί dengan akusatif menyatakan cakupan wilayah; ungkapan ini alami dan mempertahankan luas geografisnya.
- source_word: θλῖψις μεγάλη
  choice: kesusahan besar
  rationale: Menunjuk pada penderitaan berat akibat krisis tersebut, tanpa memberi nuansa eskatologis yang tidak dituntut konteks.
- source_word: οὐχ ηὕρισκον
  choice: tidak dapat memperoleh
  rationale: Bentuk imperfek menyiratkan keadaan yang berlangsung; dalam konteks persediaan pangan, 'memperoleh' lebih alami daripada 'menemukan' secara harfiah.
- source_word: χορτάσματα
  choice: makanan
  rationale: Kata ini menunjuk pada bahan makanan atau perbekalan pangan secara umum; 'makanan' jelas dan tidak terlalu menyempitkan makna.
- source_word: οἱ πατέρες ἡμῶν
  choice: nenek moyang kita
  rationale: Ungkapan ini merujuk kepada para leluhur Israel. Dalam bahasa Indonesia, 'nenek moyang' adalah padanan idiomatis yang tidak menentukan jenis kelamin, sehingga catatan menjelaskan bentuk harfiah Yunaninya.
theological_decisions:
- issue: Bahasa leluhur yang bergender
  choice: nenek moyang kita
  alternative: bapak-bapak kita
  rationale: Bahasa Yunani secara harfiah berbunyi 'bapak-bapak kita', tetapi dalam konteks ini bermakna leluhur Israel. 'Nenek moyang kita' menyampaikan rujukan historisnya secara alami, sementara bentuk maskulin sumber dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat diperjelas secara alami dengan 'sehingga' tanpa mengubah hubungan kontekstual antara kelaparan, kesusahan, dan ketiadaan makanan.
