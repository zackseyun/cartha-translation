id: ACT.7.30
reference: Acts 7:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: id
  text: Setelah genap empat puluh tahun[a], seorang malaikat[c] menampakkan diri kepadanya di padang belantara Gunung Sinai, dalam nyala api dari semak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika empat puluh tahun telah berlalu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam nyala api semak.” Frasa Yunani secara padat menghubungkan nyala api itu dengan semak, menggemakan Keluaran 3:2.
    reason: cross_reference
  - marker: c
    text: Sebagian penafsir menghubungkan sosok ini dengan “Malaikat TUHAN” dalam Keluaran 3:2, tetapi Kisah Para Rasul di sini hanya mengatakan “seorang malaikat”.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: setelah genap empat puluh tahun
  rationale: Ungkapan ini mempertahankan gagasan bahwa masa empat puluh tahun telah mencapai kepenuhannya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὤφθη αὐτῷ
  choice: menampakkan diri kepadanya
  rationale: Bentuk pasif ὤφθη lazim menyatakan suatu penampakan; padanan ini lebih alami daripada 'terlihat olehnya' dan mempertahankan arah relasional datif αὐτῷ.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: di padang belantara dekat Gunung Sinai
  rationale: ἔρημος diterjemahkan 'padang belantara' untuk latar geografis Keluaran. Genitif τοῦ ὄρους Σινᾶ dipahami sebagai penentu wilayah yang berkaitan dengan Gunung Sinai; 'dekat' menyampaikan hubungan geografis tanpa menyiratkan bahwa padang itu milik gunung.
- source_word: ἄγγελος
  choice: seorang malaikat
  rationale: Dalam konteks penampakan surgawi, 'malaikat' adalah padanan yang tepat, sementara bentuk tanpa artikel tidak membenarkan penambahan 'Tuhan'.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: dalam nyala api dari semak
  rationale: Terjemahan ini mempertahankan citra nyala api dan menyampaikan hubungan genitif βάτου yang padat sebagai api yang berasal dari atau berkaitan dengan semak, sesuai latar Keluaran 3:2.
theological_decisions:
- issue: Identitas sosok yang menampakkan diri (ἄγγελος) dalam konteks teofani
  choice: seorang malaikat
  alternative: Malaikat Tuhan
  rationale: Teks Kisah Para Rasul ini hanya menyebut ἄγγελος dan tidak memuat frasa 'Tuhan'. Karena itu, teks utama tidak memperkuat identifikasi yang tidak dinyatakan, sementara kaitannya dengan Keluaran 3:2 dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, dengan istilah Alkitabiah yang dikenal. Semua penanda catatan kaki dicantumkan dalam teks utama.
