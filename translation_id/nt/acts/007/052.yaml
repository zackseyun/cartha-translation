  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: id
  text: Nabi manakah yang tidak dianiaya oleh leluhur kalian[c]? Dan mereka membunuh orang-orang yang sebelumnya memberitakan kedatangan Orang Benar itu[a], yang sekarang telah kalian menjadi pengkhianat dan pembunuh-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sang Adil” atau “Sang Benar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang yang mengkhianati dan membunuh-Nya.” Kata Yunaninya juga dapat mengandung gagasan menyerahkan seseorang kepada lawannya.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “bapak-bapak kalian”; dalam konteks ini maksudnya adalah para leluhur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν οὐκ ἐδίωξαν
  choice: Nabi manakah yang tidak dianiaya
  rationale: Bentuk pertanyaan retoris dan penyangkalan dipertahankan, sehingga tersirat bahwa tidak seorang nabi pun luput dari penganiayaan.
- source_word: οἱ πατέρες ὑμῶν
  choice: leluhur kalian
  rationale: Dalam konteks ini πατέρες menunjuk kepada generasi terdahulu. 'Leluhur' alami dalam bahasa Indonesia modern dan tetap mempertahankan kesinambungan tuduhan Stefanus.
- source_word: τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως
  choice: orang-orang yang sebelumnya memberitakan kedatangan
  rationale: Ungkapan ini mempertahankan unsur pemberitaan dan makna waktu dari awalan προ-, tanpa mempersempitnya hanya menjadi ramalan.
- source_word: τοῦ δικαίου
  choice: Sang Benar
  rationale: Frasa berartikel ini berfungsi sebagai sebutan khusus bagi Yesus. 'Sang Benar' ringkas, bermartabat, dan mempertahankan sifatnya sebagai gelar.
- source_word: οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ἐγένεσθε
  choice: Terhadap Dia, sekarang kalian telah menjadi pengkhianat dan pembunuh
  rationale: Susunan ini mempertahankan hubungan dengan Sang Benar, penekanan waktu νῦν, serta bentuk nomina predikatif 'pengkhianat' dan 'pembunuh' bersama gagasan 'telah menjadi'.
theological_decisions:
- issue: τοῦ δικαίου sebagai sebutan kristologis
  choice: Sang Benar
  alternative: Sang Adil; Orang Benar itu
  rationale: Konteks pidato Stefanus menunjuk kepada Yesus sebagai pribadi tertentu yang kedatangan-Nya diberitakan sebelumnya. Huruf kapital dan 'Sang' menandai fungsi sebutan tanpa menambahkan identifikasi yang tidak dinyatakan dalam ayat.
- issue: Hubungan οὗ dengan προδόται καὶ φονεῖς
  choice: Terhadap Dia ... pengkhianat dan pembunuh
  alternative: Dia yang telah kalian khianati dan bunuh
  rationale: Pilihan utama mempertahankan konstruksi tuduhan dengan nomina dan ἐγένεσθε ('telah menjadi'), alih-alih mengubahnya menjadi dua verba tindakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak 'kalian' mempertahankan sapaan langsung kepada para pendengar. Kalimat kedua diawali 'Dan' untuk mencerminkan καὶ tanpa menambahkan penekanan seperti 'bahkan'.
