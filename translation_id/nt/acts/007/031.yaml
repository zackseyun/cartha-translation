  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: id
  text: 'Ketika Musa melihatnya, ia takjub pada pemandangan itu.[a] Saat ia mendekat untuk mengamatinya dengan saksama, datanglah suara Tuhan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penglihatan itu.” Kata Yunani yang dipakai dapat menunjuk pada sesuatu yang tampak atau pada suatu penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... melihatnya
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Bentuk temporal ini alami dalam bahasa Indonesia, sedangkan -nya merujuk pada apa yang tampak dalam konteks.
- source_word: ἐθαύμασεν
  choice: ia takjub
  rationale: θαυμάζω menyatakan rasa heran atau kagum yang kuat; 'takjub' ringkas, wajar, dan sesuai dengan nada narasi.
- source_word: τὸ ὅραμα
  choice: pemandangan itu
  rationale: ὅραμα dapat berarti sesuatu yang terlihat atau suatu penglihatan. Dalam konteks Musa sedang menanggapi fenomena yang tampak, 'pemandangan itu' paling alami tanpa menutup kemungkinan makna 'penglihatan'.
- source_word: προσερχομένου
  choice: saat ia mendekat
  rationale: Konstruksi genitif absolut ini menyatakan waktu atau keadaan yang menyertai; terjemahan ini mempertahankan gerak Musa menuju fenomena tersebut.
- source_word: κατανοῆσαι
  choice: untuk mengamatinya dengan saksama
  rationale: Verba ini menunjuk pada perhatian atau pengamatan yang cermat. Frasa tersebut alami dalam bahasa Indonesia dan mempertahankan fokus visual konteks.
- source_word: ἐγένετο φωνὴ
  choice: terdengarlah suara
  rationale: Konstruksi eventif ini memperkenalkan munculnya suara. 'Terdengarlah' merupakan ungkapan naratif Indonesia yang alami, meskipun alternatif yang lebih formal, 'datanglah suara', lebih dekat pada bentuk Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος diterjemahkan sebagai 'Tuhan'. Dalam frasa Indonesia, 'suara Tuhan' tidak memerlukan kata sandang.
theological_decisions:
- issue: Terjemahan κύριος dalam konteks penampakan ilahi
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, bukan Tetragramaton. 'Tuhan' mewakili bentuk Yunani, sementara 'TUHAN' akan memasukkan identifikasi berdasarkan latar Keluaran 3 yang tidak dinyatakan secara grafis dalam teks ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Takjub', 'mendekat', dan 'mengamati dengan saksama' mudah dipahami pembaca umum. Kapitalisasi 'Tuhan' mengikuti pemakaian gelar ilahi dalam bahasa Indonesia tanpa mengubah κύριος menjadi Tetragramaton.
