  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur utama Yunani dengan setia: penghubung naratif δέ, sapaan formal maskulin, imperatif untuk menyimak, gelar ilahi, penampakan kepada Abraham sebagai leluhur bersama, lokasi di Mesopotamia, dan urutan waktu sebelum tinggal di Haran. Frasa “ketika ia berada di Mesopotamia” serta “sebelum ia tinggal di Haran” mempertahankan keterangan temporal tanpa mencoba menyelaraskan atau menjelaskan persoalan kronologi yang tersirat.'
