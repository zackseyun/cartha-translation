id: ACT.7.2
reference: Acts 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: id
  text: Lalu ia berkata, “Saudara-saudara dan Bapak-bapak[a], dengarkanlah! Allah yang penuh kemuliaan menampakkan diri kepada leluhur kita, Abraham, ketika ia berada di Mesopotamia, sebelum ia tinggal di Haran[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Saudara-saudara laki-laki dan Bapak-bapak.” Formula sapaan Yunani ini bersifat formal dan secara eksplisit maskulin.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebelum ia menetap di Haran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Lalu ia berkata
  rationale: δέ di sini merupakan penghubung naratif ringan. “Lalu” mengalir alami dalam bahasa Indonesia tanpa memberi pertentangan yang tidak dituntut teks.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Saudara-saudara dan Bapak-bapak
  rationale: Sapaan ini formal dan ditujukan kepada laki-laki. Rumusan Indonesia ini mempertahankan hubungan persaudaraan dan penghormatan kepada para pemimpin yang lebih tua, sedangkan unsur ἄνδρες tidak diterjemahkan sebagai sapaan terpisah karena fungsinya menyatu dalam formula vokatif.
- source_word: ἀκούσατε
  choice: dengarkanlah
  rationale: Imperatif ini meminta perhatian langsung. Bentuk “-lah” terdengar tegas sekaligus wajar dan santun dalam tuturan formal.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Allah yang penuh kemuliaan
  rationale: Pilihan ini mempertahankan gagasan nominal “kemuliaan” dalam konstruksi Yunani dan lebih alami daripada terjemahan harfiah “Allah kemuliaan,” tanpa menyempitkannya sekadar menjadi sifat “mulia.”
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Dalam konteks penampakan ilahi, bentuk pasif ὁράω lazim bermakna “tampak/menampakkan diri.” Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan penyingkapan khusus yang tidak dinyatakan.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: kepada leluhur kita, Abraham
  rationale: πατήρ di sini menyatakan Abraham sebagai leluhur bersama. “Leluhur kita” menyampaikan hubungan komunal itu dengan jelas dan alami dalam bahasa Indonesia.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: ketika ia berada di Mesopotamia
  rationale: Partisipel ini bersifat temporal atau sirkumstansial; “ketika ia berada” menyatakannya dengan jelas tanpa menambah rincian.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: sebelum ia tinggal di Haran
  rationale: κατοικέω dapat berarti tinggal, berdiam, atau menetap. “Tinggal” merupakan pilihan paling luas dan mudah dipahami, sementara kemungkinan “menetap” dicatat dalam catatan kaki.
theological_decisions:
- issue: Sapaan maskulin kepada para pendengar
  choice: Saudara-saudara dan Bapak-bapak
  alternative: Saudara-saudara laki-laki dan para bapak
  rationale: Teks Yunani memakai formula sapaan yang secara eksplisit maskulin. Terjemahan utama tidak menetralkannya, tetapi menghindari pengulangan kaku yang akan timbul bila ἄνδρες diterjemahkan secara terpisah.
- issue: Gelar ilahi θεὸς τῆς δόξης
  choice: Allah yang penuh kemuliaan
  alternative: Allah yang mulia
  rationale: Terjemahan utama mempertahankan “kemuliaan” sebagai nomina dan dengan demikian menjaga bentuk serta kemungkinan gema bahasa Kitab Suci, tanpa mengubahnya menjadi pernyataan doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada formal dan bermartabat, sesuai dengan pembelaan Stefanus di hadapan Mahkamah Agama. Sapaan dibuat alami bagi pembaca masa kini, sedangkan struktur dan ketegangan leksikal utama dipertahankan melalui pilihan teks dan catatan kaki.
