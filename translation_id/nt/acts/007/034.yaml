    text: Atau “penindasan terhadap umat-Ku” atau “penderitaan umat-Ku.”
    reason: lexical_alternative
  revision_rationale: Revisi mengganti 'marilah' dengan 'datanglah' agar panggilan kepada Musa yang tunggal diterjemahkan dengan tepat. 'Penindasan' diganti dengan 'perlakuan buruk' untuk mempertahankan cakupan κάκωσις yang tidak hanya politis, sementara alternatif yang sah dicatat dalam catatan kaki. Penanda catatan kaki dipindahkan ke istilah yang dijelaskannya.
