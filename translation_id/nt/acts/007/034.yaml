revisions:
- from: Aku benar-benar telah melihat penindasan terhadap umat-Ku yang ada di Mesir[a], dan Aku telah mendengar keluh kesah mereka. Aku telah turun untuk membebaskan mereka. Sekarang, marilah, Aku akan mengutusmu ke Mesir.
  to: Aku benar-benar telah melihat perlakuan buruk terhadap umat-Ku[a] yang ada di Mesir, dan Aku telah mendengar keluh kesah mereka. Aku telah turun untuk membebaskan mereka. Dan sekarang, datanglah; Aku akan mengutusmu ke Mesir.
  rationale: Revisi mengganti 'marilah' dengan 'datanglah' agar panggilan kepada Musa yang tunggal diterjemahkan dengan tepat. 'Penindasan' diganti dengan 'perlakuan buruk' untuk mempertahankan cakupan κάκωσις yang tidak hanya politis, sementara alternatif yang sah dicatat dalam catatan kaki. Penanda catatan kaki dipindahkan ke istilah yang dijelaskannya.
