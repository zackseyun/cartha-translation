id: ACT.7.34
reference: Acts 7:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: id
  text: Aku benar-benar telah melihat perlakuan buruk terhadap umat-Ku[a] yang ada di Mesir, dan Aku telah mendengar keluh kesah mereka. Aku telah turun untuk membebaskan mereka. Dan sekarang, datanglah; Aku akan mengutusmu ke Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penindasan terhadap umat-Ku” atau “penderitaan umat-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Aku benar-benar telah melihat
  rationale: Konstruksi partisip ditambah verba finit ini memberi penekanan dengan gaya Semitis dan menggemakan Keluaran 3:7. 'Benar-benar telah melihat' menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: κάκωσιν
  choice: penindasan
  rationale: Nomina ini menunjuk pada perlakuan buruk yang mendatangkan penderitaan. 'Penindasan' sesuai dengan konteks Israel di Mesir, sedangkan alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: λαοῦ μου
  choice: umat-Ku
  rationale: '''Umat-Ku'' merupakan padanan Indonesia yang alami bagi λαοῦ μου dalam konteks hubungan Allah dengan Israel dan mempertahankan nuansa komunalnya.'
- source_word: τοῦ ἐν Αἰγύπτῳ
  choice: yang ada di Mesir
  rationale: Frasa ini menerangkan lokasi umat tersebut. Bentuk eksplisit 'yang ada di Mesir' jelas dan tetap dekat dengan susunan sumber.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: keluh kesah mereka
  rationale: Pronomina Yunani berbentuk tunggal karena mengacu kepada λαός sebagai kelompok kolektif; bahasa Indonesia secara alami memakai 'mereka'. 'Keluh kesah' menyampaikan rintihan akibat penderitaan dengan bahasa yang mudah dipahami.
- source_word: κατέβην
  choice: Aku telah turun
  rationale: Terjemahan ini mempertahankan ungkapan antropomorfis tentang tindakan ilahi tanpa menjelaskannya atau meredakannya.
- source_word: ἐξελέσθαι
  choice: untuk membebaskan
  rationale: Dalam konteks ini bentuk tengah ἐξαιρέω berarti melepaskan atau menyelamatkan dari penindasan. 'Membebaskan' cocok dengan konteks keluaran dari perbudakan dan tetap wajar dalam bahasa Indonesia.
- source_word: δεῦρο
  choice: marilah
  rationale: Partikel deiktis ini berfungsi sebagai ajakan atau perintah agar Musa datang mendekat. 'Marilah' bermartabat dan wajar dalam ujaran langsung ini.
- source_word: ἀποστείλω
  choice: Aku akan mengutusmu
  rationale: Bentuk ini paling langsung dipahami sebagai futurum dalam pernyataan penugasan. 'Mengutus' mempertahankan gagasan pengiriman dengan mandat.
- source_word: εἰς Αἴγυπτον
  choice: ke Mesir
  rationale: '''Ke Mesir'' adalah ungkapan tujuan yang alami dalam bahasa Indonesia.'
theological_decisions:
- issue: Ungkapan antropomorfis tentang turunnya Allah
  choice: Aku telah turun
  alternative: Aku datang untuk bertindak
  rationale: Teks sumber memakai bahasa spasial mengenai Allah. Terjemahan mempertahankan ketegangan dan citra tersebut, bukan menggantinya dengan penafsiran teologis.
- issue: Makna tindakan penyelamatan dalam ἐξελέσθαι
  choice: membebaskan mereka
  alternative: menyelamatkan mereka
  rationale: '''Membebaskan'' mempertahankan tindakan pelepasan dari penindasan dalam konteks Keluaran tanpa membatasi maknanya pada rumusan doktrinal tertentu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kapitalisasi pada kata ganti orang pertama untuk Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penekanan sumber dipertahankan melalui 'benar-benar'; ujaran ilahi dan citra 'turun' tidak diparafrasakan secara teologis.
