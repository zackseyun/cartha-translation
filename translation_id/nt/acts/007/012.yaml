id: ACT.7.12
reference: Acts 7:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: id
  text: Namun, ketika Yakub mendengar bahwa ada gandum di Mesir[a], ia mengutus nenek moyang kita ke sana untuk pertama kalinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "persediaan makanan di Mesir". Kata Yunani yang digunakan dapat menunjuk secara lebih luas kepada bahan makanan, meskipun dalam konteks ini kemungkinan besar yang dimaksud ialah gandum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoris berfungsi secara temporal terhadap verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dalam penuturan Stefanus tanpa membuat pertentangan terlalu tajam.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: bahwa ada gandum di Mesir
  rationale: Konstruksi akusatif dan partisip sesudah ἀκούω diterjemahkan secara idiomatis sebagai ujaran tak langsung. 'Gandum' paling sesuai dengan konteks bencana kelaparan dalam kisah Yusuf.
- source_word: σιτία
  choice: gandum
  rationale: Bentuk jamak σιτίον dapat berarti biji-bijian atau persediaan makanan; dalam konteks ini 'gandum' merupakan padanan yang paling tepat, sementara cakupan yang lebih luas dicatat dalam catatan kaki.
- source_word: ἐξαπέστειλεν
  choice: mengutus ... ke sana
  rationale: '''Mengutus'' menyatakan tindakan mengirim orang untuk suatu perjalanan atau tugas; ''ke sana'' secara alami mengungkapkan arah perjalanan yang tersirat menuju Mesir.'
- source_word: τοὺς πατέρας ἡμῶν
  choice: nenek moyang kita
  rationale: Ungkapan ini menunjuk kepada para leluhur laki-laki Israel, yakni saudara-saudara Yusuf. 'Nenek moyang kita' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan leluhur dengan para pendengar.
- source_word: πρῶτον
  choice: untuk pertama kalinya
  rationale: Menandai kunjungan pertama dari beberapa kunjungan dan mengantisipasi kunjungan kedua dalam kelanjutan kisah.
theological_decisions:
- issue: Penerjemahan τοὺς πατέρας ἡμῶν
  choice: nenek moyang kita
  alternative: bapa-bapa kita; para leluhur kita
  rationale: Yang dimaksud secara historis ialah leluhur laki-laki Israel. 'Nenek moyang kita' menyampaikan hubungan leluhur secara wajar dalam bahasa Indonesia tanpa memasukkan gelar interpretatif seperti 'para patriark'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; penambahan 'ke sana' memperjelas tujuan pengutusan yang sudah dinyatakan dalam klausa sebelumnya tanpa mengubah makna.
