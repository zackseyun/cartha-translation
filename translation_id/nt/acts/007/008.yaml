  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: id
  text: Ia memberikan kepada Abraham perjanjian sunat. Demikianlah Abraham memperanakkan Ishak dan menyunatnya pada hari kedelapan; Ishak memperanakkan Yakub, dan Yakub kedua belas bapa leluhur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: perjanjian sunat
  rationale: “Perjanjian” merupakan padanan baku bagi διαθήκη dalam konteks sejarah alkitabiah. Genitif περιτομῆς mendefinisikan perjanjian yang ditandai atau bercirikan sunat; frasa ringkas “perjanjian sunat” mempertahankan hubungan itu secara alami.
- source_word: οὕτως
  choice: Sesudah itu
  rationale: Dalam rangkaian naratif ini, οὕτως menghubungkan pemberian perjanjian dengan kelahiran Ishak dan pelaksanaan sunat. “Sesudah itu” menyampaikan kesinambungan urutan tanpa menyisipkan kesimpulan teologis tambahan.
- source_word: ἐγέννησεν
  choice: menjadi ayah
  rationale: Kata ini menunjuk pada peran laki-laki dalam garis keturunan. “Menjadi ayah” jelas dan wajar dalam bahasa Indonesia modern, sedangkan “memperanakkan” terasa lebih kaku dan kuno.
- source_word: περιέτεμεν
  choice: menyunatnya
  rationale: “Menyunat” adalah padanan langsung dan lazim bagi περιτέμνω; akhiran “-nya” mempertahankan Ishak sebagai objek tindakan.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: pada hari kedelapan
  rationale: Frasa datif ini menyatakan waktu. Terjemahan tidak menambahkan “setelah lahir,” karena keterangan tersebut tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: πατριάρχας
  choice: bapa leluhur
  rationale: Istilah ini menunjuk kepada dua belas leluhur suku-suku Israel. “Bapa leluhur” mudah dipahami, tetap menunjukkan tokoh laki-laki, dan sesuai dengan konteks sejarah Israel.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Ishak / Yakub
  rationale: Dipakai bentuk nama yang sudah baku dalam tradisi dan penggunaan Alkitab berbahasa Indonesia.
theological_decisions:
- issue: Kekhususan perjanjian dengan Abraham
  choice: perjanjian sunat
  alternative: suatu perjanjian sunat; perjanjian yang ditandai dengan sunat
  rationale: Konteks menunjuk kepada perjanjian tertentu yang diberikan kepada Abraham sebagaimana dikisahkan dalam Kejadian 17. Bahasa Indonesia tidak memerlukan kata sandang tentu untuk menunjukkan kekhususan itu.
- issue: Subjek dan penerima pada awal ayat
  choice: Dia memberikan kepada Abraham
  alternative: Ia memberikan kepadanya
  rationale: 'Teks Yunani memakai subjek dan objek pronominal yang acuannya tersedia dari konteks sebelumnya: Allah sebagai pemberi dan Abraham sebagai penerima. Menyebut Abraham menghindari ketidakjelasan dalam bahasa Indonesia, sedangkan “Dia” tetap mempertahankan kesinambungan subjek dengan ayat sebelumnya.'
- issue: Ungkapan garis keturunan untuk γεννάω
  choice: menjadi ayah
  alternative: memperanakkan; memperanakkan anak
  rationale: Pilihan ini mempertahankan garis keturunan laki-laki yang dinyatakan teks tanpa menggunakan ungkapan arkais atau menyiratkan rincian biologis yang tidak menjadi fokus ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lancar bagi pembaca umum, dengan pengulangan “menjadi ayah” untuk memperjelas rantai silsilah. Tidak ada catatan kaki karena tidak terdapat persoalan tekstual atau ambiguitas penting yang memerlukannya dalam terjemahan utama.
