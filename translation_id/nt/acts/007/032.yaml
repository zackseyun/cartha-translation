  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: id
  text: “Akulah Allah nenek moyangmu, Allah Abraham, Ishak, dan Yakub.” Musa pun gemetar ketakutan dan tidak berani melihat dengan saksama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengamati dengan teliti” atau “memperhatikan dengan sungguh-sungguh.” Kata Yunani ini dapat menunjuk pada pengamatan yang cermat atau perhatian yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: Akulah
  rationale: Kata ganti orang pertama ini bersifat emfatis. Bentuk “Akulah” secara alami mempertahankan penekanan itu dalam rumusan pengenalan diri ilahi.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Dalam konteks kutipan Kitab Suci ini, θεός menunjuk kepada Allah yang memperkenalkan diri kepada Musa; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: τῶν πατέρων σου
  choice: nenek moyangmu
  rationale: Secara harfiah berarti “bapa-bapamu,” tetapi dalam konteks ini menunjuk kepada para leluhur Musa. “Nenek moyangmu” jelas dan wajar dalam bahasa Indonesia modern tanpa menghilangkan hubungan historis-perjanjian.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Allah Abraham, Ishak, dan Yakub
  rationale: Ungkapan ini dipertahankan sebagai penjelasan lebih lanjut tentang identitas Allah. Daftar nama disusun menurut kaidah bahasa Indonesia sambil mempertahankan ketiga nama dan irama kutipan.
- source_word: ἔντρομος ... γενόμενος
  choice: gemetar ketakutan
  rationale: ἔντρομος menggambarkan keadaan takut yang disertai kegentaran. Ungkapan “gemetar ketakutan” menyampaikan intensitas dan unsur jasmaninya secara alami; perubahan menjadi keadaan itu tersirat dalam alur narasi.
- source_word: δὲ
  choice: pun
  rationale: Partikel δέ menandai peralihan ringan kepada reaksi Musa. “Pun” memberi kesinambungan naratif yang alami tanpa menciptakan pertentangan yang terlalu kuat.
- source_word: οὐκ ἐτόλμα
  choice: tidak berani
  rationale: Padanan ini menyampaikan keengganan atau ketidakberanian yang dinyatakan oleh bentuk imperfek τολμάω secara idiomatis.
- source_word: κατανοῆσαι
  choice: melihat dengan saksama
  rationale: Dalam konteks semak yang menyala, verba ini paling wajar dipahami sebagai memandang atau mengamati secara teliti. Terjemahan ini tetap membuka nuansa perhatian atau pengamatan mendalam.
theological_decisions:
- issue: Rumusan pengenalan diri ilahi yang secara harfiah tidak memakai kopula
  choice: Akulah Allah nenek moyangmu
  alternative: Aku, Allah nenek moyangmu
  rationale: Bahasa Yunani menempatkan Ἐγώ secara emfatis dalam klausa identifikasi tanpa kopula tertulis. “Akulah” menghasilkan kalimat Indonesia yang alami dan mempertahankan penekanannya tanpa menambahkan klaim teologis di luar kutipan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Nenek moyang” dipilih daripada bentuk harfiah “bapa-bapa” agar makna leluhur jelas bagi pembaca umum. Susunan kalimat mempertahankan kekhidmatan pengenalan diri ilahi dan kegentaran Musa.
