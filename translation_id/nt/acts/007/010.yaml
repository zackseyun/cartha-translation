    issue: Subjek κατέστησεν diubah menjadi Firaun.
    rationale: Teks Yunani tidak memperkenalkan Firaun sebagai subjek verba terakhir. Rangkaian καὶ ἐξείλατο ... καὶ ἔδωκεν ... καὶ κατέστησεν mempertahankan subjek tunggal tersirat dari konteks sebelumnya, yakni Allah. Menjadikan Firaun pelaku 'mengangkat' mengubah makna sumber.
  - severity: low
    issue: Rujukan 'seluruh rumah tangganya' berpotensi ambigu dalam bahasa Indonesia.
    rationale: αὐτοῦ merujuk kepada Firaun. Menyebut 'seluruh rumah tangga Firaun' membuat rujukan administratif yang dimaksud teks jelas.
