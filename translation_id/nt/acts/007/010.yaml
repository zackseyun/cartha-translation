    rationale: '"Kemurahan hati" lebih mudah dipahami sebagai kebaikan yang dilakukan seseorang, sedangkan χάρις di sini adalah perkenanan/favor yang Yusuf terima di hadapan Firaun. "Anugerah" merupakan alternatif leksikal yang lebih dekat, dengan catatan bahwa konteksnya menunjuk pada perkenanan Firaun.'
