  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: id
  text: dan melepaskan dia dari segala kesusahannya, serta mengaruniakan kepadanya perkenanan[a] dan hikmat di hadapan Firaun, raja Mesir, dan mengangkatnya[b] menjadi penguasa atas Mesir dan seluruh rumah tangga Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anugerah”; yang dimaksud ialah perkenanan di mata Firaun.
    reason: lexical_alternative
  - marker: b
    text: Atau “menetapkannya sebagai pemimpin atas Mesir dan seluruh rumah tangga Firaun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: melepaskan
  rationale: Bentuk medium ἐξαιρέω menyatakan tindakan membebaskan atau menyelamatkan dari bahaya dan tekanan; “melepaskan” alami dalam bahasa Indonesia dan cocok dengan pelengkap “dari”.
- source_word: θλίψεων
  choice: kesusahan
  rationale: θλῖψις di sini mencakup tekanan, penderitaan, dan berbagai keadaan sulit yang dialami Yusuf; “kesusahan” luas, wajar, dan tidak membawa nuansa eskatologis yang tidak diperlukan.
- source_word: χάριν
  choice: perkenanan
  rationale: Dalam konteks ini χάρις menunjuk pada pandangan atau sikap baik Firaun terhadap Yusuf, bukan secara khusus konsep teologis “anugerah”.
- source_word: σοφίαν
  choice: hikmat
  rationale: σοφία menyatakan hikmat, termasuk kecakapan dan pertimbangan praktis yang diakui Firaun.
- source_word: ἐναντίον
  choice: di hadapan
  rationale: ἐναντίον dengan genitif menunjukkan kehadiran atau kedudukan seseorang di depan pihak lain; “di hadapan Firaun” ringkas dan setia pada bentuk sumber.
- source_word: κατέστησεν
  choice: mengangkat
  rationale: καθίστημι di sini berarti menempatkan seseorang dalam jabatan atau kedudukan berwenang; “mengangkat” merupakan ungkapan Indonesia yang alami untuk pelantikan semacam itu.
- source_word: ἡγούμενον
  choice: penguasa
  rationale: Partisip ini menunjuk pada orang yang memimpin atau menjalankan kewenangan pemerintahan; “penguasa” mempertahankan keluasan makna tanpa mempersempitnya menjadi jabatan birokratis tertentu.
- source_word: ἐπ’ Αἴγυπτον
  choice: atas Mesir
  rationale: ἐπί dengan akusatif dalam konstruksi pengangkatan menyatakan lingkup kewenangan; “atas Mesir” menyampaikan otoritas tersebut secara padat.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: seluruh rumah tangganya
  rationale: οἶκος dalam konteks ini berarti rumah tangga atau lingkungan istana milik Firaun, bukan sekadar bangunan fisik.
theological_decisions:
- issue: Subjek tersirat pada rangkaian verba
  choice: Subjek tindakan melepaskan dan mengaruniakan tetap tersirat sebagai Allah; Firaun dinyatakan sebagai subjek pengangkatan melalui konteks gramatikal.
  alternative: Menambahkan “Allah” sebagai subjek eksplisit pada awal ayat, atau membaca Allah sebagai subjek semua verba.
  rationale: Konteks Kisah Para Rasul 7:9 menyatakan bahwa Allah menyertai Yusuf, sehingga Allah secara alami menjadi subjek dua verba pertama. Namun, frasa ἐναντίον Φαραὼ βασιλέως Αἰγύπτου paling wajar berfungsi bersama pemberian perkenanan dan hikmat, sedangkan subjek κατέστησεν dapat dipahami sebagai Firaun berdasarkan kisah Kejadian. Menyebut “Firaun” pada kalimat kedua menghasilkan bahasa Indonesia yang jelas tanpa menambahkan Allah ke teks secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Firaun” mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia; “rumah tangga” dipakai dalam arti lingkungan domestik-administratif istana. Penataan menjadi dua kalimat memperjelas pergantian subjek yang tersirat tanpa mengubah urutan gagasan sumber.
