  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: id
  text: Namun, setelah ia ditelantarkan, putri Firaun mengambilnya[a] dan membesarkannya sebagai anaknya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memungutnya.” Kata Yunani ini dapat berarti mengambil seorang anak yang telah ditelantarkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi dirinya sendiri sebagai seorang anak laki-laki” atau “sebagai seorang anak laki-laki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: setelah Musa dibuang
  rationale: Partisip aoristus pasif ini menggambarkan bayi yang diletakkan atau dibuang di luar. “Dibuang” alami dalam konteks narasi, sedangkan penyebutan “Musa” memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan sekaligus kontras antara Musa yang dibuang dan tindakan putri Firaun yang menyelamatkannya.
- source_word: ἀνείλατο
  choice: mengambilnya
  rationale: Dalam konteks bayi yang dibuang, verba bentuk medial ini berarti mengambil atau memungutnya. “Mengambilnya” mempertahankan tindakan tersebut tanpa mencampurkannya dengan hasil akhirnya sebagai anak.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: putri Firaun
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan genitif sumber.
- source_word: ἀνεθρέψατο
  choice: membesarkannya
  rationale: Verba ini menunjuk pada tindakan merawat dan membesarkan seorang anak.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: sebagai anaknya sendiri
  rationale: Ungkapan ini menyatakan peran atau status Musa sebagai anak bagi putri Firaun. Terjemahan ini alami dan mempertahankan hubungan keluarga yang dimaksud tanpa memakai istilah hukum khusus seperti “mengadopsi”.
