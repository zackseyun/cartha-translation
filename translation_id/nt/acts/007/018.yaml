id: ACT.7.18
reference: Acts 7:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: id
  text: sampai tampil seorang raja lain yang berkuasa atas Mesir,[a] yang tidak mengenal Yusuf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai seorang raja lain bangkit memerintah Mesir.” Kata Yunani yang diterjemahkan “tampil” secara harfiah berarti “bangkit”.
    reason: lexical_alternative
  - marker: b
    text: “Tidak mengenal Yusuf” juga dapat menyiratkan “tidak mengakui” atau “tidak mengindahkan Yusuf”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: sampai
  rationale: Frasa ini menandai batas waktu bagi keadaan yang disebut sebelumnya; 'sampai' alami dan tepat dalam bahasa Indonesia.
- source_word: ἀνέστη
  choice: tampil
  rationale: Secara harfiah verba ini berarti 'bangkit', tetapi dalam konteks munculnya seorang penguasa, 'tampil' menyampaikan kemunculannya tanpa menyiratkan kebangkitan dari kematian. Nuansa mulai berkuasa dijelaskan oleh frasa berikut dan catatan kaki.
- source_word: βασιλεὺς
  choice: raja
  rationale: '''Raja'' merupakan padanan langsung dan sesuai dengan latar historis Mesir.'
- source_word: ἕτερος
  choice: lain
  rationale: Menandai raja yang berbeda dari penguasa sebelumnya tanpa menambahkan perbedaan sifat yang tidak dinyatakan secara eksplisit.
- source_word: ἐπ’ Αἴγυπτον
  choice: yang berkuasa atas Mesir
  rationale: Konstruksi ἐπί dengan wilayah dalam konteks βασιλεύς menyatakan kekuasaan atas Mesir; bentuk ini lebih alami daripada 'raja atas Mesir' dalam bahasa Indonesia.
- source_word: οὐκ ᾔδει
  choice: tidak mengenal
  rationale: Mempertahankan arti dasar οἶδα dan sekaligus membiarkan terbuka kemungkinan kontekstual bahwa sang raja tidak mengakui atau tidak mengindahkan Yusuf.
- source_word: τὸν Ἰωσήφ
  choice: Yusuf
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
