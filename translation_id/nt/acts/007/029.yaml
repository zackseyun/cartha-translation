  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: id
  text: Karena perkataan itu, Musa melarikan diri dan tinggal sebagai orang asing di tanah Midian[a]. Di sana ia menjadi ayah bagi dua anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi pendatang di tanah Midian.” Istilah Yunaninya menunjuk kepada orang yang tinggal di negeri yang bukan tanah airnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: melarikan diri
  rationale: Bentuk aoristus φεύγω menyatakan tindakan Musa pergi untuk menghindari bahaya; 'melarikan diri' alami dan mempertahankan daya tindakannya.
- source_word: δὲ
  choice: pun
  rationale: Partikel δέ melanjutkan narasi dan menghubungkan tindakan Musa dengan ucapan pada ayat sebelumnya; 'pun' menyampaikan kesinambungan serta akibat secara wajar.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: Mendengar perkataan itu
  rationale: Secara harfiah frasa ini berarti 'pada/karena perkataan itu'. Dalam bahasa Indonesia, 'mendengar perkataan itu' secara alami menunjukkan ucapan yang langsung memicu pelarian tanpa mempertegas kausalitas secara berlebihan.
- source_word: ἐγένετο πάροικος
  choice: tinggal sebagai pendatang
  rationale: πάροικος adalah orang yang menetap di negeri yang bukan tanah asalnya. Pilihan ini lebih mudah dipahami daripada istilah administratif dan tidak menyiratkan bahwa ia sekadar singgah sebentar.
- source_word: ἐν γῇ Μαδιάμ
  choice: di tanah Midian
  rationale: Mencerminkan penyebutan γῇ secara langsung dan mempertahankan bentuk geografis teks Yunani.
- source_word: οὗ
  choice: Di sana
  rationale: Adverbia relatif ini menunjuk kembali kepada tanah Midian; pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang lancar.
- source_word: ἐγέννησεν
  choice: ia memperoleh
  rationale: Dengan subjek laki-laki, γεννάω berarti menjadi ayah atau mempunyai anak. 'Memperoleh' menyampaikan hal itu secara alami dan bermartabat tanpa ungkapan biologis yang janggal dalam bahasa Indonesia.
- source_word: υἱοὺς δύο
  choice: dua anak laki-laki
  rationale: Padanan langsung yang jelas bagi frasa Yunani; dalam konteks hubungan keluarga, maknanya adalah dua putra.
