  terminology: '"Orang asing" mempertahankan unsur πάροικος, yakni seseorang yang tinggal di negeri yang bukan tanah airnya. "Tanah Midian" dan "dua anak laki-laki" sesuai dengan unsur geografis dan jenis kelamin yang eksplisit dalam teks Yunani.'
