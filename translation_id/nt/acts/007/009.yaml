  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: id
  text: Karena iri kepada Yusuf, para leluhur Israel menjual dia ke Mesir, dan Allah menyertai dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: para leluhur bangsa Israel
  rationale: Dalam konteks pidato Stefanus, istilah ini menunjuk kepada anak-anak Yakub sebagai leluhur pendiri suku-suku Israel. Ungkapan ini lebih mudah dipahami pembaca umum daripada transliterasi “para patriark”, tanpa menghilangkan acuan historisnya.
- source_word: ζηλώσαντες
  choice: karena iri kepada
  rationale: Partisip aoris ini menyatakan dorongan yang melatarbelakangi tindakan menjual Yusuf. “Karena iri kepada” menyampaikan hubungan sebab atau motif secara alami dalam bahasa Indonesia.
- source_word: ἀπέδοντο
  choice: menjual
  rationale: Dalam konteks kisah Yusuf, verba ini secara konkret berarti menjual seseorang, bukan sekadar menyerahkan.
- source_word: εἰς Αἴγυπτον
  choice: ke Mesir
  rationale: Preposisi εἰς menyatakan arah atau tujuan. “Ke Mesir” merupakan padanan Indonesia yang alami; konteks sudah menunjukkan bahwa Yusuf dibawa masuk ke negeri itu.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Allah menyertai dia
  rationale: Ungkapan ini secara alami menyatakan kehadiran Allah bersama Yusuf. “Menyertai” mempertahankan makna relasional dan dukungan ilahi tanpa menambahkan penjelasan yang tidak dinyatakan teks.
theological_decisions:
- issue: Kehadiran Allah dalam penderitaan Yusuf
  choice: Namun, Allah menyertai dia
  alternative: dan Allah ada bersama dia
  rationale: Kata penghubung “Namun” menyatakan kontras pragmatis antara pengkhianatan para leluhur dan kehadiran Allah, yang tersirat kuat dalam susunan Yunani. Terjemahan ini mempertahankan ketegangan bahwa Yusuf dikhianati tetapi tidak ditinggalkan Allah, tanpa memperluasnya menjadi pernyataan khusus tentang providensi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Para leluhur bangsa Israel” dipilih agar referennya jelas bagi pembaca umum; “menyertai” adalah ungkapan Alkitabiah yang tetap lazim dan mudah dipahami.
