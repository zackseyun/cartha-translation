  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: id
  text: Setelah mengusirnya ke luar kota, mereka terus merajamnya. Para saksi meletakkan pakaian luar mereka[a] di dekat kaki seorang pemuda bernama Saulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian mereka” atau “jubah mereka”; istilah Yunani ini secara luas menunjuk pada pakaian luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: setelah mengusirnya
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama. “Mengusir” mempertahankan unsur pengeluaran secara paksa tanpa menambahkan gambaran khusus seperti menyeret.
- source_word: ἔξω τῆς πόλεως
  choice: ke luar kota
  rationale: Frasa ini menyatakan gerak dari dalam kota menuju luar kota dan berpadu alami dengan “mengusirnya”.
- source_word: ἐλιθοβόλουν
  choice: mereka terus merajamnya
  rationale: Imperfek menggambarkan tindakan yang sedang berlangsung; “terus” menandai aspek duratif, sedangkan “merajam” merupakan istilah Indonesia yang wajar untuk membunuh dengan lemparan batu.
- source_word: οἱ μάρτυρες
  choice: para saksi
  rationale: Dalam konteks pengadilan dan pelaksanaan hukuman ini, kata tersebut menunjuk kepada saksi hukum, bukan “martir” dalam pengertian gerejawi yang berkembang kemudian.
- source_word: ἀπέθεντο
  choice: meletakkan
  rationale: Bentuk medial ini dalam konteks pakaian berarti menanggalkan lalu menaruhnya; “meletakkan” menyampaikan tindakan menaruh dengan alami.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: pakaian luar mereka
  rationale: Ἱμάτια dapat menunjuk secara luas pada pakaian yang dikenakan di bagian luar. Terjemahan ini cukup spesifik tanpa mempersempitnya menjadi satu jenis pakaian tertentu.
- source_word: παρὰ τοὺς πόδας
  choice: di dekat kaki
  rationale: Preposisi παρά dengan akusatif di sini menyatakan penempatan di sisi atau dekat kaki seseorang.
- source_word: νεανίου
  choice: seorang pemuda
  rationale: Νεανίας menunjuk kepada laki-laki yang relatif muda; “pemuda” ringkas, alami, dan sesuai dengan ragam naratif Indonesia.
- source_word: καλουμένου Σαύλου
  choice: bernama Saulus
  rationale: Partisip ini memperkenalkan nama orang tersebut. “Bernama” lebih alami dalam bahasa Indonesia modern, dan “Saulus” mengikuti bentuk nama yang mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Makna μάρτυρες dalam konteks pelaksanaan hukuman
  choice: para saksi dalam arti hukum
  alternative: para martir
  rationale: Konteksnya adalah orang-orang yang memberi kesaksian dan hadir dalam perajaman. Menerjemahkannya sebagai “martir” akan memasukkan makna gerejawi yang lebih kemudian dan tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk aspek “terus merajamnya” dipakai untuk mencerminkan tindakan berkelanjutan dalam verba imperfek Yunani.
