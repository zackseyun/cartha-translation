id: ACT.7.35
reference: Acts 7:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: id
  text: Musa inilah yang mereka tolak dengan berkata, “Siapa yang mengangkatmu menjadi penguasa dan hakim?” Musa ini jugalah yang Allah utus sebagai penguasa dan pembebas[a], dengan perantaraan malaikat yang menampakkan diri kepadanya di semak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penebus.” Istilah Yunani ini dapat menunjuk pada orang yang mendatangkan pelepasan, pembebasan, atau penebusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτον τὸν Μωϋσῆν ... τοῦτον
  choice: Musa inilah ... Justru orang inilah
  rationale: 'Pengulangan demonstratif Yunani bersifat tegas dan membentuk ironi utama ayat: orang yang ditolak itu juga yang diutus Allah. Bentuk ini mempertahankan penekanan tanpa pengulangan nama yang kaku.'
- source_word: ἠρνήσαντο
  choice: telah mereka tolak
  rationale: Dalam konteks ini kata tersebut menunjuk pada penolakan terhadap kewibawaan Musa, bukan sekadar menyangkal suatu pernyataan.
- source_word: κατέστησεν
  choice: mengangkat
  rationale: Kata ini menyatakan penetapan seseorang pada kedudukan berwenang; 'mengangkat' adalah ungkapan Indonesia yang wajar untuk jabatan.
- source_word: ἄρχοντα
  choice: penguasa
  rationale: Pilihan ini mempertahankan arti orang yang menjalankan kewenangan serta pengulangan peran yang ditolak manusia tetapi diberikan Allah.
- source_word: δικαστήν
  choice: hakim
  rationale: Padanan langsung dan jelas bagi orang yang bertugas mengadili.
- source_word: λυτρωτὴν
  choice: pembebas
  rationale: Dalam konteks keluaran yang dikerjakan melalui Musa, kata ini menunjuk pada tokoh yang mendatangkan pelepasan atau pembebasan. 'Pembebas' alami dalam bahasa Indonesia dan tidak mempersempit maknanya pada pembayaran tebusan.
- source_word: ἀπέσταλκεν
  choice: diutus
  rationale: Bentuk pasif Indonesia membuat Allah tetap tampil sebagai pelaku dan menghasilkan kalimat yang alami; tindakan pengutusan yang sudah terlaksana dipertahankan.
- source_word: σὺν χειρὶ ἀγγέλου
  choice: dengan perantaraan malaikat
  rationale: Ungkapan harfiah 'dengan tangan malaikat' merupakan idiom Semitis tentang perantaraan atau sarana dan terdengar menyesatkan dalam bahasa Indonesia modern. 'Dengan perantaraan' menyampaikan fungsinya secara tepat.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: yang menampakkan diri kepadanya di semak itu
  rationale: Partisip pasif Yunani secara idiomatis berarti 'menampakkan diri'. Kata 'terbakar' tidak ditambahkan karena tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Makna λυτρωτής ketika Musa digambarkan sebagai pelaku pembebasan dalam sejarah keselamatan
  choice: pembebas
  alternative: penebus
  rationale: '''Pembebas'' mempertahankan gagasan pelepasan dari perbudakan yang nyata dalam konteks Musa, sedangkan ''penebus'' dapat menyiratkan mekanisme pembayaran yang tidak dinyatakan oleh ayat ini. Catatan kaki mempertahankan kemungkinan nuansa penebusan tanpa memaksakan penyamaan teologis lebih lanjut.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan 'Musa inilah ... Justru orang inilah' mempertahankan tekanan retoris sumber, sedangkan idiom agen 'dengan tangan' dialihkan secara alami menjadi 'dengan perantaraan'.
