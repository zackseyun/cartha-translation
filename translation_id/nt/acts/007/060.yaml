  source_fidelity: 'Teks Indonesia dengan setia mencerminkan seluruh unsur Yunani: tindakan berlutut, seruan dengan suara nyaring, sapaan «Tuhan», permohonan agar dosa tertentu itu tidak ditanggungkan kepada mereka, serta metafora tidur untuk kematian. «Lalu» merupakan penghubung naratif yang wajar untuk δέ.'
