id: ACT.7.60
reference: Acts 7:60
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: id
  text: Lalu ia berlutut dan berseru dengan suara nyaring, “Tuhan, jangan tanggungkan dosa ini kepada mereka.” Setelah mengatakan itu, ia tertidur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tertidur” lazim digunakan untuk menyatakan kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Lalu ia berlutut
  rationale: Ungkapan harfiah 'meletakkan lutut' merupakan idiom untuk tindakan berlutut. 'Lalu' menyampaikan perkembangan narasi yang ditandai δέ secara alami.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: berseru dengan suara nyaring
  rationale: Terjemahan ini mempertahankan baik tindakan berseru maupun penekanan eksplisit pada kerasnya suara.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini ditujukan kepada Yesus dalam konteks ayat sebelumnya. 'Tuhan' mempertahankan sapaan hormat sekaligus gelar κύριος yang lazim dalam Perjanjian Baru.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: jangan tanggungkan dosa ini kepada mereka
  rationale: Dalam konteks ini, στήσῃς mengandung gagasan menetapkan atau membebankan dosa kepada seseorang. 'Tanggungkan ... kepada' mempertahankan nuansa pertanggungjawaban, dan 'dosa ini' menjaga demonstrativa ταύτην.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Setelah mengatakan itu
  rationale: Konstruksi partisipial diungkapkan sebagai urutan waktu yang wajar dalam bahasa Indonesia tanpa menghilangkan kaitannya dengan doa sebelumnya.
- source_word: ἐκοιμήθη
  choice: ia tertidur
  rationale: Bentuk ini mempertahankan metafora tidur yang dipakai teks Yunani sebagai ungkapan bagi kematian Stefanus, alih-alih meratakannya menjadi 'ia meninggal'.
theological_decisions:
- issue: Metafora kematian dalam ἐκοιμήθη
  choice: ia tertidur
  alternative: ia meninggal
  rationale: Teks Yunani sengaja memakai metafora tidur. Mempertahankannya menjaga corak teologis dan sastra ayat tanpa menambahkan penjelasan doktrinal ke dalam teks utama.
- issue: Sapaan Κύριε dalam doa Stefanus
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks ayat sebelumnya menunjukkan bahwa Stefanus berbicara kepada Yesus. 'Tuhan' mempertahankan gelar kristologis dalam teks tanpa memperluas tafsirnya.
- issue: Nuansa forensik μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: jangan tanggungkan dosa ini kepada mereka
  alternative: jangan perhitungkan dosa ini kepada mereka
  rationale: Pilihan utama menyampaikan permohonan agar mereka tidak dibebani pertanggungjawaban atas dosa itu, sambil tetap alami dan khidmat dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak khidmat dan mudah dipahami. Struktur kalimat dibuat alami, sementara metafora kematian dan penekanan suara dalam bahasa Yunani dipertahankan.
