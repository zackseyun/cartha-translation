  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: id
  text: Lalu Yakub turun ke Mesir. Ia meninggal, demikian juga nenek moyang kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapak kita”; yang dimaksud ialah para leluhur Israel.
    reason: Menjelaskan bentuk maskulin-historis πατέρες serta alternatif yang lebih harfiah.
lexical_decisions:
- source_word: καὶ κατέβη
  choice: Lalu ... pergi
  rationale: καταβαίνω secara harfiah mengandung arah ‘turun’, tetapi dalam bahasa Indonesia ungkapan ‘turun ke Mesir’ kurang alami dan dapat menyiratkan gerak geografis yang tidak perlu. ‘Pergi ke Mesir’ menyampaikan perpindahan tempat dengan jelas, sedangkan καί naratif diterjemahkan ‘lalu’.
- source_word: Ἰακὼβ
  choice: Yakub
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: εἰς Αἴγυπτον
  choice: ke Mesir
  rationale: εἰς menandai gerak menuju atau memasuki suatu tempat; ‘ke Mesir’ adalah padanan Indonesia yang alami.
- source_word: ἐτελεύτησεν
  choice: meninggal
  rationale: τελευτάω berarti mati atau mengakhiri hidup. ‘Meninggal’ jelas, wajar, dan sesuai dengan ragam narasi yang bermartabat.
- source_word: αὐτὸς καὶ οἱ πατέρες ἡμῶν
  choice: ia meninggal, demikian juga nenek moyang kita
  rationale: Susunan ini mempertahankan bahwa baik Yakub maupun para leluhur Israel meninggal, sambil menghindari bentuk harfiah ‘ia dan bapak-bapak kita’ yang kaku dan berpotensi disalahpahami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna οἱ πατέρες ἡμῶν dalam sejarah Israel
  choice: nenek moyang kita
  alternative: bapak-bapak kita
  rationale: Dalam konteks pidato Stefanus, frasa itu menunjuk kepada para leluhur laki-laki Israel, khususnya para bapa leluhur. ‘Nenek moyang kita’ merupakan ungkapan Indonesia yang alami untuk rujukan historis tersebut tanpa mengubah identitas mereka menjadi orang tua langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat dibagi dua agar rangkaian naratif dan subjek kematian terbaca alami; ‘Di sana’ memperjelas hubungan kematian Yakub dengan Mesir yang tersirat dalam urutan Yunani.
