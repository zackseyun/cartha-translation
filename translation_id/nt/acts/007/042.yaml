id: ACT.7.42
reference: Acts 7:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: id
  text: 'Namun, Allah berpaling dan menyerahkan mereka untuk beribadah kepada bala tentara langit.[a] Seperti yang tertulis dalam kitab para nabi:[b]


    ‘Apakah selama empat puluh tahun di padang belantara kamu mempersembahkan hewan sembelihan dan kurban kepada-Ku, hai kaum Israel?’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Bala tentara langit'' adalah ungkapan alkitabiah bagi benda-benda langit dan, dalam konteks penyembahan berhala, kuasa-kuasa yang dikaitkan dengannya. Kata yang diterjemahkan ''beribadah'' juga dapat berarti melakukan pelayanan keagamaan.'
    reason: lexical_and_cultural_note
  - marker: b
    text: Atau, 'dalam gulungan kitab para nabi'.
    reason: lexical_alternative
  - marker: c
    text: Kutipan dari Amos 5:25. Bentuk pertanyaan Yunaninya mengharapkan jawaban negatif.
    reason: cross_reference_and_rhetorical_note
lexical_decisions:
- source_word: ἔστρεψεν
  choice: berpaling
  rationale: Mempertahankan metafora tindakan berbalik tanpa menambahkan objek yang tidak dinyatakan; bersama verba berikutnya, konteks menunjukkan penarikan diri dalam penghukuman.
- source_word: παρέδωκεν αὐτούς
  choice: menyerahkan mereka
  rationale: Mengungkapkan tindakan penghukuman berupa membiarkan atau menyerahkan mereka kepada jalan yang mereka pilih, tanpa menyatakan bahwa Allah menciptakan dosa mereka.
- source_word: λατρεύειν
  choice: untuk beribadah kepada
  rationale: Dalam konteks pengabdian religius kepada benda atau kuasa langit, 'beribadah' lebih alami dan jelas dalam bahasa Indonesia daripada 'melayani', meskipun nuansa pelayanan kultis tetap dicatat.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: bala tentara langit
  rationale: Mempertahankan ungkapan alkitabiah yang dapat menunjuk kepada benda-benda atau kuasa-kuasa langit tanpa mempersempitnya hanya menjadi bintang atau malaikat.
- source_word: καθὼς γέγραπται
  choice: Hal itu sesuai dengan yang tertulis
  rationale: Rumus kutipan ini menyatakan kesesuaian antara penghukuman yang disebutkan dan kesaksian para nabi.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: dalam kitab para nabi
  rationale: Terjemahan wajar bagi kumpulan tulisan kenabian; 'gulungan' mungkin secara bentuk fisik, tetapi tidak harus dimasukkan ke teks utama.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: Apakah ... kamu mempersembahkan kepada-Ku
  rationale: Mempertahankan bentuk pertanyaan retoris yang dalam bahasa Yunani mengharapkan jawaban negatif, tanpa mengubahnya menjadi pernyataan eksplisit.
- source_word: σφάγια καὶ θυσίας
  choice: hewan sembelihan dan kurban
  rationale: '''Hewan sembelihan'' mempertahankan unsur penyembelihan pada σφάγια, sedangkan ''kurban'' menyampaikan makna umum θυσίας dan menjaga pembedaan kedua istilah.'
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: selama empat puluh tahun di padang belantara
  rationale: Susunan Indonesia yang alami untuk durasi dan lokasi perjalanan Israel.
- source_word: οἶκος Ἰσραήλ
  choice: kaum Israel
  rationale: '''Kaum Israel'' merupakan ungkapan Indonesia yang alami dan bermartabat bagi idiom kolektif ''rumah Israel''.'
theological_decisions:
- issue: Tindakan Allah dalam penghukuman
  choice: Allah 'berpaling dan menyerahkan mereka' sebagai tindakan penghukuman setelah pemberontakan mereka.
  alternative: Allah sekadar mengizinkan mereka, atau secara aktif menyebabkan mereka melakukan penyembahan berhala.
  rationale: Pasangan verba Yunani menyatakan penghukuman berupa penyerahan, tetapi tidak perlu ditafsirkan bahwa Allah adalah pencipta dosa mereka.
- issue: Rujukan 'bala tentara langit'
  choice: Ungkapan dibiarkan cukup luas untuk benda-benda maupun kuasa-kuasa langit yang dijadikan objek ibadah.
  alternative: Menentukannya secara khusus sebagai bintang-bintang saja atau malaikat-malaikat saja.
  rationale: Konteks penyembahan astral mendukung benda atau kuasa langit, tetapi frasa sumber sendiri tidak mempersempit rujukannya.
- issue: Daya retoris kutipan Amos
  choice: Pertanyaan dipertahankan sebagai pertanyaan yang mengharapkan jawaban negatif.
  alternative: Mengubahnya menjadi pernyataan, 'Kamu tidak mempersembahkan ...'.
  rationale: Bentuk tanya menjaga ketegangan retoris dan bentuk teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Padang belantara' dipilih untuk latar perjalanan Israel; 'kaum Israel' mengalihkan idiom Semitik secara alami. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
