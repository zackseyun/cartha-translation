  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: id
  text: Lalu Imam Besar bertanya, “Benarkah semua itu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah semua itu memang demikian?”; atau secara lebih eksplisit, “Apakah tuduhan-tuduhan itu benar?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: bertanya
  rationale: Secara leksikal berarti ‘berkata’, tetapi karena langsung memperkenalkan pertanyaan, ‘bertanya’ merupakan ungkapan Indonesia yang lebih alami tanpa mengubah fungsi ujarannya.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ menandai kelanjutan alur narasi setelah tuduhan terhadap Stefanus.
- source_word: ὁ ἀρχιερεύς
  choice: Imam Besar
  rationale: Padanan baku bagi jabatan tunggal ἀρχιερεύς dalam sidang ini; bukan kelompok para imam kepala.
- source_word: Εἰ
  choice: Benarkah
  rationale: Dalam pertanyaan langsung, εἰ memperkenalkan pertanyaan ya/tidak. ‘Benarkah’ menyampaikan daya interogatif itu secara alami.
- source_word: ταῦτα
  choice: semua itu
  rationale: Kata tunjuk jamak ini merujuk pada hal-hal yang baru saja dituduhkan; ‘semua itu’ mempertahankan rujukan umum tanpa secara eksplisit menafsirkannya sebagai tuduhan.
- source_word: οὕτως ἔχει
  choice: benar
  rationale: Ungkapan idiomatis ini berarti ‘demikian adanya’ atau ‘memang begitu’. Dalam konteks pemeriksaan perkara, ‘benar’ adalah padanan Indonesia yang ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Imam Besar’ dipertahankan sebagai nama jabatan. Bentuk ‘Benarkah semua itu?’ menyampaikan pertanyaan yudisial secara ringkas, sedangkan catatan kaki mempertahankan alternatif yang lebih harfiah dan yang lebih eksplisit secara kontekstual.
