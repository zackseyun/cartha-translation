id: ACT.7.41
reference: Acts 7:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: id
  text: Pada masa itu mereka membuat patung anak sapi[a] dan mempersembahkan kurban kepada berhala itu. Mereka terus bersukacita atas hasil karya tangan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membentuk anak sapi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bersukacita karena apa yang telah dibuat oleh tangan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: membuat patung anak sapi
  rationale: Kata kerja ini berarti membuat atau membentuk anak sapi. Penambahan 'patung' secara alami menjelaskan bahwa yang dimaksud ialah benda buatan, sementara penyebutan 'berhala itu' sesudahnya menegaskan sifat penyembahannya.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: pada masa itu
  rationale: Ungkapan waktu ini alami dalam bahasa Indonesia modern dan tetap mempertahankan acuan kepada masa yang baru saja diceritakan.
- source_word: ἀνήγαγον θυσίαν
  choice: mempersembahkan kurban
  rationale: Dalam konteks ibadah, ungkapan Yunani ini secara idiomatis berarti mempersembahkan kurban.
- source_word: τῷ εἰδώλῳ
  choice: kepada berhala itu
  rationale: Artikel menunjuk kepada patung anak sapi yang baru disebutkan. 'Berhala' mempertahankan penilaian negatif yang terkandung dalam εἴδωλον.
- source_word: εὐφραίνοντο
  choice: terus bersukacita
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; 'terus' menyampaikan aspek tersebut tanpa membuat kalimat menjadi kaku.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: atas hasil karya tangan mereka
  rationale: Terjemahan ini mempertahankan citra 'karya tangan' dan gema kecaman alkitabiah terhadap penyembahan berhala, sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa penyembahan berhala dan daya retoris
  choice: Menggunakan 'berhala' serta mempertahankan ungkapan 'hasil karya tangan mereka'.
  alternative: Menggunakan 'patung' atau meratakan frasa menjadi 'apa yang telah mereka buat'.
  rationale: Ucapan Stefanus mengecam penyembahan berhala Israel dengan bahasa yang menggemakan polemik Kitab Suci. Pilihan ini mempertahankan kecaman tersebut tanpa menambahkan tafsiran denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Kurban' dipilih untuk tindakan persembahan ritual, sedangkan 'terus bersukacita' menyampaikan aspek imperfek Yunani. Semua penanda catatan kaki dicantumkan dalam teks utama.
