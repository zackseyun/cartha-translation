  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: id
  text: Namun, Salomo membangun sebuah rumah bagi-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah”; Yunani “rumah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Salomo
  rationale: Bentuk baku nama Solomon dalam Alkitab dan bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan sekaligus kelanjutan kisah; dalam konteks ini, “Namun” lebih alami dan menjaga hubungan argumentatif dengan pembahasan sebelumnya.
- source_word: οἰκοδόμησεν
  choice: membangun
  rationale: Kata kerja ini secara konkret menunjuk pada tindakan mendirikan bangunan.
- source_word: αὐτῷ
  choice: bagi-Nya
  rationale: Pronomina datif ini merujuk kepada Allah dan menyatakan bahwa rumah tersebut dibangun bagi-Nya; kapitalisasi menghormati rujukan ilahi tanpa menambah makna.
- source_word: οἶκον
  choice: sebuah rumah
  rationale: Terjemahan harfiah “rumah” mempertahankan diksi sumber serta ketegangan dengan pernyataan berikutnya bahwa Yang Mahatinggi tidak tinggal di dalam rumah buatan tangan manusia.
theological_decisions:
- issue: Apakah οἶκον diterjemahkan sebagai “rumah” atau secara interpretatif sebagai “Bait Allah”
  choice: rumah
  alternative: Bait Allah
  rationale: Teks Yunani memakai istilah umum οἶκος, bukan istilah yang lebih khusus untuk bait. “Rumah” mempertahankan gema teologis dan ketegangan dalam argumentasi Stefanus, sedangkan identifikasi bangunan itu sebagai Bait Allah dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Namun” mengungkapkan kontras ringan; “sebuah rumah” sengaja dipertahankan agar dekat dengan bentuk Yunani dan tetap mudah dipahami.
