  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: id
  text: “Hai orang-orang yang tegar tengkuk dan yang tidak bersunat hati dan telinga! Kalian selalu menentang Roh Kudus, sama seperti nenek moyang kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: orang-orang yang tegar tengkuk
  rationale: Mempertahankan metafora kuat yang berlatar bahasa Kitab Suci, alih-alih meratakannya menjadi sekadar ‘keras kepala’.
- source_word: ἀπερίτμητοι
  choice: tidak bersunat
  rationale: Mempertahankan istilah harfiah yang bernuansa perjanjian dan menggemakan bahasa kenabian tentang pemberontakan batin.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: hati serta telinga
  rationale: Datif lingkup diterjemahkan secara alami dalam konstruksi Indonesia ‘tidak bersunat hati serta telinga’; keduanya menggambarkan ketidaktanggapan batin dan pendengaran.
- source_word: ἀεὶ
  choice: selalu
  rationale: Menyatakan pola perlawanan yang terus berlangsung.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Roh Kudus
  rationale: Padanan baku dalam bahasa Indonesia untuk rujukan personal ilahi dalam konteks Kisah Para Rasul.
- source_word: ἀντιπίπτετε
  choice: menentang
  rationale: Menyampaikan perlawanan aktif secara lugas dan wajar dalam bahasa Indonesia.
- source_word: οἱ πατέρες ὑμῶν
  choice: nenek moyang kalian
  rationale: Dalam konteks ini πατέρες menunjuk generasi terdahulu Israel; ‘nenek moyang’ merupakan ungkapan Indonesia yang alami dan tepat tanpa membatasi rujukan pada ayah biologis.
- source_word: ὡς ... καὶ ὑμεῖς
  choice: Sama seperti ... demikian juga kalian
  rationale: Menyatakan perbandingan eliptis Yunani secara jelas dan alami tanpa menambah isi baru.
theological_decisions:
- issue: Rujukan ‘Roh Kudus’
  choice: Roh Kudus sebagai pribadi ilahi
  alternative: roh kudus sebagai pengaruh atau sikap ilahi secara umum
  rationale: Dalam Kisah Para Rasul, frasa ini secara kontekstual merujuk kepada Roh Kudus secara personal; kapitalisasi mengikuti pemakaian Indonesia yang baku.
- issue: Gambaran penghinaan yang bernuansa perjanjian
  choice: mempertahankan metafora ‘tidak bersunat hati serta telinga’
  alternative: menafsirkannya sebagai ‘tertutup hati dan tuli’
  rationale: Metafora tersebut sengaja menggemakan bahasa kenabian dan hubungan perjanjian, sehingga tidak direduksi menjadi gambaran psikologis umum.
- issue: Istilah bagi generasi terdahulu
  choice: nenek moyang kalian
  alternative: bapa-bapa kalian
  rationale: Rujukannya adalah para pendahulu Israel. ‘Nenek moyang’ menyampaikan makna relasional-historis πατέρες dengan alami dalam bahasa Indonesia modern tanpa mengubah tuduhan teologis teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan ‘kalian’ mempertahankan bentuk jamak ὑμεῖς. Seruan pembuka mempertahankan kerasnya teguran Stefanus dan metafora alkitabiahnya.
