  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: id
  text: Nenek moyang kita tidak mau taat kepadanya, melainkan menolaknya[a] dan dalam hati mereka berbalik ke Mesir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyingkirkannya.” Kata Yunani yang digunakan dapat secara lebih harfiah menggambarkan tindakan mendorong Musa ke samping.
    reason: lexical_alternative
  - marker: b
    text: Artinya, ketika masih berada di padang gurun, dalam batin mereka ingin kembali ke Mesir.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: kepadanya
  rationale: Pronomina relatif datif tunggal ini mengacu kepada Musa pada ayat sebelumnya dan secara alami menjadi pelengkap dari 'taat' dalam bahasa Indonesia.
- source_word: οὐκ ἠθέλησαν
  choice: tidak mau
  rationale: Gabungan negasi dan θέλω menyatakan penolakan kehendak; 'tidak mau' alami, jelas, dan lebih kuat daripada sekadar 'tidak ingin'.
- source_word: ὑπήκοοι γενέσθαι
  choice: taat
  rationale: Secara harfiah berarti 'menjadi taat'. Dalam bahasa Indonesia, 'tidak mau taat' menyampaikan konstruksi itu secara wajar tanpa ungkapan kaku 'menjadi orang-orang yang taat'.
- source_word: οἱ πατέρες ἡμῶν
  choice: nenek moyang kita
  rationale: Dalam konteks pidato Stefanus, frasa ini menunjuk kepada para leluhur Israel. 'Nenek moyang kita' merupakan padanan Indonesia modern yang alami dan tidak dibatasi pada ayah biologis.
- source_word: ἀπώσαντο
  choice: menolaknya
  rationale: Verba ini dapat menggambarkan tindakan mendorong atau menyingkirkan seseorang, tetapi dalam konteks menyatakan penolakan terhadap Musa; 'menolaknya' mempertahankan daya relasionalnya.
- source_word: ἐστράφησαν
  choice: berbalik
  rationale: Verba ini menyatakan perubahan arah atau orientasi. 'Berbalik' mempertahankan gambaran geraknya tanpa secara berlebihan menjadikannya kepulangan fisik.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: dalam hati
  rationale: καρδία menunjuk kepada batin, termasuk kehendak dan kerinduan. Idiom 'dalam hati' alami dalam bahasa Indonesia dan mempertahankan kontras antara lokasi jasmani dan orientasi batin.
- source_word: εἰς Αἴγυπτον
  choice: ke Mesir
  rationale: εἰς menandai arah menuju Mesir. 'Ke Mesir' ringkas dan tepat setelah 'berbalik'.
theological_decisions:
- issue: Sifat keberbalikan Israel ke Mesir
  choice: dalam hati berbalik ke Mesir
  alternative: kembali ke Mesir dalam hati
  rationale: Frasa sumber secara eksplisit menempatkan keberbalikan itu dalam hati, sehingga menyatakan reorientasi batin terhadap Mesir tanpa meniadakan gema keinginan untuk kembali secara nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Namun' menjaga kontras ἀλλά; 'justru' menegaskan peralihan dari penolakan untuk taat kepada tindakan menolak Musa. Semua penanda catatan kaki dicantumkan dalam teks utama.
