  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: id
  text: Kemah Kesaksian[a] berada bersama nenek moyang kita[b] di padang gurun, sama seperti Dia yang berbicara kepada Musa[c] memerintahkan Musa untuk membuatnya menurut pola yang telah Musa lihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tabernakel Kesaksian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapa-bapa kita.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Yunani tidak menyebutkan nama pembicara itu; dapat juga diterjemahkan “Dia yang telah berbicara kepada Musa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: Kemah Kesaksian
  rationale: “Kemah” menyampaikan arti dasar σκηνή secara wajar dan tetap cocok bagi tempat suci portabel; “Kesaksian” mempertahankan istilah khusus dalam konstruksi genitif τοῦ μαρτυρίου.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: bersama nenek moyang kita
  rationale: Dativus diterjemahkan secara idiomatis dengan “bersama”; “nenek moyang” adalah ungkapan Indonesia yang alami untuk para leluhur Israel dan tidak menyiratkan hanya ayah biologis.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Padanan geografis-biblis yang lazim dan jelas bagi ἐρήμῳ.
- source_word: καθὼς διετάξατο
  choice: sebagaimana yang diperintahkan
  rationale: Menunjukkan kesesuaian dengan pengarahan yang berwibawa; bentuk pasif bahasa Indonesia membuat kalimat alami tanpa mengubah pelaku yang tetap dinyatakan sesudahnya.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: Dia yang berbicara kepada Musa
  rationale: Mempertahankan ungkapan partisipial dan tidak menambahkan nama “Allah” atau “Tuhan” yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ποιῆσαι αὐτὴν
  choice: Kemah itu dibuat
  rationale: Merestrukturisasi infinitif Yunani menjadi pasif Indonesia yang alami; objek pronominal diperjelas sebagai “Kemah itu” tanpa menambah informasi baru.
- source_word: κατὰ τὸν τύπον
  choice: menurut pola
  rationale: “Pola” menyampaikan gagasan model atau rancangan yang diperlihatkan kepada Musa dalam konteks pembangunan kemah suci.
- source_word: ὃν ἑωράκει
  choice: yang telah dilihat Musa
  rationale: “Telah dilihat” menandai tindakan yang mendahului pembuatan; nama Musa diulang untuk menghindari ambiguitas pronomina yang tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas ὁ λαλῶν τῷ Μωϋσῇ
  choice: Dia yang berbicara kepada Musa
  alternative: Allah yang berbicara kepada Musa / Tuhan yang berbicara kepada Musa
  rationale: Referennya secara kontekstual ilahi, tetapi teks Yunani tidak menyebut nama atau gelar. Terjemahan mempertahankan keimplisitan itu.
- issue: Makna σκηνὴ τοῦ μαρτυρίου
  choice: Kemah Kesaksian
  alternative: Kemah Suci Kesaksian / tabernakel kesaksian
  rationale: Pilihan ini mempertahankan hubungan dengan “kesaksian” tanpa menambahkan “suci” yang tidak terdapat dalam frasa Yunani atau memakai istilah serapan gerejawi yang kurang transparan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kemah” dipilih daripada “tabernakel” agar mudah dipahami. Huruf kapital pada “Dia” menandai rujukan ilahi yang jelas dari konteks tanpa mengganti ungkapan implisit Yunani dengan nama atau gelar tertentu.
