- from: Kemah Kesaksian ada bersama nenek moyang kita di padang gurun[a]. Kemah itu dibuat sebagaimana yang diperintahkan oleh Dia yang berbicara kepada Musa, yaitu menurut pola yang telah dilihat Musa[b].
  to: Kemah Kesaksian[a] berada bersama nenek moyang kita[b] di padang gurun, sama seperti Dia yang berbicara kepada Musa[c] memerintahkan Musa untuk membuatnya menurut pola yang telah Musa lihat.
  rationale: 'Revisi mempertahankan urutan dan hubungan sintaksis sumber: kemah itu bersama nenek moyang di padang gurun; sosok yang berbicara kepada Musa memerintahkan Musa membuatnya; dan Musa sebelumnya melihat pola itu. Catatan kaki yang lama direvisi agar tidak menambahkan “suci” dan agar jangkar catatan melekat pada istilah yang dijelaskan.'
