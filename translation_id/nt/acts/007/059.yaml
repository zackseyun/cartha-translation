id: ACT.7.59
reference: Acts 7:59
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: id
  text: Mereka terus melempari Stefanus dengan batu sementara ia berseru dan berkata,[a] “Tuhan Yesus, terimalah rohku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sementara ia memohon kepada-Nya dengan berkata.” Kata Yunani yang dipakai dapat secara lebih khusus berarti memanggil atau memohon dalam doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: terus melempari ... dengan batu
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; ungkapan ini menyampaikan aspek duratif secara alami dalam bahasa Indonesia.
- source_word: ἐπικαλούμενον
  choice: sementara ia berseru
  rationale: Partisip ini menunjuk pada seruan atau permohonan Stefanus kepada Yesus. 'Berseru' alami dan tetap membuka nuansa memanggil atau memohon dalam doa.
- source_word: λέγοντα
  choice: dan berkata
  rationale: Menerjemahkan partisip yang dikoordinasikan dengan ἐπικαλούμενον dan memperkenalkan isi ucapan secara jelas.
- source_word: Κύριε Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Sapaan langsung ini mempertahankan penghormatan dan bobot kristologis teks tanpa menambahkan penafsiran.
- source_word: δέξαι
  choice: terimalah
  rationale: Imperatif dalam konteks permohonan ini paling tepat diterjemahkan dengan bentuk sopan dan khidmat 'terimalah'.
- source_word: τὸ πνεῦμά μου
  choice: rohku
  rationale: Padanan langsung dan lazim bagi roh Stefanus yang dipercayakannya menjelang kematian.
theological_decisions:
- issue: Apakah seruan Stefanus kepada Yesus perlu tampak sebagai doa atau invokasi
  choice: Mempertahankan sapaan langsung 'Tuhan Yesus' dan menerjemahkan ἐπικαλούμενον sebagai 'berseru'
  alternative: “memanggil nama-Nya” atau “memohon kepada-Nya”
  rationale: Teks Yunani dengan jelas menampilkan Stefanus berbicara kepada Yesus. 'Berseru' tidak mengaburkan hal itu, tetapi juga tidak mempersempit cakupan leksikal partisip tersebut secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan tindakan dalam bentuk imperfek dinyatakan dengan 'terus', sedangkan susunan seruan langsung dipertahankan.
