  source_fidelity: Teks Indonesia secara akurat menyampaikan tindakan pelemparan batu yang berlangsung (imperfek ἐλιθοβόλουν), seruan Stefanus, sapaan langsung kepada Yesus, serta permohonan agar rohnya diterima. Frasa “terus melempari Stefanus dengan batu” wajar untuk aspek duratif; “berseru dan berkata” mempertahankan dua partisip yang terkoordinasi tanpa mengubah isi.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat. Susunan “sementara ia berseru dan berkata” sedikit formal, tetapi tetap alami dan sesuai register naratif kitab suci.
