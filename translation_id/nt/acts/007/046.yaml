  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: id
  text: Ia mendapat perkenanan di hadapan Allah dan memohon agar dapat memperoleh tempat kediaman bagi Allah Yakub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah kemah suci bagi Allah Yakub.”
    reason: Alternatif leksikal untuk σκήνωμα, yang dapat menunjuk pada kemah atau tempat kediaman.
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: mendapat perkenanan
  rationale: Ungkapan idiomatis ini berarti memperoleh perkenanan seseorang, bukan menemukan anugerah sebagai sesuatu yang abstrak. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna relasionalnya.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Frasa ini menyatakan berada di hadapan atau dalam pandangan Allah; terjemahan ini ringkas, wajar, dan dekat dengan bentuk Yunani.
- source_word: ᾐτήσατο
  choice: memohon
  rationale: Bentuk medialnya menyatakan pengajuan permintaan. 'Memohon' sesuai dengan permintaan Daud kepada Allah tanpa memberi kesan formal yang berlebihan.
- source_word: εὑρεῖν
  choice: dapat menemukan
  rationale: Infinitif ini secara harfiah berarti 'menemukan'. Walaupun konteks dapat menyiratkan memperoleh atau menyediakan, pilihan ini mempertahankan ungkapan sumber dan kaitannya dengan Mazmur 132:5.
- source_word: σκήνωμα
  choice: tempat kediaman
  rationale: Kata ini menunjuk pada tempat tinggal atau kediaman dan tidak harus menjadi istilah teknis bagi Kemah Suci. Pilihan yang luas ini tidak menentukan jenis bangunan sebelum ayat berikutnya menyebut rumah yang dibangun Salomo.
- source_word: τῷ θεῷ Ἰακώβ
  choice: bagi Allah Yakub
  rationale: Bentuk datif wajar diterjemahkan dengan 'bagi', sedangkan konstruksi genetif mempertahankan sebutan perjanjian 'Allah Yakub'.
theological_decisions:
- issue: Jenis bangunan yang dimohonkan Daud dalam ringkasan sejarah Israel oleh Stefanus
  choice: tempat kediaman
  alternative: kemah suci; rumah
  rationale: 'σκήνωμα lebih luas daripada istilah teknis untuk bait atau rumah. Terjemahan ini mempertahankan ketegangan naratif: Daud menginginkan suatu kediaman bagi Allah, lalu Salomo membangun rumah pada ayat berikutnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Susunan kalimat mempertahankan alur Yunani tanpa menjadikannya kaku; 'Ia' merujuk kepada Daud dari konteks sebelumnya.
