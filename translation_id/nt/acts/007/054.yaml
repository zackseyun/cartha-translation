  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: id
  text: Ketika mendengar perkataan itu, hati mereka tersayat[a], dan mereka mengertakkan gigi terhadap Stefanus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, "mereka sangat marah dalam hati." Kata Yunani ini secara harfiah memakai gambaran "digergaji" atau "terbelah" di dalam hati, yang menyatakan gejolak batin yang hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Ketika mendengar perkataan-perkataan itu
  rationale: Partisipium memberi latar waktu bagi verba utama, sedangkan δέ menandai perkembangan narasi tanpa perlu diterjemahkan secara tersendiri. ταῦτα merujuk pada perkataan Stefanus sebelumnya; 'perkataan-perkataan itu' lebih jelas dan alami daripada 'hal-hal ini' dalam konteks pidato.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: hati mereka seperti disayat
  rationale: Ungkapan ini mempertahankan gambaran harfiah verba 'digergaji/dibelah tembus' sambil menyampaikan gejolak batin yang hebat dalam bahasa Indonesia yang alami. Kata 'seperti' menandai sifat metaforisnya tanpa mereduksinya menjadi sekadar 'marah'.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: mereka mengertakkan gigi
  rationale: Ungkapan Indonesia yang lazim dan hidup untuk tindakan menggesekkan atau mengatupkan gigi sebagai tanda kemarahan.
- source_word: ἐπ’ αὐτόν
  choice: terhadap Stefanus
  rationale: Preposisi menunjukkan arah permusuhan. Nama Stefanus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia; identitasnya jelas dari konteks.
