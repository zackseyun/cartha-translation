id: ACT.7.55
reference: Acts 7:55
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: id
  text: Namun, ia, yang penuh dengan Roh Kudus, menatap ke surga[a] dan melihat kemuliaan Allah serta Yesus berdiri di sebelah kanan Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: memandang dengan sungguh-sungguh ke surga.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di sebelah kanan Allah” adalah idiom Alkitab untuk tempat kehormatan dan wewenang tertinggi.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: yang ...
  rationale: Partisipel kini ini menyatakan keadaan yang sedang berlangsung dan secara alami dihubungkan dengan subjek melalui klausa relatif dalam bahasa Indonesia.
- source_word: πλήρης πνεύματος ἁγίου
  choice: penuh dengan Roh Kudus
  rationale: Ungkapan ini mempertahankan idiom Lukas tentang seseorang yang dikuasai atau dipenuhi Roh Kudus tanpa mengubahnya menjadi sifat atau kekuatan impersonal.
- source_word: ἀτενίσας
  choice: menatap
  rationale: Kata ini menyatakan pandangan yang terarah dan sungguh-sungguh; 'menatap' ringkas, alami, dan lebih kuat daripada sekadar 'melihat'.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: Dalam konteks penglihatan ini, οὐρανός menunjuk pada surga, bukan hanya langit yang tampak.
- source_word: εἶδεν
  choice: melihat
  rationale: Padanan langsung dan wajar untuk verba utama yang menyatakan apa yang disaksikan Stefanus.
- source_word: δόξαν θεοῦ
  choice: kemuliaan Allah
  rationale: Bentuk ini transparan dan mempertahankan gagasan tentang penampakan keagungan Allah.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: ἑστῶτα
  choice: berdiri
  rationale: Mempertahankan gambaran jelas tentang postur Yesus dalam penglihatan itu tanpa menambahkan alasan teologis bagi postur tersebut.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ini adalah padanan idiomatis bahasa Indonesia yang mempertahankan citra kedudukan di sisi kanan Allah.
- source_word: δέ
  choice: Namun
  rationale: Menandai kontras ringan antara keadaan Stefanus dan permusuhan orang banyak dalam konteks sebelumnya.
theological_decisions:
- issue: πνεύματος ἁγίου sebagai rujukan ilahi personal
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Pemakaian dalam Lukas-Kisah Para Rasul dan konteks langsung menunjuk kepada Roh Kudus, bukan sekadar sikap suci atau daya impersonal.
- issue: Yesus berdiri di sebelah kanan Allah
  choice: mempertahankan pembedaan antara Allah dan Yesus serta citra kedudukan di sebelah kanan
  alternative: memparafrasakan sebagai Yesus berada pada kedudukan tertinggi
  rationale: Teks membedakan Allah dan Yesus sekaligus menggambarkan pengangkatan Yesus. Idiom tersebut dipertahankan agar muatan citra alkitabiahnya tidak dipersempit, sedangkan maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur klausa relatif mempertahankan keadaan Stefanus sebagai latar bagi tindakan melihat, sementara pilihan 'menatap' menjaga intensitas verba Yunani.
