  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: id
  text: Kalianlah yang telah menerima hukum Taurat dengan perantaraan para malaikat[a], tetapi tidak menaatinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut pengaturan para malaikat” atau “atas pengarahan para malaikat.” Frasa Yunaninya sulit, tetapi mengacu pada hukum Taurat yang diberikan dengan keterlibatan para malaikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Kalianlah yang
  rationale: Kata ganti relatif ini bersifat kualitatif dan, bersama bentuk verba orang kedua jamak, menyampaikan sapaan langsung serta tuduhan yang tegas kepada para pendengar Stefanus.
- source_word: ἐλάβετε
  choice: telah menerima
  rationale: Bentuk aoris aktif orang kedua jamak dari λαμβάνω. 'Menerima' wajar untuk penerimaan hukum Taurat dan tidak menyiratkan penerimaan sukarela melebihi teks.
- source_word: τὸν νόμον
  choice: hukum Taurat
  rationale: νόμος di sini menunjuk pada hukum Musa. 'Hukum Taurat' jelas bagi pembaca Indonesia dan membedakannya dari hukum secara umum tanpa menambahkan isi doktrinal.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: dengan perantaraan para malaikat
  rationale: Frasa Yunani ini sulit dan dapat berkaitan dengan pengaturan, ketetapan, atau pengarahan para malaikat. Pilihan ini menyampaikan inti konteks, yakni keterlibatan malaikat dalam pemberian hukum Taurat, tanpa menentukan secara berlebihan mekanismenya.
- source_word: ἀγγέλων
  choice: para malaikat
  rationale: Dalam konteks pemberian hukum Taurat, yang dimaksud adalah makhluk surgawi, bukan utusan manusia.
- source_word: οὐκ ἐφυλάξατε
  choice: tetapi tidak menaatinya
  rationale: φυλάσσω dalam hubungan dengan hukum berarti memelihara atau menjalankannya. 'Menaatinya' merupakan ungkapan Indonesia yang alami dan jelas; pronomina '-nya' menyatakan objek yang tersirat, yaitu hukum Taurat.
theological_decisions:
- issue: Makna frasa perantaraan malaikat, εἰς διαταγὰς ἀγγέλων
  choice: Hukum Taurat diterima dengan keterlibatan atau perantaraan para malaikat.
  alternative: Hukum Taurat diterima 'menurut pengaturan para malaikat' atau 'atas pengarahan para malaikat.'
  rationale: Teks mengacu pada keterlibatan malaikat dalam pemberian hukum Taurat, tetapi nuansa tepat διαταγαί dan konstruksi dengan εἰς diperdebatkan. Terjemahan utama mempertahankan pokok pernyataan tanpa merinci mekanisme mediasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalianlah' mempertahankan sapaan orang kedua jamak sekaligus tekanan tuduhan. 'Hukum Taurat' dipilih agar rujukan kepada hukum Musa jelas. Tanda petik penutup mencerminkan bahwa ayat ini merupakan akhir ucapan langsung Stefanus dalam konteks yang lebih luas.
