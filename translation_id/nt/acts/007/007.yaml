  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: id
  text: ‘Dan bangsa yang akan mereka layani sebagai budak itu akan Kuhakimi,’ Allah berfirman, ‘dan sesudah itu mereka akan keluar dan beribadah kepada-Ku di tempat ini.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνος
  choice: bangsa
  rationale: Dalam konteks ini kata tersebut menunjuk kepada bangsa yang memperbudak keturunan Abraham, yakni Mesir, sesuai gema Kejadian 15:14.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: yang mereka layani sebagai budak
  rationale: δουλεύω berarti melayani dalam kedudukan sebagai budak. Ungkapan ini mempertahankan bentuk verbal sumber sekaligus menyampaikan dengan wajar bahwa pelayanan tersebut merupakan perbudakan, bukan pengabdian sukarela.
- source_word: κρινῶ ἐγώ
  choice: akan Kuhakimi
  rationale: κρίνω di sini menyatakan tindakan Allah menjatuhkan penghakiman. Bentuk dengan -Ku juga mencerminkan penekanan pada ἐγώ.
- source_word: ὁ θεὸς εἶπεν
  choice: firman Allah
  rationale: Sebagai sisipan atribusi dalam perkataan ilahi, 'firman Allah' alami dan bermartabat dalam bahasa Indonesia serta mempertahankan subjek eksplisit.
- source_word: μετὰ ταῦτα
  choice: sesudah itu
  rationale: Ungkapan ini menyatakan urutan waktu; 'sesudah itu' lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'sesudah hal-hal ini'.
- source_word: ἐξελεύσονται
  choice: mereka akan keluar
  rationale: Kata kerja ini menunjuk kepada keluarnya keturunan Abraham dari bangsa yang memperbudak mereka dan mempertahankan gema peristiwa eksodus.
- source_word: λατρεύσουσίν μοι
  choice: beribadah kepada-Ku
  rationale: λατρεύω ketika diarahkan kepada Allah menyatakan pelayanan religius atau ibadah, bukan pekerjaan biasa. 'Beribadah kepada-Ku' menyampaikan nuansa tersebut secara jelas.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: di tempat ini
  rationale: Terjemahan langsung dan alami untuk frasa penunjuk tempat tersebut tanpa menentukan lebih jauh cakupan geografisnya.
theological_decisions:
- issue: Makna δουλεύω dalam konteks perbudakan
  choice: yang mereka layani sebagai budak
  alternative: yang mereka layani; yang memperbudak mereka
  rationale: Konteksnya jelas mengenai perbudakan di Mesir. Pilihan ini mempertahankan gagasan verbal 'melayani' sambil menjelaskan status terpaksa yang terkandung dalam δουλεύω, tanpa mengubah konstruksi menjadi kalimat aktif oleh bangsa itu.
- issue: Makna λατρεύω yang ditujukan kepada Allah
  choice: beribadah kepada-Ku
  alternative: melayani Aku
  rationale: Kata ini menunjuk pada pelayanan religius kepada Allah. 'Beribadah' membedakannya dari δουλεύω sebelumnya dan menyampaikan daya kultisnya tanpa menambahkan rincian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Tanda petik dan sisipan 'firman Allah' menata pergantian antara kutipan ilahi dan atribusi secara jelas. Tidak diperlukan catatan kaki karena nuansa perbudakan telah dinyatakan secara alami dalam teks utama.
