review_pass:
  verdict: revise
  source_fidelity: Perlu revisi kecil. Konjungsi καί berarti “dan,” bukan “namun”; tidak ada kontras eksplisit dalam teks Yunani yang membenarkan “Namun.” Bentuk masa depan dalam ᾧ ἐὰν δουλεύσουσιν juga lebih jelas bila dinyatakan dengan “akan mereka layani.” Selebihnya, “sebagai budak,” “akan Kuhakimi,” “beribadah kepada-Ku,” dan “di tempat ini” menyampaikan makna sumber dengan baik.
  naturalness: Teksnya pada umumnya baku, jelas, dan bernada sesuai untuk kutipan ilahi. “Allah berfirman” lebih alami dalam bahasa Indonesia modern daripada sisipan nominal “firman Allah,” sambil tetap mempertahankan atribusi ὁ θεὸς εἶπεν.
  terminology: “Bangsa” tepat untuk ἔθνος. “Melayani sebagai budak” secara wajar mengomunikasikan δουλεύω dalam konteks perbudakan tanpa mengubahnya menjadi verba aktif “memperbudak.” “Beribadah kepada-Ku” tepat untuk λατρεύω dalam konteks pelayanan religius.
  issues:
  - severity: medium
    issue: “Namun” menerjemahkan καί secara adversatif.
    rationale: Teks Yunani hanya memakai καί (“dan”) pada awal ayat. Kontras “namun” menambahkan hubungan logis yang tidak dinyatakan sumber.
  - severity: low
    issue: Unsur futuritas dalam “yang mereka layani” kurang eksplisit.
    rationale: Konstruksi ᾧ ἐὰν δουλεύσουσιν berpandangan ke masa depan dalam kutipan ini. “Yang akan mereka layani” menyatakannya dengan lebih tepat dan tetap alami.
  revised_text: ‘Dan bangsa yang akan mereka layani sebagai budak itu akan Kuhakimi,’ Allah berfirman, ‘dan sesudah itu mereka akan keluar dan beribadah kepada-Ku di tempat ini.’
