  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: id
  text: 'Namun, Allah berfirman demikian: keturunannya akan menjadi pendatang di negeri asing,[a] dan mereka akan diperbudak serta ditindas selama empat ratus tahun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Yunani memakai bentuk tunggal kolektif: “keturunannya akan menjadi pendatang ... dan [mereka] akan memperbudaknya serta menindasnya.” Bentuk tunggal itu merujuk kepada seluruh keturunannya sebagai satu kelompok.'
    reason: Menjelaskan bentuk tunggal kolektif σπέρμα ... αὐτό, sementara teks utama memakai bentuk jamak yang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Namun, Allah berfirman demikian
  rationale: δέ menyatakan perkembangan dengan nuansa kontras ringan; οὕτως dipertahankan secara eksplisit. Dalam konteks perkataan ilahi, 'berfirman' merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: ἔσται τὸ σπέρμα αὐτοῦ
  choice: keturunannya akan menjadi
  rationale: σπέρμα adalah bentuk tunggal kolektif yang menunjuk kepada keturunan Abraham. Bahasa Indonesia dapat memakai 'keturunan' sebagai nomina kolektif tanpa bentuk jamak eksplisit; bentuk futurum diterjemahkan langsung dengan 'akan'.
- source_word: πάροικον
  choice: pendatang
  rationale: Menunjukkan orang yang tinggal di wilayah yang bukan negerinya sendiri dan tidak memiliki kedudukan sebagai penduduk asli; 'pendatang' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: di negeri milik bangsa lain
  rationale: ἀλλότριος secara mendasar berarti milik pihak lain atau asing. Pilihan ini mempertahankan gagasan bahwa negeri tersebut bukan milik keturunan Abraham, tanpa memakai frasa 'negeri asing' yang dapat sekadar menyatakan lokasi di luar negeri.
- source_word: δουλώσουσιν αὐτὸ
  choice: bangsa itu akan memperbudak ... mereka
  rationale: δουλόω diterjemahkan tegas sebagai 'memperbudak'. Subjek tersirat dijernihkan sebagai 'bangsa itu' sesuai rujukan jamak tak tentu dalam konteks kutipan, sedangkan αὐτό merujuk pada kolektif 'keturunan' dan secara alami dinyatakan dengan 'mereka' dalam bahasa Indonesia.
- source_word: κακώσουσιν
  choice: menindas
  rationale: Dalam konteks perbudakan dan penderitaan suatu bangsa, 'menindas' menyampaikan perlakuan buruk yang berat dengan tepat dan alami.
- source_word: ἔτη τετρακόσια
  choice: selama empat ratus tahun
  rationale: '''Selama'' secara idiomatis menandai rentang waktu yang dinyatakan oleh akusatif durasi Yunani.'
theological_decisions:
- issue: Bentuk tunggal kolektif untuk keturunan Abraham
  choice: Memakai nomina kolektif 'keturunan', lalu pronomina alami 'mereka'
  alternative: 'Mempertahankan kesepadanan gramatikal yang kaku: ''keturunannya ... memperbudaknya dan menindasnya'''
  rationale: Bahasa Yunani memakai σπέρμα dan αὐτό dalam bentuk tunggal, tetapi rujukannya adalah banyak keturunan sebagai satu kelompok. 'Keturunan ... mereka' mempertahankan makna kolektif tanpa menghasilkan pronomina Indonesia yang dapat disalahpahami sebagai satu orang; ciri bentuk tunggal sumber dijelaskan dalam catatan kaki.
- issue: Identitas pelaku perbudakan
  choice: Menyebutnya secara umum sebagai 'bangsa itu'
  alternative: Menentukan pelakunya sebagai 'orang Mesir'
  rationale: Teks Yunani hanya memakai verba orang ketiga jamak tanpa menyebut Mesir. Terjemahan tidak memasukkan identifikasi yang hanya diperoleh dari konteks sejarah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengantar ilahi dan isi nubuat, tetapi menghindari pronomina tunggal yang janggal bagi kelompok manusia. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
