id: ACT.7.20
reference: Acts 7:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: id
  text: Pada waktu itu Musa lahir, dan ia elok di mata Allah.[a] Ia diasuh selama tiga bulan di rumah ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “elok bagi Allah.” Kata Yunani yang dipakai dapat berarti “elok,” “rupawan,” atau “menarik,” dan rujukan kepada Allah dinyatakan secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Pada waktu itu
  rationale: Ungkapan temporal idiomatis dalam bahasa Indonesia yang mempertahankan rujukan pada masa yang sedang dibicarakan.
- source_word: ἐγεννήθη
  choice: lahir
  rationale: Dalam konteks kelahiran, bentuk pasif Yunani ini secara alami diterjemahkan dengan verba intransitif Indonesia 'lahir'.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἀστεῖος τῷ θεῷ
  choice: elok di mata Allah
  rationale: '''Elok'' mempertahankan makna keindahan atau keelokan tanpa membatasinya secara tegas pada ketampanan fisik, sedangkan ''di mata Allah'' menyatakan penilaian yang merujuk kepada Allah secara alami dalam bahasa Indonesia.'
- source_word: ὃς ἀνετράφη
  choice: Ia diasuh
  rationale: Memulai kalimat baru dengan 'Ia' menghasilkan bahasa Indonesia yang wajar; 'diasuh' menyampaikan makna dibesarkan atau dirawat dalam lingkungan rumah tangga.
- source_word: μῆνας τρεῖς
  choice: selama tiga bulan
  rationale: '''Selama'' menyatakan durasi secara jelas dan alami.'
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: di rumah ayahnya
  rationale: Terjemahan alami yang mempertahankan arti rumah atau lingkungan keluarga sang ayah.
theological_decisions:
- issue: Makna ἀστεῖος τῷ θεῷ
  choice: elok di mata Allah
  alternative: elok bagi Allah; sangat elok; seorang anak yang elok
  rationale: Rujukan eksplisit kepada Allah dipertahankan sebagai sudut penilaian, tetapi ungkapan ini tidak diperkuat menjadi klaim teologis bahwa Musa dipilih, saleh, atau istimewa dalam arti tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Elok di mata Allah' dipilih agar terdengar alami sekaligus mempertahankan ketegangan antara penampilan atau kualitas Musa dan penilaian Allah.
