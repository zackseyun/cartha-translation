id: ACT.7.56
reference: Acts 7:56
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: id
  text: Lalu ia berkata, “Lihatlah, aku melihat langit terbuka[a] dan Anak Manusia[b] berdiri di sebelah kanan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai partisipel pasif perfek: langit telah dibuka dan berada dalam keadaan terbuka dalam penglihatan Stefanus.'
    reason: lexical_alternative
  - marker: b
    text: “Anak Manusia” adalah gelar mesianik yang dikenal dan menggemakan Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian pendengar kepada penglihatan Stefanus. “Lihatlah” alami dalam bahasa Indonesia, tetap lugas, dan mempertahankan daya serunya.
- source_word: θεωρῶ
  choice: aku melihat
  rationale: Bentuk kini menggambarkan penglihatan yang sedang berlangsung. “Aku melihat” merupakan padanan modern yang alami tanpa mengurangi sifat visionernya.
- source_word: τοὺς οὐρανοὺς
  choice: langit
  rationale: Bahasa Yunani memakai bentuk jamak, tetapi bahasa Indonesia lazim memakai “langit” sebagai nomina kolektif dalam konteks ini. “Langit-langit” tidak dipakai karena dalam bahasa Indonesia berarti plafon.
- source_word: διηνοιγμένους
  choice: terbuka
  rationale: Partisipel pasif perfek menyatakan keadaan yang terjadi sebagai hasil dari tindakan pembukaan. “Terbuka” menyampaikan keadaan hasil tersebut secara alami; nuansa aspek dijelaskan dalam catatan kaki.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan harfiah tradisional ini mempertahankan gelar kristologis yang dikenal serta gaungnya dengan Daniel 7:13.
- source_word: ἐκ δεξιῶν
  choice: di sebelah kanan
  rationale: Ungkapan ini merupakan padanan Indonesia yang wajar bagi tempat kehormatan dan kewenangan di sisi kanan Allah, tanpa menambahkan penafsiran.
- source_word: ἑστῶτα
  choice: berdiri
  rationale: Kata ini secara jelas menyatakan sikap berdiri. Terjemahan mempertahankannya dan tidak menyelaraskannya dengan ayat-ayat lain yang menggambarkan Kristus duduk.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi genitif ini secara alami menjadi “di sebelah kanan Allah” dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar kristologis υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk sumber dan merupakan gelar mesianik yang telah dikenal, sekaligus menjaga kaitannya dengan Daniel 7:13. “Sang Manusia” lebih interpretatif dan mengaburkan kaitan verbal tersebut.
- issue: Sikap Yesus yang dimuliakan
  choice: berdiri di sebelah kanan Allah
  alternative: berada di sebelah kanan Allah
  rationale: Teks secara khusus menyatakan bahwa Anak Manusia berdiri. Pilihan ini mempertahankan ketegangan dengan bagian-bagian lain yang menyebut-Nya duduk dan tidak menghapus rincian teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kata ganti “ia” dan “aku” mengikuti penceritaan serta ucapan langsung secara alami. Istilah “Anak Manusia” dan ungkapan “di sebelah kanan Allah” dipertahankan karena bobot intertekstual dan teologisnya.
