  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: id
  text: Tetapi, ketika waktu janji yang telah Allah janjikan kepada Abraham[a] semakin dekat, bangsa itu makin bertambah banyak dan berlipat ganda di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janji yang telah Allah nyatakan kepada Abraham” atau “janji yang telah Allah ikrarkan kepada Abraham.” Kata Yunani di sini dapat menunjuk pada komitmen yang dinyatakan; “Allah janjikan” dipakai karena alami dalam bahasa Indonesia dan tidak menambahkan nuansa sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Namun, ketika
  rationale: Καθώς memperkenalkan hubungan waktu, sedangkan δέ menandai peralihan ringan. “Namun, ketika” alami dalam bahasa Indonesia dan tidak membuat pertentangannya terlalu kuat.
- source_word: ἤγγιζεν
  choice: semakin dekat
  rationale: Bentuk imperfek menggambarkan proses mendekat yang sedang berlangsung; “semakin dekat” menyampaikan aspek progresif itu secara alami.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: waktu bagi janji
  rationale: χρόνος berarti “waktu” secara umum, bukan secara eksplisit “waktu yang ditetapkan.” Ungkapan “waktu bagi janji” mempertahankan hubungan genitif tanpa menambahkan kata “penggenapan,” meskipun penggenapan janji tersirat dalam konteks.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: yang telah Allah ikrarkan kepada Abraham
  rationale: Dalam konteks janji dengan penerima dalam bentuk datif, ὁμολογέω menunjuk pada komitmen yang dinyatakan. “Ikrarkan” menyampaikan nuansa pernyataan komitmen tanpa memperkuatnya menjadi sumpah.
- source_word: ηὔξησεν ὁ λαὸς
  choice: bangsa itu bertambah besar
  rationale: λαός menunjuk kepada umat Israel sebagai suatu bangsa. “Bertambah besar” menyatakan pertumbuhan kolektif dan tetap dapat dibedakan dari kata kerja berikutnya.
- source_word: καὶ ἐπληθύνθη
  choice: dan berlipat ganda
  rationale: Ungkapan ini mempertahankan pembedaan leksikal dari ηὔξησεν dan menyampaikan pertambahan jumlah secara jelas.
- source_word: ἐν Αἰγύπτῳ
  choice: di Mesir
  rationale: Ini adalah frasa lokatif langsung; “Mesir” merupakan bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ὡμολόγησεν sehubungan dengan janji Allah kepada Abraham
  choice: diikrarkan
  alternative: dijanjikan; dinyatakan; disumpahkan
  rationale: “Diikrarkan” menyampaikan suatu komitmen yang dinyatakan dan cocok dengan objek “janji.” Pilihan ini tidak mengimpor nuansa sumpah yang lebih kuat, tetapi tetap mempertahankan penekanan pada kepastian komitmen Allah.
- issue: Hubungan “waktu” dengan “janji”
  choice: waktu bagi janji
  alternative: waktu penggenapan janji
  rationale: Konteks mengarah kepada penggenapan janji, tetapi kata “penggenapan” tidak muncul secara eksplisit dalam teks Yunani. Terjemahan utama mempertahankan ungkapan yang lebih terbuka agar tidak diam-diam menyelesaikan implikasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan perkembangan waktu, pembedaan kedua kata kerja pertumbuhan, dan ambiguitas terbatas dalam ungkapan “waktu bagi janji.”
