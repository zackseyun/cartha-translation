id: ACT.7.4
reference: Acts 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: id
  text: Kemudian, setelah keluar dari negeri orang Kasdim, Abraham menetap di Haran. Dari sana, setelah ayahnya meninggal, Allah memindahkannya ke negeri ini, tempat kalian sekarang tinggal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani tidak menyebutkan subjek kata “memindahkannya” secara tersurat, tetapi konteks menunjuk kepada Allah. Stefanus menyatakan bahwa perpindahan ini terjadi setelah ayah Abraham meninggal. Bandingkan Kejadian 11:32; 12:4.
    reason: Menjaga ambiguitas gramatikal mengenai subjek sekaligus mencatat ketegangan kronologis yang relevan tanpa menyelesaikannya di dalam terjemahan.
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan waktu dalam penuturan Stefanus secara alami dan jelas.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: setelah keluar dari negeri orang Kasdim
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama; frasa lengkap γῆς Χαλδαίων dipertahankan sebagai 'negeri orang Kasdim'.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: Abraham menetap di Haran
  rationale: κατοικέω dalam konteks ini menyatakan tinggal dengan menetap. Nama Abraham disebut agar subjek tetap jelas dalam bahasa Indonesia, meskipun bahasa Yunani hanya menandainya melalui verba.
- source_word: κἀκεῖθεν
  choice: Dari sana
  rationale: Menyampaikan perpindahan dari Haran dan hubungan naratif; unsur καί tidak perlu diterjemahkan sebagai 'dan' agar alur Indonesia tetap alami.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: setelah ayahnya meninggal
  rationale: Konstruksi infinitif artikular dengan μετά menyatakan urutan waktu secara tegas.
- source_word: μετῴκισεν αὐτὸν
  choice: Allah memindahkannya
  rationale: μετοικίζω bersifat kausatif, yaitu menyebabkan seseorang pindah. Subjek tidak dinyatakan secara eksplisit dalam klausa Yunani, tetapi konteks sebelumnya menunjuk kepada Allah; nama Allah ditambahkan demi kejelasan bahasa sasaran dan ketidaktersuratannya dicatat dalam catatan kaki.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: ke negeri ini, tempat kalian sekarang tinggal
  rationale: Menyampaikan arah perpindahan dan klausa relatif secara idiomatis. 'Kalian' mempertahankan bentuk jamak ὑμεῖς.
theological_decisions:
- issue: Subjek μετῴκισεν tidak dinyatakan secara eksplisit
  choice: Menyebut 'Allah' dalam teks utama serta menjelaskan ketidaktersuratannya dalam catatan kaki
  alternative: Menerjemahkan secara harfiah 'ia memindahkannya', yang ambigu dalam bahasa Indonesia
  rationale: Konteks wacana menunjuk kepada Allah sebagai pelaku, tetapi catatan kaki mempertahankan kesadaran bahwa kata 'Allah' tidak tertulis dalam klausa Yunani ini.
- issue: Urutan perpindahan Abraham sesudah kematian ayahnya
  choice: Menerjemahkan urutan sebagaimana dinyatakan dalam Kisah Para Rasul
  alternative: Mengubah atau melonggarkan urutan untuk menyelaraskannya dengan pembacaan tertentu atas Kejadian 11:32 dan 12:4
  rationale: Terjemahan tidak boleh menghapus ketegangan kronologis yang terdapat dalam teks; catatan kaki menunjukkan ayat pembanding tanpa memaksakan harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang Kasdim' mengikuti sebutan etnis yang lazim dalam Alkitab Indonesia; 'menetap' lebih alami daripada bentuk arkais; 'kalian' dipakai untuk menandai orang kedua jamak dengan jelas.
