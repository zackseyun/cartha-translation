  source_fidelity: 'Makna pokok dipertahankan dengan baik: Petrus akan berbicara/menyampaikan perkataan kepada Kornelius, dan perkataan itu menjadi sarana keselamatan bagi dia serta seisi rumah tangganya. Namun, reduplikasi “perkataan-perkataan” dan bentuk “yang olehnya” tidak alami dalam bahasa Indonesia modern.'
