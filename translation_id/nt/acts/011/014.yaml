  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: id
  text: Ia akan menyampaikan perkataan kepadamu; melalui perkataan itu engkau dan seisi rumahmu akan diselamatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam perkataan itu”; ungkapan Yunani dapat berarti “di dalamnya” atau “melaluinya” dan menunjukkan bahwa perkataan itu merupakan sarana keselamatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ia
  rationale: Kata ganti relatif ini merujuk kepada Simon Petrus yang disebut dalam ayat sebelumnya. Dalam bahasa Indonesia, memulai kalimat dengan kata ganti orang lebih alami daripada mempertahankan konstruksi relatif.
- source_word: λαλήσει
  choice: akan menyampaikan
  rationale: Bentuk mendatang dari λαλέω berarti berbicara atau mengatakan. Dalam hubungan dengan ῥήματα, 'menyampaikan perkataan-perkataan' secara alami menunjukkan penyampaian pesan tanpa mengubah objek jamaknya menjadi bentuk tunggal.
- source_word: ῥήματα
  choice: perkataan-perkataan
  rationale: Bentuk jamak konkret dipertahankan sesuai teks Yunani. 'Pesan' lebih lancar, tetapi akan mengubah bentuk jamak menjadi konsep tunggal.
- source_word: πρὸς σὲ
  choice: kepadamu
  rationale: Dengan verba berbicara, πρός dan akusatif menunjukkan arah perkataan kepada pendengar.
- source_word: ἐν οἷς
  choice: yang olehnya
  rationale: 'ἐν di sini paling wajar dipahami secara instrumental: perkataan-perkataan itu merupakan sarana yang melaluinya keselamatan datang. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.'
- source_word: σωθήσῃ
  choice: akan diselamatkan
  rationale: Subjungtif aoristus pasif dalam klausa relatif ἐν οἷς menyatakan hasil yang akan terjadi melalui perkataan itu. Dalam konteks Kisah Para Rasul, σῴζω memiliki pengertian keselamatan, bukan sekadar pertolongan umum.
- source_word: σὺ
  choice: engkau
  rationale: Kata ganti subjek yang eksplisit memberi penekanan dan dipertahankan dalam rangkaian 'engkau dan seluruh rumah tanggamu'. Bentuk 'engkau' cocok dengan register Kitab Suci yang bermartabat dan membedakan orang kedua tunggal.
- source_word: πᾶς ὁ οἶκός σου
  choice: seluruh rumah tanggamu
  rationale: οἶκος di sini menunjuk kepada rumah tangga sebagai kelompok orang, bukan bangunan. 'Seluruh rumah tanggamu' alami dalam bahasa Indonesia dan mempertahankan cakupan kolektif πᾶς.
theological_decisions:
- issue: Makna keselamatan dalam konteks rumah tangga Kornelius
  choice: σωθήσῃ diterjemahkan 'akan diselamatkan', sehingga ayat menyatakan keselamatan melalui perkataan yang diberitakan tanpa menentukan mekanismenya lebih jauh.
  alternative: '''akan dilepaskan'' atau ''akan diselamatkan dari bahaya'''
  rationale: Konteks langsung Kisah Para Rasul berkaitan dengan pemberitaan Injil dan penerimaan keselamatan. Terjemahan ini mempertahankan daya soteriologis verba tersebut tanpa memasukkan rumusan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Cakupan 'seluruh rumah tanggamu'
  choice: Ungkapan kolektif dipertahankan tanpa menyatakan bahwa keselamatan setiap anggota terjadi secara otomatis tanpa respons.
  alternative: Menjelaskan dalam teks bahwa setiap anggota harus merespons secara pribadi, atau bahwa kepala rumah tangga mewakili semua anggotanya.
  rationale: Teks menyatakan cakupan rumah tangga, tetapi ayat ini sendiri tidak merinci cara setiap anggota mengambil bagian. Terjemahan tidak menyelesaikan ketegangan tersebut menurut suatu pandangan denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk rujukan orang ketiga, sedangkan 'engkau' mempertahankan orang kedua tunggal dan nuansa wacana Kitab Suci. Penanda catatan kaki ditempatkan tepat setelah kalimat.
