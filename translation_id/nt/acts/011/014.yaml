  - severity: medium
    issue: “Yang olehnya” tidak alami dan dapat mengaburkan hubungan antara perkataan dan keselamatan.
    rationale: Ungkapan instrumental ἐν οἷς paling jelas dan wajar diterjemahkan dengan frasa eksplisit “melalui perkataan itu.”
