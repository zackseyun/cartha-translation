  terminology: “Diselamatkan” tepat untuk σωθήσῃ dalam konteks ini. “Seluruh rumah tanggamu” secara semantis tepat untuk πᾶς ὁ οἶκός σου, tetapi “seisi rumahmu” lebih alami dalam register modern dan tetap menunjuk pada seluruh anggota rumah tangga, bukan bangunan.
