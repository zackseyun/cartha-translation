id: ACT.11.20
reference: Acts 11:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: id
  text: Namun, ada beberapa laki-laki dari Siprus dan Kirene yang, ketika tiba di Antiokhia, terus berbicara juga kepada orang-orang Yahudi yang berbahasa Yunani,[a] sambil memberitakan kabar baik tentang Tuhan Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “orang-orang Yunani,” bukan “orang-orang Yahudi yang berbahasa Yunani.” Jika bacaan itu asli, maksudnya ialah bahwa mereka berbicara kepada orang-orang bukan Yahudi, bukan hanya kepada orang-orang Yahudi yang berbahasa Yunani.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: beberapa
  rationale: Menunjuk pada sejumlah orang yang tidak disebutkan secara pasti dari kelompok sebelumnya; “beberapa” wajar dalam bahasa Indonesia modern.
- source_word: ἄνδρες
  choice: laki-laki
  rationale: Kata Yunani ini secara khusus menyebut laki-laki dewasa, sehingga nuansa gendernya dipertahankan.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: dari Siprus dan Kirene
  rationale: Kedua adjektiva etnik ini menyatakan asal; bentuk “dari ...” lebih alami dalam bahasa Indonesia.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: ketika tiba di Antiokhia
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: ἐλάλουν
  choice: berbicara
  rationale: Imperfek menunjukkan kegiatan yang sedang berlangsung atau berulang; dalam konteks naratif, aspek itu didukung oleh konstruksi kalimat dan partisip berikutnya.
- source_word: καὶ
  choice: juga
  rationale: Kemungkinan besar berfungsi aditif, menandai perluasan pihak yang menjadi sasaran pemberitaan.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: kepada orang-orang Yahudi berbahasa Yunani
  rationale: Ἑλληνιστάς biasanya menunjuk orang Yahudi berbahasa Yunani. Terjemahan deskriptif lebih mudah dipahami daripada transliterasi “Helenis,” sementara varian penting Ἕλληνας dicatat dalam catatan kaki.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik tentang
  rationale: Mengungkapkan tindakan menyampaikan kabar baik dengan bahasa yang jelas dan mudah dipahami, serta menghubungkannya dengan objek pemberitaan.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Tuhan Yesus
  rationale: Mempertahankan κύριος sebagai gelar kristologis “Tuhan”; bahasa Indonesia tidak memerlukan artikel tersendiri.
theological_decisions:
- issue: Identitas τοὺς Ἑλληνιστάς dan varian tekstual Ἕλληνας
  choice: Teks utama mengikuti SBLGNT, “orang-orang Yahudi berbahasa Yunani,” dengan varian “orang-orang Yunani” dalam catatan kaki.
  alternative: orang-orang Yunani, yakni orang bukan Yahudi
  rationale: Bacaan SBLGNT adalah Ἑλληνιστάς, yang lazimnya berarti orang Yahudi berbahasa Yunani. Varian Ἕλληνας mengubah sasaran pemberitaan menjadi orang bukan Yahudi dan karena itu memiliki arti penting bagi alur Kisah Para Rasul; ketegangan tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Namun” mengalihkan perhatian kepada pengecualian dari pola sebelumnya; “memberitakan kabar baik” dipilih agar makna εὐαγγελιζόμενοι transparan bagi pembaca umum.
