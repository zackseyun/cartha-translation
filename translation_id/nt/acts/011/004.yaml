  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: id
  text: Namun, Petrus mulai memaparkan kepada mereka secara berurutan[a], katanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memaparkannya kepada mereka secara berurutan” atau “memberikan kepada mereka laporan yang teratur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: mulai
  rationale: Partisip aoris ini berfungsi secara adverbial bersama verba utama. 'Mulai menjelaskan' merupakan ungkapan Indonesia yang wajar dan mempertahankan dimulainya tanggapan Petrus.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan dari tuduhan pada ayat sebelumnya kepada jawaban Petrus.
- source_word: Πέτρος
  choice: Petrus
  rationale: Nama pribadi digunakan dalam bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: ἐξετίθετο
  choice: menjelaskan semuanya
  rationale: Bentuk imperfek ini berarti memaparkan atau menjelaskan suatu perkara. 'Semuanya' menyatakan objek tersirat berdasarkan rangkaian peristiwa yang dipersoalkan, sedangkan aspek berlangsung tercakup secara alami dalam konstruksi 'mulai menjelaskan'.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Padanan langsung bagi pronomina datif jamak yang merujuk kepada orang-orang yang mempersoalkan tindakan Petrus.
- source_word: καθεξῆς
  choice: secara berurutan
  rationale: Adverbia ini menekankan urutan atau susunan yang teratur, bukan terutama titik awal kisah.
- source_word: λέγων
  choice: katanya
  rationale: Partisip kini ini memperkenalkan isi tuturan langsung. 'Katanya' alami dalam narasi Indonesia dan tetap menghubungkan penjelasan Petrus dengan perkataan berikutnya.
