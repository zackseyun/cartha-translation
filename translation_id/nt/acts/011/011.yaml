  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: id
  text: Dan lihatlah, pada saat itu juga tiga orang laki-laki tiba di rumah tempat kami berada, yang telah diutus dari Kaisarea kepadaku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang mengarahkan perhatian kepada perkembangan penting dan mendadak dalam kisah.
- source_word: ἐξαυτῆς
  choice: pada saat itu juga
  rationale: Mengungkapkan kesegeraan sekaligus kaitan waktu yang erat dengan peristiwa sebelumnya secara alami dalam bahasa Indonesia.
- source_word: τρεῖς ἄνδρες
  choice: tiga orang
  rationale: Dalam konteks ini ketiganya jelas laki-laki, tetapi bahasa Indonesia lazim memakai 'orang' setelah bilangan; pilihan ini alami tanpa mengubah acuan.
- source_word: ἐπέστησαν
  choice: tiba
  rationale: Menyampaikan kedatangan mereka di lokasi, sesuai makna kontekstual verba tersebut.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: di rumah
  rationale: Dengan verba 'tiba', preposisi lokasi 'di' merupakan bentuk Indonesia yang idiomatis untuk tempat tujuan yang telah dicapai.
- source_word: ἐν ᾗ ἦμεν
  choice: tempat kami berada
  rationale: Menerjemahkan keterangan lokasi secara langsung tanpa menambahkan gagasan bahwa mereka sedang menginap.
- source_word: ἀπεσταλμένοι
  choice: Mereka telah diutus
  rationale: Kalimat baru mempertahankan keadaan yang dihasilkan oleh tindakan pengutusan sebelumnya sekaligus menghindari konstruksi partisipial yang kaku dalam bahasa Indonesia.
- source_word: ἀπὸ Καισαρείας
  choice: dari Kaisarea
  rationale: Menunjukkan tempat asal pengutusan secara langsung.
- source_word: πρός με
  choice: untuk menemui aku
  rationale: Menyatakan bahwa Petrus adalah orang yang dituju; lebih alami dan lebih jelas dalam bahasa Indonesia daripada 'kepadaku' setelah verba pasif 'diutus'.
