  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: id
  text: Setelah menemukan Saulus, Barnabas membawanya ke Antiokhia. Selama satu tahun penuh, mereka berkumpul bersama jemaat[a] dan mengajar banyak orang. Di Antiokhialah murid-murid itu untuk pertama kalinya disebut “orang Kristen.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkumpul dalam jemaat.” Ungkapan Yunani ini dapat menekankan bahwa mereka berhimpun bersama komunitas orang percaya, bukan berada di sebuah gedung gereja.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani secara harfiah menyatakan bahwa murid-murid itu “untuk pertama kalinya disebut orang Kristen.” Sebutan ini tampaknya mulai digunakan sebagai nama umum bagi mereka di Antiokhia.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Setelah menemukan Saulus
  rationale: Partisip aoristus menyatakan tindakan yang mendahului kata kerja utama. Nama Saulus dijelaskan dari konteks agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: ἤγαγεν
  choice: Barnabas membawanya
  rationale: ἄγω dalam konteks ini berarti membawa Saulus ke Antiokhia; subjek Barnabas dijelaskan dari konteks untuk menghindari rangkaian pronomina yang kabur.
- source_word: ἐνιαυτὸν ὅλον
  choice: Selama satu tahun penuh
  rationale: Menyampaikan akusatif durasi secara langsung dan wajar.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: mereka berkumpul bersama jemaat
  rationale: Mengungkapkan pertemuan dalam kebersamaan dengan komunitas Kristen dan menghindari kesan bahwa ἐκκλησία menunjuk pada gedung.
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk pada komunitas orang percaya; 'jemaat' alami dan tidak menyiratkan bangunan.
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: mengajar banyak orang
  rationale: ἱκανός menyatakan jumlah yang cukup besar. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'kerumunan yang cukup besar'.
- source_word: χρηματίσαι
  choice: disebut
  rationale: Di sini kata tersebut menyatakan pemberian atau penggunaan suatu sebutan bagi kelompok itu tanpa menetapkan siapa yang menciptakannya.
- source_word: πρώτως
  choice: untuk pertama kalinya
  rationale: Menandai terjadinya penamaan tersebut untuk kali pertama.
- source_word: Χριστιανούς
  choice: orang Kristen
  rationale: Ini merupakan sebutan kelompok yang telah mapan, bukan sekadar pemakaian predikatif gelar Χριστός. 'Orang Kristen' adalah padanan Indonesia yang lazim dan tepat.
theological_decisions:
- issue: Makna ἐκκλησία dalam frasa ἐν τῇ ἐκκλησίᾳ
  choice: bersama jemaat
  alternative: di dalam gereja
  rationale: Pilihan ini memahami ἐκκλησία sebagai komunitas orang percaya, bukan gedung, sambil mempertahankan kemungkinan bahwa frasa Yunani menekankan perhimpunan mereka dengan jemaat.
- issue: Penerjemahan nama kelompok Χριστιανούς
  choice: orang Kristen
  alternative: pengikut Kristus
  rationale: Kata Yunani tersebut sudah berfungsi sebagai nama atau sebutan kelompok. Padanan konvensional 'orang Kristen' mempertahankan fungsi itu tanpa menggantinya dengan uraian teologis.
- issue: Asal-usul sebutan orang Kristen
  choice: disebut
  alternative: menyebut diri mereka
  rationale: Bentuk Yunani tidak menyatakan secara tegas siapa pemberi sebutan itu. Terjemahan pasif mempertahankan ketidakjelasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Barnabas dan Saulus dijelaskan dari konteks untuk menghindari ambiguitas pronomina yang tidak alami. Penekanan lokatif Yunani dipertahankan melalui bentuk 'Di Antiokhialah'.
