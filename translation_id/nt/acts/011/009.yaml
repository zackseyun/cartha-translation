  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: id
  text: Namun, suara dari surga menjawab untuk kedua kalinya, “Apa yang telah Allah tahirkan, jangan kamu nyatakan sebagai biasa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jangan kamu anggap najis” atau “jangan kamu nyatakan cemar.” “Biasa” di sini merujuk pada kategori kemurnian ritual, bukan sekadar sesuatu yang lazim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: terdengar
  rationale: Secara leksikal berarti ‘menjawab’, tetapi karena subjeknya ‘suara’ dan bahasa Indonesia lebih alami memakai ‘terdengar suara’ dalam konteks ini, jawaban tersebut disampaikan secara idiomatis tanpa mengubah urutan narasi.
- source_word: φωνὴ
  choice: suara
  rationale: Mempertahankan subjek yang tidak menyebutkan secara khusus siapa penuturnya.
- source_word: ἐκ δευτέρου
  choice: untuk kedua kalinya
  rationale: Padanan langsung dan alami bagi ungkapan yang berarti tindakan itu terjadi untuk kedua kali.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks penglihatan ilahi ini, οὐρανός menunjuk pada surga, bukan sekadar langit.
- source_word: Ἃ
  choice: Apa yang
  rationale: Mengungkapkan kata ganti relatif netral jamak sebagai kategori umum dengan bentuk Indonesia yang alami.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan wajar untuk θεός dalam terjemahan Alkitab bahasa Indonesia.
- source_word: ἐκαθάρισεν
  choice: telah Allah tahirkan
  rationale: ‘Tahirkan’ mempertahankan ranah kemurnian ritual καθαρίζω dan bentuk ‘telah’ menandai tindakan yang sudah dilakukan.
- source_word: σὺ μὴ κοίνου
  choice: jangan kamu anggap najis
  rationale: Pronomina eksplisit σὺ dipertahankan sebagai ‘kamu’; larangan kini μὴ dengan imperatif diterjemahkan ‘jangan’, sedangkan κοινόω dalam konteks kemurnian paling jelas diungkapkan sebagai ‘anggap najis’.
theological_decisions:
- issue: Nuansa bahasa kemurnian pada κοινόω
  choice: anggap najis
  alternative: sebut biasa; nyatakan cemar
  rationale: ‘Biasa’ merupakan padanan lebih harfiah untuk κοινός, tetapi dalam bahasa Indonesia modern tidak menyampaikan kategori kenajisan ritual secara jelas. ‘Anggap najis’ mempertahankan pertentangan kontekstual dengan tindakan Allah yang menahirkan, tanpa menentukan bahwa Petrus benar-benar dapat membatalkan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘tahirkan’ dipakai untuk menjaga ranah kemurnian ritual; susunan ‘jangan kamu’ mempertahankan penekanan pada σὺ tanpa terdengar terlalu kaku.
