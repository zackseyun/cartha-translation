id: ACT.11.6
reference: Acts 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: id
  text: Aku menatap ke dalamnya dengan saksama dan terus mengamatinya; lalu aku melihat binatang berkaki empat di bumi, binatang liar, binatang melata[a], dan burung-burung di langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk yang merayap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: ke dalamnya
  rationale: Merujuk kembali kepada benda seperti kain lebar dalam penglihatan Petrus; bersama ἀτενίζω, frasa ini menyatakan arah tatapan ke bagian dalamnya.
- source_word: ἀτενίσας
  choice: menatap
  rationale: Menyampaikan pandangan yang terarah dan sungguh-sungguh secara alami dalam bahasa Indonesia.
- source_word: κατενόουν
  choice: mengamatinya dengan saksama
  rationale: Bentuk imperfek menggambarkan pengamatan yang berlangsung dan membedakannya dari tindakan melihat yang dinyatakan kemudian oleh εἶδον.
- source_word: εἶδον
  choice: Aku melihat
  rationale: Padanan langsung yang mempertahankan perbedaan dengan tindakan mengamati secara saksama sebelumnya.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: segala jenis binatang berkaki empat di bumi
  rationale: Mengungkapkan kategori hewan berkaki empat dengan bahasa yang wajar serta mempertahankan unsur τῆς γῆς; artikel dalam daftar umum ini dipahami secara kategoris.
- source_word: τὰ θηρία
  choice: binatang liar
  rationale: Mempertahankan kategori hewan liar yang dibedakan dari sebutan binatang berkaki empat.
- source_word: τὰ ἑρπετὰ
  choice: binatang melata
  rationale: Lebih luas daripada 'reptil' dan mempertahankan gema kategori makhluk dalam kisah penciptaan serta hukum kemurnian.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: Padanan konkret dan alami bagi makhluk terbang dalam konteks daftar zoologis; 'langit' sesuai dengan τοῦ οὐρανοῦ di sini.
theological_decisions:
- issue: Cakupan ἑρπετά dalam kategori makhluk dan hukum kemurnian
  choice: binatang melata
  alternative: reptil
  rationale: '''Binatang melata'' menjaga cakupan istilah sumber yang lebih luas dan tidak membatasi kategori itu pada klasifikasi zoologis modern.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua tahap persepsi—menatap/mengamati lalu melihat—dipertahankan, sedangkan daftar makhluk dibuat alami tanpa menghilangkan corak kategoris teks Yunani.
