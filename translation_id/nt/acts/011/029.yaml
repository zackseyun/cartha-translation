id: ACT.11.29
reference: Acts 11:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: id
  text: Karena itu, para murid memutuskan bahwa masing-masing akan mengirim bantuan sesuai dengan kemampuannya[a] kepada saudara-saudara[b] yang tinggal di Yudea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebagaimana seseorang berkecukupan”; maksudnya, menurut apa yang sanggup disediakan masing-masing.'
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini kemungkinan berarti sesama orang percaya di Yudea, termasuk komunitas Kristen secara luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: para murid
  rationale: Istilah baku dan alami dalam Kisah Para Rasul untuk para pengikut Yesus.
- source_word: ὥρισαν
  choice: memutuskan
  rationale: Mengungkapkan keputusan bersama yang disengaja tanpa memberi kesan tekad emosional yang tidak dinyatakan oleh teks.
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: masing-masing ... sesuai dengan kemampuannya
  rationale: Menyampaikan gagasan distributif bahwa sumbangan ditentukan menurut sumber daya atau kemampuan tiap orang; ungkapan Indonesia ini alami dan tidak membatasi bantuan pada bentuk tertentu.
- source_word: εἰς διακονίαν πέμψαι
  choice: akan mengirim bantuan
  rationale: Dalam konteks kebutuhan akibat bencana kelaparan, διακονία menunjuk pada pelayanan bantuan praktis. Terjemahan ini membuat objek tersirat dari πέμψαι jelas tanpa merinci bentuk bantuannya.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: kepada ... yang tinggal di Yudea
  rationale: Padanan langsung dan wajar bagi frasa partisipial Yunani.
- source_word: ἀδελφοῖς
  choice: saudara-saudara
  rationale: Mempertahankan istilah kekerabatan komunitas Kristen dalam teks sumber; cakupan kontekstualnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Cakupan ἀδελφοῖς bagi komunitas orang percaya di Yudea
  choice: saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk Yunani adalah jamak maskulin dan dapat dipakai secara inklusif bagi komunitas Kristen. Teks utama mempertahankan metafora kekerabatan tanpa menutup kemungkinan bahwa seluruh komunitas, termasuk perempuan, dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bermartabat. “Karena itu” menghubungkan keputusan ini dengan kabar tentang bencana kelaparan pada ayat sebelumnya. Bentuk “kemampuannya” bersifat distributif dan tidak menandai gender dalam bahasa Indonesia.
