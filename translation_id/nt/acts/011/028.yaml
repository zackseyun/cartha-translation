  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: id
  text: Lalu seorang dari antara mereka, bernama Agabus, berdiri dan menyatakan melalui Roh bahwa suatu kelaparan besar akan melanda seluruh dunia yang dihuni manusia[a]—dan hal itu terjadi pada zaman Klaudius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh dunia”; dalam Lukas–Kisah Para Rasul, ungkapan ini juga dapat mengacu secara lebih khusus kepada dunia Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini memperkenalkan tindakan Agabus di tengah pertemuan. 'Berdiri' alami dalam bahasa Indonesia dan mempertahankan makna tindakan fisiknya.
- source_word: ἐσήμανεν
  choice: menyatakan
  rationale: σημαίνω berarti memberi tanda, menunjukkan, atau memberitahukan. 'Menyatakan' menyampaikan bahwa Agabus membuat hal itu diketahui tanpa mempersempit caranya menjadi formula nubuat tertentu.
- source_word: διὰ τοῦ πνεύματος
  choice: melalui Roh
  rationale: διά dengan genitif menyatakan sarana atau perantaraan. 'Melalui Roh' mempertahankan gambaran Roh sebagai perantara pewahyuan; huruf kapital mencerminkan rujukan kontekstual kepada Roh Kudus.
- source_word: λιμὸν μεγάλην
  choice: suatu kelaparan besar
  rationale: λιμός berarti kelaparan dan μεγάλην secara langsung berarti besar. Pilihan ini mempertahankan bentuk ungkapan Yunani tanpa menafsirkannya lebih jauh sebagai 'kelaparan hebat'.
- source_word: μέλλειν ἔσεσθαι
  choice: akan melanda
  rationale: Konstruksi μέλλω dengan infinitif menyatakan kejadian yang akan datang atau sudah di ambang terjadi. Dengan subjek 'kelaparan', 'akan melanda' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan daya prediktifnya.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: seluruh dunia yang berpenghuni
  rationale: οἰκουμένη secara leksikal menunjuk kepada dunia yang dihuni dan dapat mengacu lebih khusus kepada dunia kekaisaran. Terjemahan ini mempertahankan keluasan serta ambiguitas istilah sumber.
- source_word: ἥτις ἐγένετο
  choice: dan hal itu terjadi
  rationale: ἥτις menghubungkan nubuat dengan peristiwa yang sungguh terjadi, sedangkan ἐγένετο berarti terjadi. Bentuk ini alami dalam bahasa Indonesia dan memperjelas antesedennya tanpa menambah tafsiran.
- source_word: ἐπὶ Κλαυδίου
  choice: pada zaman Klaudius
  rationale: ἐπί dengan genitif dalam ungkapan kronologis berarti pada masa seorang penguasa. 'Pada zaman Klaudius' akurat dan mudah dipahami tanpa menambahkan kata 'pemerintahan' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan 'Roh' dalam διὰ τοῦ πνεύματος
  choice: Roh Kudus dimaksudkan, ditandai dengan huruf kapital pada 'Roh'
  alternative: roh dalam arti ilham rohani yang kurang spesifik
  rationale: Dalam Kisah Para Rasul, 'Roh' dalam konteks nubuat biasanya mengacu kepada Roh Kudus. Kapitalisasi mencerminkan penilaian kontekstual ini.
- issue: Cakupan οἰκουμένη
  choice: diterjemahkan secara leksikal sebagai 'seluruh dunia yang berpenghuni'
  alternative: '''seluruh dunia'' atau ''seluruh dunia Romawi'''
  rationale: Istilah itu dapat menunjuk kepada dunia berpenghuni secara luas, tetapi dalam Lukas–Kisah Para Rasul dapat pula bernuansa dunia kekaisaran. Teks utama tidak mempersempitnya, sedangkan catatan kaki mempertahankan alternatif kontekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat mempertahankan alur narasi serta hubungan antara pernyataan melalui Roh, kelaparan yang akan datang, dan penggenapannya pada zaman Klaudius.
