  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: id
  text: Tetapi ketika Petrus naik ke Yerusalem, orang-orang dari kalangan bersunat[a] berselisih dengan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang dari sunat”; maksudnya ialah orang-orang yang dikenali melalui kaitannya dengan sunat. Ungkapan ini juga dapat diterjemahkan “golongan bersunat” atau “orang-orang percaya yang bersunat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: δέ menandai perkembangan narasi dengan nuansa peralihan atau pertentangan ringan; “Namun, ketika” mempertahankan daya penghubung itu secara wajar.
- source_word: ἀνέβη
  choice: pergi
  rationale: Secara harfiah berarti “pergi naik”. Dalam bahasa Indonesia, “pergi ke Yerusalem” lebih alami; unsur naik merupakan idiom geografis/topografis yang tidak perlu dinyatakan secara kaku.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: διεκρίνοντο
  choice: berselisih
  rationale: Dalam konteks ini kata tersebut menunjuk pada tindakan membantah atau mempersoalkan Petrus, bukan keraguan batin. Bentuk imperfek menunjukkan perselisihan yang sedang berlangsung.
- source_word: πρὸς αὐτόν
  choice: dengan dia
  rationale: Dengan verba perselisihan, πρός berakusatif menunjukkan pihak yang dihadapi; “dengan dia” alami dan tidak mempertajam permusuhan melebihi teks.
- source_word: οἱ ἐκ περιτομῆς
  choice: orang-orang dari kalangan bersunat
  rationale: Ungkapan harfiahnya mengidentifikasi orang-orang berdasarkan hubungan mereka dengan sunat. “Dari kalangan bersunat” mempertahankan penanda kelompok tanpa menyatakan bahwa mereka merupakan partai formal.
theological_decisions:
- issue: Identitas οἱ ἐκ περιτομῆς
  choice: orang-orang dari kalangan bersunat yang mempersoalkan tindakan Petrus
  alternative: semua orang percaya Yahudi; atau sebuah partai sunat formal
  rationale: Teks mengidentifikasi kelompok itu melalui sunat, tetapi tidak dengan sendirinya memastikan bahwa semua orang percaya Yahudi terlibat ataupun bahwa sudah ada organisasi partai formal. Terjemahan menjaga keluasan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan peralihan naratif, sifat perselisihan, dan ketidakpastian mengenai batas tepat kelompok yang disebut.
