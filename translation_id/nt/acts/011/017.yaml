  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: id
  text: Jadi, jika Allah telah memberikan kepada mereka karunia yang sama seperti yang juga diberikan-Nya kepada kita yang percaya[b] kepada Tuhan Yesus, Sang Mesias[a], siapakah aku ini sehingga aku sanggup menghalangi Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus”. Yunani: Χριστόν (Christon). Di sini diterjemahkan “Sang Mesias” karena kata itu masih berfungsi sebagai gelar.'
    reason: alternative_reading
  - marker: b
    text: 'Frasa “kepada kita yang percaya” juga dapat dipahami secara temporal: “kepada kita ketika kita percaya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: karunia yang sama
  rationale: ἴσην menyatakan kesetaraan dengan karunia yang diterima kelompok pembicara; frasa ini alami dalam bahasa Indonesia dan mempertahankan perbandingan tersebut.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: kepada kita yang percaya kepada Tuhan Yesus, Sang Mesias
  rationale: Partisip aoristis datif jamak menerangkan ἡμῖν. Bentuk deskriptif “yang percaya” dekat dengan struktur Yunani, sementara “percaya kepada” menyampaikan arah atau objek iman yang ditandai ἐπί dengan akusatif.
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam pengakuan kristologis ini κύριος berfungsi sebagai gelar Yesus, sehingga “Tuhan” lebih tepat daripada sekadar “tuan”.
- source_word: Χριστόν
  choice: Sang Mesias
  rationale: Χριστός masih memiliki daya sebagai gelar; “Sang Mesias” mengungkapkan makna gelar itu secara wajar dalam bahasa Indonesia. Alternatif tradisional dicatat dalam catatan kaki.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: siapakah aku ini sehingga aku sanggup
  rationale: Ungkapan retoris ini menonjolkan ketidaklayakan dan ketidakmampuan Petrus untuk menentang tindakan Allah; susunan Indonesia tersebut mempertahankan tekanan pada ἐγώ dan δυνατός.
- source_word: κωλῦσαι
  choice: menghalangi
  rationale: κωλύω berarti menghalangi atau mencegah. “Menghalangi” dapat mengambil Allah sebagai objek langsung dan mempertahankan daya retoris ungkapan Yunani.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Allah adalah objek langsung κωλῦσαι; terjemahan ini mempertahankan pernyataan tajam bahwa menolak penerimaan bangsa-bangsa lain berarti menghalangi Allah sendiri.
theological_decisions:
- issue: Makna Χριστόν dalam gelar κύριον Ἰησοῦν Χριστόν
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap bermakna sebagai gelar. “Sang Mesias” mempertahankan muatan mesianiknya tanpa memasukkan kekhasan denominasi; bentuk “Kristus” tetap diberikan sebagai alternatif.
- issue: Hubungan partisip πιστεύσασιν dengan ἡμῖν
  choice: kepada kita yang percaya
  alternative: kepada kita ketika kita percaya
  rationale: Bentuk deskriptif mengikuti kesesuaian gramatikal partisip dengan ἡμῖν dan tidak memaksakan hubungan waktu yang lebih tegas daripada teks Yunani. Kemungkinan nuansa temporal dicatat dalam catatan kaki.
- issue: Daya retoris menghalangi Allah
  choice: siapakah aku ini sehingga aku sanggup menghalangi Allah?
  alternative: siapakah aku ini sampai dapat mencegah Allah?
  rationale: Rumusan pilihan mempertahankan pengakuan Petrus bahwa menolak karya Allah terhadap bangsa-bangsa lain akan sama dengan berusaha menghalangi Allah, tanpa menjelaskan lebih jauh implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jadi, jika” menjaga hubungan kesimpulan bersyarat εἰ οὖν; “karunia” mempertahankan diksi religius yang umum; pertanyaan retoris dibuat alami tanpa mengurangi ketegangan teks. Semua penanda catatan kaki dicantumkan dalam teks utama.
