base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: id
  text: Mereka pun melakukannya dengan mengirimkan bantuan itu kepada para penatua melalui Barnabas dan Saulus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Mereka pun melakukannya
  rationale: Frasa ini mengacu kembali pada keputusan para murid dalam ayat sebelumnya. Bentuk 'melakukannya' menyampaikan hubungan anaforis itu secara alami dan ringkas; 'pun' mewakili fungsi καί sebagai penegasan bahwa niat tersebut benar-benar dilaksanakan.
- source_word: ἀποστείλαντες
  choice: dengan mengirimkan
  rationale: Partisip aoristus menjelaskan cara mereka melaksanakan keputusan tersebut. 'Dengan mengirimkan' memperjelas hubungan sarana tanpa mengubah isi.
- source_word: implicit object from context
  choice: bantuan itu
  rationale: Objek ἀποστείλαντες tidak dinyatakan dalam bahasa Yunani, tetapi jelas merujuk pada bantuan bagi saudara-saudara di Yudea dalam ayat sebelumnya. Bahasa Indonesia memerlukan objek agar kalimat alami; 'bantuan itu' tetap terikat pada konteks tanpa mempersempitnya menjadi uang atau barang tertentu.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: kepada para penatua
  rationale: πρεσβύτεροι menunjuk para pemimpin yang diakui dalam jemaat. 'Penatua' merupakan padanan Indonesia yang baku, transparan, dan tidak memasukkan struktur denominasi tertentu.
- source_word: διὰ χειρὸς
  choice: melalui
  rationale: Idiom Yunani yang secara harfiah berarti 'melalui tangan' menyatakan perantaraan atau keagenan. 'Melalui' adalah ungkapan Indonesia yang alami dan mempertahankan fungsi Barnabas dan Saulus sebagai pembawa bantuan.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Barnabas dan Saulus
  rationale: Nama-nama diri ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
