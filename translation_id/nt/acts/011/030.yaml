  source_fidelity: Teks Indonesia dengan tepat menghubungkan tindakan ini dengan keputusan pada ayat sebelumnya (ὃ καὶ ἐποίησαν), menyatakan pengiriman sebagai cara pelaksanaannya (ἀποστείλαντες), dan mempertahankan sasaran kepada para penatua serta perantaraan Barnabas dan Saulus. Penambahan objek kontekstual “bantuan itu” wajar dan tidak mempersempit bentuk bantuan.
