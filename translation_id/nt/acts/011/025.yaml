id: ACT.11.25
reference: Acts 11:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξῆλθεν δὲ εἰς ⸀Ταρσὸν ἀναζητῆσαι Σαῦλον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/025.yaml
  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: id
  text: Kemudian Barnabas pergi ke Tarsus untuk mencari Saulus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mencari-cari Saulus” atau “untuk berusaha menemukan Saulus.”
    reason: Alternatif ini mencerminkan kemungkinan nuansa intensif pada ἀναζητῆσαι.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pergi
  rationale: Dalam konteks perjalanan, bentuk aoristus ἐξῆλθεν menyatakan bahwa Barnabas berangkat menuju Tarsus. Bahasa Indonesia alami cukup memakai 'pergi'; terjemahan harfiah 'keluar' dapat menimbulkan pertanyaan keluar dari mana, yang tidak dinyatakan dalam ayat ini.
- source_word: δὲ
  choice: Kemudian
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan alur cerita, bukan sebagai pertentangan. 'Kemudian' menyampaikan perkembangan naratif secara alami.
- source_word: εἰς Ταρσόν
  choice: ke Tarsus
  rationale: Dengan verba gerak, εἰς menandai tujuan. 'Ke Tarsus' adalah ungkapan tujuan yang baku dan alami dalam bahasa Indonesia.
- source_word: ἀναζητῆσαι
  choice: untuk mencari
  rationale: Infinitif aoristus ini menyatakan tujuan dan dapat mengandung nuansa mencari dengan sungguh-sungguh atau berusaha menemukan. 'Untuk mencari' jelas dan alami, sedangkan alternatif yang lebih intens dicatat dalam catatan kaki.
- source_word: Σαῦλον
  choice: Saulus
  rationale: Nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dalam ἐξῆλθεν
  choice: Barnabas disebut secara eksplisit
  alternative: Ia
  rationale: Bahasa Yunani mengandalkan subjek dari konteks ayat sebelumnya, yaitu Barnabas. Menyebut namanya membuat ayat tunggal jelas tanpa mengubah identitas pelaku atau muatan teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan mudah dipahami. Susunan kalimat mengikuti gerak narasi Yunani sambil menghindari ungkapan harfiah yang kaku.
source_grounding:
  english_pob_role: consult_only
