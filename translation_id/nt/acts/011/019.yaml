id: ACT.11.19
reference: Acts 11:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: id
  text: Jadi, orang-orang yang telah tercerai-berai karena kesusahan yang timbul sehubungan dengan Stefanus pergi sampai ke Fenisia, Siprus, dan Antiokhia. Mereka tidak memberitakan firman itu kepada siapa pun, kecuali kepada orang Yahudi saja.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penganiayaan” untuk “kesusahan”. Kata Yunani yang digunakan dapat berarti tekanan, penderitaan, kesusahan, atau penganiayaan sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: “Firman itu” merujuk pada berita yang diberitakan tentang Yesus; dapat juga diterjemahkan “berita itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: telah tercerai-berai
  rationale: Mempertahankan makna pasif dan menunjukkan bahwa tercerai-berainya mereka mendahului perjalanan yang diceritakan oleh verba utama.
- source_word: θλίψεως
  choice: kesusahan
  rationale: Istilah ini cukup luas untuk mencakup tekanan, penderitaan, atau penganiayaan tanpa mempersempit makna secara berlebihan.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: yang timbul sehubungan dengan Stefanus
  rationale: Mengungkapkan bahwa kesusahan itu terjadi berkaitan dengan perkara Stefanus, tanpa memastikan bahwa preposisi ἐπί hanya menyatakan sebab.
- source_word: διῆλθον ἕως
  choice: pergi sampai ke
  rationale: Ungkapan Indonesia yang alami untuk menyatakan perjalanan beserta jangkauan geografisnya.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Fenisia, Siprus, dan Antiokhia
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: tidak memberitakan firman itu kepada siapa pun
  rationale: Dalam konteks misi, 'memberitakan' menyampaikan tindakan berbicara tentang pesan tersebut secara alami, sedangkan 'firman itu' mempertahankan ungkapan tematis Lukas.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: selain hanya kepada orang Yahudi
  rationale: Mempertahankan penegasan pembatasan yang timbul dari gabungan εἰ μή dan μόνον.
theological_decisions:
- issue: Sifat tekanan setelah peristiwa Stefanus
  choice: kesusahan
  alternative: penganiayaan
  rationale: Konteks memang menunjukkan penganiayaan, tetapi θλῖψις memiliki cakupan lebih luas; pilihan utama mempertahankan keluasan itu dan alternatif dicatat.
- issue: Makna τὸν λόγον
  choice: firman itu
  alternative: berita itu
  rationale: Pilihan ini mempertahankan istilah khas dan berulang dalam Kisah Para Rasul, sementara catatan kaki menjelaskan rujukannya agar tidak kabur.
- issue: Pembatasan penerima pemberitaan
  choice: selain hanya kepada orang Yahudi
  alternative: selain kepada orang Yahudi
  rationale: Kata μόνον memberi penegasan eksplisit bahwa pada tahap ini penerimanya terbatas pada orang Yahudi; penegasan itu tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan maknanya. Bentuk 'selain hanya' sengaja dipertahankan untuk membawa penegasan sumber, meskipun sedikit lebih bertanda daripada ungkapan biasa.
