  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: id
  text: Setelah mendengar hal-hal itu, mereka pun terdiam dan memuliakan Allah seraya berkata, “Jadi, Allah juga telah mengaruniakan kepada orang-orang bukan Yahudi pertobatan menuju hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Setelah mendengar hal-hal itu
  rationale: Partisip aoristus menyatakan keadaan yang mendahului verba utama. 'Setelah mendengar' alami dalam bahasa Indonesia; δέ merupakan penghubung ringan yang tidak perlu dinyatakan tersendiri.
- source_word: ἡσύχασαν
  choice: mereka pun tenang
  rationale: Dalam konteks ini verba tersebut menunjukkan bahwa mereka berhenti menyanggah atau berkeberatan. 'Tenang' mempertahankan peralihan dari keberatan sebelumnya tanpa menyempitkannya hanya pada tindakan tidak bersuara.
- source_word: ἐδόξασαν τὸν θεόν
  choice: memuliakan Allah
  rationale: Padanan langsung dan lazim bagi ungkapan Lukas yang mempertahankan bobot teologis δοξάζω.
- source_word: λέγοντες
  choice: katanya
  rationale: Memperkenalkan isi tanggapan mereka secara wajar dalam bahasa Indonesia, dengan subjek jamak dipahami dari konteks.
- source_word: Ἄρα καὶ
  choice: Jadi, ... juga
  rationale: Ἄρα menandai kesimpulan yang ditarik dari laporan Petrus, sedangkan καί menekankan bahwa tindakan Allah meluas juga kepada kelompok ini.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa lain
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada orang-orang bukan Yahudi. 'Bangsa-bangsa lain' jelas dan lebih mudah dipahami pembaca Indonesia daripada istilah serapan yang kurang umum.
- source_word: τὴν μετάνοιαν
  choice: pertobatan
  rationale: Dalam konteks pewartaan Kristen, μετάνοια mencakup perubahan pikiran dan arah hidup; 'pertobatan' adalah padanan Indonesia yang mapan dan tidak mereduksinya menjadi perubahan intelektual semata.
- source_word: εἰς ζωὴν
  choice: yang membawa kepada hidup
  rationale: εἰς dapat menyatakan arah, tujuan, atau hasil. Rumusan ini mempertahankan gerak menuju hidup tanpa memutuskan secara berlebihan antara tujuan dan hasil.
- source_word: ἔδωκεν
  choice: telah mengaruniakan
  rationale: Aoristus menyatakan tindakan Allah yang telah terjadi; 'mengaruniakan' sesuai dengan objek berupa pertobatan yang diberikan dan bentuk perfektif Indonesia menonjolkan relevansi kesimpulan itu sekarang.
theological_decisions:
- issue: Pertobatan sebagai pemberian Allah
  choice: Allah telah mengaruniakan pertobatan kepada bangsa-bangsa lain
  alternative: Allah memberi pertobatan kepada bangsa-bangsa lain
  rationale: Teks secara eksplisit menempatkan Allah sebagai subjek ἔδωκεν dan pertobatan sebagai objek yang diberikan. Terjemahan mempertahankan hal itu tanpa menambahkan sistem doktrinal tentang hubungan tindakan Allah dan tanggapan manusia.
- issue: Hubungan pertobatan dengan hidup
  choice: pertobatan yang membawa kepada hidup
  alternative: pertobatan untuk hidup; pertobatan menuju hidup
  rationale: Ungkapan ini mempertahankan keluwesan εἰς ζωήν sebagai arah, tujuan, atau hasil, serta tidak menentukan lebih jauh mekanisme teologis hubungan keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan gagasan Yunani. Tidak ada catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks utama.
