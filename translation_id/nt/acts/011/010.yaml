  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: id
  text: Hal itu terjadi tiga kali, lalu semuanya kembali ditarik ke surga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Hal itu
  rationale: Kata tunjuk ini merujuk pada peristiwa yang baru saja diceritakan tanpa menambahkan kata “penglihatan,” yang tidak dinyatakan secara eksplisit.
- source_word: δὲ
  choice: lalu
  rationale: Dalam alur narasi, δέ merupakan penghubung ringan; “lalu” secara wajar menghubungkan kejadian berulang itu dengan tindakan berikutnya.
- source_word: ἐγένετο
  choice: terjadi
  rationale: Dalam konteks ini γίνομαι menyatakan berlangsungnya suatu peristiwa; “terjadi” jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐπὶ τρίς
  choice: sampai tiga kali
  rationale: Ungkapan ini menyatakan bahwa peristiwa tersebut berlangsung berulang hingga berjumlah tiga kali; pilihan ini alami dan mempertahankan nuansa pengulangan.
- source_word: ἀνεσπάσθη
  choice: ditarik ... ke
  rationale: Bentuk pasif ἀνασπάω menggambarkan gerakan ke atas oleh pelaku yang tidak disebutkan. “Ditarik” mempertahankan bentuk pasif dan citra benda yang diangkat dengan tarikan.
- source_word: πάλιν
  choice: kembali
  rationale: Dalam konteks gerak menuju tempat asal, “kembali” menyampaikan makna πάλιν secara alami.
- source_word: ἅπαντα
  choice: semuanya
  rationale: Bentuk netral jamak ini bersifat menyeluruh tetapi tidak menentukan apakah yang dimaksud kain, isinya, atau seluruh pemandangan; “semuanya” mempertahankan keluasan itu.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: Dalam konteks penglihatan ini οὐρανός menunjuk pada surga, sedangkan εἰς menyatakan arah gerak. Bahasa Indonesia lazim memakai “ke surga”.
theological_decisions:
- issue: Rujukan ἅπαντα dalam laporan penglihatan Petrus
  choice: semuanya
  alternative: seluruhnya; semua itu; semua binatang itu
  rationale: Bahasa Yunani menyatakan totalitas tanpa mempersempit rujukannya. “Semuanya” tidak menentukan bahwa yang diangkat hanya kain atau hanya binatang, sehingga ambiguitas sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Tidak diperlukan catatan kaki karena alternatif leksikal dapat diwakili secara memadai dalam teks utama tanpa kehilangan ambiguitas penting.
