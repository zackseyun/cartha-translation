  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: id
  text: Lalu aku teringat akan perkataan Tuhan, sebagaimana Ia pernah berkata, “Yohanes membaptis dengan air, tetapi kamu akan dibaptis dalam Roh Kudus[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan Roh Kudus.” Preposisi Yunani yang digunakan di sini dapat dipahami sebagai “dalam” atau “dengan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: aku teringat
  rationale: Bentuk aoristus pasif/deponen ini berfungsi secara aktif dan secara alami menyatakan bahwa Petrus teringat.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ menandai perkembangan ringan dalam alur narasi, bukan pertentangan kuat.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: perkataan Tuhan
  rationale: ῥῆμα menunjuk pada ucapan yang kemudian dikutip; 'perkataan Tuhan' alami dan mempertahankan bobot κύριος.
- source_word: ὡς ἔλεγεν
  choice: tentang bagaimana Ia berkata
  rationale: Ungkapan ini memperkenalkan isi ucapan yang diingat. 'Berkata' menghindari kesan bahwa ucapan itu pasti diulang-ulang, yang tidak harus dituntut oleh bentuk imperfek.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: Yohanes ... tetapi kamu
  rationale: Pasangan μὲν ... δὲ menyatakan kontras yang secara wajar disampaikan dengan 'tetapi' dalam bahasa Indonesia.
- source_word: ἐβάπτισεν ὕδατι
  choice: membaptis dengan air
  rationale: Dativus ὕδατι wajar dipahami sebagai sarana; 'dengan air' merupakan ungkapan Indonesia yang jelas dan lazim.
- source_word: βαπτισθήσεσθε
  choice: akan dibaptis
  rationale: Mempertahankan kala mendatang dan diatesis pasif dari bentuk Yunani.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Mempertahankan kemungkinan nuansa lokatif dari ἐν dan penyebutan Roh ilahi; kemungkinan instrumental dicatat dalam catatan kaki.
theological_decisions:
- issue: Terjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks Kisah Para Rasul, gelar ini merujuk kepada Yesus dan 'Tuhan' mempertahankan otoritas serta bobot teologisnya.
- issue: Makna ἐν dalam ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  alternative: dengan Roh Kudus
  rationale: Preposisi ἐν dapat dipahami secara lokatif atau instrumental. Teks utama memakai 'dalam', sementara alternatif yang sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina orang pertama tunggal 'aku' dipertahankan karena Petrus sedang mengutip tuturannya sendiri. Huruf kapital pada 'Ia' dan 'Roh Kudus' mengikuti konvensi umum penerbitan Alkitab Indonesia.
