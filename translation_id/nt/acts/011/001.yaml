id: ACT.11.1
reference: Acts 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: id
  text: Para rasul dan saudara-saudara yang ada di seluruh Yudea mendengar bahwa orang-orang bukan Yahudi juga telah menerima firman Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari”; bahasa Yunani memakai “saudara-saudara” dan mungkin merujuk lebih luas kepada sesama orang percaya.
    reason: Menjelaskan bahwa bentuk maskulin jamak ἀδελφοὶ dapat memiliki rujukan representatif yang lebih luas tanpa menambahkan unsur tersebut ke dalam teks utama.
lexical_decisions:
- source_word: Ἤκουσαν
  choice: mendengar
  rationale: Bentuk aoris aktif indikatif dari ἀκούω menyatakan bahwa mereka menerima kabar; “mendengar” alami dan tetap dekat dengan bentuk sumber.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan naratif yang ringan, bukan pertentangan kuat. Dalam bahasa Indonesia modern, transisi tersebut sudah wajar tanpa penanda tambahan.
- source_word: οἱ ἀπόστολοι
  choice: para rasul
  rationale: Istilah ini menunjuk pada kelompok rasul yang dikenal dalam Kisah Para Rasul; “para rasul” merupakan padanan baku dan tepat.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara seiman
  rationale: Dalam konteks ini bentuk jamak maskulin tersebut mengacu secara kolektif kepada sesama orang percaya. “Saudara-saudara seiman” mempertahankan metafora kekerabatan sekaligus menjelaskan relasinya secara alami dalam bahasa Indonesia.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: yang berada di seluruh Yudea
  rationale: κατά dengan akusatif memiliki nuansa distributif, sehingga “di seluruh Yudea” lebih tepat daripada sekadar “di Yudea”.
- source_word: ὅτι καὶ τὰ ἔθνη
  choice: bahwa bangsa-bangsa lain juga
  rationale: ὅτι memperkenalkan isi berita, sedangkan καί menonjolkan bahwa kelompok non-Yahudi turut menerima firman. “Bangsa-bangsa lain” menyampaikan rujukan kepada orang-orang bukan Yahudi secara jelas dalam konteks ini.
- source_word: ἐδέξαντο
  choice: telah menerima
  rationale: δέχομαι di sini berarti menerima atau menyambut berita yang diberitakan. “Telah menerima” juga menunjukkan bahwa peristiwa itu terjadi sebelum kabarnya didengar.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan ini menunjuk pada berita ilahi yang diberitakan. “Firman Allah” mempertahankan ungkapan alkitabiah yang lazim dan bobot teologisnya.
theological_decisions:
- issue: Cakupan οἱ ἀδελφοὶ dalam komunitas orang percaya
  choice: saudara-saudara seiman
  alternative: saudara-saudara laki-laki; saudara-saudari; orang-orang percaya
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dalam konteks komunitas dapat dipakai secara representatif bagi sesama orang percaya secara lebih luas. Pilihan ini tidak membatasi kelompok itu hanya kepada laki-laki dan tetap mempertahankan citra kekeluargaan.
- issue: Identitas τὰ ἔθνη
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa; orang-orang bukan Yahudi
  rationale: Dalam konteks Kisah Para Rasul 10–11, ungkapan ini merujuk kepada kalangan non-Yahudi. Padanan yang dipilih mempertahankan bentuk kolektif sumber tanpa menjadikannya istilah geopolitik semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menambahkan penanda wacana seperti “Adapun” atau “Kemudian”; δέ hanya memberi transisi naratif ringan. Tidak diperlukan catatan kaki karena cakupan representatif ἀδελφοὶ sudah disampaikan secara cukup jelas oleh “saudara-saudara seiman”.
