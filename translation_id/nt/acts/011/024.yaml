id: ACT.11.24
reference: Acts 11:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: id
  text: Sebab ia adalah seorang yang baik, penuh dengan Roh Kudus dan iman.[a] Dan sejumlah besar orang ditambahkan kepada Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan”. Kata Yunani pistis juga dapat berarti “kesetiaan” atau “kepercayaan”; di sini teks utama memakai padanan yang umum, “iman”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menandai alasan bagi penilaian tentang Barnabas dalam konteks sebelumnya dan mempertahankan daya penjelas konjungsi Yunani.
- source_word: ἀνὴρ ἀγαθὸς
  choice: seorang yang baik
  rationale: Mengacu khusus kepada Barnabas dan menyatakan mutu moralnya secara langsung; dalam bahasa Indonesia, frasa ini lebih alami daripada 'seorang laki-laki yang baik' ketika jenis kelaminnya sudah jelas dari rujukan.
- source_word: πλήρης πνεύματος ἁγίου
  choice: penuh dengan Roh Kudus
  rationale: Padanan Indonesia yang alami bagi konstruksi 'penuh' dengan genitif dan merujuk kepada Roh Kudus.
- source_word: πίστεως
  choice: iman
  rationale: Merupakan padanan lazim bagi πίστις; kemungkinan nuansa 'kesetiaan' dipertahankan dalam catatan kaki karena konteks menggambarkan watak Barnabas.
- source_word: προσετέθη
  choice: ditambahkan
  rationale: Mempertahankan bentuk pasif serta ungkapan khas Kisah Para Rasul tanpa menggantinya dengan parafrasa interpretatif.
- source_word: ὄχλος ἱκανὸς
  choice: sejumlah besar orang
  rationale: Menyampaikan bahwa yang dimaksud adalah kumpulan orang dalam jumlah besar dengan ungkapan Indonesia yang wajar, bukan kerumunan yang sekadar hadir di satu tempat.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Mempertahankan objek yang dinyatakan secara eksplisit dalam bahasa Yunani, bukan menggantinya dengan 'kepada jemaat'.
theological_decisions:
- issue: Makna πνεύματος ἁγίου
  choice: Roh Kudus sebagai pribadi ilahi
  alternative: roh atau watak yang kudus
  rationale: Dalam Lukas–Kisah Para Rasul, ungkapan ini secara konsisten menunjuk kepada Roh Kudus, dan konteksnya menggambarkan kehidupan Barnabas yang dikuasai Roh.
- issue: Nuansa πίστεως dalam gambaran tentang Barnabas
  choice: iman
  alternative: kesetiaan
  rationale: Keduanya mungkin secara leksikal, khususnya dalam gambaran tentang watak seseorang. Teks utama memakai padanan umum 'iman', sedangkan alternatif yang sungguh mungkin dipertahankan dalam catatan kaki.
- issue: Objek penambahan dalam προσετέθη ... τῷ κυρίῳ
  choice: orang-orang ditambahkan kepada Tuhan
  alternative: orang-orang ditambahkan kepada jemaat atau komunitas
  rationale: Bahasa Yunani secara eksplisit menyebut 'kepada Tuhan'. Masuknya mereka ke dalam komunitas mungkin tersirat, tetapi tidak seharusnya menggantikan objek yang tertulis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat cukup dekat dengan sumber, tetapi 'ὄχλος' diterjemahkan secara idiomatis sebagai 'orang' agar tidak memberi kesan bahwa hanya sebuah kerumunan sebagai satu kesatuan yang ditambahkan kepada Tuhan.
