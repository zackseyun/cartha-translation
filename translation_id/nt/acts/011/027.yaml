  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: id
  text: Pada waktu itu, beberapa nabi turun dari Yerusalem ke Antiokhia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Pada masa itu
  rationale: Ungkapan ini memberi bingkai waktu bagi peristiwa tersebut. Partikel δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: κατῆλθον
  choice: datang
  rationale: κατέρχομαι dapat berarti ‘datang turun’ atau ‘pergi turun’. Dalam bahasa Indonesia, ‘datang’ wajar dari sudut tempat tujuan; unsur gerak turun tidak dinyatakan dalam teks utama karena kurang alami dalam konteks perjalanan antarkota, tetapi dicatat dalam catatan kaki.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: dari Yerusalem
  rationale: ἀπό menyatakan titik asal. Walaupun nama kota itu berbentuk jamak secara morfologis dalam bahasa Yunani, nama Indonesianya secara baku ialah ‘Yerusalem’.
- source_word: προφῆται
  choice: beberapa nabi
  rationale: ‘Nabi’ mempertahankan istilah umum dalam teks tanpa mempersempit peran mereka. Bahasa Yunani tidak memakai kata yang secara eksplisit berarti ‘beberapa’, tetapi bentuk jamak tak tentu ini secara alami dinyatakan demikian dalam bahasa Indonesia dan tidak menyiratkan semua nabi.
- source_word: εἰς Ἀντιόχειαν
  choice: ke Antiokhia
  rationale: εἰς menyatakan gerak menuju suatu tempat; ‘ke Antiokhia’ merupakan bentuk Indonesia yang alami.
theological_decisions:
- issue: Hakikat para ‘nabi’ dalam konteks jemaat Yerusalem dan Antiokhia
  choice: Memakai istilah ‘nabi’ tanpa penjelasan tambahan
  alternative: guru yang bernubuat; utusan yang diilhami
  rationale: Teks Yunani tidak menjelaskan secara khusus lingkup pelayanan mereka. Istilah yang luas mempertahankan ambiguitas itu dan tidak memasukkan pandangan denominasi tertentu tentang jabatan atau karunia nabi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. ‘Pada masa itu’ dipilih sebagai bingkai naratif yang alami; ‘Antiokhia’ mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
