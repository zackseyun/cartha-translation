  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: id
  text: Lalu aku juga mendengar suatu suara berkata kepadaku, “Bangunlah, Petrus, sembelihlah dan makanlah!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: Lalu aku juga mendengar
  rationale: Menjaga unsur kelanjutan narasi dari δέ dan penambahan dari καί dalam susunan Indonesia yang alami.
- source_word: φωνῆς
  choice: suatu suara
  rationale: Menerjemahkan bentuk genitif yang menjadi objek verba mendengar secara idiomatis tanpa menentukan identitas suara lebih jauh.
- source_word: Ἀναστάς
  choice: Bangunlah
  rationale: Partisip aoris imperatif ini secara idiomatis menyuruh Petrus bangkit untuk bertindak; 'Bangunlah' wajar dan tetap dekat dengan citra dasarnya.
- source_word: θῦσον
  choice: sembelihlah
  rationale: Dalam konteks membunuh hewan untuk dimakan, 'sembelihlah' lebih tepat daripada istilah umum 'bunuhlah' dan tidak dengan sendirinya mengharuskan makna pengorbanan ritual.
- source_word: φάγε
  choice: makanlah
  rationale: Padanan imperatif langsung dan alami bagi perintah aoris φάγε.
theological_decisions:
- issue: Apakah θῦσον menyatakan kurban ritual
  choice: sembelihlah
  alternative: korbankanlah / bunuhlah
  rationale: Konteks penglihatan adalah membunuh hewan lalu memakannya. 'Sembelihlah' mempertahankan tindakan terhadap hewan tanpa mengimpor gagasan bahwa Petrus diperintahkan mempersembahkan kurban ritual.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah memakai akhiran -lah untuk menjaga nada langsung namun wajar; tanda seru mencerminkan kekuatan rangkaian perintah.
