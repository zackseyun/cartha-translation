base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: id
  text: kata mereka, “Engkau pergi kepada orang-orang yang tidak bersunat[a] dan makan bersama mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang memiliki kulup”; ungkapan ini menunjuk kepada mereka yang tidak memiliki tanda perjanjian Yahudi berupa sunat, yaitu orang-orang bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel kini ini melanjutkan narasi sebelumnya dan memperkenalkan isi tuduhan; bentuk ini alami dalam bahasa Indonesia serta tetap menunjukkan bahwa merekalah yang mengucapkannya.
- source_word: ὅτι
  choice: tanda kutip langsung
  rationale: ὅτι memperkenalkan perkataan langsung; tanda kutip merupakan padanan yang wajar dalam bahasa Indonesia.
- source_word: Εἰσῆλθες
  choice: Engkau masuk
  rationale: Aoristus εἰσέρχομαι menyatakan tindakan masuk yang telah terjadi; 'masuk' mempertahankan gambaran konkret dalam tuduhan itu.
- source_word: πρὸς ἄνδρας
  choice: ke rumah orang-orang
  rationale: πρός dengan orang dapat menyatakan gerak menuju atau masuk ke lingkungan mereka. Penambahan 'rumah' membuat ungkapan masuk kepada orang menjadi wajar dalam bahasa Indonesia dan sesuai dengan konteks kunjungan serta perjamuan, tanpa mengubah pokok tuduhan.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: yang tidak bersunat
  rationale: Ungkapan harfiah 'memiliki kulup' merupakan idiom Yahudi bagi laki-laki yang tidak bersunat. Padanan ini jelas dan mempertahankan penandaan batas perjanjian yang ditekankan oleh para penuduh.
- source_word: καὶ
  choice: dan
  rationale: Menghubungkan kedua tindakan yang dipersoalkan secara langsung.
- source_word: συνέφαγες αὐτοῖς
  choice: makan bersama mereka
  rationale: Kata kerja majemuk συνεσθίω menekankan makan bersama; padanan ini alami dan mempertahankan unsur persekutuan makan.
theological_decisions:
- issue: Apakah ἀκροβυστίαν ἔχοντας diterjemahkan secara interpretatif sebagai 'orang bukan Yahudi' atau mempertahankan bahasa sunat
  choice: orang-orang yang tidak bersunat
  alternative: orang-orang bukan Yahudi
  rationale: Para penuduh merumuskan keberatan mereka berdasarkan penanda perjanjian dan batas sosial-keagamaan, bukan sekadar identitas etnis. Bahasa 'tidak bersunat' mempertahankan tekanan dan ketegangan teologis dalam teks Yunani.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan lugas. ''Engkau'' dipakai untuk sapaan tunggal dalam kutipan yang bernada tuduhan. Susunan kalimat mempertahankan dua pokok keberatan: memasuki rumah mereka dan makan bersama mereka.'
