  naturalness: “Kata mereka” dan “makan bersama mereka” alami dalam Bahasa Indonesia baku. “Engkau masuk kepada orang-orang yang tidak bersunat” juga dapat dipahami, tetapi “Engkau pergi kepada orang-orang yang tidak bersunat” lebih idiomatis dan tidak menambahkan lokasi yang tidak ada dalam sumber.
  terminology: “Tidak bersunat” mempertahankan istilah serta nada keberatan terkait penanda perjanjian. Catatan kaki yang menjelaskan bahwa ungkapan itu merujuk kepada orang bukan Yahudi sudah membantu, tetapi “memiliki kulup” sebagai harfiah berpotensi terdengar seolah-olah sekadar deskripsi anatomi; dapat dijelaskan sebagai ungkapan Yunani tanpa menggeser terjemahan utama.
