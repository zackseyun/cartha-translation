  source_fidelity: 'Teks utama pada dasarnya setia kepada Yunani: χεὶρ κυρίου diterjemahkan secara metaforis, μετ’ αὐτῶν tersampaikan melalui “menyertai mereka,” dan ἐπέστρεψεν ἐπὶ τὸν κύριον dipertahankan tanpa memperjelas rujukan “Tuhan.” Namun, kata penghubung pembuka καὶ (“Dan”) sebaiknya tidak dihilangkan. Catatan kaki juga perlu diikat langsung pada “percaya” dan dirumuskan sebagai alternatif partisip, bukan sebagai urutan waktu yang lebih tegas.'
  naturalness: “Tangan Tuhan menyertai mereka” dan “sejumlah besar orang” wajar dalam bahasa Indonesia baku. “Berpaling kepada Tuhan” merupakan padanan yang lebih idiomatis dan lazim dalam register Alkitab Indonesia untuk arah konversi yang dinyatakan oleh ἐπιστρέφω, sambil tetap mempertahankan metafora arah.
  terminology: “Tuhan” dipertahankan pada kedua kemunculan dan tidak diperluas menjadi “Yesus” atau “Allah.” Istilah ini mempertahankan keterbukaan rujukan dalam teks sumber. Metafora “tangan Tuhan” juga dipertahankan.
