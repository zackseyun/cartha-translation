  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: id
  text: Dan tangan Tuhan menyertai mereka, dan sejumlah besar orang yang percaya[a] berpaling kepada Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah percaya.”
    reason: Partisip aoris Yunani dapat diterjemahkan dengan nuansa tindakan yang telah terjadi, tanpa harus menegaskan urutan waktu tertentu terhadap tindakan berpaling.
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: Tangan Tuhan
  rationale: Terjemahan ini mempertahankan metafora biblis tentang kuasa atau perkenanan Tuhan yang bekerja secara aktif, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar baku ini mempertahankan cakupan makna teks Yunani tanpa mempersempit rujukannya menjadi 'Yesus' atau 'Allah' secara eksplisit.
- source_word: μετ’ αὐτῶν
  choice: menyertai mereka
  rationale: Dalam konteks ungkapan 'tangan Tuhan', 'menyertai' secara alami menyatakan kehadiran, dukungan, dan karya Tuhan bersama mereka.
- source_word: πολύς τε ἀριθμός
  choice: sejumlah besar orang
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan konstruksi nominal yang menunjuk kepada banyak orang.
- source_word: ὁ πιστεύσας
  choice: yang percaya
  rationale: Partisip aoris berartikel ini menerangkan kelompok orang tersebut. 'Yang percaya' mempertahankan hubungan gramatikalnya tanpa memaksakan urutan waktu yang tegas.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: berbalik kepada Tuhan
  rationale: Pilihan ini mempertahankan gambaran perubahan arah menuju Tuhan dan makna pertobatan atau konversi yang tersirat, tanpa menambahkan kata 'bertobat' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan gelar κύριος dalam ayat ini
  choice: Tuhan pada kedua kemunculan
  alternative: Menjelaskannya secara eksplisit sebagai Yesus atau sebagai Allah
  rationale: Teks Yunani hanya memakai κύριος. Walaupun konteks Kisah Para Rasul dapat mengarah kepada Yesus, terjemahan tidak mempersempit ambiguitas yang masih terdapat dalam bentuk sumber.
- issue: Hubungan percaya dan berbalik kepada Tuhan
  choice: yang percaya berbalik kepada Tuhan
  alternative: setelah percaya, berbalik kepada Tuhan
  rationale: Partisip aoris dapat dibaca sebagai tindakan yang menyertai atau mendahului verba utama. Teks utama mempertahankan bentuk relatif yang alami dan tidak menetapkan urutan logis atau kronologis secara berlebihan; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'Tangan Tuhan' dipertahankan karena dikenal dalam bahasa Alkitab dan cukup jelas dari konteks; susunan kalimat dibuat alami bagi pembaca umum.
