  naturalness: Teks revisi menggunakan bahasa Indonesia baku dan lancar. "Sambil berdoa" menyatakan hubungan partisipel yang sezaman secara alami. "Dengan keempat sudutnya" lebih tepat dan jelas daripada "pada keempat sudutnya" untuk cara kain itu diturunkan.
