  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: id
  text: '“Aku sedang berada di kota Yope sambil berdoa. Dalam keadaan ekstase, aku melihat suatu penglihatan: sebuah benda[a] seperti selembar kain besar sedang turun, diturunkan dari surga dengan keempat sudutnya[b], dan benda itu sampai kepadaku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suatu wadah.” Kata Yunani yang dipakai memiliki arti luas, yaitu benda, perkakas, wadah, atau bejana.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “diturunkan dari surga dengan keempat ujungnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Aku sedang berada di kota Yope dan berdoa
  rationale: Bentuk orang pertama dan partisipel kini menyatakan keadaan serta tindakan yang sedang berlangsung. Nama tradisional Indonesia “Yope” dipakai untuk Ἰόππη, dan unsur πόλις tetap dinyatakan dengan “kota”.
- source_word: ἐν ἐκστάσει
  choice: dalam keadaan seperti tidak sadar
  rationale: Ungkapan ini menyampaikan keadaan kesadaran yang berubah dalam pengalaman penglihatan tanpa memakai “ekstase,” yang dalam bahasa Indonesia dapat memberi kesan emosi atau mistisisme yang tidak mesti dimaksudkan.
- source_word: ὅραμα
  choice: suatu penglihatan
  rationale: Padanan baku dan jelas bagi pengalaman penglihatan yang bersifat pewahyuan dalam Kisah Para Rasul.
- source_word: σκεῦός τι
  choice: sebuah benda
  rationale: σκεῦος adalah istilah luas untuk benda, perkakas, wadah, atau bejana, sedangkan τι membuatnya tidak tentu. “Sebuah benda” tidak menentukan bentuknya sebelum perbandingan berikutnya.
- source_word: ὡς ὀθόνην μεγάλην
  choice: seperti selembar kain besar
  rationale: ὀθόνη menunjuk pada kain lebar atau lembaran kain. Padanan ini menghasilkan gambaran yang jelas tanpa menambahkan bahan tertentu seperti linen.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: sedang turun, diturunkan dari surga
  rationale: 'Kedua partisipel dipertahankan: benda itu tampak bergerak turun dan berada dalam tindakan pasif diturunkan dari surga.'
- source_word: τέσσαρσιν ἀρχαῖς
  choice: pada keempat sudutnya
  rationale: ἀρχή di sini berarti ujung atau bagian ekstrem. “Keempat sudutnya” merupakan gambaran alami untuk selembar kain, sementara hubungan tepat datifnya tetap diberi alternatif dalam catatan kaki.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: lalu sampai kepadaku
  rationale: ἄχρι menandai gerakan sampai ke posisi Petrus. “Sampai kepadaku” lebih tepat daripada sekadar “datang kepadaku” dan “lalu” mengungkapkan kelanjutan narasi.
theological_decisions:
- issue: Istilah bagi keadaan penglihatan Petrus
  choice: dalam keadaan seperti tidak sadar, aku melihat suatu penglihatan
  alternative: dalam keadaan ekstase, aku melihat suatu penglihatan
  rationale: Terjemahan mempertahankan ἔκστασις dan ὅραμα sebagai dua unsur yang berbeda—keadaan Petrus dan hal yang dilihatnya—tanpa menambahkan gagasan bahwa ia sepenuhnya kehilangan kesadaran atau mengalami emosi mistis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat dipecah setelah latar tindakan agar mudah dibaca. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
