id: ACT.11.23
reference: Acts 11:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: id
  text: Ketika ia tiba dan melihat anugerah Allah[a], ia bersukacita dan terus mendorong mereka semua untuk tetap berpaut kepada Tuhan dengan tekad hati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih karunia Allah.” Frasa ini dapat menunjuk pada bukti nyata karya kemurahan Allah di antara mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk tetap bersama Tuhan” atau “untuk tetap setia kepada Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: ketika ia tiba
  rationale: Partisip aoris menyatakan tibanya Barnabas di tempat itu; bentuk temporal ini alami dalam bahasa Indonesia.
- source_word: ἰδὼν
  choice: melihat
  rationale: Mempertahankan bahasa penglihatan yang biasa tanpa mempersempitnya menjadi sekadar persepsi batin.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: anugerah Allah
  rationale: Menjaga bobot teologis χάρις dan membiarkan frasa itu mencakup karya kemurahan Allah yang tampak di antara mereka.
- source_word: ἐχάρη
  choice: ia bersukacita
  rationale: Padanan alami dan bermartabat untuk bentuk yang bermakna bersukacita atau menjadi gembira.
- source_word: παρεκάλει
  choice: terus mendorong
  rationale: Aspek imperfek menunjukkan tindakan yang berlangsung atau berulang; 'mendorong' mencakup unsur anjuran dan penguatan.
- source_word: πάντας
  choice: mereka semua
  rationale: Secara wajar menunjuk kepada seluruh orang percaya yang dijumpainya dalam konteks.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: dengan tekad hati
  rationale: πρόθεσις menunjuk pada maksud atau ketetapan hati, sedangkan καρδία menunjuk pada pusat kehendak batin; frasa ini ringkas dan alami.
- source_word: προσμένειν
  choice: untuk tetap berpaut
  rationale: Mengungkapkan keberlanjutan hubungan dan keteguhan keterikatan tanpa memasukkan kategori doktrinal yang lebih sempit.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Mempertahankan gelar κύριος; dalam konteks Kisah Para Rasul referennya adalah Yesus yang bangkit.
theological_decisions:
- issue: Makna 'anugerah Allah' dalam konteks
  choice: Frasa dipertahankan sebagai 'anugerah Allah', dengan kemungkinan menunjuk pada karya kemurahan Allah yang dapat diamati di antara orang-orang percaya di Antiokhia.
  alternative: Memparafrasakannya sebagai 'apa yang telah Allah lakukan' atau memahaminya sebagai sikap murah hati.
  rationale: Terjemahan tidak menutup keluasan makna teologis frasa Yunani, sementara catatan menjelaskan implikasi kontekstualnya.
- issue: Daya ungkap προσμένειν τῷ κυρίῳ
  choice: tetap berpaut kepada Tuhan
  alternative: tetap bersama Tuhan; tetap setia kepada Tuhan
  rationale: Pilihan ini menyampaikan keberlanjutan dan keterikatan yang teguh, tetapi tidak secara diam-diam menjadikannya istilah teknis mengenai doktrin ketekunan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Anugerah' dipilih sebagai istilah yang mudah dipahami dan berbobot teologis; alternatif tradisional 'kasih karunia' dicantumkan dalam catatan. Susunan kalimat mengikuti alur Yunani secara alami tanpa mempertahankan kekakuan sintaksisnya.
