id: ACT.11.15
reference: Acts 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: id
  text: Ketika aku mulai berbicara[a], Roh Kudus turun ke atas mereka, sama seperti Ia juga turun ke atas kita pada mulanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Pada saat aku mulai berbicara.” Konstruksi Yunaninya menyatakan waktu yang bersamaan.
    reason: lexical_alternative
  - marker: b
    text: “Pada mulanya” kemungkinan menunjuk pada pencurahan Roh atas para murid pada hari Pentakosta.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Ketika aku mulai berbicara
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan waktu yang bersamaan. Pilihan ini alami dalam bahasa Indonesia dan menunjukkan bahwa peristiwa itu terjadi pada awal Petrus berbicara.
- source_word: ἐπέπεσεν
  choice: turun ke atas
  rationale: Ungkapan ini mempertahankan gambaran kuat dari ἐπιπίπτω dan pemakaian khasnya bagi kedatangan Roh atas orang-orang dalam Kisah Para Rasul, tanpa menjelaskannya secara berlebihan.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Ini adalah padanan baku, jelas, dan wajar dalam bahasa Indonesia modern.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: sama seperti Ia juga turun ke atas kita
  rationale: ὥσπερ menyatakan perbandingan yang erat dan καί mempertahankan unsur 'juga'. Kata kerja yang tersirat diulangi agar kalimat alami dan jelas dalam bahasa Indonesia.
- source_word: ἐν ἀρχῇ
  choice: pada mulanya
  rationale: Padanan ini mempertahankan acuan temporal yang luas dalam teks dan tidak memasukkan nama peristiwa tertentu ke dalam terjemahan utama.
theological_decisions:
- issue: Acuan frasa ἐν ἀρχῇ
  choice: Diterjemahkan secara luas sebagai 'pada mulanya'.
  alternative: Menjelaskannya langsung sebagai 'pada hari Pentakosta' atau menerjemahkannya 'pada awalnya'.
  rationale: Dalam konteks, frasa itu kemungkinan besar menunjuk pada pencurahan Roh yang pertama atas para murid, khususnya pada hari Pentakosta. Namun, teks Yunani sendiri tidak menyebut Pentakosta di ayat ini, sehingga terjemahan utama mempertahankan keluasan ungkapannya dan catatan kaki memberi penjelasan kontekstual.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan perbandingan antara pengalaman mereka dan pengalaman para saksi mula-mula, sambil menghindari penjelasan teologis yang tidak dinyatakan langsung dalam teks.
