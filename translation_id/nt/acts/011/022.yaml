  terminology: “Jemaat,” “mengutus,” “Barnabas,” “Yerusalem,” dan “Antiokhia” konsisten dengan penggunaan Alkitab bahasa Indonesia yang lazim. Tidak ada muatan teologis atau penafsiran denominasi yang ditambahkan.
