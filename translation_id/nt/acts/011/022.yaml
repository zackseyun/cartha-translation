id: ACT.11.22
reference: Acts 11:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: id
  text: Kabar tentang mereka sampai ke telinga jemaat di Yerusalem[a], lalu jemaat itu mengutus Barnabas sampai ke Antiokhia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kabar tentang mereka terdengar oleh jemaat di Yerusalem”; secara harfiah, “Kabar tentang mereka terdengar sampai ke telinga jemaat yang ada di Yerusalem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη ... εἰς τὰ ὦτα
  choice: sampai ke telinga
  rationale: Ungkapan ini secara harfiah menggambarkan kabar yang 'terdengar ke telinga'; 'sampai ke telinga' mempertahankan gambaran Yunani sekaligus alami dalam bahasa Indonesia.
- source_word: ὁ λόγος
  choice: kabar
  rationale: Dalam konteks ini λόγος menunjuk pada kabar mengenai orang-orang dan peristiwa yang baru diceritakan, bukan perkataan atau khotbah formal.
- source_word: ἐκκλησίας τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: jemaat di Yerusalem
  rationale: Frasa partisipial itu mengidentifikasi jemaat yang dimaksud; bentuk ringkas ini wajar dan tepat dalam bahasa Indonesia.
- source_word: περὶ αὐτῶν
  choice: tentang mereka
  rationale: Terjemahan ini mempertahankan rujukan pronominal yang sengaja tidak diperjelas oleh teks sumber.
- source_word: ἐξαπέστειλαν
  choice: mengutus
  rationale: Dalam konteks pengiriman seseorang untuk menjalankan tugas, 'mengutus' menyampaikan makna send out secara alami dan bermartabat.
- source_word: Βαρναβᾶν
  choice: Barnabas
  rationale: Mengikuti bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἕως Ἀντιοχείας
  choice: sampai ke Antiokhia
  rationale: ἕως menyatakan batas jangkauan atau tujuan; 'sampai ke' mempertahankan nuansa itu lebih dekat daripada sekadar 'ke'.
theological_decisions:
- issue: Subjek verba 'mengutus'
  choice: Jemaat di Yerusalem secara kolektif, dibuat eksplisit sebagai 'jemaat itu'
  alternative: Para pemimpin yang tidak disebutkan secara khusus di dalam jemaat Yerusalem
  rationale: Anteseden eksplisit terdekat ialah jemaat di Yerusalem. Teks tidak menyebut rasul atau penatua sebagai subjek, sehingga terjemahan tidak mempersempit pelakunya kepada kelompok kepemimpinan tertentu.
- issue: Rujukan περὶ αὐτῶν
  choice: Dipertahankan sebagai 'tentang mereka'
  alternative: Diperjelas menjadi 'tentang orang-orang percaya itu' atau dipahami sebagai 'tentang semua kejadian itu'
  rationale: Bentuk maskulin jamak paling alami merujuk kepada orang-orang yang baru disebutkan, tetapi cakupan kontekstualnya dapat melibatkan kabar mengenai peristiwa tersebut. Terjemahan mempertahankan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Jemaat' dipilih sebagai padanan lazim ἐκκλησία. Penghubung δέ diterjemahkan secara ringan dengan 'lalu' pada klausa kedua agar alur naratif alami tanpa menambahkan penanda waktu 'sekarang' yang tidak terdapat dalam sumber.
