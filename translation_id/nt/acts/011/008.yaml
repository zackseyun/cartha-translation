  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: id
  text: Tetapi aku berkata, “Sekali-kali tidak, Tuhan, sebab tidak ada sesuatu pun yang haram atau najis pernah masuk ke dalam mulutku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Sekali-kali tidak
  rationale: Mengungkapkan penolakan tegas dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: κύριε
  choice: Tuhan
  rationale: Sapaan langsung kepada Tuhan; bentuk ini sesuai dengan konteks penglihatan Petrus.
- source_word: κοινὸν
  choice: cemar
  rationale: Dalam konteks aturan makanan, kata ini menunjuk pada sesuatu yang dianggap tidak layak atau tercemar secara ritual. “Cemar” mempertahankan perbedaannya dari ἀκάθαρτον tanpa memakai arti harfiah “umum” yang menyesatkan dalam bahasa Indonesia.
- source_word: ἀκάθαρτον
  choice: najis
  rationale: Padanan lazim dan jelas untuk keadaan tidak tahir, khususnya dalam konteks ritual dan makanan.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: masuk ke dalam mulutku
  rationale: Mempertahankan gambaran konkret teks Yunani dan menyampaikan bahwa Petrus tidak pernah memakan hal semacam itu.
theological_decisions:
- issue: Perbedaan antara κοινόν dan ἀκάθαρτον
  choice: cemar atau najis
  alternative: haram atau tidak tahir
  rationale: Pilihan ini mempertahankan dua istilah Yunani yang berdekatan tetapi tidak identik, tanpa menyamakan keduanya atau memasukkan kategori hukum agama yang terlalu spesifik.
- issue: Hubungan klausa ὅτι dengan penolakan Petrus
  choice: sebab
  alternative: karena
  rationale: ὅτι menjelaskan alasan penolakan Petrus. “Sebab” menyatakan hubungan kausal itu secara jelas dan alami.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “Sekali-kali tidak” mempertahankan ketegasan ucapan Petrus, sedangkan “cemar atau najis” menjaga pembedaan leksikal dalam teks sumber.
