  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: id
  text: Roh berkata kepada saya agar saya pergi bersama mereka tanpa membeda-bedakan.[a] Keenam saudara ini juga datang bersama saya, lalu kami masuk ke rumah lelaki itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa ragu-ragu” atau “tanpa bimbang.” Partisip Yunani ini dapat berarti tidak membeda-bedakan ataupun tidak ragu-ragu.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Roh
  rationale: Dalam konteks tuntunan ilahi di Kisah Para Rasul, frasa ini merujuk kepada Roh Kudus. Terjemahan “Roh” mempertahankan bentuk Yunani yang tidak secara eksplisit memakai kata “Kudus”.
- source_word: εἶπεν ... μοι
  choice: berkata kepadaku
  rationale: Ungkapan ini menerjemahkan konstruksi Yunani secara langsung dan tetap alami dalam bahasa Indonesia ketika memperkenalkan suatu perintah.
- source_word: συνελθεῖν αὐτοῖς
  choice: agar aku pergi bersama mereka
  rationale: Infinitif συνέρχομαι di sini menyatakan tindakan menyertai orang-orang tersebut. Bentuk “agar aku pergi” mengungkapkan isi perintah secara wajar.
- source_word: μηδὲν διακρίναντα
  choice: tanpa membeda-bedakan
  rationale: διακρίνω dapat berarti membuat pembedaan, ragu, atau bimbang. Dalam konteks Petrus melintasi batas sosial antara orang Yahudi dan bukan Yahudi, makna tidak membeda-bedakan paling sesuai, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: keenam saudara ini
  rationale: “Saudara” tepat karena yang dimaksud ialah enam rekan laki-laki Petrus, sedangkan “ini” mempertahankan οὗτοι.
- source_word: εἰσήλθομεν
  choice: kami masuk
  rationale: Terjemahan sederhana dan alami untuk bentuk aoris ini dalam narasi Indonesia.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: rumah orang itu
  rationale: ἀνήρ menunjuk kepada seorang laki-laki tertentu yang telah disebut dalam konteks. “Orang itu” alami dalam bahasa Indonesia dan tetap mempertahankan nomina eksplisit, bukan menggantinya dengan kata ganti kepunyaan.
theological_decisions:
- issue: Makna μηδὲν διακρίναντα dalam laporan Petrus
  choice: tanpa membeda-bedakan
  alternative: tanpa ragu-ragu; tanpa bimbang
  rationale: Konteks langsung menyangkut tindakan Petrus memasuki rumah orang bukan Yahudi dan pembelaannya di hadapan orang percaya Yahudi. Makna tidak membuat pembedaan mempertahankan penekanan konteks itu, tetapi kemungkinan makna keraguan atau kebimbangan tetap dicatat karena frasa Yunani memang ambigu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan ambiguitas leksikal utama melalui catatan kaki.
