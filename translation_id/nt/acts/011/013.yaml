  to: Ia menceritakan kepada kami bagaimana ia melihat malaikat itu berdiri di rumahnya dan berkata, “Utuslah ke Yope dan panggillah Simon[a] yang disebut Petrus.”
  rationale: Revisi menghapus penambahan objek “orang” agar imperatif Ἀπόστειλον tetap tidak berobjek eksplisit seperti dalam teks Yunani. Penanda catatan kaki dipindahkan ke “panggillah Simon” dan isi catatan disesuaikan agar hanya menjelaskan alternatif untuk μεταπέμψαι tanpa mengaburkan bagian yang dirujuk.
