  naturalness: Kalimat revisi tetap alami dalam bahasa Indonesia baku dan mempertahankan alur laporan tidak langsung. “Utuslah ke Yope” mempertahankan objek yang tersirat dalam teks sumber, meskipun lebih padat daripada ungkapan yang menambahkan “orang”.
  terminology: “Malaikat itu”, “Yope”, “Simon”, dan “Petrus” tepat dan konsisten dengan register Alkitab Indonesia. “Panggillah” merupakan padanan yang wajar bagi μεταπέμψαι, dengan alternatif “suruhlah menjemput” dijelaskan dalam catatan kaki.
