  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: id
  text: Ia menceritakan kepada kami bagaimana ia melihat malaikat itu berdiri di rumahnya dan berkata, “Utuslah ke Yope dan panggillah Simon[a] yang disebut Petrus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suruhlah menjemput Simon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: menceritakan
  rationale: Kata kerja ini menyatakan penyampaian laporan atau kisah kepada orang lain; “menceritakan” alami dalam konteks naratif lisan ini.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan; kesinambungannya sudah wajar dalam bahasa Indonesia tanpa kata penghubung eksplisit.
- source_word: πῶς
  choice: bagaimana
  rationale: Mempertahankan nuansa cara atau isi laporan, bukan meratakannya menjadi sekadar “bahwa”.
- source_word: εἶδεν
  choice: melihat
  rationale: Bahasa Indonesia tidak memerlukan bentuk lampau sempurna untuk menunjukkan bahwa penglihatan itu mendahului penceritaan; urutan peristiwa jelas dari konteks.
- source_word: τὸν ἄγγελον
  choice: malaikat itu
  rationale: Artikel Yunani menunjuk kepada malaikat tertentu dalam penglihatan Kornelius yang telah dikenal dalam alur cerita.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: di dalam rumahnya
  rationale: Menunjukkan lokasi fisik penglihatan secara langsung dan alami.
- source_word: σταθέντα
  choice: berdiri
  rationale: Partisip ini menggambarkan posisi atau kehadiran malaikat dalam penglihatan.
- source_word: εἰπόντα
  choice: dan berkata
  rationale: Koordinasi dengan “berdiri” diungkapkan secara alami dalam bahasa Indonesia sambil mempertahankan tindakan malaikat yang berbicara.
- source_word: Ἀπόστειλον
  choice: Suruhlah orang
  rationale: Imperatif ini secara harfiah berarti “utuslah”; objeknya tersirat. Dalam bahasa Indonesia, “suruhlah orang” menyampaikan tindakan mengutus seseorang tanpa menentukan jumlah atau identitas yang tidak disebutkan teks.
- source_word: εἰς Ἰόππην
  choice: ke Yope
  rationale: “Ke” menyatakan tujuan, dan “Yope” adalah bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: μετάπεμψαι
  choice: panggillah
  rationale: Kata kerja ini berarti menyuruh orang menjemput atau meminta seseorang datang; “panggillah” alami dan ringkas, sedangkan nuansa “suruhlah orang menjemput” dicatat dalam catatan kaki.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: Simon yang disebut Petrus
  rationale: Mempertahankan fungsi atributif yang mengidentifikasi Simon melalui nama yang dipakainya.
