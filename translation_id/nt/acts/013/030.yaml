  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: id
  text: Namun, Allah membangkitkan Dia dari antara orang mati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Dalam konteks ini, δέ menandai pertentangan dengan tindakan manusia pada ayat sebelumnya. “Namun” menyampaikan daya adversatif itu secara alami dan bermartabat.
- source_word: θεὸς
  choice: Allah
  rationale: Kata ini secara langsung menunjuk kepada Allah sebagai pelaku tindakan; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: ἤγειρεν
  choice: membangkitkan
  rationale: Dalam konteks kebangkitan, ἐγείρω berarti membangkitkan dari kematian. “Membangkitkan” jelas dan lazim tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini mengacu kepada Yesus dalam konteks langsung. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mempertahankan gambaran Yunani tentang kebangkitan keluar dari antara mereka yang mati dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rumusan kebangkitan
  choice: Namun, Allah membangkitkan Dia dari antara orang mati.
  alternative: Namun, Allah membangkitkan Dia dari kematian.
  rationale: Pilihan utama secara eksplisit menisbahkan kebangkitan Yesus kepada tindakan Allah dan lebih dekat dengan ungkapan ἐκ νεκρῶν. Alternatifnya alami, tetapi menggeser ungkapan dari kelompok orang mati kepada keadaan kematian.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kontras wacana dipertahankan dengan “Namun”, sedangkan idiom kebangkitan diterjemahkan secara dekat dan tetap mudah dipahami.
