  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: id
  text: Lalu Paulus berdiri, memberi isyarat dengan tangannya, dan berkata, “Hai, orang-orang Israel dan kalian yang takut akan Allah[a], dengarkanlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “yang takut akan Allah” kemungkinan menunjuk kepada orang-orang bukan Yahudi yang beribadah kepada Allah dan terkait dengan sinagoge; mereka kadang disebut “orang-orang yang takut akan Allah.”
    reason: Menjelaskan kemungkinan fungsi historis ungkapan Yunani tanpa mengubah deskripsi dalam teks utama menjadi label teknis.
lexical_decisions:
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini menyatakan tindakan fisik Paulus sebelum berbicara. “Berdiri” alami dan konkret dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ melanjutkan alur cerita, bukan menyatakan pertentangan kuat. “Lalu” menyampaikan perkembangan naratif dengan wajar.
- source_word: κατασείσας τῇ χειρὶ
  choice: memberi isyarat dengan tangannya
  rationale: Ungkapan ini menggambarkan gerakan tangan untuk menarik perhatian atau meminta ketenangan. Pilihan ini alami dan tidak memberi kesan bahwa Paulus melambaikan tangan dengan heboh.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan naratif yang lazim untuk memperkenalkan perkataan langsung.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Saudara-saudara Israel
  rationale: Sapaan ini ditujukan kepada laki-laki Israel. “Saudara-saudara Israel” merupakan sapaan Indonesia yang alami dan terhormat tanpa menghilangkan nuansa persaudaraan dalam konteks sinagoge.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: kalian yang takut akan Allah
  rationale: Terjemahan ini mempertahankan bentuk deskriptif dan daya verbal partisip Yunani, serta tidak mengubahnya menjadi istilah teknis dalam teks utama.
- source_word: ἀκούσατε
  choice: dengarkanlah
  rationale: Imperatif aoris ini meminta perhatian penuh. “Dengarkanlah” langsung, alami, dan sesuai dengan suasana pidato resmi.
theological_decisions:
- issue: Sapaan kepada orang Israel dan kelompok yang takut akan Allah di sinagoge
  choice: “Saudara-saudara Israel dan kalian yang takut akan Allah”
  alternative: “Orang-orang Israel dan para penyembah Allah” atau “Saudara-saudara Israel dan para takut-Allah”
  rationale: Teks Yunani membedakan orang Israel dari kelompok kedua yang digambarkan takut akan Allah, kemungkinan besar orang bukan Yahudi yang beribadah bersama komunitas sinagoge. Terjemahan mempertahankan pembedaan itu tanpa menjadikan kesimpulan historis tersebut eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai karena Paulus menyapa langsung kelompok kedua, sedangkan “Saudara-saudara Israel” mempertahankan bentuk sapaan publik yang terhormat. Tanda seru pada perintah akhir menyampaikan seruan untuk memberi perhatian tanpa berlebihan.
