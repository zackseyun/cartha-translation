  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: id
  text: Kemudian, setelah berpuasa dan berdoa, mereka menumpangkan tangan ke atas Barnabas dan Saulus, lalu membiarkan mereka pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melepas mereka” atau “menyuruh mereka pergi.” Dalam konteks ini, Barnabas dan Saulus diizinkan pergi untuk menjalankan misi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa sesudah arahan Roh Kudus dalam ayat sebelumnya dengan bahasa Indonesia yang wajar.
- source_word: νηστεύσαντες καὶ προσευξάμενοι
  choice: setelah berpuasa dan berdoa
  rationale: Kedua partisip aoris menyatakan tindakan persiapan yang mendahului verba utama; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: mereka menumpangkan tangan atas Barnabas dan Saulus
  rationale: Mempertahankan tindakan konkret dalam teks tanpa menafsirkan secara khusus apakah tindakan itu merupakan penahbisan, pemberkatan, atau pengutusan formal. Nama kedua tokoh dipakai untuk memperjelas rujukan pronomina.
- source_word: ἀπέλυσαν
  choice: melepas keduanya untuk berangkat
  rationale: ἀπολύω secara leksikal dapat berarti melepaskan atau menyuruh pergi. Dalam konteks perjalanan misi, frasa ini menyampaikan bahwa mereka diizinkan dan diberangkatkan pergi, sambil mempertahankan nuansa dasar 'melepas'.
- source_word: αὐτοῖς
  choice: Barnabas dan Saulus / keduanya
  rationale: Rujukannya adalah Barnabas dan Saulus dari ayat sebelumnya. Pengungkapan eksplisit menghindari ketidakjelasan akibat dua kelompok yang sama-sama dapat disebut 'mereka' dalam bahasa Indonesia.
theological_decisions:
- issue: Makna penumpangan tangan
  choice: Menggambarkan tindakan itu secara langsung tanpa memberinya label teologis tertentu.
  alternative: Menafsirkannya secara eksplisit sebagai penahbisan, pemberkatan, atau pengutusan formal.
  rationale: Ayat ini menyebut puasa, doa, penumpangan tangan, dan pelepasan untuk berangkat, tetapi tidak menetapkan secara eksplisit status gerejawi atau makna sakramental tindakan tersebut.
- issue: Peran jemaat dalam keberangkatan Barnabas dan Saulus
  choice: melepas keduanya untuk berangkat
  alternative: mengutus keduanya
  rationale: Verba ἀπέλυσαν secara langsung berarti melepaskan atau menyuruh pergi; pilihan ini tidak mengaburkan peran Roh Kudus sebagai pihak yang memerintahkan pemisahan mereka pada ayat sebelumnya, tetapi tetap mencerminkan keterlibatan jemaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum. Nama Barnabas dan Saulus dinyatakan secara eksplisit untuk menjernihkan rujukan, sementara catatan kaki mempertahankan rentang makna ἀπέλυσαν.
