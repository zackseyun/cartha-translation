    rationale: 'πρός dengan akusatif di sini menunjukkan arah atau sasaran kesaksian: para saksi itu bersaksi kepada umat. “Di hadapan” dapat menyatakan lokasi atau situasi publik, tetapi tidak setepat relasi yang dimaksud.'
