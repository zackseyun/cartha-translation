revisions:
- from: Selama berhari-hari ia menampakkan diri kepada orang-orang yang telah menyertai dia pergi dari Galilea ke Yerusalem. Merekalah yang sekarang menjadi saksi-saksinya di hadapan umat itu.[a][b]
  to: Ia menampakkan diri[a] selama berhari-hari kepada orang-orang yang telah pergi bersama Dia dari Galilea ke Yerusalem. Merekalah yang sekarang menjadi saksi-Nya kepada umat.[b]
  rationale: Revisi memperbaiki arah kesaksian dari “di hadapan” menjadi “kepada,” menghapus demonstratif yang tidak ada dalam sumber, dan melancarkan ungkapan perjalanan bersama tanpa mengubah makna. Catatan kaki leksikal dan kultural dipertahankan, dengan jangkar yang ditempatkan pada unsur yang dijelaskannya.
