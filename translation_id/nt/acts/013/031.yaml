  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: id
  text: Ia menampakkan diri[a] selama berhari-hari kepada orang-orang yang telah pergi bersama Dia dari Galilea ke Yerusalem. Merekalah yang sekarang menjadi saksi-Nya kepada umat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia terlihat selama berhari-hari.” Dalam konteks penampakan sesudah kebangkitan, kata kerja Yunani ini juga dapat diterjemahkan secara lebih harfiah demikian.
    reason: lexical_alternative
  - marker: b
    text: “Umat” dalam konteks ini kemungkinan besar merujuk khusus kepada umat Israel atau orang Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: ia
  rationale: Kata ganti relatif ini merujuk kepada Yesus dalam ayat sebelumnya. Dalam bahasa Indonesia, memulai kalimat baru dengan “ia” terdengar alami dan tetap menjaga rujukannya.
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Bentuk pasif aoristus dari ὁράω dalam konteks penampakan sesudah kebangkitan lazim bermakna “menampakkan diri”. Pilihan ini alami dalam bahasa Indonesia tanpa menentukan secara berlebihan cara penampakan itu terjadi.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: selama berhari-hari
  rationale: Frasa ini menyatakan rentang waktu yang cukup panjang. “Selama berhari-hari” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: kepada orang-orang yang telah menyertai dia pergi
  rationale: Partisip ini menunjuk kepada orang-orang yang dahulu melakukan perjalanan bersama Yesus. “Telah menyertai dia pergi” menyampaikan tindakan yang mendahului penampakan tanpa membuat kalimat terlalu kaku.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: dari Galilea ke Yerusalem
  rationale: Terjemahan langsung ini mempertahankan arah perjalanan geografis. Nuansa “naik” menuju Yerusalem tidak perlu dipaksakan ke dalam ungkapan Indonesia karena dapat terdengar seperti keterangan medan semata.
- source_word: οἵτινες νῦν εἰσὶν
  choice: Merekalah yang sekarang menjadi
  rationale: Konstruksi ini menonjolkan bahwa kelompok tersebut adalah orang-orang yang kini menjalankan peran sebagai saksi, sesuai daya tekan οἵτινες.
- source_word: μάρτυρες αὐτοῦ
  choice: saksi-saksinya
  rationale: 'Bentuk ini alami dan mempertahankan hubungan genitif: mereka adalah para saksi milik/utusan Yesus sekaligus saksi mengenai dirinya.'
- source_word: πρὸς τὸν λαόν
  choice: di hadapan umat itu
  rationale: πρός menunjukkan arah kesaksian kepada suatu khalayak. “Di hadapan umat itu” secara alami menggambarkan pelayanan kesaksian mereka kepada umat yang dimaksud.
- source_word: λαόν
  choice: umat itu
  rationale: Dalam konteks Kisah Para Rasul, kata ini mengacu kepada umat Israel. “Umat itu” mempertahankan penyebutan yang tidak diperluas secara eksplisit, sedangkan catatan kaki menjelaskan acuannya.
theological_decisions:
- issue: Sifat bahasa penampakan sesudah kebangkitan
  choice: ia menampakkan diri
  alternative: ia terlihat
  rationale: “Menampakkan diri” merupakan padanan kontekstual yang wajar untuk ὤφθη dan menyampaikan penampakan Yesus yang bangkit tanpa mengurangi kesaksian historis yang ditekankan dalam konteks.
- issue: Cakupan “umat itu”
  choice: umat itu
  alternative: umat Israel
  rationale: Konteks sangat mungkin menunjuk kepada Israel atau orang Yahudi, tetapi teks Yunani hanya memakai λαός. Teks utama mempertahankan bentuk yang tidak diperluas, dan catatan kaki memberi keterangan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Ia” dipakai untuk Yesus, sedangkan “dia” dipakai setelah preposisi agar alurnya alami. Penanda catatan kaki ditempatkan langsung dalam teks utama.
