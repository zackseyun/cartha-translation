  source_fidelity: Draf secara umum setia pada makna Yunani, terutama dalam menerjemahkan ὤφθη sebagai “menampakkan diri” dan mempertahankan identitas kelompok saksi. Namun, πρὸς τὸν λαόν menyatakan arah kesaksian kepada suatu kelompok, sehingga “di hadapan umat itu” kurang tepat dibanding “kepada umat.” Demonstratif “itu” juga tidak dinyatakan dalam teks Yunani dan tidak diperlukan dalam bahasa Indonesia.
  naturalness: Kalimat draf dapat dipahami, tetapi “telah menyertai dia pergi” agak berat dan tidak selancar “telah pergi bersama Dia.” Susunan yang direvisi lebih lugas dan tetap bernada baku-modern.
  terminology: “Menampakkan diri,” “saksi-Nya,” dan “umat” sesuai dengan register Alkitab Indonesia modern serta tidak menambahkan penafsiran denominational. “Umat” mempertahankan λαός tanpa memperluasnya menjadi “Israel” dalam teks utama; keterangan konteks ditempatkan di catatan kaki.
