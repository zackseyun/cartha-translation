    issue: “Umat itu” menambahkan demonstratif yang tidak ada dalam λαόν.
    rationale: Yunani memakai bentuk definit “umat,” tetapi tidak memakai demonstratif. “Umat” cukup idiomatis dan lebih dekat dengan tingkat ketegasan sumber.
  - severity: low
