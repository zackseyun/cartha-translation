  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: id
  text: Jadi, setelah diutus oleh Roh Kudus[a], mereka turun ke Seleukia, dan dari sana berlayar ke Siprus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh kudus.” Frasa Yunani ini secara harfiah berbunyi “roh kudus”; dalam Kisah Para Rasul, ungkapan ini lazim dipahami sebagai rujukan kepada Roh Kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: mereka
  rationale: Pronomina ini dinyatakan secara eksplisit dan agak menegaskan pelakunya. Dalam narasi Indonesia, penempatan 'mereka' sebagai subjek sudah cukup membawa penekanan itu tanpa terkesan kaku.
- source_word: μὲν οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai kelanjutan narasi sekaligus hubungan dengan pengutusan pada ayat sebelumnya. 'Jadi' menyampaikan alur tersebut secara wajar.
- source_word: ἐκπεμφθέντες
  choice: setelah diutus
  rationale: Partisip aoris pasif menunjukkan tindakan yang mendahului verba utama. 'Setelah diutus' mempertahankan urutan waktu dan bentuk pasif secara alami.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: oleh Roh Kudus
  rationale: ὑπό dengan genitif menandai pelaku tindakan. 'Roh Kudus' adalah padanan baku dalam bahasa Indonesia dan konteks Kisah Para Rasul menggambarkan-Nya sebagai pelaku personal yang mengutus.
- source_word: κατῆλθον
  choice: pergi ke
  rationale: Secara harfiah verba ini berarti 'turun', mungkin menuju pantai. Namun dalam bahasa Indonesia modern, 'pergi ke Seleukia' lebih alami; unsur penurunan geografis bukan fokus utama dan tidak sepenuhnya jelas bagi pembaca tanpa konteks topografi.
- source_word: εἰς Σελεύκειαν
  choice: ke Seleukia
  rationale: εἰς menandai tujuan, dan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Padanan langsung dan alami untuk adverbia yang menyatakan tempat keberangkatan.
- source_word: τε
  choice: lalu
  rationale: Partikel ini menghubungkan tindakan berikutnya dengan tindakan sebelumnya. 'Lalu' secara alami menampilkan urutan naratif tanpa menambahkan hubungan sebab-akibat.
- source_word: ἀπέπλευσαν
  choice: berlayar
  rationale: Verba ini menyatakan keberangkatan melalui laut. Dengan frasa 'dari sana', gagasan berangkat sudah jelas sehingga 'berlayar' menghindari pengulangan yang tidak perlu.
- source_word: εἰς Κύπρον
  choice: menuju Siprus
  rationale: Frasa ini menyatakan tujuan pelayaran. 'Menuju Siprus' alami dalam konteks perjalanan laut dan memakai bentuk nama pulau yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Terjemahan ἁγίου πνεύματος
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Dalam Kisah Para Rasul, ungkapan ini merujuk kepada pelaku ilahi personal yang mengutus dan mengarahkan misi. 'Roh Kudus' merupakan padanan Indonesia yang baku, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah tanpa mengaburkan rujukan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Struktur partisip Yunani dibuat menjadi anak kalimat waktu agar alami, sedangkan hubungan antartindakan dipertahankan dengan 'Jadi' dan 'lalu'. Penanda catatan kaki ditempatkan langsung sesudah 'Roh Kudus'.
