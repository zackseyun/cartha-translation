id: ACT.13.41
reference: Acts 13:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: id
  text: “Perhatikanlah, hai para pencemooh[a], tercenganglah dan binasalah[b]! Sebab Aku sedang melakukan suatu pekerjaan pada zaman kalian—suatu pekerjaan yang sama sekali tidak akan kalian percayai, sekalipun seseorang menceritakannya[c] kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang menghina.” Kata Yunani ini menunjuk kepada orang yang memandang rendah atau memperlakukan sesuatu dengan hina.
    reason: lexical_alternative
  - marker: b
    text: Atau “lenyaplah” atau “hancurlah.” Kutipan ini menggemakan Habakuk 1:5 dalam bahasa Yunani dan mengandung peringatan keras tentang kebinasaan.
    reason: alternative_reading
  - marker: c
    text: Kata Yunaninya dapat berarti “menuturkannya dengan lengkap” atau “menguraikannya secara terperinci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Perhatikanlah
  rationale: Imperatif ini menyerukan perhatian. “Perhatikanlah” alami dalam bahasa Indonesia modern dan lebih jelas sebagai seruan daripada “lihatlah” dalam konteks ini.
- source_word: καταφρονηταί
  choice: para pencemooh
  rationale: Kata ini menunjuk kepada orang-orang yang memandang rendah atau memperlakukan sesuatu dengan hina. “Para pencemooh” menyampaikan unsur penolakan yang bernada menghina.
- source_word: θαυμάσατε
  choice: tercenganglah
  rationale: Imperatif ini mengungkapkan keterkejutan besar dalam kutipan kenabian. “Tercenganglah” mempertahankan daya retorisnya tanpa terdengar kuno.
- source_word: ἀφανίσθητε
  choice: binasalah
  rationale: Dalam konteks peringatan ini, bentuk imperatif pasif tersebut menyatakan kehancuran atau lenyapnya seseorang. “Binasalah” mempertahankan nada ancaman penghakiman.
- source_word: ἔργον
  choice: suatu pekerjaan
  rationale: Pilihan ini cukup luas untuk menunjuk kepada tindakan besar yang Allah kerjakan dan mempertahankan pengulangan sumber.
- source_word: ἐργάζομαι ἐγώ
  choice: Aku sedang melakukan
  rationale: Bentuk kini dan pronomina eksplisit menekankan tindakan Allah yang berlangsung. “Sedang melakukan” menyampaikan aspek tersebut secara alami.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: pada zaman kalian
  rationale: Ungkapan ini menyatakan masa kehidupan para pendengar. “Pada zaman kalian” lebih alami daripada terjemahan harfiah “pada hari-hari kalian” dan tetap mempertahankan kedekatan waktunya.
- source_word: οὐ μὴ πιστεύσητε
  choice: sama sekali tidak akan kalian percayai
  rationale: Gabungan οὐ μή dengan subjungtif merupakan penyangkalan yang sangat tegas. “Sama sekali tidak akan” menyampaikan penekanan itu dengan jelas.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: sekalipun seseorang menceritakannya kepada kalian
  rationale: Kata kerja ini berarti menuturkan atau menguraikan suatu hal, bahkan dengan terperinci. “Menceritakannya” alami, sedangkan nuansa penuturan terperinci dicatat dalam catatan kaki.
theological_decisions:
- issue: Nada peringatan dalam kutipan Habakuk
  choice: Memakai “binasalah” dan penyangkalan tegas “sama sekali tidak akan ... percayai”
  alternative: Memakai “lenyaplah” dan penyangkalan yang kurang tegas
  rationale: Kutipan ini berfungsi sebagai peringatan keras terhadap penolakan atas karya Allah. Terjemahan mempertahankan daya penghakiman dan ketegasan teks tanpa menambahkan penjelasan doktrinal.
- issue: Pelaku pekerjaan dalam kutipan ilahi
  choice: Memakai “Aku” dengan huruf kapital
  alternative: Memakai “aku” dengan huruf kecil
  rationale: Dalam konteks kutipan kenabian, pembicara adalah Allah. Kapitalisasi mengikuti kebiasaan ejaan Alkitab bahasa Indonesia sebagai penanda referen, tanpa mengubah makna gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang khidmat dan langsung. “Kalian” dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam bahasa Yunani adalah jamak. Tanda pisah mempertahankan pengulangan retoris “suatu pekerjaan” dan memperjelas hubungan aposisionalnya.
