  verdict: approve
  source_fidelity: Terjemahan dengan setia mempertahankan rangkaian imperatif dalam kutipan Yunani, penekanan pada tindakan ilahi melalui “Aku sedang melakukan,” pengulangan “suatu pekerjaan,” dan negasi yang sangat tegas dalam οὐ μὴ πιστεύσητε. “Sekalipun seseorang menceritakannya kepada kalian” dapat menyampaikan kekuatan kondisional yang dipertegas dalam konteks, tanpa mengubah maksud sumber.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada kenabian. “Perhatikanlah,” “tercenganglah,” dan “binasalah” membentuk seruan yang kuat dan sesuai register. Penggunaan “kalian” secara konsisten menandai bentuk jamak sumber.
  terminology: “Para pencemooh” merupakan padanan kontekstual yang baik untuk καταφρονηταί; catatan kaki secara tepat menyediakan alternatif yang lebih harfiah. “Binasalah” secara wajar menyampaikan ancaman kehancuran dalam ἀφανίσθητε, sementara alternatif “lenyaplah” dan “hancurlah” dicatat. Kapitalisasi “Aku” mengikuti konvensi Alkitab Indonesia dan sesuai dengan pembicara ilahi dalam kutipan.
