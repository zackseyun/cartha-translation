id: ACT.13.45
reference: Acts 13:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: id
  text: Namun, ketika orang-orang Yahudi itu melihat orang banyak[a], mereka dipenuhi rasa iri[b] dan terus membantah apa yang disampaikan oleh Paulus[c] sambil menghujat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah kelompok Yahudi setempat yang menentang Paulus dalam peristiwa ini, bukan orang Yahudi secara keseluruhan.
    reason: cultural_note
  - marker: b
    text: Atau “dipenuhi semangat yang berkobar”; dalam konteks ini, arti negatif “rasa iri” lebih sesuai.
    reason: lexical_alternative
  - marker: c
    text: Atau “hal-hal yang sedang dikatakan Paulus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang berlawanan dengan sambutan positif pada konteks sebelumnya.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi itu
  rationale: Mempertahankan sebutan eksplisit teks Yunani, sedangkan kata 'itu' menunjukkan kelompok tertentu dalam adegan ini tanpa mempersempitnya menjadi para pemimpin.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami untuk massa yang berkumpul; bentuk kolektif ini mencakup jamak Yunani tanpa perlu ungkapan kaku.
- source_word: ἐπλήσθησαν ζήλου
  choice: dipenuhi rasa iri
  rationale: ζῆλος dapat berarti semangat atau iri hati; tindakan bermusuhan sesudahnya mendukung arti negatif, sementara bentuk 'dipenuhi' mempertahankan idiom Yunani.
- source_word: ἀντέλεγον
  choice: terus membantah
  rationale: Imperfek menunjukkan tindakan yang berlangsung atau berulang; 'terus membantah' menyampaikan aspek tersebut tanpa memastikan secara berlebihan bahwa ini semata-mata permulaan tindakan.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: apa yang disampaikan oleh Paulus
  rationale: Menyampaikan konstruksi partisip substantival pasif secara alami sambil mempertahankan fokus pada isi perkataan Paulus.
- source_word: βλασφημοῦντες
  choice: sambil menghujat
  rationale: Partisip ini menyatakan tindakan yang menyertai bantahan mereka. 'Menghujat' mempertahankan bobot kuat verba Yunani tanpa menentukan objek yang tidak disebutkan.
theological_decisions:
- issue: Kemungkinan pembacaan anti-Yahudi atas οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi itu
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks menyebut orang-orang Yahudi, bukan hanya para pemimpin. Penunjuk 'itu' dan catatan kaki memperjelas bahwa yang dimaksud ialah kelompok setempat dalam adegan ini, bukan seluruh orang Yahudi.
- issue: Objek penghujatan tidak dinyatakan
  choice: sambil menghujat
  alternative: sambil menghina Paulus atau menghujat Allah
  rationale: Bahasa Yunani tidak menyebut objek βλασφημοῦντες; terjemahan mempertahankan ketaktertentuan itu dan tidak memaksakan sasaran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat menjaga hubungan antartindakan dalam bahasa Yunani, tetapi menghindari bentuk pasif atau partisipial yang terasa kaku. Semua penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
