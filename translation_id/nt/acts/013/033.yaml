id: ACT.13.33
reference: Acts 13:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: id
  text: 'bahwa Allah telah menggenapi hal ini bagi anak-anak kita[a] dengan membangkitkan Yesus[b], seperti juga tertulis dalam Mazmur kedua: “Engkaulah Anak-Ku; hari ini Aku telah memperanakkan Engkau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi kita, anak-anak mereka.” Sebagian naskah berbunyi demikian.
    reason: textual_variant
  - marker: b
    text: Atau, “dengan membangkitkan Yesus dari antara orang mati.” Ungkapan Yunani ini juga dapat berarti membangkitkan dalam arti menghadirkan atau mengangkat seseorang.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: telah menggenapi
  rationale: Bentuk perfektum menunjukkan tindakan yang sudah terlaksana dan tetap berlaku; pilihan ini juga mempertahankan bahasa penggenapan janji yang khas dalam Lukas–Kisah Para Rasul.
- source_word: ταύτην
  choice: hal ini
  rationale: Kata tunjuk ini merujuk pada janji dalam konteks sebelumnya. “Hal ini” wajar dalam bahasa Indonesia tanpa menyisipkan kata “janji” yang tidak dinyatakan dalam ayat ini.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: bagi anak-anak kita
  rationale: Menerjemahkan secara langsung teks utama SBLGNT; τέκνα dapat menunjuk pada anak-anak atau keturunan. Varian naskah yang didukung tradisi lain dicatat dalam catatan kaki.
- source_word: ἀναστήσας Ἰησοῦν
  choice: dengan membangkitkan Yesus
  rationale: Partisip aoris diterjemahkan sebagai keterangan cara. “Membangkitkan” mempertahankan kemungkinan makna membangkitkan dari kematian maupun membangkitkan dalam arti menghadirkan atau mengangkat seseorang untuk suatu peran.
- source_word: γέγραπται
  choice: tertulis
  rationale: Ungkapan Indonesia yang alami untuk formula pengantar kutipan Kitab Suci dan tetap menyiratkan keberlakuan tulisan tersebut.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: dalam mazmur kedua
  rationale: Mengikuti susunan Yunani secara dekat dan tetap alami dalam bahasa Indonesia.
- source_word: Υἱός μου εἶ σύ
  choice: Engkaulah Anak-Ku
  rationale: Partikel -lah menyampaikan penegasan identitas dalam susunan bahasa Indonesia yang alami dan khidmat.
- source_word: σήμερον γεγέννηκά σε
  choice: hari ini Aku telah memperanakkan Engkau
  rationale: “Memperanakkan” mempertahankan makna langsung γεννάω serta bobot intertekstual dan kristologis Mazmur 2:7 tanpa mengubahnya menjadi tafsiran tentang pengangkatan, penobatan, atau kebangkitan.
theological_decisions:
- issue: Makna ἀναστήσας Ἰησοῦν dalam konteks ini
  choice: Diterjemahkan “dengan membangkitkan Yesus” untuk mempertahankan ketegangan antara kebangkitan dari kematian dan tindakan Allah menghadirkan atau mengangkat Yesus.
  alternative: “dengan membangkitkan Yesus dari antara orang mati” atau “dengan mengangkat/menghadirkan Yesus”
  rationale: Ayat berikutnya berbicara lebih tegas tentang kebangkitan dari kematian, sedangkan ἀνίστημι dalam Kisah Para Rasul juga dapat dipakai ketika Allah membangkitkan atau menghadirkan seorang pemimpin. Terjemahan utama tidak memutuskan salah satu tafsiran secara berlebihan.
- issue: Daya kristologis ungkapan “hari ini Aku telah memperanakkan Engkau”
  choice: Kutipan dipertahankan secara langsung tanpa penjelasan tafsir di dalam teks.
  alternative: Memahaminya secara eksplisit sebagai bahasa penobatan/pengangkatan atau sebagai pembenaran melalui kebangkitan.
  rationale: Kutipan Mazmur 2:7 sebaiknya tidak diperluas sedemikian rupa sehingga terjemahan menyelesaikan perdebatan teologis yang tidak diselesaikan oleh susunan ayat itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Anak-Ku” dan “Engkau” mengikuti rujukan ilahi dalam kutipan. “Memperanakkan” agak lebih formal daripada bahasa percakapan, tetapi dipilih karena ketepatan intertekstual dan untuk menghindari tafsiran adopsionis yang dapat muncul dari parafrasa seperti “menjadikan Engkau Anak-Ku”.
