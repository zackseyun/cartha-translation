  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: id
  text: Ia berkata, “Hai, kamu yang penuh dengan segala tipu daya dan segala kelicikan, anak Iblis, musuh segala kebenaran[a], tidakkah kamu akan berhenti memutarbalikkan jalan-jalan Tuhan yang lurus?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala keadilan.” Kata Yunani ini dapat berarti “kebenaran” atau “keadilan,” bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: penuh dengan segala tipu daya
  rationale: Ungkapan ini mempertahankan gambaran seseorang yang dipenuhi atau dicirikan oleh tipu daya, sekaligus menjaga daya cakup παντός.
- source_word: πάσης ῥᾳδιουργίας
  choice: segala kelicikan
  rationale: ῥᾳδιουργία menunjuk pada perilaku licik dan tidak bermoral; 'kelicikan' alami dalam bahasa Indonesia dan tidak melebur maknanya dengan 'tipu daya'.
- source_word: υἱὲ διαβόλου
  choice: anak Iblis
  rationale: '''Anak'' mempertahankan ungkapan relasional υἱέ dan dalam idiom Alkitab dapat menyatakan keserupaan moral atau keberpihakan.'
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: musuh segala kebenaran
  rationale: Dalam konteks ini δικαιοσύνη menunjuk pada apa yang benar dan lurus secara moral. 'Kebenaran' merupakan padanan Indonesia yang wajar, sedangkan nuansa 'keadilan' tetap mungkin secara leksikal.
- source_word: οὐ παύσῃ
  choice: tidakkah kamu akan berhenti
  rationale: Bentuk futurum ini berfungsi sebagai pertanyaan retoris yang menegur; susunan tersebut mempertahankan baik bentuk pertanyaan maupun ketajamannya.
- source_word: διαστρέφων
  choice: membelokkan
  rationale: Kata ini berarti memutarbalikkan atau menyimpangkan dari arah yang benar. 'Membelokkan' menjaga metafora jalan dan berpasangan alami dengan 'jalan-jalan yang lurus'.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: jalan-jalan Tuhan yang lurus
  rationale: '''Jalan-jalan'' mempertahankan bentuk jamak dan cakupan metaforis ὁδοὺς, sedangkan ''yang lurus'' menerjemahkan penekanan atributif τὰς εὐθείας.'
- source_word: Ὦ
  choice: Hai kamu yang
  rationale: Partikel ini menandai sapaan langsung yang tegas. 'Hai kamu yang' terdengar wajar, tetap bermartabat, dan memperkenalkan rangkaian tuduhan dengan kuat.
theological_decisions:
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Konteks menekankan perlawanan terhadap segala sesuatu yang benar dan lurus secara moral. Namun, karena δικαιοσύνη juga dapat menyatakan keadilan, alternatif itu diakui tanpa memaksakan satu nuansa teologis yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran keras dan bermartabat. Struktur sapaan bertingkat serta metafora jalan dipertahankan. Tidak ditambahkan catatan kaki karena alternatif 'keadilan' kurang alami dalam frasa Indonesia ini dan tidak diperlukan untuk memahami ayat.
