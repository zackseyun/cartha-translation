  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: id
  text: Kira-kira empat ratus lima puluh tahun.[a] Sesudah itu, Ia memberikan hakim-hakim sampai kepada Nabi Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dalam sejumlah terjemahan, keterangan waktunya dihubungkan secara berbeda: “Ia memberikan hakim-hakim selama kira-kira empat ratus lima puluh tahun, sampai kepada Nabi Samuel.” Susunan dan tanda baca teks Yunani di sini diperdebatkan.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: kira-kira
  rationale: Bersama bilangan, ὡς menunjukkan perkiraan, bukan angka yang harus dipahami tepat.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: empat ratus lima puluh tahun lamanya
  rationale: Frasa datif ini menyatakan rentang waktu; “lamanya” membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
- source_word: καὶ μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Menandai urutan peristiwa secara alami; bentuk tunggal idiomatis dalam bahasa Indonesia tanpa mengubah rujukan pada rangkaian sebelumnya.
- source_word: ἔδωκεν
  choice: Ia memberikan
  rationale: Mempertahankan arti dasar δίδωμι dan ungkapan alkitabiah bahwa Allah menyediakan hakim-hakim bagi Israel.
- source_word: κριτὰς
  choice: hakim-hakim
  rationale: Istilah historis yang tepat bagi para pemimpin Israel pada masa sebelum kerajaan.
- source_word: ἕως
  choice: sampai pada zaman
  rationale: Menandai batas akhir masa para hakim dengan bentuk yang alami ketika diikuti nama Samuel.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Nabi Samuel
  rationale: Padanan idiomatis bahasa Indonesia untuk konstruksi aposisional yang mengenali Samuel menurut perannya sebagai nabi.
theological_decisions:
- issue: Hubungan frasa “kira-kira empat ratus lima puluh tahun” dalam ayat yang sulit secara tekstual dan sintaksis
  choice: Menjadikan frasa waktu itu sebagai pernyataan durasi tersendiri, lalu menerjemahkan bahwa sesudah itu Allah memberikan hakim-hakim sampai zaman Samuel.
  alternative: 'Menghubungkan empat ratus lima puluh tahun secara langsung dengan masa para hakim: “Ia memberikan hakim-hakim selama kira-kira empat ratus lima puluh tahun, sampai pada zaman Nabi Samuel.”'
  rationale: Teks SBLGNT yang diberikan menempatkan frasa waktu sebelum “sesudah itu” dan mendukung pemisahan ini. Karena hubungan sintaksis serta tanda bacanya diperdebatkan, alternatif tidak diselesaikan secara dogmatis, tetapi dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Ia” memperjelas bahwa subjek tersiratnya adalah Allah dalam konteks, sedangkan “Nabi Samuel” memakai susunan gelar yang lazim dalam bahasa Indonesia.
