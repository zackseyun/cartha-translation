source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: id
  text: 'Sebab demikianlah Tuhan telah memerintahkan kami: “Aku telah menetapkan engkau sebagai terang bagi bangsa-bangsa[a], supaya engkau menjadi keselamatan sampai ke ujung bumi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai terang bagi orang-orang bukan Yahudi.” Kata Yunani ἐθνῶν dapat berarti “bangsa-bangsa” atau, dalam banyak konteks, “orang-orang bukan Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sampai ke ujung-ujung bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: Sebab demikianlah
  rationale: γάρ memberikan dasar bagi pernyataan sebelumnya, sedangkan οὕτως menunjuk pada isi atau cara perintah yang kemudian dikutip. Ungkapan ini ringkas, wajar, dan mempertahankan hubungan logis tersebut.
- source_word: ἐντέταλται
  choice: telah memerintahkan
  rationale: Bentuk perfek ἐντέλλομαι menyatakan perintah berwibawa yang telah diberikan dan tetap berlaku. Bentuk “telah memerintahkan” mempertahankan aspek itu dalam bahasa Indonesia yang alami.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dalam konteks kutipan Kitab Suci ini, κύριος menunjuk kepada Tuhan sebagai pemberi perintah.
- source_word: Τέθεικά σε
  choice: Aku telah menetapkan engkau
  rationale: Bentuk perfek τίθημι menyatakan penetapan yang sudah dilakukan dan tetap berlaku. “Menetapkan” lebih tepat untuk pengangkatan atau penugasan daripada sekadar penempatan fisik.
- source_word: εἰς φῶς ἐθνῶν
  choice: sebagai terang bagi bangsa-bangsa
  rationale: εἰς menyatakan penetapan atau fungsi, sehingga diterjemahkan “sebagai”. ἐθνῶν dapat berarti bangsa-bangsa atau orang-orang bukan Yahudi; pilihan utama mempertahankan cakupan kolektif yang luas dalam kutipan Yesaya.
- source_word: τοῦ εἶναί σε
  choice: supaya engkau menjadi
  rationale: Infinitif berartikel dengan τοῦ menyatakan tujuan atau hasil. “Supaya” menyampaikan daya tujuan dengan jelas tanpa meniadakan kemungkinan nuansa hasil.
- source_word: εἰς σωτηρίαν
  choice: menjadi keselamatan
  rationale: Terjemahan ini mempertahankan ungkapan Yunani yang padat dan tidak mempersempitnya menjadi sekadar “membawa” atau “memberitakan” keselamatan.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: sampai ke ujung bumi
  rationale: Frasa Yunani berbentuk tunggal dan menunjuk kepada bagian bumi yang paling jauh. “Ujung bumi” dekat dengan bentuk sumber sekaligus dapat dipahami secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan dan penerapan kutipan dari Yesaya kepada misi Paulus dan Barnabas
  choice: Mempertahankan sapaan tunggal “engkau” dalam kutipan langsung tanpa menjelaskan identitas pihak yang disapa.
  alternative: Mengubahnya menjadi sapaan jamak atau secara eksplisit menyatakan bahwa kutipan itu berbicara langsung tentang para rasul.
  rationale: Teks Yunani mengutip Kitab Suci dalam bentuk tunggal, lalu menerapkannya pada misi Paulus dan Barnabas tanpa menjelaskan sepenuhnya hubungan teologis antara sosok dalam nubuat dan para utusan. Terjemahan mempertahankan ketegangan itu.
- issue: Hubungan pihak yang ditetapkan dengan keselamatan
  choice: “menjadi keselamatan”
  alternative: “membawa keselamatan” atau “menjadi sarana keselamatan”
  rationale: Ungkapan Yunani tidak secara eksplisit menentukan apakah pihak itu disebut keselamatan atau menjadi sarana yang mendatangkannya. Pilihan utama menghindari penyelesaian interpretatif yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Bentuk “engkau” dipakai karena merupakan sapaan tunggal dalam kutipan ilahi; struktur kutipan dan ketegangan teologis sumber dipertahankan.
