  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: id
  text: Setelah mereka melintasi seluruh pulau itu hingga ke Pafos, mereka menemukan seorang pria Yahudi bernama Bar-Yesus[a], seorang ahli sihir dan nabi palsu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Bar-Yesus juga dapat ditulis Baryesus. Nama Semitik ini kemungkinan berarti “anak Yesus” atau “anak Yosua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον ἄχρι Πάφου
  choice: Setelah menjelajahi seluruh pulau itu sampai ke Pafos
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. 'Menjelajahi' secara alami menyampaikan perjalanan melintasi wilayah, sedangkan 'sampai ke Pafos' mempertahankan titik akhirnya. δέ tidak perlu diterjemahkan tersendiri karena alur narasi sudah jelas dalam bahasa Indonesia.
- source_word: εὗρον ἄνδρα τινὰ
  choice: mereka bertemu dengan seorang pria
  rationale: Dalam konteks perjumpaan dengan seseorang, 'bertemu dengan' merupakan padanan Indonesia yang alami bagi εὗρον. Unsur indefinit τινά sudah tercakup dalam 'seorang' dan tidak perlu dibuat kaku menjadi 'seorang pria tertentu'.
- source_word: μάγον
  choice: tukang sihir
  rationale: Dalam konteks negatif ini, μάγος menunjuk kepada pelaku praktik gaib. 'Tukang sihir' mudah dipahami dan tidak membawa kesan penghibur panggung seperti yang dapat ditimbulkan oleh 'pesulap'.
- source_word: ψευδοπροφήτην
  choice: nabi palsu
  rationale: Padanan langsung dan lazim yang mempertahankan baik klaim kenabian maupun penilaian bahwa klaim itu palsu.
- source_word: Ἰουδαῖον
  choice: seorang Yahudi
  rationale: Di sini kata tersebut dipakai secara substantival untuk menyatakan identitas orang itu; konteks tidak menuntut arti geografis sempit 'orang Yudea'.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: bernama Bar-Yesus
  rationale: Ungkapan Yunani ini wajar diterjemahkan secara ringkas dengan 'bernama'. Nama diri ditransliterasikan, bukan diterjemahkan, dan tanda hubung memperlihatkan struktur nama Semitiknya.
theological_decisions:
- issue: Penerjemahan nama Βαριησοῦ
  choice: Bar-Yesus
  alternative: Bar Yesus; Baryesus; anak Yesus/Yosua
  rationale: Nama tersebut dipertahankan sebagai nama diri melalui transliterasi. Menerjemahkannya menjadi 'anak Yesus' atau 'anak Yosua' akan memilih arti unsur nama yang tidak dinyatakan sebagai penjelasan dalam teks. Catatan kaki menyampaikan kemungkinan maknanya tanpa menutup ambiguitas antara Yesus dan Yosua.
- issue: Hubungan sebutan μάγον, ψευδοπροφήτην, dan Ἰουδαῖον dengan tokoh
  choice: ketiganya disajikan sebagai keterangan tentang orang yang sama
  alternative: memperlakukan salah satunya sebagai identitas yang terpisah atau sekadar julukan
  rationale: Ketiga bentuk akusatif itu beraposisi dengan ἄνδρα τινά dan bersama-sama menggambarkan orang yang ditemukan; susunan Indonesia dibuat alami tanpa mengurangi satu pun keterangannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Urutan keterangan ditata ulang secara wajar agar tidak terasa seperti deretan aposisi yang kaku, sambil mempertahankan seluruh informasi sumber.
