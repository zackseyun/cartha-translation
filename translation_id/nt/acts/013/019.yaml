  source_fidelity: 'Terjemahan dengan tepat mempertahankan urutan tindakan dalam Yunani: Allah membinasakan/menumbangkan tujuh bangsa di tanah Kanaan, lalu memberikan tanah mereka sebagai warisan. “Bangsa Israel” sebagai penerima yang tersirat selaras dengan konteks dekat (Kisah Para Rasul 13:17–19) dan dengan audit trail bahasa Inggris.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif. “Setelah membinasakan tujuh bangsa di tanah Kanaan” dan “memberikan negeri mereka ... sebagai warisan” mengalir alami. Pemakaian “Ia” sesuai konvensi Alkitab Indonesia.
  terminology: “Tujuh bangsa,” “tanah Kanaan,” dan “warisan” tepat untuk ἔθνη ἑπτὰ, γῇ Χανάαν, dan nuansa κληρονομ- dalam κατακληρονομέω. “Negeri mereka” secara wajar merujuk pada wilayah milik tujuh bangsa tersebut. Catatan kaki menyajikan alternatif leksikal tanpa mengubah makna utama.
