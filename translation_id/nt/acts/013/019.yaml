  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: id
  text: Setelah membinasakan tujuh bangsa di tanah Kanaan, Ia memberikan negeri mereka kepada bangsa Israel sebagai warisan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membagikan negeri mereka sebagai milik pusaka.” Kata Yunani yang digunakan dapat menekankan pembagian atau penetapan bagian warisan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: setelah membinasakan
  rationale: Partisip aoristus dari καθαιρέω menyatakan tindakan Allah menumbangkan bangsa-bangsa Kanaan. “Membinasakan” menyampaikan daya ungkapnya secara jelas dan wajar dalam konteks penaklukan.
- source_word: ἔθνη ἑπτὰ
  choice: tujuh bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau kelompok-kelompok masyarakat; “tujuh bangsa” merupakan ungkapan baku dan jelas dalam konteks sejarah ini.
- source_word: ἐν γῇ Χανάαν
  choice: di tanah Kanaan
  rationale: Terjemahan ini mempertahankan unsur γῇ, ‘tanah/negeri’, tanpa memadatkannya menjadi sekadar “di Kanaan”.
- source_word: κατεκληρονόμησεν
  choice: memberikan ... sebagai warisan
  rationale: Kata kerja ini dapat menyatakan pembagian atau pemberian sebagai milik pusaka. Pilihan ini mempertahankan gagasan warisan dan menghasilkan bahasa Indonesia yang alami.
- source_word: τὴν γῆν αὐτῶν
  choice: negeri mereka
  rationale: αὐτῶν menunjuk kembali kepada tujuh bangsa yang baru disebutkan. “Negeri mereka” membedakan tanah kekuasaan bangsa-bangsa itu dari ungkapan lokasi “tanah Kanaan” sebelumnya.
theological_decisions:
- issue: Subjek tindakan dan penerima warisan yang tersirat
  choice: Allah adalah subjek kedua tindakan, dan negeri ketujuh bangsa itu diberikan kepada bangsa Israel sebagai warisan.
  alternative: Ia membagikan negeri mereka sebagai warisan, tanpa menyebut penerimanya secara eksplisit.
  rationale: Konteks langsung sedang mengisahkan tindakan-tindakan Allah dalam sejarah Israel. Teks Yunani tidak menyatakan objek tak langsung, tetapi konteks sejarah menunjukkan Israel sebagai penerima. Penyebutan “bangsa Israel” merupakan penjelasan tersirat demi kejelasan, bukan penambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Huruf kapital pada “Ia” menandai rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah klausa yang diterangkannya.
