review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk διαφθοράν. Dalam konteks kebangkitan istilah ini merujuk pada pembusukan/kerusakan jasmani, sedangkan “kebinasaan” dalam bahasa Indonesia modern terutama berarti kehancuran atau kehilangan, sehingga berisiko mengaburkan makna fisiknya. “Tidak akan membusuk lagi” menyampaikan maksud Yunani dengan jelas dan alami. Frasa kutipan Yesaya tetap perlu diperlakukan sebagai ungkapan eliptis yang merujuk pada janji-janji perjanjian Daud yang teguh.
  naturalness: Pembuka “Tentang kenyataan bahwa” cukup berat. “Mengenai kenyataan bahwa” lebih baku dan mengalir. Struktur “dan Dia tidak akan membusuk lagi” juga lebih idiomatis daripada “untuk tidak kembali lagi kepada kebinasaan.”
  terminology: “Pembusukan” atau verba “membusuk” tepat untuk διαφθορά dalam konteks ini. Untuk τὰ ὅσια Δαυὶδ τὰ πιστά, “janji-janji kudus dan teguh yang diberikan kepada Daud” menyatakan acuan perjanjian Daud tanpa memakai “berkat-berkat” yang lebih interpretatif. Catatan kaki mempertahankan alternatif tradisional dan menjelaskan ambiguitas konstruksinya.
  issues:
  - severity: medium
    issue: “Kebinasaan” untuk διαφθοράν
    rationale: Dalam pemakaian Indonesia modern, “kebinasaan” tidak terutama berarti pembusukan tubuh. Konteks eksplisit “dari antara orang mati” menuntut istilah yang jelas merujuk kepada kerusakan jasmani.
  - severity: low
    issue: Pembuka dan konstruksi infinitif kurang alami
    rationale: “Tentang kenyataan bahwa ... untuk tidak kembali lagi kepada ...” terasa kaku. Penataan ulang yang lebih idiomatis tidak mengubah hubungan makna dalam Yunani.
  - severity: low
    issue: “Berkat-berkat ... yang dijanjikan kepada Daud” terlalu menentukan kategori dan relasi genitif
    rationale: τὰ ὅσια dapat dipahami sebagai hal-hal/janji-janji kudus, tetapi “berkat-berkat” dan relasi “yang dijanjikan kepada Daud” menafsirkan frasa lebih jauh. “Janji-janji” dengan catatan penjelas lebih dekat dengan gema Yesaya 55:3.
  revised_text: 'Mengenai kenyataan bahwa Allah telah membangkitkan Dia dari antara orang mati dan Dia tidak akan membusuk lagi, Allah telah berfirman demikian: “Aku akan memberikan kepadamu janji-janji kudus dan teguh yang diberikan kepada Daud.”[a]'
