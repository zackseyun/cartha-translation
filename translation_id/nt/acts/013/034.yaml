  to: 'Mengenai kenyataan bahwa Allah telah membangkitkan Dia dari antara orang mati dan Dia tidak akan membusuk lagi, Allah telah berfirman demikian: “Aku akan memberikan kepadamu janji-janji kudus dan teguh yang diberikan kepada Daud.”[a]'
  rationale: Revisi mengganti “kebinasaan” dengan ungkapan yang secara jelas menunjuk pada pembusukan jasmani, memperlancar susunan kalimat, dan mengurangi penafsiran yang tidak perlu dalam kutipan Yesaya. Alternatif tradisional serta sifat eliptis frasa Yunani dipertahankan dalam catatan kaki.
