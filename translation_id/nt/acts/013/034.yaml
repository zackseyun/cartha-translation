id: ACT.13.34
reference: Acts 13:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: id
  text: 'Mengenai kenyataan bahwa Allah telah membangkitkan Dia dari antara orang mati dan Dia tidak akan membusuk lagi, Allah telah berfirman demikian: “Aku akan memberikan kepadamu janji-janji kudus dan teguh yang diberikan kepada Daud.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih setia yang teguh kepada Daud.” Frasa Yunani ini menggemakan Yesaya 55:3. Secara harfiah frasa tersebut berbicara tentang “hal-hal kudus dari Daud, yang teguh”; frasa ini dapat merujuk pada janji-janji atau kasih setia perjanjian yang berkaitan dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: Allah telah membangkitkan Dia dari antara orang mati
  rationale: Konteksnya jelas menunjuk kepada kebangkitan. Subjek tersirat dijelaskan sebagai Allah demi kewajaran bahasa Indonesia dan kesinambungan argumen, sedangkan 'dari antara orang mati' mencerminkan ἐκ νεκρῶν.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: untuk tidak kembali lagi
  rationale: Ungkapan ini menyatakan bahwa sesudah dibangkitkan, Dia tidak akan kembali kepada keadaan yang disebut berikutnya. Bentuk Indonesia ini alami tanpa mengubahnya menjadi penjelasan teologis tambahan.
- source_word: διαφθοράν
  choice: kebinasaan
  rationale: Dalam konteks tubuh dan kebangkitan, kata ini menunjuk kepada kerusakan atau pembusukan jasmani. 'Kebinasaan' cukup luas untuk mempertahankan hubungan dengan pemakaian istilah yang sama dalam kutipan Mazmur berikutnya, sementara catatan kaki menjelaskan nuansa fisiknya.
- source_word: οὕτως εἴρηκεν
  choice: Allah telah berfirman demikian
  rationale: Bentuk perfek menampilkan firman Kitab Suci yang tetap berlaku. 'Berfirman' sesuai untuk perkataan ilahi, dan subjek Allah dibuat eksplisit agar rujukannya jelas.
- source_word: Δώσω ὑμῖν
  choice: Aku akan memberikan kepadamu
  rationale: Menyampaikan janji futur secara langsung. 'Kepadamu' mempertahankan bentuk jamak Yunani secara netral karena bahasa Indonesia tidak menandai jumlah pada pronomina ini.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: berkat-berkat kudus dan pasti yang dijanjikan kepada Daud
  rationale: Frasa eliptis yang menggemakan Yesaya 55:3 ini menunjuk kepada anugerah atau janji perjanjian yang kudus dan dapat diandalkan, berkaitan dengan Daud. Penambahan 'yang dijanjikan kepada' membuat relasi genitifnya dapat dipahami tanpa mempersempit isinya.
theological_decisions:
- issue: Makna frasa kutipan Yesaya 55:3, τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: berkat-berkat kudus dan pasti yang dijanjikan kepada Daud
  alternative: kasih setia yang teguh kepada Daud; hal-hal kudus dan pasti dari Daud
  rationale: Frasa Yunani bersifat eliptis dan dapat menunjuk kepada berkat, kemurahan, atau janji perjanjian yang berkaitan dengan Daud. Pilihan utama menyampaikan fungsi frasa dalam argumen tentang kebangkitan tanpa memasukkan rumusan doktrinal yang lebih sempit; alternatif tradisional dipertahankan dalam catatan kaki.
- issue: Rujukan διαφθοράν dalam konteks kebangkitan
  choice: kebinasaan
  alternative: pembusukan; kerusakan
  rationale: Istilah ini terutama menyiratkan kerusakan atau pembusukan tubuh, tetapi juga menjadi istilah penghubung dengan ayat berikutnya. 'Kebinasaan' mempertahankan keluasan istilah, dan nuansa jasmaninya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Allah' dipakai untuk memperjelas subjek tersirat dalam bahasa Yunani. Kutipan dibuat alami bagi pembaca umum sambil mempertahankan ambiguitas frasa Yesaya melalui catatan kaki.
