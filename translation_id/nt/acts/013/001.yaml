id: ACT.13.1
reference: Acts 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: id
  text: 'Di Antiokhia, dalam jemaat yang ada di sana, terdapat para nabi dan pengajar: Barnabas, Simeon yang disebut Niger[a], Lukius orang Kirene[b], Manaen, rekan dekat Herodes, sang penguasa wilayah[c], dan Saulus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Niger” adalah nama Latin yang berarti “hitam.” Di sini nama itu dipertahankan sebagai nama, bukan diterjemahkan.
    reason: lexical_alternative
  - marker: b
    text: Kirene adalah sebuah kota di Afrika Utara; maksudnya, Lukius berasal dari Kirene.
    reason: cultural_note
  - marker: c
    text: Atau “orang yang dibesarkan bersama Herodes, sang penguasa wilayah” atau “saudara angkat Herodes, sang penguasa wilayah.” Kata Yunaninya dapat menunjuk kepada seorang rekan dekat atau seseorang yang dibesarkan bersama orang lain; hubungan sosial tepatnya tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: terdapat
  rationale: Ἦσαν menyatakan keberadaan. δέ merupakan penghubung ringan yang tidak perlu selalu dinyatakan secara tersendiri dalam bahasa Indonesia; alur wacana sudah cukup jelas tanpa menambahkan kata temporal seperti “kemudian”.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Di Antiokhia, dalam jemaat yang ada di sana
  rationale: Ungkapan ini menunjuk kepada jemaat setempat di Antiokhia. Susunan tersebut mempertahankan kedua unsur lokatif tanpa menerjemahkan κατά secara kaku.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Dalam konteks ini kata tersebut menunjuk kepada persekutuan orang percaya setempat, bukan gedung; “jemaat” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: nabi-nabi dan pengajar-pengajar
  rationale: Bentuk ini menyatakan dua kelompok atau peran pelayanan dalam jemaat tanpa memasukkan struktur jabatan gerejawi yang lebih kemudian.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simeon yang disebut Niger
  rationale: Nama Συμεών dibedakan dari Simon, sedangkan Νίγερ dipertahankan sebagai nama julukan Latin dan tidak diterjemahkan dalam teks utama.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lukius orang Kirene
  rationale: Sebutan Κυρηναῖος menunjukkan bahwa Lukius berasal dari Kirene; ungkapan “orang Kirene” alami dan langsung dalam bahasa Indonesia.
- source_word: Μαναήν
  choice: Manaen
  rationale: Transliterasi ini mengikuti bentuk nama Yunani secara langsung dan tidak menggantinya dengan dugaan bentuk Semitik di balik nama itu.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Herodes sang penguasa wilayah
  rationale: τετράρχης adalah gelar penguasa daerah. “Penguasa wilayah” lebih mudah dipahami pembaca modern daripada transliterasi teknis “tetrark” dan tidak menambahkan nama Antipas yang tidak terdapat dalam ayat.
- source_word: σύντροφος
  choice: yang dibesarkan bersama
  rationale: Kata ini menunjuk kepada orang yang bertumbuh atau diasuh bersama seseorang. Padanan ini menyampaikan hubungan sejak masa pengasuhan sambil membiarkan bentuk sosial tepatnya tetap terbuka.
theological_decisions:
- issue: Hakikat sebutan nabi dan pengajar di jemaat Antiokhia
  choice: Menerjemahkannya langsung sebagai “nabi-nabi dan pengajar-pengajar.”
  alternative: Memahaminya sebagai jabatan formal menurut tata gereja tertentu yang berkembang kemudian.
  rationale: Ayat menyebut peran mereka dalam jemaat, tetapi tidak menetapkan struktur hierarkis atau tata jabatan denominasi tertentu.
- issue: Hubungan Manaen dengan Herodes dalam kata σύντροφος
  choice: “yang dibesarkan bersama Herodes”
  alternative: “saudara angkat Herodes” atau “sahabat dekat Herodes”
  rationale: Kata Yunani mengarah pada pengalaman dibesarkan bersama, tetapi tidak memastikan bahwa hubungan itu secara khusus merupakan persaudaraan angkat ataupun sekadar persahabatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jemaat” dipilih daripada “gereja” untuk menegaskan komunitas setempat; nama-nama ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia. Gelar teknis “tetrark” dijelaskan secara fungsional sebagai “penguasa wilayah” agar mudah dipahami tanpa menambah rincian sejarah yang tidak tertulis.
