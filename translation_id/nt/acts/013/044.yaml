id: ACT.13.44
reference: Acts 13:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: id
  text: Pada hari Sabat berikutnya[a], hampir seluruh penduduk kota itu berkumpul untuk mendengar firman Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Pada hari Sabat yang akan datang.”
    reason: lexical_alternative
  - marker: b
    text: “Firman Tuhan” dapat juga dipahami sebagai “pesan Tuhan” atau, sesuai konteks, “berita tentang Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Pada hari Sabat berikutnya
  rationale: Konstruksi datif temporal dengan ἐρχομένῳ menunjuk pada Sabat yang akan datang atau berikutnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: σχεδὸν
  choice: hampir
  rationale: σχεδόν berarti 'hampir' dan secara alami membatasi ungkapan menyeluruh yang mengikutinya.
- source_word: πᾶσα ἡ πόλις
  choice: seluruh penduduk kota itu
  rationale: Secara idiomatis, 'seluruh kota' merujuk kepada orang-orang di kota tersebut. Penyebutan 'penduduk' membuat maksudnya jelas dalam bahasa Indonesia tanpa menghilangkan sifat umum atau hiperbolis ungkapan aslinya.
- source_word: συνήχθη
  choice: berkumpul
  rationale: Bentuk pasif aoristus συνάγω di sini berfungsi dengan makna intransitif, yaitu orang-orang datang dan berhimpun.
- source_word: ἀκοῦσαι
  choice: untuk mendengar
  rationale: Infinitif ini menyatakan tujuan pertemuan mereka; 'untuk mendengar' merupakan padanan langsung dan alami.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος dalam Kisah Para Rasul sering menunjuk pada berita yang diberitakan. 'Firman' mempertahankan istilah teologis yang berulang dan lebih dekat pada bentuk sumber daripada parafrasa 'pesan'.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Genitif ini diterjemahkan dengan konstruksi Indonesia 'firman Tuhan', yang tetap dapat menunjukkan firman yang berasal dari, dimiliki oleh, atau berkenaan dengan Tuhan tanpa menetapkan satu nuansa saja.
theological_decisions:
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' merupakan padanan baku dalam konteks pewartaan Kristen di Kisah Para Rasul dan tidak mempersempit rujukannya melampaui teks.'
- issue: Makna τὸν λόγον τοῦ κυρίου
  choice: Mempertahankan ungkapan 'firman Tuhan'
  alternative: '''pesan Tuhan'' atau ''berita tentang Tuhan'''
  rationale: Konstruksi genitif Yunani dapat memuat nuansa sumber, kepunyaan, atau pokok berita. Ungkapan 'firman Tuhan' mempertahankan ambiguitas dan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Penduduk kota' dipakai agar idiom πᾶσα ἡ πόλις jelas bagi pembaca umum. Semua penanda catatan kaki ditempatkan dalam teks utama pada unsur yang diterangkan.
