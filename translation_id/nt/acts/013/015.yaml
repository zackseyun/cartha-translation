id: ACT.13.15
reference: Acts 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: id
  text: Setelah pembacaan Taurat dan Kitab Para Nabi, para pemimpin sinagoge mengirim pesan kepada mereka, “Saudara-saudara[a], jika di antara kalian ada pesan penguatan[b] bagi umat, sampaikanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Laki-laki, saudara-saudara,” yaitu sapaan hormat yang bernuansa kekeluargaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pesan nasihat.” Ungkapan Yunani ini dapat mencakup baik penguatan maupun nasihat atau dorongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: pembacaan
  rationale: Menunjuk pada pembacaan Kitab Suci dengan suara lantang dalam ibadah sinagoge; “pembacaan” alami dan tetap dekat dengan bentuk sumber.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: Taurat dan Kitab Para Nabi
  rationale: Menunjuk pada dua bagian Kitab Suci yang dikenal dalam konteks sinagoge. “Taurat” lebih jelas bagi pembaca Indonesia daripada sekadar “Hukum,” sedangkan “Kitab Para Nabi” menegaskan bahwa yang dimaksud ialah kumpulan kitab.
- source_word: ἀρχισυνάγωγοι
  choice: para pemimpin sinagoge
  rationale: Mengacu pada para pejabat yang bertanggung jawab atas jalannya ibadah sinagoge, bukan penguasa sipil.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: mengirim pesan kepada mereka
  rationale: Konstruksi ini menyatakan penyampaian pesan yang kemudian dikutip langsung; ungkapan Indonesia ini alami tanpa menambahkan pelaku perantara yang tidak disebutkan.
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Yunani secara harfiah berunsur maskulin dan bernuansa hormat serta kekeluargaan. Dalam konteks ini sapaan ditujukan kepada Paulus dan rekan-rekannya.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: jika di antara kalian ada
  rationale: Mempertahankan susunan impersonal teks Yunani secara wajar dalam bahasa Indonesia.
- source_word: λόγος παρακλήσεως
  choice: pesan yang menguatkan
  rationale: παράκλησις dapat mencakup penguatan maupun nasihat atau dorongan. Pilihan ini alami dalam konteks undangan untuk berbicara, sementara keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: πρὸς τὸν λαόν
  choice: umat
  rationale: Dalam konteks ibadah sinagoge, λαός merujuk kepada orang-orang yang berhimpun sebagai umat; “umat” lebih kontekstual daripada “orang banyak.”
- source_word: λέγετε
  choice: sampaikanlah
  rationale: Imperatif ini mengundang mereka menyampaikan pesan kepada umat; “sampaikanlah” lebih idiomatis daripada “berbicaralah” setelah kata “pesan.”
theological_decisions:
- issue: Sapaan maskulin dalam lingkungan sinagoge
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Ἄνδρες ἀδελφοί berbentuk maskulin dan dalam konteks langsung menyapa Paulus serta rekan-rekan laki-lakinya yang diundang berbicara; bentuknya tidak digeneralisasi.
- issue: Rentang makna παράκλησις
  choice: pesan yang menguatkan
  alternative: pesan nasihat
  rationale: Teks dapat menyiratkan penguatan, dorongan, atau nasihat. Terjemahan utama tidak dimaksudkan meniadakan unsur nasihat, sehingga alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Sinagoge” dipakai untuk ketepatan historis, sedangkan “Taurat dan Kitab Para Nabi” memperjelas dua bagian Kitab Suci yang dibacakan. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
