id: ACT.13.49
reference: Acts 13:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: id
  text: Dan firman Tuhan terus tersebar ke seluruh wilayah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: terus tersebar
  rationale: Bentuk imperfek pasif menggambarkan penyebaran yang sedang berlangsung pada waktu lampau. Dalam bahasa Indonesia, “terus tersebar” menyampaikan aspek berkelanjutan itu secara alami tanpa harus memakai konstruksi pasif yang kaku.
- source_word: δὲ
  choice: Dan
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan narasi; “Dan” mempertahankan alur tanpa memberi kesan pertentangan yang berlebihan.
- source_word: ὁ λόγος
  choice: firman
  rationale: λόγος di Kisah Para Rasul menunjuk pada berita yang diberitakan. “Firman” mempertahankan ungkapan khas Alkitab dan gaung sastranya, sementara alternatif “pesan” dicatat dalam catatan kaki.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku dan bermartabat bagi κύριος serta mempertahankan resonansi kristologis frasa tersebut.
- source_word: δι’ ὅλης
  choice: ke seluruh
  rationale: διά dengan genitif menyatakan jangkauan melintasi suatu kawasan, sedangkan ὅλης menekankan keseluruhannya. “Ke seluruh” alami dalam konteks tersebarnya berita.
- source_word: τῆς χώρας
  choice: wilayah itu
  rationale: χώρα menunjuk pada kawasan geografis sekitar, bukan negara dalam pengertian modern. “Wilayah” jelas dan wajar; “itu” membuat rujukan definitnya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: tuan
  rationale: Dalam konteks Kisah Para Rasul, “Tuhan” mempertahankan bobot kristologis dan religius κύριος, sedangkan “tuan” akan mempersempitnya menjadi sapaan atau kewenangan manusiawi.
- issue: Makna λόγος dalam pemberitaan
  choice: firman
  alternative: pesan
  rationale: “Firman” mempertahankan ungkapan berulang dalam narasi Lukas tanpa menentukan secara berlebihan apakah genitif tersebut berarti pesan yang berasal dari Tuhan, milik Tuhan, atau tentang Tuhan. Makna komunikatif “pesan” tetap disediakan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Kata “terus” menyatakan aspek imperfek secara idiomatis; “wilayah” menghindari kesan negara-bangsa modern.
