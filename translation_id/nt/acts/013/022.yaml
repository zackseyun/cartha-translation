id: ACT.13.22
reference: Acts 13:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: id
  text: Setelah menyingkirkannya, Allah mengangkat Daud menjadi raja bagi mereka. Tentang Daud, Allah juga bersaksi dengan berkata, “Aku telah menemukan Daud, anak Isai, seorang yang sesuai dengan hati-Ku[a], yang akan melakukan segala kehendak-Ku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menurut hati-Ku.” Ungkapan ini juga dapat diterjemahkan “seorang yang berkenan di hati-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “kehendak” berbentuk jamak dan dapat menunjuk pada segala maksud atau keinginan Allah.
    reason: source_form
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: setelah menyingkirkannya
  rationale: Mengungkapkan tindakan Allah menyingkirkan Saul dari kedudukannya sebagai raja tanpa mempersempit makna menjadi istilah politik teknis seperti ‘memakzulkan’.
- source_word: ἤγειρεν ... εἰς βασιλέα
  choice: mengangkat ... menjadi raja
  rationale: Dalam konteks ini ἐγείρω berarti memunculkan atau menetapkan seorang pemimpin. ‘Mengangkat’ terdengar alami dalam bahasa Indonesia dan menghindari kesan bahwa Daud dibangkitkan dari kematian.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Datif ini menyatakan bahwa Daud diangkat bagi Israel, dengan kemungkinan nuansa manfaat yang tetap dipertahankan oleh ‘bagi’.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Tentang Daud, Allah juga bersaksi dengan berkata
  rationale: Walaupun pronomina relatif Yunani berbentuk datif, kesatuan frasa secara wajar menyatakan kesaksian mengenai Daud. Susunan ini jelas dan alami dalam bahasa Indonesia.
- source_word: Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί
  choice: Aku telah menemukan Daud, anak Isai
  rationale: Bentuk aoristus diterjemahkan dengan ‘telah menemukan’ untuk menyatakan tindakan yang sudah terjadi dan tetap relevan; ungkapan genitif diterjemahkan secara idiomatis sebagai ‘anak Isai’.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: seorang yang sesuai dengan hati-Ku
  rationale: Terjemahan ini mempertahankan gambaran ‘hati’ dan gagasan kesesuaian yang dinyatakan oleh κατά, tanpa mengubahnya menjadi sekadar kedekatan emosional.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: yang akan melakukan segala kehendak-Ku
  rationale: ‘Akan melakukan’ mempertahankan bentuk futurum. ‘Segala kehendak-Ku’ merupakan ungkapan Indonesia yang alami dan mencakup berbagai maksud atau kehendak Allah, meskipun nomina Yunani berbentuk jamak.
theological_decisions:
- issue: Makna ungkapan κατὰ τὴν καρδίαν μου
  choice: sesuai dengan hati-Ku
  alternative: berkenan di hati-Ku
  rationale: Pilihan utama lebih dekat pada bentuk Yunani dan mempertahankan kemungkinan bahwa ungkapan itu menunjuk pada kesesuaian dengan maksud Allah, bukan hanya perasaan atau penerimaan emosional.
- issue: Kemungkinan nuansa kebangkitan dalam ἤγειρεν
  choice: mengangkat Daud menjadi raja
  alternative: membangkitkan Daud sebagai raja
  rationale: Konteks berbicara tentang tampilnya Daud sebagai raja, bukan kebangkitan dari kematian. ‘Mengangkat’ menyampaikan fungsi kontekstual kata tersebut tanpa memasukkan gagasan kebangkitan yang tidak dimaksudkan di sini.
- issue: Bentuk jamak θελήματά
  choice: segala kehendak-Ku
  alternative: semua kehendak-kehendak-Ku
  rationale: Bahasa Indonesia lazim memakai ‘segala kehendak-Ku’ sebagai ungkapan kolektif. Catatan kaki mempertahankan informasi bahwa nomina sumber berbentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Allah disebut kembali untuk memperjelas pelaku dalam kalimat panjang. ‘Mengangkat ... menjadi raja’ dipilih karena alami bagi pembaca umum, sedangkan dua catatan kaki menjaga bentuk dan ambiguitas penting dari teks Yunani.
