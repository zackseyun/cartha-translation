id: ACT.13.11
reference: Acts 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: id
  text: Dan sekarang, lihatlah, tangan Tuhan ada atasmu, dan engkau akan buta dan tidak akan melihat matahari untuk sementara waktu.[a] Seketika itu juga, kabut dan kegelapan menimpanya. Ia berjalan ke sana kemari sambil mencari orang-orang yang dapat menggandeng tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “sampai suatu waktu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi seruan penarik perhatian dengan bentuk yang wajar dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: χεὶρ κυρίου ἐπὶ σέ
  choice: tangan Tuhan menimpa engkau
  rationale: Mempertahankan ungkapan konkret tentang tindakan aktif Tuhan; 'menimpa' menyampaikan ἐπί dalam konteks penghakiman tanpa mengganti metafora dengan penjelasan teologis.
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: engkau akan menjadi buta sehingga tidak melihat matahari
  rationale: Menyampaikan timbulnya kebutaan secara alami serta mempertahankan penyebutan harfiah 'matahari'.
- source_word: ἄχρι καιροῦ
  choice: untuk sementara waktu
  rationale: Mengungkapkan masa sementara yang tidak ditentukan; nuansa batas waktu tetap dipertahankan tanpa menetapkan lamanya.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Menegaskan bahwa akibat tersebut terjadi langsung.
- source_word: ἀχλὺς καὶ σκότος
  choice: kabut dan kegelapan
  rationale: 'Mempertahankan kedua gambaran sumber: kekaburan seperti kabut dan kegelapan.'
- source_word: ἔπεσεν ἐπ’ αὐτὸν
  choice: menyelubunginya
  rationale: Dalam bahasa Indonesia, pilihan ini secara alami menggambarkan kabut dan kegelapan yang datang atas dirinya, tanpa mengubah akibat yang dinyatakan.
- source_word: περιάγων
  choice: berjalan ke sana kemari
  rationale: Menerjemahkan gerak berkeliling tanpa menambahkan gagasan 'meraba-raba' yang hanya tersirat oleh konteks kebutaan.
- source_word: ἐζήτει χειραγωγούς
  choice: mencari orang-orang yang dapat menuntunnya dengan tangan
  rationale: Mempertahankan makna khusus χειραγωγός, yakni orang yang menuntun seseorang dengan tangan, bukan sekadar pemandu umum.
theological_decisions:
- issue: Makna ungkapan 'tangan Tuhan'
  choice: Metafora dipertahankan sebagai 'tangan Tuhan menimpa engkau'.
  alternative: Tuhan menghukum engkau / Tuhan akan memukul engkau.
  rationale: Konteks menunjukkan tindakan ilahi dalam penghakiman, tetapi teks menyatakannya melalui ungkapan 'tangan Tuhan'; terjemahan tidak menggantinya dengan tafsiran yang lebih eksplisit.
- issue: Lamanya kebutaan
  choice: untuk sementara waktu
  alternative: sampai suatu waktu / untuk suatu masa
  rationale: ἄχρι καιροῦ menunjukkan batas yang bersifat sementara tetapi tidak menentukan durasinya; terjemahan menjaga ketidakpastian itu.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Pronomina 'engkau' dipakai karena tuturan ini langsung, tegas, dan bernada kenabian. Idiom sumber dipertahankan bila dapat dipahami, sedangkan susunan kalimat disesuaikan agar alami dalam bahasa Indonesia.
