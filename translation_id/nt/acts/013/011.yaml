revisions:
- from: Dan sekarang, lihatlah, tangan Tuhan menimpa engkau, dan engkau akan menjadi buta sehingga tidak melihat matahari untuk sementara waktu.[a] Seketika itu juga, kabut dan kegelapan menyelubunginya. Ia berjalan ke sana kemari sambil mencari orang-orang yang dapat menuntunnya dengan tangan.
  to: Dan sekarang, lihatlah, tangan Tuhan ada atasmu, dan engkau akan buta dan tidak akan melihat matahari untuk sementara waktu.[a] Seketika itu juga, kabut dan kegelapan menimpanya. Ia berjalan ke sana kemari sambil mencari orang-orang yang dapat menggandeng tangannya.
  rationale: Revisi mempertahankan metafora "tangan Tuhan" dan ketidakjelasan durasi ἄχρι καιροῦ, sambil menghindari penguatan hubungan kausal pada μὴ βλέπων dan memperjelas makna χειραγωγούς dalam bahasa Indonesia modern. Penempatan penanda catatan tetap mengacu pada "untuk sementara waktu."
