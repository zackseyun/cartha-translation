id: ACT.13.29
reference: Acts 13:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: id
  text: Setelah mereka melaksanakan semua yang tertulis tentang Dia, mereka menurunkan-Nya dari pohon[a] dan membaringkan-Nya di dalam sebuah makam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu salib”; kata Yunani ξύλον berarti “pohon” atau “kayu” dan juga dapat digunakan untuk alat eksekusi dari kayu. Istilah ini mungkin menggemakan Ulangan 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Setelah
  rationale: Dalam konteks ini, ungkapan tersebut menghubungkan tindakan yang telah diselesaikan dengan tindakan berikutnya secara temporal. “Setelah” alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: ἐτέλεσαν
  choice: melaksanakan
  rationale: Kata ini menyatakan membawa sesuatu sampai selesai atau menggenapinya melalui tindakan. “Melaksanakan” cocok dengan subjek manusia jamak dan tidak secara berlebihan menafsirkan kesengajaan mereka dalam menggenapi Kitab Suci.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: semua yang tertulis tentang Dia
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh frasa Yunani serta keadaan tulisan yang sudah ada, tanpa menambahkan kata “Kitab Suci” yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: καθελόντες
  choice: mereka menurunkan-Nya
  rationale: Partisip aoris ini secara alami dijadikan verba berurutan dalam bahasa Indonesia dan menunjukkan tindakan menurunkan tubuh Yesus dari alat eksekusi.
- source_word: ἀπὸ τοῦ ξύλου
  choice: dari pohon
  rationale: ξύλον dapat berarti pohon atau kayu dan di sini menunjuk pada alat eksekusi dari kayu. “Pohon” mempertahankan bentuk leksikal serta kemungkinan gema Ulangan 21:23; penjelasan kontekstual diberikan dalam catatan kaki.
- source_word: ἔθηκαν
  choice: membaringkan-Nya
  rationale: τίθημι berarti menaruh atau menempatkan. Dalam konteks penguburan tubuh, “membaringkan” merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: εἰς μνημεῖον
  choice: di dalam sebuah makam
  rationale: μνημεῖον dalam konteks ini adalah tempat penguburan. “Makam” jelas dan lazim dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan ξύλον dalam konteks penyaliban
  choice: pohon
  alternative: kayu salib
  rationale: Teks Yunani memakai ξύλον, bukan σταυρός. “Pohon” mempertahankan pilihan leksikal teks dan kemungkinan kaitannya dengan bahasa tentang orang yang digantung pada pohon dalam Ulangan 21:23. Karena dalam konteks ini kata tersebut menunjuk pada alat eksekusi kayu yang lazim disebut salib, alternatif itu dijelaskan dalam catatan kaki tanpa menggantikan istilah sumber di teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk penghormatan “Dia” dan enklitik “-Nya” dipakai untuk Yesus. Susunan kalimat mengikuti alur tindakan Yunani tanpa mempertahankan struktur partisip yang terasa kaku dalam bahasa Indonesia.
