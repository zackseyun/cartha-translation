lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini meneruskan alur uraian sebelumnya tanpa menambahkan nuansa tafsir.
- source_word: ἡμεῖς
  choice: kami
  rationale: Pronomina eksplisit memberi penekanan tertentu, tetapi bahasa Indonesia secara alami sudah mengungkapkan subjek melalui “kami”; tambahan seperti “kami sendiri” dapat memberi kontras yang berlebihan dalam konteks ini.
- source_word: ὑμᾶς
  choice: kepada kalian
  rationale: Dengan εὐαγγελιζόμεθα, pihak yang menerima pemberitaan paling alami dinyatakan dengan “kepada”; “kalian” membedakan jamak dari tunggal dan sesuai dengan pendengar Paulus.
- source_word: εὐαγγελιζόμεθα
  choice: memberitakan ... kabar baik
  rationale: Ungkapan ini mempertahankan makna mengumumkan berita baik dengan bahasa umum dan tidak bergantung pada istilah gerejawi.
- source_word: τὴν ... ἐπαγγελίαν
  choice: tentang janji
  rationale: Yang dimaksud ialah janji Allah; “tentang” menghasilkan susunan Indonesia yang alami bersama “memberitakan kabar baik”.
- source_word: πρὸς τοὺς πατέρας
  choice: kepada nenek moyang kita
  rationale: πατέρες di sini menunjuk para leluhur Israel dalam sejarah perjanjian. “Nenek moyang” adalah padanan Indonesia yang alami; “kita” dijelaskan oleh konteks pidato kepada sesama Israel meskipun tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: γενομένην
  choice: yang telah diberikan
  rationale: Partisip ini menerangkan janji yang datang atau diberikan kepada para leluhur. “Diberikan” alami dalam kolokasi Indonesia dan tidak mendahului ayat berikutnya dengan menerjemahkannya sebagai “digenapi”.
theological_decisions:
- issue: Rujukan πατέρες
  choice: nenek moyang kita
  alternative: para bapa / nenek moyang
  rationale: Dalam konteks pidato Paulus kepada orang Israel, istilah ini merupakan sebutan historis-perjanjian bagi leluhur Israel. Padanan “nenek moyang” menyampaikan rujukannya secara wajar dalam bahasa Indonesia; catatan kaki mempertahankan bentuk harfiah dan menjelaskan bahwa unsur “kita” berasal dari konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lisan yang bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak, sedangkan “memberitakan ... kabar baik” menghindari jargon tanpa menghilangkan makna εὐαγγελίζομαι.
