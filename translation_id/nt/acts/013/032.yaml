  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: id
  text: Dan kami sendiri memberitakan kepada kalian kabar baik tentang janji yang telah diberikan kepada para leluhur,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para bapa.” Istilah ini merujuk kepada leluhur Israel.
