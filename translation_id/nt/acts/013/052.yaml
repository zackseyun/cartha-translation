  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: id
  text: Dan para murid terus dipenuhi sukacita dan Roh Kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Para murid dipenuhi sukacita dan Roh Kudus.” Bentuk kata kerja Yunani dapat diterjemahkan lebih sederhana sebagai “dipenuhi”, tetapi bentuk imperfeknya dapat menyiratkan keadaan yang berlangsung atau pengisian yang berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε μαθηταὶ
  choice: Para murid
  rationale: Artikel dengan τε menghubungkan kalimat ini dengan narasi sebelumnya. Dalam bahasa Indonesia, kesinambungan itu cukup alami tanpa memaksakan kata sambung pada awal kalimat.
- source_word: ἐπληροῦντο
  choice: terus dipenuhi
  rationale: Bentuk imperfek pasif menyatakan tindakan atau keadaan pada masa lampau yang berlangsung atau berulang. 'Terus dipenuhi' mempertahankan aspek tersebut serta bentuk pasif secara alami.
- source_word: χαρᾶς
  choice: sukacita
  rationale: Genitif sesudah πληρόω menyatakan isi yang memenuhi; 'dipenuhi sukacita' merupakan ungkapan Indonesia yang langsung dan wajar.
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Dalam konteks Kisah Para Rasul, frasa ini menunjuk kepada Roh ilahi yang berkarya dalam misi jemaat. Bahasa Indonesia lazim tidak memakai artikel, sehingga 'Roh Kudus' sudah definit dan alami.
theological_decisions:
- issue: Apakah πνεύματος ἁγίου menunjuk kepada Roh Kudus secara personal atau sekadar keadaan rohani yang kudus
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Pemakaian πνεῦμα ἅγιον dalam Kisah Para Rasul dan konteks karya Allah melalui para murid mendukung rujukan kepada Roh Kudus, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. 'Terus dipenuhi' dipilih untuk menampilkan aspek imperfek tanpa ungkapan yang kaku; penanda catatan kaki [a] dicantumkan dalam teks utama.
