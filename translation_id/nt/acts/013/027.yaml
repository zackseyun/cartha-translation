id: ACT.13.27
reference: Acts 13:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: id
  text: Sebab penduduk Yerusalem dan para pemimpin mereka tidak mengenali Dia[a] dan tidak memahami perkataan para nabi yang dibacakan setiap hari Sabat[b]. Dengan menghukum Dia, mereka menggenapi perkataan-perkataan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang ini,” yaitu Yesus.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “suara-suara para nabi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: penduduk Yerusalem
  rationale: Ungkapan partisipial ini berfungsi sebagai nomina kolektif. “Penduduk Yerusalem” ringkas, alami, dan tepat dalam bahasa Indonesia modern.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: para pemimpin mereka
  rationale: ἄρχοντες menunjuk kepada para penguasa atau pemimpin yang memiliki wewenang. “Para pemimpin” alami dan cukup luas untuk mencakup peran pemerintahan serta peradilan dalam konteks ini.
- source_word: τοῦτον
  choice: Dia
  rationale: Kata tunjuk Yunani secara harfiah berarti “orang ini” dan merujuk kepada Yesus. “Dia” lebih alami dan terhormat dalam bahasa Indonesia; nuansa demonstratif dipertahankan dalam catatan kaki.
- source_word: ἀγνοήσαντες
  choice: tidak mengenali ... dan tidak memahami
  rationale: 'Partisip ini dipahami berkaitan dengan Yesus dan perkataan para nabi. Karena objeknya berbeda, bahasa Indonesia memerlukan padanan yang alami: mereka gagal mengenali siapa Yesus dan gagal memahami kesaksian kenabian.'
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: perkataan para nabi
  rationale: Secara harfiah φωνάς berarti “suara-suara”, tetapi dalam konteks pembacaan Kitab Suci ungkapan itu menunjuk kepada ucapan atau perkataan para nabi. “Perkataan” lebih alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: yang dibacakan setiap hari Sabat
  rationale: Bentuk pasif ἀναγινωσκομένας menyatakan pembacaan publik yang berulang. “Dibacakan setiap hari Sabat” jelas dan idiomatis.
- source_word: κρίναντες
  choice: dengan menjatuhkan hukuman atas Dia
  rationale: Dalam konteks pengadilan dan kematian Yesus, κρίνω berarti menghukum atau menjatuhkan putusan atas-Nya. Bentuk “dengan” menyatakan sarana yang melaluinya nubuat itu digenapi.
- source_word: ἐπλήρωσαν
  choice: mereka justru menggenapi
  rationale: πληρόω berarti menggenapi apa yang dinyatakan dalam Kitab Suci. “Justru” menampilkan ironi kontekstual tanpa mengubah isi proposisi.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut.
theological_decisions:
- issue: Sifat ketidaktahuan para penduduk dan pemimpin Yerusalem
  choice: tidak mengenali Dia dan tidak memahami perkataan para nabi
  alternative: tidak mengetahui Dia maupun suara para nabi
  rationale: Terjemahan ini tidak menyatakan bahwa mereka sama sekali tidak mengetahui keberadaan Yesus atau teks para nabi. Yang ditekankan ialah kegagalan mengenali identitas-Nya dan memahami kesaksian nubuat, sambil mempertahankan tanggung jawab mereka dalam menjatuhkan hukuman.
- issue: Hubungan penghukuman Yesus dengan penggenapan nubuat
  choice: Dengan menjatuhkan hukuman atas Dia, mereka justru menggenapi perkataan itu
  alternative: setelah menghakimi Dia, mereka menggenapinya
  rationale: κρίναντες dalam konteks ini menunjuk pada putusan penghukuman, dan partisip tersebut menyatakan tindakan yang menjadi sarana penggenapan. Terjemahan tidak menyiratkan bahwa para pemimpin bermaksud menggenapi nubuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar hubungan antargagasan mudah dipahami. Kapitalisasi “Dia” dan “-Nya” mengikuti kebiasaan umum dalam penerbitan Alkitab berbahasa Indonesia ketika merujuk kepada Yesus.
