id: ACT.13.2
reference: Acts 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: id
  text: Ketika mereka sedang melayani Tuhan[a] dan berpuasa, Roh Kudus berkata, “Khususkanlah bagi-Ku Barnabas dan Saulus untuk pekerjaan yang untuk itu telah Kupanggil mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beribadah kepada Tuhan.” Kata kerja Yunani yang dipakai dapat berarti melayani dengan nuansa ibadah atau liturgis.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: melayani
  rationale: Kata ini menunjuk pada pelaksanaan pelayanan yang dapat bernuansa ibadah atau liturgis. “Melayani Tuhan” mempertahankan dimensi pelayanan tanpa membatasi maknanya pada ibadah formal.
- source_word: τῷ κυρίῳ
  choice: Tuhan
  rationale: Datif menunjukkan pihak yang menjadi tujuan pelayanan; ungkapan Indonesia yang alami ialah “melayani Tuhan” tanpa preposisi tambahan.
- source_word: νηστευόντων
  choice: berpuasa
  rationale: Padanan baku untuk tindakan berpuasa dan sejajar sebagai kegiatan yang berlangsung bersamaan dengan pelayanan mereka.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dalam bahasa Indonesia modern dan mempertahankan Roh Kudus sebagai subjek pribadi yang berbicara.
- source_word: Ἀφορίσατε δή
  choice: Khususkanlah
  rationale: Imperatif ini berarti memisahkan atau menetapkan bagi suatu tujuan khusus. “Khususkanlah” mengungkapkan tujuan tersebut dengan wajar; partikel δή tidak diberi kata tersendiri karena daya penegasnya sudah terasa dalam bentuk perintah.
- source_word: μοι
  choice: bagi-Ku
  rationale: Datif menyatakan pihak yang bagi kepentingan atau tujuan-Nya Barnabas dan Saulus dikhususkan. Kapitalisasi mengikuti rujukan kepada Roh Kudus dalam ujaran langsung.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabas dan Saulus
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: εἰς τὸ ἔργον
  choice: untuk pekerjaan
  rationale: “Pekerjaan” mempertahankan keluasan makna ἔργον dan tidak mempersempitnya menjadi jabatan, pelayanan teknis, atau ritus penahbisan tertentu.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: yang untuknya Aku telah memanggil mereka
  rationale: Bentuk perfek menyatakan panggilan yang telah diberikan dan tetap berlaku. Susunan ini menjaga hubungan relatif dengan “pekerjaan” serta ambiguitas mengenai rincian tugas tersebut.
theological_decisions:
- issue: Makna λειτουργούντων dalam konteks pengabdian bersama dan pengutusan
  choice: melayani Tuhan
  alternative: beribadah kepada Tuhan
  rationale: Konteksnya memang bernuansa ibadah, tetapi verba Yunani mencakup pelayanan yang bersifat ibadah atau liturgis dan tidak harus dibatasi pada tindakan ibadah formal.
- issue: Roh Kudus sebagai subjek yang berbicara
  choice: Roh Kudus berkata
  alternative: disampaikanlah oleh Roh Kudus
  rationale: Susunan langsung mempertahankan presentasi Yunani tentang Roh Kudus sebagai subjek pribadi yang berkata.
- issue: Daya ἀφορίσατε ... εἰς τὸ ἔργον
  choice: Khususkanlah bagi-Ku ... untuk pekerjaan
  alternative: Tahbiskanlah ... bagi pelayanan
  rationale: Teks menyatakan pemisahan bagi tugas ilahi, tetapi tidak dengan sendirinya menetapkan ritus penahbisan atau jabatan gerejawi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Khususkanlah” dipilih agar perintah ilahi terdengar tegas tanpa memasukkan terminologi jabatan gerejawi. Penanda catatan kaki ditempatkan sesudah “berpuasa” sebagai catatan atas frasa kegiatan yang mendahuluinya, selaras dengan lapisan konsultasi yang diberikan.
