  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: id
  text: Dan selama kira-kira empat puluh tahun Ia bersabar terhadap mereka di padang gurun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Ia memelihara mereka,” bukan “Ia bersabar terhadap mereka.”
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: Selama
  rationale: Hubungan lanjutan dengan narasi dipertahankan secara alami melalui pembukaan keterangan waktu; καί tidak perlu diterjemahkan secara terpisah karena akan terasa kaku dalam bahasa Indonesia.
- source_word: ὡς
  choice: kira-kira
  rationale: Dalam konstruksi dengan ukuran waktu, kata ini menyatakan perkiraan, bukan ketepatan matematis.
- source_word: τεσσερακονταετῆ χρόνον
  choice: empat puluh tahun
  rationale: Ungkapan ini menunjuk pada rentang waktu empat puluh tahun; bentuk Indonesia ini alami dan jelas.
- source_word: ἐτροποφόρησεν
  choice: Ia bersabar terhadap
  rationale: Bacaan SBLGNT paling wajar berarti menanggung atau bersabar menghadapi perilaku seseorang. Pilihan ini lebih alami dan bermartabat daripada 'menahan mereka', tanpa melunakkan makna menjadi pemeliharaan.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Kata ganti objek jamak ini merujuk kepada bangsa Israel.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Ungkapan baku ini sesuai dengan latar pengembaraan Israel dan mempertahankan gema geografis serta biblisnya.
theological_decisions:
- issue: Tindakan Allah terhadap Israel di padang gurun
  choice: Ia bersabar terhadap mereka
  alternative: Ia memelihara mereka
  rationale: Teks Yunani SBLGNT memakai ἐτροποφόρησεν, yang mendukung arti menanggung atau bersabar terhadap mereka. Varian tekstual ἐτροφοφόρησεν mendukung gambaran memelihara atau mengasuh; karena itu, alternatif tersebut dicatat tanpa menggantikan bacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Bersabar terhadap' menyampaikan ketahanan Allah menghadapi pemberontakan Israel tanpa memakai ungkapan terlalu percakapan; 'padang gurun' mempertahankan istilah geografis-biblis yang lazim.
