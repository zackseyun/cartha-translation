  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: id
  text: Namun Elimas, ahli sihir itu, menentang mereka—karena demikianlah namanya ditafsirkan—seraya berusaha memalingkan prokonsul itu dari iman[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini dapat dipahami sebagai upaya memalingkannya dari iman Kristen secara khusus atau, lebih umum, dari respons untuk percaya.
    reason: alternative_reading
  - marker: b
    text: Nama “Elimas” dijelaskan sebagai nama yang diterjemahkan atau ditafsirkan; asal-usul dan arti tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: menentang
  rationale: Bentuk imperfek menggambarkan perlawanan yang sedang atau terus berlangsung; “menentang” wajar dalam bahasa Indonesia modern dan mempertahankan nuansa permusuhan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan sambutan positif dalam konteks sebelumnya.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Mempertahankan pronomina Yunani yang merujuk kepada Barnabas dan Saulus tanpa menjelaskannya secara berlebihan.
- source_word: Ἐλύμας
  choice: Elimas
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: ὁ μάγος
  choice: si ahli sihir
  rationale: μάγος dapat berarti orang majus, ahli sihir, atau tukang sihir; dalam konteks tokoh ini, “ahli sihir” jelas dan mudah dipahami tanpa menambahkan kecaman yang tidak perlu.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: sebab begitulah namanya diterjemahkan
  rationale: Mempertahankan keterangan parentetis dan cakupan μεθερμηνεύεται sebagai penerjemahan atau penafsiran nama.
- source_word: ζητῶν
  choice: dan berusaha
  rationale: Partisip ini menyatakan upaya atau maksud yang menyertai perlawanannya; “berusaha” alami dalam konstruksi bahasa Indonesia.
- source_word: διαστρέψαι
  choice: memalingkan ... dari
  rationale: Dengan objek orang dan ἀπό, verba ini menunjuk pada usaha membuat seseorang berpaling dari sesuatu, bukan sekadar memutarbalikkan suatu gagasan.
- source_word: τὸν ἀνθύπατον
  choice: gubernur itu
  rationale: ἀνθύπατος adalah jabatan prokonsul Romawi. “Gubernur” lebih mudah dipahami pembaca umum Indonesia, sementara konteks telah memperkenalkan pejabat yang dimaksud; ketepatan jabatan dicatat dalam pertimbangan register.
- source_word: ἀπὸ τῆς πίστεως
  choice: dari iman
  rationale: Ungkapan ini dapat menunjuk pada iman Kristen secara khusus atau pada respons percaya secara lebih umum; bentuk Indonesia “dari iman” mempertahankan ambiguitas itu.
theological_decisions:
- issue: Makna πίστις dengan artikel dalam ἀπὸ τῆς πίστεως
  choice: dari iman
  alternative: dari ajaran iman / dari kepercayaan itu
  rationale: Konteks dan artikel dapat menunjuk pada iman Kristen sebagai suatu realitas tertentu, tetapi πίστις juga dapat terdengar sebagai tindakan atau respons percaya. Teks utama memakai “iman” tanpa penjelasan tambahan agar ketegangan semantis tidak diselesaikan secara sepihak; catatan kaki menjelaskan dua kemungkinan tersebut.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. “Si ahli sihir” berfungsi sebagai aposisi yang alami. “Gubernur” dipilih demi keterpahaman umum, meskipun jabatan Romawi yang tepat adalah prokonsul. Tanda pisah mempertahankan keterangan parentetis dari teks Yunani.
