id: ACT.13.46
reference: Acts 13:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: id
  text: Paulus dan Barnabas lalu berkata dengan berani, “Firman Allah memang harus disampaikan terlebih dahulu kepada kalian. Karena kalian menolaknya dan menilai diri kalian sendiri tidak layak untuk hidup kekal, lihatlah, kami berpaling kepada bangsa-bangsa lain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangsa-bangsa.” Dalam konteks ini, ungkapan tersebut menunjuk kepada bangsa-bangsa lain, yaitu orang-orang bukan Yahudi, sebagai kontras dengan para pendengar di sinagoge.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: berbicara dengan berani
  rationale: Partisip ini menyatakan cara Paulus dan Barnabas berkata-kata, yaitu secara berani dan terus terang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: τέ
  choice: Lalu
  rationale: Partikel ini menghubungkan tindakan tersebut dengan alur narasi sebelumnya. “Lalu” menyampaikan kelanjutan wacana secara wajar tanpa memberi bobot berlebihan.
- source_word: Ὑμῖν
  choice: kepada kalian
  rationale: Bentuk datif menunjukkan pihak yang pertama-tama menerima penyampaian firman. “Kalian” memperjelas bahwa sapaan itu jamak.
- source_word: ἀναγκαῖον
  choice: memang harus
  rationale: Konstruksi ini mengungkapkan keharusan. Partikel “memang” membantu mempertahankan penekanan dalam susunan Yunani sekaligus menghasilkan bahasa Indonesia yang alami.
- source_word: πρῶτον
  choice: terlebih dahulu
  rationale: 'Menandai prioritas urutan: firman disampaikan kepada para pendengar Yahudi sebelum pemberitaan beralih kepada bangsa-bangsa lain.'
- source_word: λαληθῆναι
  choice: disampaikan
  rationale: Infinitif pasif dari λαλέω secara harfiah berarti “diucapkan.” Dalam konteks pemberitaan, “disampaikan” tetap dekat pada makna sumber dan lebih alami daripada “dikatakan” dengan subjek firman.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: Firman Allah
  rationale: Ungkapan baku Alkitabiah ini mempertahankan gagasan tentang pesan atau firman yang berasal dari Allah tanpa mempersempit maknanya.
- source_word: ἐπειδὴ
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan Paulus dan Barnabas berpaling kepada bangsa-bangsa lain.
- source_word: ἀπωθεῖσθε
  choice: menolaknya
  rationale: Bentuk kini tengah menyatakan tindakan menampik atau menolak firman itu. “Menolak” jelas dan alami dalam bahasa Indonesia modern.
- source_word: αὐτὸν
  choice: -nya
  rationale: Pronomina ini merujuk kembali kepada “Firman Allah.” Bentuk enklitik “-nya” menyampaikan rujukan itu secara alami.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: menganggap diri kalian tidak layak
  rationale: 'Terjemahan ini mempertahankan unsur refleksif: merekalah yang menilai diri sendiri demikian melalui penolakan mereka. “Menganggap” alami, meski nuansa keputusan atau penilaian dari κρίνω tetap hadir.'
- source_word: τῆς αἰωνίου ζωῆς
  choice: memperoleh hidup kekal
  rationale: Genitif sesudah ἀξίους dapat diungkapkan secara idiomatis sebagai kelayakan untuk memperoleh hidup kekal. “Hidup kekal” merupakan padanan mapan bagi ζωὴ αἰώνιος.
- source_word: ἰδού
  choice: ketahuilah
  rationale: Kata ini menarik perhatian kepada tindakan yang segera diumumkan. “Ketahuilah” lebih bermartabat dan komunikatif dalam bahasa Indonesia daripada “lihatlah” yang dapat disalahpahami secara harfiah.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: kami berpaling kepada bangsa-bangsa lain
  rationale: “Berpaling kepada” mempertahankan citra perubahan arah pelayanan. Dalam konteks kontras dengan jemaat sinagoge, “bangsa-bangsa lain” menunjuk kepada orang-orang non-Yahudi.
theological_decisions:
- issue: Makna τὰ ἔθνη dalam konteks sejarah keselamatan
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi; bangsa-bangsa
  rationale: Konteks langsung mempertentangkan para pendengar di sinagoge dengan kelompok non-Yahudi. “Bangsa-bangsa lain” mempertahankan bentuk kolektif Yunani dan makna non-Yahudinya tanpa menjadikannya sekadar istilah geografis.
- issue: Daya ungkap οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: kalian menganggap diri kalian tidak layak memperoleh hidup kekal
  alternative: kami menyatakan kalian tidak layak memperoleh hidup kekal
  rationale: Teks Yunani secara eksplisit menempatkan tindakan menilai pada para pendengar sendiri melalui κρίνετε ἑαυτούς. Terjemahan tidak mengalihkan putusan itu kepada Paulus dan Barnabas atau menambahkan kesimpulan doktrinal di luar ayat.
- issue: Keberlakuan keharusan dalam Ὑμῖν ἦν ἀναγκαῖον πρῶτον
  choice: Firman Allah memang harus disampaikan terlebih dahulu kepada kalian
  alternative: Kalianlah yang pertama-tama harus menerima pemberitaan firman Allah
  rationale: Pilihan utama mempertahankan konstruksi impersonal dan pasif sumber, sehingga tidak menentukan lebih jauh asal atau sifat keharusan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai untuk membedakan ὑμεῖς dari bentuk tunggal. Struktur kalimat dijaga cukup dekat dengan teks Yunani, tetapi disusun agar lancar dibaca dan dipahami oleh pembaca umum.
