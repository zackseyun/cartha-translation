revisions:
- from: Lalu Paulus dan Barnabas berbicara dengan berani, kata mereka, “Firman Allah memang harus disampaikan terlebih dahulu kepada kalian. Namun, karena kalian menolaknya dan menganggap diri kalian tidak layak memperoleh hidup kekal, ketahuilah, kami berpaling kepada bangsa-bangsa lain.[a]”
  to: Paulus dan Barnabas lalu berkata dengan berani, “Firman Allah memang harus disampaikan terlebih dahulu kepada kalian. Karena kalian menolaknya dan menilai diri kalian sendiri tidak layak untuk hidup kekal, lihatlah, kami berpaling kepada bangsa-bangsa lain.[a]”
  rationale: Revisi mengganti konjungsi adversatif dengan hubungan kausal yang dinyatakan oleh ἐπειδή, menerjemahkan ἰδού secara lebih langsung, dan memperjelas nuansa refleksif-penilaian dari κρίνετε ἑαυτούς. Istilah utama dan catatan kaki dipertahankan karena sudah setia, jelas, dan sesuai register.
