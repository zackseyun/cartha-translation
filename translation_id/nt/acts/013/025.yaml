  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: id
  text: Ketika Yohanes sedang menyelesaikan tugasnya, ia terus berkata, “Menurut kalian, siapakah aku ini? Bukan aku orangnya.[a] Namun lihatlah, ada seseorang yang datang sesudah aku, yang sandalnya pun aku tidak layak melepaskannya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksudnya secara lebih eksplisit, “Aku bukan Mesias.” Bahasa Yunani membiarkan identitas yang disangkal itu tersirat, meskipun konteks menunjuk kepada Mesias.
    reason: alternative_reading
  - marker: b
    text: Sejumlah naskah dan terjemahan menyatakannya secara lebih khusus sebagai “melepaskan tali sandalnya”, tetapi teks Yunani yang digunakan di sini hanya menyebut “sandal pada kakinya ... melepaskannya”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: hampir menyelesaikan jalan pelayanannya
  rationale: Ungkapan ini menggambarkan Yohanes sedang mendekati penyelesaian tugas atau pelayanan yang ditetapkan baginya. 'Jalan pelayanannya' mempertahankan metafora perjalanan hidup-tugas tanpa menonjolkan gambaran perlombaan secara berlebihan; 'hampir menyelesaikan' menyampaikan proses yang sedang berlangsung.
- source_word: ἔλεγεν
  choice: ia terus berkata
  rationale: Bentuk imperfek dapat merangkum perkataan yang berulang atau berlangsung; 'terus berkata' menyampaikan daya iteratif tersebut secara alami.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Menurut kalian, siapakah aku ini?
  rationale: ὑπονοέω berarti mengira atau menyangka. Pertanyaan ini menyangkut identitas yang dilekatkan orang kepada Yohanes; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat pertanyaannya.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Bukan aku orangnya
  rationale: Bahasa Yunani bersifat eliptis dan menekankan ἐγώ. Terjemahan ini mempertahankan penyangkalan tanpa secara eksplisit memasukkan 'Mesias' ke dalam teks utama.
- source_word: ἀλλ’ ἰδοὺ
  choice: Namun lihatlah
  rationale: ἰδού mengarahkan perhatian pembaca atau pendengar. 'Lihatlah' bermartabat, jelas, dan tidak terlalu arkais.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: sesudah aku akan datang Dia
  rationale: Ungkapan ini menyatakan kedatangan tokoh berikutnya setelah Yohanes. Huruf kapital pada 'Dia' membantu rujukan personal dalam konteks tanpa menambahkan gelar yang tidak dinyatakan.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: yang bahkan sandal di kaki-Nya pun ... melepaskannya
  rationale: Teks tercetak menyebut ὑπόδημα, yakni sandal atau alas kaki, serta 'kaki', tanpa nomina khusus untuk tali. Bentuk Indonesia ini alami dan tidak memasukkan 'tali' ke dalam teks utama.
- source_word: ἄξιος
  choice: layak
  rationale: '''Layak'' menyampaikan makna kelayakan atau kepantasan dalam pernyataan kerendahan hati Yohanes.'
theological_decisions:
- issue: Identitas yang disangkal Yohanes dalam οὐκ εἰμὶ ἐγώ
  choice: Bukan aku orangnya
  alternative: Aku bukan Mesias
  rationale: Konteks menunjuk kepada tokoh mesianik, tetapi teks Yunani membiarkan identitas itu tersirat. Teks utama mempertahankan elipsis tersebut, sedangkan catatan kaki menjelaskan rujukan yang paling mungkin.
- issue: Ungkapan kerendahan hati mengenai sandal
  choice: sandal di kaki-Nya ... melepaskannya
  alternative: melepaskan tali sandal-Nya
  rationale: Pilihan utama mengikuti bentuk SBLGNT yang tidak memuat kata khusus untuk 'tali', sambil mempertahankan gambaran tugas rendah seorang hamba.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan dibuat alami bagi pembaca umum, sambil mempertahankan elipsis mengenai identitas Mesias, aspek berulang pada perkataan Yohanes, dan ketiadaan kata 'tali' dalam teks utama.
