review_pass:
  verdict: revise
  source_fidelity: Perlu revisi. “Hampir menyelesaikan” menyatakan bahwa Yohanes nyaris selesai, sedangkan ἐπλήρου (imperfek) menyatakan ia sedang menyelesaikan/menuntaskan. “Jalan pelayanannya” juga menambahkan secara eksplisit gagasan “pelayanan” yang tidak dinyatakan oleh δρόμος. “Akan datang Dia” mengubah bentuk kini ἔρχεται menjadi masa depan, tidak alami dalam susunan Indonesia, dan kapitalisasi “Dia/-Nya” memberi penandaan teologis yang tidak ada dalam teks Yunani.
  naturalness: Beberapa bagian sudah jelas dan berregister baik, khususnya pertanyaan dan “Namun lihatlah”. Namun “sesudah aku akan datang Dia” tidak idiomatis dalam bahasa Indonesia modern, dan “sandal di kaki-Nya pun aku tidak layak melepaskannya” lebih lancar bila dibentuk ulang menjadi “yang sandalnya pun aku tidak layak melepaskannya.”
  terminology: “Layak” dan “melepaskan” tepat. “Bukan aku orangnya” mempertahankan elipsis identitas secara wajar. “Tugasnya” menerjemahkan metafora δρόμος secara netral tanpa menambahkan jabatan atau pelayanan tertentu. Kapitalisasi pronomina bagi tokoh yang akan datang dihapus agar tidak menafsirkan lebih dari yang diungkapkan teks.
  issues:
  - severity: medium
    issue: “hampir menyelesaikan” untuk ἐπλήρου
    rationale: “Hampir” berarti belum mencapai tahap penyelesaian; bentuk imperfek Yunani menunjukkan proses menyelesaikan, bukan sekadar hampir selesai.
  - severity: medium
    issue: “jalan pelayanannya” menambahkan “pelayanan”
    rationale: δρόμος secara metaforis dapat menunjuk perjalanan atau tugas hidup, tetapi ayat ini tidak secara eksplisit menyebut pelayanan. “Tugasnya” menyampaikan fungsi metaforis tanpa penambahan itu.
  - severity: medium
    issue: “sesudah aku akan datang Dia”
    rationale: Susunannya tidak alami, “akan datang” menggeser ἔρχεται dari bentuk kini, dan “Dia” berkapital menambahkan penandaan interpretatif.
  - severity: low
    issue: Kapitalisasi “-Nya” dalam teks dan catatan
    rationale: Kapitalisasi pronomina untuk tokoh yang tersirat sebagai Mesias bukan tuntutan bahasa sumber dan dapat mengurangi tingkat keimplisitan yang dipertahankan oleh terjemahan.
