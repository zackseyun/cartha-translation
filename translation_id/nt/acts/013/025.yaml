revisions:
- from: Ketika Yohanes hampir menyelesaikan jalan pelayanannya, ia terus berkata, “Menurut kalian, siapakah aku ini? Bukan aku orangnya.[a] Namun lihatlah, sesudah aku akan datang Dia yang bahkan sandal di kaki-Nya pun aku tidak layak melepaskannya.”[b]
  to: Ketika Yohanes sedang menyelesaikan tugasnya, ia terus berkata, “Menurut kalian, siapakah aku ini? Bukan aku orangnya.[a] Namun lihatlah, ada seseorang yang datang sesudah aku, yang sandalnya pun aku tidak layak melepaskannya.”[b]
  rationale: Revisi mengganti “hampir menyelesaikan” dengan bentuk progresif yang sesuai dengan imperfek, menghilangkan tambahan “pelayanan”, serta membentuk ulang klausa tentang tokoh yang datang agar alami dalam bahasa Indonesia dan tetap mencerminkan bentuk kini Yunani. Elipsis tentang identitas yang disangkal tetap dipertahankan, dengan penjelasan terbatas pada catatan kaki. Catatan b juga diselaraskan dengan teks tanpa memasukkan “tali” ke dalam teks utama.
