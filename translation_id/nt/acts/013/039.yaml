  text: In him everyone who believes is justified[a].
translation:
  language: id
  text: Di dalam Dia, setiap orang yang percaya dibenarkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Melalui orang ini, setiap orang yang percaya dibenarkan.” Frasa Yunani ἐν τούτῳ secara lebih harfiah dapat diterjemahkan “di dalam/melalui orang ini” dan merujuk kepada Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Di dalam Dia
  rationale: Frasa ini secara harfiah berarti 'di dalam/pada orang ini'. Dalam konteks langsung, kata penunjuk itu merujuk kembali kepada Yesus. 'Di dalam Dia' alami dalam bahasa Indonesia dan tetap mempertahankan konstruksi preposisional Yunani.
- source_word: πᾶς ὁ πιστεύων
  choice: setiap orang yang percaya
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan bersifat umum. Terjemahan ini wajar dalam bahasa Indonesia serta mencakup siapa saja yang percaya tanpa membuat aspek partisipelnya terasa kaku.
- source_word: δικαιοῦται
  choice: dibenarkan
  rationale: Bentuk pasif ini dipertahankan secara ringkas. 'Dibenarkan' merupakan padanan baku yang menjaga nuansa forensik δικαιόω tanpa mempersempitnya menjadi sekadar 'dibebaskan dari tuduhan' atau memperluasnya secara interpretatif.
theological_decisions:
- issue: Rujukan ἐν τούτῳ
  choice: 'rujukan pribadi kepada Yesus: ''Di dalam Dia'''
  alternative: '''melalui orang ini'' atau ''di dalam orang ini'''
  rationale: Konteks sebelumnya menyebut Yesus sebagai Dia yang melalui-Nya pengampunan diberitakan. Pilihan ini mengikuti alur wacana, sementara catatan kaki mempertahankan kemungkinan nuansa instrumental yang melekat pada frasa Yunani.
- issue: Makna δικαιοῦται dalam konteks Paulus
  choice: 'forensik: ''dibenarkan'''
  alternative: '''dinyatakan benar'', ''dijadikan benar'', atau ''dibebaskan dari tuduhan'''
  rationale: Konteks langsung mempertentangkan apa yang tidak dapat diperoleh melalui hukum Musa dengan pembenaran melalui Yesus. 'Dibenarkan' mempertahankan ketegangan teologis dan tidak menentukan secara berlebihan apakah kata tersebut harus dijelaskan hanya sebagai deklarasi hukum atau dengan rumusan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi 'Dia' dipakai untuk memperjelas rujukan kepada Yesus dalam terjemahan utama; catatan kaki menjelaskan bentuk demonstratif sumber tanpa menutupi kemungkinan nuansa instrumentalnya.
