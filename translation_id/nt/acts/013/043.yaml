revisions:
- from: Sesudah pertemuan di rumah ibadat itu berakhir[a], banyak orang Yahudi dan penganut agama Yahudi yang saleh mengikuti Paulus dan Barnabas. Keduanya berbicara dengan mereka dan terus mendorong mereka agar tetap hidup dalam anugerah Allah.[b]
  to: Sesudah pertemuan di rumah ibadat itu berakhir[a], banyak orang Yahudi dan orang-orang saleh yang telah menjadi penganut agama Yahudi mengikuti Paulus dan Barnabas. Sambil berbicara dengan mereka, Paulus dan Barnabas terus meyakinkan mereka agar tetap berada dalam anugerah Allah.[b]
  rationale: Revisi menghapus tambahan semantis “hidup,” memperjelas bahwa kelompok kedua adalah para proselit, dan mempertahankan aspek tindakan yang berlangsung dalam ἔπειθον melalui “terus meyakinkan.” Makna teologis “anugerah Allah” tetap tidak dipersempit.
