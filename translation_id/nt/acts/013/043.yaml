  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: id
  text: Sesudah pertemuan di rumah ibadat itu berakhir[a], banyak orang Yahudi dan orang-orang saleh yang telah menjadi penganut agama Yahudi mengikuti Paulus dan Barnabas. Sambil berbicara dengan mereka, Paulus dan Barnabas terus meyakinkan mereka agar tetap berada dalam anugerah Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sesudah jemaat di rumah ibadat itu dibubarkan.” Kata Yunani yang dipakai dapat menunjuk pada berakhirnya pertemuan umat, bukan pada bangunannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “terus membujuk mereka agar bertekun dalam anugerah Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Sesudah pertemuan di rumah ibadat itu berakhir
  rationale: Genitif absolut menyatakan keadaan yang lebih dahulu. συναγωγή di sini paling wajar menunjuk pada pertemuan umat yang baru selesai, bukan bangunannya; ungkapan ini menyampaikan makna λυθείσης secara alami tanpa mengatakan bahwa bangunan dibubarkan.
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: Padanan langsung yang sesuai untuk tindakan orang-orang yang pergi mengikuti Paulus dan Barnabas setelah pertemuan.
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: banyak orang Yahudi
  rationale: Menyampaikan konstruksi partitif Yunani secara idiomatis dalam bahasa Indonesia.
- source_word: τῶν σεβομένων προσηλύτων
  choice: penganut agama Yahudi yang saleh
  rationale: προσήλυτος merujuk kepada orang yang masuk agama Yahudi, bukan sekadar simpatisan; σεβομένων menunjukkan kesalehan atau pengabdian mereka. Rumusan ini lebih mudah dipahami pembaca umum daripada transliterasi 'proselit'.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: berbicara dengan mereka
  rationale: Partisipel ini menggambarkan tindakan yang menyertai; frasa tersebut mempertahankan nuansa interaksi yang sedang berlangsung tanpa melebihkan arti awalan πρός.
- source_word: ἔπειθον
  choice: terus mendorong
  rationale: Bentuk imperfek menunjukkan tindakan berkelanjutan, sedangkan konteksnya bersifat ajakan atau desakan. 'Mendorong' mempertahankan daya persuasif tanpa menyiratkan bahwa mereka pasti berhasil diyakinkan.
- source_word: αὐτοὺς προσμένειν
  choice: mereka agar tetap hidup
  rationale: προσμένω berarti tetap, bertahan, atau terus berada dalam sesuatu. Tambahan 'hidup' menghasilkan ungkapan Indonesia yang alami sambil menunjukkan keberlanjutan dalam ranah anugerah.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: dalam anugerah Allah
  rationale: Mempertahankan ungkapan teologis Yunani dan tidak mempersempitnya hanya menjadi perkenanan Allah atau hanya berita tentang anugerah.
theological_decisions:
- issue: Makna 'anugerah Allah' dalam nasihat para rasul
  choice: tetap hidup dalam anugerah Allah
  alternative: tetap berada dalam kemurahan Allah; tetap berpegang pada berita tentang anugerah Allah
  rationale: Frasa Yunani dapat mencakup tindakan Allah yang penuh anugerah sekaligus lingkungan kehidupan yang dibentuk olehnya. Terjemahan utama mempertahankan keluasan dan ketegangan makna itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah ibadat' dipakai agar mudah dipahami, sedangkan 'penganut agama Yahudi' menghindari istilah teknis 'proselit'. Struktur kalimat dipecah menjadi dua untuk menjaga kejelasan rujukan tanpa mengubah hubungan tindakan dalam teks Yunani.
