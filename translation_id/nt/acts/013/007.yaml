id: ACT.13.7
reference: Acts 13:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: id
  text: yang berada bersama prokonsul Sergius Paulus, seorang yang cerdas.[a] Prokonsul itu memanggil Barnabas dan Saulus serta ingin mendengar firman Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang yang bijaksana" atau "seorang yang berpengertian."
    reason: lexical_alternative
  - marker: b
    text: Atau "pesan Allah."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: prokonsul
  rationale: Istilah ini secara khusus menunjuk pejabat Romawi yang memerintah provinsi berstatus senatorial; "prokonsul" mempertahankan ketepatan historis lebih baik daripada istilah umum "gubernur".
- source_word: σὺν
  choice: bersama
  rationale: Kata depan ini menyatakan hubungan atau kebersamaan; "bersama" alami dan cukup tepat dalam konteks ini.
- source_word: ἀνδρὶ συνετῷ
  choice: seorang yang cerdas
  rationale: συνετός dapat menyatakan kecerdasan, pengertian, atau kebijaksanaan praktis. "Cerdas" jelas dalam bahasa Indonesia modern dan tidak menjadikannya penilaian moral yang terlalu kuat.
- source_word: οὗτος
  choice: Prokonsul itu
  rationale: Kata tunjuk ini kembali kepada Sergius Paulus dengan sedikit penegasan. Pengulangan jabatannya membuat rujukan jelas dan lebih alami daripada terjemahan harfiah "orang ini".
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip medium ini menyatakan bahwa Sergius Paulus memanggil Barnabas dan Saulus agar datang kepadanya. "Memanggil" mempertahankan prakarsanya tanpa menyiratkan paksaan secara berlebihan.
- source_word: ἐπεζήτησεν
  choice: ingin
  rationale: Dalam konstruksi dengan infinitif, kata kerja ini menyatakan keinginan atau upaya untuk memperoleh kesempatan mendengar. "Ingin" menghasilkan ungkapan Indonesia yang alami, sementara unsur kesungguhan tetap tersirat oleh tindakan memanggil mereka.
- source_word: ἀκοῦσαι
  choice: mendengar
  rationale: Padanan langsung dan wajar untuk infinitif ini dalam konteks menerima pemberitaan.
- source_word: λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan ini menunjuk pada berita yang berasal dari Allah. "Firman Allah" mempertahankan bentuk ungkapan Yunani dan merupakan istilah Alkitabiah yang lazim, sedangkan alternatif dinamis dicatat dalam catatan kaki.
- source_word: Σεργίῳ Παύλῳ
  choice: Sergius Paulus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabas dan Saulus
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan λόγον τοῦ θεοῦ
  choice: firman Allah
  alternative: pesan Allah
  rationale: '"Firman Allah" lebih transparan terhadap bentuk sumber dan mempertahankan ungkapan Alkitabiah tanpa menambahkan nuansa doktrinal; "pesan Allah" merupakan penjelasan dinamis yang sah.'
- issue: Nuansa συνετῷ dalam gambaran tentang Sergius Paulus
  choice: seorang yang cerdas
  alternative: seorang yang bijaksana; seorang yang berpengertian
  rationale: Istilah ini memuji kemampuan memahami atau menimbang dengan baik, tetapi tidak harus menyatakan kebajikan moral atau rohani. "Cerdas" menjaga pujian positif tanpa memperluasnya secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Istilah historis "prokonsul" dipertahankan; "firman Allah" dipakai sebagai ungkapan Alkitabiah yang tetap mudah dipahami. Kata tunjuk diterjemahkan sebagai "Prokonsul itu" untuk memperjelas rujukan setelah keterangan aposisional.
