base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: id
  text: Namun, mereka melanjutkan perjalanan dari Perga dan tiba di Antiokhia di Pisidia[a]. Pada hari Sabat mereka masuk ke sinagoge lalu duduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Antiokhia Pisidia.” Teks Yunani berbunyi “Antiokhia di Pisidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Namun, mereka
  rationale: δέ melanjutkan narasi dengan nuansa peralihan atau kontras ringan. Pronomina eksplisit αὐτοὶ cukup wajar diwakili oleh “mereka” tanpa penekanan kaku “mereka sendiri”.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: melanjutkan perjalanan dari Perga
  rationale: Partisip aoristus διέρχομαι dalam konteks perjalanan menunjukkan bahwa mereka bergerak terus dari Perga; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan alur perjalanan.
- source_word: παρεγένοντο
  choice: tiba di
  rationale: Dalam konteks perjalanan, παραγίνομαι berarti datang atau tiba di suatu tempat; “tiba di” menyampaikan tercapainya tujuan secara ringkas.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antiokhia di Pisidia
  rationale: Frasa ini membedakan kota Antiokhia tersebut berdasarkan wilayahnya. Pilihan ini dekat dengan bentuk Yunani dan jelas bagi pembaca modern.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: mereka masuk ke rumah ibadat
  rationale: Partisip diterjemahkan sebagai verba finit agar kalimat Indonesia mengalir alami. “Rumah ibadat” merupakan padanan umum dan mudah dipahami untuk συναγωγή.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Pada hari Sabat
  rationale: Ini adalah ungkapan idiomatis bagi hari Sabat Yahudi; bentuk jamak Yunani tidak perlu dipertahankan secara harfiah dalam bahasa Indonesia.
- source_word: ἐκάθισαν
  choice: lalu duduk
  rationale: Verba aoristus menyatakan tindakan sederhana mengambil posisi duduk; “lalu” memperjelas urutan tanpa menambah makna substantif.
