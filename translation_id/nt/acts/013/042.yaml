  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: id
  text: Ketika mereka keluar[a][b], mereka terus memohon agar perkataan ini disampaikan kepada mereka pada hari Sabat berikutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi lebih eksplisit, “Ketika Paulus dan Barnabas keluar, orang-orang memohon agar perkataan ini disampaikan kepada mereka pada hari Sabat berikutnya.”
    reason: textual_variant
  - marker: b
    text: Atau, “Ketika mereka pergi, mereka meminta agar hal-hal ini disampaikan kepada mereka pada hari Sabat yang akan datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: Ketika mereka keluar
  rationale: Klausa genitif absolut dengan partisipel kini paling wajar diterjemahkan sebagai anak kalimat temporal. Pronomina “mereka” mempertahankan ketidakjelasan rujukan dalam teks SBLGNT, sedangkan δέ terserap secara alami dalam hubungan temporal.
- source_word: παρεκάλουν
  choice: orang-orang terus memohon
  rationale: Bentuk imperfek menggambarkan permohonan yang sedang berlangsung atau berulang. “Memohon” menyampaikan kesungguhan παρακαλέω tanpa sekuat “mendesak”. Subjek tersirat dibuat “orang-orang” demi kejelasan bahasa Indonesia dan sesuai konteks, tanpa mengidentifikasi mereka lebih khusus.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: pada hari Sabat berikutnya
  rationale: Ungkapan ini secara idiomatis menunjuk kepada Sabat yang akan datang atau berikutnya; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: λαληθῆναι
  choice: disampaikan
  rationale: Infinitif pasif λαλέω menunjuk pada tindakan mengucapkan atau menyampaikan secara lisan. “Disampaikan” lebih alami daripada “dikatakan” ketika objeknya adalah isi khotbah.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif berfungsi sebagai penerima perkataan dan secara alami diterjemahkan “kepada mereka”.
- source_word: τὰ ῥήματα ταῦτα
  choice: perkataan-perkataan itu
  rationale: ῥήματα menunjuk pada perkataan atau ucapan yang baru disampaikan. Bentuk ini dekat dengan teks sumber dan tidak mengubahnya menjadi konsep yang lebih abstrak seperti “pesan”.
theological_decisions:
- issue: Rujukan pronomina dan pelaku permohonan
  choice: “Mereka” pada klausa pembuka dipertahankan, sementara pelaku permohonan diterjemahkan secara umum sebagai “orang-orang”.
  alternative: Menentukan secara eksplisit bahwa Paulus dan Barnabas keluar dan bahwa jemaat atau bangsa-bangsa lain memohon.
  rationale: Teks SBLGNT hanya memakai pronomina pada klausa pembuka dan subjek tersirat pada verba utama. Terjemahan tidak menetapkan identitas yang lebih khusus daripada yang didukung teks, sedangkan catatan varian menjelaskan bacaan yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan “perkataan-perkataan” dipertahankan untuk mencerminkan bentuk jamak ῥήματα; “lagi” dibuat eksplisit secara kontekstual karena permintaan itu mengacu pada penyampaian ulang pada Sabat berikutnya.
