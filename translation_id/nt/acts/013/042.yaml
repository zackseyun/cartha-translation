  naturalness: Kalimat Indonesia dapat tetap alami sambil mempertahankan ambiguitas dengan pengulangan pronomina “mereka.” “Perkataan-perkataan” terdengar kurang luwes dalam bahasa Indonesia modern; “perkataan ini” menyampaikan bentuk jamak Yunani secara idiomatis dalam konteks ini.
  terminology: “Sabat” tepat. “Terus memohon” merupakan padanan yang wajar bagi imperfek παρεκάλουν dalam konteks permintaan sungguh-sungguh. “Disampaikan kepada mereka” mempertahankan bentuk pasif λαληθῆναι dan datif αὐτοῖς.
