id: ACT.13.23
reference: Acts 13:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: id
  text: Dari keturunan orang ini[a], sesuai dengan janji[b], Allah telah mendatangkan kepada Israel seorang Penyelamat, yaitu Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari benih orang ini”; yang dimaksud ialah garis keturunan Daud.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sebagaimana telah dijanjikan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: orang ini
  rationale: Kata tunjuk bentuk genitif ini merujuk kembali kepada Daud dalam ayat sebelumnya. Ungkapan “orang ini” mempertahankan rujukan tersebut tanpa mengganti kata tunjuk dengan nama yang tidak diulang dalam teks Yunani.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: dari keturunan
  rationale: σπέρμα secara harfiah dapat berarti “benih”, tetapi di sini menunjuk pada garis keturunan Daud. “Keturunan” alami dalam bahasa Indonesia modern dan tetap mempertahankan makna genealogisnya.
- source_word: κατ’ ἐπαγγελίαν
  choice: sesuai dengan janji
  rationale: Frasa ini menyatakan kesesuaian dengan suatu janji sebelumnya. Terjemahan ini tidak menambahkan secara eksplisit pihak yang berjanji atau membatasi janji itu lebih jauh daripada teks sumber.
- source_word: ἤγαγεν
  choice: telah mendatangkan
  rationale: ἄγω pada dasarnya berarti membawa atau mendatangkan. “Telah mendatangkan” menyatakan tindakan Allah yang sudah terlaksana tanpa menimbulkan kesan khusus tentang kebangkitan seperti yang mungkin muncul dari “membangkitkan”.
- source_word: τῷ Ἰσραήλ
  choice: kepada Israel
  rationale: Bentuk datif paling langsung dinyatakan dengan “kepada Israel”, sambil tetap memungkinkan nuansa bahwa tindakan itu dilakukan bagi kepentingan Israel.
- source_word: σωτῆρα
  choice: seorang Penyelamat
  rationale: σωτήρ berarti penyelamat atau pembebas. “Penyelamat” merupakan padanan yang jelas dan sesuai dengan bobot gelar ini dalam konteks kristologis.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Nama pribadi ini dialihaksarakan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Hubungan Yesus dengan keturunan Daud dan janji Allah
  choice: Ayat ini menyatakan bahwa Allah mendatangkan Yesus dari garis keturunan tokoh yang baru disebut, yaitu Daud, sesuai dengan janji.
  alternative: Menjelaskannya secara eksplisit sebagai “penggenapan janji Allah kepada Daud”.
  rationale: Teks Yunani menghubungkan keturunan Daud, janji, dan tindakan Allah, tetapi tidak menguraikan janji itu dalam ayat ini. Terjemahan utama mempertahankan hubungan tersebut tanpa menambahkan penjelasan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penekanan awal pada asal-usul dari keturunan Daud, sedangkan “yaitu Yesus” secara alami menyatakan aposisi σωτῆρα Ἰησοῦν. Kapitalisasi “Penyelamat” memperlakukan kata itu sebagai gelar yang merujuk kepada Yesus.
