  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: id
  text: Karena itu, hendaklah kalian ketahui, saudara-saudara[a], bahwa melalui Dia[b] pengampunan dosa diberitakan kepada kalian, dan dari segala hal yang tidak dapat membuat kalian dibenarkan oleh hukum Musa—[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani ini berbentuk maskulin; dalam konteksnya, sapaan ini dapat mencakup seluruh pendengar.
    reason: lexical_alternative
  - marker: b
    text: Yaitu Yesus, yang baru saja disebutkan.
    reason: cross_reference
  - marker: d
    text: Kalimat Yunani berlanjut dan diselesaikan dalam ayat 39.
    reason: verse_boundary
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Karena itu, ketahuilah
  rationale: Bentuk imperatif impersonal Yunani dialihkan menjadi perintah langsung yang alami dalam bahasa Indonesia; “Karena itu” mempertahankan οὖν dan hubungan logisnya.
- source_word: ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan kekeluargaan ini alami dan bermartabat dalam bahasa Indonesia. Kata Indonesia tersebut tidak menandai gender sejelas bentuk maskulin jamak Yunani, sehingga catatan kaki menyimpan nuansa bentuk sumber.
- source_word: διὰ τούτου
  choice: melalui Dia
  rationale: Kata tunjuk maskulin tunggal ini menunjuk kembali kepada Yesus. “Melalui Dia” lebih alami daripada “melalui orang ini” dan tidak menambahkan nomina yang tidak terdapat dalam teks.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: pengampunan dosa
  rationale: Padanan yang jelas, lazim, dan tepat untuk pelepasan atau pengampunan atas dosa dalam konteks ini.
- source_word: καταγγέλλεται
  choice: diberitakan
  rationale: Bentuk pasif kini menyatakan pengumuman atau pemberitaan kepada umum; “diberitakan” mempertahankan daya pewartaan verba tersebut.
- source_word: ἀπὸ πάντων ὧν
  choice: dari segala sesuatu yang darinya
  rationale: Mempertahankan pengulangan relasi ἀπό dalam konstruksi Yunani, sekalipun klausa ini baru diselesaikan pada ayat berikutnya.
- source_word: οὐκ ἠδυνήθητε
  choice: kalian tidak dapat
  rationale: Padanan langsung dan alami bagi pernyataan ketidakmampuan yang ditujukan kepada para pendengar jamak.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: melalui hukum Musa
  rationale: ἐν dapat menyatakan sarana atau lingkup. “Melalui” menyampaikan bahwa hukum Musa tidak menjadi sarana pembenaran, sambil menghindari kesan bahwa teks hanya menunjuk lokasi.
- source_word: δικαιωθῆναι
  choice: dibenarkan
  rationale: Mempertahankan istilah teologis dan yuridis yang mapan tanpa mempersempitnya menjadi perubahan moral semata.
theological_decisions:
- issue: Makna δικαιωθῆναι dalam hubungannya dengan hukum Musa
  choice: dibenarkan
  alternative: dinyatakan benar
  rationale: “Dibenarkan” mempertahankan keluasan dan bobot teologis verba Yunani; alternatif pada catatan kaki menjelaskan kemungkinan nuansa yuridis tanpa menjadikannya satu-satunya tafsiran.
- issue: Rujukan διὰ τούτου
  choice: melalui Dia
  alternative: melalui orang ini
  rationale: Rujukannya adalah Yesus yang baru disebutkan dalam konteks. Huruf kapital membantu pembaca mengenali rujukan personal tanpa memasukkan nama ke dalam teks utama.
- issue: Batas ayat dan klausa yang belum selesai
  choice: mengakhiri ayat dengan tanda pisah
  alternative: memasukkan klausa utama dari Kisah Para Rasul 13:39
  rationale: Sumber SBLGNT yang diberikan berakhir pada infinitif δικαιωθῆναι dan secara sintaksis berlanjut ke ayat 39. Menambahkan “setiap orang yang percaya dibenarkan” akan menerjemahkan bahan dari ayat berikutnya, bukan ayat 38.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Saudara-saudara” dipakai sebagai sapaan formal-kekeluargaan, sedangkan “kalian” menghindari pengulangan yang berat. Tanda pisah mempertahankan kenyataan bahwa teks ayat 38 yang diberikan berakhir di tengah konstruksi sintaksis dan berlanjut ke ayat 39.
