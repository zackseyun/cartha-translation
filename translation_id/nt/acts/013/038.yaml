- from: Karena itu, ketahuilah, Saudara-saudara[a], bahwa melalui Dia[b] pengampunan dosa diberitakan kepada kalian, dan dari segala sesuatu yang darinya kalian tidak dapat dibenarkan[c] melalui hukum Musa—[d]
  to: Karena itu, hendaklah kalian ketahui, saudara-saudara[a], bahwa melalui Dia[b] pengampunan dosa diberitakan kepada kalian, dan dari segala hal yang tidak dapat membuat kalian dibenarkan oleh hukum Musa—[d]
  rationale: Revisi mempertahankan batas ayat yang diberikan dalam sumber dan ketidaklengkapan sintaksis yang disengaja pada akhir ayat. Ungkapan Indonesia diperhalus agar modern dan idiomatis, sementara “oleh hukum Musa” lebih tepat untuk relasi ἐν νόμῳ Μωϋσέως dengan “dibenarkan.” Catatan a diperbaiki agar menjelaskan bentuk maskulin tanpa parafrasa harfiah yang tidak tepat.
