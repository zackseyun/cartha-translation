  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: id
  text: Kemudian mereka meminta seorang raja[a], dan Allah memberi mereka Saul, anak Kis, seorang laki-laki dari suku Benyamin, selama empat puluh tahun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesudah itu mereka meminta seorang raja.” Kata pembuka ini dapat berfungsi sebagai penanda peralihan dalam urutan sejarah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “selama empat puluh tahun” dapat menimbulkan pertanyaan kronologis jika dibandingkan dengan keterangan dalam Perjanjian Lama; terjemahan ini mempertahankan kata-kata Lukas sebagaimana adanya.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Kemudian
  rationale: Dalam rangkaian ringkasan sejarah ini, ungkapan tersebut berfungsi sebagai penghubung ke tahap berikutnya. “Kemudian” alami dalam bahasa Indonesia dan tetap mempertahankan urutan naratif; kemungkinan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ᾐτήσαντο βασιλέα
  choice: mereka meminta seorang raja
  rationale: Bentuk medial menyatakan permintaan yang mereka ajukan bagi diri mereka. “Meminta” tidak melebihkan nadanya menjadi “menuntut,” sedangkan “seorang raja” menyatakan jenis pemimpin yang diminta.
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Allah memberi mereka
  rationale: Terjemahan ini mempertahankan verba umum “memberi,” subjek eksplisit Allah, dan penerima tindakan tanpa mempersempit maknanya menjadi “mengangkat” atau menafsirkannya sebagai “mengabulkan.”
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Saul, anak Kish
  rationale: Nama pribadi dan patronimik dialihaksarakan menurut bentuk Indonesia yang lazim, dengan aposisi yang jelas dan alami.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: seorang dari suku Benyamin
  rationale: Dalam bahasa Indonesia, “seorang dari suku Benyamin” menyampaikan bahwa Saul adalah seorang laki-laki yang berasal dari suku tersebut tanpa pengulangan canggung “seorang laki-laki.”
- source_word: ἔτη τεσσεράκοντα
  choice: selama empat puluh tahun
  rationale: Frasa akusatif ini menyatakan durasi. “Selama” membuat fungsi waktunya jelas dan paling wajar dikaitkan dengan pemberian Saul sebagai raja dalam alur kalimat.
theological_decisions:
- issue: Kaitan frasa durasi ἔτη τεσσεράκοντα
  choice: 'Diterjemahkan sebagai durasi Allah memberikan Saul kepada mereka: “selama empat puluh tahun.”'
  alternative: Frasa itu dapat dipahami secara lebih longgar sebagai bagian dari ringkasan sejarah, dan perbandingan dengan data Perjanjian Lama dapat menimbulkan pertanyaan kronologis.
  rationale: Susunan bahasa Yunani paling alami mengaitkan durasi itu dengan klausa sebelumnya tentang Allah memberikan Saul. Terjemahan mempertahankan kata-kata Lukas tanpa menyelaraskan atau menyelesaikan ketegangan kronologis di luar teks.
translation_notes:
  register: 'Bahasa Indonesia baku modern, lugas, dan bermartabat. Pilihan “Kemudian” lebih alami daripada “Dan dari sana” untuk peralihan historis ini, sementara alternatifnya dicatat. Ejaan nama mengikuti bentuk Alkitab Indonesia yang dikenal: Saul, Kish, dan Benyamin.'
