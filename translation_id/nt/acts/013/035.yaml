  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: id
  text: Karena itu, Ia juga berkata dalam mazmur lain[a], “Engkau tidak akan membiarkan Orang Kudus-Mu[b] mengalami pembusukan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam yang lain”; dapat juga diterjemahkan “di bagian lain” atau “dalam nas lain.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “orang setia-Mu” atau “orang saleh-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kebusukan” atau “kerusakan.” Dalam konteks ini kata Yunani menunjuk pada pembusukan setelah kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Karena itu
  rationale: Dalam konteks ini kata tersebut memperkenalkan dukungan lanjutan bagi kesimpulan dari ayat sebelumnya; 'Karena itu' menyampaikan fungsi inferensialnya secara wajar.
- source_word: καὶ
  choice: juga
  rationale: Kata ini menandai tambahan kesaksian Kitab Suci.
- source_word: ἐν ἑτέρῳ
  choice: dalam mazmur yang lain
  rationale: Secara harfiah hanya 'dalam yang lain'; 'mazmur' disuplai karena kutipan berasal dari Mazmur 16 dan konteksnya memuat rangkaian kutipan Kitab Suci.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini dari formula kutipan dipertahankan. Subjek tersirat dipahami sebagai Allah dalam konteks, tetapi teks Yunani tidak menyebutkannya secara eksplisit.
- source_word: Οὐ δώσεις
  choice: Engkau tidak akan membiarkan
  rationale: δίδωμι dengan infinitif di sini bersifat idiomatis, yaitu 'mengizinkan' atau 'membiarkan', bukan sekadar 'memberikan'.
- source_word: τὸν ὅσιόν σου
  choice: Orang Kudus-Mu
  rationale: ὅσιος dapat berarti kudus, saleh, atau setia. Dalam argumen Paulus, kutipan ini diterapkan kepada Yesus; bentuk ini mempertahankan nuansa kekudusan tanpa menghapus alternatif 'orang setia-Mu'.
- source_word: ἰδεῖν
  choice: mengalami
  rationale: Secara harfiah berarti 'melihat', tetapi dalam ungkapan ini bermakna mengalami suatu keadaan; 'mengalami' lebih alami dalam bahasa Indonesia.
- source_word: διαφθοράν
  choice: kebinasaan
  rationale: Kata ini dapat menunjuk pada kebusukan atau kehancuran. 'Kebinasaan' cukup luas untuk mempertahankan cakupan katanya, sedangkan konteks kebangkitan mengarah khususnya pada pembusukan tubuh.
theological_decisions:
- issue: Rujukan mesianik/kristologis τὸν ὅσιόν σου
  choice: Orang Kudus-Mu, dengan huruf kapital
  alternative: orang kudus-Mu; orang setia-Mu
  rationale: Paulus menerapkan mazmur ini kepada Yesus dalam konteks langsung. Kapitalisasi menandai rujukan kontekstual tanpa menjadikan 'Mesias' bagian eksplisit dari terjemahan.
- issue: Nomina tersirat sesudah ἐν ἑτέρῳ
  choice: mazmur yang lain
  alternative: bagian lain; nas lain
  rationale: Bahasa Yunani hanya mengatakan 'dalam yang lain'. Menyebut 'mazmur' membantu pembaca mengenali jenis kutipan, tetapi sifat elipsis sumber tetap dicatat.
- issue: Makna διαφθοράν dalam argumen kebangkitan
  choice: kebinasaan
  alternative: kebusukan; kerusakan
  rationale: Pilihan utama tidak terlalu cepat membatasi makna pada proses biologis, sementara catatan menjelaskan arti yang sangat mungkin dalam konteks kematian dan kebangkitan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Susunan kalimat dibuat alami bagi pembaca umum. Kapitalisasi 'Ia' dan 'Orang Kudus-Mu' mengikuti rujukan kontekstual kepada Allah dan Yesus, sedangkan alternatif leksikal yang nyata dipertahankan dalam catatan.
