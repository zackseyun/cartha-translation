  naturalness: ‘Karena itu, Ia juga berkata dalam mazmur lain’ adalah bahasa Indonesia baku dan mengalir. ‘Mengalami pembusukan’ menyampaikan idiom ‘melihat kerusakan’ secara wajar dalam konteks kematian tanpa mengurangi makna jasmaninya.
  terminology: ‘Orang Kudus-Mu’ dapat dipertahankan sebagai rujukan kontekstual dalam argumentasi Paulus, dengan alternatif ‘orang setia-Mu’ dicatat. ‘Pembusukan’ adalah padanan utama yang lebih tepat bagi διαφθορά; ‘kebusukan’ dan ‘kerusakan’ dicatat sebagai alternatif.
