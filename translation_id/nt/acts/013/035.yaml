  to: Karena itu, Ia juga berkata dalam mazmur lain[a], “Engkau tidak akan membiarkan Orang Kudus-Mu[b] mengalami pembusukan.”[c]
  rationale: Revisi mengganti ‘kebinasaan’ dengan ‘pembusukan’ demi ketepatan makna διαφθορά dalam argumen tentang kebangkitan. Jangkar catatan kaki dipindahkan ke kata atau frasa yang diterangkan dan catatan gabungan dipecah agar setiap alternatif leksikal jelas. Kapitalisasi ‘Ia’ dan ‘Orang Kudus-Mu’ dipertahankan sebagai penandaan rujukan kontekstual, bukan sebagai tambahan istilah ke dalam teks.
