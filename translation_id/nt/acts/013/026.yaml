  terminology: Allah, keselamatan, dan takut akan Allah sudah tepat. “Pesan” merupakan padanan yang baik bagi λόγος dalam konteks pewartaan. Catatan untuk ἡμῖν perlu dipertahankan karena bahasa Yunani tidak membedakan ‘kita’ dan ‘kami’, sedangkan bahasa Indonesia harus memilih salah satunya.
