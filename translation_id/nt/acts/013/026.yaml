  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: id
  text: Saudara-saudara[a], anak-anak dari keturunan Abraham, dan orang-orang di antara kalian yang takut akan Allah[b], pesan tentang keselamatan ini telah dikirim kepada kita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Laki-laki, saudara-saudara.” Bentuk sapaan dalam bahasa Yunani secara harfiah maskulin, tetapi dapat mencakup hadirin yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang yang takut akan Allah di antara kalian.” Ungkapan ini mungkin menunjuk kepada orang-orang non-Yahudi yang menyembah Allah Israel dan berhubungan dengan sinagoge.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “firman/pesan keselamatan ini telah diutus kepada kita.” Bahasa Yunani tidak membedakan “kita” dan “kami”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini alami dan bermartabat dalam bahasa Indonesia serta dapat digunakan kepada sidang secara luas, meskipun bentuk Yunaninya secara harfiah maskulin.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: keturunan keluarga Abraham
  rationale: Ungkapan ini mempertahankan gagasan garis keturunan atau kaum Abraham tanpa memakai frasa Indonesia yang kaku seperti 'anak-anak lelaki dari keluarga Abraham'.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: kalian yang takut akan Allah
  rationale: Terjemahan deskriptif ini mempertahankan makna langsung φοβούμενοι dan tidak memaksakan istilah historis semi-teknis 'orang-orang yang takut akan Allah'.
- source_word: ἡμῖν
  choice: kepada kitalah
  rationale: Dativa menunjukkan pihak yang menerima pengutusan berita. Partikel -lah menampilkan penekanan dari posisi awal ἡμῖν; 'kita' mencakup pembicara dan para pendengar yang baru saja disapa.
- source_word: ὁ λόγος
  choice: berita
  rationale: Dalam konteks pewartaan, 'berita' menyampaikan arti λόγος secara alami; arti harfiah 'firman/perkataan' tetap dicatat sebagai alternatif.
- source_word: τῆς σωτηρίας ταύτης
  choice: tentang keselamatan ini
  rationale: Genitiva dapat menyatakan isi berita. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan erat antara berita dan keselamatan.
- source_word: ἐξαπεστάλη
  choice: telah disampaikan
  rationale: Pasif aoristus menyatakan tindakan pengutusan yang selesai dan relevan bagi pendengar. 'Disampaikan' lebih alami untuk berita dalam bahasa Indonesia, sedangkan arti lebih harfiah 'diutus/dikirimkan' dicatat.
theological_decisions:
- issue: Sebutan bagi οἱ ... φοβούμενοι τὸν θεόν
  choice: kalian yang takut akan Allah
  alternative: orang-orang yang takut akan Allah di antara kalian
  rationale: Terjemahan deskriptif mempertahankan kemungkinan bahwa frasa itu menggambarkan para penyembah non-Yahudi yang terkait dengan sinagoge tanpa menjadikannya label teknis secara pasti.
- issue: Cakupan ἡμῖν
  choice: kepada kitalah
  alternative: kepada kami
  rationale: Dalam konteks pidato, Paulus menyapa kedua kelompok lalu mengatakan bahwa berita itu dikirim 'kepada kita'; bentuk inklusif paling wajar. Namun, bahasa Yunani tidak membedakan 'kami' dan 'kita', sehingga alternatifnya perlu dicatat.
- issue: Bahasa kekerabatan dalam sapaan
  choice: Saudara-saudara
  alternative: Saudara-saudara laki-laki
  rationale: Bentuk Yunani bersifat maskulin, tetapi 'Saudara-saudara' merupakan sapaan Indonesia yang alami dan tidak menentukan sendiri apakah seluruh hadirin hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato yang khidmat. 'Saudara-saudara' dan 'kalian' menjaga sapaan langsung tanpa kekakuan; susunan 'kepada kitalah' mempertahankan penekanan pada penerima berita.
