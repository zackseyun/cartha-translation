base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: id
  text: Setibanya di Salamis[a], mereka memberitakan firman Allah di sinagoge-sinagoge Yahudi, dan mereka juga mempunyai Yohanes sebagai pembantu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah mereka sampai di Salamis.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “penolong,” “pendamping,” atau “pelayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Setibanya di Salamis
  rationale: Dalam konstruksi dengan keterangan tempat, partisip aoris γενόμενοι secara idiomatis menyatakan bahwa mereka telah sampai di Salamis. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktu dengan tindakan utama.
- source_word: κατήγγελλον
  choice: memberitakan
  rationale: Kata ini menunjuk pada penyampaian atau pengumuman secara terbuka. Bentuk 'memberitakan' mempertahankan makna itu tanpa membatasinya hanya pada khotbah formal; konteks juga memungkinkan nuansa tindakan yang berlangsung atau berulang.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan baku dan transparan yang mempertahankan konstruksi sumber serta dapat mencakup pesan atau penyataan yang berasal dari Allah.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: di sinagoge-sinagoge orang Yahudi
  rationale: Bentuk jamak συναγωγαῖς dipertahankan, dan dalam konteks ini Ἰουδαίων menunjuk pada komunitas Yahudi secara etnis-keagamaan, bukan khusus penduduk Yudea.
- source_word: εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην
  choice: Yohanes juga menyertai mereka sebagai pembantu
  rationale: Susunan ini mengungkapkan secara alami bahwa Yohanes berada bersama mereka dalam peran pendukung. 'Pembantu' mencerminkan ὑπηρέτης sebagai orang yang membantu atau melayani tanpa memasukkan nuansa perbudakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sinagoge' dipakai sebagai istilah khusus yang jelas bagi tempat pertemuan orang Yahudi. Struktur kalimat kedua dibuat alami dalam bahasa Indonesia sambil mempertahankan fungsi Yohanes sebagai ὑπηρέτης.
