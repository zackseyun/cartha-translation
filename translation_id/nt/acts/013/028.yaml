id: ACT.13.28
reference: Acts 13:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: id
  text: Dan meskipun mereka tidak menemukan dasar untuk hukuman mati terhadapnya[a], mereka meminta Pilatus agar ia dieksekusi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dakwaan yang patut dihukum mati” atau “dasar hukum untuk hukuman mati terhadapnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “agar ia dibunuh” atau “agar ia dihukum mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Meskipun
  rationale: καί meneruskan alur kalimat, sedangkan hubungan konsesif yang tersirat dalam klausa partisipial dinyatakan secara alami dalam bahasa Indonesia melalui pembukaan “Meskipun”; tidak perlu ditambah “Dan” karena akan terasa berat.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: tidak menemukan dasar apa pun untuk menjatuhkan hukuman mati kepadanya
  rationale: Dalam konteks pengadilan, αἰτία berarti alasan, dakwaan, atau dasar hukum, dan θανάτου menunjuk pada hukuman mati. Ungkapan ini menyampaikan bahwa tidak ada dasar yang membenarkan vonis mati tanpa mempersempit arti αἰτία hanya menjadi suatu dakwaan formal.
- source_word: εὑρόντες
  choice: mereka ... menemukan
  rationale: 'Partisip aoris ini secara keadaan mendahului tindakan meminta dan, dalam konteks, mengandung pertentangan: walaupun tidak menemukan dasar, mereka tetap meminta eksekusi. Bentuk klausa finit lebih alami dalam bahasa Indonesia.'
- source_word: ᾐτήσαντο
  choice: mereka meminta
  rationale: Kata αἰτέω berarti meminta atau memohon. “Meminta” alami dalam narasi modern dan konstruksi dengan Pilatus serta klausa “agar” tetap menunjukkan permintaan resmi.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: agar dia dihukum mati
  rationale: Dalam konteks hukum ini, ἀναιρέω berarti menyingkirkan dengan membunuh atau mengeksekusi. Bentuk pasif “dihukum mati” mempertahankan bentuk pasif Yunani serta nuansa eksekusi resmi, sementara “agar” menyatakan isi permintaan kepada Pilatus.
theological_decisions:
- issue: Apakah hubungan partisipial perlu dinyatakan sebagai konsesif
  choice: Meskipun mereka tidak menemukan ... mereka meminta ...
  alternative: Setelah tidak menemukan ... mereka meminta ...
  rationale: Secara bentuk, εὑρόντες adalah partisip keadaan yang dapat dibaca temporal, tetapi konteks menonjolkan ketegangan bahwa permintaan hukuman mati diajukan tanpa dasar yang ditemukan. “Meskipun” menyatakan hubungan kontekstual itu tanpa menambahkan penilaian teologis baru.
- issue: Kapitalisasi kata ganti yang merujuk kepada Yesus
  choice: kepadanya; dia
  alternative: kepada-Nya; Dia
  rationale: Teks sumber tidak menandai kata ganti dengan kapitalisasi penghormatan. Huruf kecil mengikuti ejaan prosa modern dan tidak memasukkan konvensi devosional tertentu; identitas rujukannya tetap jelas dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-hukum. Susunan kalimat dibuat lugas bagi pembaca umum, dengan ketegangan antara tidak adanya dasar hukuman mati dan permintaan eksekusi tetap dipertahankan.
