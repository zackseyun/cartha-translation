  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: id
  text: Setelah bertolak[a] dari Pafos, orang-orang yang bersama Paulus[b] tiba di Perga, di Pamfilia. Namun, Yohanes meninggalkan mereka dan kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini dalam konteks perjalanan laut berarti “bertolak ke laut” atau “mulai berlayar.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang di sekitar Paulus”; dapat juga diterjemahkan “Paulus dan rekan-rekannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Setelah bertolak
  rationale: Dalam konteks perjalanan laut, ἀνάγω berarti bertolak atau berlayar. “Bertolak” alami dalam bahasa Indonesia dan tetap menyampaikan bahwa mereka berangkat melalui laut.
- source_word: οἱ περὶ Παῦλον
  choice: orang-orang yang bersama Paulus
  rationale: Ungkapan οἱ περὶ dengan akusatif menunjuk kepada kelompok yang menyertai atau berkaitan dengan seseorang. Terjemahan ini mempertahankan bentuk ungkapan Yunani tanpa menambahkan susunan kelompok yang tidak dinyatakan.
- source_word: ἦλθον
  choice: tiba
  rationale: Dalam narasi perjalanan, “tiba” menyampaikan hasil gerak menuju Perga secara alami dalam bahasa Indonesia.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Perga, di Pamfilia
  rationale: Genitif tersebut menunjukkan bahwa Perga terletak di wilayah Pamfilia.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: berpisah dari mereka
  rationale: ἀποχωρέω berarti pergi, beranjak, atau memisahkan diri. “Berpisah dari mereka” melaporkan tindakan Yohanes secara netral tanpa menetapkan motif atau penilaian moral.
- source_word: ὑπέστρεψεν
  choice: kembali
  rationale: ὑποστρέφω lazim berarti kembali atau pulang ke tempat sebelumnya.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk nama kota yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Kemungkinan penilaian negatif terhadap kepergian Yohanes
  choice: Tindakannya diterjemahkan secara netral sebagai “berpisah dari mereka.”
  alternative: meninggalkan mereka; mengundurkan diri dari mereka
  rationale: Ayat ini hanya menyatakan bahwa Yohanes berpisah dari rombongan dan kembali ke Yerusalem. Motif serta penilaian moral atas tindakannya tidak disebutkan di sini, sehingga terjemahan tidak mendahului konteks selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Bertolak” mempertahankan konteks pelayaran; “orang-orang yang bersama Paulus” menjaga bentuk ungkapan sumber; dan “berpisah” menghindari penilaian yang tidak dinyatakan dalam ayat.
