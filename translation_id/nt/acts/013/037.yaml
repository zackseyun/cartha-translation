id: ACT.13.37
reference: Acts 13:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: id
  text: Namun, Dia yang Allah bangkitkan tidak mengalami pembusukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak melihat pembusukan.” Dapat juga diterjemahkan “tidak mengalami kerusakan.” Ungkapan ini menggemakan Mazmur 16:10 dalam Septuaginta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Dia yang
  rationale: Pronomina relatif ini merujuk kepada Yesus sebagai orang yang dibangkitkan Allah. Bentuk “Dia yang” alami dalam bahasa Indonesia dan menjaga rujukannya tanpa menyebut nama yang tidak ada dalam ayat.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menyatakan kontras dengan Daud pada ayat sebelumnya; “Namun” menyampaikan pertentangan itu secara jelas dan bermartabat.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: “Allah” adalah padanan baku θεός dalam bahasa Indonesia dan di sini berfungsi sebagai subjek dari tindakan membangkitkan.
- source_word: ἤγειρεν
  choice: dibangkitkan
  rationale: Dalam konteks ini ἐγείρω mengacu pada tindakan Allah membangkitkan Yesus dari kematian. Bentuk pasif relatif “yang dibangkitkan Allah” mengikuti susunan dan fokus teks Yunani dengan alami.
- source_word: οὐκ εἶδεν
  choice: tidak mengalami
  rationale: Secara harfiah berarti “tidak melihat”, tetapi ungkapan tersebut idiomatis dengan objek διαφθοράν. “Tidak mengalami” menyampaikan maknanya secara alami; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: διαφθοράν
  choice: kebinasaan tubuh
  rationale: Dalam perbandingan dengan kematian dan penguburan Daud, istilah ini menunjuk pada kerusakan atau pembusukan jasmani. “Kebinasaan tubuh” cukup jelas bagi pembaca modern sekaligus mempertahankan cakupan istilah yang lebih luas daripada sekadar proses pembusukan.
theological_decisions:
- issue: Makna kebangkitan dalam ἤγειρεν
  choice: Allah membangkitkan Yesus dari antara orang mati
  alternative: Allah mengangkat atau menghadirkan-Nya
  rationale: Konteks langsung membandingkan Daud, yang meninggal dan mengalami kebinasaan tubuh, dengan Dia yang dibangkitkan Allah dan tidak mengalaminya. Karena itu, makna kebangkitan dari kematian dituntut oleh konteks.
- issue: Cakupan διαφθοράν
  choice: kebinasaan tubuh
  alternative: pembusukan; kerusakan
  rationale: Konteks Mazmur 16 dan kontras dengan Daud yang dikuburkan menunjukkan aspek jasmani, tetapi kata Yunani tetap dapat diterjemahkan lebih umum sebagai “kerusakan” atau “kebinasaan”. Catatan kaki mempertahankan bentuk alternatif dan gema antarteks tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kontras dengan ayat sebelumnya dipertahankan melalui “Namun”. Ungkapan idiomatis diterjemahkan secara alami dalam teks utama, sedangkan bentuk harfiah dan gema Mazmur dipertahankan dalam catatan kaki.
