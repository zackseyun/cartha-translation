id: ACT.13.50
reference: Acts 13:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: id
  text: Namun, orang-orang Yahudi menghasut perempuan-perempuan saleh yang terpandang[a] dan para pria terkemuka di kota itu. Mereka menimbulkan penganiayaan terhadap Paulus dan Barnabas, lalu mengusir keduanya dari wilayah mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan-perempuan yang takut akan Allah dan terpandang.” Ungkapan Yunaninya dapat menunjuk kepada perempuan yang beribadah kepada Allah Israel, mungkin orang bukan Yahudi yang berhubungan dengan sinagoge.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari daerah mereka” atau “dari batas-batas wilayah mereka.” Kata Yunaninya dapat berarti batas teritorial maupun daerah yang dibatasi olehnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Namun, orang-orang Yahudi
  rationale: δέ menandai kontras dengan sambutan positif pada ayat sebelumnya; “Namun” menyampaikan peralihan naratif itu secara alami.
- source_word: παρώτρυναν
  choice: menghasut
  rationale: Kata ini menunjukkan tindakan aktif menggerakkan orang lain ke arah permusuhan; “menghasut” mempertahankan daya kausatif dan nuansa negatifnya.
- source_word: τὰς σεβομένας γυναῖκας τὰς εὐσχήμονας
  choice: perempuan-perempuan saleh yang terpandang
  rationale: “Saleh” menyampaikan kesungguhan religius tanpa memastikan status teknis mereka, sedangkan “terpandang” mencakup kehormatan serta kedudukan sosial.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: para tokoh pria di kota itu
  rationale: Ungkapan Yunani menunjuk kepada kaum pria yang terkemuka dalam kehidupan kota; terjemahan ini mempertahankan rujukan maskulin sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἐπήγειραν διωγμὸν
  choice: membangkitkan penganiayaan
  rationale: Gabungan verba dan nomina ini berarti menyebabkan timbulnya penganiayaan; pilihan ini mempertahankan bentuk kausatif dan berbeda secara alami dari “menghasut” sebelumnya.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: terhadap Paulus dan Barnabas
  rationale: Dengan διωγμός, frasa ini menunjukkan sasaran permusuhan; “terhadap” merupakan padanan Indonesia yang alami.
- source_word: ἐξέβαλον αὐτοὺς
  choice: mengusir keduanya
  rationale: ἐκβάλλω menyatakan pengeluaran secara paksa. “Mengusir” ringkas, kuat, dan sesuai dengan konteks sosial-politik.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: dari wilayah mereka
  rationale: ὅρια dapat menunjuk batas-batas atau daerah yang tercakup di dalamnya. “Wilayah” sesuai dengan konteks yurisdiksi kota sambil mempertahankan keluasan makna.
theological_decisions:
- issue: Status religius perempuan yang disebut σεβόμεναι
  choice: perempuan-perempuan saleh
  alternative: perempuan-perempuan yang takut akan Allah
  rationale: Dalam Kisah Para Rasul, partisip ini kerap merujuk kepada orang bukan Yahudi yang beribadah kepada Allah Israel dan terkait dengan sinagoge, tetapi teks ini tidak secara eksplisit menetapkan status teknis mereka. Teks utama mempertahankan ketidakpastian itu, sedangkan alternatif dicatat.
- issue: Rujukan maskulin dalam τοὺς πρώτους τῆς πόλεως
  choice: para tokoh pria di kota itu
  alternative: para pemimpin kota itu
  rationale: Bentuk Yunani secara eksplisit maskulin. Terjemahan utama mempertahankan ciri tersebut tanpa menyimpulkan jabatan resmi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dibagi menjadi dua agar rangkaian tindakan mudah dipahami. “Saleh” tidak dipakai sebagai label denominasi, dan “para tokoh pria” mempertahankan rujukan maskulin sumber tanpa mengandaikan jabatan resmi.
