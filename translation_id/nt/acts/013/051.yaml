  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: id
  text: Namun, mereka mengebaskan debu dari kaki mereka terhadap mereka, lalu pergi ke Ikonium.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mengebaskan debu dari kaki merupakan tindakan simbolis untuk menyatakan pemisahan diri dan menjadi kesaksian terhadap orang-orang yang menolak berita itu.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: δέ menandai peralihan dengan nuansa kontras ringan, sedangkan artikel dan partisip merujuk kembali kepada Paulus dan Barnabas. 'Namun, mereka' alami dalam bahasa Indonesia.
- source_word: ἐκτιναξάμενοι
  choice: mengebaskan
  rationale: Partisip aoris medium ἐκτινάσσω menggambarkan tindakan mengibaskan atau mengguncangkan sesuatu hingga terlepas. 'Mengebaskan' tepat untuk debu pada kaki dan menjaga daya simbolis tindakan itu.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: debu dari kaki mereka
  rationale: κονιορτός berarti debu, dan konstruksi genitifnya secara alami menyatakan debu yang melekat pada kaki. Bahasa Indonesia memerlukan 'dari kaki mereka' agar hubungan sumbernya jelas.
- source_word: ἐπ’ αὐτοὺς
  choice: sebagai tanda menentang orang-orang itu
  rationale: ἐπί dengan akusatif di sini menyatakan arah tindakan yang bersifat bermusuhan atau memberi kesaksian. Ungkapan ini mempertahankan arti 'terhadap/melawan mereka' sambil membuat fungsi simbolisnya dapat dipahami tanpa menentukan bahwa tindakan itu sendiri adalah vonis akhir.
- source_word: ἦλθον
  choice: pergi
  rationale: Dalam gerak naratif menuju tempat yang disebutkan, ἔρχομαι wajar diterjemahkan 'pergi' dari sudut pandang pencerita.
- source_word: εἰς Ἰκόνιον
  choice: ke Ikonium
  rationale: εἰς menunjukkan gerak menuju atau masuk ke kota; 'ke Ikonium' adalah bentuk Indonesia yang alami dan tepat.
theological_decisions:
- issue: Makna simbolis mengebaskan debu dari kaki
  choice: Teks utama menyatakan tindakan itu sebagai tanda menentang pihak yang menolak, tanpa menyebutnya secara eksplisit sebagai penghukuman.
  alternative: sebagai kesaksian terhadap mereka; sebagai tanda penghukuman atas mereka
  rationale: Konteks Alkitab memberi tindakan ini daya kesaksian dan pemisahan diri, tetapi teks Yunani hanya menyatakan tindakan serta arahnya. Terjemahan menghindari penetapan makna teologis yang lebih sempit, sedangkan catatan kaki menjelaskan latar budayanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Nama tempat memakai bentuk lazim Indonesia, 'Ikonium'. Penanda catatan kaki ditempatkan sesudah tanda titik.
