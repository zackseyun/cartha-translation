source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: id
  text: Ketika bangsa-bangsa lain mendengar hal itu, mereka bersukacita dan memuliakan firman Tuhan. Semua orang yang telah ditetapkan[a] untuk hidup kekal menjadi percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah cenderung kepada hidup kekal.” Partisipel Yunani ini dipahami secara berbeda oleh para penafsir, tetapi makna pasif “telah ditetapkan” merupakan terjemahan yang paling langsung di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: ketika ... mendengar hal itu
  rationale: Partisipel kini berfungsi adverbial dan menyatakan keadaan yang menyertai verba utama. 'Hal itu' ditambahkan secara wajar dari konteks sebagai objek yang tersirat.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada orang-orang non-Yahudi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kolektif bentuk Yunaninya.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: bersukacita dan memuliakan
  rationale: Kedua bentuk imperfek menggambarkan tanggapan yang sedang berlangsung. Bahasa Indonesia tidak perlu menambahkan 'mulai', yang dapat mempersempit aspek menjadi inkoatif.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: firman Tuhan
  rationale: '''Firman Tuhan'' adalah ungkapan Indonesia yang mapan dan tetap menyampaikan pesan yang diberitakan tanpa menghilangkan resonansi alkitabiah λόγος.'
- source_word: ἐπίστευσαν
  choice: menjadi percaya
  rationale: Aoris menunjukkan peristiwa percaya dalam alur narasi. 'Menjadi percaya' merupakan padanan Indonesia yang alami tanpa memperluasnya menjadi rumusan doktrinal.
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Mengungkapkan daya kuantitatif ὅσοι secara idiomatis dan jelas dalam bahasa Indonesia.
- source_word: τεταγμένοι
  choice: telah ditetapkan
  rationale: Partisipel perfek pasif dari τάσσω paling langsung menunjukkan keadaan sebagai hasil penetapan atau penunjukan. Bentuk pasif dipertahankan tanpa menyebut pelaku yang tidak dinyatakan dalam ayat.
- source_word: εἰς ζωὴν αἰώνιον
  choice: untuk memperoleh hidup kekal
  rationale: Mengungkapkan arah atau tujuan εἰς secara alami dalam bahasa Indonesia. 'Memperoleh' membuat hubungan frasa dengan 'ditetapkan' jelas tanpa menentukan lebih jauh mekanisme teologisnya.
theological_decisions:
- issue: Makna τεταγμένοι dalam kaitannya dengan penetapan dan tanggapan manusia
  choice: telah ditetapkan untuk memperoleh hidup kekal
  alternative: telah mengarahkan diri kepada hidup kekal
  rationale: Bentuk morfologisnya adalah partisipel perfek pasif, sehingga arti penetapan paling langsung dipertahankan dalam teks utama. Pelaku dan cakupan doktrin penetapan tidak dijelaskan melampaui perkataan ayat. Karena sebagian penafsir memahami istilah ini sebagai kecenderungan atau pengarahan diri, alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern, bermartabat, dan mudah dipahami. 'Bangsa-bangsa lain' dipakai untuk non-Yahudi, sedangkan 'firman Tuhan' mempertahankan ungkapan alkitabiah yang lazim. Kalimat dibagi dua agar alur sebab dan tanggapan jelas.
