- from: Kemudian, ketika gubernur itu melihat apa yang telah terjadi, ia percaya dan takjub akan ajaran Tuhan.[a]
  to: Kemudian, ketika prokonsul itu melihat apa yang telah terjadi, ia percaya dan takjub terhadap ajaran Tuhan.[a]
  rationale: Revisi mengganti “gubernur” dengan “prokonsul” untuk mencerminkan ἀνθύπατος secara tepat. Frasa respons juga dirapikan menjadi “takjub terhadap” agar lebih alami dalam bahasa Indonesia modern, tanpa mengubah hubungan antara iman prokonsul dan ketakjubannya terhadap ajaran Tuhan. Catatan kaki tetap diperlukan untuk menjaga ambiguitas genitif τοῦ κυρίου.
