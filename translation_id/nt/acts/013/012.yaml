  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: id
  text: Kemudian, ketika prokonsul itu melihat apa yang telah terjadi, ia percaya dan takjub terhadap ajaran Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “ajaran dari Tuhan” atau “ajaran tentang Tuhan.” Bentuk genitif Yunani dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan peristiwa berikutnya secara ringkas dan alami dalam narasi.
- source_word: ἰδὼν
  choice: ketika ... melihat
  rationale: Partisip aoris ini diungkapkan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia, tanpa meniadakan kaitan keadaan atau sebab yang tersirat.
- source_word: ὁ ἀνθύπατος
  choice: gubernur itu
  rationale: ἀνθύπατος adalah gelar pejabat Romawi (prokonsul). Dalam bahasa Indonesia umum, 'gubernur' lebih mudah dipahami; identitas tokohnya sudah diperkenalkan dalam konteks sebelumnya.
- source_word: τὸ γεγονός
  choice: apa yang telah terjadi
  rationale: Partisip perfek yang dipakai secara substantival menunjuk pada kejadian yang sudah berlangsung dan hasilnya disaksikan.
- source_word: ἐπίστευσεν
  choice: ia percaya
  rationale: Objek πιστεύω tidak dinyatakan dalam bahasa Yunani, sehingga tidak ditambahkan 'kepada Tuhan' atau 'kepada Injil'.
- source_word: ἐκπλησσόμενος
  choice: dan takjub
  rationale: Partisip kini menyatakan keadaan yang menyertai tindakan utama; koordinasi dengan 'dan' menghasilkan bahasa Indonesia yang alami sambil mempertahankan hubungan tersebut.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: akan ajaran
  rationale: ἐπί dengan datif menunjukkan dasar atau hal yang menimbulkan ketakjuban; 'takjub akan' merupakan ungkapan Indonesia yang wajar.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Genitif Yunani dapat menunjuk pada ajaran yang berasal dari, menjadi milik, atau membahas Tuhan. Bentuk 'ajaran Tuhan' tetap cukup terbuka dalam bahasa Indonesia.
theological_decisions:
- issue: Makna πιστεύω tanpa objek tersurat
  choice: ia percaya
  alternative: ia percaya kepada Tuhan; ia percaya kepada berita itu
  rationale: Konteks mengarahkan pembaca kepada iman Kristen, tetapi teks Yunani tidak menyebutkan objeknya. Terjemahan tidak menambahkan rincian teologis yang tidak tersurat.
- issue: Nuansa genitif dalam τῇ διδαχῇ τοῦ κυρίου
  choice: ajaran Tuhan
  alternative: ajaran dari Tuhan; ajaran tentang Tuhan
  rationale: Genitif dapat dipahami sebagai sumber/kepunyaan atau sebagai pokok ajaran. Teks utama mempertahankan keluasan makna itu, dan catatan kaki menyatakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat dibuat lancar untuk pembacaan umum. Istilah 'gubernur' dipilih demi keterpahaman, sedangkan ambiguitas teologis pada 'percaya' dan 'ajaran Tuhan' dipertahankan.
