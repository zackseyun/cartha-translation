    issue: Gelar ἀνθύπατος diterjemahkan “gubernur itu.”
    rationale: ἀνθύπατος secara khusus berarti “prokonsul,” sebuah gelar Romawi. “Gubernur” menghilangkan ketepatan gelar yang ada dalam teks sumber, padahal “prokonsul” juga merupakan istilah Indonesia yang mapan.
  - severity: low
    issue: Ungkapan “takjub akan” kurang alami untuk register modern.
    rationale: Ungkapan tersebut dapat dipahami, tetapi “takjub terhadap” lebih idiomatis dalam bahasa Indonesia baku modern dan menyampaikan fungsi ἐπὶ τῇ διδαχῇ dengan baik.
  revised_text: Kemudian, ketika prokonsul itu melihat apa yang telah terjadi, ia percaya dan takjub terhadap ajaran Tuhan.[a]
