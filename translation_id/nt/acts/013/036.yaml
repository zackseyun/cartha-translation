  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: id
  text: Sebab Daud, setelah melayani maksud Allah pada zamannya sendiri, meninggal[a], lalu bergabung dengan nenek moyangnya[b], dan mengalami pembusukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tertidur”, sebuah ungkapan halus Alkitabiah untuk meninggal.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “ditambahkan kepada nenek moyangnya”, ungkapan bercorak Ibrani yang berarti bergabung dengan para leluhur dalam kematian.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, jasad Daud mengalami pembusukan; bandingkan kontras dalam ayat berikutnya. Secara harfiah, “melihat kerusakan/pembusukan”.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: pada zamannya sendiri
  rationale: Frasa datif ini paling alami dipahami sebagai lingkup waktu pelayanan Daud. Pilihan ini mempertahankan makna temporal tanpa menjadikannya penerima manfaat ('bagi angkatannya').
- source_word: ὑπηρετήσας
  choice: setelah melayani
  rationale: Partisip aoris mendahului verba utama. 'Setelah melayani' menyatakan urutan dengan jelas dan tidak memberi nuansa jabatan gerejawi.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: maksud Allah
  rationale: βουλή dapat berarti maksud, rencana, atau keputusan. 'Maksud Allah' alami dalam bahasa Indonesia dan mempertahankan unsur kehendak ilahi tanpa mempersempitnya menjadi suatu sistem teologis.
- source_word: ἐκοιμήθη
  choice: meninggal
  rationale: Secara harfiah verba ini berarti 'tertidur', tetapi dalam konteks merupakan eufemisme lazim untuk kematian. 'Meninggal' menyampaikan maksudnya secara jelas; metafora sumber dicatat dalam catatan kaki.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: dikumpulkan bersama nenek moyangnya
  rationale: Ungkapan bercorak Semitis ini berarti bergabung dengan para leluhur dalam kematian. 'Dikumpulkan bersama nenek moyangnya' mempertahankan citra idiom sekaligus jelas bagi pembaca modern.
- source_word: εἶδεν διαφθοράν
  choice: mengalami kebinasaan tubuh
  rationale: Secara harfiah 'melihat kebinasaan/kerusakan'; dalam konteks menunjuk pada pembusukan jasad. 'Mengalami kebinasaan tubuh' mempertahankan bobot διαφθορά tanpa ungkapan Indonesia yang janggal dan memperjelas rujukan jasmaninya.
theological_decisions:
- issue: Eufemisme kematian dalam ἐκοιμήθη
  choice: meninggal, dengan metafora harfiah dalam catatan kaki
  alternative: tertidur
  rationale: Ini mengomunikasikan arti kontekstual secara alami tanpa menarik kesimpulan antropologis tertentu dari metafora tidur, sambil tetap menjaga citra naskah sumber melalui catatan.
- issue: Hubungan sintaksis ἰδίᾳ γενεᾷ dan τῇ τοῦ θεοῦ βουλῇ
  choice: melayani maksud Allah pada zamannya sendiri
  alternative: melayani angkatannya sendiri sesuai dengan maksud Allah
  rationale: Susunan Yunani memungkinkan perdebatan mengenai datif mana yang terkait langsung dengan ὑπηρετήσας. Bacaan utama mengikuti hubungan 'melayani maksud Allah' dan memahami 'pada zamannya sendiri' secara temporal; alternatif penting dicatat agar ambiguitas asli tidak disembunyikan.
- issue: Makna βουλή mengenai kehendak ilahi
  choice: maksud Allah
  alternative: rencana Allah; keputusan Allah
  rationale: '''Maksud'' cukup luas untuk mencakup tujuan atau rancangan ilahi tanpa memasukkan rumusan denominasi tertentu.'
- issue: Makna διαφθορά dalam kontras dengan ayat berikutnya
  choice: kebinasaan tubuh
  alternative: pembusukan; kerusakan
  rationale: Konteks membandingkan Daud, yang jasadnya mengalami kerusakan, dengan Dia yang tidak mengalaminya. Pilihan ini mempertahankan kontras jasmani tanpa menambahkan klaim di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah 'nenek moyang' dipilih daripada 'bapa-bapa' agar idiom kematian jelas. Penanda catatan [d] ditempatkan pada frasa sintaksis yang ambigu.
