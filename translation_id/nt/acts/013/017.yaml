  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: id
  text: Allah umat Israel ini memilih leluhur kita[a]. Ia menjadikan umat itu besar[b] ketika mereka tinggal sebagai pendatang di negeri Mesir, lalu dengan lengan yang terangkat[c] Ia membawa mereka keluar dari sana[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapak kita”; dapat juga diterjemahkan “nenek moyang kita.”
    reason: lexical_alternative
  - marker: b
    text: “Menjadikan umat itu besar” dapat juga diterjemahkan “meninggikan umat itu” atau “membuat umat itu bertambah banyak.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan lengan yang tinggi”; ungkapan dari kisah Keluaran ini menggambarkan kuasa Allah dalam membebaskan umat-Nya.
    reason: cultural_note
  - marker: d
    text: Dapat juga diterjemahkan “menuntun mereka keluar dari sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Allah umat ini, yaitu Israel
  rationale: Mempertahankan hubungan posesif dan aposisi dalam bahasa Yunani, sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: ἐξελέξατο
  choice: memilih
  rationale: Menyampaikan tindakan lampau secara lugas; nuansa bentuk medial tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia.
- source_word: τοὺς πατέρας ἡμῶν
  choice: leluhur kita
  rationale: Dalam konteks sejarah umat, ungkapan ini secara alami menunjuk kepada para pendahulu Israel; catatan kaki mempertahankan bentuk harfiah 'bapak-bapak kita'.
- source_word: ὕψωσεν
  choice: membesarkan
  rationale: Kata ini dapat mencakup gagasan membuat umat itu bertambah besar maupun meninggikan kedudukannya, sehingga tidak membatasi makna hanya pada pertambahan jumlah atau status.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: selama mereka tinggal sebagai pendatang di negeri Mesir
  rationale: Mengungkapkan keadaan menetap sebagai orang asing dan tetap menerjemahkan γῇ secara eksplisit sebagai 'negeri'.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: dengan lengan yang terangkat
  rationale: Mempertahankan metafora Keluaran secara cukup harfiah, sementara catatan menjelaskan makna idiomatisnya.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: Ia membawa mereka keluar dari sana
  rationale: Mengungkapkan gerak keluar dari Mesir secara alami dalam bahasa Indonesia tanpa mengaburkan rujukan kata gantinya.
theological_decisions:
- issue: Sebutan bagi generasi pendahulu Israel
  choice: leluhur kita
  alternative: bapak-bapak kita
  rationale: Bahasa Yunani memakai πατέρες, tetapi dalam konteks silsilah dan sejarah umat, 'leluhur' merupakan padanan Indonesia yang alami tanpa mengubah rujukannya.
- issue: Makna ὕψωσεν ketika Israel berada di Mesir
  choice: membesarkan umat itu
  alternative: meninggikan umat itu; membuat umat itu bertambah banyak
  rationale: Kata Yunani dapat menunjuk pada peninggian atau pertumbuhan. 'Membesarkan' mempertahankan keluasan makna itu dan tidak menetapkan hanya satu segi.
- issue: Gambaran lengan yang terangkat
  choice: mempertahankan metafora sebagai 'lengan yang terangkat'
  alternative: dengan kuasa-Nya yang besar
  rationale: Metafora tersebut merupakan gema tradisi Keluaran dan sebaiknya dipertahankan; makna kuasa penyelamatan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, sementara metafora Keluaran dan ambiguitas ὕψωσεν dipertahankan. Kata ganti ilahi “Ia” dikapitalisasi sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
