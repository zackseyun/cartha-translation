  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: id
  text: Sebelum kedatangan-Nya[a], Yohanes telah memberitakan kepada seluruh umat Israel baptisan pertobatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebelum Ia tiba.” Secara harfiah, bahasa Yunani berbunyi “sebelum wajah masuknya”; ini adalah ungkapan idiomatis yang berarti mendahului kedatangan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “baptisan untuk pertobatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: telah memberitakan
  rationale: Partisip aoris ini menyatakan tindakan Yohanes yang lebih dahulu dan bersifat pemberitaan umum. Bentuk 'telah memberitakan' alami dalam bahasa Indonesia; urutan waktunya sudah dinyatakan oleh frasa 'sebelum kedatangan-Nya'.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: sebelum kedatangan-Nya
  rationale: Ungkapan Yunani yang secara harfiah berbunyi 'di hadapan wajah masuknya' merupakan idiom yang berarti mendahului kedatangan seseorang. 'Sebelum kedatangan-Nya' jelas, alami, dan tetap mempertahankan pronomina sumber.
- source_word: εἰσόδου
  choice: kedatangan
  rationale: Dalam konteks ini kata tersebut menunjuk pada masuk atau tibanya tokoh yang dibicarakan. 'Kedatangan' lebih wajar daripada 'jalan masuk' atau 'masuknya'.
- source_word: βάπτισμα μετανοίας
  choice: baptisan pertobatan
  rationale: Susunan ini mempertahankan hubungan genitif Yunani secara ringkas tanpa menentukan secara berlebihan apakah pertobatan dipandang sebagai isi, ciri, atau tujuan baptisan.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: kepada seluruh umat Israel
  rationale: '''Seluruh'' mewakili παντί, sedangkan ''umat Israel'' secara alami menyampaikan λαῷ Ἰσραήλ sebagai satu umat.'
- source_word: Ἰωάννου
  choice: Yohanes
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Rujukan pronomina αὐτοῦ dalam frasa tentang kedatangan
  choice: Dipertahankan sebagai '-Nya', dengan huruf kapital sesuai kebiasaan bahasa Indonesia karena konteks Kisah Para Rasul 13:23–25 menunjuk kepada Yesus.
  alternative: Menyebut 'kedatangan Yesus' secara eksplisit atau memakai 'kedatangannya' tanpa kapital.
  rationale: Teks Yunani memakai pronomina, bukan nama Yesus. Terjemahan mempertahankan bentuk pronominal dan tidak menambahkan nama, sementara konteks cukup mengidentifikasi rujukannya.
- issue: Hubungan makna dalam βάπτισμα μετανοίας
  choice: baptisan pertobatan
  alternative: baptisan untuk pertobatan
  rationale: Genitif Yunani dapat dipahami dalam lebih dari satu hubungan. Bentuk nominal 'baptisan pertobatan' mempertahankan ketegangan itu, sedangkan 'untuk pertobatan' lebih tegas menafsirkannya sebagai tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Umat Israel' dipilih sebagai ungkapan yang alami bagi pembaca umum, dan susunan kalimat mengikuti fokus temporal teks Yunani tanpa terasa kaku.
