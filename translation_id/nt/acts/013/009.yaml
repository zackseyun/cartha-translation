  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: id
  text: Namun Saulus, yang juga bernama Paulus, dipenuhi Roh Kudus, menatapnya dengan saksama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa pertentangan ringan dari tindakan Elimas kepada tanggapan Saulus.
- source_word: ὁ καὶ Παῦλος
  choice: yang juga bernama Paulus
  rationale: Menunjukkan bahwa Saulus juga memiliki nama Paulus tanpa menyiratkan bahwa namanya baru diganti pada saat ini.
- source_word: πλησθεὶς πνεύματος ἁγίου
  choice: dipenuhi Roh Kudus
  rationale: Mempertahankan makna pasif partisipel dan mengungkapkan konstruksi Yunani secara wajar dalam bahasa Indonesia.
- source_word: ἀτενίσας εἰς αὐτὸν
  choice: menatap dia dengan tajam
  rationale: Menyampaikan pandangan yang terarah, tetap, dan sungguh-sungguh kepada Elimas dalam ungkapan Indonesia yang alami.
theological_decisions:
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: suatu roh kudus
  rationale: Dalam konteks pemberdayaan di Kisah Para Rasul, frasa ini merujuk kepada Roh Kudus ilahi, bukan kepada roh yang hanya bersifat kudus.
- issue: Hubungan nama Saulus dan Paulus
  choice: yang juga bernama Paulus
  alternative: yang juga disebut Paulus
  rationale: Teks memperkenalkan nama tambahan yang telah dimiliki Saulus; terjemahan ini tidak mengesankan pergantian nama secara resmi.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan partisipel Yunani dipadatkan secara alami tanpa menghilangkan urutan gagasan: dipenuhi Roh Kudus lalu mengarahkan tatapan kepada Elimas.'
