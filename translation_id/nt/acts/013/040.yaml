  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: id
  text: 'Karena itu, waspadalah, jangan sampai apa yang telah dikatakan dalam kitab-kitab para nabi[a] menimpa kalian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “oleh para nabi.” Secara harfiah, bahasa Yunani berbunyi “dalam para nabi,” yang kemungkinan menunjuk pada kitab-kitab kenabian tempat peringatan ini tertulis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: waspadalah
  rationale: Imperatif kini orang kedua jamak ini menyampaikan peringatan yang mendesak. “Waspadalah” alami, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari pemberitaan dan peringatan sebelumnya.
- source_word: μὴ ἐπέλθῃ
  choice: supaya ... jangan sampai menimpa kalian
  rationale: μή dengan subjungtif aoris sesudah imperatif menyatakan peringatan atau tujuan negatif. Susunan ini alami dalam bahasa Indonesia dan mempertahankan ancaman akan sesuatu yang datang menimpa para pendengar.
- source_word: τὸ εἰρημένον
  choice: apa yang telah difirmankan
  rationale: Partisipel perfek pasif substantival menunjuk pada sesuatu yang telah diucapkan dan tetap berlaku. “Difirmankan” sesuai dengan konteks perkataan Kitab Suci tanpa menentukan pelaku secara eksplisit.
- source_word: ἐν τοῖς προφήταις
  choice: dalam kitab para nabi
  rationale: ἐν dipertahankan dengan gagasan lokasi dalam kumpulan tulisan kenabian. Penambahan “kitab” membuat idiom ini wajar dalam bahasa Indonesia dan sesuai dengan konteks kutipan Habakuk.
theological_decisions:
- issue: Acuan frasa “para nabi”
  choice: kumpulan tulisan kenabian dalam Kitab Suci
  alternative: para nabi sebagai manusia yang menyampaikan perkataan itu
  rationale: Konteks segera mengantar kepada kutipan Habakuk. Terjemahan utama menunjukkan tempat tertulisnya peringatan, sedangkan catatan kaki mempertahankan kemungkinan bahwa frasa itu mengacu pada para nabi sebagai penyampai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang tegas dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan Yunani berbentuk jamak; tanda titik dua dipertahankan karena ayat berikutnya memuat kutipan.
