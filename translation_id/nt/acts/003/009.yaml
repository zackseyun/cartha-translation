  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: id
  text: Semua orang melihatnya berjalan dan memuji Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Sebagai penghubung naratif, καί tidak perlu selalu dinyatakan dengan 'dan' pada awal kalimat dalam bahasa Indonesia; hubungan dengan ayat sebelumnya tetap jelas tanpa menambah nuansa temporal.
- source_word: εἶδεν
  choice: melihat
  rationale: Bentuk aoris ὁράω melaporkan bahwa orang banyak menyaksikan orang yang telah disembuhkan; 'melihat' merupakan padanan langsung dan alami.
- source_word: πᾶς ὁ λαὸς
  choice: semua orang
  rationale: Frasa ini bersifat kolektif dan merujuk kepada seluruh orang yang hadir. 'Semua orang' alami dalam bahasa Indonesia dan tidak mengubah λαός menjadi sekadar 'kerumunan'.
- source_word: αὐτὸν
  choice: dia
  rationale: Pronomina objek ini merujuk kepada orang yang disembuhkan dalam konteks sebelumnya.
- source_word: περιπατοῦντα
  choice: berjalan
  rationale: Partisipel kini ini menggambarkan tindakan yang sedang terlihat dan menonjolkan kenyataan kesembuhannya.
- source_word: καὶ αἰνοῦντα
  choice: dan memuji
  rationale: Koordinasi kedua partisipel dipertahankan; 'memuji' menyampaikan pengakuan penuh syukur yang diarahkan kepada Allah.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Sebagai objek tertentu dari pujian, θεός secara alami diterjemahkan 'Allah' dalam bahasa Indonesia.
