base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: id
  text: Dan sekarang, saudara-saudara[a], aku tahu bahwa kalian telah bertindak dalam ketidaktahuan, sebagaimana para pemimpin kalian juga telah bertindak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani secara harfiah berarti “saudara-saudara laki-laki”, tetapi dapat dipakai sebagai sapaan representatif kepada kelompok yang lebih luas, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Sekarang
  rationale: Berfungsi sebagai peralihan wacana yang alami dalam bahasa Indonesia. Unsur penghubung καί tidak perlu diterjemahkan secara mekanis karena kesinambungan dengan kalimat sebelumnya tetap jelas.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Sapaan jamak ini secara harfiah berarti saudara laki-laki, tetapi dalam pemakaian kelompok dapat mewakili hadirin yang lebih luas. Bentuk Indonesia ini alami dan tetap dekat dengan metafora kekerabatan Yunani.
- source_word: οἶδα
  choice: aku tahu
  rationale: Padanan langsung dan wajar bagi pernyataan pengetahuan Petrus.
- source_word: κατὰ ἄγνοιαν
  choice: dalam ketidaktahuan
  rationale: Mempertahankan nuansa bahwa tindakan mereka dicirikan oleh kurangnya pengetahuan tanpa menyatakan bahwa mereka sepenuhnya tidak bersalah.
- source_word: ἐπράξατε
  choice: kalian bertindak
  rationale: Menerjemahkan verba secara umum tanpa menambahkan objek yang tidak disebutkan dalam ayat ini.
- source_word: ὥσπερ καὶ
  choice: sama seperti ... juga
  rationale: 'Mempertahankan perbandingan sekaligus unsur tambahan: para pemimpin mereka melakukan hal yang serupa.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: para pemimpin kalian
  rationale: Dalam konteks Yerusalem, istilah ini menunjuk kepada orang-orang yang memegang wewenang. 'Pemimpin' lebih alami dalam bahasa Indonesia modern dan tetap mencakup dimensi politik-keagamaan konteksnya.
theological_decisions:
- issue: Apakah ketidaktahuan mereka harus diterjemahkan sebagai alasan yang menghapus kesalahan
  choice: Mempertahankan frasa 'bertindak dalam ketidaktahuan' tanpa menyiratkan pembebasan penuh dari kesalahan.
  alternative: bertindak tanpa sengaja; melakukan itu karena tidak tahu
  rationale: Ayat ini mengakui ketidaktahuan sebagai faktor, sedangkan konteks berikutnya tetap menyerukan pertobatan. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk membedakan bentuk jamak ὑμεῖς dari sapaan tunggal dan agar kalimat mudah dipahami. Tanda catatan kaki [a] ditempatkan langsung setelah sapaan yang dijelaskan.
