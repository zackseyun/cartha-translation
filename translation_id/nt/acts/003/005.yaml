base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: id
  text: Maka orang itu memusatkan perhatiannya kepada mereka[a], sambil berharap menerima sesuatu dari mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberi perhatian kepada mereka” atau “menatap mereka dengan penuh perhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Maka orang itu
  rationale: δέ menandai kelanjutan narasi dengan nuansa respons terhadap perintah sebelumnya; “Maka” alami dalam konteks ini, sedangkan “orang itu” memperjelas bahwa subjeknya adalah orang lumpuh tersebut.
- source_word: ἐπεῖχεν
  choice: memusatkan perhatiannya
  rationale: Dalam konteks ini ἐπέχω berarti mengarahkan dan mempertahankan perhatian kepada seseorang. Bentuk imperfek menyiratkan perhatian yang sedang berlangsung.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Kata ganti ini merujuk kepada Petrus dan Yohanes dan secara idiomatis melengkapi frasa “memusatkan perhatiannya”.
- source_word: προσδοκῶν
  choice: karena berharap
  rationale: Partisip ini menyatakan harapan yang menyertai sekaligus memotivasi tindakannya. “Berharap” mempertahankan unsur antisipasi tanpa menyatakan bahwa pemberian itu pasti.
- source_word: τι
  choice: sesuatu
  rationale: Kata ganti tak tentu ini menunjuk pada pemberian yang tidak dirinci; konteks mengisyaratkan sedekah, tetapi teks tidak menyebutkannya secara eksplisit.
- source_word: παρ’ αὐτῶν
  choice: dari mereka
  rationale: παρά dengan genitif menunjukkan sumber, yaitu Petrus dan Yohanes.
- source_word: λαβεῖν
  choice: akan menerima
  rationale: Infinitif ini menjelaskan isi harapannya. “Menerima” sesuai dengan konteks pemberian dan menghindari kesan mengambil atas inisiatif sendiri.
