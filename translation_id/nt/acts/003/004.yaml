base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: id
  text: Petrus, bersama Yohanes, menatap orang itu dengan saksama lalu berkata, “Pandanglah kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: menatap ... dengan saksama
  rationale: Partisip aoris ini menyatakan pandangan yang terarah dan penuh perhatian, bukan sekadar melihat sepintas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan intensitas verba Yunani.
- source_word: δὲ
  choice: lalu
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan alur cerita. 'Lalu' menyatakan perkembangan narasi tanpa menambahkan pertentangan.
- source_word: εἰς αὐτόν
  choice: orang itu
  rationale: Dengan ἀτενίζω, εἰς menandai sasaran tatapan. Pronomina αὐτόν diterjemahkan secara alami sebagai 'orang itu' sesuai rujukan dalam konteks.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: bersama Yohanes
  rationale: σύν dengan datif menyatakan penyertaan; 'bersama Yohanes' mempertahankan bahwa Yohanes turut hadir dalam tindakan tersebut.
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk λέγω ini adalah verba umum untuk berbicara; 'berkata' merupakan padanan langsung dan wajar.
- source_word: Βλέψον
  choice: Pandanglah
  rationale: Imperatif aoris ini merupakan perintah langsung untuk mengarahkan perhatian visual. 'Pandanglah' membedakannya dari tatapan intens Petrus dan sesuai dengan ragam bahasa Alkitab yang modern serta bermartabat.
- source_word: εἰς ἡμᾶς
  choice: kami
  rationale: Dengan verba melihat, εἰς menunjukkan sasaran pandangan. Dalam bahasa Indonesia, 'pandanglah kami' sudah secara idiomatis menyatakan arah tersebut tanpa memerlukan preposisi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat mempertahankan Petrus sebagai pelaku utama sekaligus menyatakan penyertaan Yohanes. Perbedaan leksikal antara tatapan intens Petrus dan perintah sederhana kepada orang itu dipertahankan melalui 'menatap ... dengan saksama' dan 'pandanglah'.
