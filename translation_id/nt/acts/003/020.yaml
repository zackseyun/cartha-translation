id: ACT.3.20
reference: Acts 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: id
  text: supaya masa-masa kelegaan datang dari hadirat Tuhan dan supaya Dia mengutus Mesias yang telah ditetapkan bagi kamu[a], yaitu Yesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah ditetapkan kepadamu” atau “yang sebelumnya telah ditetapkan bagi kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang berkaitan dengan seruan untuk bertobat pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan nuansa ketergantungannya.
- source_word: ἔλθωσιν
  choice: datang
  rationale: Subjungtif aoris bergantung pada ὅπως ἂν; dalam bahasa Indonesia, nuansa kemungkinan atau tujuan sudah dibawa oleh “supaya” sehingga tidak perlu ditambah “mungkin”.
- source_word: καιροὶ
  choice: masa-masa
  rationale: καιρός menunjuk pada masa atau waktu yang tepat; “masa-masa” mempertahankan bentuk jamak dan tidak mempersempitnya menjadi penentuan waktu eskatologis tertentu.
- source_word: ἀναψύξεως
  choice: kelegaan
  rationale: Kata ini dapat berarti penyegaran, kelegaan, atau pemulihan. “Kelegaan” terdengar alami dan tetap mempertahankan gagasan terbebas dari tekanan tanpa menafsirkan secara berlebihan.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: dari hadirat Tuhan
  rationale: Walaupun πρόσωπον secara harfiah berarti “wajah”, ungkapan ini secara idiomatis berarti kehadiran; “hadirat Tuhan” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: ἀποστείλῃ
  choice: Dia mengutus
  rationale: Subjungtif ini sejajar dengan ἔλθωσιν dan tetap berada di bawah “supaya”. Kata ganti ditulis dengan huruf kapital untuk memperjelas bahwa pelakunya adalah Tuhan dalam kalimat Indonesia.
- source_word: προκεχειρισμένον
  choice: yang telah ditetapkan
  rationale: Partisipel perfek pasif menyatakan penetapan yang sudah dilakukan dan masih berlaku. “Telah ditetapkan” menyampaikan aspek tersebut dengan alami.
- source_word: ὑμῖν
  choice: bagi kamu
  rationale: Dativus ini dapat berarti “bagi kamu” atau “kepadamu”. “Bagi kamu” paling alami untuk seseorang yang ditetapkan bagi para pendengar, sedangkan alternatif dipertahankan dalam catatan kaki.
- source_word: χριστὸν
  choice: Mesias
  rationale: Di sini χριστός berfungsi sebagai gelar bagi Yesus; “Mesias” mempertahankan makna gelar dan latar Yahudinya.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama pribadi yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah χριστὸν diterjemahkan sebagai gelar atau dipertahankan dalam bentuk tradisional
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini χριστός berfungsi sebagai gelar mesianik yang menerangkan identitas Yesus, bukan sekadar unsur nama tetap.
- issue: Makna προκεχειρισμένον ὑμῖν
  choice: yang telah ditetapkan bagi kamu
  alternative: yang telah ditetapkan kepadamu; yang sebelumnya telah ditetapkan bagi kamu
  rationale: Bentuk perfek mengandung gagasan penetapan terdahulu yang hasilnya tetap berlaku. “Telah ditetapkan bagi kamu” menyampaikan inti maknanya tanpa membuat unsur waktunya terlalu eksplisit; kemungkinan dativus dan penekanan temporal lainnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Mesias … yaitu Yesus” mempertahankan fungsi χριστός sebagai gelar sekaligus menghasilkan identifikasi yang jelas dan alami. Penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
