id: ACT.3.14
reference: Acts 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: id
  text: Tetapi kamu justru menyangkal Dia yang Kudus dan Benar, dan meminta agar seorang pembunuh diberikan kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih jelas sesuai konteks, “dibebaskan untukmu.”
    reason: Alternatif ini menyatakan secara eksplisit bahwa pemberian yang dimaksud adalah pembebasan seorang tahanan.
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Tetapi kamu justru
  rationale: “Tetapi” menyatakan pertentangan dengan ayat sebelumnya, sedangkan “justru” menyampaikan penekanan pada pronomina eksplisit ὑμεῖς secara alami dalam bahasa Indonesia.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: Dia yang Kudus dan Benar
  rationale: Kedua adjektiva berfungsi secara substantival dan menunjuk kepada satu pribadi, yaitu Yesus. “Dia yang” menghasilkan ungkapan Indonesia yang alami, sementara huruf kapital mempertahankan bobotnya sebagai sebutan.
- source_word: ἠρνήσασθε
  choice: menyangkal
  rationale: Pilihan ini mempertahankan arti langsung ἀρνέομαι, yakni menyangkal atau tidak mengakui seseorang, tanpa mempersempitnya menjadi sekadar menolak.
- source_word: ᾐτήσασθε
  choice: meminta agar
  rationale: Ungkapan ini secara alami menghubungkan tindakan meminta dengan infinitif pasif χαρισθῆναι.
- source_word: ἄνδρα φονέα
  choice: seorang pembunuh
  rationale: Dalam bahasa Indonesia, “seorang pembunuh” sudah menyatakan seorang manusia dan menerjemahkan frasa tersebut secara utuh tanpa ungkapan janggal seperti “seorang laki-laki pembunuh”.
- source_word: χαρισθῆναι ὑμῖν
  choice: diberikan kepadamu
  rationale: Pilihan ini mempertahankan arti luas verba χαρίζομαι, yaitu memberikan atau mengabulkan sebagai kemurahan. Nuansa pembebasan dalam konteks pengadilan dicatat dalam catatan kaki.
theological_decisions:
- issue: Bobot kristologis τὸν ἅγιον καὶ δίκαιον
  choice: Diterjemahkan sebagai sebutan “Dia yang Kudus dan Benar”
  alternative: Menerjemahkannya sebagai dua sifat biasa tanpa penandaan sebagai sebutan
  rationale: Konstruksi Yunani memakai satu artikel untuk kedua adjektiva substantival dan menunjuk kepada Yesus sebagai satu pribadi. Pilihan ini mempertahankan bobot sebutannya tanpa menambahkan isi doktrinal di luar teks.
- issue: Nuansa yudisial χαρισθῆναι
  choice: Memakai “diberikan kepadamu” dalam teks utama
  alternative: Memakai “dibebaskan untukmu” dalam teks utama
  rationale: Verba Yunani memiliki arti yang lebih luas daripada “membebaskan”, meskipun konteksnya jelas menyangkut pembebasan Barabas. Terjemahan utama mempertahankan keluasan leksikal, sedangkan makna kontekstual dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kamu” mengikuti sapaan jamak dalam konteks tanpa memakai bentuk regional atau terlalu percakapan; “justru” menjaga penekanan tuduhan. Tanda catatan kaki ditempatkan pada frasa yang diterangkannya.
