  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: id
  text: Kepada kamu lebih dahulu, Allah, setelah membangkitkan[a] Hamba-Nya[b], mengutus Dia untuk memberkati kamu dengan membuat kamu masing-masing berbalik dari perbuatan-perbuatan jahatmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “membangkitkan” juga dapat berarti “menghadirkan” atau “menetapkan” Hamba-Nya, bukan secara khusus membangkitkan-Nya dari kematian.
    reason: alternative_reading
  - marker: b
    text: Atau “anak-Nya”; kata Yunani παῖς dapat berarti “hamba” atau “anak”, tetapi “hamba” kemungkinan menggemakan sosok Hamba dalam kitab Yesaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: pertama-tama kepada kamu
  rationale: Ungkapan ini menyatakan bahwa para pendengar Petrus mendapat prioritas sebagai pihak yang pertama-tama dituju oleh pengutusan dan berkat Allah.
- source_word: ἀναστήσας
  choice: setelah membangkitkan
  rationale: Kata ini dapat menunjuk pada membangkitkan dari kematian atau pada membangkitkan dalam arti menghadirkan atau menetapkan seorang utusan. Pilihan ini mempertahankan ambiguitas teks Yunani.
- source_word: τὸν παῖδα αὐτοῦ
  choice: Hamba-Nya
  rationale: Dalam konteks pidato-pidato Kisah Para Rasul, παῖς kemungkinan besar menggemakan sosok Hamba dalam Yesaya. 'Anak' tetap mungkin secara leksikal, sedangkan 'Anak-Nya' akan lebih menafsirkan daripada istilah Yunani di ayat ini.
- source_word: ἀπέστειλεν αὐτόν
  choice: mengutus Dia
  rationale: Terjemahan langsung dan alami yang mempertahankan tindakan pengutusan oleh Allah tanpa menambahkan gagasan penugasan formal yang tidak dinyatakan.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: untuk memberkati kamu
  rationale: Partisip ini secara alami dipahami sebagai maksud atau hasil yang menyertai pengutusan.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: dengan membuat kamu masing-masing berbalik
  rationale: Bentuk infinitif berartikel dengan ἐν menyatakan cara berkat itu terlaksana. Ungkapan 'kamu masing-masing' mempertahankan daya distributif ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: dari segala kejahatanmu
  rationale: Bentuk jamak menunjuk pada berbagai wujud atau tindakan jahat. 'Segala kejahatanmu' alami dalam bahasa Indonesia dan tidak mempersempit makna hanya pada perbuatan tertentu.
theological_decisions:
- issue: Makna ἀναστήσας sehubungan dengan Yesus
  choice: Memakai 'membangkitkan' tanpa menentukan apakah yang dimaksud ialah kebangkitan dari kematian atau tindakan Allah menghadirkan/menetapkan Hamba-Nya.
  alternative: Menerjemahkannya secara eksplisit sebagai 'membangkitkan dari antara orang mati' atau 'menghadirkan/menetapkan'.
  rationale: Konteks memungkinkan gema kebangkitan Yesus sekaligus gema janji bahwa Allah akan membangkitkan seorang nabi atau hamba. Teks utama mempertahankan ketegangan tersebut.
- issue: Nuansa kristologis παῖς
  choice: Hamba-Nya
  alternative: anak-Nya
  rationale: '''Hamba'' paling baik mempertahankan latar Hamba dalam Yesaya dan tidak memasukkan istilah filial yang lebih tegas daripada kata Yunani pada ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami dengan tetap mempertahankan prioritas 'kepada kamu pertama-tama', hubungan waktu pada partisip, serta ambiguitas teologis kata 'membangkitkan'.
