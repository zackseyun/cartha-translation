  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: id
  text: Ia melonjak, lalu berdiri dan mulai berjalan. Kemudian ia masuk bersama mereka ke Bait Allah sambil berjalan, melompat-lompat, dan memuji Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: melonjak berdiri
  rationale: Mengungkapkan gerakan mendadak ke atas dari posisi sebelumnya sekaligus berhubungan alami dengan ἔστη (‘berdiri’), tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: περιεπάτει
  choice: mulai berjalan
  rationale: Bentuk imperfek dalam konteks kesembuhan ini paling alami menyatakan dimulainya kegiatan berjalan yang kemudian berlanjut.
- source_word: τὸ ἱερόν
  choice: Bait Allah
  rationale: Merujuk pada kawasan suci Bait Allah; ungkapan ini merupakan padanan Indonesia yang lazim dan dapat dipahami tanpa membatasi maksudnya pada bangunan ruang kudus.
- source_word: ἁλλόμενος
  choice: melompat-lompat
  rationale: Bentuk partisip kini menggambarkan tindakan melompat yang berlangsung atau berulang sambil ia masuk, berbeda dari lonjakan awal.
- source_word: αἰνῶν τὸν θεόν
  choice: memuji Allah
  rationale: Padanan langsung dan alami untuk tindakan menyatakan pujian kepada Allah.
