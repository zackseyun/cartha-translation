  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: id
  text: Musa memang berkata, “Tuhan Allah[b] akan membangkitkan bagi kalian seorang nabi dari antara saudara-saudara kalian[a], seperti aku. Dengarkanlah dia dalam segala hal yang akan dikatakannya kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari antara saudara-saudara kalian”; dalam konteks ini, ungkapan tersebut berarti dari antara sesama orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Kisah Para Rasul mengutip Ulangan 18:15 dengan redaksi yang sedikit berbeda. Khususnya, teks Yunani di sini berbunyi “Tuhan Allah”, bukan “Tuhan Allah kalian.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν
  choice: Musa memang berkata
  rationale: Nama Μωϋσῆς dilafalkan secara baku sebagai “Musa”; “memang” mempertahankan daya penegasan dan perkembangan wacana dari μὲν tanpa membuat kalimat kaku.
- source_word: Προφήτην
  choice: seorang nabi
  rationale: Bentuk tanpa artikel paling wajar diterjemahkan secara tak tentu, tanpa menyisipkan gelar “Sang Nabi” atau secara eksplisit menyebut Mesias.
- source_word: ἀναστήσει
  choice: akan membangkitkan
  rationale: Pilihan ini mempertahankan citra harfiah dan kaitan verbal dengan kutipan Ulangan; dalam konteks ini artinya menghadirkan atau memunculkan seorang nabi, bukan terutama membangkitkan dari kematian.
- source_word: κύριος ὁ θεὸς
  choice: Tuhan Allah
  rationale: Mengikuti tepat bentuk teks Kisah Para Rasul yang tidak memuat kata “kalian/mu”, alih-alih menyelaraskannya dengan bentuk Ulangan 18:15.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: dari antara saudara-saudara kalian
  rationale: Mempertahankan bahasa kekerabatan maskulin-representatif dalam latar umat perjanjian, sedangkan “dari antara” menyampaikan ἐκ secara alami.
- source_word: ὡς ἐμέ
  choice: seperti aku
  rationale: Menyampaikan perbandingan langsung antara nabi yang akan datang dan Musa tanpa menambahkan tafsiran.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Dengarkanlah dia
  rationale: Bentuk futurum Yunani dalam kutipan ini mempunyai daya perintah; imperatif Indonesia menyampaikan tuntutan untuk mendengar dengan taat, bukan sekadar menangkap bunyi.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: dalam segala sesuatu yang dikatakannya kepada kalian
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari κατὰ πάντα dan konstruksi relatif tak tentu, sambil tetap alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kutipan Ulangan 18 dan identifikasi mesianis
  choice: Mempertahankan “seorang nabi” tanpa menyisipkan “Mesias” atau “Sang Nabi” dalam teks utama.
  alternative: Menerjemahkan secara interpretatif sebagai “Sang Nabi” atau secara eksplisit menyebut Mesias.
  rationale: Dalam konteks Kisah Para Rasul, Petrus menerapkan nubuat ini kepada Yesus, tetapi kata-kata kutipannya sendiri tetap berbunyi “seorang nabi”; terjemahan tidak sepatutnya menghapus ketegangan itu.
- issue: Cakupan ἀδελφῶν
  choice: saudara-saudara kalian
  alternative: sesama orang Israel kalian
  rationale: Pilihan utama mempertahankan metafora kekerabatan dari sumber Yunani. Catatan kaki menjelaskan bahwa ungkapan itu menunjuk kepada sesama anggota umat Israel, bukan hanya saudara kandung.
- issue: Perbedaan redaksi dengan Ulangan 18:15
  choice: Tuhan Allah
  alternative: Tuhan Allah kalian
  rationale: Teks Yunani Kisah Para Rasul tidak memuat kata ganti “kalian/mu”; terjemahan mengikuti saksi yang sedang diterjemahkan dan tidak menyelaraskannya secara diam-diam dengan Ulangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak “kalian” dipakai agar pembedaan tunggal-jamak dalam sumber tetap jelas. Susunan langsung dan imperatif “Dengarkanlah” menjaga daya seruan perjanjian tanpa terdengar arkais.
