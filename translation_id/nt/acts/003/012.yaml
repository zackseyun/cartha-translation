id: ACT.3.12
reference: Acts 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: id
  text: Ketika Petrus melihat hal itu, ia berkata kepada orang banyak, “Hai orang-orang Israel, mengapa kalian heran akan hal ini? Atau mengapa kalian menatap kami seolah-olah oleh kuasa atau kesalehan kami sendiri kami telah membuat orang ini berjalan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Ketika Petrus melihat hal itu
  rationale: Partisip aoris dipahami secara temporal; objek yang tersirat dijelaskan sebagai ‘hal itu’, yakni reaksi orang banyak dalam konteks sebelumnya. δέ berfungsi sebagai peralihan ringan dan tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ia berkata kepada orang banyak
  rationale: ἀποκρίνομαι di sini merupakan tanggapan terhadap situasi, bukan jawaban atas pertanyaan langsung. ‘Berkata kepada’ lebih alami daripada ‘menjawab orang banyak’ dalam bahasa Indonesia.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hai orang-orang Israel
  rationale: Sapaan ini mempertahankan hubungan eksplisit dengan Israel serta nuansa sapaan publik; ‘orang-orang’ wajar dalam bahasa Indonesia dan tidak secara tidak perlu membatasi hadirin hanya pada laki-laki.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: mengapa kalian heran akan hal ini
  rationale: θαυμάζω menyatakan rasa heran atau takjub, sedangkan ἐπὶ τούτῳ menunjuk pada peristiwa penyembuhan.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Mengapa kalian menatap kami
  rationale: ἀτενίζω menunjukkan tatapan yang terarah dan terus-menerus; ‘menatap’ menyampaikan makna itu secara ringkas dan alami.
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: seolah-olah karena kuasa atau kesalehan kami sendiri
  rationale: ὡς memperkenalkan anggapan keliru yang ditolak Petrus. ἰδίᾳ mencakup kedua nomina yang dikoordinasikan secara alami dalam bahasa Indonesia, dan εὐσέβεια dipertahankan sebagai kualitas religius melalui ‘kesalehan’.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: kami telah membuat orang ini dapat berjalan
  rationale: Partisip perfek menyatakan hasil yang telah terjadi dan dituduhkan kepada para rasul; konstruksi infinitif menyatakan bahwa orang itu dibuat mampu berjalan. ‘Orang ini’ memperjelas rujukan αὐτόν tanpa menambah identitas baru.
theological_decisions:
- issue: Apakah εὐσεβείᾳ menyiratkan bahwa mukjizat dapat bersumber dari jasa rohani para rasul
  choice: kesalehan
  alternative: ibadah; kehidupan saleh
  rationale: ‘Kesalehan’ mempertahankan dimensi religius εὐσέβεια. Kalimat itu sendiri dengan tegas menyangkal bahwa penyembuhan terjadi karena kualitas rohani milik para rasul, tanpa memasukkan teori teologis tentang jasa.
- issue: Cakupan sapaan Ἄνδρες Ἰσραηλῖται
  choice: Hai orang-orang Israel
  alternative: Hai kaum laki-laki Israel; Hai bangsa Israel
  rationale: Bahasa sumber memakai bentuk sapaan maskulin konvensional. Dalam bahasa Indonesia, ‘orang-orang Israel’ merupakan sapaan publik yang alami dan tetap dekat dengan identitas yang disebut teks, tanpa menegaskan bahwa hadirin hanya laki-laki ketika konteks tidak menuntutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kalian’ dipakai karena Petrus menyapa orang banyak secara langsung; susunan pertanyaan dipertahankan untuk menjaga daya retoris. Tidak diperlukan catatan kaki karena pilihan utama menyampaikan unsur leksikal penting tanpa kehilangan ambiguitas yang bermakna.
