id: ACT.3.3
reference: Acts 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: id
  text: Ketika ia melihat Petrus dan Yohanes hendak masuk ke kompleks Bait Allah[a], ia meminta sedekah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada seluruh kawasan atau kompleks Bait Allah, bukan secara khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Ketika ia melihat
  rationale: Pronomina relatif merujuk kepada orang lumpuh pada ayat sebelumnya, sedangkan partisip aoris paling alami dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petrus dan Yohanes
  rationale: Menggunakan bentuk nama yang baku dan umum dalam Alkitab bahasa Indonesia.
- source_word: μέλλοντας εἰσιέναι
  choice: hendak masuk
  rationale: Menyampaikan tindakan yang segera akan dilakukan dalam konteks narasi, tanpa memaksakan perbedaan antara maksud dan kedekatan waktunya.
- source_word: εἰς τὸ ἱερὸν
  choice: ke kompleks Bait Allah
  rationale: ἱερόν menunjuk pada kawasan atau kompleks Bait Allah, bukan secara khusus ruang suci bagian dalam; pilihan ini menjaga ketepatan sekaligus tetap alami.
- source_word: ἠρώτα
  choice: ia meminta
  rationale: Imperfek menggambarkan permintaan yang sedang atau berulang dilakukan, tetapi bahasa Indonesia tidak perlu menambahkan 'mulai' yang tidak dinyatakan secara tegas oleh bentuk Yunani.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: meminta sedekah
  rationale: Ungkapan Indonesia ini secara alami menyampaikan bahwa ia memohon agar menerima pemberian bagi orang miskin; menerjemahkan λαβεῖν secara terpisah akan terasa kaku dan berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Bait Allah' mempertahankan istilah yang dikenal luas, sementara 'kompleks' memperjelas cakupan ἱερόν. Kalimat menghindari susunan harfiah 'meminta untuk menerima sedekah' yang tidak alami dalam bahasa Indonesia.
