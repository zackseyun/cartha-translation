id: ACT.3.25
reference: Acts 3:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: id
  text: Kamulah anak-anak para nabi dan anak-anak perjanjian yang Allah adakan dengan nenek moyangmu,[a] ketika Ia berfirman kepada Abraham, “Di dalam keturunanmu[b] semua kaum di bumi akan diberkati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “bapa-bapamu”, yakni para leluhur bangsa Israel.'
    reason: lexical_alternative
  - marker: b
    text: Atau “benihmu”. Kata Yunani ini dapat menunjuk secara kolektif kepada keturunan Abraham dan juga dapat mengandung pengertian seorang wakil tunggal.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: anak-anak
  rationale: Dalam ungkapan Semitis ini, kata maskulin jamak tersebut menyatakan orang-orang yang mewarisi dan turut mengambil bagian dalam janji, bukan hanya anak laki-laki secara biologis. ‘Anak-anak’ menyampaikan cakupan representatifnya secara alami dalam bahasa Indonesia.
- source_word: τῶν προφητῶν
  choice: para nabi
  rationale: Bentuk genitif dipertahankan dalam frasa ‘anak-anak para nabi’, yang di sini menunjuk pada mereka yang berada dalam garis pewarisan janji-janji kenabian, bukan semata-mata keturunan biologis.
- source_word: διαθήκης
  choice: perjanjian
  rationale: Dalam konteks janji Allah kepada Abraham dan para leluhur, ‘perjanjian’ merupakan padanan baku dan tepat bagi διαθήκη.
- source_word: διέθετο
  choice: adakan
  rationale: Bentuk tengah διατίθεμαι bersama διαθήκη berarti mengadakan atau menetapkan perjanjian. ‘Adakan’ alami dalam kolokasi bahasa Indonesia ‘mengadakan perjanjian’.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: dengan nenek moyangmu
  rationale: πρός dalam konteks pengadaan perjanjian menyatakan pihak yang dengannya perjanjian itu diadakan. ‘Nenek moyang’ lebih alami daripada ‘bapa-bapa’ untuk para leluhur Israel.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: ketika Ia berfirman kepada Abraham
  rationale: Partisipel λέγων dijadikan klausa temporal agar hubungan dengan tindakan Allah jelas dan alami; ‘berfirman’ sesuai untuk ujaran ilahi.
- source_word: σπέρματί
  choice: keturunanmu
  rationale: ‘Keturunan’ dapat berfungsi sebagai nomina kolektif sekaligus tidak menutup kemungkinan nuansa seorang wakil tunggal, sehingga ambiguitas asli tetap terpelihara.
- source_word: ἐν
  choice: melalui
  rationale: Dalam formula janji Abraham ini, ἐν dapat menyatakan sarana atau perantaraan berkat. ‘Melalui’ menghasilkan bahasa Indonesia yang alami tanpa menentukan apakah keturunan itu kolektif atau representatif tunggal.
- source_word: ἐνευλογηθήσονται
  choice: akan diberkati
  rationale: Bentuk pasif masa depan diterjemahkan langsung dan mempertahankan Allah sebagai pelaku tersirat.
- source_word: πατριαὶ
  choice: kaum
  rationale: πατριά menunjuk kelompok keluarga atau klan. ‘Kaum’ lebih luas dan alami dalam konteks universal ini, serta tidak membatasi makna pada keluarga inti.
- source_word: γῆς
  choice: bumi
  rationale: Lingkup universal janji mendukung ‘bumi’, bukan ‘negeri’ yang dapat terdengar terbatas secara geografis.
theological_decisions:
- issue: Bahasa maskulin representatif dalam υἱοὶ
  choice: anak-anak
  alternative: anak-anak lelaki
  rationale: Walaupun bentuk Yunani secara gramatikal maskulin, ungkapan perjanjian ini mencakup para pewaris atau penerima janji. ‘Anak-anak’ mempertahankan metafora kekerabatan tanpa secara keliru membatasi cakupannya pada laki-laki.
- issue: Cakupan σπέρμα dalam janji kepada Abraham
  choice: keturunan
  alternative: benih; seorang keturunan
  rationale: ‘Keturunan’ mempertahankan kemungkinan makna kolektif maupun nuansa wakil tunggal yang dikenal dalam konteks biblis, tanpa memaksakan salah satunya dalam teks utama.
- issue: Daya ἐν dalam formula berkat
  choice: melalui keturunanmu
  alternative: di dalam keturunanmu
  rationale: ‘Melalui’ menyampaikan daya instrumental yang wajar dalam bahasa Indonesia. Pilihan ini tidak menetapkan identitas atau jumlah keturunan tersebut dan tidak menghilangkan ketegangan teologis pada σπέρμα.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal ‘-mu’ mengikuti sapaan jamak Yunani kepada umat sebagai satu kelompok; ‘Kamulah’ memberi penekanan yang terdapat pada ὑμεῖς. Tanda baca menempatkan catatan [a] setelah frasa yang dijelaskannya dan [b] langsung setelah ‘keturunanmu’.
