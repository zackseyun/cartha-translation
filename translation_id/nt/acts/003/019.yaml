id: ACT.3.19
reference: Acts 3:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: id
  text: Karena itu, bertobatlah dan berbaliklah, supaya dosa-dosamu dihapuskan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dilenyapkan.'
    reason: Alternatif leksikal bagi ἐξαλειφθῆναι yang menonjolkan penghapusan sampai tidak tersisa.
lexical_decisions:
- source_word: μετανοήσατε
  choice: bertobatlah
  rationale: Imperatif aoristus aktif ini menyerukan tanggapan yang tegas. “Bertobatlah” secara alami mempertahankan bobot moral dan relasionalnya tanpa mempersempit makna menjadi sekadar perubahan pikiran atau mendahului kata kerja berikutnya.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya; “karena itu” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐπιστρέψατε
  choice: berbaliklah
  rationale: Imperatif aoristus aktif yang berdampingan dengan μετανοήσατε. “Berbaliklah” mempertahankan gambaran perubahan arah menuju Allah tanpa mengubah bentuk aktif menjadi ungkapan pasif seperti “bertobatlah/ditobatkan” dalam arti teknis.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: supaya ... dihapuskan
  rationale: Konstruksi preposisi dengan infinitif berartikel dapat menyatakan tujuan atau hasil. “Supaya ... dihapuskan” alami sekaligus tidak menentukan hubungan itu secara lebih sempit daripada teks Yunani.
- source_word: ἐξαλειφθῆναι
  choice: dihapuskan
  rationale: Infinitif pasif ini menggambarkan penghapusan atau pelenyapan. “Dihapuskan” mudah dipahami dan mempertahankan citra sesuatu yang dihapus.
- source_word: ἁμαρτίας
  choice: dosa-dosamu
  rationale: Bentuk jamak dengan pronomina orang kedua jamak diterjemahkan langsung sebagai “dosa-dosamu”; akhiran -mu dalam konteks ini mencakup para pendengar secara jamak.
theological_decisions:
- issue: Hubungan antara pertobatan, berbalik, dan penghapusan dosa
  choice: 'Mempertahankan klausa tujuan/hasil: “supaya dosa-dosamu dihapuskan.”'
  alternative: Menerjemahkan secara lebih kausal, misalnya “agar dengan demikian dosa-dosamu dihapuskan,” atau memakai istilah teknis “dikonversikan.”
  rationale: Ayat ini menghubungkan perintah untuk bertobat dan berbalik dengan penghapusan dosa, tetapi tidak menguraikan mekanisme atau urutan keselamatan secara lengkap. Terjemahan ini mempertahankan hubungan dan ketegangan tersebut tanpa memasukkan rumusan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan -lah menyampaikan seruan yang tegas namun alami. Tanda koma akhir dipertahankan karena ayat sumber berlanjut ke klausa berikutnya.
