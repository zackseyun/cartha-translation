  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: id
  text: Sementara orang itu memegang erat Petrus dan Yohanes[a], seluruh orang banyak berlari mendatangi mereka di serambi yang disebut Serambi Salomo[b], dalam keadaan sangat takjub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “orang itu berpaut erat pada Petrus dan Yohanes.” Kata Yunani yang digunakan dapat menekankan tindakan memegang kuat atau berpaut.
    reason: lexical_alternative
  - marker: b
    text: “Serambi” adalah bagian beratap dengan deretan tiang di kawasan Bait Allah; tempat ini secara tradisional dikenal sebagai Serambi Salomo.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Sementara orang itu berpegang erat
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang berlangsung bersamaan. Ungkapan ini mempertahankan makna memegang kuat tanpa menambahkan motif emosional tertentu.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: pada Petrus dan Yohanes
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim; preposisi 'pada' melengkapi ungkapan alami 'berpegang erat pada'.
- source_word: συνέδραμεν
  choice: berlari mengerumuni
  rationale: Kata kerja ini menggambarkan orang-orang yang berlari bersama-sama menuju satu titik. 'Berlari mengerumuni' menyampaikan gerak cepat sekaligus berkumpulnya banyak orang secara alami dalam bahasa Indonesia.
- source_word: πᾶς ὁ λαὸς
  choice: seluruh rakyat
  rationale: Terjemahan ini mengikuti cakupan πᾶς dan arti umum λαός, tanpa mempersempitnya menjadi sekadar kerumunan.
- source_word: πρὸς αὐτούς
  choice: mereka
  rationale: Arah gerak menuju Petrus, Yohanes, dan orang yang disembuhkan tercakup secara alami dalam konstruksi 'mengerumuni mereka'.
- source_word: ἐπὶ τῇ στοᾷ
  choice: di serambi
  rationale: Dalam konteks kawasan Bait Allah, στοά adalah serambi beratap dengan deretan tiang. 'Serambi' merupakan istilah Indonesia yang ringkas dan mudah dipahami.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: yang disebut Serambi Salomo
  rationale: Nama lengkap diulang agar sebutan tempat tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: ἔκθαμβοι
  choice: Mereka semua sangat takjub
  rationale: Adjektiva ini menyatakan ketakjuban yang kuat. Dijadikan kalimat tersendiri agar hubungan makna jelas dan tetap wajar, dengan 'semua' merujuk pada seluruh rakyat.
