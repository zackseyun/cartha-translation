  terminology: Petrus, Yohanes, Bait Allah, dan Serambi Salomo sudah sesuai dengan pemakaian Indonesia yang lazim. “Serambi” memadai untuk στοά, dengan catatan budaya yang menjelaskan bentuk arsitekturnya.
