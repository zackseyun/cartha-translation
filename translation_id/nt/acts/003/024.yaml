  naturalness: Frasa “sebanyak yang telah berbicara” tidak idiomatis dalam bahasa Indonesia modern dan terasa sebagai calque. Penataan ulang menjadi “semua nabi yang berbicara, mulai dari Samuel dan para nabi sesudahnya” lebih jelas dan alami. “Memberitakan tentang hari-hari ini” juga lebih lazim daripada “memberitakan masa ini.”
  terminology: “Nabi,” “memberitakan,” dan “hari-hari ini” sesuai dengan register Alkitab bahasa Indonesia baku. “Para nabi sesudahnya” memperjelas bahwa τῶν καθεξῆς merujuk kepada nabi-nabi dalam urutan setelah Samuel, bukan kepada pengikut Samuel.
  issues:
