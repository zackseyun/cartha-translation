revisions:
- from: Dan semua nabi, mulai dari Samuel dan mereka yang datang sesudahnya[a]—sebanyak yang telah berbicara—juga memberitakan masa ini[b].
  to: Dan semua nabi yang berbicara, mulai dari Samuel dan para nabi sesudahnya[a], juga telah memberitakan tentang hari-hari ini[b].
  rationale: Revisi ini memperbaiki idiom dan kejelasan rujukan tanpa mengubah makna. Urutan unsur diatur ulang secara wajar dalam bahasa Indonesia, sementara “juga” mempertahankan hubungan koordinatif καί dan “telah” menyampaikan tindakan lampau para nabi. Catatan kaki tetap membedakan terjemahan harfiah dari penjelasan kontekstual tanpa menetapkan penafsiran doktrinal lebih lanjut.
