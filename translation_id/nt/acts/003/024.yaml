  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: id
  text: Dan semua nabi yang berbicara, mulai dari Samuel dan para nabi sesudahnya[a], juga telah memberitakan tentang hari-hari ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para nabi berikutnya” atau “para nabi yang datang sesudahnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “hari-hari ini.” Ungkapan ini menunjuk pada masa penggenapan yang sedang dibicarakan Petrus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Dan semua nabi
  rationale: δέ bersifat penghubung ringan dan paling alami dinyatakan dengan “Dan”; πάντες οἱ προφῆται diterjemahkan langsung sebagai “semua nabi” tanpa menambahkan penegasan yang tidak wajib.
- source_word: ἀπὸ Σαμουὴλ
  choice: mulai dari Samuel
  rationale: ἀπό menandai titik awal suatu urutan; “mulai dari Samuel” membuat fungsi itu jelas dalam bahasa Indonesia modern.
- source_word: τῶν καθεξῆς
  choice: mereka yang datang sesudahnya
  rationale: καθεξῆς menunjukkan urutan atau kelanjutan; bentuk ini mempertahankan rujukan substantival kepada nabi-nabi sesudah Samuel.
- source_word: ὅσοι ἐλάλησαν
  choice: sebanyak yang telah berbicara
  rationale: “Sebanyak yang” mempertahankan daya kuantitatif ὅσοι, sedangkan “telah berbicara” menerjemahkan aoristus ἐλάλησαν secara wajar dalam konteks para nabi terdahulu.
- source_word: καὶ κατήγγειλαν
  choice: juga memberitakan
  rationale: καταγγέλλω berarti mengumumkan atau memberitakan; “memberitakan” cocok dengan tindakan publik para nabi tanpa mengkhususkan artinya menjadi “menubuatkan”.
- source_word: τὰς ἡμέρας ταύτας
  choice: masa ini
  rationale: Secara harfiah ungkapan ini berarti “hari-hari ini”, tetapi dalam bahasa Indonesia “masa ini” lebih alami untuk suatu periode penggenapan yang sedang dibicarakan dan tetap mempertahankan acuan temporalnya.
theological_decisions:
- issue: Acuan nubuat kepada saat penggenapan yang sedang dibicarakan Petrus
  choice: masa ini
  alternative: hari-hari ini
  rationale: Terjemahan mempertahankan acuan kepada periode sekarang dalam pidato Petrus tanpa secara eksplisit menambahkan label teologis seperti zaman Mesias atau akhir zaman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah membantu pembaca mengenali ὅσοι ἐλάλησαν sebagai keterangan sisipan tanpa menghilangkan cakupan inklusifnya. “Memberitakan” dipilih alih-alih “menubuatkan” agar arti verba Yunani tidak dipersempit secara interpretatif.
