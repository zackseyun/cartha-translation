  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: id
  text: Namun, demikianlah Allah menggenapi apa yang telah Dia beritakan sebelumnya melalui mulut semua nabi[a], yaitu bahwa Mesias-Nya[b] akan menderita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui semua nabi.” Secara lebih harfiah, teks Yunani berbunyi “melalui mulut semua nabi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kristus-Nya”; di sini diterjemahkan “Mesias-Nya” karena Χριστός berfungsi sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras dengan tindakan para pendengar pada ayat sebelumnya dalam bahasa Indonesia yang alami.
- source_word: προκατήγγειλεν
  choice: telah Dia beritakan sebelumnya
  rationale: Mempertahankan unsur pemberitaan dan waktu yang mendahului penggenapannya.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: melalui mulut semua nabi
  rationale: Mempertahankan ungkapan konkret dalam bahasa sumber sekaligus tetap dapat dipahami dalam bahasa Indonesia.
- source_word: παθεῖν
  choice: akan menderita
  rationale: Mengungkapkan isi pemberitaan para nabi tanpa menambahkan gagasan keharusan yang tidak dinyatakan secara eksplisit oleh bentuk infinitif ini.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: Mesias-Nya
  rationale: Χριστός berfungsi sebagai gelar dalam konteks pidato Petrus; bentuk -Nya mempertahankan αὐτοῦ sebagai rujukan kepada Allah.
- source_word: ἐπλήρωσεν
  choice: menggenapi
  rationale: Padanan Indonesia yang lazim dan tepat dalam konteks penggenapan nubuat.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Menunjukkan cara Allah menggenapi pemberitaan terdahulu, yakni melalui penderitaan Mesias yang baru saja dibicarakan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini berfungsi sebagai gelar dan mempertahankan konteks mesianik Yahudi dalam pidato Petrus.
- issue: Daya modal παθεῖν dalam hubungannya dengan nubuat
  choice: bahwa Mesias-Nya akan menderita
  alternative: bahwa Mesias-Nya harus menderita
  rationale: Pilihan ini menyampaikan isi nubuat tanpa mempertegas keharusan modal melebihi yang dinyatakan bentuk Yunani.
- issue: Hubungan οὕτως dengan ἐπλήρωσεν
  choice: dengan cara demikian Allah menggenapi
  alternative: demikianlah Allah menggenapi
  rationale: Penempatan ini mempertahankan arti cara dan mengaitkannya dengan penggenapan melalui penderitaan yang telah disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Ungkapan “melalui mulut” dipertahankan sebagai idiom alkitabiah yang masih jelas, sedangkan struktur kalimat diatur agar hubungan antara nubuat, penderitaan Mesias, dan penggenapannya tetap alami.
