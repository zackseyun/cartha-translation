  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: id
  text: Petrus dan Yohanes sedang naik ke Bait Allah pada waktu doa, yaitu jam kesembilan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut penghitungan waktu masa kini, kira-kira pukul tiga sore.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini hanya menghubungkan dan melanjutkan alur cerita secara ringan; bahasa Indonesia alami tidak memerlukan kata penghubung khusus di sini.
- source_word: ἀνέβαινον
  choice: sedang naik
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung, sedangkan 'naik' mempertahankan ungkapan sumber tentang perjalanan menuju kawasan Bait Allah.
- source_word: ἱερόν
  choice: Bait Allah
  rationale: Kata ini menunjuk pada kawasan atau kompleks Bait Allah, bukan hanya ruang suci bagian dalam. 'Bait Allah' merupakan padanan Indonesia yang alami dan mapan.
- source_word: ἐπὶ τὴν ὥραν
  choice: menjelang waktu
  rationale: Dengan konteks gerak menuju suatu tempat pada waktu yang ditetapkan, ungkapan ini dapat menyatakan bahwa mereka pergi untuk tiba pada waktu doa. 'Menjelang waktu' menyampaikan hubungan temporal itu secara alami tanpa menyiratkan bahwa perjalanan dimulai tepat pada jam tersebut.
- source_word: τῆς προσευχῆς
  choice: doa
  rationale: Genitif ini membentuk ungkapan 'waktu doa', yaitu waktu yang ditetapkan untuk berdoa.
- source_word: τὴν ἐνάτην
  choice: jam kesembilan
  rationale: Padanan ini mempertahankan sistem penghitungan waktu dalam dunia teks; perkiraan menurut sistem modern diberikan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah 'Bait Allah' dipakai sebagai sebutan yang lazim, dan sistem waktu kuno dipertahankan dalam teks utama serta dijelaskan melalui catatan kaki.
