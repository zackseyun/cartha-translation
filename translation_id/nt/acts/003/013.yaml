id: ACT.3.13
reference: Acts 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: id
  text: Allah Abraham, Ishak, dan Yakub, Allah nenek moyang kita, telah memuliakan Hamba-Nya, Yesus,[a] yang kamu serahkan dan kamu sangkal di hadapan Pilatus, ketika Pilatus telah memutuskan untuk membebaskan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Hamba” juga dapat berarti “anak”. Di sini “Hamba” kemungkinan menggemakan sebutan Hamba TUHAN dalam kitab Yesaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Allah Abraham, Ishak, dan Yakub
  rationale: Mempertahankan rumusan perjanjian yang menggemakan Keluaran 3:6, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Allah nenek moyang kita
  rationale: Dalam bahasa Indonesia modern, 'nenek moyang' secara alami menyatakan para leluhur Israel tanpa menyiratkan hanya ayah biologis, sekaligus mempertahankan nuansa historis-perjanjian.
- source_word: ἐδόξασεν
  choice: telah memuliakan
  rationale: Kata 'memuliakan' mempertahankan bobot teologis δοξάζω, sedangkan 'telah' menyampaikan tindakan lampau yang hasil atau signifikansinya tetap berlaku.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: Hamba-Nya, Yesus
  rationale: παῖς dapat berarti anak atau hamba; 'Hamba' dipilih karena kemungkinan kuat adanya gema figur Hamba TUHAN dalam Yesaya. Huruf kapital menandai pemakaian sebagai sebutan bagi Yesus, bukan status sosial biasa.
- source_word: παρεδώκατε
  choice: kamu serahkan
  rationale: '''Serahkan'' menyampaikan tindakan menyerahkan Yesus kepada pihak berwenang tanpa mempersempit makna menjadi pengkhianatan antarpribadi.'
- source_word: ἠρνήσασθε
  choice: sangkal
  rationale: '''Sangkal'' merupakan padanan langsung dan ringkas bagi ἀρνέομαι serta mempertahankan kaitan dengan bahasa penyangkalan dalam Perjanjian Baru.'
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: di hadapan Pilatus
  rationale: Padanan idiomatis dan bermartabat untuk ungkapan harfiah 'di depan wajah Pilatus', dengan tetap menunjukkan suasana terbuka dan langsung.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: ketika Pilatus telah memutuskan untuk membebaskan-Nya
  rationale: Konstruksi genitif absolut diterjemahkan secara temporal. Nama 'Pilatus' diulangi untuk menghindari ambiguitas pronominal dalam bahasa Indonesia; 'membebaskan' sesuai dengan konteks keputusan hukum.
theological_decisions:
- issue: Makna παῖς sebagai sebutan bagi Yesus
  choice: Hamba
  alternative: anak
  rationale: Konteks Kisah Para Rasul dan kemungkinan gema nyanyian Hamba dalam Yesaya mendukung 'Hamba', tetapi polisemi kata Yunani tetap dicatat karena 'anak' secara leksikal mungkin.
- issue: Aspek ἐδόξασεν
  choice: telah memuliakan
  alternative: memuliakan
  rationale: Bentuk aoris menyatakan tindakan Allah sebagai peristiwa; 'telah' secara wajar menonjolkan signifikansinya yang masih berlaku tanpa menjadikan aspek Yunani lebih spesifik secara doktrinal.
- issue: Hubungan genitif absolut dengan tindakan penyangkalan
  choice: ketika Pilatus telah memutuskan
  alternative: meskipun Pilatus telah memutuskan
  rationale: Teks Yunani secara gramatikal dapat dibaca temporal, sementara nuansa konsesif muncul dari kontras konteks. Terjemahan utama mempertahankan hubungan temporal dan tidak menambahkan konjungsi konsesif yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kamu' dipertahankan karena bentuk Yunani bersifat jamak; kapitalisasi pronomina bagi Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda koma mengapit 'Yesus' sebagai aposisi bagi 'Hamba-Nya'.
