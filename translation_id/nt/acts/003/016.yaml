revisions:
- from: Dan atas dasar iman kepada nama-Nya[a], nama-Nya sendirilah yang telah menguatkan orang yang kamu lihat dan kenal ini. Iman yang ada melalui Dia[b] telah memberikan kepada orang ini kesembuhan yang sempurna[c] di hadapan kamu semua.
  to: Dan atas dasar iman kepada nama-Nya[a], nama-Nya sendirilah yang telah menguatkan orang ini, yang kamu lihat dan kenal. Adapun iman yang melalui Dia itu telah memberikan kepadanya pemulihan yang sempurna ini[c] di hadapan kamu semua.[b]
  rationale: Revisi memulihkan arti demonstratif ταύτην dengan 'ini' dan mengganti frasa yang tidak alami 'iman yang ada melalui Dia' dengan 'iman yang melalui Dia itu'. Susunan 'orang ini, yang kamu lihat dan kenal' mempertahankan penunjukan τοῦτον dan dua verba θεωρεῖτε καὶ οἴδατε. Penempatan catatan b pada akhir kalimat tetap menambatkan keterangan itu pada frasa 'melalui Dia' tanpa mengubah makna.
