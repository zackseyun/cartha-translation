id: ACT.3.16
reference: Acts 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: id
  text: Dan atas dasar iman kepada nama-Nya[a], nama-Nya sendirilah yang telah menguatkan orang ini, yang kamu lihat dan kenal. Adapun iman yang melalui Dia itu telah memberikan kepadanya pemulihan yang sempurna ini[c] di hadapan kamu semua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan kepada nama-Nya.” Kata Yunani pistis dapat berarti “iman,” “kepercayaan,” atau dalam konteks tertentu “kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “melalui Dia” tidak menjelaskan secara tegas iman siapa yang dimaksud atau bagaimana iman itu berhubungan dengan Yesus.
    reason: theological_ambiguity
  - marker: c
    text: Atau “keadaan pulih sepenuhnya” atau “kesehatan yang sempurna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: atas dasar iman
  rationale: ἐπί dengan datif dapat menyatakan dasar atau landasan. Ungkapan ini mempertahankan nuansa tersebut dengan lebih jelas daripada sekadar “oleh iman”.
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: iman kepada nama-Nya
  rationale: Genitif yang menyertai πίστις secara wajar dipahami sebagai iman atau kepercayaan yang tertuju kepada nama Yesus. “Nama” tetap dipertahankan karena dalam Kisah Para Rasul menunjuk kepada pribadi dan kewibawaan Yesus.
- source_word: ἐστερέωσεν
  choice: telah menguatkan
  rationale: Kata kerja ini berarti menjadikan teguh atau kuat dan, dalam konteks ini, menunjuk kepada pemulihan jasmani orang tersebut.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: kamu lihat dan kenal
  rationale: 'Terjemahan ini mempertahankan dua unsur Yunani: mereka menyaksikan orang itu dan mengenalnya, sehingga pemulihannya dapat dibuktikan di muka umum.'
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya sendirilah
  rationale: Bentuk ini mempertahankan pengulangan “nama-Nya” dan menandai penekanannya sebagai subjek yang menguatkan, tanpa menggantinya dengan tafsiran seperti “Yesus sendiri” atau “kuasa nama-Nya”.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: iman yang ada melalui Dia
  rationale: Ungkapan ini mempertahankan arti harfiah διά, “melalui,” dan tidak memutuskan apakah iman itu diberikan atau dimungkinkan oleh Yesus, atau bekerja melalui perantaraan-Nya.
- source_word: ἔδωκεν αὐτῷ
  choice: telah memberikan kepada orang ini
  rationale: Bentuk lampau dengan “telah” menonjolkan hasil pemulihan yang sekarang tampak. “Orang ini” dipakai agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: ὁλοκληρίαν
  choice: kesembuhan yang sempurna
  rationale: Kata benda ini menyatakan keadaan utuh, sehat, atau pulih sepenuhnya. Dalam konteks penyembuhan jasmani, “kesembuhan yang sempurna” jelas dan alami.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: di hadapan kamu semua
  rationale: Ungkapan ini menegaskan bahwa pemulihan tersebut berlangsung secara terbuka dan dapat disaksikan oleh seluruh pendengar.
theological_decisions:
- issue: Subjek manusia dari iman dan peranan iman dalam penyembuhan
  choice: Ayat ini tidak menentukan secara tegas iman siapa yang dimaksud; terjemahan mempertahankan ketidakjelasan itu.
  alternative: Menentukan bahwa iman itu adalah iman orang yang disembuhkan, iman para rasul, atau iman yang secara khusus ditimbulkan oleh Yesus.
  rationale: Teks Yunani menghubungkan iman dengan nama Yesus dan menyebut iman “melalui Dia,” tetapi tidak menyatakan secara eksplisit siapa pemilik iman tersebut.
- issue: Daya metonimis dari “nama-Nya”
  choice: Mempertahankan “nama-Nya” sebagai pelaku yang menguatkan.
  alternative: Menerjemahkannya sebagai “Yesus sendiri” atau “kuasa nama-Nya.”
  rationale: Pemakaian “nama” dalam Kisah Para Rasul memuat hubungan dengan pribadi dan kewibawaan Yesus. Mempertahankan bentuk aslinya menghindari penyempitan makna teologis.
- issue: Makna δι’ αὐτοῦ
  choice: melalui Dia
  alternative: iman yang berasal dari Dia; iman kepada Dia; iman yang dimungkinkan oleh Dia
  rationale: Frasa Yunani ringkas dan memungkinkan lebih dari satu nuansa hubungan. Terjemahan utama tidak menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan “nama-Nya” dipertahankan karena bersifat retoris dan teologis dalam teks Yunani. “Kamu” dipakai sebagai sapaan jamak yang wajar dalam konteks pidato kepada orang banyak; frasa “kamu semua” membuat sifat jamaknya eksplisit.
