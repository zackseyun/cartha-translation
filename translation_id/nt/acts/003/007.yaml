  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: id
  text: Ia memegang tangan kanan orang itu lalu mengangkatnya hingga berdiri. Seketika itu juga, kaki dan pergelangan kakinya[a] menjadi kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tulang-tulang pergelangan kakinya.”
    reason: Alternatif leksikal bagi τὰ σφυδρά yang mungkin menunjuk lebih khusus pada tulang-tulang pergelangan kaki.
lexical_decisions:
- source_word: πιάσας
  choice: memegang
  rationale: Partisip aoris ini menyatakan tindakan yang menyertai dan mendahului verba utama. “Memegang” menyampaikan kontak fisik secara alami tanpa kesan keras yang dapat timbul dari “mencengkeram” atau “menyergap”.
- source_word: τῆς δεξιᾶς χειρός
  choice: tangan kanan orang itu
  rationale: Konstruksi genitif sesudah πιάσας menunjukkan bagian tubuh yang dipegang. Penyebutan “orang itu” memperjelas pemilik tangan secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: ἤγειρεν αὐτόν
  choice: mengangkatnya berdiri
  rationale: ἐγείρω di sini menggambarkan tindakan menaikkan orang tersebut dari posisinya. “Mengangkatnya berdiri” mempertahankan tindakan fisik dan hasil yang dimaksud tanpa mempersempitnya menjadi sekadar “membantunya”.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Ungkapan ini menandai bahwa penguatan terjadi langsung tanpa selang waktu. Pilihan tersebut alami, jelas, dan tegas dalam bahasa Indonesia modern.
- source_word: ἐστερεώθησαν
  choice: menjadi kuat
  rationale: Bentuk pasif Yunani menyatakan bahwa bagian tubuh itu dibuat atau dijadikan kuat. Dalam bahasa Indonesia, “menjadi kuat” terdengar alami sekaligus tidak menambahkan pelaku yang tidak disebutkan dalam klausa.
- source_word: αἱ βάσεις αὐτοῦ
  choice: kaki
  rationale: βάσεις secara harfiah menunjuk pada bagian penopang tubuh, yakni kaki. “Kaki” merupakan padanan yang alami dan tidak membatasi makna hanya pada telapak kaki.
- source_word: τὰ σφυδρά
  choice: pergelangan kakinya
  rationale: Istilah ini menunjuk pada daerah atau sendi pergelangan kaki. Padanan utama ini alami dan cukup tepat; kemungkinan yang lebih anatomis, “tulang-tulang pergelangan kaki,” dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat penggambaran penyembuhan
  choice: Melaporkan penguatan jasmani yang terjadi seketika tanpa menambahkan penjelasan tentang mekanisme mukjizat atau pelakunya dalam klausa ini.
  alternative: Menerjemahkannya sebagai “disembuhkan” atau secara eksplisit menyebut Allah sebagai pelaku.
  rationale: Teks menggambarkan kejadian secara konkret melalui menguatnya bagian-bagian tubuh. Terjemahan mempertahankan bentuk laporan itu dan membiarkan konteks menyampaikan makna mukjizatnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina “ia” mempertahankan subjek yang tersirat dari konteks, sedangkan “orang itu” menghindari rangkaian pronomina yang berpotensi kabur. Penanda catatan kaki ditempatkan pada istilah yang benar-benar memiliki alternatif leksikal.
