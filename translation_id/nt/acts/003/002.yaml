id: ACT.3.2
reference: Acts 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: id
  text: Ada seorang laki-laki yang lumpuh sejak dalam kandungan ibunya[a]. Ia sedang dibawa, dan setiap hari orang-orang biasa menempatkannya di pintu gerbang kompleks Bait Allah[b] yang disebut Gerbang Indah[c], agar ia meminta sedekah kepada orang-orang yang masuk ke kompleks Bait Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lumpuh sejak lahir.” Secara harfiah, “lumpuh sejak dalam kandungan ibunya.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ἱερόν menunjuk kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus di bagian dalam (ναός).
    reason: cultural_note
  - marker: c
    text: Nama gerbang itu secara harfiah berarti “Indah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: seorang laki-laki
  rationale: τις memperkenalkan seseorang yang belum disebut tetapi tertentu dalam kisah. Dalam bahasa Indonesia, bentuk takrif tak tentu yang alami ialah “seorang laki-laki”; tambahan seperti “seorang laki-laki tertentu” terasa kaku.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: yang lumpuh sejak dari kandungan ibunya
  rationale: Pilihan ini mempertahankan gambaran harfiah sumber bahwa kondisinya berlangsung sejak keluar dari rahim ibunya. Ungkapan idiomatisnya, “sejak lahir,” dicantumkan dalam catatan kaki.
- source_word: ἐβαστάζετο
  choice: Ia sedang diusung
  rationale: Imperfek pasif menggambarkan tindakan yang sedang berlangsung pada latar adegan. “Diusung” menyatakan bahwa orang lain membawanya karena ia tidak dapat berjalan.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: setiap hari orang-orang biasa menempatkannya
  rationale: Imperfek jamak menyatakan kebiasaan berulang oleh pelaku yang tidak disebutkan; “biasa menempatkannya” menyampaikan aspek habitual itu secara alami.
- source_word: θύραν τοῦ ἱεροῦ
  choice: pintu gerbang kompleks Bait Allah
  rationale: Dalam latar bangunan umum ini θύρα berarti pintu gerbang, sedangkan ἱερόν menunjuk seluruh kompleks atau pelataran Bait Allah, bukan khusus ruang kudus bagian dalam.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: yang disebut Gerbang Indah
  rationale: Ὡραία berfungsi sebagai nama atau sebutan gerbang. “Gerbang Indah” jelas dan alami sekaligus mempertahankan arti harfiahnya.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: supaya ia meminta sedekah
  rationale: Infinitif berartikel menyatakan tujuan. “Sedekah” merupakan padanan Indonesia yang lazim bagi pemberian belas kasih kepada orang miskin.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: kepada orang-orang yang masuk ke kompleks Bait Allah
  rationale: Partisipel kini menggambarkan orang-orang yang sedang masuk. “Meminta ... kepada” adalah konstruksi Indonesia yang alami untuk sumber pemberian yang dimohon.
