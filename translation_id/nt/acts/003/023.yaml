id: ACT.3.23
reference: Acts 3:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: id
  text: Dan setiap orang yang tidak mendengarkan nabi itu akan dibinasakan sepenuhnya dari antara umat itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan diputuskan dari antara umat itu.”
    reason: Alternatif ini mempertahankan idiom pemutusan atau penyingkiran dari komunitas yang terkait dengan latar Perjanjian Lama, sedangkan teks utama mencerminkan daya pembinasaan yang kuat dari verba Yunani.
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: setiap orang
  rationale: Secara harfiah berarti 'setiap jiwa', tetapi dalam idiom ini ψυχή menunjuk kepada seorang individu. 'Setiap orang' menyampaikan maknanya secara alami dalam bahasa Indonesia modern tanpa menyiratkan antropologi dualistis.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: yang tidak mendengarkan
  rationale: Konstruksi ini menyatakan siapa pun yang tidak melakukan tindakan tersebut. 'Mendengarkan' mempertahankan unsur mendengar sekaligus tanggapan atau ketaatan yang dituntut dalam konteks perjanjian, tanpa mempersempitnya menjadi sekadar mendengar bunyi.
- source_word: τοῦ προφήτου ἐκείνου
  choice: nabi itu
  rationale: Frasa ini menunjuk kembali kepada nabi seperti Musa dalam kutipan sebelumnya. Huruf kecil dipakai karena bahasa Yunani tidak menandainya sebagai gelar formal, meskipun acuannya khusus.
- source_word: ἐξολεθρευθήσεται
  choice: akan dibinasakan sama sekali
  rationale: Bentuk pasif futurum kata ini menyatakan pembinasaan atau penyingkiran yang menyeluruh. Ungkapan ini mempertahankan kekuatan katanya, sedangkan alternatif idiomatis 'disingkirkan' dicatat dalam catatan kaki.
- source_word: ἐκ τοῦ λαοῦ
  choice: dari tengah-tengah umat itu
  rationale: ἐκ menyatakan dikeluarkan atau dilenyapkan dari dalam λαός. 'Umat' sesuai dengan konteks komunitas umat perjanjian, dan 'itu' wajar dalam bahasa Indonesia tanpa menambahkan kata ganti kepunyaan yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Hakikat penghukuman yang diancamkan dalam kutipan atau alusi Petrus terhadap Ulangan 18:19
  choice: Menerjemahkan peringatan sebagai pembinasaan atau penyingkiran tanpa menentukan apakah penghukuman itu bersifat temporal, komunal-perjanjian, atau eskatologis.
  alternative: Membatasinya pada pengucilan dari komunitas perjanjian atau secara khusus pada penghakiman terakhir.
  rationale: Ayat ini jelas menyatakan penghukuman ilahi yang berat bagi orang yang tidak mendengarkan nabi itu, tetapi tidak merinci cara maupun waktunya. Terjemahan mempertahankan kerasnya ἐξολεθρευθήσεται dan dimensi komunal ἐκ τοῦ λαοῦ tanpa menyelesaikan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Umat' dipilih alih-alih 'bangsa' karena konteksnya adalah komunitas umat Allah; susunan kalimat tetap dekat dengan teks Yunani tetapi alami bagi pembaca umum.
