review_pass:
  verdict: revise
  source_fidelity: Teks utama dengan tepat menerjemahkan πᾶσα ψυχή sebagai “setiap orang,” mempertahankan cakupan universal, relasi kepada “nabi itu,” bentuk futurum pasif, serta unsur pengeluaran ἐκ τοῦ λαοῦ. Namun, “dibinasakan sama sekali” kurang idiomatis dalam bahasa Indonesia baku. Catatan kaki yang memakai “disingkirkan” juga terlalu lunak untuk alternatif idiomatik yang dimaksud (“cut off”).
  naturalness: “Akan dibinasakan sepenuhnya” lebih wajar dan tetap sekuat ἐξολεθρευθήσεται. “Dari antara umat itu” adalah susunan yang lebih lancar daripada “dari tengah-tengah umat itu,” tanpa perubahan makna.
  terminology: “Nabi itu” tepat, karena menunjuk kepada nabi yang telah disebut dalam konteks sebelumnya tanpa memaksakan kapitalisasi teologis. “Umat” sesuai untuk λαός dalam konteks ini. Catatan kaki sebaiknya memakai “diputuskan dari antara umat itu” untuk menyampaikan alternatif idiomatis penyingkiran dari komunitas, bukan sekadar tindakan menyingkirkan yang dapat terdengar sementara atau kurang berat.
  issues:
