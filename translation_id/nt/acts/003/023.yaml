    issue: Kolokasi “dibinasakan sama sekali” kurang alami.
    rationale: “Sama sekali” lazim sebagai penguat negasi atau ketiadaan; “sepenuhnya” lebih idiomatis sebagai penguat bagi pembinasaan total.
  - severity: medium
    issue: Alternatif catatan kaki “akan disingkirkan” tidak cukup jelas menyatakan idiom pemutusan/pengeluaran dari umat.
    rationale: Alternatif audit bahasa Inggris “will be cut off” lebih baik diwakili oleh “akan diputuskan dari antara umat itu,” yang mempertahankan gagasan pemutusan dari komunitas tanpa melemahkan ancaman tersebut.
