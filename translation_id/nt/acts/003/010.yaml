id: ACT.3.10
reference: Acts 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: id
  text: 'Mereka mengenalinya: dialah orang yang biasa duduk meminta sedekah di Gerbang Indah di kompleks Bait Allah.[a] Mereka dipenuhi ketakjuban dan ketercengangan atas apa yang telah terjadi padanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yunani ἱερόν menunjuk kompleks Bait Allah secara keseluruhan, bukan khusus ruang kudus bagian dalam (ναός).
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: mengenalinya
  rationale: Bentuk imperfek dalam alur narasi menyatakan bahwa orang banyak mengenali dan mengidentifikasi orang yang telah disembuhkan itu; bentuk Indonesia ini alami tanpa harus meniru aspek Yunani secara kaku.
- source_word: δὲ
  choice: Mereka pun
  rationale: δέ merupakan penghubung ringan yang melanjutkan narasi; 'pun' menjaga kesinambungan tanpa memberi kesan pertentangan kuat.
- source_word: οὗτος ἦν
  choice: sebagai orang
  rationale: Dalam bahasa Indonesia, konstruksi 'mengenalinya sebagai orang yang...' secara alami menyampaikan identifikasi tegas bahwa dialah orang yang sebelumnya mereka kenal.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: orang yang biasa duduk meminta sedekah
  rationale: Partisip berartikel menggambarkan peranan atau kebiasaan orang itu. 'Biasa duduk' mengungkapkan sifat kebiasaan dalam konteks, sedangkan 'meminta sedekah' menjelaskan tujuan ia duduk secara wajar dalam bahasa Indonesia.
- source_word: ἐλεημοσύνην
  choice: sedekah
  rationale: '''Sedekah'' adalah istilah Indonesia yang tepat dan umum untuk pemberian kepada orang miskin, tanpa mempersempitnya hanya pada uang.'
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: di Gerbang Indah
  rationale: Ὡραία berfungsi sebagai sebutan gerbang; kapitalisasi menandainya sebagai nama tempat yang dikenal.
- source_word: τοῦ ἱεροῦ
  choice: kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kawasan Bait Allah, bukan khusus ruang kudus bagian dalam; 'kompleks Bait Allah' membuat cakupan tersebut jelas dan tetap mudah dipahami.
- source_word: ἐπλήσθησαν
  choice: dipenuhi
  rationale: Bentuk pasif πίμπλημι dengan keadaan emosional diterjemahkan secara langsung dan alami sebagai 'dipenuhi'.
- source_word: θάμβους καὶ ἐκστάσεως
  choice: rasa takjub dan tercengang
  rationale: 'Dua istilah dipertahankan untuk mencerminkan penumpukan ungkapan Yunani: θάμβος menyatakan ketakjuban yang mengguncang, sedangkan ἔκστασις di sini menunjuk ketercengangan, bukan ekstase mistis.'
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: atas apa yang telah terjadi padanya
  rationale: Partisip perfek menyatakan peristiwa yang sudah terjadi dengan dampak yang masih nyata; 'telah terjadi' mempertahankan nuansa itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Bait Allah' dipakai sebagai sebutan bermartabat dan lazim bagi tempat ibadah di Yerusalem; penambahan 'kompleks' menjaga pembedaan leksikal dalam teks Yunani. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
