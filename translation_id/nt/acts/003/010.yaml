  source_fidelity: 'Makna pokok tersampaikan dengan baik: orang banyak mengenali orang yang disembuhkan itu sebagai pengemis yang biasa duduk di Gerbang Indah, lalu mereka diliputi dua ungkapan keterkejutan atas peristiwa yang terjadi padanya. Namun, demonstratif οὗτος ἦν (''dialah/ini adalah'') lebih baik dinyatakan secara eksplisit daripada hanya tersirat dalam ''sebagai orang''.'
  naturalness: Kalimat pertama pada draf alami, tetapi 'rasa takjub dan tercengang' mencampurkan nomina dengan bentuk adjektival/verba secara kurang sejajar setelah 'dipenuhi'. Bentuk 'ketakjuban dan ketercengangan' lebih baku dan paralel. Pemisahan menjadi dua kalimat tetap wajar dalam bahasa Indonesia.
  terminology: '''Sedekah'', ''Gerbang Indah'', dan ''kompleks Bait Allah'' sesuai dengan konteks. ''Kompleks Bait Allah'' dengan tepat membedakan ἱερόν dari ναός, dan catatan kaki yang ada relevan serta tertambat pada frasa yang tepat.'
  issues:
