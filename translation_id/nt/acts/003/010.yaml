    rationale: Sesudah 'dipenuhi', 'rasa takjub' adalah frasa nominal sedangkan 'tercengang' adalah bentuk predikatif. Dua nomina abstrak menyampaikan θάμβος καὶ ἔκστασις dengan lebih alami dan tetap membedakan kedua istilah.
