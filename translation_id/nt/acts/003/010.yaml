- from: Mereka mengenalinya sebagai orang yang biasa duduk meminta sedekah di Gerbang Indah kompleks Bait Allah.[a] Mereka pun dipenuhi rasa takjub dan tercengang atas apa yang telah terjadi padanya.
  to: 'Mereka mengenalinya: dialah orang yang biasa duduk meminta sedekah di Gerbang Indah di kompleks Bait Allah.[a] Mereka dipenuhi ketakjuban dan ketercengangan atas apa yang telah terjadi padanya.'
  rationale: Revisi ini menyatakan penegasan identifikatif οὗτος ἦν dengan 'dialah' dan memperbaiki kesejajaran idiomatis bagi dua nomina θάμβος dan ἔκστασις. Istilah tempat, cakupan ἱερόν, serta makna peristiwa yang telah terjadi tetap dipertahankan.
