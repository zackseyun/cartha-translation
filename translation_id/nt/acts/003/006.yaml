  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: id
  text: 'Namun Petrus berkata, “Aku tidak punya perak ataupun emas, tetapi apa yang kupunya, itulah yang kuberikan kepadamu: dalam nama Yesus Sang Mesias, orang Nazaret, berjalanlah!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: perak ataupun emas
  rationale: Mempertahankan penyebutan kedua logam secara eksplisit sebagai ungkapan kekayaan materi; “ataupun” terdengar alami dalam pernyataan negatif bahasa Indonesia.
- source_word: οὐχ ὑπάρχει μοι
  choice: Aku tidak punya
  rationale: Konstruksi Yunani menyatakan kepemilikan; bentuk ini alami dan langsung dalam bahasa Indonesia modern.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: tetapi apa yang kupunya, itulah yang kuberikan kepadamu
  rationale: Mempertahankan kontras serta penekanan demonstratif τοῦτο melalui “itulah” tanpa menjadi kaku.
- source_word: ἐν τῷ ὀνόματι
  choice: dalam nama
  rationale: Mempertahankan ungkapan sumber yang dapat mencakup otoritas dan kuasa tanpa membatasi maknanya melalui parafrasa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar; “Sang Mesias” menyampaikan makna gelar tersebut secara wajar dalam bahasa Indonesia.
- source_word: τοῦ Ναζωραίου
  choice: orang Nazaret itu
  rationale: Menyampaikan sebutan Ναζωραῖος dengan jelas dan alami, sambil mempertahankan nuansa identifikasi ‘the Nazarene’.
- source_word: περιπάτει
  choice: berjalanlah
  rationale: Padanan perintah langsung yang setia pada imperatif kini Yunani; tidak menambahkan secara eksplisit gagasan ‘mulailah’.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam rumusan nama
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam proklamasi penyembuhan ini, Χριστός tetap dapat didengar sebagai gelar. “Sang Mesias” mempertahankan arti gelar itu, sedangkan “Kristus” merupakan bentuk tradisional yang mungkin terdengar lebih menyerupai unsur nama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk pronomina terikat “kupunya/kuberikan” menjaga kelancaran ujaran langsung. Tanda koma mengapit “Sang Mesias” untuk memperjelas bahwa itu gelar bagi Yesus.
