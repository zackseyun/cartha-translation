  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: id
  text: Tetapi kamu telah membunuh Pelopor kehidupan[a], yang Allah bangkitkan dari antara orang mati. Kami menjadi saksi tentang Dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sumber kehidupan,” “Pemimpin kehidupan,” atau “Penguasa kehidupan.” Kata Yunani ἀρχηγός dapat mengandung makna pemula atau asal, pelopor, pemimpin, maupun yang utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kami menjadi saksi tentang hal itu,” yaitu tentang kebangkitan-Nya. Kata Yunani dapat dipahami merujuk kepada Dia yang dibangkitkan atau, menurut konteksnya, kepada peristiwa kebangkitan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: δέ menghubungkan klausa ini dengan tuduhan sebelumnya sekaligus menonjolkan pertentangan yang tajam; “Namun” wajar dan tidak berlebihan dalam bahasa Indonesia.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: Pemimpin kepada kehidupan
  rationale: ἀρχηγός dapat menunjuk kepada pemimpin, pelopor, atau pemula. Dalam Kisah Para Rasul 3:15, “Pemimpin kepada kehidupan” mempertahankan unsur kepemimpinan dan arah menuju kehidupan tanpa membatasi istilah itu hanya pada makna pencipta atau sumber.
- source_word: ἀπεκτείνατε
  choice: telah kamu bunuh
  rationale: Ungkapan ini menyampaikan tindakan lampau secara langsung dan menjaga penekanan pada subjek “kamu”; “membunuh” tidak ditingkatkan menjadi “membantai” atau istilah hukum lain.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: membangkitkan Dia dari antara orang mati
  rationale: Bentuk ini secara jelas menyatakan kebangkitan dan mencerminkan ἐκ νεκρῶν sebagai keluar dari lingkungan orang-orang mati.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: Tentang Dialah kami menjadi saksi
  rationale: Secara gramatikal, οὗ berbentuk maskulin tunggal dan paling langsung merujuk kepada pribadi yang dibangkitkan. “Tentang Dialah” mempertahankan rujukan personal itu, sementara catatan kaki mengakui kemungkinan kaitannya dengan peristiwa kebangkitan.
theological_decisions:
- issue: Makna gelar kristologis ἀρχηγὸς τῆς ζωῆς
  choice: Pemimpin kepada kehidupan
  alternative: Sumber kehidupan; Pelopor kehidupan; Penguasa kehidupan
  rationale: Pilihan utama menjaga keluasan istilah Yunani yang mencakup kepemimpinan, perintisan, dan kemungkinan asal-usul, serta mempertahankan paradoks bahwa mereka membunuh Dia yang memimpin kepada kehidupan.
- issue: Rujukan οὗ dalam klausa kesaksian
  choice: Tentang Dialah kami menjadi saksi
  alternative: Tentang hal itulah kami menjadi saksi
  rationale: Jenis dan jumlah οὗ paling alami merujuk kepada Yesus, tetapi konstruksi dan konteks juga memungkinkan kesaksian dipahami berkenaan dengan kebangkitan-Nya; ambiguitas tersebut dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “telah kamu bunuh” mempertahankan tekanan retoris pada pihak yang dituduh. Gelar yang kurang lazim dijelaskan melalui catatan kaki agar jangkauan makna sumber tidak disederhanakan.
