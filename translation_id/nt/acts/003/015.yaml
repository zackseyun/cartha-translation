  source_fidelity: Klausa utama dan kebangkitan telah diterjemahkan sesuai dengan Yunani. Namun, “Pemimpin kepada kehidupan” bukan kolokasi bahasa Indonesia yang wajar dan dapat terdengar seolah-olah Yesus hanya memimpin menuju kehidupan, padahal ἀρχηγός mencakup nuansa perintis/pemula, asal, dan pemimpin. Rujukan προσωπersonal οὗ dipertahankan dalam “tentang Dialah kami menjadi saksi”; catatan kaki dengan tepat mencatat kaitannya dengan kebangkitan.
  naturalness: “Pemimpin kepada kehidupan” terasa harfiah dan tidak alami dalam bahasa Indonesia modern. “Pelopor kehidupan” adalah gelar yang lebih idiomatis, tetap cukup luas secara semantis, dan paradoks retoris ayat—membunuh Dia yang berhubungan dengan kehidupan—tetap jelas. Susunan “Allah bangkitkan” juga lebih lancar daripada “Allah membangkitkan Dia” tanpa kehilangan makna.
  terminology: “Pelopor kehidupan” dipilih untuk ἀρχηγός, dengan alternatif “Sumber,” “Pemimpin,” dan “Penguasa kehidupan” di catatan kaki. Istilah “dari antara orang mati” tepat untuk ἐκ νεκρῶν. “Kami menjadi saksi tentang Dia” mempertahankan status para rasul sebagai saksi, bukan sekadar tindakan bersaksi.
