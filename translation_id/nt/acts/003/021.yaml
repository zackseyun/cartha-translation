id: ACT.3.21
reference: Acts 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: id
  text: Surga harus menerima Dia sampai tiba masa pemulihan segala sesuatu yang telah Allah firmankan melalui mulut nabi-nabi-Nya yang kudus sejak dahulu kala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Dia
  rationale: Kata ganti relatif ini merujuk kepada Yesus dalam ayat sebelumnya. Dalam bahasa Indonesia, awal kalimat dengan “Dia” lebih alami, sementara hubungan sintaksisnya tetap dipertahankan oleh konteks.
- source_word: δεῖ ... δέξασθαι
  choice: harus diterima
  rationale: Mempertahankan unsur keharusan ilahi dalam δεῖ dan makna aktif δέχομαι dengan surga sebagai pihak yang menerima.
- source_word: ἄχρι χρόνων
  choice: sampai tiba masa
  rationale: Mengungkapkan batas waktu secara alami. Bentuk jamak Yunani dapat menunjuk pada masa-masa atau kurun yang ditetapkan, tetapi bentuk kolektif “masa” lebih wajar dalam bahasa Indonesia.
- source_word: ἀποκαταστάσεως πάντων
  choice: pemulihan segala sesuatu
  rationale: Menerjemahkan frasa secara langsung tanpa menentukan cakupan atau sifat pemulihan yang tidak dijelaskan dalam ayat ini.
- source_word: ὧν ἐλάλησεν ὁ θεὸς
  choice: yang telah difirmankan Allah
  rationale: ὧν dipertahankan sebagai klausa relatif “yang”, sesuai teks sumber dan revisi teradjudikasi. “Difirmankan” sesuai untuk tindakan Allah berbicara serta tetap mudah dipahami.
- source_word: διὰ στόματος
  choice: melalui mulut
  rationale: Mempertahankan idiom Semitik-Yunani yang menekankan para nabi sebagai penyampai firman Allah.
- source_word: ἀπ’ αἰῶνος
  choice: sejak dahulu kala
  rationale: Menyampaikan makna temporal ‘sejak zaman dahulu’ dalam ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Cakupan ‘pemulihan segala sesuatu’
  choice: Dibiarkan sebagai “pemulihan segala sesuatu” tanpa penjelasan tambahan
  alternative: Menafsirkannya sebagai pemulihan universal semua makhluk atau hanya penggenapan khusus nubuat Israel
  rationale: Ayat ini sendiri tidak merinci cakupannya; terjemahan harus menjaga keluasan dan ketegangan teologis ungkapan Yunani.
- issue: Hubungan klausa relatif ὧν dengan ‘segala sesuatu’
  choice: “segala sesuatu yang telah difirmankan Allah”
  alternative: “segala sesuatu, yang mengenainya Allah telah berfirman”
  rationale: Bentuk yang dipilih mengikuti hubungan gramatikal langsung dan bukti sumber, tanpa menambahkan “mengenai”. Ambiguitas tentang apakah yang difirmankan adalah hal-hal tersebut atau pemulihannya tetap bergantung pada pembacaan konteks.
- issue: Keharusan surga menerima Kristus
  choice: “Dia harus diterima di surga”
  alternative: “Dia harus tinggal di surga”
  rationale: Pilihan ini mempertahankan makna leksikal δέξασθαι dan tidak menggantinya dengan kesimpulan interpretatif tentang masa tinggal.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur dibuat mudah dibaca tanpa menghilangkan idiom penting atau mempersempit pernyataan eskatologis teks.
