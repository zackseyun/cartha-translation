id: ACT.14.9
reference: Acts 14:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: id
  text: Orang itu mendengarkan Paulus berbicara. Setelah menatapnya dengan saksama, Paulus melihat bahwa ia memiliki iman untuk disembuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk diselamatkan.” Kata kerja Yunani yang dipakai di sini dapat berarti “menyelamatkan” atau “menyembuhkan”; dalam konteks ini, penyembuhan jasmani menjadi makna yang paling langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Orang itu
  rationale: Kata tunjuk ini merujuk secara khusus kepada laki-laki lumpuh dalam ayat sebelumnya; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: ἤκουσεν
  choice: mendengarkan
  rationale: Dalam konteks ini, bentuk tersebut menggambarkan orang itu menyimak perkataan Paulus, bukan sekadar mendengar bunyi.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Paulus berbicara
  rationale: Konstruksi genitif dengan partisip kini menyatakan bahwa Paulus sedang berbicara; bentuk Indonesia ini ringkas dan alami.
- source_word: ἀτενίσας αὐτῷ
  choice: menatapnya dengan saksama
  rationale: Kata kerja ini menyatakan pandangan yang tertuju dan penuh perhatian; pilihan ini mempertahankan intensitasnya tanpa bernada kasar seperti 'menatap tajam'.
- source_word: ἰδὼν
  choice: melihat
  rationale: Mempertahankan gambaran konkret dari kata kerja persepsi, sambil memungkinkan makna kontekstual bahwa Paulus mengenali keadaan orang itu.
- source_word: ἔχει πίστιν
  choice: memiliki iman
  rationale: Di sini πίστις menunjuk pada kepercayaan orang itu untuk menerima pertolongan ilahi, bukan pada kesetiaannya.
- source_word: τοῦ σωθῆναι
  choice: untuk disembuhkan
  rationale: Walaupun σῴζω dapat berarti 'menyelamatkan', konteks langsungnya adalah pemulihan jasmani seorang yang lumpuh. Kemungkinan makna yang lebih luas dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna σωθῆναι dalam kisah penyembuhan
  choice: untuk disembuhkan
  alternative: untuk diselamatkan
  rationale: Konteks langsung dan tindakan pada ayat berikutnya menunjuk pada penyembuhan jasmani. Namun, karena kata Yunani yang sama juga lazim dipakai untuk keselamatan dalam arti lebih luas, alternatif itu tidak dihapus dan dicatat secara terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Nama Paulus diulang pada kalimat kedua untuk menghindari kerancuan rujukan kata ganti Yunani ὃς. Susunan partisip dialihkan menjadi anak kalimat waktu agar alami dalam bahasa Indonesia tanpa mengubah urutan tindakan.
