id: ACT.14.20
reference: Acts 14:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: id
  text: Namun, setelah murid-murid berkumpul mengelilinginya[a], ia bangkit[b] lalu masuk ke dalam kota. Keesokan harinya, ia pergi bersama Barnabas ke Derbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengelilinginya” atau “mengepungnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ia berdiri.” Kata Yunani yang diterjemahkan “bangkit” di sini kemungkinan menunjuk pada tindakan Paulus bangun secara fisik; ayat ini tidak secara eksplisit menyatakan kebangkitan dari kematian.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: mengelilinginya
  rationale: Partisip aoris κυκλόω berarti berada atau membentuk lingkaran di sekeliling seseorang. “Mengelilinginya” alami dalam bahasa Indonesia dan tidak dengan sendirinya menyiratkan sikap bermusuhan.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai perkembangan yang agak kontras dengan ayat sebelumnya, ketika Paulus dilempari batu dan diseret ke luar kota karena disangka telah mati.
- source_word: τῶν μαθητῶν
  choice: murid-murid
  rationale: μαθητής secara konsisten dan wajar diterjemahkan “murid” dalam Kisah Para Rasul.
- source_word: ἀναστὰς
  choice: ia bangkit
  rationale: Dalam konteks naratif ini, ἀνίστημι menunjuk pada tindakan Paulus bangun dari keadaan terbaring. “Bangkit” mempertahankan keluasan ungkapan Yunani tanpa secara eksplisit menyatakan kebangkitan dari kematian.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: masuk ke dalam kota
  rationale: Ungkapan ini mempertahankan gerak masuk yang dinyatakan oleh εἰσέρχομαι dengan εἰς dan terdengar alami dalam bahasa Indonesia.
- source_word: τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan datif temporal ini secara idiomatis berarti hari berikutnya.
- source_word: ἐξῆλθεν
  choice: ia pergi
  rationale: Secara harfiah ἐξέρχομαι berarti “keluar”, tetapi dengan tujuan Derbe yang langsung disebutkan, “pergi” lebih alami dalam bahasa Indonesia tanpa kehilangan perpindahan tempat.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: bersama Barnabas
  rationale: σύν dengan datif menyatakan penyertaan; “bersama Barnabas” jelas dan alami.
- source_word: Δέρβην
  choice: Derbe
  rationale: Mengikuti transliterasi baku nama tempat Yunani ke dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἀναστὰς harus diterjemahkan dengan cara yang secara tegas menyatakan kebangkitan atau pemulihan ajaib
  choice: Diterjemahkan “ia bangkit” sebagai tindakan fisik, dengan catatan yang membatasi kesimpulan teologis.
  alternative: ia berdiri; ia dibangkitkan
  rationale: Partisip ἀναστὰς sendiri lazim berarti bangun atau berdiri. Konteks menunjukkan pemulihan yang mencengangkan setelah Paulus dilempari batu, tetapi ayat ini tidak secara eksplisit mengatakan bahwa ia mati lalu dibangkitkan atau bahwa pihak lain membangkitkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur narasi Yunani sambil tetap alami bagi pembaca umum. Pronomina “ia” dipakai sebagai bentuk naratif formal; nama Paulus tidak ditambahkan karena tidak muncul dalam ayat ini.
