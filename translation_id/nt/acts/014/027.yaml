  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: id
  text: Setelah tiba, mereka mengumpulkan jemaat dan melaporkan segala sesuatu yang telah Allah lakukan bersama mereka[a], dan bahwa Ia telah membuka pintu iman bagi bangsa-bangsa bukan Yahudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang telah Allah lakukan melalui mereka.” Teks Yunani secara lebih harfiah berbunyi “bersama mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia telah membuka pintu iman bagi bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Sesudah tiba
  rationale: Partisip aoristus ini menunjukkan tindakan yang mendahului laporan mereka. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: mereka mengumpulkan jemaat
  rationale: Frasa ini berarti menghimpunkan komunitas Kristen setempat untuk berkumpul. 'Jemaat' lazim dan jelas untuk ἐκκλησία dalam konteks ini.
- source_word: ἀνήγγελλον
  choice: melaporkan
  rationale: Verba imperfek ini menggambarkan penyampaian kembali apa yang telah terjadi. 'Melaporkan' sesuai dengan konteks mereka memberi kabar kepada jemaat tanpa memberi kesan sebuah pengumuman resmi.
- source_word: ὅσα
  choice: segala sesuatu yang
  rationale: Padanan Indonesia yang alami untuk kata ganti relatif netral jamak yang mencakup seluruh isi laporan.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: telah Allah lakukan bersama mereka
  rationale: Kata depan μετά dengan genitif paling langsung berarti 'bersama'. Pilihan ini mempertahankan Allah sebagai pelaku utama dan tidak mempersempit maknanya menjadi sarana semata.
- source_word: ἤνοιξεν
  choice: telah membuka
  rationale: Aoristus ini menunjuk pada tindakan Allah yang sudah terjadi dan kini mereka laporkan.
- source_word: τοῖς ἔθνεσιν
  choice: bagi bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Kisah Para Rasul, ἔθνη menunjuk kepada kelompok-kelompok non-Yahudi, bukan negara-negara dalam pengertian geopolitik.
- source_word: θύραν πίστεως
  choice: pintu iman
  rationale: Padanan ini mempertahankan metafora pintu dan hubungan genitif yang ringkas, tanpa menentukan secara berlebihan apakah artinya pintu menuju iman atau kesempatan untuk beriman.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις menunjuk pada iman atau kepercayaan, dan 'iman' merupakan padanan Indonesia yang alami serta mapan.
theological_decisions:
- issue: Makna μετ’ αὐτῶν dalam tindakan Allah
  choice: Allah lakukan bersama mereka
  alternative: Allah lakukan melalui mereka
  rationale: 'Terjemahan utama mempertahankan arti langsung ''bersama mereka''. Ini menjaga ketegangan mengenai peran Paulus dan Barnabas: Allah tetap menjadi pelaku, sedangkan mereka terkait dengan karya-Nya tanpa secara eksplisit dijadikan alat.'
- issue: Makna ἔθνεσιν
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Konteks naratif menekankan terbukanya iman bagi kalangan non-Yahudi. Pilihan ini mengungkapkan pembedaan Yahudi dan bukan Yahudi tanpa mengarah kepada pengertian negara modern.
- issue: Hubungan genitif dalam θύραν πίστεως
  choice: pintu iman
  alternative: pintu menuju iman
  rationale: Bentuk ringkas ini mempertahankan metafora dan ambiguitas konstruksi Yunani, alih-alih menentukan bahwa pintu itu semata-mata berarti jalan menuju iman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mengikuti alur tindakan dalam teks Yunani, sedangkan metafora 'pintu iman' dipertahankan. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
