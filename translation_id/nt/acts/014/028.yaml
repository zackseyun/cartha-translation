  text: And they stayed with the disciples for no little time[a].
translation:
  language: id
  text: Mereka tinggal bersama murid-murid cukup lama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “selama waktu yang tidak sedikit.” Bahasa Yunani memakai litotes; dapat juga diterjemahkan “selama waktu yang cukup panjang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: mereka tinggal
  rationale: Bentuk imperfek menunjukkan keadaan yang berlangsung selama suatu waktu; “tinggal” alami dalam bahasa Indonesia dan sesuai dengan konteks menetap di tempat itu.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan. Dalam ayat singkat ini, kesinambungan narasi dapat disampaikan secara alami tanpa kata penghubung eksplisit.
- source_word: χρόνον οὐκ ὀλίγον
  choice: cukup lama
  rationale: Ungkapan Yunani ini secara harfiah berarti “waktu yang tidak sedikit” dan merupakan litotes untuk jangka waktu yang cukup panjang. Ungkapan “cukup lama” menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: σὺν τοῖς μαθηταῖς
  choice: bersama murid-murid di sana
  rationale: σύν dengan datif berarti “bersama.” Tambahan “di sana” memperjelas bahwa yang dimaksud adalah komunitas murid setempat, tanpa mengubah rujukannya.
