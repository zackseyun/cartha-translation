id: ACT.14.3
reference: Acts 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: id
  text: Karena itu, mereka tinggal di sana cukup lama sambil berbicara dengan berani di dalam Tuhan.[a] Tuhan memberi kesaksian atas firman anugerah-Nya dengan memungkinkan tanda-tanda dan keajaiban terjadi melalui tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbicara dengan berani dengan bersandar kepada Tuhan.” Ungkapan Yunani ini dapat menekankan bahwa keberanian mereka berlandaskan Tuhan atau dijalankan dalam hubungan dengan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: cukup lama
  rationale: Ungkapan ini menunjukkan jangka waktu yang cukup panjang atau berarti, tanpa menyatakan lamanya secara pasti.
- source_word: διέτριψαν
  choice: mereka tinggal di sana
  rationale: Dalam konteks narasi ini, kata tersebut berarti menetap atau menghabiskan waktu di suatu tempat; kata “di sana” memperjelas tempat yang tersirat dari konteks.
- source_word: παρρησιαζόμενοι
  choice: berbicara dengan berani
  rationale: Pilihan ini menyampaikan tindakan berbicara secara terbuka dan tanpa takut, sebagaimana lazimnya pemakaian kata ini dalam Kisah Para Rasul.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: dengan bersandar kepada Tuhan
  rationale: Dengan παρρησιάζομαι, ἐπί dengan datif dapat menunjukkan dasar atau tumpuan keberanian. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan hubungan keberanian mereka dengan Tuhan; kemungkinan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τῷ κυρίῳ
  choice: Tuhan
  rationale: Teks Yunani hanya menggunakan gelar κύριος, sehingga terjemahan tidak menambahkan nama “Yesus” meskipun konteks naratif mungkin menunjuk kepada Tuhan yang bangkit.
- source_word: τῷ μαρτυροῦντι
  choice: memberi kesaksian
  rationale: Partisipel kini menggambarkan tindakan Tuhan yang terus menguatkan atau mengesahkan berita yang diberitakan para rasul.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: tentang firman anugerah-Nya
  rationale: “Firman” mempertahankan ungkapan λόγος, sedangkan konstruksi “anugerah-Nya” mempertahankan hubungan genitif yang dapat menunjuk pada firman yang bercirikan atau memberitakan anugerah Tuhan.
- source_word: χάριτος
  choice: anugerah
  rationale: Dalam Lukas–Kisah Para Rasul, kata ini membawa bobot teologis tentang pemberian dan kemurahan ilahi; “anugerah” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: διδόντι
  choice: dengan mengaruniakan terjadinya
  rationale: Ungkapan ini menunjukkan bahwa Tuhanlah yang memberikan atau memungkinkan terjadinya karya-karya ajaib tersebut, bukan sekadar membiarkannya.
- source_word: σημεῖα καὶ τέρατα
  choice: tanda-tanda dan keajaiban
  rationale: 'Padanan ini mempertahankan pasangan istilah Alkitabiah: karya-karya itu berfungsi sebagai tanda sekaligus membangkitkan rasa takjub.'
- source_word: γίνεσθαι
  choice: terjadinya
  rationale: Nominalisasi ini menghasilkan bahasa Indonesia yang alami setelah “mengaruniakan” serta mempertahankan gagasan bahwa tanda dan keajaiban itu menjadi nyata atau berlangsung.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: melalui tangan mereka
  rationale: Ungkapan konkret ini mempertahankan gambaran Yunani dan menegaskan bahwa para rasul adalah sarana yang melalui mereka Tuhan berkarya.
theological_decisions:
- issue: Acuan gelar “Tuhan” dalam klausa-klausa partisipial
  choice: Mempertahankan “Tuhan” tanpa menambahkan nama tertentu.
  alternative: “Tuhan Yesus” atau “Allah”.
  rationale: Teks Yunani hanya berbunyi τῷ κυρίῳ. Menambahkan “Yesus” atau menggantinya dengan “Allah” akan menentukan acuan yang tidak dinyatakan secara eksplisit oleh bentuk teks.
- issue: Makna ἐπὶ τῷ κυρίῳ
  choice: “dengan bersandar kepada Tuhan” dalam teks utama.
  alternative: “di dalam Tuhan” atau “bagi Tuhan”.
  rationale: Preposisi ἐπί dengan datif di sini dapat menunjukkan dasar, tumpuan, atau lingkup keberanian. Teks utama mengungkapkan ketergantungan kepada Tuhan, sedangkan catatan kaki mempertahankan kemungkinan ungkapan lingkup atau relasi tanpa menyelesaikan ambiguitas secara diam-diam.
- issue: Cara Tuhan memberi kesaksian tentang firman anugerah-Nya
  choice: Tanda dan keajaiban dipaparkan sebagai sarana kesaksian Tuhan.
  alternative: Memisahkan pemberian tanda dan keajaiban sebagai tindakan yang tidak berkaitan langsung dengan kesaksian-Nya.
  rationale: Dua partisipel yang menerangkan “Tuhan” saling berkaitan secara alami; tindakan mengaruniakan tanda dan keajaiban menjelaskan bagaimana Tuhan mengesahkan firman anugerah-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibagi menjadi dua agar hubungan antarklausa jelas bagi pembaca umum, tanpa menghilangkan bahwa Tuhan adalah pelaku yang memberi kesaksian dan mengaruniakan tanda-tanda serta keajaiban.
