revisions:
- from: Karena itu, mereka tinggal di sana cukup lama dan berbicara dengan berani dengan bersandar kepada Tuhan.[a] Tuhan memberi kesaksian tentang firman anugerah-Nya dengan mengaruniakan terjadinya tanda-tanda dan keajaiban melalui tangan mereka.
  to: Karena itu, mereka tinggal di sana cukup lama sambil berbicara dengan berani di dalam Tuhan.[a] Tuhan memberi kesaksian atas firman anugerah-Nya dengan memungkinkan tanda-tanda dan keajaiban terjadi melalui tangan mereka.
  rationale: 'Revisi mempertahankan seluruh unsur utama teks Yunani sambil menghindari penyelesaian sepihak atas ἐπὶ τῷ κυρίῳ. Kalimat kedua tetap menjadikan Tuhan subjek bagi kedua tindakan partisipial: Ia memberi kesaksian atas firman anugerah-Nya dan memungkinkan tanda-tanda serta keajaiban terjadi melalui tangan mereka. Perubahan gaya membuat terjemahan lebih alami dalam bahasa Indonesia baku modern tanpa menambah acuan bagi gelar ''Tuhan''.'
