id: ACT.14.12
reference: Acts 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: id
  text: Mereka menyebut Barnabas Zeus dan Paulus Hermes, sebab Pauluslah yang memimpin pembicaraan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλουν
  choice: menyebut
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam respons orang banyak; dalam narasi Indonesia, bentuk lampau ditentukan oleh konteks dan tidak perlu ditandai secara khusus.
- source_word: τε
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menghubungkan ayat dengan narasi sebelumnya secara ringan; alur bahasa Indonesia tetap alami tanpa konjungsi eksplisit.
- source_word: Δία
  choice: Zeus
  rationale: Teks Yunani menyebut dewa Yunani Zeus, bukan padanan Romawinya, Yupiter.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Teks Yunani menyebut Hermes secara langsung, bukan padanan Romawinya, Merkurius.
- source_word: ἐπειδὴ
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan orang banyak menyamakan Paulus dengan Hermes.
- source_word: αὐτὸς
  choice: Pauluslah
  rationale: Pengulangan nama memperjelas rujukan pronomina, sedangkan partikel -lah menyampaikan penekanan yang membedakan Paulus dari Barnabas.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: yang memimpin pembicaraan
  rationale: Ungkapan ini secara harfiah menunjuk kepada orang yang mengambil peran utama dalam berbicara; pilihan ini alami dan tetap mempertahankan unsur kepemimpinan dalam frasa Yunani.
theological_decisions:
- issue: Nama dewa-dewa kafir
  choice: Zeus dan Hermes
  alternative: Yupiter dan Merkurius
  rationale: Nama Yunani dipertahankan sesuai teks sumber dan tidak diganti dengan padanan Romawi yang dikenal dari tradisi terjemahan tertentu.
- issue: Peran Paulus dalam λόγος
  choice: yang memimpin pembicaraan
  alternative: juru bicara utama
  rationale: Pilihan ini tidak memberi makna teologis khusus kepada λόγος, tetapi menyatakannya sebagai kegiatan berbicara dalam konteks tersebut, sambil mempertahankan nuansa bahwa Paulus mengambil peran utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat dibuat ringkas serta bermartabat; nama Yunani dipertahankan, dan penekanan αὐτός disampaikan melalui bentuk 'Pauluslah'.
