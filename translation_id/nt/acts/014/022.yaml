review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya menyampaikan tiga tindakan partisipial dan isi ὅτι dengan baik. Namun, susunan “Untuk masuk ... kita harus melewati” sedikit menggeser διά πολλῶν θλίψεων menjadi prasyarat bertujuan dan kurang langsung mencerminkan “melalui banyak penderitaan ... masuk.”
  naturalness: Bahasa draf umumnya alami. Bentuk tidak langsung dengan “mengatakan bahwa” lebih dekat pada konstruksi Yunani daripada kutipan langsung dan menghindari penambahan efek ujaran langsung.
  terminology: “Kerajaan Allah,” “para murid,” dan “iman” sesuai register Alkitab Indonesia modern. “Menguatkan hati” adalah padanan idiomatis yang aman untuk τὰς ψυχὰς. Catatan b perlu diperbaiki karena “penindasan” terlalu sempit untuk θλίψεις.
  issues:
  - severity: medium
    issue: Susunan klausa penderitaan
    rationale: “Untuk masuk ke dalam Kerajaan Allah, kita harus melewati banyak penderitaan” dapat terdengar seolah-olah penderitaan adalah syarat demi mencapai tujuan. Yunani menyatakan bahwa masuk ke Kerajaan Allah berlangsung melalui banyak penderitaan. Susunan “kita harus masuk ... melalui banyak penderitaan” mempertahankan relasi tersebut dengan lebih langsung.
  - severity: medium
    issue: Catatan kaki a terlalu memperluas arti alternatif
    rationale: “Terus hidup dengan beriman” bukan alternatif leksikal yang setara bagi ἐμμένειν τῇ πίστει, yang terutama berarti tetap/bertekun dalam iman. Catatan sebaiknya membatasi diri pada alternatif yang didukung teks.
  - severity: medium
    issue: Catatan kaki b memakai “penindasan”
    rationale: θλίψεις mencakup kesesakan, kesusahan, dan penderitaan secara luas; “penindasan” membatasi makna pada satu jenis penderitaan yang tidak dinyatakan dalam teks.
  revised_text: Mereka menguatkan hati para murid, mendorong mereka agar tetap berpegang pada iman[a], dan mengatakan bahwa kita harus masuk ke dalam Kerajaan Allah melalui banyak penderitaan[b].
  revised_footnotes:
  - marker: a
    text: Atau, “tetap dalam iman.” Artikel Yunani mendukung pengertian yang lebih tertentu, yaitu iman yang dianut bersama.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui banyak kesusahan” atau “melalui banyak kesengsaraan.”
    reason: lexical_alternative
  revision_rationale: Revisi menata kembali klausa terakhir agar fungsi διά (“melalui”) dan δεῖ (“harus”) mengikuti susunan serta hubungan makna Yunani tanpa menyiratkan bahwa penderitaan merupakan jasa atau syarat keselamatan. “Mengatakan bahwa” mencerminkan ὅτι dengan wajar dalam bahasa Indonesia. Kedua catatan kaki diperketat agar alternatifnya tetap berada dalam rentang makna sumber.
