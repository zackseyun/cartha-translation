  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: id
  text: Mereka menguatkan hati para murid, mendorong mereka agar tetap berpegang pada iman[a], dan mengatakan bahwa kita harus masuk ke dalam Kerajaan Allah melalui banyak penderitaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetap dalam iman.” Artikel Yunani mendukung pengertian yang lebih tertentu, yaitu iman yang dianut bersama.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui banyak kesusahan” atau “melalui banyak kesengsaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: menguatkan
  rationale: Partisipel kini ini menggambarkan tindakan berkelanjutan Paulus dan Barnabas untuk meneguhkan para murid.
- source_word: τὰς ψυχὰς
  choice: hati
  rationale: Dalam konteks ini ψυχή menunjuk pada batin atau diri seseorang. 'Menguatkan hati' merupakan ungkapan Indonesia yang alami tanpa menyiratkan dualisme tubuh-jiwa.
- source_word: τῶν μαθητῶν
  choice: para murid
  rationale: Istilah baku dan mudah dipahami bagi para pengikut yang belajar dan berkomitmen kepada Yesus.
- source_word: παρακαλοῦντες
  choice: mendorong
  rationale: Konteks menuntut dorongan yang sekaligus menguatkan dan mendesak, bukan sekadar penghiburan.
- source_word: ἐμμένειν
  choice: tetap berpegang pada
  rationale: Mengungkapkan ketekunan atau keberlanjutan dalam sesuatu secara alami dalam bahasa Indonesia.
- source_word: τῇ πίστει
  choice: iman
  rationale: Artikel Yunani dapat menunjuk pada iman yang dianut bersama, tetapi bahasa Indonesia tidak memiliki artikel tentu; frasa 'berpegang pada iman' tetap memungkinkan nuansa objektif maupun lebih umum.
- source_word: διὰ πολλῶν θλίψεων
  choice: melewati banyak penderitaan
  rationale: διά dengan genitif menyatakan jalan atau sarana yang dilalui, sedangkan θλῖψις mencakup tekanan, kesusahan, dan penderitaan.
- source_word: δεῖ ἡμᾶς
  choice: kita harus
  rationale: Menyampaikan keniscayaan dengan jelas tanpa menambahkan sumber atau mekanisme teologisnya.
- source_word: εἰσελθεῖν εἰς
  choice: masuk ke dalam
  rationale: Padanan Indonesia yang alami bagi gerak memasuki suatu ranah.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku yang mempertahankan cakupan pemerintahan sekaligus ranah kerajaan Allah.
theological_decisions:
- issue: Makna τῇ πίστει
  choice: iman
  alternative: kepercayaan; ajaran iman
  rationale: Artikel Yunani mendukung acuan tertentu, kemungkinan iman bersama umat Kristen, tetapi terjemahan tidak mempersempitnya menjadi sistem doktrin teknis. Catatan kaki mempertahankan kemungkinan nuansa tersebut.
- issue: Daya δεῖ
  choice: kita harus
  alternative: kita perlu; sudah semestinya kita
  rationale: '''Harus'' mempertahankan unsur keniscayaan tanpa menjelaskan apakah keniscayaan itu bersifat ilahi, providensial, atau bentuk lain.'
- issue: Hubungan penderitaan dan masuk ke Kerajaan Allah
  choice: Untuk masuk ke dalam Kerajaan Allah, kita harus melewati banyak penderitaan
  alternative: Melalui banyak penderitaan kita harus masuk ke dalam Kerajaan Allah
  rationale: Susunan Indonesia ini jelas menyampaikan bahwa penderitaan merupakan jalan yang dilalui, bukan jasa atau syarat yang menghasilkan keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Menguatkan hati' dipilih daripada 'menguatkan jiwa' agar tidak kaku; kutipan langsung dipakai untuk memperjelas isi dorongan yang diperkenalkan oleh ὅτι.
