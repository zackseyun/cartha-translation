revisions:
- from: Mereka menguatkan hati para murid dan mendorong mereka untuk tetap berpegang pada iman[a], dengan berkata, “Untuk masuk ke dalam Kerajaan Allah, kita harus melewati banyak penderitaan[b].”
  to: Mereka menguatkan hati para murid, mendorong mereka agar tetap berpegang pada iman[a], dan mengatakan bahwa kita harus masuk ke dalam Kerajaan Allah melalui banyak penderitaan[b].
  rationale: Revisi menata kembali klausa terakhir agar fungsi διά (“melalui”) dan δεῖ (“harus”) mengikuti susunan serta hubungan makna Yunani tanpa menyiratkan bahwa penderitaan merupakan jasa atau syarat keselamatan. “Mengatakan bahwa” mencerminkan ὅτι dengan wajar dalam bahasa Indonesia. Kedua catatan kaki diperketat agar alternatifnya tetap berada dalam rentang makna sumber.
  reviewer_model: gpt-5.6-terra
