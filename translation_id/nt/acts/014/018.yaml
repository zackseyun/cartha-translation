  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: id
  text: Dengan mengatakan semua itu, mereka nyaris tidak berhasil menahan orang banyak supaya tidak mempersembahkan kurban kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Bahkan dengan berkata demikian
  rationale: Dalam konteks ini καί bernilai penguat (‘bahkan’), sedangkan ταῦτα λέγοντες merujuk pada perkataan para rasul sebelumnya.
- source_word: μόλις κατέπαυσαν
  choice: hampir tidak dapat mencegah
  rationale: μόλις menyatakan bahwa hasil itu dicapai dengan sangat sulit; κατέπαυσαν berarti menghentikan atau mencegah tindakan yang hendak dilakukan.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Padanan alami bagi bentuk jamak yang menunjuk kepada kerumunan yang hadir.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: mempersembahkan kurban kepada mereka
  rationale: Konstruksi ini melengkapi κατέπαυσαν dengan tindakan yang dicegah; θύειν dalam konteks ibadah berarti mempersembahkan kurban.
theological_decisions:
- issue: Pihak yang menerima kurban
  choice: kepada mereka
  alternative: kepada rasul-rasul itu
  rationale: Pronomina αὐτοῖς dipertahankan secara langsung dan merujuk kepada Barnabas dan Paulus tanpa menambahkan penjelasan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan ‘hampir tidak dapat’ mempertahankan tekanan μόλις bahwa orang banyak hanya berhasil dicegah dengan susah payah.
