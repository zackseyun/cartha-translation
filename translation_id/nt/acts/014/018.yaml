  source_fidelity: Draf menangkap tindakan yang dicegah—orang banyak mempersembahkan kurban kepada Paulus dan Barnabas—serta tekanan μόλις. Namun, pembuka «Bahkan dengan berkata demikian» kurang alami dan tidak mencerminkan fungsi penghubung καί dengan baik; bentuk lampau hasil κατέπαυσαν juga lebih jelas bila dinyatakan sebagai keberhasilan yang sangat sulit.
