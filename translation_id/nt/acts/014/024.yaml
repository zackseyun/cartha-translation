  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: id
  text: Setelah melintasi Pisidia, mereka tiba di Pamfilia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: setelah melintasi
  rationale: Partisip aoris aktif ini menyatakan tindakan yang mendahului verba utama. Frasa ini mempertahankan hubungan waktu tersebut dan terdengar alami dalam bahasa Indonesia.
- source_word: Πισιδίαν
  choice: Pisidia
  rationale: Nama wilayah ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἦλθον
  choice: mereka tiba
  rationale: Dalam konteks perjalanan menuju suatu wilayah, bentuk aoris dari ἔρχομαι secara alami menyatakan bahwa mereka sampai di tujuan. 'Tiba' menghindari kecanggungan sudut pandang yang dapat muncul dari 'datang'.
- source_word: εἰς τὴν Παμφυλίαν
  choice: di Pamfilia
  rationale: Dengan verba 'tiba', preposisi εἰς yang menandai gerak menuju atau masuk ke suatu tempat secara idiomatis dinyatakan dengan 'di' dalam bahasa Indonesia.
- source_word: καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Kata penghubung sederhana ini meneruskan alur perjalanan. Dalam ayat mandiri bahasa Indonesia, hubungan itu sudah tersampaikan secara alami tanpa harus membuka kalimat dengan 'dan'.
