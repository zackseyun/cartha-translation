id: ACT.14.5
reference: Acts 14:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: id
  text: Dan ketika timbul suatu upaya[a] oleh orang-orang bukan Yahudi dan orang-orang Yahudi[b], bersama para pemimpin mereka, untuk memperlakukan mereka dengan kasar dan merajam mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerakan mendadak” atau “serangan”. Kata Yunani ὁρμή dapat menunjuk pada gerakan keras atau serbuan. “Upaya” dipilih di sini karena tindakan memperlakukan dengan kasar dan merajam dinyatakan sebagai tujuan, bukan sebagai tindakan yang sudah selesai dilakukan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks tertentu, “orang-orang Yahudi” dapat diterjemahkan “orang-orang Yudea”. Di sini istilah itu tampaknya menunjuk kepada sekelompok penentang Yahudi, bukan secara khusus kepada orang-orang yang berasal dari Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Namun, ketika
  rationale: ὡς memberi nuansa waktu, sedangkan δέ menghubungkan perkembangan baru dalam narasi dengan sedikit nuansa peralihan atau pertentangan.
- source_word: ἐγένετο ὁρμὴ
  choice: muncul upaya
  rationale: Ungkapan ini menyatakan timbulnya gerakan atau tindakan bermusuhan. Karena kedua infinitif berikutnya menyatakan tindakan yang hendak dilakukan, pilihan ini tidak menyiratkan bahwa tindakan itu sudah terlaksana.
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: dari orang-orang bukan Yahudi maupun orang-orang Yahudi
  rationale: Dalam konteks Kisah Para Rasul, ἔθνη merujuk kepada orang non-Yahudi, dan konstruksi τε καὶ mengikutsertakan kedua kelompok.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: bersama para pemimpin mereka
  rationale: ἄρχοντες menunjuk kepada orang-orang yang memiliki kedudukan atau wewenang. 'Pemimpin' terdengar alami dalam bahasa Indonesia tanpa membatasi mereka pada jabatan pemerintahan tertentu.
- source_word: ὑβρίσαι
  choice: untuk memperlakukan mereka dengan kejam
  rationale: ὑβρίζω mencakup perlakuan menghina, kasar, atau kejam. Frasa ini mempertahankan cakupan yang lebih luas daripada sekadar penghinaan lisan.
- source_word: λιθοβολῆσαι
  choice: merajam
  rationale: Kata ini berarti melempari seseorang dengan batu. 'Merajam' merupakan padanan ringkas dan lazim dalam konteks Alkitab, tanpa menambahkan hasil kematian yang tidak dinyatakan secara eksplisit oleh bentuk katanya.
- source_word: αὐτούς
  choice: mereka
  rationale: Kata ganti ini merujuk kepada Paulus dan Barnabas; bentuk pronominal sumber dipertahankan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Orang-orang bukan Yahudi' dipilih karena lebih mudah dipahami pembaca umum daripada istilah serapan, sedangkan 'merajam' dipertahankan sebagai istilah Alkitab yang masih dikenal. Susunan kalimat mengikuti struktur ayat sumber, yang berlanjut ke ayat berikutnya.
