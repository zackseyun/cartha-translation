  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: id
  text: Namun, Ia tidak membiarkan diri-Nya tanpa kesaksian[a], sambil berbuat baik dengan memberi kamu hujan dari langit dan musim-musim yang menghasilkan buah[b], serta memenuhi hati kamu[c] dengan makanan dan kegembiraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanpa saksi.” Ungkapan Yunani menegaskan bahwa Allah tidak membiarkan diri-Nya tanpa kesaksian tentang siapa diri-Nya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “musim-musim yang menghasilkan buah.”'
    reason: lexical_clarification
  - marker: c
    text: Sejumlah naskah berbunyi “hati kita”; SBLGNT berbunyi “hati kamu.”
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Namun
  rationale: 'Menyatakan hubungan konsesif dengan ayat sebelumnya: meskipun Allah membiarkan bangsa-bangsa menempuh jalan mereka sendiri, Ia tetap memberi kesaksian tentang diri-Nya.'
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: Ia tidak membiarkan diri-Nya tanpa kesaksian
  rationale: Mempertahankan bentuk refleksif dan nuansa kesaksian/testimoni dalam bahasa Indonesia yang wajar.
- source_word: ἀγαθουργῶν
  choice: Ia berbuat baik
  rationale: Partisip ini menjelaskan cara Allah memberi kesaksian tentang diri-Nya melalui kebaikan-Nya.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: dengan memberi kamu hujan dari langit
  rationale: Mengungkapkan hubungan penjelas/instrumental partisip serta mempertahankan sumber hujan dari langit. Kata jamak Yunani ὑετούς diterjemahkan secara alami dengan kata massa 'hujan' dalam bahasa Indonesia.
- source_word: καιροὺς καρποφόρους
  choice: musim-musim yang menghasilkan buah
  rationale: Menyampaikan arti waktu atau musim yang produktif secara jelas dan alami, sambil mempertahankan citra pertanian.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: serta memenuhi hati kamu dengan makanan dan kegembiraan
  rationale: Mempertahankan citra bahwa hati dipenuhi oleh makanan dan kegembiraan serta mengikuti bacaan SBLGNT ὑμῶν, 'kamu'.
theological_decisions:
- issue: Sifat kesaksian Allah dalam ayat ini
  choice: Allah memberi kesaksian tentang diri-Nya melalui kebaikan pemeliharaan-Nya
  alternative: Ayat ini hanya menggambarkan proses alam yang impersonal
  rationale: Kata refleksif 'diri-Nya', istilah 'kesaksian', dan tindakan-tindakan ilahi dalam partisip menunjukkan bahwa hujan, musim yang produktif, makanan, dan kegembiraan disajikan sebagai kesaksian Allah tentang diri-Nya.
- issue: Objek kata ganti pada frasa penutup
  choice: hati kamu
  alternative: hati kita
  rationale: SBLGNT membaca ὑμῶν ('kamu'), walaupun terdapat varian tekstual ἡμῶν ('kita'). Bacaan teks sumber dipertahankan dan variannya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kamu' dipakai karena Paulus berbicara kepada khalayak jamak; bentuk ini juga menghindari penambahan inklusivitas yang tidak terdapat dalam bacaan SBLGNT. Tanda titik dua memperjelas bahwa tindakan baik Allah menjelaskan kesaksian-Nya.
