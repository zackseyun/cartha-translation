language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: id
  text: Namun, orang-orang Yahudi dari Antiokhia dan Ikonium datang. Mereka membujuk orang banyak, lalu melempari Paulus dengan batu dan menyeretnya ke luar kota karena mengira ia sudah mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena mengira ia telah meninggal.” Bahasa Yunani menyatakan anggapan mereka, bukan secara tegas bahwa Paulus benar-benar meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Namun, datanglah
  rationale: δέ menandai perubahan yang berlawanan dengan sambutan baik sebelumnya, sedangkan ἐπῆλθαν menyatakan kedatangan para penentang dari kota lain.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada orang Yahudi yang datang dari Antiokhia dan Ikonium, bukan khusus penduduk Yudea.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Mereka membujuk orang banyak
  rationale: Ungkapan ini menyatakan tindakan yang mendahului dan turut memungkinkan serangan terhadap Paulus. 'Orang banyak' alami dalam bahasa Indonesia dan tetap mewakili kelompok-kelompok yang disebut dalam bentuk jamak Yunani.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: lalu melempari Paulus dengan batu
  rationale: Verba Yunani menyatakan tindakan merajam atau melempari dengan batu. Rumusan ini jelas dan alami tanpa memastikan secara tersirat bahwa penghukuman itu berhasil membunuh Paulus.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: menyeretnya ke luar kota
  rationale: σύρω menggambarkan penyeretan secara kasar; bentuk imperfek memberi gambaran tindakan yang berlangsung, tetapi bentuk lampau naratif Indonesia sudah menyampaikannya secara alami.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: karena mengira ia sudah mati
  rationale: Partisip ini memberikan alasan mereka menyeret Paulus ke luar kota. Bentuk perfektif τεθνηκέναι menyoroti keadaan sebagai hasil kematian, sehingga 'sudah mati' alami sekaligus tetap hanya melaporkan anggapan mereka.
theological_decisions:
- issue: Apakah Paulus benar-benar mati atau hanya dianggap mati oleh para penyerangnya
  choice: 'Teks utama menyatakan persepsi para penyerang: ''karena mengira ia sudah mati.'''
  alternative: Sebagian penafsir menyimpulkan bahwa Paulus benar-benar mati lalu hidup kembali.
  rationale: Bahasa Yunani secara eksplisit melaporkan anggapan mereka (νομίζοντες), bukan menetapkan sebagai fakta bahwa Paulus benar-benar mati. Terjemahan mempertahankan batas pernyataan teks dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dipecah agar rangkaian partisip Yunani tetap jelas dan alami. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
