id: ACT.14.11
reference: Acts 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: id
  text: Ketika orang banyak melihat apa yang telah dilakukan Paulus, mereka berseru dalam bahasa Likaonia, “Dewa-dewa telah menjadi serupa dengan manusia dan turun kepada kita!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Ketika orang banyak melihat
  rationale: Partisip aoris ἰδόντες paling wajar dipahami secara temporal. Kata ὄχλοι berbentuk jamak, tetapi bahasa Indonesia secara alami memakai ungkapan kolektif “orang banyak” tanpa harus menandai jamak secara morfologis.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: apa yang telah dilakukan Paulus
  rationale: 'Bentuk perfektif “telah dilakukan” menjaga urutan naratif: tindakan Paulus sudah terjadi ketika orang banyak melihat akibatnya.'
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: mereka berseru
  rationale: Ungkapan harfiah “mengangkat suara mereka” merupakan idiom untuk berbicara dengan suara keras. “Berseru” menyampaikan maknanya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: Λυκαονιστί
  choice: dalam bahasa Likaonia
  rationale: Adverbia ini menyatakan bahwa mereka berbicara dalam bahasa setempat; penyebutan “bahasa” memperjelas maksudnya bagi pembaca modern.
- source_word: Οἱ θεοὶ
  choice: Dewa-dewa
  rationale: Bentuk jamak θεοί dalam seruan masyarakat politeistis merujuk pada dewa-dewa, bukan kepada Allah yang esa.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: telah menjadi serupa dengan manusia
  rationale: Partisip pasif aoris menyatakan bahwa dewa-dewa itu, menurut anggapan orang banyak, menjadi atau dibuat menyerupai manusia. “Menjadi serupa dengan manusia” mempertahankan gagasan kemiripan tanpa memasukkan istilah kristologis yang tidak dinyatakan teks.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: turun kepada kita
  rationale: Terjemahan langsung dan alami dari verba aoris καταβαίνω dengan frasa arah πρὸς ἡμᾶς; dalam seruan langsung bahasa Indonesia, bentuk ini tetap terasa hidup.
theological_decisions:
- issue: Menampilkan tafsiran pagan orang banyak tanpa memasukkan teologi inkarnasi Kristen
  choice: Dewa-dewa telah menjadi serupa dengan manusia dan turun kepada kita
  alternative: Dewa-dewa telah turun kepada kita dalam rupa manusia
  rationale: Pilihan utama mengikuti struktur partisip ὁμοιωθέντες dengan lebih dekat dan mempertahankan klaim keliru orang banyak sebagai ucapan mereka sendiri. Kata “serupa” menjaga unsur kemiripan, sedangkan “dalam rupa manusia” dapat terdengar lebih halus tetapi kurang langsung mencerminkan bentuk verbal Yunani.
translation_notes:
  register: Bahasa Indonesia baku, jelas, dan layak untuk pembacaan publik. “Orang banyak,” “berseru,” dan “dewa-dewa” merupakan pilihan alami bagi narasi Alkitab modern. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus dipertahankan dalam edisi pembaca.
