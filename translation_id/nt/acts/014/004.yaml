id: ACT.14.4
reference: Acts 14:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: id
  text: 'Namun, penduduk kota itu terbagi[a]: sebagian bersama orang-orang Yahudi dan sebagian lagi bersama para rasul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang banyak di kota itu terpecah.”
    reason: Alternatif ini mempertahankan gambaran harfiah ἐσχίσθη dan padanan yang lebih formal bagi τὸ πλῆθος τῆς πόλεως.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: terbagi
  rationale: Bentuk pasif σχίζω menyatakan bahwa suatu kelompok terbelah atau terbagi. “Terbagi” alami untuk menggambarkan perpecahan sosial di antara penduduk kota tanpa menambahkan penyebabnya.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: penduduk kota itu
  rationale: πλῆθος di sini menunjuk secara luas kepada orang banyak dalam kota, bukan semata-mata kerumunan yang sedang berkumpul. “Penduduk kota itu” ringkas, alami, dan sesuai konteks.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai perkembangan yang berkontras dengan keberhasilan pemberitaan pada ayat sebelumnya. “Namun” menyampaikan kontras ringan itu dalam bahasa Indonesia yang wajar.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: sebagian ... sebagian lagi
  rationale: Konstruksi korelatif ini membagi kelompok tersebut menjadi dua pihak yang berlawanan. “Sebagian ... sebagian lagi” menyatakannya secara jelas dan alami.
- source_word: σὺν
  choice: bersama
  rationale: σύν dengan datif menyatakan kebersamaan atau hubungan dengan suatu pihak. “Bersama” mempertahankan ungkapan sumber tanpa secara berlebihan memperjelasnya menjadi dukungan resmi.
- source_word: Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Ἰουδαῖοι di sini menunjuk kepada kelompok orang Yahudi dalam narasi. Teks tidak membatasi rujukannya hanya kepada para pemimpin, sehingga “orang-orang Yahudi” dipertahankan.
- source_word: ἀποστόλοις
  choice: para rasul
  rationale: ἀπόστολοι merupakan sebutan narator bagi Paulus dan Barnabas dalam pasal ini, sebagaimana ditegaskan dalam Kisah Para Rasul 14:14. Istilah baku “para rasul” akurat dan mudah dipahami.
theological_decisions:
- issue: Rujukan sebutan “para rasul”
  choice: Mempertahankan “para rasul” sebagai sebutan narator bagi Paulus dan Barnabas.
  alternative: Menerjemahkannya secara lebih umum sebagai “para utusan”.
  rationale: Lukas secara eksplisit menyebut Barnabas dan Paulus sebagai οἱ ἀπόστολοι dalam Kisah Para Rasul 14:14. Terjemahan langsung mempertahankan pilihan kata narator tanpa memasukkan batasan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dibuat ringkas; “bersama” dipilih untuk mempertahankan keluasan makna relasional σύν, sedangkan tanda titik dua memperjelas bahwa klausa berikutnya menguraikan pembagian tersebut.
