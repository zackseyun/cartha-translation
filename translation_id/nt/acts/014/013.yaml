id: ACT.14.13
reference: Acts 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: id
  text: Lalu imam Zeus, yang kuilnya berada di luar kota,[a] membawa lembu-lembu jantan dan karangan-karangan bunga ke gerbang-gerbang. Bersama orang banyak, ia hendak mempersembahkan kurban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Zeus yang berada di depan kota”; kemungkinan besar yang dimaksud ialah Zeus yang kuil atau tempat sucinya berada di luar kota.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: Lalu
  rationale: Ungkapan ini melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia dan menunjukkan kelanjutan peristiwa tanpa memberi tekanan berlebihan.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: imam Zeus
  rationale: “Zeus” mempertahankan nama dewa Yunani dalam teks sumber, bukan padanan Romawinya, Yupiter.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: yang kuilnya berada di luar kota
  rationale: Secara harfiah frasa ini menerangkan Zeus sebagai yang berada “di depan kota”; dalam konteks kultis, maksud yang paling mungkin ialah kuil atau tempat sucinya terletak di depan atau di luar batas kota. Kata “kuil” dibuat eksplisit agar dapat dipahami dalam bahasa Indonesia.
- source_word: ταύρους
  choice: lembu-lembu jantan
  rationale: ταῦρος menunjuk pada lembu jantan; pilihan ini jelas dan alami dalam konteks persembahan kurban.
- source_word: στέμματα
  choice: karangan-karangan bunga
  rationale: Dalam arak-arakan kurban, kata ini menunjuk pada rangkaian atau lingkaran hiasan, lazimnya dari bunga atau dedaunan. “Karangan bunga” mudah dipahami pembaca Indonesia.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: ke gerbang-gerbang
  rationale: Preposisi dengan konteks gerak mendukung “ke”, sedangkan bentuk jamak πυλῶνας dipertahankan.
- source_word: ἐνέγκας
  choice: membawa
  rationale: Partisip aoris ini memberi tindakan latar yang berkaitan erat dengan maksud mempersembahkan kurban; konstruksi verba biasa lebih alami dalam bahasa Indonesia.
- source_word: σὺν τοῖς ὄχλοις
  choice: Bersama orang banyak
  rationale: Frasa ini menunjukkan bahwa imam bertindak bersama kumpulan orang. “Orang banyak” merupakan ungkapan Indonesia yang alami walaupun nomina Yunani berbentuk jamak.
- source_word: ἤθελεν θύειν
  choice: hendak mempersembahkan kurban
  rationale: θέλω dengan infinitif menyatakan kehendak atau niat, sementara θύω dalam konteks ibadah berarti mempersembahkan kurban, bukan sekadar menyembelih.
theological_decisions:
- issue: Rujukan tersirat dalam τοῦ ὄντος πρὸ τῆς πόλεως
  choice: Frasa diterjemahkan sebagai “yang kuilnya berada di luar kota,” dengan “kuil” dibuat eksplisit.
  alternative: “Zeus yang berada di depan kota” atau “yang tempat sucinya berada di luar kota.”
  rationale: Secara gramatikal frasa tersebut menerangkan Zeus, tetapi konteks historis-kultis kemungkinan besar menunjuk pada lokasi kuil atau tempat sucinya. Terjemahan utama menyampaikan makna yang paling mungkin, sedangkan catatan kaki mempertahankan bentuk harfiah dan ketidakpastiannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kurban” dipakai untuk persembahan ritual, “imam” untuk pejabat kultis, dan pengulangan jamak dipertahankan pada benda-benda yang secara eksplisit berbentuk jamak dalam bahasa Yunani.
