  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: id
  text: Pada generasi-generasi yang lampau, Dia membiarkan semua bangsa menempuh jalan mereka masing-masing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengizinkan semua orang bukan Yahudi menjalani jalan hidup mereka sendiri.”
    reason: Alternatif ini mencerminkan kemungkinan arti ἔθνη sebagai “orang-orang bukan Yahudi” dan mengungkapkan makna metaforis “jalan” sebagai cara hidup.
lexical_decisions:
- source_word: ὃς
  choice: Dia
  rationale: Kata ganti relatif ini secara harfiah berarti “yang,” tetapi dalam bahasa Indonesia klausa ini lebih alami diteruskan sebagai kalimat utama dengan “Dia”; acuannya ialah Allah dalam ayat sebelumnya.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Pada generasi-generasi yang lampau
  rationale: Ungkapan ini menunjuk pada angkatan-angkatan yang telah berlalu. Bentuk jamak dipertahankan, dan “yang lampau” terdengar wajar serta bermartabat dalam bahasa Indonesia modern.
- source_word: εἴασεν
  choice: membiarkan
  rationale: Kata ini menyatakan izin atau tidak dicegah, bukan persetujuan moral. “Membiarkan” alami dalam konteks ini dan mempertahankan ketegangan antara kedaulatan Allah dan tindakan bangsa-bangsa.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang-orang bukan Yahudi. “Semua bangsa” mempertahankan cakupan kolektif yang luas tanpa mempersempitnya menjadi kontras Yahudi-bukan Yahudi.
- source_word: πορεύεσθαι
  choice: menempuh
  rationale: Secara dasar berarti pergi atau berjalan. Bersama “jalan,” kata “menempuh” mempertahankan metafora perjalanan sekaligus menyampaikan arah atau pola hidup secara alami.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: jalan mereka masing-masing
  rationale: “Jalan” mempertahankan metafora ὁδοῖς bagi arah hidup atau perilaku. “Mereka masing-masing” menyampaikan kepemilikan dan keragaman jalan bangsa-bangsa tanpa menambahkan penilaian yang tidak dinyatakan.
theological_decisions:
- issue: Izin ilahi versus persetujuan ilahi
  choice: Allah membiarkan bangsa-bangsa menempuh jalan mereka masing-masing.
  alternative: Allah menyetujui atau secara kausal menentukan jalan bangsa-bangsa.
  rationale: εἴασεν menyatakan membiarkan atau mengizinkan. Terjemahan tidak boleh mengubah izin ilahi menjadi persetujuan moral ataupun determinasi kausal, sehingga ketegangan antara kedaulatan Allah dan tanggung jawab manusia tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menempuh jalan” mempertahankan citra sumber Yunani tanpa terdengar kaku; “generasi-generasi” mempertahankan bentuk jamak sumber.
