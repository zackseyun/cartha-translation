  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: id
  text: Setelah menetapkan para penatua bagi mereka di setiap jemaat[a] dan berdoa sambil berpuasa, Paulus dan Barnabas memercayakan mereka kepada Tuhan, yang kepada-Nya mereka telah percaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memilih para penatua bagi mereka di setiap jemaat.” Kata Yunani ini dalam beberapa konteks dapat berarti memilih dengan pengangkatan tangan, tetapi di sini mungkin hanya berarti menetapkan.
    reason: alternative_reading
  - marker: b
    text: Kata “mereka” dapat menunjuk kepada seluruh orang percaya atau, mungkin, secara khusus kepada para penatua yang baru ditetapkan.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: setelah menetapkan
  rationale: Dalam konteks ini verba tersebut menyatakan tindakan memilih atau mengangkat orang untuk suatu tanggung jawab. “Menetapkan” menyampaikan tindakan itu tanpa menentukan mekanisme tata gereja tertentu.
- source_word: κατ’ ἐκκλησίαν
  choice: di setiap jemaat
  rationale: Kata κατά dengan nomina tunggal dipakai secara distributif, yakni pada masing-masing jemaat setempat.
- source_word: πρεσβυτέρους
  choice: para penatua
  rationale: Dalam konteks jemaat, istilah ini menunjuk kepada para pemimpin yang diakui, bukan sekadar laki-laki yang lebih tua.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: berdoa dengan berpuasa
  rationale: Ungkapan ini mempertahankan doa dan puasa sebagai tindakan yang menyertai penyerahan tersebut serta terdengar alami dalam bahasa Indonesia.
- source_word: παρέθεντο
  choice: menyerahkan
  rationale: Bentuk medial ini berarti memercayakan orang-orang ke dalam pemeliharaan pihak lain; “menyerahkan ... kepada Tuhan” alami dan mempertahankan nuansa relasionalnya.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Bentuk datif menandai pihak yang kepadanya mereka dipercayakan.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: yang kepada-Nya mereka telah percaya
  rationale: Frasa ini menyatakan iman yang telah diarahkan kepada Tuhan sebelum tindakan utama. Bentuk “telah percaya” mencerminkan aspek keadaan yang sudah berlangsung dari bentuk pluperfek.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: bagi mereka ... mereka
  rationale: Pronomina dipertahankan agar ambiguitas rujukan objek kedua tidak diselesaikan secara berlebihan; konteks paling mungkin menunjuk kepada orang-orang percaya secara keseluruhan.
theological_decisions:
- issue: Makna χειροτονήσαντες dalam kaitannya dengan tata gereja
  choice: menetapkan para penatua
  alternative: memilih para penatua, termasuk kemungkinan melalui pengangkatan tangan
  rationale: Kata Yunani ini dapat memiliki hubungan historis dengan pemilihan melalui pengangkatan tangan, tetapi ayat ini tidak menjelaskan prosedurnya. “Menetapkan” tidak memasukkan pola denominasi tertentu.
- issue: Rujukan αὐτοὺς dalam παρέθεντο αὐτοὺς τῷ κυρίῳ
  choice: mempertahankan pronomina “mereka,” dengan orang-orang percaya sebagai rujukan yang paling mungkin
  alternative: para penatua yang baru ditetapkan
  rationale: Konteks luas membicarakan para murid dan jemaat, tetapi secara gramatikal para penatua juga merupakan kemungkinan rujukan yang dekat. Catatan kaki mempertahankan ketegangan ini.
- issue: Subjek tersirat dari verba jamak
  choice: Paulus dan Barnabas
  alternative: mereka
  rationale: Bahasa Indonesia lebih jelas dengan subjek yang disebutkan kembali dari konteks sebelumnya. Penyebutan nama tidak mengubah identitas pelaku yang tersirat dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Jemaat” dipilih untuk ἐκκλησία dalam arti komunitas setempat, sedangkan “penatua” mempertahankan istilah kepemimpinan gerejawi yang luas dan tidak denominatif. Nama Paulus dan Barnabas dinyatakan untuk menghindari subjek nol yang terasa kurang jelas dalam kalimat Indonesia mandiri.
