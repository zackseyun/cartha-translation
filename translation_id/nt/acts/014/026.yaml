revisions:
- from: Dari sana mereka berlayar ke Antiokhia, tempat mereka dahulu telah diserahkan kepada anugerah Allah untuk pekerjaan yang kini telah mereka selesaikan.[a]
  to: Dari sana mereka berlayar ke Antiokhia. Dari kota itulah mereka dahulu telah dipercayakan kepada anugerah Allah untuk pekerjaan yang telah mereka selesaikan.
  rationale: 'Revisi menghapus tambahan temporal yang tidak ada dalam sumber, menyatakan secara eksplisit unsur “dari” pada ὅθεν, dan memakai padanan Indonesia yang lebih alami untuk παραδεδομένοι. Pemisahan menjadi dua kalimat tidak mengubah hubungan sintaksis atau makna: Antiokhia tetap merupakan kota tujuan pelayaran sekaligus kota dari mana Paulus dan Barnabas sebelumnya dipercayakan kepada anugerah Allah untuk pekerjaan tersebut. Catatan kaki tidak diperlukan karena terjemahan revisi sudah menyatakan makna leksikal yang relevan secara langsung.'
