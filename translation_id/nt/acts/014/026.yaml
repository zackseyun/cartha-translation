review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “kini” menambahkan penanda waktu yang tidak dinyatakan dalam teks Yunani. Selain itu, ὅθεν secara khusus menunjuk asal (“dari tempat/kota itu”), yang lebih jelas dipertahankan dalam kalimat tersendiri. “Dipercayakan kepada anugerah Allah” menyampaikan παραδεδομένοι secara idiomatis tanpa mengubah relasi pasif kepada anugerah Allah.
  naturalness: Kalimat draf dengan “tempat mereka dahulu telah diserahkan” terasa kurang idiomatis dalam bahasa Indonesia modern. Memisahkan keterangan asal menjadi “Dari kota itulah ...” menghasilkan alur yang jelas dan alami.
  terminology: “Antiokhia,” “anugerah Allah,” dan “pekerjaan” sesuai dengan register baku dan mempertahankan istilah penting. “Dipercayakan” lebih wajar daripada “diserahkan” untuk tindakan menempatkan seseorang ke dalam pemeliharaan anugerah Allah, tanpa memaksakan pengertian penugasan gerejawi tertentu.
  issues:
  - severity: medium
    issue: Penambahan “kini”
    rationale: Kata νῦν atau penanda waktu setara tidak ada dalam teks sumber. Kontras antara tindakan terdahulu dan pekerjaan yang selesai dapat dipahami dari bentuk-bentuk verba tanpa menambah “kini”.
  - severity: medium
    issue: Makna asal dalam ὅθεν kurang tegas dan susunan klausa kurang alami
    rationale: Ὅθεν berarti “dari tempat itu/dari mana.” Ungkapan “tempat mereka dahulu telah ...” tidak menandai asal secara eksplisit dan kurang lancar. “Dari kota itulah” mempertahankan rujukan kepada Antiokhia dan arah asal tersebut.
  - severity: low
    issue: “Diserahkan kepada anugerah Allah” kurang idiomatis
    rationale: Walaupun dapat dipahami, “dipercayakan kepada anugerah Allah” lebih alami untuk παραδίδωμι dalam konteks ini serta tetap mempertahankan tindakan pasif dan ketergantungan pada anugerah Allah.
  revised_text: Dari sana mereka berlayar ke Antiokhia. Dari kota itulah mereka dahulu telah dipercayakan kepada anugerah Allah untuk pekerjaan yang telah mereka selesaikan.
  revised_footnotes: []
  revision_rationale: 'Revisi menghapus tambahan temporal yang tidak ada dalam sumber, menyatakan secara eksplisit unsur “dari” pada ὅθεν, dan memakai padanan Indonesia yang lebih alami untuk παραδεδομένοι. Pemisahan menjadi dua kalimat tidak mengubah hubungan sintaksis atau makna: Antiokhia tetap merupakan kota tujuan pelayaran sekaligus kota dari mana Paulus dan Barnabas sebelumnya dipercayakan kepada anugerah Allah untuk pekerjaan tersebut. Catatan kaki tidak diperlukan karena terjemahan revisi sudah menyatakan makna leksikal yang relevan secara langsung.'
