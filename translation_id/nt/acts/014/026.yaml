id: ACT.14.26
reference: Acts 14:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: id
  text: Dari sana mereka berlayar ke Antiokhia. Dari kota itulah mereka dahulu telah dipercayakan kepada anugerah Allah untuk pekerjaan yang telah mereka selesaikan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Dari sana
  rationale: Ungkapan ini menyampaikan hubungan dengan perjalanan sebelumnya serta titik keberangkatan secara alami dalam bahasa Indonesia; unsur penghubung καί tidak perlu dinyatakan tersendiri.
- source_word: ἀπέπλευσαν
  choice: mereka berlayar
  rationale: Kata kerja ini menyatakan keberangkatan melalui laut. Dalam konteks gerak dari satu tempat ke tempat lain, 'berlayar' sudah menyampaikan maknanya secara wajar tanpa tambahan yang kaku.
- source_word: εἰς Ἀντιόχειαν
  choice: ke Antiokhia
  rationale: Preposisi εἰς bersama verba gerak paling alami diterjemahkan 'ke'; nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: ὅθεν
  choice: tempat ... dahulu
  rationale: ὅθεν secara harfiah berarti 'dari tempat itu'. Susunan 'tempat mereka dahulu...' mengungkapkan bahwa Antiokhia adalah lokasi tindakan sebelumnya, sedangkan catatan kaki mempertahankan unsur asal secara lebih eksplisit.
- source_word: ἦσαν παραδεδομένοι
  choice: mereka dahulu telah diserahkan
  rationale: Bentuk perfektum perifrastik menyatakan tindakan yang telah berlangsung sebelum kepulangan ini. 'Diserahkan' mempertahankan gambaran menyerahkan mereka ke dalam pemeliharaan anugerah Allah tanpa menentukan suatu tata commissioning gerejawi.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: kepada anugerah Allah
  rationale: Dativus menunjukkan kepada apa mereka diserahkan. 'Anugerah Allah' mempertahankan bobot teologis ungkapan Yunani secara ringkas dan lazim.
- source_word: εἰς τὸ ἔργον
  choice: untuk pekerjaan
  rationale: Terjemahan ini mempertahankan arti umum ἔργον dan tidak mempersempitnya menjadi istilah yang lebih interpretatif seperti 'misi'.
- source_word: ὃ ἐπλήρωσαν
  choice: yang kini telah mereka selesaikan
  rationale: Dalam konteks ini πληρόω berarti membawa pekerjaan sampai tuntas. 'Kini' memperjelas kontras temporal yang tersirat antara penyerahan sebelumnya dan pekerjaan yang telah selesai, tanpa mengubah isi proposisi.
theological_decisions:
- issue: Sifat tindakan terdahulu terhadap Paulus dan Barnabas di Antiokhia
  choice: diserahkan kepada anugerah Allah
  alternative: dipercayakan kepada anugerah Allah
  rationale: '''Diserahkan'' paling langsung mempertahankan metafora παραδίδωμι, yakni menempatkan mereka dalam pemeliharaan anugerah Allah, tanpa memasukkan konsep denominasi tertentu mengenai pengutusan atau penahbisan.'
- issue: Makna penyelesaian pekerjaan
  choice: pekerjaan yang kini telah mereka selesaikan
  alternative: pekerjaan yang telah mereka genapi
  rationale: Dalam konteks rangkuman perjalanan, πληρόω menunjuk pada pekerjaan yang dituntaskan. 'Selesaikan' alami dan tidak menambahkan gagasan pemenuhan nubuat yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan perjalanan, tindakan pasif sebelumnya, dan peranan anugerah Allah.
