  text: κἀκεῖ ⸂εὐαγγελιζόμενοι ἦσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/007.yaml
  text: And there they were preaching the good news[a].
translation:
  language: id
  text: Dan di sana mereka terus memberitakan kabar baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di sana juga mereka terus memberitakan Injil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: Di sana juga
  rationale: κἀκεῖ merupakan gabungan καί dan ἐκεῖ, sehingga dapat berarti ‘dan di sana’ atau ‘di sana juga’. Dalam konteks perpindahan tempat pada ayat sebelumnya, ‘Di sana juga’ alami dalam bahasa Indonesia dan tetap mempertahankan unsur tambahan dari καί.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik
  rationale: Partisipel εὐαγγελίζομαι berarti menyampaikan atau memberitakan kabar baik, khususnya Injil. Ungkapan ini jelas bagi pembaca modern dan mempertahankan arti verbalnya tanpa bergantung pada istilah gerejawi.
- source_word: ἦσαν
  choice: terus
  rationale: Bersama partisipel εὐαγγελιζόμενοι, bentuk imperfek ἦσαν membentuk konstruksi perifrastis yang menunjukkan tindakan yang sedang atau terus berlangsung pada masa lampau. Dalam bahasa Indonesia, aspek berkelanjutan itu dinyatakan secara alami dengan ‘terus’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kabar baik’ dipakai dalam teks utama karena langsung mencerminkan makna εὐαγγελίζομαι; ‘Injil’ dicantumkan sebagai alternatif yang lazim. Penanda aspek ‘terus’ mempertahankan nuansa tindakan berkelanjutan dari konstruksi perifrastis imperfek.
