  source_fidelity: 'Terjemahan dengan setia mencerminkan dua partisip aoris yang mendahului verba utama: mereka terlebih dahulu memberitakan kabar baik di Derbe dan menjadikan banyak orang murid, lalu kembali. "Kabar baik" menyampaikan εὐαγγελίζω, "menjadikan banyak orang murid" mempertahankan daya kausatif μαθητεύω, dan urutan Listra–Ikonium–Antiokhia dipertahankan. Penghilangan pengulangan "ke" dalam daftar tujuan bersifat idiomatis dalam bahasa Indonesia dan tidak mengubah makna εἰς yang berulang.'
