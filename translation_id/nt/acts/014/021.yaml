id: ACT.14.21
reference: Acts 14:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: id
  text: Setelah memberitakan kabar baik di kota itu dan menjadikan banyak orang murid, mereka kembali ke Listra, Ikonium, dan Antiokhia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: setelah memberitakan kabar baik
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna pemberitaan kabar baik tanpa memakai istilah yang terlalu teknis.
- source_word: τε
  choice: dan
  rationale: Partikel ini menghubungkan klausa partisipial dengan alur sebelumnya dan unsur berikutnya; 'dan' mempertahankan hubungan itu secara alami.
- source_word: τὴν πόλιν ἐκείνην
  choice: di kota itu
  rationale: Frasa demonstratif ini menunjuk kembali kepada Derbe dalam konteks. Preposisi 'di' diperlukan secara idiomatis dengan verba 'memberitakan' dalam bahasa Indonesia.
- source_word: μαθητεύσαντες
  choice: menjadikan ... murid
  rationale: Verba ini berarti menyebabkan orang menjadi murid. Pilihan ini mempertahankan daya aktif dan formatifnya.
- source_word: ἱκανοὺς
  choice: banyak orang
  rationale: Dalam konteks ini kata tersebut menunjuk pada jumlah yang cukup besar; 'banyak orang' jelas dan alami sebagai objek personal dari 'menjadikan ... murid'.
- source_word: ὑπέστρεψαν
  choice: mereka kembali
  rationale: Verba utama aoris ini menyatakan perjalanan pulang atau kembali ke tempat-tempat yang sebelumnya dikunjungi.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: ke Listra, Ikonium, dan Antiokhia
  rationale: εἰς menyatakan tujuan. Dalam daftar perjalanan bahasa Indonesia, satu 'ke' yang berlaku bagi seluruh rangkaian lebih alami tanpa mengubah urutan geografis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Kabar baik' dipilih agar mudah dipahami, sedangkan 'menjadikan banyak orang murid' mempertahankan makna μαθητεύω tanpa jargon gerejawi.
