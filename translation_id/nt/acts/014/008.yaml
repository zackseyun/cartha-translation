  verdict: revise
  source_fidelity: 'Draf secara umum setia pada struktur dan makna Yunani: tokoh itu berada di Listra, sedang duduk, memiliki ketidakberdayaan pada kakinya, lumpuh sejak dalam kandungan ibunya, dan tidak pernah berjalan. Namun, “kedua kakinya tidak berdaya” mengalihkan ketidakberdayaan dari orang itu kepada kakinya dan terdengar kurang idiomatis dalam bahasa Indonesia.'
  naturalness: “Sejak dari kandungan” redundan dalam bahasa Indonesia baku; “sejak dalam kandungan ibunya” lebih alami. Susunan revisi mempertahankan uraian bertahap tanpa membuat subjek “kaki” seolah-olah memiliki daya.
  terminology: “Lumpuh” adalah padanan modern yang wajar untuk χωλός dalam konteks ini. Frasa “tidak berdaya pada kakinya” mempertahankan unsur ἀδύνατος tanpa meleburkannya sepenuhnya ke dalam “lumpuh.”
