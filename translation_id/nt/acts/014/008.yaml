  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: id
  text: Di Listra ada seorang laki-laki yang duduk, tidak berdaya pada kakinya; ia lumpuh sejak dalam kandungan ibunya dan belum pernah berjalan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: Di Listra ada
  rationale: Kata penghubung naratif Καί tidak perlu diterjemahkan secara mekanis sebagai “Dan” dalam bahasa Indonesia; pembukaan lokatif ini tetap menghubungkan adegan secara alami dengan konteks sebelumnya.
- source_word: τις ἀνὴρ
  choice: seorang laki-laki
  rationale: Menyatakan seorang tokoh tertentu tetapi tidak bernama secara wajar dalam bahasa Indonesia; “seorang laki-laki tertentu” terasa kaku dan tidak diperlukan.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: kedua kakinya tidak berdaya
  rationale: Mempertahankan gagasan dasar tentang ketiadaan daya atau kekuatan dan tidak meleburkannya dengan χωλός, yang kemudian secara eksplisit menyebut kelumpuhannya.
- source_word: ἐν Λύστροις
  choice: Di Listra
  rationale: Menggunakan bentuk baku nama tempat dalam bahasa Indonesia.
- source_word: ἐκάθητο
  choice: yang duduk
  rationale: Dalam konstruksi eksistensial bahasa Indonesia, bentuk ini secara alami menggambarkan keadaan yang sedang berlangsung tanpa menambahkan kata “di sana” yang tidak terdapat dalam teks Yunani.
- source_word: χωλὸς
  choice: lumpuh
  rationale: Dalam konteks seseorang yang tidak pernah dapat berjalan, “lumpuh” merupakan ungkapan Indonesia yang jelas, netral, dan alami.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: sejak dari kandungan ibunya
  rationale: Mempertahankan gambaran konkret idiom Yunani, bukan meratakannya menjadi sekadar “sejak lahir”.
- source_word: οὐδέποτε περιεπάτησεν
  choice: belum pernah berjalan
  rationale: “Belum pernah” secara alami menyatakan bahwa sampai saat adegan itu ia tidak pernah berjalan, selaras dengan sudut pandang narasi lampau.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua klausa “kedua kakinya tidak berdaya” dan “Ia lumpuh” sengaja dipertahankan agar uraian berlapis Lukas tidak disederhanakan.
