  verdict: revise
  source_fidelity: Teks Yunani menyatakan bahwa Barnabas dan Paulus, yang disebut para rasul, setelah mendengar, mengoyakkan pakaian mereka lalu bergerak dengan mendadak masuk ke kerumunan sambil berseru. Draf pada dasarnya setia, tetapi “menerjang” dapat menyiratkan serangan atau tindakan menubruk yang tidak dituntut oleh ἐξεπήδησαν.
  naturalness: “Rasul-rasul Barnabas dan Paulus” kurang alami dalam bahasa Indonesia modern. Aposisi dengan “para rasul, Barnabas dan Paulus,” lebih jelas dan baku. “Bergegas masuk” menyampaikan gerakan cepat tanpa konotasi agresif dari “menerjang.”
  terminology: “Para rasul” mempertahankan ἀπόστολοι tanpa membatasi maknanya secara teologis. “Mengoyakkan pakaian” dan “orang banyak” sesuai register naratif Alkitab Indonesia modern.
