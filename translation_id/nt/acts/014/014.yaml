source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: id
  text: Namun, ketika para rasul, Barnabas dan Paulus, mendengar hal itu, mereka mengoyakkan pakaian mereka[a], lalu bergegas masuk[b] ke tengah orang banyak sambil berseru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mengoyakkan pakaian merupakan tanda dukacita, kengerian, atau protes, termasuk terhadap penghormatan yang menghujat Allah.
    reason: cultural_note
  - marker: b
    text: Atau “melompat masuk”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ketika ... mendengar hal itu
  rationale: Partisip aoristus berfungsi temporal dan menunjuk pada tindakan yang baru diceritakan; “hal itu” membuat objek tersiratnya alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang berkontras dari upaya orang banyak mempersembahkan kurban kepada tanggapan para rasul.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: rasul-rasul Barnabas dan Paulus
  rationale: Mempertahankan aposisi Yunani yang secara langsung menyebut Barnabas dan Paulus sebagai para rasul, tanpa mempersempit arti istilah tersebut.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: mereka mengoyakkan pakaian mereka
  rationale: Menyampaikan tindakan merobek pakaian sebagai ungkapan keterkejutan, dukacita, atau protes; “mengoyakkan” sesuai dengan register Alkitab yang tetap mudah dipahami.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: menerjang ke tengah orang banyak
  rationale: Kata kerja menyatakan gerakan mendadak dan kuat, sedangkan εἰς menunjukkan gerakan masuk ke dalam kerumunan. Pilihan ini tidak menambahkan gagasan “keluar” yang tidak dinyatakan secara eksplisit.
- source_word: κράζοντες
  choice: sambil berseru-seru
  rationale: Partisip kini menunjukkan tindakan keras dan berkelanjutan yang menyertai gerakan mereka.
theological_decisions:
- issue: Sebutan “rasul-rasul” bagi Barnabas dan Paulus
  choice: Mempertahankan “rasul-rasul Barnabas dan Paulus” dalam teks utama.
  alternative: Menafsirkan istilah itu secara khusus sebagai “utusan-utusan” atau membatasinya pada kelompok tertentu.
  rationale: Aposisi Yunani secara langsung mengidentifikasi Barnabas dan Paulus sebagai οἱ ἀπόστολοι dalam konteks ini. Terjemahan tidak sepatutnya menyelesaikan perdebatan teologis tentang cakupan kerasulan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nuansa bermartabat. “Orang banyak” mempertahankan diksi naratif Alkitab yang umum, sedangkan “menerjang” menyampaikan gerakan mendadak dan kuat tanpa menyisipkan arah keluar yang tidak eksplisit dalam teks Yunani.
