    issue: “Menerjang ke tengah orang banyak” berkonotasi agresif.
    rationale: ἐξεπήδησαν menandakan gerakan mendadak/cepat masuk ke kerumunan, bukan tindakan menyerang atau menabrak orang banyak.
  - severity: low
    issue: Aposisi “rasul-rasul Barnabas dan Paulus” tidak idiomatis.
    rationale: Bahasa Indonesia baku lebih alami memakai “para rasul, Barnabas dan Paulus,” sambil tetap mempertahankan identifikasi langsung dalam teks sumber.
  - severity: low
