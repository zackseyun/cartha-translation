id: ACT.14.1
reference: Acts 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: id
  text: Di Ikonium, mereka masuk bersama-sama[b] ke sinagoge orang Yahudi[a] dan berbicara sedemikian rupa sehingga sejumlah besar orang, baik orang Yahudi maupun orang Yunani, percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke sinagoge Yahudi.” Secara harfiah, teks Yunani berbunyi “ke sinagoge orang-orang Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani yang diterjemahkan “bersama-sama” juga dapat dipahami sebagai “dengan cara yang sama.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (tidak diterjemahkan secara tersendiri)
  rationale: Ungkapan ini berfungsi sebagai pengantar naratif. Dalam bahasa Indonesia, peralihan tersebut sudah mengalir wajar tanpa tambahan seperti “kemudian” atau “terjadilah”, yang dapat memberi nuansa waktu atau penekanan yang tidak eksplisit.
- source_word: ἐν Ἰκονίῳ
  choice: Di Ikonium
  rationale: Frasa lokatif diterjemahkan langsung, dengan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: κατὰ τὸ αὐτό
  choice: bersama-sama
  rationale: Dalam susunan ini, ungkapan tersebut paling wajar dipahami sebagai tindakan bersama kedua tokoh. Kemungkinan makna “dengan cara yang sama” dipertahankan dalam catatan kaki.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: mereka masuk
  rationale: Infinitif yang bergantung pada konstruksi naratif Yunani diubah menjadi verba finit agar alami dalam bahasa Indonesia, tanpa menambahkan identitas yang tidak disebutkan dalam ayat ini.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: ke sinagoge orang Yahudi
  rationale: Genitif τῶν Ἰουδαίων dipertahankan secara eksplisit. Bentuk “sinagoge Yahudi” juga mungkin dan dicatat sebagai alternatif.
- source_word: λαλῆσαι
  choice: berbicara
  rationale: Pilihan ini langsung dan tidak menambahkan objek atau isi pemberitaan yang tidak dinyatakan dalam ayat.
- source_word: οὕτως ὥστε
  choice: sedemikian rupa sehingga
  rationale: Terjemahan ini mempertahankan unsur cara sekaligus hasil yang terdapat dalam gabungan οὕτως ὥστε.
- source_word: πιστεῦσαι
  choice: percaya
  rationale: Verba ini melaporkan tanggapan orang banyak terhadap pemberitaan tanpa menjelaskan objek kepercayaan yang tidak dinyatakan secara eksplisit.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: orang Yahudi maupun orang Yunani
  rationale: Pasangan τε καὶ mencakup kedua kelompok secara seimbang; “maupun” menghasilkan susunan Indonesia yang ringkas dan alami.
- source_word: πολὺ πλῆθος
  choice: sejumlah besar
  rationale: Ungkapan ini menyampaikan banyaknya orang secara alami dalam bahasa Indonesia tanpa memakai “kumpulan besar” yang terasa kaku.
theological_decisions:
- issue: Makna πιστεῦσαι dalam konteks tanggapan terhadap pemberitaan
  choice: percaya
  alternative: menjadi percaya; beriman; percaya kepada berita itu
  rationale: “Percaya” mempertahankan bentuk dasar kelompok kata πιστ- dan tidak memasukkan objek atau rumusan pertobatan yang tidak disebutkan secara eksplisit dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dijaga alami bagi pembaca umum, sambil mempertahankan bentuk eksplisit “sinagoge orang Yahudi” serta mencatat ambiguitas sintaksis yang nyata.
