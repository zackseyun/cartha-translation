id: ACT.14.10
reference: Acts 14:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: id
  text: Ia berkata dengan suara lantang, “Berdirilah tegak di atas kakimu!” Lalu orang itu melompat dan mulai berjalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melompat dan terus berjalan.” Bentuk kata kerja terakhir dapat menekankan tindakan yang sedang berlangsung atau awal tindakan berjalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: dengan suara lantang
  rationale: Frasa datif ini menyatakan cara berbicara; ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan kesan suara yang keras serta tegas.
- source_word: Ἀνάστηθι
  choice: Berdirilah
  rationale: Imperatif aoris ini memerintahkan orang tersebut untuk bangkit ke posisi berdiri; pilihan ini sesuai dengan frasa yang langsung mengikutinya.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: di atas kakimu
  rationale: Terjemahan ini mempertahankan gambaran konkret dari ungkapan Yunani, yaitu berdiri dengan bertumpu pada kedua kaki.
- source_word: ὀρθός
  choice: tegak
  rationale: Kata ini menerangkan postur yang lurus atau tegak dan secara alami dipadukan dengan 'berdirilah'.
- source_word: ἥλατο
  choice: melompat
  rationale: Bentuk dari ἅλλομαι menggambarkan gerakan melompat yang tiba-tiba; konteks sudah membuat gerakan bangkitnya jelas tanpa harus menambahkan 'berdiri'.
- source_word: περιεπάτει
  choice: mulai berjalan
  rationale: Imperfek dapat dipahami secara inkoatif, yakni dimulainya tindakan berjalan, meskipun makna duratif 'terus berjalan' juga mungkin.
theological_decisions:
- issue: Bahasa mukjizat dan perintah mengenai postur
  choice: Menerjemahkan perintah dan tanggapan sebagai tindakan fisik yang langsung dan nyata tanpa penjelasan tambahan.
  alternative: Menambahkan keterangan teologis tentang sumber atau sifat penyembuhan.
  rationale: Teks Yunani sendiri menyajikan perintah langsung yang segera diikuti respons jasmani; terjemahan mempertahankan hal itu tanpa memasukkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Suara lantang' dipilih daripada ungkapan yang lebih harfiah tetapi kurang alami seperti 'suara besar'. Tanda seru mencerminkan daya perintah dalam adegan tanpa menambah isi.
