  source_fidelity: Sangat setia pada teks Yunani. “Dengan suara lantang” menerjemahkan μεγάλῃ φωνῇ secara idiomatis; “Berdirilah tegak di atas kakimu” mencakup imperatif Ἀνάστηθι, frasa ἐπὶ τοὺς πόδας σου, dan ὀρθός. “Melompat dan mulai berjalan” mempertahankan urutan δράση ἥλατο καὶ περιεπάτει serta memahami imperfek terakhir secara inkoatif, suatu pilihan yang sah.
  naturalness: Bahasa Indonesia baku, jelas, dan wajar untuk narasi Alkitab modern. “Suara lantang,” “berdirilah tegak,” dan “mulai berjalan” memiliki register yang sesuai. Penyebutan “orang itu” setelah kutipan membuat rujukan subjek jelas tanpa menambah makna substantif.
  terminology: Istilah dan gaya konsisten dengan bahasa Indonesia modern. Terjemahan tidak menambah penafsiran teologis atas mukjizat dan mempertahankan sifat langsung dari perintah serta responsnya.
