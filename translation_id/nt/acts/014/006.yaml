  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: id
  text: Setelah menyadari hal itu[a], mereka melarikan diri ke kota-kota di Likaonia—Listra dan Derbe—serta ke daerah sekitarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setelah mengetahui hal itu” atau “Setelah memahami keadaan itu.” Partisip Yunani ini menunjukkan bahwa mereka menjadi sadar akan bahaya yang disebut dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Setelah menyadari hal itu
  rationale: Partisip aoris συνοράω menyatakan bahwa mereka menjadi sadar atau memahami bahaya yang disebut dalam ayat sebelumnya. Objek “hal itu” dipasok secara wajar dari konteks.
- source_word: κατέφυγον
  choice: mereka melarikan diri
  rationale: καταφεύγω dapat berarti lari untuk mencari perlindungan. Dalam konteks ancaman ini, “melarikan diri” menyampaikan tindakan meninggalkan tempat dengan segera karena bahaya.
- source_word: εἰς
  choice: ke
  rationale: Dengan verba gerak, εἰς menunjukkan tujuan; “ke” merupakan padanan Indonesia yang alami.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: kota-kota di Likaonia
  rationale: Genitif ini menunjukkan lokasi atau wilayah. “Di Likaonia” lebih alami dalam bahasa Indonesia dan tidak menyiratkan kepemilikan.
- source_word: Λύστραν καὶ Δέρβην
  choice: Listra dan Derbe
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia; keduanya menerangkan kota-kota yang baru disebut.
- source_word: τὴν περίχωρον
  choice: daerah sekitarnya
  rationale: περίχωρος yang dipakai secara substantival menunjuk pada kawasan di sekitar kota-kota tersebut, baik perkotaan maupun pedesaan.
- source_word: καὶ ... καὶ
  choice: —Listra dan Derbe—serta
  rationale: Tanda pisah memperjelas bahwa Listra dan Derbe merupakan aposisi bagi “kota-kota di Likaonia,” sedangkan “serta” menambahkan daerah sekitar sebagai tujuan berikutnya.
