id: ACT.14.25
reference: Acts 14:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: id
  text: Setelah menyampaikan firman di Perga, mereka turun ke Atalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Setelah
  rationale: Hubungan naratif καί dipadukan secara alami dengan partisipel aoris λαλήσαντες; urutan tindakan tetap jelas tanpa perlu membuka kalimat dengan “Dan” yang kaku.
- source_word: λαλήσαντες
  choice: setelah menyampaikan
  rationale: Partisipel aoris menunjukkan tindakan yang mendahului verba utama. “Menyampaikan” terdengar alami untuk pemberitaan pesan, tetapi tidak memperkuat makna menjadi ‘memproklamasikan’ secara berlebihan.
- source_word: τὸν λόγον
  choice: firman
  rationale: Dalam konteks Kisah Para Rasul, ungkapan ini menunjuk pada berita yang diberitakan. “Firman” mempertahankan ungkapan khas Kristen mula-mula dan tidak menambahkan “Tuhan,” yang tidak terdapat dalam teks Yunani.
- source_word: ἐν Πέργῃ
  choice: di Perga
  rationale: ἐν dengan nama kota secara wajar diterjemahkan “di” dalam bahasa Indonesia.
- source_word: κατέβησαν
  choice: mereka turun
  rationale: Terjemahan ini mempertahankan unsur gerak menurun dalam καταβαίνω, kemungkinan dari Perga di pedalaman menuju Atalia di pesisir.
- source_word: εἰς Ἀττάλειαν
  choice: ke Atalia
  rationale: εἰς menandai tujuan perjalanan dan secara idiomatis diterjemahkan “ke.”
