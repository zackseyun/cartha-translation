id: ACT.14.15
reference: Acts 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: id
  text: dan berkata, “Saudara-saudara, mengapa kalian melakukan hal-hal ini? Kami juga manusia seperti kalian. Kami memberitakan kabar baik kepada kalian supaya kalian berbalik dari hal-hal yang sia-sia ini[a] kepada Allah yang hidup, yang menjadikan langit, bumi, laut, dan segala sesuatu yang ada di dalamnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hal-hal yang sia-sia” dalam konteks ini mengacu pada penyembahan kafir yang tidak berguna, termasuk penyembahan berhala.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Saudara-saudara
  rationale: Sapaan vokatif kepada para lelaki dalam kerumunan; dalam bahasa Indonesia modern, 'Saudara-saudara' merupakan sapaan publik yang alami dan bermartabat tanpa menambahkan keterangan etnis yang tidak ada dalam teks.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: manusia biasa seperti kalian
  rationale: Mengungkapkan bahwa Paulus dan Barnabas memiliki kondisi manusiawi yang sama dengan para pendengar dan bukan makhluk ilahi; 'biasa' menyatakan kontras kontekstual tanpa membatasi maknanya pada perasaan.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik
  rationale: Mempertahankan daya verbal partisipel dan makna pengumuman kabar baik dengan ungkapan Indonesia yang jelas serta tidak terlalu sarat jargon gerejawi.
- source_word: ματαίων
  choice: hal-hal yang sia-sia
  rationale: Bentuk Yunani menunjuk secara luas kepada hal-hal yang hampa, tidak berguna, atau tanpa hasil; konteksnya mencakup penyembahan berhala, tetapi teks utama tidak mempersempitnya menjadi 'berhala' saja.
- source_word: ἐπιστρέφειν ἀπὸ ... ἐπὶ
  choice: supaya kalian berbalik dari ... kepada
  rationale: 'Menyampaikan arah perubahan yang dimaksud oleh infinitif: meninggalkan praktik sia-sia dan berpaling kepada Allah yang hidup.'
- source_word: θεὸν ζῶντα
  choice: Allah yang hidup
  rationale: Padanan langsung yang mempertahankan kontras antara Allah yang benar-benar hidup dan objek penyembahan yang tak bernyawa.
- source_word: ἐποίησεν
  choice: menjadikan
  rationale: Secara alami menyatakan tindakan penciptaan Allah dan cocok dengan rumusan penciptaan yang menggemakan bahasa Kitab Suci.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: langit, bumi, laut
  rationale: Rumusan penciptaan yang alami dalam bahasa Indonesia; nomina Indonesia tidak memerlukan artikel, dan rangkaian tetap mencakup ketiga ranah ciptaan.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: segala sesuatu yang ada di dalamnya
  rationale: Padanan Indonesia yang menyeluruh dan alami bagi semua yang berada dalam langit, bumi, dan laut.
theological_decisions:
- issue: Status manusiawi Paulus dan Barnabas berlawanan dengan penghormatan ilahi
  choice: Kami pun manusia biasa seperti kalian
  alternative: Kami pun manusia yang memiliki sifat yang sama seperti kalian
  rationale: Pilihan ini dengan jelas menolak anggapan bahwa para rasul adalah dewa, sambil mempertahankan penekanan pada kesamaan kondisi manusia dan menghindari kesan bahwa yang dimaksud hanya kesamaan emosi.
- issue: Cakupan τῶν ματαίων
  choice: hal-hal yang sia-sia
  alternative: berhala-berhala
  rationale: Konteksnya adalah upaya mempersembahkan kurban dalam penyembahan kafir, tetapi kata Yunani lebih luas daripada istilah khusus untuk berhala. Teks utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan konteksnya.
- issue: Arah panggilan pertobatan
  choice: berbalik dari ... kepada Allah yang hidup
  alternative: bertobat dari ... kepada Allah yang hidup
  rationale: '''Berbalik'' mempertahankan citra gerak dan struktur sumber tanpa memaksakan istilah teologis yang lebih khusus.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lisan yang bermartabat. 'Kalian' dipakai karena tuturan langsung ditujukan kepada kerumunan; 'Saudara-saudara' menjaga bentuk sapaan publik yang alami. Struktur kalimat dibuat jelas bagi pembaca umum sambil mempertahankan kontras teologis dan keluasan istilah Yunani.
