  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: id
  text: Namun, orang-orang Yahudi yang tidak mau percaya[a] menghasut orang-orang bukan Yahudi dan meracuni pikiran mereka[b] terhadap saudara-saudara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak taat.” Kata Yunani ini dapat menunjukkan penolakan untuk memercayai berita yang disampaikan dan dalam konteks ini kemungkinan berarti menolak Injil.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwa mereka”; di sini maksudnya ialah sikap atau keadaan batin mereka.
    reason: lexical_alternative
  - marker: c
    text: “Saudara-saudara” di sini kemungkinan merujuk pada sesama orang percaya secara umum, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: yang tidak mau percaya
  rationale: Dalam konteks pemberitaan Injil di Kisah Para Rasul, kata ini menunjukkan penolakan untuk memercayai berita yang disampaikan, sekaligus mempertahankan unsur kesengajaan dalam penolakan itu.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Merujuk pada kelompok orang Yahudi setempat yang menentang pemberitaan, bukan seluruh orang Yahudi secara umum.
- source_word: ἐπήγειραν
  choice: menghasut
  rationale: Menyampaikan tindakan membangkitkan sikap permusuhan secara kausatif dan alami dalam bahasa Indonesia modern.
- source_word: ἐκάκωσαν
  choice: meracuni
  rationale: Dengan 'pikiran' sebagai objek dan frasa 'terhadap saudara-saudara', kata ini secara idiomatis menggambarkan perusakan atau pemburukan sikap batin.
- source_word: τὰς ψυχὰς
  choice: pikiran mereka
  rationale: Dalam konteks ini ψυχαί menunjuk pada sikap atau keadaan batin, bukan pernyataan teknis tentang antropologi; 'pikiran' jelas dan wajar dalam bahasa Indonesia.
- source_word: τῶν ἐθνῶν
  choice: orang-orang bukan Yahudi
  rationale: Dalam kontras Yahudi–non-Yahudi di Kisah Para Rasul, istilah ini menunjuk pada bangsa-bangsa lain atau kaum non-Yahudi; bentuk ini paling mudah dipahami pembaca Indonesia.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: terhadap saudara-saudara
  rationale: Mempertahankan bentuk kekerabatan dari bahasa Yunani, sementara cakupan kolektifnya sebagai sesama orang percaya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna ἀπειθήσαντες antara ketidakpercayaan dan ketidaktaatan
  choice: tidak mau percaya
  alternative: tidak taat
  rationale: Konteks penginjilan mendukung penolakan untuk percaya, tetapi kemungkinan arti 'tidak taat' tetap dicatat agar ketegangan leksikal tidak dihilangkan.
- issue: Cakupan ἀδελφῶν dalam komunitas Kristen
  choice: saudara-saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk utama mengikuti nomina maskulin jamak Yunani, sedangkan catatan menerangkan bahwa pemakaiannya kemungkinan mencakup seluruh komunitas orang percaya, termasuk perempuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Namun' menandai kontras δέ; 'menghasut' dan 'meracuni pikiran' mempertahankan daya ungkap kuat teks tanpa terdengar kuno.
