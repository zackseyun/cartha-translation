id: ACT.19.9
reference: Acts 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: id
  text: Namun, ketika beberapa orang menjadi keras hati dan tidak taat[a], sambil menjelek-jelekkan Jalan itu[b] di depan orang banyak, Paulus meninggalkan mereka dan memisahkan murid-murid itu. Setiap hari ia berdiskusi di ruang kuliah Tiranus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak percaya” atau “menolak untuk diyakinkan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam Kisah Para Rasul, “Jalan itu” merupakan sebutan awal bagi gerakan para pengikut Yesus.
    reason: cultural_note
  - marker: c
    text: Atau “sekolah Tiranus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: makin keras hati
  rationale: Bentuk imperfek menyatakan proses atau keadaan yang terus berkembang; frasa ini mempertahankan citra kekerasan hati tanpa menentukan secara berlebihan siapa pelakunya.
- source_word: ἠπείθουν
  choice: tidak mau percaya
  rationale: Kata ini dapat berarti tidak taat, tidak percaya, atau menolak diyakinkan. Dalam konteks penolakan terhadap pemberitaan Paulus, pilihan ini menyampaikan unsur ketidakpercayaan sekaligus sikap enggan menerima; alternatif dicatat dalam catatan kaki.
- source_word: κακολογοῦντες
  choice: menjelek-jelekkan
  rationale: Partisip ini menunjuk pada perkataan bermusuhan yang mencela di depan umum. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi tuduhan hukum seperti fitnah.
- source_word: τὴν ὁδὸν
  choice: Jalan Tuhan
  rationale: Dalam Kisah Para Rasul, ungkapan ini merupakan sebutan bagi gerakan atau kehidupan para pengikut Yesus. Penambahan 'Tuhan' membuat sebutan tersebut dapat dipahami secara alami dalam bahasa Indonesia, sementara catatan kaki menjelaskan idiom sumber yang secara harfiah berbunyi 'Jalan itu'.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: di depan orang banyak
  rationale: Ungkapan ini dengan lugas mempertahankan sifat penentangan yang dilakukan secara terbuka.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: Paulus meninggalkan mereka
  rationale: Partisip aoris menggambarkan tindakan tegas menjauh dari kelompok penentang. Nama Paulus dinyatakan untuk menjernihkan subjek yang tersirat tanpa mengubah rujukannya.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: memisahkan murid-murid itu dari mereka
  rationale: Kata kerja tersebut menyatakan pemisahan yang disengaja. Pelengkap 'dari mereka' dibuat eksplisit berdasarkan konteks agar hubungan antarklausa jelas dalam bahasa Indonesia.
- source_word: καθ’ ἡμέραν
  choice: Setiap hari
  rationale: Padanan ini alami dan menyampaikan kegiatan yang dilakukan secara teratur tiap hari.
- source_word: διαλεγόμενος
  choice: berdiskusi
  rationale: Kata ini mencakup pembahasan, penalaran, dan usaha meyakinkan melalui percakapan. 'Berdiskusi' mempertahankan sifat interaktifnya dan terdengar alami.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: di ruang kuliah Tiranus
  rationale: σχολή di sini kemungkinan adalah tempat pengajaran atau ceramah, bukan sekolah dalam pengertian institusi modern. Nama Τύραννος ditransliterasikan menurut bentuk Indonesia.
theological_decisions:
- issue: τὴν ὁδὸν sebagai sebutan bagi gerakan pengikut Yesus
  choice: Jalan Tuhan
  alternative: Jalan itu
  rationale: Konteks Kisah Para Rasul menunjukkan bahwa ungkapan ini berfungsi sebagai sebutan yang dikenal bagi gerakan para pengikut Yesus. Huruf kapital dan unsur 'Tuhan' membantu pembaca Indonesia mengenalinya sebagai nama gerakan, sementara catatan kaki mempertahankan bentuk harfiahnya.
- issue: Nuansa ἠπείθουν
  choice: tidak mau percaya
  alternative: tidak taat; menolak untuk diyakinkan
  rationale: Kata Yunani itu memuat ketegangan antara ketidakpercayaan dan ketidaktaatan. Teks utama memakai ungkapan yang mencerminkan penolakan sadar, sedangkan ragam kemungkinan leksikal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Struktur kalimat Yunani dipecah agar alurnya jelas. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkan.
