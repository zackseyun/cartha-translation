  rationale: Revisi ini mempertahankan semua unsur makna Yunani sambil memperbaiki kelancaran ungkapan tindakan Paulus dan memperjelas hubungan catatan b dengan frasa sumber οἱ διὰ χειρῶν γινόμενοι. Tidak ada penafsiran teologis tambahan yang dimasukkan.
