id: ACT.19.26
reference: Acts 19:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: id
  text: Kalian melihat dan mendengar bahwa bukan hanya di Efesus, melainkan juga di hampir seluruh Asia[a], Paulus ini telah membujuk dan membuat cukup banyak orang beralih dengan mengatakan bahwa dewa-dewa yang dibuat oleh tangan manusia[b] bukanlah dewa-dewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Provinsi Asia dalam Kekaisaran Romawi, di bagian barat wilayah Turki sekarang, bukan seluruh benua Asia.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “yang dijadikan melalui tangan”; ungkapan ini merujuk pada dewa atau berhala yang dibuat oleh manusia.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: kalian melihat dan mendengar
  rationale: Mempertahankan dua kata kerja kini yang menjadi seruan retoris kepada bukti yang dapat disaksikan dan didengar oleh para pendengar Demetrius.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: bukan hanya di Efesus, melainkan juga di hampir seluruh Asia
  rationale: Genitif dalam susunan ini dipahami secara lokatif. 'Hampir seluruh' menerjemahkan σχεδὸν πάσης secara alami tanpa melebih-lebihkan jangkauannya.
- source_word: ὁ Παῦλος οὗτος
  choice: Paulus ini
  rationale: Mempertahankan demonstratif οὗτος dan nada meremehkan yang tersirat dalam tuduhan Demetrius tanpa menambahkan cercaan.
- source_word: πείσας μετέστησεν
  choice: telah membujuk dan memalingkan
  rationale: Mencerminkan tindakan meyakinkan orang dan menyebabkan mereka beralih dari kedudukan atau praktik sebelumnya; 'memalingkan' tidak menambahkan penilaian bahwa Paulus menyesatkan mereka.
- source_word: ἱκανὸν ὄχλον
  choice: sejumlah besar orang
  rationale: Menyampaikan jumlah yang cukup banyak atau berarti dalam bahasa Indonesia yang wajar; 'orang' lebih alami daripada 'kerumunan' karena yang ditekankan ialah banyaknya orang yang beralih.
- source_word: λέγων ὅτι
  choice: dengan mengatakan bahwa
  rationale: Menampilkan perkataan Paulus sebagai sarana yang dipakainya untuk membujuk dan memalingkan orang, sesuai hubungan partisipial dalam konteks.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: dewa-dewa yang dibuat oleh tangan manusia bukanlah dewa
  rationale: Mempertahankan penyangkalan langsung terhadap status ilahi dewa buatan manusia. Kata 'manusia' menjelaskan idiom 'melalui tangan' secara alami tanpa mengubah maksudnya.
theological_decisions:
- issue: Penyangkalan terhadap status ilahi berhala buatan manusia
  choice: dewa-dewa yang dibuat oleh tangan manusia bukanlah dewa
  alternative: benda-benda yang dibuat oleh tangan manusia bukanlah dewa-dewa
  rationale: 'Pilihan utama mempertahankan bentuk paradoks dan daya polemis bahasa Yunani: apa yang disebut dan dibuat sebagai dewa sebenarnya bukan dewa. Terjemahan ini tidak menambahkan kata seperti ''sejati'' atau memperluas pernyataan menjadi klaim metafisis lain.'
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada wacana publik yang tegas. ''Kalian'' sesuai dengan sapaan jamak kepada para rekan sekerja Demetrius. Susunan kalimat mempertahankan perkembangan tuduhan: jangkauan geografis, pengaruh Paulus, lalu isi pengajarannya.'
