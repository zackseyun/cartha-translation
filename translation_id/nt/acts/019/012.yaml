id: ACT.19.12
reference: Acts 19:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: id
  text: sehingga bahkan saputangan atau celemek kerja dibawa dari tubuh Paulus[a] kepada orang-orang sakit, dan penyakit-penyakit itu pun lenyap dari mereka, serta roh-roh jahat keluar dari mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari kulitnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai hasil dari mukjizat-mukjizat luar biasa yang disebut pada ayat sebelumnya.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: kepada orang-orang sakit
  rationale: Mengungkapkan tujuan pemindahan benda-benda itu secara alami dalam bahasa Indonesia.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: yang pernah menyentuh kulit Paulus pun dibawa
  rationale: Menghasilkan bahasa Indonesia yang wajar sambil mempertahankan hubungan langsung benda-benda itu dengan χρώς, yaitu kulit Paulus, dan gerak pembawaannya kepada orang sakit.
- source_word: σουδάρια
  choice: saputangan
  rationale: Padanan lazim bagi kain kecil untuk menyeka wajah atau keringat.
- source_word: σιμικίνθια
  choice: celemek kerja
  rationale: Istilah ini menunjuk pada celemek atau pakaian yang dipakai saat bekerja; unsur 'kerja' memperjelas jenisnya.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: penyakit-penyakit mereka pun lenyap
  rationale: Menyampaikan bahwa penyakit itu terlepas atau pergi dari orang-orang sakit dengan ungkapan Indonesia yang alami.
- source_word: τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι
  choice: dan roh-roh jahat keluar dari mereka
  rationale: Mempertahankan gambaran naratif tentang roh-roh jahat yang keluar; 'dari mereka' dibuat eksplisit dari konteks agar acuannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat penyembuhan dan pengusiran roh melalui kain yang berhubungan dengan Paulus
  choice: Menuturkan peristiwa mukjizat itu secara langsung tanpa menjelaskan mekanismenya.
  alternative: Menyiratkan pemujaan relik, mekanisme sakramental tertentu, atau menganggap peristiwa itu semata-mata simbolis.
  rationale: Teks menceritakan hasil mukjizat tanpa merumuskan doktrin tentang benda-benda tersebut; terjemahan tidak boleh menambahkan maupun mengurangi klaim supernatural narasi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama Paulus dipakai untuk memperjelas kata ganti αὐτοῦ karena ayat ini berdiri sebagai unit kutipan; susunan klausa dipecah menjadi dua kalimat agar mudah dibaca tanpa mengubah hubungan hasil yang dibuka oleh 'sehingga'.
