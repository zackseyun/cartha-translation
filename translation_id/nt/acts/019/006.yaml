source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: id
  text: Ketika Paulus menumpangkan tangan ke atas mereka, Roh Kudus datang atas mereka, dan mereka berbicara dalam bahasa-bahasa[a] serta bernubuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bahasa-bahasa” dapat berarti “lidah-lidah” atau “bahasa-bahasa”; ayat ini tidak menjelaskan lebih lanjut sifat tuturan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: Ketika Paulus menumpangkan tangannya ke atas mereka
  rationale: Genetif absolut dengan partisip aoristus paling alami dinyatakan sebagai anak kalimat waktu. Ungkapan 'menumpangkan tangan' mempertahankan idiom tindakan tersebut dalam bahasa Indonesia yang wajar.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: Roh Kudus datang atas mereka
  rationale: Terjemahan ini mempertahankan verba 'datang' dan arah relasi ἐπί tanpa menggantinya dengan 'turun' atau menambahkan penjelasan teologis yang tidak dinyatakan teks.
- source_word: ἐλάλουν τε γλώσσαις
  choice: lalu mereka berkata-kata dalam bahasa-bahasa
  rationale: Imperfek menyajikan tindakan yang berlangsung dalam adegan tersebut; 'berkata-kata' sesuai untuk tuturan yang dihasilkan, sedangkan 'bahasa-bahasa' mempertahankan bentuk jamak dan, bersama catatan kaki, tidak memaksakan satu penafsiran tentang sifat tuturan itu. 'Lalu' menyampaikan perkembangan naratif tanpa harus menambahkan verba 'mulai'.
- source_word: καὶ ἐπροφήτευον
  choice: dan bernubuat
  rationale: Verba ini secara langsung menunjuk pada kegiatan menyampaikan nubuat. Bentuk 'bernubuat' jelas, mapan, dan tidak menambahkan isi nubuat yang tidak disebutkan.
theological_decisions:
- issue: Sifat γλώσσαις dalam Kisah Para Rasul 19:6
  choice: bahasa-bahasa dalam teks utama, disertai catatan tentang arti harfiah 'lidah-lidah'
  alternative: bahasa roh; bahasa-bahasa lain; lidah-lidah
  rationale: γλώσσαις dapat berarti lidah-lidah atau bahasa-bahasa. Ayat ini sendiri tidak menetapkan apakah yang dimaksud adalah bahasa manusia yang dikenal atau bentuk tuturan lain. Terjemahan utama dan catatan kaki mempertahankan ruang tafsir itu tanpa mengimpor istilah denominasi tertentu.
- issue: Datangnya Roh Kudus
  choice: Roh Kudus datang atas mereka
  alternative: Roh Kudus turun ke atas mereka
  rationale: Pilihan ini mengikuti verba ἦλθε ('datang') dan preposisi ἐπί, serta melaporkan peristiwa sebagaimana teks menyatakannya tanpa menyimpulkan mekanisme sakramental atau urutan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan istilah penting serta ambiguitas leksikal teks Yunani.
