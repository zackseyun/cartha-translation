id: ACT.19.22
reference: Acts 19:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: id
  text: Jadi, setelah mengutus ke Makedonia dua orang yang melayaninya, yaitu Timotius dan Erastus, ia sendiri tinggal beberapa waktu di Asia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Provinsi Asia dalam Kekaisaran Romawi, di bagian barat Asia Kecil, bukan benua Asia pada masa kini.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: setelah mengutus
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; bentuk ini menyampaikan urutan tersebut secara alami.
- source_word: δὲ
  choice: Jadi
  rationale: Partikel ini berfungsi sebagai penghubung ringan yang melanjutkan alur cerita, bukan sebagai penanda pertentangan kuat.
- source_word: εἰς τὴν Μακεδονίαν
  choice: ke Makedonia
  rationale: Dalam bahasa Indonesia, 'ke' secara alami menyatakan arah menuju suatu wilayah dan sesuai dengan daya arah εἰς.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: dua orang yang melayaninya
  rationale: Ungkapan ini mempertahankan gagasan pelayanan kepada Paulus tanpa mengubahnya menjadi jabatan resmi atau istilah yang lebih interpretatif seperti 'asisten'.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timotius dan Erastus
  rationale: Nama-nama pribadi ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Pronomina eksplisit ini bersifat emfatis dan mengontraskan Paulus dengan kedua orang yang diutusnya.
- source_word: ἐπέσχεν χρόνον
  choice: tinggal beberapa waktu
  rationale: Ungkapan ini berarti tetap berada di suatu tempat selama jangka waktu tertentu; pilihan ini alami dan jelas dalam narasi Indonesia.
- source_word: εἰς τὴν Ἀσίαν
  choice: di Asia
  rationale: 'Bersama ungkapan ἐπέσχεν χρόνον, εἰς memiliki makna lokatif kontekstual: Paulus tetap tinggal di Asia. Keterangan kaki menjelaskan cakupan geografis historisnya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Melayani' mempertahankan cakupan umum διακονέω tanpa menyiratkan jabatan gerejawi tertentu; 'ia sendiri' menjaga penekanan teks Yunani.
