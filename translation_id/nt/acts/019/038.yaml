  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: id
  text: Jadi, jika Demetrius dan para pengrajin yang bersamanya mempunyai perkara terhadap seseorang, sidang-sidang pengadilan sedang diselenggarakan dan ada para prokonsul[a]; hendaklah mereka mengajukan perkara satu terhadap yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para prokonsul tersedia.” Bentuk jamak ini dapat merujuk secara umum kepada jabatan atau fungsi prokonsul dalam pemerintahan provinsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Jadi, jika
  rationale: Menyampaikan daya simpulan οὖν dan kondisi εἰ secara wajar; μέν dibiarkan tersirat dalam alur karena tidak memiliki padanan terpisah yang alami di sini.
- source_word: Δημήτριος
  choice: Demetrius
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: para pengrajin yang bersamanya
  rationale: τεχνῖται menunjuk kepada para pekerja terampil; ungkapan ini juga mempertahankan σὺν αὐτῷ tanpa mempersempit hubungan mereka.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: mempunyai pengaduan terhadap seseorang
  rationale: Ungkapan ini memiliki arti forensik, yakni mempunyai keluhan atau perkara hukum terhadap seseorang.
- source_word: ἀγοραῖοι ἄγονται
  choice: sidang-sidang pengadilan sedang diselenggarakan
  rationale: Ungkapan tersebut menunjuk kepada persidangan resmi yang diadakan; bentuk pasif dan aspek berlangsung dipertahankan secara alami.
- source_word: ἀνθύπατοί εἰσιν
  choice: ada para prokonsul
  rationale: Mempertahankan bentuk jamak Yunani dan gelar resmi pejabat provinsi Romawi tanpa mengubahnya menjadi tunggal.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: hendaklah mereka saling mengajukan tuduhan
  rationale: Kata kerja ini bersifat forensik dan bentuk imperatif orang ketiga jamaknya mengarahkan para pihak untuk memakai jalur hukum resmi; ἀλλήλοις mempertahankan unsur timbal balik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum dibuat jelas bagi pembaca umum, sedangkan bentuk jamak ‘para prokonsul’ dipertahankan karena merupakan ciri nyata teks Yunani dan tidak perlu diselaraskan secara historis.
