  to: Jadi, jika Demetrius dan para pengrajin yang bersamanya mempunyai perkara terhadap seseorang, sidang-sidang pengadilan sedang diselenggarakan dan ada para prokonsul[a]; hendaklah mereka mengajukan perkara satu terhadap yang lain.
