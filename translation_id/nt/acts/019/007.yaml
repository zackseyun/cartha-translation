  text: Jumlah mereka seluruhnya kira-kira dua belas orang laki-laki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: Jumlah mereka
  rationale: Dalam konteks penyebutan total kelompok, frasa ini menyampaikan fungsi eksistensial ἦσαν secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: —
  rationale: δέ adalah penghubung ringan tanpa pertentangan kuat; tidak perlu dinyatakan agar kalimat Indonesia tetap alami.
- source_word: οἱ πάντες
  choice: mereka semuanya
  rationale: Ungkapan ini merujuk kepada keseluruhan kelompok dan mempertahankan daya rangkum frasa Yunani.
- source_word: ἄνδρες
  choice: orang laki-laki
  rationale: ἀνήρ secara khusus menunjuk kepada laki-laki, bukan orang secara umum; bentuk ini menjaga ketepatan gender dan terdengar wajar setelah angka.
- source_word: ὡσεὶ
  choice: kira-kira
  rationale: ὡσεὶ menyatakan perkiraan; 'kira-kira' adalah padanan Indonesia yang jelas dan lazim untuk jumlah.
- source_word: δώδεκα
  choice: dua belas
  rationale: Padanan langsung untuk bilangan kardinal tersebut.
