  register: Bahasa Indonesia baku modern, ringkas, dan mudah dipahami. Susunan dengan 'Jumlah mereka semuanya' mempertahankan penekanan pada total kelompok, sedangkan 'orang laki-laki' menjaga arti spesifik ἄνδρες.
