id: ACT.19.40
reference: Acts 19:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: id
  text: Sebab, kita bahkan terancam didakwa karena kerusuhan hari ini[a], karena tidak ada alasan yang dapat kita kemukakan untuk mempertanggungjawabkan kerumunan ini[b]. Setelah mengatakan hal itu, ia membubarkan sidang tersebut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberontakan” atau “huru-hara”; kata Yunani ini dapat menunjuk pergolakan sipil yang serius, tetapi dalam konteks ini “kerusuhan” paling sesuai dengan kegaduhan umum yang sedang terjadi.
    reason: lexical_alternative
  - marker: b
    text: Atau “kekacauan” atau “gerombolan”; kata Yunani ini menunjuk perkumpulan yang gaduh dan berbeda dari kata yang diterjemahkan “sidang” sesudahnya.
    reason: lexical_alternative
  - marker: c
    text: Kata yang diterjemahkan “sidang” adalah kata Yunani yang di tempat lain sering diterjemahkan “jemaat”, tetapi di sini mengacu pada pertemuan sipil di Efesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab, ... bahkan
  rationale: Mengungkapkan fungsi penjelas καί γάρ sekaligus penekanannya dalam susunan bahasa Indonesia yang alami.
- source_word: κινδυνεύομεν ἐγκαλεῖσθαι
  choice: kita ... terancam didakwa
  rationale: Mempertahankan bahaya yang sedang dihadapi serta nuansa hukum dari ἐγκαλεῖσθαι dalam konteks pemerintahan kota.
- source_word: στάσεως
  choice: karena kerusuhan
  rationale: Menunjuk gangguan ketertiban umum yang serius tanpa mempersempit maknanya menjadi pemberontakan politik bersenjata.
- source_word: περὶ τῆς σήμερον
  choice: karena kerusuhan hari ini
  rationale: Ungkapan eliptis Yunani merujuk pada peristiwa yang terjadi pada hari itu; susunan ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: padahal tidak ada alasan yang dapat membenarkannya
  rationale: Menyampaikan genitivus absolutus serta nuansa bahwa tidak ada dasar sah bagi kerusuhan tersebut.
- source_word: ἀποδοῦναι λόγον
  choice: memberikan pertanggungjawaban
  rationale: Mempertahankan idiom formal tentang kewajiban menjelaskan atau mempertanggungjawabkan tindakan di hadapan pihak berwenang.
- source_word: συστροφῆς
  choice: kerumunan
  rationale: Menunjuk kumpulan orang yang berhimpun dalam suasana gaduh; pilihan ini tetap membedakannya dari ἐκκλησία sebagai sidang yang dibubarkan secara resmi.
- source_word: ἐκκλησίαν
  choice: sidang
  rationale: Dalam konteks ini kata tersebut mengacu pada pertemuan warga di Efesus, bukan jemaat Kristen; 'sidang' mempertahankan corak sipil dan formalnya.
- source_word: ἀπέλυσεν
  choice: membubarkan
  rationale: Padanan alami untuk tindakan pejabat yang mengakhiri dan menyuruh pulang suatu sidang umum.
theological_decisions:
- issue: Makna ἐκκλησία dalam konteks non-gerejawi
  choice: sidang
  alternative: jemaat
  rationale: Konteks langsung adalah pertemuan sipil di Efesus. Menerjemahkannya sebagai 'jemaat' akan menimbulkan kesan gerejawi yang tidak dimaksudkan di sini.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada resmi yang sesuai dengan peringatan hukum seorang panitera kota. Struktur kalimat mempertahankan alur alasan dalam teks Yunani, sementara istilah 'kerusuhan', 'pertanggungjawaban', 'kerumunan', dan 'sidang' membedakan unsur-unsur sipil-hukumnya secara jelas.
