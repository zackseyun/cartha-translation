  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: id
  text: Jadi, sebagian orang meneriakkan satu hal, dan sebagian lagi hal lain,[a] karena sidang itu kacau, dan kebanyakan dari mereka tidak tahu mengapa mereka telah berkumpul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "perkumpulan" atau "kerumunan". Kata Yunani ekklēsia di sini merujuk pada sidang sipil, bukan jemaat Kristen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Jadi, ada yang meneriakkan ini dan ada yang meneriakkan itu
  rationale: Pola distributif ἄλλοι ... ἄλλο τι menyatakan bahwa kelompok-kelompok berbeda meneriakkan hal yang berbeda. Bentuk imperfek ἔκραζον menunjukkan tindakan yang sedang berlangsung; pengulangan 'meneriakkan' menghasilkan bahasa Indonesia yang jelas dan menggambarkan hiruk-pikuk adegan.
- source_word: ἐκκλησία
  choice: sidang
  rationale: Dalam konteks kerusuhan sipil ini, ἐκκλησία menunjuk pada perkumpulan warga, bukan jemaat Kristen. 'Sidang' mempertahankan gagasan perhimpunan publik dan sesuai dengan pemakaian istilah yang sama dalam konteks sipil pada ayat-ayat sekitar.
- source_word: συγκεχυμένη
  choice: kacau
  rationale: Partisipel perfek ini menggambarkan keadaan yang dihasilkan oleh kekacauan atau kebingungan. 'Sidang itu kacau' alami, ringkas, dan mencakup unsur ketidakteraturan dalam konteks.
- source_word: οἱ πλείους
  choice: kebanyakan dari mereka
  rationale: Bentuk komparatif yang dipakai secara substantival berarti mayoritas orang yang hadir. 'Kebanyakan dari mereka' secara jelas merujuk kembali kepada orang-orang dalam sidang.
- source_word: τίνος ἕνεκα
  choice: untuk apa
  rationale: Ungkapan ini dapat menanyakan alasan atau tujuan. Dalam konteks orang-orang yang bahkan tidak mengetahui maksud pertemuan, 'untuk apa' mempertahankan nuansa tujuan tanpa memperpanjang kalimat.
- source_word: συνεληλύθεισαν
  choice: mereka berkumpul
  rationale: Bentuk pluperfek συνέρχομαι menunjukkan bahwa mereka telah berkumpul sebelum keadaan yang sedang diceritakan. Dalam bahasa Indonesia, urutan temporal itu sudah jelas dari konteks sehingga 'mereka berkumpul' terdengar alami tanpa perlu menambahkan 'telah'.
