translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lugas untuk pembaca umum, sementara pengulangan pada klausa pertama mempertahankan efek distributif dan gaduh dari teks Yunani. 'Sidang' dipilih untuk mencegah pembaca mengartikan ἐκκλησία di sini sebagai gereja atau jemaat Kristen.
