  source_fidelity: 'Terjemahan secara akurat mencerminkan urutan dan makna utama teks Yunani: respons setelah mendengar, luapan amarah, seruan yang berulang/berlangsung, dan aklamasi mengenai Artemis yang terkait dengan orang Efesus. “Terus berseru” menangkap daya imperfek ἔκραζον dengan baik. Penambahan aposisional “dewi” pada “Artemis, dewi orang Efesus” merupakan penjelasan minimal yang wajar atas nama dewi tersebut dan tidak mengubah isi aklamasi.'
