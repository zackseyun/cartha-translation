  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: id
  text: Ketika mendengar hal itu, mereka menjadi penuh amarah[a] dan terus berseru, “Besarlah Artemis, dewi orang Efesus!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dipenuhi kemarahan,” “menjadi sangat murka,” atau “menjadi berang.” Ungkapan Yunani secara harfiah berarti “menjadi penuh dengan θυμός,” yaitu kemarahan yang sangat kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Ketika mendengar hal itu
  rationale: Partisip aoris menyatakan keadaan yang mendahului tindakan utama. Objek tersirat dijelaskan dari konteks dengan “hal itu” agar alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: dan
  rationale: δέ berfungsi sebagai penghubung ringan, bukan pertentangan kuat; “dan” menjaga kesinambungan kalimat.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: menjadi penuh amarah
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang menjadi penuh dengan θυμός sekaligus menyampaikan kemarahan yang kuat.
- source_word: ἔκραζον
  choice: terus berseru
  rationale: Bentuk imperfek menunjukkan seruan yang berlangsung atau berulang; “terus berseru” menyampaikan aspek duratif itu secara alami.
- source_word: λέγοντες
  choice: —
  rationale: Isi seruan diperkenalkan langsung tanpa padanan tersendiri bagi λέγοντες; dalam bahasa Indonesia, menghilangkan “dengan berkata” menghindari ungkapan yang kaku tanpa kehilangan makna.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Besarlah Artemis, dewi orang Efesus!
  rationale: “Besarlah” mempertahankan corak aklamasi. Keterangan “dewi” menjernihkan hubungan Artemis dengan orang Efesus bagi pembaca modern, sementara genitif plural Ἐφεσίων diterjemahkan sebagai “orang Efesus”.
theological_decisions:
- issue: Penyampaian aklamasi kepada dewi pagan tanpa menyiratkan dukungan penerjemah
  choice: Besarlah Artemis, dewi orang Efesus!
  alternative: Artemis orang Efesus itu besar!
  rationale: Ucapan ini dipertahankan sebagai seruan langsung orang banyak. Bentuk kutipan jelas melaporkan keyakinan mereka tanpa mengesahkannya sebagai pernyataan narator.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Besarlah ...” dipilih untuk mempertahankan sifat seruan atau yel-yel, sedangkan “terus berseru” menyampaikan tindakan yang berlangsung.
