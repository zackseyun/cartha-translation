  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: id
  text: Lalu Paulus berkata, “Kalau begitu, ke dalam apa kalian dibaptis?” Mereka menjawab, “Ke dalam baptisan Yohanes.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Lalu Paulus berkata
  rationale: λέγω berarti ‘berkata’, sedangkan τε menghubungkan perkataan ini secara ringan dengan konteks sebelumnya. Subjek ‘Paulus’ dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: Εἰς τί οὖν
  choice: Kalau begitu, ke dalam apa
  rationale: οὖν menyatakan kesimpulan dari jawaban sebelumnya dan secara alami diterjemahkan ‘kalau begitu’. Frasa ‘ke dalam apa’ mempertahankan εἰς serta kesejajarannya dengan jawaban, walaupun ungkapannya sengaja lebih harfiah daripada idiom Indonesia biasa.
- source_word: ἐβαπτίσθητε
  choice: kalian dibaptis
  rationale: Bentuk aoristus pasif βαπτίζω diterjemahkan secara langsung dengan bentuk pasif ‘dibaptis’. ‘Kalian’ menyatakan orang kedua jamak dalam bahasa Indonesia modern.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Ke dalam baptisan Yohanes
  rationale: Pengulangan εἰς dipertahankan untuk menjaga paralelisme pertanyaan dan jawaban. Genitif Ἰωάννου secara alami diterjemahkan ‘baptisan Yohanes’.
- source_word: βάπτισμα
  choice: baptisan
  rationale: ‘Baptisan’ adalah padanan baku dan tepat untuk βάπτισμα dalam konteks ritus yang dikaitkan dengan Yohanes.
theological_decisions:
- issue: Apakah pengulangan εἰς dalam pertanyaan dan jawaban dipertahankan
  choice: Kedua klausa memakai ‘ke dalam’
  alternative: 'Terjemahan lebih idiomatis: ‘Dengan baptisan apa kalian dibaptis?’ / ‘Dengan baptisan Yohanes.’'
  rationale: Pilihan ini mempertahankan bentuk dan kesejajaran retoris teks Yunani tanpa menentukan lebih jauh makna teologis hubungan antara orang yang dibaptis dan baptisan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ dipakai untuk orang kedua jamak; ‘kalau begitu’ menyampaikan hubungan inferensial secara alami. Susunan ‘ke dalam apa’ dipertahankan demi kedekatan dengan teks sumber dan paralelisme internal ayat.
