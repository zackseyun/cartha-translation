  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: id
  text: Namun, jika kalian mencari hal lain lagi, hal itu akan diselesaikan dalam sidang yang sah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam sidang resmi” atau “dalam sidang yang sesuai dengan hukum.” Kata Yunani di sini merujuk pada sidang warga yang diselenggarakan secara sah, bukan pada jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: lebih lanjut
  rationale: Adverbia ini menunjuk pada sesuatu yang tambahan atau melampaui perkara yang sedang dibahas; “lebih lanjut” alami dalam bahasa Indonesia dan mempertahankan nuansa komparatifnya.
- source_word: ἐπιζητεῖτε
  choice: kalian mencari
  rationale: Kata kerja ini dapat berarti mencari atau mengupayakan. Dalam konteks sipil-hukum ini, “mencari” mempertahankan keluasan makna tanpa menjadikannya terlalu teknis.
- source_word: ἐννόμῳ
  choice: yang sah
  rationale: Adjektiva ini menyatakan sesuatu yang sesuai dengan hukum. “Yang sah” secara alami menggambarkan sidang yang dibentuk dan dijalankan menurut ketentuan hukum.
- source_word: ἐκκλησίᾳ
  choice: sidang
  rationale: Di sini kata tersebut merujuk pada perhimpunan warga yang resmi, bukan jemaat Kristen. “Sidang” cocok dengan konteks publik dan prosedural tanpa mengubahnya secara berlebihan menjadi istilah pengadilan.
- source_word: ἐπιλυθήσεται
  choice: hal itu akan diselesaikan
  rationale: Bentuk pasif futurum menunjukkan bahwa perkara tersebut akan mendapat penyelesaian; “akan diselesaikan” jelas dan wajar dalam konteks prosedur sipil.
- source_word: τι
  choice: sesuatu
  rationale: Pronomina tak tentu dalam klausa bersyarat ini menunjuk secara terbuka pada perkara tambahan apa pun; “sesuatu” berpadu alami dengan verba “mencari”.
theological_decisions:
- issue: Penerjemahan ἐκκλησία dalam konteks sipil non-Kristen
  choice: sidang
  alternative: jemaat; pertemuan
  rationale: Konteksnya adalah perhimpunan resmi warga Efesus, bukan komunitas Kristen. “Sidang” menghindari kesan gerejawi sekaligus mempertahankan gagasan tentang suatu badan yang berkumpul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kalian” dipakai karena verba Yunani berbentuk orang kedua jamak. Susunan kalimat dibuat alami tanpa menghilangkan nuansa prosedural dan sipil dari teks sumber.
