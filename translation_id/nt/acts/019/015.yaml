  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: id
  text: Namun roh jahat itu menjawab mereka[a], “Yesus aku kenal, dan Paulus aku tahu—tetapi kamu ini siapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Yesus aku kenal, dan tentang Paulus aku tahu.” Bahasa Yunani memakai dua kata kerja yang berbeda: γινώσκω (“mengenal”) dan ἐπίσταμαι (“mengetahui” atau “mengetahui tentang”), yang mungkin menunjukkan perbedaan nuansa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: menjawab mereka
  rationale: Konstruksi partisip aoris ditambah verba finit ini secara idiomatis memperkenalkan tanggapan. 'Menjawab mereka' alami dalam bahasa Indonesia serta mempertahankan daya responsif dan para penerimanya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang bersifat kontras dari tindakan para pengusir roh kepada tanggapan roh itu.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: roh jahat
  rationale: Dalam konteks ini πνεῦμα menunjuk kepada makhluk rohani yang berpribadi, sedangkan πονηρός berarti jahat; 'roh jahat' merupakan ungkapan Indonesia yang baku dan jelas.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Yesus aku kenal
  rationale: γινώσκω menyatakan pengenalan atau pengetahuan. Susunan dengan nama di depan mempertahankan penekanan dalam bahasa Yunani dan tetap wajar dalam ujaran Indonesia.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Paulus aku akui
  rationale: ἐπίσταμαι dapat menyatakan mengetahui, mengenali, atau mengetahui tentang seseorang. 'Aku akui' mempertahankan perbedaan dari γινώσκω tanpa menetapkan secara berlebihan tingkat pengetahuan roh itu; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: tetapi kamu ini siapa?
  rationale: ὑμεῖς bersifat tegas dan berbentuk jamak, sedangkan δέ mengontraskannya dengan Yesus dan Paulus. 'Kamu ini siapa?' menyampaikan tekanan retoris secara alami; konteks memperjelas bahwa 'kamu' bersifat jamak.
theological_decisions:
- issue: Perbedaan antara γινώσκω dan ἐπίσταμαι dalam perkataan roh jahat
  choice: “Yesus aku kenal, dan Paulus aku akui”
  alternative: “Yesus aku kenal, dan tentang Paulus aku tahu”; atau kedua verba diterjemahkan dengan 'kenal/tahu'
  rationale: Teks Yunani memakai dua verba berbeda, kemungkinan demi efek retoris. Pilihan dua ungkapan Indonesia mempertahankan perbedaan itu, sementara catatan kaki mengakui bahwa nuansanya tidak pasti. Terjemahan ini tidak menarik kesimpulan doktrinal mengenai tingkat pengetahuan roh jahat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Inversi 'Yesus aku kenal, dan Paulus aku akui' dipertahankan untuk membawa penekanan nama-nama yang ditempatkan di depan dalam bahasa Yunani. Tanda pisah menandai kontras retoris yang tajam sebelum pertanyaan.
