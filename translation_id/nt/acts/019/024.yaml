  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: id
  text: Sebab, ada seorang bernama Demetrius, seorang perajin perak yang membuat kuil-kuil Artemis dari perak[a]. Ia memberikan penghasilan yang tidak sedikit kepada para perajin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat suci Artemis dari perak” atau “miniatur kuil Artemis dari perak.” Kata Yunani naous berarti “kuil-kuil/tempat-tempat suci” dan dalam konteks ini kemungkinan menunjuk kepada benda-benda kerajinan kecil yang berkaitan dengan pemujaan Artemis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “usaha yang tidak sedikit”—suatu ungkapan yang berarti usaha dagang atau penghasilan yang besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberi alasan atau latar belakang bagi kisah sebelumnya.
- source_word: Δημήτριος τις ὀνόματι
  choice: ada seorang bernama Demetrius
  rationale: Ungkapan ini memperkenalkan seorang tokoh tertentu yang sebelumnya belum disebut; bentuk Indonesia ini alami dan tetap mencerminkan unsur indefinit τις.
- source_word: ἀργυροκόπος
  choice: seorang perajin perak
  rationale: Menunjuk kepada pekerja terampil yang membuat barang dari perak; 'perajin perak' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: ποιῶν
  choice: yang membuat
  rationale: Klausa relatif alami dalam bahasa Indonesia dan menyatakan kegiatan yang menjadi ciri pekerjaan Demetrius.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: kuil-kuil Artemis dari perak
  rationale: Menjaga makna dasar ναός sebagai kuil atau tempat suci dan hubungan dengan Artemis tanpa memastikan secara berlebihan bentuk persis benda kerajinan tersebut.
- source_word: παρείχετο
  choice: Ia mendatangkan
  rationale: Menyampaikan bahwa kegiatan Demetrius secara berkelanjutan menghasilkan atau menyediakan kegiatan ekonomi bagi para perajin; konteks lampau dipahami dari narasi.
- source_word: τοῖς τεχνίταις
  choice: bagi para perajin
  rationale: τεχνίτης merujuk kepada pekerja terampil dalam suatu kerajinan; 'perajin' sesuai dengan konteks produksi benda perak.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: usaha yang tidak sedikit
  rationale: Mempertahankan litotes Yunani 'tidak sedikit' serta keluasan arti ἐργασία, yang dapat mencakup pekerjaan, usaha dagang, dan hasil ekonomi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur dipecah menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan sintaksis dan makna ayat. Litotes sumber dipertahankan dalam teks utama, lalu dijelaskan dalam catatan kaki.
