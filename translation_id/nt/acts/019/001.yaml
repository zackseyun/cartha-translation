id: ACT.19.1
reference: Acts 19:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: id
  text: Ketika Apolos berada di Korintus, Paulus melintasi daerah-daerah pedalaman[a], lalu tiba di Efesus dan menemukan beberapa murid[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daerah-daerah yang lebih tinggi” atau “daerah-daerah bagian dalam”; ungkapan ini kemungkinan menunjuk rute pedalaman melalui dataran yang lebih tinggi, bukan jalan pesisir.
    reason: lexical_alternative
  - marker: b
    text: Di sini tidak disebutkan murid siapa mereka; ayat-ayat berikutnya menunjukkan bahwa mereka berkaitan dengan baptisan Yohanes.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ketika …, Paulus …
  rationale: Formula peralihan naratif ini diungkapkan melalui susunan kalimat waktu yang alami dalam bahasa Indonesia. Terjemahan harfiah seperti “terjadilah bahwa” akan terasa kaku; daya penghubung δέ tetap tersirat dalam peralihan adegan.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: Ketika Apolos berada di Korintus
  rationale: Konstruksi infinitif artikular dengan ἐν τῷ menyatakan waktu yang bersamaan; “ketika” menyampaikannya secara jelas dan wajar.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: melintasi daerah-daerah pedalaman
  rationale: Partisip aoris menunjukkan perjalanan melintasi suatu wilayah sebelum tiba di Efesus. ἀνωτερικά secara harfiah dapat berarti “lebih tinggi/atas,” tetapi dalam konteks geografis kemungkinan menunjuk rute pedalaman atau dataran tinggi, bukan jalur pesisir.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: lalu tiba di Efesus
  rationale: “Tiba di” secara alami menyatakan gerak menuju dan sampainya Paulus di kota itu; “lalu” memperjelas urutan setelah ia melintasi wilayah pedalaman.
- source_word: καὶ εὑρεῖν
  choice: dan menemukan
  rationale: Infinitif yang dikoordinasikan ini melanjutkan rangkaian tindakan utama; bentuk verba finit alami dalam bahasa Indonesia.
- source_word: τινας μαθητάς
  choice: beberapa murid
  rationale: τινας bersifat tak tentu, sedangkan μαθητάς berarti “murid-murid.” Terjemahan ini tidak menentukan lebih dahulu murid siapa mereka.
theological_decisions:
- issue: Identitas μαθητάς dalam konteks
  choice: beberapa murid
  alternative: beberapa murid Yohanes; beberapa murid Yesus
  rationale: Teks Yunani hanya menyebut mereka “beberapa murid.” Ayat-ayat berikutnya menjelaskan kaitan mereka dengan baptisan Yohanes, sehingga ayat ini tidak boleh lebih dahulu menetapkan identitas mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Formula pembuka Yunani tidak diterjemahkan secara mekanis agar kalimat tetap alami. Penanda catatan [a] ditempatkan langsung sesudah frasa yang diterangkannya, yaitu “daerah-daerah pedalaman.” Tanda koma akhir dipertahankan karena struktur kalimat berlanjut ke ayat berikutnya.
