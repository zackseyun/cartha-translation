  source_fidelity: Teks secara akurat menyampaikan hubungan waktu dalam ἐν τῷ, perjalanan Paulus melalui τὰ ἀνωτερικὰ μέρη, kedatangannya di Efesus, dan penemuan τινας μαθητάς. Penghilangan padanan leksikal eksplisit untuk Ἐγένετο δέ dapat diterima dalam bahasa Indonesia modern karena fungsi formula peralihan naratifnya terwadahi oleh susunan kalimat dan konteks, tanpa mengubah peristiwa atau hubungan antarklausa.
