id: ACT.19.2
reference: Acts 19:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Apakah kalian menerima Roh Kudus ketika kalian percaya?[a]” Mereka menjawab, “Tidak. Kami bahkan belum pernah mendengar bahwa ada Roh Kudus.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah kalian percaya?” Partisip Yunani dapat dipahami dengan nuansa waktu yang sedikit berbeda.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kami bahkan belum pernah mendengar apakah ada Roh Kudus”; secara lebih interpretatif, “kami bahkan belum pernah mendengar bahwa Roh Kudus telah diberikan.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Lalu ia berkata kepada mereka
  rationale: τέ menghubungkan pertanyaan ini dengan alur sebelumnya secara ringan. “Lalu” menyampaikan kelanjutan narasi dengan wajar tanpa memberi tekanan berlebihan.
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: Apakah kalian menerima Roh Kudus ketika kalian percaya?
  rationale: Partisip aoris πιστεύσαντες berkaitan secara temporal dengan ἐλάβετε, tetapi tidak dengan sendirinya menetapkan urutan waktu yang ketat. “Ketika kalian percaya” mempertahankan keluwesan itu dalam bahasa Indonesia.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada Roh Kudus Allah. Bentuk ini alami dan baku dalam bahasa Indonesia.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Mereka menjawab
  rationale: δέ menandai kelanjutan atau kontras ringan, sedangkan verba berkata dipahami dari konteks. “Menjawab” mengungkapkan fungsi dialog tersebut secara alami.
- source_word: Ἀλλ’ οὐδ’
  choice: Tidak. ... bahkan belum
  rationale: Gabungan ini menguatkan penyangkalan. Pemisahan menjadi jawaban singkat “Tidak” dan pernyataan berikutnya menghasilkan bahasa Indonesia yang alami sambil mempertahankan penekanannya.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: Kami bahkan belum pernah mendengar bahwa ada Roh Kudus
  rationale: Ini mengikuti arti langsung konstruksi Yunani tanpa menambahkan gagasan bahwa Roh Kudus “telah diberikan,” yang tidak dinyatakan secara eksplisit. “Belum pernah mendengar” merupakan ungkapan Indonesia yang wajar untuk ἠκούσαμεν dalam konteks ini.
theological_decisions:
- issue: Hubungan waktu antara percaya dan menerima Roh Kudus
  choice: ketika kalian percaya
  alternative: setelah kalian percaya; pada saat kalian percaya
  rationale: Bahasa Yunani menghubungkan kedua peristiwa secara temporal, tetapi tidak memutuskan secara tegas apakah penerimaan itu berlangsung sesudah atau tepat bersamaan dengan percaya. Terjemahan utama dan catatan kaki mempertahankan ketegangan tersebut.
- issue: Makna ketidaktahuan para murid mengenai Roh Kudus
  choice: kami bahkan belum pernah mendengar bahwa ada Roh Kudus
  alternative: kami bahkan belum pernah mendengar apakah ada Roh Kudus; kami bahkan belum pernah mendengar bahwa Roh Kudus telah diberikan
  rationale: Klausa Yunani bersifat ringkas dan memungkinkan nuansa berbeda. Terjemahan utama mengikuti bentuk yang paling langsung, sedangkan catatan kaki mencatat kemungkinan lain tanpa memasukkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai karena lawan bicara berbentuk jamak dan agar jumlahnya tampak jelas. Kapitalisasi “Roh Kudus” menandai rujukan personal kepada Roh Allah. Semua alternatif yang menyentuh perdebatan teologis ditempatkan dalam catatan kaki, bukan diselesaikan diam-diam dalam teks utama.
