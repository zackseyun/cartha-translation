id: ACT.19.18
reference: Acts 19:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: id
  text: Banyak juga di antara mereka yang telah percaya berdatangan sambil mengakui dan memberitahukan perbuatan-perbuatan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “praktik-praktik mereka” atau “hal-hal yang telah mereka lakukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί τε
  choice: Banyak juga
  rationale: πολλοί menyatakan jumlah yang besar, sedangkan τε menghubungkan ayat ini secara ringan dengan alur sebelumnya; “juga” mempertahankan daya penghubung itu secara alami.
- source_word: τῶν πεπιστευκότων
  choice: di antara mereka yang telah percaya
  rationale: Partisipel perfek menyatakan tindakan percaya yang telah terjadi dengan keadaan yang tetap relevan, tanpa menjadikannya label teknis kelompok.
- source_word: ἤρχοντο
  choice: berdatangan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang pada masa lampau; “berdatangan” mengungkapkan aspek tersebut dengan wajar dalam bahasa Indonesia.
- source_word: ἐξομολογούμενοι
  choice: sambil mengakui
  rationale: Partisipel ini menunjuk pada pengakuan atau pemberian pengakuan secara terbuka. “Mengakui” mempertahankan objek pengakuannya tetap tersirat sebagaimana dalam bahasa Yunani.
- source_word: ἀναγγέλλοντες
  choice: dan memberitahukan
  rationale: Kata ini berarti melaporkan, menyatakan, atau membuat sesuatu diketahui. “Memberitahukan” cocok dengan konteks penyingkapan hal yang sebelumnya tersembunyi tanpa menyamakan maknanya dengan “mengakui”.
- source_word: τὰς πράξεις αὐτῶν
  choice: perbuatan-perbuatan mereka
  rationale: πρᾶξις dapat menunjuk pada perbuatan, kegiatan, atau praktik. Pilihan ini mempertahankan keluasan leksikalnya, sementara alternatif kontekstual dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah πεπιστευκότων harus diterjemahkan sebagai label kelompok yang menetap atau sebagai tindakan percaya yang telah terjadi dan tetap relevan.
  choice: mereka yang telah percaya
  alternative: orang-orang percaya; mereka yang percaya
  rationale: Bentuk perfek secara alami menyoroti tindakan percaya sebelumnya beserta keadaan yang berlanjut, tanpa memasukkan label gerejawi teknis yang tidak diwajibkan oleh teks.
- issue: Apakah τὰς πράξεις αὐτῶν secara khusus berarti dosa, praktik sihir, atau perbuatan secara lebih umum.
  choice: perbuatan-perbuatan mereka
  alternative: praktik-praktik mereka; hal-hal yang telah mereka lakukan
  rationale: Konteks dekat berkaitan dengan kegiatan sihir, tetapi kata bendanya sendiri lebih luas dan tidak secara eksplisit berarti “dosa.” Terjemahan utama menjaga keluasan itu, sedangkan catatan kaki menunjukkan kemungkinan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Berdatangan sambil” menyampaikan tindakan yang berlangsung atau berulang serta tindakan-tindakan penyerta tanpa mengubahnya menjadi hubungan tujuan.
