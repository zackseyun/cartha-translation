id: ACT.19.16
reference: Acts 19:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: id
  text: Lalu orang yang dalam dirinya ada roh jahat itu menerkam mereka[a]. Setelah menguasai keduanya[b], ia menang atas mereka, sehingga mereka melarikan diri[c] dari rumah itu dalam keadaan telanjang dan terluka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melompat menerjang mereka.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keduanya”. Walaupun konteks yang lebih luas menyebut lebih dari dua anak Skewa, teks di sini secara eksplisit memakai “keduanya”.
    reason: alternative_reading
  - marker: c
    text: 'Atau: “lolos dari rumah itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: menerkam
  rationale: Partisip aoris ini menggambarkan gerakan mendadak untuk menyerang. “Menerkam” menyampaikan tindakan fisik yang tiba-tiba dan keras secara alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὁ ἄνθρωπος
  choice: orang
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang laki-laki, tetapi bahasa Indonesia tidak perlu mengulang penandaan gender yang sudah jelas dari konteks. “Orang” terdengar alami dan tepat.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: yang dalam dirinya ada roh jahat
  rationale: Ungkapan ini mengikuti gambaran Yunani bahwa roh jahat itu berada di dalam orang tersebut, tanpa menggantinya dengan istilah teknis teologis seperti “kerasukan”.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: roh jahat
  rationale: Ini merupakan padanan baku, jelas, dan sesuai konteks pengusiran roh.
- source_word: κατακυριεύσας
  choice: setelah menguasai
  rationale: Kata ini menyatakan bahwa orang itu memperoleh kuasa atau dominasi atas lawan-lawannya. “Menguasai” mempertahankan gagasan tersebut tanpa menyamakannya sepenuhnya dengan klausa berikutnya.
- source_word: ἀμφοτέρων
  choice: keduanya
  rationale: Teks Yunani secara eksplisit menyatakan “keduanya”. Terjemahan mempertahankan rincian ini walaupun konteks yang lebih luas menyebut lebih dari dua anak Skewa.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: ia menang atas mereka
  rationale: Ungkapan ini berarti terbukti lebih kuat atau berhasil mengalahkan mereka. “Menang atas mereka” alami dalam bahasa Indonesia dan tetap membedakannya dari tindakan menguasai pada klausa sebelumnya.
- source_word: γυμνούς
  choice: telanjang
  rationale: Kata Yunani menyatakan keadaan tanpa pakaian; terjemahan tidak menambahkan dugaan bahwa pakaian mereka dirobek.
- source_word: τετραυματισμένους
  choice: terluka
  rationale: Partisip perfektif ini menunjukkan bahwa mereka telah dilukai dan masih berada dalam keadaan terluka ketika melarikan diri.
- source_word: ἐκφυγεῖν
  choice: melarikan diri
  rationale: Dalam konstruksi hasil dengan ὥστε, kata ini menggambarkan mereka lari keluar untuk menyelamatkan diri. Alternatif “lolos” dicatat karena verba ini juga dapat menekankan keberhasilan meloloskan diri.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: dari rumah itu
  rationale: Frasa ini menyatakan gerakan keluar dari rumah tertentu yang sedang dibicarakan; “dari rumah itu” merupakan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Cara menggambarkan keberadaan roh jahat dalam orang itu
  choice: orang yang dalam dirinya ada roh jahat
  alternative: orang yang kerasukan roh jahat
  rationale: Teks Yunani secara langsung mengatakan bahwa roh jahat itu ada di dalam orang tersebut. Pilihan ini mempertahankan gambaran sumber tanpa memasukkan istilah teknis yang dapat membawa nuansa tambahan.
- issue: Cakupan ἀμφοτέρων dalam hubungan dengan kelompok yang lebih besar
  choice: keduanya
  alternative: mereka semua
  rationale: Walaupun konteks lebih luas menyebut tujuh anak Skewa, ayat ini secara eksplisit memakai kata “keduanya”. Ketegangan naratif atau tekstual itu dipertahankan dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur kalimat dibagi agar urutan tindakan jelas dan mudah dipahami. Ungkapan “dalam dirinya ada roh jahat” sengaja dipertahankan dekat dengan sumber, sedangkan “menerkam” dipilih untuk daya hidup narasi dengan alternatif harfiah dalam catatan kaki.
