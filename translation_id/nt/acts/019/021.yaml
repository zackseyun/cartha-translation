id: ACT.19.21
reference: Acts 19:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: id
  text: Setelah semua itu selesai, Paulus bertekad dalam Roh[a] untuk pergi ke Yerusalem setelah melintasi Makedonia dan Akhaya. Katanya, “Setelah aku berada di sana, aku juga harus melihat Roma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam rohnya.” Frasa Yunani ini dapat menunjuk kepada tekad batin Paulus sendiri atau kepada tuntunan Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: selesai
  rationale: Dalam konteks ini, bentuk pasif πληρόω menunjukkan bahwa rangkaian peristiwa sebelumnya telah mencapai penyelesaian, bukan penggenapan nubuat.
- source_word: ἔθετο
  choice: menetapkan
  rationale: Bentuk tengah dalam ungkapan ini menyatakan keputusan atau tekad yang ditetapkan Paulus dalam dirinya; “menetapkan” mempertahankan unsur kesengajaan yang kuat.
- source_word: ἐν τῷ πνεύματι
  choice: dalam Roh
  rationale: Ungkapan Yunani dapat menunjuk kepada Roh Kudus ataupun roh batin Paulus. Teks utama memakai “Roh” sesuai pola narasi Lukas tentang tuntunan ilahi, sedangkan ambiguitasnya dijaga dalam catatan kaki.
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: melalui Makedonia dan Akhaya
  rationale: Partisip aoris menyatakan perjalanan melewati kedua wilayah itu sebelum tiba di Yerusalem. Susunan Indonesia ini alami dan memperjelas rute yang direncanakan.
- source_word: πορεύεσθαι
  choice: untuk pergi
  rationale: Kata gerak umum ini secara alami diterjemahkan “pergi” dalam konteks rencana perjalanan.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Sesudah berada di sana
  rationale: Konstruksi infinitif artikular dengan subjek akusatif menyatakan bahwa Paulus terlebih dahulu akan berada di Yerusalem sebelum tahap berikutnya.
- source_word: δεῖ με
  choice: aku juga harus
  rationale: δεῖ menyatakan keharusan yang kuat dan dalam Lukas-Kisah Para Rasul kerap mengandung nuansa tujuan ilahi; “harus” mempertahankan daya ungkap itu.
- source_word: Ῥώμην ἰδεῖν
  choice: melihat Roma
  rationale: Terjemahan harfiah ini tetap wajar dalam konteks perjalanan dan tidak mempersempit makna menjadi sekadar “mengunjungi”.
theological_decisions:
- issue: Rujukan ἐν τῷ πνεύματι
  choice: dalam Roh
  alternative: dalam rohnya
  rationale: Bahasa Yunani tidak memiliki kata kepunyaan yang eksplisit. Karena itu, frasa tersebut dapat dibaca sebagai tekad batin Paulus atau keputusan di bawah tuntunan Roh Kudus. Teks utama mengikuti pola pneumatologis Lukas tanpa meniadakan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menetapkan” dipilih untuk menyampaikan tekad yang disengaja; “melalui Makedonia dan Akhaya” menghindari susunan partisipial yang kaku. Penanda catatan kaki ditempatkan tepat setelah frasa ambigu.
