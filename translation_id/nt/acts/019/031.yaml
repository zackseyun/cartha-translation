revisions:
- from: Bahkan beberapa orang dari kalangan para Asiarkh[a], yang bersahabat dengan Paulus, mengirim pesan kepadanya dan mendesaknya agar tidak masuk ke gedung pertunjukan itu.[b]
  to: Bahkan beberapa Asiarkh[a], yang bersahabat dengan Paulus, mengirim pesan kepadanya dan mendesaknya agar tidak memasuki teater itu.[b]
  rationale: Revisi menyederhanakan konstruksi partitif agar lebih alami, mempertahankan gelar teknis “Asiarkh,” dan memperbaiki catatan budaya supaya tidak melampaui kepastian historis. Terjemahan “memasuki teater itu” tetap menyampaikan maksud μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον dalam konteks kerusuhan, sementara catatan alternatif mempertahankan kemungkinan nuansa “menampilkan diri.”
