  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: id
  text: Bahkan beberapa Asiarkh[a], yang bersahabat dengan Paulus, mengirim pesan kepadanya dan mendesaknya agar tidak memasuki teater itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asiarkh adalah tokoh atau pejabat terkemuka yang terkait dengan Provinsi Asia pada masa Kekaisaran Romawi.
    reason: cultural_note
  - marker: b
    text: Atau, “agar tidak menampilkan diri di teater itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Bahkan beberapa orang
  rationale: τινές menyatakan sejumlah orang yang tidak disebutkan secara khusus, sedangkan καί memberi penekanan yang secara alami ditangkap oleh “bahkan.” δέ berfungsi sebagai penghubung naratif dan tidak perlu diterjemahkan tersendiri karena alur Indonesia sudah jelas.
- source_word: τῶν Ἀσιαρχῶν
  choice: dari kalangan para Asiarkh
  rationale: Istilah teknis Ἀσιάρχης dipertahankan melalui transliterasi agar tidak diratakan menjadi sebutan pejabat umum; bentuk partitif diterjemahkan “dari kalangan.”
- source_word: ὄντες αὐτῷ φίλοι
  choice: yang bersahabat dengan Paulus
  rationale: Ungkapan ini menyatakan hubungan persahabatan atau sikap bersahabat. Nama Paulus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah makna.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: mengirim pesan kepadanya
  rationale: Objek tindakan mengirim tersirat dalam bahasa Yunani; “pesan” dilengkapi secara idiomatis sesuai konteks komunikasi kepada Paulus.
- source_word: παρεκάλουν
  choice: mendesaknya
  rationale: Imperfek menunjukkan desakan yang berlangsung atau sungguh-sungguh; “mendesak” membawa daya permohonan kuat tanpa melebihkannya menjadi “memohon-mohon.”
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: agar tidak masuk ke gedung pertunjukan itu
  rationale: Secara harfiah ungkapan ini berarti tidak menyerahkan atau menempatkan diri ke dalam teater. Dalam konteks ancaman massa, maksud idiomatisnya ialah tidak masuk dan menghadapkan diri di sana; alternatif literal dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Gedung pertunjukan” dipilih untuk θέατρον karena yang dimaksud ialah bangunan umum tempat kerumunan berkumpul, bukan seni teater sebagai kegiatan. Istilah teknis “Asiarkh” dijelaskan lewat catatan budaya.
