  source_fidelity: 'Teks utama pada dasarnya setia: τινὲς ... καί ditangkap oleh “Bahkan beberapa,” bentuk partitif ἐκ τῶν Ἀσιαρχῶν dipertahankan, dan tindakan mengirim pesan serta desakan untuk tidak memasuki θέατρον diterjemahkan sesuai konteks. Namun, catatan budaya semula terlalu spesifik dan berpotensi menyajikan rekonstruksi jabatan Asiarkh yang diperdebatkan sebagai kepastian.'
  naturalness: “Beberapa Asiarkh” lebih ringkas dan alami daripada “beberapa orang dari kalangan para Asiarkh.” “Teater itu” merupakan sebutan baku dan cukup jelas untuk bangunan/arena pertemuan yang dimaksud konteks ini; “memasuki” menyampaikan gerak εἰς dengan lebih tepat daripada sekadar “masuk.”
  terminology: “Asiarkh” patut dipertahankan sebagai gelar teknis dan dijelaskan secara netral. Catatan alternatif untuk μὴ δοῦναι ἑαυτόν sebaiknya tidak menyebut parafrasa idiomatis sebagai “secara harfiah”; “menampilkan diri” merupakan alternatif yang memadai.
