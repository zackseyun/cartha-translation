- from: Sebab, kalian telah membawa orang-orang ini ke sini, padahal mereka bukan perampok kuil dan juga tidak menghujat dewi kita.[a]
  to: Sebab kalian telah membawa para pria ini ke sini, yang bukan perampok kuil ataupun penghujat dewi kita.[a]
  rationale: Revisi menghapus nuansa konsesif tambahan dari “padahal”, memperjelas bahwa ἄνδρας merujuk kepada pria, dan memperbaiki penjelasan gramatikal dalam catatan kaki. Makna pokok, nada pembelaan hukum, serta rujukan kepada Artemis tetap dipertahankan.
