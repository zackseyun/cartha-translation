    rationale: Dalam frasa yang dicetak SBLGNT, penanda feminin yang relevan ialah artikel τήν; θεός sendiri adalah kata umum untuk dewa/ilah. Catatan perlu membedakan bentuk kata dari rujukan kontekstual kepada Artemis.
