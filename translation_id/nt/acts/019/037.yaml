  - severity: low
    issue: “Orang-orang ini” tidak secara jelas mempertahankan rujukan maskulin ἄνδρας.
    rationale: Walaupun dapat diterima secara idiomatis, “para pria ini” mempertahankan makna “men” tanpa menjadi tidak alami.
  - severity: medium
