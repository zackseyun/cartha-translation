  naturalness: 'Teks revisi memakai bahasa Indonesia baku modern yang wajar untuk ujaran resmi: “Sebab kalian telah membawa para pria ini ke sini, yang bukan ...”. Korelasi “bukan ... ataupun ...” jelas dan alami.'
  terminology: “Perampok kuil” tepat untuk ἱεροσύλους, dan “penghujat dewi kita” menyampaikan βλασφημοῦντας τὴν θεὸν ἡμῶν secara ringkas dan sesuai konteks Artemis. Catatan kaki diperbaiki agar tidak menyatakan bahwa bentuk leksikal θεός sendiri feminin; artikel feminin dan konteks menandai rujukan kepada dewi.
  issues:
