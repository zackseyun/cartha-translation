  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: id
  text: Sebab kalian telah membawa para pria ini ke sini, yang bukan perampok kuil ataupun penghujat dewi kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani theos berarti “dewa” atau “ilah”; artikel feminin tēn dan konteks Efesus menunjukkan bahwa yang dimaksud ialah Artemis, seorang dewi.
    reason: Menjelaskan dasar bahasa sumber dan konteks bagi pemakaian “dewi”.
lexical_decisions:
- source_word: ἠγάγετε
  choice: kalian telah membawa ... ke sini
  rationale: Aoristus ἄγω menyatakan tindakan yang telah terjadi. Dalam konteks sidang umum, frasa ini secara alami menyampaikan bahwa orang-orang tersebut dibawa ke tempat pertemuan.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendukung pernyataan sebelumnya.
- source_word: τοὺς ἄνδρας τούτους
  choice: orang-orang ini
  rationale: ἀνήρ menunjuk kepada laki-laki yang sedang dibicarakan. Dalam bahasa Indonesia, 'orang-orang ini' terdengar alami dan daya tunjuk τούτους diperjelas oleh 'ke sini' pada predikat.
- source_word: οὔτε ἱεροσύλους οὔτε βλασφημοῦντας
  choice: bukan perampok kuil dan juga tidak menghujat
  rationale: Susunan 'bukan ... dan juga tidak ...' mempertahankan dua penyangkalan Yunani sambil menyesuaikan bentuk nomina pada unsur pertama dan verba pada unsur kedua dalam bahasa Indonesia.
- source_word: ἱεροσύλους
  choice: perampok kuil
  rationale: Istilah ini terutama menunjuk kepada orang yang merampok kuil atau menjarah harta suci; terjemahan konkret ini paling sesuai dengan konteks pembelaan hukum.
- source_word: βλασφημοῦντας
  choice: menghujat
  rationale: Partisipel ini menunjuk kepada perkataan yang mencela atau menghina dewa; 'menghujat' ringkas dan sesuai dengan konteks keagamaan.
- source_word: τὴν θεὸν ἡμῶν
  choice: dewi kita
  rationale: Artikel feminin τὴν dan konteks Efesus menunjukkan bahwa yang dimaksud ialah Artemis. 'Dewi kita' menyampaikan rujukan tersebut secara alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan θεὸν ἡμῶν yang merujuk kepada Artemis
  choice: dewi kita
  alternative: ilah kita / allah kita
  rationale: Pembicara adalah pejabat Efesus yang merujuk kepada Artemis. 'Dewi' menyatakan referen perempuan dengan jelas tanpa menyiratkan bahwa pembicara sedang merujuk kepada Allah yang disembah umat Kristen; ini merupakan keputusan leksikal-kontekstual, bukan pengakuan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar bagi pidato resmi di depan sidang umum. 'Kalian' mempertahankan sapaan orang kedua jamak secara jelas; 'padahal' mengungkapkan kontras pembelaan yang tersirat dalam dua penyangkalan.
