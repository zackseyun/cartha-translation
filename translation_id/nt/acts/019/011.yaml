lexical_decisions:
- source_word: Δυνάμεις
  choice: berbagai mukjizat
  rationale: Bentuk jamak δύναμις di sini menunjuk pada perbuatan-perbuatan ajaib yang menyatakan kuasa, bukan kuasa abstrak. 'Berbagai mukjizat' menyampaikan makna peristiwa dan kejamakannya secara alami.
- source_word: τε
  choice: Dan
  rationale: Partikel τε menghubungkan pernyataan ini dengan narasi sebelumnya; 'Dan' merupakan penghubung yang wajar dalam bahasa Indonesia.
- source_word: οὐ τὰς τυχούσας
  choice: yang luar biasa
  rationale: Ungkapan ini secara harfiah berarti 'yang bukan biasa' atau 'bukan sembarangan'. 'Yang luar biasa' mempertahankan penekanannya dalam bahasa Indonesia yang alami.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Allah adalah subjek gramatikal yang melakukan mukjizat, sehingga pelaku ilahi dinyatakan dengan jelas.
- source_word: ἐποίει
  choice: terus melakukan
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang pada masa lampau. Dalam alur narasi lampau bahasa Indonesia, 'terus melakukan' menyampaikan aspek tersebut tanpa memerlukan penanda kala khusus.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: melalui tangan Paulus
  rationale: διά dengan genitif menandai sarana atau perantaraan. Ungkapan konkret 'melalui tangan Paulus' dipertahankan untuk menegaskan bahwa Paulus adalah perantara manusia, sedangkan Allah adalah pelakunya.
- source_word: Παύλου
  choice: Paulus
  rationale: Nama ini dialihaksarakan menurut bentuk baku yang telah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku mukjizat
  choice: Allah ditampilkan sebagai pelaku mukjizat, sedangkan Paulus menjadi perantara.
  alternative: Paulus melakukan mukjizat-mukjizat itu.
  rationale: Dalam bahasa Yunani, ὁ θεὸς adalah subjek ἐποίει, sedangkan διὰ τῶν χειρῶν Παύλου menyatakan perantaraan. Susunan terjemahan mempertahankan pembedaan ini tanpa menganggap Paulus memiliki kuasa mandiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'melalui tangan Paulus' mempertahankan idiom sumber, sedangkan 'terus melakukan' menyampaikan sifat berlangsung atau berulang dari bentuk imperfek.
