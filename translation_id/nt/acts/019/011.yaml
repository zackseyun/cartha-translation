  naturalness: “Allah melakukan mukjizat-mukjizat yang luar biasa melalui tangan Paulus” adalah bahasa Indonesia baku dan jelas. Pengulangan “mukjizat-mukjizat” secara wajar mempertahankan bentuk jamak tanpa menambahkan makna “berbagai.”
  terminology: “Allah,” “mukjizat,” dan “Paulus” sesuai dengan pemakaian Indonesia modern dan dengan fungsi istilah sumber. “Melalui tangan Paulus” mempertahankan idiom instrumental tanpa menjadikan Paulus pelaku mandiri.
