  text: Dan Allah terus melakukan mukjizat-mukjizat yang luar biasa melalui tangan Paulus,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tindakan-tindakan kuasa yang tidak biasa.”
