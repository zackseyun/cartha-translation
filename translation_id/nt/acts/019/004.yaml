  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: id
  text: Lalu Paulus berkata, “Yohanes membaptis dengan baptisan pertobatan[a] dan mengatakan kepada orang-orang agar mereka percaya kepada Dia yang datang sesudahnya, yaitu kepada Yesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Yohanes membaptis baptisan pertobatan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ Παῦλος
  choice: Lalu Paulus berkata
  rationale: Kata penghubung δέ menandai kelanjutan dalam percakapan dan secara alami diterjemahkan “lalu”; urutan subjek-predikat disesuaikan dengan bahasa Indonesia.
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: membaptis dengan baptisan pertobatan
  rationale: Mempertahankan hubungan kata serumpun βαπτίζω–βάπτισμα sambil memakai susunan bahasa Indonesia yang wajar. “Pertobatan” menyatakan ciri atau isi baptisan itu tanpa menambahkan klaim tentang dampaknya.
- source_word: τῷ λαῷ
  choice: kepada orang-orang
  rationale: Menerjemahkan rujukan kolektif λαός tanpa mempersempitnya secara eksplisit menjadi bangsa Israel atau mengubahnya menjadi kerumunan.
- source_word: λέγων
  choice: dan mengatakan
  rationale: Partisipel ini menyatakan pemberitaan yang menyertai tindakan Yohanes. Bentuk ini alami dalam bahasa Indonesia dan tetap membedakan baptisan dari pesan yang disampaikannya.
- source_word: ἵνα πιστεύσωσιν
  choice: agar mereka percaya
  rationale: ἵνα sesudah verba berbicara dapat menyampaikan isi yang dimaksudkan sekaligus nuansa tujuan. “Agar mereka percaya” mempertahankan keluwesan itu.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: kepada Dia yang datang sesudahnya
  rationale: Dengan πιστεύω, εἰς menunjuk objek kepercayaan dan secara idiomatis diterjemahkan “percaya kepada”. ἐρχόμενον dipertahankan sebagai “yang datang”, sedangkan μετ’ αὐτόν menunjukkan urutan sesudah Yohanes.
- source_word: τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν
  choice: yaitu kepada Yesus
  rationale: “Yaitu” menyampaikan rumusan penjelas τοῦτ’ ἔστιν. Preposisi “kepada” menggemakan objek dari “percaya”, dan tidak ditambahkan gelar yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Hubungan baptisan Yohanes dengan iman kepada Yesus
  choice: Baptisan Yohanes digambarkan sebagai baptisan pertobatan yang disertai pesan agar orang-orang percaya kepada Dia yang datang sesudah Yohanes, yakni Yesus.
  alternative: Baptisan Yohanes dengan sendirinya menghasilkan iman Kristen.
  rationale: Sintaksis membedakan tindakan membaptis dari pesan yang menyertainya. Terjemahan tidak menyatakan lebih jauh bagaimana baptisan itu berhubungan secara sakramental atau kausal dengan iman.
- issue: Identitas orang yang datang sesudah Yohanes
  choice: Frasa itu dijelaskan secara eksplisit sebagai Yesus.
  alternative: Membiarkan tokoh yang datang sesudah Yohanes tidak disebutkan.
  rationale: Klausa τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν secara langsung mengidentifikasi tokoh tersebut sebagai Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara pengulangan akar kata pada “membaptis dengan baptisan” dipertahankan untuk mencerminkan konstruksi Yunani. Huruf kapital pada “Dia” dipakai karena acuannya langsung dijelaskan sebagai Yesus, bukan untuk menambahkan gelar teologis.
