  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: id
  text: Setelah mendengar hal itu, mereka dibaptis dalam nama Tuhan Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke dalam nama Tuhan Yesus.”'
    reason: Mencatat bentuk harfiah εἰς τὸ ὄνομα, sementara teks utama memakai padanan Indonesia yang idiomatis.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Setelah mendengar hal itu
  rationale: Partisip aorist ini berfungsi secara temporal. Frasa “hal itu” menyatakan objek yang tersirat dari perkataan sebelumnya dan membuat kalimat wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung ringan dalam alur narasi. Hubungan kelanjutan sudah tersampaikan secara alami oleh susunan kalimat bahasa Indonesia tanpa perlu menambahkan kontras.
- source_word: ἐβαπτίσθησαν
  choice: mereka dibaptis
  rationale: Bentuk pasif aorist dipertahankan dengan ungkapan pasif yang baku dan alami dalam bahasa Indonesia.
- source_word: εἰς τὸ ὄνομα
  choice: ke dalam nama
  rationale: “Ke dalam” mempertahankan daya arah dan hubungan dari εἰς, sehingga tidak langsung meratakan ungkapan Yunani menjadi rumusan tradisional “dalam nama”.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Dalam konteks kristologis ini, κύριος merupakan gelar bagi Yesus. “Tuhan” adalah padanan Indonesia yang baku.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan yang berkaitan dengan baptisan
  choice: ke dalam nama Tuhan Yesus
  alternative: dalam nama Tuhan Yesus
  rationale: Teks Yunani memakai εἰς τὸ ὄνομα. Terjemahan utama mempertahankan nuansa arah atau pengidentifikasian dari εἰς tanpa menentukan lebih jauh makna teologisnya, sedangkan bentuk tradisional dan lebih idiomatis dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan temporal dibuat alami, sementara ungkapan “ke dalam nama” sengaja mempertahankan bentuk serta ketegangan semantis teks Yunani; alternatif yang lebih lazim disediakan dalam catatan kaki.
