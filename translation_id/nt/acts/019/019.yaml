id: ACT.19.19
reference: Acts 19:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: id
  text: Banyak juga di antara mereka yang pernah melakukan praktik sihir mengumpulkan kitab-kitab mereka lalu membakarnya di depan semua orang. Mereka menghitung nilai kitab-kitab itu dan mendapati jumlahnya lima puluh ribu uang perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lima laksa perak,” yaitu lima puluh ribu satuan uang perak. Jenis koinnya tidak disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: banyak
  rationale: Dalam konteks ini kata tersebut menunjuk pada sejumlah besar orang, bukan sekadar jumlah yang memadai.
- source_word: τὰ περίεργα πραξάντων
  choice: yang pernah melakukan praktik sihir
  rationale: Ungkapan ini dalam konteks Efesus menunjuk pada kegiatan magis atau okultis. 'Praktik sihir' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: mengumpulkan kitab-kitab mereka
  rationale: Partisip ini menggambarkan tindakan membawa dan menghimpunkan tulisan-tulisan tersebut di satu tempat. 'Kitab-kitab' sesuai untuk kumpulan tulisan yang berkaitan dengan praktik sihir dalam konteks kuno.
- source_word: κατέκαιον
  choice: lalu membakarnya
  rationale: Imperfek Yunani menggambarkan tindakan pembakaran, tetapi bentuk lampau progresif tidak perlu dinyatakan secara kaku dalam bahasa Indonesia; konteks naratif tetap menyampaikan berlangsungnya tindakan itu.
- source_word: ἐνώπιον πάντων
  choice: di depan semua orang
  rationale: Terjemahan ini jelas menyatakan bahwa tindakan tersebut dilakukan secara terbuka dan disaksikan umum.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: menghitung nilai kitab-kitab itu
  rationale: Kata kerja berarti menghitung atau menjumlahkan, sedangkan τιμή di sini adalah nilai uang. Pengulangan 'kitab-kitab itu' menghindari ambiguitas pronomina.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: lima puluh ribu uang perak
  rationale: Secara harfiah berarti 'lima laksa perak', yakni lima puluh ribu satuan perak. Karena jenis koin tidak disebutkan, terjemahan tidak menambahkan denominasi tertentu.
theological_decisions:
- issue: Makna τὰ περίεργα dalam konteks Efesus
  choice: praktik sihir
  alternative: praktik okultis; hal-hal yang aneh atau khusus
  rationale: Konteks terdekat mencakup pengusiran roh jahat dan pemusnahan tulisan magis yang mahal. 'Praktik sihir' menyatakan latar religius-historis itu tanpa mempersempitnya pada doktrin tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Diksi 'praktik sihir' dipilih agar mudah dipahami; 'kitab-kitab' mempertahankan nuansa tulisan atau buku kuno. Penanda catatan kaki ditempatkan langsung sesudah jumlah uang yang dijelaskannya.
