  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur kalimat dibuat alami tanpa menghapus pengulangan nama Aleksander atau perbedaan antara ὄχλος dan δῆμος. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
