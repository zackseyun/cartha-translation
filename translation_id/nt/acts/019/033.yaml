  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: id
  text: Dari antara orang banyak itu, mereka membawa Aleksander ke depan[a], karena orang-orang Yahudi mendorongnya maju. Lalu Aleksander memberi isyarat dengan tangannya dan hendak menyampaikan pembelaan kepada sidang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka mengajukan Aleksander ... orang-orang Yahudi telah mengajukannya.” Bahasa Yunani memakai dua kata kerja yang berkaitan untuk tindakan membawa Aleksander tampil di muka umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kepada rakyat itu.” Istilah Yunani di sini bernuansa publik-kewargaan dan berbeda dari istilah “orang banyak” pada awal ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: membawa ... ke depan
  rationale: Dengan Aleksander sebagai objek dan frasa 'dari antara orang banyak', verba ini paling wajar menunjuk pada tindakan membawa atau menampilkan dia ke depan di muka umum, bukan mengajar atau memberi petunjuk.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: setelah orang-orang Yahudi mendorongnya maju
  rationale: Genetivus absolutus ini menjelaskan tindakan orang-orang Yahudi yang membuat Aleksander tampil ke depan. 'Mendorongnya maju' mempertahankan daya situasional tanpa harus menyiratkan kekerasan.
- source_word: κατασείσας τὴν χεῖρα
  choice: memberi isyarat dengan tangannya
  rationale: Ungkapan ini menunjuk pada gerakan tangan untuk menarik perhatian; terjemahan tidak menambahkan tujuan 'meminta diam' yang masuk akal tetapi tidak dinyatakan secara eksplisit.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: hendak menyampaikan pembelaan
  rationale: Bentuk ini menyatakan kehendak atau niat, bukan tindakan yang sudah terlaksana. 'Menyampaikan pembelaan' mempertahankan nuansa pembelaan resmi di muka umum.
- source_word: τῷ δήμῳ
  choice: di hadapan sidang itu
  rationale: δῆμος di sini memiliki nuansa publik-kewargaan dan merujuk pada warga yang berhimpun; 'sidang' membedakannya dari ὄχλος, yaitu orang banyak secara umum.
- source_word: ὄχλου
  choice: orang banyak
  rationale: '''Orang banyak'' merupakan ungkapan Indonesia yang alami bagi massa umum dan membedakannya dari sidang publik pada akhir ayat.'
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Aleksander
  rationale: Nama Yunani dialihaksarakan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
