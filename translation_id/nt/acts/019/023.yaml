  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: id
  text: Pada waktu itu timbullah kegemparan yang tidak kecil mengenai Jalan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jalan itu.” Di sini ungkapan tersebut merujuk pada gerakan pengikut Yesus dan berulang kali dipakai sebagai sebutan bagi gerakan itu dalam Kisah Para Rasul.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: timbullah
  rationale: Bentuk ini menyampaikan munculnya suatu peristiwa secara idiomatis dalam narasi Indonesia, dengan τάραχος sebagai hal yang timbul.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung wacana ringan; dalam konteks ini kesinambungan narasi sudah alami tanpa kata penghubung eksplisit.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Pada waktu itu
  rationale: Ungkapan temporal ini secara langsung dan alami menunjuk pada masa yang sedang dibicarakan.
- source_word: τάραχος
  choice: kekacauan
  rationale: Kata ini menyatakan keadaan gaduh atau tidak tertib tanpa lebih dahulu mempersempitnya menjadi kerusuhan atau huru-hara.
- source_word: οὐκ ὀλίγος
  choice: yang tidak kecil
  rationale: Mempertahankan litotes Lukas alih-alih meratakannya menjadi 'besar' atau 'hebat'.
- source_word: περὶ
  choice: mengenai
  rationale: Menandai perkara yang menjadi pokok kekacauan dengan bahasa Indonesia baku dan jelas.
- source_word: τῆς ὁδοῦ
  choice: Jalan itu
  rationale: Dalam Kisah Para Rasul, ungkapan ini berfungsi sebagai sebutan yang dikenal bagi gerakan pengikut Yesus; huruf kapital menandai fungsi nama tersebut tanpa menghapus arti harfiahnya.
theological_decisions:
- issue: τῆς ὁδοῦ sebagai sebutan bagi gerakan Kristen
  choice: Jalan itu
  alternative: jalan itu
  rationale: Konteks dan pemakaian berulang dalam Kisah Para Rasul menunjukkan sebutan khusus bagi gerakan pengikut Yesus. Kapitalisasi membantu pembaca mengenalinya, sedangkan catatan kaki mempertahankan kemungkinan bentuk generiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Litotes sumber dipertahankan, sedangkan penghubung δέ tidak dibuat eksplisit karena tidak diperlukan untuk kelancaran bahasa sasaran.
