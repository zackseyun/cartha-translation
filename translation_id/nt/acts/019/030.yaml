  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: id
  text: Namun, ketika Paulus hendak masuk ke tengah-tengah orang banyak[a], murid-murid tidak mengizinkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke dalam perhimpunan" atau "ke tengah-tengah kerumunan." Kata Yunani δῆμος dapat merujuk pada sidang warga yang berhimpun dalam konteks sipil ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: Paulus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia untuk Παῦλος.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari tindakan orang banyak kepada niat Paulus.
- source_word: βουλομένου
  choice: ketika Paulus hendak
  rationale: Konstruksi genitif absolut menyatakan niat Paulus; 'hendak' alami dan mempertahankan unsur kehendak atau maksud.
- source_word: εἰσελθεῖν
  choice: masuk
  rationale: Menyatakan gerakan memasuki tempat atau kelompok yang sedang berkumpul.
- source_word: εἰς τὸν δῆμον
  choice: ke tengah-tengah orang banyak
  rationale: Dalam konteks teater di Efesus, δῆμος dapat menunjuk kepada rakyat yang berhimpun atau sidang warga. Pilihan ini alami dalam bahasa Indonesia dan tidak memastikan bahwa perhimpunan itu resmi.
- source_word: οὐκ εἴων
  choice: tidak mengizinkannya
  rationale: Bentuk imperfek menyampaikan penolakan atau pencegahan yang berlangsung; konteks membuat tindakan menghalangi Paulus jelas.
- source_word: οἱ μαθηταί
  choice: murid-murid
  rationale: Padanan langsung yang mempertahankan nuansa pengikut atau pelajar tanpa menambahkan kepemilikan yang tidak dinyatakan.
