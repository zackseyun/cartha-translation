revisions:
- from: Namun, beberapa pengusir roh jahat Yahudi yang berkeliling juga mencoba menyebut nama Tuhan Yesus atas orang-orang yang memiliki roh-roh jahat[a]. Mereka berkata, “Aku menyumpahi kalian demi Yesus yang diberitakan Paulus.”[b]
