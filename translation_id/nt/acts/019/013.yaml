id: ACT.19.13
reference: Acts 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: id
  text: Tetapi, beberapa pengusir roh jahat Yahudi yang berkeliling juga mencoba menyerukan nama Tuhan Yesus atas orang-orang yang memiliki roh-roh jahat[a]. Mereka berkata, “Aku menyumpah kalian demi Yesus yang diberitakan Paulus.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang mempunyai roh-roh jahat”; dalam konteks ini dapat berarti orang-orang yang berada di bawah pengaruh roh-roh jahat.
    reason: lexical_alternative
  - marker: b
    text: “Aku menyumpah kalian” juga dapat diterjemahkan “Aku mengikat kalian dengan sumpah demi Yesus” atau “Aku menuntut kalian bersumpah demi Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: mencoba
  rationale: Kata kerja ini menyatakan usaha atau tindakan yang dicoba, tanpa menyiratkan bahwa tindakan itu berhasil.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: beberapa pengusir roh jahat Yahudi yang berkeliling juga
  rationale: τινες berarti 'beberapa'; καί memberi nuansa tambahan 'juga'; περιερχομένων menunjukkan bahwa mereka berpindah-pindah tempat. 'Pengusir roh jahat' lebih mudah dipahami pembaca umum daripada istilah teknis 'eksorsis'.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: menyebut nama ... atas
  rationale: Ungkapan ini menggambarkan penggunaan atau pemanggilan nama dalam formula pengusiran roh. 'Menyebut nama ... atas' mempertahankan citra dan susunan sumber tanpa mengurangi tindakan itu menjadi sekadar penyebutan biasa dalam konteks ini.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: orang-orang yang memiliki roh-roh jahat
  rationale: Terjemahan ini dekat dengan ungkapan harfiah 'mereka yang mempunyai roh-roh jahat' dan tidak mempertegasnya menjadi 'kerasukan', yang lebih interpretatif.
- source_word: τὰ πνεύματα τὰ πονηρά
  choice: roh-roh jahat
  rationale: Bentuk Yunani jamak dipertahankan; πονηρά secara wajar berarti 'jahat' dalam konteks spiritual.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: nama Tuhan Yesus
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia yang mempertahankan bobot gelar κύριος.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Aku menyumpahi kalian
  rationale: ὁρκίζω berarti mengikat atau mendesak dengan sumpah. 'Menyumpahi' mempertahankan nada formula pengusiran roh, sedangkan 'kalian' mencerminkan objek jamak ὑμᾶς.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: demi Yesus yang diberitakan Paulus
  rationale: Akusatif sesudah ὁρκίζω menyatakan pribadi yang menjadi dasar sumpah, sehingga diterjemahkan 'demi Yesus'. κηρύσσει berarti memberitakan atau memaklumkan secara terbuka.
theological_decisions:
- issue: Penerjemahan κύριος dalam frasa kristologis τοῦ κυρίου Ἰησοῦ
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan Yesus'' merupakan padanan baku yang mempertahankan bobot kehormatan dan teologis gelar κύριος dalam Kisah Para Rasul.'
- issue: Apakah kerasukan perlu dibuat eksplisit dalam τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: orang-orang yang memiliki roh-roh jahat
  alternative: orang-orang yang kerasukan roh-roh jahat
  rationale: Teks Yunani secara harfiah mengatakan bahwa mereka 'memiliki' roh-roh jahat. Walaupun kerasukan mungkin dimaksudkan dalam konteks ini, terjemahan utama tidak menambahkan tingkat ketegasan yang tidak dinyatakan langsung.
- issue: Daya formula Ὁρκίζω ὑμᾶς
  choice: Aku menyumpahi kalian demi Yesus
  alternative: Aku memerintahkan kalian dengan sungguh-sungguh demi Yesus
  rationale: Pilihan utama mempertahankan unsur sumpah dalam kata Yunani dan tidak mengubahnya menjadi perintah biasa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'pengusir roh jahat' dipilih agar langsung dipahami pembaca umum. Susunan kalimat dipecah menjadi dua agar kutipan terbaca alami, tanpa mengubah hubungan sintaksis. Penanda kaki [a] dan [b] keduanya hadir dalam teks utama.
