id: ACT.19.17
reference: Acts 19:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: id
  text: Peristiwa itu diketahui oleh semua orang Yahudi dan orang Yunani yang tinggal di Efesus. Mereka semua diliputi rasa takut, dan nama Tuhan Yesus makin dimuliakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Peristiwa itu
  rationale: Demonstrativa tunggal ini menunjuk kembali pada kejadian sebelumnya. 'Peristiwa itu' memperjelas acuannya secara alami tanpa menambah rincian.
- source_word: ἐγένετο γνωστὸν
  choice: diketahui
  rationale: Ungkapan ini menyatakan bahwa kejadian tersebut menjadi diketahui secara luas; bentuk Indonesia yang ringkas dan alami adalah 'diketahui'.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: oleh semua orang Yahudi dan orang Yunani
  rationale: Datif menunjukkan kelompok yang mengetahui kejadian itu. Pengulangan 'orang' menghasilkan susunan Indonesia yang jelas dan wajar.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: yang tinggal di Efesus
  rationale: κατοικέω berarti menetap atau tinggal; pilihan ini alami dalam bahasa Indonesia modern dan menerangkan kedua kelompok.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Mereka semua diliputi rasa takut
  rationale: Terjemahan ini mempertahankan gambaran rasa takut yang datang dan menguasai mereka, tetapi menghindari ungkapan harfiah 'ketakutan jatuh ke atas' yang tidak alami dalam bahasa Indonesia.
- source_word: φόβος
  choice: rasa takut
  rationale: φόβος dapat mencakup takut, gentar, atau rasa takjub. 'Rasa takut' merupakan pilihan paling luas dan paling sedikit menafsirkan.
- source_word: ἐμεγαλύνετο
  choice: makin dimuliakan
  rationale: Imperfek pasif menggambarkan proses atau keadaan yang terus berkembang. 'Makin dimuliakan' menyampaikan aspek berlangsung dan penghormatan publik dengan alami.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Mempertahankan kata eksplisit 'nama' menjaga gema sastra dan teologis yang dapat mencakup pribadi, wibawa, dan kehormatan.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: κύριος berfungsi sebagai gelar bagi Yesus; 'Tuhan' adalah padanan baku dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan fungsi kristologis gelar κύριος dalam konteks ini tanpa memparafrasekannya.'
- issue: Apakah τὸ ὄνομα diterjemahkan secara idiomatis sebagai reputasi
  choice: nama Tuhan Yesus
  alternative: nama baik atau reputasi Tuhan Yesus
  rationale: Mempertahankan 'nama' menjaga keluasan makna Alkitabiah—pribadi, wibawa, dan kehormatan Yesus—tanpa mempersempitnya menjadi reputasi saja.
- issue: Nuansa ἐμεγαλύνετο
  choice: makin dimuliakan
  alternative: makin dijunjung tinggi
  rationale: '''Dimuliakan'' menyampaikan penghormatan yang meningkat dan bentuk pasifnya, sambil mempertahankan bobot teologis ungkapan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat pertama dan kedua dipisahkan demi keterbacaan; hubungan antarklausa tetap dipertahankan. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks tanpa menghilangkan ambiguitas penting.
