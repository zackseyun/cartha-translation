  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: id
  text: Setelah menenangkan orang banyak itu, panitera kota berkata, “Saudara-saudara warga Efesus, siapakah di antara manusia yang tidak tahu bahwa kota Efesus adalah penjaga kuil Artemis yang agung[a] serta benda yang jatuh dari langit[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemelihara kuil Artemis yang agung.” Istilah Yunani ini menunjuk pada kota yang diakui sebagai penjaga atau pemelihara sebuah kuil dan kultusnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “benda yang jatuh dari langit.” Kemungkinan yang dimaksud ialah patung kultus yang dikaitkan dengan Artemis dan dipercaya telah jatuh dari langit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: Setelah menenangkan
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: ὁ γραμματεὺς
  choice: panitera kota
  rationale: Dalam konteks pemerintahan Efesus, istilah ini menunjuk pejabat administratif kota, bukan ahli Taurat atau penyalin.
- source_word: τὸν ὄχλον
  choice: orang banyak itu
  rationale: Ungkapan ini wajar untuk kerumunan yang sedang bergejolak dan artikel Yunani tercermin melalui kata 'itu'.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Saudara-saudara warga Efesus
  rationale: Sapaan ini ditujukan kepada kaum laki-laki Efesus dalam pertemuan umum. Bentuk Indonesia ini mempertahankan fungsi sapaan kepada para pria tanpa menghasilkan ungkapan kaku seperti 'Laki-laki Efesus'.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: siapakah yang tidak tahu
  rationale: Menyampaikan pertanyaan retoris Yunani secara alami; cakupan universalnya tetap jelas tanpa mempertahankan idiom yang terasa janggal dalam bahasa Indonesia.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: kota Efesus
  rationale: Padanan geografis yang paling alami dalam bahasa Indonesia untuk kota milik atau kota orang Efesus.
- source_word: νεωκόρον
  choice: penjaga kuil
  rationale: Istilah ini menyatakan status kota sebagai pemelihara atau pengemban kehormatan kuil dan kultus; alternatif dijelaskan dalam catatan.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: Artemis yang agung
  rationale: Mempertahankan gelar kultis dengan artikel dan adjektiva tanpa menambahkan penilaian penerjemah.
- source_word: τοῦ διοπετοῦς
  choice: benda yang jatuh dari langit
  rationale: Bentuk Yunani secara harfiah menunjuk sesuatu yang dipercaya jatuh dari langit, tetapi tidak menyebut 'patung' secara eksplisit; pilihan ini mempertahankan ketidakjelasan referennya.
theological_decisions:
- issue: Pernyataan keagamaan kafir tentang Artemis dan διοπετές
  choice: 'Menyajikannya sebagai klaim langsung sang pejabat: kota itu adalah ''penjaga kuil Artemis yang agung dan benda yang jatuh dari langit.'''
  alternative: Menjadikannya lebih eksplisit sebagai 'penjaga kuil Artemis yang agung dan patungnya yang jatuh dari langit.'
  rationale: Ayat ini melaporkan keyakinan atau kebanggaan religius pembicara, bukan membenarkannya sebagai fakta. 'Benda' mempertahankan ketidakjelasan leksikal Yunani, sedangkan catatan menjelaskan bahwa benda itu mungkin dipahami sebagai patung kultus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Panitera kota' menandai jabatan sipil; sapaan 'Saudara-saudara warga Efesus' dibuat wajar bagi pembaca modern. Catatan kaki mempertahankan nuansa teknis νεωκόρος dan ketidakjelasan διοπετές.
