id: ACT.19.10
reference: Acts 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: id
  text: Hal ini berlangsung selama dua tahun, sehingga semua orang yang tinggal di Asia[a] mendengar firman Tuhan, baik orang Yahudi maupun orang Yunani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Provinsi Asia dalam Kekaisaran Romawi, di bagian barat Asia Kecil, bukan benua Asia modern.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Hal ini berlangsung
  rationale: Dalam konteks, frasa ini merujuk pada kegiatan mengajar yang disebut pada ayat sebelumnya dan berlangsung selama jangka waktu tertentu. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan kesinambungan kegiatan tersebut.
- source_word: ἐπὶ ἔτη δύο
  choice: selama dua tahun
  rationale: ἐπί dengan penunjuk waktu dalam bentuk akusatif menyatakan durasi; 'selama dua tahun' merupakan padanan Indonesia yang wajar.
- source_word: ὥστε
  choice: sehingga
  rationale: ὥστε memperkenalkan hasil dari kegiatan sebelumnya; 'sehingga' mempertahankan daya resultatifnya.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: semua orang yang tinggal di Asia
  rationale: Partisip substantival κατοικοῦντας menunjuk kepada orang-orang yang menetap atau tinggal di suatu tempat, sedangkan πάντας mempertahankan cakupan universal ungkapan tersebut.
- source_word: ἀκοῦσαι
  choice: mendengar
  rationale: Infinitif aoris setelah ὥστε menyatakan hasil bahwa mereka mendengar; terjemahan langsung ini tidak menambahkan nuansa yang tidak tersurat.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος di sini menunjuk pada berita yang diberitakan dan merupakan istilah berulang dalam Kisah Para Rasul. 'Firman' mempertahankan tekstur teologis ungkapan itu dalam ragam Alkitab Indonesia yang umum dan bermartabat.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Genitif ini paling alami menerangkan λόγον, sehingga membentuk ungkapan 'firman Tuhan'.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: baik orang Yahudi maupun orang Yunani
  rationale: Konstruksi τε καὶ menghubungkan kedua kelompok secara inklusif; bentuk 'baik ... maupun ...' alami dan mempertahankan penekanan pada keduanya.
theological_decisions:
- issue: Arti 'Asia'
  choice: Asia dipertahankan sebagai nama provinsi Romawi di bagian barat Asia Kecil.
  alternative: Asia sebagai benua modern atau kawasan benua yang lebih luas.
  rationale: Dalam Kisah Para Rasul, Ἀσία lazimnya menunjuk pada provinsi Romawi. Nama itu dipertahankan dalam teks, sedangkan catatan kaki mencegah pembacaan anakronistis.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Struktur kalimat mempertahankan hubungan durasi dan hasil dalam teks Yunani. Penanda catatan kaki ditempatkan langsung setelah 'Asia' agar rujukannya tidak ambigu.
