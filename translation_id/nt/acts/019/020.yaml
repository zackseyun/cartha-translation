  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: id
  text: Demikianlah firman Tuhan terus bertumbuh dan makin berkuasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terus bertumbuh dengan dahsyatnya dan makin berkuasa.” Frasa Yunani κατὰ κράτος merupakan ungkapan adverbial yang dapat berarti “dengan penuh kuasa,” “dengan kuat,” atau “dengan dahsyatnya.”'
    reason: Menjelaskan alternatif idiomatis untuk κατὰ κράτος dan bahwa frasa itu menerangkan kemajuan serta kekuatan firman.
lexical_decisions:
- source_word: οὕτως
  choice: Demikianlah
  rationale: Menunjukkan hasil dari berbagai peristiwa sebelumnya dengan ungkapan baku yang tetap alami dalam bahasa Indonesia.
- source_word: κατὰ κράτος
  choice: dengan penuh kuasa
  rationale: Ungkapan ini menerangkan perkembangan firman yang berlangsung secara kuat atau dahsyat. Pilihan ini mempertahankan gagasan daya atau kuasa dalam κράτος dan dapat dibaca secara alami.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος tanpa menambahkan nama Yesus yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ὁ λόγος
  choice: firman
  rationale: Dalam konteks Kisah Para Rasul, λόγος menunjuk pada berita yang diberitakan. 'Firman' mempertahankan ungkapan khas kitab ini dan telah dipahami luas oleh pembaca Indonesia.
- source_word: ηὔξανεν
  choice: terus berkembang
  rationale: Bentuk imperfek menggambarkan kemajuan yang sedang berlangsung. 'Berkembang' lebih alami daripada metafora harfiah 'bertumbuh' ketika subjeknya adalah berita atau firman.
- source_word: ἴσχυεν
  choice: semakin kuat
  rationale: Mempertahankan arti dasar 'menjadi kuat/berdaya' serta aspek perkembangan yang berkelanjutan, tanpa mempersempitnya menjadi kemenangan atas lawan tertentu.
theological_decisions:
- issue: Rujukan 'Tuhan' dalam τοῦ κυρίου
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Konteks Kisah Para Rasul mengarah kepada Yesus, tetapi teks Yunani hanya memakai gelar 'Tuhan'. Terjemahan tidak membuat rujukan itu lebih eksplisit daripada sumber.
- issue: Personifikasi firman yang berkembang dan menjadi kuat
  choice: Mempertahankan firman sebagai subjek kedua verba
  alternative: Menjelaskan bahwa pemberitaan firman makin tersebar dan berpengaruh
  rationale: Susunan sumber menggambarkan firman itu sendiri sebagai sesuatu yang berkembang dan menjadi kuat. Mempertahankan personifikasi ini menghindari penambahan pelaku atau penjelasan teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Terus berkembang' dan 'semakin kuat' menyampaikan aspek berlangsung dari kedua verba imperfek, sedangkan 'firman Tuhan' mempertahankan ungkapan teologis khas Kisah Para Rasul.
