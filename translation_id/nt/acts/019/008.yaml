id: ACT.19.8
reference: Acts 19:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: id
  text: Lalu ia masuk ke rumah ibadat dan selama tiga bulan berbicara dengan berani, berdiskusi dan meyakinkan orang-orang tentang Kerajaan Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: Lalu ia masuk
  rationale: Partisip aoristus menetapkan keadaan yang mendahului tindakan utama, sedangkan δέ melanjutkan alur cerita secara ringan. Bentuk ini alami dalam narasi Indonesia.
- source_word: συναγωγήν
  choice: rumah ibadat
  rationale: Istilah ini menunjuk pada tempat pertemuan dan ibadah Yahudi; 'rumah ibadat' jelas dan lazim bagi pembaca Indonesia.
- source_word: ἐπαρρησιάζετο
  choice: berbicara dengan berani
  rationale: Bentuk imperfek menyatakan kegiatan yang berlangsung terus, dan keterangan 'selama tiga bulan' turut menyampaikan aspek duratifnya.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: selama tiga bulan
  rationale: ἐπί dengan akusatif di sini menyatakan jangka waktu.
- source_word: διαλεγόμενος
  choice: bertukar pikiran
  rationale: Kata ini menggambarkan pembahasan yang melibatkan penalaran dan interaksi, bukan sekadar pidato satu arah maupun pertengkaran.
- source_word: πείθων
  choice: berusaha meyakinkan orang-orang
  rationale: Partisip ini menyatakan kegiatan persuasif. 'Berusaha meyakinkan' menghindari kesan bahwa semua pendengar pasti berhasil diyakinkan, sementara 'orang-orang' menyatakan objek yang tersirat dari konteks.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: tentang Kerajaan Allah
  rationale: περί dengan genitif berarti 'tentang'; 'Kerajaan Allah' mempertahankan istilah teologis yang mapan dan dapat mencakup pemerintahan maupun ranah kerajaan Allah.
theological_decisions:
- issue: Objek πείθων tidak dinyatakan secara eksplisit dalam bahasa Yunani
  choice: menambahkan 'orang-orang' sebagai objek tersirat
  alternative: 'tanpa objek eksplisit: ''berusaha meyakinkan tentang Kerajaan Allah'''
  rationale: Bahasa Indonesia lebih alami dengan objek bagi 'meyakinkan', dan konteks dengan jelas menunjuk kepada para pendengar di rumah ibadat.
- issue: Apakah πείθων menyatakan keberhasilan atau upaya persuasi
  choice: berusaha meyakinkan
  alternative: meyakinkan
  rationale: Konteks tidak menyatakan bahwa seluruh pendengar berhasil diyakinkan. Pilihan ini mempertahankan ketegangan antara tindakan persuasif Paulus dan hasilnya tanpa memastikannya.
- issue: Makna βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: '''Kerajaan Allah'' merupakan padanan yang dikenal luas dan tetap memungkinkan nuansa pemerintahan atau kekuasaan Allah tanpa mempersempit makna.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk συναγωγή, sementara 'bertukar pikiran' mempertahankan unsur dialogis διαλέγομαι.
