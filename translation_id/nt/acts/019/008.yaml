  naturalness: Susunan revisi tetap baku dan wajar dalam bahasa Indonesia modern. «Berdiskusi» menyampaikan unsur dialogis dan penalaran dari διαλεγόμενος tanpa terlalu mengesankan pertukaran pendapat timbal balik yang setara.
  terminology: «Rumah ibadat» merupakan padanan yang lazim untuk συναγωγή dalam konteks Yahudi, dan «Kerajaan Allah» dengan tepat mempertahankan istilah kunci βασιλεία τοῦ θεοῦ.
