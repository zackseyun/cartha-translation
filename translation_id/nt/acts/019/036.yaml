  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: id
  text: Jadi, karena hal-hal ini tidak dapat disangkal, kalian harus tetap tenang dan tidak bertindak gegabah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: tidak dapat disangkal
  rationale: Ungkapan ini menyatakan bahwa hal-hal tersebut tidak terbuka untuk bantahan; bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan kekuatan istilah Yunani.
- source_word: οὖν
  choice: jadi
  rationale: Menandai kesimpulan dari alasan yang baru dikemukakan dan terdengar alami dalam pidato langsung.
- source_word: ὄντων τούτων
  choice: karena hal-hal ini
  rationale: Konstruksi genitif absolut memberi dasar kausal bagi nasihat berikutnya; 'karena' menyampaikan hubungan itu secara idiomatis.
- source_word: δέον ἐστίν
  choice: harus
  rationale: Menyatakan keharusan atau kewajiban. 'Harus' ringkas, kuat, dan alami dalam bahasa Indonesia modern.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: tetap tenang
  rationale: Menggambarkan keadaan terkendali atau tenang yang perlu dipertahankan, bukan sekadar tidak berbicara.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: tidak bertindak gegabah
  rationale: προπετής menunjuk pada tindakan yang terburu-buru atau tanpa pertimbangan; 'bertindak gegabah' menyampaikan peringatan itu secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai karena ὑμᾶς berbentuk jamak dan tuturan ditujukan kepada orang banyak; susunan kalimat mempertahankan hubungan alasan dan nasihat dengan jelas.
