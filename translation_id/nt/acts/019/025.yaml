  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: id
  text: Setelah ia mengumpulkan mereka bersama para pekerja dalam bidang seperti itu, ia berkata, “Saudara-saudara, kalian tahu bahwa kemakmuran kita berasal dari usaha ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dari pekerjaan ini kita memperoleh kekayaan.”'
    reason: Menunjukkan alternatif leksikal bagi ἐργασία (“pekerjaan”) dan εὐπορία (“kekayaan”) dalam konteks ekonomi.
lexical_decisions:
- source_word: συναθροίσας
  choice: Setelah mengumpulkan
  rationale: Partisip aoris ini secara alami menyatakan tindakan yang mendahului kata kerja utama; bentuk ini tetap dekat dengan urutan dan hubungan temporal dalam bahasa Yunani.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: para pekerja yang menangani hal-hal semacam itu
  rationale: Ungkapan ini dipertahankan cukup luas seperti bahasa sumber, tanpa mempersempit ἐργάτας menjadi pengrajin atau menentukan jenis pekerjaan yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: Ἄνδρες
  choice: Saudara-saudara
  rationale: Sapaan ini ditujukan kepada para laki-laki yang berkumpul. Dalam bahasa Indonesia modern, “Saudara-saudara” merupakan sapaan kelompok yang alami dan bermartabat dalam konteks pidato tanpa nuansa sosial tambahan dari “Tuan-tuan”.
- source_word: ἐπίστασθε
  choice: kalian tahu
  rationale: Menyampaikan pengetahuan yang sudah dimiliki para pendengar secara langsung dan alami.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: berasal dari usaha ini
  rationale: Dalam konteks kegiatan komersial, ἐργασία menunjuk pada pekerjaan atau usaha yang menghasilkan keuntungan; “usaha” jelas dan wajar tanpa membatasi makna hanya pada satu kerajinan tertentu.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: kemakmuran kita
  rationale: εὐπορία berarti kemakmuran atau keadaan berkecukupan secara materi. Konstruksi posesif bahasa Yunani disampaikan secara alami dengan “kita” sambil mempertahankan penekanannya pada kesejahteraan ekonomi bersama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Saudara-saudara” dipilih sebagai bentuk lisan yang alami bagi kelompok laki-laki; “kalian” menjaga kejelasan bentuk jamak dalam ujaran langsung. Penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
