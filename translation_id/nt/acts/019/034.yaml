id: ACT.19.34
reference: Acts 19:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: id
  text: Namun, ketika mereka mengetahui bahwa ia seorang Yahudi[a], mereka semua berseru dengan satu suara selama kira-kira dua jam, “Mahabesarlah Artemis orang Efesus!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang Yudea.” Istilah Yunani ini dapat berarti orang Yahudi atau orang yang berasal dari Yudea; di sini makna etnoreligius yang lebih luas lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: ketika mereka mengetahui
  rationale: Partisip aoris menyatakan keadaan yang mendahului seruan massa; frasa ini wajar dalam bahasa Indonesia dan menunjukkan bahwa mereka mengenali identitas Aleksander.
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan yang berlawanan dengan upaya Aleksander untuk berbicara dalam konteks sebelumnya.
- source_word: Ἰουδαῖός
  choice: seorang Yahudi
  rationale: Dalam konteks diaspora di Efesus, istilah ini paling mungkin menunjuk pada identitas etnoreligius, bukan semata-mata asal geografis dari Yudea.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: mereka semua berseru dengan satu suara
  rationale: Mengungkapkan idiom Yunani secara alami sambil mempertahankan penekanan pada kesatuan suara massa.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: selama kira-kira dua jam
  rationale: ὡς dalam ungkapan ukuran menunjukkan perkiraan, sehingga 'kira-kira' mempertahankan nuansanya.
- source_word: κραζόντων
  choice: berseru
  rationale: Partisip kini menggambarkan tindakan lantang yang berlangsung terus; 'berseru' sesuai dengan aklamasi massa dan register naratif yang bermartabat.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Mahabesarlah Artemis, dewi orang Efesus!
  rationale: Bentuk aklamatif 'Mahabesarlah' mempertahankan penempatan predikat di muka. Penjelas 'dewi' membuat hubungan Artemis dengan orang Efesus jelas dan alami dalam bahasa Indonesia tanpa mengubah rujukannya.
theological_decisions:
- issue: Makna Ἰουδαῖος
  choice: seorang Yahudi
  alternative: seorang Yudea
  rationale: Reaksi massa di Efesus paling mungkin didasarkan pada identitas etnoreligius Aleksander. Catatan kaki tetap mempertahankan kemungkinan leksikal geografis yang sungguh ada.
- issue: Sebutan Artemis dalam aklamasi pagan
  choice: Mahabesarlah Artemis, dewi orang Efesus!
  alternative: Besarlah Artemis milik orang Efesus!
  rationale: Terjemahan menyajikan seruan massa sebagai ucapan langsung tanpa menyetujuinya; 'dewi orang Efesus' menjelaskan asosiasi genitif Ἐφεσίων secara idiomatis.
translation_notes:
  register: Bahasa Indonesia standar modern dengan register naratif yang wajar dan bermartabat. Struktur Yunani yang agak kaku dialihkan menjadi ungkapan idiomatis 'berseru dengan satu suara', sedangkan sifat aklamatif seruan dipertahankan melalui 'Mahabesarlah'.
