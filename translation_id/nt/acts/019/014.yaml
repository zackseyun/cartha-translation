id: ACT.19.14
reference: Acts 19:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: id
  text: Ada tujuh anak laki-laki dari seorang imam kepala[a] Yahudi bernama Skewa yang melakukan hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Imam Besar.” Istilah Yunani ini dapat menunjuk kepada Imam Besar atau, secara lebih luas, kepada seorang imam kepala atau tokoh dari kalangan imam besar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ada
  rationale: Menyajikan kelanjutan narasi dan konstruksi keberadaan secara alami dalam bahasa Indonesia tanpa menambahkan kata waktu yang tidak tersurat.
- source_word: τινος Σκευᾶ
  choice: seorang ... bernama Skewa
  rationale: Genitif τινος memperkenalkan seseorang yang belum dikenal secara khusus; ungkapan “seorang ... bernama Skewa” alami sekaligus mempertahankan ketaktentuan itu.
- source_word: Ἰουδαίου
  choice: Yahudi
  rationale: Dalam konteks ini kata tersebut menunjuk pada identitas etnis-keagamaan, bukan sekadar asal geografis dari Yudea.
- source_word: ἀρχιερέως
  choice: imam kepala
  rationale: Istilah Yunani dapat menunjuk kepada Imam Besar atau, secara lebih luas, seorang dari kalangan imam terkemuka. “Imam kepala” menghindari klaim bahwa Skewa memegang jabatan tunggal Imam Besar.
- source_word: ἑπτὰ υἱοὶ
  choice: tujuh anak laki-laki
  rationale: Terjemahan langsung yang mempertahankan jumlah dan hubungan keluarga dengan ungkapan Indonesia yang jelas.
- source_word: τοῦτο ποιοῦντες
  choice: yang melakukan hal itu
  rationale: Partisipel kini menerangkan tindakan anak-anak Skewa dalam konteks sebelumnya; “hal itu” mempertahankan bentuk tunggal demonstratif τοῦτο.
theological_decisions:
- issue: Makna ἀρχιερεύς sebagai sebutan bagi Skewa
  choice: imam kepala
  alternative: Imam Besar
  rationale: ἀρχιερεύς dapat berarti Imam Besar, tetapi juga dapat dipakai lebih luas untuk imam terkemuka atau anggota kalangan imam besar. Karena Skewa tidak dikenal sebagai pemegang jabatan tunggal Imam Besar di Yerusalem, teks utama memakai “imam kepala” sambil mempertahankan alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bermartabat. Nama Σκευᾶ ditransliterasikan sebagai “Skewa”. Penanda catatan ditempatkan langsung sesudah istilah yang dijelaskannya.
