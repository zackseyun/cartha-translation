  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: id
  text: Kota itu pun dipenuhi kekacauan,[a] lalu mereka beramai-ramai menyerbu ke teater sambil menyeret Gayus dan Aristarkhus, dua orang Makedonia yang menjadi teman seperjalanan Paulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kegemparan” atau “kebingungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Seluruh kota pun dipenuhi kekacauan
  rationale: Mempertahankan bentuk pasif ἐπλήσθη dan makna langsung συγχύσεως sebagai keadaan kacau yang meliputi kota; 'seluruh' mengungkapkan cakupan idiomatis dari ungkapan tersebut tanpa menentukan pelakunya.
- source_word: ὥρμησάν
  choice: menyerbu
  rationale: Mengungkapkan gerakan massa yang mendadak dan kuat; dalam konteks kerusuhan, pilihan ini lebih tepat daripada sekadar 'bergegas'.
- source_word: ὁμοθυμαδόν
  choice: beramai-ramai
  rationale: Menunjukkan tindakan kolektif massa tanpa memberi kesan kesatuan yang bernilai positif seperti yang mungkin tersirat oleh 'sehati'.
- source_word: θέατρον
  choice: gedung pertunjukan
  rationale: Merujuk pada bangunan umum tempat pertunjukan dan pertemuan; tidak dipersempit menjadi amfiteater.
- source_word: συναρπάσαντες
  choice: sambil menyeret
  rationale: Menyampaikan tindakan menangkap dengan paksa sekaligus membawa kedua orang itu dalam gerakan massa menuju gedung pertunjukan.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: Gayus dan Aristarkhus
  rationale: Nama-nama ditransliterasikan menurut bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: Μακεδόνας
  choice: dua orang Makedonia
  rationale: Bentuk jamak menerangkan Gayus dan Aristarkhus; penambahan 'dua orang' memperjelas hubungan aposisional secara alami.
- source_word: συνεκδήμους Παύλου
  choice: teman seperjalanan Paulus
  rationale: Mengungkapkan orang-orang yang bepergian bersama Paulus dengan frasa Indonesia yang wajar.
- source_word: τε
  choice: lalu
  rationale: Menghubungkan tindakan berikutnya dalam alur narasi secara alami, tanpa memberi bobot teologis tambahan.
