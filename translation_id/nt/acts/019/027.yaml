id: ACT.19.27
reference: Acts 19:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: id
  text: Bukan hanya mata pencaharian kita ini terancam kehilangan nama baik, tetapi juga kuil dewi agung Artemis terancam dianggap tidak berarti, dan bahkan kebesarannya—yang disembah oleh seluruh Asia dan dunia[a]—terancam diruntuhkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dunia yang berpenghuni.” Istilah Yunani ini sering menunjuk pada dunia yang dihuni manusia, khususnya dunia luas dalam lingkup Romawi.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunaninya juga dapat dipahami sebagai “ia akan kehilangan kebesarannya” atau “kemegahannya akan dilucuti.”
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: terancam
  rationale: Mengungkapkan keadaan berada dalam bahaya secara alami dalam bahasa Indonesia dan menaungi kedua akibat yang dikhawatirkan.
- source_word: τὸ μέρος
  choice: mata pencaharian kita ini
  rationale: Dalam konteks pidato Demetrius, ungkapan ini menunjuk pada bidang usaha para perajin; pilihan ini jelas bagi pembaca modern tanpa membatasinya pada satu transaksi bisnis.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: kehilangan nama baik
  rationale: Menyampaikan peralihan menuju keadaan tercela atau tidak dihargai dengan ungkapan Indonesia yang alami.
- source_word: ἱερὸν
  choice: kuil
  rationale: Menunjuk pada tempat suci atau kompleks kuil Artemis di Efesus; 'kuil' merupakan padanan Indonesia yang paling langsung.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: dianggap tidak berarti
  rationale: Mempertahankan gagasan dinilai tidak bernilai atau tidak penting tanpa menambahkan penafsiran yang lebih keras.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: dapat diruntuhkan
  rationale: Dalam struktur yang padat dan agak sulit ini, Demetrius mengkhawatirkan kemerosotan yang akan terjadi; bentuk pasif mempertahankan καθαιρεῖσθαι, sedangkan 'dapat' membawa nuansa bahaya dari κινδυνεύει.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: kebesarannya
  rationale: Mencakup keagungan, kemegahan, dan kedudukan Artemis tanpa mempersempit maknanya hanya pada gelar kerajaan.
- source_word: ὅλη ἡ Ἀσία
  choice: seluruh Asia
  rationale: Mempertahankan cakupan retoris teks; dalam konteks ini Asia terutama merujuk pada wilayah atau provinsi Romawi bernama Asia.
- source_word: ἡ οἰκουμένη
  choice: dunia
  rationale: Padanan Indonesia yang wajar; catatan kaki mempertahankan arti lebih harfiah 'dunia yang berpenghuni'.
- source_word: σέβεται
  choice: disembah
  rationale: Konteks pemujaan Artemis mendukung makna religius yang kuat, bukan sekadar dihormati.
theological_decisions:
- issue: Bahasa keagamaan kafir dalam ucapan Demetrius
  choice: dewi agung Artemis ... yang disembah oleh seluruh Asia dan dunia
  alternative: yang disebut dewi agung Artemis ... yang dihormati oleh seluruh Asia dan dunia
  rationale: Teks melaporkan klaim Demetrius dari sudut pandangnya tanpa penanda jarak seperti 'yang disebut'. Terjemahan tidak mengesahkan klaim itu, tetapi juga tidak melunakkan bahasa religius sumber.
- issue: Hubungan gramatikal kebesaran Artemis dengan kata kerja καθαιρεῖσθαι
  choice: kebesarannya ... dapat diruntuhkan
  alternative: ia akan kehilangan kebesarannya
  rationale: Genitif τῆς μεγαλειότητος sesudah verba pasif ini sulit dan memungkinkan nuansa dilucuti dari kebesaran atau kebesarannya dijatuhkan. Pilihan utama menjaga citra 'meruntuhkan' sekaligus membiarkan ketegangan sintaksisnya tetap terasa; catatan kaki mencatat alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mata pencaharian' dipilih agar kepentingan ekonomi para perajin segera dipahami; 'kuil' dan 'disembah' mempertahankan latar pemujaan. Tanda pisah mengapit klausa relatif panjang, sedangkan semua penanda catatan kaki dicantumkan dalam teks utama.
