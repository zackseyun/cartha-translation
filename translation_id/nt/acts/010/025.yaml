id: ACT.10.25
reference: Acts 10:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: id
  text: Ketika Petrus masuk, Kornelius datang menyambutnya, lalu tersungkur di kakinya dan memberi hormat kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembahnya.” Kata kerja Yunani ini dapat berarti menyembah atau bersujud sebagai tanda penghormatan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: Ketika ... masuk
  rationale: Ungkapan Yunani ini memperkenalkan keadaan waktu dalam alur cerita. “Ketika” menyampaikan fungsi temporalnya secara alami tanpa meniru susunan idiom Yunani secara kaku.
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: Petrus masuk
  rationale: Infinitif aoris menggambarkan peristiwa sederhana; bentuk klausa ini alami dalam bahasa Indonesia.
- source_word: συναντήσας αὐτῷ
  choice: datang menyambutnya
  rationale: Partisip ini menyatakan tindakan Kornelius menemui Petrus. “Datang menyambutnya” sesuai dengan suasana kedatangan Petrus dan terdengar alami, tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: tersungkur di kakinya
  rationale: Ungkapan ini mempertahankan gerak fisik merendahkan diri di depan kaki Petrus. “Tersungkur” secara ringkas dan wajar menyampaikan tindakan jatuh meniarap atau membungkuk sangat rendah.
- source_word: προσεκύνησεν
  choice: memberi hormat kepadanya
  rationale: προσκυνέω dapat menunjuk pada penyembahan ataupun tindakan bersujud sebagai penghormatan. Pilihan ini mempertahankan tindakan penghormatan yang berlebihan dalam konteks tersebut tanpa memastikan bahwa Kornelius bermaksud memberikan penyembahan ilahi; kemungkinan yang lebih kuat dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna προσκυνέω yang ditujukan kepada Petrus
  choice: memberi hormat kepadanya
  alternative: menyembahnya; bersujud kepadanya
  rationale: Rentang makna kata ini mencakup penghormatan dengan bersujud hingga penyembahan. Karena ayat berikutnya memperlihatkan Petrus menolak tindakan itu dengan menegaskan bahwa ia juga manusia, terjemahan utama menyampaikan keseriusan penghormatan tersebut tanpa menetapkan lebih dari yang diwajibkan konteks. Alternatif “menyembahnya” tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “-nya” merujuk kepada Petrus; pengulangan nama dihindari karena acuannya jelas.
