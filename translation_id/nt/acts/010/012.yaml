  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: id
  text: Di dalamnya terdapat segala binatang berkaki empat, binatang melata di bumi, dan burung di langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalamnya
  rationale: Pronomina relatif ini merujuk pada benda seperti kain lebar dalam penglihatan Petrus. “Di dalamnya” alami dalam bahasa Indonesia dan mempertahankan makna lokatif.
- source_word: ὑπῆρχεν
  choice: terdapat
  rationale: Bentuk imperfek ὑπάρχω menyatakan keberadaan atau kehadiran makhluk-makhluk itu di dalam wadah tersebut; “terdapat” menyampaikan makna ini tanpa menambahkan gagasan bahwa wadah itu secara aktif memuatnya.
- source_word: πάντα
  choice: segala jenis
  rationale: Dalam daftar golongan makhluk, bentuk netral jamak ini secara wajar menyatakan cakupan menyeluruh. “Segala jenis” menghindari kesan bahwa setiap individu hewan berada di sana, sambil mempertahankan keluasan ungkapan Yunani.
- source_word: τὰ τετράποδα
  choice: binatang berkaki empat
  rationale: Padanan ini jelas, tidak teknis, dan langsung menggambarkan makhluk berkaki empat.
- source_word: ἑρπετὰ τῆς γῆς
  choice: binatang melata di bumi
  rationale: ἑρπετά lebih luas daripada kategori zoologis modern “reptil” dan menunjuk pada makhluk yang merayap atau melata; “di bumi” menyampaikan hubungan dengan tanah atau bumi dalam bentuk yang alami.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: burung di langit
  rationale: Dalam konteks daftar hewan, πετεινά secara alami diterjemahkan “burung,” sedangkan οὐρανός di sini menunjuk pada langit sebagai ranah burung.
- source_word: καὶ ... καὶ
  choice: ', ... dan'
  rationale: Bahasa Indonesia baku secara alami mengoordinasikan tiga unsur daftar dengan koma dan satu “dan” sebelum unsur terakhir; hubungan koordinatif Yunani tetap terpelihara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, jelas, dan bermartabat. “Binatang melata” dipilih daripada “reptil” agar cakupan istilah Yunani tidak dipersempit menjadi klasifikasi zoologis modern.
