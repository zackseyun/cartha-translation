  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: id
  text: Keesokan harinya Petrus masuk ke Kaisarea.[a] Kornelius sedang menantikan mereka dan telah mengumpulkan sanak saudaranya serta sahabat dekatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai verba tunggal, “ia masuk,” yang berfokus pada Petrus, tetapi kemudian memakai kata ganti jamak “mereka,” yang kemungkinan mencakup Petrus dan orang-orang yang menyertainya.
    reason: Menjelaskan peralihan dari verba tunggal ke pronomina jamak tanpa menyatakan referen jamak secara lebih pasti daripada yang ditunjukkan ayat ini.
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan mempertahankan urutan narasi; δέ cukup tercermin melalui peralihan kalimat tanpa perlu diterjemahkan secara tersendiri.
- source_word: εἰσῆλθεν
  choice: Petrus tiba
  rationale: Bentuk verba Yunani adalah orang ketiga tunggal dan subjek tersiratnya ialah Petrus. Dalam konteks memasuki sebuah kota, 'tiba di' lebih alami dalam bahasa Indonesia daripada 'masuk ke', sambil mempertahankan fokus tunggal pada Petrus.
- source_word: Καισάρειαν
  choice: Kaisarea
  rationale: Bentuk transliterasi nama tempat yang lazim dalam bahasa Indonesia.
- source_word: ὁ δὲ Κορνήλιος
  choice: Kornelius
  rationale: δέ menandai peralihan fokus narasi yang ringan. Pemisahan menjadi kalimat baru sudah menyampaikan peralihan itu secara alami tanpa menyiratkan pertentangan kuat.
- source_word: ἦν προσδοκῶν
  choice: sedang menantikan
  rationale: Konstruksi imperfek perifrastik menunjukkan penantian yang sedang berlangsung dan mengandung unsur pengharapan.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina Yunani secara eksplisit berbentuk jamak, mengacu kepada Petrus beserta para pengiringnya, meskipun verba sebelumnya berbentuk tunggal.
- source_word: συγκαλεσάμενος
  choice: telah mengumpulkan
  rationale: Partisip aoris menunjukkan tindakan yang sudah dilakukan sebelum atau sebagai persiapan bagi penantian Kornelius; 'telah mengumpulkan' jelas dan alami.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: sanak saudaranya
  rationale: Padanan bahasa Indonesia yang alami untuk kerabat atau anggota keluarga besar.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: sahabat-sahabat dekatnya
  rationale: Dalam gabungan ini, ἀναγκαῖος menunjuk pada sahabat yang akrab atau dekat, bukan 'perlu' secara harfiah.
