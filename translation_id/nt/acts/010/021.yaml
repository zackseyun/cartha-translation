  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: id
  text: Lalu Petrus turun menemui orang-orang itu dan berkata, “Nah, sayalah orang yang kalian cari. Apa alasan kalian berada di sini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: turun
  rationale: Partisip aoris dari καταβαίνω menyatakan bahwa Petrus turun dari bagian atas rumah untuk menemui para tamu; bentuk verba berurutan lebih alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan narasi, bukan pertentangan yang kuat.
- source_word: πρὸς τοὺς ἄνδρας
  choice: menemui orang-orang itu
  rationale: πρός dengan akusatif menunjukkan gerak menuju mereka; 'menemui' menyampaikan arah dan situasinya secara alami, sedangkan 'orang-orang itu' merujuk pada kelompok laki-laki yang telah disebut dalam konteks.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: ἰδού menarik perhatian lawan bicara; 'Lihat' mempertahankan fungsi wacananya dalam ragam modern.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: sayalah orang yang kalian cari
  rationale: Bentuk ini mempertahankan penegasan pada ἐγώ serta mengungkapkan klausa relatif secara alami.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Apa alasan kalian datang ke sini?
  rationale: αἰτία menyatakan alasan atau sebab, sedangkan πάρεστε menyatakan kehadiran mereka. Dalam konteks kedatangan para utusan, ungkapan ini alami dan tetap mempertahankan unsur eksplisit 'alasan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang wajar dan bermartabat. 'Kalian' dipakai karena Petrus berbicara kepada beberapa orang; tidak ada ambiguitas teologis khusus yang memerlukan catatan kaki.
