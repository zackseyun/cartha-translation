id: ACT.10.13
reference: Acts 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: id
  text: Lalu terdengarlah suara yang berkata kepadanya, “Bangunlah, Petrus, sembelihlah[a] dan makanlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahkanlah sebagai kurban.” Kata yang diterjemahkan “sembelihlah” juga dapat berarti mempersembahkan kurban, tetapi dalam konteks penglihatan ini kemungkinan besar mengacu pada menyembelih hewan untuk dimakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: terdengarlah
  rationale: Bersama φωνή sebagai subjek, γίνομαι menyatakan muncul atau datangnya suara. Dalam bahasa Indonesia, “terdengarlah suara” menyampaikan peristiwa itu secara alami tanpa memberi kesan bahwa sumber suara mendekat secara fisik.
- source_word: φωνὴ
  choice: suara
  rationale: Dalam konteks pewahyuan ini, kata tersebut menunjuk pada suara yang mengucapkan pesan, bukan sekadar bunyi.
- source_word: πρὸς αὐτόν
  choice: yang berkata kepadanya
  rationale: Dengan ujaran, πρός + akusatif menunjukkan orang yang dituju. Penambahan “yang berkata” membuat hubungan antara suara dan isi ucapan alami serta jelas dalam bahasa Indonesia.
- source_word: Ἀναστάς
  choice: Bangunlah
  rationale: Partisip aoris ini berfungsi sebagai perintah yang mendahului perintah berikutnya. “Bangunlah” alami, langsung, dan tetap dapat berarti bangkit dari posisi duduk atau berbaring.
- source_word: Πέτρε
  choice: Petrus
  rationale: Bentuk vokatif dari Πέτρος diterjemahkan dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: θῦσον
  choice: sembelihlah
  rationale: Dalam konteks penglihatan tentang hewan yang akan dimakan, kata ini paling wajar menunjuk pada membunuh hewan untuk dijadikan makanan. “Sembelihlah” lebih tepat daripada “bunuhlah” bagi hewan dan tidak harus menyatakan korban ritual.
- source_word: φάγε
  choice: makanlah
  rationale: Imperatif langsung ini diterjemahkan secara lugas dan alami.
- source_word: καὶ
  choice: Lalu / dan
  rationale: Καί pertama melanjutkan urutan narasi dan diterjemahkan “Lalu”; καί kedua menghubungkan dua perintah dan diterjemahkan “dan”.
theological_decisions:
- issue: Apakah θῦσον harus diterjemahkan dengan istilah pengorbanan ritual
  choice: “sembelihlah” dalam teks utama
  alternative: “persembahkanlah sebagai kurban” atau “korbankanlah”
  rationale: Konteks langsungnya adalah menyiapkan hewan untuk dimakan, bukan pelaksanaan ibadah kurban. Namun, karena θύω juga dapat berarti mempersembahkan kurban, kemungkinan leksikal itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Partikel -lah mempertahankan daya perintah tanpa terdengar kasar; “terdengarlah” juga memberi alur naratif yang alami.
