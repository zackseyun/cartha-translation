  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: id
  text: Sekarang, kirimlah beberapa orang laki-laki ke Yope untuk menjemput seorang bernama Simon, yang disebut Petrus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang bernama Simon yang dikenal sebagai Petrus.”'
    reason: Alternatif ini mencerminkan kemungkinan nuansa ἐπικαλεῖται sebagai nama yang dipakai atau nama yang dikenal orang.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Sekarang
  rationale: Dalam konteks perintah yang melanjutkan perkataan sebelumnya, 'Sekarang' menyampaikan penanda waktu dan alur wacana secara alami; καί tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: πέμψον ἄνδρας εἰς Ἰόππην
  choice: suruhlah beberapa orang pergi ke Yope
  rationale: Imperatif tunggal πέμψον diterjemahkan dengan perintah langsung 'suruhlah'; ἄνδρας merujuk kepada sejumlah laki-laki, tetapi dalam konstruksi Indonesia ini 'beberapa orang' terdengar alami tanpa mengubah fungsi mereka sebagai utusan. 'Pergi ke Yope' memperjelas arah εἰς Ἰόππην.
- source_word: μετάπεμψαι
  choice: mintalah mereka menjemput
  rationale: Bentuk imperatif medial ini berarti menyuruh orang pergi memanggil atau menjemput seseorang agar datang. 'Mintalah mereka menjemput' alami dalam bahasa Indonesia dan tidak memberi kesan paksaan sekuat 'panggillah menghadap'.
- source_word: Σίμωνά τινα
  choice: seorang bernama Simon
  rationale: τινα memperkenalkan orang tertentu yang belum diperkenalkan kepada penerima perintah. Ungkapan ini lebih alami daripada terjemahan harfiah 'seorang Simon tertentu'.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: yang disebut Petrus
  rationale: Mempertahankan keterangan tentang nama lain yang dipakai bagi Simon. 'Disebut Petrus' dekat dengan bentuk sumber dan tetap jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Bentuk perintah memakai akhiran -lah agar tegas namun tetap wajar dan bermartabat.
