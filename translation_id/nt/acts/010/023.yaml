base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: id
  text: Maka ia mempersilakan mereka masuk dan memberi mereka tumpangan.[a] Keesokan harinya ia bangun dan berangkat bersama mereka. Beberapa saudara[b] dari Yope ikut pergi bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjamu mereka” atau “menerima mereka sebagai tamu”; kata Yunani di sini secara khusus menunjuk pada pemberian tumpangan sebagai bentuk keramahan.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “saudara” berbentuk jamak maskulin. Dalam pemakaian Kristen awal, kata ini kadang-kadang dapat mencakup sesama orang percaya secara lebih luas, yaitu “saudara-saudari seiman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: mempersilakan mereka masuk
  rationale: Partisipel medium ini menyatakan bahwa Petrus menyuruh atau mengundang mereka masuk. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan tindakan menerima tamu.
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sebagai akibat dari percakapan sebelumnya tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: ἐξένισεν
  choice: memberi mereka tumpangan
  rationale: Dalam konteks ini ξενίζω secara khusus menunjuk pada penerimaan tamu dengan menyediakan tempat menginap; pilihan ini menyatakan tindakan konkret tersebut.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Padanan temporal yang baku, ringkas, dan alami untuk urutan narasi.
- source_word: ἀναστὰς ἐξῆλθεν
  choice: ia bangun lalu berangkat
  rationale: ἀναστὰς dipertahankan sebagai tindakan bangun, sedangkan ἐξῆλθεν dalam konteks perjalanan secara alami diterjemahkan 'berangkat'; 'lalu' menjelaskan hubungan partisipel tanpa menambah makna penting.
- source_word: σὺν αὐτοῖς
  choice: bersama mereka
  rationale: Menyatakan penyertaan secara langsung dan alami.
- source_word: τινες
  choice: beberapa
  rationale: Padanan alami bagi bentuk jamak tak tentu dalam narasi.
- source_word: ἀδελφῶν
  choice: saudara seiman
  rationale: Dalam Kisah Para Rasul istilah ini menunjuk kepada anggota komunitas orang percaya. 'Saudara seiman' terdengar alami dan menjaga pengertian relasional gerejawi, sementara bentuk maskulin sumber dan kemungkinan cakupannya dijelaskan dalam catatan kaki.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: dari Yope
  rationale: Frasa ini mengidentifikasi asal para saudara tersebut. 'Yope' adalah bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: συνῆλθον αὐτῷ
  choice: juga menyertainya
  rationale: Dalam konteks perjalanan, verba ini berarti ikut atau pergi bersama Petrus. 'Menyertainya' ringkas dan jelas; 'juga' mewakili καί.
theological_decisions:
- issue: Cakupan ἀδελφῶν dalam konteks komunitas orang percaya
  choice: saudara seiman
  alternative: saudara-saudara; saudara-saudari seiman
  rationale: Istilah Yunani berbentuk jamak maskulin dan di sini kemungkinan besar merujuk kepada sejumlah laki-laki yang ikut dalam perjalanan, tetapi dalam pemakaian Kristen awal kata tersebut dapat pula berfungsi lebih luas bagi sesama orang percaya. Teks utama tidak memperinci jenis kelamin setiap anggota kelompok, sehingga catatan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Nama tempat diterjemahkan sebagai 'Yope' menurut bentuk yang lazim dalam tradisi Alkitab Indonesia. Struktur kalimat dibagi agar alur tindakan dan pergantian subjek tetap jelas.
