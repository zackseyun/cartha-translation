  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: id
  text: Lalu Petrus membuka mulutnya dan berkata, “Sesungguhnya, aku mengerti[a] bahwa Allah tidak bersikap pilih kasih[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, aku memahami,” atau “Dalam kebenaran, aku menyadari.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bukan seorang yang memandang muka”; artinya, Allah tidak menunjukkan favoritisme atau memperlakukan orang secara berbeda berdasarkan orangnya.
    reason: idiom_explanation
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: mulai berbicara
  rationale: Ungkapan harfiah ‘membuka mulut’ merupakan idiom pengantar bagi pernyataan resmi atau penting. Dalam bahasa Indonesia modern, ‘mulai berbicara’ menyampaikan fungsinya secara alami.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ menandai kelanjutan alur narasi; ‘lalu’ merupakan penghubung yang wajar dan tidak berlebihan.
- source_word: Ἐπ’ ἀληθείας
  choice: benar-benar
  rationale: Frasa ini menegaskan bahwa pengertian Petrus sungguh nyata atau pasti. ‘Benar-benar’ alami dalam bahasa Indonesia dan cocok dengan verba ‘memahami’.
- source_word: καταλαμβάνομαι
  choice: aku ... memahami
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa Petrus menangkap atau menyadari suatu kebenaran. ‘Memahami’ mempertahankan aspek kognitif tanpa terlalu menafsirkan prosesnya.
- source_word: προσωπολήμπτης
  choice: memandang muka
  rationale: Nomina ini menunjuk kepada orang yang memperlakukan orang lain berdasarkan kedudukan atau identitas lahiriah. Idiom Indonesia ‘memandang muka’ dekat dengan citra leksikal Yunani dan berarti bersikap pilih kasih; catatan kaki menjernihkan maknanya.
- source_word: ὁ θεός
  choice: Allah
  rationale: ‘Allah’ adalah padanan baku θεός dalam bahasa Indonesia untuk Allah yang dimaksud dalam konteks ini.
theological_decisions:
- issue: Pernyataan tentang ketidakberpihakan Allah
  choice: Allah tidak memandang muka
  alternative: Allah tidak bersikap pilih kasih
  rationale: Pilihan ini mempertahankan bentuk pernyataan mengenai karakter Allah dan citra idiom sumber, tanpa mempersempit penerapannya ke dalam sistem teologis tertentu. Catatan kaki memberikan arti idiomatis yang jelas.
- issue: Nuansa kesadaran Petrus pada saat itu
  choice: Sekarang aku benar-benar memahami
  alternative: Sesungguhnya, aku memahami
  rationale: Konteks naratif menunjukkan pengertian yang sedang menjadi jelas bagi Petrus. ‘Sekarang’ membuat nuansa kontekstual itu eksplisit, tetapi karena tidak dinyatakan sebagai kata tersendiri dalam bahasa Yunani, alternatif yang lebih formal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mulai berbicara’ mengalihkan idiom pembuka Yunani secara alami, sedangkan ‘memandang muka’ mempertahankan citra penting dari προσωπολήμπτης dan dijelaskan agar mudah dipahami.
