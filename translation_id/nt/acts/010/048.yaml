id: ACT.10.48
reference: Acts 10:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: id
  text: Lalu Petrus memerintahkan mereka untuk dibaptis dalam nama Yesus Sang Mesias.[a] Kemudian mereka meminta Petrus untuk tinggal selama beberapa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut bentuk yang lebih tradisional, “Yesus Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: memerintahkan
  rationale: Kata kerja ini menyatakan instruksi yang berwibawa; 'memerintahkan' mempertahankan daya ungkap itu secara wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Karena itu
  rationale: Di sini δέ melanjutkan narasi dengan nuansa konsekuensi dari peristiwa sebelumnya, bukan pertentangan kuat.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina ini merujuk kepada orang-orang yang baru saja menerima Roh Kudus dalam konteks sebelumnya.
- source_word: ἐν τῷ ὀνόματι
  choice: dalam nama
  rationale: Ungkapan ini dipertahankan karena dapat mencakup otoritas, pengakuan, dan keterikatan tanpa mempersempitnya pada satu tafsiran.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Sang Mesias' mengungkapkan makna gelar itu secara alami dan penuh hormat dalam bahasa Indonesia.
- source_word: βαπτισθῆναι
  choice: agar mereka dibaptis
  rationale: Bentuk infinitif pasif dipindahkan secara alami ke konstruksi Indonesia 'agar ... dibaptis' setelah verba 'memerintahkan'.
- source_word: τότε
  choice: Kemudian
  rationale: Kata ini menandai peristiwa berikutnya dalam urutan narasi.
- source_word: ἠρώτησαν
  choice: meminta
  rationale: Dalam konstruksi dengan infinitif, kata ini bermakna mengajukan permintaan, bukan sekadar bertanya.
- source_word: ἐπιμεῖναι
  choice: tinggal
  rationale: Dalam konteks ini kata tersebut berarti tetap berada di tempat itu; 'tinggal' paling alami dalam bahasa Indonesia modern.
- source_word: ἡμέρας τινάς
  choice: selama beberapa hari
  rationale: Terjemahan ini mempertahankan lamanya waktu yang tidak ditentukan secara pasti.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam rumusan baptisan
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός dapat dipahami sebagai gelar pengakuan bagi Yesus. Teks utama menerjemahkan makna gelar tersebut, sedangkan bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
- issue: Makna ἐν τῷ ὀνόματι
  choice: dalam nama
  alternative: atas wewenang
  rationale: Terjemahan harfiah yang wajar ini menjaga keluasan makna ungkapan Yunani dan tidak membatasinya hanya pada gagasan wewenang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Petrus dieksplisitkan untuk memperjelas rujukan pronomina Yunani αὐτός dalam konteks, tanpa mengubah pelaku tindakan. Istilah 'dibaptis' dipertahankan sebagai istilah umum yang tidak memaksakan cara pelaksanaan tertentu.
