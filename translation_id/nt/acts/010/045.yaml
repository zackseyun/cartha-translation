  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: id
  text: Orang-orang percaya dari golongan bersunat[a] yang datang bersama Petrus tercengang, karena karunia Roh Kudus telah dicurahkan bahkan[b] atas orang-orang bukan Yahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang percaya yang bersunat.” Secara harfiah, “orang-orang percaya dari sunat.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “juga.” Kata Yunani ini dapat menyatakan penambahan, tetapi dalam konteks ini kemungkinan menonjolkan keterkejutan: “bahkan.”'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bangsa-bangsa”; dalam konteks ini yang dimaksud ialah orang-orang bukan Yahudi. Bentuk Yunani “telah dicurahkan” menyatakan tindakan yang telah terjadi dengan hasil yang masih berlaku.
    reason: referent_clarification
lexical_decisions:
- source_word: ἐξέστησαν
  choice: tercengang
  rationale: Kata ini menyatakan rasa heran yang kuat. “Tercengang” alami dalam bahasa Indonesia modern dan mempertahankan kekuatan ungkapannya.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: orang percaya dari golongan bersunat
  rationale: Ungkapan ini mempertahankan konstruksi Yunani “dari sunat” sebagai penanda kelompok, yakni orang percaya Yahudi, tanpa sekadar mereduksinya menjadi keadaan jasmani.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: semua ... yang datang bersama Petrus
  rationale: ὅσοι membatasi kelompok itu pada semua orang percaya dari golongan bersunat yang menyertai Petrus; susunan ini alami dalam bahasa Indonesia.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: bahkan ke atas bangsa-bangsa lain
  rationale: Dalam konteks Kisah Para Rasul 10, ἔθνη menunjuk kepada orang non-Yahudi. “Bahkan” menyampaikan unsur tambahan sekaligus keterkejutan, sedangkan “ke atas” mempertahankan gambaran pencurahan.
- source_word: ἡ δωρεὰ
  choice: karunia
  rationale: “Karunia” menyatakan pemberian yang diberikan dengan cuma-cuma dan merupakan padanan Indonesia yang wajar dalam konteks pemberian ilahi.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: Ini adalah padanan baku, jelas, dan lintas tradisi bagi frasa genitif Yunani tersebut.
- source_word: ἐκκέχυται
  choice: telah dicurahkan
  rationale: Bentuk perfek pasif menyatakan tindakan yang sudah terlaksana dengan hasil yang tetap nyata. “Telah dicurahkan” mempertahankan tindakan pasif dan cocok dengan alur naratif Indonesia.
theological_decisions:
- issue: Rujukan ἔθνη dalam konteks masuknya orang non-Yahudi
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi
  rationale: Konteks mempertentangkan orang percaya Yahudi dengan kalangan non-Yahudi. “Bangsa-bangsa lain” mempertahankan nuansa kolektif ἔθνη, sementara catatan kaki menjelaskan rujukannya.
- issue: Daya aspek perfek ἐκκέχυται
  choice: telah dicurahkan
  alternative: sudah tercurah
  rationale: Pilihan utama menyatakan tindakan yang telah selesai dan bentuk pasifnya, tanpa meniadakan hasil yang masih berlangsung; catatan kaki menerangkan nuansa aspek tersebut.
- issue: Fungsi καί sebelum ἐπὶ τὰ ἔθνη
  choice: bahkan
  alternative: juga
  rationale: καί dapat bersifat aditif, tetapi keterkejutan para saksi dalam konteks ini mendukung nuansa emfatis “bahkan”; alternatif “juga” tetap dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur Yunani secara wajar, dengan istilah “golongan bersunat” untuk mempertahankan identitas kelompok dan “bangsa-bangsa lain” untuk rujukan non-Yahudi. Nuansa perfek ἐκκέχυται dijelaskan dalam keputusan penerjemahan tanpa menambah penafsiran denominasi.
