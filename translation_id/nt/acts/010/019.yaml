  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: id
  text: Ketika Petrus masih merenungkan penglihatan itu, Roh berkata kepadanya, “Lihatlah, beberapa orang laki-laki sedang mencarimu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang berusaha menemukanmu.”
    reason: Alternatif ini mencerminkan cakupan makna ζητέω, yang dapat berarti mencari atau berusaha menemukan seseorang.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: masih merenungkan
  rationale: Partisipel ini menggambarkan perenungan batin yang sedang berlangsung. “Masih merenungkan” menyampaikan aspek berkelanjutan dalam konteks dengan bahasa Indonesia yang alami.
- source_word: περὶ τοῦ ὁράματος
  choice: penglihatan itu
  rationale: Dalam bahasa Indonesia, “merenungkan penglihatan itu” secara alami menyampaikan bahwa penglihatan tersebut merupakan pokok perenungan Petrus tanpa perlu menerjemahkan περί secara terpisah.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Kisah Para Rasul 10, yang dimaksud adalah Roh ilahi yang mengarahkan Petrus. Huruf kapital memperjelas referennya tanpa menambahkan kata “Kudus”, yang tidak terdapat dalam teks Yunani ayat ini.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Terjemahan langsung dan wajar yang mempertahankan tindakan berbicara serta penerimanya.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian kepada keadaan yang segera perlu diperhatikan. “Lihatlah” mempertahankan dayanya dengan ragam modern dan bermartabat.
- source_word: ἄνδρες
  choice: beberapa orang laki-laki
  rationale: ἀνήρ menunjuk kepada orang dewasa laki-laki. “Beberapa” membuat bentuk jamak tanpa artikel terdengar alami dalam bahasa Indonesia, sedangkan “orang laki-laki” mempertahankan rujukan gendernya.
- source_word: ζητοῦντές σε
  choice: sedang mencarimu
  rationale: ζητέω di sini berarti mencari seseorang. “Sedang” menampilkan tindakan yang sedang berlangsung, dan bentuk enklitik “-mu” alami dalam ujaran langsung.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα
  choice: Roh, yaitu Roh Kudus yang berbicara kepada Petrus
  alternative: roh sebagai dorongan rohani yang tidak ditentukan
  rationale: Alur Kisah Para Rasul 10 menggambarkan Roh ilahi sebagai pelaku yang mengarahkan misi kepada bangsa-bangsa lain. Terjemahan “Roh” mempertahankan klaim naratif itu tanpa menambahkan “Kudus” ke dalam teks utama.
- issue: Penerjemahan gender ἄνδρες
  choice: beberapa orang laki-laki
  alternative: beberapa orang; para pengunjung
  rationale: Teks Yunani memakai ἀνήρ, bukan istilah umum yang dapat merujuk kepada orang tanpa membedakan gender. Karena itu, rujukan laki-laki dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Lihatlah” mempertahankan daya penarik perhatian dari ἰδού tanpa memakai ungkapan arkais, sedangkan “mencarimu” sesuai dengan ujaran langsung.
