  terminology: Kapitalisasi “Roh” konsisten dengan rujukan naratif kepada Roh ilahi. Istilah “penglihatan,” “orang laki-laki,” dan “mencarimu” akurat dan mudah dipahami. Catatan kaki menyajikan kemungkinan nuansa ζητέω secara memadai.
