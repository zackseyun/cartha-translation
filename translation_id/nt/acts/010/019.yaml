  source_fidelity: Terjemahan ini setia pada struktur dan makna teks Yunani. “Ketika Petrus masih merenungkan penglihatan itu” menyampaikan partisipel kini διενθυμουμένου serta hubungan waktunya dengan ujaran Roh. “Roh” tepat untuk τὸ πνεῦμα tanpa menambahkan “Kudus,” dan “orang laki-laki” mempertahankan kekhususan ἄνδρες. “Sedang mencarimu” adalah padanan yang wajar untuk ζητοῦντές σε.
