  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: id
  text: Sesudah menjelaskan semuanya kepada mereka, Kornelius mengutus mereka ke Yope.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: Sesudah menjelaskan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama. Pilihan ini secara alami menyampaikan bahwa Kornelius memaparkan seluruh perkara kepada mereka.
- source_word: ἅπαντα
  choice: semuanya
  rationale: Bentuk jamak netral ini berarti segala sesuatu atau seluruh perkara; 'semuanya' merupakan padanan Indonesia yang wajar dan mempertahankan cakupan menyeluruhnya.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif ini berfungsi sebagai objek tak langsung dari ἐξηγησάμενος.
- source_word: ἀπέστειλεν
  choice: Kornelius mengutus
  rationale: ἀποστέλλω berarti mengirim atau mengutus. Nama 'Kornelius' dipakai untuk memperjelas subjek tersirat dalam bahasa Indonesia, berdasarkan konteks langsung, sedangkan 'mengutus' sesuai untuk orang yang diberi suatu tugas.
- source_word: εἰς τὴν Ἰόππην
  choice: ke Yope
  rationale: εἰς dengan nama tempat menunjukkan gerak menuju tujuan. 'Yope' adalah bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, alami, dan bermartabat. Subjek eksplisit 'Kornelius' digunakan untuk menghindari ambiguitas pronominal yang terasa kurang alami dalam kalimat Indonesia mandiri.
