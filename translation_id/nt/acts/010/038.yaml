  source_fidelity: 'Terjemahan menyampaikan seluruh unsur utama teks Yunani dengan tepat: Yesus diidentifikasi sebagai berasal dari Nazaret; ὡς diterjemahkan dengan tepat sebagai “bagaimana”; pengurapan oleh Allah dengan Roh Kudus dan kuasa dipertahankan; pelayanan-Nya berkeliling, berbuat baik, dan menyembuhkan semua orang yang ditindas oleh Iblis juga tersampaikan. Klausa sebab-akibat terakhir, “karena Allah menyertai Dia,” dengan baik mencerminkan ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ.'
