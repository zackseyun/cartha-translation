  terminology: Istilah “Allah,” “mengurapi,” “Roh Kudus,” “kuasa,” dan “Iblis” tepat, lazim, dan mempertahankan bobot teologis maupun leksikal teks tanpa menambahkan penafsiran doktrinal. “Menyertai Dia” adalah padanan idiomatis yang memadai bagi “Allah bersama dia.”
