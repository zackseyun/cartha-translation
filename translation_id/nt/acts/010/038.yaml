id: ACT.10.38
reference: Acts 10:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: id
  text: 'Yesus dari Nazaret: bagaimana Allah mengurapi Dia dengan Roh Kudus dan kuasa. Dia berkeliling sambil berbuat baik dan menyembuhkan semua orang yang ditindas oleh Iblis, karena Allah menyertai Dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Yesus dari Nazaret
  rationale: Frasa ini mengenali Yesus berdasarkan asal-Nya. “Dari Nazaret” menerjemahkan ἀπό secara langsung dan tetap alami dalam bahasa Indonesia.
- source_word: ὡς
  choice: bagaimana
  rationale: Dalam susunan laporan yang ringkas ini, ὡς memperkenalkan uraian tentang Yesus. “Bagaimana” mempertahankan corak penjelasan naratif tanpa menjadikannya perbandingan.
- source_word: ἔχρισεν
  choice: mengurapi
  rationale: Pilihan ini mempertahankan arti dasar χρίω dan gaung mesianiknya tanpa menambahkan gelar atau penjelasan doktrinal yang tidak dinyatakan dalam ayat.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: dengan Roh Kudus dan kuasa
  rationale: “Dengan” menyampaikan fungsi datif sebagai sarana atau pemberian. “Kuasa” dibiarkan luas dan tidak dipersempit menjadi kuasa mukjizat saja.
- source_word: διῆλθεν
  choice: berkeliling
  rationale: Dalam konteks ini kata tersebut menggambarkan pelayanan Yesus yang berpindah-pindah dari satu tempat ke tempat lain.
- source_word: εὐεργετῶν
  choice: sambil berbuat baik
  rationale: Partisip ini menyatakan tindakan yang mendatangkan kebaikan bagi orang lain; bentuk “sambil” menghubungkannya secara alami dengan kegiatan berkeliling.
- source_word: ἰώμενος
  choice: menyembuhkan
  rationale: Ini merupakan padanan langsung dan lazim bagi tindakan memulihkan orang dari penyakit atau penderitaan.
- source_word: πάντας τοὺς καταδυναστευομένους
  choice: semua orang yang ditindas
  rationale: Bentuk pasif partisipial ini menyatakan orang-orang yang berada di bawah penindasan atau penguasaan keras.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: oleh Iblis
  rationale: διάβολος di sini menunjuk kepada pribadi jahat tertentu, sehingga nama sebutan “Iblis” paling jelas dalam bahasa Indonesia.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: karena Allah menyertai Dia
  rationale: “Karena” menyampaikan daya kausal ὅτι, sedangkan “menyertai Dia” merupakan ungkapan Indonesia yang alami untuk keberadaan Allah bersama-Nya.
theological_decisions:
- issue: Hubungan pengurapan Yesus dengan identitas dan misi-Nya
  choice: Mempertahankan kata “mengurapi” tanpa menguraikannya menjadi rumusan doktrinal.
  alternative: “Mengangkat sebagai Mesias” atau sekadar “memberi kuasa”.
  rationale: Teks menyatakan bahwa Allah mengurapi Yesus dengan Roh Kudus dan kuasa. Terjemahan ini mempertahankan gaung teologisnya tanpa menambahkan atau mengurangi isi ayat.
- issue: Rujukan πνεύματι ἁγίῳ
  choice: “Roh Kudus” sebagai rujukan pribadi ilahi.
  alternative: “roh kudus” sebagai daya yang impersonal.
  rationale: Dalam Kisah Para Rasul, ungkapan ini secara teratur menunjuk kepada Roh Kudus; penyebutan “Roh Kudus dan kuasa” juga membedakan Roh dari kuasa.
- issue: Fungsi klausa ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: Mempertahankannya sebagai alasan bagi pelayanan Yesus yang penuh kebaikan dan penyembuhan.
  alternative: Menganggapnya hanya keterangan penyertaan tanpa daya kausal, atau menjadikannya pernyataan yang menyelesaikan seluruh persoalan kristologis.
  rationale: Ayat ini menghubungkan karya Yesus dengan penyertaan Allah, tetapi tidak bermaksud menjelaskan secara lengkap hubungan antara Bapa dan Anak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Tanda titik dipakai setelah klausa pengurapan agar susunan Yunani yang padat menjadi jelas tanpa mengubah urutan gagasan. “Berkeliling sambil berbuat baik” terdengar alami dan tetap mempertahankan hubungan kedua partisip dengan kegiatan pelayanan Yesus.
