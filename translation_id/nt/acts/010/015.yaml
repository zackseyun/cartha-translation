  source_fidelity: Revisi diperlukan karena μὴ κοίνου terutama melarang Petrus menganggap atau menyebut sesuatu sebagai κοινός (“biasa/common” dalam kategori kemurnian), bukan menajiskannya secara aktif. Terjemahan revisi mempertahankan perbedaan ini dan tetap menyatakan tindakan Allah yang telah terjadi melalui ἐκαθάρισεν.
  naturalness: “Kembali terdengar suara ... untuk kedua kalinya” adalah bahasa Indonesia modern yang wajar dan tetap menyampaikan penegasan pengulangan πάλιν ἐκ δευτέρου. “Jangan kauanggap biasa” terdengar alami dalam konteks penilaian terhadap status kemurnian, dengan alternatif penjelas di catatan kaki.
  terminology: “Allah” dan “tahirkan” sesuai register Alkitab Indonesia dan mempertahankan nuansa kemurnian ritual. “Biasa” dipertahankan bagi κοινός agar tidak disamakan langsung dengan “najis/tidak tahir” (ἀκάθαρτος); alternatif yang lebih interpretatif ditempatkan di catatan kaki.
