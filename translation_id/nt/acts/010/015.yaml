  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: id
  text: Lalu kembali terdengar suara yang berkata kepadanya untuk kedua kalinya, “Apa yang telah Allah tahirkan, jangan kauanggap biasa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan kauanggap najis” atau “jangan perlakukan sebagai cemar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: terdengar ... suara
  rationale: Konstruksi ini alami dalam bahasa Indonesia untuk memperkenalkan ujaran surgawi tanpa menambahkan identitas pembicara yang tidak dinyatakan dalam teks.
- source_word: πάλιν ἐκ δευτέρου
  choice: untuk kedua kalinya ... lagi
  rationale: Kedua unsur pengulangan dalam bahasa Yunani dipertahankan dengan susunan yang masih wajar dalam bahasa Indonesia.
- source_word: πρὸς αὐτόν
  choice: yang berkata kepadanya
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa suara tersebut ditujukan kepada Petrus; kata 'berkata' tersirat oleh konteks φωνή dan kutipan langsung.
- source_word: Ἃ
  choice: Apa yang
  rationale: Pronomina relatif netral jamak dipakai secara umum dan kolektif; 'apa yang' merupakan padanan Indonesia yang alami.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Sebutan baku dan umum dalam bahasa Indonesia bagi satu-satunya Allah dalam konteks ini.
- source_word: ἐκαθάρισεν
  choice: telah Allah tahirkan
  rationale: '''Tahirkan'' mempertahankan nuansa penetapan kemurnian ritual, sedangkan ''telah'' menandai tindakan Allah yang sudah terlaksana dan tetap menentukan.'
- source_word: σὺ
  choice: kau-
  rationale: Pronomina eksplisit Yunani tercermin dalam bentuk persona kedua tunggal yang langsung dan sesuai dengan ujaran kepada Petrus.
- source_word: μὴ κοίνου
  choice: jangan kaunajiskan
  rationale: Dalam konteks kemurnian, κοινόω berarti menjadikan atau menganggap cemar/tidak tahir. 'Najiskan' mempertahankan kontras kategori kemurnian dengan 'tahirkan' dan lebih alami daripada terjemahan harfiah 'jadikan biasa'.
theological_decisions:
- issue: Bahasa kemurnian dalam penglihatan Petrus
  choice: tahirkan ... jangan kaunajiskan
  alternative: bersihkan ... jangan kauanggap biasa; jangan kauanggap tidak tahir
  rationale: Pasangan 'tahirkan/najiskan' menyampaikan pertentangan καθαρίζω dan κοινόω dalam ranah kemurnian ritual secara alami. Catatan kaki mempertahankan kemungkinan nuansa 'menganggap biasa' serta alternatif 'tidak tahir', sehingga perbedaan leksikalnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kau-' dipakai karena ujaran ditujukan langsung kepada satu orang. Susunan 'untuk kedua kalinya ... lagi' sengaja mempertahankan penekanan yang agak berulang dalam teks Yunani.
