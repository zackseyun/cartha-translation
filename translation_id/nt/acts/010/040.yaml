  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: id
  text: Allah membangkitkan orang ini[a] pada hari ketiga dan membuat-Nya tampak[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dia” atau “Dia inilah”; teks Yunani memakai kata tunjuk “ini” tanpa nomina yang dinyatakan dan menempatkannya di depan untuk penegasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadikan-Nya nyata” atau “mengizinkan Dia menjadi tampak”. Secara lebih harfiah, teks Yunani berbunyi “memberikan Dia untuk menjadi tampak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Orang inilah
  rationale: Kata tunjuk yang ditempatkan di depan bersifat menegaskan orang tertentu yang baru disebut, yaitu Yesus. “Orang inilah” mempertahankan penekanan itu dengan bahasa Indonesia yang wajar.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek eksplisit tindakan membangkitkan; padanan baku θεός dalam konteks ini adalah “Allah”.
- source_word: ἤγειρεν
  choice: dibangkitkan Allah
  rationale: Dalam konteks kebangkitan, ἐγείρω berarti “membangkitkan”. Bentuk pasif relatif dipakai agar penekanan pada τοῦτον tetap alami, sementara pelaku ilahi tetap dinyatakan dengan jelas.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Padanan alami bagi datif waktu ini tanpa menambahkan cara penghitungan hari yang tidak dinyatakan teks.
- source_word: ἔδωκεν
  choice: dibuat-Nya
  rationale: Dalam konstruksi dengan infinitif pelengkap, δίδωμι menyatakan bahwa Allah menjadikan atau mengaruniakan terjadinya penampakan. “Dibuat-Nya” menghasilkan susunan Indonesia yang alami tanpa menghapus tindakan Allah.
- source_word: αὐτὸν
  choice: Dia
  rationale: Kata ganti objek ini merujuk kepada Yesus.
- source_word: ἐμφανῆ
  choice: menampakkan diri
  rationale: ἐμφανής menyatakan keadaan menjadi terlihat atau nyata. Dalam konteks penampakan Yesus sesudah kebangkitan, “menampakkan diri” merupakan ungkapan Indonesia yang alami.
- source_word: γενέσθαι
  choice: menampakkan diri
  rationale: γίνομαι menyatakan menjadi atau mulai berada dalam suatu keadaan. Nuansanya dipadukan secara idiomatis dengan ἐμφανῆ sebagai “menampakkan diri”; bentuk harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Pelaku kebangkitan
  choice: dibangkitkan Allah
  alternative: Allah membangkitkan orang ini
  rationale: Teks menyatakan Allah sebagai pelaku kebangkitan Yesus. Susunan pasif mempertahankan pelaku tersebut sekaligus menonjolkan kata tunjuk di awal kalimat.
- issue: Penampakan sesudah kebangkitan
  choice: lalu dibuat-Nya menampakkan diri
  alternative: lalu dijadikan-Nya terlihat
  rationale: Terjemahan membedakan tindakan membangkitkan dari tindakan Allah yang memungkinkan Yesus tampak sesudah kebangkitan, tanpa menentukan kepada siapa Ia tampak; hal itu dilanjutkan pada ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang inilah” mempertahankan penegasan demonstratif Yunani, sedangkan “dibuat-Nya menampakkan diri” menyampaikan konstruksi Yunani secara idiomatis. Bentuk “-Nya” merujuk kepada Allah.
