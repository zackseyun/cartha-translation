  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: id
  text: Pesan yang Ia kirimkan kepada umat Israel[a], sambil memberitakan kabar baik tentang damai sejahtera melalui Yesus, Sang Mesias—Dialah Tuhan atas semuanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada anak-anak Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Dialah Tuhan atas semua orang.” Bentuk Yunani “semuanya” tidak menyebutkan lingkupnya secara eksplisit.'
    reason: scope_ambiguity
lexical_decisions:
- source_word: τὸν λόγον
  choice: Firman
  rationale: Dalam konteks ini λόγος menunjuk pada pesan yang Allah sampaikan. “Firman” mempertahankan bobot istilah Yunani sekaligus lazim dan dapat dipahami dalam register Alkitab bahasa Indonesia.
- source_word: ὃν ἀπέστειλεν
  choice: yang Ia sampaikan
  rationale: Secara harfiah berarti “yang Ia kirimkan.” Untuk pesan atau firman, “sampaikan” lebih alami dalam bahasa Indonesia tanpa mengubah gagasan bahwa Allah adalah pengutusnya.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: kepada umat Israel
  rationale: Ungkapan harfiah “anak-anak Israel” merupakan sebutan kolektif bagi bangsa Israel; “umat Israel” menyampaikan fungsi idiomatisnya secara wajar dan inklusif dalam bahasa Indonesia modern.
- source_word: εὐαγγελιζόμενος
  choice: ketika Ia memberitakan kabar baik
  rationale: Kata kerja ini secara eksplisit mengandung arti mengumumkan kabar baik. Terjemahan ini mempertahankan nuansa tersebut, yang dapat hilang jika hanya diterjemahkan “memberitakan.”
- source_word: εἰρήνην
  choice: tentang damai sejahtera
  rationale: “Damai sejahtera” adalah padanan Indonesia yang alami dan mencakup baik perdamaian maupun kesejahteraan yang tersirat dalam pemakaian Alkitab.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus, Sang Mesias
  rationale: διά dengan genitif menyatakan perantaraan. Χριστός di sini berfungsi sebagai gelar, sehingga diterjemahkan “Sang Mesias,” bukan sekadar ditransliterasikan sebagai “Kristus.”
- source_word: οὗτός
  choice: Dialah
  rationale: Bentuk demonstratif Yunani memberi penekanan pada Yesus. “Dialah” alami dalam bahasa Indonesia dan mempertahankan penekanan itu lebih baik daripada “Ia.”
- source_word: πάντων κύριος
  choice: Tuhan atas semua orang
  rationale: κύριος dipertahankan sebagai “Tuhan,” sedangkan πάντων dalam konteks perkataan kepada manusia paling alami dipahami sebagai cakupan universal atas semua orang. Catatan kaki mencatat kemungkinan cakupan yang lebih luas.
theological_decisions:
- issue: Fungsi Χριστός dalam Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  alternative: Yesus Kristus
  rationale: Dalam konteks pidato Petrus, Χριστός mempertahankan daya gelarnya sebagai Mesias. Terjemahan gelar membuat makna itu transparan tanpa menambahkan doktrin.
- issue: Penekanan οὗτός ἐστιν πάντων κύριος
  choice: Dialah Tuhan atas semua orang
  alternative: Ia adalah Tuhan atas semua orang
  rationale: “Dialah” menjaga penekanan demonstratif οὗτός pada pribadi Yesus, sementara tetap alami dan bermartabat dalam bahasa Indonesia.
- issue: Cakupan πάντων
  choice: semua orang
  alternative: segala sesuatu; semuanya
  rationale: Dalam konteks penerimaan bangsa-bangsa lain dan rujukan kepada umat Israel, “semua orang” merupakan pembacaan kontekstual yang kuat. Namun bentuk Yunani dapat juga dipahami secara lebih luas, sehingga alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur Yunani sejauh tetap alami. Kapitalisasi “Ia” dan “Dialah” menandai rujukan kepada Allah/Yesus menurut konvensi umum penerbitan Alkitab Indonesia; tanda koma pada “Yesus, Sang Mesias” memperjelas bahwa Mesias adalah gelar.
