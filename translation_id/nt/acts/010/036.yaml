  naturalness: Kalimat revisi tetap baku, jelas, dan bernada Alkitabiah modern. “Dialah Tuhan atas semuanya” mempertahankan penekanan οὗτός dan cakupan terbuka πάντων secara idiomatis.
  terminology: “Yesus, Sang Mesias” tepat untuk Ἰησοῦ Χριστοῦ sebagai nama dengan gelar. “Tuhan” tepat untuk κύριος. “Damai sejahtera” dapat dipertahankan sebagai padanan yang lazim, meskipun “damai” juga memungkinkan.
