- from: Firman yang Ia sampaikan kepada umat Israel[a], ketika Ia memberitakan kabar baik tentang damai sejahtera melalui Yesus, Sang Mesias—Dialah Tuhan atas semua orang.[b]
  to: Pesan yang Ia kirimkan kepada umat Israel[a], sambil memberitakan kabar baik tentang damai sejahtera melalui Yesus, Sang Mesias—Dialah Tuhan atas semuanya.[b]
  rationale: Revisi mengganti “Firman” dengan “Pesan” untuk mencerminkan λόγος secara lebih netral dalam konteks pengutusan sebuah berita. “Ketika Ia” diganti dengan “sambil” agar participium εὐαγγελιζόμενος mengalir alami tanpa mengubah hubungan tindakan. Yang utama, “atas semua orang” diganti dengan “atas semuanya” agar πάντων tetap mencakup luasnya pernyataan Yunani tanpa keputusan penafsiran yang membatasi cakupan hanya kepada manusia. Catatan kaki kini memberikan pembacaan yang lebih sempit sebagai alternatif, bukan sebaliknya.
