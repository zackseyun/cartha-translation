  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: id
  text: Karena itu, saya segera mengirim orang untuk memanggilmu[a], dan kamu telah berbuat baik dengan datang. Jadi sekarang, kami semua hadir di hadapan Allah untuk mendengar segala sesuatu yang telah diperintahkan Tuhan kepadamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saat itu juga” atau “tanpa menunda.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “Tuhan.” Dalam konteks ini sebutan tersebut kemungkinan merujuk kepada Yesus, meskipun sebagian orang memahaminya secara lebih umum sebagai Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: segera
  rationale: Ungkapan adverbial ini menyatakan tindakan yang dilakukan seketika atau tanpa penundaan. “Segera” alami dalam bahasa Indonesia modern dan mempertahankan penekanan pada cepatnya tindakan Kornelius.
- source_word: οὖν
  choice: karena itu / jadi
  rationale: Kata ini menghubungkan pernyataan dengan konteks sebelumnya dan juga menandai peralihan wacana. Dua padanan yang alami dipakai sesuai fungsinya pada masing-masing kemunculan.
- source_word: ἔπεμψα πρὸς σέ
  choice: saya menyuruh orang memanggilmu
  rationale: Secara harfiah berarti “saya mengutus kepada kamu,” tetapi dalam konteks Kornelius mengirim beberapa utusan untuk meminta Petrus datang. Padanan ini menyampaikan idiom tersebut dengan jelas tanpa menyatakan identitas para utusan.
- source_word: καλῶς ἐποίησας
  choice: kamu telah berbuat baik
  rationale: Ungkapan ini menyatakan persetujuan terhadap tindakan Petrus. Padanan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: παραγενόμενος
  choice: dengan datang
  rationale: Partisip ini menerangkan tindakan Petrus yang dinilai baik, yaitu kedatangannya. Bentuk “dengan datang” mempertahankan hubungan tersebut secara alami.
- source_word: νῦν οὖν
  choice: jadi sekarang
  rationale: Gabungan ini menandai peralihan kepada tujuan pertemuan. “Jadi sekarang” mempertahankan unsur simpulan dan waktu tanpa terasa kaku.
- source_word: πάντες ἡμεῖς
  choice: kami semua
  rationale: Bentuk Yunani menekankan seluruh kelompok yang berkumpul. “Kami semua” mempertahankan penekanan kolektif itu dan secara tepat tidak mencakup Petrus sebagai lawan bicara.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Frasa ini menyatakan kesadaran bahwa mereka hadir dalam hadirat dan pengawasan Allah. Padanan tradisional ini tetap jelas, khidmat, dan alami.
- source_word: πάρεσμεν
  choice: hadir
  rationale: Kata kerja ini berarti berada atau hadir di suatu tempat. “Hadir” cocok dengan suasana pertemuan dan dekat dengan makna sumber.
- source_word: ἀκοῦσαι
  choice: untuk mendengar
  rationale: Infinitif ini menyatakan tujuan kehadiran mereka. “Untuk mendengar” merupakan padanan langsung dan alami.
- source_word: πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ κυρίου
  choice: segala sesuatu yang telah diperintahkan Tuhan kepadamu
  rationale: Bentuk ini mempertahankan cakupan menyeluruh, daya perintah yang berwenang, penerima perintah, dan Tuhan sebagai pelaku, tanpa menambahkan identitas yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan τοῦ κυρίου (“Tuhan”)
  choice: Tuhan
  alternative: Allah; atau Tuhan Yesus
  rationale: Teks Yunani hanya menyebut “Tuhan.” Dalam konteks Kisah Para Rasul 10, sebutan ini kemungkinan merujuk kepada Yesus, tetapi rujukan kepada Allah juga dipahami oleh sebagian pembaca karena frasa sebelumnya menyebut kehadiran di hadapan Allah. Teks utama mempertahankan sebutan sumber tanpa memperjelasnya secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina “saya,” “kamu,” dan “kami” dipilih sebagai bentuk percakapan modern; “kami” menjaga pembedaan antara kelompok Kornelius dan Petrus sebagai lawan bicara. Susunan kalimat dibuat alami tanpa menghilangkan hubungan logis dan ketegangan rujukan dalam teks Yunani.
