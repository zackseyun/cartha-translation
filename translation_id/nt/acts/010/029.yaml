translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'saya' sesuai dengan tuturan sopan Petrus kepada sekelompok orang; 'kalian' menyatakan orang kedua jamak secara jelas tanpa tingkat formalitas berlebihan.
