base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: id
  text: Karena itu, ketika saya dipanggil, saya datang tanpa keberatan[a]. Maka saya ingin tahu, untuk alasan apa kalian memanggil saya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «tanpa ragu-ragu». Secara lebih harfiah, bahasa Yunani berarti «tanpa keberatan» atau «tanpa membantah».
    reason: lexical_alternative
  - marker: b
    text: Atau «Mengapa kalian memanggil saya?» Secara harfiah, «untuk alasan apa kalian memanggil saya?»
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Karena itu
  rationale: Menandai kesimpulan dari penjelasan sebelumnya. Nuansa penegasan καί diserap ke dalam alur kalimat karena terjemahan harfiahnya akan terasa kaku dalam bahasa Indonesia.
- source_word: ἀναντιρρήτως
  choice: tanpa keberatan
  rationale: Mempertahankan arti dasar bertindak tanpa membantah, menentang, atau mengajukan keberatan; lebih dekat dengan bahasa Yunani daripada 'tanpa ragu-ragu'.
- source_word: ἦλθον
  choice: saya datang
  rationale: Padanan langsung dan alami untuk bentuk aoris ἔρχομαι dalam konteks ini.
- source_word: μεταπεμφθείς
  choice: ketika saya dipanggil
  rationale: Partisip pasif ini menyatakan bahwa orang lain menyuruh agar Petrus datang. 'Dipanggil' alami dalam bahasa Indonesia dan tidak menyiratkan panggilan telepon.
- source_word: πυνθάνομαι οὖν
  choice: Jadi, saya bertanya
  rationale: οὖν menandai peralihan yang bersifat kesimpulan menuju pertanyaan, sedangkan πυνθάνομαι berarti bertanya atau mencari tahu.
- source_word: τίνι λόγῳ
  choice: atas alasan apa
  rationale: Mempertahankan bentuk eksplisit 'karena/atas alasan apa' dan tidak memadatkannya menjadi sekadar 'mengapa'.
- source_word: μετεπέμψασθέ με
  choice: kalian memanggil saya
  rationale: Menyatakan tindakan menyuruh agar Petrus datang dan mempertahankan hubungan leksikal dengan μεταπεμφθείς. 'Kalian' memperjelas bentuk orang kedua jamak dalam bahasa Yunani.
