  naturalness: Kalimat pertama jelas dan wajar. Kalimat kedua akan lebih mengalir dengan «Maka saya ingin tahu, untuk alasan apa kalian memanggil saya», yang menyatakan fungsi πυνθάνομαι sebagai permintaan informasi dan menghindari jeda yang agak kaku setelah «Jadi, saya bertanya:».
  terminology: Tidak ada istilah teologis atau nama yang perlu disesuaikan. «Dipanggil» dalam kedua klausa cukup konsisten untuk μεταπέμπομαι dan dapat dipahami sebagai disuruh datang dalam konteks ini.
