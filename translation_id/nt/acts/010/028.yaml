  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Kalian sendiri tahu bahwa seorang Yahudi tidak diperbolehkan bergaul dengan atau mengunjungi orang dari bangsa lain[a]. Namun, Allah telah menunjukkan kepadaku bahwa aku tidak boleh menyebut siapa pun cemar[b] atau tidak tahir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang dari kaum lain”; dalam konteks ini maksudnya orang bukan Yahudi.
    reason: lexical_alternative
  - marker: b
    text: “Cemar” menerjemahkan κοινός, yang secara harfiah berarti “umum” atau “biasa,” tetapi dalam konteks kemurnian dapat berarti profan atau tercemar. Istilah ini berbeda dari “tidak tahir” (ἀκάθαρτος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: Lalu ia berkata kepada mereka
  rationale: τέ menghubungkan tuturan ini dengan alur sebelumnya secara ringan; “lalu” merupakan pengantar naratif yang alami tanpa memberi tekanan berlebihan.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Kalian sendiri tahu
  rationale: Kata ganti ὑμεῖς yang dinyatakan secara eksplisit memberi penekanan; “sendiri” mempertahankan tekanan itu.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: bahwa ... tidak diperbolehkan
  rationale: ἀθέμιτος menyatakan sesuatu yang tidak diizinkan menurut aturan atau adat yang berlaku. Ungkapan ini alami dalam bahasa Indonesia dan tidak melemahkannya menjadi sekadar kurang pantas.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: seorang Yahudi
  rationale: Bentuk tunggal representatif dipertahankan. Dalam bahasa Indonesia, “seorang Yahudi” alami dan cukup untuk konteks ini tanpa menambahkan kata “laki-laki” yang terasa kaku.
- source_word: κολλᾶσθαι
  choice: bergaul dengan
  rationale: Dalam konteks sosial, verba ini berarti melekatkan diri atau berhubungan dekat; “bergaul dengan” menyampaikan maknanya secara wajar.
- source_word: ἢ προσέρχεσθαι
  choice: atau mengunjungi
  rationale: Dalam konteks Petrus memasuki rumah orang non-Yahudi, “mengunjungi” mengungkapkan makna praktis verba tersebut lebih alami daripada “mendekati”.
- source_word: ἀλλοφύλῳ
  choice: orang dari bangsa lain
  rationale: ἀλλόφυλος secara harfiah menunjuk orang dari bangsa atau kaum lain. Pilihan ini mempertahankan arti leksikal tanpa langsung menafsirkannya dengan istilah teknis “bangsa bukan Yahudi”.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Namun, Allah telah menunjukkan kepadaku
  rationale: κἀμοί secara bentuk berarti “dan kepadaku”, tetapi konteksnya mengandung kontras dengan pandangan sebelumnya. Bentuk perfektif Indonesia menonjolkan dampak penyataan itu bagi tindakan Petrus saat ini.
- source_word: μηδένα ... ἄνθρωπον
  choice: seorang pun
  rationale: ἄνθρωπος di sini berarti manusia secara umum, bukan khusus laki-laki. “Seorang pun” idiomatis dan inklusif.
- source_word: κοινὸν
  choice: najis secara umum
  rationale: κοινός di sini adalah istilah kemurnian yang secara harfiah berarti “umum/biasa” dan dapat menunjuk keadaan profan atau tercemar. Frasa ini mempertahankan perbedaannya dari ἀκάθαρτος sambil menghindari ungkapan Indonesia yang tidak bermakna, seperti “menyebut seseorang biasa”.
- source_word: ἢ ἀκάθαρτον
  choice: atau tidak tahir
  rationale: ἀκάθαρτος adalah istilah baku tentang ketidaktahiran. “Tidak tahir” menjaga kategori kemurnian serta membedakannya dari κοινός.
theological_decisions:
- issue: Hubungan larangan pergaulan Yahudi dengan penyataan Allah
  choice: Pernyataan Petrus diterjemahkan sebagai sesuatu yang tidak diperbolehkan bagi seorang Yahudi, lalu dikontraskan dengan penyataan Allah bahwa tidak seorang pun boleh diberi kategori kenajisan tersebut.
  alternative: Melemahkan ἀθέμιτον menjadi “kurang pantas”, atau menyatakan bahwa Taurat secara eksplisit melarang semua hubungan semacam itu.
  rationale: Teks menggambarkan pemahaman Petrus tentang batas sosial-keagamaan Yahudi tanpa menjelaskan sumber persis larangan itu. Terjemahan tidak boleh mengurangi kekuatannya menjadi etiket belaka ataupun menambahkan klaim tentang ketentuan eksplisit Taurat.
- issue: Penerapan penglihatan kepada manusia
  choice: 'Mempertahankan objek manusia: “seorang pun”.'
  alternative: Membatasi kesimpulan hanya pada makanan atau menghapus bahasa kategori kemurnian.
  rationale: Walaupun konteks sebelumnya melibatkan penglihatan tentang binatang, Petrus sendiri secara eksplisit menerapkannya kepada μηδένα ... ἄνθρωπον, yaitu tidak seorang manusia pun.
- issue: Perbedaan κοινός dan ἀκάθαρτος
  choice: Membedakan keduanya sebagai “najis secara umum” dan “tidak tahir”.
  alternative: Menerjemahkan keduanya dengan satu istilah yang sama, “najis”.
  rationale: Kedua kata membentuk pasangan kategori yang berhubungan tetapi tidak identik. Pembedaan dalam teks utama, disertai catatan kaki, menjaga ketegangan leksikal Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena Petrus berbicara kepada sekelompok orang dan bentuk Yunani jamak; “ia” menjaga gaya naratif formal. Dua istilah kemurnian dipertahankan berbeda, dengan catatan kaki untuk menjelaskan ungkapan yang tidak memiliki padanan Indonesia yang sepenuhnya sejajar.
