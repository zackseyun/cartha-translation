  source_fidelity: Draf pada dasarnya menyampaikan struktur temporal ἔτι dengan tepat, mempertahankan tindakan Roh Kudus yang datang secara mendadak melalui “turun ke atas,” serta mencakup semua pendengar. Namun, “menyampaikan perkataan-perkataan ini” kurang langsung untuk λαλοῦντος ... τὰ ῥήματα ταῦτα; verba sumber berarti Petrus sedang berbicara/mengucapkan, bukan terutama menyampaikan. “Kata-kata ini” lebih dekat dan lebih idiomatis.
  naturalness: “Perkataan-perkataan” terasa sebagai penggandaan yang kaku dalam bahasa Indonesia modern. “Mengucapkan kata-kata ini” alami dalam konteks ujaran yang sedang berlangsung. “Yang mendengarkan” sudah cukup untuk partisipel kini tanpa tambahan “sedang,” karena konteks temporal kalimat telah menyatakannya.
  terminology: “Roh Kudus” dan “firman itu” adalah istilah baku serta sesuai konteks pewartaan. “Turun ke atas” mempertahankan citra verba ἐπέπεσε tanpa memaksakan penafsiran teologis. Catatan kaki perlu menampilkan alternatif sebagai satuan yang jelas dan tidak mengubah fokus ayat.
