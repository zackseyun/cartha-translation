  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: id
  text: Ketika Petrus masih mengucapkan kata-kata ini, Roh Kudus turun ke atas semua orang yang mendengarkan firman itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Kudus datang ke atas semua orang yang mendengarkan pesan itu.”
    reason: Memberikan alternatif yang alami untuk ἐπέπεσε (“datang ke atas”) dan padanan kontekstual λόγος (“pesan”) tanpa menambahkan penafsiran.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Ketika Petrus masih menyampaikan
  rationale: Klausa genitif absolut dengan partisipel kini menyatakan tindakan yang sedang berlangsung bersamaan dengan peristiwa utama. 'Ketika ... masih' alami dalam bahasa Indonesia dan mempertahankan keserentakan.
- source_word: τὰ ῥήματα ταῦτα
  choice: perkataan-perkataan ini
  rationale: Bentuk jamak ῥήματα menunjuk pada hal-hal yang baru saja diucapkan Petrus. Bentuk ini mempertahankan pembedaan dari λόγος pada akhir ayat.
- source_word: ἐπέπεσε
  choice: turun ke atas
  rationale: ἐπιπίπτω secara harfiah dapat berarti 'jatuh/menimpa', tetapi ketika subjeknya Roh Kudus, 'turun ke atas' menyampaikan gerakan datang atas seseorang secara wajar dan bermartabat dalam bahasa Indonesia, tanpa menambahkan penafsiran doktrinal.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku, jelas, dan alami dalam bahasa Indonesia modern.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: ke atas semua orang yang sedang mendengarkan
  rationale: Mencakup semua orang tanpa pengecualian dan mempertahankan aspek partisipel kini, yaitu mereka sedang mendengarkan pada saat itu.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: λόγος dalam konteks ini menunjuk pada pemberitaan yang sedang didengar. 'Firman itu' mempertahankan korespondensi leksikal dan bobot religius istilah tersebut, sedangkan penunjuk 'itu' membuat rujukannya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan Roh Kudus dalam ἐπέπεσε
  choice: Roh Kudus turun ke atas
  alternative: Roh Kudus meliputi; Roh Kudus datang ke atas
  rationale: Pilihan ini mempertahankan gambaran gerak dalam verba Yunani sekaligus menghindari kesan kecelakaan yang dapat timbul dari terjemahan sangat harfiah 'jatuh'. Tidak dijelaskan lebih jauh sebagai pengalaman atau doktrin tertentu.
- issue: Makna λόγος dalam konteks pemberitaan
  choice: firman itu
  alternative: pesan itu; pemberitaan itu
  rationale: '''Firman'' mempertahankan hubungan leksikal dengan λόγος dan cocok bagi konteks pewartaan, sementara catatan kaki menyediakan padanan maknawi yang lebih eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan pengulangan 'perkataan-perkataan' dipertahankan untuk membedakan ῥήματα dari λόγος. Penanda catatan kaki ditempatkan pada akhir kalimat karena catatan mencakup dua pilihan leksikal dalam klausa utama.
