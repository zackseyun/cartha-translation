revisions:
- from: Ketika Petrus masih menyampaikan perkataan-perkataan ini, Roh Kudus turun ke atas semua orang yang sedang mendengarkan firman itu.[a]
  to: Ketika Petrus masih mengucapkan kata-kata ini, Roh Kudus turun ke atas semua orang yang mendengarkan firman itu.[a]
  rationale: Revisi mengganti ungkapan yang kurang idiomatis dengan “masih mengucapkan kata-kata ini,” yang lebih langsung mencerminkan genitif absolut dan objek jamak Yunani. Istilah “Roh Kudus,” “turun ke atas,” dan “firman itu” dipertahankan karena setia pada teks dan lazim dalam bahasa Indonesia baku. Catatan kaki dipertahankan sebagai alternatif leksikal yang terbatas.
