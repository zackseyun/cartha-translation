  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: id
  text: Hal itu terjadi tiga kali, lalu benda itu segera diangkat ke surga.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadah itu”. Kata Yunani ini dapat berarti benda, wadah, atau perlengkapan. Dalam konteks sebelumnya, benda itu digambarkan seperti kain lebar.
