lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Hal itu terjadi
  rationale: Demonstrativa netral τοῦτο menunjuk kembali pada rangkaian peristiwa dalam penglihatan. δέ merupakan penghubung ringan yang diserap secara alami ke dalam alur kalimat, sedangkan ἐγένετο digunakan dalam arti peristiwa, yaitu 'terjadi'.
- source_word: ἐπὶ τρίς
  choice: tiga kali
  rationale: Ungkapan ini menyatakan pengulangan sebanyak tiga kali; bentuk Indonesia ini alami dan jelas.
- source_word: καὶ εὐθὺς
  choice: lalu segera
  rationale: καί menghubungkan kejadian berikutnya, sedangkan εὐθύς menandakan bahwa kejadian itu berlangsung tanpa penundaan.
- source_word: ἀνελήμφθη
  choice: terangkat
  rationale: Bentuk pasif aoris dari ἀναλαμβάνω menggambarkan benda itu diangkat atau dibawa ke atas. 'Terangkat' mempertahankan bentuk pasif dan arah geraknya tanpa menentukan pelaku.
- source_word: τὸ σκεῦος
  choice: benda itu
  rationale: σκεῦος adalah istilah luas untuk benda, wadah, atau perlengkapan. 'Benda itu' terdengar wajar dalam bahasa Indonesia dan tidak mempersempit makna menjadi 'kain' meskipun konteks sebelumnya menggambarkannya seperti kain lebar.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: εἰς menyatakan arah tujuan. Dalam konteks penglihatan yang berasal dari ranah ilahi, 'surga' paling sesuai, sementara kemungkinan arti 'langit' tetap dicatat.
theological_decisions:
- issue: Rujukan οὐρανός dalam penglihatan Petrus
  choice: surga
  alternative: langit
  rationale: οὐρανός dapat berarti 'langit' maupun 'surga'. Konteks penglihatan, yakni benda yang turun dan kembali ke ranah ilahi, mendukung 'surga', tetapi alternatif leksikalnya tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah umum 'benda' dipilih untuk menjaga keluasan makna σκεῦος, sedangkan dua ambiguitas utama dijelaskan melalui catatan kaki.
