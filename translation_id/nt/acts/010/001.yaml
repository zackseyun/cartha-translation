  verdict: revise
  source_fidelity: Draf menangkap lokasi, nama, pengenalan tak tentu, dan sebutan kesatuan. Namun ἑκατοντάρχης lebih tepat dipertahankan sebagai “senturion”, dan σπεῖρα secara khusus adalah “kohor”, bukan sekadar “kesatuan”. Tambahan “Romawi” pada “perwira pasukan Romawi” bersifat penjelasan historis yang dapat diterima secara implisit, tetapi tidak perlu dalam teks ketika istilah teknis yang tepat dipakai.
  naturalness: Kalimat dapat dibuat lebih lancar dan tetap baku dengan “Di Kaisarea ada seorang pria bernama Kornelius”. “Kohor Italia” lebih jelas sebagai nama sebutan unit daripada “Pasukan Italia”.
  terminology: Gunakan “senturion” untuk ἑκατοντάρχης dan “kohor” untuk σπεῖρα. “Kohor Italia” mempertahankan hubungan langsung antara kata “disebut” dan nama unit, tanpa mengubahnya menjadi istilah umum “pasukan”. Nama “Kaisarea” dan “Kornelius” sudah sesuai pemakaian Indonesia.
  issues:
