  register: Bahasa Indonesia baku, modern, dan naratif. Istilah militer dijelaskan secara ringkas dalam teks dan lebih tepat secara historis dalam catatan kaki; nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
