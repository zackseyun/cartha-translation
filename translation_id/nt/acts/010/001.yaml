  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: id
  text: Di Kaisarea ada seorang pria bernama Kornelius[a], seorang senturion dari kohor yang disebut Kohor Italia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ada seorang pria di Kaisarea.” Ungkapan Yunani yang tak tentu ini memperkenalkan seorang tokoh baru.
    reason: lexical_alternative
  - marker: b
    text: Kohor adalah satuan militer Romawi. Sebutan “Kohor Italia” mungkin menunjuk pada kesatuan yang berkaitan dengan Italia atau yang beranggotakan prajurit Italia.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: ada seorang
  rationale: Ungkapan ini memperkenalkan tokoh laki-laki baru secara tak tentu; bentuk Indonesia ini alami dan tidak menghilangkan fungsi pengenalannya.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini hanya menandai peralihan naratif ringan; dalam bahasa Indonesia, peralihan tersebut sudah wajar tanpa kata penghubung eksplisit.
- source_word: ἐν Καισαρείᾳ
  choice: Di Kaisarea
  rationale: Padanan lokatif langsung dengan ejaan nama tempat yang lazim dalam bahasa Indonesia.
- source_word: ὀνόματι Κορνήλιος
  choice: bernama Kornelius
  rationale: Ungkapan datif ini secara alami menyatakan nama seseorang.
- source_word: ἑκατοντάρχης
  choice: seorang perwira pasukan Romawi
  rationale: Istilah ini menunjuk perwira Romawi yang secara tradisional disebut senturion; terjemahan deskriptif singkat lebih mudah dipahami pembaca umum tanpa menyatakan bahwa ia selalu memimpin tepat seratus prajurit.
- source_word: ἐκ σπείρης
  choice: dari kesatuan
  rationale: σπεῖρα adalah satuan militer Romawi, yakni kohor; 'kesatuan' memberi teks utama yang alami, sedangkan rincian historis dijelaskan dalam catatan kaki.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: yang disebut Pasukan Italia
  rationale: Mencerminkan participel 'yang disebut' dan memperlakukan Ἰταλική sebagai nama atau sebutan kesatuan militer.
