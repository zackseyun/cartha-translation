    issue: Istilah ἑκατοντάρχης dan σπεῖρα dibuat terlalu umum dalam teks utama.
    rationale: “Perwira pasukan Romawi dari kesatuan” tidak menyampaikan pangkat senturion dan jenis unit kohor yang dinyatakan oleh teks Yunani. Istilah teknis yang telah diserap ini dapat dipakai dengan penjelasan pada catatan kaki.
  - severity: low
    issue: Catatan a memakai frasa “seorang tertentu”, yang kurang alami dan tidak menyebut unsur laki-laki dari ἀνήρ.
    rationale: Alternatif yang lebih idiomatis dan lebih dekat dengan ungkapan Yunani ialah “Ada seorang pria di Kaisarea.”
