  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: id
  text: bukan kepada seluruh bangsa itu, melainkan kepada saksi-saksi yang telah dipilih sebelumnya oleh Allah[a], yaitu kepada kami, yang makan dan minum bersama Dia setelah Dia bangkit dari antara orang mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah ditetapkan sebelumnya oleh Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “setelah Dia dibangkitkan dari antara orang mati.” Bentuk Yunani di sini secara alami dapat diterjemahkan “setelah Dia bangkit,” meskipun Perjanjian Baru di tempat lain juga menyatakan bahwa Dia dibangkitkan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: bukan kepada seluruh bangsa itu
  rationale: Frasa ini membatasi lingkup orang-orang yang mendapat penampakan Yesus. Dalam konteks Kisah Para Rasul, λαός dengan artikel menunjuk kepada bangsa Israel; 'seluruh bangsa itu' menjaga acuan tersebut dan kontras dengan kelompok saksi yang terbatas.
- source_word: μάρτυσι
  choice: kepada saksi-saksi
  rationale: Istilah ini menunjuk kepada orang-orang yang menyaksikan dan kemudian memberi kesaksian tentang apa yang mereka lihat; bentuk ulang merupakan cara alami untuk menandai jamak dalam bahasa Indonesia.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: yang telah dipilih sebelumnya oleh Allah
  rationale: Partisip perfek pasif menyatakan tindakan Allah yang telah dilakukan sebelumnya dan tetap relevan. 'Dipilih sebelumnya' mempertahankan gagasan pemilihan terdahulu tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: ἡμῖν
  choice: yaitu kepada kami
  rationale: Pronomina datif ini menjelaskan secara aposisional siapa saksi-saksi tersebut. 'Yaitu' membuat hubungan penjelas itu jelas dan alami.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: yang makan dan minum bersama Dia
  rationale: Kedua verba berawalan συν- menekankan kebersamaan nyata dalam perjamuan. Terjemahan konkret ini mempertahankan kesaksian mengenai keberadaan jasmani Yesus sesudah kebangkitan.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: setelah Dia bangkit dari antara orang mati
  rationale: Konstruksi infinitif berartikel dengan μετά bersifat temporal, sedangkan ἀναστῆναι secara alami bernilai intransitif, 'bangkit'. Ungkapan 'dari antara orang mati' menjaga makna ἐκ νεκρῶν secara lebih tepat daripada sekadar 'dari kematian'.
theological_decisions:
- issue: Cara menyatakan kebangkitan dalam ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: setelah Dia bangkit dari antara orang mati
  alternative: setelah Dia dibangkitkan dari antara orang mati
  rationale: Bentuk Yunani dalam ayat ini secara alami diterjemahkan dengan verba aktif-intransitif 'bangkit'. Pilihan ini tidak menyangkal bahwa Allah membangkitkan Yesus sebagaimana dinyatakan di tempat lain, tetapi tidak mengganti rumusan khas ayat ini dengan bentuk pasif.
- issue: Nuansa προκεχειροτονημένοις
  choice: dipilih sebelumnya
  alternative: ditetapkan sebelumnya
  rationale: Kata ini dapat menyatakan pemilihan atau penetapan terdahulu. Konteks menyoroti kelompok saksi yang Allah tentukan sebelumnya; teks utama memakai ungkapan yang alami tanpa meniadakan nuansa penetapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kontras 'bukan ... melainkan ...' mengikuti alur Yunani; 'yaitu kepada kami' memperjelas aposisi tanpa menambah isi. Kapitalisasi 'Dia' dipakai untuk rujukan kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia.
