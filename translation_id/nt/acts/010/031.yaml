id: ACT.10.31
reference: Acts 10:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: id
  text: Lalu ia berkata, “Kornelius, doamu telah didengar, dan sedekahmu telah diingat di hadapan Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησί
  choice: ia berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk lampau naratif yang wajar dalam bahasa Indonesia.
- source_word: Κορνήλιε
  choice: Kornelius
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: εἰσηκούσθη
  choice: telah didengar
  rationale: Aoristus pasif menyatakan bahwa doa itu mendapat pendengaran; bentuk 'telah didengar' mempertahankan suara pasif dan relevansi hasilnya.
- source_word: ἡ προσευχὴ
  choice: doamu
  rationale: Bentuk tunggal dipertahankan, dengan pronomina kepunyaan yang alami dalam bahasa Indonesia.
- source_word: αἱ ἐλεημοσύναι
  choice: sedekahmu
  rationale: '''Sedekah'' secara ringkas dan lazim menunjuk pemberian belas kasih kepada orang yang membutuhkan; bentuk kolektif Indonesia dapat mewakili jamak Yunani tanpa membatasi pada satu pemberian.'
- source_word: ἐμνήσθησαν
  choice: telah diingat
  rationale: Ungkapan pasif dipertahankan agar bahasa 'mengingat' yang berbobot alkitabiah tidak diparafrasakan menjadi sekadar 'diperhatikan'.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Padanan baku dan bermartabat yang menyatakan kehadiran serta penilaian Allah tanpa penjelasan tambahan.
theological_decisions:
- issue: Makna tindakan kemurahan Kornelius
  choice: sedekahmu
  alternative: pemberianmu kepada orang miskin; perbuatan kemurahanmu
  rationale: Pilihan ini menyampaikan pemberian belas kasih yang konkret tanpa menyimpulkan bahwa tindakan tersebut menghasilkan jasa keselamatan.
- issue: Bahasa tentang ingatan ilahi
  choice: telah diingat di hadapan Allah
  alternative: telah diperhatikan Allah; Allah telah mengingatnya
  rationale: Struktur pasif dan metafora 'diingat' dipertahankan karena merupakan bagian dari bobot teologis teks, tanpa menjelaskan mekanisme atau akibatnya melampaui ayat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Lalu' menghubungkan ujaran ini dengan alur narasi; 'ia' mempertahankan rujukan pronominal teks sumber tanpa menambahkan identitas pembicara.
