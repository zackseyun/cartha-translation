  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: id
  text: Namun, Petrus mengangkatnya[a] sambil berkata, “Berdirilah[b]. Aku sendiri juga manusia.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menolongnya berdiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Bangunlah.”
