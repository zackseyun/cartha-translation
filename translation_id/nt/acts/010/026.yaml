    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: membangunkannya
  rationale: ἐγείρω di sini berarti membuat Kornelius bangkit dari posisi tersungkur. “Membangunkannya” mempertahankan daya kausatif verba tanpa memastikan apakah Petrus mengangkat atau sekadar membantunya berdiri.
- source_word: Ἀνάστηθι
  choice: Berdirilah
  rationale: Imperatif aoris ἀνίστημι memerintahkan Kornelius bangkit dan berdiri. “Berdirilah” alami dalam konteks fisik ini.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: Aku sendiri juga
  rationale: 'Gabungan καί, ἐγώ, dan αὐτός memberi penekanan inklusif pada Petrus: ia sendiri pun termasuk manusia. Bentuk ini mempertahankan penekanan yang lebih lengkap daripada sekadar “aku juga”.'
- source_word: ἄνθρωπός εἰμι
  choice: manusia
  rationale: ἄνθρωπος menunjuk pada kemanusiaan Petrus dan tidak perlu diterjemahkan secara bergender sebagai “seorang laki-laki.” “Manusia” langsung dan wajar dalam pernyataan ini.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan antara tindakan Kornelius yang tersungkur dan tanggapan korektif Petrus. “Namun” menyampaikan kontras itu dengan register naratif yang bermartabat.
theological_decisions:
- issue: Tanggapan Petrus terhadap tindakan Kornelius yang tersungkur di kakinya
  choice: Teks menunjukkan Petrus menghentikan tindakan itu dengan menegaskan bahwa dirinya juga manusia.
  alternative: Ucapan tersebut dapat dipahami secara lebih minimal sebagai ungkapan kerendahan hati pribadi.
  rationale: Terjemahan mempertahankan alasan eksplisit Petrus—kemanusiaannya yang sama—tanpa menambahkan klaim doktrinal tentang hakikat tindakan Kornelius atau merumuskan ajaran ibadah yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang alami dan bermartabat. “Aku” dipakai sesuai tuturan langsung yang dekat, sedangkan susunan “Aku sendiri juga manusia” mempertahankan tekanan Yunani tanpa terdengar terlalu teknis.
