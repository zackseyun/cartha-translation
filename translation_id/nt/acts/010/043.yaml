id: ACT.10.43
reference: Acts 10:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: id
  text: 'Tentang Dialah semua nabi bersaksi[a]: setiap orang yang percaya kepada-Nya menerima pengampunan dosa melalui nama-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, memberi kesaksian.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: tentang Dia
  rationale: Datif demonstratif bersama μαρτυροῦσιν secara idiomatis menyatakan pribadi yang menjadi pokok kesaksian. Susunan “Tentang Dialah” juga mempertahankan penekanan pada Yesus.
- source_word: πάντες οἱ προφῆται
  choice: semua nabi
  rationale: Menyampaikan cakupan menyeluruh dari kesaksian para nabi tanpa membatasi ungkapan itu hanya pada sebuah bagian kanon tertentu.
- source_word: μαρτυροῦσιν
  choice: bersaksi
  rationale: Padanan Indonesia yang ringkas, wajar, dan tetap mempertahankan daya evidensial kata Yunani; alternatif idiomatis dicatat dalam catatan kaki.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: pengampunan dosa
  rationale: Ungkapan baku dan mudah dipahami yang menyampaikan pelepasan atau penghapusan kesalahan karena dosa.
- source_word: λαβεῖν
  choice: menerima
  rationale: Infinitif ini merupakan isi kesaksian para nabi. Bentuk verba finit dalam bahasa Indonesia menghasilkan pernyataan umum yang alami tanpa mengubah maknanya.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: melalui nama-Nya
  rationale: Mempertahankan idiom alkitabiah dan gagasan perantaraan tanpa memperluas “nama” menjadi tafsiran eksplisit seperti “kuasa” atau “wewenang.”
- source_word: πάντα τὸν πιστεύοντα
  choice: setiap orang yang percaya
  rationale: Partisip maskulin tunggal bersifat generik dan distributif, sehingga “setiap orang” tepat dan tidak membatasi pernyataan ini pada laki-laki.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: Dengan πιστεύω, frasa ini menyatakan kepercayaan yang diarahkan kepada seseorang. “Percaya kepada-Nya” merupakan idiom Indonesia yang alami.
theological_decisions:
- issue: Cakupan dan syarat penerimaan pengampunan
  choice: Ayat menyatakan bahwa setiap orang yang percaya kepada Yesus menerima pengampunan dosa melalui nama-Nya.
  alternative: Memperluas kalimat dengan rumusan doktrinal tentang mekanisme keselamatan.
  rationale: Terjemahan mempertahankan hubungan yang dinyatakan teks antara Yesus, iman, dan pengampunan tanpa menambahkan rumusan denominasi tertentu.
- issue: Partisip maskulin generik
  choice: setiap orang yang percaya
  alternative: setiap laki-laki yang percaya
  rationale: Bentuk maskulin Yunani di sini mewakili siapa pun secara umum dan bukan pembatasan berdasarkan jenis kelamin.
- issue: Makna “nama-Nya”
  choice: melalui nama-Nya
  alternative: melalui kuasa atau wewenang-Nya
  rationale: Ungkapan sumber dibiarkan dalam bentuk idiomatisnya agar kaitan nama dengan pribadi dan otoritas Yesus tetap terbuka tanpa penjelasan tafsir yang berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan topikal “Tentang Dialah” mempertahankan penekanan Yunani pada Yesus, sedangkan tanda titik dua memperjelas isi kesaksian para nabi. Kapitalisasi pronomina ilahi mengikuti gaya penerbitan Indonesia yang lazim.
