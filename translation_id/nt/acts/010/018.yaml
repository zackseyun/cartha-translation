  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: id
  text: Mereka berseru dan bertanya apakah Simon, yang disebut Petrus, sedang menumpang di situ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang menginap di situ” atau “sedang diterima sebagai tamu di situ.” Kata Yunani yang digunakan mengandung arti tinggal sebagai tamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: berseru
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului pertanyaan. “Berseru” secara alami menggambarkan mereka memanggil dengan suara nyaring kepada orang-orang di dalam rumah.
- source_word: ἐπυνθάνοντο
  choice: bertanya
  rationale: Bentuk imperfek menunjukkan pertanyaan atau penyelidikan yang sedang dilakukan. “Bertanya” paling wajar dalam alur narasi Indonesia tanpa membebani kalimat dengan aspek yang tidak perlu diperjelas.
- source_word: εἰ
  choice: apakah
  rationale: Kata ini memperkenalkan pertanyaan tidak langsung; “apakah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Simon, yang disebut Petrus
  rationale: Frasa ini mengidentifikasi Simon melalui nama lain yang dikenakan kepadanya. Klausa relatif mempertahankan kedua nama dan nuansa pasif dari ἐπικαλούμενος.
- source_word: ἐνθάδε
  choice: di situ
  rationale: Karena narator menggambarkan para utusan yang datang ke rumah itu, “di situ” terdengar alami dalam narasi bahasa Indonesia dan tetap menyatakan lokasi yang sedang mereka tanyakan.
- source_word: ξενίζεται
  choice: sedang menumpang
  rationale: Verba ini menyatakan bahwa seseorang tinggal sebagai tamu atau menerima pemondokan. “Sedang menumpang” mempertahankan aspek kini dalam pertanyaan tidak langsung serta nuansa keramahtamahan lebih baik daripada sekadar “tinggal”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Menumpang” dipilih untuk menyampaikan nuansa tinggal sebagai tamu tanpa gaya yang terlalu formal; catatan kaki mempertahankan alternatif leksikal dan nuansa pasif keramahtamahan.
