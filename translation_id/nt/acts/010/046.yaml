  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: id
  text: 'Sebab mereka mendengar orang-orang itu berkata-kata dalam bahasa lidah[a] dan mengagungkan Allah. Lalu Petrus menjawab:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbicara dalam bahasa-bahasa.” Kata Yunani yang dipakai dapat berarti lidah atau bahasa; frasa ini tidak menentukan sifat ujaran tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: mereka mendengar
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung, tetapi dalam bahasa Indonesia aspek itu sudah cukup alami tersirat oleh konteks tanpa harus menambahkan 'sedang'.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memberikan alasan atau dasar penjelasan bagi pernyataan sebelumnya.
- source_word: αὐτῶν
  choice: orang-orang itu
  rationale: Pronomina ini merujuk kembali kepada kelompok yang baru disebut; bentuk ini lebih jelas dan alami dalam bahasa Indonesia tanpa menyebut mereka secara interpretatif sebagai 'bangsa-bangsa lain'.
- source_word: λαλούντων
  choice: berbicara
  rationale: Padanan langsung dan wajar bagi λαλέω dalam konstruksi mendengar seseorang berbicara.
- source_word: γλώσσαις
  choice: dalam berbagai bahasa
  rationale: γλῶσσα dapat menunjuk pada lidah atau bahasa. Dalam bahasa Indonesia, 'berbicara dalam berbagai bahasa' alami dan mempertahankan kemungkinan adanya lebih dari satu bahasa, sementara ungkapan alternatif yang lazim dalam tradisi gerejawi dicatat dalam catatan kaki.
- source_word: μεγαλυνόντων
  choice: mengagungkan
  rationale: μεγαλύνω berarti membesarkan atau memuliakan; 'mengagungkan' mempertahankan gambaran verbal Yunani dan terdengar wajar sebagai bahasa pujian kepada Allah.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk θεός dalam konteks ini.
- source_word: τότε
  choice: Lalu
  rationale: Menandai kelanjutan urutan peristiwa secara alami dalam narasi Indonesia.
- source_word: ἀπεκρίθη
  choice: berkata
  rationale: Walaupun secara leksikal berarti 'menjawab/menanggapi', tidak ada pertanyaan eksplisit sebelumnya; 'berkata' merupakan ungkapan naratif Indonesia yang alami dan tidak mengharuskan adanya pertanyaan.
- source_word: Πέτρος
  choice: Petrus
  rationale: Bentuk baku nama Πέτρος dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna γλώσσαις dalam konteks ujaran yang dimampukan Roh
  choice: dalam berbagai bahasa
  alternative: dengan bahasa-bahasa lidah
  rationale: Kata Yunani itu secara leksikal dapat berarti bahasa maupun lidah. Teks utama memakai ungkapan Indonesia yang jelas dan wajar tanpa menentukan apakah ujaran tersebut merupakan bahasa manusia yang dikenali atau bentuk ujaran lain; alternatif tradisional dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern, jelas, dan bermartabat. 'Mengagungkan Allah' mempertahankan kekuatan μεγαλύνω. Tanda koma pada akhir ayat mengikuti kelanjutan langsung ke ucapan Petrus dalam ayat berikutnya.
