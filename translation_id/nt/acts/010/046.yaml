  verdict: revise
  source_fidelity: Draf menangkap hubungan penjelas γάρ, kedua partisip yang dikoordinasikan, dan urutan τότε dengan baik. Namun, “berbagai bahasa” menambahkan gagasan keragaman (“berbagai”) yang tidak dinyatakan oleh γλώσσαις dan cenderung memilih satu penafsiran atas istilah yang dipersengketakan. “Berkata” juga melemahkan ἀπεκρίθη, yang secara langsung berarti “menjawab/menanggapi.”
  naturalness: “Sebab mereka mendengar orang-orang itu ...” dan “mengagungkan Allah” alami dalam bahasa Indonesia standar modern. “Berkata-kata dalam bahasa lidah” merupakan ungkapan Indonesia yang lazim untuk mempertahankan idiom “speaking in tongues”; alternatif “bahasa-bahasa” dijelaskan dalam catatan kaki.
  terminology: “Allah” dan “Petrus” tepat. Istilah “bahasa lidah” dipakai di teks utama untuk mempertahankan idiom serta ambiguitas yang disengaja dalam sumber; catatan kaki mencatat kemungkinan “bahasa-bahasa” tanpa memutuskan hakikat ujaran itu.
  issues:
  - severity: medium
    issue: “dalam berbagai bahasa” menambahkan unsur “berbagai.”
    rationale: Bentuk jamak γλώσσαις tidak dengan sendirinya menyatakan “berbagai” bahasa. Selain itu, pilihan ini memihak makna “languages” di teks utama, padahal konteks dan istilahnya diperdebatkan.
  - severity: medium
    issue: “Petrus berkata” tidak mencerminkan ἀπεκρίθη secara cukup dekat.
    rationale: Walaupun tidak ada pertanyaan eksplisit, ἀποκρίνομαι lazim berarti “menjawab” atau “menanggapi.” “Menjawab” mempertahankan bentuk sumber tanpa membuat klaim bahwa suatu pertanyaan harus telah diajukan.
  - severity: high
