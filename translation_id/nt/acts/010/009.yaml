  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: id
  text: Keesokan harinya, sementara orang-orang itu sedang dalam perjalanan dan mendekati kota, Petrus naik ke atap rumah untuk berdoa, kira-kira pada jam keenam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, kira-kira tengah hari menurut penghitungan waktu siang orang Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami berarti ‘pada hari berikutnya’; δέ berfungsi ringan dalam alur narasi dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: sementara orang-orang itu masih dalam perjalanan
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan. ‘Orang-orang itu’ mempertahankan rujukan khusus kepada para utusan Kornelius, sedangkan ‘masih dalam perjalanan’ merupakan ungkapan Indonesia yang alami.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: dan sudah mendekati kota
  rationale: Partisip kedua masih berada dalam konstruksi yang sama dan menunjukkan bahwa mereka hampir tiba; ‘mendekati kota’ menerjemahkan ἐγγίζω secara langsung dan wajar.
- source_word: ἀνέβη
  choice: naik
  rationale: Verba aoris sederhana ini menyatakan gerakan menuju tempat yang lebih tinggi; ‘naik’ ringkas dan idiomatis.
- source_word: ἐπὶ τὸ δῶμα
  choice: ke atap rumah
  rationale: δῶμα di sini menunjuk pada atap datar rumah yang dapat digunakan sebagai ruang kegiatan. ‘Atap rumah’ lebih alami dalam bahasa Indonesia daripada padanan yang terlalu harfiah.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif ini menyatakan tujuan Petrus naik ke atap; konstruksi ‘untuk berdoa’ alami dan tepat.
- source_word: περὶ ὥραν ἕκτην
  choice: kira-kira pada jam keenam
  rationale: ‘Kira-kira’ mempertahankan makna perkiraan dari περί, dan ‘jam keenam’ menjaga cara penghitungan waktu dalam budaya sumber; penjelasan waktu modern diberikan dalam catatan kaki.
