  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: id
  text: Namun, bangunlah, turunlah, dan pergilah bersama mereka tanpa bimbang,[a] sebab Akulah yang telah mengutus mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa membeda-bedakan.” Partisip Yunani ini dapat berarti “tanpa ragu atau bimbang,” tetapi juga “tanpa membuat pembedaan”; makna kedua mungkin menggemakan tema orang-orang Yahudi dan bangsa-bangsa lain dalam pasal ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai peralihan yang berlawanan dari kebingungan Petrus kepada tindakan yang diperintahkan; “Namun” ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἀναστὰς
  choice: bangunlah
  rationale: Partisip aoris ini berfungsi dalam rangkaian perintah. “Bangunlah” menyampaikan tindakan segera secara alami.
- source_word: κατάβηθι
  choice: turunlah
  rationale: Mempertahankan arah gerak dari tempat Petrus berada di atas atap.
- source_word: πορεύου σὺν αὐτοῖς
  choice: pergilah bersama mereka
  rationale: Menyampaikan perintah untuk pergi dengan menyertai para utusan tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: μηδὲν διακρινόμενος
  choice: tanpa ragu sedikit pun
  rationale: Dalam konteks langsung, διακρίνομαι paling wajar menunjuk pada keraguan atau kebimbangan Petrus. Ungkapan ini alami dalam bahasa Indonesia, sementara kemungkinan makna “tanpa membeda-bedakan” dipertahankan dalam catatan kaki.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah tersebut dengan hubungan sebab yang jelas.
- source_word: ἐγὼ
  choice: Akulah
  rationale: Kata ganti subjek dinyatakan secara eksplisit dalam bahasa Yunani untuk penekanan; bentuk “Akulah” mempertahankan penekanan itu.
- source_word: ἀπέσταλκα αὐτούς
  choice: yang telah mengutus mereka
  rationale: “Telah mengutus” mencerminkan tindakan yang sudah selesai dan tetap relevan pada saat itu; “mereka” menunjuk kepada para utusan.
theological_decisions:
- issue: Makna μηδὲν διακρινόμενος dalam kaitannya dengan penerimaan orang bukan Yahudi
  choice: tanpa ragu sedikit pun
  alternative: tanpa membeda-bedakan
  rationale: Konteks terdekat menyoroti kebingungan Petrus dan perintah Roh agar ia pergi bersama para utusan, sehingga makna tidak ragu atau tidak bimbang cocok sebagai teks utama. Namun, verba Yunani ini juga dapat berarti tidak membuat pembedaan, yang selaras dengan tema Yahudi–bukan Yahudi dalam pasal ini. Catatan kaki mempertahankan ambiguitas dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Rangkaian bentuk perintah berakhiran -lah mempertahankan desakan teks tanpa terdengar kasar. Penekanan pada ἐγώ disampaikan dengan “Akulah.”
