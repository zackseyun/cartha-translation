  to: Kornelius berkata, “Empat hari yang lalu, pada jam seperti sekarang ini, yakni pada jam kesembilan,[a] aku sedang berdoa di rumahku. Lihatlah, seorang laki-laki berdiri di hadapanku dengan pakaian yang berkilau.”
  rationale: Mengganti “menjawab” dengan “berkata” agar sesuai dengan ἔφη, dan mengganti “Tiba-tiba” dengan “Lihatlah” agar fungsi ἰδού dipertahankan tanpa menambahkan unsur temporal. Susunan keterangan waktu diperjelas dalam bahasa Indonesia sambil mempertahankan rujukan kepada jam kesembilan dan jam saat ini.
