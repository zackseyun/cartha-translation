id: ACT.10.30
reference: Acts 10:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: id
  text: Kornelius berkata, “Empat hari yang lalu, pada jam seperti sekarang ini, yakni pada jam kesembilan,[a] aku sedang berdoa di rumahku. Lihatlah, seorang laki-laki berdiri di hadapanku dengan pakaian yang berkilau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, kira-kira pukul tiga sore.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: menjawab
  rationale: Dalam konteks percakapan, verba pengantar ujaran ini secara alami berarti bahwa Kornelius menjawab Petrus; bentuk aoris menyajikannya sebagai tindakan naratif utuh.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Empat hari yang lalu, tepat pada jam seperti sekarang ini
  rationale: Ungkapan ini menunjuk pada hari keempat sebelumnya dan jam yang sama dengan saat Kornelius berbicara. Rumusan Indonesia ini menyampaikan hubungan waktunya dengan alami tanpa menghilangkan acuan kepada jam saat ini.
- source_word: ἤμην ... προσευχόμενος
  choice: aku sedang berdoa
  rationale: Konstruksi perifrastis imperfek menggambarkan tindakan yang sedang berlangsung pada waktu lampau.
- source_word: τὴν ἐνάτην
  choice: pada jam kesembilan
  rationale: Mempertahankan sistem penunjukan waktu dalam dunia sumber; padanan waktu modern diberikan dalam catatan kaki.
- source_word: ἐν τῷ οἴκῳ μου
  choice: di rumahku
  rationale: Ungkapan lokasi yang lugas dan alami dalam bahasa Indonesia.
- source_word: ἰδοὺ
  choice: Tiba-tiba
  rationale: Partikel ini menarik perhatian kepada kemunculan yang mencolok dalam cerita. 'Tiba-tiba' menyampaikan fungsi wacananya secara alami, tanpa memakai seruan arkais.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Kata ini secara khusus merujuk kepada sosok berjenis kelamin laki-laki dalam penampakannya.
- source_word: ἔστη ἐνώπιόν μου
  choice: berdiri di hadapanku
  rationale: Mempertahankan makna tindakan dan posisi sosok tersebut secara idiomatis.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: dengan pakaian yang berkilau
  rationale: ἐσθής berarti pakaian, sedangkan λαμπρός menyatakan kilau atau kecemerlangan; rumusan ini mempertahankan daya visualnya.
theological_decisions:
- issue: Penunjukan waktu τὴν ἐνάτην
  choice: pada jam kesembilan
  alternative: pada kira-kira pukul tiga sore
  rationale: Teks utama mempertahankan penunjukan waktu dari budaya sumber, sedangkan padanan jam modern dicantumkan dalam catatan kaki agar mudah dipahami.
- issue: Identitas sosok yang tampak sebagai ἀνήρ
  choice: seorang laki-laki
  alternative: seorang malaikat
  rationale: Ayat ini menggambarkan sosok itu menurut penampilannya sebagai seorang laki-laki dan tidak menyebutnya 'malaikat' secara eksplisit; terjemahan tidak menambahkan identifikasi teologis dari konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina 'aku' dipakai di dalam kutipan sesuai tuturan personal Kornelius. Ungkapan budaya sumber 'jam kesembilan' dipertahankan dan dijelaskan melalui catatan kaki.
