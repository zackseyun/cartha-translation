  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: id
  text: Tetapi, di setiap bangsa, orang yang takut kepada-Nya dan melakukan apa yang benar[a][b] berkenan kepada-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan mengerjakan kebenaran” atau “dan mempraktikkan kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Yunani δικαιοσύνη, biasanya berarti “kebenaran”; dalam konteks tertentu juga dapat diterjemahkan “keadilan.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “diterima oleh-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: Menandai kontras dengan pernyataan sebelumnya bahwa Allah tidak memandang muka; bentuk ini alami dalam bahasa Indonesia dan menghubungkan ayat dengan konteksnya.
- source_word: ἐν παντὶ ἔθνει
  choice: dari bangsa mana pun
  rationale: Menyampaikan cakupan universal dan distributif frasa Yunani secara alami; yang dimaksud ialah orang-orang yang berasal dari setiap bangsa, bukan wilayah tempat tindakan itu dilakukan.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: orang yang takut kepada-Nya
  rationale: Partisip berartikel berfungsi sebagai nomina. Ungkapan ini mempertahankan makna takut yang penuh hormat kepada Allah tanpa membatasinya pada gender tertentu.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: dan melakukan apa yang benar
  rationale: ἐργάζομαι menunjukkan tindakan nyata, sedangkan ungkapan ini menyampaikan δικαιοσύνη secara wajar dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: δικαιοσύνην
  choice: apa yang benar
  rationale: Dalam kolokasi verbal ini, pilihan tersebut lebih alami daripada 'melakukan kebenaran' dan tetap memuat gagasan perilaku yang benar. Kemungkinan terjemahan lebih harfiah dipertahankan dalam catatan kaki.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: berkenan kepada-Nya
  rationale: Mencerminkan konstruksi adjektiva predikatif 'dapat diterima/berkenan bagi-Nya' secara alami, tanpa menambahkan gagasan bahwa orang itu memperoleh penerimaan sebagai upah.
theological_decisions:
- issue: Apakah ayat ini mengajarkan keselamatan berdasarkan perbuatan atau menggambarkan orang yang diterima Allah tanpa membedakan bangsa
  choice: Teks menyatakan bahwa orang dari bangsa mana pun yang takut kepada Allah dan melakukan apa yang benar berkenan kepada-Nya.
  alternative: Menafsirkan secara eksplisit bahwa orang itu memperoleh keselamatan melalui perbuatan, atau bahwa tindakannya semata-mata merupakan bukti iman yang menyelamatkan.
  rationale: Bahasa Yunani mengaitkan keberkenanan ilahi dengan takut akan Allah dan melakukan δικαιοσύνη dalam konteks ketidakberpihakan Allah. Terjemahan mempertahankan pernyataan dan ketegangan teologis itu tanpa menyisipkan penyelesaian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah klausa yang diterangkannya.
