  source_fidelity: Klausa utama dan istilah teologis pada dasarnya diterjemahkan dengan setia. Namun, ἀλλ’ lebih tepat diterjemahkan “Tetapi” daripada “Sebaliknya”, yang dapat memberi kesan pertentangan kebalikan yang lebih kuat. Selain itu, ἐν παντὶ ἔθνει secara langsung menyatakan cakupan “di setiap bangsa”; “dari bangsa mana pun” dapat dipahami secara idiomatis, tetapi kurang mempertahankan bentuk distributif-lokatif sumbernya.
  naturalness: “Tetapi, di setiap bangsa, orang yang takut kepada-Nya dan melakukan apa yang benar berkenan kepada-Nya” adalah bahasa Indonesia baku, alami, dan tetap bernada khidmat. Penempatan penanda catatan kaki langsung sesudah unsur yang dijelaskan juga lebih jelas.
  terminology: “Takut kepada-Nya” mempertahankan makna takut yang hormat. “Melakukan apa yang benar” merupakan padanan idiomatis yang memadai untuk ἐργαζόμενος δικαιοσύνην tanpa mempersempitnya menjadi keadilan sosial atau memaksakan penjelasan teologis. “Berkenan kepada-Nya” sesuai untuk δεκτὸς αὐτῷ.
