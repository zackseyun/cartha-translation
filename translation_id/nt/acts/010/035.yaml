    rationale: Partikel adversatif ini terutama menandai kontras dengan ayat sebelumnya, bukan pernyataan yang merupakan kebalikan. “Tetapi” lebih netral dan dekat dengan fungsi Yunani.
  - severity: medium
    issue: “dari bangsa mana pun” untuk ἐν παντὶ ἔθνει
    rationale: Frasa tersebut dapat menyampaikan universalitas, tetapi menggeser frasa lokatif-distributif “di setiap bangsa” menjadi asal seseorang dari bangsa apa pun. “Di setiap bangsa” mempertahankan konstruksi sumber dan cakupan yang dimaksud.
  - severity: low
