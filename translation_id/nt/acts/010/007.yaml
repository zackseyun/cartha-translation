  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: id
  text: Setelah malaikat yang berbicara kepadanya pergi, Kornelius memanggil dua orang pelayan rumah tangganya[a] dan seorang prajurit saleh dari antara mereka yang mendampinginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua orang budak rumah tangganya.” Kata Yunani οἰκέται menunjuk pada anggota rumah tangga yang bekerja dalam pelayanan dan dapat berstatus budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Setelah ... pergi
  rationale: Mengungkapkan bahwa kepergian malaikat selesai sebelum Kornelius memanggil para pelayannya; bentuk ini alami dalam bahasa Indonesia dan tidak memberi tekanan berlebih pada δέ.
- source_word: ὁ ἄγγελος
  choice: malaikat
  rationale: Dalam konteks penglihatan Kornelius, kata ini menunjuk kepada utusan surgawi, bukan sekadar utusan manusia.
- source_word: ὁ λαλῶν αὐτῷ
  choice: yang berbicara kepadanya
  rationale: Klausa relatif ini secara alami mempertahankan fungsi partisipel yang mengidentifikasi malaikat tersebut.
- source_word: φωνήσας
  choice: Kornelius memanggil
  rationale: Nama subjek dijelaskan dari konteks agar kalimat Indonesia tidak kabur. Partisipel aoristus menyatakan tindakan memanggil yang berlanjut ke tindakan pada ayat berikutnya.
- source_word: δύο τῶν οἰκετῶν
  choice: dua orang pelayan rumah tangganya
  rationale: οἰκέτης menunjuk pada pelayan atau hamba yang menjadi bagian dari rumah tangga. Ungkapan ini alami sekaligus mempertahankan latar domestiknya.
- source_word: στρατιώτην εὐσεβῆ
  choice: seorang prajurit saleh
  rationale: εὐσεβής menyatakan kesalehan atau pengabdian yang penuh hormat; 'saleh' ringkas dan lazim dalam bahasa Indonesia tanpa menambahkan istilah khusus seperti 'takut akan Allah'.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: dari antara orang-orang yang selalu melayaninya
  rationale: Mempertahankan unsur partitif 'dari antara' dan nuansa ketekunan atau kesiapsediaan dalam προσκαρτερέω.
theological_decisions:
- issue: Makna ἄγγελος dalam konteks
  choice: malaikat
  alternative: utusan
  rationale: Konteks langsung Kisah Para Rasul 10 menggambarkan sosok dalam penglihatan ilahi Kornelius, sehingga makna utusan surgawi dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Nama 'Kornelius' dinyatakan untuk memperjelas subjek tersirat. Ayat tetap berhubungan secara sintaksis dengan tindakan yang berlanjut pada ayat berikutnya.
