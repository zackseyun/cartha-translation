review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Yunani: urutan temporal ἀπῆλθεν sebelum φωνήσας terjaga, «malaikat» tepat dalam konteks penglihatan, dan «dari antara» menyampaikan genitif partitif. Namun «selalu melayaninya» sedikit terlalu spesifik dan dapat menyiratkan layanan terus-menerus; τῶν προσκαρτερούντων αὐτῷ terutama mengidentifikasi para pendamping/pelayan yang hadir atau bertugas kepadanya.'
  naturalness: Bahasa baku dan mudah dibaca. «Mereka yang mendampinginya» lebih luwes daripada «orang-orang yang selalu melayaninya» dan mencakup fungsi seorang prajurit sebagai attendant tanpa mempersempitnya menjadi pelayanan terus-menerus.
  terminology: «Malaikat», «Kornelius», «pelayan rumah tangga», dan «prajurit saleh» sesuai register serta konteks. Catatan kaki perlu menyatakan alternatif «budak rumah tangga» secara langsung, sebab οἰκέται dapat menunjuk pada anggota rumah tangga dalam status perhambaan; «hamba» sendiri tidak cukup jelas bagi pembaca modern.
  issues:
