    issue: «selalu melayaninya» menerjemahkan προσκαρτερούντων αὐτῷ secara terlalu kuat.
    rationale: Kata itu dapat mengandung ketekunan, tetapi dalam konteks ini frasa tersebut terutama menunjuk kelompok orang yang mendampingi atau bertugas kepada Kornelius. «Mendampinginya» mempertahankan cakupan tanpa menambahkan adverbia absolut «selalu».
  - severity: low
    issue: Alternatif dalam catatan kaki tidak secara eksplisit menyebut status budak.
    rationale: «Dua orang hamba rumah tangganya» dapat dipahami secara luas dalam bahasa Indonesia modern. Karena catatan dimaksudkan untuk menandai alternatif leksikal οἰκέται, «dua orang budak rumah tangganya» lebih transparan, dengan penjelasan yang tetap berhati-hati.
