  to: Setelah malaikat yang berbicara kepadanya pergi, Kornelius memanggil dua orang pelayan rumah tangganya[a] dan seorang prajurit saleh dari antara mereka yang mendampinginya.
  rationale: Revisi membatasi penyesuaian pada dua titik. «Mereka yang mendampinginya» menyampaikan τῶν προσκαρτερούντων αὐτῷ secara alami tanpa menguatkannya menjadi «selalu», sedangkan catatan kaki kini dengan jelas mencatat kemungkinan makna status perhambaan dari οἰκέται. Struktur ayat yang berlanjut ke ayat berikutnya dan tindakan «memanggil» tetap dipertahankan secara idiomatis dalam bahasa Indonesia.
