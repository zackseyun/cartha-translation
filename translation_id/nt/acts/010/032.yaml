id: ACT.10.32
reference: Acts 10:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: id
  text: Karena itu, suruhlah orang ke Yope dan panggillah Simon yang disebut Petrus.[a] Ia sedang menumpang di rumah Simon, seorang penyamak kulit, di tepi laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suruhlah orang menjemput Simon yang disebut Petrus.” Kata Yunani itu berarti menyuruh agar seseorang dipanggil atau didatangkan kepada diri sendiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Karena itu, suruhlah orang ke Yope
  rationale: Bentuk perintah aoristus πέμψον menuntut tindakan langsung, sedangkan οὖν menyatakan kelanjutan atau kesimpulan dari perkataan sebelumnya. Ungkapan 'suruhlah orang' secara alami menyiratkan pengutusan utusan dalam bahasa Indonesia.
- source_word: μετακάλεσαι
  choice: panggillah
  rationale: Verba medium ini berarti menyuruh seseorang dipanggil atau didatangkan kepada si pembicara. 'Panggillah' ringkas, wajar, dan mempertahankan daya perintahnya.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Simon yang disebut Petrus
  rationale: Frasa ini mengenali Simon melalui nama lain yang dikenakan kepadanya, tanpa menambahkan gagasan bahwa Petrus adalah nama keluarga.
- source_word: ξενίζεται
  choice: sedang menumpang
  rationale: Bentuk ini menunjukkan bahwa Petrus menerima tumpangan sebagai tamu. 'Sedang menumpang' lebih tepat daripada sekadar 'tinggal' dan tetap alami dalam bahasa Indonesia modern.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: di rumah Simon, seorang penyamak kulit
  rationale: Terjemahan ini mempertahankan unsur 'rumah', nama pemiliknya, dan pekerjaannya. Penambahan 'kulit' memperjelas arti profesi penyamak bagi pembaca modern.
- source_word: παρὰ θάλασσαν
  choice: di tepi laut
  rationale: παρά dengan akusatif di sini menunjukkan lokasi di sisi atau dekat laut; 'di tepi laut' merupakan padanan Indonesia yang alami dan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Yope' memakai bentuk nama tempat yang lazim dalam tradisi Alkitab Indonesia. 'Menumpang' mempertahankan nuansa bahwa Petrus diterima sebagai tamu, dan 'penyamak kulit' menjelaskan profesi secara mudah dipahami.
