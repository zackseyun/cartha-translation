  to: Mereka menjawab, “Kornelius, seorang senturion, perwira Romawi, adalah orang benar yang takut akan Allah dan mendapat kesaksian baik dari seluruh bangsa Yahudi.[a] Ia telah menerima petunjuk ilahi[b] melalui seorang malaikat kudus untuk menyuruh memanggilmu ke rumahnya dan mendengar perkataan darimu.”
