id: ACT.10.22
reference: Acts 10:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: id
  text: Mereka menjawab, “Kornelius, seorang senturion, perwira Romawi, adalah orang benar yang takut akan Allah dan mendapat kesaksian baik dari seluruh bangsa Yahudi.[a] Ia telah menerima petunjuk ilahi[b] melalui seorang malaikat kudus untuk menyuruh memanggilmu ke rumahnya dan mendengar perkataan darimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari seluruh umat Yahudi.” Kata Yunani yang diterjemahkan “bangsa” menunjuk suatu kelompok etnis atau umat, bukan negara politik modern.
    reason: lexical_alternative
  - marker: b
    text: Atau “menerima pesan ilahi” atau “diperingatkan.” Kata kerja Yunani ini menunjukkan komunikasi atau petunjuk yang berasal dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: perwira
  rationale: Istilah ini alami dalam bahasa Indonesia untuk perwira militer Romawi; konteks historis memberi acuannya tanpa perlu memakai istilah serapan yang kurang umum, ‘senturion’.
- source_word: ἀνὴρ δίκαιος
  choice: orang benar
  rationale: Mempertahankan nuansa moral-keagamaan δίκαιος tanpa menyimpulkan status keselamatan Kornelius.
- source_word: φοβούμενος τὸν θεόν
  choice: yang takut akan Allah
  rationale: Mempertahankan ungkapan verbal dan idiom alkitabiah, serta tidak mengubahnya menjadi kategori teologis yang lebih khusus.
- source_word: μαρτυρούμενος
  choice: dikenal baik
  rationale: Menyampaikan makna kesaksian atau reputasi baik secara wajar dalam bahasa Indonesia modern.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: oleh seluruh bangsa Yahudi
  rationale: Cukup dekat dengan bentuk Yunani; ‘bangsa’ di sini menunjuk kelompok etnis atau umat, bukan negara politik modern.
- source_word: ἐχρηματίσθη
  choice: menerima petunjuk ilahi
  rationale: Menunjukkan bahwa komunikasi tersebut berasal dari ranah ilahi tanpa mempersempit maknanya menjadi sekadar peringatan.
- source_word: ἀγγέλου ἁγίου
  choice: dari seorang malaikat kudus
  rationale: Mempertahankan kata sifat ἁγίου yang secara eksplisit menggambarkan malaikat itu.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: untuk memanggilmu ke rumahnya
  rationale: Mengungkapkan tindakan menyuruh orang menjemput atau mendatangkan Petrus secara ringkas dan alami.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: mendengarkan perkataanmu
  rationale: Mempertahankan acuan kepada ‘kata-kata’ yang berasal dari Petrus tanpa mempersempitnya menjadi khotbah formal.
theological_decisions:
- issue: Gambaran tentang kesalehan Kornelius tanpa memasukkan kategori doktrinal kemudian
  choice: orang benar yang takut akan Allah
  alternative: orang saleh dan takut akan Allah
  rationale: Terjemahan mempertahankan penilaian moral-keagamaan teks, tetapi tidak menyimpulkan status perjanjian atau keselamatan Kornelius.
- issue: Sifat komunikasi malaikat
  choice: menerima petunjuk ilahi
  alternative: menerima pesan ilahi; diperingatkan
  rationale: Konteks menunjukkan komunikasi berotoritas dari Allah, tetapi isi komunikasinya bukan terutama sebuah peringatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Perwira’ dipilih karena lebih mudah dipahami daripada ‘senturion’; struktur kalimat dipecah menjadi dua agar deretan partisipium dan infinitif Yunani tetap jelas. Semua penanda catatan kaki ditempatkan dalam teks utama.
