id: ACT.10.4
reference: Acts 10:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: id
  text: Namun, ia menatapnya dengan saksama dan menjadi takut. Ia berkata, “Ada apa, Tuan?” Lalu ia berkata kepadanya, “Doa-doamu dan sedekahmu[a] telah naik sebagai peringatan di hadapan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan belas kasihan.” Kata Yunani ini terutama merujuk pada pemberian kepada orang yang membutuhkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: menatap dia dengan saksama
  rationale: Mengungkapkan tatapan yang tetap dan penuh perhatian dengan bahasa Indonesia yang alami.
- source_word: ἔμφοβος γενόμενος
  choice: menjadi takut
  rationale: Mempertahankan nuansa ingresif, yaitu mulai berada dalam keadaan takut, tanpa melebihkannya menjadi sangat ketakutan.
- source_word: Τί ἐστιν
  choice: Ada apa
  rationale: Ungkapan Indonesia yang langsung dan wajar untuk menanyakan maksud atau keperluan sang utusan.
- source_word: κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat dan register luhur; dalam konteks ini tidak harus menyatakan pengakuan kristologis.
- source_word: προσευχαί
  choice: doa-doa
  rationale: Padanan baku dan sesuai konteks untuk bentuk jamak Yunani.
- source_word: ἐλεημοσύναι
  choice: pemberian sedekah
  rationale: Menunjukkan secara jelas tindakan memberi kepada orang yang membutuhkan; lebih tepat secara kontekstual daripada ungkapan luas 'perbuatan belas kasihan'.
- source_word: ἀνέβησαν
  choice: telah naik
  rationale: Mempertahankan metafora gerak ke atas serta hasil kini dari tindakan lampau.
- source_word: εἰς μνημόσυνον
  choice: sebagai suatu peringatan
  rationale: Mempertahankan citra persembahan peringatan tanpa menambahkan kekhususan ritual yang tidak dinyatakan secara eksplisit.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Padanan ringkas dan alami yang menyatakan kehadiran atau perhatian Allah.
theological_decisions:
- issue: Makna κύριε dalam sapaan Kornelius kepada sosok surgawi
  choice: Tuhan
  alternative: Tuan
  rationale: Sapaan ini bersifat penuh hormat kepada utusan surgawi. 'Tuhan' mempertahankan bentuk tradisional dan register luhur, tetapi konteks tidak menuntut bahwa Kornelius sedang menyampaikan pengakuan penuh tentang identitas ilahi malaikat itu.
- issue: Makna μνημόσυνον di hadapan Allah
  choice: suatu peringatan
  alternative: persembahan pengingat
  rationale: Terjemahan ini menjaga gema bahasa persembahan dan ingatan di hadapan Allah, tanpa memastikan mekanisme teologis tertentu atau menjadikan doa dan sedekah sebagai dasar keselamatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa dipecah agar alur narasi alami, sedangkan metafora 'telah naik' dan istilah 'peringatan' dipertahankan karena penting bagi citra teks sumber.
