id: ACT.10.42
reference: Acts 10:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: id
  text: Ia memerintahkan kami untuk memberitakan kepada umat dan bersaksi dengan sungguh-sungguh bahwa Dialah yang ditetapkan Allah sebagai hakim atas orang yang hidup dan yang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dialah yang ditunjuk Allah menjadi hakim atas orang yang hidup dan yang mati.”'
    reason: Alternatif leksikal bagi ὁ ὡρισμένος dan konstruksi predikatifnya.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: memerintahkan
  rationale: Kata kerja ini menyatakan pemberian perintah yang berwibawa; “memerintahkan” mempertahankan kekuatannya tanpa melunakkannya menjadi sekadar pengajaran.
- source_word: κηρύξαι
  choice: memberitakan
  rationale: Kata ini menunjuk pada penyampaian berita secara terbuka. “Memberitakan” alami dalam bahasa Indonesia dan tidak membatasinya pada bentuk khotbah.
- source_word: τῷ λαῷ
  choice: kepada umat
  rationale: Dalam konteks ini λαός mengacu pada umat yang menjadi pendengar dalam lingkungan Yahudi. “Umat” mempertahankan acuannya tanpa menambahkan “Israel,” yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: διαμαρτύρασθαι
  choice: bersaksi dengan sungguh-sungguh
  rationale: Ungkapan ini mencakup kesaksian yang tegas dan khidmat; frasa tersebut mempertahankan unsur kesaksian sekaligus bobot keseriusannya.
- source_word: οὗτός
  choice: Dialah
  rationale: Kata tunjuk ini secara tegas menunjuk kepada Yesus. “Dialah” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: ὁ ὡρισμένος
  choice: yang ditetapkan
  rationale: Partisipel pasif perfektum ini menyatakan bahwa ia telah ditetapkan atau ditunjuk dan tetap memiliki kedudukan tersebut. “Ditetapkan” jelas, wajar, dan tidak membawa asosiasi jabatan gerejawi.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Allah
  rationale: Dalam konstruksi pasif, Allah adalah pelaku penetapan. Susunan “ditetapkan Allah” merupakan bentuk pasif yang alami dan langsung dalam bahasa Indonesia.
- source_word: κριτὴς
  choice: hakim
  rationale: Kata ini adalah nomina predikatif yang menyatakan peran yang ditetapkan Allah. “Sebagai hakim” merupakan susunan Indonesia yang alami.
- source_word: ζώντων καὶ νεκρῶν
  choice: atas orang yang hidup dan yang mati
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dari wewenang penghakiman tanpa mengubah pasangan substantival Yunani menjadi gagasan yang lebih sempit.
theological_decisions:
- issue: Kekuatan penetapan ilahi atas Yesus sebagai hakim
  choice: ditetapkan Allah sebagai hakim atas orang yang hidup dan yang mati
  alternative: ditunjuk Allah menjadi hakim atas orang yang hidup dan yang mati
  rationale: Ayat ini secara eksplisit menyatakan bahwa Allah menetapkan Yesus sebagai hakim bagi orang hidup dan mati. Terjemahan mempertahankan klaim tersebut tanpa mengembangkannya ke dalam rumusan doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Dialah” mempertahankan penekanan demonstratif Yunani; “hakim” ditulis dengan huruf kecil sebagai nama peran, bukan nama diri. Penanda catatan kaki [a] dicantumkan dalam teks utama.
