  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: id
  text: Ia sedang menumpang di rumah seorang penyamak kulit bernama Simon, yang rumahnya terletak di tepi laut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Ia
  rationale: Kata ganti ini merujuk kembali kepada Petrus; 'Ia' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: ξενίζεται παρά τινι Σίμωνι
  choice: sedang menumpang di rumah ... bernama Simon
  rationale: Bentuk kini ξενίζεται menyatakan bahwa ia sedang diterima sebagai tamu atau tinggal sementara, sedangkan παρά dengan datif menunjuk kepada orang yang menjadi tuan rumah. 'Menumpang di rumah' mempertahankan nuansa sebagai tamu secara alami; τις dinyatakan secara idiomatis melalui konstruksi 'seorang ... bernama Simon'.
- source_word: βυρσεῖ
  choice: penyamak kulit
  rationale: βυρσεύς secara khusus berarti orang yang mengolah kulit mentah dengan menyamaknya; 'penyamak kulit' lebih tepat daripada istilah umum seperti 'pekerja kulit'.
- source_word: ᾧ ἐστιν οἰκία
  choice: yang rumahnya terletak
  rationale: Konstruksi relatif ini menunjukkan bahwa rumah tersebut milik Simon. Susunan 'yang rumahnya terletak' jelas dan alami dalam bahasa Indonesia.
- source_word: παρὰ θάλασσαν
  choice: di tepi laut
  rationale: παρά dengan akusatif di sini menyatakan kedekatan lokasi; 'di tepi laut' merupakan ungkapan Indonesia yang wajar dan tidak menuntut bahwa rumah itu tepat menyentuh air.
