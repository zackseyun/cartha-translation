translation:
  language: id
  text: Ia saleh dan, bersama seluruh rumah tangganya[a], takut akan Allah. Ia banyak memberi sedekah kepada umat itu[b] dan senantiasa berdoa kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “takut akan Allah” juga dapat berfungsi sebagai sebutan yang dikenal bagi seorang bukan Yahudi yang menyembah Allah Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melakukan banyak sedekah.” Kata Yunani ini biasanya menunjuk pada pemberian untuk menolong orang yang membutuhkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: saleh
  rationale: Kata ini menggambarkan kesalehan atau ketakwaan yang nyata dalam kehidupan beragama; “saleh” alami, bermartabat, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: φοβούμενος τὸν θεὸν
  choice: takut akan Allah
  rationale: Mempertahankan bentuk verbal dan ungkapan alkitabiah tentang sikap hormat serta gentar kepada Allah, tanpa mereduksinya menjadi sekadar rasa takut biasa.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: bersama seluruh rumah tangganya
  rationale: οἶκος menunjuk pada segenap rumah tangga sebagai satuan sosial, bukan hanya bangunan rumah.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: banyak memberi sedekah
  rationale: Walau secara bentuk berarti melakukan banyak pemberian belas kasih, dalam konteks ini ἐλεημοσύνη lazim menunjuk pada pemberian kepada orang yang membutuhkan; ungkapan Indonesia ini jelas dan alami.
- source_word: τῷ λαῷ
  choice: kepada umat itu
  rationale: Dativus menandai penerima atau pihak yang mendapat manfaat. Dalam Kisah Para Rasul, ὁ λαός dalam konteks ini paling wajar merujuk kepada umat Yahudi, tetapi “umat itu” mempertahankan cara penyebutan naratif tanpa menambahkan identifikasi yang tidak eksplisit dalam ayat.
- source_word: δεόμενος τοῦ θεοῦ
  choice: berdoa kepada Allah
  rationale: δέομαι dapat berarti memohon atau berdoa; konteks penggambaran kesalehan Kornelius mendukung ungkapan umum “berdoa kepada Allah”.
- source_word: διὰ παντός
  choice: senantiasa
  rationale: Ungkapan ini menyatakan kebiasaan yang terus-menerus atau teratur, tanpa harus berarti tindakan yang sama sekali tidak pernah terputus.
theological_decisions:
- issue: Istilah tentang Kornelius sebagai orang yang takut akan Allah
  choice: takut akan Allah
  alternative: orang yang takut akan Allah; menghormati Allah
  rationale: Terjemahan ini mempertahankan bentuk partisipial dan idiom alkitabiah, sekaligus membiarkan terbuka kemungkinan bahwa frasa tersebut juga berfungsi sebagai sebutan yang dikenal bagi seorang bukan Yahudi yang menyembah Allah Israel.
- issue: Identitas τῷ λαῷ
  choice: kepada umat itu
  alternative: kepada orang-orang Yahudi; kepada rakyat
  rationale: Konteks kemungkinan besar menunjuk pada umat Yahudi, tetapi teks Yunani hanya mengatakan “umat itu.” Pilihan utama mempertahankan kadar eksplisit sumber dan menghindari penambahan identifikasi ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang bermartabat. Struktur Yunani yang berupa rangkaian deskripsi partisipial diolah menjadi dua kalimat agar alami dan jelas, sementara hubungan makna serta ketegangan historis-teologisnya tetap dipertahankan.
