  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: id
  text: Ia melihat langit terbuka[a] dan sesuatu seperti sehelai kain besar sedang turun, diturunkan dengan keempat sudutnya ke bumi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surga terbuka”. Kata Yunani οὐρανός dapat berarti “langit” atau “surga”; konteksnya adalah sebuah penglihatan yang bersifat pewahyuan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani yang diterjemahkan “sesuatu” juga dapat berarti “suatu benda” atau “sebuah wadah” dan sengaja tidak spesifik.
    reason: lexical_alternative
  - marker: c
    text: Atau “diturunkan dengan keempat ujungnya ke bumi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: Ia melihat
  rationale: Bentuk kini historis Yunani menyajikan adegan secara hidup; dalam bahasa Indonesia narasi, bentuk tanpa penanda waktu merupakan padanan yang alami.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: langit terbuka
  rationale: Dalam bahasa Indonesia, 'langit' dapat menunjuk ruang di atas maupun ranah surgawi; pilihan ini secara alami mempertahankan sebagian keluasan makna οὐρανός, sementara konteks penglihatan memberi nuansa pewahyuan.
- source_word: καταβαῖνον
  choice: turun
  rationale: Padanan modern dan langsung bagi partisipel yang menyatakan gerakan ke bawah.
- source_word: σκεῦός τι
  choice: sesuatu
  rationale: Menjaga ketidaktentuan ungkapan Yunani dan tidak menetapkan benda itu sebagai wadah atau perkakas tertentu.
- source_word: ὡς ὀθόνην μεγάλην
  choice: seperti kain lebar yang besar
  rationale: Mempertahankan perbandingan ὡς dan gambaran sehelai kain yang luas tanpa menetapkan bahannya sebagai linen.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: pada keempat sudutnya
  rationale: ἀρχή di sini berarti ujung atau bagian terluar; untuk benda seperti kain lebar, 'sudut' paling alami, tetapi 'ujung' tetap mungkin.
- source_word: καθιέμενον
  choice: diulurkan
  rationale: Mengungkapkan gerak pasif ke bawah dengan dikendalikan, tanpa harus menetapkan pelaku yang tidak disebutkan.
- source_word: ἐπὶ τῆς γῆς
  choice: ke bumi
  rationale: Dengan verba gerak turun, frasa ini menyatakan arah menuju bumi; 'bumi' sesuai dengan register penglihatan dan mempertahankan cakupan γῆ.
theological_decisions:
- issue: Makna οὐρανός dalam konteks penglihatan
  choice: langit
  alternative: surga
  rationale: '''Langit'' adalah ungkapan Indonesia yang alami untuk sesuatu yang terbuka di atas dan masih dapat membawa nuansa ranah surgawi dalam konteks penglihatan. Catatan kaki mempertahankan kemungkinan terjemahan eksplisit ''surga'' tanpa memaksakan pembedaan yang tidak dibuat oleh kata Yunani.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur penglihatan serta ketidaktentuan benda tersebut. Istilah 'kain lebar' dipilih agar tidak tertukar dengan 'lembar' kertas atau 'seprai' yang terlalu spesifik.
