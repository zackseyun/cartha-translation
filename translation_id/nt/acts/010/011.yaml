    rationale: καθιέμενον adalah partisipel pasif yang menyatakan benda itu diturunkan atau dilepaskan ke bawah. “Diulurkan” tidak menyampaikan tindakan menurunkan dan dapat menyiratkan menjulurkan atau membentangkan.
  - severity: medium
