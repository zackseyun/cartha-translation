  source_fidelity: 'Teks draf mempertahankan unsur-unsur utama: langit terbuka, benda yang tidak tentu, perbandingan dengan kain besar, gerak turun, empat sudut, dan arah ke bumi. Namun, “diulurkan” tidak tepat untuk καθιέμενον, yang berarti “diturunkan/dilepaskan ke bawah”; dalam bahasa Indonesia “diulurkan” terutama berarti menjulurkan atau membentangkan dan tidak menyatakan gerak menurun. “Kain lebar yang besar” juga berlebihan dan kurang idiomatis untuk ὀθόνην μεγάλην.'
  naturalness: Kalimat dapat dibuat lebih alami dengan “sehelai kain besar” dan “sedang diturunkan”. Susunan “sesuatu seperti sehelai kain besar sedang turun” mempertahankan bahwa σκεῦός τι adalah sesuatu yang tampak seperti kain, tanpa mengidentifikasikannya sebagai kain secara definitif.
  terminology: “Langit” adalah pilihan yang mungkin untuk οὐρανός dan catatan kaki dengan tepat mencatat “surga” sebagai alternatif. “Sehelai kain besar” menyampaikan ὀθόνη μεγάλη tanpa mengkhususkan bahan. “Keempat sudutnya” cocok dalam konteks benda seperti kain. Catatan kaki c perlu menyesuaikan istilah utama yang diperbaiki.
