  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: id
  text: Sambil berbicara dengan Kornelius, Petrus masuk dan mendapati banyak orang telah berkumpul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mendapati banyak orang yang telah berkumpul.” Teks Yunani memakai bentuk kini historis (“mendapati”) untuk menghidupkan narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν αὐτῷ
  choice: Sambil berbicara dengan Kornelius
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan tindakan masuk. Nama Kornelius dan Petrus dijelaskan dari konteks dekat agar rujukan pronomina alami dan tidak rancu dalam bahasa Indonesia.
- source_word: εἰσῆλθεν
  choice: Petrus masuk
  rationale: Aoristus menandai tindakan utama berikutnya; 'masuk' merupakan padanan naratif yang alami.
- source_word: εὑρίσκει
  choice: mendapati
  rationale: Bentuk kini historis memberi daya hidup pada narasi, tetapi bentuk lampau kontekstual tersampaikan secara alami melalui rangkaian narasi Indonesia; 'mendapati' cocok untuk menemukan keadaan yang sudah ada.
- source_word: συνεληλυθότας
  choice: telah berkumpul
  rationale: Partisipel perfektum menggambarkan orang-orang yang sudah datang bersama dan kini berada dalam keadaan berkumpul.
- source_word: πολλούς
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival dan merujuk kepada banyak orang; nomina 'orang' perlu dinyatakan agar jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, sederhana, dan bermartabat. Nama tokoh digunakan untuk menjernihkan dua pronomina maskulin dalam bahasa sumber. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
