source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: id
  text: “Tentunya tidak ada seorang pun yang dapat menahan air baptisan dari orang-orang ini sehingga mereka tidak dibaptis, bukan? Sebab mereka telah menerima Roh Kudus sama seperti kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: Tentunya ... bukan?
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk “Tentunya ... bukan?” menyampaikan daya retoris itu secara wajar dalam bahasa Indonesia.
- source_word: τὸ ὕδωρ
  choice: air ini
  rationale: Artikel Yunani menunjuk kepada air yang dimaksud bagi baptisan dalam konteks ini. Kata “ini” membantu menyatakan kekhususan rujukan tersebut secara alami.
- source_word: δύναται κωλῦσαί τις
  choice: tidak seorang pun dapat menghalangi
  rationale: Konstruksi ini menanyakan apakah ada orang yang mampu menghalangi atau melarang. Bentuk negatif mempertahankan jawaban “tidak” yang diharapkan oleh pertanyaan retoris.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: sehingga orang-orang ini tidak dibaptis
  rationale: Infinitif pasif berartikel dengan μή menyatakan tindakan yang hendak dicegah. Terjemahan ini mempertahankan bentuk pasif dan hubungan pencegahan dengan cukup jelas.
- source_word: οἵτινες
  choice: Sebab mereka
  rationale: Dalam konteks, klausa relatif ini memberi alasan mengapa baptisan tidak boleh dihalangi. “Sebab mereka” membuat nuansa kausalnya jelas tanpa mengubah argumen.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Ini adalah padanan baku, modern, dan bermartabat bagi sebutan tersebut dalam bahasa Indonesia.
- source_word: ἔλαβον
  choice: telah menerima
  rationale: Bentuk ini menyatakan peristiwa penerimaan yang sudah terjadi dan tetap relevan bagi alasan yang sedang dikemukakan.
- source_word: ὡς καὶ ἡμεῖς
  choice: sama seperti kita
  rationale: Padanan ini mempertahankan perbandingan tegas antara pengalaman mereka dan pengalaman kelompok yang diwakili Petrus.
theological_decisions:
- issue: Hubungan penerimaan Roh Kudus dengan baptisan air
  choice: Penerimaan Roh Kudus dinyatakan sudah terjadi dan menjadi dasar argumen Petrus agar baptisan air tidak dihalangi.
  alternative: Terjemahan yang mengaburkan bahwa penerimaan Roh terjadi sebelum baptisan dalam kisah ini.
  rationale: 'Urutan dan alasan dalam teks Yunani jelas: kelompok itu telah menerima Roh Kudus, lalu Petrus menolak kemungkinan menghalangi baptisan mereka. Terjemahan mempertahankan ketegangan naratif-teologis ini tanpa memasukkan kerangka sakramental denominasi tertentu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan yang bermartabat. Pertanyaan retoris dipertahankan, sedangkan klausa alasan dipisahkan menjadi kalimat kedua agar alur argumen jelas.
