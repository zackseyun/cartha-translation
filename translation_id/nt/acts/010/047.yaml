  to: “Tentunya tidak ada seorang pun yang dapat menahan air baptisan dari orang-orang ini sehingga mereka tidak dibaptis, bukan? Sebab mereka telah menerima Roh Kudus sama seperti kita.”
  rationale: 'Revisi mengganti ungkapan yang tidak idiomatis dengan “menahan air baptisan dari,” yang secara jelas menyampaikan arti κωλύω dengan τὸ ὕδωρ: tidak memberikan air yang diperlukan untuk baptisan. Pertanyaan retoris, hubungan tujuan “sehingga ... tidak dibaptis,” serta alasan bahwa mereka telah menerima Roh Kudus tetap dipertahankan. Penanda catatan kaki tetap ditempatkan pada tindakan menahan air, tempat alternatif leksikal itu relevan.'
