    rationale: Dalam Yunani, κωλύω berobjek “air” dalam arti mencegah/menahan agar air itu tidak dipakai atau diberikan untuk baptisan. Dalam bahasa Indonesia, “menahan air baptisan dari orang-orang ini” lebih jelas dan alami, sambil mempertahankan air sebagai objek yang dilarang untuk ditahan.
  - severity: low
    issue: Kata tunjuk “ini” pada “air ini” tidak diperlukan.
    rationale: Artikel Yunani τὸ tidak harus dialihkan dengan “ini.” Frasa “air baptisan” sudah secara kontekstual definit dan lebih lancar.
