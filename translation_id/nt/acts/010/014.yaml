  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: id
  text: Namun Petrus berkata, “Sekali-kali tidak, Tuhan, sebab aku belum pernah makan sesuatu pun yang cemar dan najis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Sekali-kali tidak
  rationale: Ungkapan penolakan tegas yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan langsung kepada sosok yang berbicara dalam penglihatan tanpa menentukan lebih jauh identitasnya.
- source_word: κοινὸν
  choice: biasa
  rationale: Menerjemahkan arti harfiah 'common' dan mempertahankan pembedaan istilah ini dari ἀκάθαρτον; dalam konteks ritual, kata ini menunjuk sesuatu yang tidak kudus atau tercemar.
- source_word: ἀκάθαρτον
  choice: najis
  rationale: Padanan lazim untuk ketidakmurnian ritual dalam konteks hukum makanan.
- source_word: καὶ
  choice: dan
  rationale: Mengikuti teks SBLGNT yang memakai konjungsi aditif, sehingga tidak mengubahnya menjadi 'atau'.
theological_decisions:
- issue: Hubungan antara κοινόν dan ἀκάθαρτον
  choice: biasa dan najis
  alternative: haram atau najis
  rationale: Mempertahankan dua istilah Yunani yang berbeda serta konjungsi 'dan', tanpa menyamakan keduanya atau menyelesaikan ketegangan konseptualnya.
- issue: Fungsi ὅτι
  choice: sebab
  alternative: karena
  rationale: Menampilkan alasan yang Petrus berikan bagi penolakannya; kedua pilihan mungkin, tetapi 'sebab' mengalir alami sesudah penolakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan penolakan tegas Petrus serta perbedaan leksikal antara 'biasa' dan 'najis'.
