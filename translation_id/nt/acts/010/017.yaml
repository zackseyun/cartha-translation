  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: id
  text: Sementara Petrus masih bingung dalam hatinya tentang apa arti penglihatan yang telah dilihatnya itu[a], lihatlah, orang-orang yang diutus oleh Kornelius, setelah menanyakan letak rumah Simon, berdiri di pintu gerbang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penglihatan yang telah dilihatnya itu sebenarnya apa.” Ungkapan Yunani ini dapat diterjemahkan lebih harfiah demikian, tetapi dalam konteks ini tampaknya menunjuk pada arti atau makna penting penglihatan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di pintu masuk.” Kata Yunani ini dapat menunjuk pada pintu gerbang atau kawasan pintu masuk sebuah rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Sementara
  rationale: Mengungkapkan latar waktu dan perkembangan narasi secara alami tanpa menambahkan kata penunjuk waktu yang tidak ada dalam teks Yunani.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: masih bingung dalam hatinya
  rationale: Menyampaikan kebingungan batin yang sedang berlangsung; 'masih' membantu mencerminkan aspek imperfek.
- source_word: τί ἂν εἴη
  choice: apa arti
  rationale: Dalam konteks, Petrus sedang berusaha memahami makna atau arti penting penglihatan itu, meskipun ungkapan Yunani secara lebih harfiah dapat berarti 'apakah ... itu'.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: penglihatan yang telah dilihatnya itu
  rationale: Mempertahankan objek 'penglihatan' dan urutan waktu bahwa Petrus sudah melihatnya sebelumnya.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda wacana yang menyoroti perkembangan baru dalam narasi.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: orang-orang yang diutus oleh Kornelius
  rationale: Menyatakan rujukan kepada para laki-laki tersebut secara wajar dalam bahasa Indonesia dan mempertahankan bentuk pasif serta pelakunya.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: setelah menanyakan letak rumah Simon
  rationale: Partisip aoris menunjukkan tindakan yang mendahului kedatangan mereka; 'menanyakan letak' menjelaskan secara alami bahwa mereka mencari alamat rumah itu.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: tiba dan berdiri di depan pintu gerbang
  rationale: Menggabungkan nuansa datang atau tiba dengan tindakan mengambil tempat di pintu gerbang, sehingga lebih alami daripada terjemahan harfiah 'berdiri' saja.
theological_decisions:
- issue: Apakah τί ἂν εἴη menunjuk pada hakikat penglihatan atau maknanya
  choice: apa arti penglihatan ... itu
  alternative: apakah sebenarnya penglihatan ... itu
  rationale: Konteks mendukung pencarian makna penglihatan, tetapi alternatif yang lebih harfiah dipertahankan dalam catatan kaki agar ambiguitas sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Lihatlah' dipertahankan sebagai penanda perkembangan yang mencolok. Susunan kalimat dijaga tetap bermartabat tetapi mudah dipahami pembaca umum.
