  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: id
  text: Ia melihat dengan jelas[a] dalam suatu penglihatan, sekitar jam kesembilan pada siang hari, seorang malaikat Allah masuk menemuinya dan berkata kepadanya, “Kornelius.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dengan nyata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Ia melihat
  rationale: Bentuk aoristus indikatif dari ὁράω menyampaikan peristiwa lampau dalam narasi. “Melihat” mempertahankan pengalaman penglihatan yang konkret.
- source_word: ἐν ὁράματι
  choice: dalam suatu penglihatan
  rationale: ὅραμα menunjuk pada penglihatan adikodrati. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penafsiran tentang keadaan atau caranya.
- source_word: φανερῶς
  choice: dengan jelas
  rationale: Adverbia ini menegaskan bahwa penglihatan itu nyata dan tidak samar. “Dengan jelas” merupakan padanan Indonesia yang lugas; alternatif “dengan nyata” dicatat dalam catatan kaki.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: kira-kira pada jam kesembilan hari itu
  rationale: “Kira-kira” mencerminkan gabungan ὡσεὶ dan περὶ, sedangkan “jam kesembilan” mempertahankan cara penghitungan waktu dalam teks sumber. Padanan waktu modern diberikan dalam catatan kaki.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: seorang malaikat Allah
  rationale: Dalam konteks penglihatan ini, ἄγγελος menunjuk kepada makhluk surgawi, bukan utusan manusia. “Malaikat Allah” tepat dan lazim dalam bahasa Indonesia.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: masuk menemuinya
  rationale: Pilihan ini mempertahankan gagasan εἰσέρχομαι tentang gerakan masuk sekaligus mengungkapkan πρὸς αὐτόν secara alami sebagai datang ke hadapan Kornelius.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: dan berkata kepadanya
  rationale: Walaupun bahasa Yunani memakai partisip aoristus kedua yang sejajar dengan εἰσελθόντα, klausa berverba finit lebih alami dalam narasi bahasa Indonesia tanpa mengubah urutan tindakan.
- source_word: Κορνήλιε
  choice: Kornelius
  rationale: Ini adalah bentuk vokatif dari nama Κορνήλιος. Bahasa Indonesia tidak menandai vokatif secara morfologis; “Kornelius” adalah bentuk nama yang baku.
theological_decisions:
- issue: Hakikat ἄγγελος dalam konteks ini
  choice: makhluk malaikat surgawi
  alternative: utusan manusia
  rationale: Konteksnya secara eksplisit berupa penglihatan dan menyebutnya “malaikat Allah”, sehingga makhluk surgawi adalah makna yang wajar. Terjemahan tidak menambahkan rincian doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rangkaian penglihatan, waktu, kemunculan malaikat, dan sapaan dalam teks Yunani, sambil menghindari struktur partisipial yang terasa kaku dalam bahasa Indonesia.
