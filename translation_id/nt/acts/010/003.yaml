  rationale: 'Revisi hanya mengganti “hari itu” dengan “pada siang hari” agar tidak menambahkan penunjuk yang tidak ada dalam bahasa Yunani dan agar ungkapan “jam kesembilan” tetap terbaca sebagai sistem waktu kuno. Makna dan urutan naratif tidak berubah. Jangkar catatan kaki dipertahankan: [a] sesudah “jelas” dan [b] sesudah frasa waktu.'
