  source_fidelity: 'Terjemahan pada dasarnya setia kepada teks Yunani: penglihatan yang jelas, perkiraan waktu, malaikat Allah, gerakan masuk kepada Kornelius, dan sapaan semuanya terwakili. Namun, “hari itu” menerjemahkan τῆς ἡμέρας seolah-olah mengandung penunjuk khusus (“itu”), padahal frasa Yunani hanya menyatakan penghitungan jam dalam sehari. Revisi kecil menghindari tambahan ini sambil mempertahankan sistem waktu sumber.'
  naturalness: Bahasa Indonesia baku dan mengalir. “Masuk menemuinya” wajar untuk εἰσελθόντα πρὸς αὐτόν dan tidak perlu diubah. “Pada siang hari” dalam frasa waktu yang direvisi membantu pembaca memahami bahwa “jam kesembilan” termasuk penghitungan waktu kuno, dengan penjelasan modern tetap tersedia dalam catatan kaki.
  terminology: “Penglihatan,” “malaikat Allah,” dan “Kornelius” tepat, lazim, dan sesuai register. Catatan kaki leksikal untuk φανερῶς dan catatan budaya untuk jam kesembilan ditempatkan pada jangkar yang tepat.
