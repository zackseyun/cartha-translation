  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: id
  text: Kalian sendiri tahu apa yang terjadi di seluruh Yudea[a], yang bermula dari Galilea sesudah baptisan yang diberitakan Yohanes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berita yang tersebar di seluruh Yudea.” Kata Yunani rhēma dapat berarti “perkataan”, “berita”, atau “perkara”.'
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, partisip yang diterjemahkan “yang bermula” memiliki hubungan tata bahasa yang tidak biasa dengan frasa sebelumnya, tetapi dengan jelas menunjukkan bahwa perkara tersebut berawal dari Galilea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Kamu sendiri tahu
  rationale: Pronomina eksplisit ὑμεῖς memberi penekanan; “kamu sendiri” menyampaikan daya tekan itu secara alami, sedangkan οἴδατε bermakna kini, “tahu”.
- source_word: τὸ γενόμενον ῥῆμα
  choice: apa yang terjadi
  rationale: Dalam konteks ini ῥῆμα bersama γενόμενον menunjuk pada perkara atau rangkaian kejadian yang diketahui luas. Ungkapan ini alami dalam bahasa Indonesia tanpa membatasi maknanya hanya pada suatu ucapan; kemungkinan arti “berita” dicatat dalam catatan kaki.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: di seluruh Yudea
  rationale: κατά dengan genitif menyatakan cakupan wilayah, dan ὅλης menegaskan keseluruhannya.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: yang bermula dari Galilea
  rationale: Terjemahan ini mempertahankan Galilea sebagai titik awal dan menghubungkan partisip yang secara sintaksis longgar dengan perkara yang baru disebut, tanpa menambahkan pelaku.
- source_word: μετὰ τὸ βάπτισμα
  choice: sesudah baptisan
  rationale: μετά dengan akusatif menyatakan urutan waktu. “Baptisan” merupakan istilah Indonesia yang mapan dan tidak menambahkan penafsiran mengenai caranya.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: yang diberitakan Yohanes
  rationale: κηρύσσω mengandung gagasan mengumumkan atau memberitakan secara terbuka. Bentuk pasif relatif ini alami dalam bahasa Indonesia dan mempertahankan “baptisan” sebagai objek pemberitaan.
theological_decisions:
- issue: Makna ῥῆμα dalam ringkasan Petrus
  choice: Diterjemahkan “apa yang terjadi” untuk mencakup perkara atau rangkaian peristiwa yang diketahui luas.
  alternative: “berita yang tersebar” atau “firman/perkataan yang terjadi”
  rationale: Konteks melukiskan sesuatu yang berlangsung di seluruh Yudea dan bermula dari Galilea. Terjemahan utama mempertahankan segi peristiwa, sedangkan catatan kaki menjaga kemungkinan bahwa ῥῆμα menekankan berita atau pesan.
- issue: Acuan ἀρξάμενος
  choice: 'Dihubungkan secara maknawi dengan perkara yang disebut sebelumnya: “yang bermula dari Galilea.”'
  alternative: Dipahami secara adverbial dengan klausa tersirat, “itu bermula,” atau dikaitkan dengan subjek maskulin yang tersirat.
  rationale: Partisip maskulin tersebut secara gramatikal canggung bila langsung disandingkan dengan ῥῆμα yang netral. Terjemahan tidak mencoba menyelesaikan ketegangan itu secara teologis, dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Kamu” dipilih karena Petrus berbicara langsung kepada sekelompok pendengar; “Yohanes” memakai bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
