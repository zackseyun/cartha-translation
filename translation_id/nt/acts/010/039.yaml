reference: Acts 10:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: id
  text: Kami adalah saksi atas segala sesuatu yang telah Dia lakukan, baik di negeri orang Yahudi maupun di Yerusalem. Mereka juga membunuh Dia dengan menggantung-Nya pada kayu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada pohon”; secara interpretatif, “pada salib”. Kata Yunani yang digunakan berarti “kayu” atau “pohon” dan kemungkinan menggemakan Ulangan 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: saksi
  rationale: “Saksi” merupakan padanan baku dan alami dalam konteks kesaksian para rasul sebagai saksi mata.
- source_word: πάντων ὧν ἐποίησεν
  choice: dari segala sesuatu yang telah Dia lakukan
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντων dan menyampaikan tindakan Yesus secara wajar dalam bahasa Indonesia.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: baik di negeri orang Yahudi
  rationale: “Negeri” mencerminkan χώρα sebagai wilayah atau tanah tanpa mempersempitnya secara pasti menjadi provinsi Romawi Yudea; “orang Yahudi” mempertahankan kemungkinan nuansa etnis-keagamaan.
- source_word: καὶ Ἰερουσαλήμ
  choice: maupun di Yerusalem
  rationale: Preposisi “di” ditambahkan sesuai tata bahasa Indonesia, sedangkan pasangan “baik ... maupun ...” menyampaikan konstruksi τε ... καί.
- source_word: ἀνεῖλαν
  choice: membunuh Dia
  rationale: ἀναιρέω di sini berarti membunuh atau meniadakan nyawa; “membunuh” jelas, alami, dan tidak menambahkan nuansa proses hukum yang tidak dinyatakan secara eksplisit oleh kata tersebut.
- source_word: κρεμάσαντες
  choice: dengan menggantung-Nya
  rationale: Partisip aoris dipahami sebagai cara atau sarana tindakan membunuh, dan diterjemahkan secara alami dengan “dengan”.
- source_word: ἐπὶ ξύλου
  choice: pada kayu
  rationale: ξύλον dapat berarti kayu atau pohon. “Pada kayu” menjaga ungkapan sumber dan kaitan dengan kematian melalui penyaliban tanpa menggantinya langsung dengan istilah interpretatif “salib”; alternatif literal dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan ξύλου dalam konteks penyaliban
  choice: pada kayu
  alternative: pada pohon; pada salib
  rationale: Teks Yunani memakai ξύλον, bukan σταυρός. “Kayu” mempertahankan pilihan leksikal sumber dan kemungkinan gaung Ulangan 21:23, sementara catatan kaki menjaga alternatif “pohon” serta menjelaskan bahwa konteksnya adalah penyaliban tanpa menyamakan kata itu secara diam-diam dengan “salib”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ilahi ditulis dengan kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan “baik ... maupun ...” dipakai agar hubungan kedua lokasi jelas dan alami.
