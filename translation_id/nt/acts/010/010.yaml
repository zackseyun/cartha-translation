  source_fidelity: 'Bagian awal diterjemahkan dengan setia: πρόσπεινος menuntut intensitas seperti “sangat lapar,” dan γεύσασθαι wajar diterjemahkan “makan” dalam konteks ini. Namun, “keadaan tidak sadarkan diri” tidak tepat untuk ἔκστασις, karena secara normal berarti kehilangan kesadaran dan dapat menghilangkan unsur keadaan visioner/ekstatis yang dimaksud teks. Konstruksi ἐγένετο ἐπ’ αὐτόν lebih langsung tercermin dengan “datanglah ... atas dirinya” atau “ia mengalami ...”.'
