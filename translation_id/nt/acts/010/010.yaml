  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: id
  text: Ia menjadi sangat lapar dan ingin makan. Ketika mereka sedang menyiapkan makanan, ia mengalami keadaan ekstase[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu keadaan kesadaran yang berubah.” Istilah Yunani ini dalam konteks ini menunjuk pada keadaan yang berkaitan dengan penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... πρόσπεινος
  choice: Ia menjadi sangat lapar
  rationale: Ungkapan ini menyatakan perubahan keadaan, sedangkan πρόσπεινος lebih kuat daripada sekadar 'lapar'.
- source_word: ἤθελεν γεύσασθαι
  choice: ingin makan
  rationale: Meskipun γεύομαι secara harfiah dapat berarti 'mengecap', dalam konteks makanan ungkapan ini secara idiomatis berarti makan.
- source_word: παρασκευαζόντων ... αὐτῶν
  choice: sementara orang-orang sedang menyiapkan makanan
  rationale: Konstruksi genitif absolut menunjukkan tindakan yang berlangsung bersamaan. Subjek jamak dinyatakan secara umum, dan objek tersirat dijelaskan sebagai makanan sesuai konteks.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: ia mengalami
  rationale: Ungkapan Yunani menandai datangnya suatu pengalaman atas Petrus; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἔκστασις
  choice: keadaan tidak sadarkan diri
  rationale: Dalam konteks ini istilah tersebut menunjuk pada keadaan kesadaran yang berubah dan berkaitan dengan penglihatan ilahi, bukan sekadar rasa takjub.
theological_decisions:
- issue: Sifat keadaan Petrus yang disebut ἔκστασις
  choice: keadaan tidak sadarkan diri
  alternative: keadaan ekstase; keadaan seperti kesurupan
  rationale: Konteks berikutnya memperkenalkan penglihatan pewahyuan. Pilihan ini membedakannya dari rasa heran biasa tanpa memasukkan istilah mistik atau konotasi kerasukan.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. 'Orang-orang' mempertahankan subjek jamak yang tidak disebutkan identitasnya dalam ayat ini; 'makanan' mengungkapkan objek yang tersirat oleh konteks.
