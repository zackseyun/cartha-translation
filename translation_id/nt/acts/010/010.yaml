  terminology: Gunakan “keadaan ekstase” untuk ἔκστασις. Istilah ini mempertahankan makna keadaan kesadaran yang berubah dalam konteks penglihatan tanpa memasukkan penafsiran seperti “kesurupan.” Catatan kaki menyediakan alternatif yang lebih deskriptif.
