  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: id
  text: Tetapi Tuhan berkata kepadanya, “Pergilah, sebab orang ini adalah alat pilihan-Ku untuk membawa nama-Ku ke hadapan bangsa-bangsa lain[a], raja-raja, dan anak-anak Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bangsa-bangsa”; dalam konteks ini yang terutama dimaksud ialah bangsa-bangsa non-Yahudi.
    reason: lexical_alternative
  - marker: b
    text: “Anak-anak Israel” adalah ungkapan Alkitabiah tradisional untuk umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar yang alami dan baku dalam bahasa Indonesia; dalam konteks kisah ini menunjuk kepada Yesus yang bangkit dan berbicara dengan wewenang ilahi.
- source_word: Πορεύου
  choice: Pergilah
  rationale: Bentuk perintah yang alami dan tetap mempertahankan daya imperatif teks Yunani.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: adalah alat yang Kupilih
  rationale: σκεῦος secara harfiah berarti wadah atau bejana, tetapi di sini dipakai secara kiasan untuk seseorang yang digunakan bagi suatu tujuan. Ungkapan ini menyampaikan pemilihan dan relasi pribadi dalam μοι secara jelas tanpa menjadi kaku.
- source_word: τοῦ βαστάσαι
  choice: untuk membawa
  rationale: Infinitif berartikel menyatakan tujuan; 'untuk membawa' mempertahankan gambaran bahwa nama Tuhan dibawa dalam kesaksian dan misi.
- source_word: τὸ ὄνομά μου
  choice: nama-Ku
  rationale: Dipertahankan secara harfiah agar nuansa perwakilan, kewenangan, dan pengakuan publik yang terkandung dalam 'nama' tetap terbuka.
- source_word: ἐνώπιον
  choice: ke hadapan
  rationale: Padanan yang alami untuk tampil atau bersaksi di hadapan kelompok-kelompok yang disebutkan.
- source_word: ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam pertentangannya dengan anak-anak Israel, istilah ini terutama menunjuk kepada bangsa-bangsa non-Yahudi. Pilihan ini jelas dalam bahasa Indonesia sekaligus mempertahankan unsur 'bangsa-bangsa'.
- source_word: βασιλέων
  choice: raja-raja
  rationale: Terjemahan langsung yang tepat dan mudah dipahami.
- source_word: υἱῶν Ἰσραήλ
  choice: anak-anak Israel
  rationale: Mempertahankan ungkapan kekeluargaan tradisional dalam teks sumber. Dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi umat Israel, bukan hanya anak kecil atau putra biologis Israel.
- source_word: τε ... καὶ ... τε
  choice: '..., ..., dan ...'
  rationale: Rangkaian tiga kelompok dinyatakan dengan koordinasi yang alami dalam bahasa Indonesia tanpa meniru partikel Yunani secara kaku.
theological_decisions:
- issue: Kemungkinan pembacaan doktrinal berlebihan atas ἐκλογῆς
  choice: alat yang Kupilih
  alternative: bejana pilihan-Ku; alat pilihan bagi-Ku
  rationale: Ayat ini dengan jelas menyatakan pemilihan ilahi untuk suatu tugas misi. Rumusan ini mempertahankan klaim tersebut tanpa memaksakan sistem teologis yang lebih luas tentang pemilihan individu.
- issue: Makna 'nama-Ku' dalam tugas Saulus
  choice: mempertahankan ungkapan 'membawa nama-Ku'
  alternative: memberitakan tentang Aku; menjadi wakil-Ku
  rationale: Ungkapan sumber kaya akan makna perwakilan, kewenangan, dan kesaksian. Parafrasa akan mempersempit ketegangan dan jangkauan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur kalimat dijaga dekat dengan teks Yunani, tetapi ungkapan metaforis dibuat wajar bagi pembaca masa kini.
