  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: id
  text: Semua orang yang tinggal di Lida dan Saron[a] melihat dia, dan mereka berpaling kepada Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wilayah Saron” atau “dataran Saron.”
    reason: lexical_alternative
  - marker: b
    text: “Berpaling kepada Tuhan” juga dapat diterjemahkan “kembali kepada Tuhan” atau, secara lebih interpretatif, “menjadi percaya kepada Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: melihat
  rationale: 'Bentuk aoris dari ὁράω di sini paling wajar menyatakan penglihatan langsung: penduduk melihat Eneas sesudah ia disembuhkan.'
- source_word: πάντες οἱ κατοικοῦντες
  choice: semua orang yang tinggal
  rationale: Partisipel berartikel κατοικοῦντες berfungsi sebagai nomina, yaitu orang-orang yang tinggal atau berdiam di tempat tersebut. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan πάντες.
- source_word: Λύδδα
  choice: Lida
  rationale: Bentuk nama tempat ini mengikuti ejaan Indonesia yang lazim bagi Λύδδα.
- source_word: τὸν Σαρῶνα
  choice: Saron
  rationale: Σαρών menunjuk pada wilayah atau dataran Saron. Nama tempat tanpa artikel paling alami dalam bahasa Indonesia, sedangkan kemungkinan makna wilayahnya dicatat dalam catatan kaki.
- source_word: οἵτινες
  choice: lalu mereka
  rationale: Kata ganti relatif ini menghubungkan penduduk yang baru disebutkan dengan respons mereka. 'Lalu mereka' menyampaikan perkembangan narasi secara alami tanpa memberi penekanan tambahan yang tidak perlu.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: berbalik kepada Tuhan
  rationale: Ungkapan ini menyatakan perubahan arah menuju Tuhan dalam pertobatan dan iman. 'Berbalik kepada' mempertahankan citra dan keluasan makna Yunani tanpa mengandaikan bahwa mereka sebelumnya pernah menjadi pengikut Tuhan.
- source_word: κύριον
  choice: Tuhan
  rationale: Ini adalah padanan baku dan wajar untuk gelar κύριος. Konteks mengarah kepada Yesus yang bangkit, tetapi teks Yunani sendiri hanya menyebut 'Tuhan'.
theological_decisions:
- issue: Rujukan gelar κύριον
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Konteks Kisah Para Rasul 9 sangat mungkin menunjuk kepada Yesus, tetapi nama 'Yesus' tidak terdapat dalam ayat ini. Terjemahan mempertahankan bentuk teks sumber tanpa memperluasnya.
- issue: Makna ἐπέστρεψαν
  choice: berbalik kepada
  alternative: kembali kepada; menjadi percaya kepada; bertobat kepada
  rationale: '''Berbalik kepada'' mempertahankan ungkapan metaforis yang dapat mencakup pertobatan dan iman, tanpa menyiratkan secara pasti keadaan rohani mereka sebelumnya atau memakai istilah teologis yang lebih interpretatif.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. 'Lalu' dipakai untuk menyampaikan hubungan perkembangan antara melihat mukjizat dan berbalik kepada Tuhan tanpa menyatakan mekanisme sebab-akibat secara berlebihan.
