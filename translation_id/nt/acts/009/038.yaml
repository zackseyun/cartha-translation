  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: id
  text: Karena Lida dekat dengan Yope, ketika murid-murid mendengar bahwa Petrus berada di sana, mereka mengutus dua orang kepadanya untuk memohon, “Jangan menunda[a] untuk datang kepada kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan ragu untuk datang kepada kami.” Kata kerjanya dapat berarti ragu atau menunda; teks utama memakai makna yang paling alami dalam permintaan mendesak ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Karena Lida dekat dengan Yope
  rationale: Konstruksi genitivus absolutus memberi latar keadaan dan menyiratkan alasan praktis para murid mengutus orang kepada Petrus. Bentuk ini alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lida / Yope
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia dan mencerminkan nama Yunani dalam konteks Perjanjian Baru.
- source_word: οἱ μαθηταὶ ἀκούσαντες
  choice: murid-murid mendengar
  rationale: μαθηταί secara tepat merujuk pada anggota komunitas orang percaya; partisip aoristus ἀκούσαντες menunjukkan keadaan yang mendahului tindakan pengutusan.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: bahwa Petrus berada di sana
  rationale: Kata ganti αὐτῇ mengacu pada Lida. 'Di sana' merupakan padanan lokatif yang alami.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτὸν
  choice: Mereka lalu mengutus dua orang kepadanya
  rationale: Terjemahan langsung dan wajar; 'lalu' memperjelas urutan tindakan yang terkandung dalam partisip sebelumnya tanpa mengubah hubungan logisnya.
- source_word: παρακαλοῦντες
  choice: untuk memohon
  rationale: Dalam konteks ini παρακαλέω menyatakan permintaan yang sungguh-sungguh. 'Memohon' mempertahankan urgensi tanpa harus menambahkan keterangan emosional.
- source_word: Μὴ ὀκνήσῃς
  choice: Jangan menunda
  rationale: ὀκνέω dapat berarti ragu, enggan, atau berlambat-lambat. Dalam permintaan perjalanan yang mendesak ini, 'jangan menunda' paling alami, sementara kemungkinan 'jangan ragu' dipertahankan dalam catatan kaki.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: datang kepada kami
  rationale: Ungkapan ini menunjuk pada perjalanan Petrus dari Lida ke tempat para pembicara. 'Datang kepada kami' menyampaikan sudut pandang mereka secara idiomatis.
