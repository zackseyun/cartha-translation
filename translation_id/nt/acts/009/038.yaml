  naturalness: Nama Lida dan Yope serta registernya sudah baku. Susunan satu kalimat dengan anak kalimat “ketika ... mendengar” lebih lancar dan lebih jelas dalam bahasa Indonesia modern daripada “murid-murid mendengar ... Mereka lalu mengutus”.
  terminology: “Murid-murid,” “Petrus,” “Lida,” dan “Yope” tepat. “Memohon” memadai untuk παρακαλοῦντες dalam konteks permintaan mendesak. Catatan alternatif “jangan ragu” mempertahankan kemungkinan leksikal ὀκνήσῃς tanpa mengubah pilihan utama.
