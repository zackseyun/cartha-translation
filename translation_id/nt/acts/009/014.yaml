  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: id
  text: Di sini ia memiliki wewenang dari imam-imam kepala untuk mengikat semua orang yang berseru kepada nama-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang yang menyerukan nama-Mu.” Ungkapan Yunani ini adalah idiom Alkitab untuk berseru kepada atau memohon kepada seseorang, sering kali dalam doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: di sini
  rationale: Adverbia tempat ini menunjuk pada Damsyik, tempat Ananias berada dan tempat Saulus datang.
- source_word: ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων
  choice: ia telah menerima wewenang dari imam-imam kepala
  rationale: ἐξουσία menyatakan kewenangan resmi, sedangkan παρά dengan genitif menunjukkan sumbernya. Ungkapan 'telah menerima' membuat sumber kewenangan itu alami dalam bahasa Indonesia tanpa mengubah makna bahwa ia sekarang memilikinya.
- source_word: δῆσαι
  choice: untuk mengikat
  rationale: Pilihan ini mempertahankan citra harfiah tindakan mengikat, yang dalam konteks mencakup penangkapan, tanpa menggantinya dengan tafsiran yang lebih sempit.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: semua orang yang berseru kepada
  rationale: Partisip berartikel ini menunjuk kepada seluruh kelompok orang yang memanggil atau menyerukan nama Yesus. 'Berseru kepada' mempertahankan idiom biblis tentang permohonan atau doa.
- source_word: τὸ ὄνομά σου
  choice: nama-Mu
  rationale: Terjemahan langsung mempertahankan idiom sumber, dengan 'nama' mewakili pribadi dan kewenangan yang diseru.
theological_decisions:
- issue: Makna ungkapan ἐπικαλουμένους τὸ ὄνομά σου yang ditujukan kepada Yesus
  choice: berseru kepada nama-Mu
  alternative: berdoa kepada-Mu; memohon dengan menyebut nama-Mu
  rationale: Ungkapan Yunani ini lazim menyatakan penyeruan atau permohonan religius dan di sini ditujukan langsung kepada Yesus. Terjemahan mempertahankan bobot teologis tersebut tanpa mempersempitnya hanya menjadi identitas kelompok atau memperluasnya menjadi rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Imam-imam kepala' mengikuti istilah Perjanjian Baru yang umum untuk kepemimpinan imam di Yerusalem. Kapitalisasi pronomina '-Mu' menandai sapaan langsung kepada Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
