id: ACT.9.29
reference: Acts 9:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: id
  text: Ia berbicara dan berdebat dengan orang-orang Yahudi berbahasa Yunani, tetapi mereka berusaha membunuhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλει
  choice: berbicara
  rationale: Bentuk imperfek menunjukkan kegiatan yang berlangsung atau berulang; dalam rangkaian naratif ini, bentuk Indonesia tanpa penanda aspek eksplisit tetap alami dan mencakup nuansa tersebut.
- source_word: τε καὶ
  choice: dan
  rationale: Menghubungkan dua kegiatan sejajar secara alami tanpa membuat kalimat terasa berat.
- source_word: συνεζήτει
  choice: berdebat
  rationale: Kata ini dalam konteks Kisah Para Rasul menunjuk pada pembahasan yang bersifat argumentatif, bukan percakapan netral.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: dengan orang-orang Yahudi berbahasa Yunani
  rationale: πρός menandai pihak yang diajak berdebat, sedangkan Ἑλληνισταί dalam konteks Kisah Para Rasul paling wajar merujuk pada kelompok Yahudi berbahasa Yunani.
- source_word: οἱ δὲ
  choice: tetapi mereka
  rationale: δέ menandai peralihan yang berlawanan dari kegiatan Saulus kepada tanggapan bermusuhan kelompok itu.
- source_word: ἐπεχείρουν
  choice: berusaha
  rationale: Menyatakan upaya yang mereka lakukan; bentuk imperfek mendukung gambaran usaha yang sedang atau terus dilakukan tanpa harus menambahkan penanda aspek yang kaku dalam bahasa Indonesia.
- source_word: ἀνελεῖν αὐτόν
  choice: membunuhnya
  rationale: Dalam konteks ini ἀναιρέω berarti membunuh atau menghabisi; 'membunuhnya' paling jelas dan langsung.
theological_decisions:
- issue: Identitas Ἑλληνιστάς
  choice: orang-orang Yahudi berbahasa Yunani
  alternative: kaum Helenis
  rationale: Pemakaian istilah ini dalam Kisah Para Rasul, khususnya perbandingannya dengan orang Ibrani dalam Kisah 6:1, mendukung identitas sosial-linguistik Yahudi, bukan orang Yunani non-Yahudi pada umumnya. Terjemahan deskriptif lebih mudah dipahami pembaca Indonesia dan tidak mengimpor gagasan bahwa Saulus sedang berdebat dengan bangsa-bangsa lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan deskriptif 'orang-orang Yahudi berbahasa Yunani' dipilih daripada transliterasi teknis 'kaum Helenis', sehingga catatan kaki tidak diperlukan.
