  source_fidelity: 'Teks secara akurat mencerminkan seluruh unsur Yunani: εὐθέως sebagai “Seketika itu juga,” ἀπέπεσαν ... ἀπὸ τῶν ὀφθαλμῶν sebagai sesuatu yang jatuh dari mata Saulus, ὡς λεπίδες sebagai perbandingan, ἀνέβλεψεν sebagai pemulihan penglihatan, dan urutan ἀναστάς ἐβαπτίσθη sebagai ia bangkit lalu dibaptis. “Sesuatu seperti sisik” dengan tepat menghindari pernyataan bahwa sisik literal jatuh dari matanya.'
