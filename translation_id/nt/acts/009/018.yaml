id: ACT.9.18
reference: Acts 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: id
  text: Seketika itu juga, sesuatu seperti sisik jatuh dari matanya[a], dan ia dapat melihat kembali. Lalu ia bangkit dan dibaptis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “seperti sisik jatuh dari matanya.” Bahasa Yunani memakai perbandingan dan menggambarkan apa yang tampak terjadi, bukan memastikan bahwa yang jatuh itu benar-benar sisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: seketika itu juga
  rationale: Menyampaikan bahwa peristiwa itu terjadi langsung pada saat itu dalam bahasa Indonesia naratif yang alami.
- source_word: ἀπέπεσαν
  choice: jatuh
  rationale: Mengungkapkan tindakan terlepas lalu jatuh; asalnya dinyatakan secara alami oleh frasa 'dari matanya'.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: dari matanya
  rationale: Padanan Indonesia yang wajar bagi konstruksi ἀπό dengan makna asal atau tempat sesuatu terlepas.
- source_word: ὡς λεπίδες
  choice: sesuatu seperti sisik
  rationale: Mempertahankan gambaran konkret λεπίδες sekaligus menunjukkan bahwa ὡς menyatakan kemiripan, bukan memastikan bahwa benda itu benar-benar sisik.
- source_word: ἀνέβλεψεν
  choice: ia dapat melihat kembali
  rationale: Dalam konteks pemulihan dari kebutaan, verba ini berarti pulihnya kemampuan melihat, bukan sekadar menengadah.
- source_word: τε καὶ
  choice: dan ... lalu
  rationale: Menghubungkan tindakan-tindakan berurutan dengan alur yang alami dalam bahasa Indonesia.
- source_word: ἀναστάς
  choice: ia bangkit
  rationale: Menyatakan tindakan berikutnya setelah penglihatannya pulih; 'bangkit' bernada wajar dan bermartabat dalam narasi.
- source_word: ἐβαπτίσθη
  choice: dibaptis
  rationale: Padanan baku dan netral secara denominasi untuk bentuk pasif βαπτίζω tanpa menetapkan cara baptisan yang tidak dijelaskan ayat ini.
theological_decisions:
- issue: Cara menerjemahkan βαπτίζω tanpa memasukkan kekhasan denominasi
  choice: dibaptis
  alternative: diselamkan
  rationale: Ayat ini melaporkan baptisan tanpa menjelaskan caranya. 'Dibaptis' setia pada istilah Yunani dan tidak mempersempit makna kepada satu tata cara denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang jelas dan bermartabat. Istilah 'dibaptis' dipertahankan karena lazim, transparan, dan netral terhadap perbedaan tata cara baptisan.
