  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: id
  text: Para pria yang bepergian bersama Saulus berdiri tanpa dapat berkata-kata, sambil mendengar suara itu[a] tetapi tidak melihat seorang pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi itu”. Kata Yunani ini dapat berarti “suara” atau “bunyi”; bandingkan Kisah Para Rasul 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Orang-orang
  rationale: ἄνδρες menunjuk kepada orang-orang laki-laki yang menyertai Saulus; dalam konteks ini, 'orang-orang' merupakan ungkapan naratif Indonesia yang alami. δέ adalah penghubung ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: yang sedang dalam perjalanan bersama Saulus
  rationale: συνοδεύω berarti menyertai seseorang dalam perjalanan. Nama 'Saulus' dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: εἱστήκεισαν
  choice: berdiri terpaku
  rationale: Bentuk pluperfek ἵστημι di sini memiliki daya statif, yakni berada dalam keadaan berdiri. 'Terpaku' secara idiomatis menyampaikan keadaan mereka yang terdiam karena pengalaman mengejutkan tanpa mengubahnya menjadi sekadar 'berhenti'.
- source_word: ἐνεοί
  choice: tanpa dapat berkata-kata
  rationale: ἐνεός menyatakan keadaan bisu atau tidak mampu berbicara, sering kali akibat keterkejutan. Ungkapan ini lebih jelas bagi pembaca modern daripada 'kelu' dan lebih tepat daripada sekadar 'diam'.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: mendengar suara itu
  rationale: φωνή dapat berarti suara atau bunyi, tetapi dalam konteks penampakan ini 'suara' mempertahankan kemungkinan bahwa yang terdengar adalah suara seorang pembicara. Artikel Yunani diterjemahkan secara wajar dengan 'itu'. Ambiguitas leksikal dicatat dalam catatan kaki dan tidak diselesaikan secara harmonistis.
- source_word: μηδένα δὲ θεωροῦντες
  choice: tetapi tidak melihat siapa pun
  rationale: θεωρέω berarti melihat atau mengamati, dan μηδένα menyatakan bahwa tidak ada seorang pun yang terlihat. 'Tidak melihat siapa pun' adalah padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Ketegangan yang tampak antara Kisah Para Rasul 9:7 dan 22:9 tentang apa yang didengar oleh para pengikut Saulus
  choice: Menerjemahkan φωνή sebagai 'suara' dalam teks utama dan mencatat 'bunyi' sebagai kemungkinan lain
  alternative: Menerjemahkan φωνή sebagai 'bunyi' untuk membedakannya dari suara yang tidak mereka dengar dalam Kisah Para Rasul 22:9
  rationale: Rentang makna φωνή mencakup 'suara' dan 'bunyi'. 'Suara' merupakan padanan langsung yang wajar di sini dan membiarkan ketegangan dengan 22:9 tetap ada, alih-alih menyelesaikannya melalui harmonisasi penerjemah. Catatan kaki mempertahankan alternatif leksikal yang sungguh-sungguh tersedia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Kalimat dipecah menjadi dua agar hubungan keadaan dan persepsi para pengikut Saulus jelas. 'Tanpa dapat berkata-kata' dipilih untuk keterbacaan luas; ambiguitas φωνή dipertahankan melalui catatan kaki.
