id: ACT.9.40
reference: Acts 9:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: id
  text: Namun, Petrus menyuruh semua orang keluar. Lalu ia berlutut dan berdoa. Setelah berpaling ke arah tubuh itu, ia berkata, “Tabita, bangunlah[a].” Perempuan itu membuka matanya, dan ketika melihat Petrus, ia pun duduk tegak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bangkitlah” atau “berdirilah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: menyuruh semua orang keluar
  rationale: Ungkapan ini menunjukkan bahwa Petrus membuat semua orang meninggalkan ruangan. Pilihan ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan unsur paksaan.
- source_word: θεὶς τὰ γόνατα
  choice: berlutut
  rationale: Idiom Yunani ini berarti mengambil posisi berlutut, khususnya dalam konteks doa.
- source_word: προσηύξατο
  choice: berdoa
  rationale: Padanan Indonesia yang langsung dan lazim untuk tindakan berdoa.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: berpaling ke arah tubuh itu
  rationale: Mempertahankan gerakan fisik dan kata σῶμα, 'tubuh', tanpa memakai 'mayat' atau 'jenazah' yang dapat memberi penekanan tambahan menjelang pemulihan hidup.
- source_word: Ταβιθά
  choice: Tabita
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἀνάστηθι
  choice: bangunlah
  rationale: Kata ini dapat berarti bangkit, bangun, atau berdiri sesuai konteks. 'Bangunlah' alami sebagai perintah kepada orang yang sedang terbaring dan tetap membawa gema pemulihan hidup tanpa terdengar kuno.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: membuka matanya
  rationale: Terjemahan langsung dan alami dari klausa Yunani.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: ketika melihat Petrus
  rationale: Partisip Yunani dinyatakan sebagai klausa waktu agar urutan tindakan jelas dalam bahasa Indonesia.
- source_word: ἀνεκάθισεν
  choice: ia pun duduk tegak
  rationale: Verba ini menunjuk pada tindakan bangun ke posisi duduk dari posisi berbaring. 'Duduk tegak' membedakannya dari sekadar sedang duduk.
- source_word: δὲ
  choice: Namun / lalu
  rationale: Partikel ini menandai perkembangan narasi, bukan pertentangan yang kuat. Padanan disesuaikan dengan alur kalimat Indonesia.
theological_decisions:
- issue: Bahasa perintah yang berkaitan dengan pemulihan hidup
  choice: bangunlah
  alternative: bangkitlah; berdirilah
  rationale: '''Bangunlah'' mempertahankan keluasan makna perintah Yunani dan sesuai dengan tindakan seseorang yang terbaring. Pilihan ini tidak secara berlebihan menentukan apakah tekanannya pada berdiri secara jasmani atau bangkit kembali kepada kehidupan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi tetap mudah dipahami. Penanda catatan kaki ditempatkan sesudah kata yang dijelaskannya, bukan sesudah klausa tentang orang-orang yang keluar.
