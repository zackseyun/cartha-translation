  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: id
  text: Di sana ia menemukan seorang laki-laki bernama Eneas, yang sudah delapan tahun terbaring di atas tikar[a]; ia lumpuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tempat tidur sederhana.'
    reason: κραβάττος dapat menunjuk pada tikar, palet, atau tempat tidur sederhana; catatan ini mempertahankan alternatif leksikal bagi benda tempat Eneas terbaring.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Di sana ia menemukan
  rationale: Menyampaikan kelanjutan narasi dan keterangan tempat secara alami dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak ada dalam teks Yunani.
- source_word: ἄνθρωπόν τινα
  choice: seorang
  rationale: Dalam konteks pengenalan tokoh baru, 'seorang' secara alami menyampaikan bahwa yang dimaksud ialah orang tertentu yang sebelumnya belum diperkenalkan.
- source_word: ὀνόματι Αἰνέαν
  choice: bernama Eneas
  rationale: Bentuk datif ὀνόματι dengan nama diri paling wajar diterjemahkan 'bernama'; Αἰνέας ditransliterasikan menurut bentuk Indonesia yang lazim, 'Eneas'.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: sudah delapan tahun
  rationale: Ungkapan ini menunjukkan keadaan yang berlangsung selama delapan tahun hingga saat dalam narasi; 'sudah delapan tahun' mengungkapkan durasi itu dengan wajar.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: terbaring di atas tikar
  rationale: Terjemahan ini mempertahankan gambaran konkret seseorang yang terus terbaring pada κράβαττος, yakni tikar atau pembaringan sederhana, tanpa menggantinya dengan simpulan yang lebih abstrak seperti 'terbaring sakit'.
- source_word: ὃς ἦν παραλελυμένος
  choice: dan lumpuh
  rationale: παραλελυμένος menyatakan keadaan lumpuh yang sedang dialami Eneas. Susunan ini tetap membedakannya dari keterangan bahwa ia telah terbaring selama delapan tahun.
