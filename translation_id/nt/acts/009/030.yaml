  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: id
  text: Ketika saudara-saudara seiman mengetahui hal itu[a], mereka membawanya turun ke Kaisarea, lalu mengirimnya ke Tarsus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani secara harfiah menyebut “saudara-saudara”; dalam konteks ini istilah tersebut dapat merujuk kepada komunitas orang percaya secara luas, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: ketika ... mengetahui hal itu
  rationale: Partisipel aoristus ini menyatakan keadaan yang mendorong tindakan utama. Objeknya tersirat dari ayat sebelumnya, sehingga “hal itu” ditambahkan secara wajar dalam bahasa Indonesia.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara seiman
  rationale: Secara harfiah berarti “saudara-saudara,” tetapi dalam Kisah Para Rasul istilah ini lazim menunjuk kepada sesama orang percaya. Tambahan “seiman” memperjelas hubungan yang dimaksud tanpa menentukan bahwa semua acuannya hanya laki-laki.
- source_word: κατήγαγον
  choice: membawanya turun
  rationale: Mempertahankan unsur arah dalam κατάγω, yaitu membawa turun, yang sesuai dengan perjalanan menuju Kaisarea di pesisir.
- source_word: Καισάρειαν
  choice: Kaisarea
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: ἐξαπέστειλαν
  choice: memberangkatkannya
  rationale: Mengungkapkan tindakan mengirim dia pergi atau meneruskan perjalanannya dari Kaisarea menuju Tarsus secara alami dalam bahasa Indonesia.
- source_word: Ταρσόν
  choice: Tarsus
  rationale: Bentuk nama kota yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan οἱ ἀδελφοὶ dalam komunitas yang mungkin mencakup laki-laki dan perempuan
  choice: saudara-saudara seiman
  alternative: saudara-saudara; sesama orang percaya
  rationale: Bentuk Yunani secara gramatikal adalah maskulin jamak, tetapi pemakaiannya dapat mencakup komunitas orang percaya secara lebih luas. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan informasi tentang bentuk Yunani dan kemungkinan cakupannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Namun” mewakili δέ sebagai peralihan naratif; “membawanya turun” mempertahankan arah geografis, sedangkan “memberangkatkannya” menyampaikan gerak lanjutan menuju Tarsus secara alami.
