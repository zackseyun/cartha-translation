  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: id
  text: Namun, pada malam hari, murid-muridnya mengambilnya dan menurunkannya melalui tembok dalam sebuah keranjang besar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui sebuah bukaan pada tembok.” Secara harfiah bahasa Yunani berbunyi “melalui tembok,” yang kemungkinan merujuk pada sebuah bukaan atau jendela pada tembok kota.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani memakai dua ungkapan yang bermakna “menurunkan.” Susunan yang hidup ini menekankan cara dia diloloskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: membawa
  rationale: Partisip aoristus ini memperkenalkan tindakan para murid mengambil serta membawa Saulus untuk meloloskannya; 'membawa' alami dalam konteks ini tanpa menyiratkan bahwa mereka sekadar memegangnya.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang berkontras dengan rencana pembunuhan sebelumnya; 'Namun' menyampaikan pembalikan alur secara wajar.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-muridnya
  rationale: Terjemahan ini mempertahankan pronomina posesif αὐτοῦ dan makna lazim μαθηταί.
- source_word: νυκτός
  choice: pada malam hari
  rationale: Genitif waktu ini paling alami dinyatakan dalam bahasa Indonesia modern sebagai 'pada malam hari'.
- source_word: διὰ τοῦ τείχους
  choice: melalui tembok
  rationale: διά dengan genitif menyatakan gerakan melalui sesuatu. Terjemahan ini tidak menambahkan 'lubang' atau 'tembok kota,' yang tidak disebutkan secara eksplisit dalam bahasa Yunani.
- source_word: καθῆκαν αὐτόν
  choice: menurunkannya
  rationale: καθίημι dalam konteks ini berarti menurunkan seseorang dari tempat tinggi.
- source_word: χαλάσαντες
  choice: menurunkannya
  rationale: Partisip ini bertumpang tindih dengan καθῆκαν dan menerangkan cara pelarian; dalam teks utama, kedua ungkapan diringkas secara alami, sementara pengulangan bahasa Yunani dijelaskan dalam catatan kaki.
- source_word: ἐν σπυρίδι
  choice: dalam sebuah keranjang besar
  rationale: σπυρίς menunjuk pada keranjang yang cukup besar; konteksnya juga menuntut wadah yang dapat memuat seorang manusia.
