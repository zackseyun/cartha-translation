    issue: Aspek perubahan pada γνωστὸν ... ἐγένετο belum tampak jelas.
    rationale: «Hal itu pun diketahui» dapat dibaca hanya sebagai keadaan pasif (“hal itu diketahui”), sedangkan konstruksi Yunani menyatakan bahwa hal itu menjadi diketahui. Menambahkan «menjadi» mempertahankan perkembangan naratif tersebut.
  - severity: low
    issue: «Pun» bukan padanan paling netral untuk δέ.
    rationale: δέ di sini terutama penghubung naratif ringan; «pun» dapat mengisyaratkan tambahan atau penegasan. Kalimat Indonesia tetap mengalir tanpa padanan eksplisit.
  revised_text: Hal itu menjadi diketahui di seluruh Yope, dan banyak orang percaya kepada Tuhan.
