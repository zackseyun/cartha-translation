  verdict: revise
  source_fidelity: 'Makna pokok tersampaikan dengan tepat: kabar tentang peristiwa sebelumnya diketahui di seluruh Yope dan banyak orang beriman kepada Tuhan. Namun, «diketahui» tanpa penanda perubahan kurang jelas menyampaikan ἐγένετο (“menjadi/terjadi”), sedangkan «pun» dapat memberi nuansa tambahan yang tidak diperlukan bagi δέ.'
  naturalness: Kalimatnya pada dasarnya baku dan jelas. «Menjadi diketahui» sedikit lebih eksplisit dalam mempertahankan aspek resultatif aoris dan tetap dapat diterima dalam ragam Alkitab Indonesia modern.
  terminology: «Yope», «percaya kepada», dan «Tuhan» tepat serta lazim. «Tuhan» mempertahankan nilai κύριος dalam konteks ini tanpa menambahkan identitas yang tidak disebutkan dalam ayat.
  issues:
