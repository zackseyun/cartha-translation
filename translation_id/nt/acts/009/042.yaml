  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: id
  text: Hal itu menjadi diketahui di seluruh Yope, dan banyak orang percaya kepada Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν δὲ ἐγένετο
  choice: Hal itu pun diketahui
  rationale: Konstruksi impersonal ini menyatakan bahwa peristiwa sebelumnya menjadi diketahui. “Hal itu” memberi rujukan alami dalam bahasa Indonesia tanpa menentukan pelaku yang menyebarkan berita, sedangkan “pun” membawa fungsi penghubung ringan dari δέ.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: di seluruh Yope
  rationale: κατά dengan genitif menyatakan persebaran di segenap wilayah; “di seluruh” alami dan mempertahankan cakupan ὅλης.
- source_word: Ἰόππης
  choice: Yope
  rationale: “Yope” adalah bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia untuk kota yang juga dikenal sebagai Jaffa.
- source_word: ἐπίστευσαν πολλοὶ
  choice: banyak orang percaya
  rationale: Adjektiva substantival πολλοί secara alami memerlukan “orang” dalam bahasa Indonesia, dan ἐπίστευσαν menyatakan terjadinya respons percaya tanpa perlu menambahkan rumusan teologis lain.
- source_word: ἐπὶ τὸν κύριον
  choice: kepada Tuhan
  rationale: Dengan πιστεύω, ἐπί ditambah akusatif menunjuk kepada pribadi yang menjadi sasaran iman atau kepercayaan. “Percaya kepada” adalah ungkapan Indonesia yang alami dan relasional.
- source_word: κύριον
  choice: Tuhan
  rationale: “Tuhan” mempertahankan bobot gelar κύριος dalam konteks Kisah Para Rasul dan lebih tepat daripada “tuan” bagi rujukan kepada Yesus.
theological_decisions:
- issue: Pemaknaan πιστεύω + ἐπί τὸν κύριον
  choice: percaya kepada Tuhan
  alternative: percaya dalam Tuhan
  rationale: “Percaya kepada Tuhan” secara alami menyatakan bahwa Tuhan adalah sasaran kepercayaan pribadi. Pilihan ini tidak mempersempit makna menjadi rumusan doktrinal yang tidak dinyatakan oleh teks.
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks narasi Kisah Para Rasul, gelar ini merujuk kepada Yesus dan mengandung bobot kristologis; “Tuhan” mempertahankan bobot tersebut tanpa menambahkan identifikasi yang tidak disebutkan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mengikuti alur narasi Yunani namun tetap alami bagi pembaca umum. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang harus ditampilkan dalam ayat ini.
