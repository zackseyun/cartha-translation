  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: id
  text: Sebab Aku sendiri akan menunjukkan kepadanya betapa banyak penderitaan yang harus dialaminya demi nama-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena nama-Ku” atau “untuk kepentingan nama-Ku.”
    reason: Alternatif leksikal untuk ὑπέρ yang menampilkan nuansa sebab dan kepentingan.
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku sendiri
  rationale: Pronomina eksplisit memberi penekanan pada subjek; “Aku sendiri” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan antarkalimat.
- source_word: ὑποδείξω
  choice: akan menunjukkan
  rationale: Menyampaikan makna memperlihatkan atau memberitahukan secara langsung, sekaligus mempertahankan bentuk mendatang.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Padanan alami bagi objek tak langsung bentuk datif dalam konstruksi “menunjukkan kepadanya”.
- source_word: ὅσα
  choice: betapa banyak penderitaan
  rationale: Dalam konstruksi dengan δεῖ dan παθεῖν, kata ini menyatakan besarnya atau banyaknya penderitaan. Penyebutan “penderitaan” membuat ungkapan Indonesia jelas tanpa mengubah maksud.
- source_word: δεῖ
  choice: harus
  rationale: Mempertahankan gagasan keharusan tanpa menentukan apakah keharusan itu terutama bersifat providensial, penetapan, atau bentuk keniscayaan lain.
- source_word: ὑπὲρ
  choice: demi
  rationale: Dalam hubungan dengan “nama-Ku,” kata depan ini menyatakan kepentingan atau alasan; “demi” alami dan tetap membuka nuansa “karena” maupun “untuk kepentingan.”
- source_word: τοῦ ὀνόματός μου
  choice: nama-Ku
  rationale: Mempertahankan ungkapan “nama” yang dapat mencakup pribadi, kewibawaan, dan pengakuan publik tentang Yesus.
- source_word: παθεῖν
  choice: penderitaan yang harus dialaminya
  rationale: Bentuk idiomatis Indonesia untuk “harus menderita”; “mengalami penderitaan” cocok dengan “betapa banyak” dan mempertahankan makna πάσχω.
theological_decisions:
- issue: Sifat keharusan yang dinyatakan oleh δεῖ
  choice: harus
  alternative: ditetapkan untuk; ditakdirkan untuk
  rationale: Teks menyatakan keharusan, tetapi tidak merinci sifatnya. “Harus” mempertahankan ketegangan teologis tanpa memasukkan nuansa determinatif yang lebih kuat.
- issue: Makna ὑπὲρ τοῦ ὀνόματός μου
  choice: demi nama-Ku
  alternative: karena nama-Ku; untuk kepentingan nama-Ku
  rationale: “Demi” mempertahankan keluasan hubungan sebab, kepentingan, dan keberpihakan yang dapat terkandung dalam ὑπέρ, sementara alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Aku sendiri” mempertahankan penekanan ἐγώ; huruf kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah frasa terkait.
