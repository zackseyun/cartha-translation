  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: id
  text: Ia pun segera memberitakan Yesus[a] di sinagoge-sinagoge, dengan menyatakan bahwa Dialah Anak Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mewartakan Yesus” atau “berkhotbah tentang Yesus.” Kata Yunani yang dipakai menunjuk pada penyampaian berita secara terbuka.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “bahwa inilah Anak Allah.”
    reason: source_form
lexical_decisions:
- source_word: εὐθέως
  choice: segera
  rationale: Menyampaikan ketepatan waktu dan gerak cepat dalam narasi dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: di rumah-rumah ibadat
  rationale: Mempertahankan makna lokatif dan bentuk jamak. Dalam konteks Kisah Para Rasul, frasa ini secara wajar menunjuk pada sinagoge tanpa perlu menambahkan keterangan yang tidak terdapat dalam teks Yunani.
- source_word: ἐκήρυσσεν
  choice: memberitakan
  rationale: Mengungkapkan tindakan menyampaikan berita secara terbuka; bentuk imperfek diterjemahkan secara alami sebagai kegiatan yang mulai dilakukan dalam konteks ini.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Mempertahankan Yesus sebagai objek langsung dari kata kerja, sesuai dengan susunan ringkas dan berpusat pada Kristus dalam bahasa Yunani.
- source_word: ὅτι
  choice: dengan menyatakan bahwa
  rationale: Memperjelas secara alami dalam bahasa Indonesia bahwa klausa berikutnya merupakan isi pemberitaan, tanpa mengubah proposisinya.
- source_word: οὗτός
  choice: Dialah
  rationale: Partikel penegas -lah mempertahankan daya tunjuk dan penekanan identifikasi dari kata demonstratif Yunani, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan langsung dan lazim bagi gelar kristologis ini, tanpa mengurangi atau memperluas pernyataan sumber.
theological_decisions:
- issue: Gelar kristologis dalam pemberitaan Saulus
  choice: Anak Allah
  alternative: Putra Allah
  rationale: “Anak Allah” merupakan padanan langsung, dikenal luas, dan mempertahankan bobot gelar ὁ υἱὸς τοῦ θεοῦ tanpa penjelasan doktrinal tambahan.
- issue: Penekanan identitas pada οὗτός
  choice: Dialah
  alternative: orang inilah
  rationale: “Dialah” mempertahankan penegasan bahwa Yesus yang diberitakan itu adalah Anak Allah, tetapi tidak menambahkan kata “orang” yang tidak dinyatakan dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Rumah-rumah ibadat” dipilih sebagai ungkapan yang mudah dipahami untuk sinagoge; “Dialah” menjaga penekanan teks Yunani tanpa menghasilkan susunan yang kaku.
