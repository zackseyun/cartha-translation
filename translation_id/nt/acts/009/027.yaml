id: ACT.9.27
reference: Acts 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: id
  text: Namun, Barnabas memegang Saulus lalu membawanya kepada para rasul. Ia menceritakan kepada mereka bagaimana Saulus melihat Tuhan dalam perjalanan, bahwa Tuhan berbicara kepadanya, dan bagaimana Saulus berbicara dengan berani di Damsyik dalam nama Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: merangkul Saulus
  rationale: Partisip ini secara konkret berarti memegang atau menggandeng. Dalam konteks tindakan Barnabas yang menerima dan mendampingi Saulus, 'merangkul' mengungkapkan tindakan penerimaan serta dukungan secara alami, tanpa nuansa penangkapan yang dapat timbul dari 'menangkap'.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: membawanya kepada para rasul
  rationale: ἄγω dapat berarti menuntun atau membawa; 'membawanya kepada' alami dalam bahasa Indonesia dan menggambarkan Barnabas mempertemukan Saulus dengan para rasul.
- source_word: διηγήσατο
  choice: menceritakan kepada mereka
  rationale: Kata ini berarti menuturkan atau mengisahkan secara terperinci. 'Menceritakan' cukup formal, mudah dipahami, dan sesuai dengan rincian yang menyusul.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: bagaimana ... di jalan
  rationale: ὁδός di sini menunjuk pada perjalanan menuju Damsyik, bukan pada sebutan bagi gerakan 'Jalan Tuhan'.
- source_word: εἶδεν τὸν κύριον
  choice: Saulus telah melihat Tuhan
  rationale: Bentuk lampau Indonesia dengan 'telah' sesuai dengan peristiwa terdahulu yang sedang diceritakan Barnabas. Nama 'Saulus' dipakai untuk memperjelas subjek pronominal Yunani tanpa mengubah referennya.
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam konteks Kisah Para Rasul 9, gelar ini menunjuk kepada Yesus yang bangkit dan mempertahankan bobot kristologis κύριος.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: bahwa Tuhan telah berbicara kepadanya
  rationale: Subjek tersirat verba Yunani adalah Tuhan dari klausa sebelumnya. Menyebut 'Tuhan' menghindari ambiguitas pronomina Indonesia yang berpotensi membuat Saulus tampak sebagai pembicara.
- source_word: ἐπαρρησιάσατο
  choice: telah berbicara dengan berani
  rationale: παρρησιάζομαι menyatakan berbicara dengan bebas, terbuka, atau berani. Terjemahan ini menjaga arti leksikal tanpa mempersempitnya menjadi 'berkhotbah'.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: dalam nama Yesus
  rationale: Terjemahan ini mempertahankan ungkapan alkitabiah yang menyiratkan hubungan dengan kewibawaan dan pengakuan akan Yesus.
- source_word: Δαμασκῷ
  choice: Damsyik
  rationale: Mengikuti bentuk nama tempat yang lazim dan mapan dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Rujukan gelar 'Tuhan' dalam pengalaman Saulus di jalan
  choice: '''Tuhan'' menunjuk kepada Yesus'
  alternative: '''Tuhan'' sebagai rujukan ilahi yang lebih umum'
  rationale: Konteks langsung Kisah Para Rasul 9 mengidentifikasi sosok yang dijumpai Saulus sebagai Yesus yang bangkit, dan akhir ayat menyebut nama Yesus. Gelar 'Tuhan' tetap dipertahankan agar bobot kristologisnya tidak diratakan.
- issue: Pelaku yang berbicara dalam ὅτι ἐλάλησεν αὐτῷ
  choice: Tuhan berbicara kepada Saulus
  alternative: Saulus berbicara kepada Tuhan
  rationale: Subjek gramatikal yang paling alami diteruskan dari τὸν κύριον dalam klausa sebelumnya, sedangkan αὐτῷ menunjuk kepada Saulus. Subjek dinyatakan secara eksplisit dalam bahasa Indonesia demi kejelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan rangkaian laporan Barnabas. Nama Saulus diulang untuk menjernihkan pronomina Yunani; tidak diperlukan catatan kaki.
