id: ACT.9.12
reference: Acts 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: id
  text: dan ia telah melihat[a] dalam sebuah penglihatan seorang laki-laki bernama Ananias masuk dan menumpangkan tangannya ke atasnya supaya ia dapat melihat kembali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melihat”; kata kerja Yunaninya berbentuk aoristus, sedangkan “telah melihat” menonjolkan bahwa penglihatan itu sudah terjadi dan masih relevan dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “memperoleh kembali penglihatannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: telah melihat
  rationale: Bentuknya adalah aoristus (‘melihat’), tetapi ‘telah melihat’ secara alami menyatakan penglihatan yang sudah dialami Saulus dan masih relevan ketika Tuhan berbicara kepada Ananias.
- source_word: ἄνδρα
  choice: seorang laki-laki
  rationale: ἀνήρ di sini menunjuk kepada seorang laki-laki dewasa, yaitu Ananias; pilihan ini jelas dan tepat.
- source_word: ἐν ὁράματι
  choice: dalam suatu penglihatan
  rationale: Frasa ini menyatakan ranah atau sarana ketika Saulus melihat hal tersebut.
- source_word: Ἁνανίαν ὀνόματι
  choice: bernama Ananias
  rationale: Ungkapan Yunani ini mengidentifikasi orang tersebut menurut namanya; bentuk Indonesia ini wajar dan langsung.
- source_word: εἰσελθόντα
  choice: masuk
  rationale: Partisip ini menggambarkan tindakan Ananias dalam penglihatan tanpa perlu mempertegas urutan waktu lebih daripada teks sumber.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: menumpangkan tangan kepadanya
  rationale: Pilihan ini mempertahankan ungkapan alkitabiah untuk tindakan fisik tersebut tanpa menambahkan makna sakramental, pentahbisan, atau mekanisme penyembuhan tertentu.
- source_word: ὅπως
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan tindakan Ananias dan diterjemahkan dengan bentuk Indonesia yang ringkas serta alami.
- source_word: ἀναβλέψῃ
  choice: ia dapat melihat kembali
  rationale: Dalam konteks kebutaan dan penyembuhan, ἀναβλέπω berarti melihat kembali atau memperoleh kembali penglihatan, bukan sekadar mendongak.
theological_decisions:
- issue: Apakah makna teologis penumpangan tangan perlu dijelaskan dalam terjemahan
  choice: menumpangkan tangan kepadanya
  alternative: meletakkan tangan ke atasnya
  rationale: Teks Yunani menyebut tindakan fisiknya, tetapi tidak merumuskan makna sakramental atau karismatiknya. Ungkapan alkitabiah dipertahankan tanpa memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan bermartabat. Susunan kalimat mempertahankan bentuk ayat yang melanjutkan perkataan dari konteks sebelumnya. Istilah ‘penglihatan’ dan ungkapan ‘menumpangkan tangan’ dipertahankan karena dikenal luas, tetapi tidak diberi muatan doktrinal tambahan.
