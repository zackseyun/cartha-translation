id: ACT.9.11
reference: Acts 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: id
  text: Lalu Tuhan berkata kepadanya, “Bangunlah dan pergilah ke jalan yang disebut Jalan Lurus. Di rumah Yudas, carilah seorang bernama Saulus dari Tarsus, sebab lihatlah, ia sedang berdoa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi gelar κύριος dalam Perjanjian Baru; tidak menambahkan identitas pembicara yang tidak disebutkan secara eksplisit dalam klausa ini.
- source_word: Ἀναστὰς πορεύθητι
  choice: Bangunlah dan pergilah
  rationale: Partisip aoristis Ἀναστὰς menyertai imperatif πορεύθητι dan secara alami menyatakan tindakan awal yang diikuti perintah pergi.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: jalan yang disebut Jalan Lurus
  rationale: ῥύμη menunjuk jalan dalam kota, sedangkan Εὐθεῖαν berfungsi sebagai nama jalan. Pengulangan 'Jalan' membuat nama tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: Di rumah Yudas
  rationale: Menyatakan lokasi tempat Ananias harus mencari Saulus; bentuk ini alami tanpa harus menentukan apakah Yudas sedang hadir atau merupakan pemilik rumah.
- source_word: ζήτησον
  choice: carilah
  rationale: Mempertahankan makna mencari atau menanyakan seseorang dan tidak melebihkannya menjadi 'temukanlah'.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: seorang bernama Saulus dari Tarsus
  rationale: ὀνόματι memperkenalkan nama Saulus, sedangkan Ταρσέα adalah sebutan asal geografis, yakni orang dari Tarsus.
- source_word: ἰδοὺ γὰρ
  choice: sebab lihatlah
  rationale: γάρ memberi alasan bagi perintah, sementara ἰδού menarik perhatian kepada keadaan Saulus saat itu.
- source_word: προσεύχεται
  choice: ia sedang berdoa
  rationale: Bentuk kini paling alami dipahami sebagai kegiatan yang sedang berlangsung ketika Tuhan berbicara kepada Ananias.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: Tuhan Yesus
  rationale: Konteks dekat menunjukkan bahwa pembicaranya adalah Yesus yang bangkit, tetapi ayat ini sendiri hanya memakai κύριος; terjemahan tidak menambahkan nama 'Yesus'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk imperatif '-lah' mempertahankan nada perintah tanpa terdengar kasar. Nama jalan ditulis 'Jalan Lurus' agar terbaca sebagai nama diri.
