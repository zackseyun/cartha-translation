  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: id
  text: Pada waktu itu, ia jatuh sakit lalu meninggal. Setelah memandikannya, mereka membaringkannya di sebuah ruangan di lantai atas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di ruang atas.” Kata Yunaninya menunjuk pada ruangan di bagian atau lantai atas sebuah bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: Pada waktu itu
  rationale: Ungkapan ini secara alami memperkenalkan peristiwa yang terjadi pada masa tersebut. Terjemahan ini menyampaikan fungsi naratif ἐγένετο dan hubungan ringan δὲ tanpa memakai ungkapan Indonesia yang kaku seperti 'terjadilah pada hari-hari itu'.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: ia jatuh sakit lalu meninggal
  rationale: Susunan infinitif dan partisipel Yunani dialihkan menjadi klausa Indonesia yang wajar. 'Lalu' memperjelas urutan bahwa sakitnya mendahului kematiannya tanpa menambahkan hubungan sebab-akibat.
- source_word: λούσαντες
  choice: Setelah memandikannya
  rationale: Partisipel aoris menunjukkan tindakan yang dilakukan sebelum mereka membaringkannya. Dalam konteks, yang dimandikan adalah tubuh perempuan yang baru meninggal, tetapi terjemahan tidak perlu menambahkan kata 'jenazah' yang tidak dinyatakan secara eksplisit.
- source_word: ἔθηκαν αὐτὴν
  choice: mereka membaringkannya
  rationale: τίθημι berarti menaruh atau menempatkan. 'Membaringkannya' merupakan ungkapan Indonesia yang alami dalam konteks penanganan jenazah dan sesuai dengan tindakan menempatkan tubuh di ruangan.
- source_word: ἐν ὑπερῴῳ
  choice: di sebuah ruangan di lantai atas
  rationale: ὑπερῷον menunjuk pada ruangan di bagian atau lantai atas sebuah bangunan. Bentuk ini jelas bagi pembaca modern dan tidak menyiratkan bahwa yang dimaksud adalah suatu 'ruang atas' tertentu yang sudah dikenal.
theological_decisions:
- issue: Apakah ὑπερῴῳ harus diterjemahkan dengan ungkapan tradisional 'ruang atas' atau sebagai keterangan ruang yang umum
  choice: di sebuah ruangan di lantai atas
  alternative: di ruang atas
  rationale: Kata Yunani ini tidak memakai artikel dan hanya menunjuk pada ruangan di bagian atas bangunan. Terjemahan yang dipilih menghindari kesan bahwa Lukas merujuk pada suatu ruangan khusus atau terkenal, tanpa meniadakan alternatif ungkapan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina 'ia' menjaga kesinambungan rujukan kepada Tabita dari konteks sebelumnya. Bentuk 'memandikannya' mempertahankan ungkapan sumber tanpa tambahan eksplisit 'jenazah', sedangkan 'membaringkannya' menyampaikan konteks secara alami.
