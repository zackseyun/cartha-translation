  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: id
  text: Namun, Saulus bangkit dari tanah. Meskipun matanya terbuka, ia tidak melihat apa-apa. Maka mereka menuntunnya dengan memegang tangannya dan membawanya masuk ke Damsyik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: bangkit
  rationale: 'Bentuk pasif aoris ἐγείρω berfungsi secara intransitif dalam konteks ini: Saulus bangun dari posisi jatuh di tanah. “Bangkit” alami dan bermartabat dalam narasi Indonesia.'
- source_word: ἀπὸ τῆς γῆς
  choice: dari tanah
  rationale: Dalam adegan ini γῆ menunjuk pada permukaan tanah tempat Saulus jatuh, bukan bumi secara kosmis atau suatu wilayah.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: Meskipun matanya terbuka
  rationale: Konstruksi genitif absolut menyatakan keadaan yang menyertai, sedangkan konteks menonjolkan kontras ironis antara mata yang terbuka dan ketidakmampuan melihat.
- source_word: οὐδὲν ἔβλεπεν
  choice: ia tidak melihat apa-apa
  rationale: Ungkapan ini mempertahankan pernyataan langsung bahasa Yunani tentang ketiadaan penglihatan tanpa menambahkan penafsiran.
- source_word: χειραγωγοῦντες
  choice: menuntunnya dengan memegang tangannya
  rationale: χειραγωγέω secara khusus berarti menuntun seseorang dengan tangan. Rumusan ini menjaga gambaran konkret itu dan terdengar wajar dalam bahasa Indonesia.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: membawanya masuk ke Damsyik
  rationale: εἰσάγω menyatakan membawa atau menuntun masuk. “Membawanya” menghindari pengulangan kata “menuntun”, sedangkan “masuk ke” mempertahankan arah geraknya.
- source_word: δὲ
  choice: Namun / Maka
  rationale: Tiga kemunculan δέ menandai peralihan naratif, kontras ringan, dan perkembangan tindakan. Tidak semuanya perlu diterjemahkan secara terpisah dalam bahasa Indonesia; “Namun” dan “Maka” menyampaikan alur secara alami.
- source_word: Σαῦλος
  choice: Saulus
  rationale: Nama ini mengikuti bentuk baku yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: Δαμασκόν
  choice: Damsyik
  rationale: Nama tempat ini mengikuti bentuk baku yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
