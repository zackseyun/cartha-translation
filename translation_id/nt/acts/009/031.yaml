id: ACT.9.31
reference: Acts 9:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: id
  text: Dengan demikian, jemaat di seluruh Yudea, Galilea, dan Samaria hidup dalam damai dan terus dibangun[a]. Jemaat itu hidup dalam takut akan Tuhan dan dengan dorongan Roh Kudus[b], dan jumlahnya terus bertambah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “jemaat-jemaat” sebagai ganti “jemaat”.
    reason: textual_variant
  - marker: b
    text: Kata Yunaninya juga dapat berarti “penghiburan” atau “nasihat” dari Roh Kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: jemaat
  rationale: Teks SBLGNT memakai bentuk tunggal dan verba-verba yang selaras juga tunggal. Dalam bahasa Indonesia, “jemaat” dapat berfungsi sebagai nomina kolektif bagi umat percaya di seluruh wilayah tersebut.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: di seluruh Yudea, Galilea, dan Samaria
  rationale: κατά dengan genitif menyatakan cakupan wilayah. “Di seluruh” menyampaikan unsur distributif dan ὅλης secara alami tanpa memberi kesan bahwa hanya Yudea yang dicakup oleh “seluruh”.
- source_word: εἶχεν εἰρήνην
  choice: hidup dalam damai
  rationale: Ungkapan ini menyatakan keadaan damai atau ketenteraman yang dialami jemaat. “Hidup dalam damai” lebih alami daripada terjemahan harfiah “memiliki damai” dan tetap mempertahankan maknanya.
- source_word: οἰκοδομουμένη
  choice: terus dibangun
  rationale: Partisipel kini pasif menggambarkan proses yang sedang berlangsung. “Dibangun” mempertahankan metafora pembangunan rohani, sedangkan “terus” mengungkapkan aspek berkelanjutan.
- source_word: πορευομένη
  choice: hidup
  rationale: Dalam konteks ini kata tersebut menunjuk pada cara menjalani kehidupan. “Hidup” menyampaikan makna perilaku secara wajar dalam bahasa Indonesia; terjemahan harfiah “berjalan” dapat disalahpahami sebagai gerak fisik.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: dalam takut akan Tuhan
  rationale: Ungkapan baku Alkitabiah ini mempertahankan bahasa sumber dan ruang makna yang mencakup rasa gentar, hormat, dan ketaatan, tanpa mereduksinya menjadi sekadar ketakutan atau rasa hormat.
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan Indonesia yang lazim bagi κύριος. Terjemahan tidak memperjelas referennya lebih jauh daripada teks Yunani.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: dalam penguatan dari Roh Kudus
  rationale: παράκλησις dapat berarti dorongan, penghiburan, atau nasihat. “Penguatan” cocok dengan konteks pembangunan dan pertumbuhan jemaat, serta cukup luas untuk menyiratkan dukungan aktif Roh tanpa menutup alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: Padanan baku dan alami dalam bahasa Indonesia modern bagi sebutan ilahi ini.
- source_word: ἐπληθύνετο
  choice: jumlahnya terus bertambah
  rationale: Bentuk imperfek menyatakan pertambahan yang berkelanjutan. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas bahwa yang bertambah adalah jumlah anggota jemaat.
theological_decisions:
- issue: Jumlah dan cakupan ἐκκλησία
  choice: 'bentuk tunggal kolektif: “jemaat”'
  alternative: 'varian tekstual berbentuk jamak: “jemaat-jemaat”'
  rationale: Teks sumber tercetak memakai bentuk tunggal, demikian pula partisipel dan verbanya. Ini menampilkan satu jemaat sebagai kesatuan di tiga wilayah; varian jamak tetap dicatat karena penting secara tekstual.
- issue: Makna “takut akan Tuhan”
  choice: mempertahankan ungkapan yang dapat mencakup rasa gentar, hormat, dan ketaatan
  alternative: menggantikannya dengan tafsiran tunggal seperti “hormat kepada Tuhan”
  rationale: φόβος memiliki ketegangan makna yang bermakna secara teologis. Ungkapan tradisional Indonesia mempertahankan keluasan itu dan tidak menyamakannya semata-mata dengan teror.
- issue: Makna παράκλησις yang berkaitan dengan Roh Kudus
  choice: penguatan
  alternative: penghiburan atau nasihat/dorongan
  rationale: Dalam konteks damai, pembangunan, dan pertambahan jemaat, “penguatan” menyampaikan karya Roh yang menopang secara alami. Karena kata Yunani memiliki rentang makna lebih luas, alternatif penting dipertahankan dalam catatan kaki.
- issue: Hubungan sintaksis pertambahan jemaat dengan takut akan Tuhan dan karya Roh
  choice: “sehingga jumlahnya terus bertambah” sebagai hasil dalam alur kalimat
  alternative: 'koordinasi tanpa penandaan hubungan hasil: “dan jumlahnya terus bertambah”'
  rationale: Susunan partisipel dan verba utama memungkinkan alur keadaan/cara hidup menuju pertambahan. “Sehingga” menghasilkan bahasa Indonesia yang lancar, tetapi tidak menetapkan mekanisme teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Yunani diungkapkan dalam dua kalimat agar subjek kolektif tetap jelas dan alurnya mudah dipahami. Metafora “dibangun” serta ungkapan “takut akan Tuhan” dipertahankan, sementara “berjalan” diungkapkan secara idiomatis sebagai “hidup”.
