source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: id
  text: Di Damsyik ada seorang murid bernama Ananias. Tuhan berkata kepadanya dalam suatu penglihatan, “Ananias!” Ia menjawab, “Aku di sini, Tuhan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Di Damsyik ada
  rationale: Bentuk imperfek εἰμί memperkenalkan tokoh atau adegan baru, sedangkan δέ menandai peralihan naratif ringan. Dalam bahasa Indonesia, susunan lokatif dengan “ada” menyampaikan pengenalan tokoh secara alami tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: τις μαθητὴς
  choice: seorang murid
  rationale: τις bersifat tak tentu dan memperkenalkan seorang tokoh; “seorang murid” merupakan padanan Indonesia yang alami tanpa penekanan berlebih seperti “seorang murid tertentu”.
- source_word: ἐν Δαμασκῷ
  choice: di Damsyik
  rationale: ἐν dengan datif menyatakan lokasi. “Damsyik” adalah bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ὀνόματι Ἁνανίας
  choice: bernama Ananias
  rationale: Datif ὀνόματι merupakan ungkapan idiomatis untuk menyebut nama; “bernama Ananias” ringkas dan alami.
- source_word: εἶπεν πρὸς αὐτὸν
  choice: berkata kepadanya
  rationale: λέγω dengan πρός dan akusatif secara langsung dan wajar diterjemahkan “berkata kepada”.
- source_word: ἐν ὁράματι
  choice: dalam sebuah penglihatan
  rationale: Frasa ini menunjukkan keadaan atau sarana pewahyuan ketika Tuhan berbicara; bentuk tak tentu “sebuah penglihatan” wajar dalam bahasa Indonesia.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dalam konteks Kisah Para Rasul 9, sebutan ini menunjuk kepada Yesus yang bangkit. “Tuhan” adalah padanan baku bahasa Indonesia dan nama jabatan ilahi tidak memerlukan artikel tersendiri.
- source_word: Ἁνανία
  choice: Ananias!
  rationale: Nama ini berbentuk vokatif. Tanda seru menandai panggilan langsung secara alami tanpa menambahkan isi leksikal.
- source_word: Ἰδοὺ ἐγώ
  choice: Ya, ... aku di sini
  rationale: Ungkapan ini merupakan jawaban konvensional yang menyatakan kehadiran dan kesiapan. Susunan “Ya, Tuhan, aku di sini” terdengar alami dan mempertahankan fungsi pragmatisnya.
- source_word: κύριε
  choice: Tuhan
  rationale: Walaupun κύριε dalam konteks lain dapat berarti sapaan hormat seperti “Tuan”, di sini Ananias menjawab pribadi ilahi yang berbicara dalam penglihatan, sehingga “Tuhan” paling sesuai.
theological_decisions:
- issue: Rujukan ὁ κύριος dan κύριε dalam penglihatan
  choice: Keduanya diterjemahkan “Tuhan” dan dipahami menunjuk kepada Yesus yang bangkit.
  alternative: Sapaan ilahi yang lebih umum, atau κύριε sebagai “Tuan”.
  rationale: Konteks dekat Kisah Para Rasul 9 mengidentifikasi pembicara dalam penglihatan sebagai Tuhan yang mengutus Ananias sehubungan dengan Saul; terjemahan “Tuhan” mempertahankan bobot kristologis teks tanpa menambahkan nama “Yesus” yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat pertama dipecah dari rangkaian Yunani yang panjang agar alur naratif lebih alami. Bentuk “Ia” mempertahankan rujukan kepada Ananias, sedangkan kapitalisasi “Tuhan” mengikuti kebiasaan baku untuk sebutan ilahi.
