  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: id
  text: Ia bersama mereka di Yerusalem, keluar masuk dan berbicara dengan berani dalam nama Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: Ia bersama mereka
  rationale: Bentuk imperfek dengan μετά + genitif menunjukkan kebersamaan yang berlangsung. Pilihan ini mempertahankan arti sederhana itu tanpa menambahkan gagasan bahwa ia menetap bersama mereka.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: keluar masuk dengan leluasa
  rationale: Dua partisipel berpasangan ini merupakan ungkapan idiomatis tentang kebebasan bergerak dan bergaul. Dalam bahasa Indonesia, 'keluar masuk dengan leluasa' terdengar alami sekaligus menyampaikan gerak yang berulang dan terbuka.
- source_word: εἰς Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Walaupun εἰς lazimnya berarti 'ke dalam', di sini Yerusalem merupakan lingkup kegiatan dalam ungkapan keluar-masuk; terjemahan lokatif menghindari kesan bahwa ia berulang kali memasuki kota dari luar.
- source_word: παρρησιαζόμενος
  choice: berbicara dengan berani
  rationale: Kata kerja ini menyatakan tutur kata yang terbuka, terus terang, dan tanpa gentar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur keberanian.
- source_word: ἐν τῷ ὀνόματι
  choice: dalam nama
  rationale: Ungkapan ini dapat mencakup otoritas, perwakilan, dan pengakuan. Bentuk idiomatis Alkitabiah dipertahankan agar keluasan maknanya tidak dipersempit.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Teks Yunani memakai gelar κύριος. 'Tuhan' mempertahankan gelar tersebut tanpa menggantinya dengan nama diri.
theological_decisions:
- issue: Rujukan gelar 'Tuhan'
  choice: Gelar 'Tuhan' dipertahankan dalam teks utama; dalam konteks ini rujukannya dipahami sebagai Yesus.
  alternative: Mengganti gelar itu secara eksplisit dengan 'Yesus'.
  rationale: Teks Yunani berbunyi κυρίου, bukan Ἰησοῦ. Mempertahankan gelarnya menjaga bentuk dan bobot teologis ungkapan dalam Lukas–Kisah Para Rasul tanpa menutup ketegangan antara gelar dan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai agar alur narasi ringkas; 'keluar masuk dengan leluasa' menyampaikan idiom Yunani secara alami tanpa memberi kesan perjalanan berulang melintasi batas kota.
