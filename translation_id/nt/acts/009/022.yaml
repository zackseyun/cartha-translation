id: ACT.9.22
reference: Acts 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: id
  text: Namun, Saulus semakin bertambah kuat dan membingungkan orang-orang Yahudi yang tinggal di Damsyik dengan membuktikan bahwa Yesus inilah Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός berarti Yang Diurapi dan sepadan dengan “Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: semakin bertambah kuat
  rationale: Bentuk imperfek menyatakan perkembangan yang terus berlangsung, sedangkan μᾶλλον memberi penegasan komparatif. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan apakah kekuatan itu berasal dari dirinya sendiri atau diberikan kepadanya.
- source_word: συνέχυννεν
  choice: membingungkan
  rationale: Kata kerja ini berarti membuat bingung atau kacau. Dalam konteks perdebatan, pilihan ini menyampaikan bahwa argumen Saulus membuat para penentangnya tidak mampu memberi jawaban yang teratur.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: orang-orang Yahudi yang tinggal di Damsyik
  rationale: Terjemahan langsung dan wajar yang membatasi kelompok tersebut pada orang Yahudi setempat, bukan orang Yahudi pada umumnya.
- source_word: συμβιβάζων
  choice: dengan membuktikan
  rationale: Partisipel ini menjelaskan cara Saulus membingungkan lawan-lawannya, yakni dengan merangkai bukti atau argumen sehingga mencapai suatu kesimpulan.
- source_word: οὗτός
  choice: Yesus inilah
  rationale: Demonstrativa ini bersifat tegas dan menunjuk kepada Yesus dalam konteks terdekat. Menyebut 'Yesus' membuat rujukannya jelas dalam bahasa Indonesia, sementara 'inilah' mempertahankan daya tunjuk dan penekanannya.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός di sini merupakan gelar bagi sosok yang dijanjikan, bukan bagian nama diri. 'Mesias' mempertahankan konteks pengharapan Yahudi.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dengan artikel dan dalam kesimpulan argumen Saulus kepada orang-orang Yahudi, ὁ χριστός menunjuk kepada sosok yang diurapi dan dijanjikan. 'Mesias' menyampaikan fungsi gelar itu tanpa menjadikannya nama diri.
- issue: Subjek yang ditunjuk oleh οὗτός
  choice: Yesus inilah
  alternative: dialah / orang inilah
  rationale: Walaupun nama Yesus tidak muncul dalam ayat ini, konteks sebelumnya menetapkan Yesus sebagai acuannya. Eksplisitasi terbatas ini menghindari ungkapan Indonesia yang janggal dan tetap mempertahankan penekanan demonstratif melalui 'inilah'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Damsyik' dipakai sebagai bentuk nama tempat yang lazim dalam tradisi Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah klausa terkait.
