  to: Lalu ia berkata, “Siapakah Engkau, Tuhan[a]?” Ia berkata, “Akulah Yesus yang engkau aniaya.”
  rationale: Revision is limited to restoring the neutral repeated speech verb represented by εἶπεν and refining the footnote so that it preserves the lexical ambiguity of κύριε without attributing a fully formed recognition to Saul before Jesus identifies himself.
