base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: id
  text: Lalu ia berkata, “Siapakah Engkau, Tuhan[a]?” Ia berkata, “Akulah Yesus yang engkau aniaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat dipakai sebagai sapaan hormat. Di sini diterjemahkan “Tuhan” sesuai dengan penggunaan baku proyek ini dan konteks pewahyuan, sementara kemungkinan makna sapaan hormat tetap terbuka.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Lalu ia berkata
  rationale: δέ berfungsi sebagai penghubung ringan dalam urutan naratif; “lalu” mengalir alami dalam bahasa Indonesia, sedangkan subjek tersirat dinyatakan dengan “ia”.
- source_word: Τίς εἶ
  choice: Siapakah Engkau
  rationale: Terjemahan langsung dan wajar untuk kata tanya personal beserta kopula. “Engkau” mempertahankan sapaan tunggal dan sesuai dengan konteks khidmat.
- source_word: κύριε
  choice: Tuhan
  rationale: κύριε dapat menjadi sapaan hormat, tetapi dalam konteks penampakan ilahi dan pengenalan pembicara sebagai Yesus, “Tuhan” mempertahankan bobot naratif dan teologisnya; kemungkinan “Tuan” dicatat dalam catatan kaki.
- source_word: ὁ δέ
  choice: Dia menjawab
  rationale: Secara harfiah berarti “tetapi/dan dia”; dalam dialog bahasa Indonesia, “Dia menjawab” menyatakan pergantian pembicara secara alami tanpa menambah isi substantif.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Akulah Yesus
  rationale: Bentuk “Akulah” menyampaikan penekanan dari pronomina eksplisit ἐγώ dalam identifikasi diri, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ὃν σὺ διώκεις
  choice: yang engkau aniaya
  rationale: Klausa relatif mempertahankan Yesus sebagai pihak yang menjadi sasaran penganiayaan. Pronomina eksplisit σὺ tercermin dalam “engkau”, dan bentuk kini διώκεις dipahami sebagai tindakan yang sedang berlangsung.
theological_decisions:
- issue: Makna κύριε dalam sapaan Saulus sebelum pembicara menyatakan identitas-Nya
  choice: Tuhan
  alternative: Tuan
  rationale: Sapaan Yunani ini dapat menyatakan penghormatan biasa maupun pengakuan akan otoritas ilahi. “Tuhan” sesuai dengan konteks pewahyuan dan identifikasi pembicara sebagai Yesus, tetapi catatan kaki mempertahankan ambiguitas bahwa Saulus mungkin mula-mula bermaksud “Tuan”.
- issue: Hubungan antara penganiayaan terhadap para pengikut Yesus dan penganiayaan terhadap Yesus sendiri
  choice: yang engkau aniaya
  alternative: yang sedang engkau aniaya
  rationale: Terjemahan mempertahankan pernyataan langsung teks bahwa Yesus sendiri menjadi sasaran tindakan Saulus, tanpa menjelaskan atau mereduksi ketegangan teologis itu. Aspek berlangsung sudah cukup tersirat oleh konteks dan verba “aniaya”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Engkau” digunakan sebagai gaya penghormatan dalam sapaan kepada Tuhan. “Dia menjawab” dipilih untuk memperjelas pergantian pembicara secara idiomatis.
