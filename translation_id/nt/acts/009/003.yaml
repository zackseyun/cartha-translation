id: ACT.9.3
reference: Acts 9:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: id
  text: Ketika ia sedang dalam perjalanan dan mendekati Damsyik, tiba-tiba cahaya dari surga[a] memancar mengelilinginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari langit.” Kata Yunani οὐρανός dapat berarti “surga” atau “langit”, tetapi dalam konteks ini “surga” kemungkinan menunjukkan sumber ilahi dari cahaya itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Ketika ia sedang dalam perjalanan
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan tindakan yang berlangsung bersamaan. Bentuk ini diterjemahkan secara alami tanpa menambahkan kata penghubung temporal yang tidak eksplisit.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν
  choice: dan mendekati
  rationale: Dalam susunan ini ἐγένετο berfungsi sebagai penanda naratif khas Lukas. Bahasa Indonesia yang alami menyampaikan isinya langsung dalam klausa yang sedang berlangsung; menerjemahkannya secara harfiah sebagai 'terjadilah bahwa' akan terasa kaku.
- source_word: τῇ Δαμασκῷ
  choice: Damsyik
  rationale: Nama tempat ini memakai bentuk Indonesia yang lazim dalam tradisi Alkitab. Dativanya menandai tempat yang sedang didekati, bukan bahwa ia telah memasuki kota.
- source_word: ἐξαίφνης τε
  choice: tiba-tiba
  rationale: Kata ini menyampaikan kemunculan yang mendadak; hubungan ringan yang dinyatakan τε sudah terbawa oleh alur kalimat Indonesia.
- source_word: περιήστραψεν
  choice: memancar mengelilinginya
  rationale: Kata kerja majemuk ini menggambarkan cahaya yang memancar atau bersinar di sekeliling seseorang. Pilihan ini mempertahankan sifat mendadak sekaligus efek yang meliputi dirinya.
- source_word: φῶς
  choice: cahaya
  rationale: Bahasa Indonesia tidak memerlukan kata sandang tak tentu untuk nomina ini; 'cahaya' merupakan padanan yang alami dan tidak menambahkan bentuk atau ukuran tertentu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks pewahyuan di Lukas–Kisah Para Rasul, οὐρανός paling mungkin menunjuk kepada surga sebagai sumber ilahi, meskipun secara leksikal dapat juga berarti langit.
theological_decisions:
- issue: Makna οὐρανός dalam konteks pewahyuan
  choice: dari surga
  alternative: dari langit
  rationale: Konteks perjumpaan ilahi mendukung arti 'surga', tetapi alternatif leksikal 'langit' tetap dicatat agar ambiguitas asli tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan tindakan yang sedang berlangsung, kedekatan dengan Damsyik, kemunculan mendadak, dan cahaya yang mengelilingi Saulus.
