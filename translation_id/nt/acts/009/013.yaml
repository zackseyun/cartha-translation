id: ACT.9.13
reference: Acts 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: id
  text: Namun, Ananias menjawab, “Tuhan, aku telah mendengar dari banyak orang tentang orang ini, betapa banyak kejahatan yang telah dilakukannya terhadap orang-orang kudus-Mu di Yerusalem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Namun, Ananias menjawab
  rationale: δέ menandai peralihan yang agak berlawanan karena Ananias menyampaikan keberatannya; “menjawab” mencerminkan ἀποκρίνομαι secara langsung.
- source_word: Κύριε
  choice: Tuhan
  rationale: Dalam konteks ini Ananias berbicara langsung kepada Yesus yang bangkit dalam penglihatan; “Tuhan” mempertahankan sapaan hormat sekaligus bobot teologisnya.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: aku telah mendengar dari banyak orang
  rationale: Bentuk lampau Yunani menyatakan informasi yang telah diterima dan tetap relevan; “banyak orang” membuat unsur tersirat dari bentuk maskulin jamak πολλῶν jelas secara alami dalam bahasa Indonesia.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: tentang orang ini
  rationale: Terjemahan alami dari περί dengan genitif; “orang ini” mempertahankan daya tunjuk τούτου tanpa menjadikan ἀνήρ sebagai penegasan gender yang tidak diperlukan dalam konteks.
- source_word: ὅσα κακὰ
  choice: betapa banyak kejahatan
  rationale: Ungkapan ini mempertahankan penekanan pada besarnya atau banyaknya perbuatan jahat, sambil tetap alami dalam bahasa Indonesia.
- source_word: τοῖς ἁγίοις σου
  choice: terhadap orang-orang kudus-Mu
  rationale: “Orang-orang kudus” mempertahankan istilah Perjanjian Baru bagi umat percaya, dan “-Mu” mempertahankan hubungan mereka dengan Tuhan.
- source_word: ἐποίησεν
  choice: yang telah dilakukannya
  rationale: “Melakukan” merupakan padanan luas dan langsung bagi ποιέω; bentuk “telah” menonjolkan relevansi perbuatan lampau itu bagi keberatan Ananias sekarang.
- source_word: ἐν Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Padanan lokatif baku dan langsung.
theological_decisions:
- issue: Acuan dan daya sapaan Κύριε
  choice: Sapaan langsung kepada Yesus sebagai “Tuhan”
  alternative: “Tuan” sebagai sapaan hormat semata
  rationale: Konteks langsung menunjukkan bahwa Ananias sedang menanggapi Yesus yang bangkit dalam penglihatan. “Tuhan” sesuai dengan konteks naratif tanpa menambahkan rumusan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan keberatan Ananias, penekanan kuantitatif ὅσα κακά, dan istilah teologis “orang-orang kudus”.
