  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: id
  text: Pada suatu ketika, dalam perjalanannya mengunjungi semua tempat itu, Petrus juga turun menemui orang-orang kudus yang tinggal di Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: berkeliling ke semua tempat itu
  rationale: Secara harfiah ungkapan ini berarti ‘melintasi semuanya’; dalam konteks perjalanan Petrus mengunjungi komunitas-komunitas, ‘semua tempat itu’ mempertahankan ketidakjelasan rujukan πάντων sambil terdengar alami dalam bahasa Indonesia.
- source_word: κατελθεῖν
  choice: pergi
  rationale: Kata ini dapat berarti ‘turun’ atau lebih umum ‘pergi/mendatangi’. Karena arah geografis atau penurunan ketinggian tidak menjadi fokus yang jelas dalam ayat ini, ‘pergi’ menyampaikan gerak menuju Lida tanpa kesan topografis yang dipaksakan.
- source_word: τοὺς ἁγίους
  choice: orang-orang kudus
  rationale: Istilah ini merupakan sebutan bagi umat percaya; padanan tradisional dan transparan ‘orang-orang kudus’ menjaga istilah teologis sumber tanpa menggantinya dengan tafsiran seperti ‘orang percaya’.
- source_word: Λύδδα
  choice: Lida
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia dan dekat dengan pelafalan Yunani.
theological_decisions:
- issue: Makna ‘orang-orang kudus’
  choice: Mempertahankan sebutan ‘orang-orang kudus’ bagi komunitas umat percaya di Lida.
  alternative: orang-orang percaya / umat Allah
  rationale: Teks Yunani memakai ἅγιοι. Terjemahan langsung mempertahankan kategori teologis Lukas tanpa mempersempit atau menjelaskan identitas mereka secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan ‘Ketika ...’ menyampaikan konstruksi Ἐγένετο δὲ ... tanpa menerjemahkan formula wacana itu secara kaku sebagai ‘terjadilah’. Pronomina ‘ia’ menghindari pengulangan nama, sedangkan ‘juga’ mempertahankan καί.
