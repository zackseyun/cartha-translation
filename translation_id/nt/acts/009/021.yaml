- from: Semua orang yang mendengarnya tercengang dan berkata, “Bukankah dia ini orang yang di Yerusalem membinasakan mereka yang berseru kepada nama ini?[a] Bukankah dia datang ke sini untuk tujuan itu, yaitu membawa mereka dalam keadaan terikat kepada imam-imam kepala?”
  to: Semua orang yang mendengarnya tercengang dan terus berkata, “Bukankah dia ini orang yang di Yerusalem menghancurkan mereka yang berseru kepada nama ini?[a] Bukankah dia datang ke sini untuk tujuan itu, untuk membawa mereka dalam keadaan terikat kepada imam-imam kepala?”
  rationale: Revisi mempertahankan pertanyaan retoris, ‘nama ini’, dan kekuatan tindakan Saulus, sambil mencerminkan aspek imperfek pada ujaran para pendengar dan menyatakan tujuan kedatangannya secara lebih langsung. Catatan kaki tetap membantu pembaca memahami idiom tanpa menjadikan penjelasan interpretatifnya mutlak.
