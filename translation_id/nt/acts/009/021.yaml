id: ACT.9.21
reference: Acts 9:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: id
  text: Semua orang yang mendengarnya tercengang dan terus berkata, “Bukankah dia ini orang yang di Yerusalem menghancurkan mereka yang berseru kepada nama ini?[a] Bukankah dia datang ke sini untuk tujuan itu, untuk membawa mereka dalam keadaan terikat kepada imam-imam kepala?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “berseru kepada nama ini” dapat berarti memohon kepada atau mengakui nama Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: tercengang
  rationale: Mengungkapkan keadaan takjub yang kuat dan berkelanjutan secara alami dalam bahasa Indonesia.
- source_word: πάντες οἱ ἀκούοντες
  choice: semua orang yang mendengarnya
  rationale: Partisip substantival menunjuk kepada semua orang yang mendengar Saulus; objek tersirat dinyatakan dengan akhiran -nya agar alami.
- source_word: πορθήσας
  choice: membinasakan
  rationale: Mempertahankan kekuatan verba yang menggambarkan tindakan merusak atau menghancurkan, bukan sekadar penganiayaan umum.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: mereka yang berseru kepada nama ini
  rationale: Mempertahankan idiom biblis tentang memohon kepada atau mengakui nama Yesus tanpa memperjelas rujukannya secara berlebihan.
- source_word: εἰς τοῦτο
  choice: untuk tujuan itu
  rationale: Menyampaikan maksud atau tujuan kedatangannya dengan jelas.
- source_word: ἐληλύθει
  choice: datang
  rationale: Dalam pertanyaan retoris bahasa Indonesia, bentuk ini alami; konteks sudah menunjukkan bahwa kedatangannya terjadi sebelumnya.
- source_word: δεδεμένους
  choice: dalam keadaan terikat
  rationale: Menjaga nuansa partisip perfek pasif, yakni mereka dibawa dalam keadaan sudah terikat, tanpa menentukan alat pengikatnya.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: membawa ... kepada imam-imam kepala
  rationale: Menyampaikan gerak menuju otoritas imam kepala tanpa memaksakan nuansa yudisial 'menghadap' yang tidak harus tersurat.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah historis untuk kelompok pemimpin keimaman, bukan beberapa orang yang sekaligus menjabat sebagai imam besar.
theological_decisions:
- issue: Apakah τὸ ὄνομα τοῦτο perlu diperluas menjadi 'nama Yesus'
  choice: Mempertahankan 'nama ini'
  alternative: '''nama Yesus'''
  rationale: Bahasa Yunani membiarkan rujukannya tersirat. Bentuk demonstratif mempertahankan daya retoris dan ambiguitas asli, sedangkan konteks menjelaskan bahwa yang dimaksud ialah Yesus.
- issue: Kekuatan πορθήσας dalam menggambarkan tindakan Saulus
  choice: '''membinasakan'''
  alternative: '''menganiaya'''
  rationale: Verba sumber lebih keras daripada istilah umum untuk menganiaya dan menggambarkan penghancuran hebat; terjemahan tidak boleh melunakkan kekerasannya.
- issue: Bentuk klausa kedua sebagai pertanyaan retoris
  choice: Menerjemahkan sebagai 'Bukankah dia datang ...?'
  alternative: 'Pernyataan: ''Dia datang ...'''
  rationale: Tanda tanya dan susunan keseluruhan paling wajar dipahami sebagai pertanyaan retoris yang berlanjut, sejalan dengan keterkejutan para pendengar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan retoris, kekuatan verba, atau ungkapan khas teks sumber.
