id: ACT.9.17
reference: Acts 9:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: id
  text: Lalu Ananias pergi dan masuk ke rumah itu. Ia menumpangkan kedua tangannya ke atas Saulus dan berkata, “Saulus, saudaraku, Tuhan telah mengutus aku—Yesus, yang menampakkan diri kepadamu di jalan yang sedang kaulalui[a]—supaya engkau dapat melihat kembali[b] dan dipenuhi Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di jalan yang sedang kautempuh.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memperoleh kembali penglihatanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Lalu Ananias pergi
  rationale: δέ melanjutkan alur narasi, dan ἀπῆλθεν di sini secara wajar berarti ‘pergi’; ‘lalu’ menghasilkan narasi Indonesia yang alami tanpa melebihkan nuansa keberangkatan.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: masuk ke rumah itu
  rationale: Ungkapan ini mempertahankan gerak masuk dan artikel tertentu τὴν secara alami.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: Ia menumpangkan tangannya ke atas Saulus
  rationale: ‘Menumpangkan tangan’ merupakan ungkapan Indonesia yang mapan bagi tindakan fisik ini; nama Saulus menghindari ambiguitas pronomina.
- source_word: Σαοὺλ ἀδελφέ
  choice: Saulus, saudaraku
  rationale: Vokatif ἀδελφέ menyatakan sapaan langsung dan penerimaan yang hangat. ‘Saudaraku’ lebih alami sebagai sapaan Indonesia daripada ‘Saudara Saulus’.
- source_word: ἀπέσταλκέν με
  choice: telah mengutus aku
  rationale: Bentuk perfektum menyatakan pengutusan yang hasil atau relevansinya masih berlaku pada saat Ananias berbicara.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Yesus, Dia yang menampakkan diri kepadamu
  rationale: Apositif ‘Yesus’ mengidentifikasi ‘Tuhan’, sedangkan partisip articular dipertahankan sebagai ungkapan identifikasi tersendiri. ‘Menampakkan diri’ menyampaikan makna pasif idiomatis ὀφθείς.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: di jalan yang sedang kaulalui
  rationale: ὁδός adalah jalan harfiah, dan bentuk imperfektum ἤρχου menggambarkan perjalanan yang sedang berlangsung. Rumusan ini alami dalam bahasa Indonesia sambil mempertahankan aspek duratif.
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀναβλέψῃς
  choice: engkau dapat melihat kembali
  rationale: Dalam konteks kebutaan dan penyembuhan, kata ini berarti pulihnya penglihatan; rumusan tersebut juga tetap dekat dengan unsur ‘kembali’ dalam verba.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: dipenuhi dengan Roh Kudus
  rationale: Bentuk pasif dipertahankan, dan ‘Roh Kudus’ merupakan sebutan alami bagi πνεῦμα ἅγιον dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan ‘Tuhan’ dan ‘Yesus’ dalam ὁ κύριος ἀπέσταλκέν με, Ἰησοῦς ὁ ὀφθείς σοι
  choice: Tuhan telah mengutus aku—Yesus, Dia yang menampakkan diri kepadamu ...—
  alternative: Tuhan Yesus, yang menampakkan diri kepadamu ..., telah mengutus aku
  rationale: Susunan dengan tanda pisah mempertahankan urutan dan struktur apositif Yunani, sehingga ‘Yesus’ mengidentifikasi ‘Tuhan’ tanpa merapikan ketegangan sintaksis teks menjadi struktur yang lebih eksplisit.
- issue: πνεύματος ἁγίου tanpa artikel Yunani
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Dalam konteks Kisah Para Rasul, frasa ini merujuk kepada Roh ilahi. Bahasa Indonesia tidak memerlukan artikel tertentu, dan kapitalisasi menandai rujukan tersebut tanpa menambahkan kata yang tidak ada.
- issue: Nuansa ἀδελφέ dalam sapaan Ananias kepada Saulus
  choice: Saulus, saudaraku
  alternative: Saudara Saulus
  rationale: Pilihan ini mempertahankan kehangatan dan penerimaan dalam sapaan tersebut tanpa menetapkan secara sempit apakah dasar persaudaraannya terutama etnis atau iman.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Dialog memakai ‘engkau/kaulalui’ untuk sapaan tunggal yang sesuai dengan register Alkitab Indonesia tanpa menjadi arkais. Tanda pisah mempertahankan aposisi Yunani dan ambiguitas sintaksis yang asli.
