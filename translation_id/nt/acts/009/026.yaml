id: ACT.9.26
reference: Acts 9:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: id
  text: Setibanya di Yerusalem, Saulus berusaha bergabung dengan murid-murid[a], tetapi mereka semua takut kepadanya karena tidak percaya bahwa ia adalah seorang murid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melekatkan diri kepada murid-murid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενόμενος δὲ εἰς Ἰερουσαλήμ
  choice: Setibanya di Yerusalem
  rationale: Partisip aoris Παραγενόμενος menyatakan keadaan waktu yang mendahului tindakan utama; bentuk 'setibanya' alami dan ringkas dalam bahasa Indonesia. δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu dinyatakan secara tersendiri.
- source_word: ἐπείραζεν
  choice: berusaha
  rationale: Bentuk imperfek menunjukkan usaha yang sedang atau berulang dilakukan, bukan makna 'mencobai'.
- source_word: κολλᾶσθαι τοῖς μαθηταῖς
  choice: bergabung dengan murid-murid
  rationale: κολλάομαι mengandung gagasan melekat atau menggabungkan diri. Dalam konteks sosial ini, 'bergabung dengan' menyampaikan usaha Saulus untuk diterima dalam persekutuan para murid tanpa menyiratkan prosedur keanggotaan formal.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: tetapi mereka semua takut kepadanya
  rationale: καί memperkenalkan perkembangan yang secara konteks berlawanan dengan usaha Saulus; 'tetapi' menyatakan hubungan itu secara alami. Kata ganti 'mereka' merujuk kepada murid-murid.
- source_word: μὴ πιστεύοντες
  choice: karena tidak percaya
  rationale: Partisip kini dengan μή menerangkan alasan mereka takut. Klausa sebab lebih alami dan jelas dalam bahasa Indonesia daripada konstruksi partisipial yang kaku.
- source_word: ὅτι ἐστὶν μαθητής
  choice: bahwa ia adalah seorang murid
  rationale: Bentuk kini ἐστίν dipertahankan secara semantis dengan 'adalah'; bahasa Indonesia tidak menuntut pergeseran kala dalam wacana tidak langsung.
- source_word: μαθητής
  choice: murid
  rationale: '''Murid'' adalah padanan baku dan tepat untuk μαθητής sebagai pengikut sekaligus orang yang belajar.'
theological_decisions:
- issue: Sifat hubungan yang hendak dijalin Saulus dengan orang-orang percaya di Yerusalem
  choice: bergabung dengan murid-murid
  alternative: melekatkan diri kepada murid-murid
  rationale: Ungkapan ini mempertahankan makna sosial dan komunal κολλᾶσθαι tanpa memasukkan gagasan tentang ritus atau status keanggotaan gerejawi formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Saulus' dinyatakan untuk memperjelas subjek yang tersirat dalam bahasa Yunani berdasarkan konteks langsung. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
