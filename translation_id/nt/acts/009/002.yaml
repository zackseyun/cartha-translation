source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: id
  text: Ia meminta surat-surat kepadanya untuk sinagoge-sinagoge di Damsyik, supaya jika ia menemukan orang-orang yang termasuk Jalan itu[a], baik laki-laki maupun perempuan, ia dapat membawa mereka dalam keadaan terikat ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari Jalan itu” atau “pengikut Jalan itu”. Dalam bahasa Yunani, “Jalan itu” merupakan sebutan awal bagi gerakan para pengikut Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: Ia meminta kepadanya
  rationale: Ungkapan ini menyatakan permintaan kepada seseorang; bentuk Indonesia ini alami dan tetap mempertahankan sumber permintaan yang dinyatakan oleh παρά dengan genitif.
- source_word: ἐπιστολὰς
  choice: surat-surat
  rationale: Bentuk jamak Yunani berarti surat-surat; konteks menyiratkan kewenangan, tetapi unsur itu tidak ditambahkan ke dalam teks utama.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: untuk rumah-rumah ibadat di Damsyik
  rationale: Kedua frasa preposisional menunjuk surat yang ditujukan kepada sinagoge-sinagoge yang berada di Damsyik. 'Rumah ibadat' adalah padanan Indonesia yang umum dan mudah dipahami.
- source_word: ὅπως ἐάν
  choice: supaya jika
  rationale: Padanan ini mempertahankan sekaligus tujuan yang dinyatakan ὅπως dan sifat bersyarat dari ἐάν dengan subjungtif.
- source_word: τινας
  choice: siapa pun
  rationale: Dalam klausa bersyarat, kata ganti tak tentu jamak ini secara alami berarti siapa pun yang mungkin ditemukan.
- source_word: τῆς ὁδοῦ ὄντας
  choice: yang termasuk Jalan Tuhan
  rationale: Ungkapan genitif ini menunjukkan keterkaitan dengan gerakan yang dikenal sebagai 'Jalan'. Penambahan 'Tuhan' membuat sebutan itu lebih jelas dalam bahasa Indonesia, sementara catatan kaki memberi bentuk yang lebih harfiah.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: baik laki-laki maupun perempuan
  rationale: Konstruksi τε καὶ secara tegas mencakup kedua kelompok dan dipertahankan tanpa digeneralisasi menjadi 'orang-orang'.
- source_word: δεδεμένους
  choice: dalam keadaan terikat
  rationale: Partisipel perfek pasif menyatakan keadaan sebagai orang yang telah diikat; terjemahan ini tidak mempersempitnya menjadi jenis belenggu tertentu.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: ia dapat membawa mereka ... ke Yerusalem
  rationale: Subjungtif dalam klausa tujuan menyatakan tindakan yang dimaksudkan atau dimungkinkan; 'membawa ... ke' wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Terjemahan sebutan τῆς ὁδοῦ
  choice: Jalan Tuhan
  alternative: Jalan; pengikut Jalan itu
  rationale: Frasa Yunani berfungsi sebagai sebutan awal bagi gerakan Kristen. Teks utama memakai bentuk yang jelas dan alami bagi pembaca Indonesia, sedangkan catatan mempertahankan bentuk harfiah dan menjelaskan fungsi historisnya.
- issue: Penyebutan eksplisit ἄνδρας τε καὶ γυναῖκας
  choice: baik laki-laki maupun perempuan
  alternative: orang-orang
  rationale: Teks Yunani menekankan bahwa sasaran penangkapan mencakup laki-laki dan perempuan; kekhususan ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur tujuan dan syarat dalam bahasa Yunani tanpa menjadi kaku; istilah historis dijelaskan melalui catatan kaki.
