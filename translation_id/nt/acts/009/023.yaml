  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: id
  text: Setelah waktu yang cukup lama berlalu[b], orang-orang Yahudi[a] bersekongkol[c] untuk membunuh Saulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang Yahudi.” Dalam konteks ini, yang dimaksud ialah kelompok tertentu yang menentang Saulus, bukan semua orang Yahudi tanpa kecuali.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “ketika hari-hari yang cukup banyak digenapi” atau “diselesaikan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “berunding bersama.” Dalam konteks ini, perundingan itu bertujuan membunuh Saulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Setelah
  rationale: Dalam konteks peralihan waktu ini, konstruksi tersebut secara alami memperkenalkan peristiwa sesudah suatu rentang waktu; unsur δέ tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: ἐπληροῦντο ἡμέραι ἱκαναί
  choice: waktu yang cukup lama berlalu
  rationale: Ungkapan Yunani secara harfiah berbicara tentang 'hari-hari yang banyak/cukup' yang dipenuhi atau diselesaikan. Pilihan ini menyampaikan rentang waktu yang cukup panjang secara alami tanpa memberi kesan menghitung hari secara harfiah.
- source_word: συνεβουλεύσαντο
  choice: bersekongkol
  rationale: Verba ini menunjukkan perundingan bersama yang dalam konteksnya bertujuan jahat. 'Bersekongkol' merangkum unsur perencanaan bersama dan maksud tersembunyi.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan etnoreligius yang dinyatakan teks tanpa mempersempitnya menjadi para pemimpin atau mengalihkannya menjadi orang Yudea. Catatan kaki mencegah generalisasi kepada semua orang Yahudi.
- source_word: ἀνελεῖν
  choice: untuk membunuh
  rationale: Dalam konteks ini verba tersebut berarti menghilangkan nyawa. 'Membunuh' lugas dan tidak menambahkan nuansa hukum yang tidak dinyatakan secara eksplisit.
- source_word: αὐτόν
  choice: Saulus
  rationale: Pronomina Yunani merujuk kepada Saulus. Pengulangan nama membuat rujukan jelas dan alami dalam ayat yang berdiri sendiri.
theological_decisions:
- issue: Cakupan οἱ Ἰουδαῖοι dalam narasi yang bermusuhan
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks tidak secara eksplisit membatasi pelakunya pada para pemimpin. Terjemahan mempertahankan bentuk sumber, sedangkan catatan menjelaskan bahwa konteks menunjuk kepada kelompok tertentu yang menentang Saulus, bukan seluruh orang Yahudi tanpa kecuali.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara alternatif yang mencerminkan bentuk Yunani dicatat dalam catatan kaki.
