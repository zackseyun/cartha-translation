base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: id
  text: Lalu Petrus tinggal di Yope selama berhari-hari bersama seorang bernama Simon,[a] seorang penyamak kulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di rumah seorang bernama Simon.” Kata depan Yunani yang dipakai dapat menunjukkan bahwa Petrus tinggal di rumah Simon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Petrus tinggal
  rationale: Konstruksi ἐγένετο dengan infinitif merupakan idiom naratif. Dalam bahasa Indonesia alami, maknanya disampaikan dengan menjadikan tindakan 'tinggal' sebagai predikat utama. Subjek Petrus diperjelas dari konteks ayat sebelumnya agar kalimat berdiri alami.
- source_word: δὲ
  choice: Lalu
  rationale: δέ adalah penghubung ringan yang melanjutkan alur cerita; 'lalu' menyatakan perkembangan narasi tanpa memberi kesan pertentangan.
- source_word: ἡμέρας ἱκανὰς
  choice: cukup lama
  rationale: Secara harfiah ungkapan ini berarti 'hari-hari yang cukup banyak'. 'Cukup lama' menyampaikan durasi yang lumayan panjang secara wajar dalam bahasa Indonesia.
- source_word: ἐν Ἰόππῃ
  choice: di Yope
  rationale: Nama tempat Ἰόππη memakai bentuk Indonesia yang telah lazim dalam tradisi penerjemahan Alkitab, yaitu 'Yope'.
- source_word: παρά τινι Σίμωνι
  choice: bersama seorang bernama Simon
  rationale: παρά dengan datif dapat menunjukkan tinggal bersama seseorang atau di rumahnya, sedangkan τινι memperkenalkan tokoh yang belum dikenal. Ungkapan ini alami dan tetap mempertahankan ketidakspesifikan tersebut.
- source_word: βυρσεῖ
  choice: seorang penyamak kulit
  rationale: βυρσεύς secara khusus menunjuk orang yang mengolah kulit mentah dengan penyamakan, bukan sekadar pengrajin barang kulit.
