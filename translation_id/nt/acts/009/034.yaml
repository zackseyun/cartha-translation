id: ACT.9.34
reference: Acts 9:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: id
  text: Lalu Petrus berkata kepadanya, “Eneas, Yesus Sang Mesias menyembuhkanmu. Bangunlah dan siapkanlah tempat tidurmu sendiri.” Seketika itu juga ia bangun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: menyembuhkan
  rationale: Bentuk kini ἰάομαι dipertahankan sebagai pernyataan langsung yang menyatakan tindakan penyembuhan Yesus, tanpa mengubahnya menjadi aspek progresif atau hasil sempurna.
- source_word: Χριστός
  choice: Sang Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi Yesus. “Sang Mesias” menyampaikan makna gelarnya secara wajar dan hormat dalam bahasa Indonesia.
- source_word: ἀνάστηθι
  choice: Bangunlah
  rationale: Perintah ini ditujukan kepada orang yang terbaring; “Bangunlah” alami dalam bahasa Indonesia dan sesuai dengan tindakan yang kemudian dilakukan Eneas.
- source_word: στρῶσον σεαυτῷ
  choice: rapikanlah tempat tidurmu sendiri
  rationale: στρώννυμι dalam konteks ini menunjuk pada menata atau membereskan alas tidur, sedangkan σεαυτῷ menekankan bahwa Eneas kini mampu melakukannya sendiri.
- source_word: εὐθέως
  choice: Seketika itu juga
  rationale: Ungkapan ini menyampaikan tindakan tanpa jeda dan mempertahankan penekanan Lukas pada hasil penyembuhan yang langsung.
- source_word: ἀνέστη
  choice: ia bangun
  rationale: Terjemahan ini menggemakan perintah “Bangunlah” dan secara alami menceritakan tanggapan Eneas.
- source_word: Αἰνέα
  choice: Eneas
  rationale: Nama Yunani Αἰνέας ditransliterasikan dalam bentuk Indonesia yang lazim, “Eneas”.
theological_decisions:
- issue: Pemaknaan Χριστός dalam pernyataan penyembuhan
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Konteks memungkinkan Χριστός dipahami sebagai gelar. “Sang Mesias” mempertahankan isi gelar tersebut, sedangkan “Kristus” juga merupakan padanan tradisional yang sah.
- issue: Waktu tindakan penyembuhan dalam ἰᾶταί
  choice: menyembuhkan engkau
  alternative: telah menyembuhkan engkau
  rationale: Teks Yunani memakai bentuk kini. Terjemahan kini mempertahankan bentuk itu dan daya pernyataan langsungnya tanpa menentukan bahwa penyembuhan harus dipahami sebagai tindakan yang sudah selesai sebelum Petrus berbicara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Partikel “-lah” mempertahankan daya imperatif tanpa terdengar kasar. “Tempat tidur” dipilih sebagai ungkapan umum; “sendiri” mempertahankan penekanan σεαυτῷ pada kemampuan Eneas yang telah dipulihkan.
