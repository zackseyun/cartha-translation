  source_fidelity: 'Terjemahan mengikuti struktur dan isi ayat dengan baik: Petrus berbicara kepada Eneas, Yesus disebut Sang Mesias sebagai pelaku penyembuhan, perintah untuk bangun dan menyiapkan alas tidur disusul tindakan Eneas yang segera. Namun, “rapikanlah” mempersempit στρῶσον menjadi tindakan membereskan atau merapikan, sedangkan verba Yunani terutama berarti membentangkan atau menyiapkan tempat tidur/alas tidur.'
  naturalness: “Menyembuhkanmu” lebih wajar dalam bahasa Indonesia baku modern daripada “menyembuhkan engkau” dalam dialog langsung, sambil tetap mempertahankan bentuk kini dan daya performatif pernyataan Petrus. “Siapkanlah tempat tidurmu sendiri” jelas dan idiomatis dalam konteks ini.
  terminology: “Eneas” merupakan bentuk nama yang lazim dalam bahasa Indonesia. “Yesus Sang Mesias” dengan tepat mempertahankan Χριστός sebagai gelar, selaras dengan jejak audit Inggris. “Seketika itu juga” menyampaikan εὐθέως secara baik.
