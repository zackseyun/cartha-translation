  to: Di Yope ada seorang murid perempuan bernama Tabita[a], yang jika diterjemahkan disebut Dorkas. Ia penuh dengan perbuatan baik dan sedekah yang terus dilakukannya.
  rationale: Revisi memperbaiki hubungan gramatikal antara Tabita dan Dorkas, menghilangkan penerima sedekah yang tidak disebutkan dalam teks Yunani, serta menyatakan kepenuhan karakter dan kebiasaan berbuat baik tanpa mengubah makna.
