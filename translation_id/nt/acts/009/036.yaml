  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: id
  text: Di Yope ada seorang murid perempuan bernama Tabita[a], yang jika diterjemahkan disebut Dorkas. Ia penuh dengan perbuatan baik dan sedekah yang terus dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorkas adalah padanan Yunani untuk nama Tabita; kedua nama itu berarti “kijang”.
    reason: Menjelaskan hubungan penerjemahan antara nama Aram Tabita dan padanan Yunaninya, Dorkas, serta arti leksikal keduanya.
lexical_decisions:
- source_word: Ἐν Ἰόππῃ
  choice: Di Yope
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan frasa lokatif sumber.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai perkembangan narasi; dalam bahasa Indonesia modern, kesinambungan konteks sudah cukup jelas tanpa kata penghubung tambahan.
- source_word: μαθήτρια
  choice: murid perempuan
  rationale: Nomina Yunani ini secara eksplisit berbentuk feminin. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penandaan gender yang khas dalam sumber.
- source_word: ὀνόματι Ταβιθά
  choice: bernama Tabita
  rationale: Ini adalah padanan idiomatis dan langsung bagi ungkapan datif yang memperkenalkan nama seseorang.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: Jika diterjemahkan, namanya adalah Dorkas
  rationale: Mempertahankan keterangan bahwa Tabita memiliki padanan nama dalam bahasa Yunani, bukan sekadar menerangkan arti katanya.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: banyak melakukan perbuatan baik
  rationale: Secara idiomatis menyampaikan bahwa hidupnya penuh dengan perbuatan baik, sambil menghindari ungkapan Indonesia yang kaku.
- source_word: ἐλεημοσυνῶν ὧν ἐποίει
  choice: memberi sedekah kepada orang-orang yang membutuhkan
  rationale: ἐλεημοσύνη dalam konteks ini menunjuk pada pemberian untuk menolong orang miskin atau berkekurangan; bentuk verbal Indonesia menyampaikan praktik yang terus dilakukan, sesuai aspek imperfek ἐποίει.
theological_decisions:
- issue: Penandaan feminin pada μαθήτρια
  choice: murid perempuan
  alternative: murid
  rationale: Sumber memakai bentuk feminin yang sangat jarang dan secara eksplisit menyebut Tabita sebagai murid perempuan. Pilihan ini mempertahankan informasi itu tanpa menambahkan jabatan gerejawi tertentu.
- issue: Cakupan makna ἐλεημοσυνῶν
  choice: memberi sedekah kepada orang-orang yang membutuhkan
  alternative: melakukan tindakan belas kasihan
  rationale: Istilah Yunani dapat berhubungan dengan belas kasihan secara luas, tetapi dalam pemakaian Perjanjian Baru lazim menunjuk pada pemberian bagi mereka yang membutuhkan. Penyebutan penerima memperjelas makna sedekah dalam bahasa Indonesia modern tanpa membatasinya hanya pada uang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat disusun secara alami bagi pembaca umum, dengan penandaan feminin sumber dipertahankan dan aspek kebiasaan diwujudkan melalui ungkapan “banyak melakukan” serta tindakan memberi.
