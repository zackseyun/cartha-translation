review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada lokasi, identitas Tabita sebagai murid perempuan, dan dua bidang tindakannya. Namun, “Jika diterjemahkan, namanya adalah Dorkas” kurang tepat dan kurang alami untuk διερμηνευομένη λέγεται Δορκάς, yang menyatakan bahwa Tabita, bila diterjemahkan, disebut Dorkas. Tambahan eksplisit “kepada orang-orang yang membutuhkan” menafsirkan implikasi sedekah, tetapi tidak dinyatakan dalam ayat ini.
  naturalness: “Murid perempuan bernama Tabita” dan “Di Yope ada” adalah bahasa Indonesia baku dan jelas. Perumusan klausa tentang Dorkas perlu diperbaiki menjadi konstruksi relatif yang lebih alami. “Penuh dengan perbuatan baik dan sedekah yang terus dilakukannya” mempertahankan idiom sumber dan nuansa tindakan yang berkelanjutan.
  terminology: “Yope,” “Tabita,” dan “Dorkas” sesuai penggunaan Alkitab bahasa Indonesia. “Sedekah” merupakan padanan yang wajar untuk ἐλεημοσύναι tanpa menambahkan penerima tertentu. Catatan kaki sebaiknya menyebut “kijang” sebagai padanan leksikal yang lazim untuk nama-nama tersebut.
  issues:
  - severity: medium
    issue: Klausa “Jika diterjemahkan, namanya adalah Dorkas” tidak secara tepat mengikuti konstruksi sumber.
    rationale: διερμηνευομένη λέγεται Δορκάς berarti kira-kira “yang, jika diterjemahkan, disebut Dorkas,” bukan sekadar pernyataan bahwa namanya adalah Dorkas.
  - severity: low
    issue: Frasa “kepada orang-orang yang membutuhkan” menambahkan unsur yang tidak tersurat.
    rationale: ἐλεημοσύναι memang lazim berkaitan dengan pemberian bagi orang berkekurangan, tetapi ayat ini tidak menyebut penerimanya; terjemahan utama sebaiknya tidak mempersempit atau menambah rincian itu.
  - severity: low
    issue: Nuansa penuh dan kebiasaan tindakan dapat dinyatakan lebih dekat dengan sumber.
    rationale: πλήρης dan imperfek ἐποίει lebih langsung tercermin melalui “penuh dengan” dan “yang terus dilakukannya.”
  revised_text: Di Yope ada seorang murid perempuan bernama Tabita[a], yang jika diterjemahkan disebut Dorkas. Ia penuh dengan perbuatan baik dan sedekah yang terus dilakukannya.
  revised_footnotes:
  - marker: a
    text: Dorkas adalah padanan Yunani untuk nama Tabita; kedua nama itu berarti “kijang”.
    reason: Menjelaskan hubungan penerjemahan antara nama Aram Tabita dan padanan Yunaninya, Dorkas, serta arti leksikal keduanya.
  revision_rationale: Revisi memperbaiki hubungan gramatikal antara Tabita dan Dorkas, menghilangkan penerima sedekah yang tidak disebutkan dalam teks Yunani, serta menyatakan kepenuhan karakter dan kebiasaan berbuat baik tanpa mengubah makna.
