  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: id
  text: Selama tiga hari ia tidak dapat melihat[a], dan ia tidak makan ataupun minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak melihat.” Ungkapan ini menunjukkan bahwa Saul tidak mampu melihat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Selama tiga hari ia
  rationale: Akusatif ἡμέρας τρεῖς menyatakan rentang waktu. 'Selama tiga hari' merupakan ungkapan Indonesia yang alami; kopula ἦν tidak perlu diterjemahkan secara tersendiri karena keadaan Saul langsung dinyatakan oleh frasa berikutnya.
- source_word: μὴ βλέπων
  choice: tidak dapat melihat
  rationale: Partisip βλέπων secara harfiah berarti 'melihat', dengan μὴ meniadakannya. 'Tidak dapat melihat' menyampaikan keadaan Saul secara jelas tanpa mengganti ungkapan sumber dengan adjektiva yang lebih kuat, 'buta'.
- source_word: οὐκ ἔφαγεν
  choice: tidak makan
  rationale: Bentuk aoris ἔφαγεν berarti 'makan'. Dalam konteks rentang tiga hari, bahasa Indonesia secara alami memakai 'tidak makan' tanpa harus menandai aspek aoris secara khusus.
- source_word: οὐδὲ ἔπιεν
  choice: ataupun minum
  rationale: οὐδὲ menghubungkan verba kedua yang juga dinegasikan. Pasangan 'tidak makan ataupun minum' alami dalam bahasa Indonesia dan mempertahankan penyangkalan terhadap kedua tindakan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan sumber: lamanya keadaan, ketidakmampuan melihat, lalu tidak makan dan tidak minum.'
