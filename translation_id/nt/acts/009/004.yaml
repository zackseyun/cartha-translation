  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: id
  text: Ia jatuh ke tanah dan mendengar suara yang berkata kepadanya, “Saulus, Saulus, mengapa kamu menganiaya aku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: jatuh ke tanah
  rationale: Partisip aoristus πεσών menyatakan tindakan yang mendahului atau menyertai tindakan utama; dalam bahasa Indonesia, rangkaian verba dengan 'dan' menyampaikan alur itu secara alami tanpa memaksakan nuansa temporal. Frasa 'ke tanah' secara idiomatis menyatakan gerak menuju permukaan tanah.
- source_word: ἤκουσεν φωνὴν
  choice: mendengar suara
  rationale: Karena suara itu menyampaikan perkataan yang dapat dipahami, φωνή paling tepat diterjemahkan 'suara', bukan sekadar 'bunyi'.
- source_word: λέγουσαν αὐτῷ
  choice: yang berkata kepadanya
  rationale: Bentuk partisip λέγουσαν menerangkan 'suara'; konstruksi relatif ini wajar dalam bahasa Indonesia dan mempertahankan sasaran ujaran melalui 'kepadanya'.
- source_word: Σαοὺλ Σαούλ
  choice: Saulus, Saulus
  rationale: Nama Σαούλ ditampilkan dengan bentuk Indonesia yang lazim dalam tradisi penerjemahan Alkitab, dan pengulangannya dipertahankan karena memberi penekanan langsung dalam sapaan.
- source_word: τί
  choice: mengapa
  rationale: Dalam konstruksi interogatif ini, τί berfungsi adverbial untuk menanyakan alasan, sehingga 'mengapa' merupakan padanan alami.
- source_word: με
  choice: Aku
  rationale: Pronomina objek orang pertama dipertahankan secara langsung. Huruf kapital mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi tanpa menambahkan penjelasan ke dalam teks.
- source_word: διώκεις
  choice: kamu menganiaya
  rationale: Dalam konteks tindakan bermusuhan Saulus terhadap para pengikut Yesus, διώκω berarti 'menganiaya'. Aspek kini yang sedang berlangsung tersampaikan secara wajar melalui konteks pertanyaan tanpa perlu menambahkan 'sedang'.
theological_decisions:
- issue: Identifikasi sang pembicara dengan orang-orang yang diserang Saulus
  choice: Mempertahankan kata langsung 'Aku' tanpa perluasan penjelas.
  alternative: Mengganti atau memperluasnya menjadi 'umat-Ku' atau 'para pengikut-Ku'.
  rationale: Teks Yunani memakai με, 'Aku', sehingga hubungan langsung antara sang pembicara dan komunitas yang dianiaya harus tetap hadir dengan ketegangan teologisnya, bukan dijelaskan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Ia' dipakai untuk narasi, sedangkan 'kamu' dipakai dalam sapaan langsung agar jelas dan wajar bagi pembaca masa kini. Tidak diperlukan catatan kaki.
