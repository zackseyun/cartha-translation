id: ACT.9.39
reference: Acts 9:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: id
  text: Lalu Petrus bangkit dan pergi bersama mereka. Ketika ia tiba, mereka membawanya naik ke ruang atas. Semua janda berdiri di dekatnya sambil menangis dan memperlihatkan baju-baju serta pakaian luar[b] yang dibuat Dorkas[a] ketika ia masih bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorkas adalah nama Yunani; dalam Kisah Para Rasul 9:36 ia juga disebut Tabita.
    reason: cross_reference
  - marker: b
    text: “Baju-baju serta pakaian luar” menerjemahkan dua istilah Yunani yang berbeda, kemungkinan untuk pakaian yang dikenakan pada tubuh dan pakaian yang dikenakan di luarnya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Partisip aoris ini memperkenalkan tindakan Petrus sebagai tanggapan terhadap permintaan para utusan; 'bangkit' alami dan tetap mempertahankan unsur gerak.
- source_word: συνῆλθεν αὐτοῖς
  choice: pergi bersama mereka
  rationale: Dalam konteks ini, ungkapan tersebut menyatakan bahwa Petrus menyertai para utusan.
- source_word: παραγενόμενον
  choice: ketika ia tiba
  rationale: Partisip ini paling wajar dipahami secara temporal, mendahului tindakan membawa Petrus ke atas.
- source_word: ἀνήγαγον
  choice: membawanya naik
  rationale: Kata kerja ini menyatakan gerakan ke atas menuju ruang di lantai atas.
- source_word: ὑπερῷον
  choice: ruang atas
  rationale: Istilah ini menunjuk pada sebuah ruangan di bagian atas atau lantai atas rumah.
- source_word: παρέστησαν αὐτῷ
  choice: berdiri di dekatnya
  rationale: Terjemahan ini menggambarkan para janda hadir mengelilingi atau berada dekat Petrus, tanpa memberi kesan presentasi resmi.
- source_word: πᾶσαι αἱ χῆραι
  choice: semua janda
  rationale: Menerjemahkan rujukan khusus kepada seluruh kelompok perempuan yang telah kehilangan suami.
- source_word: κλαίουσαι
  choice: sambil menangis
  rationale: Partisip kini menggambarkan ratapan yang sedang berlangsung.
- source_word: ἐπιδεικνύμεναι
  choice: memperlihatkan
  rationale: Kata ini menyatakan bahwa pakaian-pakaian itu ditunjukkan kepada Petrus.
- source_word: χιτῶνας
  choice: baju-baju
  rationale: χίτων adalah pakaian dasar yang dikenakan pada tubuh; 'baju' mudah dipahami pembaca Indonesia tanpa memakai istilah kuno yang asing.
- source_word: ἱμάτια
  choice: pakaian luar
  rationale: Istilah ini sering menunjuk pada pakaian yang dikenakan di bagian luar dan mempertahankan pembedaan dari χιτῶνας.
- source_word: ὅσα ἐποίει
  choice: yang dibuat
  rationale: Imperfek dapat menyiratkan kegiatan yang berlangsung atau berulang, tetapi bahasa Indonesia 'yang dibuat' mempertahankan ketidakpastian aspek tanpa menambahkan kebiasaan secara eksplisit.
- source_word: μετ’ αὐτῶν οὖσα
  choice: ketika ia masih bersama mereka
  rationale: '''Masih'' secara alami menyampaikan bahwa masa kebersamaan itu telah berakhir karena Dorkas telah meninggal.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dipecah agar adegan mudah diikuti. Nama Δορκάς ditransliterasikan sebagai 'Dorkas', bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Tidak diberikan catatan alternatif pada παρέστησαν αὐτῷ karena 'berdiri di dekatnya' cukup mempertahankan gambaran ruang tanpa perlu memasukkan nuansa formal yang kurang mungkin dalam konteks.
