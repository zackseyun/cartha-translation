source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: id
  text: Namun, rencana jahat mereka diketahui oleh Saulus. Mereka juga terus mengawasi gerbang-gerbang[a] siang dan malam untuk membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gerbang-gerbang kota.” Teks Yunani hanya menyebut “gerbang-gerbang”; bahwa ini adalah gerbang kota dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: diketahui oleh
  rationale: Bentuk aoristus pasif dipertahankan tanpa menentukan siapa yang menyampaikan informasi itu kepada Saulus.
- source_word: ἐπιβουλή
  choice: rencana jahat
  rationale: Kata ini menunjuk pada rencana bermusuhan untuk mencelakakan seseorang; frasa ini alami dalam bahasa Indonesia dan maksud mematikannya dijelaskan pada akhir ayat.
- source_word: παρετηροῦντο
  choice: terus mengawasi
  rationale: Bentuk imperfek menyatakan pengawasan yang berlangsung terus-menerus; 'mengawasi' lebih tepat daripada 'menjaga' karena menekankan pengamatan.
- source_word: πύλας
  choice: pintu-pintu gerbang
  rationale: Bentuk jamak diterjemahkan secara langsung. Bahwa yang dimaksud ialah gerbang kota dipahami dari konteks dan dicatat sebagai alternatif eksplisit dalam catatan kaki.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: siang dan malam
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan pengawasan yang berlangsung pada kedua waktu tersebut.
- source_word: ὅπως αὐτὸν ἀνέλωσιν
  choice: untuk membunuhnya
  rationale: Menyampaikan tujuan pengawasan secara jelas dan alami; ἀναιρέω dalam konteks ini berarti membunuh atau melenyapkan.
- source_word: δὲ
  choice: Namun
  rationale: 'Menandai peralihan yang berlawanan: ada rencana jahat, tetapi rencana itu diketahui Saulus.'
- source_word: καὶ
  choice: juga
  rationale: 'Mempertahankan fungsi aditif: selain merencanakan kejahatan, mereka mengawasi gerbang.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Terus mengawasi' mempertahankan aspek berkelanjutan dari bentuk imperfek, sedangkan susunan pasif 'diketahui oleh Saulus' menjaga ketidakjelasan teks mengenai sumber informasi.
