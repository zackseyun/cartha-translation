id: ACT.9.1
reference: Acts 9:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: id
  text: Namun, Saulus masih bernapaskan ancaman dan pembunuhan terhadap murid-murid Tuhan. Ia mendatangi imam besar
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan kembali kepada Saulus dengan nuansa kontras ringan terhadap adegan sebelumnya.
- source_word: ἔτι
  choice: masih
  rationale: Menyatakan bahwa sikap bermusuhan Saulus terus berlangsung.
- source_word: ἐμπνέων
  choice: bernapaskan
  rationale: Mempertahankan metafora hidup bahwa ancaman dan pembunuhan seolah-olah menjadi napas Saulus, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἀπειλῆς καὶ φόνου
  choice: ancaman dan pembunuhan
  rationale: Mempertahankan bentuk nomina dan bobot moral φόνος; bentuk tunggal kolektif alami dalam bahasa Indonesia.
- source_word: εἰς τοὺς μαθητὰς
  choice: terhadap murid-murid
  rationale: Dalam konteks permusuhan, εἰς menunjukkan arah sasaran ancaman dan niat membunuh.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Padanan baku κύριος dalam konteks ini; frasa genitif menunjukkan bahwa mereka adalah murid-murid Tuhan.
- source_word: προσελθὼν τῷ ἀρχιερεῖ
  choice: Ia mendatangi imam besar
  rationale: Mengungkapkan partisip aoristis sebagai tindakan naratif yang mendahului permintaan pada ayat berikutnya; 'mendatangi' menyampaikan gerak menuju seseorang secara alami.
theological_decisions:
- issue: Rujukan κύριος dalam τοῦ κυρίου
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks Kisah Para Rasul, gelar ini merujuk kepada Yesus dan secara tepat diterjemahkan 'Tuhan' tanpa menghapus fungsi gelarnya.
- issue: Makna φόνος
  choice: pembunuhan
  alternative: pembantaian
  rationale: φόνος dapat menunjuk pada tindakan membunuh atau pembunuhan. 'Pembunuhan' menjaga bobot moral dan keluasan leksikalnya, sedangkan 'pembantaian' lebih menggambarkan cara atau skala pembunuhan dan karena itu lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang bermartabat. Metafora Yunani dipertahankan melalui 'bernapaskan'. Ayat dibiarkan mengarah ke tindakan berikutnya, tetapi dibagi menjadi dua kalimat agar alami dan jelas dalam bahasa Indonesia.
