id: ACT.9.41
reference: Acts 9:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: id
  text: Lalu Petrus mengulurkan tangannya kepadanya dan membantunya berdiri.[a] Sesudah itu, ia memanggil orang-orang kudus dan para janda, lalu memperlihatkan kepada mereka bahwa perempuan itu hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuatnya bangkit” atau “membangkitkannya”. Kata Yunani yang dipakai dapat berarti menyebabkan seseorang bangkit atau berdiri dan dalam konteks ini juga menggemakan bahasa kebangkitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: mengulurkan tangannya kepadanya
  rationale: Ungkapan ini menyampaikan tindakan memberikan atau mengulurkan tangan untuk menolong, tetap dekat dengan bentuk Yunani dan alami dalam bahasa Indonesia.
- source_word: ἀνέστησεν
  choice: membantunya berdiri
  rationale: Kausatif ἀνίστημι di sini dapat berarti membuat seseorang bangkit atau berdiri. Dalam urutan adegan, Petrus mengulurkan tangan lalu membantu Tabita berdiri; catatan kaki mempertahankan gema bahasa kebangkitan.
- source_word: φωνήσας
  choice: ia memanggil
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama berikutnya; bentuk klausa ini alami dalam bahasa Indonesia.
- source_word: τοὺς ἁγίους
  choice: orang-orang kudus
  rationale: Ini adalah sebutan Perjanjian Baru bagi umat Allah dan lebih tepat secara leksikal daripada para orang percaya.
- source_word: τὰς χήρας
  choice: para janda
  rationale: Terjemahan langsung yang mempertahankan pembedaan kelompok ini karena penting dalam konteks sebelumnya.
- source_word: παρέστησεν
  choice: memperlihatkan kepada mereka
  rationale: Dalam konteks ini παρίστημι berarti menghadirkan seseorang di hadapan orang lain. Perumusan tersebut terdengar lebih alami daripada mempresentasikan, sambil menghindari kesan bahwa Petrus membuatnya berdiri pada tahap ini.
- source_word: ζῶσαν
  choice: bahwa perempuan itu hidup
  rationale: Partisip predikatif ini menerangkan keadaan Tabita ketika dihadirkan. Klausa dengan bahwa menyampaikan daya predikatifnya secara jelas dan alami.
theological_decisions:
- issue: Nuansa kebangkitan dalam ἀνέστησεν
  choice: membantunya berdiri, dengan catatan kaki tentang alternatif membangkitkannya
  alternative: membangkitkannya / membuatnya bangkit
  rationale: Konteks sebelumnya sudah menyatakan bahwa Tabita hidup kembali, sedangkan tindakan dalam ayat ini terjadi setelah Petrus mengulurkan tangan. Teks utama menggambarkan tindakan fisik secara alami tanpa menghapus kemungkinan gema kebangkitan, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Nama Petrus dinyatakan untuk memperjelas subjek yang tersirat dalam rangkaian kata kerja Yunani. Rujukan kepada Tabita dijelaskan sebagai “perempuan itu” pada akhir kalimat agar predikasi “hidup” tidak terdengar janggal.
