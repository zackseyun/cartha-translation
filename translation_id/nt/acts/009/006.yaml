  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: id
  text: Tetapi bangunlah dan masuklah ke kota, dan kepadamu akan diberitahukan apa yang harus kamu lakukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai peralihan yang bersifat pertentangan dari pertanyaan Saulus kepada perintah Yesus; bentuk ini ringkas dan wajar dalam bahasa Indonesia baku.
- source_word: ἀνάστηθι
  choice: bangunlah
  rationale: Imperatif aoris dari ἀνίστημι; dalam konteks Saulus yang telah jatuh ke tanah, “bangunlah” merupakan padanan alami dan langsung.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: masuklah ke kota
  rationale: Mempertahankan arah gerak yang dinyatakan oleh εἰς dan memakai ungkapan Indonesia yang alami.
- source_word: λαληθήσεταί σοι
  choice: akan diberitahukan kepadamu
  rationale: Mempertahankan bentuk pasif dan ketidakjelasan pelaku dalam teks Yunani tanpa menambahkan subjek tertentu.
- source_word: ὅ τί
  choice: apa yang
  rationale: Secara alami memperkenalkan isi pemberitahuan dalam bahasa Indonesia.
- source_word: σε δεῖ ποιεῖν
  choice: harus kamu lakukan
  rationale: “Harus” mempertahankan daya keharusan δεῖ, sedangkan susunan ini jelas dan wajar bagi pembaca Indonesia modern.
theological_decisions:
- issue: Daya δεῖ dalam konteks pengarahan ilahi
  choice: harus
  alternative: perlu
  rationale: “Harus” mempertahankan nuansa kewajiban atau keniscayaan yang kuat tanpa menentukan secara eksplisit sumber keharusan itu melampaui apa yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, lugas, dan bermartabat. Kalimat dibagi menjadi dua agar alur perintah dan janji pemberitahuan mudah dipahami; “di sana” memperjelas hubungan dengan kota secara alami tanpa mengubah isi pokok.
