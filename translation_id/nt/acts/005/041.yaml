  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: id
  text: Maka mereka pergi dari hadapan Majelis itu sambil bersukacita karena mereka telah dianggap layak untuk dihina demi Nama itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nama Yesus.” Dalam bahasa Yunani tertulis “Nama itu,” suatu sebutan singkat penuh hormat yang referennya dibiarkan tersirat dalam teks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: mereka pergi
  rationale: Bentuk imperfek menggambarkan gerak mereka meninggalkan tempat itu dalam alur cerita. “Mereka pergi” alami dalam bahasa Indonesia dan tidak menambahkan gagasan yang tidak dinyatakan.
- source_word: χαίροντες
  choice: sambil bersukacita
  rationale: Partisipel kini menyatakan tindakan atau sikap yang menyertai kepergian mereka. “Sambil bersukacita” mempertahankan hubungan waktunya dengan verba utama.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: dari hadapan Majelis itu
  rationale: Ungkapan ini secara harfiah berarti pergi dari hadapan atau kehadiran majelis. Pilihan ini mempertahankan nuansa formal idiom Yunani sambil tetap dapat dipahami.
- source_word: συνεδρίου
  choice: Majelis
  rationale: Συνέδριον menunjuk kepada dewan pemerintahan Yahudi yang dikenal sebagai Sanhedrin. “Majelis” menerjemahkan nomina umumnya tanpa mengharuskan pembaca mengenal istilah transliterasi tersebut.
- source_word: κατηξιώθησαν
  choice: telah dianggap layak
  rationale: Bentuk pasif aoristus menyatakan bahwa mereka dinilai atau diperhitungkan layak. Bentuk pasif dipertahankan tanpa menetapkan pelaku yang tidak disebutkan.
- source_word: ὑπὲρ
  choice: demi
  rationale: Dalam konteks ini ὑπέρ menyatakan alasan atau kepentingan yang menyebabkan mereka menanggung penghinaan. “Demi” ringkas dan wajar dalam bahasa Indonesia.
- source_word: τοῦ ὀνόματος
  choice: Nama itu
  rationale: Teks Yunani memakai ungkapan mutlak “Nama” sebagai sebutan penuh hormat dan tidak menyebut referennya secara eksplisit pada ayat ini. Kapitalisasi dan kata penunjuk menghasilkan ungkapan Indonesia yang wajar sambil mempertahankan keimplisitannya.
- source_word: ἀτιμασθῆναι
  choice: untuk dihina
  rationale: Infinitif pasif menyatakan perlakuan yang merendahkan kehormatan mereka. “Dihina” mempertahankan bentuk pasif dan kerangka kehormatan–aib secara ringkas.
theological_decisions:
- issue: Pemakaian mutlak “Nama”
  choice: Mempertahankan “Nama itu” tanpa memperluasnya dalam teks utama
  alternative: nama Yesus; nama-Nya
  rationale: Τοῦ ὀνόματος secara gramatikal hanya berbunyi “Nama itu” dan kemungkinan besar menunjuk kepada Yesus menurut konteks. Tidak menyebut “Yesus” dalam teks utama mempertahankan ungkapan penuh hormat sekaligus ambiguitas eksplisit sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Majelis” memakai huruf kapital karena menunjuk kepada lembaga tertentu dalam konteks ini. Susunan “sambil bersukacita karena” mempertahankan sukacita sebagai sikap yang menyertai kepergian serta menghubungkannya dengan alasan yang diberikan.
