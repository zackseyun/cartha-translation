  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: id
  text: Sebab sebelum masa ini, Teudas tampil[a] dan mengaku sebagai orang penting. Sejumlah kira-kira empat ratus laki-laki bergabung dengannya[b]. Ia dibunuh, dan semua orang yang dibujuk olehnya[c] tercerai-berai dan akhirnya tidak berarti apa-apa lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangkit” atau “muncul.” Dalam konteks ini, Teudas tampil sebagai pemimpin suatu gerakan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sejumlah laki-laki, kira-kira empat ratus orang, berpihak kepadanya.”
    reason: literal_rendering
  - marker: c
    text: Atau, “semua orang yang telah diyakinkan olehnya” atau “semua pengikutnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Sebab sebelum masa ini
  rationale: πρό dengan genitif menunjukkan waktu sebelumnya, sedangkan γάρ mempertahankan hubungan penjelasan dalam argumen Gamaliel. 'Masa ini' mengungkapkan τούτων τῶν ἡμερῶν secara alami dalam bahasa Indonesia.
- source_word: ἀνέστη
  choice: tampil
  rationale: Dalam konteks ini kata tersebut menunjuk pada munculnya seseorang sebagai pemimpin atau tokoh, bukan bangkit secara harfiah. 'Tampil' alami dan tetap mempertahankan gagasan kemunculannya di muka umum.
- source_word: Θευδᾶς
  choice: Teudas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: mengaku sebagai orang penting
  rationale: Ungkapan idiomatis τινα ἑαυτόν menyiratkan bahwa Teudas menampilkan dirinya sebagai seseorang yang berarti atau berkedudukan. 'Orang penting' menyampaikan idiom itu dengan jelas tanpa menentukan jabatan tertentu.
- source_word: ᾧ προσεκλίθη
  choice: bergabung dengannya
  rationale: Bentuk pasif ini menggambarkan orang-orang yang memihak atau mengikatkan diri kepada seorang pemimpin. 'Bergabung dengannya' ringkas dan alami.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: Kira-kira empat ratus orang
  rationale: ὡς menyatakan perkiraan. Dalam konteks kelompok pengikut, 'orang' merupakan ungkapan Indonesia yang alami; catatan kaki menjelaskan bahwa ἀνδρῶν secara khusus berarti laki-laki.
- source_word: ὃς ἀνῃρέθη
  choice: Ia dibunuh
  rationale: ἀναιρέω di sini berarti membunuh atau menyingkirkan dengan membunuh. Bentuk pasif Yunani dipertahankan.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: semua orang yang telah diyakinkannya
  rationale: πείθω dalam konstruksi ini menekankan bahwa mereka telah terbujuk atau diyakinkan untuk berpihak kepada Teudas, bukan sekadar mengikutinya.
- source_word: διελύθησαν
  choice: tercerai-berai
  rationale: διαλύω menggambarkan bubarnya kelompok tersebut. 'Tercerai-berai' mempertahankan citra tercerainya para pengikut.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: sehingga gerakan itu lenyap sama sekali
  rationale: Ungkapan ini menyatakan bahwa usaha atau gerakan tersebut tidak menghasilkan apa-apa dan berakhir. Penyebutan 'gerakan itu' membuat rujukan idiomatisnya jelas dalam bahasa Indonesia tanpa mengubah hasil yang dinyatakan.
theological_decisions:
- issue: Laporan historis tentang Teudas dalam perkataan Gamaliel
  choice: Menyajikannya secara langsung sebagai bagian dari argumen Gamaliel
  alternative: Memberi kesan ketidakpastian atau mengubah redaksi untuk menyelaraskannya dengan rekonstruksi sejarah di luar teks
  rationale: Terjemahan mengikuti laporan dalam teks Yunani sebagaimana disampaikan dalam pidato Gamaliel dan tidak memasukkan penilaian historis atau harmonisasi ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Susunan kalimat dipecah untuk kelancaran. Idiom Yunani diterjemahkan secara komunikatif, sedangkan nuansa leksikal penting dipertahankan melalui catatan kaki.
