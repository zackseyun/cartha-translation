  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: id
  text: Namun, seseorang datang dan melaporkan kepada mereka, “Lihat! Orang-orang yang kamu masukkan ke dalam penjara itu sedang berdiri di kompleks Bait Allah[a] dan mengajar orang banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di Bait Allah”; kata Yunani yang digunakan menunjuk pada seluruh kompleks Bait Allah, termasuk pelatarannya, bukan khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: datang
  rationale: Partisip aoris ini menyatakan kedatangan pembawa berita sebelum ia menyampaikan laporannya; ‘datang’ alami dan mempertahankan urutan narasi.
- source_word: δέ
  choice: Namun
  rationale: Menandai perkembangan yang berlawanan dengan harapan setelah diketahui bahwa penjara terkunci tetapi para tahanan tidak ada di dalamnya.
- source_word: τις
  choice: seseorang
  rationale: Mempertahankan subjek yang tidak ditentukan tanpa menambahkan identitas atau peran yang tidak disebutkan dalam teks.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: melaporkan kepada mereka
  rationale: Menggambarkan penyampaian informasi kepada para pejabat secara tepat, sambil mempertahankan pronomina ‘mereka’ dari teks sumber.
- source_word: Ἰδοὺ
  choice: Lihat!
  rationale: Seruan ini menarik perhatian kepada kabar yang mengejutkan; ‘Lihat!’ jelas, langsung, dan tidak arkais.
- source_word: οἱ ἄνδρες
  choice: orang-orang
  rationale: Dalam konteks ini merujuk kepada para rasul yang telah dipenjarakan; ‘orang-orang’ merupakan ungkapan Indonesia yang alami tanpa mengubah rujukannya.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: yang kamu masukkan ke dalam penjara itu
  rationale: ‘Masukkan ke dalam penjara’ menyampaikan tindakan menempatkan mereka dalam tahanan, sedangkan ‘itu’ menunjukkan tempat yang telah diketahui dari konteks.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam; pilihan ini menghindari kesan bahwa mereka berada di dalam tempat kudus.
- source_word: ἑστῶτες καὶ διδάσκοντες
  choice: sedang berdiri ... dan mengajar
  rationale: Konstruksi perifrastis dengan dua partisip kini menunjukkan tindakan yang sedang berlangsung; bentuk Indonesia ini mempertahankan kedua tindakan tersebut.
- source_word: τὸν λαόν
  choice: rakyat
  rationale: λαός di sini menunjuk kepada khalayak Israel yang berada di Bait Allah; ‘rakyat’ ringkas dan sesuai dengan konteks publik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung dibuat hidup tanpa menjadi percakapan yang terlalu santai. Pronomina ‘kamu’ dipertahankan karena pembicara menyapa sekelompok pejabat secara langsung; dalam bahasa Indonesia bentuk ini tidak membedakan tunggal dan jamak.
