id: ACT.5.12
reference: Acts 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: id
  text: Melalui tangan para rasul, banyak tanda dan mukjizat terus terjadi di antara orang banyak. Mereka semua berkumpul dengan sehati[a] di Serambi Salomo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan satu hati.” Ungkapan Yunani menyatakan kesatuan sikap atau tujuan, bukan hanya berada di tempat yang sama.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Barisan Tiang Salomo.” Yang dimaksud ialah serambi beratap yang ditopang deretan tiang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Melalui tangan para rasul
  rationale: Mempertahankan ungkapan konkret Yunani yang menyatakan perantaraan atau sarana, tanpa mereduksinya menjadi sekadar ‘melalui para rasul’.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Di sini δέ berfungsi sebagai penghubung ringan dalam alur narasi. Pemisahan menjadi dua kalimat sudah menghasilkan transisi alami dalam bahasa Indonesia tanpa menambahkan ‘sekarang’ atau pertentangan yang tidak tegas.
- source_word: ἐγίνετο
  choice: terus terjadi
  rationale: Bentuk imperfek menunjukkan kegiatan yang berlangsung atau berulang pada masa lampau. ‘Terus terjadi’ menyampaikan aspek itu secara alami dan tidak memaksakan bentuk pasif yang kurang wajar dalam bahasa Indonesia.
- source_word: σημεῖα καὶ τέρατα
  choice: tanda dan mukjizat
  rationale: ‘Tanda’ mempertahankan fungsi penunjuk dari σημεῖον, sedangkan ‘mukjizat’ secara alami menyampaikan perbuatan menakjubkan yang dimaksud τέρας dalam konteks ini.
- source_word: πολλὰ
  choice: banyak
  rationale: Kata ini menerangkan pasangan ‘tanda dan mukjizat’ dan diterjemahkan secara langsung.
- source_word: ἐν τῷ λαῷ
  choice: di antara orang banyak
  rationale: Dalam konteks kejadian di area Bait Allah, frasa ini menunjuk pada orang-orang di tengah masyarakat atau kerumunan. Pilihan ini tidak menambahkan penentuan etnis yang tidak dinyatakan secara eksplisit.
- source_word: ὁμοθυμαδὸν
  choice: berkumpul dengan sehati
  rationale: Gabungan ini menyampaikan baik kebersamaan fisik maupun kesatuan sikap atau tujuan, yang keduanya terkandung dalam adverbia Yunani.
- source_word: ἅπαντες
  choice: mereka semua
  rationale: Mempertahankan cakupan menyeluruh sambil membiarkan acuan subjek tetap tersirat sebagaimana dalam teks Yunani.
- source_word: Στοᾷ Σολομῶντος
  choice: Serambi Salomo
  rationale: ‘Serambi’ adalah istilah Indonesia yang alami bagi στοά, yakni ruang beratap memanjang yang ditopang deretan tiang.
theological_decisions:
- issue: Acuan ‘mereka semua’
  choice: Acuannya dibiarkan terbuka sebagai kelompok yang terkait dengan para rasul.
  alternative: Para rasul saja; atau seluruh orang percaya.
  rationale: Bahasa Yunani tidak menyebutkan anteseden ἅπαντες secara eksplisit. Terjemahan tidak mempersempitnya kepada salah satu kelompok.
- issue: Hubungan tanda dan mukjizat dengan para rasul
  choice: ‘Melalui tangan para rasul’ mempertahankan peran mereka sebagai perantara atau pelaku yang melaluinya peristiwa itu terjadi.
  alternative: ‘Dilakukan oleh para rasul,’ yang menegaskan agensi langsung secara lebih eksplisit.
  rationale: διά dengan genitif menyatakan sarana atau perantaraan. Rumusan yang dipilih menjaga idiom sumber dan tidak melampaui kadar ketegasan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Mukjizat’ dipilih daripada terjemahan harfiah ‘keajaiban’ agar makna kontekstual jelas. Dua kalimat digunakan untuk menghindari rangkaian klausa yang berat sekaligus mempertahankan hubungan naratif.
