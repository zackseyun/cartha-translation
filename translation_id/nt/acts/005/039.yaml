source:
  edition: SBLGNT
  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: id
  text: Namun, jika ini berasal dari Allah, kalian tidak akan mampu meruntuhkan mereka.[a] Jangan-jangan kalian bahkan didapati melawan Allah.” Maka mereka pun diyakinkan olehnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” paling wajar menunjuk kepada para rasul, meskipun sebagian orang memahaminya secara lebih luas sebagai gerakan atau pekerjaan mereka. “Meruntuhkan” juga dapat diterjemahkan “menghancurkan”, “menggagalkan”, atau “meniadakan”.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: berasal dari Allah
  rationale: Frasa ἐκ θεοῦ menyatakan sumber atau asal; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kriteria asal ilahi yang dikemukakan Gamaliel.
- source_word: δυνήσεσθε
  choice: akan mampu
  rationale: Bentuk futur dari δύναμαι menyatakan kemampuan pada masa mendatang; 'akan mampu' mempertahankan aspek waktu dan maknanya.
- source_word: καταλῦσαι
  choice: meruntuhkan
  rationale: Dalam konteks ini, καταλύω berarti menggagalkan atau membuat jatuh hingga tidak bertahan. 'Meruntuhkan' cocok bagi upaya meniadakan orang-orang beserta kiprah mereka, tanpa menyiratkan pembunuhan secara khusus.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina maskulin jamak ini paling wajar menunjuk kepada para rasul, bukan hanya kepada rencana atau pekerjaan yang abstrak.
- source_word: μήποτε
  choice: Jangan-jangan ... malah
  rationale: μήποτε memperkenalkan peringatan mengenai kemungkinan buruk. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kehati-hatian, bukan kepastian.
- source_word: θεομάχοι
  choice: melawan Allah
  rationale: θεομάχοι secara harfiah menggambarkan orang-orang yang berperang atau melawan Allah. Bentuk verbal ini jelas dan wajar bagi pembaca modern.
- source_word: εὑρεθῆτε
  choice: ternyata
  rationale: Pasif εὑρίσκω di sini berarti didapati atau terbukti berada dalam keadaan tertentu. 'Ternyata' menyampaikan hasil penyingkapan itu secara idiomatis.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Maka mereka pun menerima nasihatnya
  rationale: Pasif πείθω menunjukkan bahwa sidang itu terbujuk atau menerima pertimbangan Gamaliel. Dalam konteks nasihat, 'menerima nasihatnya' lebih alami daripada konstruksi pasif yang kaku.
theological_decisions:
- issue: Acuan αὐτούς dalam pernyataan tentang pihak yang tidak dapat diruntuhkan
  choice: Kata 'mereka' menunjuk paling langsung kepada para rasul yang sedang dibicarakan.
  alternative: Kata itu dapat dipahami secara lebih luas sebagai gerakan atau pekerjaan mereka, mengikuti 'rencana atau pekerjaan ini' pada ayat 38.
  rationale: Bentuk Yunani adalah maskulin jamak sehingga acuan personal harus dipertahankan dalam teks. Catatan kaki mengakui kaitan kontekstual yang lebih luas tanpa mengubah pronomina menjadi objek abstrak atau menjadikan ucapan Gamaliel sebagai janji umum tentang setiap gerakan keagamaan.
- issue: Kadar kepastian dalam μήποτε ... θεομάχοι εὑρεθῆτε
  choice: 'Dipertahankan sebagai peringatan tentang kemungkinan: ''Jangan-jangan ... ternyata''.'
  alternative: Pernyataan yang lebih tegas, seperti 'kalau tidak, kalian akan melawan Allah'.
  rationale: Teks Yunani mengungkapkan kewaspadaan terhadap suatu kemungkinan, bukan memastikan bahwa mereka sedang melawan Allah; ketegangan teologis dalam penalaran Gamaliel tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kalian' dipakai karena sapaan Yunani berbentuk jamak dan ditujukan kepada anggota Mahkamah Agama. Ungkapan 'Jangan-jangan ... malah ternyata' mempertahankan daya peringatan μήποτε dengan gaya yang alami.
