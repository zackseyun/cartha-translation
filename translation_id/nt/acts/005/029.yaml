  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: id
  text: Namun Petrus dan para rasul menjawab, “Kita harus lebih taat kepada Allah daripada kepada manusia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang.” Kata Yunani ini merujuk kepada manusia secara umum, dalam kontras dengan Allah; dalam konteks, para pemegang wewenang manusia termasuk dalam rujukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: menjawab
  rationale: Partisip aoris ἀποκριθεὶς bersama verba εἶπαν membentuk ungkapan jawaban yang lazim. Satu verba “menjawab” menyampaikan fungsi naratifnya secara alami tanpa pengulangan kaku seperti “menjawab dan berkata”.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang bernuansa pertentangan terhadap tuntutan para pemimpin dalam konteks sebelumnya. “Namun” menyampaikan kontras ringan itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Petrus dan rasul-rasul itu
  rationale: Nama Πέτρος mengikuti bentuk baku Indonesia “Petrus”. Artikel pada οἱ ἀπόστολοι menunjuk kepada kelompok rasul yang sudah dikenal dalam konteks, sehingga diterjemahkan “rasul-rasul itu”.
- source_word: Πειθαρχεῖν
  choice: taat kepada
  rationale: πειθαρχέω berarti menaati pihak yang berwenang. “Taat kepada” jelas, alami, dan mempertahankan gagasan ketundukan kepada otoritas.
- source_word: δεῖ
  choice: Kita harus
  rationale: δεῖ menyatakan keharusan atau kewajiban. Subjek infinitifnya tersirat dari para pembicara; “kita” membuat rujukan tersebut jelas dalam bahasa Indonesia tanpa mengubah cakupannya menjadi perintah umum.
- source_word: θεῷ
  choice: Allah
  rationale: θεῷ adalah objek datif dari ketaatan. “Allah” merupakan padanan baku θεός dalam bahasa Indonesia.
- source_word: μᾶλλον ἢ
  choice: lebih ... daripada
  rationale: Konstruksi komparatif ini membandingkan dua pihak yang menjadi sasaran ketaatan. Bentuk “lebih taat ... daripada ...” mempertahankan struktur perbandingan Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ἀνθρώποις
  choice: manusia
  rationale: Bentuk jamak ἀνθρώποις merujuk secara umum kepada manusia, khususnya para penguasa manusia dalam konteks ini, sebagai lawan dari Allah. Dalam bahasa Indonesia, nomina kolektif “manusia” mempertahankan kontras tersebut tanpa membatasi rujukan pada laki-laki.
theological_decisions:
- issue: Sifat perbandingan dalam μᾶλλον ἢ
  choice: “lebih taat kepada Allah daripada kepada manusia”
  alternative: “taat kepada Allah, bukan kepada manusia”
  rationale: Teks Yunani memakai bentuk komparatif “lebih ... daripada”, bukan penyangkalan mutlak. Terjemahan mempertahankan ketegangan bahwa otoritas manusia dapat ditaati, tetapi ketaatan kepada Allah memiliki tuntutan yang lebih tinggi ketika keduanya bertentangan.
- issue: Cakupan ἀνθρώποις dalam kontras dengan θεῷ
  choice: manusia
  alternative: orang-orang; para penguasa manusia
  rationale: “Manusia” paling langsung mempertahankan kontras universal antara Allah dan manusia. Konteks menunjukkan bahwa para pemimpin yang sedang berbicara termasuk dalam rujukan itu, tetapi menambahkan “penguasa” ke teks utama akan mempersempit kata Yunani secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “lebih taat kepada Allah daripada kepada manusia” mempertahankan bentuk komparatif sumber sekaligus menghasilkan ungkapan yang mudah dipahami. Bentuk “rasul-rasul itu” menandai kelompok tertentu yang telah hadir dalam konteks.
