  naturalness: “Kata mereka” sesuai sebagai pengantar laporan langsung. “Terkunci rapat dengan pengamanan yang ketat” lebih alami daripada “terkunci dengan sangat aman.” Menyebut “pintu-pintunya” setelah “membuka” memperjelas rujukan kontekstual tanpa mengubah makna.
  terminology: “Penjara,” “para penjaga,” dan “seorang pun” adalah padanan baku dan tepat. Tidak ada istilah teologis khusus dalam ayat ini.
