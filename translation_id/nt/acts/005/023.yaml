  text: kata mereka, “Kami mendapati penjara itu terkunci rapat dengan pengamanan yang ketat[a], dan para penjaga berdiri di depan pintu-pintunya. Namun, ketika kami membuka pintu-pintunya, kami tidak menemukan seorang pun di dalam.”
