lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: kata mereka, “
  rationale: Partisipel ini melanjutkan tindakan para petugas pada ayat sebelumnya dan memperkenalkan isi laporan langsung mereka; bentuk ini alami dalam narasi bahasa Indonesia.
- source_word: δεσμωτήριον
  choice: penjara
  rationale: Menunjuk tempat penahanan; “penjara” merupakan padanan baku dan alami dalam bahasa Indonesia modern.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: terkunci dengan sangat aman
  rationale: Partisipel perfek pasif menyatakan keadaan sudah tertutup atau terkunci, sedangkan frasa ἐν πάσῃ ἀσφαλείᾳ menekankan keamanan sepenuhnya. Pilihan ini mempertahankan penekanan tersebut secara alami.
- source_word: τοὺς φύλακας ἑστῶτας
  choice: para penjaga berdiri
  rationale: φύλακες adalah para penjaga dalam konteks tahanan, dan ἑστῶτας menggambarkan mereka berada dalam posisi berdiri tanpa harus menambahkan gagasan formal bahwa mereka ditugaskan.
- source_word: ἐπὶ τῶν θυρῶν
  choice: di depan pintu-pintunya
  rationale: ἐπί dengan genitif menunjukkan lokasi dekat pintu. “Di depan” wajar dalam konteks penjagaan, sedangkan bentuk jamak “pintu-pintunya” mempertahankan τῶν θυρῶν.
- source_word: ἀνοίξαντες
  choice: ketika kami membukanya
  rationale: Partisipel aoris paling alami dinyatakan secara temporal. Enklitik “-nya” merujuk pada penjara sebagai tempat yang dibuka untuk dimasuki, tanpa mengulang objek yang sudah jelas dari konteks.
- source_word: ἔσω
  choice: di dalam
  rationale: Adverbia ini menunjuk bagian dalam penjara; “di dalam” jelas dan alami.
- source_word: οὐδένα
  choice: tidak menemukan seorang pun
  rationale: Bentuk negatif ini menyatakan bahwa sama sekali tidak ada orang yang ditemukan; susunan tersebut baku dalam bahasa Indonesia.
