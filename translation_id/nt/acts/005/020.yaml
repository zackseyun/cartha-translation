  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: id
  text: “Pergilah, berdirilah di Bait Allah[a], dan sampaikanlah kepada orang banyak segala perkataan tentang hidup ini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kompleks Bait Allah.” Kata Yunani yang dipakai menunjuk seluruh kawasan Bait Allah, bukan khusus ruang kudus bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani ini dapat juga dipahami sebagai “segala perkataan dari hidup ini,” “mengenai hidup ini,” atau “mengenai cara hidup ini.” Ungkapan tersebut dapat merujuk pada hidup yang diberitakan melalui Injil, tetapi teksnya tidak menjelaskan hubungan itu lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Pergilah
  rationale: Bentuk imperatif ini menyuruh para rasul pergi dari tempat mereka berada; “Pergilah” merupakan perintah langsung dan alami dalam bahasa Indonesia.
- source_word: σταθέντες
  choice: berdirilah
  rationale: 'Partisip aoris ini menyertai perintah utama dan secara idiomatis dapat disampaikan sebagai perintah berurutan: pergi, berdiri, lalu berbicara. Bentuk ini mempertahankan tindakan berdiri di tempat yang ditentukan.'
- source_word: λαλεῖτε
  choice: sampaikanlah
  rationale: Dalam konteks berbicara kepada orang banyak, “sampaikanlah” terdengar alami dan mengungkapkan bahwa mereka harus menyuarakan isi pesan tanpa menambahkan nuansa teknis ‘memberitakan’ yang tidak wajib terkandung dalam λαλέω.
- source_word: ἐν τῷ ἱερῷ
  choice: di pelataran Bait Allah
  rationale: ἱερόν menunjuk kompleks Bait Allah, bukan khusus ruang kudus bagian dalam. “Pelataran Bait Allah” membantu pembaca Indonesia membayangkan kawasan tempat orang banyak dapat berkumpul dan mendengar.
- source_word: τῷ λαῷ
  choice: kepada orang banyak
  rationale: λαός menunjuk orang-orang yang hadir di kompleks Bait Allah. “Orang banyak” alami dalam konteks ini tanpa secara eksplisit mempersempitnya menjadi suatu kelompok etnis, meskipun mereka adalah umat yang berkumpul di sana.
- source_word: πάντα τὰ ῥήματα
  choice: segala perkataan
  rationale: Pilihan ini mempertahankan unsur distributif πάντα dan kata jamak ῥήματα. Ungkapan ini lebih dekat pada bentuk Yunani daripada “seluruh pesan”, tetapi tetap dapat dipahami dalam bahasa Indonesia.
- source_word: τῆς ζωῆς ταύτης
  choice: tentang hidup ini
  rationale: Genitif Yunani menghubungkan ‘perkataan’ dengan ‘hidup ini’ tanpa menjelaskan tepatnya jenis hubungan tersebut. “Tentang hidup ini” merupakan bacaan Indonesia yang alami, sedangkan kemungkinan hubungan yang lebih luas dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna τῆς ζωῆς ταύτης (‘hidup ini’)
  choice: tentang hidup ini
  alternative: dari hidup ini; mengenai cara hidup ini; yang membawa hidup ini
  rationale: Frasa itu mungkin menunjuk pada hidup yang diberitakan dalam Injil, hidup baru yang dialami melalui Yesus, atau pesan yang memberi hidup. Teks utama tidak menambahkan kata “baru”, “kekal”, atau penjelasan doktrinal lain; catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian tiga tindakan disampaikan dengan bentuk perintah yang alami. “Bait Allah” dipilih sebagai istilah yang lazim bagi kompleks suci di Yerusalem; “pelataran” memperjelas bahwa para rasul berdiri di kawasan yang terbuka bagi orang banyak. Ambiguitas teologis frasa ‘hidup ini’ tidak diisi dengan kata ‘baru’ atau ‘kekal’.
