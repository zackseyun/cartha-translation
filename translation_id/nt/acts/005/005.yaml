id: ACT.5.5
reference: Acts 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: id
  text: Namun, ketika Ananias mendengar perkataan itu, ia jatuh dan mengembuskan napas terakhirnya. Lalu semua orang yang mendengar hal itu diliputi ketakutan yang besar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούων
  choice: ketika ... mendengar
  rationale: Partisipel kini ini berfungsi secara temporal dan paling wajar diterjemahkan sebagai peristiwa yang langsung mengiringi perkataan Petrus.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai perkembangan narasi dengan sedikit kontras terhadap perkataan Petrus sebelumnya.
- source_word: λόγους τούτους
  choice: perkataan itu
  rationale: Dalam konteks ini, frasa tersebut menunjuk pada perkataan yang baru saja diucapkan Petrus; bentuk tunggal kolektif 'perkataan' alami dalam bahasa Indonesia.
- source_word: πεσὼν
  choice: ia jatuh
  rationale: Mempertahankan gambaran fisik dari teks dan urutan tindakan sebelum kematian tanpa menambahkan tafsiran seperti 'roboh karena terkejut'.
- source_word: ἐξέψυξεν
  choice: mengembuskan napas terakhirnya
  rationale: Ungkapan ini mempertahankan citra leksikal verba Yunani sekaligus menyatakan kematian secara jelas dan alami dalam bahasa Indonesia.
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: diliputi ketakutan yang besar
  rationale: Secara idiomatis menyampaikan timbulnya ketakutan kuat yang menguasai kelompok tersebut.
- source_word: πάντας τοὺς ἀκούοντας
  choice: semua orang yang mendengar hal itu
  rationale: Partisipel substantival menunjuk kepada semua pendengar; 'hal itu' dibiarkan cukup luas agar tidak menentukan apakah yang didengar adalah perkataan, peristiwa kematian, atau kabarnya.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
theological_decisions:
- issue: Hakikat dan penyebab kematian Ananias
  choice: Menyatakan bahwa ia jatuh dan mengembuskan napas terakhir tanpa menentukan mekanisme kematiannya.
  alternative: Menjelaskan bahwa Allah langsung membunuhnya atau bahwa ia meninggal secara alami akibat keterkejutan.
  rationale: Teks Yunani menuturkan kematiannya secara langsung tetapi tidak secara eksplisit menyebut mekanisme atau penyebab fisiologisnya; ketegangan teologis itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Mengembuskan napas terakhirnya' dipilih karena tetap mudah dipahami sekaligus lebih dekat dengan citra ἐξέψυξεν daripada sekadar 'meninggal'. Tidak diperlukan catatan kaki karena alternatif leksikal tersebut sudah terwakili dalam teks utama.
source_grounding:
  english_pob_role: consult_only
