  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: id
  text: Namun Petrus berkata kepadanya, “Mengapa kalian bersepakat[a] untuk menguji Roh Tuhan? Lihat, kaki orang-orang yang telah menguburkan suamimu sudah di depan pintu, dan mereka akan mengusungmu ke luar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersekongkol.”'
    reason: Alternatif ini menonjolkan sifat jahat dan kolusif dari kesepakatan tersebut, meskipun “bersepakat” lebih dekat dengan arti dasar verba Yunani.
lexical_decisions:
- source_word: Τί ὅτι συνεφωνήθη ὑμῖν
  choice: Mengapa kalian bersepakat
  rationale: Ungkapan Τί ὅτι menyampaikan pertanyaan bernada teguran, sedangkan bentuk pasif συνεφωνήθη dengan ὑμῖν secara idiomatis menunjukkan kesepakatan bersama. Bentuk Indonesia aktif lebih alami tanpa menghilangkan unsur saling bersepakat.
- source_word: πειράσαι
  choice: untuk menguji
  rationale: πειράζω dapat berarti mencobai atau menguji. Dengan Roh Tuhan sebagai objek, “menguji” paling alami dan tidak menimbulkan kesan keliru bahwa mereka mencoba menggoda Roh.
- source_word: τὸ πνεῦμα κυρίου
  choice: Roh Tuhan
  rationale: Konstruksi genitif dipertahankan secara ringkas dan alami. Terjemahan ini menunjuk kepada Roh dalam hubungan dengan Tuhan tanpa memperluas teks menjadi “Roh Kudus,” meskipun konteks Kisah Para Rasul mendukung rujukan tersebut.
- source_word: ἰδοὺ
  choice: Lihat
  rationale: Penanda wacana ini menarik perhatian kepada kenyataan yang segera terjadi; “Lihat” bersifat langsung, modern, dan wajar.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: kaki orang-orang yang telah menguburkan
  rationale: Ungkapan harfiah “kaki” dipertahankan karena menghasilkan gambaran yang hidup dan tetap dapat dipahami. “Orang-orang” tidak menambahkan jenis kelamin yang tidak dinyatakan oleh bentuk Yunani.
- source_word: τὸν ἄνδρα σου
  choice: suamimu
  rationale: Dalam konteks Sapira dan Ananias, ἀνήρ jelas berarti suami, bukan sekadar laki-laki.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: di depan pintu
  rationale: Frasa ini menyatakan bahwa mereka telah berada tepat di pintu atau jalan masuk. “Di depan pintu” alami dalam bahasa Indonesia dan menyampaikan kehadiran yang dekat.
- source_word: ἐξοίσουσίν σε
  choice: mereka akan mengusungmu ke luar
  rationale: ἐκφέρω berarti membawa atau mengangkut ke luar. “Mengusung” cocok dengan konteks penguburan dan mempertahankan ketegasan yang mengerikan tanpa menambahkan kata “jenazahmu,” yang tidak tersurat.
theological_decisions:
- issue: Rujukan “Roh Tuhan”
  choice: Mempertahankan “Roh Tuhan” sebagai sebutan bagi Roh dalam hubungan dengan Tuhan.
  alternative: Memperjelasnya menjadi “Roh Kudus” atau memahaminya secara lebih umum sebagai kehadiran rohani Tuhan.
  rationale: Konteks Kisah Para Rasul 5:3 sangat kuat menunjuk kepada Roh Kudus, tetapi teks ayat ini berbunyi “Roh Tuhan.” Terjemahan tidak memperluas rumusan sumber dan membiarkan hubungan teologis dalam konteks tetap berbicara.
- issue: Kekuatan tuduhan Petrus
  choice: bersepakat
  alternative: bersekongkol
  rationale: συμφωνέω pada dasarnya berarti mencapai kesepakatan. Konteks menunjukkan kesepakatan jahat, tetapi “bersekongkol” memasukkan penilaian yang lebih kuat ke dalam verba itu sendiri. Alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan jamak “kalian” mencerminkan ὑμῖν dan menunjukkan bahwa Petrus menuduh Sapira serta suaminya telah mencapai kesepakatan bersama. Ungkapan konkret “kaki orang-orang” dipertahankan demi citra sumber, sedangkan “mengusungmu ke luar” menyampaikan implikasi kematian tanpa menambahkan “jenazah” ke dalam teks.
