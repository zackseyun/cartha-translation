  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: id
  text: Namun Petrus berkata, “Ananias, mengapa Iblis telah memenuhi hatimu sehingga engkau berdusta kepada Roh Kudus[a] dan diam-diam menahan sebagian dari hasil penjualan tanah itu[b][c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menipu Roh Kudus”. Kata Yunani yang dipakai dapat berarti berkata dusta kepada seseorang; dalam konteks ini, “berdusta kepada” merupakan padanan yang lebih langsung.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagian dari harga jual”.
    reason: lexical_alternative
  - marker: c
    text: “Tanah” juga dapat diterjemahkan “properti” atau “ladang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Namun Petrus berkata
  rationale: δέ adalah penghubung ringan yang di sini menandai peralihan bernuansa pertentangan ketika Petrus menghadapi Ananias; “namun” alami dan tidak terlalu keras.
- source_word: διὰ τί
  choice: mengapa
  rationale: Padanan langsung dan idiomatis untuk pertanyaan tentang alasan.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Satan memenuhi hatimu
  rationale: Mempertahankan Satan sebagai pelaku dan metafora “memenuhi hati” tanpa menafsirkannya sebagai kerasukan, kendali mutlak, atau hilangnya tanggung jawab Ananias.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: sehingga engkau berdusta kepada Roh Kudus
  rationale: Konstruksi infinitif yang menyatakan hasil atau tujuan dibuat alami dalam bahasa Indonesia dengan “sehingga”, sementara makna personal “berdusta kepada” dipertahankan.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Istilah baku dan alami dalam bahasa Indonesia modern.
- source_word: νοσφίσασθαι
  choice: diam-diam menahan sebagian
  rationale: Kata kerja ini mengandung gagasan menyisihkan atau menahan untuk diri sendiri secara tidak jujur; “diam-diam” menyampaikan unsur tersembunyi dan “sebagian” sesuai dengan konteks.
- source_word: ἀπὸ τῆς τιμῆς
  choice: sebagian dari harga
  rationale: ἀπό dengan genitif menunjukkan pengambilan dari suatu keseluruhan; “sebagian dari harga” dekat dengan bentuk sumber dan jelas dalam konteks penjualan.
- source_word: τοῦ χωρίου
  choice: tanah itu
  rationale: χωρίον dapat menunjuk sebidang tanah, ladang, atau properti; “tanah itu” alami dalam konteks milik yang dijual tanpa mempersempitnya menjadi ladang.
theological_decisions:
- issue: Peran Satan dalam memenuhi hati Ananias
  choice: Mempertahankan ungkapan “Satan memenuhi hatimu”.
  alternative: “Satan menguasai dirimu” atau “engkau membiarkan Satan memenuhi hatimu”.
  rationale: Teks Yunani menjadikan Satan subjek kata kerja, tetapi tetap menyapa Ananias sebagai pihak yang bertanggung jawab. Terjemahan tidak menambahkan gagasan kerasukan, paksaan mutlak, ataupun izin eksplisit dari Ananias.
- issue: Makna berdusta kepada Roh Kudus
  choice: “berdusta kepada Roh Kudus”
  alternative: “menipu Roh Kudus” atau “berdusta di hadapan Roh Kudus”.
  rationale: Padanan ini mempertahankan hubungan personal dan langsung dalam konstruksi Yunani tanpa menambahkan penjelasan doktrinal.
- issue: Hubungan infinitif dengan tindakan Satan
  choice: Menggunakan “sehingga” untuk menyatakan hasil tanpa meniadakan kemungkinan nuansa tujuan.
  alternative: “untuk berdusta kepada Roh Kudus dan menahan …”
  rationale: Infinitif Yunani dapat dipahami bernuansa hasil atau tujuan. “Sehingga” menghasilkan bahasa Indonesia yang alami, sedangkan catatan penerjemahan mengakui bahwa bentuk sumber tidak sepenuhnya menutup nuansa tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; metafora “memenuhi hati” serta ketegangan antara tindakan Satan dan tanggung jawab Ananias tetap dipertahankan.
