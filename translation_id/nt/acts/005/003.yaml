  to: Namun Petrus berkata, “Ananias, mengapa Iblis telah memenuhi hatimu sehingga engkau berdusta kepada Roh Kudus[a] dan diam-diam menahan sebagian dari hasil penjualan tanah itu[b][c]?”
  rationale: Revisi menggunakan “Iblis” sebagai istilah Indonesia yang mapan untuk Σατανᾶς, menambahkan “telah” untuk memperjelas tindakan lampau dalam teguran Petrus, dan memakai “hasil penjualan tanah itu” agar objek yang sebagian ditahan jelas. “Sehingga” tetap merupakan cara Indonesia yang wajar untuk mengungkapkan hubungan infinitif, tanpa menentukan secara dogmatis apakah nuansanya tujuan atau hasil.
