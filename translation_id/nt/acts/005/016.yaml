id: ACT.5.16
reference: Acts 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: id
  text: Bahkan orang banyak dari kota-kota di sekitar Yerusalem terus berkumpul[a], membawa orang-orang sakit dan mereka yang diganggu oleh roh-roh najis[b]. Mereka semua disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terus berdatangan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “disiksa oleh roh-roh najis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: terus berdatangan
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang pada masa lampau; dalam konteks orang-orang dari berbagai kota, frasa ini alami dan tetap menyampaikan aspek duratif.
- source_word: τὸ πλῆθος
  choice: orang banyak
  rationale: Ungkapan kolektif ini menyatakan sejumlah besar orang dan terdengar alami serta bermartabat dalam narasi Indonesia.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: dari kota-kota di sekitar Yerusalem
  rationale: Menunjukkan permukiman-permukiman di kawasan sekitar Yerusalem tanpa menyiratkan bahwa kota-kota itu merupakan bagian administratif Yerusalem.
- source_word: φέροντες
  choice: membawa
  rationale: Partisipel ini menerangkan tindakan yang menyertai kedatangan orang banyak, yaitu membawa para penderita.
- source_word: ἀσθενεῖς
  choice: orang-orang sakit
  rationale: Dalam konteks penyembuhan, kata ini secara wajar merujuk kepada mereka yang sakit secara fisik.
- source_word: ὀχλουμένους
  choice: mereka yang diganggu
  rationale: Mempertahankan arti umum berupa gangguan atau penderitaan tanpa otomatis meningkatkan intensitasnya menjadi siksaan.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: oleh roh-roh najis
  rationale: Mempertahankan ungkapan khas Perjanjian Baru dan rujukannya kepada roh-roh jahat yang personal.
- source_word: οἵτινες
  choice: Mereka
  rationale: Kata ganti ini merujuk kembali kepada kedua kelompok yang baru disebut; kalimat baru menghasilkan bahasa Indonesia yang lebih lancar tanpa mengubah cakupannya.
- source_word: ἐθεραπεύοντο
  choice: disembuhkan
  rationale: Bentuk pasif dipertahankan. Dalam hubungan dengan konteks narasi yang sedang berlangsung, bahasa Indonesia tidak perlu menandai aspek imperfek secara eksplisit pada verba kedua.
- source_word: ἅπαντες
  choice: semua
  rationale: Menyampaikan cakupan menyeluruh atas orang-orang sakit dan mereka yang diganggu roh najis yang dibawa.
theological_decisions:
- issue: Pemaknaan πνευμάτων ἀκαθάρτων
  choice: roh-roh najis
  alternative: roh-roh yang tidak tahir
  rationale: Pilihan ini mempertahankan ungkapan Alkitab yang dikenal dan tidak mereduksi para roh tersebut menjadi gejala psikologis atau sekadar metafora.
- issue: Cakupan ἅπαντες
  choice: Mereka semua disembuhkan
  alternative: semuanya disembuhkan
  rationale: Kata 'semua' mencakup kedua kelompok penderita yang dibawa dalam peristiwa ini, tanpa menambahkan kesimpulan teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Penanda 'terus' mempertahankan nuansa imperfek, sedangkan susunan dua kalimat menghindari rangkaian klausa yang kaku. Semua penanda catatan kaki muncul dalam teks utama.
