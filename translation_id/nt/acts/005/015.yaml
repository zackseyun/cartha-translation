id: ACT.5.15
reference: Acts 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: id
  text: Sehingga orang-orang bahkan membawa orang-orang sakit itu keluar ke jalan-jalan[a] dan membaringkan mereka di atas dipan dan tikar[b], supaya ketika Petrus lewat, setidaknya bayangannya menaungi salah seorang di antara mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke lapangan-lapangan umum.” Kata Yunani πλατείας dapat menunjuk pada jalan-jalan lebar atau ruang publik terbuka.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat tidur dan kasur tipis.” Bahasa Yunani membedakan dua jenis alas tidur atau permukaan untuk berbaring.
    reason: lexical_alternative
  - marker: c
    text: 'Ayat ini melaporkan tujuan orang-orang: mereka menempatkan orang sakit di sana dengan harapan setidaknya bayangan Petrus menaungi salah seorang di antara mereka. Ayat ini tidak secara eksplisit mengatakan bahwa bayangan itu sendiri menyembuhkan.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Akibatnya
  rationale: Menandai hasil dari pengaruh para rasul yang makin meluas dalam konteks sebelumnya.
- source_word: καὶ εἰς τὰς πλατείας
  choice: bahkan ... ke jalan-jalan
  rationale: καί memberi penekanan pada luasnya tindakan, sedangkan πλατεῖαι dapat menunjuk pada jalan-jalan lebar atau ruang publik terbuka.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: membawa mereka yang sakit
  rationale: Menggambarkan orang sakit yang dibawa keluar dari rumah ke tempat umum; ungkapan ini alami dan tetap menghormati bentuk substantival Yunani.
- source_word: τιθέναι
  choice: membaringkan
  rationale: Sesuai dengan tindakan menempatkan orang sakit di atas alas untuk berbaring.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: di atas dipan dan tikar
  rationale: Mempertahankan pembedaan antara dua macam alas berbaring yang kemungkinan bersifat portabel tanpa membuat perbedaannya terlalu teknis.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang diharapkan oleh orang-orang yang menempatkan para penderita di sana.
- source_word: ἐρχομένου Πέτρου
  choice: ketika Petrus lewat
  rationale: Konstruksi genitif absolut menggambarkan Petrus sedang bergerak melewati atau mendekati tempat mereka.
- source_word: κἂν
  choice: setidaknya
  rationale: 'Dalam konteks ini menyatakan harapan minimum: kalaupun tidak ada kontak lain, mereka berharap sekurang-kurangnya bayangan Petrus mengenai seseorang.'
- source_word: ἡ σκιὰ ἐπισκιάσῃ
  choice: bayangannya menaungi
  rationale: Mempertahankan citra harfiah dan hubungan leksikal antara nomina 'bayangan' dan verba 'menaungi'.
- source_word: τινὶ αὐτῶν
  choice: salah seorang dari antara mereka
  rationale: Mencerminkan bentuk tunggal tak tentu, yaitu siapa pun atau seorang di antara kelompok orang sakit itu.
theological_decisions:
- issue: Apakah ayat ini menyatakan bahwa bayangan Petrus sendiri memiliki kuasa penyembuhan
  choice: Terjemahan hanya menyatakan tujuan dan harapan orang-orang, bukan bahwa bayangan itu sendiri menyembuhkan.
  alternative: Merumuskan kalimat seolah-olah ayat ini secara langsung menegaskan bahwa bayangan Petrus menyembuhkan orang sakit.
  rationale: ἵνα dengan bentuk subjungtif menyajikan tujuan yang diharapkan. Ayat ini tidak secara eksplisit mengatakan bahwa bayangan itu sendiri menghasilkan kesembuhan, meskipun konteks yang lebih luas memang melaporkan banyak penyembuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Dipan dan tikar' mempertahankan dua jenis alas tanpa istilah teknis yang asing; 'menaungi' menjaga citra asli, sedangkan catatan kaki mempertahankan kehati-hatian teologis teks.
