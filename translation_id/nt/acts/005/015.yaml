revisions:
- from: Akibatnya, orang-orang bahkan membawa mereka yang sakit ke jalan-jalan[a] dan membaringkan mereka di atas dipan dan tikar[b], supaya ketika Petrus lewat, setidaknya bayangannya menaungi salah seorang dari antara mereka.[c]
  to: Sehingga orang-orang bahkan membawa orang-orang sakit itu keluar ke jalan-jalan[a] dan membaringkan mereka di atas dipan dan tikar[b], supaya ketika Petrus lewat, setidaknya bayangannya menaungi salah seorang di antara mereka.[c]
  rationale: Revisi hanya menambahkan “keluar” untuk mencerminkan prefiks ἐκ- dalam ἐκφέρειν dan mengganti penghubung awal dengan “Sehingga” untuk padanan yang lebih langsung bagi ὥστε. Struktur tujuan tetap dipertahankan, dan tidak ada kesimpulan tambahan mengenai daya penyembuhan bayangan Petrus.
