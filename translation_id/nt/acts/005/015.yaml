  verdict: revise
  source_fidelity: Perlu revisi kecil. Draf belum menyatakan secara eksplisit unsur ἐκ- dalam ἐκφέρειν, yakni bahwa orang-orang sakit itu dibawa keluar ke jalan-jalan. Selebihnya, hubungan hasil (ὥστε), tujuan/harapan (ἵνα), dan orang tunggal di antara mereka (τινὶ αὐτῶν) pada dasarnya terjaga.
  naturalness: Bahasa draf umumnya baku dan jelas. “Sehingga” lebih langsung mencerminkan fungsi konsekutif ὥστε serta mengalir baik dalam narasi. Penambahan “keluar” membuat adegan lebih lengkap tanpa memberatkan kalimat.
  terminology: “Dipan dan tikar” dapat dipertahankan sebagai dua jenis alas berbaring tanpa mengklaim pembedaan teknis yang tidak pasti. “Bayangannya menaungi” mempertahankan citra dan verba Yunani secara cukup harfiah. Catatan teologis secara tepat tidak menyatakan bahwa ayat ini sendiri melaporkan penyembuhan oleh bayangan.
