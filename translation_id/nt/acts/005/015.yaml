    issue: Unsur “keluar” dari ἐκφέρειν tidak tampak dalam terjemahan utama.
    rationale: ἐκφέρειν berarti membawa atau mengusung keluar. “Membawa mereka yang sakit ke jalan-jalan” menyampaikan tujuan, tetapi tidak secara eksplisit menyampaikan gerakan keluar yang terdapat dalam verba sumber.
  - severity: low
    issue: “Akibatnya” dapat diperhalus menjadi “Sehingga.”
    rationale: Keduanya mungkin untuk ὥστε, tetapi “sehingga” mempertahankan hubungan konsekutif secara lebih langsung dan lazim dalam kelanjutan narasi.
