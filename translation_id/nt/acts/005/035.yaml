  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: id
  text: Ia pun berkata kepada mereka, “Hai orang-orang Israel, berhati-hatilah dengan apa yang hendak kalian lakukan terhadap orang-orang ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Perhatikanlah diri kalian sendiri sehubungan dengan orang-orang ini, tentang apa yang hendak kalian lakukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε
  choice: Ia pun berkata
  rationale: Partikel τέ menghubungkan perkataan ini secara ringan dengan narasi sebelumnya. Kata “pun” mempertahankan kesinambungan itu tanpa memberi kesan urutan atau kesimpulan yang terlalu kuat.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Bersama verba berkata, πρός dengan akusatif menandai orang-orang yang diajak bicara; “kepada mereka” merupakan padanan Indonesia yang wajar.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Saudara-saudara orang Israel
  rationale: Sapaan vokatif ini ditujukan kepada para laki-laki Israel yang hadir. “Saudara-saudara orang Israel” mempertahankan bentuk sapaan kepada kelompok laki-laki dan terdengar alami serta bermartabat dalam bahasa Indonesia modern.
- source_word: προσέχετε ἑαυτοῖς
  choice: berhati-hatilah
  rationale: Imperatif ini menyerukan kewaspadaan dan pengendalian diri. “Berhati-hatilah” menyampaikan daya peringatannya secara alami; nuansa refleksifnya dijelaskan dalam catatan kaki.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: terhadap orang-orang ini
  rationale: Frasa ini menunjuk kepada orang-orang yang menjadi sasaran tindakan yang sedang dipertimbangkan. “Terhadap” cukup netral dan tidak menambahkan unsur permusuhan melebihi teks Yunani.
- source_word: τί μέλλετε πράσσειν
  choice: apa yang hendak kalian lakukan
  rationale: μέλλω dengan infinitif menyatakan tindakan yang sedang diniatkan atau segera dilakukan. “Hendak” mempertahankan unsur maksud dan orientasi ke depan, sedangkan “kalian” memperjelas bentuk jamak orang kedua.
