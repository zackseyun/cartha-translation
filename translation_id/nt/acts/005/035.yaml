translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “Saudara-saudara orang Israel” mempertahankan sifat formal serta rujukan maskulin dalam konteks sidang, sementara “kalian” menandai bahwa perintah ditujukan kepada lebih dari satu orang.
