  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: id
  text: Setelah memanggil para rasul, mereka memukuli mereka, memerintahkan mereka agar tidak berbicara dalam nama Yesus,[a] lalu membebaskan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentang nama Yesus” atau “atas dasar nama Yesus”. Ungkapan Yunani ini dapat mencakup berbicara mengenai Yesus dan di bawah otoritas-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: sesudah memanggil ... masuk
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Kata “masuk” membuat adegan pemanggilan menghadap sidang terasa alami dalam bahasa Indonesia tanpa mengubah urutan peristiwa.
- source_word: τοὺς ἀποστόλους
  choice: para rasul
  rationale: “Rasul” merupakan istilah baku dan tepat dalam konteks Kisah Para Rasul untuk para saksi yang diutus.
- source_word: δείραντες
  choice: mereka memukuli para rasul itu
  rationale: Verba δέρω berarti memukul atau menghajar. “Memukuli” menyampaikan tindakan kekerasan dengan jelas tanpa mempersempitnya menjadi jenis hukuman resmi tertentu seperti pencambukan.
- source_word: παρήγγειλαν
  choice: memerintahkan
  rationale: παραγγέλλω di sini menyatakan perintah tegas; “memerintahkan” alami dan sesuai dengan suasana resmi sidang.
- source_word: μὴ λαλεῖν
  choice: agar tidak berbicara
  rationale: μή dengan infinitif menyatakan isi larangan. “Berbicara” cocok dengan konteks kesaksian atau pemberitaan di depan umum.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: dalam nama Yesus
  rationale: Pilihan ini mempertahankan ungkapan alkitabiah yang dapat mencakup berbicara mengenai Yesus, dengan bersandar pada nama-Nya, dan di bawah otoritas-Nya.
- source_word: ἀπέλυσαν
  choice: membebaskan mereka
  rationale: ἀπολύω berarti melepaskan dari tahanan atau kekangan. “Membebaskan” sesuai dengan konteks hukum dan penahanan.
theological_decisions:
- issue: Makna ungkapan ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: dalam nama Yesus
  alternative: tentang nama Yesus; atas dasar nama Yesus
  rationale: Ungkapan Yunani ini memiliki jangkauan makna yang mencakup rujukan kepada Yesus dan tindakan berbicara berdasarkan otoritas-Nya. Terjemahan utama mempertahankan keluasan teologis itu, sedangkan catatan kaki menyajikan kemungkinan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan “para rasul itu” menghindari rangkaian pronomina yang berpotensi kabur serta menjaga alur tindakan tetap jelas.
