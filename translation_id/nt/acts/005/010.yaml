  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: id
  text: Saat itu juga ia jatuh di kaki Petrus dan mengembuskan napas terakhir. Ketika pemuda-pemuda itu masuk, mereka mendapati perempuan itu sudah mati. Lalu mereka mengusungnya ke luar dan menguburkannya di samping suaminya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: saat itu juga
  rationale: Mengungkapkan tindakan yang terjadi seketika dengan bahasa Indonesia yang alami.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: di kaki Petrus
  rationale: Pronomina Yunani merujuk kepada Petrus dalam konteks; penyebutan nama memperjelas rujukan secara alami tanpa mengubah makna.
- source_word: ἐξέψυξεν
  choice: mengembuskan napas terakhir
  rationale: Secara harfiah berkaitan dengan keluarnya napas/nyawa dan merupakan ungkapan Indonesia yang wajar serta bermartabat untuk kematian.
- source_word: οἱ νεανίσκοι
  choice: pemuda-pemuda itu
  rationale: Mempertahankan arti kelompok laki-laki muda yang telah disebut dalam konteks.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: di samping suaminya
  rationale: Dalam konteks penguburan, frasa ini berarti berdekatan dengan suaminya.
theological_decisions:
- issue: Cara menyatakan kematian Safira
  choice: mengembuskan napas terakhir
  alternative: mati
  rationale: Pilihan ini mempertahankan citra leksikal ἐξέψυξεν tanpa menambahkan penafsiran tentang keadaan jiwa atau mekanisme kematiannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur narasi dibuat alami dengan pemisahan kalimat, sementara urutan tindakan dan rincian sumber Yunani dipertahankan.
