review_pass:
  verdict: revise
  source_fidelity: 'Sebagian besar unsur sumber diterjemahkan dengan tepat: penegasan dalam Παραγγελίᾳ παρηγγείλαμεν, larangan mengajar, metafora ‘memenuhi Yerusalem’, dan tuduhan tentang darah tetap terjaga. Namun, καὶ ἰδού bersifat aditif/deiktis (‘dan lihatlah’), bukan kontrasif (‘Namun’). Selain itu, ‘menanggungkan darah ... kepada kami’ kurang lazim dan kurang langsung mencerminkan ἐπαγαγεῖν ἐφ’ ἡμᾶς (‘menimpakan ... ke atas kami’).'
  naturalness: Bahasa umumnya baku dan bernada resmi. ‘Menimpakan darah orang itu ke atas kami’ lebih alami dalam register Alkitab modern daripada ‘menanggungkan darah Orang itu kepada kami’. Huruf kapital pada ‘Orang itu’ tidak diperlukan oleh bahasa sumber dan dapat memberi penekanan interpretatif yang tidak ada dalam teks.
  terminology: ‘Ajaran’, ‘dalam nama itu’, dan ‘hendak’ sesuai konteks. ‘Orang itu’ dengan huruf kecil lebih tepat untuk mempertahankan nada merendahkan dari τοῦ ἀνθρώπου τούτου tanpa menambahkan konvensi penghormatan. Catatan kaki tetap menjelaskan idiom darah sebagai tanggung jawab atas kematian tanpa menggantikannya dalam teks utama.
  issues:
  - severity: medium
    issue: ‘Namun lihatlah’ menerjemahkan καὶ ἰδού secara adversatif.
    rationale: καί di sini menghubungkan tuduhan berikutnya, sedangkan ἰδού menarik perhatian. Tidak ada penanda pertentangan yang menuntut ‘namun’; ‘dan lihatlah’ mempertahankan hubungan sumber.
  - severity: medium
    issue: ‘menanggungkan darah Orang itu kepada kami’ kurang idiomatis dan kurang dekat dengan arah metafora Yunani.
    rationale: ἐπαγαγεῖν ἐφ’ ἡμᾶς secara harfiah menyatakan membawa/menimpakan sesuatu ke atas seseorang. ‘Menimpakan darah orang itu ke atas kami’ mempertahankan citra tersebut dan jelas dalam bahasa Indonesia.
  - severity: low
    issue: Kapitalisasi ‘Orang itu’ menambahkan penekanan yang tidak ditandai oleh ἀνθρώπου.
    rationale: Nomina umum ini dipakai dengan penunjuk yang menjauhkan (‘orang itu’). Huruf kecil lebih netral dan lebih setia pada nada ujaran penuduh.
  - severity: low
    issue: Penanda catatan kaki ditempatkan pada akhir seluruh kutipan, bukan pada idiom yang dijelaskan.
    rationale: Catatan kaki khusus menjelaskan ‘darah orang itu’; penanda sebaiknya mengikuti frasa tersebut agar jangkar rujukannya jelas.
