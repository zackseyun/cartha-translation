source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: id
  text: katanya, “Kami dengan tegas telah memerintahkan kalian untuk tidak mengajar dalam nama itu, dan lihatlah, kalian telah memenuhi Yerusalem dengan ajaran kalian dan hendak menimpakan darah orang itu ke atas kami.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih jelas, “membuat kami bertanggung jawab atas kematian orang itu.” Ungkapan Yunani ‘menimpakan darah orang itu ke atas kami’ menyatakan kesalahan atau tanggung jawab atas kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Kami sudah dengan tegas memerintahkan
  rationale: Gabungan nomina datif dan verba seakar memberi penegasan pada perintah. Ungkapan ‘dengan tegas memerintahkan’ menyampaikan daya intensif itu secara alami dalam bahasa Indonesia.
- source_word: μὴ διδάσκειν
  choice: untuk tidak mengajar
  rationale: Infinitif kini dengan μή menyatakan isi larangan. Terjemahan ini dekat dengan bentuk Yunani dan tidak menambahkan penafsiran ‘berhenti mengajar’.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: dalam nama itu
  rationale: Dalam Kisah Para Rasul, ungkapan ini berkaitan dengan bertindak atau mengajar berdasarkan wewenang yang melekat pada nama tersebut. ‘Dalam nama’ mempertahankan ungkapan sumber, sedangkan ‘itu’ mencerminkan sikap menjauh dalam τούτῳ.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Kata ini menarik perhatian secara langsung dan bernada menegur; ‘lihatlah’ alami, jelas, dan tetap bermartabat.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: kalian telah memenuhi Yerusalem
  rationale: Bentuk perfektum menyatakan tindakan yang telah terjadi dengan hasil yang masih nyata. ‘Telah memenuhi Yerusalem’ mempertahankan metafora Yunani.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: dengan ajaran kalian
  rationale: Genitif sesudah verba ‘memenuhi’ secara alami dinyatakan dengan ‘dengan’. ‘Ajaran’ menyampaikan isi διδαχή tanpa nuansa teknis tambahan.
- source_word: βούλεσθε
  choice: hendak
  rationale: Bentuk ini menyatakan kehendak atau maksud. ‘Hendak’ sesuai dengan nada tuduhan dan mengalir alami dengan infinitif berikutnya.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: menanggungkan ... kepada kami
  rationale: Ungkapan ini berarti membawa atau membebankan sesuatu ke atas pihak tertentu. ‘Menanggungkan ... kepada’ mempertahankan gagasan pembebanan tanggung jawab secara wajar dalam bahasa Indonesia.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: darah Orang itu
  rationale: Terjemahan ini mempertahankan citra darah dan sikap menjauh dalam ‘orang itu’, tanpa secara eksplisit mengganti idiom dengan penjelasan mengenai tanggung jawab atas kematian.
theological_decisions:
- issue: Makna idiom ‘menanggungkan darah Orang itu kepada kami’
  choice: Mempertahankan citra darah dalam teks utama sebagai tuduhan bahwa tanggung jawab atas kematian Yesus dibebankan kepada para pemimpin.
  alternative: ‘membuat kami bertanggung jawab atas kematian Orang itu’
  rationale: Bahasa Yunani memakai idiom darah yang mengandung gagasan kesalahan atau tanggung jawab atas kematian. Citra itu dipertahankan agar ketegangan teologis sumber tidak diselesaikan lewat parafrasa; maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan konfrontatif. ‘Kalian’ dipakai untuk ὑμῖν dan bentuk orang kedua jamak lainnya agar jumlah jamak terlihat jelas. ‘Orang itu’ memakai huruf kapital karena merujuk khusus kepada Yesus, sekaligus mempertahankan cara para penuduh menghindari penyebutan nama-Nya.
