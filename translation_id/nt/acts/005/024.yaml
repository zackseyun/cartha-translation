  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: id
  text: Ketika kepala pengawal Bait Allah dan imam-imam kepala mendengar perkataan itu, mereka bingung tentang hal itu dan bertanya-tanya semua ini akan berujung ke mana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang akan terjadi dengan semua ini.” Ungkapan Yunani menanyakan hasil atau perkembangan dari keadaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ketika
  rationale: Menyatakan hubungan waktu dan melanjutkan alur narasi secara alami tanpa menambahkan kata penanda waktu yang tidak ada dalam teks Yunani.
- source_word: ἤκουσαν
  choice: mendengar
  rationale: Padanan langsung dan wajar bagi ἀκούω dalam narasi lampau.
- source_word: τοὺς λόγους τούτους
  choice: perkataan itu
  rationale: Mempertahankan bentuk λόγους sambil merujuk secara alami pada laporan yang baru saja disampaikan.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: kepala pengawal Bait Allah
  rationale: στρατηγός menunjuk pejabat yang memimpin keamanan kawasan Bait Allah; ungkapan ini lebih jelas bagi pembaca Indonesia daripada terjemahan harfiah 'kapten Bait Allah'.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah baku untuk kelompok pemimpin keimaman dalam konteks Bait Allah, bukan pernyataan bahwa ada beberapa imam besar yang sedang menjabat.
- source_word: διηπόρουν
  choice: mereka kebingungan
  rationale: Menyampaikan keadaan tidak tahu atau sangat bingung yang berkelanjutan, sesuai aspek imperfek verba Yunani.
- source_word: περὶ αὐτῶν
  choice: mengenai hal yang dilaporkan itu (tersirat dalam 'mereka kebingungan')
  rationale: Rujukan pronomina dapat mengarah pada perkataan atau peristiwa yang dilaporkan; terjemahan tidak membatasi rujukannya secara berlebihan.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: bertanya-tanya semua ini akan berujung ke mana
  rationale: Menangkap ketidakpastian mengenai hasil atau perkembangan akhir situasi yang dinyatakan oleh optatif bersama ἄν.
