  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kepala pengawal Bait Allah' dipilih untuk memperjelas jabatan resmi, sedangkan ungkapan 'berujung ke mana' mempertahankan ketidakpastian dalam teks sumber secara alami.
