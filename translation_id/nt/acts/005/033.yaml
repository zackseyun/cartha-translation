  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: id
  text: Namun, ketika mendengar hal itu, mereka sangat geram[a] dan ingin membunuh para rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “seperti digergaji” atau “terbelah”; ungkapan ini menggambarkan gejolak batin yang sangat kuat dan bermusuhan.
