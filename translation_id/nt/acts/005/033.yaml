lexical_decisions:
- source_word: Οἱ δὲ
  choice: Namun, ... mereka
  rationale: δέ menandai peralihan yang agak kontras dari perkataan para rasul kepada reaksi kelompok yang mendengarnya; artikel dipakai secara substantival dan wajar diungkapkan dengan pronomina "mereka".
- source_word: ἀκούσαντες
  choice: ketika mendengar hal itu
  rationale: Partisip aoris dipahami secara temporal. "Hal itu" menyatakan objek yang tersirat dari konteks, yakni perkataan yang baru saja mereka dengar.
- source_word: διεπρίοντο
  choice: sangat geram
  rationale: Secara harfiah verba ini menggambarkan keadaan seperti teriris atau tergorok, tetapi dalam konteks ini menyatakan gejolak kemarahan yang keras dan bermusuhan. "Sangat geram" alami dalam bahasa Indonesia dan tidak memberi kesan pertobatan atau penyesalan.
- source_word: ἐβούλοντο
  choice: ingin
  rationale: Bentuk imperfek menyatakan kehendak atau niat yang sedang berlangsung; "ingin" menyampaikannya secara alami tanpa melebihkan kadar kepastian menjadi keputusan final.
- source_word: ἀνελεῖν
  choice: membunuh
  rationale: Dalam konteks ini ἀναιρέω berarti menghilangkan nyawa; "membunuh" langsung, jelas, dan sesuai dengan kerasnya niat tersebut.
- source_word: αὐτούς
  choice: para rasul
  rationale: Pronomina ini merujuk kepada para rasul. Pengulangan rujukan secara eksplisit menghindari kemungkinan kabur dalam bahasa Indonesia dan tetap setia pada acuannya.
