  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: id
  text: Sesudah dia, Yudas orang Galilea tampil pada masa sensus[a] dan membuat orang-orang berpaling untuk mengikutinya[b]. Dia pun binasa, dan semua orang yang telah diyakinkannya tercerai-berai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendaftaran penduduk”. Istilah Yunani dapat menunjuk pada sensus atau pencatatan resmi.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan “menarik orang-orang untuk mengikutinya”; kata kerjanya dapat mengandung arti membuat mereka meninggalkan kesetiaan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Sesudah dia
  rationale: Ungkapan μετά dengan akusatif menunjukkan urutan waktu dan di sini paling wajar merujuk kepada tokoh yang baru disebutkan. Bahasa Indonesia memerlukan rujukan yang lebih eksplisit daripada sekadar 'sesudah ini'.
- source_word: ἀνέστη
  choice: tampil
  rationale: Dalam konteks munculnya seorang pemimpin dalam sejarah, kata ini berarti tampil atau bangkit sebagai tokoh, bukan bangkit dari kematian. 'Tampil' alami dan tidak menimbulkan kesan bahasa kebangkitan.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Yudas orang Galilea
  rationale: Bentuk ini mempertahankan nama diri dan sebutan geografis yang bersifat aposisional.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: pada masa sensus
  rationale: ἀπογραφή menunjuk pada pencatatan resmi atau sensus; 'pada masa' menyampaikan ungkapan waktu Yunani secara alami dalam bahasa Indonesia.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: membuat orang-orang berpaling untuk mengikutinya
  rationale: Bentuk kausatif ἀφίστημι dapat menyatakan tindakan membuat orang meninggalkan kesetiaan sebelumnya, sedangkan ὀπίσω αὐτοῦ menyatakan bahwa mereka kemudian mengikutinya. Terjemahan ini mempertahankan kedua unsur tersebut tanpa menambahkan istilah pemberontakan yang tidak dinyatakan secara eksplisit.
- source_word: κἀκεῖνος
  choice: Dia pun
  rationale: Gabungan καί dan ἐκεῖνος melanjutkan perbandingan dengan tokoh sebelumnya; 'pun' menyampaikan nuansa 'dia juga' secara alami.
- source_word: ἀπώλετο
  choice: binasa
  rationale: Kata ini menyatakan bahwa ia mengalami kebinasaan atau mati tanpa menentukan cara kematiannya.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: semua orang yang telah diyakinkannya
  rationale: πείθω menyatakan bahwa mereka telah dibujuk atau diyakinkan olehnya. Pilihan ini mempertahankan perbedaan dari verba 'mengikuti' dalam klausa sebelumnya.
- source_word: διεσκορπίσθησαν
  choice: tercerai-berai
  rationale: Bentuk pasif ini berarti bahwa kelompok tersebut diserakkan atau tercerai-berai; pilihan ini idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran historis-politis gerakan Yudas
  choice: Ayat diterjemahkan sebagai laporan tentang Yudas yang membuat orang berpaling untuk mengikutinya, tanpa secara eksplisit menyebut pemberontakan.
  alternative: Yudas memimpin orang-orang dalam pemberontakan.
  rationale: Walaupun Yudas secara historis dikaitkan dengan pemberontakan, kalimat Yunani ini tidak memakai istilah khusus untuk pemberontakan. Terjemahan tidak menambahkan penilaian atau rincian politis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya.
