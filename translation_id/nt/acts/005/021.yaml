revisions:
- from: Setelah mendengar itu, mereka masuk ke pelataran Bait Allah menjelang fajar dan mengajar di sana. Ketika imam besar beserta orang-orang yang bersamanya tiba, mereka memanggil Mahkamah Agama dan seluruh majelis tua-tua bani Israel[a] untuk berkumpul. Kemudian mereka menyuruh orang ke penjara untuk membawa para rasul itu menghadap mereka.
  to: Setelah mendengar itu, mereka masuk ke pelataran Bait Allah saat fajar menyingsing dan mengajar di sana. Ketika imam besar beserta orang-orang yang bersamanya tiba, mereka memanggil Mahkamah Agama dan seluruh majelis tua-tua bani Israel[a] untuk berkumpul. Kemudian mereka mengutus orang ke penjara agar mereka dibawa.
  rationale: Revisi mengganti penanda waktu dengan padanan yang menunjuk saat fajar, bukan waktu sebelum fajar. Kalimat terakhir dikembalikan pada cakupan teks Yunani dengan mempertahankan bentuk pasif “agar mereka dibawa” dan menghapus “menghadap mereka,” yang merupakan penjelasan kontekstual tetapi tidak tersurat. Istilah utama dan ambiguitas hubungan antara Mahkamah Agama serta majelis tua-tua tetap dipertahankan.
