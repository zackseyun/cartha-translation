id: ACT.5.21
reference: Acts 5:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: id
  text: Setelah mendengar itu, mereka masuk ke pelataran Bait Allah saat fajar menyingsing dan mengajar di sana. Ketika imam besar beserta orang-orang yang bersamanya tiba, mereka memanggil Mahkamah Agama dan seluruh majelis tua-tua bani Israel[a] untuk berkumpul. Kemudian mereka mengutus orang ke penjara agar mereka dibawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini juga dapat dipahami sebagai “seluruh dewan Israel” atau “seluruh himpunan tua-tua Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Setelah mendengar itu
  rationale: Partisip aoris ini menyatakan urutan waktu dan mengacu kembali pada perintah malaikat dalam ayat sebelumnya. Kata 'itu' membuat rujukannya alami dalam bahasa Indonesia tanpa menjelaskan isi perintah secara berlebihan.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: menjelang fajar
  rationale: Ungkapan temporal ini menunjuk pada waktu sekitar terbitnya fajar. 'Menjelang fajar' ringkas, alami, dan mempertahankan nuansa waktunya.
- source_word: εἰς τὸ ἱερὸν
  choice: masuk ke pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah, bukan ruang kudus utama (ναός). 'Pelataran Bait Allah' menyampaikan tempat umum tempat pengajaran dapat berlangsung.
- source_word: ἐδίδασκον
  choice: mengajar di sana
  rationale: Bentuk imperfek menggambarkan kegiatan yang sedang berlangsung. Dalam susunan Indonesia, 'mengajar di sana' mengalir alami dan menghubungkan tindakan itu dengan lokasi yang baru disebut.
- source_word: Παραγενόμενος
  choice: Ketika ... tiba
  rationale: Partisip aoris memperkenalkan peristiwa berikutnya. Klausa temporal dengan 'ketika' memberikan alur naratif yang jelas.
- source_word: οἱ σὺν αὐτῷ
  choice: orang-orang yang bersamanya
  rationale: Terjemahan ini mempertahankan ketidakspesifikan teks mengenai identitas kelompok yang menyertai imam besar.
- source_word: συνεκάλεσαν
  choice: memanggil ... untuk berkumpul
  rationale: Kata kerja ini berarti memanggil atau menghimpunkan suatu badan. Bentuk ini jelas bagi pembaca modern dan tetap mencerminkan tindakan resmi untuk mengadakan pertemuan.
- source_word: τὸ συνέδριον
  choice: Mahkamah Agama
  rationale: Dalam konteks ini συνέδριον menunjuk pada badan pemerintahan Yahudi yang dikenal sebagai Sanhedrin. Istilah Indonesia yang lazim 'Mahkamah Agama' menyampaikan fungsi badan tersebut dengan jelas.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: seluruh majelis tua-tua bani Israel
  rationale: γερουσία adalah badan atau majelis para tua-tua. 'Bani Israel' mempertahankan ungkapan kekerabatan-nasional υἱῶν Ἰσραήλ, sementara struktur keseluruhan tetap membiarkan hubungan frasa ini dengan Mahkamah Agama agak terbuka seperti dalam bahasa Yunani.
- source_word: δεσμωτήριον
  choice: penjara
  rationale: Padanan Indonesia yang baku dan alami untuk tempat penahanan.
- source_word: ἀχθῆναι αὐτούς
  choice: untuk membawa para rasul itu menghadap mereka
  rationale: Infinitif pasif sesudah 'menyuruh orang' menyatakan tujuan agar para tahanan dibawa. 'Para rasul itu' menjernihkan acuan pronomina dari konteks, dan 'menghadap mereka' menyampaikan tujuan tersirat dari tindakan membawa mereka kepada sidang.
theological_decisions:
- issue: Penerjemahan τῶν υἱῶν Ἰσραήλ
  choice: bani Israel
  alternative: orang Israel; bangsa Israel
  rationale: Ungkapan sumber secara harfiah berarti 'anak-anak lelaki Israel' tetapi berfungsi sebagai sebutan nasional tradisional. 'Bani Israel' mempertahankan citra keturunan dan identitas historis tanpa menyiratkan bahwa hanya laki-laki Israel yang dimaksud.
- issue: Hubungan antara συνέδριον dan γερουσία
  choice: Mahkamah Agama dan seluruh majelis tua-tua bani Israel
  alternative: Mahkamah Agama, yaitu seluruh majelis tua-tua Israel
  rationale: Kata καί secara formal menghubungkan kedua sebutan, tetapi hubungan tepatnya dapat bersifat koordinatif atau ekspansif/apposisional. Teks utama mempertahankan bentuk koordinatif dan catatan kaki mengakui kemungkinan pembacaan yang lebih idiomatis tanpa memutuskan identitas kedua badan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. 'Bait Allah', 'Mahkamah Agama', 'tua-tua', dan 'bani Israel' dipilih sebagai istilah yang mudah dikenali dalam konteks Alkitab. Susunan kalimat menjaga perbedaan antara kompleks Bait Allah dan ruang kudus utama serta mempertahankan ketegangan mengenai hubungan Mahkamah Agama dengan majelis tua-tua.
