  verdict: revise
  source_fidelity: Revisi diperlukan untuk ketepatan temporal dan untuk menghindari penambahan makna. ὑπὸ τὸν ὄρθρον menunjuk waktu fajar/dini hari, sedangkan “menjelang fajar” lazimnya berarti sebelum fajar. Selain itu, “menghadap mereka” menyatakan tujuan yang tidak disebutkan secara eksplisit dalam teks Yunani. Struktur koordinatif antara συνέδριον dan seluruh γερουσία dipertahankan.
  naturalness: Teks hasil revisi tetap memakai bahasa Indonesia baku, modern, dan bernada naratif resmi. “Saat fajar menyingsing” lebih alami dan tepat daripada “menjelang fajar”; “agar mereka dibawa” menyampaikan infinitif pasif Yunani tanpa memperkenalkan pelaku atau tujuan tambahan.
  terminology: “Pelataran Bait Allah” secara tepat membedakan ἱερόν, kompleks Bait Allah, dari ναός. “Mahkamah Agama” dan “majelis tua-tua bani Israel” mempertahankan register Alkitabiah yang dapat dipahami. Catatan kaki mempertahankan kemungkinan padanan yang lebih idiomatis bagi γερουσία τῶν υἱῶν Ἰσραήλ.
  issues:
  - severity: medium
    issue: “Menjelang fajar” kurang tepat untuk ὑπὸ τὸν ὄρθρον.
    rationale: Dalam pemakaian Indonesia, “menjelang fajar” biasanya berarti sebelum fajar, sedangkan ungkapan Yunani menunjuk saat fajar atau dini hari ketika fajar mulai terbit.
  - severity: medium
    issue: “Menghadap mereka” menambahkan tujuan yang tidak dinyatakan.
    rationale: ἀχθῆναι αὐτούς hanya menyatakan bahwa mereka diperintahkan dibawa; walaupun tujuan ke sidang tersirat dari konteks, teks sumber tidak menyebut “menghadap mereka.”
  - severity: low
    issue: “Menyuruh orang ... untuk membawa” mengubah konstruksi pasif menjadi tindakan pelaku yang tidak disebutkan.
    rationale: Maknanya pada dasarnya dapat dipahami, tetapi “mengutus ke penjara agar mereka dibawa” lebih dekat dengan ἀπέστειλαν ... ἀχθῆναι αὐτούς dan mempertahankan ketidakspesifikan pelaku.
