  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: id
  text: 'Dan sekarang aku berkata kepadamu: jauhilah orang-orang ini dan biarkan mereka. Sebab jika rencana ini atau pekerjaan ini berasal dari manusia[a], hal itu akan runtuh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersumber pada manusia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “akan dihancurkan” atau “akan lenyap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: sekarang
  rationale: Ungkapan temporal idiomatis yang memperkenalkan nasihat Gamaliel pada saat itu; “sekarang” alami dan mempertahankan fungsi wacananya.
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: Jauhilah orang-orang ini
  rationale: Imperatif ini menuntut pemisahan dan tidak ikut campur; “jauhilah” menyampaikan daya praktisnya secara ringkas dan wajar.
- source_word: ἄφετε αὐτούς
  choice: biarkan mereka
  rationale: Dalam konteks ini berarti tidak mengganggu atau mengambil tindakan lebih lanjut terhadap mereka.
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari nasihat Gamaliel.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: jika ... berasal dari manusia
  rationale: ἐξ menyatakan sumber atau asal. “Berasal dari manusia” alami dalam bahasa Indonesia dan mempertahankan kontras dengan asal dari Allah pada ayat berikutnya.
- source_word: ἡ βουλὴ αὕτη ἢ τὸ ἔργον τοῦτο
  choice: rencana atau pekerjaan ini
  rationale: βοῦλή menunjuk rencana atau maksud, sedangkan ἔργον menunjuk pekerjaan atau kegiatan; pasangan istilah ini dipertahankan tanpa menyamakannya.
- source_word: καταλυθήσεται
  choice: semuanya itu akan runtuh
  rationale: Bentuk pasif mendatang menyatakan bahwa rencana atau pekerjaan tersebut akan dibubarkan, dihancurkan, atau gagal. “Akan runtuh” alami untuk suatu gerakan atau usaha, sementara cakupan subjek gabungan diperjelas dengan “semuanya itu”.
theological_decisions:
- issue: Makna ἐξ ἀνθρώπων dalam kontras dengan ayat berikutnya
  choice: berasal dari manusia
  alternative: berasal dari orang-orang tertentu
  rationale: Bentuk jamak ἀνθρώπων di sini menyatakan asal manusiawi secara umum dan dikontraskan dengan “dari Allah” dalam ayat 39; terjemahan tidak membatasi asal itu hanya kepada para pemimpin laki-laki tertentu.
- issue: Rujukan tunggal καταλυθήσεται setelah dua nomina yang dihubungkan ἢ
  choice: semuanya itu akan runtuh
  alternative: hal itu akan dihancurkan
  rationale: Predikat tunggal dapat merangkum “rencana atau pekerjaan ini” sebagai satu usaha. Terjemahan menjaga kesatuan gagasan tanpa menentukan secara berlebihan apakah keruntuhannya terjadi sendiri atau melalui pelaku luar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. “Aku” dipakai karena Gamaliel berbicara dalam bentuk orang pertama tunggal; “kepadamu” mewakili bentuk jamak ὑμῖν secara alami dalam bahasa Indonesia. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
