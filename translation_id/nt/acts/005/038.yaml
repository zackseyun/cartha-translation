  verdict: revise
  source_fidelity: Perlu revisi kecil. Pembuka Yunani καὶ τὰ νῦν berarti “dan sekarang / maka sekarang” dalam alur ujaran, bukan “karena itu,” yang menambahkan hubungan kesimpulan yang tidak dinyatakan. Selebihnya, nasihat untuk menjauh dan membiarkan mereka, asal manusiawi, serta akibat kehancuran/runtuhnya rencana atau pekerjaan telah ditangkap dengan baik.
  naturalness: Bahasa baku dan jelas. “Dan sekarang” lebih alami sekaligus lebih setia daripada “Karena itu, sekarang.” Pengulangan “ini” pada “rencana ini atau pekerjaan ini” membantu mencerminkan demonstratif pada kedua nomina Yunani tanpa terasa kaku.
  terminology: “Berasal dari manusia” secara tepat mempertahankan kontras sumber manusiawi dengan Allah pada ayat berikutnya tanpa membatasi ἀνθρώπων kepada laki-laki. “Rencana” dan “pekerjaan” mempertahankan pembedaan βουλή dan ἔργον. “Akan runtuh” merupakan padanan Indonesia yang wajar bagi καταλυθήσεται dalam konteks suatu rencana atau usaha.
