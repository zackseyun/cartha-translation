id: ACT.5.31
reference: Acts 5:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: id
  text: Dia inilah yang telah Allah tinggikan ke sebelah kanan-Nya sebagai Pemimpin dan Juru Selamat,[a] untuk mengaruniakan pertobatan kepada Israel dan pengampunan dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tangan kanan-Nya.” Frasa Yunani ini dapat dipahami sebagai sarana, meskipun dalam konteks ini kemungkinan besar menunjuk kepada pengangkatan ke tempat kehormatan tertinggi di sebelah kanan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: Dia inilah
  rationale: Konstruksi ini mempertahankan penekanan demonstratif yang secara khusus menunjuk kembali kepada Yesus, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἀρχηγὸν
  choice: Pemimpin
  rationale: Dalam konteks pengagungan dan pemerintahan ini, kata tersebut menunjuk kepada orang yang berada di depan atau menjadi kepala; 'Pemimpin' jelas dan tidak mempersempit maknanya menjadi gelar kebangsawanan.
- source_word: σωτῆρα
  choice: Juru Selamat
  rationale: Padanan baku dan bermartabat dalam konteks kristologis, yang mencakup tindakan menyelamatkan dan membebaskan.
- source_word: ὕψωσεν
  choice: telah ... tinggikan
  rationale: Menyatakan tindakan Allah mengangkat Yesus kepada kehormatan dan kewenangan yang luhur, bukan hanya membangkitkan-Nya dari kematian.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: ke sebelah kanan-Nya
  rationale: Memahami datif sebagai tujuan atau kedudukan, sesuai gambaran penobatan dan tempat kehormatan tertinggi; kemungkinan instrumental tetap dicatat dalam catatan kaki.
- source_word: τοῦ δοῦναι
  choice: untuk mengaruniakan
  rationale: Infinitif berartikel menyatakan tujuan. 'Untuk' mempertahankan hubungan tujuan, sedangkan 'mengaruniakan' menyampaikan bahwa pertobatan dan pengampunan diberikan oleh Allah.
- source_word: μετάνοιαν
  choice: pertobatan
  rationale: Padanan Indonesia yang mapan dan tepat untuk perubahan arah batin serta berbalik kepada Allah, bukan sekadar perubahan pikiran.
- source_word: τῷ Ἰσραὴλ
  choice: kepada Israel
  rationale: Menandai Israel sebagai penerima dari apa yang Allah karuniakan.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: pengampunan dosa
  rationale: Ungkapan Indonesia yang alami dan baku untuk pelepasan atau penghapusan kesalahan akibat dosa.
theological_decisions:
- issue: Makna pengagungan Yesus dengan frasa τῇ δεξιᾷ αὐτοῦ
  choice: Allah meninggikan Yesus ke kedudukan kehormatan dan kewenangan di sebelah kanan-Nya.
  alternative: Allah meninggikan Yesus dengan tangan kanan-Nya.
  rationale: Konteks pengagungan dan pemakaian gambaran penobatan dalam Perjanjian Baru lebih mendukung makna lokatif atau arah, tetapi bentuk datif Yunani juga memungkinkan makna instrumental; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Pertobatan sebagai pemberian Allah
  choice: Menerjemahkan δοῦναι μετάνοιαν dengan 'mengaruniakan pertobatan'.
  alternative: Memberikan kesempatan kepada Israel untuk bertobat.
  rationale: Teks Yunani secara langsung menyebut pertobatan sebagai hal yang diberikan. Terjemahan tidak mengubahnya menjadi sekadar kesempatan dan membiarkan ketegangan teologis teks tetap ada.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dia inilah' mempertahankan penekanan sumber tanpa menjadi kaku; 'Juru Selamat' dipertahankan sebagai istilah yang umum dikenal. Kapitalisasi pronomina ilahi mengikuti gaya penerbitan Indonesia yang lazim.
