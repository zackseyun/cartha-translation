  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: id
  text: Lalu mereka menangkap para rasul dan menempatkan mereka dalam tahanan umum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkan mereka di tempat tahanan umum.” Ungkapan Yunani ini dapat menunjuk pada keadaan ditahan atau dikurung secara lebih umum, bukan hanya pada sebuah bangunan penjara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: menangkap
  rationale: Ungkapan ini secara harfiah berarti ‘menumpangkan/meletakkan tangan atas’, tetapi dalam konteks tindakan bermusuhan dan penahanan berarti menangkap. ‘Menangkap’ menyampaikan daya idiomatisnya secara alami dalam bahasa Indonesia dan menghindari kesan pemberkatan atau penahbisan.
- source_word: ἀποστόλους
  choice: para rasul
  rationale: Dalam Kisah Para Rasul, istilah ini merupakan sebutan yang sudah dikenal bagi para utusan yang diberi amanat oleh Yesus, bukan sekadar utusan pada umumnya.
- source_word: ἔθεντο
  choice: menahan
  rationale: Secara harfiah berarti ‘menempatkan’, tetapi bersama ἐν τηρήσει menunjuk pada tindakan memasukkan atau menempatkan seseorang dalam tahanan. ‘Menahan’ menghasilkan ungkapan Indonesia yang wajar.
- source_word: ἐν τηρήσει
  choice: di tempat tahanan
  rationale: τήρησις dapat menunjuk pada penjagaan, penahanan, atau tempat penahanan. Pilihan ini mempertahankan kemungkinan tempat kurungan fisik tanpa secara khusus menetapkannya sebagai bangunan penjara.
- source_word: δημοσίᾳ
  choice: umum
  rationale: Bentuk ini menerangkan τηρήσει dan paling mungkin menunjuk pada tempat penahanan umum atau resmi, bukan tindakan yang dilakukan secara terbuka di hadapan publik.
theological_decisions: []
