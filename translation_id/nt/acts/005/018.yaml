  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Menangkap’ menerjemahkan idiom Yunani secara komunikatif, sedangkan ‘tempat tahanan umum’ mempertahankan keluasan makna frasa penahanan tanpa mempersempitnya menjadi penjara tertentu.
