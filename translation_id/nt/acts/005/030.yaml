id: ACT.5.30
reference: Acts 5:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: id
  text: Allah nenek moyang kita telah membangkitkan Yesus[a], yang telah kamu bunuh dengan menggantung-Nya pada sebuah pohon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mengangkat” atau “telah membangunkan.” Kata kerja Yunani ini dapat merujuk pada kebangkitan, meskipun ayat ini tidak secara tersurat mengatakan “dari antara orang mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pada salib.” Teks Yunani berbunyi “pada sebuah pohon,” yang kemungkinan menggemakan Ulangan 21:23.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Allah nenek moyang kita
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gema rumusan alkitabiah tentang Allah yang disembah para leluhur Israel.
- source_word: ἤγειρεν
  choice: telah membangkitkan
  rationale: Kata kerja ini dalam konteks tersebut menunjuk kuat kepada kebangkitan Yesus, tetapi tidak secara tersurat memuat frasa 'dari antara orang mati'; catatan kaki mempertahankan keluasan leksikalnya.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: διεχειρίσασθε
  choice: telah kamu bunuh
  rationale: Dalam konteks ini kata tersebut menyatakan tindakan kekerasan yang mengakibatkan kematian. Terjemahan ini langsung, jelas, dan sesuai dengan klausa partisipial berikutnya.
- source_word: κρεμάσαντες
  choice: dengan menggantung-Nya
  rationale: Partisip aoris dipahami secara instrumental, yaitu menjelaskan cara mereka membunuh Yesus.
- source_word: ἐπὶ ξύλου
  choice: pada kayu
  rationale: ξύλον dapat berarti kayu atau pohon. 'Kayu' mempertahankan pilihan leksikal sumber dan gema terhadap Ulangan 21:23 tanpa menggantinya secara interpretatif dengan 'salib'.
theological_decisions:
- issue: Apakah ἤγειρεν harus diterjemahkan dengan bahasa kebangkitan yang eksplisit atau dalam arti lebih umum
  choice: telah membangkitkan
  alternative: telah membangunkan / telah membangkitkan dari antara orang mati
  rationale: Konteks sangat kuat menunjuk kepada kebangkitan, tetapi ayat ini sendiri tidak menyebut 'dari antara orang mati'. Terjemahan utama tidak menambahkan frasa tersebut, sedangkan catatan mencatat kemungkinan keluasan makna.
- issue: Apakah ξύλου diterjemahkan secara langsung sebagai 'salib' atau dipertahankan sebagai sebutan kayu/pohon
  choice: pada kayu
  alternative: pada salib / pada pohon
  rationale: Teks Yunani memakai ξύλον, bukan σταυρός. 'Kayu' menjaga bentuk ungkapan dan kemungkinan gema Ulangan 21:23, sementara catatan menjelaskan rujukannya kepada salib.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan tekanan pada tindakan Allah dan pertentangannya dengan tindakan para pemimpin. Pronomina objek kapital pada 'menggantung-Nya' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
