  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: id
  text: Setelah membawa mereka masuk, para petugas menghadapkan mereka kepada dewan[a]. Lalu imam besar menanyai mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sanhedrin.” Kata Yunani συνέδριον merujuk kepada dewan penguasa Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Setelah membawa mereka masuk
  rationale: Partisip aoris aktif ini menyatakan tindakan yang terjadi sebelum verba utama. Bentuk ini mempertahankan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: —
  rationale: δέ berfungsi sebagai penghubung naratif ringan. Tidak diterjemahkan secara tersendiri karena alur kalimat Indonesia sudah jelas tanpa kata penghubung tambahan.
- source_word: ἔστησαν
  choice: menghadapkan
  rationale: Bentuk transitif dari ἵστημι berarti membuat seseorang berdiri atau menempatkannya. Dalam suasana pemeriksaan resmi, 'menghadapkan' menyampaikan tindakan membawa seseorang ke hadapan badan pengadilan secara alami.
- source_word: ἐν τῷ συνεδρίῳ
  choice: kepada Dewan
  rationale: συνέδριον menunjuk pada dewan pemerintahan Yahudi. Dengan verba 'menghadapkan', preposisi 'kepada' menghasilkan ungkapan Indonesia yang alami, sedangkan 'Dewan' mempertahankan arti leksikal istilah itu.
- source_word: ἐπηρώτησεν
  choice: menanyai
  rationale: ἐπερωτάω berarti bertanya atau menanyai. Dalam konteks yudisial, 'menanyai' menyampaikan pemeriksaan resmi tanpa memberi tekanan sekeras 'menginterogasi'.
- source_word: ὁ ἀρχιερεὺς
  choice: imam besar
  rationale: Padanan baku dan tepat bagi ἀρχιερεύς dalam konteks ini, yaitu imam besar Yahudi yang memimpin persidangan.
- source_word: implicit subject of Ἀγαγόντες / ἔστησαν
  choice: para petugas
  rationale: Subjek jamak tersirat merujuk kepada para petugas yang disebut dalam konteks sebelumnya. Penyebutan ini menghindari rangkaian pronomina 'mereka ... mereka' yang kabur dalam bahasa Indonesia tanpa mengubah pelaku narasi.
theological_decisions:
- issue: Penerjemahan συνέδριον
  choice: Dewan
  alternative: Sanhedrin; Mahkamah Agama
  rationale: Istilah Yunani diterjemahkan menurut arti dasarnya sebagai dewan, bukan langsung diganti dengan nama tradisional. Catatan kaki menjelaskan bahwa badan yang dimaksud ialah Sanhedrin, sehingga rujukan historis tetap jelas tanpa mempersempit teks utama secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menghadapkan' dipilih untuk suasana persidangan; 'menanyai' mempertahankan nada pemeriksaan resmi tanpa melebihkannya menjadi interogasi keras.
