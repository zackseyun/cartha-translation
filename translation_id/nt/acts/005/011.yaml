  naturalness: '"Ketakutan besar melanda" adalah ungkapan baku dan alami dalam bahasa Indonesia modern serta menyampaikan daya peristiwa dari ἐγένετο φόβος μέγας ἐπί. "Lalu" memberi penghubung naratif yang wajar untuk καί tanpa menambahkan hubungan sebab-akibat yang tegas.'
