  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: id
  text: Lalu, ketakutan besar melanda seluruh jemaat[a] dan semua orang yang mendengar hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sidang jemaat” atau “gereja” untuk “jemaat” (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο φόβος μέγας ἐφ’
  choice: diliputi ketakutan yang besar
  rationale: Ungkapan ini menyampaikan secara alami bahwa ketakutan yang hebat menimpa dan menguasai orang-orang, sambil mempertahankan daya peristiwa dari ἐγένετο dan konstruksi ἐπί.
- source_word: ὅλην τὴν ἐκκλησίαν
  choice: seluruh jemaat
  rationale: Dalam konteks Kisah Para Rasul, ἐκκλησία menunjuk kepada komunitas orang percaya. 'Jemaat' adalah padanan Indonesia yang alami dan tidak harus berarti gedung atau lembaga.
- source_word: καὶ ἐπὶ πάντας
  choice: demikian juga semua orang
  rationale: Pilihan ini mempertahankan kelompok kedua yang turut diliputi ketakutan dan menyatakan kesejajaran kedua frasa secara wajar dalam bahasa Indonesia.
- source_word: τοὺς ἀκούοντας ταῦτα
  choice: yang mendengar tentang hal-hal itu
  rationale: Kata 'tentang' memperjelas bahwa mereka mendengar kabar mengenai kejadian tersebut, sedangkan 'hal-hal itu' mempertahankan bentuk jamak ταῦτα.
theological_decisions:
- issue: Penerjemahan ἐκκλησία
  choice: jemaat
  alternative: perkumpulan; gereja
  rationale: '''Jemaat'' dengan tepat menunjuk kepada komunitas orang percaya dalam konteks ini tanpa mudah disalahpahami sebagai gedung gereja atau memasukkan bentuk kelembagaan tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara cakupan 'seluruh' dan 'semua orang' serta bentuk jamak 'hal-hal itu' dipertahankan.
