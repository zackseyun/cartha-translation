base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: id
  text: Sesudah kira-kira tiga jam berlalu, istrinya masuk tanpa mengetahui apa yang telah terjadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Sesudah ... berlalu
  rationale: Gabungan ini mengembangkan alur cerita dan memperkenalkan peristiwa berikutnya. Dalam bahasa Indonesia, transisi itu tersampaikan secara alami melalui klausa waktu tanpa perlu menambahkan penanda wacana tersendiri seperti “Lalu”.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: kira-kira tiga jam
  rationale: διάστημα menunjuk pada rentang waktu, sedangkan ὡς bersama ukuran menyatakan perkiraan. Bentuk “kira-kira tiga jam berlalu” mempertahankan kedua unsur itu secara wajar.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: istrinya
  rationale: Dalam konteks ini γυνή merujuk kepada istri Ananias; bentuk posesif terikat merupakan ungkapan Indonesia yang alami.
- source_word: μὴ εἰδυῖα
  choice: tanpa mengetahui
  rationale: Partisip ini menyatakan keadaan sang istri ketika ia masuk. “Tanpa mengetahui” menjaga hubungan serentak tersebut dengan ringkas dan alami.
- source_word: τὸ γεγονὸς
  choice: apa yang telah terjadi
  rationale: Partisip perfek yang dibendakan ini merujuk pada peristiwa yang sudah terjadi sebelumnya. “Telah terjadi” menyampaikan keadaan hasil dari tindakan terdahulu tanpa memperinci sesuatu yang tidak dinyatakan dalam ayat.
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Kata kerja ini berarti memasuki suatu tempat. Karena lokasi dan sudut geraknya sudah jelas dari konteks, “masuk” adalah padanan Indonesia yang tepat dan alami.
