id: ACT.5.1
reference: Acts 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: id
  text: Namun, seorang bernama Ananias menjual suatu milik bersama dengan istrinya, Safira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “properti”; istilah Yunani ini dapat merujuk secara luas kepada suatu milik atau harta, termasuk harta tak bergerak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: seorang
  rationale: Gabungan ἀνήρ dan τις memperkenalkan tokoh laki-laki secara tak tentu. Dalam bahasa Indonesia, “seorang” menyatakannya dengan alami tanpa ungkapan kaku “seorang tertentu”.
- source_word: δέ
  choice: Namun
  rationale: δέ menandai kontras ringan dengan teladan Barnabas dalam konteks sebelumnya. “Namun” mempertahankan peralihan kontrastif itu secara wajar.
- source_word: Ἁνανίας ὀνόματι
  choice: bernama Ananias
  rationale: Ungkapan datif ὀνόματι berarti “bernama” atau “dengan nama”; susunan “bernama Ananias” alami dalam narasi Indonesia.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: bersama Safira, istrinya
  rationale: σύν menyatakan penyertaan, sedangkan γυνή dalam konstruksi ini jelas berarti istri. Aposisi dengan koma menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: ἐπώλησεν
  choice: menjual
  rationale: Bentuk aoristus aktif indikatif dari πωλέω menyatakan tindakan lampau dalam narasi; bahasa Indonesia tidak memerlukan penandaan kala pada verba.
- source_word: κτῆμα
  choice: sebidang tanah
  rationale: κτῆμα dapat berarti milik atau properti, dan konteks Kisah Para Rasul 4–5 menunjuk pada harta tak bergerak. “Sebidang tanah” konkret dan alami, tetapi alternatif yang lebih luas perlu dicatat karena istilah Yunani tidak secara leksikal terbatas pada tanah.
theological_decisions:
- issue: Kontras naratif dengan teladan Barnabas sebelumnya
  choice: Menerjemahkan δέ sebagai “Namun”
  alternative: “Lalu” atau “dan” sebagai peralihan yang lebih netral
  rationale: Konteks memperhadapkan tindakan Barnabas dengan tindakan Ananias dan Safira. “Namun” menjaga daya kontras δέ tanpa menambahkan penilaian teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama ditransliterasikan menurut bentuk Indonesia yang lazim: Ananias dan Safira. Penempatan “istrinya” sebagai aposisi menghindari konstruksi yang terasa kaku.'
