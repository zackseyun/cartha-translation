  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: id
  text: Dan kami adalah saksi tentang hal-hal ini,[a] demikian juga Roh Kudus,[b] yang telah diberikan Allah kepada orang-orang yang menaati-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan-perkataan ini” atau “perkara-perkara ini.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan Roh Kudus”; predikat dari klausa sebelumnya dipahami berlanjut: “dan Roh Kudus [adalah saksi].”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: saksi
  rationale: Padanan baku dan alami dalam konteks kesaksian para rasul; mempertahankan nuansa orang yang memberi kesaksian langsung.
- source_word: ῥημάτων τούτων
  choice: semua hal ini
  rationale: ῥῆμα dapat berarti perkataan, hal, atau perkara. Dalam konteks ini frasa tersebut menunjuk pada seluruh pokok yang baru dinyatakan dan secara alami diterjemahkan 'semua hal ini'.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dalam bahasa Indonesia modern untuk sebutan ilahi ini.
- source_word: ὃ
  choice: yang
  rationale: Pronomina relatif bahasa Indonesia tidak menandai gender gramatikal; 'yang' secara wajar mengacu kepada Roh Kudus tanpa memaksakan penjelasan tambahan.
- source_word: ἔδωκεν
  choice: telah ... karuniakan
  rationale: Aoristus menyatakan tindakan pemberian; 'telah ... karuniakan' menyampaikan tindakan lampau yang tetap relevan dan sesuai dengan pemberian ilahi, tanpa mengubah objeknya menjadi sekadar benda.
- source_word: πειθαρχοῦσιν
  choice: menaati
  rationale: Kata ini berarti taat kepada pihak yang berwenang. 'Menaati' jelas dan selaras dengan konteks langsung tentang menaati Allah daripada manusia dalam Kisah Para Rasul 5:29.
- source_word: αὐτῷ
  choice: -Nya
  rationale: Pronomina ini merujuk kembali kepada Allah. Bentuk '-Nya' mempertahankan kohesi pronominal dan membuat rujukannya tetap jelas.
theological_decisions:
- issue: Apakah Roh Kudus ditampilkan sebagai saksi bersama para rasul
  choice: demikian juga Roh Kudus
  alternative: dan Roh Kudus [adalah saksi]
  rationale: Klausa kedua dalam bahasa Yunani tidak memiliki verba tersurat dan secara alami meneruskan predikat dari klausa pertama. 'Demikian juga' memperjelas elipsis itu dalam bahasa Indonesia tanpa menambahkan isi baru.
- issue: Cakupan penerima Roh Kudus dalam frasa τοῖς πειθαρχοῦσιν αὐτῷ
  choice: orang-orang yang menaati-Nya
  alternative: mereka yang tunduk kepada-Nya
  rationale: Terjemahan mempertahankan pernyataan teks apa adanya tanpa menjelaskan jenis, derajat, atau dasar ketaatan secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat lancar bagi pembaca umum sambil mempertahankan elipsis Yunani melalui ungkapan 'demikian juga'. Kapitalisasi dan bentuk '-Nya' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
