  text: ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: id
  text: Lalu orang-orang yang lebih muda[a] berdiri, membungkus jenazahnya, mengusungnya ke luar, lalu menguburkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang muda.” Kata Yunani νεώτεροι berbentuk komparatif dan dapat berarti “orang-orang yang lebih muda” atau, secara lebih umum, “orang-orang muda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: berdiri
  rationale: Partisip aoris dari ἀνίστημι menunjukkan bahwa mereka bangkit atau berdiri untuk bertindak. 'Berdiri' alami dalam urutan naratif bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan peristiwa; 'Lalu' menyampaikan gerak maju narasi secara alami.
- source_word: οἱ νεώτεροι
  choice: orang-orang yang lebih muda
  rationale: νεώτεροι berbentuk komparatif dan kemungkinan membedakan mereka dari orang-orang yang lebih tua. Bentuk ini mempertahankan nuansa komparatif asli tanpa menentukan peranan resmi mereka.
- source_word: συνέστειλαν αὐτὸν
  choice: membungkus jenazahnya
  rationale: Dalam konteks kematian dan pemakaman, συστέλλω menunjuk pada merapatkan atau membungkus tubuh. 'Jenazahnya' menjelaskan acuan fisiknya secara wajar dalam bahasa Indonesia tanpa memperluasnya menjadi seluruh proses persiapan pemakaman.
- source_word: ἐξενέγκαντες
  choice: mengusungnya ke luar
  rationale: Partisip aoris dari ἐκφέρω berarti membawa ke luar. 'Mengusung' cocok untuk membawa jenazah dan mempertahankan tindakan fisik yang tersirat.
- source_word: ἔθαψαν
  choice: menguburkannya
  rationale: θάπτω secara langsung berarti menguburkan; pilihan ini baku, jelas, dan sesuai dengan ragam naratif.
