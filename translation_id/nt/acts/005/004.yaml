revisions:
- from: Selama tanah itu belum dijual, bukankah tanah itu tetap milikmu? Setelah dijual, bukankah hasilnya tetap berada dalam wewenangmu?[a] Mengapa engkau menaruh perkara ini dalam hatimu? Engkau bukan berdusta kepada manusia, melainkan kepada Allah.
  to: Selama tanah itu belum dijual, bukankah tanah itu tetap milikmu? Setelah dijual, bukankah hasil penjualannya tetap dalam kuasamu?[a] Mengapa engkau menaruh perkara ini dalam hatimu? Engkau berdusta bukan kepada manusia, melainkan kepada Allah.
  rationale: Revision corrects the Indonesian placement of negation in the final antithesis so that it unequivocally states that Ananias lied to God rather than to human beings. It also substitutes the more idiomatic “dalam kuasamu” for personal authority/control, while retaining an alternative that reflects the narrower sense of “wewenang.” No doctrinal explanation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:24Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the two rhetorical questions, continued ownership before sale, and the seller's authority over what was sold. However, the final Indonesian construction “Engkau bukan berdusta kepada manusia, melainkan kepada Allah” is not an idiomatic way to express the Greek contrast and can be read as denying that Ananias lied at all. The contrast must instead modify the object of his lying.
  naturalness: The register is appropriately formal and modern. “Dalam kuasamu” is more idiomatic than “dalam wewenangmu” for ἐν ... ἐξουσίᾳ in this context, which concerns personal control/disposal rather than an official sphere of jurisdiction. “Engkau berdusta bukan kepada ...” is clear, natural Indonesian.
  terminology: “Allah,” “manusia,” “hati,” and “perkara” are suitable. “Hasil penjualannya” makes explicit the contextually understood referent after the sale and properly conveys Peter's point concerning control of the proceeds.
  issues:
  - severity: medium
    issue: The final contrast is expressed with “bukan berdusta kepada manusia.”
    rationale: 'Greek οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ means that the lie was not directed to human beings but to God. In Indonesian, place “bukan” with the prepositional object: “Engkau berdusta bukan kepada manusia, melainkan kepada Allah.”'
  - severity: low
    issue: “Dalam wewenangmu” is less natural for the authority/control over sale proceeds intended by ἐξουσία.
    rationale: “Dalam kuasamu” is established, natural Indonesian for a person's control or power of disposal, without weakening the owner's freedom of decision.
  revised_text: Selama tanah itu belum dijual, bukankah tanah itu tetap milikmu? Setelah dijual, bukankah hasil penjualannya tetap dalam kuasamu?[a] Mengapa engkau menaruh perkara ini dalam hatimu? Engkau berdusta bukan kepada manusia, melainkan kepada Allah.
  revised_footnotes:
  - marker: a
    text: Atau, “tetap berada dalam wewenangmu” atau “dapat kaupergunakan menurut kehendakmu.”
    reason: lexical_alternative
  revision_rationale: Revision corrects the Indonesian placement of negation in the final antithesis so that it unequivocally states that Ananias lied to God rather than to human beings. It also substitutes the more idiomatic “dalam kuasamu” for personal authority/control, while retaining an alternative that reflects the narrower sense of “wewenang.” No doctrinal explanation has been added.
