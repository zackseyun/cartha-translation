id: ACT.5.4
reference: Acts 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: id
  text: Selama tanah itu belum dijual, bukankah tanah itu tetap milikmu? Setelah dijual, bukankah hasil penjualannya tetap dalam kuasamu?[a] Mengapa engkau menaruh perkara ini dalam hatimu? Engkau berdusta bukan kepada manusia, melainkan kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetap berada dalam wewenangmu” atau “dapat kaupergunakan menurut kehendakmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: selama ... belum dijual ... tetap
  rationale: Ungkapan ini menyampaikan keadaan tanah sebelum penjualan dan mempertahankan gagasan keberlanjutan dalam pengulangan verba Yunani, tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: σοὶ
  choice: milikmu
  rationale: Datif ini menyatakan kepemilikan; 'milikmu' merupakan padanan Indonesia yang alami dan tepat.
- source_word: πραθὲν
  choice: setelah dijual
  rationale: Klausa temporal ini secara alami menyampaikan partisip aoris pasif dan urutan keadaan sesudah penjualan.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: tetap berada dalam wewenangmu
  rationale: ἐξουσία mencakup hak, kuasa, atau kendali. 'Dalam wewenangmu' mempertahankan gagasan bahwa Ananias berhak menentukan penggunaan hasil penjualan.
- source_word: τί ὅτι
  choice: Mengapa
  rationale: Dalam bahasa Indonesia, 'Mengapa' secara wajar menyampaikan pertanyaan bernada teguran tanpa meniru idiom Yunani secara kaku.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: engkau menaruh ... dalam hatimu
  rationale: Padanan ini mempertahankan citra 'hati' dan tindakan batin dari teks sumber, serta membiarkan kadar antara gagasan, niat, dan keputusan tetap cukup terbuka.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: perkara ini
  rationale: '''Perkara'' cukup luas untuk πρᾶγμα dan tidak menambahkan penafsiran seperti ''rencana jahat'' atau ''tipu daya'' ke dalam teks.'
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Engkau bukan berdusta kepada manusia, melainkan kepada Allah
  rationale: '''Manusia'' secara alami mencakup manusia pada umumnya dalam bahasa Indonesia dan mempertahankan kontras retoris dengan Allah. Bentuk ''bukan ... melainkan'' menyampaikan fokus kontras Yunani.'
theological_decisions:
- issue: Implikasi keilahian Roh dalam konteks langsung (bdk. Kisah Para Rasul 5:3)
  choice: Menerjemahkan τῷ θεῷ secara langsung sebagai 'kepada Allah' tanpa penjelasan tambahan.
  alternative: Menambahkan 'yakni kepada Roh Kudus' untuk menyelaraskan ayat ini secara eksplisit dengan ayat 3.
  rationale: Ayat ini sendiri berkata 'kepada Allah'. Konteksnya penting secara teologis, tetapi penjelasan harmonis tidak perlu dimasukkan ke dalam teks terjemahan.
- issue: Kepemilikan dan kebebasan atas tanah serta hasil penjualannya
  choice: Menunjukkan bahwa tanah itu milik Ananias dan hasil penjualannya berada dalam wewenangnya.
  alternative: Menggambarkannya hanya sebagai kepemilikan pasif tanpa hak menentukan penggunaannya.
  rationale: Argumen Petrus menegaskan bahwa kesalahannya bukan karena tidak menyerahkan seluruh harta, melainkan karena berdusta; ἐξουσία menyatakan hak atau kendali yang nyata.
- issue: Cakupan ἀνθρώποις
  choice: Menggunakan 'manusia'.
  alternative: Menggunakan 'orang-orang' atau 'laki-laki'.
  rationale: Dalam konteks ini ἀνθρώποις bersifat generik. 'Manusia' tepat, ringkas, dan mempertahankan kontras antara manusia dan Allah tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai sesuai register Alkitab dan tuturan langsung yang serius. Nomina 'tanah' dan 'hasilnya' dibuat eksplisit dari konteks agar rujukan partisip dan subjek tersirat Yunani jelas bagi pembaca Indonesia; penambahan ini tidak mengubah isi proposisional.
