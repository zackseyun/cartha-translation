id: ACT.5.34
reference: Acts 5:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: id
  text: Namun, seorang Farisi bernama Gamaliel berdiri di tengah Mahkamah Agama[a]. Ia seorang pengajar Taurat yang dihormati oleh seluruh rakyat. Ia memerintahkan agar orang-orang itu dibawa keluar sebentar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahkamah Agama adalah dewan pemerintahan dan pengadilan tertinggi Yahudi, yang juga dikenal sebagai Sanhedrin.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, bahasa Yunani berbunyi “membuat orang-orang itu berada di luar sebentar,” yaitu menyuruh agar mereka dikeluarkan untuk sementara waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini menyatakan tindakan Gamaliel bangkit berdiri untuk berbicara di tengah persidangan; “berdiri” alami dan tetap mempertahankan gambaran fisiknya.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang agak kontras dari niat keras para anggota majelis pada ayat sebelumnya kepada campur tangan Gamaliel.
- source_word: τις ... Φαρισαῖος
  choice: seorang Farisi
  rationale: τις memperkenalkan tokoh baru secara tak tentu; dalam bahasa Indonesia hal itu wajar dinyatakan dengan “seorang”.
- source_word: ἐν τῷ συνεδρίῳ
  choice: di tengah Mahkamah Agama
  rationale: συνέδριον di sini adalah dewan pemerintahan dan pengadilan Yahudi; “Mahkamah Agama” merupakan sebutan Indonesia yang jelas, sedangkan catatan kaki memberi istilah historis Sanhedrin.
- source_word: ὀνόματι Γαμαλιήλ
  choice: bernama Gamaliel
  rationale: Ungkapan datif ini secara idiomatis berarti bahwa nama orang tersebut adalah Gamaliel.
- source_word: νομοδιδάσκαλος
  choice: seorang pengajar Taurat
  rationale: Kata majemuk ini menunjuk kepada orang yang mengajarkan νόμος; dalam konteks Yahudi, “Taurat” lebih tepat daripada hukum secara umum.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: yang dihormati oleh seluruh rakyat
  rationale: τίμιος menyatakan penghargaan sosial, dan datif παντὶ τῷ λαῷ menunjukkan pihak yang menghormatinya tanpa menambahkan “Israel” yang tidak tersurat.
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: κελεύω menyatakan instruksi berwenang, sesuai dengan suasana pengadilan.
- source_word: ἔξω ... ποιῆσαι
  choice: agar ... dibawa keluar
  rationale: Ungkapan harfiah “membuat [mereka] di luar” merupakan idiom untuk menyuruh orang dipindahkan ke luar; bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat kausatif perintah tersebut.
- source_word: βραχύ
  choice: sebentar
  rationale: Akusatif adverbial ini menunjukkan jangka waktu yang singkat; “sebentar” ringkas dan alami.
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang itu
  rationale: Dalam konteks, kata ini mengacu kepada para rasul laki-laki yang sedang diadili. Bahasa Indonesia tidak harus menandai jenis kelamin pada nomina ini, dan “orang-orang itu” mengidentifikasi kelompok yang dimaksud tanpa memperluasnya kepada manusia pada umumnya.
theological_decisions:
- issue: Identitas νόμος dalam gelar νομοδιδάσκαλος
  choice: pengajar Taurat
  alternative: pengajar hukum
  rationale: Konteks Gamaliel sebagai seorang Farisi dalam dewan Yahudi menunjukkan bahwa νόμος adalah Taurat, bukan hukum sipil secara umum.
- issue: Rujukan bergender τοὺς ἀνθρώπους
  choice: orang-orang itu
  alternative: para lelaki itu
  rationale: Referennya memang para rasul laki-laki, tetapi “orang-orang itu” adalah penyebutan Indonesia yang alami bagi kelompok tertentu dan tidak mengubah referen; “para lelaki” akan memberi penekanan gender yang tidak diperlukan dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar jelas bagi pembaca umum tanpa mengubah urutan informasi atau hubungan tindakannya.
