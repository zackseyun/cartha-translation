id: ACT.5.42
reference: Acts 5:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: id
  text: Setiap hari, di kompleks Bait Allah dan dari rumah ke rumah, mereka tidak berhenti mengajar dan memberitakan kabar baik bahwa Yesus adalah Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “memberitakan kabar baik tentang Yesus Sang Mesias” atau “memberitakan Yesus sebagai Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Setiap hari
  rationale: Ungkapan waktu ini menyatakan kegiatan yang terus dilakukan dari hari ke hari; 'setiap hari' alami dan tepat dalam bahasa Indonesia.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kompleks Bait Allah, bukan hanya ruang sucinya; penambahan 'kompleks' mencegah salah pengertian.
- source_word: κατ’ οἶκον
  choice: dari rumah ke rumah
  rationale: κατά dengan οἶκον tunggal memiliki daya distributif, yaitu kegiatan yang dilakukan di berbagai rumah.
- source_word: οὐκ ἐπαύοντο
  choice: mereka tidak berhenti
  rationale: Bentuk imperfek menyatakan kegiatan berkelanjutan; ungkapan ini jelas dan alami.
- source_word: διδάσκοντες
  choice: mengajar
  rationale: Padanan langsung dan lazim bagi διδάσκω, dengan aspek kegiatan berkelanjutan ditopang oleh verba utama.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik
  rationale: Menyampaikan makna mengumumkan kabar baik tanpa bergantung pada istilah gerejawi yang mungkin kurang transparan.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: bahwa Yesus adalah Mesias
  rationale: Dalam konstruksi ini frasa akusatif dapat menyatakan isi pemberitaan. 'Mesias' menerjemahkan gelar Χριστός dan mengungkapkan klaim tentang identitas Yesus secara alami.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar yang menyatakan identitas Yesus sebagai Yang Diurapi, sehingga 'Mesias' mempertahankan arti gelarnya.
- issue: Daya sintaksis τὸν χριστὸν Ἰησοῦν sesudah εὐαγγελιζόμενοι
  choice: 'isi pemberitaan: ''bahwa Yesus adalah Mesias'''
  alternative: '''Yesus Sang Mesias'' sebagai objek langsung'
  rationale: Frasa Yunani memungkinkan bentuk objek langsung, tetapi bahasa Indonesia lebih alami menyatakan isi kabar itu dengan klausa. Alternatif yang lebih harfiah tetap dicatat karena konstruksinya memiliki keluwesan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Bait Allah' dipertahankan sebagai sebutan lazim bagi tempat ibadah di Yerusalem, sedangkan 'kompleks' memperjelas cakupan ἱερόν.
