  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: id
  text: Kemudian kepala pengawal Bait Allah pergi bersama para petugas dan membawa rasul-rasul itu, tetapi tanpa kekerasan, karena mereka takut kepada orang banyak kalau-kalau mereka dilempari batu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατηγὸς
  choice: kepala pengawal Bait Allah
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk kepada pejabat yang bertanggung jawab atas ketertiban di Bait Allah, bukan seorang jenderal Romawi. Penyebutan Bait Allah memperjelas jabatan itu bagi pembaca Indonesia.
- source_word: ὑπηρέταις
  choice: para petugas
  rationale: Istilah ini menunjuk kepada bawahan resmi yang mendampingi kepala pengawal. 'Para petugas' alami dalam bahasa Indonesia dan tidak mempersempitnya secara berlebihan menjadi polisi dalam pengertian modern.
- source_word: ἤγαγεν αὐτούς
  choice: membawa rasul-rasul itu
  rationale: ἄγω berarti membawa atau menuntun. Acuan pronomina dibuat eksplisit sebagai 'rasul-rasul itu' agar jelas dan alami dalam narasi Indonesia, tanpa menambahkan tujuan gerak yang tidak dinyatakan dalam ayat ini.
- source_word: οὐ μετὰ βίας
  choice: tetapi tanpa kekerasan
  rationale: Ungkapan ini menerangkan bahwa mereka tidak menggunakan paksaan atau tindakan keras. 'Tanpa kekerasan' ringkas, jelas, dan mempertahankan kontrasnya.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: karena mereka takut kepada orang banyak
  rationale: Bentuk imperfek menyatakan ketakutan yang berlangsung dalam situasi itu. 'Orang banyak' sesuai dengan masyarakat yang hadir sebagai kelompok dan lebih kontekstual daripada istilah abstrak seperti 'rakyat'.
- source_word: μὴ λιθασθῶσιν
  choice: kalau-kalau mereka dilempari batu
  rationale: μή dengan subjungtif setelah verba takut menyatakan akibat yang dikhawatirkan. Bentuk pasif dan pelaku yang tidak disebutkan tetap dipertahankan.
- source_word: τότε ἀπελθὼν
  choice: Kemudian ... pergi
  rationale: Partisip ini menyertai verba utama dalam urutan naratif dan paling alami diterjemahkan sebagai tindakan berurutan, tanpa mempertahankan konstruksi partisipial secara kaku.
theological_decisions: []
