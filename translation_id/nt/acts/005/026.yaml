  verdict: approve
  source_fidelity: Terjemahan dengan tepat menyampaikan urutan naratif τότε ἀπελθών, peran στρατηγός dalam konteks Bait Allah, para ὑπηρέται, tindakan membawa para rasul, penolakan penggunaan kekerasan, serta alasan ketakutan akan orang banyak. “Kalau-kalau mereka dilempari batu” mempertahankan hasil yang dikhawatirkan dan tidak menyebut pelaku secara eksplisit, seperti dalam bentuk pasif Yunani.
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Kepala pengawal Bait Allah,” “para petugas,” dan “orang banyak” jelas dan alami. Rujukan “mereka” dalam klausa akhir secara wajar merujuk kepada kepala pengawal dan para petugas.
  terminology: “Kepala pengawal Bait Allah” secara tepat membedakan jabatan ini dari jenderal Romawi tanpa memaksakan istilah kepolisian modern. “Para petugas” merupakan padanan cukup luas bagi ὑπηρέται. “Dilempari batu” menghindari implikasi prosedur hukum tertentu yang dapat muncul pada “dirajam,” sambil tetap menyampaikan ancaman pelemparan batu.
