id: ACT.5.8
reference: Acts 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: id
  text: Lalu Petrus berkata kepadanya, “Katakan kepadaku, apakah kalian menjual tanah itu dengan harga sebesar ini?” Jawabnya, “Ya, sebesar itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: Lalu Petrus berkata kepadanya
  rationale: Dalam narasi dialog bahasa Indonesia, konstruksi ini paling alami diterjemahkan sebagai pengantar ucapan. δέ menandai kelanjutan atau peralihan adegan, sehingga dipilih 'Lalu', sedangkan ἀπεκρίθη tidak harus diterjemahkan secara kaku sebagai 'menjawab' karena tidak ada ucapan langsung Safira tepat sebelumnya.
- source_word: Εἰπέ μοι
  choice: Katakan kepadaku
  rationale: Mempertahankan bentuk imperatif dan datif penerima secara jelas serta wajar dalam bahasa Indonesia.
- source_word: εἰ
  choice: apakah
  rationale: εἰ memperkenalkan pertanyaan ya-tidak tidak langsung setelah perintah 'Katakan kepadaku'; 'apakah' mempertahankan struktur itu dengan alami.
- source_word: τοσούτου
  choice: dengan harga sebesar ini / sebesar itu
  rationale: Istilah ini menunjuk pada jumlah yang sedang diperlihatkan atau disebutkan. Dalam pertanyaan digunakan 'ini'; dalam jawaban, sudut pandang penutur secara alami menjadi 'itu', tanpa mengubah jumlah yang dirujuk.
- source_word: τὸ χωρίον
  choice: tanah itu
  rationale: χωρίον di sini merujuk pada sebidang tanah atau milik tak bergerak yang dijual. 'Tanah itu' alami dan tidak memberi ketepatan tambahan yang tidak dituntut teks.
- source_word: ἀπέδοσθε
  choice: kalian menjual
  rationale: Dalam konteks transaksi, ἀποδίδωμι berarti 'menjual'. Bentuk verba orang kedua jamak dipertahankan dengan 'kalian', merujuk kepada Safira bersama Ananias.
- source_word: Ναί
  choice: Ya
  rationale: Jawaban afirmatif sederhana diterjemahkan langsung.
theological_decisions:
- issue: Jumlah pelaku dalam ἀπέδοσθε
  choice: kalian
  alternative: kamu
  rationale: Bentuk Yunani adalah orang kedua jamak. Terjemahan 'kalian' mempertahankan bahwa Petrus menanyakan penjualan yang dilakukan Safira bersama pihak lain, sesuai konteks, tanpa menyamarkan bentuk gramatikal sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami sambil mempertahankan bentuk jamak pada kata kerja Yunani dan hubungan antara pertanyaan dengan jawaban.
