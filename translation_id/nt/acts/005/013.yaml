  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: id
  text: Namun, tidak seorang pun dari antara orang-orang lain berani menggabungkan diri dengan mereka; sebaliknya, orang banyak sangat menghormati mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Namun, ... dari orang-orang lain
  rationale: Ungkapan ini menunjuk kepada pihak-pihak lain di luar kelompok yang baru disebutkan. 'Orang-orang lain' mempertahankan keluasan rujukan sumber tanpa menentukan secara berlebihan siapa mereka.
- source_word: οὐδεὶς ἐτόλμα
  choice: tidak seorang pun ... berani
  rationale: Menyampaikan penyangkalan menyeluruh dan nuansa keberanian atau kenekatan dalam ἐτόλμα.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: bergabung dengan mereka
  rationale: Dalam konteks kelompok sosial, κολλᾶσθαι berarti melekatkan diri atau menggabungkan diri. 'Bergabung dengan' alami dalam bahasa Indonesia dan tidak memaksakan bentuk keanggotaan tertentu.
- source_word: ἀλλ’
  choice: Meskipun demikian
  rationale: Menandai kontras antara keengganan orang lain untuk bergabung dan penghormatan orang banyak kepada mereka; pilihan ini menghindari pengulangan 'namun' sambil menjaga daya kontras.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: orang banyak sangat menghormati mereka
  rationale: ἐμεγάλυνεν secara harfiah berarti membesarkan atau meninggikan, dan dalam konteks ini menyatakan penghargaan tinggi. 'Sangat menghormati' jelas, alami, dan sesuai dengan makna kontekstual; ὁ λαός diterjemahkan 'orang banyak' karena merujuk pada masyarakat umum.
theological_decisions:
- issue: Identitas 'mereka' (αὐτοῖς/αὐτούς)
  choice: Mempertahankan pronomina 'mereka'
  alternative: Menjelaskannya sebagai 'para rasul' atau seluruh komunitas orang percaya
  rationale: Ayat ini sendiri tidak menyebut ulang antesedennya secara eksplisit. Mempertahankan pronomina menjaga kemungkinan rujukan yang tersedia dari konteks dan tidak menyelesaikan ambiguitas secara sepihak.
- issue: Identitas 'orang-orang lain' (τῶν λοιπῶν)
  choice: orang-orang lain
  alternative: orang-orang yang belum percaya atau orang-orang di luar jemaat
  rationale: Teks Yunani tidak secara eksplisit menetapkan status iman atau hubungan kelembagaan mereka. Terjemahan umum mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada naratif yang bermartabat. Dua kalimat dipakai agar kontras Yunani tetap jelas tanpa menghasilkan kalimat Indonesia yang kaku.
