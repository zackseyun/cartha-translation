  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: id
  text: Ia diam-diam menahan sebagian hasil penjualan itu bagi dirinya sendiri[a], dengan sepengetahuan istrinya, lalu membawa sebagian uang itu dan meletakkannya di kaki para rasul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyisihkan sebagian hasil penjualan itu bagi dirinya sendiri”; kata Yunani yang dipakai menyiratkan tindakan menahan atau mengambil bagi diri sendiri secara tidak jujur.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di kaki para rasul,” suatu gambaran konkret tentang meletakkan uang itu di hadapan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: menahan sebagian ... untuk dirinya sendiri
  rationale: Kata kerja ini menyatakan tindakan menyisihkan atau menahan sesuatu bagi diri sendiri dengan nuansa tidak jujur. Ungkapan ini mempertahankan daya moral tersebut tanpa mempersempitnya menjadi istilah hukum seperti 'menggelapkan'.
- source_word: ἀπὸ τῆς τιμῆς
  choice: dari hasil penjualan itu
  rationale: Dalam konteks penjualan tanah pada ayat sebelumnya, τιμή menunjuk pada uang yang diperoleh dari penjualan. 'Hasil penjualan' alami dalam bahasa Indonesia dan lebih jelas daripada 'harga'.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: dan istrinya pun mengetahuinya
  rationale: Konstruksi genitif absolut menyatakan keadaan yang menyertai tindakan tersebut. 'Pun' mencerminkan καί dan menunjukkan bahwa sang istri mengetahui perbuatan itu.
- source_word: ἐνέγκας μέρος τι
  choice: Lalu ia membawa sebagian dari uang itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. 'Sebagian dari uang itu' mengungkapkan bagian yang tidak ditentukan secara wajar dan memperjelas rujukannya dalam bahasa Indonesia.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: meletakkannya di kaki para rasul
  rationale: Terjemahan ini mempertahankan gambaran konkret dan ungkapan khas dalam Kisah Para Rasul tentang penyerahan uang di hadapan kewenangan para rasul.
theological_decisions:
- issue: Daya moral tindakan Ananias
  choice: Menampilkan tindakan itu sebagai penahanan bagi diri sendiri yang bersifat tidak jujur.
  alternative: Ia menyimpan sebagian uang itu.
  rationale: νοσφίζομαι dan konteks naratif menunjukkan penahanan yang tersembunyi dan menipu, bukan sekadar keputusan netral untuk menyimpan sebagian uang. Namun, teks utama tidak menambahkan kategori hukum yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, tanpa mengubah urutan tindakan atau hubungan maknanya.
