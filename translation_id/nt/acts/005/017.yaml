  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: id
  text: Namun, Imam Besar itu bangkit. Ia dan semua orang yang bersamanya—yaitu golongan Saduki[a]—dipenuhi rasa iri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekte Saduki.” Kata Yunani ini dapat berarti golongan, aliran, atau sekte.
    reason: lexical_alternative
  - marker: b
    text: Atau “kecemburuan.” Kata Yunani ini juga dapat berarti “semangat,” tetapi dalam konteks ini makna yang bermusuhan lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: bertindak
  rationale: Partisip aoris ἀνίστημι di sini berfungsi secara idiomatis untuk mengawali tindakan tegas, bukan terutama menggambarkan perubahan posisi tubuh. 'Bertindak' menyampaikan daya naratifnya secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang berlawanan dengan tanggapan positif terhadap para rasul dalam konteks sebelumnya.
- source_word: ὁ ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku dan jelas bagi jabatan tunggal ἀρχιερεύς.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: semua orang yang berpihak kepadanya
  rationale: Frasa ini menunjuk kelompok yang menyertai atau bersekutu dengan Imam Besar; 'berpihak kepadanya' mempertahankan hubungan kelompok tanpa menentukan jabatan mereka.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: yaitu golongan Saduki
  rationale: Frasa aposisional ini mengidentifikasi kelompok tersebut. 'Golongan' menyatakan kelompok sosial-keagamaan tanpa konotasi sesat yang mungkin melekat pada 'sekte'.
- source_word: ἐπλήσθησαν
  choice: Mereka dipenuhi
  rationale: Mempertahankan idiom pasif πίμπλημι dengan pelengkap genitif, sekaligus memakai subjek eksplisit agar kalimat Indonesia alami dan jelas.
- source_word: ζήλου
  choice: rasa iri
  rationale: ζῆλος dapat berarti semangat, kecemburuan, atau iri hati; dalam konteks permusuhan terhadap para rasul, makna negatif paling sesuai.
theological_decisions:
- issue: Makna αἵρεσις
  choice: golongan
  alternative: sekte
  rationale: Kata ini menunjuk kelompok atau faksi yang dikenal dalam Yudaisme zaman itu, bukan dengan sendirinya ajaran sesat dalam pengertian polemis kemudian.
- issue: Makna ζῆλος dalam konteks
  choice: rasa iri
  alternative: semangat atau kecemburuan
  rationale: Walaupun istilah Yunani ini dapat bernilai positif atau negatif, konteks tindakan bermusuhan menuntut nuansa negatif; catatan mempertahankan rentang leksikal aslinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat dibagi menjadi dua agar rangkaian subjek dan keterangan aposisional tetap mudah dipahami. 'Bertindak' menangkap fungsi idiomatis Ἀναστὰς tanpa memberi kesan bahwa tindakan utamanya sekadar berdiri.
