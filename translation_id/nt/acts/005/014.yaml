  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: id
  text: Dan semakin banyak orang yang percaya kepada Tuhan terus ditambahkan—dalam jumlah besar, baik laki-laki maupun perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergabung.” Kata kerja Yunani berbentuk imperfek dan dapat menyatakan pertambahan yang berlangsung terus. Bentuknya dapat dipahami sebagai pasif, yang mungkin menyiratkan Allah sebagai pelaku penambahan, atau dengan nuansa bahwa orang-orang itu bergabung.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: makin banyak
  rationale: Mengungkapkan daya komparatif yang menandai pertambahan berkelanjutan secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Dan
  rationale: Partikel ini di sini bersifat penghubung ringan dalam kelanjutan narasi, bukan pertentangan kuat.
- source_word: προσετίθεντο
  choice: ditambahkan
  rationale: Bentuk imperfek pasif menggambarkan proses penambahan yang terus berlangsung serta mempertahankan kemungkinan bahwa Allah tersirat sebagai pelakunya.
- source_word: πιστεύοντες
  choice: orang yang percaya
  rationale: Partisipel kini dipakai secara substantival; frasa ini alami dan tidak menambahkan istilah teknis yang tidak harus ada.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Datif menunjukkan Tuhan sebagai tujuan iman atau kepercayaan; 'percaya kepada Tuhan' merupakan ungkapan Indonesia yang wajar.
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar reverensial dan kristologis tanpa menggantinya secara interpretatif dengan nama Yesus.
- source_word: πλήθη
  choice: sejumlah besar
  rationale: Menyampaikan jumlah yang sangat banyak secara alami; dalam konstruksi ini bentuk jamak Yunani menjelaskan besarnya kelompok laki-laki dan perempuan.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: laki-laki dan perempuan
  rationale: Mempertahankan penyebutan kedua kelompok secara eksplisit dan daya korelatif τε καί tanpa susunan Indonesia yang kaku.
theological_decisions:
- issue: Rujukan dan daya ungkapan 'Tuhan'
  choice: '''Tuhan'' dipertahankan sebagai gelar yang dalam konteks Kisah Para Rasul paling mungkin merujuk kepada Yesus, dan orang-orang itu percaya kepada-Nya.'
  alternative: '''Tuhan'' dapat dipahami secara lebih umum sebagai Allah.'
  rationale: Konteks ringkasan pemberitaan dalam Kisah Para Rasul mendukung rujukan kepada Yesus, tetapi teks utama tidak memperluas gelar itu menjadi 'Yesus' sehingga bentuk dan kemungkinan nuansa sumber tetap terjaga.
- issue: Diateksis dan aspek προσετίθεντο
  choice: 'Makna pasif dan berkelanjutan: orang-orang terus ditambahkan.'
  alternative: 'Nuansa medial atau intransitif: orang-orang bergabung.'
  rationale: Bentuk imperfek mendukung proses yang berlangsung, sedangkan bentuk pasif dapat menyiratkan Allah sebagai pelaku tanpa menyebut-Nya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan penekanan pada pertambahan jumlah serta penyebutan laki-laki dan perempuan, sementara catatan kaki menjaga ambiguitas antara makna pasif 'ditambahkan' dan makna 'bergabung'.
