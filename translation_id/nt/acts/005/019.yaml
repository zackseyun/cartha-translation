  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: id
  text: Namun, pada malam hari seorang malaikat Tuhan membuka pintu-pintu penjara itu, membawa mereka keluar, lalu berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: seorang malaikat
  rationale: Nomina ini tanpa artikel dan dalam konteks pembebasan adikodrati menunjuk pada makhluk surgawi; bentuk 'seorang' tidak menambahkan ketertentuan yang tidak dinyatakan dalam bahasa Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam ungkapan ἄγγελος κυρίου, 'malaikat Tuhan' merupakan padanan Alkitabiah yang wajar dan mempertahankan gelar κύριος.
- source_word: διὰ νυκτός
  choice: pada malam hari
  rationale: Frasa διά dengan genitif di sini menyatakan waktu. Padanan ini alami dalam bahasa Indonesia modern tanpa menyiratkan bahwa tindakan berlangsung sepanjang malam.
- source_word: ἤνοιξε
  choice: membuka
  rationale: Verba ἀνοίγω berarti 'membuka'; 'membuka kunci' akan menambahkan rincian yang tidak dinyatakan.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: pintu-pintu penjara itu
  rationale: Bentuk jamak θύρας dipertahankan sebagai 'pintu-pintu', sedangkan φυλακῆς dalam konteks ini berarti 'penjara'. Kata 'itu' menandai penjara yang sudah diketahui dari konteks.
- source_word: ἐξαγαγών
  choice: membawa mereka keluar
  rationale: Partisip ἐξάγω menyatakan bahwa malaikat menyebabkan mereka keluar; padanan ini wajar dan tidak mempersempit makna menjadi sekadar menuntun.
- source_word: τε
  choice: lalu
  rationale: Partikel τε menghubungkan tindakan partisipial dengan verba utama. 'Lalu' menghasilkan urutan naratif yang alami tanpa memberi penekanan berlebihan.
- source_word: εἶπεν
  choice: berkata
  rationale: Dalam narasi, aoristus λέγω paling alami diterjemahkan 'berkata'; koma penutup menandakan bahwa isi perkataan berlanjut pada ayat berikutnya.
theological_decisions:
- issue: Hakikat ἄγγελος dalam konteks
  choice: malaikat surgawi
  alternative: utusan manusia
  rationale: Pembukaan pintu penjara dan pembebasan para rasul dalam konteks ini bersifat adikodrati, sehingga 'malaikat' lebih tepat daripada 'utusan'.
- issue: Padanan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam ungkapan tetap 'malaikat Tuhan', padanan ini setia pada gelar Yunani dan sesuai dengan pemakaian Alkitabiah yang mapan tanpa menentukan lebih jauh identitas referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk jamak 'pintu-pintu', sifat tidak tentu dari 'seorang malaikat', dan kesinambungan ujaran ke ayat berikutnya.
