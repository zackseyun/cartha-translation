  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: id
  text: Namun, ketika para petugas tiba, mereka tidak menemukan rasul-rasul itu di dalam penjara. Mereka pun kembali dan melapor,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: tiba
  rationale: Partisip ini menyatakan tibanya para petugas di penjara; “tiba” alami dalam narasi Indonesia dan mempertahankan makna temporalnya.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Dalam konteks ini kata tersebut menunjuk kepada pelayan resmi di bawah wewenang para pemimpin Yahudi, bukan pelayan rumah tangga. “Para petugas” tepat tanpa mempersempitnya secara eksplisit menjadi polisi Bait Allah.
- source_word: οὐχ εὗρον
  choice: tidak menemukan
  rationale: Padanan langsung dan idiomatis untuk tindakan mencari tetapi tidak mendapati orang yang dimaksud.
- source_word: αὐτούς
  choice: rasul-rasul itu
  rationale: Pronomina Yunani merujuk kepada para rasul dalam konteks sebelumnya. Penyebutan nomina memperjelas rujukan bagi pembaca Indonesia tanpa menambah identitas baru.
- source_word: ἐν τῇ φυλακῇ
  choice: di dalam penjara
  rationale: Artikel menunjuk kepada penjara tertentu yang sudah disebut; “penjara” mempertahankan latar kelembagaan dan “di dalam” menyampaikan ἐν secara wajar.
- source_word: ἀναστρέψαντες
  choice: kembali
  rationale: Dalam konteks ini partisip tersebut berarti para petugas pergi kembali kepada pihak yang mengutus mereka.
- source_word: ἀπήγγειλαν
  choice: melaporkannya
  rationale: Verba ini menyatakan penyampaian laporan. Akhiran “-nya” merujuk secara alami kepada keadaan yang baru saja mereka dapati.
- source_word: δέ ... δέ
  choice: Namun ... Lalu
  rationale: δέ pertama menandai kontras dengan harapan bahwa para rasul akan ditemukan, sedangkan δέ kedua menghubungkan tindakan berikutnya dalam urutan naratif.
