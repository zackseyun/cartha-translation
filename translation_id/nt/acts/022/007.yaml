base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: id
  text: Aku jatuh ke tanah dan mendengar suara yang berkata kepadaku, “Saulus, Saulus, mengapa engkau menganiaya Aku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Aku jatuh
  rationale: Bentuk aoristus orang pertama tunggal dari πίπτω menyatakan tindakan lampau yang lugas; “Aku jatuh” alami dalam bahasa Indonesia.
- source_word: τε
  choice: dan
  rationale: Partikel τε menghubungkan peristiwa ini dengan konteks sebelumnya; dalam bahasa Indonesia daya penghubungnya dapat diwakili secara alami oleh “dan” dalam rangkaian klausa.
- source_word: εἰς τὸ ἔδαφος
  choice: ke tanah
  rationale: Ungkapan ini secara idiomatis menunjukkan tempat jatuh dan paling alami diterjemahkan “ke tanah”.
- source_word: ἤκουσα φωνῆς
  choice: mendengar suatu suara
  rationale: Genitif φωνῆς sesudah ἀκούω secara alami berfungsi sebagai objek dalam bahasa Indonesia. “Suatu suara” mempertahankan sifat tak tentu dari penyebutan pertama.
- source_word: λεγούσης μοι
  choice: berkata kepadaku
  rationale: Partisipel kini ini menerangkan suara dan menunjukkan tindakan yang berlangsung bersamaan; datif μοι diterjemahkan secara eksplisit sebagai “kepadaku”.
- source_word: Σαοὺλ Σαούλ
  choice: Saulus, Saulus
  rationale: Nama tersebut memakai bentuk Indonesia yang lazim dalam konteks Perjanjian Baru, dan pengulangannya dipertahankan sebagai sapaan langsung yang menekankan.
- source_word: τί
  choice: mengapa
  rationale: Dalam pertanyaan tentang tindakan, τί menanyakan alasan dan secara alami diterjemahkan “mengapa”.
- source_word: με
  choice: Aku
  rationale: Kata ganti objek orang pertama dipertahankan secara langsung; huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: διώκεις
  choice: engkau menganiaya
  rationale: Dalam konteks permusuhan terhadap Yesus dan para pengikut-Nya, διώκω berarti “menganiaya.” Bentuk kini mempertahankan tindakan yang sedang atau terus dilakukan; susunan Indonesia tidak memerlukan penanda progresif tambahan.
theological_decisions:
- issue: Hubungan sang pembicara dengan tindakan Saulus terhadap orang-orang percaya
  choice: Mempertahankan objek langsung “Aku” tanpa penjelasan tambahan.
  alternative: Memperluasnya menjadi “umat-Ku” atau “para pengikut-Ku.”
  rationale: Daya teologis ayat ini terletak pada identifikasi langsung antara penganiayaan terhadap orang percaya dan penganiayaan terhadap sang pembicara. Terjemahan tidak boleh menguraikan atau mempersempit pernyataan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Engkau” dipakai dalam sapaan langsung karena tetap jelas dan sesuai dengan register Alkitab Indonesia; “suatu suara” menjaga ketakrifan sumber tanpa terdengar kaku.
