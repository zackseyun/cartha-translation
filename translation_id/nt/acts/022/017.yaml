  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: id
  text: Setelah saya kembali ke Yerusalem, ketika sedang berdoa di kompleks Bait Allah[a], saya mengalami keadaan ekstase[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai menunjuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, ungkapan Yunani ini berarti “menjadi berada dalam ekstase,” yaitu memasuki suatu keadaan kesadaran yang tidak biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: terjadilah bahwa saya mengalami
  rationale: Formula naratif ini memperkenalkan pengalaman berikutnya dalam kesaksian Paulus. Susunan tersebut mempertahankan gagasan bahwa sesuatu terjadi pada dirinya tanpa menjadi terlalu harfiah dan kaku.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: ketika saya sudah kembali ke Yerusalem
  rationale: Partisip aoris menunjukkan bahwa kepulangan itu mendahului pengalaman utama; 'sudah kembali' menyatakan urutan tersebut secara alami.
- source_word: καὶ προσευχομένου μου
  choice: dan sedang berdoa
  rationale: Konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung bersamaan dengan pengalaman utama.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: saya mengalami keadaan tidak sadarkan diri
  rationale: Ungkapan Yunani berarti memasuki ἔκστασις, yakni keadaan di luar kesadaran biasa yang berkaitan dengan penglihatan. Pilihan ini dapat dipahami pembaca Indonesia dan tidak menyiratkan mekanisme lebih jauh daripada teks.
theological_decisions:
- issue: Sifat pengalaman Paulus dalam ἐκστάσει
  choice: keadaan tidak sadarkan diri
  alternative: keadaan ekstase; keadaan seperti orang kesurupan
  rationale: Terjemahan ini menyatakan keadaan kesadaran yang tidak biasa tanpa menjelaskan sumber, mekanisme, atau status teologisnya melampaui laporan ayat tersebut. 'Kesurupan' dihindari karena dalam bahasa Indonesia sering menyiratkan kerasukan roh.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Kompleks Bait Allah' dipakai demi ketepatan makna ἱερόν. Koma penutup dipertahankan karena ayat ini berlanjut langsung ke isi penglihatan pada ayat berikutnya.
