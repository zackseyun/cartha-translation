  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: id
  text: Sebab engkau akan menjadi saksi bagi-Nya[a] kepada semua orang[b] tentang apa yang telah kaulihat dan kaudengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada-Nya.” Bentuk dativus Yunani di sini dapat dipahami dalam lebih dari satu cara yang berdekatan maknanya.
    reason: alternative_reading
  - marker: b
    text: Atau “kepada semua manusia.” Kata Yunani yang digunakan bersifat umum dan mencakup manusia tanpa membedakan jenis kelamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks penugasan ini, ὅτι memperkenalkan penjelasan tentang tugas Paulus. “Sebab” mempertahankan daya penjelasnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: ἔσῃ
  choice: engkau akan menjadi
  rationale: Bentuk futurum εἰμί diterjemahkan sebagai masa depan biasa. “Engkau” sesuai dengan sapaan tunggal dalam konteks ini, sedangkan “akan menjadi” menyampaikan futurum secara alami.
- source_word: μάρτυς
  choice: saksi
  rationale: μάρτυς menunjuk kepada orang yang memberikan kesaksian. “Menjadi saksi” merupakan padanan Indonesia yang tepat dan idiomatis.
- source_word: αὐτῷ
  choice: bagi-Nya
  rationale: Dativus ini dapat menyatakan pribadi yang untuk kepentingan atau atas nama-Nya kesaksian diberikan. “Bagi-Nya” menyampaikan bahwa Paulus bersaksi untuk Tuhan/Yesus, sambil mencatat kemungkinan “kepada-Nya” dalam catatan kaki.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: kepada semua orang
  rationale: πρός dengan akusatif menunjukkan arah kepada para penerima kesaksian. ἀνθρώπους dipakai secara generik untuk manusia, sehingga “semua orang” akurat, inklusif, dan alami.
- source_word: ὧν
  choice: tentang apa yang
  rationale: Pronomina relatif genitif ini menyatakan isi kesaksian yang bersumber dari apa yang dilihat dan didengar Paulus. “Tentang apa yang” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ἑώρακας
  choice: telah kaulihat
  rationale: Bentuk perfektum menunjuk pada pengalaman melihat yang sudah terjadi dan tetap menjadi dasar kesaksian. “Telah kaulihat” mempertahankan nuansa tersebut secara ringkas.
- source_word: καὶ ἤκουσας
  choice: dan kaudengar
  rationale: Aoristus ini dipadankan secara alami dengan verba sebelumnya sebagai dua pengalaman yang menjadi dasar kesaksian. Pengulangan bentuk terikat “kau-” menjaga kejelasan dan kesejajaran.
theological_decisions:
- issue: Acuan dan fungsi αὐτῷ dalam penugasan Paulus
  choice: Kata ganti itu mengacu kepada Tuhan/Yesus sebagai pribadi yang bagi-Nya Paulus akan menjadi saksi.
  alternative: Diterjemahkan secara lebih netral sebagai “kepada-Nya”, dengan αὐτῷ dipahami sebagai dativus tujuan atau rujukan.
  rationale: Konteks langsung Kisah Para Rasul 22 menunjukkan bahwa Ananias sedang menyampaikan penugasan yang berkaitan dengan Tuhan yang telah menampakkan diri kepada Paulus. “Bagi-Nya” mempertahankan gagasan bahwa Paulus memberi kesaksian atas nama atau untuk kepentingan-Nya, tanpa menutup ambiguitas gramatikal; alternatifnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “engkau” dan gabungan “kaulihat/kaudengar” dipakai untuk sapaan tunggal yang selaras dengan register Alkitabiah tanpa menjadi arkais. Kapital pada “-Nya” menandai acuan kepada Tuhan/Yesus menurut kebiasaan ortografi religius Indonesia, sementara catatan kaki mempertahankan ambiguitas fungsi dativus.
