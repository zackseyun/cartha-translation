  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: id
  text: Ketika aku sedang dalam perjalanan dan mendekati Damsyik, kira-kira tengah hari, tiba-tiba cahaya yang sangat terang[a] dari surga memancar di sekelilingku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: cahaya yang besar. Ungkapan Yunani dapat menekankan besarnya cahaya atau kuatnya pancaran cahaya itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Ketika aku
  rationale: Ungkapan pengantar peristiwa dan datif orang pertama diserap secara idiomatis ke dalam anak kalimat bahasa Indonesia. Perspektif orang pertama tetap jelas tanpa bentuk kaku seperti “terjadilah kepadaku”.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: sedang dalam perjalanan dan mendekati Damsyik
  rationale: Mempertahankan tindakan yang sedang berlangsung serta gerak mendekati tujuan dengan susunan yang alami dalam bahasa Indonesia.
- source_word: περὶ μεσημβρίαν
  choice: kira-kira tengah hari
  rationale: Menyampaikan waktu yang bersifat perkiraan secara jelas dan wajar.
- source_word: ἐξαίφνης
  choice: tiba-tiba
  rationale: Mempertahankan sifat kejadian yang mendadak.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks perjumpaan pewahyuan ini, “surga” mempertahankan nuansa sumber surgawi atau ilahi, bukan sekadar lokasi atmosferis.
- source_word: περιαστράψαι
  choice: memancar ... dan menyinari sekelilingku
  rationale: Mengungkapkan cahaya yang mendadak bersinar mengitari Paulus; pemecahan ungkapan menghasilkan bahasa Indonesia yang alami sambil mempertahankan unsur gerak pancaran dan cakupan sekeliling.
- source_word: φῶς ἱκανὸν
  choice: cahaya yang sangat terang
  rationale: ἱκανός dapat menyatakan besarnya atau kuatnya cahaya. Pilihan ini menyampaikan intensitas secara idiomatis, sedangkan alternatif literal dicatat dalam catatan kaki.
- source_word: περὶ ἐμέ
  choice: sekelilingku
  rationale: Padanan spasial yang ringkas dan alami untuk cahaya yang mengitari pembicara.
theological_decisions:
- issue: Makna οὐρανός dalam ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  alternative: dari langit
  rationale: Konteks perjumpaan pewahyuan Paulus mendukung sumber surgawi atau transenden. Pilihan ini mempertahankan nuansa tersebut tanpa menambahkan pernyataan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya kesaksian lisan yang tetap bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum tanpa menghilangkan urutan perjalanan, waktu, kemendadakan, sumber cahaya, dan penyinaran yang mengelilingi Paulus.
