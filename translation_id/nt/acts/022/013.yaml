revisions:
- from: Ia datang kepadaku, lalu berdiri di dekatku dan berkata kepadaku, ‘Saudara Saul, lihatlah kembali.’ Pada saat itu juga aku dapat melihat kembali dan memandang dia.
  to: Ia datang kepadaku, lalu berdiri di dekatku dan berkata kepadaku, ‘Saudara Saul, terimalah kembali penglihatanmu.’ Pada saat itu juga aku dapat melihat kembali dan memandang dia.
  rationale: Revisi hanya mengganti perintah “lihatlah kembali” dengan “terimalah kembali penglihatanmu.” Ini menghilangkan ambiguitas Indonesia yang dapat mengarah pada tindakan melihat ulang, dan dengan jelas menyampaikan arti kontekstual ἀνάβλεψον sebagai pemulihan penglihatan. Unsur-unsur lain, termasuk gerak datang, posisi di dekat Paulus, penerima ujaran, ketepatan waktu, dan arah pandangan kepada Ananias, dipertahankan.
