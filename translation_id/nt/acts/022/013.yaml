  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan 'Saudara Saul' dipertahankan sebagai bahasa persekutuan, sedangkan pengulangan akar ἀναβλέπω dicerminkan dengan 'lihatlah kembali/dapat melihat kembali'.
