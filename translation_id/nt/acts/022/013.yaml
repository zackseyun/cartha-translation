base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: id
  text: Ia datang kepadaku, lalu berdiri di dekatku dan berkata kepadaku, ‘Saudara Saul, terimalah kembali penglihatanmu.’ Pada saat itu juga aku dapat melihat kembali dan memandang dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Ia datang kepadaku
  rationale: Bentuk partisip aoris dan πρός dengan akusatif menyatakan gerak mendekati Paulus; klausa finit ini alami dalam narasi Indonesia.
- source_word: ἐπιστάς
  choice: lalu berdiri di dekatku
  rationale: Partisip ini menggambarkan Ananias mengambil posisi dekat Paulus; 'lalu' menata urutan tindakan secara alami tanpa mengubah makna.
- source_word: Σαοὺλ ἀδελφέ
  choice: Saudara Saul
  rationale: Vokatif ἀδελφέ merupakan sapaan persaudaraan; susunan 'Saudara Saul' adalah sapaan Indonesia yang wajar dan bermartabat.
- source_word: ἀνάβλεψον
  choice: lihatlah kembali
  rationale: Dalam konteks kebutaan dan penyembuhan, verba ini berarti memperoleh kembali kemampuan melihat, bukan sekadar menengadah.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: pada saat itu juga
  rationale: Ungkapan ini menekankan bahwa pemulihan terjadi tepat pada waktu tersebut; idiom Indonesia ini lebih alami daripada terjemahan harfiah 'pada jam itu juga'.
- source_word: ἀνέβλεψα
  choice: aku dapat melihat kembali
  rationale: Konteks mengharuskan makna pulihnya penglihatan. Kata 'dapat' memperjelas pemulihan kemampuan tanpa menambahkan agen atau mekanisme teologis.
- source_word: εἰς αὐτόν
  choice: memandang dia
  rationale: Frasa ini menunjukkan arah pandangan kepada Ananias setelah penglihatan Paulus pulih.
- source_word: κἀγώ
  choice: aku
  rationale: Crasis καί dan ἐγώ menghubungkan tanggapan Paulus dengan perintah sebelumnya; dalam bahasa Indonesia hubungan itu sudah mengalir melalui kalimat berikut dan tidak memerlukan penekanan tambahan.
