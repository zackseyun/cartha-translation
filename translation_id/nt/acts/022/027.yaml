  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sebutan 'perwira' dipilih agar mudah dipahami pembaca umum; 'warga negara Roma' memperjelas makna hukum Ῥωμαῖος. Penambahan nama 'Paulus' hanya memperjelas rujukan dua pronomina laki-laki dalam satu kalimat dan tidak menambah pelaku baru.
