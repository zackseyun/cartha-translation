  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: id
  text: Lalu komandan[a] itu mendekati Paulus dan berkata kepadanya, “Katakan kepadaku, apakah kamu warga negara Romawi[b]?” Paulus menjawab, “Ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yunani khiliarkhos, seorang pejabat militer Romawi; istilah ini sering diterjemahkan “tribun” atau, secara lebih umum, “komandan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang Romawi”; dalam konteks ini, yang dimaksud ialah seseorang yang memiliki kewarganegaraan Romawi secara hukum.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: mendekati
  rationale: Partisip aoris ini menyatakan bahwa sang perwira bergerak mendekati Paulus sebelum berbicara; 'mendekati' alami dan tepat dalam narasi Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai kelanjutan narasi, bukan pertentangan kuat. 'Lalu' menyampaikan peralihan tindakan secara alami.
- source_word: χιλίαρχος
  choice: perwira
  rationale: Istilah ini menunjuk kepada perwira Romawi yang memimpin sekitar seribu prajurit atau satu kohor. 'Perwira' mudah dipahami, sedangkan keterangan pangkat historis dipertahankan dalam catatan kaki.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Terjemahan ini mempertahankan verba ujaran dan objek tak langsung; nama Paulus dipakai sebelumnya agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: Λέγε μοι
  choice: Katakan kepadaku
  rationale: Bentuk imperatif beserta pronomina datif diterjemahkan langsung dan wajar tanpa menambah isi pertanyaan.
- source_word: σὺ
  choice: kamu
  rationale: Pronomina eksplisit Yunani dipertahankan, tetapi tidak diberi penekanan berlebihan yang akan terdengar tidak alami dalam bahasa Indonesia.
- source_word: Ῥωμαῖος
  choice: warga negara Roma
  rationale: Adjektiva yang dipakai sebagai nomina ini, dalam konteks hukum bagian tersebut, menunjuk kepada status kewarganegaraan Romawi. Ungkapan Indonesia 'warga negara Roma' menyampaikan maksud itu dengan jelas.
- source_word: Ναί
  choice: Ya
  rationale: Jawaban afirmatif sederhana diterjemahkan secara langsung tanpa menambahkan kata-kata yang tidak terdapat dalam teks Yunani.
