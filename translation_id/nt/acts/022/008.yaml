  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: id
  text: Aku menjawab, ‘Siapakah Engkau, Tuhan[a]?’ Lalu Dia berkata kepadaku, ‘Akulah Yesus, orang Nazaret[b], yang sedang kamu aniaya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat dipakai sebagai sapaan hormat maupun sebagai gelar “Tuhan.”
    reason: alternative_reading
  - marker: b
    text: Atau “Yesus dari Nazaret” atau “Yesus Sang Nazoraian.” Bentuk terakhir lebih dekat dengan sebutan Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Aku menjawab
  rationale: Bentuk aoristus deponen dari ἀποκρίνομαι secara langsung dan alami diterjemahkan sebagai ‘menjawab’.
- source_word: Τίς εἶ
  choice: Siapakah Engkau
  rationale: Menyampaikan pertanyaan identitas secara langsung dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: κύριε
  choice: Tuhan
  rationale: Mempertahankan padanan utama bagi κύριος dan ketegangan naratif mengenai sejauh mana Saulus mengenali pembicara; kemungkinan sapaan hormat dicatat dalam catatan kaki.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Lalu Dia berkata kepadaku
  rationale: λέγω dengan πρὸς ἐμέ berarti ‘berkata kepadaku’; partikel τε diungkapkan dengan penghubung naratif ‘lalu’.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ‘Akulah’ merupakan pengungkapan identifikasi diri yang alami dan menonjol dalam bahasa Indonesia tanpa menambahkan isi.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Mengikuti bentuk baku nama tersebut dalam bahasa Indonesia.
- source_word: ὁ Ναζωραῖος
  choice: orang Nazaret
  rationale: Sebutan asal atau julukan ini disampaikan secara alami sebagai ‘orang Nazaret’; alternatif yang lebih formal dipertahankan dalam catatan kaki.
- source_word: ὃν σὺ διώκεις
  choice: yang sedang kamu aniaya
  rationale: Dalam konteks ini διώκω berarti melakukan penganiayaan, bukan sekadar mengejar; ‘sedang’ mencerminkan tindakan yang berlangsung pada kala kini.
theological_decisions:
- issue: Makna κύριε dalam sapaan Saulus
  choice: Tuhan
  alternative: Tuan
  rationale: ‘Tuhan’ mempertahankan padanan utama κύριος dan resonansi kristologis narasi, tetapi teks tidak memaksa kesimpulan bahwa Saulus saat itu sudah memahami sepenuhnya identitas pembicara. Karena itu, kemungkinan sapaan hormat ‘Tuan’ dicatat sebagai alternatif.
- issue: Hubungan Yesus dengan orang-orang yang dianiaya Saulus
  choice: yang sedang kamu aniaya
  alternative: yang kamu aniaya
  rationale: Terjemahan mempertahankan pernyataan langsung Yesus bahwa penganiayaan yang dilakukan Saulus tertuju kepada-Nya, tanpa menjelaskan atau mengurangi ketegangan teologis hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog memakai ‘Aku/Engkau’ untuk sapaan kepada sosok ilahi dan ‘kamu’ dalam ucapan Yesus kepada Saulus. Huruf kapital pada pronomina ilahi merupakan konvensi bahasa Indonesia dan tidak dimaksudkan untuk menghapus ambiguitas awal pada κύριε; ambiguitas itu dijaga dalam catatan kaki.
