  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: id
  text: Sementara mereka terus berteriak, melemparkan pakaian mereka,[a] dan menghamburkan debu ke udara,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencampakkan pakaian mereka” atau “menanggalkan pakaian mereka.” Kata Yunani ini dapat menunjuk pada tindakan melemparkan atau mencampakkan pakaian; dalam konteks ini, tindakan itu mungkin juga melibatkan penanggalan pakaian dalam kegaduhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: terus berteriak
  rationale: Partisipel kini menunjukkan tindakan yang sedang berlangsung; “terus berteriak” menyampaikan teriakan keras orang banyak secara alami.
- source_word: τε
  choice: sementara ... dan
  rationale: Partikel ini menghubungkan tindakan pertama dengan rangkaian tindakan serentak berikutnya; susunan ini alami dalam bahasa Indonesia.
- source_word: αὐτῶν
  choice: mereka
  rationale: Genitif jamak dalam konstruksi partisipial dialihkan menjadi subjek eksplisit agar idiomatis dalam bahasa Indonesia.
- source_word: ῥιπτούντων
  choice: melemparkan
  rationale: Kata kerja ini berarti melempar atau mencampakkan. Terjemahan netral dipilih agar tidak menutup kemungkinan bahwa pakaian dilepas lalu dilempar atau dikibas-kibaskan dalam kegaduhan.
- source_word: τὰ ἱμάτια
  choice: pakaian mereka
  rationale: Ἱμάτια dapat menunjuk pakaian, terutama pakaian luar. “Pakaian mereka” mempertahankan keluasan makna tanpa memaksakan jenis pakaian tertentu.
- source_word: κονιορτόν
  choice: debu
  rationale: Padanan langsung dan alami untuk debu halus yang dihamburkan.
- source_word: βαλλόντων
  choice: menghamburkan
  rationale: Dalam hubungan dengan debu, “menghamburkan” menyampaikan tindakan melemparkan debu dengan kuat sekaligus menghindari pengulangan kata “melemparkan”.
- source_word: εἰς τὸν ἀέρα
  choice: ke udara
  rationale: Padanan idiomatis yang dekat dengan frasa Yunani dan sesuai dengan gerakan yang digambarkan.
