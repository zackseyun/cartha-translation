  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: id
  text: Komandan itu memerintahkan agar Paulus dibawa masuk ke markas pasukan[a] dan agar ia diperiksa dengan cambukan[b], supaya komandan itu dapat mengetahui alasan orang banyak berteriak demikian menentangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barak,” “perkemahan,” atau “benteng.” Di sini istilah itu menunjuk kepada tempat pasukan Romawi bermarkas di Yerusalem.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “diinterogasi dengan cambukan.” Bahasa Yunani memadukan pemeriksaan dengan cambukan sebagai caranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: komandan
  rationale: Istilah ini menunjuk kepada seorang perwira tinggi Romawi. “Komandan” jelas dan alami bagi pembaca Indonesia tanpa mengharuskan istilah teknis yang kurang dikenal.
- source_word: παρεμβολή
  choice: markas pasukan
  rationale: Dalam konteks Yerusalem, kata ini menunjuk kepada kompleks tempat pasukan Romawi bermarkas; pilihan ini menyampaikan fungsi tempat tersebut secara alami.
- source_word: εἰσάγεσθαι
  choice: dibawa masuk
  rationale: Bentuk pasifnya menunjukkan bahwa Paulus dibawa ke dalam oleh orang lain; “dibawa masuk” mempertahankan makna dan arah geraknya.
- source_word: εἴπας
  choice: Ia menyuruh
  rationale: Partisip ini memperkenalkan perintah lanjutan sang komandan. Dalam bahasa Indonesia, kalimat baru dengan “Ia menyuruh” menyampaikan hubungan perintah itu secara jelas dan alami.
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: diperiksa dengan cara dicambuk
  rationale: Ungkapan Yunani memadukan tindakan pemeriksaan atau interogasi dengan cambukan sebagai caranya. Terjemahan ini mempertahankan kedua unsur tersebut.
- source_word: ἐπιγνῷ
  choice: ia dapat mengetahui
  rationale: Dalam klausa tujuan, kata ini menyatakan maksud sang komandan untuk memperoleh kepastian tentang penyebab keributan.
- source_word: δι’ ἣν αἰτίαν
  choice: apa sebabnya
  rationale: Ungkapan ini menanyakan sebab atau alasan, bukan secara tegas suatu dakwaan hukum.
- source_word: οὕτως
  choice: demikian
  rationale: Pilihan ini mempertahankan daya tunjuk adverbia Yunani terhadap cara atau kuatnya teriakan orang banyak.
- source_word: ἐπεφώνουν αὐτῷ
  choice: berteriak demikian menentang Paulus
  rationale: Bentuk imperfek menggambarkan teriakan yang sedang berlangsung, sedangkan “menentang” menangkap sifat permusuhan yang diarahkan kepadanya.
