source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: id
  text: Karena itu, orang-orang yang hendak memeriksanya segera menjauh darinya.[a] Komandan itu[b] pun menjadi takut ketika mengetahui bahwa Paulus adalah warga negara Roma dan bahwa ia telah mengikatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus sesuai konteks, “orang-orang yang hendak memeriksanya dengan mencambuknya.” Kata kerja Yunani ini dapat merujuk pada pemeriksaan resmi, dan ayat sebelumnya menjelaskan caranya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “khiliarkhos,” yaitu perwira militer Romawi yang menurut jabatannya memimpin sekitar seribu prajurit, meskipun jumlah sebenarnya dapat berbeda.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Karena itu ... segera
  rationale: Mempertahankan hubungan logis dengan ayat sebelumnya sekaligus menyatakan cepatnya tanggapan mereka dalam bahasa Indonesia yang alami.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: menjauh darinya
  rationale: Mengungkapkan bahwa mereka menghentikan tindakan dan menarik diri dari Paulus.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: orang-orang yang hendak memeriksanya
  rationale: Menyampaikan maksud yang sudah dekat untuk melakukan pemeriksaan resmi; cara pemeriksaan melalui cambuk dijelaskan oleh konteks sebelumnya dan dicatat dalam catatan kaki.
- source_word: χιλίαρχος
  choice: komandan
  rationale: Sebutan fungsional yang mudah dipahami pembaca Indonesia; catatan kaki menjelaskan pangkat militer Romawinya.
- source_word: ἐφοβήθη
  choice: menjadi takut
  rationale: Menangkap timbulnya rasa takut sebagai reaksi atas informasi yang baru diketahuinya.
- source_word: ἐπιγνοὺς
  choice: setelah mengetahui
  rationale: Partisip ini menyatakan keadaan yang memicu rasa takut dan secara alami dapat dipahami secara temporal-kausal.
- source_word: Ῥωμαῖός ἐστιν
  choice: Paulus adalah warga negara Roma
  rationale: Konteks menyoroti status hukum kewarganegaraan, bukan asal etnis; nama Paulus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: δεδεκώς
  choice: telah membelenggunya
  rationale: Bentuk perfek menyatakan tindakan yang sudah dilakukan dengan akibat yang masih berlaku; 'membelenggu' sesuai dengan konteks penahanan.
