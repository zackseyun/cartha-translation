revisions:
- from: Karena itu, orang-orang yang hendak memeriksanya segera menjauh darinya.[a] Komandan itu[b] pun menjadi takut setelah mengetahui bahwa Paulus adalah warga negara Roma dan bahwa ia telah membelenggunya.
  to: Karena itu, orang-orang yang hendak memeriksanya segera menjauh darinya.[a] Komandan itu[b] pun menjadi takut ketika mengetahui bahwa Paulus adalah warga negara Roma dan bahwa ia telah mengikatnya.
  rationale: Revisi membatasi terjemahan pada makna leksikal δέω, yaitu “mengikat,” tanpa menghilangkan konteks pemeriksaan paksa yang dijelaskan dalam catatan kaki. Penyesuaian kecil pada partisip dan catatan kaki meningkatkan kejelasan serta kelancaran bahasa Indonesia tanpa mengubah makna ayat.
