id: ACT.22.11
reference: Acts 22:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: id
  text: Karena aku tidak dapat melihat akibat terang cahaya itu, orang-orang yang bersamaku menuntun aku dengan memegang tanganku hingga aku tiba di Damsyik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “karena kemuliaan cahaya itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: tidak dapat melihat
  rationale: Dalam konteks cahaya surgawi yang membutakan, bentuk imperfek ini menyatakan ketidakmampuan melihat, bukan sekadar ketidakmampuan menatap.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: akibat cahaya yang begitu terang itu
  rationale: δόξα di sini menunjuk pada pancaran atau kecemerlangan cahaya yang menyebabkan kebutaan. Ungkapan ini alami dalam bahasa Indonesia, sedangkan arti lebih harfiah dipertahankan dalam catatan kaki.
- source_word: χειραγωγούμενος
  choice: menuntun tanganku
  rationale: Partisipel ini secara khusus menggambarkan tindakan memegang atau menuntun seseorang dengan tangan; rumusan aktif ini jelas dan alami dalam bahasa Indonesia.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: orang-orang yang bersamaku
  rationale: Terjemahan ini mempertahankan ungkapan relasional Yunani tanpa secara berlebihan menetapkan status mereka sebagai rombongan resmi.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: sampailah aku di Damsyik
  rationale: Ungkapan ini menyampaikan gerak menuju dan tibanya Paulus di kota tersebut dengan bahasa Indonesia yang wajar.
- source_word: ὡς δὲ
  choice: Karena
  rationale: Dalam konteks ini ὡς memperkenalkan keadaan yang menjadi alasan ia harus dituntun, sedangkan kesinambungan naratif δέ tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan δόξα dalam konteks penampakan ilahi
  choice: begitu terang
  alternative: kemuliaan
  rationale: Di dalam kalimat ini δόξα terutama menggambarkan pancaran cahaya yang secara fisik membuat Paulus tidak dapat melihat. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah dan bernuansa teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “menuntun tanganku” mempertahankan gambaran konkret teks sumber, dan nama tempat mengikuti bentuk Indonesia yang lazim dalam Alkitab.
