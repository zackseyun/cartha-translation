revisions:
- from: Karena aku tidak dapat melihat akibat cahaya yang begitu terang itu[a], orang-orang yang bersamaku menuntun tanganku, dan sampailah aku di Damsyik.
  to: Karena aku tidak dapat melihat akibat terang cahaya itu, orang-orang yang bersamaku menuntun aku dengan memegang tanganku hingga aku tiba di Damsyik.[a]
  rationale: The revision preserves the source’s causal connection, the contextual sense of δόξα as visible radiance, the demonstrative reference to that light, and the explicit detail of hand-guidance. “Menuntun aku dengan memegang tanganku” naturally communicates that Paul, not merely his hand, was led. The footnote remains anchored after the phrase concerning the light and preserves the more literal rendering of δόξα.
