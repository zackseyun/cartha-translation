  source_fidelity: 'Teks menyampaikan inti Yunani dengan tepat: sapaan kepada kelompok pendengar laki-laki yang mencakup saudara-saudara dan para pria yang lebih tua/terhormat, diikuti perintah untuk mendengarkan pembelaan Paulus yang ditujukan kepada mereka saat ini. “Saudara-saudara dan Bapak-bapak” adalah padanan sapaan Indonesia yang mapan dan alami untuk gabungan ἄνδρες ἀδελφοὶ καὶ πατέρες; menerjemahkan ἄνδρες secara mandiri sebagai “para pria” akan lebih harfiah tetapi canggung dan berlebihan dalam bahasa sasaran. “Pembelaan” tepat untuk ἀπολογία, bukan permintaan maaf.'
