  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: id
  text: Saudara-saudara dan Bapak-bapak, dengarkanlah pembelaan yang sekarang saya sampaikan kepada Anda sekalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengarkanlah pembelaan saya yang sekarang saya ajukan kepada Anda sekalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: Saudara-saudara
  rationale: Dalam sapaan publik Yunani, ἄνδρες menyertai sebutan ἀδελφοί dan menandai bahwa orang-orang yang disapa adalah laki-laki. Dalam bahasa Indonesia, “Saudara-saudara” sudah menjadi sapaan alami bagi kelompok laki-laki; menerjemahkan ἄνδρες secara terpisah sebagai “laki-laki” akan terdengar kaku dan tidak wajar.
- source_word: πατέρες
  choice: Bapak-bapak
  rationale: Bentuk sapaan ini menyatakan penghormatan kepada laki-laki yang lebih tua atau terpandang. “Bapak-bapak” mempertahankan nuansa kekerabatan dan penghormatan tanpa menafsirkannya sebagai jabatan resmi “para penatua”.
- source_word: ἀκούσατέ
  choice: dengarkanlah
  rationale: Imperatif aoris orang kedua jamak ini merupakan permintaan langsung agar hadirin memperhatikan. “Dengarkanlah” alami dalam pidato resmi dan lebih jelas sebagai perintah daripada sekadar “dengarlah”.
- source_word: μου
  choice: saya
  rationale: Genitif ini berkaitan dengan ἀπολογίας dan menyatakan bahwa pembelaan tersebut adalah pembelaan Paulus; dalam susunan Indonesia yang dipilih, hubungan itu terungkap melalui “saya sampaikan”.
- source_word: νυνὶ
  choice: sekarang
  rationale: Kata ini menekankan kesegeraan pembelaan yang sedang disampaikan.
- source_word: ἀπολογίας
  choice: pembelaan
  rationale: Dalam konteks ini kata tersebut berarti jawaban atau pidato untuk membela diri, bukan permintaan maaf.
- source_word: πρὸς ὑμᾶς
  choice: kepada Anda sekalian
  rationale: Frasa ini menunjukkan bahwa pembelaan diarahkan kepada para pendengar. “Anda sekalian” mempertahankan bentuk jamak dan sikap hormat yang sesuai dengan sapaan pembuka.
