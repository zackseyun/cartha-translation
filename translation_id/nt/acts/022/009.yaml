  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: id
  text: Orang-orang yang bersama saya melihat cahaya itu, tetapi mereka tidak mendengar suara orang yang berbicara kepada saya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memahami suara itu.” Bandingkan Kisah Para Rasul 9:7, yang mengatakan bahwa orang-orang yang menyertai Paulus mendengar bunyi atau suara. Perbedaannya mungkin antara mendengar suatu bunyi dan memahami suara orang yang berbicara.
    reason: Menampilkan kemungkinan nuansa “tidak memahami” bagi ἀκούω serta mempertahankan ketegangan naratif dengan Kisah Para Rasul 9:7 tanpa menyelesaikannya dalam teks utama.
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Orang-orang yang bersama saya
  rationale: Menerjemahkan konstruksi partisipial berartikel secara alami tanpa menambahkan jenis kelamin yang tidak dinyatakan dalam teks Yunani.
- source_word: τὸ μὲν φῶς ... τὴν δὲ φωνὴν
  choice: memang melihat cahaya itu, tetapi ... suara
  rationale: Pasangan μέν–δέ menyatakan kontras; 'memang ... tetapi' menampilkan kontras itu secara wajar dalam bahasa Indonesia. φῶς berarti 'cahaya', sedangkan φωνή dipilih sebagai 'suara' karena diterangkan oleh pribadi yang berbicara.
- source_word: ἐθεάσαντο
  choice: melihat
  rationale: Padanan modern dan langsung untuk tindakan melihat atau menyaksikan, tanpa kesan arkais maupun unsur kesengajaan tambahan.
- source_word: οὐκ ἤκουσαν
  choice: tidak mendengar
  rationale: Mempertahankan arti leksikal langsung ἀκούω. Kemungkinan nuansa 'tidak memahami' dicatat dalam catatan kaki karena ketegangan dengan Kisah Para Rasul 9:7.
- source_word: τοῦ λαλοῦντός μοι
  choice: Dia yang sedang berbicara kepada saya
  rationale: Partisipel kini dipertahankan sebagai tindakan yang sedang berlangsung. Huruf kapital pada 'Dia' wajar dalam register Alkitab bahasa Indonesia karena acuannya adalah Tuhan dalam konteks, tanpa menambahkan nama ke dalam ayat.
theological_decisions:
- issue: Ketegangan yang tampak dengan Kisah Para Rasul 9:7 mengenai apakah para pendamping Paulus mendengar suara
  choice: Teks utama menyatakan bahwa mereka 'tidak mendengar suara' Dia yang berbicara kepada Paulus.
  alternative: Mereka tidak memahami suara itu, atau mendengar bunyi tetapi tidak memahami perkataannya.
  rationale: Teks Yunani ayat ini secara langsung mendukung 'tidak mendengar suara'. Namun, rentang makna ἀκούω dan φωνή memungkinkan perbedaan antara mendengar bunyi dan memahami suara atau perkataan. Ketegangan dengan Kisah Para Rasul 9:7 dipertahankan, bukan diselesaikan diam-diam dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Saya' dipakai untuk ujaran Paulus sesuai register naratif formal. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
