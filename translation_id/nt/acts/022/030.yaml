id: ACT.22.30
reference: Acts 22:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: id
  text: Keesokan harinya, komandan itu ingin mengetahui dengan pasti apa yang dituduhkan orang-orang Yahudi[a] kepada Paulus. Ia melepaskan ikatan Paulus dan memerintahkan para imam kepala serta seluruh Mahkamah Agama[b] untuk berkumpul. Lalu ia membawa Paulus turun dan menghadapkan dia kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang-orang Yudea”. Teks Yunani berbunyi “orang-orang Yahudi”; dalam konteks ini yang dimaksud ialah orang-orang yang menuduh Paulus, bukan semua orang Yahudi tanpa kecuali.
    reason: lexical_alternative
  - marker: b
    text: Mahkamah Agama adalah Sanhedrin, yaitu dewan penguasa Yahudi di Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan datif temporal ini berarti 'pada hari berikutnya'. δέ menandai kelanjutan atau peralihan ringan yang dalam bahasa Indonesia tidak perlu dinyatakan dengan konjungsi tersendiri.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: ingin mengetahui dengan pasti
  rationale: Partisip βουλόμενος menyatakan maksud komandan, sedangkan τὸ ἀσφαλές menunjuk pada kepastian atau fakta yang dapat diandalkan.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: apa yang dituduhkan orang-orang Yahudi kepada Paulus
  rationale: Bentuk pasif Yunani dialihkan menjadi konstruksi aktif yang lebih alami dalam bahasa Indonesia tanpa mengubah pelaku atau isi tuduhan. Nama Paulus dipakai agar rujukan pronomina jelas.
- source_word: ἔλυσεν αὐτόν
  choice: ia melepaskan ikatan Paulus
  rationale: λύω dapat berarti melepaskan, membuka ikatan, atau membebaskan. Konteks sebelumnya menyebut Paulus diikat, sehingga 'melepaskan ikatan' mempertahankan tindakan konkret tanpa menyiratkan pembebasan penuh dari tahanan.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: memerintahkan ... untuk berkumpul
  rationale: κελεύω dengan infinitif menyatakan perintah resmi; bentuk ini wajar dan jelas dalam bahasa Indonesia.
- source_word: τοὺς ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah ini menunjuk para pemuka kalangan imam, bukan beberapa imam besar yang sedang menjabat sekaligus.
- source_word: πᾶν τὸ συνέδριον
  choice: seluruh Mahkamah Agama
  rationale: συνέδριον di sini adalah badan penguasa Yahudi di Yerusalem yang lazim dikenal dalam Alkitab bahasa Indonesia sebagai Mahkamah Agama.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: membawa Paulus turun
  rationale: Terjemahan mempertahankan arah gerak καταγαγών, kemungkinan dari markas atau benteng menuju tempat sidang.
- source_word: ἔστησεν εἰς αὐτούς
  choice: menghadapkan dia kepada mereka
  rationale: Ungkapan ini berarti membuat Paulus berdiri di hadapan sidang; 'menghadapkan' alami untuk konteks pemeriksaan resmi.
theological_decisions:
- issue: Cakupan Ἰουδαίων dalam Kisah Para Rasul
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani memakai Ἰουδαίων. Terjemahan mempertahankan sebutan etnis-keagamaan tersebut, sedangkan catatan menjelaskan bahwa konteks membatasi acuannya pada para penuduh Paulus, bukan semua orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami. 'Komandan itu' dibuat eksplisit dari konteks, dan variasi 'Paulus/dia' dipakai untuk menjaga kejelasan rujukan.
