  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register naratif resmi. Pemecahan kalimat panjang Yunani menjadi beberapa kalimat tetap lancar. Penghapusan "Karena itu" membuat alurnya lebih netral dan lebih dekat dengan sumber.
