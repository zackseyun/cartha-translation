  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: id
  text: Imam Besar dan seluruh majelis tua-tua juga dapat bersaksi tentang hal ini. Dari mereka aku juga menerima surat-surat kepada saudara-saudara di Damsyik[a], dan aku sedang dalam perjalanan ke sana untuk membawa juga orang-orang yang ada di sana, dalam keadaan terikat, ke Yerusalem supaya mereka dihukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "saudara-saudara laki-laki dan perempuan." Dalam bahasa Yunani tertulis "saudara-saudara," tetapi dalam konteks tertentu istilah ini dapat merujuk kepada komunitas yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Sebagaimana juga
  rationale: Mempertahankan fungsi pembanding sekaligus penegasan bahwa para pemimpin tersebut dapat menguatkan pernyataan Paulus.
- source_word: ὁ ἀρχιερεύς
  choice: Imam Besar
  rationale: Padanan baku dan wajar bagi jabatan tunggal pemimpin keimaman dalam konteks Yahudi ini.
- source_word: μαρτυρεῖ μοι
  choice: dapat disaksikan oleh ...
  rationale: Menyampaikan bahwa kesaksian mereka tersedia untuk menguatkan pernyataan Paulus; bentuk pasif alami dalam susunan kalimat Indonesia ini.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: seluruh dewan tua-tua
  rationale: Menunjukkan badan atau majelis para tua-tua, bukan sekadar semua orang yang lanjut usia.
- source_word: παρ’ ὧν
  choice: Dari mereka
  rationale: Merujuk secara kolektif kepada Imam Besar dan dewan tua-tua.
- source_word: ἐπιστολάς
  choice: surat-surat
  rationale: Mempertahankan arti leksikal dasar tanpa menambahkan sifat resmi yang hanya tersirat oleh konteks.
- source_word: πρὸς τοὺς ἀδελφούς
  choice: untuk saudara-saudara
  rationale: Mempertahankan bentuk maskulin jamak teks Yunani dan identitas kelompoknya tanpa menentukan lebih jauh siapa yang dimaksud.
- source_word: ἐπορευόμην
  choice: aku sedang dalam perjalanan ke sana
  rationale: Mencerminkan aspek imperfek, yaitu perjalanan yang sedang berlangsung ketika peristiwa berikutnya terjadi.
- source_word: ἄξων
  choice: untuk membawa
  rationale: Partisip futur sesudah verba gerak menyatakan tujuan perjalanan.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: orang-orang yang ada di sana
  rationale: Padanan langsung dan alami bagi frasa partisip substantival yang menunjuk orang-orang di Damsyik.
- source_word: δεδεμένους
  choice: dalam keadaan terikat
  rationale: Menjaga penekanan partisip perfek pasif pada keadaan mereka sebagai tahanan tanpa mempersempitnya menjadi rantai.
- source_word: ἵνα τιμωρηθῶσιν
  choice: supaya mereka dihukum
  rationale: Menyampaikan tujuan penghukuman tanpa menentukan bentuk hukuman yang tidak disebutkan dalam teks.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam konteks komunitas penerima surat di Damsyik
  choice: saudara-saudara
  alternative: saudara-saudara, baik laki-laki maupun perempuan; sesama orang Yahudi
  rationale: Teks utama mempertahankan bentuk maskulin jamak dan sebutan relasional sumber. Kemungkinan bahwa istilah itu mencakup komunitas yang lebih luas dicatat tanpa dimasukkan secara pasti ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” mengikuti ujaran langsung Paulus. Susunan kalimat mempertahankan unsur “juga” pada kesaksian, penerimaan surat, dan orang-orang yang hendak dibawa, meskipun pengulangannya terasa agak menonjol, karena ketiganya hadir dalam teks Yunani.
