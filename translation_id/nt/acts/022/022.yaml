base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: id
  text: Mereka terus mendengarkan Paulus sampai pada bagian perkataan itu. Lalu mereka meninggikan suara sambil berkata, “Singkirkan orang seperti itu dari muka bumi,[a] sebab ia tidak patut hidup!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Angkatlah orang seperti itu dari bumi”; maksudnya, “Enyahkan orang seperti itu dari muka bumi.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Sebab ia tidak seharusnya hidup.” Seruan ini merupakan tuntutan agar Paulus dibunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: terus mendengarkan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung sampai perkataan tertentu memicu reaksi orang banyak.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: sampai pada perkataan itu
  rationale: λόγος di sini menunjuk pada bagian atau pernyataan tertentu dalam pidato Paulus, bukan sekadar satu kata.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: berseru dengan suara keras
  rationale: Ungkapan ini menggambarkan seruan keras bersama-sama; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan unsur suara.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: Singkirkan orang semacam ini dari muka bumi!
  rationale: Dalam konteks permusuhan, αἶρε berarti menyingkirkan atau melenyapkan; τὸν τοιοῦτον mengandung nada menghina, sedangkan ἀπὸ τῆς γῆς menyatakan penyingkiran dari dunia orang hidup.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Ia tidak layak hidup!
  rationale: καθῆκεν menyatakan apa yang patut atau layak. Rumusan ini ringkas, alami, dan mempertahankan penilaian orang banyak tanpa menambahkan gagasan eksplisit tentang izin.
