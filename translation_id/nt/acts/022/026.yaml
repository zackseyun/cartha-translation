base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: id
  text: Ketika perwira itu mendengar hal tersebut, ia pergi kepada komandan dan melaporkannya, katanya, “Apa yang hendak Komandan lakukan?[a] Sebab, orang ini warga negara Roma.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Apa yang akan Komandan lakukan?” Ungkapan Yunani ini dapat menunjuk tindakan yang segera dilakukan atau tindakan yang diniatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Orang ini adalah orang Romawi.” Dalam konteks ini, maksudnya ialah bahwa ia memiliki kewarganegaraan Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Ketika ... mendengar hal tersebut
  rationale: Partisip aoristus ini menyatakan keadaan yang mendahului tindakan utama; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya temporalnya.
- source_word: ἑκατοντάρχης
  choice: perwira
  rationale: Istilah ini menunjuk perwira Romawi berpangkat centurion. Dalam konteks militer narasi ini, 'perwira' jelas dan lebih mudah dipahami pembaca umum daripada transliterasi 'centurion'.
- source_word: προσελθὼν
  choice: ia pergi kepada
  rationale: Partisip ini menggambarkan gerak mendekati atasan; ungkapan tersebut alami dalam alur narasi bahasa Indonesia.
- source_word: χιλιάρχῳ
  choice: komandan
  rationale: Istilah ini menunjuk perwira tinggi Romawi yang memimpin pasukan setingkat kohor; 'komandan' akurat secara fungsional dan mudah dipahami.
- source_word: ἀπήγγειλεν
  choice: melaporkannya
  rationale: Kata kerja ini berarti menyampaikan informasi atau laporan, sesuai dengan konteks hubungan militer antara bawahan dan atasan.
- source_word: λέγων
  choice: katanya
  rationale: Bentuk ini menghubungkan isi ucapan dengan tindakan melapor secara alami tanpa meniru struktur partisip Yunani secara kaku.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Apa yang hendak Komandan lakukan?
  rationale: μέλλω dengan infinitif dapat menyatakan tindakan yang segera dilakukan atau yang diniatkan. 'Hendak' menjaga kedua nuansa itu dengan cukup baik; sapaan 'Komandan' membuat relasi pembicara jelas dan sopan dalam bahasa Indonesia.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Orang ini
  rationale: Dalam konteks ini ἄνθρωπος menunjuk Paulus. 'Orang ini' alami dan tidak membawa nada merendahkan.
- source_word: Ῥωμαῖός ἐστιν
  choice: warga negara Roma
  rationale: Secara harfiah berarti 'orang Romawi', tetapi dalam konteks hukum ini yang dimaksud ialah status kewarganegaraan Romawi.
