  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: id
  text: Namun, komandan itu menjawab, “Saya memperoleh kewarganegaraan ini dengan sejumlah besar uang.” Paulus berkata, “Tetapi saya bahkan dilahirkan sebagai warga negara.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: komandan
  rationale: Istilah ini menunjuk kepada perwira Romawi yang memimpin kira-kira seribu prajurit. 'Komandan' lebih mudah dipahami pembaca Indonesia modern daripada gelar teknis 'tribun', sementara konteks mempertahankan nuansa militernya.
- source_word: πολλοῦ κεφαλαίου
  choice: dengan biaya yang sangat besar
  rationale: Frasa genitif ini secara idiomatis menyatakan besarnya pengeluaran uang. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan bahwa verba berikutnya sendiri berarti 'membeli'.
- source_word: πολιτείαν
  choice: kewarganegaraan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada status hukum sebagai warga negara Romawi, bukan kehidupan politik atau perilaku sebagai warga.
- source_word: ἐκτησάμην
  choice: saya memperoleh
  rationale: Verba medium ini berarti memperoleh atau mendapatkan bagi diri sendiri. 'Memperoleh' mempertahankan keluasan makna verba, sedangkan unsur biaya sudah dinyatakan dalam frasa sebelumnya.
- source_word: καὶ γεγέννημαι
  choice: saya bahkan sudah menjadi warga negara sejak lahir
  rationale: Bentuk perfekt pasif secara harfiah menyatakan 'telah dilahirkan'; kewarganegaraan dipahami dari konteks. Rumusan Indonesia ini menyampaikan bahwa Paulus memilikinya berdasarkan kelahiran, dan 'bahkan' mencerminkan καί yang menegaskan kontras.
- source_word: δέ
  choice: Namun / Lalu / Tetapi
  rationale: Partikel ini mengatur kelanjutan dialog dan kontras. Variasi Indonesia menghindari pengulangan kaku sambil menjaga pertentangan antara cara komandan dan Paulus memperoleh status tersebut.
- source_word: ἔφη
  choice: berkata
  rationale: Verba ujaran umum ini paling wajar diterjemahkan 'berkata' tanpa menambahkan tekanan retoris.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Gelar militer diterjemahkan secara fungsional sebagai 'komandan'. Dialog memakai 'saya' agar alami dan tetap hormat. Implikasi kewarganegaraan dalam klausa terakhir dibuat eksplisit demi kejelasan, tanpa mengubah kontras antara kewarganegaraan yang diperoleh dengan biaya dan yang dimiliki sejak lahir.
