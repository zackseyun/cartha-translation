  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: id
  text: Seorang laki-laki bernama Ananias, yang saleh menurut hukum Taurat serta mendapat kesaksian baik dari semua orang Yahudi yang tinggal di sana,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan dalam narasi; alur kalimat bahasa Indonesia sudah menyampaikan fungsi tersebut tanpa memerlukan kata penghubung tambahan.
- source_word: τις ἀνὴρ
  choice: ada seorang
  rationale: Ungkapan ini memperkenalkan seorang laki-laki tertentu yang sebelumnya belum disebut; susunan ini alami dalam bahasa Indonesia dan mempertahankan ketakrifan yang belum penuh.
- source_word: εὐλαβής
  choice: saleh
  rationale: Kata ini menyatakan kesungguhan beragama dan sikap hormat kepada Allah; 'saleh' ringkas, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: κατὰ τὸν νόμον
  choice: menurut hukum Taurat
  rationale: Frasa ini mengaitkan kesalehan Ananias dengan hukum Musa. 'Hukum Taurat' memperjelas acuan νόμος dalam konteks Yahudi tanpa mengubah maknanya.
- source_word: μαρτυρούμενος
  choice: dikenal baik
  rationale: Partisip pasif ini menyatakan kesaksian positif orang lain mengenai Ananias; 'dikenal baik' menyampaikan reputasi baik secara alami.
- source_word: ὑπὸ πάντων
  choice: oleh semua
  rationale: Mempertahankan cakupan menyeluruh πάντων dan fungsi frasa sebagai pelaku kesaksian.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: orang Yahudi yang tinggal di sana
  rationale: Partisip κατοικούντων menunjukkan mereka menetap di tempat yang dimaksud dalam konteks, yaitu Damsyik. 'Orang Yahudi' paling sesuai karena identitas komunitas menjadi pokok, bukan asal geografis dari Yudea.
theological_decisions:
- issue: Pemaknaan Ἰουδαίων
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Konteks menunjuk pada komunitas Yahudi yang tinggal di Damsyik dan memberikan kesaksian mengenai Ananias, bukan terutama pada orang yang berasal dari wilayah Yudea.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur kalimat mempertahankan rangkaian keterangan Yunani sambil menghindari kekakuan. Nama Ananias diletakkan setelah 'seorang bernama' agar pengenalan tokoh terdengar alami.
