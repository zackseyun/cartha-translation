  terminology: “Tuhan,” “Damsyik,” “Bangunlah,” dan “pergilah” sesuai dengan register naratif Alkitab bahasa Indonesia modern. Tidak diperlukan catatan kaki dalam teks Indonesia ini; tidak ada varian atau ambiguitas yang perlu ditandai untuk pembaca pada tingkat ayat ini.
