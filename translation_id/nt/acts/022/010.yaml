  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: id
  text: Lalu aku berkata, “Apa yang harus kulakukan, Tuhan?” Tuhan berkata kepadaku, “Bangunlah dan pergilah ke Damsyik. Di sana akan diberitahukan kepadamu segala sesuatu yang telah ditetapkan untuk kaulakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Apa yang harus kulakukan
  rationale: Subjungtif aoris deliberatif meminta petunjuk tentang tindakan berikutnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa kewajiban atau arahan.
- source_word: κύριε / ὁ ... κύριος
  choice: Tuhan / Tuhan
  rationale: Dalam penuturan kembali peristiwa di jalan menuju Damsyik ini, gelar κύριος ditujukan kepada dan mengidentifikasi Yesus; “Tuhan” mempertahankan bobot kristologis konteks tersebut.
- source_word: Ἀναστὰς
  choice: Bangunlah
  rationale: Partisip ini berfungsi secara imperatif dan berurutan dengan πορεύου; “Bangunlah” menyampaikan perintah untuk bangkit sebelum pergi.
- source_word: πορεύου εἰς Δαμασκόν
  choice: pergilah ke Damsyik
  rationale: Ungkapan ini menyatakan gerak menuju kota. “Ke Damsyik” merupakan bentuk Indonesia yang alami tanpa menghilangkan arah geraknya.
- source_word: κἀκεῖ
  choice: Di sana
  rationale: Bentuk singkat καὶ ἐκεῖ menunjuk pada lokasi berikutnya dalam urutan tindakan; pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang lancar.
- source_word: λαληθήσεται
  choice: akan diberitahukan kepadamu
  rationale: Bentuk pasif futurum λαλέω dengan datif σοι paling wajar diterjemahkan sebagai konstruksi pasif impersonal ini, dengan penerima informasi tetap dinyatakan.
- source_word: περὶ πάντων
  choice: segala sesuatu
  rationale: περί dengan genitif memperkenalkan isi yang akan disampaikan. Dalam konstruksi “diberitahukan kepadamu,” bahasa Indonesia tidak memerlukan padanan eksplisit “tentang”.
- source_word: τέτακταί σοι ποιῆσαι
  choice: yang telah ditetapkan bagimu untuk dilakukan
  rationale: Perfek pasif τάσσω menyatakan sesuatu yang sudah ditetapkan dan tetap berlaku. Terjemahan ini mempertahankan penetapan ilahi tanpa menentukan lebih jauh mekanisme teologisnya, serta mempertahankan datif σοι sebagai “bagimu”.
theological_decisions:
- issue: Daya τέτακταί dalam kaitannya dengan pengarahan dan panggilan ilahi
  choice: telah ditetapkan bagimu untuk dilakukan
  alternative: telah ditugaskan kepadamu untuk dilakukan
  rationale: Pilihan ini mempertahankan gagasan bahwa tindakan Paulus telah ditentukan secara ilahi, tetapi tidak memasukkan sistem teologis yang lebih kuat daripada yang dinyatakan ayat itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina klitik “kulakukan” alami dalam ujaran langsung, sedangkan imperatif “Bangunlah” dan “pergilah” menjaga kesungguhan perintah. Nama tempat diterjemahkan dengan bentuk Indonesia yang lazim, “Damsyik”.
