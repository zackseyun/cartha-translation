  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: id
  text: Namun, ketika mereka merentangkan Paulus dengan tali-tali kulit, Paulus berkata kepada perwira seratus yang berdiri di situ, “Apakah hukum membolehkan kalian mencambuk seorang warga negara Romawi yang belum dijatuhi hukuman?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: mereka merentangkan Paulus dengan tali-tali kulit
  rationale: Kata kerja προτείνω dalam konteks ini menggambarkan tindakan merentangkan Paulus sebagai persiapan pencambukan, sedangkan ἱμᾶσιν menunjuk pada tali atau tali kulit. Nama Paulus dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: ἑστῶτα
  choice: yang berdiri di situ
  rationale: Partisip ini menggambarkan perwira yang sedang berdiri dekat atau hadir di tempat kejadian; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran adegan.
- source_word: ἑκατόνταρχον
  choice: perwira
  rationale: ἑκατόνταρχος adalah komandan Romawi yang secara tradisional disebut centurion; 'perwira' merupakan padanan Indonesia yang ringkas dan mudah dipahami dalam konteks militer Romawi.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: seorang warga negara Romawi
  rationale: Secara harfiah frasa ini berarti 'seorang Romawi', tetapi dalam pertanyaan hukum ini Ῥωμαῖον menunjuk pada status kewarganegaraan Romawi yang memberi perlindungan hukum. Padanan ini menyampaikan maksud kontekstual secara alami tanpa mengubah pokok klaim Paulus.
- source_word: ἀκατάκριτον
  choice: yang belum dijatuhi hukuman
  rationale: Adjektiva ini berarti belum dihukum berdasarkan putusan pengadilan. Ungkapan Indonesia ini lebih alami daripada bentuk harfiah yang kaku dan tetap mempertahankan tekanan yuridisnya.
- source_word: ἔξεστιν ὑμῖν
  choice: Apakah kalian dibenarkan oleh hukum
  rationale: ἔξεστιν menanyakan apakah tindakan tersebut diperbolehkan atau sah. Bentuk jamak ὑμῖν dipertahankan dengan 'kalian', sebab Paulus berbicara kepada perwira mengenai tindakan aparat yang terlibat.
- source_word: μαστίζειν
  choice: mencambuk
  rationale: Kata ini menunjuk pada pencambukan berat sebagai hukuman atau pemeriksaan. 'Mencambuk' jelas, modern, dan cukup kuat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pertanyaan mempertahankan nada keberatan hukum Paulus. Tidak diperlukan catatan kaki karena status kewarganegaraan yang tersirat dalam ἄνθρωπον Ῥωμαῖον paling jelas disampaikan langsung dalam teks.
