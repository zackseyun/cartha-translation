    rationale: “Perwira” dapat diterima secara umum, tetapi tidak menyampaikan bahwa ia adalah seorang centurion, yakni perwira yang mengepalai seratus prajurit. “Perwira seratus” mempertahankan ketelitian sumber secara cukup alami.
  - severity: low
    issue: Ungkapan “kalian dibenarkan oleh hukum” kurang idiomatis dalam pertanyaan langsung.
    rationale: Maknanya benar, tetapi “Apakah hukum membolehkan kalian ...?” lebih alami dan tetap mencerminkan ἔξεστιν ὑμῖν.
