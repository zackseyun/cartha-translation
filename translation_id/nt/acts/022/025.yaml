  to: Namun, ketika mereka merentangkan Paulus dengan tali-tali kulit, Paulus berkata kepada perwira seratus yang berdiri di situ, “Apakah hukum membolehkan kalian mencambuk seorang warga negara Romawi yang belum dijatuhi hukuman?”
