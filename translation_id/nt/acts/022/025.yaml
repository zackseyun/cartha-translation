review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia. Namun, ἑκατόνταρχος menyatakan pangkat yang lebih khusus daripada sekadar “perwira”; “perwira seratus” mempertahankan unsur tersebut. Bentuk jamak ὑμῖν sebaiknya tetap terdengar sebagai acuan kepada pihak/aparat yang sedang bertindak, bukan percakapan akrab dengan satu orang.
  naturalness: Susunan kalimat dan istilah hukum sudah alami dalam bahasa Indonesia modern. “Apakah hukum membolehkan kalian ...?” lebih lancar dan langsung daripada “Apakah kalian dibenarkan oleh hukum ...?”.
  terminology: “Warga negara Romawi,” “belum dijatuhi hukuman,” dan “mencambuk” tepat untuk konteks hukum Romawi dan tidak memaksakan penafsiran teologis. “Perwira seratus” dipilih untuk ἑκατόνταρχος.
