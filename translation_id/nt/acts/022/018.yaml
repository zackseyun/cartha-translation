  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: id
  text: Dan aku melihat Dia berkata kepadaku, “Cepatlah, keluarlah segera dari Yerusalem, sebab mereka tidak akan menerima kesaksianmu tentang Aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: aku melihat
  rationale: Infinitif ini meneruskan laporan penglihatan Paulus secara idiomatis; bentuk finit menghasilkan bahasa Indonesia yang alami sambil mempertahankan persepsi dalam penglihatan.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Tuhan yang tampak dalam konteks sebelumnya. Huruf kapital membantu mengikuti kebiasaan bahasa Indonesia bagi rujukan ilahi tanpa mengganti pronomina Yunani dengan gelar atau nama.
- source_word: λέγοντά μοι
  choice: berkata kepadaku
  rationale: Partisip ini menerangkan αὐτόν dan memperkenalkan ucapan langsung; terjemahan ini dekat dengan bentuk sumber dan alami dalam bahasa Indonesia.
- source_word: Σπεῦσον
  choice: Cepatlah
  rationale: Imperatif aoris menyatakan desakan. 'Cepatlah' merupakan perintah yang lugas dan modern.
- source_word: ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ
  choice: segera keluarlah dari Yerusalem
  rationale: '''Keluarlah'' mempertahankan gerak ke luar yang dinyatakan oleh ἔξελθε dan ἐξ, sedangkan ''segera'' menyampaikan ἐν τάχει. Bersama ''Cepatlah'', susunan ini mempertahankan penegasan ganda atas urgensi.'
- source_word: διότι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah; 'sebab' jelas, alami, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: οὐ παραδέξονταί
  choice: mereka tidak akan menerima
  rationale: Dalam konteks ini παραδέχομαι berarti menerima atau menyambut baik. 'Menerima' paling wajar sebagai predikat bagi 'kesaksian'.
- source_word: σου μαρτυρίαν
  choice: kesaksianmu
  rationale: μαρτυρία menunjuk pada kesaksian Paulus mengenai Yesus; 'kesaksian' mempertahankan nuansa pemberitaan dan pembuktian.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: περί dengan genitif menyatakan pokok atau rujukan. 'Tentang Aku' adalah padanan modern yang langsung; kapitalisasi mengikuti rujukan ilahi dalam konteks.
theological_decisions:
- issue: Rujukan αὐτόν dalam laporan penglihatan Paulus
  choice: Mempertahankan pronomina 'Dia'
  alternative: Mengganti dengan 'Tuhan' atau 'Yesus'
  rationale: Konteks mengidentifikasi pembicara, tetapi teks ayat ini memakai pronomina. Mempertahankan pronomina menghindari penambahan gelar atau nama yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Penegasan ganda atas urgensi dipertahankan melalui 'Cepatlah, segera keluarlah'. Tidak diperlukan catatan kaki karena alternatif 'menerima' tidak menghasilkan ambiguitas penting dalam bahasa Indonesia.
