  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: id
  text: Aku pun berkata, “Tuhan, mereka sendiri tahu bahwa di setiap rumah ibadat[a] aku dahulu memenjarakan dan memukuli orang-orang yang percaya kepada-Mu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari rumah ibadat ke rumah ibadat”; ungkapan Yunani ini bersifat distributif dan menunjukkan tindakan berulang di sejumlah rumah ibadat.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang mengandalkan-Mu” atau “yang menaruh iman kepada-Mu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: Aku pun
  rationale: Kontraksi καὶ ἐγώ mengandung kesinambungan naratif serta penekanan ringan pada Paulus sendiri; “Aku pun” menyampaikan keduanya secara alami.
- source_word: εἶπον
  choice: berkata
  rationale: Bentuk aoris dari λέγω dalam pengantar ujaran langsung paling wajar diterjemahkan “berkata”.
- source_word: Κύριε
  choice: Tuhan
  rationale: Vokatif κύριος ditujukan kepada Yesus dalam penglihatan Paulus; “Tuhan” mempertahankan sapaan hormat dan bobot kristologis tanpa menambahkan penafsiran.
- source_word: αὐτοὶ ἐπίστανται
  choice: mereka sendiri tahu
  rationale: “Mereka sendiri” mempertahankan penekanan αὐτοί, sedangkan “tahu” adalah padanan alami untuk ἐπίστανται dalam konteks ini.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: aku dahulu memenjarakan dan memukuli
  rationale: Konstruksi perifrastik imperfek menggambarkan tindakan yang berlangsung atau berulang pada masa lampau. “Dahulu” membuat acuan masa lampau jelas, sementara verba paralel mempertahankan tindakan berulang tanpa ungkapan Indonesia yang kaku.
- source_word: φυλακίζων
  choice: memenjarakan
  rationale: φυλακίζω berarti memasukkan atau menahan seseorang dalam penjara; “memenjarakan” ringkas dan tepat.
- source_word: δέρων
  choice: memukuli
  rationale: Bentuk “memukuli” secara alami menyatakan tindakan memukul yang berulang dan tidak mempersempit makna menjadi penghukuman cambuk secara resmi.
- source_word: κατὰ τὰς συναγωγάς
  choice: di setiap rumah ibadat
  rationale: κατά dengan bentuk akusatif di sini bersifat distributif, menunjuk pada tindakan di sejumlah rumah ibadat. “Di setiap rumah ibadat” jelas dan alami dalam bahasa Indonesia.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: orang-orang yang percaya kepada-Mu
  rationale: Partisipel kini dengan ἐπί menyatakan kepercayaan yang diarahkan kepada Yesus. “Percaya kepada-Mu” mempertahankan makna iman atau kepercayaan tersebut secara alami.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan; Penguasa
  rationale: Dalam kisah perjumpaan Paulus dengan Yesus yang bangkit, “Tuhan” mempertahankan baik fungsi sapaan maupun bobot kristologis teks, tanpa menjelaskan lebih jauh daripada yang dinyatakan.
- issue: Aspek penganiayaan Paulus pada masa lampau
  choice: aku dahulu memenjarakan dan memukuli
  alternative: aku biasa memenjarakan dan memukuli
  rationale: Konstruksi Yunani menampilkan kegiatan yang berlangsung atau menjadi kebiasaan pada masa lampau. Pilihan utama terdengar lebih alami dalam konteks pengakuan Paulus, sedangkan sifat berulang juga didukung oleh “di setiap rumah ibadat” dan bentuk “memukuli”.
- issue: Makna πιστεύοντας ἐπὶ σέ
  choice: yang percaya kepada-Mu
  alternative: yang mengandalkan-Mu; yang menaruh iman kepada-Mu
  rationale: Ungkapan Yunani dapat mencakup percaya, memercayakan diri, atau menaruh iman kepada Yesus. Pilihan utama mempertahankan keluasan maknanya dan tidak memasukkan rumusan doktrinal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Rumah ibadat” dipakai sebagai padanan alami untuk συναγωγή, dan pronomina ilahi ditulis “-Mu” sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
