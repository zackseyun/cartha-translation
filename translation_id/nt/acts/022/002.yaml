  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: id
  text: 'Ketika mereka mendengar bahwa Paulus berbicara kepada mereka dalam bahasa Ibrani[a], mereka menjadi semakin diam. Lalu Paulus berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “bahasa Aram”; teks Yunani menyebut “bahasa Ibrani”, yang dalam konteks ini dapat merujuk pada bahasa Semit setempat di Yudea.
    reason: Menjaga ungkapan eksplisit teks sumber sekaligus mencatat kemungkinan rujukan linguistiknya.
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Ketika mereka mendengar
  rationale: Partisip aoris menyatakan keadaan waktu yang mendahului reaksi orang banyak. δὲ menandai perkembangan ringan dalam narasi dan tidak perlu diterjemahkan secara terpisah karena hubungan itu sudah alami dalam bahasa Indonesia.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: dalam bahasa Ibrani
  rationale: Ungkapan Yunani secara eksplisit menyebut bahasa/dialek Ibrani. Terjemahan utama mempertahankan sebutan itu, sementara kemungkinan rujukannya kepada bahasa Aram dijelaskan dalam catatan kaki.
- source_word: προσεφώνει αὐτοῖς
  choice: Paulus berbicara kepada mereka
  rationale: Bentuk imperfek menggambarkan tindakan berbicara yang sedang berlangsung dan diarahkan kepada orang banyak. Nama Paulus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: mereka menjadi semakin tenang
  rationale: Ungkapan idiomatis yang secara harfiah berarti 'memberikan ketenangan/keheningan' menyatakan bahwa orang banyak makin diam. 'Semakin tenang' alami dan mempertahankan daya komparatif μᾶλλον.
- source_word: καὶ φησίν
  choice: Lalu Paulus berkata,
  rationale: Present historis dialihkan ke bentuk naratif Indonesia yang wajar. 'Lalu' menandai kelanjutan, dan nama Paulus memperjelas subjek ketika ayat berakhir dengan pengantar ujaran.
theological_decisions:
- issue: Rujukan frasa 'bahasa Ibrani'
  choice: Mempertahankan 'bahasa Ibrani' dalam teks utama
  alternative: Menerjemahkannya langsung sebagai 'bahasa Aram'
  rationale: Teks Yunani secara eksplisit memakai Ἑβραΐς. Dalam konteks ini istilah tersebut mungkin menunjuk kepada bahasa Aram, tetapi kepastian itu tidak boleh dimasukkan ke teks utama dengan menghapus ambiguitas historisnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Semakin tenang' dipilih daripada ungkapan harfiah yang kaku. Nama Paulus diulang demi kejelasan rujukan tanpa mengubah makna.
