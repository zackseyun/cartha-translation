  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: id
  text: Sekarang, mengapa kamu masih menunggu? Bangunlah, dibaptislah, dan basuhlah dosa-dosamu sambil berseru kepada nama-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Partisip Yunani ini dapat juga dipahami sebagai “dengan berseru kepada nama-Nya.” Teks tersebut tidak menentukan secara tegas apakah seruan itu merupakan sarana pembasuhan dosa atau tindakan yang menyertainya.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: mengapa kamu masih menunggu
  rationale: Dalam konteks pertanyaan ini, μέλλω menyatakan penundaan. Ungkapan ini menyampaikan teguran mendesak secara alami dalam bahasa Indonesia.
- source_word: ἀναστὰς
  choice: Bangunlah
  rationale: Partisip aoris ini menyertai perintah-perintah berikutnya dan secara idiomatis dapat diungkapkan sebagai perintah tersendiri.
- source_word: βάπτισαι
  choice: berilah dirimu dibaptis
  rationale: Bentuk imperatif medium menunjukkan keterlibatan subjek dalam menerima baptisan. Rumusan ini lebih dekat pada bentuk Yunani daripada sekadar bentuk pasif, tetapi tetap dapat dipahami pembaca modern.
- source_word: ἀπόλουσαι
  choice: basuhlah
  rationale: Verba medium ini, dengan 'dosa-dosamu' sebagai objek, bermakna membasuh atau membersihkan hingga lenyap. 'Basuhlah dosa-dosamu' mempertahankan citra sumber secara langsung.
- source_word: τὰς ἁμαρτίας σου
  choice: dosa-dosamu
  rationale: Padanan langsung ini mempertahankan makna umum ἁμαρτία tanpa penambahan tafsiran.
- source_word: ἐπικαλεσάμενος
  choice: dengan berseru kepada
  rationale: Partisip aoris ini dapat menunjukkan sarana atau keadaan yang menyertai. 'Dengan berseru kepada' merupakan ungkapan Indonesia yang alami, sementara catatan kaki mengakui kemungkinan hubungan sintaksis yang lebih netral.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya
  rationale: Teks Yunani memakai pronomina αὐτοῦ, bukan gelar eksplisit. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan tanpa mengganti pronomina itu dengan 'Tuhan' atau 'Yesus'.
theological_decisions:
- issue: Hubungan antara baptisan, pembasuhan dosa, dan berseru kepada nama-Nya
  choice: Urutan perintah Yunani dipertahankan, dan partisip diterjemahkan sebagai 'dengan berseru kepada', tanpa menyatakan secara eksplisit suatu sistem teologi sakramental.
  alternative: Partisip dapat diterjemahkan lebih netral sebagai 'sambil berseru kepada nama-Nya', sehingga hubungan sarana tidak ditegaskan.
  rationale: Teks mengoordinasikan perintah untuk dibaptis dan membasuh dosa, lalu menambahkan partisip. Terjemahan tidak boleh memutuskan secara berlebihan apakah baptisan saja, seruan kepada nama-Nya, atau keseluruhan rangkaian merupakan sarana yang dimaksud.
translation_notes:
  register: Bahasa modern, lugas, dan mendesak. 'Berilah dirimu dibaptis' dipilih untuk mencerminkan bentuk medium, meskipun sedikit lebih formal daripada 'dibaptislah'. Penanda catatan kaki ditempatkan setelah seluruh klausa yang diterangkannya.
