  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan unsur-unsur Yunani: penghubung naratif καί, ujaran langsung kepada Paulus, imperatif Πορεύου, alasan kausal ὅτι, pengutusan pada masa depan, unsur jarak μακράν, dan tujuan εἰς ἔθνη. “Bangsa-bangsa lain” dalam konteks ini dapat menyampaikan ἔθνη sebagai kelompok non-Yahudi, dan alternatifnya dijelaskan dalam catatan kaki.'
