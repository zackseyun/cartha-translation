  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: id
  text: Lalu Dia berkata kepadaku, “Pergilah, sebab Aku akan mengutusmu jauh kepada bangsa-bangsa lain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada orang-orang bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: Dia berkata kepadaku
  rationale: λέγω dengan πρός dan akusatif memperkenalkan perkataan langsung yang ditujukan kepada seseorang. Bentuk ini alami dan mempertahankan gaya naratif.
- source_word: Πορεύου
  choice: Pergilah
  rationale: Imperatif πορεύομαι berfungsi sebagai perintah untuk pergi atau berangkat. “Pergilah” ringkas, wajar, dan sesuai dengan daya imperatif Yunani.
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan bagi perintah sebelumnya. “Sebab” mempertahankan hubungan kausal secara jelas dan bermartabat.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina Yunani yang dinyatakan secara eksplisit memberi penekanan pada sang pengutus. Huruf kapital mengikuti kebiasaan bahasa Indonesia ketika pronomina merujuk kepada Tuhan, tanpa menambahkan isi semantis.
- source_word: εἰς ἔθνη
  choice: kepada bangsa-bangsa lain
  rationale: Dalam konteks misi Paulus, ἔθνη menunjuk kepada bangsa-bangsa bukan Yahudi. “Bangsa-bangsa lain” menyampaikan pembedaan historis tersebut dengan bahasa Indonesia yang alami, sementara alternatif “orang-orang bukan Yahudi” dicatat dalam catatan kaki.
- source_word: μακρὰν
  choice: jauh
  rationale: μακράν menekankan jarak tujuan pengutusan. “Jauh” mempertahankan unsur geografis itu tanpa memperluas makna.
- source_word: ἐξαποστελῶ
  choice: akan mengutus
  rationale: ἐξαποστέλλω berarti mengirim atau mengutus keluar. “Mengutus” sesuai untuk penugasan misi dan lebih tepat daripada sekadar “mengirim”, tanpa merinci mandat yang tidak dinyatakan.
- source_word: σε
  choice: -mu
  rationale: Pronomina objek orang kedua tunggal diwujudkan secara alami sebagai enklitik pada verba “mengutusmu”.
theological_decisions:
- issue: Makna ἔθνη dalam konteks pengutusan Paulus
  choice: bangsa-bangsa lain
  alternative: orang-orang bukan Yahudi
  rationale: Konteks Kisah Para Rasul menunjukkan pengutusan kepada kelompok-kelompok non-Yahudi, bukan semata-mata negara secara geopolitik. Pilihan utama mempertahankan citra kolektif ἔθνη, sedangkan catatan kaki menjelaskan rujukan etnoreligiusnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mengikuti alur Yunani secara alami. “Lalu” menerjemahkan καί sebagai penghubung naratif. Kapitalisasi “Dia” dan “Aku” menandai rujukan kepada Tuhan sesuai kebiasaan penerbitan Alkitab Indonesia.
