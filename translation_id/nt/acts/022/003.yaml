id: ACT.22.3
reference: Acts 22:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: id
  text: “Saya adalah seorang laki-laki Yahudi, lahir di Tarsus di Kilikia, tetapi dibesarkan di kota ini di kaki Gamaliel[a]. Saya dididik dengan ketat menurut hukum nenek moyang kita[b] dan bersemangat bagi Allah, sama seperti kamu semua sekarang ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di kaki Gamaliel” berarti dididik di bawah bimbingan Gamaliel sebagai seorang murid.
    reason: cultural_note
  - marker: b
    text: Atau “hukum leluhur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: seorang Yahudi
  rationale: Dalam konteks perkenalan diri ini, ungkapan alami bahasa Indonesia 'seorang Yahudi' sudah merujuk kepada Paulus sebagai laki-laki dewasa; menerjemahkan ἀνήρ secara terpisah sebagai 'laki-laki Yahudi' akan terasa kaku tanpa menambah informasi penting.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: lahir di Tarsus di Kilikia
  rationale: Bentuk partisip perfek secara alami diterjemahkan 'lahir'; Kilikia dinyatakan sebagai wilayah tempat Tarsus berada.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: tetapi dibesarkan di kota ini
  rationale: ἀνατρέφω menunjuk pada proses dibesarkan, dan δέ menandai kontras antara tempat kelahiran dan tempat pertumbuhan.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: di kaki Gamaliel
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom guru-murid dalam teks Yunani; catatan kaki menjelaskan maksud budayanya.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: dididik dengan ketat
  rationale: Ungkapan ini menyampaikan pendidikan atau pelatihan yang saksama dan ketat dalam bentuk Indonesia yang alami.
- source_word: τοῦ πατρῴου νόμου
  choice: hukum nenek moyang kita
  rationale: πατρῷος berarti warisan leluhur. Kata 'kita' mengungkapkan solidaritas Paulus dengan para pendengar Yahudinya yang tersirat oleh konteks, sambil mempertahankan kemungkinan terjemahan yang lebih harfiah dalam catatan.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: giat bagi Allah
  rationale: ζηλωτής menyatakan semangat atau kegairahan yang kuat bagi Allah. 'Giat' alami dalam bahasa Indonesia dan tidak mengimpor arti teknis-politis 'orang Zelot'.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: sama seperti kamu semua pada hari ini
  rationale: Terjemahan ini mempertahankan perbandingan retoris Paulus dengan seluruh pendengarnya dan kaitan σήμερον dengan keadaan mereka saat itu.
theological_decisions:
- issue: Cara menerjemahkan πατρῴου νόμου dalam pidato Paulus kepada sesama orang Yahudi
  choice: hukum nenek moyang kita
  alternative: hukum leluhur; hukum nenek moyang
  rationale: Pilihan ini mencerminkan warisan bersama yang ditekankan Paulus tanpa menentukan tafsir denominasi; catatan menjaga alternatif leksikal yang tidak mengeksplisitkan solidaritas tersebut.
- issue: Apakah idiom παρὰ τοὺς πόδας Γαμαλιήλ dipertahankan
  choice: di kaki Gamaliel
  alternative: di bawah bimbingan Gamaliel
  rationale: Idiom literal mempertahankan gambaran historis hubungan murid dan guru, sedangkan catatan kaki mencegah kesalahpahaman.
- issue: Makna ζηλωτής dalam kaitannya dengan Allah
  choice: giat bagi Allah
  alternative: bersemangat untuk Allah; seorang yang sangat giat bagi Allah
  rationale: Pilihan ini mempertahankan kesungguhan religius Paulus serta perbandingannya dengan para pendengar, tanpa mengidentifikasikannya dengan kelompok politik tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah menjadi dua agar pidato panjang Yunani tetap mudah dipahami. Sapaan 'kamu semua' mempertahankan bentuk jamak dan kedekatan retoris Paulus dengan para pendengarnya.
