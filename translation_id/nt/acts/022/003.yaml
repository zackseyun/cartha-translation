  to: “Saya adalah seorang laki-laki Yahudi, lahir di Tarsus di Kilikia, tetapi dibesarkan di kota ini di kaki Gamaliel[a]. Saya dididik dengan ketat menurut hukum nenek moyang kita[b] dan bersemangat bagi Allah, sama seperti kamu semua sekarang ini.”
