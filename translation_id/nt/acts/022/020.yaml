source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: id
  text: Dan ketika darah Stefanus, saksi-Mu[a], sedang ditumpahkan, aku sendiri berdiri di situ dan menyetujui hal itu, sambil menjaga pakaian luar orang-orang yang membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “martir”. Kata Yunani ini dapat berarti “saksi” dan dalam pemakaian Kristen kemudian terutama dikaitkan dengan orang yang mati karena kesaksiannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: ditumpahkan
  rationale: Bentuk imperfek pasif menyatakan darah yang sedang dicurahkan. Dalam bahasa Indonesia, 'ditumpahkan' mempertahankan metafora Yunani secara wajar; aspek berlangsungnya sudah didukung oleh konteks 'ketika' dan dua tindakan partisipial yang menyertainya.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung dan lazim, tanpa alasan kontekstual untuk diparafrasakan.
- source_word: μάρτυρός
  choice: saksi
  rationale: Makna leksikal dasarnya adalah orang yang memberi kesaksian. 'Martir' merupakan perkembangan pemakaian Kristen yang sangat relevan dalam konteks kematian Stefanus, tetapi tidak menggantikan makna dasar dalam teks utama.
- source_word: ἐφεστὼς
  choice: berdiri di situ
  rationale: Mengungkapkan kehadiran Paulus di tempat kejadian tanpa memberi kesan pasif atau netral yang tidak terdapat dalam kata itu sendiri.
- source_word: συνευδοκῶν
  choice: menyetujuinya
  rationale: Menunjukkan persetujuan aktif terhadap pembunuhan Stefanus. Akhiran '-nya' merujuk pada tindakan menumpahkan darah Stefanus.
- source_word: φυλάσσων
  choice: menjaga
  rationale: Padanan konkret dan alami untuk tindakan mengawasi serta mengamankan pakaian yang dititipkan.
- source_word: ἱμάτια
  choice: pakaian luar
  rationale: Ἱμάτια menunjuk pada pakaian, khususnya pakaian luar; pilihan ini lebih tepat daripada 'jubah' yang terlalu spesifik dan lebih informatif daripada 'pakaian' saja.
- source_word: ἀναιρούντων
  choice: membunuh
  rationale: Dalam konteks ini berarti menghilangkan nyawa atau membunuh. Pilihan ini lugas dan tidak menambahkan penilaian hukum yang tersirat dalam 'membunuh dengan keji' atau istilah lain.
- source_word: αὐτὸς
  choice: aku sendiri
  rationale: Mempertahankan penekanan pada keterlibatan pribadi Paulus.
theological_decisions:
- issue: Penerjemahan μάρτυς sebagai sebutan bagi Stefanus
  choice: saksi
  alternative: martir
  rationale: Teks Yunani mempertahankan makna dasar 'saksi', sedangkan konteks kematian membuat pengertian 'martir' menonjol dalam pemakaian Kristen. Teks utama memakai 'saksi' dan catatan kaki mempertahankan alternatif tersebut tanpa memaksakan perkembangan istilah yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang khidmat tetapi tetap alami. Sapaan kepada Tuhan ditulis 'saksi-Mu'. 'Pakaian luar' dipilih untuk ketepatan konkret tanpa memakai istilah kuno.
