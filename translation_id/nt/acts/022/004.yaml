  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: id
  text: Aku menganiaya Jalan ini[a] hingga ke taraf kematian[b], dengan mengikat dan menyerahkan laki-laki maupun perempuan ke dalam penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jalan ini" atau "gerakan ini." Secara harfiah, bahasa Yunani mengatakan "jalan ini," tetapi dalam Kisah Para Rasul ungkapan tersebut sering menjadi sebutan bagi gerakan pengikut Yesus.
    reason: lexical_alternative
  - marker: b
    text: Atau "sampai mati." Ungkapan ini menunjukkan bahwa penganiayaan itu dilakukan hingga batas yang sangat ekstrem, sampai pada kematian, tanpa menjelaskan secara terperinci peran Paulus dalam kematian apa pun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: Jalan ini
  rationale: ὁδός secara harfiah berarti jalan, tetapi dalam Kisah Para Rasul juga menjadi sebutan bagi gerakan atau komunitas pengikut Yesus. Huruf kapital mempertahankan fungsi sebutan itu tanpa menggantinya dengan istilah gerejawi yang lebih kemudian.
- source_word: ἐδίωξα
  choice: Aku menganiaya
  rationale: Dalam konteks ini διώκω menunjuk pada pengejaran yang bermusuhan terhadap orang percaya; 'menganiaya' menyampaikan makna kontekstualnya dengan wajar.
- source_word: ἄχρι θανάτου
  choice: sampai mati
  rationale: Ungkapan ini menyatakan batas atau tingkat penganiayaan yang mematikan, sambil mempertahankan ketidakjelasan sumber mengenai apakah Paulus sendiri membunuh atau tindakannya berujung pada kematian.
- source_word: δεσμεύων
  choice: dengan mengikat
  rationale: Partisip ini secara konkret berarti mengikat. Pilihan ini mempertahankan gambaran sumber dan tidak langsung menyempitkannya menjadi sekadar 'menangkap'.
- source_word: παραδιδοὺς
  choice: menyerahkan
  rationale: Di sini kata tersebut berarti menyerahkan orang ke dalam tahanan atau kekuasaan pihak berwenang.
- source_word: εἰς φυλακὰς
  choice: ke penjara-penjara
  rationale: Bentuk jamak φυλακάς dipertahankan, sedangkan 'ke' secara alami menyatakan gerak menuju tempat penahanan dalam bahasa Indonesia.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: baik laki-laki maupun perempuan
  rationale: Pasangan korelatif ini mempertahankan penekanan bahwa penganiayaan tersebut mencakup kedua kelompok.
theological_decisions:
- issue: Apakah ἡ ὁδός diterjemahkan sebagai nomina umum atau sebutan bagi gerakan Kristen
  choice: Jalan ini, dengan huruf kapital
  alternative: jalan ini; gerakan ini
  rationale: Dalam Kisah Para Rasul, ἡ ὁδός berulang kali berfungsi sebagai sebutan yang dikenal bagi iman atau komunitas pengikut Yesus. 'Jalan' mempertahankan metafora sumber, sedangkan huruf kapital menandai fungsi khususnya.
- issue: Cakupan makna ἄχρι θανάτου
  choice: sampai mati
  alternative: bahkan sampai menyebabkan kematian; sampai taraf mematikan
  rationale: Terjemahan ini mempertahankan daya ungkapan sekaligus tidak memastikan secara berlebihan siapa yang mati atau bagaimana kematian itu terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan partisip Yunani dibuat alami dengan 'dengan', sementara gambaran konkret 'mengikat' dan bentuk jamak 'penjara-penjara' dipertahankan. Kapitalisasi 'Jalan' menandai sebutan khusus tanpa menambahkan istilah denominatif.
