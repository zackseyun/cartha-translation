id: ACT.22.14
reference: Acts 22:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: id
  text: Lalu ia berkata, “Allah nenek moyang kita telah menetapkan engkau[a] untuk mengetahui kehendak-Nya, melihat Orang Benar[b], dan mendengar suara dari mulut-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah memilih engkau.” Kata Yunani yang dipakai dapat berarti memilih atau menetapkan seseorang untuk suatu tugas.
    reason: lexical_alternative
  - marker: b
    text: “Orang Benar” adalah gelar bagi Yesus; dapat juga diterjemahkan “Yang Adil.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: telah menetapkan
  rationale: Kata kerja ini menyatakan pemilihan atau penetapan seseorang untuk suatu tugas. “Telah menetapkan” mempertahankan unsur penugasan yang dijelaskan oleh rangkaian infinitif berikutnya tanpa menambahkan gagasan waktu “sebelumnya” secara berlebihan.
- source_word: γνῶναι
  choice: untuk mengetahui
  rationale: Bentuk infinitif ini dapat mengandung nuansa mulai mengetahui, tetapi “untuk mengetahui” merupakan padanan alami dan cukup luas dalam rangkaian tujuan ini.
- source_word: τὸ θέλημα αὐτοῦ
  choice: kehendak-Nya
  rationale: “Kehendak” adalah padanan baku yang mempertahankan cakupan makna maksud dan keinginan Allah tanpa mempersempitnya menjadi hanya “rencana” atau “tujuan”.
- source_word: ἰδεῖν
  choice: melihat
  rationale: Padanan langsung dan alami untuk tindakan melihat; tidak perlu dinaikkan ragamnya menjadi “memandang” atau “menyaksikan”.
- source_word: τὸν δίκαιον
  choice: Yang Benar
  rationale: Frasa ini berfungsi sebagai gelar bagi Yesus dalam Kisah Para Rasul. “Yang Benar” mempertahankan makna moral δίκαιος dan terdengar wajar sebagai gelar dalam bahasa Indonesia.
- source_word: ἀκοῦσαι φωνὴν
  choice: mendengar suara
  rationale: φωνή tidak memakai artikel, sehingga “suara” tanpa penentu khusus tidak dibuat menjadi “suara itu”. Konteks “dari mulut-Nya” menunjukkan suara yang berupa ujaran.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: dari mulut-Nya
  rationale: Ungkapan konkret sumber dipertahankan untuk menegaskan bahwa Paulus mendengar perkataan secara langsung, bukan sekadar menerima pesan dari-Nya.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Allah nenek moyang kita
  rationale: Dalam bahasa Indonesia modern, “nenek moyang” adalah ungkapan alami bagi para leluhur dan tetap mempertahankan hubungan Paulus dengan warisan perjanjian Israel.
theological_decisions:
- issue: Apakah τὸν δίκαιον diterjemahkan sebagai gelar kristologis atau sekadar sifat deskriptif
  choice: Diterjemahkan sebagai gelar “Yang Benar” yang merujuk kepada Yesus
  alternative: “orang yang benar” atau “Yang Adil”
  rationale: Dalam Kisah Para Rasul, ungkapan ini dipakai secara khas untuk Yesus (bdk. Kis. 3:14; 7:52). Huruf kapital menandai fungsi gelarnya tanpa menambahkan identifikasi yang tidak dinyatakan langsung dalam ayat.
- issue: Cara menerjemahkan πατέρων dalam ungkapan perjanjian
  choice: “nenek moyang kita”
  alternative: “bapa-bapa kita” atau “leluhur kita”
  rationale: Walaupun kata Yunani berbentuk maskulin, ungkapan Indonesia “nenek moyang” merupakan padanan idiomatis yang lazim untuk para pendahulu Israel dan tidak mengubah rujukan historisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga tujuan—mengetahui, melihat, dan mendengar—dipertahankan. Ungkapan konkret “dari mulut-Nya” sengaja dipertahankan meskipun lebih harfiah daripada ungkapan percakapan sehari-hari.
