id: ACT.1.16
reference: Acts 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: id
  text: “Saudara-saudara, Kitab Suci harus digenapi, yang telah dikatakan sebelumnya oleh Roh Kudus melalui mulut Daud[a] tentang Yudas, yang telah menjadi penunjuk jalan bagi orang-orang yang menangkap Yesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui mulut Daud”; ungkapan ini menyatakan bahwa Roh Kudus berbicara melalui Daud sebagai perantara manusia.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara sekalian
  rationale: Sapaan ini ditujukan kepada para laki-laki yang hadir, tetapi terjemahan harfiah ‘laki-laki, saudara-saudara’ terasa kaku dalam bahasa Indonesia. ‘Saudara-saudara sekalian’ mempertahankan sapaan formal kepada kelompok itu secara alami.
- source_word: ἔδει πληρωθῆναι
  choice: harus digenapi
  rationale: Ungkapan ini menyampaikan keniscayaan penggenapan tanpa menjelaskan mekanisme teologisnya lebih jauh daripada teks sumber.
- source_word: τὴν γραφὴν
  choice: Kitab Suci
  rationale: Dalam konteks ini γραφή menunjuk pada firman suci yang dikutip sebagai berwibawa, bukan sekadar suatu tulisan biasa.
- source_word: ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον
  choice: yang telah disampaikan sebelumnya oleh Roh Kudus
  rationale: προεῖπε berarti mengatakan atau menyampaikan sebelumnya. Bentuk ini mempertahankan Roh Kudus sebagai pelaku ujaran tanpa mempersempitnya menjadi ramalan teknis.
- source_word: διὰ στόματος Δαυὶδ
  choice: melalui mulut Daud
  rationale: 'Terjemahan mempertahankan citra dan susunan instrumental teks Yunani: Roh Kudus berbicara dengan Daud sebagai perantara manusia.'
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: Yudaslah yang menjadi penunjuk jalan
  rationale: ‘Menjadi’ mencerminkan γενομένου, sedangkan ‘penunjuk jalan’ menyampaikan fungsi ὁδηγός dalam konteks membawa rombongan kepada Yesus.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: bagi orang-orang yang menangkap Yesus
  rationale: Dalam konteks ini συλλαμβάνω berarti menangkap atau menahan seseorang. ‘Menangkap’ jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Keniscayaan penggenapan Kitab Suci
  choice: harus digenapi
  alternative: telah ditentukan untuk terjadi oleh predestinasi ilahi
  rationale: Ayat menyatakan adanya keniscayaan, tetapi tidak menguraikan hubungan antara rencana ilahi dan tanggung jawab manusia. Terjemahan tidak menyelesaikan ketegangan itu secara denominatif.
- issue: Pelaku ilahi dan perantara manusia dalam penyampaian Kitab Suci
  choice: Roh Kudus ... melalui mulut Daud
  alternative: Daud berbicara karena diilhami Roh Kudus
  rationale: Teks Yunani secara langsung menampilkan Roh Kudus sebagai pembicara dan Daud sebagai perantara. Susunan ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami. Penegasan ‘Yudaslah’ memperjelas rujukan klausa partisipial tanpa menambah isi. Semua penanda catatan kaki dalam teks memiliki catatan yang sesuai.
