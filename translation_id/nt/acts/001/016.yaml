review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan. Draf menyampaikan keniscayaan penggenapan, Roh Kudus sebagai pembicara, Daud sebagai perantara, dan peran Yudas secara umum dengan tepat. Namun, pemecahan kalimat disertai penegasan “Yudaslah” menambahkan fokus kontrasif yang tidak ada dalam Yunani, dan “yang telah disampaikan” kurang langsung mencerminkan προεῖπε (“telah mengatakan/berbicara sebelumnya”).
  naturalness: Bahasa draf umumnya wajar dan bermartabat. “Saudara-saudara” adalah sapaan formal Indonesia yang alami; tambahan “sekalian” tidak perlu. Struktur satu kalimat pada revisi tetap jelas dan lebih dekat dengan hubungan relatif dalam teks sumber.
  terminology: “Kitab Suci,” “Roh Kudus,” “digenapi,” dan “menangkap Yesus” sudah tepat untuk register modern standar. “Penunjuk jalan” dapat dipertahankan sebagai padanan netral bagi ὁδηγός, tanpa menaikkan maknanya menjadi pemimpin atau pengkhianat.
  issues:
  - severity: medium
    issue: Penegasan “Yudaslah” tidak didukung teks sumber.
    rationale: τοῦ γενομένου ὁδηγοῦ hanya menerangkan Yudas sebagai orang yang menjadi pemandu; partikel fokus -lah memberi penekanan tambahan dan memisahkan keterangan itu dari antesedennya.
  - severity: low
    issue: “Yang telah disampaikan sebelumnya oleh Roh Kudus” kurang eksplisit sebagai tindakan berbicara.
    rationale: προεῖπε secara khusus berarti “mengatakan/berbicara sebelumnya.” “Telah dikatakan sebelumnya oleh Roh Kudus” mempertahankan Roh Kudus sebagai pembicara dengan lebih dekat.
  - severity: low
    issue: Penanda catatan kaki tidak ditempatkan pada ungkapan yang dijelaskan.
    rationale: Catatan menjelaskan “melalui mulut Daud”; penanda sebaiknya langsung mengikuti frasa tersebut, bukan diletakkan di akhir seluruh ayat.
  revised_text: “Saudara-saudara, Kitab Suci harus digenapi, yang telah dikatakan sebelumnya oleh Roh Kudus melalui mulut Daud[a] tentang Yudas, yang telah menjadi penunjuk jalan bagi orang-orang yang menangkap Yesus.”
  revised_footnotes:
  - marker: a
    text: Secara harfiah, “melalui mulut Daud”; ungkapan ini menyatakan bahwa Roh Kudus berbicara melalui Daud sebagai perantara manusia.
    reason: cultural_note
  revision_rationale: 'Revisi mempertahankan urutan dan hubungan sintaksis utama teks Yunani: keniscayaan penggenapan Kitab Suci; Roh Kudus sebagai pihak yang berbicara sebelumnya; Daud sebagai perantara; dan Yudas sebagai orang yang telah menjadi pemandu bagi para penangkap Yesus. Penegasan yang tidak tersurat dihapus, sedangkan catatan kaki dipindahkan ke frasa yang dijelaskannya.'
