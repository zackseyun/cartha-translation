revisions:
- from: “Saudara-saudara sekalian, Kitab Suci yang telah disampaikan sebelumnya oleh Roh Kudus melalui mulut Daud mengenai Yudas harus digenapi. Yudaslah yang menjadi penunjuk jalan bagi orang-orang yang menangkap Yesus.”[a]
  to: “Saudara-saudara, Kitab Suci harus digenapi, yang telah dikatakan sebelumnya oleh Roh Kudus melalui mulut Daud[a] tentang Yudas, yang telah menjadi penunjuk jalan bagi orang-orang yang menangkap Yesus.”
  rationale: 'Revisi mempertahankan urutan dan hubungan sintaksis utama teks Yunani: keniscayaan penggenapan Kitab Suci; Roh Kudus sebagai pihak yang berbicara sebelumnya; Daud sebagai perantara; dan Yudas sebagai orang yang telah menjadi pemandu bagi para penangkap Yesus. Penegasan yang tidak tersurat dihapus, sedangkan catatan kaki dipindahkan ke frasa yang dijelaskannya.'
