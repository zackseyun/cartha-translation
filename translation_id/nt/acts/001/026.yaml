  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: id
  text: Lalu mereka membuang undi bagi kedua orang itu, dan undi itu jatuh kepada Matias. Ia pun dihitung bersama kesebelas rasul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia pun dimasukkan ke dalam bilangan kesebelas rasul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: mereka membuang undi bagi kedua orang itu
  rationale: Ungkapan Yunani secara harfiah berarti 'memberikan undi kepada mereka', tetapi dalam konteks ini menunjuk pada penggunaan undi untuk memilih di antara dua calon. 'Membuang undi' merupakan ungkapan Indonesia yang alami; 'kedua orang itu' memperjelas rujukan pronomina dari konteks langsung tanpa menentukan cara teknis pengundian.
- source_word: κλήρους / ὁ κλῆρος
  choice: undi / undi itu
  rationale: Dalam konteks pemilihan ini, κλῆρος adalah undi yang digunakan untuk menentukan pilihan, bukan bagian atau warisan.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: undi itu jatuh kepada Matias
  rationale: Terjemahan ini mempertahankan metafora Yunani sekaligus memakai ungkapan Indonesia yang wajar untuk hasil pengundian.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: συγκατεψηφίσθη
  choice: dihitung bersama
  rationale: Kata kerja ini menyatakan bahwa Matias diperhitungkan atau dimasukkan dalam bilangan kelompok tersebut. 'Dihitung bersama' dekat dengan bentuk Yunani dan tidak menyiratkan lebih dari yang dinyatakan teks.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: bersama kesebelas rasul
  rationale: μετά dengan genitif berarti 'bersama/dengan'. Bentuk ini menunjukkan bahwa Matias diperhitungkan bersama kelompok sebelas rasul yang sudah ada.
theological_decisions:
- issue: Apakah συγκατεψηφίσθη perlu diterjemahkan dengan ungkapan yang menyiratkan penetapan ilahi atau jabatan gerejawi secara lebih kuat
  choice: Ia pun dihitung bersama kesebelas rasul
  alternative: Ia pun ditambahkan kepada kesebelas rasul; Ia pun terdaftar di antara kesebelas rasul
  rationale: Teks melaporkan hasil pengundian dan status Matias sesudahnya, tetapi kata kerja itu sendiri tidak mengharuskan rumusan teologis yang lebih kuat. 'Dihitung bersama' mempertahankan cakupan pernyataan Yunani dan ketegangan naratifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar alur tindakan dan hasilnya mudah dipahami. Istilah 'membuang undi' dipertahankan karena alami dan konkret dalam bahasa Indonesia; 'dihitung bersama' menjaga kedekatan dengan bahasa sumber tanpa menambahkan klaim teologis.
