  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: id
  text: Sebab ada tertulis dalam Kitab Mazmur, “Biarlah tempat kediamannya[a] menjadi sunyi sepi, dan janganlah ada seorang pun yang tinggal di dalamnya,” dan, “Biarlah orang lain mengambil tugas pengawasannya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat tinggalnya” atau “huniannya.” Kata Yunani ἔπαυλις menunjuk tempat tinggal atau kediaman.
    reason: lexical_alternative
  - marker: b
    text: Atau “jabatannya” atau “kedudukannya sebagai pengawas.” Kata Yunani ἐπισκοπή menunjuk tugas atau tanggung jawab pengawasan dan di sini tidak harus dipahami sebagai nama jabatan gerejawi teknis dari masa kemudian.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Rumus kutipan Kitab Suci yang alami dalam bahasa Indonesia dan mempertahankan daya kini dari bentuk perfektum pasif.
- source_word: βίβλῳ ψαλμῶν
  choice: Kitab Mazmur
  rationale: Padanan baku dan alami untuk nama kumpulan Mazmur dalam bahasa Indonesia.
- source_word: Γενηθήτω
  choice: Biarlah ... menjadi
  rationale: Mempertahankan daya imperatif/jusif dari kutipan tanpa mengubahnya menjadi sekadar pernyataan.
- source_word: ἔπαυλις
  choice: tempat kediaman
  rationale: Menunjuk tempat tinggal atau hunian dan sesuai dengan nada khidmat kutipan Mazmur.
- source_word: ἔρημος
  choice: sunyi
  rationale: Dalam konteks ini berarti ditinggalkan tanpa penghuni; 'sunyi' alami dan tidak menyiratkan bahwa tempat itu secara harfiah berubah menjadi padang gurun.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: janganlah ada orang yang tinggal di dalamnya
  rationale: Menyampaikan larangan beserta substantivisasi partisip secara jelas dan dekat dengan susunan Yunani.
- source_word: ἐπισκοπή
  choice: tugas pengawasan
  rationale: Mengungkapkan fungsi atau tanggung jawab mengawasi tanpa mengimpor jabatan gerejawi teknis dari masa kemudian.
- source_word: λαβέτω ἕτερος
  choice: Biarlah orang lain mengambil
  rationale: Mempertahankan bentuk jusif dan gagasan bahwa peran yang kosong itu diambil oleh orang lain.
theological_decisions:
- issue: Makna ἐπισκοπή dalam penerapan kutipan kepada peran Yudas
  choice: tugas pengawasan
  alternative: jabatan; kedudukan sebagai pengawas
  rationale: Istilah Yunani dapat menunjuk fungsi pengawasan, tugas, atau jabatan. 'Tugas pengawasan' mempertahankan unsur leksikal pengawasan sekaligus menghindari kesan bahwa teks secara khusus menetapkan jabatan gerejawi teknis yang berkembang kemudian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Bentuk “Biarlah” mempertahankan gaya jusif kedua kutipan. Penempatan penanda catatan kaki mengikuti unsur yang diterangkan dan setiap penanda terdapat dalam teks utama.
