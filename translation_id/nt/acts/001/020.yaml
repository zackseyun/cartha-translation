revisions:
- from: Sebab ada tertulis dalam Kitab Mazmur, “Biarlah tempat kediamannya menjadi sunyi, dan janganlah ada orang yang tinggal di dalamnya,”[a] dan, “Biarlah orang lain mengambil tugas pengawasannya.”[b]
  to: Sebab ada tertulis dalam Kitab Mazmur, “Biarlah tempat kediamannya[a] menjadi sunyi sepi, dan janganlah ada seorang pun yang tinggal di dalamnya,” dan, “Biarlah orang lain mengambil tugas pengawasannya.”[b]
  rationale: Revisi terbatas pada penguatan makna ἔρημος dari “sunyi” menjadi “sunyi sepi” dan pembetulan fungsi serta letak jangkar catatan a. Terjemahan “tugas pengawasannya” dipertahankan karena mencerminkan ἐπισκοπή sebagai peran/tanggung jawab pengawasan tanpa mengandaikan struktur gerejawi teknis kemudian.
