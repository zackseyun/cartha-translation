  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: id
  text: Lalu, setelah berdoa, mereka berkata, “Engkau, Tuhan[a], yang mengetahui hati semua orang, tunjukkanlah[b] siapa di antara kedua orang ini yang telah Engkau pilih.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “Tuhan” dapat dipahami sebagai ditujukan kepada Allah secara umum atau secara khusus kepada Yesus; teks Yunani tidak menyebutkan rujukannya secara eksplisit.
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “tunjukkanlah” juga dapat berarti “nyatakanlah” atau “tetapkanlah”; kata Yunani ini dapat menunjuk pada tindakan memperlihatkan pilihan atau menetapkan seseorang secara terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευξάμενοι
  choice: setelah berdoa
  rationale: Partisip aoris ini secara alami menunjukkan tindakan yang mendahului kata kerja utama; frasa ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: Σὺ κύριε
  choice: Engkaulah, Tuhan
  rationale: Akhiran -lah mempertahankan penekanan pada pronomina eksplisit Σὺ, sedangkan “Tuhan” mempertahankan sapaan κύριε tanpa menentukan rujukannya.
- source_word: καρδιογνῶστα πάντων
  choice: yang mengetahui hati semua orang
  rationale: Ungkapan ini menyampaikan gelar vokatif καρδιογνῶστα dalam bahasa Indonesia yang alami serta mempertahankan πάντων sebagai “semua orang”.
- source_word: ἀνάδειξον
  choice: Tunjukkanlah
  rationale: Dalam konteks permohonan agar pilihan yang sudah dibuat Tuhan dinyatakan, “Tunjukkanlah” menjaga cakupan makna tanpa menyiratkan secara berlebihan tindakan pelantikan.
- source_word: ὃν ἐξελέξω
  choice: siapa ... yang telah Engkau pilih
  rationale: Bentuk ini menunjukkan pilihan Tuhan yang telah terjadi dan kini perlu dinyatakan, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: siapa dari kedua orang ini
  rationale: Rumusan ini menyatakan pemilihan satu dari dua calon secara idiomatis; “orang” memperjelas rujukan personal yang sudah nyata dari konteks dan pronomina relatif maskulin.
theological_decisions:
- issue: Rujukan sapaan “Tuhan” dalam doa
  choice: Mempertahankan sapaan “Tuhan” tanpa menentukan apakah yang disapa adalah Allah secara umum atau secara khusus Yesus yang bangkit.
  alternative: Menafsirkan sapaan itu secara eksplisit sebagai ditujukan kepada Allah Bapa atau kepada Yesus.
  rationale: Teks Yunani hanya berbunyi Σὺ κύριε dan tidak menyebut rujukannya secara eksplisit; terjemahan harus mempertahankan ketegangan penafsiran ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkaulah” mempertahankan penekanan pronomina Yunani tanpa terdengar kaku. Penanda catatan kaki ditempatkan setelah klausa utama yang memuat pilihan leksikal dan ambiguitas sapaan.
