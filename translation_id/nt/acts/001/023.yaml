id: ACT.1.23
reference: Acts 1:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: id
  text: 'Lalu mereka mengajukan dua orang: Yusuf yang disebut Barsabas[a], yang juga disebut Yustus, dan Matias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetapkan dua orang” atau “menghadapkan dua orang”. Kata kerja Yunani ini dapat berarti menempatkan orang-orang di hadapan suatu kelompok dan di sini kemungkinan merujuk pada pengajuan mereka sebagai calon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: mengajukan
  rationale: Dalam konteks pemilihan ini, verba tersebut berarti menempatkan orang di hadapan kelompok sebagai calon. 'Mengajukan' menyampaikan makna prosedural tanpa menyiratkan bahwa mereka sudah resmi diangkat.
- source_word: δύο
  choice: dua orang
  rationale: Numeralia ini menunjuk kepada dua laki-laki yang diajukan; 'orang' ditambahkan secara wajar dalam bahasa Indonesia berdasarkan acuannya.
- source_word: καλούμενον
  choice: yang disebut
  rationale: Partisipel ini memperkenalkan nama atau sebutan lain bagi Yusuf.
- source_word: Βαρσαββᾶν
  choice: Barsabas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἐπεκλήθη
  choice: yang juga disebut
  rationale: Bentuk pasif ini memperkenalkan nama tambahan. 'Juga' menjernihkan hubungan dengan sebutan sebelumnya tanpa menambahkan informasi substantif.
- source_word: Ἰοῦστος
  choice: Yustus
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang lazim.
- source_word: καὶ ... καὶ
  choice: Lalu ... dan
  rationale: Kata pertama melanjutkan alur narasi, sedangkan kata kedua menghubungkan kedua calon. 'Lalu' alami dalam narasi Indonesia dan tetap mencerminkan kesinambungan teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan nama dan kedua klausa penyebutan dipertahankan dekat dengan teks Yunani; pilihan 'mengajukan' menjaga konteks pencalonan tanpa menganggap keputusan akhir sudah dibuat.
