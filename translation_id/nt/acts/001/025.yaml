  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: id
  text: untuk menerima tempat dalam pelayanan dan kerasulan ini, yang Yudas tinggalkan[a] untuk pergi ke tempatnya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang darinya Yudas menyimpang” atau “yang darinya Yudas beranjak.” Kata kerja Yunani dapat menyatakan penyimpangan atau kepergian dari pelayanan dan kerasulan itu.
    reason: lexical_alternative
  - marker: b
    text: “Tempatnya sendiri” dapat sekadar berarti tempat yang menjadi milik Yudas, atau, dengan nada yang lebih tajam, tempat hukuman yang sesuai baginya.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: menerima
  rationale: Dalam konteks doa ini, infinitif tersebut menyatakan bahwa orang yang dipilih akan menerima dan menjalankan peranan yang lowong; pilihan ini mempertahankan arti dasar λαμβάνω.
- source_word: τὸν τόπον
  choice: tempat
  rationale: τόπος secara harfiah berarti 'tempat' dan di sini secara kiasan menunjuk pada kedudukan atau peranan. 'Tempat' juga mempertahankan gema dengan frasa 'tempatnya sendiri' pada akhir ayat.
- source_word: τῆς διακονίας ταύτης
  choice: dalam pelayanan ... ini
  rationale: διακονία menunjuk pada pelayanan atau tugas yang dipercayakan; bentuk Indonesia dengan 'dalam' menyampaikan bahwa yang diterima ialah tempat dalam pelayanan tersebut.
- source_word: ἀποστολῆς
  choice: kerasulan
  rationale: Dalam konteks ini ἀποστολή menunjuk pada tugas atau kedudukan sebagai rasul, bukan sekadar misi umum.
- source_word: ἀφ’ ἧς παρέβη
  choice: yang telah ditinggalkan
  rationale: Frasa ini menyatakan bahwa Yudas menyimpang atau beranjak dari pelayanan dan kerasulan itu. 'Ditinggalkan' alami dalam bahasa Indonesia sambil membiarkan nuansa penyimpangan dijelaskan dalam catatan.
- source_word: πορευθῆναι
  choice: untuk pergi
  rationale: Pilihan langsung ini mempertahankan arti umum πορεύομαι dan hubungan infinitif dengan tindakan Yudas sebelumnya.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: ke tempatnya sendiri
  rationale: Ungkapan sengaja dipertahankan ringkas dan ambigu, tanpa menentukannya sebagai kubur, hukuman, atau tujuan tertentu.
theological_decisions:
- issue: Makna 'tempatnya sendiri' sehubungan dengan nasib Yudas
  choice: Mempertahankan ungkapan ambigu 'tempatnya sendiri' dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai kubur, kematian, neraka, atau tempat hukuman yang layak baginya.
  rationale: Bahasa Yunani tidak menjelaskan tujuan tersebut. Terjemahan tidak boleh memperkuat satu kesimpulan teologis yang tidak dinyatakan secara eksplisit oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah 'kerasulan' dipertahankan karena tepat bagi jabatan/tugas rasuli; pengulangan 'tempat' sengaja dijaga untuk mencerminkan permainan ungkapan Yunani.
