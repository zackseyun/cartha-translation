  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: id
  text: sampai pada hari ketika Ia terangkat, sesudah Ia, melalui Roh Kudus, memberikan perintah kepada para rasul yang telah dipilih-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah Ia memberikan perintah oleh Roh Kudus.” Frasa Yunani ini dapat menyatakan sarana atau perantaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: sampai pada hari ketika
  rationale: Ungkapan ini menandai batas waktu dari kisah sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐντειλάμενος
  choice: setelah ... memberikan perintah
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama; bentuk ini mempertahankan urutan peristiwa dan kekuatan makna perintah.
- source_word: τοῖς ἀποστόλοις
  choice: kepada rasul-rasul
  rationale: “Rasul” adalah istilah baku dan tepat bagi kelompok yang dipilih Yesus dalam Lukas–Kisah Para Rasul.
- source_word: διὰ πνεύματος ἁγίου
  choice: melalui Roh Kudus
  rationale: διά dengan genitif dapat menyatakan sarana atau perantaraan; “melalui” mempertahankan keluwesan ungkapan Yunani tanpa menambahkan gagasan yang tidak tersurat.
- source_word: οὓς ἐξελέξατο
  choice: yang telah dipilih-Nya
  rationale: Bentuk ini menunjukkan bahwa pemilihan para rasul terjadi sebelum Ia terangkat, sedangkan sufiks -Nya secara alami merujuk kepada Yesus.
- source_word: ἀνελήμφθη
  choice: Ia terangkat
  rationale: Pilihan ini menyampaikan makna pasif dalam bahasa Indonesia yang wajar tanpa menambahkan tujuan “ke surga”, yang tidak disebutkan dalam ayat ini.
theological_decisions:
- issue: Hubungan perintah Yesus dengan Roh Kudus
  choice: Yesus memberikan perintah melalui Roh Kudus sebelum Ia terangkat.
  alternative: Yesus memberikan perintah oleh Roh Kudus.
  rationale: Secara paling alami, διὰ πνεύματος ἁγίου menerangkan cara atau perantaraan pemberian perintah. Terjemahan utama mempertahankan hubungan itu, sementara catatan kaki mencatat kemungkinan nuansa pelaku atau sarana.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan fokus pada batas waktu dan urutan tindakan, dengan kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
