source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: id
  text: Orang ini memperoleh sebidang tanah dari upah kejahatannya[a]. Lalu ia jatuh tertelungkup[b], tubuhnya pecah di bagian tengah, dan seluruh isi perutnya tertumpah keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari imbalan perbuatan jahat.” Ungkapan Yunani secara harfiah mendekati “dari upah ketidakbenaran.” Kata “memperoleh” tidak harus berarti bahwa Yudas sendiri secara langsung membeli tanah itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jatuh dengan kepala lebih dahulu.” Ungkapan Yunani juga dapat menggambarkan keadaan menelungkup.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Orang ini
  rationale: Οὗτος menunjuk kembali kepada Yudas. Dalam konteks ini, μέν οὖν melanjutkan uraian; alurnya dapat disampaikan secara alami melalui susunan kalimat tanpa padanan penghubung yang kaku.
- source_word: ἐκτήσατο
  choice: memperoleh
  rationale: κτάομαι berarti memperoleh atau mendapatkan sebagai milik. 'Memperoleh' mempertahankan keluasan makna dan tidak memaksakan bahwa Yudas sendiri secara langsung membeli tanah itu.
- source_word: χωρίον
  choice: sebidang tanah
  rationale: χωρίον menunjuk pada suatu bidang atau persil tanah. 'Sebidang tanah' alami dalam bahasa Indonesia dan tidak memberi kesan ukuran atau fungsi yang tidak dinyatakan.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: dari upah kejahatannya
  rationale: ἐκ menunjukkan sumber, μισθός berarti upah atau imbalan, dan ἀδικία berarti ketidakbenaran, kejahatan, atau perbuatan salah. 'Kejahatannya' menyampaikan daya moral ungkapan Yunani dengan bahasa Indonesia yang wajar; bentuk posesif menjelaskan hubungan idiomatis tanpa mengubah sumber perolehan tanah.
- source_word: πρηνὴς γενόμενος
  choice: jatuh tertelungkup
  rationale: πρηνής menggambarkan posisi menelungkup atau kepala lebih dahulu. 'Jatuh tertelungkup' mempertahankan gambaran dasar, sementara catatan kaki mencatat kemungkinan nuansa jatuh dengan kepala lebih dahulu.
- source_word: ἐλάκησεν μέσος
  choice: tubuhnya pecah di bagian tengah
  rationale: λακάω berarti pecah atau terbelah, sedangkan μέσος menunjukkan bagian tengah. Subjek 'tubuhnya' dibuat eksplisit agar kalimat jelas dan alami dalam bahasa Indonesia.
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: seluruh isi perutnya tertumpah keluar
  rationale: ἐκχέω pasif berarti tercurah atau tertumpah, sedangkan σπλάγχνα menunjuk organ-organ dalam atau isi perut. 'Isi perut' jelas bagi pembaca modern tanpa menggunakan istilah yang terlalu teknis atau arkais.
theological_decisions:
- issue: Hubungan Yudas dengan perolehan tanah
  choice: Menerjemahkan ἐκτήσατο sebagai 'memperoleh', bukan 'membeli'.
  alternative: '''membeli'' tanah itu secara pribadi; atau tanah itu dibeli atas namanya/dengan uang yang berkaitan dengannya.'
  rationale: Bahasa Yunani menyatakan perolehan atau kepemilikan tanpa menetapkan secara sempit mekanismenya. Pilihan ini mempertahankan ketegangan dengan Matius 27:5–8 dan tidak menyisipkan harmonisasi ke dalam teks.
- issue: Cara jatuh yang digambarkan oleh πρηνὴς γενόμενος
  choice: Menerjemahkan 'jatuh tertelungkup' dan mencatat kemungkinan 'jatuh dengan kepala lebih dahulu'.
  alternative: Menetapkan secara eksplisit bahwa ia jatuh dengan kepala lebih dahulu.
  rationale: πρηνής dapat menggambarkan keadaan menelungkup maupun orientasi kepala lebih dahulu. Teks utama mempertahankan gambaran posisi, sedangkan catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah konkret dipilih agar adegan tetap jelas, tetapi ungkapan yang terlalu arkais atau terlalu klinis dihindari. Semua penanda catatan kaki muncul dalam teks utama.
