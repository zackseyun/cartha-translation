source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: id
  text: Tetapi kamu akan menerima kuasa ketika Roh Kudus turun ke atas kamu, dan kamu akan menjadi saksi-Ku di Yerusalem, di seluruh Yudea dan Samaria, sampai ke ujung bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai ke bagian bumi yang paling jauh.” Ungkapan Yunani berbentuk tunggal dan menunjuk pada batas atau jangkauan bumi yang terjauh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya mengenai waktu dan masa, dengan penghubung yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: λήμψεσθε δύναμιν
  choice: kamu akan menerima kuasa
  rationale: λαμβάνω dalam konteks ini berarti menerima sesuatu yang diberikan, sedangkan δύναμις menunjuk pada kuasa yang memampukan, bukan sekadar kekuatan jasmani.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: ketika Roh Kudus datang ke atasmu
  rationale: Konstruksi genitif absolut diterjemahkan sebagai klausa waktu. Ungkapan 'datang ke atasmu' mempertahankan gambaran gerak dalam ἐπί tanpa menjelaskan caranya secara berlebihan.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: kamu akan menjadi saksi-saksi-Ku
  rationale: 'μάρτυρες berarti orang-orang yang memberi kesaksian. Bentuk jamak dinyatakan secara eksplisit, dan μου dipahami sebagai hubungan dengan Yesus: saksi-saksi milik-Nya atau tentang Dia.'
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: di Yerusalem, di seluruh Yudea dan Samaria
  rationale: Urutan wilayah dipertahankan. Preposisi ἐν yang tersirat sebelum Samaria tidak perlu diulang dalam bahasa Indonesia, sedangkan πάσῃ diterjemahkan 'seluruh' untuk mempertahankan cakupan geografisnya.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: sampai ke ujung bumi
  rationale: Terjemahan ini mempertahankan bentuk tunggal ungkapan Yunani dan menyampaikan jangkauan terjauh bumi secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Dalam konteks naratif ini frasa tersebut menunjuk pada Roh Kudus sebagai pelaku ilahi; kapitalisasi mengikuti pemakaian baku Kristen dalam bahasa Indonesia tanpa menambahkan uraian doktrinal ke dalam ayat.
- issue: Hubungan μου dengan μάρτυρες
  choice: saksi-saksi-Ku
  alternative: saksi-saksi bagi-Ku
  rationale: Genitif μου paling langsung menyatakan hubungan para saksi dengan Yesus. Pilihan ini tidak mempersempit apakah kesaksian itu terutama mengenai diri-Nya, karya-Nya, atau dilakukan bagi-Nya.
- issue: Cakupan amanat kesaksian
  choice: urutan geografis nyata hingga ujung bumi
  alternative: geografi yang semata-mata simbolis
  rationale: Nama-nama tempat dan perluasan jangkauannya dipertahankan secara konkret tanpa memasukkan skema eklesiologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina tunggal 'kamu' dipilih karena bentuk Yunani dalam ayat ini jamak tetapi bahasa Indonesia tidak wajib menandai jumlah; konteks menunjukkan bahwa perkataan ini ditujukan kepada para murid. Kapitalisasi enklitik '-Ku' mengikuti ejaan umum untuk rujukan kepada Yesus.
