id: ACT.1.6
reference: Acts 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: id
  text: Jadi, ketika mereka berkumpul, mereka bertanya kepada-Nya, “Tuhan, apakah pada waktu ini Engkau akan memulihkan kerajaan kepada Israel[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi Israel.” Bentuk datif Yunani dapat dipahami sebagai menyatakan keuntungan (“bagi Israel”) atau, secara lebih langsung, pemulihan kerajaan “kepada Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Jadi, ketika mereka berkumpul
  rationale: Partisip συνελθόντες dipahami secara temporal, sedangkan μὲν οὖν berfungsi sebagai penghubung wacana. Bentuk ini alami dalam narasi Indonesia dan tidak menerjemahkan kedua partikel secara kaku.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: mereka bertanya kepada-Nya
  rationale: Imperfek ἠρώτων dapat bernuansa berlangsung atau berulang, tetapi dalam konteks naratif ini bentuk lampau sederhana paling alami. Partisip λέγοντες tidak perlu diterjemahkan tersendiri karena isi perkataan langsung sudah menunjukkan caranya.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan κύριος sebagai gelar yang mengandung penghormatan dan bobot teologis tanpa mempersempitnya menjadi sekadar 'Guru' atau 'Tuan'.
- source_word: εἰ ἐν τῷ χρόνῳ τούτῳ
  choice: apakah pada waktu ini
  rationale: Dalam pertanyaan langsung, εἰ menandai pertanyaan ya atau tidak dan secara idiomatis diterjemahkan 'apakah'. χρόνος menunjuk pada waktu atau masa, bukan hanya satu detik tertentu.
- source_word: ἀποκαθιστάνεις
  choice: Engkau akan memulihkan
  rationale: Kata kerja ini berarti mengembalikan pada keadaan sebelumnya. Dalam pertanyaan mengenai tindakan yang diharapkan terjadi pada masa ini, bentuk masa depan dalam bahasa Indonesia menyampaikan maksud present Yunani secara alami tanpa menghilangkan gagasan pemulihan.
- source_word: τὴν βασιλείαν
  choice: kerajaan
  rationale: βασιλεία dapat berarti pemerintahan atau kerajaan; bersama frasa 'kepada Israel', 'kerajaan' paling langsung mempertahankan bentuk dan cakupan pengharapan para murid.
- source_word: τῷ Ἰσραήλ
  choice: kepada Israel
  rationale: Dativus Yunani dapat menunjuk penerima atau keuntungan. 'Kepada Israel' mempertahankan hubungan yang paling langsung dengan tindakan memulihkan, sementara kemungkinan 'bagi Israel' dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat pengharapan para murid tentang kerajaan Israel
  choice: Pertanyaan diterjemahkan secara langsung sebagai pemulihan kerajaan kepada Israel.
  alternative: Memulihkan kerajaan bagi Israel; memulihkan kerajaan Israel; memulihkan pemerintahan kepada Israel.
  rationale: Ayat ini melaporkan pertanyaan para murid dan tidak dengan sendirinya mengesahkan ataupun mengoreksi semua anggapan mereka. Terjemahan tidak mempersempit kerajaan itu menjadi semata-mata politis atau semata-mata rohani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada khidmat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia.
