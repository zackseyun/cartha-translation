id: ACT.1.21
reference: Acts 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: id
  text: Karena itu, haruslah salah seorang dari antara laki-laki yang menyertai kami sepanjang waktu ketika Tuhan Yesus keluar masuk di tengah-tengah kami[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “keluar masuk di tengah-tengah kami” menggambarkan kehidupan dan kegiatan Tuhan Yesus di tengah para murid selama masa pelayanan-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: haruslah
  rationale: Kata kerja impersonal ini menyatakan keharusan dan, dengan akhiran -lah, tetap terasa wajar meskipun pelengkap pemikirannya berlanjut ke ayat berikutnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik Petrus dari konteks sebelumnya.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: dari antara laki-laki yang menyertai kami
  rationale: Partisip συνέρχομαι secara harfiah menunjuk kepada mereka yang berkumpul bersama, tetapi dalam konteks ini menyatakan kebersamaan yang berlangsung lama; 'menyertai kami' menyampaikan maknanya secara alami. 'Laki-laki' mempertahankan rujukan maskulin khusus dari ἀνήρ.
- source_word: ἐν παντὶ χρόνῳ
  choice: sepanjang waktu
  rationale: Merujuk pada seluruh rentang masa pelayanan Yesus bersama para murid, bukan setiap kesempatan secara terpisah.
- source_word: ᾧ
  choice: (tersirat dalam 'sepanjang waktu')
  rationale: Relatif temporal Yunani dapat diungkapkan secara alami dalam bahasa Indonesia tanpa kata penghubung tambahan.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: keluar masuk
  rationale: Mempertahankan gambaran idiomatis sumber tentang kehidupan dan kegiatan Yesus yang berlangsung di tengah para murid; urutan Indonesia 'keluar masuk' lebih alami daripada 'masuk keluar'.
- source_word: ἐφ’ ἡμᾶς
  choice: di tengah-tengah kami
  rationale: Menyatakan kegiatan dan pergaulan Yesus dalam lingkungan kelompok para murid.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Tuhan Yesus
  rationale: Mempertahankan κύριος sebagai gelar kristologis yang mapan dan berbobot teologis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar kristologis
  choice: Tuhan Yesus
  alternative: Guru Yesus
  rationale: '''Tuhan'' mempertahankan bobot kehormatan dan teologis κύριος dalam Kisah Para Rasul; ''Guru'' akan mempersempit maknanya.'
- issue: Rujukan gender dalam ἀνδρῶν
  choice: laki-laki
  alternative: orang
  rationale: ἀνήρ secara khusus bersifat maskulin, sehingga terjemahan tidak menetralkan rujukannya.
- issue: Keutuhan sintaksis lintas ayat
  choice: mempertahankan kalimat yang belum selesai dengan koma
  alternative: melengkapi makna dari ayat 22
  rationale: Teks Yunani ayat 21 bergantung pada kelanjutan ayat 22. Koma menjaga batas ayat dan tidak memasukkan bahan yang belum terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan dibuat alami tanpa menghilangkan keharusan, rujukan maskulin, idiom sumber, atau ketergantungan sintaksis ayat ini pada ayat berikutnya.
