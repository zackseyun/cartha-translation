  source_fidelity: Draf dengan tepat mempertahankan inferensi οὖν ("Karena itu"), keharusan impersonal δεῖ ("haruslah"), rujukan maskulin ἀνδρῶν ("laki-laki"), gelar "Tuhan Yesus", serta ketidaklengkapan sintaksis yang memang berlanjut ke ayat 22. Namun, hubungan temporal ἐν παντὶ χρόνῳ ᾧ kurang jelas dalam susunan "sepanjang waktu Tuhan Yesus keluar masuk"; kata "ketika" diperlukan agar waktu relatif dalam sumber tersampaikan secara eksplisit dan alami.
  naturalness: Bahasa draf umumnya baku dan sesuai register. Penambahan "ketika" membuat frasa temporal lebih lancar dalam bahasa Indonesia modern tanpa menambahkan isi dari ayat berikutnya.
  terminology: '"Tuhan Yesus" tepat untuk ὁ κύριος Ἰησοῦς. "Laki-laki" dengan tepat mempertahankan kekhususan maskulin ἀνήρ. "Keluar masuk di tengah-tengah kami" merupakan padanan idiomatis yang dapat diterima untuk εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς.'
