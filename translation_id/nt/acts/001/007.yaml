  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Kamu tidak berhak mengetahui masa atau waktu yang telah Bapa tetapkan dalam wewenang-Nya sendiri.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “masa atau waktu-waktu.” Bahasa Yunani memakai dua istilah yang berkaitan: χρόνοι dapat menunjuk pada rentang masa, sedangkan καιροί dapat menunjuk pada waktu yang tepat atau ditetapkan. Ungkapan terakhir secara harfiah berbunyi “dalam wewenang-Nya sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dari pertanyaan para murid kepada jawaban korektif Yesus, tanpa memberi kesan pertentangan yang terlalu keras.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Kamu tidak berhak mengetahui
  rationale: Ungkapan ini menyatakan bahwa pengetahuan tersebut bukan hak atau ranah para murid. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan unsur prerogatif dalam konstruksi Yunani.
- source_word: χρόνους
  choice: masa
  rationale: χρόνος di sini menunjuk pada rentang atau periode waktu; 'masa' ringkas, alami, dan dapat dibedakan dari καιρός.
- source_word: καιρούς
  choice: waktu
  rationale: καιρός dapat menunjuk pada waktu tertentu, tepat, atau yang ditetapkan. 'Waktu' menjaga keluwesan makna; kemungkinan 'waktu yang ditetapkan' dicatat dalam catatan kaki agar teks utama tidak memaksakan pembedaan teknis.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Mempertahankan sebutan yang terdapat dalam teks Yunani, tanpa menambahkan kata ganti 'Ku' yang tidak tertulis.
- source_word: ἔθετο
  choice: telah ... tetapkan
  rationale: Menyampaikan tindakan menetapkan yang sudah dilakukan dan tetap berlaku, tanpa memperinci bagaimana penetapan itu berlangsung.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: dalam wewenang-Nya sendiri
  rationale: Mempertahankan nilai lokatif/instrumental ἐν dan menegaskan bahwa perkara tersebut berada dalam hak serta kewenangan Bapa sendiri.
theological_decisions:
- issue: Pembedaan χρόνους dan καιρούς
  choice: masa atau waktu
  alternative: masa atau waktu yang ditetapkan
  rationale: Teks membedakan dua istilah temporal yang berdekatan tanpa menetapkan sistem teknis tertentu. Terjemahan utama mempertahankan dua istilah, sedangkan nuansa kemungkinan waktu yang tepat atau ditetapkan dijelaskan dalam catatan kaki.
- issue: Lingkup pengetahuan para murid
  choice: Kamu tidak berhak mengetahui
  alternative: Bukan bagianmu untuk mengetahui
  rationale: Pilihan ini menyampaikan bahwa perkataan Yesus membatasi prerogatif para murid, bukan sekadar menyatakan ketidakmampuan intelektual mereka.
- issue: Wewenang Bapa
  choice: dalam wewenang-Nya sendiri
  alternative: oleh wewenang-Nya sendiri
  rationale: Pilihan utama lebih dekat dengan bentuk Yunani dan menjaga pengertian bahwa penentuan masa dan waktu berada dalam lingkup prerogatif Bapa, tanpa mengimpor rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Wewenang' dipilih karena lebih alami untuk hak menentukan daripada 'otoritas' dalam konteks ini. Kapitalisasi pronomina -Nya mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan setelah kalimat yang dijelaskannya.
