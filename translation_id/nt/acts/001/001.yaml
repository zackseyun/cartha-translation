  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: id
  text: Dalam tulisanku yang pertama, Teofilus, aku menulis tentang segala sesuatu yang mulai Yesus lakukan dan ajarkan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Dalam tulisan yang pertama
  rationale: λόγος dalam konteks ini menunjuk pada karya tertulis sebelumnya, yaitu Injil Lukas, bukan satu kata atau ucapan. 'Tulisan yang pertama' alami dalam bahasa Indonesia, mempertahankan urutan πρῶτον, dan tidak mempersempit bentuk karya itu secara berlebihan. μέν berfungsi membingkai wacana dan mengantisipasi kelanjutan.
- source_word: ἐποιησάμην
  choice: aku menulis
  rationale: Bersama λόγον, bentuk ποιέω ini secara idiomatis berarti menyusun atau menghasilkan suatu karya tertulis. 'Menulis' merupakan padanan Indonesia yang paling jelas dan wajar.
- source_word: περὶ πάντων
  choice: tentang segala sesuatu
  rationale: περί dengan genitif menyatakan pokok pembicaraan. Ungkapan ini terhubung dengan klausa relatif berikutnya dan mempertahankan cakupan πάντων tanpa menambahkan penjelasan.
- source_word: ὦ Θεόφιλε
  choice: hai Teofilus
  rationale: ὦ menandai sapaan langsung. 'Hai' mempertahankan fungsi vokatif dalam bahasa Indonesia yang wajar dan bermartabat tanpa menambahkan keakraban seperti 'terkasih'.
- source_word: ὧν
  choice: yang
  rationale: Pronomina relatif genitif ini mengacu kembali kepada πάντων. Dalam susunan Indonesia, 'segala sesuatu yang' menyampaikan hubungan tersebut secara alami.
- source_word: ἤρξατο
  choice: mulai
  rationale: Makna eksplisit verba ini adalah 'mulai'. Bentuk ini dipertahankan karena dapat menyiratkan kelanjutan karya Yesus dalam Kisah Para Rasul, tetapi terjemahan tidak membuat implikasi itu lebih tegas daripada teks sumber.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Bentuk baku nama pribadi ini dalam bahasa Indonesia.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: dilakukan dan diajarkan
  rationale: Kedua infinitif diterjemahkan secara sejajar. Dalam konstruksi Indonesia 'mulai dilakukan dan diajarkan Yesus', hubungan koordinatif τε καί sudah jelas tanpa memerlukan 'baik ... maupun', yang akan terasa lebih berat.
theological_decisions:
- issue: Implikasi ἤρξατο ('mulai') tentang kelanjutan karya Yesus dalam Kisah Para Rasul
  choice: Mempertahankan 'mulai' dalam teks utama tanpa menjelaskan kelanjutannya.
  alternative: Menghilangkan unsur permulaan menjadi 'segala sesuatu yang dilakukan dan diajarkan Yesus', atau menambahkan bahwa Yesus meneruskan karya-Nya melalui para rasul.
  rationale: Teks Yunani secara eksplisit memakai 'mulai'. Kata itu mungkin menyiratkan bahwa Kisah Para Rasul melanjutkan kisah karya Yesus, tetapi terjemahan harus mempertahankan ketegangan tersebut dan tidak menyelesaikannya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'hai Teofilus' mempertahankan penandaan vokatif tanpa menambah nuansa emosional. Susunan kalimat dibuat alami sambil menjaga kata 'mulai' dan kesejajaran antara perbuatan serta pengajaran Yesus.
