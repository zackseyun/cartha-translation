review_pass:
  verdict: revise
  source_fidelity: Frasa “dari tengah-tengah kita” lebih spesifik daripada ἀφ’ ἡμῶν (“dari kita”) dan menyisipkan gagasan ‘dari antara/di tengah kelompok kami’ yang tidak dinyatakan secara eksplisit. Selebihnya, rentang waktu, keharusan yang dilanjutkan dari ayat 21, dan tugas menjadi saksi atas kebangkitan disampaikan dengan setia.
  naturalness: Terjemahan pada dasarnya baku dan mudah dipahami. “Mulai dari ... sampai hari ketika ...” lebih lancar tanpa “pada” setelah “sampai”. “Ia terangkat dari kita” tetap wajar dalam register Alkitab baku serta lebih dekat pada teks sumber.
  terminology: “Baptisan Yohanes,” “terangkat,” “saksi,” dan “kebangkitan-Nya” tepat. “Saksi bersama kita tentang kebangkitan-Nya” dengan baik menyatakan bahwa orang tersebut bergabung dengan kelompok para saksi yang ada.
  issues:
  - severity: medium
    issue: “dari tengah-tengah kita” menerjemahkan ἀφ’ ἡμῶν secara terlalu diperluas.
    rationale: Teks Yunani hanya menyatakan bahwa Yesus ‘diangkat dari kita’. Ungkapan Indonesia tersebut menambahkan nuansa lokasi/keanggotaan ‘di tengah-tengah’ yang mungkin tersirat oleh konteks, tetapi tidak perlu dimasukkan ke dalam terjemahan utama.
  - severity: low
    issue: Catatan kaki “sejak Yohanes membaptis” menggeser nomina “baptisan Yohanes” menjadi tindakan verbal Yohanes.
    rationale: Alternatif yang lebih langsung dan tetap membedakan konstruksi ialah “dari baptisan Yohanes.”
  revised_text: mulai dari baptisan Yohanes[a] sampai hari ketika Ia terangkat dari kita, salah seorang dari mereka ini harus menjadi saksi bersama kita tentang kebangkitan-Nya.
