  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: id
  text: mulai dari baptisan Yohanes[a] sampai hari ketika Ia terangkat dari kita, salah seorang dari mereka ini harus menjadi saksi bersama kita tentang kebangkitan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari baptisan Yohanes.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ
  choice: mulai dari
  rationale: Mengungkapkan rentang waktu yang dimulai oleh bentuk partisip Yunani dan berpasangan secara alami dengan “sampai pada”.
- source_word: τοῦ βαπτίσματος Ἰωάννου
  choice: baptisan Yohanes
  rationale: Ringkas, alami, dan tetap mempertahankan keluwesan konstruksi genitif Yunani tanpa menentukan secara berlebihan apakah yang dimaksud ialah baptisan yang Yohanes lakukan atau awal pelayanan baptisannya.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: sampai pada hari ketika
  rationale: Padanan temporal yang wajar dalam bahasa Indonesia modern dan tetap memelihara fungsi klausa relatif.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: Ia terangkat dari tengah-tengah kita
  rationale: “Terangkat” mempertahankan bentuk pasif dan nuansa arah ke atas, sedangkan “dari tengah-tengah kita” menyampaikan perpisahan dari kelompok para saksi secara alami tanpa menambahkan tujuan kenaikan.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: saksi ... tentang kebangkitan-Nya
  rationale: “Saksi tentang” merupakan konstruksi Indonesia yang jelas dan alami untuk tugas memberikan kesaksian mengenai kebangkitan, sambil tetap dekat dengan genitif Yunani.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: menjadi saksi bersama kita
  rationale: Menunjukkan bahwa orang yang dipilih bergabung dengan para rasul yang sudah ada dalam kesaksian mereka.
- source_word: ἕνα τούτων
  choice: salah seorang dari mereka ini
  rationale: Konteks ayat sebelumnya merujuk kepada sejumlah orang; padanan ini alami dalam bahasa Indonesia tanpa mengulang kata “laki-laki” yang tidak terdapat dalam frasa Yunani ini.
theological_decisions:
- issue: Keharusan yang secara sintaksis berasal dari ayat sebelumnya
  choice: Memakai “harus”
  alternative: Hanya memakai “menjadi” sebagai infinitif yang bergantung pada ayat sebelumnya
  rationale: Ayat ini melanjutkan δεῖ (“harus/perlu”) dari Kisah Para Rasul 1:21. Pengulangan “harus” membuat potongan ayat ini utuh dan menyampaikan daya sintaksis aslinya tanpa menambah ajaran.
- issue: Rujukan kepada kenaikan Yesus
  choice: “Ia terangkat”
  alternative: “Ia naik ke surga” atau “Ia diangkat ke surga”
  rationale: Bentuk yang dipilih mempertahankan pasif Yunani dan nuansa kenaikan tanpa menambahkan kata “ke surga”, yang tidak terdapat dalam ayat ini.
- issue: Hubungan saksi dengan kebangkitan
  choice: “saksi ... tentang kebangkitan-Nya”
  alternative: “saksi kebangkitan-Nya” atau “saksi atas kebangkitan-Nya”
  rationale: Ungkapan ini menyatakan isi kesaksian secara alami, tanpa mempersempitnya secara tidak perlu menjadi sekadar saksi mata maupun mengaburkan kaitannya dengan peristiwa kebangkitan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Ia” dan “-Nya” mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Ayat dipertahankan sebagai lanjutan sintaksis dari ayat 21, tetapi “harus” disertakan agar daya kalimat sumber tetap jelas.
