  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: id
  text: Hal itu menjadi diketahui oleh semua penduduk Yerusalem, sehingga dalam bahasa mereka sendiri[b] ladang itu disebut Hakeldamakh[a], yang berarti “Ladang Darah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam banyak terjemahan, nama ini ditulis “Akeldama”. Bentuk Yunani di sini ialah Ἁκελδαμάχ (Hakeldamakh).
    reason: alternative_reading
  - marker: b
    text: Atau, “dalam dialek mereka sendiri.” Kata Yunani διάλεκτος dapat berarti bentuk tutur daerah atau, secara lebih umum, bahasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: hal itu diketahui
  rationale: Ungkapan ini menyatakan bahwa perkara yang dibicarakan menjadi diketahui secara luas; bentuk ini alami dalam bahasa Indonesia tanpa menambahkan kadar publisitas yang tidak dinyatakan.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: oleh semua penduduk Yerusalem
  rationale: Merangkum ungkapan partisipial ‘semua orang yang tinggal di Yerusalem’ secara wajar dan jelas.
- source_word: ὥστε
  choice: sehingga
  rationale: Menandai akibat atau hasil, sesuai fungsi konstruksi Yunani dalam konteks ini.
- source_word: κληθῆναι
  choice: disebut
  rationale: Mempertahankan bentuk pasif dan menyampaikan penamaan tempat secara lugas.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ladang itu
  rationale: χωρίον dapat menunjuk sebidang tanah atau ladang; ‘ladang’ menjaga keselarasan dengan glosa nama tempat pada akhir ayat.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: dalam bahasa mereka sendiri
  rationale: διάλεκτος dapat berarti bahasa atau dialek. ‘Bahasa’ lebih alami di sini, sementara kemungkinan ‘dialek’ dipertahankan dalam catatan kaki.
- source_word: Ἁκελδαμάχ
  choice: Hakeldamakh
  rationale: Transliterasi ini mempertahankan bunyi awal yang mencerminkan tanda napas kasar pada bentuk Yunani dan konsonan akhir χ, sambil memakai ejaan Indonesia yang terbaca.
- source_word: τοῦτ’ ἔστιν
  choice: yang berarti
  rationale: Secara alami memperkenalkan penjelasan arti nama dalam bahasa Indonesia.
- source_word: Χωρίον Αἵματος
  choice: Ladang Darah
  rationale: Menerjemahkan secara langsung glosa yang diberikan teks Yunani dan mempertahankan fungsinya sebagai penjelasan nama tempat.
