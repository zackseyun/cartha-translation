id: ACT.1.13
reference: Acts 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: id
  text: 'Setelah masuk, mereka naik ke ruang di lantai atas tempat mereka tinggal: Petrus, Yohanes, Yakobus, dan Andreas; Filipus dan Tomas; Bartolomeus dan Matius; Yakobus anak Alfeus, Simon si Zelot, dan Yudas dari Yakobus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yudas anak Yakobus” atau “Yudas saudara Yakobus.” Bahasa Yunani hanya berbunyi “Yudas dari Yakobus,” sehingga hubungan tepat di antara mereka tidak disebutkan secara tersurat.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: setelah masuk
  rationale: Dalam anak kalimat waktu dengan ὅτε, bentuk aoris menunjukkan tindakan yang mendahului tindakan utama; bahasa Indonesia secara alami menyatakannya dengan 'setelah masuk'.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: mereka naik ke ruang di lantai atas
  rationale: Ungkapan ini mempertahankan gerak ke atas pada ἀνέβησαν dan tujuan berupa ruang di bagian atas bangunan pada ὑπερῷον, tanpa memasukkan asosiasi gerejawi yang tidak dinyatakan teks.
- source_word: οὗ ἦσαν καταμένοντες
  choice: tempat mereka tinggal
  rationale: καταμένω menyatakan tetap atau tinggal di suatu tempat; terjemahan ini wajar dan tetap menangkap keberlangsungan tindakan.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Yakobus anak Alfeus
  rationale: Genitif tersebut paling wajar berfungsi sebagai patronimik dalam daftar nama ini; 'anak Alfeus' mengidentifikasi Yakobus secara jelas.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simon orang Zelot
  rationale: ζηλωτής berfungsi sebagai julukan pengenal. 'Orang Zelot' mempertahankan sebutan kelompok atau julukan tersebut dan lebih mudah dipahami daripada sekadar transliterasi tanpa penjelas.
- source_word: Ἰούδας Ἰακώβου
  choice: Yudas anak Yakobus
  rationale: Genitif ini kemungkinan besar merupakan patronimik dalam konteks daftar para rasul, tetapi hubungan tepatnya tidak dinyatakan secara eksplisit sehingga alternatif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Hubungan yang dimaksud dalam Ἰούδας Ἰακώβου
  choice: Yudas anak Yakobus
  alternative: Yudas saudara Yakobus
  rationale: Bahasa Yunani hanya menyatakan 'Yudas dari Yakobus' melalui bentuk genitif. Dalam daftar laki-laki yang dikenali melalui nama ayah, hubungan ayah-anak lebih mungkin, tetapi ambiguitas sumber tidak boleh dihilangkan dan karena itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang jelas dan bermartabat. 'Ruang di lantai atas' dipilih sebagai ungkapan arsitektural yang transparan; nama-nama mengikuti bentuk Indonesia yang lazim dalam tradisi Alkitab.
