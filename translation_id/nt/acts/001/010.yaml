  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: id
  text: Ketika mereka sedang menatap langit dengan saksama sementara Dia pergi[a], lihatlah, dua orang laki-laki berdiri di dekat mereka dengan pakaian putih[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sementara Dia berangkat.” Kata Yunani ini secara dasar berarti “pergi”; dalam konteks kenaikan, gerakan-Nya dipahami sebagai ke atas.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengenakan pakaian putih”; kata Yunani yang dipakai menunjuk pakaian secara umum dan tidak menentukan bahwa pakaian itu berupa jubah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: menatap ... dengan saksama
  rationale: Partisip ini menyatakan pandangan yang tetap dan sungguh-sungguh, bukan sekadar melihat sekilas; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa duratifnya.
- source_word: οὐρανόν
  choice: langit
  rationale: Dalam bahasa Indonesia, 'langit' secara alami menunjuk arah pandangan ke atas dan tetap dapat membawa cakrawala surgawi dalam konteks kenaikan; catatan kaki mencatat kemungkinan nuansa 'surga'.
- source_word: πορευομένου αὐτοῦ
  choice: sementara Dia terangkat
  rationale: Konstruksi genitif absolut menandai tindakan yang berlangsung bersamaan. Dalam konteks kenaikan, 'terangkat' menyampaikan gerakan ke atas yang telah dinyatakan dalam ayat sebelumnya tanpa menambahkan tujuan yang tidak disebutkan di sini.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Kata penunjuk wacana ini mengarahkan perhatian pembaca kepada kemunculan dua orang tersebut; 'lihatlah' mempertahankan daya naratifnya dalam ragam Indonesia yang bermartabat.
- source_word: ἄνδρες δύο
  choice: dua orang laki-laki
  rationale: ἀνήρ secara khusus berarti laki-laki. Terjemahan ini mempertahankan penyebutan tekstual dan tidak menggantinya dengan 'malaikat', identitas yang hanya disiratkan oleh konteks.
- source_word: παρειστήκεισαν
  choice: berdiri di dekat mereka
  rationale: Bentuk ini menyatakan kehadiran dalam posisi berdiri di sisi atau dekat mereka. Terjemahan ini tidak menambahkan gagasan 'muncul' yang tidak dinyatakan secara eksplisit oleh verba.
- source_word: ἐσθήσεσι λευκαῖς
  choice: dengan pakaian putih
  rationale: ἐσθής menunjuk pakaian secara luas. 'Pakaian putih' jelas dan alami tanpa mempersempitnya menjadi jenis pakaian tertentu seperti jubah.
theological_decisions:
- issue: Makna οὐρανός dalam konteks kenaikan
  choice: langit
  alternative: surga
  rationale: οὐρανός dapat berarti langit atau surga. Karena frasa ini menggambarkan arah tatapan para murid, 'langit' paling alami dalam bahasa Indonesia, sementara konteks tetap memberi makna teologis dan catatan kaki mempertahankan alternatif 'surga'.
- issue: Identitas kedua sosok
  choice: dua orang laki-laki
  alternative: dua malaikat
  rationale: Teks Yunani menyebut mereka 'dua orang laki-laki' dan tidak secara eksplisit menyebut mereka malaikat dalam ayat ini. Terjemahan mempertahankan ungkapan permukaan teks dan membiarkan konteks memberi petunjuk tentang identitas mereka.
- issue: Gerakan Yesus dalam πορευομένου αὐτοῦ
  choice: sementara Dia terangkat
  alternative: sementara Dia pergi
  rationale: Verba dasarnya berarti pergi atau berjalan, tetapi dalam konteks langsung Yesus sedang diangkat dan bergerak ke atas. 'Terangkat' membuat rujukan geraknya jelas dalam bahasa Indonesia tanpa menyatakan tujuan akhir secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Lihatlah' mempertahankan penanda perhatian ἰδού, sedangkan 'dua orang laki-laki' menjaga ketepatan gender dan tidak mengantisipasi identitas malaikat. Kapitalisasi 'Dia' mengikuti kebiasaan penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
