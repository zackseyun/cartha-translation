reference: Acts 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: id
  text: Kepada mereka juga Ia menunjukkan diri-Nya hidup sesudah penderitaan-Nya, dengan banyak bukti yang meyakinkan, dengan menampakkan diri kepada mereka selama empat puluh hari[a] dan berbicara tentang Kerajaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepanjang kurun empat puluh hari.” Ungkapan Yunaninya menunjukkan penampakan-penampakan yang terjadi dalam rentang waktu itu, bukan bahwa Ia tampak terus-menerus tanpa henti.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: kepada mereka
  rationale: Pronomina relatif datif jamak ini merujuk kepada para rasul pada ayat sebelumnya; bahasa Indonesia tidak perlu menambahkan unsur 'laki-laki' yang tidak dinyatakan secara eksplisit.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: Ia menunjukkan diri-Nya hidup
  rationale: Mengungkapkan tindakan memperlihatkan atau menghadirkan diri dalam keadaan hidup, dengan susunan yang alami dan tetap menegaskan realitas hidup-Nya setelah menderita.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: sesudah penderitaan-Nya
  rationale: Konstruksi infinitif artikular dengan μετά menyatakan waktu sesudah penderitaan yang telah selesai; bentuk nominal ini alami dan khidmat dalam bahasa Indonesia.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: dengan banyak bukti yang meyakinkan
  rationale: τεκμήριον menunjuk pada bukti yang memberi kepastian, bukan sekadar petunjuk; 'meyakinkan' menyampaikan daya pembuktian istilah tersebut tanpa memakai kata absolut seperti 'tak terbantahkan'.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: selama empat puluh hari
  rationale: διά dengan genitif menyatakan rentang waktu yang dilalui; dalam konteks ini penampakan terjadi sepanjang kurun tersebut, tidak harus tanpa henti.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: dengan menampakkan diri kepada mereka
  rationale: Partisipel ὀπτάνομαι lazim berarti 'menampakkan diri' dalam konteks penampakan sesudah kebangkitan; pilihan ini juga membedakannya dari klausa utama.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: berbicara tentang Kerajaan Allah
  rationale: Ungkapan τὰ περὶ berarti hal-hal yang berkenaan dengan sesuatu; 'berbicara tentang' merupakan padanan Indonesia yang jelas dan alami.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku ini mempertahankan cakupan βασιλεία sebagai pemerintahan sekaligus ranah kerajaan tanpa mempersempitnya hanya pada salah satu nuansa.
theological_decisions:
- issue: Kehidupan Yesus sesudah penderitaan dan daya bukti penampakan-Nya
  choice: Teks menyatakan secara langsung bahwa Ia menunjukkan diri-Nya hidup sesudah penderitaan-Nya dengan banyak bukti yang meyakinkan.
  alternative: Ia memperlihatkan diri-Nya sesudah sengsara-Nya dengan banyak bukti yang tidak dapat disangkal.
  rationale: Terjemahan mempertahankan penegasan eksplisit tentang kehidupan pascapenderitaan dan kekuatan evidensial τεκμηρίοις, tanpa istilah kuno atau penambahan klaim absolut yang melampaui kata Yunani.
- issue: Rujukan οἷς kepada para rasul
  choice: kepada mereka
  alternative: kepada orang-orang itu
  rationale: Konteks mengidentifikasi mereka sebagai para rasul, tetapi pronomina Yunani sendiri tidak menambahkan kata 'orang' atau penanda gender; bentuk pronominal Indonesia paling dekat dengan sumber.
- issue: Makna βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: Kerajaan Allah adalah ungkapan yang luas dan mapan, sehingga tidak secara diam-diam membatasi βασιλεία hanya pada aktivitas memerintah atau hanya pada suatu wilayah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus serta 'Kerajaan Allah' mengikuti kebiasaan luas dalam penerbitan Alkitab berbahasa Indonesia. Susunan kalimat dijaga dekat dengan alur Yunani, tetapi dibuat wajar bagi pembaca umum.
