  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: id
  text: Mereka berkata, “Hai orang-orang Galilea, mengapa kalian berdiri memandang ke langit? Yesus ini, yang telah diangkat dari kalian ke surga, akan datang dengan cara yang sama seperti kalian melihat Dia pergi ke surga.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Hai orang-orang Galilea
  rationale: Sapaan vokatif ini ditampilkan secara langsung dan alami dalam bahasa Indonesia. Bentuk 'orang-orang Galilea' mempertahankan identitas kelompok yang disapa tanpa ungkapan kaku 'laki-laki Galilea'.
- source_word: τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν
  choice: mengapa kalian berdiri memandang ke langit
  rationale: Bentuk perfektum ἑστήκατε menyatakan keadaan sedang berdiri, sedangkan participium βλέποντες menyatakan tindakan yang menyertainya. Dalam klausa ini οὐρανός menunjuk arah pandangan ke langit yang tampak.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Yesus ini
  rationale: Menerjemahkan demonstratif οὗτος secara eksplisit tanpa menambahkan kata 'yang sama', yang tidak memiliki padanan tersendiri dalam teks Yunani.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν
  choice: yang telah diangkat dari antara kalian ke surga
  rationale: Bentuk pasif ἀναλημφθείς dipertahankan sebagai 'telah diangkat'. Frasa 'dari antara kalian' menyatakan keterpisahan dari hadapan para murid secara alami, sementara tujuan kenaikan diterjemahkan 'ke surga' sesuai konteks.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: akan datang kembali dengan cara yang sama seperti
  rationale: Gabungan οὕτως dan ὃν τρόπον menyatakan kesesuaian cara. 'Kembali' tersirat secara wajar karena yang datang adalah Yesus yang baru saja pergi, tetapi tidak menentukan waktu atau rincian kedatangan itu.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: kalian melihat Dia pergi
  rationale: Ungkapan ini mempertahankan kesaksian visual para murid dan gerakan Yesus tanpa memperkuat θεάομαι secara berlebihan menjadi 'menatap' atau memakai diksi arkais.
theological_decisions:
- issue: Makna οὐρανός dalam dua kemunculannya
  choice: '''langit'' untuk arah pandangan dan ''surga'' untuk tujuan kenaikan'
  alternative: Menerjemahkan kedua kemunculan secara seragam sebagai 'surga' atau 'langit'
  rationale: 'Kata οὐρανός dapat berarti langit yang terlihat maupun surga. Konteks memungkinkan perbedaan nuansa: para murid memandang ke langit, sedangkan Yesus diangkat ke surga. Pilihan ini menjaga keluasan makna leksikal tanpa menghapus dimensi teologis kenaikan.'
- issue: Penerjemahan οὗτος ὁ Ἰησοῦς
  choice: Yesus ini
  alternative: Yesus yang sama ini
  rationale: Teks Yunani menegaskan identitas dengan demonstratif 'ini', tetapi tidak memuat kata tersendiri untuk 'yang sama'. Terjemahan utama tidak menambahkan penafsiran tradisional tersebut.
- issue: Sifat kedatangan Yesus yang dijanjikan
  choice: akan datang kembali dengan cara yang sama seperti kalian melihat Dia pergi
  alternative: akan datang persis dengan seluruh rincian yang sama
  rationale: Teks menegaskan kesamaan cara, tetapi tidak menjelaskan semua aspek yang dimaksud. Terjemahan mempertahankan ketegangan itu dan tidak mengembangkan skema kedatangan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' memperjelas bahwa sapaan ditujukan kepada para murid. 'Dia' dikapitalisasi sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia, tanpa mengubah isi gramatikal sumber.
