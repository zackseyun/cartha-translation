  naturalness: Teks umumnya baku dan mudah dipahami. 'Hai orang-orang Galilea' merupakan sapaan yang lazim dan wajar dalam register Alkitab bahasa Indonesia. Susunan revisi tetap modern dan bermartabat.
  terminology: '''Yesus ini'' menerjemahkan οὗτος ὁ Ἰησοῦς tanpa tambahan interpretatif. ''Diangkat'' cocok untuk ἀναλημφθείς, dan ''surga'' cocok dalam konteks tujuan kenaikan. Catatan kaki mencatat alternatif tradisional ''Yesus yang sama ini'' tanpa menjadikannya teks utama.'
