  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: id
  text: 'Pada hari-hari itu, Petrus berdiri di tengah saudara-saudara[a] dan berkata (adapun jumlah orang yang berkumpul kira-kira seratus dua puluh orang):'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; teks Yunani memakai kata “saudara-saudara”, tetapi dalam komunitas yang berkumpul ini sebutan tersebut mungkin mencakup semua sesama orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Pada hari-hari itu
  rationale: Mempertahankan bentuk jamak dan acuan waktu dalam bahasa Yunani dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini memperkenalkan tindakan Petrus sebelum ia berbicara; 'berdiri' mempertahankan tindakan konkret dalam suasana pertemuan.
- source_word: ἐν μέσῳ
  choice: di tengah-tengah
  rationale: Menyatakan posisi Petrus di antara kelompok yang sedang berkumpul dan mempertahankan nuansa spasial ungkapan Yunani.
- source_word: ἀδελφῶν
  choice: saudara-saudara
  rationale: Mempertahankan bentuk maskulin jamak teks Yunani. Kemungkinan bahwa sebutan ini mencakup sesama orang percaya perempuan dijelaskan dalam catatan kaki.
- source_word: ὄχλος ὀνομάτων
  choice: orang-orang ... berjumlah
  rationale: Secara harfiah ungkapan ini berbicara tentang 'sekumpulan nama', tetapi merupakan idiom yang menunjuk kepada sejumlah orang. Susunan ini menyampaikan maknanya secara alami dalam bahasa Indonesia tanpa menghasilkan frasa 'jumlah nama' yang mudah disalahpahami.
- source_word: ἐπὶ τὸ αὐτό
  choice: yang berkumpul
  rationale: Dalam konteks ini ungkapan tersebut menunjukkan bahwa orang-orang itu berada bersama sebagai suatu pertemuan.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: kira-kira seratus dua puluh orang
  rationale: ὡς sebelum bilangan menyatakan perkiraan; 'kira-kira' menyampaikan nuansa itu secara jelas.
- source_word: τε
  choice: dan
  rationale: Kata penghubung ini dipertahankan pada awal keterangan dalam tanda kurung.
theological_decisions:
- issue: Cakupan gender ἀδελφῶν dalam komunitas yang berkumpul
  choice: saudara-saudara dalam teks utama, dengan catatan kaki tentang kemungkinan cakupan inklusif
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk maskulin dalam teks sumber dipertahankan, sementara konteks yang mungkin mencakup perempuan tidak dihapus, melainkan dijelaskan tanpa menetapkan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk idiomatis 'orang-orang ... berjumlah' dipilih agar ungkapan Yunani ὄχλος ὀνομάτων tidak terdengar sebagai hitungan daftar nama, sementara struktur sisipan dan perkiraan jumlah tetap dipertahankan.
