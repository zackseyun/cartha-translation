id: ACT.1.5
reference: Acts 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: id
  text: Sebab Yohanes membaptis dengan air, tetapi tidak lama lagi kamu akan dibaptis dalam Roh Kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan Roh Kudus.” Preposisi Yunani yang dipakai di sini dapat dipahami sebagai “dalam” atau “dengan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata ini memperkenalkan penjelasan atau alasan bagi perkataan sebelumnya. “Sebab” alami dalam bahasa Indonesia dan mempertahankan hubungan penjelas tersebut.
- source_word: ἐβάπτισεν
  choice: membaptis
  rationale: Istilah baku ini mempertahankan kaitan dengan praktik keagamaan yang dimaksud tanpa menentukan secara lebih sempit cara pelaksanaannya.
- source_word: ὕδατι
  choice: dengan air
  rationale: Bentuk datif di sini wajar dipahami secara instrumental; “dengan air” merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: “Dalam” mencerminkan ἐν dan mempertahankan kemungkinan makna lingkup, tanpa meniadakan kemungkinan makna sarana yang dicantumkan dalam catatan kaki. “Roh Kudus” dalam konteks ini merujuk secara definit pada Roh Kudus.
- source_word: βαπτισθήσεσθε
  choice: kamu akan dibaptis
  rationale: Bentuk pasif futur diterjemahkan langsung, mempertahankan hubungan verbal dengan baptisan Yohanes serta membiarkan pelakunya tersirat seperti dalam teks Yunani.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: tidak lama lagi
  rationale: Ungkapan ini menyampaikan secara alami bahwa peristiwa tersebut akan terjadi dalam waktu beberapa hari dari saat itu, tanpa mempertahankan susunan Yunani yang kaku.
theological_decisions:
- issue: Pemaknaan ἐν dalam ungkapan baptisan Roh Kudus
  choice: dalam Roh Kudus
  alternative: dengan Roh Kudus
  rationale: Preposisi ἐν dapat menunjuk pada lingkup maupun sarana. Teks utama memakai “dalam” agar bentuk Yunani dan ketegangan penafsirannya tetap tampak, sedangkan “dengan” disediakan sebagai kemungkinan sah dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur kalimat menjaga kontras antara baptisan Yohanes dengan air dan baptisan yang akan dialami para murid dalam Roh Kudus.
