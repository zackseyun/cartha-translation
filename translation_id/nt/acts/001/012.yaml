  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: id
  text: Kemudian mereka kembali ke Yerusalem dari bukit yang disebut Bukit Zaitun, yang dekat dengan Yerusalem, kira-kira sejauh perjalanan Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Perjalanan Sabat” adalah jarak yang menurut kebiasaan Yahudi boleh ditempuh pada hari Sabat.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Kemudian
  rationale: Penanda waktu yang secara alami melanjutkan urutan peristiwa dalam narasi.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: mereka kembali ke Yerusalem
  rationale: Mengungkapkan gerak kembali menuju kota secara wajar dalam bahasa Indonesia.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: dari bukit yang disebut Bukit Zaitun
  rationale: ὄρος dapat menunjuk gunung atau bukit; untuk lokasi ini, nama Indonesia yang lazim dan mudah dipahami ialah Bukit Zaitun.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: yang terletak dekat Yerusalem
  rationale: Menyampaikan keterangan lokasi dan kedekatannya dengan jelas serta alami.
- source_word: σαββάτου ἔχον ὁδόν
  choice: sejauh perjalanan yang diperbolehkan pada hari Sabat
  rationale: Ungkapan budaya Yahudi ini menunjuk jarak perjalanan yang lazim diizinkan pada hari Sabat; terjemahan ini mempertahankan kerangka budaya sambil menjelaskan maknanya.
theological_decisions:
- issue: Ungkapan jarak Yahudi σαββάτου ἔχον ὁδόν
  choice: sejauh perjalanan yang diperbolehkan pada hari Sabat
  alternative: sejauh perjalanan sehari Sabat
  rationale: Ini terutama idiom budaya, bukan penetapan doktrinal oleh narator. Rumusan terpilih membuat acuannya dipahami pembaca modern tanpa menghilangkan kaitannya dengan hari Sabat.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Nama tempat 'Bukit Zaitun' dipilih karena sudah lazim dan transparan bagi pembaca Indonesia.
