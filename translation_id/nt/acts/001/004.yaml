    rationale: “Ketika” dan “sedang” bersama dengan pengulangan “bersama-sama” membuat pembukaan kalimat kurang ringkas. “Sementara Ia bersama mereka” menyampaikan makna umum yang sama tanpa menentukan apakah kegiatan itu berkumpul atau makan.
