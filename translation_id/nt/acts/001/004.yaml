  rationale: Revisi menghilangkan tanda petik yang tidak tepat secara sintaksis dan memperlancar frasa pembuka. Terjemahan utama tetap mempertahankan ketidakpastian leksikal συναλιζόμενος, sedangkan kemungkinan “berkumpul” dan “makan bersama” tetap tersedia dalam catatan kaki. Tidak ada perubahan makna pada perintah, lokasi, atau janji Bapa.
