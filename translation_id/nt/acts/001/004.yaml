  terminology: “Memerintahkan,” “Yerusalem,” “menantikan,” dan “janji Bapa” sesuai register Alkitab Bahasa Indonesia yang modern dan baku. Kapitalisasi “Ia” dan “-Ku” dapat dipertahankan sebagai konvensi sasaran.
