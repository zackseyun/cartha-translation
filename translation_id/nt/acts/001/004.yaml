id: ACT.1.4
reference: Acts 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: id
  text: Sementara Ia bersama mereka[a], Ia memerintahkan mereka agar tidak meninggalkan Yerusalem, melainkan menantikan janji Bapa, yang kamu dengar dari-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sementara Ia berkumpul dengan mereka”; sebagian orang memahami frasa ini sebagai “sementara Ia makan bersama mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: ketika sedang bersama-sama dengan mereka
  rationale: Partisip ini sulit secara leksikal, tetapi konteksnya jelas menggambarkan Yesus berada bersama para rasul. Pilihan ini alami dalam bahasa Indonesia dan tidak memastikan makna yang diperdebatkan, seperti berkumpul atau makan bersama.
- source_word: παρήγγειλεν
  choice: memerintahkan
  rationale: Kata kerja ini menyatakan arahan yang berwibawa; 'memerintahkan' mempertahankan kekuatannya tanpa terdengar tidak wajar.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: agar tidak meninggalkan Yerusalem
  rationale: Gabungan ini menunjuk pada larangan berpisah dari atau pergi meninggalkan kota. Ungkapan yang dipilih jelas dan idiomatis.
- source_word: ἀλλὰ περιμένειν
  choice: melainkan menantikan
  rationale: '''Menantikan'' menyampaikan penantian penuh harap dan membentuk kontras yang wajar dengan larangan sebelumnya.'
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: janji Bapa
  rationale: Bentuk ini mempertahankan konstruksi genitif secara ringkas tanpa mempersempit janji menjadi 'pemberian yang dijanjikan'; konteks berikutnya menjelaskan isinya.
- source_word: ἣν ἠκούσατέ μου
  choice: yang telah kamu dengar dari-Ku
  rationale: Genitif μου sesudah ἀκούω secara alami berarti sumber perkataan, yaitu 'dari-Ku'. Bentuk perfektif 'telah kamu dengar' sesuai dengan tindakan mendengar yang sudah terjadi.
theological_decisions:
- issue: Makna συναλιζόμενος dalam kegiatan Yesus sesudah kebangkitan
  choice: Diterjemahkan secara umum sebagai Yesus sedang bersama-sama dengan para rasul.
  alternative: ketika berkumpul dengan mereka; ketika makan bersama mereka
  rationale: Bentuk Yunani ini memiliki kesulitan leksikal dan tidak mengharuskan pilihan yang lebih khusus. Terjemahan umum menjaga ambiguitas yang nyata, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- issue: Hubungan frasa ἣν ἠκούσατέ μου dengan perkataan langsung Yesus
  choice: 'Diberi tanda petik sebagai awal kutipan perkataan Yesus: “yang telah kamu dengar dari-Ku.”'
  alternative: Tanpa tanda petik, sebagai kelanjutan narasi tidak langsung
  rationale: Peralihan ke orang kedua jamak dan kata ganti orang pertama menunjukkan perkataan langsung Yesus, meskipun naskah Yunani kuno tidak memiliki tanda petik modern. Tanda petik membantu pembaca mengikuti perubahan penutur tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk Yesus sesuai register naratif Alkitab Indonesia; kapitalisasi pronomina bersifat konvensi penghormatan bahasa sasaran, bukan penambahan makna pada teks Yunani. Susunan kalimat dijaga jelas bagi pembaca umum.
