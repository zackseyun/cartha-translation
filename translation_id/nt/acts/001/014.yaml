id: ACT.1.14
reference: Acts 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: id
  text: Mereka semua terus bertekun dalam doa dengan sehati[a], bersama para perempuan[b], Maria ibu Yesus, dan saudara-saudara-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan satu hati” atau “dengan satu tekad”; kata Yunani ini menekankan kesatuan tujuan, bukan hanya berkumpul di tempat yang sama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama perempuan-perempuan.” Teks Yunani tidak memakai kata sandang, tetapi kemungkinan besar yang dimaksud ialah kelompok perempuan yang dikenal sebagai pengikut Yesus.
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani adelphoi biasanya berarti “saudara-saudara laki-laki.” Sebagian orang memahaminya dalam arti lebih luas sebagai kerabat dekat; ayat ini sendiri tidak menjelaskan hubungan mereka lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Mereka semua
  rationale: Ungkapan ini secara alami merujuk kembali kepada orang-orang yang baru disebut sambil mempertahankan cakupan πάντες, yaitu semuanya.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: terus bertekun
  rationale: Konstruksi imperfek perifrastik menyatakan tindakan yang berlangsung terus, sedangkan προσκαρτερέω menekankan ketekunan dan kesetiaan dalam menjalankannya.
- source_word: ὁμοθυμαδόν
  choice: dengan sehati
  rationale: Pilihan ini menyampaikan kesatuan maksud dan kebersamaan kelompok, bukan sekadar keberadaan mereka di tempat yang sama.
- source_word: τῇ προσευχῇ
  choice: dalam doa
  rationale: Dalam bahasa Indonesia, 'bertekun dalam doa' merupakan padanan alami bagi datif yang melengkapi προσκαρτερέω; artikel Yunani tidak perlu dinyatakan secara khusus.
- source_word: σὺν γυναιξίν
  choice: bersama para perempuan
  rationale: Kata 'para' menyajikan kelompok perempuan secara wajar dalam bahasa Indonesia tanpa menyiratkan bahwa artikel tertentu ada dalam teks Yunani.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Maria ibu Yesus
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia dipakai, dan frasa aposisi diterjemahkan langsung tanpa tambahan penafsiran.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: dan saudara-saudara-Nya
  rationale: Dalam konteks rujukan kepada Yesus, bentuk hormat '-Nya' sesuai dengan kebiasaan penerbitan Alkitab Indonesia. 'Saudara-saudara' mempertahankan kemungkinan makna kekerabatan ἀδελφοί tanpa menentukan lebih jauh jenis hubungan keluarga tersebut.
theological_decisions:
- issue: Hubungan tepat orang-orang yang disebut ἀδελφοί dengan Yesus
  choice: saudara-saudara-Nya
  alternative: saudara-saudara lelaki-Nya; kerabat-Nya
  rationale: ἀδελφοί berbentuk maskulin jamak dan lazim berarti saudara laki-laki, tetapi cakupan hubungan kekeluargaannya diperdebatkan dalam tradisi Kristen. Terjemahan 'saudara-saudara-Nya' mempertahankan ungkapan kekerabatan tanpa menetapkan apakah mereka saudara kandung, saudara tiri, atau kerabat dekat.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan khidmat. Struktur kalimat dibuat mengalir alami, sementara aspek tindakan yang berkelanjutan, kesatuan kelompok, dan ambiguitas hubungan kekerabatan tetap dipertahankan. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
