  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: id
  text: Setelah Ia mengatakan hal-hal itu, ketika mereka memandang-Nya, Ia terangkat[a], dan awan[c] menutup-Nya dari pandangan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Ia diangkat.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “awan itu mengambil-Nya sehingga Ia tidak terlihat lagi oleh mereka.”
    reason: lexical_alternative
  - marker: c
    text: Gambaran tentang awan mungkin menggemakan bagian-bagian Alkitab yang memakai awan sebagai tanda kehadiran Allah, meskipun ayat ini tidak menyatakannya secara eksplisit.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Setelah ... lalu
  rationale: Kata penghubung καὶ mengaitkan peristiwa ini dengan ucapan sebelumnya. Dalam bahasa Indonesia, susunan “Setelah ... lalu” menyampaikan alur narasi dan urutan yang juga dinyatakan oleh partisip aoris εἰπών tanpa membuat kalimat terasa kaku.
- source_word: ταῦτα εἰπὼν
  choice: Setelah mengatakan hal-hal itu
  rationale: Partisip aoris menunjukkan bahwa ucapan tersebut mendahului tindakan utama, sedangkan bentuk jamak ταῦτα merujuk pada perkataan Yesus sebelumnya.
- source_word: βλεπόντων αὐτῶν
  choice: sementara mereka sedang menyaksikan
  rationale: Konstruksi genitif absolut menyatakan keadaan yang berlangsung bersamaan. “Menyaksikan” secara alami menunjukkan bahwa mereka melihat langsung peristiwa tersebut.
- source_word: ἐπήρθη
  choice: Ia terangkat
  rationale: Bentuk pasif ini secara langsung menyatakan gerakan ke atas tanpa menentukan pelaku yang mengangkat-Nya. “Terangkat” mempertahankan bentuk pasif dan gambaran visual teks Yunani.
- source_word: νεφέλη
  choice: awan
  rationale: Nomina tunggal tanpa artikel diterjemahkan secara wajar sebagai “awan”, tanpa menambahkan identifikasi teologis ke dalam teks utama.
- source_word: ὑπέλαβεν
  choice: membawa-Nya
  rationale: Dalam konteks ini verba tersebut dapat berarti mengambil, menerima, atau membawa. “Membawa-Nya” menjadikan awan tetap sebagai subjek dan secara alami menyampaikan bahwa Yesus tidak terlihat lagi, sambil menyisakan alternatif “menerima-Nya” dalam catatan kaki.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: hingga Ia hilang dari pandangan mereka
  rationale: Ini merupakan ungkapan idiomatis tentang lenyapnya seseorang dari penglihatan. Pilihan ini jelas dan alami dalam bahasa Indonesia, tanpa menyiratkan bahwa Yesus lenyap keberadaan-Nya.
theological_decisions:
- issue: Apakah ἐπήρθη harus diterjemahkan dengan rumusan kenaikan yang lebih tradisional atau teologis
  choice: Ia terangkat
  alternative: Ia diangkat
  rationale: “Ia terangkat” dekat dengan bentuk pasif Yunani dan menggambarkan gerak ke atas tanpa secara eksplisit menyebut pelakunya. Alternatif yang sah dicatat tanpa memaksakan penafsiran ke dalam teks utama.
- issue: Apakah awan harus secara eksplisit disebut sebagai tanda kehadiran Allah
  choice: awan
  alternative: awan kehadiran Allah
  rationale: Awan memang dapat menggemakan berbagai peristiwa alkitabiah tentang kehadiran Allah, tetapi ayat ini tidak menyatakannya secara eksplisit. Kemungkinan gema itu ditempatkan dalam catatan kaki, bukan dimasukkan ke dalam terjemahan.
- issue: Cara menerjemahkan tindakan awan dalam ὑπέλαβεν
  choice: membawa-Nya
  alternative: menerima-Nya
  rationale: “Membawa-Nya” alami dalam konteks gerakan dan hilangnya Yesus dari pandangan, sedangkan “menerima-Nya” lebih harfiah dalam salah satu nuansa verba tetapi dapat terdengar seolah-olah awan adalah pelaku personal. Alternatif tersebut tetap dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kata ganti untuk Yesus dikapitalisasi sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Struktur kalimat mempertahankan urutan peristiwa, keberadaan para saksi mata, bentuk pasif pada ἐπήρθη, dan awan sebagai subjek tindakan.
