  source_fidelity: Teks Indonesia dengan tepat menyampaikan ὅτι sebagai penjelasan kausal, κατηριθμημένος ἦν sebagai keanggotaan yang sungguh-sungguh dalam kelompok, dan ἔλαχεν τὸν κλῆρον sebagai penerimaan bagian dalam pelayanan. Terjemahan tidak menambahkan kesimpulan teologis mengenai status akhir Yudas.
  naturalness: “Sebab ia termasuk dalam bilangan kami dan telah menerima bagian dalam pelayanan ini” adalah bahasa Indonesia baku, jelas, dan cukup alami. Frasa “dalam bilangan kami” bernada sedikit formal, tetapi sesuai dengan register naratif-pidato Kisah Para Rasul dan secara baik mengungkapkan gagasan ‘dihitung di antara kami’.
  terminology: “Pelayanan” merupakan padanan yang tepat dan mapan untuk διακονία dalam konteks kerasulan. “Bagian” secara wajar menyampaikan κλῆρος, sementara catatan kaki dengan tepat menjaga kemungkinan makna ‘undi’ maupun bagian yang dialokasikan.
