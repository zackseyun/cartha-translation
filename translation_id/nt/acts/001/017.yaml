  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: id
  text: Sebab ia termasuk dalam bilangan kami dan telah menerima bagian dalam pelayanan ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memperoleh jatah yang ditetapkan dalam pelayanan ini.” Kata Yunani κλῆρος dapat berarti “undi” atau “bagian/jatah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini, kata tersebut memperkenalkan alasan yang menjelaskan kedudukan Yudas dalam perkara yang sedang dibicarakan Petrus.
- source_word: κατηριθμημένος ἦν
  choice: ia termasuk dalam bilangan
  rationale: Ungkapan ini mempertahankan makna bahwa Yudas benar-benar dihitung sebagai anggota kelompok, sekaligus menyampaikan nuansa pasif secara wajar dalam bahasa Indonesia.
- source_word: ἐν ἡμῖν
  choice: kami
  rationale: Dalam konstruksi 'termasuk dalam bilangan kami', frasa ini menunjukkan keanggotaan dalam kelompok para rasul, bukan sekadar kedekatan dengan mereka.
- source_word: ἔλαχεν
  choice: telah menerima
  rationale: Kata kerja ini dapat menunjuk pada memperoleh sesuatu sebagai hasil penetapan atau pembagian. 'Telah menerima' alami dalam bahasa Indonesia, sedangkan nuansa pengundian atau penjatahan dijelaskan melalui catatan kaki.
- source_word: τὸν κλῆρον
  choice: bagian
  rationale: κλῆρος dapat berarti 'undi' maupun bagian atau jatah yang ditetapkan. Dalam konteks ini, 'bagian' dengan jelas menyatakan keikutsertaan Yudas dalam tugas tersebut tanpa secara keliru memastikan bahwa pengundian berlangsung pada kesempatan ini.
- source_word: τῆς διακονίας ταύτης
  choice: dalam pelayanan ini
  rationale: διακονία di sini menunjuk pada pelayanan atau tugas kerasulan. Preposisi 'dalam' menghasilkan ungkapan Indonesia yang alami bersama kata 'bagian'.
theological_decisions:
- issue: Hubungan Yudas dengan jabatan dan pelayanan kerasulan
  choice: Ayat ini menyatakan bahwa Yudas benar-benar termasuk dalam kelompok para rasul dan menerima bagian dalam pelayanan mereka.
  alternative: Pernyataan itu dapat dipahami secara lebih lemah sebagai sekadar pergaulan atau hubungan lahiriah dengan kelompok tersebut.
  rationale: Bahasa Yunani menegaskan bahwa Yudas dihitung di antara mereka dan menerima bagian dalam pelayanan itu. Terjemahan mempertahankan kenyataan historis tersebut tanpa menarik kesimpulan tentang penerimaan ilahi, kesetiaan sampai akhir, atau persoalan doktrinal lain yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'termasuk dalam bilangan kami' sedikit formal tetapi tetap mudah dipahami serta menjaga gagasan bahwa Yudas dihitung sebagai anggota kelompok.
