  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: id
  text: Karena itu, kami telah mengutus Yudas dan Silas[a], yang sendiri akan menyampaikan hal-hal yang sama secara lisan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami mengutus Yudas dan Silas”; bentuk perfektum Yunani dapat diterjemahkan sebagai bentuk lampau sederhana, tetapi “telah mengutus” lebih menonjolkan relevansi tindakan itu bagi keadaan saat surat diterima.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melalui perkataan”; maksudnya, melalui penyampaian lisan sebagai pelengkap surat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: kami telah mengutus
  rationale: Bentuk perfektum menyatakan tindakan pengutusan yang sudah dilakukan dan tetap relevan bagi para penerima surat; bentuk ini alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang timbul dari keputusan sidang yang disebut sebelumnya.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Yudas dan Silas
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: αὐτοὺς
  choice: sendiri
  rationale: Mempertahankan penekanan bahwa kedua utusan itu secara pribadi akan meneguhkan isi surat.
- source_word: διὰ λόγου
  choice: secara lisan
  rationale: Ungkapan ini menunjuk pada penyampaian melalui ucapan, sebagai pelengkap surat tertulis.
- source_word: ἀπαγγέλλοντας
  choice: yang akan menyampaikan
  rationale: Partisipel menerangkan apa yang akan dilakukan Yudas dan Silas sebagai utusan; bentuk relatif dengan nuansa waktu mendatang alami dalam konteks surat.
- source_word: τὰ αὐτά
  choice: hal-hal yang sama
  rationale: Mempertahankan keluasan rujukan Yunani kepada isi yang sama tanpa mempersempitnya menjadi sekadar 'pesan'.
