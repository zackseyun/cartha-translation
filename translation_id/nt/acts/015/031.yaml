  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: id
  text: Setelah membacanya, mereka bersukacita karena dorongan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunaninya, paraklēsis, juga dapat diterjemahkan “nasihat,” “penghiburan,” atau “penguatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Setelah membacanya
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama. Akhiran -nya merujuk secara alami pada surat yang disebut dalam ayat sebelumnya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung ringan; dalam bahasa Indonesia, urutan narasi sudah tersampaikan secara alami oleh frasa pembuka 'Setelah membacanya' tanpa perlu menambahkan 'dan'.
- source_word: ἐχάρησαν
  choice: mereka bersukacita
  rationale: Bentuk aoris dari χαίρω bermakna aktif dan menyatakan kegembiraan; 'bersukacita' mempertahankan bobot ungkapannya dalam ragam Alkitab modern yang wajar.
- source_word: ἐπὶ
  choice: karena
  rationale: Dengan datif dalam konteks ini, ἐπί menunjukkan dasar atau sebab sukacita.
- source_word: τῇ παρακλήσει
  choice: isinya yang menguatkan
  rationale: παράκλησις dapat berarti penguatan, dorongan, penghiburan, atau nasihat. Ungkapan ini secara alami menghubungkan dampak penguatan tersebut dengan isi surat tanpa mempersempit maknanya hanya pada penghiburan atau nasihat.
theological_decisions:
- issue: Cakupan makna παράκλησις
  choice: isinya yang menguatkan
  alternative: dorongan; nasihat; penghiburan
  rationale: Pilihan utama menyampaikan dampak surat yang meneguhkan jemaat, sementara catatan kaki mempertahankan rentang makna Yunani dan ambiguitas antara dorongan, nasihat, serta penghiburan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan keluasan makna παράκλησις.
