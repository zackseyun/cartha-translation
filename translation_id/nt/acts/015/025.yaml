  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: id
  text: Kami telah mencapai kata sepakat dan memandang baik untuk memilih beberapa orang[a] serta mengutus mereka kepada kalian bersama Barnabas dan Paulus yang kami kasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laki-laki”; yang dimaksud ialah para utusan laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: kami ... memandang baik
  rationale: Ungkapan ini menyampaikan pertimbangan dan persetujuan bersama tanpa memperkuatnya menjadi perintah atau penilaian moral mutlak.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: telah mencapai kata sepakat
  rationale: Menjaga gagasan proses mencapai kesatuan pendapat yang dinyatakan oleh partisip γενομένοις dan adverbia ὁμοθυμαδόν.
- source_word: ἐκλεξαμένοις ἄνδρας
  choice: memilih beberapa orang
  rationale: Susunan infinitif alami dalam bahasa Indonesia menyampaikan bahwa mereka bermufakat untuk memilih lalu mengutus. Kata 'orang' lancar dalam teks utama, sedangkan makna khusus laki-laki pada ἄνδρας dijelaskan dalam catatan kaki.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: mengutus mereka kepada kalian
  rationale: '''Mengutus'' sesuai dengan pengiriman para wakil; objek ''mereka'' tersirat dari orang-orang yang dipilih.'
- source_word: σὺν τοῖς ἀγαπητοῖς ἡμῶν
  choice: bersama ... yang kami kasihi
  rationale: Menyatakan penyertaan sekaligus kehangatan relasional ἀγαπητοῖς dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Barnabas dan Paulus
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Nada pertimbangan bersama dalam surat dari Yerusalem
  choice: kami ... memandang baik
  alternative: kami memutuskan
  rationale: Konstruksi δοκέω menyatakan penilaian atau persetujuan kolektif. Pilihan ini tidak menambahkan kadar otoritas yang lebih kuat daripada yang dinyatakan klausa Yunani.
- issue: Kesatuan kelompok
  choice: telah mencapai kata sepakat
  alternative: dengan sehati
  rationale: Pilihan utama mempertahankan kemungkinan bahwa kelompok itu sampai pada kesepakatan, bukan sekadar berada dalam suasana kebersamaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat resmi tetapi tetap mudah dipahami. 'Kalian' dipakai untuk menandai penerima jamak. Struktur kalimat diatur ulang secara wajar tanpa menghilangkan hubungan antara kesepakatan, pemilihan, dan pengutusan.
