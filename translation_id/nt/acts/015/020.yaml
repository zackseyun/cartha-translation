source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: id
  text: melainkan menulis kepada mereka agar mereka menjauhkan diri dari pencemaran yang berkaitan dengan berhala[a], dari percabulan[b], dari daging binatang yang dicekik[c], dan dari darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenajisan yang berkaitan dengan berhala.” Sejumlah terjemahan mempersempit ungkapan ini menjadi “makanan yang dipersembahkan kepada berhala,” tetapi ungkapan Yunaninya di sini lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunaninya dapat berarti perilaku seksual yang tidak bermoral secara luas; sebagian penafsir memahaminya di sini secara lebih khusus sebagai hubungan seksual atau perkawinan yang dilarang.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “apa yang dicekik,” yaitu daging dari binatang yang darahnya tidak dikeluarkan dengan semestinya.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: menulis kepada mereka
  rationale: Dalam konteks sidang Yerusalem, kata ini menunjuk pada penyampaian ketetapan secara tertulis. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa surat.
- source_word: ἀπέχεσθαι
  choice: menjauhkan diri dari
  rationale: Bentuk tengah kata ini berarti menahan atau menjaga diri dari sesuatu. Pilihan ini jelas dan wajar untuk rangkaian larangan tersebut.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: pencemaran yang berkaitan dengan berhala
  rationale: Ungkapan ini mempertahankan cakupan ἀλίσγημα sebagai pencemaran atau kenajisan kultis tanpa mempersempitnya hanya menjadi makanan yang dipersembahkan kepada berhala.
- source_word: πορνείας
  choice: percabulan
  rationale: Dalam bahasa Indonesia, 'percabulan' dapat menunjuk secara luas pada perilaku seksual yang tidak patut dan tidak membatasi maknanya hanya pada hubungan seksual pranikah.
- source_word: τοῦ πνικτοῦ
  choice: daging binatang yang mati dicekik
  rationale: Kata sifat substantival ini menunjuk pada binatang yang dibunuh dengan dicekik sehingga darahnya tidak dikeluarkan. Penambahan 'daging binatang' membuat rujukannya jelas dan alami dalam bahasa Indonesia, sementara catatan kaki memberikan bentuk harfiahnya.
- source_word: τοῦ αἵματος
  choice: darah
  rationale: Terjemahan ringkas ini mengikuti objek dari perintah untuk menjauhkan diri dan tidak menambahkan penjelasan mengenai cara penggunaan atau konsumsinya yang tidak dinyatakan secara eksplisit dalam ayat.
theological_decisions:
- issue: Cakupan larangan yang berkaitan dengan berhala
  choice: pencemaran yang berkaitan dengan berhala
  alternative: makanan yang dipersembahkan kepada berhala
  rationale: Teks memakai ἀλισγημάτων τῶν εἰδώλων, bukan istilah yang secara khusus berarti daging persembahan berhala. Terjemahan utama mempertahankan cakupan yang lebih luas.
- issue: Makna πορνεία dalam ketetapan para rasul
  choice: percabulan
  alternative: hubungan seksual yang terlarang atau perkawinan yang dilarang
  rationale: Istilah Yunani dapat dipahami secara luas sebagai perilaku seksual yang tidak bermoral atau, dalam konteks ini, secara lebih khusus sebagai hubungan yang dilarang. Terjemahan tidak memutuskan perdebatan tersebut.
- issue: Sifat dan jangka berlaku larangan makanan dalam ketetapan
  choice: menyajikan larangan sebagaimana dinyatakan tanpa menentukan jangka berlakunya
  alternative: ketentuan sementara demi persekutuan Yahudi-bukan Yahudi atau perintah permanen bagi semua orang percaya
  rationale: Ayat ini menyatakan apa yang harus dihindari, tetapi tidak menerangkan apakah ketentuan itu bersifat sementara atau permanen.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan hubungan dengan ayat sebelumnya melalui 'melainkan'. Istilah 'percabulan' dipakai sebagai istilah umum yang tetap mudah dipahami, sedangkan rincian budaya mengenai binatang yang dicekik ditempatkan dalam catatan kaki.
