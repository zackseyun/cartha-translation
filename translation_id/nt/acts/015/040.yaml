id: ACT.15.40
reference: Acts 15:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: id
  text: Namun, Paulus memilih Silas lalu berangkat setelah Paulus dipercayakan oleh saudara-saudara seiman[b] kepada anugerah Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diserahkan kepada anugerah Tuhan.”
    reason: lexical_alternative
  - marker: b
    text: Istilah “saudara-saudara seiman” di sini dapat mengacu pada komunitas orang percaya secara lebih luas, termasuk perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan keberangkatan Barnabas pada ayat sebelumnya.
- source_word: ἐπιλεξάμενος
  choice: memilih
  rationale: Menyatakan bahwa Paulus sendiri memilih Silas sebelum berangkat, tanpa menerjemahkan nuansa bentuk medial secara berlebihan.
- source_word: Σιλᾶν
  choice: Silas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἐξῆλθεν
  choice: berangkat
  rationale: Dalam konteks perjalanan, kata ini berarti pergi atau memulai perjalanan; 'berangkat' alami dan tepat.
- source_word: παραδοθεὶς
  choice: setelah ... menyerahkannya
  rationale: Bentuk pasif ini menggambarkan Paulus diserahkan atau dipercayakan ke dalam pemeliharaan anugerah Tuhan; catatan kaki mempertahankan alternatif idiomatis 'mempercayakannya'.
- source_word: τῇ χάριτι
  choice: kepada anugerah
  rationale: Mempertahankan nomina teologis χάρις dan relasinya dengan tindakan menyerahkan, tanpa memparafrasakannya menjadi 'pemeliharaan yang penuh anugerah'.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος tanpa menentukan secara eksplisit apakah acuannya Yesus atau Allah.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: oleh saudara-saudara seiman
  rationale: Mengungkapkan relasi komunitas iman secara alami dalam bahasa Indonesia; catatan kaki menjelaskan bahwa kelompok ini dapat mencakup laki-laki dan perempuan.
theological_decisions:
- issue: Acuan 'Tuhan'
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks Yunani tidak menyebutkan acuan κύριος secara lebih khusus, sehingga terjemahan mempertahankan ketidakspesifikan itu.
- issue: Cakupan 'saudara-saudara'
  choice: saudara-saudara seiman, dengan catatan tentang cakupan komunitas
  alternative: saudara-saudari seiman; orang-orang percaya
  rationale: ἀδελφῶν berbentuk maskulin jamak, tetapi dalam konteks komunitas Kristen dapat menunjuk kepada komunitas yang lebih luas. Teks utama mempertahankan bentuk 'saudara-saudara', sedangkan catatan menjelaskan kemungkinan cakupannya.
- issue: Makna penyerahan kepada anugerah Tuhan
  choice: menyerahkannya kepada anugerah Tuhan
  alternative: mempercayakannya kepada anugerah Tuhan; menganjurkannya kepada anugerah Tuhan
  rationale: Ungkapan ini menunjukkan tindakan komunitas menyerahkan Paulus ke dalam pemeliharaan ilahi. Terjemahan utama dekat dengan struktur sumber, sementara alternatif idiomatis dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan urutan peristiwa Yunani secara alami. Penanda catatan [b] ditempatkan langsung setelah istilah komunitas yang dijelaskan, sedangkan [a] ditempatkan setelah ungkapan yang memiliki alternatif leksikal.
