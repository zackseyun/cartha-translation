id: ACT.15.35
reference: Acts 15:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: id
  text: Namun, Paulus dan Barnabas tetap tinggal di Antiokhia[a], sambil mengajar dan memberitakan kabar baik tentang firman Tuhan[b][c] bersama banyak orang lain juga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghabiskan beberapa waktu di Antiokhia.” Kata kerja Yunani dapat menekankan bahwa mereka berada di sana selama suatu waktu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “memberitakan Injil.” Kata Yunani berarti mengumumkan atau memberitakan kabar baik.
    reason: lexical_alternative
  - marker: c
    text: “Firman Tuhan” merupakan ungkapan yang sering dipakai dalam Kisah Para Rasul untuk pesan Tuhan; “pesan Tuhan” juga mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: tetap tinggal
  rationale: Bentuk imperfek menunjukkan bahwa Paulus dan Barnabas terus berada di Antiokhia selama suatu waktu; 'tetap tinggal' alami dalam bahasa Indonesia dan mempertahankan nuansa duratif.
- source_word: διδάσκοντες
  choice: mengajar
  rationale: Padanan langsung dan wajar bagi kegiatan yang berlangsung selama mereka tinggal di Antiokhia.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik
  rationale: Kata kerja ini berarti mengumumkan kabar baik. Ungkapan ini jelas bagi pembaca modern dan tetap mempertahankan makna pemberitaan Injil.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: bersama banyak orang lain juga
  rationale: Menunjukkan bahwa banyak orang lain turut menjalankan pelayanan tersebut; 'juga' mempertahankan daya tambah καί.
- source_word: λόγον
  choice: firman
  rationale: Dalam frasa baku Kisah Para Rasul, λόγος dapat berarti 'firman' atau 'pesan'. 'Firman Tuhan' mempertahankan kesinambungan sastra dan teologis ungkapan Yunani tanpa menghalangi pengertian sebagai pesan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος tanpa mempersempit rujukannya lebih jauh daripada teks Yunani.
theological_decisions:
- issue: Rujukan 'Tuhan' dalam 'firman Tuhan'
  choice: Diterjemahkan secara netral sebagai 'Tuhan'.
  alternative: Memperjelasnya sebagai Tuhan Yesus atau sebagai Allah.
  rationale: Dalam Kisah Para Rasul, κύριος sering menunjuk khususnya kepada Yesus, tetapi frasa Yunani di sini tidak menyebut nama. Terjemahan mempertahankan ketegangan dan tidak menambahkan penafsiran.
- issue: Hubungan 'firman Tuhan' dengan dua kegiatan
  choice: '''Firman Tuhan'' dipahami sebagai isi yang diajarkan dan diberitakan sebagai kabar baik.'
  alternative: Menghubungkannya hanya dengan tindakan memberitakan kabar baik.
  rationale: Susunan Yunani menempatkan objek setelah kedua partisip dan secara alami memungkinkan objek itu mencakup keduanya; kalimat Indonesia disusun agar hubungan tersebut jelas tanpa mengubah isinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Kalimat dibagi dua agar susunan para pelaku, kegiatan, dan isi pemberitaan terdengar alami. 'Namun' menyampaikan δέ sebagai peralihan yang berkontras ringan; 'Antiokhia' mengikuti ejaan nama yang lazim dalam Alkitab bahasa Indonesia.
