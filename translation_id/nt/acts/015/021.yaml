  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: id
  text: Sebab, sejak dahulu kala, di setiap kota Musa memiliki orang-orang yang memberitakan dia[a], sementara ia dibacakan di sinagoge-sinagoge setiap hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Musa ... orang-orang yang memberitakan dia ... ia dibacakan.” Nama “Musa” dipakai secara metonimis untuk tulisan-tulisan atau hukum yang dikaitkan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan bagi keputusan yang disebut sebelumnya.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: sejak generasi-generasi dahulu
  rationale: Mempertahankan bentuk jamak γενεῶν serta menyatakan keadaan yang berlangsung sejak masa lampau.
- source_word: κατὰ πόλιν
  choice: di setiap kota
  rationale: Menyampaikan makna distributif κατά dengan bentuk Indonesia yang alami.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: orang-orang yang memberitakan dia
  rationale: Mempertahankan bahasa pemberitaan dan objek pronominal yang secara metonimis menunjuk kepada Musa beserta tulisan atau hukumnya.
- source_word: ἔχει
  choice: mempunyai
  rationale: Menerjemahkan bentuk kini Yunani secara langsung; frasa 'sejak generasi-generasi dahulu' sudah menunjukkan keberlangsungan keadaan itu.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: di rumah-rumah ibadat
  rationale: Istilah Indonesia yang lazim untuk sinagoge, dengan bentuk jamak yang sesuai konteks.
- source_word: κατὰ πᾶν σάββατον
  choice: setiap hari Sabat
  rationale: Menyampaikan pengulangan teratur yang dinyatakan oleh konstruksi distributif.
- source_word: ἀναγινωσκόμενος
  choice: dan ia dibacakan
  rationale: Mempertahankan makna pasif dan hubungan keadaan yang menyertai tanpa menetapkan nuansa kausal yang tidak dinyatakan secara tegas.
theological_decisions:
- issue: Rujukan metonimis kepada Musa
  choice: Mempertahankan 'Musa', 'dia', dan 'ia' dalam teks utama.
  alternative: Menggantikannya dengan 'hukum Musa' atau 'tulisan-tulisan Musa'.
  rationale: Teks Yunani menyebut Musa secara pribadi sebagai metonimi bagi tulisan atau hukum yang berkaitan dengannya. Mempertahankan bentuk itu menjaga ungkapan sumber dan tidak memasukkan penafsiran ke dalam teks utama.
- issue: Hubungan partisip ἀναγινωσκόμενος dengan klausa utama
  choice: Menggunakan 'dan ia dibacakan'.
  alternative: Menggunakan 'karena ia dibacakan' atau 'dengan dibacakannya Musa'.
  rationale: Partisip dapat dipahami sebagai keadaan yang menyertai dan mungkin mendukung alasan dalam konteks, tetapi nilai kausalnya tidak harus dibuat eksplisit; terjemahan ini mempertahankan kelonggaran sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan metonimis sumber dipertahankan; catatan kaki menjelaskan maksudnya tanpa menggantikannya dalam teks utama.
