  source_fidelity: Revisi diperlukan karena “karena Ia telah menyucikan” menetapkan hubungan kausal dan aspek temporal yang tidak secara eksplisit ditentukan oleh partisip aoris καθαρίσας. Frasa “dengan menyucikan” lebih dekat dengan bentuk partisipial sumber dan membiarkan hubungan tepatnya dengan verba utama tetap terbuka. “Tidak membuat perbedaan antara kita dan mereka” menyampaikan οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν dengan jelas.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan alami. “Melalui iman” merupakan ungkapan yang lazim; konstruksi “dengan menyucikan” mempertahankan keterkaitan tindakan tanpa menjadikannya alasan eksplisit.
  terminology: “Iman” tepat untuk πίστις dan “hati” tepat untuk καρδίας. Istilah “membuat perbedaan” secara idiomatis menyampaikan makna διακρίνω dalam konteks ini. Catatan kaki mempertahankan alternatif instrumental bagi datif τῇ πίστει.
