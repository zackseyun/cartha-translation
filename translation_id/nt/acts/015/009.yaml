  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: id
  text: Ia tidak membuat perbedaan antara kita dan mereka, dengan menyucikan hati mereka melalui iman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “oleh iman.” Datif Yunani dapat menyatakan sarana atau perantaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: sama sekali tidak membedakan
  rationale: Gabungan ini secara idiomatis menyatakan bahwa Allah tidak membuat pembedaan; “sama sekali tidak” mempertahankan penekanan οὐθέν dalam bahasa Indonesia yang alami.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: antara kita dan mereka
  rationale: Menyampaikan frasa preposisional dan pasangan τε ... καί secara wajar tanpa menambahkan unsur yang tidak diperlukan.
- source_word: τῇ πίστει
  choice: melalui iman
  rationale: Datif ini paling mungkin menyatakan sarana atau perantaraan. “Melalui iman” alami dalam bahasa Indonesia dan mempertahankan πίστις sebagai “iman.”
- source_word: καθαρίσας
  choice: karena Ia telah menyucikan
  rationale: 'Partisip aoris berkaitan dengan tindakan verba utama. Bentuk klausa ini menyampaikan dasar yang tampak dimaksud dalam konteks: tindakan penyucian menunjukkan bahwa Allah tidak membedakan kedua kelompok, sambil tidak memaksakan urutan waktu yang kaku.'
- source_word: τὰς καρδίας αὐτῶν
  choice: hati mereka
  rationale: “Hati” merupakan padanan baku bagi καρδία sebagai pusat batin manusia, dan αὐτῶν merujuk kepada bangsa-bangsa lain dalam konteks.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konstruksi ini πίστις paling wajar menunjuk kepada iman sebagai sarana penyucian. Tidak ada penanda kontekstual yang cukup untuk memilih “kesetiaan.”
- issue: Hubungan καθαρίσας dengan διέκρινεν
  choice: karena Ia telah menyucikan
  alternative: setelah menyucikan; dengan menyucikan
  rationale: Partisip aoris dapat dibaca secara temporal, modal, atau kausal. Konteks argumen Petrus mendukung nuansa kausal/evidensial, tetapi alternatif temporal tetap mungkin dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Ia” mempertahankan rujukan kepada Allah dari konteks. Susunan kalimat dibuat alami sambil menjaga penekanan bahwa tidak ada pembedaan antara kedua kelompok.
