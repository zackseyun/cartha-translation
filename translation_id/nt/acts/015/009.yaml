    rationale: Audit bahasa Inggris secara khusus mencatat alternatif “through/by faith.” Catatan kaki revisi memusatkan diri pada alternatif instrumental datif, sedangkan teks utama sudah mempertahankan bentuk partisipial secara memadai.
