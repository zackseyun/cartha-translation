id: ACT.15.36
reference: Acts 15:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: id
  text: Beberapa hari kemudian, Paulus berkata kepada Barnabas, “Mari kita sekarang kembali dan mengunjungi saudara-saudara[a] di setiap kota tempat kita telah memberitakan firman Tuhan, dan melihat bagaimana keadaan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang harfiah berarti “saudara-saudara” dapat dipakai untuk seluruh kelompok orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Beberapa hari kemudian
  rationale: Ungkapan μετά dengan akusatif waktu menunjukkan waktu sesudahnya; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan selang waktu yang tidak ditentukan.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Paulus berkata kepada Barnabas
  rationale: Mengungkapkan pembicara dan lawan bicara secara langsung dan wajar, tanpa mengubah arti εἶπεν πρὸς.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Mari kita kembali dan mengunjungi
  rationale: Partisip aoris Ἐπιστρέψαντες menyatu secara idiomatis dengan subjungtif ajakan ἐπισκεψώμεθα; δή memberi dorongan pada usulan, yang sudah tersampaikan secara alami oleh bentuk ajakan ini.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara
  rationale: Mempertahankan istilah kekerabatan maskulin dalam bahasa Yunani; catatan kaki menjelaskan bahwa istilah itu dapat mencakup seluruh komunitas orang percaya.
- source_word: κατὰ πόλιν πᾶσαν
  choice: di setiap kota
  rationale: 'Mencerminkan daya distributif konstruksi κατά: tiap-tiap kota tempat pelayanan mereka sebelumnya.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: tempat kita telah memberitakan
  rationale: καταγγέλλω menunjuk pada penyampaian atau pemberitaan terbuka; 'memberitakan' alami dan tepat dalam konteks ini.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: firman Tuhan
  rationale: Ungkapan baku dan dapat dipahami untuk pesan yang berasal dari atau mengenai Tuhan, dengan κύριος diterjemahkan 'Tuhan' sesuai pemakaian Perjanjian Baru dalam bahasa Indonesia.
- source_word: πῶς ἔχουσιν
  choice: untuk melihat keadaan mereka
  rationale: Menyampaikan idiom mengenai kondisi atau keadaan mereka dan mempertahankan perhatian pastoral tanpa mempersempit maksudnya.
theological_decisions:
- issue: Cakupan ἀδελφοί yang kemungkinan merujuk pada kelompok campuran
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Teks utama mempertahankan metafora kekeluargaan dan bentuk sumber, sedangkan kemungkinan cakupan laki-laki dan perempuan dijelaskan dalam catatan kaki.
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks pemberitaan Kristen di Kisah Para Rasul, 'Tuhan' adalah padanan Indonesia yang baku dan tepat tanpa menentukan lebih jauh relasi genitif dalam 'firman Tuhan'.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Bentuk ajakan 'Mari kita' menjaga nada usulan Paulus; susunan kalimat dibuat alami tanpa menghilangkan urutan kembali, mengunjungi, dan memeriksa keadaan jemaat.
