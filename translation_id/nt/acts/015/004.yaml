  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: id
  text: Ketika mereka tiba di Yerusalem, mereka disambut oleh jemaat, para rasul, dan para penatua, dan mereka melaporkan segala sesuatu yang telah Allah lakukan bersama mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui mereka” atau “di antara mereka.” Bahasa Yunani berbunyi “bersama mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Ketika mereka tiba di Yerusalem
  rationale: Partisip aoris menyatakan keadaan waktu yang mendahului verba utama. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya; fungsi penghubung ringan δέ terserap dalam konstruksi tersebut.
- source_word: παρεδέχθησαν
  choice: mereka disambut
  rationale: Bentuk pasif παραδέχομαι di sini menunjukkan penerimaan yang ramah. “Disambut” lebih alami daripada “diterima” dalam konteks kedatangan mereka.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: oleh jemaat, para rasul, dan para penatua
  rationale: Dalam konstruksi pasif, ἀπό menandai pihak yang menyambut. “Jemaat” menunjuk komunitas orang percaya, sedangkan “penatua” mempertahankan makna kepemimpinan yang diakui tanpa memasukkan istilah khas denominasi tertentu.
- source_word: ἀνήγγειλάν τε
  choice: lalu mereka melaporkan
  rationale: ἀναγγέλλω berarti memberitakan atau menyampaikan laporan. “Melaporkan” sesuai dengan penyampaian kabar kepada jemaat dan para pemimpinnya; “lalu” menghubungkan tindakan ini secara alami dengan penyambutan sebelumnya.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: segala sesuatu yang telah Allah lakukan
  rationale: ὅσα mencakup seluruh isi laporan. “Telah ... lakukan” menunjukkan bahwa karya Allah berlangsung sebelum laporan itu disampaikan tanpa mempersempit cakupan ποιέω.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: μετά dengan genitif secara langsung berarti “bersama.” Terjemahan ini mempertahankan keluasan ungkapan Yunani dan tidak membatasinya hanya pada makna perantaraan atau lokasi.
theological_decisions:
- issue: Peran manusia dalam karya Allah pada frasa μετ’ αὐτῶν
  choice: Allah lakukan bersama mereka
  alternative: Allah lakukan melalui mereka; Allah lakukan di antara mereka
  rationale: Ungkapan Yunani menempatkan Allah sebagai pelaku utama sambil mengaitkan Paulus dan Barnabas dengan karya-Nya. “Bersama mereka” mempertahankan ketegangan dan keterbukaan makna itu tanpa menegaskan secara berlebihan bahwa mereka hanya alat atau bahwa karya tersebut hanya terjadi di tengah mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan satu kalimat mempertahankan alur sumber Yunani, sementara “ketika,” “disambut,” dan “lalu” membuat hubungan antartindakan jelas dan alami bagi pembaca umum.
