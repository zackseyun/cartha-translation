  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: id
  text: Karena itu, aku berpendapat[b] bahwa kita hendaknya tidak menyulitkan orang-orang dari bangsa-bangsa lain[a] yang berbalik kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang dari kalangan bangsa-bangsa bukan Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Karena itu, aku memutuskan untuk tidak menyulitkan” atau “Karena itu, menurut pertimbanganku, kita tidak boleh menyulitkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari argumen Yakobus sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐγὼ κρίνω
  choice: menurut pertimbanganku
  rationale: Mempertahankan penilaian pribadi Yakobus yang dinyatakan secara eksplisit oleh ἐγώ, sekaligus menyampaikan nuansa keputusan yang telah dipertimbangkan.
- source_word: μὴ παρενοχλεῖν
  choice: kita tidak boleh menyulitkan
  rationale: παρενοχλέω berarti menimbulkan gangguan atau kesulitan. Bentuk 'kita tidak boleh' menyampaikan daya praktis usulan Yakobus kepada sidang tanpa mengubahnya menjadi perintah langsung.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: orang-orang dari bangsa-bangsa lain
  rationale: Menjaga rujukan kepada orang-orang yang berasal dari kalangan non-Yahudi serta nuansa preposisional ἀπό.
- source_word: ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Yahudi-Kristen ini, istilah tersebut menunjuk kepada bangsa-bangsa non-Yahudi. Ungkapan ini alami dan menghindari istilah 'kafir' yang kini dapat bernada merendahkan.
- source_word: ἐπιστρέφουσιν
  choice: yang sedang berbalik
  rationale: Partisipel kini menggambarkan gerak yang sedang berlangsung menuju Allah; 'berbalik' mempertahankan citra verbal tanpa memasukkan istilah teknis teologis.
- source_word: ἐπὶ τὸν θεόν
  choice: kepada Allah
  rationale: Menyatakan arah gerak pertobatan atau perubahan hidup menuju Allah secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ayat ini hanya menyatakan pendapat pribadi Yakobus atau mengusulkan keputusan bersama
  choice: 'Yakobus menyatakan pertimbangannya sendiri sebagai usulan yang mengikat tindakan bersama: ''menurut pertimbanganku, kita tidak boleh menyulitkan''.'
  alternative: '''Aku memutuskan untuk tidak menyulitkan'' atau ''menurut pertimbanganku, mereka tidak boleh dipersulit''.'
  rationale: ἐγὼ κρίνω secara eksplisit berbentuk orang pertama tunggal, sedangkan klausa infinitif menyatakan isi keputusan yang menyangkut tindakan sidang. Terjemahan ini mempertahankan kedua unsur tersebut.
- issue: Makna 'berbalik kepada Allah'
  choice: Dipertahankan sebagai gambaran perubahan arah menuju Allah.
  alternative: '''bertobat kepada Allah'' atau ''menjadi percaya kepada Allah''.'
  rationale: Bahasa sumber memakai citra 'berbalik' dan tidak secara eksplisit memilih istilah teknis yang lebih sempit; karena itu ambiguitas dan keluasan ungkapan asli dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Bangsa-bangsa lain' dipilih daripada 'orang kafir' untuk ketepatan konteks dan guna menghindari konotasi merendahkan. Penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkannya.
