  to: 'Mereka menulis surat dan mengirimkannya melalui kedua orang itu:[a]


    “Para rasul dan para penatua yang adalah saudara-saudara[b] mengirim salam kepada saudara-saudara yang berasal dari bangsa-bangsa lain[c] di Antiokhia, Suriah, dan Kilikia.”'
  rationale: Revisi menghapus penambahan “kalian,” memperjelas bahwa “saudara-saudara” secara utama menjelaskan “para penatua,” dan tetap mencatat pembacaan koordinatif yang mungkin. Idiom διὰ χειρὸς αὐτῶν diterjemahkan secara idiomatis sebagai pengiriman melalui kedua utusan, dengan bentuk harfiahnya dijelaskan dalam catatan kaki. Formula salam dipertahankan sebagai salam epistoler, bukan perintah untuk bersukacita.
