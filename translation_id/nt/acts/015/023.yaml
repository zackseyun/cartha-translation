  naturalness: 'Teks revisi memakai rumus pembukaan surat yang alami dan jelas dalam bahasa Indonesia modern: pengirim mengirim salam kepada penerima. “Suriah” dipakai sebagai bentuk modern baku untuk nama wilayah tersebut.'
