source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: id
  text: 'Mereka menulis surat dan mengirimkannya melalui kedua orang itu:[a]


    “Para rasul dan para penatua yang adalah saudara-saudara[b] mengirim salam kepada saudara-saudara yang berasal dari bangsa-bangsa lain[c] di Antiokhia, Suriah, dan Kilikia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setelah menulis melalui tangan mereka”; ungkapan ini berarti surat itu dikirimkan atau disampaikan melalui kedua utusan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau, “para penatua dan saudara-saudara.” Teks Yunani juga dapat dipahami demikian, tetapi susunannya lebih wajar dipahami bahwa “saudara-saudara” menjelaskan para penatua.
    reason: alternative_reading
  - marker: c
    text: Sebutan “saudara-saudara” di sini dapat mencakup semua sesama orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες διὰ χειρὸς αὐτῶν
  choice: Mereka menulis surat yang dibawa oleh kedua utusan itu
  rationale: Partisip aoristus γράψαντες melanjutkan tindakan dalam ayat sebelumnya, sedangkan idiom διὰ χειρὸς αὐτῶν menyatakan perantaraan para utusan. Terjemahan ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa para utusanlah penulis surat.
- source_word: ἀπόστολοι
  choice: para rasul
  rationale: Padanan baku dan jelas bagi para utusan-pemimpin yang diakui dalam jemaat Yerusalem.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: para penatua, saudara-saudara kalian
  rationale: Tanpa artikel kedua, ἀδελφοί paling wajar dipahami secara aposisional atau sebagai sapaan yang menjelaskan hubungan para penatua dengan penerima. Bentuk ini mempertahankan bahwa yang dimaksud ialah para penatua, bukan kelompok ketiga yang terpisah.
- source_word: ἀδελφοῖς
  choice: saudara-saudara
  rationale: Mempertahankan bentuk kekerabatan rohani dari teks Yunani; catatan kaki menjelaskan bahwa dalam konteks ini sebutan tersebut dapat mencakup semua orang percaya, termasuk perempuan.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: dari bangsa-bangsa lain
  rationale: Mengungkapkan asal-usul non-Yahudi para penerima dengan istilah Indonesia yang alami dan tidak bernada merendahkan.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: yang berada di Antiokhia, Siria, dan Kilikia
  rationale: κατά dengan akusatif di sini menunjukkan lokasi atau persebaran penerima di wilayah-wilayah yang disebutkan.
- source_word: χαίρειν
  choice: Salam
  rationale: Dalam pembukaan surat, χαίρειν adalah rumus salam konvensional, bukan perintah untuk bersukacita.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam sapaan kepada jemaat
  choice: saudara-saudara, dengan penjelasan inklusif dalam catatan kaki
  alternative: saudara-saudari atau sesama orang percaya
  rationale: Bentuk maskulin sumber dipertahankan, tetapi kemungkinan rujukan kepada seluruh komunitas, termasuk perempuan, dinyatakan secara terbuka agar cakupan sosialnya tidak dipersempit.
- issue: Hubungan sintaksis πρεσβύτεροι dan ἀδελφοί
  choice: para penatua, saudara-saudara kalian
  alternative: para penatua dan saudara-saudara
  rationale: Ketiadaan artikel sebelum ἀδελφοί mendukung pembacaan aposisional, meskipun tanda baca naskah kuno tidak menentukan dan pembacaan koordinatif tetap mungkin. Catatan kaki mempertahankan ambiguitas ini.
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Rumus pembukaan surat dibuat alami tanpa menghapus idiom perantaraan pada catatan kaki. Nama tempat mengikuti bentuk Indonesia yang lazim: Antiokhia, Siria, dan Kilikia.'
