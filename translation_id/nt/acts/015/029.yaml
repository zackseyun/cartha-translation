  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: id
  text: menjauhkan diri dari makanan yang dipersembahkan kepada berhala[a], dari darah, dari hewan yang dicekik[b], dan dari percabulan[c]. Jika kalian menjaga diri dari hal-hal ini, kalian akan berbuat baik. Salam[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang dipersembahkan kepada berhala.”
    reason: lexical_alternative
  - marker: b
    text: Atau “daging dari hewan yang dicekik” atau “apa yang dicekik.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Yunani yang diterjemahkan “percabulan” dapat dipahami secara luas. Namun, dalam konteks ini sebagian penafsir memahaminya secara lebih khusus sehubungan dengan larangan-larangan dalam kitab Imamat.
    reason: alternative_reading
  - marker: d
    text: Secara harfiah dapat berarti “Tetaplah sehat.” Dalam bahasa Yunani, kata ini merupakan ungkapan penutup surat yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: menjauhkan diri
  rationale: Infinitif ini menyatakan isi petunjuk untuk tidak mengambil bagian dalam hal-hal yang disebutkan; bentuk ini alami dan tetap mempertahankan gagasan menjauhkan diri.
- source_word: εἰδωλοθύτων
  choice: makanan yang dipersembahkan kepada berhala
  rationale: Istilah ini menunjuk pada sesuatu yang dipersembahkan dalam penyembahan berhala, khususnya makanan atau daging; terjemahan ini jelas bagi pembaca modern.
- source_word: αἵματος
  choice: darah
  rationale: Terjemahan langsung mempertahankan bentuk ringkas teks Yunani tanpa mempersempit acuannya secara eksplisit.
- source_word: πνικτῶν
  choice: apa yang mati dicekik
  rationale: Adjektiva substantival ini menunjuk pada hewan yang dibunuh dengan dicekik; frasa tersebut mempertahankan keluasan bentuk Yunani.
- source_word: πορνείας
  choice: percabulan
  rationale: Dalam bahasa Indonesia Alkitabiah modern, 'percabulan' cukup luas untuk perilaku seksual yang tidak bermoral dan tidak membatasinya pada hubungan pranikah saja.
- source_word: ἐξ ὧν
  choice: dari hal-hal ini
  rationale: Frasa ini menunjuk kembali pada seluruh daftar larangan dan dibuat eksplisit secara alami dalam bahasa Indonesia.
- source_word: διατηροῦντες ἑαυτούς
  choice: Jika kalian menjaga diri
  rationale: Partisip Yunani secara wajar dapat menyatakan keadaan bersyarat; bentuk ini jelas dan alami tanpa mengubah hubungan maknanya.
- source_word: εὖ πράξετε
  choice: kalian akan berbuat baik
  rationale: Ungkapan ini menyatakan bahwa menaati petunjuk tersebut merupakan tindakan yang benar dan patut.
- source_word: ἔρρωσθε
  choice: Salam
  rationale: Dalam konteks penutup surat, imperatif ini berfungsi sebagai formula perpisahan, bukan terutama sebagai perintah harfiah untuk menjadi kuat atau sehat.
theological_decisions:
- issue: Makna πορνεία dalam keputusan para rasul
  choice: Diterjemahkan secara luas sebagai 'percabulan'.
  alternative: '''hubungan seksual yang tidak sah'' atau secara lebih khusus perkawinan terlarang menurut Imamat 18'
  rationale: Ayat ini sendiri tidak secara eksplisit membatasi istilah tersebut pada satu pelanggaran atau jenis hubungan tertentu; terjemahan utama mempertahankan keluasan leksikal dan catatan menjelaskan kemungkinan pembacaan yang lebih khusus.
- issue: Daya ungkap εὖ πράξετε
  choice: kalian akan berbuat baik
  alternative: kalian akan hidup baik atau sejahtera
  rationale: Konteks petunjuk mendukung pengertian evaluatif—melakukan yang patut—namun ungkapan Yunani dapat memiliki nuansa keadaan yang baik; terjemahan tidak memasukkan janji kemakmuran.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti 'kalian' dipakai karena verba Yunani berbentuk jamak. Struktur daftar dipertahankan, sedangkan partisip diterjemahkan sebagai kalimat bersyarat agar alami. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
