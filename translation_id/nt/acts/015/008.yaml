  source_fidelity: 'Terjemahan secara tepat mencerminkan unsur-unsur Yunani: Allah sebagai yang mengenal hati, tindakan-Nya memberi kesaksian kepada mereka, sarana kesaksian itu melalui pemberian Roh Kudus, serta perbandingan dengan pemberian kepada kita. Pronomina tetap tidak diperluas menjadi identifikasi kelompok tertentu, sesuai teks.'
  naturalness: Kalimatnya alami, jelas, dan sesuai ragam Bahasa Indonesia modern yang bermartabat. Pengulangan “kepada mereka” sesudah “Roh Kudus” memperjelas penerima tanpa mengubah makna. Elipsis pada “sama seperti kepada kita” dapat dipahami dengan wajar dari verba “memberikan.”
  terminology: “Allah,” “hati,” “memberi kesaksian,” dan “Roh Kudus” merupakan padanan baku dan tepat. “Yang mengenal hati” secara idiomatis menyampaikan καρδιογνώστης tanpa memaksakan bentuk harfiah yang janggal.
