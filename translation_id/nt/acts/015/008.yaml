id: ACT.15.8
reference: Acts 15:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: id
  text: Dan Allah, yang mengenal hati, memberi kesaksian kepada mereka dengan memberikan Roh Kudus kepada mereka, sama seperti kepada kita,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: yang mengenal hati
  rationale: Kata majemuk yang langka ini menyatakan bahwa Allah mengetahui batin manusia. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan gambaran 'hati' dari teks sumber.
- source_word: θεὸς
  choice: Allah
  rationale: Padanan baku bagi θεός dalam konteks ini; καρδιογνώστης menjelaskan sifat Allah.
- source_word: ἐμαρτύρησεν
  choice: memberi kesaksian
  rationale: 'Mempertahankan nuansa pembuktian atau peneguhan dalam argumen Petrus: Allah sendiri mengesahkan mereka melalui tindakan-Nya.'
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif ini menunjuk kepada kelompok yang dibicarakan dalam konteks; identitas mereka tidak ditambahkan secara eksplisit ke dalam ayat.
- source_word: δοὺς
  choice: dengan memberikan
  rationale: Partisip aoris ini paling wajar dipahami sebagai cara Allah memberi kesaksian. 'Dengan memberikan' menyatakan hubungan sarana tersebut dengan jelas.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan alami dalam bahasa Indonesia modern untuk gelar ini.
- source_word: καθὼς καὶ ἡμῖν
  choice: sama seperti kepada kita
  rationale: Ungkapan Yunani bersifat eliptis; tindakan 'memberikan Roh Kudus' tetap dipahami tanpa harus mengulanginya, sebagaimana dalam teks sumber.
theological_decisions:
- issue: Kesaksian Allah melalui pemberian Roh kepada mereka dan kepada kita
  choice: Mempertahankan pronomina 'mereka' dan 'kita' serta menyatakan bahwa pemberian Roh Kudus merupakan kesaksian Allah.
  alternative: Menjelaskan 'mereka' sebagai 'bangsa-bangsa bukan Yahudi' atau menambahkan kesimpulan teologis tentang status perjanjian mereka.
  rationale: Teks Yunani sendiri hanya memakai pronomina; rujukan dan implikasinya disediakan oleh konteks. Terjemahan tidak menambahkan penafsiran yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat mempertahankan hubungan antara sifat Allah sebagai pengenal hati, kesaksian-Nya, dan pemberian Roh Kudus. Pengulangan 'kepada mereka' setelah 'memberikan Roh Kudus' dipakai agar relasi penerimanya jelas dan alami.
