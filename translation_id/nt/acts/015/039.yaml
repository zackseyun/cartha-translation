  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: id
  text: Lalu timbullah perselisihan yang sangat tajam[a] sehingga mereka berpisah satu sama lain, dan Barnabas mengajak Markus lalu berlayar ke Siprus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertikaian yang tajam.” Kata Yunani ini dapat berarti provokasi yang kuat atau pertikaian hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Lalu timbullah
  rationale: Ungkapan ini secara alami memperkenalkan perkembangan baru dalam narasi; 'lalu' mempertahankan hubungan yang ringan tanpa memperkerasnya menjadi pertentangan eksplisit.
- source_word: παροξυσμὸς
  choice: perselisihan yang begitu tajam
  rationale: Dalam konteks ini kata tersebut menunjuk pada benturan kuat antara Paulus dan Barnabas. Pilihan ini jelas dalam bahasa Indonesia modern serta mempertahankan intensitasnya tanpa menambahkan penilaian moral.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: sehingga mereka berpisah satu sama lain
  rationale: Konstruksi ὥστε dengan infinitif menyatakan akibat; bentuk klausa ini menyampaikan hubungan tingkat-akibat secara alami.
- source_word: τόν τε Βαρναβᾶν
  choice: Barnabas
  rationale: τε menandai tindakan Barnabas sebagai bagian pertama dari dua tindakan yang timbul akibat perpisahan itu, dengan tindakan Paulus menyusul pada ayat berikutnya. Pemisahan menjadi kalimat baru tetap menjaga alur tersebut.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: membawa Markus bersamanya
  rationale: παραλαμβάνω di sini berarti membawa seseorang ikut serta. 'Bersamanya' menyatakan unsur 'mengajak serta' yang dapat hilang jika hanya diterjemahkan 'membawa'.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: lalu berlayar ke Siprus
  rationale: ἐκπλέω menyatakan keberangkatan melalui laut. 'Berlayar ke' terdengar alami dan tujuan keberangkatannya sudah jelas dari konteks.
theological_decisions:
- issue: Penggambaran konflik antara rekan-rekan pelayanan rasuli
  choice: perselisihan yang begitu tajam
  alternative: pertengkaran sengit
  rationale: Teks melaporkan benturan yang nyata dan kuat antara Barnabas dan Paulus. Terjemahan ini tidak melunakkan ketegangan tersebut, tetapi juga tidak menambahkan kesan permusuhan atau penilaian moral yang melampaui bukti leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis dan naratif ke ayat berikutnya.
