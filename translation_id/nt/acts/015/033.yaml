  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: id
  text: Setelah tinggal beberapa waktu di sana, mereka dilepas dengan damai oleh saudara-saudara[a] kepada orang-orang yang telah mengutus mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; bahasa Yunani memakai kata “saudara-saudara”, tetapi dalam konteks ini kemungkinan yang dimaksud ialah seluruh komunitas orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: setelah tinggal beberapa waktu di sana
  rationale: Ungkapan partisipial ini secara idiomatis berarti tinggal atau melewatkan suatu jangka waktu. Kata 'di sana' tidak tersurat dalam bahasa Yunani, tetapi wajar ditambahkan berdasarkan konteks keberadaan mereka di Antiokhia.
- source_word: δὲ
  choice: setelah
  rationale: δέ adalah penghubung naratif ringan. Dalam bahasa Indonesia, hubungan kelanjutan peristiwa sudah tersampaikan secara alami oleh konstruksi 'Setelah ...', sehingga tidak perlu diterjemahkan tersendiri sebagai 'dan'.
- source_word: ἀπελύθησαν
  choice: mereka dilepas
  rationale: Dalam konteks para utusan yang berpamitan dengan restu jemaat, 'dilepas' menyatakan keberangkatan yang baik tanpa kesan ditahan sebelumnya, seperti yang dapat ditimbulkan oleh 'dibebaskan'.
- source_word: μετ’ εἰρήνης
  choice: dengan damai
  rationale: Terjemahan ini mempertahankan ungkapan perpisahan yang menyiratkan kedamaian, kerukunan, dan maksud baik komunitas.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: oleh saudara-saudara
  rationale: Preposisi ἀπό bersama bentuk pasif menyatakan pihak yang melepas mereka. Bentuk maskulin jamak dipertahankan, sedangkan kemungkinan makna inklusif komunitas orang percaya dijelaskan dalam catatan kaki.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: untuk kembali kepada orang-orang yang telah mengutus mereka
  rationale: Partisipel berartikel menunjuk kepada pihak yang sebelumnya mengutus mereka. 'Kembali' tersirat oleh arah perjalanan menuju para pengutus dan membuat kalimat Indonesia alami, meskipun kata itu tidak dinyatakan secara terpisah dalam bahasa Yunani.
theological_decisions:
- issue: Cakupan inklusif ἀδελφοί
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Bentuk sumber secara gramatikal maskulin, tetapi dalam konteks Kisah Para Rasul kemungkinan menunjuk kepada komunitas orang percaya secara inklusif. Teks utama mempertahankan bentuk sumber, dan catatan kaki menjaga kemungkinan cakupan inklusifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk pasif, suasana damai dalam pelepasan, dan kemungkinan makna inklusif istilah kekerabatan.
