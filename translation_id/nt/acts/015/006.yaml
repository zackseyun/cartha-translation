  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: id
  text: Maka para rasul dan para penatua berkumpul untuk membahas persoalan ini.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhimpun” atau “mengadakan pertemuan”. Kata kerja Yunaninya secara bentuk bersifat pasif (“dikumpulkan”), tetapi dalam konteks ini lazim dipahami sebagai tindakan kelompok itu berkumpul.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk melihat mengenai perkataan ini”. Di sini “perkataan” berarti perkara atau persoalan yang sedang dibicarakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: berkumpul
  rationale: Bentuknya secara gramatikal adalah aoristus pasif dari συνάγω, tetapi dalam konteks ini secara wajar menyatakan bahwa kelompok itu berhimpun atau mengadakan pertemuan. “Berkumpul” alami dalam bahasa Indonesia dan tetap mempertahankan makna kolektifnya.
- source_word: τε
  choice: Maka
  rationale: Partikel τε menghubungkan ayat ini secara ringan dengan perselisihan yang disebut sebelumnya. “Maka” menyampaikan kelanjutan yang bersifat konsekuensial tanpa memberi tekanan berlebihan.
- source_word: οἱ ἀπόστολοι
  choice: para rasul
  rationale: Dalam Kisah Para Rasul, istilah ini menunjuk kepada para pemimpin yang dikenal sebagai rasul; “para rasul” merupakan padanan baku dan tepat dalam konteks ini.
- source_word: οἱ πρεσβύτεροι
  choice: para penatua
  rationale: Istilah ini menunjuk kepada para pemimpin jemaat yang diakui, bukan sekadar laki-laki berusia lanjut. “Para penatua” mempertahankan nuansa kelembagaan tanpa memasukkan struktur gerejawi dari masa yang lebih kemudian.
- source_word: ἰδεῖν
  choice: untuk membahas
  rationale: 'Secara harfiah berarti “untuk melihat”, tetapi di sini menyatakan tujuan deliberatif: menelaah dan mempertimbangkan suatu masalah bersama-sama. “Membahas” merupakan ungkapan Indonesia yang wajar dan tidak menyiratkan bahwa keputusan telah ditetapkan sebelumnya.'
- source_word: περὶ τοῦ λόγου τούτου
  choice: persoalan ini
  rationale: λόγος dapat berarti perkataan, pesan, atau perkara. Dalam konteks pertemuan ini, frasa tersebut menunjuk kepada persoalan yang diperdebatkan pada ayat sebelumnya; “persoalan ini” menyampaikan rujukan kontekstual tersebut dengan jelas.
theological_decisions:
- issue: Nuansa kelembagaan πρεσβύτεροι dalam pertemuan di Yerusalem
  choice: Diterjemahkan “para penatua” tanpa menetapkan bentuk tata gereja denominasi tertentu.
  alternative: “Para presbiter” sebagai jabatan teknis dalam struktur gereja yang berkembang kemudian.
  rationale: Ayat ini menyebut para pemimpin yang diakui dalam jemaat Yerusalem, tetapi tidak menetapkan bahwa jabatan mereka harus dipahami menurut struktur gerejawi dari masa kemudian.
- issue: Tujuan deliberatif pertemuan
  choice: Diterjemahkan “untuk membahas persoalan ini”, yang menunjukkan proses penelaahan bersama.
  alternative: “Untuk memutuskan persoalan ini” atau terjemahan harfiah “untuk melihat mengenai perkataan ini”.
  rationale: Infinitif ἰδεῖν dalam konteks ini menyatakan bahwa persoalan tersebut diambil untuk dipertimbangkan. “Membahas” tidak mendahului hasil pertemuan dan tidak mengaburkan fungsi deliberatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. “Para penatua” mempertahankan istilah gerejawi yang luas tanpa muatan denominasi khusus; “membahas persoalan ini” menyampaikan maksud deliberatif ungkapan Yunani dengan jelas.
