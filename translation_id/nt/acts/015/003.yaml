  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: id
  text: Karena itu, setelah dibantu oleh jemaat untuk melanjutkan perjalanan, mereka menempuh perjalanan melalui Fenisia dan Samaria sambil mengisahkan secara terperinci pertobatan orang-orang bukan Yahudi[a]. Mereka mendatangkan sukacita besar bagi semua saudara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berbaliknya orang-orang bukan Yahudi.”
    reason: lexical_alternative
  - marker: b
    text: “Saudara” di sini kemungkinan menunjuk pada sesama orang percaya secara umum, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: setelah dibantu oleh jemaat untuk melanjutkan perjalanan
  rationale: Bentuk partisip pasif προπέμπω menunjuk pada tindakan mengantar, membekali, atau membantu seseorang melanjutkan perjalanan. Pilihan ini mempertahankan nuansa bantuan perjalanan tanpa memastikan bahwa jemaat mengawal mereka secara fisik.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks Kisah Para Rasul, ἐκκλησία menunjuk pada komunitas orang percaya. “Jemaat” merupakan padanan Indonesia yang lazim dan tidak terutama menunjuk pada gedung.
- source_word: διήρχοντο
  choice: mereka menempuh perjalanan melalui
  rationale: Bentuk imperfek menggambarkan perjalanan yang berlangsung melalui wilayah-wilayah tersebut. Ungkapan ini alami dalam narasi perjalanan bahasa Indonesia.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: melalui Fenisia dan Samaria
  rationale: Konstruksi τε ... καί menghubungkan kedua wilayah dengan erat. Dalam bahasa Indonesia, satu kata “dan” sudah secara alami menyatakan bahwa keduanya dilalui.
- source_word: ἐκδιηγούμενοι
  choice: sambil mengisahkan secara terperinci
  rationale: Kata kerja majemuk ini menekankan penuturan yang lengkap atau terperinci; “mengisahkan secara terperinci” mempertahankan kekuatan tersebut.
- source_word: τὴν ἐπιστροφὴν
  choice: pertobatan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada tindakan berbalik kepada Allah. “Pertobatan” menyampaikan makna religiusnya secara jelas, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: τῶν ἐθνῶν
  choice: orang-orang bukan Yahudi
  rationale: Dalam perdebatan Kisah Para Rasul 15, istilah ini menunjuk pada mereka yang berasal dari luar bangsa Yahudi. Padanan ini lebih jelas bagi pembaca Indonesia modern daripada transliterasi “bangsa-bangsa lain” atau istilah “Gentil”.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: mendatangkan sukacita besar
  rationale: Ungkapan ποιέω dengan kata benda χαρά bersifat kausatif. Padanan ini idiomatis dan tetap dekat dengan susunan serta makna sumber.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: bagi semua saudara
  rationale: “Saudara” mempertahankan bentuk maskulin gramatikal ἀδελφοῖς, sementara kemungkinan bahwa kelompok itu mencakup perempuan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna ἐπιστροφή dalam penerimaan orang bukan Yahudi
  choice: pertobatan
  alternative: berbaliknya
  rationale: “Pertobatan” menyatakan bahwa orang-orang bukan Yahudi berbalik kepada Allah sebagai tanggapan terhadap pemberitaan Injil, tanpa merinci suatu sistem doktrinal yang tidak dinyatakan ayat ini. Alternatif yang lebih harfiah dicatat untuk menjaga citra geraknya.
- issue: Cakupan ἀδελφοί dalam komunitas orang percaya
  choice: saudara
  alternative: saudara-saudari; sesama orang percaya
  rationale: Teks utama mempertahankan bentuk yang bersesuaian dengan kata Yunani, tetapi catatan kaki menjelaskan bahwa dalam konteks komunitas Kristen bentuk jamak maskulin ini kemungkinan mencakup orang percaya laki-laki maupun perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan alur perjalanan, laporan tentang pertobatan, dan dampaknya atas jemaat, sambil menghindari istilah teknis yang kurang umum.
