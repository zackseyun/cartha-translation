id: ACT.15.17
reference: Acts 15:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: id
  text: agar sisa umat manusia mencari Tuhan, dan juga semua bangsa bukan Yahudi[a] yang disebut dengan nama-Ku[b]. Demikianlah firman Tuhan, Dia yang melakukan semua ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua bangsa.” Kata Yunani ἔθνη dapat berarti “bangsa-bangsa” atau “orang-orang bukan Yahudi.” Di sini dipilih “bangsa bukan Yahudi” karena sidang di Yerusalem sedang membahas penerimaan orang bukan Yahudi.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “yang atas mereka nama-Ku telah diserukan.” Ungkapan ini menunjukkan bahwa mereka dikenal sebagai milik Tuhan atau dikaitkan dengan nama-Nya.
    reason: lexical_alternative
  - marker: c
    text: Kalimat ini menggemakan Amos 9:12 dalam bentuk yang tercermin dalam Kitab Suci Yunani, yang menekankan bangsa-bangsa bukan Yahudi yang menyandang nama Tuhan.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: agar
  rationale: Mengungkapkan maksud atau hasil yang dituju secara alami dalam bahasa Indonesia tanpa menghilangkan daya telik konstruksi Yunani.
- source_word: ἐκζητήσωσιν
  choice: mencari
  rationale: Kata kerja ini dapat menyiratkan pencarian yang sungguh-sungguh, tetapi konteks tidak mengharuskan nuansa intensif itu dinyatakan secara eksplisit.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: orang-orang yang tersisa dari umat manusia
  rationale: Mempertahankan gagasan tentang mereka yang masih tersisa sekaligus menyatakan bahwa ἀνθρώπων merujuk secara umum kepada manusia, bukan khusus laki-laki.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk κύριος dalam kutipan Kitab Suci ini.
- source_word: καὶ πάντα τὰ ἔθνη
  choice: dan juga semua bangsa bukan Yahudi
  rationale: Dalam konteks sidang di Yerusalem, ἔθνη menunjuk terutama kepada bangsa-bangsa bukan Yahudi. 'Dan juga' mempertahankan hubungan tambahan yang dapat bernuansa penjelasan atau penegasan.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: yang disebut dengan nama-Ku
  rationale: Menyampaikan idiom kepemilikan atau pengenalan melalui nama ilahi dalam bahasa Indonesia yang alami; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: λέγει κύριος
  choice: Demikianlah firman Tuhan
  rationale: Formula kenabian yang mapan dan bermartabat dalam bahasa Indonesia, dengan fungsi yang sepadan dengan 'Tuhan berfirman' dalam konteks kutipan.
- source_word: ποιῶν ταῦτα
  choice: yang melakukan semua ini
  rationale: Mempertahankan hubungan partisipel dengan 'Tuhan' serta tindakan ilahi yang dinyatakan tanpa menambahkan penafsiran kausatif.
theological_decisions:
- issue: Makna ἔθνη dalam pembahasan penerimaan orang bukan Yahudi
  choice: bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Konteks langsung Kisah Para Rasul 15 menyoroti masuknya orang bukan Yahudi, sedangkan arti lebih luas 'bangsa-bangsa' tetap dicantumkan dalam catatan kaki.
- issue: Ungkapan nama ilahi yang diserukan atas suatu kelompok
  choice: yang disebut dengan nama-Ku
  alternative: yang atas mereka nama-Ku telah diserukan
  rationale: Pilihan utama menyatakan identitas dan kepunyaan tanpa menentukan lebih jauh mekanisme teologisnya; bentuk harfiah dipertahankan sebagai alternatif dalam catatan.
- issue: Hubungan antara kelompok 'yang tersisa' dan semua bangsa bukan Yahudi
  choice: dan juga
  alternative: yaitu
  rationale: καί dapat bersifat aditif atau epeksegetis. 'Dan juga' tetap dekat dengan bentuk Yunani dan tidak memutuskan bahwa kelompok kedua sepenuhnya identik dengan kelompok pertama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan corak kutipan kenabian, tetapi menghindari ungkapan yang terlalu harfiah dan sukar dipahami. Kapitalisasi “nama-Ku” mengikuti rujukan orang pertama kepada Tuhan.
