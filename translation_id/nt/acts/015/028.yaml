  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: id
  text: Sebab Roh Kudus dan kami memandang baik untuk tidak membebankan kepada kalian beban lebih lanjut selain hal-hal yang perlu ini:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab Roh Kudus dan kami telah memutuskan untuk tidak membebankan kepada kalian beban lebih lanjut selain hal-hal yang perlu ini.” Ungkapan Yunani juga dapat diterjemahkan sebagai rumusan keputusan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pokok-pokok penting ini” atau “ketentuan-ketentuan yang perlu ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: memandang baik
  rationale: Ungkapan ini mempertahankan idiom keputusan Yunani dan nada pertimbangan bersama, tanpa melemahkannya menjadi sekadar pendapat.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Roh Kudus
  rationale: Datif ini melengkapi ἔδοξεν dan menampilkan Roh Kudus sebagai pelaku pribadi yang menyetujui keputusan tersebut.
- source_word: καὶ ἡμῖν
  choice: dan kami
  rationale: Dikoordinasikan dengan 'Roh Kudus' sebagai pihak yang bersama-sama memandang keputusan itu baik.
- source_word: μηδὲν πλέον ... βάρος
  choice: beban yang lebih berat
  rationale: Mempertahankan bentuk perbandingan dan metafora kewajiban yang terkandung dalam βάρος.
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: membebankan kepada kalian
  rationale: Padanan Indonesia yang alami untuk tindakan menaruh atau mengenakan suatu beban kepada para penerima surat.
- source_word: πλὴν
  choice: daripada
  rationale: Dalam konstruksi negatif-komparatif ini, kata tersebut memperkenalkan batas atau pengecualian atas beban yang dikenakan.
- source_word: τούτων τῶν ἐπάναγκες
  choice: hal-hal yang perlu ini
  rationale: Menunjuk ke ketentuan-ketentuan pada ayat berikutnya sambil tetap dekat dengan ungkapan Yunani dan tidak menafsirkan sifatnya secara berlebihan.
theological_decisions:
- issue: Hubungan Roh Kudus dengan keputusan sidang
  choice: Roh Kudus dan para rasul/penatua ditampilkan bersama-sama memandang keputusan itu baik.
  alternative: Keputusan itu semata-mata kesepakatan manusia atau hanya hasil pengaruh impersonal.
  rationale: Susunan datif yang mengoordinasikan Roh Kudus dengan 'kami' dipertahankan tanpa mengurangi agensi pribadi Roh Kudus atau menyamakan kewenangan ilahi dan manusia secara spekulatif.
- issue: Daya ikat keputusan bagi orang percaya non-Yahudi
  choice: Tidak ada beban tambahan di luar hal-hal perlu yang kemudian disebutkan.
  alternative: Tidak ada kewajiban apa pun, atau seluruh hukum Musa diwajibkan.
  rationale: Terjemahan mempertahankan lingkup terbatas keputusan serta ketegangan antara 'beban' dan 'hal-hal yang perlu' tanpa memasukkan sistem teologis kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dan bermartabat. 'Kalian' memperjelas bahwa ὑμῖν berbentuk jamak; 'membebankan ... beban' sengaja mempertahankan metafora sumber meskipun terdapat pengulangan akar kata dalam bahasa Indonesia.
