source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: id
  text: Maka, setelah diberangkatkan[a], mereka turun[b] ke Antiokhia. Sesudah mengumpulkan orang banyak[c], mereka menyerahkan surat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah diizinkan pergi” atau “setelah dibubarkan.” Partisip Yunani ini dapat menunjuk pada pelepasan atau pemberangkatan secara resmi.
    reason: lexical_alternative
  - marker: b
    text: Kata “turun” mencerminkan arah dalam kata kerja Yunani, kemungkinan karena perjalanan itu dimulai dari Yerusalem yang letaknya lebih tinggi menuju Antiokhia.
    reason: cultural_note
  - marker: c
    text: Atau “perhimpunan” atau “jemaat.” Frasa ini menunjuk pada kelompok yang dikumpulkan di Antiokhia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: setelah diberangkatkan
  rationale: Partisip aoristus ini menunjukkan bahwa mereka secara resmi dilepas untuk berangkat. Pilihan ini sesuai dengan konteks pengutusan, sambil mempertahankan alternatif makna ‘dibubarkan’ atau ‘diizinkan pergi’ dalam catatan kaki.
- source_word: κατῆλθον
  choice: mereka turun
  rationale: Kata kerja ini mengandung arah turun, kemungkinan mencerminkan perjalanan dari Yerusalem yang lebih tinggi menuju Antiokhia. Ungkapan ‘turun’ mempertahankan nuansa geografis teks Yunani.
- source_word: συναγαγόντες
  choice: sesudah mengumpulkan
  rationale: Partisip aoristus menyatakan tindakan yang mendahului penyerahan surat. ‘Sesudah mengumpulkan’ menyampaikan urutan itu secara wajar dalam bahasa Indonesia.
- source_word: τὸ πλῆθος
  choice: orang banyak
  rationale: Pilihan ini cukup dekat dengan arti dasar frasa Yunani dan tidak langsung menetapkan bahwa kelompok tersebut merupakan sidang atau jemaat dalam arti teknis, meskipun konteksnya menunjuk pada kelompok yang berkumpul di Antiokhia.
- source_word: ἐπέδωκαν
  choice: mereka menyerahkan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penyerahan resmi surat kepada kelompok yang telah dikumpulkan. ‘Menyerahkan’ lebih tepat daripada ‘memberikan’ yang lebih umum.
- source_word: ἐπιστολήν
  choice: surat itu
  rationale: ‘Surat’ merupakan padanan modern dan alami; bentuk definit dalam bahasa Indonesia ditunjukkan dengan ‘itu’ karena surat tersebut sudah dikenal dari konteks sebelumnya.
theological_decisions:
- issue: Identitas τὸ πλῆθος
  choice: orang banyak
  alternative: jemaat; perhimpunan
  rationale: Teks tidak memakai istilah khusus ἐκκλησία di ayat ini. Terjemahan utama mempertahankan keluasan istilah, sedangkan kemungkinan bahwa yang dimaksud ialah jemaat atau perhimpunan dicatat tanpa memaksakan pengertian gerejawi teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat dipakai agar rangkaian partisip Yunani tetap jelas dan alami. ‘Maka’ menyampaikan fungsi penghubung οὖν, sedangkan unsur μὲν tidak diberi padanan tersendiri karena berfungsi sebagai penanda wacana dalam rangkaian narasi.
