  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: id
  text: Namun, beberapa orang dari golongan Farisi[a] yang telah percaya berdiri dan berkata, “Mereka harus disunat dan diperintahkan untuk menaati hukum Musa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sekte Farisi.” Kata Yunani di sini menunjuk pada suatu golongan atau aliran yang dikenal, bukan pada “bidah” dalam arti teknis yang berkembang kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: berdiri
  rationale: Dalam konteks pertemuan, verba ini secara alami menggambarkan tindakan berdiri untuk berbicara, tanpa menambahkan gagasan bahwa mereka memberontak atau menentang.
- source_word: τινες
  choice: beberapa orang
  rationale: Padanan Indonesia yang alami untuk pronomina jamak tak tentu; kata ini tidak menambahkan identitas yang tidak dinyatakan teks.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: dari golongan Farisi
  rationale: αἵρεσις di sini menunjuk pada kelompok atau aliran yang dikenal, bukan 'bidah' dalam arti teknis yang berkembang kemudian. 'Golongan' alami dan relatif netral dalam bahasa Indonesia.
- source_word: πεπιστευκότες
  choice: yang telah percaya
  rationale: Bentuk partisip perfek menyatakan tindakan percaya yang sudah terjadi dengan keadaan yang berlanjut. Bentuk verbal ini mempertahankan ketegangan bahwa mereka telah percaya tetapi tetap mengajukan tuntutan tersebut.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisip ini memperkenalkan isi perkataan mereka. Bentuk verba berurutan lebih alami dalam bahasa Indonesia daripada konstruksi harfiah 'sambil berkata'.
- source_word: δεῖ περιτέμνειν αὐτούς
  choice: Mereka harus disunat
  rationale: δεῖ menyatakan keharusan, sedangkan bentuk pasif dalam bahasa Indonesia dengan jelas menunjukkan bahwa 'mereka' adalah pihak yang menerima sunat dan menghindari subjek pelaku yang tidak disebutkan.
- source_word: παραγγέλλειν τε τηρεῖν
  choice: dan diperintahkan untuk menaati
  rationale: παραγγέλλειν memiliki daya perintah yang berwenang, dan τηρεῖν dalam konteks hukum berarti memelihara atau menaati. 'Menaati' merupakan ungkapan Indonesia yang alami untuk ketaatan pada hukum.
- source_word: τὸν νόμον Μωϋσέως
  choice: hukum Musa
  rationale: Padanan langsung dan lazim bagi konstruksi genitif Yunani, tanpa menggunakan istilah teknis yang kurang umum.
theological_decisions:
- issue: Makna αἵρεσις dalam konteks kelompok Yahudi
  choice: golongan
  alternative: sekte
  rationale: Istilah Yunani ini mengidentifikasi kelompok atau aliran Farisi yang diakui dalam Yudaisme, bukan bidah dalam arti gerejawi yang muncul kemudian. 'Golongan' menghindari konotasi negatif yang tidak wajib.
- issue: Daya aspek πεπιστευκότες
  choice: yang telah percaya
  alternative: yang menjadi orang percaya
  rationale: Terjemahan verbal mempertahankan tindakan percaya yang telah terjadi sekaligus ketegangan teologis bahwa orang-orang tersebut masih menuntut sunat dan ketaatan kepada hukum Musa.
- issue: Hubungan δεῖ dengan dua tuntutan
  choice: Mereka harus disunat dan diperintahkan untuk menaati hukum Musa
  alternative: Orang harus menyunat mereka dan memerintahkan mereka untuk menaati hukum Musa
  rationale: Struktur ini menyampaikan bahwa tuntutan mencakup sunat dan perintah menaati hukum, sambil membiarkan dasar atau sumber keharusan tetap tidak disebutkan seperti dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. 'Namun' menandai kontras δέ; 'golongan' dipilih sebagai istilah netral. Kutipan langsung membuat isi λέγοντες jelas. Penanda catatan kaki [a] ditempatkan setelah kalimat yang memuat istilah terkait.
