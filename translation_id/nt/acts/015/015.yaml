  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: id
  text: 'Dan perkataan para nabi sejalan dengan hal ini, seperti yang tertulis:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung yang wajar untuk melanjutkan uraian Yakobus dan memperkenalkan dukungan tambahan.
- source_word: τούτῳ
  choice: dengan hal ini
  rationale: Bentuk datif demonstratif menunjuk kembali secara luas kepada hal yang baru saja dibicarakan; ungkapan ini mempertahankan penekanan Yunani tanpa mempersempit acuannya.
- source_word: συμφωνοῦσιν
  choice: sejalan
  rationale: Menyatakan kesesuaian atau keselarasan. Dalam konteks perkataan nubuat yang bersesuaian dengan peristiwa atau pernyataan sebelumnya, 'sejalan' alami dalam bahasa Indonesia.
- source_word: οἱ λόγοι
  choice: perkataan
  rationale: Mengacu pada tuturan para nabi yang terdapat dalam teks Kitab Suci; 'perkataan' langsung, bermartabat, dan alami.
- source_word: τῶν προφητῶν
  choice: para nabi
  rationale: Genitif menyatakan bahwa perkataan itu berasal dari atau merupakan perkataan para nabi; konstruksi Indonesia 'perkataan para nabi' menyampaikan hubungan ini secara alami.
- source_word: καθὼς
  choice: seperti
  rationale: Memperkenalkan kutipan Kitab Suci sebagai sesuatu yang bersesuaian dengan pernyataan sebelumnya.
- source_word: γέγραπται
  choice: yang tertulis
  rationale: Bentuk perfect pasif merupakan formula pengantar kutipan Kitab Suci. Dalam konstruksi Indonesia 'seperti yang tertulis', aspek keadaan hasil—teks itu tetap tertulis—tersampaikan secara idiomatis.
theological_decisions:
- issue: Acuan τούτῳ dalam perkataan Yakobus
  choice: Dipertahankan secara luas sebagai 'hal ini', menunjuk kembali kepada perkara atau pernyataan sebelumnya tanpa menyebut tafsiran tertentu.
  alternative: Pertobatan bangsa-bangsa lain; pernyataan Petrus; atau rencana dan maksud Allah ini.
  rationale: Teks Yunani tidak menyebut acuan itu secara lebih khusus. Terjemahan tidak boleh mempersempitnya menjadi satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan awal 'dengan hal ini' dari bahasa Yunani diungkapkan secara alami sebagai 'sejalan dengan hal ini'. Tidak diperlukan catatan kaki karena kemungkinan datif 'dengan/kepada hal ini' tidak menghasilkan perbedaan makna yang berarti dalam ungkapan Indonesia ini.
