  terminology: “Paulus,” “Pamfilia,” “berkeras,” dan “membawa serta” tepat untuk register naratif formal. Catatan kaki tidak memakai “membelot,” yang dalam bahasa Indonesia dapat mengesankan pengkhianatan politik atau agama dan terlalu menafsirkan ἀποστάντα.
