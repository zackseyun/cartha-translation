  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: id
  text: Namun, Paulus berkeras bahwa mereka tidak boleh membawa serta orang ini, yang telah meninggalkan mereka di Pamfilia dan tidak ikut bersama mereka untuk pekerjaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang telah meninggalkan mereka dari Pamfilia”; frasa Yunani ini dapat menunjuk Pamfilia sebagai tempat ia meninggalkan mereka. Kata yang diterjemahkan “meninggalkan” juga dapat bernuansa lebih negatif, misalnya “meninggalkan mereka begitu saja.”
    reason: Menjelaskan kemungkinan fungsi ἀπὸ Παμφυλίας sebagai titik keberangkatan/perpisahan dan nuansa negatif potensial ἀποστάντα tanpa menguatkannya menjadi tuduhan “membelot.”
lexical_decisions:
- source_word: ἠξίου
  choice: berkeras
  rationale: Dalam konteks perselisihan ini, bentuk imperfek menyatakan pendirian Paulus yang kuat, bukan sekadar pertimbangan atau pilihan pribadi.
- source_word: ἀποστάντα
  choice: telah meninggalkan
  rationale: Partisip aoris ini menyatakan tindakan menjauh atau berpisah. 'Meninggalkan' alami dalam bahasa Indonesia dan tidak sekuat 'membelot'; kemungkinan nuansa yang lebih keras dicatat dalam catatan kaki.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: meninggalkan mereka di Pamfilia
  rationale: Dua frasa ἀπό menyatakan perpisahan dari mereka yang berlangsung atau bermula di Pamfilia. Susunan ini menghindari ungkapan Indonesia yang janggal tanpa menghilangkan hubungan geografisnya.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: tidak ikut bersama mereka
  rationale: Ungkapan ini secara alami menyatakan bahwa orang tersebut tidak meneruskan perjalanan bersama mereka.
- source_word: εἰς τὸ ἔργον
  choice: dalam pekerjaan itu
  rationale: Menjaga ungkapan konkret 'pekerjaan itu' tanpa mempersempitnya secara interpretatif menjadi 'misi'; 'dalam' menghasilkan hubungan idiomatis dengan tindakan ikut serta.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: agar mereka tidak membawa serta orang yang
  rationale: Infinitif negatif bergantung pada pendirian Paulus dan menyatakan apa yang menurutnya tidak boleh dilakukan. 'Membawa serta' mencerminkan tindakan mengikutsertakan seseorang dalam perjalanan; demonstratif τοῦτον dinyatakan secara alami melalui klausa relatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai pertentangan; 'berkeras' menyampaikan kuatnya pendirian Paulus. Susunan kalimat dibuat wajar bagi pembaca umum sambil mempertahankan ambiguitas leksikal dan geografis melalui catatan kaki.
