  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: id
  text: Seluruh jemaat itu pun terdiam, lalu mereka mendengarkan Barnabas dan Paulus menceritakan segala sesuatu yang telah Allah lakukan—tanda dan keajaiban—di antara bangsa-bangsa bukan Yahudi melalui mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara bangsa-bangsa.” Dalam konteks sidang di Yerusalem, kata Yunani ini secara khusus menunjuk kepada bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: pun terdiam
  rationale: Aoristus ini menyatakan peralihan ke keadaan diam dalam alur cerita; “pun terdiam” alami dan mempertahankan daya peristiwanya.
- source_word: πᾶν τὸ πλῆθος
  choice: seluruh jemaat itu
  rationale: Dalam konteks pertemuan di Yerusalem, frasa ini menunjuk kepada keseluruhan kelompok yang berkumpul; “jemaat” lebih sesuai dengan suasana pertemuan umat daripada “orang banyak,” tanpa menyiratkan badan kelembagaan tertentu.
- source_word: ἤκουον
  choice: mereka mendengarkan
  rationale: Bentuk imperfek menggambarkan kegiatan mendengar yang sedang berlangsung dan penuh perhatian; “mendengarkan” menyampaikan unsur aktif tersebut.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Barnabas dan Paulus
  rationale: Nama pribadi mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἐξηγουμένων
  choice: menceritakan
  rationale: Partisip ini berarti menyampaikan atau menguraikan suatu laporan. “Menceritakan” jelas dan alami serta tidak menambahkan kesan penafsiran yang dapat timbul dari “menjelaskan.”
- source_word: ὅσα ... σημεῖα καὶ τέρατα
  choice: segala tanda dan keajaiban yang
  rationale: Susunan ini menerjemahkan ὅσα secara idiomatis sekaligus mengaitkannya langsung dengan “tanda dan keajaiban,” sehingga tidak memberi kesan adanya kelompok tindakan lain yang tidak disebutkan.
- source_word: ἐποίησεν ὁ θεὸς
  choice: yang telah dilakukan Allah
  rationale: Allah tetap menjadi subjek pelaku. Bentuk “telah dilakukan” menunjukkan bahwa perbuatan-perbuatan itu mendahului laporan Barnabas dan Paulus.
- source_word: σημεῖα καὶ τέρατα
  choice: tanda dan keajaiban
  rationale: Pasangan istilah khas Lukas ini dipertahankan secara langsung tanpa menambahkan kata “mukjizat,” yang tidak dinyatakan tersendiri dalam teks.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks sidang Yerusalem, ἔθνη secara khusus menunjuk kepada berbagai bangsa non-Yahudi. Ungkapan ini jelas bagi pembaca Indonesia dan tetap mempertahankan unsur jamak “bangsa-bangsa.”
- source_word: δι’ αὐτῶν
  choice: melalui mereka
  rationale: 'διά dengan genitif menyatakan perantaraan: Allah adalah pelaku utama, sedangkan Barnabas dan Paulus menjadi sarana yang dipakai-Nya.'
theological_decisions:
- issue: Pelaku utama dalam misi dan tanda-tanda
  choice: Allah melakukan tanda dan keajaiban melalui Barnabas dan Paulus.
  alternative: Barnabas dan Paulus dipahami sebagai pelaku utama tanda dan keajaiban itu.
  rationale: Tata bahasa Yunani menempatkan ὁ θεὸς sebagai subjek ἐποίησεν, sedangkan δι’ αὐτῶν menandai Barnabas dan Paulus sebagai perantara. Terjemahan mempertahankan penekanan ini tanpa meniadakan keterlibatan nyata mereka.
- issue: Cakupan ἔθνεσιν dalam konteks Kisah Para Rasul 15
  choice: Bangsa-bangsa bukan Yahudi
  alternative: Bangsa-bangsa
  rationale: Konteks perundingan Yerusalem menunjukkan bahwa yang dibicarakan adalah orang-orang dari bangsa non-Yahudi, tetapi arti leksikal yang lebih umum tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil menjaga urutan naratif, tindakan mendengarkan yang berlangsung, serta peranan Allah sebagai pelaku utama.
