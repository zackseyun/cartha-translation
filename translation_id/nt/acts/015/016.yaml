id: ACT.15.16
reference: Acts 15:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: id
  text: Sesudah itu Aku akan kembali, lalu Aku akan membangun kembali kemah Daud yang telah roboh[a]. Reruntuhannya akan Kubangun kembali, dan kemah itu akan Kupulihkan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kemah” juga dapat berarti “tabernakel”.
    reason: lexical_alternative
  - marker: b
    text: “Kemah Daud” adalah metafora nubuat bagi pemulihan yang berkaitan dengan garis keturunan atau kerajaan Daud.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan temporal ini diterjemahkan secara alami dalam bahasa Indonesia; bentuk 'itu' dapat merujuk secara kolektif pada hal-hal yang baru disebut tanpa harus dibuat kaku menjadi 'sesudah hal-hal ini'.
- source_word: ἀναστρέψω
  choice: Aku akan kembali
  rationale: Dalam konteks ini verba tersebut menyatakan kembali atau datang kembali, sambil mempertahankan janji ilahi dalam persona pertama.
- source_word: ἀνοικοδομήσω
  choice: akan membangun kembali / akan Kubangun kembali
  rationale: Verba majemuk ini berarti membangun lagi. Variasi susunan pronominal mengikuti kelancaran bahasa Indonesia tanpa mengubah makna.
- source_word: σκηνὴν Δαυὶδ
  choice: kemah Daud
  rationale: σκηνή secara harfiah berarti kemah dan dapat pula dipakai bagi tabernakel. 'Kemah' mempertahankan metafora sumber tanpa langsung menafsirkannya sebagai wangsa atau kerajaan Daud.
- source_word: τὴν πεπτωκυῖαν
  choice: yang telah roboh
  rationale: Partisip perfek menyatakan keadaan yang dihasilkan oleh kejatuhan; 'telah roboh' alami untuk sebuah kemah dan mempertahankan aspek hasilnya.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: reruntuhannya
  rationale: Partisip pasif netral jamak menunjuk secara kolektif pada bagian-bagian yang telah dirobohkan. 'Reruntuhannya' menyampaikan gambaran itu dengan ringkas dan alami.
- source_word: ἀνορθώσω
  choice: akan Kupulihkan
  rationale: Verba ini dapat berarti menegakkan kembali atau memulihkan. Dalam paralelisme pembangunan kembali, 'memulihkan' menyampaikan hasil restorasi tanpa menghapus citra bangunan.
- source_word: αὐτήν
  choice: kemah itu
  rationale: Pronomina tersebut merujuk kembali kepada σκηνή. Pengulangan 'kemah itu' memperjelas acuannya dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis 'kemah Daud'
  choice: Mempertahankan metafora sebagai 'kemah Daud'.
  alternative: wangsa Daud; kerajaan Daud yang telah runtuh
  rationale: Kutipan nubuat itu mengarah pada pemulihan yang berkaitan dengan garis keturunan atau kerajaan Daud, tetapi teks Yunani sendiri mempertahankan metafora kemah. Terjemahan utama tidak menggantinya dengan suatu tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kapitalisasi pronomina persona pertama yang mengacu kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan klausa mempertahankan pengulangan restoratif teks Yunani.
