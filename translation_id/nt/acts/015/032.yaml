  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: id
  text: Yudas dan Silas, yang keduanya adalah nabi, dengan banyak perkataan menguatkan saudara-saudara[a] dan meneguhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang diterjemahkan “saudara-saudara” dapat merujuk pada seluruh komunitas orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: Yudas dan Silas
  rationale: Menggunakan bentuk nama yang baku dalam Perjanjian Baru bahasa Indonesia; τε καὶ dinyatakan secara alami dengan “dan”.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: yang juga adalah nabi
  rationale: Mencerminkan penekanan καὶ αὐτοὶ bahwa Yudas dan Silas sendiri juga memiliki peran sebagai nabi, dalam susunan Indonesia yang wajar.
- source_word: διὰ λόγου πολλοῦ
  choice: menyampaikan banyak perkataan
  rationale: Mempertahankan gambaran harfiah tentang pelayanan lisan yang panjang atau banyak, sekaligus menghubungkannya secara alami dengan tindakan berikutnya.
- source_word: παρεκάλεσαν
  choice: menguatkan hati
  rationale: Dalam konteks pelayanan kepada jemaat, παρακαλέω mencakup dorongan dan penghiburan. “Menguatkan hati” alami dalam bahasa Indonesia dan tetap berbeda dari tindakan meneguhkan pada klausa berikutnya.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara
  rationale: Padanan langsung dan lazim bagi bentuk maskulin jamak ἀδελφοὺς. Catatan kaki menjelaskan bahwa istilah ini dapat mencakup seluruh komunitas orang percaya.
- source_word: ἐπεστήριξαν
  choice: meneguhkan mereka
  rationale: Menyatakan tindakan membuat mereka lebih teguh atau mantap dan mempertahankan perbedaannya dari παρακαλέω.
theological_decisions:
- issue: Cakupan τοὺς ἀδελφοὺς dalam konteks komunitas campuran
  choice: saudara-saudara
  alternative: saudara-saudari; orang-orang percaya
  rationale: Teks Yunani memakai bentuk maskulin jamak, tetapi dalam pemakaian Kristen mula-mula bentuk tersebut dapat merujuk secara representatif kepada seluruh komunitas orang percaya. Teks utama mempertahankan bentuk sumber, sementara catatan menjelaskan kemungkinan cakupan inklusifnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir bagi pembaca umum sambil mempertahankan dua tindakan yang berbeda: menguatkan hati dan meneguhkan.'
