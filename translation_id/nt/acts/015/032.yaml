  naturalness: Teks revisi memakai susunan bahasa Indonesia baku dan alami. “Dengan banyak perkataan” menyatakan sarana pelayanan lisan yang cukup panjang, sementara “menguatkan” dan “meneguhkan” mempertahankan dua tindakan berbeda tanpa tambahan “hati” yang tidak ada dalam teks.
