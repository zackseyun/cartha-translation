  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: id
  text: Sebaliknya, kita percaya bahwa melalui anugerah Tuhan Yesus kita akan diselamatkan, sama seperti mereka juga akan diselamatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sebaliknya, melalui anugerah Tuhan Yesus kita percaya bahwa kita akan diselamatkan, dengan cara yang sama seperti mereka juga.”'
    reason: Menunjukkan susunan konstruksi infinitif Yunani dan elipsis predikat “akan diselamatkan” pada bagian akhir.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan kuat dengan kuk yang tidak sanggup ditanggung dalam ayat sebelumnya; lebih tegas daripada sekadar “tetapi” dalam konteks ini.
- source_word: διὰ τῆς χάριτος
  choice: melalui anugerah
  rationale: διά dengan genitif menyatakan sarana; “melalui” mempertahankan nuansa instrumental itu secara alami.
- source_word: χάριτος
  choice: anugerah
  rationale: Istilah baku dan wajar untuk kemurahan ilahi yang menjadi sarana keselamatan dalam konteks ini.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Genitif ini menerangkan anugerah sebagai anugerah yang berasal dari atau diberikan oleh Tuhan Yesus.
- source_word: πιστεύομεν
  choice: kita percaya
  rationale: Menyatakan keyakinan para rasul dan orang percaya Yahudi; “kita” sesuai bagi kelompok pembicara yang mencakup pendengar.
- source_word: σωθῆναι
  choice: bahwa kita diselamatkan
  rationale: Infinitif aoris pasif sesudah πιστεύομεν dialihkan menjadi klausa isi yang alami dalam bahasa Indonesia. Bentuk tanpa penanda waktu eksplisit tidak memaksakan apakah fokusnya kini atau kelak.
- source_word: καθ’ ὃν τρόπον
  choice: sama seperti
  rationale: Mengungkapkan perbandingan cara secara ringkas dan idiomatis.
- source_word: κἀκεῖνοι
  choice: mereka juga
  rationale: 'Mempertahankan καί dalam bentuk gabungan κἀκεῖνοι dan arah perbandingan Yunani: “kita” diselamatkan sebagaimana “mereka” juga.'
theological_decisions:
- issue: Arah perbandingan dalam perkataan Petrus
  choice: “Kita” (orang Yahudi) diselamatkan sama seperti “mereka juga” (bangsa-bangsa lain).
  alternative: Mereka akan diselamatkan sama seperti kita.
  rationale: Susunan Yunani menjadikan keselamatan kelompok “kita” sebagai pokok yang dibandingkan dengan kelompok “mereka”; hal ini menegaskan bahwa bangsa-bangsa lain tidak harus menjadi Yahudi.
- issue: Waktu keselamatan dalam σωθῆναι
  choice: “kita diselamatkan” tanpa penanda waktu tambahan
  alternative: “kita akan diselamatkan”
  rationale: Infinitif aoris tidak dengan sendirinya menandai waktu mendatang. Bahasa Indonesia memungkinkan ungkapan alami yang mempertahankan ketidakjelasan waktu tersebut.
- issue: Keselamatan melalui anugerah
  choice: Menyatakan bahwa keselamatan berlangsung melalui anugerah Tuhan Yesus tanpa perluasan rumusan doktrinal.
  alternative: Menambahkan formula seperti “hanya oleh anugerah melalui iman saja”.
  rationale: Ayat menyebut anugerah dan keyakinan, tetapi terjemahan tidak boleh memasukkan rumusan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anugerah” dipilih sebagai istilah yang luas dipahami; susunan kalimat dibuat alami sambil mempertahankan arah perbandingan Yunani dan ketidakjelasan waktu pada infinitif aoris.
