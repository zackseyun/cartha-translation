revisions:
- from: Ketika timbul perselisihan dan perdebatan yang tidak kecil[a] antara Paulus dan Barnabas dengan mereka, ditetapkanlah bahwa Paulus dan Barnabas serta beberapa orang lain dari antara mereka harus pergi naik[b] ke Yerusalem untuk menemui para rasul dan para penatua mengenai persoalan ini.[c]
  to: Setelah timbul perselisihan dan perdebatan yang tidak kecil[a] antara Paulus dan Barnabas dan mereka, ditetapkanlah agar Paulus dan Barnabas serta beberapa orang lain dari antara mereka naik[b] ke Yerusalem kepada para rasul dan para penatua mengenai persoalan ini.[c]
  rationale: Revisi memperbaiki sintaks Indonesia pada penyebutan pihak-pihak yang berselisih, menghilangkan tambahan makna "menemui," dan memakai "naik ke Yerusalem" yang lebih idiomatis. Makna temporal, penekanan litotes, ketidakjelasan pelaku penetapan, serta istilah kepemimpinan dalam sumber tetap dipertahankan.
