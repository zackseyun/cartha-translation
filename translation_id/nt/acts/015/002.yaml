id: ACT.15.2
reference: Acts 15:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: id
  text: Setelah timbul perselisihan dan perdebatan yang tidak kecil[a] antara Paulus dan Barnabas dan mereka, ditetapkanlah agar Paulus dan Barnabas serta beberapa orang lain dari antara mereka naik[b] ke Yerusalem kepada para rasul dan para penatua mengenai persoalan ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perselisihan dan perdebatan yang cukup besar.” Bahasa Yunani memakai ungkapan “tidak kecil” untuk menegaskan betapa seriusnya perselisihan itu.
    reason: lexical_alternative
  - marker: b
    text: “Naik” merupakan ungkapan Yunani yang lazim dipakai untuk perjalanan menuju Yerusalem.
    reason: cultural_note
  - marker: c
    text: Atau “mengenai perkara ini” atau “mengenai pertanyaan yang diperdebatkan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Ketika timbul
  rationale: Konstruksi genitif absolut menyatakan keadaan temporal yang mengantar kepada tindakan utama. “Ketika timbul” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan waktunya.
- source_word: στάσεως καὶ ζητήσεως
  choice: perselisihan dan perdebatan
  rationale: στάσις menunjukkan pertentangan yang serius, sedangkan ζήτησις menunjuk pada perdebatan atau adu pendapat. Pasangan ini membedakan konflik relasional dari pembahasannya secara verbal.
- source_word: οὐκ ὀλίγης
  choice: yang tidak kecil
  rationale: Ungkapan litotes Yunani dipertahankan agar penekanan retoris pada besarnya perselisihan dan perdebatan tidak hilang.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: antara Paulus dan Barnabas dengan mereka
  rationale: Ungkapan ini menyebut pihak-pihak yang terlibat. “Mereka” secara kontekstual mengacu kepada orang-orang dari Yudea pada ayat sebelumnya tanpa menambahkan kadar permusuhan yang tidak dinyatakan teks.
- source_word: ἔταξαν
  choice: ditetapkanlah
  rationale: τάσσω di sini menyatakan penetapan atau pengaturan perjalanan para utusan. Bentuk pasif bahasa Indonesia mempertahankan kenyataan bahwa pelaku verba jamak tidak disebutkan secara eksplisit dalam ayat ini dan menghindari rujukan pronomina yang membingungkan.
- source_word: ἀναβαίνειν
  choice: pergi naik
  rationale: Terjemahan ini mempertahankan idiom geografis yang lazim bagi perjalanan menuju Yerusalem.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: beberapa orang lain dari antara mereka
  rationale: Frasa ini menunjukkan bahwa ada utusan tambahan yang dipilih dari kelompok setempat, tanpa menentukan jenis kelamin atau jabatan mereka lebih jauh.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: para rasul dan para penatua
  rationale: Kedua istilah tersebut merupakan sebutan yang sudah dikenal dalam Kisah Para Rasul dan diterjemahkan dengan padanan Indonesia yang baku.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: mengenai persoalan ini
  rationale: ζήτημα menunjuk pada pokok yang sedang dipersoalkan. “Persoalan” jelas, wajar, dan tetap membuka kemungkinan nuansa “perkara” atau “pertanyaan yang diperdebatkan.”
theological_decisions:
- issue: Identitas pihak-pihak dalam perselisihan
  choice: Perselisihan dinyatakan terjadi antara Paulus dan Barnabas dengan “mereka,” yang dalam konteks merujuk kepada orang-orang dari Yudea.
  alternative: Paulus dan Barnabas berselisih dan berdebat dengan mereka.
  rationale: Pilihan ini mengikuti struktur narasi dan tidak memasukkan kesimpulan doktrinal tentang sifat atau kewenangan masing-masing pihak.
- issue: Pelaku penetapan para utusan
  choice: Dipakai bentuk pasif “ditetapkanlah” karena teks ayat ini tidak menyebut pelaku verba secara eksplisit.
  alternative: Jemaat menetapkan; mereka menetapkan.
  rationale: Konteks dapat menunjukkan komunitas setempat sebagai pelaku, tetapi bentuk pasif menghindari penambahan eksplisit “jemaat” serta mencegah “mereka” disalahpahami sebagai orang-orang dari Yudea.
- issue: Nuansa kelembagaan dalam ἔταξαν
  choice: Penetapan dipahami sebagai keputusan teratur untuk mengutus wakil-wakil.
  alternative: Mereka memutuskan; mereka mengatur.
  rationale: “Ditetapkanlah” mencerminkan tindakan kolektif yang terarah, tetapi tidak menetapkan bentuk tata gereja tertentu yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat mudah diikuti, sementara litotes “tidak kecil,” idiom perjalanan “pergi naik,” serta ketidakjelasan eksplisit mengenai pelaku penetapan tetap dipertahankan.
