  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: id
  text: Karena kami telah mendengar bahwa beberapa orang dari antara kami, yang tidak kami beri instruksi apa pun[b], telah pergi dan meresahkan kalian dengan perkataan mereka, mengacaukan jiwa kalian[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jiwa kalian” menerjemahkan istilah Yunani yang dapat menunjuk pada diri batiniah atau kehidupan seseorang secara menyeluruh, bukan hanya perasaan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “yang tidak kami beri perintah apa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Karena
  rationale: Memperkenalkan alasan yang mendasari pernyataan surat dan mempertahankan daya kausalnya secara wajar dalam bahasa Indonesia.
- source_word: ἠκούσαμεν
  choice: kami telah mendengar
  rationale: Menyampaikan laporan yang sudah diterima dan tetap relevan pada saat surat ditulis.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: beberapa orang dari antara kami telah pergi
  rationale: Menjaga keterangan asal mereka dari kelompok di Yerusalem sekaligus menyatakan kepergian mereka secara alami.
- source_word: ἐτάραξαν
  choice: meresahkan
  rationale: Mengungkapkan timbulnya kegelisahan atau kekacauan tanpa mempersempitnya menjadi emosi tertentu saja.
- source_word: λόγοις
  choice: dengan perkataan mereka
  rationale: Menunjukkan bahwa gangguan itu ditimbulkan melalui apa yang mereka katakan; pronomina 'mereka' tersirat jelas dari pelaku dalam konteks.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: mengguncangkan batin kalian
  rationale: ἀνασκευάζω di sini menyatakan tindakan mengacaukan atau meruntuhkan keteguhan, sedangkan ψυχή menunjuk pada diri batiniah, bukan hanya emosi atau 'jiwa' sebagai bagian terpisah.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: padahal kami tidak memberi mereka perintah apa pun
  rationale: Menegaskan bahwa orang-orang tersebut tidak bertindak atas arahan para pengirim surat. 'Padahal' membuat hubungan relatif Yunani terbaca alami tanpa mengubah penyangkalan otorisasi.
theological_decisions:
- issue: Apakah ketiadaan otorisasi apostolik perlu dinyatakan secara eksplisit
  choice: kami tidak memberi mereka perintah apa pun
  alternative: kami tidak memberi mereka petunjuk apa pun
  rationale: διαστέλλομαι menyatakan pemberian perintah atau arahan. Pilihan ini mempertahankan penyangkalan tegas bahwa orang-orang itu diutus dengan mandat dari jemaat dan para rasul di Yerusalem.
- issue: Cara menerjemahkan τὰς ψυχὰς ὑμῶν
  choice: batin kalian
  alternative: jiwa kalian
  rationale: Dalam konteks ini ψυχή menunjuk pada diri atau kehidupan batin orang-orang yang diguncangkan. 'Batin' lebih alami dalam bahasa Indonesia dan menghindari kesan bahwa teks sedang menetapkan pembagian antropologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan pastoral. 'Kalian' dipakai untuk menyatakan bentuk jamak orang kedua secara jelas. Susunan kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan bagian pembuka dari kalimat surat yang berlanjut ke ayat berikutnya.
