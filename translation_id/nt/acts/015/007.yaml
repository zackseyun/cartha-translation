  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: id
  text: Setelah terjadi banyak perdebatan, Petrus berdiri dan berkata kepada mereka, “Saudara-saudara, kalian tahu bahwa sejak dahulu Allah telah memilih saya dari antara kalian, supaya melalui mulut saya bangsa-bangsa bukan Yahudi mendengar berita Injil dan percaya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: setelah terjadi perdebatan panjang
  rationale: Genitif absolut menyatakan keadaan yang mendahului tindakan Petrus. “Perdebatan panjang” menyampaikan pembahasan serius dan berkepanjangan tanpa harus menyiratkan permusuhan.
- source_word: ἀναστὰς
  choice: berdiri
  rationale: Partisip aoris ini menyatakan tindakan Petrus sebelum berbicara; “berdiri” alami dan konkret dalam bahasa Indonesia.
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan konvensional ini bernuansa kekeluargaan. Bentuk Indonesia tersebut wajar, bermartabat, dan tidak perlu menambahkan kata “laki-laki” yang akan terasa kaku.
- source_word: ἐπίστασθε
  choice: kalian tahu
  rationale: Kata kerja ini menunjuk pada pengetahuan yang telah dimiliki para pendengar. “Kalian tahu” merupakan padanan langsung dan alami.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: sejak dahulu
  rationale: Ungkapan ini menunjuk pada masa sebelumnya yang dikenal para pendengar. “Sejak dahulu” mempertahankan acuan temporal tanpa memberi kesan zaman purbakala.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini menunjukkan lingkungan kelompok tempat pilihan Allah dinyatakan; terjemahan ini mempertahankan bentuk Yunani tanpa mempertegas secara berlebihan bahwa Petrus dipilih dari kelompok itu.
- source_word: ἐξελέξατο
  choice: memilih
  rationale: Padanan langsung bagi bentuk medial ἐκλέγομαι yang berarti memilih atau menetapkan pilihan.
- source_word: διὰ τοῦ στόματός μου
  choice: melalui mulut saya
  rationale: Terjemahan ini mempertahankan gambaran konkret bahwa Petrus menjadi sarana penyampaian lisan, alih-alih meratakannya menjadi sekadar “melalui saya”.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks sidang Yerusalem, istilah ini merujuk kepada orang-orang dari bangsa non-Yahudi. Ungkapan ini lebih langsung dipahami pembaca Indonesia daripada kata serapan yang mungkin kurang umum.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: firman Injil
  rationale: “Firman” mempertahankan bobot λόγος sebagai pesan yang diberitakan, sedangkan “Injil” menyampaikan εὐαγγέλιον secara ringkas dan mapan.
- source_word: πιστεῦσαι
  choice: percaya
  rationale: Infinitif ini sejajar dengan “mendengar”; “percaya” merupakan terjemahan paling langsung tanpa menambahkan rumusan teologis lain.
theological_decisions:
- issue: Cakupan sapaan maskulin Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudara laki-laki; Bapak-bapak dan saudara-saudara
  rationale: Bahasa Indonesia lazim memakai “Saudara-saudara” sebagai sapaan kelompok. Pilihan ini mempertahankan nada kekeluargaan tanpa menambahkan kepastian mengenai komposisi seluruh hadirin.
- issue: Makna τὰ ἔθνη dalam konteks sejarah keselamatan
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa; orang-orang bukan Yahudi
  rationale: Konteks Kisah Para Rasul 15 berfokus pada masuknya orang non-Yahudi ke dalam umat Allah. Pilihan ini menyatakan referennya dengan jelas sambil mempertahankan unsur kolektif “bangsa-bangsa”.
- issue: Hubungan ἐν ὑμῖν dengan tindakan memilih
  choice: Allah memilih di antara kalian
  alternative: Allah memilih saya dari antara kalian; Allah menetapkan di tengah-tengah kalian
  rationale: Teks Yunani tidak menyebut objek “saya” secara eksplisit meskipun konteks dan frasa “melalui mulut saya” mengarah kepada Petrus. Terjemahan utama mempertahankan susunan dan ketegangan itu tanpa memasukkan objek tersirat ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kalian” dipakai karena Petrus menyapa kelompok yang sudah dikenalnya dan bentuk ini membedakan jamak secara jelas; “saya” menjaga kesopanan dalam forum musyawarah. Tidak ada catatan kaki karena alternatif penting dapat ditangani tanpa mengganggu atau menambah teks utama.
