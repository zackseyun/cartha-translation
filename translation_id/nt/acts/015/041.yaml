  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: id
  text: Lalu ia melakukan perjalanan melalui Suriah dan Kilikia sambil menguatkan jemaat-jemaat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: menjelajahi
  rationale: Bentuk imperfek menunjukkan perjalanan yang berlangsung melintasi beberapa wilayah. 'Menjelajahi' secara alami menyampaikan gerak melalui wilayah-wilayah itu tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan alur cerita; 'Lalu' wajar dalam narasi bahasa Indonesia.
- source_word: Συρίαν
  choice: Siria
  rationale: Bentuk nama wilayah yang baku dalam bahasa Indonesia.
- source_word: Κιλικίαν
  choice: Kilikia
  rationale: Bentuk nama wilayah yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἐπιστηρίζων
  choice: sambil menguatkan
  rationale: Partisipel ini menyatakan tindakan yang menyertai perjalanan, yaitu meneguhkan dan membuat komunitas orang percaya semakin kokoh; 'menguatkan' mempertahankan cakupan makna tanpa membatasinya pada dorongan emosional.
- source_word: τὰς ἐκκλησίας
  choice: jemaat-jemaat
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk pada komunitas-komunitas Kristen setempat. Bentuk jamak 'jemaat-jemaat' jelas dan alami dalam bahasa Indonesia.
