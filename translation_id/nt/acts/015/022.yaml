  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: id
  text: Kemudian, para rasul dan para penatua, bersama seluruh jemaat, menganggap baik untuk memilih beberapa laki-laki dari antara mereka dan mengutus mereka ke Antiokhia bersama Paulus dan Barnabas, yaitu Yudas, yang disebut Barsabas, dan Silas, laki-laki yang memimpin di antara saudara-saudara seiman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara seiman” di sini kemungkinan besar merujuk kepada komunitas orang percaya secara luas, termasuk perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: menganggap baik
  rationale: Menyampaikan penilaian bersama dalam konteks musyawarah tanpa memperkerasnya menjadi keputusan resmi semata.
- source_word: πρεσβυτέροις
  choice: para penatua
  rationale: Padanan baku dan wajar dalam konteks kepemimpinan jemaat.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: bersama seluruh jemaat
  rationale: Menunjukkan keterlibatan seluruh komunitas Kristen yang berkumpul, tanpa memasukkan model tata gereja tertentu.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: memilih beberapa orang dari antara mereka
  rationale: Bahasa Indonesia memerlukan objek yang alami; 'beberapa orang' merujuk kepada laki-laki yang kemudian disebutkan namanya, sedangkan 'dari antara mereka' mempertahankan asal para utusan dari komunitas itu sendiri.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: mengutus mereka ke Antiokhia
  rationale: '''Mengutus'' sesuai dengan pengiriman wakil untuk suatu tugas dan objek ''mereka'' dibuat eksplisit agar kalimat jelas.'
- source_word: καλούμενον
  choice: yang disebut
  rationale: Mempertahankan fungsi deskriptif partisipel secara alami.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: orang-orang yang menjadi pemimpin di antara saudara-saudara seiman
  rationale: ἡγουμένους menunjukkan kepemimpinan yang diakui. Bentuk ini wajar dalam bahasa Indonesia dan tidak menjadikannya nama jabatan resmi.
- source_word: ἀδελφοῖς
  choice: saudara-saudara seiman
  rationale: Mempertahankan metafora kekerabatan dan bentuk jamak maskulin sumber, sementara 'seiman' memperjelas bahwa yang dimaksud ialah komunitas orang percaya.
theological_decisions:
- issue: Cakupan keterlibatan jemaat dalam keputusan
  choice: Para rasul dan penatua disebut bersama seluruh jemaat dalam menilai baik pemilihan dan pengutusan para utusan.
  alternative: Hanya para rasul dan penatua yang mengambil keputusan, sedangkan jemaat sekadar hadir.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ secara paling alami mengikutsertakan seluruh jemaat dalam tindakan yang diperkenalkan oleh ἔδοξε, tetapi terjemahan tidak menetapkan suatu model tata gereja tertentu.
- issue: Cakupan ἀδελφοῖς
  choice: '''Saudara-saudara seiman'' dipertahankan dalam teks utama, dengan cakupan komunitas yang lebih luas dijelaskan dalam catatan kaki.'
  alternative: '''Saudara-saudari seiman'' atau ''orang-orang percaya''.'
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam pemakaian Kristen awal dapat merujuk secara kolektif kepada komunitas orang percaya, termasuk perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan tetap mempertahankan penilaian kolektif, asal para utusan, nama-nama mereka, dan nuansa kepemimpinan yang tidak harus menunjuk pada jabatan formal.
