  to: Kemudian, para rasul dan para penatua, bersama seluruh jemaat, menganggap baik untuk memilih beberapa laki-laki dari antara mereka dan mengutus mereka ke Antiokhia bersama Paulus dan Barnabas, yaitu Yudas, yang disebut Barsabas, dan Silas, laki-laki yang memimpin di antara saudara-saudara seiman.[a]
  rationale: Revisi terbatas pada penggantian “beberapa orang” menjadi “beberapa laki-laki” untuk mencerminkan ἄνδρας secara eksplisit. Frasa akhir diselaraskan sebagai “laki-laki yang memimpin” agar kedua kemunculan ἄνδρας tetap terlihat dan ἡγουμένους tetap bernuansa partisipial. Tidak ada perubahan terhadap makna atau implikasi tata gereja.
