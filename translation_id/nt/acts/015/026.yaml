id: ACT.15.26
reference: Acts 15:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: id
  text: orang-orang yang telah mempertaruhkan nyawa mereka demi nama Tuhan kita, Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang telah menyerahkan nyawa mereka”; ungkapan Yunani ini berarti bahwa mereka telah menghadapkan diri pada bahaya maut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: orang-orang
  rationale: Kata ini merujuk secara khusus kepada Barnabas dan Paulus, tetapi dalam bahasa Indonesia 'orang-orang' merupakan sebutan alami bagi keduanya tanpa perlu menambahkan penandaan gender yang tidak dituntut oleh konteks.
- source_word: παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: yang telah mempertaruhkan nyawa mereka
  rationale: Secara harfiah ungkapan ini berarti 'telah menyerahkan nyawa mereka', tetapi dalam konteks ini menunjuk pada tindakan menghadapkan diri pada bahaya maut, bukan menyatakan bahwa mereka benar-benar telah mati. 'Mempertaruhkan nyawa' menyampaikan daya ungkapan itu secara alami dan tepat.
- source_word: ὑπὲρ
  choice: demi
  rationale: Dengan bentuk genitif, kata ini menyatakan kepentingan atau alasan. 'Demi' alami dalam bahasa Indonesia dan sesuai dengan pengabdian yang tersirat di sini.
- source_word: τοῦ ὀνόματος
  choice: nama
  rationale: '''Nama'' dipertahankan karena dalam pemakaian alkitabiah mencakup pribadi, kewibawaan, dan kehormatan, tanpa mempersempit maknanya menjadi salah satu unsur saja.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Menerjemahkan κύριος dengan gelar baku 'Tuhan' serta mempertahankan kata ganti kepunyaan ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός adalah gelar yang berarti 'Mesias'. Penambahan 'Sang' membuat gelar tersebut alami dan jelas dalam bahasa Indonesia tanpa mengubah makna sumber.
theological_decisions:
- issue: Makna παραδεδωκόσι dalam kaitannya dengan nyawa
  choice: mempertaruhkan nyawa
  alternative: menyerahkan nyawa
  rationale: Bentuk perfek tidak mengharuskan kesimpulan bahwa Barnabas dan Paulus sudah mati; ungkapan ini menyatakan bahwa mereka telah membiarkan nyawa mereka terpapar pada bahaya maut. Pilihan utama menjaga ketegangan pengorbanannya tanpa menyatakan kematian yang tidak terjadi.
- issue: Penerjemahan Χριστοῦ dalam rangkaian gelar
  choice: Sang Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap dapat dipahami sebagai gelar bagi Yesus. 'Sang Mesias' menerjemahkan makna gelar tersebut dan mencegahnya terbaca sekadar sebagai nama belakang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur fragmen dipertahankan karena ayat ini melanjutkan kalimat dari ayat 25. Koma sebelum 'Yesus Sang Mesias' membantu memperjelas rangkaian gelar. Semua penanda catatan kaki yang dicantumkan muncul dalam teks utama.
