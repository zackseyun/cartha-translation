id: ACT.15.14
reference: Acts 15:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: id
  text: Simeon[a] telah menceritakan bagaimana Allah mula-mula melawat bangsa-bangsa bukan Yahudi[b] untuk mengambil dari antara mereka suatu umat bagi nama-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Simon”. Di sini Yakobus memakai bentuk nama “Simeon”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari antara bangsa-bangsa”.
    reason: lexical_alternative
  - marker: c
    text: Artinya, suatu umat yang menjadi milik Allah dan menyandang nama-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simeon
  rationale: Bentuk nama dalam teks Yunani dipertahankan dan tidak diselaraskan dengan bentuk yang lebih umum, Simon.
- source_word: ἐξηγήσατο
  choice: telah menceritakan
  rationale: Kata kerja ini menunjuk pada penyampaian suatu kisah atau laporan; bentuk ini wajar untuk merangkum laporan yang baru saja disampaikan.
- source_word: καθὼς
  choice: bagaimana
  rationale: Dalam konstruksi ini, kata tersebut memperkenalkan isi sekaligus cara tindakan Allah yang diceritakan.
- source_word: πρῶτον
  choice: untuk pertama kalinya
  rationale: Ungkapan ini dengan jelas menandai tahap awal tindakan Allah terhadap bangsa-bangsa bukan Yahudi.
- source_word: ἐπεσκέψατο
  choice: melawat
  rationale: Pilihan ini mempertahankan gambaran kunjungan ilahi yang disertai perhatian dan tindakan yang bertujuan, tanpa mereduksinya menjadi sekadar melihat.
- source_word: λαβεῖν
  choice: untuk mengambil
  rationale: Infinitif ini menyatakan tujuan dan diterjemahkan langsung tanpa menambahkan gagasan penafsiran seperti menghimpun atau memilih.
- source_word: ἐξ ἐθνῶν
  choice: dari antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks Kisah Para Rasul 15, frasa ini merujuk pada kalangan non-Yahudi; 'dari antara' memperjelas bahwa umat itu diambil dari lingkup mereka.
- source_word: λαὸν
  choice: suatu umat
  rationale: '''Umat'' mempertahankan nuansa kolektif dan perjanjian dari λαός tanpa membatasinya pada kelompok etnis.'
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: bagi nama-Nya
  rationale: Terjemahan ini mempertahankan ungkapan perjanjian dalam sumber, termasuk nuansa kepunyaan dan identifikasi dengan Allah, alih-alih meratakannya menjadi 'bagi diri-Nya'.
theological_decisions:
- issue: Apakah ἐξ ἐθνῶν diterjemahkan sebagai bangsa-bangsa atau orang-orang bukan Yahudi
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa lain
  rationale: Konteks sidang di Yerusalem berpusat pada masuknya orang non-Yahudi ke dalam umat Allah. Pilihan ini membuat pertentangan Yahudi–non-Yahudi jelas tanpa mengubah bangsa-bangsa itu menjadi satu kelompok etnis tertentu.
- issue: Apakah τῷ ὀνόματι αὐτοῦ diparafrasakan sebagai 'bagi diri-Nya'
  choice: bagi nama-Nya
  alternative: bagi diri-Nya
  rationale: Ungkapan sumber memiliki bobot teologis dan gema bahasa perjanjian. Bentuk harfiah yang tetap wajar ini membiarkan nuansa kepunyaan, identitas, dan kehormatan nama Allah tetap terbuka.
- issue: Makna tindakan Allah dalam ἐπεσκέψατο
  choice: melawat
  alternative: memperhatikan
  rationale: '''Melawat'' mempertahankan ketegangan antara kunjungan, perhatian penuh rahmat, dan campur tangan Allah tanpa menjelaskan secara berlebihan bentuk tindakan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Istilah 'melawat', 'umat', dan 'bagi nama-Nya' dipertahankan karena membawa tekstur alkitabiah sumber, sedangkan susunan kalimat dibuat alami dalam bahasa Indonesia.
