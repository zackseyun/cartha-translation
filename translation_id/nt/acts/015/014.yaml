  terminology: “Simeon”, “Allah”, “melawat”, “bangsa-bangsa bukan Yahudi”, “umat”, dan “bagi nama-Nya” tepat. “Bagi nama-Nya” dengan baik mempertahankan ungkapan τῷ ὀνόματι αὐτοῦ tanpa meratakannya menjadi “bagi diri-Nya”.
