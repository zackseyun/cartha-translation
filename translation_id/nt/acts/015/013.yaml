  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: id
  text: Setelah mereka berhenti berbicara[a], Yakobus menjawab, “Saudara-saudara[b], dengarkanlah saya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah mereka diam.” Ungkapan Yunani ini menunjuk pada saat sesudah para pembicara sebelumnya berhenti berbicara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Laki-laki, saudara-saudara.” Kedua kata itu merupakan bentuk sapaan maskulin formal dalam bahasa Yunani.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Setelah mereka berhenti berbicara
  rationale: Konstruksi μετά dengan infinitif berartikel menyatakan waktu sesudah suatu tindakan. Dalam konteks ini σιγάω berarti berhenti berbicara atau menjadi diam; pilihan ini alami dalam bahasa Indonesia dan memperjelas bahwa para pembicara sebelumnya telah selesai.
- source_word: ἀπεκρίθη
  choice: menanggapi
  rationale: Kata ini dapat berarti menjawab atau menanggapi. Karena Yakobus berbicara setelah laporan dan pembahasan sebelumnya, “menanggapi” paling alami tanpa menyiratkan bahwa sebuah pertanyaan langsung telah diajukan.
- source_word: Ἰάκωβος
  choice: Yakobus
  rationale: Mengikuti bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisip ini memperkenalkan perkataan langsung. “Dengan berkata” mempertahankan kaitannya dengan verba utama sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: Ἄνδρες ἀδελφοί
  choice: Saudara-saudara
  rationale: Gabungan dua vokatif maskulin ini merupakan sapaan formal kepada sesama laki-laki dalam sidang. Terjemahan “Saudara-saudara” adalah padanan sapaan Indonesia yang alami; rincian harfiahnya dijelaskan dalam catatan kaki.
- source_word: ἀκούσατέ μου
  choice: dengarkanlah saya
  rationale: Imperatif aoris ini meminta perhatian para pendengar. Partikel “-lah” menyampaikan dorongan yang tegas namun santun.
theological_decisions:
- issue: Sapaan vokatif maskulin dalam sidang umum
  choice: Saudara-saudara
  alternative: Laki-laki, saudara-saudara; Saudara-saudari
  rationale: Teks Yunani memakai ἄνδρες dan ἀδελφοί, keduanya berbentuk maskulin. “Saudara-saudara” mempertahankan sapaan maskulin secara alami dalam bahasa Indonesia, sedangkan catatan kaki menyatakan bentuk harfiahnya dan konteks pertemuan yang lebih luas tanpa mengubahnya menjadi sapaan inklusif eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Diksi dibuat alami bagi pembaca umum, sambil mempertahankan urutan tindakan, bentuk sapaan maskulin, dan daya imperatif teks Yunani.
