  yaml_path: translation/nt/acts/015/034.yaml
  text: But[a] it seemed good to Silas to remain there.
translation:
  language: id
  text: Namun, Silas menganggap baik untuk tetap tinggal di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini tidak terdapat dalam naskah-naskah Yunani paling awal, termasuk Papirus 74 dari abad ke-3 serta Kodeks Sinaitikus dan Kodeks Vatikanus dari abad ke-4, dan juga tidak terdapat dalam terjemahan-terjemahan Koptik awal. Ayat ini terdapat dalam tradisi mayoritas Bizantin, beberapa naskah Aleksandria dan Barat yang lebih kemudian, serta tradisi Latin dan Siria. Kemungkinan ayat ini ditambahkan oleh seorang penyalin pada masa kemudian untuk menjelaskan bagaimana Silas masih berada di Antiokhia sehingga dapat menyertai Paulus dalam ayat 40, meskipun ayat 33 menyatakan bahwa ia dan Yudas telah berangkat.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε … τῷ Σίλᾳ
  choice: Silas menganggap baik
  rationale: Ungkapan impersonal δοκέω dengan datif menyatakan bahwa sesuatu dipandang baik oleh seseorang. Susunan ini mempertahankan nuansa pertimbangan atau keputusan tanpa membuatnya sekadar pernyataan tentang perasaan.
- source_word: ἐπιμεῖναι
  choice: untuk tetap tinggal
  rationale: Infinitif aoris ἐπιμένω dalam konteks ini berarti terus berada atau menetap di tempat tersebut; 'tetap tinggal' alami dalam bahasa Indonesia dan memperjelas kontras dengan keberangkatan yang disebut sebelumnya.
- source_word: αὐτοῦ
  choice: di sana
  rationale: Di sini αὐτοῦ berfungsi sebagai keterangan tempat dan merujuk kepada Antiokhia.
- source_word: δέ
  choice: Namun
  rationale: 'Partikel δέ menandai peralihan yang bersifat kontras: Silas memilih tinggal meskipun ayat sebelumnya menyebut keberangkatan para utusan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menganggap baik' mempertahankan corak ungkapan Yunani, sedangkan 'tetap tinggal' terdengar alami bagi pembaca umum. Penanda catatan kaki ditempatkan langsung sesudah teks ayat.
