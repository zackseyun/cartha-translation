  text: Βαρναβᾶς δὲ ⸀ἐβούλετο συμπαραλαβεῖν ⸀καὶ τὸν Ἰωάννην τὸν καλούμενον Μᾶρκον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: id
  text: Namun, Barnabas ingin mengajak juga Yohanes[a], yang disebut Markus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yohanes, yang juga disebut Markus.”
    reason: Alternatif ini mengaitkan nuansa “juga” dengan nama Markus, sedangkan susunan utama mengaitkannya dengan tindakan mengajak Yohanes.
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Barnabas
  rationale: Nama diri ditransliterasikan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menyatakan kontras ringan dengan usul Paulus dalam konteks sebelumnya; “Namun” alami dan tidak membuat pertentangan itu terlalu tajam.
- source_word: ἐβούλετο
  choice: ingin
  rationale: Bentuk imperfek βούλομαι menyatakan kehendak atau niat Barnabas dalam alur cerita; “ingin” mempertahankan unsur kemauan tanpa melebih-lebihkan keteguhan keputusan.
- source_word: συμπαραλαβεῖν
  choice: mengajak
  rationale: Verba majemuk ini berarti membawa seseorang bersama dalam rombongan. Dalam konteks perjalanan, “mengajak” merupakan padanan Indonesia yang alami.
- source_word: καὶ
  choice: juga
  rationale: 'Ditempatkan bersama objek untuk memberi nuansa penambahan: Barnabas ingin mengajak Yohanes juga.'
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: yang disebut Markus
  rationale: Frasa partisipial ini mengidentifikasi Yohanes dengan nama lain tanpa mengharuskan kata “juga” berada di dalam frasa tersebut.
- source_word: Μᾶρκον
  choice: Markus
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions: []
