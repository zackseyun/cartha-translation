id: ACT.15.10
reference: Acts 15:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: id
  text: Jadi sekarang, mengapa kalian menguji Allah[a] dengan memasang kuk[b] pada tengkuk murid-murid—kuk yang tidak sanggup dipikul baik oleh nenek moyang kita[c] maupun oleh kita sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencobai Allah.”
    reason: lexical_alternative
  - marker: b
    text: “Kuk” adalah kiasan untuk kewajiban yang dikenakan; dalam konteks ini, kuk menunjuk pada tuntutan yang dibebankan kepada para murid.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “bapa-bapa kita”; maksudnya ialah generasi-generasi Israel terdahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Jadi sekarang
  rationale: Menyampaikan daya simpulan οὖν sekaligus peralihan waktu νῦν dalam ungkapan Indonesia yang wajar.
- source_word: τί πειράζετε τὸν θεόν
  choice: mengapa kalian menguji Allah
  rationale: τί berfungsi sebagai 'mengapa' dalam pertanyaan retoris, sedangkan πειράζω dengan objek Allah berarti menguji atau mencobai Allah.
- source_word: ἐπιθεῖναι
  choice: dengan memasang
  rationale: Infinitif ini menjelaskan tindakan yang menjadi cara mereka menguji Allah; 'memasang' cocok dengan gambaran kuk.
- source_word: ζυγὸν
  choice: kuk
  rationale: Mempertahankan metafora konkret tentang kewajiban yang dikenakan, tanpa menafsirkannya langsung sebagai 'beban' atau suatu tuntutan tertentu.
- source_word: ἐπὶ τὸν τράχηλον
  choice: pada tengkuk
  rationale: Terjemahan langsung yang mempertahankan gambaran kuk pada bagian belakang leher dan tetap wajar dalam bahasa Indonesia.
- source_word: τῶν μαθητῶν
  choice: murid-murid
  rationale: Padanan baku bagi μαθηταί dalam Kisah Para Rasul.
- source_word: ὃν
  choice: kuk yang
  rationale: Mengulang anteseden secara singkat untuk memperjelas bahwa klausa relatif menerangkan kuk.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: baik oleh nenek moyang kita maupun oleh kita sendiri
  rationale: Dalam lingkup negasi 'tidak sanggup', konstruksi 'baik ... maupun ...' menyatakan bahwa kedua kelompok sama-sama tidak mampu; 'nenek moyang' menyampaikan acuan kepada generasi Israel terdahulu secara alami.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: tidak sanggup dipikul
  rationale: Mengungkapkan ketidakmampuan yang dinyatakan ἰσχύω dan mempertahankan metafora memikul kuk dari βαστάζω.
theological_decisions:
- issue: Cakupan metafora 'kuk'
  choice: Metafora kuk dipertahankan sebagai kewajiban yang dikenakan kepada para murid tanpa menentukan lebih jauh isi kewajiban itu di dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai seluruh hukum Musa, atau secara lebih sempit sebagai sunat beserta tuntutan terkait.
  rationale: Konteks langsung membahas tuntutan terhadap orang bukan Yahudi yang percaya, tetapi ayat ini sendiri memakai metafora. Terjemahan tidak mempersempitnya kepada satu penafsiran doktrinal.
- issue: Makna menguji Allah
  choice: Diterjemahkan 'menguji Allah', dengan alternatif idiomatis 'mencobai Allah' dalam catatan kaki.
  alternative: Mencobai Allah.
  rationale: Kedua ungkapan dapat menyampaikan πειράζω; pilihan utama lebih langsung bagi pembaca modern, sedangkan catatan mempertahankan alternatif tradisional yang bernuansa tindakan lancang terhadap Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kalian' memperjelas bentuk jamak orang kedua. Metafora kuk serta ketegangan mengenai cakupannya dipertahankan, sementara pengulangan 'kuk' sebelum klausa relatif membantu kejelasan tanpa mengubah makna.
