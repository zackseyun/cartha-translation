  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: id
  text: Lalu beberapa orang turun dari Yudea dan mengajar saudara-saudara[a], “Jika kalian tidak disunat menurut adat Musa, kalian tidak dapat diselamatkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang dipakai berarti “saudara-saudara” dan kemungkinan merujuk secara inklusif kepada komunitas orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi. “Lalu” terdengar alami dalam narasi Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: τινες
  choice: beberapa orang
  rationale: Bentuk jamak tak tentu ini menunjuk kepada sejumlah orang tertentu; bahasa Indonesia tidak perlu menandai gender mereka secara gramatikal.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: datang dari Yudea
  rationale: Partisip aoris menyatakan tindakan yang mendahului kegiatan mengajar. “Datang dari Yudea” alami dalam bahasa Indonesia; unsur arah harfiah “turun” tidak diperlukan karena sudut pandang geografisnya tidak lazim diungkapkan demikian dalam bahasa Indonesia.
- source_word: ἐδίδασκον
  choice: mengajar
  rationale: Imperfek menunjukkan kegiatan yang sedang atau berulang berlangsung. Dalam rangkaian ini, verba sederhana “mengajar” menyampaikan tindakan berkelanjutan secara alami tanpa membuat kalimat berat.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara seiman
  rationale: ἀδελφοί secara leksikal berarti saudara-saudara, tetapi dalam Kisah Para Rasul sering menjadi sebutan bagi komunitas orang percaya. “Seiman” menjernihkan pemakaian komunal tanpa menggantinya dengan istilah yang sama sekali berbeda; cakupan yang mungkin inklusif dijelaskan dalam catatan kaki.
- source_word: Ἐὰν μὴ
  choice: Jika ... tidak
  rationale: Konstruksi syarat negatif ini secara idiomatis dapat diterjemahkan “jika ... tidak”; bentuk tersebut alami dan tegas dalam bahasa Indonesia.
- source_word: περιτμηθῆτε
  choice: kalian tidak disunat
  rationale: Aoris pasif subjungtif menyatakan syarat bahwa para pendengar harus menerima sunat. “Disunat” mempertahankan bentuk pasif, sedangkan “kalian” membedakan orang kedua jamak secara jelas.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: menurut adat Musa
  rationale: ἔθος berarti adat atau kebiasaan yang sudah mapan, dan datif ini wajar dinyatakan dengan “menurut”. “Adat Musa” mempertahankan hubungan genitif tanpa memperluasnya menjadi “yang diwariskan oleh Musa”.
- source_word: οὐ δύνασθε σωθῆναι
  choice: kalian tidak dapat diselamatkan
  rationale: Ungkapan ini menyatakan ketidakmungkinan menerima keselamatan jika syarat tersebut tidak dipenuhi. Bentuk pasif “diselamatkan” mempertahankan bentuk dan daya teologis σωθῆναι.
theological_decisions:
- issue: Makna σωθῆναι dalam perselisihan yang mengarah pada sidang Yerusalem
  choice: diselamatkan
  alternative: dilepaskan
  rationale: Konteks membahas apakah sunat diperlukan untuk keselamatan dan penerimaan dalam umat Allah. “Diselamatkan” mempertahankan bobot soteriologisnya tanpa menentukan sistem teologi denominasi tertentu.
- issue: Cakupan τοὺς ἀδελφοὺς
  choice: saudara-saudara seiman
  alternative: saudara-saudara laki-laki dan perempuan; orang-orang percaya
  rationale: Bentuk Yunani adalah maskulin jamak dan secara harfiah berarti “saudara-saudara”, tetapi dalam konteks komunitas dapat mencakup seluruh persekutuan orang percaya. Teks utama mempertahankan metafora kekerabatan, sedangkan catatan kaki menjaga kemungkinan cakupan inklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “kalian” dipakai untuk menandai orang kedua jamak secara alami. Istilah “adat Musa” dipertahankan agar tidak menggeser ἔθος menjadi istilah hukum yang lebih sempit.
