lexical_decisions:
- source_word: γνωστὰ
  choice: telah diketahui
  rationale: Kata sifat netral jamak ini berfungsi sebagai predikat dalam klausa tanpa verba. Bentuk “telah diketahui” menyampaikan keadaan yang sudah berlangsung tanpa menambahkan gagasan “diberitahukan” yang tidak dinyatakan secara eksplisit.
- source_word: ἀπ’
  choice: sejak
  rationale: Dalam ungkapan waktu ini, ἀπό menandai titik awal atau rentang waktu yang bermula pada masa lampau; “sejak” paling alami dalam bahasa Indonesia.
- source_word: αἰῶνος
  choice: dahulu kala
  rationale: Dalam konteks temporal ini, αἰών dapat menunjuk pada masa lampau yang sangat jauh. “Dahulu kala” mempertahankan nuansa zaman purba tanpa memperkuatnya menjadi pernyataan eksplisit tentang kekekalan.
theological_decisions:
- issue: Cakupan waktu pengetahuan Allah dalam klausa yang sangat ringkas ini
  choice: Menerjemahkan frasa sebagai sesuatu yang telah diketahui sejak dahulu kala tanpa memperluasnya menjadi pernyataan doktrinal yang lebih tegas tentang pengetahuan sejak kekekalan.
  alternative: “telah diketahui sejak kekekalan” atau “yang memberitahukan hal-hal ini sejak dahulu kala”
  rationale: Teks SBLGNT hanya berbunyi γνωστὰ ἀπ’ αἰῶνος. Terjemahan mempertahankan keringkasan dan ketegangannya, sedangkan bacaan naskah yang lebih panjang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Subjek tidak ditambahkan karena teks Yunani sendiri berupa klausa sangat padat tanpa verba dan bergantung pada konteks ayat sebelumnya.
