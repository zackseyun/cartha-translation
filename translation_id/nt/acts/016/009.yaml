id: ACT.16.9
reference: Acts 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: id
  text: 'Pada malam hari[a], Paulus mendapat suatu penglihatan: seorang laki-laki Makedonia[b] berdiri dan memohon kepadanya sambil berkata, “Menyeberanglah ke Makedonia[c] dan tolonglah kami.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sewaktu malam” atau “pada waktu malam.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “seorang laki-laki dari Makedonia.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Yunani secara harfiah memakai partisip “menyeberang” bersama perintah “tolonglah kami.” Partisip itu menyatu secara idiomatis dengan perintah berikutnya; dapat juga diterjemahkan “sesudah menyeberang ke Makedonia, tolonglah kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: penglihatan
  rationale: Istilah ini lazim menunjuk pada pengalaman melihat yang bersifat pewahyuan. “Penglihatan” merupakan padanan baku dalam narasi Alkitab dan tidak menentukan lebih jauh bagaimana pengalaman itu berlangsung.
- source_word: διὰ νυκτός
  choice: pada malam hari
  rationale: Frasa ini menyatakan waktu terjadinya penglihatan. “Pada malam hari” alami dan jelas dalam bahasa Indonesia modern.
- source_word: τῷ Παύλῳ ὤφθη
  choice: Paulus mendapat suatu penglihatan
  rationale: Secara harfiah, penglihatan itu “tampak kepada Paulus.” Ungkapan “mendapat suatu penglihatan” menyampaikan peristiwa yang sama secara wajar dalam bahasa Indonesia tanpa menjelaskan fenomenanya secara berlebihan.
- source_word: ἀνὴρ Μακεδών τις
  choice: seorang laki-laki Makedonia
  rationale: ἀνήρ secara khusus berarti laki-laki, sedangkan Μακεδών menunjukkan bahwa ia orang Makedonia. Unsur ketaktentuan dari τις sudah tersampaikan secara alami oleh “seorang”; menambahkan “tertentu” akan terasa kaku dan dapat memberi kesan bahwa orang itu telah dikenal.
- source_word: ἑστώς
  choice: berdiri
  rationale: Bentuk ini menggambarkan postur laki-laki tersebut dalam penglihatan. “Berdiri” mempertahankan gambaran adegan dengan ringkas dan alami.
- source_word: παρακαλῶν
  choice: memohon
  rationale: Dalam konteks permintaan pertolongan, kata ini menyatakan permintaan yang sungguh-sungguh. “Memohon” lebih kuat daripada sekadar “meminta” tetapi tidak harus menyiratkan tindakan mengemis.
- source_word: λέγων
  choice: katanya
  rationale: Partisip ini memperkenalkan ucapan langsung. “Katanya” alami setelah klausa “memohon kepadanya” dan menghindari rangkaian bentuk verbal yang kaku.
- source_word: Διαβάς
  choice: Menyeberanglah
  rationale: Partisip aoris ini berkaitan erat dengan imperatif berikutnya dan menyatakan tindakan yang harus dilakukan untuk datang ke Makedonia. Bentuk imperatif “Menyeberanglah” mempertahankan unsur melintas yang ada dalam bahasa Yunani.
- source_word: εἰς Μακεδονίαν
  choice: ke Makedonia
  rationale: εἰς menunjukkan arah gerak menuju atau masuk ke Makedonia. Setelah verba “menyeberang,” bentuk “ke Makedonia” paling alami dalam bahasa Indonesia.
- source_word: βοήθησον ἡμῖν
  choice: tolonglah kami
  rationale: Ini merupakan permintaan langsung akan bantuan. “Tolonglah kami” sederhana, kuat, dan tepat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hakikat pengalaman yang disebut ὅραμα dan ὤφθη
  choice: Menyatakannya sebagai penglihatan yang Paulus alami tanpa mendefinisikan mekanismenya
  alternative: Menyebutnya mimpi, kesan batin, atau penampakan objektif
  rationale: Teks menyebut suatu penglihatan pada malam hari, tetapi tidak menjelaskan apakah Paulus sedang tidur atau bagaimana tepatnya penglihatan itu dialami. Terjemahan ini mempertahankan sifat pewahyuannya sekaligus membiarkan rincian tersebut terbuka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara unsur penglihatan, identitas laki-laki itu, gerakan menyeberang, dan permintaan pertolongan tetap dipertahankan. Bentuk “mendapat suatu penglihatan” dipilih untuk menghindari ungkapan kaku “suatu penglihatan tampak kepada Paulus.”
