  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: id
  text: Para pembawa tongkat[a] itu menyampaikan perkataan tersebut kepada para pejabat kota[b]. Ketika mendengar bahwa mereka adalah orang Romawi,[c] para pejabat itu takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pembawa tongkat” adalah petugas pendamping para pejabat kota; mereka secara tradisional disebut liktor.
    reason: cultural_note
  - marker: b
    text: Istilah Yunani untuk “pejabat kota” menunjuk kepada para pemimpin pemerintahan kota Filipi, sebuah koloni Romawi.
    reason: cultural_note
  - marker: c
    text: Atau “warga negara Romawi.” Bahasa Yunani secara harfiah mengatakan “orang Romawi,” tetapi dalam konteks hukum ini yang dimaksud ialah status kewarganegaraan mereka yang dilindungi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: menyampaikan
  rationale: Kata kerja ini berarti melaporkan atau menyampaikan berita. Dalam konteks penyampaian pesan resmi, “menyampaikan” terdengar alami dan tetap mencerminkan tindakan meneruskan informasi.
- source_word: στρατηγοῖς
  choice: para pejabat kota
  rationale: Di koloni Romawi Filipi, istilah ini menunjuk kepada para pemimpin pemerintahan kota. “Para pejabat kota” akurat secara kontekstual dan lebih mudah dipahami daripada gelar teknis Romawi.
- source_word: ῥαβδοῦχοι
  choice: para pembawa tongkat
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang para petugas pendamping pejabat yang membawa tongkat sebagai lambang wewenang.
- source_word: τὰ ῥήματα ταῦτα
  choice: perkataan tersebut
  rationale: Terjemahan ini mempertahankan acuan kepada perkataan tertentu yang baru saja disampaikan, dengan ungkapan Indonesia yang alami.
- source_word: ἐφοβήθησαν
  choice: pun takut
  rationale: Bentuk aoris ini menyatakan reaksi takut setelah mendengar informasi tersebut. Partikel “pun” menandai akibat secara alami tanpa menambah kadar emosi yang tidak dinyatakan teks.
- source_word: ἀκούσαντες
  choice: ketika mendengar
  rationale: Partisip aoris ini menyatakan hubungan waktu dan secara kontekstual juga sebab; “ketika mendengar” mempertahankan keduanya tanpa menjelaskannya secara berlebihan.
- source_word: Ῥωμαῖοί
  choice: orang Romawi
  rationale: Bahasa Yunani secara harfiah menyebut mereka “orang Romawi.” Dalam konteks hukum, sebutan itu menunjukkan status kewarganegaraan Romawi, tetapi bentuk utama mempertahankan ungkapan sumber.
