  terminology: “Seisi rumahnya” tepat bagi οἶκος sebagai rumah tangga, sedangkan “rumahku” tepat bagi bangunan/tempat tinggal. “Setia kepada Tuhan” mempertahankan ambiguitas penting πιστή. Catatan kaki diperjelas agar alternatif “believer” terbaca gramatikal dalam bahasa Indonesia.
