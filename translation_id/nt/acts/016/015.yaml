  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: id
  text: Ketika ia dan seisi rumahnya dibaptis, ia mendesak kami dengan berkata, “Jika kalian menilai aku setia kepada Tuhan[a], masuklah ke rumahku dan tinggallah.” Ia pun berhasil membujuk kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang yang percaya kepada Tuhan.” Kata sifat Yunani yang dipakai dapat berarti “setia”, “dapat dipercaya”, atau “percaya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: Setelah ia dan seisi rumahnya dibaptis
  rationale: ὡς δέ menyatakan urutan waktu dengan penghubung ringan. Walaupun ἐβαπτίσθη berbentuk tunggal dan mula-mula merujuk kepada perempuan itu, frasa καὶ ὁ οἶκος αὐτῆς memperluas peristiwa tersebut kepada seisi rumahnya. 'Seisi rumahnya' menunjuk kepada kelompok rumah tangga, bukan bangunan.
- source_word: παρεκάλεσεν
  choice: ia mendesak kami
  rationale: παρακαλέω dalam konteks ini adalah permintaan atau undangan yang sungguh-sungguh; 'mendesak' selaras dengan ketekunannya yang ditegaskan pada akhir ayat.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Jika kalian menilai aku setia kepada Tuhan
  rationale: Bentuk perfektum κεκρίκατέ menyiratkan penilaian yang telah dicapai, sedangkan πιστή dapat berarti setia, dapat dipercaya, atau percaya. 'Setia kepada Tuhan' mempertahankan nuansa relasional dan moral tanpa menutup kemungkinan nuansa percaya.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: datanglah ke rumahku dan tinggallah di sana
  rationale: Partisip εἰσελθόντες bersama imperatif μένετε secara alami diungkapkan sebagai dua ajakan berurutan. Di sini οἶκος menunjuk kepada tempat tinggal fisik, sehingga diterjemahkan 'rumahku'.
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: Ia pun terus mendesak sampai kami menurut
  rationale: παραβιάζομαι menyatakan desakan kuat yang berhasil. Ungkapan ini menyampaikan hasil dari kegigihannya tanpa memberi kesan pemaksaan fisik.
theological_decisions:
- issue: Implikasi denominasi dari baptisan seisi rumah
  choice: Menyatakan langsung bahwa ia dan seisi rumahnya dibaptis tanpa menentukan usia atau status iman setiap anggota.
  alternative: Menyusun terjemahan yang menyiratkan baptisan bayi atau, sebaliknya, hanya baptisan orang yang telah mengaku percaya.
  rationale: Ayat ini tidak menjelaskan susunan rumah tangga itu atau menjadikannya argumen eksplisit bagi suatu doktrin baptisan.
- issue: Makna πιστὴν dalam penilaian terhadap Lidia
  choice: setia kepada Tuhan
  alternative: percaya kepada Tuhan; dapat dipercaya di hadapan Tuhan
  rationale: Kata Yunani tersebut memiliki rentang arti yang mencakup kesetiaan, keterpercayaan, dan kepercayaan. Teks utama mempertahankan nuansa kesetiaan, sementara catatan kaki menyatakan alternatif penting.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina jamak ''kalian'' memperjelas bahwa bentuk Yunani κεκρίκατε berjamak. ''Seisi rumah'' dibedakan dari ''rumahku'' untuk mencerminkan dua penggunaan οἶκος: kelompok rumah tangga dan bangunan tempat tinggal.'
