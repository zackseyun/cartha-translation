id: ACT.16.37
reference: Acts 16:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: id
  text: Namun Paulus berkata kepada para petugas itu, “Mereka telah memukuli kami di depan umum tanpa terlebih dahulu menyatakan kami bersalah[a], padahal kami warga negara Romawi[b], dan menjebloskan kami ke dalam penjara. Sekarang mereka hendak mengeluarkan kami secara diam-diam? Sama sekali tidak! Biarlah mereka sendiri datang dan membawa kami keluar[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa mengadili kami” atau “tanpa menjatuhkan putusan bersalah terhadap kami.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang yang adalah orang Romawi”; yang dimaksud ialah bahwa Paulus dan Silas memiliki kewarganegaraan Romawi beserta perlindungan hukumnya.
    reason: cultural_note
  - marker: c
    text: Atau “menuntun kami keluar” atau “mengantar kami keluar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: berkata kepada para petugas itu
  rationale: Kata ganti αὐτούς merujuk kepada para petugas yang membawa pesan para pejabat kota dalam konteks langsung; penyebutan referennya membuat bahasa Indonesia jelas dan alami.
- source_word: Δείραντες
  choice: telah memukuli
  rationale: Partisip aoris menyatakan tindakan yang mendahului pemenjaraan. 'Memukuli' mempertahankan kekerasan tindakan tanpa mempersempitnya menjadi jenis hukuman tertentu.
- source_word: δημοσίᾳ
  choice: di depan umum
  rationale: Padanan adverbial yang alami dan mempertahankan unsur penghinaan serta pelanggaran yang dilakukan secara terbuka.
- source_word: ἀκατακρίτους
  choice: tanpa menjatuhkan hukuman kepada kami
  rationale: Secara harfiah menunjuk keadaan belum dijatuhi hukuman, bukan secara khusus ketiadaan persidangan. Rumusan ini mempertahankan ketepatan yuridis dan ambiguitas prosedural teks.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: padahal kami warga negara Romawi
  rationale: Ungkapan Yunani menegaskan status hukum Paulus dan Silas. Bentuk konsesif ini alami dalam bahasa Indonesia dan 'warga negara Romawi' menyampaikan daya hukum konteks tersebut.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: menjebloskan kami ke dalam penjara
  rationale: '''Menjebloskan'' mempertahankan daya keras βάλλω dan sesuai dengan ragam naratif Indonesia masa kini.'
- source_word: λάθρᾳ
  choice: secara diam-diam
  rationale: Menyampaikan tindakan yang tersembunyi atau tidak terbuka, berlawanan dengan pemukulan di depan umum.
- source_word: ἐκβάλλουσιν
  choice: hendak mengeluarkan kami
  rationale: Kala kini dalam pertanyaan retoris berkaitan dengan tindakan yang sedang direncanakan melalui pesan pembebasan; 'hendak' terdengar alami tanpa menghilangkan nuansa pengusiran.
- source_word: οὐ γάρ
  choice: Sama sekali tidak!
  rationale: Menangkap penolakan yang tegas dan emfatis dalam bahasa Indonesia modern.
- source_word: ἐλθόντες αὐτοὶ
  choice: Biarlah mereka sendiri datang
  rationale: 'Mempertahankan tekanan pada αὐτοὶ: para pejabat itu harus hadir secara pribadi.'
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: membawa kami keluar
  rationale: Padanan langsung dan alami bagi ἐξάγω; kemungkinan nuansa 'mengantar' dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya hukum status Romawi
  choice: warga negara Romawi
  alternative: orang Romawi
  rationale: Dalam konteks ini, Ῥωμαίους menunjuk status kewarganegaraan beserta perlindungan hukumnya; padanan yang dipilih menyatakan pokok keberatan Paulus tanpa menambahkan ajaran denominasi.
- issue: Makna ἀκατακρίτους
  choice: tanpa menjatuhkan hukuman kepada kami
  alternative: tanpa mengadili kami; tanpa dinyatakan bersalah
  rationale: Kata tersebut secara langsung berarti belum atau tidak dijatuhi hukuman. Pilihan utama menghindari penyempitan makna menjadi ketiadaan proses persidangan, sementara alternatif yang lazim dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kontras retoris antara tindakan terbuka dan pelepasan diam-diam dipertahankan. Ucapan Paulus dibuat tegas tanpa menjadi bahasa hukum teknis yang sulit dipahami.
