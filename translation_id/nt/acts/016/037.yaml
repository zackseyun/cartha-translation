revisions:
- from: Namun Paulus berkata kepada para petugas itu, “Mereka telah memukuli kami di depan umum tanpa menjatuhkan hukuman kepada kami[a], padahal kami warga negara Romawi[b], lalu menjebloskan kami ke dalam penjara. Sekarang mereka hendak mengeluarkan kami secara diam-diam? Sama sekali tidak! Biarlah mereka sendiri datang dan membawa kami keluar[c].”
  to: Namun Paulus berkata kepada para petugas itu, “Mereka telah memukuli kami di depan umum tanpa terlebih dahulu menyatakan kami bersalah[a], padahal kami warga negara Romawi[b], dan menjebloskan kami ke dalam penjara. Sekarang mereka hendak mengeluarkan kami secara diam-diam? Sama sekali tidak! Biarlah mereka sendiri datang dan membawa kami keluar[c].”
  rationale: Revisi terbatas pada padanan ἀκατακρίτους dan catatan kaki terkait. ‘Tanpa terlebih dahulu menyatakan kami bersalah’ mencerminkan keadaan tidak adanya putusan penghukuman terhadap Paulus dan Silas, tetap mempertahankan ambiguitas apakah masalahnya terutama tidak ada putusan atau juga tidak ada proses pengadilan, dan lebih alami dalam bahasa Indonesia daripada ‘tanpa menjatuhkan hukuman kepada kami’.
