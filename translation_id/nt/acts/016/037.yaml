  source_fidelity: Terjemahan mempertahankan urutan tindakan, penekanan pada tindakan di depan umum, status kewarganegaraan Romawi, kontras dengan pelepasan diam-diam, serta tuntutan agar para pejabat datang sendiri. Namun, ἀκατακρίτους lebih tepat dinyatakan sebagai belum/tidak dinyatakan bersalah secara hukum, bukan ‘tanpa menjatuhkan hukuman’, karena pemukulan itu sendiri dapat dipahami sebagai hukuman.
  naturalness: Bahasa umumnya baku dan alami. Penyesuaian pada frasa hukum membuat kalimat lebih jelas dan menghindari kesan bahwa Paulus hanya memprotes tidak adanya hukuman, padahal ia memprotes pemukulan dan pemenjaraan tanpa putusan hukum terhadap mereka.
  terminology: ‘Warga negara Romawi’ tepat bagi daya legal Ῥωμαίους dalam konteks ini. ‘Para petugas itu,’ ‘menjebloskan,’ ‘secara diam-diam,’ dan ‘membawa kami keluar’ sesuai dengan register naratif modern serta makna sumber.
