  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: id
  text: Ia mendapat kesaksian yang baik dari saudara-saudara di Listra dan Ikonium.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”, yang merujuk kepada sesama orang percaya di tempat-tempat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ia
  rationale: Kata ganti relatif ini mengacu kepada Timotius pada ayat sebelumnya. Karena kutipan diberikan sebagai ayat tersendiri, bentuk mandiri “Ia” lebih alami dalam bahasa Indonesia.
- source_word: ἐμαρτυρεῖτο
  choice: dikenal baik
  rationale: Bentuk imperfek pasif μαρτυρέω di sini menyatakan bahwa Timotius menerima kesaksian yang baik atau memiliki nama baik. “Dikenal baik” menyampaikan reputasi positif itu secara alami tanpa mengesankan tindakan bersaksi secara hukum.
- source_word: ὑπὸ
  choice: di antara
  rationale: Walaupun ὑπό dengan genitif secara gramatikal menandai pelaku, ungkapan Indonesia “dikenal baik di antara” secara idiomatis menyatakan bahwa komunitas tersebut memberikan penilaian baik tentang Timotius.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: di Listra dan Ikonium
  rationale: Frasa berartikel ini menerangkan komunitas saudara seiman yang berada di kedua kota tersebut.
- source_word: ἀδελφῶν
  choice: saudara-saudara seiman
  rationale: Dalam konteks komunitas Kristen, ἀδελφοί menunjuk kepada sesama anggota umat percaya dan dapat mencakup laki-laki maupun perempuan. “Saudara-saudara seiman” mempertahankan metafora kekerabatan sekaligus memperjelas hubungan iman.
theological_decisions:
- issue: Cakupan gender ἀδελφῶν dalam komunitas Kristen
  choice: saudara-saudara seiman
  alternative: saudara-saudara laki-laki; orang-orang percaya
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam sapaan dan penyebutan komunitas Kristen dapat berfungsi secara inklusif. Teks utama mempertahankan bahasa kekerabatan tanpa membatasi rujukannya hanya kepada laki-laki; catatan kaki menjelaskan cakupan yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. “Ia” memberi nuansa naratif yang bermartabat; “dikenal baik” mengungkapkan kesaksian positif komunitas secara idiomatis.
