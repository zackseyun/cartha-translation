  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: id
  text: Namun, ketika para tuannya melihat bahwa harapan mereka akan keuntungan telah lenyap[a], mereka menangkap Paulus dan Silas serta menyeret mereka ke pasar untuk menghadap para penguasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harapan atas penghasilan mereka telah keluar/pergi.” Kata Yunani untuk “keluar/pergi” juga dipakai dalam ayat sebelumnya tentang roh itu.
    reason: literal_rendering_and_lexical_connection
  - marker: b
    text: Kata Yunani di sini merupakan sebutan umum bagi para penguasa atau pejabat sipil; ayat berikutnya memakai istilah yang lebih khusus bagi pejabat kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: tuan-tuan perempuan itu
  rationale: Dalam konteks ini, κύριοι menunjuk kepada orang-orang yang menguasai dan mengeksploitasi perempuan tersebut. 'Tuan-tuan' mempertahankan nuansa relasi perbudakan tanpa membuat kepemilikan legal lebih eksplisit daripada teks.
- source_word: ἐξῆλθεν
  choice: telah lenyap
  rationale: Secara harfiah berarti 'telah keluar/pergi', tetapi bersama 'harapan' ungkapan Indonesia 'telah lenyap' menyampaikan hilangnya sumber keuntungan dengan wajar. Catatan kaki mempertahankan permainan gambaran bahwa harapan itu 'keluar', selaras dengan roh yang telah keluar pada ayat sebelumnya.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: harapan mereka untuk memperoleh keuntungan
  rationale: ἐλπίς dipertahankan sebagai 'harapan', sedangkan ἐργασία dalam konteks ini menunjuk kepada penghasilan atau keuntungan yang diperoleh dari kegiatan perempuan itu.
- source_word: ἐπιλαβόμενοι
  choice: menangkap
  rationale: Partisip ini menggambarkan tindakan memegang atau mencengkeram secara paksa. 'Menangkap' alami dalam konteks tindakan bermusuhan dan membawa paksa.
- source_word: εἵλκυσαν
  choice: menyeret
  rationale: Kata ini menyatakan tarikan paksa; 'menyeret' mempertahankan kekerasan tindakan tersebut.
- source_word: ἀγορὰν
  choice: alun-alun
  rationale: ἀγορά adalah ruang publik pusat kota yang berfungsi sebagai pasar dan tempat urusan sipil. 'Alun-alun' lebih mencakup fungsi publik-yudisial di sini daripada sekadar 'pasar'.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: untuk menghadap para penguasa
  rationale: ἄρχοντες merupakan sebutan umum bagi para pejabat atau penguasa sipil. Terjemahan ini membedakannya dari istilah yang lebih khusus bagi pejabat kota pada ayat berikutnya.
