id: ACT.16.11
reference: Acts 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: id
  text: Jadi, setelah bertolak dari Troas, kami berlayar langsung menuju Samotrake, dan keesokan harinya menuju Neapolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: setelah bertolak
  rationale: Dalam konteks pelayaran, ἀνάγω berarti bertolak atau berlayar meninggalkan pelabuhan. 'Setelah bertolak' alami dalam bahasa Indonesia dan mempertahankan urutan tindakan partisipial.
- source_word: οὖν
  choice: Jadi
  rationale: οὖν menandai kelanjutan atau konsekuensi naratif. 'Jadi' menghubungkan perjalanan ini secara wajar dengan peristiwa sebelumnya.
- source_word: ἀπὸ Τρῳάδος
  choice: dari Troas
  rationale: Frasa ini menyatakan tempat keberangkatan; 'Troas' merupakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: εὐθυδρομήσαμεν
  choice: kami berlayar langsung
  rationale: Kata kerja ini berarti berlayar dengan haluan lurus atau langsung. Pilihan ini mempertahankan unsur pelayaran dan arah langsung dalam ungkapan Indonesia yang alami.
- source_word: εἰς Σαμοθρᾴκην
  choice: menuju Samotrake
  rationale: εἰς menunjukkan tujuan. 'Samotrake' adalah bentuk transliterasi Indonesia yang sesuai.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: dan keesokan harinya
  rationale: Ungkapan datif temporal ini berarti pada hari berikutnya, sedangkan δέ melanjutkan rangkaian perjalanan.
- source_word: εἰς Νέαν Πόλιν
  choice: menuju Neapolis
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan secara harfiah sebagai 'Kota Baru'; 'Neapolis' adalah bentuk yang mapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif perjalanan yang ringkas dan bermartabat. Tidak diperlukan catatan kaki karena makna bahari dan urutan waktunya dapat disampaikan secara jelas tanpa menghilangkan ambiguitas penting.
