id: ACT.16.16
reference: Acts 16:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: id
  text: Pada suatu ketika, ketika kami sedang pergi ke tempat doa, seorang budak perempuan yang mempunyai roh Piton[a] menemui kami. Ia mendatangkan keuntungan besar bagi tuan-tuannya dengan meramal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh peramalan.” Secara harfiah bahasa Yunani menyebut “roh Piton,” istilah khas budaya yang berkaitan dengan ramalan.
    reason: alternative_reading
  - marker: b
    text: Atau, “dengan melakukan praktik ramalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Pada suatu waktu
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif yang memperkenalkan suatu kejadian; bentuk Indonesia ini alami dan tidak arkais.
- source_word: πορευομένων ἡμῶν
  choice: ketika kami sedang pergi
  rationale: Menyampaikan tindakan latar yang berlangsung bersamaan dengan pertemuan tersebut.
- source_word: εἰς τὴν προσευχὴν
  choice: ke tempat doa
  rationale: Dalam konteks Kisah Para Rasul, frasa ini kemungkinan menunjuk pada tempat yang dikenal sebagai lokasi berkumpul untuk berdoa, bukan hanya kegiatan berdoa.
- source_word: παιδίσκην τινά
  choice: seorang budak perempuan
  rationale: παιδίσκη dapat menunjuk pada budak atau pelayan perempuan; penyebutan para tuan serta keuntungan ekonomi mereka membuat status perbudakannya menonjol.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: yang mempunyai roh Piton
  rationale: Mempertahankan istilah budaya khusus πύθων sebagai nama yang terkait dengan ramalan, tanpa langsung meratakannya menjadi penafsiran umum.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: kami bertemu dengan
  rationale: Mengungkapkan peristiwa utama secara alami dalam bahasa Indonesia tanpa menentukan secara berlebihan pihak yang memulai pertemuan.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: mendatangkan keuntungan besar
  rationale: Menunjukkan manfaat ekonomi yang besar dan berulang bagi para tuannya.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: bagi tuan-tuannya
  rationale: κύριοι di sini adalah orang-orang yang menguasai atau memiliki budak perempuan itu, bukan gelar ilahi.
- source_word: μαντευομένη
  choice: dengan meramal
  rationale: Padanan modern yang mudah dipahami untuk kegiatan memberikan nubuat manti atau melakukan praktik divinasi.
theological_decisions:
- issue: Cara menerjemahkan πνεῦμα πύθωνα yang sarat latar budaya
  choice: roh Piton
  alternative: roh peramal / roh yang membuatnya dapat meramal
  rationale: Teks utama mempertahankan kekhususan istilah Yunani dan ketegangan konseptualnya; catatan kaki menjelaskan fungsi istilah itu bagi pembaca modern.
- issue: Apakah παιδίσκη perlu memperlihatkan status tidak merdeka
  choice: budak perempuan
  alternative: pelayan perempuan
  rationale: Konteks para tuan yang memperoleh laba darinya mendukung penyebutan status perbudakan secara jelas, tanpa memperhalus eksploitasi ekonominya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Istilah “roh Piton” dipertahankan dalam teks untuk kedekatan dengan sumber, lalu dijelaskan melalui catatan kaki; susunan kalimat dipecah agar jelas bagi pembaca umum.
