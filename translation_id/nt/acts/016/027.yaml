  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: id
  text: Ketika penjaga penjara itu terbangun dan melihat pintu-pintu penjara terbuka[a], ia menghunus pedangnya dan hendak membunuh diri[b], karena menyangka bahwa para tahanan telah melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “melihat bahwa pintu-pintu penjara telah dibuka.” Bentuk partisip perfek bahasa Yunani menekankan keadaan pintu-pintu yang sudah terbuka.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani μάχαιρα dapat berarti pedang atau senjata berbilah yang lebih pendek, seperti belati; “pedang” dipakai sebagai padanan umum dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: terbangun
  rationale: Gabungan adjektiva dan partisip ini secara idiomatis menyatakan peralihan ke keadaan sadar dari tidur; 'terbangun' alami dan tepat dalam bahasa Indonesia.
- source_word: ὁ δεσμοφύλαξ
  choice: kepala penjara
  rationale: Istilah ini menunjuk kepada petugas yang bertanggung jawab atas para tahanan; 'kepala penjara' merupakan padanan kontekstual yang lazim dan lebih spesifik daripada 'penjaga'.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: melihat pintu-pintu penjara terbuka
  rationale: Partisip perfek pasif menekankan keadaan pintu sebagai hasil dari tindakan membukanya. Susunan ini menyampaikan keadaan tersebut secara alami tanpa menentukan siapa yang membukanya.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: menghunus pedangnya
  rationale: Verba bersama μάχαιρα lazim berarti mengeluarkan senjata dari sarungnya. 'Menghunus pedangnya' ringkas dan idiomatis.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: hampir membunuh dirinya sendiri
  rationale: ἤμελλεν menyatakan tindakan yang segera akan dilakukan, sedangkan ἀναιρεῖν dalam konteks ini berarti membunuh. 'Hampir' secara alami menandai kedekatan tindakan itu.
- source_word: νομίζων
  choice: karena menyangka
  rationale: Partisip ini menyatakan dugaan yang menjadi alasan tindakannya; 'menyangka' mempertahankan bahwa kesimpulan tersebut belum tentu benar.
- source_word: ἐκπεφευγέναι
  choice: telah melarikan diri
  rationale: Infinitif perfek menyatakan pelarian yang dianggap sudah terjadi; 'telah melarikan diri' mempertahankan aspek selesai dan cocok dengan konteks tahanan.
- source_word: τοὺς δεσμίους
  choice: para tahanan
  rationale: Dalam konteks penjara, kata ini menunjuk kepada orang-orang yang ditahan; 'para tahanan' merupakan padanan modern yang jelas.
