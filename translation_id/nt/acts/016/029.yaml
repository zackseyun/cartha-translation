  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: id
  text: Lalu, setelah meminta lampu-lampu, ia bergegas masuk dan, sambil gemetar ketakutan, tersungkur di hadapan Paulus dan Silas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjatuhkan diri di hadapan Paulus dan Silas.” Ungkapan ini dapat menunjukkan ketakutan, permohonan, atau sikap merendahkan diri, dan tidak harus berarti menyembah.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Dalam konteks ini δέ melanjutkan alur cerita, bukan menyatakan pertentangan yang kuat.
- source_word: αἰτήσας φῶτα
  choice: ia meminta penerang
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Bentuk jamak φῶτα merujuk secara umum pada benda-benda yang memberi terang; 'penerang' tidak membatasi maknanya pada lampu atau obor tertentu.
- source_word: εἰσεπήδησεν
  choice: bergegas masuk
  rationale: Verba ini menggambarkan gerakan masuk yang mendadak dan kuat. 'Bergegas masuk' alami dalam bahasa Indonesia dan menyampaikan urgensinya tanpa mengharuskan arti harfiah 'melompat'.
- source_word: ἔντρομος γενόμενος
  choice: dengan gemetar
  rationale: Ungkapan ini menggambarkan keadaan terguncang oleh ketakutan. 'Dengan gemetar' mempertahankan gambaran jasmaninya secara alami; unsur takut tersirat dalam konteks dan makna ἔντρομος.
- source_word: προσέπεσεν τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: tersungkur di hadapan Paulus dan Silas
  rationale: προσπίπτω menyatakan jatuh di hadapan seseorang dalam ketakutan, permohonan, atau penghormatan. 'Tersungkur di hadapan' mempertahankan tindakan fisiknya tanpa menyatakan bahwa ia menyembah mereka.
theological_decisions:
- issue: Sifat tindakan kepala penjara terhadap Paulus dan Silas
  choice: Tindakan fisik karena takut dan sikap memohon atau merendahkan diri, diterjemahkan 'tersungkur di hadapan Paulus dan Silas.'
  alternative: Ia menyembah Paulus dan Silas.
  rationale: Verba Yunani dapat berarti jatuh di hadapan seseorang tanpa harus menunjukkan penyembahan religius. Konteks mendukung ketakutan dan permohonan yang mendesak, sehingga terjemahan tidak menambahkan klaim teologis yang tidak diwajibkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang ringkas dan bermartabat. 'Penerang' dipakai sebagai istilah umum bagi sumber-sumber cahaya; 'bergegas masuk' menyampaikan gerakan mendadak; 'tersungkur' mempertahankan kekuatan tindakan tanpa menentukan postur secara berlebihan.
