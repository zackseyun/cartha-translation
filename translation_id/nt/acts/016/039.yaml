  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Subjek “para pejabat itu” diulang pada kalimat kedua untuk menghindari ketidakjelasan rujukan kata ganti. Penanda catatan kaki ditempatkan langsung dalam teks utama.
