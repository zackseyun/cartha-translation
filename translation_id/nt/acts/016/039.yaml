  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: id
  text: Lalu para pejabat itu datang dan membujuk mereka[a]. Setelah membawa mereka keluar, para pejabat itu meminta[b] mereka meninggalkan kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memohon kepada mereka” atau “mendesak mereka”. Kata Yunani ini dalam konteks lain dapat berarti “menghibur”, tetapi di sini kemungkinan besar menyatakan upaya meredakan dan mendamaikan keadaan setelah para pejabat memperlakukan Paulus dan Silas dengan buruk.
    reason: lexical_alternative
  - marker: b
    text: 'Kata “meminta” berbentuk imperfek dalam bahasa Yunani dan dapat menyiratkan permintaan yang berlangsung atau berulang: “terus meminta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: datang
  rationale: Partisip aoris ini menandai tindakan yang mendahului permohonan para pejabat; bentuk verbal berurutan terdengar alami dalam bahasa Indonesia.
- source_word: παρεκάλεσαν
  choice: memohon kepada
  rationale: Dalam konteks para pejabat yang berusaha meredakan keadaan setelah memperlakukan Paulus dan Silas secara tidak sah, pilihan ini menyampaikan nada lunak dan hormat tanpa memaksakan arti 'menghibur'.
- source_word: αὐτούς
  choice: mereka
  rationale: Kata ganti ini merujuk kepada Paulus dan Silas.
- source_word: ἐξαγαγόντες
  choice: setelah membawa mereka keluar
  rationale: Partisip aoris ini menyatakan tindakan membawa Paulus dan Silas keluar sebelum permintaan berikutnya, sekaligus mempertahankan urutan narasi.
- source_word: ἠρώτων
  choice: meminta
  rationale: ἐρωτάω di sini berarti mengajukan permintaan. Imperfeknya dapat menyiratkan tindakan yang berlangsung atau berulang, tetapi terjemahan utama dibuat wajar dan nuansanya dicatat dalam catatan kaki.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: meninggalkan kota itu
  rationale: Ungkapan ini secara idiomatis menyampaikan isi permintaan agar mereka pergi dari kota tersebut.
