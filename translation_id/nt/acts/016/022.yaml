id: ACT.16.22
reference: Acts 16:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: id
  text: Orang banyak itu pun bersama-sama bangkit melawan mereka[a], lalu para magistrat, setelah menanggalkan pakaian mereka, terus memerintahkan supaya mereka dipukuli dengan tongkat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama-sama menyerang mereka.” Kata kerja Yunani menekankan tindakan bermusuhan yang dilakukan orang banyak secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Para magistrat ini adalah pejabat sipil Romawi di Filipi; secara lebih teknis, mereka dapat disebut “pretor.”
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: bersama-sama bangkit melawan
  rationale: Ungkapan ini mempertahankan unsur tindakan kolektif sekaligus permusuhan, tanpa mempersempit maknanya menjadi serangan fisik semata.
- source_word: ὄχλος
  choice: orang banyak
  rationale: Padanan alami dan netral dalam bahasa Indonesia; 'massa' dapat memberi nuansa sosial-politis tambahan, sedangkan 'gerombolan' terlalu menafsirkan sikap mereka.
- source_word: κατ’ αὐτῶν
  choice: melawan mereka
  rationale: Menyampaikan arah permusuhan yang dinyatakan oleh κατά dengan genitif dalam konteks ini.
- source_word: στρατηγοὶ
  choice: para pejabat kota
  rationale: Dalam konteks Filipi, istilah ini menunjuk kepada penguasa sipil koloni Romawi. Padanan ini mudah dipahami, sementara keterangan teknis diberikan dalam catatan kaki.
- source_word: περιρήξαντες
  choice: merobek ... dari tubuh
  rationale: Partisip ini mendahului perintah pemukulan dan menggambarkan pakaian yang disobek atau ditanggalkan dengan paksa untuk menyiapkan hukuman.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: pakaian dari tubuh mereka
  rationale: Kata ganti merujuk kepada Paulus dan Silas. Penambahan 'dari tubuh' memperjelas bahwa pakaian merekalah yang disobek atau ditanggalkan, bukan pakaian para pejabat.
- source_word: ἐκέλευον
  choice: terus memerintahkan
  rationale: Bentuk imperfek dipertahankan sebagai tindakan perintah yang sedang berlangsung dalam adegan tersebut.
- source_word: ῥαβδίζειν
  choice: agar mereka dipukuli dengan tongkat
  rationale: Menyatakan secara tepat hukuman badan dengan tongkat, bukan cambuk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat mempertahankan urutan tindakan Yunani, sementara 'terus memerintahkan' menyampaikan aspek imperfek secara alami.
