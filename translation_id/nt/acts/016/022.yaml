revisions:
- from: Orang banyak itu pun bersama-sama bangkit melawan mereka,[a] lalu para pejabat kota merobek pakaian dari tubuh mereka dan terus memerintahkan agar mereka dipukuli dengan tongkat.[b]
  to: Orang banyak itu pun bersama-sama bangkit melawan mereka[a], lalu para magistrat, setelah menanggalkan pakaian mereka, terus memerintahkan supaya mereka dipukuli dengan tongkat.[b]
  rationale: Revisi mengganti ungkapan yang janggal dan berpotensi mengaburkan tindakan menanggalkan pakaian dengan padanan Indonesia baku yang jelas. Istilah "magistrat" meningkatkan kedekatan dengan στρατηγοί, sedangkan catatan kaki mempertahankan penjelasan historis. Unsur kolektif, permusuhan, urutan tindakan, aspek imperfek perintah, dan pemukulan dengan tongkat tetap dipertahankan.
