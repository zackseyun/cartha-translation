  - severity: low
    issue: Padanan στρατηγοί dapat dibuat lebih dekat
    rationale: '"Para magistrat" adalah serapan baku yang lebih spesifik untuk pejabat sipil tersebut daripada "para pejabat kota"; catatan kaki tetap menyediakan konteks Romawi dan istilah teknis "pretor".'
