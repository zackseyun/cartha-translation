id: ACT.16.20
reference: Acts 16:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: id
  text: Setelah membawa mereka menghadap para pejabat kota[a], mereka berkata, “Orang-orang ini, yang adalah orang Yahudi[b], mengacaukan kota kita,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pretor,” yaitu pejabat sipil Romawi di sebuah koloni seperti Filipi.
    reason: cultural_note
  - marker: b
    text: Atau “orang Yudea.” Istilah Yunani ini dapat menunjuk kepada orang Yahudi secara umum atau orang yang berasal dari Yudea; di sini “orang Yahudi” paling sesuai dengan tuduhan yang menyoroti identitas etnis-keagamaan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: setelah membawa
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului kata kerja utama εἶπαν; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: στρατηγοῖς
  choice: para pejabat kota
  rationale: Dalam konteks Filipi sebagai koloni Romawi, istilah ini menunjuk kepada pejabat sipil tertinggi kota. Pilihan ini jelas bagi pembaca modern tanpa menghilangkan konteks historis yang dijelaskan dalam catatan kaki.
- source_word: ἐκταράσσουσιν
  choice: mengacaukan
  rationale: Kata kerja ini menyatakan tindakan menimbulkan kegemparan atau kekacauan serius; 'mengacaukan' mempertahankan kekuatan tuduhan dan aspek kini dalam konteks ujaran langsung.
- source_word: ἡμῶν τὴν πόλιν
  choice: kota kita
  rationale: Pronomina posesif menonjolkan rasa kepemilikan dan solidaritas sipil para penuduh; 'kota kita' mengungkapkannya secara alami.
- source_word: Ἰουδαῖοι
  choice: orang Yahudi
  rationale: Dalam konteks diaspora ini, istilah tersebut paling mungkin menunjuk kepada identitas etnis-keagamaan, bukan semata-mata asal geografis dari Yudea.
- source_word: ὑπάρχοντες
  choice: karena mereka
  rationale: Partisip ini kemungkinan menyatakan keadaan yang dijadikan dasar atau unsur tuduhan. 'Karena mereka orang Yahudi' membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia, tanpa mengubah isi tuduhan.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Orang-orang ini
  rationale: Ungkapan ini merujuk khusus kepada Paulus dan Silas; bentuk Indonesia ini alami dan tetap menunjukkan sekelompok laki-laki melalui konteks.
theological_decisions:
- issue: Penerjemahan Ἰουδαῖοι dalam tuduhan bernuansa etnis-keagamaan
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Di Filipi, tuduhan tersebut mengontraskan identitas Yahudi Paulus dan Silas dengan identitas sipil Romawi setempat. Ayat ini melaporkan retorika bermusuhan para penuduh, bukan penilaian teologis narator terhadap orang Yahudi secara keseluruhan.
- issue: Hubungan partisip ὑπάρχοντες dengan tuduhan utama
  choice: karena mereka orang Yahudi
  alternative: yang adalah orang Yahudi
  rationale: Partisip dapat dipahami sebagai keadaan penyerta atau alasan retoris bagi tuduhan. Dalam konteks xenofobia sipil pada ayat berikutnya, hubungan kausal paling alami, tetapi terjemahan tetap menyajikannya sebagai perkataan para penuduh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Para pejabat kota' dipilih agar mudah dipahami, sedangkan istilah historis teknis dicantumkan dalam catatan kaki. Susunan ujaran mempertahankan nada tuduhan dan penekanan identitas kelompok dalam teks sumber.
