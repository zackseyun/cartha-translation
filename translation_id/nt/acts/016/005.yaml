id: ACT.16.5
reference: Acts 16:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: id
  text: Jadi, jemaat-jemaat terus diteguhkan dalam iman[a] dan jumlah mereka bertambah dari hari ke hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunaninya dapat berarti bahwa jemaat-jemaat diteguhkan dalam iman Kristen sebagai keyakinan dan cara hidup yang mereka anut bersama, atau secara lebih umum bahwa mereka diteguhkan dalam iman.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai rangkuman sekaligus peralihan yang bertolak dari kisah sebelumnya. “Jadi” wajar dalam bahasa Indonesia dan tidak menerjemahkan μέν secara berlebihan.
- source_word: ἐκκλησίαι
  choice: jemaat-jemaat
  rationale: Dalam konteks ini kata tersebut menunjuk kepada komunitas-komunitas Kristen setempat. “Jemaat-jemaat” merupakan padanan baku dan jelas dalam bahasa Indonesia.
- source_word: ἐστερεοῦντο
  choice: terus diteguhkan
  rationale: Bentuk imperfek pasif menggambarkan tindakan yang berlangsung dalam waktu lampau. “Terus diteguhkan” mempertahankan sifat berkelanjutan dan suara pasifnya.
- source_word: τῇ πίστει
  choice: dalam iman
  rationale: Frasa datif ini menyatakan ranah tempat jemaat-jemaat diteguhkan. “Dalam iman” alami dalam bahasa Indonesia dan tetap membiarkan πίστις merujuk pada iman Kristen bersama ataupun iman dalam pengertian lebih umum.
- source_word: ἐπερίσσευον
  choice: bertambah
  rationale: Dalam hubungannya dengan τῷ ἀριθμῷ, verba ini menyatakan pertumbuhan jumlah. Bentuk imperfek bersama keterangan “dari hari ke hari” cukup jelas menyampaikan proses yang terus berlangsung.
- source_word: τῷ ἀριθμῷ
  choice: jumlah mereka
  rationale: Datif ini menyatakan segi pertambahan. “Jumlah mereka bertambah” lebih alami daripada terjemahan harfiah “bertambah dalam jumlah” dan referennya tetap jelas.
- source_word: καθ’ ἡμέραν
  choice: dari hari ke hari
  rationale: Padanan ini mempertahankan nuansa distributif dan pertumbuhan yang berlangsung secara berulang setiap hari.
theological_decisions:
- issue: Makna πίστις dengan kata sandang
  choice: iman, dengan kemungkinan utama menunjuk pada iman Kristen yang dianut bersama
  alternative: iman sebagai kepercayaan pribadi orang-orang percaya
  rationale: Kata sandang dan konteks jemaat mendukung pengertian komunal atau objektif, tetapi ungkapan Yunaninya juga dapat dipahami secara lebih umum. Teks utama memakai “dalam iman” dan catatan kaki mempertahankan ambiguitas itu tanpa memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mempertahankan ringkasan naratif serta dua tindakan yang berlangsung terus-menerus tanpa terdengar kaku.
