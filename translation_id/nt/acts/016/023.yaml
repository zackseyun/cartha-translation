  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: id
  text: Setelah menimpakan banyak pukulan kepada mereka[a], para pejabat itu menjebloskan mereka ke dalam penjara[b] dan memerintahkan penjaga penjara itu untuk menjaga mereka dengan ketat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menimpakan banyak pukulan kepada mereka”; kata Yunani ini tidak menyebutkan alat yang digunakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “rumah tahanan”; kata Yunani ini secara umum dapat menunjuk tempat orang ditahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: berkali-kali memukuli
  rationale: Ungkapan ini menyatakan banyak pukulan yang ditimpakan kepada Paulus dan Silas tanpa menentukan alatnya. Bentuk verbal ini paling alami dalam bahasa Indonesia dan tetap mempertahankan gagasan banyaknya pukulan.
- source_word: τε
  choice: dan
  rationale: Partikel penghubung ini meneruskan rangkaian tindakan dalam narasi; dalam bahasa Indonesia, hubungannya terwakili secara alami oleh susunan kalimat dan kata 'dan' sebelum tindakan berikutnya.
- source_word: ἐπιθέντες
  choice: setelah ... memukuli
  rationale: Partisip ini secara idiomatis berarti menimpakan pukulan. 'Setelah' memperjelas hubungan waktunya dengan tindakan utama, yaitu menjebloskan mereka ke penjara.
- source_word: ἔβαλον εἰς φυλακήν
  choice: menjebloskan mereka ke dalam penjara
  rationale: '''Menjebloskan'' mempertahankan daya ungkap βάλλω yang menunjukkan tindakan keras atau paksa, dan lebih kuat daripada sekadar ''memasukkan''.'
- source_word: φυλακήν
  choice: penjara
  rationale: Dalam konteks tempat tahanan yang diawasi petugas, 'penjara' merupakan padanan umum, jelas, dan alami.
- source_word: παραγγείλαντες
  choice: memerintahkan
  rationale: Kata ini menyatakan arahan yang berwibawa; 'memerintahkan' mempertahankan kekuatan tersebut.
- source_word: δεσμοφύλακι
  choice: kepala penjara
  rationale: Istilah Yunani menunjuk petugas yang bertanggung jawab atas para tahanan. 'Kepala penjara' alami dalam konteks ini dan menunjukkan tanggung jawab resmi, tanpa mengartikannya sebagai sekadar penjaga biasa.
- source_word: ἀσφαλῶς
  choice: dengan ketat
  rationale: Dalam konteks penahanan, kata ini menekankan penjagaan yang aman sehingga tahanan tidak dapat melarikan diri, bukan keselamatan tahanan.
- source_word: τηρεῖν
  choice: menjaga
  rationale: Dalam konteks penjara, 'menjaga' secara jelas menyampaikan tindakan mengawasi dan memastikan para tahanan tetap berada dalam tahanan.
- source_word: αὐτούς
  choice: mereka
  rationale: Kata ganti ini merujuk kepada Paulus dan Silas sebagai orang yang dipenjarakan dan harus dijaga.
