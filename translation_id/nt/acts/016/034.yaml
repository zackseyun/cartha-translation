id: ACT.16.34
reference: Acts 16:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: id
  text: Kemudian ia membawa mereka naik ke rumahnya[a], menghidangkan makanan kepada mereka, dan bersukacita bersama seluruh isi rumahnya[b] karena ia telah percaya kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke rumah itu”; konteks menunjuk kepada rumah kepala penjara.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani dapat juga dipahami sebagai penekanan bahwa seluruh isi rumah turut bersukacita; sebagian penafsir memahami klausa ini sebagai menyiratkan bahwa mereka juga ikut percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: membawa mereka naik
  rationale: Partisip aoris ini menyatakan gerakan ke atas, kemungkinan dari ruang tahanan menuju bagian rumah; bentuk ini juga mempertahankan urutan tindakan sebelum ia menghidangkan makanan.
- source_word: εἰς τὸν οἶκον
  choice: ke rumahnya
  rationale: Secara harfiah berarti 'ke rumah itu', tetapi konteks dengan jelas menunjuk kepada rumah kepala penjara; pronomina posesif membuat rujukan itu alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: παρέθηκεν τράπεζαν
  choice: menghidangkan makanan kepada mereka
  rationale: Ungkapan ini secara harfiah berarti menaruh atau menyediakan meja, tetapi secara idiomatis menunjuk pada penyediaan jamuan atau makanan.
- source_word: ἠγαλλιάσατο
  choice: bersukacita
  rationale: Kata kerja ini menyatakan sukacita yang kuat. 'Bersukacita' bermartabat dan alami; intensitasnya tetap terasa dari konteks tanpa tambahan kata yang tidak wajib.
- source_word: πανοικεὶ
  choice: bersama seluruh isi rumahnya
  rationale: Adverbia ini menunjuk pada keterlibatan seisi rumah. 'Seluruh isi rumahnya' mempertahankan cakupan rumah tangga, bukan hanya keluarga inti.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: karena ia telah percaya kepada Allah
  rationale: Partisip perfek maskulin tunggal paling langsung merujuk kepada kepala penjara dan menyatakan keadaan yang timbul dari tindakan percaya. Dalam hubungan kalimat ini, klausa sebab memberi bahasa Indonesia yang alami, meski nuansa partisipalnya tetap memiliki kemungkinan lain.
theological_decisions:
- issue: Cakupan sukacita dan tindakan percaya dalam hubungannya dengan seisi rumah
  choice: Kepala penjara bersukacita bersama seluruh isi rumahnya karena ia sendiri telah percaya kepada Allah.
  alternative: Seluruh isi rumah ikut bersukacita dan juga dipahami telah percaya kepada Allah.
  rationale: πανοικεὶ secara langsung dapat menerangkan tindakan bersukacita, sedangkan πεπιστευκώς berbentuk maskulin tunggal dan paling langsung merujuk kepada kepala penjara. Namun, susunan Yunani dapat dipahami sebagai menyiratkan keterlibatan seisi rumah dalam iman; kemungkinan itu dicatat tanpa dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Isi rumah' dipilih untuk mencakup rumah tangga secara luas. Ambiguitas mengenai apakah seluruh rumah tangga juga percaya dipertahankan melalui catatan kaki.
