id: ACT.16.28
reference: Acts 16:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: id
  text: Namun, Paulus berseru dengan suara keras, “Jangan lakukan sesuatu yang mencelakakan dirimu,[a] karena kami semua ada di sini!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan celakakan dirimu.” Secara lebih harfiah, ungkapan Yunani ini berbunyi, “Jangan lakukan sesuatu yang buruk terhadap dirimu,” tetapi dalam konteks ini menunjuk pada niat kepala penjara untuk melukai dirinya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: berseru
  rationale: Kata kerja ini menunjukkan seruan kuat dalam keadaan mendesak; bersama φωνῇ μεγάλῃ, “berseru dengan suara keras” menyampaikan intensitasnya secara alami.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras dengan tindakan kepala penjara yang hendak dilakukan pada ayat sebelumnya.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara keras
  rationale: Frasa datif ini menyatakan cara Paulus berseru dan dipertahankan sebagai ungkapan konkret yang wajar dalam bahasa Indonesia.
- source_word: λέγων
  choice: (diungkapkan langsung melalui tanda petik)
  rationale: Partisipel ini memperkenalkan isi seruan. Dalam bahasa Indonesia, isi ujaran dapat diperkenalkan secara alami langsung setelah verba “berseru” tanpa menambahkan “katanya” yang berlebihan.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Jangan lakukan sesuatu yang mencelakakan dirimu
  rationale: Terjemahan ini mempertahankan keluasan ungkapan Yunani, secara harfiah tidak melakukan sesuatu yang buruk terhadap diri sendiri, sambil menyampaikan konteks bahaya terhadap diri dengan bahasa Indonesia yang alami.
- source_word: ἅπαντες
  choice: semua
  rationale: Bentuk ini menekankan keseluruhan orang yang ada; dalam konteks “kami semua” menjelaskan bahwa tidak seorang tahanan pun melarikan diri.
- source_word: γάρ
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan kepala penjara tidak boleh mencelakakan dirinya.
- source_word: ἐνθάδε
  choice: di sini
  rationale: Padanan lokasi yang langsung dan alami.
- source_word: ὁ Παῦλος
  choice: Paulus
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku bahasa Indonesia.
