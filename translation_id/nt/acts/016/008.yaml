  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: id
  text: Lalu, setelah melewati Misia[a], mereka turun ke Troas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah melalui Misia.” Partisip Yunani ini dapat diterjemahkan dengan beberapa cara yang berdekatan; konteksnya menunjukkan bahwa mereka meneruskan perjalanan dan tidak berhenti di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan ini meneruskan alur cerita tanpa menyatakan pertentangan yang kuat.
- source_word: παρελθόντες
  choice: setelah melewati
  rationale: Partisip aoris aktif dari παρέρχομαι dengan objek akusatif dapat menggambarkan perjalanan melewati, melintasi, atau melalui suatu wilayah. Ungkapan ini alami dalam bahasa Indonesia dan tetap cukup terbuka mengenai jalur tepat yang ditempuh.
- source_word: Μυσίαν
  choice: Misia
  rationale: Nama wilayah ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: κατέβησαν
  choice: mereka turun
  rationale: Bentuk aoris dari καταβαίνω mempertahankan arah gerak ke bawah, mungkin menuju daerah pantai atau tempat yang lebih rendah.
- source_word: εἰς
  choice: ke
  rationale: Dengan nama kota sebagai tujuan perjalanan, 'ke' merupakan padanan bahasa Indonesia yang paling alami.
- source_word: Τρῳάδα
  choice: Troas
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
