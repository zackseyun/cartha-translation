base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: id
  text: 'Lalu penjaga penjara itu menyampaikan kata-kata ini kepada Paulus: “Para pejabat kota telah mengirim pesan bahwa kalian boleh dibebaskan.[a] Jadi sekarang, keluarlah dan pergilah dengan damai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah mengirim agar kalian dibebaskan.” Bahasa Yunani tidak menyebutkan apa yang dikirim; konteksnya menunjukkan bahwa yang dikirim adalah pesan atau perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: menyampaikan
  rationale: Kata ini menyatakan tindakan meneruskan atau melaporkan informasi; “menyampaikan” alami dalam konteks meneruskan pesan resmi.
- source_word: ὁ δεσμοφύλαξ
  choice: kepala penjara
  rationale: Menunjuk kepada orang yang bertanggung jawab menjaga penjara. “Kepala penjara” merupakan istilah Indonesia yang jelas dan lazim dalam konteks ini.
- source_word: τοὺς λόγους τούτους
  choice: pesan itu
  rationale: Secara harfiah berarti “perkataan-perkataan ini,” tetapi dalam konteks naratif merujuk pada satu pesan yang diteruskan.
- source_word: Ἀπέσταλκαν
  choice: telah mengirim perintah
  rationale: Bentuk perfektum menunjukkan tindakan yang sudah dilakukan dan masih relevan. Objek verba tidak dinyatakan dalam bahasa Yunani; “perintah” dijelaskan oleh klausa berikutnya dan membuat maksudnya alami dalam bahasa Indonesia.
- source_word: οἱ στρατηγοί
  choice: para pejabat kota
  rationale: Di Filipi, istilah ini menunjuk kepada para penguasa sipil koloni Romawi. “Para pejabat kota” mudah dipahami tanpa memakai gelar teknis Romawi.
- source_word: ἵνα ἀπολυθῆτε
  choice: agar kalian dibebaskan
  rationale: Klausa ini menyatakan isi atau tujuan perintah, dan bentuk pasifnya menunjuk pada pembebasan Paulus serta Silas dari tahanan.
- source_word: νῦν οὖν
  choice: Jadi sekarang
  rationale: Mempertahankan unsur kesimpulan pada οὖν dan penanda waktu pada νῦν dengan susunan Indonesia yang alami.
- source_word: ἐξελθόντες πορεύεσθε
  choice: keluarlah dan pergilah
  rationale: Partisip aoris diikuti imperatif membentuk urutan tindakan. Dua imperatif Indonesia menyampaikan urutan itu secara jelas dan alami.
- source_word: ἐν εἰρήνῃ
  choice: dengan damai
  rationale: Ungkapan ini menyatakan keberangkatan dalam keadaan damai atau aman; terjemahan tersebut ringkas dan wajar dalam bahasa Indonesia.
