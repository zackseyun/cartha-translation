  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: id
  text: Setelah keluar dari penjara, mereka pergi menemui Lidia. Ketika mereka melihat saudara-saudara seiman[a] itu, mereka memberi semangat kepada saudara-saudara seiman itu, lalu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, kata ini berbentuk maskulin jamak, tetapi dapat merujuk kepada sesama orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Setelah keluar dari penjara
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; klausa waktu dengan “setelah” menyampaikan urutan itu secara alami. “Penjara” mengacu pada tempat tahanan tertentu dalam konteks.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: mereka pergi menemui Lidia
  rationale: Ungkapan ini menunjukkan bahwa mereka mendatangi Lidia. Terjemahan ini alami dan tidak menambahkan kata “rumah,” yang tidak disebutkan secara eksplisit dalam teks Yunani.
- source_word: ἰδόντες
  choice: ketika melihat
  rationale: Partisip aoris diterjemahkan sebagai klausa waktu sambil mempertahankan citra dasar verba “melihat.”
- source_word: παρεκάλεσαν
  choice: mereka menguatkan hati mereka
  rationale: παρακαλέω dapat berarti mendorong, menasihati, menghibur, atau menguatkan. Dalam konteks sesudah pemenjaraan, ungkapan ini mempertahankan cakupan pastoral yang luas tanpa membatasinya hanya pada nasihat atau penghiburan.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara seiman
  rationale: Dalam konteks komunitas Kristen, ἀδελφοί menunjuk sesama orang percaya. “Seiman” memperjelas arti kekerabatan rohani dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan informasi tentang bentuk dan kemungkinan cakupan istilah Yunani.
- source_word: ἐξῆλθαν
  choice: lalu berangkat
  rationale: Verba ini menandai kepergian mereka. “Berangkat” menghindari pengulangan janggal dengan “keluar” pada awal ayat dan tidak menentukan secara berlebihan apakah yang ditinggalkan ialah rumah Lidia atau kota itu.
theological_decisions:
- issue: Cakupan ἀδελφοί dalam pertemuan orang percaya yang mungkin terdiri atas laki-laki dan perempuan
  choice: saudara-saudara seiman
  alternative: saudara-saudara laki-laki seiman; orang-orang percaya
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi dalam pemakaian komunitas dapat mencakup sesama orang percaya dari kedua jenis kelamin. Bahasa Indonesia tidak mengharuskan “saudara-saudara” dibatasi pada laki-laki; catatan kaki mempertahankan ambiguitas referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Struktur ayat dibuat alami tanpa menambahkan “rumah Lidia,” sementara ambiguitas tujuan keberangkatan terakhir tetap dipertahankan.
