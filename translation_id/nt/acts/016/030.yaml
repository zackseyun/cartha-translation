id: ACT.16.30
reference: Acts 16:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: id
  text: Sesudah membawa mereka ke luar, ia berkata, “Tuan-tuan[a], apa yang harus saya lakukan supaya saya diselamatkan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “Tuan-tuan” menerjemahkan bentuk jamak Yunani kyrioi sebagai sapaan hormat kepada Paulus dan Silas, bukan sebagai gelar ilahi “Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: Sesudah membawa mereka ke luar
  rationale: Partisipel aoristus menunjukkan tindakan yang mendahului kata kerja utama; susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan urutan tindakan serta gerak menuju luar.
- source_word: ἔφη
  choice: ia berkata
  rationale: Bentuk imperfek φημί di sini berfungsi sebagai pengantar tuturan dalam narasi; bentuk lampau sederhana kontekstual ini paling wajar dalam bahasa Indonesia.
- source_word: Κύριοι
  choice: Tuan-tuan
  rationale: Vokatif jamak κύριος di sini merupakan sapaan hormat kepada Paulus dan Silas, bukan gelar ilahi. “Tuan-tuan” mempertahankan bentuk jamak dan nuansa sosial yang sopan.
- source_word: τί με δεῖ ποιεῖν
  choice: apa yang harus saya lakukan
  rationale: δεῖ menyatakan keharusan, sedangkan ποιεῖν menyatakan tindakan. Terjemahan ini jelas, ringkas, dan wajar dalam bahasa Indonesia modern.
- source_word: ἵνα σωθῶ
  choice: supaya saya diselamatkan
  rationale: ἵνα dengan subjungtif pasif menyatakan tujuan atau hasil. “Supaya” mempertahankan hubungan klausal dan “diselamatkan” mempertahankan bentuk pasif.
theological_decisions:
- issue: Makna σωθῶ dalam pertanyaan kepala penjara
  choice: diselamatkan
  alternative: diluputkan / dibebaskan
  rationale: Dalam Kisah Para Rasul, σώζω dapat merujuk pada penyelamatan dari bahaya maupun keselamatan dalam arti yang lebih luas. Konteks langsung dan jawaban pada ayat berikutnya mendukung “diselamatkan,” tanpa mempersempitnya ke dalam suatu sistem doktrinal tertentu.
- issue: Fungsi Κύριοι sebagai sapaan
  choice: Tuan-tuan
  alternative: Tuhan-tuhan / Para tuan
  rationale: Karena sapaan ini ditujukan kepada dua manusia, bentuk tersebut dipahami secara sosial dan hormat, bukan sebagai pengakuan gelar ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “saya” dipilih karena kepala penjara sedang menyapa Paulus dan Silas dengan hormat. Bentuk “ke luar” dipakai sebagai frasa preposisional yang menyatakan arah.
