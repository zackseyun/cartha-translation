  source_fidelity: Terjemahan dengan tepat mempertahankan hubungan perjalanan dalam κἀκεῖθεν, tujuan εἰς Φιλίππους, uraian Filipi sebagai kota terkemuka di suatu wilayah Makedonia, statusnya sebagai koloni Romawi, serta lamanya tinggal yang tidak diperinci. Pilihan “terkemuka” untuk πρώτη merupakan penanganan yang hati-hati atas frasa Yunani yang diperdebatkan dan tidak memaksakan klaim administratif tertentu.
