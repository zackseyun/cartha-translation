id: ACT.16.12
reference: Acts 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: id
  text: dan dari sana ke Filipi[a], yang merupakan sebuah kota terkemuka di wilayah Makedonia, sebuah koloni Romawi[b]. Kami tinggal di kota itu selama beberapa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kota pertama di wilayah Makedonia.” Frasa Yunaninya sulit; kata “pertama” dapat menunjuk pada kedudukan, keunggulan, atau urutan.
    reason: alternative_reading
  - marker: b
    text: Artinya, sebuah kota yang diberi status khusus sebagai koloni di bawah pemerintahan Romawi.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: dan dari sana
  rationale: Mempertahankan hubungan dengan rangkaian perjalanan sebelumnya tanpa menambahkan kata kerja yang tidak dinyatakan dalam teks Yunani.
- source_word: εἰς Φιλίππους
  choice: ke Filipi
  rationale: Kata depan εἰς dengan nama kota secara wajar menyatakan tujuan perjalanan; Filipi adalah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: sebuah kota terkemuka di wilayah Makedonia
  rationale: Frasa Yunani ini sulit dan πρώτη dapat menunjuk pada urutan, kedudukan, atau keunggulan. 'Terkemuka' menyampaikan kemungkinan makna keunggulan tanpa mengklaim secara pasti bahwa Filipi adalah ibu kota atau kota pertama secara geografis.
- source_word: κολωνία
  choice: sebuah koloni Romawi
  rationale: κολωνία menunjuk pada status resmi Filipi sebagai koloni Roma; 'Romawi' memperjelas acuan historis yang tersirat.
- source_word: ἦμεν ... διατρίβοντες
  choice: kami tinggal
  rationale: Konstruksi perifrastis ini menyatakan keberadaan yang berlangsung selama suatu waktu; 'tinggal' alami dan tepat dalam narasi perjalanan.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: di kota itu
  rationale: Dalam narasi bahasa Indonesia, 'kota itu' secara alami merujuk kembali kepada Filipi yang baru disebut, tanpa mengubah acuannya.
- source_word: ἡμέρας τινάς
  choice: selama beberapa hari
  rationale: Menyampaikan jangka waktu yang tidak ditentukan tanpa memberi ketepatan yang tidak terdapat dalam bahasa Yunani.
theological_decisions:
- issue: Makna πρώτη dalam gambaran tentang Filipi
  choice: sebuah kota terkemuka
  alternative: kota pertama di wilayah Makedonia
  rationale: Pilihan ini tidak menetapkan secara berlebihan status administratif atau urutan geografis yang diperdebatkan, sementara catatan kaki mempertahankan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan awal yang tidak memiliki kata kerja eksplisit dipertahankan agar tetap terhubung dengan ayat sebelumnya. Semua penanda catatan kaki dicantumkan dalam teks utama.
