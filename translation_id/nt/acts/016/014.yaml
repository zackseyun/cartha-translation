id: ACT.16.14
reference: Acts 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: id
  text: Dan ada seorang perempuan bernama Lidia, penjual kain ungu dari kota Tiatira, yang menyembah Allah,[a] sedang mendengarkan; Tuhan membuka hatinya untuk memperhatikan apa yang dikatakan oleh Paulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan “seorang penyembah Allah” dan mungkin menunjuk pada seorang bukan Yahudi yang berbakti kepada Allah Israel.
    reason: Menjelaskan kemungkinan fungsi frasa σεβομένη τὸν θεόν sebagai sebutan bagi penganut bukan Yahudi yang menghormati Allah Israel.
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Seorang perempuan
  rationale: Menyampaikan ketidakpastian yang ditandai τις secara wajar dalam bahasa Indonesia; καί berfungsi sebagai penghubung naratif dan tidak perlu selalu diterjemahkan secara tersendiri.
- source_word: ὀνόματι Λυδία
  choice: bernama Lidia
  rationale: Padanan idiomatis dan langsung untuk ungkapan datif ὀνόματι dengan nama diri.
- source_word: πορφυρόπωλις
  choice: penjual kain ungu
  rationale: Menunjuk pada pedagang barang atau kain berwarna ungu; pilihan ini jelas bagi pembaca modern tanpa mempersempitnya menjadi pakaian mewah.
- source_word: πόλεως Θυατείρων
  choice: dari kota Tiatira
  rationale: Mengungkapkan asal Lidia secara alami sambil mempertahankan sebutan kota dalam teks sumber.
- source_word: σεβομένη τὸν θεόν
  choice: yang menyembah Allah
  rationale: Mengungkapkan penghormatan dan ibadah kepada Allah secara alami, tanpa menjadikan istilah tersebut label teknis dalam teks utama.
- source_word: ἤκουεν
  choice: sedang mendengarkan
  rationale: Bentuk imperfek menunjukkan tindakan yang tengah berlangsung; 'mendengarkan' juga menyampaikan perhatian aktif, bukan sekadar mendengar bunyi.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku bagi κύριος dalam konteks ilahi, tanpa menambahkan identifikasi yang tidak dinyatakan secara eksplisit.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: membuka hatinya
  rationale: Mempertahankan metafora teks sumber dengan ungkapan yang alami dan dikenal dalam bahasa Indonesia.
- source_word: προσέχειν
  choice: untuk memperhatikan
  rationale: Menjaga arti perhatian yang terarah; 'menanggapi' akan menafsirkan hasil tindakan itu secara lebih jauh daripada teks.
- source_word: τοῖς λαλουμένοις
  choice: apa yang disampaikan
  rationale: Padanan idiomatis untuk bentuk partisip pasif yang merujuk pada isi perkataan, tanpa mengubahnya menjadi tanggapan atau penerimaan.
- source_word: ὑπὸ τοῦ Παύλου
  choice: oleh Paulus
  rationale: Menyatakan pelaku dari verba pasif secara langsung dan memakai bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks Yunani hanya menyebut ὁ κύριος. Terjemahan tidak menentukan lebih jauh apakah acuan yang dimaksud secara khusus adalah Yesus atau Allah, sehingga keterbukaan teks tetap terpelihara.
- issue: Status keagamaan Lidia dalam σεβομένη τὸν θεόν
  choice: yang menyembah Allah
  alternative: seorang penyembah Allah; yang takut akan Allah
  rationale: Frasa ini dapat menunjuk pada seorang bukan Yahudi yang berbakti kepada Allah Israel, tetapi teks utama menerjemahkan tindakan/sikapnya tanpa memaksakan status teknis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak narasi serta membedakan tindakan Lidia yang sedang mendengarkan dari tindakan Tuhan yang membuka hatinya.
