source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: id
  text: Perempuan itu terus mengikuti Paulus dan kami sambil berseru-seru, “Orang-orang ini adalah hamba-hamba Allah Yang Mahatinggi, yang memberitakan kepada kalian jalan keselamatan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini dapat dipahami sebagai “jalan keselamatan” atau “suatu jalan keselamatan”; bentuknya tidak secara eksplisit menandai apakah jalan itu tentu atau tak tentu.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: terus mengikuti
  rationale: Partisipel kini bersama verba utama berbentuk imperfek menggambarkan tindakan yang berlangsung atau berulang; “terus mengikuti” menyampaikan aspek duratif itu secara alami.
- source_word: ἔκραζεν
  choice: berseru-seru
  rationale: Bentuk imperfek menunjukkan seruan keras yang berlangsung atau berulang. Reduplikasi dalam “berseru-seru” mempertahankan nuansa tersebut tanpa menentukan emosi tertentu.
- source_word: δοῦλοι
  choice: hamba-hamba
  rationale: Dalam hubungan dengan Allah, “hamba” secara alami menyatakan ketundukan dan kepemilikan, serta dalam bahasa Indonesia memiliki cakupan historis yang dapat mencakup status budak tanpa menimbulkan kesan modern yang tidak perlu dari “budak-budak Allah”.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: Allah Yang Mahatinggi
  rationale: Ungkapan ini mempertahankan gelar ilahi superlatif ὕψιστος dalam bentuk baku dan idiomatis bahasa Indonesia.
- source_word: καταγγέλλουσιν
  choice: memberitakan
  rationale: Verba ini menunjuk pada pengumuman atau pemberitaan secara terbuka; “memberitakan” alami dalam konteks pewartaan kepada khalayak.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Dativus ini menunjuk kepada para pendengar pemberitaan. “Kalian” memperjelas bahwa bentuk Yunani tersebut jamak.
- source_word: ὁδὸν σωτηρίας
  choice: jalan keselamatan
  rationale: Bahasa Indonesia tidak memakai artikel tentu atau tak tentu seperti bahasa Inggris, sehingga “jalan keselamatan” secara alami mempertahankan keterbukaan frasa Yunani terhadap pemahaman tentu maupun tak tentu.
theological_decisions:
- issue: Ketentuan atau ketaktentuan ὁδὸν σωτηρίας
  choice: jalan keselamatan
  alternative: suatu jalan keselamatan / jalan menuju keselamatan
  rationale: Nomina ὁδόν tidak memakai artikel dalam Yunani, tetapi ketiadaan artikel tidak dengan sendirinya menetapkan bahwa maknanya tak tentu. Bentuk Indonesia tanpa “suatu” tidak memaksakan salah satu tafsiran dan dengan demikian mempertahankan ambiguitas serta ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Berseru-seru” mempertahankan tindakan berulang, “kalian” menandai penerima jamak, dan susunan kalimat langsung dibuat alami tanpa mengurangi isi sumber Yunani.
