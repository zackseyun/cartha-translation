  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: id
  text: Namun, ketika mereka sampai di dekat Misia[a], mereka berusaha masuk ke Bitinia, dan Roh Yesus tidak mengizinkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sepanjang Misia” atau “berhadapan dengan Misia.” Ungkapan Yunani ini kemungkinan menunjuk pada daerah perbatasan Misia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες δὲ
  choice: Namun, ketika mereka sampai
  rationale: Partisip aoristus menyatakan urutan waktu secara alami, sedangkan δέ menandai perkembangan atau kontras ringan dalam narasi.
- source_word: κατὰ τὴν Μυσίαν
  choice: di dekat Misia
  rationale: Dalam keterangan geografis ini, κατά dengan akusatif kemungkinan menunjuk pada posisi di sekitar atau sepanjang wilayah Misia, mungkin kawasan perbatasannya; pilihan ini tidak menyiratkan secara pasti bahwa mereka telah memasuki wilayah itu.
- source_word: ἐπείραζον
  choice: mereka berusaha
  rationale: Bentuk imperfek menggambarkan upaya yang sedang dilakukan atau dicoba.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: masuk ke Bitinia
  rationale: εἰς menandai gerak menuju dan masuk ke suatu wilayah; dalam konteks perjalanan, frasa ringkas ini alami dalam bahasa Indonesia.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: tidak mengizinkan mereka
  rationale: Menerjemahkan ἐάω secara langsung tanpa memperkuatnya menjadi larangan eksplisit.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Roh Yesus
  rationale: Mempertahankan ungkapan kristologis yang khas dalam teks Yunani dan tidak menyelaraskannya secara diam-diam menjadi 'Roh Kudus'.
theological_decisions:
- issue: Ungkapan kristologis τὸ πνεῦμα Ἰησοῦ
  choice: Roh Yesus
  alternative: Roh Kudus; Roh
  rationale: Teks Yunani secara eksplisit menyebut Yesus. Terjemahan mempertahankan bentuk tersebut tanpa menambahkan penjelasan doktrinal atau mengharmonisasikannya dengan ungkapan yang lebih lazim.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Konjungsi kedua diterjemahkan 'tetapi' untuk memperjelas kontras antara upaya mereka dan tindakan Roh, tanpa mengubah hubungan maknanya.
