id: ACT.16.10
reference: Acts 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: id
  text: Setelah Paulus melihat penglihatan itu, kami segera berusaha berangkat ke Makedonia karena menyimpulkan bahwa Allah telah memanggil kami untuk memberitakan kabar baik kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Setelah
  rationale: Menandai urutan waktu dan kelanjutan narasi secara alami dalam bahasa Indonesia.
- source_word: τὸ ὅραμα εἶδεν
  choice: Paulus melihat penglihatan itu
  rationale: Subjek Yunani hanya dinyatakan melalui bentuk verba, tetapi konteks langsung menunjuk kepada Paulus; penyebutan namanya mencegah ambiguitas akibat peralihan segera kepada 'kami'.
- source_word: εὐθέως ἐζητήσαμεν
  choice: kami segera berusaha
  rationale: εὐθέως menyatakan tindakan tanpa penundaan, sedangkan ζητέω dengan infinitif di sini berarti berusaha atau mengupayakan sesuatu.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: berangkat ke Makedonia
  rationale: Ungkapan ini secara harfiah berarti 'keluar menuju/ke Makedonia'; 'berangkat ke' menyampaikan gerak meninggalkan tempat asal menuju tujuan dengan wajar.
- source_word: συμβιβάζοντες
  choice: karena menyimpulkan
  rationale: Partisipel ini menyatakan penarikan kesimpulan dari penglihatan dan secara kontekstual memberi alasan bagi tindakan mereka.
- source_word: προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Allah telah memanggil kami
  rationale: Bentuk perfek menandakan panggilan yang telah terjadi dan tetap relevan bagi keputusan mereka; 'memanggil' mempertahankan inisiatif ilahi.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: untuk memberitakan kabar baik kepada orang-orang di sana
  rationale: '''Memberitakan kabar baik'' jelas bagi pembaca modern; αὐτούς merujuk pada penduduk Makedonia, sehingga ''orang-orang di sana'' terdengar alami dan memperjelas acuannya.'
theological_decisions:
- issue: Peralihan narasi ke orang pertama jamak
  choice: Mempertahankan 'kami'
  alternative: Mengubahnya menjadi narasi impersonal atau orang ketiga
  rationale: Teks Yunani secara eksplisit beralih ke ἐζητήσαμεν ('kami berusaha'); terjemahan mempertahankan ciri teks ini tanpa menetapkan teori kepengarangan.
- issue: Sifat tuntunan ilahi
  choice: Allah telah memanggil kami
  alternative: Allah sedang menuntun atau mengundang kami
  rationale: προσκαλέομαι menyatakan tindakan memanggil, bukan sekadar tuntunan umum atau undangan lemah.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Paulus' dieksplisitkan dari konteks untuk menghindari kekaburan saat kalimat beralih dari subjek tunggal tersirat kepada 'kami'. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus dipertahankan dalam ayat ini.
