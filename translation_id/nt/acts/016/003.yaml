id: ACT.16.3
reference: Acts 16:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: id
  text: Paulus ingin agar Timotius pergi bersamanya[a]. Maka Paulus membawanya dan menyunatnya karena orang-orang Yahudi yang berada di daerah itu[b]. Sebab, mereka semua tahu bahwa ayah Timotius adalah orang Yunani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar bersamanya”; dalam konteks ini dapat berarti berangkat atau mengadakan perjalanan bersamanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “demi orang-orang Yahudi” atau “oleh karena orang-orang Yahudi.”
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks ini, sebutan “orang Yunani” kemungkinan juga menandai bahwa ayah Timotius bukan orang Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: Timotius
  rationale: Kata ganti penunjuk akusatif ini merujuk kepada Timotius dalam konteks sebelumnya. Menyebut namanya menghasilkan rujukan yang jelas dan alami dalam bahasa Indonesia tanpa menambah penekanan doktrinal.
- source_word: ἠθέλησεν
  choice: ingin
  rationale: Bentuk aoris θέλω menyatakan keinginan atau maksud Paulus; 'ingin' merupakan padanan modern dan wajar.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: pergi bersamanya
  rationale: Secara harfiah berarti 'keluar bersamanya', tetapi dalam konteks perjalanan menunjuk pada keberangkatan bersama. 'Pergi bersamanya' mempertahankan makna dasar dengan bahasa Indonesia yang alami.
- source_word: λαβὼν
  choice: Maka Paulus membawanya
  rationale: Partisip aoris mendahului tindakan utama dan dapat berarti mengambil atau membawa seseorang. Bentuk ini menyampaikan urutan tindakan secara lancar serta memperjelas subjek.
- source_word: περιέτεμεν
  choice: menyunatnya
  rationale: Padanan langsung dan lazim bagi περιτέμνω; tidak diperlukan eufemisme.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: karena orang-orang Yahudi
  rationale: διά dengan akusatif menyatakan alasan atau motif. 'Karena' mempertahankan keluasan makna tanpa menentukan apakah tindakannya semata-mata demi kepentingan mereka.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: yang berada di daerah itu
  rationale: Frasa ini menunjuk kepada komunitas Yahudi setempat. 'Daerah itu' lebih alami daripada terjemahan harfiah 'tempat-tempat itu' dalam bahasa Indonesia.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: Sebab, mereka semua tahu
  rationale: '''Sebab'' mempertahankan fungsi penjelas γάρ, sedangkan ''mereka semua'' mencerminkan penekanan ἅπαντες dan merujuk pada orang-orang Yahudi tadi.'
- source_word: Ἕλλην
  choice: orang Yunani
  rationale: Ἕλλην secara langsung berarti orang Yunani. Dalam konteks ini dapat pula menandai seseorang sebagai bukan Yahudi, tetapi terjemahan utama mempertahankan sebutan sumber.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: ayah Timotius adalah
  rationale: ὑπάρχω di sini paling alami diterjemahkan sebagai keadaan identitas sederhana. Pengulangan nama Timotius mencegah ambiguitas rujukan kata ganti dalam bahasa Indonesia.
theological_decisions:
- issue: Alasan penyunatan Timotius sehubungan dengan orang-orang Yahudi setempat
  choice: Teks menyatakan bahwa Paulus bertindak karena orang-orang Yahudi setempat mengetahui latar belakang ayah Timotius.
  alternative: Menafsirkan tindakan itu sebagai syarat keselamatan, pengesahan teologis atas kewajiban sunat, atau semata-mata strategi misi.
  rationale: Ayat ini hanya menyebut alasan naratif tersebut. Terjemahan tidak memasukkan kesimpulan doktrinal yang tidak dinyatakan dan dengan demikian mempertahankan ketegangan dengan bagian Perjanjian Baru lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami; hubungan sebab-akibat tetap dipertahankan melalui 'karena' dan 'Sebab'. Semua penanda catatan kaki muncul dalam teks utama.
