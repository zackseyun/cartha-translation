id: ACT.16.24
reference: Acts 16:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: id
  text: Setelah menerima perintah seperti itu, ia menjebloskan mereka ke ruang penjara bagian dalam[a] dan mengunci kaki mereka dalam pasung kayu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang penjara paling dalam.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “ke dalam kayu”; dalam konteks ini yang dimaksud adalah alat dari kayu untuk menahan kaki, yaitu pasung.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: perintah seperti itu
  rationale: παραγγελία menunjuk pada perintah atau instruksi yang berwenang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan acuan τοιαύτην kepada perintah pada konteks sebelumnya.
- source_word: λαβὼν
  choice: setelah menerima
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; bentuk anak kalimat ini lebih alami daripada konstruksi partisipial harfiah.
- source_word: ἔβαλεν
  choice: menjebloskan
  rationale: βάλλω dapat berarti melemparkan atau memasukkan. Dalam konteks pemenjaraan, 'menjebloskan' menyampaikan tindakan memasukkan dengan paksa tanpa memberi kesan bahwa tubuh mereka secara harfiah dilempar.
- source_word: ἐσωτέραν φυλακήν
  choice: ruang penjara bagian dalam
  rationale: ἐσωτέραν adalah bentuk komparatif yang berarti lebih ke dalam. Pilihan ini menunjuk pada bagian penjara yang lebih dalam dan aman sambil mempertahankan kemungkinan nuansa superlatif dalam catatan kaki.
- source_word: ἠσφαλίσατο
  choice: mengunci
  rationale: ἀσφαλίζω berarti membuat aman atau mengikat dengan kokoh. Dalam hubungan dengan alat penahan kaki, 'mengunci' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: τοὺς πόδας αὐτῶν
  choice: kaki mereka
  rationale: πούς secara langsung berarti kaki; bentuk jamak dan pronomina pemilik dipertahankan.
- source_word: εἰς τὸ ξύλον
  choice: dalam pasung kayu
  rationale: ξύλον secara harfiah berarti kayu atau benda dari kayu, tetapi dalam konteks penjara menunjuk pada alat kayu untuk menahan kaki. 'Pasung kayu' menyampaikan referen budaya secara jelas.
