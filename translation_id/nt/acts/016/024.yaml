  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Menjebloskan' mempertahankan kerasnya perlakuan tanpa terdengar kuno, sedangkan 'pasung kayu' menjelaskan benda yang dimaksud bagi pembaca umum.
