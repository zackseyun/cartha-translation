id: ACT.16.13
reference: Acts 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: id
  text: Pada hari Sabat kami pergi ke luar gerbang, ke tepi sungai, di mana kami mengira ada tempat berdoa.[a] Setelah duduk, kami berbicara kepada perempuan-perempuan yang telah berkumpul di situ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di mana kami mengira ada doa.” Kata Yunani yang dipakai dapat berarti doa itu sendiri atau tempat yang dikhususkan untuk berdoa; dalam konteks ini, “tempat berdoa” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Pada hari Sabat
  rationale: Ungkapan Yunani ini secara idiomatis menunjuk pada hari Sabat; terjemahan harfiah seperti 'hari segala Sabat' tidak wajar dan mengaburkan maksud.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης παρὰ ποταμόν
  choice: kami pergi ke luar gerbang menuju tepi sungai
  rationale: Terjemahan ini mempertahankan gerak keluar melewati gerbang dan menuju lokasi di sisi sungai tanpa menambahkan kata 'kota', yang tidak dinyatakan secara eksplisit.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: karena kami mengira di sana ada tempat berdoa
  rationale: ἐνομίζομεν menyatakan dugaan, sedangkan προσευχή dapat berarti doa atau tempat yang dikhususkan untuk berdoa. Konteks lokasi dan pertemuan mendukung arti tempat berdoa.
- source_word: καὶ καθίσαντες
  choice: Setelah duduk
  rationale: Partisip aoris paling wajar menunjukkan tindakan yang mendahului kata kerja utama.
- source_word: ἐλαλοῦμεν
  choice: kami berbicara
  rationale: Bentuk imperfek menunjukkan kegiatan yang sedang berlangsung; dalam bahasa Indonesia, konteks naratif sudah cukup menyampaikan aspek tersebut tanpa konstruksi progresif yang kaku.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: kepada perempuan-perempuan yang telah berkumpul di situ
  rationale: Bentuk partisip menunjukkan para perempuan telah berkumpul sebelum percakapan berlangsung; 'di situ' memperjelas rujukan tempat secara alami dari konteks.
theological_decisions:
- issue: Makna προσευχή dalam latar ini
  choice: tempat berdoa
  alternative: doa; rumah ibadat
  rationale: Konteks menggambarkan suatu lokasi di tepi sungai tempat orang berkumpul, dan προσευχή dapat menunjuk pada tempat doa dalam pemakaian Yahudi Helenistis. 'Rumah ibadat' terlalu institusional dan tidak dinyatakan langsung oleh teks, sedangkan kemungkinan arti abstrak 'doa' tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Tempat berdoa' dipilih karena lebih alami daripada 'tempat doa', sementara ambiguitas leksikal sumber dipertahankan melalui catatan kaki.
