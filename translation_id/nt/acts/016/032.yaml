  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: id
  text: Lalu mereka menyampaikan firman Tuhan kepadanya dan kepada semua orang yang ada di rumahnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pesan tentang Tuhan.” Ungkapan Yunani “firman Tuhan” dapat berarti pesan yang menjadi milik Tuhan, berasal dari Tuhan, atau mengenai Tuhan.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “kepadanya, bersama dengan semua orang yang ada di rumahnya”; atau, “kepadanya dan kepada seluruh rumah tangganya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: menyampaikan
  rationale: Dalam konteks pemberitaan Injil, λαλέω menunjuk pada komunikasi lisan. “Menyampaikan” terdengar alami dalam bahasa Indonesia dan cukup kuat tanpa memberi nuansa pewartaan publik yang tidak dinyatakan oleh teks.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif tunggal ini merujuk kepada kepala penjara dan bersama λαλέω secara alami menyatakan pihak yang diajak bicara.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος di sini menunjuk pada pesan Kristen yang disampaikan. “Firman” mempertahankan ungkapan Perjanjian Baru yang lazim, sedangkan “pesan” merupakan alternatif yang lebih eksplisit secara kontekstual.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: 'Genitif dalam ungkapan “firman Tuhan” dibiarkan terbuka: firman itu dapat dipahami berasal dari, menjadi milik, atau mengenai Tuhan. Bentuk ini juga alami dan mapan dalam bahasa Indonesia.'
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: dan kepada semua orang yang ada di rumahnya
  rationale: Walaupun σύν secara bentuk berarti “bersama dengan”, dalam konteks ini semua orang di rumah itu turut menjadi penerima perkataan. Pengulangan makna datif dengan “dan kepada” menjadikan maksud tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: οἰκίᾳ
  choice: rumah
  rationale: οἰκία dapat berarti bangunan rumah atau seisi rumah. “Orang yang ada di rumahnya” mempertahankan gambaran konkret tempat itu tanpa menutup kemungkinan bahwa yang dimaksud ialah anggota rumah tangganya.
theological_decisions:
- issue: Nuansa ungkapan τὸν λόγον τοῦ κυρίου
  choice: firman Tuhan
  alternative: pesan tentang Tuhan
  rationale: Genitif Yunani dapat menyatakan firman yang berasal dari atau menjadi milik Tuhan maupun pesan mengenai Tuhan. Terjemahan utama mempertahankan keluwesan itu dan tidak mempersempit maknanya secara teologis.
- issue: Cakupan penerima perkataan
  choice: kepadanya dan kepada semua orang yang ada di rumahnya
  alternative: kepadanya, bersama dengan semua orang yang ada di rumahnya
  rationale: σύν dipertahankan secara semantis sebagai penyertaan kelompok itu, tetapi konteks menunjukkan bahwa mereka juga mendengar pesan tersebut. Bentuk utama menghindari kesan bahwa mereka hanya hadir tanpa menjadi pihak yang dituju.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Lalu” menghubungkan ayat ini dengan alur sebelumnya; “menyampaikan firman Tuhan” mempertahankan idiom biblika tanpa terdengar terlalu kaku.
