  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: id
  text: dan mereka memberitakan adat istiadat yang tidak diperbolehkan bagi kita untuk menerima atau menjalankannya, karena kita orang Romawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai orang Romawi” atau “selaku orang Romawi.” Frasa partisip Yunani ini menyatakan alasan yang dikemukakan para penuduh untuk menolak adat istiadat tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: memberitakan
  rationale: Kata kerja ini menyatakan pengumuman atau pemberitaan secara terbuka. “Memberitakan” mempertahankan sifat tuduhan itu tanpa mempersempit maknanya menjadi pengajaran resmi.
- source_word: ἔθη
  choice: adat istiadat
  rationale: Bentuk jamak ini menunjuk pada kebiasaan atau praktik yang mapan. “Adat istiadat” merupakan padanan Indonesia yang alami dalam konteks sosial-keagamaan.
- source_word: οὐκ ἔξεστιν
  choice: tidak sah
  rationale: Ungkapan ini menyatakan sesuatu yang tidak diizinkan secara hukum atau tatanan sosial. “Tidak sah” mempertahankan nada yuridis dalam tuduhan tersebut tanpa menyatakan bahwa tuduhan itu benar.
- source_word: παραδέχεσθαι
  choice: untuk diterima
  rationale: Dalam konteks ini, kata tersebut berarti menerima atau mengadopsi adat sebagai sesuatu yang berlaku. “Diterima” cukup luas untuk mempertahankan nuansa itu.
- source_word: οὐδὲ ποιεῖν
  choice: ataupun dilakukan
  rationale: Bersama ἔθη, ποιεῖν berarti melakukan atau mempraktikkan adat. Bentuk pasif ini mengalir wajar setelah “untuk diterima” dan tetap dekat dengan susunan sumber.
- source_word: Ῥωμαίοις οὖσιν
  choice: karena kita adalah orang Romawi
  rationale: Frasa partisip datif ini menyatakan alasan yang dikemukakan para penuduh. “Karena” membuat fungsi kausalnya jelas dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana ini melanjutkan tuduhan dari ayat sebelumnya.
theological_decisions:
- issue: Sifat larangan dalam tuduhan
  choice: Menerjemahkan tuduhan dengan nada hukum-kewargaan, yaitu “tidak sah bagi kita”, tanpa mengesahkan kebenaran klaim tersebut.
  alternative: “tidak patut bagi kita” atau “tidak diperbolehkan bagi kita”
  rationale: Ayat ini melaporkan perkataan para penuduh, bukan penegasan narator mengenai hukum Romawi. Terjemahan mempertahankan bingkai yuridis para penuduh tanpa menambahkan kesimpulan bahwa klaim mereka benar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Adat istiadat” dipilih agar mudah dipahami pembaca umum; susunan kalimat mempertahankan nada resmi tuduhan di hadapan penguasa.
