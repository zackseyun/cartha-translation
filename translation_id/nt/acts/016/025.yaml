id: ACT.16.25
reference: Acts 16:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: id
  text: Kira-kira tengah malam, Paulus dan Silas berdoa sambil menyanyikan puji-pujian kepada Allah, dan para tahanan mendengarkan mereka dengan saksama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengarkan mereka.” Kata kerja Yunani yang digunakan dapat menyiratkan bahwa mereka mendengarkan dengan penuh perhatian atau minat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Kira-kira tengah malam
  rationale: κατά dengan akusatif waktu menunjukkan waktu sekitar suatu titik, bukan ketepatan mutlak. δέ bersifat penghubung ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Paulus dan Silas
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
- source_word: προσευχόμενοι ὕμνουν τὸν θεόν
  choice: berdoa sambil menyanyikan puji-pujian kepada Allah
  rationale: Partisipel kini προσευχόμενοι berlangsung bersamaan dengan verba imperfek ὕμνουν. 'Sambil' mengungkapkan tindakan serentak secara alami, sedangkan 'menyanyikan puji-pujian' mempertahankan arti khusus ὑμνέω.
- source_word: ἐπηκροῶντο
  choice: mendengarkan mereka dengan saksama
  rationale: Verba imperfek ini menggambarkan kegiatan mendengar yang sedang berlangsung dan dapat mengandung nuansa menyimak dengan perhatian; frasa Indonesia ini menyatakan nuansa tersebut secara jelas.
- source_word: οἱ δέσμιοι
  choice: para tahanan
  rationale: Dalam konteks penjara, δέσμιοι menunjuk kepada orang-orang yang ditahan atau dipenjarakan. 'Para tahanan' alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak dinyatakan.
