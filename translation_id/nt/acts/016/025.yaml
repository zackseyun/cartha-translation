  source_fidelity: Terjemahan setia kepada Yunani. “Kira-kira tengah malam” mencerminkan κατά dengan akusatif waktu; “berdoa sambil menyanyikan puji-pujian kepada Allah” menyampaikan keserempakan partisipel προσευχόμενοι dengan imperfek ὕμνουν; dan “para tahanan mendengarkan mereka dengan saksama” menangkap tindakan mendengarkan yang berlangsung serta nuansa perhatian dalam ἐπηκροῶντο.
