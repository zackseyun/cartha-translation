  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: id
  text: Ia juga tiba di Derbe dan di Listra. Dan lihatlah, di sana ada seorang murid bernama Timotius. Ia adalah anak seorang perempuan Yahudi yang percaya[a], sedangkan ayahnya orang Yunani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang setia.” Kata Yunani yang dipakai dapat berarti “percaya” atau “setia”; dalam konteks Kisah Para Rasul, arti “percaya” lebih mungkin di sini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν
  choice: tiba
  rationale: Kata kerja καταντάω dalam kisah perjalanan menyatakan bahwa seseorang mencapai atau tiba di suatu tempat. “Tiba” alami dalam bahasa Indonesia dan tidak menambahkan gagasan kelanjutan perjalanan yang tidak dinyatakan langsung oleh verba itu.
- source_word: δὲ καὶ
  choice: juga
  rationale: Gabungan ini melanjutkan kisah sekaligus memberi nuansa tambahan; “juga” menyampaikan fungsi aditifnya secara ringkas.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: di Derbe dan di Listra
  rationale: Dengan verba “tiba”, tujuan tempat secara idiomatis dinyatakan dengan “di”. Pengulangan “di” mencerminkan pengulangan εἰς dan menjaga kedua tempat tetap sejajar.
- source_word: καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: ἰδού menarik perhatian pembaca kepada tokoh yang baru diperkenalkan. “Lihatlah” mempertahankan daya penanda wacananya dan kejelasan naratif tanpa menghapus ungkapan tersebut.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: di sana ada seorang murid bernama Timotius
  rationale: Susunan ini alami dalam bahasa Indonesia, tetap menyatakan keberadaan murid itu di tempat tersebut, dan menerjemahkan ὀνόματι secara idiomatis dengan “bernama”.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: Ia anak dari seorang perempuan Yahudi yang percaya
  rationale: πιστῆς paling mungkin menunjuk kepada status perempuan itu sebagai orang percaya. Klausa relatif lebih alami dan jelas daripada rangkaian adjektiva yang padat dalam bahasa Indonesia.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: sedangkan ayahnya orang Yunani
  rationale: Frasa Yunani bersifat eliptis setelah “anak dari”. Bahasa Indonesia memerlukan pengungkapan eksplisit yang lebih wajar. “Sedangkan” mempertahankan kontras δέ tanpa menyiratkan pertentangan yang terlalu kuat.
- source_word: Ἕλληνος
  choice: orang Yunani
  rationale: Ἕλλην secara langsung menunjuk kepada orang Yunani dalam arti etnis atau budaya; menerjemahkannya sebagai “bukan Yahudi” akan memperluas makna.
theological_decisions:
- issue: Makna πιστῆς yang menerangkan ibu Timotius
  choice: yang percaya
  alternative: yang setia
  rationale: Dalam konteks Kisah Para Rasul, πιστός paling wajar menyatakan bahwa ia adalah orang yang percaya. Namun, arti “setia” tetap mungkin secara leksikal dan karena itu dicatat tanpa menutup ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Dan lihatlah” sengaja dipertahankan sebagai ungkapan naratif yang menonjol, sedangkan susunan pengenalan Timotius dibuat alami bagi pembaca Indonesia.
