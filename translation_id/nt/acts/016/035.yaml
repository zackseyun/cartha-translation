  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: id
  text: Ketika hari sudah pagi, para pejabat kota mengutus para pembawa tongkat[a] untuk menyampaikan pesan, “Bebaskan orang-orang itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “liktor,” yaitu pembantu resmi pejabat Romawi yang membawa tongkat sebagai lambang kewenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Ketika hari mulai terang
  rationale: Konstruksi genitif absolut ini menandai peralihan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna datangnya waktu pagi tanpa mempersempitnya menjadi saat fajar yang persis.
- source_word: ἀπέστειλαν
  choice: mengutus
  rationale: Verba ini berarti menyuruh seseorang pergi untuk menjalankan tugas. 'Mengutus' sesuai dengan tindakan resmi para pejabat terhadap para pembantu mereka.
- source_word: οἱ στρατηγοὶ
  choice: para pejabat kota
  rationale: Dalam konteks koloni Romawi Filipi, istilah ini menunjuk kepada para pejabat pemerintahan setempat, bukan jenderal militer. 'Pejabat kota' jelas bagi pembaca modern dan mempertahankan konteks sipil.
- source_word: τοὺς ῥαβδούχους
  choice: para pembawa tongkat
  rationale: Terjemahan harfiah ini mempertahankan gambaran konkret tentang pembantu resmi pejabat Romawi yang membawa tongkat sebagai lambang kewenangan; istilah teknisnya dijelaskan dalam catatan kaki.
- source_word: λέγοντες
  choice: dengan pesan
  rationale: Partisipel ini memperkenalkan isi perkataan yang disampaikan melalui para utusan. 'Dengan pesan' lebih alami daripada konstruksi harfiah 'dengan berkata' dalam bahasa Indonesia.
- source_word: Ἀπόλυσον
  choice: Bebaskan
  rationale: Imperatif aoris ini memerintahkan pembebasan orang-orang yang sedang ditahan. 'Bebaskan' sesuai dengan konteks hukum dan penjara.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: orang-orang itu
  rationale: Frasa ini menunjuk kepada Paulus dan Silas. 'Orang-orang itu' mempertahankan bentuk jamak dan nuansa penunjuk tanpa menambahkan informasi yang tidak diperlukan.
