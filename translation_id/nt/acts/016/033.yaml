id: ACT.16.33
reference: Acts 16:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: id
  text: Pada jam itu juga, saat masih malam, kepala penjara itu membawa mereka dan membasuh luka-luka mereka. Lalu ia dan semua anggota rumah tangganya segera dibaptis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia dan semua orang kepunyaannya.” Ungkapan Yunani ini menunjuk pada seluruh rumah tangganya, bukan hanya keluarga inti.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: membawa
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului pembasuhan. “Membawa” terdengar alami tanpa menambahkan tujuan atau cara yang tidak disebutkan.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: Pada jam itu juga, saat masih malam
  rationale: Ungkapan ini mempertahankan penekanan pada waktu malam dan tanggapan yang langsung, dengan susunan yang wajar dalam bahasa Indonesia modern.
- source_word: ἔλουσεν
  choice: membasuh
  rationale: Dalam konteks ini λούω menunjuk pada tindakan membersihkan Paulus dan Silas sehubungan dengan luka-luka mereka. “Membasuh” tepat, jelas, dan bermartabat.
- source_word: ἀπὸ τῶν πληγῶν
  choice: luka-luka mereka
  rationale: Sesudah λούω, frasa dengan ἀπό secara idiomatis berkaitan dengan pembersihan luka atau akibat luka. Terjemahan ini menyampaikan maksudnya secara alami tanpa mempertahankan konstruksi Yunani yang kaku.
- source_word: ἐβαπτίσθη
  choice: dibaptis
  rationale: Bentuk pasif menyatakan bahwa ia menerima baptisan. “Dibaptis” merupakan padanan baku dan tidak menentukan cara pelaksanaannya.
- source_word: οἱ αὐτοῦ πάντες
  choice: semua anggota rumah tangganya
  rationale: Ungkapan ini mencakup semua orang yang termasuk dalam lingkup domestiknya, lebih luas daripada keluarga inti saja.
- source_word: παραχρῆμα
  choice: segera
  rationale: Adverbia ini menegaskan bahwa baptisan berlangsung tanpa penundaan.
theological_decisions:
- issue: Cakupan οἱ αὐτοῦ πάντες dalam kaitannya dengan baptisan
  choice: semua anggota rumah tangganya
  alternative: seluruh keluarganya; semua orang yang menjadi tanggungannya
  rationale: Ayat ini menyatakan bahwa kepala penjara dan semua orang dalam lingkup rumah tangganya dibaptis, tetapi tidak menjelaskan usia, pengakuan pribadi, atau cara baptisan. Terjemahan tidak memasukkan kesimpulan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. “Kepala penjara” dipakai untuk membuat pelaku yang tersirat dalam kata ganti Yunani jelas dari konteks. Urutan membasuh lalu dibaptis dipertahankan, dan “segera” ditempatkan dekat dengan tindakan baptisan sesuai fungsi παραχρῆμα.
