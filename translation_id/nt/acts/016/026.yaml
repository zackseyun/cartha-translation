base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: id
  text: Tiba-tiba terjadilah gempa bumi yang besar sehingga fondasi penjara itu terguncang. Seketika itu juga semua pintu terbuka dan belenggu semua orang terlepas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rantai semua orang menjadi longgar.” Kata Yunani δεσμά dapat berarti “belenggu” atau “rantai”, dan ἀνέθη dapat diterjemahkan “terlepas” atau “menjadi longgar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Tiba-tiba
  rationale: Menandai kejadian yang mendadak dan mempertahankan daya naratif teks Yunani.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: terjadilah gempa bumi yang dahsyat
  rationale: Ungkapan ini alami dalam narasi Indonesia; 'dahsyat' menyampaikan besarnya gempa tanpa menambahkan penafsiran khusus.
- source_word: ὥστε σαλευθῆναι
  choice: sehingga ... terguncang
  rationale: '''Sehingga'' menyatakan hasil, sedangkan bentuk pasif Yunani dipertahankan secara alami melalui ''terguncang''.'
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: fondasi penjara itu
  rationale: '''Fondasi'' adalah istilah modern yang umum untuk unsur dasar bangunan; ''penjara'' merupakan padanan standar bagi tempat penahanan.'
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: semua pintu terbuka
  rationale: Bahasa Indonesia secara alami memakai bentuk intransitif 'terbuka', yang tetap menyampaikan keadaan hasil tanpa menentukan pelaku yang tidak disebutkan.
- source_word: παραχρῆμα
  choice: Seketika itu juga
  rationale: Menyampaikan bahwa akibat tersebut terjadi langsung dan memberi variasi alami setelah 'tiba-tiba'.
- source_word: πάντων
  choice: setiap orang
  rationale: Genitif ini menunjukkan bahwa belenggu milik semua orang yang ada dalam konteks; 'setiap orang' jelas dan ringkas.
- source_word: τὰ δεσμὰ
  choice: belenggu
  rationale: Istilah ini mencakup alat pengikat atau penahan tanpa mempersempit makna secara pasti menjadi rantai.
- source_word: ἀνέθη
  choice: terlepas
  rationale: Menyampaikan bahwa belenggu menjadi longgar atau tidak lagi mengikat, sambil mempertahankan ketidakpastian tentang mekanismenya.
