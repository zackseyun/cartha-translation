id: ACT.16.6
reference: Acts 16:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: id
  text: Mereka melintasi wilayah Frigia dan Galatia[b], karena Roh Kudus telah melarang mereka menyampaikan firman di Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Provinsi Asia di wilayah barat Asia Kecil pada zaman Romawi, bukan benua Asia modern.
    reason: cultural_note
  - marker: b
    text: Atau mungkin, “wilayah Frigia-Galatia.” Susunan bahasa Yunani dapat dipahami sebagai sebutan untuk satu kawasan.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: melintasi
  rationale: Bentuk aoristus dari διέρχομαι menyatakan perjalanan melalui suatu daerah; “melintasi” mempertahankan arah gerak itu secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung naratif ringan. Dalam bahasa Indonesia, kesinambungan narasi sudah jelas tanpa kata penghubung eksplisit; menambahkan “dan” di awal dapat terasa kurang alami.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: wilayah Frigia dan Galatia
  rationale: χώρα berarti wilayah atau daerah. Susunan Yunaninya dapat menunjuk pada dua kawasan yang dikoordinasikan atau satu kawasan Frigia-Galatia; teks utama dibuat wajar, sedangkan ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: κωλυθέντες
  choice: karena ... telah melarang mereka
  rationale: Partisip aoristus pasif κωλυθέντες menyatakan bahwa pelarangan oleh Roh Kudus menjadi keadaan atau alasan yang menyertai perjalanan. Bentuk aktif dalam bahasa Indonesia menyatakan pelaku ilahi dengan jelas tanpa mengubah makna.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Roh Kudus
  rationale: Frasa ini menunjuk kepada Roh Kudus sebagai pelaku larangan; kapitalisasi mengikuti pemakaian baku bahasa Indonesia untuk sebutan ilahi.
- source_word: λαλῆσαι
  choice: menyampaikan
  rationale: λαλέω secara dasar berarti berbicara. Dalam kolokasi dengan “firman”, “menyampaikan” terdengar alami dan tetap cukup luas tanpa mempersempitnya menjadi “berkhotbah” atau “memberitakan Injil”.
- source_word: τὸν λόγον
  choice: firman
  rationale: λόγος di sini merujuk pada pesan Kristen dan merupakan ungkapan khas dalam Lukas–Kisah Para Rasul. “Firman” mempertahankan ungkapan sumber tanpa mempersempitnya secara eksplisit menjadi “Injil”.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: di Asia
  rationale: Nama geografis dipertahankan sebagaimana dalam sumber; catatan kaki menjelaskan bahwa yang dimaksud ialah provinsi Romawi, bukan benua Asia modern.
theological_decisions:
- issue: Pelaku dan identitas Roh dalam larangan
  choice: Roh Kudus telah melarang mereka
  alternative: mereka telah dicegah oleh roh
  rationale: ὑπὸ τοῦ ἁγίου πνεύματος secara kuat menunjuk kepada Roh Kudus sebagai pelaku personal. Terjemahan ini mempertahankan agensi tersebut tanpa menambahkan penjelasan teologis di luar teks.
- issue: Hubungan partisip κωλυθέντες dengan tindakan perjalanan
  choice: karena Roh Kudus telah melarang mereka
  alternative: setelah dilarang oleh Roh Kudus
  rationale: Partisip aoristus dapat dipahami sebagai tindakan yang mendahului atau keadaan/alasan yang menyertai perjalanan. “Karena” cocok dengan alur narasi, tetapi tidak menentukan cara Roh menyampaikan larangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat mengikuti bentuk Indonesia yang lazim. Tanda catatan [b] ditempatkan setelah frasa geografis yang ambigu, sedangkan [a] ditempatkan setelah “Asia” sebagai penjelasan historis.
