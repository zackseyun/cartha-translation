  verdict: revise
  source_fidelity: 'Revisi diperlukan untuk mempertahankan dua unsur sumber dengan lebih tepat: αὐτοῖς tetap berupa pronomina tanpa tambahan “orang-orang di sana”, dan frasa “di Yerusalem” perlu jelas mencakup baik para rasul maupun para penatua. Bentuk jamak δόγματα juga sebaiknya tampak dalam bahasa Indonesia.'
  naturalness: Kalimat revisi tetap baku dan lancar. “Dalam perjalanan mereka melalui kota-kota” menyampaikan gerak berkelanjutan διεπορεύοντο tanpa mengesankan bahwa mereka berjalan kaki, sedangkan “untuk ditaati” secara alami menyatakan tujuan φυλάσσειν.
  terminology: “Ketetapan-ketetapan” sesuai untuk δόγματα dalam konteks keputusan resmi dan menghindari nuansa teknis “dogma”. “Rasul” dan “penatua” merupakan padanan baku. Catatan kaki diperbaiki agar alternatifnya sepadan dalam jumlah dan tidak menambahkan pelaku penerbitan yang tidak disebut secara eksplisit dalam ayat.
  issues:
  - severity: medium
    issue: “kepada orang-orang di sana” memperluas αὐτοῖς.
    rationale: Teks Yunani hanya memakai pronomina “kepada mereka”. Walaupun rujukannya dipahami dari konteks, tambahan tersebut tidak diperlukan dan kurang mempertahankan tingkat kekhususan sumber.
  - severity: medium
    issue: “para rasul dan para penatua di Yerusalem” dapat terbaca seolah-olah “di Yerusalem” hanya menerangkan para penatua.
    rationale: Frasa Yunani τῶν ἐν Ἱεροσολύμοις menerangkan gabungan “para rasul dan penatua”. Bahasa Indonesia perlu menandai cakupan itu secara eksplisit.
  - severity: low
    issue: “ketetapan” dalam teks tidak mencerminkan bentuk jamak δόγματα.
    rationale: Bentuk jamak “ketetapan-ketetapan” menjaga jumlah sumber dan selaras dengan alternatif catatan kaki “keputusan-keputusan”.
  - severity: low
    issue: “berjalan dari kota ke kota” dapat secara tidak perlu mengisyaratkan perjalanan kaki.
    rationale: διεπορεύοντο berarti melakukan perjalanan melalui kota-kota; “dalam perjalanan mereka melalui kota-kota” lebih netral dan tepat.
  revised_text: Dalam perjalanan mereka melalui kota-kota, mereka menyampaikan kepada mereka ketetapan-ketetapan[a] yang telah diputuskan oleh para rasul dan penatua yang ada di Yerusalem untuk ditaati.
