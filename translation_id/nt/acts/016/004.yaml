revisions:
- from: Ketika mereka berjalan dari kota ke kota, mereka menyampaikan kepada orang-orang di sana ketetapan[a] yang telah diputuskan oleh para rasul dan para penatua di Yerusalem untuk ditaati.
  to: Dalam perjalanan mereka melalui kota-kota, mereka menyampaikan kepada mereka ketetapan-ketetapan[a] yang telah diputuskan oleh para rasul dan penatua yang ada di Yerusalem untuk ditaati.
  rationale: Revisi menghilangkan perluasan referen pronominal, memperjelas bahwa lokasi Yerusalem berlaku bagi kedua kelompok pemimpin, mempertahankan bentuk jamak δόγματα, dan memilih ungkapan perjalanan yang tidak membatasi cara bepergian. Struktur “untuk ditaati” tetap menyatakan tujuan dari φυλάσσειν.
