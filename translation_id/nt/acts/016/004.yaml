id: ACT.16.4
reference: Acts 16:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: id
  text: Dalam perjalanan mereka melalui kota-kota, mereka menyampaikan kepada mereka ketetapan-ketetapan[a] yang telah diputuskan oleh para rasul dan penatua yang ada di Yerusalem untuk ditaati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keputusan-keputusan”; kata Yunani dogmata merujuk pada keputusan atau ketetapan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: berjalan dari kota ke kota
  rationale: Bentuk imperfek menggambarkan perjalanan yang berlangsung melalui sejumlah kota; ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan rute secara berlebihan.
- source_word: παρεδίδοσαν
  choice: menyampaikan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penerusan keputusan resmi kepada pihak lain. “Menyampaikan” terdengar alami sekaligus mempertahankan gagasan penyerahan sesuatu yang berwenang.
- source_word: αὐτοῖς
  choice: kepada orang-orang di sana
  rationale: Kata ganti ini secara kontekstual merujuk kepada orang-orang percaya di kota-kota itu. Pilihan ini memperjelas rujukannya dalam bahasa Indonesia tanpa mempersempitnya secara tegas menjadi “jemaat-jemaat”.
- source_word: φυλάσσειν
  choice: untuk ditaati
  rationale: Di sini φυλάσσω berarti mematuhi atau menjalankan dengan saksama, bukan sekadar menjaga atau menyimpan.
- source_word: δόγματα
  choice: ketetapan
  rationale: “Ketetapan” menyatakan keputusan resmi dan berwenang dari sidang di Yerusalem tanpa membawa nuansa teknis dari istilah “dogma” pada masa kemudian.
- source_word: κεκριμένα
  choice: yang telah diputuskan
  rationale: Partisipel perfektif pasif menunjuk pada keputusan yang sudah diambil dan tetap berlaku.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: para rasul dan para penatua
  rationale: Kedua istilah ini merupakan padanan baku dan jelas bagi pemimpin yang terlibat dalam keputusan di Yerusalem.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: di Yerusalem
  rationale: Frasa ini secara ringkas menunjukkan lokasi para rasul dan penatua tersebut.
- source_word: ὡς δὲ
  choice: Ketika
  rationale: Kata ini menyatakan hubungan waktu sambil melanjutkan alur narasi secara alami.
theological_decisions:
- issue: Wibawa keputusan sidang di Yerusalem
  choice: ketetapan
  alternative: keputusan; peraturan
  rationale: Pilihan ini mempertahankan sifat resmi dan mengikat dari hasil pertimbangan dalam Kisah Para Rasul 15, tanpa menyiratkan konsep dogma gerejawi dari masa yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan “orang-orang di sana” untuk memperjelas kata ganti Yunani tanpa secara eksplisit menambahkan “jemaat” atau “orang percaya” ke dalam teks.
