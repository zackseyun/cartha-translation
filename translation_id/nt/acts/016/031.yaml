base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: id
  text: Mereka menjawab, “Percayalah kepada Tuhan Yesus, maka kamu akan diselamatkan—kamu dan seisi rumahmu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seisi rumahmu” berarti orang-orang dalam rumah tanggamu, bukan bangunan rumahnya. Ungkapan ini tidak dengan sendirinya menjelaskan bagaimana setiap anggota rumah tangga menerima keselamatan.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Mereka menjawab
  rationale: Dalam konteks dialog, εἶπαν secara alami diterjemahkan “menjawab”; δέ berfungsi sebagai penghubung ringan dan tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Percayalah kepada
  rationale: Imperatif aoris Πίστευσον menyerukan tanggapan tegas, sedangkan ἐπί dengan akusatif menunjukkan pribadi yang menjadi arah iman. “Percayalah kepada” alami dalam bahasa Indonesia dan tidak menambahkan uraian tafsir.
- source_word: κύριον Ἰησοῦν
  choice: Tuhan Yesus
  rationale: “Tuhan” mempertahankan daya gelar kehormatan dan bobot kristologis κύριος; nama Ἰησοῦς ditulis menurut bentuk baku Indonesia, “Yesus”.
- source_word: σωθήσῃ
  choice: kamu akan diselamatkan
  rationale: Bentuk pasif futur ini dipertahankan sebagai janji dan tidak dipersempit menjadi pembebasan jasmani saja.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: kamu dan seisi rumahmu
  rationale: οἶκος di sini menunjuk kepada orang-orang dalam satu rumah tangga, bukan bangunan. “Seisi rumahmu” merupakan ungkapan Indonesia yang alami serta mempertahankan cakupan kolektif frasa itu.
theological_decisions:
- issue: Cakupan janji bagi kepala penjara dan rumah tangganya
  choice: Frasa diterjemahkan langsung sebagai “kamu dan seisi rumahmu” tanpa menyatakan bahwa iman kepala penjara dengan sendirinya menyelamatkan semua anggota rumah tangga.
  alternative: Menafsirkan frasa sebagai keselamatan otomatis seluruh rumah tangga melalui iman kepala penjara saja, atau membatasi janji secara individualistis sehingga cakupan rumah tangga ditiadakan.
  rationale: Teks Yunani sungguh memasukkan kepala penjara dan rumah tangganya dalam janji, tetapi ayat ini sendiri tidak menjelaskan mekanisme atau tanggapan masing-masing orang. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Percayalah kepada” dipilih sebagai ungkapan yang alami; “maka” menyatakan hubungan antara perintah dan janji tanpa memperluas maknanya. Pronomina “kamu” sesuai dengan sapaan tunggal dalam konteks ini.
