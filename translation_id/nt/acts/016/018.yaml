  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: id
  text: Ia terus melakukan hal itu selama berhari-hari. Namun, Paulus sangat terusik, lalu berpaling kepada roh itu[a] dan berkata, “Dalam nama Yesus Sang Mesias,[b] aku memerintahkanmu untuk keluar dari perempuan itu!” Pada saat itu juga roh itu keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada roh”; konteks menunjukkan bahwa yang dimaksud ialah roh yang menguasai perempuan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yesus Kristus.” Kata Yunani Χριστός berarti “Mesias” dan di sini digunakan sebagai gelar.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: terus dilakukannya selama berhari-hari
  rationale: Bentuk imperfek ἐποίει menunjukkan tindakan yang berlangsung atau berulang pada masa lampau. Ungkapan ini menyampaikan keberlanjutan tersebut secara alami dalam bahasa Indonesia.
- source_word: διαπονηθεὶς
  choice: ketika Paulus menjadi sangat terganggu
  rationale: Partisip ini menggambarkan Paulus yang merasa sangat terusik atau tertekan, bukan sekadar agak jengkel. Klausa temporal mempertahankan hubungan tindakan tanpa membuat bahasa Indonesia terasa kaku.
- source_word: ἐπιστρέψας
  choice: ia berpaling
  rationale: Kata ini menunjukkan bahwa Paulus mengubah arah tubuhnya sebelum berbicara; “berpaling” ringkas dan wajar.
- source_word: τῷ πνεύματι
  choice: kepada roh itu
  rationale: Teks Yunani hanya menyebut “roh” tanpa kata sifat “jahat” atau sebutan “setan”. Kata penunjuk “itu” wajar dalam bahasa Indonesia untuk merujuk kepada roh yang telah disebut dalam konteks.
- source_word: Παραγγέλλω σοι
  choice: aku memerintahkanmu
  rationale: παραγγέλλω menyatakan perintah yang berwibawa. Bentuk ini langsung dan idiomatis.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: Dalam nama Yesus Sang Mesias
  rationale: “Dalam nama” mempertahankan rumusan otoritas sumber. Χριστός diterjemahkan sebagai gelar “Sang Mesias”, bukan sebagai nama keluarga.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: keluar dari perempuan ini
  rationale: Ungkapan ini alami untuk perintah pengusiran roh. “Perempuan ini” memperjelas pronomina feminin tanpa menambahkan penilaian tentang dirinya.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: Pada saat itu juga roh itu keluar
  rationale: αὐτῇ τῇ ὥρᾳ menekankan bahwa perintah itu terlaksana segera. Subjek “roh itu” dinyatakan ulang agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam rumusan ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός pada frasa ini tetap bermakna gelar bagi Yesus. “Sang Mesias” menyatakan fungsi gelar itu dengan jelas dalam bahasa Indonesia, sedangkan “Kristus” juga merupakan padanan tradisional yang sah.
- issue: Apakah roh tersebut perlu disebut roh jahat atau setan dalam teks utama
  choice: roh itu
  alternative: roh jahat itu; setan itu
  rationale: Ayat ini sendiri memakai πνεῦμα tanpa penjelas. Konteks mengidentifikasi roh yang menguasai perempuan tersebut, tetapi terjemahan utama tidak menambahkan sebutan yang tidak terdapat dalam frasa ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pilihan “perempuan ini” menghindari pengulangan pronomina yang dapat kabur, sedangkan “Sang Mesias” mempertahankan Χριστός sebagai gelar. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
