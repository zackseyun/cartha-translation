  terminology: “roh itu” tepat karena πνεῦμα dalam ayat ini tidak diberi kualifikasi. “Yesus Sang Mesias” merupakan terjemahan gelar Χριστός yang wajar dalam bahasa Indonesia dan selaras dengan keputusan proyek. Catatan kaki mempertahankan alternatif “Yesus Kristus” dengan tepat.
