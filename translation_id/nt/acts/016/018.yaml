revisions:
- from: Hal itu terus dilakukannya selama berhari-hari. Namun, ketika Paulus menjadi sangat terganggu, ia berpaling dan berkata kepada roh itu,[a] “Dalam nama Yesus Sang Mesias,[b] aku memerintahkanmu keluar dari perempuan ini!” Pada saat itu juga roh itu keluar.
  to: Ia terus melakukan hal itu selama berhari-hari. Namun, Paulus sangat terusik, lalu berpaling kepada roh itu[a] dan berkata, “Dalam nama Yesus Sang Mesias,[b] aku memerintahkanmu untuk keluar dari perempuan itu!” Pada saat itu juga roh itu keluar.
  rationale: Revisi memperbaiki idiom bahasa Indonesia dan menghilangkan unsur “ini” yang tidak dinyatakan oleh teks sumber. Urutan tindakan Yunani tetap dipertahankan secara alami melalui “Paulus sangat terusik, lalu berpaling ... dan berkata.” Tidak ada perubahan pada identifikasi roh, gelar Mesias, atau makna bahwa roh itu keluar seketika.
