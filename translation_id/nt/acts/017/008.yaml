lexical_decisions:
- source_word: ἐτάραξαν
  choice: menjadi resah
  rationale: Dalam konstruksi ini, verba tersebut menyatakan bahwa perkataan yang didengar menimbulkan keresahan atau keguncangan pada orang banyak dan para pejabat. Ungkapan ini alami dalam bahasa Indonesia dan tidak melebihkan dampaknya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan. Hubungan dengan ayat sebelumnya tetap jelas dalam bahasa Indonesia tanpa konjungsi eksplisit.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: Padanan netral dan lazim untuk kelompok orang yang berkumpul; tidak memasukkan nuansa permusuhan seperti 'gerombolan'.
- source_word: τοὺς πολιτάρχας
  choice: para pejabat kota
  rationale: Istilah ini adalah gelar sipil khas Makedonia. Padanan fungsional ini mudah dipahami, sedangkan bentuk teknisnya dijelaskan dalam catatan kaki.
- source_word: ἀκούοντας ταῦτα
  choice: Mendengar hal-hal itu
  rationale: Partisipel kini diterjemahkan sebagai keterangan waktu dan secara gramatikal berlaku bagi orang banyak maupun para pejabat kota. Bentuk jamak ταῦτα dipertahankan melalui 'hal-hal itu'.
