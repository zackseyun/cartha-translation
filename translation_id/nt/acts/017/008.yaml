  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: id
  text: Mereka membuat orang banyak dan para pejabat kota[a] gelisah ketika mereka mendengar hal-hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “para politark,” gelar setempat di Makedonia bagi para pejabat sipil.
