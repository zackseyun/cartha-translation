id: ACT.17.31
reference: Acts 17:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: id
  text: sebab Dia telah menetapkan suatu hari ketika Dia akan menghakimi dunia yang dihuni manusia dengan adil[a] melalui seorang laki-laki yang telah Dia tetapkan. Dia telah memberikan bukti kepada semua orang[b] dengan membangkitkan laki-laki itu dari antara orang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dalam kebenaran”; dapat juga diterjemahkan “dengan keadilan” (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: Atau “telah memberikan jaminan kepada semua orang”; secara harfiah, “telah memberikan iman kepada semua orang” (πίστιν παρασχὼν πᾶσιν), tetapi dalam konteks ini ungkapan tersebut berarti bukti atau kepastian yang diberikan kepada semua orang.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: sebab
  rationale: Menyatakan alasan bagi seruan untuk bertobat dalam ayat sebelumnya; alami dan tetap mempertahankan daya kausal.
- source_word: ἔστησεν ἡμέραν
  choice: telah menetapkan suatu hari
  rationale: Menyampaikan hari yang sudah ditentukan Allah; 'menetapkan' sesuai dengan fungsi ἵστημι dalam konteks ini.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: ketika Dia akan menghakimi
  rationale: Bentuk μέλλει dengan infinitif menunjuk pada tindakan mendatang yang telah dimaksudkan; ungkapan ini alami dalam bahasa Indonesia.
- source_word: τὴν οἰκουμένην
  choice: dunia yang berpenghuni
  rationale: Mempertahankan arti leksikal οἰκουμένη sebagai dunia yang didiami manusia dan cakupan universal penghakiman.
- source_word: ἐν δικαιοσύνῃ
  choice: dengan adil
  rationale: Dalam konteks penghakiman, frasa ini secara alami menyatakan cara atau standar penghakiman, yaitu dengan keadilan/kebenaran.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: melalui seorang yang telah ditetapkan-Nya
  rationale: ἀνήρ menunjuk kepada seorang laki-laki, tetapi dalam bahasa Indonesia 'seorang' menghindari frasa kaku 'seorang laki-laki' tanpa mengubah referen manusia laki-laki yang jelas dari konteks; ὥρισεν diterjemahkan 'ditetapkan-Nya'.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Dia telah memberikan bukti kepada semua orang
  rationale: Dalam idiom ini πίστις dengan παρέχω bermakna jaminan, kepastian, atau bukti, bukan terutama iman subjektif.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: dengan membangkitkan orang itu dari antara orang mati
  rationale: Partisip aoristus paling wajar menyatakan sarana pemberian bukti; 'orang itu' memperjelas bahwa αὐτόν kembali kepada orang yang ditetapkan.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks penghakiman
  choice: dengan adil
  alternative: dalam kebenaran; dengan keadilan
  rationale: Bahasa Indonesia paling alami mengungkapkan sifat penghakiman ini dengan 'adil'. Catatan kaki mempertahankan hubungan ungkapan itu dengan δικαιοσύνη dan alternatif leksikalnya.
- issue: Makna πίστις dalam πίστιν παρασχὼν πᾶσιν
  choice: bukti
  alternative: jaminan; kepastian; secara harfiah, iman
  rationale: Kolokasi παρέχω πίστιν dalam konteks kebangkitan sebagai pengesahan publik mendukung arti bukti atau jaminan. Arti lebih harfiah dicatat agar ketegangan leksikal tidak disembunyikan.
- issue: Identitas dan bentuk ἀνδρί
  choice: seorang
  alternative: seorang laki-laki; orang yang
  rationale: Bentuk Yunani adalah anarthrous dan maskulin serta merujuk kepada Yesus. 'Seorang' alami dalam bahasa Indonesia dan tidak secara keliru menjadikannya generik, sementara identitas referennya tetap tersirat sebagaimana dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pronomina ilahi dipakai secara konsisten. Susunan kalimat dipecah menjadi dua agar hubungan antara penetapan sang penghakim dan bukti melalui kebangkitan tetap jelas tanpa menghasilkan kalimat yang berat.
