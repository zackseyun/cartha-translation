id: ACT.17.24
reference: Acts 17:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: id
  text: Allah yang menciptakan dunia dan segala sesuatu di dalamnya adalah Tuhan atas langit dan bumi. Ia tidak tinggal di kuil-kuil buatan tangan manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας
  choice: yang menciptakan
  rationale: Partisip aoris ini menerangkan Allah. 'Yang menciptakan' alami dalam bahasa Indonesia dan menyampaikan tindakan penciptaan dalam konteks ini.
- source_word: κόσμον
  choice: dunia
  rationale: Di sini κόσμος menunjuk pada seluruh tatanan ciptaan; 'dunia' merupakan padanan yang luas dan wajar.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: segala sesuatu di dalamnya
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντα dan rujukan pronominal kepada dunia.
- source_word: ὑπάρχων κύριος
  choice: adalah Tuhan
  rationale: Partisip ὑπάρχων menyatakan keadaan yang ada. Bentuk predikatif ini alami dalam bahasa Indonesia tanpa menjadikannya secara tegas kausal.
- source_word: οὐρανοῦ καὶ γῆς
  choice: atas langit dan bumi
  rationale: Genitif bergantung pada κύριος dan menyatakan wilayah kekuasaan; 'Tuhan atas langit dan bumi' menyampaikan relasi itu secara alami.
- source_word: χειροποιήτοις
  choice: buatan tangan manusia
  rationale: Kata ini berarti dibuat oleh tangan manusia. Penambahan 'manusia' menjernihkan idiom tanpa mengubah maksudnya.
- source_word: ναοῖς
  choice: kuil-kuil
  rationale: ναός menunjuk pada bangunan suci sebagai tempat kediaman ilahi; dalam konteks Atena, 'kuil-kuil' jelas dan tidak secara keliru membatasi rujukan pada Bait Allah.
- source_word: κατοικεῖ
  choice: tinggal
  rationale: '''Tinggal'' adalah padanan modern dan langsung bagi κατοικέω serta mempertahankan kontras dengan kuil sebagai tempat kediaman.'
theological_decisions:
- issue: Transendensi ilahi dan pelokalan Allah dalam kuil
  choice: Pernyataan langsung bahwa Sang Pencipta dan Tuhan atas langit dan bumi tidak tinggal di kuil-kuil buatan manusia.
  alternative: Memparafrasakannya sebagai 'tidak dapat dibatasi oleh kuil-kuil'.
  rationale: Terjemahan mempertahankan klaim langsung teks dan tidak memperluasnya menjadi penjelasan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua kalimat dipakai agar hubungan antarklausa jelas bagi pembaca umum; 'Ia' tetap merujuk langsung kepada Allah. Tidak diperlukan catatan kaki karena makna χειροποιήτοις sudah dijelaskan secara alami dalam teks.
