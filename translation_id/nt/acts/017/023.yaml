    rationale: Dalam konteks pidato Paulus, “kuberitakan” lebih jelas menyatakan proklamasi/pemberitaan daripada ungkapan yang dapat dipahami sebagai sekadar menceritakan.
  - severity: low
    issue: Ejaan istilah altar
    rationale: “Mezbah” merupakan bentuk baku yang lebih umum dalam bahasa Indonesia modern untuk altar dalam konteks Alkitab.
