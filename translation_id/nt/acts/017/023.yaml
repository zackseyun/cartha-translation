  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: id
  text: 'Sebab, ketika aku berjalan-jalan dan mengamati dengan saksama benda-benda yang kalian sembah, aku bahkan menemukan sebuah mezbah yang di atasnya tertulis: “Kepada ilah yang tidak dikenal.” Karena itu, apa yang kalian sembah tanpa kalian kenal[a], itulah yang kuberitakan kepada kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang kalian sembah tanpa kalian kenal.” Bahasa Yunani memakai kata ganti relatif netral, secara harfiah “apa yang”, bukan bentuk yang secara langsung berarti “Dia yang”.
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: ketika aku berjalan melintasi kota ini
  rationale: Partisipel kini menyatakan keadaan waktu ketika Paulus melakukan pengamatan. “Kota ini” tersirat dari konteks perjalanannya di Atena dan membuat ungkapan Indonesia lebih alami.
- source_word: ἀναθεωρῶν
  choice: mengamati dengan saksama
  rationale: Kata ini menyiratkan pengamatan penuh perhatian, bukan sekadar melihat sepintas.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: benda-benda yang kalian sembah
  rationale: σεβάσματα mencakup berbagai benda atau sarana pemujaan. Ungkapan ini mempertahankan keluasan maknanya tanpa mempersempitnya menjadi kuil atau tempat keramat saja.
- source_word: βωμόν
  choice: mazbah
  rationale: Istilah Indonesia yang lazim dalam konteks Alkitab untuk tempat persembahan atau pemujaan.
- source_word: ἐπεγέγραπτο
  choice: bertuliskan
  rationale: Bentuk pasif pluperfek menunjukkan bahwa tulisan itu sudah tertera pada mazbah; “bertuliskan” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: Ἀγνώστῳ θεῷ
  choice: Kepada ilah yang tidak dikenal
  rationale: “Ilah” mempertahankan nuansa sebutan generik pada prasasti keagamaan tanpa terlebih dahulu menentukan bahwa orang Atena memahami referennya sebagai Allah yang esa.
- source_word: ὃ οὖν
  choice: Karena itu, apa yang
  rationale: “Karena itu” mempertahankan daya simpulan οὖν, sedangkan “apa yang” mencerminkan pronomina relatif netral ὃ.
- source_word: ἀγνοοῦντες
  choice: tanpa kalian kenal
  rationale: Mengungkapkan cara mereka menyembah sekaligus mempertahankan permainan gagasan dengan “tidak dikenal” pada prasasti.
- source_word: εὐσεβεῖτε
  choice: kalian sembah
  rationale: Dalam konteks pengabdian religius, “sembah” merupakan padanan Indonesia yang jelas dan alami.
- source_word: καταγγέλλω
  choice: kuberitakan
  rationale: Menyampaikan tindakan mengumumkan atau memberitakan secara terbuka dan berwibawa, sesuai dengan pidato Paulus.
theological_decisions:
- issue: Acuan pronomina relatif netral ὃ
  choice: apa yang kalian sembah tanpa kalian kenal
  alternative: Dia yang kalian sembah tanpa kalian kenal
  rationale: Bahasa Yunani memakai pronomina relatif netral, bukan bentuk maskulin yang secara langsung mempersonalisasi acuannya. Terjemahan utama mempertahankan ketegangan retoris itu, sementara kemungkinan ungkapan personal dicatat sebagai alternatif.
- issue: Sebutan θεῷ dalam prasasti
  choice: ilah yang tidak dikenal
  alternative: Allah yang tidak dikenal
  rationale: Prasasti itu berasal dari lingkungan pemujaan Atena dan tidak memakai artikel dalam bahasa Yunani. “Ilah” mempertahankan sifat generik prasasti tanpa menyangkal arah argumen Paulus yang kemudian memberitakan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku/kalian” mengikuti suasana pidato langsung dan membedakan pembicara dari para pendengar. Struktur kalimat dibuat alami sambil mempertahankan hubungan retoris antara “ilah yang tidak dikenal,” “tanpa kalian kenal,” dan pemberitaan Paulus.
