  to: 'Sebab, ketika aku berjalan-jalan dan mengamati dengan saksama benda-benda yang kalian sembah, aku bahkan menemukan sebuah mezbah yang di atasnya tertulis: “Kepada ilah yang tidak dikenal.” Karena itu, apa yang kalian sembah tanpa kalian kenal[a], itulah yang kuberitakan kepada kalian.'
