  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: id
  text: Setelah menerima jaminan dari Yason dan orang-orang lain itu,[a] mereka membebaskan Yason dan orang-orang lain itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejumlah uang yang dianggap cukup”; kemungkinan besar berupa jaminan hukum atau uang tanggungan untuk menjamin ketertiban.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Setelah menerima
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Dalam konteks jaminan yang diserahkan, 'menerima' lebih alami dalam bahasa Indonesia daripada 'mengambil'.
- source_word: τὸ ἱκανὸν
  choice: jaminan
  rationale: Dalam konteks hukum ini, ungkapan tersebut kemungkinan menunjuk pada jaminan atau tanggungan yang dianggap memadai. 'Jaminan' mempertahankan arti hukum/keuangan tanpa membatasi bentuknya sebagai uang jaminan tertentu.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: dari Yason dan orang-orang lain itu
  rationale: παρά dengan genitif menyatakan sumber, sedangkan οἱ λοιποί menunjuk pada orang-orang lain dalam kelompok terkait. Kata 'itu' membantu membuat rujukannya wajar dan tertentu dalam bahasa Indonesia.
- source_word: ἀπέλυσαν
  choice: membebaskan
  rationale: Dalam latar tindakan penguasa kota terhadap orang-orang yang ditahan, verba ini berarti melepaskan atau membebaskan mereka.
- source_word: αὐτούς
  choice: semuanya
  rationale: Pronomina jamak ini merujuk kepada Yason dan orang-orang lain yang baru disebut. 'Semuanya' menghindari pengulangan pronomina 'mereka' yang dapat membuat pelaku dan objek kalimat rancu dalam bahasa Indonesia.
