id: ACT.17.4
reference: Acts 17:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: id
  text: Beberapa orang dari antara mereka menjadi yakin dan bergabung dengan Paulus dan Silas[a], bersama dengan sejumlah besar orang Yunani yang takut akan Allah dan tidak sedikit perempuan terkemuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “menggabungkan nasib mereka dengan Paulus dan Silas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: beberapa orang dari antara mereka
  rationale: Mempertahankan ungkapan partitif yang menunjuk kembali kepada para pendengar di rumah ibadat dalam ayat sebelumnya.
- source_word: ἐπείσθησαν
  choice: menjadi yakin
  rationale: Menyampaikan bentuk pasif πείθω secara alami dalam bahasa Indonesia tanpa menggantinya dengan istilah yang secara eksplisit berarti percaya.
- source_word: προσεκληρώθησαν
  choice: bergabung
  rationale: Dalam konteks ini verba langka tersebut menyatakan bahwa mereka dilekatkan atau menggabungkan nasib dengan Paulus dan Silas; 'bergabung' jelas dan wajar, sedangkan nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: dengan Paulus dan Silas
  rationale: Preposisi 'dengan' secara alami mengungkapkan hubungan datif dengan verba 'bergabung'.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: orang Yunani yang takut akan Allah
  rationale: Dalam Kisah Para Rasul ungkapan ini lazim menunjuk kepada orang bukan Yahudi yang menghormati Allah Israel dan berhubungan dengan ibadah Yahudi; terjemahan ini memperjelas objek penghormatan yang tersirat oleh konteks.
- source_word: πλῆθος πολὺ
  choice: sejumlah besar
  rationale: Padanan Indonesia yang alami untuk jumlah yang banyak dan sesuai dengan konstruksi kelompok yang disebut sesudahnya.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: perempuan terkemuka
  rationale: πρῶτος di sini menunjuk pada kedudukan atau pengaruh sosial, bukan urutan waktu.
- source_word: οὐκ ὀλίγαι
  choice: tidak sedikit
  rationale: Mempertahankan litotes khas Lukas dan penekanannya yang bersahaja.
- source_word: τε ... τε
  choice: bersama dengan ... dan
  rationale: Mengungkapkan struktur aditif yang menghubungkan dua kelompok tambahan dengan beberapa orang yang disebut pada awal ayat.
theological_decisions:
- issue: Apakah ἐπείσθησαν perlu diterjemahkan dengan bahasa pertobatan yang eksplisit
  choice: menjadi yakin
  alternative: menjadi percaya
  rationale: Teks memakai πείθω, bukan πιστεύω. Pilihan ini mempertahankan perbedaan leksikal sekaligus membiarkan konteks pemberitaan apostolik memberi nuansanya.
- issue: Seberapa eksplisit identitas religius σεβομένων Ἑλλήνων perlu dinyatakan
  choice: orang Yunani yang takut akan Allah
  alternative: orang Yunani yang saleh; orang Yunani yang beribadah
  rationale: Dalam konteks Kisah Para Rasul, ungkapan ini menunjuk kepada orang bukan Yahudi yang menghormati Allah Israel dan terkait dengan ibadah Yahudi. Pilihan ini memberi kejelasan historis tanpa menambahkan identitas denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Litotes 'tidak sedikit' dipertahankan, dan istilah teknis yang tidak perlu dihindari.
source_grounding:
  english_pob_role: consult_only
