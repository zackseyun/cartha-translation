id: ACT.17.5
reference: Acts 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: id
  text: Namun, orang-orang Yahudi menjadi iri hati. Mereka mengajak beberapa laki-laki jahat dari pasar, membentuk gerombolan, dan membuat kota itu gempar. Setelah mendatangi rumah Yason, mereka berusaha membawa mereka keluar menghadap sidang rakyat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke majelis umum” atau “ke hadapan rakyat.” Kata Yunani δῆμος menunjuk pada badan warga kota yang berhimpun di muka umum, bukan sekadar kerumunan yang tidak tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: menjadi iri hati
  rationale: Partisip aoris menyatakan motif yang mendahului tindakan berikutnya; “menjadi iri hati” menangkap nuansa ingresif tanpa mengubahnya menjadi sekadar keadaan statis.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ungkapan ini mengikuti bentuk Yunani tanpa mempersempitnya menjadi “para pemimpin Yahudi”; konteks menunjukkan kelompok tertentu di Tesalonika, bukan semua orang Yahudi.
- source_word: προσλαβόμενοι
  choice: mengajak
  rationale: Bentuk medial ini berarti mengambil atau menyertakan orang lain bersama mereka. “Mengajak” alami dalam bahasa Indonesia dan tidak menyiratkan perekrutan resmi.
- source_word: τῶν ἀγοραίων
  choice: dari pasar
  rationale: Istilah ini menunjuk kepada orang-orang yang berada atau berkeliaran di agora, ruang pasar dan ruang publik kota. “Dari pasar” mempertahankan rujukan tempat tanpa menambahkan penilaian seperti “pengangguran” atau “gelandangan”.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: beberapa orang jahat
  rationale: “Orang” dalam konteks ini merujuk pada laki-laki sebagaimana ἄνδρας, sedangkan “jahat” mempertahankan penilaian moral πονηρούς tanpa mempersempitnya menjadi sekadar pembuat onar.
- source_word: ὀχλοποιήσαντες
  choice: membentuk gerombolan
  rationale: Kata kerja ini berarti membentuk atau menghimpun kerumunan; “gerombolan” menyampaikan nuansa massa yang bermusuhan dalam konteks kerusuhan.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: membuat kota itu gempar
  rationale: Imperfek menunjukkan tindakan yang berlangsung. Ungkapan ini menyampaikan gangguan luas terhadap kota dengan bahasa Indonesia yang alami.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: mendatangi rumah Yason
  rationale: Dalam konstruksi ini ἐφίστημι dapat berarti datang atau tiba di suatu tempat. “Mendatangi” sesuai dengan urutan narasi dan tidak menambahkan gagasan “menyerang” yang tidak dinyatakan secara eksplisit.
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Dalam konstruksi dengan infinitif, kata ini menyatakan upaya yang sedang dilakukan. “Berusaha” lebih alami daripada “mencari” sebelum frasa tindakan berikutnya.
- source_word: αὐτούς
  choice: mereka
  rationale: Terjemahan mempertahankan pronomina Yunani dan tidak menggantinya secara eksplisit dengan nama Paulus dan Silas.
- source_word: προαγαγεῖν
  choice: membawa mereka keluar
  rationale: Infinitif ini berarti membawa atau menuntun ke luar/ke depan; “keluar” cocok dengan latar rumah Yason.
- source_word: εἰς τὸν δῆμον
  choice: menghadap sidang rakyat
  rationale: δῆμος di sini menunjuk pada badan warga kota yang berhimpun secara publik, bukan sekadar kerumunan. “Menghadap sidang rakyat” mempertahankan nuansa kelembagaan dan cocok dengan tujuan membawa seseorang ke hadapan badan tersebut.
theological_decisions:
- issue: Penerjemahan οἱ Ἰουδαῖοι dalam narasi konflik
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani menyebut “orang-orang Yahudi” tanpa membatasi mereka pada pemimpin. Konteks membatasi rujukannya pada kelompok tertentu di Tesalonika, tetapi teks utama tidak mengganti istilah sumber dengan penafsiran yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar hubungan tindakan mudah dipahami, sambil mempertahankan urutan narasinya. Nama Ἰάσων ditulis “Yason” sesuai alih aksara yang mudah dibaca dalam bahasa Indonesia.
