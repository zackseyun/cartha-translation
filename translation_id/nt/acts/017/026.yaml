  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: id
  text: Dari satu orang[a], Ia menjadikan semua bangsa manusia untuk mendiami seluruh muka bumi. Ia telah menetapkan masa-masa yang ditentukan bagi mereka[b] dan batas-batas tempat tinggal mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah manuskrip berbunyi “dari satu darah,” bukan “dari satu.” Teks utama mengikuti bacaan SBLGNT “dari satu”; kata “orang” ditambahkan untuk memperjelas acuan yang tersirat.
    reason: textual_variant
  - marker: b
    text: Atau “masa-masa yang telah ditetapkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: Ia menjadikan
  rationale: Kata ποιέω di sini menyatakan tindakan Allah menjadikan atau menghadirkan bangsa-bangsa manusia; “menjadikan” alami dalam bahasa Indonesia tanpa secara khusus menetapkan penciptaan ex nihilo.
- source_word: ἐξ ἑνὸς
  choice: dari satu orang
  rationale: Teks SBLGNT berbunyi harfiah “dari satu.” “Orang” ditambahkan untuk memperjelas acuan manusia yang tersirat, tanpa mengikuti varian “satu darah.”
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: semua bangsa manusia
  rationale: ἔθνος menunjuk pada bangsa-bangsa atau kelompok-kelompok bangsa, sedangkan ἀνθρώπων menempatkannya dalam keseluruhan umat manusia. Bentuk “semua bangsa manusia” mempertahankan kedua unsur tersebut.
- source_word: κατοικεῖν
  choice: untuk mendiami
  rationale: Infinitif ini menyatakan hasil atau tujuan, dan “mendiami” mempertahankan nuansa menetap atau menghuni.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: seluruh muka bumi
  rationale: Ungkapan “muka bumi” mempertahankan idiom sumber, sedangkan “seluruh” menyampaikan παντός secara alami.
- source_word: ὁρίσας
  choice: Ia telah menetapkan
  rationale: Partisip ini menyatakan tindakan Allah dalam menentukan atau membatasi. Dipecah menjadi kalimat utama agar jelas dan alami dalam bahasa Indonesia.
- source_word: προστεταγμένους καιρούς
  choice: masa-masa yang ditentukan bagi mereka
  rationale: καιροί menunjuk pada masa atau periode tertentu, dan προστεταγμένους menyatakan bahwa masa-masa itu telah ditetapkan. Frasa “bagi mereka” menjelaskan hubungannya dengan bangsa-bangsa.
- source_word: τὰς ὁροθεσίας
  choice: batas-batas
  rationale: ὁροθεσία berarti batas wilayah atau penetapan batas; “batas-batas” tepat dan alami dalam konteks geografis.
- source_word: τῆς κατοικίας αὐτῶν
  choice: tempat tinggal mereka
  rationale: κατοικία menunjuk pada wilayah kediaman atau tempat tinggal. Terjemahan ini mempertahankan bentuk kolektif tanpa menjadikannya terlalu teknis.
theological_decisions:
- issue: Acuan tersirat dalam ἐξ ἑνὸς
  choice: dari satu orang
  alternative: dari satu; dari satu leluhur; dari satu darah
  rationale: “Satu orang” memperjelas acuan manusia yang tersirat. “Satu darah” tidak dipakai karena merupakan varian teks, bukan bacaan SBLGNT.
- issue: Cakupan penetapan ilahi atas καιροί dan ὁροθεσίαι
  choice: masa-masa yang ditentukan bagi mereka dan batas-batas tempat tinggal mereka
  alternative: musim-musim yang telah ditetapkan dan batas-batas kediaman mereka
  rationale: Terjemahan mempertahankan pernyataan bahwa Allah menetapkan masa dan batas kediaman bangsa-bangsa, tanpa mempersempitnya menjadi teori tertentu tentang sejarah, politik, atau keselamatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur partisip Yunani dipecah menjadi dua kalimat agar mudah dipahami, sementara hubungan logis dan ketegangan teologis sumber tetap dipertahankan.
