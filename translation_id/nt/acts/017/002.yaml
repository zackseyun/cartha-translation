  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: id
  text: Seperti kebiasaannya, Paulus masuk menemui mereka. Pada tiga hari Sabat[a], ia berdialog dengan mereka berdasarkan Kitab Suci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: selama tiga hari Sabat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: dari Kitab Suci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Seperti kebiasaannya, Paulus
  rationale: Ungkapan ini menyatakan kebiasaan Paulus yang sudah tetap. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa habitual.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: pergi menemui mereka
  rationale: Dalam konteks ini, εἰσέρχομαι dengan πρὸς αὐτούς menggambarkan Paulus mendatangi mereka di tempat pertemuan yang disebut dalam ayat sebelumnya. Pilihan ini mempertahankan arah gerak tanpa menambahkan kata 'sinagoge' ke dalam ayat.
- source_word: ἐπὶ σάββατα τρία
  choice: selama tiga hari Sabat
  rationale: ἐπί dengan akusatif dapat menunjukkan rentang atau keberlangsungan waktu. Frasa ini alami dan mencakup keterlibatan pada tiga Sabat, sementara alternatif 'pada tiga hari Sabat' dicatat karena kemungkinan nuansa distributif.
- source_word: διελέξατο
  choice: bertukar pikiran dengan mereka
  rationale: διαλέγομαι menunjuk pada pembahasan bernalar yang melibatkan interaksi. 'Bertukar pikiran' mempertahankan sifat dialogis dan argumentatif tanpa menyiratkan pertengkaran.
- source_word: ἀπὸ τῶν γραφῶν
  choice: berdasarkan Kitab Suci
  rationale: ἀπό di sini menunjukkan Kitab Suci sebagai sumber atau dasar pembahasannya. 'Kitab Suci' merupakan padanan Indonesia yang lazim bagi bentuk jamak τῶν γραφῶν dalam konteks Yahudi-Kristen.
theological_decisions:
- issue: Rujukan kata ganti αὐτούς/αὐτοῖς dalam kegiatan Paulus
  choice: Mempertahankan kata ganti 'mereka' tanpa menyebut 'orang Yahudi' atau 'orang-orang di sinagoge'.
  alternative: Paulus masuk ke sinagoge / Paulus menemui orang-orang Yahudi di sana.
  rationale: Konteks langsung menjelaskan latar sinagoge, tetapi ayat ini sendiri hanya memakai kata ganti. Mempertahankan 'mereka' menghindari penambahan kekhususan yang tidak dinyatakan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bertukar pikiran' dipilih agar unsur dialog serta penalaran tetap terdengar, sedangkan 'berdasarkan Kitab Suci' menyampaikan sumber argumentasi secara alami.
