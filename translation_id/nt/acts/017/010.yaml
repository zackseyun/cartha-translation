  verdict: revise
  source_fidelity: 'Makna ayat pada umumnya tepat: ἀδελφοί, tindakan segera, pengutusan Paulus dan Silas pada malam hari ke Berea, serta kunjungan mereka ke sinagoge/rumah ibadat Yahudi semuanya terwakili. Namun, kata kerja “menyuruh ... berangkat” dapat terdengar terutama sebagai perintah, sedangkan ἐξέπεμψαν menyatakan pengiriman/perlepasan. Terjemahan revisi memakai “mengirim” yang lebih langsung. Catatan b juga perlu diperbaiki karena “sepanjang malam” menyiratkan tindakan berlangsung selama seluruh malam, bukan sekadar terjadi pada malam hari.'
