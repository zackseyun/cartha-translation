  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: id
  text: Saudara-saudara itu[a] segera mengirim Paulus dan Silas ke Berea pada malam hari[b]. Sesampainya di sana, keduanya pergi ke rumah ibadat orang Yahudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari”; kata Yunani yang secara harfiah berarti “saudara-saudara” dapat merujuk kepada komunitas orang percaya yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktu malam.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sinagoge orang Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: Saudara-saudara
  rationale: Mempertahankan istilah kekerabatan berbentuk jamak maskulin dalam bahasa Yunani; dalam konteks ini istilah tersebut dapat menunjuk kepada komunitas orang percaya secara lebih luas.
- source_word: εὐθέως
  choice: segera
  rationale: Menyampaikan tindakan yang dilakukan tanpa penundaan dengan ungkapan Indonesia yang alami.
- source_word: διὰ νυκτός
  choice: pada malam hari
  rationale: Konstruksi ini menyatakan bahwa keberangkatan berlangsung pada waktu malam.
- source_word: ἐξέπεμψαν
  choice: menyuruh ... berangkat
  rationale: Mengungkapkan tindakan mengirim Paulus dan Silas pergi dari tempat itu dengan bahasa naratif Indonesia yang wajar.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paulus dan Silas
  rationale: Mencakup kedua nama yang dihubungkan oleh τε ... καί; bahasa Indonesia tidak memerlukan padanan eksplisit bagi 'both' karena kedua tokoh sudah dinyatakan dengan jelas.
- source_word: Βέροιαν
  choice: Berea
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: οἵτινες παραγενόμενοι
  choice: Sesampainya di sana, keduanya
  rationale: Menyampaikan fungsi lanjutan dan temporal dari klausa relatif serta partisip dengan alur naratif yang alami; 'keduanya' memperjelas bahwa pelakunya Paulus dan Silas.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: rumah ibadat orang Yahudi
  rationale: Menggunakan padanan Indonesia yang umum untuk συναγωγή dan mempertahankan genitif yang mengidentifikasi komunitas Yahudi setempat.
- source_word: ἀπῄεσαν
  choice: pergi ke
  rationale: Menyampaikan gerakan menuju rumah ibadat secara idiomatis tanpa memberi bobot berlebihan pada aspek imperfek yang ambigu dalam konteks ini.
theological_decisions:
- issue: Cakupan ἀδελφοὶ dalam komunitas orang percaya
  choice: Saudara-saudara
  alternative: Saudara-saudara seiman, baik laki-laki maupun perempuan
  rationale: Teks utama mempertahankan bentuk kekerabatan maskulin Yunani tanpa menutup kemungkinan bahwa kelompok yang dimaksud mencakup seluruh komunitas orang percaya; kemungkinan itu dicatat dalam catatan kaki.
- issue: Identitas τῶν Ἰουδαίων
  choice: orang Yahudi
  alternative: Yahudi
  rationale: Frasa ini secara transparan mengidentifikasi rumah ibadat komunitas Yahudi di Berea dan tidak menyiratkan penilaian teologis atau peyoratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar alur tindakan mudah dipahami. 'Rumah ibadat' dipilih sebagai padanan umum bagi συναγωγή, sementara alternatif transliterasi 'sinagoge' dicatat. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
