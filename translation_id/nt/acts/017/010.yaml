  to: Saudara-saudara itu[a] segera mengirim Paulus dan Silas ke Berea pada malam hari[b]. Sesampainya di sana, keduanya pergi ke rumah ibadat orang Yahudi[c].
  rationale: Revisi terbatas pada pemilihan kata kerja yang lebih setia pada ἐξέπεμψαν dan pembetulan catatan waktu agar tidak mengubah makna temporal διὰ νυκτός menjadi durasi sepanjang malam. Penanda catatan kaki tetap ditempatkan pada unsur yang dijelaskan.
