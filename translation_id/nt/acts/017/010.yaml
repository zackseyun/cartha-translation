  terminology: “Saudara-saudara,” “rumah ibadat,” dan “orang Yahudi” sesuai dengan register Alkitab Bahasa Indonesia yang modern dan baku. Catatan “sinagoge orang Yahudi” tetap merupakan alternatif terminologis yang sah.
