  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: id
  text: Maka ia berdiskusi di rumah ibadat dengan orang-orang Yahudi dan orang-orang yang menyembah Allah[a]. Setiap hari ia juga berdiskusi di pasar[b] dengan siapa saja yang kebetulan berada di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang takut akan Allah”, yaitu orang-orang bukan Yahudi yang berhubungan dengan ibadah Yahudi.
    reason: lexical_alternative
  - marker: b
    text: “Pasar” pada masa itu juga merupakan ruang publik untuk kegiatan kemasyarakatan dan tempat orang berkumpul, bukan hanya tempat jual beli.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: berdiskusi
  rationale: Bentuk imperfek menunjukkan kegiatan yang berlangsung atau berulang. “Berdiskusi” mempertahankan unsur dialog dan adu penalaran tanpa mempersempitnya menjadi perdebatan yang bersifat bermusuhan.
- source_word: μὲν οὖν
  choice: Karena itu
  rationale: Gabungan partikel ini melanjutkan alur sekaligus menghubungkannya secara inferensial dengan konteks sebelumnya. “Karena itu” wajar dalam bahasa Indonesia dan mempertahankan hubungan tersebut.
- source_word: συναγωγῇ
  choice: rumah ibadat
  rationale: Dalam konteks Kisah Para Rasul, istilah ini menunjuk pada tempat dan lembaga ibadah komunitas Yahudi. “Rumah ibadat” merupakan ungkapan Indonesia yang jelas dan mapan.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Konteksnya adalah komunitas Yahudi yang hadir di rumah ibadat, bukan khusus orang yang berasal dari wilayah Yudea.
- source_word: τοῖς σεβομένοις
  choice: orang-orang yang menyembah Allah
  rationale: Partisip ini dalam konteks rumah ibadat menunjuk pada orang bukan Yahudi yang mengikuti ibadah Yahudi. Objek “Allah” dipahami dari pemakaian khas dalam Kisah Para Rasul dan dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: ἀγορᾷ
  choice: pasar
  rationale: Agora adalah ruang publik yang berfungsi secara niaga sekaligus kemasyarakatan. “Pasar” paling ringkas dan mudah dipahami, sementara cakupan budayanya dijelaskan dalam catatan kaki.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: Setiap hari
  rationale: Ungkapan ini menyatakan pengulangan yang teratur dari hari ke hari.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: dengan siapa saja yang kebetulan berada di sana
  rationale: Partisip tersebut menunjuk pada orang-orang yang kebetulan hadir atau ditemui di tempat itu. Pilihan ini tidak mempersempit maknanya hanya kepada orang yang sedang lewat.
theological_decisions:
- issue: Identitas τοῖς σεβομένοις
  choice: orang-orang yang menyembah Allah
  alternative: orang-orang yang takut akan Allah
  rationale: Terjemahan utama menyampaikan tindakan keagamaan secara jelas kepada pembaca umum, sedangkan catatan kaki mempertahankan kemungkinan pemahaman sebagai sebutan bagi orang bukan Yahudi yang berhubungan dengan ibadah Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat sumber dibagi menjadi dua kalimat agar pengulangan kegiatan Paulus terbaca alami dan jelas; kata kerja “berdiskusi” diulang untuk menjaga hubungan kedua lokasi dengan διελέγετο.
