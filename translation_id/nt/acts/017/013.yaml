id: ACT.17.13
reference: Acts 17:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: id
  text: Namun, ketika orang-orang Yahudi dari Tesalonika mengetahui bahwa firman Allah juga telah diberitakan oleh Paulus di Berea, mereka pun datang ke sana serta menghasut dan mengacaukan orang banyak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggerakkan dan meresahkan orang banyak.” Kedua kata Yunani ini bertumpang tindih dan bersama-sama menggambarkan timbulnya gejolak di tengah masyarakat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Namun, ketika
  rationale: δέ menandai peralihan dengan kontras ringan terhadap sambutan baik di Berea, sedangkan ὡς berfungsi temporal.
- source_word: ἔγνωσαν
  choice: mengetahui
  rationale: Bentuk aoris γινώσκω di sini menunjuk pada diperolehnya informasi; dalam konteks ini, 'mengetahui' merupakan ungkapan Indonesia yang alami.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: orang-orang Yahudi dari Tesalonika
  rationale: Frasa ini mengidentifikasi kelompok tertentu berdasarkan asal mereka dan tidak menggeneralisasi semua orang Yahudi.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: bahwa ... juga ... di Berea
  rationale: καί menandai Berea sebagai lokasi tambahan tempat pemberitaan berlangsung.
- source_word: κατηγγέλη
  choice: telah diberitakan
  rationale: Aoris pasif καταγγέλλω menggambarkan pemberitaan secara terbuka. 'Telah' memperjelas bahwa pemberitaan itu sudah terjadi sebelum mereka mengetahuinya, tanpa menjadikan aspek Yunani sebagai kala yang kaku.
- source_word: ὑπὸ τοῦ Παύλου
  choice: oleh Paulus
  rationale: ὑπό dengan genitif menyatakan pelaku dalam konstruksi pasif.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan baku dan wajar dalam bahasa Indonesia yang mempertahankan bobot teologis frasa tersebut sebagai pesan ilahi yang diberitakan.
- source_word: ἦλθον κἀκεῖ
  choice: mereka pun datang ke sana
  rationale: κἀκεῖ berarti 'juga ke sana'; partikel 'pun' secara alami menyampaikan bahwa perlawanan mereka meluas sampai ke Berea.
- source_word: σαλεύοντες
  choice: menghasut
  rationale: Dalam konteks orang banyak, σαλεύω menggambarkan tindakan menimbulkan gejolak atau menggerakkan massa, bukan guncangan harfiah.
- source_word: καὶ ταράσσοντες
  choice: dan mengacaukan
  rationale: ταράσσω menambahkan gagasan menimbulkan kekacauan atau keresahan; pilihan ini mempertahankannya sebagai tindakan kedua yang menguatkan gambaran agitasi.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: ὄχλοι menunjuk pada kumpulan orang. 'Orang banyak' netral dan tidak berlebihan seperti 'gerombolan' atau 'massa rusuh'.
theological_decisions:
- issue: Makna ὁ λόγος τοῦ θεοῦ
  choice: firman Allah
  alternative: pesan Allah
  rationale: '''Firman Allah'' mempertahankan ungkapan teologis yang dikenal sekaligus tetap dapat dipahami dalam konteks sebagai pesan yang diberitakan, tanpa membatasinya pada pengertian teknis tertentu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat mengikuti alur sumber Yunani, tetapi partisipel penutup diterjemahkan sebagai verba sejajar agar alami dan jelas bagi pembaca umum.
