id: ACT.17.34
reference: Acts 17:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: id
  text: Namun, beberapa orang laki-laki bergabung dengannya[a] dan percaya. Di antara mereka terdapat Dionisius, seorang anggota Areopagus[b], seorang perempuan bernama Damaris, dan beberapa orang lain bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “melekatkan diri kepadanya”; ungkapan Yunani ini menyiratkan hubungan pribadi yang erat dengan Paulus.
    reason: lexical_alternative
  - marker: b
    text: Sebutan Yunani ini biasanya berarti “anggota Areopagus”, tetapi dapat pula dipahami lebih umum sebagai orang yang berkaitan dengan badan tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Namun, beberapa orang laki-laki
  rationale: δὲ menandai kontras ringan dengan tanggapan sebelumnya, sedangkan ἄνδρες secara eksplisit berbentuk maskulin; frasa ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: κολληθέντες αὐτῷ
  choice: bergabung dengannya
  rationale: κολλάομαι menggambarkan tindakan melekatkan diri atau berhubungan erat dengan seseorang. Pilihan ini alami dan tetap menyampaikan keberpihakan pribadi kepada Paulus tanpa mengganti pronomina sumber dengan nama yang tersurat.
- source_word: ἐπίστευσαν
  choice: percaya
  rationale: Terjemahan langsung πιστεύω yang tidak menambahkan objek iman atau rumusan teologis yang tidak dinyatakan dalam ayat.
- source_word: ἐν οἷς καὶ
  choice: Di antara mereka terdapat
  rationale: Memperkenalkan orang-orang tertentu dari kelompok yang baru disebut dengan susunan Indonesia yang jelas dan alami.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionisius, seorang anggota Areopagus
  rationale: Ἀρεοπαγίτης mengidentifikasi Dionisius melalui hubungannya dengan Areopagus dan lazim dipahami sebagai anggota badan tersebut; catatan kaki mempertahankan kemungkinan cakupan sebutan yang lebih umum.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: seorang perempuan bernama Damaris
  rationale: Padanan lugas dan idiomatis yang mempertahankan jenis kelamin serta nama tokoh.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: beberapa orang lain bersama mereka
  rationale: Menyatakan adanya orang-orang tambahan yang menyertai kedua tokoh bernama itu tanpa menentukan jumlah atau identitas mereka.
theological_decisions:
- issue: Makna πιστεύω dalam konteks ini
  choice: percaya
  alternative: menjadi percaya; beriman
  rationale: Kata kerjanya menyatakan tanggapan iman yang sungguh-sungguh terhadap pemberitaan Paulus, tetapi ayat ini tidak menyebut objek atau rumusan doktrinal secara eksplisit. 'Percaya' mempertahankan kesederhanaan dan keterbukaan pernyataan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya; rujukan pronominal αὐτῷ dipertahankan sebagai “-nya” agar tidak menambahkan nama yang tidak tersurat.
