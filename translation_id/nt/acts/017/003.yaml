id: ACT.17.3
reference: Acts 17:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: id
  text: Ia menjelaskan dan menunjukkan bahwa Mesias[a] harus menderita dan bangkit dari antara orang mati[b], dan bahwa Yesus yang kuberitakan kepada kamu ini adalah Mesias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”, pada kedua kemunculan kata “Mesias” dalam ayat ini.
    reason: alternative_reading
  - marker: b
    text: Atau “dibangkitkan dari antara orang mati”. Bahasa Yunani di sini memakai infinitif aktif, “bangkit”, meskipun di bagian lain Perjanjian Baru juga dikatakan bahwa Allah membangkitkan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: menjelaskan
  rationale: Partisip ini menggambarkan tindakan Paulus membuka atau membuat makna Kitab Suci menjadi jelas. “Menjelaskan” wajar dalam bahasa Indonesia modern dan sesuai dengan konteks pembahasan di rumah ibadat.
- source_word: παρατιθέμενος
  choice: menunjukkan
  rationale: Kata ini menyatakan bahwa Paulus mengemukakan bahan atau bukti untuk mendukung penjelasannya. “Menunjukkan” mempertahankan daya argumentatifnya tanpa melebihkannya menjadi pembuktian formal.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Mesias
  rationale: Dalam kedua kemunculannya, Χριστός berfungsi sebagai gelar bagi sosok yang diurapi dan dinantikan, bukan sebagai bagian nama diri. “Mesias” mempertahankan konteks Yahudi dan alkitabiahnya.
- source_word: ἔδει
  choice: harus
  rationale: Bentuk ini menyatakan suatu keharusan, dalam konteks ini keharusan ilahi yang dinyatakan dalam Kitab Suci. “Harus” ringkas, alami, dan tidak mengurangi kekuatannya.
- source_word: παθεῖν
  choice: menderita
  rationale: Padanan langsung dan lazim bagi penderitaan Mesias yang sedang dijelaskan Paulus.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: bangkit dari antara orang mati
  rationale: Infinitif Yunani berbentuk aktif, sehingga “bangkit” lebih langsung daripada “dibangkitkan”. Frasa “dari antara orang mati” juga mempertahankan gambaran jamak tanpa menjadi tidak alami.
- source_word: καταγγέλλω
  choice: kuberitakan
  rationale: Kata ini menyatakan penyampaian atau pemberitaan terbuka. “Kuberitakan” alami dalam kalimat langsung ini dan tidak membatasi tindakan Paulus hanya pada khotbah formal.
- source_word: ὑμῖν
  choice: kepada kamu
  rationale: Pronomina ini merujuk kepada para pendengar Paulus. Dalam bahasa Indonesia, “kamu” dapat dipakai secara kolektif di sini tanpa harus menambahkan penanda jamak yang tidak ada secara leksikal.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar dalam kedua kemunculannya
  choice: Mesias
  alternative: Kristus
  rationale: Argumen ayat ini membedakan gelar sosok yang dinantikan dari nama Yesus, lalu menyatakan bahwa Yesus adalah sosok tersebut. “Mesias” membuat fungsi gelar itu jelas, sedangkan bentuk tradisional “Kristus” dicantumkan sebagai alternatif.
- issue: Nuansa diatesis ἀναστῆναι
  choice: bangkit dari antara orang mati
  alternative: dibangkitkan dari antara orang mati
  rationale: Teks Yunani memakai infinitif aktif, sehingga “bangkit” mengikuti bentuk ayat ini secara lebih langsung. Pilihan tersebut tidak menyangkal pernyataan di bagian lain bahwa Allah membangkitkan Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Yesus yang kuberitakan kepada kamu ini” mempertahankan penekanan demonstratif οὗτός dan hubungan antara Yesus dengan gelar Mesias. Bentuk “Ia” melengkapi partisip Yunani sebagai kelanjutan narasi dari ayat sebelumnya agar ayat dapat dibaca secara alami.
