base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: id
  text: Semua orang Atena dan orang-orang asing yang tinggal di sana tidak menggunakan waktu mereka untuk hal lain selain mengatakan atau mendengarkan sesuatu yang lebih baru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “sesuatu yang baru.” Bahasa Yunani memakai bentuk komparatif “lebih baru”, yang mungkin menggambarkan kegemaran terus-menerus terhadap hal terbaru.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι
  choice: orang Atena
  rationale: Menunjuk penduduk Atena sebagai suatu kelompok; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: δὲ
  choice: Memang
  rationale: Menandai sisipan penjelas yang melatarbelakangi adegan, tanpa memberi pertentangan kuat atau makna temporal yang tidak ada dalam sumber.
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh atas orang Atena dan, melalui koordinasi, orang asing yang berada di sana.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: orang-orang asing yang tinggal di sana
  rationale: Mengungkapkan orang luar yang sedang berada atau menetap sementara di Atena tanpa mengharuskan makna penduduk tetap.
- source_word: εἰς οὐδὲν ἕτερον
  choice: hanya untuk
  rationale: Padanan idiomatis bagi ungkapan negatif Yunani 'tidak untuk hal lain selain', dengan arti eksklusif tetap terpelihara.
- source_word: ηὐκαίρουν
  choice: menghabiskan waktu mereka
  rationale: Menangkap aspek imperfek sebagai kebiasaan serta makna kontekstual memakai waktu atau kesempatan.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: untuk menceritakan atau mendengarkan sesuatu
  rationale: Mempertahankan kesejajaran kedua infinitif dan objek tak tentu; 'menceritakan' menyampaikan gagasan memberitakan suatu hal kepada orang lain.
- source_word: καινότερον
  choice: yang lebih baru
  rationale: Mempertahankan bentuk komparatif Yunani, yang dapat menyiratkan kegemaran terus-menerus terhadap kabar atau gagasan paling mutakhir.
