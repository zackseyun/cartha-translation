  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan dibuat idiomatis tanpa menghilangkan bentuk komparatif καινότερον; catatan kaki menjelaskan alternatif yang lebih alami.
