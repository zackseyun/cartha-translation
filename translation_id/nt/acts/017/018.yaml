  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: id
  text: Beberapa filsuf dari aliran Epikuros dan Stoa juga berdiskusi dengannya.[a] Sebagian dari mereka berkata, “Apa yang hendak dikatakan si pemungut serpihan gagasan ini?”[b] Namun, yang lain berkata, “Ia tampaknya seorang pemberita ilah-ilah asing.”[c][d] Mereka berkata demikian karena Paulus memberitakan kabar baik tentang Yesus dan kebangkitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdebat dengannya” atau “bercakap-cakap dengannya”; kata kerja Yunani ini dapat menunjuk pada pembicaraan aktif maupun perdebatan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan hinaan ini secara harfiah berarti “pemungut biji”. Secara kiasan, ungkapan itu dipakai untuk orang yang dianggap memungut dan mengulang-ulang serpihan berbagai gagasan.
    reason: cultural_note
  - marker: c
    text: Atau “roh-roh asing” atau “dewa-dewa asing”. Menurut kerangka keagamaan para penutur, yang dimaksud tampaknya makhluk-makhluk ilahi yang tidak mereka kenal, bukan harus roh jahat dalam pengertian Kristen kemudian.
    reason: alternative_reading
  - marker: d
    text: Sebagian penafsir berpendapat bahwa orang-orang Atena mungkin menyangka “kebangkitan” sebagai ilah lain karena Paulus memberitakan Yesus dan kebangkitan.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: berdiskusi dengannya
  rationale: Kata kerja ini menunjuk pada perjumpaan dalam percakapan atau perdebatan. “Berdiskusi” alami dalam konteks para filsuf tanpa memastikan bahwa interaksinya sepenuhnya bermusuhan.
- source_word: σπερμολόγος
  choice: si pemungut serpihan gagasan
  rationale: Istilah hinaan ini secara harfiah berkaitan dengan pemungut biji dan secara kiasan menyebut orang yang mengumpulkan lalu mengulang-ulang potongan gagasan. Ungkapan ini mempertahankan citra dan daya hinaannya dalam bahasa Indonesia.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Apa yang hendak dikatakan ... ini?
  rationale: Konstruksi optatif dengan ἄν menyampaikan dugaan yang tentatif dan bernada meremehkan; “hendak dikatakan” merupakan ungkapan Indonesia yang alami.
- source_word: Ξένων δαιμονίων
  choice: ilah-ilah asing
  rationale: Dalam kerangka keagamaan para penutur Atena, δαιμόνια berarti makhluk-makhluk ilahi yang tidak dikenal, bukan dengan sendirinya roh jahat menurut pengertian Kristen kemudian.
- source_word: καταγγελεὺς
  choice: pemberita
  rationale: Nomina ini menyebut orang yang mengumumkan sesuatu secara terbuka. “Pemberita” jelas, ringkas, dan sesuai dengan ragam Alkitab modern.
- source_word: εὐηγγελίζετο
  choice: memberitakan kabar baik
  rationale: Terjemahan eksplisit ini mempertahankan makna khusus kata kerja tersebut, yakni menyampaikan kabar baik, bukan sekadar berbicara atau berkhotbah.
- source_word: ἀνάστασιν
  choice: kebangkitan
  rationale: Narator menjelaskan isi pemberitaan Paulus. Bentuk nomina biasa mempertahankan makna teks tanpa memutuskan apakah para pendengar keliru menganggapnya nama suatu ilah.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: filsuf Epikuros dan Stoa
  rationale: Ini adalah sebutan Indonesia yang ringkas dan lazim bagi para filsuf dari kedua aliran tersebut.
theological_decisions:
- issue: Makna δαιμόνια dalam ucapan orang-orang berpandangan politeistis
  choice: ilah-ilah asing
  alternative: roh-roh asing; dewa-dewa asing
  rationale: Pilihan ini menyajikan tuduhan menurut kerangka para penutur dan tidak memasukkan pengertian Kristen kemudian bahwa semua δαιμόνια di sini pasti roh jahat.
- issue: Apakah ἀνάστασις harus diperlakukan sebagai nama diri yang dipersonifikasikan
  choice: kebangkitan
  alternative: Kebangkitan sebagai nama ilah yang disangka oleh para pendengar
  rationale: Teks narator menyebut isi kabar baik yang disampaikan Paulus. Kemungkinan salah dengar atau salah paham para pendengar tetap dicatat tanpa dijadikan kepastian dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur reaksi kelompok dipertahankan, sementara pengulangan subjek dijelaskan secara wajar dengan “Paulus” dan “Mereka berkata demikian” agar hubungan sebab dalam kalimat Yunani jelas. Istilah sekolah filsafat memakai bentuk Indonesia “Epikuros dan Stoa”.
