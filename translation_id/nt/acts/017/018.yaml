  to: Beberapa filsuf dari aliran Epikuros dan Stoa juga berdiskusi dengannya.[a] Sebagian dari mereka berkata, “Apa yang hendak dikatakan si pemungut serpihan gagasan ini?”[b] Namun, yang lain berkata, “Ia tampaknya seorang pemberita ilah-ilah asing.”[c][d] Mereka berkata demikian karena Paulus memberitakan kabar baik tentang Yesus dan kebangkitan.
