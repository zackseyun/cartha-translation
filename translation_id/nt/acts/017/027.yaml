id: ACT.17.27
reference: Acts 17:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: id
  text: supaya mereka mencari Allah, kalau-kalau mereka dapat meraba-raba mencari-Nya dan menemukan-Nya—walaupun sesungguhnya Dia tidak jauh dari kita masing-masing.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: supaya mereka mencari
  rationale: Infinitif ini bergantung pada klausa sebelumnya dan menyatakan maksud atau hasil; klausa dengan “supaya” menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Artikel Yunani tidak perlu diterjemahkan tersendiri; “Allah” merupakan bentuk baku dan alami dalam konteks ini.
- source_word: εἰ ἄρα γε
  choice: kalau-kalau
  rationale: Ungkapan ini mempertahankan unsur kemungkinan dan ketidakpastian dalam upaya manusia mencari Allah.
- source_word: ψηλαφήσειαν
  choice: dapat meraba-raba mencari
  rationale: Kata kerja ini menggambarkan pencarian melalui rabaan, seolah-olah dalam kegelapan atau dengan persepsi terbatas. “Meraba-raba mencari” mempertahankan gambaran itu dengan jelas.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti ini merujuk kepada Allah; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk kata ganti yang mengacu kepada-Nya.
- source_word: καὶ εὕροιεν
  choice: dan menemukan-Nya
  rationale: Bentuk ini sejajar dengan kata kerja optatif sebelumnya; daya modalnya sudah tercakup oleh “kalau-kalau” dan “dapat”.
- source_word: καί γε
  choice: walaupun sesungguhnya
  rationale: 'Dalam konteks ini frasa tersebut memberi penjelasan konsesif: pencarian manusia tidak pasti, tetapi Allah benar-benar dekat.'
- source_word: οὐ μακρὰν
  choice: tidak jauh
  rationale: Padanan langsung, alami, dan mempertahankan gambaran spasial sumber.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: dari kita masing-masing
  rationale: Ungkapan ini mempertahankan penekanan distributif bahwa kedekatan Allah berlaku bagi setiap orang di antara “kita”.
- source_word: ὑπάρχοντα
  choice: Dia ... tidak jauh
  rationale: Partisip ini menyatakan kenyataan keberadaan atau keadaan Allah yang dekat; dalam bahasa Indonesia paling alami diungkapkan sebagai klausa berpredikat.
theological_decisions:
- issue: Keterjangkauan Allah dan pencarian manusia
  choice: Mempertahankan ketidakpastian pencarian manusia melalui “kalau-kalau” dan metafora “meraba-raba mencari”, sekaligus menegaskan kedekatan nyata Allah.
  alternative: Menghaluskan metafora menjadi sekadar “berusaha mencari-Nya”, atau menerjemahkannya secara lebih harfiah sebagai “menjamah-Nya”.
  rationale: Teks Yunani memadukan keterbatasan persepsi manusia dengan kenyataan bahwa Allah tidak jauh. Terjemahan tidak boleh menjadikan pencarian itu pasti berhasil ataupun sama sekali sia-sia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “meraba-raba mencari” sengaja dipakai untuk mempertahankan metafora sumber tanpa terdengar terlalu teknis; tanda pisah menonjolkan kontras antara pencarian manusia yang tidak pasti dan kedekatan Allah yang nyata.
