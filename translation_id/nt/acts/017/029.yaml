id: ACT.17.29
reference: Acts 17:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: id
  text: Karena itu, karena kita adalah keturunan Allah, kita tidak sepatutnya menganggap bahwa Yang Ilahi[a] serupa dengan emas, perak, atau batu—dengan benda pahatan[b] yang dihasilkan oleh keterampilan dan pikiran manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Keilahian” atau “hakikat ilahi”. Ungkapan Yunani τὸ θεῖον berarti apa yang ilahi; dalam argumen Paulus di sini, ungkapan ini merujuk kepada Allah yang benar.
    reason: lexical_alternative
  - marker: b
    text: Atau “benda ukiran” atau “gambar pahatan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: keturunan
  rationale: Dalam konteks ini menunjuk pada asal-usul atau hubungan manusia dengan Allah, tanpa makna etnis yang dapat ditimbulkan oleh pilihan seperti “bangsa” atau “ras”.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik Paulus dari pernyataan sebelumnya.
- source_word: ὑπάρχοντες τοῦ θεοῦ
  choice: sebagai keturunan Allah
  rationale: Partisipel ini menyatakan dasar bagi kesimpulan Paulus; bentuk “sebagai” menyampaikannya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: kita tidak sepatutnya menganggap
  rationale: Menyatakan kewajiban moral atau ketidaklayakan suatu anggapan, bukan sekadar larangan atau ketidakmungkinan.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: emas, perak, atau batu
  rationale: Mempertahankan ketiga bahan yang disebut dalam teks Yunani dalam susunan alami bahasa Indonesia.
- source_word: χαράγματι
  choice: pahatan
  rationale: Menunjuk pada benda atau gambar yang dibuat dengan mengukir atau memahat; “pahatan” ringkas dan sesuai dengan konteks berhala buatan manusia.
- source_word: τέχνης
  choice: keterampilan
  rationale: Menyampaikan unsur keahlian seni atau kerajinan manusia yang menghasilkan pahatan tersebut.
- source_word: ἐνθυμήσεως
  choice: gagasan
  rationale: Menyampaikan rancangan atau konsepsi dalam pikiran manusia yang mendasari pembuatan benda itu, tanpa membatasi maknanya pada khayalan belaka.
- source_word: ἀνθρώπου
  choice: manusia
  rationale: Bentuk tunggal Yunani dipakai secara generik; “manusia” mempertahankan cakupan umum tersebut.
- source_word: τὸ θεῖον
  choice: Yang Ilahi
  rationale: Mempertahankan keluasan ungkapan substantival Yunani untuk apa yang ilahi, sekaligus tetap dapat dipahami sebagai rujukan kepada Allah yang benar dalam alur argumen Paulus.
theological_decisions:
- issue: Penerjemahan τὸ θεῖον dalam pidato monoteistis dengan corak filosofis
  choice: Yang Ilahi
  alternative: Keilahian; Hakikat Ilahi; Allah
  rationale: “Yang Ilahi” mempertahankan corak luas dan filosofis ungkapan Yunani tanpa menjadikannya sekadar sifat abstrak atau langsung menggantinya dengan θεός. Dalam konteks keseluruhan, ungkapan itu merujuk kepada Allah yang benar, tetapi bentuk asli tetap dibiarkan memiliki nuansa retorisnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur inferensial ayat dipertahankan, sementara frasa partisipial dan deretan bahan disusun agar mudah dipahami pembaca umum. Istilah “Yang Ilahi” menjaga corak filosofis pidato Paulus tanpa memakai istilah teologis teknis atau arkais.
