    issue: Hubungan kausal partisipel kurang eksplisit
    rationale: ὑπάρχοντες dalam konteks ini mendasari kesimpulan (“karena kita adalah keturunan Allah”). “Sebagai keturunan Allah” dapat dipahami secara deskriptif, tetapi kurang jelas menandai dasar inferensialnya.
  - severity: medium
    issue: Aposisi “yaitu pahatan” berpotensi melekat hanya pada “batu”
    rationale: Susunan “emas, perak, atau batu, yaitu pahatan” dapat dibaca bahwa hanya “batu” yang dijelaskan sebagai pahatan. Dalam Yunani, χαράγματι disandingkan sebagai benda buatan manusia dalam perbandingan dengan seluruh daftar bahan; tanda pisah dan “benda pahatan” lebih jelas.
