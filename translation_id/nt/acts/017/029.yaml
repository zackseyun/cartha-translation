  to: Karena itu, karena kita adalah keturunan Allah, kita tidak sepatutnya menganggap bahwa Yang Ilahi[a] serupa dengan emas, perak, atau batu—dengan benda pahatan[b] yang dihasilkan oleh keterampilan dan pikiran manusia.
