  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: id
  text: Ia juga tidak dilayani oleh tangan manusia[a], seolah-olah Ia memerlukan sesuatu, sebab Ia sendiri yang memberikan kepada semua kehidupan, napas, dan segala sesuatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima pelayanan keagamaan dari tangan manusia.” Kata kerja Yunani ini dapat merujuk pada pelayanan atau pengurusan dalam konteks keagamaan; maksudnya di sini ialah bahwa Allah tidak bergantung pada pelayanan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Ia juga tidak
  rationale: Melanjutkan uraian negatif dari ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: oleh tangan manusia
  rationale: Mempertahankan ungkapan konkret Yunani dan nuansa pelayanan keagamaan yang dilakukan manusia.
- source_word: θεραπεύεται
  choice: dilayani
  rationale: Dalam konteks kebutuhan dan tangan manusia, verba ini menunjuk pada menerima pelayanan atau perawatan, termasuk pelayanan keagamaan, bukan penyembuhan.
- source_word: προσδεόμενός τινος
  choice: seolah-olah Ia memerlukan sesuatu
  rationale: 'Mengungkapkan daya retoris partisipel tersebut: Allah tidak menerima pelayanan seperti makhluk yang berkekurangan.'
- source_word: αὐτὸς διδοὺς
  choice: Ia sendiri yang memberikan
  rationale: Mempertahankan penekanan pada αὐτός dan menyampaikan hubungan penjelas partisipel secara wajar.
- source_word: πᾶσι
  choice: kepada semua makhluk
  rationale: Konteks pemberian kehidupan dan napas menunjukkan para penerima yang hidup; 'makhluk' menjaga cakupan luas tanpa membatasinya hanya kepada manusia.
- source_word: ζωὴν καὶ πνοὴν
  choice: kehidupan, napas
  rationale: Padanan langsung dan alami yang menekankan ketergantungan makhluk kepada Allah.
- source_word: καὶ τὰ πάντα
  choice: dan segala sesuatu
  rationale: Mempertahankan daya cakup total frasa Yunani dalam ragam Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Apakah θεραπεύεται perlu diterjemahkan secara eksplisit sebagai penyembahan atau secara lebih luas sebagai pelayanan
  choice: dilayani
  alternative: disembah; menerima pelayanan keagamaan
  rationale: '''Dilayani'' mencakup pelayanan dalam konteks ibadah tanpa mempersempit maknanya menjadi penyembahan saja. Pilihan ini menjaga argumen bahwa Allah tidak bergantung pada pelayanan manusia.'
- issue: Cakupan πᾶσι
  choice: kepada semua makhluk
  alternative: kepada semua orang; kepada semua
  rationale: Konteks kosmologis tentang kehidupan dan napas mendukung cakupan makhluk hidup secara luas. Pilihan ini menghindari pembatasan yang tidak dinyatakan kepada manusia saja, sekaligus lebih jelas daripada 'kepada semua' dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Kapitalisasi kata ganti untuk Allah mengikuti kelaziman luas dalam penerbitan Alkitab Indonesia. Tanda koma pada rangkaian 'kehidupan, napas, dan segala sesuatu' memperjelas tiga unsur yang diberikan.
